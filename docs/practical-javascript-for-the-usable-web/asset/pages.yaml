  md: '# Data and Decisions


    Data and decision-making are fundamental to every ''intelligent'' program. We''ll
    begin this chapter by looking at how JavaScript understands, or represents, data.
    This is important because JavaScript works with a number of data types, and manipulates
    data according to its data type. You can generate unexpected results by running
    manipulations on data of a different type to the one you were intending to work
    with, so we''ll look at some of the more common data type problems, and see how
    to convert one type of data to another.


    We''ll also be working with conditional statements and loops: two of the most
    valuable tools for decision-making. In order to make decisions in a computer language
    we need to let the program come in. What should happen in response to certain
    conditions, which is where conditional statements come in. Loops, on the other
    hand, simply allow you to repeat an action until a specified circumstance is met.
    For example, you might want to loop through each input box in a form and check
    the information it contains is valid.


    We''ll be covering a lot:


    +   - Classifying and manipulating information in JavaScript: data types and data
    operators


    +   - Variables


    +   - Converting data types


    +   - Introducing data objects: String, Date and Math objects


    +   - Arrays: storing ordered sets of data like the items in a shopping basket


    +   - Decision-making with conditional statements, loops, and data evaluation'
  merge: -1
