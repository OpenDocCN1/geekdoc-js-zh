  md: "```\naddOption(optionsArray, 1, \"Mrs\", \"missus\");\naddOption(optionsArray,\
    \ 2, \"Miss\", \"miss\");\naddOption(optionsArray, 3, \"Ms\", \"mz\");\n```\n\n\
    We use the addOption() function to add three new options to the array at index\
    \ positions 1, 2, and 3. Note that, if the options previously listed female options,\
    \ the Ms Option would be included when we start to add the three options. However,\
    \ it is automatically deleted when we try to add an option with the same value,\
    \ so we don't end up with two Ms options.\n\nNext we have to deal with the question\
    \ of which option should be selected.\n\n```\nif (selValue=\"miss\" || selValue=\"\
    sir\"\n{\n    form.mySelectControl.selectedIndex=3;\n}\nelse{\n    form.mySelectControl.selectedIndex=selIndex;\n\
    }\n```\n\nIf the option that previously selected was Mr or Sir, we select the\
    \ option to be Ms. However, if it was another option (for example, Dr, or Mrs,\
    \ Miss, or Ms if the list contained female options) we select the index to the\
    \ previously selected index that no change occurs.\n\nThe Male radio button has\
    \ its onclick handler set to male_options_onclick() function, which is very similar\
    \ to the female_options_onclick() function. The only difference is in the options\
    \ are set.\n\n# Creating Your Own Controls with DHTML\n\nThe plain form controls\
    \ are OK, but sometimes we need something more sophisticated. Frequently, we're\
    \ not limited to plain form controls if we use HTML inventively.\n\nThere are\
    \ a obstacles we need to overcome when creating DHTML controls. The first problem\
    \ we may face is how to pass values from one of our HTML controls to the server\
    \ when the form is submitted. One way to overcome this is to use hidden textboxes.\
    \ The DHTML control sets the values of these in the background, and the user never\
    \ sees them, just our DHTML control. When the form is submitted to the server,\
    \ the information in the hidden textboxes is posted.\n\nCreating DHTML controls\
    \ can also be quite consuming, so it makes sense to make their reuse as easy as\
    \ possible. We can do this by using js files to store the necessary script and\
    \ .css files to store any necessary stylesheets. Ideally, we should need just\
    \ a few lines of HTML to make our control work – the rest should be in separate\
    \ files. As well as making it easy to add the control to new pages, if any bugs\
    \ are spotted we need to fix one or two lines, rather than across every web site\
    \ we've created that the functionality. It's also vital if a control is to be\
    \ reused that we have good documentation on how to use the control and how to\
    \ change it to our particular needs.\n\nThere's a huge range of controls we could\
    \ create, the limits being only our imagination and, perhaps, the abilities of\
    \ the user's machine – could slow things down. However, here we'll be looking\
    \ at just one control in particular: a pop-up calendar control:"
