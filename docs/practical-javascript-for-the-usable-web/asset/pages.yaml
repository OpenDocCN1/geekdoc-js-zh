  md: "# Chapter 7\n\nA collection of all the `<b>` elements in the document is created,\
    \ and stored in the `colBolds` variable. The `for` loop iterates through each\
    \ item in the collection and sets its `color` style to be red. You should already\
    \ be familiar with setting styles in this way from Chapter 6, since this is how\
    \ IE4+ browsers change properties. NN6 browsers now support this technique of\
    \ manipulating style properties, because this approach has been adopted by the\
    \ DOM Level 2 CSS module.\n\nFor mass extraction, the `getElementsByTagName()`\
    \ method is very powerful. It's not so useful if you want to access a single element\
    \ within a document. In the IE5 browser, Microsoft introduced the `getElementById()`\
    \ method of the document to perform this task. If you supply the `id` of an element\
    \ as a parameter to the method, it will return a reference directly to that element.\
    \ This method is part of the DOM Level 1 specification, and so available in Netscape\
    \ 6.0+ browsers.\n\nThe getById method was defined initially by the HTMLDocument\
    \ interface in DOM Level 1 and is now defined in the Document interface in DOM\
    \ Level 2; it's automatically available to HTMLDocument objects in DOM level 2\
    \ as the extended from the Document interface.\n\nIf you manage a document containing\
