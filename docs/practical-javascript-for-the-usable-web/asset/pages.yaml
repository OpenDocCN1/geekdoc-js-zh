    \ method of our Validate class based on the validDataType parameter that we extracted\
    \ in the isElementValid() method above. This parameter contains the data type\
    \ defined in the element's name. The methods called are those we earlier in the\
    \ chapter to validate various types of data. If we wanted to extend our automatic\
    \ checking, then we need only create the validation method that will check the\
    \ additional data type and add a relevant data type name to\n\n```\nValidate.prototype.isElementDataValid\
    \ = function(elementValue, validDataType) {\n  var isValid = false;\n\n  switch\
    \ (validDataType) {\n    case \"_alphanumeric\":\n      isValid = this.isOnlyAlphaNumeric(elementValue);\n\
    \      break;\n\n    case \"_alphanumericnospace\":\n      isValid = this.isOnlyAlphaNumericNoSpace\
    \ (elementValue);\n      break;\n\n    case \"_alphabetic\":\n      isValid =\
    \ this.isOnlyAlphabetic(elementValue);\n      break;\n\n    case \"_numeric\"\
    :\n      isValid = this.isOnlyNumeric(elementValue);\n      break;\n\n    case\
    \ \"_integer\":\n      isValid = this.isValidInteger(elementValue);\n      break;\n\
    \n    case \"_floatingpoint\":\n      isValid = this.isValidFloatingPoint(elementValue);\n\
