  md: '# Summary


    In this chapter we created the Validate class. This class wraps up various data
    validation methods and can be easily used again and again in our web pages. It
    may not contain all the data validation methods you''ll need, but that''s not
    a problem as you can easily extend the class and add new ones.


    We then extended the class for our e-commerce image viewer application to allow
    it to automatically check some form elements. By using a naming convention, we
    could specify whether an input element should have been filled or a radio button
    from a group should have been selected, and also specify what type of data an
    input element should contain to be valid. We wrote a function that, when called,
    goes through all the elements in a form - any invalid ones have the error <div>
    next to them displayed. That completes the e-commerce image viewer application.'
