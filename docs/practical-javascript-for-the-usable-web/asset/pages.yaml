    \ stylesheet. This is one of the main advantages of separating the appearance\
    \ from the structure, and, of course, of CSS stylesheets.\n\n# Using CSS to Position\
    \ Elements\n\nThe CSS provided with a 4x level browser is an attempt to implement\
    \ some features of CSS1 together with positioning functionality. Positioning can\
    \ be used to place visual element at a precise position on the web page, or it\
    \ can be used to implement animation (by changing the position via a script).\
    \ Although positioning is a standard feature of CSS2, this later version of CSS\
    \ didn't come into existence until the 4x series of browsers.\n\nLet's look at\
    \ an example. We use CSS inside an HTML page to set the exact pixel positioning\
    \ of two `<div>` elements, using two ids in the head of the document: magicRegion,\
