  md: "# Chapter 10\n\nAs in the Positive Numbers Only method, we test our string\
    \ against the regular expression, and return the variable isValid, which contains\
    \ the result of this test.\n\nNote that we could have written the regular expression\
    \ as `/^(\\+|-)??\\d+$/. However, this would not match an empty string – this\
    \ is something we want to match, so that this method can be used to check for\
    \ non-compulsory data.\n\n# Floating Point Numbers\n\nNext we check for positive\
    \ or negative floating numbers, numbers that may contain a decimal point.\n\n\
    ```\nValidate.prototype.isValidFloatingPoint = function(string) {\n  var validFormatRegExp\
    \ = /^(\\+|-)?\\d*(\\.\\d+)?$/;\n  var isValid = validFormatRegExp.test(string);\n\
    \n  return isValid;\n}\n```\n\nThis time the regular expression specifies that\
    \ digits, minus signs and decimal points are allowed:\n\n/^(\\+|-)?\\d*(\\.\\\
    d+)?$/\n\nThe ^ and $ characters specify that our pattern must match the whole\
    \ string we test it.\n\nThe pattern `(\\+|-)\\d` specifies that the pattern can\
    \ start with a + or a -, and if it does, it must be followed by a digit – this\
    \ is to prevent + alone being valid. It does not mean that +.5 is not valid, thought\
    \ +0.5 will be.\n\nNext we specify that zero or more digits can follow using the\
    \ `\\d*`. Finally we have `(\\.\\d+)?`, which optionally matches a decimal point\
    \ and any numbers following it.\n\nNote that, with all the methods we have seen\
    \ so far, an empty string is valid. The methods do not make the entering of data\
    \ compulsory, but rather confirm that data if entered is of a valid type.\n\n\
    # Validating the Age of a Person\n\nOur next method checks that the specified\
    \ value is logical for the type of data supplied, in this case the age of a person.\n\
    \n```\nValidate.prototype.isValidAge = function(age) {\n  var isValid = false;\n\
    \  if (this.isInteger(age)) {\n    isValid = (parseInt(age) >= 0 && parseInt(age)\
