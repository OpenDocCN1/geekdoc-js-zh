  md: '# Chapter 4


    # Load and Unload Events


    The load event fires when a window or frame has completely loaded a page. It''s
    a good place to put initialization code – that is code we need to run before the
    user plays the page, but after the page has loaded. We will see in the next chapter
    that, when used with multiple frame pages, we need to be careful about the order
    in which the load events fire.


    The unload event fires when the page is unloaded, either because the user has
    navigated to a new page or has closed the browser altogether. Note that NN3 and
    NN4 will not display alerts if they are in the unload event handler.


    The easiest way to add event handlers for this events is by adding attributes
    to the <body> element, as shown below:


    ```

    <body onload="callSomeFunction() onload="callSomeOtherFunction()">

    ```


    The example page, AdvertChangeExample.htm, uses the window''s load event to initialize
    a timer that is used to change the loaded banner every few seconds:


    ```

    <html>

    <head>

    <script language="JavaScript">

    var timerID = 0;

    var advertIndex = 0;

    var advertImgSrc = new Array("firstAd.jpg","secondAd.jpg", "ThirdAd.jpg","FourthAd.jpg");


    function swapAdImg() {

    {

    advertIndex++;

    if (advertIndex > advertImgSrc.length -1) {

    {

    advertIndex = 0;

    }


    document.images[''imgMainAdvert''].src = advertImgSrc[advertIndex];

    }


    function window_onload() {

    {

    timerID = window.setInterval("swapAdImg()", 4000);

    }

    }

    </script>

    </head>

    <body onload="window_onload">

    <img name="imgMainAdvert" src="firstAd.jpg">

    </body>

    </html>

    ```


    The <body> element contains the onload event handler, which calls the function
    window_onload() when the load event fires. The window_onload() function is defined
    in the script block at the head of the page:'
