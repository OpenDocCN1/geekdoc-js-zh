  md: "# Advanced Form Techniques\n\nWe'll be using the regular expression object\
    \ throughout the next two chapters, but let's look at two methods here: the test()\
    \ method of the regular expression object, and the match() method of the String\
    \ object.\n\nThe test() method of the regular expression object to see if a string,\
    \ passed as a parameter, contains a matching pattern. If it does, it returns true.\
    \ For example:\n\n```\n<html>\n<body>\n<script>\n  var myRegularExpression = /bWil[a-z]+[nm]\\\
    b;\n  if (myRegularExpression.test(\"Bob Wilson\")) {\n    alert(\"A match was\
    \ made\");\n  } else {\n    alert(\"No match was found\");\n  }\n</script>\n</body>\n\
    </html>\n```\n\nIn this case, the string \"Mr Bob Wilson\" will test true for\
    \ the regular expression \\bWil[a-z]+[nm]\\b. In this case, it's Wilson that actually\
    \ matches our regular expression.\n\nThe match() method of the String object will\
    \ search a string and find each character pattern that matches the regular expression,\
    \ returning the results in an array. For example:\n\n```\n<html>\n<body>\n<script>\n\
    \  var names = \"Bob Wilson, Guy Wilton, Susan Williams, Marie Williamson\";\n\
    \  var matchesMade = names.match(/\\bWil[a-z]+[nm]\\b/g);\n\n  if (matchesMade)\
    \ {\n    for (var indexCounter = 0; indexCounter < matchesMade.length; indexCounter++)\
    \ {\n      document.write(matchesMade[indexCounter] + \"<BR>\");\n    }\n  }\n\
    </script>\n</body>\n</html>\n```\n\nThe following will be displayed in the page:\n\
    \nWilson\nWilton\nWilliamson"
