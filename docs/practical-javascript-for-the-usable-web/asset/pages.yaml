    The typeof() operator returns the type of data that has been passed to it, so
    we can use that to see what data types the JavaScript interpreter is working with:


    ```

    <html>

    <body>

    <script language="JavaScript">

    var userEnteredNumber = prompt("Please enter a number*",");

    document.write(typeof(userEnteredNumber));

