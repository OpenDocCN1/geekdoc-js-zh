    \ node, and triggers the registered event handlers. When functions are triggered,\
    \ the event created will possess a property that JavaScript can query to identify\
    \ the source element (the thumbnail image in this case) over which the event occurred.\n\
    \nLet's have a look at function document_onmouseover, registered with the mouseover\
    \ event. This function is used to dynamically change the border color of the image\
    \ over which the mouse is passed to browser. The function can be defined as:\n\
