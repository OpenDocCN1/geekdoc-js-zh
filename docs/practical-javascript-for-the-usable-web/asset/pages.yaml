  md: "In the second part of this section we'll then turn our attention to how we\
    \ can create our own JavaScript objects with their own methods and properties,\
    \ just as JavaScript built-in objects like the Math and String objects. We'll\
    \ see that this can be a powerful way of programming, and make certain tasks easier\
    \ and allow us to reuse code and save some time.\n\nFirst, let's look at code\
    \ modules.\n\n# # Creating Code Modules with .js Files\n\nUsually we include our\
    \ JavaScript code inside the same page that is using it by using <script> tags.\
    \ However, we can separate the presentation and content part of the page, the\
    \ HTML, from the logic, our JavaScript, by putting the JavaScript in a separate\
    \ file. Doing this has the following advantages:\n\n+   - It's easier to see what\
    \ is code and what is HTML\n- It's easier for one person to work on the code in\
    \ the separate file without needing to touch the page\n- Useful code can be placed\
    \ inside a separate file and reused elsewhere\n- Functions needed throughout our\
    \ website can be placed in one separate file, which prevents duplication, and\
    \ means that changes only be made in one place\n\nThe actual file containing our\
    \ code is simply a plain text file, normally saved with the .js extension. The\
    \ extension just tells the computer's operating system, and anyone looking at\
    \ the file, what is contained inside it. It's not compulsory to use the .js extension\
    \ but that's the norm, for consistency we should use it. Let's create a .js file,\
    \ using any text editor or page editor, just as we have been doing for HTML files,\
    \ and put it in the fixDecimalPlaces() function that we looked earlier in the\
    \ chapter:\n\n```\nfunction fixDecimalPlaces(fixNumber, decimalPlaces)\n{\n  var\
    \ digitSaver = Math.pow(10,decimalPlaces);\n\nfixNumber = new String (Math.round(fixNumber\
    \ * (digitSaver))/digitSaver);\n\nvar zerosRequired;\n  var decimalPointLocation\
    \ = fixNumber.lastIndexOf(\".\");\n\nif (decimalPointLocation == -1)\n{\n  fixNumber\
    \ = fixNumber + \".\";\n  zerosRequired = decimalPlaces;\n}\nelelse\n{\n  zerosRequired\
    \ = decimalPlaces\n  (fixNumber.length - decimalPointLocation - 1);\n```"
