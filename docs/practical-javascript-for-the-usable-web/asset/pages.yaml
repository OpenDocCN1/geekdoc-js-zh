  md: '# Reacting to Events


    This section will look at how we can react to the user''s actions, in terms of
    key presses, mouse clicks, and mouse movements. The generic term for these types
    of actions is **events**.


    There are significant differences between browsers in how they capture events,
    so in this section only IE3 and NN3+ compatible code will be. Chapters 6 and 7
    will cover the specifics of IE4, NN4, and later browsers. Having said that, the
    simple event handling covered in this chapter is still very useful, even in modern
    browsers, and is probably the main technique for capturing events that you will
    use, unless you have more advanced needs. It is also an advantage if we can write
    code that does not exclude browsers – only resort to code that limits the browser
    compatibility where it''s really necessary.


    Just to clarify the terminology used, **events** occur when the user is interacting
    with the browser, for example clicking a button causes a click event. An **event
    handler** is a way of capturing an event and making specific code execute. The
    event handler''s name is the same as the event, except that we add on in front,
    for example onclick.


    There are two main cross-browser techniques for specifying an event handler:


    +   - Add the event handler as an attribute of the element we want to capture.

    - Use the event handler properties of the object corresponding to the event we
    want to capture.


    For example, if we have an <a> element in the page and we wanted to capture its
    click event, we could add the **onclick** event handler as an attribute:


    ```

    <a href="somepage.htm" onclick="myEventHandlerFunction()">Link</a>

    ```


    Alternatively, we could use the object''s **onclick** property to specify a function
    to be called when the click event occurs. (Note the use of the **links** array
    to retrieve a object - we assume that the object is the first in the page).


    ```

    <script>

    document.links[0].onclick = myEventHandlerFunction;

    </script>

    ```


    Note that this code works only on NN3+ and IE4+ browsers.


    It''s important that this code should not execute before the <a> element has been
    loaded into the page or before the function **myEventHandlerFunction()** used
    for the event handler is created. The following page, *EventsNoError.html*, works:


    ```

    <html>

    <head>

    <script language="JavaScript">

    function myEventHandlerFunction()

    (

    // some code

    )

    </script>

    ```'
  merge: -1
  pgno: 123
