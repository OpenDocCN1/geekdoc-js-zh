    # The Math Object


    The Math object provides us lots of mathematical functionality, like finding the
    square of a number, or producing a random number. The Math object is different
    from the Date and String in two ways:


    +   - You can''t create a Math object explicitly, you just go ahead and use it

    - The Math object doesn''t store data, unlike the Date and String object


    You call the methods of the Math object using the format: Math.methodOfMathClass(aNumber):


    ```

    alert("The value of pi is " + Math.PI);

    ```


    We''ll look at a few of commonly used methods next (which you can find a complete
    reference by running a search at http://developer.netscape.com). We''ll look at
    the methods for rounding numbers and generating random numbers.


    # Rounding numbers


    We saw earlier that the parseInt() function will make a fractional number whole
    by removing everything after the decimal point (so 24.999 becomes 24). Pretty
    often you''ll want more mathematically accurate calculations, if you''re working
    with financial calculations for example, and for these you can use one of the
    Math object''s three rounding functions: round(), ceil(), and floor(). This is
    how they work:


    ```

    round(): rounds up when the decimal is .5 or greater

    ceil(): (as in ceiling), always rounds up, so 23.75 becomes 24, as does 23.25

    floor(): always rounds down, so 23.75 becomes 23, as does 23.25

    ```


    Here they are work in a simple example:


    ```

    <html>

    <body>

    <script language="JavaScript">

    var numberToRound = prompt("Please enter a number,\*");

    document.write("round=" + " " + Math.round(numberToRound));

    document.write("<br>");

    document.write("floor=" + " " + Math.floor(numberToRound));

    document.write("<br>");

    document.write("ceil=" + " " + Math.ceil(numberToRound));

    </script>

    </body>

    </html>

    ```


