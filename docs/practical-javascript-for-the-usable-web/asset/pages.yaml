    \nFor example, January 1st, 2002, is a Tuesday and the first two cells for Sunday\
    \ and Monday should be blank. Also, January has 31 days, meaning that January\
    \ 31st is on a Thursday, so the last two cells for Friday and Saturday should\
    \ also be blank (as well as the next row of cells since these are not needed for\
    \ this month). From point of view of the code, the number of first day of the\
    \ week is 2 (since this starts at 0) and the number of days in the month is 31,\
    \ so each <td> with elementIndex<=2 or elementIndex > 31 should be blank.\n\n\
