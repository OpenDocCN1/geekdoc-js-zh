    \ images. What remains now is to add the JavaScript code that will allow the user\
    \ to click on a thumbnail causing the fail version of image 3 to be displayed\
    \ in Area 3.\n\n# Event Binding for the Thumbnail Pages\n\nThe thumbnail pages\
    \ require three events to be handled. When the mouse moves over and off an image,\
