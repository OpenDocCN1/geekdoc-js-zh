- img_proc: true
  md: '# Overview of the DOM


    The goal of the DOM specification is to define a programmatic interface for XML
    and HTML documents. With the DOM, programmers can navigate the document structures,
    and add, modify, or delete elements and content.


    The DOM is separated into four levels - 0, 1, 2, and 3. Levels 1, 2, and 3, which
    are under the realm of the W3C, can be found at http://www.w3c.org/domtr.


    Functionality equivalent to that exposed in Netscape Navigator 3.0 and Microsoft
    Internet Explorer 3.0, as the browser objects exposed in Chapter 4, is referred
    to informally as **DOM Level 0**. However, there is no W3C specification for this
    level. *DOM Level 0* is sometimes referred to as the HTML DOM, which forms part
    of the *DOM Level 1* specification.


    **The DOM Level 1** is a recommendation of the W3C that can be separated into
    two parts: DOM Core objects and DOM HTML objects.


    +   - The **DOM Core** provides a set of fundamental objects that can represent
    any structured document. The methods and properties of the DOM Core objects represent
    the functionality used for XML documents, and also serve as the basis for DOM
    HTML objects.

    - The **DOM HTML** objects build upon and extend the DOM core objects, providing
    additional methods and properties that produce a more convenient view of an HTML
    document.


    Any compliant implementation of the DOM HTML objects should implement all of the
    fundamental DOM Core objects as well as the HTML objects.


    The DOM Level 1 specification has been intentionally limited to those methods
    needed to represent and manipulate document structure and content. The **DOM Level
    2** specification, another recommendation of the W3C, extends and builds on DOM
    Level 1. As of DOM Level 2, the DOM has been modularized into eight different
    modules: Core, HTML, Views, Stylesheets, CSS, Events, Traversal, and Range. Prior
    to this DOM Level 1, the Core and HTML interfaces existed in one single specification.


    The diagram below shows how these modules relate to each other. Modules in DOM
    level 1 are located within the gray box. Note that XML 1.0 is not actually a module,
    but is included in the diagram because support for XML 1.0 documents is provided
    by parts of the Core module. Arrows indicate modules that extend other modules.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# The DOM: DHTML for the Latest Browsers


    ![](img/e58f0457390096aadd869f36b1b05e3c_208_0.png)


    The Traversal and Range modules add enhancements to the ability of traversing
    the document structure by DOM Level 1. The StyleSheets, CSS, and Views modules
    add enhanced support for altering document presentation. The last module, Events,
    adds support for user interface events, and document manipulation events, such
    as moving an element from one part of the document to another part.


    DOM Level 3 is a work in progress at the time of writing. DOM Level 2 include
    to further support for event handling, loading and saving external XML-based documents,
    and a path-based mechanism for closely finding nodes within the document structure.
    This chapter will not discuss DOM Level 3 further, since its support in browsers
    is virtually non-existent at the time of writing. You should visit the W3C web
    site http://www.w3.org/DOM/ for more information and the full specification on
    DOM.


    So much support for the DOM is there present? The Level 1 DOM is supported to
    some extent by NN6.0+ and IE5.0+ browsers. Support is greatest in NN6.0+; IE5.x
    browsers partially implement Level 1 DOM.


    If you are trying to use DOM, NN6 or IE5 are probably the best to experiment with.
    Version 4 and earlier browsers are not suitable with them. Note also that the
    Windows and Macintosh versions of Internet Explorer differ considerably, so you
    cannot be certain that scripts developed on one platform will work properly on
    the other.


    To discuss the whole of the DOM in detail would require a whole book in itself.
    This chapter will concentrate on the DOM Level 1 functionality, which is primarily
    concerned with traversing, accessing parts of, and manipulating the document structure.
    Later in the chapter we''ll look at a few very useful aspects of DOM Level 2 for
    which support exists. Before this though, let''s look at how a document is structured
    and represented by the DOM.


    # DOM Structure


    As its name suggests, the DOM is a mechanism for closely modeling the structure
    of the document using objects. All DOM documents, such as XML and HTML documents,
    have a defined structure that is very much like a tree structure. This document
    consists of nodes that are organized in a tree-like hierarchy. Each node in the
    tree represents a different type of content or a different structural element.


    195'
