  md: "# Passing Information Between Web Pages and Data Storage\n\n```\nvar cookieValue\
    \ = readUnescapapedCookie(cookieName);\n```\n\nWe then check that a cookie was\
    \ found. If it was, then we need to ensure any multi-values within that cookie\
    \ are not overwritten. If no cookie was found, then we can simply create the new\
    \ cookie, and in this case we set the string to an empty string. Let's look at\
    \ the code that deals with the situation where the cookie exists:\n\n```\nvar\
    \ stripAttributeRegExp = new RegExp(\"(^|&)\" + multiName + \"=[^&]*\");\ncookieValue\
    \ = cookieValue.replace(stripAttributeRegExp, \"$1\");\nif (cookieValue.length\
    \ != 0) {\n  cookieValue += \"&\";\n}\n```\n\nThe first line defines a regular\
    \ expression that matches characters at the beginning of the string, and an ampersand,\
    \ followed by the name of our multi-value, followed by equals and one or more\
    \ characters that are not an ampersand. At the end we are looking for zero or\
    \ ones ampersands. Let's look at our example string:\n\n```\nFirstMultiValue=Value&SecondMultiValue=Value2FinalMultiValue=FinalValue\n\
    ```\n\nTo strip out the second multi-value, the regular expression would match:\n\
    \n```\n&MultiValue=Value2&\n```\n\nOn the second line we replace the matched characters\
    \ with the characters matched in the first group in the regular expression, which\
    \ is either an & or the beginning of the string. In our example string would become:\n\
    \n```\nFirstMultiValue=Value&FinalMultiValue=FinalValue\n```\n\nThe second multi-value\
    \ has been completely stripped out, but the ampersand between the remaining multi-values\
    \ is preserved.\n\nWe'll be adding the new multi-value to the end of the string,\
    \ so if there are multi-values left we need to add an ampersand to the end of\
    \ the string to mark the end of the last multi-value, and this is what the if\
    \ statement does on the final lines.\n\nSo now we have the cookie string, which\
    \ is either an empty string (if no previous cookie existed) or a string containing\
    \ all multi-values other than the one we are writing to (if the cookie existed).\
    \ We now need to add our new multi-value to the end of this:\n\n```\ncookieValue\
    \ = multiValueName + \"=\" + escape(value);\ncookieDetails = cookieName + \"=\"\
    \ + cookieValue;\n```\n\nThis will make the name and value part of the cookie\
    \ to be written. Then, as with the writeCookie function, we need to add any of\
    \ the cookie attributes that have been passed to the function:\n\n```\ncookieDetails\
    \ += (expires ? \"; expires=\" + expires.toGMTString() + \"\" : \"\");\ncookieDetails\
    \ += (domain ? \"; domain=\" + domain + \"\" : \"\");\ncookieDetails += (path\
    \ ? \"; path=\" + path + \"\" : \"\");\ncookieDetails += (secure ? \"; secure\"\
    ;\n```"
