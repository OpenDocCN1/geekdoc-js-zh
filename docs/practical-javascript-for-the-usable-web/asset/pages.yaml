    \ = /^(\\d(1,3))?(\\d(1,5))\\|\\d(1,5)) \\d(3)? \\d(0,7)\\n(?|xtn|ext|extn|extension)?\\\
    .? \\d(1,5))$/i;\n```\n\nThen, we test our string using the regular expression:\n\
    \n```\nvar isValid = validFormatRegExp.test(telephoneNum);\n```\n\nFinally, the\
    \ method returns the isValid variable.\n\n# # Validating a Postal Code\n\nWe just\
    \ managed to check worldwide telephone numbers, but to do the same for postal\
    \ codes would be something of a major challenge. Instead, we'll create a method\
