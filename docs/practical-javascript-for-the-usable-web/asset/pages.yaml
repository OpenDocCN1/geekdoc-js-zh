  md: "# Functions and Code Design\n\nIt belongs in this line:\n\n```\nfixNumber =\
    \ new String((Math.round(fixNumber * (digitSaver)))/digitSaver)\n```\n\nso, for\
    \ example:\n\n23.412 * 100 = 2341.2\n2341.2 rounded = 2341\n\nBut we obviously\
    \ want the 2 digits to the right of the decimal point which we do by dividing\
    \ the number that we multiplied it by:\n\n```\nMath.round(fixNumber * (digitSaver))/digitSaver\n\
    ```\n\nwhich gives us the figure:\n\n23.41\n\nThe full line, however, converts\
    \ this result to a string, which may seem a little odd:\n\n```\nfixNumber = new\
    \ String((Math.round(fixNumber * (digitSaver)))/digitSaver)\n```\n\nThe reason\
    \ is that for a number like 23.1 to be fixed to, say, 2 decimal places we need\
    \ an extra zero to pad it out to 23.10. Adding the extra zeros required is the\
    \ purpose of the remainder of the function. The first task is to work out how,\
    \ if zeros need to be added to the end of the number. For example 24.1 fixed to\
    \ two decimal places needs one zero. We find how many extra zeros are needed simply\
    \ by counting how many digits there are currently after the decimal point and\
    \ subtracting this from the number of digits there should be after've fixed the\
    \ number, which is what these lines of code do:\n\n```\nvar zerosRequired;\nvar\
    \ decimalPointLocation = fixNumber.lastIndexOf(\".\");\n\nif (decimalPointLocation\
    \ == -1) {\n    fixNumber = fixNumber + \".0\";\n    zerosRequired = decimalPlaces;\n\
    } else {\n    zerosRequired = decimalPlaces - (fixNumber.length - decimalPointLocation);\n\
    }\n```\n\nFirst, we find out in the string containing our digits the decimal place\
    \ it is. The String's lastIndexOf() method which starts at the right-hand side\
    \ of the string and works to the left until it finds the decimal point character.\
    \ If it finds it, it returns the character's index, or position, in the string\
    \ counting from the left, or -1 if the character is not found. In the case of\
    \ 24.1 this would give 2 (remembering that string indexes start at zero), which\
    \ is stored in decimalPointLocation."
