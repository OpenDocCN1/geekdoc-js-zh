  md: "# 3. Which browsers are most commonly used? This changes as new browsers are\
    \ released and old ones go out of use. You also need to take into account the\
    \ importance of making your web site accessible – this is obviously a good idea,\
    \ there are also legal obligations to make certain web sites accessible.\n\nThere\
    \ are many web sites that offer general statistics about the browser versions\
    \ in use, and these can help you decide which browser you need to support in order\
    \ for the majority of people to view your site. Try these for browser stats:\n\
    \n+   * http://www.upsdell.com/BrowserNews/stat.htm\n* http://browserwatch.internet.com/stats/stats.html\n\
    * http://www.w3schools.com/browsers/browsers_stats.asp\n\nThis last covers information\
    \ such as operating system, size and the version of JavaScript being used – including\
    \ the fact that as 1 in 10 people JavaScript switched off. (If you were building\
    \ for such audience then you might opt to have a non-JavaScript version of the\
    \ site, or create individual non-JavaScript pages, or notify users that they need\
    \ JavaScript to use the site. We'll be looking at dealing with this as well as\
    \ dealing with different sizes).\n\nRemember, though, many statistical web sites\
    \ base their numbers on the people who visit their site, and the people who visit\
    \ such sites are unlikely to be representative of the average visitor to your\
    \ site. In fact, if you're creating pages for an existing web site, then that\
    \ web site is probably the best source of browser statistics.\n\n> However you\
    \ find your statistics, always be aware that you should only alienate users for\
    \ a good reason. Although you might be losing 5% of your potential visitors statistically,\
    \ if those 5% are an extremely vocal minority they can have a detrimental impact\
    \ on your brand and good name. A shop that turned away 5% of people because they\
    \ were wearing the wrong shoes wouldn't be able to expect much long-term success...\n\
    \n# JavaScript in a Web Page\n\nFirst things first: a web browser 'interprets'\
    \ code by converting it to something the computer can understand, and executing\
    \ it. It won't, however, interpret and execute JavaScript code unless we tell\
    \ it is JavaScript and what is HTML.\n\nWe use the HTML tags <script> and </script>\
    \ to tell the interpreter the lines between the tags should be interpreted as\
    \ JavaScript code and not HTML or text. Everything between the tags is considered\
    \ JavaScript program code.\n\nWe can put the JavaScript code block anywhere in\
    \ the page, and in more than one place, as well as have more than one script block:\n\
    \n```\n<head>\n<script language=\"JavaScript\">\n  // The forward slashes denote\
    \ commented text that won't be executed\n```"
