  md: 'In this chapter we''ll be discussing functions, code design, .js modules, and
    creating custom JavaScript objects. In the last chapter we worked with some of
    JavaScript''s built in functions built, which allow us to do thing like converting
    a string data type to a number easily. As we start to do more sophisticated things
    with our JavaScript we''ll find that the code becomes more complex. We''ll also
    find the same functionality is needed again and again. This is where creating
    our own functions can really help: they save time, and making coding less complex.


    Once we''ve covered functions, we''ll look at designing code in a way that minimizes
    bugs. This allows us to get things done that much more efficiently. Something
    else that can help with making life easier by making code easier is .js file.
    This allows us to put JavaScript code, like a library of functions for example,
    into a single plain text file, and insert it into pages as needed using the <script
    tag and its src attribute.


    Finally, we''ll look at how to create our own specialized objects using JavaScript
    classes, which are also useful for efficient coding.


    # Functions


    Functions allow us to wrap code that performs a certain task into a convenient
    code block that we can reuse within web pages. For example, in the last chapter
    we coded a currency converter. We might want to wrap it into a single function,
    and then put it in our code library for use in other web pages. Functions are
    useful when we run to, or call, the same bit of code again and again; if, for
    example, we had a button in HTML form in our web page and we wanted to perform
    the same task each button is clicked. So functions help us reuse our code and
    make it more readable.


    So when should we create a function? Creating a function is a good idea if we
    have some code that performs a useful, specific task that might be handy in lots
    of different web pages other than the one we are currently creating. Creating
    one is also a good idea if in the same web page we need to execute certain code
    more than once from different places on our page.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 3


    The important thing with functions is that they should do something efficiently.
    So that task might be dealing with the click of a button or it might be converting
    a temperature or detecting which browser the user has. It wouldn''t be a great
    idea to try and make functions too general, for example detecting the user''s
    browser and performing currency conversion!


    We can pass information to functions using parameters (sometimes called arguments).
    Examples of parameters are the number of degrees Celsius in a function that coverts
    temperatures from Celsius to Fahrenheit, the number of euros to be converted to
    dollars in a currency converting function. Functions can also return a single
    value to the code that called them, the return value. We''ll learn more about
    parameters and return values shortly when we look at creating a function.


    As variables, it makes life easier if we give our functions descriptive names.
    For example names such as something() and f_c() do not give any clues as to what
    the functions do, whereas dynamicMenu() or ConvertFahrenToCelsius() indicate the
    purpose of a function. If our functions do one task then naming them should be
    easy.


    Let''s look at how we create our functions.


    # Creating a function


    To create a function we use the function keyword, followed by the name that we
    wish to give the function, and then, in parentheses, the list of parameters the
    function requires to be passed. An example function header is shown below:


    ```

    function function(firstName, secondParameter, anotherParameter)

    ```


    Note the keyword function must be in lowercase.


    The function can be any word that is not a keyword used by JavaScript language
    such as while or for. It can contain numbers, alphabetical characters, and an
    underscore. However, It can only start with a letter or underscore, not a number.
    So these are valid names:


    ```

    function displayShoppingBasket()

    function notify_Error()

    function notify101Error()

    function checkBoxWhileTimerRuns()

    ```


    These aren''t valid names:


    ```

    function ldoSomething() // number not allowed at start of name

    function myFunction() // no spaces in function names

    function while() // is JavaScript reserved word

    ```


    Functions can have zero or more parameters. The limit on the number of parameters
    is really down to common sense rather than any actual maximum. Too many parameters,
    say more than 10, the code difficult to read and the function difficult to understand,
    are also an indication that your function is poorly designed. As variables and
    function names, we should give our parameters descriptive names. If our function
    doesn''t need any parameters, we must still put empty parentheses (), after the
    function name.'
