  md: '# Chapter 7


    In the previous diagram showing a representation of a simple HTML document, the
    branch nodes all corresponded to HTML elements, which are objects that are derived
    from the HTMLElement interface of the DOM module. The interfaces for all HTML
    elements are derived from this base interface. The HTMLElement interface itself
    is derived from the Element interface, which is in turn derived from the Node
    interface, within the DOM core. We know that elements may have attributes associated
    with them – there are methods of the Element interface that retrieve an attribute
    value.


    The terminal leaf nodes are Text nodes that implement the Text interface. The
    Text interface inherits from the CharacterData interface, which in turn inherits
    from the Node interface. No DOM objects correspond directly to CharacterData,
    so we don''t value into that interface. HTML Comments exist within the document
    structure and are derived from the Comment interface, which is also an extended
    interface of the CharacterData interface.


    If there is no markup inside an element''s content, the text is contained in a
    single object implementing the Text interface that is the only child of the element.
    If there is HTML markup, it is parsed into the information items (such as elements
    and comments) and text nodes that form a list of child elements.


    The Document represents the entire HTML or XML document. Conceptually, it is the
    root of the document tree, and provides the primary access to the document''s
    data. Since elements, text nodes, etc. cannot exist outside the context of a document,
    the Document interface also contains methods needed to create these objects.


    The DocumentFragment interface represents a minimal document that extends the
    Node interface. It is common to want to extract a portion of a document''s tree
    or to create a new fragment of a document, and the document fragment could be
    useful to store such fragments. When a document fragment is inserted into a Document
    (or any other Node that may make children) the children of the document fragment
    and not the document fragment itself are inserted into the document structure.
    This makes the document fragment very useful when the user wishes to create nodes
    that are siblings; the document fragment acts as the parent of these nodes so
    that the user can use the standard node properties and methods to manipulate the
    fragment.


    The diagram below shows the relationship between the main interfaces described
    above and how they are extended from the Node interface.


    ![](img/e58f0457390096aadd869f36b1b05e3c_211_0.png)


    Over the next few sections we will look at the more useful methods and properties
    that these interfaces define and how they can be used to manipulate the document.


    198'
