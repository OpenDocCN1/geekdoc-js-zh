    # Repositioning and Resizing a Window


    A problem that you may encounter is that you cannot guarantee the window is visible
    to the user. For example, they may have moved the window off the side of the screen
    at an earlier point in time. Window objects have a method moveTo(), which allows
    JavaScript to move the window to a location.


    ```

    var helloWin = open("hello.html", "helloWin", "width=200,height=200")

    helloWin.moveTo(100, 200);

    ```


    The moveTo() method accepts two arguments, the x and y coordinate values of the
    window, in pixels, of the browser''s top left corner. Example moves the helloWin
    window to a position 100 pixels from the left-hand side of the screen and 200
    pixels from the top of the screen.


    There is probably a good chance that if you have given the focus to a window,
    and repositioned it on screen for the user''s attention, the content of the pop-up
    window will have changed too. In this case you may want to resize the window,
    especially if you have made the window non-resizable. It is possible to do this
    using the resizeTo() method of the window object.


    ```

    helloWin.location = "goodbye.html"

    var width = 300;

    var height = 200;

    helloWin.resizeTo(width, height);

    ```


    Netscape6 browsers make the job of resizing pop-up windows even easier. The window
    object in this browser has a new method sizeToContent(). By calling this method,
    the pop-up window, you don''t even have to calculate the dimensions to set the
    window to; simply call the method and the browser will do all the work for you!


    ```

    helloWin.sizeToContent();

    ```


