    Try this out in a few browsers if you can. The name of the browser is displayed
    as:


    | User''s Browser | appName Display in Page |

    |---|---|

    | IE3+ | Microsoft Internet Explorer |

    | NN2+ | Netscape |

    | Opera 3+ | Opera/Netscape/Microsoft Internet Explorer |


    The last one is particularly confusing. Opera actually allows the user (under
    Preference I / Connections) to set whatever the browser is identified as Opera,
    Netscape, or Internet Explorer.


    The version of the browser may be displayed as:


    | User''s Browser | appVersion Display in Page |

    |---|---|

    | NN6.1 | 5.0 (Windows; en-GB) |

    | IE6.0 | 4.0 (compatible; MSIE 6.0; Windows NT 5.0; UUNET; Q312461 |

    | IE3.02 | 2.0 (compatible; MSIE 3.02; Update a; Windows 95) |

    | NN3.03 | 3.03 (Win95; I) |

    | Opera 3.6 | 3.03 (Win95; I) |


    You can see that the variations are quite extensive. NN2.0-4.x supplies the exact
    version number, while NN6.x just shows 5.0. IE seems to supply the version of
    NN that it is most compatible with – from IE4.0 onwards, only the version 4.0
    is given.


    In conclusion, using the appVersion and appName properties to determine the version
    and type of browser is quite error prone.


    # Object Detection


    An alternative to browser detection is to check if the browser supports the object
    we need for our code to work.


    In Chapter 6 we''ll see various properties of the document object such as all
    and layers are commonly needed for HTML in version 4.x browsers. However, IE4+
    supports document.all and only NN4 supports document.layers. Code such as ObjectDetection.htm
    below can be used to check whether an object is available to us before we use
    it:


    122'
