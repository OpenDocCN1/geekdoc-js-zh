  md: 'Knowing, we can use the replace() method of the String object to obtain the
    name of the sized image. This method scans a string for a substring (its first
    parameter) and replaces the substring with an alternative (second parameter) method
    on the String stored in the imgSrc variable. Using the replace() method can replace
