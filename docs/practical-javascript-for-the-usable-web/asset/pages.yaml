  md: "# Interacting with the Web Browser\n\nThe good thing about the <a> element\
    \ we can wrap it around other elements that don't support, like the <img> element.\
    \ We saw this used earlier in this chapter in the rollover and swap examples.\n\
    \nLet's see the <a> element in use with an example that creates a button based\
    \ on the <img> element:\n\n```\n<html>\n<head>\n<script language=\"JavaScript\"\
    >\nfunction imgButton_onmousedown() {\n  document.images['imgButton'].src = 'DownButton.jpg';\n\
    }\n</script>\n</head>\n<body>\n<a href=\"javascript:void(0);\"\nmousedown=\"imgButton_onmousedown\"\
    \nmouseover=\"document.images['imgButton'].src = 'UpButton.jpg';\">\n<img src=\"\
    UpButton.jpg\"\nborder=0\nname=\"imgButton\"></a>\n</body>\n</html>\n```\n\nSave\
    \ this asButton.htm. The page looks like that on the left by default. When the\
    \ button is clicked, the page changes to that right until the user lets go of\
    \ the mouse, then it returns to its default.\n\n![](img/e58f0457390096aadd869f36b1b05e3c_128_0.png)\n\
    \nLook at the <a> and <img> element definitions:\n\n```\n<a href=\"javascript:void(0);\"\
    \nmousedown=\"imgButton_onmousedown\"\nonmouseup=\"document.images['imgButton'].src\
    \ = 'UpButton.jpg';\">\n<img src=\"UpButton.jpg\"\nborder=0\nname=\"imgButton\"\
    >/</a>\n```\n\nThe <img> element doesn't have the events, so we simply wrap it\
    \ inside an <a> element, which does. The <a> element is only there so we can use\
    \ its events – we don't want the link to be followed, so we set the href attribute\
    \ to javascript: void(0); which basically does nothing. We could alternatively\
    \ have a <a href=\"#\"></a> or <a href=\"javascript:myFunction();return false;\"\
    ></a> for the same effect."
