    How does this work? The hyperlink is the easiest technique:


    ```

    <a href="ReceiveInfo.htm?Bob Bobkins&32;Send Data"></a>

    ```


    Note that we don''t need to escape the value of the href attribute in this case,
    because the browser does that us.


    Next we have the button and its onclick event handler:


    ```

    <form>

    <input type="button" value="Send Data" name="button1" onclick="location.href =
    ''ReceiveInfo.htm?'' + escape(''Bob Bobkins&32'')">

    </form>

    ```


    We set the location.href to the new page, ReceiveInfo.htm, a question mark, and
    then the data, using escape so that it can be included in the URL.


    The method of sending data doesn''t need any code at:


    ```

    <form action="ReceiveInfo.htm" method="get" name="form1">

    <input type="text" name="name">

    <input type="text" name="age">

    <input type="submit" value="Submit" id="submit1" name="submit1">

    </form>

    ```


    As long as the method attribute is set to get, clicking the Submit button will
    send the form data in the URL. We could even use a hidden form and set the form
    controls using JavaScript. This method works well even with older version 3 browsers.


    Finally, this code receives the data:


    ```

    var infoPassed = unescape(location.search);

    document.write("Info Sent is " + infoPassed);

    ```


    The data is extracted from the URL and unescaped back to the original value before
    being stored in the infoPassed variable. Then the value is written into the page.


