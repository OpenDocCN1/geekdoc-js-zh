  md: "# Chapter 4\n\nThe element has two event handler attributes defined, namely\
    \ mousedown and onmouseup.\nWhen the mousedown event fires, the function imgButton_onmousedown()\
    \ is called, which changes the element's src property to the Clicked image. Although\
    \ that's only code I have put in the function, there would normally be the code\
    \ associated with the task to be performed when clicking the button. For example,\
    \ if the button was labeled viewing shopping basket, then the code that showed\
    \ the shopping basket would be placed here.\n\nThe code attached to the onmouseup\
    \ event handler attribute simply swaps the Clicked image for the Click Me image\
    \ once the user's mouse button is released.\n\nNote that if we put an alert()\
    \ function in the imgButton_onmousedown() function, it would have caused problems.\
    \ The button remains in the Clicked state, because the focus of events switches\
    \ away from the element to the alert box that has appeared, the onmouseup event\
    \ handler for the <a element and setting it to do the same as the onmouseup event\
    \ handler can fix this. This ensures that the button will return to its Click\
    \ Me.\n\n```\n<a href=\"javascript: void(0);\n```\n\n# Form Element Events\n\n\
    The form object representing the <form> element has two events, submit and reset\
    \ – we'll take a look at them shortly. However, even in older browsers such as\
    \ NN3+ and IE3.02+, the form elements contained within a <form> element have numerous\
    \ associated events. The table below lists some of the common event handlers they\
    \ can have:\n\n| | onclick | onfocus | onblur | onchange | onselect | onkeydown\
    \ | onkeypress | onkeyup |\n|---|---|---|---|---|---|---|---||\n| button | X |\
    \ X | X | | | | |\n| checkbox | X | X | X | | | | |\n| hidden | | | | | | | |\n\
    | option | | | | | | | |\n| password | | | | | | | |\n| radio | | X | X | | |\
    \ | |\n| reset button | X | X | | | | | |\n select | | | | X | | | |\n| submit\
    \ button | X | | | | | | |\n| text | | X | X | X | | | |\n| text area | | | |\
    \ | X | X.. | | X.4 |"
