    something we cope with in the next line where we set the textbox''s value:


    ```

    document.form.txtName.value = (customerName ? customerName : "");

    ```


    We use the ternary operator. If `customerName` contains any value, then it will
    test as true and the code after the question mark will execute, simply returning
    `customerName`. If `customerName` is null, it will evaluate to false and the code
    after the colon will execute, returning an empty string.


