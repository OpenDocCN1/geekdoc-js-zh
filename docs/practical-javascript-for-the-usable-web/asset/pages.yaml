  md: '# Data Validation Techniques


    There are many ways for user to provide information to a web application. It is
    most commonly achieved via forms, but also through prompt boxes and viaHTML techniques.
    Sometimes users will deliberately enter incorrect information, but most of the
    time, if the data is wrong in some way, it''s an honest mistake on their part.
    Perhaps they do not understand what data needs to be entered. It''s much more
    or, or (even worse) let them know what''s wrong at the time the problem occurs,
    enter. While we can go to some lengths to make this clear within our HTML pages,
    we still need some technique for checking the validity of the data they enter.
    Much more user friendly if we let them know what''s wrong at the time, rather
    than on another page, or (even worse) not at all. In this chapter, we''ll be looking
    at how we can validate information entered by the user and let them know right
    away if something is amiss.


    Throughout the chapter, we''ll create a special validation class, adding methods
    that check various types of data as we go. We''ll be able to check the validity
    of simple numbers and strings, right through to more complex data, as credit card
    details and postal or zip codes. We''ll then extend the class for use with the
    e-commerce image viewer. In particular, we will see how we can automate form checking,
    so that a large form can be checked with just a few lines of code via method calls.


    # Validation of Different Types of Information


    In this section, we''re building up a JavaScript Validate class, adding methods
    to check various types of data. We''ll start with basic data checking, for example
    checking that a string contains letters of the alphabet, and numbers and punctuation.
    We will then move on to more complex examples, such as e-mail addresses and credit
    card details.


    Note, that there is only so much we can check client-side. For example, we can
    check that the format of an e-mail address is valid, but we can''t check that
    someone has actually set up and is using the address. We could perhaps perform
    more stringent checks with server-side processing, or our client-side checks help
    reduce the need for server-side processing since many of the errors are spotted
    and dealt with client-side. It''s also more user-friendly if we can warn the user
    of errors right away, rather than making them wait for server processing and page
    loads.'
