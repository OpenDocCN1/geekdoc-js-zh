    # Summary


    This chapter has covered the most important features that you should know when
    it comes to using JavaScript with windows and frames. With the exception of the
    iframe, you have learned that browser JavaScript coding with the two major browsers
    is fairly consistent and not too difficult.


    We''ve seen how to obtain references to windows, and frames, and from reference
    gain access to their methods and properties. Furthermore, the window reference
    allows us access to the document contained within the window, or frame, and we
    can obtain a reference to the document object within the window and manipulate
    it using standard DHTML techniques. The following chapter will discuss these HTML
    techniques.


    You should now have enough information to create and create you own pop-up windows
    to provide additional information to a user, or request additional information
    from the user, and obtain that information for use within your own web site or
    web application.


    In the next chapter you will learn how to access the document properties and methods
    using DHTML to alter the properties of elements within the document. If you combine
    knowledge gained in this chapter with the next you will be able to fully manipulate
    the windows and frames and the documents they contain.


    The Image Viewer application will be extended further in the next chapter, adding
    functionality to the application that is presently missing. The empty functions
    that have been included here will be fleshed out making use of JavaScript that
    is covered in this and the next chapter.


    161'
