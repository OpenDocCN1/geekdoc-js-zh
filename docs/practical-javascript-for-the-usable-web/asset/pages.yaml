  md: '# The DOM: dHTML for the Latest Browsers


    Unfortunately IE5 browsers have not implemented the DOMImplementation interface
    so the DOM conformance cannot be tested. Hence, in the example piece of code above,
    testing the document.implementation property is important if you is within IE
    or earlier browsers. IE6 has implemented the interface, but the hasFeature() method
    only returns true for the HTML module, and for version 1.0.


    # Importing XML Documents


    Importing new content into a web page without loading a whole document has long
    been a problem for web developers. Version 4 browsers went some towards fixing
    this problem by including the <iframe> and <layer> elements. (NN6 browsers do
    not support the <layer> element, because the <iframe> is part of the HTML specification).
    These elements, which we covered in Chapter 5, allow new documents to be loaded
    into parts of a main page.


    Part of the DOM Level 2 allows us to move away from this mechanism of loading
    new documents into a frame to view content. Instead, IE5+ and NN6+ browsers allow
    XML documents to be imported directly into an HTML page. Using the methods and
    properties discussed earlier in this chapter, JavaScript can traverse the DOM,
    extract content, and insert the new content into the HTML document at specific
    points.


    If you have ever visited the MSDN Library web site, you will have seen the left-hand
    frame that contains a TreeView navigation system. If it is not within view, point
    your browser to the URL http://msdn.microsoft.com/library to have a look. (Note
    that it works best using an IE5.0+ browser). Clicking on a menu option in the
    left-hand pane allows a sub-list of menu options to be displayed. As it does,
    an option drops down that says ''Loading...''. At this point, the browser is requesting
    an XML file that will contain the sub-menu options. When the XML document has
    been retrieved, JavaScript extracts the content and builds the new sub-menu, replacing
    the ''Loading...'' visual.


    In this section we have a lot of work to do something. The aim is to create a
    simple TreeView navigation system using data imported from an XML document to
    create the menu options and their controls. The screenshot shows how this will
    look:


    ![](img/e58f0457390096aadd869f36b1b05e3c_226_0.png)'
  merge: -1
