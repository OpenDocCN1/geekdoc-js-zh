  md: '# Summary


    In this chapter we''ve taken a look at what JavaScript is, how it works, and what
    its advantages and disadvantages are. We noted that one disadvantage, or at least
    something we have to be aware of, is the differences between browser versions.
    We looked briefly how we might cope with browser differences and will look at
    them in more detail later in the book.


    We''ve also run some JavaScript code, seen how to add comments to the code, and
    how to separate JavaScript statements with semicolons. We also saw that we can
    tell JavaScript to treat a group of lines of code as a single block denoting a
    statement using curly braces, with the if statement, for example. We saw that
    we can add JavaScript to various places within a web page, and that JavaScript
    generally runs from top to bottom, and from the first script block to the last,
    with the exception of functions that only execute when we tell them to.


    We also looked at objects, which are central to writing JavaScript. Not only is
    JavaScript itself very much dependent on objects, but the browser also uses objects
    to make itself available for programming through JavaScript. Finally, we looked
    at a simple example that selects an image of a size that would fit on the user''s
    screen, using the screen object to find out information about the users screen
    and then the document object to write HTML to the version of the web page the
    user sees.


    In the next chapter we''ll cover the language fundamentals of JavaScript. We''ll
    see how JavaScript stores and manipulates data, and uses it in calculations. We''ll
    also look at creating ''intelligent'' JavaScript programs using decision-making
    statements that allow us to evaluate data, calculations with it, and decide on
    a course of action. With that chapter under our belt we have most of the foundation
    knowledge needed to go on more exciting and useful web programming.'
  merge: -1
