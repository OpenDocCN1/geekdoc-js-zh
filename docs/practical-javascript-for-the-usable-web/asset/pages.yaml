    the application for your own needs, for example presenting a series of slides
    for presentation in lectures, or changing the design to fit into your own web
    site.


    In Chapter 8 we will return to the application to give it e-commerce functionality.
    This will be built up, in three parts, over Chapters 8, 9, and 10.


    # Summary


    The DOM specification is making great strides to create platform- and vendor-neutral
    programming interfaces for document creation and manipulation. With the system-independent
    approach, it is likely that much of what you have learned here can be easily adapted
    to other packages that implement the DOM interfaces other than web browsers.


    In relation to web browsers, the DOM APIs mean that writing cross-browser/platform
    code becomes much easier. It is often possible to write code for one browser and
    find that it works without writing any extra code in one, especially when the
    DOM Core and HTML modules are used.


    In this chapter we have covered how to access elements within a web page by their
    id attribute and create custom collections of elements, providing quick and easy
    access to elements that JavaScript can modify the element''s properties. We saw
    how to traverse up and down the document manipulate its nodal structure. Finally,
    we looked at how XML documents can be used to import data directly into an HTML
    document, how to extract the data, and how to use it to build components dynamically
    within the page.


    All these features of the DOM provide the developer with a new and powerful means
    for writing richer, more complex, dynamic, and powerful web documents. Code can
    be written in a more fashion and with a greater degree of portability than previously
    possible.'
