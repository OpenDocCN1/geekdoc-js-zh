  md: '# Chapter 4


    Submit Button

    Accessing the value of a submit button again allows us to change what is displayed
    on the button face.


    ```

    document.myForm.mySubmitButton.value = ''somevalue'';

    ```


    Note that the form object has a submit() method that has the same effect as clicking
    this button – it sends all values in the form to the server for processing.


    Checkbox Elements

    The value of a checkbox (that is, the text beside it) is generally not as important
    client-side as whether or not the user has checked the checkbox. The code below
    uses the checked property of the checkbox object, and stores the value true in
    variable isChecked if the checkbox was checked or false otherwise.


    ```

    var isChecked = document.myForm.Checkbox.checked;

    ```


    Textbox Elements

    We can access the value inside a textbox using the value property.


    ```

    var enteredValue = document.myForm.Textbox.value;

    ```


    Hidden Elements

    This element is similar to a textbox element, but is not visible to the user.
    We''ll use it in Chapter 9 where we pass data between web pages, without the user
    knowing. We access its value using its value property.


    ```

    var elementValue = document.myForm.myHiddenTextbox.value;

    ```


    Password Elements

    A password element is like a textbox element, but displays its contained value
    (whether typed by the user or adding JavaScript) as "*" characters rather than
    the actual characters, meaning that no one can look over the user''s shoulder
    and steal their password. We access its value using its value property.


    ```

    var elementValue = document.myForm.myPassword.value;

    ```


    Text area Elements

    A text area control is really just a multi-line textbox. We access the value inside
    a text area using its value property


    ```

    var enteredValue = document.myForm.myTextArea.value;

    ```


    Radio Buttons

    Radio buttons are put into groups (out of which the user can only select one button)
    by giving them the same name. For example, below are two groups of radio buttons,
    one group called group1 and the other called group2:'
