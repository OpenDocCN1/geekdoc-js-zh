  md: "# Interacting with the Web Browser\n\n```\nfunction window.onload() {\n  timerID\
    \ = window.setInterval(\"swapImg()\", 4000);\n}\n```\n\nIt contains just one line,\
    \ which uses the window object's setInterval method to start a timer going in\
    \ the page. The method setInterval() takes two parameters--the first is to be\
    \ called each time the timer fires, and the second is the interval that should\
    \ occur between each firing of the timer, which is measured in milliseconds. In\
    \ our example, 4000 milliseconds, or 4 seconds, the function swapImg() will be\
    \ called.\n\nThe setInterval() returns a value which is a unique id. We can have\
    \ more than one timer going in a page if we want, and the timer id allows us to\
    \ reference each individual. The main reason for referencing the timer is to stop\
    \ using the clearInterval method, if it is necessary before the browser is closed\
    \ or a new page is loaded. In the example we don't stop the timer, but if we wanted\
    \ to stop the code would:\n\n```\nwindow.clearInterval(timerID);\n```\n\nThe function\
    \ that is called every 4 seconds and does the image swapping is swapImg():\n\n\
    ```\nfunction swapImg() {\n  advertIndex++;\n  if (advertIndex > advertImgSrcs.length\
    \ -1) {\n    advertIndex = 0;\n  }\ndocument.images['mainAdvert'].src = advertImgSrcs[advertIndex];\n\
    }\n```\n\nThe first global variable advertIndex declared in the page is incremented.\
    \ It's made a global variable even though it's only used inside this function\
    \ so that the variable retains its value – a local variable would lose its value\
    \ once the function ends.\n\nAll the image src values are stored in the array\
    \ advertImgSrcs, which we've also declared as a global. The advertIndex variable\
    \ holds the index in the array of the currently loaded image src. If after advertIndex\
    \ is incremented, it is greater than the number of src values in the advertImgSrcs,\
    \ we set it back to zero. We check this by comparing the value advertIndex to\
    \ the length of the array -1, because array index values start at zero.\n\nIn\
    \ the final line, the Image object representing the <img> element that displays\
    \ our advert has its src set to the new image source\n\n# Document Events\n\n\
    The document object has a number of events dealing with user interaction with\
    \ the page, for example click, dclick, keydown, keypress,keyup, mousedown, and\
    \ mouseup. Unfortunately, details of which or mouse button are pressed using different\
    \ techniques depending on whether the user has a Netscape and Microsoft browser.\
    \ There is some difference in the technique between NN4 and NN6 browsers. In Chapters\
    \ 6 and 7 we will discuss code that is specific to these browsers, but here we\
    \ will stick to code that works for NN4+ and IE4.\n\n113"
