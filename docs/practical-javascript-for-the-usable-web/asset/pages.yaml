  md: "# Data Validation Techniques\n\n+   - someone@mailserver.info\n- someone@mailserver.ca\n\
    - someone@mailserver.co.uk\n- someone@mailserver.org.uk\n- someone@mailserver.win.net\n\
    - someone.something@mailserver.com\n- someone@subdomain.mailserver.com\n- someone.something@subdomain.mailserver.com\n\
    \nThat's quite a list and lot of variations we need to cope with. The method to\
    \ do that is shown below:\n\n```\nValidate.prototype.isValidEmail = function(email)\
    \ {\n  var FormatRegExp = /^\\w(\\.\\w*)?@\\w(\\.\\w*)*\\.[a-z]{2,4}$/i;\n  var\
    \ isValid = FormatRegExp.test(email);\n  return isValid;\n}\n```\n\nWe can see\
    \ this is another complicated regular expression:\n\n```\n/\\w(\\.\\w*)?@\\w(\\\
    .\\w*)*\\.[a-z]{2,4}\n```\n\nAgain, this wasn't built in one go but in stages,\
    \ let's break it down and discuss it in manageable bits.\n\nFirst, let's deal\
    \ with the part of the address up to and including the @. All e-mail addresses\
    \ start with one or more of the \\w class of characters - these are all letters,\
    \ all digits, and the underscore character (_). We start our pattern with:\n\n\
    ```\n\\w(\\.\\w*)?\n```\n\nFollowing this, we can have any sequence of \\w characters,\
    \ dashes, and dots. However, we can't have two dots in a row - each dot must be\
    \ followed by either a \\w or a dash character. The pattern \\[w-] matches any\
    \ \\w or dash character, or a dot followed by any \\w or dash character (recall\
    \ that the dot is a special symbol in regular expression syntax and so needs to\
    \ be preceded by a \\ and a question mark makes the preceding symbol optional).\
    \ We add zero or more of this pattern onto our regular expression (indicated by\
    \ the \" character), followed by the compulsory @ symbol:\n\n```\n\\w(\\.\\w*)?*\n\
    ```\n\nDealing with the part after the @ is a little easier, because we already\
    \ have some of the code written. After the @ part of the address, we want to match\
    \ \"mailserver\" or \"subdomain.mailserver\", which is the same as \"someone.something\"\
    ...\n\n349"
