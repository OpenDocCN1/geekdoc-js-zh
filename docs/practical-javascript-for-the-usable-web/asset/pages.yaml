  md: "First we define our regular expression that specifies the correct format for\
    \ the string:\n\n```\n/^\\d*(\\.\\d+)?$/\n```\n\nThe surrounding ^ and & characters\
    \ mean that the expression must appear at the beginning and end of the string.\
    \ In real terms, this mean that the expression must match the whole string – the\
    \ string cannot contain any other characters.\n\nThen, \\d+ mean that the pattern\
    \ must start with zero or more digits. (\\.\\d+)? means that may optionally be\
    \ followed by a pattern containing a dot and one or more digits. Note that the\
    \ dot is preceded by a \\ since it is a special character in regular expression\
    \ syntax, so we need to tell JavaScript that we mean a real dot.\n\n> Note that\
    \ patterns such as 0450 match this regular expression, though we may not wish\
    \ to allow numbers of that format.\n\nWe test our string against this regular\
    \ expression. If our string contains a pattern that matches the regular expression,\
    \ the isValid variable will be set to true; otherwise it will be set to false.\
    \ isValid is returned by the method.\n\nAs all methods so far, an empty string\
    \ will match this pattern – we can use this method to test for non-compulsory\
    \ data.\n\n# Integer Numbers Only\n\nOur next method checks for integers, that\
    \ is a number with no floating point part.\n\n```\nValidate.prototype.isValidInteger\
    \ = function(string)\n{\n  var validFormatRegExp = /^((+|-])?\\d*$/;\n  var isValid\
    \ = validFormatRegExp.test(string);\n  return isValid;\n}\n```\n\nThis is similar\
    \ to the method above, except the decimal point is now invalid and we allow a\
    \ positive or negative sign:\n\n```\n/^((+|-])?\\d*$/\n```\n\nThis regular expression\
    \ specifies that the string may optionally start with a + or sign, but if it does,\
    \ this must be followed by at least one digit. The ^ and $ characters again make\
    \ sure that no other characters are allowed before or after the pattern.\n\nExamples\
    \ of valid strings are +123, 234, 0, and -2445234. Invalid strings include ++123,\
    \ 1.23, and 1234ABC.\n\n> Note that strings such as -0, and 0054 match this regular\
    \ expression, though we may not want strings in this format."
