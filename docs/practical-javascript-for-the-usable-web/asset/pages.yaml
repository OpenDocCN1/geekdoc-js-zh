  md: "# Simple JavaScript Example\n\nWe will finish the chapter with a simple script\
    \ that determines the first size of the user's screen and then loads up an image\
    \ that fits. We will do this using the screen object (in fact both property of\
    \ the window object as well as property in its own right – but that distinction\
    \ is best left to Chapter 5, Windows and Frames). The screen object is a representation\
    \ of the user's screen, and has an availWidth property that we will retrieve and\
    \ use to decide which image to load.\n\nHere's the code:\n\n```\n<html>\n<body>\n\
    <script language=\"JavaScript\">\n  // width of the screen object is less than\
    \ 650 pixels\n  if (screen.availWidth < 650)\n  {\n    // load the small image\n\
    \    document.write(\"<IMG src=SmallImage.jpg>\");\n  }\n\n  // or if the width\
    \ of the screen object is less than 1000 pixels\n  else if (screen.availWidth\
    \ > 1000)\n  {\n    // load the big image\n    document.write(\"<IMG src=BigImage.jpg>\"\
    );\n  }\n  // otherwise\n  else\n  {\n    // load the medium sized\n    document.write(\"\
    <IMG src=MediumImage.jpg>\");\n  }\n</script>\n</body>\n</html>\n```\n\nYou can\
    \ download the images from www.glasshaus.com or use your own. The images in the\
    \ download are sized to fit screens 640 * 480 (SmallImage.jpg), 800 * 600 (MedImage.jpg)\
    \ and 1024 * 768 or larger (BigImage.jpg).\n\nAlthough we will be looking at the\
    \ details of if statements and loops in the next chapter, you can probably see\
    \ how this is working already. The if statement on the first line asks if the\
    \ screen.avail is less than 650 pixels:\n\n```\nif (screen.availWidth < 650)\n\
    ```\n\nIf the user's screen is 640 * 480 then it is less than 650 pixels, so the\
    \ code within the curly braces is executed and the small image is loaded. (Assuming\
    \ the user doesn't have any task bars on the left or right of the screen, the\
    \ image will fit.)"
