  md: "# DHTML for IE4 and NN4\n\nThis selection is made through the collapsible list\
    \ displayed in Area 1 (navigation). The collapsible list makes heavy use of DHTML\
    \ in controlling the CSS Display property. Let's look at this in detail next.\n\
    \n# The Collapsible List Implementation\n\nWe'll analyze the content of CategoryIndex.html\
    \ which controls the CSS Elements using DHTML. The iframe in Area 1 provides a\
    \ collapsible list of choices.\n\nFirst, there is the CSS stylesheet that specifies\
    \ the format for the <body> tag. In this case, we're using the tint 8-point font\
    \ in dark orange, with a background set to black. The <div> tag is given a margin\
    \ of 0 pixel, so that there is no extra space around it.\n\nWe define two classes,\
    \ .Heading and .SubHeading. This uses the same size font as the body, but with\
    \ bold for the font weight. Defining CSS specialization as a class like this enables\
    \ us to use the class attribute after \"heading\" in an HTML tag like this:\n\n\
    ```\n<div class=\"heading\">...</div>\n```\n\nThe Heading class CSS specialization\
    \ will then be applied to this <div> element. The top margin for these specializations\
    \ is set at 5 pixels.\n\n```\n<html>\n<head>\n<style>\nbody ( font:8pt verdana;\
    \ background-color:black; color:darkorange; )\ndiv ( margin:0px );\nHeading, .SubHeading\n\
    {\n  font-size:8pt; font-weight:bold;\n  cursor:pointer; cursor:hand; margin:0px;\
    \ margin-top:5px;\n}\n```\n\nNote how we immediately override the font-weight\
    \ of the .SubHeading class, sending it back to normal. We also define a class\
    \ of .dropLevel, which isn't rendered at all initially:\n\n```\n.SubHeading (\
    \ font-weight:normal );\n.dropLevel ( margin-left:10px; display:none );\n</style>\n\
    ```\n\n# DHTML MouseOver Highlighting\n\nThe code illustrates mouse animation.\
    \ In this case, the style of the text label is changed when the cursor moves over\
    \ the label. When the mouse is over the label, the text color turns from dark\
    \ orange to gold, and the text is underlined. When the mouse cursor goes outside\
    \ of the label, the orange text is restored.\n\n```\n<script language=\"JavaScript\"\
    >\nvar previousMenuElementClicked;\nfunction OnMouseOverHeading(this)\n(\n```"
