  md: "# The DOM: HTML for the Latest Browsers\n\nThe example below defines a function\
    \ that tries to use the getElementById() function:\n\n```\nfunction doSomething(id)\
    \ {\n  if (document.getElementById(id)) {\n    var el = document.getElementById(id);\n\
    \    // some code\n  } else {\n    alert(\"DOM getElementById feature not available\"\
    )\n    // some other code\n  }\n}\n```\n\nThis function tests to see if the document\
    \ object possesses the getElementById() method, and if it, it can safely use the\
    \ method in the if block. If not, the code in the else block is used.\n\nAs a\
    \ developer, you will undoubtedly come across many issues with DOM support. One\
    \ of the best resources that detail whether may the features are supported can\
    \ be found at http://www.xs4all.nl/pp/js/ in the DOM Compatibility Table page.\n\
    \nNetscape 6.0 support was 'flaky' in some respects. The Netscape 6.1 browsers\
    \ resolved many issues, having the best support for DOM level 1 and much of the\
    \ DOM Level 2 specification. Others are probably the best place to test your scripts.\n\
    \nSupport for DOM level 1 in IE5.x is, albeit incomplete. However, DOM level 2\
    \ is not supported, except for the ability to manipulate the CSS properties of\
    \ elements (this is very useful, as many HTML applications depend on this ability).\
    \ IE6 has improved the DOM 1 support, but has not embraced DOM 2 wholly.\n\n#\
    \ DOM Compliance Test\n\nThe DOMImplementation is defined as part of the DOM Level\
    \ 1 core module – this is one of the two interfaces that do not extend another\
    \ interface. The Document interface defines an implementation property that is\
    \ object with a DOMImplementation, available from the document object. This implementation\
    \ has the hasFeature() method, which can determine whether a DOM module is supported.\n\
    \n> Note that any implementation that conforms to the DOM Level 2 or any DOM Level\
    \ 2 must conform to the Core module by default.\n\nThe hasFeature() method accepts\
    \ two string parameters: the first is the name of the module, for example \"HTML\"\
    , and the second is the DOM version, for example \"2.0\". It returns a value of\
    \ true or false to indicate whether the module is supported. As no browser yet\
    \ supports DOM Level 3, the function can only return true if the second parameter\
    \ has a value of \"1.0\" or \"2.0\".\n\nThe following lines of code show how to\
    \ use the hasFeature() method. In this case we are testing to see if the DOM HTML\
    \ Level 2 module has been implemented."
  merge: -1
  pgno: 224
- img_proc: true
  md: "# Chapter 7\n\n```\nvar hasDomHtml = false;\nif (document.implementation)\n\
    \  hasDomHtml = document.implementation.hasFeature(\"Html\", \"2.0\")\n```\n\n\
    The hasFeature() method is used, the if statement tests whether the implementation\
    \ object has been implemented as a property of the document object. If we did\
    \ not do this and the document.implementation property doesn't exist, neither\
    \ could the hasFeature() method and a JavaScript error will result when an attempt\
    \ to call the method occurs.\n\nThe following table shows the DOM Level 1 and\
    \ 2 modules and their conformance within Netscape Version 6.1 and 6.2 browsers:\n\
    \n| Module Name | Level 1.0 | Level 2.0 | Description |\n| --- | --- | --- | ---\
    \ |\n| Core | Yes | Yes | |\n| HTML | Yes | Yes | DOM HTML module support |\n\
    | XML | Yes | Yes | DOM XML module support |\n| Views | | Yes | DOM Views module\
    \ support |\n| StyleSheets | | Yes | DOM StyleSheets module support |\n| CSS |\
    \ | Yes | DOM Cascading StyleSheets module support |\n| CSS2 | | No | DOM Cascading\
    \ StyleSheets Level 2 module support |\n| Events | | Yes | DOM Events module support\
    \ |\n| UIEvents | | No | DOM User Interface Event module support |\n| MouseEvents\
    \ | | Yes | DOM Mouse module support |\n| HTMLEvents | | Yes | DOM HTML module\
    \ support |\n| MutationEvents | | No | DOM Structure Mutation Event module support\
    \ |\n| Range | | Yes | DOM Text Range module support |\n| Traversal | | No | DOM\
    \ Document Traversal module support |\n\nAs you can see, the latest Netscape browsers\
    \ conform to the DOM 2 specification. However, according to the DOM specifications,\
    \ the UIEvents module must be implemented to have correctly implemented the MouseEvents\
    \ module. Thus NN6 wrongly claims here to have the MouseEvents feature. Similarly,\
    \ although a true value is returned from the hasFeature() method for the Range\
    \ module, you may find that some of the module has not been fully implemented."
  merge: -1
