  md: '# Functions and Code Design


    By this we split the problem we have into smaller and smaller bits, until we get
    to the point where we have functions that just perform one task. For example,
    if we have an online banking system we might start by looking at what functionality
    we need. Let''s say we decide we need the following functionality:


    +   - To Open and Close an account

    - To see the account balance

    - To view the last 10 transactions

    - To put money in and take money out


    From this we can then subdivide further:


    +   - Function to open a new account

    - Function to close an account

    - Function to obtain account balance

    - Function to display account balance

    - Function to open last 10 transactions

    - Function to display last 10 transactions

    - Function to put money in take money out


    We may want to split these tasks even further. For example, creating a new account
    may involve a number of tasks, not only creating a new account but also checking
    to see if the customer is a new customer, and so, if adding them to a central
    database and on. With divide-and-conquer we keep dividing the problem into smaller
    chunks until we''re happy we have the functionality down to nice cohesive functions,
    in other words, functions that perform one specific task. It makes it easier to
    identify what would be a function if we look at the verb and noun associations;
    for example ''open (verb) an account (noun)'' will give us the function openAccount(),
    and ''close (verb) give us the function closeAccount().


    # Organizing and Reusing Code


    We''ll find that as we develop web sites, the same required functionality pops
    up again and again. It might be prudent to detect which the user has, routines,
    for generating a shopping basket, and so on. We can just cut and paste code from
    our old web sites, but the potential problem with this is that the code may not
    have been designed to run on its own. There could be parts of other pages that
    our code uses. The other problem is finding the routine, as it can be quite hard
    to recall where we used that a function!


    It would much better if we could create libraries of useful code. For example,
    we could have a file that contained all the commonly required functions for an
    e-commerce shopping cart. We could be by simply including the file on a web page
    we can call any of its functions. We could also make sure we have some documentation
    for the file to help us use it later. Another advantage of code libraries or modules
    is that we can test and debug them, and once we have working they can be used
    many times without needing to worry about bugs. Bugs do turn over time, so it
    is sometimes the case when we realize we missed something, we just have to fix
    the code in our place, code module. Putting JavaScript in code modules also has
    the advantage of splitting the logic of our web pages, the code, from the presentation
    and content of the pages themselves, the HTML, which helps to keep our pages shorter
    and more manageable. In this section we''ll be looking at how we create files
    that contain just JavaScript code and insert that in a web page.'
