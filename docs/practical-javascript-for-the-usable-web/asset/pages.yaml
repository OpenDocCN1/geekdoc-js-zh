    The Image1.jpg and Image2.jpg files can be found in the code download for this.


    Let''s look first at the two hyperlinks. Normally, a hyperlink takes us to another
    page, but they can also be set to different protocols, for email mail; ftp; or,
    in our case, javascript:. The javascript tells the browser to expect some JavaScript
    code to execute rather than a URL to navigate to. It''s important to remember
    not to include a space between javascript and the colon (:) or it won''t work.


