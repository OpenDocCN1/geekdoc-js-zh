  md: "# Chapter 10\n\n+   - An extension number – 2 to 5 digits, preceded by x, ext,\
    \ xtn, extn, or extension (optional)\n\nObviously there will be countries where\
    \ this won't work – this is something we'd need to deal with based on where we\
    \ hoped the web site would be used from.\n\nOK, let's create the method with these:\n\
    \n```\nValidate.prototype.isValidTelephoneNum = function (telephoneNum)\n{\n \
    \ var validFormatExp = /^\\+d{1,3} ?(?:(\\d{1,5})|(\\d{1,5}))?(\\d(3)? ?(\\d(0,7)\n\
    \    ?(?:x|xtn|ext|extn|extension))?\\ ?\\d(1,5))?$/1\n\n  var isValid = validFormatExp.test(telephoneNum);\n\
    \n  return isValid;\n}\n```\n\nSo far the regular expressions for checking validity\
    \ have been fairly simple, so the one in this method comes as a bit of a shock\n\
    \n```\n/^\\+d{1,3} ?(?:(\\d{1,5})|(\\d{1,5}))?(\\d(3)? ?(?:x|xtn|ext|extn|extension))?\\\
    \ ?\\d(1,5))?$/1\n  i\n```\n\nAlthough it looks nightly and complex, if we break\
    \ it down it's not so bad at all. (In fact, it's so long that the width of this\
    \ book results in it being split – make sure you type it in on one line.)\n\n\
    We'll start with the pattern that matches an international dialing code:\n\n```\n\
    (\\d{1,3}) ?\\?\n```\n\nSo we're matching a plus sign (+) followed by 1 to 3 digits\
    \ (\\d{1,3}) and an optional space (?). Note that, since the character is a special\
    \ character with a special meaning in regular expression syntax, we add a \\character\
    \ in front of it to specify that we mean an actual + character. The characters\
    \ are wrapped inside parentheses to specify a group of characters. We match this\
    \ group of characters zero or one times – as indicated by the ? character after\
    \ the closing parenthesis of the group.\n\nWe have a pattern that will match the\
    \ area code:\n\n```\n(\\d{1,5})|(\\d{1,5})\n```\n\nThis pattern is contained in\
    \ parentheses, which designate it as a group of characters, and matches 1 to 5\
    \ digits in parentheses ((\\d{1,5})) or 1 to 5 digits ((\\d{1,5)). Again, since\
    \ the parentheses characters are special characters in regular expression syntax\
    \ and we want to match actual parentheses, we need the \\character in front of\
    \ them. Also note the use of the pipe symbol (|) which means \"OR\" or \"match\
    \ either of these patterns\".\n\nNext we match the subscriber numéber.\n\n```\n\
    \\?\\d(3) ?\\d(0\n```\n\n# 346"
