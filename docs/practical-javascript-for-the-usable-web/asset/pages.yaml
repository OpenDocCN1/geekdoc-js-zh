  md: "# # Modifying our Page with JavaScript\n\nNow that we've met the key browser,\
    \ we'll start looking at how we can use them to alter our web pages when it's\
    \ downloaded by the user. The important thing to note is that the actual page\
    \ (the one we type out and save as a file onto the server) is not altered at all.\
    \ The only page that is altered is the one it holds in the memory of the user's\
    \ computer. Dynamically changing the page (moving elements or altering their color,\
    \ etc.) after the page has been sent to the browser is referred to as Dynamic\
    \ HTML or DHTML for short. Purists may argue that, strictly speaking, some aspects\
    \ of changing a page after it is loaded is HTML, but here we will use it to refer\
    \ to any changes made using JavaScript.\n\n# ## Changing the Page as it Downloads\n\
    \nIn this section we are going to see how to use the `write()` method of the document\
    \ object to change the page as the browser loads and interprets. This technique\
    \ for changing the page has been around since IE3.02 and NN2, and so has the advantage\
    \ of being cross-browser compatible. It's also quite simple to use. However, except\
    \ in NN4 with a <layer> element, it is not much once the page has finished loading\
    \ (of, course, we can always reload the page)\n\nWe can use `document.write()`\
    \ to write any HTML to the page that would be valid at that. As far as the browser\
    \ is concerned, it pretty much as if the HTML had been included in the original\
    \ page on the server. Inside the parentheses after the method name, we place the\
    \ HTML or plain text we want to write. Note that the display of any added HTML\
    \ is effected by the page content around it. We may write some text into the page\
    \ within a formatting element:\n\n```\n<strong>\n  \n    document.write(\"This\
    \ will be effected by the strong element\");\n  \n</strong>\n```\n\nLet's look\
    \ at a common example of writing HTML into the page. In this page, greeting_example.htm,\
    \ the web site's greeting varies on the time of day:\n\n```\n<html>\n  <body>\n\
    \    <h1>My Heading/</h1>\n    <div id=\"welcomeMessageDiv\">\n      <script language=\"\
    JavaScript\">\n        var hourOfDay = new Date();\n        var hourOfDay = hourOfDay.getHours();\n\
    \        var greetingMessage = \" and welcome\";\n\n        if (hourOfDay >= 0\
    \ && hourOfDay < 12) {\n          greetingMessage = \"Good morning \" + greetingMessage;\n\
    \        }\n        else if (hourOfDay < 17) {\n          greetingMessage = \"\
    Good afternoon\" + greetingMessage;\n        }\n      </script>\n    </div>\n\
    \  </body>\n</html>\n```"
  merge: -1
