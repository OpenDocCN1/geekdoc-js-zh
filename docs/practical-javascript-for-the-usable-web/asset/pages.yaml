  md: "# Swapping Images\n\nAs we saw earlier, the document object has the images\
    \ array property, each element of which contains an Image object, for each <img>\
    \ element of the page. The most useful property of the Image object is the src\
    \ property – we can use this to change the image file to be displayed, even after\
    \ the page has completed loading into the browser. We may use this to change a\
    \ displayed banner advertisement while a user is looking at a page, or to create\
    \ a menu with an image that changes depending on the menu option that the user's\
    \ mouse hovers over.\n\nLet's take a look at a very simple example where we change\
    \ an image by clicking on a hyperlink.\n\n![](img/e58f0457390096aadd869f36b1b05e3c_108_0.png)\n\
    \nWhen the page initially loads, Image1.jpg is shown. However, when the Show Image\
    \ 2 hyperlink is clicked, Image2.jpg will be loaded into the page. When the Show\
    \ Image 1 link is clicked, Image1.jpg is reloaded.\n\nThe example is called SwapImage.htm:\n\
    \n```\n<html>\n<head>\n<script language=\"JavaScript\">\nfunction loadNewImage(imgSrc)\n\
    {\n  document.images['SwapImg'].src = imgSrc;\n}\n</script>\n</head>\n```"
  merge: -1
