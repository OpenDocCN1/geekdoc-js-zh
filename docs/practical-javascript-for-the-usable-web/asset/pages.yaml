  md: "# The DOM: HTMLML for the Latest Browsers\n\n# # Mutating the Document Structure\n\
    \nThe Node interface defines several methods for node manipulation, allowing nodes\
    \ to be removed from and appended to the document structure. One of these methods\
    \ is the `removeChild()` method that accepts a node as a parameter (a child to\
    \ the node it is called from), removes the child node, and returns a reference\
    \ to the removed node.\n\n```\nvar n = parentNode.removeChild(childNode);\n```\n\
    \nNote that if the node to be removed also contains child nodes, they too removed.\
    \ However, they can still be accessed using the removed node reference returned\
    \ from the `removeChild()` method.\n\nWe can easily create an operation that removes\
    \ all the content from an element by using a loop to iterate through a list of\
    \ child nodes, passing each as a parameter of this method:\n\n```\nfunction clearElement(node)\
    \ {\n  while (node.hasChildNodes()) {\n    node.removeChild(node.firstChild);\n\
    \  }\n}\n```\n\nThe `clearElement()` function above describes removing the nodal\
    \ structure below a parent node, which is passed as its parameter. Instead of\
    \ using a `for` loop to iterate through each of the child nodes, a `while` loop\
    \ is used. This loop tests to see whether the node contains any children by using\
    \ the `hasChildNodes()` method from the Node interface, which returns `true` if\
    \ the node has child nodes and `false` if not. Each pass through the loop removes\
    \ the first child, until there are no more child nodes to be removed.\n\nNodes\
    \ can also be added back into the structure through the use of the `appendChild()`\
    \ method. This method appends a node to the end of a list of child nodes, thus\
    \ also making the last child node of the parent. If the node already exists, it\
    \ is first removed before being appended as the\n\nThe `reverse()` function below\
    \ uses the `appendChild()` method to reverse the order of the nodes below a parent\
    \ node.\n\n```\nfunction reverse(node) {\n  var i = node.childNodes.length\n \
    \ while (i >= 0) {\n    node.appendChild(node.childNodes[i]);\n    i--\n  }\n\
    }\n```\n\nThis function loops backwards through each of the child nodes, successively\
    \ removing and appending the nodes, reversing their order. There is no need to\
    \ use code to remove the child node before appending it to the list of child nodes,\
    \ as the `appendChild()` method does this for us."
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Chapter 7\n\nIn a similar operation to appending nodes back into a list of\
    \ child nodes, the replaceChild() method can be used to replace one child node\
    \ with another. This method accepts two parameters: the first is the new node\
    \ and the second is the old node. If the new node already exists as a child node\
    \ of a parent, it is first removed. We will see a use for this in the next section.\n\
    \n# Creating New Nodes\n\nBeing able to mutate the document structure is starting\
    \ to add a whole dimension to HTML and open up a whole host of possibilities.\
    \ In this section, we'll see that the Document interface provides methods for\
    \ the creation of new HTML elements and Text nodes. These nodes can be inserted\
    \ into the document at specific points using the methods and properties of nodes\
    \ described above.\n\nRecall the getText() function defined earlier, the function\
    \ returns the string value of all the text contained within a node and its child\
    \ nodes (if they exist). The following example shows a function, setText(), which\
    \ will allow you to set the text of an element.\n\n```\nfunction setText(node,\
    \ txt)\n  clearElement(node);\n  var txtNode = document.createTextNode(txt);\n\
    \  node.appendChild(txtNode);\n\n```\n\nThe first removes all the child nodes\
    \ using the clearElement() function defined earlier. A new text node is created\
    \ using the createTextNode() method of the document object, and appended to the\
    \ specified parent node using the appendChild() method we have already seen. The\
    \ createTextNode() method accepts a single parameter, namely the string value\
    \ of the text node.\n\nWe have two functions, getText() and setText(), which use\
    \ the DOM API, are cross-browser compatible, and completely remove the need to\
    \ use the Internet Explorer specific innerText property.\n\nAs well as creating\
    \ text nodes, new HTML elements can be created using the createElement() method,\
    \ also defined by the Document interface. This method accepts a single parameter\
    \ that is the string name of the element to be created.\n\nThe next example, Embold.htm,\
    \ uses a function that creates a <b> element using the createElement() method,\
    \ and re-parents a node to all and its descendants are displayed in a bold font\
    \ within an HTML page.\n\n```\n<html>\n<head>\n<script>\nfunction convertToBold(node)\n\
    {\n  var boldElement = document.createElement(\"b\");\n  var parent = node.parentNode;\n\
    \  parent.replaceChild(boldElement, node);\n  boldElement.appendChild(node);\n\
    }\n</script>\n</head>\n<body>\n```\n\n208"
  merge: -1
  pgno: 221
