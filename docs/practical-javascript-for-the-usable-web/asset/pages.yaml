    Next is the `saveForm()` function which saves the contents of the form when the
    page is unloaded.


    We need to do this to keep a record of the customer details for use when the form
    is posted to the server on the final checkout page, as well as to save for cases
    where a user backtracks to change their data.


    ```

    function saveForm()

    {}

