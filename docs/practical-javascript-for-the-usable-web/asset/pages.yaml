    This will write string into the page.


    The way to ensure that the interpreter is using a number data type is to explicitly
    declare that the data is a number. There are three functions you can use to do
    this:


    +   - Number(): tries to convert the value of the variable inside the parentheses
    into a number

    - parseFloat(): tries to convert the value to a floating point. Anything non-numerical
    passed to the function will be discarded

    - parseInt(): converts the value to an integer by removing any fractional part
    without rounding the up or down. Anything non-numerical passed to the function
    will be discarded


    Let''s see how these functions work in practice:


    ```

    <html>

    <body>

    <script language="JavaScript">

    var userEnteredNumber = prompt("Please enter a number*",");

    document.write(typeof(userEnteredNumber));

    document.write("<br>");

    document.write(parseFloat(userEnteredNumber));

    document.write("<br>");

    document.write(parseInt(userEnteredNumber));

    userEnteredNumber = Number(userEnteredNumber)

    document.write("<br>");

    document.write(userEnteredNumber);

    document.write("<br>");

    document.write(typeof(userEnteredNumber));

    </script>

    </body>

    </html>

    ```


