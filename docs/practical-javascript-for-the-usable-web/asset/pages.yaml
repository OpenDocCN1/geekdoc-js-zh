  md: "# The DOM HTML for the Latest Browsers\n\n```\n<p id=\"makeBold\">Here is a\
    \ simple paragraph</p>\n<form>\n  <input type=\"button\" value=\"Make Bold\"\n\
    \  onclick=\"convertToBold(document.getElementById('makeBold'))\">\n</form>\n\
    </body>\n</html>\n```\n\nIf you test this example in your browser, clicking on\
    \ the button will cause the text in the paragraph to become bold. The displayed\
    \ paragraph becomes the equivalent of the HTML source code:\n\n```\n<b><p id=\"\
    makeBold\">Here is a simple paragraph</p></b>\n```\n\nNote that some HTML elements\
    \ cannot be re-painted by certain other HTML elements. Therefore, there is a need\
    \ to be careful when using this type of functionality.\n\n# Modifying Attributes\n\
    \nAdding attributes to HTML elements can have marked effects on content within\
    \ the document is displayed. The Element interface defines two methods for retrieving\
    \ and setting the values of attributes.\n\nThe getAttribute() method accepts a\
    \ parameter string name of attribute, and returns the value of the named attribute\
    \ if it exists or is empty not. Note that some attributes, such as the `<input>`\
    \ element's type attribute, have a default value if one is not set. The method\
    \ may return a default value instead of an empty string for an attribute, even\
    \ if the attribute is not in the source.\n\nThe example below shows how you can\
    \ obtain the value of the horizontal alignment attribute (align) of an element.\
    \ In this case, we use the paragraph with the id name equal to makeBold from the\
    \ previous example.\n\n```\nvar elem = document.getElementById('makeBold');\n\
    var alignment = elem.getAttribute('align');\n```\n\nThe setAttribute() method\
    \ adds a new attribute and value to element. It accepts two parameters - the first\
    \ is the name of the attribute to set and the value of the attribute. If an attribute\
    \ with that name is already present in the element, its value is changed to that\
    \ given in the value parameter. Again using the paragraph from the previous example,\
    \ how you can show the horizontal alignment attribute of element to centered.\n\
    \n```\nvar elem = document.getElementById('makeBold');\nelem.setAttribute('align',\
    \ 'center');\n```\n\nA useful effect in browsers that have implemented HTML4 is\
    \ to use the title attribute of an element to supply extra information to a user\
    \ in the form of a ToolTip when mouse cursor is positioned over it. For example,\
    \ it could be used when acronyms appear within a document so the title attribute\
    \ supplies the expanded meaning of the acronym. Below is the HMTL source code\
    \ of an example acronym that may be used within a web page."
  merge: -1
