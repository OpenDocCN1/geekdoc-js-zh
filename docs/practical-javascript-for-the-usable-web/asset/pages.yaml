    # Accessing frames


    Each frame can be accessed from the top-level parent window using the frames array,
    in a similar manner to accessing iframes from a parent window. Remember that all
    arrays are zero-based; they start at 0 and count upwards. So, to access the first
    child frame in our example with JavaScript located in the parent window, you would
    use:


    ```

    var leftFrame = window.frames[0]

    ```


    And to access the second child window:


    ```

    var rightFrame = window.frames[1]

    ```


    However, you can also reference a child window by using the name of the subtitle
    within the frames array, rather than its index number.


    ```

    var leftFrame = window.frames["frLeft"]

    var rightFrame = window.frames["frRight"]

    ```


    Or easier, simply use the frame name without referencing the frames array at all
    — this is the most common and preferred approach by JavaScript developers.


    ```

    var leftFrame = window.frLeft

    var rightFrame = window.frRight

    ```


    This last way to access frames directly by just using their names is so much easier
    than counting frames that it almost makes mandatory to include the name attribute
    with the <frame> tag.


    When trying to access the parent top-level window object from any of the child
    frames you can use the parent property, as we saw with iframes:


    ```

    var parentWindow = parent

