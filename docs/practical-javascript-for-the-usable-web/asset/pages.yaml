  md: 'Both methods are fine, just as long as you close the string the same way you
    opened it and don''t try to delimit it like this:


    ```

    document.write(''some characters'');

    document.write(''some characters'');

    ```


    Of course, you might want to use a single or double quotation mark inside the
    string itself, in which case you need to use a distinct delimiter. If you used
    double quotation marks then the instructions will be interpreted as you intended:


    ```

    document.write("Paul''s characters");

    ```


    But if you used single quotation marks, they won''t be:


    ```

    document.write(''Paul''s characters'');

    ```


    This will give you a syntax error because the JavaScript interpreter can''t tell
    whether the string ends before or after the final s.


    > JavaScript syntax, like English, is a set of rules that make the language ''intelligible''.
    Just as a syntax error in English can render a sentence meaningless, so a syntax
    error in JavaScript can render the instruction meaningless.


    You can avoid creating JavaScript syntax errors like this one by using single
    quotes to delimit any string containing double quotes and vice versa:


    ```

    document.write("Paul''s numbers are 123");

    document.write("some characters");

    ```


    If, on the other hand, you wanted to use both single and double quotation marks
    in your string then you need to use something called an escape sequence. In fact,
    it''s better practice to use escape sequences instead of the quotation marks we''ve
    been using so far, because they make the code easier to read.


    # Escape Sequences


    Escape sequences are also useful for situations where you want to use characters
    that can''t be typed using a keyboard (like the symbol for the Japanese Yen ¥
    on a Western keyboard). Some of the most commonly used escape sequences:


    | Escape Sequences | Character Represented |

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |


    Table continued on following page'
