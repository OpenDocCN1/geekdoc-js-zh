    It''s time to complete the image viewer''s conversion to an e-commerce application.
    So far we have everything working, except the validation of the field where the
    user enters data in the checkout part of the application. If we enter "Duck Duck"
    as our credit card number, the application accepts it. In this section, we rectify
    that make use of our Validate class to validate our forms.


    However, we''ll be doing more than using the Validate class – in the next section
    we extend its capabilities to make it easier to use.


    # Adding Automatic Form Validation


    Writing code to check each input box or radio button in a form can be quite tedious.
    It would be great if we could somehow say, "this input box must contain a valid
    e-mail address and must be filled, in this box can contain any text, and one of
    these radio buttons must be selected", so that our code automatically know which
    validation technique to use for each form element. For some of the image viewer
    application''s textbox and radio controls, we are going to extend the Validate
    class and add a way of doing this.


    First, we need to decide on a way of leaving out our code what sort of data a
    form element should contain. For example, in the case of a radio button, we simply
    want to specify that one of the radio buttons in the group must be selected. To
    achieve this in a cross-browser compatible way, we''ll be using the name attribute
    of the form element to specify:


    +   - Whether the form element is compulsory, that is the user must have entered
    or selected a value.


    +   - What sort of data a form element should contain. This applies to textboxes,
    since only radio buttons already have values set.


    Let''s look at an example <input> element:


    ```

    <input name="txtFullName_Compulsory_alphabetic" maxlength="150" class="TextBox"
    >

    ```


    Look at the name given to the element, and note that as well as the usual form
    name there is also:


    ```

    _Compulsory_alphabetic

    ```


    This has specified the element is compulsory (some value must be entered) and
    the value must contain only alphanumeric characters. We''ll see what other data
    types we can use shorty.


