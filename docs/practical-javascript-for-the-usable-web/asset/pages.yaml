  md: "Let's look at an example that uses the for loop to run an array. We'll use\
    \ a for loop to run through an array called theBeatles, using a variable called\
    \ loopCounter to keep the loop running while the value of loopCounter is less\
    \ than the length of the array:\n\n```\n```html\n<body>\n<script language=\"JavaScript\"\
    >\nvar Beatles = new Array(\"John\", \"Paul\", \"George\", \"Ringo\");\n\nfor\
    \ ( var loopCounter = 0; loopCounter < theBeatles.length; loopCounter++) {\n \
    \ document.write(theBeatles[loopCounter] + \"<br>\");\n}\n</script>\n</body>\n\
    </html>\n```\n```\n\nThis example works because we are using a zero-based array\
    \ in which the items have been added to the index in the sequence. The loop wouldn't\
    \ run if we used keywords to store items in an array like this:\n\ntheBeatles[\"\
    Drummer\"] = \"Ringo\";\n\nJavaScript also supports the for...in loop (which has\
    \ been around since NN2, although IE supports it only since IE5). Using a counter\
    \ for the for...in loop throws each item in the array using a variable to access\
    \ the array. Let's create an array and see how it works:\n\n```\n```html\n<body>\n\
    <script language=\"JavaScript\">\n// initialize the Beatles array and store in\
    \ a variable\nvar theBeatles = new Array();\n\n// set the values using keys rather\
    \ than numbers\ntheBeatles[\"Drummer\"] = \"Ringo\";\ntheBeatles[\"SingerRhythmGuitar\"\
    ] = \"John\";\ntheBeatles[\"SingerBassGuitar\"] = \"Paul\";\ntheBeatles[\"SingerLeadGuitar\"\
    ] = \"George\";\nvar indexKey;\n\n// write out each indexKey and the value for\
    \ that indexKey from the array\nfor ( indexKey in theBeatles) {\n  document.write(indexKey\
    \ + \" : \" + indexKey + \"<br>\");\n  document.write(\"item value is \" + theBeatles[indexKey]\
    \ + \"<br>\");\n}\n</script>\n</body>\n</html>\n```\n```\n\nThe results of the\
    \ item in indexKey at each iteration of the loop is written out alongside the\
    \ value extracted from the array using key in the same order as it occurs in the\
    \ array:"
