    These features are not supported by Internet Explorer browsers, instead with Internet
    Explorer version 4+ browsers a new type of pop-up window is available for creating
    modal windows, through the use of the showModalDialog() method. Also, the loading
    of new page and script execution in the opener window is halted when the modal
    window is opened until the user closes it.


    The showModalDialog() method accepts three arguments. The first is required and
    the URL of a document to be loaded and displayed. The second and third arguments
    are both optional, so in its simplest form the following statement can be used
    to create a modal dialog window:


    ```

    showModalDialog("hello.html");

    ```


    The second argument specifies the variables that can be used in the dialog displayed.
    This argument can be passed any type of value, including an array of values. Scripts
    running in the page loaded into the box can extract the values passed by the caller
    from the dialogArguments property of the window object. If we opened a modal dialog
    window as follows:


    ```

    showModalDialog("hello.html", "modal example");

    ```


    In the page loaded in the modal dialog window, we could obtain the value of the
    second argument using the following:


    ```

    var inArg = window.dialogArguments;

    alert(inArg);

    ```


    This would display an alert box with the message modal example.


    Finally, the third argument is a string that specifies the window features for
    the dialog box, using a list of semicolon-delimited name-value pairs. The following
    line creates a modal dialog window 350 pixels high and 300 pixels wide, which
    is resizable and has no status bar.


    ```

    showModalDialog("hello.html", "modal example", "dialogHeight:250px;

    dialogWidth:300px; resizable=yes; status=no");

    ```


    By default, modal dialog windows, created with the showModalDialog() method, are
    centred on screen. This can be overridden using the dialogLeft and dialogTop properties
    to position the dialog relative to the top left corner of the window. The following
    table lists the different features that are used, with their possible values and
    their default value.


    | Feature Name | Values | Default | Description |

    | --- | --- | --- | --- |

    | dialogHeight | Height in pixels | | Sets the height of the dialog window. Minimum
    is 100 pixels. |

    | dialogLeft | Left in pixels | | Sets the left position of the dialog relative
    to the upper-left corner of the desktop. |

    | dialogTop | Top in pixels | | Sets the top position of the dialog window relative
    to the upper-left corner of the desktop. |


