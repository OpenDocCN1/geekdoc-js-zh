  md: "# Interacting with the Web Browser\n\nWhen the textbox or select control's\
    \ change event fires, it's noted in the text area on the right of the page. Notice\
    \ that the textbox change event only fires when focus is moved away from the textbox,\
    \ the select change event occurs as soon as a new option is chosen.\n\nThe `<select>`\
    \ element has an onChange attribute, which calls the `addEventListener()` function\
    \ to do the actual listing in the text area:\n\n```\n<select size=\"4\" name=\"\
    select1\"\nnonchange=\"addEventListener('onChange fired\\n')\">\n```\n\nThe same\
    \ applies to the textbox, which also has the onChange event handler:\n\n```\n\
    <input type=\"text\"\nnonchange=\"addEventListener('textbox onChange fired\\n')\"\
    >\n```\n\nThe function that both of these call is:\n\n```\nfunction addEventListener(eventText)\n\
    \  document.form1.txtList.value += eventText;\n```\n\nThis simply adds the string\
    \ in parameter eventText, to the end of the value in the txtList area box.\n\n\
    # Select Event\n\nThe select event fires when the user selects text inside either\
    \ a textbox or a text area. It fires each time the text that has been changed.\n\
    \n# Checking the User's Browser\n\nWe've discussed the fact that different browsers\
    \ support, not only different versions of JavaScript, but also different levels\
    \ of access to the browser objects. Some browsers, like IE4+ and NN6+, allow access\
    \ to most of the page content. In comparison, IE3.0 provides very limited access\
    \ to anything more than the form elements and a few other elements, such as `<a>`.\n\
    \nIt's therefore very useful to detect the type and version of the browser that\
    \ the user is viewing our web page with. There are two main techniques of doing\
    \ this: browser detection and object detection.\n\n# Browser Detection\n\nBrowsers\
    \ provide information about themselves via properties of the navigator object,\
    \ which is a property of the window object. Its most useful properties are appName,\
    \ which returns a string indicating the name of the browser, and appVersion, which\
    \ returns a string indicating the version of the browser. BrowserDetection.htm\
    \ page below shows the value of these two properties to be displayed in the page.\n\
    \n```\n<html>\n<body>\n  <script language=\"JavaScript\">\n```\n\n121"
  merge: -1
