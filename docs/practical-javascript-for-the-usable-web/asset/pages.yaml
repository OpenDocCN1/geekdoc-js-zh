  md: "# Chapter 6\n\n```\nthisTag.style.textDecoration = 'underline';\nthisTag.style.color\
    \ = 'gold';\n\nfunction OnMouseOut(thisTag)\n{\n  thisTag.style.textDecoration\
    \ = 'none';\n  thisTag.style.color = 'darkorange';\n}\n```\n\n# Hiding DIV Elements\
    \ : The Illusion of a Collapsible Menu\n\nThe collapsible menu is implemented\
    \ by toggling the display of nested <div> elements.\n\n# Writing Cross-browser\
    \ DHTML\n\nGetTagById() function is a cross-browser DHTML function that wraps\
    \ up the different ways to access an element, given its tag id. It is a utility\
    \ that is called by other functions on this page. We can see browser detection\
    \ using the document.all collection test technique in its logic. This code basically\
    \ distinguishes IE4+ browsers and other browsers. However, the document.getElementById()\
    \ method used in the other branch makes this function compatible to only N6 browsers\
    \ or above.\n\n```\nfunction getTagById(tagId)\n{\n  var selectedTag;\n  if (document.all)\n\
    \  {\n    selectedTag = document.all.item(tagId);\n  }\n  else\n  {\n    selectedTag\
    \ = document.getElementById(tagId);\n  }\n  return selectedTag;\n}\n```\n\nThe\
    \ switchDisplay() function is used to toggle the display of the two hidden <div>st\
    \ comprise the collapsible part of the list. It takes two arguments, the first\
    \ one is the <div> that needs to be displayed (expand) or not displayed (collapse).\
    \ The second argument takes the <img> tag that displays (+) or (-) sign depending\
    \ on whether the branch is expanded or collapsed.\n\nThe logic is quite interesting:\
    \ to check if the <div> is now displayed or not. In order to determine this, the\
    \ display property may return ** (the first time because the inline style object\
    \ does not yet have the display property assigned) or \"none\" (subsequently,\
    \ once the display property has been assigned). If it is being displayed then\
    \ it is removed from sight and the <img> is set to the plus icon, indicating a\
    \ collapsed state. If it is not being displayed, then it is displayed and the\
    \ <img> is set to the minus icon, indicating an expanded state.\n\n184"
  merge: -1
  pgno: 197
- img_proc: true
  md: "```\nfunction switchDisplay(tagId, branchImage)\n{\n  var tagToSwitch = getTagById(tagId);\n\
    \  var imgToSwitch = getTagById(branchImage);\n  if (tagToSwitch.style.display\
    \ == \" \" || tagToSwitch.style.display == \"none\") {\n    tagToSwitch.style.display\
    \ = \"block\";\n    imgToSwitch.src = \"minus.gif\";\n    if (document.all) {\n\
    \      tagToSwitch.scrollIntoView();\n    }\n  } else {\n    tagToSwitch.style.display\
    \ = \"none\";\n    imgToSwitch.src = \"plus.gif\";\n  }\n}\n```\n\nThe loadNewImageCategory()\
    \ function is called when one of the leaf elements of the collapsible list is\
    \ loaded. It causes a new thumbnail page, one of the three listed above, to be\
    \ loaded into the thumbnails area (Area 2). It takes two arguments, the first\
    \ is the leaf <div> element that has been clicked by the user, and the second\
    \ is the URL of the thumbnail page that should be displayed in Area 2.\n\nThe\
    \ actual loading of the thumbnail into Area 2 is performed by a function that\
    \ is located in the parent frame of the ImageViewer.htm, and called loadNewCategoryThumbnails().\
    \ The rest of the logic is used to reset the color of the previously clicked menu\
    \ item to black, and to set the currently selected one.\n\n```\nfunction loadNewImageCategory(menuElementClicked,\
    \ categoryURL)\n{\n  parent.loadNewCategoryThumbnails(categoryURL);\n  if (typeof(previousMenuElementClicked)\
    \ == \"object\") {\n    previousMenuElementClicked.style.backgroundColor = \"\
    black\";\n  }\n  previousMenuElementClicked = menuElementClicked;\n  previousMenuElementClicked.style.backgroundColor\
    \ = \"gray\";\n}\n</script>\n```"
