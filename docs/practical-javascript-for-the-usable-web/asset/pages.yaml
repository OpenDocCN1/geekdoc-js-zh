  md: "# Chapter 10\n\n\\w\\.?[\\w-]** @\\w\\.?[\\w-]**\nNow we need to add support\
    \ for the end of the e-mail address. This combination of dots and letters varies\
    \ erroneously, from a dot followed by two and four letters, a dot, two to four\
    \ letters, another dot and two to four letters. Of course, this changes all the\
    \ time as new suffixes are ratified. Here, we will just check for a dot followed\
