  md: '# Windows and Frames


    When the application is first loaded there will be no thumbnails visible and so
    there is no need for this image to be visible. We will apply a stylesheet to this
    page shortly and set the visibility property to hide, so that is not visible.
    The image visible again we will therefore require a function that will toggle
    the visibility style property of this image between visible and iframe. You will
    see how to code this effect in Chapter 6.


    The second and third iframes have each image reference by the src attribute. These
    images are sized to the same dimensions as the iframes themselves and simply inform
    the user what to do to view an image file. The first iframe references an HTML
    file that will display the tree view navigation system. We will look at this later
    in the Navigation System


    If you copy the code above, it is in a file called ImageViewer.htm, and test it,
    you will find it doesn''t look too inspiring. All the elements are positioned
    and sized by the browser using its normal flow layout. A JavaScript error is raised
    because of the onload event handler associated with the third iframe, which is
    the main image viewing frame.


    # Stylizing the Application


    We already know that a stylesheet is required to set the visibility property of
    the imageLoadingAnimation image and the position of the arrows above and below
    the second iframe. We will also use a stylesheet to position each element on the
    page and provide them with the correct dimensions.


    ```

    <style>

    body { background-color:black; }

    img, iframe { position:absolute; }


    iframe { top:50px; height:480px; margin:0px; border-style:none; }

    iframe#categoryFrame { left:10px; width:210px; }

    iframe#thumbnailFrame { left:125px;width:190px; background-color:black; }

    img#mainImageFrame { left:320px;width:640px; border:5px #c0c0c0; }


    img#scrollUpImg { left:125px; top:10px; }

    img#scrollDownImg { left:150px; top:535px; }

    img#imageLoadinganimation { left:320px; visibility:hidden; }

    </style>

    ```


    Copy the stylesheet into the <head> section of the ImageViewer.htm file. The stylesheet
    gives the page a black background. All image and iframe elements are set to absolute
    positioning by default. All iframes by default 50 pixels from the top of the page,
    to be 480px high, with no margins and borders.


    The remaining style properties are applied specifically to each element by attaching
    style properties to each element via its id attribute. The position of each x
    coordinate is supplied by the left property and given a width. Similarly the x
    and y coordinate is supplied to position each image precisely on the page. The
    background colour of the thumbnailFrame is set to black and a grey border property
    is applied to mainImageFrame, overriding the default of no border set earlier
    in the style sheet. Finally, the imageLoadingAnimation image has its visibility
    to hidden so that it is not displayed when the page loads.


    155'
