- img_proc: true
  md: "# Chapter 6\n\n# Technique 1: Using document.all Collection Test\n\nThis technique\
    \ is illustrated in the following code fragment:\n\n```\nif (document.all) {\n\
    \    //IE4+ browser compatible code...\n}\nelse {\n    //code for other browsers...\n\
    }\n```\n\nThis technique is good for checking if we're in a Microsoft IE4 or higher\
    \ version browser, because it looks for the existence of the document.all collection.\
    \ Where this exists, we can be quite certain that we are in an IE4 or higher (a\
    \ compatible browser like Opera). This technique is fast, and useful to determine\
    \ if we can code IE4 style HTML.\n\n# Technique 2: Using the document.layers Collection\
    \ Test\n\nThis technique is useful when we need to determine if the browser is\
    \ an NN4.x browser. The NN4.x browser series alone exposes the document.layers\
    \ collection to JavaScript programs, so we can check for it in order to isolate\
    \ coding appropriate for NN4 browsers alone:\n\n```\nif (document.layers) {\n\
    \    //NN4 browser compatible code...\n}\nelse {\n    //code for other browsers...\n\
    }\n```\n\n# Technique 3: Using a Browser Sniffer\n\nThis is a substantially more\
    \ comprehensive technique. While it involves a little more work, it gives very\
    \ detailed information about the browser and version access to the web page. Browser\
    \ sniffers are specialized JavaScript programs that you can incorporate into your\
    \ web page to \"sniff\" out the browser that is accessing the page.\n\nBrowser\
    \ sniffers tend to use a myriad of techniques to achieve positive browser identifications\
    \ (including the two techniques mentioned above). The owners of these programs\
    \ update the sniffer code whenever a new browser is released to ensure its usefulness.\n\
    \nUsing a browser sniffer makes determination of browser and version quite simple.\
    \ However, due to the complexity of these programs, it will introduce a lot of\
    \ code into your web page, which can mean that it executes a little slower.\n\n\
    One popular browser sniffer, the Ultimate JavaScript Client Sniffer, can be found\
    \ here:\n\n```\nhttp://www.mozilla.org/docs/web-developer/sniffer/browser_type.html\n\
    ```\n\nAt the time of writing, the current version is 3.03 and will detect IE\
    \ 3,4,5,5,5,6, Netscape 2,3,4, and 6, Opera3, 4, and HotJava 3 on Win32, Mac,\
    \ Linux, and SunOS.\n\n178"
  merge: -1
  pgno: 191
- img_proc: true
  md: "All you need to do to use the sniffer is include the JavaScript code from this\
    \ URL into a <script> element in the <head> section of your page. You then have\
    \ a series of predefined Boolean flags, named is_??? that you can code with. You\
    \ test these flags like this:\n\n```\nif (is_nav) {\n  //NN4 only coding, such\
    \ as layer tags...\n}\nif (is_navup) {\n  //NN4+ coding ...\n}\nif (is_ie4) {\n\
    \  //IE4 only coding...\n}\nif (is_ie4up) {\n  //IE4+ coding...\n}\n```\n\n# ImageViewer:\
    \ Part 2: Adding DHTML and CSS\n\nLet's start further analysis of the ImageViewer\
    \ application that we have started in the last chapter, and apply some of the\
    \ new concepts we have explored in this chapter.\n\n# Applying CSS/CSSP Stylesheets\n\
    \nA CSS Stylesheet is being used in the ImageViewerMain.html to regulate the consistent\
    \ formatting of the display. Drawing from our earlier discussion of CSS, we can\
    \ see that this stylesheet is included as part of the web page. Or course, could\
    \ we have linked to an external CSS stylesheet like:\n\n```\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"viewerstyle.css\">\n```\n\nAll we need to do is ensure\
    \ that the <link> element is placed within the <head> element of the ImageViewer.htm\
    \ file.\n\nYou can see the formatting and positioning specified by the application\
    \ designer in this stylesheet. Let's tabulate these decisions here, and show the\
    \ segments of code responsible for the format:\n\n```\n<style>\nbody { background-color:black;\
    \ }\n\nimg, iframe { position:absolute; }\niframe { top:50px; height:480px; margin:0px;\
    \ border-style:none; }\n\niframe#categoryframe\n}\n```"
