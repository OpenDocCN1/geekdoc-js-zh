  md: "# Chapter 7\n\n```\n<acronym title=\"DOM (Document Object Model)\"\nstyle=\"\
    cursor:pointer;\"\nonclick=\"expandAcronym(this)\">DOM</acronym>\n```\n\nThe <acronym>\
    \ element in this example has an onclick handler that calls a function called\
    \ expandAcronym(), passing as a parameter reference to the element itself. When\
    \ called, the function swaps back and forth the value of the element and the title\
    \ attribute.\n\n```\nexpandAcronym(el)\n{\n  var elTxt = getText(el);\n  var titleTxt\
    \ = el.getAttribute(\"title\");\n  setText(el, titleTxt);\n  el.setAttribute(\"\
    title\", elTxt);\n}\n```\n\nThe expandAcronym() function obtains the text from\
    \ the element using the getText() function defined earlier and the method of the\
    \ element is set to the text value that was previously stored in the title attribute\
    \ using the setText() function again, we defined earlier. Finally, the value of\
    \ the title attribute is set to the original text of the element using the setAttribute()\
    \ method.\n\nThis effect can be seen in the screenshots below. Clicking on the\
    \ <acronym> element expands the text content to the value of the title attribute,\
    \ and a second mouse click returns the text back to its original value. Note the\
    \ ToolTip shows, as we change the value of the title attribute.\n\n![](img/e58f0457390096aadd869f36b1b05e3c_223_0.png)\n\
    \n![](img/e58f0457390096aadd869f36b1b05e3c_223_1.png)\n\n# DOM Compatibility\n\
    \nIf you try to run any of the scripts in this chapter, you will usually run into\
    \ problems in browsers that don't comply with the DOM (that is, version 4 browsers\
    \ and earlier). Worse still, the browser that has implemented DOM may not have\
    \ implemented the full specification. This latter issue is not such an issue when\
    \ considering a vast amount of the DOM Level 1 specification, but is important\
    \ when DOM Level 2 is taken into account. This raises compatibility issues; one\
    \ way around these issues is to know which browsers implement what features of\
    \ the DOM and use a client sniffer every time you want to use DOM features (see\
    \ Chapter 6 for more discussion of client sniffers).\n\nA simple and easy technique\
    \ that does not involve client sniffers is to test that a particular object or\
    \ method exists before using it. We saw this technique in use in Chapter 4 and\
    \ Chapter 6."
  merge: -1
