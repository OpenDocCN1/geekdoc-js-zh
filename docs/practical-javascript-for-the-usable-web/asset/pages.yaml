  md: "# Interacting with the Web Browser\n\n```\n<script>\n<head>\n<body>\n<a href=\"\
    somepage.htm\" name=\"myLink\">Link</a>\n<script>\ndocument.links[0].onclick =\
    \ myEventHandlerFunction;\n</script>\n</body>\n</html>\n```\n\nThe <a> element\
    \ and the function are both defined before the code specifying the event handler\
    \ property. The following, `EventsError.htm`, won't work:\n\n```\n<html>\n<head>\n\
    <script language=\"JavaScript\">\nfunction myEventHandlerFunction() {\n  // some\
    \ code\n}\n</script>\n</head>\n<body>\n<script>\ndocument.links[0].onclick = myEventHandlerFunction;\n\
    </script>\n<a href=\"somepage.htm\" name=\"myLink\">Link</a>\n</body>\n</html>\n\
    ```\n\nNow the script defining the event handler code is the <a> element in the\
    \ page - the script is parsed by the browser before a object exists, and will\
    \ cause an error.\n\nWe'll see shortly that the window object's load event, which\
    \ fires after the page parsing and loading is complete, a good place to put event\
    \ handler code as we can be sure the page is fully loaded and parsed.\n\nIn the\
    \ next sections, we will be looking at the events linked with the browser window\
    \ itself, the document, individual HTML elements, and finally with the form elements\
    \ they contain.\n\n# Window Events\n\nWindow events are events that happen to\
    \ the browser window as a whole rather than any specific part of the page that\
    \ is loaded. Some of the events only prove useful when new browser windows are\
    \ opened, such as the focus event, which occurs (or fires) when the user makes\
    \ a window the focus of their actions.\n\nThe two commonly used window event handlers\
    \ are load and onload."
