    \ followed by a sequence of letters, that ends at the end of the string — means\
    \ the array will only contain one element. We place this in the variable dataType,\
    \ and set this to lowercase to avoid problems with, for example, _IsEmail and\
    \ _isvalidEmail being treated differently. The case wrong for the type definitions\
    \ in the name when creating forms would be very easy and a hassle to sort.\n\n\
    In the statement we need to check that the control actually had a specified data\
    \ type and was not compulsory, otherwise our data type regular expression will\
    \ lead us to checking for a non-existent data type called _compulsory.\n\nFinally,\
    \ we set isValid to value returned by the isElementDataValid() method of this\
    \ class, which does the actual data validity checking. Then isValid is returned\
    \ to the calling function to indicate the validity of the element checked.\n\n\
