  md: '# Chapter 10


    The method is much the same as those we have already seen, so we''ll start by
    looking at the regular

    expression:


    ```

    ^(\d{5})(-\d{4))?[a-z][a-z]?\d\d? \?[a-z][a-z]$/i

    ```


    This is actually in two parts: the first part checks zip codes and the second
    part checks UK post

    codes. We''ll start by looking at the zip code part.


    Zip codes can be in one of two formats – either five digits (12345), or five digits
    followed by a dash

    and four digits (12345-1234)


    The zip code regular expression to match this is:


    ```

    \d(5)(-\d(4))?

    ```


    This matches five digits, followed by an optional group that matches a dash followed
    by four digits.


    For a regular expression that covers UK post codes, let''s consider their various
    formats. UK post

    code formats are one or two letters followed by one or two digits, followed by
    an optional

    space, by a digit, and then two letters. Valid examples include: CH3 9DR, PR29
    1XX, and

    C27 3AH.


    Based on this, our pattern is:


    ```

    [a-z][a-z]?\d\d? \?[a-z][a-z]

    ```


    The patterns that match zip codes and post codes are combined using the | character
    to match

    "match one or the other" and grouped using parentheses:


    ```

    (\d{5})(-\d(4))?[a-z][a-z]?\d\d? \?[a-z][a-z]

    ```


    We add the @ character at the start and & character at the end of the pattern
    to be sure that the

    only information in the string is the postal code, and surround the string by
    the regular expression

    imiter character /. Although postal codes should be uppercase, it is still valid
    for them to be

    lowercase, so we have also set the case-insensitive flag i:


    ```

    ^(\d{5})(-\d(4))?[a-z][a-z]?\d\d? \?[a-z][a-z]$/i

    ```


    The remainder of the method uses this regular expression to test the format of
    the characters in

    the data matches valid format of a postal code:


    ```

    var isValid = validFormat.test(postalCode);

    ```


    # Validating an E-mail Address


    Before we start working on a regular expression to match e-mail addresses, we
    need to look at the

    types of valid e-mail addresses we can possibly have:


    +   - someone@mailserver.com


    348'
