    \ The third parameter is the id of the <div> into which we will be writing the\
    \ calendar. The final parameter is the function within the HTML file to be called\
    \ when the calendar is hidden. In other programming languages this of function\
    \ is often called a callback function, because it is passed to some code that\
    \ it calls at some later. It provides a way of notifying the original code of\
    \ some event, in this case the calendar has been closed. A good analogy is the\
    \ situation where you phone a company and they say, \"we haven't got the information\
    \ at the moment, but we'll call you back when we have. What's your phone number?\"\
    \ For \"company\" read the function originally being called, and for \"phone number\"\
    \ read a reference to the function to be called. The callback function in this\
