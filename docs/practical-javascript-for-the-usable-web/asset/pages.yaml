    user has not filled in correctly. However, as mentioned in Chapter 8, this can
    be annoying to the user, so we adopt a different technique. Next to each form
    element is a hidden `<div>` element, which we fill with with an appropriate error
    message in. For example:


    | E-mail Address: | Please enter a valid e-mail address |


    Here, no e-mail address was entered, so when the user clicked *Continue*, the
    form showing the mistake <div>. However how will our code know the name of the
    appropriate <div>? The easiest cross-browser way of doing this is to have a naming
    convention.


    In our naming convention, the name of the form element itself must start with
    a three-letter identifier, such as `txt` for a textbox, `pwd` for a password element
    or `cbo` for a drop-down combo box. You can use however identifiers you like as
    long as they are three characters long and at the start of the name. Recall that
    the name may also end with the compulsory and datatype identifiers described above.


    To be able to find the appropriate <div> for each form element, we say that the
    id of the error <div> must contain the name of the form element, but without the
    three-letter identifier, the compulsory and datatype identifier, and with the
    word Error added at the end. Based on the form element example above, where the
    name has the name txtFullNameCompulsory_alphabetic, the error <div> would have
    an id value of FullNameError.


