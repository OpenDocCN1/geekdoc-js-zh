  md: '# Interacting with the Web Browser


    After the first three chapters, we should have all the essential JavaScript under
    our belts. In this chapter, we''ll be looking at how we can use it to interact
    with the browser. By our interaction, we mean the way we can change how web page
    looks as it is downloaded and after it has been downloaded, and how the browser
    lets us interact with the user of the page.


    We''ll concentrate on some of the objects that the browser makes available to
    our JavaScript code, how we can access and use HTML forms with JavaScript, and
    finally how to capture events (for example, the user clicking the mouse button
    or pressing a key on the keyboard). At the end of the chapter, we''ll also look
    at how we can detect which browser the user is viewing our web pages with – this
    is necessary since different browsers may make different objects available to
    our code. In this chapter we''ll be sticking to JavaScript that will work with
    all IE3+ and NN3 browsers, we''ll look at how IE and NN differ in the following
    two chapters.


    # Browser Objects


    We''ve already seen in Chapter 2 that JavaScript has built-in objects such as
    the String object, Date object and Math object. JavaScript''s way of providing
    functionality to specific types of data, like characters and dates. The Math object
    is slightly different in that there is only one Math object and it''s already
    created for JavaScript – we simply use the mathematical function it provides via
    its methods and properties.


    However, JavaScript wouldn''t be useful on its own. It''s a fine language, but
    it''s JavaScript''s ability to interact with its host environment makes it really
    useful. What do I mean by host environment? Well, we learned in Chapter 1 that
    JavaScript is available not just in the browser, but also on web servers, in Adobe
    PDF file, and for scripting tasks in Windows. Each of these contexts hosts JavaScript
    JavaScript to manipulate the host, whether it is a window or a web page. In each
    case, the JavaScript language is more or less the same, but the host environment
    is quite different. The question is, "how do we interact with the host? Each host
    provides a set of objects that it makes available to JavaScript, just as the Math
    object is automatically created and made available to our code.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 4


    For this book, the host environment we are interested in is the browser. When
    a web page is loaded, the browser looks at the page and creates objects representing
    different elements in the page. Some objects will always be available. For example,
    every page makes a window object representing the browser it is contained in,
    and a document object representing the page itself. Other example, if we have
    three img elements in the page, then the browser creates three image objects.
    Each object is accessible in JavaScript, as String and Date objects are available
    to it. However, no HTML element will have an object created for it – the earlier
    browsers, like IE3 and NN3, only make a limited number of the elements on a page
    accessible as objects. In contrast, modern browsers, like NN6 and IE5, make virtually
    all elements available to JavaScript as objects.


    Although each browser makes some elements available to JavaScript objects, the
    way of accessing them between browsers. The good news is that NN6+ and IE5+ have
    adopted standards that make coding for both browsers easier, which we will discuss
    in Chapter 7.


    The browser organizes all the objects it makes to JavaScript in a tree-like hierarchy.
    The window object contains all the other objects and is at the top of the hierarchy.
    Contained inside the window is our page, represented by the document object. Inside
    the document object are the objects representing the HTML elements in the page.
    We could represent it in a tree diagram like this:


    ![](img/e58f0457390096aadd869f36b1b05e3c_103_0.png)


    The hierarchy of objects representing HTML elements or page objects within the
    document is called the Document Object Model (DOM). The DOM is like a road map,
    but instead of telling us what are available and how to get them, the DOM determines
    which of the HTML elements will be made available to JavaScript objects and how
    we can access them.


    While early browsers (such as IE3 and NN3) had similar DOMs, they were definitely
    not identical. This of course, caused problems for developers trying to write
    JavaScript code that runs on both browsers. In order to solve this problem, the
    web standards organization, the World Wide Web Consortium, or W3C (http://www.w3.org/),
    has various standards for what a DOM should contain and how its objects should
    be accessible to the browser. Modern browsers, like IE5+ and NN6+, have adopted
    the W3C DOM level 1 standard to varying degrees, and to a lesser extent, the W3C
    DOM level 2.


    In this chapter we will look at the objects that the DOM has been supported by
    since IE3 and NN3. This means that most of the code in this chapter will work
    on most browsers, even older ones. We will turn to an investigation of how the
    IE4 and NN4 DOMs work in Chapter 6. In Chapter 7, we''ll be looking at the W3C
    DOM and its support by IE5+.


    Let''s start by briefly looking the key browser objects and how we use them.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Key Browser Objects


    The key objects when programming the browser are the window and document objects.


    The window object represents the browser window itself. For example, it provides
    information about the screen, the browser version, pages which have been visited
    by the user, and much more. This information is usually provided through various
    other objects that are accessed as properties of the window object, namely location,
    screen, and navigator objects.


    The document object, which itself is accessed as a property of the window object,
    deals with the HTML page itself. For example, it allows us to access HTML forms
    and images within the page, and even to write new information to the page.


    The diagram below shows how the above objects are linked – note that it''s from
    the window object that all the other objects can be accessed. The document object
    also contains its forms, images, and links arrays, which are available as its
    properties.


    ![](img/e58f0457390096aadd869f36b1b05e3c_104_0.png)


    The table below summarizes the objects we''ve met so far:


    | Object | Description |

    | --- | --- |

    | window | Represents the browser window or frame. |

    | navigator | Provides information about the browser, for example, the browser
    version. This is a property of the window object. |

    | location | Provides information about the location (the URL or file path) of
    the currently loaded page. This is a property of the window object. |'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Chapter 4


    | Object | Description |

    | --- | --- |

    | screen | Provides details of the user''s screen, for example, the number of
    colors supported or screen resolution. <br> This is a property of the window object.
    |

    | document | Represents the HTML page within the browser window or frame. Allows
    us to access HTML elements inside the page. <br> This is a property of the window
    object. |

    | forms | An array containing all the form objects (representing <form> elements)
    inside the current page. <br> This is a property of the window object. |

    | images | An array containing all the Image objects (representing <img> elements)
    inside the current page. <br> This is a property of the document object. |

    | links | An array containing all the link objects (representing <a> and <area>
    elements with a href attribute) inside the current page. <br> This is a property
    of the document object. |


    Strictly speaking, we access objects that are properties of the window object,
    like the location document objects, we should prefix their object name with window
    (we should also prefix alert() in this way, since it is actually a method of the
    window object):


    ```

    window.document.write("<strong>some html</strong>");

    window.alert(location.href);

    ```


    However, since the window object is at the top of the hierarchy, browser assumes
    its use by default, so we can write:


    ```

    document.write("<strong>some html</strong>");

    alert(location.href);

    ```


    with no need to put window in front.


    Note that, to avoid bugs, it''s better if we don''t declare variables with the
    same names as browser objects. For example, if you declared a variable called
    location, then in the following code JavaScript will assume that you are accessing
    your variable rather than the location object property of the window object:


    ```

    var location;

    alert(location.href);

    ```'
  merge: -1
