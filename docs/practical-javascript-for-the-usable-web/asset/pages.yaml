  md: '# Comparing Data


    These are some of the more commonly used comparison operators:


    | Operator | Description | Example |

    | --- | --- | --- |

    | == | Checks whether the left and right operands are equal | 123 == 234 returns
    false<br>123 == 123 returns true |

    | != | Checks whether the left operand is not equal to the right side | 123 !=
    123 returns false<br>123 != 234 returns true |

    | > | Checks whether the left operand is greater than the right | 123 > 234 returns
    false<br>234 > 123 returns true |

    | >= | Checks whether the left operand is greater than or equal to the right |
    123 >= 234 returns false<br>123 >= 123 returns true |

    | < | Checks whether the left operand is less than the right | 234 < 123 returns
    false<br>123 < 234 returns true |

    | <= | Checks whether the left operand is less than, or equal to, the right |
    234 <= 123 returns false<br>234 <= 234 returns true |


    > Beware the == equality operator: it''s all too easy to create errors in a script
    using the assignment operator, =, by mistake.


    These operators all work with string type data as well as numerical data, and
    are case-sensitive:


    ```

    <html>

    <body>

    <script language="JavaScript">

    document.write("Apple" == "Apple")

    document.write("<br>")

    document.write("Apple" < "Banana")

    document.write("<br>")

    document.write("apple" < "Banana")

    </script>

    </body>

    </html>

    ```


    This is what you should get back:


    +   - true

    - true

    - false'
