- img_proc: true
  md: "# Chapter 7\n\nThe top-level menu items are colored and use a bold font. The\
    \ sub-level menu items are colored blue and underlined. Each menu and menu item\
    \ has a title attribute that pops up a ToolTip the mouse cursor is placed over\
    \ it.\n\nTo start this example, a simple HTML document needs to be created, called\
    \ Importing_XML.htm, as below. We'll add this to as we build up the menu.\n\n\
