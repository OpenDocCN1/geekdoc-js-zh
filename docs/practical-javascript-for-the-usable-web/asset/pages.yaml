  md: "# Getting Started with JavaScript\n\n+   * /** Indicates the beginning of a\
    \ comment that covers more than one line.\n\n+   * */ Indicates the end of a comment\
    \ that covers more than one line. Multi-line comments are also useful if you want\
    \ to stop a certain section of code from being executed but don't want to delete\
    \ it permanently. If you were having problems with a chunk of code, for example,\
    \ and you weren't sure which lines were causing the problem, you could comment\
    \ a chunk at time in order to isolate the problem.\n\n+   * Curly braces (' and\
    \ ') are used to indicate a block of code. Ensure that all the lines inside are\
    \ treated as one block.\n\n+   * A semicolon defines the end of a statement, and\
    \ a statement is a single command. Semicolons are in fact optional, but it's a\
    \ good idea to use them to make clear where statements end, because doing so makes\
    \ your code easier to read and debug. (Although you can put many statements on\
    \ one line, it's best to put them on separate lines in order to make the code\
    \ easier read.) You don't need to use semicolons after curly braces.\n\nLet's\
    \ put this syntax into a working block of code:\n\n```\n<html>\n<body>\n<scriptLanguage=\"\
    JavaScript\">\n//one-line comments are useful for reminding us what the code is\
    \ doing\n\n/* this is a multi-line comment. It's useful for both longer comments\
    \ as\nalso blocking out segments of code when you're testing\n*/\n// script starts\
    \ here. We're declaring a variable myName, and assigning its\nvalue to whatever\
    \ the user puts in the prompt box (more on that in Chapter\n2), finishing the\
    \ instruction with a semicolon because it is a statement\nvar myName = prompt(\"\
    Enter your name,\");\n\n//If the name the user enters is Paul Wilton\nif (myName\
    \ == \"Paul Wilton\") {\n  then a new window pops up saying hello\n  alert(\"\
    Hello Me\");\n}\n\n//If the name entered isn't Paul Wilton\nelse {\n  //say hello\
    \ to someone else\n  alert(\"hello someone else\");\n}\n</script>\n</body>\n</html>\n\
    ```"
