    \ example:\nGetElementByIdHtml:\n\n```\n<html>\n<head>\n<title>Obtaining an Element\
    \ By ID</title>\n<script>\nfunction highlightElement(elem)\n{\n  var el = document.getElementById(elem);\n\
    \  el.style.color = \"red\";\n  el.style.fontWeight = \"bold\";\n}\n</script>\n\
    </head>\n<body>\n<span id=\"nickname\">Bilbo Baggins</span>\n<form>\n  <input\
    \ type=\"button\" value=\"Highlight\" onclick=\"highlightElement('nickname');\"\
    >\n</form>\n</body>\n</html>\n```\n\nIn this example, clicking the button calls\
    \ the `highlightElement()` function and passes the string id of the element (the\
    \ `<span>` element in this) to it as a parameter. The `highlightElement()` function\
    \ obtains a reference to the named element using the `document.getElementById()`\
    \ method.\n\nOnce a reference has been acquired for the element, HTML can be used\
    \ to change the properties of this element. In the example above, we have simply\
    \ changed the textual content of the element to be colored red and provided it\
    \ with a bold font."
