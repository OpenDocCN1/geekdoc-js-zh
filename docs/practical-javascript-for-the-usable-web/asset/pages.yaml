  md: '# Practical JavaScriptnfor the Usable Web


    OVERVIEW


    This is a new kind of JavaScript book. It''s not cut''n''paste, it''s not a reference,
    and it''s not an exhaustive investigation of the JavaScript language. It''s about
    client-side, web focused, task-oriented JavaScript.


    This book will give you a thorough grounding in client-side JavaScript, and enable
    you to construct your own functionality quickly, easily, and without falling into
    any of the usability traps that technology leaves wide open.


    WHO IS THIS BOOK


    JavaScript is a core skill for web professionals, and as every web professional
    knows, client-side JavaScript can produce all sorts of glitches and bugs. Practical
    JavaScript for the Usable Web takes a two-pronged approach to learning the JavaScript
    that you need to get your work done: teaching the core JavaScript that you need
    to incorporate usable interactivity into your web applications (including many
    short functional scripts), and building a real-world e-commerce application from
    scratch.


    INCLUDES:


    +   - Extensive coverage of the DOM, plus HTML for older browsers

    - Usability techniques

    - Step-by-step breakdown of JavaScript shopping cart functionality

    - Advanced data validation techniques


    Working scripts that can be incorporated into your web applications immediately


    > http://www.glasshaus.com support@glasshaus.com


