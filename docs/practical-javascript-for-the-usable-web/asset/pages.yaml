  md: '# Chapter 3


    We have if an statement:


    ```

    if (isNaN(numberToFix) && numberToFix != 0)

    ```


    In the statement there are two conditions, both of which must be true for the
    if statement''s code block to execute; otherwise, condition 1 must be TRUE AND
    condition 2 must be true for an overall result of true.


    In the first condition we use NaN() to check if decimalPlaces contains a number.
    We use the | operator to resolve the logic of the function, instead of checking
    to whether decimalPlaces is NaN (Not a Number, the JavaScript checks to see if
    it is a valid number. We don''t want to fix the user''s input to a number of decimal
    places if the user entered something invalid like `aasdad`, which clearly isn''t
    a fixed number of decimal places!


    The second condition in the if statement checks to see if numberToFix is not 0,
    because if the user hits the Cancel button then an empty string will be returned
    and Number() converts to 0. If Cancel was hit then the user wants to continue
    to convert numbers.


    Assuming a valid number was entered and the user didn''t hit Cancel the code in
    the if block goes on to ask the user how many decimal places they want the number
    fixed to. Again we check that this is a valid number using isNaN(decimalPlaces).
    If it is valid, then we write out the results of fixing the number, using the
    fixDecimalPlaces() function we''ll look at a minute.


    At the end of the while loop we ask the user if they want convert more numbers;
    we use the confirm() function to get the users response. This built-in JavaScript
    function displays a message we pass to it and the OK and Cancel buttons. If the
    user clicks OK then true is returned, if they Click then false is returned. If
    the while condition is true, in other words, OK also means the end of the code.
    Ideally, Yes and No buttons would be better than OK and Cancel but the confirm()
    function doesn''t give us that option. We see it in Chapter 5, "Windows and Frames",
    how we can create our owner pop-up boxes, which are user-friendly.


    Let''s turn to the fixDecimalPlaces() function at the top of our code. The function
    defines it as taking two parameters, fixNumber and decimalPlaces:


    ```

    function fixDecimalPlaces(fixNumber, decimalPlaces)

    ```


    The aim of this is to round off any digits after the decimal place we want: the
    decimalPlaces parameter. in other words, any cannot just round the number as would
    lose all the digits after the decimal point so we need to protect the digits by
    making them part of the whole number. We do that by multiplying the number by
    10 to the power of the digits to be saved, which we calculate here:


    ```

    var digitSaver = Math.pow(10,decimalPlaces);

    ```


    So, let''s say we want 2 decimal places. Our function multiplies this by 10 to
    the power of 2: 10 * 10 = 100, and the 100 is stored in the digitSaver variable.
    Now rounding won''t remove the digits. This is the code that saves the digits:


    ```

    Math.round(fixNumber * (digitSaver))

    ```


