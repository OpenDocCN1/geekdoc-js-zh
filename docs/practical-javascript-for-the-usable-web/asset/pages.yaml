  md: '# Passing Information Between Web Pages and Data Storage


    The if statement checks to whether we have at least the cookie name – if we haven''t

    there''s no point trying to create the cookie.


    Inside the if statement we build up a string containing the cookie and its attributes.
    We start by adding

    t name and the cookie''s value:


    ```

    var cookieDetails = cookieName + "=" + escape(cookieValue);

    ```


    Note that we escape the value, that is everything that''s not letters or numbers
    to the character

    equivalent. This is enable us to store things like the semicolon (;) that we can''t
    normally store in a

    cookie since it indicates the start of a new cookie.


    All the remaining parameters are optional and we use the ternary operator (?)
    to add them. For example:


    ```

    cookieDetails += (expires ? "expires=" + expires.toGMTString() : '''');

    ```


    If expires is undefined, the parameter is not passed to the function, then it
    will be false and

    code after the colon (:) will execute. In this case an empty string will be added
    to our

    cookieDetails string. If expires has a value, then JavaScript will evaluate it
    as true and

    code after the question mark before the colon will execute. In this case, the
    code that is added to

    cookieDetails IS "expires=" + expires.toGMTString();


    Using this technique allows us to make parameters optional, enabling the function
    to copy when one isn''t

    passed. The principle is same for the remaining parameters:


    ```

    cookieDetails += (domain ? " domain=" + domain: '''');

    cookieDetails += (path ? " path=" + path: '''');

    cookieDetails += (secureFlag ? " secure=" : '''');

    ```


    Finally, we set the document.cookie property to our cookie string:


    ```

    document.cookie = cookieDetails;

    ```


    We can call this function in a number of ways:


    ```

    writeCookie("MyCookiesName","CookiesValue");


    Var expiryDate = new Date();

    expiryDate.setMonth(expiryDate.getMonth() + 3);

    writeCookie("MyCookiesName","CookiesValue", expiryDate);


    writeCookie("MyCookiesName","CookiesValue", expiryDate, "www.mydomain.com");


    writeCookie("MyCookiesName","CookiesValue", expiryDate,

    "www.mydomain.com", "/myPath");


    writeCookie("MyCookiesName","CookiesValue", expiryDate,

    "www.mydomain.com", "/myPath", true);

    ```'
