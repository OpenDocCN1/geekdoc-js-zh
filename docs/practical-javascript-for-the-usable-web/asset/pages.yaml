  md: '# Chapter 2


    | Escape Sequences | Character Represented |

    |---|---|

    | \t | Tab |

    | \'' | Single quote |

    | " | Double quote |

    | \ | Backslash |

    | \xNN | NN is a hexadecimal number which identifies a character in the Latin-1
    character set (the Latin-1 character is the norm for English speaking countries)
    |

    | \uDDDD DDD is a hexadecimal number identifying a Unicode character |


    Let''s amend this string, which causes a syntax error:


    ```

    document.write(''Paul\''s characters'');

    ```


    so that it uses the escape sequence (''\'') and is correctly interpreted:


    ```

    document.write(''Paul\s characters'');

    ```


    The escape sequence tells the JavaScript interpreter that the single quotation
    mark belongs to the string itself and is not a delimiter.


    ASCII is a character encoding method that uses values from 0 to 254. We specify
    characters using the ASCII value in hexadecimal with the \xNN escape sequence.
    The letter C is 67 in decimal and 43 in hex, so we could write that to the page
    using the escape sequence like this:


    ```

    document.write(\x43\'');

    ```


    The \uDDDD escape sequence works in much in the same way but uses the Unicode
    character encoding method, which has 65,535 characters. As the first hundred ASCII
    and Unicode character sets are similar, you can write out the letter C using this
    escape sequence like this:


    ```

    document.write(\u0043\'');

    ```


    ASCII and UNICODE information can get quite detailed so the best place to look
    for information is on the web. For Unicode try http://www.unicode.org.


