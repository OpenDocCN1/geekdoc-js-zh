    # Minimize Variable Scope


    We discussed earlier in the chapter that variables should be kept to where they
    are needed by limiting their scope. Variables should have local scope (restricted
    to a function) unless there is a very good reason not to. If we need to pass data
    to a function it should be via the function''s parameters and not via global variables.


    # Use Variables for Just One Purpose


    It can be tempting sometimes to save on the number of variables in our code by
    using them again and again for different situations. This can result in miscellaneous
    non-descriptive names like tempNumber or tempVal. It may seem like little waste
    to declare a variable for each different calculation but it does our code more
    clear and easy to read.


    For example:


    ```

    var tempVar = prompt("Enter the degrees in Celsius",0);

    tempVal = 9 / 5 * tempVar + 32;

    ```


    What does the previous code do? The following code, despite no explanation, makes
    it clear:


    ```

    var degCelsius = prompt("Enter the degrees in centigrade",0);

    varFahrenheit = 9 / 5 * degCelsius + 32;

    ```


    We could have worked it out, with the second version of the code we can see it
    is converting degrees into Celsius versus Fahrenheit.


    Another way in which it is tempting to use variables for more than one purpose
    is flags. Let''s say we have a variable that will contain a temperature measurement,
    except if it is -9999 it flags up an error. For example, a function called getTemperature()
    returns the current temperature unless there is an error, in which case it returns
    -9999. We probably remember this when we create the function but if we come back
    to it later, or if someone else is altering the code, then it will be less obvious
    without looking at the function''s code and reading it line by line to see -9999
    signifies.


    # Remove Unused Variables


    It''s good practice when changing code to remove any variables that are no longer
    used. If we don''t do this and come back to the code later we find in lengthy
    pieces of code that we''re never quite sure if a variable is still used. This
    means we leave it in case or ever use, we use it thinking it will have the value
    we expect.


    # Functions Should Do One Thing and Do it Well


    We mentioned in the section on functions that we should design our functions to
    perform a specific task. Functions should also be cohesive, that they should be
    self-contained. There should be no reliance on some external global variable.
    If a variable is needed, it should be passed as a parameter, that we can see all
    what external information the function needs. It''s easier to create cohesive
    functions if we use a divide-and-conquer approach when deciding what functions
    we need.


    76'
