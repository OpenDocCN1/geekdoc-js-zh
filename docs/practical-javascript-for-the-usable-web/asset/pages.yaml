  md: "# The DOM: HTML for the Latest Browsers\n\n# Accessing Parts of a Document\n\
    \nThe DOM Level 1 specification is primarily concerned with traversing the document\
    \ structure and manipulating that structure.\n\n# Accessing Elements\n\nTraditionally\
    \ the browser provides a number of collections that allow JavaScript to access\
    \ parts of the document so that HTML can be used to manipulate the properties\
    \ of the document. Collections are a convenient means to access a set of nodes\
    \ within the document structure and the items within the collection can be accessed\
    \ using array notation. For example, to access an image we would use the document.images\
    \ array, or the document.forms array to access the forms within our document.\n\
    \nInternet Explorer 4 moved beyond these simple collections available with IE3\
    \ and NN4 by including document.all collection. This is a useful array, which\
    \ stores references to all elements in the document. It can be used to create\
    \ your own collections, for example:\n\n```\nvar colDivs = document.allTags(\"\
    div\"); // Collection of div elements\nvar colForms = document.allTags(\"form\"\
    ); // Collection of form elements\nvar colBolds = document.allTags(\"b\"); //\
    \ Collection of b elements\n```\n\nThe tags() method searches the elements referenced\
    \ in the all collection and returns a collection of elements with the same name\
    \ as the string value supplied as the parameter.\n\nUnfortunately, NN4 does not\
    \ have the capability to create custom collections like this – it's one of the\
    \ reasons why NN4 browsers are less flexible than IE4 browsers. Moving onwards,\
    \ Dom Level 1 provides a method that allows JavaScript to create custom collections\
    \ by using the document.getElementsByTagName() method defined in the Document\
    \ Interface:\n\n```\nvar colDivs = document.getElementsByTagName(\"div\");\nvar\
    \ colForms = document.getElementsByTagName(\"form\");\nvar colBolds = document.getElementsByTagName(\"\
    b\");\n```\n\nBoth NN6+ and IE5+ browsers have implemented this method, though\
    \ IE5+ browsers also support the document.all collection to provide backward compatibility\
    \ with the earlier version 4 browsers.\n\nBeing able to create your custom collections\
    \ is great if you need to loop through all the elements of a particular type and\
    \ perform some operation on them. For example, you could create a script that\
    \ iterate through every <b> element in a document and change the styling properties\
    \ of the element in response to a user action. The sample code below does this:\n\
    \n```\nvar colBolds = document.getElementsByTagName(\"b\");\n\nfor (var i = 0;\
    \ i < colBolds.length; i++) {\n  colBolds[i].style.color = \"red\"\n}\n```"
