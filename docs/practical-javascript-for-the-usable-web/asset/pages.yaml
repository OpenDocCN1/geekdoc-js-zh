  md: "# Passing Information Between Web Pages and Data Storage\n\n```\nvar cookieEndIndex\
    \ = cookieString.indexOf(\";\", cookieStartIndex);\n```\n\nWe now know where our\
    \ cookie's starts, and all we need is to extract the value itself from the string\
    \ using the String Object's substring() method. We do this using an if loop, that\
    \ looks for a cookieEndIndex value of -1. This is because if the cookie being\
    \ examined is the last in the cookie string, or if is only one cookie, then there\
    \ won't be a space and a semicolon won't be found. In that case, the end index\
    \ is simply the end of the string. We therefore have an if statement and two ways\
    \ of extracting the value depending on whether the \" had been found:\n\n```\n\
    if (cookieEndIndex == -1)\n{\n  var cookieValue = cookieString.substring(cookieStartIndex);\n\
    }\nelse {\n  var cookieValue = cookieString.substring(cookieStartIndex, cookieEndIndex);\n\
    }\n```\n\nOn the function's final value, we return the cookie's:\n\n```\nreturn\
    \ cookieValue;\n```\n\nThen we use the function, extracting the FirstName and\
    \ LastName values and writing them to the page.\n\n```\nvar firstName = readCookie(\"\
    FirstName\");\nvar lastName = readCookie(\"LastName\") + + firstName + \"<BR>\"\
    ;\ndocument.write(\"First name is \" + firstName);\ndocument.write(\"Last name\
    \ is \" + lastName);\n```\n\nOur readCookie() function has the benefit of being\
    \ simple, and it works on early browsers like IE3 and NN3. However, as a general\
    \ routine it has failings - if no cookie with the given name is found, for example,\
    \ the routine will fail. To combat these problems, in the next section we'll be\
    \ creating a number of more sophisticated and robust cookie routines.\n\nBefore\
    \ we do that, let's see how we can set the other cookie attributes like expires,\
    \ path, domain and scope. Note that we need to set the name and value of a cookie,\
    \ but all the other attributes are optional - we can include as many or few as\
    \ we wish. The additional attributes are added after the name/value attributes\
    \ of the cookie, and are separated by a semicolon; in a space, like this:\n\n\
    ```\ndocument.cookie = \"NameValue;expires=1 Jan 2007 00:00:00 GTM; \" + +\npath=/;\
    \ domain=www.mydomain.com; secure\";\n```\n\nWe have the expiry date (using the\
    \ expires attribute) to 1 Jan 2007 at midnight GMT. In order to delete an old\
    \ cookie altogether we just set its expiry date to a date in the past.\n\nThe\
    \ path attribute in the example has been set to / which is the top level directory,\
    \ any page on the server can read our cookie, if the page that sets it is in a\
    \ subdirectory.\n\nThe domain attribute has been set to www.mydomain.com, so the\
    \ server at mydomain.com can view the cookie as well as the server on that domain\
    \ that set the cookie."
