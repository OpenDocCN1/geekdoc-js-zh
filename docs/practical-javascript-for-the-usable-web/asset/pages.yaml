    \ we delimited the individual bits of data for an item (that is quantity, item\
    \ reference, etc.) using the grave accent ('). ). So, we split each element of\
    \ the basketItems array at the grave accent and store the resulting array. Once\
    \ we've done that we can access each bit of information for an item by accessing\
    \ the elements of the basketItem array. Having obtained all the information we\
    \ need, on the last line of the for loop we use the addItem() method to add the\
    \ item to the basket.\n\nThe for loop iterates until all the items have been added,\
    \ and the basket has been recreated as the user left it.\n\n# getTotalIncDelivery()\
    \ Method\n\nThis method gets the total of the basket plus the cost of delivery.\
    \ It is used in the final checkout page when we tell the user how much will be\
    \ deducted from their card.\n\n```\nShoppingBasket.prototype.getTotalIncDelivery\
    \ = function() {\n  var basketTotalCost = 0;\n  var basketItem;\n  var itemTotalCost\
    \ = 0;\n\n  for (basketItem in this.items) {\n    itemTotalCost = this.items[basketItem].getItemQty()\
