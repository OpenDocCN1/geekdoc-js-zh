  md: "# Chapter 8\n\nWe looked at the select control in Chapter 4, we saw that it\
    \ has an associated Select, and that this object has the options elements array\
    \ property. The options array contains an Object for each of the <option> elements\
    \ defined within the <select> element representing the select control. So, by\
    \ adding a new option to select control we need to create a new Option, set the\
    \ text it and its value (that is, the Option object's text and value properties),\
    \ and then insert it into the options array of the select object.\n\nRemoving\
    \ an option from the array is even easier – we just remove the Option object from\
    \ the options array by setting it to null.\n\nOnce Option objects have been added\
    \ or deleted from the options array, the browser instantly updates the select\
    \ control to show the addition or removal of the options. It also updates like\
    \ the length property of the options array to reflect the changes.\n\nLet's create\
    \ two generic functions – one to add an option, and second to delete an option.\
    \ Create a file SelectElementFunctions.js and we'll add them to it – this will\
    \ make it easier to include them later in our HTML pages.\n\n```\nfunction addOption(optionsArray,\
    \ insertAtIndex, optionText, optionValue) {\n  var indexCounter = optionsArray.length;\n\
    \  optionsArray[indexCounter] = new Option();\n\n  for (: indexCounter > insertAtIndex;\
    \ --indexCounter--) {\n    optionsArray[indexCounter].text = optionsArray[indexCounter\
    \ - 1].text;\n    optionsArray[indexCounter].value = optionsArray[indexCounter\
    \ - 1].value;\n    optionsArray[indexCounter].defaultSelected = optionsArray[indexCounter\
    \ - 1].defaultSelected;\n  }\n\n  var myNewOption = new Option(optionText,optionValue);\n\
    \  optionsArray[insertAtIndex] = myNewOption;\n}\n\nfunction removeOption(optionsArray,\
    \ removeIndex) {\n  optionsArray[removeIndex] = null;\n}\n```\n\nWe'll look at\
    \ the addOption function first. It takes four parameters; the first is the options\
    \ array property of the Select object associated with the select control. The\
    \ select is the index that we want to insert the new element in the options array.\
    \ Remember that arrays are zero-based, so to insert an option at the top of the\
    \ select control, we need an index of 0. The final two parameters are the text\
    \ to be displayed for the option in the select control and the value that the\
    \ option should have. (Note that it's only the value of the option that gets posted\
    \ to the server when the form is submitted.)\n\nWe're extending the options array,\
    \ so the first two lines of the function create a new \"blank\" Option object\
    \ and add it to the end of the array."
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Advanced Form Techniques


    Now, to add our option, we need to make room for it in the array at the index
    specified by the function''s parameter. We do this by moving each object below
    the index we require down the array. This is the task of the for loop. It last
    sets the text, value, and defaultselected properties of the Option object in array
    element to the properties of the Option object at the array element with indexCounter
    - 1. Setting the defaultselected property means any form reset will reset to the
    correct default value.


    We continue looping, each time to move the previous array element, until we have
    cleared a space at the array element we want to populate with our new option.


    In the final two lines of the function, we create a new Option object based on
    the optionText and optionValue parameters, and insert this into the array at index
    insertAt, overwriting the option object already there. (Although overwritten,
    the values of this object have already been written to the next object down the
    array, so the option is not lost.)


    The second function, removeOption(), is very simple - it''s barely worth a function
    of its own, but having one makes it easy to remember how to remove options.


    The two parameters, optionsArray and removeIndex, specify the array and array
    index of the option to be deleted. We use this to set the Option object in the
    options at position removeToIndex to null, which deletes the object and removes
    it from the options array. The select control updates itself to reflect this and
    removes the option from display.


    Now that we have these two functions, we will create an example that shows how
    to use them. This example consists of three form controls that can be used within
    a page collecting personal information.


    ![](img/e58f0457390096aadd869f36b1b05e3c_252_0.png)


    When the first page loads, the Male radio button is selected, and in the select
    control, the title Mr is selected. The user can however, change this selection
    to Dr or Sir. If the user selects the Female radio button, the select options
    change to Dr, Mrs, Miss, and Ms - Ms is the default option.


    With a form of this type, we must also cater for the situation where the user
    fills in the controls in the "wrong order", which chooses a title before selecting
    a gender. If the user chooses Female after selecting a Mr or Sir title, we change
    the selected title to Ms as the most generic female title. Similarly, if the user
    chooses a, Miss or Ms before changing the radio button back to Male, we change
    the selected title to Mr. However, you may also want to alert the user to the
    mismatch they have chosen.


    239'
