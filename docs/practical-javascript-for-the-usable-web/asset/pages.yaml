  md: '# # The DOM: DHTML for the Latest Browsers


    Before after the two paragraphs a white space character exists, creating new lines
    for each piece of the HTML source. This white space character is converted to
    a node in NN6 browsers, whereas in IE the white space are ignored. Hence, running
    this piece of code in IE+ browsers produces an alert box with a value of 2, whereas
    in NN6 browsers a value of 5 is returned. Obviously, this is a serious problem
    and shows, even with the DOM being standardized, the way browsers interprets the
    specifications to implement the DOM allows inconsistencies to arise. This highlights
    a difficulty in producing successful cross-browser code, when using the properties
    of Nodes that we will look at for traversing the document structure.


    From time to time, you will probably want to inspect only the first or last nodes
    of a parent. Of course, you could do this easily with the childNodes property
    as follows:


    ```

    var first = someparentNode.childNodes[0];\var last = someparentNode.childNodes[someparentNode.childNodes.length-1];

    ```


    However, it is much easier to use two other properties, firstChild and lastChild,
    which directly reference the first and last child nodes respectively.


    ```

    var first = someparentNode.firstChild;\var last = someparentNode.lastChild;

    ```


    We''ve now seen how to traverse the tree structure in downwards direction, but
    what about going back up? From each child node you can directly reference the
    parent node using a single property parentNode, as can be seen below.


    ```

    var parent = someChildNode.parentNode;

    ```


    As well as traversing and up the nodal structure, we can also traverse from side
    to side, that is, from one child node to the next. Nodes possesses two properties
    that allow this mode of traversing: nextSibling and previousSibling. As their
    names suggest, nextSibling references the next node along from a particular node
    with the same parent, and previousSibling references the node prior to the current
    node (again with the same parent).


    ```

    var next = someChildNode.nextSibling;\var previous = someChildNode.previousSibling;

    ```


    By using the firstChild and nextSibling properties, we can loop sideways through
    each of the children of a parent, rather than using the childNodes property that
    we saw previously:


    ```

    for(var n = someparentNode.firstChild; n != null; n = n.nextSibling)

    {

    // do something with the n child node

    }

    ```


    The loop initializes a variable n to the first child node of a parent. Then, after
    each successive through the loop, it is set to the child node until there are
    no more child nodes and n equals null. At this point, the loop exits.


    The diagram below summarizes the important properties of nodes that allow you
    to traverse the nodal structure of a document in either the up, down, or side-to-side
    directions.'
  merge: -1
  pgno: 216
