  md: "# Chapter 1\n\n```\nif (screen.availWidth < 650){\n document.write(\"<IMG src=SmallImage.jpg\"\
    )\n}\n```\n\nWe're using another object, the document object, to write to the\
    \ page (HTML document). The document object's write() method allows us to insert\
    \ HTML into the page. Note that document.write() doesn't actually change the source\
    \ HTML page, just the page the user sees on their computer.\n\n> In fact we'll\
    \ find document.write() very useful as we work through the book. It's good for\
    \ small examples that show how a script is writing, for communicating with the\
    \ user, and even for debugging an area of a program that you're not sure what\
    \ you think it should be. It also works on all version 4 and later Microsoft and\
    \ Netscape browsers.\n\nThe code carries on checking the size of the screen images\
    \ using the else statement. The final else only occurs if neither of the other\
    \ evaluations has resulted in code being executed, so we are assuming that the\
    \ screen is 800 * 600, and load the medium sized image accordingly:\n\n```\nelse{\n\
    \ document.write(\"<IMG src=MedImage.jpg\")\n}\n```\n\nIt's also worth noting\
    \ that we're measuring the screen size here, and the user may have a 800 * 600\
    \ screen but that doesn't mean their browser window is maximized. We may be making\
    \ the user download a bigger image than they actually need by doing things this\
    \ way.\n\nLater on we'll be working with more complex examples that use JavaScript\
    \ to ensure that the interface fits the user's screen. For now though, I hope\
    \ this simple example gives you an inkling of the kind of flexibility you can\
    \ add to your web pages using JavaScript."
