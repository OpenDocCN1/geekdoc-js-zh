  md: '# Chapter 7


    ![](img/e58f0457390096aadd869f36b1b05e3c_217_0.png)


    In this section we''ve seen how to traverse the nodal structure of the document,
    but we don''t know how much about the nodes themselves. As we move through this
    chapter you will learn more about the nodes, how to manipulate them, and how important
    traversing is.


    # Identifying Nodes


    As touched on earlier, different types of objects represent different nodes within
    the document structure. Within the DOM, all nodes are derived from a base interface
    called Node, which defines all the common methods and properties that nodes should
    possess. The Node interface is extended by other interfaces (such as Element and
    Text interfaces) to provide more specific properties for the different types of
    objects that can exist. Two properties (nodeType and nodeName) are defined by
    the Node interface to allow JavaScript to determine the type of node that is currently
    interrogated.


    All nodes have a particular type, which can be queried using the nodeType property.
    This property stores a constant numeric - a different value is stored for each
    node. By traversing through the document and testing the type of each node, JavaScript
    can selectively identify similar groups of nodes. The constant numeric values
    for each type of node are summarized in the table below.


    | Node Type | Node Type Constant Value | Node Name |

    |---|---||

    | ELEMENT_NODE | 1 | Element name |

    | ATTRIBUTE_NODE | 2 | Attribute name |

    | TEXT_NODE | 3 | #text |

    | COMMENT_NODE | 8 | #comment |

    | DOCUMENT_NODE | 9 | #document |

    | DOCUMENT_FRAGMENT_NODE | 11 | #document-fragment |


    204'
  merge: -1
  pgno: 217
- img_proc: true
  md: "# The DOM: HTML for the Latest Browsers\n\nThe third column of the table indicates\
    \ the names that the different nodes make, stored in the nodeName property. For\
    \ most types of node, this property is not particularly useful. However, with\
    \ element and attribute nodes, the value of nodeName allows us to differentiate\
    \ between nodes. Objects that represent HTML elements are extended from the DOM\
    \ interface—the value of nodeName for this type of node is equal to the name of\
    \ the HTML element. Similarly, for attributes the nodeName equals the name of\
    \ the attribute, equivalent to the name of an attribute within an HTML element.\n\
    \nKnowing this information, we can now traverse the document structure identifying\
    \ different nodes as we go. Let's have a look at an example—consider the following\
    \ section of HTML source code:\n\n```\n<p id=\"test\">Here is a <paragraph> with\
    \ some text in it. Using the <b>traversal properties </b> discussed in the previous\
    \ section and <b>node type </b> JavaScript can identify the number of <b>HTML\
    \ elements </b> within this paragraph.</p>\n```\n\nThe following recursive function\
    \ can be used to count the number of HTML elements within the paragraph above.\n\
    \n```\nfunction countHTMLElements(node)\n{\n  var sum = 0;\n  if (node.nodeType\
    \ == 1) /* Element Node test */\n    sum+=;\n    for (var i=0; i < node.childNodes.length;\
    \ i++) {\n      sum += countHTMLElements(node.childNodes[i]);\n    }\n  return\
    \ sum;\n}\n```\n\nThe function accepts a node object as a parameter and examines\
    \ it and all of its children, counting the number of Element nodes (that is, HTML\
    \ elements), and returning the number of elements encountered.\n\n```\nvar count\
    \ = countHTMLElements(document.getElementById(\"test\"))\n```\n\nThis statement\
    \ will return the number of HTML elements in the previous HTML source code and\
    \ stores the value in the count variable. In this instance, the value returned\
    \ is 5 since there are five HTML elements within this source code.\n\nChanging\
    \ the function so that the if statement tests whether the nodeType is equivalent\
    \ to 3 (that is, a text node), the modified form of the function will return a\
    \ value of 9, indicating that there are  text nodes within the HTML fragment.\
    \ With respect to text nodes, it is useful to know about another property called\
    \ value.\n\nThe value property of text nodes is a reference to the actual string\
    \ value that is displayed on a page. The property can be accessed to find the\
    \ textual value of the node, or set to change the text displayed on a page."
  merge: -1
  pgno: 218
- img_proc: true
  md: "# Chapter 7\n\nModifying the countHTMLElements() function above to include\
    \ the nodeValue property, can transform the function into one that will return\
    \ the complete textual content within an element.\n\n```\nfunction getText(node)\
    \ {\n  var txt = \"\";\n  if (node.nodeType == 3) / Text Node test */\n    txt\
    \ += node.nodeValue;\n  for(var i=0; i < node.childNodes.length; i++) {\n    txt\
    \ += getText(node.childNodes[i]);\n  }\n  return txt;\n}\n```\n\nYou should be\
    \ able to see that the nodeValue of each text node is concatenated into a string\
    \ stored in the txt variable, and the resultant string is returned. If used with\
    \ the HTML Source fragment above, all the text of the paragraph return without\
    \ any of the HTML tags.\n\nUsing the nodeValue property, we can also change the\
    \ text that is displayed within a document. The uppercase() function below obtains\
    \ the string value of the node passed as a parameter, converts it to uppercase,\
    \ and resets the nodeValue to the equivalent uppercase string.\n\n```\nfunction\
    \ uppercase(node) {\n  if (node.nodeType == 3) {\n    node.nodeValue = node.nodeValue.toUpperCase();\n\
    \  }\n}\n```\n\nYou may have used or seen the innerText. This is a proprietary\
    \ Microsoft Internet Explorer property, available with obtaining and setting the\
    \ textual content within an HTML element. its version 4+ browsers. It is not part\
    \ of the DOM specification, and is not available in other browsers, such as Netscape\
    \ Navigator. So, if you want to change the text within an element with code that\
    \ works across all browsers using DOM, then it is better to use the nodeValue\
    \ of the text node within an HTML element.\n\nWhen used in attribute nodes, the\
    \ nodeValue property allows us to read or set the value of the attribute. We will\
    \ learn more about this later in this chapter.\n\n# Manipulating the Document\n\
    \nThe ability to change the nodeValue of a text node is a very useful feature\
    \ in its own right, allowing textual content within the document to be changed\
    \ dynamically, without altering the document structure itself. However, to mutate\
    \ the document structure itself, we use various other methods that the DOM interfaces\
    \ define. This, in combination with what has already been discussed, is where\
    \ DOM becomes powerful."
  merge: -1
  pgno: 219
