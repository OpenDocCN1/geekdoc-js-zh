    \ more than happy for us to create properties by just using them, and to read\
    \ properties that have never been seen. This error isn't difficult to see in three\
    \ lines, it would be a lot harder to see if it was hidden away in the ShoppingBasket.js\
    \ file which contains over 350 lines.\n\nWhile JavaScript uses non-existent properties,\
