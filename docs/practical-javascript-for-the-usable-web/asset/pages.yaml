  md: '# Chapter 6


    CSS attempts to solve this problem by factoring the control over the appearance
    of the document


    # What is CSS?


    In its simplest form, a CSS stylesheet defines the appearance of standard HTML
    structural tags for a particular document. It does this by declaring a number
    of rules, each one in the form of:


    ```

    selector { list of style declarations }

    ```


    The following stylesheet (myfile.css) describes the appearance of various HTML
    elements in the document:


    ```

    body { background-color:black; color:white; }

    h1 { font-size:28pt; font-family:Arial; font-weight:bold; }

    th { color:lightblue; font-size:18pt; font-family:arial; font-weight:bold; }

    td { color:red; font-size:12pt; font-family:arial; font-style:italic; }

    div { font-size:18pt; font-style:italic; color:yellow; }

    ```


    The selectors in this example are standard HTML elements: <body> is defined as
    white text on a black background, <h1> is defined as 28-point bold type in the
    Arial font, and <th> is defined as light blue, and so on.


    You can include an CSS stylesheet into the HTML file that you are working on using
    the <link> element in the <head> section of the HTML page. Here is an example:


    ```

    <html>

    <head>

    <link rel="stylesheet" href="myfile.css" type="text/css">

    </head>

    <body>

    <h1>Main Heading</h1>

    <p>This is the first paragraph.</p>

    <p><div>This is the second paragraph.</div></p>

    <table>

    <tr><th>Cell 1</th></tr></tr>

    <tr><td>Value 1</td></tr></tr>

    </table>

    </body>

    </html>

    ```


    The <link> element specifies the relationship between the rel attribute of the
    external link, in this case the stylesheet, and the type of the link (text/css),
    and the href itself (myfile.css). (I''ve also added in a <div> element around
    the second paragraph to demonstrate the effect of the stylesheet on this element.)


    If you load this page (styled.html) in a CSS compliant browser such as IE4.x or
    NN4.x, you should see the page styled like this:


    166'
