    \ customer's name and address details, the second credit card details, the third\
    \ displays a summary of the order, and the fourth is simply a \"thanks for placing\
    \ your order\" page.\n\n# Obtaining Customer Name/Address Details\n\nThe PersonalDetails.html\
    \ page is listed below. Although the page is big, for the part it's basic HTML\
    \ and form controls. We'll take it piece by piece. First the top section, which\
    \ simply provides a few new styles:\n\n```\n<html>\n<head>\n  <link rel='stylesheet'\
    \ href='Web siteGlobalStyle.css'>\n  <style>\nDIV.FormElementError {\n  position:\
    \ relative;\n  left: 280px;\n  top: -20px;\n  color: red;\n  visibility: hidden;\n\
    }\n\nSPAN.FormElementError {\n  position: relative;\n  left: 280px;\n  top: -20px;\n\
    \  color: red;\n  visibility: hidden;\n}\n\ninput.TextBox {\n  width: 150px;\n\
    }\n</style>\n</head>\n```\n\nWe have a script block containing three functions.\n\
    \nThe loadForm() function is called by the window object's onload event handler,\
