    # Word And Letter Spacing


    Two other properties that are often used are `word-spacing` and `letter-spacing`.
    You can use them to control—you guessed it—the spacing between words and letters,
    respectively. Both properties support three different values that represent optimal,
    minimum and maximum spacing.'
- md: " Show & Tell uses `letter-spacing` on its navigation links.\n\nFor `word-spacing`,\
    \ setting only one value corresponds to the optimal spacing (and the other two\
    \ are set to `normal`). When setting two values, the first one corresponds to\
    \ the optimal and minimum spacing, and the second to the maximum. Finally, if\
    \ you set all three values, they correspond to all three mentioned above. With\
    \ no justification, optimal spacing is used.\n\nIt works slightly different for\
    \ `letter-spacing`. One value only corresponds to all three values. The others\
    \ work as they do for `word-spacing`.\n\nThe specifications contain a few **requests\
    \ for more information and examples** on how [white-space processing](link) will\
    \ work and how it can be used and be useful for languages such as Japanese, Chinese,\
    \ Thai, Korean, etc. So, if you'd like help out, why not give it a read (it's\
    \ not *that* long), and see how you can contribute?\n\n## Indentation And Hanging\
    \ Punctuation\n\nText indentation and hanging punctuation are two typographical\
    \ features that are **often forgotten** on the web. This is probably due to one\
    \ of three factors:\n\n- Setting them is not as straightforward as it could be;\n\
    - There has been a conscious decision not to apply them;\n- Designers simply aren't\
    \ aware of them or don't know how to properly use them.\n\n*The Sushi & Robots\
    \ Web site has hanging punctuation on bulleted lists.*\n\nSo, the **theory** is\
    \ that you should apply a small indentation to every text paragraph after the\
    \ first one. You can easily do this with an adjacent sibling combinator:\n\n```\n\
    p + p {\n  text-indent: 1em;\n}\n```\n\nThis selector targets every paragraph\
    \ (i.e. p) that follows another paragraph; so the first paragraph is not targeted.\n\
    \nAnother typographic rule of thumb is that **bulleted lists and quotes** should\
    \ be \"hung.\" This is so that the flow of the text is not disrupted by these\
    \ visual distractions.\n\nThe CSS Text Level 3 specification has an (incomplete)\
    \ reference to an [upcoming hanging-punctuation property](link).\n\nFor now, though,\
    \ you can use the `text-indent` property with negative margins to achieve the\
    \ desired effect:\n\n```\nblockquote {\n  text-indent: -0.2em;\n}\n```\n\nFor\
    \ bulleted lists, just make sure that the position of the bullet is set to `outside`\
    \ and that the container `div` is not set to `overflow: hidden`; otherwise, the\
    \ bullets will not be visible.\n\n## Web Fonts And Font Decoration\n\n### font-face\n\
    \nMuch talk has been made on the web about `font-face` and whether it's a good\
    \ thing—especially after the appearance of [Typekit](link) and [Fontdeck](link).\n\
    \nThe debate is mainly about how much visual clutter this could bring to Web designs.\
    \ Some people (the argument goes) aren't sufficiently font-savvy to be able to\
    \ pull off a design in which they are free to use basically any font they wish.\
    \ Wouldn't our sensitive designer eyes be safer if only tested, approved web-safe\
    \ fonts were used? On whatever side of the argument you fall, the truth is that\
    \ the examples of Web sites that use font-face beautifully are numerous.\n\n*Jonathan\
    \ Snook's recently redesigned Web site uses the font-face property.*\n\nThe font-face\
    \ property is fairly straightforward to grasp and use. Upload the font you want\
    \ to use to your Web site (make sure the licence permits it), give it a name and\
    \ set the location of the file.\n\nIn its basic form, this is what the font-face\
    \ property looks like:\n\n```\n1 @font-face {\n2   font-family: Museo Sans;\n\
    3   src: local(\"Museo Sans\"), url(MuseoSans.ttf) format(\"opentype\");\n4 }\n\
    ```\n\nThe two required font-face descriptors are font-family and src. In the\
    \ first, you indicate how the font will be referenced throughout your CSS file.\
    \ So, if you want to use the font for h2 headings, you could have:\n\n```\nh2\
    \ {\n  font-family: Museo Sans, sans-serif;\n}\n```\n\nWith the second property\
    \ (`src`), we are doing two things:\n\nIf the font is already installed on the\
    \ user's system, then the CSS uses the local copy instead of downloading the specified\
    \ font. We could have skipped this step, but using the local copy saves on bandwidth.\n\
    \nIf no local copy is available, then the CSS downloads the file linked to in\
    \ the URI. We also indicate the format of the font, but we could have skipped\
    \ that step, too.\n\nFor this property **to work in IE**, we would also need the\
    \ EOT version of the font. Some font shops offer multiple font formats, including\
    \ EOT, but in many cases we will need to convert the TrueType font using Microsoft's\
    \ own [WEFT](https://www.microsoft.com/typography/web/embedding/weft.aspx), or\
    \ another tool such as [ttf2eot](https://github.com/fontforge/fontforge/blob/master/contrib/fonttools/ttf2eot.c).\n\
    \nSome **good resources** for finding great fonts that can be used with `font-face`\
    \ are [Font Squirrel](https://www.fontsquirrel.com/) and [Fontspring](https://www.fontspring.com/).\n\
    \n### text-shadow\n\nThe `text-shadow` property allows you to **add a shadow to\
    \ text easily** and purely via CSS. The shadow is applied to both the text and\
    \ text decoration if it is present. Also, if the text has `text-outline` applied\
    \ to it, then the shadow is created from the outline rather than from the text.\n\
    \nWith this property you can set the horizontal and vertical position of the shadow\
    \ (relative to the text), the color of the shadow and the blur radius. Here is\
    \ a complete text-shadow property:\n\n```\np {\n  text-shadow: #000000 1px 1px\
    \ 1px;\n}\n```\n\nBoth the color and blur radius (the last value) are optional.\
    \ You could also use an RGBa color for the shadow, making it transparent:\n\n\
    ```\np {\n  text-shadow: rgba(0, 0, 0, 0.5) 1px 1px 1px;\n}\n```\n\nHere we define\
    \ the R, G and B values of the color, plus an additional alpha transparency value\
    \ (hence the a, whose value here is 0.5).\n\nThe specification still has some\
    \ open questions about text-shadow, like how should the browser behave when the\
    \ shadow of an element overlaps the text of an adjoining element? Also, be aware\
    \ that multiple text shadows and the text-outline property may be dropped from\
    \ the specification.\n\n## New Text-Decoration Properties\n\nOne problem with\
    \ the `text-underline` property is that it gives us little control. The [latest\
    \ draft of the specification](http://), however, **suggests new and improved properties**\
    \ that may give us fine-grained control. You can't use them yetmodem, but we'll\
    \ give you a condensed sneak peek at what may come.\n\n**`text-decoration-line`**\n\
    Takes the same values as `text-decoration`: none, `underline`, `overline` and\
    \ `line-through`.\n\n**`text-decoration-color`**\nSpecifies the color of the line\
    \ of the previous property.\n\n**`text-decoration-style`**\nTakes the values of\
    \ solid, double, dotted, dashed and wave\n\n**`text-decoration`**\nThe shorthand\
    \ for the three preceding properties. If you specify a value of only one of `none,\
    \ underline, overline` or `line-through`, then the property will be backwards-compatible\
    \ with CSS Level 1 and 2. But if you specify all three values, as in `text-decoration:\
    \ red dashed underline`, then it is ignored in browsers that don't support them.\n\
    \n**`text-decoration-skip`**\nSpecifies whether the text decoration should skip\
    \ certain types of elements. The proposed values are `none`, `images`, `spaces`,\
