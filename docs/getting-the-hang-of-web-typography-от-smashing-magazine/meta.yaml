    ![](img/45c2114e61862fb7d9e9d1d966d826ec_29_0.png)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_29_1.png)


    # ## 4. Consistency


    Consistency is often regarded as an important technique for usability, but it
    also applies to readability. Consistency in the hierarchy is important to a user-friendly
    layout. This means that all headers of the same importance in the hierarchy should
    be the same size, color and font. For example, all `<h1>` headers in an article
    should look identical. Why? This consistency provides users with a familiar focus
    point when they are scanning, and it helps to organize the content.


    # ## 5. Density of Text


    Density of text refers to the amount of words you place in one area. Density'
  merge: -1
  pgno: 29
