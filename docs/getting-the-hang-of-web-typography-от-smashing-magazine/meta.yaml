  - '[PAGE 116]


    Unfortunately, it''s not as simple as just picking fonts that are very, very different
    — placing our candy cane font next to, say, Garamond or Caslon does not guarantee
    us typographic harmony. Often, as in the above example of Helvetica and Bembo,
    there''s no real explanation for why two faces complement each other — they just
    do.


    But if we want some principle to guide our selection, it should be this: often,
    two typefaces work well together if they have one thing in common but are otherwise
    greatly different. This shared common aspect can be visual (similar [x-height](link)
    or [stroke weight](link)) or it can be chronological. Typefaces from the same
    period of time have a greater likelihood of working well together... and if they
    are by the same designer, all the better.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_116_0.png)


    # ## 4. A Little Can Go a Long Way


    ''Enough with all these conventional-looking fonts and rules!'' you say. ''I need
    something for my rave flyer! And my Thai restaurant menu! And my'
  - '[PAGE 117]


    Christmas cards!'' What you''re pointing out here is that all the faces I''ve
    discussed so far are ''body typefaces'', meaning you could conceivably set a whole
    menu or newspaper with any of them; in the clothing analogy presented in part
    one, these are our everyday Levis. What of our Halloween flares?


    Periodically, there''s a need for a font that oozes with personality, whether
    that personality is warehouse party, Pad Thai or Santa Claus. And this need brings
    us into the vast wilderness of Display typefaces, which includes everything from
    Comic Sans to our candy-cane and bunny fonts. ''Display'' is just another way
    of saying ''do not exceed recommended dosage'': applied sparingly to headlines,
    a display font can add a well-needed dash of flavor to a design, but it can quickly
    wear out its welcome if used too widely.


    # Sophisticated Use of Accents


    Time for another clothing analogy – take a look at the following photography.'
  - '[PAGE 118]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_118_0.png)


    (Photo credit: Betsssssy. Used under Creative Commons licence.)


    Betsey''s outfit works because the pink belt acts as an accent and is offset by
    the down-to-earthiness of blue jeans. But if we get carried away and slather Betsey
    entirely in pink, she might wind up looking something like being dressed for a
    carnival parade.'
  - '[PAGE 119]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_119_0.png)


    *(Photo credit: Phillip Leroyer. Used under Creative Commons licence.)*


    Let''s call this the Pink Belt Principle of Type: display faces with lots of personality
    are best used in small doses. If we apply our cool display type to every bit of
    text in our design, the aesthetic appeal of the type is quickly spent and — worse
    yet — our design becomes very hard to read. Let''s say we''re designing a menu
    for our favorite corner Thai place. Our client might want us to use a ''typically''
    Asian display face, like Sho:


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_119_1.png)


    So far, so good. But look what happens when we apply our prized font choice to
    the entire menu:'
  - '[PAGE 120]


    # # HOUSE OF THAI


    OPEN MONTRL 8:12. MAJOR CREDIT CARDS ACCEPTED


    | APPETIZERS | |

    |---|---|

    | SATAY | $5.99 |

    | FRIED SHRIMP | $6.99 |

    | SPRING ROLLS | $6.50 |


    | NOODLES | |

    |---|---|

