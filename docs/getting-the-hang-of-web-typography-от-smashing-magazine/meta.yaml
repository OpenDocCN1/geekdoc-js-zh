    \n## 对齐与断字\n\n在线控制断字是比较棘手的。设置自动断字时需要考虑许多因素，例如不同语言适用不同规则这一点。以葡萄牙语为例，单词只能在音节末尾处断字；对于双辅音，连字符必须恰好位于中间位置。\n\
