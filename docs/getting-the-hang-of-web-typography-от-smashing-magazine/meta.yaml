    | [Fontdeck](https://fontdeck.com/) | 600 | 按使用量付费 | 免费 / $2.50 及以上 | 年付 |

    | [Fonts Live](https://www.fontslive.com/) | 499 | 字体质量 | 字体起步价 $10 | 年付 |

    | [TypeFront](https://typefront.com/) | 不适用 | 自助服务 | 方案起步价 $5 | 月付 |

    | [Fontspring](https://www.fontspring.com/) | 1,937 个字体族 | 无持续费用 | 免费至数百美元 | 一次性付费
    |

    | [Fonts.com](https://www.fonts.com/) | 7,500+ | 字体选择丰富 | 免费或最高 $500 | 30 天 |

    | [Google Fonts](https://fonts.google.com/) | 60 | 易于实现 | 免费 | 不适用 |

    | [Kernest](https://kernest.com/) | 2,450 | 大多数字体免费 | 免费或最高 $15 | 一次性付费 |

    | [Typotheque](https://www.typotheque.com/) | 524 | 无限网站使用 | 桌面授权的 20% | 一次性付费
    |

    | [WebINK](https://www.webink.com/) | 2,000 | 价格实惠 | 方案起步价 $0.99 | 月付 |


    *本文所评测服务的快速概览*


    ## 总结


    Web 字体服务，像任何相对较新的热门技术一样，既复杂又在迅速发展。虽然没有"完美"的服务，但看到如此多样的公司进入这一行业并不断提升 Web 字体的标杆，前景令人期待。


    ## 如何从你的服务器嵌入 Web 字体


    *作者：Ralf Hermann*


    你不一定需要租赁或授权字体才能在网页上使用。你也可以将已获得授权的桌面字体进行跨浏览器的 Web 字体嵌入处理，然后将字体上传到你自己的 Web 服务器。


    ## 选择字体与避免使用的字体


    在开始将桌面字体转换为 Web 字体之前，请确保你使用的字体的授权许可允许你这样做。一般来说，商业授权协议不允许将字体软件存储在可公开访问的 Web 服务器上。然而，这正是使用
    `@font-face` 规则的前提条件。


    目前，商业字体供应商依赖于 [Web 字体嵌入服务](https://example.com)。只有少数供应商提供可在客户自有 Web 服务器上存储的特殊
    Web 字体包，其中包括 FSI FontShop International 和 Fontspring。


    一旦 Web Open Font Format（WOFF）被接受为标准，可能会有更多的字体供应商提供这项服务。


    ## 嵌入免费和开源字体


    除了商业字体外，还有大量免费和开源字体可以嵌入到你的网页中。一份列有明确可通过 @font-face 嵌入免费使用的合适字体的清单，可以在 [webfonts.info](https://webfonts.info)
    上找到。


    fontsquirrel.com 也提供了大量此类字体的合集。此外，FONTSQUIRREL 是将桌面字体转换为 Web 字体格式的最佳去处，因为它提供了一个强大的工具——@font-face
    Kit Generator。


    ### 请注意，你想要转换的字体必须在法律上有资格进行 Web 字体嵌入！


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_221_0.png)


    *使用 [Font Squirrel](https://fontsquirrel.com) 生成器轻松创建 Web 字体。*


    ## 使用 @font-face Kit Generator


    为了进行实际测试，你可以下载字体包 Graublau Sans Web。该字体包提供了一个基于 PostScript 的 OpenType 字体，实际上可以直接在
    Safari 3.1 或更高版本、Firefox 3.5 或更高版本以及 Opera 10 或更高版本上使用，无需任何修改。


    为了对 Internet Explorer 提供浏览器支持并改善屏幕显示效果，我们将启动 @font-face Kit Generator。点击 **Add
    Fonts** 按钮，上传相应字体及其所有字重。选择 **Expert** 单选按钮，并勾选所有必要的选项，接下来我们将逐一详细介绍。


    ## 字体格式


    你必须激活 **EOT** 才能获得 Internet Explorer（IE4 到 IE8）上的 @font-face 支持。从 IE9 开始，WOFF
    也获得了支持。SVG 字体主要需要用于 iPhone 和 iPad 上的 Mobile Safari，不过 Chrome 和 Opera 也可以处理这种格式。作为
    **SVG** 的替代方案或补充，还有压缩版本 **SVGZ**，它提供更小的文件大小。遗憾的是，它无法在 iPhone 上运行，因此你仍然需要 SVG 字体。


    创建 **TrueType** 字体格式将支持 Safari（自 3.1 版本起）、Firefox（自 3.5 版本起）和 Opera（自 10 版本起）。请注意，该生成器不会创建压缩的
    EOT 文件。作为变通方法，你可以使用 [EOTfast](EOTFast) 工具来**优化文件大小**。


    如今勾选 WOFF 选项虽然不会增加浏览器支持，但在不远的将来，当 WOFF 成为标准 Web 字体格式时，它一定会发挥作用。


    ## 渲染和其他选项


    **Add Hinting** 选项可在 Windows 上提供改进的字体显示效果。只有在你完全确定相应字体已经过屏幕优化时，才应取消勾选它。


    **WebOnly™** 会添加特定的修改，使浏览器能够使用修改后的字体，但避免这些字体在常见操作系统上被安装。勾选此选项有助于防止无意中的盗版复制。


    桌面字体可能包含许多 OpenType 功能。由于目前浏览器对这些功能的支持较少，你可能希望通过此选项（**渲染和其他选项**）将它们移除。为了保留一些标准的、即已受支持的
    OpenType 功能（如连字），你可以激活 **Keep OT Features** 选项。


    减小文件大小的另一种方法是勾选 **Remove Kerning** 选项，这将删除针对特定字母组合所包含的所有[字距调整](https://en.wikipedia.org/wiki/Kerning)值。如果你打算将字体用于正文文本，此选项实际上是推荐使用的。对于标题，则应谨慎处理或完全不做此项操作，因为缺少字距调整值可能会导致文字形状看起来像瑞士奶酪一样难看。


    **Simplify Outlines** 选项的作用顾名思义：它尝试简化字符的轮廓。由于此选项会降低屏幕显示质量，因此不建议使用。


    此外，还有一个 **Build Cufón File** 选项，它并不直接属于 @font-face 嵌入选项的一部分。[Cufón 的工作原理](https://)在本电子书的另一篇文章中有解释。你也可以访问
    [Cufón](https://) 网站了解更多详情。

    '
