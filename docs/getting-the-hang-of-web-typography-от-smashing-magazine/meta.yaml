  md: 'Christmas cards!'' What you''re pointing out here is that all the faces I''ve
    discussed so far are ''body typefaces'', meaning you could conceivably set a whole
    menu or newspaper with any of them; in the clothing analogy presented in part
    one, these are our everyday Levis. What of our Halloween flares?


    Periodically, there''s a need for a font that oozes with personality, whether
    that personality is warehouse party, Pad Thai or Santa Claus. And this need brings
    us into the vast wilderness of Display typefaces, which includes everything from
    Comic Sans to our candy-cane and bunny fonts. ''Display'' is just another way
    of saying ''do not exceed recommended dosage'': applied sparingly to headlines,
    a display font can add a well-needed dash of flavor to a design, but it can quickly
    wear out its welcome if used too widely.


