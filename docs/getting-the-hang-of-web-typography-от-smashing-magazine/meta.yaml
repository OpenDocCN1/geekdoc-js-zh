    \n## Typetester\n\nTypetester 允许你并排试顶多三种字体。这是测试字体栈以查看字体降级时差异的好方法。你可以使用系统中的任何字体，不过它会将字体按网页安全字体、Windows\
    \ 默认字体和 Mac 默认字体分类，让你无需其他参考资料就能更轻松地创建字体栈。\n\n## 字体栈构建器\n\nCode Style 提供了字体栈构建器（Font\
    \ Stack Builder），用于根据字体家族以及字体是否通常安装在 Windows、Mac 或 Linux 机器上来创建字体栈。你可以添加任意数量的字体，它会以网格形式展示这些字体在不同类型机器上的普及程度。\n\
    \n## CSS 3 带来的新排版可能性\n\n作者：Inayaili de León\n\n在过去几年中，网页排版受到了越来越多真诚的关注。大多数网站依赖文字来传达信息，因此文字受到\
    \ utmost 关注也就不足为奇了。在本文中，我们将介绍一些有用的技巧和巧妙的效果，它们利用样式表的功能以及即将推出的 CSS Text Level 3\
    \ 规范的一些特性，为网页设计师提供更精细的文字控制。\n\n请记住，这些**新特性和技术要么是新出现的，要么仍在开发中**，一些最流行的浏览器目前还不支持它们。但我们认为，作为一位见多识广、充满好奇心的网页设计师，了解即将出现的技术并能够在项目中进行实验是很重要的。\n\
    \n## 基础一览\n\n初出茅庐的网页设计师最常犯的 CSS 相关错误之一，就是创建包含**太多类和 ID** 的不灵活的样式表，难以维护。\n\n假设你想更改文章中标题的颜色，同时保持网站上其他标题的默认颜色。\n\
    \n与其给每个标题都加上 `big-red` 类，不如明智地利用包裹文章的 `DIV` 类（可能是 `post`），并创建一个选择器来定位你想修改的标题，如下所示：\n\
    \n```\n.post h2 {\n  font-weight: bold;\n  color: red;\n}\n```\n\n这只是一个小小的提醒：没有必要为所有想要用\
    \ CSS 设置样式的元素都添加类，尤其是文字。**保持简单**。\n\n## 字体属性\n\n不必分别指定每个属性，你可以使用字体简写属性一次性完成。属性的顺序应如下：`font-style`、`font-variant`、`font-weight`、`font-size`、`line-height`、`font-family`。\n\
    \n使用字体简写时，任何未指定的值**将被其父值替换**。例如，如果你只定义了 `12px Helvetica, Arial, sans-serif`，那么\
    \ `font-style`、`font-variant` 和 `font-weight` 的值将被设置为 `normal`。\n\n字体属性还可以用来**指定系统字体**：`caption`、`icon`、`menu`、`message-box`、`small-caption`、`status-bar`。这些值将基于当前使用的系统，因此会根据用户的偏好而有所不同。\n\
    \n## 其他字体属性\n\n有些与字体相关的属性和值并不常用。例如，与其使用 `text-transform` 将文字转为全大写，不如使用 `font-variant:\
    \ small-caps` 来获得更优雅的效果。\n\n你还可以非常具体地指定[字体的粗细](https://example.com)，而不只是使用常见的\
    \ `regular` 和 `bold` 属性。CSS 允许你用从 `100` 到 `900` 的值来指定字体重量（即 `100`、`200`、`300`\
    \ 等）。如果你决定使用这些值，要知道 `400` 值代表 `normal` 粗细，而 `700` 代表 `bold`。如果未为字体指定粗细，它将默认继承父级的粗细。\n\
    \n另一个有用的属性是 `font-size-adjust`，遗憾的是目前仅在 Firefox 中受支持。它允许您在调用后备字体时指定一个纵横比。这样，如果替代字体比首选字体小，文字的\
    \ x 高度将得到保留。关于 `font-size-adjust` 工作原理的详细解释，可以在 [W3C](https://w3.org) 网站上找到。\n\
    \n## 处理空白、换行和文本换行\n\n有几个 CSS 属性处理这些问题，但相关规范仍在制定中（处于\"工作草案\"阶段）。\n\n## 空白\n\n`white-space`\
    \ 属性允许你指定它所服务的一组属性的组合：[`white-space-collapsing`](https://example.com) 和 [`text-wrap`](https://example.com)。以下是每个属性的含义分解：\n\
    \n- `normal`\n  - white-space-collapsing: collapse/text-wrap: normal\n- `pre`\n\
    \  - white-space-collapsing: preserve/text-wrap: none\n- `nowrap`\n  - white-space-collapsing:\
    \ collapse/text-wrap: none\n- `pre-wrap`\n  - white-space-collapsing: preserve/text-wrap:\
    \ normal\n- `pre-line`\n  - white-space-collapsing: preserve-breaks/text-wrap:\
    \ normal\n\n如果你想在网站**显示代码片段**并保留换行和空格，这个属性会很有用。将容器设置为 `white-space: pre` 将保留格式。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_147_0.png)\n\n*WordPress 后台中 nowrap\
    \ 的使用。*\n\nWordPress 在其仪表板上使用 `white-space: nowrap`，这样如果表格单元格太小，显示文章和评论数量的数字就不会换行。\n\
    \n## 自动换行\n\n一个已经被广泛使用的属性是 `word-wrap`。它支持两个值之一：`normal` 和 `break-word`。如果你将 `word-wrap`\
    \ 设置为 `break-word`，且某个词太长以至于会溢出容器，它将在随机点断开以便在容器内换行。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_148_0.png)\n\
    \n*国际大猩猩保护计划网站对其评论者姓名使用 `word-wrap`。*\n\n理论上，`word-wrap: break-word` 只应在 `text-wrap`\
    \ 设置为 `normal` 或 `suppress`（抑制换行）时允许。但实际上，目前即使 `text-wrap` 设置为其他值，它也能工作。\n\n请记住，根据规范，`word-break`\
    \ 属性的 `break-strict` 值有被删除的风险。\n\n## 单词和字母间距\n\n另外两个常用的属性是 `word-spacing` 和 `letter-spacing`。你可以用它们来控制——你猜对了——单词之间和字母之间的间距。这两个属性都支持三个不同的值，分别代表最佳间距、最小间距和最大间距。\n"
