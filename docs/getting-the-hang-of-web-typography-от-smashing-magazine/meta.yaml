  raw:
  - '[PAGE 90]


    This limitation in choice, however, will soon be overcome by the use of the [@font-face
    rule](https://example.com) and [web font embedding services](https://example.com).


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_90_0.png)


    # ## 2. Which Typeface Is Most Popular?


    Surprisingly, despite the growing popularity of font replacement techniques and
    growing availability of new pre-installed fonts (e.g. Windows Vista and Mac fonts),
    designs in our study mainly used the traditional, core Web fonts, the only exceptions
    being Lucida Grande (which comes installed only on Macs), Helvetica and Baskerville.'
  - '[PAGE 91]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_91_0.png)


    As one would expect, Arial, Georgia and Verdana are used for the majority of body
    copy today. In our study, around 80% of Web sites used one of these three fonts.
    For the remaining 20%, designers'' favorite Helvetica is a popular choice, as
    is Lucida Grande.


    With options such as Verdana and Arial available as fall-backs, a designer really
    has no reason not to specify other non-standard fonts to achieve the best effect.


    You can learn more about advanced **CSS font stacks** in this book''s article
    [Guide to CSS Font Stacks](guide-to-css-font-stacks)


    Further **resources on the web** are Nathan Ford''s article Better CSS Font Stacks
    and CodeStyle''s Build Better CSS Font Stacks.


    # ## Popular Types for Headlines


    Verdana is used minimally for headlines. Only 10 Web sites use it for body copy
    to begin with, and only four use it for headlines. The main reason is'
  - '[PAGE 92]


    that Verdana puts a lot of spacing between letters, which makes it not as tidy
    to read at a large size.


    If you are going to use Verdana for headlines, you may want to take advantage
    of the CSS letter-spacing property. Georgia and Arial are the most popular fonts
    for headings.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_92_0.png)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_92_1.png)


    PREFACE


    I ''m **JON TAN**, designer and founding member of ANALOG, co-founder of FONTDECK,
    and infrequent writer and speaker.


    LATELY *in the* LOG


    # Web Fonts, Dingbats, Icons, and Unicode

    — *Wed, 18th Aug 2010* {7}

    Yesterday, Cameron Koczon shared a link to the dingbat t Pictos, by the talented,
    Drew Wilson. Cameron predicted


    *[Jon Tan](https://example.com)* uses serif typeface Baskerville for headlines
    and serif typeface Georgia for body copy.'
  - '[PAGE 93]


    Finally, we note that “alternative” fonts are used much more for headlines than
    for body copy. Designers seem more willing to experiment with their headings than
    with the main body. If you want to bring some typographic variation into your
    next design, headings may be the easiest place to start.


    # ## 3. Light Or Dark Background?


    We were curious to learn the extent to which designers were willing to experiment
    with dark background colors. We looked out for any typography-oriented Web sites
    that had a dark color scheme and were surprised to find not a single one.'
  - '[PAGE 94]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_94_0.png)


    *The New Yorker* has a light color scheme, with *Times New Roman* used for headlines
    and body copy.


    Pure white background for body copy won by a landslide. However, many of the designs
    avoid the high contrast of pure white on pure black; text color is often made
    a bit lighter than pure black. Designers clearly focus on legibility and avoid
    experimenting with background colors. The contrast of black on white is easy to
    read and is, at least among these Web sites, the status quo.'
  - '[PAGE 95]


    # 4. Average Font Size For Headlines


    Of course, the choice of headline font size depends on the font used in the design.
    In any case, in our study by far the most popular font sizes ranged from 18 to
    29 pixels, with 18 to 20 pixels and 24 to 26 pixels being the most popular choices.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_95_0.png)


    Our study didn''t yield any clear winners. The average font size for headings
    is 25.6 pixels. But note that any size between 18 and 29 pixels could be effective;
    it depends, after all, on how your headings fit the overall design of your Web
    site. Still, you could try experimenting with larger sizes, because displays are
    always getting larger, as are display resolutions.


    An obvious outlier is Wilson Miner (screenshot below), who uses a massive font
    size of 48 pixels for his headlines. His Web site is a special case, though, because
    all of his posts have extremely short titles, only a few words.'
  - '[PAGE 96]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_96_0.png)


    # 5. Average Font Size For Body Copy


    Do you remember about seven years ago when Web designs had tiny, barely readable
    elements, and body copy was set to 8 pixels in Tahoma? Small font sizes are out,
    and more and more modern designers are turning to large font sizes. From our sample
    size, we saw a clear tendency towards sizes between 12 and 14 pixels. The most
    popular font size (38%) is 13 pixels, with 14 pixels slightly more popular than
    12 pixels. Overall, the average font size for body copy is 13 pixels.'
  - '[PAGE 97]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_97_0.png)


    We noted (as one would expect) more and more attention being paid to the smallest
    typographic details. Dashes, quotes, footnotes, author names, introductory text
    and paragraphs have been carefully set, with optimal legibility in mind. Type
    setting is usually very consistent, with a lot of white space, leading and padding.'
  - '[PAGE 98]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_98_0.png)


    [Typographica](http://) uses a large font size for the introductory paragraphs
    of its articles, and then reverts to a normal size for the rest of text.


    # Heading to Body Font-Size Ratio


    To better understand the relationship between heading and body font size, we divided
    each Web site''s heading font size by its body font size. We took the average
    of these ratios and derived a rule of thumb for you to work with:


    **Heading font size ÷ Body copy font size = 1.96**


    The overall value, then, is 1.96. This means that when you have chosen a font
    size for your body copy, you may want to multiply it by 2 to get your heading
    font size. This, of course, depends on your style; the rule of thumb won''t necessarily
    give you the optimal size for your particular design. Another option is to use
    a traditional scale (6, 7, 8, 9, 10, 11, 12, 14, 16, 18, 21, 24, 36, 48, 60, 72)
    or the Fibonacci sequence (e.g. 16 – 24 – 40 – 64 – 104) to get natural typographic
    results.'
  - '[PAGE 99]


    # ## 6. Optimal Line Height For Body Copy


    Leading (or line height) will always depend on your chosen font size and measure
    (or line length). Generally, the longer the measure, the longer the leading should
    be. Therefore, presenting a chart of the most popular choices for leading in pixels
    wouldn''t make sense here.


    # ### Relative units are often more appropriate


    More appropriate would be for you to use a relative unit, such as an **em** or
    **percentage value**, that determines the relation between leading and measure
    and between leading and font size.


    According to our study:


    **line height (pixels) ÷ body copy font size (pixels) = 1.48**


    Note that 1.5 is a value that is commonly recommended in classic typographic books,
    so our study backs up this rule of thumb. Very few Web sites use anything less
    than that. The number of Web sites that go above 1.48 decreases as you get further
    from this value.


    **line length (pixels) ÷ line height (pixels) = 27.8**


    The average line length is 538.64 pixels (excluding margins and paddings) which
    is pretty large, considering that many Web sites still use 12 to 13 pixels for
    their body copy font size.


    **space between paragraphs (pixels) ÷ line height (pixels) = 0.754**


    We were surprised by this result. It turns out that paragraph spacing (i.e. the
    space between the last line of one paragraph and the first line of the next) rarely
    equals the leading (which would be the main characteristic of perfect vertical
    rhythm). More often, paragraph spacing is just 75% of the'
  - '[PAGE 100]


    paragraph leading. The reason may be that leading usually includes the space taken
    up by descenders, and because most characters do not have descenders, additional
    white space is created under the line.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_100_0.png)


    *AIGA* is a perfect example of optimal leading. Its font size is 13.21 pixels
    (converted from ems) and its line height is 19.833 pixels (conversion from ems).
    In fact, 19.8333 ÷ 13.2167 = 1.5011.


    So, once you have decided on your body copy font size, multiplying this value
    by 1.5 will give you the optimal line height. Once you''ve got that, you can multiply
    this new value by 27.8 to get your optimal line length. Note that the layout will
    also need gutters, margins and padding to let the body copy breathe. There are
    handy [tools](https://example.com) that help you figure out the best lead.'
- md: " # Faster-growing flu vaccine could speed production\n\n> 20 August 2009\n\
    > Magazine issue 2722. Subscribe and get 4 free issues.\n> For similar stories,\
    \ visit the Epidemics and Pandemics Topic Guide\n\nAS THE world awaits the next\
    \ wave of the swine flu pandemic, delays plague vaccine production. Now new, faster-growing\
    \ strains of the vaccine virus could speed up the process.\n\nThe first batches\
    \ of pandemic vaccine were made in early August. After testing is completed, the\
    \ rate of vaccination will depend on how fast the vaccine virus can be grown in\
    \ chicken eggs. So far even the best strains have grown disappointingly slowly,\
    \ at half the rate of ordinary flu vaccine strains. The US admitted late last\
    \ week that it will have only 45 million doses of vaccine by mid-October, compared\
    \ with the 120 million it originally forecast.\n\nNow researchers at the New York\
    \ Medical College in Valhalla have created improved strains by growing one sample\
    \ of the virus repeatedly in chicken eggs until it adapted and grew faster. They\
    \ will send two to vaccine manufacturers this week, says John Wood of the UK's\
    \ National Institute for Biological Standards and Control (NIBSC).\n\n*The New\
    \ Scientist* has 20 pixels of spacing between paragraphs.\n\n# 7. How Many Characters\
    \ Per Line?\n\nAccording to a classic rule of web typography, 55 to 75 is an optimal\
    \ number of characters per line. Surprisingly, our study shows that most Web sites\
    \ have a higher number. We counted how many characters could fit on one line using\
    \ the design's default font size. The result, which is an average of 88.74 characters\
    \ per line (maximum), is extremely high. Of course, this maximal number is different\
    \ from the average number of characters per line, which in general ranges between\
    \ 75 and 85 characters per line. Still, the range is way above the conventional\
    \ range — quite peculiar.\n\nBetween 73 and 90 characters per line is a popular\
    \ choice among designers, yet we also found outliers: Monocle (47 characters per\
    \ line) and Boxes and Arrows (125 characters per line). To get a more exact reading\
    \ for each Web site, you would need to take an average character count from multiple\
    \ lines.\n\n## Other Findings\n\n46% of Web sites underlined the links in their\
    \ body copy, while the others highlighted only with color or a bold font weight.\
    \ 6% of Web sites used some kind of image replacement for headings or body copy\
    \ (e.g. Monocle, New Yorker, Newsweek). 96% of Web sites do not justify text.\n\
    \nWeb sites gave their text a left padding of on average 11.7 pixels (counting\
    \ from the left content area border).\n\n# Conclusion\n\nThe study shows a clear\
    \ set of common practices and guidelines for setting type in Web design. Note,\
    \ though, that **these findings are not scientific** and should serve only as\
    \ rough guidelines:\n\n- Either serif or sans-serif fonts are fine for body copy\
    \ and headings, but **sans-serif fonts are still more popular for both**.\n- Common\
    \ choices for **headlines** are:\n  - Georgia,\n  - Arial and\n  - Helvetica.\n\
    - Common choices for **body copy** are:\n  - Georgia,\n  - Arial,\n  - Verdana\
    \ and\n  - Lucida Grande.\n- The most popular **font size for headings** is a\
    \ range between 18 and 29 pixels\n- The most popular **font size for body copy**\
    \ is a range between 12 and 14 pixels.\n- Header font size ÷ Body copy font size\
    \ = 1.96.\n- Line height (pixels) ÷ body copy font size (pixels) = 1.48.\n- Line\
    \ length (pixels) ÷ line height (pixels) = 27.8.\n- Space between paragraphs (pixels)\
    \ ÷ line height (pixels) = 0.754.\n- The optimal number of characters per line\
    \ is between 55 and 75, but between 75 and 85 characters per line is more popular.\n\
    - Body text is left-aligned, image replacement is rarely used and links are either\
    \ underlined or highlighted with bold or color.\n\nOf course these \"rules\" aren't\
    \ set in stone. Rather, they are a set of rough guidelines that you can use as\
    \ a basis for setting typography. Every Web site is unique, and you may want to\
    \ modify your choices at each stage of your design to suit your layout. You can\
    \ also take a look at the spreadsheet of the study and export its data for further\
    \ analysis.\n\n# The Typography Dress Code: Principles of Choosing and Using Typefaces\n\
    \n*By Dan Mayer*\n\nFor many beginners, the task of picking fonts is a mystifying\
    \ process. There seem to be endless choices — from normal, conventional-looking\
    \ fonts to novelty candy cane fonts and bunny fonts — with no way of understanding\
    \ the options, only never-ending lists of categories and recommendations. Selecting\
    \ the right typeface is a mixture of firm rules and loose intuition, and takes\
    \ years of experience to develop a feeling for. Here are five guidelines for picking\
    \ and using fonts that I've developed in the course of using and teaching typography.\n\
    \n## Dress For The Occasion\n\nMany of my beginning students go about picking\
    \ a font as though they were searching for new music to listen to: they assess\
    \ the personality of each face and look for something unique and distinctive that\
    \ expresses their particular aesthetic taste, perspective and personal history.\
    \ This approach is problematic, because it places too much importance on individuality.\n\
    \nFor better or for worse, picking a typeface is more like getting dressed in\
    \ the morning. Just as with clothing, there's a distinction between typefaces\
    \ that are expressive and stylish versus those that are useful and appropriate\
    \ to many situations, and our job is to try to find the right balance for the\
    \ occasion. **While appropriateness isn't a sexy concept, it's the acid test that\
    \ should guide our choice of font.**\n\nMy \"favorite\" piece of clothing is probably\
    \ an outlandish pair of 70s flare bellbottoms that I bought at a thrift store,\
    \ but the reality is that these don't make it out of my closet very often outside\
    \ of Halloween. Every designer has a few favorite fonts like this — expressive\
    \ personal favorites that we hold onto and wait for the perfect festive occasion\
    \ to use. More often, I find myself putting on the same old pair of Levis morning\
    \ after morning. It's not that I like these better than my cherished flares exactly…\
    \ I just seem to wind up wearing them most of the time.\n\nEvery designer has\
    \ a few workhorse typefaces that are like comfortable jeans: they go with everything,\
    \ they seem to adapt to their surroundings and become more relaxed or more formal\
    \ as the occasion calls for, and they just seem to come out of the closet day\
    \ after day. Usually, these are faces that have a number of weights (Light, Regular,\
    \ Bold) and/or cuts (Italic, Condensed). My particular safety blankets are: Myriad,\
    \ Gotham, DIN, Akzidenz Grotesk and Interstate among the sans; Mercury, Electra\
    \ and Perpetua among the serif faces.\n\nA large type family like **Helvetica\
    \ Neue** can be used to express a range of voices and emotions. Versatile and\
    \ comfortable to work with, these faces are like a favorite pair of jeans for\
    \ designers.\n\n## Know Your Families: Grouping Fonts\n\nThe clothing analogy\
    \ gives us a good idea of what kind of closet we need to put together. The next\
    \ challenge is to develop some kind of structure by which we can mentally categorize\
    \ the different typefaces we run across.\n\nTypefaces can be divided and subdivided\
    \ into dozens of categories (Scotch Modern, anybody?), but we only really need\
    \ to keep track of five groups to establish a working understanding of the majority\
    \ of type being used in the present-day landscape.\n\nThe following list is not\
    \ meant as a comprehensive classification of each and every category of type (there\
    \ are plenty of great sites on the web that already tackle this, such as [Typedia's\
    \ type classifications](http://www.typedia.com/learn/only/35/type-classifications))\
    \ but rather as a manageable shorthand overview of key groups. Let's look at two\
    \ major groups without serifs (serifs being the little feet at the ends of the\
    \ letterforms), two with serifs, and one outlier (with big feet)."
  mdcn: "\n # 生长速度更快的流感疫苗或可加速生产\n\n> 2009年8月20日\n> 《新科学家》杂志第2722期。订阅即可获赠4期免费杂志。\n\
    > 欲阅读类似报道，请访问\"流行病与大流行病\"主题指南\n\n正当全球等待猪流感大流行的下一波侵袭之际，疫苗生产却饱受延误困扰。如今，新研发的、生长速度更快的疫苗病毒株有望加速这一进程。\n\
    \n首批大流行疫苗于8月初生产。测试完成后，疫苗接种的速度将取决于疫苗病毒在鸡蛋中的生长速度。迄今为止，即使是最佳毒株的生长速度也令人失望，仅为普通流感疫苗毒株的一半。美国上周末承认，到10月中旬仅能生产4500万剂疫苗，远低于最初预测的1.2亿剂。\n\
    \n如今，位于瓦尔哈拉的纽约医学院研究人员通过将一种病毒样本在鸡蛋中反复培养，使其适应并加快生长，从而培育出改良毒株。英国国家生物标准与控制研究所（NIBSC）的约翰·伍德表示，他们将于本周向疫苗制造商发送两种改良毒株。\n\
    \n*《新科学家》*的段落间距为20像素。\n\n# 7. 每行多少字符？\n\n根据网页排版的经典规则，每行55到75个字符是最佳数量。令人惊讶的是，我们的研究表明大多数网站的数量更高。我们统计了使用设计默认字号时一行可容纳的字符数。结果显示，每行平均最多可达88.74个字符，这个数字极高。当然，这个最大数值与平均每行字符数不同，后者通常在75到85个字符之间。尽管如此，这一范围仍远高于传统范围——颇为\
    \ peculiar。\n\n每行73到90个字符是设计师的热门选择，但我们也发现了离群值：《Monocle》（每行47个字符）以及《Boxes and Arrows》（每行125个字符）。要获得每个网站更精确的数值，需要从多行中取平均字符数。\n\
    \n## 其他发现\n\n46%的网站在正文内容中为链接添加下划线，而其他网站仅通过颜色或**粗体**字重来突出显示。6%的网站对标题或正文内容使用了某种形式的图像替换（例如《Monocle》、《纽约客》、《新闻周刊》）。96%的网站不对文本进行两端对齐。\n\
    \n网站正文内容左侧平均有11.7像素的内边距（从左内容区域边框算起）。\n\n# 结论\n\n该研究揭示了网页设计中字体排版的共同实践和指导原则。但请注意，**这些发现并非科学结论**，仅应作为粗略的参考依据：\n\
    \n- 无论是衬线体还是无衬线体，均可用于正文内容和标题，但**无衬线体在两者中仍更受欢迎**。\n- **标题**的常见选择包括：\n  - Georgia、\n\
    \  - Arial 和\n  - Helvetica。\n- **正文内容**的常见选择包括：\n  - Georgia、\n  - Arial、\n \
    \ - Verdana 和\n  - Lucida Grande。\n- **标题**最受欢迎的字号范围是18到29像素。\n- **正文内容**最受欢迎的字号范围是12到14像素。\n\
    - 标题字号 ÷ 正文字号 = 1.96。\n- 行高（像素）÷ 正文字号（像素）= 1.48。\n- 行宽（像素）÷ 行高（像素）= 27.8。\n- 段落间距（像素）÷\
    \ 行高（像素）= 0.754。\n- 每行最佳字符数为55到75个，但75到85个字符更为流行。\n- 正文采用左对齐，图像替换很少使用，链接则通过下划线、粗体或颜色来突出显示。\n\
    \n当然，这些\"规则\"并非一成不变。它们只是一套粗略的指导原则，可作为排版设计的基础。每个网站都是独一无二的，你可能需要在设计的每个阶段调整选择以适应版面布局。你也可以查看该研究的电子表格并导出数据以供进一步分析。\n\
    \n# 字体排版的着装规范：字体的选择与使用原则\n\n*作者：丹·迈耶*\n\n对于许多初学者而言，挑选字体是一项令人困惑的任务。选择似乎无穷无尽——从常规的、传统外观的字体到新奇的拐杖糖字体和兔子字体——却没有理解选项的方法，只有无穷无尽的类别列表和推荐。选择合适的字体是严格规则与灵活直觉的混合，需要多年的经验才能培养出感觉。以下是我使用和教授字体排版过程中总结出的五条字体选择与使用指南。\n\
    \n## 因地制宜\n\n我的许多初学者挑选字体时，就像是在寻找新音乐来听：他们评估每种字体的个性，寻找能够表达其独特审美品味、视角和个人经历的独特款式。这种方法存在问题，因为它过分强调了个性。\n\
    \n不论好坏，选择字体更像是早上穿衣打扮。正如服装一样，字体也有*富有表现力和时尚*与*实用且适用于多种场合*之分，而我们的工作就是为特定场合找到恰当的平衡。**恰当性或许不是一个性感的概念，但它是指导我们字体选择的试金石。**\n\
    \n我\"最喜爱\"的衣物可能是一条在旧货店淘来的70年代夸张喇叭裤，但现实是，除了在万圣节，它们很少有机会走出衣柜。每位设计师都有几款这样的最爱字体——富有表现力的个人偏爱，我们珍藏着，等待完美的节日场合来使用。更多时候，我发现自己日复一日地穿上同一条旧Levis。并非我比起心爱的喇叭裤更喜欢它……只是我似乎大多数时候都会穿上它。\n\
    \n每位设计师都有几款像舒适牛仔裤一样的实用字体：它们百搭，似乎能适应周围环境，根据场合需要变得更加休闲或更加正式，而且似乎每天都会被从衣柜里拿出来。通常，这些字体拥有多种字重（细体、常规、粗体）和/或变体（斜体、紧缩体）。我的特定\"\
    安全毯\"包括：无衬线体中的 Myriad、Gotham、DIN、Akzidenz Grotesk 和 Interstate；衬线体中的 Mercury、Electra\
    \ 和 Perpetua。\n\n像 **Helvetica Neue** 这样的大型字体家族可以表达丰富的语气和情感。这些字体多才多艺且易于使用，就像是设计师心爱的一条牛仔裤。\n\
    \n## 了解家族：字体的分类\n\n穿衣的比喻让我们对需要怎样的\"字体衣柜\"有了初步认识。接下来的挑战是建立某种结构，以便我们在心理上对遇到的不同字体进行分类。\n\
    \n字体可以划分为数十个类别（有人知道 Scotch Modern 吗？），但实际上我们只需掌握五组分类，就能对当今大多数使用的字体建立起实用的理解。\n\n\
    以下列表并非旨在全面涵盖所有字体类别（网络上已有诸多优秀网站致力于此，例如 [Typedia 的字体分类](http://www.typedia.com/learn/only/35/type-classifications)），而是作为一个便于管理的速记概览，介绍关键组别。我们来看看两个无衬线体主要组别（衬线体即字母末端的小脚）、两个衬线体组别，以及一个异类（有大脚的）。\n"
