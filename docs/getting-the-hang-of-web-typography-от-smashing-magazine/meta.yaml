    - Pla-Rad-Priki $12.99

    - Pa-Nang Curry Seafood $10.50


    That''s better. Now that we''ve reined in the usage of our star typeface, we''ve
    allowed it to shine again.'
  - '[PAGE 122]


    # 5. Rule Number Five Is There Are No Rules


    Really. Look hard enough and you will find a dazzling-looking menu set entirely
    in a hard-to-read display font. Or of two different Geometric Sans faces living
    happily together on a page (in fact, just this week I wound up trying this on
    a project and was surprised to find that it hit the spot). **There are only conventions,
    no ironclad rules** about how to use type, just as there are no rules about how
    we should dress in the morning. It''s worth trying everything just to see what
    happens – even wearing your Halloween flares to your court date.


    # In Conclusion


    Hopefully, these five principles will have given you some guidelines for how to
    select, apply and mix type – and, indeed, whether to mix it at all. In the end,
    picking typefaces requires a combination of understanding and intuition, and –
    as with any skill – demands practice. With all the different fonts we have access
    to nowadays, it''s easy to forget that there''s nothing like a classic typeface
    used well by somebody who knows how to use it.


    Some of the best type advice I ever received came early on from my first typography
    teacher: **pick one typeface you like** and use it over and over for months to
    the exclusion of all others. While this kind of exercise can feel constraining
    at times, it can also serve as a useful reminder that the quantity of available
    choices in the internet age is no substitute for quality.'
  - '[PAGE 123]


    # Best Practices of Combining Typefaces


    By Douglas Bonneville


    Creating great typeface combinations is an art, not a science. Indeed, the beauty
    of typography has no borders. While there are no absolute rules to follow, it
    is crucial that you understand and apply some best practices when combining fonts
    in a design. When used with diligence and attention, these principles will always
    yield suitable results. Today we will take a close look at some the best practices
    for combining typefaces — as well as some blunders to avoid.


    # Combine a Sans Serif with a Serif


    By far the most popular principle for creating typeface combinations is to pair
    a sans serif header typeface with a serif body typeface. This is a classic combination,
    and it''s almost impossible to get wrong.


    In the example below — a typical article layout — we have Trade Gothic Bold No.2
    paired with Bell Gothic on the left side. They are both sans serif typefaces.
    However, they have very different personalities.


    A **good rule of thumb**, when it comes to header and body copy design problems,
    is not to create undue attention to the personality of each font. Trade Gothic
    is arguably a no-nonsense typeface. Bell Gothic, on the other hand, is much more
    dynamic and outspoken.'
  - '[PAGE 124]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_124_0.png)


    Putting these two together **creates an unwanted conflict in the design.** Trade
    Gothic wants to get to the facts, but Bell Gothic wants to have some fun. This
    kind of tension is likely not part of the design goal, and should be avoided.


    Now let''s look at the example on the right. We''ve replaced Bell Gothic with
    the stately Sabon. Sabon, which is a serif typeface, works very well with Trade
    Gothic. They are both focused on bold clarity with highly-readable glyphs due
    to their tall x-height. Both typefaces, in this context, are on the same mission,
    and that makes for a great combination.


    # Avoid Similar Classifications


    Typefaces of the same classification, but from different typeface families, **can
    easily create discord when combined.** Their distinct personalities don''t play
    well off of each other and create a kind of typographic mud if careful attention
    is not paid.'
  - '[PAGE 125]


    In the first example on the left side we have a heading set in Clarendon Bold,
    which is a **slab serif**. The body copy on the left is Officina Serif which is
    also a **slab serif**. Slab serif typefaces are known for their distinct personality,
    and they like to dominate any area in a design they are used in. Putting two slab
    serifs together can create a needless and unsightly tension.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_125_0.png)


    Now notice the example on the right side. The Clarendon Bold header is paired
    with the much-more neutral New Baskerville. New Baskerville is a versatile **transitional
    serif** typeface with wide glyphs that goes nicely with the heavy-set Clarendon.
    At the same time, it backs down and lets Clarendon have all the personality it
    wants. This combination works quite nicely as a result.


    Choosing typefaces from different classifications at the start avoids needless
    tension in your design and typography later.'
- md: ' Assign Distinct Roles


    One very easy way to combine multiple fonts from several typefaces is to **design
    a role-based scheme** for each font or typeface, and stick to it. In the next
    example, we have used Akzidenz Grotesk Bold in all-caps in an author slug on the
    top. We then use Rockwell Bold for the article heading. Our body copy intro and
    body copy typeface is Bembo at different sizes. Finally, the second level heading
    is Akzidenz Grotesk Medium.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_126_0.png)


    We saved the highly-distinct Rockwell for attention-getting headlines, and fallen
    back to a conservative sans serif heading and serif body copy combination we discussed
    earlier. But even in that choice, we have a great variation of size, weight and
    function among the fonts used.


    All in all, there are 4 fonts from 3 typefaces being used here, and they all pull
    together into a cohesive design, because **each role assigned to a font is fixed**
    and is very clearly defined in the typographic hierarchy. When in doubt, define!


    Contrast Font Weights


    A sure-fire way to muddy your typographic hierarchy is to fail to distinguish
    elements in the hierarchy from one another. In addition to variations in size,
    **make sure you are creating clear differences in font weights** to help guide
    the reader''s eye around your design.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_127_0.png)


    In the example on the left, we have a decent size contrast, but not enough font
    weight contrast. The Myriad Light, when set above a Minion Bold, tends to fade
    back and lose visual authority. However, we want the reader''s eye to go to the
    heading, not the body copy, at least initially.


    On the right of the following illustration, we''ve set a Myriad Black above Minion,
    normal weight. It might be a bit heavy-handed but there is no confusion as to
    what the reader is supposed to look at first.


    Create a Variety of Typographic Colors


    Typographic color is the combined effect of the variations of font weight, size,
    stroke width, leading, kerning, and several other factors. One easy way to see
    typographic colors is to squint at a layout until you can''t read it anymore,
    but can still see the text in terms of its overall tonal value.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_128_0.png)


    If you squint at the examples above, you''ll notice that layout on the left bleeds
    into one undistinguished blob of text, ever so slightly more dense at the bottom.
    However, the layout on the right retains its visual hierarchy, even if you can''t
    read it. No matter how far away you are from this page, there is no confusion
    regarding where the title is, and where your eye should go next.


    Clever use of **typographic color reinforces the visual hierarchy of a page**,
    which is always directly tied to the meaning of the copy and the desired intention
    of the message.


    ## Don''t Mix Moods


    One often-overlooked typographic mistake is not recognizing the inherent mood
    of a typeface. **Typefaces have personality**. They change to some degree based
    on context, but not greatly. It''s one problem to misidentify the personality
    of typeface for a particular job, but it''s a double-problem to add another poorly
    chosen typeface to the mix!


    On the left of this example, we have Franklin Gothic Bold paired with Souvenir.
    The basic feel of Franklin Gothic is stoic, sturdy, strong, but with a refined
    sense of elegance and mission. It''s not cuddly, but its functional.


    On the other hand, Souvenir is playful, casual, a little aloof, and very pretty.
    These two typefaces together come across like a Buckingham Palace guard who is
    dutifully ignoring a playful little girl at his feet trying to get him to smile.
    This kind of mixed-mood **just doesn''t work very well**. Mixing the mood of typefaces
    can draw attention to the typography instead of the message, which results in
    a poor design.


    On the right of the following illustration, we''ve given Souvenir a more willing
    playmate. **Futura Bold** has many personalities, but it''s more than willing
    to accommodate **Souvenir** for several reasons. First, both typefaces have high
    x-heights. Both typefaces have wide glyphs and very circular letter shapes. Both
    typefaces have a subtle but not overly-prominent quirkiness.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_130_0.png)


    **Neither typeface dominates the other.** They both work, in this example, to
    create a fun and upbeat mood. There is no sense of undue tension.


    ## Contrast Distinct with Neutral


    A clean, readable typographic design requires careful attention to intended and
    unintended tension. One place to look for unintended tension is with personality
    clashes among your type choices. If one of your main typefaces has a lot of personality,
    you might need a secondary typeface to take on a neutral role.


    In our example, the left column pairs Dax Bold with Bernhard Modern. This is a
    poor choice for at least two obvious reasons we''ll examine.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_131_0.png)


    First, Dax has narrow glyphs and a big x-height while Bernhard Modern has some
    very wide glyphs and one of the lowest x-heights among popular classic typefaces.
    Second, Dax is an informal, modern, and bright typeface. It''s a great fit for
    a techie, savvy, modern message. Bernhard Modern on the other hand is classy,
    quiet, sophisticated, and even a touch intimate. Combine the lack of chemistry
    among those attributes together with the **very different personalities of each
    typeface** and you have a poorly functioning bit of typography.


    Let''s look at a better choice. The right column pairs Dax Bold with Caslon. Caslon
    is an old style typeface, but it''s been modernized and sanitized to play nicely
    with other typefaces. It works satisfactorily with Dax in this context. Notice
    how you can see the personality of Dax in the headline, but Caslon steps aside
    and delivers the reader to the message? In this context, Caslon functions quite
    well as a neutral choice to support the more flamboyant Dax.


    # Avoid Combinations That are Too Disparate


    When **too much contrast** is created in certain settings by selecting typefaces
    that are too much unalike, it can create a visual imbalance which works against
    the overall design.


    On the left, we have Antique Olive Nord — an extremely heavy font — paired with
    Garamond Narrow. The over-zealous contrast and its effects are apparent. In most
    cases, this extreme contrast goes beyond attention-getting and goes right to awkward.
    It doesn''t serve the message of the copy well.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_132_0.png)


    On the right, the Antique Olive Nord has been replaced by a more subdued Antique
    Olive Bold. Garamond Narrow could have been replaced with a book weight Garamond,
    but a better choice — after some deliberation — was Chaparral. Chaparral has a
    higher x-height than Garamond, and overall is a more modern and subsequently more
    neutral choice to set against the idiosyncratic presence of Antique Olive Bold.


    Keep It Simple — Try Just Two Typefaces


    In all the effort to sort through large typeface libraries looking for "just the
    right combination", it''s often easy to overlook the sometimes obvious and much
    easier choice: stick to two typefaces using a classic sans serif and serif combination.


    In the example below, we''ve created a clear visual hierarchy, got a high degree
    of variety, created a strong sense of interesting typographic color, all-the-while
    increasing readability. But it was all done with just two typefaces. However,
    we are using a total of five fonts: three Helvetica Neues and two Garamonds.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_133_0.png)


    Why does this work so effortlessly? Several factors are at play here. First, when
    using different fonts from the same typeface, you are likely going to have **a
    high degree of visual compatibility** without even working for it. Second, we''ve
    chosen the tried-and-true combinations of using a classic neutral heading typeface
    and a classic neutral body typeface.'
  mdcn: '

    分配不同的角色


    将多种字体组合起来的一个简单方法，就是为每种字体**设计一个基于角色的方案**，并坚持使用。在下面的例子中，我们在顶部的作者署名处使用全大写的 Akzidenz
    Grotesk Bold。然后用 Rockwell Bold 作为文章标题。正文引言和正文使用的字体是不同大小的 Bembo。最后，二级标题是 Akzidenz
    Grotesk Medium。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_126_0.png)


    我们把高度独特的 Rockwell 留给吸引眼球的标题，而退回到之前讨论过的保守的无衬线标题和衬线正文的组合。但即使在这种选择中，所用字体在大小、粗细和功能上都有很大的变化。


    总而言之，这里使用了来自 3 个字型的 4 种字体，它们共同构成了一个协调的设计，因为**分配给每种字体的角色是固定的**，并且在排版层次结构中定义得非常清楚。有疑问时，就定义清楚！


    对比字重


    搞乱排版层次结构的一个万无一失的方法，就是无法区分层次结构中的各个元素。除了大小的变化之外，**确保你正在创建清晰的字重差异**，以帮助引导读者的视线在设计中流动。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_127_0.png)


    在左侧的例子中，我们有不错的大小对比，但字重对比不够。当 Myriad Light 放在 Minion Bold 上方时，往往会退后并失去视觉权威。然而，我们希望读者的视线先投向标题，而不是正文，至少最初是这样。


    在下面插图的右侧，我们将 Myriad Black 放在 Minion 常规字重之上。这可能有点过于用力，但读者应该先看什么，这一点没有歧义。


    创造丰富的色调变化


    排版色调是字重变化、大小、笔画粗细、行距、字距和其他几个因素的综合效果。查看排版色调的一个简单方法是眯着眼睛看版面，直到你无法阅读，但仍然可以看到文本的整体色调价值。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_128_0.png)


    如果你眯眼看上面的例子，你会注意到左侧的版面融化为一块没有区别的文本团块，底部略微更密集一些。然而，右侧的版面即使无法阅读，也保留了其视觉层次。无论你离这页多远，关于标题在哪里，以及视线接下来应该看向哪里，都没有混淆。


    巧妙运用**排版色调可以强化页面的视觉层次**，这总是与文案的含义和信息的预期意图直接相关。


    ## 不要混合情绪


    一个常被忽视的排版错误是没有认识到字体的内在情绪。**字体有个性**。它们会根据上下文在某种程度上发生变化，但不会太大。对于特定工作错误识别字体的个性是一个问题，但再加入另一个选择不当的字体就是双重问题！


    在这个例子的左侧，我们有 Franklin Gothic Bold 与 Souvenir 配对。Franklin Gothic 的基本感觉是坚毅、坚固、强壮，但带有一种精致的优雅感和使命感。它不可爱，但功能性强。


    另一方面，Souvenir 是俏皮的、休闲的、有点疏离的，而且非常优美。这两种字体放在一起，就像白金汉宫的卫兵 dutifully  ignoring  一个在他脚边试图让他微笑的活泼小女孩。这种混合情绪的**效果不太好**。混合字体的情绪会把注意力引向排版而非信息，这会导致糟糕的设计。


    在下面插图的右侧，我们给了 Souvenir 一个更乐意配合的伙伴。**Futura Bold** 有多种个性，但它非常愿意接纳 **Souvenir**，原因有几个。首先，两种字体都有较高的
    x 高度。两种字体都有宽阔的字符和非常圆形的字母形状。两种字体都有一种微妙但不过分突出的怪癖。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_130_0.png)


    ** neither *字体占据主导地位。*它们都在这个例子中共同营造出一种有趣而积极的情绪。没有不必要的紧张感。


    ## 用中性衬托独特


    一个干净、可读的排版设计需要仔细关注预期和非预期的张力。寻找非预期张力的一个地方是字体选择之间的个性冲突。如果你的主要字体之一个性很强，你可能需要一种 secondary
    字体来扮演中性角色。


    在我们的例子中，左栏将 Dax Bold 与 Bernhard Modern 配对。这是一个糟糕的选择，至少有两个明显的原因我们将要考察。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_131_0.png)


    首先，Dax 有狭窄的字符和较大的 x 高度，而 Bernhard Modern 有一些非常宽的字符，-antasy  low x-heights among
    popular classic type-faces.  Second,  Dax  is  an  informal,  modern,  and  bright  type-face.  It''s  a  great  fit  for  a  techie,  savvy,  modern  message.  Bern-hard  Mod-ern  on  the  other  hand  is  classy,  quiet,  so-phis-ti-cated,  and  even  a  touch  in-ti-mate.  Com-bine  the  lack  of  chem-istry  among  those  at-tributes  to-gether  with  the
    **very different personalities of each typeface** and you have a poorly functioning
    bit of typography.


    让我们看一个更好的选择。右栏将 Dax Bold 与 Caslon 配对。Caslon 是一种旧风格字体，但它已经现代化和净化，可以与其他字体很好地配合。在这个语境中，它与
    Dax 的配合令人满意。注意到你如何在标题中看到 Dax 的个性，但 Caslon 退到一边，将读者引向信息？在这个语境中，Caslon 作为中性选择很好地支持了更张扬的
    Dax。


    # 避免过于悬殊的组合


    当在某些情况下选择过于不同的字体而**产生过多对比**时，会造成视觉不平衡，这与整体背道而驰。


    在左侧，我们有 Antique Olive Nord——一种极重的字体——与 Garamond Narrow 配对。过度的对比及其效果是显而易见的。在大多数情况下，这种极端对比超出了吸引眼球的范畴，直接变得尴尬。它不能很好地服务于文案的信息。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_132_0.png)


    在右侧，Antique Olive Nord 已被更克制的 Antique Olive Bold 取代。Garamond Narrow 可以用书籍字重的 Garamond
    代替，但经过一些斟酌后，更好的选择是 Chaparral。Chaparral 的 x 高度高于 Garamond，总体而言是更现代、因此更中性的选择，可以对抗
    Antique Olive Bold 的特立独行。


    保持简单——尝试只用两种字体


    在努力浏览大量字体库寻找"恰到好处的组合"时，往往容易忽视有时明显且容易得多的选择：坚持使用经典的无衬线和衬线组合的两种字体。


    在下面的例子中，我们创建了清晰的视觉层次，获得了高度的变化，创造了强烈的有趣排版色调感，同时提高了可读性。但这全部只用了两种字体完成。不过，我们总共使用了五种字体：三种
    Helvetica Neue 和两种 Garamond。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_133_0.png)


    为什么这能如此毫不费力地奏效？有几个因素在起作用。首先，当使用同一字型的不同字体时，你很可能会**获得高度的视觉兼容性**，甚至无需刻意追求。其次，我们选择了经过验证的经典组合：使用经典中性标题字体和经典中性正文字体。

