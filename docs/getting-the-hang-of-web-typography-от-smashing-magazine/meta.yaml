    \ **inherited to all children of the elements** (the whole `body` element could\
    \ even be holding the attribute).\n\nThe good news is that all latest versions\
    \ of the major browsers support this pseudo-class.\n\n### Conclusion\n\nIn surveying\
    \ the examples in this article, you may be wondering why to bother with most of\
    \ them. True, the specification is far from being approved, and it could change\
    \ over time, but now is the time for experimentation and to contribute to the\
