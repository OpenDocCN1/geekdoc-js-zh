    +   5. It isn''t named after myself, or anyone else. haha.


    ## Just Give Me The Code!


    If you want to dive right in and figure it out for yourself, you can [download
    sIFR Lite](link) right now!


    ## How sIFR Lite Works


    Like sIFR, sIFR Lite uses a combination of Flash and JavaScript to replace the
    original text with a Flash file. JavaScript searches the page for elements that
    need to be replaced, then Flash scripts create the dynamic images, and JavaScript
    replaces the original text with the new Flash files.


    ## Benefits of sIFR Lite


    +   - Same as sIFR 2, mentioned above.

    +   - Much smaller file size than original sIFR (3.7 KB vs. 22 KB).

    +   - Will automatically detect text color in your original file, which is an
    improvement over the original method that requires the developer to enter the
    color manually.


    ## Drawbacks/Disadvantages of sIFR Lite


    +   - Same drawbacks as sIFR 2, mentioned above.

    +   - Uses tag names and classes instead of CSS selectors, which does affect usability
    (although it does make it faster and more maintainable).


    ## Dynamic Text Replacement (DTR)


    This is the original [Dynamic Text Replacement](link) technique that appeared
    on A List Apart in June of 2004. It uses a combination of JavaScript and PHP to
    replace plain text on your page with a dynamically generated image. It is the
    precursor to all of the techniques discussed above.


    If it weren''t for this technique, many of the other ones may not have been developed.
    It should also be noted that the demo page for this method now redirects to the
    P+C DTR method mentioned above, so it seems that the original method is viewed
    as obsolete.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_176_0.png)


    ## How DTR Works


    A small PHP script generates and renders a PNG image whenever it''s requested
    by a JavaScript file. The JavaScript file is largely based on Peter-Paul Koch''s
    [JavaScript Image Replacement](link) method. Basically, once the HTML on a page
    has finished loading, a JavaScript file tests for image support, and if images
    are supported, it finds the elements that need to be replaced and sends them to
    the PHP script. Using it is fairly straightforward, and only a couple of lines
    of code need to be configured.


    ## Benefits of DTR


    +   - Doesn''t require Flash.

    +   - If the font you''re replacing supports foreign characters, this method will
    work, even if the page is translated (e.g. through Google or another service).


    ## Drawbacks/Disadvantages of DTR


    +   - Requires images and JavaScript.

    +   - Text selection is difficult.

    +   - Method is obsolete, and so is not supported.


    ## PHP Image Replacement


    [PHP Image Replacement](PHP Image Replacement) (also known as PIR) is based at
    least in part on the method originally outlined by A List Apart but modified to
    be used with jQuery for better control over the end images produced.


    ## How PIR Works


    PHP Image Replacement uses a modified version of the PHP script from A List Apart
    to dynamically create the replacement images and then uses jQuery to dynamically
    replace pieces of the page text with images generated by the PHP script.


    ## Benefits of PIR


    +   - Claims to be the simplest script of this type currently available.

    +   - Takes relevant information about background, size, color, etc. from the
    document itself.

    +   - Very lightweight.

    +   - Maintains accessibility and degrades gracefully.


    ## Drawbacks/Disadvantages of PIR


    +   - Requires JavaScript.

    +   - Setup requires some basic PHP and JavaScript knowledge.

    +   - PIR is no longer under active development; instead the use of the CSS3 `@font-face`
    rule is recommended.


    ## FontJazz


    [FontJazz](https://fontjazz.com) is a JavaScript typography engine that works
    entirely on the client-side and requires no server-side processes. It works with
    any typeface.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_178_0.png)


    ## How FontJazz Works


    FontJazz uses JavaScript to render headlines in the user''s browser, rather than
    as images on your site''s server.


    ## Benefits of FontJazz


    +   - Compatible with a wide variety of browsers, including IE5+, Firefox 2+ and
    Google Chrome.

    +   - Uses only client-side scripting.

    +   - Degrades gracefully, showing the original type if FontJazz isn''t supported.

    +   - Works with any typeface.

    +   - SEO friendly.


    ## Drawbacks/Disadvantages of FontJazz


    +   - Requires JavaScript.

    +   - Doesn''t support kerning.


    ## WordPress Plug-Ins For Dynamic Text Replacement


    A few WordPress plug-ins are available for some of the dynamic text replacement
    methods mentioned above, as well as two that are unique to WordPress. The biggest
    advantage of plug-ins is that less coding is usually required, and you''re less
    likely to run into bugs from conflicting scripts.


    ## Facelift Image Replacement (FLIR) for WordPress


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_180_0.png)


    [FLIR](http://facelift.mawhorter.net/) for WordPress is still in development but
    is close to being completed. It works just like the FLIR method mentioned above.
    The main bug currently present is that automatic updates don''t always work. Almost
    all of the configuration for FLIR can be done from the admin panel, though you''ll
    still need to do some things manually (such as upload and configure fonts).


    ## WP sIFR


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_181_0.png)


    [WP sIFR](http://wpcow.com/) works like sIFR 2.0. The only configuration you have
    to do is upload your SWF font file to the plug-in directory and activate the plug-in.
    All of the other configuration is done from within the WordPress admin panel.


    ## WP-Cufon


    Projekt: Plug-In für WordPress

    Jahr: 2009


    With Cufón you are able to replace your standard/boring HTML-Fonts on your website.
    My new WordPress Plugin WP-Cufon makes it really easy to implement and customize
    Cufón (courtesy of Simo Kinnunen) into your WordPress Blog. You can download or
    install it on the WordPress Plug-In Repository.

    But: Please have a look about your rights of using your favorited fonts here!


    **It''s free!** But you can **donate** via PayPal if you want!


    **Download**:

    http://wordpress.org/extend/plugins/wp-cufon/


    [WP-Cufón](http://wordpress.org/extend/plugins/wp-cufon/) lets you easily use
    Cufón on your WordPress Web site and it includes good documentation and regular
    updates. It also works just like Cufón, so you''ll still need to convert your
    fonts beforehand. Configuration is done directly in the admin panel in WordPress.


    ## AnyFont


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_183_0.png)


    [AnyFont](link) uses custom fonts (TrueType or OpenType) to replace text in post
    titles, menu items, and pretty much anything else in your WordPress theme. It
    has a font manager that you use to easily upload new fonts from within WordPress;
    it has built-in style management; you can add shadows to your text; it includes
    cache management; and it uses SEO-compatible image replacements.'
  mdcn: '

    +   - 不会影响SEO，因为原始文本仍然显示在你的代码中。


    ## sIFR的缺点/不足


    +   - 当用户在浏览器中增大文本尺寸时，替换后的文本不会随之变化（但现在大多数浏览器都使用"缩放"功能，因此这个问题已不那么突出）。

    +   - 可能对处理器要求较高，尽管缓存机制有所帮助。

    +   - 在Internet Explorer中无法复制和粘贴文本。


    ## sIFR Lite


    基于原始的sIFR技术，[sIFR Lite](link)是一种更简单、更用户友好的技术。其结果比原始版本轻量得多，并且完全采用面向对象的设计。它已在Safari、Firefox、Camino、IE和Opera上进行了测试。


    ## 与原始sIFR有何不同？


    +   1. 体积更小。此库压缩前为3.7k。原始sIFR为22k，绝非玩笑！

    +   2. 它能自动检测元素的文本颜色。（原始sIFR需要你手动输入！）

    +   3. 它是完全面向对象的。（不再有散落各处的静态方法。）

    +   4. 它不再使用CSS选择器。元素通过标签名和类来定位。（在易用性上略有损失，但速度更快、更轻量、更易于维护。）

    +   5. 它不是以我或其他任何人的名字命名的。哈哈。


    ## 直接给我代码！


    如果你想立即开始并自己探索，你现在就可以[下载 sIFR Lite](link)！


    ## sIFR Lite的工作原理


    与sIFR一样，sIFR Lite结合使用Flash和JavaScript，用Flash文件替换原始文本。JavaScript会搜索页面中需要替换的元素，然后Flash脚本创建动态图像，最后JavaScript用新的Flash文件替换原始文本。


    ## sIFR Lite的优点


    +   - 与上面提到的sIFR 2相同。

    +   - 文件尺寸比原始sIFR小得多（3.7 KB 对比 22 KB）。

    +   - 会自动检测原始文件中的文本颜色，这是对原始方法（需要开发者手动输入颜色）的改进。


    ## sIFR Lite的缺点/不足


    +   - 与上面提到的sIFR 2缺点相同。

    +   - 使用标签名和类而不是CSS选择器，这确实影响了易用性（尽管它使速度更快、更易于维护）。


    ## 动态文本替换 (DTR)


    这是2004年6月出现在A List Apart上的原始[动态文本替换](link)技术。它结合使用JavaScript和PHP，用动态生成的图像替换页面上的纯文本。它是所有上述技术的鼻祖。


    如果没有这项技术，许多其他技术可能不会被开发出来。还应该注意的是，此方法的演示页面现在重定向到上面提到的P+C DTR方法，因此原始方法似乎已被视为过时。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_176_0.png)


    ## DTR的工作原理


    一个小型PHP脚本在JavaScript文件请求时生成并渲染PNG图像。该JavaScript文件主要基于Peter-Paul Koch的[JavaScript图像替换](link)方法。基本上，一旦页面上的HTML加载完成，JavaScript文件会测试图像支持情况，如果支持图像，它会找到需要替换的元素并将它们发送给PHP脚本。使用方法相当简单，只需要配置几行代码。


    ## DTR的优点


    +   - 不需要Flash。

    +   - 如果你替换的字体支持外语字符，即使页面被翻译（例如通过Google或其他服务），此方法也有效。


    ## DTR的缺点/不足


    +   - 需要图像和JavaScript。

    +   - 文本选择困难。

    +   - 该方法已过时，因此不再受支持。


    ## PHP图像替换


    [PHP图像替换](PHP Image Replacement)（也称为PIR）至少部分基于A List Apart最初概述的方法，但经过修改以与jQuery一起使用，以便更好地控制最终生成的图像。


    ## PIR的工作原理


    PHP图像替换使用A List Apart中PHP脚本的修改版本来动态创建替换图像，然后使用jQuery动态将页面文本的部分内容替换为PHP脚本生成的图像。


    ## PIR的优点


    +   - 声称是目前可用的最简单的同类脚本。

    +   - 从文档本身获取有关背景、大小、颜色等相关信息。

    +   - 非常轻量。

    +   - 保持可访问性并优雅降级。


    ## PIR的缺点/不足


    +   - 需要JavaScript。

    +   - 设置需要一些基本的PHP和JavaScript知识。

    +   - PIR不再处于积极开发中；取而代之的是建议使用CSS3的`@font-face`规则。


    ## FontJazz


    [FontJazz](https://fontjazz.com)是一个完全在客户端运行的JavaScript排版引擎，不需要服务器端进程。它适用于任何字体。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_178_0.png)


    ## FontJazz的工作原理


    FontJazz使用JavaScript在用户的浏览器中渲染标题，而不是作为图像存储在网站的服务器上。


    ## FontJazz的优点


    +   - 兼容广泛的浏览器，包括IE5+、Firefox 2+和Google Chrome。

    +   - 仅使用客户端脚本。

    +   - 优雅降级，如果FontJazz不受支持，则显示原始字体。

    +   - 适用于任何字体。

    +   - 对SEO友好。


    ## FontJazz的缺点/不足


    +   - 需要JavaScript。

    +   - 不支持字距调整。


    ## 用于动态文本替换的WordPress插件


    一些WordPress插件可用于上述提到的某些动态文本替换方法，此外还有两个是WordPress特有的。插件的最大优势是通常需要较少的编码，并且你不太可能遇到脚本冲突导致的错误。


    ## WordPress的Facelift图像替换 (FLIR)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_180_0.png)


    WordPress的[FLIR](http://facelift.mawhorter.net/)仍在开发中，但已接近完成。它的工作原理与上面提到的FLIR方法相同。目前存在的主要问题是自动更新并不总是有效。FLIR的几乎所有配置都可以从管理面板完成，但你仍然需要手动完成一些事情（例如上传和配置字体）。


    ## WP sIFR


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_181_0.png)


    [WP sIFR](http://wpcow.com/)的工作原理与sIFR 2.0相同。你唯一需要做的配置是将你的SWF字体文件上传到插件目录并激活插件。所有其他配置都在WordPress管理面板内完成。


    ## WP-Cufon


    项目：WordPress插件

    年份：2009


    使用Cufón，你可以替换网站上标准/乏味的HTML字体。我的新WordPress插件WP-Cufon使得将Cufón（由Simo Kinnunen提供）实现和自定义到你的WordPress博客中变得非常容易。你可以从WordPress插件仓库下载或安装它。

    但是：请在此处查看你使用喜爱字体的权利！


    **它是免费的！** 但如果你想的话，可以通过PayPal**捐赠**！


    **下载**：

    http://wordpress.org/extend/plugins/wp-cufon/


    [WP-Cufón](http://wordpress.org/extend/plugins/wp-cufon/) 让你可以在WordPress网站上轻松使用Cufón，它包含良好的文档和定期更新。它的功能也与Cufón完全相同，因此你仍然需要预先转换你的字体。配置直接在WordPress管理面板中进行。


    ## AnyFont


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_183_0.png)


    [AnyFont](link)使用自定义字体（TrueType或OpenType）来替换文章标题、菜单项以及WordPress主题中几乎所有其他地方的文本。它有一个字体管理器，你可以用它在WordPress内轻松上传新字体；它内置了样式管理；你可以为文本添加阴影；它包含缓存管理；并且它使用SEO兼容的图像替换。

    '
