    support for these functions today, you might want to remove them with this option
    (**rendering and miscellaneous options**). In order to keep some of the standard,
    i.e. already supported OpenType functions such as ligatures, you can activated
    the option **Keep OT Features**.


    Another possibility to reduce the file size is by checking the option **Remove
    Kerning** which will erase all [kerning](https://en.wikipedia.org/wiki/Kerning)
    values that are contained for specific letter combinations. In case you are going
    to use the font for body text this option is actually recommendable. For headlines
    it should be handled with care or not be done at all as the missing kerning values
    might lead to the unpleasant effect that the shape of words looks like a Swiss
    cheese.


    The option **Simplify Outlines** does exactly that: it tries to simplify the outline
    of characters. As this option reduces the quality of screen display it is not
    advisable to use it.


    Then, there''s the option **Build Cufón File** that isn''t directly part of the
    options for @font-face embedding. [How Cufón works](https://) is explained in
    a separate article in this e-book. For further details you can also check the
    [Cufón](https://) Web site.'
- md: " # Subsetting\n\nSubsetting means that all superfluous characters are removed.\
    \ Whether or not this is actually necessary depends on the respective font. Some\
    \ fonts can easily contain thousands of characters of various writing systems\
    \ which bloats the font file considerably. Without subsetting such fonts are not\
    \ suitable for use as web fonts.\n\nThe option **Basic Subsetting** is set as\
    \ default and offers the usual Western European glyph allocation based on the\
    \ character set MacRoman. **Custom Subsetting ...** allows for a custom defined\
    \ scope of contained characters and glyphs. Whereas, the option **No Subsetting**\
    \ deactivates subsetting completely and converts the font with all contained characters\
    \ and glyphs.\n\n# CSS-Formats\n\nThe @font-face Kit Generator creates both the\
    \ converted fonts and the matching CSS files which is really helpful for web designers\
    \ as the CSS code can be voluminous, when several fonts with various font formats\
    \ are involved.\n\nYou can choose from three different versions:\n\n- Mo' Bulletproofer\n\
    - Bulletproof (Original)\n- Bulletproof (Smiley)\n\nA correct syntax is key for\
    \ proper registration of the fonts and in order to prevent browsers from loading\
    \ font formats they don't support. Each of the above-mentioned versions solves\
    \ a different browser specific problems. In addition, the smiley version guarantees\
    \ that the embedded font won't be replaced by one of the locally installed versions\
    \ of the font.\n\n# CSS Options\n\nThe option **Style Linking** groups styles\
    \ by family. This allows for addressing the fonts later through the CSS properties\
    \ `font-weight` and `font-style`.\n\nThis option will only work properly, if the\
    \ font family doesn't contain more than the common four styles, i.e. regular,\
    \ italic, bold and bold italic. Otherwise, you should leave the option unchecked\
    \ so that fonts can be addressed by independent family names.\n\nLast but not\
    \ least, the option **Base64 Encode** embeds web fonts with a base64 encoding\
    \ into the CSS code instead of creating a separate font file. As a result the\
    \ fonts don't appear as font files in the browser's cache.\n\n# Code Sample\n\n\
    The following example illustrates what your CSS code for @font-face embedding\
    \ might look like:\n\n```\n@font-face {\n  font-family: 'GraublauWeb';\n  src:\
    \ url('graublauwebbold-webfont.eot');\n  src: local('☺'),url('graublauwebbold-webfont.woff')\
    \ format('woff'),\n  url('graublauwebbold-webfont.ttf') format('truetype'),\n\
    \  url('graublauwebbold-webfont.svg#webfontDGhCBjc5') format('svg');\n  font-weight:\
    \ bold;\n  font-style: normal;\n}\n```\n\nThe **EOT file** for Internet Explorer\
    \ **is always loaded first** and has to be without the `format` attribute.\n\n\
    The other font formats are specified in a comma-separated list and are hid from\
    \ Internet Explorer by the introductory `local` attribute. The SVG specification\
    \ contains an additional hash tag as a unique identification number. Fallback\
    \ is necessary as SVG files may contain several fonts. However, the @font-face\
    \ generator takes care of the identification number and its embedding into the\
    \ CSS code automatically.\n\n# Loading Time Increases with Amount of Fonts\n\n\
    By means of the above-mentioned options, file sizes of web fonts can be reduced\
    \ to approximately 30 to 60 kilobytes. Larger font files or too many fonts on\
    \ one web page can slow down loading of the page, especially on mobile devices.\n\
    \n# Weird Interim Solution in Firefox\n\n*Most browsers won't show any text before\
    \ all web fonts are imported. Firefox, however, displays the text using a system\
    \ font and renders the text again, when the embedded web fonts are completely\
    \ loaded. This technique results in a **flash of unstyled text** that sometimes\
    \ leads to side-effects.*\n\n# Graublau Web Bold\n\nAdditional Specs: font-size-adjust:\
    \ 0.55;\n\nThe five boxing wiz\n\nThe five boxing wizards\n\nThe five boxing wizards\
    \ jump\n\nThe five boxing wizards jump quickly.\n\nThe five boxing wizards jump\
    \ quickly. Lorem i\n\nThe five boxing wizards jump quickly. Lorem ipsum dolor\n\
    \nThe five boxing wizards jump quickly. Lorem ipsum dolor sit amet,\n\nThe five\
    \ boxing wizards jump quickly. Lorem ipsum dolor sit amet, consectet\n\nThe five\
    \ boxing wizards jump quickly. Lorem ipsum dolor sit amet, consectetur ad\n\n\
    The five boxing wizards jump quickly. Lorem ipsum dolor sit amet, consectetur\
    \ adipisic\n\nThe five boxing wizards jump quickly. Lorem ipsum dolor sit amet,\
    \ consectetur adipisicing eli\n\nThe five boxing wizards jump quickly. Lorem ipsum\
    \ dolor sit amet, consectetur adipisicing elit, s\n\nThe five boxing wizards jump\
    \ quickly. Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eius\n\
    \n*The result of the above process looks like this in Safari on Mac OS X.*\n\n\
    # Web Typography – Work-arounds, Tips and Tricks\n\n*By Ralf Hermann*\n\nThe possibilities\
    \ of using custom fonts on web pages developed much quicker over the past two\
    \ years than anybody expected. Today web designers still have to struggle with\
    \ a clutter of font formats in order to provide for cross-browser support of a\
    \ given font. However, this problem will subside as soon as the web Open Font\
    \ Format (WOFF) is established as the standard web font format.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_228_0.png)\n\
    \n*[Typographic variety](http://typographic-variety)* beyond the monotony of system\
    \ fonts.\n\nAnother obstacle is the prevalence of Windows computers with deactivated\
    \ subpixel rendering — either by default on Windows XP or on purpose by their\
    \ users. Compared to system fonts most web fonts are displayed at a much lower\
    \ quality in screen display without subpixel rendering. Time will solve this problem,\
    \ when users replace their equipment with new hardware and current operating systems.\
    \ Furthermore, Internet Explorer 9 will work with the text engine DirectWrite\
    \ that provides a significantly improved rendering.\n\nUsing web fonts for your\
    \ design entails thorough testing on as many different browsers and platforms\
    \ as possible with a close look at the **various options of rendering text**.\
    \ If the screen display is of poor quality without subpixel rendering you might\
    \ want to opt for graceful degradation and deliver system fonts for users of older\
    \ browsers and systems. The easiest way to exclude older browsers or operating\
    \ systems from style sheets with embedded web fonts is the use of conditional\
    \ comments. Of course, [using JavaScript](http://) is the more elegant way to\
    \ detect whether or not the client's subpixel rendering is turned on or off.\n\
    \n## Text Layout\n\nEven though some web layouts are drawing nearer to print layouts\
    \ thanks to rich typography and web font embedding there's still a big difference:\
    \ To this day browsers do not offer automatic **hyphenation**. Especially for\
    \ languages with very long words, e.g. German, it is not possible to use left\
    \ and right **justified text** without creating spacious gaps thus reducing the\
    \ readability of body text.\n\nBy means of JavaScript you can provide for a language-based\
    \ client-side hyphenation. A server-side solution is offered by phpHyphenator.\
    \ Nevertheless, these are still emergency solutions for a missing function that\
    \ should be an integral part of any browser which it will hopefully be in the\
    \ future.\n\n# OpenType Typography Features\n\nWith the spreading of web fonts\
    \ another shortcoming of common browsers concerning text layout came into focus\
    \ – there's no support of OpenType typographic features that have been offered\
    \ by high-end desktop publishing programs such as InDesign or QuarkXPress since\
    \ version 7.\n\nOpenType functions add several smart font options that enhance\
    \ the font's typographic and language support capabilities. If the application\
    \ supports these options, characters can be replaced by additional features automatically.\
    \ For Latin-based script these mainly concern ligatures, fractions or small capitals.\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_230_0.png)\n\nComputer generated small\
    \ caps (grey lettering on top) and true small caps (blue lettering below) in the\
    \ beta version of Firefox 4.\n\nSome fonts can only be put to use by OpenType\
    \ functions in the first place. Take joint Latin handwriting or Arabic writing\
    \ for example, in which the shape of a character depends on its position in the\
    \ word and the adjacent characters. Comprehensive OpenType fonts may, therefore,\
    \ contain various alternative glyphs for the respective character. With the methods\
    \ of OpenType functions, the basic version of a character is replaced by a version\
    \ with matching connections context-based as the following screen shot illustrates."
  mdcn: "\n # 子集化\n\n子集化意味着移除所有多余的字符。这是否真的必要取决于具体的字体。有些字体可能包含数千个来自不同书写系统的字符，这会使字体文件体积大增。如果没有子集化，这样的字体不适合用作网页字体。\n\
    \n**基本子集化**选项默认为启用状态，提供基于MacRoman字符集的常规西欧字形分配。**自定义子集化 …** 允许自定义包含的字符和字形范围。而**无子集化**选项则完全禁用子集化，转换字体时会保留所有包含的字符和字形。\n\
    \n# CSS格式\n\n@font-face工具包生成器既会创建转换后的字体，也会生成配套的CSS文件，这对网页设计师来说非常有帮助，因为当涉及多种格式的多种字体时，CSS代码可能会非常冗长。\n\
    \n您可以从三种不同版本中选择：\n\n- 更完善的防错方案\n- 防错方案（原版）\n- 防错方案（笑脸版）\n\n正确的语法是字体正确注册以及防止浏览器加载其不支持的字体格式的关键。上述每个版本都解决了不同的浏览器特定问题。此外，笑脸版本确保嵌入的字体不会被本地安装的字体版本所替换。\n\
    \n# CSS选项\n\n**样式链接**选项按字族分组样式。这样以后可以通过CSS属性`font-weight`和`font-style`来引用字体。\n\
    \n此选项仅在字族不包含超过常见的四种样式（即常规、斜体、粗体和粗斜体）时才能正常工作。否则，您应该保持该选项未选中状态，以便通过独立的字族名称来引用字体。\n\
    \n最后但同样重要的是，**Base64编码**选项会将网页字体以base64编码嵌入到CSS代码中，而不是创建单独的字体文件。这样字体就不会作为字体文件出现在浏览器的缓存中。\n\
    \n# 代码示例\n\n以下示例展示了@font-face嵌入的CSS代码可能的样子：\n\n```\n@font-face {\n  font-family:\
    \ 'GraublauWeb';\n  src: url('graublauwebbold-webfont.eot');\n  src: local('☺'),url('graublauwebbold-webfont.woff')\
    \ format('woff'),\n  url('graublauwebbold-webfont.ttf') format('truetype'),\n\
    \  url('graublauwebbold-webfont.svg#webfontDGhCBjc5') format('svg');\n  font-weight:\
    \ bold;\n  font-style: normal;\n}\n```\n\n针对Internet Explorer的**EOT文件总是首先加载**，并且不能带有`format`属性。\n\
    \n其他字体格式以逗号分隔列表的形式指定，并通过开头的`local`属性对Internet Explorer隐藏。SVG规范包含一个额外的井号作为唯一标识号。回退是必要的，因为SVG文件可能包含多种字体。不过，@font-face生成器会自动处理标识号及其嵌入到CSS代码中的工作。\n\
    \n# 字体数量增加会延长加载时间\n\n通过上述选项，网页字体的文件大小可以缩减到大约30至60千字节。较大的字体文件或一个网页上过多的字体会减慢页面加载速度，尤其是在移动设备上。\n\
    \n# Firefox中的怪异临时解决方案\n\n*大多数浏览器在导入所有网页字体之前不会显示任何文本。然而，Firefox会使用系统字体显示文本，并在嵌入的网页字体完全加载后重新渲染文本。这种技术会导致**无样式文本闪屏**，有时会产生副作用。*\n\
    \n# Graublau Web Bold\n\n附加规格：font-size-adjust: 0.55;\n\n五名拳击奇才\n\n五名拳击奇才\n\n\
    五名拳击巫师跳\n\n五名拳击巫师跳得很快。\n\n五名拳击巫师跳得很快。Lorem i\n\n五名拳击巫师跳得很快。Lorem ipsum dolor\n\
    \n五名拳击巫师跳得很快。Lorem ipsum dolor sit amet,\n\n五名拳击巫师跳得很快。Lorem ipsum dolor sit amet,\
    \ consectet\n\n五名拳击巫师跳得很快。Lorem ipsum dolor sit amet, consectetur ad\n\n五名拳击巫师跳得很快。Lorem\
    \ ipsum dolor sit amet, consectetur adipisic\n\n五名拳击巫师跳得很快。Lorem ipsum dolor sit\
    \ amet, consectetur adipisicing eli\n\n五名拳击 wizard跳得很快。Lorem ipsum dolor sit amet,\
    \ consectetur adipisicing elit, s\n\n五名拳击巫师跳得很快。Lorem ipsum dolor sit amet, consectetur\
    \ adipisicing elit, sed do eius\n\n*上述过程在Mac OS X的Safari中的效果如上所示。*\n\n# 网页排版 –\
    \ 变通方案、技巧与诀窍\n\n*作者：Ralf Hermann*\n\n在网页上使用自定义字体的可能性在过去两年中的发展远超任何人的预期。如今，网页设计师仍然需要应对各种字体格式的混乱局面，以确保给定字体的跨浏览器支持。然而，一旦网页开放字体格式（WOFF）被确立为标准网页字体格式，这个问题将会缓解。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_228_0.png)\n\n*[排版多样性](http://typographic-variety)*\
    \ 超越系统字体的单调。\n\n另一个障碍是Windows电脑普遍关闭了子像素渲染——无论是在Windows XP上默认关闭，还是用户有意关闭。与系统字体相比，大多数网页字体在没有子像素渲染的屏幕显示中质量要低得多。随着时间的推移，当用户用新硬件和当前操作系统替换设备时，这个问题将会得到解决。此外，Internet\
    \ Explorer 9将采用文本引擎DirectWrite，提供显著改善的渲染效果。\n\n为设计使用网页字体需要在尽可能多的不同浏览器和平台上进行彻底测试，并密切关注**文本渲染的各种选项**。如果屏幕显示在没有子像素渲染的情况下质量较差，您可能希望选择优雅降级，为使用旧浏览器和系统的用户提供系统字体。排除旧浏览器或操作系统使用嵌入式网页字体样式表的最简单方法是使用条件注释。当然，[使用JavaScript](http://)是检测客户端子像素渲染是否开启或关闭的更优雅的方式。\n\
    \n## 文本布局\n\n尽管由于丰富的排版和网页字体嵌入，一些网页布局正在接近印刷布局，但仍然存在很大差异：时至今日，浏览器仍不提供自动**断字**。尤其对于拥有非常长单词的语言（例如德语）来说，在不产生大量空白间隙的情况下无法实现左右**两端对齐**，而这会降低正文的易读性。\n\
    \n通过JavaScript可以实现基于语言的客户端断字。phpHyphenator提供了服务器端解决方案。尽管如此，这些仍然只是缺失功能的应急方案，这个功能应该是任何浏览器不可或缺的一部分，希望在未来能够实现。\n\
    \n# OpenType排版特性\n\n随着网页字体的普及，常见浏览器在文本排版方面的另一个缺陷也引起了关注——它们不支持OpenType排版特性，而这些特性自版本7起就已经由InDesign或QuarkXPress等高端桌面出版程序提供。\n\
    \nOpenType功能增加了多种智能字体选项，增强了字体的排版和语言支持能力。如果应用程序支持这些选项，字符可以自动被附加特性替换。对于拉丁字母书写系统，这些主要涉及连字、分数或小型大写字母。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_230_0.png)\n\n在Firefox 4测试版中，计算机生成的小型大写字母（上方灰色文字）和真正的小型大写字母（下方蓝色文字）。\n\
    \n有些字体只有通过OpenType功能才能使用。例如联合拉丁手写体或阿拉伯书写体，其中字符的形状取决于其在单词中的位置和相邻字符。因此，全面的OpenType字体可能包含相应字符的各种替代字形。通过OpenType功能的方法，字符的基本版本会根据上下文被替换为具有匹配连接符的版本，如下图所示。\n"
