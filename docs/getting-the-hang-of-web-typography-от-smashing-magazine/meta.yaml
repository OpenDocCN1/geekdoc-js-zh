    and [OmniTI](http://omniti.com). It was conceived in March 2009 by Jon Tan and
    Richard Rutter as a way to bring quality fonts to a wide audience while leveling
    the playing field for type foundries. It went into private beta in January 2010
    and was open to the public in June of 2010.'
