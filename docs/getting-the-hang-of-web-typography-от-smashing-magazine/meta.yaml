  md: 'replaced text will also zoom in (only when the page loads, though, not if they
    zoom in afterward).


    # How sIFR Works


    While sIFR is a rather complex system, its basic concept is simple: JavaScript
    checks to see whether Flash is installed in your browser. If it isn''t (or if
    JavaScript isn''t installed), it stops there and the visitor sees your text in
    whatever font you''ve specified in your style sheet. If Flash is installed, then
    the JavaScript measures each element on the page that you''ve designated to be
    converted.


    Once JavaScript has measured all the elements, it replaces each with a Flash movie
    that is the same size as the original element. The original text is passed into
    the Flash movie as a variable, then some ActionScript code in the Flash file draws
    the text in the typeface you''ve chosen and scales it to fill the area occupied
    by the Flash movie.


    # Benefits of sIFR


    +   - Works with virtually any font.


    +   - Degrades gracefully in most instances to the original HTML or (X)HTML file
    if the person doesn''t have Flash or JavaScript installed


    +   - Cross-browser and cross-platform compatible


    +   - Because the original (X)HTML document remains unchanged, the SEO, accessibility
    and other concerns people usually have with Flash aren''t really issues


    # Drawbacks/Disadvantages of sIFR


    +   - Requires both JavaScript and Flash to be installed'
