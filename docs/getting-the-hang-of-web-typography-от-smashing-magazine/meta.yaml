- md: " # Font Burner Control Panel\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_184_0.png)\n\
    \nThe [Font Burner Control Panel](Font Burner Control Panel) is a different technique\
    \ for adding fonts to your Web site. Basically, it allows you to use any of the\
    \ more than 1,000 fonts available on Font Burner on your WordPress blog. All you\
    \ have to do is upload the plug-in to your plug-ins folder, activate it and then\
    \ configure it through the admin panel.\n\n## Good Old @Font-Face Rule Revisited\n\
    \nBy Ralf Hermann\n\nWith the new possibilities of the CSS3 property @font-face\
    \ a veritable gold digging atmosphere is taking hold of web designers. There's\
    \ hope that the common monotony of system fonts will be abolished soon by web\
    \ font embedding which enables web designers to choose practically any typeface\
    \ and font-style they want – just like in print design. This article looks at\
    \ the history and today's possibilities of web font embedding.\n\nFrom the early\
    \ days of the Internet web designers have used system fonts for the majority of\
    \ Web sites. The Web site offers fonts like Times New Roman, Arial or Verdana\
    \ to the browser. If the suggested font is installed on the client, the browser\
    \ will use it. If not, the font is replaced by the client's default font. This\
    \ means that web designers only have little influence on what the Web site will\
    \ look like, because the same Web site will be displayed with different fonts\
    \ on different computers and in different browsers.\n\n```\n1  h1  {\n2    font-family:\
    \ Verdana, Arial, Helvetica, sans-serif;\n3  }\n```\n\nWith regard to typography,\
    \ the web is way behind of what's possible in print design. For example headlines:\
    \ In print design condensed typefaces come in handy for headlines as they allow\
    \ more words to fit in one line. In system font collections, however, there are\
    \ usually no condensed fonts. Also, companies cannot ever use their own corporate\
    \ fonts. Instead they have to replace their corporate typeface by standard fonts\
    \ such as Arial, making a consistent corporate identity throughout all media impossible.\n\
    \n## @font-face already existed at the end of the 1990s\n\nThe possibility of\
    \ embedding any given font into a Web site has been around for a while. Netscape\
    \ 4 as well as Internet Explorer 4 – which was the first browser to support the\
    \ @font-face rule by the way – already supported @font-face end of the 1990s allowing\
    \ the ability to deposit fonts on the server and deliver them through the web\
    \ page.\n\n```\n@font-face {\n  font-family: Gentium;\n  src: url(fonts/gentium.eot);\n\
    }\n```\n\nHowever, this technique was ahead of its time. Font rendering used to\
    \ employ simple grayscale anti-aliasing at that time. This was no problem for\
    \ system fonts, which were laboriously optimized for rendering on screen, but\
    \ other fonts were not rendered properly as they lacked the benefits of the manual\
    \ on-screen optimization. Instead of improving web typography, the use of non-system\
    \ fonts made Web sites even worse.\n\nNo wonder that the @font-face rule was removed\
    \ in the CSS 2.1 specification. The use of system fonts remained the general practice\
    \ in web design, especially for copy. For headlines, several work-arounds have\
    \ been established, for example replacing the actual text by a bitmap file or\
    \ a flash movie displaying the headline in a particular font. These flash movies\
    \ themselves may utilize font embedding.\n\nAnother approach, which has come up\
    \ in the past few years is the replacement of headlines by vector graphics with\
    \ the help of Java Script. Services that offer this functionality are Typeface.js\
    \ and Cufón. But all of these techniques have some problem or another – be it\
    \ the incompatibility with search engines or problems with zooming in and out\
    \ of Web sites.\n\n## Successful second run thanks to subpixel rendering\n\nThe\
    \ introduction of Safari 3.1 by Apple marked a turning point in the use of web\
    \ fonts. This browser update brought back the old @font-face rule. A significant\
    \ improvement came in the introduction of flat panel LCD monitors. These monitors,\
    \ with a much higher screen resolution along with anti-aliasing via subpixel rendering\
    \ have since become standard. Subpixel rendering makes use of the fact that each\
    \ pixel on a color LCD is composed of individual red, green and blue subpixels.\
    \ It uses these subpixels to anti-alias text, which increases the apparent resolution\
    \ of an LCD display thus improving the rendering of text, even with very small\
    \ font sizes.\n\nOn Mac OS X platforms this function is activated by default.\
    \ Windows uses its own trademark ClearType, which is activated by default in Windows\
    \ Vista and Windows 7, but kept turned off in Windows XP. In Microsoft Office\
    \ 2007/2010, Internet Explorer 7 and higher, as well as Windows Live Messenger,\
    \ the option ClearType is turned on by default, even if it is not enabled throughout\
    \ the operating system.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_187_0.png)\n\
    \nWhat is remarkable about Safari's @font-face support is the fact that for the\
    \ first time embedding of standard formats, namely TrueType (ttf) and OpenType\
    \ (ttf/otf), is possible without any prior conversion as the following css code\
    \ shows.\n\n```\n1 @font-face {\n2   font-family: GraublauWeb;\n3   src: url(fonts/graublau.otf)\
    \ format (\"opentype\");\n4 }\n```\n\n## The Font Foundries' Concerns\n\nSuppliers\
    \ of commercial fonts, however, were not exactly happy about the new functionality,\
    \ because it means that everybody can download the embedded fonts and use them\
    \ without paying a licence fee.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_188_0.png)\n\
    \n*Safari 3.1 offers support for standard font formats for the first time – demo.*\n\
    \nA vivid debate among browser companies and font foundries was the result. While\
    \ the foundries want commercial fonts to be protected from bootleg copies and\
    \ unlawful use of fonts that are subject to licensing, browser companies do not\
    \ feel obliged to claim the foundries' copyrights. Just like with assets such\
    \ as pictures, video or text, which copyrights are not controlled by the browser\
    \ itself, the content providers were obliged to declare copyright protected fonts\
    \ used on their Web sites, browser companies argue.\n\n## The Current Web Font\
    \ Formats\n\nBy *Ralf Hermann*\n\nThe relatively new possibility of embedding\
    \ any font you like into Web sites via @font-face is an additional stylistic device,\
    \ which promises to abolish the monotony of the usual system fonts. But it would\
    \ have been all too easy, if there was only one web font format. Instead there's\
    \ quite a variety which we are going to present here.\n\n### Web Font Formats\n\
    \nEOT, TTF, OTF, CFF, AFM, LWFN, FFIL, FON, PFM, PFB, WOFF, SVG, STD, PRO, XSF,\
    \ …\n\nTo find one's way in this veritable jungle of font formats is not exactly\
    \ easy. On the following pages we'll have a closer look at the pros and cons of\
    \ those font formats that are particularly relevant for their use on Web sites.\n\
    \n### TrueType\n\nThis format was developed in the late 1980s as a competitor\
    \ to Adobe's Type 1 fonts used in PostScript. As a scalable outline format, it\
    \ replaced the at that time common bitmap fonts being used for screen display.\
    \ Microsoft took up the TrueType format as well and it soon evolved into the standard\
    \ format for system fonts due to the fact that it offered fine-tuned control for\
    \ a precise display of font at particular sizes.\n\n### OpenType\n\nMicrosoft\
    \ and Adobe teamed up in developing this format. Based on the TrueType format,\
    \ OpenType offers additional typographical features such as ligatures, fractions\
    \ or context sensitive glyphs and the like. However, browser support of these\
    \ features common in sophisticated layout and illustration programs is still unsatisfactory.\n\
    \nYou should also know that there are two different versions of OpenType fonts,\
    \ depending on the outline technology used. There are:\n\n- OpenType fonts with\
    \ **TrueType Outlines** (OpenType TT)\n- OpenType fonts with **PostScript Outlines**\
    \ (OpenType PS)\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_190_0.png)\n\n> OpenType\
    \ comes in two different versions.\n\n**OpenType PS** is a so-called CFF based\
    \ file format (CFF = compact file format). This is relevant when using OpenType\
    \ PS fonts as web fonts, because PostScript based formats are **displayed without\
    \ subpixel rendering** on Windows platforms which affects the rendering quality\
    \ considerably."
  mdcn: "\n# Font Burner 控制面板\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_184_0.png)\n\
    \n[Font Burner 控制面板](Font Burner Control Panel)是一种为您的网站添加字体的不同技术。基本上，它允许您在 WordPress\
    \ 博客中使用 Font Burner 上超过 1,000 种可用字体中的任何一种。您只需将插件上传到您的插件文件夹，激活它，然后通过管理面板进行配置。\n\
    \n## 重温经典的 @Font-Face 规则\n\n作者：Ralf Hermann\n\n随着 CSS3 属性 @font-face 带来的新可能性，网页设计师们正掀起一股淘金热。人们希望，通过网页字体嵌入技术，系统中千篇一律的单调字体能够尽快被淘汰，这使得网页设计师可以像印刷设计一样，自由选择几乎任何字体和字重。本文将探讨网页字体嵌入的历史及其当今的可能性。\n\
    \n从互联网早期开始，网页设计师们就已经在为大多数网站使用系统字体。网站向浏览器提供诸如 Times New Roman、Arial 或 Verdana 等字体。如果客户端安装了建议的字体，浏览器就会使用它。如果没有，字体将被客户端的默认字体替代。这意味着网页设计师对网站的外观影响力有限，因为同一个网站在不同的电脑和不同的浏览器上会显示不同的字体。\n\
    \n```\n1  h1  {\n2    font-family: Verdana, Arial, Helvetica, sans-serif;\n3 \
    \ }\n```\n\n在排版方面，网页远远落后于印刷设计所能实现的效果。例如标题：在印刷设计中，窄体字体非常适合用于标题，因为它们能让更多的单词容纳在一行中。然而，在系统字体集合中，通常没有窄体字体。此外，公司也无法使用自己的企业字体。相反，他们不得不用\
    \ Arial 等标准字体来替代自己的企业字体，这使得在所有媒体上保持统一的企业形象变得不可能。\n\n## @font-face 在 1990 年代末就已经存在\n\
    \n将任意字体嵌入到网站中的可能性已经存在一段时间了。Netscape 4 和 Internet Explorer 4——顺便说一下，这是第一个支持 @font-face\
    \ 规则的浏览器——在 1990 年代末就已经支持 @font-face，允许将字体存储在服务器上并通过网页进行传输。\n\n```\n@font-face\
    \ {\n  font-family: Gentium;\n  src: url(fonts/gentium.eot);\n}\n```\n\n然而，这项技术超前于它的时代。当时的字体渲染采用的是简单的灰度抗锯齿。这对于系统字体来说没有问题，因为系统字体都经过了精心的屏幕显示优化，但其他字体由于缺乏手动屏幕优化的优势，无法正确渲染。非系统字体的使用不仅没有改善网页排版，反而让网站变得更糟。\n\
    \n难怪 @font-face 规则在 CSS 2.1 规范中被移除了。使用系统字体仍然是网页设计中的普遍做法，尤其是在正文方面。对于标题，人们已经建立了几种变通方法，例如用位图文件或显示特定字体的\
    \ Flash 动画来替换实际文本。这些 Flash 动画本身就可以利用字体嵌入技术。\n\n另一种在过去几年中出现的做法，是通过 JavaScript 用矢量图形替换标题。提供这种功能的服务有\
    \ Typeface.js 和 Cufón。但所有这些技术都存在这样或那样的问题——要么与搜索引擎不兼容，要么在网页缩放时出现问题。\n\n## 亚像素渲染带来的成功二次运行\n\
    \nApple 推出的 Safari 3.1 标志着网页字体使用的一个转折点。这次浏览器更新重新引入了旧的 @font-face 规则。一个重大改进是平板\
    \ LCD 显示器的出现。这些显示器具有更高的屏幕分辨率，并采用亚像素渲染进行抗锯齿，此后已成为标准。亚像素渲染利用彩色 LCD 上每个像素由独立的红、绿、蓝子像素组成这一事实。它使用这些子像素来对文本进行抗锯齿处理，从而提高了\
    \ LCD 显示的表观分辨率，改善了文本渲染效果，即使用很小的字号也是如此。\n\n在 Mac OS X 平台上，此功能默认开启。Windows 使用其自家的\
    \ ClearType 技术，在 Windows Vista 和 Windows 7 中默认开启，但在 Windows XP 中保持关闭。在 Microsoft\
    \ Office 2007/2010、Internet Explorer 7 及更高版本以及 Windows Live Messenger 中，ClearType\
    \ 选项默认开启，即使它在整个操作系统中并未启用。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_187_0.png)\n\
    \nSafari 的 @font-face 支持值得注意的一点是，它首次无需任何预先转换即可嵌入标准格式，即 TrueType (ttf) 和 OpenType\
    \ (ttf/otf)，如以下 CSS 代码所示。\n\n```\n1 @font-face {\n2   font-family: GraublauWeb;\n\
    3   src: url(fonts/graublau.otf) format (\"opentype\");\n4 }\n```\n\n## 字体铸造厂的担忧\n\
    \n然而，商业字体的供应商们对新功能并不十分高兴，因为这意味着每个人都可以下载嵌入的字体，无需支付许可费用即可使用。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_188_0.png)\n\
    \n*Safari 3.1 首次提供对标准字体格式的支持——演示。*\n\n浏览器公司和字体铸造厂之间展开了激烈的辩论。铸造厂希望保护商业字体免受盗版和未经授权的使用，这些字体受许可协议约束，而浏览器公司并不认为有义务维护铸造厂的版权。浏览器公司辩称，就像图片、视频或文本等资产的版权不由浏览器本身控制一样，内容提供商有义务声明其网站上使用的受版权保护的字体。\n\
    \n## 当前的网页字体格式\n\n作者：*Ralf Hermann*\n\n通过 @font-face 将任意字体嵌入网站的相对较新的可能性是一种额外的风格手段，它有望消除常见系统字体的单调。但如果只有一种网页字体格式，那就太简单了。实际上存在着相当多的种类，我们将在下面介绍。\n\
    \n### 网页字体格式\n\nEOT、TTF、OTF、CFF、AFM、LWFN、FFIL、FON、PFM、PFB、WOFF、SVG、STD、PRO、XSF、……\n\
    \n在这货真价实的字体格式丛林中找到方向并非易事。在接下来的页面中，我们将更仔细地研究那些与网站使用特别相关的字体格式的优缺点。\n\n### TrueType\n\
    \n这种格式开发于 1980 年代末，作为 Adobe PostScript 中使用的 Type 1 字体的竞争对手。作为一种可缩放轮廓格式，它取代了当时用于屏幕显示的常见位图字体。Microsoft\
    \ 也采用了 TrueType 格式，由于它提供了对特定字号精确显示的精细控制，很快发展成为系统字体的标准格式。\n\n### OpenType\n\nMicrosoft\
    \ 和 Adobe 联手开发了这种格式。基于 TrueType 格式，OpenType 提供了额外的排版特性，如花饰字、分数或上下文敏感字形等。然而，浏览器对这些在高级排版和插图程序中常见的特性的支持仍然不尽如人意。\n\
    \n您还应该知道，根据所使用的轮廓技术，OpenType 字体有两种不同的版本：\n\n- 使用 **TrueType 轮廓**的 OpenType 字体（OpenType\
    \ TT）\n- 使用 **PostScript 轮廓**的 OpenType 字体（OpenType PS）\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_190_0.png)\n\
    \n> OpenType 有两种不同的版本。\n\n**OpenType PS** 是一种所谓的基于 CFF 的文件格式（CFF = 紧凑文件格式）。这在使用\
    \ OpenType PS 字体作为网页字体时很重要，因为在 Windows 平台上，基于 PostScript 的格式**不使用亚像素渲染**显示，这会严重影响渲染质量。\n"
