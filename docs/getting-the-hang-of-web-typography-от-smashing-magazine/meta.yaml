    # New Text-Decoration Properties


    One problem with the `text-underline` property is that it gives us little control.
    The [latest draft of the specification](http://), however, **suggests new and
    improved properties** that may give us fine-grained control. You can''t use them
    yet, but we''ll give you a condensed sneak peek at what may come.


    **`text-decoration-line`**

    Takes the same values as `text-decoration`: none, `underline`, `overline` and
    `line-through`.


    **`text-decoration-color`**

    Specifies the color of the line of the previous property.


    **`text-decoration-style`**

    Takes the values of solid, double, dotted, dashed and wave


    **`text-decoration`**

    The shorthand for the three preceding properties. If you specify a value of only
    one of `none, underline, overline` or `line-through`, then the property will be
    backwards-compatible with CSS Level 1 and 2. But if you specify all three values,
    as in `text-decoration: red dashed underline`, then it is ignored in browsers
    that don''t support them.


    **`text-decoration-skip`**

    Specifies whether the text decoration should skip certain types of elements. The
    proposed values are `none`, `images`, `spaces`, `ink` and `all`.


    **`text-underline-position`**

    With this property, you can control, for example, whether the underline should
    cross the text''s descenders or not: `auto`, `before-edge`, `alphabetic` and `after-edge`.'
