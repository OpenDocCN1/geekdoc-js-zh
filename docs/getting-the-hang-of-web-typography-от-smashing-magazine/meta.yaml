    # 8. Clean Rags


    When setting a block of text unjustified with a left or right alignment, be sure
    to keep the rag (the uneven side) balanced without any sudden "holes" or awkward
    shapes. A bad rag can be unsettling to the eye and distract the reader. A good
    rag has a "soft" unevenness, without any lines that are too long or too short.
    There is no way of controlling this in CSS, so to achieve a good rag you must
    make manual adjustments to the block of text.'
