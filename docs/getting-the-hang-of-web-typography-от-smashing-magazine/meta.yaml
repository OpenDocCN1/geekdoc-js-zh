- md: ' ## Webtype


    ### Cons


    Some fonts are expensive compared to other web font services.


    ### Pricing


    Free 30-day trial on all fonts. Fonts start at $10 per year per site.


    ### Fee Schedule


    Annual subscription


    ### Our Experience with Webtype


    Webtype was easy to set up and use from the signup process on. Just browse and
    purchase fonts (a 30-day free trial licence is available for testing fonts) and
    then create projects. Select the font you want to use for each project and you''ll
    be given a link code and CSS selector for each font. Then you copy and paste them
    into your HTML and CSS files and you''re ready to go.


    Make sure you click "Save" from the CSS resource page that gives you the code,
    or it won''t be live. Resource size is also given on this page, which can be helpful
    if you''re trying to estimate bandwidth usage. The load time for the font was
    possibly a bit slower than some of the other services here, despite the small
    file size of the font tested.


    ## Fontdeck


    [Fontdeck](http://fontdeck.com) is a relatively new service by [Clearleft](http://clearleft.com)
    and [OmniTI](http://omniti.com). It was conceived in March 2009 by Jon Tan and
    Richard Rutter as a way to bring quality fonts to a wide audience while leveling
    the playing field for type foundries. It went into private beta in January 2010
    and was open to the public in June of 2010.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_200_0.png)


    ### Font Selection


    600, with plans for this number to be doubled before Christmas.


    ### Advantage Over Other Services


    Only pay for the fonts you want to use. No bandwidth limit. Unlimited trial periods
    for all fonts (with a 20 IP address cap).


    ### Pros


    Easy to set up. Affordable options available. Automatically include similar style
    fonts in the font stack. Pure CSS with no JavaScript required.


    ### Cons


    No self-hosting option available. Fonts not available for desktop use.


    ### Pricing


    Some free fonts, but most start at $2.50 per year per site.


    ### Fee Schedule


    Annual subscription (which applies only to fonts on live Web sites; as mentioned,
    all fonts have unlimited trial periods).


    ### Our Experience with Fontdeck


    Fontdeck was incredibly easy to set up. While it does require manual insertion
    of the CSS selectors into the stylesheet for your site (which is by design, to
    give designers as much control as possible), it provides the code for this immediately
    without the added step of setting up a stylesheet (the link is ready as soon as
    you select to add the font). Prior to purchasing the licence, the first 20 visitors
    to your site can see the font.


    I did find that I had to add the subdirectory to the hostname in order to get
    it working. But all the options and controls are located on a single page for
    each font, making it easy to update settings. Fonts are displayed quickly, but
    as with the other services, there is a split of a second when you can see the
    default font.


    One added bonus from Fontdeck is that they include similar style fonts in the
    font stack, in case the user''s browser doesn''t support `@font-face`, and to
    help with the perceived change in text. Many of the other services just use the
    default font or a generic serif/sans-serif.


    ## Fonts Live


    [Fonts Live](http://www.fontslive.com) is a new web font service from [Ascender
    Corporation](http://www.ascendercorp.com) — the company behind the "Droid" fonts
    for Google''s Android mobile platform, the "Segoe" family of fonts for Microsoft
    Windows, and the Ascender Fonts desktop font web store. Fonts Live is similar
    to Webtype (both were developed by [DevBridge](https://www.devbridge.com/), however,
    Fonts Live serves fonts exclusively from Ascender and its partners.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_202_0.png)


    ### Font Selection


    499


    ### Advantage Over Other Services


    Font quality


    ### Pros


    Flexible pricing. Desktop licence available. Option to self-host web fonts. Integration
    with Google Font API. JavaScript-free integration. Now offering [Hallmark fonts](https://www.fonts.com/hallmark-fonts).


    ### Cons


    Some fonts are expensive compared to other web font services. Back-end was among
    the least user-friendly of the services featured here.


    ### Pricing


    Free 30-day trial on all fonts. Fonts start at $10 per year per site.


    ### Fee Schedule


    Annual subscription


    ### Our Experience with Fonts Live


    Setting up Fonts Live is a bit more labor intensive than setting up some others
    featured here. Setting up the service wasn''t without its bugs, either. First
    of all, read the documentation before you start, or you''re likely to get confused.
    With the first font I tried (Corsiva Italic), the site was unable to set up the
    resource and kept returning errors. It also created blank files for each of these
    failures, meaning I had to go in and manually delete them. Not sure if this was
    just an exception for that particular font or if it''s a more widespread problem.
    There was no mention of it in the site''s documentation.


    I had better luck with the second font I tried (Romany). This time it created
    the resource without any issues. From there, you have to insert the stylesheet
    ("resource" in Fonts Live terms) link in your header and then insert the font
    family, style, and weight for whichever elements you want styled. The plus side
    here is that you don''t run into issues with your original stylesheet interfering.
    Once it was up and running, however, it was noticeably faster serving the fonts
    than TypeKit, though this is likely due to smaller file sizes in the fonts used.


    ## TypeFront


    **TypeFront** is a hosting-only service which lets you upload a font you already
    own, as long as it has a web-friendly licence (make sure you read the licence
    agreement carefully!). Once you add the domain(s) you want to use, TypeFront provides
    you with the code to add to your Web site.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_204_0.png)


    **Font Selection**: N/A


    ### Advantage Over Other Services


    Ideal for do-it-yourself designers and developers who understand the ins and outs
    of web typography.


    ### Pros


    Inexpensive. No noticeable delay when displaying web fonts.


    ### Cons


    You must supply your own fonts. Requires a solid understanding of your font licence
    agreement.


    ### Pricing


    Free plan offers 1 font and 500 requests per day. Paid plans start at $5 per month
    (Australian dollars) and include 10 hosted fonts and 5000 requests per day. 30-day
    trial on all paid plans.


    ### Fee Schedule


    Monthly subscription


    ### Our Experience with TypeFront


    Once you''ve signed up for an account, uploading fonts is simple. Just make sure
    the fonts you''re using have a web-friendly licence. From this point you have
    to enable the format you''d like to use for the font (included are EOT, OpenType,
    SVG, TrueType, and WOFF — at least for the font I used). Once one of those formats
    is enabled, you have to add domains.


    After you''ve enabled your formats and set up the domains you want to use, you
    have to copy the `@font-face` code into your CSS files and add the font to your
    font stacks. The big advantage TypeFront has over the other services listed here
    is that there is no noticeable delay before the correct font is displayed.


    ## Fontspring


    [Fontspring](https://www.fontspring.com) offers downloadable fonts for self-hosting.
    Unlike a hosted service, Fontspring provides downloadable font files and sample
    code to host web fonts on your own.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_206_0.png)


    ### Font Selection


    1,937 families


    ### Advantage Over Other Services


    No recurring subscription fee


    ### Pros


    Large font selection. No recurring fees or bandwidth restrictions. Desktop licence
    included.


    ### Cons


    Font quality varies. Self-hosting only, which requires additional setup and technical
    skills.


    ### Pricing


    Free or up to several hundred dollars depending on the font family


    ### Fee Schedule


    One-time fee


    ### Our Experience with Fontspring


    Because these are self-hosted files, it''s a bit harder to get everything set
    up properly than it is with the other services here. When you purchase and download
    a font that includes an `@font-face` licence, the download package includes all
    the files you''ll need for web implementation, including the various font file
    formats like EOT and WOFF.


    I found it easier to just copy and paste the stylesheet information included into
    the existing site''s stylesheet. Once that''s done, you need to make sure your
    fonts are loaded into the same folder as your stylesheet (or change the URL information
    in the CSS). Add the font to your font stack and you''re ready to go.


    The speed at which the fonts loaded was roughly the same as for most of the other
    services here. The advantage to using this service is that you own a permanent
    licence to the fonts, without any recurring annual fees and with no restrictions
    on bandwidth or traffic.


    ## Fonts.com Web Fonts


    Web fonts from [Fonts.com](https://www.fonts.com) is a new venture from [Monotype
    Imaging](https://www.monotypeimaging.com), the largest font distributor on the
    web. Fonts.com currently has, by far, the largest web font selection with more
    than 7,500 fonts.'
  mdcn: "\n ## Webtype\n\n### 缺点\n\n与其他网页字体服务相比，部分字体价格较高。\n\n### 定价\n\n所有字体均提供 30\
