  md: '# sIFR 2.0


    [sIFR](Scalable Inman Flash Replacement) was one of the first dynamic text replacement
    methods, developed in the spring of 2005. It uses JavaScript and Flash to convert
    any text you designate on a page to any typeface you choose and has been released
    as open source under the [CC-GNU LGPL](https://creativecommons.org/licenses/LGPL/2.1/)
    licence, so it''s free for anyone to use.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_162_0.png)


    sIFR is fully accessible to screen readers, because it simply displays the original
    text if JavaScript or Flash isn''t enabled. And because of the way text is rendered,
    if your visitors zoom in using a browser''s text-zoom option, the'
  merge: -1
  pgno: 162
