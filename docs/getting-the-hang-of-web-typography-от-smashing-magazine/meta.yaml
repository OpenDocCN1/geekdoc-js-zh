  md: '# # 10 Principles For Readable Web Typography


    By Matt Cronin


    Readability is one of the more important aspects of Web design usability. Readable
    text affects how users process the information in the content. Poor readability
    scares readers away from the content. On the other hand, done correctly, readability
    allows users to efficiently read and take in the information in the text. You
    want users to be able to read your content and absorb it easily.


    In this post, we''ll explain some **web typography terms** and how they play into
    **readability**; we''ll present numerous tips to help improve the readability
    of your content; and we''ll showcase very readable Web sites, layouts and articles.


    # ## The Terms, And What Each Means For Readability


    There are many factors that play into the readability of text. There are also
    a number of terms, all very important. Here are a few of the more common web typography
    terms and an explanation of how each term affects readability.


    ### Hierarchy

    Every typographic layout needs the essential element of hierarchy. Hierarchy defines
    how to read through content. It shows the user were to start reading and where
    to read through. It differentiates headers from body text. Although colors of
    text boxes can be used to contrast headers and body text, hierarchy refers to
    the difference in size between these'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'elements. Hierarchy plays a huge part in how scannable a layout is. It is an
    important technique that needs to be mastered to achieve readable web typography.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_25_0.png)


    > *UXBooth uses a very clean hierarchy to achieve readable web typography.*'
  merge: -1
