    italics is widely considered to be the ideal form of emphasis. Some other common
    forms of emphasis are: bold, caps, small caps, type size, color, underline or
    a different typeface. No matter which you choose, try to limit yourself to using
    only one. Combinations such as caps-bold-italic are disruptive and look clumsy.


