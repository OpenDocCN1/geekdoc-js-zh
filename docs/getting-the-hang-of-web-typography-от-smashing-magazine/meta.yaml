  md: '# Crisp


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_14_0.png)


    The Crisp setting maintains much of the font’s original weight and curvature but
    cleans up some of the awkward pixels created by light serifs and thin strokes
    — which is especially useful for larger point sizes.


    With the Crisp setting, however, you sacrifice the ability to nudge the layer
    on the y-axis.


    # Strong


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_14_1.png)


    The *Strong* setting is notorious for adding unnecessary weight to a typeface,
    but it provides the most freedom with translating the origin, with 32 x-axis variations
    and 16 on the y-axis.


    The variety of origins with this setting can come in very handy when working with
    complex letterforms. *Strong* may also be useful when working with a typeface
    that has very thin strokes.


