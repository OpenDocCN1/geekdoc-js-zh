- img_proc: true
  md: '![](img/45c2114e61862fb7d9e9d1d966d826ec_13_0.png)


    *13pt and 14pt Arial render with the same cap height but different x-heights.*


    # Sharp


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_13_1.png)


    The Sharp setting uses very tight grid-fitting and produces sharp, if not too
    sharp, type. The plotting of pixels with this setting is very similar to how the
    None setting plots them but allows for a certain degree of smoothing. In fact,
    if pixels are set atop one another, you can actually see that a majority of solid
    pixels carry over from None to Sharp.


    While the cap height and x-height typically remain the same, you might see an
    increase in character weight and width.


    **Note** that Sharp has a tendency to completely cut subtle shape variations from
    rendering and sometimes causes inconsistent letterforms, so if typeface integrity
    is important to you, you may want to try a different setting.'
