    ![](img/45c2114e61862fb7d9e9d1d966d826ec_48_0.png)


    # 5. Treat Text as a User Interface


    Text within interfaces is extremely important. In the book [Getting Real](http://www.gettingreal.com)
    from 37 Signals (available for free), the author states how “every letter matters.”
    Word choice within user interfaces can make or break the functionality of the
    site. How those words are presented is equally important. Letterforms that are
    not styled give no indication as to what users should interact with.


    Cameron Moll mentions the concept of treating text as a user interface in his
    article [Nine skills that separate good and great designers](http://www.cameronmoll.com).
    There is an'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'accompanying presentation called **Essential Web Skills** that was done at
    Webmaster Jam in Dallas Texas. In this presentation, he describes how text is
    a fundamental part of the user interface. He also mentions that text makes an
    interface more “*accessible and digestible.*”


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_49_0.png)


    The image above is an example he uses of **text being used as a user interface**.
    On the left you’ll find an unformatted text. On the right you’ll find the text
    which was given a function in the user interface. Notice how the color and weight
    of the text differ. There is an ample spacing between paragraphs and within lines.
    Links are made to stand out and are easy to identify. To view the original of
    this before and after image you’ll need to download the presentation from Cameron’s
    site.


    # Further Web Typography Resources


    +   1. [The Destination Matters More Than the Journey](#)


    This is a classic article on web typography over on Digital Web. It reminds us
    of the need to help users navigate through Web sites by using well'
