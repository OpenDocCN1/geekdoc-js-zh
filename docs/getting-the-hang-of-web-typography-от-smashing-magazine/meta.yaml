    \ 定义了`hyphenate`属性，该属性通过样式表增加了对断字的支持。此处包含对`hyphenate`属性的描述，仅供参考。\n\n| 名称： | hyphenate\
    \ |\n|---|---|\n| 值： | none \\| auto |\n| 初始值： | none |\n| 应用于： | 所有元素 |\n| 继承：\
    \ | 是 |\n| 百分比： | 不适用 |\n| 媒体： | 视觉 |\n| 计算值： | 指定值 |\n\n| 名称： | hyphenate-dictionary\
    \ |\n|---|---|\n| 值： | auto \\| <uri> |\n| 初始值： | auto |\n| 应用于： | 所有元素 |\n| 继承：\
    \ | 是 |\n| 百分比： | 不适用 |\n| 媒体： | 视觉 |\n| 计算值： | 指定值 |\n\nW3C 网站上关于断字的[提议规范](https://www.w3.org)\n\
    \n这是一个很好的例子，说明了**感兴趣的网页设计师的参与**是何等重要。在这些属性最终确定之前进行思考和测试，与\"标新立异\"或炫耀无关。通过**对规范提出修改建议**并用示例说明我们的意见，我们正在为更好、更健壮的规范做出贡献。\n\
    \n另一个尚未在大多数浏览器中实现的 CSS3 属性（只有 IE 支持，且仅部分支持）是`text-align-last`。\n\n如果你的文本设置为两端对齐，你可以定义段落最后一行或强制换行前最后一行的对齐方式。该属性接受以下值：start、end、left、right、center\
    \ 和 justify。\n\n## Unicode 范围和语言\n\n### Unicode 范围\n\n`unicode-range`属性允许你定义给定字体支持的**Unicode\
    \ 字符范围**，而不是提供完整的范围。这对于限制对多种语言或数学符号的支持从而减少带宽使用会很有用。\n\n假设你想在页面中包含一些日文字符。使用`font-face`规则，你可以对同一个\
    \ font-family 进行多次声明，每次声明提供不同的字体文件下载以及不同的 Unicode 范围（甚至可以是重叠的范围）。浏览器应该只下载渲染该特定页面所需的范围。要查看`unicode-range`如何工作的示例，请访问[规范草稿页面](link)。\n\
    \n### 语言\n\n使用`:lang`伪类来创建**语言敏感型排版**。这样，你可以为法语文本（`fr`）设置一种背景色，为德语文本（`de`）设置另一种：\n\
    \n```\ndiv:lang(fr) {\n    background-color: blue;\n}\n\ndiv:lang(de) {\n    background-color:\
    \ yellow;\n}\n```\n\n你可能会想，为什么我们不能简单地使用属性选择器，像这样：\n\n```\n1 div[lang|=fr] {\n\
    2   background-color: blue;\n3 }\n```\n\n这里，我们 targeting 所有`lang`属性为`fr`或以`fr`开头后跟`-`的`div`元素。但如果该`div`内部有元素，它们不会被此选择器定位，因为它们的`lang`属性没有被指定。通过使用`:lang`伪类，`lang`属性会**继承到元素的所有子元素**（甚至整个`body`元素都可以持有该属性）。\n\
    \n好消息是所有主流浏览器的最新版本都支持这个伪类。\n\n### 结论\n\n浏览本文中的示例时，你可能会想为什么要为这些属性费心。确实，该规范远未获得批准，而且可能会随时间变化，但现在是进行实验并为最终规范做出贡献的时候。\n\
    \n尝试这些新属性，并思考它们可以如何改进，或者你如何实施它们以使未来的工作更加轻松。拥有**实施案例**对于将属性添加到规范中以及更重要的是在浏览器中实现它来说都很重要。所以，尽你的一份力来改善未来网页设计师和你自己的处境吧。\n\
    \n## 网页上的丰富排版：技术与工具\n\n*作者：Cameron Chapman*\n\n让我们面对现实吧：网页安全字体非常局限。能够被广泛采用并被认为是\"\
    网页安全\"的字体大概只有十几种，而这些字体除了用于正文之外，实在谈不上多么出色。当然，Georgia、Arial 或 Times New Roman 对于网站上的大部分文本来说完全够用，但如果你想为标题或引用语之类的地方用点不同的字体呢？那该怎么办？\n\
    \n你有几个选择。很多人会选择更精细的[CSS 字体栈](https://example.com)，将自己偏好的字体放在前面。但这仍然会让很大一部分访客看到同样的旧网页安全字体。\n\
    \n于是**动态文本替换**登场了。除了字体栈之外，为什么不将标题文本替换为图像、嵌入式字体或一点点 Flash 呢？下文描述的方法比你想象的要简单。而且最终结果是，绝大多数用户都会看到你希望他们看到的精美排版。\n\
    \n不过要先提个警告：**不要将动态文本替换用于页面上的所有文本**。那样做只会拖慢速度并让访客感到沮丧。相反，把它留给标题、菜单项、引用语和其他小段文本吧。\n\
    \n## sIFR 2.0\n\n[sIFR](Scalable Inman Flash Replacement)是最早的动态文本替换方法之一，于 2005\
    \ 年春季开发。它使用 JavaScript 和 Flash 将页面上你指定的任何文本转换为你选择的任何字体，并以 [CC-GNU LGPL](https://creativecommons.org/licenses/LGPL/2.1/)\
    \ 许可证作为开源软件发布，因此任何人都可以免费使用。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_162_0.png)\n\
    \nsIFR 对屏幕阅读器完全可访问，因为如果未启用 JavaScript 或 Flash，它只会显示原始文本。而且由于文本渲染的方式，如果你的访客使用浏览器的文本缩放选项放大，替换后的文本也会放大（不过仅在页面加载时如此，如果之后缩放则不会）。\n\
    \n## sIFR 的工作原理\n\n虽然 sIFR 是一个相当复杂的系统，但其基本概念很简单：JavaScript 检查浏览器中是否安装了 Flash。如果没有（或者未安装\
    \ JavaScript），就会在此处停止，访客会以你在样式表中指定的任何字体看到文本。如果安装了 Flash，则 JavaScript 会测量页面上你指定要转换的每个元素。\n\
    \n一旦 JavaScript 测量完所有元素，它就会用一个与原始元素大小相同的 Flash 影片替换每个元素。原始文本作为变量传递到 Flash 影片中，然后\
    \ Flash 文件中的 ActionScript 代码以你选择的字体绘制文本，并将其缩放到填满 Flash 影片占据的区域。\n\n## sIFR 的优点\n\
    \n- 几乎适用于任何字体\n- 在大多数情况下，如果用户未安装 Flash 或 JavaScript，会优雅降级为原始 HTML 或 (X)HTML 文件\n\
    - 跨浏览器、跨平台兼容\n- 由于原始 (X)HTML 文档保持不变，人们通常对 Flash 存在的 SEO、可访问性等担忧实际上不成问题\n\n## sIFR\
    \ 的缺点/劣势\n\n- 需要同时安装 JavaScript 和 Flash\n"
