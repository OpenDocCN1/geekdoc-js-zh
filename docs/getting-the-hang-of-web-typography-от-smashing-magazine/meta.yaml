    ## P+C DTR (With Word-Wrapping and Inner Tags)


    [P+C DTR (with word-wrapping and inner tags)](about:blank) (the "P" and "C" standing
    for PHP and CSS) is a text replacement method that works with PHP and CSS rather
    than Flash or JavaScript. Considering that PHP is a server-side language, and
    every modern browser automatically supports CSS, this method has some advantages
    over those that use Flash or JavaScript. This version of P+C DTR is based on the
    [original P+C DTR method](about:blank), but with the addition of word-wrapping
    and inner tags.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_164_0.png)


    ## How P+C DTR Works


    P+C DTR uses PHP''s output buffering functions to extract the heading text and
    give it an inline style that points to the script that replaces the text with
    an image. Therefore, the only requirement on the back end is that the host server
    supports [PHP image generation](https://example.com).


    The CSS comes into play in designating the heading''s font color, size and background
    color. The styling for the heading is kept in a separate CSS file, but the file
    is called only once per browser session, so it doesn''t have a noticeable impact
    on page load time.


    ## Benefits of P+C DTR


    - Doesn''t require Flash or JavaScript

    - Not affected by ad blockers

    - Output is valid XHTML and CSS


    ## Drawbacks/Disadvantages of P+C DTR


    - Will not work if images are disabled in the browser

    - headings have to be uniform throughout the Web site; you can''t have one style
    of heading on one page and another on a different page (unless you use a different
    style sheet for each page)

    - Although it does seem possible to select the text in the headings, it is difficult
    to do so


    ## Cufón


    [Cufón](https://example.com) was created as an sIFR alternative. It uses JavaScript
    to replace text, without Flash, making it more widely compatible than sIFR.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_166_0.png)


    ## How Cufón Works


    Using Cufón is a bit more involved than a lot of other DTR methods. You have to
    go through an extra step: converting whatever fonts you want to use to a format
    that Cufón can work with. An [automated tool](link) can do this, though, so technically
    it is not more complicated than the other methods.


    Once you''ve converted the fonts, Cufón simply replaces the text in your browser
    with the font you''ve designated via the JavaScript. Activating Cufón is as simple
    as uploading the script and putting a couple of lines of code in the head of your
    document.


    ## Benefits of Cufón


    - Doesn''t require Flash

    - Technically, it''s quite easy to use — even with the extra step of converting
    fonts

    - In general, the embedded text can be copied and pasted in any application, but
    it doesn''t always work – e.g. there are problems in Chrome 3 and Firefox 3.5.2

    - Because text is rendered using only JavaScript, it''s **quicker than many other
    methods**

    - Degrades gracefully, if JavaScript isn''t supported


    ## Drawbacks/Disadvantages of Cufón


    - Converts your text to image files, which means it''s not as accessible as plain
    (X)HTML

    - Does not seem to work in IE8 unless the page is viewed in compatibility mode
    It *does* work in IE 8.

    - Requires JavaScript

    - Accessibility issues: Cufón wraps the text inside canvases and spans and so
    Because. Each. Word. Is. In. Its. Own. Span. Some. Screen. Readers. Will. Read.
    The. Text. Like. This.

    - In Firefox, if CSS is disabled, a bizarre text duplication occurs

    - Sometimes has problems with text selection


    ## Typeface.js


    [Typeface.js](link) is a JavaScript-based dynamic text replacement method that
    embeds fonts on your page rather than converting them to images. This means that
    visitors are presented with a page that acts (and really is) like a regular HTML
    and CSS page.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_168_0.png)


    ## How Typeface.js Works


    Whereas most of the methods mentioned so far either replace the text with Flash
    or turn the text into an image, Typeface.js styles text with an embedded font
    using JavaScript. So, your text stays as accessible as it was before, without
    the need for Flash.


    Typeface.js uses the browser''s **vector drawing capabilities** to draw the text
    in your HTML documents. All modern browsers support this (Firefox, Opera and Safari
    use the <canvas> element and SVG, and Internet Explorer supports VML).


    ## Benefits of Typeface.js


    - Leaves the text on your page as text, making it more accessible

    - Flash is not required

