  md: '# ## Output


    # ### Displays


    Because very few people have monitors with resolutions higher than 100 pixels
    per inch (PPI), we have to rely on software to trick our eyes into thinking that
    the resolution is greater than it really is. Some advances are being made by display
    manufacturers, but they are still beyond the average Web surfer''s budget.


    A typical LCD monitor (which you''re probably reading this on) has a [dot pitch](https://en.wikipedia.org/wiki/Dot_pitch)
    of around .20 or .30 millimeters. New technologies, such as the [Ferro Liquid
    Crystal display](https://en.wikipedia.org/wiki/Ferroelectric_liquid_crystal_display)
    are touted to reduce that number to .012 millimeters. Bringing this technology
    to the mainstream would bring tremendous advantages to the world of design and
    on-screen reading. However, until they become affordable for the average consumer,
    we''ll be relying on software advances.


    # ### Operating System


    Microsoft and Apple have both delivered technological advances in the world of
    anti-aliasing, but they have somewhat different approaches. The current versions
    of both operating systems use anti-aliasing and subpixel rendering. Both vendors
    have dramatically increased legibility within their operating systems, but controversy
    has arisen over the aesthetics and legibility of each.


    Microsoft''s entry in the competition — which is characterized by tight grid-fitting
    — is aptly named ClearType. By forcing characters tightly into the pixel grid,
    ClearType increases contrast along the edges of glyphs and renders more crisely.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Distinctly different is Apple''s Quartz 2D, which puts emphasis on maintaining
    the shape and integrity of the typeface. This certainly makes sense, given the
    high proportion of designers who work on Macs. But Quartz rendered type often
    appears blurry, which can cause eye strain with extended reading.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_19_0.png)


    Windows Vista and Window XP both use Microsoft''s ClearType rendered either by
    [Windows Presentation Foundation](Windows Presentation Foundation) or [Graphics
    Device Interface](Graphics Device Interface); both handle text in a very similar
    fashion, though WPF doesn''t snap horizontally to the pixel grid. Windows XP actually
    comes defaulted to monochromatic anti-aliasing.


    But ClearType can be turned on by going to **Control Panel → Appearance and Themes
    → Display**, clicking on the "Appearance" tab, selecting "Effects..." and changing
    the drop-down from "Standard" to "ClearType." The operating system itself allows
    for very little customization of ClearType; you basically choose between on and
    off. [Microsoft''s ClearType Tuner PowerToy](Microsoft''s ClearType Tuner PowerToy),
    though, allows some control over how it renders. Windows 7 brings a new'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'rendering platform, named DirectWrite, that introduces subpixel positioning
    and y-direction anti-aliasing. As seen in [this presentation](#), the advances
    made with DirectWrite are quite impressive and sure to be adopted by other vendors.


    Apple’s Quartz 2D now renders type using [Core Text](#), which has recently replaced
    [Apple Type Services](#). The Quartz 2D displays type much closer to the typeface’s
    original design, which is similar to how you might expect to see it in print form.


    While this seems like a good idea from a design perspective, it doesn’t hold up
    with legibility, at least not on common LCD screens. Quartz text could conceivably
    appear much better if we were using higher-resolution monitors. Because Apple
    has complete control over both the operating system and the hardware that it runs
    on, perhaps a 200 PPI iMac is just around the corner. We can hope!


    # Browsers


    The most current browsers today all inherit the anti-alias settings of the operating
    system. But with one anomaly. Firefox 3 in Mac OS X seems to inherit the operating
    system’s settings but also seems to apply more precise grid-fitting and kerning.
    Perhaps Mozilla is attempting to improve on Quartz’s blurry rendering.


    Unfortunately, we have no way to control or even tell how the user’s browser will
    render text. What we can do is understand the nuances of each browser and make
    sure that we deliver a suitable presentation across all viewing platforms.


    Below is a list of browser capabilities and type samples to help you gain some
    insight into how they handle anti-aliasing.'
  merge: -1
