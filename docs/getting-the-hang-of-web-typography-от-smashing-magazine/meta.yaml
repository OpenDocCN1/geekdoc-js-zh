    ## sIFR Lite


    Based on the original sIFR technique, [sIFR Lite](link) is a simpler, more user-friendly
    technique. The result is much more light-weight than the original and entirely
    object-oriented. It has been tested on Safari, Firefox, Camino, IE and Opera.


    ## How is this different than the original sIFR?


