    \ | URW Bookman L |\n| | Georgia | Georgia |\n| Century Schoolbook | | Century\
    \ Schoolbook L |\n| | New York | |\n| | | Bitstream Vera Serif |\n\n## Typechart\n\
    \nTypechart 向你展示网页安全字体和常见字体，并为标题、段落及其他排版元素推荐不同的尺寸和样式。它有大量不同的浏览选项，你可以在下载 CSS 之前预览字体在\
    \ Windows 和 Mac 机器上的显示效果。Typechart 唯一的缺点是它仅包含少数几种字体：Arial/Helvetica、Cambria、Georgia、Lucida\
