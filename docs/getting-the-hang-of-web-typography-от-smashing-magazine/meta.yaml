    ## 超出部分


    圆形或尖顶的大写字母，如 **S** 或 **B**，其高度与以名词形式出现的圆形字母如 **X** 或 **T** 略有偏差，以实现视觉上的均衡。大写字母低于[基线](https://en.wikipedia.org/wiki/Baseline_(typography))或高于大写字高的程度被称为超出部分。


    ## 衬线


    衬线既用作[古罗马体](https://en.wikipedia.org/wiki/Antiqua_(type))字体的同义词，也用作一个名词，指拉丁字母、阿拉伯数字或特殊字符的笔画末端和角落处延伸出的短线，如下图红色线条所示。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_247_0.png)


    关于衬线的起源存在许多不同的观点。其中最广泛接受的是由罗马天主教神父、教师和书法家爱德华·M·卡蒂奇在他1968年的著作《衬线的起源》中提出的解释。该书认为衬线起源于古罗马铭文。在石头上雕刻字母时会产生笔刷痕迹，这些痕迹在笔画末端和角落处会发散，从而形成了衬线。然而，这个术语本身很可能来自荷兰语单词
    **schreef**，意为笔画。


    关于使用衬线字体是否能提高文本的可读性，长期以来一直争论不休。尽管对于大多数印刷的古罗马体字体来说这确实成立——易读性测试表明，读者处理此类文本的速度是无衬线印刷品的五倍——但在屏幕设计中，更倾向于使用无衬线字体，如
    Verdana。然而，随着屏幕分辨率的提高以及[抗锯齿](https://en.wikipedia.org/wiki/Anti-aliasing)、[字体微调](https://en.wikipedia.org/wiki/Font_hinting)和[次像素渲染](link)等方法的应用，如今衬线字体只要不是太小，也可以在屏幕上正常显示和阅读。无衬线字体是屏幕设计更好选择的经验法则，随着技术标准的进步，在很大程度上已经过时了。


    ## 粗衬线体


    **埃及体**或 **Egyptienne** 是这一类字体的另一个名称，它发展于19世纪早期。粗衬线体基本上是加粗的古罗马体字体，但其衬线更为明显。在工业化早期，粗衬线体被用于新兴的广告业，在传单和海报上，它们比那些不够粗壮、不够有表现力的衬线字体给人留下更深刻的印象。据说“埃及体”这个术语源于当时人们对一切古老事物，尤其是埃及事物的兴趣，这源于拿破仑在埃及的考古发现。


    ## 笔画粗细


    这个术语可以追溯到书写工具的物理宽度，以及随后根据工具宽度而产生的较细或较粗的书写/字体。在现代桌面出版中，字体系列具有不同的字重，例如 **细体**、**常规体**、**粗体**或**半粗体**。此外，一些字体在一个特定字体中笔画粗细会有所不同，如下图所示。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_248_0.png)


    ## 孤行


    段落最后一行中的单个单词（参见第[5. 孤行和寡行](https://example.com/5)段的插图）。排版术语的表达在不同语言中有所不同。英语中称为“widow”（孤行）的术语，在德语中是“whore''s
    child”。


    ## 空白


    在微观排版中，空白或负空间是指字母周围和内部的自由空间，例如上面插图中字母 P 弧线内的空间。在宏观排版中，负空间是指印刷页面或网页上未被文字或插图填充的部分，更广泛地说，是指页边距、栏、文字行或图形以及其他绘制或描绘对象之间的每一个未标记的空间。


    ## x 字高


    在排版中，**x 字高**或**字身高度**是指字体中[基线](https://example.com/baseline)和中线之间的距离。通常，这是字体中字母
    *x* 的高度，也适用于 *u*、*v*、*w* 和 *z*。（弯曲的字母如 *a*、*c*、*e*、*m*、*n*、*o*、*r* 和 *s* 由于[超出部分](https://example.com/overshoot)往往会略微超过
    x 字高。）在现代排版中，x 字高只是字体的一个设计特征，虽然 *x* 的高度通常正好是一个 x 字高，但在一些更具装饰性或手写体设计中，情况可能并非总是如此。


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_249_0.png)


