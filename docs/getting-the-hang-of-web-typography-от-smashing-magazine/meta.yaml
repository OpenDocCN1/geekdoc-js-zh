    # # The Typography Dress Code: Principles of Choosing and Using Typefaces


    *By Dan Mayer*


    For many beginners, the task of picking fonts is a mystifying process. There seem
    to be endless choices — from normal, conventional-looking fonts to novelty candy
    cane fonts and bunny fonts — with no way of understanding the options, only never-ending
    lists of categories and recommendations. Selecting the right typeface is a mixture
    of firm rules and loose intuition, and takes years of experience to develop a
    feeling for. Here are five guidelines for picking and using fonts that I''ve developed
    in the course of using and teaching typography.


    # ## Dress For The Occasion


    Many of my beginning students go about picking a font as though they were searching
    for new music to listen to: they assess the personality of each face and look
    for something unique and distinctive that expresses their particular aesthetic
    taste, perspective and personal history. This approach is problematic, because
    it places too much importance on individuality.


    For better or for worse, picking a typeface is more like getting dressed in the
    morning. Just as with clothing, there''s a distinction between typefaces that
    are expressive and stylish versus those that are useful and appropriate to many
    situations, and our job is to try to find the right balance for the occasion.
    **While appropriateness isn''t a sexy concept, it''s the acid test that should
    guide our choice of font.**'
  - '[PAGE 106]


    My “favorite” piece of clothing is probably an outlandish pair of 70s flare bellbottoms
    that I bought at a thrift store, but the reality is that these don’t make it out
    of my closet very often outside of Halloween. Every designer has a few favorite
    fonts like this — expressive personal favorites that we hold onto and wait for
    the perfect festive occasion to use. More often, I find myself putting on the
    same old pair of Levis morning after morning. It’s not that I like these better
    than my cherished flares exactly… I just seem to wind up wearing them most of
    the time.


    Every designer has a few workhorse typefaces that are like comfortable jeans:
    they go with everything, they seem to adapt to their surroundings and become more
    relaxed or more formal as the occasion calls for, and they just seem to come out
    of the closet day after day. Usually, these are faces that have a number of weights
    (Light, Regular, Bold) and/or cuts (Italic, Condensed). My particular safety blankets
    are: Myriad, Gotham, DIN,Akzidenz Grotesk and Interstate among the sans; Mercury,
    Electra and Perpetua among the serif faces.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_106_0.png)'
  - '[PAGE 107]


    A large type family like **Helvetica Neue** can be used to express a range of
    voices and emotions. Versatile and comfortable to work with, these faces are like
    a favorite pair of jeans for designers.


    # ## Know Your Families: Grouping Fonts


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_107_0.png)


    The clothing analogy gives us a good idea of what kind of closet we need to put
    together. The next challenge is to develop some kind of structure by which we
    can mentally categorize the different typefaces we run across.


    Typefaces can be divided and subdivided into dozens of categories (Scotch Modern,
    anybody?), but we only really need to keep track of five groups to establish a
    working understanding of the majority of type being used in the present-day landscape.


    The following list is not meant as a comprehensive classification of each and
    every category of type (there are plenty of great sites on the web that already
    tackle this, such as [Typedia''s type classifications](http://www.typedia.com/learn/only/35/type-classifications))
    but rather as a manageable shorthand overview of key groups. Let''s look at two
    major groups without serifs (serifs being the little feet at the ends of the letterforms),
    two with serifs, and one outlier (with big feet).'
- md: '## 1. Geometric Sans


    I''m actually combining three different groups here (Geometric, Realist and Grotesk),
    but there is enough in common between these groups that we can think of them as
    one entity for now. Geometric Sans-Serifs are those faces that are based on strict
    geometric forms. The individual letter forms of a Geometric Sans often have strokes
    that are all the same width and frequently evidence a kind of “less is more” minimalism
    in their design.


    **Examples** of Geometric/Realist/Grotesk Sans:


    - Helvetica

    - Univers

    - Futura

    - Avant Garde

    - Akzidenz Grotesk

    - Franklin Gothic

    - Gotham


    At their best, Geometric Sans are clear, objective, modern, universal; at their
    worst, cold, impersonal, boring. A classic Geometric Sans is like a beautifully
    designed airport: it’s impressive, modern and useful, but we have to think twice
    about whether or not we’d like to live there.


    ## 2. Humanist Sans


    These are Sans faces that are derived from handwriting — as clean and modern as
    some of them may look, they still retain something inescapably human at their
    root. Compare the ''t'' in the image above to the ''t'' in ''Geometric'' and note
    how much more detail and idiosyncrasy the Humanist ''t'' has.


    **Examples** of Humanist Sans:


    - Gill Sans

    - Frutiger

    - Myriad

    - Optima

    - Verdana


    This is the essence of the Humanist Sans: whereas Geometric Sans are typically
    designed to be as simple as possible, the letter forms of a Humanist font generally
    have more detail, less consistency, and frequently involve thinner and thicker
    stroke weights — after all they come from our handwriting, which is something
    individuated. At their best, Humanist Sans manage to have it both ways: modern
    yet human, clear yet empathetic. At their worst, they seem wishy-washy and fake,
    the hand servants of corporate insincerity.


    ### 3. Old Style


    Also referred to as [''Antiqua''](link) or ''Venetian'', these are our oldest
    typefaces, the result of centuries of incremental development of our calligraphic
    forms. Old Style faces are marked by little contrast between thick and thin (as
    the technical restrictions of the time didn''t allow for it), and the curved letter
    forms tend to tilt to the left (just as calligraphy tilts).


    Old Style faces at their best are classic, traditional, readable and at their
    worst are... well, classic and traditional.


    **Examples** of Old Style:


    - Jenson

    - Bembo

    - Palatino

    - Garamond


    Garamond especially is viewed as traditional, because it was considered to be
    so perfect at the time of its creation that no one really tried much to improve
    on it for more than a century and a half.


    ## 4. Transitional and Modern


    An outgrowth of Enlightenment thinking, Transitional (mid 18th Century) and Modern
    (late 18th century, not to be confused with mid 20th century modernism) typefaces
    emerged as type designers experimented with making their letterforms more geometric,
    sharp and virtuosic than the unassuming faces of the Old Style period.


    Transitional faces marked a modest advancement in this direction – although Baskerville,
    a quintessential Transitional typeface, appeared so sharp to onlookers that people
    actually believed it could hurt one’s vision to look at it.


    In carving Modernist punches, type designers indulged in a kind of virtuosic demonstration
    of contrasting thick and thin strokes – much of the development was spurred by
    a competition between two rival designers who cut similar faces, Bodoni and Didot.
    At their best, transitional and modern faces seem strong, stylish, dynamic. At
    their worst, they seem neither here nor there – too conspicuous and baroque to
    be classic, too stodgy to be truly modern.


    **Examples** of transitional typefaces:


    - Times New Roman

    - Baskerville


    **Examples** of Modern serifs:


    - Bodoni

    - Didot


    ## 5. Slab Serifs


    Also known as [''Egyptian''](Egyptian), the Slab Serif is a wild card that has
    come strongly back into vogue in recent years. Slab Serifs usually have strokes
    like those of sans faces (that is, simple forms with relatively little contrast
    between thick and thin) but with solid, rectangular shoes stuck on the end. Slab
    Serifs are an outlier in the sense that they convey very specific – and yet often
    quite contradictory – associations: sometimes the thinker, sometimes the tough
    guy; sometimes the bully, sometimes the nerd; sometimes the urban sophisticate,
    sometimes the cowboy.


    **Examples** of Slab Serifs:


    - Clarendon, Rockwell

    - Courier

    - Lubalin Graph

    - Archer


    They can convey a sense of authority, in the case of heavy versions like Rockwell,
    but they can also be quite friendly, as in the recent favorite Archer. Many slab
    serifs seem to express an urban character (such as Rockwell, Courier and Lubalin),
    but when applied in a different context (especially Clarendon) they strongly recall
    the American Frontier and the kind of rural, vernacular signage that appears in
    photos from this period. Slab Serifs are hard to generalize about as a group,
    but their distinctive blocky serifs function something like a pair of horn-rimmed
    glasses: they add a distinctive wrinkle to anything, but can easily become overly
    conspicuous in the wrong surroundings.


    ## Don''t Be a Wimp: The Principle of Decisive Contrast


    So, now that we know our families and some classic examples of each, we need to
    decide how to mix and match and – most importantly – whether to mix and match
    at all. Most of the time, one typeface will do, especially if it''s one of our
    workhorses with many different weights that work together.


    If we reach a point where we want to add a second face to the mix, it''s always
    good to observe this simple rule: keep it exactly the same, or change it a lot
    – avoid wimpy, incremental variations.


    ## Correspondence and Contrast — Comfortable Coexistence


    This is a general principle of design, and its official name is correspondence
    and contrast. The best way to view this rule in action is to take all the random
    coins you collected in your last trip through Europe and dump them out on a table
    together.


    If you put two identical coins next to each other, they look good together because
    they match (correspondence). On the other hand, if we put a dime next to one of
    those big copper coins we picked up somewhere in Central Europe, this also looks
    interesting because of the contrast between the two — they look sufficiently different.


    **What doesn''t work so well** is when you put our dime next to a coin from another
    country that''s almost the same size and color but slightly different. This creates
    an uneasy visual relationship because it poses a question, even if we barely register
    it on a conscious level — our mind asks the question of whether these two are
    the same or not, and that process of asking and wondering distracts us from simply
    viewing.


    When we combine multiple typefaces on a design, we want them to coexist comfortably
    — we don''t want to distract the viewer with the question, are these the same
    or not?


    We can **start by avoiding two different faces from within one of the five categories**
    that we listed above all together — two geometric sans, say Franklin and Helvetica.
    While not exactly alike, these two are also not sufficiently different and therefore
    put our layout in that dreaded neither-here-nor-there place.


    If we are going to throw another font into the pot along with Helvetica, much
    better if we use something like Bembo, a classic Old Style face. Centuries apart
    in age and light years apart in terms of inspiration, Helvetica and Bembo have
    enough contrast to comfortably share a page:'
