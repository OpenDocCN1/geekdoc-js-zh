  md: '# Good Old @Font-Face Rule Revisted


    By Ralf Hermann


    With the new possibilities of the CSS3 property @font-face a veritable gold digging
    atmosphere is taking hold of web designers. There’s hope that the common monotony
    of system fonts will be abolished soon by web font embedding which enables web
    designers to choose practically any typeface and font-style they want – just like
    in print design. This article looks at the history and today’s possibilities of
    web font embedding.


    From the early days of the Internet web designers have used system fonts for the
    majority of Web sites. The Web site offers fonts like Times New Roman, Arial or
    Verdana to the browser. If the suggested font is installed on the client, the
    browser will use it. If not, the font is replaced by the client’s default font.
    This means that web designers only have little influence on what the Web site
    will look like, because the same Web site will be displayed with different fonts
    on different computers and in different browsers.


    ```

    1  h1  {

    2    font-family: Verdana, Arial, Helvetica, sans-serif;

    3  }

    ```


    With regard to typography, the web is way behind of what’s possible in print design.
    For example headlines: In print design condensed typefaces come in handy for headlines
    as they allow more words to fit in one line. In system font collections, however,
    there are usually no condensed fonts. Also, companies cannot ever use their own
    corporate fonts. Instead they have to replace their corporate typeface by standard
    fonts such as Arial, making a consistent corporate identity throughout all media
    impossible.'
  merge: -1
  pgno: 185
- img_proc: true
  md: "# @font-face already existed at the end of the 1990s\n\nThe possibility of\
    \ embedding any given font into a Web site has been around for a while. Netscape\
    \ 4 as well as Internet Explorer 4 – which was the first browser to support the\
    \ @font-face rule by the way – already supported @font-face end of the 1990s allowing\
    \ the ability to deposit fonts on the server and deliver them through the web\
    \ page.\n\n```\n@font-face {\n  font-family: Gentium;\n  src: url(fonts/gentium.eot);\n\
    }\n```\n\nHowever, this technique was ahead of its time. Font rendering used to\
    \ employ simple grayscale anti-aliasing at that time. This was no problem for\
    \ system fonts, which were laboriously optimized for rendering on screen, but\
    \ other fonts were not rendered properly as they lacked the benefits of the manual\
    \ on-screen optimization. Instead of improving web typography, the use of non-system\
    \ fonts made Web sites even worse.\n\nNo wonder that the @font-face rule was removed\
    \ in the CSS 2.1 specification. The use of system fonts remained the general practice\
    \ in web design, especially for copy. For headlines, several work-arounds have\
    \ been established, for example replacing the actual text by a bitmap file or\
    \ a flash movie displaying the headline in a particular font. These flash movies\
    \ themselves may utilize font embedding.\n\nAnother approach, which has come up\
    \ in the past few years is the replacement of headlines by vector graphics with\
    \ the help of Java Script. Services that offer this functionality are Typeface.js\
    \ and Cufón. But all of these techniques have some problem or another – be it\
    \ the incompatibility with search engines or problems with zooming in and out\
    \ of Web sites."
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Successful second run thanks to subpixel rendering


    The introduction of Safari 3.1 by Apple marked a turning point in the use of web
    fonts. This browser update brought back the old @font-face rule. A significant
    improvement came in the introduction of flat panel LCD monitors. These monitors,
    with a much higher screen resolution along with anti-aliasing via subpixel rendering
    have since become standard. Subpixel rendering makes use of the fact that each
    pixel on a color LCD is composed of individual red, green and blue subpixels.
    It uses these subpixels to anti-alias text, which increases the apparent resolution
    of an LCD display thus improving the rendering of text, even with very small font
    sizes.


    On Mac OS X platforms this function is activated by default. Windows uses its
    own trademark ClearType, which is activated by default in Windows Vista and Windows
    7, but kept turned off in Windows XP. In Microsoft Office 2007/2010, Internet
    Explorer 7 and higher, as well as Windows Live Messenger, the option ClearType
    is turned on by default, even if it is not enabled throughout the operating system.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_187_0.png)


    What is remarkable about Safari''s @font-face support is the fact that for the
    first time embedding of standard formats, namely TrueType (ttf) and OpenType (ttf/otf),
    is possible without any prior conversion as the following css code shows.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '```

    1 @font-face {

    2   font-family: GraublauWeb;

    3   src: url(fonts/graublau.otf) format ("opentype");

    4 }

    ```


    # The Font Foundries’ Concerns


    Suppliers of commercial fonts, however, where not exactly happy about the new
    functionality, because it means that everybody can download the embedded fonts
    and use them without paying a licence fee.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_188_0.png)


    *Safari 3.1 offers support for standard font formats for the first time – demo.*


    A vivid debate among browser companies and fount foundries was the result. While
    the foundries want commercial fonts to be protected from bootleg copies and unlawful
    use of fonts that are subject to licensing, browser companies do not feel obliged
    to claim the foundries’ copyrights. Just like with assets such as pictures, video
    or text, which copyrights are not controlled by the browser itself, the content
    providers were obliged to declare copyright protected fonts used on their Web
    sites, browser companies argue.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# The Current Web Font Formats


    By *Ralf Hermann*


    The relatively new possibility of embedding any font you like into Web sites via
    @font-face is an additional stylistic device, which promises to abolish the monotony
    of the usual system fonts. But it would have been all too easy, if there was only
    one web font format. Instead there''s quite a variety which we are going to present
    here.


    # Web Font Formats


    EOT, TTF, OTF, CFF, AFM, LWFN, FFIL, FON, PFM, PFB, WOFF, SVG, STD, PRO, XSF,
    …


    To find one''s way in this veritable jungle of font formats is not exactly easy.
    On the following pages we''ll have a closer look at the pros and cons of those
    font formats that are particularly relevant for their use on Web sites.


    # TrueType


    This format was developed in the late 1980s as a competitor to Adobe''s Type 1
    fonts used in PostScript. As a scalable outline format, it replaced the at that
    time common bitmap fonts being used for screen display. Microsoft took up the
    TrueType format as well and it soon evolved into the standard format for system
    fonts due to the fact that it offered fine-tuned control for a precise display
    of font at particular sizes.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# OpenType


    Microsoft and Adobe teamed up in developing this format. Based on the TrueType
    format, OpenType offers additional typographical features such as ligatures, fractions
    or context sensitive glyphs and the like. However, browser support of these features
    common in sophisticated layout and illustration programs is still unsatisfactory.


    You should also know that there are two different versions of OpenType fonts,
    depending on the outline technology used. There are:


    +   - OpenType fonts with **TrueType Outlines** (OpenType TT)

    - OpenType fonts with **PostScript Outlines** (OpenType PS)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_190_0.png)


    > OpenType comes in two different versions.


    **OpenType PS** is a so-called CFF based file format (CFF = compact file format).
    This is relevant when using OpenType PS fonts as web fonts, because PostScript
    based formats are **displayed without subpixel rendering** on Windows platforms
    which affects the rendering quality considerably.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'That''s why **TrueType based fonts are the better choice as web fonts**, even
    though Microsoft will solve this rendering issue in the future.


    As the structures of TrueType and OpenType fonts are very similar, **browsers
    most likely support both formats**. At any rate, browser support is available
    in Safari 3.1 and higher, Firefox 3.5 and Opera 10.


    # EOT


    Internet Explorer has supported the proprietary Embedded OpenType (EOT) standard
    from the late 1990s. It''s a variation of the TrueType and OpenType formats that
    provide the following particularities:


    +   - EOT fonts are a compact form of OpenType optimized for quick delivery on
    the web due to data compression.

    - By means of URL-binding, EOT fonts can be tied to a specific domain. The fonts
    can then only be delivered to and used on those web pages. The technique helps
    prevent fonts from being copied and used without licence.


    EOT is exclusively supported by Internet Explorer. Even though it might not succeed
    as web font format in the future, it still makes sense to use this format today
    in order to supply the users of various IE versions with modern web fonts. Current
    IE versions (< 9) do not use any other format.


    If you want to convert TTF fonts to natively compressed EOT files, you can use
    [eotfast](http://www.eotfast.com/) – it''s a free program for Windows and Mac.


    # WOFF


    Unlike EOT, the web Open Font Format (WOFF) is in the process of being standardized
    as a recommendation by the World Wide Web Consortium (W3C). The W3C published
    WOFF as a working draft in July 2010.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'WOFF came into existence as a kind of a compromise between font foundries and
    browser companies. No wonder that WOFF has been developed by two font designers
    (Erik van Blokland and Tal Leming) in cooperation with Mozilla developer Jonathan
    Kew. When it comes right down to it, WOFF is rather a wrapper that contains TrueType
    and OpenType fonts than a new format of its own. WOFF uses an integrated compression
    algorithm named zlib, which offers file size reduction for TrueType fonts of over
    40%. Further more, meta data can be added, e.g. a user''s licence. However, this
    data only presents informational material – it is not validated by browsers.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_192_0.png)


    > Thanks to WOFF Mozilla can use it''s corporate typeface FF Meta.


    The format has been supported by Firefox since version 3.6, Google Chrome since
    version 5.0. All other browser manufacturers are working on adding full support
    in future releases.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Fonts can be converted into the WOFF format by the online service [FONT SQUIRREL](https://www.fontsquirrel.com)
    free of charge.


    # SVG


    SVG fonts are text files that contain the glyph outlines represented as standard
    SVG elements and attributes, as if they were single vector objects in the SVG
    image. But this is also one of the biggest disadvantages of SVG fonts. While EOT,
    WOFF and PostScript-flavoured OpenType have compression built into the font format,
    SVG fonts are always uncompressed and usually pretty autocorrect.


    SVG fonts are not really an alternative to the other web font formats. However,
    as Mobile Safari only supports SVG fonts so far, it is the only format that can
    be used for the iPhone and iPad prior to iOS 4.2.


    Tools, such as Font Squirrel, can be used to convert fonts into this format.


    Another possibility to obtain SVG fonts is to rent them from one of the numerous
    web font providers.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '![](img/45c2114e61862fb7d9e9d1d966d826ec_194_0.png)


    [Typekit](https://typekit.com/) also serves its fonts as SVG files for the iPhone
    and iPad.'
