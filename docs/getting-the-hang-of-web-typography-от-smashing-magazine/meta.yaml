    # ## Most popular typefaces for ...


    The most popular **serif typefaces for headlines** are **Georgia** (28%) and **Baskerville**
    (4%).


    The most popular **serif typefaces for body copy** are **Georgia** (32%) and **Times
    New Roman** (4%).


    The most popular **sans-serif typefaces for headlines** are **Arial** (28%), **Helvetica**
    (20%) and **Verdana** (8%).


    The most popular **sans-serif typefaces for body copy** are **Arial** (28%), **Verdana**
    (20%) and **Lucida Grande** (10%).


    Two thirds of the Web sites we surveyed used sans-serif fonts for body copy. The
    main reason is probably because, despite the growing popularity of advanced font
    replacement techniques, such as Cufón, most designers stick to the core Web fonts,
    which essentially give them only two viable options: Georgia and Times New Roman.


    And because of the stigma attached to Times New Roman (that it often makes a modern
    Web site look outdated), they''re left with only Georgia. Sans-serif fonts used
    to offer a wider variety of options for the web.'
