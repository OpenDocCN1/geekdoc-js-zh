  md: '# ## TypeSet – Text Line Breaking Algorithm


    [TypeSet](http://www.bramstein.com) is an implementation using JavaScript and
    the HTML5 `canvas` element which is meant to optimally set justified text in the
    new HTML5 canvas element, and ultimately to provide a library for various line
    breaking algorithms in JavaScript.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_237_0.png)


    # ## Perfect Typography – The Web''s First Line Height Calculator


    For finding the perfect line height you should not only consider the font size,
    but the line length as well. Text boxes should also not be to short, because jumping
    from one line to the other after a couple of words is as tiring for the eyes as
    following endless lines over the whole screen. Especially nowadays with the widespread
    use of wide screen monitors, liquid layouts can lead to very long lines thus reducing
    the user experience. Hence, width for text blocks should also be considered when
    defining the appropriate line height. In order to ease these estimations web designer'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'Armin Cobo offers a line height calculator along with some tips and references
    to useful resources on [Perfect typography](https://www.smashingmagazine.com/2008/04/the-perfect-line-height/).


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_238_0.png)


    # Baseline Rhythm Calculator – Live View and Code Generator


    Another tool concerning line height is Geoffrey Grosenbach''s [Baseline Rhythm
    Calculator](https://www.baselinegrid.com/). It takes you one step further than
    the mentioned tool and let''s you create the CSS code for a consistent baseline
    throughout your Web site so that body text, headlines and other text elements
    with varying sizes will follow the same rhythm. Besides the auto-generated CSS
    style sheet you can also directly see the impact of a chosen font size and line
    height on a multi column page layout, as the following screen shot shows.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/45c2114e61862fb7d9e9d1d966d826ec_239_0.png)


    # EMCHART – Finding the Right Ratio at a Glance


    As you have seen in the two examples above using a relative unit such as **em**
    is a great way to maintain the vertical rhythm of a web page when users resize
    text in their browser. On complex Web sites with lots of different font sizes
    for hierarchical headlines, body text and captions with bottom margins for proper
    spacing between headlines and body as well as paragraphs, calculating the respective
    em values might be time consuming and cause you some headaches.


    Let’s take an easy example: You’ve set a bottom margin 7 pixels under your H3
    headline of 18 pixels. When the user scales the text size up on his or her browser
    the bottom margin won’t scale and your vertical rhythm will crumble as the H3
    grows in size but keeps the same 7 pixels of bottom margin unless you set this
    value in em. The **formula** for computing the EM multiplier is: **desired pixel
    size / current pixel size**'
  merge: -1
