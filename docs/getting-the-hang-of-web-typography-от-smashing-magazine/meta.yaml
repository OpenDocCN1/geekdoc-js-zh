    ## Getting the Hang of Web Typography


    ## Imprint


    Published in January 2011

    Smashing Media GmbH, Freiburg, Germany


    Book Cover Design: Fabian Ziegler


    Layout: Thomas Burkert, Vitaly Friedman


    Typesetting: Manuela Müller


    Editing: Manuela Müller


    Proof Reading: Brian Goessling, Katrin Eythorsdottir


    Concept: Vitaly Friedman, Sven Lennartz


    This e-book is not protected by DRM. A copy costs only $9.90 and is available
    exclusively at http://shop.smashingmagazine.com. Please respect our work and the
    hard efforts of our writers. If you received this book from a source other than
    the Smashing Shop, please support us by purchasing your copy in our online store.
    Thank you.


    ## Table of Content


    - Preface

    - The Ails Of Typographic Anti-Aliasing

    - 10 Principles For Readable Web Typography

    - 5 Principles and Ideas of Setting Type on the web

    - Lessons From Swiss Style Graphic Design

    - 8 Simple Ways to Improve Typography in Your Designs

    - Typographic Design Patterns and Best Practices

    - The Typography Dress Code: Principles of Choosing and Using Typefaces

    - Best Practices of Combining Typefaces

    - Guide to CSS Font Stacks: Techniques and Resources

    - New Typographic Possibilities with CSS 3

    - Rich Typography On The Web: Techniques and Tools

    - Good Old @Font-Face Rule Revisited

    - The Current Web Font Formats

    - Review of Popular Web Font Embedding Services

    - How to Embed Web Fonts from your Server

    - Web Typography – Work-arounds, Tips and Tricks

    - 10 Useful Typography Tools

    - Glossary

    - The Authors

    - Smashing eBook Series


    ## Preface


    Script is one of the oldest cultural assets. The first attempts at written expressions
    date back more than 5,000 years ago. From the Sumerians cuneiform writing to the
    invention of the Gutenberg printing press in Medieval Germany up to today''s modern
    desktop publishing it''s been a long way that has left its impact on the current
    use and practice of typography.


    Even though we neither cut nor set metal types any longer we still use terms like
    **uppercase** and **lowercase letters** referring to drawers in which types were
    kept or – in German – use expressions like **Schriftschnitt** (English = typeface)
    which refers to the cutting of individual types. On the other hand, most of the
    people who deal with typography in their daily lives, whether they are graphic
    or web designers have no special training for this independent craft.


    The implications of desktop publishing have led to a flood of poorly designed
    brochures, flyers and web pages. In web design especially illegible text, incorrect
    use of punctuation marks and inappropriate font combinations or use of line widths
    are frequent. The new techniques that web fonts offer – much hailed by some and
    dreaded by others – might bring about even worse examples of ugly and illegible
    web typography.


    In order to avoid this, we have put together Smashing Magazine''s best articles
    on web typography with one additional article series and glossary in e-book form
    for you as reference work and inspiration. Have fun creating even better Web sites
    with beautiful and readable rich web typography!


    Manuela Müller

    eBook editor


    ## The Ails Of Typographic Anti-Aliasing


    By Tom Giannattasio


    As printed typography enjoys the fruits of high-DPI glory, proudly displaying
    its beautiful curves and subtleties, its on-screen counterpart remains stifled
    by bulky pixels, living in a world of jagged edges, distorted letterforms and
    trimmed serifs. Until display manufacturers produce affordable 200 or 300 PPI
    monitors, we''ll have to rely on software advances to fix these problems.


    Enter **anti-aliasing**: the next best thing to a world of higher-resolution monitors.
    The concept of anti-aliasing is fairly simple: add semi-transparent pixels along
    the edges of letterforms to smooth the appearance of the "stair-step" effect.


    However, many factors and technologies determine the actual effectiveness of the
    process: hinting, subpixel rendering, software capabilities and operating system
    specifications, to name a few.


    Here, we''ll look at what you as a designer can do to improve the results of anti-aliasing
    with Photoshop, Flash and CSS. Plus, we''ll explain the constraints of hardware,
    browsers and operating systems.


    ## Technologies


    ### Aliased vs. Anti-Aliased


    It takes only a quick glance to realize that anti-aliasing is extremely important
    to making text legible. With few exceptions, anti-aliased text can dramatically
    reduce eye strain, not to mention that it renders glyphs much closer to their
    intended design.


    Because of this, **designers must decide how, not if, anti-aliasing should be
    used**. This decision is based on a number of factors that one has to consider
    in the process from design to delivery.


    ## Font Hinting


    Most text rendering engines rely heavily on hinting to determine exactly which
    areas of a glyph should be smoothed. Font hinting, or instructing, uses tables
    of mathematical instructions to **align letterforms to the pixel grid** and to
    determine which pixels should be gray scaled. Though most software provides auto-hinting
    using standardized algorithms, ideally the process would be done manually by the
    type designer and embedded in the file.


    Put simply, these instructions work by modifying the position of structurally
    important points, such as those found along splines or at the base of stems, and
    aligning them at pixel boundaries. Intermediate points are then repositioned based
    on their relationship to the primary points. Using an open-source font editor,
    such as [FontForge](https://fontforge.org), allows you to view and edit a font''s
    hinting information. See how much work goes into producing a clear glyph; your
    appreciation of type designers and font engineers will certainly increase.


    > *Hinted and unhinted type both have their pros and cons, leaving the designer
    to choose between legibility and typeface integrity.*


    Viewing the hints for Goudy Oldstyle''s "H" using FontForge.


    ## Subpixel Rendering


    Every pixel on a standard monitor consists of three components: a red, a green
    and a blue. The brightness of each of these sub-pixels is controlled independently,
    and because of their small size, our eyes blend the three into one solid-colored
    pixel.


    Typical anti-aliasing sets even values for each of these subpixels, resulting
    in full grayscale pixels. Subpixel rendering exploits the individuality of each
    single-colored component and uses it to increase the perceived resolution of the
    monitor.


    This allows a pixel to take on **visual weight from neighboring pixels**, thereby
    allowing type to be smoothed in smaller increments. Rendering the type in this
    manner can produce subtle color shifts visible along the edges of glyphs.


    FULL-PIXEL RENDERING


    SUB-PIXEL RENDERING


    Subpixel rendering relies on a perfectly aligned grid of pixels, which makes LCD
    flat panels the only type of monitor on which this technique works consistently.
    CRT monitors suffer from inaccuracies and oddly distributed pixels, making subpixel
    rendering extremely difficult to pull off.


    Even LCD monitors have variations in their subpixel arrangement that must be accounted
    for; some monitors are arranged in the order of RGB, while others are ordered
    BGR.


    Subpixel rendering triples the perceived resolution by setting each color component
    separately.


    *Subpixel rendering produces more desirable results than standard rendering, but
    adopts color fringes.*


    ## Input


    As designers and developers, we have limited control over how type is ultimately
    seen by the end user, but by using the proper delivery method, we can ensure an
    optimized presentation. That said, we''ll look here at the three most common ways
    in which text is sent to the user: HTML, images and sIFR. Each of these methods
    has an ideal use that, when properly implemented, can dramatically increase legibility
    and thus the overall user experience.


    ### HTML Text


    HTML text undoubtedly accounts for the majority of text found on the web. Until
    recently, designers had absolutely no control over anti-aliasing with client-side
    technologies. CSS 3 introduces two new ways to control how HTML text is delivered:
    font-smooth and @font-face.'
  mdcn: "\n ## 字体排印\n\n## 掌握网页字体排印的要领\n\n## 出版信息\n\n2011年1月出版\nSmashing Media GmbH，德国弗莱堡\n\
    \n封面设计：Fabian Ziegler\n\n版式设计：Thomas Burkert、Vitaly Friedman\n\n排版：Manuela Müller\n\
    \n编辑：Manuela Müller\n\n校对：Brian Goessling、Katrin Eythorsdottir\n\n策划：Vitaly Friedman、Sven\
    \ Lennartz\n\n本电子书不设DRM保护。每本售价仅$9.90，仅在 http://shop.smashingmagazine.com 有售。请尊重我们的劳动以及作者们的辛勤付出。如果您从Smashing\
    \ Shop以外的渠道获得本书，请在我们的在线商店购买以支持我们。谢谢。\n\n## 目录\n\n- 前言\n- 字体抗锯齿的弊病\n- 网页可读性排印的10条原则\n\
    - 网页字体设置的5条原则与思路\n- 瑞士风格平面设计之启示\n- 改进设计字体排印的8个简单方法\n- 字体排印设计模式与最佳实践\n- 字体排印着装规范：字体的选择与使用原则\n\
    - 字体组合的最佳实践\n- CSS字体栈指南：技巧与资源\n- CSS 3带来的字体排印新可能\n- 网页富字体排印：技巧与工具\n- 重温经典的@font-face规则\n\
    - 当前网页字体格式概览\n- 主流网页字体嵌入服务评测\n- 如何从您的服务器嵌入网页字体\n- 网页字体排印——变通方案、贴士与 headed\n- 10个实用的字体排印工具\n\
    - 术语表\n- 作者介绍\n- Smashing电子书系列\n\n## 前言\n\n文字是最古老的文化资产之一。最早的文字表达尝试可追溯至5000多年前。从苏美尔的楔形文字，到中世纪德国谷登堡印刷术的发明，再到如今的现代桌面出版，这是一条漫长的道路，并对当今字体排印的使用与实践产生了深远影响。\n\
    \n尽管我们已不再切割或铸造金属活字，但仍然使用**大写字母（uppercase）**和**小写字母（lowercase）**这样的术语，它们指的是存放活字的抽屉；或者在德语中使用**Schriftschnitt**（英文对应\
    \ typeface）这样的表达，指的是单个活字的切割。另一方面，大多数在日常生活中从事字体排印工作的人，无论是平面设计师还是网页设计师，都未接受过这一独立工艺的专业培训。\n\
    \n桌面出版的普及导致了大量设计粗糙的宣传册、传单和网页。在网页设计中，难以辨认的文字、标点符号的错误使用、不恰当的字组合或行宽等问题尤为常见。网页字体技术带来的新可能——有人为之欢呼，有人则心存忧虑——可能会催生更多丑陋且难以辨认的网页字体排印实例。\n\
    \n为避免这种情况，我们将Smashing Magazine关于网页字体排印的最佳文章，连同新增的文章系列和术语表，汇编成这本电子书，供您参考和汲取灵感。祝您创造出更加美观、可读的富字体排印网页！\n\
    \nManuela Müller\n电子书编辑\n\n## 字体抗锯齿的弊病\n\n作者：Tom Giannattasio\n\n当印刷字体排印享受着高DPI带来的荣光，自豪地展示其优美的曲线与细腻之处时，其屏幕上的对应物却仍被笨重的像素所束缚，生活在一个锯齿边缘、扭曲字形和截断衬线的世界里。在显示器制造商生产出价格亲民的200或300\
    \ PPI显示器之前，我们只能依靠软件的进步来解决这些问题。\n\n于是，**抗锯齿**技术应运而生：在更高分辨率显示器普及之前，这是最佳的替代方案。抗锯齿的概念相当简单：在字形的边缘添加半透明的像素，以平滑\"\
    阶梯\"效果的外观。\n\n然而，许多因素和技术决定了这一过程的实际效果：提示（hinting）、子像素渲染、软件能力和操作系统规范等等。\n\n在此，我们将探讨作为设计师，您可以通过Photoshop、Flash和CSS来改善抗锯齿效果。此外，我们还将解释硬件、浏览器和操作系统的限制。\n\
    \n## 技术\n\n### 锯齿与抗锯齿\n\n只需快速瞥一眼就能发现，抗锯齿对于提升文字可读性极为重要。除了少数例外，抗锯齿文字能显著减轻眼部疲劳，更不必说它能使字形渲染得更接近其设计初衷。\n\
    \n正因如此，**设计师必须决定的是如何运用抗锯齿，而非是否使用**。这一决定基于从设计到交付过程中需要考虑的诸多因素。\n\n## 字体提示\n\n大多数文字渲染引擎在很大程度上依赖提示来确定字形的哪些区域应该被平滑。字体提示（font\
    \ hinting），即指令（instructing），使用数学指令表来**将字形对齐到像素网格**，并确定哪些像素需要灰度处理。尽管大多数软件使用标准化算法提供自动提示，但理想情况下这一过程应由字体设计师手动完成并嵌入文件中。\n\
    \n简言之，这些指令通过修改结构上重要的点的位置来工作，例如那些位于样条曲线上或字干底部的点，并将它们对齐到像素边界。然后，中间点会根据与主要点的关系重新定位。使用[FontForge](https://fontforge.org)这类开源字体编辑器，您可以查看和编辑字体的提示信息。看看制作一个清晰的字形需要多少工作；您对字体设计师和字体工程师的敬佩之情一定会油然而生。\n\
    \n> *经过提示和未经提示的字各有利弊，需要设计师在**可读性**和**字体完整性**之间做出选择。*\n\n使用FontForge查看Goudy Oldstyle字体中\"\
    H\"的提示信息。\n\n## 子像素渲染\n\n标准显示器上的每个像素由三个部分组成：红色、绿色和蓝色。每个子像素的亮度被独立控制，由于它们尺寸微小，我们的眼睛将三者混合为一个单色像素。\n\
    \n典型的抗锯齿为每个子像素设置相同的值，从而产生全灰度像素。子像素渲染则利用每个单色组成部分的独立性，来提高显示器的感知分辨率。\n\n这使得像素能够从**相邻像素获得视觉权重**，从而让文字以更小的增量进行平滑。以这种方式渲染文字可能会产生沿字形边缘可见的微妙颜色偏移。\n\
    \n全像素渲染\n\n子像素渲染\n\n子像素渲染依赖完美对齐的像素网格，这使得LCD平板显示器成为唯一能够稳定实现这一技术的显示器类型。CRT显示器存在精度问题和像素分布不均，使得子像素渲染极难实现。\n\
    \n即使LCD显示器，其子像素排列也存在差异需要加以考量；有些显示器按RGB顺序排列，而另一些则是BGR顺序排列。\n\n子像素渲染通过分别设置每个颜色分量，将感知分辨率提升至三倍。\n\
    \n*子像素渲染能产生比普通渲染更理想的效果，但会产生颜色边缘。*\n\n## 输入\n\n作为设计师和开发者，我们对终端用户最终看到的文字效果控制力有限，但通过使用恰当的交付方式，我们可以确保优化的呈现效果。在此，我们将介绍文字发送给用户最常见的三种方式：HTML、图片和sIFR。每种方法都有其理想的应用场景，当正确实施时，能显著提升可读性，从而改善整体用户体验。\n\
    \n### HTML文字\n\nHTML文字无疑是网页上最常见的文字形式。直到最近，设计师还完全无法通过客户端技术控制抗锯齿效果。CSS 3引入了两种新的方式来控制HTML文字的交付方式：font-smooth和@font-face。\n"
