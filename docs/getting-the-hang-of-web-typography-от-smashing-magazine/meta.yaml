    # # 1. Geometric Sans


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_108_0.png)


    I''m actually combining three different groups here (Geometric, Realist and Grotesk),
    but there is enough in common between these groups that we can think of them as
    one entity for now. Geometric Sans-Serifs are those faces that are based on strict
    geometric forms. The individual letter forms of a Geometric Sans often have strokes
    that are all the same width and frequently evidence a kind of “less is more” minimalism
    in their design.


    **Examples** of Geometric/Realist/Grotesk Sans:


    +   - Helvetica

    - Univers

    - Futura

    - Avant Garde

    - Akzidenz Grotesk

    - Franklin Gothic

    - Gotham


    At their best, Geometric Sans are clear, objective, modern, universal; at their
    worst, cold, impersonal, boring. A classic Geometric Sans is like a beautifully
    designed airport: it’s impressive, modern and useful, but we have to think twice
    about whether or not we’d like to live there.'
  - '[PAGE 109]


    # 2. Humanist Sans


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_109_0.png)


    These are Sans faces that are derived from handwriting — as clean and modern as
    some of them may look, they still retain something inescapably human at their
    root. Compare the ''t'' in the image above to the ''t'' in ''Geometric'' and note
    how much more detail and idiosyncrasy the Humanist ''t'' has.


    **Examples** of Humanist Sans:


    +   - Gill Sans

    - Frutiger

    - Myriad

    - Optima

    - Verdana


    This is the essence of the Humanist Sans: whereas Geometric Sans are typically
    designed to be as simple as possible, the letter forms of a Humanist font generally
    have more detail, less consistency, and frequently involve thinner and thicker
    stoke weights — after all they come from our handwriting, which is something individuated.
    At their best, Humanist Sans manage to have it both ways: modern yet human, clear
    yet empathetic. At their worst, they seem wishy-washy and fake, the hand servants
    of corporate insincerity.'
  - '[PAGE 110]


    # ### 3. Old Style


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_110_0.png)


    Also referred to as [''Antiqua''](link) or ''Venetian'', these are our oldest
    typefaces, the result of centuries of incremental development of our calligraphic
    forms. Old Style faces are marked by little contrast between thick and thin (as
    the technical restrictions of the time didn''t allow for it), and the curved letter
    forms tend to tilt to the left (just as calligraphy tilts).


    Old Style faces at their best are classic, traditional, readable and at their
    worst are... well, classic and traditional.


    **Examples** of Old Style:


    +   - Jenson

    - Bembo

    - Palatino

    - Garamond


    Garamond especially is viewed as traditional, because it was considered to be
    so perfect at the time of its creation that no one really tried much to improve
    on it for more than a century and a half.'
  - '[PAGE 111]


    # 4. Transitional and Modern


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_111_0.png)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_111_1.png)


    An outgrowth of Enlightenment thinking, Transitional (mid 18th Century) and Modern
    (late 18th century, not to be confused with mid 20th century modernism) typefaces
    emerged as type designers experimented with making their letterforms more geometric,
    sharp and virtuosic than the unassuming faces of the Old Style period.


    Transitional faces marked a modest advancement in this direction – although Baskerville,
    a quintessential Transitional typeface, appeared so sharp to onlookers that people
    actually believed it could hurt one’s vision to look at it.


    In carving Modernist punches, type designers indulged in a kind of virtuosic demonstration
    of contrasting thick and thin strokes – much of the'
  - '[PAGE 112]


    development was spurred by a competition between two rival designers who cut similar
    faces, Bodoni and Didot. At their best, transitional and modern faces seem strong,
    stylish, dynamic. At their worst, they seem neither here nor there – too conspicuous
    and baroque to be classic, too stodgy to be truly modern.


    **Examples** of transitional typefaces:


    +   - Times New Roman

    - Baskerville


    **Examples** of Modern serifs:


    +   - Bodoni

    - Didot


    # 5. Slab Serifs


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_112_0.png)


    Also known as [''Egyptian''](Egyptian), the Slab Serif is a wild card that has
    come strongly back into vogue in recent years. Slab Serifs usually have strokes
    like those of sans faces (that is, simple forms with relatively little contrast
    between thick and thin) but with solid, rectangular shoes stuck on the end. Slab
    Serifs are an outlier in the sense that they convey very specific – and yet often
    quite contradictory – associations: sometimes the thinker, sometimes'
  - '[PAGE 113]


    the tough guy; sometimes the bully, sometimes the nerd; sometimes the urban sophisticate,
    sometimes the cowboy.


    **Examples** of Slab Serifs:


    +   - Clarendon, Rockwell

    - Courier

    - Lubalin Graph

    - Archer


    They can convey a sense of authority, in the case of heavy versions like Rockwell,
    but they can also be quite friendly, as in the recent favorite Archer. Many slab
    serifs seem to express an urban character (such as Rockwell, Courier and Lubalin),
    but when applied in a different context (especially Clarendon) they strongly recall
    the American Frontier and the kind of rural, vernacular signage that appears in
    photos from this period. Slab Serifs are hard to generalize about as a group,
    but their distinctive blocky serifs function something like a pair of horn-rimmed
    glasses: they add a distinctive wrinkle to anything, but can easily become overly
    conspicuous in the wrong surroundings.


    # Don''t Be a Wimp: The Principle of Decisive Contrast


    So, now that we know our families and some classic examples of each, we need to
    decide how to mix and match and – most importantly – whether to mix and match
    at all. Most of the time, one typeface will do, especially if it''s one of our
    workhorses with many different weights that work together.


    If we reach a point where we want to add a second face to the mix, it''s always
    good to observe this simple rule: keep it exactly the same, or change it a lot
    – avoid wimpy, incremental variations.'
  - '[PAGE 114]


    # Correspondance and Contrast — Comfortable Coexistence


    This is a general principle of design, and its official name is correspondence
    and contrast. The best way to view this rule in action is to take all the random
    coins you collected in your last trip through Europe and dump them out on a table
    together.


    If you put two identical coins next to each other, they look good together because
    they match (correspondence). On the other hand, if we put a dime next to one of
    those big copper coins we picked up somewhere in Central Europe, this also looks
    interesting because of the contrast between the two — they look sufficiently different.


    **What doesn''t work so well** is when you put our dime next to a coin from another
    country that''s almost the same size and color but slightly different. This creates
    an uneasy visual relationship because it poses a question, even if we barely register
    it in on a conscious level — our mind asks the question of whether these two are
    the same or not, and that process of asking and wondering distracts us from simply
    viewing.


    When we combine multiple typefaces on a design, we want them to coexist comfortably
    — we don''t want to distract the viewer with the question, are these the same
    or not?


    We can **start by avoiding two different faces from within one of the five categories**
    that we listed above all together — two geometric sans, say Franklin and Helvetica.
    While not exactly alike, these two are also not sufficiently different and therefore
    put our layout in that dreaded neither-here-nor-there place.'
  - '[PAGE 115]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_115_0.png)


    If we are going to throw another font into the pot along with Helvetica, much
    better if we use something like Bembo, a classic Old Style face. Centuries apart
    in age and light years apart in terms of inspiration, Helvetica and Bembo have
    enough contrast to comfortably share a page:


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_115_1.png)'
- md: ' Unfortunately, it''s not as simple as just picking fonts that are very, very
    different — placing our candy cane font next to, say, Garamond or Caslon does
    not guarantee us typographic harmony. Often, as in the above example of Helvetica
    and Bembo, there''s no real explanation for why two faces complement each other
    — they just do.


    But if we want some principle to guide our selection, it should be this: often,
    two typefaces work well together if they have one thing in common but are otherwise
    greatly different. This shared common aspect can be visual (similar [x-height](link)
    or [stroke weight](link)) or it can be chronological. Typefaces from the same
    period of time have a greater likelihood of working well together... and if they
    are by the same designer, all the better.


    ## 4. A Little Can Go a Long Way


    ''Enough with all these conventional-looking fonts and rules!'' you say. ''I need
    something for my rave flyer! And my Thai restaurant menu! And my Christmas cards!''
    What you''re pointing out here is that all the faces I''ve discussed so far are
    ''body typefaces'', meaning you could conceivably set a whole menu or newspaper
    with any of them; in the clothing analogy presented in part one, these are our
    everyday Levis. What of our Halloween flares?


    Periodically, there''s a need for a font that oozes with personality, whether
    that personality is warehouse party, Pad Thai or Santa Claus. And this need brings
    us into the vast wilderness of Display typefaces, which includes everything from
    Comic Sans to our candy-cane and bunny fonts. ''Display'' is just another way
    of saying ''do not exceed recommended dosage'': applied sparingly to headlines,
    a display font can add a concessions well-needed dash of flavor to a design, but
    it can quickly wear out its welcome if used too widely.


    ### Sophisticated Use of Accents


    Time for another clothing analogy – take a look at the following photography.


    (Photo credit: Betsssssy. Used under Creative Commons licence.)


    Betsey''s outfit works because the pink belt acts as an accent and is offset by
    the down-to-earthiness of blue jeans. But if we get carried away and slather Betsey
    entirely in pink, she might wind up looking something like being dressed for a
    carnival parade.


    *(Photo credit: Phillip Leroyer. Used under Creative Commons licence.)*


    Let''s call this the Pink Belt Principle of Type: display faces with lots of personality
    are best used in small doses. If we apply our cool display type to every bit of
    text in our design, the aesthetic appeal of the type is quickly spent and — worse
    yet — our design becomes very hard to read. Let''s say we''re designing a menu
    for our favorite corner Thai place. Our client might want us to use a ''typically''
    Asian display face, like Sho:


    So far, so good. But look what happens when we apply our prized font choice to
    the entire menu:


    ## HOUSE OF THAI


    OPEN MON-FRI, 8-12. MAJOR CREDIT CARDS ACCEPTED


    | APPETIZERS | |

    |---|---|

    | SATAY | $5.99 |

    | FRIED SHRIMP | $6.99 |

    | SPRING ROLLS | $6.50 |


    | NOODLES | |

    |---|---|

    | PAD THAI | $9.50 |

    | PAD SEE YEW | $10.99 |

    | RAD NAH NOODLES | $9.50 |


    | SEAFOOD | |

    |---|---|

    | STEAM MUSSELS | $11.99 |

    | PLA-RAD PRIKI | $12.99 |

    | PA-NANG CURRY SEAFOOD | $10.50 |


    Enough already. Let''s try replacing some of the rank-and-file text copy with
    something more neutral:


    ## HOUSE OF THAI


    OPEN MON-FRI, 8-12. MAJOR CREDIT CARDS ACCEPTED


    ### APPETIZERS


    - Satay $5.99

    - Fried Shrimp $6.99

    - Spring Rolls $6.50


    ### NOODLES


    - Pad Thai $9.50

    - Pad See-Yew $10.99

    - Rad Nah Noodles $9.50


    ### SEAFOOD


    - Steam Mussels $11.99

    - Pla-Rad-Priki $12.99

    - Pa-Nang Curry Seafood $10.50


    That''s better. Now that we''ve reined in the usage of our star typeface, we''ve
    allowed it to shine again.


    ## 5. Rule Number Five Is There Are No Rules


    Really. Look hard enough and you will find a dazzling-looking menu set entirely
    in a hard-to-read display font. Or of two different Geometric Sans faces living
    happily together on a page (in fact, just this week I wound up trying this on
    a project and was surprised to find that it hit the spot). **There are only conventions,
    no ironclad rules** about how to use type, just as there are no rules about how
    we should dress in the morning. It''s worth trying everything just to see what
    happens – even wearing your Halloween flares to your court date.


    ## In Conclusion


    Hopefully, these five principles will have given you some guidelines for how to
    select, apply and mix type – and, indeed, whether to mix it at all. In the end,
    picking typefaces requires a combination of understanding and intuition, and –
    as with any skill – demands practice. With all the different fonts we have access
    to nowadays, it''s easy to forget that there''s nothing like a classic typeface
    used well by somebody who knows how to use it.


    Some of the best type advice I ever received came early on from my first typography
    teacher: **pick one typeface you like** and use it over and over for months to
    the exclusion of all others. While this kind of exercise can feel constraining
    at times, it can also serve as a useful reminder that the quantity of available
    choices in the internet age is no substitute for quality.


    ## Best Practices of Combining Typefaces


    By Douglas Bonneville


    Creating great typeface combinations is an art, not a science. Indeed, the beauty
    of typography has no borders. While there are no absolute rules to follow, it
    is crucial that you understand and apply some best practices when combining fonts
    in a design. When used with diligence and attention, these principles will always
    yield suitable results. Today we will take a close look at some the best practices
    for combining typefaces — as well as some blunders to avoid.


    ### Combine a Sans Serif with a Serif


    By far the most popular principle for creating typeface combinations is to pair
    a sans serif header typeface with a serif body typeface. This is a classic combination,
    and it''s almost impossible to get wrong.


    In the example below — a typical article layout — we have Trade Gothic Bold No.2
    paired with Bell Gothic on the left side. They are both sans serif typefaces.
    However, they have very different personalities.


    A **good rule of thumb**, when it comes to header and body copy design problems,
    is not to create undue attention to the personality of each font. Trade Gothic
    is arguably a no-nonsense typeface. Bell Gothic, on the other hand, is much more
    dynamic and outspoken.


    Putting these two together **creates an unwanted conflict in the design.** Trade
    Gothic wants to get to the facts, but Bell Gothic wants to have some fun. This
    kind of tension is likely not part of the design goal, and should be avoided.


    Now let''s look at the example on the right. We''ve replaced Bell Gothic with
    the stately Sabon. Sabon, which is a serif typeface, works very well with Trade
    Gothic. They are both focused on bold clarity with highly-readable glyphs due
    to their tall x-height. Both typefaces, in this context, are on the same mission,
    and that makes for a great combination.


    ### Avoid Similar Classifications


    Typefaces of the same classification, but from different typeface families, **can
    easily create discord when combined.** Their distinct personalities don''t play
    well off of each other and create a kind of typographic mud if careful attention
    is not paid.


    In the first example on the left side we have a heading set in Clarendon Bold,
    which is a **slab serif**. The body copy on the left is Officina Serif which is
    also a **slab serif**. Slab serif typefaces are known for their distinct personality,
    and they like to dominate any area in a design they are used in. Putting two slab
    serifs together can create a needless and unsightly tension.


    Now notice the example on the right side. The Clarendon Bold header is paired
    with the much-more neutral New Baskerville. New Baskerville is a versatile **transitional
    serif** typeface with wide glyphs that goes nicely with the heavy-set Clarendon.
    At the same time, it backs down and lets Clarendon have all the personality it
    wants. This combination works quite nicely as a result.


    Choosing typefaces from different classifications at the start avoids needless
    tension in your design and typography later.'
