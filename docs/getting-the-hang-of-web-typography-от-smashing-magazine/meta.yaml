    \ TypeKit 快，尽管这可能是因为所用字体的文件体积较小。\n\n## TypeFront\n\n**TypeFront** 是一项仅提供托管的服务，允许你上传自己已经拥有的字体，前提是该字体具有网页友好的许可（请务必仔细阅读许可协议！）。添加你想使用的域名后，TypeFront\
