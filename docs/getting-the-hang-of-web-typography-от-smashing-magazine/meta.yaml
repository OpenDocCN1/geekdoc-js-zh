    the existing site''s stylesheet. Once that''s done, you need to make sure your
    fonts are loaded into the same folder as your stylesheet (or change the URL information
    in the CSS). Add the font to your font stack and you''re ready to go.


    The speed at which the fonts loaded was roughly the same as for most of the other
    services here. The advantage to using this service is that you own a permanent
    licence to the fonts, without any recurring annual fees and with no restrictions
    on bandwidth or traffic.


    # Fonts.com Web Fonts


    Web fonts from [Fonts.com](https://www.fonts.com) is a new venture from [Monotype
    Imaging](https://www.monotypeimaging.com), the largest font distributor on the
    web. Fonts.com currently has, by far, the largest web font selection with more
    than 7,500 fonts.'
- md: ' ## Fonts.com Web Fonts


    ### Font Selection


    7,500+


    ### Advantage Over Other Services


    Large Font selection


    ### Pros


    Currently the largest selection of fonts on the web. Exclusive home to popular
    fonts like Helvetica, Frutiger and Univers. Support for more than 40 languages.
    Use on unlimited domains. Download up to 50 desktop fonts per month with the Professional
    plan. JavaScript-free integration available to Standard and Professional subscribers.


    ### Cons


    Relatively expensive on a price-per-font basis when using a limited number of
    web fonts. The font selection interface is slower than average.


    ### Pricing


    Various tiers ranging from free up to $500/month. With a free tier, you have the
    ability to use any of 2000 fonts on an unlimited number of Web sites (up to 25,000
    page views). Standard and Pro tiers will give you access to any of over 7,000
    fonts. All pricing is dependent upon page views.


    ### Fee Schedule


    30 days


    ### Our Experience with Fonts.com Web Fonts


    The service looks pretty straightforward. You set up a project with as many domains
    as you want and then select the fonts you want to use for that project. Selecting
    fonts is a bit slow (it takes 30 seconds or more for a font to actually be added
    to a project), but not enough to be prohibitive. There''s a huge selection of
    fonts and powerful tools for sorting through them, in addition to search capability.


    From there, you have to enter each CSS selector for which you would like to use
    a web font and select the font used for that particular selector using a drop
    down menu that lists the fonts you already selected for the project. One place
    where Fonts.com really stands out is in the options you have for publishing your
    new web fonts. There are two different JavaScript options — an "Easy" option and
    an "Advanced" one — that let you add the fonts to selectors directly in your stylesheet
    rather than just through the web interface, as well as two non-JS options (also
    "Easy" and "Advanced").


    Again, the Fonts.com site was a bit slow overall but the end result is just as
    fast and seamless as any other service listed here.


    ## Google Fonts


    **Google Fonts**, announced last May, represents Google''s foray into web fonts.
    Google offers the service free of charge. Although the selection is currently
    limited to certain public domain fonts, it has the potential to have a significant
    impact on the future of web fonts.


    ### Font Selection


    60 (including international fonts)


    ### Advantage Over Other Services


    Free


    ### Pros


    Easy to implement. Fast font loading. Google''s WebFont Loader lets you use their
    service with multiple web font providers.


    ### Cons


    Small font selection in the Google font directory. Now with support for iPhone
    and iPad (Mobile Safari).


    ### Pricing


    Free


    ### Fee Schedule


    N/A


    ### Our Experience with Google Fonts


    The Google Fonts API is probably the easiest of the services listed here to get
    started with, mostly because there is no sign-up process. You simply browse the
    fonts they offer, select one, and then get the code. Link the stylesheet in your
    Web site''s head, and then add the font to the font stack in your stylesheet.


    The service is very fast, with only a barely noticeable lag before loading the
    proper font. The fact that there are no limits on usage of the service puts it
    among the top contenders on this list. The only major drawback is the limited
    number of fonts available.


    ## Kernest


    **Kernest** is a hosted or self-hosted (you can also use Fontue, Kernest''s open
    source web font serving engine) web font tool that converts fonts into web font
    ready formats along with sample code.


    ### Font Selection


    2,450


    ### Advantage Over Other Services


    Most fonts are free


    ### Pros


    Open source web font serving engine. Large font selection.


    ### Cons


    Self-hosting only, which requires additional setup and technical skills


    ### Pricing


    Free or up to $15


    ### Fee Schedule


    One-time fee


    ### Our Experience with Kernest


    Kernest has a great selection of free and paid fonts available. Free fonts could
    be set up without having to sign up for an account. Just find the font you want
    to use, make sure the permissions are acceptable for your intended use (not every
    font is allowed to be used on commercial sites, for example), and then copy and
    paste the link and CSS code into your files.


    Kernest works as well as any of the others on this site, with minimal lag time
    before the fonts load.


    ## Typotheque


    [Typotheque](https://www.typotheque.com) is a graphic design studio and type foundry
    located in the Netherlands. Their hosted web font service includes a relatively
    small selection of Typotheque fonts. Typotheque was the first foundry to start
    its own web font service, and all fonts are designed in-house.


    ### Font Selection


    37 font families, many supporting various styles and languages; this means there
    are over 500 single fonts.


    ### Advantage Over Other Services


    Use on unlimited Web sites


    ### Pros


    Option to purchase a full (web and desktop) licence. Over 250 languages supported,
    and from those up to 5 languages can be embedded. All fonts are exclusive to and
    designed by Typotheque. Offers self-hosting for large Web sites.


    ### Cons


    Limited font selection (although this is only true because their fonts are exclusive)
    and monthly bandwidth (500MB for each font within a font family).


    ### Pricing


    20% of the full desktop licence (ex. Fedra Sans Std Book: Full @ €90, Web @ €18).
    Includes 500MB monthly bandwidth.


    ### Fee Schedule


    One-time fee (€5 for every extra GB over 500MB)


    ### Our Experience with Typotheque


    Setup is similar to the other services listed here. Just select the font you want
    to use and the domains on which it will be used, add the stylesheet link to the
    head of your page, add the font to your font stacks, and you''re ready to go.
    Lag time for the font to load is comparable to the other services. The biggest
    drawback is the lack of font selection, but as mentioned, this is due to the fact
    that their fonts are exclusive to Typotheque.


    The service did return an error when generating the font subset, but it appeared
    to work fine, so not sure if that''s a bug or if there would actually be problems
    after more extensive testing.


    ## WebINK


    [WebINK](https://www.webink.com) is a hosted web font platform developed by [Extensis](https://www.extensis.com),
    a software development company based out of Portland, Oregon and specializing
    in font management.


    ### Font Selection


    2,000


    ### Advantage Over Other Services


    Can be affordable for the right type of user


    ### Pros


    Affordable pricing structure (similar to Typekit). Decent selection of fonts.
    Offers access both through the usual web interface, or alternatively through a
    desktop font management application called [Suitcase Fusion 3](https://example.com)
    (Mac and Windows). This application has a live Web site preview mode for testing
    different fonts, and something called QuickMatch that finds the closest match
    to the chosen font on your computer.


    ### Cons


    Confusing interface and back-end. Each plan is limited to 4 Web sites (Note: Each
    user can set up as many "Type Drawers" as they want, allowing 4 Web sites per
    Type Drawer; so really the number of Web sites is only limited to an individual
    plan within a single user account, whereas the number of Type Drawers is unlimited).


    ### Pricing


    Free 30-day trial on all fonts. Packages start at $0.99 per month (only includes
    "Promotional" font selection) for 1GB usage and up to 4 Web sites.


    ### Fee Schedule


    Monthly subscription


    ### Our Experience with WebINK


    We only tested the web interface for WebINK, not Suitcase Fusion 3. The WebINK
    online interface is probably more confusing than the others listed here. The service
    allows you to create an unlimited amount of Type Drawers to hold the fonts for
    your different projects. To add fonts from the library into your Type Drawers,
    you need to click the "add fonts" button within a'
  mdcn: "\n ## Fonts.com Web Fonts\n\n### 字体选择\n\n7,500+\n\n### 相对于其他服务的优势\n\n字体选择丰富\n\
    \n### 优点\n\n目前网络上字体选择最多的平台。独家提供 Helvetica、Frutiger 和 Univers 等热门字体。支持 40 多种语言，可在无限个域名上使用。使用专业版计划每月可下载多达\
    \ 50 款桌面字体。标准版和专业版订阅者还可使用无需 JavaScript 的集成方式。\n\n### 缺点\n\n在使用有限数量网络字体时，按字体计算的价格相对较高。字体选择界面速度比平均水平慢。\n\
    \n### 定价\n\n从免费到每月 500 美元不等，设有多个层级。免费层级可使用 2,000 款字体中的任意一款，在无限个网站上使用（最多 25,000\
    \ 次页面浏览量）。标准版和专业版可使用超过 7,000 款字体。所有定价均取决于页面浏览量。\n\n### 收费周期\n\n30 天\n\n### 我们使用\
    \ Fonts.com Web Fonts 的体验\n\n该服务看起来相当简单直接。你可以设置一个项目，添加任意数量的域名，然后为该项目选择要使用的字体。选择字体的过程稍慢（将字体添加到项目需要\
    \ 30 秒或更长时间），但还不至于令人无法接受。字体选择非常丰富，还有强大的排序工具，此外还有搜索功能。\n\n接下来，你需要为每个想要使用网络字体的 CSS\
    \ 选择器输入名称，并通过下拉菜单为特定选择器选择字体，下拉菜单中列出了你已为该项目选择的字体。Fonts.com 真正突出的地方在于发布新网络字体的选项。有两种不同的\
    \ JavaScript 选项——\"简易\"选项和\"高级\"选项——让你可以直接在样式表中为选择器添加字体，而不仅仅通过网络界面；此外还有两种非 JS\
    \ 选项（同样有\"简易\"和\"高级\"两种）。\n\n总的来说，Fonts.com 网站速度稍慢，但最终结果与这里列出的其他服务一样快速、无缝。\n\n\
    ## Google Fonts\n\n**Google Fonts** 于去年五月发布，标志着 Google 进军网络字体领域。Google 免费提供该服务。虽然目前仅限于某些公有领域字体，但它有可能对未来网络字体的发展产生重大影响。\n\
    \n### 字体选择\n\n60 款（包括国际字体）\n\n### 相对于其他服务的优势\n\n免费\n\n### 优点\n\n易于实施。字体加载速度快。Google\
    \ 的 WebFont Loader 让你可以与其他多个网络字体提供商一起使用该服务。\n\n### 缺点\n\nGoogle 字体目录中字体选择较少。现已支持\
    \ iPhone 和 iPad（移动 Safari）。\n\n### 定价\n\n免费\n\n### 收费周期\n\n不适用\n\n### 我们使用 Google\
    \ Fonts 的体验\n\nGoogle Fonts API 可能是这里列出的服务中最容易上手的，主要是因为无需注册流程。你只需要浏览他们提供的字体，选择一款，然后获取代码。在网站头部链接样式表，然后在样式表中将该字体添加到字体栈中。\n\
    \n该服务速度非常快，加载正确字体之前的延迟几乎察觉不到。该服务没有使用限制，这使其跻身本列表的顶尖竞争者之列。唯一的主要缺点是可用字体数量有限。\n\n\
    ## Kernest\n\n**Kernest** 是一种托管式或自托管式（你也可以使用 Fontue，Kernest 的开源网络字体服务引擎）网络字体工具，可将字体转换为网络字体就绪格式，并提供示例代码。\n\
    \n### 字体选择\n\n2,450\n\n### 相对于其他服务的优势\n\n大多数字体免费\n\n### 优点\n\n开源网络字体服务引擎。字体选择丰富。\n\
    \n### 缺点\n\n仅限自托管，这需要额外的设置和技术技能\n\n### 定价\n\n免费或最高 15 美元\n\n### 收费周期\n\n一次性费用\n\
    \n### 我们使用 Kernest 的体验\n\nKernest 有大量免费和付费字体可供选择。免费字体无需注册账户即可设置。只需找到你想使用的字体，确保权限适合你的预期用途（例如，并非所有字体都允许在商业网站上使用），然后将链接和\
    \ CSS 代码复制粘贴到你的文件中。\n\nKernest 与网站上的其他服务一样运行良好，字体加载前的延迟时间极短。\n\n## Typotheque\n\
    \n[Typotheque](https://www.typotheque.com) 是一家位于荷兰的图形设计工作室和字体铸造厂。他们的托管网络字体服务包括相对较少的\
    \ Typotheque 字体。Typotheque 是第一家开创自有网络字体服务的铸造厂，所有字体均为内部设计。\n\n### 字体选择\n\n37 个字体家族，许多支持多种风格和语言；这意味着有超过\
    \ 500 种单一字体。\n\n### 相对于其他服务的优势\n\n可在无限个网站上使用\n\n### 优点\n\n可选择购买完整许可证（网络和桌面）。支持超过\
    \ 250 种语言，其中最多可嵌入 5 种语言。所有字体均为 Typotheque 独家设计和拥有。为大型网站提供自托管选项。\n\n### 缺点\n\n\
    字体选择有限（不过这只是因为他们的字体是独家的），以及每月带宽有限制（每个字体家族中的每种字体 500MB）。\n\n### 定价\n\n完整桌面许可证的\
    \ 20%（例如 Fedra Sans Std Book：完整版 @ €90，网络版 @ €18）。包含每月 500MB 带宽。\n\n### 收费周期\n\
    \n一次性费用（超过 500MB 后每增加 1GB 收取 €5）\n\n### 我们使用 Typotheque 的体验\n\n设置方式与这里列出的其他服务类似。只需选择你要使用的字体和将使用该字体的域名，将样式表链接添加到你页面的头部，将字体添加到你的字体栈，然后就可以开始使用了。字体加载的延迟时间与其他服务相当。最大的缺点是字体选择较少，但如前所述，这是因为他们的字体是\
    \ Typotheque 独家的。\n\n该服务在生成字体子集时返回了错误，但看起来一切正常，所以不确定这是 bug 还是更广泛的测试后会出现实际问题。\n\
    \n## WebINK\n\n[WebINK](https://www.webink.com) 是由 [Extensis](https://www.extensis.com)\
    \ 开发的托管网络字体平台，Extensis 是一家位于俄勒冈州波特兰的软件开发公司，专门从事字体管理。\n\n### 字体选择\n\n2,000\n\n\
    ### 相对于其他服务的优势\n\n对合适的用户类型来说可能具有价格优势\n\n### 优点\n\n价格实惠的定价结构（与 Typekit 类似）。字体选择不错。可通过常规网络界面访问，或者通过名为\
    \ [Suitcase Fusion 3](https://example.com) 的桌面字体管理应用程序访问（Mac 和 Windows）。该应用程序具有实时网站预览模式，可测试不同的字体，还有一种名为\
    \ QuickMatch 的功能，可以在你的电脑上找到与所选字体最接近的匹配。\n\n### 缺点\n\n界面和后端令人困惑。每个计划仅限 4 个网站（注意：每个用户可以设置任意数量的\"\
    Type Drawer\"，每个 Type Drawer 允许 4 个网站；因此网站数量实际上只受限于单个用户账户内的单个计划，而 Type Drawer\
    \ 的数量是无限的）。\n\n### 定价\n\n所有字体可免费试用 30 天。套餐起价为每月 $0.99（仅包含\"促销\"字体选择），包含 1GB 使用量和最多\
    \ 4 个网站。\n\n### 收费周期\n\n月度订阅\n\n### 我们使用 WebINK 的体验\n\n我们只测试了 WebINK 的网页界面，没有测试\
    \ Suitcase Fusion 3。WebINK 在线界面可能是这里列出的服务中最令人困惑的。该服务允许你创建无限数量的 Type Drawer 来存放不同项目的字体。要将字体库中的字体添加到你的\
    \ Type Drawer，你需要点击\n"
