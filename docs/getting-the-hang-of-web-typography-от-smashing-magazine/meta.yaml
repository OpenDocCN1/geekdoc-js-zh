  md: '# Glossary


    By Manuela Müller


    # Antiqua


    Antiqua is a German noun that translates to Latin script (derived from the female
    version of the Latin adjective antiquus, i. e. antiqua meaning ancient or „former;
    old“). Antiqua also refers to a class of typefaces which were designed between
    1470 and 1600 in Italy by German and French craftsmen. The capital letters of
    this typeface class were inspired by the capital letters of Roman imprints, whereas
    the small letters were modeled on Carolingian [minuscles](https://example.com)
    in which medieval manuscripts on Roman emperors and philosophers such as Caesar,
    Seneca and Cicero were written. In the vernacular Antiqua is also used as synonym
    for serif typefaces.


    # Baseline


    In order to achieve straight lines of text, letters are set on a baseline. Only
    descenders – the lower glyphs in „g“ or „p“ – go below this line.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_242_0.png)'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# ### Baseline Grid


    A baseline grid is the foundation for consistent typographic rhythm on a page.
    It allows the reader to easily follow the flow of the text, which in turn increases
    readability.


    # ### Cap Height


    The height of capital letters above the baseline is referred to as cap height.
    This especially applies to „flat" letters such as **L** or **T** (see illustration
    [above](#)).


    # ### Diacritic


    Pronunciation symbol: A mark near or through an orthographic or phonetic character,
    e.g. **déjà-vu** in the French language or **Øre** in Norwegian or Danish language.


    # ### Glyph


    One particular character or sign of a given writing system. This can either be
    a letter like „a" or a [diacritic](#) or [ligature](#) consisting of two or more
    letters. At any rate, a glyph represents a complete graphic unit.


    # ### Grotesque


    Grotesque or **Gothic** is a proper synonym for sans-serif typefaces. They were
    deducted from Antiqua type, but **sans** (french = without) serifs and the letters
    show a much more consistent stroke weight than serif typefaces.


    # ### Hanging Punctuation


    Hanging punctuation is a way of typesetting quotation marks and bullet points.
    By not doing so a quotation mark that is flush with the text will interrupt the
    left margin and disrupt the rhythm of the reader. The use of'
  merge: -1
  pgno: 243
- img_proc: true
  md: '[hanging quotes](https://example.com) keeps the left alignment intact and balanced
    therefore increasing readability.


    # Kerning


    Characters in proportional fonts take up different amounts of space between them.
    By means of kerning the spacing between characters in proportional fonts is reduced
    thus forming a more consistent typeface.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_244_0.png)


    > Source: Wikipedia


    # Ligature


    In typography a ligature occurs when two or more characters are joined to one
    single [glyph](https://example.com) or type, which were used in old printing machines.
    In the Western writing system ligatures are mainly used to reduce white space
    between two letters, i.e. letters are not joined to one glyph but the whitespace
    between them, for example, in letter combinations such as fi, ffl or ff. In modern
    desktop publishing kerning varies from font to font as you see below.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_244_1.png)'
  merge: -1
  pgno: 244
- img_proc: true
  md: "*Left: Geneva with kerning (utmost left) and without kerning*  \n*Right: The\
    \ Helvetica character set doesn’t contain glyphs for ligatures.*\n\n# Macrotypgraphy\n\
    \nTypography comprises much more than the usage and design of fonts. It actually\
    \ covers the complete arrangement of type, pictures, lines, areas and and typographic\
    \ space in printed products or electronic media. The creative features of typesetting\
    \ are devided in [microtypography](https://example.com) and macrotypgraphy. The\
    \ latter concerns the following details:\n\n+   - choice of paper / media format\
    \ (HTML, Flash etc.)\n- page format / screen resolution\n- type area / screen\
    \ layout\n- line width, lead (space between lines), number of lines per page/screen\n\
    - positioning of pictures, tables and text\n- proportion of type in relation to\
    \ tables and graphics\n- amount of whitespace\n- font size and font decoration\n\
    \n# Minuscule\n\nA lowercase letter. One of the various writing styles in the\
    \ Middle Ages (Carolingian Minuscule, blackletter minuscule) which was derived\
    \ from the New Roman cursive alphabet that in turn was used for quick and informal\
    \ every day writing. In contrast to officially used Roman square capitals that\
    \ we can still see on ancient buildings, New Roman cursive uses small letters\
    \ and ligatures thus forming a fluid handwriting. Cursive actually comes from\
    \ the Latin word **cursivus** which means „flowing”."
  merge: -1
  pgno: 245
- img_proc: true
  md: '# # Microtypography


    This part of typography, also referred to as detail typography, deals with the
    subtleties of typesetting, which have a significant impact on readability and
    legibility of a given text:


    +   - choice of fonts, font foundries or web font services


    +   - fine tuning of the font size for body copy and headlines


    +   - fine tuning of tracking/letter spacing/kerning


    +   - fine tuning of leading and line widths


    +   - special characters, small caps and ligatures


    +   - correct application of punctuation marks


    # # Majuscule


    Modern uppercase letters of the Western writing system developed from the Roman
    uncial script. In most of the ancient writing systems there where both capital
    and small letters. However, documents where either written in small or capital
    letters. Only after the invention of the printing press, both sizes/writing styles
    where combined in one document. As small letters are more frequently used than
    capital letters, printers used to keep the type for small letters in the lower
    type case and the type for capital letters in the upper type case of a desk. This
    practice led to the name uppercase and lowercase letters.


    # # Orphan


    An orphan is a word or short line at the beginning or end of a column that is
    separated from the rest of the paragraph (see [illustration](#)).'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Overshoot


    Round or pointed capital letters like **S** or **B** deviate slightly in height
    from noun-rounded letters like **X** or **T** for the purpose of an equal optical
    appearance. The degree to which capital letters go below the [baseline](https://en.wikipedia.org/wiki/Baseline_(typography))
    or above the cap height is called overshoot.


    # Serif / Serifs


    Serif is both used as synonym for [Antiqua](https://en.wikipedia.org/wiki/Antiqua_(type))
    fonts and as a noun for any of the short lines stemming from and at an angle to
    the upper and lower ends of the strokes of a latin letters, arabic figures or
    special characters as the red lines in the following graphic indicate.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_247_0.png)


    There are a number of different thoughts, where serifs originated from. One of
    the most agreed upon is the explanation proposed by the Roman Catholic priest,
    teacher and calligrapher Father Edward M. Catich in his 1968 book „The Origin
    of the Serif“ which says that serifs originated in ancient Roman inscriptions.
    Chiseling letters into stone created brush marks which flared at stroke ends and
    corners, thus creating serifs. The term itself, however, most likely comes from
    the Dutch word **schreef** meaning stroke.


    There''s been a long and ongoing debate about whether or not the use of serif
    fonts increases the readability of a text. While this holds true for most Antiqua
    fonts, when printed – legibility tests showed that readers perceived such texts
    five times as quick as sans-serif print – for screen design sans-serif types such
    as Verdana are preferred. However, with increasing screen resolutions and methods
    such as [anti-aliasing](https://en.wikipedia.org/wiki/Anti-aliasing), [font hinting](https://en.wikipedia.org/wiki/Font_hinting)
    and [subpixel](https://en.wikipedia.org/wiki/Subpixel_rendering)'
  merge: -1
  pgno: 247
- img_proc: true
  md: '[rendering](link) serif fonts can also be properly displayed and read on screen
    today, if they are not too small. The former rule of thumb that sans-serif fonts
    are the better choice for screen design is more or less obsolete thanks to evolving
    technology standards.


    # Slab Serif


    **Egyptian** or **Egyptienne** is another name for this class of type, which has
    been developed in the early 19th century. Slab serifs are basically bolded Antiqua
    typefaces, however, with much more distinct serifs. In the early days of industrialization
    the slab serifs where used for the upcoming advertising business on flyers and
    posters, where they made a bigger impression than the less bold and less expressive
    serif types. The term Egyptian is said to stem from the contemporary interest
    in anything ancient, especially Egyptian, due to the Napoleonic discoveries in
    Egypt at that time.


    # Stroke Weight


    This term goes back to the physical width of a writing utensil and the subsequently
    thinner or bolder writing/script depending on the utensil''s width. In modern
    desk top publishing font families come with different font weights, e.g. **light**,
    **regular**, **bold** or **semibold**. Furthermore, some typefaces vary in stroke
    weight within one particular font as the following illustration shows.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_248_0.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Widow


    One single word in the last line of a paragraph (see illustration in paragraph
    [5. Widows and Orphans](https://example.com/5)). Expressions for typographic terms
    vary in different languages. What’s called a widow in English is a whore’s child
    in German.


    # White Space


    In microtypography white space or negative space is the free space around and
    within letters, e. g. the space within the P’s bow in the illustration above.
    In macro typography negative space is the portion of a printed page or web page
    that is not filled with text or illustrations and – more generally – each and
    every unmarked space between margins, columns, lines of type or figures and other
    drawn or depicted objects.


    # X-Height


    In typography, the **x-height** or **corpus size** refers to the distance between
    the [baseline](https://example.com/baseline) and the mean line in a typeface.
    Typically, this is the height of the letter *x* in the font, as well as the *u*,
    *v*, *w*, and *z*. (Curved letters such as *a*, *c*, *e*, *m*, *n*, *o*, *r* and
    *s* tend to exceed the x-height slightly, due to [overshoot](https://example.com/overshoot).)
    In modern typography the x-height is simply a design characteristic of the font,
    and while an *x* is usually exactly one x-height in height, in some more decorative
    or script designs, this may not always be the case.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_249_0.png)'
  merge: -1
  pgno: 249
