    advice, while lamenting "hack designers" and University design departments that
    lack "classic" typographic curriculum


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_50_0.png)


    +   2. [Setting Type on the web to a Baseline Grid](link)


    This article reviews issues with aligning elements to a baseline grid with CSS
