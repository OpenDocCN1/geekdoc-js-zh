    of rendering text**. If the screen display is of poor quality without subpixel
    rendering you might want to opt for graceful degradation and deliver system fonts
    for users of older browsers and systems. The easiest way to exclude older browsers
    or operating systems from style sheets with embedded web fonts is the use of conditional
    comments. Of course, [using JavaScript](http://) is the more elegant way to detect
    whether or not the client''s subpixel rendering is turned on or off.


    # ## Text Layout


    Even though some web layouts are drawing nearer to print layouts thanks to rich
    typography and web font embedding there''s still a big difference: To this day
    browsers do not offer automatic **hyphenation**. Especially for languages with
    very long words, e.g. German, it is not possible to use left and right **justified
    text** without creating spacious gaps thus reducing the readability of body text.


    By means of JavaScript you can provide for a language-based client-side hyphenation.
    A server-side solution is offered by phpHyphenator. Nevertheless, these are still
    emergency solutions for a missing function that should be an integral part of
    any browser which it will hopefully be in the future.'
  - '[PAGE 230]


    # OpenType Typography Features


    With the spreading of web fonts another shortcoming of common browsers concerning
    text layout came into focus – there’s no support of OpenType typographic features
    that have been offered by high-end desktop publishing programs such as InDesign
    or QuarkXPress since version 7.


    OpenType functions add several smart font options that enhance the font’s typographic
    and language support capabilities. If the application supports these options,
    characters can be replaced by additional features automatically. For Latin-based
    script these mainly concern ligatures, fractions or small capitals.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_230_0.png)


    Computer generated small caps (grey lettering on top) and true small caps (blue
    lettering below) in the beta version of Firefox 4.


    Some fonts can only be put to use by OpenType functions in the first place. Take
    joint Latin handwriting or Arabic writing for example, in which the shape of a
    character depends on its position in the word and the adjacent characters. Comprehensive
    OpenType fonts may, therefore, contain various alternative glyphs for the respective
    character. With the methods of OpenType functions, the basic version of a character
    is replaced by a version with matching connections context-based as the following
    screen shot illustrates.'
- md: ' *Perfect junction of characters (blue lettering below) thanks to context-based
    replacement in Firefox 4.*


    The current beta version of Firefox 4 offers access to this OpenType feature for
    the first time. For the time being it can be defined with this browser specific
    attribute:


    ```

    h1 {

    -moz-font-feature-settings:''smcp=1'';

    }

    ```


    This example will display the headline in true small caps provided that the font
    does have a small-caps case. A list with common OpenType features can be found
    at [Microsoft''s](https://www.microsoft.com/) Web site.


    So far, there are no standards to address these features in your CSS style sheets,
    but the CSS Fonts Module Level 3 draft mentions this possibility already. Other
    browser companies will most likely follow this example sooner or later.


    Browser developers still have a long way to go until the web can catch up with
    text layout in print design or even overtake it. It''s, however, good to know
    that there is a growing awareness for such typographic subtleties among browser
    manufacturers so that further progress can be expected pretty soon.


    ## 10 Useful Typography Tools


    by Vitaly Friedman / Manuela Müller


    ### Typechart – Previewing and Comparing Web Typography


    [Typechart](https://www.typechart.com) lets you flip through, preview and compare
    web typography while retrieving the CSS. You can browse different typographic
    styles. Each style corresponds to a style ID, which allows you to annotate prototypes
    and retrieve the CSS while coding. Another useful feature is that you can compare
    Windows (ClearType) rendering with Apple font rendering.


    ### Web Font Specimen – See How Type Looks on the web


    Once we had to keep our typographic choices to simple and minimalistic solutions,
    but today web designers have a wide variety of typography embedding techniques
    to enliven their designs with versatile and sophisticated typography. However,
    type is a tricky beast. What looks fine in print, can be quite difficult to read
    online. If you are using custom fonts you might want to test their screen display
    in various browsers.


    With the help of [Web Font Specimen](https://webfontspecimen.com), you can do
    this easily. Just download the tool, unzip it, set your fonts in CSS, and then
    open up the HTML-specimen in a browser. The specimen contains whole paragraphs
    in various line heights and font sizes, different headings, ordered and unordered
    lists, as well as italic and bold text. You can analyze the body size comparison
    that reveals aspects of the typeface that can''t otherwise be seen and study single
    glyphs, different measures (widths), grayscale text as well as light on dark or
    dark on light text.


    With a few clicks, you get a reliable impression of what your font will look like
    in context. You can adapt the tool to your needs and share it with others under
    a Creative Commons licence.


    ## Typografix – Fix Your Typography


    In the current HTML standard, upholding certain principles of good typography
    is hard without a lot of extra work. Things like ellipses, en and em dashes, single
    and double quotation marks and arrows all become so cumbersome to properly format
    that designers sometimes leave them out entirely, leaving the browser to revert
    to its default. Sure, some blogging platforms already have solutions for these
    things, but what about web typography in general?


    Typografix is an HTML re-processing script for creating beautiful typography.
    It corrects things like ellipses and smart quotes and adds tags for `<script>`,
    `<pre>` and `<code>` automatically. The **en dash**, for example, is created automatically
    when a hyphen is surrounded by spaces, and the **em dash** is created when two
    dashes appear in a row. Once you''re used to the syntax, creating well-formatted
    web typography is much faster and simpler than by hand-coding everything. Typografix
    is written in C#, requires Windows Installer 3.1 and .NET Framework 3.5 SP1 and
    is released under the GNU GPL v3. It would be great to see an AIR-application
    with the same features.


    ## TypeIt – Typographic Accents Made Easy


    Do you often find the need to edit body copy or emails in foreign languages with
    funny characters that for some reason do not display properly from the local keyboard?
    Then have a look at [TypeIt](link).


    The online tool will save you a lot of time and vexation. Don''t strain your brain
    with hotkeys like *Alt + 134*; stop hunting around for special characters in a
    word processor as you use an email client or instant messaging service. TypeIt
    allows you to add typographic accents and special characters (e.g. punctuation
    marks) as you''re typing. Instead of clicking on buttons for the accents, **you
    can use shortcuts**, like Control + N, to insert the characters: just point your
    cursor to the desired character and you''ll see a tooltip.


    Also, you can switch between character sets while typing; you can use bold, italics,
    underlining and superscript; and you can change the font and size. TypeIt has
    been developed by the Polish translator Tomasz P. Szynalski. The tool has full
    keyboard support for Internet Explorer 6+, Firefox, Safari, Opera and Chrome.


    ## FontFinder – Check out Fonts in Web site Elements Easily


    [Font Finder](https://example.com) is created for designers, developers and typographers.
    It allows a user to analyze the font information of any element on a page, copy
    selected parts of that information to the clipboard, and perform inline replacements
    in order to test new layouts.


    ### TypeSet – Text Line Breaking Algorithm


    [TypeSet](http://www.bramstein.com) is an implementation using JavaScript and
    the HTML5 `canvas` element which is meant to optimally set justified text in the
    new HTML5 canvas element, and ultimately to provide a library for various line
    breaking algorithms in JavaScript.


    ### Perfect Typography – The Web''s First Line Height Calculator


    For finding the perfect line height you should not only consider the font size,
    but the line length as well. Text boxes should also not be to short, because jumping
    from one line to the other after a couple of words is as tiring for the eyes as
    following endless lines over the whole screen. Especially nowadays with the widespread
    use of wide screen monitors, liquid layouts can lead to very long lines thus reducing
    the user experience. Hence, width for text blocks should also be considered when
    defining the appropriate line height. In order to ease these estimations web designer
    Armin Cobo offers a line height calculator along with some tips and references
    to useful resources on [Perfect typography](https://www.smashingmagazine.com/2008/04/the-perfect-line-height/).


    ## Baseline Rhythm Calculator – Live View and Code Generator


    Another tool concerning line height is Geoffrey Grosenbach''s [Baseline Rhythm
    Calculator](https://www.baselinegrid.com/). It takes you one step further than
    the mentioned tool and let''s you create the CSS code for a consistent baseline
    throughout your Web site so that body text, headlines and other text elements
    with varying sizes will follow the same rhythm. Besides the auto-generated CSS
    style sheet you can also directly see the impact of a chosen font size and line
    height on a multi column page layout, as the following screen shot shows.


    ## EMCHART – Finding the Right Ratio at a Glance


    As you have seen in the two examples above using a relative unit such as **em**
    is a great way to maintain the vertical rhythm of a web page when users resize
    text in their browser. On complex Web sites with lots of different font sizes
    for hierarchical headlines, body text and captions with bottom margins for proper
    spacing between headlines and body as well as paragraphs, calculating the respective
    em values might be time consuming and cause you some headaches.


    Let''s take an easy example tricks: You''ve set a bottom margin 7 pixels under
    your H3 headline of 18 pixels. When the user scales the text size up on his or
    her browser the bottom margin won''t scale and your vertical rhythm will crumble
    as the H3 grows in size but keeps the same 7 pixels of bottom margin unless you
    set this value in em. The **formula** for computing the EM multiplier is: **desired
    pixel size / current pixel size**'
  mdcn: "\n *由于 Firefox 4 中基于上下文的替换，字符实现了完美连接（下图中的蓝色字母）。*\n\nFirefox 4 的当前测试版本首次提供了对此\
    \ OpenType 功能的访问。目前可以使用此浏览器特定属性进行定义：\n\n```\nh1 {\n-moz-font-feature-settings:'smcp=1';\n\
    }\n```\n\n此示例将以真正的小型大写字母显示标题，前提是该字体确实具有小型大写字母功能。常见的 OpenType 功能列表可以在[微软](https://www.microsoft.com/)网站上找到。\n\
    \n到目前为止，尚无标准可在 CSS 样式表中处理这些功能，但 CSS Fonts Module Level 3 草案已经提到了这种可能性。其他浏览器公司迟早很可能会效仿这一做法。\n\
    \n浏览器开发人员仍有很长的路要走，才能使网页排版赶上印刷设计，甚至超越它。然而，令人欣慰的是，浏览器制造商对这类排版细节越来越重视，可以预期很快会取得进一步进展。\n\
    \n## 10 个实用的排版工具\n\n作者：Vitaly Friedman / Manuela Müller\n\n### Typechart – 预览和比较网页排版\n\
    \n[Typechart](https://www.typechart.com) 让你可以翻阅、预览和比较网页排版，同时获取 CSS。你可以浏览不同的排版样式。每种样式对应一个样式\
    \ ID，这允许你对原型进行标注并在编码时获取 CSS。另一个有用的功能是，你可以将 Windows（ClearType）渲染与 Apple 字体渲染进行比较。\n\
    \n### Web Font Specimen – 查看字体在网页上的显示效果\n\n曾经，我们不得不将排版选择限制在简单和极简的解决方案上，但如今网页设计师有各种各样的字体嵌入技术，可以用多样而精致的字体来活跃他们的设计。然而，字体是一种棘手的元素。在印刷中看起来不错的，在线阅读时可能相当困难。如果你使用自定义字体，你可能想在各种浏览器中测试它们的屏幕显示效果。\n\
    \n借助 [Web Font Specimen](https://webfontspecimen.com)，你可以轻松做到这一点。只需下载该工具，解压，在\
    \ CSS 中设置你的字体，然后在浏览器中打开 HTML 样本即可。该样本包含各种行高和字体大小的完整段落、不同的标题、有序和无序列表，以及斜体和粗体文本。你可以分析正文大小比较，这揭示了字体在其他情况下无法看到的方面，还可以研究单个字形、不同的字距（宽度）、灰度文本以及浅色背景深色文字或深色背景浅色文字的效果。\n\
    \n只需点击几下，你就能获得对字体在上下文中外观的可靠印象。你可以根据需要调整该工具，并在知识共享许可下与他人分享。\n\n## Typografix –\
    \ 修复你的排版\n\n在当前 HTML 标准中，不经过大量额外工作，很难坚持某些良好的排版原则。像省略号、长短破折号、单双引号和箭头这样的内容，正确格式化起来非常繁琐，以至于设计师有时完全放弃它们，让浏览器回退到默认设置。当然，一些博客平台已经有了解决方案，但一般的网页排版呢？\n\
    \nTypografix 是一个用于创建精美排版的 HTML 重处理脚本。它可以修正省略号和智能引号等问题，并自动为 `<script>`、`<pre>`\
    \ 和 `<code>` 添加标签。例如，**短破折号（en dash）**在连字符被空格包围时自动创建，**长破折号（em dash）**在两个连字符连续出现时自动创建。一旦你习惯了这种语法，创建格式良好的网页排版比手工编码一切要快得多、简单得多。Typografix\
    \ 用 C# 编写，需要 Windows Installer 3.1 和 .NET Framework 3.5 SP1，以 GNU GPL v3 发布。如果能看到具有相同功能的\
    \ AIR 应用程序，那就太好了。\n\n## TypeIt – 轻松输入排版重音符号\n\n你是否经常需要编辑包含外语正文中带有奇怪字符的电子邮件，而这些字符由于某种原因无法从本地键盘正常显示？那么请看看\
    \ [TypeIt](link)。\n\n这个在线工具将为你节省大量时间和烦恼。不要为 *Alt + 134* 之类的快捷键伤脑筋；在使用电子邮件客户端或即时通讯服务时，不要再在文字处理软件中四处寻找特殊字符。TypeIt\
    \ 允许你在打字时添加排版重音符号和特殊字符（例如标点符号）。无需点击重音按钮，**你可以使用快捷键**，如 Control + N，来插入字符：只需将光标指向所需字符，你就会看到工具提示。\n\
    \n此外，你可以在打字时切换字符集；可以使用粗体、斜体、下划线和上标；还可以更改字体和大小。TypeIt 由波兰翻译 Tomasz P. Szynalski\
    \ 开发。该工具对 Internet Explorer 6+、Firefox、Safari、Opera 和 Chrome 提供完整的键盘支持。\n\n##\
    \ FontFinder – 轻松查看网站元素中的字体\n\n[Font Finder](https://example.com) 专为设计师、开发人员和字体排印师创建。它允许用户分析页面上任何元素的字体信息，将该信息的选定部分复制到剪贴板，并执行内联替换以测试新布局。\n\
    \n### TypeSet – 文本断行算法\n\n[TypeSet](http://www.bramstein.com) 是使用 JavaScript 和\
    \ HTML5 `canvas` 元素的实现，旨在以最优方式在 HTML5 canvas 元素中设置两端对齐文本，并最终为 JavaScript 中的各种断行算法提供一个库。\n\
    \n### Perfect Typography – 网页首个行高计算器\n\n要找到完美的行高，你不仅应该考虑字体大小，还应考虑行长度。文本框也不应太短，因为每隔几个单词就从一行跳到另一行，对眼睛来说与追随整屏的冗长行一样累人。特别是在当今宽屏显示器广泛使用的时代，流体布局可能导致非常长的行，从而降低用户体验。因此，在定义适当的行高时，也应考虑文本块的宽度。为了简化这些估算，网页设计师\
    \ Armin Cobo 在 [Perfect typography](https://www.smashingmagazine.com/2008/04/the-perfect-line-height/)\
    \ 上提供了一个行高计算器以及一些提示和有用资源的参考。\n\n## Baseline Rhythm Calculator – 实时视图和代码生成器\n\n\
    另一个关于行高的工具是 Geoffrey Grosenbach 的 [Baseline Rhythm Calculator](https://www.baselinegrid.com/)。它比上述工具更进一步，让你可以为整个网站创建一致的基线\
    \ CSS 代码，从而使正文文本、标题和其他大小各异的文本元素遵循相同的节奏。除了自动生成的 CSS 样式表外，你还可以直接看到所选字体大小和行高对多栏页面布局的影响，如下面的屏幕截图所示。\n\
    \n## EMCHART – 一目了然地找到合适的比例\n\n正如你在上面两个例子中看到的，使用 **em** 这样的相对单位是在用户调整浏览器文本大小时保持网页垂直节奏的好方法。在具有多种不同字体大小的复杂网站上——层级标题、正文和说明文字的字体大小，以及标题与正文之间、段落之间适当间距的底部边距——计算相应的\
    \ em 值可能会耗时并让你头疼。\n\n让我们举个简单的例子：你在 18 像素的 H3 标题下方设置了 7 像素的底部边距。当用户在浏览器中放大文本大小时，底部边距不会缩放，你的垂直节奏就会崩溃，因为\
    \ H3 变大了但仍保持相同的 7 像素底部边距，除非你将此值设置为 em。**计算 EM 倍数的公式**是：**所需像素大小 / 当前像素大小**\n"
