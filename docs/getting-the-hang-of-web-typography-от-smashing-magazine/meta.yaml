  md: '# Smooth


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_15_0.png)


    The Smooth setting is the closest to unhinted anti-aliasing and therefore **remains
    truest to the original glyph shape**. This algorithm is best used on medium-sized
    to large type, because it tends to render very light and often blurry at smaller
    point sizes. If used with an appropriate typeface at a proper size and if the
    origin is properly adjusted, this setting can produce a beautiful balance between
    crispness and letterform fidelity.


    # Shape Layer


    If Photoshop’s hinted algorithms all produce undesirable results, you may want
    to attempt using unhinted anti-aliasing by way of converting the type to a shape
    layer. This allows you access to the original outlines of the font, which draw
    values based on the percentage of the pixel enclosed in the shape. What you sacrifice
    in editable type, you make up for in origin transformations: 32 on both the x-
    and y-axes. Though usually a last resort, don’t rule out the possibility of using
    a Shape Layer; it can often produce much better results than Photoshop’s algorithms.


    # Fractional Widths


    Another, more veiled, setting that sometimes helps with anti-aliasing type at
    small point sizes is the Fractional Widths option located in the Character palette’s
    fly-out menu. With this setting turned on, the character spacing is set to varying
    fractions of pixels. This is ideal for auto-kerned type at large sizes but tends
    to bump the type either too close together or too far apart at smaller sizes.
    Turning this option off will round all character spacing to'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'whole pixel values, which may help better space the problematic type. This
    is a hit-or-miss option, so use it wisely.


    # Decimal Point Sizes


    Typophiles might cringe at the idea of using a decimal point size, but when designing
    for digital media, standard point sizes don’t always conform to the pixel grid.
    By using decimal point sizes and either the Smooth or Strong anti-alias setting,
    you can usually bring a blurry typeface back into focus. Please note that I am
    not condoning the use of vertical or horizontal scale!


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_16_0.png)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_16_1.png)


    Using decimal values can dramatically improve anti-aliasing results, as seen above.
    Top: 16pt Goudy Oldstyle with Strong Anti-Aliasing. Bottom: 16.5pt Goudy Oldstyle
    with Strong Anti-Aliasing.


    # sIFR Text


    Using sIFR to replace headers with a block of Flash brings benefits beyond the
    obvious. Yes, it solves the problem of having to use CSS image replacement techniques
    to provide a wider array of fonts, but it also allows incredible control over
    how the type is anti-aliased. Particularly useful are'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'the sharpness and thickness settings, which control the edges of glyphs. (If
    only Photoshop had these settings!)


    You can set and tweak a number of settings to fit your implementation; and they
    can be controlled by passing keyword arguments inside the **sifr-config.js** file.
    These settings include:


    # **sharpness (number)**


    A value between -400 and 400, which determines how sharp (positive number) or
    soft (negative number) the edges of the glyphs will be.


    # **thickness (number)**


    A value between -200 and 200, which sets the thickness of the glyph edges.


    # **gridFitType (string)**


    Possible values are: "none," "pixel" and "subpixel." This specifies how prominently
    the horizontal and vertical lines are fit to the monitor''s pixel grid. "Pixel"
    and "subpixel" usually produce the best results.


    # **antiAliasType (string)**


    This is set by default to "advanced," which allows the anti-alias settings above
    to be applied. It can also be set to "normal," but this option limits sIFR''s
    rendering capabilities to accommodate earlier versions of Flash Player and overrides
    any of the properties above.


    # **sIFR: Default Anti-Aliasing**


    # **sIFR: Custom Anti-Aliasing**


    *sIFR allows you to precisely customize your anti-alias settings. Notice that
    the custom setting is slightly thinner and crisper.*'
