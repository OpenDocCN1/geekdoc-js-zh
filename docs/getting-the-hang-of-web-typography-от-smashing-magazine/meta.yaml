    # The Current Web Font Formats


    By *Ralf Hermann*


    The relatively new possibility of embedding any font you like into Web sites via
    @font-face is an additional stylistic device, which promises to abolish the monotony
    of the usual system fonts. But it would have been all too easy, if there was only
    one web font format. Instead there''s quite a variety which we are going to present
    here.


    # Web Font Formats


    EOT, TTF, OTF, CFF, AFM, LWFN, FFIL, FON, PFM, PFB, WOFF, SVG, STD, PRO, XSF,
    …


    To find one''s way in this veritable jungle of font formats is not exactly easy.
    On the following pages we''ll have a closer look at the pros and cons of those
    font formats that are particularly relevant for their use on Web sites.


    # TrueType


    This format was developed in the late 1980s as a competitor to Adobe''s Type 1
    fonts used in PostScript. As a scalable outline format, it replaced the at that
    time common bitmap fonts being used for screen display. Microsoft took up the
    TrueType format as well and it soon evolved into the standard format for system
    fonts due to the fact that it offered fine-tuned control for a precise display
    of font at particular sizes.'
  - '[PAGE 190]


    # OpenType


    Microsoft and Adobe teamed up in developing this format. Based on the TrueType
    format, OpenType offers additional typographical features such as ligatures, fractions
    or context sensitive glyphs and the like. However, browser support of these features
    common in sophisticated layout and illustration programs is still unsatisfactory.


    You should also know that there are two different versions of OpenType fonts,
    depending on the outline technology used. There are:


    +   - OpenType fonts with **TrueType Outlines** (OpenType TT)

    - OpenType fonts with **PostScript Outlines** (OpenType PS)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_190_0.png)


    > OpenType comes in two different versions.


    **OpenType PS** is a so-called CFF based file format (CFF = compact file format).
    This is relevant when using OpenType PS fonts as web fonts, because PostScript
    based formats are **displayed without subpixel rendering** on Windows platforms
    which affects the rendering quality considerably.'
- md: ' That''s why **TrueType based fonts are the better choice as web fonts**, even
    though Microsoft will solve this rendering issue in the future.


    As the structures of TrueType and OpenType fonts are very similar, **browsers
    most likely support both formats**. At any rate, browser support is available
    in Safari 3.1 and higher, Firefox 3.5 and Opera 10.


    ## EOT


    Internet Explorer has supported the proprietary Embedded OpenType (EOT) standard
    from the late 1990s. It''s a variation of the TrueType and OpenType formats that
    provide the following particularities:


    - EOT fonts are a compact form of OpenType optimized for quick delivery on the
    web due to data compression.

    - By means of URL-binding, EOT fonts can be tied to a specific domain. The fonts
    can then only be delivered to and used on those web pages. The technique helps
    prevent fonts from being copied and used without licence.


    EOT is exclusively supported by Internet Explorer. Even though it might not succeed
    as web font format in the future, it still makes sense to use this format today
    in order to supply the users of various IE versions with modern web fonts. Current
    IE versions (< 9) do not use any other format.


    If you want to convert TTF fonts to natively compressed EOT files, you can use
    [eotfast](http://www.eotfast.com/) – it''s a free program for Windows and Mac.


    ## WOFF


    Unlike EOT, the web Open Font Format (WOFF) is in the process of being standardized
    as a recommendation by the World Wide Web Consortium (W3C). The W3C published
    WOFF as a working draft in July 2010.


    WOFF came into existence as a kind of a compromise between font foundries and
    browser companies. No wonder that WOFF has been developed by two font designers
    (Erik van Blokland and Tal Leming) in cooperation with Mozilla developer Jonathan
    Kew. When it comes right down to it, WOFF is rather a wrapper that contains TrueType
    and OpenType fonts than a new format of its own. WOFF uses an integrated compression
    algorithm named zlib, which offers file size reduction for TrueType fonts of over
    40%. Furthermore, meta data can be added, e.g. a user''s licence. However, this
    data only presents informational material – it is not validated by browsers.


    > Thanks to WOFF Mozilla can use its corporate typeface FF Meta.


    The format has been supported by Firefox since version 3.6, Google Chrome since
    version 5.0. All other browser manufacturers are working on adding full support
    in future releases.


    Fonts can be converted into the WOFF format by the online service [FONT SQUIRREL](https://www.fontsquirrel.com)
    free of charge.


    ## SVG


    SVG fonts are text files that contain the glyph outlines represented as standard
    SVG elements and attributes, as if they were single vector objects in the SVG
    image. But this is also one of the biggest disadvantages of SVG fonts. While EOT,
    WOFF and PostScript-flavoured OpenType have compression built into the font format,
    SVG fonts are always uncompressed and usually pretty autocorrect.


    SVG fonts are not really an alternative to the other web font formats. However,
    as Mobile Safari only supports SVG fonts so far, it is the only format that can
    be used for the iPhone and iPad prior to iOS 4.2.


    Tools, such as Font Squirrel, can be used to convert fonts into this format.


    Another possibility to obtain SVG fonts is to rent them from one of the numerous
    web font providers.


    [Typekit](https://typekit.com/) also serves its fonts as SVG files for the iPhone
    and iPad.


    ## Review of Popular Web Font Embedding Services


    *By Andrew Follett*


    In the mid-80s the desktop publishing revolution began with the introduction of
    the Mac Plus, Aldus PageMaker and the Apple LaserWriter printer. It took quite
    a few years for these tools to make an impact on the design and publishing world,
    but once they did, there was no looking back.


    In 2010 we see a similar revolution starting to take shape with web fonts. Even
    though @font-face was [introduced in the CSS2 spec in 1998](https://www.w3.org/),
    it wasn''t until this past year that [all in-use web browsers](https://www.w3.org/)
    added support for it. In 2010 we have also seen a wave of web font services being
    marketed, and this could have a profound impact on web typography.


    Web font services, like Typekit and now the Google Font API, have captured a lot
    of attention. But in the middle of 2010 there''s been an explosion of new services;
    services like Fonts Live, Fontdeck, Webtype and others with conjugated names involving
    "Font" or "Type".


    ## Comparison of 10 popular web font services


    While all of these services are unique, they each provide a tool for web designers
    and developers to legally display professional fonts on their Web site. The following
    guide compares 10 of these services, breaking down the pros and cons of each.


    We hope this comparison will help you make a more informed decision on which service
    to use when you venture into the ever-growing, sometimes confusing, world of web
    fonts.


    ## Typekit


    [Typekit, Inc.](https://en.wikipedia.org/wiki/Typekit) is a popular web font service
    from [Small Batch Inc](https://en.wikipedia.org/wiki/Small_Batch_Inc) and founder
    Jeffrey Veen. Typekit was one of the first services on the scene and is currently
    one of the most widely adopted services on the market.


    ### Font Selection


    4,000 (about half of these are through the Typekit library, and the other half
    via licensing arrangements with foundries who sell their own web licences)


    ### Advantages Over Other Services


    Strong platform integrations. Typekit is a scaled service, with well over 80 million
    unique users each month.


    ### Pros


    Extremely easy setup for designers and developers, allowing integration within
    minutes. Integration with Google Font API and blogging platforms including WordPress,
    Posterous and Typepad. The full font library is available via most plans for a
    single low price, allowing customers to try different fonts on one site as well
    as use different fonts on multiple projects. Now offering [Adobe fonts](https://fonts.adobe.com/).
    Enterprise customers can self-host using their own CDN. The service allows you
    to host custom fonts. The simple free plan doesn''t expire.


    ### Cons


    Implementation requires JavaScript (although on the Typekit blog they list [some
    reasons that JavaScript-based implementation has its advantages](https://blog.typekit.com/)).
    Fonts are not available for desktop use.


    ### Pricing


    Free trial account includes the use of 2 fonts on 1 Web site. Paid plans start
    at $24.99 per year (2 sites, 5 fonts per site). The more popular plans allow unlimited
    font usage on unlimited domains.


    ### Fee Schedule


    Annual subscription


    ### Our Experience with Typekit


    Setting up TypeKit is fairly straightforward. You just set the domains you want
    to use (the free trial site includes one domain and up to two fonts) and then
    build your kit by adding fonts. A little JavaScript inserted into the header pulls
    in all the necessary CSS information. You can also reference the fonts in your
    own CSS, and use wild cards when adding to your list of allowed domains (e.g.
    *.domain.com will work on sub.domain.com).


    As is the case with any web font service, there is a brief delay before the proper
    font is shown, but it''s barely noticeable. Since Typekit''s fonts are loaded
    via JavaScript, TypeKit offers tools [to control the loading process](https://blog.typekit.com/),
    so delays are not as noticeable to the user.


    ## Webtype


    [Webtype](http://) is a recent creation of [The Font Bureau](http://), [Ascender](http://),
    [DevBridge](http://), and font experts Roger Black and Peter Van Blokland. Webtype
    is all about quality and boasts "fonts for the highest quality online typography,
    including typefaces which were designed from scratch specifically for onscreen
    reading".


    ### Font Selection


    365


    ### Advantage Over Other Services


    Font quality


    ### Pros


    Quick and easy setup. Flexible pricing. Ability to host custom fonts as well as
    self-host. JavaScript-free integration. Desktop licence available.'
  mdcn: '

    这就是为什么**基于TrueType的字体是更佳的网页字体选择**，即使微软将来会解决这个渲染问题。


    由于TrueType和OpenType字体的结构非常相似，**浏览器很可能同时支持这两种格式**。无论如何，Safari 3.1及更高版本、Firefox
    3.5和Opera 10都已提供浏览器支持。


    ## EOT


    Internet Explorer从1990年代末就开始支持专有的嵌入式OpenType标准。它是TrueType和OpenType格式的一种变体，具有以下特殊性：


    -   EOT字体是OpenType的一种紧凑形式，通过数据压缩优化了网络上的快速传输。

    -   通过URL绑定，EOT字体可以绑定到特定域名。随后，字体只能被传输到并用于那些网页。该技术有助于防止字体被未经授权复制和使用。


    EOT为Internet Explorer独家支持。即使它将来可能不会作为网页字体格式取得成功，今天使用这种格式仍然有意义，以便为各种IE版本的用户提供现代网页字体。当前的IE版本（<
    9）不使用任何其他格式。


    如果你想将TTF字体转换为原生压缩的EOT文件，可以使用[eotfast](http://www.eotfast.com/)——这是一个适用于Windows和Mac的免费程序。


    ## WOFF


    与EOT不同，网页开放字体格式正在被万维网联盟作为一项建议进行标准化。W3C于2010年7月发布了WOFF作为工作草案。


    WOFF是作为字体铸造厂和浏览器公司之间的一种妥协产物而出现的。难怪WOFF是由两位字体设计师与Mozilla开发者Jonathan Kew合作开发的。说到底，WOFF更像是一个包装器，包含TrueType和OpenType字体，而不是一种全新的格式。WOFF使用一种名为zlib的集成压缩算法，可将TrueType字体文件大小减少超过40%。此外，可以添加元数据，例如用户的许可证。然而，这些数据仅提供信息性材料——浏览器并不对其进行验证。


    > 得益于WOFF，Mozilla可以使用其企业字体FF Meta。


    该格式自Firefox 3.6版本、Google Chrome 5.0版本起就已得到支持。所有其他浏览器制造商都在努力在未来的版本中添加完全支持。


    字体可以通过在线服务[FONT SQUIRREL](https://www.fontsquirrel.com)免费转换为WOFF格式。


    ## SVG


    SVG字体是文本文件，包含表示为标准SVG元素和属性的字形轮廓，就像它们是SVG图像中的单个矢量对象一样。但这也是SVG字体最大的缺点之一。虽然EOT、WOFF和PostScript风格的OpenType将压缩功能内置到字体格式中，但SVG字体始终未压缩，通常体积相当大。


    SVG字体并非其他网页字体格式的真正替代品。然而，由于Mobile Safari目前只支持SVG字体，它是可用于iOS 4.2之前的iPhone和iPad的唯一格式。


    可以使用诸如Font Squirrel之类的工具将字体转换为此格式。


    获取SVG字体的另一种可能性是从众多网络字体提供商之一租用它们。


    [Typekit](https://typekit.com/)也将其字体作为SVG文件提供给iPhone和iPad。


    ## 流行Web字体嵌入服务回顾


    *作者：Andrew Follett*


    80年代中期，桌面出版革命随着Mac Plus、Aldus PageMaker和Apple LaserWriter打印机的推出而开始。这些工具花了相当长的时间才对设计和出版界产生影响，但一旦产生影响，就一发不可收拾。


    2010年，我们看到一场类似的革命开始成形，那就是网络字体。尽管@font-face在1998年就被[引入到CSS2规范中](https://www.w3.org/)，但直到过去一年，[所有主流浏览器](https://www.w3.org/)才添加了对它的支持。在2010年，我们还见证了一波网络字体服务的涌现，这可能对网页排版产生深远影响。


    像Typekit以及现在的Google Font API这样的网络字体服务已经引起了很多关注。但在2010年中期，新服务出现了爆炸式增长；像Fonts Live、Fontdeck、Webtype以及其他名称中包含“Font”或“Type”的组合名称服务。


    ## 10种流行Web字体服务的比较


    虽然所有这些服务都各有特色，但它们都为网页设计师和开发者提供了一种在其网站上合法显示专业字体的工具。以下指南比较了其中的10种服务，分析了每种服务的优缺点。


    我们希望这份比较能帮助您在进军不断发展的、有时令人困惑的网络字体世界时，就选择哪种服务做出更明智的决定。


    ## Typekit


    [Typekit, Inc.](https://en.wikipedia.org/wiki/Typekit) 是来自[Small Batch Inc](https://en.wikipedia.org/wiki/Small_Batch_Inc)及其创始人Jeffrey
    Veen的流行网络字体服务。Typekit是最早出现的服务之一，目前是市场上应用最广泛的服务之一。


    ### 字体选择


    4,000种（其中约一半来自Typekit库，另一半则通过与出售自己网络许可证的字体铸造厂的授权安排获得）


    ### 相较于其他服务的优势


    强大的平台集成。Typekit是一项可扩展的服务，每月拥有超过8000万独立用户。


    ### 优点


    对设计师和开发者极其容易设置，可在几分钟内完成集成。与Google Font API和包括WordPress、Posterous和Typepad在内的博客平台集成。大多数计划以低廉的单一价格提供完整的字体库，允许客户在一个网站上尝试不同字体，以及在多个项目中使用不同字体。现在提供[Adobe字体](https://fonts.adobe.com/)。企业客户可以使用自己的CDN进行自托管。该服务允许您托管自定义字体。简单的免费计划没有过期时间。


    ### 缺点


    实现需要JavaScript（尽管Typekit博客列出了[一些基于JavaScript的实现具有优势的理由](https://blog.typekit.com/)）。字体不能用于桌面使用。


    ### 定价


    免费试用帐户包括在1个网站上使用2种字体。付费计划起价为每年24.99美元（2个网站，每个网站5种字体）。更受欢迎的计划允许在无限域名上无限使用字体。


    ### 费用安排


    年费订阅


    ### 我们使用Typekit的经验


    设置TypeKit相当简单。您只需设置要使用的域名（免费试用站点包括一个域名和最多两种字体），然后通过添加字体来构建您的工具包。在头部插入一小段JavaScript即可引入所有必要的CSS信息。您也可以在自己的CSS中引用字体，并在添加到允许的域名列表时使用通配符（例如，*.domain.com将适用于sub.domain.com）。


    与任何网络字体服务一样，在正确字体显示之前会有短暂延迟，但几乎难以察觉。由于Typekit的字体通过JavaScript加载，TypeKit提供了[控制加载过程的工具](https://blog.typekit.com/)，因此用户感知到的延迟不那么明显。


    ## Webtype


    [Webtype](http://)是[The Font Bureau](http://)、[Ascender](http://)、[DevBridge](http://)以及字体专家Roger
    Black和Peter Van Blokland近期创建的项目。Webtype专注于质量，并以其“为最高质量在线排版设计的字体而自豪，包括专为屏幕阅读从头开始设计的字体”。


    ### 字体选择


    365种


    ### 相较于其他服务的优势


    字体质量


    ### 优点


    设置快速简单。定价灵活。能够托管自定义字体以及自托管。无需JavaScript即可集成。提供桌面许可证。

    '
