    # Overshoot


    Round or pointed capital letters like **S** or **B** deviate slightly in height
    from noun-rounded letters like **X** or **T** for the purpose of an equal optical
    appearance. The degree to which capital letters go below the [baseline](https://en.wikipedia.org/wiki/Baseline_(typography))
    or above the cap height is called overshoot.


    # Serif / Serifs


    Serif is both used as synonym for [Antiqua](https://en.wikipedia.org/wiki/Antiqua_(type))
    fonts and as a noun for any of the short lines stemming from and at an angle to
    the upper and lower ends of the strokes of a latin letters, arabic figures or
    special characters as the red lines in the following graphic indicate.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_247_0.png)


    There are a number of different thoughts, where serifs originated from. One of
    the most agreed upon is the explanation proposed by the Roman Catholic priest,
    teacher and calligrapher Father Edward M. Catich in his 1968 book „The Origin
    of the Serif“ which says that serifs originated in ancient Roman inscriptions.
    Chiseling letters into stone created brush marks which flared at stroke ends and
    corners, thus creating serifs. The term itself, however, most likely comes from
    the Dutch word **schreef** meaning stroke.


    There''s been a long and ongoing debate about whether or not the use of serif
    fonts increases the readability of a text. While this holds true for most Antiqua
    fonts, when printed – legibility tests showed that readers perceived such texts
    five times as quick as sans-serif print – for screen design sans-serif types such
    as Verdana are preferred. However, with increasing screen resolutions and methods
    such as [anti-aliasing](https://en.wikipedia.org/wiki/Anti-aliasing), [font hinting](https://en.wikipedia.org/wiki/Font_hinting)
    and [subpixel](https://en.wikipedia.org/wiki/Subpixel_rendering)'
  - '[PAGE 248]


    [rendering](link) serif fonts can also be properly displayed and read on screen
    today, if they are not too small. The former rule of thumb that sans-serif fonts
    are the better choice for screen design is more or less obsolete thanks to evolving
    technology standards.


    # Slab Serif


    **Egyptian** or **Egyptienne** is another name for this class of type, which has
    been developed in the early 19th century. Slab serifs are basically bolded Antiqua
    typefaces, however, with much more distinct serifs. In the early days of industrialization
    the slab serifs where used for the upcoming advertising business on flyers and
    posters, where they made a bigger impression than the less bold and less expressive
    serif types. The term Egyptian is said to stem from the contemporary interest
    in anything ancient, especially Egyptian, due to the Napoleonic discoveries in
    Egypt at that time.


    # Stroke Weight


    This term goes back to the physical width of a writing utensil and the subsequently
    thinner or bolder writing/script depending on the utensil''s width. In modern
    desk top publishing font families come with different font weights, e.g. **light**,
    **regular**, **bold** or **semibold**. Furthermore, some typefaces vary in stroke
    weight within one particular font as the following illustration shows.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_248_0.png)'
  - '[PAGE 249]


    # Widow


    One single word in the last line of a paragraph (see illustration in paragraph
    [5. Widows and Orphans](https://example.com/5)). Expressions for typographic terms
    vary in different languages. What’s called a widow in English is a whore’s child
    in German.


    # White Space


    In microtypography white space or negative space is the free space around and
    within letters, e. g. the space within the P’s bow in the illustration above.
    In macro typography negative space is the portion of a printed page or web page
    that is not filled with text or illustrations and – more generally – each and
    every unmarked space between margins, columns, lines of type or figures and other
    drawn or depicted objects.


    # X-Height


    In typography, the **x-height** or **corpus size** refers to the distance between
    the [baseline](https://example.com/baseline) and the mean line in a typeface.
    Typically, this is the height of the letter *x* in the font, as well as the *u*,
    *v*, *w*, and *z*. (Curved letters such as *a*, *c*, *e*, *m*, *n*, *o*, *r* and
    *s* tend to exceed the x-height slightly, due to [overshoot](https://example.com/overshoot).)
    In modern typography the x-height is simply a design characteristic of the font,
    and while an *x* is usually exactly one x-height in height, in some more decorative
    or script designs, this may not always be the case.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_249_0.png)'
