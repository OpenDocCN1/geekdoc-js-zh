    by spacing options such as line height, letter spacing and text size. If you find
    a balance between all of these so that the content is neither too compact nor
    too widely spaced, you will have perfect density that is both readable and scannable.


    # 6. Emphasis of Important Elements


    Another key factor is emphasis of certain elements within the body content. This
    includes highlighting links, bolding important text and showing quotes. As mentioned,
    focus points are essential in web typography. By emphasizing these objects, you
    provide focus points for the user. These points and objects help break up monotonous
    text.


    Scannable text is extremely important. By providing these focus points, you make
    the body text extremely scannable. Bolding key lines of text immediately attracts
    the user''s eye and is therefore a very important element in presenting important
    information. Pictured below is an article from UXBooth. This article uses bolding
    and italics to point out important information in the article.'
- md: ' ## 3. Navigation by Browsing


    There are two primary ways a user can navigate a site, and it''s important to
    have both forms of navigation on almost every page. The first of those two ways
    is **navigation by browsing**. This type of navigation can usually be split into
    *primary navigation*, *secondary navigation* (and deeper levels if required),
    and *utilities*.


    **Primary Navigation** is of course navigation to get to the main parts of the
    site. It is top


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_31_0.png)


    *This is a very readable article and very easy to scan for information.*


    ## 7. Organization of Information


    Believe it or not, the way you organize information in an article can strengthen
    readability. Users are guided with ease through content that is properly organized
    because information is easier to find. This veers into issues beyond the scope
    of this article but is still very important.


    ## 8. Clean Graphical Implementation


    Every text body needs some sort of visual support, be it an image, icon, graph
    or illustration. Placing the graphic in the article can be challenging. Sufficient
    space is needed between the graphic and text.


    If the graphical element is an image, then a clean border is a good idea for providing
    a clean separation from the text. Borders can help guide the user''s eyes and
    are good for adding style to content. It is important, however, to keep borders
    in content simple. They should have a subtle color palette and shouldn''t be too
    large.


    In the case of graphical elements such as icons and illustrations, space is the
    only separator that should be used. The content should move cleanly around the
    graphic without disrupting the text.


    ## 9. Use of Separators


    Separators are a simple and easy way to divide text into sections in a clean and
    organized manner. They can be used to divide hierarchy elements, such as headers
    and body text. They can also be used to divide content into sections.


    The simplest form of divider is a single line. These are most often used to divide
    hierarchy elements and are very useful for making subtle divisions that still
    play a big role in readability.


    Another common way to divide content is to use boxes. Text boxes are excellent
    for separating unrelated content on a single page. They help move the user''s
    eyes through a complex layout. Below is an example of this on Pixelmator''s Web
    site. It uses boxes to separate content in a clean way. Notice how the boxes are
    defined by their background instead of a border.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_32_0.png)


    ## 10. Good Margins


    You hear people say that you should use white space, but why? White space actually
    helps draw the user''s eye to the text. The blank area (white space) forces the
    eye to focus on the text. So white space will influence the flow and readability
    of content. Margins are one of the best white space elements and support text
    elements well. Margins on either side will force the user''s eye to focus inward
    on the core content of the article.


    Margins also support the article in another way. They help separate content from
    the rest of the design and layout. Text shouldn''t bleed into other layout elements,
    especially if it is a long article. Margins help define the article and its separation.


    In the grid-based layout below, margins and only margins are used to set apart
    bodies of text. The result is a clean, clear and concise page.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_34_0.png)


    ## Effects To Give Typography Some Flair


    For the most part, text is text, simply words on a plain single-colored background.
    Not too complex, but it works. Occasionally, though, the text layout will need
    some styling and decoration. This may be a header or typography used in the overall
    design of the Web site (as opposed to the article content). No matter what the
    form, it is important to always stay within the limits of readability. Yes, it
    is essential to be creative and use decorative styling, but the typography must
    be legible or else it becomes almost useless.


    ### Fancy Text


    One good way to style typography is to use a fancy or unique font within the layout
    along with standard fonts. It is important to use simple and standard fonts for
    body text, but using fancy fonts elsewhere is an easy way to mix it up and add
    a little more to the theme. Using a single font throughout the entire Web site
    gets boring and, although readable, shouldn''t be done.


    ### Letterpress


    Another very common form of web typography styling is letterpress. The example
    below uses a letterpress technique to add depth and embellish the layout. It looks
    very nice and flows cleanly, and the text is still completely readable.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_35_0.png)


    ### Style the Background


    Adding a nice background can be just as effective as styling text. By decorating
    the text body background, you are styling the text. Styling the background can
    be visually beautiful but can also reduce legibility. This is potentially a big
    problem but easily avoidable.


    ## Keep the Contrast


    First and foremost, it important to keep contrast within a readable range. For
    the background, use colors that are much subtler and duller than those of the
    text. This will allow the user''s eye to focus on the text and not be distracted
    by the background.


    ## Textures Work Nicely


    The best road to take with the background is to use a nice texture, which won''t
    detract from the typography.


    Here is a dark Web site with a good typographic style. The typography has a decorative
    background, but the contrast still works nicely. The text itself has no styling,
    but the background makes up for it.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_36_0.png)


    This is another great texture that supports the typography. The background texture
    resembles a canvas, and the typography takes on the form of a watercolor.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_37_0.png)


    ## Link Styling


    Within long text, links are one more type of focus point, and you should find
    a way to make them pop. In summary, the best way to do this is to use underlining,
    a different color than the body text, italics and a different font. You can combine
    these to great effect or just use one. The example below underlines and uses a
    different color for links.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_37_1.png)


    ## 5 Principles and Ideas of Setting Type on the web


    *By Sean Hodge*


    There are some basic approaches, guidelines and goals to consider when working
    with type on the web. Overall, the medium of web typography involves readability,
    accessibility, usability, and brandability. On the web, these aspects function
    together to accomplish design''s goals of communication and user interaction.


    There are many ways to approach web typography in order to create effective and
    expressive results. Let''s take a closer look at some **principles, rules and
    ideas for approaching web typography decisions** — you can use them as a starting
    point for learning how to achieve effective type setting on the web.


    ### 1. Approach Web Typography Decisions Systematically


    In web design every typographic decision needs to simultaneously accomplish a
    variety of results. Each headline you create should be set in text that is **legible**
    and **search engine friendly**, while the typeface should fit within the guidelines
    of the company''s brand. Furthermore, typography should fit to the graphic style
    of the site and **meet user expectations** of being able to copy and paste text.
    As you can see, that''s a wide array of needs for a headline to accomplish.


    In some cases, this poses a problem. For instance, styling and branding guidelines
    may require from the designer to use specific typefaces which can''t be used online
    directly. So a decision needs to be made:


    - Deviate from the brand guidelines to maintain optimal search engine friendliness
    or

    - use an image replacement solution which embeds the required font in an image
    ([statically](#) or [dynamically](#)) or

    - consider using [sIFR](#), a rich Flash-based dynamic font embedding technique
    which allows not only for embedding fonts into content presentation but also interacting
    with them (almost) as you would do with plain text.


    Further information on sIFR and other text replacement tools and techniques are
    covered by a separate article in this eBook.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_39_0.png)


    An introducing article about sIFR: [sIFR 2.0: Rich Accessible Typography for the
    Masses](#)


    In many cases, the myriad of goals web typography needs to serve will be conflicting
    with each other. With each client and for each projects you need to prioritize
    and define **which goals are more important** than the others.'
  mdcn: "\n ## 3. 浏览式导航\n\n用户浏览网站主要有两种方式，在几乎每个页面上都同时提供这两种导航方式非常重要。其中第一种是**浏览式导航**。这种导航通常可以分为*主导航*、*辅助导航*（以及更深层级，如需要的话）和*工具栏*。\n\
    \n**主导航**当然是用于访问网站主要部分的导航。它位于顶部\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_0.png)\n\
    \n*这是一篇可读性很强、非常易于扫描获取信息的文章。*\n\n## 7. 信息的组织\n\n信不信由你，你在文章中组织信息的方式可以增强可读性。信息组织得当，用户就能轻松地浏览内容，因为信息更容易找到。这涉及到本文范围之外的问题，但仍然非常重要。\n\
    \n## 8. 简洁的图形实现\n\n每个文本主体都需要某种视觉支持，无论是图像、图标、图表还是插图。在文章中放置图形可能具有挑战性。图形和文本之间需要有足够的间距。\n\
    \n如果图形元素是图像，那么一个干净的边框是实现与文本清晰分离的好方法。边框可以帮助引导用户的视线，并有助于为内容增添风格。然而，重要的是保持内容中边框的简洁。它们应该使用柔和的调色板，并且不宜过大。\n\
    \n对于图标和插图等图形元素，间距是唯一应该使用的分隔方式。内容应该干净地环绕图形，而不应打断文本。\n\n## 9. 分隔线的使用\n\n分隔线是一种简单且简单的方法，可以以干净和有条理的方式将文本分成几个部分。它们可以用来划分层次结构元素，例如标题和正文。它们也可以用来将内容分成几个部分。\n\
    \n最简单的分隔线是单行。这些最常用于划分层次结构元素，对于进行仍然对可读性起重要作用的细微划分非常有用。\n\n另一种常见的内容划分方式是使用方框。文本方框非常适合在单个页面上分离不相关的内容。它们有助于引导用户的视线浏览复杂的布局。下面是\
    \ Pixelmator 网站上的一个例子。它使用方框来干净地分离内容。注意方框是通过其背景而不是边框来定义的。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_1.png)\n\
    \n## 10. 良好的边距\n\n你听到人们说应该使用留白，但为什么呢？留白实际上有助于将用户的视线吸引到文本上。空白区域（留白）迫使眼睛专注于文本。因此，留白将影响内容的流动性和可读性。边距是最好的留白元素之一，非常支持文本元素。两侧的边距将迫使用户的视线向内聚焦在文章的核心内容上。\n\
    \n边距还以另一种方式支持文章。它们有助于将内容与设计其余部分和布局分离。文本不应延伸到其他布局元素中，尤其是对于长文章而言。边距有助于定义文章及其独立性。\n\
    \n在下面的基于网格的布局中，仅使用边距来区分文本主体。结果是一个干净、清晰且简洁的页面。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_2.png)\n\
    \n## 为排版增添风采的效果\n\n大多数情况下，文本就是文本，只是纯色背景上的简单文字。不太复杂，但有效。然而，偶尔文本布局会需要一些样式和装饰。这可能是标题或用于网站整体设计（而非文章内容）的排版。无论形式如何，始终保持在可读性范围内非常重要。是的，发挥创意并使用装饰性样式是必不可少的，但排版必须清晰易读，否则它就几乎没用了。\n\
    \n### 花式文本\n\n为排版添加样式的一种好方法是使用布局中的花哨或独特字体，同时搭配标准字体。正文使用简单标准的字体很重要，但在其他地方使用花哨字体是一种混搭的简便方法，可以为主题增添更多色彩。整个网站使用单一字体会显得乏味，虽然可读，但不应这样做。\n\
    \n### 凹陷效果\n\n另一种非常常见的网页排版样式是凹陷效果。下面的例子使用凹陷技术来增加深度并美化布局。它看起来非常漂亮，流动干净，文本仍然完全可读。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_3.png)\n\n### 背景样式\n\
    \n添加精美的背景可能与文本样式同样有效。通过装饰文本主体背景，你实际上是在为文本添加样式。背景样式可以在视觉上很美观，但也可能降低清晰度。这可能是个大问题，但很容易避免。\n\
    \n## 保持对比度\n\n首先，**保持对比度在可读范围内很重要**。对于背景，使用比文本颜色更柔和、更暗淡的颜色。这将使你的眼睛专注于文本，而不是被背景分散注意力。\n\
    \n## 纹理效果很好\n\n背景的最佳选择是使用精美的纹理，这不会削弱排版的效果。\n\n这里有一个深色网站，具有良好的排版风格。排版具有装饰性背景，但对比度仍然很好。文本本身没有样式，但背景弥补了这一点。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_4.png)\n\n这是另一种支持排版的出色纹理。背景纹理类似于画布，排版呈现出水彩画的形式。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_5.png)\n\n## 链接样式\n\
    \n在长文本中，链接是另一种焦点，你应该找到一种让它们脱颖而出的方法。总而言之，最好的方法是使用下划线、与正文文本不同的颜色、斜体和不同的字体。你可以将这些组合起来以达到很好的效果，或者只使用其中一种。下面的例子为链接添加了下划线并使用不同的颜色。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_6.png)\n\n## 网页排版的\
    \ 5 个原则与思路\n\n*作者：Sean Hodge*\n\n在网页上使用排版时，有一些基本的方法、指南和目标需要考虑。总体而言，网页排版这一媒介涉及可读性、可访问性、可用性和品牌化。在网页上，这些方面共同协作，以实现设计的沟通和用户交互目标。\n\
    \n webpage排版有许多方法可以实现有效且富有表现力的结果。让我们更仔细地看看一些**用于网页排版决策的原则、规则和思路**——你可以将它们作为起点，学习如何在网页上实现有效的排版设置。\n\
    \n### 1. 系统化地进行网页排版决策\n\n在网页设计中，每个排版决策都需要同时实现多种效果。你创建的每个标题都应使用**清晰易读**且**搜索引擎友好**的文本，同时字体应符合公司品牌的指导方针。此外，排版应符合网站的图形风格，并**满足用户对复制粘贴文本的期望**。如你所见，一个标题需要满足广泛的需求。\n\
    \n在某些情况下，这就会产生问题。例如，样式和品牌指导方针可能要求设计师使用无法直接在线使用的特定字体。因此需要做出决定：\n\n- 偏离品牌指导方针以保持最佳的搜索引擎友好性，或者\n\
    - 使用图像替换解决方案，将所需字体嵌入图像中（[静态](#)或[动态](#)），或者\n- 考虑使用 [sIFR](#)，一种基于 Flash 的动态字体嵌入技术，它不仅可以将字体嵌入内容展示中，还可以像处理纯文本一样与它们进行交互（几乎）。\n\
    \n有关 sIFR 和其他文本替换工具和技术的更多信息，由本电子书的另一篇单独文章介绍。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec.markdown_org_image_7.png)\n\
    \n关于 sIFR 的介绍文章：[sIFR 2.0: Rich Accessible Typography for the Masses](#)\n\n在很多情况下，网页排版需要满足的众多目标会相互冲突。对于每个客户和每个项目，你都需要优先排序并**定义哪些目标比其他目标更重要**。\n"
