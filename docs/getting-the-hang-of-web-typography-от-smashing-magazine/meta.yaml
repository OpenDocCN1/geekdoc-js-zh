    # 7. How Many Characters Per Line?


    According to a classic rule of web typography, 55 to 75 is an optimal number of
    characters per line. Surprisingly, our study shows that most Web sites have a
    higher number. We counted how many characters could fit on one line using the
    design''s default font size. The result, which is an average of 88.74 characters
    per line (maximum), is extremely high. Of course, this maximal number is different
    from the average number of characters per line, which in general ranges between
    75 and 85 characters per line. Still, the range is way above the conventional
    range — quite peculiar.'
