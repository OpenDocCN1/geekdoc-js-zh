    These posters have a very well-defined structure. It definitely feels like tabular\
    \ data, and tabular data is one such case that the disposition of the information\
    \ extrapolates the realm of graphic layout and starts hinting on the meaning of\
    \ data and how various chunks of data relate to each other.\n\nThe abuse of tables\
    \ as structural elements was, and still is, very harmful to web accessibility.\
    \ However, blindly replacing tables for div tags does not help to make code more\
    \ semantic. List elements are a great solution for collections of similar data,\
    \ but ULs and OLs do not define any kind of relation between this data.\n\n##\
    \ Enter Definition Lists\n\nDefinition List (DL) is probably one of the most underestimated\
    \ HTML elements. It's a list element such as UL and OL, but it is supposed to\
    \ present a collection of terms (DT) and descriptions (DD). Its most obvious use\
    \ case is to represent dictionaries, but its potential goes way beyond that. The\
    \ W3C Recommendation gives the example of a dialogue where DTs are character names\
    \ and DDs are the text lines. It could also be used to represent calendars (days\
    \ and assignments), articles summaries (titles and descriptions) and much more.\n\
    \n```\n<dl>\n  <dt>Coffee</dt>\n    <dd>- black hot drink</dd>\n  <dt>Milk</dt>\n\
    \    <dd>- white cold drink</dd>\n</dl>\n```\n\n## Elementary\n\nThere is also\
    \ a direct influence from the constructivism, elementarism and minimalism movements\
    \ in the Swiss Style artists. Minimal design is about removing the unnecessary\
    \ and emphasizing the necessary; it's about a functional and simple use of fundamental\
    \ elements of style for the purpose of the artist's objectives.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_65_0.png)\n\
    \nThis principle is one of the core reasons why Swiss Style graphic designers\
    \ pay so much attention to type. Typeface is one of the most fundamental elements\
    \ of visual communication that is able to deliver the message in a very precise,\
    \ clear way.\n\nAccording to the Swiss movement, **adding more elements without\
    \ fully exploring the potential of the fundamental ones** can be considered a\
    \ 'waste'. As these basic elements, like typography, have so much aesthetic potential,\
    \ there's rarely a need for other visual graphics elements.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_66_0.png)\n\
    \nIn many aspects, these ideas touch on the core proposals of the De Stijl movement.\
    \ The neoplasticism, as proposed by De Stijl artists, is about elementarism and\
    \ geometry not only as a form of exploring the potential of the fundamental elements,\
    \ but as a pursuit of beauty and harmony, hinting on a more mystical belief in\
    \ 'ideal' geometric forms.\n\n## Drop the Serif (...or rather don't)\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_67_0.png)\n\
    \nOne of the strongest characteristics of the Swiss style typography is the use\
    \ of [sans-serif](https://example.com) typefaces such as Akzidenz Grotesk and\
    \ Neue Haas Grotesk (a.k.a Helvetica).\n\nIn fact, when Jan Tschichold wrote „Die\
    \ neue Typographie\", he ignored any use of non sans-serif typefaces. With this\
    \ philosophy, graphic designers were aiming at clarity, simplicity and universality.\
    \ Helvetica, for instance, is a typeface that is famous for its pervasiveness:\
    \ it is used in corporate identity, street signs, magazines and pretty much everywhere\
    \ else. The Swiss Style advocates that the typeface does not have to be expressive\
    \ in itself, it must be an unobtrusive instrument of expression.\n\n> \"I don't\
    \ think that type should be expressive at all. I can write the word 'dog' with\
    \ any typeface and it doesn't have to look like a dog. But there are people that\
    \ [think that] when they write 'dog' it should bark.\"\n\n**Massimo Vignelli**\
    \ in the documentary *Helvetica*.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_68_0.png)\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_69_0.png)\n\nThis is by no means a\
    \ rigid rule. drivers. vó \n\nWhen Swiss Style graphic designers advocate the\
    \ use of sans-serif typefaces, they weren't paying attention to the historical\
    \ legacy and experimented with something new. Even Jan Tschichold himself admitted\
    \ that his book was too rigid. If there's one single lesson from the Swiss Style\
    \ it is to love and respect typefaces.\n\n## Font-size as a tool for readability,\
    \ impact and rythm\n\nIt's very common to spot the use of font-size contrast in\
    \ the works of the Swiss Style.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_70_0.png)\n\
    \nDifferent font-sizes not only generate visual impact, but also provide readers\
    \ with a hint about the hierarchy of the presented data. Huge words are the entry\
    \ points, the top-level elements in the content's information architecture and\
    \ page's hierarchy. This is a very efficient way of guiding the reader's eyes\
    \ through the page, thus working as an interface to the content.\n\n## Opernhaus\
    \ Zürich\n\n## Eröffnung der Spielzeit 1968/69\n\n## Palestrina\n\nMusikalische\
    \ Legende von Hans Pfitzner\n\nErstaufführung\nSamstag, 7. September, 19.00 Uhr\n\
    \nMusikalische Leitung: Alberto Erede\nInszenierung: Herbert Graf\nBühnenbild/Kostüme:\
    \ Max Rothlisberger\nChöre: Hans Erismann\n\n## Der Wildschütz\n\nKomische Oper\
    \ von Albert Lortzing\n\nNeuinszenierung\nSamstag, 14. September, 20.00 Uhr\n\n\
    Musikalische Leitung: Matthias Aeschbacher\nInszenierung: Martin Markun\nBühnenbild/Kostüme:\
    \ Monika von Zallinger\nChöre: Hans Erismann\n\n## Photography - yes, photography!\n\
    \nDespite not being particularly famous for it, one important part of the Swiss\
    \ Style is its remarkable use of photography. Following the modernist ideas in\
    \ which photography was a much better tool to portray reality than drawings and\
    \ illustrations, the **Neue Grafik Magazin**, a very important Swiss graphic design\
    \ publication at the time, dedicated a big part of its content to photography\
    \ and its application in design.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_72_0.png)\n\
    \n## 8 Simple Ways to Improve Typography in Your Designs\n\nBy *Antonio Carusone*\n\
    \nMany people, designers included, think that **typography** consists of only\
    \ selecting a typeface, choosing a font size and whether it should be regular\
    \ or bold. For most people it ends there. But there is much more to achieving\
    \ good typography and it's in the details that designers often neglect.\n\nThese\
    \ details give the designer total control, allowing them to create beautiful and\
    \ consistent typography in their designs. While these details can be applied across\
    \ different types of media, in this articles we're going to focus on how to apply\
    \ them to web design using CSS.\n\nHere are 8 simple ways you can **use CSS to\
    \ improve your typography** and hence the overall usability of your designs.\n\
    \n## 1. Measure\n\nThe measure is the length of a line of type. To a reader's\
    \ eye, long or short lines can be tiring and distracting. A long measure disrupts\
    \ the rhythm because the reader has a hard time locating the next line of type.\n\
    \nThe only time a narrow measure is acceptable is with a small amount of text.\
    \ For optimum readability you want the measure to be between 40 to 80 characters,\
    \ including spaces. For a **single-column design 65 characters** is considered\
    \ ideal."
