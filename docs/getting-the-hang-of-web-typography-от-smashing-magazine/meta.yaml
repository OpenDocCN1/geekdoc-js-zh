    再来一个服装类比——看看下面这张照片。


    (Photo credit: Betsssssy. Used under Creative Commons licence.)


    Betsey 的搭配之所以成功，是因为粉色腰带起到了点缀作用，再由朴实的蓝色牛仔裤来平衡。但如果我们得意忘形，给 Betsey 全身都涂上粉色，她可能就会被打扮成
    carnival parade 游行队伍了。


    *(Photo credit: Phillip Leroyer. Used under Creative Commons licence.)*


    让我们称之为字体的**粉色腰带原则**：个性强烈的展示字体最好**少量使用**。如果我们在设计中每一段文字都用上 cool 的展示字体，字体的审美趣味很快就会耗尽，而且——更糟糕的是——我们的设计会变得非常难以阅读。假设我们在为最喜欢的街角泰式餐厅设计菜单。我们的客户可能希望我们用一种"典型的"亚洲展示字体，比如
    Sho：


    到目前为止，还不错。但看看当我们把心爱的字体选择应用到整个菜单时会发生什么：


    ## HOUSE OF THAI


    OPEN MON-FRI, 8-12. MAJOR CREDIT CARDS ACCEPTED


    | APPETIZERS | |

    |---|---|

    | SATAY | $5.99 |

    | FRIED SHRIMP | $6.99 |

    | SPRING ROLLS | $6.50 |


    | NOODLES | |

    |---|---|

    | PAD THAI | $9.50 |

    | PAD SEE YEW | $10.99 |

    | RAD NAH NOODLES | $9.50 |


    | SEAFOOD | |

    |---|---|

    | STEAM MUSSELS | $11.99 |

    | PLA-RAD PRIKI | $12.99 |

    | PA-NANG CURRY SEAFOOD | $10.50 |


    够了够了。让我们尝试用一些更中性的字体来替换部分普通文本：


    ## HOUSE OF THAI


    OPEN MON-FRI, 8-12. MAJOR CREDIT CARDS ACCEPTED


    ### APPETIZERS


    - Satay $5.99

    - Fried Shrimp $6.99

    - Spring Rolls $6.50


    ### NOODLES


    - Pad Thai $9.50

    - Pad See-Yew $10.99

    - Rad Nah Noodles $9.50


    ### SEAFOOD


    - Steam Mussels $11.99

    - Pla-Rad-Priki $12.99

    - Pa-Nang Curry Seafood $10.50


    这就好多了。现在我们控制住了明星字体的使用，让它又能大放异彩。


    ## 5. 第五条规则是没有规则


    真的。只要你足够仔细地寻找，你会发现一份完全用难以阅读的展示字体排版的、看起来却 dazzling 的菜单。或者两个不同的 Geometric Sans 字体在同一页面上
    happily 共存（事实上，就在这周，我在一个项目中尝试了这个做法，惊讶地发现它恰到好处）。**只有惯例，没有铁律**来规定如何使用字体，就像没有规定我们早上应该如何穿衣一样。值得尝试所有可能性，看看会发生什么——即使是穿着你的万圣节喇叭裤去出庭应讯。


    ## 结语


    希望这五个原则能给你一些关于如何选择、应用和混合字体——甚至是否应该混合字体——的指导。最终，挑选字体需要理解力和直觉的结合，而且——就像任何技能一样——需要练习。在如今我们能接触到的众多字体中，我们很容易忘记：没有什么比得上经*专业人士*之手的经典字体。


    我收到的最好的字体建议之一，来自我的第一位字体设计老师：**挑选一种你喜欢的字体**，然后几个月里反复使用它，排除其他所有字体。虽然这种练习有时会让人感到束缚，但它也能起到有益的提醒：互联网时代可供选择的数量，无法替代质量。


    ## 组合字体的最佳实践


    By Douglas Bonneville


    创造出色的字体组合是一门艺术，不是科学。确实，字体设计之美没有边界。虽然没有绝对需要遵守的规则，但在设计中组合字体时，理解并应用一些最佳实践至关重要。只要用心关注，这些原则总能带来合适的结果。今天我们将深入探讨组合字体的一些最佳实践——以及一些应避免的错误。


    ### 无衬线体与衬线体搭配


    迄今为止，最流行的字体组合原则是将**无衬线体标题**与**衬线体正文**配对。这是一种经典的组合，几乎不可能出错。


    在下面的例子中——一个典型的文章布局——左侧使用了 Trade Gothic Bold No.2 搭配 Bell Gothic。它们都是无衬线字体。然而，它们的个性非常不同。


    一个**好的经验法则**是：在处理标题和正文设计问题时，不要让每种字体的个性造成过多的注意力。Trade Gothic 可以说是一种 no-nonsense
    的字体。而 Bell Gothic 则更加 dynamic 和 outspoken。


    将这两者放在一起**会在设计中产生不必要的冲突。**Trade Gothic 想要直奔主题，但 Bell Gothic 想要找点乐子。这种张力很可能不是设计目标的一部分，应该避免。


    现在看看右侧的例子。我们用庄重的 Sabon 替代了 Bell Gothic。Sabon 是一种衬线字体，与 Trade Gothic 搭配得很好。它们都专注于大胆的清晰度，由于较高的
    x-height，字形高度易读。在这个语境下，两种字体目标一致，这就构成了绝佳的组合。


    ### 避免相似的分类


    同一分类但来自不同字体家族的字体，**组合时很容易产生不和谐。**它们截然不同的个性无法很好地相互配合，如果不加注意，会产生一种排版上的混乱创造了"typographic
    mud"。


    在左侧的第一个例子中，标题使用 Clarendon Bold，这是一种**slab serif**。左侧的正文是 Officina Serif，也是一种**slab
    serif**。Slab serif 字体以其鲜明的个性著称，它们喜欢在任何使用的设计区域中占据主导地位。将两种 slab serif 放在一起会产生不必要且难看的张力。


    现在注意右侧的例子。Clarendon Bold 标题与更加中性的 New Baskerville 配对。New Baskerville 是一种多功能的**过渡型衬线体**，字形宽阔，与厚重的
    Clarendon 搭配得很好。同时，它退居其次，让 Clarendon 尽情展现其个性。结果这个组合相当不错。


    从一开始就选择了不同分类的字体，避免了日后设计和排版中不必要的张力。

    '
