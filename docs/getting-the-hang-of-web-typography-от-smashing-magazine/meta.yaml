    \ 20 位访客可以看到该字体。\n\n我发现必须在主机名中添加子目录才能使其正常工作。但所有选项和控制都位于每种字体的单一页面上，便于更新设置。字体显示速度很快，但与其他服务一样，会有不到一秒的时间可以看到默认字体。\n\
