    \ not replace the heading text with an image, embedded font, or bit of Flash?\
    \ The methods described below are easier than they sound. And the end result is\
    \ that the vast majority of users will see the beautiful typography you want them\
    \ to see.\n\nA word of warning, though: **don't use dynamic text replacement for\
    \ all of the text on your page**. All that would do is slow it down and frustrate\
    \ your visitors. Instead, save it for headings, menu items, pull quotes and other\
    \ small bits of text.\n\n## sIFR 2.0\n\n[sIFR](Scalable Inman Flash Replacement)\
    \ was one of the first dynamic text replacement methods, developed in the spring\
    \ of 2005. It uses JavaScript and Flash to convert any text you designate on a\
    \ page to any typeface you choose and has been released as open source under the\
    \ [CC-GNU LGPL](https://creativecommons.org/licenses/LGPL/2.1/) licence, so it's\
    \ free for anyone to use.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_162_0.png)\n\
    \nsIFR is fully accessible to screen readers, because it simply displays the original\
    \ text if JavaScript or Flash isn't enabled. And because of the way text is rendered,\
    \ if your visitors zoom in using a browser's text-zoom option, the replaced text\
    \ will also zoom in (only when the page loads, though, not if they zoom in afterward).\n\
    \n## How sIFR Works\n\nWhile sIFR is a rather complex system, its basic concept\
    \ is simple: JavaScript checks to see whether Flash is installed in your browser.\
    \ If it isn't (or if JavaScript isn't installed), it stops there and the visitor\
    \ sees your text in whatever font you've specified in your style sheet. If Flash\
    \ is installed, then the JavaScript measures each element on the page that you've\
    \ designated to be converted.\n\nOnce JavaScript has measured all the elements,\
    \ it replaces each with a Flash movie that is the same size as the original element.\
    \ The original text is passed into the Flash movie as a variable, then some ActionScript\
    \ code in the Flash file draws the text in the typeface you've chosen and scales\
    \ it to fill the area occupied by the Flash movie.\n\n## Benefits of sIFR\n\n\
    - Works with virtually any font.\n- Degrades gracefully in most instances to the\
    \ original HTML or (X)HTML file if the person doesn't have Flash or JavaScript\
    \ installed\n- Cross-browser and cross-platform compatible\n- Because the original\
    \ (X)HTML document remains unchanged, the SEO, accessibility and other concerns\
    \ people usually have with Flash aren't really issues\n\n## Drawbacks/Disadvantages\
    \ of sIFR\n\n- Requires both JavaScript and Flash to be installed"
  mdcn: "\nIE7。要能够将属性应用于某个元素，该元素必须将`overflow`设置为`visible`以外的值，并且设置`white-space: nowrap`。要使其在\
