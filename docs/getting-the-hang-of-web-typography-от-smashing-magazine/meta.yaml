  md: '# Lessons From Swiss Style Graphic Design


    *By Diogo Terror*


    Also known as International Style, the Swiss Style does not simply describe a
    style of graphic design made in Switzerland. It became famous through the art
    of very talented Swiss graphic designers, but it emerged in Russia, Germany and
    Netherlands in the 1920''s. This style in art, architecture and culture became
    an ''international'' style after the 1950''s and it was produced by artists all
    around the globe. Despite that, people still refer to it as the Swiss Style or
    the Swiss Legacy.


    This progressive, radical movement in graphic design is not concerned with the
    graphic design in Switzerland, but rather with the new style that had been proposed,
    attacked and defended in the 1920s in Switzerland.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_55_0.png)


    Keen attention to detail, precision, craft skills, systems of education and technical
    training and a high standard of print, as well as a clear refined and inventive
    lettering and typography laid out a foundation for a new'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'movement that has been exported worldwide in 1960s to become an international
    style.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_56_0.png)


    Emerging from the modernist and constructivist ideals, the Swiss Style can be
    defined as an authentic pursuit for simplicity – the beauty is secondary to the
    purpose, not a purpose in itself. The principle "form follows function" became
    a battle-cry of Modernist architects after the 1930s.


    As a consequence of this principle, most of the Swiss Style craft is devoted to
    the minimal elements of style such as typography and content layout rather than
    on textures and illustrations.


    > > "Perfection is achieved, not when there is nothing left to add, but when there
    is nothing left to remove." Antoine de Saint-Exupéry


    # ## How the Swiss Style Relates to the web


    This style of graphic design was born in the institutional context. The majority
    of pieces from this movement are in the form of posters, stamps, institutional
    typographical identity, street signs, etc. In this sense, these'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'artists are leveraging much more than just top-down communication, they''re
    creating user-friendly interfaces.


    As a result of that, Swiss Style artists tend to put their artistic efforts in
    that the content they are conveying delivers its intended message in a clear,
    unobtrusive fashion. One can make the point that they were thinking, in a broader
    sense, about usability long before the web even existed. How can we not learn
    from these great masters?


    # Uniformity and geometry


    Even a quick study of classic Swiss style works reveals a strong attention of
    graphic designers to uniform design elements and strong geometric shapes. Graphic
    artists have experimented with abstract geometric patterns, uncommon color combinations,
    text manipulations and striking abstract visuals that were used to clearly convey
    their purpose in a very remarkable way.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_57_0.png)'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/45c2114e61862fb7d9e9d1d966d826ec_58_0.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Whitespace: Let the text breath


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_59_0.png)


    Whitespace can never be underrated. It''s a very important element for both visual
    impact and readability. It feels quite inviting when a web page is laid out in
    such a fashion that the organization of the page (and the site) is clearly conveyed
    in a split second.


    It''s also good for business, since people use interfaces that they understand
    and tend to reject the ones they don''t.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'A common way that people pursue organization is by having markers that separate
    the different parts of the site: in web design icons and illustrations are used
    to separate various types of content. But Swiss style is all about using less,
    so instead of adding more elements to work with, they prefer to remove as much
    as possible. This is a great example of the ''less is more'' principle and of
    the ''the content is the interface'' wisdom.


    # Grid systems


    A grid system is a rigid framework that is supposed to help graphic designers
    in the meaningful, logical and consistent organization of information on a page.
    Rudimentary versions of grid systems existed since the medieval times, but a group
    of graphic designers, mostly inspired in ideas from typographical literature started
    building a more rigid and coherent system for page layout. The core of these ideas
    were first presented in the book Grid Systems in Graphic Design by Josef Müller-Brockmann
    which helped to spread the knowledge about the grids thorough the world.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_60_0.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Nowadays grid systems are an established tool that is often used by print and
    web designers to create well-structured, balanced designs.


    # More than grids, structured information


    When we learn from the Swiss Style literature, it''s very easy to embrace the
    grid system as a purely visual framework. However, upon a further examination
    we can see that grids are more than just the art of placing elements; there''s
    a subtle layer of semantic organization of data which, despite not being inherent
    to the use of the grid, is a big part of the Swiss Style''s essence.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_61_0.png)'
  merge: -1
  pgno: 61
- img_proc: true
