    Type Drawer; so really the number of Web sites is only limited to an individual
    plan within a single user account, whereas the number of Type Drawers is unlimited).


    # Pricing


    Free 30-day trial on all fonts. Packages start at $0.99 per month (only includes
    "Promotional" font selection) for 1GB usage and up to 4 Web sites.


    # Fee Schedule


    Monthly subscription


    # Our Experience with WebINK


    We only tested the web interface for WebINK, not Suitcase Fusion 3. The WebINK
    online interface is probably more confusing than the others listed here. The service
    allows you to create an unlimited amount of Type Drawers to hold the fonts for
    your different projects. To add fonts from the library into your Type Drawers,
    you need to click the "add fonts" button within a'
- md: 'specific Drawer. Going directly to the font library will not allow you to have
    direct access to your Drawers, so this takes some getting used to.


    Once you get the fonts you want into your Type Drawer, setting them up on your
    Web site requires adding the `@font-face` information to your stylesheet and placing
    the fonts into your font stacks. The speed at which the font loads on the site
    is about the same as any other service.


    ## Font-Face


    [Font-Face](https://code.google.com/archive/p/googlefontdirectory/) recently scrapped
    its project after the recent Google Font announcement. However, according to their
    Web site, they are "hatching a new plan" so we may hear more from them yet.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_217_0.png)


    ## How to Choose a Service


    There is no "right" answer when it comes to choosing a web font service. Selecting
    the proper service usually depends on what you or your client need. The following
    questions might help assess your needs:


    - How important is font selection? Are there specific fonts you need?

    - How important is font quality to you and your clients?

    - Do you require a self-hosting option?

    - Do you or your client have a budget? What type of fee structure would be ideal?

    - Is iPhone and iPad (Mobile Safari) support important?


    Based on your answers to these questions you should be able to use the quick comparison
    chart below, along with the more detailed information above, to make an informed
    decision, or at the very least find a few starting points to start digging deeper
    (also be sure to check out the great chart @font-face face off).


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_218_0.png)


    | Service | Fonts | Advantage Over Other Services | Price | Fee Schedule |

    |---------|-------|-------------------------------|-------|--------------|

    | [Typekit](https://typekit.com/) | 4000 | Integrations | Plans start at $24.99
    | Annual |

    | [Webtype](https://www.webtype.com/) | 365 | Font quality | Fonts start at $10
    | Annual |

    | [Fontdeck](https://fontdeck.com/) | 600 | Pay-per-use | Free / $2.50 and up
    | Annual |

    | [Fonts Live](https://www.fontslive.com/) | 499 | Font quality | Fonts start
    at $10 | Annual |

    | [TypeFront](https://typefront.com/) | N/A | Do-it-yourself | Plans start at
    $5 | Monthly |

    | [Fontspring](https://www.fontspring.com/) | 1,937 families | No recurring fee
    | Free to $100s | One-time |

    | [Fonts.com](https://www.fonts.com/) | 7,500+ | Font selection | Free or up to
    $500 | 30 days |

    | [Google Fonts](https://fonts.google.com/) | 60 | Easy to implement | Free |
    N/A |

    | [Kernest](https://kernest.com/) | 2,450 | Most fonts free | Free or up to $15
    | One-time |

    | [Typotheque](https://www.typotheque.com/) | 524 | Unlimited Web sites | 20%
    of desktop licence | One-time |

    | [WebINK](https://www.webink.com/) | 2,000 | Affordable | Plans start at $0.99
    | Monthly |


    *Quick Overview of the services reviewed in this article*


    ## Summary


    Web font services, like any relatively new popular technology, are complex and
    rapidly proliferating. While there is no "perfect" service, it''s promising to
    see such a wide variety of companies entering the industry and continually raising
    the bar for web fonts.


    ## How to Embed Web Fonts from your Server


    *By Ralf Hermann*


    You don''t necessarily have to rent or licence fonts for use on web pages. You
    can also pimp your already licenced desktop fonts for cross-browser web font embedding
    and upload the fonts to your own web server.


    ## Fonts to Choose and Fonts to Avoid


    Before you start converting your desktop fonts into web fonts, make sure that
    the licence with the respective font entitles you to do so. Generally, commercial
    licence agreements do not permit the storing of font software on a publicly accessible
    web server. This, however, is a prerequisite when using the `@font-face` rule.


    Currently, commercial font providers count on [web font embedding services](https://example.com).
    Only a few suppliers deliver special web font packages for storage on the customer''s
    own web server, among them FSI FontShop International and Fontspring.


    Once the web Open Font Format (WOFF) is accepted as a standard more font vendors
    might offer this service.


    ## Embedding Free and Open-Source Fonts


    Besides commercial fonts there''s a wide variety of freeware and open source fonts
    which you can embed in your web pages. A list with suitable fonts that are definitely
    free for use via @font-face embedding can be found on [webfonts.info](https://webfonts.info).


    Another huge collection of such fonts is offered by fontsquirrel.com. Furthermore,
    FONTSQUIRREL is the best address when it comes to converting desktop fonts into
    web font formats as it offers a powerful tool, the @font-face Kit Generator.


    ### Please note that the fonts you want to convert have to be legally eligible
    for web font embedding!


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_221_0.png)


    *Creating web fonts made easy by [Font Squirrel](https://fontsquirrel.com) generator.*


    ## Using the @font face Kit Generator


    For a practical test you might download the font package Graublau Sans Web. This
    font package offers a PostScript-based OpenType font that can actually be used
    on Safari 3.1 or higher, Firefox 3.5 or higher and Opera 10 or higher without
    any changes.


    In order to provide browser support for Internet Explorer and improve the screen
    display we''ll set the @font-face Kit Generator to work. Click the **Add Fonts**
    button and upload the respective font with all its weights. Choose the **Expert**
    radio button and check all the necessary options which we''ll go through in more
    detail now.


    ## Font Formats


    You have to activate **EOT** in order to obtain @font-face support on Internet
    Explorer (IE4 to IE8). Since IE9, WOFF is supported as well. SVG fonts will mainly
    be needed for Mobile Safari on the iPhone and iPad, although Chrome and Opera
    can handle this format as well. Alternatively or rather in addition to **SVG**
    there''s the compressed version **SVGZ**, which offers a much smaller file size.
    Unfortunately, it doesn''t run on the iPhone so you''ll need the SVG font anyway.


    Creating a **TrueType** font format will allow for support in Safari (since 3.1),
    Firefox (since 3.5) and Opera (since 10). Please note that this generator won''t
    create compressed EOT files. As a workaround **you can optimize the file size**
    by means of the tool [EOTfast](EOTFast).


    Checking the WOFF option won''t increase browser support these days, but it sure
    will in the near future, when WOFF has become the standard web font format.


    ## Rendering and Miscellaneous Options


    The option **Add Hinting** offers improved font display in Windows. You should
    only uncheck it, if you are absolutely positive that the respective fonts are
    screen-optimized already.


    **WebOnly™** adds specific modifications which allow browsers to use the modified
    fonts but avoid installation of these fonts on common operating systems. Checking
    this option helps to avoid unintended pirate copies.


    Desktop fonts may have a number of OpenType functions. As there''s little browser
    support for these functions today, you might want to remove them with this option
    (**rendering and miscellaneous options**). In order to keep some of the standard,
    i.e. already supported OpenType functions such as ligatures, you can activated
    the option **Keep OT Features**.


    Another possibility to reduce the file size is by checking the option **Remove
    Kerning** which will erase all [kerning](https://en.wikipedia.org/wiki/Kerning)
    values that are contained for specific letter combinations. In case you are going
    to use the font for body text this option is actually recommendable. For headlines
    it should be handled with care or not be done at all as the missing kerning values
    might lead to the unpleasant effect that the shape of words looks like a Swiss
    cheese.


    The option **Simplify Outlines** does exactly that: it tries to simplify the outline
    of characters. As this option reduces the quality of screen display it is not
    advisable to use it.


    Then, there''s the option **Build Cufón File** that isn''t directly part of the
    options for @font-face embedding. [How Cufón works](https://) is explained in
    a separate article in this e-book. For further details you can also check the
    [Cufón](https://) Web site.'
