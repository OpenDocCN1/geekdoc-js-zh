  md: "# Unicode Range And Language\n\n# Unicode Range\n\nThe `unicode-range` property\
    \ lets you define the **range of Unicode characters supported** by a given font,\
    \ rather than providing the complete range. This can be useful to restrict support\
    \ for a wide variety of languages or mathematical symbols, and thus reduce bandwidth\
    \ usage.\n\nImagine that you want to include some Japanese characters on your\
    \ page. Using the `font-face` rule, you can have multiple declarations for the\
    \ same font-family, each providing a different font file to download and a different\
    \ Unicode range (or even overlapping ranges). The browser should only download\
    \ the ranges needed to render that specific page. To see examples of how `unicode-range`\
    \ could work, head over to the [spec's draft page](link).\n\n# Language\n\nUse\
    \ the `:lang` pseudo-class to create **language-sensitive typography**. So, you\
    \ could have one background color for text set in French (`fr`) and another for\
    \ text set in German (`de`):\n\n```\ndiv:lang(fr) {\n    background-color: blue;\n\
    }\n\ndiv:lang(de) {\n    background-color: yellow;\n}\n```\n\nYou might be wondering\
    \ why we couldn't simply use an attribute selector and have something like the\
    \ following:"
  merge: -1
