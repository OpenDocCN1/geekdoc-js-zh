- md: ' # 10 Principles For Readable Web Typography


    By Matt Cronin


    Readability is one of the more important aspects of Web design usability. Readable
    text affects how users process the information in the content. Poor readability
    scares readers away from the content. On the other hand, done correctly, readability
    allows users to efficiently read and take in the information in the text. You
    want users to be able to read your content and absorb it easily.


    In this post, we''ll explain some **web typography terms** and how they play into
    **readability**; we''ll present numerous tips to help improve the readability
    of your content; and we''ll showcase very readable Web sites, layouts and articles.


    ## The Terms, And What Each Means For Readability


    There are many factors that play into the readability of text. There are also
    a number of terms, all very important. Here are a few of the more common web typography
    terms and an explanation of how each term affects readability.


    ### Hierarchy


    Every typographic layout needs the essential element of hierarchy. Hierarchy defines
    how to read through content. It shows the user where to start reading and where
    to read through. It differentiates headers from body text. Although colors of
    text boxes can be used to contrast headers and body text, hierarchy refers to
    the difference in size between these elements. Hierarchy plays a huge part in
    how scannable a layout is. It is an important technique that needs to be mastered
    to achieve readable web typography.


    > *UXBooth uses a very clean hierarchy to achieve readable web typography.*


    ## Contrast


    Contrast is the core factor in whether or not text is easy to read. Good contrasts
    will make text easy on the eyes, easy to scan quickly, and overall more readable.
    On the other hand, poor contrast will force the user to squint and make reading
    the body text almost painful, not to mention a lot slower.


    As shown in the following illustration, black on white is **very readable**. Black
    on white is obviously the standard contrast colors, and to achieve readable content
    it is good to stay in the range of black-on-white contrast.


    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse viverra,
    neque sit amet consectetur vestibulum, enim ipsum tristique est, id luctus risus
    neque ac dui. Donec pellentesque sodales ipsum. Aliquam erat volutpat.


    This one, however, pink on blue, is **nearly impossible to read**. This example
    may be a little extreme, but it shows how such an awful contrast can have a major
    impact on the text. You probably won''t see Web sites using such poor contrast,
    but it still shows why you need to be very smart about it.


    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse viverra,
    neque sit amet consectetur vestibulum, enim ipsum tristique est, id luctus risus
    neque ac dui. Donec pellentesque sodales ipsum. Aliquam erat volutpat.


    ## Line Height


    Line height is a very common term meaning the space between individual lines of
    text. Line height is another factor in the readability of body text and even headers.
    Sufficient line height is especially important in Web design because it makes
    the text ultimately more scannable. Line height that is too short will cause users
    to squint while reading. If it is too large, the text will seem like separate
    bodies instead of grouped together as one. You''ll find a rule of thumb for practical
    line heights in [this article](https://example.com).


    ## Letter Spacing


    Like line height, letter spacing affects readability in web typography. Letter
    spacing is, as the name suggests, the space between each letter in a word. In
    print layout, negative letter spacing is a common technique to add a more fun
    feel to the layout, but it should never be used in body text. In any text, letter
    spacing is an obvious factor in legibility.


    ## Line Length


    Line length is often overlooked in web typography but should not be. Line length
    is, of course, the number of words per line. A good line length is one that allows
    the reader''s eyes to flow from the end of one line to the beginning of the next
    very easily and naturally.


    ## The Keys to Readable Typography


    Achieving readability is relatively easy; all it takes is following a few key
    practices. A readable Web page can go a long way with your users, and readability
    has a huge impact on their experience. Designing for the web is all about making
    the user''s experience as pleasant as possible. Here are 9 tips that will help
    you work towards readability.


    ### 1. User-Friendly Headers


    Headers are a key element in typography, Web and print alike. As mentioned, they
    are part of the text hierarchy and a major factor in scannable content.


    First off, header size is just as important as the size of the body text. Going
    too big with the header with a large amount of content can throw the user off
    balance when reading and cause them to lose their spot. It will ultimately ruin
    the flow of the content and be a distraction. Headers that are too small will
    ruin the hierarchy of the article, too. If the header is too small, it will not
    draw the user''s attention as it should.


    As a next step it is important to provide ample space between the header and body
    text.


    ### 2. Scannable Text


    I have already mentioned "scannable" text many times, and you have surely heard
    it elsewhere. Scannable text goes hand in hand with readable text. Making copy
    scannable consists of good use of headers, hierarchy and focus points to guide
    the user through the content.


    So, what makes copy scannable? Well, there are many factors, most of which have
    already been mentioned. Header size and position, body text size, text line height,
    text contrast and the way focus points are differentiated all impact how scannable
    copy is.


    **Focus points** are certain elements or objects within the layout that attract,
    or are supposed to attract, the user''s attention. This could be a header, a graphical
    element, a button, etc.


    ### 3. White Space


    In content-heavy layouts, spacing contributes to the readability of content. White
    space helps to offset large amounts of text and helps the user''s eyes flow through
    the text. It also provides separation between elements in the layout, including
    graphics and text.


    In the example below, white space and only white space is used to separate text
    elements. The layout is very clean and efficient. The user''s eyes flow from text
    element to text element with ease, because of the large amounts of white space.


    ### 4. Consistency


    Consistency is often regarded as an important technique for usability, but it
    also applies to readability. Consistency in the hierarchy is important to a user-friendly
    layout. This means that all headers of the same importance in the hierarchy should
    be the same size, color and font. For example, all `<h1>` headers in an article
    should look identical. Why? This consistency provides users with a familiar focus
    point when they are scanning, and it helps to organize the content.


    ### 5. Density of Text


    Density of text refers to the amount of words you place in one area. Density of
    content has a major impact on your content''s readability. Density is affected
    by spacing options such as line height, letter spacing and text size. If you find
    a balance between all of these so that the content is neither too compact nor
    too widely spaced, you will have perfect density that is both readable and scannable.


    ### 6. Emphasis of Important Elements


    Another key factor is emphasis of certain elements within the body content. This
    includes highlighting links, bolding important text and showing quotes. As mentioned,
    focus points are essential in web typography. By emphasizing these objects, you
    provide focus points for the user. These points and objects help break up monotonous
    text.


    Scannable text is extremely important. By providing these focus points, you make
    the body text extremely scannable. Bolding key lines of text immediately attracts
    the user''s eye and is therefore a very important element in presenting important
    information. Pictured below is an article from UXBooth. This article uses bolding
    and italics to point out important information in the article.'
