- img_proc: true
  md: 'Unfortunately, it''s not as simple as just picking fonts that are very, very
    different — placing our candy cane font next to, say, Garamond or Caslon does
    not guarantee us typographic harmony. Often, as in the above example of Helvetica
    and Bembo, there''s no real explanation for why two faces complement each other
    — they just do.


    But if we want some principle to guide our selection, it should be this: often,
    two typefaces work well together if they have one thing in common but are otherwise
    greatly different. This shared common aspect can be visual (similar [x-height](link)
    or [stroke weight](link)) or it can be chronological. Typefaces from the same
    period of time have a greater likelihood of working well together... and if they
    are by the same designer, all the better.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_116_0.png)


    # ## 4. A Little Can Go a Long Way


    ''Enough with all these conventional-looking fonts and rules!'' you say. ''I need
    something for my rave flyer! And my Thai restaurant menu! And my'
