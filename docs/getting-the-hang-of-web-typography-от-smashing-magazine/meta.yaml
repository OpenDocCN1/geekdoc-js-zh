    # ## 5. Widows and Orphans


    A [**widow**](https://en.wikipedia.org/wiki/Widows_and_orphans) is a short line
    or single word at the end of a paragraph. An orphan is a word or short line at
    the beginning or end of a column that is separated from the rest of the paragraph.
    Widows and Orphans create awkward rags, interrupt the reader''s eye and affect
    readability. They can be avoided by adjusting the type size, leading, measure,
    wordspacing, letterspacing or by entering manual line breaks.


