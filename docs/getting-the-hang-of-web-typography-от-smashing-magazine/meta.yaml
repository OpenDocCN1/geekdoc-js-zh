  - '[PAGE 134]


    Both Helvetica Neue and Garamond have distinct yet neutral personalities, and
    they can weave complex layouts together and around each other because we''ve maintained
    a strict visual hierarchy. Planning rules and following them, with the right typefaces,
    can yield great results with a minimum of effort.


    # Use Different Point Sizes


    We saved one of the simplest principles for last: use different point sizes to
    **create contrast and distinction.**


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_134_0.png)


    In the example on the left, the heading and body copy bleed together into an unsightly
    blob of text. Use the squint method mentioned above and look at the left example.
    While still squinting, look at the right and notice the dramatic difference even
    though it''s blurry!'
  - '[PAGE 135]


    On the right, we have the same two fonts, but in different sizes. TheMix Italic
    has been bumped up significantly, while New Century Schoolbook has been decreased
    to a legible, yet more complimentary size.


    Using different point sizes helps **distinguish the typographic hierarchy** and
    increase the variety of typographic color.


    # In Conclusion


    The fact that there are no hard and fast rules about combining typefaces can make
    **the process of making good choices time-consuming** and maybe even a little
    exhausting. But it’s also nice to have a handy set of principles, as well as an
    understanding of certain typographic situations to avoid, to guide the process
    as quickly as possible to a pleasant typographic result.'
  - '[PAGE 136]


    # Guide to CSS Font Stacks: Techniques and Resources


    By *Cameron Chapman*


    CSS Font stacks are one of those things that elude a lot of designers. Many stick
    to the basic stacks Dreamweaver auto-recommends or go even more basic by just
    specifying a single web-safe font.


    But doing either of those things means you''re missing out on some great typography
    options. Font stacks can make it possible to show at least some of your visitors
    your site''s typography exactly the way you intend without showing everyone else
    a default font. Read on for more information on using and creating effective font
    stacks with CSS.


    # Creating Your Own Font Stacks


    There are a huge variety of font stacks recommended. It seems every designer has
    their own favorites, what they consider to be the "ultimate" font stack. While
    there is no definitive font stack out there, there are a few things to keep in
    mind when using or creating your own stacks.


    First of all, make sure you always include a generic font family at the end of
    your font stacks. This way, if for some strange reason the person visiting your
    site has virtually no fonts installed, at least they won''t end up looking at
    everything in Courier New. Second, there''s a basic formula to creating a good
    font stack: ''Preferred Font'', ''Next best thing'', ''Something common and sorta
    close'', ''Similar Web-safe'', ''Generic font''. There''s nothing wrong with having
    more than one font for any of those, but try to keep your font stack reasonably
    short (six to ten fonts is a pretty good maximum number).'
  - '[PAGE 137]


    Third, make sure you pay attention to the scale of the fonts in your stack. One
    common thing I see in font stacks is the inclusion of Verdana and Arial or Helvetica
    in the same stack.


    Verdana is a very wide font; Arial is relatively narrow. In effect, this can make
    your site''s typography appear very differently to different visitors. The same
    goes for Times New Roman (narrow) and Georgia (wide).


    Considering both Arial/Helvetica and Verdana are considered web-safe (same goes
    for Times/Times New Roman and Georgia), it doesn''t make much sense to include
    both.


    # ## Common Font Stacks


    A lot of designers out there have taken a crack at creating ideal font stacks.
    While I have yet to see an "ultimate" font stack, there are plenty of really great
    ones out there to choose from if you don''t want to take the time to create your
    own custom stacks.


    # ### Better CSS Font Stacks


    Unit Interactive published an article last summer with a collection of "better"
    CSS font stacks. The list is extensive, with font stacks that should satisfy just
    about anyone.


    Fonts are listed out according to whether they''re appropriate for headlines or
    body content.


    Here are some listed for body text:


    +   - Baskerville, ''Times New Roman'', Times, serif

    - Garamond, ''Hoefler Text'', ''Times New Roman'', Times, serif'
  - '[PAGE 138]


    +   - Geneva, ''Lucida Sans'', ''Lucida Grande'', ''Lucida Sans Unicode'', Verdana,
    sans-serif

    - GillSans, Calibri, Trebuchet, sans-serif


    Garamond, ''Hoefler Text'',

    ''Times New Roman'', Times,

    serif


    # For headlines:


    +   - Georgia, Times, ''Times New Roman'', serif

    - Palatino, ''Palatino Linotype'', ''Hoefler Text'', Times, ''Times New Roman'',
    serif

    - Tahoma, Verdana, Geneva

    - Trebuchet, Tahoma, Arial, sans-serif


    Trebuchet, Tahoma,

    Arial, sans-serif


    And a few that are balanced for **either body or headline text**:


    +   - Impact, Haettenschweiler, ''Arial Narrow Bold'', sans-serif

    - Cambria, Georgia, Times, ''Times New Roman'', serif

    - ''Copperplate Light'', ''Copperplate Gothic Light'', serif

    - Futura, ''Century Gothic'', AppleGothic, sans-serif


    Futura, ''Century Gothic'',

    AppleGothic, sans-serif'
  - '[PAGE 139]


    # 8 Definitive Web Font Stacks


    This article from Sitepoint written by Michael Tuck lists eight font stacks that
    are supposed to be the ultimate stacks for any application. It''s based on a basic
    formula of: ''exact font'', ''nearest alternative'', ''platform-wide alternative(s)'',
    ''universal (cross-platform) choice(s)'', generic. My biggest issues with some
    of these font stacks is their length; is it really necessary to include 17 different
    fonts in a single font stack? I don''t think so...


    The font stacks:


    +   - The Times New Roman-based serif stack: Cambria, ''Hoefler Text'', Utopia,
    ''Liberation Serif'', ''Nimbus Roman No9 L Regular'', Times, ''Times New Roman'',
    serif

    - A Modern Georgia-based serif stack: Constantia, ''Lucida Bright'', Lucidabright,
    ''Lucida Serif'', Lucida, ''DejaVu Serif'', ''Bitstream Vera Serif'', ''Liberation
    Serif'', Georgia, serif

    - A more traditional Garamond-based serif stack: ''Palatino Linotype'', Palatino,
    Palladio, ''URW Palladio L'', ''Book Antiqua'', Baskerville, ''Bookman Old Style'',
    ''Bitstream Charter'', ''Nimbus Roman No9 L'', Garamond, ''Apple Garamond'', ''ITC
    Garamond Narrow'', ''New Century Schoolbook'', ''Century Schoolbook'', ''Century
    Schoolbook L'', Georgia, serif

    - The Helvetica/Arial-based sans serif stack: Frutiger, ''Frutiger Linotype'',
    Univers, Calibri, ''Gill Sans'', ''Gill Sans MT'', ''Myriad Pro'', Myriad, ''DejaVu
    Sans Condensed'', ''Liberation Sans'', ''Nimbus Sans L'', Tahoma, Geneva, ''Helvetica
    Neue'', Helvetica, Arial, sans-serif

    - The Verdana-based sans serif stack: Corbel, ''Lucida Grande'', ''Lucida Sans
    Unicode'', ''DejaVu Sans'', ''Bitstream Vera Sans'', ''Liberation Sans'', Verdana,
    ''Verdana Ref'', sans-serif'
  - '[PAGE 140]


    +   - The Trebuchet-based sans serif stack: ''Segoe UI'', Candara, ''Bitstream
    Vera Sans'', ''DejaVu Sans'', ''Bitsream Vera Sans'', Trebuchet MS, Verdana, Verdana
    Ref, sans-serif

    - The heavier "Impact" sans serif stack: Impact, Haettenschweiler, ''Franklin
    Gothic Bold'', Charcoal, ''Helvetica Inserat'', ''Bitstream Vera Sans Bold'',
    ''Arial Black'', sans-serif

    - The Monospace stack: Consolas, ''Andale Mono WT'', ''Andale Mono'', ''Lucida
    Console'', ''Lucida Sans Typewriter'', ''DejaVu Sans Mono'', ''Bitstream Vera
    Sans Mono'', ''Liberation Mono'', ''Nimbus Mono L'', Monaco, ''Courier New'',
    Courier, monospace


    # ## The Myth of ''Web-Safe'' Fonts


    [The ''Myth of Web-Safe'' Fonts](https://example.com) from Safalra.com offers
    up five simple, straightforward font stacks for web typography. These stacks are
    pretty bare-bones as far as most recommended font stacks go, but they''re perfectly
    adequate for many applications, as well as being a good starting point for building
    your own stacks.


    The ''wide'' sans serif stack: Verdana, Geneva, sans-serif


    The ''narrow'' sans serif stack: Tahoma, Arial, Helvetica, sans-serif


    The ''wide'' serif stack: Georgia, Utopia, Palatino, ''Palatino Linotype'', serif


    The ''narrow'' serif stack: ''Times New Roman'', Times, serif


    The monospace stack: ''Courier New'', Courier, monospace'
- md: " ## Tools\n\n## Font Matrix\n\nFont Matrix is a font comparison tool that lists\
    \ fonts bundled with Windows XP, Windows Vista, Mac OS X Tiger, Mac OS X Leopard,\
    \ Microsoft Office (2003, 2007 and 2004 for Mac) and the Adobe Creative Suite.\
    \ The chart shows which software bundles and operating systems come with which\
    \ fonts, so you can get a good idea of how common a particular font might be.\
    \ This is an incredibly valuable tool for those looking to create their own custom\
    \ font stacks.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_141_0.png)\n\n## Complete\
    \ Guide to Pre-Installed Fonts in Linux, Mac and Windows\n\nHere's another chart\
    \ that shows the fonts commonly installed on Linux, Mac and Windows machines,\
    \ grouped together by family and similarity. It's another really valuable tool\
    \ for font stack creators.\n\n| Installed with MS Programs | Mac OS 10.4 | Ubuntu\
    \ (Linux) |\n| --- | --- | --- |\n| Baskerville Old Face | Baskerville | MgOpen\
    \ Canonica |\n| Bookman Old Style | Hoefler Text | URW Bookman L |\n| | Georgia\
    \ | Georgia |\n| Century Schoolbook | | Century Schoolbook L |\n| | New York |\
    \ |\n| | | Bitstream Vera Serif |\n\n## Typechart\n\nTypechart shows you web-safe\
    \ and common fonts and suggests different sizes and styles for headings, paragraphs,\
    \ and other typographic elements. There are a ton of different browsing options,\
    \ and you can preview the way fonts will look on both Windows and Mac machines\
    \ before downloading the CSS. The only drawback to Typechart is that it only includes\
    \ a handful of fonts: Arial/Helvetica, Cambria, Georgia, Lucida Grande, Lucida\
    \ Sans Unicode, Trebuchet MS, and Verdana.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_142_0.png)\n\
    \n## Typetester\n\nTypetester lets you try out up to three fonts side-by-side.\
    \ This can be a great way to test font stacks to see what the differences will\
    \ be as the stacks degrade. You can use any font on your system, though it does\
    \ categorize fonts by web safe, Windows default, and Mac default, making it easier\
    \ to create stacks without other reference materials.\n\n## Font Stack Builder\n\
    \nCode Style offers the Font Stack Builder for creating font stacks based on font\
    \ family, and whether the fonts are generally installed on Windows, Mac or Linux\
    \ machines. You can add as many fonts as you want and it will show you a grid\
    \ with how common those fonts are on different kinds of machines.\n\n## New Typographic\
    \ Possibilities with CSS 3\n\nBy Inayaili de León\n\nThere has been an increasing\
    \ and sincere interest in typography on the web over the last few years. Most\
    \ Web sites rely on text to convey their messages, so it's not a surprise that\
    \ text is treated with utmost care. In this article, we'll look at some useful\
    \ techniques and clever effects that use the power of style sheets and some features\
    \ of the upcoming CSS Text Level 3 specification, which should give Web designers\
    \ finer control over text.\n\nKeep in mind that these **new properties and techniques\
    \ are either new** or still in the works, and some of the most popular browsers\
    \ do not yet support them. But we feel it's important that you, as an informed\
    \ and curious Web designer, know what's around the corner and are able to experiment\
    \ in your projects.\n\n## A Glance At The Basics\n\nOne of the most common CSS-related\
    \ mistakes made by budding Web designers is creating inflexible style sheets that\
    \ have **too many classes and IDs** and that are difficult to maintain.\n\nLet's\
    \ say you want to change the color of the headings in your posts, keeping the\
    \ other headings on your Web site in the default color.\n\nRather than add the\
    \ class `big-red` to each heading, the sensible approach would be to take advantage\
    \ of the `DIV` class that wraps your posts (probably `post`) and create a selector\
    \ that targets the heading you wish to modify, like so:\n\n```\n.post h2 {\n \
    \ font-weight: bold;\n  color: red;\n}\n```\n\nThis is just a quick reminder that\
    \ there is no need to add classes to everything you want to style with CSS, especially\
    \ text. **Think simple**.\n\n## The Font Property\n\nInstead of specifying each\
    \ property separately, you can do it all in one go using the font shorthand property.\
    \ The order of the properties should be as follows: `font-style`, `font-variant`,\
    \ `font-weight`, `font-size`, `line-height`, `font-family`.\n\nWhen using the\
    \ font shorthand, any values not specified **will be replaced by their parent\
    \ value**. For example, if you define only `12px Helvetica, Arial, sans-serif`,\
    \ then the values for `font-style`, `font-variant` and `font-weight` will be set\
    \ as `normal`.\n\nThe font property can also be used to **specify system fonts**:\
    \ `caption`, `icon`, `menu`, `message-box`, `small-caption`, `status-bar`. These\
    \ values will be based on the system in use, and so will vary according to the\
    \ user's preferences.\n\n## Other Font Properties\n\nA few font-related properties\
    \ and values are not as commonly used. For example, instead of using `text-transform`\
    \ to turn your text into all caps, you could use `font-variant: small-caps` for\
    \ a more elegant effect.\n\nYou could also be very specific about the [weight\
    \ of your fonts](https://example.com), instead of using the common `regular` and\
    \ `bold` properties. CSS allows you to specify font weight with values from `100`\
    \ to `900` (i.e. `100`, `200`, `300`, etc.). If you decide to use these, know\
    \ that the `400` value represents the `normal` weight, while `700` represents\
    \ `bold`. If a font isn't given a weight, it will default to its parent weight.\n\
    \nAnother useful property, sadly supported only in Firefox for now, is `font-size-adjust`,\
    \ which allows you to specify an aspect ratio for when a fallback font is called.\
    \ This way, if the substitute font is smaller than the preferred one, the text's\
    \ x-height will be preserved. A good explanation of how `font-size-adjust` works\
    \ can be found on [the W3C](https://w3.org) Web site.\n\n## Dealing With White\
    \ Space, Line Breaks And Text Wrapping\n\nSeveral CSS properties deal with these\
    \ issues, but the specs are still in the works (at the \"Working Draft\" stage).\n\
    \n## White Space\n\nThe `white-space` property lets you specify a combination\
    \ of properties for which it serves as a shorthand: [`white-space-collapsing`](https://example.com)\
    \ and [`text-wrap`](https://example.com). Here's a breakdown of what each property\
    \ stands for:\n\n- `normal`\n  - white-space-collapsing: collapse/text-wrap: normal\n\
    - `pre`\n  - white-space-collapsing: preserve/text-wrap: none\n- `nowrap`\n  -\
    \ white-space-collapsing: collapse/text-wrap: none\n- `pre-wrap`\n  - white-space-collapsing:\
    \ preserve/text-wrap: normal\n- `pre-line`\n  - white-space-collapsing: preserve-breaks/text-wrap:\
    \ normal\n\nThis property can be useful if you want to, for example, **display\
    \ snippets of code** on your Web site and preserve line breaks and spaces. Setting\
    \ the container to `white-space: pre` will preserve the formatting.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_147_0.png)\n\
    \n*The use of nowrap in the WordPress backend.*\n\nWordPress uses `white-space:\
    \ nowrap` on its dashboard so that the numbers indicating posts and comments don't\
    \ wrap if the table cell is too small.\n\n## Word Wrap\n\nOne property that is\
    \ already well used is `word-wrap`. It supports one of two values: `normal` and\
    \ `break-word`. If you set `word-wrap` to `break-word` and a word is so long that\
    \ it would overflow the container, it is broken at a random point so that it wraps\
    \ within the container.\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_148_0.png)\n\
    \n*The International Gorilla Conservation Programme Web site uses `word-wrap`\
    \ for its commenters' names.*\n\nIn theory, `word-wrap: break-word` should only\
    \ be allowed when `text-wrap` is set to either `normal` or `suppress` (which suppresses\
    \ line breaking). But in practice and for now, it works even when `text-wrap`\
    \ is set to something else.\n\nBear in mind that according to the specification,\
    \ the `break-strict` value for the `word-break` property is at risk of being dropped.\n\
    \n## Word And Letter Spacing\n\nTwo other properties that are often used are `word-spacing`\
    \ and `letter-spacing`. You can use them to control—you guessed it—the spacing\
    \ between words and letters, respectively. Both properties support three different\
    \ values that represent optimal, minimum and maximum spacing."
  mdcn: "\n ## 工具\n\n## 字体矩阵\n\n字体矩阵（Font Matrix）是一款字体对比工具，它列出了 Windows XP、Windows\
    \ Vista、Mac OS X Tiger、Mac OS X Leopard、Microsoft Office（2003、2007 和 Mac 2004\
    \ 版）以及 Adobe Creative Suite 所捆绑的字体。该图表展示了哪些软件包和操作系统附带哪些字体，因此你可以很好地了解某个特定字体的普遍程度。对于那些希望创建自定义字体栈的人来说，这是一个极其宝贵的工具。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_141_0.png)\n\n## Linux、Mac 和 Windows\
