    # ### HTML Text


    HTML text undoubtedly accounts for the majority of text found on the web. Until
    recently, designers had absolutely no control over anti-aliasing with client-side
    technologies. CSS 3 introduces two new ways to control how HTML text is delivered:
    font-smooth and @font-face.'
- md: ' ## font-smooth


    Font-smooth allows you to control when smoothing is used but not how it''s used;
    the anti-aliasing method is still controlled by the user''s environment. This
    setting is not widely supported yet but may prove give useful by allowing us to
    turn anti-aliasing off at small point sizes — where type often becomes blurry.
    It may become doubly useful when more complex and non-browser-safe fonts are embedded
    with the new @font-face rule.


    ## @font-face


    The @font-face rule is an exciting new feature of CSS 3 that designers have been
    waiting years for. Although we''ve been able to add obscure typefaces to font
    stacks for quite some time, a large majority of users don''t have high-end fonts
    on their local machines and end up with a typical Web-safe font (e.g. Times New
    Roman substituted for_URL_dim Pro).


    By allowing the browser to import a font file from a URL, we can now serve the
    user any font we''d like without relying on their font library. This means that
    we can serve not only more unique fonts but also those that are better hinted
    and more legible.


    Despite the promise this feature holds to create a more beautiful world of online
    typography, we may still see designers opt for fonts like Verdana, which have
    been designed and hinted specifically for on-screen viewing. Some of our favorite
    fonts from the print world **just look bad** when rendered on the screen, especially
    at smaller text sizes.


    Surely we''ll see new industry segments arise as a result of the support of @font-face,
    including an influx of browser-hinted typefaces made available through services
    such as [typekit](https://typekit.com).


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_11_0.png)


    Bickham Script Pro embedded using @font-face and rendered in Safari 4 and Firefox
    3. Notice the OpenType swashes and ligatures supported in Firefox 3!


    ## Text as Image


    Serving text as an image may have limited uses, but it allows you to fine-tune
    every letter if necessary. Photoshop provides five pre-set anti-alias settings,
    which determine pixel values using different algorithms in conjunction with the
    document''s pixel grid. Unfortunately, **none of these settings allow for subpixel
    rendering**, but by using the Free Transform option to nudge the layer''s position,
    you can effectively force the algorithms into rendering cleaner.


    Each setting allows a different amount of origins, and some only produce variations
    when translated along the x-axis. Below is a table of available transformations.


    | | X-TRANSLATIONS | Y-TRANSLATIONS |

    |---|---|---|

    | NONE | 1 | 1 |

    | SHARP | 2 | 1 |

    | CRISP | 4 | 1 |

    | STRONG | 32 | 16 |

    | SMOOTH | 4 | 4 |

    | SHAPE LAYER | 32 | 32 |


    ## None


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_12_0.png)


    Aliased text, created using the None setting, has a very limited use and typically
    looks best between point sizes of 9 and 18. Sizes lower than this range will result
    in unidentifiable characters, and larger sizes will lead to increased character
    weight and overly jagged edges. Depending on the font, **sometimes two different
    point sizes will render at the same height, causing a shift in letter spacing,
    width and x-height.**


    For example, 14pt Arial renders 10 pixels high with an x-height of 8 pixels. Arial
    at 13pts also sits 10 pixels high but has an x-height of only 7 pixels – a slight
    but very perceivable difference. When tightly tracked, this setting may also require
    manual kerning, because some letters will sit pixel to pixel against each other.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_13_0.png)


    *13pt and 14pt Arial render with the same cap height but different x-heights.*


    ## Sharp


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_13_1.png)


    The Sharp setting uses very tight grid-fitting and produces sharp, if not too
    sharp, type. The plotting of pixels with this setting is very similar to how the
    None setting plots them but allows for a certain degree of smoothing. In fact,
    if pixels are set atop one another, you can actually see that a majority of solid
    pixels carry over from None to Sharp.


    While the cap height and x-height typically remain the same, you might see an
    increase in character weight and width.


    **Note** that Sharp has a tendency to completely cut subtle shape variations from
    rendering and sometimes causes inconsistent letterforms, so if typeface integrity
    is important to you, you may want to try a different setting.


    ## Crisp


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_14_0.png)


    The Crisp setting maintains much of the font''s original weight and curvature
    but cleans up some of the awkward pixels created by light serifs and thin strokes
    — which is especially useful for larger point sizes.


    With the Crisp setting, however, you sacrifice the ability to nudge the layer
    on the y-axis.


    ## Strong


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_14_1.png)


    The *Strong* setting is notorious for adding unnecessary weight to a typeface,
    but it provides the most freedom with translating the origin, with 32 x-axis variations
    and 16 on the y-axis.


    The variety of origins with this setting can come in very handy when working with
    complex letterforms. *Strong* may also be useful when working with a typeface
    that has very thin strokes.


    [Subtle animation](#) showing the 32 anti-aliasing origins at *36pt*, *[18pt](#)*
    and *[12pt](#)*.


    ## Smooth


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_15_0.png)


    The Smooth setting is the closest to unhinted anti-aliasing and therefore **remains
    truest to the original glyph shape**. This algorithm is best used on medium-sized
    to large type, because it tends to render very light and often blurry at smaller
    point sizes. If used with an appropriate typeface at a proper size and if the
    origin is properly adjusted, this setting can produce a beautiful balance between
    crispness and letterform fidelity.


    ## Shape Layer


    If Photoshop''s hinted algorithms all produce undesirable results, you may want
    to attempt using unhinted anti-aliasing by way of converting the type to a shape
    layer. This allows you access to the original outlines of the font, which draw
    values based on the percentage of the pixel enclosed in the shape. What you sacrifice
    in editable type, you make up for in origin transformations: 32 on both the x-
    and y-axes. Though usually a last resort, don''t rule out the possibility of using
    a Shape Layer; it can often produce much better results than Photoshop''s algorithms.


    ## Fractional Widths


    Another, more veiled, setting that sometimes helps with anti-aliasing type at
    small point sizes is the Fractional Widths option located in the Character palette''s
    fly-out menu. With this setting turned on, the character spacing is set to varying
    fractions of pixels. This is ideal for auto-kerned type at large sizes but tends
    to bump the type either too close together or too far apart at smaller sizes.
    Turning this option off will round all character spacing to whole pixel values,
    which may help better space the problematic type. This is a hit-or-miss option,
    so use it wisely.


    ## Decimal Point Sizes


    Typophiles might cringe at the idea of using a decimal point size, but when designing
    for digital media, standard point sizes don''t always conform to the pixel grid.
    By using decimal point sizes and either the Smooth or Strong anti-alias setting,
    you can usually bring a blurry typeface back into focus. Please note that I am
    not condoning the use of vertical or horizontal scale!


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_16_0.png)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_16_1.png)


    Using decimal values can dramatically improve anti-aliasing results, as seen above.
    Top: 16pt Goudy Oldstyle with Strong Anti-Aliasing. Bottom: 16.5pt Goudy Oldstyle
    with Strong Anti-Aliasing.


    ## sIFR Text


    Using sIFR to replace headers with a block of Flash brings benefits beyond the
    obvious. Yes, it solves the problem of having to use CSS image replacement techniques
    to provide a wider array of fonts, but it also allows incredible control over
    how the type is anti-aliased. Particularly useful are'
  mdcn: "\n ## font-smooth\n\nFont-smooth 允许你控制何时使用平滑效果，但无法控制具体如何实现；抗锯齿方法仍然由用户环境控制。该设置目前尚未被广泛支持，但可能会很有用，因为它允许我们在小字号时关闭抗锯齿——此时文字往往会变得模糊。当使用新的\
    \ @font-face 规则嵌入更复杂的、非浏览器安全字体时，它可能会变得更加有用。\n\n## @font-face\n\n@font-face 规则是\
    \ CSS 3 的一项令人兴奋的新特性，设计师们已经等待了多年。虽然我们已经能够将不太常见的字体加入字体栈相当长的时间了，但绝大多数用户本地机器上并没有高端字体，最终只能显示典型的网页安全字体（例如用\
    \ Times New Roman 替代 *URL_dim Pro*）。\n\n通过允许浏览器从 URL 导入字体文件，我们现在可以向用户提供任何我们想要的字体，而无需依赖他们的字体库。这意味着我们不仅可以提供更具独特性的字体，还可以提供那些提示信息更好、更易读的字体。\n\
    \n尽管这一特性有望创造更美好的在线排版世界，但我们可能仍会看到设计师选择 Verdana 等专为屏幕观看设计和提示的字体。一些我们最喜欢的印刷世界字体在屏幕上渲染时**看起来非常糟糕**，尤其是在较小的文字尺寸下。\n\
    \n我们肯定会看到新的行业细分市场因 @font-face 的支持而出现，包括通过 [typekit](https://typekit.com) 等服务提供的大批浏览器提示字体的涌入。\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_11_0.png)\n\n使用 @font-face 嵌入的 Bickham\
    \ Script Pro，在 Safari 4 和 Firefox 3 中渲染的效果。注意 Firefox 3 中支持的 OpenType 花饰和连字！\n\
    \n## Text as Image\n\n将文字作为图片提供可能用途有限，但它允许你在必要时微调每一个字母。Photoshop 提供了五种预设的抗锯齿设置，这些设置使用不同的算法结合文档的像素网格来确定像素值。不幸的是，**这些设置都不支持子像素渲染**，但通过使用自由变换选项来调整图层位置，你可以有效地强制算法渲染得更清晰。\n\
    \n每种设置允许不同数量的原点，有些只在沿 x 轴平移时产生变化。以下是可用变换的表格。\n\n| | X 轴平移 | Y 轴平移 |\n|---|---|---|\n\
    | 无 | 1 | 1 |\n| 锋利 | 2 | 1 |\n| 清晰 | 4 | 1 |\n| 强 | 32 | 16 |\n| 平滑 | 4 | 4 |\n\
    | 形状图层 | 32 | 32 |\n\n## 无\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_12_0.png)\n\
    \n使用\"无\"设置的锯齿文字用途非常有限，通常在 9 到 18 磅之间效果最好。小于此范围的字号会导致无法辨认的字符，而更大的字号则会导致字符笔画加粗和边缘过度锯齿化。根据字体的不同，**有时两个不同的磅值会渲染出相同的高度，导致字间距、宽度和\
    \ x 高度发生变化。**\n\n例如，14 磅的 Arial 渲染高度为 10 像素，x 高度为 8 像素。13 磅的 Arial 同样是 10 像素高，但\
    \ x 高度只有 7 像素——一个细微但可察觉的差异。当紧密排列时，此设置可能还需要手动字距调整，因为某些字母会像素对像素地紧贴在一起。\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_13_0.png)\n\
    \n*13 磅和 14 磅的 Arial 渲染出相同的大写高度，但 x 高度不同。*\n\n## 锋利\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_13_1.png)\n\
    \n\"锋利\"设置使用非常紧的网格贴合，产生锐利——如果不是过于锐利——的文字效果。此设置的像素绘制方式与\"无\"设置非常相似，但允许一定程度的平滑。事实上，如果将像素重叠放置观察，你会发现大部分实心像素从\"\
    无\"到\"锋利\"是保持不变的。\n\n虽然大写高度和 x 高度通常保持不变，但可能会看到字符笔画和宽度有所增加。\n\n**注意**，\"锋利\"有一种倾向，会完全切除细微的形状变化，有时会导致不一致的字形，因此如果字体完整性对你很重要，你可能想要尝试不同的设置。\n\
    \n## 清晰\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_14_0.png)\n\n\"清晰\"设置保留了字体的大部分原始笔画和曲率，但清理了一些由细衬线和细笔画产生的尴尬像素——这对于较大的字号尤其有用。\n\
    \n然而，使用\"清晰\"设置时，你将失去在 y 轴上微调图层的能力。\n\n## 强\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_14_1.png)\n\
    \n*强*设置因给字体增加不必要的笔画而臭名昭著，但它提供了最大的原点平移自由度，x 轴有 32 种变化，y 轴有 16 种。\n\n此设置的多种原点在处理复杂字形时非常有用。*强*设置在处理笔画非常细的字体时也可能有用。\n\
    \n[微妙的动画](#)展示了 *36 磅*、*[18 磅](#)* 和 *[12 磅](#)* 时的 32 种抗锯齿原点。\n\n## 平滑\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_15_0.png)\n\
    \n\"平滑\"设置最接近未提示的抗锯齿，因此**最能保持原始字形**。该算法最适合用于中号到大号的文字，因为它往往在较小的字号时渲染得过轻且模糊。如果在适当的字体、合适的字号以及正确调整原点的情况下使用，此设置在清晰度和字形保真度之间能产生美丽的平衡。\n\
    \n## 形状图层\n\n如果 Photoshop 的提示算法都产生了不理想的结果，你可能想尝试通过将文字转换为形状图层来使用未提示的抗锯齿。这使你可以访问字体的原始轮廓，这些轮廓根据形状所包含像素的百分比来绘制数值。你在可编辑文字方面做出的牺牲，将在原点变换中得到弥补：x\
    \ 轴和 y 轴都有 32 种。虽然通常是最后的手段，但不要排除使用形状图层的可能性；它往往能产生比 Photoshop 算法好得多的结果。\n\n## 分数宽度\n\
    \n另一个有时有助于小字号抗锯齿的、更为隐藏的设置是位于字符面板弹出菜单中的\"分数宽度\"选项。开启此设置后，字符间距会设置为不同的像素分数值。这对于大字号时的自动字距调整是理想的，但在较小字号时往往会使文字间距过近或过远。关闭此选项会将所有字符间距舍入为整数像素值，这可能有助于更好地排版有问题的文字。这是一个碰运气的选项，所以要明智地使用。\n\
    \n## 小数磅值\n\n字体爱好者可能会对小数磅值的想法感到不寒而栗，但在为数字媒体设计时，标准磅值并不总是符合像素网格。通过使用小数磅值以及\"平滑\"\
    或\"强\"抗锯齿设置，你通常可以让模糊的字体重现清晰。请注意，我并不赞成使用垂直或水平缩放！\n\n![](img/45c2114e61862fb7d9e9d1d966d826ec_16_0.png)\n\
    \n![](img/45c2114e61862fb7d9e9d1d966d826ec_16_1.png)\n\n如上图所示，使用小数值可以显著改善抗锯齿效果。上图：16\
    \ 磅 Goudy Oldstyle，强抗锯齿。下图：16.5 磅 Goudy Oldstyle，强抗锯齿。\n\n## sIFR 文字\n\n使用 sIFR\
    \ 将标题替换为 Flash 模块带来的好处远不止显而易见的那些。是的，它解决了必须使用 CSS 图像替换技术来提供更丰富字体选择的问题，但它还允许对文字的抗锯齿方式进行难以置信的控制。特别有用的是\n"
