    # Text as Image


    Serving text as an image may have limited uses, but it allows you to fine-tune
    every letter if necessary. Photoshop provides five pre-set anti-alias settings,
    which determine pixel values using different algorithms in conjunction with the
    document''s pixel grid. Unfortunately, **none of these settings allow for subpixel
    rendering**, but by using the Free Transform option to nudge the layer''s position,
    you can effectively force the algorithms into rendering cleaner.


    Each setting allows a different amount of origins, and some only produce variations
    when translated along the x-axis. Below is a table of available transformations.'
