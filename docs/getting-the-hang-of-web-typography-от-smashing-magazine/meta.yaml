    \ Imaging](https://www.monotypeimaging.com) 推出的新业务，而 Monotype Imaging 是网络上最大的字体分销商。Fonts.com\
    \ 目前拥有迄今为止最大的网页字体选择，字体数量超过 7,500 种。\n"
