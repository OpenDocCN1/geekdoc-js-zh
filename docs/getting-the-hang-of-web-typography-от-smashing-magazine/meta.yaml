    AS THE world awaits the next wave of the swine flu pandemic, delays plague vaccine
    production. Now new, faster-growing strains of the vaccine virus could speed up
    the process.


    The first batches of pandemic vaccine were made in early August. After testing
    is completed, the rate of vaccination will depend on how fast the vaccine virus
    can be grown in chicken eggs. So far even the best strains have grown disappointingly
    slowly, at half the rate of ordinary flu vaccine strains. The US admitted late
    last week that it will have only 45 million doses of vaccine by mid-October, compared
    with the 120 million it originally forecast.


    Now researchers at the New York Medical College in Valhalla have created improved
    strains by growing one sample of the virus repeatedly in chicken eggs until it
    adapted and grew faster. They will send two to vaccine manufacturers this week,
    says John Wood of the UK''s National Institute for Biological Standards and Control
    (NIBSC).


    *The New Scientist* has 20 pixels of spacing between paragraphs.


    # 7. How Many Characters Per Line?


    According to a classic rule of web typography, 55 to 75 is an optimal number of
    characters per line. Surprisingly, our study shows that most Web sites have a
    higher number. We counted how many characters could fit on one line using the
    design''s default font size. The result, which is an average of 88.74 characters
    per line (maximum), is extremely high. Of course, this maximal number is different
    from the average number of characters per line, which in general ranges between
    75 and 85 characters per line. Still, the range is way above the conventional
    range — quite peculiar.'
  - '[PAGE 102]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_102_0.png)


    Between 73 and 90 characters per line is a popular choice among designers, yet
    we also found outliers: Monocle (47 characters per line) and Boxes and Arrows
    (125 characters per line). To get a more exact reading for each Web site, you
    would need to take an average character count from multiple lines.


    # ## Other Findings


    46% of Web sites underlined the links in their body copy, while the others highlighted
    only with color or a bold font weight. 6% of Web sites used some kind of image
    replacement for headings or body copy (e.g. Monocle, New Yorker, Newsweek). 96%
    of Web sites do not justify text.


    Web sites gave their text a left padding of on average 11.7 pixels (counting from
    the left content area border).'
