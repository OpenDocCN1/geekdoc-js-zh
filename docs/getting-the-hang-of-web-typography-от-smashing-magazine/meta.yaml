    AS THE world awaits the next wave of the swine flu pandemic, delays plague vaccine
    production. Now new, faster-growing strains of the vaccine virus could speed up
    the process.


    The first batches of pandemic vaccine were made in early August. After testing
    is completed, the rate of vaccination will depend on how fast the vaccine virus
