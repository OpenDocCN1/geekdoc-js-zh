    # # Typographic Design Patterns and Best Practices


    *By Michael Martin*


    Even with a relatively limited set of options in CSS, typography can vary tremendously
    using pure CSS syntax. Serif or sans-serif? Large or small font? Line height,
    spacing, font size and padding… The list goes on and on.


    To find typographic design patterns that are common in modern Web design and to
    resolve some common typographic issues, we conducted extensive research on 50
    popular Web sites on which typography matters more than usual (or at least should
    matter more than usual). We''ve chosen popular newspapers, magazines and blogs
    as well as various typography-related Web sites.


    We''ve carefully analyzed their typography and style sheets and searched for similarities
    and differences. We have also put together a spreadsheet of the study that displays
    the Web sites'' various values (for example, the ratio between the line height
    and line length).


    # ## General Typographic Problems and Issues


    Ultimately, we identified **13** general typographic problems and issues related
    to typographic design and tried to find answers to them through our research:


    +   1. How popular are serif and sans-serif typefaces in body copy and headlines?

    2. Which fonts are used most frequently?'
  - '[PAGE 87]


    +   3. What is the average font size?

    4. What is the average ratio between the font size of headlines and body copy?

    5. What is the average line height of body copy?

    6. What is the average ratio between line height and font size in body copy?

    7. What is the average ratio between line height and line length in body copy?

    8. What is the average amount of spacing between paragraphs?

    9. What is the average ratio of paragraph spacing to line height in body copy?

    10. How are links styled?

    11. How many characters per line are common in body copy?

    12. How often are links underlined?

    13. How often is font replacement (sIFR, etc.) used?


    We ended up with solid data, which we evaluated and prepared for this article.
    Based on the statistics, we have identified several “rules of thumb” for working
    with type. Please note that these rules can often, but not always, be considered
    best practice.


    # 1. Serif vs. Sans-serif


    Whether designers should use serif or sans-serif fonts for body copy is one of
    the most discussed and unresolved questions about typesetting on the web. Some
    designers prefer to give their headlines serifs (which are short,'
  - '[PAGE 88]


    decorative lines at the end of letter strokes) to give them more appeal. The main
    reason to choose a serif font for your headlines is that, at a large size, serif
    fonts are easy to read and look great. The contrast between a serif font for headlines
    and a sans-serif font for body copy can be interesting, too.


    Some designers prefer serif fonts for body copy because they believe the lines
    at the end of letter strokes help guide readers from one letter to the next, making
    scanning and reading more comfortable.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_88_0.png)


    According to our study, sans-serif fonts are still more popular than serif fonts
    for headlines, although they seem to have dropped in popularity in recent years.


    60% of Web sites use sans-serif typefaces for headlines, mostly Arial, Verdana,
    Lucida Grande and Helvetica. Among them: CNN, ArsTechnica, Slate, BBC and NewScientist.'
