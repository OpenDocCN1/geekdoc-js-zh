    # HOUSE OF THAI


    OPEN MON-FRI, 8-12. MAJOR CREDIT CARDS ACCEPTED


    # APPETIZERS


    +   - Satay $5.99

    - Fried Shrimp $6.99

    - Spring Rolls $6.50


    # NOODLES


    +   - Pad Thai $9.50

    - Pad See-Yew $10.99

    - Rad Nah Noodles $9.50


