  - "[PAGE 64]\n\nThese posters have a very well-defined structure. It definitely\
    \ feels like tabular data, and tabular data is one such case that the disposition\
    \ of the information extrapolates the realm of graphic layout and starts hinting\
    \ on the meaning of data and how various chunks of data relate to each other.\n\
    \nThe abuse of tables as structural elements was, and still is, very harmful to\
    \ web accessibility. However, blindly replacing tables for div tags does not help\
    \ to make code more semantic. List elements are a great solution for collections\
    \ of similar data, but ULs and OLs do not define any kind of relation between\
    \ this data.\n\n# Enter Definition Lists\n\nDefinition List (DL) is probably one\
    \ of the most underestimated HTML elements. It's a list element such as UL and\
    \ OL, but it is supposed to present a collection of terms (DT) and descriptions\
    \ (DD). Its most obvious use case is to represent dictionaries, but its potential\
    \ goes way beyond that. The W3C Recommendation gives the example of a dialogue\
    \ where DTs are character names and DDs are the text lines. It could also be used\
    \ to represent calendars (days and assignments), articles summaries (titles and\
    \ descriptions) and much more.\n\n```\n<dl>\n  <dt>Coffee</dt>\n    <dd>- black\
    \ hot drink</dd>\n  <dt>Milk</dt>\n    <dd>- white cold drink</dd>\n</dl>\n```"
  - '[PAGE 65]


    # Elementary


    There is also a direct influence from the constructivism, elementarism and minimalism
    movements in the Swiss Style artists. Minimal design is about removing the unnecessary
    and emphasizing the necessary; it''s about a functional and simple use of fundamental
    elements of style for the purpose of the artist''s objectives.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_65_0.png)


    This principle is one of the core reasons why Swiss Style graphic designers pay
    so much attention to type. Typeface is one of the most fundamental elements of
    visual communication that is able to deliver the message in a very precise, clear
    way.


    According to the Swiss movement, **adding more elements without fully exploring
    the potential of the fundamental ones** can be considered a ''waste''. As these
    basic elements, like typography, have so much aesthetic potential, there''s rarely
    a need for other visual graphics elements.'
  - '[PAGE 66]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_66_0.png)'
  - '[PAGE 67]


    In many aspects, these ideas touch on the core proposals of the De Stijl movement.
    The neoplasticism, as proposed by De Stijl artists, is about elementarism and
    geometry not only as a form of exploring the potential of the fundamental elements,
    but as a pursuit of beauty and harmony, hinting on a more mystical belief in ''ideal''
    geometric forms.


    # Drop the Serif (...or rather don''t)


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_67_0.png)


    One of the strongest characteristics of the Swiss style typography is the use
    of [sans-serif](https://example.com) typefaces such as Akzidenz Grotesk and Neue
    Haas Grotesk (a.k.a Helvetica).


    In fact, when Jan Tschichold wrote „Die neue Typographie", he ignored any use
    of non sans-serif typefaces. With this philosophy, graphic designers were aiming
    at clarity, simplicity and universality. Helvetica, for instance, is a typeface
    that is famous for its pervasiveness: it is used in corporate identity,'
  - '[PAGE 68]


    street signs, magazines and pretty much everywhere else. The Swiss Style advocates
    that the typeface does not have to be expressive in itself, it must be an unobtrusive
    instrument of expression.


    > "I don''t think that type should be expressive at all. I can write the word
    ‘dog’ with any typeface and it doesn''t have to look like a dog. But there are
    people that [think that] when they write ‘dog’ it should bark."


    **Massimo Vignelli** in the documentary *Helvetica*.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_68_0.png)'
  - '[PAGE 69]


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_69_0.png)'
  - '[PAGE 70]


    This is by no means a rigid rule. When Swiss Style graphic designers advocate
    the use of sans-serif typefaces, they weren''t paying attention to the historical
    legacy and experimented with something new. Even Jan Tschichold himself admitted
    that his book was too rigid. If there''s one single lesson from the Swiss Style
    it is to love and respect typefaces.


    # Font-size as a tool for readability, impact and rythm


    It''s very common to spot the use of font-size contrast in the works of the Swiss
    Style.


    ![](img/45c2114e61862fb7d9e9d1d966d826ec_70_0.png)


    Different font-sizes not only generate visual impact, but also provide readers
    with a hint about the hierarchy of the presented data. Huge words are the entry
    points, the top-level elements in the content''s information architecture and
    page''s hierarchy. This is a very efficient way of guiding the reader''s eyes
    through the page, thus working as an interface to the content.'
  - '[PAGE 71]


