    # New Typographic Possibilities with CSS 3


    By Inayaili de León


    There has been an increasing and sincere interest in typography on the web over
    the last few years. Most Web sites rely on text to convey their messages, so it''s
    not a surprise that text is treated with utmost care. In this article, we''ll
    look at some useful techniques and clever effects that use the power of style
    sheets and some features of the upcoming CSS Text Level 3 specification, which
    should give Web designers finer control over text.


    Keep in mind that these **new properties and techniques are either new** or still
    in the works, and some of the most popular browsers do not yet support them. But
    we feel it''s important that you, as an informed and curious Web designer, know
    what''s around the corner and are able to experiment in your projects.


    # A Glance At The Basics


    One of the most common CSS-related mistakes made by budding Web designers is creating
    inflexible style sheets that have **too many classes and IDs** and that are difficult
    to maintain.


    Let''s say you want to change the color of the headings in your posts, keeping
    the other headings on your Web site in the default color.


    Rather than add the class `big-red` to each heading, the sensible approach would
    be to take advantage of the `DIV` class that wraps your posts (probably `post`)
    and create a selector that targets the heading you wish to modify, like so:'
  - "[PAGE 145]\n\n```\n.post h2 {\n  font-weight: bold;\n  color: red;\n}\n```\n\n\
    This is just a quick reminder that there is no need to add classes to everything\
    \ you want to style with CSS, especially text. **Think simple**.\n\n# The Font\
    \ Property\n\nInstead of specifying each property separately, you can do it all\
    \ in one go using the font shorthand property. The order of the properties should\
    \ be as follows: `font-style`, `font-variant`, `font-weight`, `font-size`, `line-height`,\
    \ `font-family`.\n\nWhen using the font shorthand, any values not specified **will\
    \ be replaced by their parent value**. For example, if you define only `12px Helvetica,\
    \ Arial, sans-serif`, then the values for `font-style`, `font-variant` and `font-weight`\
    \ will be set as `normal`.\n\nThe font property can also be used to **specify\
    \ system fonts**: `caption`, `icon`, `menu`, `message-box`, `small-caption`, `status-bar`.\
    \ These values will be based on the system in use, and so will vary according\
    \ to the user's preferences.\n\n# Other Font Properties\n\nA few font-related\
    \ properties and values are not as commonly used. For example, instead of using\
    \ `text-transform` to turn your text into all caps, you could use `font-variant:\
    \ small-caps` for a more elegant effect."
  - "[PAGE 146]\n\nYou could also be very specific about the [weight of your fonts](https://example.com),\
    \ instead of using the common `regular` and `bold` properties. CSS allows you\
    \ to specify font weight with values from `100` to `900` (i.e. `100`, `200`, `300`,\
    \ etc.). If you decide to use these, know that the `400` value represents the\
    \ `normal` weight, while `700` represents `bold`. If a font isn't given a weight,\
    \ it will default to its parent weight.\n\nAnother useful property, sadly supported\
    \ only in Firefox for now, is `font-size-adjust`, which allows you to specify\
    \ an aspect ratio for when a fallback font is called. This way, if the substitute\
    \ font is smaller than the preferred one, the text's x-height will be preserved.\
    \ A good explanation of how `font-size-adjust` works can be found on [the W3C](https://w3.org)\
    \ Web site.\n\n# Dealing With White Space, Line Breaks And Text Wrapping\n\nSeveral\
    \ CSS properties deal with these issues, but the specs are still in the works\
    \ (at the \"Working Draft\" stage).\n\n# White Space\n\nThe `white-space` property\
    \ lets you specify a combination of properties for which it serves as a shorthand:\
    \ [`white-space-collapsing`](https://example.com) and [`text-wrap`](https://example.com).\
    \ Here's a breakdown of what each property stands for:\n\n+   - `normal`\n  -\
    \ white-space-collapsing: collapse/text-wrap: normal\n- `pre`\n  - white-space-collapsing:\
