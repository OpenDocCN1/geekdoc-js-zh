    \n### 相对于其他服务的优势\n\n适合精通网页字体排印来龙去脉的自助设计师和开发者。\n\n### 优点\n\n价格低廉。显示网页字体时无明显延迟。\n\
    \n### 缺点\n\n你必须提供自己的字体。需要对字体许可协议有扎实的理解。\n\n### 定价\n\n免费方案提供 1 种字体和每天 500 次请求。付费方案从每月\
    \ $5（澳元）起，包含 10 种托管字体和每天 5000 次请求。所有付费方案均提供 30 天试用。\n\n### 收费方式\n\n月度订阅\n\n###\
