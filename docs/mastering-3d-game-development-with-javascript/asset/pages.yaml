    # Reducing Draw Calls


    A draw call occurs when the GPU is instructed to render an object. Each draw call
    has overhead, so reducing the number of draw calls can greatly enhance performance.
    Here are some tips:


    +   1. **Batching Draw Calls**: Grouping similar objects together can reduce the
    number of draw calls. For example, you can batch together all objects that share
    the same material.


    +   2. **Use Texture Atlases**: Combine multiple textures into a single texture
    atlas. This allows you to map different parts of the atlas to different objects,
    minimizing the number of material switches.


    ```

    javascript

    Copy code

    const textureAtlas = new THREE.TextureLoader().load(''path/to/atlas.png'');

    const material = new THREE.MeshBasicMaterial({ map: textureAtlas });

    ```


    +   1. **Use Frustum Culling**: Implement frustum culling to avoid rendering objects
    that are not visible to the camera. Three.js does this automatically for mesh
    objects, but ensure that your models are appropriately set up with bounding boxes.


    # Level of Detail (LOD) Techniques'
