  md: '# 3. Identifying Performance Bottlenecks


    +   1. Profile Render Calls: Check how many draw calls are being made each frame.
    Too many draw calls can degrade performance. Combine geometries or use texture
    atlases to minimize draw calls.


    +   2. Reduce Polygon Count: High polygon counts can slow rendering. Use level
    of detail (LOD) techniques to load lower-polygon models for distant objects.


    +   3. Optimize Textures: Large texture sizes can impact performance. Use compressed
    textures where possible and ensure they’re appropriately sized for their use case.


    # 4. Memory Profiling


    Memory leaks can significantly affect game performance. Use the Memory tab in
    Chrome Developer Tools to track memory usage.


    +   - Heap Snapshot: Take heap snapshots to identify memory usage over time. Compare
    snapshots to detect memory leaks.


    +   - Garbage Collection: Monitor how frequently garbage collection occurs and
    ensure that you’re properly disposing of objects that are no longer needed in
    your game.


