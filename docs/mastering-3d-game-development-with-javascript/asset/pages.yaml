    # Adding a Cube to the Scene


    Now that we have a scene, camera, and renderer, it''s time to add a basic 3D object—a
    cube. In Three.js, objects are created using geometries and materials.


    +   - Geometries define the shape of an object (e.g., a cube, sphere, plane).


    +   - Materials define how the surface of an object looks (e.g., color, texture,
    reflectivity).


    Let''s create a cube using the BoxGeometry class and give it a simple material.


    ```

    javascript

    Copy code


    // Create a cube geometry (width, height, depth)

    const geometry = new THREE.BoxGeometry(1, 1, 1);


    // Create a basic material and set its color

    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });


    // Create a mesh by combining the geometry and material

    const cube = new THREE.Mesh(geometry, material);

    ```'
