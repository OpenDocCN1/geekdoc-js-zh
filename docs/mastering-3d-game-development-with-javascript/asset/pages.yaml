  md: '# Chapter 1: Introduction to 3D Graphics


    he world of 3D graphics is one of the most fascinating areas in game development.
    It is where artists, developers, and engineers collaborate to create immersive
    environments that captivate the imagination of players. In this chapter, we''ll
    introduce some of the fundamental concepts of 3D graphics, helping you understand
    how digital objects are created, manipulated, and rendered in a game world. We
    will start by exploring the concept of 3D rendering, the cornerstone of all visual
    elements in 3D games. Then, we will discuss the basics of 3D coordinate systems
    and how objects are positioned in a virtual space. We will also dive into key
    geometric structures, including vertices, edges, and faces, which form the building
    blocks of all 3D models. Finally, we''ll look at how game engines handle 3D rendering,
    physics, and other elements necessary to bring a 3D game to life.


    What is 3D Rendering?


    At its core, 3D rendering is the process of converting 3D models into 2D images.
    These images are then displayed on the screen, creating the illusion of depth
    and a three-dimensional space. In the simplest terms, rendering is the act of
    taking a 3D scene and turning it into something that can be viewed by the player.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'This process involves simulating how light interacts with objects, calculating
    the position and perspective of the camera, and finally, generating an image pixel
    by pixel.


    # The Rendering Pipeline


    Rendering in modern 3D graphics involves a series of steps that are often referred
    to as the rendering pipeline. This pipeline is a sequence of processes that transform
    raw 3D data into the 2D images seen on the screen. The pipeline typically includes
    the following stages:


    +   1. Vertex Processing: This is the stage where the positions of vertices (points
    in 3D space) are transformed into screen coordinates based on the camera''s perspective.
    During this phase, lighting calculations are also performed.


    +   2. Clipping: In this stage, objects that are outside the camera''s view are
    removed from the rendering process to save computational resources. This step
    helps optimize performance by only rendering what the player can actually see.


    +   3. Rasterization: Once the 3D scene is prepared, it is converted into a series
    of pixels in a process known as rasterization. This step converts the mathematical
    representation of objects into a pixel-based image.


    +   4. Fragment Processing: In this stage, the color of each pixel is determined
    based on the material properties of the object, lighting conditions, shadows,
    reflections, and other effects.


    +   5. Output Merging: The final image is assembled, combining the colors, textures,
    and effects calculated in previous stages to create the final rendered frame.


    Rendering is a computationally expensive process, and performance optimization
    is crucial, especially in real-time applications like video games. Game engines
    often implement techniques such as culling'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'removing objects not visible to the camera and level of detail (LOD) (adjusting
    the complexity of distant objects) to maintain high frame rates while rendering
    complex scenes.


    # Basics of 3D Coordinate Systems


    In order to render 3D objects, it is essential to understand the concept of a
    coordinate system. A 3D coordinate system provides a way to describe the position
    of objects in three-dimensional space. The most common system used in 3D graphics
    is the Cartesian coordinate system, which is defined by three axes:


    +   - X-Axis: Represents the horizontal direction (left-right).

    - Y-Axis: Represents the vertical direction (up-down).

    - Z-Axis: Represents depth (forward-backward).


    These three axes intersect at a point called the origin (0, 0, 0), which serves
    as the reference point for all positions in the 3D space.


    Right-Handed vs. Left-Handed Coordinate Systems


    3D engines can use either a right-handed or a left-handed coordinate system, which
    defines the positive direction of the Z-axis.


    +   - In a right-handed coordinate system, if you curl the fingers of your right
    hand around the Y-axis, with your thumb pointing in the positive Y direction,
    your fingers will point in the positive Z direction. This means that positive
    Z values represent depth into the scene.


    +   - In a left-handed coordinate system, the positive Z direction points toward
    the camera. This is the system used by engines like DirectX, while OpenGL and
    Three.js use the right-handed system.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Knowing which coordinate system your game engine uses is important when importing
    models manipulating objects, as it affects how objects are positioned and viewed
    in 3D space.


    # World, Local, and Camera Space


    When working with 3D models, it''s helpful to understand the different types of
    coordinate spaces used in rendering:


    +   1. **World Space**: This is the global coordinate system that defines the
    position of objects in the entire scene relative to the world origin. Every object
    in the game is positioned within this world space.

    2. **Local Space**: Each 3D object also has its own local coordinate system. This
    system defines the position of vertices and parts of the object relative to the
    object''s origin, which may differ from the world origin. For example, a character''s
    arm moves relative to the character''s body, not the entire game world.

    3. **Camera Space**: This space is relative to the camera, which means that all
    objects are positioned based on their relation to the camera''s viewpoint. The
    closer an object is to the camera in Z-space, the larger it appears on the screen.


    Understanding these spaces helps developers control the movement and transformation
    of objects in 3D games, ensuring that they behave correctly when interacting with
    the player, the camera, and other elements in the scene.


    # Understanding Vertices, Edges, and Faces


    All 3D objects, from the simplest cube to the most detailed character model, are
    made up of basic geometric components: vertices, edges, and faces.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Vertices


    A vertex is a point in 3D space, defined by its coordinates (X, Y, Z). Vertices
    are the most fundamental unit of a 3D model, serving as the endpoints of lines
    and the corners of polygons. In more complex models, vertices also hold information
    such as color, texture coordinates, and normal vectors (which define the direction
    a surface is facing).


    # Edges


    An edge is a straight line that connects two vertices. Edges define the shape
    of a 3D object by forming the outline of polygons, which are the building blocks
    of the model. While edges are not rendered directly in most games, they are crucial
    for defining the structure of a 3D object.


    # Faces


    A face is a flat surface that is enclosed by edges. In 3D modeling, faces are
    typically polygons, and the most common type of polygon used in games is the triangle.
    Triangles are favored because they are the simplest polygon and always lie in
    3D space, making them easier to process and render. More complex shapes can be
    approximated by combining multiple triangles to create the illusion of smooth
    curves and detailed surfaces.


    When multiple triangles are connected, they form a mesh, which is a collection
    of vertices, edges, and faces that together define the shape of a 3D object. The
    more vertices a mesh has, the more detailed it can be, but this also increases
    the computational cost of rendering.


    # How Game Engines Handle 3D


    Game engines are the backbone of modern 3D game development. They provide the
    tools, libraries, and frameworks needed to manage rendering, physics, input handling,
    and other game-related tasks. A game'
  merge: -1
