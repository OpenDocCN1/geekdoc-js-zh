  md: '# Basic Scene Creation


    Every Three.js application starts with a scene, a camera, and a renderer. These
    are the core components that make up the foundation of any 3D environment. Let''s
    break them down:


    +   - **Scene**: This is where all your 3D objects, lights, and cameras live.
    Think of it as the virtual world in which your game or application takes place.


    +   - **Camera**: The camera defines what part of the scene is visible to the
    user. There are different types of cameras, but for now, we''ll use the most common
    one: the *PerspectiveCamera*.


    +   - **Renderer**: The renderer takes the scene and the camera and renders them
    into a 2D image that can be displayed on the screen.


    Creating a Scene, Camera, and Renderer


    Let''s start by creating a basic Three.js setup that includes a scene, a camera,
    and a renderer. We''ll also set the background color of the scene to make it more
    visually distinct.


    ```

    javascript

    Copy code


    // Import Three.js (skip this line if you''re using a CDN)

    import * as THREE from ''three'';


    // Create a scene

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87CEEB); // Set the background color (light
    blue sky)

    ```'
  merge: -1
