    # Chapter 5: Building Interactive Elements


    In the realm of 3D game development, interactivity is crucial for engaging players
    and creating immersive experiences. This chapter will delve into the key aspects
    of building interactive elements in your 3D game using Three.js. We will cover
    handling user input through mouse and keyboard controls, adding clickable elements,
    creating basic animations, and introducing the concept of physics, particularly
    focusing on basic collision detection.


    # Handling User Input: Mouse and Keyboard Controls


    Interactivity begins with user input. In a 3D environment, users typically interact
    through mouse and keyboard controls. Three.js provides an easy way to capture
    and respond to these inputs, allowing you to create responsive and engaging gameplay.


    Mouse Controls


    You can capture mouse movements and clicks using the MouseEvent object. To track
    the mouse position, you need to update a global variable whenever the mouse moves.
    You can then use this position to interact with objects in your scene.'
- md: "\n```javascript\nlet mouse = new THREE.Vector2();\nlet raycaster = new THREE.Raycaster();\n\
    \nfunction onMouseMove(event) {\n  // Convert the mouse position to normalized\
    \ device coordinates\n  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;\n\
    \  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;\n}\n\nwindow.addEventListener('mousemove',\
    \ onMouseMove, false);\n```\n\nWith the mouse position captured, you can use Raycaster\
    \ to detect which objects are intersected by the mouse ray. This is essential\
    \ for implementing clickable objects.\n\n- Keyboard Controls\n\nTo capture keyboard\
    \ input, you can listen for keydown and keyup events. This allows you to perform\
    \ actions based on specific key presses.\n\n```javascript\nlet keys = {};\n```\n\
    \nfunction keyDown(event) {\n  keys[event.code] = true; // Mark the key as pressed\n\
    }\n\nfunction onKeyUp(event) {\n  keys[event.code] = false; // Mark the key as\
    \ released\n}\n\nwindow.addEventListener('keydown', keyDown, false);\nwindow.addEventListener('keyup',\
    \ onKeyUp, false);\n\nIn your animation loop, you can check the state of keys\
    \ to perform actions like moving an object or triggering animations.\n\n```javascript\n\
    function animate() {\n  requestAnimationFrame(animate);\n\n// Move an object based\
    \ on keyboard input\nif (keys['ArrowUp']) {\n  object.position.z -= 0.1; // Move\
    \ forward\n}\nif (keys['ArrowDown']) {\n  object.position.z += 0.1; // Move backward\n\
    \nrenderer.render(scene, camera);\n}\nanimate();\n```\n\n# Adding Clickable Objects\n\
    \nWith the input handling set up, the next step is to create clickable objects.\
    \ This adds a layer of interactivity, allowing players to engage with your game\
    \ world meaningfully.\n\n## Creating Clickable Objects\n\nTo create clickable\
    \ objects, you can use the Raycaster we discussed earlier. When a user clicks\
    \ on the canvas, you can check if the click intersects any objects in your scene.\n\
    \n```javascript\nfunction onClick(event) {\n  // Update the mouse variable with\
