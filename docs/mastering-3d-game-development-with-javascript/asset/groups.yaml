- md: "\nKnowing which coordinate system your game engine uses is important when importing\
    \ models manipulating objects, as it affects how objects are positioned and viewed\
    \ in 3D space.\n\n## World, Local, and Camera Space\n\nWhen working with 3D models,\
    \ it's helpful to understand the different types of coordinate spaces used in\
    \ rendering:\n\n- 1. **World Space**: This is the global coordinate system that\
    \ defines the position of objects in the entire scene relative to the world origin.\
    \ Every object in the game is positioned within this world space.\n- 2. **Local\
    \ Space**: Each 3D object also has its own local coordinate system. This system\
    \ defines the position of vertices and parts of the object relative to the object's\
    \ origin, which may differ from the world origin. For example, a character's arm\
    \ moves relative to the character's body, not the entire game world.\n- 3. **Camera\
    \ Space**: This space is relative to the camera, which means that all objects\
    \ are positioned based on their relation to the camera's viewpoint. The closer\
    \ an object is to the camera in Z-space, the larger it appears on the screen.\n\
    \nUnderstanding these spaces helps developers control the movement and transformation\
    \ of objects in 3D games, ensuring that they behave correctly when interacting\
    \ with the player, the camera, and other elements in the scene.\n\n## Understanding\
    \ Vertices, Edges, and Faces\n\nAll 3D objects, from the simplest cube to the\
    \ most detailed character model, are made up of basic geometric components: vertices,\
    \ edges, and faces.\n\n## Vertices\n\nA vertex is a point in 3D space, defined\
    \ by its coordinates (X, Y, Z). Vertices are the most fundamental unit of a 3D\
    \ model, serving as the endpoints of lines and the corners of polygons. In more\
    \ complex models, vertices also hold information such as color, texture coordinates,\
    \ and normal vectors (which define the direction a surface is facing).\n\n## Edges\n\
    \nAn edge is a straight line that connects two vertices. Edges define the shape\
    \ of a 3D object by forming the outline of polygons, which are the building blocks\
    \ of the model. While edges are not rendered directly in most games, they are\
    \ crucial for defining the structure of a 3D object.\n\n## Faces\n\nA face is\
    \ a flat surface that is enclosed by edges. In 3D modeling, faces are typically\
    \ polygons, and the most common type of polygon used in games is the triangle.\
    \ Triangles are favored because they are the simplest polygon and always lie in\
    \ 3D space, making them easier to process and render. More complex shapes can\
    \ be approximated by combining multiple triangles to create the illusion of smooth\
    \ curves and detailed surfaces.\n\nWhen multiple triangles are connected, they\
    \ form a mesh, which is a collection of vertices, edges, and faces that together\
    \ define the shape of a 3D object. The more vertices a mesh has, the more detailed\
    \ it can be, but this also increases the computational cost of rendering.\n\n\
    ## How Game Engines Handle 3D\n\nGame engines are the backbone of modern 3D game\
    \ development. They provide the tools, libraries, and frameworks needed to manage\
    \ rendering, physics, input handling, and other game-related tasks. A game engine\
    \ abstracts many of the complexities involved in 3D rendering, allowing developers\
    \ to focus on designing and building their games rather than worrying about low-level\
    \ graphics programming.\n\n## Rendering with Game Engines\n\nMost game engines,\
    \ such as Unity, Unreal Engine, and Three.js, handle rendering through a combination\
    \ of hardware (GPU) and software (the engine's rendering pipeline). As we discussed\
    \ earlier, rendering is a complex process that transforms 3D models into 2D images\
    \ that can be displayed on the screen. Game engines optimize this process by implementing\
    \ techniques such as Frustum culling (removing objects outside the camera's view)\
    \ and back-face culling (not rendering the backside of polygons that are not visible\
    \ to the player).\n\n## Lighting and Shading\n\nOne of the most important aspects\
    \ of rendering is how light interacts with objects in the scene. Game engines\
    \ handle this through various lighting models that simulate how light behaves\
    \ in the real world. Shading is the process of calculating how light affects the\
    \ appearance of surfaces, and it plays a crucial role in making objects look realistic.\n\
    \n- Flat shading: Each face of an object is given a single color, making the object\
    \ appear angular and faceted.\n- Smooth shading: Colors are interpolated across\
    \ a face, making the object appear smooth and rounded.\n- Phong shading: A more\
    \ advanced technique that calculates lighting per-pixel, resulting in realistic\
    \ lights and reflections.\n\nGame engines also support advanced lighting techniques\
    \ such as global illumination, which simulates how light bounces off surfaces\
    \ and creates realistic lighting effects in the entire scene.\n\n## Physics Simulation\n\
    \nGame engines also manage **physics simulation**, which ensures that objects\
    \ behave realistically in the game world. This includes simulating gravity, collisions,\
    \ and other forces that affect the movement and interaction of objects. Many engines\
    \ come with built-in physics engines (such as Unity's PhysX or Babylon.js's Cannon.js),\
    \ which handle these calculations automatically.\n\nPhysics engines use mathematical\
    \ models to approximate the behavior of real-world objects. For example, they\
    \ might simulate how a ball bounces when it hits the ground, or how a car skids\
    \ when it takes a sharp turn. Physics engines also handle **collision detection**,\
    \ ensuring that objects don't pass through each other and that interactions, such\
    \ as shooting or jumping, are realistic.\n\n## Chapter 2: Getting Started with\
    \ Three.js\n\nThree.js is one of the most popular libraries for creating 3D graphics\
    \ in JavaScript. It provides an easy-to-use interface over WebGL, which is a low-level\
    \ graphics API built into modern browsers. By using Three.js, you can create complex\
    \ 3D scenes without dealing with the intricacies of WebGL, making it a fantastic\
    \ tool for developers of all skill levels. In this chapter, we will guide you\
    \ through setting up Three.js, creating your first 3D scene, and understanding\
    \ how to manage the render loop. By the end of this chapter, you will have a working\
    \ 3D environment and a basic cube rendered on the screen.\n\n### Installing and\
    \ Setting Up Three.js\n\nBefore we can start creating 3D scenes, we need to set\
    \ up Three.js in our development environment. There are a few ways to include\
    \ Three.js in your project, depending on whether you prefer using CDN (Content\
    \ Delivery Network), downloading the library directly, or installing it via npm\
    \ (Node Package Manager).\n\n### Method 1: Using a CDN\n\nThe easiest way to get\
    \ started with Three.js is by including it from a CDN. A CDN hosts the library\
    \ files on a remote server, and you can link to them directly in your HTML file.\
    \ This method requires no installation and is perfect for beginners.\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n  \
    \  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
    \    <title>Three.js Setup</title>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r135/three.min.js\"\
    ></script>\n</head>\n<body>\n    <script>\n        // Your Three.js code will\
    \ go here\n    </script>\n</body>\n</html>\n```\n\nSimply copy and paste the above\
    \ code into an HTML file, and you're ready to go. You can now begin writing Three.js\
    \ code within the <script> tag.\n\n### Method 2: Installing via npm\n\nIf you're\
    \ using a build tool like Webpack or Parcel, you can install Three.js via npm.\
    \ This method is preferred for more complex projects, as it allows for better\
    \ dependency management and modular code. First, initialize your project using\
    \ npm:\n\n```bash\nnpm init -y\n```\n\nThen, install Three.js:\n\n```bash\nnpm\
    \ install three\n```\n\nOnce installed, you can import Three.js in your JavaScript\
    \ file:\n\n```javascript\nimport * as THREE from 'three';\n```\n\nNow that we\
    \ have Three.js set up, we can move on to creating our first 3D scene.\n"
  mdcn: "\n在导入模型和操作对象时，了解你的游戏引擎使用的坐标系非常重要，因为它会影响对象在 3D 空间中的定位和查看方式。\n\n## 世界空间、局部空间和相机空间\n\
    \n在处理 3D 模型时，理解渲染中使用的不同类型空间非常有帮助：\n\n- 1. **世界空间 (World Space)**：这是全局坐标系，定义了对象相对于世界原点在整个场景的位置。游戏中的每个对象都位于这个世界空间内。\n\
    - 2. **局部空间 (Local Space)**：每个 3D 对象都有自己的局部坐标系。该系统定义了对象顶点和部分相对于对象原点的位置，这可能与世界原点不同。例如，角色的手臂相对于角色身体移动，而不是相对于整个游戏世界。\n\
    - 3. **相机空间 (Camera Space)**：此空间相对于相机，这意味着所有对象的位置根据它们与相机视点的关系来确定。对象在 Z 空间中离相机越近，在屏幕上显示越大。\n\
    \n理解这些空间可以帮助开发者控制 3D 游戏中对象的移动和变换，确保它们在与玩家、相机以及场景中其他元素交互时表现正常。\n\n## 理解顶点、边和面\n\
    \n所有 3D 对象，从简单的立方体到复杂的角色模型，都是由基础几何组件组成的：顶点、边和面。\n\n## 顶点 (Vertices)\n\n顶点是 3D\
    \ 空间中的一点，由其坐标 (X, Y, Z) 定义。顶点是 3D 模型最基本的单元，作为线的端点多边形的角。在复杂的模型中，顶点还带有颜色、纹理坐标和法向量（定义表面朝向）等信息。\n\
    \n## 边 (Edges)\n\n边是连接两个顶点的直线。边通过形成多边形的轮廓来定义 3D 对象的形状，多边形是模型的构建块。虽然大多数游戏中并不直接渲染，但它们对于定义\
    \ 3D 对象的结构至关重要。\n\n## 面 (Faces)\n\n面是由边围成的平面。在 3D 建模中，面通常是多边形，游戏中最常用的多边形类型是三角形。三角形三角形是因为是最简单的多边形，且始终位于\
    \ 3D 空间中，使其更容易处理和渲染。更复杂的形状可以通过组合多个三角形来近似，从而营造平滑曲线和细节表面的幻觉。\n\n当多个三角形连接在一起时，它们形成一个网格\
    \ (mesh)，网格是顶点、边和面的集合，共同定义 3D 对象的形状。网格顶点越多，细节越丰富，但也增加了渲染的计算成本。\n\n## 游戏引擎如何处理\
    \ 3D\n\n游戏引擎是现代 3D 游戏开发的支柱。它们提供了管理渲染、物理、输入处理和其他与游戏相关的任务所需的工具、库和框架。游戏引擎抽象了 3D 渲染涉及的许多复杂性，让开发者能够专注于设计和构建游戏，而无需担心低级图形程序编写。\n\
    \n## 使用游戏引擎进行渲染\n\n大多数游戏引擎（如 Unity、Unreal Engine 和 Three.js）通过硬件（GPU）和软件（引擎的渲染管线）相结合来处理渲染。正如我们之前讨论的，渲染是将\
    \ 3D 模型转换为可以在屏幕上显示的 2D 图像的复杂过程。游戏引擎通过实现技术优化这一过程，例如视锥剔除（移除相机视野之外的对象）和背面剔除（不渲染玩家可见的多边形背面）。\n\
    \n## 光照与着色\n\n渲染最重要的方面之一是光线如何与场景中的对象相互作用。游戏引擎通过各种光照模型处理这一点，这些模型模拟了光在现实世界中的行为。着色是计算光如何影响表面外观的过程，它在让对象看起来真实方面起着至关重要的作用。\n\
    \n- 平直着色 (Flat shading)：对象的每个面赋予单一颜色，使对象看起来有棱角且分面。\n- 平滑着色 (Smooth shading)：颜色在面上进行插值处理，使对象看起来平滑且圆润。\n\
    - 冯石着色 (Phong shading)：一种更高级的技术，按像素计算光照，从而产生真实的光照和反射效果。\n\n游戏引擎还支持高级的光照技术，例如全局光照\
    \ (global illumination)，它模拟了光线从表面反弹，并在整个场景中创建真实的光照效果。\n\n## 物理模拟\n\n游戏引擎还管理**物理模拟\
    \ (physics simulation)**，确保对象在游戏世界中的行为符合逻辑。这包括模拟重力、碰撞以及影响对象移动和交互的其他力。许多引擎内置了物理引擎（如\
    \ Unity 的 PhysX 或 Babylon.js 的 Cannon.js），它们会自动处理这些计算。\n\n物理引擎使用数学模型来近似现实世界对象的行为。例如，它们可能会模拟球撞击地面时如何反弹，或者汽车在急转时如何打滑。物理引擎还处理**碰撞检测\
    \ (collision detection)**，确保对象不会互相穿过，并确保射击或跳跃等交互是真实的。\n\n## 第 2 章：开始使用 Three.js\n\
    \nThree.js 是 JavaScript 中创建 3D 图形最流行的库之一。它在 WebGL 之上提供了一个易用的接口，WebGL 是内置在现代浏览器中的低级图形\
    \ API。通过使用 Three.js，你可以创建复杂的 3D 场景，而无需处理 WebGL 的复杂性，使其成为所有技能水平开发者的极佳工具。在本章中，我们将引导你完成\
    \ Three.js 的设置、创建第一个 3D 场景，并理解如何管理渲染循环。在本章结束时，你将拥有一个运行的 3D 环境，并在屏幕上渲染出的一个基础立方体。\n\
    \n### 安装和设置 Three.js\n\n在开始创建 3D 场景之前，我们需要在开发环境中设置 Three.js。有几种方法可以将 Three.js\
    \ 引入到你的项目中，取决于你倾向于使用 CDN（内容分发网络）、直接下载库，还是通过 npm（Node 包管理器）安装。\n\n### 方法 1：使用 CDN\n\
    \n开始使用 Three.js 的简单方法是从 CDN 引入它。CDN 在远程服务器上托管库文件，你可以直接在 HTML 文件中引用它们。这种方法不需要安装，非常适合初。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Three.js Setup</title>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r135/three.min.js\"\
    ></script>\n</head>\n<body>\n    <script>\n        // 你的 Three.js 代码将写在这里\n  \
    \  </script>\n</body>\n</html>\n```\n\n只需将上述代码复制并粘贴到 HTML 文件中，就可以开始了。你现在可以在 <script>\
    \ 标签内编写 Three.js 代码。\n\n### 方法 2：通过 npm 安装\n\n如果你正在使用 Webpack 或 Parcel 等构建工具，可以通过\
    \ npm 安装 Three.js。这种方法对于更复杂的项目是首选，因为它允许更好的依赖管理和模块化代码。首先，使用 npm 初始化项目：\n\n```bash\n\
    npm init -y\n```\n\n然后，安装 Three.js：\n\n```bash\nnpm install three\n```\n\n安装完成后，你可以在\
    \ JavaScript 文件中导入 Three.js：\n\n```javascript\nimport * as THREE from 'three';\n\
    ```\n\n现在设置好了 Three.js，我们就可以开始创建第一个 3D 场景了。\n\n"
