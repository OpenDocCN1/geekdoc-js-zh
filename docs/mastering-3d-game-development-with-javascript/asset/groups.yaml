    Knowing which coordinate system your game engine uses is important when importing
    models manipulating objects, as it affects how objects are positioned and viewed
    in 3D space.


    # World, Local, and Camera Space


    When working with 3D models, it''s helpful to understand the different types of
    coordinate spaces used in rendering:


    +   1. **World Space**: This is the global coordinate system that defines the
    position of objects in the entire scene relative to the world origin. Every object
    in the game is positioned within this world space.

    2. **Local Space**: Each 3D object also has its own local coordinate system. This
    system defines the position of vertices and parts of the object relative to the
    object''s origin, which may differ from the world origin. For example, a character''s
    arm moves relative to the character''s body, not the entire game world.

    3. **Camera Space**: This space is relative to the camera, which means that all
    objects are positioned based on their relation to the camera''s viewpoint. The
    closer an object is to the camera in Z-space, the larger it appears on the screen.


    Understanding these spaces helps developers control the movement and transformation
    of objects in 3D games, ensuring that they behave correctly when interacting with
    the player, the camera, and other elements in the scene.


    # Understanding Vertices, Edges, and Faces


    All 3D objects, from the simplest cube to the most detailed character model, are
    made up of basic geometric components: vertices, edges, and faces.'
  - '[PAGE 16]


    # Vertices


    A vertex is a point in 3D space, defined by its coordinates (X, Y, Z). Vertices
    are the most fundamental unit of a 3D model, serving as the endpoints of lines
    and the corners of polygons. In more complex models, vertices also hold information
    such as color, texture coordinates, and normal vectors (which define the direction
    a surface is facing).


    # Edges


    An edge is a straight line that connects two vertices. Edges define the shape
    of a 3D object by forming the outline of polygons, which are the building blocks
    of the model. While edges are not rendered directly in most games, they are crucial
    for defining the structure of a 3D object.


    # Faces


    A face is a flat surface that is enclosed by edges. In 3D modeling, faces are
    typically polygons, and the most common type of polygon used in games is the triangle.
    Triangles are favored because they are the simplest polygon and always lie in
    3D space, making them easier to process and render. More complex shapes can be
    approximated by combining multiple triangles to create the illusion of smooth
    curves and detailed surfaces.


    When multiple triangles are connected, they form a mesh, which is a collection
    of vertices, edges, and faces that together define the shape of a 3D object. The
    more vertices a mesh has, the more detailed it can be, but this also increases
    the computational cost of rendering.


    # How Game Engines Handle 3D


    Game engines are the backbone of modern 3D game development. They provide the
    tools, libraries, and frameworks needed to manage rendering, physics, input handling,
    and other game-related tasks. A game'
