    \nrenderer.setSize(window.innerWidth, window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\
    \n// Add a light source\nconst light = new THREE.PointLight(0xffffff);\nlight.position.set(10,\
    \ 10, 10);\nscene.add(light);\n```\n\n### Step 2: Creating Custom Shaders\n\n\
    To create a custom shader material, define the vertex and fragment shader codes.\
    \ You can use the THREE.ShaderMaterial class to combine these shaders and apply\
    \ them to your mesh.\n\n```javascript\nconst vertexShader = `\nvarying vec3 vColor;\n\
    void main() {\n    vColor = vec3(1.0, 0.5, 0.0); // Set a constant color\n   \
    \ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}\n\
    `;\n\nconst fragmentShader = `\n    varying vec3 vColor;\n    void main() {\n\
    \        gl_FragColor = vec4(vColor, 1.0); // Use the interpolated color\n   \
    \ }\n`;\n\nconst shaderMaterial = new THREE.ShaderMaterial({\n    vertexShader,\n\
    \    fragmentShader,\n});\n```\n\n### Step 3: Creating and Adding a Mesh\n\nNow,\
    \ create a geometry and apply the custom shader material to it. In this example,\
    \ we'll create a simple cube.\n\n```javascript\nconst geometry = new THREE.BoxGeometry();\n\
    const cube = new THREE.Mesh(geometry, shaderMaterial);\nscene.add(cube);\n```\n\
    \n### Step 4: Rendering the Scene\n\nFinally, create a render loop to continuously\
    \ render the scene and animate the cube.\n\n```javascript\nfunction animate()\
    \ {\n  requestAnimationFrame(animate);\n  cube.rotation.x += 0.01; // Rotate the\
    \ cube\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();\n\
    ```\n\nThis code will create a rotating cube that utilizes your custom shaders,\
    \ rendering it with the specified color.\n\n## Post-Processing Effects: Bloom,\
    \ Motion Blur, and Depth of Field\n\nPost-processing effects are techniques applied\
    \ to the final rendered image to enhance visual quality. Three.js provides an\
    \ easy way to implement post-processing effects using the EffectComposer class.\n\
    \n### Setting Up Post-Processing\n\n- 1. Install Necessary Libraries: Ensure you\
    \ have the Three.js post-processing library installed. If you haven't already,\
    \ you can include it in your project.\n- 2. Create an Effect Composer:\n\n```javascript\n\
    const composer = new THREE.EffectComposer(renderer);\ncomposer.addPass(new THREE.RenderPass(scene,\
    \ camera));\n```\n\n### Bloom Effect\n\nThe bloom effect simulates the way bright\
    \ lights bleed into surrounding areas, creating a soft glow.\n\n- 1. Add the Bloom\
    \ Pass:\n\n```javascript\nconst bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,\
    \ window.innerHeight), 1.5, 0.4, 0.85);\ncomposer.addPass(bloomPass);\n```\n\n\
    ### 1. Render the Composer:\n\nReplace the render call in your animation loop\
    \ with the composer's render method:\n\n```javascript\nfunction animate() {\n\
    \  requestAnimationFrame(animate);\n  composer.render(); // Render using the composer\n\
    }\nanimate();\n```\n\n### Motion Blur Effect\n\nMotion blur simulates the blurring\
    \ of objects in motion, enhancing realism during fast movements.\n\n- 1. Add the\
    \ Motion Blur Pass:\n\n```javascript\nconst motionBlurPass = new THREE.MotionBlurPass();\n\
    composer.addPass(motionBlurPass);\n```\n\n### Depth of Field Effect\n\nDepth of\
    \ field creates a focus effect, blurring parts of the scene that are not in focus.\n\
    \n- 1. Add the Depth of Field Pass:\n\n```javascript\nconst dofPass = new THREE.BokehPass(scene,\
    \ camera, {\nfocus: 1.0,\naperture: 0.025,\nmaxDepth: 2.0,\nminDepth: 0.0,\n});\n\
    composer.addPass(dofPass);\n```\n\n### Final Render Call\n\nEnsure to call the\
    \ composer's render method in your animation loop to apply all post-processing\
    \ effects:\n\n```javascript\nfunction animate() {\n  requestAnimationFrame(animate);\n\
    \  composer.render();\n}\nanimate();\n```\n\n## Implementing Particle Systems\n\
    \nParticle systems are essential for creating effects like smoke, fire, and explosions.\
    \ Three.js provides a straightforward way to implement particle systems.\n\n###\
    \ Step 1: Setting Up the Particle System\n\n- 1. Create a Geometry: Use BufferGeometry\
    \ to create the geometry.\n\n```javascript\nconst particleCount = 1000;\nconst\
    \ particles = new THREE.BufferGeometry();\nconst positions = new Float32Array(particleCount\
    \ * 3);\n\nfor (let i = 0; i < particleCount; i++) {\n    positions[i * 3] = (Math.random()\
    \ - 0.5) * 10; // x\n    positions[i * 3 + 1] = (Math.random() - 0.5) * 10; //\
    \ y\n    positions[i * 3 + 2] = (Math.random() - 0.5) * 10; // z\n}\n\nparticles.setAttribute('position',\
    \ new THREE.BufferAttribute(positions, 3));\n```\n\n### Step 2: Creating a Particle\
    \ Material\n\nNext, create a material for the particles using PointsMaterial.\n\
    \n```javascript\nconst particleMaterial = new THREE.PointsMaterial({ color: 0xffffff,\
    \ size: 0.1 });\n```\n\n### Step 3: Creating the Particle System\n\nCombine the\
    \ geometry and material into a Points object.\n\n```javascript\nconst particleSystem\
    \ = new THREE.Points(particles, particleMaterial);\nscene.add(particleSystem);\n\
    ```\n\n### Step 4: Animating the Particles\n\nFinally, update the particles' positions\
    \ in the animation loop to create a dynamic effect.\n\n```javascript\nfunction\
    \ animateParticles() {\n    const positions = particleSystem.geometry.attributes.position.array;\n\
    \n    for (let i = 0; i < particleCount; i++) {\n        positions[i * 3 + 1]\
    \ -= 0.01; // Move particles down\n        if (positions[i * 3 + 1] < -5) {\n\
    \            positions[i * 3 + 1] = 5; // Reset particle position\n        }\n\
    \    }\n\n    particleSystem.geometry.attributes.position.needsUpdate = true;\
    \ // Update the geometry\n}\n\nfunction animate() {\n    requestAnimationFrame(animate);\n\
    \    animateParticles(); // Update particle positions\n    composer.render();\
    \ // Render the scene with post-processing\n}\nanimate();\n```\n"
  mdcn: "\n\n**内置函数：** GLSL 提供了许多用于数学运算、纹理采样和其他工具的内置函数，让开发者能够轻松创建特效。\n\n**精度限定符：**\
    \ GLSL 允许开发者为变量指定精度，这会影响性能和渲染质量。常见的限定符包括 highp、mediump 和 lowp。\n\n## 简单的顶点着色器与片元着色器示例\n\
    \n渲染彩色三角形的基础顶点着色器和片元着色器示例。\n\n顶点着色器：\n\n```glsl\n#version 300 es\nlayout(location\
    \ = 0) in vec4 position;\nlayout(location = 1) in vec3 color;\nout vec3 fragColor;\n\
    \nvoid main() {\n    gl_Position = position; // 变换顶点\n    fragColor = color; //\
    \ 将颜色传递给片元着色器\n}\n```\n\n## 片元着色器：\n\n```glsl\n#version 300 es\nprecision medium\
    \ float;\nin vec3 fragColor;\nout vec4 outColor;\n\nvoid main() {\n    outColor\
    \ = vec4(fragColor, 1.0); // 设置像素颜色\n}\n```\n\n在此示例中，顶点着色器接收位置和颜色属性，变换位置，并将颜色传递给片元着色器，后者输出最终的像素颜色。\n\
    \n## 在 Three.js 中创建自定义着色器\n\nThree.js 通过提供创建和管理自定义着色器的内置功能，简化了着色器的使用流程。以下是在 Three.js\
    \ 中创建和使用自定义着色器的逐步指南。\n\n### 步骤 1：设置场景\n\n在创建自定义着色器之前，请确保已设置好了一个包含相机、渲染器和光源的基础\
    \ Three.js 场景。\n\n```javascript\n//  Three.js 场景设置\nconst scene = new THREE.Scene();\n\
    \nconst camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight,\
    \ 0.1, 1000);\nconst renderer = new THREE.WebGLRenderer();\n\nrenderer.setSize(window.innerWidth,\
    \ window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\n//\
    \ 添加光源\nconst light = new THREE.PointLight(0xffffff);\nlight.position.set(10,\
    \ 10, 10);\nscene.add(light);\n```\n\n### 步骤 2：创建自定义着色器\n\n要创建一个自定义着色器材质，需要定义顶点和片元着色器代码。你可以使用\
    \ `THREE.ShaderMaterial` 类来组合这些着色器并将它们应用于你的网格。\n\n```javascript\nconst vertexShader\
    \ = `\nvarying vec3 vColor;\nvoid main() {\n    vColor = vec3(1.0, 0.5, 0.0);\
    \ // 设置常量颜色\n    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,\
    \ 1.0);\n}\n`;\n\nconst fragmentShader = `\n    varying vec3 vColor;\n    void\
    \ main() {\n        gl_FragColor = vec4(vColor, 1.0); // 使用插值颜色\n    }\n`;\n\n\
    const shaderMaterial = new THREE.ShaderMaterial({\n    vertexShader,\n    fragmentShader,\n\
    });\n```\n\n### 步骤 3：创建并添加网格\n\n现在，创建一个几何体并将自定义着色器材质应用于它。在这个示例中，我们将创建一个简单的立方体。\n\
    \n```javascript\nconst geometry = new THREE.BoxGeometry();\nconst cube = new THREE.Mesh(geometry,\
    \ shaderMaterial);\nscene.add(cube);\n```\n\n### 步骤 4：渲染场景\n\n最后，创建一个渲染循环来持续渲染场景并制作立方体。\n\
    \n```javascript\nfunction animate() {\n  requestAnimationFrame(animate);\n  cube.rotation.x\
    \ += 0.01; // 旋转立方体\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n\
    }\nanimate();\n```\n\n这段代码将创建一个利用你的自定义着色器的旋转立方体，并使用指定的颜色进行渲染。\n\n## 后处理特效：光晕、运动模糊和景深\n\
    \n后处理特效是应用于最终渲染图像以增强视觉效果的技术。Three.js 提供了使用 `EffectComposer` 类实现后处理特效的简单方法。\n\n\
    ### 设置后处理\n\n- 1. 安装必要的库：确保你已安装了 Three.js 后处理库。如果尚未安装，可以将其包含在你的项目中。\n- 2. 创建特效合成器（Effect\
    \ Composer）：\n\n```javascript\nconst composer = new THREE.EffectComposer(renderer);\n\
    composer.addPass(new THREE.RenderPass(scene, camera));\n```\n\n### 光晕特效（Bloom）\n\
    \n光晕特效模拟了强光渗透到周围区域的效果，营造出柔和的光。\n\n- 1. 添加光晕通道：\n\n```javascript\nconst bloomPass\
    \ = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight),\
    \ 1.5, 0.4, 0.85);\ncomposer.addPass(bloomPass);\n```\n\n### 1. 渲染合成器：\n\n将动画循环中的渲染调用替换为合成器的\
    \ `render` 方法：\n\n```javascript\nfunction animate() {\n  requestAnimationFrame(animate);\n\
    \  composer.render(); // 使用合成器渲染\n}\nanimate();\n```\n\n### 运动模糊特效\n\n运动模糊模拟了运动物体模糊效果，增强了快速移动时的真实感。\n\
    \n- 1. 添加运动模糊通道：\n\n```javascript\nconst motionBlurPass = new THREE.MotionBlurPass();\n\
    composer.addPass(motionBlurPass);\n```\n\n### 景深特效\n\n景深创建了一种聚焦效果，使场景中不在焦点的部分模糊。\n\
    \n- 1. 添加景深通道：\n\n```javascript\nconst dofPass = new THREE.BokehPass(scene, camera,\
    \ {\nfocus: 1.0,\naperture: 0.025,\nmaxDepth: 2.0,\nminDepth: 0.0,\n});\ncomposer.addPass(dofPass);\n\
    ```\n\n### 最终渲染调用\n\n确保在动画循环中调用合成器的 `render` 方法以应用所有后处理特效：\n\n```javascript\n\
    function animate() {\n  requestAnimationFrame(animate);\n  composer.render();\n\
    }\nanimate();\n```\n\n## 实现粒子系统\n\n粒子系统对于创建烟雾、火焰和爆炸等特效至关重要。Three.js 提供了一种实现粒子系统的简单方法。\n\
    \n### 步骤 1：设置粒子系统\n\n- 1. 创建几何体：使用 `BufferGeometry` 创建几何体。\n\n```javascript\n\
    const particleCount = 1000;\nconst particles = new THREE.BufferGeometry();\nconst\
    \ positions = new Float32Array(particleCount * 3);\n\nfor (let i = 0; i < particleCount;\
    \ i++) {\n    positions[i * 3] = (Math.random() - 0.5) * 10; // x\n    positions[i\
    \ * 3 + 1] = (Math.random() - 0.5) * 10; // y\n    positions[i * 3 + 2] = (Math.random()\
    \ - 0.5) * 10; // z\n}\n\nparticles.setAttribute('position', new THREE.BufferAttribute(positions,\
    \ 3));\n```\n\n### 步骤 2：创建粒子材质\n\n接下来，使用 `PointsMaterial` 为粒子创建材质。\n\n```javascript\n\
    const particleMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1\
    \ });\n```\n\n### 步骤 3：创建粒子系统\n\n将几何体和材质组合成 `Points` 对象。\n\n```javascript\nconst\
    \ particleSystem = new THREE.Points(particles, particleMaterial);\nscene.add(particleSystem);\n\
    ```\n\n### 步骤 4：粒子粒子\n\n最后，在动画循环中更新粒子的位置以创建动态效果。\n\n```javascript\nfunction animateParticles()\
    \ {\n    const positions = particleSystem.geometry.attributes.position.array;\n\
    \n    for (let i = 0; i < particleCount; i++) {\n        positions[i * 3 + 1]\
    \ -= 0.01; // 粒子向下移动\n        if (positions[i * 3 + 1] < -5) {\n            positions[i\
    \ * 3 + 1] = 5; // 重置粒子位置\n        }\n    }\n\n    particleSystem.geometry.attributes.position.needsUpdate\
    \ = true; // 更新几何体\n}\n\nfunction animate() {\n    requestAnimationFrame(animate);\n\
    \    animateParticles(); // 更新粒子位置\n    composer.render(); // 使用后处理渲染场景\n}\nanimate();\n\
    ```\n\n"
