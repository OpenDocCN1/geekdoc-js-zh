  mdcn: "\nMeshStandardMaterial 是一种基于物理的材质，能够更准确地模拟材料的真实世界属性。它需要光源，并且能很好地实现真实的渲染。\n\
    \n```javascript\nconst standardMaterial = new THREE.MeshStandardMaterial({\n \
    \ color: 0x00ff,\n  roughness: 0.5, // 控制表面的粗糙或光滑\n  metalness: 0.5, // 控制表面的金属属性\n\
    });\nconst standardCube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), standardMaterial);\n\
    scene.add(standardCube);\n```\n\n# MeshPhysicalMaterial\n\n为了获得更强的真实感，MeshPhysicalMaterial\
    \ 在 MeshStandardMaterial 的基础上增加了额外的属性，如清漆（clear coat）和透射（transmission），用于模拟透明或光亮的表面。\n\
    \n```javascript\nconst physicalMaterial = new THREE.MeshPhysicalMaterial({\n \
    \ color: 0x2194ce,\n  clearcoat: 1.0, // 表面的光泽程度\n  clearcoatRoughness: 0.1, //\
    \ 清漆的粗糙度\n});\n```\n\n```javascript\nconst physicalSphere = new THREE.Mesh(THREE.SphereGeometry(1,\
    \ 32, 32), physicalMaterial);\nscene.add(physicalSphere);\n```\n\n# 贴图映射技术\n\n\
    除了基础的贴图应用，理解不同的映射技术可以增强贴图与模型之间的交互方式。\n\n# 法线映射 (Normal Mapping)\n\n法线映射在不增加额外几何形状的情况下模拟表面小细节的外观。通过使用法线贴，你可以在平面上创建深度和细节的幻觉。\n\
    \n```javascript\nconst textureLoader = new THREE.TextureLoader();\nconst normalMap\
    \ = textureLoader.load('path/to/normalMap.jpg');\nconst normalMaterial = new THREE.MeshStandardMaterial({\n\
    \  map: texture,\n  normalMap: normalMap,\n});\n```\n\nconst normalMappedCube\
    \ = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), normalMaterial);\nscene.add(normalMappedCube);\n\
    \n# 凸贴映射 (Bump Mapping)\n\n凸贴映射与法线映射类似，但细节较少。它使用灰度图像来影响材质的表面法线。\n\n```javascript\n\
    const bumpMap = textureLoader.load('path/to/bumpMap.jpg');\nconst bumpMaterial\
    \ = new THREE.MeshStandardMaterial({\n  map: texture,\n  bumpMap: bumpMap,\n \
    \ bumpScale: 0.1, // 凸起效果的比例\n});\nconst bumpMappedSphere = new THREE.Mesh(THREE.SphereGeometry(1,\
    \ 32, 32), bumpMaterial);\nscene.add(bumpMappedSphere);\n```\n\n# 优化 3D \n\n随着场景变得越来越复杂，性能可能会成为问题，特别是对于基于\
    \ Web 的应用程序。以下是一些优化技术：\n\n- 减少多边形数量\n\n使用更简单的几何形状可以显著提高性能。考虑减少远处对象的多边形数量，或使用 LOD（细节层次）技术，即在远处使用更简单的模型。\n\
    \n- 贴图图集 (Texture Atlases)\n\n不要使用多个小贴图，而是创建一个贴图集——一张包含多个较小图像的图像。这减少了渲染循环中的贴图切换次数，从而提高了性能。\n\
    \n- 实例化 (Instancing)\n\n如果你的场景中有许多相同的对象（如树或岩石），请使用实例化。Three.js 通过 InstancedMesh\
    \ 类提供实例化支持，允许你以更低的开销渲染多个相同几何体的副本。\n\n```javascript\nconst count = 100; // 实例数量\n\
    const instancedMesh = new THREE.InstancedMesh(boxGeometry, boxMaterial, count);\n\
    \nfor (let i = 0; i < count; i++) {\n  const matrix = new THREE.Matrix4();\n \
    \ matrix.setTranslation(Math.random() * 10, 0, Math.random() * 10); // 随机位置\n\
    \  instancedMesh.setMatrixAt(i, matrix);\n}\n\nscene.add(instancedMesh);\n```\n\
    \n在本章中，我们探索了 Three.js 中几何形状和材质的复杂性，专注于如何创建各种形状、应用材质以及使用贴图和光照增强你的 3D 场景。理解这些概念对于构建引人注目且视觉良好的\
    \ 3D 游戏至关重要。在旅途中，继续尝试不同的几何形状、材质和优化技术，以找到你独特的艺术风格和游戏开发方法。\n\n在下一章中，我们将讨论动画技术以让你的\
    \ 3D 模型动起来，包括关键帧动画、骨骼动画以及如何在 Three.js 中与动画库配合。这些知识将允许你在游戏中创建更具动态和交互性的体验。\n\n#\
    \ 第 4 章：相机、灯光与动作\n\n在 3D 游戏开发世界中，视觉体验不仅通过模型和贴图构建，还通过相机和灯光的精心安排。在本章中，我们将探索如何有效利用相机和灯光来增强\
    \ 3D 环境的氛围和感知。通过掌握这些元素，你将获得创建吸引玩家沉浸式体验的能力。我们将涵盖以下主题：\n\n- 1. 相机类型：透视 vs 正交\n-\
    \ 2. 配置和移动相机\n- 3. 添加灯光：平行光、点光、环境光和聚光灯\n- 4. 创建动态阴影和反射\n\n相机类型：透视 vs 正交\n\n在 Three.js\
    \ 中，你可以选择不同类型的相机来控制场景的视图。两种主要类型是透视相机和正交相机。\n\n# 透视相机 (Perspective Camera)\n\n\
    透视相机模拟人类眼感知世界的方式。离相机的物体看起来更大，而远处的物体看起来更小，从而产生深度感。这是通过决定视角的视场（FOV）参数实现的。\n\n# 创建透视相机\n\
    \n在 Three.js 中创建透视相机，可以使用 `THREE.PerspectiveCamera` 类。这里是如何设置它的示例：\n\n```javascript\n\
    const fieldOfView = 75; // 度\nconst aspectRatio = window.innerWidth / window.innerHeight;\
    \ // 宽高比\nconst nearClippingPlane = 0.1; // 近裁剪平面\nconst farClippingPlane = 1000;\
    \ // 远裁剪平面\n\nconst camera = new THREE.PerspectiveCamera(fieldOfView, aspectRatio,\
    \ nearClippingPlane, farClippingPlane);\ncamera.position.set(0, 1, 5); // 设置相机的初始位置\n\
    ```\n\n`fieldOfView` 参数以度为单位，典型值为 75 度。`aspectRatio` 根据窗口宽度和高度计算，以确保渲染场景的宽高比与视口匹配。`nearClippingPlane`\
    \ 和 `farClippingPlane` 定义了从相机渲染物体的距离。\n\n# 正交相机 (Orthographic Camera)\n\n正交相机提供了一种不同的视觉视角，物体的大小与其与相机的远近保持不变。这意味着平行线保持平行，使其适用于\
    \ 2D 游戏或某些深度感知不是优先事项的 3D 应用。\n\n创建正交相机\n\n在 Three.js 中创建正交相机，使用 `THREE.OrthographicCamera`\
    \ 类。以下是设置它的方法：\n\n```javascript\nfrustumSize = 10; // 视锥体大小\nconst orthographicCamera\
    \ = new THREE.OrthographicCamera(\n  frustumSize / -2, // 左\n  frustumSize / 2,\
    \ // 右\n  frustumSize / 2, // 上\n  frustumSize / -2, // 下\n  nearClippingPlane,\n\
    \  farClippingPlane\n);\n```\n\n```javascript\northographicCamera.position.set(0,\
    \ 5, 10); // 设置相机位置\northographicCamera.lookAt(0, 0, 0); // 看向场景中心\n```\n\n在这个示例中，`frustumSize`\
    \ 决定了可见区域的大小。正交相机的参数定义了视锥体的左、右、上、下边界，以及近远裁剪平面。\n\n# 选择透视还是正交相机\n\n在选择透视还是正交相机时，请考虑你项目的视觉风格和游戏机制。透视相机适用于需要深度感知的\
    \ 3D 环境，而正交相机适用于 2D 或等轴测游戏。\n\n# 配置和移动相机\n\n一旦你确定了相机的类型，下一步就是配置它并实现移动。在大多数游戏中，相机应该跟随玩家或动态适应环境。\n\
    \n# 配置相机\n\n你可以配置相机的各种属性，如其位置、旋转和视场，以创建理想的视觉效果。为了允许平滑的过渡和相机控制，你还可以使用如 dat.GUI\
    \ 等库来创建实时修改相机属性的用户界面。\n\n配置相机的示例\n\n"
