    \n在本章中，我们涵盖了创建沉浸式 3D 环境的各种技术。我们从使用几何体和纹理创建基础地形开始，转向使用高度图进行程序化地形生成。然后，我们探索了天空盒和动态环境的添加，增强了游戏的视觉吸引力。\n\
