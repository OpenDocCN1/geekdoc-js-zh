  md: "# 184 Mastering React Native\n\n# Setup\n\nTo begin, launch Android Studio\
    \ and navigate to the Android project within your React Native application. Within\
    \ a React Native app, you may access your Android project:\n\n+   - We recommend\
    \ writing your native code in Android Studio. Android Studio is an IDE designed\
    \ for Android programming that can assist you in swiftly resolving small issues\
    \ such as code syntax mistakes.\n- We also recommend that you use Gradle to accelerate\
    \ builds while you iterate on Java code.\n\n# Create Custom Native Module File\n\
    \nThe first step is to create CalendarModule.java Java file in the folder id/src/main/java/com/your-app-name/.\
    \ This file will include the Java class for your native module.\nThen add the\
    \ following information:\n\n```\npackage com.your-app-name; // replace com.your-app-name\
    \ with your app name\nimport com.facebook.react.bridge.NativeModule;\nimport com.facebook.react.bridge.ReactApplicationContext;\n\
    import com.facebook.react.bridge.ReactContext;\nimport com.facebook.react.bridge.ReactContextBaseJavaModule;\n\
    import com.facebook.react.bridge.ReactMethod;\nimport java.util.Map;\nimport java.util.HashMap;\n\
    public class CalendarModule extends ReactContextBaseJavaModule {\n  CalendarModule(ReactApplicationContext\
    \ context) {\n    super(context);\n  }\n}\n```\n\nYour CalendarModule class, as\
    \ you can see, extends the ReactContextBaseJavaModule class. Java native modules\
    \ for Android are built as classes that extend ReactContextBaseJavaModule and\
    \ implement the JavaScript functionality."
