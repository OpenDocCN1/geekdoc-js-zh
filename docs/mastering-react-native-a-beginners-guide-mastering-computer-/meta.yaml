    locally even after the user is offline; this aids in gathering all information
    once again when you log in and provides the user with a smooth experience. We
    should not mix up the stored data with the state data because it is not a replacement
    for it. When the app is closed, AsyncStorage can also be utilized in place of
    Local Storage since it is more efficient in terms of data storage techniques such
    as database systems.'
