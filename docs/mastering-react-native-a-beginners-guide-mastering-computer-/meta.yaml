    Native Modules Intro


    A React Native app may require access to a native platform API that is not available
    by default in JavaScript, such as the native APIs for Apple or Google Pay. You
    want to leverage some existing Objective-C, Swift, Java, or C++ libraries without
    having to reimplement them in JavaScript or build high-performance, multi-threaded
    code for image processing.


    The NativeModule system exposes instances of Java/Objective-C/C++ (native) classes
    as JS objects to JavaScript (JS), allowing you to run arbitrary native code from
    JS. While we do not anticipate this functionality to be part of the standard development
    process, its existence is critical. If React Native does not expose a native API
    that your JS project requires, you should create one. If React Native does not
    expose a native API that your JS project requires, you should create one!


