    # Argument Types


    When a JavaScript native method is called, React Native translates the parameters
    from JS objects to Java object counterparts. For example, if your Java Native
    Module method supports a double, you must call it with a number in JS. The conversion
    will be handled by React Native. The following is a list of the parameter types
    supported by native module methods, as well as the JavaScript equivalents.


    | JAVA | JAVASCRIPT |

    |---|---|

    | Boolean | ?boolean |

    | boolean | boolean |

    | Double | ?number |

    | double | number |

    | String | string |

    | Callback | Function |

    | ReadableMap | Object |

    | ReadableArray | Array |


    The kinds listed below are presently supported but will not be in TurboModules.
    Please refrain from using them:


    +   - Integer -> ?number

    - int -> number

    - Float -> ?number

    - float -> number'
