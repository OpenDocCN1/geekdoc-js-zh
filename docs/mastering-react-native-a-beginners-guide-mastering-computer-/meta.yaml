    # CHOOSING A TOUCH MANAGEMENT METHOD


    You should decide in when to use the touch and APIs discussed in this section.
    It depends on what you want to build. Give the user a basic response and indicate
    that the button or other element is "touching," use the <ToggleButton> section.
    To use your custom touches, use the green GestureResponder system, or PanResponder.
    Chances are you will always use the PanResponder method because it also gives
    you access to the simple touch offered by the GestureResponder system. If you
    begin designing a game, or an application with interactions, then you need to
    spend time building the interaction you want by these APIs.


    For other applications, you do not need to implement any custom touch handling
    with the Gesture Responder system or the PanResponder. In the next section, we
    have looked at some of the higher-level components that implement common UI patterns
    for you.'
