  md: '# 62 Mastering React Native


    Rapid Development


    With only one codebase required to manage iOS and Android, and when everything
    is in one place, product development is very fast. Cross-platform applications
    are built as single projects, although they can support various devices, a large
    amount of code can be reused between platforms.


    Reduced Costs


    Building cross-platform applications can be 30% cheaper than building traditional
    applications, all thanks to the ability to reuse code and rapid development, which
    directly contributes to costs.


    What you have learned so far may lead you to conclude that cross-platform development
    is flawless – no, it is not. Let us get into it right now.


    # Requires Additional Technology to Ensure High Performance


    It is a common myth that cross-platform applications don''t work as well as their
    native counterparts. For example, both Flutter and React Native''s goal is to
    run at 60 frames per second. In most cases, cross-platform applications can work
    in the same way as native applications as long as the developers have sufficient
    skills and expertise.


    As cross-platform applications have to respond to a variety of devices and platforms,
    it makes encoding extremely difficult. This creates a lot of work for engineers
    who have to incorporate variables into different devices and platforms to account
    for differences – especially when it comes to more complex aspects.


    # CHAPTER SUMMARY


    This chapter covered React Native fundamental installation. This allows the creation
    of a multiplatform application using the same codebase. Essentially it enables
    the developers to use the React Native framework along with the other native platform
    capabilities. It also explains its features.'
