    # LAYOUT WITH FLEXBOX


    The component can determine the layout of its children using the Flexbox algorithm.
    Flexbox is designed to provide a consistent format for a variety of screen sizes.


    You will usually use a combination of flexDirection, Align Items, and edit Content
    to get the right layout.


    Flexbox works in the same way in React Native as we do in CSS with the exception
    of a few exceptions. Default is different, there is flexDirection-defaulting to
    column instead of sorrow, alignDefault default variable-start instead of stretch,
    flexSomatically reduce to 0 instead of 1, the variable parameter supports only
    one number.


    Flex


    Flex will explain how your items will "fill" the space available next to your
    main axis. The space will be divided according to the layout of each element.


    Flex Direction


    flexionDirection controls how node children are positioned. This is also called
    the main axis. A cross axis is an axis facing the main axis, or on which the folding
    lines are placed.


    +   - column (default) Align from top to bottom: If the wrap is enabled, the next
    row will start to the right of the first item at the top of the container.'
