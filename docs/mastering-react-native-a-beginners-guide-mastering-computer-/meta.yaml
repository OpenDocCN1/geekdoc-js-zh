    +   - flex-start (default value): Align the children of the container at the beginning
    of the main container axis.


    +   - flex-end: Align the container kids at the end of the main container axis.


    +   - Center: Align the children of the container in the center of the main axis
    of the container.


    +   - Space-between: Equerate space between children across the main axis of the
    container, distributing the remaining space between the children.'
