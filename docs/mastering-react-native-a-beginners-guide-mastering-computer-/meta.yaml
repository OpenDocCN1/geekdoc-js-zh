    }

    ```


    The constant may then be accessible in JS by using getConstants() on the native
    module as follows:


    ```

    const { DEFAULT_EVENT_NAME } = CalendarModule;

    getConstants();

    console.log(DEFAULT_EVENT_NAME);

    ```


    Technically, constants exported via constantsToExport() can be accessed straight
    from the NativeModule object. This will no longer be supported by TurboModules,
    thus we recommend the community to use the above solution to avoid future migration.


    Because constants are only exported at startup time, changing constantsToExport()
    values at runtime has no effect on the JavaScript environment.'
