  md: "# Putting It All Together ■ 253\n\nprevious one. It is meant to resemble iOS\
    \ and Android: on iOS, fresh displays glide from the right, whereas on Android,\
    \ they fade in from the bottom.\n\nThe createNavigator method is passed through\
    \ a route configuration object. The Home route is equivalent to the HomeScreen,\
    \ while the About route is equivalent to the AboutScreen.\n\nThe {screen} configuration\
    \ format is an optional, succinct way of describing the route configuration.\n\
    \nIn addition, as indicated by the API, we can optionally include another options\
    \ object. We may add a separate object to specify which route is the initial one:\n\
    \n```\nconst AppNavigator = createStackNavigator({\nHome: {\n  screen: HomeScreen\n\
    About: {\n  screen: AboutScreen\n}},\n)initialRouteName: \"Home\"\n});\n```\n\n\
    It is worth noting that the Home and About route name-value pairs are surrounded\
    \ by an overall route. The choices object is not contained but exists as a distinct\
    \ object.\n\nBehind the scenes, the createStackNavigator method sends a navigation\
    \ prop to the HomeScreen and About components. You may use the navigate prop to\
    \ go to a certain screen component. Therefore, we can use it on a button in HomeScreen.js\
    \ that, when clicked, takes us to the AboutScreen, as seen below.\n\n```\n<Button\
    \ title=\"Go to About\"\nonPress={() => this.props.navigation.navigate('About')}\
    \ />\n```\n\nWe generated an app container in the App.js code using const AppContainer\
    \ = createApp(AppNavigator). This container oversees navigation state."
