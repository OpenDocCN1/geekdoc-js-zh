    # Flex


    All container features such as View in React Native are automatic Flex containers.
    To explain how container children will fill the available space near the main
    axis flexproperty. The flexproperty for each element will be used to divide space.


    ```

    <View style={{ flex: 1 }}>>

    <View style={{ flex: 1 }}>>A</View>

    <View style={{ flex: 2 }}>>B</View>

    <View style={{ flex: 3 }}>>C</View>

    </View>

    ```


    # Flex Direction


    Defaults to column where the children of the container will be on top of each
    other on the y-axis.


    ```

    <View style={{ flex: 1, flexDirection: ''column'' }}>>

    <View style={{ flex: one, borderWidth: 10, borderColor: ''red'' }}>/>

    <View style={{ flex: two, borderWidth: 10, borderColor: ''orange'' }}>/>

    <View style={{ flex: three, borderWidth: 10, borderColor: ''green'' }}>/>

    </View>

    ```


    Changing the direction to row will arrange the children on the x-axis side by
    side (left to right).


    ```

    <View style={{ flex: 1, flexDirection: ''row'' }}>>

    <View style={{ flex: 1, borderColor: ''red'' }}>/>

    <View style={{ flex: 2, borderColor: ''orange'' }}>/>

    <View style={{ flex: 3, borderColor: ''green'' }}>/>

    </View>

    ```


