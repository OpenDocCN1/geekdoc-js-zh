  md: '# INSTALLING JAVASCRIPT LIBRARIES WITH NPM


    Libraries include pre-written codes that a developer may combine with their own
    code to do various activities that would otherwise need considerable, difficult
    coding.


    Libraries, sub-packages, and other files can be included in packages. Libraries
    and packages are synonymous in several languages.


    What Exactly Is NPM?


    NPM is a package manager for the Node.js packages that is used to obtain and integrate
    packages into JavaScript scripts. These packages include all the files necessary
    for a module (library).


    NPM is an essential component of the JavaScript ecosystem, including a plethora
    of open-source software, libraries, modules, and packages. It makes developing
    much easier since developers may rely on already created code to do various activities.


    How to Download NPM?


    NPM is included with node.js and is installed automatically when you install node.js.
    So, first, we must download and install node.js from their official website: https://nodejs.org/en/download/


    Download the LTS (Recommended) version of node.js from the abovementioned URL.
    Node.js in your system after the download is complete. NPM will be installed immediately
    after node.js has been successfully installed on your machine.


    You may use the command prompt (cmd) to check whether node.js and NPM have been
    correctly installed on your system.


    ```

    > Node -v

    > Npm -v

    ```


    How to Download Packages Using NPM?


    Now we will use NPM to get a package, which is a simple operation. To download
    any package using NPM, start a terminal and use the following syntax:


    ```

    > npm install [package_name]

    ```


