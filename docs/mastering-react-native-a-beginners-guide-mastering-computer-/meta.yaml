  md: "Let us make some modifications to App.js as well. We will import everything\
    \ we need from react-navigation and use that to construct our navigation.\n\n\
    We can create our navigation in the main App.js file since the exported from Project.js\
    \ is the entry point (or root component) for a React Native app and every other\
    \ component will be a child.\n\nEvery other component will be encapsulated within\
    \ the navigation routines, as you will see.\n\n```\n// App.js\nimport React from\
    \ 'react';\nimport { StyleSheet, Text, View } from 'react-native';\nimport { createStackNavigator,\
