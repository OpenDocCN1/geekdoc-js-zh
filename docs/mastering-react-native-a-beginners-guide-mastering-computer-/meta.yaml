  md: '# USING TOUCHABLEHIGHLIGHT


    Any interface elements that respond to the user''s touch (like buttons, control
    elements, etc.) should ideally have a <TouchableHighlight> wrapper. <TouchableHighlight>
    causes overlay when the view is touched, giving the user a visual response. The
    important interactions that cause a mobile app to feel, as opposed to a mobile-optimized
    website, where touch response is limited. As a general rule, you should use <TouchableHighlight>
    whenever there may be a button or link on the web.


    For its basic functionality, you just need to wrap your part in the <TouchableHighlight>,
    which will add a simple overlay when pressed. The <TouchableHighlight> section
    also gives you hooks for events like asPressIn, onPress, onLong, and so on, so
    you can use these in React programs.


    Example 4.3 shows how to wrap a component data in a TouchableHighlight so that
    the user can give feedback.


    # Example 4.3. Using the TouchableHighlight component


    ```

    <TouchableHighlight

    onPressOut={this._onPressOut}

    onPressIn={this._onPressIn}

    style={styles.touchable}>

    <View style={styles.button}>

    <Text style={styles.welcome}>

    {this.state.pressing ? ''EEK!'' : ''PUSH ME''}

    </Text>

    </View>

    </TouchableHighlight>

    ```


    When a user presses a button, an overlay appears, and the text changes to <TouchableHighlight>
    to give the user a visual response – the lefanded (left) and the highlighted right
    (right).


    This is a built-in example, but it shows the basic interaction that makes the
    “world” button affect is an important piece of feedback that lets the user know
    something can be pressed. Note that in order to use overlay, there is no need
    to apply any logic to our styles; <TouchableHighlight> carries with what is logical.'
