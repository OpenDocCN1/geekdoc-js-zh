  md: '# USING THE NAVIGATOR


    React Native is one of the well-known React navigation frameworks. In this session,
    we will go over the principles of React Native navigation, show you how to get
    started with React Native in a React Native project, and walk through many React
    Native examples.


    React Navigation is developed in JavaScript and does not directly use iOS and
    Android''s native navigation APIs. It replaces a subset of those APIs. This enables
    the integration of third-party JS plugins, maximum customization, and simpler
    debugging without the need to learn Objective-C, Swift, Java, Kotlin, and other
    programming languages.


    React Navigation 5.0


    So the time of, the most stable version of React Navigation is React Navigation
    5.0, which was published in February 2020. The current update, according to the
    React Navigation blog, seeks to make the core React Navigation library and API
    more dynamic.


    React Navigation 5.0 includes the following significant modifications and new
    features:


    +   - Configuration is dynamic and component based.

    - UseNavigation, useRouter, and useNavigationState are new hooks for typical use
    cases.

    - A new setOptions method that simplifies specifying screen navigation options.

    - Theme system has been redesigned to allow for greater personalization.

    - TypeScript provides first-rate autocompletion and type-checking.

    - Integration of ReduxDevTools.

    - New stack navigator that navigates with react-native-screens utilizing native
    navigation primitives.

    - New Material top tab navigator backends based on react-native-webview and ScrollView.


    Installing React Navigation


    The first step is to build a React Native app, assuming you have Yarn installed.
    Expo tools are the easiest way to get started with React Native'
