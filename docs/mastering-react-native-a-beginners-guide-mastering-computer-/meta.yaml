  md: '# Mastering Computer Science Series Preface


    THE MASTERING COMPUTER SCIENCE covers a wide range of topics,

    spanning programming languages as well as modern-day technolo-

    dngies and frameworks. The series has a special focus on beginner-level con-

    tent, and is presented in an easy to understand manner, comprises:


    +   - Crystal-clear text spanning various topics sorted by relevance

    - Special focus on practical exercises, with numerous code samples

    and programs

    - A guided approach to programming, with step-by-step tutorials for

    absolute beginners

    - Keen emphasis on the real-world utility of skills, thereby cutting

    the redundant and seldom-used concepts and focusing instead on

    industry-prevalent coding paradigm

    - A wide range of references and resources to help both beginner and

    intermediate-level developers gain the most out of the books


    The Mastering Computer Science series of books start from the core con-\sects
    and quickly moves on to industry-standard coding practices to

    help learners gain efficient and crucial skills in as little time as possible.

    The books assume no prior knowledge of coding, so even the absolute

    newbie coders can benefit from this series.


    The Mastering Computer Science series is edited by Sufyan bin Uzayr, a

    writer and educator with more than a decade of experience in the comput-

    ing field.'
