    # Sending events to JavaScript


    Native modules can send events to JavaScript without being directly called. For
    example, you could want to notify JavaScript that a calendar event from the iOS
    calendar app is approaching. The ideal method is to subclass RCTEventEmitter,
    implement supportedEvents, and then call selfEventWithName:


    Import RCTEventEmitter and subclass RCTEventEmitter in your header class:


    ```

    // CalendarModule.h

    #import <React/RCTBridgeModule.h>

    #import <React/RCTEventEmitter.h>

    @interface CalendarModule : RCTEventEmitter

    <RCTBridgeModule>

    end

    ```


    JavaScript code may subscribe to these events by enclosing your module in a new
    NativeEventEmitter class.


    If you waste resources by sending an event when there are no listeners, you will
    receive a warning. You can override startObserving and stopObserving in your RCTEventEmitter
    subclass to avoid this and improve your module''s burden (for example, by unsubscribing
    from upstream notifications or suspending background processes).


    ```

    @implementation CalendarManager

    {

    bool hasListeners;

    // Will be called when this module''s first listener is added.

    - (void)startObserving {

    hasListeners = YES;

    // Set up any upstream listeners or background tasks as necessary

    }

    // Will be called when this module''s last listener is dealloc or removed.

    ```'
