    # OTHER ORGANATIONAL COMPONENTS


    There are a lot of other parts of the organization, too. For example, a few ones
    inside <TabARIOS> and <SegmentedControlIOS> and <DrawerLayoutAndroid> and <ToolbarAndroid>.


    You will notice that all of these are named with field-specific affixes. That
    is because they are loading native APIs into field-specific UI elements.


    These features are useful for setting up multiple screens within your app. <TabARIOS>
    and <DrawerLayoutAndroid>, for example, give an easy way to switch between multiple
    functions. <SegmentedControlIOS> and <ToolbarAndroid> are suited for well-analyzed
    controls.


    You will want to look at the field-specific design guidelines on how to use these
    components:


    +   * Android Interface Design Guide

    * iOS Interface Design Guidelines


    How do you make use of platform-specific components? Let us now take a look at
