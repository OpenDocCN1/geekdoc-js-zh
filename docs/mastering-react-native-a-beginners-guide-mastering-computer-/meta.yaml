  md: '# 16 Mastering React Native


    +   3. Integrated Updates: In order to maintain good performance, the JS series
    must be able to send integrated updates to the UI series prior to the next draft
    delivery deadline. For example, iOS displays 60 frames per second and this leads
    to a new frame every 16.67 ms. If you do complex processing in the loop of your
    JavaScript event that leads to a UI change and takes more than 16.67 ms, then
    the UI will appear lazy.


    +   4. Native View: One exception is the native view that occurs entirely in the
    UI series for example, navigatorIOS or scroll view works fully in the UI series
    and therefore is not blocked due to the slow JS series.


    +   5. Native Module Thread: Sometimes an application requires access to the platform
    API, and this happens as part of series of traditional modules.


    +   6. Render Thread: For Android L only (5.0), the traditional react series is
    used to generate real OpenGL commands used to map your UI.


    # PROCESS INVOLVED IN WORKING OF REACT NATIVE


    +   1. At the beginning of the application, the main cable starts working and
    loading JS loads.


    +   2. If the JavaScript code is successfully uploaded, the main thread sends
    it to another JS thread because when JS performs heavy calculations, it temporarily
    installs the cable, and the UI string will not suffer at any time.


    +   3. When the React starts delivering, the Reconciler starts to “vary”, and
    when it produces a new DOM (structure), it sends changes to another series (Shadow
    Cable).


    +   4. The shadow thread calculates the structure and sends the parameters/properties
    of the structure to the main sequence (UI). (Here you are wondering why we call
    it “shadow?” Because it produces shade nodes.


    +   5. Since only the main thread is able to render something on the screen, the
    shadow thread must send the generated structure to the main series, and then the
    UI renders.


