  md: "# 250 ■ Mastering React Native\n\nThe following step is to include the react-navigation\
    \ library in your React Native project:\ny add react-navigation\n\nThe React Native\
    \ Stack Navigator\nReact Navigation is written in JavaScript and allows you to\
    \ develop components and navigation patterns that look and feel like they are\
    \ native to the platform.\n\nReact Navigation employs a stack navigator to handle\
    \ a user's history and the presentation of the relevant screen based on the route\
    \ taken inside the app. At any one moment, a user is only shown one screen.\n\n\
    Consider a stack of paper; navigating to a new screen adds it to the stack, and\
    \ navigating back removes it. The stack navigator also includes transitions and\
    \ motions that are like those seen on native iOS and Android devices. It should\
    \ note that an app can have many stack navigators.\n\n# React Native Navigation\
    \ Examples\n\nIn this section, we'll look at several React Native navigation patterns\
    \ and how to use the React Navigation module to implement them.\n\nUsing Stack\
    \ Navigator to Navigate between the Screen Components\nLet us begin by establishing\
    \ /components folder in the project's root directory. Then we have two files,\
    \ Homescreen.js and Aboutscreen.js.\n\n```\n// Homescreen.js\nimport { Component\
    \ } from 'react';\nimport { Button, View, Text } from 'react-native';\nimport\
    \ { createStackNavigator, createAppContainer } from 'react-navigation';\nexport\
    \ default class Homescreen extends Component {\n  render() {\n    return (\n \
    \     <View style={{ flex: 1, alignItems: 'left', justifyContent: 'center' }}>\n\
    \        <Text>Home Screen</Text>\n        <Button\n          title=\"Go to About\"\
    \n          onPress={() => this.props.navigation.navigate('About')}\n        />\n\
    \      </View>\n    )\n  }\n}\n```"
