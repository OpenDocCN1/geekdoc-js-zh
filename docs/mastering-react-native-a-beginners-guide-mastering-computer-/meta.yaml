  md: "# Register the Module (Android Specific)\n\nAfter creating a native module,\
    \ it must be registered with React Native. To accomplish this, put your native\
    \ module to a ReactPackage and register the ReactPackage with React Native. During\
    \ startup, React Native will loop through all packages, registering each native\
    \ module within each ReactPackage.\n\nTo obtain a list of native modules to register,\
    \ React Native calls createNativeNativeModules() on a ReactPackage. If a module\
    \ is not built and returned by createNativeNativeModules for Android, it will\
    \ not be accessible from JavaScript.\n\nTo add Native Module to ReactPackage,\
    \ first build a Java Class MyAppPackage.java in android/app/src/java/com/app-name/\
    \ folder that implements ReactPackage:\n\nThen provide the following information:\n\
    \n```\npackage com.your-app-name; // replace app-name with\nyour's name\nimport\
    \ com.facebook.react.ReactPackage;\nimport com.facebook.react.bridge.NativeModule;\n\
    import com.facebook.react.bridge.ReactApplicationContext;\nimport com.facebook.react.uimanager.ViewManager;\n\
    import java.util.ArrayList;\nimport java.util.List;\nimport java.util.Collections;\n\
    import java.util.*;\npublic class MyAppPackage implements ReactPackage {\n   \
    \ @Override\n    public List<ViewManager> createViewManagers(ReactApplicationContext\
    \ reactContext) {\n        return Collections.emptyList();\n    }\n    @Override\n\
    \    public List<NativeModule> createNativeModules(ReactApplicationContext reactContext)\
    \ {\n        List<NativeModule> modules = new ArrayList<>();\n        modules.add(new\
    \ CalendarModule(reactContext));\n        return modules;\n    }\n}\n```"
