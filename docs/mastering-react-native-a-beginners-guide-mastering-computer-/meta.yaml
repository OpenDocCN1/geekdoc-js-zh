  md: '# Working with React Native ■ 19


    HMR (Hot Module Replacement)


    The HMR (Hot Module Replacement) allows React Native to modify, add, and modify
    modules while the system is in operation. As a result, this feature informs the
    application development process in the following ways:


    +   - Save time by updating only modified code;

    - Maintains application status (lost during reload);

    - Updates the browser as soon as changes are made to the JS code.


    The React Native live feature lets changes on the screen you change them. This
    feature is especially useful in the development of mobile applications.


    # UI-rich Skills


    The React Native framework is an option to go to if you pay close attention to
    the UI of your app. The framework has special render capabilities as well as many
    UI libraries for all types of applications.


    # The Future of React Native


    The Facebook team, along with all stakeholders from the developer community, continue
    to develop the React Native environment. They can add new features, expand React
    Native functionality, and expand its multipatform capacity.


    > There is no doubt that with high performance and a community of dedicated engineers
    behind you, React Native is here to stay and will continue to emerge. Currently,
    the React Native framework emerges in the following ways:


    # Development of Broadcast Model


    Currently, the React Native community is reviving the Fabric project which should
    change the way it is at last. It will allow developers to request JavaScript by
    synchronizing in each series. This feature will reduce the loading time of a large
    series without blocking the response.


    # Advances in Platform-Agnosticism


    Platform-agnosticism is a specific application development philosophy aimed at
    creating cross-platform applications. In hindsight, a good app is one that you
    can make and use it across the platform without the added deception of code. Although
    it is not easy to achieve, the React Native community strives to enable the framework
    to create completely different applications.'
