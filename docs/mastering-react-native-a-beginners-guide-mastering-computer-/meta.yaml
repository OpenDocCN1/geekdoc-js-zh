  md: '# Components for Mobile Development ■ 67


    Downloading images via the network rather than assets has some advantages. During
    development, for example, it may be easier to use this approach while prototyping
    rather than importing all of the assets ahead of time. It changes the size of
    your bundled mobile application so that users need not download all of your assets.
    However, it means you will be relying on the user''s data plan whenever they access
    your application in the future. For most cases, you will want to avoid using the
    URI-based method.


    If you are wondering about working with the user''s own images, we will cover
    the camera roll in Chapter 6.


    Because React Native for mobile emphasizes a component-based approach, images
    include as an <Image> component instead of being referenced via styles. For instance,
    we wanted to use an image as background for weather application. Whereas in HTML
    and CSS you would like to use the background-image property to apply a background
    image, in React Native you use the <Image> as a container component, like so:


    ```

    <Image source={require(''image!puppies'')}>

    /* Your content here... * */

    </Image>

    ```


    Styling the image is fairly straightforward. In addition to using styles, certain
    props control how the image will be rendered. You will usually resize Modeoprop,
    for example, which can be set to enlarge, or contain. The UIExplorer component
    demonstrates this.


    The <Image> component is easy to work with and very flexible. You will make extensive
    use of it in your own applications.


    # WORKING WITH TOUCH AND GESTURES


    Web-based interface is often designed for mouse-based controls. We use features
    such as high-speed status to show interaction and respond to user interaction.
    For mobile, this is an important touch. Mobile forums have their own rules around
    the interaction you would like to design. This varies in some ways from one platform
    to another: iOS behaves differently than Android or Windows.


    React Native provides a number of APIs for you to create links ready to touch.
    In this section, you get to look at the <TouchableOpacity> container section,
    as well as the low-level APIs offered by PanResponder and the Gesture Responder
    program.'
