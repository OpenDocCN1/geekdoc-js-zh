    * Platform-specific components


    In the previous chapter, we learned about building the first application with
    React Native. In this chapter, we are going to learn about the components for
    mobile application development.


    # COMPONENTS FOR MOBILE


    Analogies between HTML and Native Components

    When we are developing for the web, we make use of various basic HTML elements.
    These include `<span>`, `<div>`, and `<img>`, as well as organizational elements
    such as `<ol>`, `<ul>`, and `<table>`. (You could include a consideration of HTML
    elements such as `<audio>`, `<svg>`, `<canvas>`, and so on, but we will ignore
    them for now.)'
  merge: -1
  pgno: 87
- img_proc: false
  md: 'When dealing with React Native, we do not use these HTML elements, but we use
    various components that are nearly analogous to them.


    | HTML | React Native |

    |---|---|

    | div | View |

    | img | Image |

    | span, p | Text |

    | ul/ol, li | ListView almost child items |


    Although these elements serve the same purpose, they do not change. Let us take
    a look at how these components work on mobile with React Native and how they differ
    from their browser-based counterparts.


    The Text Component

    Rendering text a basic function; any application needs to render text somewhere.
    However, within the context of React and mobile development work separately from
    text rendering for the web.


    When working with text in HTML, you could include raw strings in a variety of
    elements. More, you can style them with child tags like <strong> and <em> element.
    So, you end up with a snippet (HTML) that looks like this:


    For example,


    ```

    <p>The quick <em>brown</em> over the lazy <strong>dog</strong>. </p>

    ```


    In React Native, the <Text> element components can have plain text nodes as children.
    In other words, this is not valid:


    ```

    <View>

    Text does not go here!

    </View>

    ```


    Instead, wrap the text in a <Text> component:


    ```

    <View>

    <Text>This is OK!</Text>

    </View>

    ```


    When you deal with <Text> components in React Native, you will no longer have
    access to subtags such as <strong> and <em>, and you can apply styles to achieve
    similar effects through the use of attributes such'
  merge: -1
