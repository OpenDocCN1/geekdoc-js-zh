  md: '# Building Your First Application ■ 61


    What Is Cross-Platform Development?


    React Native is a separate open-source development software developed in Javascript
    and differs from other platforms for different platforms. React Native apps are
    usually developed in key languages as Javascript for Android and Objective C or
    Swift for iOS. This is the reason for the rapid operation of native applications.
    React Native was launched on Facebook''s internal hackathon in 2013. Since then,
    it has been available for testing in January 2015 and has been moving to the current
    mobile development platform.


    Cross-platform development is the practice of making software that is compatible
    with more than one type of hardware platform. The cross-platform application can
    run on Microsoft Windows, Linux, macOS, and both. a good example of a cross-platform
    app is a web browser or Adobe Flash that does the same, regardless of which computer
    or mobile device you are using.


    Cross-platform is considered a sacred software development tool – you can build
    your codebase once and run it on any platform, opposed to software traditionally
    built for a particular platform. Engineers can use the tools they know well, such
    as JavaScript or C#, to build anonymous forums. Software owners are also interested
    in you as product development, in terms of marketing time and cost, slows down.


    # What Are Some of the Features of Cross-Platform Development? A List of Listeners


    You do not have to decide which audience to target, that is, iOS and Android users,
    as different platform software works on both, giving you access to a wider user
    base.


    # Stability of the Court


    There is a difference between roaming and design between iOS and Android, – in
    the development of the platform – is handled automatically, thanks to a shared
    codebase. This helps to create app brand ownership in both forums with less effort
    than the native one.


    # Reusable Code


    This is one of the biggest benefits of platform development – you can create your
    codebase for Android and iOS at the same time. Indigenous app development requires
    coding separately and usually requires two different developers to do the job
    – one for iOS and the other for Android.'
