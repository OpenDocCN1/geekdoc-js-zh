    # Callbacks


    A callback is an argument that is only supported by native modules. For asynchronous
    methods, callbacks are utilized to transmit data from Java to JavaScript. They
    can also be used to run JavaScript asynchronously from the native side.


    To add a callback to a native method, first import the Callback interface, and
    then add a new argument of type Callback to your native module function. There
    are a few quirks with callback parameters that will be eliminated with TurboModules.
    To begin, your function parameters can only include two callbacks: a successCallback
    and a failureCallback.


    ```

    import com.facebook.react.bridge.Callback;

    @ReactMethod

    public void createCalendarEvent(String name, String location, Callback callback)
    {

    }

    ```


    You may call the callback from your Java method, passing any data you wish to
    JavaScript. Please keep in mind that only serializable data may be sent from native
    side to JavaScript. If you need to return a native object, use WritableMaps; if
    you need to return a collection, use WritableArrays. It is also worth noting that
    the callback is not called right after the native function finishes. The ID of
    an event produced in a previous call is supplied to the callback below.


    ```

    @ReactMethod

    public void createCalendarEvent(String name, String location, Callback callback)
    {

    Integer eventId = ...

    callback.invoke(eventId);

    }

