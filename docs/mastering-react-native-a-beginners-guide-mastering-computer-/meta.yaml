    In general, when dealing with styled text, React Native allows you to change your
    approach. Style inheritance React Native is limited, so you lose the default font
    settings for nodes in the tree. Once again, Facebook recommends solving this by
    using styled components:


    You have probably noticed a pattern: React Native is very opinion-ated in its
    preference for the reuse of styled components over the reuse of styles. We will
    further discuss this in the next chapter.


    # THE IMAGE COMPONENT


    If text is the basic element in an application, images are closed for both the
    mobile and the web. When writing HTML and CSS for the Webpage, we include images
    in various ways. Sometimes we use the <img> tag, while we apply images using CSS,
    as when we use the background-image property. But in React Native, we have a similar
    <Image> component, but it behaves differently.


    The simple usage of the <Image> component is easy and straightforward; just set
    the source prop:


    ```

    <Image source={require(''image!puppies'')} />

    ```


    It is worth that it is also possible to include web page-based images instead
    of bundling assets with any application. The Facebook application does this as
    one of the examples in the UIExplorer application:


    ```

    <Image source={{uri: ''https://facebook.git.io/react/img/logo_log.png''}} style={{width:
    300, height: 300}} />

    ```


    When utilizing network resources, you need to specify dimensions manually.'
