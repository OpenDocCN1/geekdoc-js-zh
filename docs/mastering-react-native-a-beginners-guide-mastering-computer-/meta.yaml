  md: '# Styles and Layouts ■ 123


    +   - row Align children from left to right: If the wrap is enabled, the next
    row will start under the first item on the left side of the container.


    +   - column-reverse Arrange children from bottom to top: If the wrap is enabled,
    the next row will start to the right of the first item under the container.


    +   - row-reverse Align the children from right to left: If the wrap is enabled,
    the next row will start under the first item on the right of the container.


    Layout Direction


    Layout direction specifies the way in which children and section text should be
    placed. The structural guide also contributes to what the edge start and end refer
    to. By default, React Native uses the LTR architecture direction. In this mode,
    start refers to the left and to the right.


    +   - LTR (default value) text and children are displayed from left to right.
    The margin and pads used at the beginning of the item are used on the left side.


    +   - RTLT text and children are spread from right to left. Margins and pads used
    at the beginning of the item are used on the right.


    Justify Content


