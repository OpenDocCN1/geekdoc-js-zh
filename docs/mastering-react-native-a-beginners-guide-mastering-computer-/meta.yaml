  md: "# Debugging and Developer Tools ■ 221\n\nconsole.trace()\nThis is another important\
    \ console feature. The console.trace() function is used to print a stack trace\
    \ to the console. This is handy if you are debugging and get stuck at a given\
    \ point in the code and want to look at the stack trace in more detail. This is\
    \ incredibly important for confirming that your code is operating as it should\
    \ and for navigating the stack trace.\n\nconsole.count()\nThis is handy if you\
    \ have the same piece of code running numerous times and want to keep track of\
    \ it for whatever reason. See the sample below to see how it is used.\nIt worth\
    \ noting that the console.count() function returns the current count each time\
    \ the same piece of code is performed.\n\nconsole.memory()\nIf you need a fast\
    \ snapshot of your memory usage, you may access the JavaScript heap size using\
    \ the console.memory property.\nThis can come useful if you suspect a performance\
    \ leak while the code is running and want to get a brief snapshot of the memory\
    \ usage on the console.\n\nconsole.time()\nThe control.time() function launches\
    \ a timer on the console.\n\n```\nvar i;\nconsole.time(\"test1\");\nfor (i = 0;\
    \ i < 1000000000; i++) {\n  // some code\n}\nconsole.timeEnd(\"test1\");\nVM732:test1:\
