  md: "# React Native Modules ■ 185\n\nIt is worth noting that for a Java class to\
    \ be considered a Native Module by React Native, it must only extend the BaseJavaModule\
    \ class or implement the NativeModule interface.\n\nHowever, as stated, we recommend\
    \ that you utilize ReactContextJavaModule. ReactContextJavaModule grants Native\
    \ access to the ReactAppContext (RAC), which is handy for hooking into activity\
    \ lifecycle functions.\n\nUsing ReactContextJavaModule will also make future type\
    \ safety of your native module easy. For native module type safety, which will\
    \ be available in future versions, React Native examines the JavaScript spec for\
    \ each native module and constructs an abstract base class that extends ReactContextJavaModule.\n\
    \n# Module Name\n\nThe getName() function must be implemented by all native modules\
    \ in Android. This function returns a string that reflects the native module's\
    \ name. The name of native module may then be used to access it in JavaScript.\
    \ In the code below, for example, getName() yields \"CalendarModule.\"\n\n```\n\
    // add to CalendarModule.java\n@Override\npublic String getName() {\n    return\
