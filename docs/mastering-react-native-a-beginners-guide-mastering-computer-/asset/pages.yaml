    is used to generate real OpenGL commands used to map your UI.


    PROCESS INVOLVED IN WORKING OF REACT NATIVE


    1\. At the beginning of the application, the main cable starts working


    and starts loading JS loads.


    2\. If the JavaScript code is successfully uploaded, the main thread sends


    it to another JS thread because when JS performs heavy calculations,


