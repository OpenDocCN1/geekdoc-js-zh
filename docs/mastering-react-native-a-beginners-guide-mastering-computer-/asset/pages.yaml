    USING THE NAVIGATOR


    React Navigation is one of the well-known React navigation frameworks.


    In this session, we will go over the principles of React Native navigation,


    show you how to get started with React Navigation in a React Native proj­


    ect, and walk through many React Native navigation examples.


    React Navigation is developed in JavaScript and does not directly use


    iOS and Android’s native navigation APIs. It instead recreates a subset of


    those APIs. Tis enables the integration of third-party JS plugins, maxi­


    mum customization, and simpler debugging without the need to learn


    Objective-C, Swif, Java, Kotlin, and other programming languages.


    React Navigation 5.0


    So the time of writing, the most stable version of React Navigation is


    React Navigation 5.0, which was published in February 2020\. Te current


    update, according to the React Navigation blog, seeks to make the core


    React Navigation library and API more dynamic.


    React Navigation 5.0 includes the following signifcant modifcations


    and new features:


    • Confguration is dynamic and component based.


    • UseNavigation, useRoute, and useNavigationState are new hooks for


    typical use cases.


    • A new setOptions method that simplifes specifying screen naviga­


    tion options.


    • Teme system has been redesigned to allow for greater


    personalization.


    • TypeScript provides frst-rate autocompletion and type-checking.


    • Integration of Redux DevTools.


    • Native stack navigator that navigates with react-native-screens by


    utilizing native navigation primitives.


    • New Material top tab navigator backends based on react-native­


    viewpager and ScrollView.


