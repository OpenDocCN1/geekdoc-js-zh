    UI thread FPS. You may not notice the efect until afer the onPress method


    has returned. Tis might happen if onPress performs a setState that causes


    a lot of work and a few frames to be lost. A solution is to encapsulate any


    activity within your onPress handler with requestAnimationFrame:


    handleOnPress() {


    requestAnimationFrame(() => {


    this.doExpensiveAction();


    });


    }


    *Slow Navigator Transitions*


    Te JavaScript thread, as previously stated, controls Navigator anima­


