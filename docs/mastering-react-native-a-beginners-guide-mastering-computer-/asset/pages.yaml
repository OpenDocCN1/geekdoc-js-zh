    *JS FPS Plunges When Re-rendering View That Hardly*


    *Changes (“Performance Overview React Native”)*


    If you use a ListView, you must provide a rowHasChanged method, which


    helps save time by immediately assessing whether a row must be re-ren­


    dered. If you are working with immutable data structures, all you would


    need is a reference equality check.


    Similarly, you can use shouldComponentUpdate to specify the condi­


    tions under which you want the component to re-render. You may use


    PureComponent to perform this for you if you develop pure components


    (where the return result of the render method is fully based on props and


    state). Immutable data structures are important again to keep things fast – if


    you need to execute a thorough comparison of a huge list of objects, re-ren­


    dering your whole component may be faster, and it will surely need less code.


    *Dropping the FPS of the JS Thread Since I’m Performing a*


    *Lot of Work on the JavaScript Thread at the Same Time*


    Te most typical expression of this is “slow Navigator transitions,” but


    it can occur at other times as well. InteractionManager can be a useful


    option, but if the cost of the user experience is too great to postpone work


    during an animation, you should choose LayoutAnimation.


    Te Animated API currently calculates each keyframe on the


    JavaScript thread unless you specify useNativeDriver: true, whereas


    LayoutAnimation uses Core Animation and is unafected by JS thread


    and main thread frame drops.


    One example is animating in a modal (sliding down from the top and


    fading in a translucent overlay) while initializing and getting responses


    for numerous network queries, displaying the contents of the modal,


    and updating the view from whence the modal was launched. For addi­


    tional details on how to use LayoutAnimation, see the Animations


    documentation.


    Caveats


    • LayoutAnimation is only used for fre-and-forget animations


    (also known as “static” animations); if it has to be interrupted, use


    Animated.


    *Moving View on the Screen (Scrolling, Rotating, or*


    *Translating) Reduces the FPS of the UI Thread*


    Tis is especially true when text with a transparent backdrop is placed on


    top of an image or in any other case where alpha compositing is necessary'
