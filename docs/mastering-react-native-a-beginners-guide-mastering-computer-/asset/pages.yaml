    The React Native Stack Navigator


    React Navigation is written in JavaScript and allows you to develop com­


    ponents and navigation patterns that look and feel like they are native to


    the platform.


    React Navigation employs a stack navigator to handle a user’s naviga­


    tion history and the presentation of the relevant screen based on the route


    taken inside the app. At any one moment, a user is only shown one screen.


    Consider a stack of paper; navigating to a new screen adds it to the


    stack, and navigating back removes it. Te stack navigator also includes


    transitions and motions that are like those seen on native iOS and Android


    devices. It should note that an app can have many stack navigators.


    React Native Navigation Examples


