    Common Sources of Performance Problems


    *Running in Development Mode (dev=true)*


    When operating in dev mode, JavaScript thread performance falls. Tis


    is unavoidable: much more work must be done at runtime to give you


    useful warnings and error messages, such as verifying propTypes and


    numerous other assertions. Be careful to always test performance in


    release builds.


    *Using console.log Statements*


    Tese statements can cause a signifcant slowdown in the JavaScript


    thread while executing a packaged program. Tis includes debugging


    library calls like redux-logger, so be sure to remove them before bun­


    dling. You can also delete all console.* calls with this babel plugin.


    You must frst install it using NPM I babel-plugin-transform-remove­


    console – save-dev before editing the .babelrc fle in your project direc­


    tory as follows:


    {


    “env”: {


    “production”: {


    “plugins”: [“transform-remove-console”]


    }


    }


    }


    Tis will delete all console.* calls from your project’s release (produc­


    tion) versions.


    *ListView Initial Rendering Is Slow or Scroll*


    *Performance Is Bad for Large Lsts*


    Instead, use the new FlatList or SectionList components. Aside from sim­


    plifying the API, the new list components feature considerable efciency


    improvements, the most notable of which is near-constant memory use for


    whatever number of rows.


    If your FlatList is taking too long to render, make sure you have used


