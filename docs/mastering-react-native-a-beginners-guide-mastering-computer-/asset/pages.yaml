  md: '**308** ◾ Appraisal


    To further complicate matters, go to your app’s developer menu and


    enable the Show Perf Monitor option. Tere are two distinct frame rates


    to observe.


    *JS Frame Rate (JavaScript Thread)*


    Your business logic will be executed on the JavaScript thread in most


    React Native applications. Tis is where your React application sits, where


    API calls are performed, touch events are handled, and so on. Unless you


    specify useNativeDriver: true, the Animated API presently calculates each


    keyframe on the JavaScript thread, whereas LayoutAnimation utilises


    Core Animation and is unafected by JS thread and main thread frame


    drops. If the JavaScript thread is not responsive for a frame, the frame is


    deemed dropped. For example, if you used this.setState on the root com­


    ponent of a complicated application and it resulted in the re-rendering


    of computationally expensive component subtrees, it is possible that this


    might take 200 ms and result in the loss of 12 frames. During that period,


    any JavaScript-controlled animations would appear to freeze. Te user


    will notice if anything takes more than 100 ms.


    Tis frequently occurs during Navigator transitions: when you push a


    new route, the JavaScript thread must render all the scene’s components


    to send the right commands to the native side to generate the supporting


    views. Because the JavaScript thread controls the transition, it is common


