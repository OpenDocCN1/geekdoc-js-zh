    LIFE AND READINESS TO TEST


    In some cases, our requests may not be answered or may be delayed dur­


    ing the presentation. Lifetime Use and Readiness Testing allows Beletto


    to control app life in the Pod container and force re-responding of the


    unresponsive app container. It is to allow sufcient time for the Readiness


    Probe to fail a few times before passing, and only to check the Liveness


    Probe. Otherwise we may be caught in endless re-creation – loop failure,


    as the container may not reach the right situation. Liveness Probes can be


    set by specifying the Liveness command, Liveness HTTP request, or TCP


    Liveness probe.


    Useful if the app crashes into a deadlock or crashes suddenly. In that


    case, the container will no longer work and may restart the container to


    make the request available again. For example, liveliveness command


    checks for fle / tmp / health presence.


