    CHOOSING A TOUCH MANAGEMENT METHOD


    You should decide when to use the touch and APIs discussed in this sec­


    tion. It depends on what you want to build. To give the user a basic response


    and to indicate that the button or other element is “touching,” use the


    <TouchableHighlight> section. To use your custom touch links, use the


    green GestureResponder system, or PanResponder. Chances are you will


    always love the PanResponder method because it also gives you access to


    the simple touch events ofered by the GestureResponder system. If you


    begin designing a game, or an application with interactions, then you need


    to spend time building the interaction you want by using these APIs.


    For other applications, you do not need to implement any custom touch


    handling with either the Gesture Responder system or the PanResponder.


    In the next section, we have looked at some of the higher-level components


    that implement common UI patterns for you.'
