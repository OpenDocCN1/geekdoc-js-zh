    *console.count()*


    Tis is handy if you have the same piece of code running numerous times


    and want to keep track of it for whatever reason. See the sample below to


    see how it is used.


    It is worth noting that the console.count() function returns the current


    count each time the same piece of code is performed.


    *console.memory*


    If you need a fast snapshot of your memory use, you may access the


    JavaScript heap size using the console.memory property.


    Tis can come in useful if you suspect a performance leak while the


    code is running and want to get a brief snapshot of the memory usage on


    the console.


