    I


    n the previous chapter, we learned about deploying Android appli­


    cations and a variety of associated topics; in this chapter, we will learn


    about appraisal.


    PERFORMANCE OVERVIEW


    Te ability to achieve 60 frames per second and a native appearance and


    feel for your apps is a strong incentive to use React Native instead of


    WebView-based solutions. We might want React Native to do the proper


    thing and help you focus on your app rather than performance optimiza­


    tion where possible, but there are some areas where we are not yet there,


    and others where React Native (like writing native code directly) cannot


    determine the best way to optimise for you and so manual intervention


    will be required. We do our best to provide buttery-smooth UI perfor­


    mance by default, but this is not always possible.


    Tis tutorial is meant to educate you on some fundamentals to assist


    you in troubleshooting performance difculties, as well as to explain typi­


    cal sources of problems and proposed remedies.


    What You Need to Know about Frames


    For a reason, your grandparents’ generation referred to movies as “moving


    pictures”: genuine motion in video is an illusion manufactured by rapidly


    changing static images at a steady speed. Each of these photos is referred


    to as a frame. Te number of frames presented per second has a direct


    infuence on how smooth and lifelike a video appears to be. iOS devices


    show 60 frames per second, giving you and the UI system about 16.67


    ms to do all work required to build the static picture that the user will


    view on the screen during that period. If you are unable to complete the


    work required to create that frame within the permitted 16.67ms, you will


    “drop a frame” and the UI will become unresponsive.


    **307**'
