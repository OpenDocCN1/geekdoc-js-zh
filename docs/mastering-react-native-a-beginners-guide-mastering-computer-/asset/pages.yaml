    any time.


    3\. When the React starts delivering, the Reconciler starts to “vary”,


    and when it produces a new DOM (structure), it sends changes to


    another series (Shadow Cable).


    4\. Te shadow string calculates the structure and sends the parame­


    ters/properties of the structure to the main sequence (UI). (Here you


    are wondering why we call it “shadow”? Because it produces shade


    nodes.)


    5\. Since only the main thread is able to render something on the screen,


    the shadow string must send the generated structure to the main


    series, and then the UI renders.


