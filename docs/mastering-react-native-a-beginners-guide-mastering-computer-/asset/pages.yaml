    You can request an accelerated review if you’re on a tight deadline and


    need to time your release with a certain event or if you need to release a


    new version with an urgent bug patch.


    *If Your Application Has Been Rejected*


    Before you can resubmit your app for evaluation, you’ll need to make


    the necessary changes. If you have any questions, use the Resolution


    Center in App Store Connect to contact Apple. If you think your app was


    wrongfully denied, you have the option to escalate the situation and fle


    an appeal.


    Performance is one of the most prevalent grounds for rejection from


    the Apple App Store. Make sure your program is fnished, that you’ve


    thoroughly tested it, and that all bugs have been fxed. Using a bug report­


    ing tool during beta testing will lessen the likelihood of your app being


    rejected due to performance issues.


    *If Your Application Has Been Approved*


    Congratulations! You’ve arrived at the App Store. App Store Connect


    allows you to see downloads, sales, ratings, and reviews immediately.


