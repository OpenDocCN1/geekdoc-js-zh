    combination of <Navigator> and multiple <ListView> components. Te


    Dropbox app also uses Navigator.


    <Navigator> allows your application to switch between diferent


    screens (commonly referred to as “scenes”), while keeping “multiple”


    routes, so you can push, pop, or rotate regions. You can think as similar to


    the history API on the web. “Route” is the screen title, which corresponds


    to the index.


    For example, in the Settings application, initially, the stack is empty. If


    you select one of the submenus, the frst group is pushed into the stack.


