    of 320) and eventually settling at an x-ofset of 0\. Te JavaScript thread


    must deliver a new x-ofset to the main thread every frame throughout


    this transition. If the JavaScript thread is locked, it is unable to do so,


    resulting in no update on that frame and the animation stuttering.


    Allowing JavaScript-based animations to be ofoaded to the main


