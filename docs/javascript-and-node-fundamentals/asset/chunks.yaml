    73             name:appleName\n74           })[0].attributes);\n75         },1000);\n\
    76 \n77       },\n78 \n79       render: function(appleName){\n80         var appleHtml\
    \ = this.template(this.model);\n81         $('body').html(appleHtml);\n82    \
    \   },\n83       showSpinner: function(){\n84         $('body').html(this.templateSpinner);\n\
    85       }\n86 \n87     });\n88     $(document).ready(function(){\n89       app\
    \ = new router;\n90       Backbone.history.start();\n91     })\n92 \n93   </script>\n\
    94 </head>\n95 <body>\n96   <a href=\"#apples/fuji\">fuji</a>\n97   <div></div>\n\
    98 </body>\n99 </html>\n```\n\n### 3.6 Backbone.js Views and Subviews with Underscore.js\n\
    \nThis example is available at [rpjs/backbone/subview](https://github.com/azat-co/rpjs/tree/master/backbone/subview).\n\
    \nSubviews are Backbone Views that are created and used inside of another Backbone\
    \ View. A subviews concept is a great way to abstract (separate) UI events (e.g.,\
    \ clicks) and templates for similarly structured elements (e.g., apples).\n\n\
    A use case of a Subview might include a row in a table, a list item in a list,\
    \ a paragraph, a new line, etc.\n\nWe’ll refactor our home page to show a nice\
    \ list of apples. Each list item will have an apple name and a “buy” link with\
    \ an `onClick` event. Let’s start by creating a subview for a single apple with\
    \ our standard Backbone `extend()` function:\n\n```\n 1   ...\n 2   var appleItemView\
    \ = Backbone.View.extend({\n 3     tagName: 'li',\n 4     template: _.template(''\n\
    \ 5            +'<a href=\"#apples/<%=name%>\" target=\"_blank\">'\n 6       \
    \    +'<%=name%>'\n 7           +'</a>&nbsp;<a class=\"add-to-cart\" href=\"#\"\
    >buy</a>'),\n 8     events: {\n 9       'click .add-to-cart': 'addToCart'\n10\
    \     },\n11     render: function() {\n12       this.$el.html(this.template(this.model.attributes));\n\
    13     },\n14     addToCart: function(){\n15       this.model.collection.trigger('addToCart',\
    \ this.model);\n16     }\n17   });\n18   ...\n```\n\nNow we can populate the object\
    \ with `tagName`, `template`, `events`, `render` and `addToCart` properties/methods.\n\
    \n```\n1   ...\n2   tagName: 'li',\n3   ...\n```\n\n`tagName` automatically allows\
    \ Backbone.js to create an HTML element with the specified tag name, in this case\
    \ `<li>` — list item. This will be a representation of a single apple, a row in\
    \ our list.\n\n```\n1   ...\n2   template: _.template(''\n3          +'<a href=\"\
    #apples/<%=name%>\" target=\"_blank\">'\n4         +'<%=name%>'\n5         +'</a>&nbsp;<a\
    \ class=\"add-to-cart\" href=\"#\">buy</a>'),\n6   ...\n```\n\nThe template is\
    \ just a string with Undescore.js instructions. They are wrapped in `<%` and `%>`\
    \ symbols. `<%=` simply means print a value. The same code can be written with\
    \ backslash escapes:\n\n```\n1   ...\n2   template: _.template('\\\n3        \
    \  <a href=\"#apples/<%=name%>\" target=\"_blank\">\\\n4         <%=name%>\\\n\
    5         </a>&nbsp;<a class=\"add-to-cart\" href=\"#\">buy</a>\\\n6         '),\n\
    7   ...\n```\n\nEach `<li>` will have two anchor elements (`<a>`), links to a\
    \ detailed apple view (`#apples/:appleName`) and a `buy` button. Now we’re going\
    \ to attach an event listener to the `buy` button:\n\n```\n1   ...\n2   events:\
    \ {\n3     'click .add-to-cart': 'addToCart'\n4   },\n5   ...\n```\n\nThe syntax\
    \ follows this rule:\n\n```\n1 event + jQuery element selector: function name\n\
    ```\n\nBoth the key and the value (right and left parts separated by the colon)\
    \ are strings. For example:\n\n```\n1 'click .add-to-cart': 'addToCart'\n```\n\
    \nor\n\n```\n1 'click #load-more': 'loadMoreData'\n```\n\nTo render each item\
    \ in the list, we’ll use the jQuery `html()` function on the `this.$el` jQuery\
    \ object, which is the `<li>` HTML element based on our `tagName` attribute:\n\
    \n```\n1   ...\n2   render: function() {\n3     this.$el.html(this.template(this.model.attributes));\n\
    4   },\n5   ...\n```\n\nThe `addToCart` method will use the `trigger()` function\
    \ to notify the collection that this particular model (apple) is up for the purchase\
    \ by the user:\n\n```\n1   ...\n2     addToCart: function(){\n3       this.model.collection.trigger('addToCart',\
    \ this.model);\n4     }\n5   ...\n```\n\nHere is the full code of the `appleItemView`\
    \ Backbone View class:\n\n```\n 1   ...\n 2   var appleItemView = Backbone.View.extend({\n\
    \ 3     tagName: 'li',\n 4     template: _.template(''\n 5            +'<a href=\"\
    #apples/<%=name%>\" target=\"_blank\">'\n 6           +'<%=name%>'\n 7       \
    \    +'</a>&nbsp;<a class=\"add-to-cart\" href=\"#\">buy</a>'),\n 8     events:\
    \ {\n 9       'click .add-to-cart': 'addToCart'\n10     },\n11     render: function()\
    \ {\n12       this.$el.html(this.template(this.model.attributes));\n13     },\n\
    14     addToCart: function(){\n15       this.model.collection.trigger('addToCart',\
    \ this.model);\n16     }\n17   });\n18   ...\n```\n\nEasy peasy! But what about\
    \ the master view, which is supposed to render all of our items (apples) and provide\
    \ a wrapper `<ul>` container for `<li>` HTML elements? We need to modify and enhance\
    \ our `homeView`.\n\nTo begin with, we can add extra properties of string type\
    \ understandable by jQuery as selectors to `homeView`:\n\n```\n1   ...\n2   el:\
    \ 'body',\n3   listEl: '.apples-list',\n4   cartEl: '.cart-box',\n5   ...\n```\n\
    \nWe can use properties from above in the template, or just hard-code them (we’ll\
    \ refactor our code later) in `homeView`:\n\n```\n1   ...\n2   template: _.template('Apple\
    \ data: \\\n3     <ul class=\"apples-list\">\\\n4     </ul>\\\n5     <div class=\"\
    cart-box\"></div>'),\n6   ...\n```\n\nThe `initialize` function will be called\
    \ when `homeView` is created (`new homeView()`) — in it we render our template\
    \ (with our favorite by now `html()` function), and attach an event listener to\
    \ the collection (which is a set of apple models):\n\n```\n1   ...\n2     initialize:\
    \ function() {\n3       this.$el.html(this.template);\n4       this.collection.on('addToCart',\
    \ this.showCart, this);\n5     },\n6   ...\n```"
