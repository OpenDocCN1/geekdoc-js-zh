    \ 76       },\n 77       render: function(){\n 78         view = this; //这样我们可以在闭包内部使用\
    \ view\n 79         this.collection.each(function(apple){\n 80           var appleSubView\
    \ = new appleItemView({model:apple});\n 81           //创建一个带有 model apple 的子视图\n\
    \ 82           appleSubView.render();\n 83           //编译模板和单个苹果数据\n 84      \
    \     $(view.listEl).append(appleSubView.$el);\n 85           //将来自单个苹果\n 86 \
    \          //的 jQuery 对象附加到 apples-list DOM 元素中\n 87         });\n 88       }\n\
    \ 89     });\n 90     \n 91     var Apples = Backbone.Collection.extend({\n 92\
    \     });\n 93     \n 94     var appleView = Backbone.View.extend({\n 95     \
    \  initialize: function(){\n 96         this.model = new (Backbone.Model.extend({}));\n\
