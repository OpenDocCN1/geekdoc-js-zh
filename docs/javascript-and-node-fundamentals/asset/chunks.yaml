    The first one basically takes care of all the requests to the home page, e.g.,
    `http://localhost:3000/` and the latter of requests to `/users`, such as `http://localhost:3000/users`.
    Both of the routes process URLs case insensitively and in a same manner as with
    trailing slashes.


    The request handler itself (`index.js` in this case) is straightforward: everything
    from the HTTP request is in `req` and write results to the response in `res`:


    ```

    1 exports.list = function(req, res){

    2   res.send("respond with a resource");

    3 };

    ```


    ### 5.4 Middleware as The Backbone of Express.js


    Each line above the routes is a middleware:


    ```

    1 app.use(express.favicon());

    2 app.use(express.logger(''dev''));

    3 app.use(express.bodyParser());

    4 app.use(express.methodOverride());

    5 app.use(app.router);

    6 app.use(express.static(path.join(__dirname, ''public'')));

    ```


    The middleware is a pass thru functions that add something useful to the request
    as it travels along each of them, for example `req.body` or `req.cookie`. For
    more middleware writings check out [Intro to Express.js: Parameters, Error Handling
    and Other Middleware](http://webapplog.com/intro-to-express-js-parameters-error-handling-and-other-middleware/).


    ### 5.5 Configuration of an Express.js App


    Here is how we define configuration in a typical Express.js app:


    ```

    1 app.set(''port'', process.env.PORT || 3000);

    2 app.set(''views'', __dirname + ''/views'');

    3 app.set(''view engine'', ''jade'');

    ```


    An ordinary settings involves a name (e.g., `views`) and a value (e.g., path to
    the folder where out templates/views live). There are more than one way to define
    a certain settings, e.g, `app.enable` for boolean flags.


    ### 5.6 Jade is Haml for Express.js/Node.js


    Jade template engine is akin to Ruby on Rails’ Haml in the way it uses whitespace
    and indentation, e.g., `layout.jade`:


    ```

    1 doctype 5

    2 html

    3   head

    4     title= title

    5     link(rel=''stylesheet'', href=''/stylesheets/style.css'')

    6   body

    7     block content

    ```


    Other than that, it’s possible to utilize full-blown JavaScript code inside of
    Jade templates.


    ### 5.7 Conclusion About The Express.js Framework


    As you’ve seen, it’s effortless to create MVC web apps with Express.js. The framework
    is splendid for REST APIs as well. If you interested in them, visit the [Tutorial:
    Node.js and MongoDB JSON REST API server with Mongoskin and Express.js](http://webapplog.com/tutorial-node-js-and-mongodb-json-rest-api-server-with-mongoskin-and-express-js/)
    and [Intro to Express.js: Simple REST API app with Monk and MongoDB](http://webapplog.com/intro-to-express-js-simple-rest-api-app-with-monk-and-mongodb/).


    If you want to know what are the other middlewares and configurations, check out
    [Express.js API docs](http://expressjs.com/api.html), [Connect docs](http://www.senchalabs.org/connect/)
    and of course our book — [Express.js Guide](http://expressjsguide.com). For those
    who already familiar with some basics of Express.js, I recommend going through
    [ExpressWorks](http://webapplog.com/expressworks) — an automated Express.js workshop.


    ### 5.8 Update


    For migrating from Express.js 3.x to 4.x take a look at this guide: [Migrating
    Express.js 3.x to 4.x: Middleware, Route and Other Changes](http://webapplog.com/migrating-express-js-3-x-to-4-x-middleware-route-and-other-changes/).


    ## 6 About the Author


