    \ || 'Doe'\n 4          , email: ops.email || 'test@test.com'\n 5          , name:\
    \ function() { return this.firstName + this.lastName}\n 6          }\n 7 }\n 8\
    \ \n9 var agency = function(ops) {\n10   ops = ops || {}\n11   var agency = user(ops)\n\
    12   agency.customers = ops.customers || 0\n13   agency.isAgency = true\n14  \
    \ return agency\n15 }\n```\n\n### 1.7 约定 (Conventions)\n\n这些约定中（分号除外）大部分是风格上的，取决于个人偏好，且不影响执行。\n\
    \n#### 1.7.1 分号\n\n分号是可选的，有两种情况例外：\n\n1. 在 for 循环构造中：`for (var i=0; i++; i<n)`\n\
    2. 当新行以括号开头时\n\n#### 1.7.2 驼峰命名法 (camelCase)\n\n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\n\
    #### 1.7.3 命名 (Naming)\n\n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\n#### 1.7.4 逗号 (Comas)\n\
    \n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\n#### 1.7.5 缩进 (Indentation)\n\n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\
    \n#### 1.7.6 空格 (Spaces)\n\n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\n#### 1.7.7 模块 (Modules)\n\
    \n大部分约定是风格上的，取决于个人偏好，且不影响执行。\n\n* [CommonJS](http://www.commonjs.org/)\n* [Require.js](https://requirejs.org/)\n\
    \n[立即执行函数表达式](https://en.wikipedia.org/wiki/Immediately-invoked_function)\n\n\
    ### 1.9 立即执行函数表达式 (IIFEs)\n\n```javascript\n1 (function () {\n2 yourModule = {\n\
    3 ...\n4 };\n5 }());\n```\n\n这段代码展示了一个私有属性示例：\n\n```javascript\n 1 (function ()\
    \ {\n 2   window.boo = function() {\n 3     var _a = 1;\n 4     inc = function\
    \ () {\n 5       _a++;\n 6       console.log(_a);\n 7       return _a;\n 8   \
    \  };\n 9     return {\n10       increment: inc\n11     };\n12   }\n13 }());\n\
    14 var b = window.boo();\n15 b.increment();\n```\n\n现在尝试这个：\n\n`this` 关键字\n\n\
    在在 jQuery 中会发生变化！规则是在闭包中使用 `this` 之前将其重新赋值给局部作用域变量：\n\n```javascript\n1 var app\
    \ = this\n2 $('a').click(function(e){\n3   console.log(this) //可能是事件或目标锚点元素\n\
    4   console.log(app) //这正是我们要的！\n5   app.processData(e)\n6  })\n```\n\n*如果不确定：console.log!*\n\
    \n### 1.11 陷阱 (Pitfalls)\n\nJS 是程序员认为不应该学习的语言。像 `===` 与 `==`、全局作用域泄漏、DOM 等问题可能会以后导致问题。这就是为什么理解这种语言或使用像\
    \ CoffeeScript 这样可以解决大部分问题的工具很重要。\n\n### 1.12 进一步学习\n\n如果你喜欢这篇文章并想进一步探索 JavaScript，请查看这个非常棒的免费资源：[Eloquent\
    \ JavaScript: 现代编程导论](http://eloquentjavascript.net/)。\n\n## 2 CoffeeScript 基础：更好的\
    \ JavaScript\n\nCoffeeScript 是一种构建在 JavaScript 之上的语言。CoffeeScript 具有一些额外的优势，并且它的代码会被编译成原生\
    \ JavaScript 进行执行。CoffeeScript 的优点包括：更好的语法、函数和类构造模式、自动插入 `var`、推导式等。\n\n"
