    \      },\n\n      render: function(appleName){\n        var appleHtml = this.template(this.model);\n\
    \        $('body').html(appleHtml);\n      },\n      showSpinner: function(){\n\
    \        $('body').html(this.templateSpinner);\n      }\n\n    });\n    $(document).ready(function(){\n\
    \      app = new router;\n      Backbone.history.start();\n    })\n\n  </script>\n\
    </head>\n<body>\n  <a href=\"#apples/fuji\">fuji</a>\n  <div></div>\n</body>\n\
    </html>\n```\n\n### 3.6 Backbone.js Views and Subviews with Underscore.js\n\n\
    This example is available at [rpjs/backbone/subview](https://github.com/azat-co/rpjs/tree/master/backbone/subview).\n\
    \nSubviews are Backbone Views that are created and used inside of another Backbone\
    \ View. A subviews concept is a great way to abstract (separate) UI events (e.g.,\
    \ clicks) and templates for similarly structured elements (e.g., apples).\n\n\
    A use case of a Subview might include a row in a table, a list item in a list,\
    \ a paragraph, a new line, etc.\n\nWe’ll refactor our home page to show a nice\
    \ list of apples. Each list item will have an apple name and a “buy” link with\
    \ an `onClick` event. Let’s start by creating a subview for a single apple with\
    \ our standard Backbone `extend()` function:\n\n```javascript\n...\nvar appleItemView\
    \ = Backbone.View.extend({\n  tagName: 'li',\n  template: _.template('')\n   \
    \        +'<a href=\"#apples/<%=name%>\" target=\"_blank\">'\n           +'<%=name%>'\n\
    \           +'</a>&nbsp;<a class=\"add-to-cart\" href=\"#\">buy</a>'),\n  events:\
    \ {\n    'click .add-to-cart': 'addToCart'\n  },\n  render: function() {\n   \
    \ this.$el.html(this.template(this.model.attributes));\n  },\n  addToCart: function(){\n\
    \    this.model.collection.trigger('addToCart', this.model);\n  }\n});\n...\n\
    ```\n\nNow we can populate the object with `tagName`, `template`, `events`, `render`\
    \ and `addToCart` properties/methods.\n\n```javascript\n...\ntagName: 'li',\n\
    ...\n```\n\n`tagName` automatically allows Backbone.js to create an HTML element\
    \ with the specified tag name, in this case `<li>` — list item. This will be a\
    \ representation of a single apple, a row in our list.\n\n```javascript\n...\n\
    template: _.template('')\n         +'<a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >'\n         +'<%=name%>'\n         +'</a>&nbsp;<a class=\"add-to-cart\" href=\"\
    #\">buy</a>'),\n...\n```\n\nThe template is just a string with Undescore.js instructions.\
    \ They are wrapped in `<%` and `%>` symbols. `<%=` simply means print a value.\
    \ The same code can be written with backslash escapes:\n\n```javascript\n...\n\
    template: _.template('\\\n         <a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >\\\n         <%=name%>\\\n         </a>&nbsp;<a class=\"add-to-cart\" href=\"\
    #\">buy</a>\\\n         '),\n...\n```\n\nEach `<li>` will have two anchor elements\
    \ (`<a>`), links to a detailed apple view (`#apples/:appleName`) and a `buy` button.\
    \ Now we’re going to attach an event listener to the `buy` button:\n\n```javascript\n\
    ...\nevents: {\n  'click .add-to-cart': 'addToCart'\n},\n...\n```\n\nThe syntax\
    \ follows this rule:\n\n```javascript\nevent + jQuery element selector: function\
    \ name\n```\n\nBoth the key and the value (right and left parts separated by the\
    \ colon) are strings. For example:\n\n```javascript\n'click .add-to-cart': 'addToCart'\n\
    ```\n\nor\n\n```javascript\n'click #load-more': 'loadMoreData'\n```\n\nTo render\
    \ each item in the list, we’ll use the jQuery `html()` function on the `this.$el`\
    \ jQuery object, which is the `<li>` element based on our `tagName`:\n\n```javascript\n\
    ...\nrender: function() {\n  this.$el.html(this.template(this.model.attributes));\n\
    },\n...\n```\n\nThe `addToCart` method will use the `trigger()` function to notify\
    \ the collection that this particular model (apple) is up for purchase by the\
    \ user:\n\n```javascript\n...\naddToCart: function(){\n  this.model.collection.trigger('addToCart',\
    \ this.model);\n}\n...\n```\n\nHere is the full code of the `appleItemView` Backbone\
    \ class:\n\n```javascript\n...\nvar appleItemView = Backbone.View.extend({\n \
    \ tagName: 'li',\n  template: _.template('')\n           +'<a href=\"#apples/<%=name%>\"\
    \ target=\"_blank\">'\n           +'<%=name%>'\n           +'</a>&nbsp;<a class=\"\
    add-to-cart\" href=\"#\">buy</a>'),\n  events: {\n    'click .add-to-cart': 'addToCart'\n\
    \  },\n  render: function() {\n    this.$el.html(this.template(this.model.attributes));\n\
    \  },\n  addToCart: function(){\n    this.model.collection.trigger('addToCart',\
    \ this.model);\n  }\n});\n...\n```\n\nEasy peasy! But what about the master view,\
    \ which is supposed to render all of our items (apples) and provide a wrapper\
    \ `<ul>` container for `<li>` elements? We need to modify and enhance our `homeView`.\n\
    \nTo begin with, we can add extra properties of string type understandable by\
    \ jQuery as selectors to `homeView`:\n\n```javascript\n...\nel: 'body',\nlistEl:\
    \ '.apples-list',\ncartEl: '.cart-box',\n...\n```\n\nWe can use properties from\
    \ above in the template, or just hard-code them (we’ll refactor our code later)\
    \ in `homeView`:\n\n```javascript\n...\ntemplate: _.template('Apple data: \\\n\
    \  <ul class=\"apples-list\">\n  </ul>\\\n  <div class=\"cart-box\"></div>'),\n\
    ...\n```\n\nThe `initialize` function will be called when `homeView` is created\
    \ (`new homeView()`) — in it we render our template (with our favorite by now\
    \ `html()` function), and attach an event listener to the collection (which is\
    \ a set of apple models):\n\n```javascript\n...\ninitialize: function() {\n  this.$el.html(this.template);\n\
    \  this.collection.on('addToCart', this.showCart, this);\n},\n...\n```\n"
