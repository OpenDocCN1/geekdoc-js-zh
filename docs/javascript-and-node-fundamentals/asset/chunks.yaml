    第一个路由基本上处理所有指向首页的请求，例如 `http://localhost:3000/`；后者处理指向 `/users` 的请求，例如 `http://localhost:3000/users`。这两个条路由在处理
    URL 时均不区分大小写，并且处理末尾斜线的方式相同。


    请求处理程序本身（在此例中为 `index.js`）非常直观：HTTP 请求中的所有内容都在 `req` 中，并将结果写入响应 `res` 中：


    ```

    1 exports.list = function(req, res){

    2   res.send("respond with a resource");

    3 };

    ```


    ### 5.4 中间件作为 Express.js 的核心


    路由上面的每一行都是中间件：


    ```

    1 app.use(express.favicon());

    2 app.use(express.logger(''dev''));

    3 app.use(express.bodyParser());

    4 app.use(express.methodOverride());

    5 app.use(app.router);

    6 app.use(express.static(path.join(__dirname, ''public'')));

    ```


    中间件是透传函数，当请求通过每个中间件时，会向请求中添加有用的内容，例如 `req.body` 或 `req.cookie`。更多关于中间件的编写请查看 [Express.js
    简介：参数、错误处理和其他中间件](http://webapplog.com/intro-to-express-js-parameters-error-handling-and-other-middleware/)。


    ### 5.5 Express.js 应用的配置


    以下是我们在典型的 Express.js 应用中定义配置的方式：


    ```

    1 app.set(''port'', process.env.PORT || 3000);

    2 app.set(''views'', __dirname + ''/views'');

    3 app.set(''view engine'', ''jade'');

    ```


    普通的设置涉及一个名称（例如 `views`）和一个值（例如模板/视图所在文件夹的路径）。定义特定设置有多种方法，例如用于布尔标志的 `app.enable`。


    ### 5.6 Jade 是适用于 Express.js/Node.js 的 Haml


    Jade 模板引擎在利用空格和缩进方面与 Ruby on Rails 的 Haml 相似，例如 `layout.jade`：


    ```

    1 doctype 5

    2 html

    3   head

    4     title= title

    5     link(rel=''stylesheet'', href=''/stylesheets/style.css'')

    6   body

    7     block content

    ```


    除此之外，还可以在 Jade 模板内部利用完整的 JavaScript 代码。


    ### 5.7 关于 Express.js 框架的总结


    如你所见，使用 Express.js 创建 MVC Web 应用是轻而易举的。该框架对于 REST API 同样出色。如果你感兴趣，请访问 [教程：使用 Mongo
    和 Express.js 构建 Node.js 和 MongoDB JSON REST API 服务器](http://webapplog.com/tutorial-node-js-and-mongodb-json-rest-api-server-with-mongoskin-and-express-js/)
    和 [Express.js 简介：使用 Monk 和 MongoDB 构建简单 REST API 应用](http://webapplog.com/intro-to-express-js-simple-rest-api-app-with-monk-and-mongodb/)。


    如果你想了解其他中间件和配置，请查看 [Express.js API 文档](http://expressjs.com/api.html)、[Connect
    文档](http://www.senchalabs.org/connect/)，当然还有我们的书籍——[Express.js Guide](http://expressjsguide.com)。对于那些已经熟悉
    Express.js 基础的人，我推荐阅读 [ExpressWorks](http://webapplog.com/expressworks)。


