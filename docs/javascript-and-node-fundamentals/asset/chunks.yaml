    \ JavaScript\n    *   2.1 分号、空格和括号\n    *   2.2 Vars\n    *   2.3 条件\n    *  \
    \ 2.4 函数\n    *   2.5 类\n    *   2.6 数组与切片\n    *   2.7 展开运算符 (Splats)\n    *\
    \   2.8 推导式\n    *   2.9 结论\n*   3 Backbone.js 基础：JavaScript MV* 框架的基石\n    *\
    \   3.1 典型的 Backbone.js 应用结构\n    *   3.2 从零开始搭建 Backbone.js 应用\n    *   3.3 Backbone.js\
    \ 项目的依赖\n    *   3.4 与 Backbone.js 集合操作\n    *   3.5 使用 Backbone.js 和 jQuery 进行事件绑定\n\
    \    *   3.6 使用 Underscore.js 的 Backbone.js 视图与子视图\n    *   3.7 超简单的 Backbone\
    \ 启动包\n    *   3.8 结论\n*   4 Node.js 基础：服务器端的 JavaScript\n    *   4.1 读-求-打印循环（即\
    \ Node.js Console）\n    *   4.2 启动 Node.js 脚本\n    *   4.3 Node.js 进程 (Process\n\
    \    *   4.4 Node.js 中的全局作用域\n    *   4.5 模块的导出与导入\n    *   4.6 Buffer 是 Node.js\
    \ 的类型\n    *   4.7 __dirname 与 process.cwd\n    *   4.8 Node.js 中的实用工具\n    *\
