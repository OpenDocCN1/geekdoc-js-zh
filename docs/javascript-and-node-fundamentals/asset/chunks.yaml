    \n      },\n      initialize: function(){\n        var apples = new Apples();\n\
    \        apples.reset(appleData);\n        this.homeView = new homeView({collection:\
    \ apples});\n        this.appleView = new appleView({collection: apples});\n \
    \     },\n      home: function(){\n        this.homeView.render();\n      },\n\
    \      loadApple: function(appleName){\n        this.appleView.loadApple(appleName);\n\
    \      }\n    });\n\n    var homeView = Backbone.View.extend({\n      el: 'body',\n\
    \      template: _.template('Apple data: <%= data %>'),\n      render: function(){\n\
    \        this.$el.html(this.template({\n          data: JSON.stringify(this.collection.models)\n\
    \        }));\n      }\n      //TODO subviews\n    });\n\n    var Apples = Backbone.Collection.extend({\n\
    \n    });\n    var appleView = Backbone.View.extend({\n      initialize: function(){\n\
    \        this.model = new (Backbone.Model.extend({}));\n        this.model.on('change',\
    \ this.render, this);\n        this.on('spinner',this.showSpinner, this);\n  \
    \    },\n      template: _.template('<figure>\\\n                <img src=\"<%=\
    \ attributes.url %>\"/>\\\n                <figcaption><%= attributes.name %></figcaption>\\\
    \n                </figure>'),\n      templateSpinner: '<img src=\"img/spinner.gif\"\
    \ width=\"30\"/>',\n\n      loadApple:function(appleName){\n        this.trigger('spinner');\n\
    \        var view = this; //we'll need to access\n        //that inside of a closure\n\
    \        setTimeout(function(){ //simulates real time\n        //lag when fetching\
    \ data from the remote server\n          view.model.set(view.collection.where({\n\
    \            name:appleName\n          })[0].attributes);\n        },1000);\n\
    \      },\n\n      render: function(appleName){\n        var appleHtml = this.template(this.model);\n\
    \        $('body').html(appleHtml);\n      },\n      showSpinner: function(){\n\
    \        $('body').html(this.templateSpinner);\n      }\n\n    });\n    $(document).ready(function(){\n\
    \      app = new router;\n      Backbone.history.start();\n    })\n\n  </script>\n\
    </head>\n<body>\n  <a href=\"#apples/fuji\">fuji</a>a\n  <div></div>\n</body>\n\
    </html>\n```\n\n### 3.6 结合 Underscore.js 的 Backbone.js 视图子视图\n\n此示例可以在 [rpjs/backbone/subview](https://github.com/azat-co/rpjs/tree/master/backbone/subview)\
    \ 获取。\n\n子视图（Subviews）是在另一个 Backbone View 内部创建并使用的 View。子视图概念是抽象（分离）UI 事件（例如点击）以及针对结构相似元素（例如苹果）模板的极佳方法。\n\
    \n子视图的用例可能表格中的行、列表中的列表项、段落、新行等。\n\n我们将重构主页以显示一个精美的苹果列表。每个列表项都将有一个苹果名称和一个带有 `onClick`\
    \ 事件的“购买”链接。让我们先通过使用标准的 Backbone `extend()` 函数为单个苹果创建一个子视图：\n\n```javascript\n\
    ...\nvar appleItemView = Backbone.View.extend({\n  tagName: 'li',\n  template:\
    \ _.template('')\n           +'<a href=\"#apples/<%=name%>\" target=\"_blank\"\
    >'\n           +'<%=name%>'\n           +'</a>&nbsp;<a class=\"add-to-cart\" href=\"\
    #\">buy</a>'),\n  events: {\n    'click .add-to-cart': 'addToCart'\n  },\n  render:\
    \ function() {\n    this.$el.html(this.template(this.model.attributes));\n  },\n\
    \  addToCart: function(){\n    this.model.collection.trigger('addToCart', this.model);\n\
    \  }\n});\n...\n```\n\n现在我们可以填充对象 `tagName`、`template`、`events`、`render` 和 `addToCart`\
    \ 属性/方法。\n\n```javascript\n...\ntagName: 'li',\n...\n```\n\n`tagName` 自动允许 Backbone.js\
    \ 创建带有指定标签名的 HTML 元素，在这种情况下是 `<li>` —— 列表项。这将是单个苹果的表示，即我们列表中的行。\n\n```javascript\n\
    ...\ntemplate: _.template('')\n         +'<a href=\"#apples/<%=name%>\" target=\"\
    _blank\">'\n         +'<%=name%>'\n         +'</a>&nbsp;<a class=\"add-to-cart\"\
    \ href=\"#\">buy</a>'),\n...\n```\n\n模板只是一个带有 Underscore.js 指令的字符串。它们被封装在 `<%`\
    \ 和 `%>` 符号中。`<%=` 仅仅意味着打印值。相同的代码可以使用反斜杠转义编写：\n\n```javascript\n...\ntemplate:\
    \ _.template('\\\n         <a href=\"#apples/<%=name%>\" target=\"_blank\">\\\n\
    \         <%=name%>\\\n         </a>&nbsp;<a class=\"add-to-cart\" href=\"#\"\
    >buy</a>\\\n         '),\n...\n```\n\n每个 `<li>` 将有两个锚点元素（`<a>`），分别指向详细苹果视图的链接（#apples/:appleName`）和一个“购买”按钮。现在我们将为“购买”按钮绑定事件监听器：\n\
    \n```javascript\n...\nevents: {\n  'click .add-to-cart': 'addToCart'\n},\n...\n\
    ```\n\n该语法遵循此规则：\n\n```javascript\n事件 + jQuery 元素选择器: 函数名\n```\n\n键和值（由冒号分隔的左右部分）都是字符串。例如：\n\
    \n```javascript\n'click .add-to-cart': 'addToCart'\n```\n\n或者\n\n```javascript\n\
    'click #load-more': 'loadMoreData'\n```\n\n要渲染列表中的每个项目，我们将对 `this.$el` 使用 jQuery\
    \ 的 `html()` 函数，它是基于我们的 `tagName` 的 jQuery 元素：\n\n```javascript\n...\nrender:\
    \ function() {\n  this.$el.html(this.model.attributes));\n},\n...\n```\n\n`addToCart`\
    \ 方法将使用 `trigger()` 通知集合该特定模型（苹果）供用户购买：\n\n```javascript\n...\naddToCart: function(){\n\
    \  this.model.collection.trigger('addToCart', this.model);\n}\n...\n```\n\n这是\
    \ `appleItemView` Backbone 类的完整代码：\n\n```javascript\n...\nvar appleItemView =\
    \ Backbone.View.extend({\n  tagName: 'li',\n  template: _.template('')\n     \
    \      +'<a href=\"#apples/<%=name%>\" target=\"_blank\">'\n           +'<%=name%>'\n\
    \           +'</a>&nbsp;<a class=\"add-to-cart\" href=\"#\">buy</a>'),\n  events:\
    \ {\n    'click .add-to-cart': 'addToCart'\n  },\n  render: function() {\n   \
    \ this.$el.html(this.template(this.model.attributes));\n  },\n  addToCart: function(){\n\
    \    this.model.collection.trigger('addToCart', this.model);\n  }\n});\n...\n\
    ```\n\n轻而易举！但是那个应该渲染我们所有项目（苹果）并为 `<li>` 元素提供 `<ul>` 容器的主视图呢？我们需要修改并增强我们的 `homeView`。\n\
    \n首先，我们可以为 `homeView` 添加可被 jQuery 选择器识别的字符串类型额外属性：\n\n```javascript\n...\nel:\
    \ 'body',\nlistEl: '.apples-list',\ncartEl: '.cart-box',\n...\n```\n\n我们可以在模板中使用上述属性，或者直接在\
    \ `homeView` 中硬编码（我们稍后会重构代码）：\n\n```javascript\n...\ntemplate: _.template('Apple\
    \ data: \\\n  <ul class=\"apples-list\">\n  </ul>\\\n  <div class=\"cart-box\"\
    ></div>'),\n...\n```\n\n`initialize` 函数将在 `homeView` 创建（`new homeView()`）时被调用\
    \ —— 在其中我们渲染模板（使用我们现在最喜欢的 `html()` 函数），并为集合（一组苹果模型）附加事件监听器：\n\n```javascript\n\
    ...\ninitialize: function() {\n  this.$el.html(this.template);\n  this.collection.on('addToCart',\
    \ this.showCart, this);\n},\n...\n```\n\n"
- fmt: "\nThe syntax for the binding event is covered in the previous section. In\
