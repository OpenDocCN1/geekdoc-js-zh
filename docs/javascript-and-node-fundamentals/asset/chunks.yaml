    img/fuji.jpg\"\n 5     },\n 6     {\n 7       name: \"gala\",\n 8       url: \"\
    img/gala.jpg\"\n 9     }\n10   ];\n```\n\nGrab the images (see picture below)\
    \ from GitHub: [https://github.com/azat-co/rpjs/tree/master/backbone/collections/img](https://github.com/azat-co/rpjs/tree/master/backbone/collections/img),\
    \ or add your own.\n\n![Fuji apple illustration](images/fuji.jpg)\n\nFuji apple\
    \ illustration\n\n![Gala apple illustration](images/gala.jpg)\n\nGala apple illustration\n\
    \nThis is our apple *database*. :-) Or to be more accurate, our REST API endpoint-substitute,\
    \ which provides us with names and image URLs of the apples (data models). If\
    \ you want some real-world servers, you can use:\n\n*   [Parse.com](http://parse.com):\
    \ back-end-as-a-service provider\n\n*   [Node.js and MongoDB REST API](http://webapplog.com/express-js-4-node-js-and-mongodb-rest-api-tutorial/):\
    \ a free-JSON API built with Node.js, Express.js and MongoDB\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThis mock dataset can be easily substituted by assigning\
    \ REST API endpoints of your back-end to `url` properties in Backbone.js Collections\
    \ and/or Models, and calling the `fetch()` method on them. |\n\nNow to make the\
    \ User Experience (UX) a little bit better, we can add a new route to the `routes`\
    \ object in the Backbone Route:\n\n```\n1   ...\n2   routes: {\n3     '': 'home',\n\
    4     'apples/:appleName': 'loadApple'\n5   },\n6   ...\n```\n\nThis will allow\
    \ users to go to `index.html#apples/SOMENAME` and expect to see some information\
    \ about an apple. This information will be fetched and rendered by the `loadApple`\
    \ function in the Backbone Router definition:\n\n```\n1   loadApple: function(appleName){\n\
    2     this.appleView.render(appleName);\n3   }\n```\n\nHave you noticed an `appleName`\
    \ variable? It’s exactly the same name as the one that we’ve used in `route`.\
    \ This is how we can access query string parameters (e.g., `?param=value&q=search`)\
    \ in Backbone.js.\n\nNow we’ll need to refactor some more code to create a Backbone\
    \ Collection, populate it with data in our `appleData` variable, and to pass the\
    \ collection to `homeView` and `appleView`. Conveniently enough, we do it all\
    \ in the Router constructor method `initialize`:\n\n```\n1   initialize: function(){\n\
    2     var apples = new Apples();\n3     apples.reset(appleData);\n4     this.homeView\
    \ = new homeView({collection: apples});\n5     this.appleView = new appleView({collection:\
    \ apples});\n6   },\n```\n\nAt this point, we’re pretty much done with the Router\
    \ class, and it should look like this:\n\n```\n 1   var router = Backbone.Router.extend({\n\
    \ 2     routes: {\n 3       '': 'home',\n 4       'apples/:appleName': 'loadApple'\n\
    \ 5     },\n 6     initialize: function(){\n 7       var apples = new Apples();\n\
    \ 8       apples.reset(appleData);\n 9       this.homeView = new homeView({collection:\
    \ apples});\n10       this.appleView = new appleView({collection: apples});\n\
    11     },\n12     home: function(){\n13       this.homeView.render();\n14    \
    \ },\n15     loadApple: function(appleName){\n16       this.appleView.render(appleName);\n\
    17     }\n18   });\n```\n\nLet’s modify our `homeView` a bit to see the whole\
    \ *database*:\n\n```\n1   var homeView = Backbone.View.extend({\n2     el: 'body',\n\
    3     template: _.template('Apple data: <%= data %>'),\n4     render: function(){\n\
    5       this.$el.html(this.template({\n6       data: JSON.stringify(this.collection.models)\n\
    7     }));\n8     }\n9   });\n```\n\nFor now, we just output the string representation\
    \ of the JSON object in the browser. This is not user-friendly at all, but later\
    \ we’ll improve it by using a list and subviews.\n\nSo far, our apple Backbone\
    \ Collection is very clean and simple:\n\n```\n1   var Apples = Backbone.Collection.extend({\n\
    2   });\n```\n\n| ![information](images/leanpub_information.png) |  \n\n### Note\n\
    \nBackbone automatically creates models inside of a collection when we use the\
    \ `fetch()` or `reset()` functions. |\n\nApple view is not any more complex; it\
    \ has only two properties: `template` and `render`. In a template, we want to\
    \ display `figure`, `img` and `figcaption` tags with specific values. The Underscore.js\
    \ template engine is handy at this task:\n\n```\n1   var appleView = Backbone.View.extend({\n\
    2     template: _.template(\n3           '<figure>\\\n4              <img src=\"\
    <%= attributes.url %>\"/>\\\n5              <figcaption><%= attributes.name %></figcaption>\\\
    \n6            </figure>'),\n7   ...\n8   });\n```\n\nTo make a JavaScript string,\
    \ which has HTML tags in it, more readable we can use the backslash line breaker\
    \ escape (`\\`) symbol, or close strings and concatenate them with a plus sign\
    \ (`+`). This is an example of `appleView` above, which is refactored using the\
    \ latter approach:\n\n```\n1   var appleView = Backbone.View.extend({\n2     template:\
    \ _.template(\n3         '<figure>'+\n4           +'<img src=\"<%= attributes.url\
    \ %>\"/>'+\n5           +'<figcaption><%= attributes.name %></figcaption>'+\n\
    6         +'</figure>'),\n7   ...\n```\n\nPlease note the ‘<%=’ and ‘%>’ symbols;\
    \ they are the instructions for Undescore.js to print values in properties `url`\
    \ and `name` of the `attributes` object.\n\nFinally, we’re adding the render function\
    \ to the `appleView` class.\n\n```\n1   render: function(appleName){\n2     var\
    \ appleModel = this.collection.where({name:appleName})[0];\n3     var appleHtml\
    \ = this.template(appleModel);\n4     $('body').html(appleHtml);\n5   }\n```\n\
    \nWe find a model within the collection via `where()` method and use `[]` to pick\
    \ the first element. Right now, the `render` function is responsible for both\
    \ loading the data and rendering it. Later we’ll refactor the function to separate\
    \ these two functionalities into different methods.\n\nThe whole app, which is\
    \ in the [rpjs/backbone/collections/index.html](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
    \ folder, looks like this:"
