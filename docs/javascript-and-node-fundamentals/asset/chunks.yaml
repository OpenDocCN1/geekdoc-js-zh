    \ 添加到购物车中（同时带有一个换行符，`<br/>` 元素）：\n\n```\n1   ...\n2     showCart: function(appleModel)\
    \ {\n3       $(this.cartEl).append(appleModel.attributes.name+'<br/>');\n4   \
    \  },\n5   ...\n```\n\n最后，是我们期待已久的 `render()` 方法，在该方法中，我们遍历集合中的每个模型（每个苹果），为每个苹果创建一个\
    \ `appleItemView`，为每个苹果创建一个 `<li>` 元素，并将该元素添加到 `view.listEl` —— 即 DOM 中类名为 `apples-list`\
