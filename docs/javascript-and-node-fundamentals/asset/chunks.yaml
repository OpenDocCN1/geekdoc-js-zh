    \ Node.js 模块\n    *   4.12 使用 HTTP 模块的 Hello World 服务器\n    *   4.13 调试 Node.js\
    \ 程序\n    *   4.14 驯服 Node.js 中的回调\n    *   4.15 跟 Ryan Dahl 介绍 Node.js\n    *\
    \   4.16 使用 Express.js 前进\n*   5 Express.js 基础：最流行的 Node.js 框架\n    *   5.1 Express.js\
    \ 安装\n    *   5.2 Express.js 命令行接口\n    *   5.3 Express.js 中的路由\n    *   5.4 间件作为\
    \ Express.js 的骨架\n    *   5.5 Express.js 应用的配置\n    *   5.6 Jade 是 Express.js/Node.js\
    \ 的 Haml\n    *   5.7 关于 Express.js 框架的结论\n    *   5.8 更新\n*   6 关于作者\n    * \
    \  6.1 错误说明\n    *   6.2 联系我们\n\n> 如果不好玩，那就不是 JavaScript。\n\n# 1 JavaScript 基础：Web\
    \ 强大且被误解的语言\n\n## 1.1 表达能力\n\nBASIC、Python、C 等编程语言具有枯燥的机器本质，这要求开发者编写与解决方案本身无直接关系的额外代码。想想\
    \ BASIC 中的行号或 Java 中的接口、类和模式。\n\n相反，JavaScript 继承了纯数学、LISP 和 C# 的优秀特性，这带来了大量的[表达能力](http://en.wikipedia.org/wiki/Expressive_power)（以及乐趣！）。\n\
