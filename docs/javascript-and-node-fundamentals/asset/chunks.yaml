    \ App with Backbone.js and Twitter Bootstrap](http://coenraets.org/blog/2012/02/sample-app-with-backbone-js-and-twitter-bootstrap/)\n\
    *   More [Backbone.js tutorials](https://github.com/documentcloud/backbone/wiki/Tutorials%2C-blog-posts-and-example-sites)\n\
    \n## 3.8 Conclusion\n\nThe already-mentioned in this chapter, and reputable [Addy’s](https://github.com/addyosmani)\
    \ [TodoMVC](http://todomvc.com/) resource contains a lot of browser JavaScript\
    \ MV* frameworks with tutorials and examples. I often get asked “What do you think\
    \ of X or Y?” The main point is not to get into analysis paralysis when choosing\
    \ a front-end framework. Learn the foundation with `Backbone.js`, just because\
    \ it’s not so bloated and complicated, yet so widely-used and powerful in the\
    \ right hands. Then pick a few newer and shinier libraries (e.g., `React.js`,\
    \ `Angular.js`) and see how they fit the particular goals of project at hand.\n\
    \n## 4 Node.js FUNdamentals: JavaScript on The Server\n\nNode.js is a highly efficient\
    \ and scalable non-blocking I/O platform that was build on top of Google Chrome\
    \ V8 engine and its ECMAScript. This means that most front-end JavaScript (another\
    \ implementation of ECMAScript) objects, functions and methods are available in\
    \ Node.js. Please refer to [JavaScript FUNdamentals](http://webapplog.com/js-fundamentals/)\
    \ if you need a refresher on JS-specific basics.\n\n![](images/node-fun-site.png)\n\
    \nDevelopers can install Node.js from its [website](http://nodejs.org) and follow\
    \ this overview of main Node.js concepts. For more meticulous Node.js instructions,\
    \ take a look at [Rapid Prototyping with JS: Agile JavaScript Development](http://rpjs.co)\
    \ and [Node School](http://nodeschool.io).\n\n![](images/node-fun-school.png)\n\
    \n### 4.1 Read-Eval-Print Loop (a.k.a. Console) in Node.js\n\nLike in many other\
    \ programming language and platforms, Node.js has a read-eval-print loop tool\
    \ which is opened by `$ node` command. The prompt changes to `>` and we can execute\
    \ JavaScript akin to Chrome Developer Tools console. There are slight deviations\
    \ in ECMAScript implementations in Node.js and browsers (e.g., `{}+{}`), but for\
    \ the most part the results are similar.\n\n![](images/node-fun-console.png)\n\
    \nSo as you see, we can write JavaScript in the console all day long, but sometime\
    \ we can to save script so we can run them later.\n\n### 4.2 Launching Node.js\
    \ Scripts\n\nTo start a Node.js script from a file, simply run `$ node filename`,\
    \ e.g., `$ node program.js`. If all we need is a quick set of statements, there’s\
    \ a `-e` option that allow to run inline JavaScript/Node.js, e.g., `$ node -e\
    \ \"console.log(new Date());\"`.\n\n### 4.3 Node.js Process Information\n\nEach\
    \ Node.js script that is running is a process in its essence. For example, `ps\
    \ aux | grep 'node'` will output all Node.js programs running on a machine. Conveniently,\
    \ developers can access useful process information in code with `process` object,\
    \ e.g., `node -e \"console.log(process.pid)\"`:\n\n![Node.js process examples\
    \ using pid and cwd.](images/node-fun-process.png)\n\nNode.js process examples\
    \ using pid and cwd.\n\n### 4.4 Accessing Global Scope in Node.js\n\nAs you know\
    \ from [JS FUNdamentals](http://webapplog.com/), browser JavaScript by default\
    \ puts everything into its global scope. This was coined as one of the bad part\
    \ of JavaScript in Douglas Crockford’s famous [JavaScript: The Good Parts]. Node.js\
    \ was designed to behave differently with everything being local by default. In\
    \ case we need to access globals, there is a `global` object. Likewise, when we\
    \ need to export something, we should do so explicitly.\n\nIn a sense, `window`\
    \ object from front-end/browser JavaScript metamorphosed into a combination of\
    \ `global` and `process` objects. Needless to say, the `document` object that\
    \ represent DOM of the webpage is nonexistent in Node.js.\n\n### 4.5 Exporting\
    \ and Importing Modules\n\nAnother bad part in browser JavaScript is that there’s\
    \ no way to include modules. Scripts are supposed to be linked together using\
    \ a different language (HTML) with a lacking dependency management. [CommonJS](http://www.commonjs.org/)\
    \ and [RequireJS](http://requirejs.org/) solve this problem with AJAX-y approach.\
    \ Node.js borrowed many things from the CommonJS concept.\n\nTo export an object\
    \ in Node.js, use `exports.name = object;`, e.g.,\n\n```\n 1 var messages = {\n\
    \ 2   find: function(req, res, next) {\n 3   ...\n 4   },\n 5   add: function(req,\
    \ res, next) {\n 6   ...\n 7   },\n 8   format: 'title | date | author'\n 9 }\n\
    10 exports.messages = messages;\n```\n\nWhile in the file where we import aforementioned\
    \ script (assuming the path and the file name is `route/messages.js`):\n\n```\n\
    1 var messages = require('./routes/messages.js');\n```\n\nHowever, in the file\
    \ where we import aforementioned script (assuming the path and the file name is\
    \ `route/messages.js`):\n\n```\n1 var messages = require('./routes/messages.js');\n\
    ```\n\nHowever, in the file where we import aforementioned script (assuming the\
    \ path and the file name is `route/messages.js`):\n\n```\n1 var messages = require('./routes/messages.js');\n\
    ```\n\nHowever, in the file where we import aforementioned script (assuming the\
    \ path and the file name is `route/messages.js`):\n\n```\n1 var messages = require('./routes/messages.js');\n\
    ```\n"
  raw: "*   [Backbone Boilerplate](http://backboneboilerplate.com/)\n\n*   [Sample\
    \ App with Backbone.js and Twitter Bootstrap](http://coenraets.org/blog/2012/02/sample-app-with-backbone-js-and-twitter-bootstrap/)\n\
    \n*   More [Backbone.js tutorials](https://github.com/documentcloud/backbone/wiki/Tutorials%2C-blog-posts-and-example-sites)\n\
    \n### 3.8 Conclusion\n\nThe already-mentioned in this chapter, and reputable [Addy’s](https://github.com/addyosmani)\
    \ [TodoMVC](http://todomvc.com/) resource contains **a lot** of browser JavaScript\
    \ MV* frameworks with tutorials and examples. I often get asked “What do you think\
    \ of X or Y?” The main point is not to get into analysis paralysis when choosing\
    \ a front-end framework. Learn the foundation with Backbone.js, just because it’s\
    \ not so bloated and complicated, yet so widely-used and powerful in the right\
    \ hands. Then pick a few newer and shinier libraries (e.g., React.js, Angular.js)\
    \ and see how they fit the particular goals of project at hand.\n\n## 4 Node.js\
    \ FUNdamentals: JavaScript on The Server\n\nNode.js is a highly efficient and\
    \ scalable non-blocking I/O platform that was build on top of Google Chrome V8\
    \ engine and its ECMAScript. This means that most front-end JavaScript (another\
    \ implementation of ECMAScript) objects, functions and methods are available in\
    \ Node.js. Please refer to [JavaScript FUNdamentals](http://webapplog.com/js-fundamentals/)\
    \ if you need a refresher on JS-specific basics.\n\n![](images/node-fun-site.png)\n\
    \nDevelopers can install Node.js from its [website](http://nodejs.org) and follow\
    \ this overview of main Node.js concepts. For more meticulous Node.js instructions,\
    \ take a look at [Rapid Prototyping with JS: Agile JavaScript Development](http://rpjs.co)\
    \ and [Node School](http://nodeschool.io).\n\n![](images/node-fun-school.png)\n\
    \n### 4.1 Read-Eval-Print Loop (a.k.a. Console) in Node.js\n\nLike in many other\
    \ programming language and platforms, Node.js has a read-eval-print loop tool\
    \ which is opened by `$ node` command. The prompt changes to `>` and we can execute\
    \ JavaScript akin to Chrome Developer Tools console. There are slight deviations\
    \ in ECMAScript implementations in Node.js and browsers (e.g., `{}+{}`), but for\
    \ the most part the results are similar.\n\n![](images/node-fun-console.png)\n\
    \nSo as you see, we can write JavaScript in the console all day long, but sometime\
    \ we can to save script so we can run them later.\n\n### 4.2 Launching Node.js\
    \ Scripts\n\nTo start a Node.js script from a file, simply run `$ node filename`,\
    \ e.g., `$ node program.js`. If all we need is a quick set of statements, there’s\
    \ a `-e` option that allow to run inline JavaScript/Node.js, e.g., `$ node -e\
    \ \"console.log(new Date());\"`.\n\n### 4.3 Node.js Process Information\n\nEach\
    \ Node.js script that is running is a process in its essence. For example, `ps\
    \ aux | grep 'node'` will output all Node.js programs running on a machine. Conveniently,\
    \ developers can access useful process information in code with `process` object,\
    \ e.g., `node -e \"console.log(process.pid)\"`:\n\n![Node.js process examples\
    \ using pid and cwd.](images/node-fun-process.png)\n\nNode.js process examples\
    \ using pid and cwd.\n\n### 4.4 Accessing Global Scope in Node.js\n\nAs you know\
    \ from [JS FUNdamentals](http://webapplog.com/), browser JavaScript by default\
    \ puts everything into its global scope. This was coined as one of the bad part\
    \ of JavaScript in Douglas Crockford’s famous [JavaScript: The Good Parts]. Node.js\
    \ was designed to behave differently with everything being local by default. In\
    \ case we need to access globals, there is a `global` object. Likewise, when we\
    \ need to export something, we should do so explicitly.\n\nIn a sense, `window`\
    \ object from front-end/browser JavaScript metamorphosed into a combination of\
    \ `global` and `process` objects. Needless to say, the `document` object that\
    \ represent DOM of the webpage is nonexistent in Node.js.\n\n### 4.5 Exporting\
    \ and Importing Modules\n\nAnother *bad part* in browser JavaScript is that there’s\
    \ no way to include modules. Scripts are supposed to be linked together using\
    \ a different language (HTML) with a lacking dependency management. [CommonJS](http://www.commonjs.org/)\
    \ and [RequireJS](http://requirejs.org/) solve this problem with AJAX-y approach.\
    \ Node.js borrowed many things from the CommonJS concept.\n\nTo export an object\
    \ in Node.js, use `exports.name = object;`, e.g.,\n\n```\n 1 var messages = {\n\
    \ 2   find: function(req, res, next) {\n 3   ...\n 4   },\n 5   add: function(req,\
    \ res, next) {\n 6   ...\n 7   },\n 8   format: 'title | date | author'\n 9 }\n\
    10 exports.messages = messages;\n```\n\nWhile in the file where we import aforementioned\
    \ script (assuming the path and the file name is `route/messages.js`):\n\n```\n\
    1 var messages = require('./routes/messages.js');\n```\n\nHowever, sometime it’s\
    \ more fitting to invoke a constructor, e.g., when we attach properties to Express.js\
    \ app (more on Express.js in [Express.js FUNdamentals: An Essential Overview of\
    \ Express.js](http://webapplog.com/express-js-fundamentals/)). In this case `module.exports`\
    \ is needed:\n\n```\n1 module.exports = function(app) {\n2   app.set('port', process.env.PORT\
    \ || 3000);\n3   app.set('views', __dirname + '/views');\n4   app.set('view engine',\
    \ 'jade');\n5   return app;\n6 }\n```\n\nIn the file that includes the example\
    \ module above:\n\n```\n1 ...\n2 var app = express();\n3 var config = require('./config/index.js');\n\
    4 app = config(app);\n5 ...\n```\n\nThe more succinct code: `var = express();\
    \ require('./config/index.js')(app);`.\n\nThe most common mistake when including\
    \ modules is a wrong path to the file. For core Node.js modules, just use the\
    \ name without any path, e.g., require(‘name’). Same goes for modules in `node_modules`\
    \ folder. More on that later in the NPM section.\n\nFor all other files, use `.`\
    \ with or without a file extension, e.g.,\n\n```\n1 var keys = require('./keys.js'),\n\
    2   messages = require('./routes/messages.js');\n```\n\nIn addition, for the latter\
    \ category it’s possible to use a longer looking statements with `__dirname` and\
    \ `path.join()`, e.g., require(path.join(__dirname, ,’routes’, ‘messages’));`\n\
    \nIf `require()` points to a folder, Node.js will attempt to read `index.js` file\
    \ in that folder.\n\n### 4.6 Buffer is a Node.js Super Data Type\n\nBuffer is\
    \ a Node.js addition to four primitives (boolean, string, number and RegExp) and\
    \ all-encompassing objects (array and functions are also objects) in front-end\
    \ JavaScript. We can think of buffers as extremely efficient data stores. In fact,\
    \ Node.js will try to use buffers any time it can, e.g., reading from file system,\
    \ receiving packets over the network.\n\n### 4.7 __dirname vs. process.cwd\n\n\
    `__dirname` is an absolute path to the file in which this global variable was\
    \ called, while `process.cwd` is an absolute path to the process that runs this\
    \ script. The latter might not be the same as the former if we started the program\
    \ from a different folder, e.g., `$ node ./code/program.js`.\n\n### 4.8 Handy\
    \ Utilities in Node.js\n\nAlthough, the core of the Node.js platform was intentionally\
    \ kept small it has some essential utilities such as\n\n*   [URL](http://nodejs.org/api/url.html)\n\
    \n*   [Crypto](http://nodejs.org/api/crypto.html)\n\n*   [Path](http://nodejs.org/api/path.html)\n\
    \n*   [String Decoder](http://nodejs.org/api/string_decoder.html)\n\nThe method\
    \ that we use in this tutorials is `path.join` and it concatenates path using\
    \ an appropriate folder separator (`/` or `\\\\`).\n\n### 4.9 Reading and Writing\
    \ from/to The File System in Node.js\n\nReading from files is done via the core\
    \ `fs` [module](http://nodejs.org/api/fs.html). There are two sets of methods:\
    \ async and sync. In most cases developers should use async methods, e.g., [fs.readFile](http://nodejs.org/api/fs.html#fs_fs_readfile_filename_options_callback):\n\
    \n```\n1 var fs = require('fs');\n2 var path = require('path');\n3 fs.readFile(path.join(__dirname,\
    \ '/data/customers.csv'), {encoding: 'utf-8'}, fun\\\n4 ction (err, data) {\n\
    5   if (err) throw err;\n6   console.log(data);\n7 });\n```\n\nAnd the writing\
    \ to the file:"
