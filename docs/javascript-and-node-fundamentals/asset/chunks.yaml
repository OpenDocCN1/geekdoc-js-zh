    \n### 3.4 使用 Backbone.js Collections\n\nBackbone Collections 是非常有用的类，开发者可以使用它们来存储任何属于相同类型的数据。换句话说，Collections\
    \ 是模型（models）的集合或列表，它们（collections）拥有自己的自定义方法和逻辑，以及一些内置的 Backbone 方法。\n\nBackbone\
    \ Collections 示例的源代码位于 GitHub 的 [`rpjs/backbone/collections`](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
    \ 下。\n\n这个示例关于 Backbone Collections 的，它是基于之前的**从零构建 Backbone.js 应用**中的“Hello World”示例构建的，该示例可以在\
    \ [`rpjs/backbone/hello-world`](https://github.com/azat-co/rpjs/tree/master/backbone/hello-world)\
    \ 下载。\n\n我们应该添加一些数据以便于测试和填充我们的视图。为了做到，请在 `script` 标签之后、其他代码之前添加以下内容：\n\n```\n\
    \ 1   var appleData = [\n 2     {\n 3       name: \"fuji\",\n 4       url: \"\
    img/fuji.jpg\"\n 5     },\n 6     {\n 7       name: \"gala\",\n 8       url: \"\
    img/gala.jpg\"\n 9     }\n10   ];\n```\n\n从 GitHub 获取图片（见下图）：[`github.com/azat-co/rpjs/tree/master/backbone/collections/img`](https://github.com/azat-co/rpjs/tree/master/backbone/collections/img)，或者添加你自己的图片。\n\
    \n![富士苹果苹果插图](img/fuji.jpg)\n\n富士苹果插图\n\n![佳拉苹果插图](img/gala.jpg)\n\n佳拉苹果插图\n\n\
    这是我们的苹果*数据库*。:-) 或者更准确地说，是我们的 REST API 端点替代方案，它我们提供了苹果数据模型的名称和图像 URL。如果你需要真实的服务器，可以使用：\n\
    \n* [Parse.com](http://parse.com): 后端即服务提供商\n* [Node.js and MongoDB REST API](http://webapplog.com/express-js-4-node-js-and-mongodb-rest-api-tutorial/):\
    \ 使用 Node.js, Express.js 和 MongoDB 构建的免费 JSON API\n\n| ![信息](img/leanpub_information.png)\
    \ |  \n\n### 注意\n\n此模拟数据集可以通过将后端的 REST API 端点分配给 Backbone.js Collections 和/或 Models\
    \ 中的 `url` 属性，并对它们调用 `fetch()` 方法来轻松替换。 |\n\n现在为了让用户体验（UX）更好一点，我们可以在 Backbone\
    \ Route 的 `routes` 对象中添加新路由：\n\n```\n1   ...\n2   routes: {\n3     '': 'home',\n\
    4     'apples/:appleName': 'loadApple'\n5   },\n6   ...\n```\n\n这将允许用户访问 `index.html#apples/SOMENAME`\
    \ 并期望看到一些关于苹果的信息。这些信息将由 Backbone Router 定义中的 `loadApple` 函数获取并渲染：\n\n```\n1  \
    \ loadApple: function(appleName){\n2     this.appleView.render(appleName);\n3\
    \   }\n```\n\n你注意到一个 `appleName` 变量了吗？它与我们在 `route` 中使用的名称完全相同。这就是我们如何在 Backbone.js\
    \ 中访问查询字符串参数（例如，`?param=value&q=search`）的方式。\n\n现在我们需要重构一些代码来创建一个 Backbone Collection，用\
    \ `appleData` 变量中的数据填充它，并将集合传递给 `appleData` 变量。\n\n```\n1   var Apples = Backbone.Collection.extend({\n\
    2   });\n```\n\n| ![信息](img/leanpub_information.png) |  \n\n### 注意\n\n当我们使用 `fetch()`\
    \ 或 `reset()` 函数时，Backbone 会自动在集合内部创建模型。 |\n\n苹果视图并不复杂，它只有两个属性：`template` 和 `render`。在模板中，我们想要显示\
    \ `figure`、`img` 和 `figcaption` 标签。Underscore 的模板引擎处理此任务非常方便：\n\n```javascript\n\
    1   var appleView = Backbone.View.extend({\n2     template: _.template(\n3   \
    \        '<figure>\\\n4              <img src=\"<%= attributes.url %>\">\\\n5\
    \              <figcaption><%= attributes.name %></figcaption>\\\n6          \
    \  </figure>'),\n```\n\n为了让包含 HTML 标签的 JavaScript 字符串具可读性，可以使用换行符（`\\`），或者关闭字符串并使用加号（`+`）拼接。这是上面\
    \ `appleView` 使用后者的方法的示例：\n\n```javascript\n1   var appleView = Backbone.View.extend({\n\
    2     template: _.template(\n3         '<figure>'+\n4           +'<img src=\"\
    <%= attributes.url %>\">'+\n5           +'<figcaption><%= attributes.name %></figcaption>'+\n\
    6         +'</figure>'),\n```\n\n注意 `<%=` 和 `%>` 符号，它们是打印 attributes 对象中 `url`\
    \ 和 `name` 值的指令。\n\n最后，我们将 `render` 函数添加到 `appleView` 类中。\n\n```javascript\n1\
    \   render: function(appleName){\n2     var appleModel = this.collection.where({name:appleName})[0];\n\
    3     var appleHtml = this.template(appleModel);\n4     $('body').html(appleHtml);\n\
    5   }\n```\n\n我们通过 `where()` 方法在集合中查找模型并使用 `[]` 选择第一个元素。现在，`render` 函数负责加载数据并渲染数据。稍我们将重构该函数，将这两个功能分离到不同的方法中。\n\
    \n整个应用位于 [`rpjs/backbone/collections/index.html](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
    \ 文件夹，看起来如下：\n\n"
- fmt: "\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script src=\"jquery.js\"></script>\n\
    \  <script src=\"underscore.js\"></script>\n  <script src=\"backbone.js\"></script>\n\
    \n  <script>\n    var appleData = [\n      {\n        name: \"fuji\",\n      \
    \  url: \"img/fuji.jpg\"\n      },\n      {\n        name: \"gala\",\n       \
    \ url: \"img/gala.jpg\"\n      }\n    ];\n    var app;\n    var router = Backbone.Router.extend({\n\
    \      routes: {\n        \"\": \"home\",\n        \"apples/:appleName\": \"loadApple\"\
    \n      },\n      initialize: function(){\n        var apples = new Apples();\n\
    \        apples.reset(appleData);\n        this.homeView = new homeView({collection:\
    \ apples});\n        this.appleView = new appleView({collection: apples});\n \
    \     },\n      home: function(){\n        this.homeView.render();\n      },\n\
    \      loadApple: function(appleName){\n        this.appleView.render(appleName);\n\
    \      }\n    });\n\n    var homeView = Backbone.View.extend({\n      el: 'body',\n\
    \      template: _.template('Apple data: <%= data %>'),\n      render: function(){\n\
    \        this.$el.html(this.template({\n        data: JSON.stringify(this.collection.models)\n\
    \        }));\n      }\n      //TODO subviews\n    });\n\n    var Apples = Backbone.Collection.extend({\n\
    \n    });\n    var appleView = Backbone.View.extend({\n      template: _.template('<figure>\\\
    \n                  <img src=\"<%= attributes.url %>\"/>\\\n                 \
    \ <figcaption><%= attributes.name %></figcaption>\\\n                </figure>'),\n\
    \      //TODO re-write with load apple and event binding\n      render: function(appleName){\n\
    \        var appleModel = this.collection.where({\n          name:appleName\n\
    \        })[0];\n        var appleHtml = this.template(appleModel);\n        $('body').html(appleHtml);\n\
    \      }\n    });\n    $(document).ready(function(){\n      app = new router;\n\
    \      Backbone.history.start();\n    })\n\n  </script>\n</head>\n<body>\n  <div></div>\n\
    </body>\n</html>\n```\n\nOpen `collections/index.html` file in your browser. You\
    \ should see the data from our “database”, i.e., `Apple data: [{\"name\":\"fuji\"\
    ,\"url\":\"img/fuji.jpg\"},{\"name\":\"gala\",\"url\":\"img/gala.jpg\"}]`.\n\n\
    Now, let' go go to `collections/index.html#apples/fuji` or `collections/index.html#apples/gala`\
    \ in your browser. We expect to see an image with a caption. It’s a detailed view\
    \ of an item, which in this case is an apple. Nice work!\n\n### 3.5 Event Binding\
    \ with Backbone.js and jQuery\n\nIn real life, getting data does not happen instantaneously,\
    \ so let’s refactor our code to simulate it. For a better UI/UX, we’ll also have\
    \ to show a loading icon (a.k.a., spinner or ajax-loader, see the picture below)\
    \ to users to notify them that the information is being loaded.\n\n![Spinner GIF](images/spinner.png)\n\
    \nSpinner GIF\n\nIt’s a good thing that we have event binding in Backbone. The\
    \ event binding is not an exclusive to Backbone feature, because it is part of\
    \ jQuery. But without Backbone organization and code structure, things tend to\
    \ end up messier (with plain jQuery). For example, we’ll have to pass a function\
    \ that renders HTML as a callback to the data loading function, to make sure that\
    \ the rendering function is not executed before we have the actual data to display.\n\
    \nTherefore, when a user goes to detailed view (`apples/:id`) we only call the\
    \ function that loads the data. Then, with the proper event listeners, our view\
    \ will automagically (this is not a typo) update itself; when there is a new data\
    \ (or on a data change, Backbone.js supports multiple and even custom events).\n\
    \nLet’s change the code in the router:\n\n```\n...\n    loadApple: function(appleName){\n\
    \      this.appleView.loadApple(appleName);\n    }\n...\n```\n\nEverything else\
    \ remains the same until we get to the `appleView` class. We’ll need to add a\
    \ constructor or an `initialize` method, which is a special word/property in the\
    \ Backbone.js framework. It’s called each time we create an instance of an object,\
    \ i.e., `var someObj = new SomeObject()`. We can also pass extra parameters to\
    \ the `initialize` function, as we did with our views (we passed an object with\
    \ the key `collection` and the value of `apples` Backbone Collection). Read more\
    \ on Backbone.js constructors at [backbonejs.org/#View-constructor](http://backbonejs.org/#View-constructor).\n\
    \n```\n...\nvar appleView = Backbone.View.extend({\n  initialize: function(){\n\
    \    //TODO: create and setup model (aka an apple)\n  },\n...\n```\n\nGreat, we\
    \ have our `initialize` function. Now we need to create a model which will represent\
    \ a single apple and set up proper event listeners on the model. We’ll use two\
    \ types of events, `change` and a custom event called `spinner`. To do that, we\
    \ are going to use the `on()` function, which takes these properties: `on(event,\
    \ actions, context)` — read more about it at [backbonejs.org/#Events-on](http://backbonejs.org/#Events-on):\n\
    \n```\n...\nvar appleView = Backbone.View.extend({\n    this.model = new (Backbone.Model.extend({}));\n\
    \    this.model.bind('change', this.render);\n    this.bind('spinner',this.showSpinner);\n\
    },\n...\n```\n\nThe code above basically boils down to two things:\n\n1. Call\
    \ `render()` of `appleView` when the model has changed\n2. Call `showSpinner()`\
    \ of `appleView` when event `spinner` has fired.\n\nSo far, so good, right? But\
    \ what about the spinner, a GIF icon? Let’s create a new property in `appleView`:\n\
    \n```\n...\n  templateSpinner: '<img src=\"spinner.gif\" width=\"30\"/>',\n...\n\
    ```\n\nRemember the `loadApple` call in the router? This is how we can implement\
    \ the function in `appleView`:\n\n```\n...\nloadApple:function(appleName){\n \
    \   this.trigger('spinner');\n    //show spinner image\n    var view = this;\n\
    \    //we'll need to access that inside of a closure\n    setTimeout(function(){\n\
    \    //simulates real time lag when\n    //fetching data from the remote server\n\
    \      view.model.set(view.collection.where({\n        name:appleName\n      })[0].attributes);\n\
    \    },1000);\n},\n...\n```\n\nThe first line will trigger the `spinner` event\
    \ (the function for which we still have to write).\n\nThe second line is just\
    \ for scoping issues (so we can use `appleView` inside of the closure).\n\nThe\
    \ `setTimeout` function is simulating a time lag of real remote server response.\
    \ Inside of it, we assign attributes of a selected model to our view’s model by\
    \ using a `model.set()` function and a `model.attributes` property (which returns\
    \ the properties of a model).\n\nNow we can remove an extra code from the `render`\
    \ method and implement the `showSpinner` function:\n\n```\n  render: function(appleName){\n\
    \    var appleHtml = this.template(this.model);\n    $('body').html(appleHtml);\n\
    \  },\n  showSpinner: function(){\n    $('body').html(this.templateSpinner);\n\
    \  }\n  ...\n```\n\nThat’s all! Open `index.html#apples/gala` or `index.html#apples/fuji`\
    \ in your browser and enjoy the loading animation while waiting for an apple image\
    \ to load.\n"
