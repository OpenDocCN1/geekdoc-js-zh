    \n# 1 JavaScript FUNdamentals: The Powerful and Misunderstood Language of The\
    \ Web\n\n## 1.1 Expressiveness\n\nProgramming languages like BASIC, Python, C\
    \ has boring machine-like nature which requires developers to write extra code\
    \ that’s not directly related to the solution itself. Think about line numbers\
    \ in BASIC or interfaces, classes and patterns in Java.\n\nOn the other hand JavaScript\
    \ inherits the best traits of pure mathematics, LISP, C# which lead to a great\
    \ deal of [expressiveness](http://en.wikipedia.org/wiki/Expressive_power) (and\
    \ fun!).\n\nMore about Expressive Power in this post: [What does “expressive”\
    \ mean when referring to programming languages?](http://stackoverflow.com/questions/638881/what-does-expressive-mean-when-referring-to-programming-languages)\n\
    \nThe quintessential Hello World example in Java (remember, Java is to JavaScript\
    \ is what ham to a hamster):\n\n```\npublic class HelloWorld {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello World\");\n \
    \   }\n}\n```\n\nThe same example in JavaScript:\n\n```\nconsole.log('Hello World')\n\
