  trans: "\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <script src=\"jquery.js\"></script>\n\
    \  <script src=\"underscore.js\"></script>\n  <script src=\"backbone.js\"></script>\n\
    \n  <script>\n    var appleData = [\n      {\n        name: \"fuji\",\n      \
    \  url: \"img/fuji.jpg\"\n      },\n      {\n        name: \"gala\",\n       \
    \ url: \"img/gala.jpg\"\n      }\n    ];\n    var app;\n    var router = Backbone.Router.extend({\n\
    \      routes: {\n        \"\": \"home\",\n        \"apples/:appleName\": \"loadApple\"\
    \n      },\n      initialize: function(){\n        var apples = new Apples();\n\
    \        apples.reset(appleData);\n        this.homeView = new homeView({collection:\
    \ apples});\n        this.appleView = new appleView({collection: apples});\n \
    \     },\n      home: function(){\n        this.homeView.render();\n      },\n\
    \      loadApple: function(appleName){\n        this.appleView.render(appleName);\n\
    \      }\n    });\n\n    var homeView = Backbone.View.extend({\n      el: 'body',\n\
    \      template: _.template('Apple data: <%= data %>'),\n      render: function(){\n\
    \        this.$el.html(this.template({\n        data: JSON.stringify(this.collection.models)\n\
    \        }));\n      }\n      //TODO subviews\n    });\n\n    var Apples = Backbone.Collection.extend({\n\
    \n    });\n    var appleView = Backbone.View.extend({\n      template: _.template('<figure>\\\
    \n                  <img src=\"<%= attributes.url %>\"/>\\\n                 \
    \ <figcaption><%= attributes.name %></figcaption>\\\n                </figure>'),\n\
    \      //TODO re-write with load apple and event binding\n      render: function(appleName){\n\
    \        var appleModel = this.collection.where({\n          name:appleName\n\
    \        })[0];\n        var appleHtml = this.template(appleModel);\n        $('body').html(appleHtml);\n\
    \      }\n    });\n    $(document).ready(function(){\n      app = new router;\n\
    \      Backbone.history.start();\n    })\n\n  </script>\n</head>\n<body>\n  <div></div>\n\
    </body>\n</html>\n```\n\n在浏览器中打开 `collections/index.html` 文件。你将能够看到来自我们“数据库”的数数据，即：`Apple\
    \ data: [{\"name\":\"fuji\",\"url\":\"img/fuji.jpg\"},{\"name\":\"gala\",\"url\"\
    :\"img/gala.jpg\"}]`。\n\n现在，让我们在浏览器中访问 `collections/index.html#apples/fuji` 或\
    \ `collections/index.html#apples/gala`。我们期望看到一张带有说明的图片。这是项的详细视图，在这个例中是一个苹果。干得好！\n\
    \n### 3.5 使用 Backbone.js 和 jQuery 进行事件绑定\n\n在现实生活中，获取数据并不是瞬间完成的，因此让我们重构代码来模拟这一过程。为了获得更好的\
    \ UI/UX，我们还需要向用户显示一个加载图标（也称为 spinner 或 ajax-loader，见下图），以通知他们信息正在加载。\n\n![Spinner\
    \ GIF](img/spinner.png)\n\nSpinner GIF\n\n我们在 Backbone 中拥有事件绑定是一件好事。事件绑定并不是 Backbone\
    \ 特有的功能，因为它是 jQuery 的一部分。但如果没有 Backbone 的组织和代码结构（使用纯 jQuery 的情况下），事情往往会变得更加混乱。例如，我们必须将一个渲染\
    \ HTML 的函数作为回调传递给数据加载函数，以确保在有实际数据可供显示之前，不会执行渲染函数。\n\n因此，当用户进入详细视图（`apples/:id`）时，我们只调用加载数据的函数。然后，通过适当的事件监听器，我们的视图将自动（这不是笔误）更新自己；当有新数据时（或在数据发生变化时，Backbone.js\
    \ 支持多个甚至是自定义事件）。\n\n让我们更改路由器中的代码：\n\n```\n...\n    loadApple: function(appleName){\n\
    \      this.appleView.loadApple(appleName);\n    }\n...\n```\n\n在到达 `appleView`\
    \ 类之前，其他内容保持不变。我们需要添加一个构造函数或一个 `initialize` 方法，这是 Backbone.js 框架中的一个特殊单词/属性。每当我们创建一个对象的实例时，它都会被调用，例如\
    \ `var someObj = new SomeObject()`。我们还可以向 `initialize` 函数传递额外的参数，就像我们在视图中做的那样（我们传递了一个键为\
    \ `collection` 值为 `apples` Backbone 集合的对象）。关于 Backbone.js 构造函数的更多信息，请访问 [backbonejs.org/#View-constructor](http://backbonejs.org/#View-constructor)。\n\
    \n```\n...\nvar appleView = Backbone.View.extend({\n  initialize: function(){\n\
    \    //TODO: 创建并设置模型（即一个苹果）\n  },\n...\n```\n\n太极了，我们有了 `initialize` 函数。现在我们需要创建一个代表单个苹果的模型，并在模型上设置适当的事件监听器。我们将使用两种事件：`change`\
    \ 和一个名为 `spinner` 的自定义事件。为了做到，我们将使用 `on()` 函数，它接收这些属性：`on(event, actions, context)`\
    \ —— 关于它的更多信息请参阅 [backbonejs.org/#Events-on](http://backbonejs.org/#Events-on)：\n\
    \n```\n...\nvar appleView = Backbone.View.extend({\n    this.model = new (Backbone.Model.extend({}));\n\
    \    this.bind('change', this.render);\n    this.bind('spinner',this.showSpinner);\n\
    },\n...\n```\n\n上面的代码基本上归纳为两点：\n\n1. 当模型变化时调用 `appleView` 的 `render()`。\n2. 当触发\
    \ `spinner` 事件时调用 `appleView` 的 `showSpinner()`。\n\n到为止一切顺利，对吧？但是 spinner，即 GIF\
    \ 图标呢？我们在 `appleView` 中创建一个新属性：\n\n```\n...\n  templateSpinner: '<img src=\"spinner.gif\"\
    \ width=\"30\"/>',\n...\n```\n\n记得路由器中的 `loadApple` 调用吗？这是我们在 `appleView` 中实现该函数的方法：\n\
    \n```\n...\nloadApple:function(appleName){\n    this.trigger('spinner');\n   \
    \ // 显示 spinner\n    var view = this;\n    // 我们在闭包内部访问它\n    setTimeout(function(){\n\
    \    // 模拟从远程服务器获取数据的真实延迟\n      view.model.set(view.collection.where({\n    \
    \    name:appleName\n      })[0].attributes);\n    },1000);\n},\n...\n```\n\n\
    第一行将触发 `spinner` 事件（我们仍然需要编写该函数）。\n\n第二行是为了作用域问题（以便我们在闭包中使用 `appleView`）。\n\n\
    `setTimeout` 函数模拟了远程服务器响应的真实延迟。内部，我们通过使用 `model.set()` 函数和 `model.attributes`\
    \ 属性（返回模型的属性）将选中模型的属性赋值给视图模型。\n\n现在我们可以从 `render` 方法中移除多余的代码并实现 `showSpinner`\
    \ 函数：\n\n```\n  render: function(appleName){\n    var appleHtml = this.template(this.model);\n\
    \    $('body').html(appleHtml);\n  },\n  showSpinner: function(){\n    $('body').html(this.templateSpinner);\n\
    \  }\n  ...\n```\n\n全部！在浏览器中打开 `index.html#apples/gala` 或 `index.html#apples/fuji`，并在等待苹果图片加载时享受加载动画。\n\
    \n"
