    \ class=\"add-cart\" href=\"#\"></a>\n 49       '),\n 50       \n 51       events:\
    \ {\n 52         'click .add-cart': 'addToCart'\n 53       },\n 54       render:\
    \ function() {\n 55         this.$el.html(this.template);\n 56       },\n 57 \
