    \n# JavaScript 和 Node 基础\n\n## 核心基础合集\n\n### Azat Mardan\n\n本书可在 [`leanpub.com/jsfun`](http://leanpub.com/jsfun)\
    \ 售卖\n\n此版本发布于 2014-05-29\n\n![出版者标志](img/leanpub-logo.png)\n\n这是一本 [Leanpub](http://leanpub.com)\
    \ 书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版商提供支持。[精益出版](http://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。\n\n© 2013 - 2014 Azat\
    \ Mardan\n\n## 目录\n\n*   1 JavaScript 基础：Web 强大且被误解的语言\n    *   1.1 表达能力\n   \
    \ *   1.2 弱类型\n    *   1.3 对象字面量表示法\n    *   1.4 函数\n    *   1.5 数组\n    *   1.6\
