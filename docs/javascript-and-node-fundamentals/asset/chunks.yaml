    \ req and res can be used as streams (look in the previous section).\n\n### 4.13\
    \ Debugging Node.js Programs\n\nThe best debugger is `console.log()`, but sometime\
    \ we need to see the call stack and orient ourselves in async code a bit more.\
    \ To do that, put `debugger` statements in your code and use `$ node debug program.js`\
    \ to start [the debugging process](http://nodejs.org/api/debugger.html). For more\
    \ developer-friendly interface, download [node inspector](https://github.com/node-inspector/node-inspector).\n\
    \n### 4.14 Taming Callbacks in Node.js\n\n[Callbacks](https://github.com/maxogden/art-of-node#callbacks)\
    \ are able to Node.js code asynchronous, yet programmers unfamiliar with JavaScript,\
    \ who come from Java or PHP, might be surprised when they see Node.js code described\
    \ on [Callback Hell](http://callbackhell.com/):\n\n```\n 1 fs.readdir(source,\
    \ function(err, files) {\n 2   if (err) {\n 3     console.log('Error finding files:\
    \ ' + err)\n 4   } else {\n 5     files.forEach(function(filename, fileIndex)\
    \ {\n 6       console.log(filename)\n 7       gm(source + filename).size(function(err,\
    \ values) {\n 8         if (err) {\n 9           console.log('Error identifying\
    \ file size: ' + err)\n10         } else {\n11           console.log(filename\
    \ + ' : ' + values)\n12           aspect = (values.width / values.height)\n13\
    \           widths.forEach(function(width, widthIndex) {\n14             height\
    \ = Math.round(width / aspect)\n15             console.log('resizing ' + filename\
    \ + 'to ' + height + 'x' + height)\n16             this.resize(width, height).write(destination\
    \ + 'w' + width + '_' + fi\\\n17 lename, function(err) {\n18               if\
    \ (err) console.log('Error writing file: ' + err)\n19             })\n20     \
    \      }.bind(this))\n21         }\n22       })\n23     })\n24   }\n25 })\n```\n\
    \nThere’s nothing to be afraid of here as long as two-space indentation is used.\
    \ ;-) However, callback code can be re-write with the use of event emitters, promises\
    \ or by utilizing the async library.\n\n### 4.15 Introduction to Node.js with\
    \ Ryan Dahl\n\nLast, but not least, take a few minutes and watch this [Introduction\
    \ to Node.js with Ryan Dahl video](http://www.youtube.com/embed/jo_B4LTHi3I).\n\
    \n### 4.16 Moving Forward with Express.js\n\nAfter you’ve mastered Node.js basics\
    \ in this article, you might want to read [Express.js FUNdamentals: An Essential\
    \ Overview of Express.js](http://webapplog.com/express-js-fundamentals) and consider\
    \ working on [an interactive class](http://webapplog.com/expressworks) about the\
    \ Express.js framework which is as of today is the most popular module on NPM.\n\
    \n![](images/finished.png)\n\n## 5 Express.js FUNdamentals: The Most Popular Node.js\
    \ Framework\n\nExpress.js is an amazing framework for Node.js projects and used\
    \ in the majority of such web apps. Unfortunately, there’s a lack of tutorials\
    \ and examples on how to write good production-ready code. To mitigate this need,\
    \ we released [Express.js Guide: The Comprehesive Book on Express.js](http://expressjsguide.com).\
    \ However, all things start from basics, and for that reason we’ll give you a\
    \ taste of the framework in this post, so you can decide if you want to continue\
    \ the learning further.\n\n### 5.1 Express.js Installation\n\nAssuming you downloaded\
    \ and installed Node.js (and NPM with it), run this command:\n\n```\n1 $ sudo\
    \ npm install -g express@3.4.3\n```\n\n### 5.2 Express.js Command-Line Interface\n\
    \nNow we can use command-line interface (CLI) to spawn new Express.js apps:\n\n\
    ```\n1 $ express -c styl expressfun\n2 $ cd expressfun && npm install\n3 $ node\
    \ app\n```\n\nOpen browser at [http://localhost:3000](http://localhost:3000).\n\
    \nHere is the full code of `expressfun/app.js` if you don’t have time to create\
    \ an app right now:\n\n```\n 1 var express = require('express');\n 2 var routes\
    \ = require('./routes');\n 3 var user = require('./routes/user');\n 4 var http\
    \ = require('http');\n 5 var path = require('path');\n 6 \n 7 var app = express();\n\
    \ 8 \n 9 // all environments\n10 app.set('port', process.env.PORT || 3000);\n\
    11 app.set('views', __dirname + '/views');\n12 app.set('view engine', 'jade');\n\
    13 app.use(express.favicon());\n14 app.use(express.logger('dev'));\n15 app.use(express.bodyParser());\n\
    16 app.use(express.methodOverride());\n17 app.use(app.router);\n18 app.use(express.static(path.join(__dirname,\
    \ 'public')));\n19 \n20 // development only\n21 if ('development' == app.get('env'))\
    \ {\n22   app.use(express.errorHandler());\n23 }\n24 \n25 app.get('/', routes.index);\n\
    26 app.get('/users', user.list);\n27 \n28 http.createServer(app).listen(app.get('port'),\
    \ function(){\n29   console.log('Express server listening on port ' + app.get('port'));\n\
    30 });\n```\n\n### 5.3 Routes in Express.js\n\nIf you open the `expressfun/app.js`,\
    \ you’ll see two routes in the middle:\n\n```\n1 ...\n2 app.get('/', routes.index);\n\
