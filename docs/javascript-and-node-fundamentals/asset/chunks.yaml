    \ this);\n 99       },\n 100       template: _.template('<figure>\\\n 101    \
    \             <img src=\"<%= attributes.url %>\"/>\\\n 102                 <figcaption><%=\
    \ attributes.name %></figcaption>\\\n 103               </figure>'),\n 104   \
    \    templateSpinner: '<img src=\"img/spinner.gif\" width=\"30\"/>',\n 105   \
    \    loadApple:function(appleName){\n 106         this.trigger('spinner');\n 107\
    \         var view = this;\n 108         //我们需要在闭包内部访问它\n 109         setTimeout(function(){\n\
    \ 110         //模拟从远程服务器\n 111         //获取数据时的实时延迟\n 112           view.model.set(view.collection.where({\n\
    \ 113             name:appleName\n 114           })[0].attributes);\n 115    \
    \     },1000);\n 116       },\n 117       render: function(appleName){\n 118 \
