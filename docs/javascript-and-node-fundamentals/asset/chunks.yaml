    Azat Mardan: a software engineer, author and yogi.


    Azat Mardan has over 12 years of experience in web, mobile and software development.
    With a Bachelor’s Degree in Informatics and a Master of Science in Information
    Systems Technology degree, Azat possesses deep academic knowledge as well as extensive
    practical experience.


    Currently, Azat works as a Senior Software Engineer at [DocuSign](http://docusign.com),
    where his team rebuilds 50 million user product (DocuSign web app) using the tech
    stack of Node.js, Express.js, Backbone.js, CoffeeScript, Jade, Stylus and Redis.


    Recently, he worked as an engineer at the curated social media news aggregator
    website [Storify.com](http://storify.com) (acquired by [LiveFyre](http://livefyre.com)).
    Before that, Azat worked as a CTO/co-founder at [Gizmo](http://www.crunchbase.com/company/gizmo)
    — an enterprise cloud platform for mobile marketing campaigns, and he has undertaken
    the prestigious [500 Startups](http://500.co/) business accelerator program. Previously,
    he was developing mission-critical applications for government agencies in Washington,
    DC: [National Institutes of Health](http://nih.gov), [National Center for Biotechnology
    Information](http://ncbi.nlm.nih.gov), [Federal Deposit Insurance Corporation](http://fdic.gov),
    and [Lockheed Martin](http://lockheedmartin.com). Azat is a frequent attendee
    at Bay Area tech meet-ups and hackathons ([AngelHack](http://angelhack.com), and
    was a hackathon ’12 finalist with team [FashionMetric.com](http://fashionmetric.com)).


    In addition, Azat teaches technical classes at [General Assembly](http://generalassemb.ly)
    and [Hack Reactor](http://hackreactor.com), [pariSOMA](http://parisoma.com) and
    [Marakana](http://marakana.com) (acquired by Twitter) to much acclaim.


    In his spare time, he writes about technology on his blog: [webAppLog.com](http://webapplog.com)
    which is [number one](http://expressjsguide.com/assets/img/expressjs-tutorial.png)
    in “express.js tutorial” Google search results. Azat is also the author of [Express.js
    Guide](http://expressjsguide.com), [Rapid Prototyping with JS](http://rpjs.co)
    and [Oh My JS](http://leanpub.com/ohmyjs).


