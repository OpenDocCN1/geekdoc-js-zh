    \ image with a caption. It’s a detailed view of an item, which in this case is\
    \ an apple. Nice work!\n\n### 3.5 Event Binding with Backbone.js and jQuery\n\n\
    In real life, getting data does not happen instantaneously, so let’s refactor\
    \ our code to simulate it. For a better UI/UX, we’ll also have to show a loading\
    \ icon (a.k.a., spinner or ajax-loader, see the picture below) to users to notify\
    \ them that the information is being loaded.\n\n![Spinner GIF](images/spinner.png)\n\
    \nSpinner GIF\n\nIt’s a good thing that we have event binding in Backbone. The\
    \ event binding is not an exclusive to Backbone feature, because it is part of\
    \ jQuery. But without Backbone organization and code structure, things tend to\
    \ end up messier (with plain jQuery). For example, we’ll have to pass a function\
    \ that renders HTML as a callback to the data loading function, to make sure that\
    \ the rendering function is not executed before we have the actual data to display.\n\
    \nTherefore, when a user goes to detailed view (`apples/:id`) we only call the\
    \ function that loads the data. Then, with the proper event listeners, our view\
    \ will automagically (this is not a typo) update itself; when there is a new data\
    \ (or on a data change, Backbone.js supports multiple and even custom events).\n\
    \nLet’s change the code in the router:\n\n```\n1   ...\n2     loadApple: function(appleName){\n\
    3       this.appleView.loadApple(appleName);\n4     }\n5   ...\n```\n\nEverything\
    \ else remains the same until we get to the `appleView` class. We’ll need to add\
    \ a constructor or an `initialize` method, which is a special word/property in\
    \ the Backbone.js framework. It’s called each time we create an instance of an\
    \ object, i.e., `var someObj = new SomeObject()`. We can also pass extra parameters\
    \ to the `initialize` function, as we did with our views (we passed an object\
    \ with the key `collection` and the value of `apples` Backbone Collection). Read\
    \ more on Backbone.js constructors at [backbonejs.org/#View-constructor](http://backbonejs.org/#View-constructor).\n\
    \n```\n1   ...\n2   var appleView = Backbone.View.extend({\n3     initialize:\
    \ function(){\n4       //TODO: create and setup model (aka an apple)\n5     },\n\
    6   ...\n```\n\nGreat, we have our `initialize` function. Now we need to create\
    \ a model which will represent a single apple and set up proper event listeners\
    \ on the model. We’ll use two types of events, `change` and a custom event called\
    \ `spinner`. To do that, we are going to use the `on()` function, which takes\
    \ these properties: `on(event, actions, context)` — read more about it at [backbonejs.org/#Events-on](http://backbonejs.org/#Events-on):\n\
    \n```\n1   ...\n2   var appleView = Backbone.View.extend({\n3       this.model\
    \ = new (Backbone.Model.extend({}));\n4       this.model.bind('change', this.render,\
    \ this);\n5       this.bind('spinner',this.showSpinner, this);\n6     },\n7  \
    \ ...\n```\n\nThe code above basically boils down to two simple things:\n\n1.\
    \  Call `render()` function of `appleView` object when the model has changed\n\
    \n2.  Call `showSpinner()` method of `appleView` object when event `spinner` has\
    \ been fired.\n\nSo far, so good, right? But what about the spinner, a GIF icon?\
    \ Let’s create a new property in `appleView`:\n\n```\n1   ...\n2     templateSpinner:\
    \ '<img src=\"img/spinner.gif\" width=\"30\"/>',\n3   ...\n```\n\nRemember the\
    \ `loadApple` call in the router? This is how we can implement the function in\
    \ `appleView`:\n\n```\n 1   ...\n 2   loadApple:function(appleName){\n 3     this.trigger('spinner');\n\
    \ 4     //show spinner GIF image\n 5     var view = this;\n 6     //we'll need\
    \ to access that inside of a closure\n 7     setTimeout(function(){\n 8     //simulates\
    \ real time lag when\n 9     //fetching data from the remote server\n10      \
    \ view.model.set(view.collection.where({\n11         name:appleName\n12      \
    \ })[0].attributes);\n13     },1000);\n14   },\n15   ...\n```\n\nThe first line\
    \ will trigger the `spinner` event (the function for which we still have to write).\n\
    \nThe second line is just for scoping issues (so we can use `appleView` inside\
    \ of the closure).\n\nThe `setTimeout` function is simulating a time lag of a\
    \ real remote server response. Inside of it, we assign attributes of a selected\
    \ model to our view’s model by using a `model.set()` function and a `model.attributes`\
    \ property (which returns the properties of a model).\n\nNow we can remove an\
    \ extra code from the `render` method and implement the `showSpinner` function:\n\
    \n```\n1   render: function(appleName){\n2     var appleHtml = this.template(this.model);\n\
    3     $('body').html(appleHtml);\n4   },\n5   showSpinner: function(){\n6    \
    \ $('body').html(this.templateSpinner);\n7   }\n8   ...\n```\n\nThat’s all! Open\
    \ `index.html#apples/gala` or `index.html#apples/fuji` in your browser and enjoy\
    \ the loading animation while waiting for an apple image to load.\n\nThe full\
    \ code of the `index.html` file:"
