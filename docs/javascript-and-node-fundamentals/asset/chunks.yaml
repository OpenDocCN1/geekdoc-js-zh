    \n## 3.8 结论\n\n本章前面提到的著名的 [Addy’s](https://github.com/addyosmani) [TodoMVC](http://todomvc.com/)\
    \ 资源包含了许多浏览器 JavaScript MV* 框架，并带有教程和示例。我经常被问到“你觉得 X 或 Y 怎么样？”关键在于不要在选择前端框架时陷入“分析瘫痪”。通过\
    \ `Backbone.js` 学习基础知识，因为它并不臃肿和复杂，但在优秀的人手中却被广泛使用且功能强大。然后，选择几个更新、更亮眼的库（例如 `React.js`、`Angular.js`），看看它们如何适应当前项目的特定目标。\n\
    \n## 4 Node.js 基础：服务器端的 JavaScript\n\nNode.js 是一个极其高效且可扩展的非阻塞 I/O 平台，构建在 Google\
    \ Chrome V8 引擎及其 ECMAScript 之上。这意味着大多数前端 JavaScript（另一种 ECMAScript 实现）对象、函数和方法在\
    \ Node.js 中都是可用的。如果你需要复习 JS 特有的基础，请参考 [JavaScript 基础](http://webapplog.com/js-fundamentals/)。\n\
    \n![](img/node-fun-site.png)\n\n开发者可以从其[网站](http://nodejs.org) 安装 Node.js，并遵循此\
    \ Node.js 核心概念概述。关于更详细的 Node.js 指南，请查看 [JS 快速原型：敏捷 JavaScript 开发](http://rpjs.co)\
    \ 和 [Node School](http://nodeschool.io)。\n\n![](img/node-fun-school.png)\n\n###\
    \ 4.1 Node.js 中的读取-评估-打印循环（又名 Console）\n\n与许多其他编程语言和平台一样，Node.js 拥有一个通过 `$ node`\
    \ 命令打开的读取-评估-打印循环工具。提示符会变为 `>`，我们可以像 Chrome 开发者控制台一样执行 JavaScript。Node.js 和浏览器在\
    \ ECMAScript 实现上存在细微差异（例如 `{}+{}`），但在大多数情况下，结果是相似的。\n\n![](img/node-fun-console.png)\n\
    \n正如你所看到的，我们可以在控制台中写一整天 JavaScript，但有时我们需要保存脚本以便稍后运行。\n\n### 4.2 启动 Node.js 脚本\n\
    \n要从文件启动 Node.js 脚本，只需运行 `$ node filename`，例如 `$ node program.js`。如果只需要一组快速执行的语句，可以使用\
    \ `-e` 选项来运行内联的 JavaScript/Node.js，例如 `$ node -e \"console.log(new Date());\"\
    `。\n\n### 4.3 Node.js 进程信息\n\n每个正在运行的 Node.js 脚本本质上都是一个进程。例如，`ps aux | grep 'node'`\
    \ 将输出机器上运行的所有 Node.js 程序。方便的是，开发者可以通过 `process` 对象在代码中访问有进程信息，例如 `node -e \"console.log(process.pid)\"\
    `：\n\n![使用 pid 和 cwd 的 Node.js 进程示例](img/node-fun-process.png)\n\n使用 pid 和 cwd\
    \ 的 Node.js 进程示例。\n\n### 4.4 访问 Node.js 中的全局作用域\n\n如你从 [JS 基础](http://webapplog.com/)所示，浏览器\
    \ JavaScript 默认将所有内容放入全局作用域。在 Douglas Crockford 著名的《JavaScript：好的部分》中，这被认为是 JavaScript\
    \ 的缺点之一。Node.js 的设计不同，所有内容默认都是局部的。在我们需要访问全局变量时，有一个 `global` 对象。同样，当我们需要导出某些内容时，应该显式地进行。\n\
    \n### 4.5 导出和导入模块\n\n浏览器 JavaScript 的另一个缺点是无法包含模块。脚本本应使用一种不同的语言（HTML）连接在一起，但缺乏依赖关系管理。[CommonJS](http://www.commonjs.org/)\
    \ 和 [RequireJS](http://requirejs.org/) 通过类似 AJAX 的方法解决了这个问题。Node.js 借用了 CommonJS\
    \ 概念的许多特性。\n\n在 Node.js 中导出一个对象，使用 `exports.name = object;`，例如：\n\n```\n 1 var\
    \ messages = {\n 2   find: function(req, res, next) {\n 3   ...\n 4   },\n 5 \
    \  add: function(req, res, next) {\n 6   ...\n 7   },\n 8   format: 'title | date\
    \ | author'\n 9 }\n10 exports.messages = messages;\n```\n\n而在导入上述脚本的文件中（假设路径和文件名为\
    \ `route/messages.js`）：\n\n```\n1 var messages = require('./routes/messages.js');\n\
    ```\n\n"
- fmt: "\n```javascript\n1 var fs = require('fs');\n2 fs.writeFile('message.txt',\
    \ 'Hello World!', function (err) {\n3   if (err) throw err;\n4   console.log('Writing\
    \ is done.');\n5 });\n```\n\n### 4.10 Streaming Data in Node.js\n\nStreaming data\
    \ is a term that mean an application processes the data while it’s still receiving\
    \ it. This is useful for extra large datasets, like video or database migrations.\n\
    \nHere’s a basic example on using streams that output the binary file content\
    \ back:\n\n```javascript\n1 var fs = require('fs');\n2 fs.createReadStream('./data/customers.csv').pipe(process.stdout);\n\
    ```\n\nBy default, `Node.js` uses `buffers` for `streams`.\n\nFor a more immersive\
    \ training, take a loot at [stream-adventure](http://npmjs.org/stream-adventure)\
    \ and [Stream Handbook](https://github.com/substack/stream-handbook).\n\n### 4.11\
    \ Installing Node.js Modules with NPM\n\n`NPM` comes with the `Node.js` platform\
    \ and allows for seamless `Node.js` package management. The way `npm install`\
    \ work is similar to `Git` in a way how [it traverses the working tree to find\
    \ a current project](https://npmjs.org/doc/files/npm-folders.html). For starter,\
    \ keep in mind that we need either the `package.json` file or the `node_modules`\
    \ folder, in order to install modules locally with `$ npm install name`, for example\
    \ `$ npm install superagent`; in the `program.js`: `var suparagent = requier('superagent');`.\n\
    \nThe best thing about `NPM` is that it keep all the dependencies local, so if\
    \ module `A` uses module `B` `v1.3` and module `C` uses module `B` `v2.0` (with\
    \ breaking changes comparing to `v1.3`), both `A` and `C` will have their own\
    \ localized copies of different versions of `B`. This proves to be a more superior\
    \ strategy unlike `Ruby` and other platforms that use global installations by\
    \ default.\n\nThe best practice is not include a `node_modules` folder into `Git`\
    \ repository when the project is a module that supposed to be use in other application.\
    \ However, it’s recommended to include `node_modules` for deployable applications.\
    \ This prevents a breakage caused by unfortunate dependency update.\n\nNote: The\
    \ `NPM` creator like to call it `npm` ([lowercase](http://npmjs.org/doc/misc/npm-faq.html#Is-it-npm-or-NPM-or-Npm)).\n\
    \n### 4.12 Hello World Server with HTTP Node.js Module\n\nAlthough, `Node.js`\
    \ can be use for a wide variety of tasks, it’s mostly knows for building web applications.\
    \ `Node.js` is thrives in the network due to its asynchronous nature and build-in\
    \ modules such as `net` and `http`.\n\nHere’s a quintessential Hello World examples\
    \ where we create a server object, define request handler (function with `req`\
    \ and `res` arguments), pass some data back to the recipient and start up the\
    \ whole thing.\n\n```javascript\n1 var http = require('http');\n2 http.createServer(function\
    \ (req, res) {\n3   res.writeHead(200, {'Content-Type': 'text/plain'});\n4   res.end('Hello\
    \ World\\n');\n5 }).listen(1337, '127.0.0.1');\n6 console.log('Server running\
    \ at http://127.0.0.1:1337/');\n```\n\nThe `req` and `res` parameters have all\
    \ the information about a given `HTTP` request and response correspondingly. In\
    \ addition, `req` and `res` can be used as-streams (look in the previous section).\n\
    \n### 4.13 Debugging Node.js Programs\n\nThe best debugger is `console.log()`,\
    \ but sometime we need to see the call stack and orient ourselves in async code\
    \ a bit more. To do that, put `debugger` statements in your code and use `$ node\
    \ debug program.js` to start [the debugging process](http://nodejs.org/api/debugger.html).\
    \ For more developer-friendly interface, download [node inspector](https://github.com/node-inspector/node-inspector).\n\
    \n### 4.14 Taming Callbacks in Node.js\n\n[Callbacks](https://github.com/maxogden/art-of-node#callbacks)\
    \ are able to `Node.js` code asynchronous, yet programmers unfamiliar with `JavaScript`,\
    \ who come from `Java` or `PHP`, might be surprised when they see `Node.js` code\
    \ described on [Callback Hell](http://callbackhell.com/):\n\n```javascript\n 1\
    \ fs.readdir(source, function(err, files) {\n 2   if (err) {\n 3     console.log('Error\
    \ finding files: ' + err)\n 4   } else {\n 5     files.forEach(function(filename,\
    \ fileIndex) {\n 6       console.log(filename)\n 7       gm(source + filename).size(function(err,\
    \ values) {\n 8         if (err) {\n 9           console.log('Error identifying\
    \ file size: ' + err)\n10         } else {\n11           console.log(filename\
    \ + ' : ' + values)\n12           aspect = (values.width / values.height)\n13\
    \           widths.forEach(function(width, widthIndex) {\n14             height\
    \ = Math.round(width / aspect)\n15             console.log('resizing ' + filename\
    \ + 'to ' + height + 'x' + height)\n16             this.resize(width, height).write(destination\
    \ + 'w' + width + '_' + fi\\\n17 lename, function(err) {\n18               if\
    \ (err) console.log('error')\n19             })\n20           }\n21         }\n\
    22       })\n23     }\n24   }\n25 ```\n\n### 4.15 Moving Forward with Node.js\
    \ \n\nThe best thing about `NPM` is that it keep all the dependencies local, so\
    \ if module `A` uses module `B` `v1.3` and module `C` uses module `B` `v2.0` (with\
    \ breaking changes comparing to `v1.3`), both `A` and `C` will have their own\
    \ localized copies of different versions of `B`. This proves to be a more superior\
    \ strategy unlike `Ruby` and other platforms that use global installations by\
    \ default.\n\nThe best practice is not include a `node_modules` folder into `Git`\
    \ repository when the project is a module that supposed to be use in other application.\
    \ However, it’s recommended to include `node_modules` for deployable applications.\
    \ This prevents a breakage caused by unfortunate dependency update.\n\nNote: The\
    \ `NPM` creator like to call it `npm` ([lowercase](http://npmjs.org/doc/misc/npm-faq.html#Is-it-npm-or-NPM-or-Npm)).\n\
    \n### 4.16 Introduction to Node.js \n\nThe `req` and `res` parameters have all\
    \ the information about a given `HTTP` request and response correspondingly. In\
    \ addition, `req` and `res` can be used as-streams (look in the previous section).\n\
    \n### 4.17 Overview of Node.js \n\nThe best debugger is `console.log()`, but sometime\
    \ we need to see the call stack and orient ourselves in async code a bit more.\
    \ To do that, put `debugger` statements in your code and use `$ node debug program.js`\
    \ to start [the debugging process](http://nodejs.org/api/debugger.html). For more\
    \ developer-friendly interface, download [node inspector](https://github.com/node-inspector/node-inspector).\n\
    \n### 4.18 Comprehensive Book on Express \n\n`Node.js` thrives in the network\
    \ due to its asynchronous nature and build-in modules such as `net` and `http`.\n\
    \n### 4.19 Essential Framework \n\nAlthough, `Node.js` can be use for a wide variety\
    \ of tasks, it’s mostly knows for building web applications. Hello World examples\
    \ where we create a server object, define request handler (function with `req`\
    \ and `res` arguments), pass some data back to the recipient and start up the\
    \ whole thing.\n"
