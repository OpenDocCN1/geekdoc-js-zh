  trans: "\n\n# Backbone.js 与 Underscore.js 视图与子视图\n\n# 超简单 Backbone 启动包\n\n# 结论\n\
    \n## 3.1 典型的 Backbone.js 应用结构\n\n在 `Backbone.js` 中只有四个类：\n\n* `Router`：`URL` 到方法的映射\n\
    * `View`：与浏览器和用户事件、HTML 输出（渲染）相关的方法\n* `Collection`：模型列表，并带有如 `fetch()` 等额外的辅助方法\n\
    * `Model`：单个数据项，带有额外的辅助方法\n\n一个典型的 `Backbone.js` 应用有一个主 `Router` 类。所有的路由（URL 路径）都从该类中定义。路由器可以创建并调用其他类的方法，例如\
    \ `Views`、`Collections` 和 `Models`。例如，对于路径 `/books`，我们将渲染书籍视图。\n\n推荐的用法是 `Views`\
    \ 通常只包含一个 `Collection` 或一个 `Model`。`Collection` 只是 `Models` 的列表。然而，这并不是固定不变的。`Backbone.js`\
    \ 非常灵活，应该根据具体需求使用。例如，一个应用可以有一个拥有 `Views` 的 `Model`，而每个 `View` 又拥有 `collections`。\n\
    \n在我们的简洁示例中，我们将有一个拥有 `Views` 的主 `Router`。这些 `Views` 将拥有模型和集合。\n\n## 3.2 从零开始设置\
    \ Backbone.js 应用\n\n首先，我们将使用 `Backbone.js` 和模型-视图-控制器（MVC）架构构建一个典型的启动“Hello World”应用程序。我知道这在开始听起来可能有些过度设计，但随着学习的进行，我们将增加越来越多的复杂度，包括\
    \ `Models`、`Subviews` 和 `Collections`。项目的结构遵循“简单至上”原则：\n\n* `index.html`：主文件以及所有的应用程序\
    \ JavaScript 代码\n* `jquery.js`：`jQuery` 库\n* `underscore.js`：`Underscore.js` 库\n\
    * `backbone.js`：`Backbone.js` 库\n\n“Hello World”应用的完整源代码可以在 GitHub 的 [github.com/azat-co/rpjs/backbone/hello-world](https://github.com/azat-co/rpjs/tree/master/backbone/hello-world)\
    \ 找到。\n\n`jQuery` 和 `Underscore` 是 `Backbone.js` 的必要依赖。\n\n## 3.3 Backbone.js\
    \ 项目的依赖\n\n为了构建我们的苹果数据库，我们需要下载以下库：\n\n* [jQuery 1.9 开发源文件](http://code.jquery.com/jquery-1.9.0.js)\n\
    * [Underscore.js 开发源文件](http://underscorejs.org/underscore.js)\n* [Backbone.js\
    \ 开发源文件](http://backbonejs.org/backbone.js)\n\n或者，你也可以从某些 CDN 热引入这些库（例如 [Google\
    \ 托管库](https://developers.google.com/speed/libraries/devguide)），但这样每次运行应用都需要连接网络。\n\
    \n在新创建的 `index.html` 文件中这样引入这些框架：\n\n```\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n\
    \ 4   <script src=\"jquery.js\"></script>\n 5   <script src=\"underscore.js\"\
    ></script>\n 6   <script src=\"backbone.js\"></script>\n 7 \n 8   <script>\n 9\
    \     //TODO 写一些酷的 JS 代码！\n10   </script>\n 11 \n 12 </head>\n 13 <body>\n 14\
    \ </body>\n 15 </html>\n```\n\n| ![information](img/leanpub_information.png) |\
    \  \n\n### 注意事项\n我们也可以在文件末尾的 `</</body>` 标签之后直接放置 `<script>` 标签。这会改变脚本和 HTML 其他部分的加载顺序，并对大文件的性能产生影响。\n\
    \n一些开发者倾向于避开使用 `Backbone Router`（它是一个可选的类/组件），但我们总是发现 `Router` 带来了更多好处和清晰度。在某种程度上，它是你应用程序的起点，有助于理解基础以及所有部分（如视图、模型等）是如何组合在一起的。所以，让我们在\
    \ `<script>` 标签内部定义一个简单的 `Backbone.js` `Router`：\n\n\n\n```\n1   ...\n2   var\
    \ router = Backbone.Router.extend({\n3   });\n4   ...\n```\n\n| ![information](img/leanpub_information.png)\
    \ |  \n\n### 注意事项\n目前，为了保持简单至上（KISS），我们将所有的 JavaScript 代码直接放入 `index.html` 文件中。这对于实际开发或生产代码不是一个好主意。我们稍后会重构。\n\
    \n然后在 `extend` 调用中设置一个特殊的 `routes` 属性：\n\n```\n1   var router = Backbone.Router.extend({\n\
    2     routes: {\n3     }\n4   });\n```\n\n`Backbone.js` 的 `routes` 属性需要遵循以下格式：`'path/:param':\
    \ 'action'`，这将导致 `filename#path/param` URL 触发名为 `action` 的函数（定义在 `Router` 对象中）。目前，我们将添加单个的\
    \ `home` 路由：\n\n```\n1   var router = Backbone.Router.extend({\n2     routes:\
    \ {\n3       '': 'home'\n4     }\n5   });\n```\n\n这很好，但现在我们需要在 `extend` 块中添加一个\
    \ `home` 方法：\n\n```\n1   var router = Backbone.Router.extend({\n2     routes:\
    \ {\n3       '': 'home'\n4     },\n5     home: function(){\n6       // TODO 逻辑\n\
    7     }\n8   });\n```\n\n第一行将创建 `homeView` 对象并将其赋值给路由的 `homeView` 属性。第二行将调用 `homeView`\
    \ 对象中的 `render()` 方法，触发渲染。\n\n"
- fmt: "\n```html\n 1 <!DOCTYPE>\n 2 <html>\n 3 <head>\n 4   <script src=\"jquery.js\"\
    ></script>\n 5   <script src=\"underscore.js\"></script>\n 6   <script src=\"\
    backbone.js\"></script>\n 7 \n 8   <script>\n 9 \n10     var app;\n11 \n12   \
    \  var router = Backbone.Router.extend({\n13       routes: {\n14         '': 'home'\n\
    15       },\n16       initialize: function(){\n17        //some code to execute\n\
    18        //when the object is instantiated\n19       },\n20       home: function(){\n\
    21         this.homeView = new homeView;\n22         this.homeView.render();\n\
    23       }\n24     });\n25 \n26     var homeView = Backbone.View.extend({\n27\
    \       el: 'body',\n28       template: _.template('Hello World'),\n29       render:\
    \ function(){\n30         this.$el.html(this.template({}));\n31       }\n32  \
    \   });\n33 \n34     $(document).ready(function(){\n35       app = new router;\n\
    36       Backbone.history.start();\n37     })\n38 \n39   </script>\n40 </head>\n\
    41 <body>\n42   <div></</div>>\n43 </body>\n44 </html>\n```\n\nOpen `index.html`\
    \ in the browser to see if it works, i.e., the “Hello World” message should be\
    \ on the page.\n\n### 3.4 Working with Backbone.js Collections\n\nBackbone Collections\
    \ are useful classes that developers can use for storing any sets of data that\
    \ belong to the same type. In other words, Collections are sets or lists of models,\
    \ and they (collections) can have their own custom methods and logic as well as\
    \ some built-in Backbone methods.\n\nThe full source code of Backbone Collections\
    \ example is under the GitHub’s [`rpjs/backbone/collections`](https://github.com/azat-co/rpjs/tree/master/backbone/collections).\n\
    \nThis example is about Backbone Collections, and it’s built on top of the previous\
    \ “Hello World” example from the **Setting up Backbone.js App from Scratch** which\
    \ is available for download at [`rpjs/backbone/hello-world`](https://github.com/azat-co/rpjs/tree/master/backbone/hello-world).\n\
    \nWe should add some data to play around with and to hydrate our views. To do\
    \ this, add this right after the `script` tag and before the other code:\n\n```\n\
    \ 1   var appleData = [\n 2     {\n 3       name: \"fuji\",\n 4       url: \"\
    img/fuji.jpg\"\n 5     },\n 6     {\n 7       name: \"gala\",\n 8       url: \"\
    img/gala.jpg\"\n 9     }\n10   ];\n```\n\nGrab the images (see picture below)\
    \ from GitHub: [https://github.com/azat-co/rpjs/tree/master/backbone/collections/img](https://github.com/azat-co/rpjs/tree/master/backbone/collections/img),\
    \ or add your own.\n\n![Fuji apple illustration](images/fuji.jpg)\n\nFuji apple\
    \ illustration\n\n![Gala apple illustration](images/gala.jpg)\n\nGala apple illustration\n\
    \nThis is our apple *database*. :-) Or to be more accurate, our REST API endpoint-substitute,\
    \ which provides us with names and image URLs of the apples (data models). If\
    \ you want some real-world servers, you can use:\n\n* [Parse.com](http://parse.com):\
    \ back-end-as-a-service provider\n* [Node.js and MongoDB REST API](http://webapplog.com/express-js-4-node-js-and-mongodb-rest-api-tutorial/):\
    \ a free-JSON API built with Node.js, Express.js and MongoDB\n\n| ![information](images/leanpub_information.png)\
    \ |  \n\n### Note\n\nThis mock dataset can be easily substituted by assigning\
    \ REST API endpoints of your back-end to `url` properties in Backbone.js Collections\
    \ and/or Models, and calling the `fetch()` method on them. |\n\nNow to make the\
    \ User Experience (UX) a little bit better, we can add a new route to the `routes`\
    \ object in the Backbone Route:\n\n```\n1   ...\n2   routes: {\n3     '': 'home',\n\
    4     'apples/:appleName': 'loadApple'\n5   },\n6   ...\n```\n\nThis will allow\
    \ users to go to `index.html#apples/SOMENAME` and expect to see some information\
    \ about an apple. This information will be fetched and rendered by the `loadApple`\
    \ function in the Backbone Router definition:\n\n```\n1   loadApple: function(appleName){\n\
    2     this.appleView.render(appleName);\n3   }\n```\n\nHave you noticed an `appleName`\
    \ variable? It’s exactly the same name as the one that we’ve used in `route`.\
    \ This is how we can access query string parameters (e.g., `?param=value&q=search`)\
    \ in Backbone.js.\n\nNow we’ll need to refactor some more code to create a Backbone\
    \ Collection, populate it with data in our `appleData` variable, and to pass the\
    \ collection to the `appleData` variable.\n\n```\n1   var Apples = Backbone.Collection.extend({\n\
    2   });\n```\n\n| ![information](images/leanpub_information.png) |  \n\n### Note\n\
    \nBackbone automatically creates models inside of collection when we use the `fetch()`\
    \ or `reset()` functions. |\n\nApple view is not any complex; it has only two\
    \ properties: `template` and `render`. In a template, we want to display `figure`,\
    \ `img` and `figcaption` tags with specific values. The Underscore.js template\
    \ engine is handy at this task:\n\n```javascript\n1   var appleView = Backbone.View.extend({\n\
    2     template: _.template(\n3           '<figure>\\\n4              <img src=\"\
    <%= attributes.url %>\"/>\\\n5              <figcaption><%= attributes.name %></figcaption>\\\
    \n6            </figure>'),\n```\n\nTo make a JavaScript string, which has HTML\
    \ tags in it, more readable we can use the back line breaker escape (`\\`), or\
    \ close strings and concatenate them with a plus sign (`+`). This is an example\
    \ of `appleView` above, which is refactored using the latter approach:\n\n```javascript\n\
    1   var appleView = Backbone.View.extend({\n2     template: _.template(\n3   \
    \      '<figure>'+\n4           +'<img src=\"<%= attributes.url %>\"/>'+\n5  \
    \         +'<figcaption><%= attributes.name %></figcaption>'+\n6         +'</figure>'),\n\
    ```\n\nPlease note the `<%=` and `%>` symbols; they are the instructions for Undescore.js\
    \ to print values in properties `url` and `name` of the `attributes` object.\n\
    \nFinally, we’re adding the render function to the `appleView` class.\n\n```javascript\n\
    1   render: function(appleName){\n2     var appleModel = this.collection.where({name:appleName})[0];\n\
    3     var appleHtml = this.template(appleModel);\n4     $('body').html(appleHtml);\n\
    5   }\n```\n\nWe find a model within the collection via `where()` method and use\
    \ `[]` to pick the first element. Right now, the `render` function is responsible\
    \ for both loading the data and rendering it. Later we’ll refactor the function\
    \ to separate these two functionalities into different methods.\n\nThe whole app,\
    \ which is in the [`rpjs/backbone/collections/index.html](https://github.com/azat-co/rpjs/tree/master/backbone/collections)\
    \ folder, looks like this:\n"
