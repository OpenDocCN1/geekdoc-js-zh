    \ 2, 3];\n 8 \n 9 d = function() {\n10   var e;\n11   e = a;\n12   return console.log(e);\n\
    13 };\n14 \n15 d();\n```\n\n### 2.3 Conditions\n\nConditions are more readable\
    \ by humans (English-like?) in CoffeeScript:\n\n```\n1 a = b = c = d = 1\n2 if\
    \ a is b or b isnt c and not c is d\n3   console.log 'true'\n4 else\n5   console.log\
    \ 'false'\n```\n\n```\n1 var a, b, c, d;\n 2 \n3 a = b = c = d = 1;\n 4 \n5 if\
    \ (a === b || b !== c && !c === d) {\n6   console.log('true');\n7 } else {\n8\
    \   console.log('false');\n9 }\n```\n\nSo `is` is `===`, `isnt` is `!==`, `not`\
    \ is `!`, `and` is `&&`, and `or` is `||`.\n\nIn CoffeeScript some fancy and arguably\
    \ more readable constructions are possible:\n\n```\n1 console.log a if a is not\
    \ null\n2 if a isnt null then console.log a\n3 if not a is null then console.log\
    \ a\n4 unless a is null then console.log a\n```\n\nNote: `unless` is just a shortcut\
    \ for `if not`.\n\n### 2.4 Functions\n\nFunctions in CoffeeScript are defined\
    \ with arrows `()->` and and fat arrows `()=>` (more on this later):\n\n```\n\
    1 a = (x,y) -> console.log x+y\n2 a(10,-5)\n```\n\nJavaScript code:\n\n```\n1\
    \ var a;\n 2 \n3 a = function(x, y) {\n4   return console.log(x + y);\n5 };\n\
    \ 6 \n7 a(10, -5);\n```\n\nLonger expressions can be on multiple lines using indentation,\
    \ while the default values can be assigned right in the function signature (i.e.,\
    \ `(name=value)`):\n\n```\n1 a = (x,y) -> console.log x+y\n2 a(10,-5)\n```\n"
  raw: "Most of these perks will be obvious once we take a look at some examples.\
    \ This quick language reference can get you started with CoffeeScript:\n\n*  \
    \ Semicolons, Whitespace and Parentheses\n\n*   Vars\n\n*   Conditions\n\n*  \
    \ Functions\n\n*   Classes\n\n*   Arrays\n\n*   Splats\n\n*   Comprehensions\n\
    \n### 2.1 Semicolons, Whitespace and Parentheses\n\nWhile in JavaScript, semicolons\
    \ are redundant and optional; in CoffeeScript they are banned.\n\nThe whitespace\
    \ and indentation (typically two-space) are parts of the CoffeeScript language.\n\
    \nParentheses for function invocation are optional (except when there are no arguments).\
    \ The same goes for curly braces for object literals. We can even next objects\
    \ without curly braces:\n\n```\n 1 a =\n 2   x: 1\n 3   y: -20\n 4   z: () ->\n\
    \ 5     console.log a.x+a.y\n 6 \n 7 a.z()\n 8 \n 9 b = [\n10   1,\n11   2,\n\
    12     x: 10\n13     y: 20\n14 ]\n```\n\nTranslates into this JavaScript:\n\n\
    ```\n 1 var a, b;\n 2 \n 3 a = {\n 4   x: 1,\n 5   y: -20,\n 6   z: function()\
    \ {\n 7     return console.log(a.x + a.y);\n 8   }\n 9 };\n10 \n11 a.z();\n12\
    \ \n13 b = [\n14   1, 2, {\n15     x: 10,\n16     y: 20\n17   }\n18 ];\n```\n\n\
    As you might have noticed, the logical block’s curly braces that we use to write\
    \ code for functions (i.e., `{}`) are also replaced by indentation. Let’s not\
    \ forget that functions are just objects in JavaScript. :-)\n\n### 2.2 Vars\n\n\
    CoffeeScript automatically inserts `var` keywords for us and prohibits manual\
    \ usage of `var`. For example, `a`,`b`, and `c` variable declarations will have\
    \ the `var` in the JavaScript code:\n\n```\n1 a = 10\n2 b = 'x'\n3 c = [1,2,3]\n\
    ```\n\nJavaScript code:\n\n```\n1 var a, b, c;\n2 \n3 a = 10;\n4 \n5 b = 'x';\n\
    6 \n7 c = [1, 2, 3];\n```\n\nCoffeeScript always puts `var`s at the top of the\
    \ scope where this particular variable was encountered first. The scope is defined\
    \ by the function or window. For example, the anonymous function `d` will have\
    \ `e` scoped to it, because CoffeeScript first saw `e` inside of the function:\n\
    \n```\n1 a = 10\n2 b = 'x'\n3 c = [1,2,3]\n4 \n5 d = () ->\n6   e = a\n7   console.log\
    \ e\n8 d()\n```\n\nJavaScript output:\n\n```\n 1 var a, b, c, d;\n 2 \n 3 a =\
    \ 10;\n 4 \n 5 b = 'x';\n 6 \n 7 c = [1, 2, 3];\n 8 \n 9 d = function() {\n10\
    \   var e;\n11   e = a;\n12   return console.log(e);\n13 };\n14 \n15 d();\n```\n\
    \n### 2.3 Conditions\n\nConditions are more readable by humans (English-like?)\
    \ in CoffeeScript:\n\n```\n1 a = b = c = d = 1\n2 if a is b or b isnt c and not\
    \ c is d\n3   console.log 'true'\n4 else\n5   console.log 'false'\n```\n\n```\n\
    1 var a, b, c, d;\n2 \n3 a = b = c = d = 1;\n4 \n5 if (a === b || b !== c && !c\
    \ === d) {\n6   console.log('true');\n7 } else {\n8   console.log('false');\n\
    9 }\n```\n\nSo `is` is `===`, `isnt` is `!==`, `not` is `!`, `and` is `&&`, and\
    \ `or` is `||`.\n\nIn CoffeeScript some fancy and arguably more readable constructions\
    \ are possible:\n\n```\n1 console.log a if a is not null\n2 if a isnt null then\
    \ console.log a\n3 if not a is null then console.log a\n4 unless a is null then\
    \ console.log a\n```\n\nNote: `unless` is just a shortcut for `if not`.\n\n###\
    \ 2.4 Functions\n\nFunctions in CoffeeScript are defined with arrows `()->` and\
    \ and fat arrows `()=>` (more on this later):\n\n```\n1 a = (x,y) -> console.log\
    \ x+y\n2 a(10,-5)\n```\n\nJavaScript code:\n\n```\n1 var a;\n2 \n3 a = function(x,\
    \ y) {\n4   return console.log(x + y);\n5 };\n6 \n7 a(10, -5);\n```\n\nLonger\
    \ expressions can be on multiple lines using indentation, while the default values\
    \ can be assigned right in the function signature (i.e., `(name=value)`):\n\n\
    ```\n1 a = (x, y, z=15) ->\n2  sum = x + y + z\n3  console.log sum\n4 a(10,-5)\n\
    ```\n\n```\n 1 var a;\n 2 \n 3 a = function(x, y, z) {\n 4   var sum;\n 5   if\
    \ (z == null) {\n 6     z = 15;\n 7   }\n 8   sum = x + y + z;\n 9   return console.log(sum);\n\
    10 };\n11 \n12 a(10, -5);\n```\n\nSo back to the far arrow, it does two things:\
    \ 1\\. Defines a function 2\\. Binds the new function’s scope to the current value\
    \ of `this`\n\nRemember that `this` is dynamically scoped, i.e., its meaning changes\
    \ based on where it is situated in the code (what’s the scope). For example, if\
    \ we have a jQuery event handler `click`, we might want to use `this` as the object\
    \ in which we defined the handler, not as the DOM element to which the handler\
    \ is bound.\n\nFor example, this CoffeeScript code will return `window` object\
    \ both times (that’s what we want):\n\n```\n1 console.log @\n2 $('div').click\
    \ ()=>\n3   console.log @\n```\n\nThe JavaScript code:\n\n```\n1 console.log(this);\n\
    2 \n3 $('div').click((function(_this) {\n4   return function() {\n5     return\
    \ console.log(_this);\n6   };\n7 })(this));\n```\n\nHowever, with single arrows\
    \ it’s back to the DOM scope for the event handler, (this might be bad if unexpected):\n\
    \n```\n1 console.log @\n2 $('div').click ()->\n3   console.log @\n```\n\n```\n\
    1 console.log(this);\n2 \n3 $('div').click(function() {\n4   return console.log(this);\n\
    5 });\n```\n\nTraditionally for the snippet above, without the CoffeeScript’s\
    \ far arrows, you would see workarounds like these which use interim variables\
    \ like `that`, `self`, or `_this`:\n\n```\n1 console.log(this);\n2 var that =\
    \ this;\n3 $('div').click(function() {\n4   return console.log(that);\n5 });\n\
    ```\n\n### 2.5 Classes\n\nClasses are probably the most yummiest and the most\
    \ complex and confusing feature in CoffeeScript. In JavaScript classes are absent\
    \ at all! We use prototypes instead, so the objects inherit from other objects.\
    \ We can also use factories, i.e., the functions that create objects.\n\nHowever,\
    \ if a developer wants to implement a class, it could be really tricky and often\
    \ requires a good understanding of pseudo-classical instantiation patterns. This\
    \ is not the case with CoffeeScript, which introduces `class` keyword. Inside\
    \ of the `class` we can use `constructor` method and `super` call, for the initialization\
    \ logic and the invocation of the parent’s methods correspondingly.\n\nFor example,\
    \ we have a parent class `Vehicle` from which we extend two classes `Compact`\
    \ and `Suv`. In these classes, we write custom `move` methods with the `super`\
    \ call, that allows us to re-use the logic from the parent class `Vehicle`.\n\n\
    ```\n 1 class Vehicle\n 2   constructor: (@name) ->\n 3 \n 4   move: (meters)\
    \ ->\n 5     console.log @name + \" moved #{meters} miles.\"\n 6 \n 7 class Compact\
    \ extends Vehicle\n 8   move: ->\n 9     console.log \"Cruising...\"\n10     super\
    \ 5\n11 \n12 class Suv extends Vehicle\n13   move: ->\n14     console.log \"Speeding...\"\
    \n15     super 45\n16 \n17 camry = new Compact \"Camry\"\n18 caddi = new Suv \"\
    Cadillac\"\n19 \n20 camry.move()\n21 caddi.move()\n```\n\nThe console outputs\
    \ this:\n\n```\n1 Cruising...\n2 Camry moved 5 miles.\n3 Speeding...\n4 Cadillac\
    \ moved 45 miles.\n```\n\nThe JavaScript output is quite lengthy, so no wonder\
    \ developers often prefer functional or other patterns:"
