    \ Whitespace and Parentheses\n\nWhile in JavaScript, semicolons are redundant\
    \ and optional; in CoffeeScript they are banned.\n\nThe whitespace and indentation\
    \ (typically two-space) are parts of the CoffeeScript language.\n\nParentheses\
    \ for function invocation are optional (except when there are no arguments). The\
    \ same goes for curly braces for object literals. We can even next objects without\
    \ curly braces:\n\n```\n 1 a =\n 2   x: 1\n 3   y: -20\n 4   z: () ->\n 5    \
    \ console.log a.x+a.y\n 6 \n 7 a.z()\n 8 \n 9 b = [\n10   1,\n11   2,\n12    \
    \ x: 10\n13     y: 20\n14 ]\n```\n\nTranslates into this JavaScript:\n\n```\n\
    \ 1 var a, b;\n 2 \n 3 a = {\n 4   x: 1,\n 5   y: -20,\n 6   z: function() {\n\
    \ 7     return console.log(a.x + a.y);\n 8   }\n 9 };\n10 \n11 a.z();\n12 \n13\
    \ b = [\n14   1, 2, {\n15     x: 10,\n16     y: 20\n17   }\n18 ];\n```\n\nAs you\
    \ might have noticed, the logical block’s curly braces that we use to write code\
    \ for functions (i.e., `{}`) are also replaced by indentation. Let’s not forget\
    \ that functions are just objects in JavaScript. -:-\n\n### 2.2 Vars\n\nCoffeeScript\
    \ automatically inserts `var` keywords for us and prohibits manual usage of `var`.\
    \ For example, `a`, `b`, and `c` variable declarations will have the `var` in\
    \ the JavaScript code:\n\n```\n1 a = 10\n2 b = 'x'\n3 c = [1,2,3]\n```\n\nJavaScript\
    \ code:\n\n```\n1 var a, b, c;\n 2 \n3 a = 10;\n 4 \n 5 b = 'x';\n 6 \n 7 c =\
    \ [1, 2, 3];\n```\n\nCoffeeScript always puts `var`s at the top of the scope where\
    \ this particular variable was encountered first. The scope is defined by the\
    \ function or window. For example, the anonymous function `d` will have `e` scoped\
    \ to it, because CoffeeScript first saw `e` inside of the function:\n\n```\n1\
    \ a = 10\n2 b = 'x'\n3 c = [1,2,3]\n 4 \n5 d = () ->\n6   e = a\n7   console.log\
    \ e\n8 d()\n```\n\nJavaScript output:\n\n```\n 1 var a, b, c, d;\n 2 \n 3 a =\
    \ 10;\n 4 \n 5 b = 'x';\n 6 \n 7 c = [1, 2, 3];\n 8 \n 9 d = function() {\n10\
    \   var e;\n11   e = a;\n12   return console.log(e);\n13 };\n14 \n15 d();\n```\n\
    \n### 2.3 Conditions\n\nConditions are more readable by humans (English-like?)\
    \ in CoffeeScript:\n\n```\n1 a = b = c = d = 1\n2 if a is b or b isnt c and not\
    \ c is d\n3   console.log 'true'\n4 else\n5   console.log 'false'\n```\n\n```\n\
    1 var a, b, c, d;\n 2 \n3 a = b = c = d = 1;\n 4 \n5 if (a === b || b !== c &&\
    \ !c === d) {\n6   console.log('true');\n7 } else {\n8   console.log('false');\n\
    9 }\n```\n\nSo `is` is `===`, `isnt` is `!==`, `not` is `!`, `and` is `&&`, and\
    \ `or` is `||`.\n\nIn CoffeeScript some fancy and arguably more readable constructions\
    \ are possible:\n\n```\n1 console.log a if a is not null\n2 if a isnt null then\
    \ console.log a\n3 if not a is null then console.log a\n4 unless a is null then\
    \ console.log a\n```\n\nNote: `unless` is just a shortcut for `if not`.\n\n###\
    \ 2.4 Functions\n\nFunctions in CoffeeScript are defined with arrows `()->` and\
    \ and fat arrows `()=>` (more on this later):\n\n```\n1 a = (x,y) -> console.log\
    \ x+y\n2 a(10,-5)\n```\n\nJavaScript code:\n\n```\n1 var a;\n 2 \n3 a = function(x,\
    \ y) {\n4   return console.log(x + y);\n5 };\n 6 \n7 a(10, -5);\n```\n\nLonger\
    \ expressions can be on multiple lines using indentation, while the default values\
    \ can be assigned right in the function signature (i.e., `(name=value)`):\n\n\
    ```\n1 a = (x,y) -> console.log x+y\n2 a(10,-5)\n```\n\nWait, let me re-evaluate\
