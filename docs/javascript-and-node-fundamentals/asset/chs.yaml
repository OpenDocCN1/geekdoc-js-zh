  \n 17       }\n 18     ];\n 19     var app;\n 20     var router = Backbone.Router.extend({\n\
  \ 21       routes: {\n 22         \"\": \"home\",\n 23         \"apples/:appleName\"\
  : \"loadApple\"\n 24       },\n 25       initialize: function(){\n 26         var\
  \ apples = new Apples();\n 27         apples.reset(appleData);\n 28         this.homeView\
  \ = new homeView({collection: apples});\n 29         this.appleView = new appleView({collection:\
  \ apples});\n 30       },\n 31       home: function(){\n 32         this.homeView.render();\n\
  \ 33       },\n 34       loadApple: function(appleName){\n 35         this.appleView.loadApple(appleName);\n\
  \ 36              \n 37     });\n 39     var appleItemView = Backbone.View.extend({\n\
  \ 40       tagName: 'li',\n 41       // template: _.template\n 42       //<a href=\"\
  #name%\" target=\"_blank\">'\n 43       //<%=name%>\n 44       //&nbsp;<a class=\"\
  add-cart\" href=\"#\"></a>\n 45       template: _.template('\\\n 46            \
  \  <a href=\"#name%\" target=\"_blank\">\\\n 47             <%=name%>\\\n 48   \
  \          &nbsp;<a class=\"add-cart\" href=\"#\"></a>\n 49       '),\n 50     \
  \  \n 51       events: {\n 52         'click .add-cart': 'addToCart'\n 53      \
  \ },\n 54       render: function() {\n 55         this.$el.html(this.template);\n\
  \ 56       },\n 57       addToCart: function(){\n 58         this.collection.trigger('addToCart',\
  \ this.model);\n 59       }\n 60     });\n 61     \n 62     var homeView = Backbone.View.extend({\n\
  \ 63       el: 'body',\n 64       listEl: '.apples-list',\n 65       cartEl: '.cart-box',\n\
  \ 66       template: _.template('Apple data: \\\n 67         <ul class=\"apples-list\"\
  >\\\n 68         </ul>\\\n 69         <div class=\"cart-box\"></div>'),\n 70   \
  \    initialize: function() {\n 71         this.$el.html(this.template);\n 72  \
  \       this.collection.on('addToCart', this.showCart, this);\n 73       },\n 74\
  \       showCart: function(appleModel) {\n 75         $(this.cartEl).append(appleModel.attributes.name+'<br/>');\n\
  \ 76       },\n 77       render: function(){\n 78         view = this; //这样我们可以在闭包内部使用\
  \ view\n 79         this.collection.each(function(apple){\n 80           var appleSubView\
  \ = new appleItemView({model:apple});\n 81           //创建一个带有 model apple 的子视图\n\
