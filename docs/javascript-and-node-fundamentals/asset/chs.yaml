  \n## 3.8 结论\n\n本章前面提到的著名的 [Addy’s](https://github.com/addyosmani) [TodoMVC](http://todomvc.com/)\
  \ 资源包含了许多浏览器 JavaScript MV* 框架，并带有教程和示例。我经常被问到“你觉得 X 或 Y 怎么样？”关键在于不要在选择前端框架时陷入“分析瘫痪”。通过\
  \ `Backbone.js` 学习基础知识，因为它并不臃肿和复杂，但在优秀的人手中却被广泛使用且功能强大。然后，选择几个更新、更亮眼的库（例如 `React.js`、`Angular.js`），看看它们如何适应当前项目的特定目标。\n\
  \n## 4 Node.js 基础：服务器端的 JavaScript\n\nNode.js 是一个极其高效且可扩展的非阻塞 I/O 平台，构建在 Google\
  \ Chrome V8 引擎及其 ECMAScript 之上。这意味着大多数前端 JavaScript（另一种 ECMAScript 实现）对象、函数和方法在\
  \ Node.js 中都是可用的。如果你需要复习 JS 特有的基础，请参考 [JavaScript 基础](http://webapplog.com/js-fundamentals/)。\n\
  \n![](img/node-fun-site.png)\n\n开发者可以从其[网站](http://nodejs.org) 安装 Node.js，并遵循此 Node.js\
  \ 核心概念概述。关于更详细的 Node.js 指南，请查看 [JS 快速原型：敏捷 JavaScript 开发](http://rpjs.co) 和 [Node\
  \ School](http://nodeschool.io)。\n\n![](img/node-fun-school.png)\n\n### 4.1 Node.js\
  \ 中的读取-评估-打印循环（又名 Console）\n\n与许多其他编程语言和平台一样，Node.js 拥有一个通过 `$ node` 命令打开的读取-评估-打印循环工具。提示符会变为\
  \ `>`，我们可以像 Chrome 开发者控制台一样执行 JavaScript。Node.js 和浏览器在 ECMAScript 实现上存在细微差异（例如 `{}+{}`），但在大多数情况下，结果是相似的。\n\
  \n![](img/node-fun-console.png)\n\n正如你所看到的，我们可以在控制台中写一整天 JavaScript，但有时我们需要保存脚本以便稍后运行。\n\
  \n### 4.2 启动 Node.js 脚本\n\n要从文件启动 Node.js 脚本，只需运行 `$ node filename`，例如 `$ node program.js`。如果只需要一组快速执行的语句，可以使用\
  \ `-e` 选项来运行内联的 JavaScript/Node.js，例如 `$ node -e \"console.log(new Date());\"`。\n\
  \n### 4.3 Node.js 进程信息\n\n每个正在运行的 Node.js 脚本本质上都是一个进程。例如，`ps aux | grep 'node'`\
  \ 将输出机器上运行的所有 Node.js 程序。方便的是，开发者可以通过 `process` 对象在代码中访问有进程信息，例如 `node -e \"console.log(process.pid)\"\
  `：\n\n![使用 pid 和 cwd 的 Node.js 进程示例](img/node-fun-process.png)\n\n使用 pid 和 cwd 的\
  \ Node.js 进程示例。\n\n### 4.4 访问 Node.js 中的全局作用域\n\n如你从 [JS 基础](http://webapplog.com/)所示，浏览器\
  \ JavaScript 默认将所有内容放入全局作用域。在 Douglas Crockford 著名的《JavaScript：好的部分》中，这被认为是 JavaScript\
  \ 的缺点之一。Node.js 的设计不同，所有内容默认都是局部的。在我们需要访问全局变量时，有一个 `global` 对象。同样，当我们需要导出某些内容时，应该显式地进行。\n\
  \n### 4.5 导出和导入模块\n\n浏览器 JavaScript 的另一个缺点是无法包含模块。脚本本应使用一种不同的语言（HTML）连接在一起，但缺乏依赖关系管理。[CommonJS](http://www.commonjs.org/)\
  \ 和 [RequireJS](http://requirejs.org/) 通过类似 AJAX 的方法解决了这个问题。Node.js 借用了 CommonJS\
  \ 概念的许多特性。\n\n在 Node.js 中导出一个对象，使用 `exports.name = object;`，例如：\n\n```\n 1 var messages\
  \ = {\n 2   find: function(req, res, next) {\n 3   ...\n 4   },\n 5   add: function(req,\
  \ res, next) {\n 6   ...\n 7   },\n 8   format: 'title | date | author'\n 9 }\n\
  10 exports.messages = messages;\n```\n\n而在导入上述脚本的文件中（假设路径和文件名为 `route/messages.js`）：\n\
  \n```\n1 var messages = require('./routes/messages.js');\n```\n\n\n\n\n\n```javascript\n\
  1 var fs = require('fs');\n2 fs.writeFile('message.txt', 'Hello World!', function\
  \ (err) {\n3   if (err) throw err;\n4   console.log('Writing is done.');\n5 });\n\
  ```\n\n### 4.10 Node.js 中的数据流处理\n\n数据流（Streaming data）是一个术语，意味着应用程序在接收数据的同时对其进行处理。这对于大型数据集（如视频或数据库迁移）非常有用。\n\
  \n这里是一个使用流并输出二进制文件内容的简单示例：\n\n```javascript\n1 var fs = require('fs');\n2 fs.createReadStream('./data/customers.csv').pipe(process.stdout);\n\
  ```\n\n默认情况下，`Node.js` 对 `streams` 使用缓冲区（`buffers）。\n\n为了获得更沉浸式的训练，请查看 [stream-adventure](http://npmjs.org/stream-adventure)\
  \ 和 [Stream Handbook](https://github.com/substack/stream-handbook)。\n\n### 4.11\
  \ 使用 NPM 安装 Node.js 模块\n\n`NPM` 随 `Node.js` 平台一起提供，允许进行无缝的 `Node.js` 包管理。`npm install`\
  \ 的工作方式与 `Git` 相似，之处在于[它会遍历工作树以寻找当前项目](https://npmjs.org/doc/files/npm-folders.html)。作为入门，请记住我们需要\
  \ `package.json` 文件或 `node_modules` 文件夹，以便通过 `$ npm install name` 在本地安装模块，例如 `$\
  \ npm install superagent`；在 `program.js` 中：`var suparagent = requier('superagent');`。\n\
  \n`NPM` 的最大优点在于它将所有依赖项保留在本地，因此如果模块 `A` 使用模块 `B` `v1.3`，而模块 `C` 使用模块 `B` `v2.0`（与\
  \ `v1.3` 相比有破坏性更改），那么 `A` 和 `C` 将拥有各自不同版本 `B` 的本地副本。这证明是一种更优的策略，与默认使用全局安装的 `Ruby`\
  \ 等平台不同。\n\n当项目要在其他应用程序使用的模块时，最佳实践是不将 `node_modules` 文件夹包含在 `Git` 仓库中。然而，对于可部署的应用程序，建议包含\
  \ `node_modules`。这可以防止因意外更新依赖导致的损坏。\n\n注意：`NPM` 的创建者喜欢称之为 `npm`（[小写](http://npmjs.org/doc/misc/npm-faq.html#Is-it-npm-or-NPM-or-Npm)）。\n\
  \n### 4.12 使用 HTTP Node.js 模块创建 Hello World 服务器\n\n尽管 `Node.js` 可用于各种任务，但它主要以构建\
  \ Web 而闻名。由于其异步性质以及如 `net` 和 `http` 等内置模块，`Node.js` 在网络领域非常出色。\n\n这是一个典型的 Hello\
  \ World 示例，我们创建一个服务器对象，定义请求处理程序（带有 `req` 和 `res` 参数的函数），向接收者传回一些数据并启动整个过程。\n\n```javascript\n\
  1 var http = require('http');\n2 http.createServer(function (req, res) {\n3   res.writeHead(200,\
  \ {'Content-Type': 'text/plain'});\n4   res.end('Hello World\\n');\n5 }).listen(1337,\
  \ '127.0.0.1');\n6 console.log('Server running at http://127.0.0.1:1337/');\n```\n\
  \n`req` 和 `res` 参数分别拥有有关给定 `HTTP` 请求和响应的所有信息。此外，`req` 和 `res` 可以作为流使用（请看上一节）。\n\n\
  ### 4.13 调试 Node.js 程序\n\n最好的调试器是 `console.log()`，但有时我们需要查看调用栈并在异步代码中更好地定位。要做到这一点，请在你的代码中放置\
  \ `debugger` 语句，并使用 `$ node debug program.js` 来启动[调试过程](http://nodejs.org/api/debugger.html)。对于更友好的界面，请下载\
  \ [node inspector](https://github.com/node-inspector/node-inspector)。\n\n### 4.14\
  \ 驯服 Node.js 中的回调\n\n[回调](https://github.com/maxogden/art-of-node#callbacks) 能够让\
  \ `Node.js` 代码异步化，但来自 `Java` 或 `PHP` 且熟悉 `JavaScript` 的程序员在看到描述[回调地狱](http://callbackhell.com/)\
  \ 的 Node.js 代码时，可能会惊讶：\n\n```javascript\n 1 fs.readdir(source, function(err, files)\
  \ {\n2   if (err) {\n3     console.log('Error finding files: ' + err)\n4   } else\
  \ {\n5     files.forEach(function(filename, fileIndex) {\n6       console.log(filename)\n\
  7       gm(source + filename).size(function(err, values) {\n8         if (err) {\n\
  9           console.log('Error identifying file size: ' + err)\n10         } else\
  \ {\n11           console.log(filename + ' : ' + values)\n12           aspect =\
  \ (values.width / values.height)\n13           widths.forEach(function(width, widthIndex)\
  \ {\n14             height = Math.round(width / aspect)\n15             console.log('resizing\
  \ ' + filename + ' ' + height)\n16             })\n17             })\n18       \
  \    }\n19         }\n20       })\n21     }\n22   }\n23 }\n```\n\n\n\n\n\n第一个路由基本上处理所有指向首页的请求，例如\
  \ `http://localhost:3000/`；后者处理指向 `/users` 的请求，例如 `http://localhost:3000/users`。这两个条路由在处理\
  \ URL 时均不区分大小写，并且处理末尾斜线的方式相同。\n\n请求处理程序本身（在此例中为 `index.js`）非常直观：HTTP 请求中的所有内容都在\
  \ `req` 中，并将结果写入响应 `res` 中：\n\n```\n1 exports.list = function(req, res){\n2   res.send(\"\
  respond with a resource\");\n3 };\n```\n\n### 5.4 中间件作为 Express.js 的核心\n\n路由上面的每一行都是中间件：\n\
  \n```\n1 app.use(express.favicon());\n2 app.use(express.logger('dev'));\n3 app.use(express.bodyParser());\n\
  4 app.use(express.methodOverride());\n5 app.use(app.router);\n6 app.use(express.static(path.join(__dirname,\
  \ 'public')));\n```\n\n中间件是透传函数，当请求通过每个中间件时，会向请求中添加有用的内容，例如 `req.body` 或 `req.cookie`。更多关于中间件的编写请查看\
  \ [Express.js 简介：参数、错误处理和其他中间件](http://webapplog.com/intro-to-express-js-parameters-error-handling-and-other-middleware/)。\n\
  \n### 5.5 Express.js 应用的配置\n\n以下是我们在典型的 Express.js 应用中定义配置的方式：\n\n```\n1 app.set('port',\
  \ process.env.PORT || 3000);\n2 app.set('views', __dirname + '/views');\n3 app.set('view\
  \ engine', 'jade');\n```\n\n普通的设置涉及一个名称（例如 `views`）和一个值（例如模板/视图所在文件夹的路径）。定义特定设置有多种方法，例如用于布尔标志的\
  \ `app.enable`。\n\n### 5.6 Jade 是适用于 Express.js/Node.js 的 Haml\n\nJade 模板引擎在利用空格和缩进方面与\
  \ Ruby on Rails 的 Haml 相似，例如 `layout.jade`：\n\n```\n1 doctype 5\n2 html\n3   head\n\
  4     title= title\n5     link(rel='stylesheet', href='/stylesheets/style.css')\n\
  6   body\n7     block content\n```\n\n除此之外，还可以在 Jade 模板内部利用完整的 JavaScript 代码。\n\n\
  ### 5.7 关于 Express.js 框架的总结\n\n如你所见，使用 Express.js 创建 MVC Web 应用是轻而易举的。该框架对于 REST\
  \ API 同样出色。如果你感兴趣，请访问 [教程：使用 Mongo 和 Express.js 构建 Node.js 和 MongoDB JSON REST API\
  \ 服务器](http://webapplog.com/tutorial-node-js-and-mongodb-json-rest-api-server-with-mongoskin-and-express-js/)\
  \ 和 [Express.js 简介：使用 Monk 和 MongoDB 构建简单 REST API 应用](http://webapplog.com/intro-to-express-js-simple-rest-api-app-with-monk-and-mongodb/)。\n\
  \n如果你想了解其他中间件和配置，请查看 [Express.js API 文档](http://expressjs.com/api.html)、[Connect\
  \ 文档](http://www.senchalabs.org/connect/)，当然还有我们的书籍——[Express.js Guide](http://expressjsguide.com)。对于那些已经熟悉\
  \ Express.js 基础的人，我推荐阅读 [ExpressWorks](http://webapplog.com/expressworks)。\n\n###\
  \ 5.8 更新\n\n如果你想了解其他中间件和配置，请查看 [Express.js API 文档](http://expressjs.com/api.html)、[Connect\
  \ 文档](http://www.senchalabs.org/connect/)，当然还有我们的书籍——[Express.js Guide](http://expressjsguide.com)。\n\
