  \ sub_lists(my_list):\n    subs = []\n    for i in range(0, len(my_list)+1):\n \
  \       temp = [list(x) for x in combinations(my_list, i)]\n        if len(temp)>0:\n\
  \            subs.extend(temp)\n    return subs\nl1 = [10, 20, 30, 40]\nl2 = ['X',\
  \ 'Y', 'Z']\nprint(\"Original list: \",l1)\nprint(sub_lists(l1))\nprint(\"Original\
