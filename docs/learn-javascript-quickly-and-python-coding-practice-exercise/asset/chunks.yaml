  trans: "\n\n![](img/cover00189.jpeg)\n\n# 快速上手 JavaScript 与 Python 编程练习题\n# 面向初者的实战项目编程\n\
    ## 作者：J J TAM\n\n## 目录\n- Javascript 简介;\n  </script>\n</body>\n</html>\n```\n\
    \n![`1.bp.blogspot.com/-JJo0VYFJ_jw/W30-Atn4RXI/AAAAAAAAK_w/rOj32k5M6cQxtQnQUGLah6PApXRoWUNwCLcBGAs/s400/javascript%2Bhello%2Bworld.png`](https://1.bp.blogspot.com/-JJo0VYFJ_jw/W30-Atn4RXI/AAAAAAAAK_w/rOj32k5M6cQxtQnQUGLah6PApXRoWUNwCLcBGAs/s1600/javascript+hello+world.png)\n\
    \n`document.write(\"Hello World\");`\n\n上面的语句指示浏览器写入 \"Hello World\"。JavaScript\
    \ 嵌入在 `<script></script>` 标签之间。\n\n# Javascript: 变量\n变量存储值。以下是一些变量的示例。\n\n```javascript\n\
    var name = \"Krishna\"\nvar id=123\n```\n\n上面的语句定义了两个变量 `name, id`。使用 `var` 关键字定义变量。\n\
    \n命名限制\na. 变量名必须以字母、`_`（或）$` 开头。\nb. 变量名可以包含任何字符。\nc. 变量名之间不允许有空格。\n\n"
- fmt: "\nd. Don’t use Javascript keywords as variable names.\n\ne. Variable names\
    \ are case sensitive. `Name`, `NAme`, `name` are 3 different variables.\n\n`variables.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Variables</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n    var name = \"Krishna\";\n   \
    \ var id=123;\n    document.write(\"name = \" + name + \"<br />\");\n    document.write(\"\
    id = \" + id);\n  </script>\n</body>\n</html>\n```\n\n![https://4.bp.blogspot.com/-O-JnK9iTAFQ/W31iUbfUt-I/AAAAAAAAK_8/LMPN1uFd-9s0k89LIe3P_BCA1SJ8-6HhQCLcBGAs/s400/javascript%2Bvariables.png](Images/image00179.jpeg)\n\
    \n### Note\nJava script is case sensitive, so the names `banana`, `Banana`, `BaNaNa`\
    \ are three different variables.\n\n# Javascript: Statements\n\nStatement is an\
    \ executable statement, statements in Javascript are terminated using ‘;’.\n\n\
    `statements.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Variables</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"Hello\
    \ World\" + \"<br />\");\n    document.write(\"Hello PTR\");\n  </script>\n</body>\n\
    </html>\n```\n\n![https://2.bp.blogspot.com/-rEgK0RZJ_SQ/W34wutk8G5I/AAAAAAAALAY/6cu0u5abWAsq-UtYv7UprNWX2zCmpjbgCLcBGAs/s320/javascript%2Bstatements.png](Images/image00180.jpeg)\n\
    \nIn the above example, below are the java script statements.\n\n`document.write(\"\
    Hello World\" + \"<br />\");`\n\n`document.write(\"Hello PTR\");`\n\n# Javascript:\
    \ comments\n\nComments are used to document the source code. Comments in javaScript,\
    \ makes the program more readable. Comments are ignored by JavaScript.\n\nSuppose\
    \ you written thousand lines of program, with out proper documentation, after\
    \ some time, for the owner of the application also, it is very difficult to figure\
    \ out what was written.\n\nComments solve this problem:\n\nBy using comments,\
    \ you can document your code at the time of writing program. Comments won't affect\
    \ your program execution. Comments simply document your code.\n\nJavascript support\
    \ 2 kinds of comments.\n\na. Single line comments\nb. Multi line comments\n\n\
    ### Single line comment\nSingle line comments starts with `//`\n\n```javascript\n\
    // It is a single line comment\n```\n\n### Multi Line comment\nMulti line comments\
    \ are encoded in `/* */`.\n\n```javascript\n/* I am a mulltiline comment */\n\
    ```\n\n`sample.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Variables</title>\n\
    </head>\n<body>\n  <script type=\"text/javascript\">\n    var a = 10;\n    document.write(\"\
    Value of a is \" + a + \"<br />\");\n    a = \"Hello World\"; // Assigning string\n\
    \    document.write(\"Value of a is \" + a + \"<br />\");\n    a = true; // Assigning\
    \ boolean\n    document.write(\"Value of a is \" + a + \"<br />\");\n    a = 10.09;\
    \ // Assigning number\n    document.write(\"Value of a is \" + a + \"<br />\"\
    );\n  </script>\n</body>\n</html>\n```\n\n# JavaScript: Types\n\nTypes are used\
    \ to represent the type of data. Primarily, there are two categories of types.\n\
    \na. Primitive types\nb. Reference types\n\n### Primitive Types\nNumbers, strings\
    \ and Boolean values considered as primitive types. In addition to these, special\
    \ values `null`, `undefined` are also considered as primitive types.\n\n### Reference\
    \ Types\nObjects and arrays are considered as reference types. An object is a\
    \ collection of name and value pairs. Array is a collection of elements.\n\nOne\
    \ more thing to note is that JavaScript treats functions also objects.\n\n`types.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Data Types</title>\n</head>\n\
    <body>\n  <script>\n    var a = 10;\n    var b = 10.01;\n    var c = true;\n \
    \   var d = \"Hello World\";\n    var e = {\n      name : \"Hari krishna\",\n\
    \      city : \"Bangalore\"\n    };\n    var f = [2, 3, 5, 7];\n    document.write(\"\
    a = \" + a + \" Type of a = \" + (typeof a) + \"<br />\");\n    document.write(\"\
    b = \" + b + \" Type of b = \" + (typeof b) + \"<br />\");\n    document.write(\"\
    c = \" + c + \" Type of c = \" + (typeof c) + \"<br />\");\n    document.write(\"\
    d = \" + d + \" Type of d = \" + (typeof d) + \"<br />\");\n    document.write(\"\
    e = \" + e + \" Type of e = \" + (typeof e) + \"<br />\");\n    document.write(\"\
    f = \" + f + \" Type of f = \" + (typeof f) + \"<br />\");\n  </script>\n</body>\n\
    </html>\n```\n\nOpen above page in browser, you able to see following:\n`a = 10`\
    \ Type of `a` = `number`\n`b = 10.01` Type of `b` = `number`\n`c = true` Type\
    \ of `c` = `boolean`\n`d = Hello World` Type of `d` = `string`\n`e = [object Object]`\
    \ Type of `e` = `object`\n`f = 2,3,5,7` Type of `f` = `object`\n\nAs you see the\
    \ output, JavaScript treats both integer and float values as number and arrays\
    \ are treated as object.\n\n# Javascript: operators\n\nAn operator is a symbol\
    \ which perform operation. An operator is said to be unary, if performs operation\
    \ on single operand. An operator is said to be binary, if performs on two operands.\
    \ An Operator is said to be ternary if perform on three operands. Javascript provides\
    \ following operators:\n\na. Arithmetic operators\nb. Increment/decrement `++`,\
    \ `--`\nc. Bitwise operators\nd. Logical operators\ne. Assignment operators\n\
    f. String concatenation\ng. Comparison operators\nh. Other operators like `===`,\
    \ ternary `?:`\n\n# Javascript: Arithmetic Operators\n\nFollowing table summarizes\
    \ Arithmetic operators supported by Javascript.\n\n| Operator | Description |\n\
    | :--- | :--- |\n| `+` | Addition (also used for String concatenation) |\n| `-`\
    \ | Subtraction |\n| `/` | Division |\n| `*` | Multiplication |\n| `%` | Remainder\
    \ |\n\n`arithmetic.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Arithmetic\
    \ Operators</title>\n  <style>\n    p{font-size: 2em; color: seagreen; }\n  </style>\n\
    </head>\n<body>\n  <p>\n    <script type=\"text/javascript\">\n      var a = 23;\n\
    \      var b = 3;\n      document.write(\"a = \" + a + \"<br />\");\n      document.write(\"\
    b = \" + b + \"<br />\");\n      document.write(\"a+b = \" + (a+b) + \"<br />\"\
    );\n      document.write(\"a-b = \" + (a-b) + \"<br />\");\n      document.write(\"\
    a*b = \" + (a*b) + \"<br />\");\n      document.write(\"a/b = \" + (a/b) + \"\
    <br />\");\n      document.write(\"a%b = \" + (a%b) + \"<br />\");\n    </script>\n\
    \  </p>\n</body>\n</html>\n```\n\n### Note\nUnlike languages like Java, integer\
    \ division in JavaScript returns float value.\n\n# Javascript: Increment/decrement:\
    \ ++, -- operators\n\nIncrement & decrement operators\n`++` Increment operator;\
    \ increments a value by 1\n`--` Decrement operator; decrements a value by 1\n\n\
    ### Pre increment\nSyntax: `++variable`\npre increment operator increments the\
    \ variable value by 1 immediately.\n\n### Post increment\nSyntax: `variable++`\n\
    post increment operator increments the variable value by 1 after executing the\
    \ current statement.\n\n### Pre Decrement\nSyntax: `--variable`\npre decrement\
    \ operator decrements the variable value by 1 immediately.\n\n### Post Decrement\n\
    Syntax: `variable--`\npost decrement operator decrements the variable value by\
    \ 1 after executing the current statement.\n\n`arithmetic.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Increment&Decrement Operators</title>\n  <style>\n\
    \    p{font-size: 2em; color: seagreen; }\n  </style>\n</head>\n<body>\n  <p>\n\
    \    <script type=\"text/javascript\">\n      var a = 23;\n      document.write(\"\
    a = \" + a + \"<br />\");\n      document.write(\"a++ = \" + (a++) + \"<br />\"\
    );\n      document.write(\"++a = \" + (++a) + \"<br />\");\n      document.write(\"\
    a-- = \" + (a--) + \"<br />\");\n      document.write(\"--a = \" + (--a) + \"\
    <br />\");\n    </script>\n  </p>\n</body>\n</html>\n```\n\n# Javascript: Bitwise\
    \ operators\n\nFollowing table summarizes the bitwise operators supported by Javascript.\n\
    \n| Operator | Description |\n| :--- | :--- |\n| `~` | Inverts bit pattern |\n\
    | `<<` | Perform Left shift |\n| `>>` | Perform Right Shift |\n| `>>>` | Perform\
