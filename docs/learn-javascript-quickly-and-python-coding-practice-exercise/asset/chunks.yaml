    \ var y = (x >  10) ?  \"x is greater than 10\"  :  \"x is less than 11\";\n document.write(\"\
    value of x is \"  + x +  \"<br />\");\n document.write(y);\n </script>\n</body>\n\
    </html>\n```\n\n# JavaScript：处理布尔值\n\n以下值被视为假：\na. `undefined`\nb. `Null`\nc.\
    \ `+0`、`−0` 或 `NaN`\nd. 空字符串\n\n所有未在上述提到的值都被视为真。\n\nbool.html`\n\n```html\n<!DOCTYPE\
