    \ (a /=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a%=10) = \"  + (a\
    \ %=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a>>=10) = \"  + (a\
    \ >>=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a<<=10) = \"  + (a\
    \ <<=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a>>>=10) = \"  + (a\
    \ >>>=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a&=10) = \"  + (a\
    \ &=  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a|=10) = \"  + (a |=\
    \  10) +  \"<br />\");\n\na =  7;\n\n document.write(\"(a^=10) = \"  + (a ^= \
    \ 10) +  \"<br />\");\n\n </script>\n\n </p>\n\n</body>\n\n</html>\n\n# Javascript:\
