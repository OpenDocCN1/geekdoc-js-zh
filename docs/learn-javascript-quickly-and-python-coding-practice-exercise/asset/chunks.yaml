    ```\nOpen above html file in browser, it prompts for input. If you enter even\
    \ number, it prints the message 'You entered even number' else it prints \"You\
    \ entered odd number\".\n\n# Javascript: if-else-if-else ladder\n\nIn my previous\
    \ post, I explained about `if` statement, `if-else` statement. In addition to\
    \ these, Javascript provides `if-else if- else` ladder, used to choose a solution,\
    \ when you had multiple alternatives.\n\n### Syntax\n```javascript\nif(condition){\n\
    \    //Block of statements\n}else if(condition){\n    //Block of statements\n\
