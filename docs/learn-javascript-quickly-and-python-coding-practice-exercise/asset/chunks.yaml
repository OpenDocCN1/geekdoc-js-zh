    z is false\"  +  \"<br />\");\n}\n </script>\n</body>\n</html>\n```\n\n# JavaScript：决策：if,\
    \ if-then\n\n### if 语句\n`if` 告诉程序当条件为真时执行代码段。\n\n### 语法\n```javascript\nif(condition){\n\
