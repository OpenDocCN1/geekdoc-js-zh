- fmt: "\n# CALCULATE THE LCM\n\n### PROGRAM\n```python\ndef lcm(x, y):\n  if x >\
    \ y:\n      z = x\n  else:\n      z = y\n  while(True):\n    if((z % x == 0) and\
    \ (z % y == 0)):\n      lcm = z\n      break\n    z += 1\n  return lcm\n\nprint(lcm(4,\
    \ 6))\nprint(lcm(15, 17))\n```\n\n### OUTPUT\n```\n12\n255\n```\n\n# Convert feet\
    \ and inches to centimeters\n\n### PROGRAM\n```python\nprint(\"Input your height:\
    \ \")\nh_ft = int(input(\"Feet: \"))\nh_inch = int(input(\"Inches: \"))\nh_inch\
    \ += h_ft * 12\nh_cm = round(h_inch * 2.54, 1)\nprint(\"Your height is : %d cm.\"\
    \ % h_cm)\n```\n\n### OUTPUT\n```\nInput your height:\nFeet:  5\nInches:  3\n\
    Your height is : 160 cm.\n```\n\n# Convert time – seconds\n\n### PYTHON CODE\n\
    ```python\ndays = int(input(\"Input days: \")) * 3600 * 24\nhours = int(input(\"\
    Input hours: \")) * 3600\nminutes = int(input(\"Input minutes: \")) * 60\nseconds\
