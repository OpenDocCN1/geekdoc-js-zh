    e^f = \"  + (e ^ f) +  \"<br />\");\n\n </script>\n\n </p>\n\n</body>\n\n</html>\n\
    \n# JavaScript: Logical operators\n\nJavaScript provides three logical operators,\
    \ These are &&(AND), || (OR), and !(NOT)\n\nLogical AND is also called Conditional\
    \ AND\n\nLogical OR is also called Conditional OR\n\nLogical AND, OR are called\
    \ Short circuit operators, will see why these are called short circuit soon.\n\
    \nLogical AND Operator\n\n| Operand1 | Operand2 | Evaluates To |\n\n| true | true\
    \ | true |\n\n| true | false | false |\n\n| false | true | false |\n\n| false\
    \ | false | false |\n\nWhy Logical AND is called short circuit operator?\n\nSince\
    \ if the first statement in the expression evaluates to false, then Javascript\
    \ won't evaluates the entire expression.\n\nLogical OR Operator\n\n| Operand1\
    \ | Operand2 | Evaluates To |\n\n| true | true | true |\n\n| true | false | true\
    \ |\n\n| false | true | true |\n\n| false | false | false |\n\nAs shown in the\
    \ above table, || operator returns true if any of the operand evaluates to true,\
    \ otherwise returns false.\n\nWhy Logical OR is called short circuit operator?\n\
    \nSince if the first statement evaluates to true, then JavaScript won't evaluates\
    \ the entire expression.\n\nLogical (!)NOT operator\n\n| Operand | Evaluates To\
    \ |\n\n| false | true |\n\n| true | false |\n\nIf the operand is false, ! Operator\
    \ evaluates it to true\n\nIf the operand is true, ! Operator evaluates it to false.\n\
    \nlogical.html\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n <title>Logical Operators</title>\n\
    \n <style>\n\n p {\n\n font-size:  2em;\n\n color:  seagreen;\n\n        }\n\n\
    \ </style>\n\n</head>\n\n<body>\n\n <p>\n\n <script type=\"text/javascript\">\n\
    \n var a =  true;\n\n var b =  true;\n\n var c =  false;\n\n var d =  false;\n\
    \n document.write(\"a = \"  + a +  \"<br />\");\n\n document.write(\"b = \"  +\
    \ b +  \"<br />\");\n\n document.write(\"c = \"  + c +  \"<br />\");\n\n document.write(\"\
    d = \"  + d +  \"<br />\");\n\n document.write(\"a&&b = \"  + (a && b) +  \"<br\
    \ />\");\n\n document.write(\"a&&c = \"  + (a && c) +  \"<br />\");\n\n document.write(\"\
    c&&d = \"  + (c && d) +  \"<br /><br />\");\n\n document.write(\"a||b = \"  +\
    \ (a || b) +  \"<br />\");\n\n document.write(\"a||c = \"  + (a || c) +  \"<br\
    \ />\");\n\n document.write(\"c||d = \"  + (c || d) +  \"<br />\");\n\n </script>\n\
    \n </p>\n\n</body>\n\n</html>\n\n# JavaScript: Assignment operators\n\nAssignment\
    \ operator is used to assign value to a variable. Since JavaScript is weakly typed\
    \ language, you can assign any type of value to a variable.\n\nSyntax\n\nvar variableName\
    \ = value;\n\nvariables.html\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n <title>Variables</title>\n\
    \n</head>\n\n<body>\n\n <script type=\"text/javascript\">\n\n var a =  10;\n\n\
    \ document.write(\"Value of a is \"  + a +  \"<br />\");\n\na =  \"Hello World\"\
    ; // Assigning string\n\n document.write(\"Value of a is \"  + a +  \"<br />\"\
    );\n\na =  true; // Assigning boolean\n\n document.write(\"Value of a is \"  +\
    \ a +  \"<br />\");\n\na =  10.09; // Assigning number\n\n document.write(\"Value\
    \ of a is \"  + a +  \"<br />\");\n\n </script>\n\n</body>\n\n</html>\n\n# JavaScript:\
    \ Compound Assignment operator\n\nJavaScript supports compound assignments\n\n\
       Compound Assignment\n\n      Syntax:\n\n         variable operator= value\n\
    \n      Example:\n\n         lets say\n\n         var a = 10;\n\n         a+=10\
    \ evaluates to a=a+10\n\n| Compound Operator | Example | Description |\n\n| +=\
    \ | a+=10 | a=a+10 |\n\n| -= | a-=10 | a=a-10 |\n\n| *= | a*=10 | a=a*10 |\n\n\
    | /= | a/=10 | a=a/10 |\n\n| >>= | a>>=10 | a=a>>10 |\n\n| <<= | a<<=10 | a=a<<10\
    \ |\n\n| >>>= | a>>>=10 | a=a>>>10 |\n\n| &= | a&=10 | a=a&10 |\n\n| &#124;= |\
    \ a&#124;=10 | a=a&#124;10 |\n\n| ^= | a^=10 | a=a^10 |\n\ncompound.html\n\n<!DOCTYPE\
