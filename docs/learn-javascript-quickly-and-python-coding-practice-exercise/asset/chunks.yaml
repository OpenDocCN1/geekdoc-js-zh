    \ day = parseInt(prompt(\"Enter an integer between 1 and 7\", 6));\n switch (day)\
    \ {\n case 1:\n document.write(\"Sunday\");\n break;\n case 2:\n document.write(\"\
    Monday\");\n break;\n case 3:\n document.write(\"Tueday\");\n break;\n case 4:\n\
    \ document.write(\"Wednesday\");\n break;\n case 5:\n document.write(\"ThursDay\"\
    );\n break;\n case 6:\n document.write(\"Friday\");\n break;\n case 7:\n document.write(\"\
    Saturday\");\n break;\n default:\n document.write(\"You entered day number\");\n\
    \ }\n </script>\n</body>\n</html>\n```\nLoad above html page in a browser, it\
    \ prompts for input. If you enter 1, it prints Sunday. If you enter 2, it prints\
    \ Monday. If you enter 3 it prints Tueday. If you enter 4, it prints Wednesday.\
    \ If you enter 5, it prints ThursDay. If you enter 6, it prints Friday. If you\
    \ enter 7, it prints Saturday. for all other inputs, it print \"You entered wrong\
    \ number\".\n\n# JavaScript: loops\n\nLoops are used to repeat a section of code\
    \ until given condition is true. JavaScript support following construct:\na. `while`\n\
    b. `do…while`\nc. `for`\n\n### JavaScript: while loop\n`while` statement executes\
    \ a block of statements until expression is true\n\n### Syntax\n```javascript\n\
    while (expression) {\n    //statements\n}\n```\n\nwhile.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n <title>while loop</title>\n</head>\n<body>\n <script\
    \ type=\"text/javascript\">\n var number = parseInt(prompt(\"Enter a number\"\
    , \"10\"));\n document.write(\"<h2>Even numbers from 0 to \" + number + \" are\
    \ </h2>\");\n var i = 0;\n while (i <= number) {\n document.write(i + \"<br />\"\
    );\n i += 2;\n }\n </script>\n</body>\n</html>\n```\nLoad above page in browser,\
    \ it prompts for a number, and print all the even numbers from 0 to the number\
    \ given by user.\n\n# JavaScript: do-while loop\n\n### do-while\n`do-while` is\
    \ also a loop construct like `while`, but evaluates its expression at the bottom\
    \ of the loop instead of the top.\n\n### Syntax\n```javascript\ndo {\n    //statement(s)\n\
    } while (expression);\n```\nAbove statement executes block of statement until\
    \ the condition is true.\n\ndoWhile.html`\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n <title>do-while loop</title>\n</head>\n<body>\n <script type=\"text/javascript\"\
    >\n var number = parseInt(prompt(\"Enter a number\", \"10\"));\n document.write(\"\
    <h2>Even numbers from 0 to \" + number + \" are </h2>\");\n var i = 0;\n do {\n\
    \ document.write(i + \"<br />\");\n i += 2;\n} while (i <= number);\n </script>\n\
    </body>\n</html>\n```\nLoad above page in browser, it prompts for a number, and\
    \ print all the even numbers from 0 to the number given by user.\n\n# JavaScript:\
    \ for loop\n\nThe `for` statement provides a compact way to iterate over a range\
    \ of values.\n\n### Syntax\n```javascript\nfor(initialization; condition; update){\n\
    \    //statements to be executed\n}\n```\n`for` loop execute the statements until\
    \ the condition evaluates to false.\na. `Initialization` section executed only\
    \ once, at the starting of loop.\nb. `Condition` section evaluated every time,\
    \ before executing the loop statements.\nc. `update` section executes immediately\
    \ after every execution of loop finishes.\n\nfor.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n <title>for loop</title>\n</head>\n<body>\n <script type=\"text/javascript\"\
    >\n var number = parseInt(prompt(\"Enter a number\", \"10\"));\n document.write(\"\
    <h2>Even numbers from 0 to \" + number + \" are </h2>\");\n for (var i = 0; i\
    \ <= number; i += 2) {\n document.write(i + \"<br />\");\n }\n </script>\n</body>\n\
    </html>\n```\n"
