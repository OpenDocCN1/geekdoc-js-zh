    \nIn the above example, below are the java script statements.\n\ndocument.write(\"\
    Hello World\" + \"<br />\");\n\ndocument.write(\"Hello PTR\");\n\n# Javascript:\
    \ comments\n\nComments are used to document the source code. Comments in javaScript,\
    \ makes the program more readable. Comments are ignored by JavaScript.\n\nSuppose\
    \ you written thousand lines of program, with out proper documentation, after\
    \ some time, for the owner of the application also, it is very difficult to figure\
    \ out what was written.\n\nComments solve this problem:\n\nBy using comments,\
    \ you can document your code at the time of writing program. Comments won't affect\
    \ your program execution. Comments simply document your code.\n\nJavascript support\
    \ 2 kinds of comments.\n\na.   Single line comments\n\nb.   Multi line comments\n\
    \nSingle line comment :\n\nSingle line comments starts with //\n\n// It is a single\
    \ line comment\n\nMulti Line comment\n\nMulti line comments are encoded in /*\
    \ */\n\n/* I am a mulltiline comment */\n\nsample.html\n\n<!DOCTYPE html>\n\n\
    <html>\n\n<head>\n\n  <title>Variables</title>\n\n</head>\n\n<body>\n\n  <script\
    \ type=\"text/javascript\">\n\n   /*\n\n    Java script is weakly typed language\n\
    \n    Author: Hari krishna\n\n   */\n\n   var a = 10;\n\n   document.write(\"\
    Value of a is \" + a + \"<br />\");\n\n   a = \"Hello World\"; // Assigning string\n\
    \n   document.write(\"Value of a is \" + a + \"<br />\");\n\n   a = true; // Assigning\
    \ boolean\n\n   document.write(\"Value of a is \" + a + \"<br />\");\n\n   a =\
    \ 10.09; // Assigning number\n\n   document.write(\"Value of a is \" + a + \"\
    <br />\");\n\n  </script>\n\n</body>\n\n</html>\n\n# JavaScript: Types\n\nTypes\
    \ are used to represent the type of data. Primarily, there are two categories\
    \ of types.\n\na.   Primitive types\n\nb.   Reference types\n\nPrimitive Types\n\
    \nNumbers, strings and Boolean values considered as primitive types. In addition\
    \ to these, special values null, undefined are also considered as primitive types.\n\
    \nReference Types\n\nObjects and arrays are considered as reference types. An\
    \ object is a collection of name and value pairs. Array is a collection of elements.\n\
    \nOne more thing to note is that JavaScript treats functions also objects.\n\n\
    types.html\n\n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n  <title>Data Types</title>\n\
    \n</head>\n\n<body>\n\n  <script>\n\n   var a = 10;\n\n   var b = 10.01;\n\n  \
    \ var c = true;\n\n   var d = \"Hello World\";\n\n   var e = {\n\n    name : \"\
    Hari krishna\",\n\n    city : \"Bangalore\"\n\n   };\n\n   var f = [2, 3, 5, 7];\n\
    \n   document.write(\"a = \" + a + \" Type of a = \" + (typeof a) + \"<br />\"\
    );\n\n   document.write(\"b = \" + b + \" Type of b = \" + (typeof b) + \"<br\
    \ />\");\n\n   document.write(\"c = \" + c + \" Type of c = \" + (typeof c) +\
    \ \"<br />\");\n\n   document.write(\"d = \" + d + \" Type of d = \" + (typeof\
    \ d) + \"<br />\");\n\n   document.write(\"e = \" + e + \" Type of e = \" + (typeof\
    \ e) + \"<br />\");\n\n   document.write(\"f = \" + f + \" Type of f = \" + (typeof\
    \ f) + \"<br />\");\n\n  </script>\n\n</body>\n\n</html>\n\nOpen above page in\
    \ browser, you can able to see following messages in the html page.\n\na = 10\
    \ Type of a = number\n\nb = 10.01 Type of b = number\n\nc = true Type of c = boolean\n\
    \nd = Hello World Type of d = string\n\ne = [object Object] Type of e = object\n\
    \nf = 2,3,5,7 Type of f = object\n\nAs you see the output, JavaScript treats both\
    \ integer and float values as type number and arrays, objects are treated as type\
    \ object.\n\n# Javascript: operators\n\nAn operator is a symbol which perform\
    \ an operation\n\nAn operator is said to be unary, if it performs operation on\
    \ single operand.\n\nAn operator is said to be binary, if it performs operation\
    \ on two operands\n\nAn Operator is said to be ternary if it perform operation\
    \ on three operands.\n\nJavascript provides following operators.\n\na.   Arithmetic\
    \ operators\n\nb.   Increment/decrement:++, --\n\nc.   Bitwise operators\n\nd.   Logical\
    \ operators\n\ne.   Assignment operators\n\nf.    String concatenation\n\ng.   Comparison\
    \ operators\n\nh. Other operators like === (Strict comparison), ternary (?:)\n\
    \n# Javascript: Arithmetic Operators\n\nFollowing table summarizes Arithmetic\
    \ operators supported by Javascript.\n\n| Operator | Description |\n\n| + | Additon\
    \ (also used for String concatenation) |\n\n| - | Subtraction |\n\n| / | Division\
    \ |\n\n| * | Multiplication |\n\n| % | Gives Remainder |\n\narithmetic.html\n\n\
    <!DOCTYPE html>\n\n<html>\n\n <head>\n\n <title>Arithmetic Operators</title>\n\
    \n <style>\n\n p{\n\n font-size:  2em;\n\n color:  seagreen;\n\n   }\n\n </style>\n\
    \n </head>\n\n <body>\n\n <p>\n\n <script type=\"text/javascript\">\n\n var a\
    \ =  23;\n\n var b =  3;\n\n document.write(\"a = \"  + a +  \"<br />\");\n\n\
    \ document.write(\"b = \"  + b +  \"<br />\");\n\n document.write(\"a+b = \" \
    \ + (a+b) +  \"<br />\");\n\n document.write(\"a-b = \"  + (a-b) +  \"<br />\"\
    );\n\n document.write(\"a*b = \"  + (a*b) +  \"<br />\");\n\n document.write(\"\
    a/b = \"  + (a/b) +  \"<br />\");\n\n document.write(\"a%b = \"  + (a%b) +  \"\
    <br />\");\n\n </script>\n\n </p>\n\n </body>\n\n</html>\n\nNote\n\nUnlike languages\
    \ like Java, integer division in JavaScript returns float value.\n\n# Javascript:\
    \ Increment/decrement: ++, -- operators\n\nIncrement & decrement operators\n\n\
    ++ Increment operator; increments a value by 1\n\n-- Decrement operator; decrements\
    \ a value by 1\n\nPre increment\n\n    Syntax:\n\n    ++variable\n\n      pre\
    \ increment operator increments the variable value by 1 immediately.\n\nPost increment\n\
    \n    Syntax:\n\n        variable++\n\n         post increment operator increments\
    \ the variable value by 1 after executing the current statement.\n\nPre Decrement\n\
    \n    Syntax:\n\n        --variable\n\n         pre decrement operator decrements\
    \ the variable value by 1 immediately.\n\nPost Decrement\n\n    Syntax:\n\n        variable--\n\
    \n         post decrement operator decrements the variable value by 1 after executing\
    \ the current statement.\n\narithmetic.html\n\n<!DOCTYPE html>\n\n<html>\n\n <head>\n\
    \n <title>Increment&Decrement Operators</title>\n\n <style>\n\n p{\n\n font-size:\
    \  2em;\n\n color:  seagreen;\n\n   }\n\n </style>\n\n </head>\n\n <body>\n\n\
    \ <p>\n\n <script type=\"text/javascript\">\n\n var a =  23;\n\n document.write(\"\
    a = \"  + a +  \"<br />\");\n\n document.write(\"a++ = \"  + (a++) +  \"<br />\"\
    );\n\n document.write(\"++a = \"  + (++a) +  \"<br />\");\n\n document.write(\"\
    a-- = \"  + (a--) +  \"<br />\");\n\n document.write(\"--a = \"  + (--a) +  \"\
    <br />\");\n\n </script>\n\n </p>\n\n </body>\n\n</html>\n\n# Javascript: Bitwise\
    \ operators\n\nFollowing table summarizes the bitwise operators supported by Javascript.\n\
    \n| Operator | Description |\n\n| ~ | Inverts bit pattern |\n\n| <<  | Perform\
    \ Left shift |\n\n| >>  | Perform Right Shift |\n\n| >>>  | Perform unsigned right\
    \ shift |\n\n| & | Bit wise AND |\n\n| &#124; | Bit wise OR |\n\n| ^ | Bit wise\
    \ Exclusive OR |\n\nBefore discuss about the Bit wise operators, will discuss\
    \ about Binary representations of a number\n\n1's Complement\n\n1's complement\
    \ simply inverts the bits, if the bit is set to zero, it sets the bit to 1 and\
    \ if the bit is set to 1 it sets the bit to zero.\n\nEx:\n\n8 in binary            =\
    \ 0 0 0 0 1 0 0 0"
