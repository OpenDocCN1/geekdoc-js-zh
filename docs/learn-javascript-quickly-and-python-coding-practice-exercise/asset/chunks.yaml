    );\n} else {\n document.write(\"You are passed got distinction\");\n}\n </script>\n\
    </body>\n</html>\n```\n\n# JavaScript: Decision making using switch\n\nThe body\
    \ of a `switch` statement is known as a `switch` block. A statement in the `switch`\
    \ block can be labelled with one or more `case` or `default` labels. The `switch`\
    \ statement evaluates its `expression`, then executes all statements that follow\
    \ the matching `case` label.\n\n### Syntax\n```javascript\nswitch(expression){\n\
    \    case expression1:\n        //statements\n        break;\n    case expression2:\n\
    \        //statements\n        break;\n    default:\n        //statements\n}\n\
    ```\n\nswitch.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n <title>switch\
