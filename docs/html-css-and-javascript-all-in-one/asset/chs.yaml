  \ | `&eacute;` | 重音小写 e |\n| `×` | `&#215;` | `&times;` | 乘号 |\n| ÷ | `&#247;` |\
  \ `&divide;` | 除号 |\n\n虽然您可以通过数字指定字符实体，但每个符号还有一个助记名称，通常更容易记住。\n\n注意\n\n在寻找版权 (©)\
