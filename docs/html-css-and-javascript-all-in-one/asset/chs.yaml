  \ |\n| `autoplay` | 告诉浏览器在加载完成后自动播放。 |\n| `loop` | 告诉浏览器循环播放文件，直到手动停止。 |\n\n###\
  \ 问答\n\n**Q. 我制作过用于在纸张上打印的图形。网页图形有什么不同吗？**\n\n\n\n\n\n## A. 是的。事实上，许多打印图形的规则在 Web\
  \ 上是反相反的。网页图形应该是低分辨率的以保持较小的文件大小，而打印图形应该尽可能具有高分辨率。在计算机屏幕上，白色会冲淡黑色，而在纸上，黑色会渗透到白色中。此外，当网页只下载了一半的图形时，用户可能会停止网页的加载，而这在查看打印图像时是不考虑的因素。如果你做过很多打印图形设计，请尽量避免陷入旧习惯。\n\
  \n## Q. 我按照你的建议使用了 `<<img>>` 标签，但当我查看页面时，只看到一个里面有一些形状的小框。这是怎么了？\n\n**### A. 你看到的损坏图像图标可能意味着两种情况之一：网络浏览器无法找到图像文件，或者图像保存的格式不是浏览器识别的格式。要解决这些问题，首先检查图像是否位于它应该所在的位置。如果是，请在图形编辑器中打开图像，并将其重新保存为\
  \ `GIF`、`JPEG` 或 `PNG`。\n\n## Q. 如果我在图像地图上重叠区域会发生什么？\n\n**### A. 你被允许在图像地图上重叠区域。只需记住，在确定遵循哪个链接时，一个区域的优先级高于另一个区域。优先级是根据区域在图像地图中的列出顺序分配的。例如，地图中的第一个区域优先级高于第二个区域，这意味着在区域的重叠部分进行点击将链接到第一个区域。如果你在图像地图内有一个不链接到任何内容的区域（称为\
  \ `dead area`，即死区域），你可以使用这个重叠技巧来故意防止该区域链接到任何内容。要实现这一点，只需将死区域放置在其他区域之前，使死区域重叠它们，然后将它的\
  \ `href` 属性设置为 `\"\"`（空）。\n\n## Q. 我听过很多关于流媒体视频和音频的内容。那什么意思？\n\n**### A. 在过去，视频和音频文件通过大多数调制解调器检索需要几分钟，有时需要几小时，这严重限制了在网页上包含视频和音频。每个人都在追求的目标是流媒体视频或音频，它在数据接收的同时进行播放。换句话说，你不需要完全下载片段后就可以开始观看或收听。\n\
  \n流媒体播放现在已通过大多数媒体播放器广泛支持，包括独立版本和插件。当你使用 `<video>`元素嵌入媒体对象时，你可以对多媒体资源的缓冲和播放进行精粒度控制，如果播放器支持流媒体，底层媒体播放器会自动流传输媒体片段。\n\
  \n对于直播，大多数现代浏览器都支持媒体源扩展 (MSE) 规范（`[www.w3.org/TR/media-source/`](http://www.w3.org/TR/media-source/)`）。它扩展了\
  \ `<audio>` 和 `<video>` 元素，让你无需使用插件即可动态更改源文件。这允许直接从网页上进行直播、剪辑和视频编辑。\n\n## 工作坊\n\n\
  工作坊包含测验和练习，帮助你巩固对所涵盖内容的理解。\n\n### 测验\n\n**1.** 你如何给网页设置黑色背景并让所有文字变为亮绿色？根据你在本节中学到的知识，你还会想使用这种颜色组合吗？\n\
  \n**2.** 你会使用哪些 CSS 属性和值来确保段落具有白色背景、橙色文字和 3 像素宽的绿色虚线边框？\n\n**3.** 如果你有一个透明背景上的蓝花正方形图像，而容器元素的背景颜色是灰色的，你的花卉图像将以正方形还是其他形状出现在页面上？\n\
  \n**4.** 如果你有一个名为 `myimage.png` 的图像，并想对其对齐，使一行文字对齐图像的中间，你应该使用哪种样式属性？\n\n**5.** 为你的网站提供最广泛观众的视频访问的最简单方法是什么？\n\
  \n**6.** 创建具有 50% 透明度的红色背景的 CSS 是什么？\n\n**7.** 有效裁剪图像的规则是什么？\n\n**8.** 网页图像中最重要的方面是什么：尺寸、文件大小、颜色还是内容？\n\
  \n**9.** 垂直对齐图像的方法方法？\n\n**10.** 你使用什么元素来定义在 `<video>` 标签中播放的文件？\n\n#### 备注\n\n\
  提醒一下正在阅读本书纸质版或电子书版文字的读者：如果你访问 `[www.informit.com/register`](http://www.informit.com/register)\
  \ 并注册这本书（使用 ISBN 9780672338083），你就可以免费访问在线 Web 出行版。\n\n### 答案\n\n**1.** 虽然强烈建议你不要这样做，但你会在页面开头放置以下代码来设置背景：\n\
  \n```html\n<body style=\"background-color:#000; color:#00FF0\">\n```\n\n**2.** 使用以下属性和值可以实现：\n\
  \n```css\nbackground-color: #ffffff;\ncolor: #ffa500;\nborder: 3px dashed #00ff00;\n\
  ```\n\n**3.** 因为图像有背景，它将以花的形状出现。灰色的背景会显示出来。\n\n**4.** 你可以使用 `vertical-align:middle`\
  \ 来确保文字对齐图像的中间。\n\n**5.** 直接链接到它：\n\n```html\n<a href=\"myvideo.mov\">my video</a>\n\
  ```\n\n**6.** `background-color: rgba(255, 0, 0, 0.5);` 属性使用 RGBA 定义了具有 50% 透明度的红色。\n\
  \n**7.** 你可以应用裁剪规则，如三分法、黄金比例、黄金螺旋、三角形和对角线。\n\n**8.** 网页图像最重要的方面是文件大小：你希望它尽可能快地下载，而不牺牲质量。\n\
  \n**9.** 你可以将图像垂直对齐到文本顶部、底部、中间、基线、顶部和底部。\n\n**10.** 你使用 `<source>` 元素来定义播放的文件。你也可以使用\
  \ `<video>` 标签上的 `src` 属性。\n\n### 练习\n\n*   ![Image](img/arrow1.jpg) 选择一个你喜欢的底色——也许是一种美丽的蓝色或大地色调——并使用\
  \ [`paletton.com`](http://paletton.com) 的配色方案设计器生成一组可以在网站使用的颜色。我推荐四角色或强调类比方案类型。\n\
  \n*   ![Image](img/arrow1.jpg) 当你有一组颜色——或者几种颜色组合时——创建一个基础 HTML 页面，包含一个 `<h1>` 元素、段落以及一些列表项。使用你在本节中学到的颜色相关样式更改页面背景颜色和各种块级元素的文本颜色，看看这些颜色组合如何协同工作。观察它们如何相互作用，并确定哪些颜色最适合容器，哪些颜色最适合正文、标题文本和链接文本。\n\
  \n\n\n\n\n*   ![Image](img/arrow1.jpg) 练习本课程中的任何图像放置方法，都将极大地帮助你确定图像在你设计的网站中可以发挥以及将发挥的作用。使用一些示例图像，练习使用\
  \ `float` 样式来设置图像和文本之间的相对位置。请记住，`float` 的可能值为 `left`、`right` 和 `none`（默认值）。\n* \
  \  ![Image](img/arrow1.jpg) 在网上寻找一些免费的音频和视频片段，并使用 HTML5 的 `<audio>` 和 `<video>`\
  \ 元素练习在文本中进行布局。\n\n# 第三部分：使用 CSS 进行高级网页页面设计\n\n## 第 9 节\n\n## 使用外边距、内边距、对齐和浮动\n\n\
  **你将在本节中将学习到：**\n\n*   ![Image](img/arrow.jpg) 如何在元素周围添加外边距（margins）\n*   ![Image](img/arrow.jpg)\
  \ 如何在元素内部添加内边距（padding）\n*   ![Image](img/arrow.jpg) 如何保持所有内容对齐\n*   ![Image](img/arrow.jpg)\
  \ 如何使用 `float` 属性\n\n现在你已经学习了创建网页内容的基础，在本节中，你将学习使用 CSS 增强这些内容显示的细节。在接后的课程中，你将深入学习使用\
  \ CSS 控制整个网页的各个方面，而不仅仅是单个文本或图形。\n\n然而，在处理页面布局之前，在将它们整合在一起之前，单独理解四个特定的 CSS 属性是非常重要的：\n\
  \n*   ![Image](img/arrow.jpg) `margin` 和 `padding`——用于在元素周围添加空间\n*   ![Image](img/arrow.jpg)\
  \ `align` 和 `float`——用于设置元素之间的相对位置\n\n本节提供的示例并非创建过的最时尚的网页内容，但其目的并非如此。相反，这些示例清晰地展示了\
  \ HTML5 和 CSS 如何协同工作。尽管本节的页数较少，但这些概念值得仔细阅读和动手实践。当你通过课程的本章节和其他章节，以及对所学内容的持续练习来掌握\
  \ CSS 时，你就能运用自己的设计技能来增强那些相对基础（通常也是如此）的底层架构。\n\n### 使用外边距 (Margins)\n\n样式表的*外边距*（margins）允许你在网页上元素矩形区域的*外部*添加空隙。请记住，`margin`\
  \ 属性作用于元素外部的空间。\n\n以下是设置外边距的样式属性：\n\n*   ![Image](img/arrow.jpg) `margin-top`——设置上外边距\n\
  *   ![Image](img/arrow.jpg) `margin-right`——设置右外边距\n*   ![Image](img/arrow.jpg)\
  \ `margin-bottom`——设置下外边距\n*   ![Image](img/arrow.jpg) `margin-left`——设置左外边距\n*\
  \   ![Image](img/arrow.jpg) `margin`——通过单个属性设置上、右、下、左外边距\n\n你可以使用任何单个外边距属性或使用 `margin`\
  \ 属性来指定外边距。外边距可以指定为 `auto`，这意味着浏览器根据特定长度（像素、点或 em 等）或百分比设置外边距。如果你决定将外边距设置为百分比，请记住百分比是基于容器元素的大小计算的。因此，如果你将\
  \ body 内某个元素的 `margin-left` 属性设置为 `25%`，该元素的左外边距将是整个页面宽度的 25%。但是，如果你将该元素内部的某个元素的\
  \ `margin-left` 属性设置为 `25%`，它将是原始 25% 计算结果的 25%。\n\n列表 9.1 中的代码在页面上生成四个矩形，每个宽 250\
  \ 像素，高 100 像素，带有 5 像素的实黑色边框（参见图 9.1）。每个矩形（在此例中为 `<div>`）具有不同的背景颜色。如果你希望每个 `<div>`\
  \ 周围的外边距在四个方向都是 15 像素，可以使用以下：\n\n`margin-top: 15px;`\n\n`margin-right: 15px;`\n\n\
  `margin-bottom: 15px;`\n\n`margin-left: 15px;`\n\n注意\n\n你可以通过至少两种方式记住简写顺序。首先，如果你将一个元素看作一个矩形，从顶部开始按顺时针绕四周移动：顶边、右边、底边、左边。或者你也可以使用首字母记忆法，并记住\
  \ *TRBL*（读作“trouble”或如果你是*星际迷航*粉丝，读作“tribble”），这也代表了在你忘记外边距属性顺序时可能出现的状态。\n\n另外注意，TRBL\
  \ 顺序也适用于内边距（padding）属性和边框（border）属性。\n\n你也可以使用 `margin` 属性将其简写：\n\n`margin: 15px\
  \ 15px 15px 15px;`\n\n当你使用 `margin` 属性（或 `padding` 或 `border`）且希望所有四个值都相同时，你可以进一步简化并使用以下：\n\
  \n`margin: 15px;`\n\n在使用简写设置外边距、内边距或边框时，有三种方法适用，具体取决于你在设置属性时使用了多少个值：\n\n*   ![Image](img/arrow.jpg)\
  \ **一个值**——所有外边距的大小\n*   ![Image](img/arrow.jpg) **两个值**——上/下外边距和左/右外边距的大小（按此顺序）\n\
  *   ![Image](img/arrow.jpg) **三个值**——上外边距、左和右外边距（它们具有相同的值）以及下外边距的大小（按此顺序）\n*   ![Image](img/arrow.jpg)\
  \ **四个值**——上、右、下、左外边距的大小（按此顺序）\n\n你可能会发现始终使用一个值或始终使用所有四个值最容易，但这并不是强制要求的。\n\n**列表\
  \ 9.1** 生成带边框和外边距的四个颜色 `<div>` 元素的简单代码\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Color Blocks</title>\n\
  \    <style>\n       div {\n          width: 250px;\n          height: 100px;\n\
  \          border: 5px solid #000000;\n          color: black;\n          font-weight:\
  \ bold;\n          text-align: center;\n       }\n       div#d1 {\n          background-color:\
  \ red;\n          margin: 15px;\n       }\n       div#d2 {\n          background-color:\
  \ green;\n          margin: 15px;\n       }\n       div#d3 {\n          background-color:\
  \ blue;\n          margin: 15px;\n       }\n       div#d4 {\n          background-color:\
  \ yellow;\n          margin: 15px;\n       }\n    </style>\n  </head>\n  <body>\n\
  \    <div id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n    <div id=\"\
  d3\">DIV #3</div>\n    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n```\n\n\
  你可以在图 9.1 中看到列表 9.1 的输出。\n\n![一个标题为“Color Blocks”的输出屏幕显示了垂直排列的四个矩形块，具有等宽边框。这些块从\
  \ D I V 数字 1 到 D I V 数字 4，分别被红色、绿色、蓝色和黄色填充。](img/09fig01.jpg)\n\n**图 9.1** 基本颜色块示例页面显示了具有相同外边距的颜色块。\n\
  \n接下来，通过调整列表 9.1 样式表中的 `margin` 属性，让我们移动外边距。在这个示例中，你实际上无法看到这些 `<div>` 元素的右侧外边距，因为它们右侧没有东西，而且它们没有右对齐。考虑到这一点，你可以将所有的\
  \ `margin-right` 设置为 `0px`。在此基础上，下一组目标是产生以下效果：\n\n*   ![Image](img/arrow.jpg) 第一个颜色块没有外边距\n\
  *   ![Image](img/arrow.jpg) 第二个颜色块的左外边距为 15 像素，上外边距为 5 像素，下外边距为 0\n\n\n\n\n\n* \
  \  ![Image](img/arrow.jpg) 第三个颜色块周围的左边距为 75 像素，且没有顶部或底部外边距\n*   ![Image](img/arrow.jpg)\
  \ 第四个颜色块周围的左边距为 250 像素，顶部外边距为 25 像素\n\n这看起来似乎很简单——第一个块周围没有设置外边距。但如果第二个块顶部有外边距，那么第一个块和第二个块之间*确实*会产生可见的外边距，即使你没有为第一个块指定外边距。\n\
  \n四个命名 `<<div>` 元素的新样式表条现在如下：\n\n点击此处查看代码图像\n\n```css\ndiv#d1 {\n  background-color:\
  \ red;\n  margin: 0px;\n}\n\ndiv#d2 {\n  background-color: green;\n  margin: 5px\
  \ 0px 0px 15px;\n}\n\ndiv#d3 {\n  background-color: blue;\n  margin: 0px 0px 0px\
  \ 75px;\n}\n\ndiv#d4 {\n  background-color: yellow;\n  margin: 25px 0px 0px 250px;\n\
  }\n```\n\n代码更改的结果（参见图 9.2）似乎是随机的，但实际上对于指出其他要点非常有用。例如，回目标之一是让第一个颜色块周围不产生外边距，你可能希望颜色块的边界与浏览器窗口对齐。但正如图\
  \ 9.2 所示，页面内容与浏览器窗口框架之间存在明显的空白。\n\n![显示不同外边距的颜色块截图。](img/09fig02.jpg)\n\n**图 9.2**\
  \ 对颜色块示例页的修改显示了一些不同的外边距。\n\n如果你正在处理元素放置——我们将在下节中介绍这一点——这会在布局中引起问题。为了确保你的放置和外边距是从与浏览器对齐的位置开始计算，你需要处理\
  \ `<body>` 元素本身的外边距。在这种情况下，你需要在样式表中添加以下内容：\n\n```css\nbody {\n  margin: 0px;\n}\n\
  ```\n\n### 内边距 (Padding)\n\n添加内边距与使用外边距相似，因为都为元素增加了额外的空间。巨大的区别在于空间的位置。回想外边距位于元素的外部。另一方面，内边距是在元素*内部*添加空间。由于内边距位于元素内部，它与内容相同的样式，包括背景颜色。\n\
  \n### 注意\n\n大多数设计师假设如果你创建一个宽度为 50 像素、高度为 30 像素的元素并将内边距设置为 5 像素，剩余的内容区域将是 40 像素乘以\
  \ 20 像素。但并不是大多数浏览器的默认行为。相反，内容的宽度将是 50 像素，但整个框将占据 60 像素（50 + 左 5 + 右 5）。如果有任何边框，它们也会加到总宽度中。在第\
  \ 10 节“理解 CSS 盒模型与定位”中，你将学习如何处理这个问题并让框按照你的预期运行。\n\n你通过使用 `padding` 属性来指定样式规则的内边距，这些属性与\
  \ `margin` 属性非常相似。以下属性可用于设置样式规则的内边距：\n\n*   ![Image](img/arrow.jpg) padding-top—设置顶部内边距\n\
  *   ![Image](img/arrow.jpg) padding-right—设置右侧内边距\n*   ![Image](img/arrow.jpg) padding-bottom—设置底部内边距\n\
  *   ![Image](img/arrow.jpg) padding-left—设置左侧内边距\n*   ![Image](img/arrow.jpg) padding—作为单个属性设置顶、右、底和左\n\
  \n和外边距一样，你可以使用单个内边距属性或 `padding` 属性设置样式规则的内边距。你也可以通过测量单位或百分比来表示内边距。\n\n以下示例展示了如何为样式规则设置左右内边距，以便元素内容的两侧都有\
  \ 10 像素的内边距：\n\n```css\npadding-left: 10px;\npadding-right: 10px;\n```\n\n\n\n\n\
  ## CSS 内边距与对齐\n\n## 设置内边距 (Padding)\n\n与外边距（margin）一样，你可以通过单个属性（`padding` 属性）设置元素的所有内边距。设置\
  \ `padding` 属性时，可以使用与 `margin` 属性相同的三个方法。以下示例展示了如何在样式规则中将垂直内边距（上/下）设置为 12 像素，将水平内边距（左/右）设置为\
  \ 8 像素：\n\n```\npadding: 12px 8px;\n```\n\n以下是更具显式的代码，它通过指定所有的四个内边距值来执行相同任务：\n\n\
  ```\npadding: 12px 8px 12px 8px;\n```\n\n在本节之前出现的所有图中，请注意文本 `DIV #1`、`DIV #2` 等出现在颜色块的顶部，边框和文本之间只留有一点点空间。这种空间的大小并不是通过任何内边距值指定的，但它作为元素内部的一种默认值存在。列表\
  \ 9.2 显示了你对元素内边距进行特定控制的一些示例。所有颜色块宽为 250 像素，高为 100 像素，具有 5 像素的实黑色边框，并有 25 像素的外边距（见图\
  \ 9.5）。有趣的内容发生在每个 `<div>` 的内边距值中。\n\n### 列表 9.2：生成带边框、外边距和内边距的四个彩色 <div> 元素的简单代码\n\
  \n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>Color Blocks</title>\n    <style>\n      body {\n\
  \         margin: 0px;\n      }\n      div {\n         width: 250px;\n         height:\
  \ 100px;\n         border: 5px solid #000000;\n         color: black;\n        \
  \ font-weight: bold;\n         margin: 25px;\n      }\n      div#d1 {\n        \
  \ background-color: red;\n         text-align: center;\n         padding: 15px;\n\
  \      }\n      div#d2 {\n         background-color: green;\n         text-align:\
  \ right;\n         padding: 25px 50px 6px 6px;\n      }\n      div#d3 {\n      \
  \   background-color: blue;\n         text-align: left;\n         padding: 6px 6px\
  \ 6px 50px;\n      }\n      div#d4 {\n         background-color: yellow;\n     \
  \    text-align: center;\n         padding: 50px;\n      }\n    </style>\n  </head>\n\
  \  <body>\n    <div id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n  \
  \  <div id=\"d3\">DIV #3</div>\n    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n\
  ```\n\n![带有带有可变内边距的颜色块截图](img/09fig05.jpg)\n\n**图 9.5** 基础颜色块示例页面显示了四个具有可变内边距的颜色块。\n\
  \n你应该立即发现这个例子中有些不对劲。所有的颜色块本应都是 250 像素宽、100 像素高。图 9.5 中的颜色块大小并不均匀，因为 `width` 和 `height`\
  \ 声明仅适用于内容框。任何内边距或边框长度都会在最终的渲染显示中加到这些维度上。\n\n如果你将文本放置在 `<p>` 元素中并给该元素设置白色背景（见图 9.6），你可以看到内边距相对于文本的位置。你将在第\
  \ 10 节中详细学习这种效果，以及如何修复它。\n\n![显示相对于每个块内文本具有可变内边距的颜色块截图](img/09fig06.jpg)\n\n**图\
  \ 9.6** 显示相对于文本的内边距。\n\n你在 Web 设计中使用 CSS 进行的最多微调或调整都将与外边距和内边距有关。只需记住：外边距在元素外部；内边距在元素内部。\n\
  \n## 保持一切对齐\n\n由于网页上的内容并不总是填满显示它的矩形区域的整个宽度，因此控制内容的对齐通常很有帮助。即使矩形区域内的文本延伸到多行，对齐也会进入视野，因为你可能希望文本左对齐、右对齐或居中。两个样式属性允许你控制框内元素的对齐：`text-align`\
  \ 和 `vertical-align`。\n\n你已经在第 8 节“使用颜色、图像和多媒体”中看到过这些样式属性的实际应用示例（当在对齐图像时），但在这里再次提到这些属性也并无益处，因为对齐在整体页面设计中也起着作用。\n\
  \n作为复习，使用 `text-align` 可以在元素在其边界区域内水平对齐，而 `vertical-align` 则允许你将其对齐为 `left`、`right`、`center`\
  \ 或 `justify`。`vertical-align` 属性与 `text-align` 类似，但它用于垂直对齐。“当前行”指的是出现在同一行的元素。`vertical-align`\
  \ 属性指定元素相对于父元素的垂直对齐方式。对于出现在同一行的元素，你可以设置它们的垂直对齐。以下是 `vertical-align` 属性的常用值：\n\n\
  *   ![向箭头](img/arrow.jpg) top——将元素的顶部与当前行对齐\n*   ![向箭头](img/arrow.jpg) middle——将元素的中间与当前行中间对齐\n\
  *   ![向箭头](img/arrow.jpg) bottom——将元素的底部与当前行对齐\n*   ![向箭头](img/arrow.jpg) text-top——将元素的顶部与父元素的顶部对齐\n\
  *   ![向箭头](img/arrow.jpg) baseline——将元素的基准线与父元素的基准线对齐\n*   ![向箭头](img/arrow.jpg)\
  \ text-bottom——将元素的底部与父元素的底部对齐\n\n对齐将与外边距、内边距以及（你很快就会学的）`float` 属性结合使用，使你能够控制你的设计。\n\
  \n## 内容的居中\n\n在你在上一节工作时，你可能注意到，居中（尤其是内容的居中）是具有挑战性的。虽然你可以使用 `text-align: center;`\
  \ 对齐文本和其他内联元素（如链接或按钮），但让图像或文本框居中是很困难的。许多新手 Web 设计师退回到旧且非常过时的 `<center>` 标签。\n\n\
  正如我们刚才提到的，`<center>` 标签陈旧且过时；它已经被弃用（deprecated），这意味着它已从 HTML 规范中被删除。浏览器制造商可以根据意愿支持它（或其他弃用语法），但他们没有这样做，而且未来它可能会停止工作。但更重要的是，`<center>`\
  \ 标签只做一件事：定义内容的呈现为居中。它没有提供任何语义含义，否则不会影响文档结构。与其使用 `<center>` 标签，你应该使用 CSS。\n\n如果你正在尝试在设计中居中图像或内容块，简单的方法是将水平（左和右）边距设置为\
  \ `auto`，如下：\n\n```\nmargin-left: auto;\nmargin-right: auto;\n```\n\n你也可以使用 `margin`\
  \ 快捷属性：\n\n```\nmargin: 0 auto;\n```\n\n这仅适用于设置了宽度且该小于小于容器的元素。如果你尝试居中一个没有设置宽度的 `<div>`，什么都不会发生。但如果你添加了\
  \ `width` 或最大宽度值，然后应用 `margin: 0 auto;` 样式，浏览器将自动在左右添加空间使其居中。你将在第 12 节“使用现代 CSS\
  \ 技术创建布局”中学习其他居中块元素的方法。\n\n## 理解 `float` 属性\n\n\n\n\n\n`float` 属性是理解一种流行的 CSS 布局和设计类型的重要工具。简单来说，`float`\
  \ 属性允许元素在设计中移动，以便其他元素可以环绕它们排列。你经常会发现 `float` 与图像一起使用（如你在第 8 Lesson 中看到的那样），但你也可以——许多设计师也是这样做——在布局中浮动各种元素。\n\
  \n元素是水平方向浮动的，而不是垂直方向的，因此你只需要关注两个可能的值：`right` 和 `left`。浮动的元素将向容器元素允许的最右侧或最左侧（取决于\
  \ `float` 的取值）浮动。例如，如果你有三个 `float` 设置为 `left` 的 `<div>` 元素，它们将全部对齐在容器 `<body>` 元素的左侧。如果你在另一个\
  \ `<div>` 内部有这些 `<div>` 元素，它们将对齐在*该*元素的左侧，即使该元素本身被浮动到右侧。\n\n通过查看几个示例可以最好地理解浮动，因此请查看列表\
  \ 9.3。该列表简单地定义了三个矩形 `<div>` 元素并将它们并排浮动（向左浮动）。\n\n**列表 9.3** 使用 `float` 放置 `<div>`\
  \ 元素\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n   \
  \ <meta charset=\"utf-8\">\n    <title>Color Blocks</title>\n    <style>\n     \
  \ body {\n        margin:0px;\n      }\n      div {\n        width: 250px;\n   \
  \     height: 100px;\n        border: 5px solid #000000;\n        color: black;\n\
  \        font-weight: bold;\n        margin: 25px;\n      }\n      div#d1 {\n  \
  \      background-color: red;\n        float: left;\n      }\n      div#d2 {\n \
  \       background-color: green;\n        float: left;\n      }\n      div#d3 {\n\
  \        background-color: blue;\n        float: left;\n      }\n    </style>\n\
  </head>\n<body>\n    <div id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n\
  \    <div id=\"d3\">DIV #3</div>\n</body>\n</</html>\n```\n\n图 9.7 显示了生成的页面。你已经可以发现一个问题：这三个颜色块本应该是并排浮动的。事实上，它们*确实*并排浮了，但浏览器窗口宽度不足以显示这三个宽度为\
  \ 250 像素且之间有 25 像素外边距的块。因为它们是浮动的，第三个直接浮到了下一行。\n\n![一个名为“Color Blocks”的输出屏幕显示了三个大小相同的矩形块，标记为\
  \ D I V 号 1 到 D I V 号 3，颜色分别为红色、绿色、蓝色，分别位于左上、右上和左下角。](img/09fig07.jpg)\n\n**图 9.7**\
  \ 使用 `float` 放置颜色块。\n\n你可以想象这在专门设计的视觉布局中可能会是一个问题，因此在目标浏览器窗口大小进行测试的同时，请注意你的外边距、内边距、对齐方式和浮动情况。诚然，图\
  \ 9.7 中的浏览器窗口较小，是为了说明浮动元素会移动到下一行的这一点。\n\n\n\n\n\n工作坊包含测试题和练习，帮助你巩固对所涵盖内容的理解。\n\n\
  ### 测验\n\n**1.** 若要让两个 `<div>` 元素相邻，但它们之间保持 30 像素的外边距，在样式表可以使用哪个或哪些条目？\n\n**2.**\
  \ 使用哪个 CSS 样式属性和值来确保内容不会出现在浮动元素的左侧？\n\n**3.** 使用什么样式表条目可以将文本放置在 `<div>` 中，并使其距离元素顶部\
  \ 12 像素？\n\n**4.** 设置垂直外边距为 `1rem`、水平外边距为 `2rem` 的简写属性是什么？\n\n**5.** 内边距（padding）应用在元素的什么位置？\n\
  \n**6.** 使用哪些非简写属性可以将元素的内边距设置为：顶部 1 像素、右侧 2 像素、左侧 6 像素？\n\n**7.** 使用什么属性可以将文本垂直对齐到行的正中间位置？\n\
  \n**8.** `text-align: justify;` 属性的作用是什么？\n\n**9.** 如何将一个宽度为 50% 的段落定位对齐到屏幕右侧（文字左对齐）？\n\
  \n**10.** 在 640 × 480 的屏幕上，以下 HTML 中的文本 `YOU ARE HERE` 会显示在什么位置？\n\n点击此处查看代码图片\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Where does the text go?</title>\n    <style>\n      div {\n      \
  \  width: 100px;\n        height: 100px;\n        border: solid red 2px;\n     \
  \ }\n      p {\n        width: 300px;\n        text-align: center;\n      }\n  \
  \    .left { float: left; }\n      .right { float: right; }\n    </style>\n</head>\n\
  <body>\n    <div class=\"left\"></div>\n    <div class=\"right\"></div>\n    <p>YOU\
  \ ARE HERE</p>\n</body>\n</</html>\n```\n\n### 注意事项\n\n向正在阅读此本书纸质版或电子书版的读者提供一个提示：如果你访问\
  \ `www.informit.com/register` 并注册此书（使用 ISBN `9780672338083`），你就可以免费访问在线 Web 版。该版本不仅包含此本书的完整文本，还包含一个交互式的测验版本。\n\
  \n### 答案\n\n**1.** 你可以使用多个条目。第一个 `<div>` 使用样式属性 `margin-right:15px`。第二个 `<div>`\
  \ 使用样式属性 `margin-left:15px`。或者你也可以根据需要使用 `margin-right` 或 `margin-left` 将整个 30 像素分配给任一一个\
  \ `<div>`。此外，至少第一个 `<div>` 需要被分配 `float:left`。\n\n**2.** 在这种情况下，使用 `clear:left`。\n\
  \n**3.** 你应该使用 `padding-top:12px`。\n\n**4.** 你应该使用 `margin: 1rem 2rem;`。\n\n**5.**\
  \ 内边距应用在元素内部。\n\n**6.** 你应该使用 `padding-top: 1px;`、`padding-right: 2px;` 和 `padding-left:\
  \ 6px;`。\n\n**7.** 使用什么属性可以将文本垂直对齐到行的正中间位置？\n\n**8.** `text-align: justify;` 属性的作用是什么？\n\
  \n**9.** 如何将一个宽度为 50% 的段落定位对齐到屏幕右侧（文字左对齐）？\n\n**10.** 在 640 × 480 的屏幕上，以下 HTML 中的文本\
  \ `YOU ARE HERE` 会显示在什么位置？\n\n### 练习\n\n（注：原文中练习部分的提供的文本包含重复/碎片化的句子；根据指令，已保留了核心结构内容。）\n\
  \n\n\n\n\n你已经知道如何使用 `width` 和 `height` 属性来设置元素的宽度和高度。下面的示例了如何定义一个宽度为 250 像素、高度为\
  \ 100 像素的 `<div>`，具有红色背景和黑色单像素边框：\n\n```css\ndiv {\n  width: 250px;\n  height: 100px;\n\
  \  background-color: #ff0000;\n  border: 1px solid #000000;\n}\n```\n\n图 10.2 显示了这个简单的\
  \ `<div>`。\n\n![一个简单 <div> 标签的输出屏幕在左上角显示了一个矩形块，填充为红色并标记为“A BASIC DIV.”](img/10fig02.jpg)\n\
  \n**图 10.2** 这是一个简单的 `<div>`。\n\n如果我们定义另一个具有相同属性的元素，但添加了特定尺寸的 `margin` 和 `padding`\
  \ 属性，我们开始看到元素尺寸的变化。这是由于盒模型的原因。\n\n第二个 `<div>` 的定义如下，仅为元素添加了 10 像素的外边距和 10 像素的内边距：\n\
  \n```css\ndiv#d2 {\n  width: 250px;\n  height: 100px;\n  background-color: #ff0000;\n\
  \  border: 5px solid #000000;\n  margin: 10px;\n  padding: 10px;\n}\n```\n\n图 10.3\
  \ 所示的第二个 `<div>` 定义的高度宽度与第一个相同，但当外边和内边距生效时，围绕元素本身的整个框的总高度和宽度要大得多。\n\n![两个 <div>\
  \ 标签的输出屏幕在左上角显示了一个矩形块，标记为“A BASIC DIV.”。下方是另一个标记为“THE SECOND DIV.”的块。它有更大的外边距和更粗的框。两个块都填充为红色。](img/10fig03.jpg)\n\
  \n**图 10.3** 这是另一个简单的 `<div>`，但盒模型影响了第二个 `<div>` 的渲染尺寸。\n\n元素在页面上占据的总*宽度*是以下各项之和：\n\
  \n点击此处查看代码图片\n\n`width + padding-left + padding-right + border-left + border-right\
  \ + margin-left + margin-right`\n\n元素在页面上占据的总*高度*是以下各项之和：\n\n点击此处查看代码图片\n\n`height\
  \ + padding-top + padding-bottom + border-top + border-bottom + margin-top + margin-bottom`\n\
  \n因此，第二个 `<div>` 的实际宽度为 300 (250 + 10 + 10 + 5 + 5 + 10 + 10)，实际高度为 150 (100 + 10\
  \ + 10 + 5 + 5 + 10 + 10)。\n\n### 注意\n\n在整个课程中，你一直在练习使用 `doctype` 声明，每段示例代码都包含一个\
  \ `doctype`。继续这种做法不仅是为了让你的代码通过验证，还因为在某些旧版本的 Internet Explorer 和 CSS 盒模型中会出现一个非常特定的问题：如果没有定义\
  \ `doctype`，某些旧版本的 Internet Explorer 会以你无意的方式操控元素的高度和宽度。这会导致你的布局出现浏览器兼容性问题。所以，请记住包含\
  \ `doctype`。\n\n现在，你已经开始看到盒模型是如何影响你的设计的。假设你只有 250 像素的水平空间，但你希望在四周都有 10 像素的外边距、10\
  \ 像素的内边距和 5 像素的边框。为了在你想要的和可用空间之间取得平衡，你必须将 `<div>` 的 `width` 指定为仅 200 像素，这样 200 +\
  \ 10 + 10 + 5 + 5 + 10 + 10 刚好等于那 250 像素的可用水平空间。\n\n模型的数学原理同样重要。在动态驱动的网站或由用户交互驱动客户端显示的网站（例如通过\
  \ JavaScript 事件）中，你的服务器端或客户端代码可以动态绘制和重新绘制容器元素。换句话之，你的代码将产生数字，但你必须提供边界。\n\n### 注意\n\
  \nCSS 盒模型中还有另一组属性：轮廓（outline）属性：\n\n*   ![Image](img/arrow.jpg) `outline`\n*   ![Image](img/arrow.jpg)\
  \ `outline-width`\n*   ![Image](img/arrow.jpg) `outline-style`\n*   ![Image](img/arrow.jpg)\
  \ `outline-color`\n*   ![Image](img/arrow.jpg) `outline-offset`\n\n轮廓属性的作用与边框（border）属性相似，但它们不占用盒模型中的任何空间。它们也可以不是矩形的。如果你想添加可见的边缘，请使用这些属性。\n\
  \n### 修改盒模型\n\n此时，你可能在想设计盒模型的人在想什么。在大多数设计中，你从一个给定的空间开始。但通过百分比等，你可以拉伸它。看这个例子：\n\n\
  ```css\ndiv {\n  width: 50%;\n  height: 300px;\n  float: left;\n  padding: 0.25rem;\n\
  \  border: 1px solid aqua;\n}\n```\n\n如果你在 HTML 中放置两个 `<div>` 元素，你会期望它们并排排列。但它们并没有。幸运的是，CSS3\
  \ 给了我们一个工具来改变这一点：`box-sizing` 属性。该属性有两个值可选：\n\n*   ![Image](img/arrow.jpg) `content-box`——`width`\
  \ 和 `height` 值仅分配给内容，`padding` 和 `border` 在之后添加。这是默认值。\n*   ![Image](img/arrow.jpg)\
  \ `border-box`——任何定义的 `padding` 和 `border` 都包含在分配的 `width` 和 `height` 值内部。这被称为“怪异模式”（quirks\
  \ mode）。\n\n要让前面的示例生效，只需添加 `box-sizing: border-box;`，两个 `<div>` 元素就会按预期并浮。\n\n注意\n\
  \n`box-sizing` 属性没有“margin-box”值。如果你需要创建具有变量宽度高度和固定边距的布局，你需要使用不同的布局样式，例如弹性盒。你将在第\
  \ 12 节“使用现代 CSS 技术创建布局](ch12.xhtml)”中学习更多内容。\n\n定位全方位\n\n相对定位是 HTML 使用的默认定位类型。你可以将相对定位比作在棋盘上放置棋子：棋子从左到右排列，当你到达棋盘边缘时，就会移动到下一行。使用\
  \ `display: block` 属性设置的元素会自动放在新的一行，而 `inline` 元素被放在同一行，紧跟在前一个元素之后。\n\n\n\n\n\n\
  # CSS 定位\n\n## 绝对定位\n\n### 简介\n\nCSS 支持的另一种定位类型称为 `absolute`（绝对）定位，因为它允许你精确设置 HTML\
  \ 内容在页面上的位置。虽然绝对定位让你能够自由指定元素出现的确切位置，但该位置仍然是相对于页面上任何父元素而言的。换句话说，绝对定位使你能够指定元素矩形区域相对于其父元素区域的精确位置，这与相对定位截然不同。\n\
  \n由于可以自由地将元素放置在页面上的任意位置，你可能会遇到元素重叠的问题，即一个元素占用了另一个元素正在使用的空间。没有任何机制阻止你指定元素的绝对位置使它们重叠。在这种情况下，CSS\
  \ 依赖每个元素的 `z-index` 来确定哪个元素在上层、哪个在下层。你将在本课后面进一步了解元素的 `z-index`。现在，我们先来看看如何精确控制样式规则使用\
  \ `relative`（相对）还是 `absolute`（绝对）定位。\n\n### `position` 属性\n\n特定样式规则使用的定位类型由 `position`\
  \ 属性决定，该属性可以取以下四个值之一：\n\n*   ![Image](img/arrow.jpg) `relative`——元素相对于其在文档流中的当前位置进行定位。\n\
  *   ![Image](img/arrow.jpg) `absolute`——元素基于其容器元素进行定位。\n*   ![Image](img/arrow.jpg)\
  \ `fixed`——元素相对于浏览器窗口进行定位。\n*   ![Image](img/arrow.jpg) `static`——元素按照正常流中的位置放置。这是默认值。\n\
  \n#### 注意：粘性定位\n\n还有一个值 `position: sticky;`，它会使元素根据滚动位置在 `relative` 和 `fixed` 之间切换。在达到滚动偏移位置之前，它是\
  \ `relative`，之后变为 `fixed`。为了获得最广泛的浏览器支持，你应该结合 `-webkit` 浏览器前缀使用（`position: -webkit-sticky;`）。\n\
  \n### 定位属性\n\n指定定位类型后，你可以使用以下属性来提供具体位置：\n\n*   ![Image](img/arrow.jpg) `left`——左侧位置偏移量\n\
  *   ![Image](img/arrow.jpg) `right`——右侧位置偏移量\n*   ![Image](img/arrow.jpg) `top`——顶部位置偏移量\n\
  *   ![Image](img/arrow.jpg) `bottom`——底部位置偏移量\n\n你可能会认为这些定位属性只对 `absolute` 定位有意义，但实际上它们适用于除\
  \ `static` 之外的所有定位类型。对于 `relative` 定位，元素的位置被指定为相对于元素原始位置的偏移量。因此，如果你将元素的 `left` 属性设置为\
  \ `25px`，元素的左侧会从其原始（相对）位置向右偏移 25 像素。另一方面，`absolute` 定位是相对于应用样式的元素的父元素来指定的。因此，如果你在\
  \ `absolute` 定位下将元素的 `left` 属性设置为 `25px`，元素的左侧会出现在父元素左边缘右侧 25 像素的位置。而使用相同值的 `right`\
  \ 属性则会将元素定位，使其右侧位于父元素右边缘右侧 25 像素处。\n\n你不能在同一个元素上同时设置两个水平或两个垂直位置属性。如果你在元素上同时设置了 `left`\
  \ 和 `right`（或同时设置了 `top` 和 `bottom`），那么在从左到右的文档中，`left` 和 `top` 属性将优先。\n\n### 示例：相对定位\n\
  \n让我们回到颜色块的示例，看看定位是如何工作的。在清单 10.1 中，四个彩色块指定了 `relative` 定位。如图 10.4 所示，这些块垂直排列。\n\
  \n**清单 10.1** 使用四个颜色块展示相对定位\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Positioning the Color\
  \ Blocks</title>\n    <style>\n    div {\n      position: relative;\n      width:\
  \ 250px;\n      height: 100px;\n      border: 5px solid #000;\n      color: black;\n\
  \      font-weight: bold;\n      text-align: center;\n    }\n    div#d1 {\n    \
  \  background-color: red;\n    }\n    div#d2 {\n      background-color: green;\n\
  \    }\n    div#d3 {\n      background-color: blue;\n    }\n    div#d4 {\n     \
  \ background-color: yellow;\n    }\n    </style>\n  </head>\n  <body>\n    <div\
  \ id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n    <div id=\"d3\">DIV\
  \ #3</div>\n    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n```\n\n![一个输出屏幕，显示颜色块一个接一个地垂直排列，边界相互接触。](img/10fig04.jpg)\n\
  \n**图 10.4** 彩色块垂直排列，一个在另一个之上。\n\n`<div>` 元素的样式表条目将其 `position` 样式属性设置为 `relative`。由于其余样式规则继承自\
  \ `<div>` 样式规则，因此它们也继承了其 `relative` 定位。实际上，`div` 规则与其他 `div#d1` 到 `div#d4` 规则之间的唯一区别在于不同的背景颜色。\n\
  \n注意在图 10.4 中，`<div>` 元素一个接一个地显示，这正是 `relative` 定位所预期的效果。但为了让事情更有趣（这也是我们此处的目的），你可以将定位改为\
  \ `absolute`，并明确指定块的位置。在清单 10.2 中，样式表条目被修改为使用 `absolute` 定位来排列颜色块。\n\n### 示例：绝对定位\n\
  \n**清单 10.2** 使用颜色块的绝对定位\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Positioning the Color\
  \ Blocks</title>\n    <style>\n    div {\n      position: absolute;\n      width:\
  \ 250px;\n      height: 100px;\n      border: 5px solid #000;\n      color: black;\n\
  \      font-weight: bold;\n      text-align: center;\n    }\n    div#d1 {\n    \
  \  background-color: red;\n      left: 0px;\n      top: 0px;\n    }\n    div#d2\
  \ {\n      background-color: green;\n      left: 75px;\n      top: 25px;\n    }\n\
  \    div#d3 {\n      background-color: blue;\n      left: 150px;\n      top: 50px;\n\
  \    }\n    div#d4 {\n      background-color: yellow;\n      left: 225px;\n    \
  \  top: 75px;\n    }\n    </style>\n  </head>\n  <body>\n    <div id=\"d1\">DIV\
  \ #1</div>\n    <div id=\"d2\">DIV #2</div>\n    <div id=\"d3\">DIV #3</div>\n \
  \   <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n```\n\n该样式表将 `position` 属性设置为\
  \ `absolute`，这是样式表使用 `absolute` 定位所必需的。此外，每个继承的 `<div>` 样式规则都设置了 `left` 和 `top`\
  \ 属性。然而，这些规则的位置被设置成元素相互重叠显示，如图 10.5 所示。\n\n![一个标题为“Color Blocks”的输出屏幕，显示四个相似的矩形块相互重叠，向右层叠。这些块分别标记为\
  \ DIV #1 到 DIV #4，并填充了不同的颜色。](img/10fig05.jpg)\n\n**图 10.5** 使用 `absolute` 定位显示颜色块。\n\
  \n现在我们来谈谈布局！图 10.5 展示了 `absolute` 定位如何让你将元素精确地放置在你想要的位置。它也揭示了让元素重叠是多么容易。你可能好奇，当元素重叠时，浏览器如何知道哪些元素应该绘制在上层。\n\
  \n\n\n\n\n`fixed` 属性将元素放置在浏览器窗口内并固定在该处。这通常用作网页上的某种水印，因为该元素将保持其在页面上所在的位置，而页面的其他元素会经过它。其他元素会覆盖这个固定元素，但你可以控制该元素在堆叠层中出现的位置。下一节将介绍如何控制堆叠顺序。\n\
  \n## 控制元素的堆叠方式\n\n在某些情况下，你希望仔细控制网页页面上元素相互重叠的方式。`z-index` 样式属性允许你根据元素相互堆叠的方式设置它们的顺序。`z-index`\
  \ 这个名字听起来可能有点奇怪，但它指的是第三维度（`z`）的概念，除了横跨（`x`）和向下（`y`）屏幕的两个维度外，它指向屏幕内部。考虑 `z-index`\
  \ 的另一种方法是考虑一叠杂志中单个杂志的相对位置。堆叠靠上的杂志的 `z-index` 比堆叠下方的杂志高。同样，高 `z-index` 的重叠元素将显示在低\
  \ `z-index` 元素上方。\n\n`z-index` 属性用于设置一个数值，指示样式规则的相对 `z-index`。分配给 `z-index` 的数字仅相对于样式表中的其他样式规则才有意义，这意味着为单个规则设置\
  \ `z-index` 属性并没有太大意义。相反，如果你为应用于重叠元素的多个样式规则设置了 `z-index`，那么 `z-index` 值较高的元素将显示在\
  \ `z-index` 值较低的元素上方。如果你没有为元素设置 `z-index`，则相对于其他设置了 `z-index` 值的元素，其值默认为 `0`。\n\n\
  ### 注意\n\n无论你为样式规则设置了多大的 `z-index` 值，使用该规则渲染的元素将始终出现在其父元素上方。\n\n代码列表 10.3 包含了另一个版本的颜色块样式表和\
  \ HTML，该版本使用了 `z-index` 设置来改变元素的自然重叠状态。\n\n`代码列表 10.3` 使用 `z-index` 修改颜色块示例中元素的显示\n\
  \n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>Positioning the Color Blocks</title>\n    <style>\n\
  \      div {\n        position: absolute;\n        width: 250px;\n        height:\
  \ 100px;\n        border: 5px solid #000;\n        color: black;\n        font-weight:\
  \ bold;\n        text-align: center;\n      }\n      div#d1 {\n        background-color:\
  \ red;\n        left: 0px;\n        top: 0px;\n        z-index: 0;\n      }\n  \
  \    div#d2 {\n        background-color: green;\n        left: 75px;\n        top:\
  \ 25px;\n        z-index: 3;\n      }\n      div#d3 {\n        background-color:\
  \ blue;\n        left: 150px;\n        top: 50px;\n        z-index: 2;\n      }\n\
  \      div#d4 {\n        background-color: yellow;\n        left: 225px;\n     \
  \   top: 75px;\n        z-index: 1;\n      }\n    </style>\n  </head>\n  <body>\n\
  \    <div id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n    <div id=\"\
  d3\">DIV #3</div>\n    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n```\n\n\
  这段代码相比于你在代码列表 10.2 中看到的唯一变化，是在每个编号的 `div` 样式类中添加了 `z-index` 属性。注意，第一个编号的 `div` 的\
  \ `z-index` 设置为 `0`，这应该使其成为 z-index 维度上最低的元素，而第二个 `div` 具有最高的 z-index。插图 10.6 显示了使用此样式表后显示的颜色块页面，它清楚地展示了\
  \ `z-index` 如何影响显示内容，并使得仔细控制元素的重叠成为可能。\n\n![使用 z-index 命令修改后显示的颜色块截图](img/10fig6.jpg)\n\
  ```\n\n\n\n\n# Q. 有大量的网页在讨论关于外边距（margins）和内边距（padding）的“盒模型破解（box model hack）”。你确定我不需要\
  \ hack 吗？\n\n**A.** 在本节开始时，你了解到本节（以及其他章节）中的 HTML 和 CSS 在当前主流 Web 浏览器的版本中看起来都是相同的。这是由于在现代浏览器开始按照\
  \ CSS 规范而不是自身的特性来处理事务之前，网页开发者多年不得不使用代码 hack 和其他技巧。此外，目前有一项日益发展的运动是让互联网用户摆弃非常老旧浏览器，而这些正是大多数\
  \ hack 产生的原因。因此，虽然我们不一定建议你只针对当前主流浏览器的版本进行设计，但我们也不建议你花费大量时间为旧版本的浏览器实现 hack——顺便说一下，互联网上使用这些旧版本的比例不足\
  \ 2%。你应该继续编写验证并符合设计原则的健壮代码，在最能反映你的受众的一系列浏览器和设备中测试你的页面，并向世界发布你的网站。\n\n# Q. 我应该如何判断何时使用相对定位（relative\
  \ positioning），何时使用绝对定位（absolute positioning）？\n\n**A.** 虽然关于使用相对定位还是绝对定位没有固定的指南，但通用的想法是：只有当你想要对内容的定位方式进行更精细的控制时，才需要绝对定位。这与绝对定位允许你将内容定位到精确的像素有关，而相对定位在定位内容方面的预测性要低得多。这并不是说相对定位不能很好地完成页面上元素的定位；它意味着绝对定位更精确。当然，这也使得绝对定位可能更容易受到屏幕尺寸变化的影响，而这种变化是你无法真正控制的。\n\
  \n# Q. 如果我没有为两个重叠的元素指定 `z-index`，我如何知道哪个元素会显示在上方？\n\n**A.** 如果重叠元素没有设置 `z-index`\
  \ 属性，则在网页中后出现的元素将显示在上方。记住这一点的简单方法是：想象 Web 浏览器在读取 HTML 文档时正在绘制页面上的每个元素；在文档中较后读取的元素会绘制在较早读取的元素之上。\n\
  \n## 工作坊 (Workshop)\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。\n\n### 测验 (Quiz)\n\n**1.** 相对定位和绝对定位之间的区别是什么？\n\
  \n**2.** 哪种 CSS 样式属性控制元素相互重叠的方式？\n\n**3.** 你可以使用什么 HTML 代码来显示 `Where would you like\
  \ to` 单词，恰好从浏览器窗口的左上角开始，并在同一角落向下 80 像素、向右 20 像素处用大字号显示 `GO TODAY?`？\n\n**4.** 你如何放置一个元素，使其保持在浏览器窗口的中间位置和右侧，并且不随滚动而移动？\n\
  \n**5.** `border-box` 盒模型的另一个名称是什么？\n\n**6.** 盒模型的四部分是什么什么？\n\n**7.** 默认的 `box-sizing`\
  \ 值值什么？\n\n**8.** 你可以在绝对定位中同时指定左侧和右侧或或顶部和底部的位置吗？\n\n**9.** 你如何停止文本环绕左侧浮动元素流动？\n\n\
  **10.** 当设置 `overflow: hidden;` 属性时，溢出内容区域会发生什么？\n\n### 注意 (Note)\n\n提醒正在阅读本书纸质版或电子书版的读者：如果你访问\
  \ `www.informit.com/register` 并注册此书（使用 ISBN 9780672338083），你就可以免费访问在线 Web 版本，该版本不仅包含本书的完整文本，还包含此测验的交互式版本。\n\
  \n### 答案 (Answers)\n\n**1.** 在相对定位中，内容根据页面流进行显示，每个元素在物理上出现在其在 HTML 代码中的前一个元素之后。另一方面，绝对定位允许你设置内容在页面上的精确位置。\n\
  \n**2.** `z-index` 样式属性控制元素相互重叠的方式。\n\n**3.** 你可以使用此代码：\n\n点击此处查看代码图像\n\n```\n<span\
  \ style=\"position:absolute;left:0px;top:0px;\">\nWhere would you like to\n</span>\n\
  \n<h1 style=\"position:absolute;left:80px;top:20px;\">GO TODAY?</h1>\n```\n\n**4.**\
  \ 使用以下 CSS：\n\n```css\nposition: fixed;\ntop: 50%;\nright: 0;\n```\n\n**5.** `border-box`\
  \ 盒模型有时被称为“怪模式（quirks mode）”。\n\n**6.** 盒模型的四部分是边距（margin）、边框（border）、内边距（padding）和内容（content）。\n\
  \n**7.** 默认的 `box-sizing` 值是 `content-box`。\n\n**8.** 不，如果你同时设置了 `left` 或 `top`，它们在从左到右的文档中具有优先级。\n\
  \n**9.** 设置 `clear: left;` 属性。\n\n**10.** 内容从屏幕上消失，但在 HTML 代码中仍然可见。\n\n### 练习 (Exercises)\n\
  \n*   ![Image](img/arrow1) 通过创建具有不同边距、内边距和边框的元素，练习处理盒模型的细节，并观察这些属性如何影响高宽。\n*   ![Image](img/arrow1)\
  \ 找到一组你喜欢的图片，使用绝对定位和一些 `z-index` 值将它们排列成画廊。尝试将你的图像放置得形成某种形状（如正方形、三角形或圆形）。\n*   ![Image](img/arrow1)\
  \ 使用 `position: fixed;` 和 `z-index` 属性为页面添加水印图像。\n\n## 第 11 节\n\n## 使用 CSS 增强列表、文本和导航\n\
  \n**本节你将学习：**\n\n*   ![Image](img/arrow.jpg) 盒模型如何影响列表\n*   ![Image](img/arrow.jpg)\
  \ 如何自定义列表标记\n*   ![Image](img/arrow.jpg) 如何使用列表项目和 CSS 创建图像地图\n*   ![Image](img/arrow.jpg)\
  \ 导航列表与普通列表的区别\n*   ![Image](img/arrow.jpg) 如何使用 CSS 创建垂直导航\n*   ![Image](img/arrow.jpg)\
  \ 如何使用 CSS 创建水平导航\n\n在第 6 节 [#ch06.xhtml] 处理字体、文本块、列表和表格 中，我们介绍了三种 HTML 列表；在第 9\
  \ 节 [#ch09.xhtml] 处理边距、内边距、对齐和浮动 中，你学习了元素的边距、内边距和对齐。在本节中，你将学习如何将边距、内边距和对齐样式应用到不同类型的\
  \ HTML 列表，这将帮助你纯通过 HTML 和 CSS 制作一些强大的设计元素。\n\n\n\n\n\n## 使用 CSS 设置 HTML 列表样式\n\n\
  具体来说，你将学习如何修改列表元素的外观——超出你在第 6 节中学习的 `list-style-type` 属性——以及如何使用 CSS 样化的列表来替换你在第\
  \ 8 节“处理颜色、图像和多媒体](#ch08.xhtml)”中学习的客户端图像映射。你将实践迄为止学过的许多 CSS 样式，并且在本节中获得的知识将直接引导你将列表用于不仅仅是简单的展示项目符号或编号的项目列表。你将学习使用列表进行垂直或水平导航的多种方法之一，包括如何使用列表创建下拉菜单。\n\
  \n本节解释的方法仅代表你可以使用列表创建的众多多样化导航方法中的一小部分。然而，这些概念都是相似的；不同的结果源于你对这些基本概念的创造力及其应用。为了激发你的灵感，我们将在本节结束处提供其他\
  \ CSS 导航示例的提示。\n\n### HTML 列表复习\n\n正如你在第 6 节中所学习的那样，HTML 列表有三种基本类型。根据其类型和上下文，每种类型的内容呈现略有不同：\n\
  \n*   ![Image](img/arrow.jpg) **有序列表 (Ordered list)**——这种类型的列表是一种缩进列表，在每个列表项目之前显示数字或字母。有序列表由\
  \ `<ol>` 和 `</ol>` 标签包裹，列表项目包含在 `<li></li>` 标签对中。这种列表类型通常用于显示编号的步骤或内容的层级。\n\n* \
  \  ![Image](img/arrow.jpg) **无序列表 (Unordered list)**——这种类型的列表是一种缩进列表，在每个列表项目之前显示项目符号或其他符号。无序列表由\
  \ `<ul>` 和 `</ul>` 标签包裹，列表项目包含在 `<li></li>` 标签对中。这种列表类型通常用于提供视觉提示，指示后面将会有简短但具体的信息。\n\
  \n*   ![Image](img/arrow.jpg) **定义列表 (Definition list)**——这种列表通常用于显示术语及其含义，从而在列表本身的上下文中提供信息层级——类似于有序列表但没有编号。定义列表由\
  \ `<dl>` 和 `</dl>` 标签包裹，用 `<dt>` 和 `</dt>` 标签包裹术语，用 `<dd>` 和 `</dd>` 标签包裹定义。\n\n\
  如果有需要，你可以嵌套有序和无序列表——将列表放置在其他列表中。嵌套列表会产生内容层级，因此仅当你的内容确实具有想要显示的层级时（例如内容大纲或目录），才保留其使用。或者，正如你在本节稍晚时候将学到的，当你的网站导航包含子导航元素时，可以使用嵌套列表。\n\
  \n## CSS 盒模型如何影响列表\n\n特定的列表相关样式包括 `list-style-image`（用于将图像作为列表项目标记）、`list-style-position`（指示放置列表项目标记的位置）以及\
  \ `list-style-type`（列表项目标记本身的类型）。虽然这些样式控制着列表和列表项目的结构，但你可以使用 `margin`、`padding`、`color`\
  \ 和 `background-color` 样式来实现更更特定的列表显示效果。\n\n> **注意**\n> \n> 某些旧版浏览器处理外边距（margins）和内边距（padding）的方式不同，特别是在列表和列表项目周围。然而，在编写时，本课程及其他章节中的\
  \ HTML 和 CSS 在当前主流 Web 浏览器（Apple Safari、Google Chrome、Microsoft Edge、Mozilla Firefox\
  \ 和 Opera）中的显示是相同的。当然，在将内容发布到网上之前，你应该在所有浏览器中检查你的网页内容，但为了适应浏览器渲染特殊性而编写“黑科技”样式表的需求实际上已经过去了。\n\
  \n在第 9 节中，你学习了每个元素的内容和元素边界之间都有一些内边距（padding）；你还学习了元素边界与任何其他内容之间存在外边距（margin）。对于列表也是如此，当你为列表设置样式时，必须记住一个“列表”实际上由两个元素组成：父列表元素类型（`<ul>`\
  \ 或 `<ol>`）和单个列表项目本身。这些元素每一个都有受样式表影响的外边距和内边距。\n\n本节中的示例向你展示了不同的 CSS 样式如何影响 HTML\
  \ 列表和列表项目的视觉显示。在本节中练习操作列表时，请记住这些基本区别，你就能利用列表在网站导航中实现高级的视觉效果。\n\nListing 11.1 创建了一个包含三个项目的基本列表。在此列表代码中，无序列表本身（`<ul>`）被赋予了蓝色背景、黑色边框和\
  \ 100 像素的特定宽度，如图图 11.1 所示。列表项目（单个 `<li>` 项目）具有灰色背景和黄色边框。列表项目文本和指示器（符号）是黑色的。\n\n\
  **Listing 11.1** 使用颜色和边框样式创建基本列表\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>List Test</title>\n\
  \    <style>\n      ul {\n        background-color: blue;\n        border: 1px solid\
  \ black;\n        width: 100px;\n      }\n      li {\n        background-color:\
  \ gray;\n        border: 1px solid yellow;\n        color: black;\n      }\n   \
  \ </style>\n  </head>\n  <body>\n    <h1>List Test</h1>\n    <ul>\n      <li>Item\
  \ 1</li>\n      <li>Item 2</li>\n      <li>Item 3</li>\n    </ul>\n  </body>\n</html>\n\
  ```\n\n![图中，list_styles.html 显示了“List Test”标题下的三个列表项目。它们在框内显示，符号有背景颜色，项目有不同的颜色。](img/11fig01.jpg)\n\
  \n**图 11.1** 使用颜色和边框样式设置列表和列表项目\n\n如图 11.1 所示，`<ul>` 创建了一个放置单个列表项目的框。在此示例中，整个框具有蓝色背景（`background-color:\
  \ blue;`）。但请注意，单个列表项目——在本例中使用灰色背景（`background-color: gray;`）和黄色边框（`border: 1px solid\
  \ yellow;`）并没有延伸到 `<ul>` 创建的框边缘。\n\n这是因为浏览器会自动在 `<ul>` 的左侧添加一些内边距（padding）。浏览器不会在外边距（margin）上添加内边距，因为那将出现在框的外部。它们在框内部添加内边距，仅在左侧。该内边距值约为\
  \ 40 像素。\n\n> **注意**\n> \n> 你可以通过创建一个如 Listing 11.1 所示的简单测试文件，然后在样式表的 `ul` 选择器声明中添加\
  \ `padding-left: 40px;`，来测试不同浏览器显示的默认 `padding-left` 值。如果你刷新页面后显示没有变化，则说明你的测试浏览器使用\
  \ 40 像素作为 `padding-left` 的默认值。\n\n无论什么种列表类型，无论使用何种盒模型（参见第 10 节“理解 CSS 盒模型和定位](#ch10.xhtml)”），默认左侧内边距值保持不变。如果你在样式表中添加以下行，创建一个没有项目指示标记的列表，你会发现内边距保持不变（参见图\
  \ 11.2）：\n\n```css\nlist-style-type: none;\n```\n\n![图中，list_styles.html 显示了“List\
  \ Test”标题下框内的三个项目。左侧内边距与之前相同，但列表项目显示没有符号。](img/11fig02.jpg)\n\n\n\n\n\n**图 11.2**\
  \ 无论是否有列表项指示，默认的左侧内边距（padding）保持不变。\n\n当你创建一个包含任何类型列表的页面布局时，可以尝试调整内边距，以使项目在页面上“恰到好处”地放置。同样，仅仅因为列表没有关联的默认外边距（margin），并不意味着你不能为显示分配一些外边距；通过在\
  \ `ul` 选择器的声明中添加 `margin` 值，可以提供额外的布局控制。\n\n但请记住，到目前为止，我们只处理了列表定义本身；还没有处理过将样式应用到单个列表项。在图\
  \ 11.1 和图 11.2 中，列表项的灰色背景和黄色边框没有显示出默认的内边距或外边距。图 11.3 显示了在列表项上应用内边距或外边距值（而不是整个列表“框”本身）所产生的不同效果。\n\
  \n![list_styles2.html 页面的截图显示了当更改每个项目的内边距值时，列表项的显示情况。项目仍然出现在框内。然而，每个项目的内边距和外边距方向发生了变化，列表的后续项目比前一个项目缩进得更多。](img/11fig03.jpg)\n\
  \n**图 11.3** 不同值影响了列表项的内边距和外边距。\n\n第一个列表项是基础项，没有对它应用任何内边距或外边距。第二个列表项使用了一个名为 `padded`\
  \ 的类，在样式表中被定义为 `padding: 6px;`，你可以看到四周都有 6 像素的内边距（位于内容与环绕元素的黄色边框之间）。注意，项目符号（bullet）的位置仍与第一个列表项的位置保持相同。第三个列表项使用了一个名为\
  \ `margined` 的类，在样式表中被定义为 `margin: 6px;`，用于在列表项周围应用 6 像素的外边距；此外边距允许 `<ul>` 的蓝色背景透出来。\n\
  \n### 放置列表项指示器\n\n关于外边距和内边距的所有讨论引发了另一个问题：列表项指示器（使用时）的控制，以及文本应如何环绕它们（或不环绕）。`list-style-position`\
  \ 属性的默认值为 `outside`。这种放置方式意味着符号、数字和其他指示器保持在文本的左侧，位于 `<li></li>` 标签对创建的框之外。当文本在列表项内部换行时，它会在该框内换行，并与元素的左边框左对齐。\n\
  \n但当 `list-style-position` 的值为 `inside` 时，指示器位于 `<li></li>` 标签对创建的框内部。此时，不仅列表项指示器会缩进得更深（它们本质上变成了文本的一部分），文本还会换行到每个项目指示器的下方。\n\
  \n图 11.4 显示了 `outside` 和 `inside` 列表样式位置的示例。代码 11.1 与用于生成图 11.4 中示例的代码之间（不包括添加到项目\
  \ #2 和项目 #3 的填充文本）的唯一区别是：第二个列表项使用了一个名为 `outside` 的类，在样式表中被定义为 `list-style-position:\
  \ outside;`，而第三个列表项使用了一个名为 `inside` 的类，在样式表中被定义为 `list-style-position: inside;`。\n\
  \n![外部与内部列表样式对比。](img/11fig04.jpg)\n\n**图 11.4** `list-style-position` 的 `outside`\
  \ 和 `inside` 值的区别。\n\n用于第二个列表项的额外填充文本显示了当列表宽度定义为一个窄到无法在一行显示所有内容时，文本是如何换行的。你可以在不使用\
  \ `list-style-position: outside;` 的情况下实现相同的结果，因为这是代码中没有显式语句的情况下 `list-style-position`\
  \ 的默认值。\n\n然而，当使用 `inside` 位置时，你可以清楚地看到差异。在第三个列表项中，符号和文本都在黄色边框的灰色区域内——即列表项本身。当 `list-style-position`\
  \ 的值为 `inside` 时，外边距和内边距对列表项的影响不同（参见图 11.5）。\n\n![不同的外边距和内边距值对两个列表项的影响。](img/11fig05.jpg)\n\
  \n**图 11.5** 外边距和内边距改变了使用 `list-style-position: inside` 值的项的显示方式。\n\n在图 11.5 中，第二个和第三个列表项的\
  \ `list-style-position` 值均为 `inside`。然而，第二个列表项具有 12 像素（`12px`）的 `margin-left` 值，第三个列表项具有\
  \ 12 像素的 `padding-left` 值。尽管这两个内容块（列表指示器加文本）都显示文本环绕符号换行，且这些块在定义列表项的灰色区域内的位置是相同的，但受影响的是列表内部的列表项。\n\
  \n正如你预期的那样，`margin-left` 值为 12 像素的列表项显示出 12 像素的蓝色，通过列表项周围的透明外边距透出来。同样，具有 `padding-left`\
  \ 值的列表项显示出 12 像素的蓝色。\n\n### 使用列表项创建图像映射\n\n在第 8 节中，你学习了如何使用 `<map>` 元素创建客户端映射。图像映射允许你定义图像的区域并为其分配链接（而不是将图像切片并在\
  \ HTML 中重新缝合）。然而，代码 11.2 中的代码在图 11.6 中显示。当代码在浏览器中渲染时，它看起来就像一个带有图片的网页。当鼠标悬停在“热点”区域时，会发生动作。\n\
  \n**代码 11.2** 使用 CSS 创建图像映射 点击查看代码\n\n\n\n\n\n```\n    }\n\n    #sh a {\n\n       top:\
  \ 255px;\n\n       left: 165px;\n\n       width: 235px;\n\n       height: 110px;\n\
  \n    }\n\n    #au a {\n\n       top: 370px;\n\n       left: 165px;\n\n       width:\
  \ 235px;\n\n       height: 130px;\n\n    }\n\n </style>\n\n    </head>\n\n    <body><body>\n\
  \n        <div id=\"theImg\">\n\n        <ul>\n\n         <li id=\"mc\"><a href=\"\
  [some URL]\"\n\n               title=\"McKinley\">McKinley</a></li>\n\n         <li\
  \ id=\"su\"><a href=\"[some URL]\"\n\n               title=\"Suni\">Suni</a></li>\n\
  \n         <li id=\"st\"><a href=\"[some URL]\"\n\n               title=\"Stormageddon\"\
  >Stormageddon</a></li>\n\n         <li id=\"di\"><a href=\"[some URL]\"\n\n               title=\"\
  Diamond\">Diamond</a></li>\n\n         <li id=\"sh\"><a href=\"[some URL]\"\n\n\
                 title=\"Shasta\">Shasta / Inara</a></li>\n\n         <li id=”au”><a\
  \ href=”[some URL]”\n\n               title=”Auto”>Suni / Auto</a></li>\n\n        </ul>\n\
  \n       </div></div>\n\n     </body>\n\n   </html>\n```\n\n![我的 mypets.html 页面（在\
  \ Firefox 中显示）展示了几只猫狗的照片。在这里，某只特定猫的照片上方有一个虚线边框。将鼠标指针悬停在照片上会显示文本“Diamond”（这只猫的名字）。](img/11fig06.jpg)\n\
  \n**图 11.6** CSS 允许你在图像映射区域中定义热点。\n\n如列表 11.2 所示，样式表包含相当多的条目，但实际的 HTML 非常短。列表项被用于创建几个不同的可点击区域；这些“区域”是分配了特定高度和宽度的列表项，然后放置在位于背景的图像之上。如果从包裹列表的\
  \ `<<div>>` 背景中移除图像，列表项仍然存在且仍然是可以点击的。\n\n让我们梳理一下样式表，以便你理解构成此 HTML 和 CSS 图像映射的各个，它在最基础的层仅仅是一个链接列表。\n\
  \n链接列表被封装在一个名为 `theImg` 的 `<div>` 中。在样式表中，这个 `<div>` 被定义为宽 400 像素、高 500 像素的块级元素，带有\
  \ 1 像素的实黑色边框。该元素的背景是一个名为 `pets-collage.jpg` 的图像，它放置在一个位置且不重复（`background: url('pets-collage.jpg')\
  \ no-repeat;`）。你看到的下一个 HTML 代码是无序列表（<ul>`）的开头。在样式表中，此无序列表四周的外边距和内边距均为 0 像素，且 `list-style`\
  \ 设置为 `none`——列表项前面不会有任何图标。\n\n由于样式表中对 `<div>` 内部所有 `<a>` 标签使用了以下技巧，列表项的文本本身永远不会显示给用户看：\n\
  \n```\ntext-indent: -1000em;\n```\n\n通过将文本向*负*方向缩进 1,000 em，你可以确保文本永远不会出现。它确实存在，但位于浏览器窗口左侧\
  \ 1,000 em 处的不可见区域。换句话说，如果你把左手放在显示器一侧，`text-indent:-1000em;` 将文本放置在你小指的左侧。但这正是我们想要的，因为我们不需要看到文本。我们只需要定义一个区域，让用户的鼠标在悬停在网站任何链接上时发生变化。当用户的鼠标悬停在包含链接的列表项上，该列表项会显示\
  \ 4 像素的黄色虚线边框，得益于样式表中的此条目：\n\n```\n#theImg a:hover {\n   border:4px dashed\n```\n\
  \n列表项本身根据预期点击的图像区域被定义并放置。例如，具有 `di` ID 的 `Diamond` 项（图中的名称），其左上角距离 `<<div>>` 顶部\
  \ 255 像素，距离 `<<div>>` 左边缘 0 像素。此列表项宽 160 像素，高 245 像素。对 `#mc`、`#su`、`#st` 和 `#au`\
  \ 列表项也做了类似的声明，以便链接区域相对于图像出现在特定位置。\n\n### 导航列表与普通列表的区别\n\n当我们谈论使用列表创建导航元素时，我们实际上是指使用\
  \ CSS 以访问者期望的方式显示内容——简单来说，与简单的符号列表或编号列表*不同*。虽然一组导航元素本质上是一个链接列表，但这些链接的显示方式让用户知道可以与其交互：\n\
  \n* ![图像](img/arrow.jpg) 用户的鼠标将变化，以指示元素是可点击的。\n* ![图像](img/arrow.jpg) 鼠标悬停在元素上时，周围区域会变化。\n\
  * ![图像](img/arrow.jpg) 内容区域与普通文本视觉分离。\n\n旧的导航方法依赖于图像——例如带有斜角的图形，以及使用客户端 JavaScript\
  \ 处理图像切换。但使用纯 CSS 创建导航可以产生更易用、灵活且对友好的显示，适用于各种设备。\n\n无论导航元素的布局是水平的还是垂直的，本节都讨论两个级别的导航：*主导航*引导用户进入网站主要部分的页面；*二级导航*引导用户进入网站内特定部分的页面。\n\
  \n### 使用 CSS 创建垂直导航\n\n根据你的网站架构——包括你创建的模板以及对网站信息分类的方式——可能会发现自己在使用主导航或二级导航。\n\n例如，假设你为公司创建一个网站，主部分有“关于我们”、“产品”和“新闻”。在“关于我们”主部分，你可能有其他页面，如“使命”、“历史”、“管理团队”和“联系我们”；这些其他页面就是“关于我们”主部分的二级导航。\n\
  \n列表 11.3 设置了一个侧边带有垂直导航的基础二级页面。侧侧的链接和内容区域的链接都是基础的 HTML 列表元素。\n\n列表 11.3 和图 11.7\
  \ 中的示例提供了展示 CSS 如何将两个类似的 HTML 结构转换为不同的视觉显示（因此是不同的上下文）的起点。\n\n**列表 11.3** 带有列表垂直导航的基础页面\n\
  \n点击此处查看代码图像\n\n```\n<!doctype html>\n  <html lang=\"en\">\n  <head>\n      <meta\
  \ charset=\"utf-8\">\n      <title>About Us</title>\n      <style>\n      body {\n\
            font: 12pt Verdana, Arial, Georgia, sans-serif;\n      }\n      nav {\n\
            width: 150px;\n          float: left;\n          margin-top: 12px;\n          margin-right:\
  \ 18px;\n      }\n      section {\n          width: 550px;\n          float: left;\n\
        }\n      </style>\n    </head>\n    <body>\n      <nav>\n       <ul>\n          <li><a\
  \ href=\"#\">Mission</a></li>\n          <li><a href=\"#\">History</a></li>\n    <li><li><a\
  \ href=\"#\">Executive Team</a></li>\n         <li><li><a href=\"#\">Contact Us</a></li>\n\
          </ul>\n       </nav>\n       <section>\n          <header>\n           <h1>About\
  \ Us</h1>\n          </header>\n       </section>\n   </body>\n</body>\n```\n\n\n\
  \n\n\n使命和慈善活动。\n\n- `History`：阅读我们的公司历史，了解我们是如何成长该国最大的部件制造商的。\n- `Executive Team`：我们的执行团队让公司运行得像一台润滑良好的机器（这对于制造小部件也很有用）。\n\
  - `Contact Us`：在这里你可以找到多种联系我们的方法（我们真的非常在意你的所言）。\n\n![使用垂直导航。](img/11fig07.jpg)\n\
  \n**图 11.7** 起点：一个未样式的列表导航。\n\n此页的内容由两个部分组成：一个包含导航的 `<nav>` 元素和一个包含页面主要正文的单个 `<section>`\
  \ 元素。在这个基础页面中，分配给任何内容的唯一样式是与每个元素相关的 `width`、`margin` 和 `float` 值。列表元素没有应用任何样式。\n\
  \n为了区分内容区域列表中的链接与侧边导航列表中的链接，请在样式表中添加以下样式：\n\n```css\nnav a {\n   text-decoration:\
  \ none;\n}\n\nsection a {\n   text-decoration: none;\n   font-weight: bold;\n}\n\
  ```\n\n这些样式仅表示 `<nav>` 中的所有 `<a>` 链接都没有下划线，而 `<section>` 中的所有 `<a>` 链接都没有下划线且为加粗。图\
  \ 11.8 显示了这种差异。\n\n![在截图中，“关于我们”部分显示其内容以垂直导航样式布局。然而，主正文中的链接没有下划线，并以加粗文本显示。 ](img/11fig08.jpg)\n\
  \n**图 11.8** 使用 CSS 区分列表元素。\n\n但要真正让侧边导航列表看起来与众不同，你必须深入研究样式表。\n\n### 为单级垂直导航设置样式\n\
  \n这组特定导航元素的目标仅仅是将它们呈现为一个没有项目符号的链接块，并且其背景颜色和文本颜色会根据链接的状态而变化（普通链接、访问过的链接、悬停在链接上或激活链接——这些在第\
  \ 7 ，“使用外部和内部链接](#ch07.xhtml)”中介绍过）。过程的第一步已经完成：将导航与内容分离。我们通过将导航放在 `<nav>` 元素中实现了这一点。\n\
  \n接下来，我们需要修改定义 `<nav>` 元素内链接的 `<ul>`。让我们移除列表指示，并确保除了上边距外没有额外的边距或内边距。该上边距用于对齐导航顶部与页面内容区域“关于我们”标题文本的顶部：\n\
  \n```css\nnav ul {\n   list-style: none;\n   margin: 12px 0px 0px 0px;\n   padding:\
  \ 0px;\n}\n```\n\n由于导航列表项本身将显示为颜色区域，我们为每个列表项添加了下边框，以便对内容进行视觉上的分离：\n\n点击此处查看代码图像\n\
  \n```css\nnav li {\n   border-bottom: 1px solid #ffffff;\n}\n```\n\n现在继续构建剩余的列表项。思路是，当列表项仅作为链接存在时，它们将呈现出特殊的蓝色，并配有加粗白色文本（尽管它们的字体比正文本身要小）。为了实现这种效果，我们添加以下内容：\n\
  \n点击此处查看代码图像\n\n```css\nnav li a:link, nav li a:visited {\n   font-size: 10pt;\n\
  \   font-weight: bold;\n   display: block;\n   padding: 3px 0px 3px 3px;\n   background-color:\
  \ #628794;\n   color: #ffffff;\n}\n```\n\n之前使用的所有样式都是熟悉的，可能只有 `display: block;`\
  \ 除外。将 `display` 属性设置为 `block` 可以确保当鼠标悬停在它上方时，整个 `<li>` 都是可点击的。图 11.9 显示了结果。\n\n\
  ![现在高亮的列表项。](img/11fig08.jpg)\n\n**图 11.9** 列表项现在会改变颜色。\n\n但要真正让侧边导航列表看起来与众不同，你必须深入研究样式表。\n\
  \n### 为多级垂直导航设置样式\n\n如果网站架构需要另一层导航怎么办？这由嵌套列表表示（你在之前的课程中学习过）。在这种情况下，修改此处的 HTML：\n\
  \n点击此处查看代码图像\n\n```html\n<ul>\n   <li><a href=\"#\">Mission</a></li>\n   <li><a\
  \ href=\"#\">History</a></li>\n   <li><a href=\"#\">Executive Team</a>\n      <ul>\n\
  \         <li><a href=\"#\">raquo; CEO</a></li>\n         <li><a href=\"#\">raquo;\
  \ CFO</a></li>\n         <li><a href=\"#\">raquo; COO</a></li>\n         <li><a\
  \ href=\"#\">raquo; Other Minions</a></li>\n      </ul>\n   </li>\n   <li><a href=\"\
  #\">Contact Us</a></li>\n</ul>\n```\n\n此代码在 Executive Team 链接下生成了一个嵌套列表（参见图 11.11）。`&raquo;`\
  \ HTML 实体产生指向右的箭头，这些箭头显示在新链接的文本之前。\n\n![一张截图显示了嵌套导航列表的使用。在这种情况下，网页左侧的 Executive\
  \ Team 列表项下有四个子列表项：CEO、CFO、COO 和 Minions。然而，层级结构并没有清晰地表示。 ](img/11fig11.jpg)\n\n\
  **图 11.11** 创建嵌套导航列表（但样式设置得良好）。\n\n新项目以块元素的形式出现在列表中，但信息的层级结构没有在视觉上表示。为了添加某种视觉元素来标识这些项目是附加到\
  \ Executive Team 链接的子导航元素，我们再次修改样式表以添加一些缩进。\n\n\n\n\n\n为了确保两组列表项都具有适当的样式，请确保样式表选择器清晰地指示列表的层级结构。为此，第一级列表可以使用\
  \ `nav ul` 和 `nav ul li` 等条目，第二级列表则使用 `nav ul ul` 和 `nav ul ul li`。列表 11.4 显示了样式表条目的的新版本，以及生成图\
  \ 11.12 中所示菜单的 HTML 代码。\n\n**列表 11.4** 列表中的多级垂直导航\n\n点击此此处查看代码图片\n\n```\n<!doctype\
