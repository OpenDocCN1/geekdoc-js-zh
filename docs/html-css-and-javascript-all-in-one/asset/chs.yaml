  \n## 第 22 节\n\n## 使用变量、字符串和数组\n\n**本节将学习：**\n\n*   如何命名、声明和赋值变量\n*   如何选择使用局部或全局\n\
  *   如何进行类型转换\n*   如何创建和使用 `String` 对象\n*   如何创建和使用数字和字符串数组\n*   如何定义、调用并从函数返回值\n\
  *   如何使用对象属性和值\n*   如何定义和使用对象方法\n*   如何使用 `Math` 对象的方法\n*   如何使用 `new` 和 `this`\
  \ 关键字来处理对象\n*   如何使用 `Date` 对象处理日期\n\n\n\n\n\n除非你跳过了目前为止所有与 JavaScript 相关的课程，否则你已经使用过几个变量了。你可能也可以不需要额外帮助的情况下，自己学会如何使用更多的变量。尽管如此，变量还有某些方面你尚未学习，这些将在接下来的几个章节中介绍。\n\
  \n### 选择变量名\n\n回顾一下，变量是命了名称的容器，可以存储数据（例如：数字、文本字符串或对象）。正如你之前学的那样，每个变量都有一个由你指定的唯一名称。然而，在选择变量名时，你必须遵循一些规则：\n\
  \n*   变量名可以包含字母表中的字母，包括大写和小写。它们还可以包含数字 0–9 和下划线（`_`）字符。\n*   变量名不能包含空格或任何其他标点字符。\n\
  *   变量名的第一个字符必须是字母或下划线。\n*   变量名是区分大小写的；例如，`totalnum`、`Totalnum` 和 `TotalNum` 会被解释为不同的变量名。\n\
  *   变量名的长度没有官方限制，但它必须能够单行显示。坦率地说，如果你的变量名超过了该长度——甚至超过了 25 个左右的字符，你可能考虑不同的命名规范。\n\n\
  使用这些规则，以下是有效变量名的示例：\n\n```\ntotal_number_of_fish\nLastInvoiceNumber\ntemp1\na\n\
  _var39\n```\n\n**注意**\n\n你可以选择使用友好的、易读的名称，也可以使用完全晦涩的名称。为自己一个忙吧：尽可能使用较长的（但不要太长）且友好的名称。虽然你现在可能记得\
  \ `a`、`b`、`x` 和 `x1` 之间的区别，但在离开代码几天后，你可能就忘记了，而且如果没有一些文档，除了你以外的人绝对无法理解你那晦涩的命名规范。\n\
  \n### 使用局部变量和全局变量\n\n某些计算机语言要求你在使用变量之前对其进行声明。JavaScript 包含了 `var` 关键字，可以用它声明变量。在很多情况下，你可以省略\
  \ `var`，当你第一次给变量赋值时，该变量仍然会被声明。\n\n为了理解在何声明变量，你需要理解“作用域”（scope）的概念。变量的作用域是脚本中可以使用该变量的区域。变量有两种类型：\n\
  \n*   全局变量整个脚本（以及同一个 HTML 文档中的其他脚本）都是作用域。它们可以在任何地方使用，甚至是在函数内部。\n*   局部变量以单个函数为作用域。它们只能在创建它们的函数内部使用。\n\
  \n要创建一个全局变量，你需要在主脚本中声明它，在任何函数之外。你可以使用 `var` 关键字来声明变量，如下例所示：\n\n```\nvar students\
  \ = 25;\n```\n\n这条语句声明了一个名为 `students` 的变量并给它赋值为 `25`。如果该语句在函数外部使用，就会创建一个全局变量。在这种情况下，`var`\
  \ 关键字是可选的，因此这条语句与前面的语句等效：\n\n```\nstudents = 25;\n```\n\n在你习惯省略 `var` 关键字之前，请务必确切理解在什么时候是需要它的。始终使用\
  \ `var` 关键字实际上是一个好主意；如果你一直使用它，你就能避免错误并让脚本更易读，而且它通常不会引起任何麻烦。\n\n局部变量属于特定的函数。你在函数中使用\
  \ `var` 关键字声明的任何变量都是局部变量。此外，函数参数列表中的变量总是局部变量。\n\n要在函数内部创建局部变量，你*必须*使用 `var` 关键字。这强制\
  \ JavaScript 创建一个局部变量，即使存在同名的全局变量。然而，尽量保持你的变量名具有区分度，即使你在不同的作用域中使用它们。\n\n你现在应该理解局部变量和全局变量的区别了。如果你仍然有点困惑，不要担心：如果你每次都使用\
  \ `var` 关键字，你通常会得到正确的变量类型。\n\n### 给变量赋值\n\n正如你在第 4 节中的“理解 JavaScript”中所中学的那样，你使用等号（`=`）为变量赋值。例如，这条语句将值\
  \ `40` 赋值给变量 `lines`：\n\n```\nvar lines = 40;\n```\n\n你可以在等号右使用任何表达式，包括其他变量。例如，之前你使用这种语法给变量加\
  \ 1：\n\n```\nlines = lines + 1;\n```\n\n由于变量的递增或递减非常常见，JavaScript 包含了这种语法的两种简写形式。第一个是\
  \ `+=` 运算符，它允许你创建上述示例的更短版本：\n\n```\nlines += 1;\n```\n\n同样，你可以通过 `−=` 运算符从变量中减去一个数字：\n\
  \n```\nlines −= 1;\n```\n\n如果你仍然觉得那样输入太麻烦，JavaScript 还包含了递增和递减运算符 `++` 和 `--`。这条语句将\
  \ `lines` 的值加 1：\n\n```\nlines++;\n```\n\n同样，这条语句从 `lines` 的值减去 1：\n\n```\nlines--;\n\
  ```\n\n你也可以在变量名之前使用 `++` 或 `--` 运算符，如 `++lines`。然而，`++lines` 和 `lines++` 并不等同。它们的区别在于递增或递减发生的时机：\n\
  \n*   如果运算符在变量名之后（例如 `lines++`），递增或递减发生在表达式评估*之后*。\n*   如果运算符在变量名之前（例如 `++lines`），递增或递减发生在表达式评估*之前*。\n\
  \n这种区别只在你要在语句中使用变量并对其进行增减时产生问题。例如，假设你给 `lines` 变量赋值为 `40`。以下两条语句的效果不同：\n\n```\n\
  alert(lines++);\nalert(++lines);\n```\n\n第一条语句显示值 `40`，然后将 `lines` 加到 `41`。第二条语句先将\
  \ `lines` 加到 `41`，然后显示值 `41`。\n\n**注意**\n\n递增递减运算符完全是为了你的方便。如果你觉得坚持 `lines = lines\
  \ + 1` 更习惯，就这样做；你的脚本不会受到影响。\n\n### 理解表达式和运算符\n\n表达式是变量和值的组合，JavaScript 解释器可以将其求出一个值，例如\
  \ `2+2=4`。用于组合这些值的字符（如 `+` 和 `/`）被称为运算符。\n\n**注意**\n\n除了变量和常量值，表达式还可以包括返回结果的函数调用。\n\
  \n### 使用 JavaScript 运算符\n\n在之前的 JavaScript 示例中，你已经使用了一些运算符，例如加号 `+` 以及递增递减运算符。表\
  \ 22.1 列出了 JavaScript 表达式中一些最重要（最常用）运算符。\n\n**表 22.1** 常用 JavaScript 运算符\n\n| 运算符\
  \ | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 拼接字符串 | `message=\"this is\" + \"\
  \ a test\";` |\n| `+` | 加 | `result = 5 + 7;` |\n| `−` | 减 | `score = score − 1;`\
  \ |\n| `*` | 乘 | `total = quantity * price;` |\n| `/` | 除 | `average = sum / 4;`\
  \ |\n| `%` | 取模（余数） | `remainder = sum % 4;` |\n| `++` | 递增 | `tries++;` |\n| `--`\
  \ | 递减 | `total--;` |\n\n\n\n\n\n除了这些，条件语句中还使用了许多其他运算符。你将在第 23 节“使用条件和循环控制流](#ch23.xhtml)”中学习这些运算符。\n\
  \n## 运算符优先级\n\n当你在表达式中使用多个运算符时，JavaScript 使用`运算符优先级`（operator precedence）规则来决定如何计算该值。表\
  \ 22.1 按照优先级从低到高列出了运算符，优先级最高的运算符会被优先计算。例如，考虑这条语句：\n\n```\nresult = 4 + 5 * 3;\n\
  ```\n\n如果你尝试计算这个结果，有两种方法。你可以先相乘 `5 * 3` 然后加 `4`（结果：`19`），或者也可以先加 `4 + 5` 然后乘以 `3`（结果：`27`）。JavaScript\
  \ 通过遵循优先级规则来解决这个困境：因为乘法的优先级高于加法，所以 JavaScript 先相乘 `5 * 3`，然后加 `4`，得到结果 `19`。有时运算符优先级并不会产生你想要的结果。例如，考虑这条语句：\n\
  \n```\nresult = a + b + c + d / 4;\n```\n\n这是尝试通过将四个数字相加然后除以四来计算平均值。然而，由于 JavaScript\
  \ 给的除法优先级高于加法，它会在加上其他数字之前将变量 `d` 除以 `4`，从而产生错误的结果。\n\n你可以通过使用括号来控制优先级。这里是计算平均值的有效语句：\n\
  \n```\nresult = (a + b + c + d) / 4;\n```\n\n括号确保了先加四个变量，然后将总和除以 4。如果你不确定运算符优先级，可以使用括号确保运行结果符合你的预期，并使脚本更具可读性。\n\
  \n## JavaScript 中的数据类型\n\n在某些计算机语言中，你必须指定变量将存储的数据类型（例如数字或字符串）。在 JavaScript 中，大多数情况下你不需要指定数据类型。但是，你应该了解\
  \ JavaScript 可以处理的数据类型。\n\n这些是基础的 JavaScript 数据类型：\n\n* ![Image](img/arrow.jpg)\
  \ `Number`——数字的示例包括 `3`、`25` 和 `1.4142138`。JavaScript 支持整数和浮点数。\n* ![Image](img/arrow.jpg)\
  \ `Boolean`——布尔值是逻辑值。一个 `Boolean` 可以取两个值之一：`true` 或 `false`，用于指示某个条件是否成立。\n* ![Image](img/arrow.jpg)\
  \ `String`——字符串（例如 `\"I am a jelly doughnut\"`）由一个或多个文本字符组成。（严格来说，字符串是 `String`\
  \ 对象，你将在本节的稍后部分学习它们。）\n* ![Image](img/arrow.jpg) `Null`——空值，由关键字 `null` 表示，是未定义变量的值。例如，如果变量\
  \ `fig` 之前未被使用或定义，语句 `document.write(fig)` 将导致一个空值（以及一条错误消息）。\n\n尽管 JavaScript 会跟踪每个变量中当前存储的数据类型，但它并没有限制你在中途更改类型。例如，假设你通过给变量赋值来声明它，如下所示：\n\
  \n```\nvar total = 31;\n```\n\n这条语句声明了一个名为 `total` 的变量并为其赋值了值 `31`。这是一个数值型变量。现在假设你更改了\
  \ `total` 的值：\n\n```\ntotal = \"albatross\";\n```\n\n这为 `total` 赋值了一个字符串值，替换了数值值。JavaScript\
  \ 在执行此语句时不会显示错误；它是完全有效的，尽管这可能不是一个很有用的“总数”。\n\n**注意**\n\n尽管 JavaScript 的这一功能既方便又强大，但它也可能让你很容易出错。例如，如果\
  \ `total` 变量后续被用于数学计算，结果将是无效的——但 JavaScript 不会警告你犯了这个错误。\n\n## 数据类型之间的转换\n\n只要可能，JavaScript\
  \ 都会自动为你处理数据类型之间的转换。例如，你已经使用过这样的语句：\n\n点击此处查看代码图像\n\n```\ndocument.write(\"The total\
  \ is \" + total);\n```\n\n这条语句打印出消息 `\"The total is 40\"`。因为 `document.write` 函数与字符串一起，JavaScript\
  \ 解释器会在执行函数之前自动将表达式中的任何非字符串（在此例中，为 `total` 的值）转换为字符串。\n\n这对于浮点值和布尔值同样有效。然而，在某些情况下它不起作用。例如，如果\
  \ `total` 的值为 `40`，则以下语句运行正常：\n\n```\naverage = total / 3;\n```\n\n然而，`total` 变量也可能包含字符串；在这种情况下，前述语句将导致错误。\n\
  \n在某些情况下，可能会得到一个包含数字的字符串，并需要将其转换为普通的数值变量。JavaScript 包含了两个为此目的函数：\n\n* ![Image](img/arrow.jpg)\
  \ `parseInt`——将字符串转换为整数\n* ![Image](img/arrow.jpg) `parseFloat`——将字符串转换为浮点数\n\n\
  这两个函数都会从字符串的开头读取数字并返回数值版本。例如，这些语句将字符串 `\"30 angry bears\"` 转换为数字：\n\n点击此处查看代码图像\n\
  \n```\nvar stringvar = \"30 angry bears\";\nvar numvar = parseInt(stringvar);\n\
  ```\n\n执行这些语句后，变量 `numvar` 包含了 `30`；非数字部分被忽略。\n\n**注意**\n\n这些函数会在字符串开头寻找相应类型的数字。如果没有找到有效的数字，函数将返回特殊值\
  \ `NaN`，意为*不是数字*。\n\n## 使用字符串对象\n\n你已经在之前的示例中使用了一些字符串。字符串存储一组文本字符，命名方式与其他变量类似。作为一个简单的示例，这会将字符串\
  \ `This is a test` 赋值给变量：\n\n点击此处查看代码图像\n\n```\nvar stringtest = \"This is a test\"\
  ;\n```\n\n在后续章节中，你将更多地了解 `String` 对象并在脚本中使用它。\n\n### 创建字符串对象\n\nJavaScript 将字符串存储为\
  \ `String` 对象。你通常不需要担心这个信息——即字符串是对象——但它可以解释你将看到的一些常用字符串技巧，这些技巧使用了 `String` 对象的方法（内置函数）。\n\
  \n创建新的 `String` 对象有两种方法。第一种是你已经使用的，第二种方法涉及面向对象的语法。以下两个语句创建相同的字符串：\n\n点击此处查看代码图像\n\
  \n```\nvar stringtest = \"This is a test\";\nstringtest = new String(\"This is a\
  \ test\");\n```\n\n第二条语句使用了 `new` 关键字，你用它创建对象。这告诉浏览器创建一个包含文本 `This is a test` 的新\
  \ `String` 对象，并将其赋值给变量 `stringtest`。\n\n**注意**\n\n尽管可以使用面向对象的语法创建字符串，但标准的 JavaScript\
  \ 语法更简单，且两种方法创建的字符串没有区别。\n\n### 赋值\n\n你可以像处理任何其他变量一样为字符串赋值。前一节中的两个示例都为字符串分配了初始值。你也可以在字符串创建后进行赋值。例如，以下语句用新字符串替换了\
  \ `stringtest` 变量的内容：\n\n```\nvar stringtest = \"This is only a test.\";\n```\n\n\
  \n\n\n\n你也可以使用连接运算符（`+`）来组合两个字符串的值。列表 22.1 显示了赋值和组合字符串值的一个简单示例。\n\n**列表 22.1** 给字符串赋值并组合它们\n\
  \n点击此处此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>String Text</title>\n    <meta name=\"viewport\"\
  \ content=\"width=device-width,initial-scale=1\">\n  </head>\n  <body>\n    <h1>String\
  \ Test</h1>\n    <script>\n      var stringtest1 = \"This is a test. \";\n     \
  \ var stringtest2 = \"This is only a test.\";\n      var bothstrings = stringtest1\
  \ + stringtest2;\n      alert(bothstrings);\n    </script>\n  </body>\n</html>\n\
  ```\n\n该脚本为两个字符串变量 `stringtest1` 和 `stringtest2` 赋值，然后显示它们的组合值（变量 `bothstrings`）的警告。如果你在浏览器中加载此\
  \ HTML 文档，输出应该类似于图 22.1 所示。\n\n![字符串测试渲染输出的截图。屏幕显示了一个带有“This is a test! This is\
  \ only a test.”的弹出窗口，有一个 Ok 按钮。](img/22fig01.jpg)\n\n**图 22.1** 字符串示例脚本的输出。\n\n\
  除了使用 `+` 运算符连接两个字符串外，你还可以使用 `+=` 运算符向字符串添加文本。例如，此语句向名为 `sentence` 的字符串变量的当前内容添加了一个句号：\n\
  \n```\nsentence += \".\";\n```\n\n### 注意\n加号（`+`）在 JavaScript 中也用于数字数字。浏览器会根据你与加号一起使用的数据类型或数据类型来判断使用加法还是连接。如果你在数字和字符串之间使用它，数字将转换为字符串并进行连接。\n\
  \n### 计算字符串的长度\n有时你可能会发现知道字符串变量包含多少个字符是有用的。你可以通过 `String` 对象的 `length` 属性来实现，该属性可用于任何字符串。要使用此属性，输入字符串名称后跟\
  \ `.length`。\n\n例如，`stringtest.length` 指的是 `stringtest` 字符串的长度。这里是该属性的一个示例：\n\n\
  点击此处查看代码图像\n\n```javascript\nvar stringtest = \"This is a test.\";\ndocument.write(stringtest.length);\n\
  ```\n\n第一条语句将字符串 `This is a test.` 赋值给变量 `stringtest`。第二条语句显示字符串的长度——在这种情况下为 15\
  \ 个字符。`length` 属性是一个只读属性，因此你不能给它赋值来更改字符串的长度。\n\n### 注意\n记住，尽管 `stringtest` 指向一个字符串变量，但\
  \ `stringtest.length` 的值是一个数字，可以在任何数值表达式中使用。\n\n### 转换字符串的大小\n`String` 对象的两种方法允许将字符串的内容转换为全大写或全小写：\n\
  \n* ![Image](img/arrow.jpg) `toUpperCase()`——将字符串中的所有字符转换为大写\n* ![Image](img/arrow.jpg)\
  \ `toLowerCase()`——将字符串中的所有字符转换为小写\n\n例如，以下语句以小写形式显示 `stringtest` 字符串变量的值：\n\n点击此处查看代码图像\n\
  \n```javascript\ndocument.write(stringtest.toLowerCase());\n```\n\n如果此变量包含文本 `This\
  \ Is A Test`，则结果将是以下字符串：\n\nthis is a test\n\n注意，该语句并没有更改 `stringtest` 变量的值。这些方法返回字符串的大写或小写版本，但它们不会更改字符串本身。如果你想更改字符串的值，可以使用像这样的语句：\n\
  \n点击此处查看代码图像\n\n```javascript\nstringtest = stringtest.toLowerCase();\n```\n\n###\
  \ 注意\n注意，这些方法的语法与之前介绍的 `length` 属性的语法相似。区别在于方法始终使用括号，而属性则不然。`toUpperCase` 和 `toLowerCase`\
  \ 方法不需要任何参数，但你仍然需要使用括号。\n\n### 处理子字符串\n在本节目前为止的短示例中，你只处理了整个字符串。像大多数其他编程语言一样，JavaScript\
  \ 也允许你处理子字符串（`substrings`），即字符串的部分。你可以使用 `substring()` 方法或 `charAt()` 方法来获取字符串的部。\n\
  \n#### 使用字符串的部\n`substring()` 方法获取字符串的一部分。关于使用 `substring()`，你需要理解三点：点击此处查看代码图像\n\
  \n1. 索引从第一个字符的 `0` 开始。\n2. 第二个索引是不包含在内的。\n3. 两个值中的较小值将被视为第一个索引。\n\n例如，`substring()`\
  \ 方法返回字符串的一部分：点击此处查看代码图像\n\n```javascript\ndocument.write(stringtest.substring(3,\
  \ 6));\n```\n\n另一个示例，假设你定义了一个字符串 `alpha` 来存储大写字母表：点击此处查看代码图像\n\n```javascript\n\
  var alpha = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\n```\n\n以下是在 `alpha` 字符串上使用 `substring()`\
  \ 方法的示例：\n\n* ![Image](img/arrow.jpg) `alpha.substring(0,4)` 返回 `ABCD`。\n* ![Image](img/arrow.jpg)\
  \ `alpha.substring(10,12)` 返回 `KL`。\n* ![Image](img/arrow.jpg) `alpha.substring(12,10)`\
  \ 返回 `KL`。\n* ![Image](img/arrow.jpg) `alpha.substring(6,7)` 返回 `G`。\n* ![Image](img/arrow.jpg)\
  \ `alpha.substring(24,26)` 返回 `YZ`。\n* ![Image](img/arrow.jpg) `alpha.substring(0,26)`\
  \ 返回整个字母表。\n* ![Image](img/arrow.jpg) `alpha.substring(6,6)` 返回空字符串。\n\n#### 获取单个字符\n\
  使用 `charAt()` 方法是从字符串指定位置获取单个字符的简单方法。要使用此方法，在括号中指定字符的索引或位置。如你所学的，索引从第一个字符的 `0` 开始。这里是在\
  \ `alpha` 字符串上使用 `charAt()` 方法的一些示例\n\n* ![Image](img/arrow.jpg) `alpha.charAt(0)`\
  \ 返回 `A`。\n* ![Image](img/arrow.jpg) `alpha.charAt(12)` 返回 `M`。\n* ![Image](img/arrow.jpg)\
  \ `alpha.charAt(25)` 返回 `Z`。\n* ![Image](img/arrow.jpg) `alpha.charAt(27)` 返回空字符串。\n\
  \n#### 查找子字符串\n子字符串的另一个用途是在另一个字符串中查找字符串。实现这一点的方法之一是 `indexOf()` 方法。要使用此方法，将 `indexOf`\
  \ 添加到要搜索的字符串，并在括号中指定要查找的字符串。此示例在 `stringtest` 字符串中搜索 `this`并将结果赋值给名为 `location`\
  \ 的变量：点击此处查看代码图像\n\n```javascript\nvar location = stringtest.indexOf(\"this\");\n\
  ```\n\n### 注意\n\n\n\n\n与大多数其他 JavaScript 方法和属性名一样，`indexOf` 是区分大小写的。在脚本中使用它时，请确保你输入的类型与此处显示的完全一致。\n\
  \n`location` 变量返回的值是字符串中的索引，类似于 `substring` 方法中的第一个索引。字符串的第一个字符索引为 `0`。\n\n你可以在此方法中指定一个可选的第二个参数，以指示开始搜索的索引值。例如，此语句在\
  \ `moretext` 字符串中搜索单词 `fish`，从第 20 个字符开始：\n\n点击此处查看代码图片\n\n```javascript\nvar location\
  \ = moretext.indexOf(\"fish\",19);\n```\n\n> **注意**\n> 此方法的第二个参数的一个用途是搜索字符串的多次出现情况。找到第一个匹配项后，从该位置开始搜索第二个，依此类推。\n\
  \n另一个方法 `lastIndexOf` 的工作方式相同，但它寻找字符串的最后一次出现。它从最后一个字符开始反向搜索。例如，此语句在 `names` 字符串中寻找\
  \ `Fred` 的最后一次出现：\n\n点击此处查看代码图片\n\n```javascript\nvar location = names.lastIndexOf(\"\
  Fred\");\n```\n\n与 `indexOf` 来说，你可以指定一个位置作为第二个参数。在这种情况下，字符串将从该位置开始反向搜索。\n\n### 使用数值数组\n\
  \n数组是一组数据项，你可以将其视为一个单一单元。例如，你可能使用一个名为 `scores` 的数组来存储游戏的多个分数。数组可以包含字符串、数字或其他类型的数据。数组中的每个项被称为数组的元素。\n\
  \n#### 创建数值数组\n\n与其他类型的 JavaScript 变量不同，你通常需要在使用数组之前声明它。以下示例创建一个带有四个元素的数组：\n\n```javascript\n\
  scores = new Array(4);\n```\n\n要给数组赋值，你需要使用括号。如你在本节之前看到的，索引从 `0` 开始，因此示例中的数组元素编号为\
  \ `0` 到 `3`。这些语句为数组的四个元素赋值：\n\n```javascript\nscores[0] = 39;\nscores[1] = 40;\n\
  scores[2] = 100;\nscores[3] = 49;\n```\n\n你还可以同时声明数组并指定元素的值。此语句在单行内创建相同的 `scores`数组：\n\
  \n点击此处查看代码图片\n\n```javascript\nscores = new Array(39,40,100,49);\n```\n\n你也可以使用简写语法来声明数组并指定其内容。使用以下语句是创建\
  \ `scores`数组的另一种方法：\n\n```javascript\nscores = [39,40,100,49];\n```\n\n> **注意**\n\
  > 使用 `new` 声明数组时要使用括号，例如 `a = new Array(3,4,5)`；在未使用 `new` 声明数组时使用括号，例如 `a = [3,4,5]`。否则你会遇到\
  \ JavaScript 错误。\n\n#### 理解数组长度\n\n与字符串一样，数组有一个 `length` 属性。该属性告诉数组中元素的数量。如果你在创建数组时指定了长度，该值将成为\
  \ `length` 属性的值。例如，这些语句将打印数字 `30`：\n\n点击此处查看代码图片\n\n```javascript\nscores = new\
  \ Array(30);\ndocument.write(scores.length);\n```\n\n你可以声明一个没有特定长度的数组，并通过给元素赋值或更改\
  \ `length` 属性来以后长度。例如，这些语句创建一个新数组并给它的两个元素赋值：\n\n```javascript\ntest = new Array();\n\
  test[0]=21;\ntest[5]=22;\n```\n\n在此示例中，由于赋值的最大索引是 `5`，数组的 `length` 属性为 `6`。记住元素从\
  \ `0` 开始编号。\n\n#### 访问数组元素\n\n你可以使用赋值时相同的符号来读取数组的内容。例如，以下语句将显示 `scores`数组的前三个元素的值：\n\
  \n点击此处查看代码图片\n\n```javascript\nscoredisplay = \"Scores: \" + scores[0] + \",\" +\n\
  scores[1] + \",\" + scores[2];\ndocument.write(scoredisplay);\n```\n\n> **注意**\n\
  > 看着这个示例，你可能会认为显示大型数组的所有元素将是不方便的。这是循环的理想工作，循环允许你使用不同的值多次执行相同的语句。你将在第 23 节中学习关于循环的所有知识。\n\
  \n### 使用字符串数组\n\n到为止，你使用的是数字数组。JavaScript 还允许你使用字符串数组，即字符串的数组。这是一个强大的功能，允许你同时处理大量的字符串。\n\
  \n#### 创建字符串数组\n\n你以与数值数组相同的方式声明字符串数组——事实上，JavaScript 并不区分它们：\n\n```javascript\n\
  names = new Array(30);\n```\n\n然后你可以给数组分配字符串值：\n\n```javascript\nnames[0] = \"John\
  \ H. Watson\";\nnames[1] = \"Sherlock Holmes\";\n```\n\n与数值数组一样，你也可以在任何可以使用字符串的地方使用字符串数组。例如，以下语句将打印\
  \ `names`数组的前几个字符：\n\n点击此处查看代码图片\n\n```javascript\ndocument.write(names[0].substring(0,4));\n\
  ```\n\n#### 分割字符串\n\nJavaScript 有一个名为 `split` 的字符串方法，用于将字符串分割成部分。要使用此方法，指定要分割的字符串和一个分隔字符：\n\
  \n```javascript\nname = \"John Q. Public\";\nparts = name.split(\" \");\n```\n\n\
  在此示例中，`name` 字符串在空格处被分割，得到三个字符串。这些字符串存储在数组 `parts` 中：\n\n* `parts[0] = \"John\"\
  `\n* `parts[1] = \"Q.\"`\n* `parts[2] = \"Public\"`\n\nJavaScript 还有一个名为 `join`\
  \ 的数组方法，执行相反的操作。此语句将 `parts` 数组重新组合成字符串：\n\n```javascript\nfullname = parts.join(\"\
  \ \");\n```\n\n括号中的值指定分隔数组部分的字符。在这种情况下，使用了空格，生成最终的字符串 `John Q. Public`。如果你没有指定字符，则使用逗号。\n\
  \n#### 排序字符串数组\n\nJavaScript 还包含数组的 `sort` 方法，它返回一个按字母排序的数组版本。例如，以下语句初始化一个包含四个名字的数组并对其排序：\n\
  \n```javascript\nnames[0] = \"Public, John Q.\";\nnames[1] = \"Doe, Jane\";\nnames[2]\
  \ = \"Duck, Daisy\";\nnames[3] = \"Mouse, Mickey\";\nsortednames = names.sort();\n\
  ```\n\n最后一条语句对 `names`数组进行排序并将结果存储在一个新数组 `sortednames` 中。\n\n#### 排序数值数组\n\n由于 `sort`\
  \ 方法按字母顺序排序，它并不适用于数值数组——至少不是以你预期的方式。如果一个数组包含数字 4、10、30 和 200（例如），它会将它们排序为 10, 200,\
  \ 30, 4——完全不对。幸运的是，有一个解决方案：你可以在 `sort` 方法的参数中指定一个函数，该函数将用于比较这些数字。以下代码正确地对数值数组进行了排序：\n\
  \n```javascript\nfunction numbercompare(a,b) {\n```\n\n\n\n\n```javascript\nreturn\
  \ a-b;\n}\n```\n\n`numbers = new Array(30, 10, 200, 4)`\n\n`sortednumbers = numbers.sort(numbercompare)`\n\
  \n此示例定义了一个简单的函数 `numbercompare`，它用于将两个数字相减。当你在 `sort` 方法中指定该函数后，数组将按照正确的数值顺序进行排序：4,\
  \ 10, 30, 200。\n\n### 注意\nJavaScript 期望比较函数在当 `a` 位于 `b` 之前时返回一个负数；如果它们相同则返回 `0`；如果\
  \ `a` 位于 `b` 之后则返回一个正数。这就是为什么在该函数中，你只需要 `a-b` 即可实现数值排序。\n\n为了获得更多使用 JavaScript 字符串和数组功能的经验，你可以创建一个脚本，允许用户输入名称列表并显示排序后的列表。由于这是一个较大的脚本，你应该像第\
  \ 20 中“JavaScript 编程入门”描述的那，创建独立的 HTML 和 JavaScript 文件。首先，`sort.html` 文件将包含脚本所需的\
  \ HTML 结构和表单字段。列表 22.2 显示了 HTML 文档。\n\n**列表 22.2** 排序示例的 HTML 文档\n\n点击此处查看代码图像\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Array Sorting Example</title>\n    <meta name=\"viewport\"\n     \
  \     content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n  \
  \  <h1>Sorting String Arrays</h1>    \n    <p>在下方的字段中输入两个或多个名称，\n    排序后的名称列表将出现在文本区域中。</p>\n\
  \    <form name=\"theform\">\n      Name:\n      <input name=\"newname\"size=\"\
  20\">\n      <input type=\"button\"name=\"addname\"value=\"Add\"\n      onclick=\"\
  SortNames();\">\n      <br>\n      <h2>Sorted Names</h2>\n      <textarea cols=\"\
  60\"rows=\"10\"name=\"sorted\">\n        The sorted names will appear here.\n  \
  \    </textarea>\n    </form>\n    <script src=\"sort.js\"></script>\n  </body>\n\
  </html>\n```\n\n由于脚本位于独立文档中，此文档中的 `<script>` 标签使用 `src` 属性来包含名为 `sort.js` 的 JavaScript\
  \ 文件。该文档定义了一个名为 `theform` 的表单、名为 `newname` 的文本字段、一个 `addname` 按钮以及一个名为 `sorted`\
  \ 的 `<textarea>`。你的脚本将使用这些表单字段作为用户界面。\n\n列表 22.3 提供了排序过程所需的 JavaScript。\n\n**列表\
  \ 22.3** 排序示例的 JavaScript 文件\n\n点击此处查看代码图像\n\n```javascript\n// 初始化计数器和数组\nvar numbernames=0;\n\
  var names = new Array();\n\nfunction SortNames() {\n    // 从文本字段获取名称\n    thename=document.theform.newname.value;\n\
  \    // 将名称添加到数组\n    names[numbernames]=thename;\n    // 计数器加 1\n    numbernames++;\n\
  \    // 对数组排序\n    names.sort();\n    document.theform.sorted.value=names.join(\"\
  \\n\");\n}\n```\n\n脚本通过 `var` 关键字定义两个变量：`numbernames` 是一个每次添加名称时增加的计数器，`names` 数组存储名称。\n\
  \n当你向文本字段中输入名称并点击按钮时，`onclick` 事件处理器会调用 `SortNames` 函数。该函数将文本字段的值存储在变量 `thename`\
  \ 中，然后使用 `numbernames` 作为索引将名称添加到 `names` 数组。接着增加 `numbernames` 以准备下一个名称。\n\n脚本的最后部分对名称排序并显示。首先，使用\
  \ `sort` 方法对名称排序。然后使用 `join` 方法将它们合并。要测试脚本，请将其保存为 `sort.js` 浏览器中加载。结果如图 22.2 所示。\n\
  \n### 函数\n函数是一组可以被视为一个整体的语句。要使用函数，首先需要定义它。\n\n#### 定义函数\n要定义函数，请使用 `function` 关键字后跟函数名。\n\
  \n```javascript\nfunction Greet() {\n  alert(\"Greetings!\");\n}\n```\n\n为了使此函数更灵活，你可以添加*参数*（也称为*形参数*）。这些是函数在每次被调用时接收到的变量。\n\
  \n```javascript\nfunction Greet(who) {\n  alert(\"Greetings, \" + who + \"!\");\n\
  }\n```\n\n\n\n\n你定义了一个函数并将其放入 HTML 文档中。然而，如果你在浏览器中加载列表 22.4，你会发现它除了显示文本“This is\
  \ the body of the page.”之外，什么都没有做。这种动作的缺失是因为函数已经定义好了并准备就绪——但你还没有使用它。\n\n使用函数被称为`调用`（calling）该函数。要调用函数，请将函数名作为脚本中的一个语句，或者作为与事件关联的操作。调用函数时，你需要包含括号以及函数参数的值（如果有的话）。例如，这里有一条调用\
  \ `Greet` 函数的语句：\n\n```javascript\nGreet(\"Fred\");\n```\n\n这告诉 JavaScript 解释器开始处理\
  \ `Greet` 函数中的第一条语句。当你以这种方式调用函数并在括号内提供参数时，你将参数 `\"Fred\"` 传递给该函数。随后，这个 `\"Fred\"\
  ` 的值就会被赋值给函数内部的 `who` 变量。\n\n**注意**\n\n函数可以有多个参数。要定义一个带有多个参数的函数，为每个参数列出一个变量名，并用逗号分隔这些参数。调用函数时，请指定参数的值，并用逗号分隔。\n\
  \n列表 22.5 显示了一个完整的 HTML 文档，其中包含了函数定义以及页面内的几个按钮，这些按钮作为事件关联的操作来调用函数。为了演示函数的用处，我们将调用两次来欢迎两个不同的人——使用两个不同的参数。\n\
  \n**列表 22.5** 完整的函数示例\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\"\
  >\n<head>\n    <meta charset=\"utf-8\">\n    <title>Functions</title>\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n</head>\n\
  <body>\n    <h1>Function Example</h1>\n    <p>Who are you?</p>\n    <button type=\"\
  button\" onclick=\"Greet('Fred');\">I am Fred</button>\n    <button type=\"button\"\
  \ onclick=\"Greet('Ethel');\">I am Ethel</button>\n    <script>\n        function\
  \ Greet(who) {\n            alert(\"Greetings, \" + who + \"!\");\n        }\n \
  \   </script>\n</body>\n</html>\n```\n\n此列表包含两个按钮，每个按钮调用 `Greet` 函数的方式都略有不同——每个调用关联了不同的参数。现在你已经有了一个可以实际执行操作的脚本，尝试将其加载到浏览器中。如果你点击其中一个按钮，你应该会看到类似于图\
  \ 22.3 中的屏幕，该图显示了点击其中一个按钮（在此情况下是 I Ethel）时弹出的警框。\n\n![截图显示了点击按钮时显示警框的操作。](img/22fig03.jpg)\n\
  \n**图 22.3** `Greet` 函数示例的输出，点击了一个按钮。\n\n### 返回值\n\n你在上一个示例中创建的函数在 alert 弹出窗口中向用户显示消息，但函数也可以向调用它的脚本返回一个值。这意味着你可以使用函数来计算数值。作为一个示例，让我们创建一个计算四个数字平均值的函数。按照惯例，你的函数应该以\
  \ `function` 关键字、函数名以及它接受的参数开头。在这里，我们将使用变量名 `a`、`b` 和 `d` 代表要计算平均值的四个数字。这里是函数的第一行：\n\
  \n```javascript\nfunction Average(a,b,d) {\n```\n\n**注意**\n\n我们在函数的第一行包含了左大括号 `{`。这常用风格，但你也可以将大括号放在下一行或单独占一行。接下来，函数需要计算四个参数的平均值。你可以通过将它们相加然后除以参数的数量（在这种情况下为\
  \ 4）来计算。因此，这里是函数的下一行：\n\n```javascript\nvar result = (a + b + d) / 4;\n```\n\n这条语句创建了一个变量\
  \ `result`，并通过将四个数字相加然后除以 4 来计算赋值给 `result` 的值。（括号是必要的，以确保 JavaScript 绝对先在执行除法之前执行加法。）要将此结果传回调用函数的脚本，你需要使用\
  \ `return` 关键字。这是函数的最后部分：\n\n```javascript\nreturn result;\n}\n```\n\n列表 22.6 显示了\
  \ HTML 文档中完整的 `Average` 函数。该 HTML 文档还由于 `<body>` 部分包含了一个小型脚本，该脚本调用 `Average` 函数并显示结果。\n\
  \n**列表 22.6** HTML 文档中的 `Average` 函数\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Function Example:\
  \ Average</title>\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n    <script>\n        function Average(a,b,d) {\n            var result = (a\
  \ + b + d) / 4;\n            return result;\n        }\n    </script>\n</head>\n\
  <body>\n    <h1>Function Example: Average</h1>\n    <p>The following is the result\
  \ of the function call.</p>\n    <p>\n        <script>\n            var score =\
  \ Average(3,4,5,6);\n            document.write(\"The average is: \" + score);\n\
  \        </script>\n    </p>\n</body>\n</html>\n```\n\n列表 22.6 中的脚本是一个示例，如果函数没有加载在文档的\
  \ `<head>` 中，它将无法工作。这个脚本是非阻塞的（正如你在之前的课程中学到的），但要使其变为非侵入式需要更高级的 JavaScript。\n\n如果你在网络浏览器中打开列表\
  \ 22.6 中的脚本，你将在屏幕上看到打印出的平均值，这归功于 `document.write` 方法，如图 22.4 所示。\n\n![截图说明了 Average\
  \ 函数的使用。主内容区域的文本显示为 The following is the result of the function call，结果语句显示为 The\
  \ average is: 4.5。](img/22fig04.jpg)\n\n**图 22.4** `Average` 函数示例的输出。\n\n你可以在调用函数时变量，如列表\
  \ 22.6](#ch22.xhtml_ch22list6)所示。\n\n```javascript\nvar score = Average(3,4,5,6);\n\
  document.write(\"The average is: \" + score);\n```\n\n### 创建对象\n\n当你创建一个数组时，你使用以下\
  \ JavaScript 语句：\n\n\n\n\n\n```javascript\nscores = new Array(4);\n```\n\n`new`\
  \ 关键字告诉 JavaScript 解释器使用内置功能来创建一个 `Array` 类型的对象。对象拥有一个或多个 `properties`（属性）——本质上，属性是存储在对象内部带有值的变量。例如，在第\
  \ 21 节中，你学习了可以使用 `location.href` 属性来获取当前文档的 URL，因为该值（URL）被赋值给该属性，就像值赋值给变量一样。`href`\
  \ 属性是 DOM 中 `location`对象的属性之一。\n\n你还使用过 `String` 对象的 `length` 属性，如下例所示：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar stringtest = \"This is a test.\";\n\ndocument.write(stringtest.length);\n\
  ```\n\n再次强调，与变量一样，每个对象属性都有一个 `value`（值）。要读取属性的值，你只需要在任何表达式中引用对象名和属性名，并用句号隔开。例如，你刚刚看到的示例使用了\
  \ `stringtest.length`。你可以通过使用 `=` 运算符更改属性的值，就像你可以更改赋值给变量的值一样。下面的示例通过将新变量赋值给 `location.href`\
  \ 属性，将浏览器发送到新的 URL：\n\n点击此处查看代码图像\n\n```javascript\nlocation.href=\"http://www.google.com/\"\
  ;\n```\n\n### Note\n对象也可以是另一个对象的属性。这被称为子对象。\n\n## 理解方法\n\n除了属性之外，每个对象都可以拥有一个或多个\
  \ `methods`（方法）。这些是处理对象数据的函数。例如，正如你在第 21 节中学习的那样，以下 JavaScript 语句会重新加载当前文档：\n\n\
  ```javascript\nlocation.reload();\n```\n\n当你使用 `reload` 方法时，你正在使用 `location` 对象的一个方法。与其他函数一样，方法可以接受括号中的参数，并且可以返回值。JavaScript\
  \ 中的每个对象类型都有自己的内置方法列表。例如，可以在此处找到 Array 对象的内置方法列表：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/prototype#Methods](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/prototype#Methods)。\n\
  \n## 使用对象简化脚本编写\n\n尽管 JavaScript 的变量和数组提供了存储数据的多种方式，但有时你需要更复杂的结构，这时对象就很有用了。例如，假设你正在编写一个处理名片数据库的脚本，该数据库包含各种人的姓名、地址和电话号码。\n\
  \n如果你使用普通变量，你需要为数据库中的每个人 person 创建几个独立的变量：一个姓名变量、一个地址变量等等。这会非常困惑，更不用说定义起来非常冗长。\n\
  \n数组会改善这种情况——但只是小幅改善。你可以有一个 `names` 数组、一个 `addresses` 数组和一个电话号码数组。数据库中的每个人在每个数组中都会有一个条目。这比拥有许多单独命名的变量要方便，但仍然并不完美。\n\
  \n通过对象，你可以让存储数据库的变量在逻辑上与它们应该代表的物理名片保持。每个人都可以由一个新的 `Card` 对象来表示，该对象将包含姓名、地址和电话号码的属性。你甚至可以为对象添加方法来显示或处理这些信息，这正是使用对象的真正威力所在之处。\n\
  \n在接下来的章节中，你将使用 JavaScript 创建一个 `Card` 对象以及一些属性和方法。在本节的晚些时候，你将在脚本中使用 `Card` 对象，该脚本将用于显示你通过对象创建的数据存储中多个成员的信息。\n\
  \n## 定义对象\n\n创建对象的第一步是为它及其属性命名。在这种情况下，你应该将你的对象命名为 `Card`，它将具有以下属性：\n\n*   ![Image](img/arrow.jpg)\
  \ `name`\n*   ![Image](img/arrow.jpg) `email`\n*   ![Image](img/arrow.jpg) `address`\n\
  *   ![Image](img/arrow.jpg) `phone`\n\n要在 JavaScript 程序中使用此对象，你需要创建一个函数来创建 `Card`\
  \ 对象的新实例。这个函数被称为对象的 `constructor`（构造函数）。以下是 `Card` 对象的构造函数：\n\n点击此处查看代码图像\n\n```javascript\n\
  function Card(name,email,address,phone) {\n    this.name = name;\n    this.email\
  \ = email;\n    this.address = address;\n    this.phone = phone;\n}\n```\n\n构造函数是一个简单的函数，它接受参数来初始化新对象并将它们赋值给相应的属性。你可以将其想象成为对象设置一个模板。特别是\
  \ `Card` 函数接受从任何调用它的语句中的多个参数，然后将这些参数赋值为对象的属性。因为该函数名为 `Card`，所以创建的对象就是 `Card` 对象。\n\
  \n注意 `this` 关键字。每当你创建一个对象定义时，都会使用它。\n\n### 定义对象方法\n\n接下来除了属性外，每个对象都可以拥有一个或多个 `methods`。这些是处理对象数据的函数。例如，正如你在第\
  \ 21 节中学习的那样，以下 JavaScript 语句会重新加载当前文档：\n\n```javascript\nlocation.reload();\n```\n\
  \n当你使用 `reload` 方法时，你正在使用 `location` 对象的一个方法。与其他函数一样，方法可以接受括号中的参数，并且可以返回值。JavaScript\
  \ 中的每个对象类型都有自己的内置方法列表。例如，可以在此处找到 Array 对象的内置方法列表：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/prototype#Methods](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/prototype#Methods)。\n\
  \n## 定义对象方法（续）\n\n接下来，你需要创建一个方法来处理当前对象。使用 `this` 来引用当前对象。以下是 `printCard` 的函数定义：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction printCard() {\n    var name_line = \"Name:\
  \ \" + this.name + \"<br>\\n\";\n    var email_line = \"Email: \" + this.email +\
  \ \"<br>\\n\";\n    var address_line = \"Address: \" + this.address + \"<br>\\n\"\
  ;\n    var phone_line = \"Phone: \" + this.phone + \"<hr>\\n\";\n    document.write(name_line,\
  \ email_line, address_line, phone_line);\n}\n```\n\n你最后需要做的是让 `printCard` 成为 `Card`\
  \ 对象定义的一部分。添加的语句看起来像另一个属性定义。这里是修改后的函数定义：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ Card(name,email,address,phone) {\n    this.name = name;\n    this.email = email;\n\
  \    this.address = address;\n    this.phone = phone;\n    this.printCard = printCard;\n\
  }\n```\n\n## 创建对象实例\n\n现在你可以使用刚刚创建的对象定义和方法了。要使用对象定义，你使用 `new` 关键字来创建一个新对象。这就是你已经用于创建\
  \ `Date` 和 `Array` 对象时使用的关键字。以下语句创建一个名为 `tom` 的新 `Card` 对象：\n\n点击此处查看代码图像\n\n```javascript\n\
  tom = new Card(\"Tom Jones\", \"tom@jones.com\",\n```\n\n\n\n\n\n```javascript\n\
  \"123 Elm Street, Sometown ST 77777\",\n\"555-555-9876\");\n```\n\n如你所见，创建一个对象非常简单。你只需要调用\
  \ `Card` 函数（即对象的定义），并按照你最初定义的顺序输入所需的属性（在本例中，参数为 `name`、`email`、`address`、`phone`）。\n\
  \n执行此语句后，你将拥有一个新对象来存储 Tom 的信息。这个现在命名为 `tom` 的新对象被称为 `Card` 对象的一个 `instance`（实例）。就像程序中可以有多个字符串变量一样，你定义的对象也可以有多个实例。\n\
  \n与其使用 `new` 关键字为一张卡片指定所有信息，不如在事后为其分配属性。例如，以下脚本创建了一个名为 `holmes` 的空 `Card` 对象，然后为其分配了属性：\n\
  \n点击此处查看代码图片\n\n```javascript\nholmes = new Card();\nholmes.name = \"Sherlock Holmes\"\
  ;\nholmes.email = \"sherlock@holmes.com\";\nholmes.address = \"221B Baker Street\"\
  ;\nholmes.phone = \"555-555-3456\";\n```\n\n在你创建 `Card` 对象的实例后，使用上述任一种方法，你都可以使用\
  \ `printCard` 方法来显示它的信息。例如，此语句显示了 `tom` 卡片的属性：\n\n```javascript\ntom.printCard();\n\
  ```\n\n现在，你已经创建了一个用于存储名片的新对象以及一个打印它们的方法。作为对对象、属性、函数和方法的最后演示，你现在将在网页中使用此对象来显示几张卡片的数据。\n\
  \n你的脚本需要包含 `printCard` 的函数定义，以及 `Card` 对象的函数定义。然后你将创建三张卡片并在文档主体中打印它们。在此示例中，你将使用\
  \ de HTML 和 JavaScript 文件。列表 22.7 显示了完整的脚本。\n\n### 列表 22.7 使用 `Card` 对象的示例脚本\n\n\
  点击此处查看代码图片\n\n```javascript\n// 定义函数\nfunction printCard() {\n    var name_line\
  \ = \"<strong>Name: </strong>\" + this.name + \"<br>\\n\";\n    var email_line =\
  \ \"<strong>Email: </strong>\" + this.email + \"<br>\\n\";\n    var address_line\
  \ = \"<strong>Address: </strong>\" + this.address + \"<br>\\n\";\n    var phone_line\
  \ = \"<strong>Phone: </strong>\" + this.phone + \"<hr>\\n\";\n    document.write(name_line,\
  \ email_line, address_line, phone_line);\n}\n\nfunction Card(name,email,address,phone)\
  \ {\n    this.name = name;\n    this.email = email;\n    this.address = address;\n\
  \    this.phone = phone;\n    this.printCard = printCard;\n}\n\n// 创建对象\nvar sue\
  \ = new Card(\"Sue Suthers\",\n                   \"sue@suthers.com\",\n       \
  \            \"123 Elm Street, Yourtown ST 99999\",\n                   \"555-555-9876\"\
  );\n\nvar fred = new Card(\"Fred Fanboy\",\n                   \"fred@fanboy.com\"\
  ,\n                   \"233 Oak Lane, Sometown ST 99399\",\n                   \"\
  555-555-4444\");\n\nvar jimbo = new Card(\"Jimbo Jones\",\n                    \
  \ \"jimbo@jones.com\",\n                     \"233 Walnut Circle, Anotherville ST\
  \ 8899\",\n                     \"555-555-1344\");\n\n// 现在打印它们\nsue.printCard();\n\
  fred.printCard();\njimbo.printCard();\n```\n\n注意，`printCard` 函数经过稍微修改以使效果更好，标签使用了粗体显示。要准备使用此脚本，请将其保存为\
  \ `cards.js`。接下来，你需要在简单的 HTML 文档中包含 `cards.js` 脚本。列表 22.8 显示了此对应的 HTML 文档。\n\n###\
  \ 列表 22.8 `Card` 对象的 HTML 文件\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>JavaScript Cards</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  </head>\n<body>\n    <h1>JavaScript Cards</h1>\n    <p>External script coming up...</p>\n\
  \    <script src=\"cards.js\"></script>\n    <p>External script output has ended.</p>\n\
  </body>\n</html>\n```\n\n要测试完整脚本，请将此 HTML 文档保存到与 `cards.js` 文件相同的目录中，然后在浏览器中加载该\
  \ HTML 文档。图 22.5 显示了此示例在浏览器中的外观。\n\n![截图显示了使用 JavaScript 渲染的名片输出。页面主体列出了三个带有 Name、Email\
  \ 和 Phone 字段的三条记录。在两条记录之间打印了一条横线。](img/22fig05.jpg)\n\n图 22.5 显示了名片示例的输出。\n\n###\
  \ 扩展内置对象\n\nJavaScript 包含一项功能，允许你扩展内置对象的定义。例如，如果你认为 `String` 对象不符合你的需求，你可以通过添加新属性或方法来扩展它。这可能非常有用，例如当你想要创建一个使用许多字符串并以独特方式处理这些字符串的大型脚本时。\n\
  \n你可以通过 `prototype` 关键字向现有对象同时添加属性和方法。（`prototype` 是对象定义或构造函数的另一个名称）。`prototype`\
  \ 关键字允许你在构造函数之外更改对象的定义。\n\n举例来说，你可以向 `String` 对象的定义中添加一个方法。你将创建一个名为 `heading` 的方法，该方法将字符串转换为\
  \ HTML 标题。以下语句定义了一个名为 `myTitle` 的字符串：\n\n点击此处查看代码图片\n\n```javascript\nvar myTitle\
  \ = \"Home Page\";\n```\n\n此语句将 `myTitle` 字符串作为 HTML 1 级标题输出（`<h1>`）：点击此处查看代码图片\n\
  \n```javascript\ndocument.write(myTitle.heading(1));\n```\n\n列表 22.9 为 `String`\
  \ 对象定义添加了一个 `heading` 方法，该方法将字符串显示为标题。\n\n### 列表 22.9 为 `String` 对象添加方法\n\n点击此处查看代码图片\n\
  \n```javascript\n<!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
  utf-8\">\n    <title>Test of Method</title>\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1\">\n</head>\n<body>\n    <script>\n        function\
  \ addHeading(level) {\n            var html = \"h\" + level;\n            var text\
  \ = this.toString();\n            var opentag = \"<\" + html + \">\";\n        \
  \    var closetag = \"</\" + html + \">\";\n            return opentag + text +\
  \ closetag;\n        }\n        String.prototype.heading = addHeading;\n       \
  \ document.write(\"This is a heading 1\".heading(1));\n        document.write(\"\
  This is a heading 2\".heading(2));\n        document.write(\"This is a heading 3\"\
  .heading(3));\n    </script>\n</body>\n</html>\n```\n\n### 注意事项\n\n列表 22.9 中的代码并不是非侵入性的，也不特别具有可访问性。你应该将其作为\
  \ `heading` 方法工作原理的示例，但在实际内容中使用该脚本并不是好主意。\n\n\n\n\n\n![一张截图显示了一个页面上有三个“This is a\
  \ heading”语句的实例，编号分别为 1、2 和 3，一个接一个排列。文本的字体和粗体样式从上到下逐渐减小。](img/22fig06.jpg)\n\n\
  **图 22.6** 显示动态标题示例。\n\n### 使用 `Math` 对象\n\n`Math` 对象是一个内置的 JavaScript 对象，包含了数学常数和函数。你永远不需要创建\
  \ `Math` 对象，因为它在任何 JavaScript 程序中都会自动存在。`Math` 对象的属性代表数学常数，而它的方法则是数学函数。如果你正在以任何方式处理数字，`Math`\
  \ 对象都将是你最好的朋友。\n\n#### 四舍五入与截断\n\n`Math` 对象三个三个实用的方法允许你对数值进行向上舍入或向下舍入处理：\n\n* `Math.ceil()`：将数字向上舍入到下一个整数\n\
  * `Math.floor()`：将数字向下舍入到下一个整数\n* `Math.round()`：将数字四舍五入到最接近的整数\n\n这些方法都将要舍入的数字作为唯一参数。你可能会注意到缺少了一项功能：对特定小数位进行舍入的能力（例如金额）。幸运的是，你可以轻松地模拟这种操作，如下所示的将数字舍入到两位小数的简单函数：\n\
  \n```javascript\nfunction round(num) {\n    return Math.round(num * 100) / 100;\n\
  }\n```\n\n此处显示的函数将值乘以 100 以移动小数点，然后将数字四舍五入到最接近的整数。最后，将值除以 100 以将小数点恢复到原始位置。\n\n\
  #### 生成随机数\n\n`Math` 对象常用的方法之一是 `Math.random`，它生成一个随机数。该方法不需要任何参数。它返回的是 0 到 1 之间的随机小数。你通常需要一个\
  \ 1 到某个值之间的随机数。你可以使用这个通用随机函数生成这样的数字：\n\n```javascript\nfunction rand(num) {\n  \
  \  return Math.floor(Math.random() * num) + 1;\n}\n```\n\n此函数将随机数乘以 `num` 参数中指定的值，然后使用\
  \ `Math.floor` 方法将其转换为 1 到该数字之间的整数。\n\n#### 其他 Math 方法\n\n`Math` 对象包含了许多你已经看过的之外的方法。例如，`Math.sin()`\
  \ 和 `Math.cos()` 计算正弦和余弦。`Math` 对象还包含了数学常数的属性，例如 `Math.PI`。你可以在此处查看 `Math` 对象所有可用内置方法的列表：[`developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Math#Methods`](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Math#Methods)。\n\
  \n#### 使用 Math 方法\n\n`Math.random` 方法生成一个 0 到 1 之间的随机数。然而，对于计算机来说，生成真正的随机数几乎是不可能的（对于人类来说也很难，这就是为什么发明了骰子）。如今今天的计算机在生成随机数方面表现尚可，但\
  \ JavaScript 的 `Math.random` 函数到底如何？测试它的方法是生成许多随机数并计算所有数字的平均值。\n\n从理论上讲，所有生成数字的平均值应该在\
  \ .55，或者在 0 和 1 的中间。你生成的随机值越多，平均值就应该越接近这个中间值。为了真正进行此测试，你可以创建一个脚本，通过生成 5000 个随机数并计算它们的平均值来测试\
  \ JavaScript 的随机数函数。\n\n这个示例将使用 `for` 循环，你将在下一节中学习更多内容），这是一个足够简单的示例，你应该能够跟上。在这种情况下，`for`\
  \ 循环将生成随机数。你会对 JavaScript 执行此操作的速度感到惊讶。\n\n要开始你的脚本，初始化一个名为 `total` 的变量。该变量将存储所有随机值的运行总和，因此它从\
  \ 0 开始非常重要：\n\n```javascript\nvar total = 0;\n```\n\n接下来，开始一个执行 5000 次的循环。使用 `for`\
  \ 循环是因为你希望它执行固定次数（在本例中为 5,000 次）：\n\n```javascript\nfor (i=1; i<=5000; i++) {\n\
  \    // ...\n}\n```\n\n在 `for` 循环内部，你需要创建一个随机数并将其值加到 `total` 变量。以下是执行此操作并继续下一次迭代的语句：\n\
  \n```javascript\nvar num = Math.random();\ntotal += num;\n```\n\n取决于你计算机的速度，可能需要几秒钟来生成那\
  \ 5000 个随机数。为了确保程序正在运行，你可以让脚本在每生成 1000 个数字后显示状态消息：\n\n```javascript\nif (i % 1000\
  \ == 0) {\n    document.write(\"Generated \" + i + \" numbers...<br>\");\n}\n```\n\
  \n前一个代码中的 `%` 符号是取模运算符，它会给你一个数字除以另一个数字后的余数。在这种情况下，它被用于寻找 1000 的倍数。\n\n脚本的最后部分通过将\
  \ `total` 值除以 5000 来计算平均值。它还将将平均值四舍五入到三位小数：\n\n#### 列表 22.10 测试函数的脚本\n\n```html\n\
  <!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Math\
  \ Example</title>\n</head>\n<body>\n    <h1>Math Example</h1>\n    <p>JavaScript\
  \ 的随机数有多随机？让我们来看看吧。</p>\n    <script>\n        var total = 0;\n        for (i=1;\
  \ i<=5000; i++) {\n            var num = Math.random();\n            total += num;\n\
  \            if (i % 1000 == 0) {\n                document.write(\"Generated \"\
  \ + i + \" numbers...<br>\");\n            }\n        }\n        var average = total\
  \ / 5000;\n        average = Math.round(average * 1000) / 1000;\n        document.write(\"\
  <h2>Average of 5000 numbers is: \" + average + \"</h2>\");\n    </script>\n</body>\n\
  </html>\n```\n\n要测试脚本，请将 HTML 文档加载到浏览器中。经过短暂延迟，你应该看到结果。如果结果接近 .5，说明数字是相当随机的。我的结果是\
  \ .502，如图 22.7 所示。如果你刷新页面，你可能会得到不同的结果，但它们都应该在 .5 左右。\n\n注意\n\n此处使用的平均值被称为算术平均值。这种平均值并不是测试随机性的完美方法。实际上，它只测试了数字在\
  \ .5 以上和 .5 左右的分布。\n\n\n\n\n\n`Date` 对象是一个内置的 JavaScript 对象，它可以让你更方便地处理日期和时间。你可以在需要存储日期的任何时候创建一个\
  \ `Date` 对象，并使用 `Date` 对象的方法来处理该日期。\n\n你已经在第 4 节中带有时间和日期的脚本中遇到过一个 `Date` 对象的示例。`Date`\
  \ 对象本身没有任何属性。若要设置或从 `Date` 对象中获取值，请使用下一节中描述的方法。\n\n### 注意\nJavaScript 日期被存储为自 1970\
  \ 年 1 月 1 日午夜以来的毫秒数。这个日期被称为 `epoch`（纪元）。1970 年之前的日期在早期版本中是不被允许的，但现在用负数表示。\n\n###\
  \ 创建 `Date` 对象\n你可以使用 `new` 关键字来创建一个 `Date` 对象。在创建对象时，你还可以可选地指定要存储在对象中的日期。你可以使用以下任何一种格式：\n\
  \n点击此处查看代码图片\n\n```\nbirthday = new Date();\nbirthday = new Date(\"November 1, 2014\
  \ 08:00:00\");\nbirthday = new Date(11,1, 2014);\nbirthday = new Date(11,1,2014,\
  \ 8, 0, 0);\n```\n\n你可以根据你想要设置的值选择这些格式中的任何一种。如果你不使用任何参数（如第一个示例所示），当前日期将存储在对象中。然后你可以使用下一节描述的\
  \ `set` 方法来设置值。\n\n### 设置 `Date` 值\n各种 `set` 方法允许你将 `Date` 对象的组件设置为值：\n\n* ![Image](img/arrow.jpg)\
  \ `setDate`——设置月份中的某一天。\n* ![Image](img/arrow.jpg) `setMonth`——设置月份，从 `0` 代表一月到\
  \ `11` 代表十二月\n* ![Image](img/arrow.jpg) `setFullYear`——设置年份。\n* ![Image](img/arrow.jpg)\
  \ `setTime`——通过指定自 1970 年 1 月 1 日以来的毫秒数来设置时间（以及日期）\n* ![Image](img/arrow.jpg) `setHours`,\
  \ `setMinutes` 和 `setSeconds`——设置时间\n\n例如，以下语句将名为 `holiday` 的 `Date` 对象的年份设置为 2018：\n\
  \n```\nholiday.setFullYear(2018);\n```\n\n### 读取 `Date` 值\n你可以使用 `get` 方法从 `Date`\
  \ 对象中获取值。这是获取这些值的唯一方法，因为它们不能作为属性可用。以下是用于日期的可用 `get` 方法：\n\n* ![Image](img/arrow.jpg)\
  \ `getDate`——获取月份中的某一天\n* ![Image](img/arrow.jpg) `getMonth`——获取月份\n* ![Image](img/arrow.jpg)\
  \ `getFullYear`——获取四位年份\n* ![Image](img/arrow.jpg) `getTime`——获取自 1970 年 1 月 1 日以来的毫秒数时间（以及日期）\n\
  * ![Image](img/arrow.jpg) `getHours`, `getMinutes`, `getSeconds` 和 `getMilliseconds`——获取时间的组件\n\
  \n### 注意\n除了需要四位年份的 `setFullYear` 和 `getFullYear` 之外，JavaScript 还包含了使用两位数年份值的 `setYear`\
  \ 和 `getYear` 方法。\n\n### 处理时区\n最后，有几个函数可以帮助你的 `Date` 对象与本地时间值和时区配合：\n\n* ![Image](img/arrow.jpg)\
  \ `getTimeZoneOffset`——给你本地时区相对于 UTC（协调世界时，基于旧的格林尼治标准时间标准）的偏移。在这种情况下，本地指的是浏览器所在地。（当然，这只有在用户准确设置了系统时钟的情况下才有效。）\n\
  * ![Image](img/arrow.jpg) `toUTCString`——使用 UTC 将 `date` 对象的时间值转换为文本。\n* ![Image](img/arrow.jpg)\
  \ `toLocalString`——使用本地时间将 `date` 对象的时间值转换为文本。\n\n除了这些基础函数外，JavaScript 还包含了之前描述的几个函数的\
  \ UTC 版本。这些版本与普通命令相同，但使用的是 UTC 而不是本地时间：\n\n* ![Image](img/arrow.jpg) `getUTCDate`——获取\
  \ UTC 时间的月份中的某天\n* ![Image](img/arrow.jpg) `getUTCDay`——获取 UTC 时间的星期\n* ![Image](img/arrow.jpg)\
  \ `getUTCFullYear`——获取 UTC 时间的四位年份\n* ![Image](img/arrow.jpg) `getUTCMonth`——返回\
  \ UTC 时间的月份\n* ![Image](img/arrow.jpg) `getUTCHours`, `getUTCMinutes`, `getUTCSeconds`\
  \ 和 `getUTCMilliseconds`——返回 UTC 时间的组件\n* ![Image](img/arrow.jpg) `setUTCDate`,\
  \ `setUTCFullYear`, `setUTCMonth`, `setUTCHours`, `setUTCMinutes`, `setUTCSeconds`\
  \ 和 `setUTCMilliseconds`——设置 UTC 时间\n\n### 在日期格式之间转换\n有两个特殊方法允许你在日期格式之间转换：\n\n*\
  \ ![Image](img/arrow.jpg) `Date.parse`——将日期字符串（例如 `March 1, 2018`）转换为 `Date` 对象\n\
  * ![Image](img/arrow.jpg) `Date.UTC`——将日期字符串转换为 `Date` 对象（自 1970 年以来）\n\n### 总结\n\
  在本节中，我们关注了变量以及 JavaScript 如何处理它们。你学习了如何命名变量、如何声明变量以及局部变量与全局变量之间的区别。你学习了 JavaScript\
  \ 支持的数据类型——字符串和数组，并探索了对它们进行操作的方法，例如转换字符串和排序数组。\n\n你学习了 JavaScript 的几个重要特性。首先，你学习了如何使用函数以及使用它们的返回值。作为这些对象特性的示例，你深入了解了\
  \ `Math` 和 `Date` 内置对象。\n\n### 问答\nQ：`var` 关键字的重要性是什么？我应该总是用它声明变量吗？\n答：你只需要在函数中使用\
  \ `var`。但如果你不确定，始终使用它是安全的。这有助于保持脚本组织且无错误。\n\nQ：是否有理由使用 `var` 关键字创建一个与全局变量同名的局部变量？\n\
  答：不是故意的。使用 `var` 的主要目的是避免与未知的全局变量冲突。例如，你将来可能会添加全局变量，或者在页面上添加另一个使用相似变量名的脚本。这在大型、复杂的脚本中是一个更常见的问题。\n\
  \nQ：布尔变量有什么用？\n答：通常在脚本中，你可能需要一个变量来指示某事是否发生——例如用户输入的电话号码格式是否正确。布尔变量非常适合这种情况；它们在处理条件时也有用，正如我们在[第\
  \ 23 节]中所看到的。\n\nQ：我可以在数组中存储其他类型的数据吗？例如，我可以有一个日期数组吗？\n答：完全可以。JavaScript 允许在数组中存储任何数据类型。\n\
  \n\n\n\n## A\n\n**A.** 是的。首先，按照通常的方法创建对象定义，并定义一个具有所需数量元素的数组。然后，为数组的每个元素分配一个新对象（例如，`cardarray[1]\
  \ = new Card();`）。你可以像下一节描述的那样，使用循环来一次性为整个数组分配对象。\n\n**Q. 我可以修改对象的所有属性吗？**\n\n**A.**\
  \ 对于自定义对象，是可以的——但这与内置对象和 DOM 对象有所不同。例如，你可以使用 `length` 属性来查找字符串的长度，但它是一个`只读属性`，无法修改。\n\
