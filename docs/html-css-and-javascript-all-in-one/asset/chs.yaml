  \ | 注册商标符号 |\n| ° | `&#176;` | `&deg;` | 度数符号 |\n| ± | `&#177;` | `&plusmn;` | 正负号\
  \ |\n| ² | `&#178;` | `&sup2;` | 上标 2 |\n| ³ | `&#179;` | `&sup3;` | 上标 3 |\n| ·\
  \ | `&#183;` | `&middot;` | 中点 |\n| ¹ | `&#185;` | `&sup1;` | 上标 1 |\n| ¼ | `&#188;`\
