  \n\n\n\n## 水平导航\n\n**图 11.13** 使用行内列表元素创建具有功能性但不一定美观的水平导航。（感谢：Kjpargeter/Shutterstock）\n\
  \n此列表的显示修改完全通过 CSS 实现；HTML 内部的内容结构已经设定。要实现所需的显示效果，请使用以下 CSS：\n\n点击此处查看代码图像\n\n```css\n\
  nav {\n   float:left;\n   margin: 85px 0px 0px 0px;\n   width: 400px;\n   background-color:\
  \ #628794;\n   border: 1px solid black;\n}\n```\n\n首先，对 `<nav>` 元素进行宽度修改，使其显示背景颜色和边框，并使用\
  \ 85 像素的顶部外边距（使其显示在 Logo 附近）。\n\n`<ul>` 的定义与列表 11.5 相同，但外边距（margin）和内边距（padding）发生了变化：\n\
  \n```css\nnav ul {\n   margin: 0px;\n   padding: 0px;\n   list-style: none;\n  \
  \ display: inline;\n}\n```\n\n`<li>` 的定义与列表 11.5 相同，但它被赋予了 `1.8em` 的 `line-height`\
  \ 值：\n\n```css\nnav li {\n   display: inline;\n   line-height: 1.8em;\n}\n```\n\n\
  链接样式与垂直导航中使用的样式相似；这些条目具有不同的内边距值，但颜色和字体大小保持不变：\n\n点击此处查看代码图像\n\n```css\nnav ul li\
  \ a:link, nav ul li a:visited {\n   font-size: 10pt;\n   font-weight: bold;\n  \
  \ text-decoration: none;\n   padding: 7px 10px 7px 10px;\n   background-color: #628794;\n\
  \   color: #ffffff;\n}\n\nnav ul li a:hover, nav ul li a:active {\n   font-size:\
  \ 10pt;\n   font-weight: bold;\n   text-decoration: none;\n   padding: 7px 10px\
  \ 7px 10px;\n   background-color: #c6a648;\n   color: #000000;\n}\n```\n\n将这些样式组合在一起，产生了图\
  \ 11.14 所示的效果。\n\n![在截图中，ACME Widgets LLC 的网页内容作为列表水平导航的示例。列表项目现在出现在封面图像下方（但居中），并排堆叠。项目具有单一的背景颜色填充。](img/11fig14.jpg)\n\
  \n**图 11.14** 创建具有某种风格的水平导航。（感谢：Kjpargeter/Shutterstock）\n\n当用户鼠标悬停在导航元素上时，背景色和文本颜色的变化与在本节早些时候用户悬停在垂直导航菜单上时相同。同样，就像垂直导航菜单一样，你可以使用嵌套列表在你的水平菜单中产生下拉功能。自己尝试一下吧！\n\
  \n### 总结\n\n本节从列表和列表元素如何受内边距（padding）和外边距（margin）样式的影响开始。你首先学习了与相关的默认内边距以及如何控制该内边距。接下来，你学习了如何修改内边距和外边距值，以及如何将列表标记放置在列表项目内部或外部，以便开始思考样式和列表如何影响你的整体网站设计。最后，你学习了如何利用列表和列表元素创建纯\
  \ HTML 和 CSS 图像映射，从而减少了切割链接图像或使用 `<map>` 元素的需求。\n\n在学习了所谓的“跳出（列表）框框思考”之后，你学习了如何使用无序列表在网站内生成水平或垂直导航。通过使用\
  \ CSS 而不是图形，你在网站的显示和维护方面具有更大的灵活性。在本节中，你学到只需在样式表中输入几条目，就可以将普通的下划线文本链接转换为带有边框、背景颜色和其他文本样式的区域。此外，你还学习了如何在菜单中展示嵌套列表。\n\
  \n### 问答\n\n**Q. 创建 CSS 图像映射似乎要做很多工作。`<map>` 元素那么糟糕吗？**\n\n**A.** `<map>` 元素一点也不糟糕，它是合法的\
  \ HTML5。然而，客户端图像映射中用坐标的确定可能很困难，特别是在没有图形软件或专门用于创建客户端图像映射的软件的情况下。CSS 版本为定义和显示可点击区域提供了更多选项，我们在这里只看到了其中一种。\n\
  \n**Q. 我可以使用嵌套列表来产生下拉功能吗？**\n\n**A.** 是的，就像垂直导航菜单一样，你可以使用嵌套列表在水平菜单中产生下拉功能。\n\n##\
  \ 工作坊\n\n工作坊包含测验题和活动，帮助你巩固材料。\n\n### 测验\n\n1. **`list-style-position` 的 `inside`\
  \ 和 `outside` 值之间的区别是什么？哪一个是是默认值？**\n2. **值为 `none` 的 `list-style` 是否产生结构化列表（有序或无序）？**\n\
  3. **在创建导航时，可以使用多少层嵌套列表？**\n4. **在创建任何类型的导航列表时，`a` 选择器的伪类可以使用相同的值吗？**\n5. **大多数浏览器默认对\
  \ `<ul>` 和 `<ol>` 应用什么样式？**\n6. **测试列表的外边距和内边距的一种好方法是什么？**\n7. **在从链接列表创建图像映射时，如何隐藏列表内容？**\n\
  8. **在列表构建的图像映射中，图像位于何？**\n9. **导航列表与普通列表在哪些方面有所不同？**\n10. **创建水平列表需要做的唯一一件事是什么？**\n\
  \n\n\n\n\n**3.** 从技术上讲，你可以根据需要无限层级地嵌套列表。但从易用性的角度来看，你*想要*用于嵌套列表的层数是有限制的。三层通常是极限。超过这个层数，你可能会面临创建一个结构混乱的网站的风险，或者仅仅给用户提供了比他们任何时候需要的更多的选项。\n\
  \n**4.** 然如此，但你可能会面临用户无法意识到你精美的菜单确实是菜单的风险（因为鼠标操作时不会出现任何视觉显示）。\n\n**5.** 大多数浏览器会对列表应用\
  \ 40 像素的左内边距，代码为 `padding-left: 40px;`。\n\n**6.** 使用 CSS 来设置列表和列表项的背景颜色。\n\n**7.**\
  \ 使用 `text-indent:-1000em;` 将文本推向屏幕左侧。\n\n**8.** 图像是列表元素本身的背景。\n\n**9.** 导航列表通过改变光标、改变元素周围区域以及将其与普通内容区分来，清楚地告诉用户应该与其进行交互。\n\
  \n**10.** 要创建一个水平列表，请将 `<ul>` 和 `<li>` 元素的 `display` 属性设置为 `inline`。\n\n### 练习\n\
  \n*   ![Image](img/arrow1.jpg) 找一张图片，并尝试使用本节所示的技术进行区域映射。选择一张包含可以使用热点或点击区域的图片，这些区域可以通向你网站上的其他页面或他人的网站。然后创建\
  \ HTML 和 CSS 来定义点击区域以及它们应该指向的 URL。\n\n*   ![Image](img/arrow1.jpg) 使用本节所示的多级垂直列表技术，为本节末尾创建的垂直列表添加子导航项。\n\
  \n*   ![Image](img/arrow1.jpg) 查看网站上使用的许多 CSS 导航示例，并找到一些看起来很复杂的动作。使用网络浏览器的“查看源代码”功能，查看这些网站使用的\
  \ CSS，并尝试为自己实现类似的内容。\n\n## 第 12 节\n\n## 使用现代 CSS 技术创建布局\n\n**在本节中你将学习：**\n\n1. \
  \ 固定布局（fixed layouts）是如何工作的\n2.  流式布局（liquid layouts）是如何工作的\n3.  如何创建固定/流式混合布局\n\
  4.  如何创建 CSS 弹性盒子布局（flexible box layouts）\n5.  如何使用 CSS 网格布局\n\n到为止，你已经学习了许多关于网页内容样化的知识，从字体大小、颜色到图像、块级元素、列表等。但我们还没有讨论的是页面布局的高级概述。*页面布局*是指整个网页在观众看来是什么样的。大多数初级网页设计师将其认为一个静态特征，并目标是创建在每个\
  \ 浏览器和设备中查看时看起来完全相同的网页。但这只是设计网页的一种方法，而且并不是一种很好的方法。\n\n布局有两种基本类型：固定和流式。但也可以结合使用两者，让某些元素固定的，另一些元素是流式的。在本节中，你将首先学习这两种布局类型的特征，并看到一些使用它们的网站示例。然后你将看到一个结合了两种类型元素的基本模板，它使用了较旧的网页设计样式。\n\
  \n现代 CSS 为你提供了更多构建网页布局的工具，在本节中你将学习如何使用 CSS 弹性盒子布局模块和 CSS 网格布局模块来设计页面。\n\n最终，选择哪种布局类型取决于你；只要你的网站遵循\
  \ HTML 和 CSS 标准，很难出错。\n\n自己尝试一下\n\n寻找你喜欢的布局示例\n\n寻找流式布局示例的好去处是 WordPress 主题目录（WordPress\
  \ Theme Directory），地址为 [`wordpress.org/themes/`](https://wordpress.org/themes/)。WordPress\
  \ 起是一个博客平台，但近年来其作为非博客内容或网站管理工具的使用日益增加。WordPress 主题目录展示了数百个固定宽度和流式布局的示例，这可以为你提供灵感，即使不是全部代码，让你知道你可以创作什么。尽管你在这些课节的练习中没有处理\
  \ WordPress 博客或网站，但主题目录是一个你可以看到并交互许多设计变体的地方。\n\n花些时间查看 WordPress 示例，可能也可以查看 CSS\
  \ Zen Garden，地址为 [www.csszengarden.com](http://www.csszengarden.com)。这可以帮助你感受喜欢的布局类型，而不会被布局中的内容干扰。\n\
  \n一旦你找到自己喜欢的布局，就可以使用在本节中学到的技术在你的网站上重新创建它们。\n\n### 准备进行页面布局\n\n在之前的节中，你已经学习了如何构建\
  \ HTML 和 CSS 网页，但为了创建有效的布局，你需要对以下内容非常清楚：\n\n*   ![Image](img/arrow.jpg) **CSS 盒模型**——如果你对外边距（margins）、内边距（padding）、边框（borders）和内容框（content\
  \ boxes）感到不完全确定，你应该再次查看 第 9 节 “外边距、内边距、对齐和浮动”和第 10 节](#ch10.xhtml) “理解 CSS 盒模型和定位”。这两节是大多数布局技术的基础。**渐进增强**——渐进增强是一种理念，即你应该首先创建一个可以运行的最小网页，然后通过设计和交互元素对其进行增强。为了这一点，你需要关注你网站的每个页面需要做什么。那就是无论如何都可见、可用。一旦你有了这个元素，就可以添加\
  \ CSS 样式让它美观，添加 JavaScript 脚本使其具有交互性，但这些步骤永远不应该阻碍网页的主要目的。\n\n*   ![Image](img/arrow.jpg)\
  \ **结构与设计及交互分离**——你的目标应该是创建这样的网页：HTML 只包含结构和内容，CSS 只包含设计，而 JavaScript 只包含交互性。\n\n\
  ### 移动优先的重要性\n\n许多设计师忘记的网页布局方面是，大多数人并不是以设计师的方式查看网页的。大多数设计师使用大型显示器（有时是多个显示器），浏览器即使没有最大化，至少占据了大量空间。例如，我的默认浏览器窗口大约是\
  \ 1500px 比 900px，我在 5120 × 2880 的显示器上使用它，所以我可以把它调大很多。\n\n然而，根据 StatCounter 的数据，截至本文时，全球最流行的分辨率是\
  \ 360 × 640，份额为 23%。在美国，虽然最流行的分辨率是 1920 × 1080，但它仅占 10.4% 的用户，较小的分辨率如 360 × 640\
  \ 和 375 × 667 紧随其后，分别占用户的 10.2% 和 9.8%。使用移动设备正成为一种日益流行的消费网页内容的方式，你的页面应该反映这一点。\n\n\
  在前面的节中，你学习了渐进增强，你的页面布局在移动设备上使用这种技术是至关重要的。你应该为最小的设备设计页面，然后为越来越大的屏幕添加增强功能。\n\n\n\n\
  \n忽略这些建议可能很容易，因为为小屏幕设计设计可能是枯燥的，而且你的页面看起来可能很难看。但如果你任何流量依赖于搜索引擎，那么你就必须记住这一点。Google\
  \ 和其他搜索引擎开始优先考虑那些在移动设备上运行良好的网站，而不是那些不良好的网站。\n\n在本节中，你将学习特定的布局技术，这些技术可能不符合移动友好，或者可能没有将移动端设计放在首位。但你需要知道如何实现它们，以便你能够实施移动优先的技术。你将在第四部分“响应式网页设计”中学习到更多关于让你的设计更符合移动端的知识。\n\
  \n### 理解固定布局 (Fixed Layouts)\n\n固定布局，或称固定宽度布局，顾如其名：页面主体（body）被设置为特定宽度的布局。该宽度通常由包含所有内容的主“包装器”（wrapper）元素控制。如果为\
  \ `<div>` 赋予了如 `main` 或 `wrapper` 的 ID 值（尽管名称由你决定），则在样式表中会设置该包装器元素的 `width` 属性。\n\
  \n### 注意事项\n\n如果你一直在关注，你可能会意识到，一旦你给 HTML 元素赋予如 `wrapper` 的 ID，你就将页面设计移到了 HTML 中，而不是保留在\
  \ CSS 中。评估这一点的一种方法是问自己：“如果布局发生变化，此元素 ID 的含义或功能会改变吗？”如果答案是肯定的，那么你赋予它的更多是设计而非结构。最好使用更具语义化的\
  \ ID，例如 `main`，它告诉浏览器包含的内容是页面的主要部分。这样，如果布局发生变化，这些内容仍然是页面的主要部分，尽管它们可能位于布局中的不同位置。\n\
  \n在创建固定宽度布局时，最重要的决定是确定要适应的最小屏幕分辨率。决定如何设置固定宽度布局的最好方法是查看你网站访问者的统计数据。如果你的大多数观众使用如 800\
  \ × 600 的小屏幕，那么你的布局就应该反映这一点。但如果你因为网站是新的或其他原因没有网站的统计数据，你可以使用像 StatCounter（[`gs.statcounter.com/screen-resolution-stats/`](http://gs.statcounter.com/screen-resolution-stats/)）这样的服务来获取更通用的视图。\n\
  \n多年来，800 × 600 一直是网页设计师的“最低公约数”，导致典型的固定宽度约为 760 像素。然而，现在使用非移动浏览器使用 800 × 600 屏幕分辨率的人数比例已低于\
  \ 1%。许多网页设计师现在认为 1280 × 800 是最小屏幕分辨率，因此如果他们创建固定宽度布局，固定宽度通常在 1100 到 1200 像素之间。\n\n\
  ### 警告\n\n记住，网页浏览器窗口包含不可见的区域，包括滚动条。因此，如果你的目标是 1280 像素宽的屏幕分辨率，你实际上无法使用这 1280 个像素中的全部。\n\
  \n创建固定宽度布局的一个主原因是你可以对内容区域的外观进行精确控制。然而，如果用户使用比你设计时预想的更小或更大的屏幕分辨率访问你的固定宽度网站，他们将遇到滚动条（如果他们的分辨率较小）或大量的空隙（如果他们的分辨率较大）。在当今最流行的网站中，寻找固定宽度布局是困难的，因为网站设计师知道他们需要照顾尽可能大的受众（因此对浏览器大小不做任何假设）。然而，固定布局仍然被广泛采用，特别是使用带有严格模板的内容管理系统的网站管理员。\n\
  \n下面的图显示了这样一个网站，是圣何塞州立大学的。大学网站通常使用严格的模板和内容管理系统，因此这是一个很容易找到的示例。它有一个固定为 960 像素宽的包装器元素。在图\
  \ 12.1 中，浏览器窗口略低于 900 像素。在图像右侧，重要内容被截断（在图形底部，浏览器中显示水平滚动条）。\n\n![截图显示了“圣何塞州立大学”网页作为固定宽度的示例。页面的一小部分在右侧垂直被截断，底部有一个水平滚动条。](img/12fig01.jpg)\n\
  \n**图 12.1** 一个较小屏幕尺寸的固定宽度示例（注意水平滚动条）。\n\n图 12.2 显示了当浏览器窗口宽度超过 1500 像素时该网站的状况：你看到主体内容两侧有很多空隙（或“版面”），有些人认为这在审美上是不悦的。\n\
  \n![“圣何塞州立大学”网页的截图作为在大屏幕查看的固定宽度示例。现在整个网页都可以查看，但浏览器中网页左侧和右侧有空间。](img/12fig02.jpg)\n\
  \n**图 12.2** 一个较大屏幕尺寸的固定宽度示例。\n\n除了决定是否要创建固定宽度布局外，你还需要确定是将内容靠左对齐还是居中。\n\n### 理解流式布局\
  \ (Liquid Layouts)\n\n流式布局——也称为流体布局——是一种页面主体不使用像素宽度的布局，尽管它可能被封装在一个使用百分比宽度的主包装器中。流式布局的理念是即使用户拥有非常小或宽的屏幕，它也可以完美使用并保留整体设计感。\n\
  \n图 12.3、12.4 和 12.5 展示了流式布局的三个示例。\n\n![截图显示了小屏幕上查看的流式布局示例。对于较小的屏幕，网页的所有内容都可以查看，不需要水平滚动条。](img/12fig03.jpg)\n\
  \n**图 12.3** 在较小屏幕上查看的流式布局。\n\n![非常小屏幕上流式布局的同一网页截图。两端的 Logo 和头部现在重叠了。虽然显示了完整内容，但有一个小的水平滚动条。](img/12fig04.jpg)\n\
  \n**图 12.4** 在非常小屏幕上查看的流式布局。\n\n![显示了宽屏幕上流式布局网页的示例。现在网页看起来间距良好，没有水平滚动条或内容重叠。](img/12fig05.jpg)\n\
  \n**图 12.5** 在宽屏幕上查看的流式布局。\n\n在图 12.3 中，浏览器窗口约为 770 像素。该示例显示了出现水平滚动条之前合理的最小屏幕宽度。事实上，直到浏览器宽度达到\
  \ 735 像素时才会出现滚动条。另一方面，图 12.4 显示了一个非常小的浏览器窗口（宽度小于 600 像素）。\n\n\n\n\n\n在图 12.4 中，你可以看到一个水平滚动条；在页面内容的头部区域，Logo\
  \ 图像开始占据文本并显示在文本上方。但页面的大部分仍然仍然非常好用。页面左侧的信息内容清晰可见，并与右侧的输入表单共享可用空间。\n\n图 12.5 显示了同一个页面在极宽屏幕上的外观。在图\
  \ 12.5 中，浏览器窗口宽度约为 1330 像素。有足够的空间让页面上的所有内容展开。这种流体布局（liquid layout）之所以实现，是因为所有的设计元素都指定了百分比宽度，而不是固定宽度。这样，布局就利用了所有可用的浏览器空间。\n\
  \n流体布局方法初看起来可能是最佳方案；毕竟，谁不想利用所有可用的屏幕空间呢？但在利用空间与不让内容“呼吸”之间存在微妙的界限。内容过多会让人无所适从；开放的空间内内容太少则显得意兴不足。此外，如果屏幕变得太宽，文字将变得难以阅读。\n\
  \n纯粹的流体布局可能令人印象深刻，但它需要大量的测试来确保它在不同屏幕分辨率的各种浏览器中均可用。你可能没有精力和精力来制作这样的设计；在这种情况下，合理的折中方案是固定/流体混合布局，或者完全的响应式设计，我们稍后会讨论。\n\
  \n### 创建固定/流体混合布局\n\n固定/流体混合布局包含了两种类型布局的元素。例如，你可以拥有一个流体布局，其中包含固定宽的内容区域，这些区域位于主体区域内部或作为锚元素（例如左侧栏或顶部导航条）。你甚至可以创建一个像框架一样的固定内容区域，当用户滚动查看内容时，该内容区域保持固定不变。\n\
  \n#### 从基础布局结构开始\n\n在例例中，你将学习创建一个模板，该模板是流体的，但带有两个固定宽的列，分别位于主主体区域的两侧（如果你仔细想，这是第三个列，只是比其他列宽得多）。模板还具有划分好的头部和页脚区域。代码列表\
  \ 12.1 显示了此布局的基础 HTML 结构。\n\n**列表 12.1** 基础固定/流体混合布局结构\n\n点击此处查看代码图像\n\n```html\n\
  <!doctype html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Sample\
  \ Layout</title>\n    <link href=\"layout.css\" rel=\"stylesheet\">\n</head>\n<body>\n\
  \    <header>HEADER</header>\n    <section id=\"main\">\n        <article id=\"\
  main_content\">CONTENT</article>\n        <aside id=\"secondary_content\">LEFT SIDE</aside>\n\
  \        <aside id=\"tertiary_content\">RIGHT SIDE</aside>\n    </section>\n   \
  \ <footer>FOOTER</footer>\n</body>\n</html>\n```\n\n首先，请注意，此布局的样式表是链接到 `<link>`\
  \ 标签的，而不是包含在模板中。模板被用于多个页面，你希望能够以最有组织的方式控制模板的显示元素。这意味着你只需要在一个地方——样式表——中更改这些元素的定义。\n\
  \n接下来，注意这些基础 HTML 仅仅是：极其基础。老实说，这个基础 HTML 结构可以用于固定布局、流体布局或固定/流体混合，因为所有使布局固定、流体或混合的实际样式都是在样式表中完成的。\n\
  \n即使元素上的 ID 也没有说明内容应该位于哪里；它们仅提供了关于内容的语义信息。目前，`secondary_content` `<aside>` 元素显示在左侧（根据内容本身），但没有理由你不能将其移动到右侧、页脚下方或页面上任何你想要放置它的地方。\n\
  \n通过代码列表 12.1 中的 HTML 结构，你实际上已经确定了你想要包含在网站中的内容区域。这种规划对任何开发都至关重要；在考虑将要使用的布局类型之前，你必须知道你想包含什么，更不用说应用到该布局的特定样式了。在这个阶段，`layout.css`\
  \ 文件仅包含这些：\n\n```css\nbody {\n    margin:0;\n    padding:0;\n}\n```\n\n如果你查看代码列表\
  \ 12.1 中的 HTML 并对自己说：“但这些元素在没有任何样式的情况下会堆叠在一起”，你是对的。正如图 12.6 所示，这里没有任何布局可言。\n\n![基础\
  \ HTML 模板的截图。主主体包含“header, content, left side, right side, and footer”元素，一个接一个排列，没有任何应用样式。](img/12fig06.jpg)\n\
  \n**图 12.6** 未对容器应用样式的基础 HTML 模板。\n\n#### 在固定/流体布局中定义列\n\n由于这种布局应该是流体的，我们知道无论窗口多宽，头部和页脚区域都会占据窗口的\
  \ 100%。在样式表中添加以下代码，使头部和页脚区域具有相同的宽度、背景颜色和文本颜色：\n\n```css\nheader, footer {\n    float:\
  \ left;\n    width: 100%;\n}\n```\n\n现在情况变得复杂了一些。我们需要定义页面两侧的固定宽度列。在我们所使用的 HTML 中，注意一个名为\
  \ `main` 的 `<section>` 元素包裹了所有列。在样式表中将其定义如下：\n\n```css\n#main {\n    float: left;\n\
  \    padding-left: 200px;\n    padding-right: 125px;\n}\n```\n\n这两个 padding 定义实际上为页面两侧的固定宽度列留出了空间。左侧列宽为\
  \ 200 像素，右侧列宽为 125 像素，且每个都有不同的背景颜色。但我们还需要相对于它们原本的位置来定位这些项（参考图 12.6）。这意味着在这些列元素的样式表中添加\
  \ `position: relative;`。\n\n对于 `secondary_content` `<aside>` 的情况，我们还指示其右侧边缘距离边缘\
  \ 200 像素（这是在该列被定义为 200 像素的基础上）。我们还希望左侧边距为全比例负边距；这将把它拉到位（你很快就会看到）。`tertiary_content`\
  \ `<aside>` 不包含 `right` 值，但它在右侧包含了一个负边距：\n\n```css\n#secondary_content {\n    position:\
  \ relative;\n    float: left;\n    width: 200px;\n    background-color: #52f471;\n\
  \    right: 200px;\n    margin-left: -100%;\n}\n\n#tertiary_content {\n    position:\
  \ relative;\n    float: left;\n    width: 125px;\n    background-color: #f452d5;\n\
  \    margin-right: -125px;\n}\n```\n\n在此基础上，让我们定义内容区域，使其具有白色背景，占据 100% 的可用区域，并相对于其位置向左浮：\n\
  \n```css\n#main_content {\n    position: relative;\n    float: left;\n    background-color:\
  \ #ffffff;\n    width: 100%;\n}\n```\n\n此时，基础布局看起来应该像图 12.7 所示，区域被清晰划分。\n\n![相同示例布局的修改版本的截图。](img/12fig07.jpg)\n\
  \n**图 12.7** 应用了样式后的基础 HTML 模板。\n\n\n\n\n\n然而，如果窗口缩减到特定宽度以下，这个模板就会出现一个问题。因为左列宽度为\
  \ 200 像素，右列宽度为 125 像素，而你希望内容区域至少留有一些文本，所以可以想象，如果窗口宽度仅为 350 到 400 像素，该页面将会错乱。如果浏览器太宽，也会存在问题。我们将在下一节中解决这些问题。\n\
  \n## 设置布局的最小和最大宽度\n\n虽然用户不太可能使用显示宽度小于 400 像素的桌面浏览器访问你的网站，但许多人可能会在这种尺寸的小型手机上查看。你可以推断并广泛地应用此信息：即使在固定/流式混合网站中，在某个时刻，除非你采取某些措施来防止结果发生，否则你的布局将会崩溃。\n\
  \n这些“措施”之一就是使用 `min-width` CSS 属性。`min-width` 属性设置元素的最小宽度，不包括内边距（padding）、边界（borders）或外边距（margins）。图\
  \ 12.8 显示了当 `min-width` 应用于 `<body>` 元素时发生的情况。\n\n![一张在最小宽度屏幕上相同示例布局的修改版本的截图。](img/12fig08.jpg)\n\
  \n**图 12.8** 宽度缩放至 400 像素以下的基础 HTML 模板，并应用了最小宽度。\n\n图 12.8 显示了屏幕向右滚动后右列的一小部分，但关键点在于，当缩放到最小宽度以下时，布局不会断裂。在这种情况下，最小宽度为\
  \ 525 像素：\n\n```css\nbody {\n  margin: 0;\n  padding: 0;\n  min-width: 525px;\n\
  }\n```\n\n在这个示例中，出现水平滚动条是因为浏览器窗口本身的宽度小于 500 像素。当窗口略大于 525 像素宽时，滚动条就会消失。\n\n你可以以同样的方式使用\
  \ `max-width` CSS 属性，确保页面中具有百分比宽度的元素不会变得太宽。该属性允许元素扩展到某一点然后停止。\n\n## 在固定/流式混合布局中处理列高度\n\
  \n这个示例很好，但存在一个问题：它没有内容。当向各种元素中添加了内容时，会产生更多问题。如图 12.9 所示，各列的高度会根据其包含的内容变得达到所需的高度。\n\
  \n![截图显示了一个示例布局网页，其中 body 被划分为三列。](img/12fig09.jpg)\n\n**图 12.9** 列的高度仅与其内容等高。（*来源：Kjpargeter/Shutterstock)*\n\
  \n### 注意事项\n\n在图 12.9 中，我们已经超出了基础布局示例。因此，我们也特意去除了页眉和页脚的背景和文本颜色属性，这就是为什么示例不再在非常深色的背景上显示白色文字。此外，我们将\
  \ `<footer>` 元素中的文本居中处理，该元素现在具有浅灰色背景。\n\n由于你无法保证用户的浏览器高度是特定的，也无法保证内容长度相同，你可能会认为这给固定/流式混合布局带来了问题。其实并非如此。如果你能跳出框架，可以应用更多样式将所有部分整合在一起。\n\
  \n首先，在为 `secondary_content`、`tertiary_content` 和 `main_content` ID 样式表条目中添加以下声明：\n\
  \n```css\nmargin-bottom: -2000px;\npadding-bottom: 2000px;\n```\n\n这些声明为所有三个元素的底部添加了大量的内边距，并分配了过大的外边距。你必须在样式表的页脚元素定义中添加\
  \ `position:relative;`，这样尽管有这些内边距，页脚仍然可见。\n\n此时，页面的外观看起来如图 12.10 所示：\n\n![截图显示了延伸到页部的示例布局。](img/12fig9.jpg)\n\
  \n**图 12.10** 列延伸到了页面底部，尽管有这种设置。（*来源：Kjpargeter/Shutterstock)*\n\n为了裁剪掉底部，请在样式表中为\
  \ `main` 添加以下内容：\n\n```css\noverflow: hidden;\n```\n\n图 12.10 显示了最终结果：\n\n\n\n\n\
  \n```css\n* {\n  background-color: #f452d5;\n  margin-right: -125px;\n  margin-bottom:\
  \ -2000px;\n  padding-bottom: 2000px;\n}\n\n#main_content {\n  position: relative;\n\
  \  float: left;\n  background-color: #ffffff;\n  width: 100%;\n  margin-bottom:\
  \ -2000px;\n  padding-bottom: 2000px;\n}\n\nh1 {\n  margin: 0;\n}\n\n#secondary_content\
  \ ul {\n  list-style: none;\n  margin: 12px 0px 0px 12px;\n  padding: 0px;\n}\n\n\
  #secondary_content li a:link, #secondary_content li a:visited {\n  font-size: 12pt;\n\
  \  font-weight: bold;\n  padding: 3px 0px 3px 3px;\n  color: #000000;\n  text-decoration:\
  \ none;\n  display: block;\n}\n\n#secondary_content li a:hover, #secondary_content\
  \ li a:active {\n  font-size: 12pt;\n  font-weight: bold;\n  padding: 3px 0px 3px\
  \ 3px;\n  color: #ffffff;\n  text-decoration: none;\n  display: block;\n}\n```\n\
  \n### 使用现代 CSS 布局技术\n\n在之前的章节中，你学习了网页设计人员过去是如何构建网页布局的——许多设计人员现在仍然在使用这些方法。但 CSS3\
  \ 提供了几种处理新方法来处理网页布局，而且大多数现代浏览器都能轻松地支持这些方法。以下是三种最常用的方法：\n\n*   ![Image](img/arrow.jpg)\
  \ `CSS 表格布局`——将页面元素的显示更改为表格、表格行表格列的 CSS 属性。\n*   ![Image](img/arrow.jpg) `CSS 弹性盒子布局\
  \ (Flexbox)`——能够更容易对容器内的元素进行布局、对齐和分配空间的 CSS 属性。\n*   ![Image](img/arrow.jpg) `CSS\
  \ 网格布局 (Grid)`——一种基于行和列的网格布局系统。\n\n这些 CSS 布局系统都从 `display` 属性开始。在 CSS3 之前，`display`\
  \ 属性取值有 `inline`、`block` 和 `none`。这意味着你可以更改元素在普通流中的显示方式，或者将它们完全隐藏。CSS3 添加了许多新值，包括\
  \ `list-item`（表示该元素是列表项目）和 `inline-block`（表示该元素像 `<img>` 元素一样，具有内联和块级元素的特性）。在接下来的几个章节中，你将学习更多有助于布局的\
  \ `display` 属性值。\n\n#### 如何使用 CSS `display: table;`\n\n与 HTML 表格不同，CSS 的 `display:\
  \ table;` 属性并不是 HTML 中的结构化表格。这意味着你可以将任何元素转换为表格，并使用它来构建你的布局。\n\n`display` 属性上有几个表格相关的选项：\n\
  \n*   ![Image](img/arrow.jpg) `table`——行为类似于 `<table>` 元素\n*   ![Image](img/arrow.jpg)\
  \ `inline-table`——行为类似于内联渲染的 `<table>` 元素\n*   ![Image](img/arrow.jpg) `table-row`——行为类似于表格行\
  \ (`<tr>`) 元素\n*   ![Image](img/arrow.jpg) `table-cell`——行为类似于表格单元格 (`<td>`) 元素\n\
  *   ![Image](img/arrow.jpg) `table-column`——行为类似于 `<col>` 元素\n*   ![Image](img/arrow.jpg)\
  \ `table-caption`——行为类似于 `<caption>` 元素\n*   ![Image](img/arrow.jpg) `table-row-group`——行为类似于\
  \ `<tbody>` 元素\n*   ![Image](img/arrow.jpg) `table-header-group`——行为类似于 `<thead>`\
  \ 元素\n*   ![Image](img/arrow.jpg) `table-footer-group`——行为类似于 `<tfoot>` 元素\n*  \
  \ ![Image](img/arrow.jpg) `table-column-group`——行为类似于 `<colgroup>` 元素\n\n### 注意事项\n\
  \n有些人对使用 CSS 表格样式进行布局表示担心，因为他们学过永远不要使用表格进行布局。然而，尽管名称如此，CSS 表格属性并不是 HTML 表格标签。当你使用\
  \ CSS 表格样式时，无障碍访问问题得到了缓解，因为 HTML 可以以可访问的方式构建结构，无论布局如何。\n\n通过使用 CSS 表格，你可以创建与网页设计人员在“过去糟糕的年代”使用实际表格创建的布局类似的布局。例如，你可以采用你在\
  \ 列表 12.2 中使用的 HTML，并更改 CSS 来创建一个类似的三栏布局。\n\n首先，将 `main` `<section>` 定义为表格并给它设置\
  \ 100% 的宽度：\n\n```css\n#main {\n  width: 100%;\n  display: table;\n}\n```\n\n这告诉浏览器该元素包含表格内容并应该像表格一样显示。\n\
  \n然后将三个内容区域定义为表格单元格：\n\n点击此处查看代码图像\n\n你会注意到的一点是 `secondary_content` 列现在位于三个列的中间。这是因为它在源代码中的位置在那里。这种方法的一个缺点是，要更改元素的位置，你需要更改\
  \ HTML。但正如你在接下来的章节中看到的，CSS3 提供了解决方案。\n\n```css\n#main_content, #secondary_content,\
  \ #teriary_content {\n  display: table-cell;\n}\n```\n\n##### 尝试一下\n\n使用 CSS `display:\
  \ table;` 进行垂直对齐\n\n`display: table-*` 属性的一个作用非常有用，它允许你在空间内进行垂直对齐。这是因为表格单元格具有垂直对齐属性。\n\
  \n要在空间内进行垂直对齐，只需在具有明确高度的元素上添加 `display: table-cell;` 属性，并将 `vertical-align` 设置为\
  \ `middle`。\n\n##### 理解 CSS 弹性盒子模块\n\nCSS 弹性盒子模块为你提供了一种对容器内按行显示的元素进行定位的方法。容器可以更改内部元素的尺寸以最好适应可用空闲空间。弹性盒子容器（或\
  \ flex 容器）会扩展项目以填充可用空间，或收缩项目以防止在较小空间内溢出。\n\n注意\n\n虽然你可以在任何网页上使用弹性盒子布局，但该模型最适用于应用程序组件和小规模布局。如果你正在设计整个网站或其他较大型的项目，你应该使用在本节稍后介绍的网格布局模型。\n\
  \n##### 构建弹性盒子容器\n\n\n\n\n\n创建弹性布局时，首先需要一个容器元素。该元素用于容纳所有要在页面上布局的项目。你通过 `display`\
  \ 属性来定义弹性容器：\n\n```css\n.container {\n  display: flex;\n}\n```\n\n这为容器的所有直接子元素开启了弹性布局上下文。\n\
  \n一旦定义了容器，你就需要确定容器内元素的流向方向。为此，你使用 `flex-direction` 属性并带有以下值之一：\n\n*   ![Image](img/arrow.jpg)\
  \ row—在 `ltr` 布局中，弹性项目从左到右流；在 `rtl` 布局中从右到左流。这是默认值。\n*   ![Image](img/arrow.jpg)\
  \ row-reverse—在 `ltr` 布局中，项目从右到左流；在 `rtl` 布局中从左到右流。这是 `row` 的反方向。\n*   ![Image](img/arrow.jpg)\
  \ column—项目在列中从上到下流。\n*   ![Image](img/arrow.jpg) column-reverse—项目在列中从下到上流。这是 `column`\
  \ 的反方向。\n\n确定了流向后，你还需要考虑项目在到达边界时如何换行。默认情况下，弹性项目尝试挤在单行。但你可以通过 `flex-wrap` 属性和这些值来更改它：\n\
  \n*   ![Image](img/arrow.jpg) nowrap—所有弹性项目都在同一行（水平或垂直）。这是默认值。\n*   ![Image](img/arrow.jpg)\
  \ wrap—弹性项目从上到下换行到多行。\n*   ![Image](img/arrow.jpg) wrap-reverse—弹性项目从下到上换行到多行。这是\
  \ `wrap` 的反方向。\n\n你可以使用 `flex-flow` 写属性同时定义弹性方向和换行：\n\n点击此处查看代码图片\n\n`flex-flow:\
  \ flex-direction || flex-wrap;`\n\n对于弹性容器，你还需要了解的最后三个属性是 `justify-content`、`align-items`\
  \ 和 `align-content`。这些属性控制项目在容器内的显示方式。\n\n`justify-content` 属性定义了当容器内的空间大于项目占用的空间时，项目如何分布。你可以分配额外的空闲空间，使其分布在项目之间或周围。这些是可能的值：\n\
  \n*   ![Image](img/arrow.jpg) flex-start—项目放置在容器的开头，任何额外空间都放在所有项目之后。这是默认值。\n*  \
  \ ![Image](img/arrow.jpg) flex-end—这与 `flex-start` 相同，而不是将额外空间放在末尾，而是放在开头并将所有项目推向末尾。\n\
  *   ![Image](img/arrow.jpg) center—项目放置在容器中心，额外的空闲空间均匀地分布在开头和结尾。\n*   ![Image](img/arrow.jpg)\
  \ space-between—项目在行内均匀分布，第一个项目位于开头，最后一个位于末尾。额外空间均匀地分布在所有项目之间。\n*   ![Image](img/arrow.jpg)\
  \ space-around—项目在行内均匀分布，周围都有相等的空间。然而，这种间距看起来并不相等，因为内部项目之间的空间是第一个和最后一个项目在外部边缘空间的两倍。\n\
  \n图 12.13 显示了不同的 `justify-content` 值的样式。\n\n![一张截图显示了不同 justify-content 值的渲染输出。](img/12fig13.jpg)\n\
  \n**图 12.13** 使用 `justify-content` 属性。\n\n`justify-content` 属性定义了项目如何沿容器的主轴（水平或垂直）进行布局。但你也可以定义项目如何沿容器的垂直轴线进行定位。换句话说，如果你有一个水平弹性框，`align-items`\
  \ 将定义项目在垂直轴上的定位方式。如果你有一个垂直弹性框，`align-items` 属性将定义它们在水平轴上的定位方式。该属性具有以下可能的值：\n\n*\
  \   ![Image](img/arrow.jpg) stretch—项目应该拉伸以填充整个容器，同时遵守 `min-width` 和 `max-width`\
  \ 规则。这是默认值。\n*   ![Image](img/arrow.jpg) center—项目沿交叉轴居中对齐。\n*   ![Image](img/arrow.jpg)\
  \ baseline—项目对齐方式使它们的基线对齐。\n*   ![Image](img/arrow.jpg) flex-start—项目定位在元素的开头（水平布局的顶部和垂直\
  \ `ltr` 布局的左侧）。\n*   ![Image](img/arrow.jpg) flex-end—项目定位在元素的末尾（水平布局的底部和垂直 `ltr`\
  \ 布局的右侧）。\n\n如果你的容器中有多个行，你需要使用 `align-content` 属性来确定行之间的任何额外空间如何分布。该属性可以具有以下值：\n\
  \n*   ![Image](img/arrow.jpg) stretch—行拉伸以占据剩余空间。这是默认值。\n*   ![Image](img/arrow.jpg)\
  \ center—行在中间堆积。\n*   ![Image](img/arrow.jpg) space-between—第一行在开头，最后一行在末尾。\n* \
  \  ![Image](img/arrow.jpg) space-around—行在其周围均匀分布。\n*   ![Image](img/arrow.jpg)\
  \ flex-start—行推向开头。\n*   ![Image](img/arrow.jpg) flex-end—行推向末尾。\n\n### 修改弹性项目\n\
  \n一旦有了容器，内部的任何元素都是弹性项目。但有几种方法可以控制它们的显示方式。\n\n通常，弹性项目按照它们在 HTML 中的顺序出现在页面上，但通过 `order`\
  \ 属性，你可以更改这一点。数字越小（包括负数），项目出现的位置越靠近开头。这有助于解决图 12.12 所示的问题。从列表 12.4 中的 CSS 开始，将 `#main`\
  \ 元素改为 `display: flex;`，从内容块中移除 `display: table-cell;`。这为你提供了一个与所示相同的布局。\n\n使用如下\
  \ CSS 更改列的顺序：\n\n```css\n#secondary_content {\n  order: -1;\n}\n```\n\n这个简单的 CSS\
  \ 将 `#secondary_content` 置于列表的最前，因此它最前面。由于我们没有为它们指定顺序，另外两列按照它们在 HTML 中的顺序显示。列表 12.5\
  \ 显示了我们获得图 12.14 所示布局使用的 CSS。我们使用了与列表 12.2 相同的 HTML。\n\n**列表 12.5** 使用弹性布局更改布局\n\
  \n\n\n\n\n```css\ndisplay: block;\n}\n\n#secondary_content li a:hover, #secondary_content\
  \ li a:active {\n  font-size: 12pt;\n  font-weight: bold;\n  padding: 3px 0px 3px\
  \ 3px;\n  color: #ffffff;\n  text-decoration: none;\n  display: block;\n}\n```\n\
  \n![一张显示具有所需布局的示例页面截图](img/12fig14.jpg)\n\n**图 12.14** 使用弹性框获取所需的布局。*(致谢：Kjpargeter/Shutterstock)*\n\
  \n### 注意\n如果弹性框布局（flexible box layouts）的排序功能不能让你感到兴奋，那我不知道什么能了。由于 `order` 属性的存在，你可以为各种依赖于数据库条目的布局创建设计。通常情况下，你必须将显示顺序编写到数据库功能本身中，但现在你可以通过\
  \ CSS 来控制它。现在，如果你在卖鞋，并想通过先显示某个特定款式来突出它，你只需要更改 CSS 中的顺序即可——无需任何数据库编程或服务器端脚本。\n\n\
  弹性框布局模块（Flexible Box Layout module）非常复杂且难以使用，它包含更多功能，但在某些情况下可能非常有用。有很多地方可以学习更多关于\
  \ CSS 弹性框的知识，有一个有趣的在线游戏是 Flexbox Zombies ([`flexboxzombies.com`](https://flexboxzombies.com))。它很长，但值得。\n\
  \n### 理解 CSS Grid 布局模块\n你可能不熟悉 CSS Grid 布局模块，但可能如果你做过任何网页设计，你就用过网格。大多数网页都是使用某种形式的无形网格构建的。如果你使用表格布局，你就在使用网格。之前章节中使用的三列布局也是在网格上布局的。\n\
  \n通过 CSS3 Grid 布局模块，你可以将任何容器元素定义为具有特定行列大小的网格，然后将子元素放入网格中。与弹性框布局一样，HTML 中元素的顺序并不重要。一旦它们进入网格，你就可以将它们放置在任何地方。就像弹性框一样，网格布局系统在现代浏览器中得到了完全支持。只有\
  \ Internet Explorer 11 需要前缀（`-ms`），例如 `display: -ms-grid;`。\n\n要使用 CSS Grid 布局系统，你将容器元素定义为\
  \ `display: grid;`，然后使用 `grid-template-columns` 和 `grid-template-rows` 属性定义列和行。一旦定义了网格，你就可以使用\
  \ `grid-template-areas` 和 `grid-area` 属性将子元素放入网格中。\n\n### 操作网格容器\n创建网格布局时要做的第一件事是将容器元素定义为网格。你通过与弹性框相同的方法，使用\
  \ `display` 属性来实现。网格有三个可能的值：\n\n* ![图像](img/arrow.jpg) `grid`——生成一个块级网格\n* ![图像](img/arrow.jpg)\
  \ `inline-grid`——生成一个内联网格\n* ![图像](img/arrow.jpg) `subgrid`——对于嵌套网格，表示嵌套网格应该从父网格获取行和列的大小，而不是要求设计师指定新的。\n\
  \n然后你使用 `grid-template-columns` 和 `grid-template-rows` 属性定义网格列和行，这两者都使用空格分隔的值列表。\n\
  \n思考 CSS Grid 布局模块中创建的网格的最佳方式是，想象你正在 CSS 中直接以文本形式创建你的网格。`grid-template-columns`/rows`\
  \ 属性的值代表轨道大小，它们之间的空间代表网格线。构建它的一种方法是编写你的 CSS 使其代表网格，如下：\n\n点击此处查看代码图片\n\n```css\n\
  /* 列 1 列 2 列 3 列 4 */\ngrid-template-columns: 100px auto 100px 200px;\ngrid-template-rows:\n\
  \  /* 行 1 */ 100px;\n  /* 行 2 */ 300px;\n  /* 行 3 */ 100px;\n```\n\n[/content]\n\
  ``` 浏览器将忽略空白符，但你可以立即看到这个网格将是 4 × 3（即四列三行）。\n\n### 注意\nCSS 网格系统的一个有用特性是它添加了一个新的测量单位——`fr`。这指的是容器内部的空闲空间。浏览器首先移除非弹性项目占据的任何空间，然后将剩余空间分配给带有\
  \ `fr` 单位的元素。例如，你可能有一个三列布局，其中一列占 15%，`3fr` 占据剩余空间。写法如下：\n\n```css\ngrid-template-columns:\
  \ 15% 3fr;\n```\n\n虽然你可以像描述的那样带间距定义列和行，但更简单的方法是使用 `grid-template-areas`。要使用它，你需要用\
  \ `grid-area` 属性为元素命名。例如，你可以这样命名你的布局：\n\n```css\nheader { grid-area: header; }\n\
  footer { grid-area: footer; }\nsection { grid-area: main; }\naside { grid-area:\
  \ sidebar; }\nnav { grid-area: navigation; }\n```\n\n然后你使用 `grid-template-areas`\
  \ 定义布局。记住区域名称应该放在引号中：\n\n```css\ngrid-template-areas: \"secondary_content main_content\
  \ tertiary_content\";\n```\n\n[/content] \n\n*(抱歉，在上述的回复中由于逻辑处理错误，将未翻译的示例和翻译后的文本混在在一起了。以下是针对你提供的英文文本的完整翻译译文：)*\n\
  \n[content]\n\n```css\ndisplay: block;\n}\n\n#secondary_content li a:hover, #secondary_content\
  \ li a:active {\n  font-size: 12pt;\n  font-weight: bold;\n  padding: 3px 0px 3px\
  \ 3px;\n  color: #ffffff;\n  text-decoration: none;\n  display: block;\n}\n```\n\
  \n![一张显示具有所需布局的示例页面截图](img/12fig14.jpg)\n\n**图 12.14** 使用弹性框获取所需的布局。*(致谢：Kjpargeter/Shutterstock)*\n\
  \n### 注意\n如果弹性框布局（flexible box layouts）的排序功能不能让你感到兴奋，那我不知道什么能了。由于 `order` 属性的存在，你可以为各种依赖于数据库条目的布局创建设计。通常情况下，你必须将显示顺序编写到数据库功能本身中，但现在你可以通过\
  \ CSS 来控制它。现在，如果你在卖鞋，并想通过先显示某个特定款式来突出它，你只需要更改 CSS 中的顺序即可——无需任何数据库编程或服务器端脚本。\n\n\
  弹性框布局模块（Flexible Box Layout module）非常复杂且难以使用，它包含更多功能，但在某些情况下可能非常有用。有很多地方可以学习更多关于\
  \ CSS 弹性框的知识，有一个有趣的在线游戏是 Flexbox Zombies ([`flexboxzombies.com`](https://flexboxzombies.com))。它很长，但值得。\n\
  \n### 理解 CSS Grid 布局模块\n你可能不熟悉 CSS Grid 布局模块，但可能你如果你做过任何网页设计，你就用过网格。大多数网页都是使用某种形式的无形网格构建的。如果你使用表格布局，你就在使用网格。之前章节中使用的三列布局也是在网格上布局的。\n\
  \n通过 CSS3 Grid 布局模块，你可以将任何容器元素定义为具有特定行列大小的网格，然后将子元素放入网格中。与弹性框布局一样，HTML 中元素的顺序并不重要。一旦它们进入网格，你就可以将它们放置在任何地方。就像弹性框一样，网格布局系统在现代浏览器中得到了完全支持。只有\
  \ Internet Explorer 11 需要前缀（`-ms`），例如 `display: -ms-grid;`。\n\n要使用 CSS Grid 布局系统，你将容器元素定义为\
  \ `display: grid;`，然后使用 `grid-template-columns` 和 `grid-template-rows` 属性定义列和行。一旦定义了网格，你就可以使用\
  \ `grid-template-areas` 和 `grid-area` 属性将子元素放入网格中。\n\n### 操作网格容器\n创建网格布局时要做的第一件事是将容器元素定义为网格。你通过与弹性框相同的方法，使用\
  \ `display` 属性来实现。网格有三个可能的值：\n\n* ![图像](img/arrow.jpg) `grid`——生成一个块级网格\n* ![图像](img/arrow.jpg)\
  \ `inline-grid`——生成一个内联网格\n* ![图像](img/arrow.jpg) `subgrid`——对于嵌套网格，表示嵌套网格应该从父网格获取行和列的大小，而不是要求设计师指定新的。\n\
  \n然后你使用 `grid-template-columns` 和 `grid-template-rows` 属性定义网格列和行，这两者都使用空格分隔的值列表。\n\
  \n思考 CSS Grid 布局模块中创建的网格的最佳方式是，想象你正在 CSS 中直接以文本形式创建你的网格。`grid-template-columns`/rows`\
  \ 属性的值代表轨道大小，它们之间的空间代表网格线。构建它的一种方法是编写你的 CSS 使其代表网格，如下：\n\n点击此处查看代码图片\n\n```css\n\
  /* 列 1 列 2 列 3 列 4 */\ngrid-template-columns: 100px auto 100px 200px;\ngrid-template-rows:\n\
  \  /* 行 1 */ 100px;\n  /* 行 2 */ 300px;\n  /* 行 3 */ 100px;\n```\n\n浏览器将忽略空白符，但你可以立即看到这个网格将是\
  \ 4 × 3（即四列三行）。\n\n### 注意\nCSS 网格系统的一个有用特性是它添加了一个新的测量单位——`fr`。这指的是容器内部的空闲空间。浏览器首先移除非弹性项目占据的任何空间，然后将剩余空间分配给带有\
  \ `fr` 单位的元素。例如，你可能有一个三列布局，其中一列占 15%，`3fr` 占据剩余空间。写法如下：\n\n```css\ngrid-template-columns:\
  \ 15% 3fr;\n```\n\n虽然你可以像描述的那样带间距定义列和行，但更简单的方法是使用 `grid-template-areas`。要使用它，你需要用\
  \ `grid-area` 属性为元素命名。例如，你可以这样命名你的布局：\n\n```css\nheader { grid-area: header; }\n\
  footer { grid-area: footer; }\nsection { grid-area: main; }\naside { grid-area:\
  \ sidebar; }\nnav { grid-area: navigation; }\n```\n\n然后你使用 `grid-template-areas`\
  \ 定义布局。记住区域名称应该放在引号中：\n\n```css\ngrid-template-areas: \"secondary_content main_content\
  \ tertiary_content\";\n```\n\n\n\n\n\n当你将一个容器元素转换为网格容器时，网格元素仅指该容器的直接子元素。在本节的示例中，容器是主\
  \ `<section>` 元素。如果你将这些示例中的 `<body>` 元素转换为容器，那么网格项目就是 `<header>`、`<section>` 和 `<footer>`\
  \ 元素，因为它们是 `<body>` 元素的第一个子元素。\n\n与弹性盒（Flexible Boxes）模块一样，CSS 网格模块包含的内容远比本节所涵盖的要。你可以执行诸如为网格线命名、控制“额外”项目如何适应布局、跨越行和列等操作。我们发现一个有助于理解\
  \ CSS 网格工作原理的网站是 Grid by Example ([`gridbyexample.com/examples/`](https://gridbyexample.com/examples/))，但其他许多优秀的教程——只需搜索\
  \ `CSS Grid Layout` 即可。\n\n![截图显示了使用 CSS 网格模块的示例布局。](img/12fig15.jpg)\n\n**图 12.15**\
  \ 使用 CSS 网格模块创建与之前相同的布局。*(感谢：Kjpargeter/Shutterstock)*\n\n### 总结\n\n在本节中，你学习了三种主要的布局类型：固定布局、流式布局和固定/流式混合布局。在课程中间，一个扩展示例带你介绍了创建固定/流式混合布局的过程，在此过程中\
  \ HTML 和 CSS 均通过了验证。然后，你看到了如何使用现代 CSS 布局（使用弹性盒和网格）来创建类似的布局。在本节中，你了解到创建布局最重要的部分是确定你认为在设计中可能需要考虑的内容区块。\n\
  \n### 问答\n\n**问. 为什么我想使用 CSS 弹性盒或 CSS 网格，而不是那些更“久经考验”的布局方法呢？**\n\n答. 与网页设计的许多其他领域一样，选择如何做完全取决于你，但新的\
  \ CSS 弹性盒和网格方法为你提供了更大的灵活性，可以直接在 CSS 中更改布局，而无需更改 HTML。这意味着你可以对页面设计进行工作，甚至可以创建多次迭代，而不会影响底层结构。如果你尝试的第一个布局不起作用，只需将\
  \ CSS 换成其他内容即可。\n\n**问. 我看到弹性盒通常被称为*一维布局系统*。这意味着什么？**\n\n答. 从核心上讲，弹性盒布局系统旨在允许你控制项目在单个方向（水平或垂直）上的布局。虽然弹性盒项目可以流动到第二行或第二列，但其主要意图是单一维度的。相比之下，CSS\
  \ 网格布局同时定义了行*和*列，并允许你在预定义网格内的任何位置放置项目。\n\n**问. 我听过一种中叫作*弹性布局（elastic layout）*的东西。它与流式布局（liquid\
  \ layout）有什么区别？**\n\n答. `elastic layout` 是指当用户调整文本大小时，其内容区域也会调整大小的布局。弹性布局使用 `ems`，它们在本质上与文本和字体大小成正比。`em`\
  \ 是一个排版单位，等于当前字体的字号。在弹性布局中使用 `ems` 时，如果用户使用 Ctrl 和鼠标滚轮强制增大或缩小文本尺寸，包含文本的区域将按比例增大或缩小。弹性布局通常很难实现。\n\
  \n**问. 是否有一种布局系统比其他任何类型都好？**\n\n答. “更好”是一个主观的词汇；这些课程的目标是帮助你创建符合标准的代码。大多数设计师会告诉你，流式布局的创建（和完善）时间更长，但其可用性的提升是值得的，特别是当该过程导致响应式设计时。网格和弹性盒布局在控制内容显示方面为你提供了更多选项，但由于它们太新了，许多设计师还不习惯使用它们。通常，大多数设计师避免固定布局设计，因为它们不是响应式的，并且对于移动用户来说难以导航。你将在第四部分中学习更多关于构建响应式网站的知识。\n\
  \n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固对涵盖内容的理解。\n\n### 测验\n\n**1。** 通常情况下，使用哪种布局最好：固定的、流式的还是混合的？\n\
  \n**2。** 你可以在可以在页面的任何位置放置固定布局吗？\n\n**3。** `min-width` 的作用是什么？\n\n**4。** 显示一组待售产品，使用\
  \ CSS 网格还是弹性盒布局更好？\n\n**5。** 为什么在创建设计时考虑移动设备很重要？\n\n**6。** 在元素上使用哪个 ID 更好：`container`\
  \ 还是 `primary`？\n\n**7。** 如果你的目标群体是标准浏览器尺寸为 800 × 600 像素的观众，那么最大固定宽度应该是多少像素，为什么？\n\
  \n**8。** 你如何将一个容器定义为表格？\n\n**9。** 写出三种现代 CSS 布局技术。\n\n**10。** `display: inline-grid;`\
  \ 的作用是什么？\n\n#### Note\n\n**1。** 这是一个陷阱题；没有“最好”的布局。最好取决于内容和受众的需求。\n\n**2。** 当然。虽然大多数固定布局是左对齐或居中的，但你可以在\
  \ x、y 轴上分配固定位置，并放置包含所有其他 `<div>` 元素的 `<div>`。\n\n**3。** `min-width` 属性设置元素的最小宽度，不包括内边距、边框或外边距。\n\
  \n**4。** 弹性盒专门为这种布局类型设计，其中有一系列对象（待售产品）需要整齐地放置在容器内。\n\n**5。** 越来越多的人主要通过他们的移动设备访问网页，如果你的布局在类设备上难以阅读，他们就不会留下来。\n\
  \n**6。** ID `primary` 更好，因为它没有定义布局的一部分，而是定义包含的内容是主要的。\n\n**7。** 它应该不超过 780 像素左右，以考虑到浏览器的不可见区域。\n\
  \n**8。** 使用 `display: table;` 属性。\n\n**9。** 本节讨论的三种现代布局技术是 CSS 表格、弹性盒和网格布局。\n\n\
  **10。** 它表示容器是一个应与周围内容内联显示的网格。\n\n### 答案\n\n给本书读者的提醒：如果你访问 `www.informit.com/register`\
  \ 并注册此书（使用 ISBN 978067233803），你可以免费获得此测验的在线版本。\n\n### 练习\n\n*   ![图像](img/arrow1.jpg)\
  \ 图 12.15 显示了完成后的 CSS 网格布局，但某些区域还可以改进。例如，右侧文本周围没有任何空间，正文和任意列之间没有外边距，页脚条看起来有点单调，等等。花些时间修复这些设计元素。\n\
