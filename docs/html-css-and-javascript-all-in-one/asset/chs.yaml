  2. 节点的功能\n3. 节点的方法\n4. 节点内的文本\n\n**8.** `<body>` 标签是否有与之关联的 `nodeValue`？\n\n1. 是的，附加到它上的节点数量\n\
  2. 是的，子节点的值\n3. 是的，但值为 null\n4. 否\n\n**9.** 哪个方法从对象中移除子节点？\n\n1. `removeNode`\n\
  2. `removeChild`\n3. `deleteChild`\n4. `deleteNode`\n\n**10.** 如何使用 JavaScript 获取网页页的端口号？\n\
  \n1. 是的，附加到它上的节点数量\n2. 是的，子节点的值\n3. 是的，但值为 null\n4. 否\n\n#### 备注\n\n提醒一下正在阅读本书纸质版或电子书版这些文字的读者：如果你访问\
