  \n**图 27.1** 列表 27.1 中的代码使用了许多常见的表单元素。\n\n### 接受文本输入\n\n为了在表单中请求用户特定信息，请使用 `<input>`\
  \ 标签。虽然该标签并不显式需要出现在 `<form>` 和 `</form>` 标签之间，但将其放在那里是良好的做法，使代码更易读。你可以将 `<input>`\
  \ 元素放置在页面的任何位置，与文本、图像和其他 HTML 标签一起使用。例如，为了询问姓名，你可以输入以下文本，紧接着一个 `<input>` 字段：\n\n\
  点击此处查看代码图片\n\n\n\n\n\n如果你想让用户输入文本而不在屏幕上显示这些文本，可以使用 `<input type=\"password\">` 代替\
  \ `<input type=\"text\">`。此时，星号（`*`）将代替用户输入的文本显示。`size`、`maxlength` 和 `name` 属性在\
  \ `type=\"password\"` 下下的工作方式与 `type=\"text\"` 完全相同。请记住，这种隐藏密码的技术只能防止他人窥视屏幕提供极微的保护；对于传输的密码并不包含任何加密或其他保护。\n\
  \n`size` 属性表示文本输入框的宽度大约应该是多少个字符宽。如果你使用的是等宽字体，则输入的宽度将取决于用户输入的内容。如果输入内容过长而无法容纳在框内，大多数网页浏览器会自动将文本向左滚动。在大多数大多数现代表单中，这个属性通常被省略了，因为设计人员会在\
  \ CSS 中定义框的宽度和高度。\n\n`maxlength` 属性决定允许用户在文本框中输入的字符数。如果用户尝试输入超过指定的长度，多出的字符将不会出现。你可以指定比文本框物理尺寸长、短或相同的长度。`size`\
  \ 和 `maxlength` 属性仅用于旨在输入文本值的输入字段，例如 `type=\"text\"`、`type=\"email\"`、`type=\"URL\"\
  ` 和 `type=\"tel\"`，但不用于复选框和单选按钮，因为这些具有固定尺寸。\n\n### 为每项表单数据命名\n\n无论输入元素是什么类型，你都必须为它收集的数据指定一个名称。你可以为每个输入项使用任何喜欢的名称，只要表单上的每一项都是不同的（单选按钮和复选框除外，在本节稍后的部分会讨论）。当表单被后端脚本处理时，每个数据项都通过名称进行标识。该名称将变成一个变量，并填充一个值。该值可以是用户在表单中输入的内容，也可以是用户选择的元素关联的值。\n\
  \n例如，如果用户在之前定义的文本框中输入了 **Jane Doe**，一个变量会被发送到表单处理脚本；该变量为 `user_name`，变量的值为 `Jane\
  \ Doe`。表单处理脚本就是通过这类变量名和值工作的。\n\n**注意**\n\n为了方便在这些课程范围内进行解释，这里的表单处理脚本被过度简化了。提供给处理脚本的变量的确切外观（或名称）取决于该脚本的编程语言。但从概念上讲，可以认为输入元素的名称变成了变量的名称，而输入元素的值变成了后端该变量的值。\n\
  \n要在 JavaScript 中使用此文本字段（或其他字段）时，记住文本对象使用 `name` 属性；你可以像这样引用上一个代码段中字段的值：\n\n点击此处查看代码图像\n\
  \n```\ndocument.formname.user_name.value\n```\n\n### 为每项表单数据标记标签\n\n为你的表单数据标记标签与使用\
  \ `name` 或 `id` 属性来标识表单元素以备以后是不一样的。相反，`<label></label>` 标签对包裹了文本，这些文本充当表单元素的某种说明（caption）。表单元素\
  \ `<label>` 为该元素提供了额外的上下文，这对于屏幕阅读器软件尤为重要。\n\n你可以在 列表 27.1 中看到两个不同的示例。首先，你可以看到 `<label>`\
  \ 包裹着用户被问的第一个问题（“你叫什么名字？”）。使用 `for` 属性将此标签与具有相同 `id` 的 `<input>` 元素绑定（在此例中，为 `the_name`）：\n\
  \n点击此处查看代码图像\n\n```html\n<p><label class=\"question\" for=\"the_name\">What is your\
  \ name?</label>\n<input type=\"text\"id=\"the_name\"name=\"the_name\"\n      placeholder=\"\
  Enter your full name.\"\n      size=\"50\"requiredautofocus></p>\n```\n\n**注意**\n\
  \n`<label>` 元素不仅用于屏幕阅读器。它让表单字段更具可用性，因为当用户点击标签时，焦点会移动到该表单字段。\n\n屏幕阅读器会向用户读出“你叫什么名字？”，然后说“文本框”，提醒用户用适当的信息填写文本字段。在\
  \ 列表 27.1 的另一个示例中，你看到使用 `<label>` 包裹复选框列表中的不同选项（在列表的后半部分还有单选按钮列表）：\n\n点击此处查看代码图像\n\
  \n```html\n<p><span class=\"question\">Please check all that apply:</span><br>\n\
  <input type=\"checkbox\"id=\"like_it\"name=\"some_statements[]\"\n      value=\"\
  I really like your web site.\">\n<label for=\"like_it\">I really like your web site.</label>\n\
  \n<p><span class=\"question\">Please check all that apply:</span><br>\n<input type=\"\
  checkbox\"id=\"like_it\"name=\"some_statements[]\"\n      value=\"I really like\
  \ your web site.\">\n...\n<label for=\"no_taste\">I have no taste and I'm pretty\
  \ dense, so your\ndidn't do much for me.</label></p>\n```\n（注：原文中第二个示例的 HTML 有误，已根据提供的标签保留结构）。\n\
  \n### 分组表单元素\n\n在 列表 27.1 中，你可以看到使用 `<fieldset>` 和 `<legend>` 元素来分组。`<fieldset>`\
  \ 元素仅定义分组；`<legend>` 元素包含将显示或描述此分组的文本，例如来自 列表 27.1 的内容（下文再次引用）：\n\n点击此处查看代码图像\n\n\
  ```html\n<fieldset>\n  <legend>Personal Information</legend>\n  <p>\n    <label\
  \ class=\"question\" for=\"the_name\">What is your name?</label>\n    <input type=\"\
  text\"id=\"the_name\"name=\"the_name\"\n          placeholder=\"Enter your full\
  \ name.\"\n          size=\"50\"requiredautofocus>\n  </p>\n</fieldset>\n```\n\n\
  在这种情况下，当屏幕阅读器读取与表单元素相关的 `<label>` 时（正如你在上一节中学到的），它还会附加`<legend>` 文本。在上面的示例中，它会被读作“个人信息。你叫什么名字？文本框。”`<fieldset>`\
  \ 和 `<legend>` 元素可以使用 CSS 进行样式，因此分组元素的视觉提示可以很容易地变得可见。\n\n### 在表单中包含隐藏数据\n\n想向处理表单的服务器脚本发送某些数据项，但不想让看到这些数据项？使用带有\
  \ `type=\"hidden\"` 属性的 `<input>` 标签。该属性对显示没有影响；它只是在提交表单时，将你指定的任何名称和值添加到表单结果中。\n\
  \n\n\n\n\n如果你正在使用网络主机托管商提供的表单处理脚本，可能会被要求使用此属性来告知脚本将表单结果发送到哪个电子邮箱。例如，包含以下代码会导致结果在提交表单后被发送到\
  \ `me@mysite.com`：\n\n点击此处查看代码图像\n\n```html\n<input type=\"hidden\"name=\"mailto\"\
  value=\"me@mysite.com\">\n```\n\n你有时会看到脚本使用隐藏输入元素（hidden input elements）来携带额外数据，这些数据在你接收表单提交结果时可能有用；隐藏表单字段的一些示例包括电子邮件地址和邮件主题。如果你使用的是网络主机托管商提供的脚本，请咨询该脚本附带文档，以获取有关可能需要的额外隐藏字段的详细信息。\n\
  \n## 探索表单输入控件\n\n可以使用多种输入控件从用户处获取信息。你已经看到过一种文本输入选项；接下来的几节将向你介绍设计表单时可以其余大多数表单输入选项。\n\
  \n### 复选框\n\n除了文本字段外，最简单的输入类型之一是 `check box`（复选框），它显示为一个小正方形。用户可以点击复选框来选择或取消选择组中的一个或多个项目。例如，示例\
  \ 27.1 中的复选框显示在文本“请勾选所有适用项”之后，这意味着用户可以勾选所有适用项。\n\n示例 27.1 中复选框的 HTML 代码显示，所有复选框的\
  \ `name` 属性值相同：\n\n点击此处查看代码图像\n\n```html\n<span class=\"question\">Please check\
  \ all that apply:</span><br>\n<input type=\"checkbox\"id=\"like_it\"name=\"some_statements[]\"\
  \ value=\"I really like your web site.\">\n<label for=\"like_it\">I really like\
  \ your web site.</label><br>\n<input type=\"checkbox\"id=\"the_best\"name=\"some_statements[]\"\
  \ value=\"It's one of the best sites I've ever seen\">\n<label for=\"the_best\"\
  >It's one of the best sites I've ever seen.</label><br>\n<input type=\"checkbox\"\
  id=\"jealous\"name=\"some_statements[]\" value=\"I sure wish my site looked as good\
  \ as yours.\">\n<label for=\"jealous\">I sure wish my site looked as good as yours.</label><br>\n\
  <input type=\"checkbox\"id=\"no_taste\"name=\"some_statements[]\" value=\"I have\
  \ no taste and I'm pretty dense, so your site didn't do much for me.\">\n<label\
  \ for=\"no_taste\">I have no taste and I'm pretty dense, so your site didn't do\
  \ much for me.</label>\n```\n\n`name` 属性中使用方括号 `[]` 表向后端处理脚本，一系列值将被放入这一个变量中，而不是只使用一个值。（嗯，如果用户只选择了一个复选框，那么它可能只是一个值。）如果用户选择了第一个复选框，文本字符串\
  \ `I really like your web site.` 被放入 `website_response[]` 桶中。如果用户选择了第三个复选框，文本字符串\
  \ `I sure wish my site looked as good as yours.` 也被放入 `website_response[]` 桶中。处理脚本随后会将该变量作为一个数据数组来处理，而不是单个条目。\n\
  \n**注意**\n\n如果你发现输入元素的标签（label）显示得离元素太近，只需在 `<input>` 标签结束处和标签文本开始处添加一个空格，如下：\n\n\
  点击此处查看代码图像\n\n```html\n<input type=\"checkbox\" name=\"mini\">\n<label>Mini Piano\
  \ Stool</label>\n```\n\n然而，你可能会看到一组复选框，该组内的变量使用了独立的名称。例如，以下是编写复选框组的另一种方式：\n\n点击此处查看代码图像\n\
  \n```html\n<p>\n<span class=\"question\">Please check all that apply:</span><br>\n\
  <input type=\"checkbox\" id=\"like_it\" name=\"liked_site\" value=\"yes\" value=\"\
  I really like your web site.\">\n<label for=\"like_it\">I really like your web site.</label><br>\n\
  <input type=\"checkbox\" id=\"the_best\" name=\"liked_site\" value=\"yes\" value=\"\
  It's one of the best sites I've ever seen\">\n<label for=\"the_best\">It's one of\
  \ the best sites I've ever seen.</label><br>\n<input type=\"checkbox\" id=\"jealous\"\
  \ name=\"liked_site\" value=\"yes\" value=\"I sure wish my site looked as good as\
  \ yours.\">\n<label for=\"jealous\">I sure wish my site looked as good as yours.</label><br>\n\
  <input type=\"checkbox\" id=\"no_taste\" name=\"liked_site\" value=\"yes\" value=\"\
  I have no taste and I'm pretty dense, so your site didn't do much for me.\">\n<label\
  \ for=\"no_taste\">I have no taste and I'm pretty dense, so your site didn't do\
  \ much for me.</label>\n</p>\n```\n\n\n\n\n要创建一个单选按钮（radio button），请使用 `type`=```\"\
  radio\"` 并为每个选项提供自己的 `<input>` 标签。同一组中的所有单选按钮使用相同的 `name`，但你不需要像使用复选框那样的使用 `[]`，因为你不需要适应多个答案：\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"radio\" id=\"vote_yes\" name=\"vote\" value=\"\
  yes\" checked>\n<label for=\"vote_yes\">Yes</label><br>\n<input type=\"radio\" id=\"\
  vote_no\" name=\"vote\" value=\"no\">\n<label for=\"vote_no\">No</label>\n```\n\n\
  `value` 属性可以是你选择的任何名称或代码。如果你包含了 `checked` 属性，该按钮将默认被选中。具有相同 `name` 的单选按钮最多只能有一个被选中。\n\
  \n在设计表单并在复选框和单选按钮之间进行选择时，请确定所提问或隐含的问题是否只有一种回答方式。如果是，请使用单选按钮。\n\n### 注意\n\n单选按钮的命名是因为它们与旧式按按钮收音机上的按钮相似。那些按钮使用了机械结构，当你按下其中一个按钮时，任何其他被按下的按钮都会弹出。\n\
  \n在脚本方面，单选按钮与复选框相似，不同之处在于整组按钮共享单个名称和单个对象。你可以引用 `radio` 对象的列以下属性：\n\n* ![Image](img/arrow.jpg)\
  \ `name`—指定单选按钮的共用名称。\n* ![Image](img/arrow.jpg) `length`—指定组中单选按钮的数量。\n\n要在 JavaScript\
  \ 中访问各个按钮，你将 `radio` 对象视为一个数组。按钮从 `0` 开始索引。每个单独按钮具有以下属性：\n\n* ![Image](img/arrow.jpg)\
  \ `value`—指定分配给按钮的值。\n* ![Image](img/arrow.jpg) `defaultChecked`—指示 `checked` 属性的值以及按钮的默认状态。\n\
  * ![Image](img/arrow.jpg) `checked`—指定当前状态。\n\n例如，你可以使用此语句选择 `form1` 表单中 `radio1`\
  \ 组中的第一个单选按钮：\n\n点击此处查看代码图片\n\n```javascript\ndocument.form1.radio1[0].checked =\
  \ true;\n```\n\n然而，如果你这样做，请务必根据需要将其他值设置为 `false`。这不会自动完成。你可以使用 `click` 方法在一步中同时完成这两个操作。\n\
  \n和复选框一样，单选按钮有一个 `click` 方法和一个 `onClick` 事件处理程序。每个单选按钮都可以为此事件拥有单独的语句。\n\n### 选择列表\n\
  \n你可以使用 `<select>` 标签同时创建*滚动列表*（scrolling lists）和*下拉选择列表*（pull-down pick lists）。你将此标签配合\
  \ `<option>` 标签使用，如下所示（摘自 列表 27.1）：\n\n点击此处查看代码图片\n\n```html\n<p>\n  <label for=\"\
  how_improve\"><span class=\"question\">你还希望在我的网站上看到什么？</span></label><br>\n  <select\
  \ id=\"how_improve\"name=\"how_improve\"size=\"4\"multiple>\n    <optgroup label=\"\
  Preferred\">\n      <option value=\"Nothing. It's perfect.\">没有了。非常完美。</option>\n\
  \    </optgroup>\n    <optgroup label=\"Likely\">\n      <option value=\"More about\
  \ the animals.\">更多关于动物。</option>\n      <option value=\"More about the dandelions.\"\
  >更多关于蒲公英。</option>\n    </optgroup>\n    <optgroup label=\"Unlikely\">\n      <option\
  \ value=\"More about Elvis.\">更多关于猫维斯斯。</option>\n    </optgroup>\n  </select>\n\
  </p>\n```\n\n与你在之前一节中简单学过的 `text` 输入类型不同，这里的 `size` 属性决定了选择列表中一次显示多少项内容。如果在前面的代码中使用\
  \ `size`=```\"2\"`，则只有前两个选项可见，并且列表旁边会出现滚动条，以便户可以向下滚动查看第三和第四个选项。\n\n包含 `multiple`\
  \ 属性允许用户一次选择多个选项；`selected` 属性使某个选项默认被选中。当表单提交时，每个选项的 `value` 属性中指定的文本将随所选选项一起提交。\n\
  \n### 注意\n\n如果你省略 `size` 属性或指定 `size=\"1\"`，则列表将创建一个简单的下拉选择列表。选择列表不允许多选；它在逻辑上等同于一组单选按钮。下面的示例显示了另一种为问题选择“是”或“否”的方法：\n\
  \n点击此处查看代码图片\n\n```html\n<select name=\"vote\">\n  <option value=\"yes\">是</option>\n\
  \  <option value=\"no\">否</option>\n</select>\n```\n\n选择列表的对象是 `select` 对象。该对象具有以下属性：\n\
  \n* ![Image](img/arrow.jpg) `name`—指定列表的名称。\n* ![Image](img/arrow.jpg) `length`—指定选项的数量。\n\
  * ![Image](img/arrow.jpg) `options`—指定选项的组。\n* ![Image](img/arrow.jpg) `selectedIndex`—返回当前选中项的索引。\n\
  \n`options` 数组拥有自己的单一属性 `length`，指示选项的数量。此外，`options` 数组中的每个项具有：\n\n* ![Image](img/arrow.jpg)\
  \ `index`—指定数组的索引。\n* ![Image](img/arrow.jpg) `defaultChecked`—指示 `checked` 属性的状态。\n\
  * ![Image](img/arrow.jpg) `selected`—将其设置为 `true` 会选中该选项。\n* ![Image](img/arrow.jpg)\
  \ `name`—供服务器使用。\n* ![Image](img/arrow.jpg) `text`—显示在选项中的文本。\n\n`select` 对象有两个方法——`blur`\
  \ 和 `focus`——其用途与 `text` 对象相同。事件处理程序为 `onBlur`、`onFocus` 和 `onChange`，类似于其他对象。\n\
  \n### 注意\n\n你可以动态更改选择列表；例如，在一个列表中选择产品可以决定另一个列表中哪些选项。你还可以从列表中添加或删除选项。\n\n读取选中值是一个两步过程。你首先使用\
  \ `selectedIndex` 属性，然后使用 `value` 属性找到被选中项的值。例如：\n\n点击此处查看代码图片\n\n```javascript\n\
  ind = document.form1.choice.selectedIndex;\nval = document.form1.choice.options[ind].value;\n\
  ```\n\n此示例使用 `ind` 变量存储选中索引，并将 `val` 变量赋值为选中项的值。对于多选，情况变得复杂：你必须单独测试每个选项的 `selected`\
  \ 属性。\n\n`<select>` 和 `</select>` 标签之间除了 `<option>` 和 `<optgroup>` 之外不应出现其他 HTML\
  \ 元素。如下代码所示，使用 `<optgroup>` 可以创建一个选项组，其标签显示在列表中不能作为表单字段的“答案”被选中：\n\n点击此处查看代码图片\n\
  \n```html\n<select name=\"grades\" size=\"8\">\n  <optgroup label=\"Good Grades\"\
  >\n    <option value=\"A\">A</option>\n    <option value=\"B\">B</option>\n  </optgroup>\n\
  \  <optgroup label=\"Average Grades\">\n    <option value=\"C\">C</option>\n  </optgroup>\n\
  \  <optgroup label=\"Bad Grades\">\n    <option value=\"D\">D</option>\n    <option\
  \ value=\"F\">F</option>\n  </optgroup>\n</select>\n```\n\n\n\n\n此代码段会生成一个下拉列表，外观类似于图\
  \ 27.2 中的示例所示。\n\n![下拉列表示例，包含三个 optgroup 元素：良好成绩、中等成绩和差成绩。这三组及其相应的选项值以层级方式显示。](img/27fig02.jpg)\n\
  \n**图 27.2** 使用 `<optgroup>` 元素分隔选项的下拉列表。\n\n在这种情况下，只有 A、B、C、D 和 F 是可选的，但 `<optgroup>`\
  \ 标签是可见的。\n\n### 文本字段、文本区域和其他输入类型\n\n本节早些提到的 `<input type=\"text\">` 属性允许用户输入单行文本。当你希望在单个输入项中允许输入多行文本时，请使用\
  \ `<textarea>` 和 `</textarea>` 标签创建一个文本区域，而不仅仅是文本字段。包含在这两个标签之间的任何文本都将显示为该框中的默认输入。以下是来自列表\
  \ 27.1 的示例：\n\n点击此处查看代码图像\n\n```html\n<textarea id=\"message\" name=\"message\"\
  \ rows=\"7\" cols=\"55\">     \n</textarea>\n```\n\n### 注意\n\n如果你正在添加文本输入元素，则不需要\
  \ `type=\"text\"` 属性。如果你省略它，网络浏览器将默认认为它是文本字段。\n\n正如你可能猜到的那样，`rows` 和 `cols` 属性控制输入框中容纳的文本行数列数。`cols`\
  \ 属性没有 `rows` 那么精确，它大约是一行文本容纳的字符数。然而，文本区域框具有滚动条，因此用户输入的文本可以超过显示区域的容纳范围。\n\n`text`\
  \ 和 `textarea` 对象还有几个你可以使用的 JavaScript 方法：\n\n* ![Image](img/arrow.jpg) `focus`—将焦点设置到字段。这会将光标置于字段中并使其当前字段。\n\
  * ![Image](img/arrow.jpg) `blur`—移除字段的焦点；是 `focus` 的反操作。\n* ![Image](img/arrow.jpg)\
  \ `select`—选中字段中的文本，就像用户使用鼠标操作的那样。所有文本都会选中；没有办法只选中部分文本。\n\n你还可以使用事件处理器来检测文本字段值的变化。`text`\
  \ 和 `textarea` 对象支持以下事件处理器：\n\n* ![Image](img/arrow.jpg) `onFocus`—当文本字段获得焦点时发生。\n\
  * ![Image](img/arrow.jpg) `onBlur`—当文本字段失去焦点时发生。\n* ![Image](img/arrow.jpg) `onChange`—当用户更改字段中的文本并离开该字段时发生。\n\
  * ![Image](img/arrow.jpg) `onSelect`—当用户选择字段中的部分或全部文本时发生。遗憾的是，无法确切判断选中了文本的哪部分。（如果使用前述描述的\
  \ `select` 方法选取文本，则不会触发此事件。）\n\n如果使用了这些事件处理器，它们应该被包含在 `<input>` 标签声明中。例如，以下是一个包含\
  \ `onChange` 事件并显示警报框的文本字段：\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\" name=\"\
  text1\" onChange=\"window.alert('Changed.');\">\n```\n\n然而，让我们回到基础的 `<input>` 元素一下，因为\
  \ HTML5 为输入提供了比简单的 `\"text\"` 多多的 `type` ，例如内置的日期选择器。以下是一些完全支持的不同输入类型（有些是新的，有些不是），但我们在这节中还没有对它们进行详细讨论：\n\
  \n* ![Image](img/arrow.jpg) `type=\"email\"`—它看起来像普通的文本字段，但当使用表单验证时，内置验证器会检查它是否为良好的电子邮件地址。某些移动设备默认显示相关的按键（例如\
  \ `@` 符号），而不是需要额外的用户交互。\n* ![Image](img/arrow.jpg) `type=\"file\"`—这种输入类型会打开一个对话框，允许你在计算机上搜索文件并上传。\n\
  * ![Image](img/arrow.jpg) `type=\"number\"`—不是为每个数字创建一个带有 `<option>` 标签的 `<select>`\
  \ 列表，这种类型允许你指定 `min` 和 `max` 值以及数字之间的 `step`，从而在浏览器端自动生成列表。你可以在列表 27.1 中看到它的用法。\n\
  * ![Image](img/arrow.jpg) `type=\"range\"`—与刚刚提到的 `number` 类型类似，这种类型允许你指定 `min`\
  \ 和 `max` 值以及数字之间的 `step`，在这种情况下，它显示为水平滑块。\n* ![Image](img/arrow.jpg) `type=\"search\"\
  `—它看起来像普通的文本字段，但当使用表单验证时，内置验证器会检查它是否为良好的电子邮件地址。某些移动设备默认显示相关的按键（例如 `@` 符号），而不是需要额外的用户交互。\n\
  \n#### 为文本字段添加数据\n\n一旦你有一个文本字段，就可以为其添加数据以向客户提供建议值列表。要添加数据，你需要在页面上添加 `<datalist>`，然后在希望显示数据的字段中链接到该列表。以下是列表\
  \ 27.1 中的具体实现方式：\n\n点击此处查看代码图像\n\n```html\n<p>\n  <label for=\"the_worst\"><span\
  \ class=\"question\">请指出我可以改进我网站的一点：</span></label><br>\n  <input type=\"text\"\
  \ id=\"the_worst\" name=\"the_worst\" placeholder=\"没有什么吧？\" list=\"listOfBadChoices\"\
  \ size=\"50\">\n</p>\n\n<datalist id=\"listOfBadChoices\">\n  <option value=\"nothing\"\
  ></option>\n  <option value=\"nada\"></option>\n  <option value=\"zip\"></option>\n\
  \  <option value=\"zilch\"></option>\n  <option value=\"I can't think of anything\"\
  ></option>\n</datalist>\n```\n\n`<datalist>` 由 `<option>` 元素组成。`<option>` 元素是输入字段可以使用的值列表`<datalist>`\
  \ 的 `id` 与 `<input>` 字段中的 `list` 值匹配。\n\n当用户到达该 `<input>` 字段时，支持的浏览器将显示选项列表，如图 27.3](#ch27.xhtml_ch27fig03)所示。<datalist>`\
  \ 元素的巧妙之处在于，不支持它的浏览器只会像往一样显示文本字段。\n\n### 使用 HTML5 表单验证\n\nHTML5 中的许多功能让 Web 开发者变成了非常快乐的人。其中最简单但改变生活之一可能是表单验证的引入。在\
  \ HTML5 表单验证出现之前，我们必须创建复杂的基于 JavaScript 表单验证，这让参与的人都感到头疼。\n\n\n\n\n但不再如此了！HTML5\
  \ 默认会对表单进行验证，除非你在 `<form>` 元素中使用 `novalidate` 属性。当然，如果你没有在任何表单字段本身中使用 `required`\
  \ 属性，或者没有使用特定的输入 `type` 选项（如 `email` 或 `url`），那么就没有内容需要进行验证。正如你在之前一节中学习到的，字段不仅对内容进行验证（任何内容），还根据它们所属类型进行验证。例如，列表\
  \ 27.1 包含一个电子邮件地址的必填字段：\n\n点击此处查看代码图像\n\n```html\n<p>\n  <label class=\"question\"\
  \ for=\"the_email\">What is your email address?</label>\n  <input type=\"email\"\
  \ id=\"the_email\" name=\"the_email\"\n          placeholder=\"Please use a real\
  \ one!\"\n          size=\"50\" required>\n</p>\n```\n\n在图 27.4 和 27.5 中，你可以看到表单会自动验证内容是否存在，但当你尝试在字段中输入垃圾字符串而不是电子邮件地址时，它也会“教训”你。\n\
  \n![截图显示了提交一个带有必填字段为空的表单的结果。它显示了一个弹出消息，内容为：请填写此字段。](img/27fig04.jpg)\n\n**图 27.4**\
  \ 尝试在必填字段没有内容的情况下提交表单会导致验证错误。\n\n![截图显示了提交一个包含格式不可接受的内容的表单的结果。它显示了一个弹出消息，内容为：请输入电子邮件地址。](img/27fig05.jpg)\n\
  \n**图 27.5** 尝试在期望电子邮件地址的字段中提交格式不当内容的表单会导致验证错误。\n\n### 注意\n\n电子邮件地址的验证开始并结束于输入的内容看起来像是一个电子邮件地址。这种模式匹配实际上是你对电子邮件地址所能做的唯一类型的“验证”，除非使用耗耗时的后端处理脚本。\n\
  \n你可以使用 `<input>` 字段的 `pattern` 属性来指定你自己的模式匹配要求。`pattern` 属性使用正则表达式，这是一个足够大的话题，值得专门写一本书，但在这里我们考虑一个基础示例。如果你想确保你的\
  \ `<input>` 元素只包含数字和字母（没有特殊字符），你可以使用以下代码：\n\n点击此处查看代码图像\n\n```html\n<input type=\"\
  text\" id=\"the_text\" name=\"the_text\"\n      placeholder=\"Please enter only\
  \ letters and numbers!\"\n      size=\"50\" pattern=\"[a-z,A-Z,0-9]\" required>\n\
  ```\n\n这里的模式表示，如果字段包含 `a` 到 `z` 之间的任何字母、`A` 到 `Z` 之间的字母（区分大小写）以及 `0` 到 `9` 之间的数字，它就是有效的。要了解更多关于正则表达式而不买一整本书，请查看\
  \ [`regexone.com`](http://regexone.com)上的在线教程。\n\n### 提交表单数据\n\n表单通常包含一个按钮，用于将表单数据提交到服务器上的脚本或调用\
  \ JavaScript 操作。你可以使用 `value` 属性在提交按钮上放置你喜欢的任何标签：\n\n点击此处查看代码图像\n\n```html\n<input\
  \ type=\"submit\" value=\"Place My Order Now!\">\n```\n\n除非使用 CSS 更改样式，否则灰色的按钮大小将适应你在\
  \ `value` 属性中放置的标签。当用户点击它时，表单上的所有数据项都将发送到表单 `action` 属性指定的电子邮件地址或脚本。\n\n你还可以包含一个重置按钮，它可以清除表单上的所有条目，这样用户在改变主意或出错时就可以重新开始。使用以下代码：\n\
  \n点击此处查看代码图像\n\n```html\n<input type=\"reset\" value=\"Clear This Form and Start\
  \ Over\">\n```\n\n如果你觉得标准的提交和重置按钮看起来有点单调，请记住你可以使用 CSS 对它们进行样式化。如果这还不够，你会很高兴地知道有一种简单的方法可以用你自己的图形替换这些按钮。要使用你选择的图像作为提交按钮，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```html\n<input type=\"image\" src=\"button.gif\" alt=\"Order Now!\"\
  >\n```\n\n`button.gif` 图像显示在页面上，当用户点击 `button.gif` 图像时，表单就会提交。你可以包含任何通常用于 `<img>`\
  \ 标签的属性，例如 `alt` 和 `style`。\n\n另一个表单元素是通用按钮类型。在 `<input>` 标签中使用 `type=\"button\"\
  ` 时，你会得到一个自身不执行任何操作的按钮，但可以通过 JavaScript 事件处理程序（如 `onclick`）为其分配一个操作。\n\n#### 理解\
  \ `<button>` 元素\n\n在处理表单时，你可以使用 HTML `<button>` 元素。`<button>` 可以具有三种 `type` 值：`button`、`reset`\
  \ 或 `submit`。通过 JavaScript 事件处理程序（如 `onclick`），你可以为 `<button>` 元素分配操作。这正如列表 27.1\
  \ 所示的：\n\n[content]\n<button type=\"button\" id=\"standardValues\">Fill in Values</button>\n\
  [/content]\n\n这创建了一个文本为“Fill in Values”的按钮。如果你留这样做，它在被点击时什么都不做，但你可以添加 JavaScript\
  \ 让表单填充值，然后用户只需提交表单。列表 27.2 显示了这一点：\n\n**图 27.2** 填充表单值\n\n点击此处查看代码图像\n\n```javascript\n\
  document.getElementById(\"standardValues\").addEventListener(\"click\", function()\
  \ {\n  document.getElementById(\"the_name\").value = \"Your Name\";\n  document.getElementById(\"\
  the_email\").value = \"you@domain.com\";\n  gbForm.like_it.checked = true;\n  gbForm.choose_scale.value\
  \ = \"10\";\n  gbForm.the_best.checked = true;\n  gbForm.best_thing[2].checked =\
  \ true;\n  document.getElementById(\"the_worst\").value = \"Nothing\";\n  gbForm.how_improve.value\
  \ = \"More aboutandelions.\";\n  document.getElementById(\"errors\").innerHTML =\
  \ \"<p>Don't forget to give your feedback and submit the form.</p>\";\n  gbForm.message.focus();\n\
  });\n```\n\n此脚本告诉浏览器，当 `standardValues` 按钮被点击时，它应该更改各个字段的值。最后一行将光标放在 `message` 字段中，以便用户填写个人信息并提交表单。\n\
  \n你可能注意到此表单向 `errors` 字段附加内容。该字段是一个 `<output>` 元素，用于描述表单的输出。错误消息看起来并不完全是表单的*输出*，但如果你想动态地向表单添加内容，这就是你应该使用的元素。在列表\
  \ 27.1 中，`<output>` 元素位于表单顶部，但你可以将其放在任何你想显示信息的地方。\n\n警告\n\nInternet Explorer 和 Edge\
  \ 浏览器不支持 `<output>` 元素。因此，为了最有效地使用它，你应该在内部添加一个 `<div>` 或其他元素并将你的输出放在其中。\n\n####\
  \ 使用 JavaScript 处理表单事件\n\n`form` 对象具有两个方法：`submit` 和 `reset`。你可以使用这些方法自己提交数据或重置表单，而不需要用户点击按钮。你可能想这样做，例如，当用户点击图像或执行其他通常不会提交表单的操作时提交表单。\n\
  \n\n\n\n[content]\n如果你使用 `submit` 方法将数据发送到服务器或通过电子邮件，大多数浏览器都会提示用户核实他或她是否想要提交这些信息。没有办法在用户不知情的情况下执行此操作。\n\
  \n`form` 对象有两个事件处理器，`onSubmit` 和 `onReset`。你可以在定义表单的 `<form>` 标签内为这些事件指定一组 JavaScript\
  \ 语句或函数调用。\n\n如果你为 `onSubmit` 事件指定了语句或函数，则该语句会在数据提交到服务器端脚本之前被调用。你可以通过从 `onSubmit`\
  \ 事件处理器中返回值 `false` 来阻止提交的发生。如果语句返回 `true`，则数据将被提交。同样地，你可以通过 `onReset` 事件处理器阻止重置按钮（Reset\
  \ button）的作用。\n\n### 使用 JavaScript 访问表单元素\n\n`form` 对象最重要的属性是 `elements` 数组，它包含每个表单元素对应的一个对象。你可以通过元素自身的名称或它在数组中的索引来引用元素。例如，以下两个表达式都引用了列表\
  \ 27.1 中所示表单的第一个元素：\n\n```\ndocument.gbForm.elements[0]\ndocument.gbForm.the_name\n\
  ```\n\n### 注意\n\n表单和元素都可以通过它们自身的名称或作为 `forms` 和 `elements` 数组中的索引来引用。为了清晰起见，本节中的示例使用了具体的表单和元素名称，而不是数组引用。你也会发现自己在自己的脚本中使用名称会更方便。\n\
  \n如果你确实将表单和元素作为数组引用，可以使用 `length` 属性来确定数组中对象的数量：`document.forms.length` 是文档中表单的数量，而\
  \ `document.gbForm.elements.length` 是 `gbForm` 表单中元素的数量。\n\n你也可以通过 W3C DOM 访问表单元素。在这种情况下，你会在\
  \ HTML 文档的表单元素可以使用 `id` 属性，并使用 `document.getElementById` 方法来查找表单对象。例如，该语句找到名为 `the_name`\
  \ 的文本字段对象并将其存储在变量 `name` 中：\n\n[点击此处查看代码图片\n\n```\nname = document.getElementById(\"\
  the_name\");\n```\n\n这使你能够快速访问表单元素，而无需先找到 `form` 对象。如果你需要处理表单的属性和方法，可以为 `<form>`\
  \ 标签分配一个 `id`，并找到相应的对象。\n\n### 显示表单数据\n\n作为一个纯纯客户端与表单交互的简单示例，列表 27.3 显示了一个包含名称、地址和电话号码字段的表单，以及一个用于在弹出窗口中显示表单数据的\
  \ JavaScript 函数。\n\n**列表 27.3** 一个在弹出窗口中显示数据的表单\n\n点击此处查看代码图片\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Form Display</title>\n\
  \  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n</head>\n\
  <body>\n  <h1>Form Display Example</h1>\n  <p>Enter the following information. When\
  \ you press the Display button, the data will be displayed in a pop-up.</p>\n  <form\
  \ name=\"form1\" method=\"get\" action=\"\">\n    <p>NAME: <input name=\"name\"\
  \ size=\"50\"></p>\n    <p>ADDRESS: <input name=\"address\" size=\"50\"></p>\n \
  \   <p>PHONE: <input name=\"phone\" size=\"50\"></p>\n    <input type=\"button\"\
  \ value=\"Display\" id=\"display\">\n  </form>\n  <script>\n    function display()\
  \ {\n      dispWin = window.open('','',400,100);\n      message = \"<ul><li>NAME:\
  \ \" + document.form1.name.value;\n      message += \"<li>ADDRESS: \" + document.form1.address.value;\n\
  \      message += \"<li>PHONE: \" + document.form1.phone.value;\n      message +=\
  \ \"</ul>\";\n      dispWin.document.write(message);\n    }\n    document.getElementById(\"\
  display\").addEventListener(\"click\", display);\n  </script>\n</body>\n</html>\n\
  ```\n\n### 总结\n\n在本节中，你学习了如何创建 HTML 表单，以便用户提供信息。你学习了所有主要的表单元素，以及如何在 JavaScript 中处理\
  \ `name` 和 `value` 属性。\n\n本节未涵盖后端表单处理，因为这需要外部脚本。然而，你有很多可以练习，以设置表单。\n\n表 27.1 总结了本节涵盖的\
  \ HTML 标签和属性。\n\n| 标签/属性 | 功能 |\n| :--- | :--- |\n| `<form>`…`</form>` | 表示一个表单。\
  \ |\n| 属性 | |\n| `action`=`*\"scripturl\"`* | 处理此表单输入的脚本地址。 |\n| `method`=`*\"post/get\"\
  `* | 指明如何发送表单输入数据。通常设置为 `post` 而不是 `get`。 |\n| `<label>`…`</label>` | 为关联的表单元素提供信息。\
  \ |\n| `<fieldset>`…`</fieldset>` | 分组相关的表单元素。 |\n| `<legend>`…`</legend>` | 为一组相关的表单元素提供标签。\
  \ |\n| `<input>` | 表示表单中的输入元素。 |\n| 属性 | |\n| `type`=`*\"controltype\"`* | 给出输入控件的类型。可能的值包括\
  \ `checkbox`、`hidden`、`radio`、`reset`、`submit`、`text` 和 `image` 等。 |\n| `name`=`*\"\
  name\"`* | 给出项目的唯一名称，传递给脚本。 |\n| `value`=`*\"value\"`* | 给出文本或隐藏项目的默认值。对于复选框或单选按钮，它是随表单提交的值。对于重置或提交按钮，它是按钮的标签。\
  \ |\n| `src`=`*\"imageurl\"`* | 显示图片的源文件。 |\n| 属性 | |\n| `checked` | 用于复选框和单选按钮。表示该项目已选中。\
  \ |\n\n\n\n\n\n| `autofocus` | 表单加载时将焦点置于元素。 |\n| `required` | 表示该字段应根据类型（在适用情况下）进行内容验证。\
  \ |\n| `pattern=\"pattern\"` | 表示此字段的内容应根据此正则表达式进行验证。 |\n| `size=\"width\"` | 指定文本输入区域的宽度，以字符为单位。\
  \ |\n| `maxlength=\"maxlength\"` | 指定文本区域中可以输入的最大字符数。 |\n| `<textarea>…</textarea>`\
  \ | 表示多行文本输入表单元素。可以包含默认文本。 |\n\n| 属性 | 功能 |\n| :--- | :--- |\n| `name=\"name\"`\
  \ | 指定传递给脚本的名称。 |\n| `rows=\"numrows\"` | 指定此文本区域显示的行数。 |\n| `cols=\"numchars\"\
  ` | 指定此文本区域显示的列数（字符数）。 |\n| `autofocus` | 表单加载时将焦点置于元素。 |\n| `required` | 表示该字段应根据类型（在适用情况下）进行内容验证。\
  \ |\n| `pattern=\"pattern\"` | 表示此字段的内容应根据此正则表达式进行验证。 |\n| `<select>…</select>`\
  \ | 创建可能项目的菜单或滚动列表。 |\n\n| 属性 | 功能 |\n| :--- | :--- |\n| `name=\"name\"` | 显示传递给脚本的名称。\
  \ |\n| `size=\"numelements\"` | 指定要显示的元素数量。如果指定了 `size`，则选择变为滚动列表。如果没有给出 `size`，则选择为下拉选择列表。\
  \ |\n| `multiple` | 允许从列表中选择多项。 |\n| `required` | 表示该字段应应对选择进行验证。 |\n| `<optgroup>…</optgroup>`\
  \ | 表示 `<option>` 元素的分组。 |\n\n| 属性 | 功能 |\n| :--- | :--- |\n| `label=\"label\"`\
  \ | 为组提供标签。 |\n| `<option>…</option>` | 表示 `<select>` 中一个可能的项目。 |\n\n| 属性 | 功能 |\n\
  | :--- | :--- |\n| `selected` | 当包含此属性时，默认选中列表中的 `<option>`。 |\n| `value=\"value\"\
  ` | 指定在提交表单时如果选择了此 `<option>` 则要提交的值。 |\n| `<button>…</button>` | 在表单创建一个可点击的按钮。\
  \ |\n\n| 属性 | 功能 |\n| :--- | :--- |\n| `name=\"name\"` | 给此项目唯一的名称，并传递给脚本。 |\n|\
  \ `<output>…</output>` | 代表表单的输出或结果。 |\n\n### 问答\n\n**Q. 有什么方法可以创建大量的文本字段，而无需为所有字段处理不同的名称吗？**\n\
  \n**A.** 有的。如果你在表单的多个元素中使用相同的名称，它们的对象将形成一个数组。例如，如果你定义了 20 个名为 `member` 的文本字段，你可以通过\
  \ `member[0]` 到 `member[19]` 来引用它们。这同样适用于其他类型的表单元素。\n\n**Q. 既然 HTML5 包含了表单验证，我还需要再担心验证吗？**\n\
  \n**A.** 需要的。虽然 HTML5 表单验证非常棒，但你仍然应该在后端对发送的表单信息进行验证。后端处理超出了这些课程的范围，但作为一个原则，你永远不要信任任何用户输入；在执行使用它的操作之前（特别是在与数据库交互时），始终要进行检查。\n\
  \n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固对涵盖材料的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n**1.**\
  \ 你使用哪些 HTML 元素来创建一个询问用户姓名和性别的留言板表单？**\n\n1. 使用 `<input type=\"name\">` 获取姓名，使用\
  \ `<input type=\"gender\">` 获取性别\n2. 使用 `<input type=\"text\">` 获取姓名，使用 `<input\
  \ type=\"radio\">` 获取性别\n3. 使用 `<input type=\"name\">` 获取姓名，使用 `<input type=\"radio\"\
  >` 获取性别\n4. 使用 `<input type=\"text\">` 获取姓名，使用 `<input type=\"gender\">` 获取性别\n\n\
  **2.** 如果你创建一个名为 `submit.gif` 的图像，如何将其作为表单的提交按钮使用？**\n\n1. `<input type=\"button\"\
  \ src=\"submit.gif\">`\n2. `<input type=\"image\" src=\"submit.gif\">`\n3. `<img\
  \ type=\"submit\" src=\"submit.gif\">`\n4. `<submit type=\"submit\" src=\"submit.gif\"\
  >`\n\n**3.** `<form>` 的这些属性中哪个决定数据发送到哪里？**\n\n1. `action`\n2. `method`\n3. `name`\n\
  \n**4.** 表单 `method` 属性的两个值是什么？**\n\n1. `action` 和 `get`\n2. `get` 和 `post`\n3.\
  \ `post` 和 `action`\n\n**5.** 下面是有效的输入吗？**\n\n```html\n<input name=\"this\">\n```\n\
  1. 是。\n2. 否，需要 `type`。\n3. 否，需要 `value`。\n4. 否，需要 `width`。\n\n**6.** 表单的 `novalidate`\
  \ 属性的作用是什么？**\n\n1. 表明没有字段\n2. 指示浏览器不验证 HTML \n3. 指示浏览器不验证表单\n4. \n\n**7.** `<label>`\
  \ 元素是做什么用的？**\n\n1. 创建标签\n2. 表明表单的开始\n3. 表明表单的结束\n4. 为屏幕阅读器定义文本\n\n**8.** 为什么这个表单的\
  \ `name` 中有括号？**\n\n```html\n<input type=\"checkbox\" id=\"cb1\" name=\"answers[]\"\
  \ value=\"one\">\n```\n1. 表示该字段将接受多个值\n2. 表示该字段是必须的\n3. 表示该字段应通过外部表达式验证\n4. 其他原因，设计师想给字段命名带括号\n\
  \n**9.** 下面的 JavaScript 起什么作用？**\n\n```javascript\ndocument.entries.checked = true;\n\
  ```\n1. 选中 `homeAddress` 表单中的 `entries` 选框\n2. 在 `homeAddress` 表单中选中 `entries`\n\
