  \ 4.5 所示。\n\n![截图显示了在错误消息中点击文件名后获得的页面。](img/04fig05.jpg)\n\n**图 4.5** Firefox 友好地指出了有问题的行。\n\
  \n大多数现代浏览器都包含 JavaScript 调试工具，就像你刚刚看到的那样。你将在下一课中了解更多相关信息。\n\n### 总结\n\n在本课中，你了解了什么是\
  \ Web 脚本以及什么是 JavaScript。你还学习了如何将脚本插入 HTML 文档或引用外部 JavaScript 文件、JavaScript 能做什么、以及\
  \ JavaScript 与其他 Web 语言的区别。你还编写了一个简单的 JavaScript 程序，并使用 Web 浏览器进行了测试。你还学习了如何修改和测试脚本，并看到了\
  \ JavaScript 程序遇到错误时会发生什么。\n\n在编写此脚本的过程中，你使用了 JavaScript 的一些基本特性：变量、`document.write`\
  \ 语句以及用于处理日期和时间的函数。\n\n既然你已经学习了一些 JavaScript 语法，你就可以继续学习有关 Web 开发的各种知识，然后着手使用客户端脚本编写交互式网站。\n\
  \n### 问答\n\n**问：我需要在多个浏览器上测试我的 JavaScript 吗？**\n\n**答：** 在理想情况下，任何遵循 JavaScript\
  \ 标准的脚本都能在所有浏览器中运行，而在现实世界中，98% 的情况下（或多或少）确实如此。但浏览器确实有其怪癖，你至少应该在 Chrome、Internet\
  \ Explorer 和 Firefox 以及运行 iOS 和 Android 的移动设备上测试你的脚本。\n\n**问：如果我打算学习 PHP、Ruby 或其他服务器端编程语言，JavaScript\
  \ 对我还有用吗？**\n\n\n\n\n\n**答：** 当然可以。JavaScript 是基于 Web 的应用程序中许多部分的理想语言，例如基本交互功能。尽管\
  \ PHP、Ruby 和其他服务器端语言各有用途，但它们无法在客户端直接与用户交互。\n\n**问：当我尝试运行脚本时，浏览器在浏览器窗口中显示实际脚本，而不是执行它。我哪里做错了？**\n\
  \n**答：** 这很可能是由三种错误之一引起的。首先，你可能缺少开头或结尾的 `<script>` 标签。检查它们，如果你使用了 `type` 属性，请确认它写的是\
  \ `type=\"text/javascript\"`。其次，你的文件可能被保存为 `.txt` 扩展名，导致浏览器将其视为文本文件。将其重命名为 `.htm`\
  \ 或 `.html` 扩展名即可解决问题。第三，确保你的浏览器支持 JavaScript，并且确保它没有在偏好设置中被禁用。\n\n**问：为什么在显示时间的语句中允许使用\
  \ `<strong>` 和 `<p>` 标签？我以为 `<script>` 标签内不允许使用 HTML 标签。**\n\n**答：** 因为这些标签位于引号内，所以它们被视为脚本的有效部分。脚本的输出（包括任何\
  \ HTML 标签）由浏览器解释并显示。你可以在引号内使用其他 HTML 标签来添加格式，例如你为大型时钟显示添加的 `<h2>` 标签。\n\n## 工作坊\n\
  \n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。\n\n### 测验\n\n**1.** 当用户查看包含 JavaScript 程序的页面时，实际执行脚本的是哪台机器？\n\
