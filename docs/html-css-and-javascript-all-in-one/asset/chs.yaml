  \ Purchases)”选项卡下。\n\n点击“启动 (Launch)”链接即可访问产品。\n\n## 代码片段\n\n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请以单列横屏模式查看电子书并将字体大小调整为最小。除了以重流式文本格式呈现代码和配置外，我们还包含了代码图像以模拟纸质书中的呈现方式；因此，当重流格式可能会损害代码列表的显示时，您将看到“点击此处查看代码图像”的链接。点击链接即可查看打印真度的代码图像。要返回之前查看的页面，请点击设备或应用程序上的返回键。\n\
