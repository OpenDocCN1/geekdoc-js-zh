  \n### 语句 (Statements)\n\n语句是 JavaScript 程序的基本单元。一个语句是执行单个操作的代码段。例如，以下四个语句来自第 4 课“理解\
  \ JavaScript”中的日期和时间示例：\n\n```javascript\nnow = new Date();\nhours = now.getHours();\n\
  mins = now.getMinutes();\nsecs = now.getSeconds();\n```\n\n这些语句创建了一个新的 `Date` 对象，然后将当前小时、分钟和秒的值分别赋值给名为\
  \ `hours`、`mins` 和 `secs` 的变量。然后，你可以在 JavaScript 代码中使用这些变量。\n\n虽然语句通常是单行 JavaScript，但并没有规定必须如此。将一个语句跨越多行，或者在单行中包含多个语句是可能的（而且相当常见）。\n\
  \n分号标记语句的结束，但如果你在语句后新起了一行，你也可以省略分号——这取决于你的编码风格。例如，以下是三个有效的 JavaScript 语句：\n\n```javascript\n\
  hours = now.getHours()\nmins = now.getMinutes()\nsecs = now.getSeconds()\n```\n\n\
  #### 注意事项 (Caution)\n\n虽然省略分号是有效的，但许多 JavaScript 错误是由缺少分号引起的。最好养成在语句末尾始终使用分号的习惯以减少错误。\n\
  \n然而，如果你将多个语句组合成单行，必须使用分号来分隔它们。例如，以下行代码是有效的：\n\n点击此处查看代码图像\n\n```javascript\nhours\
  \ = now.getHours(); mins = now.getMinutes(); secs = now.getSeconds();\n```\n\n这一行是无效的：\n\
  \n点击此处查看代码图像\n\n```javascript\nhours = now.getHours() mins = now.getMinutes() secs\
  \ = now.getSeconds();\n```\n\n### 使用函数组合任务 (Combining Tasks with Functions)\n\n\
  函数是一组被视为单个单元的 JavaScript 语句。使用函数的语句被称为`函数调用` (function call)。例如，你可能会创建一个名为 `alertMe`\
  \ 的函数，它在被调用时产生一个警报，如下：\n\n点击此处查看代码图像\n\n```javascript\nfunction alertMe() {\n  \
  \  alert(\"I am alerting you!\");\n}\n```\n\n当此函数被调用时，会弹出一个 JavaScript 警报，框中显示“I\
  \ am alerting you”文本，如图 20.1 所示。\n\n![截图显示了一个网页，左上角有一个写着“Click here”的链接，被一个写有“I\
  \ am alerting you”的警报框覆盖，带有一个“OK”按钮。](img/20fig01.jpg)\n\n**图 20.1** 网页上的警报框。\n\n\
  函数可以接受一个参数——括号内部一个表达式——它告诉函数要做什么。此外，函数可以向等待的变量返回一个值。例如，以下函数调用会提示用户提供响应并将其存储在 `text`\
  \ 变量中：\n\n点击此处查看代码图像\n\n```javascript\ntext = prompt(\"Enter some text.\")\n```\n\
  \n创建你自己的函数有用两个主要原因：首先，你可以分离脚本的逻辑部分，使其更容易理解。第二，也是更重要的一点，你可以多次使用该函数或配合不同的数据使用，以避免重复脚本语句。\n\
  \n### 变量 (Variables)\n\n如果你还记得第 4 课中 JavaScript 的基础介绍，你会记得变量是一个可以存储数字、文本字符串或另一个值的容器。例如，以下语句创建了一个名为\
  \ `fred` 的变量并给其赋值为 `27`：\n\n```javascript\nvar fred = 27;\n```\n\nJavaScript 变量可以包含数字、文本字符串和其他值。你将在第\
  \ 22 课“使用 JavaScript 变量、字符串和数组”中更详细地学习关于变量。\n\n### 理解对象 (Understanding Objects)\n\
  \nJavaScript 还支持`对象` (objects)。像变量一样，对象可以存储数据——但它们可以同时存储两个或多个数据。正如你将在本课程针对 JavaScript\
  \ 的特定课程中学到的那样，使用内置对象及其方法是 JavaScript 的基础；这是该语言运作的方式之一通过提供一组你可以执行的预定义操作。例如，通过你在第\
  \ 19 课“理解动态网站和 HTML5 应用”中看到的 `document.write` 功能，你可以使用 `document` 对象的 `write` 方法将文本输出到浏览器以便最终渲染。\n\
  \n存储在对象中的数据被称为对象的`属性` (properties)。例如，你可以使用对象存储地址录中人员的信息。每个人的对象的属性可能包括姓名、地址和电话号码。\n\
  \n你应该非常熟悉与对象相关的语法，因为你会看到很多对象，即使你不自己构建它们。你肯定会发现自己在使用内置对象，而且对象很可能构成你导入使用的任何 JavaScript\
  \ 库的大部分。JavaScript 使用点来分隔对象名和属性名。例如，对于名为 `person` 的对象，属性可能包括 `name` 和 `address`。\n\
  \n对象还可以包含`方法` (methods)。方法是与对象工作的函数。例如，我们的人对象可能包含一个 `display()` 方法。在 JavaScript\
  \ 术语中，`person.display()` 将显示细节。\n\n如果这听起来很困惑，请不要担心。稍后你将在更深入的情况下探索对象。现在你只需要了解基础。JavaScript\
  \ 支持三种对象：\n\n-   **内置对象**：这些对象构建在 JavaScript 语言中。你在第 4 课中遇到过其中一个 `Date`。其他内置对象包括\
  \ `Array` 和 `String`，你将在第 22 课中探索；`Math`，在第 22 课中也有解释；`Boolean`;`Number` 以及 `RegExp`。\n\
  -   **DOM（文档对象模型）对象**：这些对象代表浏览器的各种组件和当前 HTML 文档。例如，你之前使用的 `alert()` 函数实际上是 `window`\
  \ 对象的一个方法。你将在第 21 课“操作文档对象模型 (DOM)”中更详细探索它们。\n-   **自定义对象**：这些是你创建的对象。例如，正如本节前面提到的，你可以创建一个\
  \ `person` 对象。\n\n\n\n\nJavaScript（以及大多数其他编程语言）的另一个有用特性是创建 `loops`（循环）的能力，即重复执行特定次数的语句组。例如，这些语句会显示\
  \ 10 次相同的警报框，极大地困扰了用户：\n\n点击此处查看代码图片\n\n```\nfor (i=1; i<=10; i++) {\n  alert(\"\
  Yes, it's yet another alert!\");\n}\n```\n\n`for` 语句是 JavaScript 用于循环的多个语句之一。计算机非常擅长执行循环等重复任务。你将在很多脚本中使用循环，其用法将比这个示例要有用得多，正如你在第\
  \ 23 节中所看到的。\n\n## 事件处理器 (Event Handlers)\n\n正如第 4 节中提到的，并不是所有的脚本都位于 `<script>`\
  \ 标签内。你也可以将脚本作为`event handlers`（事件处理器）。虽然这听起来像是一个复杂的编程术语，但它的意思其实如字面：事件处理器就是处理事件的脚本。你在第\
  \ 19 节中学习了一点关于事件，但还没有达到在本节或第 24 节“响应事件和使用窗口”中将要读到的详细程度。\n\n在现实生活中，事件是发生在你身上的事情。例如，你在日历上写下的内容就是事件，比如“看牙预约”或“Fred\
  \ 的生日”。你生活中也会遇到未计划的事件，如交通罚单、国税局审计或来自亲戚的意外礼品。\n\n无论事件是有计划的还是未计划的，你可能都有正常的处理方法。你的事件处理器可能包括诸如“当\
  \ Fred 生日到时，给他送一份礼物”或“当亲戚意外造访时，关掉灯假装家里没人”。\n\nJavaScript 中的事件处理器也类似：它们告诉浏览器当特定事件发生时该做什么。JavaScript\
  \ 处理的事件没有你处理的那些事件那么有趣；它们包括诸如“按下鼠标按钮时”和“当页面加载完成时”等事件。尽管如此，它们是 JavaScript 中非常有用的部分。\n\
  \n许多 JavaScript 事件（如你之前见过的鼠标点击）是由用户引起的。你的脚本不是按照固定顺序执行任务，而是响应用户的操作。其他事件并不直接涉及用户；例如，当\
  \ HTML 文档加载完成时可以触发事件。\n\n每个事件处理器都与特定的浏览器对象关联，你可以在定义对象的标签中指定事件处理器。例如，图像和文本链接都有一个事件\
  \ `onmouseover`，当鼠标指针移动到对象上时该事件就会发生。这是一个带有事件处理器的典型 HTML 图像标签：\n\n点击此处查看代码图片\n\n\
  ```\n<img src=\"button.gif\" onmouseover=\"highlight();\">\n```\n\n你将事件处理器指定为 HTML\
  \ 标签内的一个属性，并在引号内包含用于处理事件的 JavaScript 语句。这是函数的理想用例，因为函数名简短且明了，并且可以引用整系列语句。\n\n在 HTML\
  \ 中使用事件处理器非常简单。列表 20.1 显示了一个包含简单事件处理器的 HTML 文档。\n\n**列表 20.1** 带有简单事件处理器的 HTML 文档\n\
  \n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>Event Handler Example</title>\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n\
  \    <h1>Event Handler Example</h1>\n    <div>\n      <a href=\"http://www.google.com/\"\
  \ onclick=\"alert('A-ha! An Event!');\">Go to Google</a>\n    </div>\n  </body>\n\
  </html>\n```\n\n该事件处理器通过在定义链接的 `<a>` 标签内使用以下 `onclick` 属性来定义：\n\n点击此处查看代码图片\n\n\
  ```\nonclick=\"alert('Aha! An Event!');\"\n```\n\n该事件处理器使用 DOM 内置的 `window` 对象的\
  \ `alert` 方法，以便在用户点击链接时显示消息；在你点击确定关闭警报框后，浏览器将继续跳转到该 URL。在更复杂的脚本中，你通常会定义自己的函数作为事件处理器。图\
  \ 20.2 展示了此操作示例。\n\n![一个网页截图，有一个显示为 Go to Google 的链接（已点击），上方覆盖着一个写着 A-Ha! An event\
  \ 的警报框。警报框有一个 Ok 按钮。](img/20fig02.jpg)\n\n**图 20.2** 当你点击链接时，浏览器显示警报框。\n\n你将在这些课程中使用其他事件处理器，特别是在第\
  \ 24 节中。\n\n### 注意\n在你点击确定按钮关闭警报框后，浏览器会遵循 `<a>` 标签中定义的链接。你的事件处理器也可以阻止浏览器跟随链接，正如你在第\
  \ 24 节中将学到的那样。\n\n\n\n\n![Image](img/arrow.jpg) DOM 对象名称通常是小写的，但它们的方法通常是大写和小写写的组合——有时被称为驼峰命名法。通常，除了第一个单词外，所有单词都使用大写字母开头，例如\
  \ `setAttribute` 和 `getElementById`。\n\n如果你有疑问，请遵循这些课程或其他 JavaScript 参考文档中使用的精确大小写。如果你使用了错误的大小写，浏览器通常会显示错误信息。\n\
  \n## 变量、对象和函数名称\n\n当你定义自己的变量、对象或函数时，你可以选择它们的名称。名称可以包含大写字母、小写字母、数字和下划线（`_`）字符。名称必须以字母或下划线开头。\n\
  \n你可以决定变量名中使用大写或小写，但请记住 JavaScript 是区分大小写的，例如，`score`、`Score` 和 `SCORE` 将被视为三个不同的变量。确保在每次引用变量时都使用相同的名称。\n\
  \n## 保留字\n\n变量名还有一条规则：它们不能是`保留字`。这些包括了构成 JavaScript 语言的词汇，如 `if` 和 `for`，DOM 对象名称如\
  \ `window` 和 `document`，以及内置对象名称如 `Math` 和 `Date`。\n\n关于 JavaScript 保留字列表，请参见 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords)。\n\
  \n## 空间距\n\nJavaScript 会忽略空白（程序员称之为 `whitespace`）。你可以在行内包含空格和制表符，也可以包含空行，而不会引起错误。空白通常会让脚本更具可读性，因此不要犹豫使用它。\n\
  \n## 使用注释\n\nJavaScript `comments` 允许你在脚本中包含文档。如果其他人需要理解该脚本，或者即使是你自己在离开代码很久后回到它时尝试理解它，简短的文档也是很有用的。要在\
  \ JavaScript 程序中包含注释，请以两个斜杠开始某行，如本例所示：\n\n```\n//this is a comment.\n```\n\n你也可以在行的中间用两个斜杠开始注释，这对于记录脚本说明非常有用。在这种情况下，斜杠之后该行上的所有内容都被视为注释，浏览器会忽略它们。例如，下一行是一个有效的\
  \ JavaScript 语句，后面跟着一个解释代码执行情况的注释：\n\n点击此处查看代码图片\n\n```\na = a + 1; // 给变量 a 的值加\
  \ 1\n```\n\nJavaScript 还支持 C 语言风格的注释（也用于 PHP），这种注释以 `/*` 开头并以 `*/` 结束。这些注释可以跨越多行，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\n/* 此脚本包含了多种\n\n功能，包括此条注释。 */\n```\n\n由于注释内的 JavaScript 语句会被忽略，这种类型的注释通常被用于`注释掉`部分代码。如果你有几行\
  \ JavaScript 代码想在调试时临时将其从脚本中移除，你可以在该部分的开头添加 `/*` 并在末尾添加 `*/`。\n\n### 注意事项\n\n由于这些注释是\
  \ JavaScript 语法的一部分，它们仅在 `<script>` 标签内部或外部 JavaScript 文件中有效。如果你尝试在 `<script>` 标签之外的\
  \ HTML 文档中使用它们，这些字符串将由浏览器渲染。\n\n## JavaScript 最佳实践\n\n现在你已经学习了编写有效 JavaScript 的非常基础的规则，遵循一些`最佳实践`也是一个好主意。以下实践不是强制要求的，但如果你开始将它们整合到开发过程中，将为你自己和他人节省很多麻烦：\n\
  \n*   ![Image](img/arrow.jpg) **尽情使用注释**——注释让你的代码更容易被他人理解，在你以后编辑时也更容易理解。它们对于标记脚本的主要划分也很有用。\n\
  \n*   ![Image](img/arrow.jpg) **在每个语句末尾使用分号且每行仅使用一个语句**——尽管你在本节中了解到不需要在每个语句末尾加分号（如果你使用了换行），但使用分号和每行一个语句会让你的脚本更易读，也更容易调试。\n\
  \n*   ![Image](img/arrow.jpg) **尽可能使用外部 JavaScript 文件**——将 JavaScript 分离到外部文件中可以帮助页面加载得更快，并鼓励你编写可复用的模块化脚本。\n\
  \n*   ![Image](img/arrow.jpg) **避免特定浏览器特性**——随着你对 JavaScript 的深入学习，你会发现一些仅在特定浏览器中运行的特性。除非绝对必要，否则避免使用此类特性，并在多个浏览器中测试你的代码以确保一切运行正常。\n\
  \n*   ![Image](img/arrow.jpg) **保持 JavaScript 可选性**——不要使用 JavaScript 执行网站上的核心功能（例如，主导航链接）。只要可能，没有\
  \ JavaScript 的用户也应该可以使用你的网站，尽管没有 JavaScript 的它可能没那么吸引人或方便。这种策略被称为`渐进增强`。\n\n还有许多涉及\
  \ JavaScript 高级方面的最佳实践。你不仅会在课程的进行中学习它们，还会随着时间的推移在使用 JavaScript 以及在 Web 开发项目中与他人协作时不断学习。\n\
  \n## 理解 JSON\n\n尽管 JSON（或 `JavaScript Object Notation`，JavaScript 对象表示法）不是核心语言的一部分，但使用它实际上是结构化存储由\
  \ JavaScript 使用的信息的常用方法。现在是熟悉 JSON（读作“Jason”）及其用途的好时机。\n\n### 注意\n\nJSON 形式化了使用\
  \ JavaScript 编码数据。请查看 [json.org](http://json.org) 了解详情和代码示例。\n\nJSON 编码数据表示为参数和值对，并用冒号分隔每个参数及其值。这些\
  \ `\"`*parameter`*`\":\"`*value`*`\"` 对用逗号分隔：\n\n点击此处查看代码图片\n\n```\n\"param1\":\"\
  value1\", \"param2\":\"value2\", \"param3\":\"value3\"\n```\n\n最后，整个序列封装在大括号中形成一个\
  \ JSON 对象。以下示例创建了一个名为 `yourJSONObject` 的变量：\n\n点击此处查看代码图片\n\n```\nvar yourJSONObject\
  \ = {\n  \"param1\":\"value1\",\n  \"param2\":\"value2\",\n  \"param3\":\"value3\"\
  \n};\n```\n\nJSON 对象可以使用点符号法直接访问属性和方法，如下：\n\n点击此处查看代码图片\n\n```\nalert(yourJSONObject.param1);\
  \ // 弹出 'value1'\n```\n\n更通用地说，JSON 具有一种字符串格式数据的通用语法。通过被称为`序列化`的过程，可以将 JSON 对象转换为字符串；序列化数据在存储或网络传输中非常方便。\n\
  \n如今 JSON 最常见的用途之一是作为应用程序接口（API）和其他数据馈的数据交换格式，这些数据由使用 JavaScript 解析数据的前端应用进行消费。JSON\
  \ 替代其他数据格式（如 XML）的增加源于几个原因：\n\n*   ![Image](img/arrow.jpg) JSON 对人类和计算机来说都是易读的。\n\
  \n*   ![Image](img/arrow.jpg) JSON 概念简单。一个 JSON 对象仅仅是一系列在大括号封装的 `\"`*parameter`*`\"\
  :\"`*value`*`\"` 对。\n\n*   ![Image](img/arrow.jpg) JSON 在很大程度上是自成文档的。\n\n\n\n\n\n\
  *   ![Image](img/arrow.jpg) 你可以快速地创建和解析 JSON。\n\n*   ![Image](img/arrow.jpg) JSON\
  \ 是 JavaScript 的一个子集，这意味着不需要任何特殊的解释器或其他额外的程序包。\n\n### 总结\n\n在本节中，你学习了 JavaScript\
  \ 编程和语法的几个组件，例如函数、对象、事件处理程序、条件语句和循环。你还学习了如何使用 JavaScript 注释让你的脚本更易于读，并查看了一个事件处理器的简单示例。最后，你接触了\
  \ JSON，这是一种基于 JavaScript 的应用程序中常用的的数据交换格式。\n\n### 问答\n\n**问：我听过 `object-oriented`（面向对象）这个词被用于\
  \ C++ 和 Java 等语言。如果 JavaScript 支持对象，那么它是一门面向对象的语言吗？**\n\n**答：是的**，尽管它可能不符合某些人对 `object-oriented`\
  \ 的严格定义。JavaScript 对象并不支持 C++ 和 Java 等语言支持的所有功能，尽管 JavaScript 的最新版本已经添加了更多面向对象的特性。\n\
  \n**问：有多个在不同时间执行的脚本似乎很困惑。我为什么要使用事件处理程序？**\n\n**答：使用事件处理程序是处理网页内高级交互的理想方式（在 JavaScript\
  \ 中也是唯一的方式），例如使用按钮、复选框和文本框，其用法远超简单的填写表单并将其发送给接收者。与其编写一个坐在那里等待按钮按钮的脚本，不如创建一个事件处理程序并让浏览器替你等待，同时允许用户继续查看页面上的元素和文本。\n\
  \n## 工作坊\n\n工作坊包含测验问题和活动，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，请尝试回答所有问题。\n\n### 测验\n\n\
  **1.** 当用户点击鼠标按钮时执行的脚本是什么的示例？\n\n1. 一个对象\n2. 一个事件处理程序\n3. 不可能实现\n4. 一个方法\n\n**2.**\
  \ 下列 JavaScript 函数可以做哪些？\n\n1. 接受参数\n2. 返回一个值\n3. 将数据写入磁盘\n4. A 和 B 都是\n\n**3.**\
  \ 下列中哪项由浏览器首先执行？\n\n1. `<head>` 部分中的脚本\n2. `<body>` 部分中的脚本\n3. 按钮的事件处理程序\n4. 点击链接\n\
  \n**4.** 多少行代码组成一个有效的 JavaScript 语句？\n\n1. 一行\n2. 两行\n3. 三行\n4. 根据需要多少行都可以\n\n**5.**\
  \ 你如何在脚本中分隔语句？\n\n1. 空格\n2. 换行\n3. 分号\n4. B 和 C 都是\n\n**6.** 你会如何写一个定义名为 `myVariable`\
  \ 的变量并赋值赋值为 `27` 的语句？\n\n1. `myVariable 27;`\n2. `var myVariable 27;`\n3. `var myVariable\
  \ = 27;`\n4. `var myVariable == 27;`\n\n**7.** 绑定到 `onmouseover` 属性的脚本何时运行？\n\n\
