  ## 创建简单表格\n\n另一种控制网页信息布局的方法是将信息显示在表格中。表格由包含各个单元格的信息行组成。要创建表格，必须从`<table>`标签开始。当然，表格以`</table>`标签结束。CSS\
  \ 包含许多属性，使你能够修改表格，例如你在前面课程中学到的各种边框属性。\n\n放置`<table>`标签后，接下来需要`<tr>`标签。`<tr>`标签创建一行表格，其中包含一个或多个信息单元格，然后是结束`</tr>`。要创建这些单独的单元格，请使用`<td>`标签（`<td>`代表*表格数据*）。将表格信息放在`<td>`和`</td>`标签之间。*单元格*是一个矩形区域，可以包含任何文本、图片和\
  \ HTML 标签。表格中的每一行至少包含一个单元格。一行中的多个单元格形成表格的列。\n\n构建表格还涉及另一个基本标签。`<th>`标签的工作方式与`<td>`标签完全相同，只是`<th>`表示该单元格是表格标题的一部分。大多数\
  \ Web 浏览器会自动将`<th>`单元格中的文本呈现为居中和粗体，如你在图 6.9 中看到的 Chrome 浏览器。但是，如果你的浏览器没有使用内置样式自动呈现此元素，你有一个可以使用\
  \ CSS 设置样式而无需使用类来区分不同类型表格数据元素的元素。\n\n![屏幕截图显示使用 HTML 渲染表格。](img/06fig09.jpg)\n**图\
  \ 6.9** 清单 6.8 中的代码创建了一个包含四列六行的表格。\n\n你可以创建任意数量的单元格，但表格中每一行的列数应与其他行相同。清单 6.8 中的\
  \ HTML 代码仅使用到目前为止提到的四个表格标签创建一个简单表格。\n\n### 清单 6.8 使用`<table>`、`<tr>`、`<td>`和`<th>`标签创建表格\n\
  \n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>Baseball Standings</title>\n  </head>\n  <body>\n\
  \    <h1>Baseball Standings</h1>\n    <table>\n      <tr>\n        <th>Team</th>\n\
  \        <th>W</th>\n        <th>L</th>\n        <th>GB</th>\n      </tr>\n    \
  \  <tr>\n        <td>San Francisco Giants</td>\n        <td>54</td>\n        <td>46</td>\n\
  \        <td>8.0</td>\n      </tr>\n      <tr>\n        <td>Los Angeles Dodgers</td>\n\
  \        <td>62</td>\n        <td>38</td>\n        <td>—</td>\n      </tr>\n   \
  \   <tr>\n        <td>Colorado Rockies</td>\n        <td>54</td>\n        <td>46</td>\n\
  \        <td>8.0</td>\n      </tr>\n      <tr>\n        <td>Arizona Diamondbacks</td>\n\
  \        <td>43</td>\n        <td>58</td>\n        <td>19.5</td>\n      </tr>\n\
  \      <tr>\n\n\n\n\n```html\n        <td>San Diego Padres</td>\n        <td>39</td>\n\
  \        <td>62</td>\n        <td>23.5</td>\n      </tr>\n    </table>\n  </body>\n\
  </html>\n```\n\n### 注意\n\n你可能会发现，如果使用空格缩进 `<tr>` 和 `<td>` 标签，HTML 表格会更容易阅读（并且更不容易出现浪费时间错误），如清单\
  \ 6.8 所示。请记住，浏览器在渲染 HTML 时会忽略空格，因此代码的布局不会影响用户看到的表格布局。\n\n示例中的表格包含棒球排名，非常适合按行和列排列——但表格略显朴素。例如，这个示例甚至没有任何边框！稍后你将学习如何让表格变得更有吸引力。表格的标题显示了球队、胜场（W）、负场（L）和落后场次（GB）。\n\
  \n你可以添加以下样式表条目，为表格及其单元格添加基本边框：\n\n```css\ntable, tr, th, td {\n   border: 1px solid\
  \ black;\n   border-collapse: collapse;\n   padding: 3px;\n}\n```\n\n你可能会疑惑，为什么必须为创建表格所用的全部四个元素指定这些样式，而不是只针对整个表格元素本身。基本上，这是因为表格由其元素组成，每个元素都可以应用这些样式。为了强调这一点，下面的图示展示了在样式化与未样式化各种元素时表格的外观。\n\
  \n图 6.10 展示了刚刚列出的样式的输出结果。`border-collapse` 属性（值为 `collapse`）使 `<table>`、`<tr>` 和\
  \ `<th>` 或 `<td>` 元素的所有边框合并为一个共享边框。`padding` 为单元格内容增加了一些呼吸空间。\n\n![一张截图展示了在 HTML\
  \ 页面中使用 CSS 样式和 border-collapse 的输出结果。](img/06fig10.jpg)\n`图 6.10` 为表格添加一些 CSS 样式，包括使用\
  \ `border-collapse`。\n\n在图 6.11 中，你可以看到未指定 `border-collapse` 属性时表格的外观。（此时默认值生效，本例中为\
  \ `separate`，即分离边框。）\n\n![一张截图展示了移除 border-collapse 属性后的效果。每个单元格被单独的边框包围，而整个表格则被一个更大的独立边框包围。](img/06fig11.jpg)\n\
  `图 6.11` 移除 `border-collapse` 属性会导致所有元素都出现边框。\n\n在图 6.12 中，你可以看到如果未为 `<th>` 和 `<td>`\
  \ 元素指定任何前述样式，表格的外观。注意缺少表示列的边框。\n\n![一张截图展示了在 HTML 页面中移除标题和标准单元格样式后的输出结果。表格只有行方向的边框，没有列方向的边框。](img/06fig12.jpg)\n\
  `图 6.12` 移除 `<th>` 和 `<td>` 元素的样式。\n\n## 注意：其他表格标签\n\n在创建简单表格时，你还可以使用三个有用但非必需的表格相关标签：\n\
  \n* `<thead></thead>`——将表头行包裹在此元素中，可以为分组增加更多含义，并且允许这些表头行跨页打印（如果你的表格很长）。然后你可以对 `<thead>`\
  \ 元素进行样式化，也可以替代或补充对单个 `<th>` 单元格的样式化。\n* `<tfoot></tfoot>`——与 `<thead>` 元素类似，使用此元素包裹表尾行（如果有的话），可以为分组增加更多含义，并作为一个整体进行样式化。表尾行的一个例子可能是对列中呈现的数据进行汇总，例如财务总计。为了有效，你的\
  \ `<tfoot>` 行应在 HTML 中列在 `<tbody>` 行之前，但浏览器会在 `<tbody>` 行之后渲染它们。这确保了在长表格中，当表格其余部分加载时，表尾数据能够显示。\n\
  * `<tbody></tbody>`——将构成表格“主体”的行（除表头和表尾行之外的所有内容）包裹在此元素中，可以为分组增加更多含义。你也可以对整个 `<tbody>`\
  \ 元素进行样式化，也可以替代或补充对单个 `<td>` 单元格的样式化。\n\n### 控制表格大小\n\n当未指定表格宽度时，表格及其各个单元格的大小会自动扩展以适应放入其中的数据。这与其他\
  \ HTML 元素（如 `<div>` 和 `<p>`）不同，后者会拉伸以适应其容器的宽度。但是，你可以通过为 `<table>` 元素定义 `width` CSS\
  \ 属性来控制整个表格的宽度；你也可以通过为 `<td>` 元素分配 `width` CSS 属性来定义每个单元格的宽度。`width` 属性可以指定为任何长度度量，例如像素、em\
  \ 或百分比。\n\n要使表格的第一个单元格占表格总宽度的 20%，第二个单元格占 80%，可以使用以下属性定义：\n\n```html\n<table style=\"\
  width:100%;\">\n  <tr>\n    <td style=\"width:20%;\">瘦单元格</td>\n    <td style=\"\
  width:80%;\">胖单元格</td>\n  </tr>\n</table>\n```\n\n请注意，表格的大小设置为 100%，这确保它填满浏览器窗口的整个宽度。当你使用百分比而不是固定的像素大小时，表格会自动调整大小以适应任何大小的浏览器窗口，同时保持你追求的美学平衡。在这种情况下，表格内的两个单元格会自动分别调整为表格总宽度的\
  \ 20% 和 80%。\n\n在清单 6.9 中，来自清单 6.8 的简单表格（加上边框相关样式）被扩展，以展示对表格单元格宽度的非常精确的控制。\n\n`清单\
  \ 6.9` 指定表格单元格宽度\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n   \
  \ <meta charset=\"utf-8\">\n    <title>棒球排名</title>\n    <style>\n      table, tr,\
  \ th, td {\n         border: 1px solid black;\n         border-collapse: collapse;\n\
  \         padding: 3px;\n      }\n    </style>\n  </head>\n  <body>\n    <h1>棒球排名</h1>\n\
  \    <table>\n      <tr>\n         <th style=\"width: 200px;\">球队</th>\n       \
  \  <th style=\"width: 25px;\">胜</th>\n         <th style=\"width: 25px;\">负</th>\n\
  \         <th style=\"width: 25px;\">落后</th>\n      </tr>\n      <tr>\n        \
  \ <td>旧金山巨人</td>\n         <td>62</td>\n         <td>38</td>\n         <td>--</td>\n\
  \      </tr>\n      <tr>\n         <td>洛杉矶道奇</td>\n         <td>54</td>\n      \
  \   <td>46</td>\n         <td>8.0</td>\n      </tr>\n      <tr>\n         <td>科罗拉多洛矶</td>\n\
  \         <td>54</td>\n         <td>46</td>\n         <td>8.0</td>\n      </tr>\n\
  \      <tr>\n         <td>亚利桑那响尾蛇</td>\n         <td>43</td>\n         <td>58</td>\n\
  \         <td>19.5</td>\n      </tr>\n      <tr>\n         <td>圣地亚哥教士</td>\n   \
  \      <td>39</td>\n         <td>62</td>\n         <td>23.5</td>\n      </tr>\n\
  \    </table>\n  </body>\n</html>\n```\n\n你可以在图 6.13 中看到一致的列宽。\n\n![一张截图展示了在 HTML\
  \ 页面中为列使用特定宽度的输出结果。](img/06fig13.jpg)\n`图 6.13` 清单 6.9 中的代码创建了一个包含四列六行的表格，并为每列指定了特定宽度。\n\
  \n\n\n\n在第一行的每个 `<th>` 元素中添加特定的宽度样式可以定义列的宽度。第一列定义为 200px 宽，第二、第三和第四列各为 25px 宽。在\
  \ 图 6.13 中，你可以看到第一列文本后有空白，表明指定的宽度确实大于如果表格没有显式宽度指示符时的列宽。\n\n另请注意，这些宽度不会在后续行的 `<td>`\
  \ 元素中重复。从技术上讲，你只需要在第一行定义宽度；其余行会遵循，因为它们都是同一表格的一部分。但是，如果你使用了另一种格式样式（例如更改字体大小或颜色的样式），你就必须为每个应具有这些显示属性的元素重复该样式。\n\
  \n## 表格内的对齐与单元格跨列/跨行\n\n默认情况下，表格单元格内的任何内容都会左对齐并垂直居中。本课到目前为止的所有图示都展示了这种默认对齐方式。不过，你可以使用\
  \ `text-align` 和 `vertical-align` 样式属性来水平或垂直对齐单元格内容。\n\n你可以将这些对齐属性应用到任何 `<tr>`、`<td>`\
  \ 或 `<th>` 标签上。分配给 `<tr>` 标签的对齐属性会作用于该行中的所有单元格。根据表格的大小，你可以在 `<tr>` 层级应用这些属性，而不必在每个\
  \ `<td>` 或 `<th>` 标签中重复设置，从而节省时间和精力。\n\n代码清单 6.10 中的 HTML 代码结合了文本对齐样式，为一行设置默认对齐，但在某些单元格中被覆盖。图\
  \ 6.14 展示了 代码清单 6.10 中代码的效果。\n\n`代码清单 6.10` 表格中的对齐、单元格间距、边框和背景色\n\n点击此处查看代码图片\n\n\
  ```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Dandelions</title>\n    <style>\n    table {\n       border: 2px solid\
  \ black;\n       border-collapse: collapse;\n       padding: 3px;\n       width:\
  \ 100%;\n    }\n    tr, th, td {\n       border: 2px solid black;\n       border-collapse:\
  \ collapse;\n       padding: 3px;\n    }\n    thead {\n       background-color:\
  \ #ff0000;\n       color: #ffffff;\n    }\n    .aligntop {\n       vertical-align:top;\n\
  \    }\n    .description {\n       font-size: 14px;\n       font-weight: bold;\n\
  \       vertical-align: middle;\n       text-align: center;\n    }\n    .size {\n\
  \       text-align: center;\n    }\n    </style>\n  </head>\n  <body>\n    <h1>Things\
  \ to Fear</h1>\n    <table>\n      <thead>\n        <tr>\n          <th colspan=\"\
  2\">Description</th>\n          <th>Color</th>\n          <th>Size</th>\n      \
  \  </tr>\n      </thead>\n      <tbody>\n        <tr class=\"aligntop\">\n     \
  \     <td><img src=\"flower.jpg\" alt=\"Flower\"></td>\n          <td class=\"description\"\
  >Flower</td>\n          <td>Yellow</td>\n          <td class=\"size\">1-2 inches</td>\n\
  \        </tr>\n        <tr class=\"aligntop\">\n          <td><img src=\"seeds.jpg\"\
  \ alt=\"Seeds\"></td>\n          <td class=\"description\">Seeds</td>\n        \
  \  <td>White</td>\n          <td class=\"size\">1-2 inches</td>\n        </tr>\n\
  \        <tr class=\"aligntop\">\n          <td><img src=\"leaves.jpg\" alt=\"Leaves\"\
  ></td>\n          <td class=\"description\">Leaves</td>\n          <td>Green</td>\n\
  \          <td class=\"weight\">3-4 inches</td>\n        </tr>\n      </tbody>\n\
  \    </table>\n  </body>\n</html>\n```\n\n![截图显示了 HTML 页面的输出以及 \"colspan\" 属性和特定对齐样式的使用。](img/06fig14.jpg)\n\
  \n`图 6.14` 代码清单 6.10 中的代码展示了 `colspan` 属性的用法和一些对齐样式。\n\n以下是一些最常用的 `vertical-align`\
  \ 样式属性值：`top`、`middle`、`bottom`、`text-top`、`text-bottom` 和 `baseline`（用于文本）。这些属性值为你提供了在垂直方向上对齐表格数据的灵活性。\n\
  \n**注意**\n在脑海中保持行和列的结构有序可能是创建具有跨列或跨行单元格的表格时最困难的部分。哪怕最小的错误也常常会导致整个布局混乱。在开始编写 HTML\
  \ 实现之前，先在纸上画出复杂表格的草图，可以节省时间和减少挫败感。\n\n`Spanning` 是指强制一个单元格跨越表格的多行或多列的过程。`colspan`\
  \ 属性使单元格跨多列；`rowspan` 对行有相同的效果。\n\n在 图 6.14 的顶部，单个单元格（`Description`）跨越两列。这是通过在该单元格的\
  \ `<th>` 标签中使用 `colspan` 属性实现的。正如你所想，你也可以使用 `rowspan` 属性来创建跨多行的单元格。\n\n此外，在样式表中定义了文本样式，并应用到\
  \ Description 列的单元格上，以创建既垂直居中又水平居中的粗体文本。\n\n代码清单 6.10 中还有一些技巧尚未解释。你可以为整个表格以及表格中的每一行或每一个单元格设置独立的背景，与网页本身的背景不同。你可以通过在\
  \ `<table>`、`<tr>`、`<td>`、`<th>`、`<thead>`、`<tbody>` 或 `<tfoot>` 标签中放置 `background-color`\
  \ 或 `background-image` 样式来实现这一点（或者在样式表中为这些元素赋值），就像在 `<body>` 标签中一样。在 代码清单 6.10 中，只有顶部行有背景颜色；样式表将\
  \ `<thead>` 元素设置为红色背景，该行单元格中的文本为白色。\n\n**注意**\n你经常会在表格中看到交替的行颜色。例如，一行可能是灰色背景，下一行可能是白色背景。交替行颜色有助于用户更清晰地阅读表格内容，如果表格很大，这种做法尤其有用。你可以使用\
  \ CSS 自动实现这一点，你将在 第 13 课“掌控背景和边框”中学习。\n\n与 `background-color` 样式属性类似的是 `background-image`\
  \ 属性（本例未展示），用于设置表格背景图片。如果你想将图片 `leaves.gif` 设置为表格的背景，你可以在 `<table>` 元素的样式表条目中使用\
  \ `background-image:url(leaves.gif);`。注意，图片文件放在括号内，前面是单词 `url`，表示你正在描述图片文件的位置。\n\
  \n调整表格不仅仅是使用样式属性。如 代码清单 6.10 所示，你可以通过为单元格添加内边距来控制单元格内容在其边框内的空间。如果你想在单元格边框之间添加一些空间，可以使用\
  \ `border-spacing` CSS 属性，它允许你定义水平和垂直间距，如下所示：\n\n```css\nborder-spacing: 2px 4px;\n\
  ```\n\n在这个例子中，间距被定义为水平边框之间 2 像素的空间和垂直边框之间 4 像素的空间。如果你只使用一个值，该值将应用于所有四个边框。\n\n##\
  \ 使用表格进行页面布局\n\n\n\n# 页面布局与 CSS 列\n\n在本课开始时，我们指出设计师们曾使用表格进行页面布局，同时也用于显示表格数据。如果你查看其他设计师的源代码，仍然会发现许多基于表格的布局示例。这种设计方法源于\
  \ 1990 年代中期至 2000 年代初浏览器对 CSS 支持的不一致。由于所有浏览器都支持表格，而且支持方式大致相同，网页设计师们采用了这种基于表格的内容布局方式，以在所有浏览器中获得相同的视觉页面显示。然而，现在所有主要浏览器对\
  \ CSS 的支持已经相对一致，设计师们可以遵循长期以来的基于标准的建议，*不要*使用表格进行页面布局。\n\n**注意**\n\nHTML5 再次改变了这一建议。使用表格进行布局仍然不是一个好主意，但只要你将包含表格定义为布局表格，并在表格上添加\
  \ `border=\"0\"` 或 `role=\"presentation\"` 属性，你将符合该建议。但使用表格进行布局仍然不是一个好主意。在第 12 课中，“使用现代\
  \ CSS 技术创建布局”，你将学到几种比表格效果更好的 CSS 替代方案。\n\n万维网联盟（W3C）是监督网络未来的标准机构，长期以来一直推广使用样式表作为页面布局的正确方式（而不是使用表格）。样式表最终比表格强大得多，这就是为什么这些课程的大部分内容教你如何使用样式表进行页面布局。\n\
  \n避免使用表格进行布局的主要原因包括：\n\n*   ![Image](img/arrow.jpg) `Mixing presentation with content`—CSS\
  \ 和符合标准的网页设计的目标之一是将表现层与内容层分离。\n*   ![Image](img/arrow.jpg) `Creating unnecessarily\
  \ difficult redesigns`—要更改基于表格的布局，你必须更改网站上每个页面的基于表格的布局（除非它是一个复杂的动态驱动网站，在这种情况下，你必须撤销所有动态部分并重新制作它们）。\n\
  *   ![Image](img/arrow.jpg) `Addressing accessibility issues`—屏幕阅读软件会查找表格内容，并经常尝试将布局表格作为内容表格来读取。\n\
  *   ![Image](img/arrow.jpg) `Rendering on mobile devices`—表格布局通常不够灵活，无法缩小到小屏幕（参见第\
  \ 17 课，“为移动设备设计”）。\n\n## 使用 CSS 列\n\n如果你有大量纯文本信息，你可能希望像实体报纸一样以列的形式呈现。一个多世纪的研究表明，行长度与阅读速度之间存在相关性。有一个“最佳点”，即一行文字的最佳长度，可以实现快速愉快的阅读体验。这个最佳点——大约\
  \ 4 英寸长的行——持续存在，这就是为什么实体报纸仍然以列的形式呈现信息。\n\n如果你有大量信息要呈现给读者，或者只是想模仿报纸布局的美学，你可以使用 CSS\
  \ 列。当然，你也可以使用表格，因为表格由行和列组成，但前一部分解释了一些避免使用基于表格的布局的原因。此外，列不仅仅用于文本；你可以在定义的列中放置任何你想要的内容，例如广告或侧边栏中的相关内容。\n\
  \n在图 6.15 中，你可以看到使用 CSS 列定义传统报纸式布局的基本示例。清单 6.11 显示了创建此三列布局的代码。\n\n![屏幕截图显示了使用 CSS\
  \ 列生成的报纸式布局。文本以三列显示，从上到下、从左到右可读。](img/06fig15.jpg)\n\n**图 6.15** 清单 6.11 中的代码显示了三列布局。\n\
  \n**清单 6.11** 表格中的对齐、单元格间距、边框和背景颜色\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Breaking News!</title>\n\
  \    <style>\n    article {\n       column-count: 3;\n       column-gap: 21px;\n\
  \    }\n    h1 {\n       text-align: center;\n       column-span: all;\n    }\n\
  \    p {\n       margin-top: 0px;\n       margin-bottom: 12px;\n    }\n    footer\
  \ {\n       column-span: all;\n    }\n    </style>\n  </head>\n  <body>\n    <article>\n\
  \      <header>\n        <h1>Breaking News!</h1>\n      </header>\n      <p>Breaking\
  \ news, also known as a special report or news\n      bulletin, is a current issue\
  \ that broadcasters feel warrants\n      the interruption of scheduled programming\
  \ and/or current news\n      in order to report its details. Its use is also assigned\
  \ to\n      the most significant story of the moment or a story that is\n      being\
  \ covered live. It could be a story that is simply of wide\n      interest to viewers\
  \ and has little impact otherwise. Many\n      times, breaking news is used after\
  \ the news network has\n      already reported on this story. When a story has not\
  \ been\n      reported on previously, the graphic and phrase \"Just In\" is\n  \
  \    sometimes used instead.</p>\n      <p>In early coverage of a breaking story,\
  \ details are commonly\n      sketchy, usually due to the limited information available\
  \ at the\n      time. For example, during the Sago Mine disaster, initial reports\n\
  \      were that all twelve miners were found alive, but news\n      organizations\
  \ later found only one actually survived.</p>\n      <p>Another criticism has been\
  \ the diluting of the importance of\n      breaking news by the need of 24-hour\
  \ news channels to fill time,\n      applying the title to soft news stories of\
  \ questionable importance\n      and urgency, for example car chases. Others question\
  \ whether the\n      use of the term is excessive, citing occasions when the term\
  \ is\n      used even though scheduled programming is not interrupted.</p>\n   \
  \   <footer>\n        <em>Text courtesy of Wikipedia:\n        http://en.wikipedia.org/wiki/Breaking_news</em>\n\
  \      </footer>\n    </article>\n  </body>\n</html>\n```\n\n清单 6.11 中的代码来自一篇假新闻文章，我们使用\
  \ `<article>` 元素来包含所有内容。在 `<article>` 元素内部是一个 `<header>` 元素，其中包含“Breaking News!”标题（位于\
  \ `<h1>` 级别），后面跟着三个段落和一个 `<footer>` 元素。所有的样式都在清单开头的样式表中处理；为刚才提到的四个元素提供了样式：`<article>`、`<h1>`、`<p>`\
  \ 和 `<footer>`。\n\n在样式表中，我们对 `<article>` 元素应用了列的主要定义。我们使用 `column-count` 来定义三列，并使用\
  \ `column-gap` 将列之间的间距定义为 21 像素宽。接下来，我们为 `<h1>` 元素添加了定义，首先使文本在页面居中，其次确保文本跨越所有列。我们对\
  \ `<footer>` 元素的条目应用了相同的 `column-span` 属性，原因相同。\n\n\n\n\n在 `<h1>` 元素的条目之后，我们为 `<p>`\
  \ 元素添加了一些特定的外边距（margins）——即顶部外边距为 0 像素，底部外边距为 12 像素。我们本可以不做处理，直接让 `<p>` 元素以默认样式显示，但这会在每个段落的顶部创建外边距。你可能会问：“这有什么大不了的？”因为看起来我们无论如何都在段落之间手动添加了空间——事实确实如此。然而，我们将空间添加在每个段落的*之后*，并去掉了每个段落*之前*的空间，这样第一列就不会以空格开始，从而避免导致三列的顶部无法对齐。\n\
  \n### 注意事项\n\n你有时会看到带有 `-webkit`、`-o`、`-ms` 和 `-moz` 前缀的相关条目，例如 `-webkit-column-count:\
  \ 2;`。当某个属性尚未被浏览器完全支持时，这些前缀会被添加到样式表中。`-webkit` 前缀用于 Chrome 和 Safari（以及它们的移动端对应版本\
  \ Android 和 iOS），`-o` 用于 Opera，`-ms` 用于 Microsoft Edge 和 Internet Explorer，而 `-moz`\
  \ 用于 Firefox。虽然你可以为 CSS 分栏使用这些前缀，但现在浏览器的支持基本上已经普及，因此只有在需要支持旧版本浏览器时才需要这些前缀。一个可以参考所需前缀的优秀网站是\
  \ [www.caniuse.com](http://www.caniuse.com)。\n\n你甚至可以在列之间添加垂直线，如 图 6.16 所示。为了实现这种外观，我们添加的样式表条目如下所示：\n\
  \n```css\ncolumn-rule-width: 1px;\ncolumn-rule-style: solid;\ncolumn-rule-color:\
  \ #000;\n```\n\n请注意，这些样式表条目与你用来定义边框（你将在 第 13 课 中学到）的条目非常相似。\n\n![一张截图显示了使用 CSS 分栏生成的样本报纸排版布局。现在，各列由垂直线分隔。](img/06fig16.jpg)\n\
  `图 6.16` 代码清单 6.11 中的代码，并增加了列之间的垂直线。\n\n你将在 第 17 课 中学习更多关于如何使用 CSS 分栏实现响应式布局的内容。\n\
  \n### 总结\n\n在本课中，你学习了如何使文本显示为**粗体**或*斜体*，以及如何编写上标、下标、特殊符号和带重音的字母。你了解了如何控制网页上任何文本段落的大小、颜色和字体，包括如何使用\
  \ Web 字体来实现更有趣的字体效果。你还了解到属性用于为许多 HTML 标签指定选项和特殊行为，并且学习了如何将 `style` 属性与 CSS 样式规则结合使用以影响文本的外观。你还学习了如何创建和组合三种基本类型的\
  \ HTML 列表：有序列表、无序列表和定义列表。列表可以嵌套在其他列表中，以创建大纲或其他复杂的文本排列。\n\n最后，你学习了如何将文本和图像排列成名为表格的有序行和列。你学习了创建表格的基本标签，以及几个用于控制表格对齐、间距和外观的\
  \ CSS 属性。你还了解到不应将表格用于布局目的，而可以通过使用 CSS 分栏来实现多列布局。\n\n表 6.2 总结了本课中讨论的 HTML 标签和属性。顺便说一句，不要觉得你必须记住所有这些标签！\n\
  \n`表 6.2` 第 6 课 中涵盖的 HTML 标签和属性\n\n| 标签/属性 | 功能 |\n| :--- | :--- |\n| `<em>`…`</em>`\
  \ | 添加强调（通常为斜体）。 |\n| `<strong>`…`</strong>` | 添加更强的强调（通常为粗体）。 |\n| `<pre>`…`</pre>`\
  \ | 表示预格式化文本（保留精确的行尾和空格——通常以等宽字体渲染）。 |\n| `<sub>`…`</sub>` | 表示下标。 |\n| `<sup>`…`</sup>`\
  \ | 表示上标。 |\n| `<div>`…`</div>` | 指定一个需要格式化的文本区域。 |\n| `<dl>`…`</dl>` | 表示定义列表。\
  \ |\n| `<dt>`…`</dt>` | 表示定义术语，作为定义列表的一部分。 |\n| `<dd>`…`</dd>` | 指定定义术语对应的定义，作为定义列表的一部分。\
  \ |\n| `<ol>`…`</ol>` | 表示有序（编号）列表。 |\n| `<ul>`…`</ul>` | 表示无序（项目符号）列表。 |\n| `<li>`…`</li>`\
  \ | 表示用于 `<ol>` 或 `<ul>` 的列表项。 |\n| `<table>`…`</table>` | 创建一个可以包含任意行数和列数的表格。 |\n\
  | `<thead>`…`</thead>` | 定义表格的页眉行。 |\n| `<tbody>`…`</tbody>` | 定义表格的主体行。 |\n| `<tfoot>`…`</tfoot>`\
  \ | 定义表格的页脚行。 |\n| `<tr>`…`</tr>` | 定义包含一个或多个单元格（`<td>` 标签）的表格行。 |\n| `<th>`…`</th>`\
  \ | 定义表格标题单元格。（接受与 `<td>` 相同的所有样式。） |\n| `<td>`…`</td>` | 定义表格数据单元格。 |\n| 属性 | 功能\
  \ |\n| `style=\"font-family: typeface;\"` | 指定字体的字体族（family），即字体的名称，例如 `Arial`。（也可用于\
  \ `<p>`、`<h1>`、`<h2>`、`<h3>` 等。） |\n| `style=\"font-size: size;\"` | 指定字体大小，可以设置为\
  \ `small`、`medium` 或 `large`，以及 `x-small`、`x-large` 等。也可以设置为特定大小（如 `12pt` 或 `2em`）。\
  \ |\n| `style=\"color: color;\"` | 更改文本颜色。 |\n| `style=\"text-align: alignment;\"\
  ` | 将文本对齐方式设置为 `center`（居中）、`left`（左对齐）或 `right`（右对齐）。（也可用于 `<p>`、`<h1>`、`<h2>`、`<h3>`\
  \ 等。） |\n| 属性 | 功能 |\n| `style=\"list-style-type: numtype;\"` | 指定用于标记列表的数字类型。可选值为\
  \ `decimal`、`lower-roman`、`upper-roman`、`lower-alpha`、`upper-alpha` 和 `none`。 |\n\
  | `style=\"list-style-type: bullettype;\"` | 指定用于标记列表项的项目符号。可选值为 `disc`、`circle`、`square`\
  \ 和 `none`。 |\n| `style=\"list-style-type: type;\"` | 指定用于标记此项的项目符号或数字类型。可选值为 `disc`、`circle`、`square`、`decimal`、`lower-roman`、`upper-roman`、`lower-alpha`、`upper-alpha`\
  \ 和 `none`。 |\n\n### 问答\n\n**问：我如何找到电脑上某个字体的准确名称？**\n\n**答：** 在 Windows 10 计算机上，打开控制面板并进入“外观和个性化”部分。然后点击“字体”文件夹，你将看到系统中字体的列表。在\
  \ Mac 上，打开 `/Applications` 文件夹中的 `Font Book`（字体册）以查找系统中的字体列表。在 `font-family` 样式规则中指定字体时，请使用每个字体名称的准确拼写。不过，字体名称不区分大小写。\n\
  \n**问：我如何在页面上放置汉字、阿拉伯文、中文和其他非欧洲字符？**\n\n**答：** 首先，需要在页面上阅读这些字符的用户必须安装相应的语言字体。如果你将浏览器的字符集设置为\
  \ UTF-8，你应该能够像输入英文一个字符那样直接将这些字符输入到页面上。\n\n你还可以使用 Windows 中的字符映射表（Character Map）程序（或其他操作系统中的类似程序）来获取任何语言字体中字符的数字代码。要找到字符映射表，请点击“开始”\
  \ $\\rightarrow$ “所有程序” $\\rightarrow$ “附件” $\\rightarrow$ “系统工具”。（在 Mac 上，请在任何应用程序的“编辑”菜单中查找“表情符号与符号”选项。）如果你想要的字符代码是\
  \ `214`，请使用 `&#214;` 将其放置在网页上。如果你找不到字符映射表程序，请使用操作系统的内置帮助功能查找具体位置。\n\n**问：我见过一些网页使用小三维球或其他特殊图形作为项目符号。他们是怎么做到的？**\n\
  \n\n\n\n\n**答。** 那个技巧稍微超出了本课涵盖的范围。你将在 第 8 课 中学习如何实现。\n\n**问。我创建了一个大表格，但当我加载页面时，页面上很长时间什么都没有出现。为什么要等待？**\n\
  \n**答。** 复杂的表格可能需要一段时间才能在屏幕上显示。浏览器必须在显示表格的任何部分之前，计算出表格中所有内容的尺寸。你可以通过为表格中的每张图片定义\
  \ `width` 和 `height` 属性来稍微加快速度。为 `<table>` 和 `<td>` 元素定义具体宽度也有帮助。你可能需要将极大的表格拆分为较小的表格，以便它们单独渲染。\n\
  \n## 工作坊\n\n工作坊包含测验问题和活动，以帮助你巩固对所涵盖材料的理解。\n\n### 测验\n\n**1.** 如果不使用 `<b>` 或 `<strong>`\
  \ 标签，而是使用样式，你将如何创建一个前三个单词为粗体的段落？\n\n**2.** 你将如何表示水的化学式？\n\n**3.** 如何在网页上显示 “© 2018,\
  \ Webwonks Inc.”？\n\n**4.** 你将如何使页面上的所有文本居中？\n\n**5.** 你如何创建一个简单的两列两行表格，并用单像素黑色边框勾勒表格？\n\
  \n**6.** 为什么在网页上写 3 < 6 时应该使用字符代码？\n\n**7.** 使用此样式属性 `font-family: Geneva, Arial,\
  \ helvetica, sans-serif;` 时，大多数浏览器将使用哪种字体？\n\n**8.** 定义 Web 字体（网络字体）的 CSS 命令是什么？\n\
  \n**9.** 嵌套在另一个列表内部的列表称作什么？\n\n**10.** 在网页上创建三列报纸布局的 CSS 属性是什么？\n\n**注意**\n\n在此提醒阅读本书印刷版或电子书版本的读者：如果你访问\
  \ [www.informit.com/register](http://www.informit.com/register) 并注册本书（使用 ISBN 9780672338083），你可以免费访问在线\
  \ Web 版本，该版本不仅包含本书的完整文本，还提供此测验的交互版本。\n\n### 答案\n\n**1.** 你可以使用这段代码：\n\n```html\n\
  <p><span style=\"font-weight: bold;\">First three words</span> are bold.</p>\n```\n\
  \n**2.** 你可以使用 `H<sub>2</sub>O`。\n\n**3.** 你可以使用以下任意一种：\n\n`&copy; 2018, Webwonks\
  \ Inc.`\n\n`&#169; 2018, Webwonks Inc.`\n\n**4.** 如果你考虑在页面顶部的 `<body>` 标签之后立即放置一个\
  \ `<div style=\"text-align:center;\">`，并在页面末尾的 `</body>` 标签之前放置 `</div>`，那么你是正确的。然而，`text-align`\
  \ 样式也直接在 `<body>` 标签中受支持，这意味着你可以省去 `<div>` 标签，直接将 `style=\"text-align:center;\"\
  ` 样式放在 `<body>` 标签中。瞧，整个页面就居中了！\n\n**5.** 使用以下 HTML：\n\n点击此处查看代码图片\n\n```html\n\
  <table style=\"border: 1px solid #000000; border-collapse: collapse;\">\n  <tr>\n\
  \    <td>Top left...</td>\n    <td>Top right...</td>\n  </tr>\n  <tr>\n    <td>Bottom\
  \ left...</td>\n    <td>Bottom right...</td>\n  </tr>\n</table>\n```\n\n**6.** 因为\
  \ `<` 字符也是 HTML 标签的起始字符，通过编写 `3 &lt; 6`，你可以确保浏览器知道要显示小于号，而不是认为 `<` 是 HTML 标签的开始。\n\
  \n**7.** 这在大多数浏览器中将以 Geneva 字体显示。如果浏览器没有该字体，它将以 Arial 显示，然后是 Helvetica，最后使用其默认的\
  \ `sans-serif` 字体。\n\n**8.** 你使用 `@font-face` 规则来定义 Web 字体的名称和源 URL。\n\n**9.** 另一个列表内部的列表被称为\
  \ `nested list`（嵌套列表）。\n\n**10.** 使用 `column-count: 3;` 在你的页面上定义三列布局。\n\n### 练习\n\
  \n*   ![Image](img/arrow1.jpg) 将你在本课中学到的字体级样式属性应用于各种块级元素，例如 `<p>`、`<div>`、`<ul>`\
  \ 和 `<li>` 项目。尝试嵌套你的元素，以感受样式如何（或如何不）在内容层级中级联。\n    使用文本对齐样式属性将文本块放置在网页的各个位置。尝试嵌套你的段落和分区（`<p>`\
  \ 和 `<div>`），以感受样式如何（或如何不）在内容层级中级联。\n*   ![Image](img/arrow1.jpg) 尝试创建一个有序列表，列出你希望放在网页上的信息。这将让你练习格式化\
  \ HTML 列表，并让你提前思考后续课程中涵盖的问题。\n\n# 第 7 课：使用外部和内部链接\n\n**在本课中你将学到：**\n\n*   ![Image](img/arrow.jpg)\
  \ 如何使用锚点链接\n*   ![Image](img/arrow.jpg) 如何在你自己网站的页面之间建立链接\n*   ![Image](img/arrow.jpg)\
  \ 如何链接到外部内容\n*   ![Image](img/arrow.jpg) 如何链接到非 Web 文档（如 PDF 和 Word 文档）\n*   ![Image](img/arrow.jpg)\
  \ 如何链接到电子邮件地址\n*   ![Image](img/arrow.jpg) 如何在链接中使用窗口目标（window targeting）\n*   ![Image](img/arrow.jpg)\
  \ 如何使用 CSS 为链接设置样式\n*   ![Image](img/arrow.jpg) 如何为链接添加描述\n*   ![Image](img/arrow.jpg)\
  \ 网页链接的最佳实践\n\n到目前为止，你已经学习了如何使用 HTML 标签来创建一些基础网页。然而，此时这些内容片段就像一个个孤岛，与任何其他内容都没有联系。要将你的作品变成真正的\
  \ Web 内容，你需要将其与 Web 的其余部分——或者至少是你自己网站内的其他页面——连接起来。\n\n本课将向你展示如何创建指向自身文档内内容的超文本链接，以及如何链接到其他外部文档。此外，你将学习如何为超文本链接设置样式，使其以你想要的颜色和装饰显示，而不一定是默认的蓝色下划线显示。你还将学习设计师在\
  \ 20 多年的网页链接实践中总结出的一些最佳实践。\n\n## 使用 Web 地址\n\n存储单个网站 Web 内容最简单的方法是将所有文件放在同一个文件夹中。当文件像这样存储在一起时，你只需在\
  \ `<a>` 标签的 `href` 属性中提供文件名即可链接到它们。\n\n**注意**\n\n在深入学习本课之前，你可能需要温习一下关于在服务器上放置文件以及如何在目录集中管理文件的基础知识。在创建\
  \ Web 内容链接时，理解这些信息至关重要。请参考 第 1 课 “ 理解 Web 如何工作”，特别是标题为 “理解在 Web 服务器上放置文件的位置” 的章节。\n\
  \n`attribute`（属性）是与标签相关联的一段信息，用于提供关于该标签的进一步详细信息。例如，`<a>` 标签的 `href` 属性标识了你所链接的页面或文档的地址。\n\
  \n\n\n\n\n# 使用目录和相对地址组织内容\n\n当你的页面数量超过几个，或者开始为网站内容建立组织结构时，你应该将文件放入目录（或文件夹）中，目录名称应反映其中的内容。例如，所有图片可以放在\
  \ `images` 目录中，公司信息可以放在 `about` 目录中，以此类推。无论你如何在 Web 服务器内部组织文档，都可以使用相对地址，这种地址只包含从一个页面找到另一个页面所需的足够信息。\n\
  \n相对地址描述的是从一个网页到另一个网页的路径，与完整（或绝对）的互联网地址相对。\n\n正如你在第 1 课中回忆的那样，Web 服务器的文档根目录是专门作为\
  \ Web 内容顶级目录的目录。在 Web 地址中，该文档根目录由正斜杠（`/`）表示。所有后续的目录层级都由相同类型的正斜杠分隔，如下例所示：`/directory/subdirectory/subsubdirectory/`。\n\
  \n### 注意\n在 HTML 中，始终使用正斜杠（`/`）来分隔目录。不要使用 Windows 操作系统中通常使用的反斜杠（`\\`）来分隔目录。你可以这样记住：Web\
  \ 上的一切都是向前移动的，所以使用正斜杠。\n\n假设你正在文档根目录中创建一个名为 `zoo.html` 的页面，并且想要包含指向 `elephants`\
  \ 子目录中名为 `african.html` 和 `asian.html` 的页面的链接。这些链接看起来如下：\n\n```html\n<a href=\"\
  /elephants/african.html\">了解非洲象。</a>\n<a href=\"/elephants/asian.html\">了解亚洲象。</a>\n\
  ```\n\n这些特定地址实际上被称为相对根地址，它们是缺少完整域名的相对地址，但具体是相对于由正斜杠指定的文档根目录。\n\n使用常规的相对地址，你可以省略开头的正斜杠。这种地址允许链接相对于它们所在的任何目录——无论是文档根目录，还是文档根目录下一级或多级的其他目录。这就是常规相对地址的样子：\n\
  \n```html\n<a href=\"elephants/african.html\">了解非洲象。</a>\n<a href=\"elephants/asian.html\"\
  >了解亚洲象。</a>\n```\n\n`elephants` 子目录中的 `african.html` 和 `asian.html` 文档可以通过以下任一方式链接回主\
  \ `zoo.html` 页面：\n\n```html\n<a href=\"http://www.yourdomain.com/zoo.html\">返回动物园。</a>\n\
  <a href=\"/zoo.html\">返回动物园。</a>\n<a href=\"../zoo.html\">返回动物园。</a>\n```\n\n第一个链接是绝对链接。使用绝对链接时，链接的目标绝对明确，因为提供了完整的\
  \ URL——包括域名。\n\n第二个链接是相对根链接。它相对于你当前浏览的域名，因此不需要协议类型（例如 `http://`）或域名（例如 `www.yourdomain.com`）；提供了开头的正斜杠以表明地址从文档根目录开始。\n\
  \n### 注意\n关于相对地址（`elephants/african.html`）与绝对地址（`http://www.takeme2thezoo.com/elephants/african.html`）的一般规则是：当链接到存储在一起的文件时（例如，都属于同一网站的文件），应使用相对地址。当链接到其他位置的文件时——另一台计算机、另一个磁盘驱动器，或者更常见的是互联网上的另一个网站——应使用绝对地址。\n\
  \n在第三个链接中，双点（`..`）是一个特殊命令，表示包含当前文件夹的文件夹——换句话说，就是父文件夹。每当你看到双点时，只需对自己说：“在目录结构中向上移动一级。”\n\
  \n相对地址的优势在于，只要页面保留在同一站点上，链接就能正常工作。如果你在整个网页中一致地使用相对地址，就可以将页面目录移动到另一个文件夹、磁盘驱动器或 Web\
  \ 服务器，而无需更改链接。\n\n如有必要，相对地址可以跨越相当复杂的目录结构。第 28 课“组织和管理网站”提供了关于组织与链接大量网页的更详细建议。\n\n\
  ## 自己动手：创建简单的网站架构\n\n希望到目前为止，你在学习课程的过程中已经创建了一两个自己的页面。按照以下步骤添加更多页面并链接它们：\n\n1. 使用一个主页作为主要入口和中心枢纽，所有其他页面都与之相连。如果你创建了一个关于自己或企业的页面，请将该页面用作主页。你也可以为此目的创建一个新页面。\n\
  2. 在主页上，放置一个指向你已创建的其他 HTML 文件的链接列表（或指向你计划很快创建的 HTML 文件的占位符）。确保每个链接中文件名的拼写（包括任何大小写）都正确无误。\n\
  \n**注意：** 大多数 Web 服务器运行 UNIX 或 Linux，它们区分大小写，但 Windows 在本地查看页面时不区分大小写。这意味着指向 `african.html`\
  \ 和 `African.html` 的链接在 Windows 机器上会指向同一页面，但在 Web 服务器上会指向不同页面。最好为所有 Web 文件名统一使用一种大小写——最好是小写。\n\
  \n3. 在除主页之外的每个其他页面上，在底部（或顶部）包含一个返回主页的链接。这使你的网站导航变得简单易行。\n4. 你可能还想在主页或单独的链接页面上包含一个指向相关或有趣网站的链接列表。\n\
  \n## 使用锚点在同一页面内链接\n\n`<a>` 标签——负责 Web 上超链接的标签——其名称来源于“锚点”（anchor），因为链接充当了网页中某个位置的标记。在迄今为止的课程示例中，你已经学会了如何使用\
  \ `<a>` 标签链接到其他地方，但这只是它一半的用途。让我们开始使用锚点链接来链接到同一页面内的内容。\n\n### 使用锚点标识页面中的位置\n\n`<a>`\
  \ 标签可用于将页面上的某个点标记为锚点，从而允许你创建指向该确切位置的链接。清单 7.1 演示了指向页面内锚点的链接。为了了解这些链接是如何制作的，让我们快速预览一下清单中的第一个\
  \ `<h1>` 标签：\n\n```html\n<h1 id=\"top\">莎士比亚十四行诗首行</h1>\n```\n\n`<a>` 标签使用 `href`\
  \ 属性来指定超链接目标。`<a href=\"...\">` 是你点击的内容，而具有相应 `id` 属性的元素是点击后跳转到的位置。在此示例中，`<h1>`\
  \ 标签指定了一个目标，但它也是该页面部分的标题。`id` 属性为标签出现的页面上的特定点赋予一个名称，此处为 `top`。必须为 `id` 属性分配一个唯一的名称，但它可以放置在页面中你希望链接到达的任何元素上。\n\
  \n\n\n\n你可以在 HTML5 的任何容器元素上使用 `id` 属性，并且也可以使用 `<a>` 标签将这些元素作为锚点链接进行指向。最佳实践建议你不要为文档添加额外的标签，而是简单地在已存在的相关标签上添加\
  \ `id` 属性。\n\n## 链接到锚点位置\n\n列表 7.1 显示了一个在单个页面中放置了各种锚点的网站。请查看 列表 7.1 中的最后一个 `<a>`\
  \ 标签以查看示例：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#top\">返回索引。</a>\n```\n\n`#` 符号意味着\
  \ `top` 单词指的是当前文档内一个命名的锚点，而不是单独的页面。当用户点击`返回索引`时，网络浏览器将显示页面中带有 `id=\"top\"` 属性的标签开始的部分。\n\
  \n`列表 7.1` 使用带有 `id` 属性的 `<a>` 标签设置锚点\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>字母排序的莎士比亚</title>\n\
