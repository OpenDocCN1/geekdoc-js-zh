  \        <li>...fourteen hundred and ninety-two.</li>\n        <li>...fifteen hundred\
  \ and eighty-eight.</li>\n        <li>...sixteen hundred and sixty-six.</li>\n \
  \     </ol>\n      <p style=\"text-align: center;\">\n        <a href=\"historyquiz.html\"\
  >Return to the Questions</a>\n      </p>\n    </section>\n  </body>\n</html>\n```\n\
  \n![一张截图显示了“历史测验答案”页面，该页面显示了答案，同样从 1 到 3 编号，对应于历史测验的答案，底部有“返回问题”的链接。](img/07fig04.jpg)\n\
  \n**图 7.4** 图 7.3 中的“检查你的答案!”链接将你带到这个答案页面。`返回问题`链接将带你回到在图 7.3 中显示的内容。\n\n使用文件名而不是完整的\
  \ Internet 地址可以节省大量的打字时间。更重要的是，无论这组页面存储在何处，页面之间的链接都能正常工作。当文件仍在你计算机的硬盘上时，你可以测试这些链接。然后你可以将它们移动到网络服务器、CD-ROM、DVD\
  \ 或 USB 驱动器，所有链接都将仍然正常运行。这种识别网页的简化方法并没有什么神奇之处；它完全与网页地址有关，正如你已经学习的那样。\n\n注意\n\n在代码列表\
  \ 7.2 和代码列表 7.3 中，你都会看到大部分内容周围使用了`<section></section>` 标签对。你可能会想这是否完全必要——毕竟它是页面上的唯一内容。答案是，并不是完全必要。HTML\
  \ 仍然可以通过验证，而且即使没有`<section></section>` 标签，任何查看这段代码的人都不会对其组织结构感到困惑。在这里使用这些标签仅仅是为了确保你在这些代码示例中习惯看到它们，并提供一个机会来包含这段关于你未来某时刻*可能*使用\
  \ `<section></section>` 标签的注释。例如，如果你将问题部分和答案部分都放在一个页面上并应用样式和一些基于 JavaScript 的交互功能，你可以隐藏一个部分（问题部分），直到读者点击链接，然后会显示另一个部分（答案部分）。此操作超出了这些课程的范围，但它是说明最简单的标记如何为你以后的更大工作做准备的一个示例。\n\
  \n### 链接到非 HTML 文件\n\n一旦你学会了如何链接到 HTML 文档，就可以以相同的方式链接到非 HTML 文档。像文字处理文档和 PDF 文件都是网上其他文件的示例。要链接到它们，只需将\
  \ `href` 属性中的 URL 替换为文档的位置，如这些示例所示：\n\n点击此处查看代码图像\n\n```\n<a href=\"myWordDoc.doc\"\
  >my word-processed document</a>\n<a href=\"myPDFfile.pdf\">my PDF file</a>\n```\n\
  \n第一个示例链接到文字处理文档（`.doc`），第二个示例链接到 PDF 文件（`.pdf`）。当点击这些链接时，浏览器将执行以下两种操作之一：它要么会在窗口中打开文档，要么会打开一个下载对话框，要求用户下载文件。\n\
  \n有时，要求链接的文档下载到用户的本地计算机是有意义的。但 Web 浏览器通常尝试在不下载的情况下尽可能显示内容，因为下载可能很慢，而且某些操作系统不允许这样做。为了强制浏览器打开下载对话框，请向链接中添加\
  \ `download` 属性。这被称为*布尔属性*（Boolean attribute），因为它是开启或关闭二选一。有时你会看到它们被写成具有自引用值的形式，例如\
  \ `download=\"download\"`。该属性是 HTML5 中引入的新属性，在所有现代浏览器中都有良好支持，但 Internet Explorer\
  \ 除（但在 Edge 中有效）和 iOS Safari）。\n\n要强制上述两个链接成为下载链接，请编写以下内容：\n\n点击此处查看代码图像\n\n```\n\
  <a href=\"myWordDoc.doc\" download>my word-processed document</a>\n<a href=\"myPDFfile.pdf\"\
  \ download>my PDF file</a>\n```\n\n\n\n## 链接到电子邮件地址\n\n除了在页面之间以及同一页面的不同部分之间创建链接外，`<a>`\
  \ 标签还允许你链接到电子邮件地址。这是一种最简单的方式，让网页访客能够向你反馈信息。当然，你也可以直接提供电子邮件地址，让访客自行输入到他们使用的邮件程序中，但这会增加出错的可能性。通过提供可点击的电子邮件链接，你可以让访客几乎毫不费力地发送消息，并消除拼写错误的风险。\n\
  \nHTML 链接到电子邮件地址的写法如下：\n\n```html\n<a href=\"mailto:yourusername@yourdomain.com\"\
  >Send me an email message.</a>\n```\n\n文字 `Send me an email message` 会像其他 `<a>`\
  \ 链接一样显示。\n\n如果你想让人们看到你的真实电子邮件地址（以便他们记录或使用其他邮件程序发送消息），可以将地址同时放在 `href` 属性和 `<a>`\
  \ 与 `</a>` 标签之间的文本中，如下：\n\n```html\n<a href=\"mailto:you@yourdomain.com\">you@yourdomain.com</a>\n\
  ```\n\n**注意** 许多垃圾邮件发送者使用自动化工具从网页中收集电子邮件地址，他们通过搜索 `mailto` 链接和电子邮件地址来获取信息。虽然有一些方法可以尝试隐藏电子邮件地址以防止垃圾邮件发送者，但一般来说，只要电子邮件地址在网页中可用，垃圾邮件发送者就能获取它。因此，请确保你指向的地址有强大的垃圾邮件过滤器。\n\
  \n在大多数网页浏览器中，当用户点击链接时，会弹出一个窗口，用户可以在其中输入消息，消息会立即发送到 `mailto` 电子邮件地址——并且该用户用于发送和接收电子邮件的邮件程序会自动被调用。\n\
  \n你可以在链接中提供一些额外信息，使邮件的主题和正文也具有默认值。你可以通过在 `mailto` 链接中添加 `subject` 和 `body` 变量来实现这一点。变量与电子邮件地址之间用问号（`?`）分隔，变量与值之间用等号（`=`）分隔，然后各个变量和值对之间用\
  \ & 符号（`&`）分隔。以下是一个为前面的电子邮件示例指定主题和正文的例子：\n\n```html\n<a href=\"mailto:author@somedomain.com?subject=Book\
  \ Question&body=When is the next edition coming out?\">author@somedomain.com</a>\n\
  ```\n\n当用户点击此链接时，会创建一封电子邮件，收件人为 `author@somedomain.com`，主题为 `Book Question`，正文为\
  \ `When is the next edition coming out?`。\n\n**提示** 如果你只想指定邮件主题而不指定正文，可以省略 & 符号以及\
  \ `body` 变量、等号和值文本字符串，如下：\n\n```html\n<a href=\"mailto:author@somedomain.com?subject=Book\
  \ Question\">author@somedomain.com</a>\n```\n\n你还可以使用 `cc` 和 `bcc` 属性在邮件中添加抄送和密送收件人，如下：\n\
  \n```html\n<a href=\"mailto:author@somedomain.com?subject=Book Question&cc=coauthor@somedomain.com&bcc=publisher@somedomain.com\"\
  >Mail the author</a>\n```\n\n这会将 `Book Question` 消息发送给 `author@somedomain.com`，抄送\
  \ `coauthor@somedomain.com`，并密送 `publisher@somedomain.com`。\n\n**提示** 如果你在所有网页的页脚中放置电子邮件联系链接，其他人会更容易联系你。使用\
  \ `<address>` HTML 标签在语义上将该电子邮件地址定义为网页的地址。\n\n### 在新浏览器窗口中打开链接\n\n现在你已经掌握了如何创建链接地址——包括内部链接（站内）和外部链接（站外）——还有一种额外的链接方式：强制用户在新的窗口中打开链接。\n\
  \n你肯定听说过弹出窗口，这是一种浏览器窗口——通常是广告产品或服务——旨在未经用户同意自动打开并显示。许多现代浏览器禁止了这种行为。然而，在某些情况下，打开另一个窗口或定位到另一个位置的概念是有合理用途的。例如，你可能想在一个较小的次要浏览器窗口中展示信息，但仍然允许用户在主窗口中查看信息。当用户点击动画演示、电影片段或其他多媒体元素的链接时，通常会出现这种情况。当链接到站外内容时，你也可能想在新浏览器窗口中打开。\n\
  \n`target` 这个词很重要，因为它是与 `<a>` 标签一起使用的属性名。`target` 属性指向一个有效的浏览上下文，或者说“要在其中打开的新窗口”。\n\
  \n一个在新窗口中打开的有效 HTML 链接的写法如下：\n\n```html\n<a href=\"/some/file.html\" target=\"_blank\"\
  >Open a Window!</a>\n```\n\n关键字 `_blank` 是一个特殊的 target 名称，告诉浏览器在一个没有名称的新窗口中打开。开头的前置下划线（`_`）不是拼写错误，而是名称的一部分。你也可以通过任意文本标识符为目标窗口命名，如下：\n\
  \n```html\n<a href=\"/some/file.html\" target=\"newWindow\">Open a New Window!</a>\n\
  ```\n\n在这种情况下，新窗口将被命名为 `newWindow`。任何其他使用相同名称作为目标的链接都将在同一个窗口中打开。\n\n请记住，强制链接在新浏览器窗口中打开——尤其是全尺寸的新窗口——违背了一些可用性和可访问性原则。最佳实践建议，除非没有其他选择，否则应避免这样做。\n\
  \n### 为链接添加标题\n\n链接的一个功能是许多网页设计师容易忘记的 `title` 属性。该属性允许你为链接添加在网页上不会立即显示的描述。例如，以下\
  \ HTML 创建了一个显示为 `Come see my page` 的链接：\n\n```html\n<a href=\"myPage.html\" title=\"\
  This is the best page on this site\">Come see my page</a>\n```\n\n当人们查看页面时，它会显示为标准链接，但如果他们将鼠标悬停在该链接上或聚焦到该链接，浏览器会显示消息\
  \ `This is the best page on this site`。\n\n为链接添加 title 对于依赖屏幕阅读器的用户特别有用，因为他们可以在点击链接之前获取更多关于链接的信息。你也可以将\
  \ `title` 属性用作样式钩子。要选择所有具有 `title` 属性的链接，你可以这样写：\n\n```css\na[title] { /* put styles\
  \ here */ }\n```\n\n可以把 `title` 属性看作是一种在不占用页面空间的情况下提供链接更多信息的方式。它并不是用来重复链接文本的，那样做既无意义又乏味。而且它对搜索引擎可见性没有任何帮助，所以不要在其中填充垃圾关键词短语。用它来提供更有用的信息。如果你没有更多有用的信息，就不要使用\
  \ `title` 属性。\n\n### 使用 CSS 为超链接添加样式\n\n\n\n\n# 使用 CSS 设置链接样式\n\n网页上基于文本的超链接默认显示为带下划线的蓝色文本。你可能还注意到，之前访问过的链接会显示为带下划线的紫色文本；这种颜色也是默认的。如果你在网络上花过一些时间，你也会发现并非所有链接都是蓝色或紫色的——对此我们都心存感激。通过使用一点\
  \ CSS 以及对 `<a>` 链接各种伪类的了解，你可以让链接呈现任何你想要的样式。\n\n> **注意**  \n> 你可以通过将 `<img>` 标签放在起始\
  \ `<a>` 和结束 `</a>` 标签之间，使用图形作为链接（而不是使用文本作为链接）。\n\n*伪类* 是一种描述元素在特定情况下（例如用户与该元素交互的各种状态）样式的类。\n\
  \n例如，以下是 `<a>` 标签常见的伪类：\n\n* ![图片](img/arrow.jpg) `a:link`——描述尚未被访问过的超链接的样式。\n*\
  \ ![图片](img/arrow.jpg) `a:visited`——描述之前已被访问过且存在于浏览器记忆中的超链接的样式。\n* ![图片](img/arrow.jpg)\
  \ `a:hover`——描述当用户鼠标悬停在超链接上时（且在点击之前）的样式。\n* ![图片](img/arrow.jpg) `a:focus`——描述当用户激活链接时超链接的样式。这通常用于没有鼠标的设备上，因此无法进行点击。\n\
  * ![图片](img/arrow.jpg) `a:active`——描述正在被点击但尚未释放的超链接的样式。\n\n> **注意**  \n> 务必记住设置\
  \ `:focus` 属性的样式，因为如今许多人使用没有鼠标的设备来浏览网页。大多数人在平板电脑和智能手机上浏览网页的频率高于使用带鼠标的电脑。而且 `:focus`\
  \ 对于使用键盘导航网页的无障碍访问也至关重要。\n\n例如，假设你想生成一个具有以下样式的链接：\n\n* ![图片](img/arrow.jpg) 字体为粗体且使用\
  \ Verdana（并且不带下划线，即无文本装饰）\n* ![图片](img/arrow.jpg) 基础颜色为浅蓝色\n* ![图片](img/arrow.jpg)\
  \ 当用户悬停、聚焦或点击时颜色变为红色\n* ![图片](img/arrow.jpg) 用户访问后颜色变为灰色\n\n你的样式表条目可能如下所示：\n\n```css\n\
  a {\n   font-family: Verdana, sans-serif;\n   font-weight: bold;\n   text-decoration:\
  \ none;\n}\n\na:link {\n   color: #6479A0;\n}\n\na:visited {\n   color: #cccccc;\n\
  }\n\na:hover {\n   color: #e03a3e;\n}\n\na:focus {\n   color: #e03a3e;\n}\n\na:active\
  \ {\n   color: #e03a3e;\n}\n```\n\n> **注意**  \n> 此示例中的颜色通过其十六进制值表示。\n\n由于示例链接无论处于何种状态都将是\
  \ Verdana 粗体（且不带下划线），因此这三个属性和值对可以放在 `a` 选择器的规则中。然而，由于每个伪类必须关联特定的颜色，我们为每个伪类使用一条规则，如代码示例所示。伪类会继承父规则的样式，除非伪类的规则明确覆盖了该规则。换句话说，前面示例中的所有伪类都将是\
  \ Verdana 粗体（且不带下划线）。但是，如果我们为 `hover` 伪类使用以下规则，那么当用户悬停时，文本将以 Comic Sans 字体显示（前提是用户确实安装了\
  \ Comic Sans 字体）：\n\n```css\na:hover {\n   font-family: \"Comic Sans MS\";\n   color:\
  \ #e03a3e;\n}\n```\n\n此外，由于 `active`、`focus` 和 `hover` 伪类使用相同的字体颜色，你可以合并它们的样式规则：\n\
  \n```css\na:hover, a:focus, a:active {\n   color: #e03a3e;\n}\n```\n\n清单 7.4 将这些代码片段组合在一起，生成一个使用样式化伪类的页面；图\
  \ 7.5 展示了这段代码的结果。\n\n### 清单 7.4：使用样式显示链接伪类\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>示例链接样式</title>\n    <style>\n\
  \    a {\n      font-family: Verdana, sans-serif;\n      font-weight: bold;\n  \
  \    text-decoration: none;\n    }\n    a:link {\n      color: #6479a0;\n    }\n\
  \    a:visited {\n       color: #cccccc;\n    }\n    a:hover, a:active {\n     \
  \  color: #ff0000;\n    }\n    </style>\n  </head>\n  <body>\n    <h1>示例链接样式</h1>\n\
  \    <p><a href=\"simplelinkstyle.html\">第一次看到我时，我应该是一个浅蓝色、粗体、无下划线的 Verdana 字体链接</a>。</p>\n\
  \  </body>\n</html>\n```\n\n![屏幕截图显示“示例链接样式”窗口，其中以链接样式显示文本，字体属性为：Verdana 字体、粗体且无下划线。](img/07fig05.jpg)\n\
  \n### 图 7.5：链接可以使用特定样式来控制视觉显示。\n\n如果你在网页浏览器中查看该示例，链接确实应该是浅蓝色、粗体、无下划线的 Verdana 字体。如果你将鼠标悬停在链接上或点击链接但不释放，它会变成红色。如果你点击并释放链接，页面会重新加载，因为链接指向的是同名文件。然而，此时链接已存在于浏览器的记忆中，因此会显示为已访问链接——它呈现灰色而不是蓝色。\n\
  \n你可以使用 CSS 对链接应用各种与文本相关的更改。你可以更改字体、大小、粗细、装饰等。有时你可能希望在样式表中使用多组链接样式。在这种情况下，你可以创建类；你不必局限于只使用一组\
  \ `<a>` 标签的样式。以下示例是一组用于 `footerlink` 类的样式表规则，适用于你可能希望放置在网站页脚区域的链接：\n\n```css\na.footerlink\
  \ {\n   font-family: Verdana, sans-serif;\n   font-weight: bold;\n   font-size:\
  \ 75%;\n   text-decoration: none;\n}\n\na.footerlink:link,\na.footerlink:visited\
  \ {\n   color: #6479a0;\n}\n\na.footerlink:hover,\na.footerlink:active,\na.footerlink:focus\
  \ {\n   color: #e03a3e;\n}\n```\n\n如下面的示例所示，类名（`footerlink`）出现在选择器名（`a`）之后，由点分隔，并在伪类名（`hover`）之前，由冒号分隔：\n\
  \n`selector.class:pseudo-class`\n\n`a.footerlink:hover`\n\n## 有效使用链接\n\n在本课中，我们提到了几个有效使用链接的最佳实践，但还有几点你应该了解：\n\
  \n* ![图片](img/arrow.jpg) **让链接突出显示**——链接应与页面上的文本区分开来，以便用户知道他们可以对链接进行操作。你可以通过更改链接的颜色、背景颜色、添加下划线（大多数浏览器的默认设置）、增大字体、加粗或其他方式让链接突出显示。重要的是，要让链接发挥作用，用户必须知道它们是链接。\n\
  \n* ![图片](img/arrow.jpg) **仅对链接使用链接样式**——这是第一条规则的推论。如果链接要突出显示，它们必须与周围文本看起来不同。如果你为链接添加下划线，那么就不应该为非链接文本添加下划线。同样的思路也适用于链接颜色：如果你将链接设置为红色，那么就不应该将红色用于其他非链接文本。\n\
  \n\n\n\n\n*   ![Image](img/arrow.jpg) **为已访问链接设置样式**——让用户知道他们之前是否访问过某个页面非常重要。如果已访问链接和未访问链接看起来一样，用户会在链接循环中感到困惑。一个实用的经验法则是使用与标准链接相同颜色但稍暗的色调。这样既能提供视觉提示，表明链接已被访问，又不会破坏你的设计。\n\
  *   ![Image](img/arrow.jpg) **为链接文本使用描述性内容**——人们很容易写出“点击这里”并将这两个词设为链接，但这种链接使用起来更困难。“点击这里”并没有说明用户点击后会得到什么。它迫使读者扫描其余内容来判断是否值得点击，而你让读者做的额外工作越多，他们就越可能转向其他人的网站。注意，这并不意味着你不能说“点击这里”，只是不要让那成为唯一可点击的文本。\n\
  *   ![Image](img/arrow.jpg) **为文本链接添加内边距**——内边距是链接周围的空白区域。通过添加内边距，即使文字很小，也能确保链接更易于点击。要添加内边距，你可以这样写：`a\
  \ { padding: 3px; }`。这对于导航链接尤其重要。你将在第 9 课“处理边距、内边距、对齐和浮动”中了解更多关于内边距的内容。\n*   ![Image](img/arrow.jpg)\
  \ **链接图片**——可用性研究表明，即使图片不是链接，用户也会注意到并点击它们。因此，如果你的网页上有图片，将它们设为链接是合理的。至少，你应该将你的徽标链接到主页，但页面上的其他图片也应该被链接。\n\
  *   ![Image](img/arrow.jpg) **使用图标帮助理解**——你可以为链接添加图标，帮助用户快速了解它们指向哪里。从社交媒体到文件类型再到娱乐等，各种类型的图标都有。\n\
  *   ![Image](img/arrow.jpg) **避免微小的链接**——小链接难以点击，在触摸屏设备上几乎无法点击。文字越小，读者使用起来就越困难。如果你的网站面向老年人，你应该为所有文本使用至少\
  \ 12 磅的字体。\n\n### 总结\n\n`<a>`标签是让超文本变得“超”的关键。通过它，你可以在页面之间创建链接，也可以链接到任何页面上的特定锚点。本课重点介绍了如何使用相对或绝对地址来创建和样式化指向其他页面的简单链接。\n\
  \n你学到了，在创建指向他人页面的链接时，必须在`<a href>`标签中包含每个页面的完整互联网地址。对于你自己页面之间的链接，只需包含文件名以及从一个页面到另一个页面所需的目录信息。\n\
  \n你还学会了如何在页面内创建命名锚点，以及如何创建指向特定锚点的链接。你学会了如何链接到你的电子邮件地址，以便用户轻松向你发送消息。你还学会了如何保护你的电子邮件地址免受垃圾邮件发送者的侵扰。最后，你学习了使用\
  \ CSS 控制链接显示的方法，以及基于 20 多年网页设计经验总结出的一些最佳链接实践。\n\n表 7.1 总结了本课讨论的`<a>`标签。\n\n**表 7.1**\
  \ 第 7 课中涉及的 HTML 标签和属性\n\n| **标签/属性** | **功能** |\n| --- | --- |\n| `<a>`…`</a>`\
  \ | 配合`href`属性，创建指向另一个文档或锚点的链接。配合`id`属性，创建一个可被链接到的锚点。 |\n| *属性* | 功能 |\n| `href=\"\
  `*`地址`*`\"` | 指定要链接到的文档或锚点的地址。 |\n| `id=\"`*`名称`*`\"` | 指定文档中此锚点的名称。 |\n\n### 问答\n\
  \n**问：如果我链接到互联网上的一个页面，然后该页面的所有者删除了它或移动了它，会发生什么？**\n\n**答：** 这取决于该外部页面的维护者如何设置其网页服务器。通常，当你点击一个已被移动或删除的链接时，你会看到一条`页面未找到`的消息（有时称为\
  \ 404 页面，引用服务器传递的 HTTP 错误代码）。你仍然可以点击“后退”按钮返回你的页面。作为网站维护者，你可以定期运行链接检查程序，以确保你的内部和外部链接有效。一个例子是[`validator.w3.org/checklink`](https://validator.w3.org/checklink)上的链接检查器服务。\n\
  \n**问：我网站上的一个内部链接在我的电脑上工作正常，但当我将页面放到互联网上时，链接就不工作了。怎么回事？**\n\n**答：** 最常见的原因如下：\n\n\
  *   ![Image](img/arrow.jpg) **大小写问题**——在 Windows 电脑上，使用`<a href=\"myfile.html\"\
  >`链接到名为`MyFile.html`的文件是可行的。但在大多数网页服务器上，链接必须是`<a href=\"MyFile.html\">`，或者你必须将文件名改为`myfile.html`。更糟糕的是，某些文本编辑器和文件传输程序会在不通知你的情况下更改大小写。最好的解决方案是坚持对网页文件使用全小写文件名。\n\
  *   ![Image](img/arrow.jpg) **文件名中的空格**——大多数网页服务器不允许文件名包含空格。例如，你永远不应该将网页命名为`my page.html`。相反，应将其命名为`mypage.html`，甚至`my_page.html`或`my-page.html`（使用下划线或短横线代替空格）。\n\
  *   ![Image](img/arrow.jpg) **本地绝对地址**——如果你使用本地绝对地址链接文件，例如`C:\\mywebsite\\news.html`，那么当你将文件放到互联网上时，该链接将无法工作。你永远不应该使用本地绝对地址；出现这种情况通常是由于创建临时链接来测试页面部分内容时意外造成的。因此，在将页面发布到\
  \ Web 之前，请务必删除所有测试链接。\n\n**问：我可以在同一个`<a>`标签中同时放置`href`和`id`吗？有什么理由需要这样做吗？**\n\n\
  **答：** 可以，如果你有一个命名锚点和一个链接紧挨着，这样做可能会节省一些输入。然而，通常最好将`id`属性放在另一个元素上，以避免混淆。请记住，它们在 HTML\
  \ 文档中扮演着非常不同的角色。\n\n**问：如果我意外拼错了锚点的名称，或者忘记在它前面加#，会发生什么？**\n\n**答：** 如果你链接到一个页面内不存在的锚点名称，或者拼错了锚点名称，链接会跳转到该页面的顶部。如果你写了一个锚点，但前面没有\
  \ URL 或`#`，浏览器会尝试带你到一个同名的页面，这通常会导致`页面未找到`错误。\n\n## 工作坊\n\n工作坊包含测验问题和练习，帮助你巩固对所学内容的理解。\n\
  \n### 测验\n\n**1.** 你小学时最好的朋友在互联网上找到了你，并说他想交换主页链接。你如何在他的网站[www.supercheapsuits.com/~billybob/](http://www.supercheapsuits.com/~billybob/)上放置一个指向你页面的链接？\n\
  \n**2.** 你会使用什么 HTML，使得点击页面顶部的“关于作者”文字时，能够跳转到页面其他位置的致谢列表？\n\n**3.** 如果你的电子邮件地址是\
  \ bon@soir.com，你如何将文本“晚安问候”变成一个链接，让人们点击后可以撰写并发送电子邮件给你？\n\n**4.** 你可以向 HTML 元素添加什么属性来将其变为锚点？\n\
  \n**5.** 你使用什么字符来链接到锚点？\n\n\n\n\n\n### **6.** 你如何告诉浏览器链接的目标文档应该被下载而不是在窗口中加载？\n\n\
  ### **7.** 在什么情况下需要在链接中包含 `http://`？\n\n### **8.** 你在 `mailto` 链接中使用可以使用哪些邮件功能？\n\
  \n### **9.** 强制链接在新窗口中打开的最佳情况是什么时候？\n\n### **10.** 你使用哪种伪类来为已访问链接设置样式？\n\n### 注意事项\n\
  \n为正在阅读此书纸质版或电子书版 读者们提个醒：如果你访问 `[www.informit.com/register](http://www.informit.com/register)`\
  \ 并注册此书（使用 ISBN `9780672338083`），你就可以免费访问在线 Web 版本。该版本不仅包含本书的完整文本，还具有交互式的问验版本。\n\
  \n### 答案\n\n#### **1.** 在你的页面上放置以下内容：\n\n点击此处查看代码图片\n\n```html\n<a href=\"http://www.supercheapsuits.com/~billybob/\"\
  >Billy Bob's site</a>\n```\n\n#### **2.** 在页面的顶部输入以下内容：\n\n点击此处查看代码图片\n\n```html\n\
  <a href=\"#credits\">About the Authors</a>\n```\n\n在作者介绍部分的开头输入此内容：\n\n```html\n\
  <anytag id=\"credits\">\n```\n\n#### **3.** 在你的网页上输入以下内容：\n\n点击此处查看代码图片\n\n```html\n\
  Send me a <a href=\"mailto:bon@soir.com\">goodnight greeting</a>!\n```\n\n#### **4.**\
  \ `id` 属性可以用于任何 HTML 元素作为锚点。\n\n#### **5.** 你使用井号（`#`）来链接到页面上的命名锚点。\n\n#### **6.**\
  \ 使用属性 `download` 告诉浏览器链接目标 应该被下载。\n\n#### **7.** 当你链接到当前站点之外的页面时，你应该包含 `http://`\
  \ 和剩余的完全限定域名 (FQDN)。\n\n#### **8.** 你必须指向邮件收件人的电子邮件地址。可选值有 `subject`、`body`、`cc`\
  \ 和 `bcc`。\n\n#### **9.** 你应该不惜避免强制链接在新窗口中打开。\n\n#### **10.** 使用 `a:visited` 伪类来为已访问链接设置样式。\n\
  \n### 练习\n\n*   ![Image](img/arrow1.jpg) 创建一个 HTML 文件，其中由你喜爱的网站的格式化列表组成。你可能已经在网页浏览器中收藏了这些网站，在这种情况下，你可以访问它们并在浏览器地址栏中找到准确的\
  \ URL。\n*   ![Image](img/arrow1.jpg) 如果你为某个网站创建了任何页面，请检查它们并考虑文中是否有任何地方你想让人们方便联系你。在那里包含一个指向你电子邮件地址的链接。为人们提供联系你并告诉他们需要什么或对你产品的看法的机会，机会越多越好——尤其是当你经营业务时。\n\
  \n## 第 8 节\n\n## 色彩、图像与多媒体\n\n**你将在本节中学习到：**\n\n*   ![Image](img/arrow.jpg) 如何为你的网站选择适用于\
  \ Web 的颜色\n*   ![Image](img/arrow.jpg) 如何使用 CSS 设置背景、文本和边框颜色\n*   ![Image](img/arrow.jpg)\
  \ 如何选择要使用的图形软件包\n*   ![Image](img/arrow.jpg) 如何准备照片以供在线使用\n*   ![Image](img/arrow.jpg)\
  \ 如何创建横幅和按钮\n*   ![Image](img/arrow.jpg) 如何减少图像中的颜色数量\n*   ![Image](img/arrow.jpg)\
  \ 如何创建透明图像\n*   ![Image](img/arrow.jpg) 如何为平铺背景准备图像\n*   ![Image](img/arrow.jpg)\
  \ 如何创建动画 Web 图\n*   ![Image](img/arrow.jpg) 如何在网页上放置图像\n*   ![Image](img/arrow.jpg)\
  \ 如何用文字描述图像\n*   ![Image](img/arrow.jpg) 如何指定图像的高度和宽度\n*   ![Image](img/arrow.jpg)\
  \ 如何对齐图像\n*   ![Image](img/arrow.jpg) 如何使用背景图像\n*   ![Image](img/arrow.jpg) 如何使用图像地图\n\
  *   ![Image](img/arrow.jpg) 如何链接或嵌入\n*   ![Image](img/arrow.jpg) 如何使用 HTML5 和视频\n\
  *   ![Image](img/arrow.jpg) 本节涵盖了很多主题，但你可以在 `www.informit.com` 找到更多信息\n\n### 注意事项\n\
  \n虽然本节中的示例使用了适用于 Windows、Mac 和 Linux 用户的流行免费程序（GNU Manipulation GIMP），但你可以应用在本节中学到的知识，尽管菜单和选项会有所不同。\n\
  \n在你学会创建图形后，就准备好将它们包含在网站中了。除了使用 `<img>` 标签在浏览器中显示图像的基础知识外，还将学习如何为这些图像提供描述（以及为什么）。你还将学习布局，包括如何使用背景元素。你还将学习使用地图，这允许你将图像作为通向多个位置的链接。\n\
  \n最后，你将熟悉我们在网页上看到的和听到的媒体：音频、视频和动画，以及静态图像和文本。尽管你不会学习如何创建任何特定的音频或视频，但你将学习如何将此类文件包含在你的站点。\n\
  \n### 选择颜色的最佳实践\n\n我们无法告诉你在网站中具体应该使用哪些颜色，但我们可以帮助你理解在自己选择颜色时的某些考虑。你使用的颜色会极大地影响访问者；例如，如果你正在运营一个电子商务网站，你希望使用能够吸引用户查看你的目录并最终购买东西的颜色。如果你创建一个文本密集的网站，你希望色彩方案有助于创建易于阅读的文本。总之，你希望确保在使用颜色时是谨慎且尊重的。\n\
  \n你可能会想，在讨论颜色时，“尊重”是如何进入其中的。请记住，万维网是一个国际社区，人们的解释并不相同。例如，粉色在日本非常受欢迎，但在东欧国家非常不受欢迎。同样，绿色是美国钱的颜色，但绝大多数其他国家的纸币是彩色的——因此“金钱的颜色”并不是单一的颜色，所以这个比喻对国际访问者来说没有任何价值。\n\
  \n除了使用文化敏感的颜色外，其他最佳实践包括以下内容：\n\n\n\n\n# 网页配色设计指南\n\n## 配色方案选择\n\n* ![Image](img/arrow.jpg)\
  \ **使用自然的配色方案**——这并不意味着你应该使用大地色调；相反，你应该使用在悠闲散步时自然看到的颜色，避免使用可能引起眼睛疲劳的过亮颜色。\n\n* ![Image](img/arrow.jpg)\
  \ **使用易于访问的配色组合**——色盲并不罕见，你应该避免将颜色作为唯一区分重要信息的方式。例如，如果你需要显示警告，可以更改文字或背景颜色，但也应添加图标或其他辅助手段来指示问题。为了便于访问，你可以考虑使用\
  \ Toptal 色盲网页过滤器工具 [`Toptal 色盲网页过滤器`](http://www.toptal.com/designers/colorfilter)\
  \ 来查看你的网站在色盲用户眼中的效果。\n\n* ![Image](img/arrow.jpg) **使用高对比度的颜色，尤其对于文本块**——黑底白字之所以如此流行，是因为它具有良好的对比度，易于阅读。避免使用对比度不足的背景/前景颜色组合。你可以在\
  \ [`WebAIM 对比度检查工具`](https://webaim.org/resources/contrastchecker/) 测试两种颜色的对比度。\n\
  \n* ![Image](img/arrow.jpg) **使用小型配色板**——你不需要使用 15 种颜色来实现你的目标。事实上，如果你的页面包含 15 种颜色的文字和图片，你可能需要重新审视你想要传达的信息。专注于\
  \ 3 到 4 种主色，最多配合 1 到 2 种辅助色。\n\n* ![Image](img/arrow.jpg) **考虑你的受众特征**——你可能无法控制你的受众特征，所以你必须找到一个兼顾所有人的折中方案。年轻人喜欢的颜色不一定和老年人喜欢的一样，就像男性和女性之间以及不同地区和文化之间存在颜色偏好差异一样。\n\
  \n你可能现在认为你的颜色选择很有限。其实不然。你只需要在做出决定之前先思考一下你的选择。在你喜欢的搜索引擎中搜索“颜色理论”会给你更多的思考素材，使用色轮也是如此。\n\
  \n## 色轮与配色方案\n\n*色轮*是一张以圆形方式展示颜色组织的图表。它的展示方式旨在帮助你可视化原色、二次色和互补色之间的关系。配色方案是从色轮的使用中发展而来的；理解配色方案可以帮助你确定在整个网站中一致使用的配色方案。例如，了解一些颜色关系的知识有望帮助你避免在浅蓝色背景上使用橙色文字，或在棕色背景上使用亮蓝色文字。\n\
  \n### 常见配色方案\n\n* ![Image](img/arrow.jpg) **类似色**——使用在色轮上相邻的颜色，如黄色和绿色。一种颜色为主色，其类似色伙伴丰富画面。\n\
  \n* ![Image](img/arrow.jpg) **互补色**——使用在色轮上相对的颜色，如暖色（红色）和冷色（绿色）。\n\n* ![Image](img/arrow.jpg)\
  \ **单色**——使用同一主色调的颜色。通过向主色添加白色和黑色来创建二次色。\n\n* ![Image](img/arrow.jpg) **三色**——使用在色轮上等距分布的三种颜色。三色方案在保持平衡的同时仍能提供丰富的色彩使用。\n\
  \n专门讲解颜色理论的书籍和课程有很多，因此在本课中继续讨论确实会偏离主题。然而，如果你打算从事网页设计与开发，扎实的颜色理论基础知识会让你受益匪浅。花些时间阅读相关内容；网上搜索会提供丰富的信息。\n\
  \n此外，花些时间亲手操作色轮。配色方案设计工具 Paletton，位于 [`Paletton 配色方案设计器`](http://paletton.com)，允许你从基础颜色开始生成单色、互补色、三色、四色、类似色和强调类似色配色方案。\n\
  \n## 理解网页颜色\n\n为网页指定除白色以外的背景颜色比您想象的更容易。例如，要将蓝色指定为页面的背景颜色，请在 `<body>` 标签内或 body 元素的样式表规则中放入\
  \ `style=\"background-color:blue;\"`。当然，你可以使用除蓝色以外的许多颜色。事实上，W3C 标准列出了 16 种颜色：aqua、black、blue、fuchsia、gray、green、lime、maroon、navy、olive、purple、red、silver、teal、white\
  \ 和 yellow。\n\n> **注意**\n> \n> CSS 颜色 gray 在标准文档中使用美国拼写。但大多数网页浏览器也支持 grey 作为替代拼写。然而，CSS\
  \ 样式属性 `color` 和 `background-color` 必须使用美国拼写。\n\n> **注意**\n> \n> 要获取 140 种描述性颜色名称的完整列表，以及它们的十六进制代码和浏览器显示颜色的示例，请访问\
  \ [`W3C SVG 类型颜色关键字`](http://www.w3.org/TR/SVG/types.html#ColorKeywords)。\n\n显然，网页上显示的颜色远不止这\
  \ 16 种。事实上，你可以使用 140 种颜色名称，并确保所有浏览器都能类似地显示这些颜色。以下是 140 种描述性颜色名称的部分列表：azure、bisque、cornflowerblue、darksalmon、firebrick、honeydew、lemonchiffon、papayawhip、peachpuff、saddlebrown、thistle、tomato、wheat\
  \ 和 whitesmoke。\n\n> **注意**\n> \n> 颜色名称不区分大小写。因此 `Black`、`black` 和 `BLACK` 都是黑色，尽管大多数网页设计师坚持使用小写或混合大小写（如果他们使用颜色名称的话；大多数设计师使用十六进制表示法来更细致地处理颜色使用）。\n\
  \n但名称是主观的。例如，如果你查看 140 种跨浏览器颜色名称的颜色图表，你会发现无法区分 fuchsia 和 magenta。这两种颜色 fuchsia 和\
  \ magenta 的 RGB 颜色值也完全相同：`rgb(255, 0, 255)`。你将在下一节学习 RGB 颜色值，但现在要知道，如果你想符合标准并使用超过\
  \ W3C 标准规定的 16 种颜色名称，你应该使用 RGB 或十六进制颜色值。\n\n> **注意**\n> \n> 十六进制颜色代码可以产生 1600 万种颜色，大多数现代电脑显示器都能显示所有颜色。但是，要注意并非所有电脑显示器都以相同的色调显示颜色。在你的显示器上看起来漂亮的浅蓝色背景可能在另一位用户的显示器上更偏向紫色。中性、大地色调的颜色（如中灰色、棕褐色和象牙色）在许多电脑显示器上可能产生更不可预测的结果。这些颜色甚至可能在单个显示器上看起来会变色，这取决于房间的照明条件或一天中的时间。\n\
  \n除了将页面的背景更改为白色以外的颜色，你还可以更改文本链接的颜色，包括链接的各种属性（如用户悬停链接时与点击链接时的颜色——正如你在之前的课程中学到的）。你还可以设置容器元素（如段落、区块、块引用和表格单元格）的背景颜色，并且可以使用颜色来指定这些元素的边框。你将在本课的后续部分看到一些颜色和容器元素的示例。\n\
  \n\n\n\n有很多非常糟糕的网站，有些是由非常认真的人创建的，完全没有任何讽刺意味。然而，“世界上最糟糕网站”（见图 8.1）的创建纯粹为了展示网站设计中一些严重的错误，特别是在颜色的使用方面。不过，一张截图无法体现它的真貌（尤其是本书的黑白打印版本），所以请亲自访问并体验该网站：[www.angelfire.com/super/badwebs/main.htm](http://www.angelfire.com/super/badwebs/main.htm)。为了获得最佳效果，请确保已开启声音。\n\
  \n![截图显示了“世界上最糟糕网页”窗口，其中包含彩色的链接和网站设计。](img/08fig01.jpg)\n\n**图 8.1** “世界上最糟糕网站”的部分截图。\n\
  \n如果你在搜索引擎中搜索“糟糕网站示例”，你会发现许多收集糟糕设计案例的网站，并解释了为什么此类网站应该进入“耻辱之堂”而不是“名人堂”。许多网站因为视觉显示问题被认为是糟糕的，而显示问题从颜色选择开始。因此，理解颜色（包括其规格和使用的细微差别）是创建优秀网站的关键步骤。\n\
  \n### 使用十六进制值表示颜色\n\n为了符合标准并同时对你网站中的颜色保持精确控制，你可以通过十六进制值来引用颜色。一种颜色的十六进制值表示在每种颜色中应该混合多少红、绿、蓝光。它的工作原理有点像橡皮泥（Play-Doh）：只需混合你所需的红色、蓝色和绿色的量，即可获得合适的颜色。\n\
  \n十六进制颜色格式为 `#rrggbb`，其中 `rr`、`gg` 和 `bb` 是颜色的红色 (`rr`)、绿色 (`gg`）和蓝色 (`bb`）分量的两位位十六进制值。如果你不熟悉十六进制数字，不用担心。只需记住\
  \ `ff` 是最大值，`00` 是最小值。为每个分量使用以下代码之一：\n\n*   ![Image](img/arrow.jpg) `ff` 意味着全亮度。\n\
  *   ![Image](img/arrow.jpg) `cc` 意味着 80% 亮度。\n*   ![Image](img/arrow.jpg) `99` 意味着\
  \ 60% 亮度。\n*   ![Image](img/arrow.jpg) `66` 意味着 40% 亮度。\n*   ![Image](img/arrow.jpg)\
  \ `33` 意味着 20% 亮度。\n*   ![Image](img/arrow.jpg) `00` 意味着没有这种颜色成分。\n\n例如，亮红色是 `#ff0000`，深绿色是\
  \ `#003300`，蓝紫色是 `#660099`，中灰色是 `#999999`。创建一个红色背景和深绿色文本的页面，你可以在内联样式中使用以下 HTML 代码：\n\
  \n点击此处查看图像\n\n```html\n<body style=\"background-color:#ff0000; color:#003300;\"\
  >\n```\n\n虽然这里显示了 6 个两位十六进制值的示例，但实际上有 256 种两位十六进制值的组合：`0`–`9` 和 `a`–`f` 的配对。例如，`f0`\
  \ 是一种可能的十六进制值（十进制 `240`），`62` 是一种可能的十六进制值（十进制 `98`），依此类推。\n\n如前所述，`#rrggbb` 十六进制颜色格式中的\
  \ `rr`、`gg` 和 `bb` 代表颜色的红色、绿色蓝色成分。每个分量的十进制值从 `0`（无色）到 `255`（全色）。\n\n因此，白色（或 `#ffffff`）对应红色值\
  \ `255`、绿色值 `255` 和蓝色值 `255`。同样，黑色（`#000000`）对应红色值 `0`、绿色值 `0` 和蓝色值 `0`。真红色是 `#ff0000`（全红、无绿、无蓝），真绿色是\
  \ `#00ff00`（无红、全绿、无蓝），真蓝色是 `#0000ff`（无红、无绿、全蓝）。所有其他十六进制表示都对应三种颜色 255 种可能值的某种变体。跨浏览器兼容的颜色名称\
  \ cornflowerblue（矢尾蓝）与十六进制表示 `#6495ed` 相关——其红色值为 `100`，绿色值为 `149`，蓝色值为 `237`（几乎是所有可用蓝色值）。\n\
  \n在选择颜色时（通过图形程序或在网上找到你喜欢的颜色），可能会看到十六进制或十进制颜色表示。如果你在搜索引擎中输入“十六进制颜色转换器”，你会发现许多帮助你将颜色值转换为可以在样式表中使用的内容。\n\
  \n### 使用 RGB 和 RGBa 值表示颜色\n\n十六进制代码定义了数百万种色的红、绿、蓝百分比。但你也可以使用 RGB 定义这些颜色。RGB 格式为\
  \ `rgb(red, green, blue)`，其中 `red`、`green` 和 `blue` 是从 `0` 到 `255` 的值。\n\n*   ![Image](img/arrow.jpg)\
  \ `255` 意味着全亮度。\n*   ![Image](img/arrow.jpg) `204` 意味着 80% 亮度。\n*   ![Image](img/arrow.jpg)\
  \ `153` 意味着 60% 亮度。\n*   ![Image](img/arrow.jpg) `102` 意味着 40% 亮度。\n*   ![Image](img/arrow.jpg)\
  \ `51` 意味着 20% 亮度。\n*   ![Image](img/arrow.jpg) `0` 意味着没有这种颜色成分。\n\n例如，亮红色是 `rgb(255,\
  \ 0, 0)`，深绿色是 `rgb(0, 51, 0)`，蓝紫色是 `rgb(102, 0, 153)`，中灰色是 `rgb(153, 153, 153)`。创建一个红色背景和深绿色文本的页面，你可以使用以下\
  \ CSS：\n\n```css\nbody {\n  background-color: rgb(255, 0, 0);\n  color: rgb(0, 51,\
  \ 0);\n}\n```\n\n虽然这里只显示了 6 个两位十六进制值的示例，但实际上有 256 种两位十六进制值的组合：`0`–`9` 和 `a`–`f`\
  \ 的配对。例如，`f0` 是一种可能的十六进制值（十进制 `240`），`62` 是一种可能的十六进制值（十进制 `98`），依此类推。如前所述，`#rrggbb`\
  \ 十六进制颜色格式中的 `rr`、`gg` 和 `bb` 代表颜色的红色、绿色和蓝色成分。每个分量的十进制值从 `0`（无色）到 `255`（全色）。\n\n\
  所以白色（或 `#ffffff`）对应红色值 `255`、绿色值 `255` 和蓝色值 `255`。同样，黑色（`#000000`）对应红色值 `0`、绿色值\
  \ `0` 和蓝色值 `0`。真红色是 `#ff0000`（全红、无绿、无蓝），真绿色是 `#00ff00`（无红、全绿、无蓝），真蓝色是 `#0000ff`（无红、无绿、全蓝）。所有其他十六进制表示都对应三种颜色\
  \ 255 种可能值的某种变体。跨浏览器兼容的颜色名称 cornflowerblue 与十六进制表示 `#6495ed` 相关——其红色值为 `100`，绿色值为\
  \ `149`，蓝色值为 `237`（几乎是所有可用蓝色值）。\n\n在选择颜色时（通过图形程序或在网上找到你喜欢的颜色），可能会看到十六进制或十进制颜色表示。如果你在搜索引擎中输入“十六进制颜色转换器”，你会发现许多帮助你将颜色值转换为可以在样式表中使用的内容。\n\
  \n### 使用 RGB 和 RGBa 值表示颜色\n\n十六进制代码定义了数百万种色的红、绿、蓝百分比。但你也可以使用 RGB 定义这些颜色。RGB 格式为\
  \ `rgb(red, green, blue)`，其中 `red`、`green` 和 `blue` 是从 `0` 到 `255` 的值。\n\n*   ![Image](img/arrow.jpg)\
  \ `255` 意味着全亮度。\n*   ![Image](img/arrow.jpg) `204` 意味着 80% 亮度。\n*   ![Image](img/arrow.jpg)\
  \ `153` 意味着 60% 亮度。\n*   ![Image](img/arrow.jpg) `102` 意味着 40% 亮度。\n*   ![Image](img/arrow.jpg)\
  \ `51` 意味着 20% 亮度。\n*   ![Image](img/arrow.jpg) `0` 意味着没有这种颜色成分。\n\nRGBa 允许你设置颜色的不透明度或透明度。颜色越透明，背景显示得越多。要定义\
  \ Alpha 透明度（alpha transparency），你需要在 RGB 颜色后增加一个值：`rgba(red, green, blue, transparency)`。`transparency`\
  \ 值是 0 到 1 之间的数字，表示透明百分比。0 是完全透明（意味着你看到的都是背景），1 是完全不透明（意味着背景被完全覆盖），0.5 是 50% 透明。\n\
  \n创建一个在白色背景上带有淡色矢尾蓝文本的页面，可以使用此 CSS：\n\n```css\nbody {\n  color: rgba(100, 149, 237,\
  \ 0.5);\n}\n```\n\n你可以将透明度改为 `1` 以用于加粗文本，使其更显目，使用以下 CSS：\n\n```css\nstrong {\n \
  \ color: rgba(100, 149, 237, 1);\n  font-weight: normal;\n}\n```\n\n记住在使用 RGBa 时，前景的颜色取决于背景的颜色。虽然\
  \ `rgba(100, 149, 237, 0.5)` 在白色背景上是淡蓝色，但在黑色背景上看起来更深。\n\n### 使用 CSS 设置背景、文本和边框颜色\n\
  \n在使用 CSS 时，最常见颜色值的情况有三种：指定背景颜色、文本颜色或元素的边框颜色。在第 7 节“使用外部和内部链接”中，你学习了如何为各种链接状态使用颜色，在本节中，我们关注基础元素的显示。\n\
  \n\n\n\n图 8.2 显示了一个颜色使用的示例，这种用法非常很容易入选网页设计的“耻辱柱”。我们无法想象在严肃的网站中使用这些颜色和样式的组合，但它在这里是作为一个说明如何将颜色样式*可以*应用于各种元素的示例。这里打印的图像可能无法体现那些恐怖颜色的真实效果（如果你阅读的是这本书的纸质版，因为是黑白的），所以请务必打开示例文件，或在代码列表\
  \ 8.1 中输入代码并在浏览器中加载。\n\n![截图显示了一个网页浏览器，显示了具有不同背景、文本和边框颜色的文本。](img/08fig02.jpg)\n\
  \n**图 8.2** 你可以使用 CSS 设置背景、文本和边框颜色。\n\n代码列表 8.1 显示了用于生成图 8.2 的 HTML 和 CSS 样式。\n\n\
  **代码列表 8.1** 使用样式生成背景、文本和边框颜色\n\n点击此处查看代码图像\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Background, Text, and\
  \ Border Colors</title>\n    <style>\n    #uglyparagraph {\n       background-color:\
  \ #cccccc;\n       color: #ff0000;\n       border:1px solid #000000;\n    }\n    .orange\
