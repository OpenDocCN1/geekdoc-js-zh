  **1.** 你的样式表应包含以下内容：\n\n点击此处查看代码图片\n\n```\nh1 { font: 30pt blue Arial; }\n```\n\n\
  \n\n\n\n```css\nbody { font: 10pt blue \"Times New Roman\"; }\n```\n\n2. 将以下标签放置在\
  \ `intro.html` 文档的 `<head>` 和 `</head>` 标签之间：\n\n点击此处查看代码图片\n\n```html\n<link rel=\"\
  stylesheet\" href=\"corporate.css\">\n```\n\n3. 三种：外部、内部和内联。\n\n[注：指 CSS 引入方式]\n\
  \n4. 要将所有网站页面连接到名为 `mystyles.css` 的样式表，请使用以下代码：\n\n点击此处查看代码图片\n\n```html\n<link\
  \ href=\"mystyles.css\" rel=\"stylesheet\">\n```\n\n5. 它将显示为紫色。\n\n6. 它将元素显示在新的一行中。\n\
  \n7. 它是一个测量单位——像素（pixels）。\n\n8. 它为元素添加一个右侧边框，该边框为虚线、红色且宽度为 2 像素。\n\n9. 它将元素的圆角设置为水平半径\
  \ `1-em` 和垂直半径 `1.5-em`。\n\n10. 它将所有类名为 `main` 的元素文本颜色设置为紫色。\n\n### 练习\n\n*   ![Image](img/arrow1.jpg)\
