         color:#ffffff;\n    }\n    </style>\n    </head>\n    <body><body>\n      <h1><h1>Background,\
  \ Text Text and and Border</h1></h1>\n     <p id=\"uglyparagraph\">Grey paragraph,\
  \ black border, red text\n    withwithwith <span class=\"orange\">orangeorange span</span>p>\n\
  \n���������<div id=\"uglydiv\">Black div, red border, white text. </div>\n     <table>\n\
  \n�������������\n<tr>\n       <td class=\"greencell\">Green Table Cell</td>\n       <td\
  \ class=\"redcell\">Red Table Cell</td>\n      </tr>\n<tr>\n       <td class=\"\
  bluecell\">Blue Table Cell</td>\n       <td class=\"yellowcell\">Yellow Table Cell</td>\n\
        </tr>\n<tr>\n       <blockquote id=\"uglybq\">Blue blockquote, yellow border,\
  \ white text.</blockquote>\n       </tr>\n      </table></table>\n     </body></body>\n\
  </html>\n```\n\n查看代码列表 8.1 中的样式，除了某些样式外，你应该能够理解一切。在 CSS 中，你可以指定宽度和类型。在 8.1 的第一个示例中，`uglyparagraph`的宽度为`1px`，类型为`solid`。在`uglydiv`的示例中，宽度为`2px`，类型为`dashed`。在`uglybq`示例中，宽度为`4px`，类型为`dotted`。\n\
  \n在为网站选择颜色时，请记住少之是多。如果你非常喜欢鲜艳且壮丽的颜色，请将其作为强调色，而不是主体元素。此外，记住浅色背景深文字比深色背景浅文字更容易阅读。\n\
  \n### 选择图形软件\n\n你可以使用几乎任何图形程序为网站创建和编辑图像，从计算机操作系统自带的简单绘图或绘制程序，到 Adobe Photoshop 这样昂贵的专业程序。同样，如果你的电脑连接了数字相机或扫描仪，它可能自带了一些适用于在线使用的图形软件。许多免费的图像编辑器可以下载——甚至作为在线应用程序可用——用于处理照片元素。\n\
  \n注意\n\n毫无疑问，Adobe Photoshop 在图像编辑程序方面是顶尖的。但是它昂贵且复杂，对于没有计算机图形经验的人来说可能不是一个很好的选择。关于\
  \ Adobe 产品的更多信息，请访问 Adobe 网站 [www.adobe.com](http://www.adobe.com)。如果你想购买该公司的产品之一，可以从该网站下载免费评估版本。\n\
  \n如果你已经有了认为可能用于创建网页图形的软件，请尝试用它完成后续章节中描述的内容。如果你的软件无法处理这里涵盖的任务，那么它可能不是网页图形的良好工具。在这种情况下，请从\
  \ [www.gimp.org](http://www.gimp.org) 下载并安装 GIMP。这个功能全的图形程序完全免费，并且可以执行本课程所示的操作。\n\
  \n#### 使用其他图像\n\n创建网页图形和媒体文件的节省时间方法之一是完全避免创建。从任何网页获取图形只需右键点击它（或使用 Apple 鼠标点击 Option+）并选择“另存图像为”（取决于浏览器）。从页面中提取背景图像同样简单：右键点击它并选择“另存背景为”。\n\
  \n然而，你*绝对不要*在未经所有者许可的情况下使用图像，无论是通过询问还是寻找知识产权许可。未经许可使用图像是违反版权的（也是令人反感的）。更多关于版权知识，我们推荐德克萨斯大学的[`guides.lib.utexas.edu/copyright`](http://guides.lib.utexas.edu/copyright)版权速成在线教程。\n\
  \n你可能还会考虑使用免版税的贴画，这不需要你获得版权许可。一个良好的无版权照片和图像来源是 Pixabay ([`pixabay.com`](https://pixabay.com))。这些图像根据\
  \ Creative Commons CC0 发布，这意味着无需许可或署名即可使用，即使用于商业目的。[Clipart.com](http://Clipart.com)\
  \ 是一个热门的贴画网站；支付少量费用，该网站即可让你访问数千张素材图片。\n\n如果 GIMP 不适合你，考虑下载适用于 Windows 或 Macintosh\
  \ 的 CorelDRAW 评估版本 ([www.coreldraw.com](http://www.coreldraw.com)) 或适用于 Macintosh\
  \ 的 Acorn ([`flyingmeat.com/acorn/`](https://flyingmeat.com/acorn/))。仅用于照片处理，有很多免费选择，都具有实用的功能。Pixlr\
  \ ([`pixlr.com`](https://pixlr.com)) 是一个很好的选择。它适用于编辑图像而不是从零开始创建。这类程序不一定能帮你为网站设计横幅或按钮图像；但是，它们可以帮助你处理一些辅助图像，而且它们足够强大，值得一试。\n\
  \n\n\n\n\n# 图像分辨率与优化\n\n图像的分辨率是指组成图像的单个点或像素的数量（通常为每英寸 72 个点，即 72dpi）。大尺寸、高分辨率的图像通常比小尺寸、低分辨率的图像需要更长的传输和显示时间。图像尺寸通常以图像的宽度乘以高度来指定，以像素为单位；例如，一张\
  \ 300 × 200 的图像，其宽度为 300 像素，高度为 200 像素。\n\n> **注意**\n> 图像分辨率有多种类型，包括像素分辨率、空间分辨率、光谱分辨率、时间分辨率和辐射分辨率。你可能需要花好几个小时才能学完每一种类型——如果你在修读平面设计课程，你可能确实需要这样做。不过目前，你只需要记住大图像的下载时间更长，且在显示时占用更多空间。在设计网站时，显示尺寸以及存储或传输大小是需要考虑的因素。\n\
  \n你可能会惊讶地发现，分辨率并不是决定图像文件存储大小（以及传输时间）的最关键因素。这是因为网页上使用的图像总是以压缩形式存储和传输的。图像压缩是一种数学处理手段，通过对图像进行操作来挤掉重复的模式。图像压缩的数学原理很复杂，但基本思想是，当图像存储在磁盘上时，重复的模式或大面积的相同颜色可以被压缩掉。这使得图像文件大大减小，从而能够在互联网上更快地传输。随后，浏览器在显示图像时会恢复其原始外观。\n\
  \n在接下来的章节中，你将学习如何创建具有强大视觉冲击力但文件体积小的图形。实现这一目标的技巧取决于每张图像的内容和用途。网页图形的用途与网页的数量一样多，但到目前为止，最常见的四类图形是：\n\
  \n* ![Image](img/arrow.jpg) 人物、产品和地点的照片\n* ![Image](img/arrow.jpg) 图形横幅和标志（Logo）\n\
  * ![Image](img/arrow.jpg) 用于指示操作并提供链接的按钮或图标\n* ![Image](img/arrow.jpg) 容器元素的背景纹理\n\
  \n## 准备摄影图像\n\n要将照片放入网页，你需要将基于印刷的照片转换为数字图像，或者使用数字相机（如智能手机中的相机）直接创建数字照片。对于某些旧款硬件，你可能需要使用设备自带的自定义软件将图像传输到硬盘，但在大多数情况下，你应该可以直接连接设备，然后将文件拖放到硬盘中。如果你使用扫描仪创建印刷照片的数字版本，你几乎可以使用任何你选择的图形程序直接控制扫描仪；详情请参阅软件文档。\n\
  \n> **注意**\n> 如果你没有扫描仪或数字相机，请注意几乎所有的胶片冲印店都提供将 35mm 胶片照片传输到 `CD-ROM` 或 `DVD-ROM`\
  \ 的服务，费用较低。然后你可以将文件复制到硬盘，并使用图形程序打开和修改图像文件。\n\n将数字图像文件传输到计算机后，你可以使用图形程序进行裁剪、调整大小、色彩校正和压缩，以便为在网站中使用做好准备。\n\
  \n### 裁剪图像\n\n因为你希望网页图形尽可能紧凑，所以通常需要裁剪数字照片。当你 `crop`（裁剪）一张照片时，你选择想要显示的区域，并裁掉其余部分。\n\
  \n#### 动手尝试：在 GIMP 中裁剪\n\n`GIMP` 工具箱提供了快速访问裁剪工具及其可用属性的途径。找一个图像文件——可以是你用相机拍摄并存储在硬盘上的数字图像，也可以是在网上找到的图像。在\
  \ `GIMP` 中打开图像后，执行以下步骤进行裁剪：\n\n1. 在 `GIMP` 工具箱中，点击 `Crop` 工具（见 图 8.3）。根据你选择的工具，可能会有额外的属性可供选择。例如，图\
  \ 8.3 显示了裁剪工具的属性（如宽高比、位置、大小等）。\n   ![A screenshot shows the attributes for the cropping\
  \ tool in the tool options dialog box.](img/08fig03.jpg)\n   **图 8.3** 从工具箱中选择 `Crop`\
  \ 工具。\n\n2. 在要裁剪的图像中，通过点击想要保留部分的左上角，并按住鼠标左键同时拖动到右下角，围绕选区画一个框。见 图 8.4。\n   ![The\
  \ work area window in the screenshot displays a scenic image. The bottom-left portion\
  \ of the image that is to be displayed is selected. ](img/08fig04.jpg)\n   **图 8.4**\
  \ 选择图像中你想要显示的区域。*(来源: Scott Prokop/Shutterstock)*\n\n3. 点击选区的任意一个角以应用裁剪。\n\n你的图形程序可能会有与所示不同的方法，但概念是一样的：选择要保留的区域，然后裁掉其余部分。\n\
  \n即使图像经过裁剪，它可能仍然比网页所需的尺寸大。对于大多数响应式设计，图像的宽度不需要超过 `2000` 像素。这将允许图像在大屏幕上扩展到 `2000px`\
  \ 而不损失质量。如果你不打算在页面上单独使用该图像，你可以将图像裁剪得更小，但起始图像越大，它能支持的屏幕就越多。\n\n> **注意**\n> 你的图形软件可能会在图像窗口本身的某个位置提供一个始终可见的尺寸显示。在\
  \ `GIMP` 中，你可以在窗口标题栏中看到当前图像尺寸。其他程序可能会将其显示在右下角或左下角。你还可以在窗口中看到放大倍率，并且可以通过放大或缩小来更改它。\n\
  \n良好裁剪的关键是从图像中去除不需要的细节。一种方法是使用“三分法”。将有趣的元素放置在图像的上、右、下或左三分之一处，会使整体视觉效果更有趣。你还可以应用的其他裁剪规则包括黄金比例、黄金螺旋、三角形和对角线裁剪。\n\
  \n### 调整图像大小\n\n更改图像大小所需的具体工具取决于你使用的程序。在 `GIMP` 中，进入 `Image` 菜单并点击 `Scale Image`\
  \ 以打开 `Scale Image` 对话框（见 图 8.5）。\n\n![A screenshot shows the Scale Image dialog\
  \ box.](img/08fig05.jpg)\n**图 8.5** 使用 `Scale Image` 对话框更改图像大小。\n\n你几乎总是希望使用现有的宽高比来调整大小，这意味着当你输入想要的宽度时，高度会自动计算（反之亦然），以防止图像变形。在\
  \ `GIMP` 中，宽高比默认是锁定的，如 图 8.5 中 `Width` 和 `Height` 选项旁边显示的链条图标所示。点击一次链条即可解锁，从而允许你指定自定义的像素宽度和高度——无论是否变形。\n\
  \n> **注意**\n> 与 `GIMP` 中的许多其他功能一样，`Scale Image` 对话框出现在包含被调整大小图像的窗口之前。这种布局使你能够在对话框中进行更改、应用更改并立即看到结果。\n\
  \n\n\n\n\n在大多数（如果不是所有）图形程序中，你也可以按百分比调整图像大小，而不是提供特定的像素尺寸。例如，如果图像初始大小为 1815 × 1721，而你不想通过计算来确定显示为一半大小所需的数值，你只需选择\
  \ `Percent`（在此例中，从图 8.5 像素显示旁边的下拉菜单中选择），并将默认设置从 100 改为 50。然后图像就会变为宽 908 像素、高 861\
  \ 像素——你不需要进行任何计算即可实现这一点。\n\n### 注意\n你永远不应该将图像调整得比原始尺寸更大。虽然大多数图像编辑器都允许你放大图像，但它们通常并不理想。这是因为将图像放大到原始图像之外需要编辑器对额外的像素应该什么样进行猜测。这可能导致图像难看、模糊。相反，你应该从比你认为需要的大得多的图像开始，然后对其进行缩放和裁剪，以适应你的网页设计。\n\
  \n为网页图像确定合适的尺寸可能是具有挑战性的。你始终需要考虑下载速度以及查看页面的设备或屏幕尺寸，加上设计中留给图像的空间。一个好的经验法是：创建比它们可能显示的最大宽度略大的图像。虽然人们确实拥有大型\
  \ 4K 显示器，但 1920 × 1080 是最常见的大尺寸显示器。因此，将你的图像调整为宽度不超过 2000 像素将确保它们即使在大显示器上看起来也良好，同时保持较小的尺寸。在本节的后续部分，你将学习如何为了响应式网页设计以多种尺寸使用同一图像。\n\
  \n### 备注\n将图像裁剪并缩放到尽可能小是很有诱惑力的，而且为了最佳速度，你应该这样做。但请务必在离线或备份位置保留原始全尺寸文件的副本。这样，如果两年后你想将网站调整得更大，你就不会受限于你为旧设计创建的\
  \ 640 × 480 图像了。\n\n### 调整图像颜色\n如果你是在编辑摄影照片而不是创建自己的图形，你可能需要使用一些色彩校正工具使照片更加完美。像许多其他图像编辑程序一样，GIMP\
  \ 提供了调整图像亮度、对比度和色彩平衡的多个选项，以及一个减少令人讨厌的红眼的滤。要使用 GIMP 消除红眼，进入 `Filters`，点击 `Enhance`，然后点击\
  \ `Red Eye Removal`。\n\n这些选项中的大多数都非常直观。如果你想让图像更亮，就调整亮度。如果你想让图像中有更多红色，就调整色彩平衡。在 GIMP\
  \ 中，`Colors` 菜单让你能够访问许多工具。与上一节描述的 `Scale Image` 对话框一样，每个工具都会在工作区的前景显示一个对话框。当你调整颜色时，图像会反映这些变化。这种预览功能是大多数图像编辑软件都包含的特性。\n\
  \n图 8.6 显示了 `Adjust Hue/Lightness/Saturation` 工具，它是 `Colors` 菜单上提供的许多工具之一。如图所示，你可以通过使用对话框中的各种滑块调整你正在处理的数值，来实现许多与颜色相关的变化。`Preview`\
  \ 功能让你在执行操作的同时看到你的操作结果。`Reset Color` 按钮将图像恢复到原始状态，而不应用任何更改。\n\n![截图显示了 Adjust Hue/Lightness/saturation\
  \ 工具。](img/08fig06.jpg)\n\n**图 8.6** Adjust Hue/Lightness/Saturation 工具是 GIMP 中提供的许多基于滑块的颜色修改工具之一。*(致谢：Scott\
  \ Prokop/Shutterstock)*\n\n由于你有可以使用的许多工具，并且每个工具都带有预览功能，进行一点趣味性的实验是发现每个工具作用的最好方法。\n\
  \n### 控制 JPEG 压缩\n网页上的照片如果保存为 JPEG 文件格式而非 GIF，效果最好；JPEG 让你在保留文件中颜色数量的同时，仍将整体文件大小保持在可接受的水平。当你完成对照片尺寸和外观的调整后，选择\
  \ `File`、`Export` 并选择 `JPEG` 作为文件类型。你的图形程序可能会为你提供另一个对话框，用于控制各种 JPEG 选项，例如压缩。\n\n\
  图 8.7 显示了你在 GIMP 中导出 JPEG 时看到的 `Export Image as JPEG` 对话框。你在这里看到，你可以通过调整 `Quality`\
  \ 滑块在 1（低质量，小文件大小）和 100（高质量，大文件大小）之间移动，来控制保存 JPEG 文件的压缩率。\n\n![Export Image as JPEG\
  \ 对话框。](img/08fig07.jpg)\n\n**图 8.7** GIMP 让你通过以 JPEG 格式保存来减小文件大小的同时保留图像质量。\n\n\
  你可能想实验一下不同的 JPEG 压缩级别如何影响你的图像质量，但对于大多数照片来说，85% 的质量（或 15% 的压缩）通常是文件大小（因此是下载速度）和质量之间很好的折中方案。如果你的网站更多地面向移动设备，你应该选择低质量/高压缩选项以缩短下载时间。\n\
  \n### 创建横幅和按钮\n从头创建图形（如横幅和按钮）需要你做出与照片不同的考量。当你制作横幅或按钮时，需要做的第一个决定是它有多大。现在访问网页的人拥有屏幕至少为\
  \ 1024 × 768 的电脑。其他流行的分辨率有 1440 × 900 和 1366 × 768。设计你的图形适应移动设备是重要的。在 2017 年末，最流行的分辨率是\
  \ 360 × 640。虽然人们有更大的桌面和笔记本屏幕，但通常你应该少关注图像的尺寸，多关注文件大小。一个 2000 × 3000 像素但只有 80Kb 的图像加载速度很快，并在移动设备上看起来很好。\n\
  \n### 备注\n多年来，针对 800 × 600 屏幕分辨率设计是常态。现在人们倾向于在分辨率低至 360 × 640 的手机上浏览网页。通过响应式网页设计\
  \ (RWD)，你可以创建支持大和小屏幕的设计。你将在第 16 节”响应式网页设计的重要性中学习更多，并在第 17 节”为移动设备设计中学习如何操作。\n\n\
  假设你的目标最大分辨率是 1920 × 1080，全尺寸横幅和标题图形宽度不超过 2000 像素。这使得图像可以根据设计和查看它的设备略大于浏览器窗口或更小。\n\
  \n要在 GIMP 中创建新图像，进入 `File` 并选择 `New`。显示 `Create a New Image` 对话框（见图 8.8）。如果你不图像需要多大，只需接受\
  \ 640 × 480 的默认尺寸。或者你可以在 `Template` 下拉菜单中选择其他预设尺寸，例如 `Web Banner Common 468 × 60`\
  \ 或 `Web Banner Huge 728 × 90`。这两个设置对于横幅的“常见”和“巨大”的解释是保守但完全可以接受的。在这个对话框中，你还可以为新图像输入自己的宽度高度。\n\
  \n![截图显示了 Create a New Image 对话框中“Templates”下的下拉列表。选中了 Web banner common 468 cross\
  \ 60 选项。](img/08fig08.jpg)\n\n\n\n\n# 图像创建与优化\n\n## 创建新图像\n\n**图 8.8** 在开始处理图像之前，您必须决定图像的尺寸，但您以后随时可以调整大小。\n\
  \n对于图像的背景颜色，您通常应该选择白色，以匹配大多数网页浏览器用于网页的背景颜色（尽管如您之前所学，该颜色可以更改）。当您知道将要创建一个背景不是白色的页面时，您可以为图像选择不同的背景颜色。或者您可能想要创建完全没有背景的图像，在这种情况下，您选择“透明”作为背景颜色。当最终的、适用于\
  \ Web 的图像包含透明背景时，图像后面的网页（及其背景颜色）将被允许透过显示。在 GIMP 中，通过在“创建新图像”对话框中打开“高级选项”来为新图像选择背景颜色。\n\
  \n在您输入图像的宽度和高度（以像素为单位）并点击“确定”后，您面对的是一块空白的画布——如果您和我们大多数人一样对艺术感到畏惧，那将是一幅令人生畏的景象！然而，有许多图像创建教程（更不用说整本书）可以帮助您完成这个过程，我们完全可以让您自行发挥创意。本节旨在向您介绍在为您网站创建图形时需要记住的事项。本节不一定教您具体如何做，因为对您选择的工具感到舒适是掌握它的第一步。\n\
  \n## 通过减少或移除颜色来优化图像\n\n在创建图像时，很容易纠结于图像的尺寸，但更重要的是关注文件大小。越来越多的人使用智能手机等移动设备浏览网页，而带宽限制和费用使得大图像在最佳情况下加载缓慢，令人烦恼。通过尽可能优化图像，您可以使页面更易于在移动设备上使用。而且它们在台式机和笔记本电脑上加载也会更快。\n\
  \n减小图像大小（从而缩短下载时间）最有效的方法之一是减少图像中使用的颜色数量。这可能会大幅降低某些照片图像的视觉质量，但对于大多数横幅、按钮和其他图标来说效果很好。\n\
  \n您会很高兴地知道，有一种专门用于颜色数量有限的图像的文件格式，即图形交换格式（GIF）。当您将图像保存或导出为 GIF 时，系统可能会提示您合并图层或通过转换为索引图像来减少颜色数量，因为这是\
  \ GIF 的要求；请查阅软件的帮助文件，了解有关图层和索引颜色的详细信息，以完整了解您可能需要做的事情。\n\n请记住，GIF 图像格式专为包含纯色区域的图像设计，例如网页标题和其他插图图形；GIF\
  \ 格式不适合照片，请改用 JPEG 或 PNG 文件。\n\nPNG（发音为“ping”）是一种在所有主流 Web 浏览器中都受支持的有用文件格式。然而，GIF\
  \ 图像格式允许您指定单一透明颜色，这意味着网页背景将通过图像的这些区域显示出来，而 PNG 格式则更进一步，允许您指定不同程度的透明度。\n\n您可能见过这样的网站：它们在容器元素中使用背景颜色或图像，但前景中也有图像，允许背景透过前景图形的部分区域显示。在这些情况下，前景图像的部分区域是透明的，这样图像本身——它们总是在矩形画布上——不会显示画布上设计未发生的区域。您经常希望使用这类部分透明的图像，使图形在任何背景颜色或背景图像上都看起来美观。\n\
  \n要使图像的部分区域透明，必须将图像保存为 GIF 或 PNG 文件格式。如本课先前所述，大多数支持 GIF 格式的图形程序允许您指定一种颜色为透明，而 PNG\
  \ 图像则允许一定范围的透明度。很大程度上由于这种透明度范围，PNG 格式优于 GIF。所有最新的 Web 浏览器都已经支持 PNG 图像。\n\n创建透明图像的过程取决于您要创建的图像类型（GIF\
  \ 或 PNG）以及用于创建它的图形软件。有关说明，请查阅图形程序的帮助文件，或在搜索引擎中输入“使用 [*您的程序*] 创建透明图像”。\n\n## 创建平铺背景图像\n\
  \n您可以使用任何 GIF、JPEG 或 PNG 图像作为容器元素内的背景平铺，但在创建平铺背景时，特别是高度图案化的平铺背景之前，请问自己该平铺背景为您的网站整体外观和感觉增添了什麼。更重要的是，请问自己当文本放置在该图案上时是否容易阅读。\n\
  \n想想您每天访问的网站，并注意这样一个事实：很少有网站在整个页面上使用平铺的、高度图案化的背景。如果您将浏览范围限制在公司、产品、体育团队或其他以信息（主要是文本）为优先的网站，使用平铺的、高度图案化的背景的网站数量会进一步减少。网络赋予每个人在设计中的个性权利，但如果您为企业创建网站，您可能希望避免使用与文本颜色对比强烈的高度图案化背景。\n\
  \n如果您确实为整个站点使用平铺背景图像，请记住，最好的平铺图像是您看不出它们是平铺图像的图像。换句话说，当背景平铺的顶部边缘与底部边缘无缝匹配，左边缘与右边缘匹配时，您就知道拥有了一幅好的图像。\n\
  \n**图 8.9** 这是无缝背景图像的一个示例，您可以看出背景是平铺的，因为您可以看到几个相同的形状。\n\n![截图显示示例窗口，背景图像中的树木比重叠的文本颜色更深且颜色相同。](img/08fig09.jpg)\n\
  \n**图 8.10** 这是无缝背景图像的另一个示例，但您看不出它是平铺的。\n\n![截图显示示例窗口，背景图像中的树木比重叠的文本颜色更浅。](img/08fig10.jpg)\n\
  \n在本课程的后面，您将学习如何在容器元素中放置背景图像。尽管我们在本节中已经发出警告，但背景图像可以成为您设计武器库中的强大武器——只是不要使用高度图案化的背景。您可以在微妙纹理网站（[微妙纹理网站](http://www.toptal.com/designers/subtlepatterns/)）上找到一些出色的（且免费提供的）背景图像示例——通常称为\
  \ *纹理*。\n\n## 在网页上放置图像\n\n要开始在网站上放置图像，首先将图像文件移动到与 HTML 文件相同的文件夹中，或移动到名为 `images`\
  \ 的目录中（您可能希望使用该目录以便轻松组织）。\n\n注意：对于 Web 服务器、浏览器或最终用户来说，您把图像放在哪里并不重要，只要您知道它们的位置并在\
  \ HTML 代码中使用正确的路径。\n\n我们倾向于将所有图像放在单独的 `images` 目录或通用 `assets` 目录的子目录中（例如 `assets/images`），以便所有图像或其他资源（如多媒体和\
  \ JavaScript 文件）都整齐有序。\n\n\n\n在第一个示例中，假设你将一个名为 `myimage.gif` 的图片放在了与用于显示它的 HTML\
  \ 文件相同的目录中。要显示该图片，请在文本中希望图片出现的位置插入以下 HTML 标签，并将 `myimage.gif` 替换为你自己的图片文件名：\n\n\
  点击此处查看代码图片\n\n```html\n<img src=\"myimage.gif\" alt=\"My Image\">\n```\n\n如果你的图片文件位于文档根目录下的\
  \ `images` 目录中，则应使用以下代码，可以看到其中包含了 `images` 目录下 `myimage.gif` 的完整路径：\n\n点击此处查看代码图片\n\
  \n```html\n<img src=\"/images/myimage.gif\" alt=\"My Image\">\n```\n\n对于有效的 HTML\
  \ 网页，`<img>` 标签的 `src` 和 `alt` 属性都是必需的。`src` 属性标识图片文件，`alt` 属性允许你指定关于图片的描述性文本。`alt`\
  \ 属性的作用是，当用户因图片不可用或使用纯文本浏览器或屏幕阅读器而无法查看图片时，作为图片的替代内容。稍后你将在“用文本描述图像”一节中了解更多关于 `alt`\
  \ 属性的内容。\n\n### 注意\n\n`<img>` 标签是同时支持 `title` 属性的 HTML 标签之一；你可以使用该属性来描述图片，与 `alt`\
  \ 属性类似。但 `alt` 属性旨在描述图片，而 `title` 则提供关于图片的附加信息。你可能会看到 `title` 属性被使用，但请不要用它来代替 `alt`\
  \ 属性；这样做会限制你的网站在多种设备上的可用性。而且，如果不包含 `alt` 属性，你的 HTML 将无效。\n\n作为如何使用 `<img>` 标签的示例，清单\
  \ 8.2 在页面顶部、一段文本之前插入了一张图片。当网页浏览器显示 清单 8.2 中的 HTML 文件时，它会自动检索并显示该图片文件，如 图 8.11 所示。\n\
  \n**清单 8.2** 使用 `<img>` 标签在网页上放置图片\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>A Spectacular\
  \ Yosemite View</title>\n  </head>\n  <body>\n    <section>\n      <header>\n  \
  \      <h1>A Spectacular Yosemite View</h1>\n      </header>    \n      <img src=\"\
  hd.jpg\" alt=\"Half Dome\">\n      <p><strong>Half Dome</strong> is a granite dome\
  \ in Yosemite\n        National Park, located in northeastern Mariposa County,\n\
  \        California, at the eastern end of Yosemite Valley. The\n        granite\
  \ crest rises  more than 4,737 ft (1,444 m) above the\n        valley floor.</p>\n\
  \      <p>This particular view is of Half Dome as seen from Washburn\n        Point.</p>\n\
  \    </section>\n  </body>\n</html>\n```\n\n如果你猜到 `img` 指的是“image”（图片），那就对了。同样，`src`\
  \ 指的是“source”（来源），即对图片文件位置的引用。正如前几课所讨论的，图片始终存储在与网页文本（你的 HTML 文件）分开的文件中，尽管在浏览器中查看时它看起来是同一页面的一部分。\n\
  \n\n\n\n通过显式指定每个图像的高度和宽度，你可以确保页面上的所有内容都能尽可能快地显示并出现在正确的位置。这样，网络浏览器在布局页面以及等待图像传输完成时，就可以立即准确地为每张图像留出空间。\n\
  \n对于你想包含在网站中的每张图像，你可以使用图形程序来确定其以像素（pixels）为单位的精确高宽。你也可以通过系统工具找到这些图像属性。例如，在 Windows\
  \ 中，你可以通过右键点击图像、选择`属性`，然后选择`详细信息`来查看图像的高度宽。当你知道图像的高度和宽度后，可以像这样将尺寸包含在 CSS 中：\n\n\
  点击此处查看代码图像\n\n```html\n<img src=\"myimage.gif\" alt=\"Fancy Pic\" style=\"width:200px;height:100px;\"\
  >\n```\n\n### 注意\n\n为图像指定的宽高宽不必与图像的实际高宽匹配。网络浏览器会尝试压缩或拉伸图像以显示你指定的任何尺寸。调整图像尺寸的最佳方法是将\
  \ `width` 设置为容器的百分比，并将 `height` 设置为 `auto`，如下所示：\n\n点击此处查看代码图像\n\n```css\nstyle=\"\
  width:100%; height:auto;\"\n```\n\n这确保了图像将适应设计宽度，且宽高比例将与原始尺寸相同。\n\n就像背景颜色或字体大小等其他设计元素一样，你不应该在\
  \ HTML 中指定图像的精确尺寸。相反，你应该使用 CSS 样式表设置宽度和高度。你可以对宽度和高度使用任何你测量单位，但为了确保图像看起来良好，最好将其中一个维度设置为\
  \ `auto`。\n\n### 注意\n\nHTML5 引入了 `<picture>` 元素以及 `srcset` 和 `sizes` 属性。`<picture>`\
  \ 元素允许设计人员控制向哪个浏览器显示图像。`srcset` 和 `sizes` 属性为不同尺寸的浏览器定义了多个图像资源。这些将在第 17 节中进行详细讨论。这些新功能在现代浏览器中得到了很好的支持，并为设计人员提供了更多选项。\n\
  \n### 图像对齐\n\n就像你可以对齐页面上的文本一样，你也可以通过特殊属性对齐页面上的图像。你可以相对于文本以及周围的其他图像对图像进行水平和垂直方向的对齐。\n\
  \n#### 图像水平对齐\n\n正如第 6 节“字体字体、文本块、列表和表格”中所讨论的，你可以使用 `text-align` CSS 属性将元素内的内容对齐为居中、右对齐或左对齐。这些样式设置会影响文本和图像，并且可以用于任何块级元素，例如\
  \ `<p>`。\n\n与文本一样，图像通常与左边缘对齐，除非有其他对齐设置指示它们应该居中或右对齐。换句话说，`left` 是 `text-align` CSS\
  \ 属性的默认值。\n\n你还可以通过对 `<img>` 标签应用 `float` CSS 属性来让文本环绕图像。\n\n在代码列表 8.3 中，`<img style=\"\
  float:left;\">` 将第一张图像向左对齐，并在其右侧环绕文本，正如你预期的那样样。同样，`<img style=\"float:right;\">`\
  \ 将第二张图像向右对齐，并在其左侧环绕文本。图 8.13 显示了这些图像在网页上是如何对齐的。这里没有将图像浮动到居中的概念，因为没有办法确定如何在图像的每一侧环绕文本。\n\
  \n**列表 8.3** 使用 `float` 样式属性在网页上对齐图像\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>More Spectacular\
  \ Yosemite Views</title>\n  </head>\n  <body>\n    <section>\n      <header>\n \
  \       <h1>More Spectacular Yosemite Views</h1>\n      </header>\n      <p>\n \
  \       <img src=\"elcap_sm.jpg\" alt=\"El Capitan\" style=\"float:left;padding:12px;width:100px;height:75px;\"\
  >\n        <strong>El Capitan</strong> 是优美地国家公园内一个高 3000 英尺（910 米）的垂直岩石层，位于优美地谷北侧，靠近其西端。\n\
  \      </p>\n      <p>\n        El Capitan 是世界上攀岩者最喜爱的挑战之一。该地貌由马里波营团于 1851 年命名为“El\
  \ Capitan”。\n      </p>\n      <p>\n        <img src=\"tunnel_sm.jpg\" alt=\"Tunnel\
  \ View\" style=\"float:right;padding:12px;width:100px;height:75px;\">\n        <strong>Tunnel\
  \ View</strong> 是从南部进入优美地时 41 号公路上的一个观点。\n      </p>\n      <p>\n        该视角可以向东观察优美地，包括半圆顶和布莱德瀑布。这对许多人来说是优美地的景点。\n\
  \      </p>\n    </section>\n  </body>\n</html>\n```\n\n图 8.13 显示了“更壮丽的优美地风景”网页上的图像对齐情况。第一个图像在左侧，后面跟着文本；而下一张图像在右侧，前面是文本。\n\
  \n注意在列表 8.3 中使用的 `<img>` 标签添加了 `padding`。这在图像和文本之间留出了一些空间。你将在第 9 节“外边距、内边距、对齐和浮动”中学习更多关于\
  \ padding 的知识。\n\n#### 图像垂直对齐\n\n有时你想在文本行中间插入一个小图像，或者在图像旁边放置一行文本。在任何情况下，控制文本和图像如何对齐都是非常方便的。图像底部与基线对齐，还是让文本和图像的中间对齐？你可以在这些或其他选项之间选择：\n\
  \n*   要将图像顶部与同一行中最大的图像或字母顶部对齐，请使用：\n    点击此处查看代码图像\n    ```css\n    style=\"vertical-align:text-top;\"\
  \n    ```\n\n*   要将图像底部与文本底部对齐，请使用：\n    点击此处查看代码图像\n    ```css\n    style=\"vertical-align:text-bottom;\"\
  \n    ```\n\n*   要将图像中间与行上所有元素的垂直中心对齐，请使用：\n    点击此处查看代码图像\n    ```css\n    style=\"\
  vertical-align:middle;\"\n    ```\n\n*   要将图像底部与文本基线对齐，请使用：\n    点击此处查看代码图像\n  \
  \  ```css\n    style=\"vertical-align:baseline;\"\n    ```\n\n### 注意\n\n`vertical-align`\
  \ CSS 属性还支持 `top` 和 `bottom` 值，这些可以将图像与行元素的整体顶部或底部对齐，无论行上是否有文本。\n\n\n\n\n\n这四个选项均已用于列表\
  \ 8.4 并在图 8.14 中显示。现在页面上垂直列了四个缩略图，每张图片旁边都有描述性文本。使用了 `vertical-align` CSS 属性的各种设置来对齐每个图像及其相关文本。这显然不是最美的页面，但应该有助于让各种对齐变得清晰。\n\
  \n**列表 8.4** 使用 `vertical-align` 样式对齐文本与图像\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Small But\
  \ Mighty Spectacular Yosemite Views</title>\n  </head>\n  <body>\n    <section>\n\
  \      <header>\n        <h1>Small But Mighty Yosemite Views</h1>\n      </header>\n\
  \      <p><img src=\"elcap_sm.jpg\" alt=\"El Capitan\" style=\"width:100px;height:75px;vertical-align:text-top;\"\
  ><strong>El Capitan</strong> 是优塞米国家公园内一个高 3,000 英尺（910 米）的垂直岩石层。</p>\n      <p><img\
  \ src=\"tunnelview_sm.jpg\" alt=\"Tunnel View\" style=\"width:100px;height:80px;vertical-align:text-bottom;\"\
  ><strong>Tunnel View</strong> 向东望向优塞米谷。</p>\n      <p><img src=\"upperyosefalls_sm.jpg\"\
  \ alt=\"Upper Yosemite Falls\" style=\"width:87px;height:100px;vertical-align:middle;\"\
  ><strong>Upper Yosemite Falls</strong> 高 1,430 英尺，是世界上二十最高的瀑布之一。</p>\n      <p><img\
  \ src=\"hangingrock_sm.jpg\" alt=\"Hanging Rock\" style=\"width:100px;height:75px;vertical-align:baseline;\"\
  ><strong>Hanging Rock</strong> 位于冰川点（Glacier Point），曾是人们……呃，悬在上面的热门地点。疯狂的人们。</p>\n\
  \    </section>\n  </body>\n</html>\n```\n\n注意\n\n如果在 `<img>` 标签或用于 `<img>` 标签使用的类中没有分配任何\
  \ `vertical-align` CSS 属性，图像的底部将与旁边任何文本的基线（baseline）对齐。这意味着你永远不需要使用 `vertical-align:baseline;`，因为这是默认假设。但是，如果你为图像指定了外边距（margin），并希望对齐相对于文本更精确一点，你可能希望将\
  \ `vertical-align` 属性显式设置为 `text-bottom`。\n\n![截图显示了使用“Small But Mighty Yosemite\
  \ Views”网页进行垂直图像对齐的示例。照片位于左侧，一个接一个，每张图片的右侧都有描述性文本。](img/08fig14.jpg)\n\n**图 8.14**\
  \ 显示了列表 8.4 中使用的垂直图像对齐选项。\n\n### 将图像转换为链接\n\n你可能在图 8.11 中注意到页面上的图像很大。在这个特定示例中这没问题，但当你尝试展示多个图像时，这并不是理想的。创建较小的图像缩略图并链接到每个图像较大的版本更有意义。这样你就可以在页面上安排缩略图，让访问者轻松看到所有文字内容，即使他们只看到实际（较大）图像的缩小版本。使用缩略图是你可以使用图像链接来丰富页面的许多方法之一。\n\
  \n要将任何图像转换为指向另一个页面或图像的可点击链接，你可以使用第 7 节中学过的 `<a>` 标签来创建文本链接。列表 8.5 包含了在文本中显示缩略图的代码，这些缩略图链接到图像较大的版本。为了确保用户知道点击缩略图，图像和一些辅助文本被封装在\
  \ `<div>` 中，如图 8.15 所示。\n\n**列表 8.5** 使用缩略图实现有效链接 点击此处查看图像\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>More\
  \ Spectacular Views</title>\n    <style>\n      div.imageleft {\n        float:\
  \ left;\n        text-align: center;\n        font-size: 10px;\n        font-style:\
  \ italic;\n      }\n      div.imageright {\n        float: right;\n        text-align:\
  \ center;\n        font-size: 10px;\n        font-style: italic;\n      }\n    \
  \  img {\n        padding: 6px;\n        border: none;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <section>\n      <header>\n        <h1>More Spectacular\
  \ Views</h1>\n      </header>\n      <div class=\"imageleft\">\n        <a href=\"\
  http://www.flickr.com/photos/nofancyname/614253439/\"><img src=\"elcap_sm.jpg\"\
  \ alt=\"El Capitan\" style=\"width:100px; height:75px;\"></a>\n        <br>click\
  \ image to enlarge\n      </div>\n      <p><strong>El Capitan</strong> 是优塞米国家公园内一个高\
  \ 3,000 英尺（910 米）的垂直岩石层，位于优塞米谷北侧，靠近西端。这座花岗岩巨石是世界上攀岩者喜爱的挑战之一。该岩层由马里波拉营团在 1851 年探索山谷时命名为“El\
  \ Capitan”。</p>\n      <div class=\"imageright\">\n        <a href=\"http://www.flickr.com/photos/nofancyname/614287355/\"\
  ><img src=\"tunnelview_sm.jpg\" alt=\"Tunnel View\" style=\"width:100px; height:80px;\"\
  ></a>\n        <br>click image to enlarge\n      </div>\n      <p><strong>Tunnel\
  \ View</strong> 是州 41 号公路上的一个景点，位于从南部进入优塞米谷时瓦瓦纳隧道（Wawona Tunnel）的直接东侧。该视野向东望向优塞米谷，包括\
  \ El Capitan 的西南面、半圆顶（Half Dome）和婚纱瀑布（Bridalveil Falls）。对许多人来说，这是优塞米热门景点的第一印象。</p>\n\
  \    </section>\n  </body>\n</html>\n```\n\n\n\n\n\n这里列出了共同创建背景的常用 CSS 属性：\n\n-\
  \   ![Image](img/arrow.jpg) `background-color`——指定元素的背景颜色。尽管它与图像无关，但它是背景相关属性集的一部分。如果图像是透明的或未加载，用户将看到背景颜色。\n\
  -   ![Image](img/arrow.jpg) `background-image`——指定用作元素背景图像，使用以下语法：`url('imagename.gif')`。\n\
  -   ![Image](img/arrow.jpg) `background-repeat`——指定图像在水平和垂直方向上的重复方式。默认情况下（不指定任何内容），背景图像会在水平和垂直方向上重复。其他选项有\
  \ `repeat`（与默认相同）、`repeat-x`（水平）、`repeat-y`（垂直）和 `no-repeat`（仅显示一次）。\n-   ![Image](img/arrow.jpg)\
  \ `background-position`——指定图像相对于容器的初始位置。选项包括 `top-left`、`top-center`、`top-right`、`center-left`、`center-center`、`center-right`、`bottom-left`、`bottom-center`、`bottom-right`\
  \ 以及特定的像素和百分比位置。\n\n在指定背景图像时，你可以将所有规格组合到 `background` 属性中，如下：\n\n```css\nbody {\n\
  \  background: #ffffff url('imagename.gif') no-repeat top right;\n}\n```\n\n在前面的样式表项目中，网页的\
  \ `body` 元素将是白色，并在右上角包含名为 `imagename.gif` 的图形。`background` 属性的另一个用途是为无序列表自定义项目符号。要使用图像作为项目符号，首先按所示定义\
  \ `<ul>` 标签的样式：\n\n```css\nul {\n  list-style-type: none;\n  padding-left: 0;\n\
  \  margin-left: 0;\n}\n```\n\n接下来，将 `<li>` 标签的声明更改为：\n\n```css\nli {\n  background:\
  \ url(mybullet.gif) left center no-repeat\n}\n```\n\n确保 `mybullet.gif`（或为你图形命名的任何名称）位于\
  \ Web 服务器并可以访问；在这种情况下，所有无序列表项都将显示你的自定义图像，而不是标准的实心圆点符号。\n\n在使用 CSS 进行整体页面布局时，我们回到第三部分，“使用\
  \ CSS 进行高级网页设计”中，讨论背景属性的具体用法。\n\n### 使用图像地图\n\n有时，你想将图像作为导航——但不仅仅是网站中常见的简单的基于按钮或基于链接的导航。例如，你可能有一个包含医疗信息的网站，你想显示一张人体的图像，并链接到提供有关各个身体部位信息的页面。或者，你可能有一个提供世界地图的网站，用户可以点击它访问有关国家的信息。你可以根据用户在图像内点击的位置，将图像划分为链接到不同文档的区域。这被称为*图像地图*（image\
  \ map），任何都可以制成图像地图。\n\n### 为什么图像地图并非总是必要的\n\n关于图像地图，需要的的第一点是，除非在非常特殊的情况下，否则你可能不需要使用它们。使用几个直接并排的普通图像并为每个图像提供单独的链接通常更简单、更高效。\n\
  \n例如，图 8.17 显示了一个显示 12 个不同企业 Logo 的网页；这个示例是商业领域常见的网页类型，在其中你为合作伙伴提供了一点免费广告。你*可以*将这些\
  \ Logo 作为一个大图像呈现，并创建一个图像地图来提供指向这 12 家公司的每个链接。用户可以点击图像中的每个 Logo 来访问每家公司的网站。但每当你想向图像地图中添加新\
  \ Logo 时，你都必须修改整个图像并重新映射热点（hotspots）——这对于任何人来说都不是良好的选择。在这种情况下，当不需要图像地图时，你只需例所示，使用\
  \ 12 张单独图像（每个公司 1 张）在页面上显示图像，并让每个图像包含一个指向特定公司的链接。\n\n![BAWSI 网页的截图。正文区域以四行三列的网格布局显示了\
  \ 12 个不同的标志（图像）。](img/08fig17.jpg)\n\n**图 8.17** 带有带有 12 个不同 Logo 的网页；这可以作为一个单一图像地图呈现，也可以被分为\
  \ 12 个独立的部分。\n\n对于具有许多部分、排列奇特或设计本身太复杂而无法拆分为单独图像的图像，使用图像地图是最佳选择。图 8.18 显示了一张最适合作为图像地图的图像——美国\
  \ CIA 提供的世界标准时区的公共领域图像。\n\n![一张标有全球不同时区的世界地图。时区由垂直线表示。这些线标记了跨越大陆每个时区的边界。](img/08fig18.jpg)\n\
  \n**图 8.18** 这张图像切分后效果不好；最好将其制成图像地图。\n\n### 映射图像中的区域\n\n要创建任何类型的图像地图，你需要确定图像内每个区域的像素坐标。这些点击链接也称为*区域*（areas）。你的图形程序可能提供查找这些坐标的简单方法。使用图像地图工具通常只需鼠标在你想要链接的区域周围绘制矩形（或自定义形状）。图\
  \ 8.19 显示了这些选择的结果，以及添加 URL 和标题的界面。\n\n![使用图像映射工具的示例。](img/08fig19.jpg)\n\n**图 8.19**\
  \ 使用图像映射工具为单个图形创建区域。\n\n### 尝试一下：创建你自己的图像地图\n\n如果你使用自己的图像并将其制成图像地图，你会更容易记住如何制作它：\n\
  \n-   ![Image](img/arrow.jpg) 起初，选择一个视觉上划分为大致矩形区域的大图像是最简单的。\n-   ![Image](img/arrow.jpg)\
  \ 如果没有合适的图像，使用你喜欢的图形程序制作一张。也许使用一张包含几个人的合照。你可以将每个人作为图像地图的一个区域。\n-   ![Image](img/arrow.jpg)\
  \ 尝试不同的图像映射工具，以确定你最喜欢哪一个。从独立软件如 `Mapedit` ([`boutell.com/mapedit/`](https://boutell.com/mapedit/))\
  \ 开始，然后转向 [www.image-maps.com](http://www.image-maps.com) 的在线地图制作工具。还有其他工具；使用你喜欢的搜索引擎来查找图像地图软件主题的变体。（一些\
  \ Web 编辑器和图形编辑器也可以制作图像地图。）\n\n### 为图像地图创建 HTML\n\n如果你使用图像地图生成器，它将提供创建图像地图所需的 HTML。但是，了解代码组成是一个好主意，以便你可以检查其准确性。创建任何图像地图都需要以下\
  \ HTML 代码：\n\n\n\n\n\n`<map name=\"mapname\">`\n\n请记住，你可以为 `<map>` 标签的 `name` 属性使用任何你想要的名称，尽管尽量使其具有描述性会更有帮助。接下来，你需要为图像的每个区域添加一个\
  \ `<area>` 标签。以下是一个由 图 8.19 所示操作生成的单个 `<area>` 标签示例：\n\n点击此处查看代码图片\n\n```\n<area\
  \ shape=\"rect\" coords=\"1,73,74,163\"\n   href=\"http://en.wikipedia.org/wiki/Alaska\"\
  \n    alt=\"Alaska\"   title=\"Alaska\">\n```\n\n这个 `<area>` 标签有五个属性，你在图像映射中描述的每个区域都会用到这些属性：\n\
  \n*   ![Image](img/arrow.jpg) `shape`——指示该区域是矩形（`shape=\"rect\"`）、圆形（`shape=\"circle\"\
  `）还是不规则多边形（`shape=\"poly\"`）。\n*   ![Image](img/arrow.jpg) `coords`——给出该区域精确的像素坐标。对于矩形，给出左上角的\
  \ x,y 坐标，然后是右下角的 x,y 坐标。对于圆形，给出中心点的 x,y 坐标，然后是半径（以像素为单位）。对于多边形，按连线顺序列出所有角的 x,y 坐标。\n\
  \n    以下是一个映射多边形的示例（看起来可能有点复杂）：\n\n    点击此处查看代码图片\n\n    ```\n    <areashape=\"\
  poly\" coords=\"233,0,233,20,225,22,225,101,216,121,212,154,212,167,212, 181,222,195,220,209,226,214,226,234,232,252,224,253,223,261,231,\
  \ 264,232,495,254,497,274,495,275,482,258,463,275,381,270,348,257, 338,266,329,272,313,271,301,258,292,264,284,262,262,272,263,272,\
  \ 178,290,172,289,162,274,156,274,149,285,151,281,134,272,137,274,3\" href=\"http://en.wikipedia.org/wiki/Eastern_Time_Zone\"\
  \ alt=\"Eastern Time Zone\" title=\"Eastern Time Zone\">\n    ```\n\n*   ![Image](img/arrow.jpg)\
  \ `href`——指定该区域链接到的位置。你可以使用任何在普通 `<a>` 链接标签中会用到的地址或文件名。\n*   ![Image](img/arrow.jpg)\
  \ `alt`——允许你提供一段描述该形状的文本；正如你之前所学，提供这段文本对于使用纯文本浏览器或屏幕阅读器浏览的用户来说非常重要。\n*   ![Image](img/arrow.jpg)\
  \ `title`——确保当用户访问指定区域时，包含这些信息的工具提示也能显示出来。\n\n图像映射中每个不同的可点击区域都必须描述为一个单独的区域，这意味着一个典型的图像映射由一系列区域组成。在编写完\
  \ `<area>` 标签后，你就完成了图像映射的定义，因此用结束标签 `</map>` 来收尾。\n\n创建图像映射的最后一步是将其与实际的地图图像连接起来。地图图像通过普通的\
  \ `<img>` 标签放置在页面上。不过，还需要添加一个额外的 `usemap` 属性，如下所示：\n\n点击此处查看代码图片\n\n```\n<img src=\"\
  timezonemap.png\" usemap=\"#timezonemap\"\n  style=\"border:none; width:977px;height:498px\
  \ \"\n   alt=\"World Timezone Map\">\n```\n\n在指定 `usemap` 属性的值时，使用你在 `<map>` 标签的\
  \ `id` 中设置的名称（不要忘记 `#` 符号）。同时包含 `style` 属性来指定图像的高度和宽度，并关闭图像映射周围的边框，你可以根据自己的图像映射选择保留或移除边框。\n\
  \n清单 8.6 展示了一个包含地图图形、其图像映射以及几个映射区域的示例网页的完整代码。\n\n**清单 8.6** 使用 `<map>` 和 `<area>`\
  \ 标签定义图像映射的区域\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <title>Testing an Image Map</title>\n  </head>\n\
  \  <body>\n    <section>\n      <header>\n        <h1>Testing an Image Map</h1>\n\
  \      </header>\n      <div style=\"text-align:center;\">\n        Click on an\
  \ area to learn more about\n        that location or time zone.<br>\n        <imgsrc=\"\
  timezonemap.png\"usemap=\"#timezonemap\"\n        style=\"border:none;width:977px;height:498px;\"\
  \n        alt=\"World Timezone Map\">\n      </div>\n    </section>\n    <mapname=\"\
  timezonemap\" id=\"timezonemap\">\n      <area shape=\"poly\" coords=\"233,0,233,20,225,22,225,101,216,121,212,\n\
  \      154,212,167,212,181,222,195,220,209,226,214,226,234,232,252,224,\n      253,223,261,231,264,232,495,254,497,274,495,275,482,258,463,275,\n\
  \      381,270,348,257,338,266,329,272,313,271,301,258,292,264,\n      284,262,262,272,263,272,178,290,172,289,162,274,156,274,\n\
  \      149,285,151,281,134,272,137,274,3\"\n      href=\"http://en.wikipedia.org/wiki/eastern_time_zone\"\
  \n      alt=\"Eastern Time Zone\" title=\"Eastern Time Zone\">\n      <area shape=\"\
  rect\" coords=\"1,73,74,163 \"\n      href=\"http://en.wikipedia.org/wiki/Alaska\"\
  \n      alt=\"Alaska\" title=\"Alaska\">\n    </map>\n  </body>\n</html>\n```\n\n\
  图 8.20 展示了 清单 8.6 中的图像映射的实际效果。当鼠标悬停在一个区域上时，该区域的 `alt` 或 `title` 文本（在此示例中为 `Eastern\
  \ Time Zone`）会显示在图像映射上。\n\n![一张截图展示了使用图像映射的结果。它显示了带时区的世界地图。在地图顶部，有一段文字：点击某个区域以了解该地点或时区的更多信息。](img/08fig20.jpg)\n\
  \n**图 8.20** 清单 8.6 中定义的图像映射在网页上的显示效果。\n\n注意\n\n生成映射图像的一种方法完全依赖于 CSS，而不是 HTML 的\
  \ `<map>` 标签。你将在第 11 课“使用 CSS 更好地处理列表、文本和导航”中了解更多相关内容。\n\n### 链接到多媒体文件\n\n现在让我们暂时离开静态图像，进入更令人兴奋的多媒体领域，比如音频和视频。将视频或音频文件嵌入网站最简单、最可靠的方法就是使用\
  \ `<a>` 标签进行链接，就像链接到另一个 HTML 文件一样。\n\n例如，你可以使用以下代码行提供一个可爱的山雀的 MOV 视频：\n\n点击此处查看代码图片\n\
  \n```\n<a href=\"chickadee.mov\">View a cute chickadee!</a>\n```\n\n当用户点击文字 `View\
  \ a cute chickadee!` 时，`chickadee.mov` QuickTime 视频文件会从你的网络服务器传输到他们的计算机。文件下载完成后，用户安装的任何辅助应用程序或插件都会自动启动。如果找不到兼容的辅助程序或插件，网络浏览器会提示用户下载相应的插件，或者将视频保存到硬盘上以便稍后观看。\n\
  \n注意\n\n如果你不熟悉*辅助应用程序*（简称*辅助应用*），它们是网络浏览器用来显示自身无法处理的任何文件类型的外部程序。通常，当网络浏览器无法自行显示某种文件类型时，就会调用与该文件类型关联的辅助应用程序。\n\
  \n*插件*是一种特殊类型的辅助应用程序，直接安装在网络浏览器中。它们使你能够直接在浏览器窗口中查看多媒体内容。大多数浏览器默认安装了视频插件。\n\n自己动手试试\n\
  \n创建或查找一些多媒体内容用于你的网站\n\n在学习如何将多媒体放置到网页上之前，你需要有一些多媒体内容。\n\n创建任何类型的多媒体都可能是一项具有挑战性且复杂的任务。如果你打算从头开始创建自己的内容，那么要成为顶尖的多媒体开发者，你需要的远不止这些课程。不过，当你拥有一些内容后，你可以使用本课中的技巧来了解如何将你的新作品放置到网页中。\n\
  \n\n\n\n\n如果你在艺术创作方面欠缺，可以通过几种替代方式获取实用的多媒体资源。除了显而易见的（如聘请艺术家）之外，这里有一些建议：\n\n*   ![Image](img/arrow.jpg)\
  \ 互联网上的大部分材料都是免费的。当然，向内容的作者或当前所有者双重确认仍然是一个好主意；你不想因侵犯版权而被起诉。此外，美国政府的各个机构产生的内容根据法律属于所有美国人。（例如，在网上找到的任何\
  \ `NASA` 视频都是供你免费使用的。）\n\n*   ![Image](img/arrow.jpg) 许多搜索引擎具有查找多媒体文件的特定搜索功能。只要你注意版权问题，这可以是寻找与特定主题相关的多媒体素材的简单方法。简单搜索“sample\
  \ `MP4` movie”或“sample audio files”就会产生多到你处理不过来的结果。\n\n*   ![Image](img/arrow.jpg)\
  \ 如果你倾向于创意，请确定你最喜欢的媒介——例如，视频制作、音频制作或动画制作。当你有了起点后，研究一下可以让你创作此类艺术杰作的各种类型软件。许多公司包括\
  \ `Adobe` ([www.adobe.com](http://www.adobe.com)) 和 `Apple` ([www.apple.com](http://www.apple.com))\
  \ 都提供了多媒体软件。适用于 Windows 和 Macintosh 的一种流行工具是 `Camtasia` ([www.techsmith.com/video-editor.html](http://www.techsmith.com/video-editor.html))。\n\
  \nListing 8.7 包含了使用简单的图像链接播放 Windows Media 格式视频的网页代码。除了图像链接，文本中还放置了一个链接以为用户提供上下文。\n\
  \n**Listing 8.7** 将图像链接到 Windows Media Video\n\n点击此处查看代码图像\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>This\
  \ Chickadee Thinks It’s a Hummingbird!</title>\n  </head>\n  <body>\n    <h1>This\
  \ Chickadee Thinks It’s a Hummingbird!</h1>\n    <div style=\"border-style:none;\
  \ float:left; padding:12px;\">\n      <a href=\"chickadee.wmv\"><img src=\"projector.gif\"\
  \ alt=\"Chickadee Video\"></a>\n    </div>\n    <p>Chickadees have to eat too! But\
  \ most don’t eat hummingbird nectar.</p>\n    <p>Click <a href=\"chickadee.wmv\"\
  >here</a> 或点击投影仪图形来查看这只松雀正在动作的视频片段。</p>\n  </body>\n</html>\n```\n\n这段代码简单地使用 `projector.gif`\
  \ GIF 图像作为指向 `chickadee.wmv` 视频片段的链接。图 8.21 显示了带有投影仪图像的松雀示例页面。当点击图像时，将调用 Windows\
  \ Media Player 并开始电影。\n\n![一张截图显示了从网页调用外部应用程序的示例。左侧的 projector.gif 显示被点击，右侧的浏览器窗口被另一个播放视频的窗口覆盖。](img/08fig21.jpg)\n\
  \n**图 8.21** `projector.gif` GIF 图像被用作 Windows Media 文件的图像链接，该文件启动一个外部助手应用程序。注意，并非所有计算机都支持\
  \ `WMV` 文件。\n\n要查看视频，只需点击动画投影仪（或段落中的文本链接）。此操作将导致浏览器在插件帮助下播放视频（如果找到了可以播放该片段的插件），或者交给合适的助手应用程序，或者将图像下载到硬盘上。\n\
  \n如果你将链接从 `chickadee.wmv` (Windows Media) 改为 `chickadee.mov` (QuickTime)，你的浏览器处理链接的方式会有不同。QuickTime\
  \ 插件不是启动另一个程序，而是允许你直接在浏览器窗口中查看视频片段（参见图 8.22）。\n\n![一张截图显示浏览器使用 Quick Time 浏览器插件播放视频。](img/08fig22.jpg)\n\
  \n**图 8.22** 当你跟随图像链接时，将使用 QuickTime 浏览器插件播放 `chickadee.mov` QuickTime 电影。\n\n###\
  \ 注意\n\n如果你的浏览器不支持 QuickTime，你可以从 Apple 网站 [www.apple.com/quicktime/](http://www.apple.com/quicktime/)\
  \ 免费下载 QuickTime 播放。即使你安装了 QuickTime，某些浏览器播放 QuickTime 电影的方式不同。\n\n正如你可能猜到的，这种方法因为插件无效。`<video>`\
  \ 元素包含备文本 `Your browser does not support HTML5.`，它只有在标签未显示时才会显示——就像 `img` 标签中的 `alt`\
  \ 属性一样。\n\n### 嵌入多媒体文件\n\nHTML5 引入了两个嵌入媒体的新标签：`<video>` 和 `<audio>`。这些标签在桌面和移动浏览器中都得到了广泛支持。\n\
  \n#### 使用 `<video>` 元素在网页上播放视频\n\n在网页中嵌入视频使用 `<source>` 标签。以下是嵌入松雀的代码：\n\n```html\n\
  <video controls style=\"width: 400px; height: auto;\">\n  <source src=\"chickadee.wmv\"\
  \ type=\"video/x-wmv\">\n  <p>Your browser does not support HTML5.</p>\n</video>\n\
  ```\n\n嵌入视频文件只需要，但在不同计算机间无法正常工作。`<source>` 元素允许你定义需要或想要的多个源文件。\n\n```html\n<video\
  \ controls>\n  <source src=\"chickadee.wmv\" type=\"video/x-wmv\">\n  <source src=\"\
  chickadee.mp4\" type=\"video/mp4\">\n  <p>Your browser does not support HTML5.</p>\n\
  </video>\n```\n\n### 注意\n\n有很多视频编码格式和容器，包括 `MOV`、`AVI`、`Flash` 和 `WMV`。但只有三个在网页中运行可靠：\n\
  \n*   ![Image](img/arrow.jpg) `MP4` 或 `H264` 支持最好，所有现代浏览器都能播放这些文件。\n*   ![Image](img/arrow.jpg)\
  \ `WebM` 在 Firefox 和 Chrome 中支持良好。它在 Edge 中部分支持，并配合安装的编码适用于 Safari 和 Internet Explorer。\n\
  *   ![Image](img/arrow.jpg) `Ogg` 或 `Ogg/Theora` 被 Firefox 和 Chrome 支持，将被 Edge 支持，但在其他浏览器中支持并不良好。\n\
  \n最好将你拥的所有视频文件转换为 `MP4`。搜索你喜欢的搜索引擎来寻找免费的在线转换器。\n\n你可以在图 8.23 中看到这段代码的结果。\n\n\n\n\
  \n\n你可以使用多种不同的视频格式。大多数设计师使用 MP4，因为它被所有现代浏览器（包括移动设备）支持。你在网页上可能看到的其他格式包括 WebM、HEVC\
  \ 以及 OggTheora 或 OggV。\n\n![截图展示了在网页中嵌入视频的示例。](img/08fig23.jpg)\n\n**图 8.23** `<video>`\
  \ 标签使你能够在网页中嵌入视频片段。\n\n`<video>` 元素的 `width` 和 `height` 样式属性决定了嵌入播放器的大小。如果你省略这些属性，有些浏览器会自动调整嵌入播放器的大小以适应内容，而其他浏览器则不会显示任何内容。为了安全起见，始终定义视频的尺寸以匹配正在播放的多媒体内容。与图片类似，你可以将宽度设置为相对值（例如容器宽度的\
  \ 100%），然后将高度设置为 `auto`，以避免变形。\n\n设计师在 `<video>` 标签上使用的另一个属性是 `controls`。这告诉浏览器显示带有播放/暂停控制按钮的视频。但还有其他几个有用的属性：\n\
  \n*   ![Image](img/arrow.jpg) `preload`——有三个可能的值：`none`、`auto` 和 `metadata`。如果你不想缓冲文件，使用\
  \ `none`；如果要缓冲文件，使用 `auto`；如果只想缓冲文件的元数据，使用 `metadata`。\n*   ![Image](img/arrow.jpg)\
  \ `loop`——告诉浏览器在视频播放到末尾时从头开始播放。\n*   ![Image](img/arrow.jpg) `poster`——指向一个图像文件，当视频不可用时（例如仍在下载时）显示该图像。\n\
  *   ![Image](img/arrow.jpg) `autoplay`——使视频在准备好后立即开始播放。\n\n清单 8.8 展示了山雀网页的相关代码，你可以看到\
  \ `<video>` 元素在上下文中的呈现。\n\n**清单 8.8** 使用 `<video>` 元素直接嵌入视频片段\n\n点击此处查看代码图片\n\n\
  ```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Chickadee Wants Food!</title>\n    <style>\n      video {\n      \
  \  width: 50%; height: auto; float: left; padding: 1rem;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <h1>Chickadee Wants Food!</h1>\n    <video controls>\n\
  \      <source src=\"images/chickadee.wmv\" type=\"video/x-ms-wmv\">\n      <source\
  \ src=\"images/chickadee.mp4\" type=\"video/mp4\">\n      <p>Your browser does not\
  \ support HTML5 video.</p>\n    </video>\n    <p>All birds eat, but this chickadee\
  \ would like you to know\n    that it's not happy with hummingbird food as the only\
  \ option.\n    </p>\n    <p>Chickadees also drink the hummingbird water at times,\
  \ so if\n    you want to feed only hummers, you should watch the other birds.\n\
  \    </p>\n  </body>\n</html>\n```\n\n#### 使用 `<audio>` 元素进行音频播放\n\n在上一节中，你学习了如何使用\
  \ HTML5 的 `<video>` 元素嵌入视频文件。`<audio>` 元素的工作方式非常相似。你只需将 `<audio>` 元素放在希望播放器显示的位置，浏览器就会将其包含在内。\n\
  \n清单 8.9 展示了如何使用 `<audio>` 元素嵌入一个将由浏览器播放的音频文件。`<audio>` 元素非常简单，只需要一个属性：`src`，即要播放资源的路径。然而，正如你在清单\
  \ 8.9 中所见，你可能还需要使用其他一些方便的属性。\n\n**清单 8.9** 使用 `<audio>` 元素嵌入并播放音频文件\n\n点击此处查看代码图片\n\
  \n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Let's Hear Some Music</title>\n  </head>\n  <body>\n    <h1>Let's\
  \ Hear Some Music</h1>\n    <p>Better yet, let's use the HTML5 &lt;audio&gt; element\n\
  \    to do so!</p>\n    <audio\n          src=\"manhattan_beach.mp3\"\n        \
  \  preload=\"auto\"\n          controls\n          autoplay\n          loop>\n \
  \         <p>Your browser does not support the audio element.</p>\n    </audio>\n\
  \   </body>\n</html>\n```\n\n注意\n\n请注意在 `<audio>` 元素内部包含了一条给用户的消息。虽然所有主流浏览器的当前版本都支持\
  \ `<audio>` 元素，但与 `<video>` 元素类似，如果用户的浏览器不支持它，用户将看到 `<p></p>` 标签内的消息。该消息可以是 HTML\
  \ 的任何组合，包括链接、图片或脚本。\n\n除了 `src` 属性（在本例中其值为 `manhattan_beach.mp3`，因为这是我们要播放的音频文件名）之外，我们在这个\
  \ `<audio>` 元素中还使用了另外四个属性：\n\n*   ![Image](img/arrow.jpg) `preload`——有三个可能的值：`none`、`auto`\
  \ 和 `metadata`。如果你不想缓冲文件，使用 `none`；如果要缓冲文件，使用 `auto`；如果只想缓冲文件的元数据，使用 `metadata`。\n\
  *   ![Image](img/arrow.jpg) `controls`——如果存在，则显示音频播放器的控件。\n*   ![Image](img/arrow.jpg)\
  \ `autoplay`——如果存在，则在文件加载后立即播放。\n*   ![Image](img/arrow.jpg) `loop`——如果存在，则重复播放文件，直到手动停止。\n\
  \n图 8.24 显示了清单 8.9 中的页面在 Chrome 浏览器中的渲染效果。\n\n![截图显示了“audio”元素的输出。一个水平条表示音频播放器，带有暂停、音频位置导航、时间和音量按钮。](img/08fig24.jpg)\n\
  \n**图 8.24** 使用 `<audio>` 元素播放声音文件。\n\n在实践中，你可能不希望在你的网站上自动播放和循环播放声音文件，因为这通常被认为是一种特别负面的用户体验。然而，如果你*确实*要自动播放声音文件（请不要这样做！），请务必包含播放器控件，以便用户可以立即关闭声音。\n\
  \n与视频一样，你应该为你想要包含的音频文件定义 MIME 类型。以下是几种你可能在网页中使用的流行音频格式的 MIME 类型：\n\n*   ![Image](img/arrow.jpg)\
  \ WAV 音频——`audio/vnd.wave`\n*   ![Image](img/arrow.jpg) MP3 音频——`audio/mpeg`\n*\
  \   ![Image](img/arrow.jpg) MP4 音频——`audio/mp4`\n\n### 使用多媒体的额外提示\n\n在向网站添加视频、音频或动画之前，先问问自己是否真的应该这样做。当你使用这些类型的多媒体时，请确保有充分的理由。无端的音视频，就像无端的图片一样，可能会削弱你的整体信息传达。另一方面，如果你的信息是“看看我制作的视频”或“听听我的音乐并下载一些歌曲”，那么多媒体绝对应该在你的网站中发挥作用。\n\
  \n请记住以下几点额外提示：\n\n*   ![Image](img/arrow.jpg) 不要在页面中包含多媒体并将其设置为页面加载时自动播放。始终让用户可以选择开始（和停止）你的声音或视频。如果你使用视频背景，请确保声音已静音或移除；视频会分散注意力，而声音往往更甚。\n\
  *   ![Image](img/arrow.jpg) 当提供文件供直接下载时，给用户提供文件类型的选择。不要将自己限制为只提供一种播放器、一种操作系统可播放的多媒体内容。同时，在嵌入的媒体中使用\
  \ `<source>` 标签提供多种选项。\n\n\n\n\n\n*   ![Image](img/arrow.jpg) 多媒体文件比典型的图形和文本文件大，这意味着你的\
  \ Web 服务器需要有足够的空间来存储它们，并有足够的带宽将它们传输给通过你的网站请求的任何用户。如果你计划在网站上提供超过几个视频，请咨询你的托管提供商；他们可能会有相关限制，或者提供针对大文件托管的优惠方案。\n\
  *   ![Image](img/arrow.jpg) 如果你的网站完全是音频或视频，提供的文本或图形极少，请理解由于用户系统或带宽的限制，部分观众可能看不到或听不到你想展示的内容。请为这些用户提供获取信息的额外选项。这对于无障碍访问性（accessibility）也有好处。\n\
  *   ![Image](img/arrow.jpg) 利用免费的在线视频托管服务，例如 YouTube ([www.youtube.com](http://www.youtube.com))。YouTube\
  \ 不仅为你的视频片段提供存储空间，还提供了将视频嵌入到自己的网页中所需的代码。\n\n### 总结\n\n在本节中，你学习了颜色使用的一些最佳实践，并学习了如何使用色轮来寻找与文本互补的颜色。此外，你学习了颜色的十六进制表示法——所有颜色都用红、绿、蓝比例相关的符号来表示——并看到了十六进制表示法如何让你对元素应用细微的颜色。你还学习了如何使用\
  \ RGBa 颜色模型为颜色添加透明度。更重要的是，你学习了三个与颜色相关的 CSS 属性，可以应用于容器背景、边框和文本。此外，你还学习了为网页准备图形的基础知识。你了解到这是一个复杂的话题，并且在本节中学的知识已经足以激发你的兴趣。本节的示例使用了流行的（且免费的！）GIMP\
  \ 软件包，但欢迎根据自己的需要使用最适合你的的图形软件。在你学习的操作中包括裁剪、调整大小和调整图像颜色，你还学习了不同的文件格式。在网站中包含图形时，你必须记住许多考虑因素，包括图形的大小和分辨率，以及如何使用透明度、动画\
  \ GIF 和平铺背景。\n\n在创建图像之后，你还学习了如何在网页中使用图像。你学习了如何使用 `<img>` 标签将它们放置在页面中，以及如何包含一段短文本消息，该消息会在图像加载时代替图像显示，并且当用户将鼠标指针悬停在图像上时也会出现。你还学习了如何控制每个图像的水平和垂直对齐，以及如何让文本环绕图像的左右侧。为了让你的页面更具交互性，你学习了如何将图像作为链接——通过在图像周围使用\
  \ `<a>` 标签或通过创建图像映射（image maps）。最后，你学习了如何在网页中嵌入视频和声音。你学习了如何使用指向多媒体文件的简单链接，这是播放媒体内容支持最广泛但活性最低的选项。然后你学习了如何使用\
  \ `<video>` 和 `<source>` 元素直接在网页中嵌入播放器。你还学习了 HTML5 中的 `<audio>` 元素，它允许浏览器渲染音频文件。此外，你获得了一些关于在页面中包含多媒体的提示。\n\
  \n表 8.1 总结了本节涵盖的标签和属性。\n\n**表 8.1** 第 8 中涵盖的标签和属性\n\n| **标签** | **功能** |\n| :---\
