  \ Web 内容外观和功能的技巧\n\n在您学习 HTML（超文本标记语言）、CSS（层叠样式表）和 JavaScript 的细节之前，重要的是要扎实理解那些帮助将这些纯文本文件转化为您在浏览万维网时在电脑或手持设备上看到的丰富多媒体显示的技术。\n\
  \n例如，如果没有浏览器来查看，包含 HTML 和 CSS 的文件就毫无用处；如果没有 Web 服务器，除了您自己之外，没有人能看到您的内容。Web 服务器使您的内容可供他人访问，而他人则使用他们的浏览器和其他设备导航到一个地址，并等待服务器向他们发送信息。您将深入参与这个发布过程，因为您必须首先创建文件，然后将它们放到服务器上以使其可用；同时，您必须确保您的内容能够按照您的意图呈现给最终用户，无论用户的屏幕是手表表盘大小还是广告牌大小。\n\
  \n### HTML 与万维网的简史\n\n很久以前，在月球上还没有脚印的时候，一些有远见的人决定看看他们是否能连接几个主要的计算机网络。我们就不提那些名字和故事了（两者都很多），但最终的结果是“网络之母”，也就是我们现在所说的互联网。\n\
  \n直到 1990 年，通过互联网访问信息还是一件相当技术性的事情。事实上，它如此困难，以至于即使是拥有博士学位的物理学家在尝试交换数据时也常常感到沮丧。其中一位物理学家，就是现在著名的（并被授予爵位的）蒂姆·伯纳斯-李爵士，他想出了一种通过超文本链接在互联网上轻松交叉引用文本的方法。\n\
  \n\n\n\n这并不是一个新想法，但他简单的超文本标记语言（HTML）却成功发展壮大，而其他更雄心勃勃的超文本项目却举步维艰。*超文本*最初指的是以电子形式存储、页面间带有交叉引用链接的文本。如今，它已是一个更宽泛的术语，指代任何可以链接到其他对象的对象（文本、图像、文件等）。*超文本标记语言*是一种用于描述文本、图形以及包含其他信息的文件如何组织和链接的语言。\n\
  \n到 1993 年，全世界只有大约 100 台计算机能够提供 HTML 页面服务。这些相互链接的页面被称为*万维网*（*WWW*），并且已经编写了多个网页浏览器程序，让人们能够查看网页。由于万维网的日益普及，一些程序员很快编写出了能够同时显示图形图像和文本的网页浏览器。从那时起，网页浏览器软件的持续发展以及\
  \ HTML 的标准化，将我们带到了今天的世界——超过十亿个网站提供着数十亿的文本和多媒体文件。\n\n注意\n\n有关万维网历史的更多信息，请参阅维基百科上关于此主题的文章：[`en.wikipedia.org/wiki/History_of_the_Web`](http://en.wikipedia.org/wiki/History_of_the_Web)。\n\
  \n这几段文字简要介绍了这段非凡时期的历史。如今的大学生从未经历过万维网不存在的时代，而始终在线的信息和无处不在的计算理念将塑造我们未来生活的方方面面。通过本课程的学习，你将不再认为网页内容创建和管理只是少数技术型人才（好吧，如果你愿意，可以称他们为极客）才具备的技能，而是会认识到，这些技能是任何人都能掌握的，无论其天生的极客程度如何。\n\
  \n### 创建网页内容\n\n你可能已经注意到我们使用了*网页内容*而非*网页*这个术语；这是有意为之。虽然我们常说“访问一个网页”，但实际上我们指的是“在电脑上查看某个地址上的所有文本和图像”。我们阅读的文本和看到的图像是由网页浏览器渲染的，而浏览器是根据单个文件中的特定指令来执行的。\n\
  \n这些文件包含用 HTML 代码*标记*（即被 HTML 代码包围）的文本，这些代码告诉浏览器文本的结构——是标题、段落、引用等。有些 HTML 标记告诉浏览器显示图像或视频文件，而不是纯文本，这又回到了这一点：不同类型的内容被发送到你的网页浏览器，所以仅仅说*网页*并不能涵盖全部。这里我们改用*网页内容*一词，以涵盖在线找到的文本、图像、音频、视频及其他各种媒体。\n\
  \n其他文件包含 CSS，它告诉浏览器页面的外观——粗体文本、蓝色边框、红色字体等。CSS 定义了浏览器应如何显示 HTML 中定义的内容结构。\n\n此外，JavaScript\
  \ 告诉浏览器页面如何与用户交互——点击时改变颜色、页面加载时发出声音等。HTML 描述结构，CSS 描述设计，而 JavaScript 则定义内容的行为，即它如何响应不同的条件。\n\
  \n在后续课程中，你将学习链接或创建网站中各种多媒体网页内容的基础知识。你还将学习如何使用 CSS 为这些内容设置样式，以及如何使用 JavaScript 使其具有交互性。此时你只需记住：*你*控制着用户访问你的网站时所看到的内容。从包含要显示的文本或告诉服务器向用户浏览器发送图形的代码的文件开始，你必须规划、设计和实现所有最终构成你网络形象的组件。正如你将在这些课程中学到的，只要理解了过程中的每一个小步骤，这并非一个困难的过程。\n\
  \n在最基本的形式中，网页内容始于一个包含 HTML 标记的简单文本文件。在这些课程中，你将学习并编写符合标准的 HTML5 标记。然后，你将学习如何使用 CSS\
  \ 和现代样式属性来装饰它，以及如何使用非侵入式 JavaScript 和现代 JavaScript 框架来影响页面行为。编写现代、符合标准的代码的众多好处之一是，将来你不必担心需要回过头来从根本上修改代码。相反，只要网页浏览器遵循标准（希望是长期遵循），你的代码（很可能）将始终有效，并且你的代码将在任何运行符合标准浏览器的设备上工作（希望是大多数设备）。\n\
  \n### 理解网页内容交付\n\n在最终生成你能看到的网页内容的过程中，多个步骤发生在许多不同的位置。这些步骤发生得非常快——以毫秒计——并且在后台进行。换句话说，尽管我们可能认为我们只是打开一个网页浏览器，输入一个网址，然后瞬间看到我们请求的内容，但后台的技术正在为我们辛勤工作。图\
  \ 1.1 展示了浏览器和服务器之间的基本交互。\n\n![该图展示了服务器与浏览器之间的通信。](img/01fig01.jpg)\n\n**图 1.1**\
  \ 浏览器请求与服务器响应。\n\n然而，在你看到所请求网站的完整内容之前，这个过程涉及多个步骤——并且可能涉及浏览器和服务器之间的多次往返。\n\n假设你想进行谷歌搜索，于是你在地址栏中乖乖输入**[www.google.com](http://www.google.com)**，或者从书签列表中选择谷歌书签。几乎立刻，你的浏览器就会显示类似图\
  \ 1.2 所示的内容。\n\n![谷歌搜索引擎的截图。](img/01fig02.jpg)\n\n**图 1.2** 访问[www.google.com](http://www.google.com)。\n\
  \n图 1.2 显示了一个包含文本和一个图像（谷歌标志）的网站。以下是从网络服务器检索该文本和图像并将其显示在屏幕上的简单过程版本：\n\n1.  你的网页浏览器向[`www.google.com`](http://www.google.com)地址发送一个请求，请求获取`index.html`文件。`index.html`文件不一定是你输入地址栏的地址的一部分；你将在本课后面进一步了解`index.html`文件。\n\
  \n2.  网络服务器进程在收到特定文件的请求后，在其目录内容中查找该文件，打开它，并将该文件的内容发送回你的网页浏览器。\n\n3.  网页浏览器接收`index.html`文件的内容，该文件是带有\
  \ HTML 标记的文本，并根据这些 HTML 代码渲染内容。在渲染内容时，浏览器遇到了谷歌标志的 HTML 代码，你可以在图 1.2 中看到它。HTML 代码看起来像这样：\n\
  \n    点击此处查看代码\n\n    ```\n    <img alt=\"Google\" src=\"/images/srpr/logo4w.png\"\
  \n         width=\"275\" height=\"95\">\n    ```\n\n    `<img>`标签提供了属性，告诉浏览器显示标志所需的文件源位置（`src`）、替代文本（`alt`）、宽度（`width`）和高度（`height`）。（你将在后续课程中了解更多关于属性的内容。）\n\
  \n\n\n\n\n4.  浏览器会查看 `<img>` 标签中的 `src` 属性，以找到源位置。在本例中，图片 `logo4w.png` 位于与浏览器获取\
  \ HTML 文件相同的网址（[www.google.com](http://www.google.com)）下的 `images` 目录中。\n\n5.  浏览器向网址\
  \ [`www.google.com/images/srpr/logo4w.png`](http://www.google.com/images/srpr/logo4w.png)\
  \ 请求该文件。\n\n6.  Web 服务器解释该请求，找到文件，并将该文件的内容发送给请求它的 Web 浏览器。\n\n7.  Web 浏览器在您的显示器上显示该图片。\n\
  \n正如您在 Web 内容交付过程的描述中所看到的，Web 浏览器的作用不仅仅是作为您查看内容的相框。浏览器会组装 Web 内容组件，并根据文件中的 HTML\
  \ 指令排列这些部分。\n\n您可以在本地（即您自己的硬盘上）查看 Web 内容，而无需 Web 服务器。内容检索和显示的过程与前面步骤中列出的过程相同，即浏览器查找并解释\
  \ HTML 文件的代码和内容。不过，路径更短：浏览器会在您自己计算机的硬盘上查找文件，而不是在远程机器上。如果需要解释文件中嵌入的任何基于服务器的编程语言，则需要\
  \ Web 服务器，但这超出了这些课程的范围。事实上，您可以在没有自己的 Web 服务器的情况下完成所有课程，但这样一来，除了您自己，没有人能看到您的杰作。\n\
  \n### 选择 Web 托管服务提供商\n\n尽管我刚刚告诉您，没有 Web 服务器也可以完成所有课程，但拥有一个 Web 服务器仍然是继续学习的推荐方式。别担心；获取托管服务提供商通常是一个快速、轻松且相对便宜的过程。事实上，您只需花费比您现在正在阅读的课程费用略高的价格，就可以获得自己的域名和一年的\
  \ Web 托管服务。\n\n如果您在您选择的搜索引擎中输入 **web hosting provider**，您将获得数百万条结果和无穷无尽的赞助搜索结果列表（也称为\
  \ *ads*）。即使您查看的是托管服务提供商的管理列表，也可能让人不知所措——尤其是当您只是想为自己、公司或组织找一个托管简单网站的地方时。\n\n在寻找提供商时，您需要缩小搜索范围，并选择最能满足您需求的提供商。以下是选择\
  \ Web 托管服务提供商的一些标准：\n\n*   ![Image](img/arrow.jpg) **可靠性/服务器“正常运行时间”**——如果您有在线业务，您需要确保人们能够持续访问。\n\
  *   ![Image](img/arrow.jpg) **客户服务**——寻找多种联系客户服务的方式（电话、电子邮件、聊天），以及常见问题的在线文档。\n*\
  \   ![Image](img/arrow.jpg) **服务器空间**——托管套餐是否包含足够的服务器空间来存放您计划在网站中包含的所有多媒体文件（图片、音频、视频）（如果有的话）？\n\
  *   ![Image](img/arrow.jpg) **带宽**——托管套餐是否包含足够的带宽，以便所有访问您网站和下载文件的人都能正常操作，而您无需额外付费？\n\
  *   ![Image](img/arrow.jpg) **域名购买和管理**——套餐是否包含自定义域名，还是您必须与托管账户分开购买和维护域名？\n*   ![Image](img/arrow.jpg)\
  \ **价格**——不要为托管支付过高费用。您会看到各种不同的价格，并应立即思考：“有什么区别？”通常，差异与服务质量关系不大，而与公司开销以及公司认为可以向用户收取多少费用有关。一个很好的经验法则是，如果您每年为基本托管套餐和域名支付超过\
  \ 75 美元，那么您可能付得太多了。\n\n以下是三个可靠的 Web 托管服务提供商，它们的基本套餐包含充足的服务器空间和带宽（以及域名和额外福利），价格相对较低：\n\
  \n注意\n\n作者多年来使用过所有这些提供商（以及其他一些提供商），并且毫无保留地推荐它们。Julie 主要使用 DailyRazor 作为 Web 托管服务提供商，尤其是在高级开发环境中，而\
  \ Jennifer 则倾向于使用 Bluehost。\n\n*   ![Image](img/arrow.jpg) **A Small Orange（[www.asmallorange.com](http://www.asmallorange.com)）**——Tiny\
  \ 和 Small 共享托管套餐是新的 Web 内容发布者的理想起点。\n*   ![Image](img/arrow.jpg) **DailyRazor（[www.dailyrazor.com](http://www.dailyrazor.com)）**——其网站托管套餐功能齐全且可靠。\n\
  *   ![Image](img/arrow.jpg) **Bluehost（[www.bluehost.com](http://www.bluehost.com)）**——Basic\
  \ 共享托管套餐适合许多个人和小型企业网站。\n\n如果您不选择这些 Web 托管服务提供商中的任何一个，您至少可以将它们的基本套餐描述作为您货比三家时的参考。\n\
  \n一个好的托管服务提供商的一个特点是，它提供一个“控制面板”，供您管理账户的各个方面。图 1.3 显示了 DailyRazor 托管账户的控制面板。许多 Web\
  \ 托管服务提供商都提供这种特定的控制面板软件（称为 cPanel）或其他设计类似的控制面板——带有清晰标注的图标，指向您可以执行的任务，以配置和管理您的账户。\n\
  \n![示例控制面板的截图。](img/01fig03.jpg)\n\n**图 1.3** 示例控制面板。\n\n您可能永远不需要使用您的控制面板，但拥有它可以让您轻松安装数据库和其他软件、查看网站统计信息以及添加电子邮件地址（以及其他许多功能）。如果您能按照说明操作，您就可以管理自己的\
  \ Web 服务器——无需特殊培训。\n\n### 使用多种 Web 浏览器和设备进行测试\n\n既然我们已经讨论了 Web 内容交付的过程以及获取 Web 服务器的问题，那么回过头来讨论使用多种\
  \ Web 浏览器和设备测试您的网站，可能显得有些奇怪。然而，在您开始学习如何使用 HTML 和 CSS 创建网站之前，请牢记这一非常重要的陈述：您网站的每位访问者都可能使用与您不同的硬件和软件配置，包括他们的设备类型（台式机、笔记本电脑、平板电脑、手机）、操作系统（Windows、Mac、Android、iOS）、屏幕分辨率、浏览器类型、浏览器窗口大小和连接速度。请记住，您无法控制访问者查看您网站时所使用的任何方面。因此，在您设置\
  \ Web 托管环境并准备开始工作时，请考虑下载几种 Web 浏览器，以便您拥有一个本地测试工具套件。让我们解释一下为什么这很重要。\n\n尽管所有 Web 浏览器都以相同的一般方式处理信息，但它们之间存在一些具体差异，导致不同浏览器中的显示效果并不总是相同。即使是同一版本的同一种\
  \ Web 浏览器的用户，也可以通过选择不同的显示选项和/或更改其查看窗口的大小来改变页面的显示方式。所有主流 Web 浏览器都允许用户用自己的选择覆盖网页作者指定的背景颜色和字体。屏幕分辨率、窗口大小和可选的工具栏也会改变页面首次出现在屏幕上时用户看到的内容量。您只能确保编写符合标准的\
  \ HTML 和 CSS。\n\n注意\n\n\n\n\n\n在第四部分“响应式网页设计”中，你将学习响应式网页设计的概念，即网站的设计会根据用户的行为和浏览环境（屏幕尺寸、设备等）自动变化。\n\
  \n无论如何，都不要花费大量时间设计一个只在你自己电脑上看起来完美的页面——除非你愿意在朋友的电脑、街角咖啡店的电脑或你的 iPhone 上看到它时感到失望。\n\
  \n你应该始终尽可能多地使用以下这些网页浏览器来测试你的网站：\n\n*   ![图片](img/arrow.jpg) Apple Safari（[`www.apple.com/safari/`](https://www.apple.com/safari/)）——适用于\
  \ Mac\n*   ![图片](img/arrow.jpg) Google Chrome（[`www.google.com/chrome/`](https://www.google.com/chrome/)）——适用于\
  \ Mac、Windows 和 Linux/UNIX\n*   ![图片](img/arrow.jpg) Mozilla Firefox（[`www.mozilla.com/firefox/`](https://www.mozilla.com/firefox/)）——适用于\
  \ Mac、Windows 和 Linux/UNIX\n*   ![图片](img/arrow.jpg) Microsoft Edge（[`www.microsoft.com/edge/`](https://www.microsoft.com/edge/)）——适用于\
  \ Windows\n*   ![图片](img/arrow.jpg) Opera（[`www.opera.com`](https://www.opera.com)）——适用于\
  \ Mac、Windows 和 Linux/UNIX\n\n现在你已经设置好了开发环境，或者至少对将来想要设置的类型有了一些想法，让我们继续创建测试文件。\n\n\
  ### 创建示例文件\n\n在真正创建文件之前，先看一下清单 1.1。这个清单展示了一段简单的网页内容——几行 HTML 代码，在浏览器窗口居中显示两行大号粗体文字：`\"\
  Hello World! Welcome to My Web Server.\"`。在后续课程中，你将进一步了解此文件中使用的 HTML 和 CSS。\n\n\
  **清单 1.1** 我们的示例 HTML 文件\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"en\"\
  >\n  <head>\n    <meta charset=\"utf-8\">\n    <title> Hello World! </title>\n \
  \ </head>\n  <body>\n    <h1 style=\"text-align: center;\"> Hello World! <br>\n\
  \      Welcome to My Web Server.</h1>\n  </body>\n</html>\n```\n\n要使用这段内容，请打开你选择的文本编辑器，例如记事本（Windows）或\
  \ TextEdit（Mac）。不要使用 WordPad、Microsoft Word 或其他功能齐全的文字处理软件，因为这些程序会创建与我们用于网页内容的纯文本文件不同类型的文件。\n\
  \n大多数网页设计师不会使用记事本或 TextEdit 来编写网页。相反，他们会使用专门为此目的设计的编辑器。这些编辑器提供了更多功能，使编写和设计网页更加容易。以下是一些最流行的编辑器：\n\
  \n*   ![图片](img/arrow.jpg) **Coda**（[`panic.com/coda/`](https://panic.com/coda/)）——一款专为编辑网页而设计的\
  \ Mac 文本编辑器。\n*   ![图片](img/arrow.jpg) **HTML-Kit**（[`www.htmlkit.com`](https://www.htmlkit.com)）——一款流行的\
  \ Windows 文本编辑器。旧版本是免费的。\n*   ![图片](img/arrow.jpg) **Komodo Edit**（[`www.activestate.com/komodo-edit`](https://www.activestate.com/komodo-edit)）——流行\
  \ Komodo IDE 的免费开源版本。可在 Windows、Mac 和 Linux 上运行。\n*   ![图片](img/arrow.jpg) **Notepad++**（[`notepad-plus-plus.org`](https://notepad-plus-plus.org)）——一款适用于\
  \ Windows 的免费开源编辑器。\n*   ![图片](img/arrow.jpg) **Sublime Text**（[`sublimetext.com`](https://sublimetext.com)）——一款适用于所有平台的流行编辑器，拥有丰富的免费插件生态系统。\n\
  \n选定要使用的编辑器后，输入你在清单 1.1 中看到的内容，然后将文件保存为 `sample.html`。`.html` 扩展名告诉网页服务器你的文件是用 HTML\
  \ 编写的。当文件内容被发送到请求它的网页浏览器时，浏览器也会知道它是 HTML 并正确渲染它。\n\n现在你有了一个示例 HTML 文件可以使用——并且希望有地方存放它，比如一个网页托管账户——让我们开始发布你的网页内容吧。\n\
  \n### 使用 FTP 传输文件\n\n正如你目前所学到的，你必须将网页内容放到网页服务器上，才能让其他人访问。这个过程通常通过*文件传输协议*（*FTP*）来完成。要使用\
  \ FTP，你需要一个 FTP 客户端——一种用于将文件从你的计算机传输到网页服务器的程序。\n\nFTP 客户端需要三项信息才能连接到你的网页服务器；这些信息会在你设置账户后由托管服务提供商发送给你：\n\
  \n*   ![图片](img/arrow.jpg) 你要连接的主机名或地址\n*   ![图片](img/arrow.jpg) 你的账户用户名\n*   ![图片](img/arrow.jpg)\
  \ 你的账户密码\n\n有了这些信息后，你就可以使用 FTP 客户端将内容传输到网页服务器了。\n\n#### 选择 FTP 客户端\n\n所有 FTP 客户端通常都使用相同类型的界面。图\
  \ 1.4 展示了 FireFTP 的示例，这是一个与 Firefox 网页浏览器配合使用的 FTP 客户端。本地机器（你的计算机）的目录列表显示在屏幕左侧，远程机器（网页服务器）的目录列表显示在右侧。通常，你会看到向右和向左的箭头按钮，如图\
  \ 1.4 所示。向右箭头将选中的文件从你的计算机发送到网页服务器；向左箭头将文件从网页服务器发送到你的计算机。许多 FTP 客户端还允许你直接选择文件，然后拖放到目标机器上。\n\
  \n![FireFTP 界面的截图。](img/01fig04.jpg)\n\n**图 1.4** FireFTP 界面。\n\n注意\n\n许多网页编辑程序都内置了\
  \ FTP 客户端。如果你打算使用网页编辑程序，请先确认它是否包含此功能，然后再下载（或购买）另一个 FTP 客户端。\n\n有许多免费可用的 FTP 客户端，但你也可以通过基于网页的文件管理器工具来传输文件，该工具很可能是你网页服务器控制面板的一部分。然而，这种文件传输方法通常会增加更多步骤，远不如在你自己的机器上安装\
  \ FTP 客户端那样简洁（或简单）。\n\n以下是一些流行的免费 FTP 客户端：\n\n*   ![图片](img/arrow.jpg) **Classic\
  \ FTP**（[`www.nchsoftware.com/classic/`](https://www.nchsoftware.com/classic/)）——适用于\
  \ Mac 和 Windows\n*   ![图片](img/arrow.jpg) **Cyberduck**（[`cyberduck.io`](https://cyberduck.io)）——适用于\
  \ Mac\n*   ![图片](img/arrow.jpg) **FileZilla**（[`filezilla-project.org`](https://filezilla-project.org)）——适用于所有平台\n\
  *   ![图片](img/arrow.jpg) **Transmit**（[`panic.com/transmit`](https://panic.com/transmit)）——适用于\
  \ Mac\n\n当你选定一个 FTP 客户端并将其安装到计算机上后，就可以从网页服务器上传和下载文件了。在下一节中，你将看到如何使用清单 1.1 中的示例文件来完成这个过程。\n\
  \n#### 使用 FTP 客户端\n\n以下步骤展示了如何使用 Transmit 连接到你的网页服务器并传输文件。不过，所有 FTP 客户端都使用类似的界面，因此如果你理解了以下步骤，就应该能够使用任何\
  \ FTP 客户端。\n\n请记住，你首先需要主机名、账户用户名和账户密码。有了这些信息后，请按照以下步骤操作：\n\n1.  启动 Transmit 程序，然后点击\
  \ FTP 选项卡。系统会提示你填写要连接的站点信息，如图 1.5 所示。\n\n    ![Transmit 程序的截图。](img/01fig05.jpg)\n\
  \n    **图 1.5** 在 Transmit 中连接到新站点。\n\n\n\n\n\n2.  按照图 1.5 所示填写每一项，具体说明如下：\n\n \
  \   *   ![图片](img/arrow.jpg) **服务器**是您需要向其发送网页的网络服务器的 FTP 地址。您的托管服务提供商会提供此地址。它可能是`yourdomain.com`，但请检查您注册服务时收到的信息。\n\
  \n    *   ![图片](img/arrow.jpg) 使用托管服务提供商提供的信息填写**用户名**字段和**密码**字段。\n\n    *   ![图片](img/arrow.jpg)\
  \ 暂时将**初始路径**字段留空。您将在本课后面了解更多相关信息。\n\n    *   ![图片](img/arrow.jpg) 将**端口**字段设置为`21`，并选择`FTP`，除非您的托管服务提供商指定使用\
  \ SSL 或 TLS/SSL。\n\n    *   ![图片](img/arrow.jpg) 完成设置后，单击**连接**以连接到 FTP 服务器。如果您想将此服务器添加到收藏夹，可以单击加号图标。\n\
  \n    此时，您会在右下角看到一个倒计时计时器，表示 Transmit 正在尝试连接到网络服务器。连接成功后，您会看到一个类似图 1.6 的界面，左侧显示本地目录的内容，右侧显示网络服务器的内容。\n\
  \n    ![截图显示了与服务器成功建立连接后的 Transmit 窗口。现在，窗口右侧显示了远程网络服务器的内容。](img/01fig06.jpg)\n\n\
  \    **图 1.6** 通过 Transmit 成功连接到远程网络服务器。\n\n    现在，您*几乎*已经准备好将文件传输到网络服务器了。剩下的就是切换到所谓的网络服务器*文档根目录*。网络服务器的文档根目录是指定为网站内容顶级目录的目录——目录结构的起点，您将在本课后面了解更多相关信息。通常，此目录名为`public_html`、`www`（因为`www`已被创建为`public_html`的别名）或`htdocs`。您无需创建此目录；您的托管服务提供商会为您创建。\n\
  \n3.  双击文档根目录名称以将其打开。FTP 客户端界面右侧的显示会随之变化，显示此目录的内容。（此时它可能为空，除非您的网络托管服务提供商已在该目录中为您放置了占位文件。）\n\
  \n4.  目标是将您之前创建的`sample.html`文件从计算机传输到网络服务器，因此在 FTP 客户端界面左侧的目录列表中找到该文件（如有必要，请导航）。\n\
  \n5.  单击该文件并将其拖到窗口右侧，以将文件发送到网络服务器。（或者，您可以双击该文件进行传输。）文件传输完成后，客户端界面右侧会刷新，显示文件已到达目标位置。\n\
  \n6.  转到**文件**菜单，选择**断开连接**以关闭连接，然后退出 Transmit 程序。\n\n这些步骤在概念上与您每次想通过 FTP 将文件发送到网络服务器时所采取的步骤类似。您还可以使用\
  \ FTP 客户端在远程网络服务器上创建子目录。要使用 Transmit 创建子目录，请在要放置文件夹的目录中右键单击，然后选择**新建文件夹**。不同的 FTP\
  \ 客户端为实现相同目标提供了不同的界面选项。\n\n### 了解文件在网络服务器上的放置位置\n\n维护网站内容的一个重要方面是确定如何组织这些内容——不仅是为了用户查找，也是为了您在服务器上进行维护。将文件放入目录有助于管理这些文件。\n\
  \n如何命名和组织网络服务器上的目录，以及是否制定文件维护规则，完全由您决定。从长远来看，维护一个组织良好的服务器可以使您对其内容的管理更加高效。\n\n####\
  \ 基本文件管理\n\n当您浏览网页时，您可能已经注意到，随着您在网站中导航，URL 会发生变化。例如，如果您正在查看一家公司的网站，并且单击指向该公司产品或服务的图形导航，URL\
  \ 可能会从\n\n`http://www.companyname.com/`\n\n变为\n\n`http://www.companyname.com/products/`\n\
  \n或\n\n`http://www.companyname.com/services/`\n\n在前面的部分中，我们使用了术语*文档根目录*，但没有真正解释它的含义。网络服务器的文档根目录本质上就是完整\
  \ URL 中的尾部斜杠。例如，如果您的域名是`yourdomain.com`，并且您的 URL 是`http://www.yourdomain.com/`，那么文档根目录就是由尾部斜杠(/)表示的目录。文档根目录是您在网络服务器上创建的目录结构的起点；它是网络服务器开始查找网络浏览器请求的文件的位置。\n\
  \n如果您按照之前的指示将`sample.html`文件放在文档根目录中，您将能够通过以下 URL 在网页浏览器中访问它：\n\n`http://www.yourdomain.com/sample.html`\n\
  \n如果您在网页浏览器中输入此 URL，您将看到渲染后的`sample.html`文件，如图 1.7 所示。\n\n![截图显示了在浏览器中输入示例 URL 后渲染的输出。输出显示了来自文件\
  \ sample.html 的文本“Hello World! Welcome to My Web Server.”。](img/01fig07.jpg)\n\n\
  **图 1.7** 通过网页浏览器访问的`sample.html`文件。\n\n但是，如果您在文档根目录中创建了一个新目录，并将`sample.html`文件放入该目录，则可以通过以下\
  \ URL 访问该文件：\n\n`http://www.yourdomain.com/newdirectory/sample.html`\n\n如果您将`sample.html`文件放在最初连接到服务器时看到的目录中——也就是说，如果您*没有*切换目录并将文件放在文档根目录中——那么`sample.html`文件将无法通过任何\
  \ URL 从您的网络服务器访问。该文件仍然在您认为是网络服务器的机器上，但由于文件不在文档根目录中（服务器软件知道从哪里开始查找文件），任何人都无法通过网页浏览器访问它。\n\
  \n底线是什么？在开始传输文件之前，始终导航到网络服务器的文档根目录。如果您的 FTP 客户端允许，请将默认起始目录更改为文档根目录，以格外小心。\n\n对于图形和其他多媒体文件尤其如此。网络服务器上一个常见的目录是`images`，顾名思义，所有图像资源都放在那里以供检索。其他常用目录包括用于样式表文件的`css`（如果您使用多个样式表）和用于外部\
  \ JavaScript 文件的`js`。或者，如果您知道您的网站上会有一个区域供访问者下载多种类型的文件，您可以直接将该目录命名为`downloads`。\n\
  \n无论是包含您的艺术作品的 ZIP 文件，还是包含销售数据的 Excel 电子表格，在互联网上发布不仅仅是网页的文件通常很有用。要使非 HTML 文件在网络上可用，只需按照本课前面关于上传的说明，像上传\
  \ HTML 文件*一样*将该文件上传到您的网站。文件上传到网络服务器后，您可以创建一个指向它的链接（您将在第 7 课，“使用外部和内部链接”中学习）。换句话说，您的网络服务器可以提供远不止\
  \ HTML 的内容。\n\n\n\n\n\n以下是您将在后续课程中进一步学习的 HTML 代码示例。以下代码用于一个名为 `artfolio.zip` 的文件，该文件位于您网站的\
  \ `downloads` 目录中，链接文本显示为 `Download my art portfolio!`：\n\n点击此处查看代码图片\n\n```\n<a\
  \ href=\"/downloads/artfolio.zip\">Download my art portfolio!</a>\n```\n\n#### 使用索引页面\n\
  \n提到索引，您可能会想到书籍末尾的部分，它告诉您在哪里查找各种关键词和主题。网站服务器目录中的索引文件也可以起到类似的作用——如果您这样设计的话。事实上，这就是名称的由来。\n\
  \n`index.html` 文件（通常简称为 *索引文件*）是您为希望用户在访问网站特定目录时看到的默认页面所指定的名称。\n\n索引页面的另一个功能是，访问您网站中某个包含索引页面的目录的用户，即使没有明确指定该页面，也会自动跳转到该网站区域（或网站本身）的主页面。\n\
  \n例如，您可以输入以下任意一个 URL，即可访问 Apple 的 iPhone 信息页面：\n\n**[`www.apple.com/iphone/`](http://www.apple.com/iphone/)**\n\
  \n**[`www.apple.com/iphone/index.html`](http://www.apple.com/iphone/index.html)**\n\
  \n如果 `iphone` 目录中没有 `index.html` 页面，结果将取决于 Web 服务器的配置。如果服务器配置为禁止目录浏览，则用户在尝试访问未指定页面名称的\
  \ URL 时会看到“目录列表被拒绝”的消息。但如果服务器配置为允许目录浏览，用户则会看到该目录中的文件列表。\n\n您的托管服务提供商已经确定了这些服务器配置选项。如果您的托管服务提供商允许您通过控制面板修改服务器设置，您可以根据自己的需求更改这些设置，以便服务器按照您的要求响应请求。\n\
  \n索引文件不仅用于子目录，也用于网站的顶级目录（或文档根目录）。您网站的第一个页面——或者称为*主页*、*首页*，无论您如何称呼希望用户在首次访问您的域名时看到的网页内容——都应命名为\
  \ `index.html`，并放置在 Web 服务器的文档根目录中。这样可以确保当用户在浏览器中输入 **http://www.*yourdomain*.com/**\
  \ 时，服务器会返回您希望他们看到的内容（而不是“目录列表被拒绝”或其他意外结果）。\n\n### 在没有 Web 服务器的情况下分发内容\n\n在线发布 HTML\
  \ 和多媒体文件显然是学习 HTML 和创建网页内容的主要原因。然而，在某些情况下，其他形式的发布也可能有用？例如，您可能希望在贸易展上分发 CD-ROM、DVD-ROM\
  \ 或 USB 驱动器，其中包含以网页内容形式设计的营销材料——即通过 Web 浏览器查看的超链接文本，但无需 Web 服务器参与。您可能还想在培训研讨会上为学生提供包含\
  \ HTML 格式教学手册的可移动介质。这只是 HTML 页面在非互联网发布场景中应用的两个例子。\n\n这个过程称为创建*本地*站点；即使没有 Web 服务器参与，这些超文本内容的集合仍然被称为*站点*。*本地*一词的出现是因为您的文件是在本地访问的，而不是远程（通过\
  \ Web 服务器）访问的。\n\n#### 在本地发布内容\n\n假设您需要创建一个要在 USB 驱动器上分发的本地站点。如今，即使是最便宜的 USB 驱动器也能存储大量数据——而基本的超文本文件又非常小——因此您可以在一个小型驱动器上分发整个站点*以及一个功能齐全的\
  \ Web 浏览器*。\n\n注意\n\n在创建和分发本地站点时，分发 Web 浏览器并非必需，但这是一个不错的附加功能。您可以合理地假设用户拥有自己的 Web\
  \ 浏览器，并且会打开目录中的 `index.html` 文件来开始浏览超链接内容。但是，如果您想在 USB 驱动器上分发 Web 浏览器，请访问 [`portableapps.com/`](https://portableapps.com/)\
  \ 并查找 Portable Firefox 或 Portable Chrome。\n\n您可以将 USB 驱动器的目录结构视为 Web 服务器的目录结构。USB\
  \ 驱动器目录结构的顶层可以作为您的文档根目录。或者，如果您同时分发 Web 浏览器和内容，则可能有两个目录——例如，一个名为 `browser`，另一个名为\
  \ `content`。在这种情况下，`content` 目录就是您的文档根目录。在文档根目录内，您可以创建其他子文件夹，用于放置内容和其他多媒体资源。\n\n\
  保持本地站点良好的组织结构与远程网站同样重要，这样可以避免 HTML 文件中出现断开的链接。您将在第 7 课中了解更多关于链接文件的具体细节。\n\n####\
  \ 在博客上发布内容\n\n您可能拥有由第三方托管的博客，例如 WordPress、Tumblr 或 Blogger，因此即使没有专用的 Web 服务器，甚至不了解任何\
  \ HTML，您也已经发布了内容。这些服务除了提供*源代码编辑器*外，还提供*可视化编辑器*，这意味着您可以输入文字并添加演示格式（如粗体、斜体或字体颜色），而无需了解这些操作的\
  \ HTML 代码。当您在这些编辑器中点击“发布”按钮时，内容就会变成实际的 HTML。\n\n然而，通过从这些课程中获得的知识，您的博客写作能力将得到提升，因为您将能够使用源代码编辑器来处理博客文章内容和博客模板，从而对内容的外观和感觉拥有更多控制权。这些操作与您之前学习的创建\
  \ HTML 文件并通过 FTP 上传到自己的专用 Web 服务器的过程不同，但如果我们不指出博客实际上是一种网页发布形式，那将是一种疏忽。\n\n### 测试网页内容的技巧\n\
  \n每当您将文件传输到 Web 服务器或将其放置在可移动介质上以供本地浏览时，都应彻底测试每个页面。以下列表有助于确保您的网页内容按预期运行。请注意，此时您可能对某些术语不熟悉，但在学习这些课程并创建更大项目时，请回头参考此列表：\n\
  \n*   ![图片](img/arrow.jpg) 在传输文件之前，先在本地机器上测试它们，确保链接有效且内容符合您预期的视觉设计。将页面传输到 Web 服务器或可移动设备后，再次全部测试。\n\
  \n*   ![图片](img/arrow.jpg) 尽可能使用多种浏览器和设备进行测试——Chrome、Firefox、Microsoft Edge、Opera\
  \ 和 Safari 是一个不错的列表——并在 Mac 和 Windows 平台以及手机和平板电脑等移动设备上进行测试。如果可能，请检查低分辨率（800 × 600）和高分辨率（1920\
  \ × 1080）下的显示效果。\n\n*   ![图片](img/arrow.jpg) 在开始测试之前，关闭 Web 浏览器中的自动图像加载功能，以便查看没有图形时每个页面的外观。检查您的替代文本，然后重新打开图像加载功能以加载图形，并再次仔细检查页面。\n\
  \n*   ![图片](img/arrow.jpg) 使用浏览器的字体大小设置，以各种字体大小查看每个页面，确保如果用户用自己的字体规格覆盖您的字体设置，您的布局不会崩溃。\n\
  \n\n\n\n\n*   ![Image](img/arrow.jpg) 等待每个页面完全加载完毕，然后一直滚动到底部，确保所有图片都出现在它们应该在的位置。\n\
  *   ![Image](img/arrow.jpg) 记录每个页面的加载时间。使用类似 Google Page Speed ([`developers.google.com/speed/`](https://developers.google.com/speed/))\
  \ 的工具来确保加载速度不会太慢。加载缓慢的页面会让用户感到厌烦，并可能导致你的网站受到搜索引擎的惩罚。\n\n如果你的页面通过了所有这些测试，你就可以放心了：你的网站已经准备好面向公众展示了。\n\
  \n### 总结\n\n本课向你介绍了使用 HTML 标记文本文件以生成网页内容的概念。你了解到 HTML 负责生成结构，CSS 负责创建外观，而 JavaScript\
  \ 则控制页面的行为。你还了解到网页内容不仅仅是“页面”；网页内容还包括图片、音频和视频文件。所有这些内容都存放在网络服务器上——一台通常远离你本地计算机的远程机器。在你的计算机或其他设备上，你使用网络浏览器来请求、检索并最终在屏幕上显示网页内容。\n\
  \n你学习了在选择网络托管服务商时需要考虑的标准。选定网络托管服务商后，你就可以开始使用 FTP 客户端将文件传输到你的网络服务器上，你也学会了如何操作。你还了解了一些关于网络服务器目录结构和文件管理的知识，以及特定服务器目录中\
  \ `index.html` 文件非常重要的用途。此外，你了解到可以通过可移动介质分发网页内容，并学会了如何组织文件和目录，以便在不使用远程网络服务器的情况下查看内容。\n\
  \n最后，你了解到将内容上传到网络服务器后，在多个浏览器中测试你的工作成果的重要性。编写有效且符合标准的 HTML 和 CSS 有助于确保你的网站在所有访客眼中看起来大致相似，但你仍然不应该在没有听取开发团队之外潜在用户反馈的情况下进行设计；当你是一个人的设计团队时，*尤其*需要听取他人的意见！\n\
  \n### 问答\n\n**问：我看过互联网上一些网页的 HTML 源代码，看起来非常难学。我是不是必须像计算机程序员一样思考才能学会这些东西？**\n\n**答：**\
  \ 尽管复杂的 HTML 页面确实看起来令人望而生畏，但学习 HTML 比学习实际的软件编程语言（如 C++ 或 Java）要容易得多。HTML 是一种标记语言，而不是编程语言；你通过标记文本，让浏览器以某种方式渲染文本。它需要一套与开发计算机程序完全不同的思维过程。你完全不需要具备计算机程序员的经验或技能就能成为网页内容作者。\n\
  \n**问：运行你推荐的所有测试所花的时间比创建页面还要长！难道我不能少做点测试吗？**\n\n**答：** 如果你的页面不是为了赚钱或提供重要服务，那么即使它们在某些用户看来很奇怪或偶尔出现错误，可能也不是什么大问题。在这种情况下，只需用几个不同的浏览器测试每个页面，然后就可以收工了。然而，如果你需要展现专业的形象，那么严格的测试是无可替代的。\n\
  \n**问：说真的，谁在乎我如何组织我的网页内容？**\n\n**答：** 信不信由你，网页内容的组织方式确实对搜索引擎和潜在访客很重要。但总的来说，拥有一个有条理的网络服务器目录结构有助于你跟踪那些可能需要频繁更新的内容。例如，如果你有一个专门存放图片或多媒体的目录，你就知道去哪里找要更新的文件——无需在包含其他内容的目录中翻找。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，旨在帮助你巩固对所涵盖内容的理解。\n\n### 测验\n\n**1.** 要生成一个包含一些文本和两张图片的单个网页，你需要在网络服务器上存储多少个文件？\n\
  \n**2.** 浏览器在显示一个包含一些文本和两张图片的网页时，会向服务器发出多少次请求？\n\n**3.** 在选择网络托管服务商时，应该关注哪些特性？\n\
  \n**4.** 你应该用多少个浏览器来测试你的网页？\n\n**5.** 你应该使用什么类型的编辑器来创建网页？\n\n**6.** 通过 FTP 连接到你的网络服务器需要哪三项信息？\n\
  \n**7.** 什么是文档根目录？\n\n**8.** 是否可以将网页发布到 USB 驱动器上？\n\n**9.** `index.html` 文件的用途是什么？\n\
  \n**10.** 你的网站是否必须包含目录结构？\n\n注意\n\n对于那些在本书印刷版或电子版中阅读这些文字的人，提醒一下：如果你访问 **[www.informit.com/register](http://www.informit.com/register)**\
  \ 并注册本书（使用 ISBN 9780672338083），你可以免费获得在线 Web 版的访问权限，该版本不仅包含本书的完整文本，还提供了本测验的交互式版本。\n\
  \n### 答案\n\n**1.** 你需要三个文件：一个用于网页本身（包含文本和 HTML 标记），另外两个分别用于两张图片。\n\n**2.** 会有三次服务器请求：一次用于\
  \ HTML 本身，另外两次分别用于两张图片。\n\n**3.** 关注可靠性、客户服务、网络空间和带宽、域名服务、网站管理附加功能以及价格。\n\n**4.**\
  \ 你应该在尽可能多的浏览器和设备上测试你的网站。\n\n**5.** 你应该使用文本编辑器，例如记事本或 TextEdit。你也可以使用专门用于编写 HTML\
  \ 的编辑器，例如 Komodo Edit 或 Coda。\n\n**6.** 你需要主机名、你的账户用户名和你的账户密码。\n\n**7.** 文档根目录是网络服务器上的顶级目录——即域名后面的斜杠。\n\
  \n**8.** 是的。这被称为本地发布内容。\n\n**9.** `index.html` 文件通常是网络服务器上某个目录的默认文件。它允许用户访问 http://www.*你的域名*.com/*某个目录*/\
  \ 而无需在末尾加上文件名，并且仍然能到达正确的位置。\n\n**10.** 不需要。是否使用目录结构来组织文件完全取决于你，尽管强烈建议使用，因为它可以简化内容维护。\n\
  \n### 练习\n\n*   ![Image](img/arrow1.jpg) 安排好你的网络托管：你是打算通过本地计算机查看文件来学习课程，还是打算使用网络托管服务商？请注意，大多数网络托管服务商会在你购买托管计划的当天就让你上线运行。列出三个可能的托管服务商。\n\
  \n\n\n\n\n*   ![Image](img/arrow1.jpg) 如果你使用的是外部托管服务商，请使用 FTP 客户端在你的网站文档根目录下创建一个子目录。将\
  \ `sample.html` 文件的内容粘贴到另一个名为 `index.html` 的文件中，将 `<title>` 和 `</title>` 标签之间的文本改为新内容，并将\
  \ `<h1>` 和 `</h1>` 标签之间的文本也改为新内容。保存文件并上传到新子目录。使用网页浏览器导航到 Web 服务器上的新目录，确保 `index.html`\
  \ 文件中的内容显示出来。然后，使用 FTP 客户端从远程子目录中删除 `index.html` 文件。再次用浏览器访问该 URL，重新加载页面，观察服务器在没有\
  \ `index.html` 文件时的响应。列举两个 FTP 客户端。\n\n*   ![Image](img/arrow1.jpg) 使用前面练习中创建的同一组文件，将这些文件放到可移动介质设备上——例如\
  \ CD-ROM 或 USB 驱动器。用浏览器导航到示例网站的本地版本，并思考你需要随此可移动介质一起分发的说明，以便其他人能够使用它。\n\n## 第 2 课\n\
  \n## 构建 HTML 文档结构\n\n**本课你将学到：**\n\n*   ![Image](img/arrow.jpg) 如何用 HTML 创建一个简单的网页\n\
  *   ![Image](img/arrow.jpg) 如何包含每个网页都必须有的所有 HTML 标签\n*   ![Image](img/arrow.jpg)\
  \ 如何用段落和换行组织页面\n*   ![Image](img/arrow.jpg) 如何用标题组织内容\n*   ![Image](img/arrow.jpg)\
  \ 如何使用 HTML5 的语义元素\n*   ![Image](img/arrow.jpg) 如何使用语义标签表示页眉和页脚内容\n*   ![Image](img/arrow.jpg)\
  \ 如何使用语义标签表示导航和次要内容\n*   ![Image](img/arrow.jpg) 如何使用语义标签更好地组织正文内容\n\n在第一课中，你已经对创建网页内容并在线上（或本地，如果你还没有托管服务商）查看的过程有了基本了解。在本课中，我们将深入讲解\
  \ HTML 文件中必须出现的各种元素，以便它们在网页浏览器中正确显示。\n\n总的来说，本课总结了 HTML 基础知识，并提供了一些实用技巧，帮助你充分利用作为网页开发者的时间。你将开始更深入地探讨其背后的理论，学习\
  \ HTML5 元素，这些元素能够增强你标记文本中信息的语义（即含义）。我们将仔细研究六个对文档的稳固语义结构至关重要的元素：`<header>`、`<section>`、`<article>`、`<nav>`、`<aside>`\
  \ 和 `<footer>`。\n\n在后续课程中，你会看到这些标签在代码示例中被恰当使用，因此本课确保你在继续学习之前对它们的含义有充分理解。\n\n###\
  \ 准备工作\n\n以下是你在继续本课之前需要完成的事项回顾：\n\n1.  **准备一台电脑。** 我们使用 Mac 电脑来测试示例网页内容并截取本课中的插图，但你可以使用任何\
  \ Windows、Mac 或 Linux/UNIX 机器来创建和查看网页内容。你也可以使用平板电脑或智能手机，但这会更困难。就本课而言，最好使用台式机或笔记本电脑。\n\
  \n2.  **连接互联网。** 无论你使用的是拨号、无线还是宽带连接，对于创建和查看网页内容来说都没有区别，但连接速度越快，整体体验越好。提供互联网连接的互联网服务提供商（ISP）、学校或企业可以帮助你正确设置。此外，许多公共场所如咖啡店、书店和图书馆提供免费无线互联网服务，如果你有支持\
  \ Wi-Fi 的笔记本电脑，可以使用这些服务。\n\n3.  **安装网页浏览器软件。** 这是你的电脑用来检索和显示网页内容所需的软件。正如你在第一课中学到的，最流行的浏览器（按字母顺序排列）是\
  \ Apple Safari、Google Chrome、Microsoft Edge、Mozilla Firefox 和 Opera。建议安装其中多个浏览器，以便进行实验并确保你的内容在所有浏览器中显示一致；你不能假设其他人使用什么浏览器。\n\
  \n4.  **探索！** 使用网页浏览器在互联网上寻找与你想要创建的内容或外观相似的网站。注意哪些页面让你感到沮丧，哪些页面吸引你并让你继续阅读，以及哪些页面让你反复访问。如果某个特定主题让你感兴趣，可以考虑使用流行的搜索引擎如谷歌（[www.google.com](http://www.google.com)）或必应（[www.bing.com](http://www.bing.com)）进行搜索。\n\
  \n**警告**\n\n尽管所有网页浏览器都以大致相同的方式处理和呈现信息，但它们之间存在一些具体差异，这意味着在不同浏览器中显示效果并不总是一致。请务必在多个浏览器中检查你的网页，确保它们看起来合理一致。\n\
  \n对于移动设备来说，这一点更为重要。越来越多的人使用手机和平板电脑等移动设备访问网页，而这些设备上的浏览器可能会以令人惊讶的方式显示你的页面。始终尽可能在不同的设备和屏幕尺寸上测试你的页面，同时也要测试不同的网页浏览器。\n\
  \n**注意**\n\n正如第一课所讨论的，如果你计划将网页内容发布到互联网上（而不是发布到 CD-ROM 或本地内联网），你需要将其传输到一台 24 小时连接到互联网的计算机上。为你提供互联网访问的同一家公司或学校也可能提供网络空间；如果没有，你可能需要向托管服务商付费购买服务。\n\
  \n### 从简单网页开始\n\n在第一课中，你了解到网页只是一个文本文件，通过 HTML 代码进行标记（或包围），这些代码告诉浏览器如何显示文本。要创建这些文本文件，请使用文本编辑器，如记事本（Windows）、TextEdit（Mac）或任何其他推荐的编辑器；不要使用\
  \ WordPad、Microsoft Word 或其他功能齐全的文字处理软件，因为它们会创建与我们用于网页内容的纯文本文件不同类型的文件。\n\n**警告**\n\
  \n我们重申这一点，因为它对结果和学习过程本身都非常重要：不要使用 Microsoft Word 或任何其他兼容 HTML 的文字处理器创建你的第一个 HTML\
  \ 文件；这些程序中的大多数会以奇怪的方式尝试为你重写 HTML，可能会让你完全困惑。当你使用 Microsoft Word 并“另存为”HTML 时也是如此：你可能会得到一个冗长且不符合规范的文件，其中充满了无法通过验证的\
  \ HTML，并且编辑起来会让你头疼。\n\n此外，我们建议你*不要*使用图形化的所见即所得（WYSIWYG）编辑器，例如 Adobe Dreamweaver。在开始学习\
  \ HTML 时，使用简单的文本编辑器会更容易，也更有教育意义。\n\n**注意**\n\n\n\n\n\n正如第一课所述，大多数专业网页开发者会使用专为构建网页和网络应用而设计的网页编辑器。我们偏好使用\
  \ Coda（Mac 版），但 Komodo Edit（[`www.activestate.com/komodo-edit`](https://www.activestate.com/komodo-edit)）是一款免费编辑器，拥有许多编写\
  \ HTML、CSS 和 JavaScript 的实用功能，并且支持 Windows、Mac 和 Linux/UNIX 系统。这两者都是文本编辑器，没有之前“注意”中提到的所见即所得编辑器的缺点。\n\
  \n开始工作前，你应该先准备一些想要放到网页上的文本：\n\n1. 找（或写）几段关于你自己、你的家庭、你的公司、你的垒球队或其他你感兴趣主题的文字。\n2.\
  \ 将这些文本保存为纯文本格式的标准 ASCII 文本。Windows 上的记事本和大多数其他简单文本编辑器会自动将文件保存为纯文本，但如果你使用其他程序，可能需要手动选择此文件类型（在“文件”菜单下选择“另存为”后）。\n\
  \n**注意**\n\n如果你在 Mac 电脑上选择使用 TextEdit，需要进入“偏好设置”对话框，在“新建文稿”面板中选择“纯文本”。同时建议关闭智能复制/粘贴、智能引号和智能破折号，以确保网页文件编写正确。\n\
  \n在本课的学习过程中，你将为文本文件添加 HTML 标记（称为*标签*），从而将其转化为网页内容。\n\n保存包含 HTML 标签的文件时，务必以 `.html`\
  \ 结尾命名。这一点很重要：如果保存文件时忘记在文件名末尾输入 `.html`，大多数文本编辑器会赋予它其他扩展名（如 `.txt`）。如果发生这种情况，当你尝试用浏览器打开文件时可能找不到它；即使找到了，也无法正确显示。换句话说，浏览器期望网页文件具有\
  \ `.html` 扩展名，并且是纯文本格式。\n\n浏览网站时，你可能还会遇到扩展名为 `.htm` 的页面，这也是可接受的扩展名。你可能会在网络上看到其他扩展名，如\
  \ `.jsp`（Java 服务器页面）、`.asp`（微软活动服务器页面）或 `.php`（PHP：超文本预处理器），但这些文件类型使用了服务器端技术，超出了\
  \ HTML 和本课程的范围。不过，这些文件除了编程语言代码外，也包含 HTML。这些文件中的编程代码在服务器端编译，如果你在浏览器中查看源代码，只会看到 HTML\
  \ 输出。如果你查看源文件，很可能会看到编程代码和标记代码的复杂交织。\n\n清单 2.1 展示了一个示例文本，你可以输入并保存以创建一个简单的 HTML 页面。如果你用\
  \ Chrome 打开这个文件，会看到如图 2.1 所示的页面。你创建的每个网页都必须包含 `<!doctype>` 声明，以及 `<html></html>`、`<head></head>`、`<title></title>`\
  \ 和 `<body></body>` 标签对。\n\n![一张截图显示浏览器窗口标题为“第一个网页”，正文部分显示文本。](img/02fig01.jpg)\n\
  \n**图 2.1** 将清单 2.1 中的文本保存为 HTML 文件并用浏览器查看时，只会显示实际的标题和正文文本。\n\n**清单 2.1** `<html>`、`<head>`、`<title>`\
  \ 和 `<body>` 标签\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n\n<html lang=\"en\">\n\n\
    <head>\n\n    <meta charset=\"utf-8\">\n\n    <title> The First Web Page </title>\n\
  \n  </head>\n\n  <body>\n\n    <p>\n\n      In the beginning, Tim created the HyperText\
  \ Markup Language.\n\n      The Internet was without form and void, and text was\
  \ upon the\n\n      face of the monitor and the Hands of Tim were moving over the\n\
  \n      face of the keyboard. And Tim said, Let there be links; and\n\n      there\
  \ were links. And Tim saw that the links were good; and\n\n      Tim separated the\
  \ links from the text. Tim called the links\n\n      Anchors, and the text He called\
  \ Other Stuff. And the whole\n\n      thing together was the first Web Page.\n\n\
      </p>\n\n  </body>\n\n</html>\n```\n\n在[清单 2.1]（以及每个 HTML 页面）中，以 `<` 开头、以 `>`\
  \ 结尾的单词实际上是编码命令。这些编码命令被称为 *HTML 标签*，因为它们“标记”文本片段，并告诉浏览器该文本的类型，从而使浏览器能够正确显示文本。HTML\
  \ 标签可以大写、小写或大小写混合书写。但最佳实践建议标签全部使用小写字母。\n\n文档的第一行是文档类型声明；你*声明*它是 `html`（具体来说是 HTML5），因为\
  \ `html` 是在 `<!doctype>` 标签中用于声明文档为 HTML5 的值。我们这里全部小写，但很多人会写成 `<!DOCTYPE>` 以区别于文档中的实际\
  \ HTML。\n\n### 自己动手试试\n\n#### 创建并查看一个基本网页\n\n在学习[清单 2.1] 中 HTML 标签的含义之前，你可能想先看看我们是如何创建并查看该文档的。请按以下步骤操作：\n\
  \n1. 在 Windows 记事本（或 Mac 上的 TextEdit，或你选择的其他文本编辑器）中输入[清单 2.1] 中的所有文本，包括 HTML 标签。\n\
  2. 选择“文件”>“另存为”。确保选择纯文本（或 ASCII 文本）作为文件类型。\n3. 将文件命名为 `firstpage.html`。\n4. 在硬盘上选择一个文件夹来存放你的网页——记住你选择的文件夹！点击“保存”或“确定”按钮保存文件。\n\
  5. 现在启动你最喜欢的浏览器。（同时保持文本编辑器运行，这样你可以轻松地在查看和编辑页面之间切换。）\n\n    - 在 Microsoft Edge 中，选择“文件”>“打开”并点击“浏览”。如果你使用\
  \ Firefox 或 Safari，选择“文件”>“打开文件”。导航到相应文件夹并选择 `firstpage.html` 文件。某些浏览器和操作系统还允许你将\
  \ `firstpage.html` 文件拖放到浏览器窗口中进行查看。\n\n*瞧！* 你应该会看到[图 2.1] 所示的页面。\n\n如果你已经获得了网站托管账户，此时可以使用\
  \ FTP 将 `firstpage.html` 文件传输到 Web 服务器。事实上，从本课开始，后续操作都假设你已拥有托管服务提供商，并且能够熟练地通过 FTP\
  \ 来回传输文件；如果情况并非如此，你应该在继续之前复习第一课。或者，如果你有意选择在本地处理文件（没有 Web 主机），请准备好根据你的具体需求调整操作说明（例如忽略“传输文件”和“输入\
  \ URL”等指示）。\n\n**注意**\n\n查看存储在自己电脑上的网页时，不需要连接到互联网。默认情况下，每次启动浏览器时它都会尝试连接互联网，这在大多数情况下是合理的。但是，如果你在本地硬盘上离线开发页面，并且不断收到页面未找到的错误，这可能会很麻烦。如果你通过局域网、电缆调制解调器、Wi-Fi\
  \ 或 DSL 拥有持续的网络连接，则此问题无关紧要，因为浏览器永远不会抱怨离线。否则，具体操作取决于你的浏览器类型；请查看浏览器“工具”菜单下的选项。\n\n\
  ### 每个网页必须包含的 HTML 标签\n\n是时候向你揭示 HTML 标签的秘密语言了。当你理解这种语言后，你将拥有远超常人的创造力。别告诉其他人，但其实它真的非常简单。\n\
  \n\n\n\n\n第一行代码是文档类型声明；在 HTML5 中，它简化为：\n\n```\n<!doctype html>\n```\n\n该声明将文档标识为\
  \ HTML5，从而确保浏览器知道预期内容并做好准备，以便以 HTML5 渲染内容。\n\n许多 HTML 标签由两部分组成：一个*开始标签*，用于指示一段文本的起始位置；以及一个*结束标签*，用于指示该段文本的结束位置。结束标签以\
  \ `<` 符号后的 `/`（正斜杠）开头。\n\n另一种标签是*空标签*，其不同之处在于它不包含一对匹配的开始和结束标签。相反，空标签由单个标签组成，以 `<`\
  \ 开头，并可以在 `>` 符号前以 `/` 结尾。虽然在 HTML5 中不再明确要求结尾斜杠，但它有助于与 XHTML 保持兼容：如果你的网站中有大量旧的 XHTML\
  \ 代码，在升级过程中它们不会出错。在本课程中，除非有明确需要，否则我们会在空标签中省略 `/`。\n\n以下是这三种标签的快速总结，以确保你理解各自的作用：\n\
  \n*   ![Image](img/arrow.jpg) *开始标签*是一个 HTML 标签，用于指示 HTML 命令的开始；受该命令影响的文本出现在开始标签之后。开始标签始终以\
  \ `<` 开头，以 `>` 结尾，例如 `<html>`。\n\n*   ![Image](img/arrow.jpg) *结束标签*是一个 HTML 标签，用于指示\
  \ HTML 命令的结束；受该命令影响的文本出现在结束标签之前。结束标签始终以 `</` 开头，以 `>` 结尾，例如 `</html>`。\n\n*   ![Image](img/arrow.jpg)\
  \ *空标签*是一个 HTML 标签，用于发出 HTML 命令，而不在页面中包围任何文本。空标签始终以 `<` 开头，以 `>` 结尾，并且没有结束标签，例如\
  \ `<meta>`。有些设计者会在空标签中添加一个结尾的 `/>`，例如 `<meta />`，但这在 HTML5 中不是必需的。\n\n**注意**\n\n\
  你肯定已经注意到，在清单 2.1 中，`<html>` 标签附带了一些额外的代码。这些代码由语言属性（`lang`）组成，用于指定与标签相关的附加信息。在此例中，它指定\
  \ HTML 中文本的语言为英语。如果你使用其他语言，请将 `en`（代表英语）替换为与你相关的语言标识符。`<meta>` 标签也有一个属性（`charset`），其值为\
  \ `utf-8`。\n\n例如，清单 2.1 中的 `<body>` 标签告诉网页浏览器页面实际正文内容的起始位置，而 `</body>` 则指示其结束位置。`<body>`\
  \ 和 `</body>` 标签之间的所有内容都会显示在浏览器窗口的主要显示区域中，如图 2.1 所示。\n\n浏览器窗口的最顶部（参见图 2.1）显示标题文本，即位于\
  \ `<title>` 和 `</title>` 之间的任何文本。标题文本还会根据你使用的浏览器，在浏览器的书签或收藏夹菜单中标识该页面。为页面提供标题非常重要，这样访问者可以将其正确加入书签以便将来参考；搜索引擎也会使用标题来提供搜索结果链接。\n\
  \n你可以使用标签 `<meta charset=\"utf-8\">` 定义页面使用的字符集。该标签定义了页面将使用的字符集——此处为 UTF-8。在 HTML\
  \ 文档中，此标签应始终紧跟在开头的 `<head>` 标签之后。如果没有它，你的页面可能会容易受到黑客攻击。在本课程中你将创建的大多数网页即使没有这一行也是安全的，但始终包含它是一个好习惯。这样，当你开始创建可能易受攻击的\
  \ Web 应用程序时，就不会忘记它。\n\n你将在创建的每个 HTML 页面中使用 `<body>` 和 `<title>` 标签对，因为每个网页都需要标题和正文文本。你还会使用\
  \ `<html>` 和 `<head>` 标签对，它们是清单 2.1 中显示的其他两个标签。将 `<html>` 放在文档的最开头仅表示该文档是一个网页。末尾的\
  \ `</html>` 表示网页的结束。\n\n**注意**\n\n大多数网页浏览器会尝试显示出现在开始 `<body>` 标签之后的任何内容——即使它位于结束\
  \ `</html>` 标签之后。不要以为将内容放在 `<html>` 标签对之外就能隐藏它。你将在后续课程中学习如何隐藏内容使其不被显示。\n\n在页面内部，有一个头部区域和一个主体区域。每个区域由\
  \ `<head>` 和 `<body>` 标签标识。其理念是，页面头部中的信息以某种方式描述页面，但实际并不由网页浏览器显示。而放置在主体中的信息则由网页浏览器显示。`<head>`\
  \ 标签总是出现在页面 HTML 代码的开头附近，紧跟在开头的 `<html>` 标签之后。\n\n**注意**\n\n你可能会发现创建并保存一个仅包含 `doctype`、字符集以及\
  \ `<html>`、`<head>`、`<title>` 和 `<body>` 的开始和结束标签的极简页面（也称为*骨架*页面或*模板*）非常方便，类似于清单\
  \ 2.1 中的文档。这样，每当你想要制作一个新网页时，就可以打开该文档作为起点，省去每次都要输入所有这些必需标签的麻烦。\n\n用于标识页面标题的 `<title>`\
  \ 标签对出现在页面的头部内，这意味着它被放置在开始 `<head>` 标签之后和结束 `</head>` 标签之前。在接下来的课程中，你将学习一些其他可以放在\
  \ `<head>` 和 `</head>` 之间的高级头部信息，例如用于格式化页面的样式表规则。\n\n清单 2.1 中的 `<p>` 标签包围了一个文本段落。你应该尽可能将文本块放在适当的容器元素中；你将在未来的课程中了解更多关于容器元素的内容。\n\
  \n### 使用段落和换行组织页面\n\n当网页浏览器显示 HTML 页面时，它不会关注行尾或单词之间的空格数量。例如，图 2.2 中诗歌的上方版本在每个单词后显示一个空格，尽管在清单\
  \ 2.2 中输入时并非如此。这是因为 HTML 代码中的多余空白会自动缩减为一个空格。此外，当文本到达浏览器窗口边缘时，它会自动换行到下一行，无论原始 HTML\
  \ 文件中的换行符在哪里。\n\n![屏幕截图显示了一个标题为“The Advertising Agency Song”的浏览器窗口，顶部显示一个段落，下方则被分成两个独立的句子，并带有换行和段落分隔。](img/02fig02.jpg)\n\
  \n**图 2.2** 当清单 2.2 中的 HTML 作为网页查看时，只有存在 `<br>` 和 `<p>` 标签的地方才会出现换行和段落分隔。\n\n**清单\
  \ 2.2** 包含段落和换行的 HTML\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n\n<html lang=\"\
  en\">\n\n  <head>\n\n    <meta charset=\"utf-8\">\n\n    <title>The Advertising\
  \ Agency Song</title>\n\n  </head>\n\n  <body>\n\n    <p>\n\n      When your client's    hopping\
  \ mad,\n\n      put his picture in the ad.\n\n      If he still should    prove\
  \ refractory,\n\n      add a picture of his factory.\n\n    </p>\n\n    <hr>\n\n\
      <p>\n\n      When your client's hopping mad,<br>\n\n      put his picture in\
  \ the ad.\n\n    </p>\n\n    <p>\n\n      If he still should prove refractory,<br>\n\
  \n      add a picture of his factory.\n\n    </p>\n\n  </body>\n\n</html>\n```\n\
  \n\n\n\n\n如果你想控制换行和段落分隔实际出现的位置，必须使用 HTML 标签。当文本被包含在 `<p></p>` 容器标签内时，闭合标签后会被认为有一个换行。在随后的课程中，你将学习如何使用\
  \ CSS 来控制换行的高度。`<br>` 标签则强制在段落内进行换行。与你目前看到的其他标签不同，`<br>` 不需要闭合的 `</br>` 标签；这是前面讨论过的空标签之一。\n\
  \n**注意**\n\n如果空元素不需要闭合斜杠，你可能会问为什么很多人仍然加上它。一个原因是多年来，闭合标签经历了从“不需要”到“需要”再到“不需要（再次）”的变化，许多人习惯于使用虽然有效但不再需要的闭合斜杠。另一个原因是，由于中间那个阶段相对较长，*大量*的代码编辑器、代码生成器和模板都使用了闭合斜杠，因此你经常会看到它的身影。无论你选择哪种写法都无关紧要，因为两种方式都是有效的；只要确保无论你遵循哪种编码风格，都要保持使用的一致性。\n\
  \n代码清单 2.2 和 图 2.2 中的诗歌展示了使用 `<br>` 和 `<p>` 标签来分隔一家广告公司歌曲的行和节。你可能还注意到清单中的 `<hr>`\
  \ 标签，它会在页面上产生一条水平线（在设计术语中称为“rule”）（参考 图 2.2）。使用 `<hr>` 标签插入水平线也会导致换行，即使你没有随之包含 `<br>`\
  \ 标签。与 `<br>` 一样，`<hr>` 水平线标签是一个空标签，因此永远不需要闭合的 `</hr>` 标签。\n\n**注意**\n\n在 HTML5\
  \ 中，段落不再要求包含闭合的 `</p>` 标签。闭合标签会根据另一个起始 `<p>` 标签或其他块级元素的出现而自动推断。但就像空标签中的闭合斜杠一样，许多人仍然倾向于在段落中包含闭合的\
  \ `</p>`。无论你选择哪种方式编写段落都无关紧要，因为两种方式都是有效的。在这些课程中，我们闭合段落是为了在 HTML 中有一个视觉提醒，标明任何应用的样式应该在哪里结束。\n\
  \n## 动手试一试\n\n### 在 HTML 中格式化文本\n\n尝试将一段文本格式化为标准的 HTML：\n\n1. 在文本开头添加 `<html><head><meta\
  \ charset=\"utf-8\"><title>`My Title`</title></head><body>`（使用你自己的页面标题代替 `My Title`）。同时在页面顶部包含文档类型声明，以满足标准\
  \ HTML 的要求。\n\n2. 在文本的最末尾添加 `</body></html>`。\n\n3. 在每个段落的开头添加 `<p>` 标签，在每个段落的末尾添加\
  \ `</p>` 标签。\n\n4. 在任何你想要单倍行距换行的地方使用 `<br>` 标签。\n\n5. 使用 `<hr>` 来绘制水平线，以分隔文本的主要部分，或在任何你想在页面上看到横线的地方使用。\n\
  \n6. 将文件保存为 `mypage.html`（使用你自己的文件名代替 `mypage`）。\n\n**警告**\n\n如果你使用文字处理器（如 Word）来创建网页，请务必将\
  \ HTML 文件保存为纯文本或 ASCII 格式。但正如我们多次强调的那样，你应该使用文本编辑器（如 Notepad 或 TextEdit）或网页编辑器（如\
  \ Komodo Edit 或 Coda）。\n\n7. 在浏览器中打开文件以查看你的网页内容。（如果你有 Web 托管账户，可以通过 FTP 将文件发送到账户中。）\n\
  \n8. 如果某些地方看起来不对，请返回文本编辑器进行修正并再次保存文件（如果适用，将其发送到 Web 托管账户）。点击浏览器的“重新加载/刷新”以查看你所做的更改。\n\
  \n### 使用标题组织内容\n\n当你在互联网上浏览网页时，你会注意到许多网页顶部都有一个标题，它看起来比其余文本更大、更粗。代码清单 2.3 是一个简单网页的示例代码和文本，其中包含了一个标题与普通段落文本的对比示例。位于\
  \ `<h1>` 和 `</h1>` 标签之间的任何文本都将显示为大标题。此外，`<h2>`、`<h3>` 等，一直到 `<h6>`，会产生逐渐变小的标题。\n\
  \n**代码清单 2.3** 标题标签\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html lang=\"en\"\
  >\n  <head>\n    <meta charset=\"utf-8\">\n    <title>My Widgets</title>\n  </head>\n\
  \  <body>\n    <h1>My Widgets</h1>\n    <p>My widgets are the best in the land.\
  \ Continue reading to\n    learn more about my widgets.</p>\n    <h2>Widget Features</h2>\n\
  \    <p>If I had any features to discuss,  you can bet I'd do\n    it here.</p>\n\
  \    <h3>Pricing</h3>\n    <p>Here, I would talk about my widget pricing.</p>\n\
  \    <h3>Comparisons</h3>\n    <p>Here, I would talk about how my widgets compare\
  \ to my\n    competitor's widgets.</p>\n  </body>\n</html>\n```\n\n**注意**\n\n到目前为止，你可能已经注意到，HTML\
  \ 代码通常由作者进行缩进，以揭示 HTML 文档不同部分之间的关系，同时也为了方便阅读。这种缩进完全是可选的；你完全可以将所有标签紧凑地写在一起，不留空格或换行，在浏览器中查看时它们仍然显示正常。你经常会在为了速度而优化过的页面上看到这种压缩风格。缩进是为了你和其他人类编辑，以便你能快速查看满页的代码并理解它是如何组合在一起的。缩进代码是另一个良好的网页设计习惯，最终会让你的页面更容易维护，无论对你自己还是对任何接手你工作的人来说都是如此。\n\
  \n正如你在 图 2.3 中所看到的，创建标题的 HTML 极其简单。在这个例子中，“My Widgets”这句话使用 `<h1>` 标签突出显示。要创建第一个（一级）标题，只需在你想用作标题的文本开头放置一个\
  \ `<h1>` 标签，在末尾放置一个 `</h1>` 标签。对于二级标题（用于重要性低于标题的信息），请在文本周围使用 `<h2>` 和 `</h2>` 标签。对于比二级标题更不突出的内容，请在文本周围使用\
  \ `<h3>` 和 `</h3>` 标签。\n\n![截图显示了标题层级的用法。顶部的标题是一级标题，代表页面的标题。页面中的其他三个标题是二级标题，代表它们是章节标题。](img/02fig03.jpg)\n\
  \n**图 2.3** 使用三个级别的标题展示了此示例产品页面的内容层级。\n\n**注意**\n\n大多数人从标题标签的大小来思考：一级标题比二级大，二级比三级大，依此类推。但更好的思考方式是将它们视为页面的大纲。一级标题定义整个页面。二级标题定义页面内的章节。三级标题定义二级章节内的区域。你还可以使用四级、五级和六级标题进一步深化。它们分别使用\
  \ `<h4>`、`<h5>` 和 `<h6>` 标签。通过思考 HTML 代表什么，而不仅仅是它在页面上看起来像什么，你将能够准备好使用 CSS 将它们变成任何你想要的样子。在随后的课程中，你将学习如何恰好为此目的而使用\
  \ CSS。\n\n\n\n\n\n然而，请记住，你的标题应遵循内容层级结构：只使用一个一级标题，在一级标题之后使用一个（或多个）二级标题，在二级标题之后直接使用三级标题，以此类推。不要为了以某种方式显示内容而随意给内容分配标题。相反，要确保你恰当地对内容进行分类（作为主标题、副标题等），同时使用显示样式让文本在网页浏览器中以特定方式呈现。\n\
  \n理论上，你也可以使用 `<h4>`、`<h5>` 和 `<h6>` 标签来创建重要性递减的标题，但这些标签并不常用。网页浏览器通常不会在这些标题与 `<h3>`\
  \ 标题之间显示出显著差异——尽管你可以通过自己的 CSS 来控制——而且内容通常不会以需要六级标题来展示层级结构的方式呈现。\n\n记住 *标题（title）*\
  \ 和 *标题（heading）* 之间的区别很重要。在日常英语中，这两个词经常可以互换使用，但在谈论 HTML 时，`<title>` 为整个页面提供一个标识名称，该名称不会显示在页面本身，而只显示在浏览器窗口的标题栏、书签以及有时在搜索引擎结果中。另一方面，标题标签（heading\
  \ tags）会显示在页面上，并且通常具有某种超出 CSS 的视觉强调效果。每个页面只能有一个 `<title>`，并且它必须出现在 `<head>` 和 `</head>`\
  \ 标签之间；而你可以根据需要任意使用任意数量的 `<h1>`、`<h2>` 和 `<h3>` 标题，顺序也可以随意。然而，正如我们之前提到的，你应该使用标题标签来严格控制内容层级结构；不要将标题用作实现特定外观的手段，因为那是\
  \ CSS 的职责。HTML 标签定义内容 *是什么*，而不是它看起来如何。\n\n### 注意\n\n不要忘记，放置在网页头部（head）中的任何内容都不打算在页面上显示，而页面主体（body）中的所有内容\
  \ *都是* 为了显示而设计的。\n\n## 窥探其他设计师的页面\n\n鉴于许多流行网页中存在的视觉（有时是音频）效果，你可能已经意识到本课中描述的简单页面只是\
  \ HTML 冰山的一角。既然你已经掌握了基础知识，你可能会惊讶地发现，仅仅通过查看互联网上其他人的页面，你就能掌握其余的大部分内容。你可以在任何网页浏览器中右键单击并选择“查看源代码”来查看任何页面的\
  \ HTML。\n\n如果你还不能完全理解某些 HTML 标签的作用或如何自己使用它们，不必担心。你将在后续课程中了解所有这些内容。不过，现在提前预览一下，你会看到你已经认识的标签在实际中的应用，并初步了解你很快就能用你的网页做什么。\n\
  \n### 理解语义元素\n\nHTML5 包含一些标签，使你能够描述标记文本中提供的信息的语义（即含义）。现代 HTML 的目标之一是将呈现、含义和行为分离，而不是像早期那样简单地将\
  \ HTML 用作呈现语言（当时 `<b>` 表示粗体、`<i>` 表示斜体是常态）。在使用 CSS 提供呈现指南的同时，HTML 的编写者可以在其标记中为各个元素提供有意义的名称——不仅通过使用\
  \ ID 和类名（你将在后续课程中学习），还通过使用语义元素。\n\nHTML5 中可用的一些语义元素如下：\n\n*   ![图片](img/arrow.jpg)\
  \ `<header></header>`——这可能看起来违反直觉，但你可以在单个页面中使用多个 `<header>` 标签。`<header>` 标签应作为介绍性信息的容器，因此它可能只在页面中出现一次（很可能在顶部）——但如果你的页面内容被分成多个部分，你也可能多次使用它。任何容器元素都可以有一个\
  \ `<header>` 元素；只需确保你用它来包含关于其所在元素的介绍性信息。\n\n*   ![图片](img/arrow.jpg) `<footer></footer>`——`<footer>`\
  \ 标签用于包含关于其所在元素（页面或部分）的附加信息，例如版权和作者信息，或相关资源的链接。与 `<header>` 标签一样，你可以在页面的任何部分以及整个页面中定义页脚。\n\
  \n*   ![图片](img/arrow.jpg) `<nav></nav>`——如果你的网站有导航元素，例如指向网站内其他部分甚至页面本身的链接，这些链接应放在\
  \ `<nav>` 标签中。`<nav>` 标签通常出现在第一个 `<header>` 标签实例中，仅仅是因为人们倾向于将导航放在顶部并将其视为介绍性信息，但这并非强制要求。你可以将\
  \ `<nav>` 元素放在任何地方（只要它包含导航），并且可以根据需要在页面上放置任意多个。\n\n*   ![图片](img/arrow.jpg) `<section></section>`——`<section>`\
  \ 标签包含任何主题相关的内容；它还可以包含一个 `<header>` 标签用于介绍性信息，以及可能一个 `<footer>` 标签用于其他相关信息。你可以将\
  \ `<section>` 视为比标准的 `<p>`（段落）或 `<div>`（分区）标签具有更多含义，后者通常不传达任何含义；使用 `<section>` 传达了它所包含的内容元素之间的关系。\n\
  \n*   ![图片](img/arrow.jpg) `<article></article>`——`<article>` 标签类似于 `<section>`\
  \ 标签，它可以包含 `<header>`、`<footer>` 以及其他容器元素，如段落和分区。但 `<article>` 标签带来的额外含义是，它就像报纸或其他出版物中的文章。将此标签用于博客文章、新闻文章、评论以及其他符合此描述的内容。`<article>`\
  \ 和 `<section>` 的一个关键区别在于，`<article>` 是一个独立的工作单元，而 `<section>` 是信息的主题分组。\n\n*  \
  \ ![图片](img/arrow.jpg) `<aside></aside>`——使用 `<aside>` 标签表示次要信息；如果 `<aside>` 标签位于\
  \ `<section>` 或 `<article>` 内，则其关系将针对这些容器；否则，次要关系将针对整个页面或网站本身。将 `<aside>` 视为侧边栏可能更容易理解——无论是针对页面上的所有内容，还是针对一篇文章或其他主题信息容器。\n\
  \n这些语义元素会随着你练习使用它们而变得更加清晰。总的来说，使用语义元素是一个好主意，因为它们不仅为你和其他阅读并处理你标记的设计师和程序员提供了额外的含义，也为机器提供了含义。网页浏览器和屏幕阅读器会通过使用这些元素来确定文档的结构，从而对你的语义元素做出响应；屏幕阅读器会向用户报告更深层的含义，从而提高你材料的可访问性。但在大多数情况下，浏览器不会改变语义元素在页面上的显示方式。正如我们之前提到的，这是设计的一部分，由\
  \ CSS 控制。\n\n理解 HTML5 语义元素的最佳方法之一是观察它们的实际应用，但当这些元素的主要目的是提供 *含义* 而非设计时，这可能会有点困难。这并不是说你不能为这些元素添加设计；你当然可以，并且将在后续课程中这样做。但语义元素的“作用”是容纳内容并通过这样做提供含义，如\
  \ 图 2.4 所示，该图展示了一个基本网页中语义元素的常见用法。\n\n\n\n\n\n![一张图展示了网页中的语义元素。](img/02fig04.jpg)\n\
  \n**图 2.4** 展示网页中的基本语义元素。\n\n起初，你可能会想：“*当然*，这完全说得通，页眉在顶部，页脚在底部”，并且为自己一眼就能理解语义元素而感到相当满意——你确实应该如此！但再看一眼，就会引发一些问题：如果你希望导航栏在页眉下方水平排列怎么办？侧边栏（aside）必须（字面上）放在侧面吗？如果你不想要任何侧边栏呢？为什么在主体部分内部又使用了`<header>`和`<footer>`？这还只是其中几个问题！你可能会问的另一个问题是`<article>`元素放在哪里；它在这个例子中没有显示，但却是本课的一部分。\n\
  \n这时，对页面进行概念化——特别是你*想要*创建的页面——就派上用场了。如果你理解了你想要标记的内容，并且明白你可以使用任意、全部或完全不使用语义元素，仍然可以创建一个有效的\
  \ HTML 文档，那么你就可以开始以对你和你的内容（希望也对你的读者）最有意义的方式来组织页面内容。\n\n注意\n\n虽然你不需要使用语义元素来创建有效的\
  \ HTML 文档，但建议至少使用一组最小的语义元素，以便网页浏览器和屏幕阅读器能够确定文档的结构。屏幕阅读器能够向用户传达更深层的含义，从而提高材料的可访问性。\n\
  \n（如果这条注释是用 HTML 文档标记的，它会使用`<aside>`元素。）\n\n让我们先看看图 2.4 中使用的元素，然后再看第二个例子，并深入探讨各个元素本身。在图\
  \ 2.4 中，你看到页面顶部有一个`<header>`，底部有一个`<footer>`——正如已经提到的，这很直观。页面左侧使用`<nav>`元素，这与导航的常见显示区域相匹配；页面右侧使用`<aside>`元素，这与次要注释、引用、辅助文本以及关于内容的“更多信息”链接的常见显示区域相匹配。在图\
  \ 2.5 中，你会看到其中一些元素的位置发生了变化，所以不用担心；图 2.4 并不是语义标记的不可变示例。\n\n![一张图展示了嵌套元素的添加。](img/02fig05.jpg)\n\
  \n**图 2.5** 使用嵌套的语义元素为内容添加更多含义。\n\n在图 2.5 中，你可能会惊讶地看到`<section>`元素内部出现了`<header>`和`<footer>`。在图\
  \ 2.4 中，你看到页面顶部有一个`<header>`，底部有一个`<footer>`——正如已经提到的，这很直观。页面左侧使用`<nav>`元素，与它后面的内容相匹配，而`<header>`元素本身并不表示文档大纲中的任何层级。因此，你可以根据需要任意使用多个`<header>`元素来恰当地标记内容；页面开头的`<header>`可能包含整个页面的介绍信息，而`<section>`元素内部的`<header>`元素同样可以恰当地包含其内部内容的介绍信息。本例中多次出现的`<footer>`元素也是如此。\n\
  \n接下来我们看图 2.5，它移动了`<nav>`元素的位置，并引入了`<article>`元素的使用。\n\n在图 2.5 中，页面开头的`<header>`和`<nav>`元素以及页面底部的`<footer>`元素对你来说应该完全合理。而且，虽然我们还没有讨论`<article>`元素，但如果你把它看作一个容器元素，它包含多个区块（甚至使用了`<section>`标签！），每个区块都有自己的标题，那么图中中间部分的语义元素块也应该说得通了。\n\
  \n如你所见，概念化页面内容并没有唯一的方法；然而，你应该能够对每个单独页面的内容进行概念化。\n\n如果你按照图 2.5 所示的结构标记一些内容，它可能看起来像代码清单\
  \ 2.4 中的标记。\n\n**代码清单 2.4** 基本内容的语义标记\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>语义示例</title>\n\
    </head>\n  <body>\n    <header>\n       <h1>站点或页面徽标放在此处</h1>\n    </header>\n\
      <nav>\n       站点或页面导航放在此处。\n    </nav>\n    <article>\n       <header>\n          <h2>文章标题</h2>\n\
         </header>\n       <section>\n          <header>\n             <h3>第 1 节标题</h3>\n\
            </header>\n          <p>第 1 节内容在此。</p>\n       </section>\n       <section>\n\
            <header>\n             <h3>第 2 节标题</h3>\n          </header>\n          <p>第\
  \ 2 节内容在此。</p>\n       </section>\n       <footer>\n          <p>文章页脚放在此处。</p>\n\
         </footer>\n    </article>\n    <footer>\n       站点或页面页脚放在此处\n    </footer>\n\
    </body>\n</html>\n```\n\n如果你在网页浏览器中打开这个 HTML 文档，你会看到类似图 2.6 所示的内容——一个完全没有样式的文档，但它具有语义含义（即使没有人能“看到”它）。\n\
  \n![一张截图显示了示例输出窗口。](img/02fig06.jpg)\n\n**图 2.6** 代码清单 2.4 的输出。\n\n没有可见的样式并不意味着含义丢失了；正如本节前面所述，机器可以解释通过语义元素提供的文档结构。你可以在图\
  \ 2.7 中看到这个基本文档的大纲，它显示了该文件经过 HTML5 大纲工具（可从[`gsnedders.html5.org/outliner/`](http://gsnedders.html5.org/outliner/)获取）检查后的输出。\n\
  \n![一张截图显示了使用 HTML 大纲工具后渲染的输出。](img/02fig07.jpg)\n\n**图 2.7** 该文档的大纲遵循语义标记。\n\n\
  注意\n\n使用 HTML5 大纲工具是检查你是否正确创建了页眉、页脚和区块的好方法；如果你检查文档时发现任何地方出现“未命名的区块”，并且这些未命名的区块与`<nav>`或`<aside>`元素（这些元素对包含标题的要求更宽松）不匹配，那么你还需要做一些额外的工作。\n\
  \n现在你已经看到了一些概念化文档中信息的示例，你已经准备好开始标记这些文档了。接下来的部分将逐一介绍这些语义元素。\n\n### 以多种方式使用`<header>`\n\
  \n在最基本的层面上，`<header>`元素包含介绍性信息。这些信息可能以实际的`<h1>`（或其他级别）元素的形式出现，也可能只是包含在`<p>`或`<div>`元素中的徽标图像或文本。内容的*含义*本质上应该是介绍性的，这样才能将其包含在`<header></header>`标签对中。\n\
  \n注意\n\n`<header>`元素中的信息不一定必须出现在它所介绍的区块的最前面。这是最常见的位置，但它可以显示在页面中任何合理的位置。显示位置由 CSS\
  \ 定义。\n\n\n\n\n正如你在本课到目前为止的示例中所看到的，`<header>` 元素通常放置在页面开头。当以这种方式使用时，包含 logo 或 `<h1>`\
  \ 级别的标题是合理的，例如：\n\n点击此处查看代码图片\n\n```\n<header>\n\n     <img src=\"acmewidgets.jpg\"\
  \ alt=\"ACME Widgets LLC\">\n\n</header>\n```\n\n甚至这样：\n\n点击此处查看代码图片\n\n```\n<header>\n\
  \n     <img src=\"acmewidgets.jpg\" alt=\"ACME Widgets LLC\">\n\n    <h1>最好的小部件在这里制造！</h1>\n\
  \n</header>\n```\n\n这两个代码片段都是 `<header>` 的有效用法，因为它们包含的信息是对整个页面的介绍。\n\n正如你在本课中也看到的，你并不局限于只能使用一个\
  \ `<header>`。只要 `<header>` 元素充当介绍性信息的容器，你就可以随意使用它们。清单 2.4 展示了在 `<article>` 内的多个\
  \ `<section>` 元素中使用 `<header>` 元素的情况，这是该元素完全有效的用法：\n\n点击此处查看代码图片\n\n```\n<section>\n\
  \n   <header>\n\n      <h3>第 1 节标题</h3>\n\n   </header>\n\n   <p>第 1 节内容在此。</p>\n\
  \n</section>\n\n<section>\n\n   <header>\n\n      <h3>第 2 节标题</h3>\n\n   </header>\n\
  \n   <p>第 2 节内容在此。</p>\n\n</section>\n```\n\n`<header>` 元素可以包含流内容类别（HTML5 内容模型之一）中的任何其他元素，它本身也属于该类别。这意味着，如果你愿意，`<header>`\
  \ *可以*包含一个 `<section>` 元素，并且这将是完全有效的标记。然而，在构思内容时，在动手之前，请先考虑这种嵌套是否有意义。\n\n注意\n\n\
  通常，*流内容*元素是包含文本、图像或其他多媒体嵌入内容的元素；HTML 元素属于多个类别。\n\n如果你想了解更多关于元素按内容模型分类的信息，请参见 [`www.w3.org/TR/2011/WD-html5-20110525/content-models.html`](http://www.w3.org/TR/2011/WD-html5-20110525/content-models.html)。\n\
  \n`<header>` 允许内容的唯一例外是：`<header>` 元素不能包含*其他* `<header>` 元素，也不能包含 `<footer>` 元素。同样，`<header>`\
  \ 元素也不能包含在 `<address>` 或 `<footer>` 元素中。\n\n### 理解 `<section>` 元素\n\n`<section>`\
  \ 元素有一个简单的定义：它是“文档中的一个通用章节”，也是“内容的主题分组，通常带有标题”。这听起来很简单，对你来说可能也是如此。所以，当你发现如果在搜索引擎中输入\
  \ **HTML5 中 section 和 article 的区别**，会找到成千上万条讨论它们区别的条目时，你可能会感到惊讶，因为定义总是让人困惑。我们先讨论\
  \ `<section>` 元素，然后介绍 `<article>` 元素——希望能避免那些似乎困扰着新网页开发者的误解。\n\n在清单 2.4 中，你看到了一个在\
  \ `<article>` 中使用 `<section>` 的简单示例（此处重复）；在这个示例中，你可以很容易地想象 `<section>` 元素包含“内容的主题分组”，这一点从它们各自都有标题可以看出：\n\
  \n点击此处查看代码图片\n\n```\n<article>\n\n    <header>\n\n       <h2>文章标题</h2>\n\n    </header>\n\
  \n    <section>\n\n       <header>\n\n          <h3>第 1 节标题</h3>\n\n       </header>\n\
  \n       <p>第 1 节内容在此。</p>\n\n    </section>\n\n    <section>\n\n       <header>\n\
  \n          <h3>第 2 节标题</h3>\n\n       </header>\n\n       <p>第 2 节内容在此。</p>\n\n\
      </section>\n\n    <footer>\n\n       <p>文章页脚在此。</p>\n\n    </footer>\n\n</article>\n\
  ```\n\n但下面是一个完全有效的 `<section>` 用法示例，其中没有出现 `<article>` 元素：\n\n点击此处查看代码图片\n\n```\n\
  <section>\n\n    <header>\n\n       <h1>超级标题</h1>\n\n    </header>\n\n    <p>超级内容！</p>\n\
  \n</section>\n```\n\n那么开发者该怎么做呢？假设你有一些通用内容，你想将其分成带有各自标题的章节。在这种情况下，使用 `<section>`。如果你只需要*视觉上*划分内容块（例如使用段落分隔），而这些内容块不需要额外的标题，那么\
  \ `<section>` 不适合你；请改用 `<p>` 或 `<div>`。\n\n由于 `<section>` 元素可以包含任何其他流内容元素，并且可以包含在任何其他流内容元素中（`<address>`\
  \ 元素除外），因此很容易理解为什么在没有其他限制且只有通用使用指南的情况下，`<section>` 元素有时会被误解。\n\n### 使用 `<article>`\n\
  \n我们认为，关于使用 `<section>` 与 `<article>` 的许多误解与 `<article>` 元素的名称有关。当我们想到文章时，我们通常会想到报纸或杂志中的文章。我们不会自然而然地想到“任何独立的工作主体”，而这正是\
  \ `<article>` 元素通常的定义方式。HTML5 推荐规范将其定义为“文档、页面、应用程序或站点中完整或自成一体的作品，原则上可独立分发或重用”，例如“论坛帖子、杂志或报纸文章、博客条目、用户提交的评论、交互式小部件或\
  \ gadget，或任何其他独立的内容项”。\n\n换句话说，`<article>` 元素可用于包含网站的整个页面（无论它是否是出版物中的文章）、出版物中的实际文章、任何地方的博客文章、论坛中讨论线程的一部分、博客文章的评论，或者作为显示你所在城市当前天气的容器。难怪搜索“HTML5\
  \ 中 section 和 article 的区别”会有成千上万条结果。\n\n当你试图弄清楚何时使用 `<article>` 以及何时使用 `<section>`\
  \ 时，一个好的经验法则是回答以下问题：这个内容本身是否有意义？如果是，那么无论这个内容对你来说是什么（例如，一个静态网页，而不是《纽约时报》的一篇文章），都从使用\
  \ `<article>` 元素开始。如果你发现自己需要将其分解，那么就在 `<section>` 元素中进行分解。如果你发现你的“文章”实际上是更大整体的一部分，那么将\
  \ `<article>` 标签改为 `<section>` 标签，找到文档的开头，并从那里开始用更合适的 `<article>` 标签在更高层级包围它。\n\n\
  ### 实现 `<nav>` 元素\n\n`<nav>` 元素看起来很简单（`<nav>` 暗示*导航*），它确实很简单——但经常被错误使用。在本节中，你将学习一些基本用法，以及一些需要避免的错误用法。如果你的网站有任何导航元素，无论是全站导航还是长页面内容中的导航，你都有使用\
  \ `<nav>` 元素的合理理由。\n\n对于全站导航，你通常会在主要的 `<header>` 元素中找到 `<nav>` 元素。如果你希望导航内容具有介绍性（并且在模板中无处不在），你可以很容易地论证主要的\
  \ `<nav>` 元素应该出现在主要的 `<header>` 中，尽管你并不需要将其放在那里。更重要的是你的 HTML 要有效（就像 `<nav>` 放在 `<header>`\
  \ 外部一样），而不是你的 `<header>` 元素包含所有允许的内容。`<nav>` 元素可以出现在任何流内容中，也可以包含任何流内容。\n\n以下代码片段显示了网站的主要导航链接，放置在\
  \ `<header>` 元素中：\n\n\n\n\n\n点击此处查看代码图片\n\n```\n<header>\n\n   <img src=\"acmewidgets.jpg\"\
  \ alt=\"ACME Widgets LLC\">\n\n   <h1>最好的小部件在这里制造！</h1>\n\n   <nav>\n\n      <ul>\n\
  \n         <li><a href=\"#\">关于我们</a></li>\n\n         <li><a href=\"#\">产品</a></li>\n\
  \n         <li><a href=\"#\">支持</a></li>\n\n         <li><a href=\"#\">新闻</a></li>\n\
  \n      </ul>\n\n   </nav>\n\n</header>\n```\n\n在文档中，你并不局限于只能使用一个 `<nav>` 元素，这对于创建包含主导航和次导航的模板的网站开发者来说非常有用。例如，你可能会在页面顶部看到水平的主导航（通常包含在\
  \ `<header>` 元素内），然后在页面左侧列看到垂直的次导航，代表主区域内的次级页面。在这种情况下，你只需使用第二个 `<nav>` 元素，不包含在 `<header>`\
  \ 内，并通过不同的位置和样式，在语义和视觉上区分这两种导航类型。\n\n请记住，`<nav>` 元素用于*主要*的导航内容；主导航和次导航都算在内，也包括页面内的目录。为了合理且有效地使用\
  \ `<nav>` 元素的语义，不要简单地将它应用于每个允许用户导航到任何地方的链接。注意，我们说的是“合理且有效”的语义使用，不一定是“有效”的使用；确实，你可以将\
  \ `<nav>` 应用于任何链接列表，根据 HTML 规范这是有效的，因为链接是流内容。但将 `<nav>` 元素包裹在社交媒体分享工具的链接列表周围，并不会增加准确或有用的含义，因此并不特别*有用*。\n\
  \n### 何时使用 `<aside>`\n\n根据本课程中大量的注释和侧边栏，你可能已经猜到，我们非常喜欢那些最适合用 `<aside>` 元素标记的内容类型。`<aside>`\
  \ 元素旨在包含与周围内容有间接关联的任何内容——额外解释、相关资源链接、引用块、辅助文本等。你可以将 `<aside>` 元素视为侧边栏，但注意不要仅仅将其视为*视觉上*的侧边栏或页面一侧的列，用于随意放置任何你想要的东西，无论它是否与当前内容或网站相关。\n\
  \n在图 2.8 中，你可以看到 `<aside>` 中的内容如何用于创建*引用块*，即专门提取出来以引起注意的内容摘录。在这种情况下，`<aside>` 用于突出显示文本的重要部分，但它也可以用于定义术语或链接到相关文档。\n\
  \n![截图显示了“Pullquote”文件的输出。页面主体有三段文本。第三段右侧显示了一个包含一小段文本的方框。](img/02fig08.jpg)\n\n\
  **图 2.8** 使用 `<aside>` 创建有意义的引用块。\n\n在决定是否使用 `<aside>` 元素时，请思考你想要添加的内容。它是否与 `<aside>`\
  \ 所在的内容直接相关，但对理解内容并非绝对关键，例如文章中使用的术语定义或文章的相关链接列表？如果你的答案是肯定的，那就太好了！尽情使用 `<aside>`\
  \ 吧。如果你考虑在包含大量内容的容器元素外部放置一个 `<aside>`，请确保 `<aside>` 的内容与你的网站整体合理相关，并且你不是仅仅为了视觉效果而使用\
  \ `<aside>` 元素。\n\n### 有效使用 `<footer>`\n\n与 `<header>` 元素相对应，`<footer>` 元素包含其所在元素的附加信息。`<footer>`\
  \ 元素最常见的用途是在页面底部包含版权信息，如下所示：\n\n点击此处查看代码图片\n\n```\n<footer>\n\n   <p>&copy; 2014\
  \ Acme Widgets, LLC. 保留所有权利。</p>\n\n</footer>\n```\n\n与 `<header>` 元素类似，`<footer>`\
  \ 元素可以包含流内容类别中的任何其他元素（它本身也属于该类别），但*其他* `<footer>` 或 `<header>` 元素除外。此外，`<footer>`\
  \ 元素不能包含在 `<address>` 元素内，但 `<footer>` 元素可以包含 `<address>` 元素；实际上，`<footer>` 元素是\
  \ `<address>` 元素常见的放置位置。\n\n将有用的 `<address>` 内容放置在 `<footer>` 元素内是 `<footer>` 元素最有效的用途之一（更不用说\
  \ `<address>` 元素了），因为它提供了关于页面或页面部分的特定上下文信息。以下代码片段展示了 `<footer>` 内使用 `<address>`\
  \ 的示例：\n\n点击此处查看代码图片\n\n```\n<footer>\n\n   <p>&copy; 2014-2018 Acme Widgets, LLC.\
  \ 保留所有权利。</p>\n\n   <p>版权问题？请联系：</p>\n\n      <address>\n\n      我们的律师<br>\n\n      主街\
  \ 123 号<br>\n\n      某市，CA 95128<br>\n\n      <a href=\"mailto:lawyer@richperson.com\"\
  >lawyer@richperson.com</a>\n\n      </address>\n\n</footer>\n```\n\n与 `<header>`\
  \ 元素一样，你并不局限于只能使用一个 `<footer>`，而且这些元素不必都显示在其所修饰的内容下方。你可以根据需要任意使用多个 `<footer>` 元素，只要它们是包含其所在元素附加信息的容器。清单\
  \ 2.4 展示了同时为页面和 `<article>` 使用 `<footer>` 元素的示例，两者都是有效的。\n\n### 总结\n\n本课程介绍了网页的基本概念及其工作原理。你了解到编码后的\
  \ HTML 命令包含在文本文件中，并且自己输入 HTML 文本比使用图形编辑器生成 HTML 命令更好——尤其是在学习 HTML 时。\n\n你学习了最基本和最重要的\
  \ HTML 标签。通过将这些编码命令添加到任何纯文本文档中，你可以快速将其转换为真正的网页。你了解到创建网页的第一步是在文档的开头和结尾放置一些必需的 HTML\
  \ 标签，包括添加页面标题。然后你可以标记段落和行的结束位置，并根据需要添加水平线和标题。你还初步了解了 HTML5 中的一些语义标签，这些标签通过划分页面内容的类型（不仅仅是内容本身）来提供额外的含义。表\
  \ 2.1 总结了本课程介绍的所有标签。\n\n**表 2.1** 第 2 课中涉及的 HTML 标签\n\n| **标签** | **功能** |\n| ---\
  \ | --- |\n| `<html>`…`</html>` | 包围整个 HTML 文档。 |\n| `<head>`…`</head>` | 包围 HTML\
  \ 文档的头部。在 `<html>` 标签对内部使用。 |\n| `<meta` `charset``=``\"utf-8\"``>` | 将文档的字符集定义为\
  \ UTF-8。在 `<head>` 标签对内部使用，紧跟在开头的 `<head>` 标签之后。 |\n| `<title>`…`</title>` | 指示文档的标题。在\
  \ `<head>` 标签对内部使用。 |\n| `<body>`…`</body>` | 包围 HTML 文档的主体。在 `<html>` 标签对内部使用。\
  \ |\n| `<p>`…`</p>` | 包围一个段落；段落之间空一行。 |\n| `<br>` | 指示换行。 |\n| `<hr>` | 显示水平线。 |\n\
  | `<h1>`…`</h1>` | 包围一级标题。 |\n| `<h2>`…`</h2>` | 包围二级标题。 |\n| `<h3>`…`</h3>` | 包围三级标题。\
  \ |\n| `<h4>`…`</h4>` | 包围四级标题（很少使用）。 |\n| `<h5>`…`</h5>` | 包围五级标题（很少使用）。 |\n| `<h6>`…`</h6>`\
  \ | 包围六级标题（很少使用）。 |\n\n\n\n\n\n| 标签 | 描述 |\n|---|---|\n| `<header>`…`</header>`\
  \ | 包含介绍性信息。 |\n| `<footer>`…`</footer>` | 包含其所属元素的补充材料（通常是版权声明或作者信息）。 |\n| `<nav>`…`</nav>`\
  \ | 包含导航元素。 |\n| `<section>`…`</section>` | 包含主题相似的内容，例如书的章节或页面的一个部分。 |\n| `<article>`…`</article>`\
  \ | 包含独立成篇的内容，例如一篇新闻文章。 |\n| `<aside>`…`</aside>` | 包含其所属元素的次要信息。 |\n| `<address>`…`</address>`\
  \ | 包含与其最近的 `<article>` 或 `<body>` 元素相关的地址信息，通常位于 `<footer>` 元素内。 |\n\n### 问答\n\n\
  **问：我创建了一个网页，但在浏览器中打开文件时，看到了所有文本，包括 HTML 标签。有时页面顶部甚至出现奇怪的乱码字符。我哪里做错了？**\n\n**答：**\
  \ 你没有将文件保存为纯文本。请重新保存文件，注意选择“仅文本”或“ASCII 文本”格式。如果你不太清楚如何让文字处理器做到这一点，别担心。改用记事本或 TextEdit\
  \ 来编写 HTML 文件，一切就会正常。另外，务必确保网页的文件名以 `.html` 或 `.htm` 结尾。有些文本编辑器会在保存后自动添加 `.txt`，导致文件名变成类似\
  \ `filename.html.txt` 的形式。如果出现这种情况，你应该重命名文件，去掉 `.txt` 扩展名。\n\n**问：我必须使用语义化标记吗？你不是在整节课中都说，无论是否使用语义化标记，页面都是有效的吗？**\n\
  \n**答：** 没错，这些元素对于有效的 HTML 文档来说都不是必需的。你可以不使用它们，但我强烈建议你超越仅用于视觉展示的标记思维，同时考虑其语义含义。视觉展示对屏幕阅读器毫无意义，但语义元素能向这些应用程序传递大量信息。\n\
  \n**问：我仍然完全搞不清楚什么时候该用 `<section>`，什么时候该用 `<aside>`。你能说得更清楚些吗？**\n\n**答：** 我们理解你的困惑。HTML5\
  \ Doctor 网站上有一个资源，是我们见过的最有助于消除混淆的资料之一。它是一个用于 HTML5 分节的流程图，地址是 [`html5doctor.com/downloads/h5d-sectioning-flowchart.png`](http://html5doctor.com/downloads/h5d-sectioning-flowchart.png)。这个流程图会针对你的内容提出正确的问题，帮助你确定该使用哪个容器元素。\n\
  \n### 练习课\n\n练习课包含测验题和练习，旨在帮助你巩固对所学内容的理解。\n\n### 测验\n\n**1.** 每个 HTML 页面需要哪六个标签？\n\
  \n**2.** 为什么 `<meta charset>` 标签很重要？它应该放在 HTML 文档的什么位置？\n\n**3.** 使用哪些 HTML 标签和文本可以生成以下正文内容：\n\
  \n*   ![图片](img/arrow1.jpg) 一个标题，内容为 `We are Proud to Present...`\n\n*   ![图片](img/arrow1.jpg)\
  \ 一个次级标题，只有一个单词 `Orbit`\n\n*   ![图片](img/arrow1.jpg) 一个重要性较低的标题，内容为 `The Geometric\
  \ Juggler`\n\n**4.** 要创建一个完整的 HTML 网页，标题为 `Foo Bar`，顶部标题显示 `Happy Hour at the Foo\
  \ Bar`，然后以常规字体显示 `Come on down!`，你应该使用什么代码？尝试使用你刚刚学到的一些语义元素。\n\n**5.** 本课讨论的语义元素中，哪一个适合包含文章中某个词的定义？\n\
  \n**6.** 什么使得一个元素具有语义？\n\n**7.** 是否必须在 `<header>` 元素内使用 `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>`\
  \ 或 `<h6>` 元素？\n\n**8.** 文档的 `<footer>` 内容必须出现在页面的什么位置？\n\n**9.** 一个页面中可以有多少个不同的\
  \ `<nav>` 元素？\n\n**10.** `<article>` 元素可能包含哪些类型的内容？\n\n注意\n\n提醒那些阅读本书印刷版或电子版的读者：如果你访问\
  \ **www.informit.com/register** 并注册本书（使用 ISBN 9780672338083），你可以免费获得在线 Web 版的访问权限，其中不仅包含本书的完整文本，还包含本测验的交互式版本。\n\
  \n### 答案\n\n**1.** 每个 HTML 页面需要 `<html>`、`<head>`、`<title>` 和 `<body>`（以及它们的结束标签\
  \ `</html>`、`</head>`、`</title>` 和 `</body>`），再加上第一行的 `<!doctype html>` 和 `<head>`\
  \ 开始标签之后的 `<meta charset>`。严格来说，`<!doctype html>` 不是标签，而是一个声明，所以如果你说只有五个必需标签，那也是正确的。\n\
  \n**2.** `<meta charset>` 标签定义了页面使用的字符集，它应该始终紧跟在文档中 `<head>` 开始标签之后。\n\n**3.** 正文中的代码如下所示：\n\
  \n点击此处查看代码图片\n\n```\n<h1>We are Proud to Present...</h1>\n\n<h2>Orbit</h2>\n\n<h3>The\
  \ Geometric Juggler</h3>\n```\n\n**4.** 你的代码可以如下所示：\n\n点击此处查看代码图片\n\n```\n<!doctype\
  \ html>\n\n<html lang=\"en\">\n\n  <head>\n\n    <meta charset=\"utf-8\">\n\n    <title>Foo\
  \ Bar</title>\n\n  </head>\n\n  <body>\n\n    <header>\n\n       <h1>Happy Hour\
  \ at the Foo Bar</h1>\n\n    </header>\n\n    <section>\n\n      <p>Come on Down!</p>\n\
  \n    </section>\n\n  </body>    </html>\n```\n\n**5.** `<aside>` 元素适合用于此。\n\n**6.**\
  \ 语义元素是一种描述该元素所含信息含义的 HTML 元素。\n\n**7.** 不需要。`<header>` 元素可以包含除另一个 `<header>` 元素或\
  \ `<footer>` 元素之外的任何其他流内容。但是，`<header>` 元素中并不要求包含标题元素（`<h1>` 到 `<h6>`）。\n\n**8.**\
  \ `<footer>` 标签的内容可以出现在页面上任何合理的位置。虽然大多数设计师将页脚内容放在页面末尾或底部，但并没有要求必须在那里显示。\n\n**9.**\
  \ 你可以根据需要放置任意多个 `<nav>` 元素。关键在于只“需要”少数几个（可能仅用于主导航和次级导航）；否则，其意义就会丧失。\n\n**10.** `<article>`\
  \ 元素包含任何完整或独立、可独立分发或重复使用的内容。这可能包括博客条目、杂志或报纸文章、论坛帖子、用户提交的评论、交互式小部件或任何其他独立的内容项。\n\n\
  ### 练习\n\n*   ![图片](img/arrow1.jpg) 即使你阅读这些课程的主要目的是为你的企业创建网页内容，你也可以制作一个个人网页来练习。输入几个段落向世界介绍你自己，并使用本课学到的\
  \ HTML 标签将它们制作成一个网页。\n\n*   ![图片](img/arrow1.jpg) 在整个课程中，你将跟随代码示例并制作自己的页面。现在花点时间建立一个基本的文档模板，其中包含文档类型声明和核心\
  \ HTML 文档结构的标签。这样，你就可以随时复制粘贴这些信息。\n\n\n\n\n\n*   ![Image](img/arrow1.jpg) 基于单个页面模板，再创建几个相关的内容页面。请记住，有些页面可能包含不带\
  \ `<section>` 的 `<article>` 元素，而另一些页面则可能包含带有 `<header>` 和 `<footer>` 元素的 `<section>`\
  \ 元素。\n\n## 第 3 课\n\n## 理解层叠样式表\n\n**本课学习内容：**\n\n*   ![Image](img/arrow.jpg) 如何创建基本样式表\n\
  *   ![Image](img/arrow.jpg) 如何使用样式类\n*   ![Image](img/arrow.jpg) 如何使用样式 ID\n*  \
  \ ![Image](img/arrow.jpg) 如何构建内部样式表与内联样式\n\n在上一课中，你学习了 HTML 的基础知识，包括如何为所有网页内容设置基本的\
  \ HTML 模板。在本课中，你将学习如何通过使用*层叠样式表（CSS）*来微调网页内容的显示效果。\n\n样式表背后的概念很简单：创建一个样式表文档，指定字体、颜色、间距以及其他特性，从而为网站建立独特的外观。然后，将所有需要该外观的页面链接到该样式表，而无需在每个独立文档中重复指定所有这些样式。这样，当你决定更改官方企业字体或配色方案时，只需修改样式表中的一两个条目，就能一次性更新所有网页，无需逐个修改所有静态网页文件。因此，*样式表*是一组格式化指令的集合，用于同时控制多个\
  \ HTML 页面的外观。\n\n样式表可以设置大量格式化特性，包括精确的字体控制、字符间距和行间距、页边距和页面边框等。样式表还允许你使用熟悉的单位（如英寸、毫米、磅和派卡）来指定尺寸和其他度量值。此外，你还可以利用样式表将图形和文本精确定位到网页上的任意位置，无论是基于特定坐标还是相对于页面上的其他元素。\n\
  \n简而言之，样式表为网页带来了精致的显示效果。而且，请允许我这么说，它们是以“风格”来实现这一切的。\n\n### CSS 的工作原理\n\n样式表背后的技术称为\
  \ CSS，即层叠样式表。CSS 是一种定义样式结构（如字体、颜色和定位）的语言，用于描述网页上信息的格式化和显示方式。CSS 样式可以直接存储在 HTML 网页中，也可以存储在单独的样式表文件中。无论哪种方式，样式表都包含样式规则，这些规则将样式应用于特定类型的元素。当外部使用时，样式表规则被放置在一个扩展名为\
  \ `.css` 的外部样式表文档中。\n\n*样式规则*是一种格式化指令，可以应用于网页上的元素，例如一段文本或一个链接。一条样式规则由一个或多个样式属性及其对应的值组成。*内部样式表*直接放置在网页内部，而*外部样式表*则存在于单独的文档中，并通过特殊标签链接到网页；稍后你将了解更多关于这个标签的内容。\n\
  \nCSS 名称中的*层叠*部分指的是样式表规则应用于 HTML 文档中元素的方式。更具体地说，CSS 样式表中的样式形成了一种层次结构，其中更具体的样式会覆盖更通用的样式。CSS\
  \ 负责根据这种层次结构确定样式规则的优先级，从而产生层叠效果。如果这听起来有点令人困惑，只需将 CSS 中的层叠机制想象成遗传继承：一般特征从父母传给子女，但更具体的特征则完全由子女独有。基础样式规则在整个样式表中应用，但可以被更具体的样式规则覆盖。\n\
  \n注意\n\n你可能会注意到，本课中我们频繁使用术语*元素*（在后续课程中也是如此）。*元素*就是网页中的一段信息（内容），例如图像、段落或链接。标签用于标记元素，你可以将元素视为一个标签，其中包含描述性信息（属性、文本、图像等）。\n\
  \n一个简单的例子应该能说明问题。看看下面的代码，你能判断出文本颜色发生了什么变化吗？\n\n点击此处查看代码图片\n\n```\n<div style=\"\
  color:green;\">\n  This text is green.\n  <p style=\"color:blue;\">This text is\
  \ blue.</p>\n  <p>This text is still green.</p>\n</div>\n```\n\n在这个例子中，通过 `color`\
  \ 样式属性将绿色应用于 `<div>` 标签。因此，`<div>` 标签中的文本显示为绿色。由于两个 `<p>` 标签都是 `<div>` 标签的子元素，绿色文本样式会层叠到它们身上。然而，第一个\
  \ `<p>` 标签覆盖了颜色样式，将其改为蓝色。最终结果是：第一行（未用段落标签包围）为绿色，第一个正式段落为蓝色，第二个正式段落保留了层叠下来的绿色。\n\n\
  如果你能独自理解上述描述并顺利掌握，那么恭喜你——你已经成功了一半。理解 CSS 并不难，练习得越多，它就会变得越清晰。真正的诀窍在于培养一种审美设计感，然后通过\
  \ CSS 将其应用到你的在线展示中。\n\n与许多其他网络技术一样，CSS 也经历了多年的演变。CSS 的原始版本，称为*层叠样式表级别 1*（*CSS1*），创建于\
  \ 1996 年。后来于 1998 年创建的 CSS2 标准至今仍在使用。CSS 的最新版本是 CSS3，它在先前版本奠定的坚实基础上构建，并增加了高级功能以增强在线体验。现代网络浏览器支持所有\
  \ CSS2 以及大部分 CSS3。在本系列课程中，你将学习核心 CSS，包括 CSS3 中适用于本教材所涵盖的基本设计和功能的新元素。因此，当我们谈论 CSS\
  \ 时，指的就是 CSS3。\n\n你可以在 [www.w3.org/Style/CSS/](http://www.w3.org/Style/CSS/) 找到完整的\
  \ CSS 参考指南。本课的其余部分将解释如何有效使用 CSS 的基础知识。\n\n### 基本样式表\n\n尽管样式表功能强大得令人望而生畏，但创建起来却很简单。考虑\
  \ 图 3.1 和 图 3.2 中显示的网页。这些页面共享多个视觉属性，可以放入一个通用样式表中：\n\n*   ![Image](img/arrow.jpg)\
  \ 标题使用大号粗体 Verdana 字体，正文使用正常大小和粗细的 Verdana 字体。\n*   ![Image](img/arrow.jpg) 使用名为\
  \ `logo.gif` 的图像，浮动在内容中并位于页面右侧。\n*   ![Image](img/arrow.jpg) 所有文本均为黑色，但副标题为紫色。\n\
  *   ![Image](img/arrow.jpg) 左侧和顶部有页边距。\n*   ![Image](img/arrow.jpg) 文本行之间有垂直间距。\n\
  *   ![Image](img/arrow.jpg) 包含一个居中且小字号的页脚。\n\n![显示一个名为 Enjoy Scifi 的网站的截图。](img/03fig01.jpg)\n\
  \n**图 3.1** 此页面使用样式表来微调文本和图像的外观与间距。\n\n![显示 Enjoy Scifi 网站另一个页面的截图。](img/03fig02.jpg)\n\
  \n**图 3.2** 此页面使用与 图 3.1 相同的样式表，从而保持一致的视觉风格。\n\n清单 3.1 展示了用于指定这些类型属性的 CSS 样式表。\n\
  \n**清单 3.1** 单个外部样式表\n\n\n\n\n\n点击此处查看代码图片\n\n```\nbody {\n  font-size: 10pt;\n\
  \  font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;\n  color: black;\n\
  \  line-height: 14pt;\n  padding-left: 5pt;\n  padding-right: 5pt;\n  padding-top:\
  \ 5pt;\n}\n\nh1 {\n  font: 14pt Verdana, Geneva, Arial, Helvetica, sans-serif;\n\
  \  font-weight: bold;\n  line-height: 20pt;\n}\n\np.subheader {\n  font-weight:\
  \ bold;\n  color: #593d87;\n}\n\nimg {\n  padding: 3pt;\n  float: right;\n}\n\n\
  a {\n  text-decoration: none;\n}\n\na:link, a:visited {\n  color: #8094d6;\n}\n\n\
  a:hover, a:active {\n  color: #FF9933;\n}\n\nfooter {\n  font-size: 9pt;\n  font-style:\
  \ italic;\n  line-height: 12pt;\n  text-align: center;\n  padding-top: 30pt;\n}\n\
  ```\n\n乍一看，这似乎是一大段代码，但仔细看会发现每行代码的信息量并不多。通常，将每个单独的样式规则放在单独的一行上，有助于让样式表更具可读性，但这属于个人偏好；只要持续使用分号分隔每个规则，你也可以将所有规则放在一行上；稍后你会了解更多。说到代码可读性，也许你首先注意到的是这段样式表代码看起来完全不像普通的\
  \ HTML 代码。CSS 使用自己独特的语法来指定样式表。\n\n当然，列表中包含一些熟悉的 HTML 标签（尽管并非所有标签都需要在样式表中出现）。你可能已经猜到，样式表中的\
  \ `body`、`h1`、`p`、`img`、`a` 和 `footer` 指的是该样式表将应用到的 HTML 文档中对应的标签。这些被称为*选择器*。每个标签名后的花括号描述了该标签内所有内容应如何显示——通过*样式规则*。\n\
  \n在这个例子中，样式表规定所有 `body` 文本应以 10 点大小、Verdana 字体（如果可用）、黑色显示，行间距为 14 点。如果用户没有安装 Verdana\
  \ 字体，样式表中的字体列表表示浏览器搜索可用字体的顺序：Geneva，然后是 Arial，再是 Helvetica。如果用户没有这些字体中的任何一种，浏览器将使用任何可用的默认无衬线字体。此外，页面左侧、右侧和顶部应有\
  \ 5 点的内边距。\n\n任何 `<h1>` 标签内的文本应以 14 点大小的粗体 Verdana 显示。接下来，任何仅使用 `<p>` 标签的段落都会继承\
  \ body 元素指定的所有样式。但是，如果 `<p>` 标签使用了名为 `subheader` 的特殊类，则文本将以粗体显示，颜色为 `#593d87`（紫色）。\n\
  \n清单 3.1 中每个度量值后面的 `pt` 表示*点*（一英寸有 72 点）。如果你愿意，你可以用英寸（`in`）、厘米（`cm`）、像素（`px`）或“字母\
  \ *m* 的宽度”（称为 em（`em`）或 rem（`rem`））来指定任何样式表度量值。还有相对于数字 0 宽度（`ch`）、相对于视口宽度或高度的 1%（`vw`\
  \ 或 `vh`）以及相对于容器（`%`）的单位。CSS 中的长度度量被定义为固定或相对。固定长度（如英寸、像素或点）不会改变大小，而相对长度（如 `em`、`ch`\
  \ 或百分比）可以改变。\n\n注意\n\n在 CSS 中，`rem` 度量值相对于字母 *m* 的宽度进行大小调整，但它是相对于初始字体大小，而不是可能适用的任何更改后的字体大小。最佳实践建议使用相对字体大小（如\
  \ `rem` 或 `em`）而不是固定字体大小（如英寸或点），以便你的设计能够更优雅地缩放。选择 `rem` 还是 `em` 主要取决于你是需要字体在整个页面上缩放（使用\
  \ `rem`），还是需要对文档的各个部分进行更明确的控制（使用 `em`）。\n\n你可能已经注意到，列表中的每个样式规则都以分号（`;`）结尾。分号用于将样式规则彼此分隔。因此，习惯上在每个样式规则末尾加上分号，以便之后可以轻松地在其后添加另一个样式规则。查看清单\
  \ 3.1 中样式表的其余部分，了解应用于其他标签的呈现格式。别担心：你将在本课程的后续课程中了解更多关于每种类型条目的信息。\n\n注意\n\n请记住，`10pt`\
  \ 是一种较小的字体大小。并非所有查看你页面的人都会觉得这么小的字体清晰易读。你可以使用样式表将字体大小指定为任意大或小，尽管一些较旧的显示设备和打印机无法正确处理大于\
  \ 200 点的字体。始终尽可能在多种浏览器和设备上测试你的页面。\n\n要将此样式表链接到 HTML 文档，请在每个文档的 `<head>` 部分包含一个 `<link>`\
  \ 标签。清单 3.2 显示了一个包含以下 `<link>` 标签的页面的 HTML 代码：\n\n点击此处查看代码图片\n\n`<link rel=\"stylesheet\"\
  \ href=\"styles.css\">`\n\n这假设样式表以名称 `styles.css` 存储在 HTML 文档所在的同一文件夹中。只要 Web 浏览器支持样式表（所有现代浏览器都支持），样式表中指定的属性将应用于页面中的内容，而无需任何特殊的\
  \ HTML 格式化代码。这满足了 HTML 的目标之一，即在网页内容与显示该内容所需的特定格式之间提供分离。\n\n**清单 3.2** 使用外部样式表的页面的\
  \ HTML 代码\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <title>About BAWSI</title>\n    <link rel=\"\
  stylesheet\" href=\"styles.css\">\n  </head>\n  <body>\n    <section>\n      <header>\n\
  \        <h1>About BAWSI</h1>\n      </header>\n      <p><img src=\"logo.gif\" alt=\"\
  BAWSI logo\">The Bay Area Women's\n      Sports Initiative (BAWSI) is a public benefit,\
  \ nonprofit\n      corporation with a mission to create programs and\n      partnerships\
  \ through which women athletes bring health, hope\n      and wholeness to our community.\
  \ Founded in 2005 by Olympic\n      and World Cup soccer stars Brandi Chastain and\
  \ Julie Foudy\n      and Marlene Bjornsrud, former general manager of the San Jose\n\
  \      CyberRays women's professional soccer team, BAWSI provides a\n      meaningful\
  \ path for women athletes to become a more visible\n      and valued part of the\
  \ Bay Area sports culture.</p>\n     <p class=\"subheader\">BAWSI's History</p>\n\
  \     <p>The concept of BAWSI was inspired by one of the most\n     spectacular\
  \ achievements in women's sports history and born out\n     of one its biggest disappointments...</p>\n\
  \     <p><a href=\"secondpage.html\">[continue reading]</a></p>\n    </section>\n\
  \    <footer>\n      Copyright &copy; 2005-2013 BAWSI (www.bawsi.org).\n      All\
  \ rights reserved.  Used with permission.\n    </footer>\n  </body>\n</html>\n```\n\
  \n注意\n\n在大多数 Web 浏览器中，你可以通过右键单击页面并选择“检查”或“检查元素”来查看样式表中的样式规则。在那里你可以看到 HTML 以及与高亮元素关联的特定样式。你甚至可以临时编辑以查看页面可能发生的变化。要编辑你自己的样式表，只需使用文本编辑器；大多数设计师使用与\
  \ HTML 相同的编辑器来处理 CSS。\n\n\n\n\n\n清单 3.2 中的代码很有趣，因为它不包含任何样式格式。换句话说，HTML 代码中没有任何内容规定文本和图像的显示方式——没有颜色、没有字体，什么都没有。然而，页面却能够被精心格式化并渲染到屏幕上，这要归功于对外部样式表\
  \ `styles.css` 的链接。这种方法真正的好处在于，你可以轻松创建一个包含多个页面的网站，并保持一致的视觉风格。而且，你可以将页面的视觉样式隔离到单个文档（样式表）中，这样一次更改就能影响所有页面。\n\
  \n**注意**\n\n并非所有浏览器对 CSS 的支持都完美无缺。如果你想了解某个特定 CSS 属性（或 HTML 标签或其他 Web 技术）的支持情况，可以查看\
  \ CanIUse 网站（[www.caniuse.com](http://www.caniuse.com)）。\n\n**自己动手试试**\n\n## 创建你自己的样式表\n\
  \n从头开始，创建一个名为 `mystyles.css` 的新文本文档，并为以下基本 HTML 标签添加一些样式规则：`<body>`、`<p>`、`<h1>`\
  \ 和 `<h2>`。创建样式表后，再制作一个包含这些基本标签的新 HTML 文件。尝试不同的样式规则，亲自体验一下只需在样式表文件中做一个简单更改，就能改变段落中整个文本块是多么简单。\n\
  \n### CSS 样式入门\n\n现在你已经对 CSS 样式表有了基本了解，知道它们如何基于描述网页信息外观的样式规则工作。本课接下来的几节将快速介绍一些最重要的样式属性，并帮助你开始在自建样式表中使用\
  \ CSS。\n\nCSS 包含多种样式属性，用于控制字体、颜色、对齐、边距等。CSS 中的样式属性大致可以分为两大类：\n\n*   ![Image](img/arrow.jpg)\
  \ **布局属性**——影响网页上元素定位的属性，例如边距、内边距和对齐\n*   ![Image](img/arrow.jpg) **格式化属性**——影响网站元素视觉显示的属性，例如字体类型、大小和颜色\n\
  \n#### 基本布局属性\n\nCSS 布局属性决定内容在网页上的放置方式。最重要的布局属性之一是 `display` 属性，它描述了一个元素相对于其他元素的显示方式。`display`\
  \ 属性有五个基本值：\n\n*   ![Image](img/arrow.jpg) `block`——元素在新行上显示，如同新段落。\n*   ![Image](img/arrow.jpg)\
  \ `list-item`——元素在新行上显示，旁边带有列表项标记（项目符号）。\n*   ![Image](img/arrow.jpg) `inline`——元素在当前段落内联显示。\n\
  *   ![Image](img/arrow.jpg) `inline-block`——元素作为块级元素与周围块级元素内联显示。\n*   ![Image](img/arrow.jpg)\
  \ `none`——元素不显示；即隐藏。\n\n**注意**\n\n`display` 属性依赖于一种称为*相对定位*的概念，这意味着元素相对于页面上其他元素的位置进行定位。CSS\
  \ 还支持*绝对定位*，它允许你将元素放置在页面上的精确位置，独立于其他元素。你将在第 10 课“理解 CSS 盒模型与定位”中了解更多关于这两种定位方式的内容。\n\
  \n理解 `display` 属性更容易的方法是，将网页上的每个元素想象成在显示时占据一个矩形区域；`display` 属性控制这个矩形区域的显示方式。例如，`block`\
  \ 值会导致元素单独占据一个新行，而 `inline` 值则将元素放置在其前面内容的旁边。`inline-block` 值将元素视为块，但将其定位在前面内容的旁边，而\
  \ `img` 标签是最常用的 `inline-block` 元素。`display` 属性是少数可以应用于大多数样式规则的样式属性之一。以下是设置 `display`\
  \ 属性的示例：\n\n```\ndisplay:block;\n```\n\n**注意**\n\n`display` 属性还有其他几个值，包括 `table`、`flex`\
  \ 和 `grid`，以及它们的内联对应值 `inline-table`、`inline-flex` 和 `inline-grid`。这些值提供了强大的布局和显示功能，将在第\
  \ 12 课“使用现代 CSS 技术创建布局”中更详细地介绍。\n\n你可以使用 `width` 和 `height` 属性控制元素矩形区域的尺寸。与许多其他与尺寸相关的\
  \ CSS 属性一样，`width` 和 `height` 的属性值可以用多种不同的度量单位指定：\n\n*   ![Image](img/arrow.jpg)\
  \ `in`——英寸\n*   ![Image](img/arrow.jpg) `cm`——厘米\n*   ![Image](img/arrow.jpg) `em`——相对单位（em）\n\
  *   ![Image](img/arrow.jpg) `mm`——毫米\n*   ![Image](img/arrow.jpg) `%`——百分比\n*  \
  \ ![Image](img/arrow.jpg) `px`——像素\n*   ![Image](img/arrow.jpg) `pt`——点\n*   ![Image](img/arrow.jpg)\
  \ `rem`——根相对单位（rem）\n\n你可以在样式表中任意混合搭配单位，但通常最好在一组相似的样式属性中保持一致。例如，你可能希望字体属性坚持使用 `rem`，而尺寸使用百分比。以下是使用像素单位设置元素宽度的示例：\n\
  \n```\nwidth: 200px;\n```\n\n#### 基本格式化属性\n\nCSS 格式化属性用于控制网页上内容的外观，而不是控制内容的物理定位。最常用的格式化属性之一是\
  \ `border` 属性，它通过一个方框或部分方框在元素周围建立可见的边界。请注意，边框始终存在，因为始终为其预留了空间，但除非你赋予它使其可见的属性（例如颜色），否则边框不会以可见的方式出现。以下\
  \ `border` 属性提供了描述元素边框的方法：\n\n*   ![Image](img/arrow.jpg) `border-width`——边框边缘的宽度\n\
  *   ![Image](img/arrow.jpg) `border-color`——边框边缘的颜色\n*   ![Image](img/arrow.jpg)\
  \ `border-style`——边框边缘的样式\n*   ![Image](img/arrow.jpg) `border-left`——边框的左侧\n* \
  \  ![Image](img/arrow.jpg) `border-right`——边框的右侧\n*   ![Image](img/arrow.jpg) `border-top`——边框的顶部\n\
  *   ![Image](img/arrow.jpg) `border-bottom`——边框的底部\n*   ![Image](img/arrow.jpg)\
  \ `border`——所有边框边\n\n`border-width` 属性设置边框边缘的宽度。通常以像素表示，如下代码所示：\n\n```\nborder-width:5px;\n\
  ```\n\n不出所料，`border-color` 和 `border-style` 属性分别设置边框颜色和样式。以下是这两个属性设置的示例：\n\n```\n\
  border-color:blue;\nborder-style:dotted;\n```\n\n`border-style` 属性可以设置为以下任何基本值：\n\
  \n*   ![Image](img/arrow.jpg) `solid`——单线边框\n*   ![Image](img/arrow.jpg) `double`——双线边框\n\
  *   ![Image](img/arrow.jpg) `dashed`——虚线边框\n*   ![Image](img/arrow.jpg) `dotted`——点线边框\n\
  *   ![Image](img/arrow.jpg) `groove`——凹槽状边框\n*   ![Image](img/arrow.jpg) `ridge`——脊状边框\n\
  *   ![Image](img/arrow.jpg) `inset`——内嵌状边框\n*   ![Image](img/arrow.jpg) `outset`——外凸状边框\n\
  *   ![Image](img/arrow.jpg) `none`——无边框\n*   ![Image](img/arrow.jpg) `hidden`——与\
  \ `none` 效果相同\n\n\n\n\n\n在本课程后续内容中，你将学到更多关于边框的高级技巧。\n\n`border-style` 属性的默认值是 `none`，这就是为什么元素默认没有边框，*除非*你将\
  \ `border-style` 属性设置为其他样式。虽然 `solid` 是最常见的边框样式，但你也会看到其他样式的使用。\n\n`border-left`、`border-right`、`border-top`\
  \ 和 `border-bottom` 属性允许你分别设置元素每一边的边框。如果你希望四个边的边框相同，可以直接使用单一的 `border` 属性，它需要按空格分隔的以下样式：`border-width`、`border-style`\
  \ 和 `border-color`。下面是一个使用 `border` 属性设置由两条红色线组成的边框（`double`）的示例，总宽度为 10 像素：\n\n\
  ```\nborder:10px double red;\n```\n\n你还可以通过以下属性调整盒子的圆角半径：\n\n* `border-top-left-radius`\
  \ — 左上角半径\n* `border-top-right-radius` — 右上角半径\n* `border-bottom-left-radius` —\
  \ 左下角半径\n* `border-bottom-right-radius` — 右下角半径\n* `border-radius` — 所有四个角的半径\n\n\
  `border-radius` 属性接受一个或两个值。这些值定义了描述角形状的四分之一椭圆的两个半径。第一个值是水平半径，第二个是垂直半径。如果只有一个值，则同时用于两者。此属性会使边框和元素上的任何背景都变为圆角。下面是一个将\
  \ `border-radius` 属性设置为 `1rem` 的示例：\n\n```\nborder-radius: 1rem;\n```\n\n元素的边框颜色由\
  \ `border-color` 属性设置，而元素内部区域的颜色则通过 `color` 和 `background-color` 属性设置。`color` 属性设置元素中文本的颜色（前景色），`background-color`\
  \ 属性设置文本背景的颜色。下面是一个将两个颜色属性都设置为预定义颜色的示例：\n\n```\ncolor:black;\nbackground-color:orange;\n\
  ```\n\n你也可以通过十六进制（在第 8 课“使用颜色、图像和多媒体”中有更详细的介绍）或 RGB（红、绿、蓝）十进制值来为这些属性分配自定义颜色：\n\n\
  ```\nbackground-color:#999999;\ncolor:rgb(0,0,255);\n```\n\n你甚至可以使用 RGBA（红、绿、蓝、Alpha\
  \ 通道）十进制值来设置颜色的透明度：\n\n```\nbackground-color:rgba(0,0,0,0.8);\ncolor:rgba(0,0,255,1.0);\n\
  ```\n\n你还可以轻松控制网页内容的对齐和缩进。这可以通过 `text-align` 和 `text-indent` 属性实现，如下代码所示：\n\n```\n\
  text-align:center;\ntext-indent:12px;\n```\n\n> **注意**：`text-align` 属性适用于块级元素的内容，而不是元素本身。如果你想要居中一个块元素（或内联块元素，如图像），则需要使用其他方法，如第\
  \ 9 课“使用边距、内边距、对齐和浮动”中所述。\n\n当元素正确对齐和缩进后，你可能还想设置其字体。以下基本字体属性设置了与字体相关的各种参数（你将在第 6\
  \ 课“使用字体、文本块、列表和表格”中学习更多高级字体用法）：\n\n* `font-family` — 字体的字样\n* `font-size` — 字体的大小\n\
  * `font-style` — 字体的样式（`normal` 或 `italic`）\n* `font-weight` — 字体的粗细（`normal`、`lighter`、`bold`、`bolder`\
  \ 等）\n\n`font-family` 属性指定了一个按优先级排序的字样名称列表。使用优先级列表而不是单个值是为了在某个系统上字体不可用时提供备选方案。如果字样名称包含多个单词，例如“Times\
  \ New Roman”，则应将名称用引号括起来。`font-size` 属性使用度量单位指定字体的大小。最后，`font-style` 属性设置字体的样式，`font-weight`\
  \ 属性设置字体的粗细。下面是一个设置这些字体属性的示例：\n\n```\nfont-family: Arial, \"Gill Sans\", sans-serif;\n\
  font-size: 1.2rem;\nfont-style: italic;\nfont-weight: normal;\n```\n\n现在你已经对样式属性及其工作原理有了更多了解，请再次查看清单\
  \ 3.1，看看是否更容易理解。以下是该样式表中使用的样式属性的总结，你可以将其作为理解其工作原理的指南：\n\n* `font` — 允许你一次性设置多个字体属性。你可以指定一个用逗号分隔的字体名称列表；如果第一个不可用，则尝试下一个，依此类推。你还可以包含\
  \ `bold` 和/或 `italic` 以及字体大小。或者，你也可以分别使用 `font-family`、`font-size`、`font-weight`\
  \ 和 `font-style` 来单独设置每个字体属性。\n* `line-height` — 在出版界也称为*行距*。它设置每行文本的高度。`line-height`\
  \ 通常使用与 `font` 相同的单位定义。\n* `color` — 使用标准颜色名称或十六进制颜色代码设置文本颜色（更多详情请参见第 8 课）。\n* `text-decoration`\
  \ — 用于关闭链接下划线；只需将其设置为 `none`。还支持 `underline`、`overline` 和 `line-through` 值。第 7 课“使用外部和内部链接”更详细地介绍了如何为链接应用样式。\n\
  * `text-align` — 对齐文本（`left`、`right` 或 `center`）或两端对齐文本（`justify`）。\n* `padding`\
  \ — 为元素的左、右、上、下添加内边距；内边距可以使用度量单位或页面宽度的百分比。如果你希望独立地为元素左侧和右侧添加内边距，请使用 `padding-left`\
  \ 和 `padding-right`。根据需要，使用 `padding-top` 或 `padding-bottom` 为元素顶部或底部添加内边距。你将在第\
  \ 9 课和第 10 课中了解更多关于这些样式属性的内容。\n\n### 使用样式类\n\n这是一门“自学”课程，所以你不需要去上任何一堂课就能学会如何为你的页面赋予出色的样式——尽管你*确实*需要了解什么是样式类。当你希望页面上的某些文本看起来与其他文本不同时，你可以创建一种相当于自定义\
  \ HTML 标签的东西。你定义的每种特殊格式的文本称为一个*样式类*。*样式类*是一组自定义的格式规范，可以应用于网页中的任何元素。\n\n在探讨样式类之前，我们需要快速回顾一下并澄清一些\
  \ CSS 术语。首先，CSS *样式属性*是一种特定的样式，你可以为其赋值，例如 `color` 或 `font-size`。你通过选择器将样式属性及其对应的值与网页上的元素关联起来。*选择器*用于标识页面上要应用样式的标签。下面是一个包含选择器、属性和值的基本样式规则示例：\n\
  \n```\nh1 { font: 36pt Courier; }\n```\n\n\n\n\n\n在这段代码中，`h1` 是选择器，`font` 是样式属性，`36pt\
  \ Courier` 是值。选择器很重要，因为它意味着字体设置将应用于网页中的所有 `h1` 元素。但如果你想要区分某些 `h1` 元素呢？答案在于样式类。\n\
  \n假设你希望在文档中使用两种不同的 `<h1>` 标题。你可以通过在样式表中添加以下 CSS 代码为每种标题创建一个样式类：\n\n```\nh1.silly\
  \ { font: 36pt Comic Sans; }\nh1.serious { font: 36pt Arial; }\n```\n\n注意这些选择器在\
  \ `h1` 后面包含一个句点（`.`），后跟一个描述性的类名。要在两个样式类之间进行选择，请使用 `class` 属性，如下所示：\n\n```\n<h1 class=\"\
  silly\">Marvin's Munchies Inc.</h1>\n<p>关于 Marvin's Munchies 的文本放在这里。</p>\n```\n\
  \n或者你也可以这样使用：\n\n```\n<h1 class=\"serious\">MMI 投资者信息</h1>\n<p>面向商业投资者的文本放在这里。</p>\n\
  ```\n\n在 HTML 代码中引用样式类时，只需在元素的 `class` 属性中指定类名。在前面的示例中，假设你在网页顶部包含了指向样式表的 `<link>`，并且用户安装了\
  \ Comic Sans 字体，那么 `Marvin's Munchies Inc.` 这些文字将以 36 磅 Comic Sans 字体显示。而 `MMI 投资者信息`\
  \ 这些文字则会以 36 磅 Arial 字体显示。你可以在清单 3.2 中看到另一个使用类的示例；请查找 `subheader` 的 `<p>` 类。\n\n\
  如果你想要创建一个可以应用于任何元素（而不仅仅是标题或其他特定标签）的样式类呢？在你的 CSS 中，只需使用一个句点（`.`）后跟你自定义的样式类名以及你选择的任何样式规则。该类可以同时指定任意数量的字体、间距和边距设置。在页面中任何你想要应用自定义标签的地方，只需使用一个\
  \ HTML 标签加上 `class` 属性，后跟你创建的类名即可。\n\n例如，清单 3.1 中的样式表包含以下样式类规范：\n\n```\np.subheader\
  \ {\n  font-weight: bold;\n  color:#593d87;\n}\n```\n\n这个样式类在清单 3.2 中通过以下标签应用：\n\
  \n```\n<p class=\"subheader\">\n```\n\n注意\n\n你可能已经注意到，当样式规则包含多个属性时，编码风格会有所变化。对于只有单个样式的样式规则，通常将属性放在与规则相同的行上，如下所示：\n\
  \n```\np.subheader { font-weight: bold; }\n```\n\n然而，当样式规则包含多个样式属性时，将每个属性单独列在一行会更容易阅读和理解代码，如下所示：\n\
  \n```\np.subheader {\n  font-weight: bold;\n  color:#593d87;\n}\n```\n\n在清单 3.2\
  \ 中，该标签与结束标签 `</p>` 之间的所有内容都会以粗体紫色文字显示。\n\n样式类的价值在于它们将样式代码与网页分离，使你能够将 HTML 代码专注于页面中的实际内容，而不是内容在屏幕上的显示方式。然后你可以通过微调样式表来决定内容如何渲染到屏幕上。你可能会惊讶于样式表中相对少量的代码就能对整个网站产生显著的影响。样式类使你的页面更易于维护和操作。\n\
  \n### 使用样式 ID\n\n当你创建自定义样式类时，你可以随意多次使用这些类；它们不是唯一的。然而，在某些情况下，你需要对唯一的元素进行精确控制，以实现布局或格式化（或两者兼有）。在这种情况下，应该使用\
  \ ID 而不是类。\n\n*样式 ID* 是一组自定义的格式规范，只能应用于网页中的一个元素。你可以在多个页面中使用 ID——但每个页面中只能使用一次。\n\n\
  例如，假设你所有页面的正文中都有一个标题。每个页面只有一个标题，但每个页面都包含该标题的一个实例。以下是一个带有 ID 的选择器示例，以及一个属性和值：\n\n\
  ```\np#title {font: 24pt Verdana, Geneva, Arial, sans-serif}\n```\n\n注意这个选择器在 `p`\
  \ 后面包含一个井号（`#`），后跟一个描述性的 ID 名称。在 HTML 代码中引用样式 ID 时，只需在元素的 `id` 属性中指定 ID 名称，如下所示：\n\
  \n```\n<p id=\"title\">某个标题放在这里</p>\n```\n\n开始和结束 `<p>` 标签之间的所有内容将以 24 磅 Verdana\
  \ 字体显示——但在任何给定页面上只能出现一次。你经常看到样式 ID 用于定义页面中用于布局的特定部分，例如页眉区域、页脚区域、主体区域等。这些类型的区域在每个页面中只出现一次，因此使用\
  \ ID 而不是类是合适的选择。\n\n### 内部样式表与内联样式\n\n在某些情况下，你希望指定仅用于一个网页的样式。你可以将样式表放在 `<style>`\
  \ 和 `</style>` 标签之间，并直接包含在 HTML 文档中。以这种方式使用的样式表必须出现在 HTML 文档的 `<head>` 中。不需要 `<link>`\
  \ 标签，并且你不能从其他页面引用该样式表（除非你也将其复制到该文档的开头）。这种样式表被称为内部样式表，正如你在本课前面所学到的。\n\n注意\n\n在许多网页中，你会在\
  \ `<style>` 标签上看到 `type=\"text/css\"` 属性。这在过去是有效 HTML 所必需的，但大多数现代浏览器除非另有指定，否则会假定该类型。因此，在\
  \ HTML5 中，该属性不再是必需的。\n\n清单 3.3 展示了一个如何指定内部样式表的示例。\n\n**清单 3.3** 一个带有内部样式表的网页\n\n\
  ```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>某个页面</title>\n    <style>\n      footer {\n        font-size: 9pt;\n\
  \        line-height: 12pt;\n        text-align: center;\n      }\n    </style>\n\
  \  </head>\n  <body>\n  ...\n  <footer>\n  Copyright 2018 Acme Products, Inc.\n\
  \  </footer>\n  </body>\n</html>\n```\n\n在清单 3.3 中，`footer` 样式类在页面头部的一个内部样式表中指定。现在可以在该页面的正文中使用该样式类。实际上，它在页面正文中被用于设置版权声明的样式。\n\
  \n如果你希望创建一个在单个页面内多次使用的样式规则，内部样式表非常方便。然而，在某些情况下，你可能需要将独特的样式应用于某个特定元素。这时就需要使用内联样式规则，它允许你仅为页面的一小部分（例如单个元素）指定样式。例如，你可以通过\
  \ `style` 属性在 `<p>`、`<div>` 或 `<span>` 标签内创建并应用样式规则。这种类型的样式被称为*内联样式*，因为它直接在 HTML\
  \ 代码中间指定。\n\n注意\n\n\n\n\n\n`<span>`和`</span>`标签是虚拟标签，它们本身不执行任何操作，只是指定一个内容范围，以便应用你添加的任何`style`属性。`<div>`和`<span>`的唯一区别在于，`<div>`是块级元素，因此会强制换行，而`<span>`则不会。因此，你应该使用`<span>`来修改那些出现在句子或段落中间、不需要换行的文本部分的样式。\n\
  \n下面是一个示例`style`属性的样子：\n\n点击此处查看代码图片\n\n```\n<p style=\"color:green;\">\n  This\
  \ text is green, but <span style=\"color:red;\">this text\n  is red.</span>\n  Back\
  \ to green again, but...\n</p>\n\n<p>\n  ...now the green is over, and we're back\
  \ to the default color\n  for this page.\n</p>\n```\n\n这段代码使用了`<span>`标签来演示如何在内联样式规则中应用`color`样式属性。实际上，本例中的`<p>`标签和`<span>`标签都使用了`color`属性作为内联样式。重要的是要理解，`color:red;`样式属性会覆盖`<span>`和`</span>`标签之间文本的`color:green;`样式属性。然后在第二个段落中，这两个`color`样式都不再适用，因为这个全新的段落会遵循整个页面的默认颜色。\n\
  \n**警告**\n\n在页面级调试或在受控环境中尝试新事物之外，使用内联样式并不被认为是最佳实践。最佳实践是让你的页面链接到一个集中维护的样式表，这样更改会立即反映在所有使用该样式表的页面中。\n\
  \n## 验证你的样式表\n\n就像验证你的 HTML 或 XHTML 标记很重要一样，验证样式表也很重要。你可以在[`jigsaw.w3.org/css-validator/`](https://jigsaw.w3.org/css-validator/)找到\
  \ CSS 的特定验证工具。你可以将工具指向一个网址、上传文件或将内容粘贴到提供的表单字段中。最终目标是得到类似图 3.3 所示的结果：`valid`！\n\n\
  ![一张显示 W3C CSS 验证器的截图。](img/03fig03.jpg)\n\n**图 3.3** W3C CSS 验证器显示清单 3.1 的样式表内容没有错误。\n\
  \n### 总结\n\n在本课中，你了解到样式表可以同时控制多个 HTML 页面的外观。它还可以让你极其精确地控制 HTML 元素的排版、间距和定位。你还了解到，通过向几乎任何\
  \ HTML 标签添加`style`属性，你可以控制 HTML 页面任何部分的样式，而无需引用单独的样式表文档。\n\n你学习了在网站中包含样式表的三种主要方法：一个扩展名为`.css`的单独样式表文件，链接到文档的`<head>`中；一组放置在文档`<head>`中`<style>`标签内的样式规则；以及通过`style`属性直接放置在\
  \ HTML 标签中的规则（尽管后者并非长期使用的最佳实践）。\n\n表 3.1 总结了本课讨论的标签。有关`<style>`标签或`style`属性后可包含哪些选项的详细信息，请参考[www.w3c.org](http://www.w3c.org)上的\
  \ CSS 样式表标准。\n\n**表 3.1** 第 3 课中涉及的 HTML 标签和属性\n\n| 标签 | 属性 | 功能 |\n| --- | ---\
  \ | --- |\n| `<style>`…`</style>` | | 允许在文档中包含内部样式表。用于`<head>`和`</head>`之间。 |\n\
  | | `type`=`\"`contenttype`\"` | 互联网内容类型。HTML5 不再需要。 |\n| `<link>` | | 链接到外部样式表（或其他文档类型）。用于文档的`<head>`部分。\
  \ |\n| | `href`=`\"`url`\"` | 样式表的地址。 |\n| | `type`=`\"`contenttype`\"` | 互联网内容类型。HTML5\
  \ 不再需要。 |\n| | `rel`=`\"`stylesheet`\"` | 链接类型。 |\n| `<span>`…`</span>` | | 除了提供放置`style`或其他属性的位置外，不执行任何操作。（类似于`<div>`…`</div>`，但不会导致换行。）\
  \ |\n| | `style`=`\"`style`\"` | 包含内联样式规范。（可用于`<span>`、`<div>`、`<body>`以及大多数其他 HTML\
  \ 标签。） |\n\n### 问与答\n\n**问：假设我将一个样式表链接到我的页面，该样式表规定所有文本应为蓝色，但页面某处有一个`<span style=\"\
  font-color:red;\">`标签。那么该文本会显示为蓝色还是红色？**\n\n**答：** 红色。局部内联样式总是优先于外部样式表。你在页面顶部的`<style>`和`</style>`标签之间放置的任何样式规范也优先于外部样式表（但不优先于同一页面中后面的内联样式）。这就是本课前面提到的样式表的层叠效果。你可以将层叠样式效果想象为从外部样式表开始，然后被内部样式表覆盖，再被内联样式覆盖。\n\
  \n**问：我可以将多个样式表链接到单个页面吗？**\n\n**答：** 当然可以。例如，你可能有一个用于格式化的样式表（文本、字体、颜色等）和另一个用于布局的样式表（边距、内边距、对齐等）；你只需要为每个样式表包含一个`<link>`。从技术上讲，CSS\
  \ 标准要求当通过多个`<link>`标签呈现多个样式表时，Web 浏览器应允许用户在这些样式表之间进行选择。然而，在实践中，所有主流 Web 浏览器都会简单地包含每个样式表，除非它带有`rel=\"\
  alternate\"`属性。最佳实践建议限制你链接的样式表数量。这样可以减少对服务器的调用次数，从而加快页面加载速度。\n\n## 工作坊\n\n工作坊包含测验问题和练习，以帮助你巩固对所涵盖内容的理解。\n\
  \n### 测验\n\n**1.** 你会使用什么代码来创建一个样式表，指定 30 磅蓝色 Arial 标题，以及所有其他文本为 10 磅蓝色 Times Roman（或默认浏览器字体）？\n\
  \n**2.** 如果你将为问题 1 创建的样式表保存为`corporate.css`，你将如何将其应用于名为`intro.html`的网页？\n\n**3.**\
  \ 有多少种不同的方法可以确保样式规则能够应用于你的内容？\n\n**4.** 如何将你网站的所有页面连接到名为`mystyles.css`的样式表？\n\n\
  **5.** 在以下 HTML 中，文本“To come to the aid of their country”会是什么颜色？\n\n点击此处查看代码图片\n\
  \n```\n<div style=\"color:purple;\">\n  Now is the time\n  <p style=\"color:orange;\"\
  >for all good people</p>\n  <p>To come to the aid of their country.</p>\n</div>\n\
  ```\n\n**6.** `display: block;`属性有什么作用？\n\n**7.** 术语`px`是什么意思？\n\n**8.** 样式`border-right:\
  \ dashed red 2px;`有什么作用？\n\n**9.** 样式`border-radius: 1em 1.5em;`有什么作用？\n\n**10.**\
  \ 样式规则`.main { color: purple; }`有什么作用？\n\n**注意**\n\n对于那些在本书印刷版或电子版中阅读这些文字的人，提醒一下：如果你前往**[www.informit.com/register](http://www.informit.com/register)**并注册本书（使用\
