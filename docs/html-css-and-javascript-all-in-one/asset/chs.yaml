  ` | 设置元素周围四个边框的颜色。在未指定边框宽度和类型的情况下，无法使用边框颜色。 |\n| `src=\"address\"` | 提供图像的地址或文件名。\
  \ |\n| `alt=\"altdescription\"` | 提供图像的替代描述，在图像无法显示时显示，主要用于无法查看图像本身的用户。 |\n| **标签**\
