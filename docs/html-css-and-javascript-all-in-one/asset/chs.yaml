  \n## 第 28 节\n\n## 网站的组织与管理\n\n**你将在本节中学习到：**\n\n*   ![Image](img/arrow.jpg) 如何判断一个页面是否足以处理你所有的内容\n\
  *   ![Image](img/arrow.jpg) 如何组织简单的网站\n*   ![Image](img/arrow.jpg) 如何组织大型网站\n* \
  \  ![Image](img/arrow.jpg) 如何编写可维护的代码\n*   ![Image](img/arrow.jpg) 如何为搜索引擎优化你的网站\n\
  *   ![Image](img/arrow.jpg) 如何开始使用版本控制\n\n这些课程的大部分引导你学习了静态和动态网页内容的设计与创建，从文本到图形和多媒体，并额外加入了一点\
  \ JavaScript 交互。在此过程中，我们注意了一些你可以思考这些内容生命周期的方法。在本节中，你将学习如何从整体来看你的工作。\n\n本节将向你展示如何思考组织和展示多个网页，以便访问者能够在之间导航而不会感到困惑。你还将学习让你的网站具有吸引力并反复访问的方法。网页开发者使用\
  \ `sticky`（粘性）一词来描述人们不想离开的页面。希望本节能帮助你的网站变得非常“粘人”！你还将学习让你的页面在搜索引擎结果中获得更好曝光的技术，以便你的访问者首先就能找到你的页面。\n\
  \n由于网站可以（并且通常应该）频繁更新，创建易于维护的页面至关重要。本节将向你展示如何在页面中添加注释和其他文档，以便你——或你团队中的其他人——能够理解并修改你的页面。它还为你介绍了版本控制，以便你可以个人或作为团队的一部分进行创新，而不会覆盖你可能想要保存的工作。\n\
  \n到课程的这一步，你应该已经足够的 HTML 和 CSS 知识来制作你网站的大部分内容。你可能已经创建了许多页面，甚至已经将它们发布到了网上。\n\n在你继续学习本节时，思考你现在的页面是如何组织的，以及你可以如何改进这种组织。你是否在\
  \ HTML 中使用了注释，或者为未来的网站维护者创建了一份关于你内容组织的文档？如果没有，现在是一个开始尝试的好时机。在此过程中，如果你决定进行一项涉及更改几乎所有页面的重新设计，请不要惊讶。结果很可能是值得的！\n\
  \n### 当一个页面就足够时\n\n构建和组织一个吸引人且有效的网站并不总是需要一项复杂的任务。如果你是为单一实体（例如本地活动）创建一个网络展示，且只需要少量的信息，你可以有效地在单个页面上展示这些信息，无论是否带有大量图形。事实上，单页网站有几个优点：\n\
  \n*   ![Image](img/arrow.jpg) 网站上的所有信息下载速度都比内容更丰富的网站快。\n*   ![Image](img/arrow.jpg)\
  \ 整个网站可以通过一个命令打印在纸上，即使它有好几页。\n*   ![Image](img/arrow.jpg) 访问者可以轻松将网站保存到硬盘中以备后用，特别是当它使用的图形最小时。\n\
  *   ![Image](img/arrow.jpg) 同一页面不同部分之间的链接通常比指向其他页面的链接响应更快。\n\n图 28.1 显示了网页的第一部分，作为一个单一的长页面，它比多页面网站更好地服务于其目标受众。该页面的开头像大多数介绍性页面一样，简要解释了该页面关于什么以及谁会想阅读它。详细的目录允许访问者直接跳转到他们最感兴趣的内容。\n\
  \n![一张截图显示了良好目录的示例](img/28fig01.jpg)\n\n**图 28.1** 良好的目录可以让长页面更容易导航\n\n当页面包含目录来分隔信息部分时，通常每个短章节也会包含一个返回目录的链接，这样在页面上的导航感觉与在多页面之间导航非常相似。因为这类长页面的内容旨在作为方便的参考，访问者无疑更倾向于书签或保存单个页面，而不是保存\
  \ 8 或 10 个独立的页面。单页信息网站最常见的例子包含在维基百科中，地址为 [www.wikipedia.org](http://www.wikipedia.org)。\n\
  \n\n\n\n\n在体验过许多精美且有效的在线图形布局后，你可能会忘记：使用一个良好的、传统的大纲，通常是组织网站内充满文本内容的长 Web 页面最清晰、最有效的方法。随着单页界面（也称为单页应用）的涌入，这一点尤为真实，因为这些界面试图将桌面应用程序的所有交互性带到网页浏览体验中。这些应用程序通常使用\
  \ HTML 和 JavaScript 框架构建，并包含大量的视觉设计元素；事实上，这些网站通常用于发布设计作品集，而不是你在这里看到的这类基于文本的内容。\n\
  \n### 组织简单的网站\n\n除了上述单页应用和作品集网站等特殊情况外，大多数单页网站往往仅起到“即刻上线”或占位符的作用。如果你在网络上花费了任何时间，你会很快发现，大多数公司和个人为读者提供最佳服务的方式，是将网站划分为短小的、易于阅读的页面，并在周围环绕图形导航，使用户能够在几次点击内获取几乎他们想要的所有信息。此外，使用多个页面而不是一系列极长的页面可以最大限度地减少页面滚动，这对于使用移动设备查看完整网站或显示器分辨率较低（低于\
  \ 800 × 600）的访问者尤为不利。\n\n网站的根本目标是让个人或组织在互联网上可见，但另一个重要——且更重要的目标是作为进入网站内部信息的门户。网站的主页应该为用户提供足够的信息，以对组织提供清晰的画像，以及传统的联系方式和用于提交问题或反馈的电子邮件地址。它还应该提供通往网站其他页面中高度结构化信息的清晰路径。图\
  \ 28.2 所示的主页提供了所有这些良好功能的示例：基本信息、联系信息以及面向多个受众的访问路径。\n\n![华盛顿大学主页的截图。](img/28fig02.jpg)\n\
  \n**图 28.2** 这所大学的主页使用了基础设计、极简但实用的图形和清晰的结构，以吸引用户探索更多信息。\n\n### 注意\n\n无论你的网站有多大，仔细地组织你的资源都是一个好主意。例如，将网页的图像放置在名为\
  \ `images` 的单独文件夹中是是组织工作的一步。同样，如果你有可下载的文件，请将它们放在名为 `downloads` 的文件夹中。这使得根据特定类型（HTML\
  \ 页面、PNG 图像等）跟踪网页资源变得容易得多。此外，如果你将网站划分为不同的部分（如公司、产品和新闻），请将各个页面放入命名相似的目录（`company`、`products`、`press`\
  \ 等）——出于同样的组织考量。\n\n初级网站开发者会犯的最常见错误之一是创建看起来与网站上其他页面根本完全不同的页面。同样严重的错误是使用成千上万其他 Web\
  \ 作者也在使用的公开剪贴画。记住，在互联网上，点击一下就能带你环游世界。让你的页面令人印象深刻并作为一个整体网站被识别的唯一方法，就是让你所有页面都遵循一个独特、不可混淆的视觉主题。换句话之，要努力与其他网站保持独特性，同时在网站内部保持统一性。\n\
  \n作为统一性如何帮助网站更具凝聚力的例子，请一下你可能访问过的大型热门网站，例如 [ESPN.com](http://ESPN.com)。如果你访问 [ESPN.com](http://ESPN.com)\
  \ 的 MLB 频道（见 图 28.3），然后访问 NFL 频道（见 图 28.4），你会注意到结构非常相似。\n\n![E S P N.com 网站的截图。](img/28fig03.jpg)\n\
  \n**图 28.3** ESPN.com 上的 MLB 频道。\n\n![显示 E S P N 网站 NFL 部分的截图。](img/28fig04.jpg)\n\
  \n**图 28.4** [ESPN.com](http://ESPN.com) 上的 NFL 频道。\n\n在这两个例子中，你在页面顶部看到导航元素（包括一些子导航元素），页面中间有一个大区域用于特色项目图形，右侧有一个包含指向头条新闻链接的矩形，以及主图下方的一组二级矩形，引导读者阅读更多故事。MLB\
  \ 频道和 NFL 频道之间的唯一区别是内容。然而，在两个部分中，你都清楚如果你想阅读热门新闻，就看页面右侧。如果你想导航到网站的另一个部分或网站主页，就看页面顶部的导航元素。\n\
  \n一致的设计和组织元素的存在有助于确保你的用户能够放心地贯穿你的内容。从维护的角度来看，一致的结构模板允许你重用底层代码片段。这种代码重用通常通过动态服务器端编程实现，这超出了本课程的范围，但总来说，这意味着不需要反复复制粘贴相同的\
  \ HTML、CSS 和 JavaScript，客户端代码只存在于一个地方，并动态应用到内容中。因此，例如，与其修改数千个文件来将背景从蓝色改为绿色，你只需要修改一次。\n\
  \n### 组织更大的网站\n\n对于更复杂的网站，当贯穿页面使用时，复杂的布局和图形可以帮助组织并改善网站的外观。为了看到如何让美学和组织齐头工作，让我们看看几个呈现大量信息的网站的导航（以及底层组织）示例。\n\
  \n图 28.5 显示了 Amazon.com 的主页，特别是选定了导航部分。Amazon 的业务是销售产品，简单直接。因此，让 Amazon 显示类别作为主要的导航元素是合理的。\n\
  \n![Amazon 网站的截图。显示了“部门”部分下的各种链接。这些链接根据类别划分，例如书籍和有声书、电视和视频、计算机、平板电脑和 PC 产品。](img/28fig05.jpg)\n\
  \n**图 28.5** [Amazon.com](http://Amazon.com) 显示产品类别作为主要的导航元素。\n\n尽管 Amazon 的业务是销售产品，但它还需要提供关于它是谁、如何联系它以及其他辅助但重要的信息，以增强企业消费者关系。此类信息的链接出现在\
  \ [Amazon.com](http://Amazon.com) 网站的页脚（或底部部分）——位于此截图的视野之外。\n\n\n\n\n\n下一个示例是 Peet’s\
  \ Coffee 网站（[www.peets.com](http://www.peets.com)）中的二级页面。Peet’s 网站的所有页面都遵循常见的导航和子导航展示类型之一：用于主导航的水平条，并将该部分的二级元素放置在左侧的垂直列中。如图\
  \ 28.6 所示，二级导航会根据用户访问的页面而变化——在某些情况下，它甚至会完全消失。这些类型的视觉指示有助于用户在站点内定位。使用像颜色变化或内容变化这样的视觉指示是一种实用的策略，因为你的用户可能会通过搜索引擎或来自另一个网站的链接到达某个页面。在用户到达后，你希望他们感到宾如家——或者至少感觉自己处于你网站的什么位置。\n\
  \n![Peet’s Coffee 网站截图。](img/28fig06.jpg)\n\n**图 28.6** 这个 Peet’s Coffee 二级页面显示了一个主导航元素，页面左侧有不同的二级导航。\n\
  \n从这些不同的主导航元素——工艺（Craft）、咖啡（Coffee）、茶（Tea）、冷萃（Cold Brew）、设备（Gear）、礼物（Gifts）、订阅（Subscriptions）和咖啡吧（Coffeebars）可以看出，Peet’s\
  \ 网站必须满足因各种原因访问网站的不同类型的人的需求。当你组织自己的站点内容时，要确定对你最重要的信息以及对你的用户最重要的信息，并创建一个在两者之间找到良好平衡的导航方案。\n\
  \n图 28.7 显示了另一种导航风格示例，这次对标准的顶部导航/左侧导航方案进行了改进。在这个示例中，左侧导航（在此情况下为二级导航）也出现在主导航下的下拉菜单中（有关如何实现此类操作，请参阅第\
  \ 11 节“使用 CSS 为列表、文本和导航实现更多功能”）。将鼠标悬停在任何其他主导航元素上都会弹出类似的菜单。这种方案让用户指尖下就有了整个站点地图，因为他们从任何其他页面点击一下即可到达网站的任何部分。\n\
  \n![B ’A’ W S I 官方网站截图。顶部主导航中选中了“About”链接，显示出一个带有三个更多点击选项的下拉菜单。](img/28fig07.jpg)\n\
  \n**图 28.7** [BAWSI.org](http://BAWSI.org) 网站显示了附加在每个主导航元素上的子导航。\n\n还要注意导航中的“About\
  \ Us”链接样式与不同——使用了亮橙色文本——与页面上的其他链接不同，这告知访问者他们正处于哪个页面。这个视觉细节是让用户感知其在当前导航方案中所位置的一种无形方式。你还可以使用其他样式特征，如背景颜色、更改字体大小，甚至使用不同的字体族。某些网站还使用图标来指示在站点上的位置。\n\
  \n你可以从许多类型的导航样式和向用户指示他们在哪里以及可能想去哪里的方法中选择。记住以下事实：研究反复表明，当人们一次面对超过七个选择时，他们会感到困惑和恼躁，而人们对五个或更少的选择感到最舒适。因此，如果可能，你应该避免并列展示五个以上的链接（无论是列表形式还是图形图标形式）——你绝对应该避免一次展示超过七个链接。[Amazon.com](http://Amazon.com)\
  \ 在这里是被允许的，因为它是一个互联网超级商店，用户到达那里时预预期会有很多“部门”可以购物。但当你需要在导航列表中展示七个以上的链接时，请将它们拆分成多个列表，并为每五个到七个项目设置一个单独的标题。\n\
  \n如果你避免将任何页面放在距离主页两个（或最多三个）链接之外，也将帮助你的读者在不困惑的情况下导航你的站点。在读者读完从属页面后，你应该始终将他们带回主分类页面（或首页）。换句话说，尝试设计一种较为扁平的链接结构，使大多数页面的深度不超过一或两个链接。你不希望访问者严重依赖于浏览器的“后退”按钮来导航你的站点。\n\
  \n### 为搜索引擎优化你的站点\n\n管理网站的一个主要部分是使其准备好搜索引擎。虽然并非所有网站都依赖搜索引擎获取流量，但大多数都是如此，因此了解`搜索引擎优化`（`SEO`）的基础知识是一个好主意，这样你就不会做出损害流量的错误。\n\
  \n你需要做的是确保你的站点提供了客户和搜索引擎都可以用来找到你所在站点的信息。\n\n世界上有几十种搜索引擎，它们都使用不同的方法来确定哪些站点在结果中显示在前面。但你可以做几件事，无论你的客户使用什么搜索引擎，都能帮助提高你的站点排名：\n\
  \n*   ![图像](img/arrow.jpg) **有趣的内容**——这是搜索引擎友好型网站最重要的特征。你需要有人们想要阅读和查看的文本、多媒体和图像。\n\
  *   ![图像](img/arrow.jpg) **易于使用的导航**——你希望访问你站点的游客尽可能留下来，无论他们最后停留在哪个页面。\n*   ![图像](img/arrow.jpg)\
  \ **移动端友好**——移动端友好的网站对于搜索引擎排名至关重要。越来越多的人使用移动设备，Google 和其他搜索引擎正在转向优先考虑移动端友好设计的索引。\n\
  \n#### 创建有趣的内容\n\n过去，为了在搜索引擎中获得良好的排名，你的内容必须充满关键词。虽然关键词具有重要性，但它们没有内容本身重要。内容需要是有趣、易于阅读且详尽。你不能在站点上仅靠简短、乏味的文章来过关。你需要编写结构完整的文档，深入涵盖你正在撰写的任何任何主题。\n\
  \n### 注意事项\n\n并不是所有的页面都需要针对搜索进行优化，或者在上面有长篇内容。像首页和导航页面这样的页面可以很短，并提供指向站点其他部分的链接和信息。将你的\
  \ SEO 精力放在发布在站点上的实际内容文章（以及视频和图像）上。以下是确保你的页面有足够的深度内容的技巧：\n\n*   ![图像](img/arrow.jpg)\
  \ 长而又长——2000 字或更多。\n*   ![图像](img/arrow.jpg) 使用 `h2`、`h3` 和 `h4` 等带有正确层级的标题创建文档大纲。\n\
  *   ![图像](img/arrow.jpg) 包含良好的内部导航。\n*   ![图像](img/arrow.jpg) 不要忘记表格、插图和图表。\n\n\
  如果你决定要在文档中使用关键词，请关注潜在语义索引（LSI）关键词。这些是在不同语境下具有相同含义的关键词短语。如果这听起来太技术化，不要太担心：写写你的文章即可。但如果你真的想确保涵盖了这些内容，可以使用像\
  \ `LSIGraph` ([`lsigraph.com`](https://lsigraph.com)) 这样的工具为你生成关键词。\n\n#### 保持导航的可用性\n\
  \n搜索引擎导航你的站点的方式与人类用户相似（尽管它们通常快得多）。因此，你需要确保你的站点导航可以正常工作并让用户到达任何可用页面。永远不要使用 `JavaScript`\
  \ 作为访问站点导航的唯一方式——尤其是主导航。\n\n\n\n\n但不要忘记内部导航。由于你正在编写长篇且深入的文章，你应该在文档内部建立某种形式的导航。这可以是目录，也可以是指向页面其他部分的额外链接。如果你不记得如何操作，现在是回去回顾第\
  \ 7 节“使用外部链接和内部链接](#ch07.xhtml)”的好时机。\n\n## 为移动设备编写\n\nGoogle 和其他搜索引擎正越来越重视移动设备和移动端友好型页面。如果你的页面在移动设备上错乱、难以阅读或外观难看，那么你在搜索引擎中的排名就不会理想。越来的人将移动设备作为首选或访问网页的唯一工具；通过通过让你的网站具有移动端友好型特性，你将获得更好的排名，并拥有更满意的客户。\n\
  \n如果你一直在遵循之前课程中关于为移动设备编写内容的说明，特别是第 17 节中关于移动优先的信息“为移动设备设计”，那么你已经在创建一个适用于移动端和搜索引擎的网站的良好道路上了。但请记住这些关键提示：\n\
  \n*   ![Image](img/arrow.jpg) 编写有效的 HTML、CSS 和 JavaScript。\n*   ![Image](img/arrow.jpg)\
  \ 让你的页面具有响应式。\n*   ![Image](img/arrow.jpg) 记住下载速度非常重要，因此请保持页面尽可能小——但不要再小了。\n*  \
  \ ![Image](img/arrow.jpg) 永远不要向移动用户隐藏内容。改变显示方式没有关系，但无论客户使用什么设备，内容都应该是可用的。\n*   ![Image](img/arrow.jpg)\
  \ 使用 Google 的移动端友好测试工具([`search.google.com/test/mobile-friendly`](https://search.google.com/test/mobile-friendly))\
  \ 查看你的网站对移动端客户来说有多用。\n\n## 编写可维护的代码\n\n如果你在阅读这些课程之前进行过任何编码，你已经知道编写可维护的代码有多么重要——也就是说，你或其他人以后查看你的代码时，不应该被它完全搞晕。挑战在于让你的代码尽可能地让人一眼就能看懂。总有一天，当你回看自己写的一个页面时，你完全不知道当时在想什么，或者为什么要那样写代码。幸运的是，有一种方法可以对抗这种显性的记忆遗失问题。\n\
  \n### 使用注释记录代码\n\n每当你开发一个 HTML 页面、CSS 代码段或 JavaScript 函数时，请记住，你或其他人某天可能需要对其进行更改。简单的文本网页通常易于阅读和修改，但包含图形、表格和其他布局技巧的复杂页面可能非常难以解析。\n\
  \n### 注意\n要在样式表中包含注释，请以 `/*` 开始注释并以 `*/` 结束（将你的注释代码放在这两个字符之间）。\n\nHTML 的 `<!--`\
  \ 和 `-->` 注释语法在样式表中不起作用。\n\n为了查看我在说什么，请在网络浏览器中访问几乎任何页面并查看其源代码。使用 Microsoft Edge，右键点击页面并选择“查看源代码”。使用\
  \ Chrome 或 Firefox，右键点击页面并选择“查看源代码”。在 Safari 中，右键点击页面并选择“显示网页源代码”。你可能会看到一堆杂乱的代码，就像纯\
  \ HTML 一样难以解析。这可能是因为内容管理软件系统动态生成了标记，也可能是因为其人工维护者没有注意结构、易读性、代码注释以及其他让人类可读的方法。为了维护你自己的页面，我鼓励你对\
  \ HTML 标记、样式表条目和 JavaScript 代码实施更多的秩序。记住：正确的缩进是你（以及你未来开发伙伴的）的好朋友。\n\n### 注意\n有些设计师使用压缩化程序来压缩他们的\
  \ HTML、CSS 和 JavaScript，以确保它们尽可能小。这可以加快页面的下载速度，但会让代码难以阅读。一种解决方案是使用如 CodeKit ([`codekitapp.com`](https://codekitapp.com))\
  \ 的工具，在你编写代码之后、交付到上线网站之前对其进行压缩化。CodeKit 仅适用于 Mac。如果你在寻找 Windows 的替代品，一种可能性是 Prepros\
  \ ([`prepros.io`](https://prepros.io))。你压缩代码是为了让页面更快，但你只在完成并准备发布时才这样做一次。\n\n正如你在这些课程中看到的，你可以使用\
  \ HTML 的起始和结束注释语法为你自己或共同作者编写注释：`<!--` 和 `-->`。这些注释在浏览器中查看时不会显示在网页上，但任何通过文本编辑器或通过浏览器的“查看源代码”（或查看网页源代码或显示网页源代码）功能检查\
  \ HTML 代码的人都可以阅读它们。以下示例提供了如何编写注释的简要回顾：\n\n点击此处查看代码图像\n\n```\n<!-- 此图像需要每天更新。 -->\n\
  \n<img src=\"headline.jpg\" alt=\"Today's Headline\">\n```\n\n### 注意\n注释的一个方便用途是隐藏当前正在建设中的网页部分。与其让文本和图形可见并解释它们正在建设中，不如在你不希望显示的\
  \ HTML 周围仔细放置起始和结束注释指示符，将它们完全隐藏。\n\n正如这段代码所示，`<img>` 标签之前的注释提供了关于如何使用图像的线索。网络浏览器会完全忽略注释中的文本。\n\
  \n#### 尝试一下\n\n为你的代码注释\n\n现在花时间回顾目前为止创建的所有页面和样式表，并在你或其他人修改它们时添加发现的注释是非常值得的。操作方法如下：\n\
  \n1.  在实现花哨格式或布局技术的标签之前，插入注释来解释任何复杂的格式或布局技术。\n2.  在 `<img>` 标签之前使用注释，对任何功能从 `alt`\
  \ 消息中并不明显的图形进行简要描述。\n3.  考虑使用注释（或几条注释）来总结 `<table>` 的单元格应该如何对齐。\n4.  如果你使用十六进制颜色代码（例如\
  \ `<div style=\"color: #8040B0;\">`），请插入注释指示该颜色实际上是什么（蓝紫色）。\n5.  缩进你的注释以帮助它们脱颖而出，并让注释以及\
  \ HTML 或 CSS 更易于阅读。\n\n不要忘记在 HTML、CSS 或 JavaScript 本身也使用缩进来让它们更具可读性，正如下一节所提到的。\n\
  \n你还可以以类似的方式为 CSS 和 JavaScript 注释。这是一个 CSS 注释：\n\n点击此处查看代码图像\n\n```css\n/* 这些是主重置样式\
  \ */\n```\n\n这是一个 JavaScript 注释：\n\n```javascript\n// 这一行被注释掉了\n```\n\n#### 为了清晰对代码进行缩进\n\
  \n我们必须坦白。在这些课程中，我们一直在潜移默化地引导你接受一种 HTML 代码开发风格，而并没有说明。现在是时候揭秘了。你一定注意到课程中所有 HTML 代码在缩进方面有一个一致的模式。具体来说，每个子标签都比父标签向右缩进两个空格。此外，跨越多行的标签内容在标签内部也会缩进。\n\
  \n\n\n\n\n学习缩进价值的最佳方法是看一些没有缩进的 HTML 代码。你知道那句歌是怎么唱的——“失去后你才懂得拥有过什么。”总之，这里有一个没有使用任何缩进的简单表格：\n\
  \n点击此处查看代码图像\n\n```html\n<table><<tr><td>Cell One (Cell One)</td><td>Cell Two (Cell\
  \ Two)</td></tr><<tr><td>Cell Three (Cell Three)</td><td>Cell Four (Cell Four)</td></tr></table>\n\
  ```\n\n这里不仅没有缩进，表格内部行与列之间也没有空格。现在将上面的代码与下面的代码进行比较，后者描述的是同一个表格：\n\n```html\n<table>\n\
  \  <tr>\n    <td>单元格一 (Cell One)</td>\n    <td>单元格二 (Cell Two)</td>\n  </tr>\n \
  \ <tr>\n    <td>单元格三 (Cell Three)</td>\n    <td>单元格四 (Cell Four)</td>\n  </tr>\n\
  </table>\n```\n\n这种带有高度缩进的代码让你清晰地看到是如何通过 `tr` 和 `td` 标签来划分行和列的。\n\n在让你的 HTML 代码易于理解和维护方面，保持一致的缩进可能比注释更重要。而且你不必认同这种特定的缩进策略。如果你更愿意使用三个或四个空格而不是两个，那是可以的。如果你想让结构紧凑一点，不对标签内的内容进行缩进，那也行。这一节的要点是：形成一套你自己的（或你团队自己的）编码风格，并毫不留情地坚持下去。\n\
  \n### 注意\n如果你在开发网站或基于 Web 的应用程序时与其他人合作（或计划合作），请考虑聚在一起制定一种一致的编码风格。这样，大家就能在同一个频道上了（这里是个双关语）。\n\
  \n#### 思考版本控制\n\n如果你用过 Google Docs，你就已经遇到过某种形式的版本控制；当你使用 Google Docs 时，Google 会会在你打字时自动保存你的工作修订版本。这与简单地自动保存工作不同（尽管它也这样做），因为你可以回溯到过程中的任何一个修订版本。你可能在使用流行的博客写作软件（如\
  \ Blogger 或 WordPress）甚至在编辑 wiki 时遇到过这个概念——这两类应用程序都允许用户修改其工作，而不会覆盖（即永久删除）他们之前的工作。\n\
  \n你可能会在想：“嗯，这与开发 HTML、CSS 或 JavaScript 有什么关系？你只是在讨论文档。”答案很简单：就像你可能想回到文章或信件的之前的版本一样，你也可能想回到你的\
  \ HTML、CSS 或 JavaScript 代码的之前的版本。这可能是因为你把一个好想法执行到底，但你的标记证明是不可行的，你不想完全从头开始——你只想恢复到修订路径上的某一点。或者，比比，你开发了一段非常复杂的\
  \ JavaScript，发现其中间的某个部分出了问题。\n\n#### 使用版本控制系统\n\n目前有多种版本控制系统可以使用，有些是免费开源，有些是专有的。一些流行的系统包括\
  \ Subversion (`subversion.apache.org`)、Mercurial (`www.mercurial-scm.org`) 和 Git\
  \ (`www.git-scm.com`)。如果你有允许安装任何此类工具的 Web 托管服务，你可以创建自己的仓库，并使用 GUI 或命令行客户端连接到它。然而，对于想要开始使用仓库但不一定想要、需要或理解随之而来的额外安装和维护开销的用户来说，有很多托管版本控制系统可以供个人和开源项目免费使用。这些托管解决方案不仅针对个人；各种大小的公司和组织都在使用托管版本控制系统，例如\
  \ GitHub (`www.github.com`) 或 Bitbucket (`www.bitbucket.org`)。只需几美元，你就可以将免费的公共账户转换为私人账户，并将代码留给自己。\n\
  \n你将听到比这里列出的多多的术语，但如果你能概念化仓库（repository）、（本地）工作副本（working copy）以及提交（check in）和检出（check\
  \ out）的过程，你就已经在实现对象版本控制的道路上了。\n\n- **Commit/check out** —— 当你把代码放入仓库时，你 `commit`；当你获取一个文件时，你执行\
  \ `check out`。\n- **Branch or fork** —— 当你想创建新路径时，你对仓库进行 `branch` 或 `fork`。\n- **Change\
  \ or diff** —— `change` 和 `diff` 两个词都指的是修改。你可能还会听到 `diff` 作为动词用于比较两个版本。\n- **Fork,\
  \ push, pull, and fetch** —— 当你发现一个想要使用的开源仓库时，你对其进行 `fork`。从派生的仓库中，你可以 `push` 提交，从原始仓库\
  \ `fetch` 更改，并向所有者发出 `pull requests`（拉取请求）。\n\n\n\n\n\n如果你使用内容管理系统（CMS），如 WordPress\
  \ ([www.wordpress.org](http://www.wordpress.org)) 或 Drupal ([www.drupal.org](http://www.drupal.org))\
  \ 来构建你的网站，你最终将使用一个专为这些系统之一设计的演示模板。但如果你*并不*想使用 CMS，而是*想要*获得一个用于高级 HTML 和 CSS 展示的起点，该怎么办？在过去的几年里，网页开发领域见证了\
  \ HTML 和 CSS（或“前端”）框架的兴起，这些框架可以帮助解决这个问题。其中许多框架是开源的，可以从 GitHub 仓库下载或分派（forking）。这些框架通常还包含高级的\
  \ JavaScript 库，就像你在第 26 节“使用第三方 JavaScript 库和框架”中学习过的那些一样。\n\n我为你推荐三个流行的 HTML 和\
  \ CSS 框架：\n\n*   ![Image](img/arrow.jpg) **Bootstrap**——由 Twitter 的工程师内部开发，该框架是开源软件，适用于任何想要用它开始学习现代设计元素的人可以在\
  \ [`getbootstrap.com`](http://getbootstrap.com) 了解更多，那里包含一个简单的“快速开始”部分，解释了包含的内容以及如何使用。或者你可以获取\
  \ Jennifer 的书 *Sams Teach Yourself Bootstrap in 24 Hours*。\n\n*   ![Image](img/arrow.jpg)\
  \ **Foundation**——另一个开源框架，Foundation 强调响应式设计，以便使用各种设备（从台式电脑到手机）的人欣赏并使用你的网站。可以在 [`foundation.zurb.com`](http://foundation.zurb.com)\
  \ 了解更多，那里包含一个详尽的“快速开始”部分，详细介绍了你可以使用的显示模板的组件。\n\n*   ![Image](img/arrow.jpg) **HTML5\
  \ Boilerplate**——这是最精简的框架之一，可能对初学者最有用，因为它提供了你所需的基础知识，而不会让各种可能性让你无压力。可以在 [`html5boilerplate.com`](http://html5boilerplate.com)\
  \ 了解更多，并查看 GitHub 仓库中维护的文档。\n\n尽管前端框架对于加速网页开发的一些基础工作非常有用，但你面临着陷入“模版化”陷阱的风险，导致你的网站看起来和其他所有网站都一样（至少是使用相同框架的那些）。然而，只要有一点创意，你可以避免那个陷阱。\n\
  \n### 总结\n\n本节为你提供了示例和解释，帮助你将网页组织成一个连贯的网站，该网站信息丰富、具有吸引力、在搜索引擎中易查找且便于导航。网页用户已经变得非常精明，并期望设计良好的网站，如果他们体验到难以导航的糟糕设计，他们会迅速放弃你的网站。\n\
  \n本节还讨论了通过大量使用注释和缩进来使代码易于维护的重要性。注释不仅在你以后重温代码时作为你的提醒，还可以作为日后某人继承你代码的说明。缩进可能看起来像是一个微小的美学问题，但它可以帮助你一眼就能快速分析并理解网页的结构。\n\
  \n由于你可能很快就会为自己或为自己以及小组中的其他开发者需要代码管理工具，本节向你介绍了几个版本控制概念。版本控制使你能够在不丢失稳固的生产级工作的情况下进行创新，并为其他开发者在你的代码库中工作提供更多机会。\n\
  \n最后，你学习了一些关于 HTML 和 CSS 框架的知识，这类框架有很多。这些框架通过为你提供已经包含现代且经过验证标记的模板，帮助你加速网页开发项目。\n\
  \n### 问答\n\n**Q. 添加大量注释和空格会让别人在查看我的页面时加载速度变慢吗？**\n\n**A.** 短短的回答是不会，因为文本很小，对文件大小的增加不大。但你仍然应该考虑这一点，因为这是搜索引擎在评估页面时考虑的因素。如果你的网站比另一个排名相同的网站慢\
  \ 1/10 秒，那么另一个网站在搜索引擎索引中将获得优先于你的位置。你可以做的一件事是在发布之前删除所有注释和多余空格来压缩（minify）代码。你可以在 [`developers.google.com/speed/docs/insights/MinifyResources`](https://developers.google.com/speed/docs/insights/MinifyResources)\
  \ 了解更多关于 HTML、CSS 和 JavaScript 压缩的概念。\n\n**Q. 使用版本控制对我这个微小的个人网站来说似乎大材小用了。我必须使用它吗？**\n\
  \n**A.** 当然不需要。任何类型的网站（个人或其他其他）都并不要求处于版本控制或其他备份系统之下。然而，大多数人都经历过数据丢失或网站崩溃，因此如果你不使用版本控制，我强烈建议至少对你的文件执行某种形式的自动备份。我说的“外部系统”是指任何外部驱动器，无论是连接到你计算机的物理驱动器，还是云备份服务，如\
  \ Google Drive ([`drive.google.com`](https://drive.google.com))、Microsoft OneDrive\
  \ ([`onedrive.live.com`](https://onedrive.live.com)) 或 Apple iCloud ([`www.apple.com/icloud/`](https://www.apple.com/icloud/))。\n\
  \n## 工作坊\n\n工作坊包含测试题和活动，帮助你巩固对涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n**1.**\
  \ 你如何确保你的所有页面形成一个单一连贯的网站？\n\n1. 使用一致的背景、颜色和字体。\n2. 在页面顶部重复文字或图形。\n3. 避免重复。\n\n**2.**\
  \ 你应该始终在主页包含哪些类型的信息？\n\n1. 站点名称和描述性信息\n2. 站点名称和联系表\n3. 联系表和产品列表\n\n**3.** 你想对未来的编辑器说：“不要更改图片。这是我唯一的机会。”但你不希望查看页面的用户看到这条消息。你可以这样做？\n\
  \n1. 将消息放在 CSS 中。\n2. 将消息放在 JavaScript 中。\n3. 将消息放在注释中。\n\n**4.** 单页网站的优点是什么？\n\n\
  1. 移动端友好\n2. 下载快\n3. 人们更喜欢链接\n\n**5.** 为了最大化可用性，导航栏中的链接最大数量是多少？\n\n1. 七\n2. 六\n\
  3. 五\n4. 四\n\n**6.**  SEO 的一个重要方面是？\n\n1. 有趣的内容\n2. 易于导航\n3. 移动端友好\n4. 以上所有\n\n\
  **7.** 编写可维护代码的方法是？\n\n1. 使用注释\n2. 使用代码模板\n3. 使用用户友好标签\n4. A 和 B\n\n**8.** `diff\
  \ a version-controlled file` 意味着什么？\n\n1. 向仓库添加新版本\n2. 将该版本与仓库中的副本进行比较\n3. 修改仓库中的版本\n\
  4. 回滚到之前的版本\n\n**9.** 你可以如何编写移动端友好的网站？\n\n1. 将页面做成需要的大小。\n2. 编写有效的 HTML。\n3. 为了质量而非速度优化图像。\n\
  4. B 和 C\n\n**10.** 为什么要使用 Bootstrap 这样的 HTML 框架？\n\n1. 加快页面加载。\n2. 让你的代码更易读。\n\
  3. 利用一个用于编写高级设计的系统。\n4. A 和 B\n\n\n\n\n\n为正在阅读本书纸质版或电子书版本的读者提醒一下：如果您访问 `www.informit.com/register`\
  \ 并注册本书（使用 ISBN `9780672338083`），您将免费获得在线 Web 版权限。该版本不仅包含本书的完整文本，还包含此测验的交互版本。\n\n\
  ## 回答\n\n**1. d.** 使用一致的背景、颜色、字体和样式。在页面顶部重复使用与链接指向的页面相同的链接文字或图形。在网站的每个页面上重复相同的微页眉、按钮或其他元素。\n\
  \n**2. a.** 使用足够的标识信息，让用户能够立即看到网站名称并理解其内容。此外，无论你想要传达给目标受众最重要的信息是什么，请直接、简洁地陈述。无论是你的使命宣言还是注册商标的营销口号，都要确保它处于显眼位置。\n\
  \n**3. c.** 在 `<img>` 标签之前立即放置以下注释：\n\n```html\n点击此处查看代码图像\n\n<!-- 不要修改我的这张照片。\n\
  \n      这是我唯一的永生的机会。 -->\n```\n\n**4. b.** 单页网站下载快，可以完整打印，可以保存到硬盘上，并且内部链接的响应通常比外部链接更快。\n\
  \n**5. a.** 如果主导航中的链接超过七个，大多数人会感到困扰，他们更倾向于看到五个或更少的链接。\n\n**6. d.** 你的网站应该有有趣的内容、易于使用的导航，并且支持移动设备。\n\
  \n**7. d.** 使用注释来记录代码，并使用代码模板（缩进）来格式化代码以便阅读。\n\n**8. b.** 这意味着你正在将其与仓库中的版本或其他版本进行比较。\n\
  \n**9. b.** 编写有效的代码（HTML、CSS 和 JavaScript）。创建响应式页面。使页面尽可能小。永远不要因为用户使用移动设备就向他们隐藏内容。在移动设备友好测试工具中测试你的页面。\n\
