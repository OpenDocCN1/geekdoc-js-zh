  heading1\")`\n4. `documents.getElementsById(\"heading1\")`\n\n**3.** 下列哪个标签可以用来创建层？\n\
  \n1. `<layer>`\n2. `<div>`\n3. `<style>`\n4. `<p>`\n\n**4.** 哪个属性控制元素从左到右的位置？\n\n\
  1. `left`\n2. `width`\n3. `lrpos`\n4. `position`\n\n**5.** 下列哪条 CSS 规则会创建一个当前在页面上不可可见的标题？\n\
  \n1. `h1 {visibility: invisible;}`\n2. `h1 {display: none;}`\n3. `h1 {style: invisible;}`\n\
