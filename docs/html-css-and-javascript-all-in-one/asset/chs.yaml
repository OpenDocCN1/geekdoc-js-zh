  \n### 粗体、斜体和特殊文本格式化\n\n回到打字机时代，我们满足于纯文本显示，并偶尔使用下划线来表示强调。如今，**粗体**和*斜体*文本已成为所有纸质通信的标配。自然地，您也可以在网页内容中添加粗体和斜体文本。多种标签和样式规则使文本格式化成为可能。\n\
  \n注意\n\n虽然您应该尽可能使用样式来影响呈现效果，但在处理粗体和斜体文本时，使用 `<strong></strong>` 和 `<em></em>` 标签对是使用样式规则的一种替代方案。在大多数浏览器中，`<strong>`\
  \ 标签的作用与 `<b>` 标签相同，而 `<em>` 标签的作用就像 `<i>` 标签一样，将文本格式化为斜体。当然，您可以根据喜好对这些标签进行样式定义，但上述内容是默认效果。\n\
  \n`<strong>` 和 `<em>` 标签被认为是对 `<b>` 和 `<i>` 的改进，因为它们仅暗示文本应获得特殊强调，而不具体规定如何实现该效果。换句话说，浏览器不一定必须将\
  \ `<strong>` 解释为粗体或将 `<em>` 解释为斜体。这使得 `<strong>` 和 `<em>` 在 HTML5 中更加合适，因为它们在影响文本显示方式的同时，还为文本增加了语义。\n\
  \n为文本添加粗体和斜体格式的传统方法（此处简要讨论，因为如果您选择查看，在许多旧网站的源代码中不可避免地会看到它）涉及 `<b></b>` 和 `<i></i>`\
  \ 标签对。对于粗体文本，您用 `<b>` 和 `</b>` 标签将文本包裹起来。同样，要使任何文本以斜体显示，请将其包含在 `<i>` 和 `</i>` 标签中。虽然这种方法在浏览器中仍然有效，但它不像\
  \ CSS 文本格式化样式规则那样灵活和强大，应当尽量避免使用。\n\n\n\n\n\n第三部分“使用 CSS 进行高级网页设计”将更深入地探讨 CSS 样式规则，但在这里进行一点铺垫是合适的，以便您了解一些基本的文本格式化选项。`font-weight`\
  \ 样式规则允许您通过样式规则来设置字体的粗细（weight）或加粗程度（boldness）。`font-weight` 的标准设置包括 `normal`、`bold`、`bolder`\
  \ 和 `lighter`（其中 `normal` 为默认值）。斜体文本通过 `font-style` 规则控制，您可以将其设置为 `normal`、`italic`\
  \ 或 `oblique`。如果您想应用多个规则，也可以将样式规则组合在一起，如下例所示：\n\n点击此处查看代码图片\n\n```\n<p style=\"\
  font-weight:bold; font-style:italic;\">This paragraph is bold and\nitalic!</p>\n\
  ```\n\n在这个例子中，两个样式规则都指定在 `<p>` 标签的 `style` 属性中。使用多个样式规则的关键在于它们必须用分号 (`;`) 隔开。\n\n\
  不过，您并不局限于在段落中使用字体样式。以下代码展示了如何在项目符号列表中将文本设为斜体：\n\n点击此处查看代码图片\n\n```\n<ul>\n  <li\
  \ style=\"font-style:italic;\">Important Stuff</li>\n  <li style=\"font-style:italic;\"\
  >Critical Information</li>\n  <li style=\"font-style:italic;\">Highly Sensitive\
  \ Material</li>\n  <li>Nothing All That Useful</li>\n</ul>\n```\n\n您也可以在标题中使用 `font-weight`\
  \ 样式规则，但较粗的字体通常对标题没有影响，因为标题默认就是加粗的。\n\n虽然使用 CSS 可以让您应用更丰富的格式，但仍有一些 HTML5 标签适用于在不需要\
  \ CSS 那样精确控制时为文本添加特殊格式。以下是其中一些标签：\n\n*   ![Image](img/arrow.jpg) `<sup></sup>`—上标文本\n\
  *   ![Image](img/arrow.jpg) `<sub></sub>`—下标文本\n*   ![Image](img/arrow.jpg) `<em></em>`—强调（通常为斜体）文本\n\
  *   ![Image](img/arrow.jpg) `<strong></strong>`—强强调（通常为粗体）文本\n*   ![Image](img/arrow.jpg)\
  \ `<pre></pre>`—等宽文本，保留空格和换行\n\n代码清单 6.2 和 图 6.2 展示了这些标签的实际运行效果。\n\n![一张截图显示了 HTML\
  \ 页面中字符格式化的示例输出。](img/06fig02.jpg)\n\n**图 6.2** 这是 代码清单 6.2 中字符格式化的显示效果。\n\n注意\n\
  \n在过去，`<u>` 标签在创建下划线文本时非常有用，但现在您不应使用它，原因有两点。首先，用户期望下划线文本是链接，因此如果您给非链接文本加下划线，他们可能会感到困惑。其次，`<u>`\
  \ 标签已经*过时*（obsolete），这意味着它已从 HTML 语言中逐步淘汰（`<strike>` 标签也是如此）。这两个标签在浏览器中仍然受到支持，并且在相当长一段时间内可能都会如此，但使用\
  \ CSS 是创建下划线和删除线文本的首选方法。\n\n**代码清单 6.2** 特殊格式化标签\n\n点击此处查看代码图片\n\n```\n<!doctype\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>The\
  \ Miracle Product</title>\n  </head>\n  <body>\n    <p>\n      New <sup>Super</sup><strong>Strength</strong>\
  \ H<sub>2</sub>O\n      <em>plus</em> will knock out any stain.<br>Look for new\n\
        <sup>Super</sup><strong>Strength</strong>\n      H<sub>2</sub>O <em>plus</em>\
  \ in a stream near you.\n    </p>\n    <pre>\n      NUTRITION INFORMATION (void\
  \ where prohibited)\n                       Calories   Grams   USRDA\n                       /Serving   of\
  \ Fat  Moisture\n      Regular           3          4        100%\n      Unleaded          3          2        100%\n\
        Organic           2          3         99%\n      Sugar Free        0          1        110%\n\
      </pre>\n  </body>\n</html>\n```\n\n`<pre>` 标签使文本以等宽字体显示——而且它还具有另一个独特且有用的功能。正如您在\
  \ 第 2 课 “ 构建 HTML 文档” 中学到的，HTML 文件通常会忽略多个空格和换行符，但 `<pre>` 会使精确的空格和换行被保留。例如，如果没有\
  \ `<pre>`，图 6.2 末尾的文本看起来会像这样：\n\ncalories grams usrda /serving of fat moisture regular\n\
  3 4 100% unleaded 3 2 100% organic 2 3 99% sugar free 0 1 110%\n\n即使您在每行末尾添加 `<br>`\
  \ 标签，各列也无法正确对齐。然而，当您在开头放置 `<pre>` 并在结尾放置 `</pre>` 时，由于精确的空格被保留，各列能够正确对齐；无需使用 `<br>`\
  \ 标签。`<pre>` 标签为您提供了一种快速且简单的方法，可以用最少的精力保留您可能想要传输到网页的任何等宽文本文件的对齐方式。\n\nCSS 为您提供了更强大的文本对齐方法（实际上是处理文本的任何方法），您将在整个\
  \ 第三部分 中学习更多相关内容。\n\n### 微调字体\n\n有时，您希望对文本的大小和外观进行比简单的加粗或斜体更精细的控制。在我们进入使用 CSS 微调字体的正确方法之前，让我们简要回顾一下在\
  \ CSS *出现之前* 是如何操作的；当您查看其他网站的源代码时，可能仍然会发现这种方法的示例。请记住，仅仅因为这些旧方法仍在被使用，并不意味着您应该效仿。\n\
  \n在样式表出现之前，现在已被淘汰的 `<font>` 标签被用来控制网页文本的字体。\n\n注意\n\n我们必须强调，绝对不能使用 `<font>` 标签！这里提到它仅用于演示和历史目的。\n\
  \n例如，以下 HTML 曾被用于更改页面上某些文本的大小和颜色：\n\n```\n<font size=\"5\" color=\"purple\">This\
  \ text will be big and purple.</font>\n```\n\n如您所见，`<font>` 标签的 `size` 和 `color`\
  \ 属性使得无需过多努力即可更改文本字体成为可能。虽然这种方法可行，但得益于 CSS 样式规则，它已被一种远为优越的字体格式化方法所取代。以下是用于控制字体的几个主要样式规则：\n\
  \n*   ![Image](img/arrow.jpg) `font-family`—设置字体的系列（ typeface）\n*   ![Image](img/arrow.jpg)\
  \ `font-size`—设置字体的大小\n*   ![Image](img/arrow.jpg) `color`—设置字体的颜色\n\n注意\n\n您将在\
  \ 第 8 课 “ 处理颜色、图像和多媒体” 中学习更多关于控制页面文本颜色的知识。该课程还将展示如何创建自定义颜色以及如何控制文本链接的颜色。\n\n`font-family`\
  \ 样式规则允许您设置用于显示文本的字体系列。您可以且通常应该为此样式指定多个值（用逗号隔开），这样如果用户的系统中没有第一种字体，浏览器可以尝试替代方案。\n\
  \n提供替代字体系列非常重要，因为每个用户安装的字体集可能不同，至少在核心通用基础字体（如 Arial, Times New Roman 等）之外是如此。通过提供替代字体列表，当您的理想字体未找到时，您的页面更有可能优雅地回退到一种已知字体。\n\
  \n以下是一个使用 `font-family` 样式为段落文本设置字体系列的示例：\n\n点击此处查看代码图片\n\n```\n<p style=\"font-family:arial,\
  \ sans-serif, 'times roman';\">\n```\n\n\n\n\n\n这个示例有几个有趣的部分。首先，`arial`被指定为主要字体。大小写不影响字体系列，因此`arial`与`Arial`或`ARIAL`没有区别。这段代码的另一个有趣之处在于，`times\
  \ roman`字体名称周围使用了单引号，因为其中包含空格。然而，由于`'times roman'`出现在通用规范`sans-serif`之后，因此不太可能使用`'times\
  \ roman'`。因为`sans-serif`位于第二位，它告诉浏览器：“如果这台机器上没有 Arial，则使用默认的无衬线字体。”每个浏览器都有默认的衬线字体、无衬线字体、手写字体、等宽字体和装饰字体。不过，它们可能与你预期的完全不同，因此最好定义两到三个特定字体系列的列表，并将通用系列名称放在最后。\n\
  \n`font-size`和`color`样式规则也常用于控制字体的大小和颜色。`font-size`样式可以设置为预定义大小（例如`small`、`medium`或`large`），也可以设置为特定的点大小（例如`12pt`或`14pt`）。`color`样式可以设置为预定义颜色（例如`white`、`black`、`blue`、`red`或`green`），也可以设置为特定的十六进制颜色（例如`#ffb499`）。以下是前一段落示例的改进版本，并指定了字体大小和颜色：\n\
  \n点击此处查看代码图片\n\n```\n<p style=\"font-family:arial, 'times roman', sans-serif;\n\
  \          font-size:14pt; color:green;\">\n```\n\n注意\n\n你将在第 8 课中了解十六进制颜色。目前只需理解`color`样式规则允许你指定精确的颜色，而不仅仅是使用诸如`green`、`blue`、`orange`等颜色名称。\n\
  \n清单 6.3 中的示例网页内容以及图 6.3 中展示的内容，使用了一些字体样式规则来创建基本在线简历的开头部分。\n\n![一张截图显示了使用字体样式创建基本简历的输出结果。](img/06fig03.jpg)\n\
  \n**图 6.3** 这是清单 6.3 中使用的代码的效果。\n\n**清单 6.3** 使用字体样式规则创建基本简历\n\n点击此处查看代码图片\n\n```\n\
  <!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n  \
  \  <title>R&eacute;sum&eacute; for Jane Doe</title>\n    <style>\n      body {\n\
  \        font-family: Verdana, sans-serif;\n        font-size: 12px;\n      }\n\
  \      header {\n        text-align: center;\n      }\n      h1 {\n        font-family:Georgia,\
  \ serif;\n        font-size: 28px;\n        text-align: center;\n      }\n     \
  \ p.contactinfo {\n        font-size: 14px;\n      }\n      p.categorylabel {\n\
  \        font-size: 12px;\n        font-weight: bold;\n        text-transform: uppercase;\n\
  \      }\n      div.indented {\n        margin-left: 25px;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <header>\n      <h1>Jane Doe</h1>\n      <p class=\"contactinfo\"\
  >1234 Main Street, Sometown,\n      CA 93829<br>\n      tel: 555-555-1212, e-mail:\
  \ jane@doe.com</p>\n    </header>\n    <section>\n      <p class=\"categorylabel\"\
  >Summary of Qualifications</p>\n      <ul>\n        <li>Highly skilled and dedicated\
  \ professional offering a\n        solid background in whatever it is you need.</li>\n\
  \        <li>Provide comprehensive direction for whatever it is\n        that will\
  \ get me a job.</li>\n        <li>Computer proficient in a wide range of industry-related\n\
  \        computer programs and equipment. Any industry.</li>\n      </ul>\n    </section>\n\
  \    <section>\n      <p class=\"categorylabel\">Professional Experience</p>\n \
  \     <div class=\"indented\">\n        <p><strong>Operations Manager,\n       \
  \ Super Awesome Company, Some City, CA [Sept 2002 –\n        present]</strong></p>\n\
  \        <ul>\n          <li>Direct all departmental operations</li>\n         \
  \ <li>Coordinate work with internal and external\n          resources</li>\n   \
  \       <li>Generally in charge of everything</li>\n        </ul>\n        <p><strong>Project\
  \ Manager,\n        Less Awesome Company, Some City, CA [May 2000 - Sept\n     \
  \   2002]</strong></p>\n        <ul>\n          <li>Direct all departmental operations</li>\n\
  \          <li>Coordinate work with internal and external\n          resources</li>\n\
  \          <li>Generally in charge of everything</li>\n        </ul>\n      </div>\n\
  \    </section>\n    <section>\n      <p class=\"categorylabel\">Education</p>\n\
  \      <ul>\n        <li>MBA, MyState University, May 2002</li>\n        <li>B.A,\
  \ Business Administration, MyState University,\n        May 2000</li>\n      </ul>\n\
  \    </section>\n    <section>\n      <p class=\"categorylabel\">References</p>\n\
  \      <ul>\n        <li>Available upon request.</li>\n      </ul>\n    </section>\n\
  \  </body>\n</html>\n```\n\n使用 CSS 将样式集组织成类——正如你在第 3 课（“理解层叠样式表”）中学到的那样——你可以看到文本格式如何应用于此内容的不同区域。如果仔细查看`div.indented`类的定义，你会看到使用了`margin-left`样式。这种样式（你将在第三部分中了解更多）会在元素的左侧应用一定量的空间（本例中为\
  \ 25 像素）。这个空间就是图 6.3 中显示的缩进。\n\n### 使用网络字体\n\n在前一节中，你看到了我们确信存在于每个人电脑上的字体系列的使用。也就是说，你可以放心，大多数电脑都能渲染\
  \ Arial 或 Times New Roman，或者如果样式表要求，它们会有一个默认的衬线字体和无衬线字体。但随着 CSS3 中`@font-face`特性的加入，你可以对在线内容施加更大的设计能力。\n\
  \n简而言之，`@font-face`规则允许你定义用于 HTML5 标记的字体，以便无论用户是否在电脑上安装了这些字体（而且用户极有可能没有安装你选择的奇特字体），都能显示给用户。字体的定义可以是本地的（如果你愿意将字体文件放在你的网络服务器上），也可以是远程的（如果你链接到存储了许多字体的位置）。\n\
  \n在你的样式表中，要定义一种新字体用于整个页面，你可以简单地使用以下结构：\n\n点击此处查看代码图片\n\n```\n@font-face {\n    \
  \ font-family: 'some_name_goes_here';\n     src: url('some_location_of_the_font_file');\n\
  }\n```\n\n定义之后，你可以像在样式表中其他地方一样引用`font-family`，例如：\n\n点击此处查看代码图片\n\n```\nh1 {\n \
  \ font-family: 'some_name_goes_here';\n  font-size: 28px;\n  text-align: center;\n\
  }\n```\n\n但是从哪里获取字体呢？你可以从许多地方获取字体——有些免费，有些则不是。一个广受欢迎的地方是 Google Fonts（[www.google.com/fonts](http://www.google.com/fonts)），不仅因为字体免费，还因为\
  \ Google 被广泛认为提供了稳定的平台，如果你的网页排版依赖于存放在他人网络服务器上的字体，这一点很重要。其他一些可靠的付费字体获取网站包括 Adobe\
  \ Typekit（[`typekit.com`](https://typekit.com)）和 Fontspring（[www.fontspring.com](http://www.fontspring.com)）。付费网站不一定不好——艺术家也需要赚钱。我们使用过\
  \ Typekit，但许多项目也使用 Google Fonts。\n\n\n\n\n\n让我们来看看如何修改代码清单 6.3 中的代码，为 `h1` 元素引入一个来自\
  \ Google Fonts 的字体。如果你访问 [www.google.com/fonts](http://www.google.com/fonts) 并选择一个你喜欢的字体，Google\
  \ 会为你提供一段需要包含在 HTML 和 CSS 中的代码。我们选择了一款名为 Cherry Swash 的字体，Google 建议我们将以下内容包含在 HTML\
  \ 模板的 `<head>` 部分：\n\n点击此处点击查看代码图片\n\n```\n<link href=\"http://fonts.googleapis.com/css?family=Cherry+Swash:400,700\"\
  \n      rel=\"stylesheet\">\n```\n\n注意\n\n如果你查看 Google 链接位置的文件，你会发现那是 Google 已经为你写好的\
  \ `@font-face` 定义。具体内容如下：\n\n此处点击查看代码图片\n\n```\n  @font-face {\n    font-family:\
  \ 'Cherry Swash';\n    font-style: normal;\n    font-weight: 400;\n    src: local('Cherry\
  \ Swash'), local('CherrySwash-Regular'),\n  url(http://themes.googleusercontent.com/static/fonts/cherryswash/v1/\n\
  \  HqOk7C7J1TZ5i3L-ejF0vnhCUOGz7vYGh680lGh-uXM.woff) format('woff');\n  }\n\n  @font-face\
  \ {\n    font-family: 'Cherry Swash';\n    font-style: normal;\n    font-weight:\
  \ 700;\n    src: local('Cherry Swash Bold'), local('CherrySwash-Bold'),\n  url(http://themes.googleusercontent.com/static/fonts/cherryswash/v1/\n\
  \  -CfyMyQqfucZPQNB0nvYyHl4twXkwp3_u9ZoePkT564.woff) format('woff');\n   }\n```\n\
  \n现在代码已经知道去哪里寻找该字体，你只需要引用它即可：\n\n```\nh1 {\n  font-family:'Cherry Swash';\n  font-size:28px;\n\
  \  text-align:center;\n}\n```\n\n图 6.4 展示了使用了该 Web 字体的全新简历。\n\n![一张截图显示了 Jane Doe\
  \ 修改后的简历，其中标题的字体已更改。](img/06fig04.jpg)\n\n**图 6.4** 使用 Cherry Swash 作为标题字体的简历。\n\
  \n### 页面文本对齐\n\n当你阅读 Web 上的信息时，很容易将大多数段落自动左对齐视为理所当然。然而，在某些情况下，你可能会选择将内容右对齐或两端对齐。HTML\
  \ 允许你对单个 HTML 块级元素进行对齐，例如包含在 `<p></p>` 或 `<div></div>` 标签对中的文本。不过，在深入探讨块元素对齐的细节之前，让我们先简要了解一下属性是如何工作的。\n\
  \n#### 使用 Style、Class 和 ID 属性\n\n属性提供了与 HTML 标签相关的附加信息。*属性（Attributes）* 是在 HTML\
  \ 标签内部使用的特殊代码词，用于精确控制标签的功能。即使在最简单的 Web 内容中，它们也非常重要，因此熟练使用它们至关重要。\n\n属性调用应用于特定标签的样式（styles）、类（classes）或\
  \ ID。如果你在样式表中定义了一个特定的类或 ID（正如你在第 3 课中所学的那样），那么你就可以在标签内部使用 `class=\"someclass\"`\
  \ 或 `id=\"someid\"` 来调用该类或 ID。当浏览器渲染内容进行显示时，它会根据相关的样式定义查找样式表，以确定内容的具体呈现方式。同样，你可以使用\
  \ `style` 属性为特定元素包含样式规则，而无需将该元素连接到实际的样式表；这就是你在第 3 课中学习的内联样式格式。\n\n在以下示例中，每个段落都可以设置为左对齐：\n\
  \n此处点击查看代码图片\n\n```\n<p style=\"text-align: left;\">Text goes here.</p>\n<p class=\"\
  leftAlignStyle\">Text goes here.</p>\n<p id=\"firstLeftAlign\">Text goes here.</p>\n\
  ```\n\n在第一个段落中，样式直接出现在 `style` 属性中。这对于调试或短期格式测试非常有用，但对于 Web 内容的长期维护则不太方便。在第二个段落中，如果样式表中\
  \ `.leftAlignStyle` 类的条目包含 `text-align` 语句，则该段落将左对齐；请记住，使用类意味着其他标签可以复用该类。同样，如果样式表中\
  \ `#firstLeftAlign` `id` 的条目包含 `text-align` 语句，则第三个段落将左对齐；请记住，使用 `id` 意味着这些样式只能应用于一个被标识的标签。\n\
  \n#### 对齐块级元素\n\n若要将 `<p>` 等块级元素中的文本对齐到右边距，而无需在样式表中创建单独的类或 ID，只需在段落开头的 `<p>` 标签内放置\
  \ `style=\"text-align:right;\"`（或在类或 ID 中定义它）。同样，要使元素中的文本居中，请使用 `<p style=\"text-align:center;\"\
  >`。要使段落中的文本左对齐，请使用 `<p style=\"text-align:left;\">`。\n\n`style` 属性中的 `text-align`\
  \ 部分被称为 *样式规则（style rule）*，这意味着它设置了 HTML 元素的某个特定样式方面。你可以使用许多样式规则来精细控制 Web 内容的格式。\n\
  \n注意\n\nHTML 中的每个属性和样式规则都有一个默认值，当你没有自行设置属性时，就会采用该默认值。对于 `<p>` 标签的 `text-align` 样式规则，默认值是\
  \ `left`，因此使用最简单的 `<p>` 标签与使用 `<p style=\"text-align:left;\">` 的效果相同。学习常用样式规则的默认值是成为一名优秀\
  \ Web 页面开发者的重要环节。\n\n`text-align` 样式规则并非 `<p>` 标签专属。事实上，你可以将 `text-align` 样式规则用于任何块级元素，包括\
  \ `<section>` 和 `<header>` 等语义元素，以及 `<h1>`、`<h2>` 等其他标题级标签和 `<div>` 标签等。`<div>`\
  \ 标签尤其方便，因为它能包含其他块级元素，从而允许你一次性控制大块 Web 内容的对齐方式。`<div>` 标签中的 *div* 代表 *division*（分区）。\n\
  \n代码清单 6.4 展示了在不同块级元素中使用 `style` 属性和 `text-align` 样式规则的情况。图 6.5 显示了结果。\n\n![一张截图显示了使用\
  \ HTML 进行文本对齐的输出结果。](img/06fig05.jpg)\n\n**图 6.5** 代码清单 6.4 中文本对齐的结果。\n\n**代码清单\
  \ 6.4** 与 `style` 属性配合使用的 `text-align` 样式规则\n\n此处点击查看代码图片\n\n```\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Bohemia</title>\n\
  \  </head>\n  <body>\n    <section style=\"text-align:center;\">\n      <header>\n\
  \        <h1>Bohemia</h1>\n        <h2>by Dorothy Parker</h2>\n      </header>\n\
  \    </section>\n    <section>\n      <p style=\"text-align:left;\">\n      Authors\
  \ and actors and artists and such<br>\n      Never know nothing, and never know\
  \ much.<br>\n      Sculptors and singers and those of their kidney<br>\n      Tell\
  \ their affairs from Seattle to Sydney.\n      </p>\n      <p style=\"text-align:center;\"\
  >\n      Playwrights and poets and such horses' necks<br>\n      Start off from\
  \ anywhere, end up at sex.<br>\n      Diarists, critics, and similar roe<br>\n \
  \     Never say nothing, and never say no.\n      </p>\n      <p style=\"text-align:right;\"\
  >\n      People Who Do Things exceed my endurance;<br>\n      God, for a man that\
  \ solicits insurance!\n      </p>\n    </section>\n  </body>\n</html>\n```\n\n使用\
  \ `<section style=\"text-align:center;\">` 可确保包括两个标题在内的内容区域居中。然而，应用于 `<section>`\
  \ 内部单个段落的内联样式会覆盖此设置，从而确保第一个段落的文本左对齐，第二个段落居中，第三个段落右对齐。\n\n\n\n\n\n`text-align` 属性还允许你对齐文本，使左右页边距都保持平直。这可能会导致一行中的单词之间出现奇怪的间隙，但它是另一种对齐文本块的方法。只需在样式规则中写入\
  \ `text-align:justify;` 即可。\n\n### 三种类型的 HTML 列表\n\n为了清晰起见，将网页上的信息以项目列表的形式呈现通常非常有用。HTML\
  \ 列表有三种基本类型：\n\n*   ![Image](img/arrow.jpg) **有序列表（Ordered list）—**一种在每个列表项前都有数字或字母的缩进列表。有序列表以\
  \ `<ol>` 标签开始，以闭合的 `</ol>` 标签结束。列表项包含在 `<li></li>` 标签对中，并且在每个开端 `<li>` 标签处会自动出现换行。整个列表都会缩进。\n\
  \n*   ![Image](img/arrow.jpg) **无序列表（Unordered list）—**一种在每个列表项前都有圆点或其他符号的缩进列表。无序列表以\
  \ `<ul>` 标签开始，以 `</ul>` 结束。与有序列表一样，其列表项包含在 `<li></li>` 标签对中。在每个开端 `<li>` 标签处会出现换行和符号，且整个列表都会缩进。\n\
  \n*   ![Image](img/arrow.jpg) **定义列表（Definition list）—**一个术语及其含义的列表。这种类型的列表在每个项目前没有特殊的数字、字母或符号，以\
  \ `<dl>` 开始，以 `</dl>` 结束。`<dt></dt>` 标签对包含每个术语，而 `<dd></dd>` 标签对包含每个定义。换行和缩进会自动出现。\n\
  \n这三种类型的列表显示在 图 6.6 中，而 代码清单 6.5 展示了用于构建它们的 HTML 代码。\n\n![一张截图显示了三种不同基本类型列表的示例输出。](img/06fig06.jpg)\n\
  \n**图 6.6** 三种基本类型的 HTML 列表。\n\n**代码清单 6.5** 无序列表、有序列表和定义列表\n\n点击此处查看代码图片\n\n```\n\
  <!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n  \
  \  <title>How to Be Proper</title>\n  </head>\n  <body>\n    <article>\n      <header>\n\
  \        <h1>How to Be Proper</h1>\n      </header>\n      <section>\n        <header>\n\
  \          <h1>Basic Etiquette for a Gentleman Greeting a\n          Lady Acquaintance</h1>\n\
  \        </header>\n        <ul>\n          <li>Wait for her acknowledging bow before\
  \ tipping your\n          hat.</li>\n          <li>Use the hand farthest from her\
  \ to raise the hat.</li>\n          <li>Walk with her if she expresses a wish to\
  \ converse;\n          never make a lady stand talking in the street.</li>\n   \
  \       <li>When walking, the lady must always have the wall.</li>\n        </ul>\n\
  \      </section>\n      <section>\n        <header>\n          <h1>Recourse for\
  \ a Lady Toward Unpleasant Men Who Persist\n          in Bowing</h1>\n        </header>\n\
  \        <ol>\n          <li>A simple stare of iciness should suffice in most\n\
  \          instances.</li>\n          <li>A cold bow discourages familiarity without\
  \ offering\n          insult.</li>\n          <li>As a last resort: \"Sir, I have\
  \ not the honour of your\n          acquaintance.\"</li>\n        </ol>\n      </section>\n\
  \      <section>\n        <header>\n          <h1>Proper Address of Royalty</h1>\n\
  \        </header>\n        <dl>\n          <dt>Your Majesty</dt>\n          <dd>To\
  \ the king or queen.</dd>\n          <dt>Your Royal Highness</dt>\n          <dd>To\
  \ the monarch's spouse, children, and siblings.</dd>\n          <dt>Your Highness</dt>\n\
  \          <dd>To nephews, nieces, and cousins of the sovereign.</dd>\n        </dl>\n\
  \      </section>\n    </article>\n  </body>\n</html>\n```\n\n请注意 代码清单 6.5 中语义化元素（`<article>`、`<section>`\
  \ 和 `<header>`）的使用，它们提供了更好的内容大纲感，包括文本块之间如何相互关联。这些元素中的每一个都可以应用自己的样式，从而进一步在视觉上区分这些元素。\n\
  \n注意\n\n请记住，不同的 Web 浏览器显示网页内容的方式可能截然不同。HTML 标准并没有具体规定浏览器应该如何格式化列表，因此使用旧版浏览器的用户看到的缩进可能与你看到的不完全相同。你可以使用\
  \ CSS 来精确控制列表项，你将在本课稍后部分学习相关内容。\n\n警告\n\n虽然定义列表在官方定义上应该用于定义术语，但许多网页作者在任何他们想要缩进的地方都会使用它。在实践中，你只需在文本开头放置\
  \ `<dl><dd>`，在结尾放置 `</dd></dl>` 并跳过 `<dt></dt>` 标签对，就可以缩进任何文本。这是一个糟糕的习惯，因为它降低了你对设计的控制力，并为那些不该有语义含义的缩进区域暗示了语义含义。相反，你应该使用\
  \ CSS 来缩进内容。\n\n### 在列表中放置列表\n\n放置在列表中的列表被称为 *嵌套列表（nested lists）*。过去，设计师经常使用嵌套列表来快速缩进内容。由于使用\
  \ CSS 时你可以高度控制项目的显示方式，因此无需使用嵌套列表来实现缩进的视觉效果。请将嵌套列表的使用保留在内容确实需要的时候。换句话说，使用嵌套列表来显示信息的层级结构，例如\
  \ 代码清单 6.6 所示。\n\n注意\n\n*嵌套（Nesting）* 指的是一个标签完全出现在另一个标签内部。嵌套标签也被称为包含它们的（父）标签的 *子标签（child\
  \ tags）*。在 HTML 代码中缩进嵌套标签是一种常见的（但非强制的）编码实践，这样你可以轻松地看到它们与父标签的关系。\n\n有序列表和无序列表可以相互嵌套，层级可以根据需要随意增加。在\
  \ 代码清单 6.6 中，一个复杂的缩进大纲是由几个无序列表构建而成的。请注意 图 6.7，Web 浏览器会自动为前三个缩进级别使用不同类型的圆点，这使得列表非常易于阅读。这在现代浏览器中很常见。\n\
  \n**代码清单 6.6** 使用列表构建大纲\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"en\"\
