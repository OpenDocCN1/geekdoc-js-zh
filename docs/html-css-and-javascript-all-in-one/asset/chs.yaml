  \n**图 6.7** 多级无序列表经过整齐的缩进和圆点标记，提高了可读性。\n\n\n\n\n正如图 6.7 所示，Web 浏览器通常使用实心圆点作为第一级项目符号，空心圆圈作为第二级项目符号，实心方块作为更深层级的项目符号。但是，你可以通过使用`<ul\
  \ style=\"list-style-type:disc;\">`、`<ul style=\"list-style-type:circle;\">`或`<ul\
  \ style=\"list-style-type:square;\">`来代替`<ul>`，明确选择任意层级使用的项目符号类型，无论是内联还是特定的样式表。\n\
  \n你甚至可以通过在`<li>`标签中使用`list-style-type`样式规则来更改无序列表中任意单个项目的项目符号。例如，以下代码在*extra*和*super*文字前显示空心圆圈，在*special*文字前显示实心方块：\n\
  \n点击此处查看代码图片\n\n```html\n<ul style=\"list-style-type:circle;\">\n  <li>extra</li>\n\
  \  <li>super</li>\n  <li style=\"list-style-type:square;\">special</li>\n</ul>\n\
  ```\n\n`list-style-type`样式规则同样适用于有序列表，但不是选择项目符号类型，而是选择放置在每个项目前的数字或字母类型。清单 6.7 展示了如何在多级列表中使用罗马数字（`list-style-type:upper-roman;`）、大写字母（`list-style-type:upper-alpha;`）、小写字母（`list-style-type:lower-alpha;`）和普通数字（`list-style-type:decimal;`）。图\
  \ 6.8 展示了结果大纲，格式美观。\n\n虽然清单 6.7 仅在`<ol>`标签中使用`list-style-type`样式规则，但你也可以将其用于列表中的特定`<li>`标签（尽管很难想象这种情况）。你还可以使用`list-style-type:decimal;`明确指定普通编号，并可以使用`list-style-type:lower-roman;`制作小写罗马数字。\n\
