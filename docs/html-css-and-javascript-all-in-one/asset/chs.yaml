  \ |\n| `shape=\"value\"` | 在 `<area>` 标签内指定点击区域的形状。该属性选项为 `rect`、`poly` 和 `circle`。\
  \ |\n| `coords=\"values\"` | 在 `<area>` 标签内指定图像中点击区域的坐标。其含义随区域类型而异。 |\n| `href=\"\
  link\"` | 在 `<area>` 标签内指定点击区域时应加载的 URL。 |\n| **标签** | **功能** |\n| `<audio>...</audio>`\
