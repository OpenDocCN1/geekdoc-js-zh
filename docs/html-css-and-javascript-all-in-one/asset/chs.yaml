  ```\n\n\n\n\n![一张截图显示了“历史测验”文件的输出。页面显示了一个主问题，后面跟着三个编号为 1、2 和 3 的子问题。底部有一个“检查你的答案”的链接。](img/07fig03.jpg)\n\
  \n**图 7.3** 这就是在代码列表 7.2 中列出的 `historyquiz.html` 文件，并被代码列表 7.3 中的链接所引用。\n\n**代码列表\
  \ 7.3** `historyquiz.html` 链接到的 `historyanswers.html` 文件\n\n点击此处查看代码图像\n\n```\n\
  <!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n  \
