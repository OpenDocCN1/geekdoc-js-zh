  Some string.\");\n```\n\n# 第二部分：实用 Web 设计的构建块\n\n## 第 6 课：处理字体、文本块、列表和表格\n\n###\
  \ 您在本课中将学到：\n\n* 如何使用**粗体**、*斜体*和特殊文本格式\n* 如何微调字体\n* 如何使用特殊字符\n* 如何在页面上对齐文本\n* 如何使用三种类型的\
  \ HTML 列表\n* 如何在列表中嵌套列表\n* 如何创建简单表格\n* 如何控制表格的大小\n* 如何在表格内对齐内容以及跨行跨列\n* 如何使用 CSS\
  \ 列\n\n在 Web 的早期阶段，文本仅以一种字体和一种尺寸显示。然而，HTML 和 CSS 的结合现在使得控制文本的外观（字体、大小、颜色）以及它在网页上的对齐和显示方式成为可能。在本课中，您将学习如何更改字体的视觉显示——其字体系列（typeface）、大小和粗细——以及如何将**粗体**、*斜体*、上标、下标和删除线文本合并到您的页面中。您还将学习如何更改字体系列和字体大小，以及如何使用\
  \ Web 字体。\n\n在熟悉这些文本方面后，您将学习文本对齐的基础知识以及一些其他文本技巧，例如列表的使用。由于列表非常常见，HTML 提供了能够自动缩进文本并在每个列表项前添加数字、项目符号或其他符号的标签。您将学习如何格式化不同类型的列表。\n\
  \n在本课中，您将学习如何构建 HTML 表格，用于控制 Web 内容中表格数据的间距、布局和外观。虽然使用 CSS 可以实现类似的结果，但在某些情况下，使用表格是呈现行和列信息的最佳方式。您还将在本课中看到设计师过去如何使用表格进行页面布局——以及未来如何避免这样做。\n\
  \n最后，您将学习一种显示大块文本的新技术——CSS 列。您将了解如何将内容创建为报纸风格的列，以及如何使这些列在页面上看起来美观。\n\n> **Note**:\
  \ 在查看其他设计师的 Web 内容时，您可能会注意到与本系列教授的不同文本标记方法。旧式格式化文本的一些明显迹象包括：使用 `<b></b>` 标签对来指示单词应加粗，使用\
  \ `<i></i>` 标签对来指示单词应为斜体，以及使用 `<font></font>` 标签对来指定字体系列、大小和其他属性。然而，这种方法正逐渐从 HTML\
  \ 中被淘汰，CSS 要强大得多。\n\n### 动手尝试\n\n#### 准备示例文本\n\n如果您有一些示例文本，可以用来显示不同的字体和颜色，并可以对其进行缩进、居中或进行其他操作，那么您可以在本课中最大限度地学习如何定义文本样式。使用什么类型的文本并不重要，因为有太多的样式可能性可以尝试，它们无论如何都不会全部出现在同一个网页上（除非您想让访问者发疯）。利用这个机会感受文本级更改如何影响内容的呈现。\n\
  \n* 如果您使用的文本来自文字处理或数据库程序，请务必将其保存为纯文本或 `ASCII` 格式的新文件。然后，您可以在学习本课的过程中添加相应的 HTML 标签和样式属性来对其进行格式化。\n\
  \n\n\n\n\n*   ![Image](img/arrow2.jpg) 任何文本都可以，但请尝试寻找（或输入）一些您想要放入网页的文本。公司宣传册或个人简历中的文本可能是个不错的选择。\n\
  \n*   ![Image](img/arrow2.jpg) 任何类型的大纲、演示文稿中的要点、编号步骤、术语表或来自数据库的文本信息列表都将是很好的练习材料。\n\
  \n*   ![Image](img/arrow2.jpg) 在使用本课介绍的代码来格式化正文之前，请先添加您在之前的课程中使用的 HTML 骨架标签（至少包括\
  \ `<!doctype>`、`<html>`、`<head>`、`<title>` 和 `<body>` 标签）。\n\n### 处理特殊字符\n\n在我们匆忙进入字体更改之前，让我们先谈谈字体中的特殊字符。大多数字体都包含欧洲语言的特殊字符，例如\
  \ *café* 中的重音字母 *é*。您还会发现一些数学符号和特殊的标点符号，例如圆形 • 项目符号。\n\n您可以通过使用相应的代码在 HTML 文档的任何位置插入这些特殊字符（参见\
  \ 表 6.1）。您可以在以下 URL 找到针对多种字符集的更详尽的代码列表：\n\n`https://www.webstandards.org/learn/reference/charts/entities/named*entities*/`\n\
  \nHTML 使用一种称为 *字符实体 (character entity)* 的特殊代码来表示 © 和 ® 等特殊字符。字符实体的指定始终以 `&` 开始，以\
  \ `;` 结束。表 6.1 列出了最常用的字符实体，尽管 HTML 支持的远不止这些。\n\n表 6.1 包含了尖括号、引号和和符号的代码。如果您希望这些符号出现在页面上，必须使用这些代码；否则，浏览器会将它们解释为\
  \ HTML 命令。\n\n代码清单 6.1 和 图 6.1 展示了 表 6.1 中几个符号的使用情况。\n\n![一张截图显示了 HTML 文件 \"punctuation\
  \ lines\" 的输出结果，其中显示了五组问题及其答案，每组问题和答案之间留有空格。](img/06fig01.jpg)\n\n**图 6.1** 这是 代码清单\
  \ 6.1 中的 HTML 页面在大多数浏览器中的显示效果。\n\n例如，您可以通过以下任一方式生成单词 *café*：\n\n```\ncaf&eacute;\n\
  caf&#233;\n```\n\n注意\n\n在 HTML 中使用 `<meta charset=\"utf-8\">` 行的一个原因是它可以减少对这些特殊字符代码的需求。通过将字符集设置为\
  \ UTF-8，您告诉浏览器在没有特殊编码的情况下即可预期这些字符。换句话说，在 UTF-8 网页中，您可以写 `<h1>My Café</h1>` 而不是 `<h1>My\
  \ Caf&eacute;</h1>`，它也能正确显示。\n\n对于在 HTML 中具有特殊用途的字符，您仍然应该使用编码，例如用 `&lt;` 表示 `<`，用\
  \ `&gt;` 表示 `>`，用 `&amp;` 表示 `&`。这能确保浏览器知道这些字符是文本的一部分而非 HTML 标签。\n\n**表 6.1** 常用的英语特殊字符\n\
