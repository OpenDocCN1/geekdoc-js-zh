  \      <ul>\n        <li><strong>Fish</strong>\n          <ul>\n            <li>Barramundi</li>\n\
  \            <li>Kissing Gourami</li>\n            <li>Mummichog</li>\n        \
  \  </ul>\n        </li>\n        <li><strong>Amphibians</strong>\n          <ul>\n\
  \            <li>Anura\n            <ul>\n              <li>Goliath Frog</li>\n\
  \              <li>Poison Dart Frog</li>\n              <li>Purple Frog</li>\n \
  \           </ul>\n          </li>\n          <li>Caudata\n            <ul>\n  \
  \            <li>Hellbender</li>\n              <li>Mudpuppy</li>\n            </ul>\n\
  \            </li>\n          </ul>\n        </li>\n        <li><strong>Reptiles</strong>\n\
  \          <ul>\n            <li>Nile Crocodile</li>\n            <li>King Cobra</li>\n\
  \            <li>Common Snapping Turtle</li>\n          </ul>\n        </li>\n \
