  \ Listing 24.9，对 `window.prompt()` 对话框的结果进行某些操作——打印文本、根据特定文本执行另一个操作或类似的操作。\n\n##\
  \ 第 25 节：JavaScript 最佳实践\n\n**在本节你将学习：**\n\n* ![Image](img/arrow1.jpg) 创建非侵入性脚本的最佳实践\n\
  * ![Image](img/arrow1.jpg) 分离内容、演示和行为的重要性\n* ![Image](img/arrow1.jpg) 创建遵循脚本\n*\
  \ ![Image](img/arrow1.jpg) 如何读取和显示浏览器信息\n* ![Image](img/arrow1.jpg) 如何使用特性检测（feature\
  \ sensing）避免错误\n* ![Image](img/arrow1.jpg) 如何支持旧版、不标准的浏览器\n\n### 脚本最佳实践\n\n当你开始开发更复杂的脚本时，了解一些最佳实践是非常重要的。这些是经验程序员通过教训总结出的\
  \ JavaScript 使用指南。遵循这些实践的好处如下：\n\n* ![Image](img/arrow1.jpg) 你的代码将具有可读性且易维护，无论是交给他人还是你自己试图记住一年前做了什么。\n\
  * ![Image](img/arrow1.jpg) 你创建的代码将遵循标准，并且在浏览器发布新版本不会失效。\n* ![Image](img/arrow1.jpg)\
  \ 你创建的页面即使没有 JavaScript 也能运行。\n* ![Image](img/arrow1.jpg) 将你为一个网站创建的代码适配到另一个网站将非常容易。\n\
  * ![Image](img/arrow1.jpg) 用户将感谢你创建了一个易于使用且易于修复的网站。\n\n#### 避免过度使用 JavaScript\n\n\
  一个重要的最佳实践是避免过度使用 JavaScript。在教你成为胜任 JavaScript 开发者的课程中，这可能看起来违背直觉，但事实如此。由于 HTML5\
  \ 和 CSS3 已经成熟，且浏览器对这些高级标准的支持也之完善，现在对于某些几年前还需要 JavaScript 的增强交互，使用 JavaScript 的理由已经了很多。例如，一些开发者花费多年编写实用的\
  \ JavaScript 表单验证脚本，而这些脚本现在已由于 HTML5 原生表单字段验证的引入而变得多余。\n\n\n\n\n\n*   ![Image](img/arrow.jpg)\
  \ 许多曾经需要用 JavaScript 代码的视觉效果，现在可以使用 CSS 完美地实现。当两种方法可行时（例如，鼠标悬停效果、动画和某些类型的菜单），CSS\
  \ 通常是首选。它在各个浏览器中都得到了良好的支持。在 CSS 不支持的极少数情况下，页面将作为标准 HTML 渲染，这通常会创建一个至少功能完全的页面，即使它并不那么好看。\n\
  \n*   ![Image](img/arrow.jpg) 用户可能会花费大量的互联网时间花在你的网站以外的其他网站上。丰富的互联网用户已经习惯了如菜单、面包屑导航和标签页浏览等流行的界面组件。这些元素之所以受欢迎，通常是因为它们运行良好、可以做得美观，而且不需要用户先阅读说明书。对网站操作的熟悉程度对用户生产力的提升，可能远比你那套全新的、依赖\
  \ JavaScript 的华丽设计所带来的潜在收益更大。如果用户效率更高，他们会对你的网站更满意，并且停留的时间也更长。\n\n*   ![Image](img/arrow.jpg)\
  \ 世界许多地区的用户仍在在使用过时、性能不足的旧电脑，而且可能还有缓慢和/或不可靠的互联网访问以及旧版本的网络浏览器。不必要的 JavaScript 代码所的\
  \ CPU 周期对他们来说可能是宝贵的。\n\n*   ![Image](img/arrow.jpg) 在某些情况下，你可能会损失一定的搜索引擎页面排名，因为搜索引擎的爬虫并不总是能正确索引由\
  \ JavaScript 生成的内容或需要它进行导航的设计。此外，如果 JavaScript 让页面变得不那么移动友好，你肯定会被搜索引擎惩罚。\n\n如果使用得当且深思熟虑，JavaScript\
  \ 是一个强大的工具，但有时确实存在“过犹求不及”的情况。\n\n## 内容、表现与行为\n\n当你创建一个网页时，特别是当你创建一个整个网站或应用程序时，你需要处理三个关键领域：`content`（内容）、`presentation`（表现）和\
  \ `behavior`（行为），这三个领域你已经在之前的课程中学习过：\n\n*   ![Image](img/arrow.jpg) `内容` 属性由访客在你的页面上看到的文字组成。你通过文本创建内容，并使用\
  \ HTML 对进行标记，以定义不同类型的内容——标题、段落、链接等。\n\n*   ![Image](img/arrow.jpg) `表现` 是每个页面上文字、图像和其他元素的外观和布局——文本格式、字体、颜色和图形。这就是\
  \ CSS 大挥显用场的地方。\n\n*   ![Image](img/arrow.jpg) `行为` 是当你与页面交互时发生的情况——当鼠标悬停时会高亮的项目、你可以提交的表单等。这就是\
  \ JavaScript 介入并以增强前端交互的领域，同时还有如 PHP 和 Ruby 等服务器端语言。\n\n记住这三个区域是一个好主意，特别是在你创建更大型的网站时。尽可能将内容、表现和行为分离也是一个好主意。实现这一点的的一种好方法是为表现创建一个外部的\
  \ CSS 文件，为行为创建一个外部的 JavaScript 文件，并将它们链接到 HTML 文档中。\n\n像这样将事情分离使得维护大型网站变得更容易。例如，如果你需要更改标题的颜色，你可以对\
  \ CSS 文件进行快速编辑，而无需遍历所有的 HTML 标记来寻找正确的编辑位置。这种分离也让你易于在网站的多个页面上复用相同的 CSS 和 JavaScript。最后但同样重要的是，这种分离鼓励你在每种语言擅长的领域使用它，这最终会让你的工作变得更轻松。\n\
  \n## 速度与网页加载\n\nJavaScript 可能成为网页的巨大负担，因为它是独立下载的。在脚本加载期间，浏览器无法下载其他任何内容。这意味着如果页面上有其他位于脚本之后需要下载的元素，或者页面上有其他脚本，它们在脚本完成之前不会开始下载。\n\
  \n有两种技术可以弥补这个问题：只使用一个外部的 JavaScript 文件，并将 `<script>` 标签放在 HTML 的末尾。通过将 `<script>`\
  \ 标签放在最后（紧接 `</body>` 闭合标签之前），你可以确保即使在脚本加载时，整个页面也会渲染并可见。而且将你所有的脚本合并在一个 JavaScript\
  \ 文件中，可以确保浏览器对这些脚本只需向服务器发起一次请求。这并不总是可能的——有时你需要加载诸如托管在其他服务器上的库等内容——但你写的任何脚本都应该尽可能包含在同一个文件中。\n\
  \n## 渐进降级 (Graceful Degradation)\n\n一些早期的网络浏览器甚至不支持在 HTML 中包含图像。随着 `<<img>>` 元素和其他标签的引入，对于那些纯文本浏览器，每当遇到不支持的标签时，向用户提供一些有用信息变得非常重要。对于\
  \ `<img>` 标签，这种功能是由 `alt` 属性提供的。网页设计师可以为 `alt` 分配一段文本字符串，纯文本浏览器将向用户显示该文本，而不是显示图像。根据页面设计师的意愿，`alt`\
  \ 文本可能只是图像的标题、图片本应显示内容的描述，或者对图形中应携带信息的替代来源的建议。\n\n这是 `渐进降级` 的早期示例——即由于浏览器缺乏所需的特定功能以充分利用网页设计（或禁用了这些功能）的用户仍然可以从网站内容受益的过程。\n\
  \n让我们以 JavaScript 本身作为另一个例子。几乎每个浏览器都支持 JavaScript，只有极小比例的用户会关闭它。那么，你真的需要担心那 1% 没有启用\
  \ JavaScript 的访问客吗？答案可能是肯定的。一种类型的频繁访问客无疑是搜索引擎的爬虫程序，它们忙于索引 Web 页面。爬虫尝试跟踪页面上所有的导航链接以建立网站内容的完整索引；如果此类导航需要\
  \ JavaScript 服务，你可能会发现网站的部分内容没有被索引。你的搜索排名可能会受到影响。\n\n另一个重要的例子位于可访问性领域。无论浏览器程序多么强大，总有一些用户会带着限制访问你的网站，例如无法使用传统的鼠标或必须使用屏幕阅读器软件。你可能希望你的网站对这部分观众是可访问的，这可能意味着要放弃所有的\
  \ JavaScript 华丽功能。\n\n## 渐进增强 (Progressive Enhancement)\n\n渐进降级的对面是 `渐进增强`，其主要开发原则是保持\
  \ HTML 文档尽可能简单，这样它们即使在最原始的浏览器中也能正常工作。在测试并确保基本功能始终可用后，你可以动态地添加功能，为使用新浏览器的用户提供更易用或更精美的体验。如果你无干扰地添加这些功能，它们几乎不会阻止网站以原始\
  \ HTML 形式运行。\n\n\n\n\n\n以下是渐进式增强的一些指南：\n\n* ![Image](img/arrow.jpg) 通过向单独的 CSS 文件添加样式规则来增强网站的呈现效果。尝试避免使用仅用于显示的\
  \ HTML 标签，例如用于加粗的 `<b>` 或用于缩进部分的 `<blockquote>`。\n* ![Image](img/arrow.jpg) 通过向外部\
  \ JavaScript 文件添加脚本来增强行为。\n* ![Image](img/arrow.jpg) 在不使用内联事件处理器的情况下添加事件，这在本课后文以及第\
  \ 24 节“响应事件和使用窗口](#ch24.xhtml)”中会有描述。\n* ![Image](img/arrow.jpg) 使用在本课后文描述的特性检测，确保\
  \ JavaScript 代码仅在支持其所需功能的浏览器上执行。\n\n### 添加事件处理器\n\n在第 24 节中，你学习了设置事件处理器的多种方法。最简单的方法是将它们直接添加到\
  \ HTML 标签中。例如，这个 `<body>` 标签有一个调用名为 `Startup` 函数的事件处理器：\n\n```html\n<body onload=\"\
  Startup();\">\n```\n\n这种方法虽然可行，但它确实涉及将 JavaScript 代码放入 HTML 页面中，这意味着你还没有完全分离内容和行为。为了保持完全分离，你可以在\
  \ JavaScript 文件中设置事件处理器，如下：\n\n```javascript\nwindow.onload=Startup;\n```\n\n这是一种可以的事件设置方法：它将\
  \ JavaScript 保持在 HTML 文件之外，并且在所有现代浏览器中都能运行。然而，它确实存在一个问题：你不能在页面的同一个元素上附加多个事件。例如，你不能拥有两个在页面加载时都执行的不同\
  \ `load` 事件处理器。\n\n当你是唯一编写脚本的人时，这并不是大问题；你可以将两个合并成一个函数。但当你尝试在页面上使用两个或三个第三方脚本，而它们都都想为\
  \ `<body>` 添加一个 `load` 事件处理器时，你就遇到问题了。\n\n#### W3C 事件模型\n\n为了解决这个问题并标准化事件处理，W3C\
  \ 作为 DOM Level 2 标准的一部分创建了事件模型。它使用方法 `addEventListener` 来将处理器附加到任何元素上的任何事件上。例如，以下代码使用\
  \ W3C 模型设置了与之前示例相同的 `load` 事件处理器：\n\n点击此处查看代码图像\n\n```javascript\nwindow.addEventListener('load',\
  \ Startup, false);\n```\n\n`addEventListener` 的第一个参数是事件名称，不带 `on` 前缀——`load`、`click`、`mouseover`\
  \ 等。第二个参数指定处理事件的函数，第三个参数是一个高级标志位，用于指示如何处理多个事件（`false` 适用于大多数情况）。\n\n可以通过这种方式向一个事件附加任意数量的函数。由于一个事件处理器不会替换另一个，因此你使用另一个独立的函数\
  \ `removeEventListener`，它使用相同的参数：\n\n点击此处查看代码图像\n\n```javascript\nwindow.removeEventListener('load',\
  \ Startup, false);\n```\n\nW3C 模型的一个问题是，尽管 Internet Explorer 9 支持它，但 Internet Explorer\
  \ 8 不支持。相反，Internet Explorer 8 支持一种专有方法 `attachEvent`，其功能非常相似。以下是微软风格定义的 `Startup`\
  \ 事件处理器：\n\n点击此处查看代码图像\n\n```javascript\nwindow.attachEvent('onload', Startup);\n\
  ```\n\n`attachEvent` 方法有两个参数。第一个是带有 `on` 前缀的事件——`onload`、`onclick`、`onmouseover`\
  \ 等。第二个是处理事件的函数。Internet Explorer 还支持 `detachEvent` 方法，它具有相同的参数，用于移除事件处理器。\n\n####\
  \ 以跨浏览器方式附加事件\n\n如你所示，用这种新方式附加事件是复杂的，并且需要不同的浏览器编写不同的代码。在大多数情况下，使用传统方法附加事件更好，这种方法也用于这些课程中的大多数示例中。然而，如果你确实需要支持多个事件处理器，可以使用一些\
  \ `if` 语句来使用 W3C 方法或微软的方法。例如，以下代码为 `id` 属性为 `btn` 的元素添加 `ClickMe` 函数作为事件：\n\n点击此处查看代码图像\n\
  \n```javascript\nobj = document.getElementById(\"btn\");\n\nif (obj.addEventListener)\
  \ {\n   obj.addEventListener('click',ClickMe,false);\n} else if (obj.attachEvent)\
  \ {\n   obj.attachEvent('onclick',ClickMe);\n} else {\n   obj.onclick=ClickMe;\n\
  }\n```\n\n这会检查 `addEventListener` 方法，如果找到则使用它。否则，它检查 `attachEvent` 方法并使用它。如果两者都没有找到，则使用传统方法附加事件处理器。这种技术称为\
  \ `特性检测`，在本课后文会有详细解释。\n\n可以使用通用函数来补偿缺乏统一的附加事件方法。如果你正在使用第三方库，很有可能它包含一个可以简化此过程的事件函数。\n\
  \n**注意**\n\nYUI 库与许多其他可用库一样，包含一个可以在任何浏览器中附加事件的函数，同时向多个对象附加相同的事件处理器并执行其他优秀的功能。详情请参见\
  \ `https://ylibrary.com`，并参第 26 节“使用第三方 JavaScript 库和框架](#ch26.xhtml)”获取使用其他库的信息。请注意，YUI\
  \ 库已不再维护，但你仍然可以使用这些脚本和样式。\n\n#### Web 标准：避免特定化\n\n Web 构建在标准之之上，例如由 W3C 开发的 HTML\
  \ 标准。现在有许多涉及 JavaScript 的标准——CSS、W3C DOM 以及定义 JavaScript 语法的 ECMAScript 标准。\n\n\
  微软、Mozilla 项目、Google 以及 Opera Software 等其他浏览器开发者不断改进他们的浏览器对 Web 标准的支持，但总会有某些特定浏览器的非标准特性，而且最新标准的某些部分在不同浏览器之间无法获得一致的支持。\n\
  \n尽管在多个浏览器中测试你的代码并尽一切手段让其运行是完全没问题的，但可能尽可能遵循标准而非特定浏览器的技术是一个好主意。这确保了你的代码将在未来改进标准支持的浏览器上运行，而特定器的特性可能会在新版本中消失。\n\
  \n**注意**\n\n确保遵循标准的原因之一是，你的页面可以被搜索引擎更好地解读，这通常有助于你的网站获得搜索流量。分离内容、呈现和行为也对搜索引擎有好处，因为它们可以关注你网站的\
  \ HTML 内容，而无需跳过 JavaScript 或 CSS。\n\n#### 好地处理错误\n\n无论你的开发技能现在或将来可能变得多么优秀，你的代码都会有错误。所有代码在某个点都会出现错误，良好处理错误是一个仔细开发者的标志。当你的\
  \ JavaScript 程序遇到某种错误时，JavaScript 解释器内部会创建一个警告或错误，并显示在 Web 浏览器的 JavaScript 控制台中。是否以及如何显示给用户取决于所使用的浏览器和用户的设置；用户可能会看到某种形式错误消息，或者失败的程序可能保持沉默但无活动状态。\n\
  \n\n\n\n两种情况对用户来说都不好；他或她可能不知道发生了什么错误，也不清楚该如何处理。当你尝试编写代码来处理各种浏览器和情况时，可以预见到某些可能会错误的区域。示例包括：\n\
  \n*   ![Image](img/arrow.jpg) 浏览器是否完全支持某个对象，以及该支持是否符合标准。\n*   ![Image](img/arrow.jpg)\
  \ 独立程序是否已完成执行，例如外部文件是否加载。\n\n尝试拦截潜在错误并干净地处理它们的有效方法是使用 `try` 和 `catch` 语句。`try` 语句允许你尝试运行一段代码。如果代码运行过程中没有错误，则一切正常；然而，如果发生了错误，你可以使用\
  \ `catch` 语句在错误消息发送给用户之前进行干预，并确定程序随后应该处理该错误。其语法如下：\n\n```javascript\ntry {\n   doSomething();\n\
  }\ncatch(identifier) {\n   doSomethingElse();\n}\n```\n\n在这里，`identifier` 是捕获到错误时创建的对象。它包含了有关错误的信息。例如，如果你想向用户提示\
  \ JavaScript 运行时错误的性质，可以使用如下代码结构来打开一个包含错误的对话框：\n\n```javascript\ncatch(err) {\n\
  \   alert(err.description);\n}\n```\n\n### 文档化代码\n\n随着你创建越来越复杂的脚本，不要忘记在代码中包含注释来记录其功能，特别是当某些代码看起来很困惑或难以运行时。对大型脚本中使用的数据结构、变量和函数参数进行记录也是一个好主意。\n\
  \n使用注释是组织代码的好方法，并将帮助你以后维护该脚本。如果你职业工作是创建网站，你绝对需要使用注释，以便他人能够像你一样方便地处理你的代码。以下是使用注释的一些示例：\n\
  \n*   ![Image](img/arrow.jpg) 将注释作为任何包含几行简单代码的对象或函数的序言：\n    点击此处查看代码图像\n    ```javascript\n\
  \    function calculateGroundAngle(x1, y1, z1, x2, y2, z2) {\n      /**\n      *\
  \ 计算两点之间的直线与\n      * 地面相交的弧度。\n      * @author Jane Doe you@yourdomain.com\n  \
  \    */\n      if(x1 > 0) {\n      .... more statements\n    ```\n\n*   ![Image](img/arrow.jpg)\
  \ 在代码可能引起困惑或容易被误解的地方使用内联注释：\n    点击此处查看代码图像\n    ```javascript\n    // 出性能考虑，需要使用我们的自定义排序方法\n\
  \    var finalArray = rapidSort(allNodes, byAngle) {\n      .... more statements\n\
  \    ```\n\n*   ![Image](img/arrow.jpg) 在作者可以传递读者可能不知道的专业知识的地方使用注释：\n    点击此处查看代码图像\n\
  \    ```javascript\n    // 浏览器 X 版本 Y 中图像 onload 漏洞的解决方案\n    if(!loaded(image1))\
  \ {\n      .... more statements\n    ```\n\n*   ![Image](img/arrow.jpg) 将注释作为常用代码修改的说明：\n\
  \    点击此处查看代码图像\n    ```javascript\n    // 你可以根据喜好更改以下尺寸：\n    var height = 400px;\n\
  \    ```\n\n### 确保可用性\n\n当你为网站添加酷功能时，不要忘记可用性——为你的网站用户让事情变得尽可能简单、逻辑化和方便。虽然有很多致力于可用性信息的书籍和网站，但常识也能大有裨益。\n\
  \n例如，假设你提供下拉列表作为在网站页面间导航的唯一方式。这是一个常见的界面元素，而且运行良好，但你的用户觉得它好用吗？尝试将其与页面顶部的简单链接组进行比较，你可能会发现以下情况是事实：\n\
  \n*   ![Image](img/arrow.jpg) 链接列表让你一目看出网站的内容；而下拉列表需要你点击才能查看相同的列表。\n*   ![Image](img/arrow.jpg)\
  \ 用户期待链接并能快速发现它们；下拉列表更有可能是表单的一部分而非导航工具，因此当用户想要导航你的网站时，它不会是他们寻找的。\n*   ![Image](img/arrow.jpg)\
  \ 使用链接导航只需点击，而使用下拉列表导航至少需要两次点击。\n\n每当你向网站添加任何功能——特别是潜在侵入性的 JavaScript 功能时——请记住考虑用户的观点。确保你正在让网站变得更容易用——至少不更难用。还要确保网站在没有\
  \ JavaScript 的情况下也能易用；虽然这可能只适用于一小部分用户，但这部分用户可能包含屏幕阅读器或其他视觉障碍人士辅助软件软件包的用户。\n\n###\
  \ 确保无障碍性\n\n作为开发者，你必须考虑无障碍性——让你的网站对所有用户（包括残障用户）尽可能可用。例如，盲人可能会使用忽略图像和大多数脚本的文本读取程序。无障碍性不仅仅是礼貌，在某些国家它是法律规定的。\n\
  \n无障碍性是一个复杂的课题，但通过遵循渐进增强你可以提供大部分需求：保持 HTML 尽可能简单，将 JavaScript 和 CSS 分离，使 JavaScript\
  \ 成为使用网站的增强而非要求。\n\n注意确保网站在没有 JavaScript 的情况下运行是实现无障碍性的第一步之一。更多关于无障碍性的信息，请参阅 `www.w3.org/WAI/`。如果你学习了更多关于可用性的知识，无疑会看到模式。在计算机科学中，设计模式是常见问题的最佳解决方案。在\
  \ Web 开发中，你使用设计模式来设计和实现反复遇到的网站部分。\n\n例如，如果你有一个显示多页数据的网站，你会有“下一页”和“上一页”链接，可能还有每页数字链接。这是一个常见的设计模式——许多\
  \ Web 设计师都解决的问题，且有一个通用的解决方案。其他常见的 Web 设计模式包括登录表单、搜索引擎和导航链接列表。\n\n当然，你可以完全原创，创建一个与任何其他东西都不一样的搜索引擎、购物车或登录表单，但除非你有办法让它们变得更易用，否则遵循模式并给用户提供符合他们预期的体验更好。\n\
  \n尽管你可以通过浏览与你类似的网站并注意它们如何解决特定问题来发现一些常见模式，也有专门记录这些模式的网站，它们是寻找如何制作网站想法的好地方。\n\n注意\
  \ Google 提供了许多 Web 设计师可以使用创建更高效网站的工具。关于一系列响应式模式，请访问 `https://developers.google.com/web/fundamentals/design-and-ux/responsive/patterns`。\n\
  \n### 尽可能复用代码\n\n现在你已经有了这些 JavaScript 代码，记住代码越能模块化并越可复用越好。看一眼这个函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction getElementArea() {\n```\n\n\n\n```javascript\nvar high\
  \ = document.getElementById(\"id1\").style.height;\nvar wide = document.getElementById(\"\
  id1\").style.width;\nreturn high * wide;\n}\n```\n\n此函数尝试返回由特定 HTML 元素覆盖的屏幕区域。遗憾的是，它只能对\
  \ `id` 值为 `id1` 的元素起，这实际上并没有什么帮助：它排除了你在其他任何地方使用这段代码的可能性，而且如果你想在别处进行类似的操作，就必须在其他地方复制该函数约\
  \ 98% 的代码。\n\n将代码收集成函数和对象等模块，以便在整个代码中运行和重用它们，这一过程被称为*抽象*（abstraction）。你可以通过将应应用于操作的元素的\
  \ `id` 作为参数传递，给前面的函数赋予一个更高层次的抽象，使其更具通用性：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ getElementArea(elementId) {\n    var element = document.getElementById(elementId);\n\
  \    var high = element.style.height;\n    var wide = element.style.width;\n   \
  \ return parseInt(high) * parseInt(wide);\n}\n```\n\n现在，你可以在调用函数时将 `id` 的值作为参数传递，对任何具有\
  \ `id` 的元素调用此函数：\n\n点击此处查看代码图像\n\n```javascript\nvar area1 = getElementArea(\"id1\"\
  );\nvar area2 = getElementArea(\"id2\");\n```\n\n### 读取浏览器信息\n\n在第 21 节中的“使用文档对象模型\
  \ (DOM)””中，你学习了代表浏览器窗口部分和当前网页文档的各种对象（例如 `window` 和 `document`）。JavaScript 还包含一个名为\
  \ `navigator` 的对象，你可以用它读取有关用户浏览器的信息。了解更多浏览器信息可以帮助你的脚本确定是否使用 JavaScript 的某些元素——例如，如果你的脚本能够判断正在使用像\
  \ Internet Explorer 8 这样的旧版浏览器，它可能会尝试实现专门为该浏览器编写的代码，而不是可能失败的通用代码。\n\n`navigator`\
  \ 对象不是 DOM 的一部分，因此你可以直接引用它。它包含了几个属性，每个属性都会告诉你一些关于浏览器的信息：\n\n* ![Image](img/arrow.jpg)\
  \ `navigator.appCodeName`——指定浏览器的内部代码名称，例如 `Mozilla`。你应该意识到，无论它们是否是基于 Mozilla 的浏览器，所有现代浏览器在此属性上都会返回\
  \ `Mozilla`。\n* ![Image](img/arrow.jpg) `navigator.appName`——指定浏览器的名称，例如 `Firefox`\
  \ 或 `Microsoft Edge`。\n* ![Image](img/arrow.jpg) `navigator.appVersion`——指定正在使用的浏览器版本——例如，`5.0\
  \ (Windows)`。\n* ![Image](img/arrow.jpg) `navigator.userAgent`——指定用户代理头，这是浏览器在请求网页时发送给\
  \ Web 服务器的字符串。它包含了所有的版本信息——例如 `Mozilla/5.0 (Macintosh; Intel Mac OS X 10.13; rv:59.0)\
  \ Gecko/20100101 Firefox/59.0`。\n* ![Image](img/arrow.jpg) `navigator.language`——指定浏览器的语言（如英语或西班牙语）。它存储为代码代码，例如代表美国英语的\
  \ `en-US`。\n* ![Image](img/arrow.jpg) `navigator.platform`——指定当前浏览器的计算机平台。这是一个短字符串，例如\
  \ `Linux i686`、`Win32` 和 `MacIntel`。你可以用它来启用任何特定平台的特性——例如用于 Windows 机器上 Internet\
  \ Explorer 的 ActiveX 组件。\n\n### 注意\n`navigator` 对象以 Netscape Navigator 命名，这是最初支持\
  \ JavaScript 的浏览器。幸运的是，尽管名称如此，但所有现代浏览器都支持此对象。\n\n`navigator` 对象的许多其他属性也很有用。你可以在\
  \ [`developer.mozilla.org/en-US/docs/Web/API/Navigator`](https://developer.mozilla.org/en-US/docs/Web/API/Navigator)\
  \ 学习更多关于 `navigator` 对象。\n\n#### 显示浏览器信息\n\n作为读取 `navigator` 对象属性的一个示例，列表 25.1 显示了一个脚本，该脚本显示了当前浏览器属性及其值的列表。\n\
  \n**列表 25.1** 用于显示浏览器信息的脚本\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Browser Information</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  </head>\n<body>\n    <h1>Browser Information</h1>\n    <p>The navigator object contains\
  \ the following information about the browser you are using:</p>\n    <ul id=\"\
  info\"></ul>\n    <script>\n        var txt = \"\";\n        txt += \"<li>Code Name:\
  \ \" + navigator.appCodeName + \"</li>\";\n        txt += \"<li>App Name: \" + navigator.appName\
  \ + \"</li>\";\n        txt += \"<li>App Version: \" + navigator.appVersion + \"\
  </li>\";\n        txt += \"<li>User Agent: \" + navigator.userAgent + \"</li>\"\
  ;\n        txt += \"<li>Language: \" + navigator.language + \"</li>\";\n       \
  \ txt += \"<li>Platform: \" + navigator.platform + \"</li>\";\n        document.getElementById(\"\
  info\").innerHTML = txt;\n    </script>\n</body>\n</html>\n```\n\n此脚本封装在一个基础 HTML\
  \ 文档中。JavaScript 被用于显示带有 `id` `info` 的元素的每个属性。要尝试此脚本，请在你选择的浏览器中加载它。Firefox 脚本的显示如图\
  \ 25.1\n\n**图 25.1** Firefox 显示浏览器信息。\n\n#### 处理虚假的的浏览器\n\n如果你在列表 25.1 中使用某些版本的\
  \ Internet Explorer 尝试浏览器信息脚本，你可能会感到意外。图 25.2 显示了 Internet Explorer 6 如何显示脚本。\n\n\
  ![显示浏览器信息的截图。文本 \"The navigator object contains the following information about\
  \ the browser you are using:\" 后面是 Code Name、App Name、App Version、User Agent、Language\
  \ 和 Platform。](img/25fig02.jpg)\n\n**图 25.2** Internet Explorer 6 显示脚本的方式。\n\n此显示有几处意外之处。首先，`navigator.language`\
  \ 属性显示为 `undefined`。这并不意外，因为 Internet Explorer 不支持此属性。\n\n更重要的是，注意 `Mozilla` 一词出现在\
  \ Code Name 和 User Agent 字段中。完整的用户代理字符串如下：\n\n点击此处查看代码图像\n\n`Mozilla/4.0 (compatible;\
  \ MSIE 6.0; Windows 98)`\n\n信不否，微软这样做确实有一个很好的理由。在浏览器大战时期，大约在 Netscape 3.0 和 Internet\
  \ Explorer 3.0 出出的时期，看到“仅限 Netscape”的页面变得常见。某些使用框架和 JavaScript 等功能的网站管理员设置服务器，拒绝用户代理字符串中不包含\
  \ `Mozilla` 的浏览器。这样做的问题在于，大多数这些功能也被 Internet Explorer 所支持。\n\n微软在 Internet Explorer\
  \ 4.0 中解决了这个问题，通过让 Internet Explorer 的用户代理读取为 `Mozilla`，并带有括号单词 `compatible`。这使得\
  \ Internet Explorer 用户能够查看这些页面，同时包含了足够详细的信息来告知 Web 服务器使用的是哪种浏览器。\n\n\n\n你可能已经注意到\
  \ Internet Explorer 6.0 用户代理字符串的另一个问题：读取 `Mozilla/4.0` 的那部分。Internet Explorer 不仅声称自己是\
  \ Netscape，而且还伪装成 4.0 版本。为什么要这样做？\n\n事实证明，这是微软为了在浏览器大战中保持领先一步的另一次努力，尽管这种做法看起来并不那么合理。由于某些编写得糟糕的脚本会专门针对动态\
  \ HTML 页面检查“Mozilla/4”，微软担心其 5.0 版本将无法运行这些页面。由于日后再修改它只会引起更多困惑，这种传统在 Internet Explorer\
  \ 6.0 中延续了下去。\n\n这些是浏览器大战史中两个有趣的插曲，但这一切对你意味着什么呢？嗯，当你的脚本尝试区分 Internet Explorer 和\
  \ Netscape 以及不同版本时，你必须非常小心。你需要检查特定的组合，而不仅仅是检查 `navigator.appVersion` 的值。幸运的是，有更好的方法处理这种情况，你将在下一节中学习到。\n\
  \n### 跨浏览器脚本\n\n如果检测不同浏览器版本的所有细节看起来都很困惑，那么这里有一个好消息：在大多数情况下，你可以编写无需引用 `navigator`\
  \ 对象的跨浏览器脚本。这不仅更简单，而且更好，因为浏览器检查代码经常会被新版本的浏览器搞乱，并且在每次发布新浏览器时都要更新。\n\n#### 特性检测\n\n\
  检查浏览器版本有时被称为*浏览器检测*（browser sensing）。处理多个浏览器的更好方法被称为*特性检测*（feature sensing）。在特性检测中，你不是检查特定的浏览器，而是检查某个特定的特性。例如，假设你的脚本需要使用\
  \ `document.getElementById` 函数。你可以用一个 `if` 语句开始脚本，检查该函数是否存在：\n\n点击此处查看代码图像\n\n```\n\
  if (document.getElementById) {\n   // 执行一些操作\n}\n```\n\n如果 `getElementById` 函数存在，则执行括号之间的代码块。使用特性检测的另一种常见方法是在使用某功能的函数开头：\n\
  \n点击此处查看代码图像\n\n```\nfunction changeText() {\n   if (!document.getElementById) return;\n\
  \   // 如果支持该特性，则执行函数的其余部分\n}\n```\n\n**注意**\n\n`getElementById` 方法被所有现代浏览器广泛支持。只有当你的脚本崩溃且你已经检查了其他所有可能性时，才需要为它设置特性检测。\n\
  \n你不需要在使用*每一个*特性之前都对其进行检查——例如，在大多数情况下，验证 `window` 对象是否存在并没有太大意义。你也可以假设一个特性的存在意味着其他特性也受到了支持：如果支持\
  \ `getElementById`，那么其他 W3C DOM 函数很可能也是支持的。\n\n特性检测是一种保持你的 JavaScript 代码非侵入性的非常可靠的方法：如果浏览器支持该特性，它就能运行；如果浏览器不支持，你的脚本就不会干扰运行。这比尝试跟踪数百个不同的浏览器版本及其支持的内容要容易得多。\n\
  \n**注意**\n\n在处理第三方库时，特性检测也非常方便，正如第 26 节 所讨论。你可以检查属于某个库的对象或函数是否存在，以验证在脚本使用其特性之前库文件已经加载。\n\
  \n#### 处理浏览器兼容性问题\n\n既然特性检测优于浏览器检测，为什么你仍然需要了解 `navigator` 对象？在一种情况下它仍然派得上用场，尽管如果你运气好，可能不会遇到那种情况。\n\
  \n当你开发复杂的脚本并在多个浏览器中进行测试时，你可能会遇到一种情况：你完美的标准代码在一个浏览器中正常工作，而在另一个浏览器中无法运行。假设你已经排除了脚本本身问题的可能性，你至少可能遇到了浏览器\
  \ Bug 或浏览器之间的特性差异。以下是针对这种情况的一些建议：\n\n* ![Image](img/arrow.jpg) 双重检查你自己代码是否存在 Bug。\n\
  * ![Image](img/arrow.jpg) 如果问题确实如此，使用特性检测来检测。\n* ![Image](img/arrow.jpg) 当万事无策时，使用\
  \ `navigator` 对象。\n\n**注意**\n\n在寻找浏览器 Bug 时，Peter-Paul Koch 在 [www.quirksmode.org](http://www.quirksmode.org)\
  \ 的 QuirksMode 是一个很好的起点。\n\n### 支持非 JavaScript 浏览器\n\n你网站的一些访问者不会使用 JavaScript。正如本节多次暗示过的，非\
  \ JavaScript 浏览器比你想象的要多：\n\n* ![Image](img/arrow.jpg) 大多数现代浏览器（如 Safari、Firefox\
  \ 和 Chrome）都包含关闭 JavaScript 的选项。\n* ![Image](img/arrow.jpg) 某些公司防火墙和个人防病毒软件会阻止 JavaScript。\n\
  * ![Image](img/arrow.jpg) 某些广告拦截软件会阻止脚本运行。\n* ![Image](img/arrow.jpg) 一些旧手机支持或完全不支持\
  \ JavaScript。\n* ![Image](img/arrow.jpg) 某些视觉障碍用户使用不支持 JavaScript 的特殊或纯文本浏览器。\n\n\
  如你所见，假设所有访问者都支持 JavaScript 是愚蠢的，尽管 99% 的流量是通过启用 JavaScript 的设备。接下来的章节将讨论两种可以让这些用户仍使用你网站的技术。\n\
  \n**注意**\n\n搜索引擎是另一个经常访问你网站的“浏览器”，它们完全不关注 JavaScript。如果你想让搜索引擎完全索引你的网站，避免将 JavaScript\
  \ 为必要条件至关重要。\n\n#### 使用 noscript 标签\n\n对非 JavaScript 浏览器友好的一种方法是使用 `<noscript>`\
  \ 标签。该标签被所有现代浏览器，向非 JavaScript 浏览器显示消息。支持 JavaScript 的浏览器会忽略 `<noscript>` 标签之间的文本，而其他浏览器则会显示。这里有一个简单的示例：\n\
  \n```html\n<noscript>\n此页面需要 JavaScript。你可以切换到支持 JavaScript 的浏览器，\n开启浏览器的脚本支持，\n\
  或者切换到此页面的 <a href=\"nojs.html\">非 JavaScript</a> 版本。\n</noscript>\n```\n\n一些较旧的浏览器不支持\
  \ `<noscript>`。使用 `<noscript>` 的替代方案是将支持 JavaScript 的用户重定向到另一个页面。这可以通过单条 JavaScript\
  \ 语句实现：\n\n```javascript\n<script>\nwindow.location=\"JavaScript.html\";\n</script>\n\
  ```\n\n此脚本将用户重定向到另一个不同的页面。如果浏览器不支持 JavaScript，当然，脚本不会执行，页面的其余部分可以显示警告消息来解释这种情况。这是一个相当激烈的选项，除非万不得已，否则你应该避免使用它。\n\
  \n\n\n\n虽然你可以检测 JavaScript 浏览器并向未启用 JavaScript 的浏览器显示消息，但最好的选择是让让你的脚本具有非侵入性（unobtrusive）。这意味着使用\
  \ JavaScript 是为了增强功能而不是作为核心特性：如果你将 JavaScript 保持在单独的文件中并在 JavaScript 文件中分配事件处理器而不是在\
  \ HTML 中分配，不支持 JavaScript 的浏览器将简单地忽略你的脚本。\n\n在极少数绝对需要 JavaScript 的情况下（例如使用 JavaScript\
  \ 游戏时），你可以提示用户需要 JavaScript。然而，提供一种替代的、无需 JavaScript 的网站使用方式仍然是一个好主意，特别是如果该网站是你的业务所赖的电子商务或商业网站。不要屈服于懒惰编程而推开客户。\n\
  \n你绝对 `not` 要求 JavaScript 的一个地方是你网站的导航栏。虽然你可以使用 JavaScript 创建下拉菜单和其他花哨的导航工具，但它们会阻止用户使用非\
  \ JavaScript 浏览器查看你网站的所有页面。它们还会阻止搜索引擎查看整个网站，从而危及你获取搜索流量的机会。\n\n### Note\n\nGoogle\
  \ 的 Gmail 应用（`https://mail.google.com`）需要 JavaScript 来提供优雅的界面。然而，Google 提供了一种可以在无需\
  \ JavaScript 的情况下使用的 Basic  HTML 视图。这使得 Google 能够支持旧版浏览器和手机，而不会损害使用现代浏览器的用户的体验。\n\
  \n### Avoiding Errors\n\n如果你已经确保 JavaScript 仅是你网站的增强功能而非要求，那么出于任何原因不支持 JavaScript\
  \ 的浏览器用户仍然能够导航你的网站。最后一点需要担心的是：JavaScript 可能会导致错误，或让这些浏览器错误地显示你的页面。这对于部分支持 JavaScript\
  \ 的浏览器（如旧款手机浏览器）来说是一个特别的问题。它们可能会解释 `<script>` 标签并启动脚本，但可能不支持完整的 JavaScript 语言或 DOM。\n\
  \n这里是一些避免错误的指南：\n\n*   ![Image](img/arrow.jpg) 为每个脚本使用单独的 JavaScript 文件。这是确保浏览器在没有\
  \ JavaScript 支持时完全忽略该脚本的最好方法。\n*   ![Image](img/arrow.jpg) 每当你的脚本尝试使用较新的 DOM 特性时，请使用特性检测（feature\
  \ sensing）。\n*   ![Image](img/arrow.jpg) 在关闭浏览器 JavaScript 支持的情况下测试你的页面。确保没有地方看起来很奇怪，并确保你仍然可以导航网站。\n\
  \n### Note\n\nFirefox 和 Chrome 的开发者工具栏包含了一个方便的测试时关闭 JavaScript 的方法。\n\n### Creating\
  \ an Unobtrusive Script\n\n作为非侵入性脚本的示例，你可以创建一个脚本，使用 JavaScript 为页面添加功能，同时不损害其在旧版浏览器中的性能——在这种情况下，这是一个创建图形复选框作为普通复选框的替代方案的脚本。\n\
  \n让我们从最终结果开始：图 25.3 显示了该示例在 Chrome 中的外观。第一个复选框是普通的 HTML 复选框，第二个是由 JavaScript 管理的图形复选框。\n\
  \n![一张截图显示了图形复选框的示例。提供了两个复选框，第一个是普通的复选框，第二个是图形复选框，比普通的要大。](img/25fig03.jpg)\n\n\
  **图 25.3** 图形复选框示例的运行，图形复选框已被勾选。\n\n图形复选框只是一个较大的图形，你可以点击它来显示图形的选中或未选中版本。虽然这可以只是一个像复选框的简单\
  \ JavaScript 模拟，但这里的实现要复杂一些。查看 列表 25.2 中此示例的 HTML。\n\n**列表 25.2** 图形复选框示例的 HTML\
  \ 文件\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n \
  \   <meta charset=\"utf-8\">\n    <title>Graphic Checkboxes</title>\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n\
  \    <h1>Graphic Checkbox Example（示例示例）</h1>\n    <form name=\"form1\">\n      <p>\n\
  \        <input type=\"checkbox\" name=\"check1\" id=\"check1\">\n        一个普通的复选框。\n\
  \      </p>\n      <p>\n        <input type=\"checkbox\" name=\"check2\" id=\"check2\"\
  >\n        一个用非侵入性 JavaScript 创建的图形复选框。\n      </p>\n    </form>\n    <script src=\"\
  checkbox.js\"></script>\n  </body>\n</html>\n```\n\n如果你仔细观察 HTML，你会发现这两个框是用完全相同的方式定义的，都使用了\
  \ `<input>` 元素。该脚本并不是替代复选框，而是实际上将复选框替换为图形版本。此示例的脚本显示在 `25.3` 中。\n\n```javascript\n\
  // 替换第二个复选框\nfunction graphicBox(box) {\n  // 保持非侵入性\n  if (!document.getElementById)\
  \ return;\n  // 找到对象及其父级元素\n  obj = document.getElementById(box);\n  parentobj =\
  \ obj.parentNode;\n  // 隐藏普通复选框\n  obj.style.display = \"none\";\n  // 创建图像元素并设置其事件\n\
  \  img = document.createElement(\"img\");\n  img.addEventListener(\"click\", Toggle);\n\
  \  img.src = \"images/unchecked.png\";\n  // 保存复选框 id\n  img.id = \"img\"+box;\n\
  \  // 显示图形复选框\n  parentobj.insertBefore(img,obj);\n}\n\nfunction Toggle(e) {\n \
  \ // 找到事件\n  if (!e) var e=window.event;\n  // 找到图像 id\n  img = e.target ? e.target\
  \ : e.srcElement;\n  // 通过从 id 中移除 \"img\" 找到复选框\n  checkid = img.id.substring(3);\n\
  \  checkbox = document.getElementById(checkid);\n  // 点击复选框\n  checkbox.click();\n\
  \  // 根据勾选状态显示正确的图像\n  if (checkbox.checked) {\n    file = \"images/checked.png\"\
  ;\n  } else {\n    file=\"images/unchecked.png\";\n  }\n  img.src=file;\n}\n\n//\
  \ 运行脚本\ngraphicBox(\"check2\");\n```\n\n\n\n使用这种技术有三个重要优点。首先，它是一个非侵入式的脚本，因为 HTML\
  \ 保持了简单，不支持 JavaScript 的浏览器将仅仅显示普通的复选框。其次，因为真实的复选框仍在页面上只是被隐藏，所以当表单提交到服务器端脚本时，它能够正常工作。最后，你还可以通过在\
  \ HTML 文件中定义普通的复选框并对每个复选框调用 `graphicBox` 来转换，从而轻松创建任何数量的图形复选框。\n\n要尝试此示例，请将 JavaScript\
  \ 文件保存为 `checkbox.js`，并确保 HTML 文件位于同一个文件夹中。你还需要在同一个文件夹中准备两个大小相同的图形：`unchecked.gif`\
  \ 和 `checked.gif`。\n\n### 总结\n\n在本节中，你学习了许多编写尽可能在多个浏览器中运行脚本的指南，并学习了在处理不同浏览器工作时如何避免错误和烦恼。最重要的一点是，你学习了如何通过\
  \ Web 标准，在保持页面轻量、高效且规范的同时使用 JavaScript。\n\n### 问答\n\n**Q. 是否可能创建 100% 非侵入式的 JavaScript，既能增强页面又不会给任何人带来任何麻烦？**\n\
  \n**A**. 不完全是。例如，本节上一部分中的非侵入式脚本就非常接近了：它可以在最新浏览器中运行，而普通的复选框即使在非常古老的浏览器中也能正常显示和工作。然而，如果使用现代浏览器的人关闭了图片显示，脚本仍然会失效：由于支持\
  \ JavaScript，脚本会隐藏复选框，但图片并不存在。这是一种罕见的情况，但它说明了你添加的任何功能都可能给你的一小部分用户带来问题。\n\n**Q. 我可以使用使用\
  \ `navigator` 对象或其他技术来检测用户的电子邮件地址吗？**\n\n**A**. 不可以。没有可靠的方法可以通过 JavaScript 来检测用户的电子邮件地址。（如果真的可以的话，每当你浏览他们的页面时，每天都会在信箱里收到数百封广告邮件，因为那些公司检测到了你的地址。）\n\
  \n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n**1.**\
  \ 下列哪项是放置 JavaScript 代码的最佳位置？\n\n1.  在 HTML 文件中\n2.  在 JavaScript 文件中\n3.  在 CSS\
  \ 文件中\n\n**2.** 下列哪项是你使用 JavaScript *无法* 做的？\n\n1.  将不支持某项特性的浏览器引导到另一个页面\n2.  将\
  \ Internet Explorer 的用户引导到另一个页面\n3.  将非 JavaScript 浏览器的用户引导到另一个页面\n\n**3.** 将代码模块化为可重用块以供更通用用途的术语是什么？\n\
  \n1.  抽象 (Abstraction)\n2.  继承 (Inheritance)\n3.  非侵入式 JavaScript (Unobtrusive JavaScript)\n\
  \n**4.** 在 HTML 中调用脚本的最佳位置是哪里？\n\n1.  在 `<head>` 元素中\n2.  在 `<<body>>` 元素的顶部\n3.\
  \  在 `<<body>>` 元素的底部\n4.  在哪里调用脚本都没有关系\n\n**5.** 如果你既可以用脚本构建，也可以用 CSS 或 HTML 构建，哪种是更好的选择？\n\
  \n1.  先写 HTML 后添加 CSS\n2.  仅使用 HTML\n3.  JavaScript\n4.  没有区别\n\n**6.** 哪种更好：优雅式降级\
  \ (graceful degradation) 还是渐进式增强 (progressive enhancement)？\n\n1.  渐进式降级\n2.  渐进式增强\n\
  3.  两者都使用\n4.  两者都不使用\n\n**7.** 为什么像这样绑定事件：`window.onload=start;` 比使用事件监听器（event\
  \ listeners）效果差？\n\n1.  这些事件比事件监听器慢。\n2.  你只能为元素添加一个事件，如果其他库也需要绑定事件，这就会产生干扰。\n3.\
  \  并非所有浏览器都能理解事件监听器。\n4.  它的效率并不低。这才是你应该绑定事件的方式。\n\n**8.** 使用 `navigator` 对象进行浏览器检测是一个好主意吗？\n\
  \n1.  是的，它非常有效。\n2.  不。它太慢了，无法起作用。\n3.  不。某些现代浏览器不支持它。\n4.  不。所有浏览器发送的值都相同。\n\n\
  **9.** 比使用 `navigator` 对象解决跨浏览器脚本问题的更好方法是什么？\n\n1.  特性检测 (Feature detection)\n2.\
  \  方法检测 (Method detection)\n3.  对象检测 (Object detection)\n4.  没有更好的方法\n\n**10.**\
  \ 为什么你应该在关闭 JavaScript 的情况下测试你的页面？\n\n1.  因为很多客户不使用 JavaScript\n2.  因为移动浏览器不使用 JavaScript\n\
  3.  为了确保不需要 JavaScript\n4.  你不需要这样做。\n\n注意\n\n提醒给正在阅读纸质或电子书的读者：如果你访问 `www.informit.com/register`\
  \ 即可获取这本书的交互版本（使用 ISBN 978067233883）。\n\n### 答案\n\n**1.** b.\n**2.** c.\n**3.**\
  \ a.\n**4.** c.\n**5.** a.\n**6.** c.\n**7.** b.\n**8.** d.\n**9.** a.\n**10.**\
  \ c.\n\n### 练习\n\n*   ![Image](img/arrow.jpg) 在 Listing 25.2 的 HTML 文档中添加几个复选框，并在\
  \ Listing 25.3 的脚本中添加相应的函数调用，将所有复选框转换为图形复选框。\n\n*   ![Image](img/arrow.jpg) 修改 Listing\
  \ 25.3 中的脚本，将 `class` 为 `graphic` 的所有复选框转换为图形复选框。你可以使用 `getElementsByTagName` 然后检查每个项目的\
  \ `className` 属性。你也可以使用 `getElementsByClassName` 并遍历数组，正如你在第 23 节“使用条件和循环控制流程](#ch23.xhtml)”中所学习的那样。\n\
  \n## 第 26 节\n\n## 使用第三方 JavaScript 库和框架\n\n**在本节中将学到：**\n\n*   ![Image](img/arrow.jpg)\
  \ 为什么你可能使用第三方 JavaScript 库或框架\n\n*   ![Image](img/arrow.jpg) 库与框架的区别\n\n\n\n\n*\
  \ ![Image](img/arrow.jpg) 你可能以及何时使用 Angular、jQuery、React 以及其他第三方库\n* ![Image](img/arrow.jpg)\
  \ 如何在应用程序中下载和使用流行的第三方 JavaScript 库\n* ![Image](img/arrow.jpg) JavaScript 框架的优势\n\
  \n第三方 JavaScript 库——即由第三方编写并维护的代码库，以便在您自己的代码中轻松实现——与始终自己编写代码相比，它们具有许多优势。首先最重要的是，使用这些库可以让你避免在常见任务上重复轮子。此外，这些库还允许你实现跨浏览器脚本和复杂的用户界面元素，而无需先成为\
  \ JavaScript 专家。\n\n市上有许多第三方 JavaScript 库，本节将对其中几个流行的库进行简要介绍。此外，你将学习一些 JavaScript\
  \ 框架——正如其名所示，它们为你的开发提供了一些底层结构，而不是仅仅是构建自己的结构并使用其他地方碎片（库）。\n\n## 使用第三方 JavaScript\
  \ 库\n\n当你使用 JavaScript 内置且经常使用的 `Math` 和 `Date` 函数时，JavaScript 完成了大部分工作；你不需要思考如何在不同格式之间转换日期或计算余弦，只需使用\
  \ JavaScript 提供的函数即可。第三方库是指未直接包含在 JavaScript 中的库，但它们具有类似的作用：它们允许你用极少的代码完成复杂操作，因为这少部分代码引用了底层由他人已经创建的庞大内容。\n\
  \n尽管通常大多数人都是第三方库的忠实粉丝，但你应该意识到存在一些常见的反对意见：\n\n* ![Image](img/arrow.jpg) 你永远无法真正知道代码是如何工作的，因为你只是在使用他人的算法和函数。\n\
  * ![Image](img/arrow.jpg) JavaScript 库包含了许多你永远用不到的代码，但浏览器必须下载这些代码。\n\n盲目地实现代码绝不是一件好事。当你使用任何库时，应该努力理解幕后发生了什么。但这种理解可能仅限于知道别人写了一个你无法写的复杂算法；如果这就是你所了解的全部，也没关系，只要你恰当地实现它并理解可能的缺点即可。\n\
  \n如果你知道目标用户有带宽限制，或者库的大小与你从中使用的功能不成正比，那么库包含大量无关代码的事实应该是一个考虑因素。例如，如果你的代码需要浏览器加载 1MB\
  \ 的库只为了使用一个函数，你应该寻找分叉（fork）该库的方法（如果它是开源的），这样你就可以只使用需要的部分，寻找该库中其他可以使用的功能以使其变得值得，或者直接寻找另一个能够实现你需求但开销更小的库。\n\
  \n然而，无论这些反对意见如何，使用第三方 JavaScript 库都有许多充分理由，在我们看来，这些理由超过了负面的反对意见：\n\n* ![Image](img/arrow.jpg)\
  \ 使用编写良好的库确实可以消除编写跨浏览器 JavaScript 的一些烦恼。你无法让每个浏览器都随时可用，但库的作者以及他们的用户社区已经测试过所有主流浏览器的多个版本（包括旧版本）。\n\
  * ![Image](img/arrow.jpg) 为什么要发明别人已经写过的代码？流行的 JavaScript 库倾向于包含程序员经常需要使用的抽象——这意味着你可能也经常需要这些函数。最常用的库所产生的数千次下载以及数页在线文档和评论，几乎保证了这些库所包含的代码将比普通用户的自制代码经过更彻底的测试和调试。\n\
  * ![Image](img/arrow.jpg) 像拖放和基于 JavaScript 的动画等高级功能，嗯，确实非常高级。对于这类功能的真正的跨浏览器解决方案一直是为所有浏览器编写代码时最棘手的特效之一，而开发良好且测试充分以实现此类功能的库，在节省你的时间和精力方面具有极高的价值。\n\
  \n使用第三方 JavaScript 库通常简单到只需将一个或多个文件复制到你的服务器（或链接到外部但极其稳定的位置），并在文档中包含一个 `<script>`\
  \ 标签来加载库，从而使其代码供你自己的脚本使用。接下来的章节将介绍几个流行的 JavaScript 库。\n\n### jQuery\n\njQuery 于\
  \ 2006 年引入，已从一种易于的跨浏览器 DOM 操作手段增长为稳定、强大的库。该库不仅包含 DOM 操作工具，还包含许多让跨浏览器 JavaScript\
  \ 编码变得更加简单高效的额外功能。事实上，你将在本节晚些时候学习的许多 JavaScript 框架都依赖 jQuery 库来实现功能。\n\n当前版本（于写作时）是\
  \ 3.3.1，jQuery 还有一个一个高级的用户界面扩展库，称为 `jQuery UI`，它可以与现有库配合使用，快速构建和部署丰富的用户界面，或为现有组件添加各种吸引特效。此外，jQuery\
  \ Mobile 是一个针对触摸优化的移动端框架，帮助设计师制作响应式应用和网站，使其能够在移动设备以及笔记本电脑和桌面设备上运行。\n\n**注意**\n\n\
  在 jQuery 的主页 [`jquery.com`](http://jquery.com)，你不仅可以下载最新版本，还可以访问广泛的文档和示例代码。配套的 UI\
  \ 库可以在 [`jqueryui.com`](http://jqueryui.com) 找到，jQuery Mobile 在 [`jquerymobile.com`](https://jquerymobile.com)。\n\
  \n如果你不想在本地开发机器或生产服务器上下载并存储 jQuery 库，可以使用内容分发网络（CDN）的远程托管版本，例如由 Google 托管的版本。与其在\
  \ HTML 文件中引用本地托管的 `.js` 文件，不如使用以下代码链接到稳定且压缩的代码版本：\n\n```html\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
  ></script>\n```\n\n在许多情况下，这比托管自己的版本性能更好，因为 Google 的服务器针对低延迟、大规模并行的内容分发进行了优化。此外，任何访问你的页面且也访问过引用此相同文件的用户，其浏览器中都已缓存该文件，无需再次下载。你可能想要使用的许多库和框架都托管在\
  \ Google CDN 及其他此类网络上。\n\njQuery 的核心是一种复杂的跨浏览器页面元素选择方法。用于获取元素的选择器基于简单 CSS 类选择器样式的组合，因此通过你在第三部分（#part03.xhtml）中学习的\
  \ CSS 技术，“使用 CSS 的高级网页设计”，你上手 jQuery 应该没有问题。以下是几段 jQuery 代码的简短示例，以说明这一点。\n\n如果你想获取一个\
  \ `id` 为 `someElement` 的元素，只需使用以下：\n\n```javascript\n$(\"#someElement\")\n```\n\n\
  你像使用 CSS 一样使用井号 (`#`) 来选择特定的 ID。\n\n\n\n\n要返回具有 `someClass` 类名的元素集合，你可以直接使用以下代码：\n\
  \n```javascript\n$(\".someClass\")\n```\n\n你使用句点（`.`）来表示你正在选择具有特定类名的元素。\n\n你可以非常简单地获取或设置与所选元素关联的值。例如，假设你想隐藏所有类名为\
  \ `hideMe` 的元素。你只需要一行代码就能以完全跨浏览器的方式实现这一点：\n\n```javascript\n$(\".hideMe\").hide();\n\
  ```\n\n操作 HTML 和 CSS 属性同样简单。例如，要在所有段落元素（`<p>`）的末尾添加“powered by jQuery”短语，你只需编写以下代码：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"p\").append(\" powered by jQuery\");\n```\n\n\
  接着要更改这些元素的背景颜色，你可以直接操作它们的 CSS 属性，如下所示：\n\n点击此处查看代码图片\n\n```javascript\n$(\"p\").css(\"\
  background-color\",\"yellow\");\n```\n\n此外，jQuery 还包含了简单的跨浏览器方法，用于判断元素是否具有某个类、添加和删除类、获取和设置元素的文本或\
  \ `innerHTML`、导航 DOM、获取和设置 CSS 属性，以及以跨浏览器的方式轻松处理事件。\n\n相关的 UI 库提供了大量的 UI 组件（如日期选择器、滑块、对话框和进度条）、动画工具、拖放功能等丰富内容。\n\
  \n### 注意事项\n你甚至可以通过编写额外的插件来自己扩展 jQuery，或者你可以使用其他开发者已经提交的数千个插件。浏览 [`plugins.jquery.com`](http://plugins.jquery.com)\
  \ 查看按分类搜索的大量示例。\n\n### Prototype\nPrototype 由 Sam Stephenson 创建，是一个 JavaScript 库，它简化了诸如处理\
  \ DOM 对象、处理表单中的数据以及远程脚本（AJAX）等任务。通过在文档中包含单个 `prototype.js` 文件，你就可以使用许多相对于基础 JavaScript\
  \ 的改进功能。\n\n例如，在这些课程的其他部分中，你已经使用了 `getElementById` JavaScript 方法来获取网页内元素的 DOM 对象。Prototype\
  \ 包含了该方法的改进版本：`$` 函数。Prototype 函数不仅更易输入，而且比内置函数更先进，并支持多个对象。\n\n将 Prototype 添加到你的页面只需要一个文件\
  \ `prototype.js` 和一个 `<script>` 标签，如下：\n\n点击此处查看代码图片\n\n```html\n<script src=\"\
  prototype.js\"></script>\n```\n\n或者，你可以从 CDN 获取 Prototype 并引用它，就像在前一节的 jQuery 示例一样。\n\
  \n### 注意事项\nPrototype 是免费开源软件。你可以从它的官方网站 [www.prototypejs.org](http://www.prototypejs.org)\
  \ 下载它。Prototype 也被内置在用于服务器端语言 Ruby 的 Ruby on Rails 框架中；更多信息请参阅 [`rubyonrails.org`](https://rubyonrails.org)。\n\
  \n### script.aculo.us\n在这些课程结束时，你将学习如何使用 JavaScript 做一些实用的事情，这些通常涉及复杂的代码。但你也可以通过使用预构建库和几行代码，在页面中加入令人印象深刻的效果。\n\
  \n由 Thomas Fuchs 开发的 script.aculo.us 就是这样的库之一。它包含了简化拖放任务的函数，例如重新排列项目列表。它还包含许多组合效果，允许你在页面中使用高亮和动画过渡。例如，页面的一个新部分可以短暂高亮为黄色以吸引用户的注意力，或者页面的某部分淡出或滑出屏幕。\n\
  \n### 警告\n虽然 script.aculo.us 仍被许多设计师广泛使用，但它自 2010 年以来就未更新过，可能不具备你想要的所有现代功能。\n\n\
  在你包含了适当的文件后，使用效果就像使用 JavaScript 的任何内置方法一样简单。例如，以下语句使用 script.aculo.us 将 `id` 值为\
  \ `test` 的页面元素淡出：\n\n点击此处查看代码图片\n\n```javascript\nobj = document.getElementById(\"\
  test\");\nnew Fade(obj);\n```\n\nscript.aculo.us 是建立在 Prototype 框架之上的，正如前文所述，你可以通过\
  \ `$` 函数来简化，如下所示：\n\n```javascript\nnew Fade(obj);\n```\n\n```javascript\nobj =\
  \ $(\"(\"test\");\nnew Fade(obj);\n```\n\n下一节展示了如何将 script.aculo.us 引入文档。\n\n###\
  \ 其他流行的 JavaScript 库\n有很多 JavaScript 库，并且随着时间的推移不断出现。这里有两个你可能想要探索的库：\n\n- ![image](img/arrow.jpg)\
  \ **Dojo** ([www.dojotkit.org](http://www.dojotkit.org))——这是一个开源工具包，为 JavaScript\
  \ 增加了从字符串和数学等的功能。\n- ![image](img/arrow.jpg) **MooTools** ([`mootools.net`](https://mootools.net))——这是一个面向对象的\
  \ JavaScript 库，重点是重用性和模块化。\n\n### 使用第三方库添加 JavaScript 效果\n为了查看使用外部库有多简单，在本节中我们将创建一个包含\
  \ script.aculo.us 和 Prototype 的脚本来演示几种效果。\n\n### 警告\n此示例使用的是 script.aculo.us 1.9\
  \ 版本和 Prototype 1.7 版本创建的。开发者通常会确保向下兼容，但底层代码可能已经发生了变化。\n\n此示例展示了如何通过利用 Google CDN\
  \ 引入 script.aculo.us。为此，只需使用 `<script>` 标签引用代码：\n\n点击此处查看代码图片\n\n```html\n<script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/prototype/1.7.2/prototype.js\"></script>\n\
  <script src=\"http://ajax.googleapis.com/ajax/libs/scriptaculous/1.9.0/scriptaculous.js\"\
  ></script>\n```\n\n### 注意事项\n当然，你可以将 script.aculo.us 和 Prototype 下载到你的本地开发机器或 Web\
  \ 服务器并进行引用。如果你选择此路径，请将所有资源放在单独的目录（例如包含所有 JavaScript 库的 `js` 文件夹），并确保你的 `<script>`\
  \ 标签引用相应的路径。\n\n在你包含了外部代码后，你只需要包含少量 JavaScript 来触发效果。本节使用了封装在 `<p>` 标签中且 `id` 值为\
  \ `testarea` 的页面部分来演示 script.aculo.us 可以实现的某些效果。每个效果都通过按钮上的简单事件处理程序触发。例如，以下代码定义了淡出按钮：\n\
  \n\n\n\n\n```html\n<button onclick=\"new Effect.Fade($('testarea'))\">Fade Out</button>\n\
  ```\n\n这段代码使用了 Prototype 内置的 `$` 函数来获取 `id` 值为 `testarea` 的元素对象，然后将其传递给 script.aculo.us\
  \ 内置的 `Effect.Fade` 函数。\n\n### 注意\n\n此示例演示了 6 种效果：`Fade`、`Appear`、`SlideUp`、`SlideDown`、`Highlight`\
  \ 和 `Shake`。库中超过 16 种效果，外支持拖放和其他功能的方法。详情请参见 `script.aculo.us`。\n\n一旦你包含了 `script.aculo.us`\
  \ 库，就可以将效果与事件处理程序以及示例文本结合起来，查看 script.aculo.us 效果的完整演示。此示例的完整 HTML 文档如列表 26.1。\n\
  \n**列表 26.1** 完整的库效果示例\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Testing script.aculo.us\
  \ effects</title>\n    <style>\n      #testarea {\n        background-color:#CCC;\
  \ margin:20px; padding:10px;\n      }\n    </style>\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n    <script src=\"https://ajax.googleapis.com/ajax/libs/prototype/1.7.3.0/prototype.js\"\
  ></script>\n    <script src=\"https://ajax.googleapis.com/ajax/libs/scriptaculous/1.9.0/scriptaculous.js\"\
  ></script>\n  </head>\n  <body><body>\n    <h1>Testing script.aculo.us Effects</h1>\n\
  \    <button onclick=\"new Effect.Fade($('testarea'))\">Fade Out</button>\n    <button\
  \ onclick=\"new Effect.Appear($('testarea'))\">Fade In</button>\n    <button onclick=\"\
  new Effect.SlideUp($('testarea'))\">Slide Up</button>\n    <button onclick=\"new\
  \ Effect.SlideDown($('testarea'))\">Slide Down</button>\n    <button onclick=\"\
  new Effect.Highlight($('testarea'))\">Highlight</button>\n    <button onclick=\"\
  new Effect.Shake($('testarea'))\">Shake</button>\n    <hr>\n    <h2>Testing Effects</h2>\n\
  \    <p id=\"testarea\">\n      文档的这一部分位于一个 `id` 值为\n      `testarea` 的 `<p>` 元素内。上方按钮上的\n\
  \      事件处理程序会将此对象发送到\n      <a href=\"http://script.aculo.us/\">script.aculo.us</a>\
  \ 库\n      以执行效果。点击按钮查看效果的运行。\n    </p>\n  </body>\n</html>\n```\n\n该文档以两个 `<script>`\
  \ 标签开头，用于包含 JavaScript 代码的第三方文件，你的脚本将引用这些代码。效果本身是由为六个按钮定义的定义的事件处理程序触发的。末尾的 `<p>`\
  \ 部分定义了用于演示效果的 `testarea` 元素。\n\n当你在 浏览器中加载此脚本时，显示内容应如图 26.1 所示。加载完成后，你应该能够点击页面顶部六个按钮中的任何一个来触发\
  \ script.aculo.us JavaScript 库提供的效果。\n\n![截图显示了如何使用 JavaScript 实现效果。页面上有六个按钮：Fade\
  \ Out、Fade In、Slide Up、Slide Down、Highlight 和 Shake。底部显示了文本用于测试效果。](img/26fig01.jpg)\n\
  \n**图 26.1** JavaScript 效果示例，准备就绪。\n\n### 使用 JavaScript 框架\n\nJavaScript 库和 JavaScript\
  \ 框架之间存在巨大差异：简单的库倾向于体积较小，并提供旨在实现功能的预制代码片段。\n\n\n\n\n\n*   ![Image](img/arrow.jpg)\
  \ `Ember` ([`emberjs.com`](https://emberjs.com))—类似于 Backbone.js，Ember 让新开发者能够快速上手。尽管它对某些人来说似乎“太有魔法性了”，但\
  \ Ember 对通用编程惯用法的严格遵循对新开发者来说是一个优势。\n\n*   ![Image](img/arrow.jpg) `Knockout` (knockoutjs.com)—虽然没有之前列出的框架那么流行，但\
  \ Knockout 仍然为新开发者提供了一个强大的替代方案，并提供了几个非常不错的教程。\n\n*   ![Image](img/arrow.jpg) `React`\
  \ ([`reactjs.org`](https://reactjs.org))—关于 React 是库还是框架还存在一些争论，但无论它是什么，它都是创建交互式网页和应用程序的流行工具，并且人气一直在不断增长。\n\
  \n在本文写作时，市上的 JavaScript 框架远多于这几个，我们完全预计未来几年会有更多。为了保持最新状态或了解 JavaScript 框架和库的核心功能，你可以从书签并反复访问\
  \ JavaScripting ([www.javascripting.com](http://www.javascripting.com)) 开始。\n\n\
  ### 总结\n\n在本节中，你学习了 JavaScript 可用的许多第三方库，这些库提供了许多优势，包括易于跨浏览器脚本、HTML 和 CSS 值的选择与编辑、动画，以及更高级的用户界面工具（例如拖放）。你使用了\
  \ `script.aculo.us` 和 `Prototype` 库来实现了一些像这样基础的 JavaScript 效果。\n\n此外，你还学习了一些流行的\
  \ JavaScript 框架，以及你如何利用它们，按照遵循标准的软件架构模式（如模型-视图-控制器 `MVC` 模式）来开发功能丰富的 Web 应用程序。\n\
  \n### 问答\n\n**Q. 我可以在同一个脚本中使用多个第三方库吗？**\n\n**A.** 是的，理论上可以：如果这些库编写得良好且设计为互互不干扰，那么在同一个脚本中使用它们没有问题。在实践中，这取决于你需要的库以及它们的编写方式，但许多\
  \ JavaScript 库可以一起使用，或者会包含关于不兼容的警告。\n\n**Q. 我可以构建自己的库来简化脚本编写吗？**\n\n**A.** 可以。随着你处理的脚本变得越来越复杂，你会发现自己反复使用相同的函数，如果这些是你是你创建的函数，那么将它们存储在单独的库文件中可能是一个好主意。这个过程非常简单：创建一个包含代码的\
  \ `.js` 文件，将其放在服务器上，并像引用其他库一样在 `<script>` 标签中引用它。\n\n## 工作坊\n\n工作坊包含测题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n### 测验\n\n**1.** 下列哪个对象*不是* JavaScript 库？\n\n1. `script.aculo.us`\n2. `Yahoo!\
  \ UI`\n3. `AJAX`\n\n**2.** 你如何自己扩展 `jQuery`？\n\n1. `jQuery` 无法扩展。\n2. 你可以编写服务器端脚本。\n\
  3. 你可以编写一个插件或使用预写的插件。\n\n**3.** `script.aculo.us` 还使用了哪种 JavaScript 第三方库？\n\n1.\
  \ `Prototype`\n2. `Dojo`\n3. `jQuery`\n\n**4.** 使用 JavaScript 库有什么缺点？\n\n1. 你不知道代码是如何运行的，因为代码不是你写的。\n\
  2. 代码中通常包含比你需要的更多的内容，导致页面臃肿。\n3. 许多库中包含恶意代码。\n4. A 和 B 都对。\n\n**5.** 如果你不想在自己的服务器上下载并存储库，你的选择是什么？\n\
  \n1. 使用 `CDN`\n2. 使用托管提供商\n3. 使用其他库\n4. 使用 `PHP`\n\n**6.** 下面的 `jQuery` 代码段的作用是什么？\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"em.bright\").css(\"background-color\",\"pink\"\
  );\n```\n\n1. 选择所有带有 `em` 和 `bright` 类的元素，并将它们的背景颜色改为粉色。\n2. 选择所有带有 `bright` 类的\
  \ `<em>` 元素，并将它们的背景颜色改为粉色。\n3. 选择所有带有 `bright` 类的元素，并将它们变为粉色背景的 `<em>` 元素。\n4. 选择带有\
  \ `bright` 类的第一个 `<em>` 元素，将其背景颜色改为粉色。\n\n**7.** 哪个 `Prototype` 函数替换了 `getElementById`？\n\
  \n1. 没有替换 `getElementById` 的 `Prototype` 函数。\n2. `getElement` 函数\n3. `byId` 函数\n\
  4. `$` 函数\n\n**8.** 为什么要把脚本库包含在文档的 `<head>` 中？\n\n1. 这样它们就可以被访问。\n2. `getElement`\
  \ 函数\n3. `byId` 函数\n4. `$` 函数\n\n**9.** `MVC` 代表什么？\n\n1. Massive\n2. Multi-view-controller\n\
  3. Model-view-controller\n4. Mobile-view-controller\n\n**10.** 三个流行的 JavaScript\
  \ 框架是什么？\n\n1. `Angular`, `Knockout`, 和 `React`\n2. `AngularJS`, `Ember`, 和 `React`\n\
  3. `AngularJS`, `Backbone.js`, 和 `Knockout`\n4. `Backbone.js`, `Ember`, 和 `Knockout`\n\
  \n### 答案\n\n**1.** `AJAX` 是一种编程技术，允许你的脚本可以使用托管在你的服务器上的资源，但 AJAX 本身并不是一个库。\n\n**2.**\
  \ `jQuery` 拥有一个详尽的编写和使用插件的方法。\n\n**3.** `script.aculo.us` 使用 `Prototype`。\n\n**4.**\
  \ 你不知道代码是如何运行的，因为代码不是你写的，而且库通常包含大量你需要的额外代码，浏览器必须下载这些代码。\n\n**5.** 你可以使用 `CDN`。\n\
  \n**6.** 这段代码选取了所有带有 `bright` 类的 `<em>` 标签，并赋予了它们背景颜色 `pink`。\n\n**7.** `$` 函数是\
  \ `Prototype` 中的一个改进版本。\n\n**8.** 大多数设计师将它们放在那里是因为它们可以通过脚本访问它们。\n\n**9.** `MVC`\
  \ 代表 model-view-controller（模型-视图-控制器）。\n\n**10.** 一些流行的框架包括 `AngularJS`, `Ember`\
  \ 和 `React`。\n\n注意\n\n提醒正在阅读纸质版或电子书版本的读者：如果你访问 [www.informit.com/register](http://www.informit.com/register)\
  \ 并注册此本书（使用 ISBN 978067233808），你可以免费获得在线版，该版本不仅包含本书的完整文本，还包含此测验的交互式版本。\n\n\n\n\n\
  \n# 如何创建 HTML 表单的前端\n# 如何为表单数据命名\n# 如何在表单中包含隐藏数据\n# 如何根据不同情况选择正确的表单输入控件\n# 如何验证表单数据\n\
  # 如何提交表单数据\n# 如何使用 JavaScript 使用 `form` 对象\n\n## Web 表单简介\n\n到为止，这些课程中的几乎所有内容都集中在将信息发送给他人。但你也可以利用你的网页从阅读并与之交互的人们那里收集信息。\n\
  \nWeb 表单允许你从访问网页的用户那里接收反馈、订单和其他信息。如果你用过像 Google 或 Bing 这样的搜索引擎，你对 HTML 表单并不陌生——那些单字段输入表单，每个表单都带有一个按钮，点击后它就能提供你寻找的所有信息甚至更多。产品订单表也是表单的一种非常流行的用途；如果你在\
  \ `Amazon.com` 上订过任何东西，或从 eBay 卖家处购买过商品，你就使用过表单。在本节中，你将学习如何创建自己的表单，但你将只会学习如何创建这些表单的前端。处理表单的服务端操作需要编程语言知识，这超出了本课程的范围。\n\
  \n### HTML 表单如何工作\n\nHTML 表单是网页的一部分，包含用户可以输入信息的区域，这些信息可以发送给你、发送到你指定的电子邮件地址、发送到你管理的数据库或其他另一个系统（例如用于公司线索生成表单的第三方管理系统，如\
  \ `Salesforce.com`）。\n\n在学习用于创建自己表单的 HTML 元素之前，你至少应该在概念上理解这些表单中的信息是如何返回给你的。实际的幕后（`server-side`\
  \ 端或 `back-end`）过程需要至少一种编程语言的知识——或者至少在使用他人的服务端脚本处理表单输入时，具备遵循特定指令的能力。在流程的那个阶段，你应该与具有技术知识的人合作，或者自己学习基础知识。简单的表单处理并不困难，你的网页托管提供商可能有几个你可以进行极少自定义即可使用的后端脚本。\n\
  \n### 注意\n\nPHP 是最流行的服务端编程语言，任何可靠的网页托管提供商都支持它。你可以在 `www.php.net` 更多关于 PHP 的信息，或者可以直接从\
  \ *Sams Teach Yourself PHP, MySQL, and JavaScript All in One*（ISBN: 978-0-672-33770-3）从零开始学习这种编程语言（加上数据库交互）。该书面向对\
  \ PHP 或任何其他编程语言完全陌生的学者。\n\n表单包含一个供用户提交表单的按钮；该按钮可以是你自己创建的图像，也可以是在创建表单 `<input>` 元素并赋予\
  \ `type` 值为 `submit` 时创建的标准 HTML 表单按钮。当有人点击表单提交按钮时，表单中输入的所有信息将发送到 `<form>` 元素 `action`\
  \ 属性中指定的 URL。该 URL 应指向一个特定的脚本，该脚本将处理你的表单，通过电子邮件发送表单内容，或在交互过程中的执行其他步骤（例如从搜索引擎请求结果或在在线购物车中放置物品）。\n\
  \n当你开始考虑对表单内容进行比简单地将结果通过电子邮件发送给自己的更多操作时，你需要额外的技术知识。例如，如果你想创建一个接受信用卡并处理交易的在线商店，有一些成熟的方法可以实现，所有这些都是为了确保你客户数据的安全。这不是一项你想要轻率尝试的操作；你需要比这些课程提供的更多的知识。\n\
  \n在将表单发布到网上之前，你应该查看你的网页托管提供商的用户指南，看看他们在表单处理脚本方面提供了什么。你可能会发现一个现成的 Perl 或 PHP 脚本，只需进行极少的配置即可使用。\n\
  \n### 创建表单\n\n每个表单都必须以打开 `<form>` 标签开始，它可以位于 HTML 文档正体的任何地方。`<form>` 标签通常有三个属性：`name`、`method`\
  \ 和 `action`：\n\n```html\n<form name=\"my_form\" method=\"post\" action=\"myprocessingscript.php\"\
  >\n```\n\n常用的 `method` 是 `post`，它将表单输入结果作为文档发送。在某些情况下，你需要使用 `method=\"get\"`，它将结果作为\
  \ URL 查询字符串的一部分提交。例如，`get` 有时用于从网页表单将查询提交到搜索引擎。由于你还不是表单专家，除非你的网页托管提供商文档说明这么做，否则请使用\
  \ `post`。\n\n### 注意\n\nURL 查询字符串是 URL 中问号（`?`）之后的部分。它由 `name=`value` 对组成，并用和（`&`）字符分隔，如示例所示：\n\
  \n`https://www.yourdomain.com/path/to/page?name=value`\n\n`action` 属性指定了发送数据的地址。你有两个选项：\n\
  *   网页服务器上表单处理脚本的位置，数据将发送到那里。\n*   `mailto:` 后紧跟你的电子邮件地址，数据将直接发送给你。\n\n```html\n\
