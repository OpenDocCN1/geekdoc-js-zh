  *   **9.** `Date`\n*   **10.** `Math.random`\n\n## 23 使用条件和循环控制流程\n\nJavaScript\
  \ 程序中的语句通常按照它们出现的顺序执行。由于这种顺序并不总是实用的，大多数编程语言提供了*流程控制*语句，让你能够控制代码执行的顺序。你在上一节中学习的函数就是一种流程控制；虽然函数可能定义在代码开头，但它的语句可以在脚本的任何地方执行。\n\
  \n在本节中，你将学习另外两种流程控制类型：条件（允许根据测试的值选择选项）和循环（允许语句根据某些情况重复执行）。\n\n### `if` 语句\n\n`if`\
  \ 语句是 JavaScript 中主要的条件语句。该语句在 JavaScript 中的含义与英语中非常相似。例如，这里有一个典型的英语条件语句：\n\n*如果电话响了，接电话*。\n\
  \n#### 你将在本学习：\n\n*   使用 `if` 语句测试条件\n*   使用比较运算符比较值\n*   使用逻辑运算符组合条件\n*   使用 `else`\
  \ 使用替代选项\n*   使用表达式测试多个条件\n*   使用 `for` 循环重复语句\n*   使用 `while` 和 `do...while` 循环\n\
  *   创建无限循环（以及为什么你不应该这样做）\n*   退出循环和继续循环\n*   遍历数组的属性\n\n\n\n\n\n如果你像前面的示例那样将 `if`\
  \ 语句全部写在同一行，那么你只能使用单个语句作为动作。然而，你也可以通过将整个 `if` 语句括在大括号（`{}`）中来使用多个语句作为动作，如下：\n\n\
  ```\nif (a == 1) {\n    alert(\"I found a 1!\");\n    a = 0;\n}\n```\n\n这段语句块再次检查了变量\
  \ `a`。如果变量的值等于 `1`，它会显示一条消息并将 `a` 设置为 `0`。\n\n这取决于你的个人风格，即在流控制结构中对单个语句是否使用大括号。有些人认为，无论流控制结构的长短如何，如果通过使用大括号来清晰地界定它们，读起来会更易懂；而其他开发者则非常乐意混合使用单行条件语句和带大括号的语句。你使用哪种方法并不重要，只需尝试在编写时保持一致性，以便于后续的维护即可。\n\
  \n## 条件运算符\n\n`if` 语句的动作部分可以包含你已经过的任何 JavaScript 语句（以及你尚未学过的），但语句的条件部分使用它自己的语法。这被称为\
  \ `条件表达式`（conditional expression）。\n\n一个条件表达式通常包含两个需要比较的值（在前面的示例中，值 `a` 和 `1`）。这些值可以是变量、常量，甚至是表达式本身。\n\
  \n### 注意\n条件表达式的任意侧都可以是变量、常量或表达式。你可以比较一个变量和一个值，也可以比较两个变量。（你也可以比较两个常量，但通常没有必要这么做。）\n\
  \n在两个需要比较的值之间是一个`条件运算符`（conditional operator）。该运算符告诉 JavaScript 如何比较这两个值。例如，你在上一节中看到的\
  \ `==` 运算符用于测试两个值是否相等。\n\n这里有多种条件运算符可用：\n\n* ![Image](img/arrow.jpg) `==`—等于\n*\
  \ ![Image](img/arrow.jpg) `!=`—不等于\n* ![Image](img/arrow.jpg) `<`—小于\n* ![Image](img/arrow.jpg)\
  \ `>`—大于\n* ![Image](img/arrow.jpg) `>=`—大于或等于\n* ![Image](img/arrow.jpg) `<=`—小于或等于\n\
  \n### 警告\n务必不要混淆相等运算符（`==`）和赋值运算符（`=`），尽管它们都可能被读作或称为“等于”。记住在给变量赋值时使用 `=`，在比较值时使用\
  \ `==`。混淆这二者是编程（JavaScript 或其他语言）中常见的常见的错误之一。\n\n## 使用逻辑运算符组合条件\n\n通常，你可能想要检查一个变量是否有多个可能的值，或者同时检查多个变量。JavaScript\
  \ 包含了`逻辑运算符`（logical operators），也称为布尔运算符，用于实现此目的。例如，以下两个语句检查了不同的条件并使用相同的动作：\n\n\
  点击此处查看代码图像\n\n```\nif (phone == \"\") alert(\"error!\");\nif (email == \"\") alert(\"\
  error!\");\n```\n\n使用逻辑运算符，你可以将它们合并为一个语句：\n\n点击此处查看代码图像\n\n```\nif ((phone == \"\
  \") || (email == \"\")) alert(\"Something Is Missing!\");\n```\n\n该语句使用逻辑或运算符（`||`）来组合条件。翻译成英文，它的意思是：“如果电话号为空或邮箱地址为空，则显示错误消息。”\n\
  \n另一个逻辑运算符是逻辑与运算符，`&&`。考虑这条语句：\n\n点击此处查看代码图像\n\n```\nif ((phone == \"\") && (email\
  \ == \"\")) alert(\"Both Values Are Missing!\");\n```\n\n在这种情况下，只有当邮箱地址和电话号变量都为空时，才会显示错误消息。\n\
  \n### 注意\n如果 JavaScript 解释器在到达末尾之前发现了条件表达式的答案，它将不再评估条件的剩余部分。例如，如果由 `||` 运算符隔的两个条件中的第一个为真，则第二个不会被评估，因为条件（二选一）已经满足。因此，你可以使用运算符来提高脚本的运行速度。\n\
  \n第三个逻辑运算符是感叹号（`!`），表示“非”（NOT）。它可以用于反转表达式——换句话说，让真的表达式变为假，让假的表达式变为真。例如，这里有一个使用非逻辑运算符的语句：\n\
  \n点击此处查看代码图像\n\n```\nif (!phone == \"\") alert(\"phone is OK\");\n```\n\n在该语句中，`!`（非）运算符反转了条件，因此只有当电话号变量不时不，才会执行\
  \ `if` 语句的动作。你也可以使用 `!=`（不等于）运算符来简化这条语句：\n\n点击此处查看代码图像\n\n```\nif (phone != \"\"\
  ) alert(\"phone is OK\");\n```\n\n上述两个语句都会在 `phone` 变量被赋值值时（即它不为空或非 `null`）向你发出警。\n\
  \n### 注意\n逻辑运算符非常强大，但很容易无意中创建一个不可能的条件。使用它们可能会意外创建一个无法实现的条件。例如，`((a < 10) && (a >\
  \ 20))` 看起来是正确的，但如果你大声读出来，意思是“如果 a 小于 10 且 大于 20”，这在宇宙中是不可能的。在这种情况下，应该使用 `||`。\n\
  \n## else 关键字\n\n`if` 语句的一个额外功能是 `else` 关键字。就像它的英语中的对应词一样，`else` 告诉 JavaScript 解释器如果\
  \ `if` 条件不满足该做什么。以下是 `else` 的一个简单示例：\n\n点击此处查看代码图像\n\n```\nif (a == 1) {\n    alert(\"\
  Found a 1!\");\n    a = 0;\n} else {\n    alert(\"Incorrect value: \" + a);\n}\n\
  ```\n\n这段代码在满足条件时显示消息并重置变量 `a`。如果条件不满足（`a` 不为 1），则通过 `else` 显示另一个消息。\n\n### 注意\n\
  与 `if` 语句一样，`else` 后面可以跟一个动作，也可以跟一组在大括号中的语句。\n\n### 使用简化条件表达式\n\n除了 `if` 语句外，JavaScript\
  \ 还提供了一种你可以用于快速决策的简短条件表达式。这使用了在 C 等语言中也能看到的特殊语法。条件表达式的形式如下：\n\n点击此处查看代码图像\n\n`变量\
  \ = (条件) ? (真时的值) : (假时的值);`\n\n这种构造最终为 `变量` 赋值两个值之一：如果条件为真，赋值一个值；如果为假，赋值另一个值。这是一个条件表达式的示例：\n\
  \n```\nvalue = (a == 1) ? 1 : 0;\n```\n\n这条语句看起来可能很奇怪，但它等同于以下 `if` 语句：\n\n```\n\
  if (a == 1) {\n    value = 1;\n} else {\n    value = 0;\n}\n```\n\n换句话说，问号（`?`）后面的值在条件为真时会被使用，而冒号（`）后面的值在条件为假时会被使用。冒号及其后的内容代表了该语句写成\
  \ `if...else` 语句时的 `else` 部分，就像 `if` 语句的 `else` 部分一样，它是可选的。\n\n这些简化表达式可以使用任何 JavaScript\
  \ 期望获得值的地方。它们为简单的值决策提供了一种快速方法。例如，这里有一个关于变量显示语法正确消息的快速方法：\n\n```\ndocument.write(\"\
  Found \" + counter + ((counter == 1) ? \" word.\" : \" words.\"));\n```\n\n\n\n\n\
  \n如果 `counter` 变量的值为 `1`，则打印消息 `Found 1 word`；如果其值为 `2` 或更大，则会打印 `Found 2 words`。\n\
  \n事实上，你可能会发现条件表达式对你来说并不更快或更好用，这完全没有关系。然而，你应该了解它们的样子以及如何阅读它们，以防将来在别人的代码中遇到它们。\n\n\
  ## 使用 `if` 和 `else` 测试多个条件\n\n现在你已经拥有了使用 `if` 和 `else` 语句控制流所需的所有组件。在第 4 节中的“理解\
  \ JavaScript””中，你曾创建了一个显示当前日期和时间的简单脚本。在这里，你将利用这些知识创建一个根据时间显示问候语的脚本，诸如：“早上好”、“下午好”、“晚上好”或“天好”。为了完成这项任务，你可以使用多个\
  \ `if` 语句的组合，如下所示：\n\n点击此处查看代码图像\n\n```javascript\nif (hour_of_day < 10) {\n   \
  \ document.write(\"Good morning.\");\n} else if ((hour_of_day >= 14) && (hour_of_day\
  \ <= 17)) {\n    document.write(\"Good afternoon.\");\n} else if (hour_of_day >=\
  \ 17) {\n    document.write(\"Good evening.\");\n} else {\n    document.write(\"\
  Good day.\");\n}\n```\n\n第一条语句检查 `hour_of_day` 变量的值是否小于 `10`。换句话说，它检查当前时间是否在上午 10:00\
  \ 之前。如果是，它显示问候语“Good morning”。\n\n第二条语句检查时间是否在下午 2:00 到下午 5:00 之间，如果是则显示“Good afternoon”。该语句使用\
  \ `else if` 表明，只有在前一个条件失败时，才会测试此条件；如果是早上，就没有需要检查是否是下午。同样，第三条语句检查下午 5:00 之后的时间，并显示“Good\
  \ evening”。\n\n最后一条语句使用简单的 `else`，意味着如果之前的条件都不匹配，则将执行它。这涵盖了上午 10:00 到下午 2:00 之间的时间（其他语句忽略了部分），并显示“Good\
  \ day”。\n\n### HTML 文件\n\n要在浏览器中尝试这个时间和问候的示例，你需要一个 HTML 文件。在这种情况下，你可以将 JavaScript\
  \ 代码保持分离。列表 23.1 是完整的 HTML 文件。将其保存为 `timegreet.html`，但在你在下一节中准备好 JavaScript 文件之前，不要将其加载到浏览器中。\n\
  \n**列表 23.1** 用于时间和和问候示例的 HTML 文件\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Time Greet Example</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  </head>\n<body>\n    <h1>Current Date and Time</h1>\n    <script src=\"timegreet.js\"\
  ></script>\n</body>\n</html>\n```\n\n### JavaScript 文件\n\n列表 23.2 显示了时间和和问候示例的完整\
  \ JavaScript 文件。它使用了内置的 `Date` 对象函数来查找当前日期并存储在 `hour_of_day`、`minute_of_hour` 和\
  \ `seconds_of_minute` 变量中，正如你在上一节中学的那样。接下来，`document.write` 语句显示当前时间，之前介绍的 `if`\
  \ 和 `else` 语句显示相应的问候语。\n\n**列表 23.2** 显示当前时间和问候语的脚本\n\n点击此处查看代码图像\n\n```javascript\n\
  // 获取当前日期\nnow = new Date();\n\n// 分为小时、分钟、秒\nhour_of_day = now.getHours();\nminute_of_hour\
  \ = now.getMinutes();\nseconds_of_minute = now.getSeconds();\n\n// 显示时间\ndocument.write(\"\
  <h2>\");\ndocument.write(hour_of_day + \":\" + minute_of_hour + \":\" + seconds_of_minute);\n\
  document.write(\"</h2>\");\n\n// 显示问候语\n// 打开段落\ndocument.write(\"<p>\");\n\n//\
  \ 改变问候语\nif (hour_of_day < 10) {\n    document.write(\"Good morning.\");\n} else\
  \ if ((hour_of_day >= 14) && (hour_of_day <= 17)) {\n    document.write(\"Good afternoon.\"\
  );\n} else if (hour_of_day >= 17) {\n    document.write(\"Good evening.\");\n} else\
  \ {\n    document.write(\"Good day.\");\n}\n\n// 关闭段落\ndocument.write(\"</p>\");\n\
  ```\n\n要尝试此示例，请将此文件保存为 `timegreet.js`，并将 `timegreet.html` 文件加载到浏览器中。图 23.1 显示了脚本的结果。\n\
  \n![截图显示了脚本的输出。标题为 Current Date and time，后面是小时、分钟和秒。下方的消息显示为 Good day。](img/ch23.xhtml_ch23fig01)\n\
  \n### 使用 `switch` 使用多个条件\n\n在列表 23.2 中，你连续使用了 `if...else` 语句来测试不同的条件。这里是另一种技术：\n\
  \n点击此处查看代码图像\n\n```javascript\nif (hour_of_day < 10) {\n    document.write(\"Good\
  \ morning.\");\n} else if ((hour_of_day >= 14) && (hour_of_day <= 17)) {\n    document.write(\"\
  Good afternoon.\");\n} else if (hour_of_day >= 17) {\n    document.write(\"Good\
  \ evening.\");\n} else {\n    document.write(\"Good day.\");\n}\n```\n\n虽然这种结构在每个\
  \ `if` 语句都有自己的代码块时可能会变得混乱，但 `switch` 语句允许你对同一个变量进行多次测试。以下是转换为 `switch` 的相同示例：\n\n\
  ```javascript\nswitch(button) {\n    case \"next\":\n        window.location=\"\
  next.html\";\n        break;\n    case \"previous\":\n        window.location=\"\
  previous.html\";\n        break;\n    case \"home\":\n        window.location=\"\
  home.html\";\n        break;\n    case \"back\":\n        window.location=\"menu.html\"\
  ;\n        break;\n    default:\n        window.alert(\"Wrong button.\");\n}\n```\n\
  \n`switch` 语句包含几个组件：\n\n*   初始 `switch` 语句：该语句在括号中包含要测试的值（在本例中为 `button`）。\n*  \
  \ 大括号（`{` **和** `}`）：大括号包含 `switch` 语句的内容，就像函数或 `if` 语句一样。\n*   一个多个 `case` 语句：每个语句指定与\
  \ `switch` 语句指定的值进行比较。如果值匹配，则执行 `case` 语句后的语句。否则，尝试下一个 `case`。\n*   `break` 语句：该语句用于结束每个\
  \ case 并跳转到 `switch` 的结尾。如果不包含 `break`，多个 case 中的语句可能会被执行，无论它们是否匹配。\n*   `default`\
  \ 情况：可选，可以包含 `default` 情况并在其后跟随一个或多个语句，当其他所有情况都不匹配时执行这些语句。\n\n### 注意\n\n你可以在 `switch`\
  \ 结构中的每个 `case` 语句之后使用多个语句，而不仅仅是这里所示的单行语句。你不需要将它们括在大括号中。如果 匹配，JavaScript 解释器将执行语句，直到遇到\
  \ `break` 或下一个 `case`。\n\n\n\n\n使用 `switch` 语句代替 `if...else` 语句的主要优点之一是可读性：一眼看上去，你就能知道所有条件测试都是针对同一个表达式的，因此你可以专注于理解条件测试的预期结果。但使用\
  \ `switch` 语句完全是可选的；你可能会发现自己更倾向于使用 `if...else` 语句，这并没有任何错。使用 `switch` 语句代替 `if...else`\
  \ 语句带来的任何效率提升，肉眼也无法察觉（如果有的话）。底线是：使用你喜欢的工具。\n\n### 使用 `for` 循环\n\n`for` 关键字是创建循环时要考虑的第一个工具，正如你在上一节的随机数示例中看到的那样。`for`\
  \ 循环通常使用一个变量（称为 `counter` 或 `index`）来跟踪循环执行的次数，并在计数器达到某个数字时停止。一个基础的 `for` 语句如下：\n\
  \n点击此处查看代码图像\n\n```javascript\nfor (var = 1; var < 10; var++) {\n   // more code\n\
  }\n```\n\n`for` 循环中有三个参数，每个参数用分号隔开：\n\n* ![Image](img/arrow.jpg) **初始表达式**——第一个参数（示例中的\
  \ `var = 1`）指定了一个变量并为其分配了一个初始值。这被称为 `initial expression`，因为它设置了循环的初始状态。\n* ![Image](img/arrow.jpg)\
  \ **条件**——第二个参数（示例中的 `var < 10`）是一个必须在保持循环运行期间始终为真的的条件。这被称为循环的 `condition`。\n* ![Image](img/arrow.jpg)\
  \ **增量表达式**——第三个参数（示例中的 `var++`）是一个在循环每次迭代时执行的语句。这被称为 `increment expression`，因为它通常用于递增计数器。增量表达式在每次循环迭代的结束时执行。\n\
  \n在指定了三个参数后，使用左大括号（`{`）表示块的开始。右大括号（`}`）用于块的结束。括号之间的所有语句将在循环的每次迭代中执行。\n\n`for` 循环的参数听起来可能有点困惑，但当你习惯了\
  \ `for`，你就会频繁地使用 `for` 循环。这里有一个此类循环的简单示例：\n\n点击此处查看代码图像\n\n```javascript\nfor (i=0;\
  \ i<10; i++) {\n   document.write(\"This is line \" + i + \"<br>\");\n}\n```\n\n\
  这些语句定义了一个使用变量 `i` 的循环，将其初始化为 `0`，并且只要 `i` 的值小于 `10` 就会循环。增量表达式 `i++` 在循环的每次迭代中将\
  \ `i` 的值加 1。由于这发生在循环的结束时，所以输出将是九行文本。\n\n当循环在大括号之间只包含单个语句时（如示例所示），如果你愿意，可以省略大括号。以下语句定义了没有大括号的相同循环：\n\
  \n点击此处查看代码图像\n\n```javascript\nfor (i=0; i<10; i++)\n   document.write(\"This is\
  \ line \" + i + \"<br>\");\n```\n\n注意\n\n在每个循环都大大括号是一种良好的风格规范，无论它包含一个语句还是多个语句。这使得以后向循环中添加语句变得容易，而不会引起语法错误。\n\
  \n示例中的循环包含一个将被反复执行的 `document.write` 语句。要查看此循环的作用，你可以将其添加到 HTML 文档的 `<script>` 部分，如列表\
  \ 23.3 所示。\n\n**列表 23.3** 使用 `for` 关键字的循环\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Using a for\
  \ Loop</title>\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n  </head>\n  <body>\n    <h1>Using a for Loop</h1>\n    <p>The following is the\
  \ output of the `for` loop:</p>\n    <script>\n      for (i=1;i<10;i++) {\n    \
  \      document.write(\"This is line \" + i + \"<br>\");\n      }\n    </script>\n\
  \  </body>\n</html>\n```\n\n此示例在每次迭代期间显示一个包含循环计数器当前值的消息。列表 23.3 的输出所示在图 23.2 中。\n\
  \n![一张截图显示了 for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](img/23fig02.jpg)\n\n图 23.2  for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](graphics/23fig02.jpg)\n\n图 23.2  for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](graphics/23fig02.jpg)\n\n图 23.2  for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](graphics/23fig02.jpg)\n\n图 23.2  for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](graphics/23fig02.jpg)\n\n图 23.2  for 循环示例的输出。输出由九条语句组成，具有相同的文本“This is line”，后面跟着一个数字，该数字是每次执行循环时“i”\
  \ 的值。](graphics/23fig02.jpg)\n\n*(注：由于原文末处出现了图片描述的重复，翻译时已根据要求对图片描述和关联的文本进行了逻辑对处理)*\n\
  \n图 23.2  for 循环示例的输出。...10。](graphics/23fig02.jpg)\n\n*(注：由于原始文本末尾似乎存在格式化错误导致的重复，此处已根据上下文进行清理和翻译)*\n\
  \n\n\n\n\n`for` 和 `while` 循环让你对循环拥有相当大的控制权。在某些情况下，如果不小心，可能会导致问题。例如，看以下循环代码：\n\n\
  ```javascript\nwhile (i < 10) {\n    n++;\n    values[n] = 0;\n}\n```\n\n这个示例中有一个错误。`while`\
  \ 循环的条件引用了变量 `i`，但该变量在循环过程中并没有实际变化；变化的是变量 `n`。这创建了一个无限循环，这意味着循环将一直执行，直到用户停止它，或者它产生某种类型的错误——通常是因为浏览器内存耗尽。\n\
  \n无限循环并不总是能由用户停止，除非退出浏览器——某些循环甚至可以阻止浏览器退出或可能导致程序崩溃。\n\n显然，你应该避免无限循环。它们很难被发现，因为 JavaScript\
  \ 不会给你一个实际上告诉你存在无限循环的错误。因此，每当在脚本中创建一个循环时，都应该确保有一个退出的方法。\n\n### 注意\n根据所使用的浏览器版本，无限循环甚至可能导致浏览器停止响应用户操作，因为所有内存都被耗完了。请务必为无限循环提供逃生路径，并确保始终测试你的工作。\n\
  \n偶尔，你可能想故意创建一个长时间运行且看似无限的循环。例如，你可能希望程序一直执行到用户显式停止它，或者你通过下一节介绍的 `break` 语句提供逃生路径。这里创建一个无限循环的简单方法：\n\
  \n```javascript\nwhile (true) {\n    //more 代码\n}\n```\n\n由于值 `true` 是条件，这个循环将始终发现其条件为真。\n\
  \n### 退出循环\n\n有一种退出长时间运行且看似无限循环的方法。你可以在循环过程的某处使用 `break` 语句立即退出，并继续执行循环后的第一个语句。这里有一个使用\
  \ `break` 的简单示例：\n\n点击此处查看代码图像\n\n```javascript\nwhile (true) {\n    n++;\n    if\
  \ (values[n] == 1) break;\n}\n```\n\n虽然 `while` 语句被设置为了无限循环，但 `if` 语句检查数组的对应值，如果发现值为\
  \ `1`，它就会退出循环。\n\n当 JavaScript 解释器遇到 `break` 语句时，它会跳过循环的剩余部分，并从循环结束右括号后的第一个语句继续执行脚本。你可以在任何类型的循环中使用\
  \ `break` 语句，无论是否是无限循环。这为在发生错误或满足另一个条件时提供了一种简单的退出方法。\n\n### 继续循环\n\n还有另一个 JavaScript\
  \ 语句可以帮助你控制循环的执行。`continue` 语句跳过循环的剩余部分，但与 `break` 不同，它会继续循环的下一次迭代。这里有一个简单的示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nfor (i=1; i<21; i++) {\n    if (score[i]==0) continue;\n\
  \    document.write(\"Student number \"+ i + \", Score: \" + score[i] + \"<br>\"\
  );\n}\n```\n\n此脚本使用 `for` 循环打印 20 个学生的分数，分数存储在 `score` 数组中（此处未显示）。`if` 语句用于检查值为\
  \ `0` 的分数。脚本假设分 `0` 意味着学生没有参加考试，因此它继续循环而不打印该分数。\n\n### 遍历对象属性\n\nJavaScript 中还有另一种类型的循环。`for...in`\
  \ 循环不像普通的 `for` 或 `while` 循环那样灵活，但它专门设计用于对对象的每个属性执行某种操作。\n\n例如，内置的 `navigator` 对象包含了描述用户浏览器的属性。你可以使用\
  \ `for...in` 显示此对象的属性：\n\n点击此处查看代码图像\n\n```javascript\nfor (i in navigator) {\n\
  \    document.write(\"<p>Property: \" + i + \"<br>\");\n    document.write(\"Value:\
  \ \" + navigator[i] + \"</p>\");\n}\n```\n\n像普通的 `for` 循环一样，这种类型的循环使用索引变量（示例中的 `i`）。对于循环的每次迭代，变量都会被设置为对象的下一个属性。这在你需要检查或修改对象的每个属性时变得非常简单。\n\
  \n循环的一个常见用途是处理数组。没有循环，初始化数组将非常困难。接下来的脚本将提示用户输入一系列名称。在输入所有名称后，它将以编号列表的形式显示列表。首先，初始化一些变量：\n\
  \n```javascript\nnames = new Array();\nvar i = 0;\n```\n\n`names` 数组将存储用户输入的名称。你不知道会输入多少名称，所以不需要指定维度。接下来，使用\
  \ `prompt` 语句提示用户。`do...while` 循环是理想的：\n\n```javascript\ndo {\n    next = prompt(\"\
  Enter the Name\", \"\");\n    if (next > \" \") names[i] = next;\n    i = i + 1;\n\
  } while (next > \" \");\n```\n\n注意：如果你感兴趣让你的脚本尽可能短，记住你可以使用递增运算符 (`++`) 将 `i = i\
  \ + 1` 与前一个语句结合，如：\n\n```javascript\ndo {\n    next = prompt(\"Enter the Name\"\
  , \"\");\n    if (next > \" \") names[i] = next;\n    i++;\n} while (next > \" \"\
  );\n```\n\n此循环不断重复，直到用户不输入名称或在对话框中点击取消。每个每个名称 `i` 计数器都会增加，并存储在 `names` 数组中。接下来，你的脚本可以显示输入的名称数量：\n\
  \n```javascript\ndocument.write(\"<h2>\" + (names.length) + \" names</h2>\");\n\
  ```\n\n该语句显示 `names` 数组的 `length` 属性。接下来，脚本应该按照输入的顺序显示所有名称。`for...in` 循环是一个很好的选择：\n\
  \n```javascript\ndocument.write(\"<ol>\");\nfor (i in names) {\n    document.write(\"\
  <li>\" + names[i] + \"</li>\");\n}\ndocument.write(\"</ol>\");\n```\n\n在这里你有一个 `for...in`\
  \ 循环，遍历 `names` 数组，将计数器 `i` 赋值给每个索引。脚本随后在开启和关闭的 `<li>` 之间打印名称，作为有序列表的一个项目。在循环之前之后，脚本打印开始和结束的\
  \ `<ol>` 标签。\n\n你现在拥有了运行脚本所需的所有内容。列表 23.4 显示了此示例的 HTML 文件，而列表 23.5](#ch23.xhtml_ch23list5)\
  \ 显示了 JavaScript 文件。\n\n\n\n\n\n```javascript\ndocument.write(\"<h2>\" + (names.length)\
  \ + \" names entered.</<h2>>\");\n\n// 显示所有名称\n\ndocument.write(\"<ol>\");\n\nfor\
  \ (i in names) {\n  document.write(\"<li>\" + names[i] + \"</li>\");\n}\n\n// 关闭列表\n\
  \ndocument.write(\"</ol>\");\n```\n\n要尝试此示例，请将 JavaScript 文件另存为 `loops.js`，然后将 HTML\
  \ 文档加载到浏览器中。系统将逐次提示你输入一个名称。输入几个名称，然后点击“取消”（Cancel）以表示你已完成。图 23.3 显示了浏览器中最终结果应该有的样子。\n\
  \n![截图显示了使用 do while 循环获取用户输入并以列表形式显示内容的示例](img/23fig03.jpg)\n\n**图 23.3** 示例示例的输出。\n\
  \n### 总结\n\n在本节中，你学习了控制脚本流的两种方法。首先，你学习了如何使用 `if` 语句来评估条件表达式并对其做出反应。你还学习了使用 `?` 运算符的条件表达式简写形式，以及用于处理多个条件的\
  \ `switch` 语句。\n\n你还学习了 JavaScript 使用 `for`、`while` 和 `do...while` 循环的循环能力，以及如何通过使用\
  \ `break` 和 `continue` 语句进一步控制循环。最后，你查看了用于处理对象每个属性的 `for...in` 循环。\n\n### 问答\n\n\
  **Q. 如果我在条件表达式中比较两个不同类型的数据（例如一个数字和一个字符串），会发生什么？**\n\n**A**. JavaScript 解释器会尽力将这些值转换为共同格式并进行比较。在这种情况下，它会在比较之前将它们都转换为字符串。你可以使用特殊等等运算符\
  \ `===` 来比较两个值及其类型。使用该运算符，只有当表达式具有相同值*且*相同数据类型时，该表达式才为真（true）。\n\n**Q. 为什么当我不小心使用\
  \ `=` 而不是 `==` 时，我没有得到友好的错误信息？**\n\n**A**. 在某些情况下，使用 `=` 确实会导致错误。然而，错误的版本通常看起来像是一个正确的语句。例如，在语句\
  \ `if (a=1)` 中，变量 `a` 被赋值为值 `1`。`if` 语句被视为真，且 `a` 的值丢失了。\n\n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，请尝试回答所有问题。\n\
  \n### 测验\n\n**1.** 下列哪个运算符在 JavaScript 中表示“不等于”？\n\n1. `!`\n2. `!=`\n3. `<>`\n\n\
  **2.** `switch` 语句的作用是什么？\n\n1. 测试变量或表达式以匹配多个不同的值\n2. 开启或关闭变量\n3. 让普通的 `if` 语句更长且更晦惑\n\
  \n**3.** 哪种类型的 JavaScript 循环在循环的*结束*检查条件？\n\n1. `for`\n2. `while`\n3. `do...while`\n\
  \n**4.** 在循环内部，`break` 语句的作用是什么？\n\n1. 导致浏览器崩溃\n2. 重新开始循环\n3. 完全退出循环\n\n**5.** 语句\
  \ `while (3==3)` 是以下哪种情况示例？\n\n1. 拼写错误\n2. 无限循环\n3. 非法的 JavaScript 语句\n\n**6.**\
  \ 你将如何在 JavaScript 中编写语句“如果 J 是 10，那么 M 就是 40”？\n\n1. `if (j == 10) m = 40;`\n2.\
  \ `if (j == 10) then m = 40;`\n3. `if (j equals 10) m = 40;`\n4. `if (j equals 10)\
  \ then m = 40;`\n\n**7.** 下列哪项是逻辑运算符？\n\n1. `$$`\n2. `&*`\n3. `=`\n4. `!`\n\n**8.**\
  \ 下述语句用英语如何表述？\n\n`Wilma = (Barney == 50) ? 44 : 29;`\n\n1. 如果 Wilma 是 29，则 Wilma\
  \ 是 44 且 Barney 是 50\n2. 如果 Barney 是 50，则 Wilma 是 44；否则，Wilma 是 29\n3. 如果 Barny\
  \ 是 50，则 Wilma 是 29，否则 Wilma 是 44。\n4. 如果 Barney 是 50，则 Wilma 比 Barney 少 29；否则 Wilma\
  \ 是 44。\n\n**9.** JavaScript 中的语句 `scooby++` 是什么意思？\n\n1. 函数 `scooby` 从参数中减去 1。\n\
  2. 函数 `scooby` 将参数加 1。\n3. 变量 `scooby` 减去 1。\n4. 变量 `scooby` 加 1。\n\n**10.** 为什么你想创建一个无限循环？\n\
  \n1. 让脚本运行直到用户停止。\n2. 让脚本运行直到计算机停止。\n3. 让脚本运行直到它停止。\n4. 你想要。\n\n### 答案\n\n**1.**\
  \ 在 JavaScript 中 `!=` 表示“不等于”。\n\n**2.** `switch` 语句可以测试变量或表达式以匹配多个不同的值。\n\n**3.**\
  \ `do...while` 循环在循环结束时检查条件。\n\n**4.** `break` 语句完全退出循环。\n\n**5.** 因为 `(3==3)` 始终为真，这创建一个无限循环。\n\
  \n**6.** `if (j == 10) m = 40;`\n\n**7.** JavaScript 有逻辑运算符 `&&`、`||` 和 `!`。\n\n\
  **8.** 如果 Barney 是 50，则 Wilma 是 44；否则，Wilma 是 29。\n\n**9.** 这是一个递增表达式，意味着 `scooby`\
  \ 将加 1。\n\n**10.** 通常创建无限或长时间的循环是为了让脚本运行直到用户停止或发生 `break` 或 `continue` 语句。\n\n###\
