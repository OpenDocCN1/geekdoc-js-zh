  \n[content]\n\n*   ![Image](img/arrow.jpg) `getElementById(id)`—返回具有指定 `id` 属性的元素。\n\
  *   ![Image](img/arrow.jpg) `getElementsByTagName(tag)`—返回所有具有指定标签名的元素数组。你可以使用通配符\
  \ `*` 返回一个包含文档中所有节点的数组。\n*   ![Image](img/arrow.jpg) `createTextNodeNode(text)`—创建一个包含指定文本的新文本节点，然后你可以将其添加到文档中。\n\
  *   ![Image](img/arrow.jpg) `createElement(tag)`—为指定的标签创建一个新的 HTML 元素。与 `createTextNode`\
  \ 类似，你需要在创建元素后将其添加到文档中。你可以通过更改其子对象或 `innerHTML` 属性为元素内部分配内容。\n\n*   ![Image](img/arrow.jpg)\
  \ `appendChild(new)`—将指定的新节点附加对象所有现有节点之后。\n*   ![Image](img/arrow.jpg) `insertBefore(new,\
  \ old)`—在指定的旧子节点（必须已存在）之前插入指定的新子节点。\n*   ![Image](img/arrow.jpg) `replaceChild(new,\
  \ old)`—用新节点替换指定的旧子节点。\n*   ![Image](img/arrow.jpg) `removeChild(node)`—从对象的子节点集合中移除一个子节点。\n\
  *   ![Image](img/arrow.jpg) `hasChildNodes`—如果对象具有一个或多个子节点，则返回布尔值 `true`；如果没有则返回\
  \ `false`。\n*   ![Image](img/arrow.jpg) `cloneNode`—创建现有节点的副本。如果提供了参数 `true`，则副本也将包含原始节点的任何子节点。\n\
  \n\n\n\n\n```html\n<button onclick=\"pos(-1,0);\">Left</button>\n<button type=\"\
  button\" name=\"right\" onclick=\"pos(1,0);\">Right</button>\n<button type=\"button\"\
  \ name=\"up\" onclick=\"pos(0,-1);\">Up</button>\n<button type=\"button\" name=\"\
  down\" onclick=\"pos(0,1);\">Down</button>\n<button type=\"button\" name=\"hide\"\
  \ onclick=\"hideSquare();\">Hide</button>\n<button type=\"button\" name=\"show\"\
  \ onclick=\"showSquare();\">Show</button>\n</div>\n<hr>\n<div id=\"square\">\n \
  \ This square is an absolutely positioned layer\n  that you can move using the buttons\
  \ above.\n</div>\n<script src=\"position.js\"></script>\n</body>\n</html>\n```\n\
  \n除了一些基础 HTML 之外，列表 21.4](#ch21.xhtml_ch21list4) 还包含以下内容：\n\n* ![Image](img/arrow.jpg)\
  \ `<style>` 部分是一个简短的样式表，定义了可移动层的属性。它将 `position` 属性设置为 `absolute`，表示它可以被放置在精确的位置，在\
  \ `top` 和 `left` 属性中设置初始位置，并设置 `border` 和 `background-color` 属性使层清晰可见。\n* ![Image](img/arrow.jpg)\
  \ `<button>` 标签定义了六个按钮：四个用于移动层向左、右、上、下，另外两个用于控制它的显示或隐藏。\n* ![Image](img/arrow.jpg)\
  \ `<div>` 部分定义了层本身。`id` 属性被设置为值 `\"square\"`。此 `id` 在样式表中被用于引用该层，并将被用于你的脚本中。\n*\
  \ ![Image](img/arrow.jpg) 位于 `</body>` 标签之前的 `<script>` 标签读取名为 `position.js` 的脚本，该脚本显示在列表\
  \ 21.5](#ch21.xhtml_ch21list5) 中。\n\n如果你将 HTML 加载到浏览器中，你应该看到按钮和 `\"square\"` 层，但按钮目前还没有作用。列表\
  \ 21.5](#ch21.xhtml_ch21list5) 中的脚本添加了使用这些操作的功能。当你将列表 21.4](#ch21.xhtml_ch21list4)\
  \ 中的代码加载到浏览器时，它的看起来应该像图 21.5](#ch21.xhtml_ch21fig05) 所示。\n\n![截图显示了加载“可移动层示例 HTML\
  \ 文档”后的输出。](img/21fig05.jpg)\n\n**图 21.5** 准备好移动的可移动层。\n\n列表 21.5](#ch21.xhtml_ch21list5)\
  \ 显示了列表 21.4](#ch21.xhtml_ch21list4) 的 HTML 中调用的 JavaScript 变量和函数。该代码预计（通过 `<script>`\
  \ 标签）位于 `position.js` 的文件中。\n\n**列表 21.5** 可移动层示例的脚本\n\n```javascript\nvar x=100,y=150;\n\
  \nfunction pos(dx,dy) {\n    if (!document.getElementById) return;\n    x += 30*dx;\n\
  \    y += 30*dy;\n    obj = document.getElementById(\"square\");\n    obj.style.top=y\
  \ + \"px\";\n    obj.style.left=x + \"px\";\n}\n\nfunction hideSquare() {\n    if\
  \ (!document.getElementById) return;\n    obj = document.getElementById(\"square\"\
  );\n    obj.style.display=\"none\";\n}\n\nfunction showSquare() {\n    if (!document.getElementById)\
  \ return;\n    obj = document.getElementById(\"square\");\n    obj.style.display=\"\
  block\";\n}\n```\n\n脚本开头的 `var` 语句定义了两个变量 `x` 和 `y`，它们用于存储层的当前位置。`pos` 函数由四个按钮的事件处理器调用。`pos`\
  \ 函数的参数 `dx` 和 `dy` 告诉脚本层应该如何移动：如果 `dx` 为负数，则从 `x` 中减去一个数字，使层向左移动；如果 `dx` 为正数，则在\
  \ `x` 上加上一个数字，使层向右移动。同样，`dy` 指明是向上还是向下移动。`pos` 函数开始时会确保支持 `getElementById`，因此它在旧版浏览器中不会运行。然后它将\
  \ `dx` 和 `dy` 乘以 30（以使移动明显），并将它们应用于 `x` 和 `y`。最后，它将 `top` 和 `left` 属性设置为新位置（包括指示测量单位的\
  \ `px`），从而移动该层。\n\n另外两个函数 `hideSquare` 和 `showSquare` 通过将其 `display` 属性设置为 `\"none\"\
  `（隐藏）或 `\"block\"`（显示）来隐藏或显示层。要使用此脚本，请将其保存为 `position.js`，然后将浏览器中加载列表 1.4](#ch21.xhtml_ch21list4)\
  \ 中的 HTML 文档。图 21.6](#ch21.xhtml_ch21fig06) 显示了该脚本的运行情况——嗯，是在某次操作之后。图 21.6](#ch21.xhtml_ch21fig06)\
  \ 显示了点击右按钮四次和点击下按钮五次后的脚本。\n\n![截图显示可移动层已移动到新位置。层现在位于底部，居中对齐。](img/21fig06.jpg)\n\
  \n**图 21.6** 可移动层已移动。\n\n### 隐藏和显示对象\n\n在前面的示例中，你看到了一些可以用于隐藏或显示“正方形”的函数。在本节中，我们将更详细地查看页面中隐藏和显示对象。作为回顾，对象有一个\
  \ `visibility` 样式属性，该属性指定它们当前在页面内是否可见：\n\n```javascript\nObject.style.visibility=\"\
  hidden\"; // 隐藏对象\nObject.style.visibility=\"visible\"; // 显示对象\n```\n\n使用此属性，你可以创建一个在浏览器中隐藏或显示对象的脚本。列表\
  \ 21.6](#ch21.xhtml_ch21list6) 显示了允许两个标题显示或隐藏的脚本的 HTML 文档。\n\n**列表 21.6** 隐藏和显示对象\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  >\n  <title>隐藏或显示对象</title>\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n</head>\n<body>\n  <h1 id=\"heading1\">这是第一个标题</h1>\n  <h1\
  \ id=\"heading2\">这是第二个标题</h1>\n  <p>使用 W3C DOM，你可以通过下面的复选框选择显示或隐藏页面上的标题。</p>\n\
  \  <form name=\"checkboxform\">\n    <input type=\"checkbox\" name=\"checkbox1\"\
  \ onclick=\"showHide();\" checked>\n    <span style=\"font-weight:bold;\">显示第一个标题</span><br>\n\
  \    <input type=\"checkbox\" name=\"checkbox2\" onclick=\"showHide();\" checked>\n\
  \    <span style=\"font-weight:bold\">显示第二个标题</span><br>\n  </form>\n  <script>\n\
  \    function showHide() {\n      if (!document.getElementById) return;\n      var\
  \ heading1 = document.getElementById(\"heading1\");\n      var heading2 = document.getElementById(\"\
  heading2\");\n      var showheading1 = document.checkboxform.checkbox1.checked;\n\
  \      var showheading2 = document.checkboxform.checkbox2.checked;\n      heading1.style.visibility=(showheading1)\
  \ ? \"visible\" : \"hidden\";\n      heading2.style.visibility=(showheading2) ?\
  \ \"visible\" : \"hidden\";\n    }\n  </script>\n</body>\n</html>\n```\n\n此文档中的\
  \ `<h1>` 标签定义了 `id` 为 `heading1` 和 `heading2` 的标题。在`<form>` 元素内部有两个复选框，每个对应其中一个标题。当复选框被修改（选中或取消选中）时，`onclick`\
  \ 方法会调用 JavaScript 函数 `showHide` 来执行操作。\n\n\n\n\n\n设置 `visibility` 属性的行看起来有点奇怪。`?`\
  \ 和 `:` 字符创建了`条件表达式`，这是处理 `if` 语句的简写方式。你将在第 23 节“使用条件和循环控制流程](#ch23.xhtml)”中学习更多关于这些条件的知识。\n\
  \n图 21.7 显示了该示例的运行。在图中，第二个标题的复选框未勾选，因此只有第一个标题可见。\n\n![截图显示了使用 HTML 脚本隐藏和显示对象的示例。](img/21fig07.jpg)\n\
  \n**图 21.7** 文本隐藏/显示的示例运行。\n\n## 修改页面中的文本\n\n你可以创建一个简单的脚本来修改网页中标题（或任何元素）的内容。正如你在本节较早些时候学到的那样，文本节点的\
  \ `nodeValue` 属性包含其实际文本，而标题的文本节点是该标题的子节点。因此，更改标识为 `heading1` 的标题文本的方法如下：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar heading1 = document.getElementById(\"heading1\");\n\nheading1.firstChild.nodeValue\
  \ = \"New Text Here\";\n```\n\n这会将标题对象赋值给名为 `heading1` 的变量。`firstChild` 属性返回作为标题唯一子节点的文本节点，其\
  \ `nodeValue` 属性包含标题文本。\n\n使用这种技术，可以轻松创建一个允许标题动态更改的页面。列表 21.7 显示了实现此功能的脚本的完整 HTML\
  \ 文档。\n\n**列表 21.7** 完整的文本修改示例\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Dynamic Text\
  \ in JavaScript</title>\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n  </head>\n  <body>\n    <h1 id=\"heading1\">Dynamic Text\
  \ in JavaScript</h1>\n    <p>Using the W3C DOM, you can dynamically change the\n\
  \    heading at the top of this page.</p>\n    <p>Enter a new title and click the\
  \ Change! button. </p>\n    <form name=\"changeform\">\n      <input name=\"newtitle\"\
  size=\"40\">\n      <button type=\"button\" onclick=\"changeTitle();\">Change!</button>\n\
  \    </form>\n    <script>\n      function changeTitle() {\n        if (!document.getElementById)\
  \ return;\n        var newtitle = document.changeform.newtitle.value;\n        var\
  \ heading1 = document.getElementById(\"heading1\");\n        heading1.firstChild.nodeValue=newtitle;\n\
  \      }\n    </script>\n  </body>\n</</html>\n```\n\n此示例定义了一个表单，允许用户为页面输入新标题。点击按钮会调用定义在文档底部\
  \ `<script>` 标签中的 `changeTitle()` 函数。该 JavaScript 函数获取用户在表单中输入的值，通过将输入的值赋值给 `heading1.firstChild.nodeValue`\
  \ 属性，来更改标题的值。\n\n图 21.8 显示了输入新标题并点击 Change! 按钮后的页面运行状态。\n\n![截图显示了使用 W3C DOM 修改标题的示例。](img/21fig08.jpg)\n\
  \n**图 21.8** 标题修改示例运行。\n\n## 在页面中添加文本\n\n接下来，你可以创建一个实际上向页面添加文本的脚本，而不仅仅是更改现有文本。要做到，你必须首先创建一个新的文本节点。此语句创建了一个内容为“this\
  \ is a test”的新文本节点：\n\n点击此处查看代码图像\n\n```javascript\nvar node=document.createTextNode(\"\
  this is a test\");\n```\n\n接下来，你可以将此节点添加到文档中。要这样做，你需要使用 `appendChild()` 方法。文本可以添加到任何可以包含文本的元素，但在本示例中，我们将仅使用段落。以下语句将该节点添加到标识为\
  \ `heading1` 的段落中：\n\n点击此处查看代码图像\n\n```javascript\ndocument.getElementById(\"heading1\"\
  ).appendChild(node);\n```\n\n列表 21.7 显示了使用该技术实现此功能的 HTML 文档：\n\n```html\n<!doctype\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Dynamic\
  \ Text in JavaScript</title>\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n  </head>\n  <body>\n    <h1 id=\"heading1\">Dynamic Text\
  \ in JavaScript</h1>\n    <p>Using the W3C DOM, you can dynamically change the\n\
  \    heading at the top of this page.</p>\n    <p>Enter a new title and click the\
  \ Change! button. </p>\n    <form name=\"changeform\">\n      <input name=\"newtitle\"\
  size=\"40\">\n      <button type=\"button\" onclick=\"changeTitle();\">Change!</button>\n\
  \    </form>\n    <script>\n      function changeTitle() {\n        if (!document.getElementById)\
  \ return;\n        var newtitle = document.changeform.newtitle.value;\n        var\
  \ heading1 = document.getElementById(\"heading1\");\n        heading1.firstChild.nodeValue=newtitle;\n\
  \      }\n    </script>\n  </body>\n</</html>\n```\n\n\n\n\n# A.\n\n**A.** 是的。例如，你可以使用\
  \ `alert` 代替 `window.alert` 来显示消息。`window` 对象包含了当前脚本，因此它被视为默认对象。但是，请注意，当你使用多个窗口或在事件处理程序中，不应省略\
  \ `window` 对象的。\n\n**Q. 我可以更改历史记录或防止用户使用“后退”和“前进”按钮吗？**\n\n**A.** 你无法更改历史记录。你也无法阻止使用“后退”和“前进”按钮。不过，你可以使用\
  \ `location.replace` 方法加载一组不在历史记录中的页面。有一些技巧可以防止“后退”按钮正常工作，但我不建议使用它们，因为这些属于会让 JavaScript\
  \ 声誉不完的的行为。\n\n## 工作坊\n\n工作坊包含了测验题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n\
