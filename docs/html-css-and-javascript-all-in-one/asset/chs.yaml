  *   ![Image](img/arrow1.jpg) 请务必浏览 [www.w3.org/Style/CSS/](http://www.w3.org/Style/CSS/)\
  \ 的官方样式表规范，并尝试一些本课未涵盖的更冷门的样式属性。\n\n## 第 4 课：理解 JavaScript\n\n**在本课中你将学到：**\n\n*\
  \   ![Image](img/arrow.jpg) 什么是 Web 脚本及其用途\n*   ![Image](img/arrow.jpg) 脚本与编程的不同（以及相似）之处\n\
  *   ![Image](img/arrow.jpg) `JavaScript` 是什么以及它的来源\n*   ![Image](img/arrow.jpg)\
  \ 如何在网页中包含 `JavaScript` 命令\n*   ![Image](img/arrow.jpg) `JavaScript` 能为你的网页做些什么\n\
  *   ![Image](img/arrow.jpg) 脚本的开始与结束\n*   ![Image](img/arrow.jpg) `JavaScript` 语句的格式化\n\
  *   ![Image](img/arrow.jpg) 脚本如何显示结果\n*   ![Image](img/arrow.jpg) 在 Web 文档中包含脚本\n\
  *   ![Image](img/arrow.jpg) 在浏览器中测试脚本\n*   ![Image](img/arrow.jpg) 修改脚本\n*   ![Image](img/arrow.jpg)\
  \ 处理脚本中的错误\n*   ![Image](img/arrow.jpg) 将脚本移至独立文件\n\n万维网（WWW）最初是一个纯文本媒介；早期的浏览器甚至不支持在网页中显示图像。自那时起，Web\
  \ 已经走过了很长一段路。如今的网站除了有用的内容外，还包含丰富的视觉和交互功能：图形、声音、动画和视频。使用 Web 脚本语言（如 `JavaScript`）是为网页增色并以新方式与用户交互最简单的方法之一。\n\
  \n本课的第一部分将介绍 Web 脚本的概念和 `JavaScript` 语言。随着课程的推进，你将学习如何直接在 HTML 文档中包含 `JavaScript`\
  \ 命令，以及当页面在浏览器中查看时脚本将如何执行。你将操作一个简单的脚本，对其进行编辑并在浏览器中测试，同时学习创建和使用 `JavaScript` 脚本涉及的基本任务。\n\
  \n### 学习 Web 脚本基础\n\n你已经知道如何使用两种类型的计算机语言：HTML 和 CSS。你使用 HTML 标签来描述你希望文档如何格式化。然后你使用\
  \ CSS 来描述你希望文档如何显示，浏览器则将装饰后的内容呈现给用户。但由于 HTML 和 CSS 是简单的基于文本的语言，它们无法响应用户、做出决策或自动执行重复任务。这类交互式任务需要一种更复杂的语言：编程语言或脚本语言。\n\
  \n虽然许多编程语言很复杂，但脚本语言通常比较简单。它们具有简单的语法，可以用最少的命令执行任务，且易于学习。`JavaScript` 是一种 Web 脚本语言，它使你能够将脚本与\
  \ HTML 和 CSS 相结合，从而创建交互式网页。\n\n#### 脚本与程序\n\n电影或戏剧遵循剧本（script）——一份供演员执行的动作（或台词）清单。Web\
  \ 脚本为 Web 浏览器提供相同类型的指令。`JavaScript` 中的脚本可以从单行代码到全规模应用程序不等。（无论哪种情况，`JavaScript` 脚本通常在浏览器中运行。）\n\
  \n某些编程语言在执行前必须被编译（compiled）或翻译成机器码。而 `JavaScript` 是一种解释型语言（interpreted language）：浏览器在执行到每一行脚本时即时运行。\n\
  \n解释型语言有一个主要优点：编写或修改脚本非常简单。修改 `JavaScript` 脚本就像修改典型的 HTML 文档一样简单，只要你在浏览器中重新加载文档，更改就会立即生效。\n\
  \n**注意**\n解释型语言也有缺点：它们的执行速度不能非常快，因此不理想地适用于复杂的任务（如图形处理），并且它们需要解释器（在 `JavaScript`\
  \ 的情况下，通常是浏览器）才能工作。\n\n#### JavaScript 简介\n\n`JavaScript` 由 Netscape Communications\
  \ Corporation（已失效的 Netscape 浏览器的开发商）于 1995 年开发。`JavaScript` 是第一个被浏览器支持的 Web 脚本语言，至今仍是最受欢迎的语言。\n\
  \n**注意**\n一点历史：`JavaScript` 最初被称为 `LiveScript`，于 1995 年首次在 Netscape Navigator 2.0\
  \ 中推出。随后它被更名为 `JavaScript`，以表明与 Sun 公司的 `Java` 语言在营销上的关系，尽管 `Java` 和 `JavaScript`\
  \ 在结构或其他方面没有任何关系。\n\n`JavaScript` 几乎和 HTML 一样容易学习，并且可以直接包含在 HTML 文档中。以下是你可以使用 `JavaScript`\
  \ 完成的一些事情：\n\n*   ![Image](img/arrow.jpg) 在网页中、浏览器的状态栏中或在警告框中向用户显示消息\n*   ![Image](img/arrow.jpg)\
  \ 验证表单内容并进行计算（例如，在订单表单中，当你输入项目数量时自动显示运行总额）\n*   ![Image](img/arrow.jpg) 为图像制作动画，或创建在鼠标悬停时会发生变化的图像\n\
  *   ![Image](img/arrow.jpg) 创建能与用户交互的广告横幅，而不仅仅是显示一张图片\n*   ![Image](img/arrow.jpg)\
  \ 检测正在使用的浏览器或浏览器具备的功能，并仅在支持这些功能的浏览器上执行高级函数\n*   ![Image](img/arrow.jpg) 检测已安装的插件，并在需要插件时通知用户\n\
  *   ![Image](img/arrow.jpg) 修改网页的全部或部分内容，而无需用户重新加载页面\n*   ![Image](img/arrow.jpg)\
  \ 显示或与从远程服务器检索的数据进行交互\n\n你可以使用 `JavaScript` 完成所有这些以及更多工作，包括创建完整的应用程序。我们将在接下来的课程中探索\
  \ `JavaScript` 的用途。\n\n### JavaScript 如何融入网页\n\n\n\n\n\n通过使用 `<script>` 标签，如清单 4.1\
  \ 所示，你可以向网页文档中添加一段简短的脚本（本例中仅一行）。`<script>` 标签告诉浏览器开始将文本视为脚本，而结束标签 `</script>` 则告诉浏览器返回\
  \ HTML 模式。在大多数情况下，你不能在 HTML 文档中使用 JavaScript 语句，除非它们位于 `<script>` 标签内。唯一的例外是事件处理程序，这将在本课后面介绍。\n\
  \n**清单 4.1** 一个包含简单脚本的简单 HTML 文档\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<htmllang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>The American Eggplant\
  \ Society</title>\n  </head>\n  <body>\n    <h1>The American Eggplant Society</h1>\n\
      <p>Welcome to our site. Unfortunately, it is still\n    under construction.</p>\n\
      <p>We last worked on it on this date:\n    <script>\n    <!-- // Hide the script\
  \ from old browsers\n    document.write(document.lastModified);\n    // Stop hiding\
  \ the script -->\n    </script>\n    </p>\n  </body>\n</html>\n```\n\nJavaScript\
  \ 的 `document.write` 语句（你将在后面了解更多）会将输出作为网页文档的一部分发送。在本例中，它显示了文档的修改日期，如图 4.1 所示。\n\
  \n![屏幕截图显示了使用 document.write 渲染的输出。三个输出语句中的最后一条以月、日、年、时、分、秒的格式显示了最后修改日期和时间。](img/04fig01.jpg)\n\
  \n**图 4.1** 使用 `document.write` 显示最后修改日期。\n\n在这个例子中，我们将脚本放在了 HTML 文档的正文中。实际上，有四个地方可以使用脚本：\n\
  \n*   ![图片](img/arrow.jpg) **在页面正文中**——在这种情况下，当浏览器加载页面时，脚本的输出会作为 HTML 文档的一部分显示。\n\
  \n*   ![图片](img/arrow.jpg) **在页面头部，位于** `<head>` **标签之间**——头部中的脚本不应在 HTML 文档的 `<head>`\
  \ 部分内创建输出，因为这可能导致格式不良且无效的 HTML 文档，但这些脚本可以被此处或其他地方的脚本引用。`<head>` 部分通常用于函数——即可以作为单个单元使用的\
  \ JavaScript 语句组。你将在第 20 课“JavaScript 编程入门”中了解更多关于函数的内容。\n\n*   ![图片](img/arrow.jpg)\
  \ **在 HTML 标签内，例如** `<body>` **或** `<form>`——这被称为*事件处理程序*，它使脚本能够与 HTML 元素协同工作。在事件处理程序中使用\
  \ JavaScript 时，不需要使用 `<script>` 标签。你将在第 20 课中了解更多关于事件处理程序的内容。\n\n*   ![图片](img/arrow.jpg)\
  \ **完全在单独的文件中**——JavaScript 支持使用扩展名为 `.js` 的文件来包含脚本；这些文件可以通过在 `<script>` 标签中指定文件名来引入。虽然使用\
  \ `.js` 扩展名是一种惯例，但脚本实际上可以使用任何文件扩展名，或者没有扩展名。\n\n正如你将在第 25 课“JavaScript 最佳实践”中学到的，放置\
  \ JavaScript 的最佳位置是在 `<body>` 标签内，紧挨着结束标签 `</body>` 之前。这可以确保 JavaScript 是最后加载的内容，从而不会影响页面其余部分的显示速度。\n\
  \n#### 使用独立的 JavaScript 文件\n\n当你创建更复杂的脚本时，很快就会发现 HTML 文档变得庞大且混乱。为了避免这个问题，你可以使用一个或多个外部\
  \ JavaScript 文件。这些文件是扩展名为 `.js` 的文件，其中包含 JavaScript 语句。\n\n所有现代浏览器都支持外部脚本。要使用外部脚本，你可以在\
  \ `<script>` 标签中指定其文件名，如下所示：\n\n点击此处查看代码图片\n\n```\n<scriptsrc=\"filename.js\"></script>\n\
  ```\n\n注意\n\n`type` 属性过去是必需的。但在 HTML5 中，如果引用的脚本是 JavaScript，则可以省略它。\n\n因为在这种情况下，你将把\
  \ JavaScript 语句放在一个单独的文件中，所以开始和结束 `<script>` 标签之间不需要任何内容；实际上，它们之间的任何内容都会被浏览器忽略。\n\
  \n你可以使用编写 HTML 和 CSS 的同一个文本编辑器来创建 `.js` 文件。该文件应包含一个或多个 JavaScript 命令，且仅包含 JavaScript；它不应包含\
  \ `<script>` 标签、其他 HTML 标签、CSS 或 HTML 注释。将 `.js` 文件保存在引用它的 HTML 文档所在的目录中。\n\n注意\n\
  \n外部 JavaScript 文件有一个明显的优势：你可以从两个或多个 HTML 文档链接到同一个 `.js` 文件。浏览器会将该文件存储在缓存中，这可以减少网页显示所需的时间。但请记住，每个链接的文件都需要向服务器发送额外的请求。因此，尽量将所有脚本保存在尽可能少的文件中。\n\
  \n#### 理解 JavaScript 事件\n\n使用 JavaScript 可以做的许多有用的事情都涉及与用户交互，这意味着要响应*事件*——例如，点击链接或按钮。你可以在\
  \ HTML 标签中定义事件处理程序，告诉浏览器如何响应事件。例如，清单 4.2 定义了一个按钮，点击时会显示一条消息。\n\n**清单 4.2** 一个简单的事件处理程序\n\
  \n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
  utf-8\">\n    <title>Event Test</title>\n  </head>\n  <body>\n    <h1>Event Test</h1>\n\
      <button type=\"button\"\n            onclick=\"alert('You clicked the button.')\"\
  >\n            Click Me!</button>\n  </body>\n</html>\n```\n\n在本课程的各个地方，你将了解更多关于\
  \ JavaScript 事件模型以及如何创建简单和复杂事件处理程序的内容。\n\n### 探索 JavaScript 的能力\n\n如果你花过一些时间浏览网页，无疑见过许多\
  \ JavaScript 实际应用的例子。以下各节简要描述了 JavaScript 的一些典型应用，所有这些你将在后续课程中探索。\n\n#### 改进导航\n\
  \nJavaScript 最常见的用途之一是网站的导航系统。你可以使用 JavaScript 创建导航工具——例如，用于选择下一页的下拉菜单，或者当鼠标悬停在导航链接上时弹出的子菜单。\n\
  \n如果做得恰当，这种 JavaScript 交互性可以使网站更易于使用，即使对于不支持 JavaScript 的浏览器也是如此。\n\n#### 验证表单\n\
  \n表单验证是 JavaScript 的另一个常见用途，尽管 HTML5 的表单验证功能在这方面抢走了 JavaScript 不少风头。一个简单的脚本可以读取用户在表单中键入的值，并确保它们格式正确，例如邮政编码、电话号码和电子邮件地址。这种客户端验证使用户能够在不等待\
  \ Web 服务器响应的情况下修复常见错误，而服务器通常会告诉他们表单提交无效。你将在第 27 课“处理基于 Web 的表单”中学习如何处理表单数据。\n\n\
  #### 特殊效果\n\nJavaScript 最早且最令人厌烦的用途之一是创建吸引注意力的特殊效果——例如，在浏览器状态栏中滚动消息或闪烁页面背景颜色。\n\n\
  \n\n\n这些技术幸运地已经过时了，但得益于 W3C DOM 和最新的浏览器，JavaScript 可以实现一些更令人印象深刻的效果——例如，创建可在页面上拖放的对象，或在幻灯片中实现图像之间的淡入淡出过渡。一些开发者将\
  \ HTML5、CSS3 和 JavaScript 结合使用，创建出功能完整的交互式游戏。\n\n## 远程脚本（AJAX）\n\n长期以来，JavaScript\
  \ 最大的限制是无法与 Web 服务器通信。例如，你可以用 JavaScript 验证电话号码的位数是否正确，但无法根据号码在数据库中查找用户的位置。\n\n\
  如今，大多数浏览器都支持 JavaScript 的一些高级特性，情况已不再如此。你的脚本可以在不加载页面的情况下从服务器获取数据，也可以将数据发送回服务器进行保存。这些特性统称为\
  \ AJAX（异步 JavaScript 和 XML），或 `remote scripting`。\n\n## 用 JavaScript 显示时间\n\nJavaScript\
  \ 的一个常见用途是在浏览器中显示日期和时间，我们将从这里开始组合一些脚本片段。由于 JavaScript 在浏览器中运行，它显示的时间将是用户当前时区的时间。不过，你也可以用\
  \ JavaScript 计算“通用”（UTC）时间。\n\n**注意**\nUTC 代表协调世界时（Universal Time Coordinated），是基于旧\
  \ GMT（格林威治标准时间）标准的原子时间标准。这是本初子午线的时间，该子午线穿过英国伦敦的格林威治。\n\n你的脚本与大多数其他 JavaScript 程序一样，以\
  \ HTML 的 `<script>` 标签开头。正如你在本课前面所学到的，你使用 `<script>` 和 `</script>` 标签将脚本包含在 HTML\
  \ 文档中。\n\n**警告**\n请记住，在起始和结束的 `<script>` 标签之间只包含有效的 JavaScript 语句。如果浏览器在 `<script>`\
  \ 标签内发现任何非有效 JavaScript 语句，它将显示 JavaScript 错误消息。你应该在非 JavaScript 的行前面使用注释指示符（`//`）。\n\
  \n要开始创建脚本，请打开你喜欢的文本编辑器，并输入起始和结束的 `<script>` 标签，如下所示：\n\n```html\n<script></script>\n\
  ```\n\n在这个脚本中，你将使用 JavaScript 确定本地时间和 UTC 时间，然后在浏览器中显示它们。幸运的是，所有困难的部分（例如日期格式之间的转换）都已内置于\
  \ JavaScript 解释器中；这也是显示日期和时间成为初学者良好起点的一个原因。\n\n### 在变量中存储数据\n\n要开始编写脚本，你将使用一个 `variable`\
  \ 来存储当前日期。你将在第 22 课 “使用 JavaScript 变量、字符串和数组”中了解更多关于变量的内容，但现在只需理解 `variable` 是一个可以保存值的容器——一个数字、一些文本，或者在这里是一个日期。\n\
  \n要开始编写脚本，请在第一个 `<script>` 标签后添加以下行，确保在版本中使用相同的大小写组合，因为 JavaScript 命令和变量名是区分大小写的：\n\
  \n```javascript\nnow = new Date();\n```\n\n这条语句创建了一个名为 `now` 的变量，并将当前日期和时间存储在其中。这条语句以及你将在本脚本中使用的其他语句都使用了\
  \ JavaScript 内置的 `Date` 对象，它使你能够方便地处理日期和时间。你将在第 22 课中了解更多关于日期处理的内容。\n\n**注意**\n\
  请注意创建名为 `now` 的变量的代码片段末尾的分号。这个分号告诉浏览器它已经到达了一条语句的末尾。分号是可选的，但使用它们可以帮助你避免一些常见错误。为了清晰起见，我们将在这些课程中一直使用分号。\n\
  \n### 计算结果\n\n在内部，JavaScript 将日期存储为自 1970 年 1 月 1 日以来的毫秒数。幸运的是，JavaScript 包含许多以各种方式转换日期和时间的函数，因此你无需弄清楚如何将毫秒转换为天、日期或时间。\n\
  \n要继续编写脚本，请在最终的 `</script>` 标签之前添加以下两条语句：\n\n```javascript\nlocaltime = now.toString();\n\
  utctime = now.toGMTString();\n```\n\n这些语句创建了两个新变量：`localtime`，以易读的格式包含当前时间和日期；以及\
  \ `utctime`，包含对应的 UTC 时间。\n\n**注意**\n`localtime` 和 `utctime` 变量存储一段文本，例如 `January\
  \ 1, 2001 12:00 PM`。用编程术语来说，一段文本被称为 `string`。\n\n### 创建输出\n\n现在你有了两个变量——`localtime`\
  \ 和 `utctime`——它们包含了脚本所需的结果。当然，除非你能看到它们，否则这些变量对你没有太大用处。JavaScript 包含几种显示信息的方法，其中最简单的一种是使用\
  \ `document.write` 语句。\n\n`document.write` 语句可以显示文本字符串、数字或你提供的任何其他内容。由于你的 JavaScript\
  \ 程序将在网页中使用，输出将作为页面的一部分显示。要显示结果，请在最终的 `</script>` 标签之前添加以下语句：\n\n```javascript\n\
  document.write(\"<p><strong>Local time:</strong> \" + localtime + \"</p>\");\ndocument.write(\"\
  <p><strong>UTC time:</strong> \" + utctime + \"</p>\");\n```\n\n这些语句告诉浏览器向包含脚本的网页添加一些文本。输出将包含一些简短的字符串来介绍结果，以及\
  \ `localtime` 和 `utctime` 变量的内容。\n\n注意引号内的 HTML 元素，例如 `<p>` 和 `<strong>`；由于 JavaScript\
  \ 的输出出现在网页中，因此需要使用 HTML 进行格式化。\n\n**注意**\n请注意 `document.write()` 代码片段中文本和变量之间的加号（`+`）。在这种情况下，每个加号告诉浏览器将这些值组合成一个文本字符串。如果你在两个不在引号内的数字之间使用加号，它们将被相加。\n\
  \n### 将脚本添加到网页\n\n现在你应该有一个完整的脚本，可以计算结果并显示它。你的脚本应与清单 4.3 一致。\n\n**清单 4.3 完整的日期和时间脚本**\n\
  \n```html\n<script>\n  now = new Date();\n  localtime = now.toString();\n  utctime\
  \ = now.toGMTString();\n  document.write(\"<p><strong>Local time:</strong> \" +\
  \ localtime + \"</p>\");\n  document.write(\"<p><strong>UTC time:</strong> \" +\
  \ utctime + \"</p>\");\n</script>\n```\n\n要使用你的脚本，你需要将其添加到 HTML 文档中。如果你使用到目前为止在课程中看到的通用模板，最终应该得到类似清单\
  \ 4.4 的内容。\n\n**清单 4.4 HTML 文档中的日期和时间脚本**\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Displaying Times and Dates</title>\n\
  \  </head>\n  <body>\n    <h1>Current Date and Time</h1>\n    <script>\n      now\
  \ = new Date();\n      localtime = now.toString();\n      utctime = now.toGMTString();\n\
  \      document.write(\"<p><strong>Local time:</strong> \"\n            + localtime\
  \ + \"</p>\");\n      document.write(\"<p><strong>UTC time:</strong> \" + utctime\n\
  \            + \"</p>\");\n    </script>\n  </body>\n</html>\n```\n\n现在你有了一个完整的\
  \ HTML 文档，请将其保存为 `.html` 扩展名。\n\n## 测试脚本\n\n\n\n\n\n要测试你的脚本，只需在网页浏览器中加载你创建的 HTML\
  \ 文档。如果脚本输入正确，浏览器应显示脚本的运行结果，如图 4.2 所示。（当然，你的结果不会与我的相同，但应与你的计算机时钟设置一致。）\n\n![截图显示了显示日期和时间的脚本输出。页面标题为一级标题。它以日、月、日期、年、小时、分钟和秒的格式显示本地时间和\
  \ UTC 时间。](img/04fig02.jpg)\n\n**图 4.2** 使用 JavaScript 显示日期和时间。\n\n注意\n\n在 Internet\
  \ Explorer 中，根据你的安全设置，脚本可能不会执行，浏览器可能会显示安全警告。在这种情况下，请按照浏览器的指示允许脚本运行。（这是因为默认安全设置允许在线文档中的\
  \ JavaScript，但不允许本地文件中的 JavaScript。）\n\n#### 修改脚本\n\n尽管当前脚本确实显示了当前日期和时间，但其显示效果远不如你墙上或桌上的时钟那样美观。为了改善这种情况，你可以使用一些额外的\
  \ JavaScript 功能和少量 HTML 来显示一个大时钟。\n\n要显示大时钟，你需要将小时、分钟和秒分别存入不同的变量。同样，JavaScript 内置了函数来完成大部分工作：\n\
  \n```\nhours = now.getHours();\nmins = now.getMinutes();\nsecs = now.getSeconds();\n\
  ```\n\n这些语句利用 JavaScript 内置的日期函数，将时间分量加载到 `hours`、`mins` 和 `secs` 变量中。\n\n将小时、分钟和秒分别存入变量后，你可以创建\
  \ `document.write` 语句来显示它们：\n\n点击此处查看代码图片\n\n```\ndocument.write(\"<p><strong>\"\
  );\ndocument.write(hours + \":\" + mins + \":\" + secs);\ndocument.write(\"</p></strong>\"\
  );\n```\n\n第一条语句显示一个 HTML `<h2>` 标题标签，将时钟显示为二级标题元素。第二条语句显示 `hours`、`mins` 和 `secs`\
  \ 变量，用冒号分隔，第三条语句添加结束的 `</h2>` 标签。\n\n你可以将上述语句添加到原始的日期和时间脚本中，以增加大时钟显示。清单 4.5 显示了完整的修改后脚本。\n\
  \n**清单 4.5** 带大时钟显示的日期和时间脚本\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>显示时间和日期</title>\n  </head>\n\
    <body>\n    <h1>当前日期和时间</h1>\n    <script>\n     now = new Date();\n     localtime\
  \ = now.toString();\n     utctime = now.toGMTString();\n     document.write(\"<p><strong>本地时间:</strong>\
  \ \"\n          + localtime + \"</p>\");\n     document.write(\"<p><strong>UTC 时间:</strong>\
  \ \"\n          + utctime + \"</p>\");\n     hours = now.getHours();\n     mins\
  \ = now.getMinutes();\n     secs = now.getSeconds();\n     document.write(\"<h2>\"\
  );\n     document.write(hours + \":\" + mins + \":\" + secs);\n     document.write(\"\
  </h2>\");\n    </script>\n  </body>\n</html>\n```\n\n现在你已经修改了脚本，保存 HTML 文件并在浏览器中打开修改后的文件。如果浏览器仍在运行，你可以直接使用“重新加载”按钮加载新版本的脚本。尝试一下，验证窗口上半部分和新的时钟显示的时间是否一致。图\
  \ 4.3 显示了结果。\n\n![截图显示了修改后的日期和时间输出。页面标题现在为二级标题。除了本地时间和 UTC 时间外，当前时间以二级标题格式显示在底部。](img/04fig03.jpg)\n\
  \n**图 4.3** 显示修改后的日期和时间脚本。\n\n注意\n\n此脚本生成的时间格式并不完美：下午的小时采用 24 小时制，且没有前导零，因此 12:04\
  \ 显示为 12:4。有关这些问题的解决方案，请参见第 22 课。\n\n#### 处理 JavaScript 错误\n\n随着你开发更复杂的 JavaScript\
  \ 应用程序，你会不时遇到错误。JavaScript 错误通常由输入错误的 JavaScript 语句引起。\n\n要查看 JavaScript 错误消息的示例，你可以修改上一节中添加的语句。在此示例中，我们使用一个常见错误：省略一个括号。将清单\
  \ 4.5 中的最后一条 `document.write` 语句改为：\n\n```\ndocument.write(\"</h2>\";\n```\n\n再次保存你的\
  \ HTML 文档，并将文档加载到浏览器中。根据你使用的浏览器版本，会发生两种情况之一：要么显示错误消息，要么脚本根本无法执行。\n\n如果显示了错误消息，你只需添加缺失的括号即可解决问题。如果没有显示错误，你应该配置浏览器以显示错误消息，以便诊断未来的问题：\n\
  \n*   ![图片](img/arrow.jpg) 在 Firefox 中，你可以选择“工具”、“Web 开发者”、“Web 控制台”。控制台会显示你在本例中创建的错误消息，如图\
  \ 4.4 所示。\n\n*   ![图片](img/arrow.jpg) 在 Chrome 中，从选项菜单（浏览器栏右侧的三个水平点）中选择“更多工具”、“开发者工具”。浏览器窗口底部会显示一个控制台。如果未选中，请选择控制台选项卡。\n\
  \n![截图显示了 Firefox 的开发者工具箱。](img/04fig04.jpg)\n\n**图 4.4** 在 Firefox 的 JavaScript\
