  \n## 第 5 课\n\n## 验证和调试你的代码\n\n**在本课中你将学到：**\n\n*   ![图片](img/arrow.jpg) 如何验证你的 HTML\
  \ 和 CSS\n\n*   ![图片](img/arrow.jpg) 如何使用开发者工具调试 HTML 和 CSS\n\n*   ![图片](img/arrow.jpg)\
  \ 如何使用 JavaScript 控制台调试 JavaScript\n\n无论你是初学者还是经验丰富的专家，错误都不可避免。对于所有技能水平的开发者来说，错误是生活中的现实，我们甚至敢说，如果你的代码在创建过程中的某个时刻没有包含错误，那么你只是不够努力。所以不要担心错误；只需在客户或用户遇到其副作用之前识别并修复它们。\n\
  \n在本课中，你将学习如何在开发 HTML 和 CSS 时对其进行验证和调试，以及如何使用内置于 Web 浏览器中的一些便捷工具来识别和调试 JavaScript\
  \ 问题。\n\n### 验证你的 Web 内容\n\n在本系列的第一课中，我讨论了测试你创建的网页的方法；测试页面的一种非常重要的方法是*验证*它们。可以这样理解：设计并绘制一套漂亮的房屋图纸是一回事，而建筑师将其盖章为适合施工的安全结构则是另一回事。验证你的网页是一个类似的过程；不过，在这种情况下，建筑师是一个基于\
  \ Web 的应用程序，而不是一个人。\n\n简而言之，验证是使用一个专门搜索错误并确保页面符合当前 HTML 和 CSS 标准的应用程序来测试页面的过程。验证很简单。事实上，负责制定\
  \ Web 标准的标准化组织——万维网联盟（W3C）提供了一个在线验证工具，你可以使用它，网址为 [`validator.w3.org`](https://validator.w3.org)。图\
  \ 5.1 显示了使用 W3C 标记验证服务的选项。\n\n\n\n\n\n![截图显示了 W3C 验证器页面。它有三个选项卡，其中“按 URI 验证”被选中。它有一个文本框用于输入地址，以及一个“检查”按钮用于启动验证过程。](img/05fig01.jpg)\n\
  \n**图 5.1** W3C 标记验证服务使您能够验证 HTML 文档，确保其编码准确。\n\n如果您已经在线发布了一个页面，可以使用“按 URI 验证”选项卡。使用“按文件上传验证”选项卡来验证存储在本地计算机文件系统中的文件。“按直接输入验证”选项卡允许您粘贴来自文本编辑器的文件内容。如果一切顺利，您的页面将获得通过报告，如图\
  \ 5.2 所示，该图验证了来自第 2 课“结构化 HTML 文档”的代码清单。\n\n![截图显示了标记验证服务的网页。](img/05fig02.jpg)\n\
  \n**图 5.2** 如果页面通过了 W3C 标记验证服务，您就知道代码已经准备好用于正式环境。\n\nW3C 还提供了一个验证 CSS 的工具；访问[`jigsaw.w3.org/css-validator/`](https://jigsaw.w3.org/css-validator/)并输入\
  \ URL 或使用提供的选项上传文件。如果 W3C 标记或 CSS 验证服务遇到错误，它会提供具体细节（包括问题代码的行号）。图 5.3 显示了一个错误报告示例；在此实例中，我们故意使用了\
  \ CSS 属性`padding-up`——一个不存在的属性——而不是`padding-top`。\n\n![截图显示了“W3C CSS 验证器服务”的错误报告。错误以表格形式显示，包含行号、元素（例如：body）和错误原因。顶部有一条消息显示：“抱歉！我们发现了以下错误。”](img/05fig03.jpg)\n\
  \n**图 5.3** W3C CSS 验证服务，与 W3C 标记验证服务一样，提供有用的错误报告。\n\n使用基本的验证服务是查找问题并清除 HTML 和 CSS\
  \ 中无效代码（如错误命名的 CSS 属性和不匹配的 HTML 标签）的好方法。验证不仅会在您的页面构建正确时通知您，还会帮助您在向全世界发布页面之前发现并修复代码中的问题。\n\
  \n### 使用开发者工具调试 HTML 和 CSS\n\n您可以通过使用大多数主流浏览器内置的更高级工具，将调试工作扩展到基本验证之外。图 5.4、5.5 和\
  \ 5.6 展示了启用开发者工具后一些主流浏览器的外观；在每个图中，您会注意到某些工具的名称和功能存在一致性。\n\n![截图显示了 Firefox 中的 Google\
  \ 首页，使用开发者工具检查 Google 徽标。](img/05fig04.jpg)\n\n**图 5.4** 在 Firefox 中使用开发者工具检查包含\
  \ Google 徽标的元素。\n\n![截图显示了 Internet Explorer 中的 Google 首页，使用开发者工具检查 Google 徽标。](img/05fig05.jpg)\n\
  \n**图 5.5** 在 Microsoft Internet Explorer 中使用开发者工具检查包含 Google 徽标的元素。\n\n![截图显示了\
  \ Chrome 中的 Google 首页，使用开发者工具检查 Google 徽标。](img/05fig06.jpg)\n\n**图 5.6** 在 Chrome\
  \ 中使用开发者工具检查包含 Google 徽标的元素。\n\n尽管本节中我们将使用的示例是 Chrome 开发者工具，但您可以在前面展示的所有开发者工具（以及其他浏览器，如\
  \ Safari）中看到相似之处。在这个具体案例中，检查元素的功能在所有三套工具中都存在。当您用鼠标在屏幕上选择一个元素时，开发者工具中的附加窗口面板会显示用于渲染该元素的确切\
  \ HTML，以及当前应用于该元素的样式规则。\n\n检查器的这个功能非常有用，因为它提供了一种可视化方式，让您看到 DOM 树中的节点与渲染后的网页之间的关系；此外，请注意每套工具中面包屑导航的使用，它显示了从根节点`html`到`img`节点（ID\
  \ 值为`#hplogo`）的节点层级。这种面包屑导航的使用进一步帮助您理解渲染后的视觉元素在 DOM 中的位置（而不仅仅是在屏幕上）。\n\n接下来的几节将带您了解这些工具的一些实际应用。\n\
  \n#### 使用检查器调试 HTML\n\n为了说明如何使用检查器调试 HTML，请考虑清单 5.1 中的代码，它只是一个包含电影列表的基本 HTML 文档，其中标题中的“Favorite”一词本应为斜体。然而，如果您查看图\
  \ 5.7 中的渲染版本，您会发现一些问题：*所有内容*都变成了斜体，并且第一个列表项前面没有项目符号。这些问题仅由所有文本中的两个字符引起。\n\n**清单\
  \ 5.1** 一个简单的 HTML 文档，包含一些 HTML 语法错误，如图 5.7 所示\n\n![截图显示了无序列表输出的网页。](img/05fig07.jpg)\n\
  \n**图 5.7** 这个网页有两个问题：只有“Favorite”一词应为斜体，并且第一个列表项前面没有项目符号。\n\n点击此处查看代码图片\n\n```\n\
  <!doctype html>\n\n<html lang=\"en\">\n\n  <head>\n\n     <meta charset=\"utf-8\"\
  >\n\n     <title>Favorite Movies</title>\n\n  </head>\n\n  <body>\n\n     <h1><i>Favorite<i>\
  \ Movies</h1>\n\n     <ul>\n\n       <ll>Lord of the Rings</li>  \n\n       <li>Harry\
  \ Potter</li>\n\n       <li>Narnia</li>\n\n       <li>Hot Lead and Cold Feet</li>\n\
  \n     </ul>\n\n  </body>\n\n</html>\n```\n\n按照以下步骤，使用开发者工具中的检查器查找并修复 HTML 语法问题：\n\
  \n1.  将清单 5.1 中的代码添加到新文件中，保存文档，然后在您喜欢的现代浏览器（Chrome、Firefox、Safari 或 Edge）中打开它。您可以将文档保留在本地机器上或将其放在\
  \ Web 服务器上；对于此示例，只要您能在 Web 浏览器中打开文件，这并不重要。\n\n2.  右键单击屏幕并选择“检查元素”。您应该会看到类似图 5.8\
  \ 所示的内容，其中“元素”选项卡已被预选。\n\n    ![截图显示了示例无序列表的输出和开发者工具的网页。](img/05fig08.jpg)\n\n \
  \   **图 5.8** “元素”选项卡默认被选中。\n\n3.  单击“元素”面板中的箭头以展开`<h1>`标签，如图 5.9 所示。注意，在`<h1>`元素下有一个`<i>`元素，还有另一对`<i></i>`标签。这不对：您记得（并且可以在源文件中看到）您并没有在代码中到处放置`<i>`元素，那么它们为什么会出现呢？好吧，如果您仔细查看“元素”面板，然后查看源代码，您会注意到第二个`<i>`标签缺少一个`/`，无法成为您想要的闭合`</i>`标签。这意味着浏览器正在渲染（并且检查器正在显示）代码中每个元素周围似乎都有`<i>``</i>`元素，因为第一个`<i>`元素从未被闭合；渲染引擎正在解释所有这些幻影`<i>`元素的存在。\n\
  \n    ![截图显示了“Favorite Movies”页面在“元素”选项卡中展开视图的脚本。](img/05fig09.jpg)\n\n    **图 5.9**\
  \ 这个 HTML 检查器在 DOM 中显示的`<i>`元素比源代码中的要多。\n\n\n\n\n\n4.  在源文件中，将第二个 `<i>` 标签改为闭合的\
  \ `</i>` 标签，然后保存文档。如果最初将文件放在 Web 服务器上，请将其放回原处。\n\n5.  在浏览器中刷新文档。注意，如图 5.10 所示，单词“Favorite”现在正确地显示为斜体，并且检查器中所有多余的\
  \ `<i>` 元素都已消失；然而，浏览器显示中第一个列表项前的项目符号仍然缺失。\n\n    ![网页截图，显示输出结果和元素面板。](img/05fig10.jpg)\n\
  \n    **图 5.10** 该网页现在只有一个问题：第一个列表项缺少项目符号。\n\n6.  返回元素面板，展开 `<ul>` 元素，然后展开 `<ll>`\
  \ 元素，如图 5.11 所示。注意，在 `<ul>` 元素下，并不是一组正确开闭的四个 `<li>` 元素，而是一个开放的 `<ll>` 标签，其内部包含三个\
  \ `<li>` 元素，然后是一个闭合的 `</li>` 标签。虽然我们还没有介绍 HTML 列表项标签（将在下一课中介绍），但你可能已经推断出：由于带有开闭\
  \ `<li>` 标签的三行显示了项目符号，而源代码中 `<ll>` 元素由 `</li>` 标签闭合，因此该开放标签应该是一个 `<li>` 标签。\n\n\
  \    ![截图显示 DOM 中“Favorite Movies”脚本的“body”部分。](img/05fig11.jpg)\n\n    **图 5.11**\
  \ 查看 DOM 发现，浏览器在 `<ul>` 标签下看到一个 `<ll>` 标签，而不是一组 `<li>` 标签。\n\n7.  在源文件中，将 `<ll>`\
  \ 标签改为 `<li>` 标签，然后保存文档。如果最初将文件放在 Web 服务器上，请将其放回原处。\n\n8.  在浏览器中重新加载网页。现在页面显示正确，如图\
  \ 5.12 所示。\n\n![截图显示“Favorite movies”列表以所需格式显示，即标题中的单词“Favorite”是唯一斜体文本，列表中的所有项都带有项目符号。](img/05fig12.jpg)\n\
  \n**图 5.12** Chrome 现在按预期格式显示网页。\n\n尽管按照上述步骤操作展示了检查器在帮助发现问题方面的一些用途，但你可能想知道，与仅使用验证器相比，这个过程实际上能提高多少效率、带来多少帮助。毕竟，之前看到的问题纯粹是验证错误，使用你之前学过的\
  \ W3C 验证器很容易就能发现。图 5.13 显示了原始列表中存在的一些验证错误。\n\n![截图显示 W3 验证页面。](img/05fig13.jpg)\n\
  \n**图 5.13** W3C 验证器清晰地显示了错误。\n\n注意\n\n使用验证器时，最好按照问题出现的顺序进行审查。通常，修复一个错误会导致后续列出的许多错误消失。例如，修复图\
  \ 5.13 中的第一个“未闭合元素 i”错误，也会修复第二个错误，同时还会修复“看到结束标签 h1…”错误。通常，一个好的做法是修复一个错误后重新验证，看看会发生什么。\n\
  \n诚然，验证器能更快地识别纯语法问题，而使用检查器则需要你具备知识和经验，以便在问题以不同上下文（而非原始源代码）呈现时能立即发现。我们建议初学者先通过验证器运行代码，但了解\
  \ DOM 渲染的替代视图对于持续学习过程非常有用。\n\n#### 使用检查器调试 CSS\n\n你刚刚学到的关于使用检查器调试 HTML 的所有内容同样适用于\
  \ CSS：你可以使用开发者工具来发现样式定义和继承方面的问题。当你进行更高级的开发时，例如使用 JavaScript 修改特定元素的 CSS（使其超出源代码中的原始状态），这些内置工具会变得特别有用，但在开发的初始阶段它们仍然很有用。\n\
  \n本节中的步骤将简要演示使用检查器处理 CSS 的示例——具体来说，是一些格式不佳但有效的 CSS，如清单 5.2 所示。尽管你在开发过程中很早就遇到了本课（以及这些示例），但我们确信，在几课之后，你会记住在这里学到的步骤，并在整个课程剩余部分使用开发者工具来增强调试和开发能力。\n\
  \n**清单 5.2** 有效但显示不佳的 HTML 和 CSS\n\n点击此处查看代码图像\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n     <meta charset=\"utf-8\">\n     <style>      \n     #container\
  \ {\n       margin: 30px;\n       padding: 5px;\n       width: 300px;\n        \
  \        }  \n     #tabs {\n       padding: 0px;\n       width: 50px;\n        \
  \        }\n    #content {\n      border: 1px solid #000000;\n      height: 100px;\n\
  \      width: 300px;\n      clear: both;\n    }\n    span {\n      margin: 5px;\n\
  \      width: 100px;\n      background-color: #C0C0C0;\n      font-weight: bold;\n\
  \      border-color: #C0C0C0;\n      border: 1px solid #000000;\n      border-radius:\
  \ 5px 5px 0px 0px;\n      padding: 3px;\n      float: left;\n      text-align: center;\n\
  \    }\n    span:hover {\n      background-color: #3030FF;\n      color: #FFFFFF;\n\
  \      cursor: pointer;\n    }\n    p {\n      font-weight: bold;\n      text-align:\
  \ center;\n    }\n     </style>\n     <title>Sample Page</title>\n  </head>\n  <body>\n\
  \    <div id=\"container\">\n      <div id=\"tabs\">\n        <span>Name/Title</span>\n\
  \        <span>Contact Info</span>\n        <span>Biography</span>\n      </div>\n\
  \      <div id=\"content\">\n        <p>Jimbo Jones</p>\n        <p>Rabble-Rouser</p>\n\
  \      </div>\n    </div>\n  </body>\n</html>\n```\n\n如果你通过验证器运行这段 HTML 和 CSS，它不会产生任何错误，因为它们是有效的\
  \ HTML 和 CSS。然而，如图 5.14 所示，显示效果并不正确。选项卡本应对齐在包含文本的框的顶部。如果能解决这个初始布局问题，用户就可以点击选项卡，框中的内容会随之改变。但在初始显示达到预期效果之前，我们无法继续推进。这是一个典型的\
  \ HTML 和 CSS 调试问题——代码没有错误（无效），但显示不正确（未按我们想要的方式显示）。\n\n![截图显示有效 HTML 和 CSS 脚本的输出。三个选项卡“Name/Title、Contact\
  \ Info 和 Biography”上下排列，下方是一个显示两个名字的文本框。](img/05fig14.jpg)\n\n**图 5.14** 有效 HTML\
  \ 和 CSS 的结果，需要进一步调试以改善显示效果。\n\n按照以下步骤，使用检查器发现并修复一些问题：\n\n1.  将清单 5.2 中的代码添加到新文件中，保存文档，然后在\
  \ Web 浏览器中打开。你可以将文档保存在本地机器上，也可以放在 Web 服务器上；只要能在浏览器中打开文件，对本示例来说都无关紧要。\n\n2.  右键单击页面，选择“检查元素”以打开开发者工具。\n\
  \n\n\n\n\n3.  在“元素”面板中点击箭头，展开 ID 为 `\"container\"` 的 `<div>` 元素，然后展开 ID 为 `\"tabs\"\
  ` 的 `<div>` 元素。点击 ID 为 `\"tabs\"` 的 `<div>` 元素，使其在屏幕上高亮显示，如图 5.15 所示。该 `<div>` 的宽度会显示出来；在本例中，宽度为\
  \ 50 像素。这可能会让你疑惑：这个 `<div>` 的宽度小于其内部任何一个 `<span>` 元素的宽度（点击其中一个可以看到它们宽度为 100 像素），更不用说三个\
  \ `<span>` 的总宽度了——这是否导致了布局问题？\n\n    ![截图显示了示例有效 HTML 和 CSS 脚本及其 DOM 的输出。](img/05fig15.jpg)\n\
  \n    **图 5.15** 选中的 `<div>` 元素宽度仅为 50 像素。\n\n4.  根据上一步的直觉，点击 ID 为 `\"container\"\
  ` 的 `<div>` 元素，使其在屏幕上高亮显示，并在样式面板中聚焦其样式。注意，该 `<div>` 元素的宽度为 300 像素。\n\n5.  在“元素”面板中，再次点击\
  \ ID 为 `\"tabs\"` 的 `<div>` 元素，使其样式在样式面板中聚焦。在样式面板中，双击 `width` 值，使该字段变为可编辑状态，并将其值改为\
  \ `300px`，如图 5.16 所示。\n\n![截图显示了修改后的有效 HTML 和 CSS 脚本输出。选项卡“名称或标题”和“联系信息”处于同一水平，并排显示。第三个选项卡仍位于第一个选项卡下方。](img/05fig16.jpg)\n\
  \n**图 5.16** 布局立即发生变化，尽管仍然不正确。\n\n无需在本地或 Web 服务器上对底层源代码进行任何更改，你就可以将检查器用作一种编辑器，来审查对\
  \ HTML 和 CSS 的可能更改。尽管本例中的代码距离“美观”还很远，但你可以继续自行修改，并观察显示效果如何变化。在完成后续课程后，你可能会获得更好的结果，但即使没有关于对齐、外边距和内边距的详细知识，你也可以体验一种试错式的调试过程，而无需在代码中提交更改。\n\
  \n注意\n\n开发者工具中的检查器不仅可用于你自己的代码。你可以打开开发者工具，查看任何页面的源代码，了解页面的构建方式——并且可以更改 HTML 和 CSS\
  \ 值，观察这些更改如何影响显示，就像你刚才所做的那样。\n\n你是否好奇为什么三个 100 像素宽的选项卡无法放入一个 300 像素宽的容器中？这与 CSS\
  \ 盒模型有关。你将在第 10 课“理解 CSS 盒模型与定位”中了解更多内容。\n\n### 使用开发者工具调试 JavaScript\n\n大多数主流浏览器中的开发者工具都可以帮助你调试\
  \ JavaScript，从在控制台中捕获基本语法错误，到使用“源代码”面板及其所有内容进行高级调试步骤。在本节中，我们将使用清单 5.3 中的代码来介绍这些工具。\n\
  \n**清单 5.3** 一个包含几个不同 JavaScript 错误的简单 HTML 文档\n\n点击此处查看代码图片\n\n```\n<!doctype html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Sample Page</title>\n\
  \    <script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n   \
  \ <script>\n    function incCount(){\n      var count = 0;\n      count += 1;\n\
  \      return count;\n    }\n    function countIt(){\n      $(\"#counter\").html(incCount);\n\
  \    }\n    </script>\n    <style>\n    button {\n      background-color: #0066AA;\n\
  \      color: #FFFFFF;\n      font-weight: bold;\n      border: 2px solid, #C0C0C0;\n\
  \      width: 100px;\n    }\n    </style>\n  </head>\n  <body>\n    <button onclick=\"\
  countit()\">Click Me</button>\n    <div id=\"counter\"></div>\n  </body>\n</html>\n\
  ```\n\n如果你将清单 5.3 中的代码添加到新文件中，保存文档，然后在本地机器或服务器上通过 Web 浏览器打开它，你会看到图 5.17 中所示的一个毫不起眼的小按钮。\n\
  \n![截图显示了一个网页，左上角有一个“Click Me”按钮。这是页面中唯一的内容。](img/05fig17.jpg)\n\n**图 5.17** 显示清单\
  \ 5.3 的初始输出。\n\n然而，如果你按照以下步骤操作，很快就会通过控制台发现此代码的问题：\n\n1.  右键单击网页，选择“检查元素”。\n\n2.\
  \  在开发者工具中点击“控制台”选项卡，切换到控制台面板。\n\n3.  点击浏览器渲染出的“Click Me”按钮。你应该会看到类似图 5.18 所示的错误，表明代码中存在错误。\n\
  \n    ![截图显示了带有“Click Me”按钮的页面。](img/05fig18.jpg)\n\n    **图 5.18** 控制台显示代码中存在语法错误的位置。\n\
  \n4.  点击链接，该链接会带你到文件中包含错误的确切行（本例中链接为 `listing_with_js_errors.html:32`），你会看到被调用的\
  \ JavaScript 函数是 `countit()`，而该函数最初在第 15 行定义为 `countIt()`。正如你在上一课中学到的，JavaScript\
  \ 是区分大小写的。\n\n如果你通过在第 32 行使用 `countIt()` 而不是 `countit()` 来修正底层源文件，然后重新加载文档并点击“Click\
  \ Me”按钮，控制台中将不再显示错误。然而，你很快会发现，该文档还存在其他问题。\n\n文档的 `<head>` 部分包含一个指向外部存储的 JavaScript\
  \ 库（实际上是 jQuery）的链接，以及一些定义了两个函数的 JavaScript 代码。`<body>` 部分包含一个带有 `onclick` 事件的 `<button>`\
  \ 标签，用于调用 `countIt()` JavaScript 函数，以及一个用于显示按钮点击次数字符串的 `<div>` 元素。这一切看起来都不错，但如果你多次点击“Click\
  \ Me”按钮，数字不会超过 1，并且控制台中不会出现错误。这种情况需要更高级的调试。\n\n注意\n\n始终对网页进行多次测试。在清单 5.3 的 JavaScript\
  \ 中，修复第一个错误后页面看似正常工作。但如果你只点击按钮一次，就永远不会发现后续点击存在的问题。每当处理网页上的交互时，你应该在希望页面正常运行的每个浏览器/设备上至少测试三次。\n\
  \n#### 仔细查看“源代码”面板\n\n“源代码”面板（Firefox 中为“调试”面板，Safari 中为“调试器”）包含一组工具，使你能够暂停、恢复和单步执行\
  \ Web 浏览器中加载的代码。通过设置断点，你可以观察代码的各个部分如何执行，这在追踪与基本语法无关的问题时尤其有用（控制台会在无需你干预的情况下自动显示语法错误）。\n\
  \n将清单 5.3 中的代码加载到浏览器中并启用开发者工具后，点击“源代码”选项卡，即可看到“源代码”面板及其相关工具。它应该类似于图 5.19 所示。\n\n\
  ![截图显示了开发者工具中的重要工具。](img/05fig19.jpg)\n\n**图 5.19** 显示 Chrome 开发者工具中的“源代码”面板，以及本例中的一些重要工具。\n\
  \n注意\n\n\n\n\n要全面了解“来源”面板中的所有图标，请参阅 [`developers.google.com/web/tools/chrome-devtools/`](https://developers.google.com/web/tools/chrome-devtools/)。Firefox（[`developer.mozilla.org/en-US/docs/Tools/Debugger`](https://developer.mozilla.org/en-US/docs/Tools/Debugger)）、Safari（[`developer.apple.com/safari/tools/`](https://developer.apple.com/safari/tools/)）和\
  \ Edge（[`docs.microsoft.com/en-us/microsoft-edge/devtools-guide/debugger`](https://docs.microsoft.com/en-us/microsoft-edge/devtools-guide/debugger)）也有类似的页面。\n\
  \n为了调试脚本，我们将重点放在设置断点并使用 图 5.19 中高亮显示的工具逐步执行代码上。但首先，解释一些术语：\n\n*   ![图片](img/arrow.jpg)\
  \ **断点**——断点允许你指定希望停止 JavaScript 执行的位置。设置断点后，浏览器会在执行该行代码之前停止执行并进入调试器。这使你能够查看代码在该特定点的状态。通过单击代码列表中的行号来设置断点，再次单击行号可移除断点；断点由高亮显示的蓝色箭头图标指示。“断点”选项卡显示已设置的断点列表。你可以通过取消选中旁边的复选框来禁用断点。\n\
  \n*   ![图片](img/arrow.jpg) **单步跳过**——单击“单步跳过”图标时，代码前进一行。如果该行代码要执行另一个函数，则该函数会被执行，然后你会进入当前函数中的下一行代码。如果在单步跳过函数时遇到断点，浏览器会在脚本中的该位置停止执行。\n\
  \n*   ![图片](img/arrow.jpg) **单步进入**——单击“单步进入”图标时，代码前进一行。如果该行代码要执行另一个函数，你会进入该函数的第一行代码。\n\
  \n*   ![图片](img/arrow.jpg) **单步跳出**——单击“单步跳出”图标时，当前函数执行完毕，你会进入调用函数中的下一行代码。\n\n现在，让我们开始调试\
  \ 清单 5.3 中的脚本，看看为什么它无法将计数增加到 1 以上：\n\n1.  通过单击行号左侧，在第 10 行设置一个断点。应该会出现一个蓝色箭头，如 图\
  \ 5.20 所示。另请注意，最右侧窗格的“作用域变量”部分已打开。我们打开它是为了观察随着脚本向前执行，`count` 的值如何变化。毕竟，这个值就是问题所在，因为它在第一次点击后就没有变化。\n\
  \n    ![截图显示了断点的设置。在“来源”选项卡中，左侧的行号“10”被点击。数字 10 现在被一个类似箭头的符号包围。](img/05fig20.jpg)\n\
  \n    **图 5.20** 在脚本的第 10 行设置了一个断点。\n\n2.  现在单击网页上的按钮。你应该会看到网页正文中出现一个黄色箭头，表示脚本已在调试器中暂停，并且代码列表中的第\
  \ 10 行将被高亮显示。在脚本中，第 11 行是 `incCount()` 函数的第一行；`incCount()` 函数应该确定由变量 `count` 表示的计数器字符串的值。在“作用域变量”区域中，你应该会看到\
  \ `count` 的当前值为 `undefined`。\n\n3.  单击“单步跳过”图标。在“作用域变量”区域中，你应该会看到 `count` 的值变为 `0`，因为该值已被定义为起始数字\
  \ `0`。\n\n4.  再次单击“单步跳过”图标。现在 `count` 的值如预期变为 `1`，这是由 `count += 1;` 这一行改变的，该行表示“获取\
  \ `count` 的当前值并将其增加 1”。\n\n5.  单击“单步跳出”图标四次，以跳出此函数以及中间的 jQuery 函数。注意，网页上的值已变为 `1`。\n\
  \n6.  单击“继续”或“恢复”图标（脚本启动后，“暂停”图标将变为“继续”图标，在 Firefox 中则为“恢复”），以允许脚本完成执行。到目前为止，一切顺利。\n\
  \n7.  再次单击网页中的按钮。调试器应再次激活并停在步骤 2 中的相同位置。注意，`count` 的值再次变为 `undefined`，而常识（但不是我们的代码）告诉我们它应该是\
  \ `1`。\n\n8.  单击“单步跳过”图标；`count` 变为 `0`。再次单击“单步跳过”，`count` 变为 `1`。当按钮被点击时，`count`\
  \ 被重置为 `undefined`，然后设置为 `0`，再递增为 `1`。这不是期望的行为。\n\n9.  要解决此问题，请返回源代码并交换第 10 行和第\
  \ 11 行，以便在使用 `count` 的函数（`incCount()`）定义之前先定义 `count`。此更改将变量 `count` 的定义和赋值操作放在脚本加载时且函数定义之前，仅执行一次。\n\
  \n如果加载新调试过的文件，你会发现计数器按预期递增。如果断点没有自动移除，你可能需要手动移除。清单 5.4 显示了更正后的 JavaScript。\n\n**清单\
  \ 5.4** 更正后的脚本\n\n点击此处查看代码图片\n\n```\nvar count = 0;\n\nfunction incCount(){\n\n\
    count += 1;\n\n  return count;\n\n}\n\nfunction countIt(){\n\n  $(\"#counter\"\
  ).html(incCount);\n\n}\n```\n\n本节提供了一个基本示例，简单易懂，有助于你熟悉调试器的工作方式。请记住这些基本步骤：设置断点，并在逐步执行代码时观察变量。\n\
  \n### 总结\n\n在本课中，你学习了验证和调试 HTML、CSS 和 JavaScript 问题的各种方法。你学习了如何使用浏览器开发者工具中的检查器来查看浏览器在加载网页时渲染的\
  \ HTML 元素、CSS 样式和属性。此外，你还学习了在控制台中检查 JavaScript 语法错误的基础知识，以及设置断点并系统地逐步执行代码以调试更复杂的问题。\n\
  \n你在本课中学到的方法将对你完成本课程非常有帮助，更不用说在未来的项目中，因为它们将节省大量时间，并避免因简单的验证和语法错误（无论你经验多么丰富，这些错误似乎总是会潜入代码中）而带来的挫败感。\n\
  \n### 问答\n\n**问：我见过一些网页开头没有 `<!docty``p``e>` 标签，但它们看起来很正常。这是怎么做到的？**\n\n**答：** 如果你忘记包含\
  \ `<!doctype>` 标签，许多网页浏览器会原谅你，并通过自行猜测遵循哪个标准来显示页面。然而，最好还是包含正确的 `<!doctype>` 标签，这不仅是因为你希望页面成为符合最新网络标准的真正有效的\
  \ HTML 页面，还因为如果你不这样做，浏览器可能会应用一个不包含你在代码中使用的标签的默认标准，从而导致显示不正确。\n\n**问：开发者工具似乎功能非常丰富。我还能用这些工具调试什么？**\n\
  \n**答：** 你说得对：Chrome 开发者工具中有很多元素这里没有涵盖，其他主流浏览器对开发者工具的实现也有很多特性。通常，你可以使用开发者工具来调试存储在\
  \ cookie 中的值、脚本使用的外部资源的状态（是否找到/未找到、加载是否缓慢等）、页面及其脚本使用的内存量等。\n\n### 实践\n\n实践部分包含测验问题和练习，帮助你巩固对所学内容的理解。\n\
  \n### 测验\n\n\n\n\n## Quiz\n\n1. Using Chrome Developer Tools 中，如何查找文档中特定 `<div>`\
  \ 标签的 `background-color` CSS 属性的当前值？\n2. 使用调试器，如何停止代码在特定行执行？\n3. Chrome Developer\
  \ Tools 的哪个部分允许你在脚本单步执行时查看变量的值？\n4. 你可以使用 W3C 验证器验证哪些 Web 语言？\n5. 哪些浏览器拥有 Developer\
  \ Tools？\n6. 调试损坏的 HTML 代码的一种方法是什么？\n7. 什么时候使用 Developer Tools 的检查器（inspector）特别有用？\n\
  8. 在 CSS 检查器中更改样式值（或添加样式规则）时会发生什么？\n9. Web 页面调试器中的 `Step Over 命令的作用是什么？\n10. 如何在\
  \ Developer Tools 中设置断点？\n\n> **Note**: 提醒阅读印刷版或电子书版本的读者：如果您访问 `www.informit.com/register`\
