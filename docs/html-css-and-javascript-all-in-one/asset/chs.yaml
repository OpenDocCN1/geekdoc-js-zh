  \  ![Image](img/arrow.jpg) 如何使用 JavaScript 在页面内添加和修改文本\n\n上一节介绍了 JavaScript 编程的基本概念；本节将帮助你更好地理解文档对象模型，它是文档在浏览器中的结构化框架。\n\
  \n### 理解文档对象模型\n\n\n\n\nJavaScript 相比于纯 HTML 的一个优势是，客户端 JavaScript 脚本可以在内容加载后直接在浏览器中操作浏览器和文档（包括其内容）。你的脚本可以在浏览器中加载新页面、处理浏览器窗口和已加载文档的部分、打开新窗口，甚至可以修改页面内的文本——这一切都是动态完成的，无需向服务器发送额外的请求。\n\
  \n为了操作浏览器和文档，JavaScript 使用了 DOM 中的父对象和子对象的层级结构。这些对象被组织成树形结构，代表了网页文档的所有内容和组件，以及渲染它的浏览器。\n\
  \n### 注意\nDOM 并不是 JavaScript 或任何其他编程语言的一部分。相反，它是内置在浏览器中的应用程序接口（API）。\n\nDOM 中的对象具有描述网页浏览器或文档的\
  \ `properties`（属性）以及 `methods`（方法），方法是允许你操作网页浏览器或文档某部分的内置代码。你将在本节中学习更多关于这些属性和方法，并在整个过程中练习引用或使用它们。\n\
  \n在这些课程中你已经见过 DOM 对象表示法了，即使它没有被明确指出。当你引用 DOM 对象时，你使用父对象的名称，后跟子对象的名称或多个名称，并用点分隔。例如，如果你需要引用浏览器中加载的某个特定图像，这些是\
  \ `document` 对象的子对象。但该 `document` 对象反而是 DOM 的 `window` 对象的子对象。因此，要引用一个名为 `logo_image`\
  \ 的图像，DOM 对象表示法如下：\n\n```\nwindow.document.logo_image\n```\n\n### 使用 window 对象\n\
  浏览器对象层级结构的顶端是 `window` 对象，它代表一个浏览器窗口。你已经使用过 `window` 对象的至少一个方法 `alert`，它会在警报框中显示消息。\n\
  \n用户可能同时打开多个窗口，每个窗口都有自己独特的 `window` 对象，因为推测每个窗口加载的文档是不同的。即使同一个文档被加载到两个或多个窗口中，它们也会被视为不同的\
  \ `window` 对象，因为它们实际上是浏览器的不同实例。然而，当你在 JavaScript 中引用 `window.document`（或直接引用 `document`）时，该引用被解释为当前获得焦的窗口——正在正在使用的窗口。你将在第\
  \ 24 节“响应事件和使用窗口](ch24.xhtml)”中学习更多关于窗口的知识，包括如何引用失去焦点的窗口。\n\n`window` 对象是我们本节将查看的所有对象的父对象。图\
  \ 21.1 显示了 DOM 对象层级结构中的 `window` 部分及其各种对象。\n\n![图像显示了父子视图下 window 部分底部的几个对象。它们是\
  \ document、location、history 和 navigator。](img/21fig01.jpg)\n\n**图 21.1** DOM 对象层级结构中的\
  \ `window` 部分及其部分子对象。\n\n### 操作 document 对象\n正如其名所示，`document` 对象代表一个网页文档。网页文档显示在浏览器窗口中，所以当你发现\
  \ `document` 对象是 `window` 对象的子对象时不必感到意外。正如你在上一节中学到的，由于 `window` 对象始终代表当前窗口，你可以使用\
  \ `window.document` 来引用当前文档。你也可以直接引用 `document`，它会自动指向当前窗口。\n\n### 注意\n在之前的课程中，你已经使用过\
  \ `document.write` 方法在网页文档中显示文本。早些课程中的示例只使用单个窗口和文档，因此没有使用 `window.document.write`\
  \ 的必要，但这种长语法同样有效。\n\n在接下来的章节中，你将查看 `document` 对象的一些属性和方法，它们对你的脚本编写将非常有用。\n\n####\
  \ 获取文档信息\n`document` 对象的几个属性包含了关于当前文档的一般信息：\n\n*   ![图像](img/arrow.jpg) `document.URL`——指定文档的\
  \ URL。你（或你的代码）无法更改此属性的值。\n*   ![图像](img/arrow.jpg) `document.title`——引用当前页标题，由 HTML\
  \ `<title>` 标签定义。你可以更改此属性的值。\n*   ![图像](img/arrow.jpg) `document.referrer`——返回用户在访问当前页面之前所在的页面\
  \ URL——通常是带有当前页面链接的页面。与 `document.URL` 一样，你无法更改 `document.referrer` 的值。注意，如果用户直接访问某个\
  \ URL，`document.referrer` 将为空。\n*   ![图像](img/arrow.jpg) `document.lastModified`——指示文档最后修改的日期。该日期随页面一起从服务器发送。\n\
  *   ![图像](img/arrow.jpg) `document.cookie`——允许你读取或设置文档使用的 cookie。\n*   ![图像](img/arrow.jpg)\
  \ `document.images`——返回文档中使用的图像集合。\n\n作为文档属性的一个示例，列表 21.1 显示了一个短的 HTML 文档，它使用 JavaScript\
  \ 显示其最后修改日期。\n\n**列表 21.1** 显示最后修改日期\n\n点击此处查看代码\n```html\n<!doctype html>\n<html\
  \ lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>显示修改日期</title>\n  <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n</head>\n\
  <body>\n  <h1>显示修改日期</h1>\n  <p>此页面最后修改于：\n    <script>\n      document.write(document.lastModified);\n\
  \    </script>\n  </p>\n</body>\n</html>\n```\n\n图 21.2 显示了列表 21.1 的输出。\n\n![截图显示了浏览器屏幕上的修改日期。信息为：此页面最后修改于：04/06/2018\
  \ 18:05:06。](img/21fig02.jpg)\n\n**图 21.2** 查看文档的最后修改日期。\n\n如果你使用 JavaScript 显示此\
  \ `document` 属性的值，那么每次修改页面时不需要忘记更新日期，如果你选择向用户展示这些信息。（你也可以使用脚本打印当前日期而不是修改日期，但那是作弊。）\n\
  \n### 注意\n你可能会发现 `document.lastModified` 属性在你的网页上无效，或者返回错误的值。日期是从 Web 服务器接收的，某些服务器没有正确维护修改日期。\n\
  \n#### 在文档中写入文本\n简单的 `document` 对象方法也是你最常用的方法。事实上，在目前为止的课程中，你已经在基础示例中使用过其中一个。`document.write`\
  \ 方法将文本作为文档窗口的一部分打印。另一种语句 `document.writeln` 也可以打印文本，但它在末尾还包含一个换行符（`\\n`）。当你希望你的文本是源代码中该行的最后内容时，这非常有用。\n\
  \n### 注意\n请记住，浏览器会将换行符显示为空格，但不会在可见页面上显示它（`<pre>` 容器除外）。如果你要在浏览器中显示实际的换行，需要使用 `<br>`\
  \ 标签。\n\n你只能在网页的部在使用这些方法；对于已经加载的页面，你无法使用这些方法添加内容，除非你重新加载它。然而，你*可以*为文档编写新内容，正如下一节所解释的那样。\n\
  \n\n\n\n你还可以通过使用 DOM 的更高级功能直接修改网页的文本，你将在本节稍后学习到。\n\n`document.write` 方法可以在 HTML\
  \ 文档 `body` 区域内的 `<script>` 标签中使用。你也可以在函数中使用它，前提是你在文档正文中包含了对该函数的调用，如 代码列表 21.1 所示。\n\
  \n## 使用链接和锚点\n\n`document` 对象的另一个子对象是 `link` 对象。文档中可以存在、且很可能存在多个 `link` 对象。每个 `link`\
  \ 对象都包含有关指向另一个位置或指向锚点的链接的信息。\n\n你可以通过 `links` 数组访问 `link` 对象。数组中的每个成员都是当前页面中的其中一个\
  \ `link` 对象。`links` 数组的一个属性 `document.links.length` 表示页面中链接的数量。你可能会在脚本中使用 `document.links.length`\
  \ 属性，在执行其他任务（例如动态更改特定数量链接的显示）之前首先确定有多少个链接。\n\n每个 `link` 对象（或 `links` 数组的成员）都有一个属性列表，定义最终存储在对象中的\
  \ URL。`href` 属性包含整个 URL，其他属性定义了它的其他较小部分。链接使用的属性名称与本节稍后定义的 `location` 对象使用的属性名称相同，因此当你记住其中一组后，你也就知道了另外一组。\n\
  \n你可以通过指明链接的编号（或在数组中的位置）以及属性名称来引用某个属性。例如，以下语句将数组中存储的第一个链接的完整 URL 赋值给变量 `link1`：\n\
  \n```\nvar link1 = links[0].href;\n```\n\n`anchor` 对象也是 `document` 对象的子对象。每个 `anchor`\
  \ 对象代表当前文档中的一个锚点——一个可以直接跳转的特定位置。\n\n与链接一样，你可以使用数组来访问锚点。例如，使用一个名为 `anchors` 的数组，数组的每个元素都是一个\
  \ `anchor` 对象。`document.anchors.length` 属性给出 `anchors` 数组中元素的数量。利用 `anchors` 数组优势的一个示例是：使用\
  \ JavaScript 遍历给定页面上的所有锚点，在页面顶部动态生成一个目录。\n\n## 访问浏览器历史\n\n`history` 对象是 `window`\
  \ 对象的另一个子（属性）。该对象保存有关当前位置之前和之后访问过的位置（URL）的信息，并包含了前往上一个或下一个位置的方法。\n\n`history` 对象有一个你可以访问的属性：\n\
  \n- ![Image](img/arrow.jpg) `history.length`——跟踪历史列表的长度——换句话说，用户访问过的不同位置的数量。\n\n\
  `history` 对象有三个你可以使用的方法来在历史列表中移动：\n\n- ![Image](img/arrow.jpg) `history.go()`——从历史列表中打开\
  \ URL。要使用此方法，请在括号中指定一个正数或负数。例如，`history.go(-2)` 等同于双击“后退”按钮。\n- ![Image](img/arrow.jpg)\
  \ `history.back()`——加载历史列表中的上 URL。这等同于点击“后退”按钮或使用 `history.go(-1)`。\n- ![Image](img/arrow.jpg)\
  \ `history.forward()`——如果有，加载历史列表中的下一个 URL。这等同于点击“前进”按钮或使用 `history.go(1)`。\n\n\
  你可以使用 `history` 对象的 `back` 和 `forward` 方法为网页文档添加你自己的后退和前进按钮。浏览器已经有了后退和前进按钮。\n\n\n\
  \n\n尽管 `location.href` 属性通常与本节之前过的 `document.URL` 属性包含相同的 URL，但你无法更改 `document.URL`\
  \ 属性。请始终使用 `location.href` 在给定窗口中加载新页面。\n\n`location` 对象三个方法：\n\n*   ![Image](img/arrow.jpg)\
  \ `location.assign`—当如下所示使用时，会加载新文档：\n\n    点击此处代码图像\n\n    ```\n    location.assign(\"\
  https://www.google.com\")\n    ```\n\n*   ![Image](img/arrow.jpg) `location.reload`—重新加载当前文档。这与使用浏览器工具栏上的“刷新”按钮相同。如果在调用此方法时可选地包含\
  \ `true` 参数，脚本将忽略浏览器缓存并强制刷新，无论文档是否发生变化。\n\n*   ![Image](img/arrow.jpg) `location.replace`—用新位置替换当前位置。这类似于手动设置\
  \ `location` 对象的属性。区别在于 `replace` 方法不会影响浏览器的历史记录。换句话说，无法使用“后退”按钮回到上一个位置。这对于启动页或不需要返回的临时页面非常有用。记住，大多数人期望可以使用后退按钮，因此你应该谨慎使用\
  \ `location.replace` 方法。\n\n### 更多关于 DOM 结构的信息\n\n在本节之前的内容中，你学习了一些最重要的 DOM 对象是如何组织的：`window`\
  \ 对象是 `document` 对象的父级，以此此类推。尽管在年前 DOM 的最初设计中，这些是唯一的可用对象，但现代 DOM 为页面的每个元素都在 `document`\
  \ 对象下添加了对象。\n\n为了更好地理解每个元素对应一个 `document` 对象的概念，请查看列表 21.3 中的简单 HTML 文档。该文档包含通常的\
  \ `<head>` 和 `<body>` 部分，以及标题和一个段落。\n\n**列表 21.3** 简单的 HTML 文档\n\n点击此处代码图像\n\n```html\n\
  <!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n  \
  \  <title>A Simple HTML Document</title>\n    <meta name=\"viewport\"\n        \
  \  content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n    <h1>This\
  \ is a Level-1 Heading.</h1>\n    <p>This is a simple paragraph.</p>\n  </body>\n\
  </html>\n```\n\n与所有其他 HTML 文档一样，这个文档由各种容器及其内容组成。`<html>` 标签形成一个包含整个文档的容器，`<body>`\
  \ 标签包含页面的主体，以此此类推。\n\n在 DOM 中，页面中的每个容器及其内容都由一个对象表示。对象被组织成树形结构，`document` 对象本身位于树的根部，而标题和段落等单个元素位于树的叶节点。图\
  \ 21.4 显示了这些关系的图。\n\n接下来的章节将更详细地检查 DOM 的结构。\n\n![DOM 的结构。](img/21fig04.jpg)\n\n\
  **图 21.4** DOM 如何表示 HTML 文档。\n\n注意\n\n如果这种树形结构现在让你感到困惑，不要担心；只需理解你可以为元素分配 ID 并在你的\
  \ JavaScript 中引用它们即可。之后，你将看到更复杂的示例，利用你这些关于 DOM 中对象如何组织的新信息。\n\n### 节点 (Nodes)\n\n\
  文档中的每个容器或元素在 DOM 中被称为节点 (`node`）。在图 21.4 的示例中，框中的每个对象都是一个节点，线条表示节点之间的关系。\n\n你经常需要在脚本中引用单个节点。你可以通过分配\
  \ ID 或通过使用节点之间的关系在树中进行导航来执行此操作。随着这些课程的进行，你将对节点进行大量的练习。\n\n### 父节点和子节点\n\n正如你已经学过的，对象可以有一个\
  \ `parent`（父节点——包含它的对象），也可以有 `children`（子节点——它包含的对象）。DOM 在这方面与 JavaScript 使用相同的术语。\n\
  \n在图 21.4 中，`document` 对象是所示其他对象的父对象，它本身没有显式列出的父对象，尽管正如你之前学过的，`document` 对象是 `window`\
  \ 对象的子对象。`html` 对象是 `head` 和 `body` 对象的父对象，`h1` 和 `p` 对象是 `body` 对象的子对象。\n\n文本节点的工作方式有点不同。段落中的实际文本本身就是一个节点，它是\
  \ `p` 对象的节点，而不是 `p` 的孙节点。\n\n### 兄弟节点 (Siblings)\n\nDOM 使用另一个术语进行组织：`siblings`（兄弟节点）。在图\
  \ 21.4 中，`h1` 和 `p` 对象是 `body` 对象下的兄弟。\n\n### 操作 DOM 节点\n\n正如你所见，DOM 将页面中的对象组织成树形结构。每个节点（对象）都可以通过\
  \ JavaScript 访问。在接下来的章节中，你将学习如何使用属性和方法来管理它们。\n\n注意\n\n后续章节仅描述了浏览器支持的重要属性和方法。有关可用属性的完整列表，请参见\
  \ W3C 的 [w3.org/TR/DOM-Level-Core/](http://www.w3.org/TR/DOM-Level-Core/)。\n\n####\
  \ 基础节点属性\n\n之前，你使用节点的 `style` 属性来更改其样式。每个节点还有许多可以检查或设置的基础属性，包括以下：\n\n*   ![Image](img/arrow.jpg)\
  \ `nodeName`—节点的名称（不是 ID）。对于基于 HTML 标签的节点（如 `<p>` 或 `<body>`），名称为标签名：`p` 或 `body`。对于文档节点，名称为特殊代码：`#document`。同样，文本节点为\
  \ `#text`。这是一个只读值。\n\n*   ![Image](img/arrow.jpg) `nodeType`—描述节点类型的整数，例如 `1` 代表普通\
  \ HTML 标签，`3` 代表文本节点，`9` 代表文档节点。这是一个只读值。\n\n*   ![Image](img/arrow.jpg) `nodeValue`—文本节点中包含的实际文本。该属性对其他类型的节点返回\
  \ `null`。\n\n*   ![Image](img/arrow.jpg) `innerHTML`—任何节点的 HTML 内容。你可以将包含 HTML 标签的值赋值给此属性，并动态地更改节点的\
  \ DOM 子对象。\n\n注意\n\n`innerHTML` 属性并不是 W3C DOM 规范的一部分。然而，它被主流浏览器支持，使用它通常是更改页面内容最简单的方法。你也可以通过删除和创建节点以更标准的方式来实现，正如后文所述。如果你的网页必须\
  \ 100% 符合标准，那么你不应该使用 `innerHTML`，但在大多数情况下，使用它是它是完全没问题的。\n\n#### 节点关系属性\n\n除了之前描述的基础属性外，每个节点都有各种描述其与其他节点关系的属性。这些包括以下只读属性：\n\
  \n\n\n\n\n*   ![Image](img/arrow.jpg) `firstChild`—节点的第一个子节点对象。对于包含文本的节点（例如 `h1`\
  \ 或 `p`），包含实际文本的节点就是第一个子节点。\n*   ![Image](img/arrow.jpg) `lastChild`—节点的最后一个子节点对象。\n\
  *   ![Image](img/arrow.jpg) `childNodes`—包含节点所有子节点的数组。你可以对此数组进行循环，以处理给定节点下的所有节点。\n\
  *   ![Image](img/arrow.jpg) `previousSibling`—当前节点之前的兄弟节点（同一层级的节点）。\n*   ![Image](img/arrow.jpg)\
  \ `nextSibling`—当前节点之后的兄弟节点。\n\n## Caution\n\n请记住，与其他所有 JavaScript 对象和属性一样，这里描述的节点属性和函数是区分大小写的。请确保输入的类型与所示完全一致。\n\
  \n### 文档方法\n\n`document` 节点本身有几个你可能觉得有用的方法。你已经在练习中使用过其中一个（`getElementById`），通过它们的\
  \ ID 属性来引用 DOM 对象。`document` 节点的方法包括：\n\n*   ![Image](img/arrow.jpg) `getElementById(id)`—返回具有指定\
  \ `id` 属性的元素。\n*   ![Image](img/arrow.jpg) `getElementsByTagName(tag)`—返回所有具有指定标签名的元素数组。你可以使用通配符\
  \ `*` 返回一个包含文档中所有节点的数组。\n*   ![Image](img/arrow.jpg) `createTextNodeNode(text)`—创建一个包含指定文本的新文本节点，然后你可以将其添加到文档中。\n\
  *   ![Image](img/arrow.jpg) `createElement(tag)`—为指定的标签创建一个新的 HTML 元素。与 `createTextNode`\
  \ 类似，你需要在创建元素后将其添加到文档中。你可以通过更改其子对象或 `innerHTML` 属性为元素内部分配内容。\n\n### 节点方法\n\n页面中的每个节点都有许多可用的方法。哪些方法有效取决于节点在页面中的位置，以及它是否具有父节点或子节点。这些方法包括：\n\
  \n*   ![Image](img/arrow.jpg) `appendChild(new)`—将指定的新节点附加对象所有现有节点之后。\n*   ![Image](img/arrow.jpg)\
  \ `insertBefore(new, old)`—在指定的旧子节点（必须已存在）之前插入指定的新子节点。\n*   ![Image](img/arrow.jpg)\
  \ `replaceChild(new, old)`—用新节点替换指定的旧子节点。\n*   ![Image](img/arrow.jpg) `removeChild(node)`—从对象的子节点集合中移除一个子节点。\n\
  *   ![Image](img/arrow.jpg) `hasChildNodes`—如果对象具有一个或多个子节点，则返回布尔值 `true`；如果没有则返回\
  \ `false`。\n*   ![Image](img/arrow.jpg) `cloneNode`—创建现有节点的副本。如果提供了参数 `true`，则副本也将包含原始节点的任何子节点。\n\
  \n### 创建可定位元素（图层）\n\n现在你已经对 DOM 结构有了进一步的了解，你应该能够开始思考如何控制网页中的任何元素，例如段落或图像。例如，你可以使用\
  \ DOM 来更改元素的位置、可见性和其它属性。\n\n在 W3C DOM 和 CSS2 标准之前（记住，我们现在已经在使用 CSS3 了），你只能重新定位层，或者使用私有标签定义的特殊元素组。虽然你现在可以单独定位任何元素，但在许多情况下，对一组元素进行操作仍然有用。\n\
  \n你可以使用 `<div>` 容器元素（你在这些课程早期就学过的）来有效地创建一个图层，或者一组可以作为一个整体控制的 HTML 对象。\n\n要使用 `<div>`\
  \ 创建图层，将图层的内容封装在 `<div>` 和 `</div>` 标签之间，并在 `<div>` 标签的 `style` 属性中指定层的属性。这是一个简单的示例：\n\
  \n点击此处查看代码图像\n\n```html\n<div id=\"layer1\"style=\"position:absolute; left:100px;\
  \ top:100px;\">\n\n这是图层的内容。\n\n</div>\n```\n\n这段代码定义了一个名为 `layer1` 的层。这是一个移动层，位于浏览器窗口左上角向下\
  \ 100 像素、向右 100 像素的位置。\n\n## Note\n\n正如你在之前的课程中学习的那样，你可以在 `<style>` 块、外部样式表或 HTML\
  \ 标签的 `style` 属性中指定 CSS 属性（如 `position` 属性和其他图层属性），然后你可以使用 JavaScript 来控制这些属性。这里显示的代码片段使用\
  \ `style` 属性中的属性而不是 `<style>` 块，仅仅因为它是一个示例片段，而不是完整的代码列表。\n\n你已经在这些课程的 第二部分 中学习了定位属性，并在“实用网页设计的基础模块”以及\
  \ 第三部分 “使用 CSS 进行高级网页设计”中看到过它们的实际应用。这包括设置对象的大小（如 `height` 和 `width`）和位置（如 `absolute`\
  \ 或 `relative`）、对象的可见性以及对象的背景和边界。\n\n### 使用 JavaScript 控制\n\n`document` 节点本身有几个你可能觉得有用的方法。你已经在练习中使用过其中一个（`getElementById`），通过它们的\
  \ ID 属性来引用 DOM 对象。`document` 节点的方法包括：\n\n*   ![Image](img/arrow.jpg) `getElementById(id)`—返回具有指定\
  \ `id` 属性的元素。\n*   ![Image](img/arrow.jpg) `getElementsByTagName(tag)`—返回所有具有指定标签名的元素数组。你可以使用通配符\
  \ `*` 返回一个包含文档中所有节点的数组。\n*   ![Image](img/arrow.jpg) `createTextNodeNode(text)`—创建一个包含指定文本的新文本节点，然后你可以将其添加到文档中。\n\
  *   ![Image](img/arrow.jpg) `createElement(tag)`—为指定的标签创建一个新的 HTML 元素。与 `createTextNode`\
  \ 类似，你需要在创建元素后将其添加到文档中。你可以通过更改其子对象或 `innerHTML` 属性为元素内部分配内容。\n\n页面中的每个节点都有许多可用的方法。哪些方法有效取决于节点在页面中的位置，以及它是否具有父节点或子节点。这些方法包括：\n\
  \n*   ![Image](img/arrow.jpg) `appendChild(new)`—将指定的新节点附加对象所有现有节点之后。\n*   ![Image](img/arrow.jpg)\
  \ `insertBefore(new, old)`—在指定的旧子节点（必须已存在）之前插入指定的新子节点。\n*   ![Image](img/arrow.jpg)\
  \ `replaceChild(new, old)`—用新节点替换指定的旧子节点。\n*   ![Image](img/arrow.jpg) `removeChild(node)`—从对象的子节点集合中移除一个子节点。\n\
  *   ![Image](img/arrow.jpg) `hasChildNodes`—如果对象具有一个或多个子节点，则返回布尔值 `true`；如果没有则返回\
  \ `false`。\n*   ![Image](img/arrow.jpg) `cloneNode`—创建现有节点的副本。如果提供了参数 `true`，则副本也将包含原始节点的任何子节点。\n\
