  \ | `&quot;` | 引号 |\n| & | `&#38;` | `&amp;` | 和符号 |\n| < | `&#60;` | `&lt;` | 小于号\
  \ |\n| > | `&#62;` | `&gt;` | 大于号 |\n| ¢ | `&#162;` | `&cent;` | 分号 |\n| £ | `&#163;`\
