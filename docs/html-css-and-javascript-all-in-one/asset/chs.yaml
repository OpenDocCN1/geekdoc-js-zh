  \ `</script>` 标签结束。\n\n**5. c.** 由于安全问题，JavaScript 永远无法将数据写入远程服务器。\n\n**6. d.**\
  \ JavaScript 可以添加到正文、标签或单独的文件中。\n\n**7. b.** 使用 `<script src=\"filename.js\"></script>`\
  \ 这一行。\n\n**8. c.** `onclick` 属性及其值是点击事件处理程序。\n\n**9. a.** 它创建了一个名为 `now` 的变量，并将当前日期存储在其中。\n\
