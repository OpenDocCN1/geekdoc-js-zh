  \ 和 `none`。 |\n| **标签** | **功能** |\n| `<map>...</map>` | 定义由 `<img>` 的 `usemap=\"\
  ...\"` 引用的客户端图像映射。 |\n| `<area>` | 在图像映射内定义可点击链接。包含一个或多个 `<area>` 标签。 |\n| 属性/样式\
