  \n## 第 24 节\n\n## 响应事件和使用窗口\n\n**在本节中将学习：**\n\n*   ![Image](img/arrow.jpg) 事件处理器的工作\n\
  *   ![Image](img/arrow.jpg) 事件处理器与对象的关系\n*   ![Image](img/arrow.jpg) 如何创建事件处理器\n\
  *   ![Image](img/arrow.jpg) 如何检测鼠标和键盘操作\n*   ![Image](img/arrow.jpg) 如何使用 `onclick`\
  \  `<div>` 的外观\n*   ![Image](img/arrow.jpg) 如何使用 JavaScript 访问和使用 `window` 对象层次结构\n\
  *   ![Image](img/arrow.jpg) 使用超时延迟脚本操作\n*   ![Image](img/arrow.jpg) 如何显示警告、确认和提示\n\
  \n在你目前为止的 JavaScript 体验中，你编写的大部分脚本都是以冷静、有序的方式执行，安静而有条地从第一语句移动到最后一条。你在示例脚本中使用了一些事件处理器，你可能已经注意到事件处理器的名称为其含义提供了了线索。例如，`onclick`\
  \ 意味着“当点击发生时”。这一点就说明了在 HTML 中使用 JavaScript 事件处理器的相对容易和简单。\n\n\n\n\n\n# 课程介绍\n\n\
  在本节中，你将学习使用 JavaScript 支持的各种事件处理器。用户不再是按固定的顺序执行语句，而是通过调用事件处理器直接与你脚本的不同部分进行交互。在接下来的课程中，你编写的几乎每个脚本中都会用到事件处理器，而且事件处理器可能会在你将编写的大多数脚本中占据显着位置，特别是如果你想遵循最佳实践并使用非侵入式\
  \ JavaScript（unobtrusive JavaScript）时。\n\n在本节中，我们还将回到文档对象模型（DOM）的某些特定方面。你将更多地了解\
  \ DOM 中的一些结构性对象——浏览器窗口和对话框，以及 JavaScript 如何通过事件与它们进行交互。\n\n## 理解事件处理器\n\n正如你在第 20\
  \ 节“开始 JavaScript 编程”中所学的那样，JavaScript 程序并不一定按顺序执行。你还了解到 JavaScript 程序可以检测 `events`\
  \ 并对其做出反应。事件是在浏览器范围内发生的事情——例如，用户点击按钮、鼠标指针移动，或者网页从服务器加载完成（仅列举几个）。各种事件使你的脚本能够响应鼠标、键盘和其他情况。\n\
  \n事件是 JavaScript 用于使 Web 文档交互关键方法。\n\n你创建并用于检测和响应事件的脚本通常被称为 `event handler`（事件处理器）。事件处理器是\
  \ JavaScript 最强大的功能之一。幸运的是，它们也是最容易学习和使用的功能之一；通常，一个实用的事件处理器只需要一条语句。\n\n### 对象与事件\n\
  \n正如你在第 21 节“使用文档对象模型 (DOM)”中所学的那样，JavaScript 使用一组对象来存储关于网页各个部分的信息——按钮、链接、图像、窗口等。一个事件通常可以发生在多个地方（例如，用户可以点击页面上的任何一个链接），并且每个事件都与一个对象关联。\n\
  \n每个事件都有一个名称。例如，`onmouseover` 事件在鼠标指针移动到页面上的对象上时发生。当指针移动到特定链接上时，`onmouseover` 事件会被发送给该链接的事件处理器（如果它的话）。在接下来的几节中，你将更多地学习如何在自己的代码中创建和使用事件处理器。\n\
  \n### 创建事件处理器\n\n你不需要 `<script>` 标签来调用事件处理器。相反，你使用事件名称和代码作为单个 HTML 标签的属性来调用事件处理器。例如，这里有一个链接，当鼠标悬停在链接上时会调用一个事件处理器脚本：\n\
  \n点击查看代码图片\n\n```html\n<a href=\"http://www.google.com/\"\n   onmouseover=\"alert('You\
  \ moved over the link.');\">\n   这是一个链接。</a>\n```\n\n注意，这段代码片段是一个完整的 `<a>` 元素，尽管为了可读性，在这里它被分成了多行。在这个示例中，`onmouseover`\
  \ 属性指定了一个要调用的 JavaScript 语句——即当用户鼠标移动到链接上时显示的 alert 消息。\n\n#### 备注\n上一个示例使用单引号来包裹文本。这在事件处理器中是必要的，因为双引号被用于包裹事件处理器本身。你也可以使用单引号来包裹事件处理器，并在脚本语句内部使用双引号。只要不要使用相同类型的引号即可，因为那会导致\
  \ JavaScript 语法错误。\n\n你可以像像前面那样在响应事件时调用 JavaScript 语句，但如果你需要调用多条语句，使用函数会是一个好主意。只需在文档的其他地方或引用的文档中定义函数，然后将该函数作为事件处理器调用，如下：\n\
  \n点击查看代码图片\n\n```html\n<a href=\"#bottom\" onmouseover=\"doIt();\">将鼠标到此链接。</a>\n\
  ```\n\n此示例在用户鼠标移动到链接上时调用名为 `doIt()` 的函数。在这种情况下使用函数非常方便，因为你可以使用更长、更可读的 JavaScript\
  \ 程序作为事件处理器——你也可以在其他复用该函数，而无需重复其所有代码。\n\n#### 备注\n对于简单的事件处理器，如果你用分号将它们分开，可以使用两条语句。然而，在大多数情况下，使用函数执行多条语句更容易且更易于维护。\n\
  \n### 使用 JavaScript 定义事件处理器\n\n与其在每次想要调用时指定事件处理脚本，不如使用 JavaScript 将特定函数赋值为事件的默认事件处理器。这允许你根据条件设置事件处理器，开启或关闭它们，并动态地更改处理事件的函数。\n\
  \n#### 备注\n通过这种方式设置事件处理器，允许你使用外部 JavaScript 文件来定义函数并设置事件，从而使 JavaScript 代码与 HTML\
  \ 文件完全分离。\n\n要以这种方式定义事件处理器，首先定义一个函数，然后将该函数赋值为事件处理器。事件处理器存储为 `document` 对象或其他可以接收事件的对象的属性。例如，这些语句定义了一个名为\
  \ `mousealert` 的函数，然后将其赋值为当前文档中所有 `onmousedown` 实例的事件处理器：\n\n点击查看代码图片\n\n```javascript\n\
  function mousealert() {\n  alert(\"You clicked the mouse!\");\n}\ndocument.onmousedown\
  \ = mousealert;\n```\n\n你可以使用这种技术为特定元素设置事件处理器，但实现这一目标还需要额外的步骤：你必须先找到该对象。要做到这一点，使用\
  \ `getElementById` 函数。\n\n首先，在 HTML 中定义一个元素并指定 `id` 属性：\n\n点击查看代码图片\n\n```html\n\
  <a href=\"http://www.google.com/\" id=\"link1\"></a>\n```\n\n接下来，在 JavaScript 代码中找到对象并应用事件处理器：\n\
  \n点击查看代码图片\n\n```javascript\nvar link1_obj = document.getElementById(\"link1\");\n\
  link1_obj.onclick = myCustomFunction;\n```\n\n只要你定义了它并在 HTML 中通过唯一的 `id` 引用它，就可以对任何对象执行操作。使用这种技术，你可以轻松地为多个对象分配函数，而不会增加\
  \ HTML 代码。\n\n### 支持事件处理器\n\n如果你在点击元素时希望发生多件事怎么办？例如，假设你想在点击按钮时执行 `update` 和 `display`\
  \ 两个函数。很容易遇到语法错误或逻辑错误，导致赋值给同一事件的两个函数无法按预期工作。实现清晰分离执行的一种方案是定义一个调用这两个函数的函数：\n\n点击查看代码图片\n\
  \n```javascript\nfunction updateThenDisplay() {\n  update();\n  display();\n}\n\
  ```\n\n这并不总是理想的方法。例如，如果你正在使用两个第三方脚本，并且它们都想向页面添加 `onload` 事件，那么应该有一种方法可以同时添加这两个事件。W3C\
  \ DOM 标准为此目的定义了一个函数 `addEventListener`。该函数为特定的事件和对象定义了一个*监听器*，你可以添加需要数量的监听函数。\n\n\
  有很多可以监听的事件。以下是一些最常用的事件：\n\n- `focus`——当通过鼠标或键盘（Tab 键）获得焦点时\n- `blur`——当元素失去焦点时\n\
  \n\n\n\n\n*   ![Image](img/arrow.jpg) click—当元素被点击时\n*   ![Image](img/arrow.jpg)\
  \ dblclick—当元素被双击时\n*   ![Image](img/arrow.jpg) keydown—当键被按下时\n*   ![Image](img/arrow.jpg)\
  \ keyup—当键被释放时\n*   ![Image](img/arrow.jpg) keypress—当键被按下时，传递键值\n*   ![Image](img/arrow.jpg)\
  \ mouseover—当鼠标指针悬停在元素上时\n*   ![Image](img/arrow.jpg) mouseout—当鼠标指针从元素上移出时\n* \
  \  ![Image](img/arrow.jpg) mousemove—当鼠标移动时\n*   ![Image](img/arrow.jpg) mousedown—在元素上按下鼠标键时\n\
  *   ![Image](img/arrow.jpg) mouseup—在元素上松开鼠标键时\n*   ![Image](img/arrow.jpg) load—当元素完全加载时\n\
  \n还有许多其他可以监听的事件。你可以在 [`developer.mozilla.org/en-US/docs/Web/Events#Standard_events`](https://developer.mozilla.org/en-US/docs/Web/Events#Standard_events)\
  \ 了解更多信息。要监听某个事件，只需将事件监听器附加到你想监听的元素上。例如，当用户点击 `id` 为 `link1` 的链接时应用 `mousealert`\
  \ 函数，你可以编写如下代码：\n\n点击此处查看代码图片\n\n```\ndocument.getElementById(\"link1\").addEventListener(\"\
  click\", mousealert);\n```\n\n你也可以在完成任务后移除事件监听器：只需使用 `removeEventListener` 方法即可。与\
  \ `addEventListener` 方法一样，只需将其附加到你想要停止监听的元素上。\n\n### Note\n记住，你可以将事件监听器附加到 DOM 中的任何元素上，包括文档本身。当你编写\
  \ `document.addEventListener(\"click\", myFunction);` 时，你是在告诉浏览器每当有人点击文档任何地方时都运行\
  \ `myFunction` 函数。\n\n`addEventListener` 方法在现代浏览器中得到了良好支持，但如果你必须支持极旧版本的 Internet\
  \ Explorer，则必须使用不同的函数 `attachEvent` 来支持它们。在第 25  中的“JavaScript 最佳实践”中，你将创建一个结合这两个者的函数，用于编写跨浏览器事件添加脚本。\n\
  \n#### 使用 `event` 对象\n\n当事件发生时，你可能想或需要了解更多关于事件的信息，以便你的脚本执行不同的操作；例如，对于键盘事件，你可能想知道按了哪个键，特别是当你的脚本会根据按下的是\
  \ `j` 键还是 `l` 键执行不同操作时。DOM 包含一个 `event` 对象，它提供这种细粒度的信息。\n\n### Caution\n在使用 `addEventListener`\
  \ 时，不要在你的监听器上包含 `on` 前缀。相反只需使用事件本身。例如，使用 `click` 而不是 `onclick`。这是一个常见的错误，特别是当你习惯使用\
  \ HTML 属性而不是监听器时。\n\n要使用 `event` 对象，你可以将其传递给你的事件处理函数。例如，此语句定义了一个 `keypress` 事件，它会自动将\
  \ `event` 对象传递给 `getKey` 函数：\n\n点击此处查看代码图片\n\n```\ndocument.addEventListener(\"\
  keypress\", getKey);\n```\n\n然后你定义你的函数来接受事件作为参数：\n\n```\nfunction getKey(e) {\n\
  \    // 更多代码\n}\n```\n\n在现代浏览器中，`event` 对象会自动传递给事件处理函数。这就是为什么你不需要在函数中定义参数。\n\n###\
  \ Note\nInternet Explorer 8 及以下版本处理事件的方式不同。如果你必须支持这些旧版本，需要检查 `window` 对象中的事件属性。实现此点的一种方法是在你的函数内部检查属性是否存在。例如，你可以向函数添加一行代码\
  \ `if (!e) var e = window.event;`。\n\n以下是现代浏览器中 `event` 对象的一些常用属性：\n\n*   ![Image](img/arrow.jpg)\
  \ `event.modifiers`—一个标志位，指示在事件发生期间按下了哪些修饰键（Shift, Ctrl, Alt 等）。该值是一个结合了代表不同按键的二进制值的整数。\n\
  *   ![Image](img/arrow.jpg) `event.pageX`—事件在网页内的 x 坐标。\n*   ![Image](img/arrow.jpg)\
  \ `event.pageY`—事件在网页内的 y 坐标。\n*   ![Image](img/arrow.jpg) `event.which`—键盘事件的键码（Unicode）或鼠标事件中按下的按键值。\n\
  *   ![Image](img/arrow.jpg) `event.button`—按下的鼠标键。左键的值为 `0`，右键的值为 `2`。如果鼠标有中间键，值为\
  \ `1`。\n*   ![Image](img/arrow.jpg) `event.target`—发生事件的元素。\n\n### Note\n`event.pageX`\
  \ 和 `event.pageY` 属性基于事件发生元素的左上角。\n\n### 使用鼠标事件\nDOM 包含了许多用于检测鼠标移动和点击按钮的事件处理器。其中一些事件对你来说是熟悉的，因为你已经在之前的课程中见过它们。\n\
  \n#### Over 和 Out\n你已经见过第一个常用的事件处理器 `mouseover`，它在用户指针悬停在链接或其他对象上时被调用。注意 `mouseout`\
  \ 是相反的：它在用户指针移出对象边界时被调用。\n\n### Note\n`mouseover` 和 `mouseout` 事件处理器的一个常见用途是创建悬停效果——图像在鼠标移动到上方时发生变化。\n\
  \n#### Up 和 Down（以及 Click）\n你还可以使用事件来检测鼠标键何时被点击。此基本事件处理器是 `onclick`。当鼠标位于相应对象上点击时会调用该处理器。\n\
  \n例如，你可以使用以下事件处理器在链接被点击时显示警告：\n\n点击此处查看代码图片\n\n```html\n<a href=\"http://www.google.com/\"\
  \ onclick=\"alert('You are about to leave this site.');\">Go Away</a>\n```\n\n或者通过给链接\
  \ `id` `goAway` 并配合此脚本来实现非侵入式处理：\n\n点击此处查看代码图片\n\n```javascript\nfunction goAway(e)\
  \ {\n    alert('You are about to leave this site.');\n}\n\ndocument.getElementById(\"\
  goAway\").addEventListener(\"click\", goAway);\n```\n\n在这种情况下，`click` 事件处理器会在链接页面加载到浏览器之前调用\
  \ JavaScript `alert`。这对于使链接条件化或在引导用户离开之前显示免责声明非常有用。\n\n如果你的 `click` 事件处理器返回 `false`\
  \ 值，链接将不会被跟随。例如，以下是一个显示确认对话框的链接。如果你点击“取消”，链接将不会跟随；如果你点击“确定”，则会加载新页面：\n\n点击此处查看代码图片\n\
  \n```javascript\nfunction goAway(e) {\n    if (!confirm('Are you sure?')) {\n  \
  \      e.preventDefault();\n    }\n}\n\ndocument.getElementById(\"goAway\").addEventListener(\"\
  click\", goAway);\n```\n\n\n\n\n\n此示例使用了 `confirm` 方法来显示模态对话框。如果用户选择了“取消”，它就会向事件中添加\
  \ `preventDefault` 属性。这会阻止链接的跳转。\n\n`dblclick` 事件处理程序与此类似，但它仅在用户双击对象时使用。由于链接通常只需要点击一下，你可以通过这种方式让链接根据点击次数执行两个不同的操作。（不用说，这可能会让用户感到困惑，但在技术上*确实是*可行的。）你还可以检测对图像和其他对象的双击。\n\
  \n为了让你更灵活地控制按下鼠标键时发生的情况，还包含了另外两个事件：\n\n* ![Image](img/arrow.jpg) `mousedown`—当用户按下鼠标键时使用\n\
  * ![Image](img/arrow.jpg) `mouseup`—当用户松开鼠标键时使用\n\n这两个事件是鼠标点击的两个部分。如果你想检测整个点击过程，请使用\
  \ `click`，但你可以使用 `mouseup` 和 `mousedown` 来仅检测其中某一部分。\n\n要检测按下的是哪个鼠标键，可以使用 `event`\
  \ 对象的 `button` 属性。该属性对左键赋值为 `0`，对右键赋值为 `2`。此属性用于 `click`、`dblclick`、`mouseup` 和\
  \ `mousedown` 事件。\n\n### 注意事项\n\n浏览器通常不会检测右鼠标键的 `click` 或 `dblclick` 事件。如果你想检测右键，使用\
  \ `mousedown` 是最可靠的方法。\n\n作为这些事件处理程序的示例，你可以创建一个脚本，显示关于鼠标键事件的信息并确定按下的是哪个按键。列表 24.1\
  \ 显示了一个处理某些鼠标事件的脚本。\n\n**列表 24.1** 鼠标点击示例的 JavaScript 文件\n\n点击此处查看代码图像\n\n```\n\
  function mousestatus(e) {\n  if (!e) e = window.event;\n  btn = e.button;\n  switch(btn)\
  \ {\n    case 0:\n      whichone = \"Left\";\n      break;\n    case 1:\n      whichone\
  \ = \"Middle\";\n      break;\n    case 2:\n      whichone = \"Right\";\n      break;\n\
  \    default:\n      whichone = \"UNKNOWN\";\n  }\n  message=e.type + \" : \" +\
  \ whichone + \"<br>\";\n  document.getElementById('testarea').innerHTML += message;\n\
  \  e.preventDefault();\n}\n\nobj=document.getElementById('testlink');\nobj.addEventListener(\"\
  click\", mousestatus);\nobj.addEventListener(\"mousedown\", mousestatus);\nobj.addEventListener(\"\
  mouseup\", mousestatus);\nobj.addEventListener(\"dblclick\", mousestatus);\n```\n\
  \n该脚本包含一个检测鼠标事件的函数 `mouseStatus`。该函数使用 `event` 对象的 `button` 属性来确定按下的是哪个键。它还使用 `type`\
  \ 属性显示事件的类型，因为该函数将用于处理多种事件类型。\n\n在函数之后，脚本找到 `id` 属性为 `testlink` 的链接对象，并将它的 `mousedown`、`mouseup`、`click`\
  \ 和 `dblclick` 事件分配给 `mousestatus` 函数。`mousestatus` 函数使用 `switch` 语句判断点击的是左键、中键还是右键，然后将该信息写入\
  \ `testarea` `div` 中。\n\n将此脚本保存为 `click.js`。接下来，你需要一个 HTML 文档来配合脚本使用，这见列表 24.2。\n\
  \n**列表 24.2** 鼠标点击示例的 HTML 文件\n\n点击此处查看代码图像\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Mouse Click Test</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \  </head>\n  <body>\n    <h1>Mouse Click Test</h1>\n    <p>\n      点击下方的测试链接。一条消息将\n\
  \      指明你点击了哪个按键。\n    </p>\n    <h2><a href=\"#\"id=\"testlink\">Test</a></h2>\n\
  \    <div id=\"testarea\"></div>\n    <script src=\"click.js\"></script>\n  </body>\n\
  </html>\n```\n\n\n\n\n\n# 显示输入的字符\n\n```html\n<html lang=\"en\">\n  <head>\n   \
  \ <meta charset=\"utf-8\">\n    <title>显示按键输入</title>\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n    <h1>显示输入的字符</h1>\n\
  \    <p>\n      本文档包含一个简单的脚本，它可以将你输入的按键作为下方的新段落显示出来。输入几个键来尝试一下。\n    </p>\n    <p\
  \ id=\"keys\"></p>\n    <script>\n    function displayKey(e) {\n        // 哪个键被按下了？\n\
  \        var keycode=e.which;\n        character=String.fromCharCode(keycode);\n\
  \        // 找到目标段落的对象\n        var keys_paragraph = document.getElementById('keys');\n\
  \        // 将字符添加到段落中\n        keys_paragraph.innerHTML += character;\n    }\n \
  \   document.addEventListener(\"keypress\",displayKey);\n    </script>\n  </body>\n\
  </html>\n```\n\n当你加载这个示例时，你可以输入字符，然后观察你输入的字符出现在文档的某个段落中。图 24.2 显示了某些输入的结果，但你应该自己尝试一下以查看完整效果！\n\
  \n![截图显示了“显示按键输入”的输出，用户输入的键显示在底部。哇！这太酷了！它正随着我的打字实时显示字符。](img/24fig02.jpg)\n\n**图\
  \ 24.2** 显示所按按键的输出。\n\n## 使用 `load` 和 `unload` 事件\n\n另一个你可能经常使用的事件是 `load`。当当前页面（包括其所有图像）完成从服务器的加载时，就会触发此事件。\n\
  \n`load` 事件与 `window` 对象相关，要定义它，你需要在 `<body>` 标签中使用事件处理程序。例如，下面是一个 `<body>` 元素，它使用一个简单的事件处理程序在页面加载完成后显示警报：\n\
  \n点击此处查看代码图像\n\n```javascript\nwindow.addEventListener(\"load\", function() {\n\
  \  alert(\"Loading complete\");\n});\n```\n\n此事件处理程序使用一个*匿名函数*来显示警报。当函数的功能不需要长期使用，或者不需要在多个位置使用时，通常会使用匿名函数。\n\
  \n### 注意事项\n\n由于 `load` 事件在 HTML 文档完成加载并显示之后发生，因此你不应该在 `load` 事件处理程序中使用 `document.write`\
  \ 或 `document.open` 语句，因为它们会覆盖当前文档。\n\n图像也可以拥有 `load` 事件处理程序。当你为 `<img>` 元素定义一个\
  \ `load` 事件处理程序时，它会在指定的图像完全加载后立即被触发。\n\n你还可以为 `<body>` 元素指定一个 `unload` 事件。每当浏览器卸载当前文档时，该事件就会被触发——这发生在加载另一个页面或关闭浏览器窗口时。\n\
  \n## 使用 `click` 改变 `<div>` 的外观\n\n正如你已经在本节中学到的，`click` 事件可以用来调用各种操作。你可能将鼠标点击视为通过点击按钮提交表单的方式，但你也可以捕获此事件并用它为你的页面提供交互性。在接下来的示例中，你将看到如何使用\
  \ `click` 事件来显示或隐藏包含在 `<div>` 元素中的信息。\n\n在这种，你将通过允许用户点击一段文本来显示之前隐藏的信息，从而为网页添加交互性。我将其称为为*一段文本*，是因为严格来说，这段文字并不是链接。虽然对用户来说它看起来像链接且用起来也像链接，但它并不会在\
  \ `<a>` 标签内被标记。\n\n列表 24.4 提供了此示例的完整代码，我们稍后将进行介绍。\n\n**列表 24.4** 使用 `click` 显示或隐藏内容\n\
  \n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>Steptoe Butte</title>\n    <style>\n      a {\n\
  \        text-decoration: none;\n        font-weight: bold;\n      }\n      img\
  \ {\n        margin-right: 2px;\n        margin-bottom: 6px;\n        border: 1px\
  \ solid #00;\n      }\n      .mainimg {\n        float: left;\n        max-width:\
  \ 35%;\n        height: auto;\n      }\n      #eHide, #pH, #photos {\n        display:\
  \ none;\n      }\n      #eShow, #pShow {\n        display: block;\n      }\n   \
  \   #photos {\n        clear: both;\n      }\n      #photos img { max-width: 20%;\
  \ height: auto; clear: left; }\n      .fakelink {\n        cursor: pointer;\n  \
  \      text-decoration: none;\n        font-weight: bold;\n        color: #E0A3E;\n\
  \      }\n      section {\n        margin-bottom: 6px;\n      }\n    </style>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \  </head>\n  <body>\n    <header>\n      <h1>Steptoe Butte</h1>\n    </header>\n\
  \    <main>\n      <p>Steptoe Butte 是位于华盛顿州惠特曼县（Whitman County, Washington）的一个山丘。它是一座独特的石英丘（inselberg），由\
  \ 4.7 亿年前的沉积岩组成，与周围较年轻的页岩丘形成鲜明对比。</p>\n      <img src=\"images/steptoe-butte.jpg\"\
  \ class=\"mainimg\" alt=\"Steptoe Butte\">\n      <p><span class=\"fakelink\" id=\"\
  eShow\">点击此处显示信息</span></p>\n      <div id=\"eHide\">\n        <p>Steptoe Butte\
  \ 是华盛顿州立公园的一部分。</p>\n      </div>\n      <p id=\"pHide\" style=\"display:none;\"\
  >\n        <span class=\"fakelink\" id=\"pShow\">点击此处显示照片</span>\n      </p>\n \
  \     <div id=\"photos\" style=\"display:none;\">\n        <img src=\"images/sb-top1.jpg\"\
  \ alt=\"从 Steptoe Butte 俯瞰\">\n        <img src=\"images/sb-top2.jpg\" alt=\"从 Steptoe\
  \ Butte 俯瞰\">\n        <img src=\"images/sb-top3.jpg\" alt=\"从 Steptoe Butte 俯瞰\"\
  >\n      </div>\n    </main>\n    <footer>\n      <p><em>文本来自 <a href=\"http://en.wikipedia.org/wiki/Steptoe_Butte\"\
  >Wikipedia</a>，照片由 Julie C. Meloni 提供。</em></p>\n    </footer>\n  </body>\n</html>\n\
  ```\n\n\n\n\n\n```javascript\n  this.style.display = 'none';\n\n  document.getElementById(\"\
  pHide\").style.display='block';\n\n  document.getElementById(\"photos\").style.display='block';\n\
  \n});\n\ndocument.getElementById(\"pHide\").addEventListener(\"click\", function()\
  \ {\n\n  this.style.display = 'none';\n\n  document.getElementById(\"pShow\").style.display='block';\n\
  \n  document.getElementById(\"photos\").style.display='none';\n\n});\n\n    </script>\n\
  \n  </body\n\n</html\n```\n\n图 24.3 显示了这段代码在浏览器中的渲染情况。\n\n首先，查看样式表中的条目。第一个条目仅为被\
  \ `<a></a>` 标签对包围的链接设置样式；这些链接显示为不带下划线、粗体、蓝色链接。你可以在图 24.3 中的两段文本（以及页面底部的行）中看到这些普通链接。接下来的两个条目确保页面中使用的图像具有适当的边距；`<img>`\
  \ 元素的条目设置了一些边距和边框，而 `.mainimg` 类则允许你对页面上的主图像应用样式，但不对页面底部的三个图像生效。\n\n![截图显示了使用点击显示或隐藏内容时渲染的输出。](img/24fig03.jpg)\n\
  \n**图 24.3** 代码列表 24.4 的初始显示。虽然你在这里看不到它，但当鼠标指针悬停在按钮上时，鼠标指针会变成手形。\n\n下一个条目是针对特定 ID\
  \ 的，这些 ID 在页面初始加载时都被设置为不可 own（`display: none;`）。相比之下，随后的两个 ID 被设置为在页面初始加载时显示为块级元素（block）。同样，严格来说，这两个\
  \ ID 不必须定义为块级元素，因为这是默认的显示方式。然而，此样式表包含这些条目是为了说明这两组元素之间的差异。如果你计算代码列表 24.4 中 `<button>`\
  \ 元素的数量，你会发现代码中有四个：两个是不可见的，两个在页面加载时是可见的。还有两个 `<div>` 元素在页面加载时是不可见的：ID 为 `elevation`\
  \ 和 `photos` 的那些。\n\n此示例的目标是在点击另一个 ID 时更改两个 ID 的 `display` 值。在此之前，你必须确保用户意识到某段文本是可以点击的，这通常在用户看到他们的鼠标指针变化以反映存在链接时发生。尽管你无法在图\
  \ 24.3\n\n```html\n<button class=\"fakelink\" id=\"eShow\">\n\n  &raquo; Show Elevation\n\
  </button>\n```\n\n`fakelink` 类确保按钮被渲染为不带下划线、粗体且红色；`cursor: pointer;` 导致鼠标指针发生变化，使用户认为该文本是链接，类型类似于通常封装在\
  \ `<a>` 元素中的那种链接。\n\n但当我们与 `<button>` 关联 `click` 事件时，真正有趣的事情发生了。为了不具有侵入性，我们在元素上使用事件监听器来实现这一点，正如你在这段代码片段中所示：\n\
  \n点击此处查看代码图像\n\n```javascript\ndocument.getElementById(\"eShow\").addEventListener(\"\
  click\", function() {\n\n  this.style.display = 'none';\n\n  document.getElementById(\"\
  eHide\").style.display='block';\n\n  document.getElementById(\"elevation\").style.display='block';\n\
  \n});\n```\n\n在刚刚显示的示例片段中，当 `eShow` 元素上触发 `click` 事件时，函数会运行一系列命令来更改 CSS 元素的当前值。让我们分别查看它们：\n\
  \n点击此处查看代码图像\n\n```javascript\nthis.style.display = 'none';\n\ndocument.getElementById(\"\
  eHide\").style.display='block';\n\ndocument.getElementById(\"elevation\").style.display='block';\n\
  ```\n\n在片段的第一行中，`this` 关键字指向元素本身。换句话说，`this` 指向 ID 为 `eShow` 的 `<button>` 元素（实际上是任何元素）。关键字\
  \ `style` 指向 `style` 对象；`style` 对象包含了分配给元素的所有 CSS 样式。在这种情况下，我们最感兴趣的是 `display` 样式。因此，`this.style.display`\
  \ 意味着“`eShow` ID 的 `display` 样式”，当点击按钮时，我们将 `display` 样式的值设置为 `none`。\n\n但在 `click`\
  \ 事件内部还发生了三个动作。另外两个动作以 `document.getElementById()` 开始，并在括号中包含一个特定的 ID 名称。我们使用 `document.getElementById()`\
  \ 而不是 `this`，是因为第二个和第三个动作是针对非当前元素的。正如你所见，这些操作设置了非当前元素的 `display` 属性。当 `eShow` 元素触发\
  \ `click` 事件时：\n\n*   ![Image](img/arrow.jpg) `eShow` `<div>` 变为不可见。\n*   ![Image](img/arrow.jpg)\
  \ `eHide` `<div>` 变为可见并显示为块。\n*   ![Image](img/arrow.jpg) `elevation` `<div>` 变为可见并显示为块。\n\
  \n图 24.4 显示了这些操作的结果。\n\n![显示 Steptoe Butte 的截图，其中显示 按钮变成了 Hide Elevation，并在下方显示海拔详情。](img/24fig03.jpg)\n\
  \n**图 24.4** 当点击 Show Elevation 时，根据事件监听器中的命令，它和其他元素的可见性会发生变化。\n\n代码列表 24.4 中的另一组元素控制额外照片的可见性。这些元素不受元素事件的影响。也就是说，当你点击\
  \ Show Elevation 或 Hide Elevation 时，相关的 `<div>` 元素不会发生变化。你可以显示海拔而不显示照片（如图 24.4）。\n\
  \n**图 24.5 两个按钮都被点击后的状态**\n\n这个简短的示例向你展示了当你掌握了结合事件的 CSS 后，各种布局和交互的可能性。例如，你可以编写代码让用户更改样式表元素或更改整个样式表、将文本移动到布局的其他位置、进行测验或提交表单。\n\
  \n### 使用对象控制窗口\n\n在第 21 节中你学习了可以使用 DOM 对象表示浏览器窗口的当前 HTML 文档。你还学习了 `history`、`document`\
  \ 和 `location` 对象都是 `window` 对象的子级。\n\n现在让我们仔细查看 `window` 对象本身。正如你现在可能猜到的那样，这意味着我们正在处理浏览器窗口。\n\
  \n`window` 对象始终指向当前窗口（包含脚本的窗口）。`self` 关键字也是当前窗口的同义词。正如你在接下来的章节中将看到的，你可以同时在屏幕上打开多个窗口，并使用不同的名称引用这些窗口。\n\
  \n#### `window` 对象的属性\n\n\n\n\n\n虽然在浏览器会话中通常只有一个可用的 `window` 对象，但用户在浏览器会话中可能会有多个\
  \ `window` 对象，因为他们打开了多个标签页，或者某个网页打开了弹出窗口。正如你在第 21 节中所学到的，`document`、`history` 和\
  \ `location` 对象是 `window` 对象的属性（或子对象），每个打开的 `window` 对象都拥有这些属性用于脚本编写。除了这些属性外，每个\
  \ `window` 对象还有以下有用属性：\n\n*   ![Image](img/arrow.jpg) `window.closed`—指示窗口是否已关闭。这只有在你处理多个窗口时才有意义，因为当前窗口包含脚本，在不结束脚本的情况下是关闭的。\n\
  \n*   ![Image](img/arrow.jpg) `window.name`—为由脚本打开的窗口指定名称。\n\n*   ![Image](img/arrow.jpg)\
  \ `window.opener`—在脚本打开的新窗口中，提供包含打开该窗口的脚本的窗口引用。\n\n*   ![Image](img/arrow.jpg) `window.outerHeight`\
  \ 和 `window.outerWidth`—分别指定浏览器窗口外部的高度和宽度。\n\n*   ![Image](img/arrow.jpg) `window.screen`—提供一个子对象，用于存储窗口所在屏幕的信息——其分辨率、色彩深度等。\n\
  \n*   ![Image](img/arrow.jpg) `window.self`—作为当前 `window` 对象的同义词。\n\n### Note\n\n\
  `window.screen` 对象的属性包括 `height`、`width`、`availHeight` 和 `availWidth`（可用高度和宽度，而非总尺寸）、`colorDepth`（指示显示器的色彩支持：`8`\
  \ 表示 8 位色彩，`32` 表示 32 位色彩，依此类推）以及 `pixelDepth`（指示屏幕分辨率，单位为每像素比特）。\n\n你可以在 [`developer.mozilla.org/en-US/docs/Web/API/Window`](https://developer.mozilla.org/en-US/docs/Web/API/Window)\
  \ 找到窗口属性（及方法）的完整列表。\n\n### 创建新窗口\n\n`window` 对象最方便的用途之一是创建一个新窗口。你可以这样做显示一个新文档——例如弹出式广告或游戏说明——而不必清除当前窗口。你也可以为特定目的创建窗口，例如导航窗口。\n\
  \n你可以使用 `window.open` 方法创建一个新的浏览器窗口。打开新窗口的典型语句如下：\n\n点击此处查看代码图片\n\n```\nmyNewWindow=window.open(\"\
  *URL*\", \"WindowName\", \"*LIST_OF_FEATURES*\");\n```\n\n以下是该语法结构中 `window.open`\
  \ 语句的组件：\n\n*   ![Image](img/arrow.jpg) 变量 `myNewWindow` 用于存储新的 `window` 对象。你可以通过此名称访问该新对象的方法和属性。\n\
  \n*   ![Image](img/arrow.jpg) `window.open` 方法的第一个参数是 URL，它将被加载到新窗口中。如果 `URL` 留空，则不会加载任何网页。在这种情况下，你可以使用\
  \ JavaScript 为窗口填充内容。\n\n*   ![Image](img/arrow.jpg) 第二个参数 `WindowName` 指定窗口名称。它被赋值给\
  \ `window` 对象的 `name` 属性，并用于引用该窗口。\n\n*   ![Image](img/arrow.jpg) 第三个参数 `LIST_OF_FEATURES`\
  \ 是一个可选特性列表，用逗号分隔。你可以通过选择是否包含工具栏、状态栏和其他特性来定制新窗口。这使你能够创建各种“悬浮”窗口，这些窗口看起来可能与典型的浏览器窗口完全不同。\n\
  \n`window.open()` 方法第三个参数中的可用特性包括 `width` 和 `height`，用于以像素为设置窗口大小；`left` 和 `top`，用于设置新窗口距离用户桌面左侧和顶部的像素距离；以及若干个可以设置为\
  \ `yes`（`1`）或 `no`（`0`）的功能：`toolbar`、`location`、`status`、`menubar`、`personalbar`、`scrollbars`\
  \ 和 `resizable` 等。你只需要列出你想要使用的特性。\n\n此示例创建了一个没有工具栏或状态栏的小窗口：\n\n点击此处查看代码图片\n\n```\n\
  newSmallWin = window.open(\"\",\"small\",\"width=300,height=220,toolbar=0,status=0\"\
  );\n```\n\n### 打开和关闭窗口\n\n当然，如果你可以打开窗口，你也可以使用 JavaScript 关闭窗口。`window.close` 方法用于关闭窗口。浏览器通常不允许在没有用户许可的情况下关闭主浏览器窗口；该方法的主要目的是关闭你创建的窗口。例如，此语句可以关闭一个名为\
  \ `updateWindow` 的窗口：\n\n```\nupdateWindow.close();\n```\n\n作为另一个示例，列表 24.5 显示了一个\
  \ HTML 文档，允许你通过点击按钮打开一个新的小窗口。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <title>创建新窗口</title>\n</head>\n<body>\n    <h1>创建新窗口</h1>\n\
  \    <p>使用下方的按钮使用 JavaScript 打开和关闭窗口。</p>\n    <button id=\"openNew\">打开新窗口</button>\n\
  \    <button id=\"closeNew\">关闭新窗口</button>\n    <button id=\"closeSelf\">关闭主窗口</button>\n\
  \    <script>\n        document.getElementById(\"openNew\").addEventListener(\"\
  click\", function() {\n            newWin = window.open(\"\", \"NewWin\", \"toolbar=no,status=no,width=200,height=100\"\
  );\n        });\n        document.getElementById(\"closeNew\").addEventListener(\"\
  click\", function() {\n            newWin.close();\n        });\n        document.getElementById(\"\
  closeSelf\").addEventListener(\"click\", function() {\n            window.self.close();\n\
  \        });\n    </script>\n</body>\n</html>\n```\n\n此示例通过为每个按钮提供不同的监听器来完成工作。图\
  \ 24.6 显示了点击“打开新窗口”按钮的结果：它在主浏览器窗口上方打开了一个小窗口。\n\n![截图说明了通过另一个窗口打开新浏览器窗口的操作。](img/24fig06.jpg)\n\
  \n**图 24.6** 使用 JavaScript 打开的新浏览器窗口。\n\n然而，请注意 图 24.7 中 JavaScript 控制台中显示的错误消息。在尝试关闭主浏览器窗口后会出现此错误消息。正如你所看到的，现代网络浏览器不允许\
  \ JavaScript 关闭整个浏览器窗口，因为该窗口最初并非由 JavaScript 打开。\n\n![带有示例错误消息的浏览器截图。](img/24fig07.jpg)\n\
  \n**图 24.7** 当 JavaScript 尝试关闭它未打开的窗口时，控制台相应显示了错误。\n\n### 移动和调整窗口大小\n\nDOM 允许你移动或调整由脚本创建的窗口。你可以通过对\
  \ `window` 对象使用以下方法来实现：\n\n*   ![Image](img/arrow.jpg) `window.moveTo(x, y)`—将窗口移动到新位置。参数指定\
  \ `x`（列）和 `y`（行）位置。\n\n\n\n\n\n*   ![Image](img/arrow.jpg) `window.moveBy(numX,\
  \ numY)`—相对于当前位置移动窗口，移动 `numX` 或 `numY` 像素。`numX` 和 `numY` 参数可以是正数也可以是负数，并加到当前值上以到达新位置。\n\
  *   ![Image](img/arrow.jpg) `window.resizeTo(width, height)`—将窗口调整为作为参数指定的宽度和高度。\n\
  *   ![Image](img/arrow.jpg) `window.resizeBy(numX, numY)`—相对于当前大小调整窗口大小，移动 `numX`\
  \ 或 `numY` 像素。这些参数用于修改当前的宽度和高度。\n\n例如，列表 24.6 显示了一个 HTML 文档，其中包含一个简单的脚本，该脚本允许你根据表单中输入的值对创建的新窗口进行调整大小和移动。\n\
  \n**列表 24.6** 移动和调整新窗口\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Moving and Resizing Windows</title>\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
  \  </head>\n  <body>\n    <h1>Moving and Resizing Windows</h1>\n    <form name=\"\
  changeform\">\n      <p>\n        <strong>Resize to:</strong> <br>\n        <input\
  \ size=\"5\" type=\"text\" name=\"w\"> pixels wide and\n        <input size=\"5\"\
  \ type=\"text\" name=\"h\"> pixels high\n      </p>\n      <p><strong>-- AND/OR\
  \ --</strong></p>\n      <p>\n        <strong>Move to:</strong> <br>\n        X-position:\
  \ <input size=\"5\" type=\"text\" name=\"x\">\n        Y-position: <input size=\"\
  5\" type=\"text\" name=\"y\">\n      </p>\n      <p><input type=\"button\" value=\"\
  Change Window\" id=\"doIt\"></p>\n    </form>\n    <script>\n      function doIt()\
  \ {\n        if ((document.changeform.w.value) &&\n            (document.changeform.h.value))\
  \ {\n          NewWin.resizeTo(document.changeform.w.value,\n                  \
  \        document.changeform.h.value);\n        }\n        if ((document.changeform.x.value)\
  \ &&\n            (document.changeform.y.value)) {\n          NewWin.moveTo(document.changeform.x.value,\n\
  \                          document.changeform.y.value);\n        }\n      }\n \
  \     window.addEventListener(\"load\", function() {\n        NewWin=window.open('','NewWin',\
  \ 'width=200,height=100');\n      });\n      document.getElementById(\"doIt\").addEventListener(\"\
  click\", doIt);\n    </script>\n  </body>\n</html>\n```\n\n在这个示例中，当你点击 Change 按钮时，`doIt`\
  \ 函数作为事件处理程序被调用。该函数检查你是否指定了宽度和高度。如果你指定了，该函数将使用 `self.resizeTo` 方法调整当前窗口的大小。同样，如果你指定了\
  \ x 和 y 值，它将使用 `NewWin.moveTo` 移动窗口。如果你设置了这两对值，脚本将同时调整窗口大小并移动窗口。在网络浏览器中加载这段代码并尝试一下吧！\n\
  \n### 使用超时（Timeouts）\n\n有时，让脚本执行最困难的事情是完全什么都不做——针对一段特定的时间。幸运的是，JavaScript 包含一个内置函数来执行这种“什么都不做”，这也被称为“睡眠”（sleeping）。`window.setTimeout`\
  \ 方法允许你指定一个时间延迟和一个在延迟后执行的命令。\n\n超时不会让浏览器停止正在执行的操作。虽然你在 `setTimeout` 方法中指定的语句在延迟通过之前不会执行，但浏览器会在等待期间继续执行其他事情（例如，处理其他处理程序并加载外部内容）。\n\
  \n你通过调用 `setTimeout` 方法开始超时，该方法有两个参数。第一个是包含在引号内的 JavaScript 语句或一组语句。第二个参数是等待的时间，以毫秒（秒的千分之一）为单位。例如，以下语句将在\
  \ 10 秒后显示警报框：\n\n点击此处查看代码图像\n\n```javascript\ntimeoutID=window.setTimeout(\"Time's\
  \ up!\",10000);\n```\n\n像事件处理程序一样，超时在引号内使用 JavaScript 语句。确保在每个字符串的每一侧都使用单引号，如之前的代码所示。一个变量（在此示例中为\
  \ `timeoutID`）存储了超时的标识符。这允许你设置多个超时，每个超时都有自己的标识符。在超时结束之前，你可以通过 `clearTimeout` 方法并指定要停止的超时的标识符来停止：\n\
  \n点击此处查看代码图像\n\n```javascript\nwindow.clearTimeout(timeoutID);\n```\n\n通常，超时只会发生一次，因为你在\
  \ `setTimeout` 语句中指定的语句只执行一次。但很多时候，你希望 `setTimeout` 语句中指定的语句重复执行。例如，你可能希望一个计时器每秒更新一次。你可以通过在\
  \ `setTimeout` 内部再次调用 `setTimeout` 来实现这一点。列表 24.7 显示了一个具有超时的 HTML 文档。\n\n**列表 24.7**\
  \ 每秒更新计时器\n\n点击此处查看代码图像\n\n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <title>Timeout Example</title>\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n\
  \    <h1>Timeout Example</h1>\n    <p>The counter will update every second.</p>\n\
  \    <p id=\"counter\">0</p>\n    <button type=\"button\" id=\"restart\">Restart</button>\n\
  \    <button type=\"button\" id=\"stop\">Stop</button>\n    <script>\n      var\
  \ counter = 0;\n      var timeoutID;\n      function update() {\n        counter++;\n\
  \        document.getElementById(\"counter\").innerHTML = counter;\n        timeoutID\
  \ = window.setTimeout(update, 1000);\n      }\n      timeoutID = window.setTimeout(update,\
  \ 1000);\n      document.getElementById(\"restart\").addEventListener(\"click\"\
  , function() {\n        counter = 0;\n        update();\n      });\n      document.getElementById(\"\
  stop\").addEventListener(\"click\", function() {\n        window.clearTimeout(timeoutID);\n\
  \      });\n    </script>\n  </body>\n</html>\n```\n\n在这个示例中，`update` 函数在页面加载后 1\
  \ 秒开始被调用。该函数将 `counter` 增加 1，并更新 ID 为 `counter` 的元素的内部 HTML。然后，它通过 `window.setTimeout(update,\
  \ 1000)` 再次调用 `update`，从而实现循环。点击 Restart 按钮会将 `counter` 重置为 0 并调用 `update` 函数。点击\
  \ Stop 按钮将停止计时。\n\n\n\n\n\n![超时示例的输出截图](img/24fig08.jpg)\n\n**图 24.8** 超时示例在运行一段时间后的输出。\n\
  \n### 显示对话框\n\n`window` 对象包含了三个用于显示消息和与用户交互的方法。你已经在一些脚本中使用过它们了。以下是简单总结：\n\n*   ![Image](img/arrow.jpg)\
  \ `window.alert(message)`——显示一个警报对话框。该对话框仅向用户显示一条消息。\n*   ![Image](img/arrow.jpg)\
  \ `window.confirm(message)`——显示一个确认对话框，该框内显示一条消息并包含“确定”和“取消”按钮。如果点击“确定”，该方法返回 `true`；如果点击“取消”，则返回\
  \ `false`。\n*   ![Image](img/arrow.jpg) `window.prompt(message,default)`——显示一条消息并提示用户输入。它返回用户输入的文本。如果用户没有输入任何内容，则使用默认值。\n\
  \n在使用 `confirm` 和 `prompt` 方法时，你应该使用一个变量来接收用户的响应。例如，此语句会显示一个提示框并将用户输入的文本存储在 `text`\
  \ 变量中：\n\n点击此处查看代码图片\n\n```javascript\ntext = window.prompt(\"Enter some text\"\
  ,\"Default value\");\n```\n\n### 注意\n\n在引用这些方法时，通常可以省略对 `window` 对象的式引用，因为它是脚本的默认上下文。例如，你可以使用\
  \ `alert(\"text\")` 代替 `window.alert(\"text\")`。\n\n为了进一步说明这类对话框，列表 24.8 显示了一个包含按钮和事件处理程序的\
  \ HTML 文档，允许你测试对话框。\n\n**列表 24.8** 一个使用 JavaScript 显示警报、确认和提示的 HTML 文档\n\n点击此处查看代码图片\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Alerts, Confirmations, and Prompts</title>\n    <meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1\">\n  </head>\n  <body>\n    <h1>Alerts,\
  \ Confirmations, and Prompts</h1>\n    <p>Use the buttons below to test dialogs\
  \ in JavaScript.</p>\n    <button type=\"button\" id=\"alert\">Display an Alert</button>\n\
  \    <button type=\"button\" id=\"confirm\">Display a Confirmation</button>\n  \
  \  <button type=\"button\" id=\"prompt\">Display a Prompt</button>\n    <script>\n\
  \      document.getElementById(\"alert\").addEventListener(\"click\", function()\
  \ {\n        alertVal = window.alert(\"This is a test alert.\");\n      });\n  \
  \    document.getElementById(\"confirm\").addEventListener(\"click\", function()\
  \ {\n        confirmVal = window.confirm(\"Would you like to confirm?\");\n    \
  \  });\n      document.getElementById(\"prompt\").addEventListener(\"click\", function()\
  \ {\n        promptVal = window.prompt(\"Enter some text\",\"Default value\");\n\
  \      });\n    </script>\n  </body>\n</html>\n```\n\n### 总结\n\n在本章中，你学习了如何使用 `window`\
  \ 对象来显示对话框。你还学习了如何使用 `alert`、`confirm` 和 `prompt` 与用户交互。最后，你学习了如何使用 `setTimeout`\
  \ 和 `setInterval` 来处理异步任务。\n\n\n\n\n\n1. 在延迟后执行 `JavaScript` 语句。\n2. 在指定的时间内锁定浏览器。\n\
  3. 设置浏览器自动退出之前的时间。\n\n**6.** 判断对或错：JavaScript 可以控制并调整浏览器窗口的大小，即使该窗口不是由脚本打开的。\n\n\
  1. 正确\n2. 错误\n\n**7.** 什么是匿名函数？\n\n1. 一种只有在其他函数无法运行时才运行的函数。\n2. 一个没有名称且被用作默认值的函数。\n\
  3. 一个替代其他函数的函数。\n4. 一个没有名称且除了定义它的那个位置外，不需要在任何其他地方被重用或调用的函数。\n\n**8.** 你如何编写一个在用户离开页面时触发的事件？\n\
  \n1. `window.addListener(\"unload\", function() { });`\n2. `window.addEvent(\"unload\"\
  , function() { });`\n3. `window.addEventListener(\"unload\", function() { });`\n\
  4. `window.addEventListener(\"leave\", function() { });`\n\n**9.** `resizeBy` 方法的作用是什么？它使用了哪些参数？\n\
