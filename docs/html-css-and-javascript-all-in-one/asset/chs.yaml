  \ Answers\n\n1. 点击 `Elements` 选项卡打开 `Elements` 面板，然后选择您感兴趣的特定 `<div>`。当前样式值将出现在最右侧的面板中。\n\
  2. 您可以通过设置断点来停止脚本在特定行的执行。大多数调试工具都支持此功能，并非 Chrome Developer Tools 特有。\n3. `Sources`\
  \ 面板的 `Scope Variables` 部分允许您查看脚本中使用的变量值。\n4. 本课提到了 W3C 的 `HTML` 验证器和 `CSS` 验证器。W3C\
  \ 还提供其他验证服务，如链接检查、RSS 和 Atom 馈送检查，甚至移动内容检查。\n5. 几乎所有现代桌面浏览器都内置了某种形式的 Developer Tools。本课提到了\
  \ Chrome、Firefox、Safari 和 Internet Explorer 中的工具。Edge 和 Opera 中也有开发者工具。\n6. 您可以使用\
  \ `HTML` 验证器查找错误，或使用浏览器的 Developer Tools 查看代码。或者您可以逐行检查 `HTML`。\n7. 当您处理的 JavaScript\
  \ 会修改 HTML 原始状态之外的 CSS 时，Developer Tools 中的检查器特别有用。\n8. 网页将发生变化以反映新的 CSS 规则，但该规则不会应用于当前页面之外。如果您不将更改添加到\
  \ CSS 文件中，它们将不会永久应用于网页。\n9. `Step Over` 命令使 JavaScript 代码前进一行。\n10. 要设置断点，请点击您想要设置断点的行号。该行随后会出现一个蓝色箭头并设置断点。要关闭它，再次点击行号。要临时禁用它，取消勾选\
  \ `Breakpoints` 选项卡中断点旁边的复选框。\n\n### Exercises\n\n* 继续调试 `Listing 5.2` 直到元素排列方式令您满意。由于您尚未明确学习这些技能，我们给您一个提示：尝试修改\
  \ CSS 中的 `widths` 值和 `padding` 值。\n* 使用 Console 日志在脚本的不同位置输出特定字符串。您可以通过在 JavaScript\
