    ```\n\nSave this file in your project's lib directory as views.js.\n\nThe first\
    \ view is the by_author view—this will let us find books by a particular author.\
    \ Its map() function emits a key for each author of each document that has an\
    \ authors array (that is, each book we've imported). We have to check whether\
    \ the document has an authors key in case the database has any documents that\
    \ aren't books.\n\nThe second view is by_subject. For each subject in the subjects\
    \ array, we emit the whole subject as well as each part (separated by two dashes).\
    \ For example, say a book has the subject \"Assassins – Drama\". The by_subject\
    \ mapper would emit \"Assassins – Drama\", \"Assassins\", and \"Drama\". This\
    \ lets us find books by full or partial subject.\n\nBoth views' map functions\
    \ have been encoded as strings so we can put them into CouchDB, since it allows\
    \ only JSON documents (and true functions are not allowed in JSON). The reduce\
