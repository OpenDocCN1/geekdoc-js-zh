    \ find out how many books are available by a particular author, or in a particular\
    \ subject.\n\nNow let's get these views into the database.\n\n# Callback Chaining\
    \ with async.waterfall\n\nCouchDB stores views in special documents called design\
    \ documents. You use regular REST commands to add and remove design documents,\
    \ just like you would use any other document. So we need to PUT in CouchDB a design\
    \ document that contains our views.\n\nLet's write a script that creates or updates\
