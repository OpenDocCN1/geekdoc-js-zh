  md: "```\nweb-app/b4/static/app.js\nBundles = function() {\n  $.ajax({\n    url:\
    \ '/api/user/bundles'\n  }).then(function(data, status, xhr) {\n    bundles =\
    \ data;\n    showBundles();\n  }, function(xhr, status, err) {\n    if (xhr.status\
    \ >= 500) {\n      showErr(xhr, status, err);\n    }\n    bundles = {};\n    showBundles();\n\
    \  });\n});\n```\n\nHere we use the $.ajax function to pull down /api/user/bundles.\
    \ If the request succeeds, we use the value returned; otherwise we start with\
    \ an empty object {{}}. If the request fails with a status code in the 500 range\
    \ (like 502 Bad Gateway), then we show the error using the showErr function().\
    \ In either case, we move on showBundles(). Going the other direction, we have\
    \ a saveBundles function that saves the bundles on the server:\n\n```\nweb-app/b4/static/app.js\n\
    saveBundles = function(bundles, callback) {\n  $.ajax({\n    type: 'POST',\n \
    \   url: '/api/user/bundles',\n    data: JSON.stringify(bundles),\n    contentType:\
    \ 'application/json; charset=utf-8',\n    accepts: 'application/json'\n  }).then(function(data,\
    \ status, xhr) {\n    callback(null, data);\n  }, function(xhr, status, err) {\n\
    \    callback(err);\n  });\n});\n```\n\nThis function takes a bundles object to\
    \ push, and a ajax-style callback function that will be called on success or failure.\
    \ It uses $.ajax() to PUT the bundles object up to /api/user/bundles. The contentType\
    \ indicates that the data is already pre-serialized as JSON and does not require\
    \ encoding.\n\nThat covers the client-side code for interacting with the user\
    \ APIs we developed this chapter. The b4 app contains similar code for using the\
    \ APIs we developed in previous chapters—like the book-search and bundle-modification\
    \ APIs. Now let's produce a user interface for our data."
