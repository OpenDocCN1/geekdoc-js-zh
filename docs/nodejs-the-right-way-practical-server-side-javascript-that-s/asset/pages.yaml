  md: 'Chapter 4. Robust Messaging Services • 62


    Whenever your Node program opens a file or a TCP connection, it uses one of its
    available file descriptors. When there are none left, Node will start failing
    to connect to resources when asked. This is an extremely common problem for Node.js
    developers. I have yet to meet a Node developer who hasn''t struggled with the
    limited-resource problem at one time or another.


    Strictly speaking, this problem isn''t limited to the PUSH/PULL scenario, but
    it''s very likely to happen there, and here''s why. Since Node.js is asynchronous,
    the puller process can start working on many jobs simultaneously. Every time a
    message event comes in, the Node process invokes the handler and starts working
    on the job. If these jobs require accessing system resources—and they almost certainly
    will—likely to exhaust the pool of available file descriptors. Then jobs will
    quickly start failing.


    We''ll explore this topic and its solutions in more detail in Chapter 5, Accessing
    Databases, on page 65, when we limit the number of concurrent database connections
    through a technique called connection pooling.


