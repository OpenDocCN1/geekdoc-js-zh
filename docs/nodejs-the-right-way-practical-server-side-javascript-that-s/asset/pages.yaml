  md: '# Wrangling the File System


    As a programmer, chances are you''ve had to access a file system at some point:
    reading files, writing files, renaming and deleting files. We''ll start our Node.js
    journey in this familiar area, useful, asynchronous file utilities. Along the
    way we''ll explore the following aspects of Node development.


    # Architecture and Core


    On the architecture front, you''ll see how the event loop shapes a program''s
    flow. We''ll use buffers for transporting data between Node''s JavaScript engine
    and its native core, and we''ll use Node''s module system to bring in core libraries.


    # Patterns


    Inside our programs, we''ll use common Node patterns like callbacks for handling
    asynchronous events. We''ll harness Node''s EventEmitter and Stream classes to
    pipe data around.


    # JavaScripts


    We''ll take a look at some JavaScript features and best practices like "functions
    as first-class citizens" and block scoping.


    # Supporting Code


    You''ll learn how to spawn and interact with child processes, capture their output,
    and detect state changes.


    We''ll begin by creating a tool that watches a file for changes. This will give
    you a peek into how the event loop works while introducing Node''s file-system
    APIs.'
  merge: -1
