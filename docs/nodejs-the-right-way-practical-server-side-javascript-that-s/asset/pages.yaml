  md: "# Extending Core Classes in Custom Modules\n\nThe Node program we made in the\
    \ last section exposed a flaw in our client code; namely, that it doesn't buffer\
    \ its inputs. Any message that arrives as multiple data events will crash it.\n\
    \nSo really the client program has two jobs to do. One is to buffer incoming data\
    \ into messages. The other is to handle each message when it arrives.\n\nRather\
    \ than cramming both of these jobs into one Node program, the right thing to do\
    \ is to turn at least one of them into a Node *module*. We will create a module\
    \ that handles the input-buffering piece so that the main program can reliably\
    \ get full messages. Along the way, we'll need to talk about custom modules and\
    \ extending core classes in Node.\n\n# Extending EventEmitter\n\nTo relieve the\
    \ client program from the danger of split JSON messages, we'll implement an LDJ\
    \ buffering client module. Then we'll incorporate it into the network-watcher\
    \ client.\n\n# Inheritance in Node\n\nFirst let's have a look at how Node does\
    \ inheritance. The following code sets out LDJClient to *inherit from* EventEmitter.\n\
    \n```\nnetworking/ldj.js\nconst events = require('events'),\nutil = require('util');\n\
    // client constructor\nLDJClient = function(stream) {\n  events.EventEmitter.call(this);\n\
    }\nutil.inherits(LDJClient, events.EventEmitter);\n```\n\nLDJClient is a *constructor\
    \ function*, which means other code should call new LDJClient(stream) to get an\
    \ instance. The stream parameter is an object that emits data events, such as\
    \ a Socket connection.\n\nInside the constructor function, we call the EventEmitter\
    \ constructor on *this*. That line of code is roughly equivalent to calling *super()*\
    \ in languages with classical inheritance.\n\nFinally, we use `util.inherits`\
    \ to make LDJClient's *prototype* parent object the EventEmitter *prototype*.\
    \ If this sounds cryptic to you, don't worry. It's like saying \"class LDJClient\
    \ inherits from EventEmitter\" in languages with a classical inheritance"
