  md: '# Chapter 7. Web Apps • 112


    Like a package.json file, it contains a list of dependencies. Our app depends
    on these front-end packages:


    +   - jquery—Extraordinarily popular JavaScript library for Ajax and DOM manipulation

    - bootstrap—Pretty CSS styles for web applications

    - typeahead.js—JavaScript library for autocompleting text fields

    - typeahead.js-bootstrap.css—Bootstrap-compatible CSS for typeahead.js

    - handlebars—HTML templating library


    To install these packages, first install Bower through npm (if you haven''t already):


    ```

    $ npm install -g bower

    ```


    Then install the Bower components:


    ```

    $ bower install

    ```


    Now you should have a bower_components/ directory containing all of the above.


    # Structuring a Single-Page App


    With the server ready to serve the static content, and Bower components in place,
    we can put together the main entry point of our single-page app: the index.html
    file. Here''s the top of that file contains:


    ```

    web-app/b4/static/index.html

    <!doctype html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>b4b - The Better Book Bundle Builder</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="bootstrap/dist/bootstrap.min.css">

    <link rel="stylesheet" href="bootstrap/dist/bootstrap-theme.min.css">

    <link rel="stylesheet">

    <link rel="stylesheet" href="typeahead.js-bootstrap.css/typeahead.js-bootstrap.css">

    <link rel="stylesheet" href="app.css">

    </head>

    <body class="container">

    ```


    The first line—<!doctype html>—ells the browser that this is an HTML5 document.
    Then we enter the document’s <head> section, which contains the title, some <meta>
    tags, and a bunch of style sheets.'
