  md: "# Reading and Writing Files Asynchronously\n\nEarlier in this chapter, we wrote\
    \ a series of Node programs that could watch files for changes. Now let's explore\
    \ Node's methods for reading and writing files. Along the way we'll see two common\
    \ error-handling patterns in Node: error events on EventEmitters and err callback\
    \ arguments.\n\nThere are a few different approaches to reading and writing files\
    \ in Node. The simplest way is to read or write the entire file at once. This\
    \ technique works well for small files. Other approaches read and write by creating\
    \ Streams or staging content in a buffer. Here's an example of the whole-file-at-once\
    \ approach:\n\n```\nfile-system/read-simple.js\nconst fs = require('fs');\nfs.readFile('target.txt',\
    \ function (err, data) {\n  if (err) {\n    throw err;\n  }\n  console.log(data.toString());\n\
    });\n```\n\nSave this file as read-simple.js and run it as usual with node --harmony:\n\
    \n$ node --harmony-read-simple.js\n\nYou'll see the contents of target.txt. If\
    \ the file is empty, you'll see a blank line.\n\nNotice how the first parameter\
    \ to the readFile callback handler is err. If readFile() is successful, then err\
    \ will be false. Otherwise the err parameter will contain an Error object. This\
    \ is a common error-reporting pattern in Node, especially for built-in modules.\
    \ In our example's case, we throw the error if there was one. Recall that an uncaught\
    \ exception in Node will halt the program by escaping the event loop.\n\nThe second\
    \ parameter to our callback, data, is a buffer: the same kind that was passed\
