  md: "But there's actually a deeper problem lurking in our code—caused by assumptions\
    \ we've made about message boundaries. In the next section we'll develop a test\
    \ that exposes this bug so we can fix it.\n\n# Testing Network Application Functionality\n\
    \nFunctional tests assure that our code does what we expect it to do. In this\
    \ section, we'll develop a test for our networked file-watching server and client\
    \ programs. We'll create a mock server that conforms to the LDJ protocol while\
    \ exposing flaws in the client.\n\nAfter we write the test, we'll fix the client\
    \ code so that it passes. This will bring many Node concepts, include extending\
    \ core classes, creating and using custom modules, and developing on top of EventEmittermitters.\
    \ But first we need to understand a problem lurking in our client/server programs\
    \ as currently written.\n\n# Understanding the Message-Boundary Problem\n\nWhen\
    \ you develop networked programs in Node, you'll often communicate by passing\
    \ messages. In the best case, a message will arrive all at once. But sometimes\
    \ messages arrive in pieces, split into distinct data events. To develop networked\
    \ applications, you'll need to deal with these splits when they happen.\n\nThe\
    \ LDJ protocol we developed earlier separates messages with newline characters.\
    \ Each newline character is the boundary between two messages. Here's an example\
    \ of a series of messages, with newline characters specifically called out:\n\n\
    ```\n{\"type\":\"watching\", \"file\":\"target.txt\"}\\n{\"type\":\"changed\"\
    , \"file\":\"target.txt\", \"timestamp\":1358175758495\\}\\n{\"type\":\"changed\"\
    , \"file\":\"target.txt\", \"timestamp\":1358175779621\\}\n```\n\nRecall the service\
    \ we're developing so far in this chapter. Whenever a change happens, it encodes\
    \ and sends a message to the connection, including the trailing newline. Each\
    \ line of output corresponds to a single data event in the connected client. Or,\
    \ to put it another way, the data event boundaries exactly match up with the message\
    \ boundaries.\n\nOur client currently relies on this behavior. It parses each\
    \ message by sending the contents of the data buffer directly into JSON.parse();\n\
