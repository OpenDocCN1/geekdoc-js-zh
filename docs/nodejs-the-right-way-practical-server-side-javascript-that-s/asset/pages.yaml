  md: '# Chapter 4. Robust Messaging Services • 48


    Our code had the publisher bind a TCP socket (as the server) and the sub-subscriber
    connect (as the client), but ØMQ doesn''t force you to do it this way. We could
    have flipped it around and the subscriber bind a socket to which the publisher
    connects.


    When you design a networked application, you''ll typically have the stable parts
    of your architecture bind and the transient parts connect to them. With ØMQ, you
    get to decide which parts of your system will be stable, and you get to decide
    which messaging pattern best suits your needs. But you don''t have to decide them
    at the same time, and it''s easy to change your mind later. ØMQ provides flexible,
    durable pipes for constructing distributed applications.


    Node.js, ØMQ doesn''t have a data-center scaling strategy out of the box. Both
    provide you with building blocks to get you there.


    Next we''ll look at a different messaging pattern: request/response. Then we''ll
    tie this with Node''s clustering support to manage a pool of worker processes.


    # Responding to Requests


    The REQ/REP (request/reply) pattern is quite common in networked programming,
    particularly in Node. We''ll use this pattern often in the next couple of chapters,
    and ØMQ has great support for it. You''ll see in a minute, where the "Q" of ØMQ
    becomes apparent.


    In ØMQ, a REQ/REP pair communicates in lockstep. A request comes in, then a reply
    goes out. Additional incoming requests are queued and later dispatched by ØMQ.
    Your application, however, is only aware of one request at a time.


    Let''s see how this works, again using the file system as a source of information
    for building a service. In this scenario, a responder waits for a request for
    file data, then serves up the content when asked. We''ll start with the responder—the
    REP (reply) part of the REQ/REP pair.


    # Implementing a Responder


    Open an editor and enter the following:


    ```

    messaging/zmq-filer-rep.js

    ''use strict'';

    const

    fs = require(''fs'');

    zmq = require(''zmq'');

    // socket to reply to client requests

    responder = zmq.socket(''rep'');

    ```'
