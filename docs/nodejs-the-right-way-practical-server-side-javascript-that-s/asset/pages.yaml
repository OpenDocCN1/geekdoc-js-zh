  md: '# Get Node.js


    To install Node.js, you have several choices based on your operating system and
    your comfort with building from source code.


    This book assumes you''re using the latest stable version of Node.js. If you install
    a different version—for example, building from the latest source code—the code
    examples in this book may not work. From the command line you can run node --version
    to see what version you have installed if you''re not sure.


    ```

    $ node --version

    v0.10.20

    ```


    The easiest way to get Node is to download an installer from nodejs.org.² Another
    popular option is Node Version Manager (nvm).³ If you''re using a Unix-like OS
    (like Mac OS X or Linux), you can install nvm like so:


    ```

    $ curl https://raw.github.com/creationix/nvm/master/install.sh | sh

    ```


    Then install a specific version:


    ```

    $ nvm install v0.10.20

    ```


    If you have trouble, you can get help on the Node mailing lists and IRC channel,
    both linked from the Node.js community page.⁴


    We''ve got a lot of ground to cover, and we don''t have many pages to do it. So
    if you''re ready, let''s begin in the oh-so-familiar domain of file-system access.


    +   2. http://nodejs.org/download/

    3. https://github.com/creationix/nvm

    4. http://nodejs.org/community/'
