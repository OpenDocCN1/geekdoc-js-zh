    Connected to localhost.\nEscape character is '^'\n{\"type\":\"watching\",\"file\"\
    :\"target.txt\"}\n```\n\nWhen you touch the target.txt file, you'll see output\
    \ like this from your client:\n\n```\n{\"type\":\"changed\",\"file\":\"target.txt\"\
    ,\"timestamp\":13670387203255}\",\n```\n\nNow we're ready to write a client program\
    \ that processes these messages."
