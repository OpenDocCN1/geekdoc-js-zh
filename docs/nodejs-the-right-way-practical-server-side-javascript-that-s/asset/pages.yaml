  md: "# Hash-Based Views\n\nWhen a web application consists of only a single page,\
    \ you need some way of denoting that different content is being shown. One way\
    \ to do this is with URL hashes—the content after the # symbol in a URL.\n\nFor\
    \ example, consider the URL http://localhost:3000/#list-bundles. We want this\
    \ to respond to the view that shows the user's bundles.\n\nOpen the static/index.html\
    \ file in the b4 project. In there you will find <div> like this:\n\n```\n<div\
    \ id=\"welcome-view\" class=\"view\">\n  <h2>Welcome</h2>\n  ...\n</div>\n<div\
    \ id=\"list-bundles-view\" class=\"view\">\n  <h2>Your Bundles</h2>\n  ...\n</div>\n\
    \n```\n\nWe want exactly one of these views visible at a time, and for that we\
    \ need a little client-side JavaScript. Here's the showView() function from static/app.js:\n\
    \n```\nweb-app/b4/static/app.js\nshowView = function (selected) {\n  window.location.hash\
    \ = '#' + selected;\n  $('.view').filter('#' + selected + '-view').show();\n}\n\
    \n```\n\nThis function takes a selected parameter, which is the name of the view\
    \ we want to show. First we set window.location.hash to match the specified view.\
    \ For example, if we call showView('list-bundles'), that updates the page's URL\
    \ to end in #list-bundles.\n\nThe next part is pretty concise, thanks to jQuery.\
    \ We find all of the <div>s on the page with class view, hide them, then find\
    \ just the one ID matches our chosen view, and show it.\n\nThe showView() function\
    \ works great if we want to set the view programmatically, but we should also\
    \ respond to direct URL changes. To do that, we listen to the hashchange event\
    \ on the window:\n\n```\nweb-app/b4/static/app.js\n$(window).on('hashchange',\
    \ function(event) {\n  var view = (window.location.hash || '').replace(/^#, '');\n\
    \  if ('#' + view + '-view').length) {\n    showView(view);\n  }\n});\n\n```"
  merge: -1
