  md: 'CouchDB sends every document in the database through it to produce the view.
    As new documents are added, CouchDB will incrementally update the generated views
    (it doesn''t have to run through them all each time).


    The group=true parameter tells CouchDB that we want the result of running the
    reduce function as well. Since our reduce function is a basic count, the value
    field of each row is the number of books attributed to that author.  So, for example,
    the author "A.E." is credited with two books.


    CouchDB allows you to ask for a subset of view records by specifying a specific
    key or a startkey and endkey as URL parameters. We''ll use these capabilities
    in Chapter 6, Scalable Web Services, on page 87, when we build our own RESTful
    interface for querying the data.


    # Wrapping Up


    This chapter covered a lot of ground against the backdrop of working with databases.
    To start, we created a project directory complete with a package.json file for
    managing dependencies through npm.


    By choosing CouchDB—a RESTful, JSON-based, document-oriented datastore—we got
    a detailed look at how RESTful APIs work. We used the request module to simplify
    making HTTP client requests from Node.


    Step by step, you created scripts to import large amounts of data into CouchDB
    with Node. We saw how Node''s extreme speed sometimes works against it, exhausting
    system resources and overwhelming other services. To fix this, we explored techniques
    for queuing work using the async module. Along the way you learned how to use
    nodeunit to develop and run unit tests for your modules.


    # Robustness


    We dealt with the ECONNRESET problem in Putting It All Together, on page 78, by
    turning the concurrency down from 1,000 to 10.


