- img_proc: true
  md: "First, we check req.isAuthenticated(). This is a method added by passport that\
    \ returns true only if the incoming session cookie matches a known session. If\
    \ the user is authenticated, we immediately call next() to move down the middleware\
    \ chain.\n\nOtherwise, find out if redisClient.ready is true. If it is, then the\
    \ user isn't authenticated (not a system error) and the correct code is 403 Forbidden.\
    \ We can't use 401 Unauthorized because that requires a WWW-Authenticate header,\
    \ which tells the browser that authentication mechanisms are available (and there's\
    \ no provision for cookie-based sessions).\n\nLastly, if redisClient.ready is\
    \ false, then there's no user who could have authenticated. The appropriate response\
    \ is 503 Service Unavailable, since any authenticated APIs can't meaningfully\
    \ operate until Redis comes back.\n\nAlright, now that we have custom middleware,\
    \ let's apply it to some authenticated APIs.\n\n# Creating Authenticated APIs\n\
    \nWe need to create new, user-specific APIs, and we want them to use our authed()\
    \ middleware. But we certainly don't want all the other routes (like our static\
    \ file serving) to be authenticated. Those still need to be served without any\
    \ authentication. So we can't just call use() like we would with other middleware.\n\
    \nWhen you specify a route in Express, you can include middleware that you wish\
    \ to apply only to that route. We'll use this feature for the /api/user route:\n\
    \n```\nweb-app/b4/server.js\napp.get('/api/user', authed, function(req, res) {\n\
    \  res.json(req.user);\n});\n```\n\nThis short route handler is all we need, thanks\
    \ to the authed() function we already made. By the time the route handler is invoked,\
    \ the middleware has already confirmed that the session is valid and the user\
    \ property on the request will have the right data.\n\nOnce logged in, requests\
    \ to /api/user will return something like this:\n\n```\n{\n  \"identifier\": \"\
    https://www.google.com/accounts/o8/id=...\"\n}\n```"
