  md: "# Counting Down with a Generator\n\nLet's see how this works with a short example.\
    \ Open your text editor and enter this:\n\n```\nweb-services/countdown.js\n'use\
    \ strict';\nconst countdown = function*(count) {\n  while (count > 0) {\n    yield\
    \ count;\n    count -= 1;\n  }\n},\n\ncounter = countdown(5),\n\ncallback = function()\
    \ {\n  let item = counter.next();\n  if (!item.done) {\n    console.log(item.value);\n\
    \    setTimeout(callback, 1000);\n  }\n};\ncallback();\n```\n\nSave the file as\
    \ countdown.js. This program counts down from five at one-second intervals, sending\
    \ each value to the console:\n\n```\n$ node --harmony countdown.js\n```\n\nThe\
    \ countdown() function is a generator function. The asterisk (*) in function()\
    \ is what tells the JavaScript engine to treat this function differently.\n\n\
    When you call countdown with a starting value, what you get back is a generator.\
    \ In our case, we call countdown with 5 and store the generator to a variable\
    \ called counter. \n\nThe code inside the generator function starts executing\
    \ the first time you call the generator's next() method. It runs until it hits\
    \ a yield, then sends back that value. \n\nOur example calls counter.next() inside\
    \ of a function called callback. This callback function saves the object returned\
    \ by counter.next() into a variable called item. This object has two properties\
