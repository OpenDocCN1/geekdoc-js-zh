  md: "# Writing Modular Express Services\n\nThroughout the remainder of the chapter,\
    \ we're going to build a RESTful service with Express for creating and managing\
    \ book bundles. These are basically named reading lists. Our app will be called\
    \ Better Book Builder (or b4 for short).\n\nWe'll work extensively with the books\
    \ database we set up in Chapter 5, Accessing Databases, on page 65, as well as\
    \ a new database called b4. Our application will work roughly as follows:\n\n\
    +   - It will communicate with two databases: the books database and the b4 database.\n\
    - To the b4 application, the books database is read-only (we will not add, delete,\
    \ or overwrite any documents in it).\n- The b4 database will store user data,\
    \ including the book bundles that users make.\n\nTo create the b4 database, make\
    \ sure CouchDB is running, then use curl for the command line:\n\n```\n$ curl\
    \ -X PUT http://localhost:5984/b4\n{\"ok\":true}\",\n```\n\nThe -X flag lets you\
    \ specify which HTTP method to use. We'll use curl a lot in this chapter for testing\
    \ our web services.\n\nNow we're ready to create our modular, RESTful web services.\n\
    \n# Separating Server Code into Modules\n\nJust like our Hello World example,\
    \ the main entry point for the b4 service is the server.js. But instead of assigning\
    \ a handler to app.get() directly, now we specify some configuration parameters\
    \ and pull in the API modules:\n\nHere's the part of b4/server.js that differs\
    \ from the Hello World version:\n\n```\nconst config = {\n  bookdb: 'http://localhost:5984/books/',\n\
    b4db: 'http://localhost:5984/b4'\n};\n\nrequire('./lib/book-search.js')(config,\
    \ app);\nrequire('./lib/field-search.js')(config, app);\nrequire('./lib/bundle.js')(config,\
    \ app);\n```"
