    the promise is resolved or rejected. And we often sent array values to resolve
    promises (like couchRes, body)).


    Q implements the Promises/A specification. Although this specification only requires
    a then() method, Q promises have more. For example, then() handlers always get
    one parameter, but Q''s spread() method can handle multiple parameters.

    - How would you change the API endpoints in this chapter to use spread() instead
    of then()?

    - Was it the right choice to send array values to resolve promises? If not, what
    would you use instead?


    6. http://wiki.commons.org/wiki/Promises/A'
