  md: "# Serving APIs with Express • 89\n\nso all we have to do is run npm install.\
    \ If you were making your project,\ny'd want to run npm install --save express\
    \ to pull down the latest Express avail-\nable and record the dependency in your\
    \ package.json file.\n\nLet's take a look at a Hello Express app to get a feel\
    \ for how it works.\nThen we'll expand on this skeleton to make our own RESTful\
    \ APIs. In the\nterminal, navigate to the hello subdirectory of the example project.\
    \ Here is the\ncontent of the serverjs file you will find here:\n\n```\nweb-services/hello/server.js\n\
    #!/usr/bin/env node --harmony\n'use strict';\nconst\n  express = require('express');\n\
    \  app = express();\n  app.use(express.logger('dev'));\n  app.get('/api/:name',\
    \ function(req, res) {\n    res.json(200, { \"hello\": req.params.name });\n \
    \ });\n  app.listen(3000, function() {\n    console.log('ready captain.');\n \
    \ });\n```\n\nFirst, this program brings in the express module and creates an\
    \ app. Like the\nrequest module we worked with in the last chapter, the express\
    \ module is itself\na function. When you call this function, Express creates an\
    \ application context for\nyou. By convention, we name this variable app.\n\n\
    Express functionality is provided through something called middleware, which\n\
    are asynchronous functions that manipulate the request and response objects.\n\
    To specify middleware for your app, you call app.use(), passing in the middleware\n\
    you. In our case, we use the logger middleware to set dev mode, which\nwill log\
    \ to all requests coming in.\n\nNext we use app.get() to tell Express how we want\
    \ to handle HTTP GET\nto the /api/:name path. The name change in the path is a\
    \ named route\nparameter. When the API is hit, Express will grab that part of\
    \ the URL and\nmake it available in req.params.\n\nIn addition to get(), Express\
    \ has put(), post(), and del() to register handlers for\nPUT, POST, and DELETE\
    \ requests, respectively. In our case, we tell the\nresponse object, to send back\
    \ as JSON an object whose hello key is set to\nthe parameter.\n\nFinally, this\
    \ program listens on TCP port 3000 for incoming HTTP requests,\n logs a message\
    \ to the console when it's ready to receive connections.\nLet's run the app to\
    \ see what it does."
