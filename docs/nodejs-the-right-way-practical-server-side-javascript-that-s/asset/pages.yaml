  md: "# Extending Core Classes in Custom Modules • 37\n\nconstructor function starts\
    \ out by calling the EventEmitter constructor, just like before. Then we set up\
    \ the local variable self to capture it.\n\nIn JavaScript, the value of this is\
    \ assigned inside each function when it is invoked, at runtime. The value of this\
    \ is not tightly bound to any particular object like in classical languages. It's\
    \ more like a special variable.\n\nSetting a separate variable (self) to the same\
    \ value guarantees that we're referring to the correct object inside our data\
    \ handler. You have to be careful about this in JavaScript, especially when nested\
    \ functions are involved.\n\nInside the data handler, we append raw data to the\
    \ end of the buffer and then pull completed messages off the front. Each message\
    \ string is sent through JSON.parse() and finally emitted by the LDJClient as\
    \ a message event via self.emit(this). At this point, the problem we started with\
    \ (split messages) is effectively solved. Whether ten messages come in on a single\
    \ data event or only half of one does, they'll all precipitate message events\
    \ on the LDJClient instance.\n\nNext we need to put this class into a Node module\
    \ so our upstream client can use it.\n\n# Exporting Functionality in a Module\n\
    \nLet's put together the previous code samples and expose LDJClient as a module.\
    \ Open a text editor and insert the following:\n\n```\nnetworking/ldj.js\n\"use\
    \ strict\";\nconst\n    events = require('events'),\n    util = require('util'),\n\
    \    // client constructor\nLDJClient = function(stream) {\n    events.EventEmitter.call(this);\n\
    \    let\n        self = this,\n        buffer = '';\n    stream.on('data', function(data)\
    \ {\n        buffer += data;\n        let boundary = buffer.indexOf('\\\n');\n\
    \        while (boundary !== -1) {\n            let input = buffer.substr(0, boundary);\n\
    \            buffer = buffer.substr(boundary + 1);\n            self.emit('message',\
    \ JSON.parse(input));\n            boundary = buffer.indexOf('\\\n');\n      \
    \  }\n    });\n});\n```"
