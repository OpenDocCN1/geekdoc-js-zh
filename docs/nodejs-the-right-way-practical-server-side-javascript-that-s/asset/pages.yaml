  md: '# Chapter 5. Accessing Databases • 66


    We''ll use CouchDB for exploring databases with Node.¹ CouchDB uses REST for everything,
    from creating databases to reporting the system status to executing mapreduce
    queries. Using CouchDB to learn about asynchronous database access in Node has
    several advantages.


    # Advantages of CouchDB


    Interacting with CouchDB is all about proper HTTP requests. This will give us
    the opportunity to talk about HTTP and RESTful practices—information that will
    be handy in Chapter 6, Scalable Web Services, on page 87, when we''ll implement
    our own RESTful web services. And the techniques you''ll use here apply to other
    RESTful APIs, like those published by Amazon and Google.


    As a bonus, CouchDB speaks JavaScript. Whenever you store data in CouchDB, you
    will use a JavaScript Object Notation (JSON) document. A document is a JSON object
    with a couple of special attributes that we will see shortly. Indexing and querying
    CouchDB is done with mapreduce views in JavaScript, also accessible through REST.


    Lastly, npm itself uses CouchDB extensively. The metadata about modules in npm
    is stored and queried in CouchDB. There is significant overlap between the Node.js
    core developer group and the CouchDB community.


    Let''s get CouchDB up and running. We''ll build out a toolkit for working with
    it. CouchDB is easy to install on many platforms. Binaries are available from
    the project website, or you can use a package manager. If you''re using Mac OS
    X with Homebrew, you install CouchDB with the command brew install couchdb.


    Once you have CouchDB installed, start it from the command line with the couchDB
    command.


    ```

    $ couchdb

