    \  group: true\n    }, function(err, couchRes, body) {\n      // couldn't connect\
    \ to CouchDB\n      if (err) {\n        res.json(502, { error: \"bad_gateway\"\
    , reason: err.code });\n        return;\n      }\n\n      // CouchDB couldn't\
