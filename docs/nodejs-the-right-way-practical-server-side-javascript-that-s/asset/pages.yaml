    \ that contains all the code from this chapter. Get it now if you don't have it,\
    \ then let's get started with Express.\n\n# Advantages of Express\n\nExpress is\
    \ a web application framework for Node modeled after the Ruby Sinatra.³ Express\
    \ provides a lot of the plumbing code that you'd otherwise end up writing yourself.\
    \ To see why, let's take a look at a basic Node.js server using only the http\
    \ module.\n\nweb-services/server.js\n\n```\nconst http = require('http'),\nserver\
    \ = http.createServer(function(req, res) {\n  res.writeHead(200, {'Content-Type':\
    \ 'text/plain'});\n  res.end('Hello World!');\n});\nserver.listen(3000, function(){\n\
    \  console.log('ready captain!');\n});\n```\n\nThis is quite similar to creating\
    \ a basic TCP server using the net module. First we bring in the http module,\
    \ call its createServer() method with a callback, and finally use server.listen()\
    \ to bind a TCP socket for listening. The callback function uses information from\
    \ the incoming HTTP request (req) to send an appropriate response.\n\nWhat's remarkable\
    \ about this example isn't what it does, but rather what it doesn't do. There\
    \ are lots of little jobs a typical web server would take care of that this code\
    \ doesn't touch. Here are some examples:\n\n+   - Routing based on URL paths\n\
    - Managing sessions via cookies\n- Parsing incoming requests (like form data or\
    \ JSON)\n- Rejecting malformed requests\n\nThe Express framework helps with these\
    \ and myriad tasks.\n\n# Serving APIs with Express\n\nFor all Node modules, to\
    \ use Express you have to install it with npm. The example project we're working\
    \ from from already specifies a dependency on Express,\n\n> 3. http://www.sinatrub.com/"
