  md: '# Chapter 5. Accessing Databases • 78


    The worker function we used to create the queue takes two arguments: path and
    done. The path argument is the path to an RDF file discovered by walking the directory
    tree, done is a callback that our worker function has to call to signal to the
    work queue that''s free to dequeue the next path.


    Node.js, it''s common for the last argument to a callback to be a done or next
    function. Technically, you can name this argument whatever you want (it''s your
    function, after all). But naming it done or next signals that this is a callback
    function that takes no arguments and should be called exactly once when you''re
    finished whatever it is that you''re doing. By contrast, callback functions named
    callback take one or more arguments, starting with an err message.


