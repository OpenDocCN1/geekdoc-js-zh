  md: 'Message-Publishing and -Subscribing • 4


    Calling subscriber.subscribe("") tells Ø that we want to receive all messages.
    If you only want certain messages, you can provide a string that acts as a prefix
    filter. You must call subscribe() at some point in your code—you won''t receive
    any messages until you do.


    The subscriber object inherits from EventEmitter. It emits a message event whenever
    it receives one from a publisher, so we use subscriber.on() to listen for them.


    Lastly, we use subscriber.connect() to establish the client end of the connection.


    Let''s see how these pieces fit together. With the PUB program still running in
    one terminal, fire up zm-watcher-sub in a second one:


    ```

    $ node --harmony zm-watcher-sub.js

    ```


    Then, in a third terminal, touch the target file:


    ```

    $ touch target.txt

    ```


    In the subscriber terminal, you should see output something like this:

    File ''target.txt'' changed at Wed May 22 2013 21:34:10 GMT-0400 (EDT)


    So far, things look pretty great. The publisher and subscriber programs are able
    to successfully communicate with the PUB/SUB socket pair.


    But it gets even better. Keep those services running; next we''ll cover how ØMQ
    handles network interruptions.


    # Automatically Reconnecting Endpoints


    Let''s see what happens when one of the endpoints disconnected unexpectedly. Try
    killing the publisher in its terminal via Ctrl-C.


    Afterwards, switch over to the subscriber terminal. you may notice something strange
    happened—nothing. The subscriber keeps waiting for messages even though the publisher
    is down, like nothing happened.


    Start up the publisher again in the first terminal, then touch the target file.
    The subscriber should log a File changed message to the console. It''s as though
    they were connected the whole time.


    From ØMQ''s perspective, it doesn''t matter which endpoint starts first. And it
    automatically reestablishes the connection when an endpoint comes back online.
    These characteristics add up to a robust platform that gives you stability without
    a lot of work of your part.


    In our previous examples, both the PUB and SUB endpoints were made from zm.socket().
    This means they both have the power to either bind() or connect().'
