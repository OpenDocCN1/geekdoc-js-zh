    # Generators and Asynchronous Code


    Because generators can pause their execution indefinitely, they offer a clever
    way to deal with asynchronous code. The countdown example doesn''t show it, but
    inside your generator function, you can grab the value coming in through yield.


    For example, say your generator function contains the following line:


    ```

    let x = yield;

    ```


    In this case, the value of x would be whatever was passed into generator.next()
    while it was suspended on the yield. If you called generator.next(8), then x would
    be 8.


    When the generator function and the calling code cooperate, you can do some really
    neat things. Consider this line from a hypothetical generator function:


    ```

    let data = yield "./my-text-file.txt";

    ```


    This line suspends execution after yielding the string "./my-text-file.txt" and
    expects to continue when it receives the data from that. If the calling code knows
    to treat the string as a filename, can it do something like fs.readFile() and
    then pass the data back to the generator with generator.next(data).


    It turns out that promises are a great fit for achieving this kind of coordination,
    as we''ll see next.


