  md: "In this section, you'll see how to serve static content from Express alongside\
    \ your RESTful APIs. Some of the static content will come from third-party dependencies,\
    \ which we'll pull from Bower.\n\n# Serving Static Content with Express\n\nExpress\
    \ comes with a convenient way to serve static files. All you have to do is use\
    \ the express.static middleware and provide a directory. For example, these lines\
    \ appear in the b4:\n\n```\nweb-app/b4/server.js\napp.use(express.static(__dirname\
    \ + '/static/));\napp.use(express.static(__dirname + '/bower_components/));\n\
    ```\n\nThese two lines tell Express to serve static content out of the static/\
    \ and bower_components/ directories of the project. This means that if Express\
    \ can't find a particular route, it'll fall back to the static content, checking\
    \ these directories one at a time.\n\nThe static middleware is special in this\
    \ regard. Most of the time, middleware has its effect in the middle of the request\
    \ processing, but static appends its effect to the end of the chain (even after\
    \ the route handlers run).\n\nFor instance, the project's static/ directory contains\
    \ three files: index.html, app.css, and app.js. These contain the HTML, CSS, and\
    \ client-side JavaScript for the b4 application, respectively.\n\nWith the server\
    \ running, when you request http://localhost:3000/index.html, Express will serve\
    \ up static/index.html because we don't have an explicit route for it.\n\n# Installing\
    \ Bower Components\n\nBower is a package manager for front-end code, like JavaScript\
    \ libraries. You'll install Bower components in the same way you install npm modules.\n\
