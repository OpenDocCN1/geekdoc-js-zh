  md: "# Generating HTML with Handlebars\n\nThe b4 app uses templates for generating\
    \ HTML from input data. A template is basically HTML with holes where data will\
    \ be filled in. There are many of JavaScript templating engines to choose from—this\
    \ app uses Handlebars.\n\nHandlebars replaces named tokens in a source string\
    \ with values from a context object. It also supports looping over objects and\
    \ arrays, and conditional logic (if/else). For example, here's the Handlebars\
    \ template for generating a table to display a user's lists:\n\n```\nweb-app/b4/static/index.html\n\
    <table class=\"table\">\n<head>\n  <tr>\n    <th>Bundle Name</th>\n    <th class=\"\
    actions\">Actions</th>\n  </tr>\n</head>\n<body>\n  {{each bundles}}\n  <tr data-id=\"\
    {{key}}\">\n    <td>{{this}}</td>\n    <td class=\"actions\">\n      <button type=\"\
    button\" class=\"btn edit\">\n        <abbr title=\"edit bundle\" class=\"glyphicon\
    \ glyphicon-pencil\">\n          <span>edit bundle</span>\n        </abbr>\n \
    \     </button>\n      <button type=\"button\" class=\"btn delete\">\n       \
    \ <abbr title=\"delete bundle\" class=\"glyphicon glyphicon-trash\">\n       \
    \   <span>delete bundle</span>\n        </abbr>\n      </button>\n    </td>\n\
    \  </tr>\n  {{each}}\n</body>\n</table>\n```\n\nStarting on line 9, we loop over\
    \ the bundles object. For each key/value pair, we add a <tr> data-id attribute\
    \ is set to the current key. And inside that row we add a <td> element with the\
    \ text set to the current value {{{this}}}.\n\nOur b4 app compiles and executes\
    \ the Handlebars templates entirely on the client side, but you can push some\
    \ or all of these tasks to the server since Handlebars can run in Node.js as well.\n\
    \n> 1. http://handlebarsjs.com/"
