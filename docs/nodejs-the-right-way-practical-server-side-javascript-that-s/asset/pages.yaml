  md: "```\ndatabases/make-views.js\n!/usr/bin/env node --harmony\n'use strict';\n\
    \nasync = require('async'),\nrequest = require('request'),\nviews = require('./views.js');\n\
    async.waterfall(\n  // get the design doc (if present)\n  function(next) {\n \
    \   request.get('http://localhost:5984/books/_design/books', next);\n  },\n\n\
    \  // create a new design doc or existing\n  function(res, body, next) {\n   \
    \ if (res.statusCode === 200) {\n      next(null, JSON.parse(body));\n    } else\
    \ if (res.statusCode === 404) {\n      next(null, { views: {} });\n    }\n  },\n\
    \n  // add views to document and submit\n  function(doc, next) {\n    Object.keys(views).forEach(function(name)\
    \ {\n      doc.views[name] = views[name];\n    });\n    request({\n      method:\
    \ 'PUT',\n      url: 'http://localhost:5984/books/_design/books',\n      json:\
    \ doc\n    }, next);\n  },\n  function(err, res, body) {\n    if (err) throw err;\n\
    \    console.log(body);\n  }\nn);\n```\n\nSave the file as make-views.js in your\
    \ project directory using async chmod in a terminal. This program uses the async\
    \ module's waterfall() method to execute a sequence of asynchronous functions.\
    \ Using the waterfall method cleans up code that would otherwise be highly indented\
    \ due to nested callbacks.\n\nwaterfall() takes two arguments: an array of functions\
    \ to execute sequentially and a summary function to call when everything is finished.\
    \ Each function in the array takes some number of arguments and finally a next\
    \ callback to pass results forward into the next function."
