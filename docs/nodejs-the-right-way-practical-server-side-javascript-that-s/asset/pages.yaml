  md: 'Chapter 2. Wrangling The File System • 20


    These functions rely on the same kinds of callback parameters we''ve used in this
    chapter. They''re all asynchronous by default, but many come with with equivalent
    *Sync versions.


    # The Two Phases of a Node Program


    Given the cost of blocking has on the Node event loop, you might think it''s always
    bad to use synchronous file-access methods. To understand it, you can think of
    Node programs as having two phases.


    In the initialization phase, the program is getting set up, bringing in libraries,
    reading configuration parameters, and doing other mission-critical tasks. If something
    goes wrong at this early stage, much can be done, and it''s best to fail fast.
    The only time you should consider synchronous file access is during the initialization
    phase of your program.


    The second phase is the operation phase, when the program churns through the event
    loop. Since many Node programs are networked, this means accepting connections,
    making requests, and waiting on other kinds of I/O. You should *never* use synchronous
    file-access methods during this phase.


    The require() function is an example of this principle in action—it synchronously
    evaluates the module''s code and returns the module object. Either the module
    will successfully load, or the program will fail right away.


    As a rule of thumb, if your program couldn''t possibly succeed without the file,
    then it''s OK to use synchronous file access. If your program could conceivably
    continue about its business, then it''s better to take the safe route and stick
    to asynchronous I/O.


    # Wrapping Up


    In this chapter we''ve used Node to perform file operations in Node''s event,
    asynchronous, callback-oriented way. You learned how to watch files for changes,
    and read and write files. You also learned how to spawn child processes and access
    command-line arguments.


    Along the way, we covered the EventEmitter class. We used the on() method to listen
    for events and handle them in our callback functions. And we used Streams—which
    are a special kind of EventEmitter—to process data in buffered chunks or pipe
    it directly to other streams.


    Oh, and let''s not forget about errors. You learned Node''s convention of passing
    an err argument to callbacks, and how error events can be captured from an EventEmitter.'
