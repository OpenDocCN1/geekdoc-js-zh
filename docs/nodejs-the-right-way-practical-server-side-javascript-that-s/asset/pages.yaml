    Facebook, and other services.


    We''re going to use passport to support authentication with Google credentials.
    Go the passport and passport-google modules from npm if you don''t have them already
    (npm install --save passport-google).


    To add passport, first add this to your const declarations at the top of your
    server.js file:'
