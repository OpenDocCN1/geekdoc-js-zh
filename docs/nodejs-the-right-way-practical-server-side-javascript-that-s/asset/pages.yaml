  md: 'Developing web applications is an enormous topic. You could fill a library
    with books on all the myriad concepts you need to know to master it. I''ve been
    doing it for over a decade, and I''m still learning every day.


    So instead of trying to explore everything there is to know, we''ll focus on what''s
    specific to Node.js. The code download that accompanies this book contains a web-app
    directory, which has all the code from this chapter and more. I encourage you
    to go grab it if you haven''t already, since we won''t cover everything that''s
    in there.


    The application b4 builds on the web services that we developed last chapter.
    This means you''ll need CouchDB running, along with the data from Chapter 5, Access
    Databases, on page 65.


    Once you have those prerequisites, let''s dive in!


    # Storing Express Sessions in Redis


    Whenever you have a user-facing web application, you''ll almost always use sessions.
    A session is data that''s attached to a particular user. As the user browses pages
    on the site or uses the web application, the server keeps track of the user through
    a session cookie. On each request, the server reads the cookie, retrieves the
    session data, then uses it when generating a response.


    Let''s see how to enable sessions in Express, and how to use Redis for storing
    the session data.


    # Enabling Sessions in Express


    To enable sessions, add the cookieParser and session middleware to your app:


    ```

    app.use(express.cookieParser());

    app.use(express.session({secret: ''unguessable''}));

    ```


    The cookieParser middleware is responsible for parsing cookies from the client,
    and the session middleware stores the session data attached to the cookie. The
    secret parameter is necessary to prevent cookie tampering and spoofing—set it
    to something unique to your application. Express session cookies are signed with
    this secret string.'
