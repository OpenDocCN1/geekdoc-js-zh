  md: "# Chapter 3. Networking with Sockets • 24\n\nTo begin, we'll develop a simple\
    \ and complete TCP server program. Then we'll iteratively improve the server as\
    \ we address concerns such as robustness, modularity, and testability.\n\n# Listening\
    \ for Socket Connections\n\nNetworked services exist to do two things: connect\
    \ endpoints and transmit information between them. No matter what kind of information\
    \ is transmitted, a connection must first be made.\n\nIn this section, you'll\
    \ learn how to create socket-based services using Node.js. We'll develop an example\
    \ application that sends data to connected clients, then we'll connect to this\
    \ service using standard command-line tools. By the end, you'll have a good idea\
    \ of how Node does the client/server pattern.\n\n# Binding a Server to a TCP Port\n\
    \nTCP socket connections consist of two endpoints. One endpoint binds to a numbered\
    \ port while the other endpoint connects to a.\n\nThis is a lot like a telephone\
    \ system. One phone binds a given phone number for a long time. A second phone\
    \ places a call—it connects to the bound number. Once the call is answered, information\
    \ (sound) can travel both ways.\n\nIn Node.js, the bind and connect operations\
    \ are provided by the net module. Binding a TCP port to listen for connections\
