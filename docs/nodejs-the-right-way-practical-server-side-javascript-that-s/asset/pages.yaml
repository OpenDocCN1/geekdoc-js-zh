  md: "# Making RESTful Requests\n\nAt its core, REST is a set of principles built\
    \ on top of HTTP. With REST, each URL path points to a specific *resource*. In\
    \ other words, URLs are things. This is in direct contrast to many servers where\
    \ a given path invokes a script that does something (URLs are actions).\n\nHTTP\
    \ itself is a request/reply protocol where each request is made to a URL with\
    \ a particular *method*. The HTTP method for an incoming request determines what\
    \ kind of action the server should take on the resource indicated in the URL.\n\
    \nAny database you work with will offer at least the four basic operations: create,\
    \ read, update, and delete (CRUD). RESTful datastore like CouchDB use a different\
    \ HTTP method (or *verb*) for each operation. You use POST to create, GET to read,\
    \ PUT to update, and DELETE (you guessed it) delete records.\n\n# REST from the\
    \ Command Line\n\nNode's built-in http module has functions for making HTTP requests,\
    \ the request module makes it much easier. To learn how to use the request module,\
    \ we'll first put together a command-line interface (CLI) tool for working with\
    \ CouchDB. We'll use the CLI to set up a CouchDB database initially and try out\
    \ some REST semantics.\n\nOpen your editor and enter this:\n\n```\ndatabases/dbcli.js\n\
    !/usr/bin/env node --harmony\nconst\n  request = require('request'),\n  options\
    \ = {\n    method: process.argv[2] || 'GET',\n    url: 'http://localhost:5984/'\
    \ + (process.argv[3] || '')\n  };\nrequest(options, function(err, res, body) {\n\
    \  if (err) {\n    throw Error(err);\n  } else {\n    console.log(res.statusCode,\
    \ JSON.parse(body));\n  }\n});\n```\n\nSave this file as dbcli.js. Though, this\
    \ program lets you do quite a lot with your CouchDB server. First, this script\
    \ pls in the request module. Unlike the modules we've seen so far, which were\
    \ JavaScript Objects, the request module object is actually a function. The main\
    \ way you use the module it is by calling it."
