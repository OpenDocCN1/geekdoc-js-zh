  md: '# Preface


    Two big shifts are happening right now in the practice of writing software, and
    Node.js is at the forefront of both.


    First, JavaScript is becoming increasingly asynchronous. Whether you''re waiting
    for a Big Data job, interacting with end users, or simply responding to an API
    call, chances you''ll need asynchronous programming techniques.


    Second, JavaScript has quietly become the world''s standard virtual machine—in
    web browsers, modern NoSQL databases, and now on the server as well.


    Node.js is right at the intersection of these trends, and it''s ready to take
    off in a big way.


    # Why Node.js is the Right Way


    In March of 2010, I gave a lightning talk titled "Full-Stack JavaScript" at the
    NoSQL Boston conference. Back then, and even more so now, I knew that using JavaScript
    for every layer of the application stack was not only possible, but a great way
    to reduce software complexity.


    The Right Way in this book''s title refers to both the process of learning Node
    and the practice of writing Node.


    # Learning Node.js


    As for growing technology, there are lots of resources available for learning
    Node.js. Many are intently focused on serving up web resources. The web is great,
    but it''s not enough, and it''s not the whole story of Node.


    Ruby is more than Rails, and Python is more than Django. Node.js is more than
    serving web content, and this book treats it that way.


    Node.js the Right Way teaches you the core concepts you''ll need to be an effective
    Node.js programmer, no matter what kinds of programs you need to write.'
  merge: -1
