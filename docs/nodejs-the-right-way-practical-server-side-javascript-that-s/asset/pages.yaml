  md: "# Using Redis to Store Session Data\n\nRedis is an extremely fast key/value\
    \ store with tunable durability. This means you can keep it fast but risk losing\
    \ data if the server were to crash, or you can sacrifice some speed for greater\
    \ durability guarantees.\n\nBy default, Redis keeps data in memory and then periodically\
    \ writes it to disk. This makes it blazingly fast, but disaster-prone; since a\
    \ process crash would mean lost data.\n\nIts speed makes Redis an ideal database\
    \ for storing session data. If the server tips over, the sessions might be lost,\
    \ but at worst this means that your users will have to log in again.\n\nTo use\
    \ Redis with your Node/Express app, first you'll have to install it. Installing\
    \ Redis differs by platform, but once you have it installed, starting it up is\
    \ a single command:\n\n```\n$ redis-server\n```\n\n```\n[8344] 10 Sep 20:38:41.564\
    \ # Server started, Redis version 2.6.13\n```\n\nUsing Redis with Express takes\
    \ a couple of npm modules: redis and connect-redis. Run npm install --save to\
    \ get them and add them to your package.json.\n\nAs an experiment, let's modify\
    \ the server.js file from the last chapter’s \"Hello World\" app to use Redis\
    \ for session storage. Open the server.js file and add this to the cost declarations\
    \ at the top:\n\n```\nweb-app/hello/server.js\nredisClient = require('redis').createClient(),\n\
    RedisStore = require('connect-redis')(express),\n```\n\nThe first line connects\
    \ a client for the Redis database. This will immediately open a TCP socket to\
    \ your Redis server. The second line produces a class you can use to instantiate\
    \ a Redis-based backing store for sessions.\n\nFinally, in the middleware section\
    \ of your server.js file, use the cookie and session middleware with Redis like\
    \ so:\n\n```\nweb-app/hello/server.js\napp.use(express.cookieParser());\napp.use(express.session({\n\
    \  secret: 'unguessable',\n  store: new RedisStore({\n    client: redisClient\n\
    \  })\n}));n\n```"
