  md: "# Chapter 3. Networking with Sockets • 36\n\nmodel. It means that if you look\
    \ for a property on an LDClient and it's not there, the EventEmitter is the next\
    \ place to look.\n\nThere are other ways to do inheritance in JavaScript, but\
    \ this is Node.js's own modules are structured. We'll investigate some alternatives\
    \ in later chapters. But for now, let's follow the Node.js core library style.\n\
    \nCode to use LDClient might look like this:\n\n```\nconst client = new LDClient(networkStream);\n\
    client.on('message', function(message) {\n  // take action for this message\n\
    });\n```\n\nEven though the client object doesn't have an on(event) method directly,\
    \ its prototypal grandparent, EventEmitter, does.\n\nThe inheritance framework\
    \ is now in place, but we haven't implemented anything to emit events. Let's look\
    \ at this next, and talk about buffering data events in Node.\n\n# Buffering Data\
    \ Events\n\nIt's time to use the stream parameter in the LDClient to retrieve\
    \ and buffer input. The goal is to take the incoming raw data from the stream\
    \ and convert it into message events containing the parsed message objects.\n\n\
    Take a look at the following updated constructor function. It appends incoming\
    \ data chunks to a running buffer string and scans for line endings (which should\
    \ be JSON message boundaries).\n\n```\nnetworking/ld.js\nLDClient = function(stream)\
    \ {\n  events.EventEmitter.call(this);\n  let\n    self = this,\n    buffer =\
    \ '';\n    stream.on('data', function(data) {\n      buffer += data;\n      let\
    \ boundary = buffer.indexOf('\\n');\n      while (boundary !== -1) {\n       \
    \ let input = buffer.substr(0, boundary);\n        buffer = buffer.substr(boundary\
    \ + 1);\n        self.emit('message', JSON.parse(input));\n        boundary =\
    \ buffer.indexOf('\\n');\n      }\n    });\n};\n```"
