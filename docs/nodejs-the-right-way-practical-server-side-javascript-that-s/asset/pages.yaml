  md: '# Scalable Web Services


    A lot of the buzz around Node.js centers on using it for writing scalable websites,
    apps, and services. In this chapter we''ll develop robust, RESTful, JavaScript
    Object Notation (JSON)-based web services. Creating web services will be our backdrop
    for digging into these aspects of Node development:


    # Architecture and Core


    You''ll learn how to use Node''s built-in module to create a basic HTTP server.


    # Patterns


    Some Node modules have their own ecosystem of plug-ins that provide additional
    behavior. We''ll use plug-ins for Express and learn how its middleware pattern
    provides hooks for additional functionality. We''ll also use promises, a powerful
    abstraction for writing asynchronous code.


    # Javascripts


    ECMAScript Harmony introduces new concepts like iterators and generators. You''ll
    learn how to create and use generators, and how they combine with promises to
    simplify asynchronous programming.


    # Supporting Code


    For our project, we''ll use more features of npm, like specifying scripts to start
    our project. We''ll also use nodemon to monitor our Node programs and automatically
    restart them when the source changes.


    Node.js comes with support for low-overhead HTTP servers out of the box using
    the http module.¹ But writing services against the low-level http module directly
    can be a lot of work. We''ll use Express for developing our web services.²


    +   1. http://nodejs.org/api/http.html

    2. http://expressjs.com/'
