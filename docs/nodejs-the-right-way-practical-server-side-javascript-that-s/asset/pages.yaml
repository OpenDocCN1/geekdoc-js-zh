  md: '# Importing External Modules with npm


    one module from npm. We''ll use many external modules in this book, and zmq (the
    Node binding for ØMQ) is the first.


    Modules managed by npm can be pure JavaScript or a combination of JavaScript and
    native addon code.¹ Addons are dynamically linked shared objects—they provide
    the glue for working with native libraries written in C or C++.


    The vast majority of modules can be installed through the npm command-line tool
    alone, even if they contain addons. But a few, like the zmq module, have additional
    requirements as well. To use ØMQ with Node, you have to install the ØMQ base library
    first; then you can pull in the zmq module through npm.


    # Installing the ØMQ Base Library


    Installing the ØMQ library is fairly straightforward on most platforms. Binary
    and source packages are available from the project download page.²


    If you''re using Mac OS with Homebrew, you can quickly install ØMQ from the command
    line.³


    ```

