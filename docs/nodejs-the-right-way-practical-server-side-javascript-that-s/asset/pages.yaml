  md: "Chapter 4. Robust Messaging Services • 60\n\nAnd here's an associated PULL\
    \ socket.\n\n```\nconst\nzmq = require('zmq'),\nnpuller = zmq.socket('pull');\n\
    \n// connect to the pusher, announce readiness to work, then wait for work\n\n\
    puller.on('message', function(data) {\n  let job = JSON.parse(data.toString());\n\
    \n  // do the work described in the job\n});\n```\n\nLike with ØMQ sockets, either\
    \ end of a PUSH/PULL pair can bind or connect——the choice comes down to which\
    \ is the stable part of the architecture.\n\nUsing the PUSH/PULL pattern in Node\
    \ brings up a couple of potential pitfalls hidden in these simple examples. Let's\
    \ explore them, and what to do to avoid them.\n\n# Avoiding Common Pitfalls\n\n\
    The two common pitfalls you're likely to encounter with the PUSH/PULL pattern\
    \ in Node.js are the first-joiner problem and the limited-resource problem.\n\n\
    # The First-Joiner Problem\n\nThe first-joiner problem is the result of ØMQ being\
    \ so fast at sending messages and Node.js being so fast at accepting them. Since\
    \ it takes time to establish a connection, the first puller to successfully connect\
    \ will pull many or all of the available messages before the second joiner has\
    \ a chance to get into the rotation.\n\nTo fix this problem, the pusher needs\
    \ to wait until all of the pullers are ready to receive messages before pushing\
    \ any. Let's consider a real-world scenario and how we'd solve it.\n\nSay you\
    \ have a Node cluster, the master process plans to PUSH a bunch of jobs to three\
    \ worker processes. Before the master can start pushing, the workers need a way\
    \ to signal back to the master that they're ready to start pulling jobs. They\
    \ also need a way to communicate the results of the jobs they'll eventually complete.\n\
    \nFigure 9, A Node.js cluster that pushes work to a pool of workers, on page 61\
    \ shows this scenario."
