  md: 'The viewport <meta> tag tells mobile devices that the width of the page match
    the device width (e.g., 320px on an iPhone) instead of the default, which may
    be much larger. It also tells the device to start off at a scale of 1.0, meaning
    unzoomed.


    The style sheets correspond to our dependencies; first the Bootstrap core and
    theme, and finally our own app.css file. The app.css file comes last, so we can
    easily override any styles that may have come before.


    The container class on the <body> element is a Bootstraprap. It tells Bootstrap
    to automatically grow or shrink the width of the body so it looks good at variety
    of screens.


    Next, let''s check out the bottom of index.html:


    ```

    html

    <script src="jquery/jquery.js"></script>

    <script src="bootstrap/dist/bootstrap.min.js"></script>

    <script src="typehead/dist/typehead.min.js"></script>

    <script src="handlebars/handlebars.js"></script>

    <script src="app.js"></script>

    </html>

    ```


    Like the head, this is where we bring in a bunch of dependencies and our code.
    app.js is last so we can use all the other libraries in our application logic.


    The vast middle of the index.html file contains the visual content of the application,
    as templates for rendering views. We''ll get to this, but before we do, we need
