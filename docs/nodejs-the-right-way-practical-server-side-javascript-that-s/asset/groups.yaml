    Chapter 1. Getting Started • 4


    As long as there''s something left to do, Node''s event loop will keep spinning.
    Whenever an event occurs, Node invokes any callbacks (event handlers) that are
    listening for that event.


    As a Node developer, your job is to create the callback functions that get executed
    in response to events. Any number of callbacks can respond to any event, but only
    one callback function will be executing at any time.


    Everything else your program might do—like waiting for data from a file or an
    incoming HTTP request—is handled by Node, in parallel, behind the scenes. Your
    application code will never be executed at the same time as anything else. It
    will always have the full attention of Node''s JavaScript engine while it''s running.


    ## Single-Threaded and Highly Parallel


    Other systems try to gain parallelism by running lots of code at the same time,
    typically by spawning many threads. But not Node.js. For JavaScript, Node is a
    single-threaded environment. At most, only one line of your code will ever be
    executing at any time.


    Node gets away with this by doing most I/O tasks using nonblocking techniques.
    Rather than waiting line-by-line for an operation to finish, you create a callback
    function that will be invoked when the operation eventually succeeds or fails.


    Your code should do what it needs to, then quickly hand control back over the
    event loop so Node can work on something else. We''ll develop practical examples
    of this throughout the book, starting in Chapter 2, Wrangling the File System,
    on page 9.


    If it seems strange to you that Node achieves parallelism by running only one
    piece of code at a time, that''s because it is. It''s an example of something
    I call backwardism.


    ## Backwardisms in Node.js


    A backwardism is a concept that''s so bizarre that at first it seems completely
    backwards. You''ve probably experienced many backwardisms while learning to program,
    whether you noticed it or not.


    Take the concept of a variable. In algebra it''s common to see equations like
    "7x + 3 = 24." Here, x is called variable; it has exactly one value, and your
    job is to figure out what that value is.


    Then when you start learning how to program, you quickly run into statements like
    "x = x + 7". Now x is still called a variable, but it can have any value that
    you assign to it. It can even have different values at different times.


    From algebra''s perspective, this is a backwardness. The equation "x = x + 7"
    makes no sense at all. The notion of a variable in programming is not just a little
    different—it''s 100 percent backwards. But once you understand the concept of
    assignment, the programming variable makes perfect sense.


    So it is with Node''s single-threaded event loop. From a multithreaded perspective,
    running just one piece of code at a time seems silly. But once you understand
    event-driven programming—with nonblocking APIs—it becomes clear.


    Programming is chock-full of backwardisms like these, and Node.js is no exception.
    Starting out, you''ll frequently run into code that looks like it should work
    one way, but it actually does something quite different.


    That''s OK! With this book, you''ll learn Node by making compact programs that
    interact in useful ways. As we run into more of Node''s backwardisms, we''ll dive
    into them and explore them.


    ## Aspects of Node.js Development


    Node.js is a surprisingly big subject, so let''s break it down into different
    aspects. There are many aspects of Node.js development we might talk about, ranging
    from basic JavaScript syntax to version control. This book focuses on five in
    particular:


    - Practical programming

    - Architecture and core

    - Patterns

    - JavaScriptisms

    - Supporting code


    Let''s explore each of these briefly.


    ## Practical Programming


    Practical programming is all about producing real code that does something useful.
    Interacting with a file system, establishing socket connections, or serving web
    applications are all examples of practical programming.


    Each of the remaining chapters of this book focuses on one particular practical
    domain. Through code examples specific to each domain, you''ll learn Node''s architecture,
    patterns, JavaScriptisms, and supporting code.


    ## Architecture and Core


    Understanding Node''s architecture will help you to harness its features while
    avoiding performance-crushing pitfalls. For example, Node uses an event loop written
    in C for scheduling work. But it executes application code in a JavaScript environment.
    How information is shuffled between these layers is the kind of impactful architectural
    detail you''ll learn.


    ## Patterns


    Like any successful codebase with a healthy ecosystem, Node.js has a number of
    repeating patterns. Some of these patterns are baked into the core while others
    mostly appear in third-party libraries. Examples include the use of callbacks,
    error-handling techniques, and classes like EventEmitter and Stream, which are
    used liberally for event dispatching.


    As we progress through different practical programming domains, we''ll naturally
    encounter these and other patterns. When we do, you''ll discover why they are
    useful and how to use them effectively.


    ## JavaScriptisms


    JavaScript is the language of Node programs, so you''ll be seeing quite a lot
    of it. The examples in this book make use of the latest available JavaScript features.
    Some of these features may be unfamiliar to you, even if you''ve done JavaScript
    development before.


    JavaScriptisms discussed in this book include things like the nature of functions
    and object inheritance. ECMAScript Harmony—the code name for the next version
    of the JavaScript spec—packs many new features we''ll use, too.


    ## Supporting Code


    Code does not live in isolation; it takes a village to support any individual
    program. Supporting code covers lots of things, from unit testing to performance
    benchmarks to deployment scripts.


    Node.js is a runtime environment that allows JavaScript to be executed outside
    of a browser. It is built on the V8 engine, which is the same engine that powers
    Google Chrome.


    ## Get Node.js


    To install Node.js, you have several choices. The easiest way to get Node is to
    download an installer from nodejs.org. Another popular option is Node Version
    Manager (nvm). If you''re using a Unix-like OS (like Mac OS or Linux), you can
    install nvm like so:


    ```bash

    $ curl https://raw.githubusercontent.com/nvm-sh/nvm/install.sh | bash

    ```


    Then install a specific version:


    ```bash

    $ nvm install v0.10.20

    ```


    To see what version you have, run node --version:


    ```bash

    $ node --version

    v0.10.20

    ```


    If you have trouble, you can get help on the Node mailing lists and IRC channel,
    both linked from the community page. We''ve got a lot of ground to cover, and
    we don''t have many pages to do it. So if you''re ready, let''s begin in the oh-so-familiar
    domain of file-system.


    ## Wrangling the File System


    As a programmer, chances are you''ve had to access a file system at some point:
    reading files, writing files, renaming and deleting files. We''ll start our Node.js
    journey in this familiar area, useful, asynchronous file utilities. Along the
    way we''ll explore the following aspects of Node development.


    ## Architecture and Core


    On the architecture front, you''ll see how the event loop shapes a program''s
    flow. We''ll use buffers for transporting data between Node''s JavaScript engine
    and its native core, and we''ll use Node''s module system to bring in core libraries.


    ## Patterns


    Inside our programs, we''ll use common Node patterns like callbacks for handling
    asynchronous events. We''ll harness Node''s EventEmitter and Stream classes to
    pipe data around.


    ## JavaScriptisms


    We''ll take a look at some JavaScript features and best practices like "functions
    as first-class citizens" and block scoping.


    ## Supporting Code


    You''ll learn how to spawn and interact with child processes, capture their output,
    and detect state changes.


    We''ll begin by creating a tool that watches a file for changes. This will give
    you a peek into how the event loop works while introducing Node''s file-system
    APIs.

