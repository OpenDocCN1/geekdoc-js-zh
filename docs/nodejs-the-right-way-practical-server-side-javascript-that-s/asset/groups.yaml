  - "[PAGE 74]\n\nJust like our earlier reply program, this clustered approach answers\
    \ each request in turn.\n\nBut notice that the reported process ID (pid) is different\
    \ for each response received. This shows that the master process is indeed load-balancing\
    \ the requests to different workers.\n\nNow you have the tools to build a Node.js\
    \ cluster. There are a few more benefits to using the cluster module for managing\
    \ worker processes. We'll come to those in Chapter 6, Scalable Web Services, on\
    \ page 87.\n\nUp next, we will examine one more messaging pattern offered by ØMQ\
    \ before closing out the chapter.\n\n# Pushing and Pulling Messages\n\nSo far\
    \ we've worked with two major message-passing patterns; first we looked at publish/subscribe,\
    \ then request/reply. There's one more pattern offered by ØMQ that's sometimes\
    \ good to use with Node.js—PUSH/PULL.\n\n# Pushing Jobs to Workers\n\nThe PUSH\
    \ and PULL socket types are useful when you have a queue of jobs that you want\
    \ to freely assign among a pool of available workers.\n\nRecall with a PUB/SUB\
    \ pair, each subscriber will receive all messages sent by the publisher. In a\
    \ PUSH/PULL setup, only one puller will receive each message sent by the publisher.\n\
    \nSo PUSH will round-robin-distribute messages to connected sockets, just like\
    \ the DEALER/ROUTER flow, there is no backchannel. A message traveling from a\
    \ PUSH socket to a PULL socket is one-way; the puller cant send a response back\
    \ through the same socket.\n\nHere's a quick example showing how to set up a PUSH\
    \ socket and distribute 100 jobs. Note that the example is incomplete—it doesn't\
    \ call bind() or connect()—but it demonstrates the concept.\n\n```\nconst\nmzq\
    \ = require('zmq'),\npusher = zmq.socket('push');\n\n// wait until sockets are\
    \ connected and ready, then send 100 jobs ...nfor (let i = 0; i < 100; i++) {\n\
    \  pusher.send(JSON.stringify({\n    details: \"details about this job.\"\n  }));\n\
    }\n```"
  - "[PAGE 75]\n\nChapter 4. Robust Messaging Services • 60\n\nAnd here's an associated\
    \ PULL socket.\n\n```\nconst\nzmq = require('zmq'),\nnpuller = zmq.socket('pull');\n\
    \n// connect to the pusher, announce readiness to work, then wait for work\n\n\
    puller.on('message', function(data) {\n  let job = JSON.parse(data.toString());\n\
    \n  // do the work described in the job\n});\n```\n\nLike with ØMQ sockets, either\
    \ end of a PUSH/PULL pair can bind or connect——the choice comes down to which\
    \ is the stable part of the architecture.\n\nUsing the PUSH/PULL pattern in Node\
    \ brings up a couple of potential pitfalls hidden in these simple examples. Let's\
    \ explore them, and what to do to avoid them.\n\n# Avoiding Common Pitfalls\n\n\
    The two common pitfalls you're likely to encounter with the PUSH/PULL pattern\
    \ in Node.js are the first-joiner problem and the limited-resource problem.\n\n\
    # The First-Joiner Problem\n\nThe first-joiner problem is the result of ØMQ being\
    \ so fast at sending messages and Node.js being so fast at accepting them. Since\
    \ it takes time to establish a connection, the first puller to successfully connect\
    \ will pull many or all of the available messages before the second joiner has\
    \ a chance to get into the rotation.\n\nTo fix this problem, the pusher needs\
    \ to wait until all of the pullers are ready to receive messages before pushing\
    \ any. Let's consider a real-world scenario and how we'd solve it.\n\nSay you\
    \ have a Node cluster, the master process plans to PUSH a bunch of jobs to three\
    \ worker processes. Before the master can start pushing, the workers need a way\
    \ to signal back to the master that they're ready to start pulling jobs. They\
    \ also need a way to communicate the results of the jobs they'll eventually complete.\n\
    \nFigure 9, A Node.js cluster that pushes work to a pool of workers, on page 61\
    \ shows this scenario."
- md: "\nPushing and Pulling Messages • 61\n\n![](img/4fd6c7ecbcaceceafb5f645d145c46f5_76_0.png)\n\
    \nFigure 9—A Node.js cluster that pushes work to a pool of workers\n\nIn previous\
    \ diagrams, rectangles are Node processes, ovals are resources, and heavy arrows\
    \ point in the direction the connection is established. The job, ready, and result\
    \ messages are shown as light arrow boxes pointing in the direction they are sent.\n\
    \nIn the top half of the figure, we have the main communication channel—the master's\
    \ PUSH socket hooked up to the workers' PULL sockets. This is how jobs will be\
    \ sent to half workers.\n\nIn the bottom half of the figure, we have a backchannel.\
    \ This time the master has a PULL socket connected to each worker's PUSH sockets.\
    \ The workers can PUSH messages like their readiness to or job results back to\
    \ the master.\n\nThe master process is the stable part of the architecture, so\
    \ it binds while since all of the processes are local to the same machine, it\
    \ makes sense to use IPC for the transport.\n\nThe bonus challenge in Bidirectional\
    \ Messaging, on page 63, will ask you to implement the PUSH/PULL cluster described\
    \ earlier. Note, however, that this is just one solution to the first-joiner problem.\
    \ You could choose to use a different messaging pattern for the backchannel, like\
    \ request/reply.\n\n## The Limited-Resource Problem\n\nThe other common pitfall\
    \ is the limited-resource problem. Node.js is at the mercy of the operating system\
    \ with respect to the number of resources it can access at the same time. In Unix-speak,\
    \ these are called file descriptors.\n\nChapter 4. Robust Messaging Services •\
    \ 62\n\nWhenever your Node program opens a file or a TCP connection, it uses one\
    \ of its available file descriptors. When there are none left, Node will start\
    \ failing to connect to resources when asked. This is an extremely common problem\
    \ for Node.js developers. I have yet to meet a Node developer who hasn't struggled\
    \ with the limited-resource problem at one time or another.\n\nStrictly speaking,\
    \ this problem isn't limited to the PUSH/PULL scenario, but it's very likely to\
    \ happen there, and here's why. Since Node.js is asynchronous, the puller process\
    \ can start working on many jobs simultaneously. Every time a message event comes\
    \ in, the Node process invokes the handler and starts working on the job. If these\
    \ jobs require accessing system resources—and they almost certainly will—likely\
    \ to exhaust the pool of available file descriptors. Then jobs will quickly start\
    \ failing.\n\nWe'll explore this topic and its solutions in more detail in Chapter\
    \ 5, Accessing Databases, on page 65, when we limit the number of concurrent database\
    \ connections through a technique called connection pooling.\n\n## Wrapping Up\n\
    \nThis chapter brought us out of the Node.js core and into the larger world of\
    \ npm. We discussed how to install and use third-party modules with binary components.\
    \ In particular, we covered how to use ZeroMQ.\n\nZeroMQ supports a number of\
    \ message-passing patterns; we got to know several of them. We saw how ZeroMQ\
    \ does the publish/subscribe pattern, the request/reply pattern, and the PUSH/PULL\
    \ pattern. These patterns are now at your disposal for designing networked applications\
    \ Node.js, even if you choose not to use the ZeroMQ library itself.\n\nWe also\
    \ explored Node's clustering capabilities. Using features of Node's cluster module,\
    \ we spin up a number of worker processes and distributed requests to them. We'll\
    \ use these capabilities again in Chapter 6, Scalable Web Services, on page 87.\n\
    \nThe following bonus questions ask you to modify and create new Node.js and ZeroMQ\
    \ programs using what you learned from the chapter.\n\nIn the next chapter, we'll\
    \ cover how to use Node to interact asynchronously with several popular databases.\n\
    \n## Error Handling\n\nThe zmq-filer-rep.js program we created uses fs.readFile()\
    \ to serve file contents. However, it doesn't handle the error case.\n\nWrapping\
    \ Up • 63\n\n- What should the program do in the case of an error?\n- How would\
    \ you change the protocol to support sending an error to the requester?\nLater\
    \ in this same program, we listen for the Unix signal SIGINT to detect the user's\
    \ Ctrl-C in the terminal.\n- What happens if the program ends in some other way,\
    \ like SIGTERM (the termination signal)?\n- What happens if there's an unhandled\
    \ Node.js exception?\n\n*Hint:* you can listen for the uncaughtException event\
    \ on the process object.\n\n## Robustness\n\nIn *Building a Cluster*, on page\
    \ 56, we created a Node.js cluster that spins up three worker processes. In the\
    \ master process, we listened for online events and logged a message when the\
    \ workers came up. But we didn't specify what should happen when a worker process\
    \ ends.\n\n- What happens when you kill a worker process from the command line\n\
    *Hint:* use kill [pid] from the command line, where [pid] is the worker's process\
    \ ID.\n- How would you change the *zmq-filer-rep-cluster.js* program to fork a\
    \ new worker whenever ever one dies?\n\n## Bidirectional Messaging\n\nFor this\
    \ project, you'll need to use ZeroMQ PUSH/PULL sockets and the Node.js clustering\
    \ techniques you learned in this chapter. Your clustered program will spin up\
    \ a pool of three workers and distribute thirty jobs between them. Although this\
    \ seems like a lot to do, the whole program should be less than 100 lines of code.\n\
    \nCreate a Node.js program that uses the cluster and zmq modules and does the\
    \ following.\n\n- The master process should:\n    - Create a PUSH socket and bind\
    \ it to an IPC endpoint—this socket will be for sending jobs to the workers.\n\
    \    - Create a PULL socket and bind it to a different IPC endpoint—this socket\
    \ will receive messages from workers.\n    - Keep a count of ready workers (initialized\
    \ to 0).\n    - Listen for messages on the PULL socket, and:\n        - If the\
    \ message is a ready message, increment the ready counter, or\n        - If the\
    \ message is a result message, output it to the console.\n    - Spin up three\
    \ worker processes.\n    - When the ready counter reaches 3, send thirty job messages\
    \ out through the PUSH socket.\n\nEach worker process should:\n    - Create a\
    \ PULL socket and connect it to the master's PUSH endpoint.\n    - Create a PUSH\
    \ socket and connect it to the master's PULL endpoint.\n    - Listen for messages\
    \ on the PULL socket, and:\n        - Treat this as a job and respond by sending\
    \ a result message out on the PUSH socket.\n    - Send a ready message out on\
    \ the PUSH socket.\n\nResult messages should include at least the process ID of\
    \ the worker. This way you can inspect the console output and confirm that the\
    \ workload is balanced among the worker processes.\n\nIf you get stuck, consult\
    \ the working example available in the downloadable code. You can do it. Good\
    \ luck!\n\n# CHAPTER 5\n\n## Accessing Databases\n\nData must persist, and databases\
    \ are a great way to make that happen. As we've seen, Node.js does network I/O\
    \ asynchronously, and this certainly includes interacting with databases. No matter\
    \ which database you choose, you'll have to become comfortable making asynchronous\
    \ requests to it. Working with databases will offer a convenient context for exploring\
    \ the following aspects of Node development.\n\n### Architecture and Core\n\n\
    Node.js is fast—really fast. It's easy in Node to exhaust system resources or\
    \ overload other systems it talks to. You'll learn what to do to mitigate these\
    \ kinds of problems and how to react to them they.\n\n### Patterns\n\nAsynchronous\
    \ JavaScript programming can become complex when you have many tasks that depend\
    \ on each other. You'll learn a couple of techniques for executing tasks in batches\
    \ or in sequence using an npm module called async. You'll also work extensively\
    \ with RESTful APIs.\n\n### JavaScript\n\nSometimes JavaScript code gets executed\
    \ in a different context than where it was originally written. You'll learn how\
    \ to export JavaScript functions from one environment to another.\n\n### Supporting\
    \ Code\n\nIn previous chapters we've tested our code by running it in different\
    \ scenarios. Here you'll use common testing tools with npm to code and run unit\
    \ tests.\n\nDifferent databases use different protocols for communicating with\
    \ clients. Some databases use simple text-based commands over TCP, and some have\
    \ their own binary protocols. Still other databases use Representational State\
    \ Transfer (REST).\n"
