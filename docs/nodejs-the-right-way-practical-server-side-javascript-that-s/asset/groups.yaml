- md: "\n# Trading Synchronicity at Scale\n\nThere is a catch to using ZeroMQ REP/REQ\
    \ socket pairs with Node. Each end-point of the application operates on only one\
    \ request or one response at time. There is no parallelism.\n\nWe can see this\
    \ in action by making a small change to the requester program. Open the zmq-filer-req.js\
    \ file from last session. Find the code that sends the request and wrap it in\
    \ a loop like this:\n\n```javascript\nfor (let i=1; i<=3; i++) {\n  console.log('Sending\
    \ request ' + i + ' for ' + filename);\n  requester.send(JSON.stringify({\n  \
    \  path: filename\n  }));\n}\n```\n\nSave this file as zmq-filer-req-loop.js.\
    \ With the responder still running\n\n```\n$ node --harmony zmq-filer-req-loop.js\
    \ target.txt\nSending request 1 for target.txt\nSending request 2 for target.txt\n\
    Sending request 3 for target.txt\nReceived response: { content: '', timestamp:\
    \ 13703018661442, pid: 35925 }\nReceived response: { content: '', timestamp: 13703018661444,\
    \ pid: 35925 }\nReceived response: { content: '', timestamp: 13703018661447, pid:\
    \ 35925 }\n```\n\nWe see that the loop queued three requests, and we received\
    \ three responses. This shouldn't be too surprising, but let's take a look at\
    \ the responder window:\n\n```\n$ node --harmony zmq-filer-req.js\nListening for\
    \ zmq requesters...\nReceived request to get: target.txt\nSending response content\n\
    Received request to get: target.txt\nSending response content\nReceived request\
    \ to get: target.txt\nSending response content\n```\n\nThe responder program sent\
    \ a response to each request before even aware of the next queued request. This\
    \ means Node's event loop is left spinning while the fs.readFile() for each request\
    \ is being processed.\n\nFor this reason, a simple REQ/REP pair is probably not\
    \ going to suit your high-performance Node.js needs. Next we'll construct a cluster\
    \ of Node processes using more advanced ZeroMQ socket types to scale up our throughput.\n\
    \n# Routing and Dealing Messages\n\nThe REQ/REP pair we explored makes request/reply\
    \ logic easy to code by operating sequentially. A given requester or responder\
    \ will only ever be aware of one message at a time. ZeroMQ includes the more advanced\
    \ socket types ROUTER and DEALER. Let's explore these bit; then we'll be ready\
    \ to construct our Node.js cluster.\n\n# Routing Messages\n\nYou can think of\
    \ a ROUTER socket as a parallel REP socket. Rather than replying to only one message\
    \ at a time, a ROUTER socket can handle many requests simultaneously. It remembers\
    \ which connection each request came from and will route messages accordingly.\n\
    \nRecall from Implementing a Messaging Protocol, on page 28, any time you do networked\
    \ programming, you're working with one or more protocols. ZeroMQ uses the ZeroMQ\
    \ Message Transport Protocol for exchanging messages. This protocol uses a sequence\
    \ of low-overhead *frames* to compose messages. The ROUTER socket uses these frames\
    \ to route reply message back to the connection that issued the request.\n\nMost\
    \ of the time your Node programs can ignore the underlying details of ZeroMQ frames\
    \ because the simpler socket types only need one frame per message. But the ROUTER\
    \ socket type uses multiple frames.\n\nHere's an example of how to create a ROUTER\
    \ socket in Node, with a handler that handles all the incoming messages.\n\n```javascript\n\
    const zmq = require('zmq');\nrouter = zmq.socket('router');\nrouter.on('message',\
    \ function() {\n  let frames = Array.prototype.slice.call(null, arguments);\n\
    // ...\n});\n```\n\nPreviously, our message handlers would take a data parameter,\
    \ but notice how this handler function doesn't take any. The zmq module actually\
    \ passes all the frames for a message to the handler as arguments to the handler\
    \ function. It can do this because JavaScript functions are variadic—they can\
    \ receive any number of arguments when called.\n\nThe arguments object inside\
    \ a function is an array-like object that contains all the arguments that were\
    \ passed in. Using Array.prototype.call(null, arguments) returns a real JavaScript\
    \ Array instance with the same contents.\n\nNow that we can get all the frames,\
    \ let's look at the DEALER socket type.\n\n# Dealing Messages\n\nIf a ROUTER socket\
    \ is a parallel REP socket, then a DEALER is a parallel REQ. A DEALER socket can\
    \ send multiple requests in parallel.\n\nLet's see how a dealer and router work\
    \ together in Node. Take a look at this code sample:\n\n```javascript\nconst zmq\
    \ = require('zmq'),\nrouter = zmq.socket('router'),\ndealer = zmq.socket('dealer');\n\
    \nrouter.on('message', function() {\n  let frames = Array.prototype.slice.call(null,\
    \ arguments);\n  dealer.send(frames);\n});\ndealer.on('message', function() {\n\
    \  let frames = Array.prototype.slice.call(null, arguments);\n  router.send(frames);\n\
    });\n```\n\nHere we create both a ROUTER socket and a DEALER socket. Whenever\
    \ either receives a message, it strips out the frames and sends them to the other\
    \ socket.\n\nThis means incoming requests to the router will be passed to the\
    \ dealer to send out to its connections. Likewise, incoming replies to the dealer\
    \ will be forwarded back to the router, which directs each reply back to the connection\
    \ that requested it.\n\nThe code sample doesn't include any calls to bind() or\
    \ connect(), so it's not a functional example yet. Even so, you can see the basic\
    \ structure we're after Figure 7, A Node.js program using both ROUTER and DEALER\
    \ ZMQ sockets, on page 54.\n\nThe box in the center of the figure is the Node\
    \ program. An incoming REQ socket connects to the ROUTER. When it issues a request\
    \ message, the ROUTER bounces it over to the DEALER. The DEALER picks one of the\
    \ REP sockets connected to it to forward the request.\n\n![](img/4fd6c7ecbcaceceafb5f645d145c46f5_69_0.png)\n\
    \nFigure 7—A Node.js program using both ROUTER and DEALER ZeroMQ sockets\n\nWhen\
    \ the REP connection produces a reply, it follows the reverse route. The DEALER\
    \ receives the reply and bounces it back to the ROUTER. The ROUTER looks at the\
    \ message's frames to determine its origin and sends the reply back to the connected\
    \ REQ that sent it. From the perspective of the REQ, nothing has changed. Now\
    \ it's time to put these new types to use.\n\n# Clustering.js Processes\n\nIn\
    \ multithreaded systems, doing more in parallel is common. But Node.js uses a\
