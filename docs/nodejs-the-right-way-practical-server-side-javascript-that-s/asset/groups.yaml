    \n```bash\n$ npm install -g bower\n```\n\n然后安装 Bower 组件：\n\n```bash\n$ bower install\n\
    ```\n\n现在你应该拥有一个包含上述所有内容的 `bower_components/` 目录。\n\n## 构建单页应用 (Single-Page App)\n\
    \n在服务器准备好提供静态内容，且 Bower 组件已就绪后，我们可以组装单页应用的主入口点：`index.html` 文件。以下是该文件的头部：\n\n\
    ```html\nweb-app/b4/static/index.html\n<!doctype html>\n<html>\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>b4b - 更好的书籍束构建器</title>\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n<link rel=\"stylesheet\"\
    \ href=\"bootstrap/dist/bootstrap.min.css\">\n<link rel=\"stylesheet\" href=\"\
    bootstrap/dist/bootstrap-theme.min.css\">\n<link rel=\"stylesheet\">\n<link rel=\"\
    stylesheet\" href=\"typeahead.js-bootstrap.css/typeahead.js-bootstrap.css\">\n\
    <link rel=\"stylesheet\" href=\"app.css\">\n</head>\n<body class=\"container\"\
    >\n```\n\n第一行 `<!doctype html>` 告诉浏览器这是一个 HTML5 文档。然后我们进入文档的 `<head>` 部分，它包含标题、一些\
    \ `<meta>` 标签以及许多样式表。\n\n`viewport` `<meta>` 标签告诉移动设备页面宽度要与设备宽度（例如 iPhone 上的 320px）匹配，而不是默认的可能大得值。它还告诉设备从\
    \ 1.0 的缩比例开始，即不缩放。\n\n样式表对应于我们的依赖项；首先是 Bootstrap 核心和主题，最后是我们自己的 `app.css` 文件。`app.css`\
    \ 文件放在最后，这样我们就可以轻松覆盖之前出现的任何样式。\n\n`<body>` 元素上的 `container` 类是 Bootstrap 的特性。它告诉\
    \ Bootstrap 自动扩展或收缩 `body` 的宽度，使其在各种屏幕上看起来都很良好。\n\n接下来，让我们来看 `index.html` 的底部：\n\
    \n```html\n<script src=\"jquery/jquery.js\"></script>\n<script src=\"bootstrap/dist/bootstrap.min.js\"\
    ></script>\n<script src=\"typehead/dist/typehead.min.js\"></script>\n<script src=\"\
    handlebars/handlebars.js\"></script>\n<script src=\"app.js\"></script>\n</html>\n\
    ```\n\n与 `<head>` 部分一样，这里引入了大量的依赖项和我们的代码。`app.js` 放在最后，以便我们可以在应用程序逻辑中使用所有其他库。\n\
    \n`index.html` 文件的中间大部分包含了应用程序的视觉内容，作为渲染视图的模板。我们将会介绍这一点，但在那之前，我们还需要几个 API。\n\n\
    具体来说，我们需要用于执行用户特定操作的认证端点（authenticated endpoints）。我们接下来开发这些内容，然后返回客户端将它们全部整合在一起。\n\
    \n## 使用 Passport 进行身份验证\n\nPassport 是一个 Express 插件，为各种第三方登录提供了中间件支持。使用 Passport，你可以无缝地添加对\
    \ Twitter、Facebook 等服务的登录支持。\n\n我们将使用 Passport 来支持使用 Google 凭据进行身份验证。如果你还没有这些模块，请从\
