- md: "\nstandard output from the child process directly to our own standard output\
    \ stream. This is what the pipe() method does.\n\nSometimes you'll capture data\
    \ from a stream, rather than just piping it forward. Let's see how to do that.\n\
    \n## Capturing Data from an EventEmitter\n\nEventEmitter is a very important class\
    \ in Node.⁴ It provides a channel for events to be dispatched and listeners notified.\
    \ Many objects you'll encounter in Node inherit from EventEmitter, like the Streams\
    \ we saw in the last section.\n\nNow let's modify our previous program to capture\
    \ the child process's output by listening for events on the stream. Open an editor\
    \ to the watcher-spawn.js file from the previous section, spawn-js, find the call\
    \ to fs.watch(). Replace it with:\n\n```javascript\nfile-system/watcher-spawn.js\n\
    fs.watch(filename, function() {\n  let ls = spawn('ls', ['-lh', filename]),\n\
    \  output = '';\n  ls.stdout.on('data', function(chunk){\n    output += chunk.toString();\n\
    \  });\n\n  ls.on('close', function() {\n    let parts = output.split(/\\s+/);\n\
    \    console.dir([parts[0], parts[4], parts[8]]);\n  });\n});\n```\n\nSave this\
    \ file as watcher-spawn-parse.js. Run it as usual, touch the target file in a\
    \ separate terminal. You should see output something like this:\n\n```\n$ node\
    \ --harmony watcher-spawn-parse.js target.txt\nNow watching target.txt for changes...\n\
    [ '-rw-r--r-', '0B', 'target.txt' ]\n```\n\nThe new callback starts out the same\
    \ as before, creating a child process and assigning it to a variable called. It\
    \ also creates an output variable, which will buffer the output coming from the\
    \ child process.\n\nNext we add event listeners. An event listener is a callback\
    \ function that is invoked when an event of a specified type is dispatched. Since\
    \ the Stream class inherits from EventEmitter, we can listen for events for the\
    \ child process's standard output stream.\n\n> ⁴ http://nodejs.org/api/events.html\n\
    \n```javascript\nls.stdout.on('data', function(chunk) {\n  output += chunk.toString();\n\
    });\n```\n\nThe on() method adds a listener for the specified event type. We listen\
    \ for data events because we are interested in data coming out of the stream.\n\
    \nEvents can send along extra information, which arrives in the form of parameters\
    \ to the callbacks. Data events in particular pass along a buffer object. Each\
    \ time we get a chunk of data, we append it to our output.\n\nA Buffer is Node's\
    \ way of representing binary data. It points to a blob of memory allocated by\
    \ Node's native core, outside of the JavaScript engine. Buffers can be resized\
    \ and they require encoding and decoding to convert to from JavaScript strings.\n\
    \nCalling toString() explicitly converts the buffer's contents to a JavaScript\
    \ string using Node's default encoding (UTF-8). This means copying the content\
    \ into Node's heap, which can be a slow operation, relatively speaking. If you\
    \ can, it's better to work with buffers directly, but strings are more convenient.\n\
    \nStream, the ChildProcess class extends EventEmitter, so we can add listeners\
    \ to it, as well.\n\n```javascript\nls.on('close', function() {\n  let parts =\
    \ output.split(/\\s+/);\n  console.dir([parts[0], parts[4], parts[8]]);\n});\n\
    ```\n\nAfter a child process has exited and all its streams have been flushed,\
    \ it emits a close event. When the callback printed here is invoked, we parse\
    \ the output data by splitting on sequences of one or more whitespace characters\
    \ (using the regular expression /\\s+/). Finally, we use console.dir() to report\
    \ on the first, fifth, and ninth fields (indexes 0, 4, and 8), which correspond\
    \ to the permissions, size, and file name, respectively.\n\nWe've seen a lot of\
    \ Node's features in this small problem space of file-watching. You now know how\
    \ to use Node classes, including EventEmitter, Stream, ChildProcess, and Buffer.\
    \ You also have firsthand experience writing asynchronous call-back functions\
    \ and coding for the event loop.\n\nLet's expand on these concepts in the next\
    \ phase of our file-system journey: reading and writing files.\n\n5. http://nodejs.org/api/buffer.html\n\
    \n## Reading and Writing Files Asynchronously\n\nEarlier in this chapter, we wrote\
    \ a series of Node programs that could watch files for changes. Now let's explore\
    \ Node's methods for reading and writing files. Along the way we'll see two common\
    \ error-handling patterns in Node: error events on EventEmitters and err callback.\n\
    \nThere are a few approaches to reading and writing files in Node. The simplest\
    \ way is to read or write the entire file at once. This technique works well for\
    \ small files. Other approaches read and write by creating Streams or staging\
    \ content in a buffer. Here's an example of whole-file-at-once approach:\n\n```javascript\n\
    file-system/read-simple.js\nconst fs = require('fs');\nfs.readFile('target.txt',\
    \ function (err, data) {\n  if (err) {\n    throw err;\n  }\n  console.log(data.toString());\n\
    });\n```\n\nSave this file as read-simple.js and run it as usual with node --harmony:\n\
    \n```\n$ node --harmony read-simple.js\n```\n\nYou'll see the contents of target.txt.\
    \ If the file is empty, you'll see a blank line. Notice how the first parameter\
    \ to the callback handler is err. If readFile() is successful, then err will be\
    \ false. Otherwise the err parameter will contain an Error object. This is a common\
    \ pattern in Node, especially for built-in modules. In our example's case, we\
    \ throw the error if there was one by halting the event loop.\n\nWriting a file\
    \ using whole-file approach is similar. Here's an example:\n\n```javascript\n\
    file-system/write-simple.js\nconst fs = require('fs');\nfs.writeFile('target.txt',\
    \ 'a witty message', function (err) {\n  if (err) {\n    throw err;\n  }\n  console.log(\"\
    File saved!\");\n});\n```\n\nThis program writes \"a witty message\" to target.txt\
    \ (creating it if it doesn't exist, or overwriting if it does). If any reason\
    \ the file couldn't be written, then the err parameter will contain an Error object.\n\
    \n## Creating Read and Write Streams\n\nYou create a read stream or a write stream\
    \ by using fs.createReadStream() and fs.createWriteStream(), respectively. For\
    \ example, here's a very short program called cat.js. It uses a stream to pipe\
    \ file's data to standard output:\n\n```javascript\nfile-system/cat.js\n#!/usr/bin/env\
    \ node --harmony\nrequire('fs').createReadStream(process.argv[2]).pipe(process.stdout);\n\
    ```\n\nBecause the first line starts with /, you can execute this program directly\
    \ in Unix-like systems. It doesn't need to be passed into the node. Use chmod\
    \ to make executable:\n\n```\n$ chmod cat.js\n```\n\nThen, to run it, send the\
    \ name of the chosen file as an additional argument:\n\n```\n$ ./cat.js <file_name>\n\
    ```\n\nThe code in cat.js does not bother assigning the fs module to a variable.\
    \ The require() function returns a module object, so we can call methods on it\
    \ directly. You can also listen for data events from the stream instead of calling\
    \ pipe(). The following program called read-stream.js does this:\n\n```javascript\n\
    file-system/read-stream.js\nconst fs = require('fs');\nstream = fs.createReadStream(process.argv[2]);\n\
    stream.on('data', function (chunk) {\n  process.stdout.write(chunk);\n});\nstream.on('error',\
    \ function (err) {\n  process.stderr.write(\"ERROR: \" + err.message + \"\\n\"\
    );\n});\n```\n\nHere we use process.stdout.write() to echo data, rather than console.log().\
    \ The incoming data chunks already contain any newline characters from the input\
    \ file. We don't need the extra line that console.log() would add.\n\nWhen working\
    \ with an EventEmitter, the way to handle errors is to listen to error events.\
    \ Let's trigger an error to see what happens. Run the program, but specify a file\
    \ that doesn't exist:\n\n```\n$ node --harmony read-stream.js no-such-file\nERROR:\
    \ ENOENT, open 'no-such-file'\n```\n\nSince're listening for error events, Node\
    \ invokes our handler (and then proceeds to exit normally). If you don't listen\
    \ for error events, but one happens anyway, Node will throw an exception. And\
    \ as we saw before, an uncaught exception will cause the process to terminate.\n\
    \n## Blocking the Event Loop with Synchronous File Access\n\nThe file-access methods\
    \ we discussed in this chapter so far are asynchronous. They perform the I/O duties—waiting\
    \ as necessary—completely in the background, only to invoke callbacks later. This\
    \ is the preferred way to I/O in Node.\n\nEven so, many of the methods in the\
    \ fs module have synchronous versions as well. These end in *Sync, like readFile,\
    \ for example. Doing synchronous file access might look familiar to you if you\
    \ haven't done a lot of asynchronous development in the past. However, it comes\
    \ at a substantial cost.\n\nWhen we use the *Sync methods, the Node.js process\
    \ will block until the I/O finishes. This means Node won't execute any other code,\
    \ won't trigger any callbacks, won't process any events, won't accept any connections—nothing—it'll\
    \ just sit there indefinitely waiting for the operation to complete.\n\nHowever,\
    \ synchronous methods are simpler to use since they lack the callback step. They\
    \ either return successfully or throw an exception, without the need for a callback\
    \ function. There are actually cases where this style of access is OK; we'll discuss\
    \ them in the next section.\n\nHere's an example of how to read a file using the\
    \ readFile method:\n\n```javascript\nconst fs = require('fs');\ndata = fs.readFileSync('target.txt');\n\
    process.stdout.write(data.toString());\n```\n\nThe return value of readFileSync()\
    \ is a buffer—the same as the parameter passed to callbacks of the asynchronous\
    \ readFile() method we saw before.\n"
  mdcn: "\n将子进程的标准输出直接重定向到我们自己的标准输出流中。这就是 `pipe()` 方法所的作用。\n\n有时候，你需要从流中捕获数据，而不仅仅是将其向前传递。让我们来看看如何实现。\n\
    \n## 从 EventEmitter 捕获数据\n\nEventEmitter 是 Node.⁴ 中一个非常重要的类。它提供了一个用于分发事件和通知监听器的通道。你在\
    \ Node 中会遇到的很多对象都继承自 EventEmitter，就像我们在上一节中看到的 Streams（流）一样。\n\n现在，让我们修改之前的程序，通过通过监听流上的事件来捕获子进程的输出。打开前一节中的\
    \ `watcher-spawn.js` 文件（即 `spawn-js`），找到对 `fs.watch()` 的调用。将其替换为：\n\n```javascript\n\
    file-system/watcher-spawn.js\nfs.watch(filename, function() {\n  let ls = spawn('ls',\
    \ ['-lh', filename]),\n  output = '';\n  ls.stdout.on('data', function(chunk){\n\
    \    output += chunk.toString();\n  });\n\n  ls.on('close', function() {\n   \
    \ let parts = output.split(/\\s+/);\n    console.dir([parts[0], parts[4], parts[8]]);\n\
    \  });\n});\n```\n\n将此文件保存为 `watcher-spawn-parse.js`。照常运行它，在另一个终端中 `touch` 目标文件。你应该看到类似这样的输出：\n\
    \n```\n$ node --harmony watcher-spawn-parse.js target.txt\nNow watching target.txt\
    \ for changes...\n[ '-rw-r--r-', '0B', 'target.txt' ]\n```\n\n新的回调函数开头与之前相同，创建一个子进程并将其赋值给一个变量。它还创建了一个\
    \ `output` 变量，用于缓冲来自子进程的输出。\n\n接下来，我们添加事件监听器。事件监听器是一个回调函数，当指定类型的事件被分发时就会会被调用。由于\
    \ Stream 类继承自 EventEmitter，因此我们可以监听子进程标准输出流的事件。\n\n> ⁴ http://nodejs.org/api/events.html\n\
    \n```javascript\nls.stdout.on('data', function(chunk) {\n  output += chunk.toString();\n\
    });\n```\n\n`on()` 方法为指定的事件类型添加监听器。我们监听 `data` 事件，是因为我们对流中输出的数据感兴趣。\n\n事件可以随带额外信息，这些信息以参数的形式传递给回调。特别是\
    \ `data` 事件会传递一个 `buffer` 对象。每当我们获得一个数据块时，就会将其追加到我们的 `output` 中。\n\n`Buffer` 是\
    \ Node 表示二进制数据的方式。它指向由 Node 原生核心分配的一块内存，位于 JavaScript 引擎之外。`Bufffer` 可以调整大小，并且需要通过编码和解码来与\
    \ JavaScript 字符串进行转换。\n\n显式调用 `toString()` 会使用 Node 的默认编码（UTF-8）将缓冲区的内容转换为 JavaScript\
    \ 字符串。这意味着将内容复制到 Node 的堆内存中，从相对意义上说这是一个较慢的操作。如果可以，直接处理 `bufffer` 会更好，但字符串更方便。\n\
    \n`Stream` 类和 `ChildProcess` 类都继承自 `EventEmitter`，因此我们也可以为它们添加监听器。\n\n```javascript\n\
    ls.on('close', function() {\n  let parts = output.split(/\\s+/);\n  console.dir([parts[0],\
    \ parts[4], parts[8]]);\n});\n```\n\n当子进程退出且其所有流都已刷新（flush）后，它会触发一个 `close` 事件。当这里的回调被调用时，我们通过分割一个或多个空白字符序列（使用正则表达式\
    \ `/\\s+/`）来解析输出数据。最后，我们使用 `console.dir()` 来报告第一、第五和第九字段（索引为 0、4 和 8），它们分别对应于权限、大小和文件名。\n\
    \n在文件监控这个很小的问题空间内，我们已经看到了 Node 的许多功能。你现在已经知道了如何使用 Node 类，包括 `EventEmitter`、`Stream`、`ChildProcess`\
    \ 和 `Buffer`。你还拥有编写异步回调函数和为事件循环编写代码的亲身经验。\n\n让我们在文件系统之旅的下一阶段扩展这些概念：读取和写入文件。\n\n\
    5. http://nodejs.org/api/buffer.html\n\n## 异步读写文件\n\n在本章早的早些时候，我们编写了一系列可以监控文件变化的\
    \ Node 程序。现在，让我们探索 Node 读写文件的方法。在此，我们将看到 Node 中两种常见的错误处理模式：`EventEmitter` 上的 `error`\
    \ 事件和 `err` 回调。\n\n在 Node 中读写文件有几种方法。最简单的方法是一次读取或写入整个文件。这种技术对于小文件效果良好。其他方法通过创建\
    \ `Streams` 或在 `buffer` 中分阶段内容来读写。这里是一个一次性处理整个文件方法的示例：\n\n```javascript\nfile-system/read-simple.js\n\
    const fs = require('fs');\nfs.readFile('target.txt', function (err, data) {\n\
    \  if (err) {\n    throw err;\n  }\n```\n\n"
