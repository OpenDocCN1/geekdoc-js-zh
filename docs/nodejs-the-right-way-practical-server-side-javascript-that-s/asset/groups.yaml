  - "[PAGE 46]\n\n# Creating Socket Client Connections\n\nSo far in this chapter,\
    \ we've explored the server side of Node sockets. Here we'll write a client program\
    \ in Node to receive JSON messages from our net-watcher-json-service program.\
    \ We'll start with a naive implementation, and then improve it through the rest\
    \ of the chapter.\n\nOpen an editor and insert this:\n\n```\n```javascript/net-watcher-json-client.js\n\
    use strict;\nconst\nnet = require('net');\nclient = net.connect({port: 5432});\n\
    client.on('data', function(data) {\n  let message = JSON.parse(data);\n  if (message.type\
    \ === 'watching') {\n    console.log(\"Now watching: \" + message.file);\n  }\
    \ else if (message.type === 'changed') {\n    let date = new Date(message.timestamp);\n\
    \    console.log(\"File '\" + message.file + \" changed at '\" + date);\n  } else\
    \ {\n    throw Error(\"Unrecognized message type: \" + message.type);\n  }\n});\n\
    ```\n```\n\nSave this program as net-watcher-json-client.js.\n\nThis short program\
    \ uses net.connect() to create a client connection to localhost port 5432, then\
    \ waits for data. The client object is a Socket, just like the incoming connection\
    \ we saw on the server side.\n\nWhenever a data event happens, our callback function\
    \ takes the incoming buffer object, parses the JSON message, and then logs an\
    \ appropriate message to the console.\n\nTo run the program, make sure that the\
    \ net-watcher-json-service is running. In another terminal, run the client:\n\n\
    ```\n$ node --harmony net-watcher-json-client.js\nNow watching: target.txt\n```\n\
    \nIf you touch the target file, you'll see output like this:\n\nFile 'target.txt'\
    \ changed at Mon Jan 14 2013 19:35:14 GMT-0500 (EST)\n\nSuccess! This program\
    \ works, but it's far from perfect. Consider what happens when the connection\
    \ ends or if it fails to connect in the first place. This program-only listens\
    \ for data events, not end events or error events. We could listen for these events\
    \ and take appropriate action when they happen."
  - "[PAGE 47]\n\nBut there's actually a deeper problem lurking in our code—caused\
    \ by assumptions we've made about message boundaries. In the next section we'll\
    \ develop a test that exposes this bug so we can fix it.\n\n# Testing Network\
    \ Application Functionality\n\nFunctional tests assure that our code does what\
    \ we expect it to do. In this section, we'll develop a test for our networked\
    \ file-watching server and client programs. We'll create a mock server that conforms\
    \ to the LDJ protocol while exposing flaws in the client.\n\nAfter we write the\
    \ test, we'll fix the client code so that it passes. This will bring many Node\
    \ concepts, include extending core classes, creating and using custom modules,\
    \ and developing on top of EventEmittermitters. But first we need to understand\
    \ a problem lurking in our client/server programs as currently written.\n\n# Understanding\
    \ the Message-Boundary Problem\n\nWhen you develop networked programs in Node,\
    \ you'll often communicate by passing messages. In the best case, a message will\
    \ arrive all at once. But sometimes messages arrive in pieces, split into distinct\
    \ data events. To develop networked applications, you'll need to deal with these\
    \ splits when they happen.\n\nThe LDJ protocol we developed earlier separates\
    \ messages with newline characters. Each newline character is the boundary between\
    \ two messages. Here's an example of a series of messages, with newline characters\
    \ specifically called out:\n\n```\n{\"type\":\"watching\", \"file\":\"target.txt\"\
    }\\n{\"type\":\"changed\", \"file\":\"target.txt\", \"timestamp\":1358175758495\\\
    }\\n{\"type\":\"changed\", \"file\":\"target.txt\", \"timestamp\":1358175779621\\\
    }\n```\n\nRecall the service we're developing so far in this chapter. Whenever\
    \ a change happens, it encodes and sends a message to the connection, including\
    \ the trailing newline. Each line of output corresponds to a single data event\
    \ in the connected client. Or, to put it another way, the data event boundaries\
    \ exactly match up with the message boundaries.\n\nOur client currently relies\
    \ on this behavior. It parses each message by sending the contents of the data\
    \ buffer directly into JSON.parse();\n\n```\nclient.on('data', function(data)\
    \ {\n  let message = JSON.parse(data);\n  //...\n});\n```"
