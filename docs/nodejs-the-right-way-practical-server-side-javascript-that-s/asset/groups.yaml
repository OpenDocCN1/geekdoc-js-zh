    Since we''re listening for error events, Node invokes our handler (and then proceeds
    to exit normally). If you don''t listen for error events, but one happens anyway,
    Node will throw an exception. And as we saw before, an uncaught exceptionexception
    will cause the process to terminate.


    # Blocking the Event Loop with Synchronous File Access


    The file-access methods we discussed in this chapter so far are async-chronous.
    They perform the I/O duties—waiting as necessary—completely in the background,
    only to invoke callbacks later. This is by the preferred way to I/O in Node.


    Even so, many of the methods in the fs module have synchronous versions as well.
    These end in *Sync, like readFile, for example. Doing synchronous file access
    might look familiar to you if you haven''t done a lot of asynchronous development
    in the past. However, it comes at a substantial cost.


    When we use the *Sync methods, the Node.js process will block until the I/O finishes.
    This means Node won''t execute any other code, won''t trigger any callbacks, won''t
    process any events, won''t accept any connections—nothing—it''ll just sit there
    indefinitely waiting for the operation to complete.


    However, synchronous methods are simpler to use since they lack the callback step.
    They either return successfully or throw an exception, without the need for a
    callback function. There are actually cases where this style of access is OK;
    we''ll discuss them in the next section.


    Here''s an example of how to read a file using the readFile method:


    ```

    const fs = require(''fs'');

    data = fs.readFileSync(''target.txt'');

    process.stdout.write(data.toString());

    ```


    The return value of readFileSync() is a buffer—the same as the parameter passed
    to callbacks of the asynchronous readFile() method we saw before.


    # Performing Other File-System Operations


    Node''s fs module has many methods that map nicely onto POSIX conventions (POSIX
    is a family of standards for interoperability between operating systems—including
    file-system utilities.) To name a few examples, you can copy files and unlink()
    (delete) them. You can use chmod() to change permissions and mkdir() to create
    directories.'
- md: "\nChapter 2. Wrangling The File System • 20\n\nThese functions rely on the\
    \ same kinds of callback parameters we've used in this chapter. They're all asynchronous\
    \ by default, but many come with equivalent *Sync* versions.\n\n## The Two Phases\
    \ of a Node Program\n\nGiven the cost of blocking has on the Node event loop,\
    \ you might think it's always bad to use synchronous file-access methods. To understand\
    \ it, you can think of Node programs as having two phases.\n\nIn the initialization\
    \ phase, the program is getting set up, bringing in libraries, reading configuration\
    \ parameters, and doing other mission-critical tasks. If something goes wrong\
    \ at this early stage, much can be done, and it's best to fail fast. The only\
    \ time you should consider synchronous file access is during the initialization\
    \ phase of your program.\n\nThe second phase is the operation phase, when the\
    \ program churns through the event loop. Since many Node programs are networked,\
    \ this means accepting connections, making requests, and waiting on other kinds\
    \ of I/O. You should *never* use synchronous file-access methods during this phase.\n\
    \nThe require() function is an example of this principle in action—it synchronously\
    \ evaluates the module's code and returns the module object. Either the module\
    \ will successfully load, or the program will fail right away.\n\nAs a rule of\
    \ thumb, if your program couldn't possibly succeed without the file, then it's\
    \ OK to use synchronous file access. If your program could conceivably continue\
    \ about its business, then it's better to take the safe route and stick to asynchronous\
    \ I/O.\n\n## Wrapping Up\n\nIn this chapter we've used Node to perform file operations\
    \ in Node's event, asynchronous, callback-oriented way. You learned how to watch\
    \ files for changes, and read and write files. You also learned how to spawn child\
    \ processes and access command-line arguments.\n\nAlong the way, we covered the\
    \ EventEmitter class. We used the on() method to listen for events and handle\
    \ them in our callback functions. And we used Streams—which are a special kind\
    \ of EventEmitter—to process data in buffered chunks or pipe it directly to other\
    \ streams.\n\nOh, and let's not forget about errors. You learned Node's convention\
    \ of passing an err argument to callbacks, and how error events can be captured\
    \ from an EventEmitter.\n\nKeep these patterns in mind as you continue through\
    \ the book. Third-party libraries sometimes have different styles, but the concepts\
    \ you've learned here reappear throughout the Node ecosystem.\n\nIn the next chapter\
    \ we'll dig into the other form of server-side I/O: network connections. We'll\
    \ explore the domain of networked services, building on the concepts and practices\
    \ developed here.\n\nHere are some bonus questions for you to try out your newly\
    \ gained knowledge.\n\n## Fortifying Coding\n\nThe various example programs we\
    \ developed in this chapter lack many safety checks. Consider the following questions,\
    \ and how would you change the code to address them:\n\n- In the file-watching\
    \ examples, what happens if the target file doesn't exist?\n- What happens if\
    \ a file being watched gets deleted?\n\n## Expanding Functionality\n\nIn an early\
    \ example of our file-watcher program, we pulled the filename to watch from process.argv.\
    \ Consider these questions:\n\n- Instead, how would you take the process to spawn\
    \ from process.argv?\n- How would you pass an arbitrary number of additional parameters\
    \ from process.argv to the spawned process (e.g., node --harmony watcher-hw.js\
    \ -l -h)?\n\n## CHAPTER 3\n\n## Networking with Sockets\n\nNode.js is built from\
    \ the ground up to do networked programming. In this chapter, we'll explore Node's\
    \ built-in support for low-level socket connections. TCP sockets form the backbone\
    \ of modern networked applications, and understanding them will serve you well\
    \ as we do more complex networking through the rest of the book.\n\nAs you develop\
    \ socket-based servers and clients, you'll learn about the following Node.js aspects.\n\
    \n### Architecture and Core\n\nThe asynchronous programming techniques we explored\
    \ in the last chapter will be even more important here. You'll learn how to extend\
    \ Node.js classes like EventEmitter. You'll create custom modules to house reusable\
    \ code.\n\n### Patterns\n\nA network connection has two endpoints. A common pattern\
    \ is for one endpoint to act as the server while the other is the client. We'll\
    \ develop both kinds of endpoints in this chapter, as well as a JavaScript Object\
    \ Notation (JSON)-based protocol for client/server communication.\n\n### JavaScript\n\
    \nThe JavaScript language has an interesting inheritance model. You'll learn about\
    \ Node's utilities for creating class-like relationships between objects.\n\n\
    ### Supporting Code\n\nTesting is important to ensure that our programs behave\
    \ the way we expect them to. In this chapter, we'll develop a test server that\
    \ behaves badly on purpose to probe edge cases of our protocol.\n\nChapter 3.\
    \ Networking with Sockets • 24\n\nTo begin, we'll develop a simple and complete\
    \ TCP server program. Then we'll iteratively improve the server as we address\
    \ concerns such as robustness, modularity, and testability.\n\n## Listening for\
