    });\n```\n\n与 online 事件类似，exit 事件也包含一个 worker 对象。该事件还包含了进程的退出状态码，以及用于停止进程的操作系统信号（如\
    \ SIGINT 或 SIGTERM）。\n\n## 构建 Cluster\n\n现在是时候将所有内容整合在一起了，利用 Node 集群功能以及我们一直讨论的\
