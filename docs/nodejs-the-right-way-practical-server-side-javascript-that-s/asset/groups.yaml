    \ just the one ID matches our chosen view, and show it.\n\nThe showView() function\
    \ works great if we want to set the view programmatically, but we should also\
    \ respond to direct URL changes. To do that, we listen to the hashchange event\
    \ on the window:\n"
  mdcn: "\n\n## 基于哈希的视图\n\n当 Web 应用只包含单个页面时，你需要某种方法来标识正在显示不同的内容。实现这一点的一种方法是使用 URL\
    \ 哈希——URL 中 # 符号后面的内容。\n\n例如，考虑 URL http://localhost:3000/#list-bundles。我们希望它能响应显示用户包（bundles）的视图。\n\
    \n打开 b4 项目中的 static/index.html 文件。在其中你会发现类似这样的 `<div>`：\n\n```html\n<div id=\"\
    welcome-view\" class=\"view\">\n  <h2>Welcome</h2>\n  ...\n</div>\n<div id=\"\
    list-bundles-view\" class=\"view\">\n  <h2>Your Bundles</h2>\n  ...\n</div>\n\
    ```\n\n我们希望同一时间只有这些视图中的一个是可见的，为此我们需要编写少量的客户端 JavaScript。以下是来自 static/app.js 的\
    \ `showView()` 函数：\n\n```javascript\nweb-app/b4/static/app.js\nshowView = function\
    \ (selected) {\n  window.location.hash = '#' + selected;\n  $('.view').filter('#'\
    \ + selected + '-view').show();\n}\n```\n\n该函数接收一个 `selected` 参数，即我们想要显示的视图名称。首先，我们将\
    \ `window.location.hash` 设置为匹配指定的视图。例如，如果调用 `showView('list-bundles')`，它将更新页面的\
    \ URL 以 #list-bundles 结尾。\n\n接下来的部分非常简洁，得益于 jQuery。我们找到页面上所有类名为 `view` 的 `<div>`，将它们隐藏，然后找到\
