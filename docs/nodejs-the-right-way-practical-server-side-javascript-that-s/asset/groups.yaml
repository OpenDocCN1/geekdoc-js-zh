    # Writing Node.js


    One thing I love JavaScript is that there are seven ways to do anything. There''s
    breathing room, where developers can explore and experiment and find better approaches
    to everything.


    The community of Node developers, conventions in Node.js development, and even
    the semantics of the JavaScript language itself are all rapidly evolving. With
    eyes to the future, code examples and recommendations in this book reflect current
    best practices and standards.


    # What''s in This Book


    This book is for developers who want to learn how to write asynchronous JavaScript
    for the server using Node.js. Some prior JavaScript experience will help, but
    you don''t have to be an expert.


    Chapter 1, Getting Started, on page 1, introduces the Node.js event loop, explaining
    how powers are highly parallel and single-threaded at the same time. This chapter
    also outlines the five aspects of Node.js development that each frame subsequent
    chapter and has some brief instructions on getting Node installed on your machine.


    The remaining chapters each deal with a specific programming area.


    # Wrangling the File System


    In Chapter 2, Wrangling the File System, on page 9, we''ll get our first look
    at writing Node.js programs. If you''ve done any server-side programming in the
    past, you''ve had to access a file system along the way. We''ll start in this
    familiar domain, using Node''s file-system tools to create asynchronous, nonblocking
    file utilities. We''ll use Node''s ubiquitous EventEmitter and Stream classes
    to pipe data, and you''ll spawn and interact with child processes.


    # Networking with Sockets


    We''ll expand on those concepts while exploring Node''s network I/O capabilities
    in Chapter 3, Networking with Sockets, on page 23. We''ll create TCP servers and
    client programs to access them. We''ll also develop a simple JSON-based protocol
    and a custom module for working with these messages. This will offer insight into
    Node application design and provide experience creating testable and fault-tolerant
    systems.'
- md: '

    # Robust Message-Passing


    Then, in Chapter 4, *Robust Messaging Services*, on page 41, we will branch out
    from the Node core and enter the realm of third-party libraries. You''ll use npm
    to import and build OMQ (pronounced "Zero-M-Q")—a high-efficiency, low-latency
    library for developing networked applications. With OMQ, we''ll develop programs
    using several important patterns, such as publish/subscribe and request/response.
    We''ll create suites of programs that work together in concert, and you''ll learn
    the clustering tools to manage them.


    # Accessing Databases


    Chapter 5, *Access Databases*, on page 65, introduces databases and how to interact
    with them asynchronously in Node. In particular, we''ll work with CouchDB—a RESTful,
    JSON document database. You''ll learn to parse XML documents, throttle Node using
    a worker queue, and develop and run unit tests. The database we create in this
    chapter is the foundation for RESTful APIs you''ll develop in later chapters.


    # Scalable Web Services


    Node has fantastic support for writing HTTP servers, and in Chapter 6, *Scalable
    Web Services*, on page 87, we do exactly that. You''ll use Express, a popular
    Node.js framework for routing requests. We''ll dive deeper into REST semantics,
    and you''ll use called promises for managing asynchronous code flows. You''ll
    also learn about a bleeding-edge feature of ECMAScript generator functions, and
    how they couple with promises in interesting ways.


    # Web Apps


    Finally, in Chapter 7, *Web Apps*, on page 107, we will build a front end for
    our web services. We''ll use a Node module called Passport for implementing authenticated
    APIs that we use Google account credentials. And we''ll serialize our session
    data in Redis—a very fast key/value datastore. You''ll learn the basics of writing
    a static-page web application that uses RESTful APIs, including how to pull in
    dependencies using a front-end package manager called Bower.


    # What This Book Is Not


    Before you commit to reading this book, you should know what it doesn''t cover.


    # Everything About Writing


    At the time of this writing, npm houses more than 43,000 modules, with an average
    growth rate of 100-plus new modules per day. Since the ecosystem and community
    around Node.js is growing and changing so rapidly, this book does not attempt
    to cover everything. Instead, this short book teaches you the essentials you need
    to get out and start coding.


    The book also stays close to the topic of Node.js. You''ll learn a lot about clustering
    Node processes and how to write scalable web services, but little about front-end
    concerns like HTML, CSS, and browser JavaScript.


    # JavaScript Beginner''s Guide


    The JavaScript language is one of the most misunderstood languages in wide use
    today. Although this book does discuss language syntax from time to time (especially
    where it is brand-new), this is not a beginner''s guide to JavaScript.


    # A Note to Windows Users


    The examples in this book assume you''re using a Unix-like operating system. We''ll
    make use of standard input and output streams, and pipe data between processes.
    The shell session examples have been tested with Bash, but other shells may work
    as well.


    If you run Windows, I recommend setting up Cygwin. This will give you the best
    shot at running the example code successfully, or you could run a Linux virtual
    machine.


    # Code Examples and Conventions


    The examples in this book contain JavaScript, shell sessions, and a few HTML/XML
    excerpts. For the most part, code listings are provided in full—ready to be run
    at your leisure.


    Samples and snippets are syntax-highlighted according to the rules of the language.
    Shell commands are prefixed by $.


    When you write Node.js code, you should always handle errors and exceptions, even
    if you just re-throw them. You''ll learn how to do this throughout the book. However,
    some of the code examples lack error handling. This is to aid readability and
    save space only—you should always handle your errors.


