    ## 异步 JavaScript


    随着 HTML5、前端 MVC 和 Node.js 的出现，JavaScript 已无处不在——但仍然混乱。这本书将为你提供一个坚实的基础，在不深陷回调地狱的情况下管理异步任务。这是一本关于处理异步行为最核心技巧的快速指南，包括
    PubSub、事件模型和 Promises。掌握了这些技巧，你将更好地准备应对大型 Web 应用的复杂性并交付响应式代码。


    Trevor Burnham

    (104 页) ISBN: 9781937785277. $817

