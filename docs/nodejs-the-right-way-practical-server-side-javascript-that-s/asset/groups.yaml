    # Wrapping Up


    This chapter showed both sides of web application development, from the Node.js
    server out to the browser. It took us further into web services as we developed
    Stateful, session-based user APIs. And we used Redis, a fast key/value datastore
    for housing our session data in a scalable way.


    By bringing in passport—an Express plug-in—we provided seamless support for logging
    in with Google credentials. And we developed custom Express middleware to authorize
    requests to our RESTful user APIs.


    To power the client side, we served static content, both for our single-page application
    and its dependencies, which we got from Bower, an unopinionated front-end package
    manager. We used jQuery'' Ajax capabilities to synchronize our model objects with
    our REST services, and its DOM-manipulation functions to implement custom hash-based
    views. Lastly, we explored templating with Handlebars as part of implementing
    client-side MVC.


    # RESTful API Design


    Consider the user-bundles API (/api/user/bundles) we designed in this chapter.
    On PUT, it always overwrites the whole list of bundles whenever or any of them
    change.


    +   - What would happen if the incoming response body weren''t valid JSON?


    +   - What would happen if the incoming response body were a JSON serialized array
    (as opposed to the object that we expect)?


    +   - In your opinion, what should ideally happen in these cases, and how would
    you change the code to make that so?


    Instead of just using PUT to overwrite everything, you could have different verbs
    and endpoints for adding and deleting bundles from a user''s collection.


    +   - What route would you use to DELETE a bundle from a user''s collection?


    +   - What HTTP verb would you use to add a bundle to a user''s collection?'
