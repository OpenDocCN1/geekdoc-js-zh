    ## El 编程


    你想探索函数式编程，但被其学术气息劝退了（别再跟我提一遍 monad 了）。你知道你需要并发应用，但也知道这些应用几乎不可能做好。认识一下 Elixir，这是一种构建在稳如石的
    Erlang 虚拟机上的函数式并发语言。Elixir 务实的语法和对元编程内置支持将提高你的生产力，并让你保持长期兴趣。本书是经验丰富的程序员的 Elixir
