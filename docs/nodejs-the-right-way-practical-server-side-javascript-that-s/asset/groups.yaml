    Message-Publishing and -Subscribing • 4


    ØMQ makes all this simpler by taking care of low-level details like buffering
    and reconnecting. Let''s see how much easier it is by implementing a watcher that
    uses ØMQ PUB/SUB instead of naked TCP. This will get us used to the ØMQ way of
