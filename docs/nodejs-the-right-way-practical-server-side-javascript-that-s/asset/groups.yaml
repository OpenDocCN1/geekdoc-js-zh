    \n图 8—将请求路由到工作进程池的 Node.js 集群\n\n主进程是架构中最稳定的部分（它管理 workers），因此它负责绑定工作。集群的 worker\
    \ 进程和服务的客户端都连接到由主进程绑定的端点。记住，消息的流是由套字类型决定的，而不是由哪个套字恰好发生了绑定或连接。\n\n现在让我们来看代码。打开你最喜欢的编辑器并输入以下内容。\n\
    \n```javascript\nmessaging/zmq-filer-rep-cluster.js\n'use strict';\nconst\n  cluster\
    \ = require('cluster');\n  fs = require('fs');\n  zmq = require('zmq');\n\nif\
    \ (cluster.isMaster) {\n  // 主进程 - 创建 ROUTER 和 DEALER 套字，绑定端点\n  let\n    router\
    \ = zmq.socket('router').bind('tcp://127.0.0.1:54333');\n    dealer = zmq.socket('dealer').bind('ipc://filer-dealer.ipc');\n\
    \n  // 在 router 和 dealer 之间转发消息\n  router.on('message', function() {\n    let\
