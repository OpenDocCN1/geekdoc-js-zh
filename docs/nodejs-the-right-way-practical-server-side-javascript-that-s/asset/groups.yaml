    # CHAPTER 7


    # Web Apps


    By now, you''ve mastered several approaches to handling asynchronous JavaScript
    code. You know how to use and write RESTful web services. You understand messaging
    patterns, and how to use Express.


    With all of that knowledge and experience, we''re now in position to develop a
    web application. This will take us through the following Node.js aspects:


    # Architecture and Core


    At this stage you''ve moved past the Node.js core in many respects. Node is the
    underlying technology that''s letting you reach beyond.


    # Patterns


    You''ll dive deeper into Express middleware, using it to implement a custom authentication
    handler. We''ll use passport—an Express plug-in—so that users of our application
    can log in with their Google accounts. The client-side code uses model-view-controller
    (MVC) to separate concerns.


    # JavaScripts


    Although the Node code in this book takes advantage of the latest available ECMAScript
    Harmony features, those features aren''t available in many web browsers. You''ll
    learn some differences between ECMAScript 5 and ECMAScript 6 as we code JavaScript
    for the browser. You''ll also use jQuery to perform a variety of client-side operations.


    # Supporting Code


    Just like npm makes it easy to pull in Node modules, Bower is used to manage client-side
    dependencies. We''ll use Bower to pull in jQuery, Bootstrap, Handlebars, and others.
    We''ll also use Redis, a fast key-value store, for managing session data.'
  - '[PAGE 123]


    Developing web applications is an enormous topic. You could fill a library with
    books on all the myriad concepts you need to know to master it. I''ve been doing
    it for over a decade, and I''m still learning every day.


    So instead of trying to explore everything there is to know, we''ll focus on what''s
    specific to Node.js. The code download that accompanies this book contains a web-app
    directory, which has all the code from this chapter and more. I encourage you
    to go grab it if you haven''t already, since we won''t cover everything that''s
    in there.


    The application b4 builds on the web services that we developed last chapter.
    This means you''ll need CouchDB running, along with the data from Chapter 5, Access
    Databases, on page 65.


    Once you have those prerequisites, let''s dive in!


    # Storing Express Sessions in Redis


    Whenever you have a user-facing web application, you''ll almost always use sessions.
    A session is data that''s attached to a particular user. As the user browses pages
    on the site or uses the web application, the server keeps track of the user through
    a session cookie. On each request, the server reads the cookie, retrieves the
    session data, then uses it when generating a response.


    Let''s see how to enable sessions in Express, and how to use Redis for storing
    the session data.


    # Enabling Sessions in Express


    To enable sessions, add the cookieParser and session middleware to your app:


    ```

    app.use(express.cookieParser());

    app.use(express.session({secret: ''unguessable''}));

    ```


    The cookieParser middleware is responsible for parsing cookies from the client,
    and the session middleware stores the session data attached to the cookie. The
    secret parameter is necessary to prevent cookie tampering and spoofing—set it
    to something unique to your application. Express session cookies are signed with
    this secret string.'
  - "[PAGE 124]\n\n# Using Redis to Store Session Data\n\nRedis is an extremely fast\
    \ key/value store with tunable durability. This means you can keep it fast but\
    \ risk losing data if the server were to crash, or you can sacrifice some speed\
    \ for greater durability guarantees.\n\nBy default, Redis keeps data in memory\
    \ and then periodically writes it to disk. This makes it blazingly fast, but disaster-prone;\
    \ since a process crash would mean lost data.\n\nIts speed makes Redis an ideal\
    \ database for storing session data. If the server tips over, the sessions might\
    \ be lost, but at worst this means that your users will have to log in again.\n\
    \nTo use Redis with your Node/Express app, first you'll have to install it. Installing\
    \ Redis differs by platform, but once you have it installed, starting it up is\
    \ a single command:\n\n```\n$ redis-server\n```\n\n```\n[8344] 10 Sep 20:38:41.564\
    \ # Server started, Redis version 2.6.13\n```\n\nUsing Redis with Express takes\
