    # CHAPTER 4


    # Robust Messaging Services


    When you write Node.js programs, you''ll often use more than just the core libraries.
    Node''s package manager, npm, offers a rich collection of community-\-developed
    modules you can use. In this chapter, you''ll learn how to make the most out of
    third-party modules.


    In particular, we''re going to explore how to write robust messaging services
    in Node. We saw the beginnings of networked application development last last
    chapter, and now it''s time to take it to the next level. Creating these messaging
    applications will expose you to the following aspects of Node.js development.


    # Architecture and Core


    Node.js is single-threaded, but you can still take advantage of multiple cores
    or processors by running more processes. In this chapter, you''ll use Node''s
    cluster module to create and manage a pool of Node.js worker processes.


    # Patterns


    The endpoints of a networked application can have many roles, and communicate
    in many ways. We''ll explore powerful messaging patterns like publish/subscribe,
    request/response, and push/pull. These patterns often appear in networked application
    design; you''ll be a better programmer knowing when and how to apply them.


    # JavaScriptisms


    Functions in JavaScript are variadic. This means they can be called with any number
    of arguments, whether you planned to receive them or not. The messaging library
    we''ll use takes advantage of this feature to send message data to your callbacks.'
