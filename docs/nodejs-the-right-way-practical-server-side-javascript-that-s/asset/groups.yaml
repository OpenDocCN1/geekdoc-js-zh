    ready captain.

    ```


    Now let''s dig into the search APIs.


    # Implementing Search APIs


    To build a book bundle, a user has to be able to discover books to add to it.
    Our modular web service will have two search APIs: field search (for discovering
    authors and subjects) and book search (finding books by a given author or subject).


    The Node.js code for these two APIs is quite similar—so we''ll focus on the field
    search here and leave the book search for the wrap-up questions at the end.


    The field search API helps users find authors or subjects based on a starting
    string. For example, to get a list of subjects that start with Croc, you''d make
    a request like this:


    ```

    $ curl http://localhost:3000/api/search/subject?q=Croc

    [

    "Crocheting",

    "Crocheting -- Patterns",

    "Crockett, Davy, 1786-1836",

    "Crocodiles",

    "Crocodiles -- Juvenile fiction"

    ]

    ```


    This API could be employed, for instance, in a user interface so that when a user
    starts typing a subject, suggestions automatically pop up.'
