    Chapter 7. Web Apps • 120


    Notice that now we''re providing two middleware functions in an array. First is
    the authored middleware that we used before, and second is express.json(). The
    built-in express.json middleware parses each incoming request''s content body
    when the Content-Type header is set to application/json. Way, when we access req.body,
    it''s already an object and not just a buffer.


    After that, it''s a pretty typical RESTful API. First we try to get the object
    from CouchDB. If it already exists, we overwrite the bundles and if it doesn''t
    already exist, we create a new document with those bundles and put it in. Error
    cases are handled in the usual way.


    Note here that we''re using the pipe() feature of the request module to send a
    response forward to next. The usage is quite similar to a basic Stream''s pipe
    method, but operates on higher-level Request and Response objects.


    That wraps up the server side of this application. Next let''s finish up by exploring
    some of the client side.


    # Client-Side MVC


    Throughout this chapter we''ve kept a clean delineation between the server-side
    code (RESTful, JSON APIs) and the client-side code (static HTML, CSS, and JavaScript).
    The benefit of this separation is that you can completely change your user-facing
    code without modifying your Node server. In fact, you could implement a non-browser
    front end, such as a command-line interface, and your APIs would continue to work
    just fine.


    But at some point you have to create an interface your users can interact with,
    and that we''ll do here. Please keep in mind that front-end web development is
    a fast-moving target; the state of the art is advancing every day. To build a
    front end for the b4 APIs, we''ll use MVC.


    The MVC software-design pattern is a popular and convenient way to structure user-facing
    applications. Unfortunately, it''s so popular, people have different ideas about
    what MVC means and how it it works. So first we have to agree on a working definition
    for the examples in this book.


    +   - Model—The business logic and data for the application

    - View—Representation of the model that is shown to the user

    - Controller—Code that receives user interaction to inform the model


    In our application, the model will be responsible for keeping track of the book
    bundles for the user. The view will be the Document Object Model (DOM) in the
    browser, as rendered by the model. And the controller logic will be invoked by
    events from the DOM.'
- md: "\n## Hash-Based Views\n\nWhen a web application consists of only a single page,\
    \ you need some way of denoting that different content is being shown. One way\
    \ to do this is with URL hashes—the content after the # symbol in a URL.\n\nFor\
    \ example, consider the URL http://localhost:3000/#list-bundles. We want this\
    \ to respond to the view that shows the user's bundles.\n\nOpen the static/index.html\
    \ file in the b4 project. In there you will find <div> like this:\n\n```html\n\
    <div id=\"welcome-view\" class=\"view\">\n  <h2>Welcome</h2>\n  ...\n</div>\n\
    <div id=\"list-bundles-view\" class=\"view\">\n  <h2>Your Bundles</h2>\n  ...\n\
    </div>\n```\n\nWe want exactly one of these views visible at a time, and for that\
    \ we need a little client-side JavaScript. Here's the showView() function from\
    \ static/app.js:\n\n```javascript\nweb-app/b4/static/app.js\nshowView = function\
    \ (selected) {\n  window.location.hash = '#' + selected;\n  $('.view').filter('#'\
    \ + selected + '-view').show();\n}\n```\n\nThis function takes a selected parameter,\
    \ which is the name of the view we want to show. First we set window.location.hash\
    \ to match the specified view. For example, if we call showView('list-bundles'),\
    \ that updates the page's URL to end in #list-bundles.\n\nThe next part is pretty\
    \ concise, thanks to jQuery. We find all of the <div>s on the page with class\
    \ view, hide them, then find just the one ID matches our chosen view, and show\
    \ it.\n\nThe showView() function works great if we want to set the view programmatically,\
    \ but we should also respond to direct URL changes. To do that, we listen to the\
    \ hashchange event on the window:\n\n```javascript\nweb-app/b4/static/app.js\n\
    $(window).on('hashchange', function(event) {\n  var view = (window.location.hash\
    \ || '').replace(/^#, '');\n  if ('#' + view + '-view').length) {\n    showView(view);\n\
    \  }\n});\n```\n\nThis code starts out by grabbing the window.location.hash and\
    \ saving it in a variable called view. var is an older JavaScript keyword. It's\
    \ just like let except that it's scoped to the nearest function() {} as opposed\
    \ to the nearest pair of curly braces {}.\n\nNot all browsers support let at the\
    \ time of this writing, so it's much safer to use var in client-side code.\n\n\
    Next this function checks whether there's an element on the page with the matching\
    \ view ID, and if so, calls show().\n\nNow there's only one view-navigation task\
    \ to take care of: what to do when the page first loads. On startup, the page\
    \ should find out whether users are authenticated. If so, users show the list-bundles\
    \ view; otherwise, send them to the welcome view, where they'll have a link to\
    \ log in.\n\nHere's the startup view code:\n\n```javascript\nweb-app/b4/static/app.js\n\
    $.ajax({\n  url: '/api/user',\n  accepts: 'application/json'\n})\n.then(function(data,\
    \ status, xhr) {\n  getBundles();\n}, function(xhr, status, err) {\n  showView('welcome');\n\
    });\n```\n\nFirst, we kick off an asynchronous request /api/user with jQuery's\
    \ .ajax(). This method is like a promise-producing request().\n\nWe call then()\
    \ with two handlers, one for success and one for failure. If the request was successful,\
    \ we move on to getBundles(); otherwise we show the welcome view.\n\nNext, let's\
    \ look at some more client-side request code.\n\n## Synchronizing Models with\
    \ REST APIs\n\nIn our single-page web app, once the user logs in he'll see the\
    \ list-bundles view. Before we can render it, we need to know what bundles the\
    \ user has already made.\n\nThe static/app.js file in the b4 project contains\
    \ a variable called bundles. This is a local copy of the actual user bundles stored\
    \ on the server. To start, the web app needs to pull down the remote copy—this\
    \ is what getBundles() does:\n\n```javascript\nweb-app/b4/static/app.js\nBundles\
    \ = function() {\n  $.ajax({\n    url: '/api/user/bundles'\n  }).then(function(data,\
    \ status, xhr) {\n    bundles = data;\n    showBundles();\n  }, function(xhr,\
    \ status, err) {\n    if (xhr.status >= 500) {\n      showErr(xhr, status, err);\n\
    \    }\n    bundles = {};\n    showBundles();\n  });\n});\n```\n\nHere we use\
    \ the $.ajax function to pull down /api/user/bundles. If the request succeeds,\
    \ we use the value returned; otherwise we start with an empty object {}. If the\
    \ request fails with a status code in the 500 range (like 502 Bad Gateway), then\
    \ we show the error using the showErr function(). In either case, we move on showBundles().\
