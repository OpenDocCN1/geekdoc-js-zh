    # CHAPTER 4


    ## Robust Messaging Services


    When you write Node.js programs, you''ll often use more than just the core libraries.
    Node''s package manager, npm, offers a rich collection of community-developed
    modules you can use. In this chapter, you''ll learn how to make the most out of
    third-party modules.


    In particular, we''re going to explore how to write robust messaging services
    in Node. We saw the beginnings of networked application development last last
    chapter, and now it''s time to take it to the next level. Creating these messaging
    applications will expose you to the following aspects of Node.js development.


    ## Architecture and Core


    Node.js is single-threaded, but you can still take advantage of multiple cores
    or processors by running more processes. In this chapter, you''ll use Node''s
    cluster module to create and manage a pool of Node.js worker processes.


    ## Patterns


    The endpoints of a networked application can have many roles, and communicate
    in many ways. We''ll explore powerful messaging patterns like publish/subscribe,
    request/response, and push/pull. These patterns often appear in networked application
    design; you''ll be a better programmer knowing when and how to apply them.


    ## JavaScriptisms


    Functions in JavaScript are variadic. This means they can be called with any number
    of arguments, whether you planned to receive them or not. The messaging library
    we''ll use takes advantage of this feature to send message data to your callbacks.


    ## Supporting Code


    npm is an integral part of the Node ecosystem. You''ll learn how to use and manage
    modules provided through npm. Sometimes modules have external dependencies beyond
    npm; you''ll learn how to build those, too.


    To create our robust messaging services, we''ll use a cross-platform library called
    ØMQ (pronounced "Zero-M-Q"). The MQ stands for message queue. ØMQ provides high-scalability
    and low-latency messaging. And with its event-loop-based development model, ØMQ
    goes with Node.js like peanut butter goes with jelly.


    After a brief overview of ØMQ, we''ll take it for a spin by improving versions
    of some of the applications we developed in previous chapters. Then we''ll quickly
    move on to new messaging patterns. Let''s get to it!


    ## Advantages of ØMQ


    It''s fair to ask why we''d use ØMQ for messaging, as opposed to writing everything
    ourselves. The answer is that the Node community believes in the Unix philosophy:
    "do one thing well." The committers keep the Node core small and tight, leaving
    everything else to the broader base of developers who publish their modules through
    npm.


    Although the Node.js core has great, low-level support for binding and connecting
    to sockets, it leaves out higher-level messaging patterns. ØMQ''s purpose is to
    expose high-level messaging patterns and take care of many low-level networking
    concerns for you. Take the following examples:


    - ØMQ endpoints automatically reconnect if they become unhitched for any reason—like
    there''s a hiccup in the network or if a process restarts.

    - ØMQ delivers only messages, so you don''t have to create buffers to deal with
    chunked data.

    - ØMQ''s low-overhead protocol takes care of many routing details, like sending
    responses back to the correct clients.


    With ØMQ, like with any good library, your application can focus on what really
    matters. Now, let''s get everything set up with npm so we can build fast, robust
    messaging applications in Node with ØMQ.


    ## Importing External Modules with npm


    npm is your gateway to a large and growing pool of open source Node modules. They
    do everything from stream parsing to connection pooling to session management.
    You''ll rarely write a Node application that doesn''t use at least one module
    from npm. We''ll use many external modules in this book, and zmq (the Node binding
    for ØMQ) is the first.


    Modules managed by npm can be pure JavaScript or a combination of JavaScript and
    native addon code.¹ Addons are dynamically linked shared objects—they provide
    the glue for working with native libraries written in C or C++.


    The vast majority of modules can be installed through the npm command-line tool
    alone, even if they contain addons. But a few, like the zmq module, have additional
    requirements as well. To use ØMQ with Node, you have to install the ØMQ base library
    first; then you can pull in the zmq module through npm.


    ## Installing the ØMQ Base Library


    Installing the ØMQ library is fairly straightforward on most platforms. Binary
    and source packages are available from the project download page.²


    If you''re using Mac OS with Homebrew, you can quickly install ØMQ from the command
    line.³


    ```bash

    $ brew install zmq

    == Downloading http://download.zeromq.org/zermq-3.2.3.tar.gz

    ###################################################### 100.0%

    == Patching

    patching file tests/test_disconnect_inproc.cpp

    == ./configure --prefix=/usr/local/cellular/zeromq/3.2.3

    == make

    == make install

    ..

    ```


    ```bash

    == Summary

    /usr/local/Cellar/zeromq/3.2.3: 54 files, 2.3M, built in 31 seconds

    ```


    To test whether ØMQ was installed successfully, you can try to load its main page
    with zmq.


    ## Installing the zmq Node Module


    Once you''ve installed the base ØMQ library, you can use npm to pull down the
    zmq Node module.


    Create a directory called messaging and navigate to this directory on the command
    line. Then install zmq:


    1. http://nodejs.org/api/addons.html

    2. http://www.zeromq.org/intro-get-the-software

    3. http://brew.sh


    ```bash

    $ npm install zmq

    npm http GET https://registry.npmjs.org/zmq

    npm http 200 https://registry.npmjs.org/zmq

    ```


    ```bash

    > zmq@2.4.0 install ./node_modules/zmq

    > node-gy rebuild

    CXX(target) Release/obj.target/binding.o

    SOLINK_MODULE(target) Release/zmq.node

    SOLINK_MODULE(target) Release/zmq.node: Finished

    zmq@2.4.0 node_modules/zmq

    ```


    Notice the call to node-gyp about halfway though. node-gyp is a cross-platform
    tool for compiling native addons. If anything went wrong with the build, the output
    should tell you.


    When you run the preceding command, npm will download the zmq module to a folder
    called node_modules under the current directory. To test that the module was installed
    successfully, run this command:


    ```bash

    $ node --harmony -p -e ''require("zmq")''

    ```


    The -e flag tells Node to evaluate the string, and the -p flag tells it to print.
    If you see an exception being thrown, then you''ll need to troubleshoot.


    Now that the library and the Node module are installed, it''s time to start programming
    with ØMQ!


    ## Message-Publishing and Subscribing


    ØMQ supports a number of different message-passing patterns that work great in
    Node. We''ll start with the publish/subscribe pattern (PUB/SUB).


    Recall the code we wrote in Chapter 3, Networking with Sockets, on page 23, when
    we developed a network-watching service and a client to connect to it. They communicated
    over TCP by sending Line-Delimited Object Notation (JSON) messages. The server
    would publish information in this format, and any number of client programs could
    subscribe to it.


    We had to make our client safely handle the message-boundary problem.


    ## Publishing Messages over TCP


    First, let''s implement the PUB half of a PUB/SUB pair using the zmq module. Open
    an editor and enter the following:


    ```javascript

    messaging/zmq-watcher-pub.js

    ''use strict'';

    const fs = require(''fs''),

    zmq = require(''zmq''),


    // create endpoint

    publisher = zmq.socket(''pub''),


    filename = process.argv[2];


    fs.watch(filename, function(){


    // send message to any subscribers

    publisher.send(JSON.stringify({

    type: ''changed'',

    file: filename,

    testamp: Date.now()

    }));

    });


    // listen on TCP port 5432

    publisher.bind(''tcp://*:5432'', function(err) {

    console.log(''Listening for zmq subscribers...'');

    });

    ```


    Save the file as zmq-watcher-pub.js. This program is similar to one we developed
    in previous chapters, with a few differences.


    First, instead of requiring the net module, now we''re requiring zmq. We use it
    to create a publisher endpoint.


    Importantly, we have only one call to fs.watch(). Our servers from the last chapter
    would invoke watch() once for each connected client. Here we have just one file-system
    watcher, which invokes the publisher''s send() method.


    ØMQ makes all simpler by taking care of low-level details like buffering and reconnecting.
    Let''s see how much easier it is by implementing a watcher that uses ØMQ instead
    of naked TCP.

    '
