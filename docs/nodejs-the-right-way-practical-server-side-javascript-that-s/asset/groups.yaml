  - '[PAGE 100]


    CouchDB sends every document in the database through it to produce the view. As
    new documents are added, CouchDB will incrementally update the generated views
    (it doesn''t have to run through them all each time).


    The group=true parameter tells CouchDB that we want the result of running the
    reduce function as well. Since our reduce function is a basic count, the value
    field of each row is the number of books attributed to that author.  So, for example,
    the author "A.E." is credited with two books.


    CouchDB allows you to ask for a subset of view records by specifying a specific
    key or a startkey and endkey as URL parameters. We''ll use these capabilities
    in Chapter 6, Scalable Web Services, on page 87, when we build our own RESTful
    interface for querying the data.


    # Wrapping Up


    This chapter covered a lot of ground against the backdrop of working with databases.
    To start, we created a project directory complete with a package.json file for
    managing dependencies through npm.


    By choosing CouchDB—a RESTful, JSON-based, document-oriented datastore—we got
    a detailed look at how RESTful APIs work. We used the request module to simplify
    making HTTP client requests from Node.


    Step by step, you created scripts to import large amounts of data into CouchDB
    with Node. We saw how Node''s extreme speed sometimes works against it, exhausting
    system resources and overwhelming other services. To fix this, we explored techniques
    for queuing work using the async module. Along the way you learned how to use
    nodeunit to develop and run unit tests for your modules.


    # Robustness


    We dealt with the ECONNRESET problem in Putting It All Together, on page 78, by
    turning the concurrency down from 1,000 to 10.


    +   - What would happen if we still got an ECONNRESET?

    - How would you change the code to retry the operation?'
- md: "\n# Scalable Web Services\n\nA lot of the buzz around Node.js centers on using\
    \ it for writing scalable websites, apps, and services. In this chapter we'll\
    \ develop robust, RESTful, JavaScript Object Notation (JSON)-based web services.\
    \ Creating web services will be our backdrop for digging into these aspects of\
    \ Node development:\n\n## Architecture and Core\n\nYou'll learn how to use Node's\
    \ built-in module to create a basic HTTP server.\n\n## Patterns\n\nSome Node modules\
    \ have their own ecosystem of plug-ins that provide additional behavior. We'll\
    \ use plug-ins for Express and learn how its middleware pattern provides hooks\
    \ for additional functionality. We'll also use promises, a powerful abstraction\
    \ for writing asynchronous code.\n\n## Javascripts\n\nECMAScript Harmony introduces\
    \ new concepts like iterators and generators. You'll learn how to create and use\
    \ generators, and how they combine with promises to simplify asynchronous programming.\n\
    \n## Supporting Code\n\nFor our project, we'll use more features of npm, like\
    \ specifying scripts to start our project. We'll also use nodemon to monitor our\
    \ Node programs and automatically restart them when the source changes.\n\nNode.js\
    \ comes with support for low-overhead HTTP servers out of the box using the http\
    \ module.¹ But writing services against the low-level http module directly can\
    \ be a lot of work. We'll use Express for developing our web services.²\n\n1.\
    \ http://nodejs.org/api/http.html\n2. http://expressjs.com/\n\nBecause the code\
    \ samples are getting more involved, you should grab the code that comes with\
    \ this book rather than trying to type it all in. In the code download, you'll\
    \ find a web-services directory that contains all the code from this chapter.\
    \ Get it now if you don't have it, then let's get started with Express.\n\n##\
    \ Advantages of Express\n\nExpress is a web application framework for Node modeled\
    \ after the Ruby Sinatra.³ Express provides a lot of the plumbing code that you'd\
    \ otherwise end up writing yourself. To see why, let's take a look at a basic\
    \ Node.js server using only the http module.\n\nweb-services/server.js\n\n```javascript\n\
    const http = require('http'),\nserver = http.createServer(function(req, res) {\n\
    \  res.writeHead(200, {'Content-Type': 'text/plain'});\n  res.end('Hello World!');\n\
    });\nserver.listen(3000, function(){\n  console.log('ready captain!');\n});\n\
    ```\n\nThis is quite similar to creating a basic TCP server using the net module.\
    \ First we bring in the http module, call its createServer() method with a callback,\
    \ and finally use server.listen() to bind a TCP socket for listening. The callback\
    \ function uses information from the incoming HTTP request (req) to send an appropriate\
    \ response.\n\nWhat's remarkable about this example isn't what it does, but rather\
    \ what it doesn't do. There are lots of little jobs a typical web server would\
    \ take care of that this code doesn't touch. Here are some examples:\n\n- Routing\
    \ based on URL paths\n- Managing sessions via cookies\n- Parsing incoming requests\
    \ (like form data or JSON)\n- Rejecting malformed requests\n\nThe Express framework\
    \ helps with these and myriad tasks.\n\n## Serving APIs with Express\n\nFor all\
    \ Node modules, to use Express you have to install it with npm. The example project\
    \ we're working from from already specifies a dependency on Express,\n\n3. http://www.sinatrub.com/\n\
    \nso all we have to do is run npm install. If you were making your project, y'd\
    \ want to run npm install --save express to pull down the latest Express available\
    \ and record the dependency in your package.json file.\n\nLet's take a look at\
    \ a Hello Express app to get a feel for how it works. Then we'll expand on this\
    \ skeleton to make our own RESTful APIs. In the terminal, navigate to the hello\
    \ subdirectory of the example project. Here is the content of the serverjs file\
    \ you will find here:\n\n```javascript\nweb-services/hello/server.js\n#!/usr/bin/env\
    \ node --harmony\n'use strict';\nconst\n  express = require('express');\n  app\
    \ = express();\n  app.use(express.logger('dev'));\n  app.get('/api/:name', function(req,\
    \ res) {\n    res.json(200, { \"hello\": req.params.name });\n  });\n  app.listen(3000,\
    \ function() {\n    console.log('ready captain.');\n  });\n```\n\nFirst, this\
    \ program brings in the express module and creates an app. Like the request module\
    \ we worked with in the last chapter, the express module is itself a function.\
    \ When you call this function, Express creates an application context for you.\
    \ By convention, we name this variable app.\n\nExpress functionality is provided\
    \ through something called middleware, which are asynchronous functions that manipulate\
    \ the request and response objects. To specify middleware for your app, you call\
    \ app.use(), passing in the middleware you. In our case, we use the logger middleware\
    \ to set dev mode, which will log to all requests coming in.\n\nNext we use app.get()\
    \ to tell Express how we want to handle HTTP GET to the /api/:name path. The name\
    \ change in the path is a named route parameter. When the API is hit, Express\
    \ will grab that part of the URL and make it available in req.params.\n\nIn addition\
    \ to get(), Express has put(), post(), and del() to register handlers for PUT,\
    \ POST, and DELETE, respectively. In our case, this program listens on port 3000\
    \ for incoming requests. Finally, when the server is ready, let's see what it\
    \ does.\n\n## Running a Server with npm\n\nInstead of starting the server with\
    \ node directly, this time we'll use npm. Open a terminal to the hello directory\
    \ and run:\n\n```bash\n$ npm start\n```\n\nThe output should look like this:\n\
    \n```\n> hello@0.1.0 start\nnode server.js\n\nready captain.\n```\n\nnpm knows\
    \ how to run this because of the scripts in package.json. If you open package.json,\
    \ you'll find a section that looks like this:\n\n```json\n\"scripts\": {\n  \"\
    start\": \"node server.js\"\n}\n```\n\n## Testing Endpoints with curl\n\nWith\
    \ the server running, let's try it out. In a separate console, request the /api/\
    \ path with curl:\n\n```bash\n$ curl -i http://localhost:3000/api/world\n```\n\
    \nYou should see:\n\n```\nHTTP/1.1 200 OK\nX-Powered-By: Express\nContent-Type:\
    \ application/json\nContent-Length: 18\nDate: Tue, 10 Sep 2013 14:41:22 GMT\n\
    Connection: keep-alive\n\n{\n  \"hello\": \"world\"\n}\n```\n\nThe -i flag tells\
    \ curl to output the HTTP headers in addition to the JSON body. curl is a useful\
    \ command-line tool for issuing HTTP requests to a server.\n\nTo create the b4\
    \ database, make sure CouchDB is running, then use curl for the command line:\n\
    \n```bash\n$ curl -X PUT http://localhost:5984/b4\n```\n\n```json\n{\"ok\":true}\n\
    ```\n\n## Writing Modular Express Services\n\nThroughout the remainder of the\
    \ chapter, we're going to build a RESTful service with Express for creating and\
    \ managing book bundles. These are basically named reading lists. Our app will\
    \ be called Better Builder (or b4 for short).\n\nWe'll work extensively with the\
    \ books database we set up in Chapter 5, Accessing Databases, on page 65, as well\
    \ as a new database called b4. Our application will work roughly as follows:\n\
    \n- It will communicate with two databases: the books database and the b4 database.\n\
    - To the b4 application, the books database is read-only (we will not add delete\
    \ any documents in it).\n- The b4 database will store user data, including the\
    \ book bundles that users make.\n\n## Separating Server Code into Modules\n\n\
    Just like our Hello World example, the main entry point for the b4 service is\
    \ the server.js. But instead of assigning a handler to app.get() directly, now\
    \ we specify some configuration parameters and pull in the API modules:\n\nHere's\
    \ the part of b4/server.js that differs from the Hello World version:\n\n```javascript\n\
    const config = {\n  bookdb: 'http://localhost:5984/books/',\nb4db: 'http://localhost:5984/b4'\n\
    };\n\nrequire('./lib/book-search.js')(config, app);\nrequire('./lib/field-search.js')(config,\
    \ app);\nrequire('./lib/bundle.js')(config, app);\n```\n"
