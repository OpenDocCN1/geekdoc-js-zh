    programming environments, which import or #include other libraries. In Chapter
    3, Networking with Sockets, on page 23, which you''ll learn how to create your
    own modules.


    Next we call the fs module''s watch() method, which polls the target file for
    changes and invokes the supplied callback function whenever it does.


    In JavaScript, functions are first-class citizens. This means they can be assigned
    to variables and passed as parameters to other functions. Our callback function
    is an `anonymous` function; it doesn''t have a name.


    The callback function calls console.log() to echo a message to standard output
    whenever the file changes. Let''s try it out.


    Return to the command line and launch the watcher program using node, like so:


    ```

    $ --harmony watcher.js

    Watching target.txt for changes...

    ```


    The --harmony parameter tells Node to use the latest ECMAScript Harmony features
    available. ECMAScript Harmony is the code name for the next version of ECMAScript,
    the standard behind the JavaScript language. Not all Harmony features are ready
    for prime time, but the ones we''ll use in this book are OK (except where noted).


    After the program starts, Node will patiently wait until the target file is changed.
    To trigger a change, open another terminal to the same directory and touch the
    file again:


    ```

    $ touch target.txt

    ```


    The terminal running watcher.js will output the string ''target.txt'' just changed!,
    and then the program will go back to waiting.


    # Visualizing the Event Loop


    The program we wrote in the last section is a good example of the Node event loop
    at work. Recall the event-loop figure from *Node Applications Work*, on page 3.
    Our simple file-watcher program causes Node to go through each of these steps,
    by by one.


    To run the program, Node does the following:


    +   It loads the script, running all the way through to the last line, produces
    the *Now watching* message in the console.

    -It sees that there''s more to do, because of the call to watch().'
