  mdcn: "\n\n## 为 Node.js 事件循环编写程序\n\n让我们从开发几个简单的程序开始，用于监控文件变化并从命令行读取参数。尽管这些程序很短，但它们能让我们对\
    \ Node 基于事件的架构有深入的了解。\n\n## 监控文件变化\n\n监控文件变化是一个非常方便的切手问题，因为它要求异步编码，同时展示了 Node\
    \ 的重要概念。每当文件发生变化时采取行动，在从自动化部署到运行单元测试的许多情况下都是非常实用的。\n\n打开终端开始。在命令行中，导航 true一个空目录。你将在该目录中使用本章中的所有的代码示例。到达那里后，使用\
    \ `touch` 命令创建一个名为 `target.txt` 的文件。\n\n```bash\n$ touch target.txt\n```\n\n该文件将作为我们监控程序的\
    \ target。现在打开文件编辑器并输入以下内容：\n\n```javascript\nfile-system.js\nconst fs = require('fs');\n\
    fs.watch('target.txt', function() {\n  console.log(\"File target.txt just changed!\"\
    );\n});\nconsole.log(\"Now watching target.txt for changes...\");\n```\n\n将此文件保存为\
    \ `watcher.js`，并放在 `target.txt` 相同的目录下。让我们看看这个程序是如何工作的。\n\n首先，注意顶部的 `const` 关键字。这段\
    \ JavaScript（ECMAScript Harmony 的一部分）设置了一个具有常量值的变量。`require()` 函数引入一个模块并返回它。在我们的情况下，我们正在调用\
    \ `require('fs')` 来引入 Node 内置的文件系统模块¹。\n\n在 Node.js 中，模块是一个自包含的 JavaScript 代码段，提供了可在其他地方使用的的功能。`require()`\
    \ 的输出通常是一个普通的 JavaScript 对象。除了模块提供的功能外，它并没有特别特殊之处。\n\nNode 的模块实现基于 CommonJS 模块规范²。模块可以依赖于模块，就像其他编程环境中的库一样，这些库导入或\
    \ #include 其他库。在第 3 章“使用 Sockets 网络”第 23 页，你将学习如何创建自己的模块。\n\n接下来，我们调用 `fs` 模块的\
    \ `watch()` 方法，它会轮询目标文件的变化，并在发生变化时调用提供的回调函数。\n\n在 JavaScript 中，函数是一等公民。这意味着它们可以赋值给变量，并作为参数传递给其他函数。我们的回调函数是一个\
    \ `anonymous`（匿名）函数；它没有名字。\n\n回调函数在文件每次变化时调用 `console.log()` 向标准输出打印消息。让我们试一下。\n\
    \n回到命令行并使用 `node` 启动监控程序，如下所示：\n\n```bash\n$ node --harmony watcher.js\nWatching\
    \ target.txt for changes...\n```\n\n`--harmony` 参数告诉 Node 使用可用的最新 ECMAScript Harmony\
    \ 特性。ECMAScript Harmony 是 ECMAScript 下版本的代号（JavaScript 语言背后的标准）。并不是所有的 Harmony\
    \ 特性都已准备就，但我们在书中将使用的那些是没问题的（另有说明除）。\n\n程序启动后，Node 将耐心地等待，直到目标文件发生变化。要触发变化，请打开另一个终端进入同一个目录并再次\
    \ `touch` 文件：\n\n```bash\n$ touch target.txt\n```\n\n运行 `watcher.js` 的终端将输出字符串\
    \ 'target.txt just changed!'，然后程序将恢复等待状态。\n\n## 可视化事件循环\n\n我们在上一节中编写的程序是 Node\
    \ 事件循环运行的良好示例。回 *Node Applications Work* 第 3 页的事件循环图。我们简单的文件监控程序导致 Node 逐一通过这些步骤中的每一个。\n\
    \n要运行程序，Node 执行了以下操作：\n\n- 它加载脚本，一直运行到最后一行，在控制台中产生 *Now watching* 消息。\n- 由于调用了\
    \ `watch()`，它看到还有更多工作要做。\n- 它 等待某事的发生，即 `fs` 模块观察到文件的变化。\n- 当检测到变化时，它执行回调函数。\n\
    - 它判断程序尚未结束，并恢复等待。\n\nNode.js 程序会经历这些步骤；事件循环不断旋转，直到没有可做的事或程序通过其他方式退出。例如，如果抛出异常且未被捕获，进程将退出。接下来我们将看到它是如何工作的。\n\
    \n## 读取命令行参数\n\n现在，让我们通过将要监控的文件作为命令行参数，让我们的程序变得更有用。这将引入 `process` 全局对象以及 Node\
    \ 处理异常的方式。\n\n打开编辑器并输入以下内容：\n\n```javascript\nfile-system/watcher-argv.js\nconst\
    \ fs = require('fs');\nfilename = process.argv[2];\nif (!filename) {\n  throw\
    \ Error(\"A file to watch must be specified!\");\n}\nfs.watch(filename, function()\
    \ {\n  console.log(\"File \" + filename + \" just changed!\");\n});\nconsole.log(\"\
    Now watching \" + filename + \" for changes...\");\n```\n\n将文件保存为 `watcher-argv.js`。你可以这样运行它（注意结尾的\
    \ `target.txt` 参数）：\n\n```bash\n$ node --harmony watcher-argv.js target.txt\n\
    Now watching target.txt for changes...\n```\n\n你应该能看到与第一个 `watcher.js` 程序相同的输出和行为。在输出\
    \ `Now watching target.txt for changes...` 后，脚本将勤恳地等待目标文件。\n\n此程序使用 `process.argv`\
    \ 来访问传入的命令行参数。`argv` 代表 \"argument vector\"（参数向量）；它是一个包含传递给 Node 进程的命令行参数的数组。第一个元素是\
    \ Node 可执行文件的路径，第二个是脚本路径，后续元素是参数。\n\n## 产生子进程\n\n让我们通过产生子进程来进一步增强我们的程序。我们将使用 child-process\
    \ 模块及其 `spawn()` 方法。\n\n打开编辑器并输入以下内容：\n\n```javascript\nfile-system/watcher-argv.js\n\
    \"use strict\";\nconst fs = require('fs');\nspawn = require('child_process').spawn;\n\
    filename = process.argv[2];\n\nif (!filename) {\n  throw Error(\"A file to watch\
    \ must be specified!\");\n}\n\nfs.watch(filename, function() {\n  let ls = spawn('ls',\
    \ ['lh', filename]);\n  ls.stdout.pipe(process.stdout);\n});\nconsole.log(\"Now\
    \ watching \" + filename + \" for changes...\");\n```\n\n将文件保存为 `watcher-spawn.js`\
    \ 并像之前一样运行它：\n\n```bash\n$ node --harmony watcher-spawn.js target.txt\nWatching\
    \ target.txt for changes...\n```\n\n如果你在另一个控制台 touch 文件，Node 将产生类似下面的内容：\n\n```\n\
    -rw-r--r-- jimbo staff 0B Dec 19 22:45 target.txt\n```\n\n用户名、组等方面与之前的输出不同，但格式应该是相同的。\n\
    \n我们刚刚的程序顶部使用了 \"use strict\" 字符串。严格模式引入自 ECMAScript 5——它用了某些语言特性并让其他特性抛出异常。通常来说，使用严格模式是一个好主意。\n\
    \n严格模式也是使用 Harmony 特性的必要条件，例如 `let` 关键字。像 `const` 一样，`let` 声明了一个变量，但用 `let` 声明的变量可以赋值多次。\n\
    \n记住，使用 Harmony 特性（如 `let`），你的代码需要 `--harmony` 标志。例如，`const` 不需要该标志，但 `let` 需要。\n\
    \n接下来，注意我们在开头添加了一个新的 `require()`。调用('child_process') 返回子进程模块。我们只对 `spawn()` 方法感兴趣，因此将其赋值给一个同名的常量并忽略模块的其他部分。\n\
    \n```javascript\nspawn = require('child_process').spawn,\n```\n\n记住，函数在 JavaScript\
    \ 中是一等公民，所以我们可以像这里这样将它们赋值给变量。\n\n接下来，查看给 `fs.watch()` 的回调函数。\n\n```javascript\n\
    function() {\n  let ls = spawn('ls', ['lh', filename]);\n  ls.stdout.pipe(process.stdout);\n\
    }\n```\n\n`spawn()` 的第一个参数是要执行的程序名称；在我们的例子中是 `ls`。第二个参数是命令行参数数组。\n\n`spawn()`\
    \ 返回的对象是一个 `ChildProcess`³其 `stdin`、`stdout` 和 `stderr` 属性是用于读取或写入数据的流（Streams）。我们想要\n\
    \n+ 1. http://nodejs.org/api/fs.html\n2. http://wiki.creativecommons.org/wiki/Modules/1.1\n\
    3. http://nodejs.org/api/child_process.html\n\n"
