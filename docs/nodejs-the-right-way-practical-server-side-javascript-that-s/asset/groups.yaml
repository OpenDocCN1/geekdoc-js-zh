    \ ECONNREFUSED\n```\n\n`redisClient` 对象包含一个布尔属性 `ready`，我们可以在中间件中检查它。让我们接下来来实现这一操作。\n\
    \n## 实现自定义中间件\n\n你已经学习了如何在 Express 中实现路由处理程序；现在让我们来看看如何创建自定义中间件。中间件和路由处理程序的区别在于，中间件旨在作为链中的一环，而路由处理程序则旨在位于链的最末端。中间件函数接受三个参数：请求对象\
    \ (`req`)、响应对象 (`res`) 以及一个在中间件执行完成后调用的函数 (`next`)。\n\n让我们创建一个中间件函数来强制执行我们的 passport\
    \ 会话检查。如果一切按计划进行，它将调用 `next` 函数；如果发生任何错误，它将给出一个适当的 RESTful 响应。\n\n```javascript\n\
    web-app/server.js\nconst authed = function(req, res, next) {\n  if (req.isAuthenticated())\
    \ {\n    return next();\n  } else if (redisClient.ready) {\n    res.json(403,\
    \ {\n      error: \"forbidden\",\n      reason: \"not_authenticated\"\n    });\n\
    \  } else {\n    res.json(503, {\n      error: \"service_unavailable\",\n    \
    \  reason: \"authentication_unavailable\"\n    });\n  }\n}\n```\n\n首先，我们检查 `req.isAuthenticated()`。这是\
    \ passport 添加的一个方法，只有当传入的会话 cookie 已知会话时才会返回 `true`。如果用户已通过身份验证，我们立即调用 `next()`\
    \ 继续执行中间件链。\n\n否则，检查 `redisClient.ready` 是否为 `true`。如果是，则用户未通过身份验证（不是系统错误），正确的状态码是\
    \ `403 Forbidden`。我们不能使用 `401 Unauthorized`，因为那需要 `WWW-Authenticate` 头部，该头部会告诉浏览器可用的验证机制（而我们没有提供基于\
    \ cookie 的会话机制）。\n\n最后，如果 `redisClient.ready` 为 `false`，则没有用户可以进行身份验证。适当的响应是 `503\
    \ Service Unavailable`，因为在 Redis 返回之前，任何经过验证的 API 都无法进行有意义的操作。\n\n好了，现在我们已经有了自定义中间件，让我们将其应用到一些经过验证的\
    \ API 上。\n\n## 创建身份验证 API\n\n我们需要创建新的、特定用户的 API，并希望它们使用我们的 `authed()` 中间件。但我们并不希望所有其他路由（例如我们的静态文件服务）都经过验证。这些路由仍然需要在没有任何身份验证的情况下提供服务。因此，我们不能像使用其他中间件那样直接调用\
    \ `use()`。\n\n在 Express 中指定路由时，你可以包含仅应用于该路由的中间件。我们将对 `/api/user` 路由使用此项功能：\n\n\
    ```javascript\nweb-app/b4/server.js\napp.get('/api/user', authed, function(req,\
    \ res) {\n  res.json(req.user);\n});\n```\n\n得益于我们已经创建的 `authed()` 函数，这个简短的路由处理程序就是我们需要的。当路由处理程序被调用时，中间件已经执行完毕。\n"
