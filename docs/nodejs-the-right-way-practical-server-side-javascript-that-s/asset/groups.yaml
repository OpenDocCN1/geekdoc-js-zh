  - '[PAGE 114]


    Yielding Control with Generators • 99


    If we get the 200 OK status we''re after, then the promise continues to overwrite
    the bundle''s name field. We do another Q.call() to PUT the bundle document back
    into CouchDB, and return the promise that this produces on line 10 Q waits for
    this subpromise to finish, then it uses its value to resolve the original promise,
    at which point the second''s handler gets invoked.


    So in this case—whether we return a value directly or another promise—Q knows
    what to do.


    Lastly, notice the catch() method at the end of the promise chain on line 19.
    catch() is like then() except that it only takes an error handler, not a success
    handler. The catch handler will be called if any of the promises up the chain
    are rejected (explicitly or by a function throwing an exception).


    The name catch is not a coincidence. Just like a try/catch block lets you capture
    exceptions in synchronous code, the catch handler lets you capture exceptions
    in promise-driven asynchronous code.


    Promises are a powerful abstraction for using asynchronous code, but to use them
    effectively you really need a firm grasp of how they work. They offer the possibility
    of simplifying your asynchronous workflow, especially when combined with another
    abstraction: generators.


    Next''s explore how generators work and see how they work with promises to make
    code that reads like it''s synchronous but runs asynchronously.


    # Yielding Control with Generators


    ECMAScript Harmony introduces a new concept called a generator. A generator is
    a function except that you can suspend its execution and resume later.


    This feature isn''t quite ready for prime time, and you''ll need a version of
    Node higher than 0.10.x to try it out (unstable 0.11, for example). However, this
    is the direction ECMAScript is heading, and itll be production-ready before you
    know it.


    Once a regular JavaScript function starts executing, it can finish in one of two
    ways. Either it finishes normally by getting to the end or hitting a return statement,
    or it finishes normally, throwing an exception. In both cases, the function will
    run to conclusion.


    Generators are different. With a generator, you can yield a value without actually
    finishing execution, and then pick up where you left off.'
