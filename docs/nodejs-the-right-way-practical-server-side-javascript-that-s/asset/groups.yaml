    const config = {\n  bookdb: 'http://localhost:5984/books/',\nb4db: 'http://localhost:5984/b4'\n\
    };\n\nrequire('./lib/book-search.js')(config, app);\nrequire('./lib/field-search.js')(config,\
    \ app);\nrequire('./lib/bundle.js')(config, app);\n```"
- md: "\n## Chapter 6. Scalable Web Services • 92\n\nEach of the three API modules\
    \ is a function that takes two arguments: our config hash and the Express app\
    \ to add to routes.\n\nLet's run the server and then we'll dig into the API modules.\
    \ This time, instead of using npm, we'll use nodemon. Short for \"Node Monitor\"\
    , nodemon runs a Node.js program and then automatically restarts it whenever the\
    \ source code changes.\n\nTo get nodemon, install it globally through npm:\n\n\
    ```\n$ npm install -g nodemon\n```\n\nNow use nodemon to start up the b4 service.\n\
    \n```\n$ nodemon --harmony server.js\n16 Sep 19:05:50 - [nodemon] v0.7.8\n16 Sep\
    \ 19:05:50 - [nodemon] to restart at any time, ever `rs`\n16 Sep 19:05:50 - [nodemon]\
    \ watching: ./web-services/b4\n16 Sep 19:05:50 - [nodemon] starting 'node --harmony\
    \ server.js'\nready captain.\n```\n\nNow let's dig into the search APIs.\n\n#\
    \ Implementing Search APIs\n\nTo build a book bundle, a user has to be able to\
    \ discover books to add to it. Our modular web service will have two search APIs:\
    \ field search (for discovering authors and subjects) and book search (finding\
    \ books by a given author or subject).\n\nThe Node.js code for these two APIs\
    \ is quite similar—so we'll focus on the field search here and leave the book\
    \ search for the wrap-up questions at the end.\n\nThe field search API helps users\
    \ find authors or subjects based on a starting string. For example, to get a list\
    \ of subjects that start with Croc, you'd make a request like this:\n\n```\n$\
    \ curl http://localhost:3000/api/search/subject?q=Croc\n[\n\"Crocheting\",\n\"\
    Crocheting -- Patterns\",\n\"Crockett, Davy, 1786-1836\",\n\"Crocodiles\",\n\"\
    Crocodiles -- Juvenile fiction\"\n]\n```\n\nThis API could be employed, for instance,\
    \ in a user interface so that when a user starts typing a subject, suggestions\
    \ automatically pop up.\n\nWriting Modular Services • 93\n\nLet's take a look\
    \ at how this is accomplished in code. Here is the content of the lib/field-search.js\
    \ file in your b4 project:\n\n```\nweb-services/b4/lib/field-search.js\n'use strict';\n\
    const request = require('request');\nmodule.exports = function(config, app) {\n\
    \  app.get('/api/search/:view', function(req, res) {\n    request({\n      method:\
    \ 'GET',\n      url: config.bookdb + '/design/books/view/by_' + req.params.view,\n\
    \      qs: {\n        startkey: JSON.stringify(req.query.q),\n        endkey:\
    \ JSON.stringify(req.query.q + \"|\\uffff$\"),\n      },\n      group: true\n\
    \    }, function(err, couchRes, body) {\n      // couldn't connect to CouchDB\n\
    \      if (err) {\n        res.json(502, { error: \"bad_gateway\", reason: err.code\
    \ });\n        return;\n      }\n\n      // CouchDB couldn't process our request\n\
    \      if (couchRes.statusCode != 200) {\n        res.json(couchRes.statusCode,\
    \ JSON.parse(body));\n        return;\n      }\n\n      // send back just the\
    \ keys we got back from CouchDB\n      res.json(JSON.parse(body).rows.map(function\
    \ (elem) {\n        return elem.key;\n      }));\n    });\n  });\n};\n```\n\n\
    This program does a lot in it to digest at once. Let's take it a piece at a time.\n\
    \nFirst, in line 3, we set module.exports to a function. This is how we create\
    \ a module that is itself a function (like request and express). When you write\
    \ modules that do only one thing, this is a handy pattern.\n\nNext up, we call\
    \ app.get() in line 4 to register a route with the Express app. Once the route\
    \ callback function starts, it immediately makes a request to CouchDB, starting\
    \ on line 5. To build out the request URL, we use the value req.params.view, which\
    \ Express extracted from the URL.\n\n## Chapter 6. Scalable Web Services • 94\n\
    \nSo, for instance, when someone requests /api/search/subject, this will trigger\
    \ a request to the CouchDB view _design/books/_view/by_subject. Notice that we\
    \ don't check whether req.params.view is one of our expected values—this is left\
    \ as an exercise at the end of the chapter.\n\nTo limit the results coming back\
    \ from CouchDB, we specify query string parameters in q on line 9. When an incoming\
    \ request contains ?q=Croc, then req.query.q will be the string \"Croc\" (without\
    \ quotes).\n\nWhen receiving a request for a value, CouchDB uses the startkey\
    \ and endkey parameters. In our case, we want all the keys that start with the\
    \ query string. Using req.query + \"|\\uffff$\" for the end guarantees that we'll\
    \ get all the keys that start with our query parameter. And setting group to true\
    \ for this view tells CouchDB that we unique keys only (no duplicates).\n\nFinally,\
    \ starting on line 13, we have our handler function for when the CouchDB request\
    \ returns. There are three outcomes we have to account for:\n\n- The error case—CouchDB\
    \ didn't respond, so we should send 502 Bad Gateway to the requester.\n- The non-success\
    \ case—CouchDB responded, but it wasn't the expected 200 OK result, so we pass\
    \ back to the requester.\n- The success case—CouchDB responded with the data,\
    \ so we parse the JSON and extract just the keys to send back.\n\nThis example\
    \ demonstrates some challenges you'll face. The nice thing about REST is it gives\
    \ you a good basis for API. For a variety of cases, HTTP specification prescribes\
    \ specific status codes. However, doing it can be a challenge since you have to\
    \ account for variety of success and non-success cases. Promises offer one way\
    \ One thing I love about JavaScript is its extreme flexibility. In JavaScript\
    \ there are different ways of doing anything, and you get to pick the one you\
    \ like. This is especially true of managing asynchronous code.\n\n## RESTful APIs\
    \ with Promises\n\nWe've already seen a number of approaches to working with asynchronous\
    \ code. Early on, we used regular Node.js callbacks, and then talked about EventEmitters\
    \ and streams. We explored the async module and its coding utilities, as well.\
    \ Now let's use RESTful APIs for editing book bundles. Here we'll talk about promises—another\
    \ approach to managing code.\n\n## Creating a Resource with a Promise\n\nThe first\
    \ thing we'll need for our API is a way to create them. For that, we'll create\
    \ an Express route that handles POST requests. Whenever regular JavaScript function\
    \ starts, it will finish in two ways: either it will run to completion, or it\
    \ will throw exception. For synchronous code, this is good enough; for asynchronous\
    \ code we need a bit more. Node.js callbacks use arguments (e.g., function(err,\
    \ data)), and EventEmitters use different types.\n\nA promise is an object that\
    \ encapsulates results for operation. Once the operation is completed, the promise\
    \ will either be resolved (success case) or rejected (error case). You use the\
    \ then() method to attach success and error handlers to promise. Let's see how\
    \ this works by using a promise with the result of request() from our CouchDB\
    \ server. There are many promise libraries available through npm—we'll use Q module.\
    \ Q is a full-featured promise library with lots of helper methods for management\
    \ approaches.\n\nOpen the lib/bundle.js file and take a look. At the top, you'll\
    \ see that we bring in the request and Q modules. Then, inside the module.exports\
    \ function, you'll find the following code for creating a bundle:\n\n```\nweb-services/b4/lib/bundle.js\n\
    Line 1 app.post('/api/bundle', function(req, res) {\n  let deferred = Q.defer();\n\
    \  request.post({\n    url: config.bookdb,\n    json: { type: 'bundle', name:\
    \ req.query.name, books: {} }\n  }, function(err, CouchRes, body) {\n    if (err)\
    \ {\n      deferred.reject(err);\n    } else {\n      deferred.resolve([couchRes,\
    \ body]);\n    }\n  });\n\n  deferred.promise.then(function(args) {\n    let couchRes\
    \ = args[0], body = args[1];\n    res.json(couchRes.statusCode, body);\n  }, function(err)\
    \ {\n    res.json(502, { error: \"bad_gateway\", reason: err.code });\n  });\n\
    });\n```\n\n> 5. https://npmjs.org/package/q\n\nThis code adds a route using app.post()\
    \ that sends forward a POST to CouchDB and returns its results. You can try it\
    \ out with curl like:\n\n```\ncurl -X POST http://localhost:3000/api/bundle/\n\
    {\n  \"ok\": true,\n  \"id\": \"0912f028cd8683df0813b0fc69c000377\",\n  \"rev\"\
    : \"1-7ef08d5d3996cba0b162e09434406f\"\n}\n```\n\nIn line 2, we create a Deferred\
    \ object. This class is specific to the Q module—it provides methods for working\
