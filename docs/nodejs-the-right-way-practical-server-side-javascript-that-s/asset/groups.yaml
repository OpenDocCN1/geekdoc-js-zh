  - "[PAGE 61]\n\n# Chapter 4. Robust Messaging Services • 46\n\nNotice that the string\
    \ we send to publisher.send() is the output of JSON.stringify(). ØMQ does not\
    \ do any formatting of messages itself—it is only interested in pushing bytes\
    \ down the line. It's our job to serialize and deserialize any messages we send\
    \ through ØMQ.\n\nFinally, we call publisher.bind('tcp://*:5432') to tell ØMQ\
    \ to listen on TCP port 5432 for subscribers.\n\nLet's get the publisher running:\n\
    \n```\n$ node --harmony zmq-watcher-pub.js target.txt\nListening for zmq subscribers...\n\
    ```\n\nEven though this service uses TCP, we can't simply use telnet to get anything\
    \ out of it. A ØMQ server requires a ØMQ client because of its high-performance\
    \ binary protocol.\n\nNow let's implement the subscriber end.\n\n# Subscribing\
    \ to a Publisher\n\nImplementing the SUB portion of the ØMQ PUB/SUB pair requires\
    \ even less code than the publisher. Open an editor and enter this:\n\n```\nmessaging/zmq-watcher-sub.js\n\
    \"use strict\";\nconst\n  zmq = require('zmq');\n\n// create subscriber endpoint\n\
    \  subscriber = zmq.socket('sub');\n\n// subscribe to all messages\n  subscriber.subscribe(\"\
    \");\n\n// handle messages from publisher\nsubscriber.on(\"message\", function(data)\
    \ {\n  let\n    message = JSON.parse(data);\n    date = new Date(message.timestamp);\n\
    \    console.log(\"File ' + message.file + ' changed at \" + date);\n});\n\n//\
    \ connect to publisher\n  subscriber.connect(\"tcp://localhost:5432\");\n```\n\
    \nSave this file as zmq-watcher-sub.js. It uses zmq.socket('sub') to make a subscriber\
    \ endpoint."
  - '[PAGE 62]


    Message-Publishing and -Subscribing • 4


    Calling subscriber.subscribe("") tells Ø that we want to receive all messages.
    If you only want certain messages, you can provide a string that acts as a prefix
    filter. You must call subscribe() at some point in your code—you won''t receive
    any messages until you do.


    The subscriber object inherits from EventEmitter. It emits a message event whenever
    it receives one from a publisher, so we use subscriber.on() to listen for them.


    Lastly, we use subscriber.connect() to establish the client end of the connection.


    Let''s see how these pieces fit together. With the PUB program still running in
    one terminal, fire up zm-watcher-sub in a second one:


    ```

    $ node --harmony zm-watcher-sub.js

    ```


    Then, in a third terminal, touch the target file:


    ```

    $ touch target.txt

    ```


    In the subscriber terminal, you should see output something like this:

    File ''target.txt'' changed at Wed May 22 2013 21:34:10 GMT-0400 (EDT)


    So far, things look pretty great. The publisher and subscriber programs are able
    to successfully communicate with the PUB/SUB socket pair.


    But it gets even better. Keep those services running; next we''ll cover how ØMQ
    handles network interruptions.


    # Automatically Reconnecting Endpoints


    Let''s see what happens when one of the endpoints disconnected unexpectedly. Try
    killing the publisher in its terminal via Ctrl-C.


    Afterwards, switch over to the subscriber terminal. you may notice something strange
    happened—nothing. The subscriber keeps waiting for messages even though the publisher
    is down, like nothing happened.


    Start up the publisher again in the first terminal, then touch the target file.
    The subscriber should log a File changed message to the console. It''s as though
    they were connected the whole time.


    From ØMQ''s perspective, it doesn''t matter which endpoint starts first. And it
    automatically reestablishes the connection when an endpoint comes back online.
    These characteristics add up to a robust platform that gives you stability without
    a lot of work of your part.


    In our previous examples, both the PUB and SUB endpoints were made from zm.socket().
    This means they both have the power to either bind() or connect().'
  - '[PAGE 63]


    # Chapter 4. Robust Messaging Services • 48


    Our code had the publisher bind a TCP socket (as the server) and the sub-subscriber
    connect (as the client), but ØMQ doesn''t force you to do it this way. We could
    have flipped it around and the subscriber bind a socket to which the publisher
    connects.


    When you design a networked application, you''ll typically have the stable parts
    of your architecture bind and the transient parts connect to them. With ØMQ, you
    get to decide which parts of your system will be stable, and you get to decide
    which messaging pattern best suits your needs. But you don''t have to decide them
    at the same time, and it''s easy to change your mind later. ØMQ provides flexible,
    durable pipes for constructing distributed applications.


    Node.js, ØMQ doesn''t have a data-center scaling strategy out of the box. Both
    provide you with building blocks to get you there.


    Next we''ll look at a different messaging pattern: request/response. Then we''ll
    tie this with Node''s clustering support to manage a pool of worker processes.


    # Responding to Requests


    The REQ/REP (request/reply) pattern is quite common in networked programming,
    particularly in Node. We''ll use this pattern often in the next couple of chapters,
    and ØMQ has great support for it. You''ll see in a minute, where the "Q" of ØMQ
    becomes apparent.


    In ØMQ, a REQ/REP pair communicates in lockstep. A request comes in, then a reply
    goes out. Additional incoming requests are queued and later dispatched by ØMQ.
    Your application, however, is only aware of one request at a time.


    Let''s see how this works, again using the file system as a source of information
    for building a service. In this scenario, a responder waits for a request for
    file data, then serves up the content when asked. We''ll start with the responder—the
    REP (reply) part of the REQ/REP pair.


    # Implementing a Responder


    Open an editor and enter the following:


    ```

    messaging/zmq-filer-rep.js

    ''use strict'';

    const

    fs = require(''fs'');

    zmq = require(''zmq'');

    // socket to reply to client requests

    responder = zmq.socket(''rep'');

    ```'
