    ```bash\n$ curl -X PUT http://localhost:5984/b4\n```\n\n```json\n{\"ok\":true}\n\
    ```\n\n## 编写模块化的 Express 服务\n\n在本章的剩余部分中，我们将使用 Express 构建一个 RESTful 服务来创建和管理书单。这些书单本质上是命名的阅读列表。我们的应用将被称为\
    \ Better Builder（简称为 b4）。\n\n我们将广泛使用第 5 章“访问数据库”（第65页）中设置的 books 数据库，以及一个新的数据库\
    \ b4。我们的应用程序工作大致如下：\n\n- 它与两个数据库通信：books 数据库和 b4 数据库。\n- 对于 b4 而言，books 数据库是只读的（我们不会在其中添加或删除任何文档）。\n\
    - b4 数据库将存储用户数据，包括用户制作的书单。\n\n## 将服务器代码分离到模块\n\n与我们的 Hello World 示例一样，b4 服务的程序入口是\
    \ server.js。但现在不是直接为 app.get() 分配处理程序，而是指定了一些配置参数并引入 API 模块：\n\n这里是 b4/server.js\
    \ 与 Hello World 版本不同的部分：\n\n```javascript\nconst config = {\n  bookdb: 'http://localhost:5984/books/',\n\
    b4db: 'http://localhost:5984/b4'\n};\n\nrequire('./lib/book-search.js')(config,\
    \ app);\nrequire('./lib/field-search.js')(config, app);\nrequire('./lib/bundle.js')(config,\
    \ app);\n```\n\n"
