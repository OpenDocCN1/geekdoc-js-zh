    # Dealing with Update Conflicts


    But one more thing before we move on to querying. There’s something strange about
    that first entry—let’s take a look at book 0:


    ```

    $ dbcli.js GET books/0

    200 { _id: ''0'',

    _rev: ''1-453265aaa7aa714d46bd72f6232618'',

    title: '''',

    authors: [],

    subjects: [] }

    ```


    The book with id 0 has no title, no authors, and no subjects. It turns out that
    this record is just a template; the RDF file that produced this document is pretty
    much empty.


    We don’t need this document, let’s delete it. Try removing it with DELETE:


    ```

    $ dbcli.js DELETE books/0

    409 { error: ''conflict'', reason: ''Document update conflict.'' }

    ```


    CouchDB responded with a 409 Conflict status code. This is actually a good thing—CouchDB
    guards against conflicts and race conditions by demanding a revision ID for updates
    to an existing document. Since our request didn’t include a _rev parameter at
    all, it didn''t match the document we were attempting to delete.


    So, to DELETE or PUT a document that you want, you need to provide a revision:


    ```

    $ dbcli.js DELETE books/0?rev=1-453265aaa7aa714d46bd72f62326186

    200 { ok: true, id: ''0'', rev: ''2-lab42137771c4fbf4c48e11c246e8a6fc'' }

