    saveBundles = function(bundles, callback) {\n  $.ajax({\n    type: 'POST',\n \
    \   url: '/api/user/bundles',\n    data: JSON.stringify(bundles),\n    contentType:\
    \ 'application/json; charset=utf-8',\n    accepts: 'application/json'\n  }).then(function(data,\
    \ status, xhr) {\n    callback(data);\n  }, function(xhr, status, err) {\n   \
    \ callback(err);\n  });\n}\n```\n\n该函数接收一个 `selected` 参数，即我们想要显示的视图。首先，我们将 `window.location.hash`\
    \ 设置为匹配指定的视图。例如，如果调用 `showView('list-bundles')`，它将更新页面的 URL 以 #list-bundles 结尾。\n\
    \n接下来的部分非常简洁，得益于 jQuery。我们找到页面上所有类名为 `view` 的 `<div>`，将它们隐藏，然后找到 ID 与我们选定的视图匹配的那一个，并显示它。\n\
    \n（注：由于提供的原始文本存在大量 OCR 错误和重复，此处已根据逻辑整合并翻译了原文中第 136-138 页描述的核心内容。）\n\n---\n\n##\
    \ 使用 Handlebars 生成 HTML\n\nHandlebars 是一个简单但强大的模板引擎。它允许你编写带有占位符的 HTML 模板，这些占位符稍后会被填充。在本章中，我们将使用\
    \ Handlebars 来渲染包列表。\n\n以下是包（bundles）列表的模板：\n\n```html\n<table>\n  <thead>\n \
    \   <tr>\n      <th>Bundle Name</th>\n      <th>Actions</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    {{#each bundles}}\n    <tr data-id=\"{{@key}}\">\n      <td>{{name}}</td>\n\
    \      <td>\n        <button class=\"btn edit\">\n          <i class=\"glyphicon\
    \ glyphicon-pencil\"></i>\n        </button>\n        <button class=\"btn delete\"\
    >\n          <i class=\"glyphicon glyphicon-trash\"></i>\n        </button>\n\
    \      </td>\n    </tr>\n    {{/each}}\n  </tbody>\n</table>\n```\n\n`{{each}}`\
    \ 助手用于遍历包数组。对于每个项目，`{{this}}` 上下指的是当前的包，而 `{{@key}}` 指索引。\n\n`{{name}}` 占位符被替换为包的名称。为了渲染模板，我们使用\
    \ `Handlebars.compile()` 函数：\n\n```javascript\nvar template = Handlebars.compile(templateString);\n\
    var html = template(bundles);\ndocument.getElementById('list-bundles-view').innerHTML\
    \ = html;\n```\n\nHandlebars 允许我们在模板中使用逻辑，例如条件判断和循环。例如，我们可以使用 `{{if}}` 在没有包时显示消息：\n\
    \n```html\n{{#if bundles}}\n  <!-- ... table code ... -->\n{{else}}\n  <p>No bundles\
    \ found.</p>\n{{/if}}\n```\n\n通过使用 Handlebars，我们可以保持 HTML 与 JavaScript 逻辑分离。这使得我们的代码更容易于维护和理解。\n\
    \n"
