    \    // fail fast if we couldn't retrieve the book\n    if (couchRes.statusCode\
    \ == 200) {\n      res.json(couchRes.statusCode, book);\n      return;\n    }\n\
    \    // add the book to the bundle and put it back in CouchDB\n    bundle.books[book.id]\
    \ = book.title;\n    args = yield put({url:config.b4db + bundle.id, json: bundle});\n\
    \    res.json(args[0], args[1]);\n  })()\n  .catch(function(err) {\n    res.json(502,\
    \ { error: \"bad_gateway\", reason: err });\n  });\n```\n\nThe first thing to\
    \ notice is line 4, where we call Q.denodeify for request and request.put. The\
    \ denodeify method takes a Node-style function (one that expects a callback) and\
    \ returns a new-producing function from it. Using denodeify is a convenient way\
    \ to avoid calling callbacks all the place. Instead, we just denodeify the functions\
    \ you plan to use, and call them later knowing they'll produce promises.\n\nRight\
    \ after that, in line 7, we call Q.async() with a generator function. Q's async\
    \ method returns a new-producing function that will start the generator when you\
    \ invoke it. We invoke this function right away on line 37.\n\nInside the generator,\
    \ any time we yield a promise, Q will wait for the promise to resolve, then resume\
    \ execution with the resolved value. For example, on line 11, we yield a promise\
    \ for a get call to CouchDB. When the promise is resolved and Q gives us back\
    \ the value, we assign to args. This is much like the calls to function(args)\
    \ we saw earlier, written in a more linear style.\n\nIf the HTTP status code from\
    \ CouchDB was something other than 200 OK we were hoping for, we send it back\
    \ to the requester and return early. Otherwise, we move to the second call in\
    \ line 22. Again we yield a promise for a get call to CouchDB, and again we check\
    \ that everything was OK when it comes back.\n\nFinally, on line 33, we add the\
    \ book to the bundle and yield—this time waiting on put. When the put is finished,\
    \ we send the results back to the requester. And if anything went wrong during\
    \ all of this, we catch it on line 38.\n\nThis API makes three asynchronous requests,\
    \ but it does it in only one function thanks to Q.async and generator functions.\
    \ On the plus side, writing code in this way has the potential to make it look\
    \ like synchronous code, reaping the benefit of working deeply with promises and\
    \ relying on some magical coordination logic.\n\n# Wrapping Up\n\nThis chapter\
    \ took us on through writing RESTful APIs with Express. You learned how to create\
    \ an Express-based web service and how to modularize your endpoints into separate\
    \ files. You saw how to add scripts to npm and how to use nodemon for restarting\
    \ your service as you make changes.\n\nWe also dug deep into promises, a novel\
    \ way for managing asynchronous code. We used the Q library to create and chain\
    \ promises, and handle errors where promises are revoked. You also saw how to\
    \ convert Node-style functions—which expect a callback—into promise-generating\
    \ functions.\n\nFinally, we used ECMAScript Harmony generator functions with Q\
    \ to write synchronous-looking code that's actually asynchronous. Although this\
    \ code is easy to read, it masks powerful logic that goes behind the scenes.\n\
    \nWe saw how Express's route methods (get(), post(), and put) provide an easy\
    \ way to set up path-based routing. And we used Express middleware to easily provide\
    \ logging capabilities to all our routes.\n\nYou can do a whole lot more with\
    \ Express and middleware than we covered in this chapter. In Chapter 7, Web Apps,\
    \ on page 107, we'll build on what we have here as we create a web-client for\
    \ using our book and bundle APIs.\n\n# Code Organization\n\nTake a look at the\
    \ lib/book-search.js file included in the code for this chapter. It's nearly identical\
    \ to lib/field-search.js—both make requests to CouchDB views and return coll results.\n\
    \n- How would you refactor the code in these APIs to minimize the amount of duplicate\
    \ code?\n\n> Hint: you don't need to fully grok the book-search code to identify\
    \ what's different from field-search and how you could refactor the parts that\
    \ are the same.\n\n# 400 Bad Request\n\nIn the lib/field-search.js file, we make\
    \ a request to CouchDB by concatenating the base URL with the user-provided view:\n\
    \n```javascript\nurl: config.couchdb + '_design/books/view/by_' + req.params.view,\n\
    ```\n\nNotice that we use the req.params.view value without sanitizing it first.\
    \ We know that the only views we support are by author and by subject.\n\nChange\
    \ the code to inspect the incoming view string before concatenating it to make\
    \ the URL. If the view isn't one of our expected values, respond with HTTP 400\
    \ Bad Request, including a JSON object explaining the problem.\n\n# DELETE\n\n\
    The book-bundle API we explored in this chapter has a method for adding a book\
    \ to a bundle.\n\n- How would you write an Express API endpoint for removing a\
    \ book from a bundle with DELETE?\n- What should your API do if the book isn't\
