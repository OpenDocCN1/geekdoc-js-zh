    # Parting Thoughts


    By now you have learned quite a bit about how to use Node for both web and non-web
    server-side JavaScript projects. Node.js is inherently asynchronous—and while
    this may have been unfamiliar to you to begin with, you''ve learned several techniques
    for managing asynchronous JavaScript code.


    You''ve used Node.js to implement middleware applications that perform a variety
    of tasks, from seeding databases with information to doling out work to a cluster
    of worker processes. You''ve developed custom protocols and worked with familiar
    ones like HTTP. You have made RESTful web services as well as services that use
    other communication patterns such as push/pull and publish/subscribe.


    Along the way, you learned how to use a number of useful npm modules. You used
    Express for simplifying the development of REST endpoints, and nodeunit for running
    unit tests on your data processing code. The request module was super useful for
    making HTTP requests, and async and Q made managing asynchronous code flows easier
    (each in their own way).


    The world of Node.js is still expanding rapidly. There are lots of ways to attack
    any given problem, and there''s always someone out there trying it in a new way.
    As you go forward and develop your own style, keep your eyes and ears open for
    new approaches and new techniques. It''s an exciting time to be a Node developer.


    Good luck, and happy coding!'
