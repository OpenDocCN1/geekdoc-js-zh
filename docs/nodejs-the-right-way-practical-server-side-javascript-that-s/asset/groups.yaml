    ## 结语


    到此时，你已经学习了许多关于使用 Node 进行 Web 和非 Web 服务端 JavaScript 项目的知识。Node.js 本质上是异步的——虽然这起初对你来说可能陌生，但你已经学习了多种管理异步
    JavaScript 代码的技巧。


    你已经使用 Node.js 实现了执行各种任务的中间件应用程序，从为数据库填充信息到向工作进程集群分发任务。你开发了自定义协议，并与 HTTP 等熟悉的协议一起工作。你不仅制作了
    RESTful Web 服务，还制作了使用其他通信模式（如推/拉和发布/订阅）的服务。


    在这一过程中，你学习了如何使用许多实用的 npm 模块。你使用 Express 简化 REST 端点的开发，并使用 nodeunit 对你的数据处理代码运行单元测试。`request`
    模块对于发送 HTTP 请求非常有用，而 `async` 和 `Q` 则让管理异步代码流变得更容易（它们各有自己的优势）。


    Node.js 的世界仍在迅速扩张。解决任何特定问题都有很多方法，总有人在尝试新的方法。当你继续前进并形成自己的风格时，请保持敏锐，关注新的方法和技术。成为一名
    Node 开发者是一个令人兴奋的时代。


    祝你好运，编码愉快！


    ## 现代 Web


    跟上最新的 HTML、CSS 和 JavaScript 技术。


    ### HTML5 和 CSS3（第2版）


    HTML5 和 CSS3 不仅仅是术语——它们是今天 Web 应用的基础。本书将让你熟悉当前项目中可以直接使用的 HTML5 元素和 CSS3 特性，并提供后兼容的解决方案，确保你不会遗留旧版浏览器的用户。新版涵盖了更多新功能，包括
    CSS 动画、IndexedDB 和客户端验证。


    Brian P. Hogan

