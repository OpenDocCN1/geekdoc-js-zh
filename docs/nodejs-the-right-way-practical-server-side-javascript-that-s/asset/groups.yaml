    \ file.\n\n# Parsing XML Data with Node\n\nTo parse the XML files, we'll use cheerio,\
    \ a jQuery-like library for working with XML documents in Node.\n\nFirst, install\
    \ cheerio over npm and save the dependency:\n\n```bash\n$ npm install --save cheerio\n\
    ```\n\nNext, inside your databases project, make a lib directory. We'll create\
