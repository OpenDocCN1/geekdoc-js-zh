  - "[PAGE 92]\n\n# Throttling Node.js • 77\n\nBut you can't always count on your\
    \ dependency modules to be graceful with file handling, so we'll use another approach:\
    \ work queuing. Rather than immediately sending each file path into the RDF parser,\
    \ we will queue them as work to be done and let the queue throttle the number\
    \ of concurrently running tasks.\n\n# Queuing to Limit Work in Progress\n\nFor\
    \ this we'll use the async module.<sup>10</sup> Go ahead and install it now.\n\
    \n```\n$ npm install --save async\n```\n\nAsync offers low-overhead mechanisms\
    \ for managing asynchronous code. For example, it has methods for executing a\
    \ sequence of asynchronous tasks sequentially or in parallel, with a callback\
    \ to invoke when they're all done.\n\nWe need the ability to run a whole bunch\
    \ of tasks, but limit the number that are running at any time. For this we need\
    \ async.queue().\n\nOpen your editor and enter this:\n\n```\ndatabases/list-books-queued.js\n\
    'use strict';\nconst\nasync = require('async'),\nfile = require('file'),\nrdfParser\
    \ = require('./lib/rdf-parser.js'),\nwork = async.queue(function(path, done) {\n\
    \  rdfParser(path, function(err, doc) {\n    console.log(doc);\n    done();\n\
    \  });\n}, 1000);\n\nconsole.log('beginning directory walk');\nfile.walk(__dirname\
    \ + '/cache', function(err, dirPath, dirs, files) {\n  files.forEach(function(path)\
    \ {\n    work.push(path);\n  });\n});\n```\n\nSave this file as list-books-queued.js.\
    \ Notice that we create a work object by passing async.queue() a worker function\
    \ and a concurrency limit of 1,000. This object has a push() method that we use\
    \ to add more paths for processing.\n\n> 10. https://npmjs.org/package/async"
