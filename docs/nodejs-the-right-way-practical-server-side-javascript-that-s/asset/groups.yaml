    \ REQ/REP 对通过顺序操作使得请求/响应逻辑易于编码。给定的请求端或响应端一次只会感知一条消息。ZeroMQ 包含了更高级的套接字类型 ROUTER\
    \ 和 DEALER。让我们探索这些；然后我们就可以准备好构建我们的 Node.js 集群了。\n\n# 路由消息\n\n你可以将 ROUTER 套接字认为是一个并行的\
    \ REP 套接字。ROUTER 套接字不是一次只回复一个消息，而是可以同时处理许多请求。它记得每个请求来自哪个连接，并据此路由消息。\n\n回想《实现消息协议》第\
    \ 28 页，每当你进行网络编程时，你都在与一个或多个协议打交道。ZeroMQ 使用 ZeroMQ 消息传输协议交换消息。该协议使用一系列低开销的*帧*（frames）来组成消息。ROUTER\
    \ 套接字使用这些帧将响应消息路由回到发布请求的连接。\n\n大多数时候，你的 Node 程序可以忽略 ZeroMQ 帧的底层细节，因为较简单的套接字类型每个消息只需要帧。但\
    \ ROUTER 套接字类型使用了多个帧。\n\n这是一个如何在 Node 中创建 ROUTER 套接字的示例，带有一个处理所有入站消息的处理器。\n\n\
    ```javascript\nconst zmq = require('zmq');\nrouter = zmq.socket('router');\nrouter.on('message',\
    \ function() {\n  let frames = Array.prototype.slice.call(null, arguments);\n\
    // ...\n});\n```\n\n之前，我们的消息处理器会接收一个数据参数，但注意这个处理函数没有接收任何参数。`zmq` 模块实际上将消息的所有帧作为处理函数的参数传递给处理函数。它可以这样做是因为\
    \ JavaScript 函数是变长的的——它们在被调用时可以接收任意数量的参数。\n\n函数内部的 `arguments` 对象是一个类数组对象，包含了所有传入的参数。使用\
    \ `Array.prototype.call(null, arguments)` 返回一个具有相同内容的真实 JavaScript Array 实例。\n\
    \n现在我们可以获取所有的帧了，让我们 DEALER 套接字类型。\n\n# 处理消息\n\n如果说 ROUTER 套接字是并行的 REP 套接字，那么 DEALER\
    \ 就是并行的 REQ。DEALER 套接字可以并行发送多个请求。\n\n让我们看看 dealer 和 router 在 Node 中是如何协同工作的。看看这段代码示例：\n\
    \n```javascript\nconst zmq = require('zmq'),\nrouter = zmq.socket('router'),\n\
    dealer = zmq.socket('dealer');\n\nrouter.on('message', function() {\n  let frames\
    \ = Array.prototype.slice.call(null, arguments);\n  dealer.send(frames);\n});\n\
    dealer.on('message', function() {\n  let frames = Array.prototype.slice.call(null,\
    \ arguments);\n  router.send(frames);\n});\n```\n\n在这里我们同时创建了 ROUTER 套接字和 DEALER\
    \ 套接字。无论哪一个接收到消息，它都会提取帧并发送到另一个套接字。\n\n这意味着进入 router 的入站请求将传递给 dealer 发送到它的连接中。同样，进入\
    \ dealer 的入站响应将转发回 router，router 将每个响应引导回请求它的连接。\n\n代码示例没有包含任何对 `bind()` 或 `connect()`\
    \ 的调用，所以它还不是一个功能性示例。尽管如此，你可以在第 54 页的图7看到我们追求的基本结构：一个同时使用 ROUTER 和 DEALER ZMQ 套接字的\
    \ Node.js 程序。\n\n图中中间的方框是 Node 程序。一个入站 REQ 套接字连接到 ROUTER。当它发出请求消息时，ROUTER 将其传递给\
    \ DEALER。DEALER 选择连接到它的 REP 套接字之一转发请求。\n\n![](img/4fd6c7ecbcaceceafb5f645d145c46f5_69_0.png)\n\
    \n图7—一个使用 ROUTER 和 DEALER ZeroMQ 套接字的 Node.js 程序\n\n当 REP 连接产生响应时，它遵循相反的路由。DEALER\
    \ 接收响应并将其抛回 ROUTER。ROUTER 查看消息的帧以确定其来源，并将响应发回发送它的 REQ。从 REQ 的角度来看，什么都没有改变。现在是时候使用这些新类型了。\n\
    \n# Clustering.js 进程\n\n在多线程系统中，并行执行更多工作是常见的。但 Node.js 使用单线程事件循环，因此为了利用多个核心或处理器，你需要启动更多的进程。这被称为集群，是\
    \ Node 内置 cluster 模块的功能。\n\n为了探索 cluster 模块的工作方式我们将构建一个管理工作池的程序。\n\n# 在集群中派生工作进程\n\
    \n回想《生成子进程》第 13 页，我们使用 `child_process` 模块的 `spawn()` 函数来启动进程。这对于从 Node 程序执行非 Node\
    \ 非常有效，但对于启动相同 Node 程序的副本，派生（fork）是更好的选择。\n\n每次当你调用 cluster 模块的 `fork()` 方法，它都会创建一个运行相同脚本进程。为了理解我的意思，请看下面的代码片段。它展示了集群应用程序的基本框架。\n\
    \n```javascript\nconst cluster = require('cluster');\n\nif (cluster.isMaster)\
    \ {\n  // 派生一些工作进程\n  for (let i = 0; i < 10; i++) {\n    cluster.fork();\n  }\n\
    } else {\n  // 这是一个工作进程，执行工作\n}\n```\n\n首先，我们检查当前进程是否为主进程。如果是，我们使用 `cluster.fork()`\
    \ 创建额外的进程。fork 方法启动运行相同脚本的新 Node 进程，但该进程的 `cluster.isMaster` 为 false。\n\n派生的进程被称为工作进程。它们通过各种事件与主进程进行通信。\n\
    \n例如，主进程可以通过如下代码监听工作者的上线：\n\n```javascript\ncluster.on('online', function(worker)\
    \ {\n  console.log('Worker ' + worker.process.pid + ' is online.');\n});\n```\n\
