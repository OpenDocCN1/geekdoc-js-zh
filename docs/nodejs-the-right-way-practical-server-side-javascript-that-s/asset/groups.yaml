    # CHAPTER 3


    # # Networking with Sockets


    Node.js is built from the ground up to do networked programming. In this chapter,
    we''ll explore Node''s built-in support for low-level socket connections. TCP
    sockets form the backbone of modern networked applications, and understanding
    them will serve you well as we do more complex networking through the rest of
    the book.


    As you develop socket-based servers and clients, you''ll learn about the following
    Node.js aspects.


    # ### Architecture and Core


    The asynchronous programming techniques we explored in the last chapter will be
    even more important here. You''ll learn how to extend Node.js classes like EventEmitter.
    You''ll create custom modules to house reusable code.


    # ### Patterns


    A network connection has two endpoints. A common pattern is for one endpoint to
    act as the server while the other is the client. We''ll develop both kinds of
    endpoints in this chapter, as well as a JavaScript Object Notation (JSON)-based
    protocol for client/server communication.


    # ### JavaScript


    The JavaScript language has an interesting inheritance model. You''ll learn about
    Node''s utilities for creating class-like relationships between objects.


    # ### Supporting Code


    Testing is important to ensure that our programs behave the way we expect them
    to. In this chapter, we''ll develop a test server that behaves badly on purpose
    to probe edge cases of our protocol.'
