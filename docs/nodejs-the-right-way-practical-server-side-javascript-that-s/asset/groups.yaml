    \  });\n\n  // 分叉三个 worker 进程\n  for (let i = 0; i < 3; i++) {\n    cluster.fork();\n\
    \  }\n} else {\n  // worker 进程 - 创建 REP 套字，连接到 DEALER\n  let responder\n    responder\
    \ = zmq.socket('rep').connect('ipc://filer-dealer.ipc');\n\n  responder.on('message',\
    \ function(data) {\n\n    // 解析传入消息\n    let request = JSON.parse(data);\n   \
    \ console.log(process.pid + ' received request for: ' + request.path);\n  });\n\
    \n```\n\n```javascript\n// 读取文件并回复内容\nfs.readFile(request.path, function(err,\
