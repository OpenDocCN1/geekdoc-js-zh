  - '[PAGE 44]


    Implementing a Messaging Protocol


    with one or more protocols. Here we''ll create a protocol based on passing JSON
    encoded messages over TCP.¹


    JSON is incredibly prevalent in Node.js programming and in JavaScript programming
    generally. We''ll use it extensively for data serialization and configuration
    throughout the book. JSON is significantly easier to program clients than plain
    text, and it''s still human-readable.


    We''ll implement client and server endpoints using our new JSON-based protocol.
    This will give us opportunities to develop test cases and refactor code into reusable
    modules.


    # Serializing Messages with JSON


    Let''s develop the message-passing protocol that uses JSON to serialize messages.
    Each message is a JSON-serialized object, which is a hash of key-value pairs.
    Here''s an example JSON object with two key-value pairs:


    ```

    {"key": "value", "anotherKey":"anotherValue"}

    ```


    The net-watcher service we''re developing in this chapter sends two kinds of messages
    that we need to convert to JSON:


    +   * When the connection is first established, the client receives the string
    Now watching target.txt for changes...

    * Whenever the target file changes, the client receives a string like this: File
    ''target.txt'' changed: Sat Jan 12 2013 12:35:52 GMT-0500 (EST)


    We''ll encode the first kind of message this way:


    ```

    {"type": "watching", "file":"target.txt"}

    ```


    The type field indicates that this is a watching message—the specified file is
    now watched.


    The second kind of message is encoded this way:


    ```

    {"type": "changed", "file":"target.txt", "timestamp":13581757333785}

    ```


    Here the type field announces that the target file has changed. The timestamp
    field contains an integer value representing the number of milliseconds since
    midnight, January 1, 1970. This happens to be an easy time format to work with
    in JavaScript. For example, you can get the current time in this format with Date.now().


    +   1. http://json.org/'
  - "[PAGE 45]\n\nNotice that there are no line breaks in our JSON messages. Although\
    \ JSON is whitespace agnostic—it ignores whitespace outside of string values—our\
    \ protocol will use newlines to separate messages. We'll call this protocol Line-Delited\
    \ JSON (LDJ).\n\n# Switching to JSON Messages\n\nNow that we've defined an improved,\
    \ computer-accessible protocol, let's modify the net-watcher service to use it.\
    \ We'll create client programs that receive and interpret these messages.\n\n\
    Our task is to use JSON.stringify() to encode message objects and send them out\
    \ through connection.write(). Open your editor to the net-watcher.js program.\
    \ Find the following line:\n\n```\nconnection.write(\"Now watching '\" + filename\
    \ + ' for changes...\\n\");\n```\n\nAnd replace it with:\n\n```\nconnection.write(JSON.stringify({\n\
    \  type: 'watching',\n  file: filename\n}) + '\\n');\n```\n\nNext, find the call\
    \ to connection.write() inside the watcher:\n\n```\nconnection.write(\"File '\"\
    \ + filename + ' ' changed: \" + Date.now() + \"\\n\");\n```\n\nAnd replace it\
    \ with:\n\n```\nconnection.write(JSON.stringify({\n  type: 'changed',\n  file:\
    \ filename,\n  timestamp: Date.now()\n}) + '\\n');\n```\n\nSave this updated file\
    \ as net-watcher-json-service.js. Run the new program with node --harmony always,\
    \ remembering to specify a target file. Then connect using telnet localhost from\
    \ a second terminal:\n\n```\n$ telnet localhost 127.0.0.1\nTrying 127.0.0.1\n\
    Connected to localhost.\nEscape character is '^'\n{\"type\":\"watching\",\"file\"\
    :\"target.txt\"}\n```\n\nWhen you touch the target.txt file, you'll see output\
    \ like this from your client:\n\n```\n{\"type\":\"changed\",\"file\":\"target.txt\"\
    ,\"timestamp\":13670387203255}\",\n```\n\nNow we're ready to write a client program\
    \ that processes these messages."
- md: "\n## Creating Socket Client Connections\n\nSo far in this chapter, we've explored\
    \ the server side of Node sockets. Here we'll write a client program in Node to\
    \ receive JSON messages from our net-watcher-json-service program. We'll start\
    \ with a naive implementation, and then improve it through the rest of the chapter.\n\
    \nOpen an editor and insert this:\n\n```javascript/net-watcher-json-client.js\n\
    \"use strict\";\nconst net = require('net');\nconst client = net.connect({port:\
    \ 5432});\nclient.on('data', function(data) {\n  let message = JSON.parse(data);\n\
    \  if (message.type === 'watching') {\n    console.log(\"Now watching: \" + message.file);\n\
    \  } else if (message.type === 'changed') {\n    let date = new Date(message.timestamp);\n\
    \    console.log(\"File '\" + message.file + \" changed at '\" + date);\n  } else\
    \ {\n    throw Error(\"Unrecognized message type: \" + message.type);\n  }\n});\n\
    ```\n\nSave this program as net-watcher-json-client.js.\n\nThis short program\
    \ uses net.connect() to create a client connection to localhost port 5432, then\
    \ waits for data. The client object is a Socket, just like the incoming connection\
    \ we saw on the server side.\n\nWhenever a data event happens, our callback function\
    \ takes the incoming buffer object, parses the JSON message, and then logs an\
    \ appropriate message to the console.\n\nTo run the program, make sure the net-watcher-json-service\
    \ is running. In another terminal, run the client:\n\n```bash\n$ node --harmony\
    \ net-watcher-json-client.js\nNow watching: target.txt\n```\n\nIf you touch the\
    \ target file, you'll see output like this:\n\nFile 'target.txt' changed at Mon\
    \ Jan 14 2013 19:35:14 GMT-0500 (EST)\n\nSuccess! This program works, but it's\
    \ far from perfect. Consider what happens when the connection ends or if it fails\
    \ to connect in the first place. This program-only listens for data events, not\
    \ end events or error events. We could listen for these events and take appropriate\
    \ action when they happen.\n\nBut there's actually a deeper problem lurking in\
    \ our code—caused by assumptions we've made about message boundaries. In the next\
    \ section we'll develop a test that exposes this bug so we can fix it.\n\n## Testing\
    \ Network Application Functionality\n\nFunctional tests assure that our code does\
    \ what we expect it to do. In this section, we'll develop a test for our networked\
    \ file-watching server and client programs. We'll create a mock server that conforms\
    \ to the LDJ protocol while exposing flaws in the client.\n\nAfter we write the\
    \ test, we'll fix the client code so that it passes. This will bring many Node\
    \ concepts, include extending core classes, creating and using custom modules,\
    \ and developing on top of EventEmittermitters. But first we need to understand\
    \ a problem lurking in our client/server programs as currently written.\n\n##\
    \ Understanding the Message-Boundary Problem\n\nWhen you develop networked programs\
    \ in Node, you'll often communicate by passing messages. In the best case, a message\
    \ will arrive all at once. But sometimes messages arrive in pieces, split into\
    \ distinct data events. To develop networked applications, you'll need to deal\
    \ with these splits when they happen.\n\nThe LDJ protocol we developed earlier\
    \ separates messages with newline characters. Each newline character is the boundary\
    \ between two messages. Here's an example of a series of messages, with newline\
    \ characters specifically called out:\n\n```\n{\"type\":\"watching\", \"file\"\
    :\"target.txt\"}\\n{\"type\":\"changed\", \"file\":\"target.txt\", \"timestamp\"\
    :1358175758495}\\n{\"type\":\"changed\", \"file\":\"target.txt\", \"timestamp\"\
    :1358175779621}\n```\n\nRecall the service we're developing so far in this chapter.\
    \ Whenever a change happens, it encodes and sends a message to the connection,\
    \ including the trailing newline. Each line of output corresponds to a single\
    \ data event in the connected client. Or, to put it another way, the data event\
    \ boundaries exactly match up with the message boundaries.\n\nOur client currently\
    \ relies on this behavior. It parses each message by sending the contents of the\
    \ data buffer directly into JSON.parse();\n\n```javascript\nclient.on('data',\
    \ function(data) {\n  let message = JSON.parse(data);\n  //...\n});\n```\n\n##\
    \ Testing Network Application Functionality\n\nBut consider what would happen\
    \ if a message were split down the middle, and arrived as two separate data events.\
    \ Such a split could easily happen in the wild, especially for large messages.\
    \ The following figure shows an example of a split message.\n\n![](img/4fd6c7ecbcaceceafb5f645d145c46f5_48_0.png)\n\
    \nLet's create a test service that sends a split message like this one and find\
    \ out how the client responds.\n\n## Implementing a Test Service\n\nWriting robust\
    \ Node applications means gracefully handling network problems like split inputs,\
    \ broken connections, and bad data. Here we'll implement a service that purposefully\
    \ splits a message into multiple chunks.\n\nOpen your editor and enter this:\n\
    \n```javascript/networking/net-watcher-json-test-service.js\n\"use strict\";\n\
    const net = require('net');\n\nserver = net.createServer(function(connection)\
    \ {\n  console.log('Subscriber connected');\n\n  // send the first chunk immediately\n\
    \  connection.write(\n    '{\"type\":\"changed\",\"file\":\"targ'\n  );\n  //\
    \ after a second delay, send the other chunk\n  let timer = setTimeout(function(){\n\
    \    connection.write('et.txt\",\"timestamp\":1358175758495}' + \"\\n\");\n  \
    \  connection.end();\n  }, 1000);\n\n  // clear timer when the connection ends\n\
    \  connection.on('end', function() {\n    clearTimeout(timer);\n    console.log('Subscribers\
    \ disconnected');\n  });\n});\n```\n\n```javascript\nserver.listen(5432, function()\
    \ {\n  console.log('Test server listening for subscribers...');\n});\n```\n\n\
    Save this file as net-watcher-json-test-service.js and run it:\n\n- $ node --harmony\
    \ net-watcher-json-test-service.js\nTest server listening for subscribers...\n\
    \nThis test service differs from our previous net-watcher-json-service in a few\
    \ ways. Rather than setting up a file-system watcher, as for the real service,\
    \ here we just return the first predetermined chunk immediately.\n\nThen we set\
    \ up a timer to send the second chunk after a one-second delay. The JavaScript\
    \ function setTimeout takes two parameters: a function to invoke and an amount\
    \ of time in milliseconds. After the specified amount of time, the function will\
    \ execute.\n\nFinally, whenever the connection ends, we use clearTimeout to unschedule\
    \ the callback. At last, let's find out what happens when we connect with the\
    \ client:\n\n- $ node --harmony net-watcher-json-client.js\n\n```\nundefined:1\n\
    {\"type\":\"changed\",\"file\":targ\nSyntaxError: Unexpected end of input\nat\
    \ Object.parse (native)\nat Socket.<anonymous> (./net-watcher-json-client.js:10:20)\n\
    at EventEmitter.emit (events.js:96)\n```\n\nThe Unexpected end of input tells\
    \ us that the message was not complete and valid JSON. At this point, we've successfully\
    \ simulated the case of a split message. Now let's fix the client to work with\
    \ it.\n\n## Extending Core Classes in Custom Modules\n\nThe Node program we made\
    \ in the last section exposed a flaw in our code; namely, it doesn't buffer its\
    \ inputs. Any message that arrives as multiple data events will crash it.\n\n\
    So really the client program has two jobs to do. One is to buffer incoming data\
    \ into messages. The other is to handle each message when it arrives.\n\nRather\
    \ than cramming both of these jobs into one Node program, the right thing to do\
    \ is to turn at least one of them into a module. We will create a module that\
    \ handles the input-buffering piece so that the main program can reliably get\
    \ full messages. Along the way, we'll need to talk about custom modules and extending\
    \ core classes in Node.\n\n## Extending EventEmitter\n\nTo relieve the client\
    \ program from the danger of split JSON messages, we'll implement an LDJ buffering\
    \ client module. Then we'll incorporate it into the network-watcher client.\n\n\
    ## Inheritance in Node\n\nFirst let's have a look at how Node does inheritance.\
    \ The following code sets out LDJClient to inherit from EventEmitter.\n\n```javascript/networking/ldj.js\n\
    const events = require('events'),\nutil = require('util');\n// client constructor\n\
    LDJClient = function(stream) {\n  events.EventEmitter.call(this);\n}\nutil.inherits(LDJClient,\
    \ events.EventEmitter);\n```\n\nLDJClient is a constructor function, which means\
    \ other code should call new LDJClient(stream) to get an instance. The stream\
    \ parameter is an object that emits data events, such as a Socket connection.\n\
    \nInside the constructor function, we call the EventEmitter constructor on *this*.\
    \ That line of code is roughly equivalent to calling *super()* in languages with\
    \ classical inheritance.\n\nFinally, we use `util.inherits` to make LDJClient's\
    \ prototype parent object the EventEmitter prototype. If this sounds cryptic to\
    \ you, don't worry. It's like saying \"class LDJClient inherits from EventEmitter\"\
    \ in languages with a classical inheritance.\n"
  mdcn: "\n\n## 创建 Socket 客户端连接\n\n在本章目前为止，我们已经探索了 Node socket 的服务端。在这里，我们将编写一个 Node\
    \ 客户端程序，用于接收来自我们的 `net-watcher-json-service` 程序的 JSON 消息。我们将从一个简单的实现开始，并在本章后续章节中对其进行改进。\n\
    \n打开编辑器并插入以下内容：\n\n```javascript/net-watcher-json-client.js\n\"use strict\";\n\
    const net = require('net');\nconst client = net.connect({port: 5432});\nclient.on('data',\
    \ function(data) {\n  let message = JSON.parse(data);\n  if (message.type ===\
    \ 'watching') {\n    console.log(\"Now watching: \" + message.file);\n  } else\
    \ if (message.type === 'changed') {\n    let date = new Date(message.timestamp);\n\
    \    console.log(\"File '\" + message.file + \" changed at '\" + date);\n  } else\
    \ {\n    throw Error(\"Unrecognized message type: \" + message.type);\n  }\n});\n\
    ```\n\n将此程序保存为 `net-watcher-json-client.js`。\n\n此短程序使用 `net.connect()` 创建到 localhost\
    \ 端口 5432 的客户端连接，然后等待数据。`client` 对象是一个 `Socket`，就像我们在服务端看到的入站连接一样。\n\n每当发生 `data`\
    \ 事件时，我们的回调函数就会获取接收到的 buffer 对象，解析 JSON 消息，然后向控制台打印适当的消息。\n\n要运行该程序，请确保 `net-watcher-json-service`\
    \ 正在运行。在另一个终端中，运行客户端：\n\n```bash\n$ node --harmony net-watcher-json-client.js\n\
    Now watching: target.txt\n```\n\n如果你触碰目标文件，你将看到如下的输出：\n\nFile 'target.txt' changed\
    \ at Mon Jan 14 2013 19:35:14 GMT-0500 (EST)\n\n成功！这个程序可以工作，但它远非完美。考虑一下连接结束或最初连接失败时会发生什么。这个程序只监听\
    \ `data` 事件，而不监听 `end` 事件或 `error` 事件。我们可以监听这些事件，并在它们发生时采取适当行动。\n\n但我们的代码中实际上潜着一个更深的问题——这是由我们对消息边界的假设引起的。在下一节中，我们将开发一个测试来暴露这个\
    \ bug，以便我们修复它。\n\n## 测试网络应用程序功能\n\n功能测试确保我们的代码按照我们预期的方式运行。在本节中，我们将为我们的网络文件监视服务器和客户端程序开发一个测试。我们将创建一个符合\
    \ LDJ 协议的模拟服务器，同时暴露客户端的缺陷。\n\n在编写测试之后，我们将修复客户端代码使其通过测试。这将引入许多 Node 概念，包括扩展核心类、创建和使用自定义模块，以及在\
    \ `EventEmitter` 之上进行开发。但在之前，我们需要理解当前编写的客户端/服务端程序中潜伏的一个问题。\n\n## 理解消息边界问题\n\n\
    当你在 Node 中开发网络程序时，你通常会通过传递消息进行通信。在最理想的情况下，消息会一次性到达。但有时消息会分片到达，被拆分成多个不同的 `data`\
    \ 事件。要开发网络应用程序，你需要在这些拆分发生时处理这些拆分。\n\n我们之前开发的 LDJ 协议使用换行符分隔消息。每个换行符都是两条消息之间的边界。这里是一系列消息的示例，特别标出了换行符：\n\
    \n```\n{\"type\":\"watching\", \"file\":\"target.txt\"}\\n{\"type\":\"changed\"\
    , \"file\":\"target.txt\", \"timestamp\":1358175758495}\\n{\"type\":\"changed\"\
    , \"file\":\"target.txt\", \"timestamp\":1358175779621}\n```\n\n回想我们在本章目前开发的服务。每当发生变化时，它都会编码并向连接发送消息，包括尾的换行符。输出的每一行对应连接客户端中的单个\
    \ `data` 事件。或者换句话说，`data` 事件边界与消息边界完全匹配。\n\n我们的客户端目前依赖这种行为。它通过将数据 buffer 的内容直接发送\
    \ `JSON.parse()` 来解析每条消息：\n\n```javascript\nclient.on('data', function(data) {\n\
    \  let message = JSON.parse(data);\n  //...\n});\n```\n\n## 测试网络应用程序功能\n\n但考虑一下如果消息从中间拆分并作为两个独立的\
    \ `data` 事件到达，会发生什么。这种拆分在现实中很容易发生，特别是对于大消息。下图显示了拆分消息的示例。\n\n![](img/4fd6c7ecbcaceceafb5f645d145c46f5_48_0.png)\n\
    \n让我们创建一个发送此类拆分消息的测试服务，并看看客户端如何响应。\n\n## 实现测试服务\n\n编写健壮的 Node 应用意味着优雅地处理网络问题，如拆分输入、连接中断和坏数据。在这里，我们将实现一个故意将消息拆分成多个块的服务。\n\
    \n打开编辑器并输入以下内容：\n\n```javascript/networking/net-watcher-json-test-service.js\n\
    \"use strict\";\nconst net = require('net');\n\nserver = net.createServer(function(connection)\
    \ {\n  console.log('Subscriber connected');\n\n  // 立即发送第一个块\n  connection.write(\n\
    \    '{\"type\":\"changed\",\"file\":\"targ'\n  );\n  // 延迟一秒后发送另一个块\n  let timer\
    \ = setTimeout(function(){\n    connection.write('et.txt\",\"timestamp\":1358175758495}\\\
    n\");\n  }, 1000);\n\n  // 当连接结束时清除定时器\n  connection.on('end', function() {\n\
    \    clearTimeout(timer);\n    console.log('Subscriber disconnected');\n  });\n\
    });\n\nserver.listen(5432);\n```\n\n将此文件保存为 `net-watcher-json-test-service.js`\
    \ 并运行：\n\n```bash\n$ node --harmony net-watcher-json-test-service.js\nTest server\
    \ listening...\n```\n\n这个测试服务与我们之前的 `net-watcher-json-service` 有几点不同。在这里，我们只是返回了第一个块。然后我们设置了一个定时器，在一秒钟后发送第二个块。最后，当连接结束时，我们使用\
    \ `clearTimeout`。让我们看看连接客户端会发生什么：\n\n- $ node --harmony net-watcher-json-client.js\n\
    \n```\nundefined:1\n{\"type\":\"changed\",\"file\":targ\nSyntaxError: Unexpected\
    \ end of input\nat Object.parse (native)\nat Socket.<anonymous> (./net-watcher-json-client.js:10:20)\n\
    at EventEmitter.emit (events.js:96)\n```\n\n`Unexpected end of input` 告诉我们消息是不完整且有效的\
    \ JSON。在此处，我们成功模拟了消息拆分的情况。现在让我们修复客户端使其工作。\n\n## 在自定义模块中扩展核心类\n\n我们在上一节中制作 Node\
    \ 程序暴露了代码中的一个缺陷；它没有对输入进行缓冲。任何作为多个 `data` 事件到达的消息都会导致它崩溃。\n\n所以客户端程序有两个任务。一个是将输入数据缓冲为消息。另一个是在消息到达时处理它。\n\
    \n与其将这两个任务都挤在一个 Node 程序中，正确的方法是将其中至少一个转换为模块。我们将创建一个处理输入缓冲的模块，以便主程序能够可靠地获取完整消息。在此过程中，我们需要讨论自定义模块和\
    \ Node 中核心类的扩展。\n\n## 扩展 EventEmitter\n\n为了让客户端免受拆分 JSON 消息的危险，我们将实现一个 LDJ 缓冲模块。然后我们将其整合到网络监视客户端中。\n\
    \n## Node 中的继承\n\n首先，让我们看看 Node 是如何处理的。以下代码设置 LDJClient 继承自 EventEmitter：\n\n\
    ```javascript/networking/ldj.js\nconst events = require('events'),\nutil = require('util');\n\
