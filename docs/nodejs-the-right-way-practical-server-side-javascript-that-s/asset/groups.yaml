    done(null, { identifier: id });

    });

    ```


    This code sets up passport''s serialization and deserialization functions and

    tells passport to use the Google strategy we pulled in earlier.


    Use the serializeUser() method to specify what information about the user should

    actually be stored in the session. You can still keep other data elsewhere, but

    this is the data that gets associated with the session cookie.


    Typically


    The deserializeUser() method is where you take the session data and turn

    it back into a rich object for your use by your application. This operation must
    be

    light and fast since it will happen on virtually every request to your server.

    With the exception of some user-specific APIs we''ll develop shortly, we don''t

    need anything more than the identifier for our book-bundler app. So here we

    just construct an object containing the identifier we stored previously.


    Next we tell passport to use() the Google strategy we brought in earlier.'
  - "[PAGE 130]\n\nAuthenticating with Passport • 115\n\n```\nweb-app/b4/server.js\n\
    passport.use(new GoogleStrategy({\n  returnURL: 'http://localhost:3000/auth/google/return',\n\
    \  realm: 'http://localhost:3000/',\n  function(identifier, profile, done) {\n\
    \    profile.identifier = identifier;\n    return done(null, profile);\n  }\n\
    }));n\n```\n\nThe callback function is invoked once the authentication succeeds.\
    \ This is your opportunity to grab any additional information tied to this user's\
    \ account from your own database. Just like our deserializeUser() callback, we\
    \ mainly make note of the identifier.\n\nThe returnURL parameter is the full URL\
    \ you want Google to send to users after they've authenticated. Localhost is correct\
    \ for our development application, but you'll need to set this to the real public\
    \ URL of your own services.\n\n# Routing Authentication Requests\n\nFinally, we\
    \ need to set up some routes. We need to handle three kinds of requests in total:\
    \ one for initiating the authentication, one for the returnURL where users come\
    \ back after authenticating, and one for logging out.\n\nHere's a small amount\
    \ of code that provides these three endpoints:\n\n```\nweb-app/b4/server.js\n\
    app.get('/auth/google/return?',\npassport.authenticate('google', { successRedirect:\
    \ '/' })\n);\napp.get('/auth/logout', function(req, res) {\n  req.logout();\n\
    \  res.redirect('/');\n});\n\n```\n\nThe first route here works for both /auth/google\
    \ and /auth/google/return. It uses the passport.authenticate() middleware, which\
    \ will automatically redirect users to Google's sign-in page and process the incoming\
    \ token when they get back.\nin your own applications, you may want to take additional\
    \ actions in either of these cases, but redirecting to the application root (/)\
    \ is sufficient for our app.\n\nLastly, the /auth/logout route provides a way\
    \ for users to clear their session cookies and the associated session data."
  - '[PAGE 131]


    Chapter 7. Web Apps • 116


    That''s all there is to it! It might seem like this is a lot of steps to get authentication
    to work. But it really is providing a lot of value--once you get passport set
    up, the job of authenticating users is done for you.


    # Authorizing APIs with Custom Middleware


    With passport''s Google strategy set up and Redis configured to store session
    information, we''re in position to develop some protected user APIs. Unlike the
    book and bundle APIs we developed in the last chapter, these APIs will provide
    access to information specifically for logged-in users.


    Here are the endpoints we will create, and the HTTP verbs they''ll support. They
    all return JavaScript Object Notation (JSON):


    +   * /api/user (GET)—Basic information about the user (like the user''s identifier)

    * /api/user/bundles (GET)—Object that maps bundle IDs to bundle names

    * /api/user/bundles (PUT)—Overwrites the bundle mapping object with the provided
    JSON body


    Implementing these APIs will give us a chance to develop some custom Express middleware.
    We''ll also have to modify our redisClient to be more tolerant of failures so
    we can report them through the API.


    # Tolerating Redis Errors


    Redis is a fairly robust service, but like all things it can go down from time
    to time. For this reason, the connect-redis session plug-in is tolerant of Redis
    errors. Whenever Redis is unreachable, the plug-in will silently ignore it—in
    effect rendering your application sessionless, but otherwise unaffected.


    We can do better. REST demands that we use the best HTTP status codes available
    to depict the state of the resource and the system serving it. To do that, we''ll
    need to know more about what''s going on with Redis.


    Let''s start by adding some logging with the npmlog module—the same that npm uses
    for its colorful log messages. Use npm install to get it, then add this to your
    code declarations:


    ```

    log = require(''npmlog'');

    ```


    Let''s add some logging for key events to our redisClient:


    ```

    web-app/b4/server.js

    redisClient

    .on(''ready'', function() { log.info(''REDIS'', ''ready''); });

    on(''error'', function(err) { log.error(''REDIS'', err.message); });

    ```'
- md: "\nAuthorizing APIs with Custom Middleware • 117\n\nWe're adding handlers for\
    \ the ready event, which fires whenever Redis is connected and awaiting commands,\
    \ and the error event prevents Node from throwing an exception (recall that unhandled\
    \ error events on EventEmitters throw). To see how this works, start up your b4\
    \ server then kill the redis-server process in another terminal. You'll see output\
    \ like this:\n\n```\n$ npm start\n```\n\n```\n> b4@0.1.0 start ./b4\n> node --harmony\
    \ /server.js\n```\n\n```\nready captain.\ninfo REDIS ready\nERR! REDIS Redis connection\
    \ to 127.0.0.1:6379 failed - connect ECONNREFUSED\nERR! REDIS Redis connection\
    \ to 127.0.0.1:6379 failed - connect ECONNREFUSED\n```\n\nThe redisClient object\
    \ includes a Boolean property ready, which we can check in our middleware. Let's\
    \ do that next.\n\n## Implementing Custom Middleware\n\nYou've already learned\
    \ how to implement route handlers in Express; now let's see how to create custom\
    \ middleware. The difference between middleware and route handlers is that middleware\
    \ is meant to be a link in the chain, while route handlers are meant to be at\
    \ the very end of the chain. A middleware function takes three parameters: a request\
    \ object (req), a response object (res), and a function (next) to call when the\
    \ middleware is done.\n\nLet's create a middleware function that enforces our\
    \ passport session. If everything goes according to plan it'll call the next function,\
    \ and if anything goes wrong it'll give it an appropriate, RESTful response.\n\
    \n```javascript\nweb-app/server.js\nconst authed = function(req, res, next) {\n\
    \  if (req.isAuthenticated()) {\n    return next();\n  } else if (redisClient.ready)\
    \ {\n    res.json(403, {\n      error: \"forbidden\",\n      reason: \"not_authenticated\"\
    \n    });\n  } else {\n    res.json(503, {\n      error: \"service_unavailable\"\
    ,\n      reason: \"authentication_unavailable\"\n    });\n  }\n}\n```\n\nFirst,\
    \ we check req.isAuthenticated(). This is a method added by passport that returns\
    \ true only if the incoming session cookie matches a known session. If the user\
    \ is authenticated, we immediately call next() to move down the middleware chain.\n\
    \nOtherwise, find out if redisClient.ready is true. If it is, then the user isn't\
    \ authenticated (not a system error) and the correct code is 403 Forbidden. We\
    \ can't use 401 Unauthorized because that requires a WWW-Authenticate header,\
    \ which tells the browser that authentication mechanisms are available (and there's\
    \ no provision for cookie-based sessions).\n\nLastly, if redisClient.ready is\
    \ false, then there's no user who could have authenticated. The appropriate response\
    \ is 503 Service Unavailable, since any authenticated APIs can't meaningfully\
    \ operate until Redis comes back.\n\nAlright, now that we have custom middleware,\
    \ let's apply it to some authenticated APIs.\n\n## Creating Authenticated APIs\n\
    \nWe need to create new, user-specific APIs, and we want them to use our authed()\
    \ middleware. But we certainly don't want all the other routes (like our static\
    \ file serving) to be authenticated. Those still need to be served without any\
    \ authentication. So we can't just call use() like we would with other middleware.\n\
    \nWhen you specify a route in Express, you can include middleware that you wish\
    \ to apply only to that route. We'll use this feature for the /api/user route:\n\
    \n```javascript\nweb-app/b4/server.js\napp.get('/api/user', authed, function(req,\
    \ res) {\n  res.json(req.user);\n});\n```\n\nThis short route handler is all we\
    \ need, thanks to the authed() function we already made. By the time the route\
    \ handler is invoked, the middleware has already confirmed that the session is\
    \ valid and the user property on the request will have the right data.\n\nOnce\
    \ logged in, requests to /api/user will return something like this:\n\n```json\n\
    {\n  \"identifier\": \"https://www.google.com/accounts/o8/id=...\"\n}\n```\n\n\
    This is the object that comes out of the deserializeUser() callback we defined\
    \ earlier. Next, let's see how to implement the /api/user/bundles endpoint:\n\n\
    ```javascript\nweb-b4/server.js\napp.get('/api/user/bundles', authed, function(req,\
    \ res) {\n  let userURL = config.b4db + encodeURIComponent(req.user.identifier);\n\
    \  request(userURL, function(err, couchRes, body) {\n    if (err) {\n      res.json(502,\
    \ { error: \"bad_gateway\", reason: err.code });\n    } else if (couchRes.statusCode\
    \ === 200) {\n      res.json(JSON.parse(body).bundles || {});\n    } else {\n\
    \      res.send(couchRes.statusCode, body);\n    }\n  });\n});\n```\n\nWe construct\
    \ a userURL which consists of our CouchDB b database root and the identifier for\
    \ the session. This implies a schema decision; the user documents in the b4 database\
    \ will have same user_id as the Google identifier. In your own applications you\
    \ might want to use an app-specific ID for your users, but keep in mind you'll\
    \ need a mapping or lookup function to find users by their passport ID.\n\nNext\
    \ we call CouchDB using the request() function, as we've done many times before.\
    \ We handle the various error conditions, and if we get back a 200 OK status,\
    \ then we extract the bundles property from the document and send that back to\
    \ the requester.\n\nPutting the bundles hash back into the user document is slightly\
    \ trickier:\n\n```javascript\nweb-b4/server.js\napp.put('/api/user/bundles', authed,\
    \ express.json(), function(req, res) {\n  let userURL = config.b4db + encodeURIComponent(req.user.identifier);\n\
    \  request(userURL, function(err, couchRes, body) {\n    if (err) {\n      res.json(502,\
    \ { error: \"bad_gateway\", reason: err.code });\n    } else if (couchRes.statusCode\
    \ === 200) {\n      let user = JSON.parse(body);\n      user.bundles = req.body;\n\
    \      request.put({ url: userURL, json: user }).pipe(res);\n    } else if (couchRes.statusCode\
    \ === 404) {\n      let user = { bundles: req.body };\n      request.put({ url:\
    \ userURL, json: user }).pipe(res);\n    } else {\n      res.send(couchRes.statusCode,\
    \ body);\n    }\n  });\n});\n```\n\n## Client-Side MVC\n\nThroughout this chapter\
    \ we've kept a clean delineation between the server-side code (RESTful, JSON APIs)\
    \ and the client-side code (static HTML, CSS, and JavaScript). The benefit of\
    \ this separation is that you can completely change your user-facing code without\
    \ modifying your Node server. In fact, you could implement a non-browser front\
    \ end, such as a command-line interface, and your APIs would continue to work\
    \ just fine.\n\nBut at some point you have to create an interface your users can\
    \ interact with, and that we'll do here. Please keep in mind that front-end web\
    \ development is a fast-moving target; the state of the art is advancing every\
    \ day. To build a front end for the b4 APIs, we'll use MVC.\n\nThe MVC software-design\
    \ pattern is a popular and convenient way to structure user-facing applications.\
    \ Unfortunately, it's so popular, people have different ideas about what MVC means\
    \ and how it works. So first we have to agree on a working definition for the\
    \ examples in this book.\n\n- Model—The business logic and data for the application\n\
    - View—Representation of the model that is shown to the user\n- Controller—Code\
    \ that receives user interaction to inform the model\n\nIn our application, the\
    \ model will be responsible for keeping track of the book bundles for the user.\
    \ The view will be the Document Object Model (DOM) in the browser, as rendered\
    \ by the model. And the controller logic will be invoked by events from the DOM.\n"
  mdcn: "\n使用自定义中间件授权 API • 117\n\n我们正在为 `ready` 事件添加处理程序，该事件每当 Redis 连接成功并等待命令时就会触发；而\
    \ `error` 事件则防止 Node 抛出异常（请记住，EventEmitter 上的未处理的错误事件会抛出异常）。要查看它是如何运行的，请启动你的 b4\
    \ 服务器，然后在另一个终端中杀死 `redis-server` 进程。你会看到类似如下的输出：\n\n```\n$ npm start\n```\n\n\
    ```\n> b4@0.1.0 start ./b4\n> node --harmony /server.js\n```\n\n```\nready captain.\n\
    info REDIS ready\nERR! REDIS Redis connection to 127.0.0.1:6379 failed - connect\
