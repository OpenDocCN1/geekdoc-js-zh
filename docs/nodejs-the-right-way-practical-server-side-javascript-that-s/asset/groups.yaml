- md: "\n## Chapter 7. Web Apps • 112\n\nLike a package.json file, it contains a list\
    \ of dependencies. Our app depends on these front-end packages:\n\n- jquery—Extraordinarily\
    \ popular JavaScript library for Ajax and DOM manipulation\n- bootstrap—Pretty\
    \ CSS styles for web applications\n- typeahead.js—JavaScript library for autocompleting\
    \ text fields\n- typeahead.js-bootstrap.css—Bootstrap-compatible CSS for typeahead.js\n\
    - handlebars—HTML templating library\n\nTo install these packages, first install\
    \ Bower through npm (if you haven't already):\n\n```\n$ npm install -g bower\n\
    ```\n\nThen install the Bower components:\n\n```\n$ bower install\n```\n\nNow\
    \ you should have a bower_components/ directory containing all of the above.\n\
    \n## Structuring a Single-Page App\n\nWith the server ready to serve the static\
    \ content, and Bower components in place, we can put together the main entry point\
    \ of our single-page app: the index.html file. Here's the top of that file contains:\n\
    \n```html\nweb-app/b4/static/index.html\n<!doctype html>\n<html>\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>b4b - The Better Book Bundle Builder</title>\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<link\
    \ rel=\"stylesheet\" href=\"bootstrap/dist/bootstrap.min.css\">\n<link rel=\"\
    stylesheet\" href=\"bootstrap/dist/bootstrap-theme.min.css\">\n<link rel=\"stylesheet\"\
    >\n<link rel=\"stylesheet\" href=\"typeahead.js-bootstrap.css/typeahead.js-bootstrap.css\"\
    >\n<link rel=\"stylesheet\" href=\"app.css\">\n</head>\n<body class=\"container\"\
    >\n```\n\nThe first line—<!doctype html>—ells the browser that this is an HTML5\
    \ document. Then we enter the document’s <head> section, which contains the title,\
    \ some <meta> tags, and a bunch of style sheets.\n\nThe viewport <meta> tag tells\
    \ mobile devices that the width of the page match the device width (e.g., 320px\
    \ on an iPhone) instead of the default, which may be much larger. It also tells\
    \ the device to start off at a scale of 1.0, meaning unzoomed.\n\nThe style sheets\
    \ correspond to our dependencies; first the Bootstrap core and theme, and finally\
