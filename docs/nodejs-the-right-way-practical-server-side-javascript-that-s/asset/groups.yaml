  - '[PAGE 84]


    Making RESTful Requests • 69


    The request() function takes two arguments: an options object and a callback.
    The most important options to set are the HTTP method and the URL you plan to
    hit. In our case, we grab both the method and path information from the command-line
    arguments, with sensible defaults.


    Since our script starts with the #! directive, it can be executed directly. To
    make the file executable, go to the terminal and run this:


    ```

    $ chmod +x dbcli.js

    ```


    Now it''s time to try it out. Assuming your CouchDB server is running, you should
    see output like the following:


    ```

    $ ./dbcli.js

    200 { couchdb: ''Welcome'', version: ''1.2.1'' }

    ```


    When you use HTTP GET request to the server''s root (/), CouchDB gives you a welcome
    message.


    # Using the CLI for CouchDB REST


    A database in CouchDB is basically a big collection of documents. Each database
    lives at a URL path one level down from the root. For example, if you had a database
    called books it would live at /books. Let''s see what happens when we try GET
    the as-yet-uncreated books database:


    ```

    $dbcli.js GET books

    404 { error: ''not_found'', reason: ''no_db_file'' }

    ```


    Since there is no books database yet, we get an HTTP 404 Not Found status code.
    To make a database, use the HTTP verb PUT.


    ```

    $dbcli.js PUT books

    201 { ok: true }

    ```


    CouchDB returned a 201 Created status code to tell us that it successfully created
    the database.


    The difference between POST and PUT is subtle but important. If you already have
    the full URL of the RESTful thing you are working on, then use PUT. Otherwise,
    you use POST. So if you''re updating an existing resource, PUT is always correct,
    but to create a new resource use PUT only if you know the full URL to where that
    resource will be.


    In the case of the books database, we know that it will live at /books, so PUT
    is the correct verb to use.


    Now when we GET the books database, CouchDB responds with a 200 OK status code
    and information about the database:'
  - '[PAGE 85]


    # Chapter 5. Accessing Databases • 70


    ```

    $ ./cli.js GET books

    200 { db_name: ''books'',

    doc_count: 0,

    doc_del_count: 0,

    update_seq: 0,

    purge_seq: 0,

    compact_running: false,

    disk_size: 79,

    data_size: 0,

    instance_start_time: ''1376409945081320'',

    disk_format_version: 6,

    committed_update_seq: 0 }

    ```


    If you wanted to remove the books database, you''d use the DELETE HTTP verb. Don''t
    do this now, though; you''ll need the books database for our next task, importing
    lots of data using Node.js.


    # Importing Real Data


    Next we''ll use the request module to import a whole bunch of data into the books
    database. As we do, we''ll run into the limited-resource problem we first saw
    in The Limited-Resource Problem, on page 61. This will give us a backdrop for
    experimenting with asynchronous coding techniques.


    First we need to get some data to work with. We''ll use the catalog data from
    Project Gutenberg, a site dedicated to making public-domain works available as
    free ebooks.³


    # Downloading Project Gutenberg Data


    Project Gutenberg produces catalog download bundles that contain Resource Description
    Framework (RDF) files for each of their 43,000-plus books. (RDF is an XML-based
    format). The bz2 version of the catalog file is about 13 MB. Fully extracted,
    it contains more than 500 MB of RDF files.


    To download and extract the rdf-files.tar.bz2, open a terminal to your databases/project
    directory and run the following commands:


    ```

    $ curl -O http://www.gutenberg.org/cache/epub/feeds/rdf-files.tar.bz2

    $ tar -xvjf rdf-files.tar.bz2

    x cache/epub/pg0.rdf

    x cache/epub/pg1.rdf

    x cache/epub/pg10.rdf

    ...

    x cache/epub/9998/pg9998.rdf

    x cache/epub/9999/pg9999.rdf

    x cache/epub/99999/pg99999.rdf

    ```


