    Chapter 6. Scalable Web Services • 92


    Each of the three API modules is a function that takes two arguments: our config
    hash and the Express app to add to routes.


    Let''s run the server and then we''ll dig into the API modules. This time, instead
    of using npm, we''ll use nodemon. Short for "Node Monitor", nodemon runs a Node.js
    program and then automatically restarts it whenever the source code changes.


    To get nodemon, install it globally through npm:


    ```

    $ npm install -g nodemon

    ```


    Now use nodemon to start up the b4 service.


    ```

    $ nodemon --harmony server.js

    16 Sep 19:05:50 - [nodemon] v0.7.8

