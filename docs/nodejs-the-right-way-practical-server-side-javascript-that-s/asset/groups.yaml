- md: "\nDifferent databases and RESTful services deal with conflicts differently.\
    \ Relying on a rev parameter is a characteristic specific to CouchDB.\n\nWith\
    \ that extra document out of the way, it's time to start querying the data. Different\
    \ databases offer different ways of querying data, but most include some concept\
    \ of indexing. When you index a database available for quick retrieval by some\
    \ field or attribute of the data.\n\nWith CouchDB, you write mapreduce functions,\
    \ which produce views. A view is a kind of index that maps values back to documents.\
    \ A view, you can query for documents with particular attributes or fields—like\
    \ finding a book by its author.\n\nWe'll create two views for Gutenberg data set:\
    \ one for finding books by author, and one for finding books on a given subject.\
    \ Since CouchDB views consist of JavaScript code, we'll keep them in a Node.js\
    \ module and write a small utility program for loading Into CouchDB.\n\n## Querying\
    \ Data with Mapreduce Views\n\n## Cross-Environment Scripting with Node\n\nMost\
    \ of the time when you write JavaScript code, you intend for that code to be executed\
    \ in the same environment in which you wrote it. For example, if you write a method\
    \ in a Node module, you probably expect that some future Node process will run\
    \ that function.\n\nSometimes, though, the JavaScript code you write might be\
    \ destined for a different environment. I call this cross-environment scripting—writing\
    \ JavaScript in one environment but executing it in another. In our case, we'll\
    \ be writing functions in Node that we intend to run in CouchDB.\n\nLet's write\
    \ the view code. Open a text editor and enter this lib/views.js\n\n```javascript\n\
    databases/lib/views.js\nmodule.exports = {\n  by_author: {\n    map: function(doc)\
    \ {\n      if ('authors' in doc) {\n        doc.authors.forEach(emit);\n     \
    \ }\n    }.toString(),\n    reduce: '_count'\n  },\n\n  by_subject: {\n    map:\
    \ function(doc) {\n      if ('subjects' in doc) {\n        doc.subjects.forEach(function(subject)\
    \ {\n          emit(subject, subject);\n        });\n        subject.split(/\\\
    s+|--|\\s+/).forEach(function(part) {\n          emit(part, subject);\n      \
    \  });\n      }\n    }.toString(),\n    reduce: '_count'\n  }\n};\n```\n\nSave\
    \ this file in your project's lib directory as views.js.\n\nThe first view is\
    \ the by_author view—this will let us find books by a particular author. Its map()\
    \ function emits a key for each author of each document that has an authors array\
    \ (that is, each book we've imported). We have to check whether the document has\
    \ an authors key in case the database has any documents that aren't books.\n\n\
    The second view is by_subject. For each subject in the subjects array, we emit\
    \ the whole subject as well as each part (separated by two dashes). For example,\
    \ say a book has the subject \"Assassins – Drama\". The by_subject mapper would\
    \ emit \"Assassins – Drama\", \"Assassins\", and \"Drama\". This lets us find\
    \ books by full or partial subject.\n\nBoth views' map functions have been encoded\
    \ as strings so we can put them into CouchDB, since it allows only JSON documents\
    \ (and true functions are not allowed in JSON). The reduce function for both views\
    \ is CouchDB's builtin_count function. This will let us find out how many books\
    \ are available by a particular author, or in a particular subject.\n\nNow let's\
    \ get these views into the database.\n\n## Callback Chaining with async.waterfall\n\
    \nCouchDB stores views in special documents called design documents. You use regular\
    \ REST commands to add and remove design documents, just like you would use any\
    \ other document. So we need to PUT in CouchDB a design document that contains\
    \ our views.\n\nLet's write a script that creates or updates a design document\
    \ to house these views. Open your editor again and enter this:\n\n```javascript\n\
    databases/make-views.js\n#!/usr/bin/env node --harmony\n'use strict';\n\nconst\
    \ async = require('async'),\nconst request = require('request'),\nconst views\
    \ = require('./views.js');\n\nasync.waterfall(\n  // get the design doc (if present)\n\
    \  function(next) {\n    request.get('http://localhost:5984/books/_design/books',\
    \ next);\n  },\n\n  // create a new design doc or existing\n  function(res, body,\
    \ next) {\n    if (res.statusCode === 200) {\n      next(null, JSON.parse(body));\n\
    \    } else if (res.statusCode === 404) {\n      next(null, { views: {} });\n\
    \    }\n  },\n\n  // add views to document and submit\n  function(doc, next) {\n\
    \    Object.keys(views).forEach(function(name) {\n      doc.views[name] = views[name];\n\
    \    });\n    request({\n      method: 'PUT',\n      url: 'http://localhost:5984/books/_design/books',\n\
    \      json: doc\n    }, next);\n  },\n\n  function(err, res, body) {\n    if\
    \ (err) throw err;\n    console.log(body);\n  }\n);\n```\n\nSave the file as make-views.js\
    \ in your project directory using chmod +x. This program uses the async module's\
    \ waterfall() method to execute a sequence of asynchronous functions. The waterfall\
    \ method cleans up code that would otherwise be highly indented due to nested\
    \ callbacks. waterfall takes two arguments: an array of functions to execute and\
    \ a summary function to call when everything is finished. Each function in the\
    \ array takes some number of arguments and finally a next callback to pass results\
    \ forward.\n\nOur first function kicks off a request for the design document called\
    \ _design/books, using the next function as its callback. If this is your first\
    \ time running this program, then there won't be _design/books document yet and\
    \ the request will return 404 Not Found status code. The second function checks\
    \ whether we get 404 Not Found or 200 OK. For 200 OK, we just want to parse the\
    \ JSON returned in the response body and pass that forward. For 404 Not Found,\
    \ we have to create a skeleton document to pass to the next function. The third\
    \ function copies the views we put in views.js onto the design document. It then\
    \ issues a PUT request to the database to save the newly created or updated document.\
    \ Like our earlier request, we use the next function for the callback. Finally,\
    \ the summary function returns the status code and response body from the last\
    \ request. Let's try it out! Open a terminal and run make-views.js:\n\n```bash\n\
    $ ./make-views.js\n{ ok: true, id: '_design/books', rev: '7e273ae8166d07ea17f0c950fe2a'\
    \ }\n```\n\nOK, design doc is in the database. We should be able to query the\
    \ views. Like all gestures in CouchDB, querying a view is done via REST. For example,\
    \ we can get a list of all authors and the number of books to our name. We can\
    \ do this by getting the _design/books document with the special suffix /by_author\
    \ to tell CouchDB we want the results of the generated view:\n\n```bash\n$ dbcli.js\
    \ GET books/_design/books/_view/by_author?group=true\n[\n  { key: \"Colored Quartet\"\
    , value: 1 },\n  { key: \"Mrs. L. P.\", value: 1 },\n  { key: \"Abdu-Bahah\",\
    \ value: 1 },\n  { key: \"A Gentleman of Elvas.\", value: 1 },\n  { key: \"A-a\"\
    , value: 1 },\n  { key: \"A-No.\", value: 1 },\n  { key: \"A. C. F.\", value:\
    \ 1 },\n  { key: \"A. L. E.\", value: 5 },\n  { key: \"A.E.\", value: 2 }\n]\n\
    ```\n\nIt may take a while for the results to come back, especially if you recently\
    \ added the _design/books document. To process the map function, CouchDB sends\
    \ every document in the database through it to produce the view. As new documents\
    \ are added, CouchDB will incrementally update the generated views (it doesn't\
    \ have to run through them all time).\n\nThe group=true parameter tells CouchDB\
    \ that we want the result of running the reduce function as well. Since our reduce\
    \ function is a basic count, the value field of each row is the number of books\
    \ attributed to that author. So, for example, the author \"A.E.\" is credited\
    \ with two books.\n\nCouchDB allows you to ask for a subset of view records by\
    \ specifying a specific key or a startkey and endkey as URL parameters. We'll\
    \ use these capabilities in Chapter 6, Scalable Web Services, on page 87, when\
    \ we build our own RESTful interface for querying the data.\n\n## Wrapping Up\n\
    \nThis chapter covered a lot of ground against the backdrop of working with databases.\
    \ To start, we created a project directory complete with a package.json file for\
    \ managing dependencies through npm.\n\nBy choosing CouchDB—a RESTful, JSON-based,\
    \ document-oriented datastore—we got a detailed look at how RESTful APIs work.\
    \ We used the request module to simplify making HTTP client requests from Node.\n\
    \nStep by step, you created scripts to import large amounts of data into CouchDB\
    \ with Node. We saw how Node's extreme speed sometimes works against it, exhausting\
    \ system resources and overwhelming other services. To fix this, we explored techniques\
    \ for queuing work using the async module. Along the way you learned how to use\
    \ nodeunit to develop and run unit tests for your modules.\n\n## Robustness\n\n\
    We dealt with the ECONNRESET problem in Putting It All Together, on page 78, by\
    \ turning the concurrency down from 1,000 to 10.\n\n- What would happen if we\
    \ still got an ECONNRESET?\n- How would you change the code to retry the operation?\n"
  mdcn: "\n不同的数据库和 RESTful 服务处理冲突的方式各不相同。依赖 `rev` 参数是 CouchDB 特有的特性。\n\n处理完那个额外的文档后，是时候开始查询数据了。不同的数据库提供不同的数据查询方式，但大多数都包含某些索引的概念。当你对数据库建立索引时，就可以根据数据的某些字段或属性进行快速检索。\n\
    \n在 CouchDB 中，你编写 mapreduce 函数，这些函数会生成视图（views）。视图是一种索引，它将值映射回文档。通过视图，你可以查询具有特定属性或字段的文档——例如，通过作者查找书籍。\n\
    \n我们将为 Gutenberg 数据集创建两个视图：一个用于根据作者查找书籍，另一个用于根据给定主题查找书籍。由于 CouchDB 视图由 JavaScript\
    \ 代码组成，我们将它们保存在一个 Node.js 模块（`views.js`）中，并编写一个小型工具程序将它们加载到 CouchDB 中。\n\n## 使用\
    \ Mapreduce 视图查询数据\n\n## 使用 Node 进行跨环境脚本\n\n大多数时候，当你编写 JavaScript 代码时，你是希望这段代码在编写它的同一个环境中执行的。例如，如果你在一个\
    \ Node 模块中写了一个方法，你可能期望未来的某个 Node 进程会运行该函数。\n\n然而，有时你编写的 JavaScript 代码可能指向另一个环境。我将其称为“跨环境脚本”——在一个环境中编写\
    \ JavaScript，但在另一个环境中执行它。在我们的案例中，我们将在 Node 中编写函数，并打算在 CouchDB 中运行。\n\n让我们编写视图代码。打开文本编辑器并输入以下\
    \ `lib/views.js`：\n\n```javascript\ndatabases/lib/views.js\nmodule.exports = {\n\
    \  by_author: {\n    map: function(doc) {\n      if ('authors' in doc) {\n   \
    \     doc.authors.forEach(emit);\n      }\n    }.toString(),\n    reduce: '_count'\n\
    \  },\n\n  by_subject: {\n    map: function(doc) {\n      if ('subjects' in doc)\
    \ {\n        doc.subjects.forEach(function(subject) {\n          emit(subject,\
    \ subject);\n        });\n        subject.split(/\\s+|--|\\s+/).forEach(function(part)\
    \ {\n          emit(part, subject);\n        });\n      }\n    }.toString(),\n\
    \    reduce: '_count'\n  }\n};\n```\n\n将此文件保存在项目的 `lib` 目录下，名为 `views.js`。\n\n\
    第一个视图是 `by_author` 视图——它让我们能够根据特定作者查找书籍。它的 `map()` 函数为每个包含 `authors` 数组的文档（即我们导入的每本书）的每个作者发射一个键。我们必须检查文档是否包含\
    \ `authors` 键，以防数据库中存在不是书籍的文档。\n\n第二个视图是 `by_subject`。对于 `subjects` 数组中的每个主题，我们都会发射整个主题以及主题的每个部分（由两个破折号分隔）。例如，假设一本书的主题是\
    \ \"Assassins – Drama\"。`by_subject` 映射器将发射 \"Assassins – Drama\"、\"Assassins\"\
    \ 和 \"Drama\"。这让我们能够通过完整主题或部分主题查找书籍。\n\n这两个视图的 `map` 函数都已编码为字符串，这样我们就可以将它们放入 CouchDB，因为\
    \ CouchDB 仅允许 JSON 文档（而 JSON 不允许包含真正的函数）。这两个视图的 `reduce` 函数都是 CouchDB 内置的 `_count`\
    \ 函数。这将让我们查出特定作者或特定主题下有多少书籍。\n\n现在，让我们将这些视图放入数据库。\n\n## 使用 async.waterfall 回调链\n\
    \nCouchDB 将视图存储在特殊的设计文档（design documents）中。你使用普通的 REST 命令来添加和删除设计文档，就像使用任何其他文档一样。因此，我们需要在\
    \ CouchDB 中 `PUT` 一个包含我们视图的设计文档。\n\n让我们写一个脚本来创建或更新用于存放这些视图的设计文档。再次打开编辑器并输入：\n\n\
    ```javascript\ndatabases/make-views.js\n#!/usr/bin/env node --harmony\n'use strict';\n\
    \nconst async = require('async'),\nconst request = require('request'),\nconst\
    \ views = require('./views.js');\n\nasync.waterfall(\n  // 获取设计文档（如果存在）\n  function(next)\
    \ {\n    request.get('http://localhost:5984/books/_design/books', next);\n  },\n\
    \n  // 创建新的设计文档或使用已有的\n  function(res, body, next) {\n    if (res.statusCode ===\
    \ 200) {\n      next(null, JSON.parse(body));\n    } else if (res.statusCode ===\
    \ 404) {\n      next(null, { views: {} });\n    }\n  },\n\n  // 将视图添加到文档并提交\n\
    \  function(doc, next) {\n    Object.keys(views).forEach(function(name) {\n  \
    \    doc.views[name] = views[name];\n    });\n    request({\n      method: 'PUT',\n\
    \      url: 'http://localhost:5984/books/_design/books',\n      json: doc\n  \
    \  }, next);\n  },\n\n  function(err, res, body) {\n    if (err) throw err;\n\
    \    console.log(body);\n  }\n);\n```\n\n使用 `chmod +x` 将该文件保存在项目目录并命名为 `make-views.js`。此程序使用\
    \ `async` 模块的 `waterfall()` 方法来执行一系列异步函数。`waterfall` 方法清理了原本因嵌套回调而导致高度缩进的代码。`waterfall`\
    \ 接收两个参数：一个要执行的函数数组以及一个在所有操作完成后调用的总结函数。数组中的每个函数接收若干参数，并最终通过一个 `next` 回调向前传递结果。\n\
    \n我们的第一个函数启动了对 `_design/books` 设计文档的请求，使用 `next` 函数作为其回调。如果这是第一次运行此程序，那么还没有 `_design/books`\
    \ 文档，请求将返回 `404 Not Found` 状态码。第二个函数检查我们得到的是 `404 Not Found` 还是 `200 OK`。对于 `200\
    \ OK`，我们只需要解析响应体返回的 JSON 并将其传递。对于 `404 Not Found`，我们必须创建一个骨架文档传递给下一个函数。第三个函数将我们在\
    \ `views.js` 中放入视图复制到设计文档中。然后它向数据库发出 `PUT` 请求以保存新创建或更新的文档。与我们之前的请求一样，我们使用 `next`\
    \ 函数作为回调。最后，总结函数返回上一次请求的状态码和响应体。让我们试一下吧！打开终端并运行 `make-views.js`：\n\n```bash\n\
    $ ./make-views.js\n{ ok: true, id: '_design/books', rev: '7e273ae8166072a' }\n\
    ```\n"
