    \ 服务器需要一个 ZeroMQ 客户端。\n\n现在让我们来实现订阅端。\n\n## 订阅发布者\n\n实现 ZeroMQ PUB/SUB 对中的 SUB\
    \ 部分所需的代码比发布者还要少。打开编辑器并输入以下内容：\n\n```javascript\nmessaging/zmq-watcher-sub.js\n\
    \"use strict\";\nconst\n  zmq = require('zmq');\n\n// 创建订阅端点\n  subscriber = zmq.socket('sub');\n\
    \n// 订阅所有消息\n  subscriber.subscribe(\"\");\n\n// 处理来自发布者的消息\nsubscriber.on(\"\
    message\", function(data) {\n  let\n    message = JSON.parse(data);\n    date\
    \ = new Date(message.timestamp);\n    console.log(\"File ' + message.file + '\
    \ changed at \" + date);\n});\n\n// 连接到发布者\n  subscriber.connect(\"tcp://localhost:5432\"\
    );\n```\n\n将此文件保存为 `zmq-watcher-sub.js`。它使用 `zmq.socket('sub')` 创建一个订阅端点。\n\n\
    消息发布与订阅 • 4\n\n调用 `subscriber.subscribe(\"\")` 告诉 ZeroMQ 我们想要接收所有消息。如果你只想接收某些消息，可以提供一个作为前缀过滤的字符串。你必须在代码的某个地方调用\
    \ `subscribe()`——在调用之前，你将接收不到任何消息。\n\n`subscriber` 对象继承自 `EventEmitter`。每当它从发布者接收到消息时，它就会触发消息事件，因此我们使用\
    \ `subscriber.on()` 来监听它们。\n\n最后，我们使用 `subscriber.connect()` 建立连接的客户端。\n\n让我们看看这些部分是如何组合在一起的。在第一个终端中保持\
    \ PUB 程序运行的同时，在第二个终端中启动 `zmq-watcher-sub`：\n\n```\n$ node --harmony zmq-watcher-sub.js\n\
    ```\n\n然后，在第三个终端中，触碰目标文件：\n\n```\n$ touch target.txt\n```\n\n在订阅者终端中，你应该看到类似这样的输出：\n\
    File 'target.txt' changed at Wed May 22 2013 21:34:10 GMT-0400 (EDT)\n\n到目前为止，一切看起来非常棒。发布者和订阅者程序能够成功与\
    \ PUB/SUB 套接对进行通信。\n\n但还可以更棒。保持这些服务运行；接下来我们将介绍 ZeroMQ 如何处理网络中断。\n\n## 自动重连端点\n\
    \n让我们看看当一个端点意外断开时会发生什么。尝试在它的终端中通过 Ctrl-C 杀死发布者。\n\n之后，切换到订阅者终端。你可能会注意到发生了一些奇怪——什么都没发生。尽管发布者已经掉线，订阅者仍在等待消息，仿佛什么都没发生过。\n\
    \n在第一个终端中重新启动发布者，然后触碰目标文件。订阅者应该会在控制台上记录一条 `File changed` 消息。就像它们一直连接着一样。\n\n从\
    \ ZeroMQ 的角度来看，哪个端点先启动并不重要。当一个端点重新上线时，它会自动重新建立连接。这些特性共同构成了一个健壮的平台，无需你付出大量工作即可提供稳定性。\n\
    \n在我们之前的示例中，PUB 和 SUB 端点都是通过 `zmq.socket()` 创建的。这意味着它们都具有了执行 `bind()` 或 `connect()`\
    \ 的能力。\n\n## 第 4 章 健壮的消息传递服务 • 48\n\n我们的代码让发布者绑定了 TCP 套接字（作为服务器），并让订阅者连接（作为客户端），但\
    \ ZeroMQ 并不强制你这样做。我们可以将它们反过来，让订阅者绑定一个套接字，然后让发布者连接到该套接字。\n\n当你设计网络化应用程序时，你通常会让架构中稳定的部分进行\
    \ `bind`，并让瞬态部分 `connect` 到它们。使用 ZeroMQ，你可以决定系统的哪些部分是稳定的，并决定哪种消息模式最适合你的需求。但你不需要同时决定它们，以后改变主意也很容易。ZeroMQ\
    \ 提供了灵活的、持久的管道来构建分布式应用程序。\n\n对于 Node.js 来说，ZeroMQ 并没有开箱即的数据中心扩展策略。两者都为你提供了实现该目标的构建块。\n\
    \n接下来，我们将查看一种不同的消息模式：请求/响应（request/response）。然后，我们将其与 Node 的集群支持相结合，以管理工作进程池。\n\
    \n## 响应请求\n\nREQ/REP（请求/响应）模式在网络编程中非常常见，特别是在 Node 中。我们将在接下来的几个章节中频繁使用这种模式，且 ZeroMQ\
    \ 对此有很好的支持。你稍后就会看到，ZeroMQ 中的 \"Q\" 何何所在。\n\n在 ZeroMQ 中，一个 REQ/REP 对是同步步通信的。一个请求进来，然后发送一个回复。额外的传入请求会被排队，并在稍后由\
    \ ZeroMQ 分发。然而，你的应用程序一次只能感知到一个请求。\n\n## 实现响应者\n\nREQ/REP 对是同步步通信的。一个请求进来，然后发送一个回复。额外的传入请求会被排队，并在稍后由\
    \ ZeroMQ 分发。然而，你的应用程序一次只能感知到一个请求。\n\n让我们看看它是如何工作的。打开编辑器并输入以下内容：\n\n```javascript\n\
    messaging/zmq-rep.js\n\"use strict\";\nconst\n  fs = require('fs'),\n  zmq = require('zmq');\n\
    \n// 创建响应者端点\n  responder = zmq.socket('rep');\n\n// 监听 TCP 端口 5433\nresponder.bind('tcp://*:5433');\n\
    \n// 处理传入的请求\nresponder.on(\"message\", function(data) {\n  let request = JSON.parse(data);\n\
    \  console.log(\"Received request: ' + request.path);\n\n  // 读取文件\n  fs.readFile(request.path,\
    \ function(err, content) {\n    responder.send(JSON.stringify({\n      content:\
    \ content.toString(),\n      timestamp: Date.now(),\n      pid: process.pid\n\
    \    }));\n  });\n});\n\n// 关闭响应者\nprocess.on('SIGINT', function () {\n  console.log('Shutting\
    \ down...');\n  responder.close();\n});\n```\n\n将此文件保存为 `zmq-rep.js`。响应者绑定到 TCP\
    \ 端口 5433 并等待传入的请求。\n\n## 第 4 章 健壮的消息传递服务 • 50\n\n按照常例在终端中使用 --harmony 启动程序：\n\
    \n```\n$ node --harmony zmq-rep.js\nListening for requests...\n```\n\n看起来我们的响应者准备好了！但为了连接它，我们需要开发一个客户端，让我们编写一个。\n\
    \n## 发起请求\n\n创建一个与响应者工作的请求者非常短。打开编辑器并输入以下内容：\n\n```javascript\nmessaging/zmq-req.js\n\
    \"use strict\";\nconst\n  zmq = require('zmq'),\n  filename = process.argv[2],\n\
    // 创建请求端点\n  requester = zmq.socket('req');\n\n// 处理来自响应者的回复\nrequester.on(\"\
    message\", function(data) {\n  let response = JSON.parse(data);\n  console.log(\"\
    Received response: \" + response);\n});\n\nrequester.connect(\"tcp://localhost:5432\"\
    );\n// 发送内容请求\nconsole.log(\"Sending request for ' + filename);\nrequester.send(JSON.stringify({\n\
    \  path: filename\n})));\n```\n\n将文件保存为 `zmq-req.js`。该程序首先创建一个用于传入消息事件（回复）的 ZeroMQ\
    \ REQ Socket。\n\n让我们看看这些 REQ 和 REP 套接字是如何协同工作的。在第一个终端中保持 zmq-rep 程序运行的同时，在另一个终端运行它：\n\
    \n```\n$ node --harmony zmq-req.js target.txt\nSending request for target\nReceived\
    \ response: { content: '', timestamp: 1370271311810, pid: 32730 }\n```\n\n成功！REP\
    \ 端点接收了请求，处理了它，并返回了回复。\n\n"
