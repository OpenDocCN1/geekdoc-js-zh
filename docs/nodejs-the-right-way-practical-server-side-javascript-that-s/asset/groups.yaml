    \n要添加 passport，首先在 `server.js` 文件的顶部的 `const` 声明添加以下内容：\n\n```javascript\nweb-app/b4/server.js\n\
    passport = require('passport'),\nGoogleStrategy = require('passport-google').Strategy;\n\
    ```\n\n然后你需要初始化 passport 中间件。在 `app.use(express.session...);` 之后添加此内容：\n\n```javascript\n\
    web-app/b4/server.js\napp.use(passport.initialize());\napp.use(passport.session());\n\
    ```\n\nPassport 不同的身份验证机制被称为“策略”（strategies）。上述代码的第二行引入了 Google 身份验证策略。\n\n##\
    \ 配置 Passport 策略\n\nPassport 本身以及策略都需要一些配置才能发挥作用。这里是如何使用 Google 策略配置 passport\
    \ 的简短示例。\n\n```javascript\nweb-app/b4/serialize\npassport.serializeUser(function(user,\
    \ done) {\n  done(null, user.identifier);\n});\npassport.deserializeUser(function(id,\
    \ done) {\n  done(null, { identifier: id });\n});\n```\n\n这段代码设置了 passport 的序列化（serialize）和反序列化（deserialize）函数，并告诉\
    \ passport 使用我们之前引入的 Google 策略。\n\n使用 `serializeUser()` 方法指定哪些信息应该存储在 session\
    \ 中。你可以在其他地方保留数据，但这些数据与 session cookie 关联。\n\n通常，`deserializeUser()` 方法是将 session\
    \ 数据转换回对象。这对于应用程序识别是哪个用户在发送后续请求是必要的。\n\n"
