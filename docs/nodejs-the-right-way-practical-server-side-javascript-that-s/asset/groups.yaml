    \ Data events in particular pass along a buffer object. Each time we get a chunk\
    \ of data, we append it to our output.\n\nA Buffer is Node's way of representing\
    \ binary data. It points to a blob of memory allocated by Node's native core,\
    \ outside of the JavaScript engine. Buffers can be resized and they require encoding\
    \ and decoding to convert to from JavaScript strings.\n\nCalling toString() explicitly\
    \ converts the buffer's contents to a JavaScript string using Node's default encoding\
