    \ when the Node process ends\nprocess.on('SIGINT', function () {\n  console.log('Shutting\
    \ down...');\n  responder.close();\n});\n```\n\nSave the file as zmq-filer-rep.js.\
    \ The program creates a ØMQ REP and uses it to respond to incoming requests.\n\
    \nWhen a message event happens, we parse the request from the raw data. Next we\
    \ call fs.readFile() to asynchronously retrieve the requested file's content.\
    \ When it arrives, we use the responder's send() method to reply with a JSON serialized\
    \ response, including the file content and a timestamp. We also include the process\
    \ ID (pid) of the Node process in the response.\n\nThe responder binds to TCP\
    \ port 5433 of the loopback interface (IP 127.0.0.1) to wait for connections.\
    \ This makes the responder the stable endpoint of the REP/REQ pair.\n\nFinally,\
    \ we listen for SIGINT events on the Node process. This Unix signal indicates\
    \ that the process has received an interrupt signal from the user—typically invoked\
    \ by pressing Ctrl-C in the terminal. The clean thing to do in this case is ask\
    \ the responder to gracefully close any outstanding connections."
