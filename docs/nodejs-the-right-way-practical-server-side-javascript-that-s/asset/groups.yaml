    \ `show()`。\n\n现在只有一个视图导航任务需要处理：页面首次加载时该做什么。在启动时，页面应该确定用户是否已通过身份验证。如果是，用户显示 `list-bundles`\
    \ 视图；否则，将他们发送到 `welcome` 视图，那里将有一个登录的链接。\n\n以下是启动视图的代码：\n\n```javascript\nweb-app/b4/static/app.js\n\
    $.ajax({\n  url: '/api/user',\n  accepts: 'application/json'\n})\n.then(function(data,\
    \ status, xhr) {\n  getBundles();\n}, function(xhr, status, err) {\n  showView('welcome');\n\
    });\n```\n\n首先，我们使用 jQuery 的 `.ajax()` 发起一个异步请求 `/api/user`。这种方法类似于产生 promise\
    \ 的 `request()`。\n\n我们调用 `then()` 并传入了两个处理程序，一个用于成功，一个用于失败。如果请求成功，我们继续执行 `getBundles()`；否则我们显示\
    \ `welcome` 视图。\n\n接下来，让我们看看更多的客户端请求代码。\n\n## 与 REST API 同步模型\n\n在我们的单页 Web 应用中，用户一旦登录，就会将看到\
    \ `list-bundles` 视图。在我们渲染它之前，我们需要知道用户已经创建了哪些包。\n\nb4 项目中的 `static/app.js` 文件包含一个名为\
    \ `bundles` 的变量。这是存储在服务器上的实际用户包的本地副本。为了开始，Web 应用需要下载远程副本——这就是 `getBundles()` 的的作用：\n\
    \n```javascript\nweb-app/b4/static/app.js\nBundles = function() {\n  $.ajax({\n\
