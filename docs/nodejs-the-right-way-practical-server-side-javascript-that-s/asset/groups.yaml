    \ IPC（进程间通信）进行传输是合理的。\n\n第 63 页“双向消息”中的额外挑战将要求你实现前面描述的 PUSH/PULL 集群。但注意，这只是解决“第一个加入者问题”的一种解决方案。你可以选择为反向通道使用不同的消息模式，例如请求/响应（request/reply）。\n\
    \n## 资源限制问题\n\n另一个常见的陷阱是资源限制问题。在可以访问的资源数量方面，Node.js 完全受操作系统的限制。在 Unix 术语中，这些被称为文件描述符（file\
    \ descriptors）。\n\n第 4 章 健壮的消息服务 • 62\n\n每当你的 Node 程序打开文件或 TCP 连接时，它都会使用其可用的文件描述符之一。当没有可用描述符时，Node\
    \ 在被请求连接时将开始连接失败。对于 Node.js 开发者来说这是一个非常常见的问题。我还没有遇到过没有在时候挣扎过资源限制问题的 Node 开发者。\n\
    \n严格来说，这个问题并不局限于 PUSH/PULL 场景，但它在那里极有可能发生，原因如下：由于 Node.js 是异步的，拉取进程可以同时开始处理许多任务。每当一个消息事件进入时，Node\
    \ 进程就会调用处理器并开始处理任务。如果这些任务需要访问系统资源——它们几乎肯定会需要——就可能会耗尽可用文件描述符池。然后任务将迅速开始失败。\n\n\
    我们将在第 65 页“访问数据库”中详细探讨这个主题及其解决方案，届时我们将通过称为“连接池”（connection pooling）的技术来限制并发数据库连接的数量。\n\
    \n## 总结\n\n本章带我们离开了 Node.js 核心，进入了更大的 npm 世界。我们讨论了如何安装和使用带有二进制组件的第三方模块。特别是，我们涵盖了如何使用\
    \ ZeroMQ。\n\nZeroMQ 支持多种消息传递模式；我们了解了其中几种。我们看到了 ZeroMQ 如何实现发布/订阅模式、请求/响应模式以及 PUSH/PULL\
    \ 模式。这些模式现在可以用于你设计 Node.js 网络应用程序了，即使你选择不使用 ZeroMQ 库本身。\n\n我们还探索了 Node 的集群能力。利用\
    \ Node cluster 模块的特性，我们启动了许多工作进程并将请求分配给它们。我们将在第 87 页“可扩展的 Web 服务”中再次使用这些能力。\n\n\
    以下额外问题要求你利用在本章中学到的知识来修改和创建新的 Node.js 和 ZeroMQ 程序。\n\n在下一章中，我们将涵盖如何使用 Node 与多个流行的数据库进行异步交互。\n\
    \n## 错误处理\n\n我们创建的 `zmq-filer-rep.js` 程序使用 `fs.readFile()` 来提供文件内容。然而，它没有处理错误情况。\n\
    \n总结 • 63\n\n- 如果发生错误，程序应该做什么？\n- 你如何更改协议以支持向请求者发送错误？\n在同一个程序的后面，我们监听 Unix 信号\
    \ SIGINT 以检测用户在终端中按下的 Ctrl-C。\n- 如果程序以其他方式结束（例如 SIGTERM，终止信号），会发生什么？\n- 如果存在未处理的\
    \ Node.js 异常，会发生什么？\n\n*提示：*你可以在 `process` 对象上监听 `uncaughtException` 事件。\n\n##\
    \ 健壮性\n\n在第 56 页的*构建集群*中，我们创建了一个启动三个工作进程的 Node.js 集群。在主进程中，我们监听了在线事件并在工作进程启动时记录了消息。但我们没有指定当工作进程结束时应该发生什么。\n\
    \n- 当从命令行杀死一个工作进程时会发生什么\n*提示：*从命令行使用 `kill [pid]`，其中 `[pid]` 是工作进程的 ID。\n- 你如何更改\
    \ *zmq-filer-rep-cluster.js* 程序，以便每当有一个工人死去时就派一个新的？\n\n## 双向消息\n\n对于这个项目，你需要使用\
    \ ZeroMQ PUSH/PULL 字字以及在本章中学到的 Node.js 集群技术。你的集群程序将启动一个包含三个工作进程的池并在它们之间分配三十个任务。尽管看起来要做很多，但整个程序应该少于\
    \ 100 行代码。\n\n创建一个使用 `cluster` 和 `zmq` 模块的 Node.js 程序并执行以下操作。\n\n- 主进程应该：\n  \
    \  - 创建一个 PUSH 字字并绑定到 IPC 端——该字字将用于向工作进程发送任务。\n    - 创建一个 PULL 字字并绑定到不同的 IPC 端——该字字将接收工作进程的消息。\n\
    \    - 保持就绪工作进程的计数（初始化为 0）。\n    - 在 PULL 字字上监听消息并：\n        - 如果消息是就绪消息，增加就绪计数器，或\n\
    \        - 如果消息是结果消息，将其输出到控制台。\n    - 启动三个工作进程。\n    - 当就绪计数器达到 3 时，通过 PUSH 字字发送三十条任务消息。\n\
    \n每个工作进程应该：\n    - 创建 PULL 字字并连接到主进程的 PUSH 端。\n    - 创建 PUSH 字字并连接到主进程的 PULL 端。\n\
    \    - 在 PULL 字字上监听消息并：\n        - 将此视为任务并通过向 PUSH 字字发送结果消息来响应。\n    - 向 PUSH\
    \ 字字发送就绪消息。\n\n结果消息应该包含工作进程的进程 ID。这样你就可以检查控制台输出并确认负载在工作进程之间是平衡。\n\n如果你遇到困难，请参考下载代码中的工作示例。你可以可以的。祝运！\n\
    \n# 第 5 章\n\n## 访问数据库\n"
