    \ bundle doesn't already exist?\n\nThe lib/bundle.js already has a REST endpoint\
    \ for this. Take a look if you get stuck.\n\n# Promises and Deferrals\n\nWe used\
    \ promises a lot in this chapter to manage success and failure cases for asynchronous\
    \ requests, relying on the then() method to assign callbacks for when the promise\
    \ is resolved or rejected.\n\nQ implements the Promises/A specification. Although\
