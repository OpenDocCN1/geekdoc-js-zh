    \ 服务器。¹ 但直接针对低级 http 模块编写服务会非常耗时。我们将使用 Express 来开发我们的 Web 服务。²\n\n1. http://nodejs.org/api/http.html\n\
    2. http://expressjs.com/\n\n由于代码示例变得越来越复杂，你应该获取书中随附的代码，而不是尝试手动输入。在 `web-services`\
    \ 目录中，你会找到包含本章所有代码的文件。如果你还没有它，现在就开始使用 Express 吧。\n\n## Express 的优势\n\nExpress\
    \ 是一个为 Node 设计的 Web 框架，模仿了 Sinatra.³ 它提供了许多你可能需要自己编写的底层代码。为了了解这一点，让我们看看仅使用 http\
    \ 模块创建一个基础 Node.js 服务器。\n\nweb-services/server.js\n\n```javascript\nconst http\
    \ = require('http'),\nserver = http.createServer(function(req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World!');\n});\nserver.listen(3000,\
    \ function(){\n  console.log('ready captain!');\n});\n```\n\n这与使用 net 模块创建一个基础\
    \ TCP 服务器非常相似。首先引入 http 模块，调用其 createServer() 方法并传入回调，最后使用 server.listen() 绑定\
    \ TCP 端口。回调函数使用来自 HTTP 请求 (req) 信息来发送适当的响应。\n\n这个示例的独特不在于它做了什么，而在于它没有做什么。典型的 Web\
    \ 服务器需要处理许多该代码没有涉及的任务：\n\n- 基于 URL 路径的路由\n- 通过 cookie 管理会话\n- 解析请求（如表单数据或 JSON）\n\
    - 拒绝格式错误的请求\n\nExpress 框架可以帮助处理这些。\n\n## 使用 Express 提供 API\n\n对于所有 Node 模块，要使用\
    \ Express 你必须通过 npm 安装它。如果你在创建项目，只需运行 `npm install --save express` 来下载最新的 Express\
    \ 并将其记录在你的 package.json 文件中。让我们看看它是如何工作的。在终端中，到 hello 子目录，扩展这个骨架来创建我们自己的 RESTful\
    \ API。这里是 server.js 文件的内容：\n\nweb-services/hello/server.js\n```javascript\n#!/usr/bin/env\
    \ node --harmony\n'use strict';\nconst\n  express = require('express');\n  app\
    \ = express();\n  app.use(express.logger('dev'));\n  app.get('/api/:name', function(req,\
    \ res) {\n    res.json(200, {\"hello\": req.params.name });\n  });\n  app.listen(3000,\
    \ function() {\n    console.log('ready captain.');\n  });\n```\n\n首先，此程序引入 express\
    \ 模块并创建一个 app。就像我们在上章使用的 request 模块一样，express 模块本身就是一个函数。当你调用此函数时，Express 会为你创建一个应用程序。按照惯例，我们将此变量命名为\
    \ app。\n\nExpress 功能通过称为中间件的东西提供，这些是操作请求和响应对象的异步函数。为你的应用指定中间件，你需要调用 app.use()\
    \ 并传入中间件。在我们的情况下，我们使用 logger 中间件设置 dev 模式，这将记录所有进入的请求。\n\n接下来我们使用 app.get() 告诉\
    \ Express 我们如何处理 GET /api/:name。路径中的 name 是一个路由参数。当访问 API 时，Express 会抓取 URL 的该部分并使其在\
    \ req.params 中可用。\n\n除了 get()，Express 还有 put()、post() 和 del() 分别注册 PUT、POST 和\
    \ DELETE 的处理程序。在我们的情况下，此程序监听端口 3000 的请求。最后，当服务器准备就绪，让我们看看它做了什么。\n\n## 使用 npm 运行服务器\n\
    \n这次我们使用 npm 而不是直接用 node 启动服务器。打开 hello 目录并运行：\n\n```bash\n$ npm start\n```\n\n\
    输出应该如下：\n\n```\n> hello@0.1.0 start\nnode server.js\n\nready captain.\n```\n\n\
    npm 知道如何运行它，因为 package.json 中有脚本。如果你打开 package.json，你会发现一个这样的部分：\n\n```json\n\"\
    scripts\": {\n  \"start\": \"node server.js\"\n}\n```\n\n## 使用 curl 测试端点\n\n服务器运行时，让我们尝试一下。在另一个控制台中，使用\
    \ curl 请求 /api/ 路径：\n\n```bash\n$ curl -i http://localhost:3000/api/world\n```\n\
    \n你应该看到：\n\n```\nHTTP/1.1 200 OK\nX-Powered-By: Express\nContent-Type: application/json\n\
    Content-Length: 18\nDate: Tue, 10 Sep 2013 14:41:22 GMT\nConnection: keep-alive\n\
    \n{\n  \"hello\": \"world\"\n}\n```\n\n-i 标志告诉 curl 在 JSON 体之外输出 HTTP 头部。curl\
