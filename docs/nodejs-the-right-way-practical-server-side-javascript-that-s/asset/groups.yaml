    # CHAPTER 1


    # Getting Started


    A lot of the buzz around Node.js is focused on the Web. In truth, Node serves
    a bigger purpose that people often miss. Let''s see where Node fits in the broader
    scheme of things by making a map.


    Imagine the universe of all possible programs as an immense sea. Programs that
    have similar purposes are near to each other, and programs that differ are further
    apart. With that picture in mind, take a look at the following figure. It shows
    a close-up of one particular outcrop in this sea, the Island of I/O-Bound Programs.


    ![](img/4fd6c7ecbcaceceafb5f645d145c46f5_16_0.png)


    Figure 1—Map of the Island of I/O-Bound Programs


    I/O-bound programs are constrained by data access. These are programs where adding
    more processing power or RAM often makes little difference.


    East of the mountain range, we find the client-side programs. These include GUI
    tools, mobile apps, and web apps. West of the mountains are the server-side programs.
    This vast expanse is Node.js.


    Deep within the server-side region lies the Web—that old guard of HTTP, REST,
    and JSON. Because we spend so much thinking about the Web, we overemphasize Node’s
    use in developing applications. People ask, "How is Node better for making apps?"
    or "How can I make REST with Node?" These are good questions, but they miss the
    point. Node is great for a wider range.


    # Node’s Niche


    Since JavaScript’s first appearance in 1995, it has been solving problems all
    along the front-end/back-end spectrum. The following figure shows this spectrum
    and where Node.js fits within it.


    ![](img/4fd6c7ecbcaceceafb5f645d145c46f5_17_0.png)


    Figure 2—Node’s place in the spectrum


    In the web browser on the right, much of the scripting involves waiting for user
    interaction. Click here, drag that, choose a file, etc. JavaScript has been extraordinarily
    successful in this space.


    # How Node Applications Work


    On the left, back-end databases are investing heavily in JavaScript-oriented databases
    like MongoDB and CouchDB use JavaScript extensively—from modifying requests to
    ad-hoc queries and mapreduce jobs. Other datastores, like Neo4j and Elasticsearch,
    present data in JavaScript Object Notation (JSON). These days, you can even write
    SQL functions for Postgres in JavaScript with the right-plugin.


    Many middleware tasks are I/O-bound, like client-side scripting and databases.
    These server-side programs often have to wait for things like a database result,
    feedback from a third-party web service, or incoming connections. Node.js is designed
    for exactly these kinds of applications.


    # How Node Applications Work


    Node.js couples JavaScript with an event loop for quickly dispatching operations
    when events occur. Many JavaScript environments use an event loop, but it is a
    core feature of Node.js.


    Node''s philosophy is to give you low-level access to the event loop and system
    resources. Or, in the words of core committer Felix Geisendörfer, in Node "everything
    runs in parallel except your code."


    If this seems a little backwards to you, don''t worry. The following figure shows
    how the event loop works.


    ![](img/4fd6c7ecbcaceceafb5f645d145c46f5_18_0.png)


    Figure 3—The Node.js event loop

