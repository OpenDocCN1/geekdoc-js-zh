    \nThen, open an editor and enter this:\n\n```javascript\n// databases/lib/rdf-parser.js\n\
    'use strict';\nconst\n  fs = require('fs'),\n  cheerio = require('cheerio');\n\
    \nmodule.exports = function(filename, callback) {\n  fs.readFile(filename, function(err,\
