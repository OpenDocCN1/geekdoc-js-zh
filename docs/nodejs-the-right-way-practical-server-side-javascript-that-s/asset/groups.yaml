    \ with Node.¹. CouchDB uses REST for everything, from creating databases to reporting\
    \ the system status to executing map-reduce queries. Using CouchDB to learn about\
    \ asynchronous database access in Node has several advantages.\n\n## Advantages\
    \ of CouchDB\n\nInteracting with CouchDB is all about proper HTTP requests. This\
    \ will give us the opportunity to talk about HTTP and RESTful practices—information\
    \ that will be handy in Chapter 6, *Scalable Web Services*, on page 87, when we'll\
    \ implement our own RESTful web services. And the techniques you'll use here apply\
    \ to other RESTful APIs, like those published by Amazon and Google.\n\nAs a bonus,\
    \ CouchDB speaks JavaScript. Whenever you store data in CouchDB, you will use\
    \ a JavaScript Object Notation (JSON) document. A document is a JSON object with\
    \ a couple of special attributes that we will see shortly. Indexing and querying\
    \ CouchDB is done with map-reduce views in JavaScript, also accessible through\
    \ REST.\n\nLastly, npm itself uses CouchDB extensively. The metadata about modules\
    \ in npm is stored and queried in CouchDB. There is significant overlap between\
    \ the Node.js core developer group and the CouchDB community.\n\nLet's get CouchDB\
    \ up and running. We'll build out a toolkit for working with it. CouchDB is easy\
    \ to install on many platforms. Binaries are available from the project website,\
    \ or you can use a package manager. If you're using Mac OS X with Homebrew, you\
    \ install CouchDB with the command `brew install couchdb`.\n\nOnce you have CouchDB\
    \ installed, start it from the command line with the `couchdb` command.\n\n```bash\n\
    $ couchdb\nApache CouchDB 1.2.1 (LogLevel=info) is starting.\nApache CouchDB has\
    \ started. Time to relax.\n[info] [<3.1.0>] Apache CouchDB has started on http://127.0.0.1:5984/\n\
    ```\n\nThe specific version of CouchDB doesn't matter much for our purposes. We'll\
    \ focus on using basic, RESTful operations, which haven't changed from version\
    \ to version.\n\nThroughout this chapter, you'll develop a number of Node scripts\
    \ and modules. The first thing you'll need to do is set aside space for them,\
    \ starting with a package descriptor.\n\n1. https://couchdb.apache.org/\n\n##\
    \ Creating a Package\n\nCreate a directory on your machine somewhere called `databases`.\
    \ We'll use this directory for all programs, data files, and examples from this\
    \ chapter. Next, open an editor and enter the following:\n\n```json\ndatabases/package.json\n\
    {\n  \"name\": \"book-tools\",\n  \"version\": \"0.1.0\",\n  \"description\":\
    \ \"Tools for creating an ebook database.\",\n  \"author\": \"Your Name <@yite.com>\
    \ (http://yoursite.com/path)\"\n}\n```\n\nSave this file in your project directory\
    \ as `package.json`.\n\nIn a Node.js project, the `package.json` file describes\
    \ many aspects of the project and its dependencies. This short example includes\
    \ only the basics: the project's name, version, short description, and author.\
    \ For your own projects, rather than create a `package.json` file by hand, you\
    \ can use `npm init`. This will prompt you for all the important information.\n\
    \nWhen you install a module through npm, you have the choice of saving it as a\
    \ dependency in `package.json`. You do this with the `--save` flag. Run the following\
    \ command from your project directory:\n\n```bash\n$ npm install --save request\n\
    ```\n\nThis will install the module and record it as a dependency in your `package.json`.\
    \ If you take a look at your `package.json` file again, you'll see there's a dependencies\
    \ section that looks like this:\n\n```json\n\"dependencies\": {\n  \"request\"\
    : \"~2.26.0\"\n}\n```\n\nWhen you describe your dependencies in a `package.json`\
    \ file, npm can install them all for you. This is most useful when distributing\
    \ your module, or when collaborators work on the same code base. To install all\
    \ of the dependencies for the current project, just run `npm install` with no\
    \ additional arguments.\n\nNext, let's use the freshly installed request module\
    \ to start making REST requests to CouchDB.\n\n+ 2. https://npmjs.org/doc/json.html\n\
    \n## Making RESTful Requests\n\nAt its core, REST is a set of principles built\
    \ on top of HTTP. With REST, each URL path points to a specific *resource*. In\
    \ other words, URLs are things. This is in direct contrast to many servers where\
    \ a given path invokes a script that does something (URLs are actions).\n\nHTTP\
    \ itself is a request/reply protocol where each request is made to a URL with\
    \ a particular *method*. The HTTP method for an incoming request determines what\
    \ kind of action the server should take on the resource indicated in the URL.\n\
    \nAny database you work with will offer at least the four basic operations: create,\
    \ read, update, and delete (CRUD). RESTful datastore like CouchDB use a different\
    \ HTTP method (or *verb*) for each operation. You use POST to create, GET to read,\
    \ PUT to update, and DELETE (you guessed it) delete records.\n\n## REST from the\
    \ Command Line\n\nNode's built-in `http` module has functions for making HTTP\
    \ requests, the request module makes it much easier. To learn how to use the request\
    \ module, we'll first put together a command-line interface (CLI) tool for working\
    \ with CouchDB. We'll use the CLI to set up a CouchDB database initially and try\
    \ out some REST semantics.\n\nOpen your editor and enter this:\n\n```javascript\n\
    databases/dbcli.js\n#!/usr/bin/env node --harmony\nconst\n  request = require('request'),\n\
    \  options = {\n    method: process.argv[2] || 'GET',\n    url: 'http://localhost:5984/'\
    \ + (process.argv[3] || '')\n  };\nrequest(options, function(err, res, body) {\n\
    \  if (err) {\n    throw Error(err);\n  } else {\n    console.log(res.statusCode,\
    \ JSON.parse(body));\n  }\n});\n```\n\nSave this file as `dbcli.js`. Though, this\
    \ program lets you do quite a lot with your CouchDB server. First, this script\
    \ uses the request module. Unlike the modules we've seen so far, which were JavaScript\
    \ Objects, the request module object is actually a function. The main way you\
    \ use the module it is by calling it.\n\nThe `request()` function takes two arguments:\
    \ an options object and a callback. The most important options to set are the\
    \ HTTP method and the URL you plan to hit. In our case, we grab both the method\
    \ and path information from the command-line arguments, with sensible defaults.\n\
    \nSince our script starts with the request module. Unlike the modules we've seen\
    \ so far, which were JavaScript Objects, the request module object is actually\
    \ a function. The main way you use the module it is by calling it.\n\n## Using\
    \ the CLI for CouchDB\n\nThe `request()` function takes two arguments: an options\
    \ object and a callback. The most important options to set are the HTTP method\
    \ and the URL you plan to hit. In our case, we grab both the method and path information\
    \ from the command-line arguments, with sensible defaults.\n\nSince our script\
    \ starts with the request module. Unlike the modules we've seen so far, which\
    \ were JavaScript Objects, the request module object is actually a function. The\
    \ main way you use the module it is by calling it.\n\n(Note: The OCR text provided\
    \ contained repetitive blocks at the end; I have reconstructed the logical flow\
    \ based on the available content.)\n"
