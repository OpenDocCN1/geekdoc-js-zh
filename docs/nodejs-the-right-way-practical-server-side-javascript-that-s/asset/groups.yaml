    Chapter 3. Networking with Sockets • 40


    However, writing robust applications is harder when you consider all the ways
    in which a networked application might fail. In the next chapter, we''ll use a
    super-high-performance messaging library to take our Node applications to the
    next level.


    The following bonus questions ask you to improve the code from this chapter, making
    it more testable, more robust, and more modular.


    # Testability


    The server and client programs we developed in this chapter are somewhat coupled.
    For example, to test our client-side program we had to develop another server
    application.


    +   * How could you divide up and expose the functionality to make it more testable?


    *Hint*: consider how you might separate functionality into testable modules.


    # Robustness


    The LDClient developed in this chapter is somewhat fragile. The questions in this
    section ask you to expand on its implementation in key ways.


    +   * LDClient handles the case in which a properly formatted JSON string is split
    over multiple lines, but what happens if an incoming line is not a properly formatted
    JSON string?


    +   * What *should* happen in this case?


    +   * What, if any events, should LDClient emit other than message events?


    # Separating Concerns


    The LDClient takes care of two separable concerns: splitting incoming data into
    lines, and parsing lines as JSON. How would you further separate LDClient into
    two modules, one for each of these concerns?


    Lastly, the *net-watcher.js* at the beginning of this chapter sets up a new watcher
    for each connected client. If you had thousands of connected clients, this would
    mean thousands of watchers. How could you decouple the watching of the file from
    the notification of the connected clients?'
