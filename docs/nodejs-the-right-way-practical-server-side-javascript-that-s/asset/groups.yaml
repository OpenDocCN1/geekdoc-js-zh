    \    // 如果无法获取书籍，则快速失败\n    if (couchRes.statusCode == 200) {\n      res.json(couchRes.statusCode,\
    \ book);\n      return;\n    }\n    // 将书籍添加到包中并回 CouchDB\n    bundle.books[book.id]\
    \ = book.title;\n    args = yield put({url:config.b4db + bundle.id, json: bundle});\n\
    \    res.json(args[0], args[1]);\n  })()\n  .catch(function(err) {\n    res.json(502,\
