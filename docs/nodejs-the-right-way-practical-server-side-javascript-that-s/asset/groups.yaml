  - '[PAGE 109]


    # Chapter 6. Scalable Web Services • 94


    So, for instance, when someone requests /api/search/subject, this will trigger
    a request to the CouchDB view _design/books/_view/by_subject. Notice that we don''t
    check whether req.params.view is one of our expected values—this is left as an
    exercise at the end of the chapter.


    To limit the results coming back from CouchDB, we specify query string parameters
    in q on line 9. When an incoming request contains ?q=Croc, then req.query.q will
    be the string "Croc" (without quotes).


    When receiving a request for a value, CouchDB uses the startkey and endkey parameters.
    In our case, we want all the keys that start with the query string. Using req.query
    + "uff0" for the end guarantees that we''ll get all the keys that start with our
    query parameter. And setting group to true for this view tells CouchDB that we
    unique keys only (no duplicates).


    Finally, starting on line 13, we have our handler function for when the CouchDB
    request returns. There are three outcomes we have to account for:


    +   - The error case—CouchDB didn''t respond, so we should send 502 Bad Gateway
    to the requester.


    +   - The non-success case—CouchDB responded, but it wasn''t the HTTP 200 OK result
    that we expected, so we pass verbatim back to the requester.


    +   - The success case—CouchDB responded with the data we''re after, so we parse
    the JSON and extract just the keys to send back.


    This example demonstrates some of the challenges you''ll face writing RESTful
    APIs. The nice thing about REST is it gives you a good basis for an API. For a
    variety of cases, the HTTP specification prescribes very specific status codes⁴


    However, doing it can be a challenge since you have to account for a variety of
    success and non-success cases. Promises offer one way of managing asynchronous
    code that can help with these challenges, we''ll see in upcoming sections as we
    build out more RESTful APIs.


    # RESTful APIs with Promises


    One thing I love about JavaScript is its extreme flexibility. In JavaScript there
    are seven different ways of doing anything, and you get to pick the one you like.
    This is especially true of managing asynchronous code.'
