  mdcn: "\n\n## 第 7 章. Web 应用 • 112\n\n就像 `package.json` 文件一样，它包含了一个依赖列表。我们的应用依赖于这些前端包：\n\
    \n- jquery—极其流行的用于 Ajax 和 DOM 操作的 JavaScript 库\n- bootstrap—用于 Web 应用的精美 CSS 样式\n\
    - typeahead.js—用于文本框自动完成的 JavaScript 库\n- typeahead.js-bootstrap.css—与 typeahead.js\
