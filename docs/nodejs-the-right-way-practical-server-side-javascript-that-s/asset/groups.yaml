- md: "\n# CHAPTER 7\n\n## Web Apps\n\nBy now, you've mastered several approaches\
    \ to handling asynchronous JavaScript code. You know how to use and write RESTful\
    \ web services. You understand messaging patterns, and how to use Express.\n\n\
    With all of that knowledge and experience, we're now in position to develop a\
    \ web application. This will take us through the following Node.js aspects:\n\n\
    ## Architecture and Core\n\nAt this stage you've moved past the Node.js core in\
    \ many respects. Node is the underlying technology that's letting you reach beyond.\n\
    \n## Patterns\n\nYou'll dive deeper into Express middleware, using it to implement\
    \ a custom authentication handler. We'll use passport—an Express plug-in—so that\
    \ users of our application can log in with their Google accounts. The client-side\
    \ code uses model-view-controller (MVC) to separate concerns.\n\n## JavaScripts\n\
    \nAlthough the Node code in this book takes advantage of the latest available\
    \ ECMAScript Harmony features, those features aren't available in many web browsers.\
    \ You'll learn some differences between ECMAScript 5 and ECMAScript 6 as we code\
    \ JavaScript for the browser. You'll also use jQuery to perform a variety of client-side\
    \ operations.\n\n## Supporting Code\n\nJust like npm makes it easy to pull in\
    \ Node modules, Bower is used to manage client-side dependencies. We'll use Bower\
    \ to pull in jQuery, Bootstrap, Handlebars, and others. We'll also use Redis,\
    \ a fast key-value store, for managing session data.\n\nDeveloping web applications\
    \ is an enormous topic. You could fill a library with books on all the myriad\
    \ concepts you need to know to master it. I've been doing it for over a decade,\
    \ and I'm still learning every day.\n\nSo instead of trying to explore everything\
    \ there is to know, we'll focus on what's specific to Node.js. The code download\
    \ that accompanies this book contains a web-app directory, which has all the code\
    \ from this chapter and more. I encourage you to go grab it if you haven't already,\
    \ since we won't cover everything that's in there.\n\nThe application b4 builds\
    \ on the web services that we developed last chapter. This means you'll need CouchDB\
    \ running, along with the data from Chapter 5, Access Databases, on page 65.\n\
    \nOnce you have those prerequisites, let's dive in!\n\n## Storing Express Sessions\
    \ in Redis\n\nWhenever you have a user-facing web application, you'll almost always\
    \ use sessions. A session is data that's attached to a particular user. As the\
    \ user browses pages on the site or uses the web application, the server keeps\
    \ track of the user through a session cookie. On each request, the server reads\
    \ the cookie, retrieves the session data, then uses it when generating a response.\n\
    \nLet's see how to enable sessions in Express, and how to use Redis for storing\
    \ the session data.\n\n## Enabling Sessions in Express\n\nTo enable sessions,\
    \ add the cookieParser and session middleware to your app:\n\n```\napp.use(express.cookieParser());\n\
    app.use(express.session({secret: 'unguessable'}));\n```\n\nThe cookieParser middleware\
    \ is responsible for parsing cookies from the client, and the session middleware\
    \ stores the session data attached to the cookie. The secret parameter is necessary\
    \ to prevent cookie tampering and spoofing—set it to something unique to your\
    \ application. Express session cookies are signed with this secret string.\n\n\
    ## Using Redis to Store Session Data\n\nRedis is an extremely fast key/value store\
    \ with tunable durability. This means you can keep it fast but risk losing data\
    \ if the server were to crash, or you can sacrifice some speed for greater durability\
    \ guarantees.\n\nBy default, Redis keeps data in memory and then periodically\
    \ writes it to disk. This makes it blazingly fast, but disaster-prone; since a\
    \ process crash would mean lost data.\n\nIts speed makes Redis an ideal database\
    \ for storing session data. If the server tips over, the sessions might be lost,\
    \ but at worst this means that your users will have to log in again.\n\nTo use\
    \ Redis with your Node/Express app, first you'll have to install it. Installing\
    \ Redis differs by platform, but once you have it installed, starting it up is\
    \ a single command:\n\n```\n$ redis-server\n```\n\n```\n[8344] 10 Sep 20:38:41.564\
    \ # Server started, Redis version 2.6.13\n```\n\nUsing Redis with Express takes\
    \ a couple of npm modules: redis and connect-redis. Run npm install --save to\
    \ get them and add them to your package.json.\n\nAs an experiment, let's modify\
    \ the server.js file from the last chapter’s \"Hello World\" app to use Redis\
    \ for session storage. Open the server.js file and add this to the cost declarations\
    \ at the top:\n\n```\nweb-app/hello/server.js\nredisClient = require('redis').createClient(),\n\
    RedisStore = require('connect-redis')(express),\n```\n\nThe first line connects\
    \ a client for the Redis database. This will immediately open a TCP socket to\
    \ your Redis server. The second line produces a class you can use to instantiate\
    \ a Redis-based backing store for sessions.\n\nFinally, in the middleware section\
    \ of your server.js file, use the cookie and session middleware with Redis like\
    \ so:\n\n```\nweb-app/hello/server.js\napp.use(express.cookieParser());\napp.use(express.session({\n\
    \  secret: 'unguessable',\n  store: new RedisStore({\n    client: redisClient\n\
    \  })\n}));\n```\n\n```\napp.get('/api/:name', function(req, res) {\n  res.json(200,\
    \ { \"hello\": req.params.name });\n});\n\napp.listen(3000, function() {\n  console.log(\"\
    Server is now running on port 3000\");\n});\n```\n\nWith these changes in place,\
    \ start up the server:\n\n```\n$ node server.js\n```\n\nTo test it, you can use\
    \ curl to request the API:\n\n```bash\n$ curl -i http://localhost:3000/api/John\n\
    ```\n\nYou should see a response like this:\n\n```\nHTTP/1.1 200 OK\nX-Powered-By:\
    \ Express\nContent-Type: application/json; charset=utf-8\nContent-Length: 15\n\
    Date: Fri, 27 Sep 2023 12:03:52 GMT\nConnection: keep-alive\n\n{\"hello\":\"John\"\
    }\n```\n\n## Creating a Single-Page Application\n\nA single-page application consists\
    \ of an HTML page, CSS to style it, and JavaScript to perform the logic. All these\
    \ can be delivered as static files, meaning they don't require any server-side\
    \ processing.\n\n## Serving Static Content with Express\n\nExpress comes with\
    \ a convenient way to serve static files. All you have to do is use the express.static\
    \ middleware and provide a directory. For example, these lines appear in the b4:\n\
    \n```javascript\nweb-app/b4/server.js\napp.use(express.static(__dirname + '/static/'));\n\
    app.use(express.static(__dirname + '/bower_components/'));\n```\n\nThese two lines\
    \ tell Express to serve static content out of the static/ and bower_components/\
    \ directories of the project. This means that if Express can't find a particular\
    \ route, it'll fall back to the static content, checking these directories one\
    \ at a time.\n\nThe static middleware is special in this regard. Most of the time,\
    \ middleware has its effect in the middle of the request processing, but static\
    \ appends its effect to the end of the chain (even after the route handlers run).\n\
    \nFor instance, the project's static/ directory contains three files: index.html,\
    \ app.css, and app.js. These contain the HTML, CSS, and client-side JavaScript\
    \ for the b4 application, respectively.\n\nWith the server running, when you request\
    \ http://localhost:3000/index.html, Express will serve up static/index.html because\
    \ we don't have an explicit route for it.\n\n## Installing Bower Components\n\n\
    Bower is a package manager for front-end code, like JavaScript libraries. You'll\
    \ install Bower components in the same way you install npm modules.\n\nHere's\
    \ the bower.json file from the b4 application:\n\n```json\nweb-app/b4/bower.json\n\
    {\n  \"name\": \"b4\",\n  \"version\": \"0.0.1\",\n  \"dependencies\": {\n   \
    \ \"jquery\": \"~2.0.3\",\n    \"bootstrap\": \"~3.0.0\",\n    \"typeahead.js\"\
    : \"~0.9.3\",\n    \"typeahead.bootstrap.css\": \"*\",\n    \"handlebars\": \"\
    ~1.0.0\"\n  }\n}\n```\n"
  mdcn: "\n\n# 第7 章\n\n## Web 应用\n\n到此时，你已经掌握了处理异步 JavaScript 代码的多种方法。你知道如何使用和编写 RESTful\
    \ Web 服务。你理解消息模式，以及如何使用 Express。\n\n拥有了这些知识和经验，我们现在有能力开发 Web 应用了。这将带领我们学习以下 Node.js\
    \ 的方面：\n\n## 架构与核心\n\n在这一阶段，从很多方面你已经超越了 Node.js 核心。Node 是让你能够更深层次开发的底层技术。\n\n\
    ## 模式\n\n你将深入研究 Express 中间件，使用它来实现自定义身份验证处理程序。我们将使用 passport——一个 Express 插件——以便我们应用程序的用户可以使用他们的\
    \ Google 账户登录。客户端代码使用模型-视图-控制器（MVC）来分离关注点。\n\n## JavaScript\n\n虽然书中的 Node 代码利用了最新的\
    \ ECMAScript Harmony 特性，但这些特性在许多网络浏览器中并不可用。在我们为浏览器编写 JavaScript 时，你将学习 ECMAScript\
    \ 5 和 ECMAScript 6 之间的区别。你还将使用 jQuery 来执行各种客户端操作。\n\n## 支持代码\n\n就像 npm 轻松引入 Node\
    \ 模块一样，Bower 被用于管理客户端依赖。我们将使用 Bower 引入 jQuery、Bootstrap、Handlebars 等。我们还将使用 Redis（一种快速的键值存储）来管理会话数据。\n\
    \n开发 Web 应用是一个巨大的课题。你可以用满一图书馆的书来介绍掌握它所需要了解的无数概念。我已经在这个领域工作了十多年，而且每天都在学习。\n\n所以，我们不会尝试探索所有可以了解的内容，而是专注于\
    \ Node.js 特有的内容。随书附的代码下载包含一个 `web-app` 目录，其中包含了本章的所有代码以及更多。如果你还没有获取，我鼓励你去下载一下，因为我们不会涵盖其中所有的内容。\n\
    \n应用程序 `b4` 构建在上一章开发的 Web 服务之上。这意味着你需要运行 CouchDB，以及来自第 65 页第 5 章“访问数据库”（Access\
    \ Databases）中的数据。\n\n一旦你准备好了这些前提条件，让我们开始吧！\n\n## 在 Redis 中存储 Express 会话\n\n每当你有一个面向用户的\
    \ Web 应用时，你几乎总是会会话。会话是附加到特定用户的数据。当用户浏览网站上的页面或使用 Web 应用时，服务器通过会话 cookie 跟踪用户。在每次请求中，服务器读取\
    \ cookie，检索会话数据，然后在生成响应时使用它。\n\n让我们看看如何在 Express 中启用会话，以及如何使用 Redis 存储会话数据。\n\n\
    ## 在 Express 中启用会话\n\n要启用会话，向你的应用添加 `cookieParser` 和 `session` 中间件：\n\n```\napp.use(express.cookieParser());\n\
    app.use(express.session({secret: 'unguessable'}));\n```\n\n`cookieParser` 中间件负责解析来自客户端的\
    \ cookie，`session` 中间件存储附加到 cookie 的会话数据。`secret` 参数对于防止 cookie 篡改和伪造——将其设置为你应用程序唯一的字符串。Express\
    \ 会话 cookie 使用此密钥字符串进行签名。\n\n## 使用 Redis 存储会话数据\n\nRedis 是一个极其快速的键值存储，具有可调的持久性。这意味着你可以保持它的快速，但面临着服务器崩溃时丢失数据的风险；或者你可以牺牲一些速度来获得更大的持久性保证。\n\
    \n默认情况下，Redis 将数据保留在内存中，然后定期将其写入磁盘。这使其速度极快，但也容易发生故障；因为进程崩溃意味着数据丢失。\n\n它的速度使得 Redis\
    \ 成为存储会话数据的理想数据库。如果服务器崩溃，会话可能会丢失，但最坏的情况下这意味着你的用户必须重新登录。\n\n要在你的 Node/Express 应用中使用\
    \ Redis，你首先必须安装它。Redis 的安装方法因平台而异，但一旦安装完成，启动它只需要一个命令：\n\n```\n$ redis-server\n\
    ```\n\n```\n[8344] 10 Sep 20:38:41.564 # Server started, Redis version 2.6.13\n\
    ```\n\n在 Express 中使用 Redis 需要几个 npm 模块：`redis` 和 `connect-redis`。运行 `npm install\
    \ --save` 来获取它们并将它们添加到你的 `package.json` 中。\n\n为了作为一个实验，让我们修改上一章“Hello World”应用的\
    \ `server.js` 文件，使用 Redis 进行会话存储。打开 `server.js` 文件，并在顶部的变量声明处添加以下内容：\n\n```\n\
    web-app/hello/server.js\nredisClient = require('redis').createClient(),\nRedisStore\
    \ = require('connect-redis')(express),\n```\n\n第一行连接到 Redis 数据库的客户端。这会立即向你的 Redis\
    \ 服务器打开一个 TCP 套接字。第二行产生一个类，你可以用它实例化基于 Redis 的会话后端存储。\n\n最后，在 `server.js` 文件的中间件部分，如下所示配合\
    \ Redis 使用 cookie 和 session 中间件：\n\n```\nweb-app/hello/server.js\napp.use(express.cookieParser());\n\
    app.use(express.session({\n  secret: 'unguessable',\n  store: new RedisStore({\n\
    \    client: redisClient\n  })\n}));\n```\n\n```\napp.get('/api/:name', function(req,\
    \ res) {\n  res.json(200, { \"hello\": req.params.name });\n});\n\napp.listen(3000,\
    \ function() {\n  console.log(\"Server is now running.\");\n});\n```\n\n完成这些更改后，启动服务器：\n\
    \n```\n$ node server.js\n```\n\n要测试它，可以使用 `curl` 请求 API：\n\n```bash\n$ curl -i\
    \ http://localhost:3000/api/John\n```\n\n你应该看到像这样的响应：\n\n```\nHTTP/1.1 200 OK\n\
    X-Powered-By: Express\nContent-Type: application/json; charset=utf-8\nContent-Length:\
    \ 15\nDate: Fri, 27 Sep 2023 12:03:52 GMT\nConnection: keep-alive\n\n{\"hello\"\
    :\"John\"}\n```\n\n## 创建单页应用\n\n单页应用由 HTML 页面、用于样式的 CSS 以及执行逻辑的 JavaScript 组成。这些都可以作为静态文件交付，不需要处理。\n\
    \n## 使用 Express 提供静态内容\n\nExpress 提供了一种提供静态文件的方便方法。你只需要使用 `static` 中间件并提供一个目录。例如，这些行出现在\
    \ `b4` 中：\n\n```javascript\nweb-app/b4/server.js\napp.use(express.static(__dirname\
    \ + '/static/'));\napp.use(express.static(__dirname + '/bower_components/'));\n\
    ```\n\n这两行告诉 Express 从项目的 `static/` 和 `bower_components/` 目录提供静态内容。这意味着如果 Express\
    \ 找不到特定的路由，它将回到静态内容，依次检查这些目录。\n\n静态中间件在这方面是特殊的。通常情况下，中间件在请求处理的中间起作用，但静态中间件将其影响添加到链的末尾（甚至在路由处理程序之后）。\n\
    \n例如，项目的 `static/` 目录包含三个文件：`index.html`、`app.css` 和 `app.js`。它们分别包含 `b4` 应用的\
    \ HTML、CSS 和客户端 JavaScript。\n\n服务器运行时，当你请求 `http://localhost:3000/index.html`\
    \ 时，Express 将提供 `static/index.html`，因为我们没有为它设置式路由。\n\n## 安装 Bower 组件\n\nBower\
    \ 是前端代码（如 JavaScript 库）的包管理器。你以安装 npm 模块的方式安装 Bower 组件。\n\n这是 `b4` 应用的 `bower.json`\
    \ 文件：\n\n```json\nweb-app/b4/bower.json\n{\n  \"name\": \"b4\",\n  \"version\"\
    : \"0.0.1\",\n  \"dependencies\": {\n    \"jquery\": \"~2.0.3\",\n    \"bootstrap\"\
    : \"~3.0.0\",\n    \"typeahead.js\": \"~0.9.3\",\n    \"typeahead.bootstrap.css\"\
    : \"*\",\n    \"handlebars\": \"~1.0.0\"\n  }\n}\n```\n\n"
