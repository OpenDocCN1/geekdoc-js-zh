  - "[PAGE 32]\n\n# Reading and Writing Files Asynchronously\n\nEarlier in this chapter,\
    \ we wrote a series of Node programs that could watch files for changes. Now let's\
    \ explore Node's methods for reading and writing files. Along the way we'll see\
    \ two common error-handling patterns in Node: error events on EventEmitters and\
    \ err callback arguments.\n\nThere are a few different approaches to reading and\
    \ writing files in Node. The simplest way is to read or write the entire file\
    \ at once. This technique works well for small files. Other approaches read and\
