    \ to the file.\n- It executes the callback function when the change is detected.\n\
    - It determines that the program still has not finished, and resumes waiting.\n\
    \nNode.js programs go through these steps; the event loop spins until either there's\
    \ nothing left to do or the program exits by some other means. For example, if\
    \ an exception is thrown and not caught, the process will exit. We'll see how\
    \ this works next.\n\n## Reading Command-Line Arguments\n\nNow let's make our\
