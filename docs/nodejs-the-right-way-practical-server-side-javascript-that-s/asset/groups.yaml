    Chapter 4. Robust Messaging Services • 62


    Whenever your Node program opens a file or a TCP connection, it uses one of its
    available file descriptors. When there are none left, Node will start failing
    to connect to resources when asked. This is an extremely common problem for Node.js
    developers. I have yet to meet a Node developer who hasn''t struggled with the
    limited-resource problem at one time or another.


    Strictly speaking, this problem isn''t limited to the PUSH/PULL scenario, but
    it''s very likely to happen there, and here''s why. Since Node.js is asynchronous,
    the puller process can start working on many jobs simultaneously. Every time a
    message event comes in, the Node process invokes the handler and starts working
    on the job. If these jobs require accessing system resources—and they almost certainly
    will—likely to exhaust the pool of available file descriptors. Then jobs will
    quickly start failing.


    We''ll explore this topic and its solutions in more detail in Chapter 5, Accessing
    Databases, on page 65, when we limit the number of concurrent database connections
    through a technique called connection pooling.


    # Wrapping Up


    This chapter brought us out of the Node.js core and into the larger world of npm.
    We discussed how to install and use third-party modules with binary components.
    In particular, we covered how to use ØMQ.


    ØMQ supports a number of message-passing patterns; we got to know several of them.
    We saw how ØMQ does the publish/subscribe pattern, the request/reply pattern,
    and the PUSH/PULL pattern. These patterns are now at your disposal for designing
    networked applications Node.js, even if you choose not to use the ØMQ library
    itself.


    We also explored Node''s clustering capabilities. Using features of Node''s cluster
    module, we spin up a number of worker processes and distributed requests to them.
    We''ll use these capabilities again in Chapter 6, Scalable Web Services, on page
    87.


    The following bonus questions ask you to modify and create new Node.js and ØMQ
    programs using what you learned from the chapter.


    In the next chapter, we''ll cover how to use Node to interact asynchronously with
    several popular databases.


    # Error Handling


    The zmq-filer-rep.js program we created uses fs.readFile() to serve file contents.
    However, it doesn''t handle the error case.'
