    # Acknowledgments


    This was a surprisingly difficult book to write, and I couldn''t have done it
    without a lot of help. I''m especially thankful for my editor, Jackie Carter—your
    thoughtful feedback made this book what it is today. I also sincerely like to
    thank the whole team at Pragmatic Bookshelf for your kind patience while I figured
    out how to write this book. And thanks to the entire team, who worked so hard
    to polish this book and find all of my mistakes. I would like to thank all my
    reviewers. Your keen observations have helped make this book even more technically
    correct (the best kind of correct). In no particular I want to thank my wonderful
    family, too. Ruth, you are my inspiration; with your perseverance, I can achieve
    anything. Emma and Jimmy, even though you''re growing up fast, I can''t wait to
    see all the great things you''ll do. For anyone I missed, I hope you''ll accept
    my apologies. Any omissions certainly not intentional.


    # Preface


    Two big shifts are happening right now in the practice of writing software, and
    Node.js is at the forefront of both.


    First, JavaScript is becoming increasingly asynchronous. Whether you''re waiting
    for a Big Data job, interacting with end users, or simply responding to an API
    call, you''ll need asynchronous programming techniques.


    Second, JavaScript has quietly become the world''s standard virtual machine—in
    web browsers, modern NoSQL databases, and now on the server as well. Node.js is
    right at the intersection of these trends, and it''s ready to take off in a big
    way.


    # Why Node.js is the Right Way


    In March of 2010, I gave a lightning talk titled "Full-Stack JavaScript" at the
    NoSQL Boston conference. Back then, and even more so now, I knew that using JavaScript
    for every layer of the application stack was not only possible, but a great way
    to reduce software complexity. The Right Way in this book''s title refers to both
    the process of learning Node and the practice of writing Node.


    # Learning Node.js


    As for growing technology, there are lots of resources available for learning
    Node.js. Many are intently focused on serving up web resources. The web is great,
    but it''s not enough, and it''s not the whole story of Node.


    Ruby is more than Rails, and Python is more than Django. Node.js is more than
    serving web content, and this book treats it that way. Node.js the Right Way teaches
    you the core concepts you''ll need to be an effective Node.js programmer, no matter
    what kinds of programs you need to write.


    # Writing Node.js


    One thing I love about JavaScript is that there are seven ways to do anything.
    There''s breathing room, where developers can explore and experiment and find
    better approaches to everything. The community of Node developers, conventions
    in Node.js development, and even the semantics of the JavaScript language itself
    are all rapidly evolving. With eyes to the future, code examples and recommendations
    in this book reflect current best practices and standards.


    # What''s in This Book


    This book is for developers who want to learn how to write asynchronous JavaScript
    for the server using Node.js. Some prior JavaScript experience will help, but
    you don''t have to be an expert. Chapter 1, Getting Started, on page 1, introduces
    the Node.js event loop, explaining how powers are highly parallel and single-threaded
    at the same time. This chapter also outlines the five aspects of Node.js development
    that each frame subsequent chapter and has some brief instructions on getting
    Node installed on your machine. The remaining chapters each deal with a specific
    programming area.


    # Wrangling the File System


    In Chapter 2, Wrangling the File System, on page 9, we''ll get our first look
    at writing Node.js programs. If you''ve done any server-side programming in the
    past, you''ve had to access a file system along the way. We''ll start in this
    familiar domain, using Node''s file-system tools to create asynchronous, nonblocking
    file utilities.

