    \ watcher.js will output the string 'target.txt just changed!', and then the program\
    \ will go back to waiting.\n\n## Visualizing the Event Loop\n\nThe program we\
    \ wrote in the last section is a good example of the Node event loop at work.\
    \ Recall the event-loop figure from *Node Applications Work*, on page 3. Our simple\
    \ file-watcher program causes Node to go through each of these steps, one by one.\n\
    \nTo run the program, Node does the following:\n\n- It loads the script, running\
    \ all the way through to the last line, produces the *Now watching* message in\
    \ the console.\n- It sees that there's more to do, because of the call to watch().\n\
