  - "[PAGE 25]\n\n# Programming for the Node.js Event Loop\n\nLet's get started by\
    \ developing a couple of simple programs that watch files for changes and read\
    \ arguments from the command line. Even though they're short, these applications\
    \ offer insights into Node's event-based architecture.\n\n# Watching a File for\
    \ Changes\n\nWatching files for changes is a convenient problem to start with\
    \ because it demands asynchronous coding while demonstrating important Node concepts.\
    \ Taking action whenever a file changes is just plain useful in a number of cases,\
    \ from automated deployments to running unit tests.\n\nOpen a terminal to begin.\
    \ On the command line, navigate to an empty directory. You'll use this directory\
    \ for all of the code examples in this chapter. Once there, use the touch command\
    \ to create a file called target.txt\n\n```\n$ touch target.txt\n```\n\nThis file\
    \ will be the target for our watcher program. Now open your file editor and enter\
    \ the following:\n\n```\nfile-system.js\nconst fs = require('fs');\nfs.watch('target.txt',\
    \ function() {\n  console.log(\"File target.txt just changed!\");\n});\nconsole.log(\"\
    Now watching target.txt for changes...\");\n```\n\nSave this file as watcher.js\
    \ in the same directory as target.txt. Let's see how this program works.\n\nFirst,\
    \ notice the const keyword at the top. This JavaScript (part of ECMAScript Harmony)\
    \ sets up a variable with a constant value. The require() function pulls in a\
    \ module and returns it. In our case, we're calling require('fs') to incorporate\
    \ Node's built-in file-system module.¹\n\nIn Node.js, a module is a self-contained\
    \ bit of JavaScript that provides functionality to be used elsewhere. The output\
    \ of require() is usually a plain old JavaScript object. There's nothing particularly\
    \ special about it, aside from the functionality provided by the module.\n\nNode's\
    \ module implementation is based on the CommonJS module specification.² Modules\
    \ can depend on other modules, like libraries in other\n\n+   1. http://nodejs.org/api/fs.html\n\
    2. http://wiki.creativecommons.org/wiki/Modules/1.1"
