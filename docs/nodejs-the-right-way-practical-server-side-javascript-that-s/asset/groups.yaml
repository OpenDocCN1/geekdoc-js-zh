    \ 的直接变化。为了做到这一点，我们监听 `window` 上的 `hashchange` 事件：\n\n```javascript\nweb-app/b4/static/app.js\n\
    $(window).on('hashchange', function(event) {\n  var view = (window.location.hash\
    \ || '').replace(/^#, '');\n  if ('#' + view + '-view').length) {\n    showView(view);\n\
    \  }\n});\n```\n\n这段代码首先获取 `window.location.hash` 并将其保存在名为 `view` 的变量中。`var` 是一个旧的\
    \ JavaScript 关键字。它和 `let` 相似，但它的作用域是最近的函数 `function() {}`，而不是最近的一对大括号 `{}`。\n\n\
