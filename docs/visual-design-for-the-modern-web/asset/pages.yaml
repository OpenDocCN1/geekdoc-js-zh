    # VIGOROUS WRITING


    > Vigorous writing is concise. A sentence should contain no unnecessary words,
    a paragraph unnecessary essays, for the reason that a drawing should have no unnecessary
    lines and a machine no unnecessary parts.” —From Strunk and White’s Elements of
    Style.'
