  md: '# CHAPTER FIVE


    # Color


    FROM COLOR HARMONY FOR THE WEB, BY CAILYN BOYLE:


    > “The relation of color to mood is so ingrained that it is like a trigger response.”


    FROM COLOR: THE BEST WORK FROM THE WEB, BY JEFF CARLSON, TOBY MALINA, AND GLENN
    FLEISHMAN.


    > “The challenge for all designers is to make each color count, whether you’re
    drawing from a deep pool or a paint-by-numbers scheme.”


    No one can deny that color “colors” how we react to what we see. Color schemes
    evoke moods; they can be playful or sophisticated, cold or warm, chic or dingy,
    energetic or calm, gloomy or sparkling, elegant or childish, earthy or romantic,
    professional or campy, fiery or ominous. Color choices define a web site at a
    glance. Consequently, color can be a web designer’s most persuasive and powerful
    tool.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# QUIPS AND QUOTES


    Color has been used as a communication tool for centuries. In the print world,
    color has been, of course, an inestimable and abundant benefit, but also, unfortunately,
    expensive and (once printed) inflexible. Thus, web color has a distinct advantage
    over printed color, because web color is completely free. Additionally, web designers
    can modify color schemes easily and also, without concern, for costs.


    “IBM will forever be known as the Blue: trustworthy and dependable. Coke is red:
    energy and exuberance. The colors not only identify, they idealize.”— *From Pantone
    Guide to Communicating with Color*, by Leatrice Eiseman.


    Still, using web color can be challenging. The mood evoked by a color scheme is
    influenced by:


    +   - Commonly accepted psychological effects. For example, yellow is universally
    viewed as a happy color, while red is considered to be energizing.


    +   - Individual tastes, based on complex emotional responses, not logic. For
    instance, some people feel black is depressing, which others view it as dramatic.


    +   - Age. Children and teenagers often have very different tastes than their
    elders.


    +   - Gender. As a woman, and men often prefer very different colors.


    +   - Culture: Different cultures from around the world often have very different
    color aesthetics and societal contexts more associated with particular colors.


    Another problem is that web color, though free, can have some limitation. If as
    a child you were content with a box of ten Cray crayons, you won''t have a problem
    with these constraints. If you felt severely restricted with a gigantic box of
    512 crayons, you might find that the colors you crave not be easily available,
    especially if you are restricted by the colors available on older computer systems.
    Creating a color scheme with a limited palette can be intimidating or frustrating,
    for experienced designers (more about this limited later in the chapter).


    Note: Computer screens and the print present colors in completely different ways,
    so the examples in this book will not look exactly as they would on a computer
    screen.


    # PRIMARY COLORS FOR PRINTING PRESSES


    Printing presses use yellow, magenta, and cyan as their primary colors, a change
    that is necessitated by the inherent transparency of printing inks. Despite the
    slight differences in the base colors, the general concepts discussed in this
    chapter still apply.


    # Color Theory


    We must first understand centuries of traditional color theory before we can understand
    how to translate that knowledge to color manipulation on newfangled device, the
    computer screen.


    # The Color Wheel


    A color wheel graphically represents the relationships between colors. The three
    major spokes of the traditional color wheel are the primary colors: red, yellow,
    and blue, as shown in FIGURE 5.1. Any color of the rainbow can be created by mixing
    some combination of the three primary colors black and white.'
  merge: -1
  pgno: 186
