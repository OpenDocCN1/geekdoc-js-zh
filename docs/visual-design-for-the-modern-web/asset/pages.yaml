  md: 'The main advantage of providing internal anchors is visitors can bypass content
    that doesn''t interest them, making them more likely to stick around for content
    that does. One use of an internal anchor is to provide a link at the bottom of
    a long page, quickly returning visitors to the top of the page.


    # External Hyperlinks


    External hyperlinks take the visitor outbound to sites that don''t belong to us,
    outside of our control. With selective use of external links, we can leverage
    content produced by others, as long as content supports our goals.


    HTML REVIEW: EXTERNAL HYPERLINKS


    External link text:


    ```

    <a href="http://www.yahoo.com" target="_blank">Yahoo!</a>

    ```


    External link image:


    ```

    <a href="http://www.yahoo.com" target="_blank">

    <img src="images/yahoologo.jpg" height="100" width="130"

    border="0" alt="go to Yahoo" />


    ```


    > Note that we must include the "http://" at the beginning of any external address,
    or the browser assumes we are looking for a page within our own site.


    We have to be careful with external links, however. We don''t want visitors to
    be so enamored of the external site that they return to our own. What, then, are
    the alternatives?


    +   - Avoid external links entirely, an option that is often counterproductive.


    +   - Employ frames, leaving your identification and navigation persistently in
    view one or more frames and opening the external page in a separate frame. Unfortunately,
    the use of frames is controversial; see the frames discussion later in this chapter.


    +   - Open each external link in a new window, so that your site is waiting patiently
    in the original window when the visitor closes the window. Opening new windows
    is also a controversial alternative, though they violate accessibility rules (see
    the accessibility discussion near the end of the chapter). New and unrequested
    windows also rud clutter the visitor''s screen. Even so, visitors don''t want
    to lose where they were in—for many of them, an unrequested window might be a
    fair tradeoff for not getting lost.'
