  md: '# Choose a composition center.


    Just as symmetrical balance can be boring, so can be a composition center (area
    of focus) that is dead-center in the middle of a page. Think of professional landscape
    photos; only rarely the horizon line up across the exact horizontal center, because
    a centered horizon is not exciting. Instead, photographers normally position the
    horizon either one third or two thirds of the way down on the photo. That is,
    follow the rule of thirds by dividing the page horizontally and vertically, and
    use one or more of the intersection points as the focus of interest.


    FIGURE 4.24 shows image-division by the rule of thirds, with sweet spots (intersecting
    points) indicated by superimposed dots.


    FIGURE 4.24 Composition Center (Diagrams courtesy of Jeff Cernauske, “A SimpleSunrise,”
    www.csszengarden.com/7cssfile=158/158.css, by Rob Soule)


    ![](img/ee113e5612d290709e494a0dae247fc5_173_0.png)


    A fairly lackluster composition.


    The major areas of emphasis are near the sweet spots, this composition seems more
    dynamic and more professional.


    ![](img/ee113e5612d290709e494a0dae247fc5_173_1.png)


    The off-center CSS Zen Garden area superimposed on the sunset draws our eye first.'
