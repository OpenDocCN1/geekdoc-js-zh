  md: "**CHAPTER EIGHT** Forms\n\n**311**\n\nMultiple-selection List Boxes\n\nIf the\
    \ multiple attribute is included in a <select> tag, whether drop-down or scrollable,\
    \ \n\nthe visitor can choose multiple elements from the list, as shown in **FIGURE\
    \ 8.9**. The only \n\nchange from the HTML in the previous example is highlighted\
    \ in this <select> tag:\n\n<select name=”hobbies” id=”hobbies” size=”5” multiple\\\
    >\n\n![](img/ee113e5612d290709e494a0dae247fc5_319_0.png)\n\n A COMMON “GOTCHA!”:\
    \ **MULTIPLE** AND **SIZE=”1”**\n\n**The combination of **size=”1”** and the **multiple**\
    \ attribute, like this:**\n\n<select name=”hobbies” id=”hobbies” size=”1” multiple>\
    \ \n\n**changes the behavior of the **<select>** tag. Instead of displaying a\
    \ drop-down list **\n\n**of all of the attributes, as it normally would if size=\"\
    1\", the list is scrollable with **\n\n**only a single item showing at a time,\
    \ as in ****FIGURE 8.10****. Because seeing only a single **\n\n**item at a time\
    \ is claustrophobic to visitors, it’s usually better to specify a size of at **\n\
    \n**least three or four items. **\n\n![](img/ee113e5612d290709e494a0dae247fc5_319_1.png)\n\
    \n**FIGURE 8.9 **Multiple-\n\nselection List Box\n\n**FIGURE 8.9 **Multiple-\n\
    \nselection List Box\n\n**FIGURE 8.10 **A Lonely \n\nMultiple-selection List Box,\
    \ \n\nsize=”1”\n\n**FIGURE 8.10 **A Lonely \n\nMultiple-selection List Box, \n\
    \nsize=”1”"
