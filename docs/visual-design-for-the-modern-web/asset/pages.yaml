    \ ubi \n\npeccat. Si veteres \n\nita miratur \n\nlaudatque poetas, \n\nut nihil\
    \ anteferat, \n\nnihil illis \n\nRight\n\nJustified\n\nInterdum volgus \n\nvidet,\
    \ est ubi \n\npeccat. Si veteres \n\nita miratur \n\nlaudatque poetas, \n\nut\
