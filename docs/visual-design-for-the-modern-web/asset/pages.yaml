  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**306**\n\nSometimes, an early choice in\
    \ the process may determine the options that are, or \n\nare not, available later\
    \ in the process. These secondary options are called *dependent *\n\n*choices*\
    \ (also called* ﬁ ltered choices*). For instance, perhaps we offer cheaper shipping\
    \ \n\nrates and one-day shipping only to those locations east of the Mississippi\
    \ River. If \n\na customer chooses “west of the Mississippi” instead, then one-day\
    \ shipping isn’t \n\noffered as an option in the selection that follows, as shown\
    \ in **FIGURE 8.2**. \n\n![](img/ee113e5612d290709e494a0dae247fc5_314_0.png)\n\
    \n**Choices Based on “East of the Mississippi”**\n\n![](img/ee113e5612d290709e494a0dae247fc5_314_1.png)\n\
    \n**Choices Based on “West of the Mississippi”**\n\nEssentially, if a visitor\
    \ isn’t allowed to choose an option, you should remove it; \n\ninstead, ﬁ lter\
    \ out any options that become irrelevant because of earlier choices. \n\nBecause\
    \ ﬁ ltering dependent choices on the same page as the initial choices can \n\n\
    involve some rather tricky programming, it’s often easier to put the dependent\
    \ \n\nchoices on subsequent pages, as we’ll see in a bit when we look at wizards.\n\
    \nWe’ll look at each of the three predeﬁ ned choice controls before moving on\
    \ to the \n\nnext general category of controls, text controls.\n\nRadio Buttons\n\
    \n*Radio buttons* (or *option buttons* in Microsoft terminology) are used in single-choice\
    \ \n\nsituations; that is, only one choice is allowed from a grouping of related\
    \ alternatives. \n\n(Think “Choose one of the following options.”) **FIGURE 8.3**\
    \ shows a radio button \n\ngroup for choosing a year in school. Radio buttons\
    \ are circular, whereas HTML \n\ncheckboxes (coming up soon) are square.\n\n![](img/ee113e5612d290709e494a0dae247fc5_314_2.png)\n\
    \n**FIGURE 8.2 **Dependent/\n\nFiltered Choices\n\n**FIGURE 8.2 **Dependent/\n\
    \nFiltered Choices\n\n**FIGURE 8.3 **Radio Button \n\nGroup\n\n**FIGURE 8.3 **Radio\
    \ Button \n\nGroup"
  merge: -1
  pgno: 314
- img_proc: true
  md: "**CHAPTER EIGHT** Forms** 307**\n\n HTML FOR RADIO BUTTONS\n\n**Here is the\
    \ HTML for the radio buttons in Figure 8.3.**\n\n<form name=”inputForm”>\n\n \n\
    \nYear in school?<br />\n\n \n\n<input name=”yearInSchool” type=”radio” value=”freshman”\
    \ checked />\n\n \n\n \n\nfreshman<br />\n\n \n\n<input name=”yearinschool” type=”radio”\
    \ value=”sophomore” />\n\n \n\n \n\nsophomore<br />\n\n \n\n<input name=”yearInSchool”\
    \ type=”radio” value=”junior” />\n\n \n\n \n\njunior<br />\n\n \n\n<input name=”yearInSchool”\
    \ type=”radio” value=”senior” />\n\n \n\n \n\nsenior<br />\n\n</form>\n\nIt’s\
    \ particularly important to chunk radio buttons visually somehow, so that it’s\
    \ clear \n\nwhich elements are grouped. As **FIGURE 8.4** shows, Dell accomplishes\
    \ this by using \n\na prominent header line between radio button groups. Another\
    \ method would be \n\nto use the <ﬁ eldset> tag that we examined in Chapter 4.\
    \ At the very least, provide \n\nextra white space around a radio group. \n\n\
    ![](img/ee113e5612d290709e494a0dae247fc5_315_0.png)\n\n**FIGURE 8.4 **Text labels\
    \ for \n\na group of radio buttons can \n\nappear to either the right or \n\n\
    the left of the buttons, as \n\nlong as they’re consistent and \n\nthe buttons\
    \ align vertically. \n\n(www.dell.com ©2007 Dell \n\nInc. All Rights Reserved.)\n\
    \n**FIGURE 8.4 **Text labels for \n\na group of radio buttons can \n\nappear to\
    \ either the right or \n\nthe left of the buttons, as \n\nlong as they’re consistent\
    \ and \n\nthe buttons align vertically. \n\n(www.dell.com ©2007 Dell \n\nInc.\
    \ All Rights Reserved.)"
