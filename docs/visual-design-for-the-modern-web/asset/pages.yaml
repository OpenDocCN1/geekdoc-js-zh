  md: 'multiple words for description. Contrast the level of sophistication of easily
    identified colors like "red" or "orange" with colors like "mauve," "salmon," "celadon,"
    or "grayish-green with a blue undertone.


    Different cultures have have different symbolism and associations for colors,
    and sometimes it''s important for those of us who tend to be occidentocentric
    to be reminded of that. The classic example is that white portrays purity and
    the celebration of a wedding in Western culture, symbolic of death in some Eastern
    cultures. Green and yellow from Eastern cultures seem to prefer brighter colors
    in different schemes than in traditional Western art. And many Russian citizens
    today may have negative associations with the color red, symbolic of Communism.
    Entire books are devoted to color symbolism around the world; if you are designing
    a web site for a culture outside of yours, the best bet is to research that particular
    culture thoroughly. Even then, test the site with people native to the culture
    before releasing the site to the general public.


    After deciding upon the ambiance you want to portray, you need to consider the
    actual colors that best portray it. Simple schemes are the easiest color combinations
    for beginners to use, so most of the time, you should limit your color scheme
    to variations of one, two, or at most three colors. Although we have all seen
    gorgeous web sites employing many colors than that, it takes a master''s hand
    to pull off a large number of colors. More often, pages with myriad colors look
    disjointed, amateurish, and chaotic.


    Remember the two houses we looked at in back in Chapter 4, one with bad layout,
    one with a classic layout? FIGURE 5.32 revisits the classic house, this time showing
    every element in a different color. Again, this is not a house most people would
    be willing to buy because it looks chaotic. In the same vein, a web page on which
    every element is a different color also looks chaotic.


    FIGURE 5.32 House of Many Colors


    ![](img/ee113e5612d290709e494a0dae247fc5_215_0.png)'
