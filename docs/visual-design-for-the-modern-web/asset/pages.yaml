    # RGB Color Codes


    RGB colors are represented by a six-digit hexadecimal (base 16, "hex" for short)
    code. The sidebars review both hexadecimal numbers and HTML color codes. Each
    of the three pairs of hex digits can have a maximum value of FF. The number, the
    more of that particular hue is in the color, and therefore the saturation of color.
    Thus, #FF0000 is a red of maximum saturation and #870000 is a less saturated red.
    #FFFFFF is pure white (because white is the combination of all colors) and #000000
    is black (because, on a computer monitor, black is the absence of color). FIGURE
    5.12 presents a few sample colors and their RGB codes. Note that the hex pair
    with the highest value is the dominant hue of the displayed color. For example,
    red is the dominant color of #F23846 (red="F2", green="38", and blue="46") because
    "F2" is a higher number than "38" or "46".'
