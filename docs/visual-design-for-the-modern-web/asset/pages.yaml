- img_proc: true
  md: '# CHAPTER TWO Site Analytics 57


    its inventory of automobiles (because "wheels" is a slang term for auto), or is
    it referring to actual specialty wheels that can be ordered for any automobile?
    If the visitor has to pause for even a moment to figure out the navigation or
    has even a slight possibility of guessing the first time, the labeling system
    has failed. In a choice between clever and clear, you should always choose clear.


    After you have identified your preferred labels, test them with potential visitors;
    tell them what you think the labels mean, just by reading them. There should be
    strong concurrence between what the visitors think the labels mean and what you
    intended them to mean. If not, the disconnect needs to be fixed.


    Most web site visitors are unwilling to read in depth when they are online. Instead,
    they scan labels—navigation labels, heading labels, subheading labels—for any
    content that interests them. We need clear, identifying, and relevant labels if
    we want to engage our users. The point is that labels, with the site architecture,
    help visitors find what they need, not erect roadblocks.


    # Categorizing Topics


    Information architecture in general is concerned with grouping and organizing
    labels into a taxonomy—a hierarchical and cohesive vocabulary of categories and
    subcategories. The topics belong together, and any attempt to break them apart
    into different categories would only modify the hierarchy structure. Categorizing,
    the first step in creating a logical and intuitive hierarchical navigation system,
    is all about finding patterns and relationships. The information we gather here
    is metadata—data about data. We are determining what data we have and how it''s
    related in an overall scheme.


    Choosing appropriate categories is, to some extent, plain common sense. Still,
    categories aren''t always obvious. "miscellaneous stuff." Labels might belong
    under multiple categories. And some categories are so large they beg to be broken
    down into subcategories and sub-subcategories. Such categorization is both a science
    and an art.


    Many designers find it helpful to put all possible labels on index cards and then
    perform a card-sorting exercise to group them by category. It can even helpful
    to ask two or more designers to sort the cards independently to compare the similarities
    and differences in their groupings.


    Some possible types of category groupings, as well as examples, are shown in TABLE
    2.1.'
