  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**300**\n\nText and Accessibility\n\nAccessibility\
    \ has been addressed throughout the chapter, so only a recap should be \n\nneeded\
    \ here:\n\n■ Use relative text sizing on body copy (ems and percents), so as not\
    \ to override \n\nthe text-size settings that visitors have speciﬁ ed in their\
    \ browsers. (Note that \n\nnewer browsers permit the visitor to override any web\
    \ site font-size settings, \n\nincluding absolute sizes.)\n\n■ Make sure that\
    \ foreground text contrasts in value (the degree of lightness or \n\ndarkness\
    \ of a color) with the background so that the text is legible even to \n\npeople\
    \ who are color blind. \n\n■ Employ HTML’s header tags (<h1>, <h2>, etc.) to provide\
    \ the visually impaired \n\nwith an outline of the hierarchical structure of a\
    \ page. \n\n■ Include alt attributes on all images, including graphic text images.\
    \ This is the \n\nsingle most important way to make image content accessible to\
    \ the visually \n\nimpaired. If the image is decorative only, with no meaning\
    \ attached, use the \n\nempty alt tag (alt=””) to avoid the delay of a screen\
    \ reader speaking a mean-\n\ningless description.\n\nSummary\n\nNicely done typography\
    \ is usually transparent—that is, if it is a legible typeface in \n\nan appropriate\
    \ size and color for the background upon which it rests, the reader \n\ndoesn’t\
    \ even notice it. Nonetheless, typography inﬂ uences whether or not view-\n\n\
    ers read the content, as well as having a subtle effect on how they perceive your\
    \ \n\nsite. Choosing appropriate typefaces and controlling their presentation\
    \ is critical to \n\nconveying your message. \n\nThe following checklist serves\
    \ two functions: to summarize the major points and \n\n“rules” presented in the\
    \ chapter, and to help you ensure you’ve done all you should \n\nbefore ﬁ nalizing\
    \ any web site you are creating. \n\n**HTML Text: Typefaces and Formatting—*****Did\
    \ you:***\n\n■ Use a non-decorative, screen-optimized typeface at a legible size\
    \ for body copy? \n\n■ Use looser leading appropriately for longer lines of text,\
    \ for emphasis, or to \n\nlighten the density of the page?\n\n■ Use wider letter\
    \ and word spacing for emphasis?"
  merge: -1
  pgno: 308
