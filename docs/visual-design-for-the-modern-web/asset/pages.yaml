    # ON BRANDING


    A web site, then, must reflect the branding of its organization or product if
    it is to be memorable. A coherent visual identity consistent with branding would
    allow visitors to guess the name of the organization even if we removed the name
    and logo from all of the pages. A coherent visual identity imparts a "sense of
    place" and, again, makes a site memorable.


    "People go to a search engine when they don''t know; they go to a brand when they
    do." —From Deep Branding on the Internet, by Marc Braunstein and Edward H. Levine.


    Not only does the visual design furnish an impression of the site''s branding,
    it also affects the site''s perceived credibility, as verified by a Stanford University
    study:


    > "The number factor by which people actually judge credibility was by their first
    impression of the visual design... If it doesn''t look credible or it doesn''t
    look like they expect it to be, they go elsewhere. It doesn''t get a second test.
    And it''s not different from other things in life." -BJ. Fogg, Director of the
    Stanford University Pervasive Technology Lab


    Notice that what is being judged is not just the ambiance or mood of a site, but
    its credibility. Today is a dangerous place; identity and web sites that install
    malware (adware, spyware, viruses, and so on) have trained surfers to be cautious
    about the sites they trust. We now know that it''s not a site''s policy, not its
    warranty statements, or how long the site''s been around that builds trust, but
    its visual design. With the visual design carrying such heavy load, we certainly
    cannot give it short shift.


    # Creating a Web Site with Appeal


    Appeal means that visitors enjoy and become engaged in the site. We have already
    established that a web site must be easy to use or users won''t find it appealing.
    But what are the characteristics of the visual design that can make a site appealing?
    Let''s look at aesthetically pleasing, a unique experience, and evocative. Each
    characteristic in turn.


    +   **Aesthetically pleasing.** The site should look "right" for its branding,
    and its audience. It can be fun, professional, or cutting edge, or elegant, or
    futuristic, or grumpy, or friendly, or formal, down-home, or nonnonsense, or flashy,
    or silly, or childlike...you get the idea. All depends on purpose and audience.
    Once a style is named down, every element on every single page should sustain
    that style. It''s worth repeating that visual design isn''t just decoration; it
    colors the visitor''s view of the product, the organization, and the site''s credibility.
    Much of the rest of the book will be devoted to determining how to make a site
    aesthetically appealing.


    +   **A unique experience.** The experience should be unique to the medium. Avoid
    trying merely to duplicate the print medium, because you''re missing an'
