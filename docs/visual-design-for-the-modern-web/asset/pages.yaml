  md: '# Overall Design Hints


    Upcoming chapters will deal with design hints and guidelines, organized by chapter
    topic. Here, though, we need to discuss a few more global hints that aren''t limited
    to specific topics:


    +   **Less is (often) more.** Although designers have difficulty embellishing
    a page enough to make it interesting, most have the opposite: they try to cram
    too much on a page. If you fall into this second category, review your designs
    for elements that can be eliminated or streamlined. In instance, rarely does a
    page look good with 15 different typefaces on it; it begins to look like a random
    note. Keep in mind that simple isn''t always boring—often its modern and elegant


    +   **Maintain a "tickler file" of ideas.** Make not of images, color schemes,
    layout plans, interesting typefaces, and snippets of code that do interesting
    things. Other web sites can generate ideas, of course, but so can magazines, books,
    opening credits of movies, or displays of color-colored bedding and towels in
    a department store or mail-order catalog. Keep your eyes out for inspiration at
    all times.


    +   **Use restraint.** For instance, gratuitous animation is annoying and increases
    down time, perhaps so that visitors become impatient and abandon the site. You
    may also have to use restraint by ditching a clever idea that you absolutely love.
    Sadly, sometimes those clever ideas end up rarely sustaining the purpose of the
    site you are currently working on. In that case, take the idea for now, but stash
    it in your tickler file, and consider it for your next project. (Admittedly, deciding
    to abandon a beloved "pet" idea can be one of the most gut-wrenching decisions
    a web designer has to face)


    +   **Check competing sites.** Don''t pass up the opportunity to learn the experience
    of others. View competing sites as prototypes. Analyze those things that the competitors
    do well, and the things they do poorly. Contemplate how you could avoid merely
    equaling the competing sites, but instead surpass them. Then consider whether
    you want to use a design style very similar to the competing sites (on the theory
    you shouldn''t fix what isn''t broken), or radically (so that your site is memorable).
    Either choice can be a legitimate one, depending on the circumstances.


    +   **Cross-browse.** When browsing in bookstores, frequent the art and design
    section as well as the web development shelves. Some web-related books might seem
    to appear only in the design section—Krause''s Index series (*Layout Index, Color
    Index*, and so on) and Rockport Publishers'' *Color Harmony for the Web* come
    to mind. Of course, non-web related design books can be inspirational, too.'
