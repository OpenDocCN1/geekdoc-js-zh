    \ 1 </option>\n\n \n\n \n\n...\n\n \n\n</select>\n\n<!-- Single Line Text Input\
    \ -->\n\n \n\n<input type=”text” value=”Unstyled text input” size=”21” />\n\n\
    \ \n\n<input type=”text” value=”Styled text input” size=”20” \n\n \n\n \n\nstyle=”background-color:\
    \ #8bbbc1; border: 4px #666666 dotted; \n\n \n\n \n\nfont-family: Papyrus, Times\
    \ New Roman, Times, serif; \n\n \n\n \n\nfont-size: 1.3em; color:#ffffff;” />\n\
    \n<!-- Multi-line Text Input -->\n\n \n\n<textarea cols=”16” rows=”4”>\n\n \n\n\
