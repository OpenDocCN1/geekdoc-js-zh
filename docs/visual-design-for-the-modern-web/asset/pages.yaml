  md: '# CHAPTER THREE Navigation 87


    +   - Text links download quickly, while navigational image files are much larger
    and thereby slower to download. Multiply that download delay by the number of
    unique navigational images, and multiply by two if rollover effects are required,
    and the delay, of course, becomes even more exaggerated.


    +   - Rollover effects can be easily implemented site-wide by simply modifying
    the site-wide CSS.


    +   - Links on text-based menu systems can be added, deleted, and modified easily,
    while some navigational menu systems (notably sliced images and image maps) are
    much more difficult to update.


    +   - Individual links are easy to update. Just the text in the HTML file, and
    FTP file to the server. Navig images as buttons, on the other hand, are more tedious
    to update. An update might involve:


    +   - Opening the graphics program and the image file.


    +   - Making the desired change(s).


    +   - Exporting the image for the rest link.


    +   - Exporting the image for the rollover effect.


    +   - Updating the HTML file (if either the name or the size of the image has
    changed).


    +   - FTPing the image files to the server.


    If there are 50 different buttons on a site, each with unique wording, we''ll
    need to go through this process for 50 different images.


    Because text links have many advantages over navigational graphics, the button
    images that were so popular just a few years ago seem to be much less common these
    days.


    # Text Link Wording


    Much of what we need to know in order to choose the wording for text links was
    discussed in reference to creating labels in the "Site Architecture" topic of
    Chapter 2. Still, we should also remember the following hints:


    +   - Concise, precise, and descriptive. (Yes, this has already been mentioned,
    and yes, it bears repetition.) Ideally, labels should be just a single word, although
    short phrases are sometimes unavoidable.'
