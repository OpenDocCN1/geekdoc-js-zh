    FIGURE 5.28 Mixing Tones by Starting with Gray


    ![](img/ee113e5612d290709e494a0dae247fc5_210_0.png)


    As you have probably already guessed, you can also use a gradient, this blending
    from the original hue to an appropriate value of gray or to the hue''s RGB complementary
    (opposite) color. The top of FIGURE 5.29 shows blending from cyan to gray, while
    the bottom shows blending to cyan''s RGB complement, red. Keep in mind that the
    value of the resulting tone can be controlled by changing the values of both the
    original hue and the complementary hue. For instance, to end up with a lighter
    tone of cyan, choose lighter values of cyan and/or the blending colors of gray
    or red.


    FIGURE 5.29 Mixing Tones with a Gradient


    ![](img/ee113e5612d290709e494a0dae247fc5_210_1.png)


    Once again, you could also mix a tone by overlaying the hue with a semi-transparent
    gray or the hue''s complement.


    One of the more sophisticated trends in web design these uses light-valued tones,
    toned down from the more common pastels. Think of them as a hybrid between tones
    and tints. To produce them, use one of the techniques just described, but start
    with a very pale gray, like the gray furthest to the left in Figure 5.28.'
