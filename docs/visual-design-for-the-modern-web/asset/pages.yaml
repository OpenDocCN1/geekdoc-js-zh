  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**282**\n\nEven so, type has a subliminal\
    \ effect. A typeface might be goofy, serious, breezy, \n\nexotic, saucy, corporate,\
    \ feminine, or formal. A typeface should be visually consis-\n\ntent with the\
    \ ambiance and sensibility of the site. A highly decorative, embellished \n\n\
    typeface would be just as inappropriate on a banking site as a staid, sensible\
    \ type-\n\nface would be on an online fantasy gaming site. \n\nType is much more\
    \ powerful than we realize, so much so that a typeface can become \n\nassociated\
    \ with our site or company. For instance, the custom typefaces used in the \n\n\
    Coca-Cola logo and the Harry Potter movies are instantly recognizable. That can\
    \ \n\nhappen with less obvious typefaces as well. For example, Daniel Will-Harris,\
    \ a lead-\n\ning type authority, argues that we in the United States might well\
    \ have a sublimi-\n\nnal negative association with Helvetica because it’s the\
    \ typeface used on IRS tax \n\nforms. Whether or not this is actually the case,\
    \ it’s clear that choosing appropriate \n\ntypefaces is critical to conveying\
    \ our message. \n\nTypography Basics\n\nBasic typography concepts are pertinent\
    \ whether the medium is the web, printed \n\nmaterials, or a billboard next to\
    \ a superhighway. We will look at those universal con-\n\ncepts before examining\
    \ how to apply them to the web.\n\nBody Copy versus Display Type\n\n*Body copy*\
    \ or *body text* refers to the main content of a communication, that is, the para-\n\
    \ngraph content. *Display type*, also called *display text* or *headline text*,\
    \ refers to text used \n\nfor decoration and/or structure, such as logos, titles,\
    \ headings, and sub-headings. \n\nThe primary focus for body copy is readability—no\
    \ one wants to try to decipher an \n\nentire paragraph of a hard-to-read decorative\
    \ typeface, especially at small sizes. \n\nBody copy should be set in a simple,\
    \ legible, not-too-small typeface. \n\nThe primary focus of display type is to\
    \ embellish or draw attention. Display type ele-\n\nments such as headings typically\
    \ consist of only short phrases set in larger font sizes, \n\nin which case even\
    \ very decorative typefaces can be legible. Accordingly, we have \n\nmuch more\
    \ freedom to use somewhat less readable typefaces for display type.\n\nTypefaces\n\
    \n*Typeface* (or simply *face* for short) refers to a particular design for characters,\
    \ such \n\nas Courier, Times New Roman, Ariel, University, Curly, and so on. A\
    \ *font* is a speciﬁ c \n\nface in a speciﬁ c size and a speciﬁ c style (bold,\
    \ italic, etc.). The Times New Roman \n\ntypeface at 12 pixels in bold is one\
    \ font, while Times New Roman at 14 pixels, bold, is \n\ntechnically a different\
    \ font. Nevertheless, the computer world’s insistence on call-\n\n**OBTAINING\
    \ **\n\n**TYPEFACES**\n\nMany computer appli-\n\ncations such as graphics \n\n\
    editing programs (nota-\n\nbly Corel Draw) include \n\nhundreds of typefaces \n\
    \nat no additional charge. \n\nSee the book’s web \n\nsite for other typeface\
    \ \n\nresources. But be care-\n\nful about download-\n\ning typefaces from \n\n\
    lesser-known sites—it’s \n\npossible for a virus to \n\naccompany a typeface \n\
    \nonto your computer.\n\n**OBTAINING **\n\n**TYPEFACES**\n\nMany computer appli-\n\
    \ncations such as graphics \n\nediting programs (nota-\n\nbly Corel Draw) include\
    \ \n\nhundreds of typefaces \n\nat no additional charge. \n\nSee the book’s web\
    \ \n\nsite for other typeface \n\nresources. But be care-\n\nful about download-\n\
    \ning typefaces from \n\nlesser-known sites—it’s \n\npossible for a virus to \n\
    \naccompany a typeface \n\nonto your computer."
