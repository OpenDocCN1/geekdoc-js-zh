  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**340**\n\n■ Use the value attribute to\
    \ specify a default value if 80% or more of the audi-\n\nence can use the default?\n\
    \n■ Avoid using the value attribute to display instructions for the ﬁ eld?\n\n\
    ■ Use the <textarea> tag for multiple-line text input?\n\n■ Use wrap=”soft”, “hard”,\
    \ or “off” to determine whether carriage returns are \n\nused and whether they’re\
    \ saved with the <textarea> ﬁ eld?\n\n■ Use <textarea> to display informational\
    \ text that needs to scroll?\n\n**Form Submission—*****Did you:***\n\n■ Use the\
    \ appropriate control to submit a form? \n\n■ Avoid telling visitors not to click\
    \ a Submit button twice? \n\n■ Avoid using Reset buttons? \n\n■ If you do use\
    \ a Reset button, verify that the user intended to click it? \n\n■ Position buttons\
    \ in close proximity and visually connected to their form elements? \n\n■ Position\
    \ the safer or more positive action button on the left, and the riskier or \n\n\
    more negative action button on the right, making sure that default focus lands\
    \ \n\non the safer of the two actions? \n\n■ Conﬁ rm risky actions? \n\n■ After\
    \ submission, reassure a visitor with a response page that redisplays the \n\n\
    entered information? \n\n■ Verify completeness and format of all entries as much\
    \ as possible before sub-\n\nmitting the form to the server?\n\n**Visitor Support—*****Did\
    \ you:***\n\n■ Practice defensive design, so that the form is so intuitive and\
    \ easy to use that \n\nlittle additional support is necessary?\n\n■ Try to be\
    \ brief and salient, telling visitors only what they absolutely need to \n\nknow\
    \ to accomplish their tasks?\n\n■ Provide obvious documentation for probabilities,\
    \ not possibilities?\n\n**Instructions—*****Did you:***\n\n■ Provide adequate\
    \ instructions so that separate help is rarely needed?\n\n■ Accurately label each\
    \ form control, and place each in close proximity and visual \n\nconnection to\
    \ the ﬁ elds it explains?"
