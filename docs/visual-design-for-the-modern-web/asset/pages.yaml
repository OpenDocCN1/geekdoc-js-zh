  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**330**\n\n■ **Provide obvious documentation\
    \ for probabilities, not possibilities—**\n\nWhen constructing both instructions\
    \ and Help documents, we need to distin-\n\nguish between probabilities and possibilities.\
    \ A *probability* is something that is \n\n*likely* to happen. Providing obvious\
    \ help and instruction for probabilities, those \n\nthings that happen on a regular\
    \ basis, can be worthwhile. \n\n*Possibilities*, on the other hand, are situations\
    \ that arise infrequently; just because \n\nit’s possible that it might happen\
    \ doesn’t mean there’s much chance it will. For \n\ninstance, it’s possible that\
    \ a visitor might accidentally enter only numbers into a \n\nﬁ rst name ﬁ eld.\
    \ But do we explicitly need a unique error message, just to handle \n\nnumbers\
    \ in the name ﬁ eld? Probably not. Instead, a generic error message such as \n\
    \n“Please enter only alphabetic letters in the ﬁ rst name ﬁ eld” would sufﬁ ce\
    \ for all \n\ntypes of invalid entry.\n\nAlthough as web designers we are quite\
    \ capable of wasting many a sleepless \n\nnight thinking of every contingency,\
    \ we should concentrate on making the prob-\n\nabilities visible, not the possibilities.\
    \ Otherwise, we run the risk of bewildering \n\nvisitors with too much information.\
    \ Although we might still decide to include \n\nsome of those possibilities, they\
    \ should be placed out of the mainstream so that \n\nthe normal visitor isn’t\
    \ forced to stumble over them. \n\nWe’ll now look at the primary elements of visitor\
    \ support: instructions, Help pages, \n\nfeedback, and error handling. \n\nInstructions\n\
    \nInstructions can be as simple as a clue about the format of an input ﬁ eld,\
    \ such as \n\nshowing “MM/DD/YYYY” adjacent to a date ﬁ eld, or as complicated\
    \ as several sen-\n\ntences explaining a single input ﬁ eld. Here, we’ll assume\
    \ that instructions are on the \n\nsame page as the ﬁ elds to which they refer.\n\
    \nInstructions should:\n\n■ Accurately label each form control. (Since we’ve already\
    \ discussed the subtleties \n\nof choosing good labels in the Site Architecture\
    \ section of Chapter 2, we won’t \n\nrehash the topic here.)\n\n■ Be in close\
    \ proximity and visually connected to the ﬁ elds they clarify. For \n\nexample,\
    \ explaining the format of a date control several lines below the control \n\n\
    itself would not be constructive. \n\n■ Be unobtrusive, staying out of a visitor’s\
    \ way when not needed. For instance, \n\nwe shouldn’t automatically pop up a separate\
    \ window with instructions that the \n\nvisitor hasn’t requested. Only the ﬁ rst-time\
    \ visitor reads the message anyway, \n\nand veteran visitors will be annoyed by\
    \ being forced to dismiss (translation: \n\n“close”) the window.\n\n**QUIPS AND\
    \ QUOTES**\n\n“Documentation and \n\nhelp are the last resorts \n\nof a frustrated\
    \ cus-\n\ntomer.” –Douglas K. Van \n\nDuyne, James A. Landay, \n\nand Jason I.\
    \ Hong, *The *\n\n*Design of Sites. *\n\n**QUIPS AND QUOTES**\n\n“Documentation\
    \ and \n\nhelp are the last resorts \n\nof a frustrated cus-\n\ntomer.” –Douglas\
    \ K. Van \n\nDuyne, James A. Landay, \n\nand Jason I. Hong, *The *\n\n*Design\
    \ of Sites. *"
  merge: -1
