    # Define Site Architecture


    We are thrones of an information explosion; we are all susceptible to information
    overload. The challenge today is in collecting information—our world already has
    more information than it knows what to do—rather, it''s making that onslaught
    of information *findable*. The cacophony of data available on the web has enhanced
    and frustrated our ability to find what we need. We''ve Googled a phrase only
    to have thousands of web sites show up on the results pages. How do we sort out
    which pages have value to us, and which don''t? We can, and should, sort out the
    structure of our own web site so that the information it contains findable.


    Information architecture refers to the organization, labeling, and presentation
    of data in any context, from the appearance of a graph in a corporate newsletter,
    to the format of a recipe in a cookbook, to the organization of a card catalog
    in a library. The main tasks of information architecture are categorizing, labeling,
    and organizing fragments of information in such a way that humans can comprehend
    the framework and use it to retrieve the desired fragments. The whole point of
    information architecture is to manage complexity, which means to render it usable
    by making its structure visible.'
