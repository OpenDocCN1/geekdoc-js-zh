  md: '# FYI: HEXADECIMAL NUMBERS


    Human beings normally work with decimal (base 10) numbers, which probably relates
    to the fact that the system was developed as primitive manner carefully counted
    on ten fingers. As a refresher, let''s look at how the base ten system works.


    Take the number 1,234 in base 10, written 1234₁₀. Here''s how this number breaks
    down:


    ```

    1 2 3 4₁₀ =

    4 x 10⁰ = 4 x 1 =

    3 x 10¹ = 30

    2 x 10² = 2 x 100 = 200

    1 x 10³ = 1 x 1000 = 1000

    ```


    1234₁₀


    All numbers work in this way, whether base ten, or two, or base 31; the position
    of a digit dictates the value it actually represents.


    Computers don''t have fingers, but instead two “fingers,” or states for their
    electrical gates: on and off. As a result, binary (base 2) is really the native
    number system for computers. However, binary is difficult for humans to use. Contrast
    our 1234₁₀ with its binary equivalent, 100110100010₂ You see the problem—binary
    numbers need more digit positions to represent any given value, because only two
    digits, 0 and 1, can be used.


    It turns out that binary numbers convert easily to hexadecimal (base 16) numbers,
    because hexadecimal numbers are powers of two—₁₆, being nothing more than 2ⁿ.
    Hexadecimal numbers are represented using the digits 0–9 (which mean exactly what
    you would expect them to mean) as well as the alphabetic characters A–F, using
    the following conversion table:


    ```

    A = 10

    B = 11

    C = 12

    D = 13

    E = 14

    F = 15

    ```'
  merge: -1
