  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 5


    Screen prints of these sites are included on the book''s web site. Of course,
    as we all know, in web time, even a year is a very long time. By the time this
    book is actually print, these sites may have evolved such that they no longer
    exhibit the same characteristics.


    The millions of web surfers who could potentially view our site have a wide variety
    of computer systems, which means we do not have complete control over our web
    sites on a visitor''s system, so bear in mind the axioms:


    +   Colors and fonts display differently in different browsers, on different monitors,
    and on different systems. For example, a hue that looks red on one system might
    look magenta or red on another. We will look at these differences in more depth
    in the Color and Typography chapters.


    +   Elements on the page can''t be guaranteed to display at a particular size,
    because different systems have different resolutions. A font size that looks perfect
    on one system may appear too large on another and too small to read on yet third.
    We will delve these problems in the Page Layout chapter.


    +   Most brand new computers are not displaying at their best or highest settings.
    Manufacturers often configure a new box or two down from their maximum capabilities.
    Worse, many computer owners are unaware that they can change their display properties
    to enhance the view.


    This is just a sampling of why designing a good page is much trickier than designing
    a good printed page, because you simply cannot predict with any accuracy the system
    setup you will have. In effect, WYSIWYG (the computer acronym for "What You See
    Is What You Get") should really be WYSIWYG ("What You See Is Not Necessarily What
    You Get").


    On the other hand, one of the rewards of web technology is that we possess useful
    tools like animation, user interaction, and "free" color that we wouldn''t have
    when designing a printed page. Additionally, search engines can aid visitors in
    finding our site out of the millions of web sites competing for attention.


    As you know, web connects (the visitor''s computer) and servers (the system on
    which the web resides). Let''s do a quick review of both client-side and server-side
    technologies, as well as identify which elements will be covered in this book.'
  merge: -1
