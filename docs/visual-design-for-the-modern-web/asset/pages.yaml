    +   Design expectations—What visitors expect your site to look like? This information
    will be critical when you progress to the visual design of the site.


    When characterizing one or more target audiences for your site, the more specific
    and vivid you can be, the better. Create a persona (an imaginary person or character)
    to symbolize each of the main types of people you expect to see (the site), and
    give each one a name, a personality, and a brief biography. You might even a picture
    with the persona, to make him or her more memorable. As you work through the design
    of your site, call up the persona in your mind and ask yourself “What would this
    person like to see on the site? How can I make this site easier to accomplish?”


    The target audience and their needs must be the focus in every decision you make.
    If you understand your target audience, you can determine what you want, design
    for them, and test with them. Satisfy their needs, and you have earned repeats.


    Keep in mind that the importance of your site to the target audience has great
