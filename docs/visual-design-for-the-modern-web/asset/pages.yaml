  md: '# PNG Format Graphics


    PNG (Portable Network Graphics, pronounced "ping") is a newer graphics format
    intended to replace GIF for everything but GIF animation (because PNG doesn''t
    support animation). PNG won''t replace the JPG format, because PNG is not ideal
    for continuous-tone images such as photos.


    Although PNG files are created in an image-editing program may contain vector
    information, they should be exported as bitmapped, compressed PNGs before being
    displayed on the web.


    The advantages of PNG are myriad:


    +   A choice of three color depths:

    - 256 colors, which offer efficient storage of color-mapped images, much like
    GIF.

    - True color, which offers 16.8 million colors, a significant improvement over
    GIF. File sizes are increased by the additional color, however.

    - Grayscale storage, as opposed to GIF''s less efficient storage of grayscale
    as nothing more than a version of an adaptive palette.

    - Lossless compression, like GIF.

    - Two-dimensional interlacing, an improved method of displaying images at higher
    levels of detail. PNG interlacing is faster and of higher quality than GIF interlacing.

    - Compression that is slightly more efficient than GIF compression, as long as
    the compression settings are chosen.

    - Gamma correction. The sRGB (Standard RGB color) standard promises to define
    a consistent color display on any visitor''s computer. It, too, is not supported
    well—not all in Internet Explorer.

    - Support for alpha channel transparency, which offers greater freedom than index
    transparency. Alpha transparency doesn''t ant-aliasing to a specific background
    color, which means an image looks good on whatever background color it''s placed.
    It does come with a price: it can greatly increase file size, and, as of writing,
    it is, at best, quirky. In fact, PNG alpha channel transparency is not supported
    in all Internet Explorer. For now, it seems alpha transparency will have to wait.


    # USING THE HTML <OBJECT> TAG TO INCLUDE PNG IMAGES


    You may have heard that embedding a PNG <img /> tag in an HTML <object> tag is
    a hack that can provide a way to get around the lack of support in some stores.
    Unfortunately, it also breaks the image in other browsers! Unless you have the
    luxury of developing a site for only a single version of a browser, this fix alone
    doesn''t seem to reliable.


    The Adobe Fireworks new file is a modified version of the PNG format. Emphasis
    here on the word "modified"—the files as produced by Fireworks should not be used
    "as is" on the web, because they contain unnecessary information that


    ![](img/ee113e5612d290709e494a0dae247fc5_252_0.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'greatly increases file size. Note that other image-editing programs can export
    their native formats to compressed PNG as well.


    # PNG File Compression


    Options for exporting PNG files are in the Optimize panel. To minimize compressed
    PNG file sizes, be sure to do the following:


    +   - When exporting a PNG file, choose the lowest possible color setting that
    provides the required image quality: grayscale, 8-bit (256 colors), or true color
    (more than two can possibly cram into a single image).


    +   - Use alpha transparency only when necessary (once it''s actually supported),
    because it greatly increases file size. Export with index transparency if you
    need only two levels of transparency: fully transparent and fully opaque.


    +   - Specify interlacing on large images, because it provides little benefit
    for small images that already download quickly.


    # Combination Ideas


    In general, we should avoid combining JPG-style art (continuous-tone art and photos)
    and GIF-style art (flat illustrations and text) into a single image. If we export
    the resulting image as a JPG, the colors will be altered and introduced in the
    flat-color areas. If we export the image as a GIF, the continuous tone areas will
    be reduced to a maximum of 256 colors and the file could be quite large. Either
    way, some elements will be degraded because of the different compression algorithms.


    Instead, consider creating separate images: a background JPG and a foreground
    GIF or PNG. For instance:


    ```

    <td style="background-image:url(jpgBackground.jpg)">

    <img src="GIF.gif" ... />

    </td>

    ```


    The transparency of the GIF or PNG allows the background JPG to show through,
    and the result looks like a single image to viewers.


    Yet another alternative is to slice (cut) the image into rectangular pieces that
    are reassembled into a table, the whole thing appearing to be an unbroken image
    on the web page. Each slice can be optimized to suit its content, so a slice of
    text on a simple background might be saved as a GIF, while a slice with a gradient
    is saved as a JPG. The downside is that colors might not match across the different
    image formats.


    TABLE 6.2 recaps what we''ve learned about web file formats.


    ![](img/ee113e5612d290709e494a0dae247fc5_253_0.png)'
