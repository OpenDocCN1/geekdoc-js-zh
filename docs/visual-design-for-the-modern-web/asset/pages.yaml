  md: '# Image Formats for the Web


    Next, we will examine the three image formats currently appropriate for non-animated
    web display: JPG, GIF, and PNG.


    # JPG Format Graphics


    JPG (pronounced "jay-peg") and also written JPEG stands for Joint Photographic
    Experts Group. It uses either a .jpg or .jpeg file extension. As you might guess
    from the name, JPG is intended for photographs and similar images that incorporate
    lots of colors, tiny bits of colors (often as small as individual pixels), and
    smooth color changes like gradients, realistic 3-D shading, and shadows. FIGURE
    6.7 shows a photo that would be best stored in JPG format. JPG supports true color
    imaging, up to 16.8 million colors. It doesn''t support transparency or animation.
    Although a form termed Progressive does also allow interlacing, Progressive JPG
    is not widely supported by current browsers.


    > TRUE COLOR


    See Chapter 5 for further discussion of true color.


    ![](img/ee113e5612d290709e494a0dae247fc5_245_0.png)


    FIGURE 6.7 JPG Example'
