  md: '# CHAPTER SIX Graphics 227


    tings, we can greatly reduce file sizes. We will look at this topic in depth later
    in the chapter when we examine specific image formats.


    # Reuse graphics.


    The first time image is referenced, it''s downloaded into the browser''s cache
    on the visitor''s computer. From then on, it''s retrieved not from our server,
    but from the visitor''s hard drive, which makes fast display. As a result, a logo
    or navigation bar that is a larger file might be acceptable if reused on multiple
    pages. Remember, that the browser reuses an image only if the URLs are identical;
    two copies of a single image, each retrieved from a different directory on the
    server, are completely different to one another.


    # Reduce image size.


    Use images that are large enough to serve their purpose, no larger. A smaller
    image is, as you might expect, a smaller file loads faster. One way to reduce
    image size is to crop (cut away) extraneous background that adds little to the
    image''s impact. We can also reduce the overall size of the image; a 500 x 500
    pixel image contains four times as many pixels as the image sized at 250 x 250
    pixels. If you use a larger image, consider providing a thumbnail image (smaller
    version) that links to the larger version, thereby giving visitors a choice of
    whether or not to wait for the larger image.


    # Use height and width attributes appropriately.


    Although the browser is capable of figuring out image dimensions if height and
    width are embedded in the tag, including those attributes makes a page display
    more quickly because the browser doesn''t have to do any calculations. Also, since
    the browser loads text before it loads images, it can allocate the appropriate
    space for the images before they actually appear. As a result, the text displays
    in its proper position off the bat, rather than repeatedly rearranged on the fly
    to fit around the images as they are rendered on the page, one by one.


    Don''t use height and width attributes to change an image''s size on the page,
    however, because:


    +   - Decreasing image size with height and width does not reduce download time,
    since the browser must still download the original large file anyway.


    +   - Increasing image size with height and width seriously degrades the quality
    of the image.


    If an image needs to be resized, do it yourself in an image-editing program, not
    in the browser.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Include the alt parameter on all images.


    alt text has multiple benefits:


    +   - It displays in screen readers, so that visually impaired visitors know the
    purpose of the image.


    +   - It displays when an image link is broken or when images are turned off in
    the browser.


    +   - In newer browsers, it displays on rollover, providing elaboration to all
    viewers.


    +   - It is indexed by search engines and can elevate a site''s rankings for search
    words, whereas any text embedded in the image itself is invisible to search engines.


    If an image contains text, then the alt attribute should usually repeat that same
    text. Otherwise, the alt text should describe the purpose of the image. If the
    image is purely decorative, with no informational content at all, include an empty
    alt attribute:


    ```

    <img alt="" />

    ```


    That way, screen readers don''t have to waste time reading meaningless text.


    # Terminology


    Now we''re a big step closer to getting to "play," but before going further, we
    need to agree on common graphics terminology.


    # Graphic Types


    Content graphics are used to represent data of some sort. This category includes
    data graphics and charts, maps, pictures of products, and screen prints. Many
    graphics are straightforward for, but particularly those present-ing complex data
    in visuals, are not. Finding ways to present data in a visual way is a problem
    not for web design, but for any type of communication.


    Thematic (also termed decorative) graphics are purely for embellishment, controlling
    focus, and support of branding. Examples include logos, decorative photos, borders,
    dingbats, and cut bullets.


    Navigational graphics are unique to the web and include clickable buttons, stand-alone
    icons, or icons adjacent to text links. Refer to Chapter 3 for guidelines specific
    to navigational graphics.


    DISPLAYING INFORMATION EFFECTIVELY


    The classic treatment on displaying information graphically is The Visual Display
    of Quan-titative information by Edward R. Tufte.'
  merge: -1
  pgno: 236
