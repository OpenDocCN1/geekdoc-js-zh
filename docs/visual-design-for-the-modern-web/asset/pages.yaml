  md: 'Failing to retain visitors is a costly mistake. The marketing rule of thumb
    is that it costs five times as much to sell to a new customer as it does to sell
    to a return-customer. Obviously, once, we have a visitor, we want to keep her.
    We are trying to minimize churn, which is the number of visitors who are not converted
    to customers, or who are converted just one time, never to return. Churn is inversely
    proportional to the conversion rate, the percentage of visitors who purchase something
    before leaving a site. Providing compelling content and presenting products in
    the very best light can increase conversion rates and minimize churn.


    # WEB CONVERSION RATES


    The average site conversion rate hovers at only 1–2%, whereas a few sites (namely
    Sephora.com, Lands End.com, and Drugstore.com) can have conversion rates in the
    10–20% range. See Computerworld February 5, 2001, page 50, http://www.computerworld.com/softwetopics/crm/01080/57260.html.


    Of course, purpose and target audience drive; every bit of content on a site should
    support its purposes and be geared toward its audience. We need to slant our content
    toward the visitors values. For instance, a potential customer for a site selling
    organic products is of course concerned with the product she is looking for, and
    whether it''s a good value, and whether she''ll purchase it; but also when determining
    if the company follows her guidelines for organic products. In such a case, a
    mission statement about the company''s policy for organic products would probably
    be very useful, while a win-loss report on the company''s (organic, of course)
    football team would not.


    Of course, the potential customer needs to accomplish her tasks as quickly and
    efficiently as possible, while we also need to convince the visitor that she should
    choose our products and services over those of another site. We can distinguish
    one product or service from another, thereby facilitating the visitor''s decision-making
    process, will make our site more attractive. Essentially, we are trying to be
    more than just easy to use; we are trying to be persuasive as well—as if we were
    in the store with her. Accordingly, we need to demonstrate the value of our site
    to the customer as soon as possible.


    # Creating Content


    Web designers don''t usually have to provide the content for a site. If the site
    is data-driven—such as Amazon with its product database—records from the database
    comprise the majority of the content. If the site is informational, subject matter
