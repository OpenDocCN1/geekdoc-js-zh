  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**308**\n\nCheckboxes\n\nCheckboxes are\
    \ similar to radio buttons, but they’re used when the choices are \n\n*not* mutually\
    \ exclusive. That is, the visitor can choose multiple items from within a \n\n\
    checkbox group. (Think “Choose all that apply.”) \n\n**FIGURE 8.5** shows a checkbox\
    \ group after the user has made one choice. Notice that \n\ncheckboxes are, as\
    \ you might expect, a square box. \n\n![](img/ee113e5612d290709e494a0dae247fc5_316_0.png)\n\
    \n HTML FOR CHECKBOXES\n\n**Here is the HTML for the checkboxes in Figure 8.5.**\n\
    \n<form name=”inputForm”>\n\n \n\nPlease check all topics of interest:<br />\n\
    \n \n\n<input name=”interests” type=”checkbox” value=”fishing” checked />\n\n\
    \ \n\n \n\nFishing<br />\n\n \n\n<input name=”interests” type=”checkbox” value=”golf”\
    \ />\n\n \n\n \n\nGolf<br />\n\n \n\n<input name=”interests” type=”checkbox” value=”tennis”\
    \ />\n\n \n\n \n\nTennis<br />\n\n</form>\n\nThe code in the sidebar shows grouped\
    \ checkboxes, but checkboxes can also be \n\nused individually. The classic example\
    \ of a single, binary “yes/no” checkbox is the \n\none we’ve all encountered:\
    \ the small type, automatically checked, “Yes, I want to \n\nreceive special offers,\
    \ otherwise known as spam” question posed by so many web \n\nsites. (Worded a\
    \ bit less bluntly, of course.)\n\nAs with radio buttons, chunking checkboxes\
    \ within a border and/or providing extra \n\nwhite space between the group and\
    \ other page elements helps to show how the \n\ncheckboxes are related. Any vertical\
    \ list of checkboxes should align precisely, one \n\nabove the other. \n\n**FIGURE\
    \ 8.5 **Checkbox \n\nGroup \n\n**FIGURE 8.5 **Checkbox \n\nGroup"
  merge: -1
  pgno: 316
