  md: "**CHAPTER SEVEN** Typography\n\n**283**\n\ning a typeface by the term “font”\
    \ means that most of us have come to use the terms \n\ninterchangeably, even though\
    \ they are in reality two somewhat different aspects of \n\ntypography. \n\nMost\
    \ modern typefaces are *proportionally spaced*. That is, individual characters\
    \ vary \n\nin the amount of horizontal space they use, so that an “i” consumes\
    \ less space than \n\nan “M.” In contrast, *monospaced *typefaces, such as Courier\
    \ New, assign the same \n\namount of space to each character. For instance, this\
    \ “i” in the typeface Courier \n\nNew is the same width as the letters “N” and\
    \ “W” in the same typeface. Monospaced \n\ntypefaces are useful when columns of\
    \ characters must align vertically or when we \n\nneed the feel of an old-fashioned,\
    \ typewriter-based face. \n\nA *font family,* in traditional typography terms,\
    \ includes all the variations on a par-\n\nticular typeface, so that the Times\
    \ New Roman font family includes a bold version, \n\nan italic version, and so\
    \ on. As we will see later, “font family” means something very \n\ndifferent in\
    \ cascading style sheets (CSS). \n\nTypefaces are loosely grouped as either serif\
    \ or sans serif. *Serif *faces have small \n\ndeﬁ ned strokes or embellishments\
    \ at both ends of the main letter strokes, as shown \n\nin **FIGURE 7.1**. \n\n\
    *Sans serif *faces, also shown in Figure 7.1, don’t have embellishments at the\
    \ termina-\n\ntion of the main strokes, and are often viewed as providing a more\
    \ modern effect. In \n\nfact, they seem to be the more common choice in today’s\
    \ corporate world. \n\n**FIGURE 7.1 **Text Typefaces. \n\nFYI, the three “headlines”\
    \ \n\nin this list are set in \n\nVerdana—*the* san serif \n\ntypeface for the\
    \ web.\n\n**FIGURE 7.1 **Text Typefaces. \n\nFYI, the three “headlines” \n\nin\
    \ this list are set in \n\nVerdana—*the* san serif \n\ntypeface for the web."
  merge: -1
  pgno: 291
