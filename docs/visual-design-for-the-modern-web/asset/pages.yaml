  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**312**\n\nGrouping List Box Options under\
    \ a Header\n\nIndividual <option> items within a <select> can be grouped under\
    \ a specially for-\n\nmatted, nonselectable header using the <optgroup> container.\
    \ For instance, in \n\n**FIGURE 8.11**, neither the “Hobbies” nor the “Sports”\
    \ lines are selectable. \n\n![](img/ee113e5612d290709e494a0dae247fc5_320_0.png)\n\
    \n DROP-DOWN LIST WITH OPTGROUP HEADERS\n\n**Here is the HTML for the drop-down\
    \ list with optgroup headers in Figure 8.11.**\n\n<form name=”inputForm” id=”inputForm”>\n\
    \n \n\nPlease select a topic of interest:<br />\n\n \n\n<select name=”activities”\
    \ size=”7”>\n\n \n\n \n\n<optgroup label=”Hobbies”>\n\n \n\n \n\n \n\n<option\
    \ value=”crafts”>Crafts</option>\n\n \n\n \n\n \n\n<option value=”genealogy”>Genealogy</option>\n\
    \n \n\n \n\n \n\n<option value=”home remodeling”>Home Remodeling</option>\n\n\
    \ \n\n \n\n</optgroup>\n\n \n\n \n\n<optgroup label=”Sports”>\n\n \n\n \n\n \n\
    \n<option value=”golf”>Golf</option>\n\n \n\n \n\n \n\n<option value=”tennis”>Tennis</option>\n\
    \n \n\n \n\n \n\n<option value=”fishing”>Fishing</option>\n\n \n\n \n\n</optgroup>\n\
    \n \n\n</select>\n\n</form>\n\n**FIGURE 8.11 **List Box with \n\noptgroup Headers\n\
    \n**FIGURE 8.11 **List Box with \n\noptgroup Headers"
