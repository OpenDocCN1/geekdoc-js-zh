    The <fieldset> tag and associated CSS may behave inconsistently in different browsers.
    For instance, colors may work for the border but not for the legend text, and
    adding CSS styling at all can result in squaring off the rounded corners. Be sure
    to test thoroughly.


    The more complex the page, the more important it is that you use organizational
    tools like these chunk the elements. Notice that the MSN portal we discussed earlier
    years using many of these tricks to get great advantage.


    # Manipulate contrast to create a visual hierarchy.


    Contrast is the difference in the characteristics of various elements such as
    line or shape of color. Simply stated, any item that is different stands out.
    For instance, a curvy shape contrasts with a page full of angular shapes, and
    fire-engine red contrasts with a page of mainly pastel colors like soft pink and
    pale blue. Contrast is the primary tool for creating visual stimulation and emphasis,
    influencing the page with impact.


    Varying the contrast between elements leads not only to an interesting page, but
    also creates a visual hierarchy that the most important elements are the ones
    that stand out on first read—the first impressions get of a page. Web guru extraordinary
    Lynda Weinman calls this "strategic prioritization of information." We don''t
    want every element on the page to have equal weight, clamoring for attention.
    We should make the elements that we want the users to notice the most prominent.
    Navigation? Announcement of a sale? A news flash? We emphasize those "most worthy"
    elements using one or more visual characteristics that contrast—that stand out
    from—the other elements on the page. In doing so, we manipulate our users'' focus.


    For example, FIGURE 417A has no visual hierarchy. Not only would people be declined
    to read the entire entrance, but it would be difficult for them to pick out the
    most important information, such as the date and time. Readers would be puzzled
    and confused by such a lack of visual hierarchy. FIGURE 417B, on the other hand,
    uses type size, density, spacing, and alignment to provide a clear visual hierarchy
    that makes the information easier to comprehend.


    ![](img/ee113e5612d290709e494a0dae247fc5_166_0.png)'
