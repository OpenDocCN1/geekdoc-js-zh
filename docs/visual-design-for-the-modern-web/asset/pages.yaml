  md: "**CHAPTER EIGHT** Forms\n\n**331**\n\n■ Use a consistent vocabulary. Don’t\
    \ describe a single process in multiple ways, such \n\nas “Enter the desired number”\
    \ in one place, “Type your number” in another, and \n\n“Press your numeric choice”\
    \ in yet another. If you aren’t consistent, visitors might \n\nthink that each\
    \ of these different phrases refers to a different process.\n\n■ Be concise and\
    \ to the point. As we discussed earlier, TMI (too much information) \n\nis either\
    \ ignored or serves to overwhelm visitors. Edit all instructions down to a \n\n\
    critical core.\n\n■ Include the title attribute on form elements to provide further\
    \ instructions on \n\nrollover, if required.\n\nHelp Documents\n\nIf we provide\
    \ adequate instructions on a page, our visitors should require separate \n\nHelp\
    \ pages only rarely. Still, some pages may have complicated tasks to perform.\
    \ \n\nThese, then, are the speciﬁ c pages that cry out for meaningful Help documents,\
    \ \n\nparticularly for visitors who are brand new or who drop in only occasionally.\
    \ Keep in \n\nmind that a visitor who consults Help is often already at a crisis\
    \ point. Therefore, we \n\nneed to be as “helpful” and concise as possible, to\
    \ avoid further irritation.\n\nThe Help system could be as simple as integrated\
    \ Help pages for just a few of the \n\nsite’s tasks, or as complicated as an extensively\
    \ indexed, separate site-within-a-site \n\nconsisting of dozens, even hundreds,\
    \ of pages. Help can be *action-based*, such as \n\na tutorial that leads visitors\
    \ step-by-step through performing speciﬁ c tasks, or it \n\nmight be *reference-based*,\
    \ in which case visitors are simply presented with an expla-\n\nnation of the\
    \ requested topic. \n\nIn any case, Help can be accessed by links on the main\
    \ menu system, as on Amazon’s \n\nhorizontal top menu (**FIGURE 8.24**), or by\
    \ contextual links at the crisis point itself, \n\nas on the “View shipping rates\
    \ and policies” link next to the shipping weight on \n\nAmazon’s book page (**FIGURE\
    \ 8.25**). Contextual help is usually more, well, helpful, \n\nbecause visitors\
    \ don’t have to worry about browsing or searching an entire help \n\nsystem to\
    \ ﬁ nd what they need, nor do they have to worry about exactly which \n\nsearch\
    \ phrase to use. Contextual help means you have to build your pages to be \n\n\
    smart enough to discern which Help documents will be appropriate, depending \n\
    \nupon what the visitor is attempting to do.\n\n![](img/ee113e5612d290709e494a0dae247fc5_339_0.png)\n\
    \n**FIGURE 8.24 **Amazon’s \n\nMain Menu Help Link \n\n(www.amazon.com, \n\n©\
    \ Amazon.com, Inc. or \n\nits affiliates. All Rights \n\nReserved.)\n\n**FIGURE\
    \ 8.24 **Amazon’s \n\nMain Menu Help Link \n\n(www.amazon.com, \n\n© Amazon.com,\
    \ Inc. or \n\nits affiliates. All Rights \n\nReserved.)"
  merge: -1
