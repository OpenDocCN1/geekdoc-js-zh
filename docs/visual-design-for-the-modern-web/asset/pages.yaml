  md: 'pixels must necessarily be larger and spaced further apart on the larger monitor.
    The upshot is that given the same width-by-height resolution, every element on
    the page appears larger on a larger monitor. FIGURE 4.2 displays the difference.


    # FIGURE 4.1 Effect of Display Resolution Element Size


    ![](img/ee113e5612d290709e494a0dae247fc5_141_0.png)


    800 x 600 resolution


    ![](img/ee113e5612d290709e494a0dae247fc5_141_1.png)


    1600 x 1200 resolution


    # FIGURE 4.2 Effect of Monitor Size on Element Size


    ![](img/ee113e5612d290709e494a0dae247fc5_141_2.png)


    19" Monitor


    ![](img/ee113e5612d290709e494a0dae247fc5_141_3.png)


    15" Monitor


    As we have seen, both the resolution settings on the system and the monitor size
    dictate how large elements of a web page appear, and how much of the page actually
    fits on the screen. As width-by-height resolution increases, pixels get smaller,
    as do all of the elements on the screen that are made of those pixels. As monitor
    size increases, pixels get bigger, as do all of the elements on the screen.


    TABLE 4.1 illustrates how screen size and resolution interact, resulting in varying
    text and graphic sizes (demonstrated with relative, not absolute, element sizes).
    Note again how the text and graphics look largest at low resolution on a large
    display, and smallest at high resolution on a small display.'
