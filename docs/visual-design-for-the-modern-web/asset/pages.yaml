  md: '# Provide Multiple Ways to Access Information


    We need to provide users with multiple ways to find things, based upon different
    ways of thinking and tasks that need accomplishing. The classic example of multiple
    ways to find things is a library card catalog, in which a visitor can search for
    a book by title, author, or subject keywords. Likewise, Amazon understands that
    web visitors want to search for books on the web using the same categories. A
    visitor to Amazon can further filter the search by new or used books, different
    formats (hardback, paperback, audiobook), and reader age, language and publication
    date (see FIGURE 3.1). She might read through a few pages of a book, skip reviews
    and check out books recommended by the reviewers, or browse the other books that
    Amazon thinks might be of interest. She might choose to search in a book list,
    with for quick recall later.


    ![](img/ee113e5612d290709e494a0dae247fc5_81_0.png)


    Fill in at least one field. In order to narrow your search, browse our most popular
    titles, subject subject.


    Amazon understands that visitors know exactly what they are looking for, or when
    they enter an exact book title ("The Return of the King”), and sometimes times
    they don''t, when they enter a general subject (“fantasy fiction”). The first
    method is based on known item searching. If all users know what they were looking
    for, it would be much easier to design navigation systems.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 74 VISUAL DESIGN FOR THE MODERN WEB


    The alternative to item searching is more exploratory. Amazon supports the exploration
    method with its "Browse Subjects" page (see FIGURE 3.2). Further browsing options
    include "Best Sellers," "New York Times Sellers," "Bargain Books," and "Used Books."
    Sometimes, the first exploratory foray serves merely as a springboard to send
    visitors yet another path. This exploratory method is messier, more ambitious,
    and more difficult to support.


    FIGURE 3.2 Browsing (©Amazon.com, Inc. or its affiliates. All Rights Reserved.)


    ![](img/ee113e5612d290709e494a0dae247fc5_82_0.png)


    Notice that although Amazon''s site is structured hierarchically such as books,
    music, and movies, visitors can bypass the hierarchy by using the generic search
    function. The lesson here is: Even though we need to make the structure apparent
    to visitors, the structure shouldn''t hamper non-hierarchical access to information.


    We can also allow visitors to navigate the navigation as they fit, using a technique
    termed personalization. We provide the means for each visitor to customize the
    site to see only the links or she has requested, in the format requested. For
    instance, a visitor might choose to see only local news, sports, and entertainment
    news when opening a news portal site.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# CHAPTER THREE Navigation 75


    # Provide for Visitors with Varied Skill Levels


    Experienced surfers can figure out even confusing navigation systems. Web "newbies,"
    though rare these days, may not be familiar with the convenience of using an underline
    as one of indicating links. The vast majority of visitors falls somewhere in between.
    The good news is that a clear and elegant navigation does indeed support everyone,
    regardless of skill level. Still, the newcomers need additional support such as
    indicators or help pages, make sure such features don''t hinder the more experienced
    visitors.


    # Provide Feedback


    We should provide some sort of feedback anytime a visitor must wait for an extended
    period of time after clicking a link. For instance, if a visitor is downloading
    a large file, we might offer a small animation that proves to the user that the
    download is progressing. For instance, United Airlines shows an animation of an
    airplane flying over the page as the site takes a few moments to search for flights.
    Without such an animation, a long wait might convince the visitor that the web
    site is locked up. User perception is critical; a long wait in something, anything
    happening is often perceived to be shorter than an uncertain wait of the same
    duration.


    # Make Sure the Navigation is Flexible and Expandable


    Site flexibility and adaptability aren''t important to visitors, but they are
    certainly to those of us who must maintain the site. When our industry talks about
    time, it''s referring to the fact that web sites must be nimble enough to adjust
    quickly with little worrying about changing business needs. Our navigation system
    must be flexible enough to accommodate such adjustments. For example, a menu consisting
    of navigational text is easy to update (adding, altering, deleting links). On
    the other hand, an impressive Flash animation that consists of five links, rotating
    in a circle, is not; adding or deleting a single link would mean that everything
    on the graphic would need to be rearranged, and all of the animation must follow
    suit. Always consider ease of future maintenance when evaluating a particular
    navigation scheme.


    # Required Navigation


    At the very least, every page should include the following navigation aids to
    facilitate wayfining:


    +   - Site identification (logo, name, etc.) and page identification (title line
    and page header). You simply can''t depend on the home page to orient your visitors,
    because they don''t always come in that front door. A search engine or'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'another site might have sent the visitor directly to a lower-level page (called
    deep linking), or the visitor might have entered via a bookmark to a subsidiary
    page. You should display site and page identification on every page in the site,
    so that visitors are not lost or bewildered, stuck on some unidentified lower-level
    page.


    +   - **Contact information**, or an obvious link to the page containing contact
    information. Contact information should include not only email contacts but also
    phone numbers and postal address. Even though we might prefer to deal with electronic
    communication from our visitors, many of the visitors have come to distrust sites
    that refuse to reveal a physical presence in addition to a virtual one.


    +   - **A link to the home page** (unless the case in question is the home page).
    Although the site identification/logo can serve as a link to the home page, there
    should be an explicit “Home” link as well. In any case, the user should always
    be able to return to the home page in a single click, regardless of where he or
    she is on the site.


    +   - **Links to the pages under the home page.** These links, along with the
    link to the home page, are permitted persistent global navigation because they
    are on every page in the site. The global navigation serves to do more than just
    link to pages; it also provides the visitor with a conceptual map of the site
    and scope.


    As appropriate, some pages might include:


    +   - **Local navigation** for subsections under the current page. Navigation
    evolves from the subcategories and labels that were identified for the site architecture.
    This is also called cross-over navigation because it links sideways to sibling
    pages, rather than up or down the hierarchy.


    +   - A **search function**, which is obviously more important for larger sites
    than for smaller ones.


    +   - **Site-wide utilities**, such as “Store Locator” or “Checkout.”


    # Organizing Navigational Structure to Match Structure


    In this chapter, we examined the site architecture based upon a taxonomy and its
    preferred labels. Once we have determined these categories and subcategories and
    assigned labels to them, the underlying structure of the site itself becomes apparent
    to us. Now we employ navigation to make that underlying architecture apparent
    to our visitors. Navigation, then, is the site architecture made visible.


    There are three basic models for organizing the navigation of a site: random-access
    navigation, sequential navigation, and hierarchical navigation.'
  merge: -1
  pgno: 84
- img_proc: true
  md: "# Random-access Navigation\n\nA random-access scheme requires visitors to pick\
    \ individual, unrelated topics randomly from a menu. A random access model isn't\
    \ truly organization—it's chaos. Without a visible structure of some sort, visitors\
    \ have trouble finding what they are looking for, instead becoming overwhelmed\
    \ and giving up. Random access, or lack thereof, might be acceptable in entertainment\
    \ or experience sites, where the challenge of figuring out the navigation is considered\
    \ to be part of the entertainment, but it's rarely suitable for mainstream web\
    \ sites. It's just too difficult to find anything, and visitors can't build a\
    \ mental map of the site.\n\n# Sequential Navigation\n\nA sequential navigation\
    \ scheme is designed to be read one page after another. An example would be a\
    \ long article spaced over several pages, with a \"next\" link at the bottom of\
    \ all but the final page in the series. Navigation might look something like FIGURE\
    \ 3.3.\n\n> FIGURE 3.3 Navigation — a familiar navigation scheme for a multi-page\
    \ situation.\n\n| Page 1 | 2 | 3 | 4 |\n| <<< Previous | Next >>> |\n\nAlthough\
    \ we are comfortable with this structure—after all, books have been organized\
    \ on a \"next page\" structure for rather a long time—it's rarely appropriate\
    \ for an entire web site. Most of time, visitors aren't reading our entire web\
    \ site from \"cover to cover.\" As a result, sequential navigation is usually\
    \ implemented only for selected pages within a site.\n\n# Hierarchical Navigation\n\
    \nHierarchical navigation schemes, the most pervasive, require following links\
    \ up and down a hierarchy. Humans have a natural affinity for hierarchical organization\
    \ in all areas of existence, whether it's categorizing genera and species in nature,\
    \ depicting our family tree, setting up a corporate management structure, or organizing\
    \ a web site. Ideally, hierarchies are structures that we understand intuitively,\
    \ making them the perfect framework upon to hang a navigation system.\n\nA text\
    \ outline portraying a hierarchical site might look something like this:\n\nHome\
    \ Page\n\n+   * Desktops\n  * Under $1000\n  * Over $1000"
  merge: -1
  pgno: 85
- img_proc: true
  md: "# VISUAL DESIGN FOR THE MODERN WEB\n\n# HIERARCHICAL MINDS AND THE BACK BUTTON\n\
    \nThe intuitive understanding of hierarchical structures could be why we often\
    \ use the \"Back\" button instead of clicking on a direct \"sideways\" link from\
    \ a lower-level page; we are tracing back the hierarchy in our mind, too, so that\
    \ we don't get lost. Must be some kind of homing instinct.\n\n+   ■ Laptops\n\
    \  - Under $1000\n    - Under 5 pounds\n    - Over 5 pounds\n  - Over $1000\n\
    \    - Under 5 pounds\n    - Over 5 pounds\n\n+   ■ Accessories\n  - Printers\n\
    \  - Scanners\n  - Networking\n\nDreamweaver and other development environments\
    \ can create graphical hierarchy charts (see FIGURE 3.4). In Dreamweaver, you\
    \ have two workflow options:\n\n+   ■ Draw the hierarchy chart and then allow\
    \ Dreamweaver to create the skeleton HTML documents depicted on the chart.\n\n\
    +   ■ Create the HTML pages and ask Dreamweaver to display the resulting chart.\n\
    \n# FIGURE 3.4 Hierarchy Chart from Dreamweaver\n\n![](img/ee113e5612d290709e494a0dae247fc5_86_0.png)"
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Creating a graphical hierarchy chart manually, outside of a development environment,
    is usually more trouble than it''s worth, and adding new pages later can be a
    rearrangement nightmare. It''s much easier and usually just as effective to use
    a text outline, just shown a bit above.


    The menu system in a hierarchical scheme usually mirrors the hierarchical structure
    of the site architecture we identified earlier. Still, links that disregard the
    structure can be valuable as well. For instance, a lower-level content page visiting
    Dell''s site might locate a laptop by clicking on "laptops," or they might navigate
    to the same page by clicking on "home users." Fortunately, the hypertext (linkable)
    nature of the web allows us to link and cross-reference pages from within multiple
    categories, without redundantly storing multiple physical copies of those documents.
    On the web, one thing can indeed seem to be in two places at once.


    # Mixing Navational Models


    Many sites mix hierarchical access for the majority of the site but sequential
    or even random access for selected subsections. Regardless of the model or models
    employed, visitors should be able to make a mental map of the site.


    # Link Functions


    We can classify links within a navigation system by function:


    +   - Internal hyperlinks

    - External hyperlinks

    - Download links

    - Auto-email links

    - Note links


    # Internal Hyperlinks


    Standard internal hyperlinks link to other HTML pages within our own site. See
    the sidebar for a review of the HTML for internal hyperlinks.'
