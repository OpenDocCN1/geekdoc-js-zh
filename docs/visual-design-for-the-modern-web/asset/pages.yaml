  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 7


    It''s also a good idea to test a site against the W3C validator, which can identify
    HTML that is not following standards (“It has a higher potential to break in the
    different browsers”). Frequently, one promising trend is that newer versions of
    browsers are more compatible with that earlier versions have been, by any designer
    building a web site that functioned flawlessly in older versions of IE as well
    Navigator 4.7 will.


    If the code turns out to be incompatible with at least one browser that has to
    work with it, we can deliver a separate page tailored to a specific browser by
    “sniffing the browser,” that is, identifying the visitor in use and routing a
    visitor to a page specifically optimized for that browser. Regrettably, creating
    and maintaining multiple versions of each is a difficult and tedious chore; we
    need to assess the number of visitors we might have use a particular browser,
    and then determine whether the code is worth the effort for our particular circumstances.
    Still, it could be of perhaps just a few pages within the site.


    In addition to testing a site within multiple browsers, we should also test different
    platforms—Windows, Mac OS, and Unix. For instance, Internet Explorer renders some
    code differently than a Mac than it does on Windows.


    For all of our readers and platforms, the site should be error-free, although
    it could be acceptable if some “bells and whistles” degrade gracefully; that is,
    features don''t appear at all, but in such way that nothing is broken. The result
    should be that the viewer is not aware that anything is missing.


    A browser employs HTML, Cascading Style Sheets (CSS), JavaScript, Flash, and multimedia
    (audio and video) to render documents. Let''s briefly review each of these components.


    # HTML/XHTML


    HTML (Hypertext Markup Language) is a tag-based language used by web browsers
    to render text and images on the visitor''s monitor. When a visitor requests a
    page from a web site, the HTML document is downloaded to the visitor''s hard drive
    and displayed from there. Relevant HTML is presented in slides throughout this
    book.


    One of the best ways to expand your knowledge of HTML is to view the source code
    of other web pages. To do so, simply right-click (or Control-click on the Mac
    if you don''t have a two-button mouse) anywhere on the page other than an image
    or a form element, and then View Source or View Page Source. HTML for the page
    will be loaded and displayed in your default HTML editor.


    ![](img/ee113e5612d290709e494a0dae247fc5_15_0.png)'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    Although HTML includes commands for visual presentation (color, fonts, and so
    on), it''s really best used for structural indicators such as header levels and
    bulleted lists. As a result, HTML formatting is now deprecated (discouraged) in
    favor of CSS-formatting (seeing the oops section).


    # BONUS TOPIC:

    Setting up a Web Site on

    a Service Provider


    See the book''s web site for

    an overview of purchasing

    domain name, choosing a

    web hosting provider, and

    uploading to the server.


    This book follows the latest HTML standard, referred to as XHTML, but we''ll use

    the more generic and common term, just plain HTML, in all our discussion. The
    World

    Web Consortium (W3C—www.w3.org) provides the current specification for

    HTML, along with proposals for future additions to the standard. Additionally,
    it

    off an online HTML validator that can check if a site is following\modern standards.


    # REFORMATING OLD HTML TO XHTML STANDARDS


    Some HTML development environments, including Adobe Dreamweaver, can refor-mat
    HTML to the XHTML standard as you type, as well as upgrade legacy (existing)

    HTML files to XHTML (choose File > Convert).


    # Cascading Style Sheets


    Cascading Style Sheets (CSS) define the visual presentation of a web page, including

    color, sizes, fonts, background images, borders, margins, underlines, and even
    posi-tioning. CSS can stipulate formatting options that are not available with
    HTML alone,

    such as absolute positioning (placing an object at a precise location on a page)
    and

    text rollers (when the visual characteristics of a text link change the mouse
    rolls

    it). Relevant CSS will be presented in sidebars throughout the book.


    Although the greatest benefit of using CSS is accrued by linking to external CSS

    files, we will normally use in-line CSS (that is, embedded in the HTML) in the
    exam-ples in this book, because external files make for unwieldy examples. Keep
    in mind,

    hower, that any in-line CSS can be easily pulled out into an external CSS file
    for

    production use.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 9


    # CROSS-BROWSER COMPATIBILITY


    Don''t leave anything to the browser default. That is, don''t assume that all
    browsers display a white page background, use identical margins and padding, or
    treat visited links like normal links unless you specify otherwise. These assumptions
    can result in pages that don''t render the same from browser to browser. To be
    safe, pull control out of the hands of the browsers and explicitly lock in every
    critical formatting characteristic (particularly margins, padding, cellspacing,
    and borders) with CSS.


    # Scripting Languages


    HTML alone is its only responsibility to display text and images. That is, it
    can''t do anything that requires changes to the page after it''s loaded, nor can
    it perform tasks such as adding numbers to totals. As a result, we need scripting
    languages which are nothing more than "lite" programming languages, to accomplish
    tasks such as performing calculations, editing input data, or changing visual
    presentation on the fly. The two-browser scripting languages are JavaScript and
    Microsoft''s VBScript. The latter has proprietary features that are recognized
    only in a Microsoft environment, so from here on, we will only deal with JavaScript.


    Even so, you need not have any knowledge of JavaScript to use this. Luckily for
    non-programmers, simply JavaScript effects, such as image rollovers (replacing
    one image with a different image on mouse roller), can be implemented in a development
    environment such as Dreamweaver (discussion in a few pages) without any real knowledge
    of actual programming.


    ![](img/ee113e5612d290709e494a0dae247fc5_17_0.png)


    > BONUS TOPIC: JavaScript

    See the book''s web site for a quick tutorial on creating a navigational image
    in Fireworks and then embedding it in a page with a rollover effect using Dreamweaver.


    # Adobe Flash


    Flash began its life as graphic-animation technology, but is now being used for
    entire web sites. Everything from navigation to server-side database access can
    be accomplished in Flash, using Flash''s programming environment, Flex/ActionScript.
    Although it''s likely that Flash-based sites will continue to increase in popularity,
    it''s unlikely that Flash will completely replace HTML in the near future. Instead,
    it''s a question of using the right technology for the intended purpose. We''ll
    briefly at Flash as a page-delivery tool in the Layout chapter.'
  merge: -1
