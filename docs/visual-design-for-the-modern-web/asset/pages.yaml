  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   - Although accessibility guidelines encourage the use of style sheets, you
    should still design documents that they make sense without them (that is, the
    document should be written in a "logical" order). For example, when an HTML document
    is rendered without associated style sheets, it must still be possible to read
    the document. Then, apply style sheets to achieve visual effects using properties
    as float and position.


    # Summary


    Although variety and contrast can be a good thing, too much visual noise will
    make the page visually confusing and overwhelming. A page should look clean and
    well-organized if there are many elements on it. You must walk the line between
    providing enough contrast to keep the viewer on target and stimulated, yet not
    so much stimulation that he or becomes overwhelmed. At the same time, you must
    provide enough continuity from page to page that the users are always aware that
    they are still on your site.


    # Design Checklist


    The following checklist serves two functions: to summarize the major points and
    "rules" presented in this chapter, and to help you ensure you''ve done all before
    finalizing any web site you are creating.


    # File Size and Resolution—Did you:


    +   - Limit file sizes appropriately?

    - Take into consideration browser inconsistencies?

    - Pull most of the CSS and JavaScript out into external files that are reused
    throughout the site?

    - Reuse graphics, audio, and video from page to page?

    - Avoid gratuit graphics, animation, and sound?

    - Use smaller images rather than larger ones possible?

    - Minimize the number of unique navigation buttons?

    - Determine an appropriate page size, in pixels?

    - Avoid horizontal scrolling?

    - Provide a "print page" option, when appropriate?'
