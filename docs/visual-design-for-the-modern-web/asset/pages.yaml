  md: "**CHAPTER SEVEN** Typography\n\n**287**\n\n*Kerning* is a speciﬁ c type of\
    \ letter spacing that adjusts the space between two \n\nneighboring characters,\
    \ most typically used to nestle letters closer together to \n\ntake advantage\
    \ of adjacent parallel strokes, such as between an “A” and a “W.” For \n\nexample,\
    \ the top row of text in **FIGURE 7.5** is not kerned. As a result, letters with\
    \ \n\nparallel stokes in the word “AWAY” appear to be spaced more widely apart\
    \ than the \n\nletters in the word “GO.” Tighter kerning in the bottom row, however,\
    \ remedies the \n\nperception of inconsistent spacing. \n\nAWAY WE GO\n\nAWAY\
    \ WE GO\n\nJustification\n\n**FIGURE 7.6** illustrates several types of *text\
    \ justiﬁ cation *(text alignment):\n\n■ **Left justiﬁ ed—**Body copy should *always*\
    \ be justiﬁ ed left, *ragged right* (that is, \n\nthe ends of the lines don’t\
    \ align) on the web.\n\n■ **Center justiﬁ ed** and **right justiﬁ ed—**Although\
    \ appropriate for headers and \n\nother highlighted elements, neither one should\
    \ be used for body copy. They are \n\nalso inappropriate for bulleted or numbered\
    \ lists, because the bullets or num-\n\nbers don’t line up.\n\n■ **Fully justiﬁ\
    \ ed—**Full justiﬁ cation (when both the right and left margins are aligned \n\
    \non all but the last line of a paragraph) is good only if the medium allows for\
    \ micro-\n\nspacing adjustments *and* the lines of text are long enough to spread\
    \ those adjust-\n\nments out. Otherwise, obviously uneven spacing can result,\
    \ as in the last example \n\nof Figure 7.6.\n\nCenter\n\nJustified\n\nInterdum\
    \ volgus \n\nvidet, est ubi \n\npeccat. Si veteres \n\nita miratur \n\nlaudatque\
    \ poetas, \n\nut nihil anteferat, \n\nnihil illis \n\nF\n\nu\n\nl\n\nl\n\ny \n\
    \nJ u s t i f i e d\n\nInterdum \n\nvolgus \n\nvidet, \n\nest \n\nubi \n\npeccat.\
    \ Si veteres \n\nita \n\nmiratur \n\nlaudatque poetas, \n\nut nihil anteferat,\
