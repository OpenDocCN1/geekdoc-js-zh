    ![](img/ee113e5612d290709e494a0dae247fc5_19_1.png)


    # Application Server


    +   1. The client sends a request for a page to a web server using HTTP (Hypertext
    Transfer Protocol), which in English means "the client types in a URL."

    2. The web server processes and returns the requested HTML document as well as
    all associated CSS, JavaScript, and multimedia files.

    3. The client displays the received files as a completed page.

    4. The web server disconnects the client. Any future requests from the client
    are treated independently of any prior requests.'
