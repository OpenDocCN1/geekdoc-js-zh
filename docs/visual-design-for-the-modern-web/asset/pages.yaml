    on the server) uses standard programming languages like Java, C++, or even COBOL
    to interact with the underlying databases. The significance of a BUI is a business-application
    not typically delivered through the web can still use a browser to provide its
    user interface.


    In the future, the most ubiquitous deployment of web technology may be in BUIs,
    not for public-access web sites, for good reasons:


    +   - A browser has all sorts of built-in facilities—for buttons and forms and
    such—that can make coding a user interface easier and faster in the typical GUI
    environment.


    +   - Browser-based technologies as HTML are fairly easy to learn. That of learning
    is not necessarily true for the programming languages and environments used to
    build GUIs.


    +   - Web sites may be as agile as the business itself, that they can be updated
    quickly and easily for competitive advantage. Again, because HTML is relatively
    straightforward, HTML-based interfaces are easier to update standard GUIs.


    +   - BUIs are portable. If we code it wisely, its pages will display properly
    in all of our target browsers, on any operating system. On the other, most programs
    written in standard programming languages must be at least completed and perhaps
    ever rewritten to run in each different computing environment.


    +   - BUIs don''t need to be downloaded and maintained on every user''s PC, as
