  md: '# Sliced Images with Hotspots


    Image maps can''t provide true graphic rollover effects on the hotspots, unfortunately.
    In order to accomplish multiple discrete rollovers on what starts out as a single
    image, we break the image apart into slices (rectangular pieces) that are seamlessly
    reassembled into an HTML table. Then each piece can be manipulated independently,
    including adding rollovers to selected cells.


    Luckily, image editors like Photoshop and Fireworks help us to slice and reassemble
    an image. Here are the steps:


    +   1. Export the image into rectangular pieces in any graphics-editing program
    that supports slicing. FIGURE 3.12 shows a fruit image with a rectangular slice
    drawn around one of the ones, in preparation for making that rectangle a hotspot.
    The image-editing software extends the rectangle''s line segments to the edge
    of the image to cut the image apart into cells.


    FIGURE 3.12 Slicing an Image


    ![](img/ee113e5612d290709e494a0dae247fc5_108_0.png)


    +   2. Export the image to an HTML table and populate the table with all of the
    pieces of the image. When rendered in the browser, the whole shebang looks like
    a single image, as shown in FIGURE 3.13. Here, table borders are turned on so
    we can see the table structure, but normally they would be invisible. FIGURE 3.14
    shows the individual slices. The HTML for this table is complex, even though the
    image contains only a single requested slice (around the lime). Imagine how complicated
    it would be if it contained the same number of hotspots as the image we looked
    at in Figure 3.11.'
