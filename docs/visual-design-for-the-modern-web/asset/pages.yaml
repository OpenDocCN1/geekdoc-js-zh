  md: '# CHAPTER FIVE Color 221


    The standard color space for printing presses is CMYK, for Cyan (bluish), Magenta
    (reddish), Yellow, and black (don''t ask why “K”). The CMYK color scheme is skewed
    bit from the blue, red, and yellow color wheel typically referred for the traditional
    subtractive color model; the transparent pigments used by printing presses require
    somewhat different formulas. Different medium, slightly different color wheel,
    yet again.


    Translation between RGB and CMYK is built into many graphics programs. The translation
    is far from perfect; printed colors and screen colors will never, ever, be identical
    the two media are not identical. Screen displays excel at portraying the brightest
    colors but subtler hues less effectively. Print media have exactly the opposite
    attributes. And even then, there are inter-media differences; for example, printing
    on glossy paper is more likely to come close to reproducing the colors of a web
    page than printing on non-glossy paper.


    # Color and Accessibility


    10% of the male population is color-blind. There are various forms of color-blindness:
    red-green, green-brown, and so on. We cannot possibly avoid all of the colors
    that could be misinterpreted by visitors with color vision impairment.


    Nonetheless, it is easy enough to make sure our pages are legible to anyone with
    color vision impairment. As already stated (repeatedly), there must be sufficient
    contrast value between the foreground and background colors such that the hue
    itself is irrelevant for legibility, as demonstrated in FIGURE 5.42. For instances,
    Figures 5.42 C and E would be legible to the same viewer, because the former uses
    different values (light versus dark), while the latter places both on a neutral
    background. Again, viewing your page in grayscale mode can show whether or not
    there is sufficient contrast The toolbar mentioned earlier allows viewing a color
    page in grayscale mode, as some with one color vision might see.


    In addition to paying attention to value differences, we should also make sure
    that color alone is not the only clue to mentioning. For instance, traffic signals
    are still discernible to the color-impaired because the red and green lights are
    always in the same position. One area that we need to be particularly careful
    of is navigational links. If the color is the only clue for distinguishing links
    from normal text, then colorblind visitors might not be able to distinguish links
    from normal text. Therefore, we need to make sure to use other affordances on
    the links as well, such as underline, boldface, or italics.


    See www.w3.org/TR/WAI-WEBCONTENT-TECHS/, www.usablenet.com, and www. Adobe.com/Adobe/accessibility
    for further information on color accessibility.'
  merge: -1
  pgno: 229
