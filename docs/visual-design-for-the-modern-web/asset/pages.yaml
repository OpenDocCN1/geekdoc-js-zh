  md: '# 246 VISUAL DESIGN FOR THE MODERN WEB


    # TABLE 6.2 WEB FILE FORMATS


    | JPG (.jpg or .jpeg) | GIF (.gif) | PNG (.png) |

    |---|---|--|

    | Compression algorithm | Compression best suited for continuous-tone images as
    photos. | Compression best suited to flat-color images such as line drawings and
    cartoons with horizontal lines and minimal patterns and gradients. | Compression
    best suited to flat-color images as line drawings and cartoons with minimal patterns
    and gradients. |

    | Variable compression | Yes | Yes, but only limiting the number of colors in
    an image. | Yes, but only limiting the number of colors in an image. |

    | Lossless save | No: alters colors, sharp edges, and introduces artifacts in
    flat-color areas. | Yes | Yes |

    | Number of colors per image | True color (16.8 million colors) | 256 color-mapped
    "palette" images | 256 color-mapped "palette" images; True color (16.8 million
    colors) |

    | Transparency | No | Index transparency (binary, either on or off) | Index transparency
    (binary, either on or off); Alpha transparency (256 levels), but results in large
    file sizes and is not widely supported. |

    | Animation | No | Yes | No |

    | Interlacing | Yes, but JPG''s progressive interlacing is not widely supported.
    | Yes | Yes |


    # Acquiring Images


    Often, we are responsible for obtaining images for a site, whether for decoration
    (like a logo) or for information delivery (a picture of a product). Although we
    might create some images from scratch, many need to be digitized (somehow captured
    from the real world). A logo on paper or a standard photo might need to be scanned
    into a digital format, or we might take a photo with a digital camera as a way
    of bypassing the hassle of developing standard camera film. We will look at image
    sources: commercially available stock photos and clip art, screen capture software,
    scanners, and digital cameras.


    # Stock Photos and Clip Art


    Some sites that offer stock photos and clip art are quite expensive, while others
    are either free or charge a very minimal fee, such as only dollar or two per image.'
