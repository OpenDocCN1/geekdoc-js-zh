  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   ■ Paint samples and palette brochures from paint and decorating stores.

    ■ Fabrics in decorating stores.

    ■ Reference books for artists.

    ■ A box of Crayons.


    # CRAYOLA CRAYONS


    A box of crayons can be an excellent color reference. Buy the biggest box you
    can find for everyone on the development team.


    Rip the pages out of magazines and save them in a "tickler" file for future reference.
    If you see a photo that inspires you, purchase a tiny sample and stick it in your
    file, too. Carry a small digital camera with you to capture real-world inspirations
    (say, the exterior of a building, the lobby of a beautiful hotel, or a gorgeous
    fall landscape) that won''t fit in a folder. Pilfer Unlike graphics and content,
    color schemes are not copyright-protected. If you find a scheme you like and can
    tweak it to what makes you, then by all means, do so.


    Another way to choose colors is to pick them out of a photo or graphic that you
    have already chosen for the site. A photo of a woman wearing a red sweater might
    lead to a color scheme of red (from the sweater) and tan (from skin tones).


    # Color Contrast


    Contrast is the degree of difference between the various color attributes. As
    examined in Chapter 4, contrast is used to emphasize some items while deemphasizing
    others. We can use the four color attributes discussed earlier in the chapter
    to create:


    +   ■ Hue: complementary colors, such as blue and orange, have the greatest contrast.

    ■ Value: lighter colors contrast with darker colors, like pale lavender versus
    dark purple.

    ■ Saturation: Highly saturated colors contrast with colors of low saturation,
    like a bright Kelly green versus a dark forest green.

    ■ Temperature: Warm colors (yellow, orange, red) contrast with cool colors (purple,
    blue, green).


    Both extremely high contrast and extremely low contrast pages can be challenging
    to read. Think of the high contrast of red on green, or the low contrast of yellow
    on white, and you can envision the difficulty.


    For maximum legibility, foreground elements like text and graphics should have
    contrast in value with the background elements. For instance, black text on a
    white background offers excellent readability. Swapping the white for a pale yellow
    background would still work. However, placing that black on a navy blue background
    would be almost illegible because there is only negligible contrast in value between'
