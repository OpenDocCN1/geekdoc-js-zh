- img_proc: true
  md: '# Site Maps, Tables of Contents, Indexes, and Directories


    For larger, more complex sites, a hot (linked) site map, table of contents, index,
    or directory can help users who can''t find what they need in any other way. A
    traditional map shows the site''s hierarchy, while an index or directory is usually
    only a single depth. A simple text-based outline format (FIGURE 3.27) is ideal
    for its clarity, fast and ease of maintenance, while still reinforcing the site''s
    organization.


    ![](img/ee113e5612d290709e494a0dae247fc5_127_0.png)


    FIGURE 3.27 Site Map Map (www.google.com)


    # Breadcrumbs


    Breadcrumbs are a simple trail of text links that illustrate the visitor is in
    the site hierarchy and provide an easy way to traverse back up the hierarchy.
    For instance, if the visitor is attempting to purchase bedding, the breadcrumbs
    for the page selling sheets might look like this:


    Home Décor > Bedding > Sheets


    Both “Home Décor” and “Bedding” are clickable text links that take the user back
    up the hierarchy. “Sheets” is not a hyperlink because it refers to the current
    page.


    Although breadcrumbs might be overkill on smaller sites, they can be a life-saver
    for larger, more complex sites, just as they were intended to be for Hans and
    Gretel.


    ![](img/ee113e5612d290709e494a0dae247fc5_127_1.png)


    BREADCRUMBS IN DREAMWEAVER


    To build the skeleton for breadcrumbs in Dreamweaver, choose Window > Snippets
    > Navigation > Breadcrumb, and then either “>” or “:” as the separator between
    levels.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Keyboard Shortcuts


    In web parlance, keyboard shortcuts (key combinations that perform the same as
    clicking on a link) are particularly valuable for frequent visitors (although
    occasional visitors typically won''t bother with them) and for visitors who are
    physically unable to use a mouse. with an associated keyboard shortcut might look
    something this:


    Northern Illinois University (Alt+N)


    In some browsers, the keyboard shortcut puts focus on the element but doesn''t
    actually activate it. In such cases, the visitor would still need to press the
    "Enter" to trigger a link.


    To create a keyboard shortcut, add accesskey="N" to the <a> tag, if "N" is the
    key to trigger a link.


    ```

    <a href="http://www.niu.edu accesskey="N">

    ```


    Northern Illinois University/<a> (Alt+N)


    # Splash Pages


    A splash page is a page that loads before or while the home page loads (FIGURE
    3.28). Most of the time, a splash page is intended for nothing more than entertaining
    the visitor. Times, though, it has a real purpose, which is to stall while the
    site''s system specifications (browser and version, available plug-ins, cookies,
    etc.). Because splash pages take time to load and delay visitors in their mission
    to accomplish a task, they are another controversial issue. Many designers as
    well as web surfers adam oppose their use.


    FIGURE 3.28 Splash Page (www.PandaExpress.com)


    ![](img/ee113e5612d290709e494a0dae247fc5_128_0.png)'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'If you have to use a splash page, make sure that it has an artistic sense such
    as it:


    +   - Adds to the character of the site enough to justify the extra download time.

    - Downloads as quickly as possible.

    - Can be easily bypassed if the visitor chooses to do so, as illustrated with
    the “Skip” link on Figure 3.28. Even if the page is incredibly entertaining on
    the first visit, it’s usually just an unnecessary aggravation on the fifteenth
    or fift visit.


    # # Favorites Menus


    If a visitor bookmarks a page in your site, the page title is the default name
    for the “Favorites” entry. Consequently, it’s critical to be concise and descriptive,
    because “Favorites” descriptions are smaller than even the descriptions allowed
    for SERPs.


    A favicon is a custom icon that appears next to the site name for favorites menus,
    on the desktop, and under the taskbar. FIGURE 3.29 displays a portion of favorites
    menus showing such icons.


    ![](img/ee113e5612d290709e494a0dae247fc5_129_0.png)


    FIGURE 3.29 Favorites Menu with Favicons


    You can create a custom favicon using special software. Favicons are more reliable
    at 16 x 16 pixels and should be saved under the name favicon.ico in the same directory
    as the home page. Keep in mind that the favicon will appear retroactively if the
    site was bookmarked prior to the favicon’s creation. That is, the favicon must
    be present at the time the site is actually bookmarked for it to ever appear on
    the visitor’s computer.


    # CREATING A FAVICON


    See www.webdevelopersjournal.com/articles/favicon.html, www.favicon.com, or www.irfanview.com.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Link Reliability


    Navigation is worthless if it doesn''t take the visitor somewhere. Jakob Nielsen,
    a usability guru, warns against linkrot, a terminal web disease with the presenting
    symptom of dead links. Linkrot is one of the fastest ways to convince your visitors
    that your site is unreliable. Make sure your links are functional before you implement
    the site (Dreamweaver has a utility to check links sitewise), recheck every link
    after you deploy to the server (because links work locally during development
    may very well break on the server), and recheck all links (particularly external
    links) periodically after that.


    Even though development environments like Dreamweaver make it easy to reorganize
    your site''s structure, being exceedingly cautious about doing so if your site
    is already up on the web. Reorganizing or renaming means users who have already
    marked your site and search engines who have already indexed it will be presented
    with the dreaded "404: File not found" page, as seen in FIGURE 3.30.


    Figure 3.30 Error 404: File Not Found


    ![](img/ee113e5612d290709e494a0dae247fc5_130_0.png)


    If you must reorganize, you can override the standard 404 page with your own custom
    404 HTML page that displays the organization''s name and logo, a link to the home
    page, any other discernible information about the bad URL, and an email link for
    help. FIGURE 3.31 shows a non-technical, reassuring, and tongue-in-cheek custom
    404 page that plays off a site''s sailing theme. Although one could argue that
    it should also include the site''s logo, the page still serves its purpose: to
    entice last visitor back into the site with links to the site index, site map,
    and search area.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# CHAPTER THREE Navigation 123


    FIGURE 3.31 Rerouting a Moved Page (with kind permission from Diederik Willemsen
    of www. sailingscourses.com.)


    ![](img/ee113e5612d290709e494a0dae247fc5_131_0.png)


    Not all web servers support 404 pages; check with your server administrator. If
    allowed, you''ll have to follow the rules of your server as the name and location
    of the 404 page. In some cases, you''ll have to edit an existing server utility
    to point to the error page.


    Once you''ve uploaded the required files, test the new error page by typing in
    a URL that includes your valid domain name but a nonexistent path or file name.
    You should see your custom page, ready to help any lost and confused visitors
    who might otherwise give up on your site.


    # Navigation and Accessibility


    Some users will be unable to take advantage of your site unless you design the
    navigation for maximum accessibility. There are, of course, guidelines for making
    navigation accessible:


    +   - Use a consistent layout style on all pages, so that visitors can find what
    they are looking for more easily. Of course, all visitors, not just those with
    physical impairments, benefit from a consistent layout style.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   - Include alt attributes on all navigation images. Both the text on the image
    and the alt attribute should state the link destination with consistency and brevity;
    screen readers articulate every word, even the unnecessary ones, which can delay
    voters. References to the image from elsewhere on the page should refer to the
    alt text rather than to any visual attributes of the image:

    - Unacceptable: "Click the green button."

    - Acceptable: "Click the ''Go'' button" (if "Go" is the label on the button as
    well as the value of the alt attribute).

    - Use client-side image maps as shown in this chapter, server-side image maps
    also offer equivalent text links, because screen readers can''t help the visually
    impaired find the hotspot on an image map.

    - If you are using frames, include a descriptive title attribute on the frameset
    and each frame:

    ```

    <frames cols="30%, 70%" title="Web Design Aesthetics">

    <frame src="navigation.html" name="navigation" id="navigation" title="navigation
    area" />

    <frame src="currentPage.html" name="content" id="content" title="content area"
    />

    </frames>

    ```

    - Make sure that would still be obvious if all color were removed. Text links
    in bright red and content text in bright green, for instance, look identical to
    a visitor with red-green blindness. Include other navigational affordances such
    as underline, boldface, italics to ensure that color is not critical to recognizing
    navigation.

    - Drop-down menus that display only on rollover are particularly challenging for
    screen readers. One alternative is to make the link that triggers the drop-down
    clickable as well. Such a click delivers an alternative menu-only page displaying
    the same links as the drop-down menu.

    - Include some kind of visual and readable content between two adjacent text links;
    spaces alone aren''t enough. Something as simple as the "|" symbol from the keyboard
    is adequate. For instance:

    Not acceptable: Home Products Job Opportunities

    Acceptable: Home | Products | Job Opportunities

    - Provide as many alternative navigation methods as possible, including a search
