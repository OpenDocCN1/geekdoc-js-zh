  md: '# Navigation


    JAKOB NIELSEN, WWW.USEIT.COM/ALERTBOX/991003.HTML:


    Jakob''s Law of the Web User Experience: “Users spend most of their time on other
    sites, so that''s where they form their expectations for how the Web works.”


    The greatest site architecture is irrelevant if no one can figure out how to access
    the pages in that architecture. Web surfers are impatient—they want to get to
    the good stuff effortlessly. They rarely expend any time figuring out unwieldy
    navigation; it''s so much easier to ask Google to suggest another site. As a result,
    navigation must help visitors to find what they want easily. If, as a side benefit,
    you can expose them to what you want them to discover, so much the better.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    # QUIPS AND QUOTES


    "Navigation is Information made visible." —From Information Architecture: Blueprints
    for the Web, by Christina Wadtke.


    In this chapter, we will look first at principles and guidelines for navigation,
    including the overall navigational structure of the site, types of links, link
    states, and link affordances (visual cues). We will then go on to examine the
    specifics of both navigational text and navigational images, and finally, we will
    organize both types of navigation into such menus and site maps.


    # Introduction to Navigation


    Introduction should do the following:


    +   - Provide a conceptual map of the site. A visitor should be able to make a
    mental model of the site structure.


    +   - Give feedback as current location: “You are here.” In other words, show
    visitors where they are currently located in relation to the other site. Psychologists
    call this grounding: locating a known reference point in a foreign information
    space. Page titles, color-coded sections of the site, a disabled link for the
    page that is currently loaded, and breadcrumbs (more on all this later) serve
    as current location markers.


    +   - Remind the visitor how or she got there: “You were there.” Breadcrumbs as
    well as a disabled link (but left intact in the menu system) give the visitor
    some idea of how he or she got to the current page.


    +   - Help the visitor find what he or she wants: “You want to go there.” After
    all, that’s the point, isn’t it? A logically-structured hierarchy with clear categories
    and labels, along with secondary navigation aids such as a search function and
    site map, to render the visitor’s quest peaceful.


    +   - Make the visitor aware of others on your site: “You could go there, if you’re
    interested.” The navigation should point out other interesting content on the
    site. Think of navigation as serving the same function as a table of contents
    of a magazine; both provide an introduction to what is available on the pages—the
    stuff you were looking for, and the stuff you might be happy or surprised to find
    as well.


    All of these considerations facilitate wayfinding, the process visitors use to
    find what they need. We use all the same general wayfinding techniques whether
    we are navigating a web site or the Mall of America.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Navigation Principles


    We are going to look at several general principles that underlie every decision
    in designing navigation:


    +   - Create simple, visible, consistent navigation.


    +   - Take advantage of what visitors already know.


    +   - Orient visitors with “You Are Here” markers.


    +   - Minimize visitor effort.


    +   - Provide multiple ways to access information.


    +   - Provide for visitors with varied skill levels.


    +   - Make sure the navigation is flexible and expandable.


    # Create Simple, Visible, Consistent Navigation


    Navigation should be instantly recognizable as navigation—don’t force visitors
    to “scrub” the cursor over the entire screen to find an unidentified hotspot (link).
    It might be intriguing on an artsy “experience” site, one designed for entertainment,
    but it’s not all acceptable for a mainstream ecommerce site.


    Don''t worry the look, placement of navigation from page to page unless you have
    some overwhelmingly good reason to do so. The number and order of links shouldn''t
    be altered, because menus that appear on one page disappear on another page are
    confusing to users. For instance, the link to the current page shouldn''t disappear
    from that page’s menu, because changing the structure from page to page confuses
    visitors. After all, the grounding you are “here” mark on the site structure.
    However, you disable the current link (simply remove the <a> tag) and somehow
    alter it visually (for example, gray it out) so it’s no longer clickable.


    Navigation labels should be consistent as well. For instance, don’t call a person
    who belongs to a health “club” on one page, a “participant” on another page, and
    a “visitor” somewhere else. Use a preferred term and stick to it. Also be consistent
    in punctuation, spelling, capitalization, and grammar usage (all labels starting
    with either a verb or a noun, for instance).


    Finally, remember that the label within the <a> tag is a promise, really, and
    we shouldn''t make misleading promises. We need to be clear to visitors what they
    are going before they get there.


    > QUIPS AND QUOTES

    Web Pages That Suck, Vincent Flanders and Michael Weiss term unidentied links
    as “mystery navigation.”'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Take Advantage of What Visitors Already Know


    If we unexpectedly changed all stop signs in the United States to blue triangles,
    the most likely result would be uncountable nasty collisions. If we instead erected
    red circle signs, the results would probably be less disastrous—drivers would
    leverage their knowledge of red octagons and perhaps figure out that the very
    similar circles had a similar meaning. The point this story tries to make is that
    we have a better shot at making unusual navigation elements understandable if
    they have at some characteristics in common with the tried and true standards.


    Keep in mind that the obvious benefit to any new standard, the more willing users
    will be retrained themselves. For example, you would be learning a completely
    new computer keyboard layout if it eventually provided you with a 10% increase
    in typing speed? No? What if it doubled your speed? Quadrupled it? Yes, it would
    have to provide quite a bit of benefit before any of us were motivated to invest
    the time and effort required to learn the new system. The same holds for true
    navigation systems on web pages. To leverage what the visitors already know and
    assume, even if you choose to change something.


    # Orient Visitors with “You Are Here” Markers


    The visitor needs to know his or her position in the site at all times. Imagine
    being dropped into the middle of Kansas, without signs telling you where you are.
    Visitors can be similarly baffled when dropped into a lower-level page from a
    search engine results page. They need a sense of place—a sense of where they are
    located in the hierarchy of the site and where they can go next within that hierarchy.
    “You are here” indicators, like the site logo, page title, page header, and a
    disabled menu link to the current page, can provide this guidance.


    # Minimize Visitor Effort


    If you force visitors to log in or download a special plug-in to enter a site,
    you might lose them. Visitors will endure such exertion only after they''ve been
    convinced there is some compelling personal benefit. Until then, they would bail
    out of the site.


    Just as importantly, visitors don''t want to click through endless pages to get
    where they want to go. However, clicks that are unambiguous, lead them to information
    of high personal value, or somehow reassure them that they are close to goal are
    usually tolerated.


    The “Poorly Designed Workflow” sidebar shows a site that required numerous clicks
    and separate page loads just to buy a set of matching bedsheets.'
  merge: -1
