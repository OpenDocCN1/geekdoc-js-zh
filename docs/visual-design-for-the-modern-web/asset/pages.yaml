  md: "**CHAPTER EIGHT** Forms\n\n**333**\n\nIn contrast, *modeless *feedback requires\
    \ nothing of the visitor. Examples include using \n\nCSS’s a:link to indicate\
    \ that a click has been recognized, or providing a small anima-\n\ntion that indicates\
    \ progress as a ﬁ le is downloading. The visitor need not dismiss the \n\nwindow\
    \ when the activity is completed; transaction ﬂ ow moves on to the next page \n\
    \nautomatically. Particularly when the activity requires a long wait, feedback\
    \ such as \n\nthis reassures the visitor that something is indeed happening. A\
    \ similar type of feed-\n\nback, but not requiring animation, might be to indicate\
    \ how far a step-by-step process \n\nhas progressed, such as “You’ve now completed\
    \ Page Three out of ﬁ ve pages.”\n\nSince modal feedback interferes with the ﬂ\
    \ ow of an activity and requires the extra \n\neffort of a response from a visitor,\
    \ avoid it whenever possible. For instance, you should \n\nnormally avoid popping\
    \ up a dialog box to report a normal condition, such as recogni-\n\ntion of a\
    \ valid password. Instead, simply proceed with the task. Use modal feedback \n\
    \nwhen you need to interrupt the ﬂ ow of an activity, either to double-check an\
    \ action \n\n(“Are you sure you want to delete this ﬁ le?”) or to notify of a\
    \ critical error condition \n\n(“Your credit card has expired. Please contact\
    \ your credit card company.”).\n\nError Handling\n\nWe should design our site\
    \ to cope with errors gracefully when they do occur, a pro-\n\ncess called *contingency\
    \ design*, or “when bad things happen to good people.” \n\nError messages should:\n\
    \n■ Be helpful—state what the error is, what its implications are, and precisely\
    \ what \n\nthe visitor should do to rectify the problem.\n\n■ Be clear and worded\
    \ in non-technical language recognized by the visitors. Error \n\ncodes by themselves\
    \ are of little use to visitors, although they might be useful \n\nto your support\
    \ staff. Even if we display error codes for internal use, we must \n\nexplain\
    \ the error in a way that can be understood by the general public. “Our \n\nUNIX\
    \ server doesn’t recognize URLs with embedded spaces” is not only confus-\n\n\
    ing, but isn’t at all helpful. “Please use only alphabetic letters, numbers, and\
    \ \n\nunderscores” frames the same error in terminology that anyone can understand\
    \ \n\nand utilize. (Better yet, tell them that *before* they’ve entered the data.)\n\
    \n■ Be concise. As we’ve already discussed, extraneous information merely obscures\
    \ \n\ncritical information. \n\n■ Be polite, tactful, non-accusatory, and apologetic.\
    \ Error messages should \n\nnever, ever, blame the user for the problem, even\
    \ subtly. Instead, the site should \n\nshoulder the blame. After all, had our\
    \ directions been clear enough, the error \n\nprobably wouldn’t have occurred\
    \ at all. \n\n■ Avoid being funny, cute, or obnoxious. A visitor at a crisis point\
    \ rarely appreci-\n\nates humor.\n\n**MODAL AND **\n\n**MODELESS **\n\n**FEEDBACK**\n\
    \nModal and modeless are \n\ndefined by Alan Cooper \n\nin *About Face 2.0: *\n\
    \n*The Essentials of Interac-*\n\n*tion Design. *\n\n**MODAL AND **\n\n**MODELESS\
    \ **\n\n**FEEDBACK**\n\nModal and modeless are \n\ndefined by Alan Cooper \n\n\
    in *About Face 2.0: *\n\n*The Essentials of Interac-*\n\n*tion Design. *\n\n**TIP**\n\
    \nFocus the cursor on \n\nthe field that requires \n\ncorrection.\n\n**TIP**\n\
    \nFocus the cursor on \n\nthe field that requires \n\ncorrection."
