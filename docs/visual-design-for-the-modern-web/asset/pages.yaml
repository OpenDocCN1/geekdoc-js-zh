  md: '# 96 VISUAL DESIGN FOR THE MODERN WEB


    In Chapter 6, we''ll look at graphics in general, irrespective of your various
    uses. In this section, we will look only at issues specific to navigational images
    such as buttons, icons, image maps, and sliced images.


    # Affordances for Navigational Images


    We recognize immediately that a rounded rectangle with a bevel effect and a text
    label is a link because it uses several of the following affordances:


    +   Symmetrical shapes, particularly circles, rectangles, ovals, and rounded angles
    (shown in FIGURE 3.10 in order by increasing degrees of "button-ness")


    FIGURE 3.10 Navigational Graphics affordances


    ![](img/ee113e5612d290709e494a0dae247fc5_104_0.png)


    +   - Labels that seem to be navigational.

    - 3-D bevels, such that the element looks like a raised or depressed button.

    - Drop shadows, which further enhance the real-world look of the button.

    - Rollover/mouseover effects.

    - A picture or icon that shows a real-world object, such as a picture of a "print
    page" icon.

    - Autonomy (isolation from non-navigational content) as well as grouping of the
    symbol. An example of autonomy would be a vertical row of buttons down the left
    side of a window; the isolation of the cluster implies that the cluster is some
    sort of a menu.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# CHAPTER THREE Navigation 97


    One of these characteristics alone might not make an object appear to be navigational
    graphic. For instance, we might need to add a drop shadow to a header without
    visitors assuring it''s navigation. By starting multiple affordances, as is the
    case in the lower right corner of Figure 3.10, and visitors would be surprised
    (not to mention aforementioned) if the image were not clickable. Therefore, avoid
    layering affordances on non-navigational elements.


    # Image Rollovers


    Rollover/mouseover effects are an expected feature of navigational images these
    days. An image rollover effect uses JavaScript to swap the original image with
    a new image. Common rollover effects include the simulation of movement (such
    as the depression of a button), a text or background color change, a surrounding
    glow, increasing or decreasing the size of a drop shadow, brief animation, or...well,
    you will get the idea. The good news is that we don''t need to write JavaScript
    for the rollover/ Dreamweaver and other development environments do it for us.


    In any graphic rollover, the original image and the swapped-in image should be
    exactly the same size (make specify height and width attributes on the image HTML).
    Also, don''t change any characteristics of the image accidentally. For instance,
    if the only thing that is intended to change on rollover is the color of the button,
    then neither the text nor the button itself should accidentally shift by so much
    as a pixel. The resulting bobble would look amateurish.


    # Navigational Icons


    Navigational icons (small, stylized pictures or symbols) are by their very nature
    designed to take up minimal real estate. Some icons seem to be universally understood
    these days, as a shopping cart icon, a printer icon, or the question mark as a
    "Help" from a few standard symbols such as these, icons can be ambiguous and mysterious,
    rendering them as completes, rather than replacements for text. For the irony
    of icons is that if they need a text description to make them clear, they no longer
    conserve space on the screen, or if they still, provide a quick shortcut, as "eye
    catcher" if you will, for repeat visitors who are familiar with the icons and
    who therefore don''t need to bother reading the descriptions.


    Creating clear, understandable icons is incredibly challenging because they need
    to be so tiny. Check out symbol-based fonts, as Webdings and Wingdings, for symbols
    that can be used as icons.


    ![](img/ee113e5612d290709e494a0dae247fc5_105_0.png)


    > BONUS TOPIC: Creating Graphic Rollovers


    > See the web site for a tutorial using Fireworks in conjunction with Dreamweaver
    to create a button and insert it into an HTML file.


    > BONUS TOPIC: Keyboard Equivalents for Common Symbol-based Fonts


    > See the web site for a Word document that provides the keyboard equivalents
    for the most common symbol-based fonts.


    ![](img/ee113e5612d290709e494a0dae247fc5_105_1.png)'
