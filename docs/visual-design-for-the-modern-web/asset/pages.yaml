  md: '# CHAPTER FOUR Page Layout 131


    # FYI: STATISTICS FOR HOUSEHOLDS WITH BROADBAND ACCESS


    We will not look at general statistics for broadband access here, because they
    are of only limited use. For one thing, the statistics are changing rapidly. For
    another, we usually list total numbers of households rather than more useful statistic
    for percentage of broadband users versus slow connection users. The statistics
    also do not account for the fact that many users take advantage of broadband connections
    at work rather using slower connections at home. And finally, generic statistics
    may well have bearing on the statistics for your particular target audience—there
    is simply no substitute for understanding that target audience.


    When considering or not to allow larger files, realize that it''s likely you will
    lose at least some portion of your image. Make sure that understand what percentage
    of visitors you are losing, and also that the level of loss is acceptable before
    proceeding.


    # Planning for Limited File Sizes


    How do you plan ahead for limited file sizes? Although we will look at specific
    guidelines relating to issues like optimizing graphics in later chapters, a few
    hints are helpful now, at the inception of a project:


    +   Pull out most of the CSS and JavaScript into external files. These are downloaded-only
    the first time they are referenced on a site. From then on, they can be reused
    by all other pages in the site, without further download limits.


    +   Reuse graphics, audio, and video from page to page, because they, too, are
    downloaded only the first time they''re referenced.


    +   Don''t use gratuitous graphics, animation, or sound. Each file should have
    a clear reason for being on the site, for utilitarian purposes or for enhancing
    the site''s appeal. A large, attractive image used for navigation has both practical
    and aesthetic purposes, as pictures of products for sale. On the other hand, a
    graphic that is just filling space should be eliminated.


    +   Use small images rather than larger ones whenever possible, because all factors
    being equal, small images download faster than large images. For example, you
    might use a small image that tiles (repeats) across the background instead of
    a single, large background image.'
