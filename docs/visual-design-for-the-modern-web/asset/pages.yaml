    # Menu Appearance


    A menu that appears on multiple pages in the site should be structurally identical
    from page to page. That is, each page should present the same links, in the order,
    and in exactly the same place on the page. The menu items shouldn''t move, not
    even a single pixel, and we should never remove or change the order of menu items
    as the user moves from page to page. A menu on which things seem to magically
    appear, disappear, or float around will baffle visitors.


    A menu should stand out from the page enough that the visitor can easily identify
    it while at the same time not stealing focus away from content. Menus can be indicated
    by:


    +   - Containing the items within a border or a block of a different background
    color.'
