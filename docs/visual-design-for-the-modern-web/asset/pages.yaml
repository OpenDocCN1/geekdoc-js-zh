- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    # HTML REVIEW: FRAMES


    ```

    <frameset rows="100,*" title="Web Design Aesthetics">

    <frame src="logo.html" name="logo" id="logo" title="Logo Area" />

    <frameset cols="120,*" title="Web Design Aesthetics">

    <frame src="navigation.html" name="navigation" id="navigation" title="Navigation
    Area" />

    <frame src="content.html" name="content" id="content" title="Content Area" />

    </frameset>

    </frameset>

    ```


    This specification creates a web page divided as in FIGURE 3.25.


    **FIG. 3.25** Three Frames. Table borders are turned on for illustration.


    ![](img/ee113e5612d290709e494a0dae247fc5_120_0.png)


    Let''s look first at the myriad disadvantages of frames:


    +   - A page with multiple frames must load multiple HTML documents, which of
    course takes extra time.

    - When navigation is in one frame and content in another, it takes quite a bit
    of custom work with JavaScript to disable the current link so that users aren''t
    confused or inconvenienced by accidentally reloading the current frame.

    - The location bar reflects the frameset URL, not the URL of the content frame,
    which can confuse visitors.

    - Frames disrupt identification of visited versus unvisited links as well as bookmarks/favorites
    in the browser.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '+   The browser''s "Back" and "Forward" buttons no longer function as visitors
    might expect.


    +   Although a visitor can print an individual frame, he or she might not get
    the expected content if the cursor is not positioned properly on the page.


    +   Search engines have problems indexing "framed" sites.


    +   Frames have unique security issues; each frame can potentially have different
    permission levels, which can be complicated to manage.


    +   If the page is designed with all of the navigation in one frame and all of
    the content in another, the visitor might be unable to move around the site if
    the navigation frame errors out in some way.


    Of course, there must be some advantages to using frames, or they would have disappeared
    long ago. Here are a few:


    +   We have control over what is on display on the page; for instance, we can
    make sure the identification banner, page header, and menu system are always visible.
    Consequently, the user doesn''t have to scroll all the way back to the top to
    move on. Roughly, a simple set of text links at the bottom of the page could solve
    this issue without frames.


    +   When the document in the content frame changes, only that content is downloaded.
    The content document is smaller because the identification banner and menus have
    been stripped out to a separate frame or frames. Thus, the content document downloads
    faster.


    We can duplicate many of the effects of frames using CSS to position <div>s so
    that the <div> containing the identification and menus are always present, with
    another scrolling <div> containing the content. The debugging for this kind of
    layout is likely more involved than debugging a table-based layout.


    The bottom line is that we should use frames only if there is an overwhelmingly
    good reason to do so. Determine whether frames make the site easier to navigate,
    which might be a good reason to rely on. If all that is required is partitioning
    the page into chunks, then tables or <div> are far better choices.


    If you feel you use frames, there are some hints that will make them more user-friendly:


    +   If you set up a vertical frame for navigational images, be sure that the frame
    is an exact pixel count wide, large enough to hold each image. If you use a percentage
    instead, the navigation might be cut off on small windows.'
  merge: -1
