    # Identify the Target Audience


    Let us not forget the most important stakeholder of all, our potential visitors.
    All communication events, whether in print, television, or on the web, should
    be aimed at a target audience. Identifying the target audience is second in importance
    only to defining the goals of a site. After all, you can''t meet the needs of
    an audience if you don''t know who that audience is.


    Accordingly, we now ask, who are the people most likely to frequent the site?
    Identifying a target audience isn''t necessarily easy in the worldwide, heterogeneous
    universe of the web. Sometimes it''s hard to ascertain which country our audience
    resides in, much less more specific data. Still, it can be done, as any marketing
    guru would be happy to tell you. Sometimes it''s just common sense, while at other
    times it requires extensive research.'
