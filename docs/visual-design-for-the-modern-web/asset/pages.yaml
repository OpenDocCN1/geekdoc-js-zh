  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**296**\n\n■ Use proper “curly” quotes:\n\
    \n Example: “curly quotes” versus \"straight quotes\" \n\n HTML codes: \n\n Curly\
    \ left double quote: &ldquo; or &#8220;\n\n Curly right double quote: &rdquo;\
    \ or &#8221;\n\n Curly left single quote: &lsquo; or &#8216;\n\n Curly right single\
    \ quote: &rsquo; or &#8217;\n\n■ Use the true ellipse (…), which is a single symbol,\
    \ as opposed to three separate \n\nperiods (...). \n\n Example: “em dash, en dash,\
    \ curly quotes…”\n\n HTML code: &ellip; or &#8230;\n\n■ Use HTML codes for other\
    \ special characters as appropriate. For example, you \n\nmight want to embed\
    \ an ampersand, “&” (&amp;), a space (&nbsp;), or a copy-\n\nright symbol “©”\
    \ (&copy;). See the book’s web site for a listing of other codes.\n\n UPPERCASE\
    \ AND LOWERCASE NUMERALS, FOR THE TYPE-OBSESSED\n\n**Yes, believe it or not, some\
    \ typefaces come with uppercase numerals (all the same **\n\n**size; also called\
    \ *****lining numbers*****), while others come with lowercase numerals (with **\n\
    \n**ascenders and descenders; also called *****hanging numbers *****or *****oldstyle\
    \ figures*****):**\n\n■ **Verdana includes uppercase numerals: **123456789\n\n\
    ■ **Georgia includes lowercase numerals: **123456789\n\n**Uppercase numerals appear\
    \ too tall and blocky when mixed in with lowercase **\n\n**letters, while lowercase\
    \ numerals hang inappropriately below a line of otherwise **\n\n**blocky uppercase\
    \ letters. Examples:**\n\n■ **Unacceptable: different case letters and numbers\
    \ **\n\n■ **UPPERCASE LETTERS WITH LOWERCASE **123456789** NUMBERS **\n\n■ **Lowercase\
    \ letters accompanied by uppercase 123456789 numbers**"
  merge: -1
  pgno: 304
- img_proc: true
  md: "**CHAPTER SEVEN** Typography** 297**\n\n■ **Acceptable: same case letters and\
    \ numbers **\n\n■ **UPPERCASE LETTERS WITH UPPERCASE 123456789 NUMBERS **\n\n\
    ■ **Lower-case letters accompanied by lowercase 123456789 numbers **\n\n**Since\
    \ most typefaces include only uppercase or only lowercase numerals, **\n\n**we\
    \ usually need to change typefaces to fix the mismatch.**\n\nGraphic Text\n\n\
    Graphic text is text created in an image-editing program like Photoshop or \n\n\
    Fireworks, saved as an image and then embedded in HTML using <img /> tags. \n\n\
    **FIGURE 7.9**, repeated from Chapter 6, shows just some of the effects and ﬁ\
    \ lters \n\nthat can be applied to graphic text. (See Chapter 6 for more information\
    \ on creat-\n\ning such images.) \n\n![](img/ee113e5612d290709e494a0dae247fc5_305_0.png)\n\
    \n**FIGURE 7.9 **Effects for \n\nGraphic Text\n\n**FIGURE 7.9 **Effects for \n\
    \nGraphic Text"
