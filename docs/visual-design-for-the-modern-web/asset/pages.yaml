  md: "**CHAPTER EIGHT** Forms\n\n**341**\n\n■ Make documentation apparent but unobtrusive?\n\
    \n■ Use a consistent vocabulary?\n\n■ Include the title attribute on form elements\
    \ to provide concise instructions \n\non rollover?\n\n**Help—*****Did you:***\n\
    \n■ Use contextual help whenever possible?\n\n■ Provide a hot-linked table of\
    \ contents or site map, and a search function for \n\nlarger Help systems?\n\n\
    **Feedback—*****Did you:***\n\n■ Provide feedback, particularly for long waits\
    \ and errors? \n\n■ Use modeless, rather than modal, feedback whenever possible?\n\
    \n**Error Handling—*****Did you:***\n\n■ Provide error messages that are helpful,\
    \ clear, non-technical, concise, polite, \n\ntactful, non-accusatory, apologetic,\
    \ and visible?\n\n■ When a server-side error is encountered, either redisplay\
    \ the entire form or just \n\nthe subset of controls that are in error?\n\n■ Display\
    \ an error message on the same page as the ﬁ eld that needs to be corrected?\n\
    \n■ Remember that successful resolution of a problem builds stronger customer\
    \ \n\nloyalty than delivering a product that performs ﬂ awlessly?\n\n**Accessibility—*****Did\
    \ you:***\n\n■ Whenever possible, place labels to the left of controls, or associate\
    \ the label and \n\nits control with the <label> tag?\n\n■ Surround related form\
    \ elements with <ﬁ eldset> tags and include the <legend> \n\ntag for labeling?\n\
    \n■ Avoid populating controls with instructional text as the default value?\n\n\
    ■ Avoid using list boxes when multiple choices are possible (i.e., using the \n\
    \nmultiple attribute)?\n\n■ Avoid setting the default value for a single yes/no\
    \ checkbox to “yes”?\n\n■ Use the title attribute to provide tooltips on rollover?"
