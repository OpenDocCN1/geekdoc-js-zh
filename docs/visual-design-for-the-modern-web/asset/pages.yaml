  md: "**CHAPTER EIGHT** Forms\n\n**321**\n\nAvoiding Multiple Submissions\n\nWhether\
    \ using a browser-supplied or a custom Submit button, we don’t want the \n\nform\
    \ to be accidentally submitted multiple times. We’ve all seen web pages that \n\
    \nwarn the visitor not to click a Submit button twice. Unfortunately, if the submission\
    \ \n\ntakes more than just a second or two, the visitor is left wondering if the\
    \ click actu-\n\nally registered. At the same time, he’s afraid to click a second\
    \ time—after all, he’s \n\nbeen warned of dire consequences if he clicks that\
    \ second time. Just how long does \n\nthe visitor wait in a case like this?\n\n\
    There are two user-friendly ways to avoid causing our visitors this kind of angst:\n\
    \n■ Immediately reassure visitors with feedback that the form is in the process\
    \ of being \n\nsubmitted, often done with some type of small animation. This is\
    \ a great way, under \n\nany circumstances, of reassuring visitors that something\
    \ is indeed happening. \n\n■ Use JavaScript to disable the Submit button after\
    \ it’s clicked, thereby prevent-\n\ning a double submission. See the sidebar for\
    \ the code. \n\n DISABLING A SUBMIT BUTTON\n\n**Add the following to the **<form>\
    \ **tag: **\n\nonsubmit=”this.submitButtonName.disabled=true” \n\n**Be aware that\
    \ you might have to trace a hierarchy of path names to get to the but-**\n\n**ton,\
    \ if it’s embedded within other elements like a table, and that the page would\
    \ **\n\n**need to be reloaded completely to re-enable the Submit button. Getting\
    \ this to **\n\n**work might be a bit trickier than it appears if you’re unfamiliar\
    \ with JavaScript **\n\n**and the Document Object Model (DOM).**\n\nReset Buttons\n\
    \nReset buttons clear a form’s controls back to their initial values upon page\
    \ load. Like \n\nSubmit buttons, Reset buttons can be browser-supplied or custom.\
    \ See the sidebar \n\nfor the code.\n\n BROWSER-SUPPLIED VERSUS CUSTOM RESET BUTTONS\n\
    \n**A standard Reset button is supplied by the browser, using code like this:**\n\
    \n<input type=”reset” value=”Clear Form” />\n\n**The optional **value** attribute\
    \ specifies the text that appears on the button. Typical **\n\n**values include\
    \ “Reset” (usually the default) and “Clear Form.” **"
  merge: -1
