  md: "**CHAPTER EIGHT** Forms\n\n**335**\n\nIf the company cheerfully offers to ﬁ\
    \ x your car, free of charge, you’ve just had a \n\npositive experience that builds\
    \ customer loyalty. Solving problems expeditiously \n\nand courteously can cement\
    \ visitor good will. \n\nVisual Design of Form Controls \n\nA well-designed form\
    \ is not only highly usable, it’s also visually attractive and cohe-\n\nsive with\
    \ the design of the site as a whole. All of the design guidelines we’ve looked\
    \ \n\nat in previous chapters—layout, color, graphics, and typography—apply to\
    \ forms \n\njust as they do to any other element on the site. But how do we actually\
    \ apply those \n\nguidelines to forms and form controls? \n\nThere are many CSS\
    \ properties that can be manipulated to coordinate a form with \n\nthe rest of\
    \ the site. **FIGURE 8.28** shows a form that displays both unstyled and styled\
    \ \n\nexamples of form controls. The HTML for this form is shown in the sidebar;\
    \ examine \n\nit carefully so that you understand exactly how the formatting is\
    \ applied.\n\n![](img/ee113e5612d290709e494a0dae247fc5_343_0.png)\n\n**FIGURE\
    \ 8.28 **Using CSS to \n\nStyle Form Controls\n\n**FIGURE 8.28 **Using CSS to\
    \ \n\nStyle Form Controls"
