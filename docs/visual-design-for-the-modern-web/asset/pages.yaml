    For people with a milder disability, we make sure our pages don''t override any
    browser setting that they have specified for larger size or custom colors. (Fortunately,
    modern browsers won''t allow our specifications to override the visitor''s preferences).


    +   **Hearing impairment.** If we provide content sound (sound that is more than
    just for entertainment—it carries information as well) such as an instructional
    video or an audio file of a lecture, we should provide an alternative for the
