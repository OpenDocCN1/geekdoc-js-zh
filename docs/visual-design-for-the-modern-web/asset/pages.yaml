  md: 'If lines of text end up expanding to more than 500–600 pixels wide, they can
    be hard to read because the visitor’s eyes cannot easily maintain tracking when
    moving from the end of one very long line to the beginning of the next line. Since
    there''s no cross-browser solution to setting a maximum width, we must rely on
    visitors having the good sense to densify the window if the lines of text are
    too long to read easily.


    # MAX-WIDTH AND MIN-WIDTH


    CSS max-width and min-width properties would solve the problem of content areas
    that are either too wide or too narrow. As of this writing, unfortunately, they
    are not recognized by Internet Explorer, the browser with the largest market share.


    # Comparison of Solid versus Liquid Layout


    There are advantages to both solid and liquid layout.


    With solid layout, you can be fairly confident of what the page will look like
    when the visitor sees it, regardless of screen size and resolution. In contrast,
    liquid layout fully embraces the medium of the web but is much less predictable
    and harder to create and test. Of the twelve popular web sites we have been considering
    throughout this chapter, only two, Amazon and IMDb, use liquid layout. See **TABLE
    4.4** for a summary of advantages and disadvantages of both layout styles.


    | TABLE 4.4 LIQUID VERSUS SOLID LAYOUT |

    | Solid Layout | Liquid Layout |

    |---|---|n| Description | - Page fits within a set number of pixels horizontally.
    | - Page expands and contracts to fit the visitor’s horizontal window dimension.
    |

    | Advantages | - Tight control over how the page displays on a visitor’s screen.
    | - Uses the entire window. - Can eliminate horizontal scrolling at most window
    sizes. - Works (in theory) for all screen sizes. |

    | Disadvantages | - Wasted background on larger windows. - Fewer elements can
    be placed on the page. | - Impossible to control exactly how the page looks on
    a visitor’s screen. - Lines of text can be read if they become too wide. - Almost
    impossible to make the page look good at all window sizes. |'
