  md: '# Choosing a Color Scheme


    It''s worth repeating the single most important thing you can do to build appeal,
    mood, and ambiance for your site is to select an appropriate color scheme. There
    are really no awful colors—any color can look attractive when placed with appropriate
    companions. Even though colors are mixed differently than digital media, that
    doesn''t mean that you need to learn all new theories to make color work on the
    web; the old theories about pleasing color schemes still hold true. For instance,
    yellow always looks good with its related color of orange whether the yellow was
    created with paint (subtractive color) or pixels (additive color).


    Sometimes the color scheme is given: we can imagine IBM allowing any other than
    blue to dominate its site, or the Chicago Bulls using any colors other than red
    and black, or Victoria''s Secret using anything other than pink, or the Republic
    of Ireland using anything other than green...Well, you get the idea. Many organizations
    have long-established color schemes which you simply cannot deviate. In this case,
    creating the color scheme for the site can be straightforward as choosing colors
    from the logo, followed by choosing a few tints or shades of colors for your variety.


    When are are allowed to choose your colors, you first need to consider the audience
    and purpose of the site. A site for children might employ primary colors or some
    other design of fully-saturated bricks. A rock group site might use a funky combination
    of neon colors, or a dark and murky scheme, depending on the mood the bands want
    to project. A more sta and stable color scheme, like monochrome blue, is appropriate
    for a corporate site (think “Big Blue,” IBM).


    Colors evoke particular associations and emotions in our minds. Here is a summary
    of some of those associations for the Western world:


    +   - cheerful, sunny, upbeat, happy, luminous, intense. Popular example: The
    high-energy label of the Absolut Color vinho.


    +   - energetic, cheerful, glowing, vital, upbeat, playful, happy, comedic, festive,
    loud, popular with children. It carries many of the same qualities of its components
    of yellow and red. Orange lost popularity for many years because of its association
    with the period of the late 1960s and is now making a comeback. When light to
    peach or coral: soft, upscale, nurturing, healthy. When darkened to deep rust:
    sensual, earthy, spicy, warm, ethnic. Popular example: The vibrant orange of Sunkist
    Orange drink cans.'
