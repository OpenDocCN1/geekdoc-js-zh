  md: '# 190 VISUAL DESIGN FOR THE MODERN WEB


    Each step up in the allowed number pairs, such as from 33 to 66, represents a
    20% increase in the saturation for that hue. FIGURE 5.13 presents a few examples
    of web-safe colors. We will look at the entire web-safe palette, in several incarnations,
    in the next section.


    FIGURE 5.13 Sample Web-safe Colors and Colors


    ![](img/ee113e5612d290709e494a0dae247fc5_198_0.png)


    Many colors possess names as well as hex codes. For instance, you could say "color:
    red" in your CSS. The hitch is that only one of these colors translate to precisely
    the same color code in all browsers. You''d think that something as straightforward
    as "red" should always translate to #FF0000, but unfortunately, isn''t necessarily
    true. For instance, the color name "brown" translates to #A5A2A2 in Navigator
    7.2 and #993333 in Internet Explorer 6. Although newer versions of Internet Explorer
    and Firefox are more consistent with each other, it''s still safer to use names.


    Virtually all programs and web development environments provide their own versions
    of the web-safe palette. Unfortunately, the web-safe palette is restrictive, especially
    when it comes to providing the subtle, sophisticated colors that many designers
    crave. What happens if you choose to use a color that is not web-safe? If a visitor
    has a system powerful enough to see that particular color, the color displays
    properly. If not, the browser does one of two things: either it uses its best
    judgment to shift the color to the nearest color that it recognizes, or it dithers
    the color.


    Dithering is alternating pixels of two different colors with the intent of perceiving
    a third, intermediary color—that is, essentially, by faking it. FIGURE 5.14 gives
    you a visual comparison of ded and non-dither color. Dithering on a computer screen
    works in the same way that our eyes blend individual frames of a flip-book to
    simulate what we perceive as "movement."


    Even though our eyes perform this blending function automatically, the grainy
    look of dithering can still be noticeable and distracting, in large areas of what
    should be solid color. Although dithering is not always bad (sometimes we might
    even do it on purpose for special effects), most of the time solid color is preferred
    over dithered color.'
