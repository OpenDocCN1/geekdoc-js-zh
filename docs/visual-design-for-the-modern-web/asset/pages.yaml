    # Triad Color Scheme


    A triad color scheme, as shown in FIGURE 5.35, uses three evenly spaced colors
    around the traditional color wheel. Triad schemes can be bold and vibrant, but
    at the same time jarring, though not quite to the same degree as a complementary
    color scheme. The widely-employed triad scheme, the three traditional colors of
