  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**338**\n\nInput Forms and Accessibility\n\
    \nIt’s beyond the scope of this book to delve into the politics, policies, and\
    \ nuts-and-\n\nbolts of making the forms fully accessible on your site, but our\
    \ chapter on forms \n\nwould not be complete without including information about\
    \ accessibility.\n\nHere, then, are the guidelines for making input forms accessible:\n\
    \n■ Whenever possible, place labels to the left of input elements so that screen\
    \ \n\nreaders read the label ﬁ rst, and then the ﬁ eld requiring input. \n\n■\
    \ If a label must be placed somewhere other than to the left of a form element,\
    \ or \n\nwhen other elements come between a label and its form element, link the\
    \ label \n\nand the form element like this:\n\n \n\n<input type=\"text\" name=\"\
    firstName” id=”firstName” />\n\n \n\n<label for=”firstName”\\>First name</label>\n\
    \nScreen readers for the visually impaired will then read the label along with\
    \ the \n\nform element. \n\n■ To make visual category chunking explicit for screen\
    \ readers, surround related \n\nform elements with <ﬁ eldset> tags, and include\
    \ <legend> tags for labeling.\n\n■ Don’t populate controls with instructional\
    \ text as the default value, because \n\nthat text makes it even tougher for access-impaired\
    \ visitors to delete the \n\ninstructions before continuing. Use proper labels\
    \ and instructions on the \n\nform instead.\n\n■ Avoid using list boxes that use\
    \ the multiple attribute; checkboxes are a more \n\naccessible option.\n\n■ Don’t\
    \ set the default value for a single yes/no checkbox to “yes.” \n\n■ Use the title\
    \ attribute to provide tooltips on rollover.\n\nSummary\n\nForms can be painless\
    \ or painful for visitors. Keep in mind that visitors want to get \n\ntheir tasks\
    \ accomplished as quickly as possible, and with the least amount of effort. \n\
    \nProper planning and design can maximize task efﬁ ciency. \n\nThe following checklist\
    \ serves two functions: to summarize the major points and \n\n“rules” presented\
    \ in the chapter, and as a checklist before ﬁ nalizing any web site \n\nyou are\
    \ creating."
  merge: -1
