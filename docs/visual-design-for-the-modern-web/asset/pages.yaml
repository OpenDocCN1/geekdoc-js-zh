    +   8. Upon third failure, the transaction is terminated with an error message.


    Alternative: Repeat customer


    +   4. The system displays the full order details, including the customer’s standard
    shipping option and the last four digits of the credit card.


    +   5. The customer may accept or reject the standard shipping and credit card
    information.


    +   6. The customer clicks “place order.”


    +   7. See Steps 6–8 in the primary scenario.


    We also need to analyze how often a visitor might perform each task. Those that
    are performed often should take priority and have the most visibility on the site.
    For example, Amazon sells more books, music, and movies than it does gardening
    tools or jewelry. As a result, books, music, and movies are the most visible navigation
    tabs on the site, while gardening tools might be buried under an “Other” tab.
    Such menu visibility facilitates visitors’ most frequent tasks.'
