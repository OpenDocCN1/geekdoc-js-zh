  md: '+   Size: large versus small, tall versus short. All things being equal, large
    is more attention-attracting than small, the most important elements on the page
    should be the largest. Even otherwise nondcript content text can take center stage
    if placed in the largest block on the page.


    +   Color: one color versus its complementary (opposite) color (think red versus
    green), bright versus dull, light versus dark, sophisticated versus gray colors.
    Generally, the brighter, more intense colors attract attention over duller, intense
    colors. Another way to use color is to reverse the color of foreground and background
    in selected areas. For instance, if the majority of the page is black text on
    a white background, the reverse of white text on a black background stands out.


    +   Texture: smooth versus textured, solid color versus pattern.


    +   Typography: bold or italic versus normal, elaborate typeface versus a simple
    one. Big, bold, and elaborate are the most likely to attract focus.


    +   Focus: sharp versus blurred. Sharp focus usually draws attention the most
    successfully.


    +   Space: congested versus open, positive (filled) versus negative (unfilled),
    near versus far (an optical illusion in two-dimensional space), two-dimensional
    versus a three-dimensional illusion (using perspective, shadowing, or change in
    size, color, or texture).


    +   Direction: horizontal versus vertical versus diagonal, direct versus meandering.


    +   Style: representational versus abstract, cartoony versus photo-realistic,
    simple versus elaborate.


    Exercise restraint when using contrast. Each time we add contrasting element to
    a page, we are diluting the contrast of any other focal points (areas that draw
    our attention). Take care not to provide so much contrast on the page that none
    of the elements has focus. In short, when visual chaos reigns, visual hierarchy
    vanishes.


    # Provide white space.


    Include plenty of white space (unused space, also called negative space), even
    if the “white space” is actually red or blue or chartreuse. White space provides
    the eyes with respite, imparting a feeling of “breathing room.” In the web page
    in FIGURE 4.20, we see a hefty amount of white space (in this case, actually black
    space) that contributes to the clean, elegant, and dramatic look of the site.'
