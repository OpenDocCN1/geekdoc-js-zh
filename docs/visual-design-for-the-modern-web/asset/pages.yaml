  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 3


    # COMPANION WEB SITE


    The web site accompanying this book,www.VisualDesignModernWeb.com, provides myriad
    bonus materials, including chapter-by-chapter review questions and exercises,
    nuts and bolts information about creating a site, pre-written JavaScripts, and
    a tutorial for using Fireworks and Dreamweaver to create rollover buttons.


    The need to define content, organization, and visual design is nothing new in
    modern design; designers have been struggling with these three components in the
    print medium since papyrus was de meagre. Always, technology has been a factor,
    from the aforementioned papyrus to quill pens to today''s digital presses. Still,
    never before the presentation medium been so closely bound to the technology as
    it is not the web. Additionally, the web has advanced communication a step further,
    through interaction...well, that''s a whole wrinkle in the communication area.
    Until computers, the most interaction an audience could experience was turning
    the pages of a book or fast-forwarding through a video. With the advent of the
    web, through interaction in the form of navigation and visitor input have become
    not only pervasive, essential.


    Before we delve into the specific interconnected areas of web design—technology,
    content, site architecture, visual design, and interaction—let''s agree on the
    fact that these components are integral characteristics of a first-rate web site.
    We need to address them all in order to create a site that is:


    +   - Easy to maintain: It must be flexible and scalable so that ongoing updates
    throughout the life of the site can be accomplished with a minimum of time and
    effort.


    +   - Aesthetically appealing: It must be an attractive and engaging sensory experience
    for its target audience.


    +   - Easy to use: That is, user-friendly, effective, and downloads rapidly. Visitors
    should encounter a high degree of success in finding what they are looking for
    or in accomplishing their missions, without waiting time.


    +   - Technically solid: It behaves predictably, without any broken links.


    We will start with a quick review of web technologies, as highlighted in FIGURE
    1.2, before progressing into the other aspects of web design shown in FIGURE 1.1.'
