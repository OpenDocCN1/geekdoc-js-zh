  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**274**\n\npopularity of some modern TV\
    \ cartoons like South Park, with very jerky animation, has \n\nfreed web designers\
    \ to experiment with animation smoothness, or lack thereof.\n\n*Looping* is the\
    \ process of replaying an animation repeatedly, either a preset number \n\nof\
    \ times or endlessly. \n\n*Onion skinning* refers to showing all the frames and\
    \ objects at once, rather than just \n\nthe current frame. The current frame is\
    \ in full focus, while the lower frames that \n\naren’t currently being edited\
    \ are somewhat “grayed out.”\n\nMost objects that are repeated in an animation\
    \ should be entered to the program’s \n\n*symbol library*—an efﬁ cient “place”\
    \ for storing any number of elements for reuse, \n\nwhich might be familiar from\
    \ vector-based graphics programs such as Illustrator. \n\nEditing objects within\
    \ the library automatically updates every instance of that \n\n“symbol” that is\
    \ used in your layout. A further beneﬁ t of using symbols is that the \n\nobject\
    \ is stored in the ﬁ le only once, no matter how many times you use it, thereby\
    \ \n\nresulting in a smaller ﬁ le size. \n\nAnimation Formats\n\nThere are three\
    \ common web animation formats: JavaScript, animated GIF, and \n\nFlash. JavaScript\
    \ animation is well beyond the scope of this book, because it involves \n\nfairly\
    \ heavy-duty programming skills. Luckily, however, you can ﬁ nd hundreds of \n\
    \nfree, pre-programmed animation scripts on the web, most of which require no\
    \ pro-\n\ngramming skills at all to implement. \n\n**FREE JAVASCRIPT SCRIPTS**\n\
    \nSee www.javascriptsource.com for hundreds of free JavaScript scripts, including\
    \ \n\nanimations like the “falling snowflakes” background.\n\nGIF Animation\n\n\
    Animated GIFs can be created in most image-editing programs that support stan-\n\
    \ndard GIFs. An animated GIF consists of multiple GIF images stacked on top of\
    \ one \n\nanother. The images are played in sequence to simulate movement. As\
    \ you might \n\nexpect, you can specify how many times the animation should loop\
    \ and the time \n\ndelay between frames. **FIGURE 6.38** shows two frames as they\
    \ would display in the \n\nplayback of a GIF animation, and one frame with the\
    \ objects selected for editing."
