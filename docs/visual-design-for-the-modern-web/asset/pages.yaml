  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**328**\n\nEven if you don’t need to specify\
    \ a non-standard tabbing order, you can still set focus \n\nto a speciﬁ c control\
    \ where you want the visitor to start initial data entry. For instance, \n\nwhen\
    \ a visitor opens www.google.com, the cursor is automatically positioned in \n\
    \nthe search input area, ready and waiting for the visitor to type in a search\
    \ phrase. \n\nAutomatically setting focus to the ﬁ rst form control illustrates\
    \ how some thoughtful \n\ncoding can save the visitor an unnecessary keystroke\
    \ or mouse movement. \n\nTo set the focus upon initial page load, add the following\
    \ onLoad attribute to the \n\n<body> tag, substituting your own form and ﬁ eld\
    \ names for formName and ﬁ eldName:\n\n<body onLoad=”document.formName.fieldName.focus();”>\
    \ \n\nPresenting Input Controls in the Expected Order\n\nRegardless of where we\
    \ set the focus, we should present input controls in the order \n\nthat a visitor\
    \ would expect to see them. For instance, we would all be confused if \n\na form\
    \ asked us for our address in the order shown in **FIGURE 8.23**, because we’re\
    \ \n\naccustomed to the standard street-city-state-zip format. \n\n![](img/ee113e5612d290709e494a0dae247fc5_336_0.png)\n\
    \nAnother example of violating a user’s order expectations would be to ask for\
    \ a \n\ncredit card number before displaying the items in the cart and calculating\
    \ tax and \n\nshipping charges. After all, a visitor would want to verify that\
    \ the order is correct \n\nbefore charging his credit card. The irregularity of\
    \ the input order might even cause \n\nhim to question if the site is really legitimate—maybe\
    \ it’s a site phishing for credit \n\ncard numbers instead. \n\nIf visitors are\
    \ consulting a paper source document as they enter data, the web \n\npage should\
    \ present the ﬁ elds in the same order as the source document. For \n\ninstance,\
    \ a site that’s used to submit already-ﬁ lled-out-on-paper income tax \n\nforms\
    \ should follow the IRS’s standard form layout. (One could certainly argue \n\n\
    that changing the order of entry on IRS forms might be nothing but an improve-\n\
    \nment, but that’s another issue.) \n\n**FIGURE 8.23 **Inappropriate \n\nEntry\
    \ Order\n\n**FIGURE 8.23 **Inappropriate \n\nEntry Order"
