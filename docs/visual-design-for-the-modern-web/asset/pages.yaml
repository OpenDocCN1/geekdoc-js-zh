    # HTML REVIEW: SOLID LAYOUT


    Here is the code for the centered, solid layout shown in Figure 4.7:


    ```

    <body style="text-align:center">

    <div style="width:200px; background-color:#dde7e9; text-align:left">

    <p>Four score . . created equal.</p>

    </div>

    </body>

    ```


    The width property ensures that the <div> is always precisely 200 pixels wide,
    regardless of the visitor''s window size. The text-align:center property on the
    <body> tag centers it if it''s smaller than the window, as on the left in Figure
    4.7. If the content is too large for the window, the browser inserts scroll bars
    (horizontal and vertical) on the <div>, as on the right in Figure 4.7.


    We could use a table to create a similar layout, especially when we want to treat
    rows and columns as a whole. In the HTML below, the first column of the table
    is always fixed at a width of 100 pixels. The second column fills the remaining
    100 pixels of the 200 pixels specified for table width. Here''s the HTML:


    ```

    <body style="text-align:center">

    <table style="width:200px;">

    <tr>

    <td style="width:100px;">Gettysburg Address</td>

    <td>Four score . . created equal.</td>

    </tr>

    </table>

    </body>

    ```'
