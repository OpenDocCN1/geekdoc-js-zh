  md: '# VISUAL DESIGN FOR THE MODERN WEB


    | TABLE 4.1 RELATIVE OBJECT SIZES: DISPLAY RESOLUTION VERSUS MONITOR SIZE |

    | resolution | 800 x 600 | 1024 x 768 | 1280 x 1024 | 1600 x 1200 |

    | --- | --- | --- | --- | --- |

    | 19" screen | text | text | text | text |

    | 15" screen | text | text | text | text |


    To summarize the general interaction of resolution and monitor size:


    +   - Lower-resolution systems and/or larger display screens result in larger
    text and images. The disadvantage is that the pixels on the display can be blown
    up to the point where they become pixelated, is, the individual pixels are large
    enough to be easily visible—an undesirable effect.

    - Higher-resolution systems and/or smaller display screens result in smaller text
    and images such that the elements can end up being too tiny to read.


    As you can see, the 72–100 PPI mentioned earlier is less than a rule of thumb,
    since the actual number of pixels in an inch on the screen depends upon the interaction
    of display resolution and monitor size. Again, a web inch is a relative inch,
    not an absolute inch.


    Other factors also affect how many pixels display on a user''s screen:


    +   - Older systems or less expensive newer systems generally sport lower width-by-height
    resolution than newer (and more expensive) computers and monitors.

    - When computer systems arrive on their buyers'' doorways, they are "dialed down"
    a notch or two from the highest width-by-height resolution are capable of displaying.
    That is, a system capable of displaying 1280 x 1024 may be very well be set to
    only 1024 x 768 when the user receives it.

    - Many users, perhaps even most, don''t know that width-by-height resolution can
    be changed, much less know how to do it.

    - Visitors with vision impairment, age-related or otherwise, might deliberately
    turn down the resolution so that everything on the screen is larger and easier
    to see.'
