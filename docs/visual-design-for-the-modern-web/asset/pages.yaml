    style="position:absolute; left:25px; top:100px">

    <p>ABSOLUTE<br /> /Four score . . created equal.</p>

    </div>

    ```


    # Tables versus <div>s


    Page layout is on the verge of a major revolution. Although we must use tables
    and table cells to set the width of columns on the page if we are all worried
    about visitors visiting older browsers, we are rapidly approaching the time when
    we can depend instead upon positional <div>. We can set the <div> size, background
    colors, background images, and selective borders, as well as position the <div>
    precisely on the page. The major obstacle right now to replacing tables with <div>s
    is that sometimes the various browsers render and position them differently.'
