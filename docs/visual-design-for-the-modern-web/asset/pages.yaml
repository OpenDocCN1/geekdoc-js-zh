  md: '# Building Blocks of Page Layout


    Before we can examine how to create unified page layouts, we must first look at
    the various interacting elements that we can manipulate when creating those layouts.
    Those elements are line, shape, and color.


    # Line


    Lines can be thick or thin, uniform or varying thickness, solid or interrupted,
    fuzzy or hard-edged, graceful or nervous or sharp. The line you choose can help
    to create a mood.


    Line can divide, connect, decorate, and organize. For instance, horizontal and
    vertical rules (lines) can divide a page or connect two parts of a page together.
    Borders around just a part of a page can be used as organizers and containers,
    Lines can distinguish and delineate an object, whether the lines are visible (a
    different color from the object) or implied (same color as other). Invisible lines
    are also the main components of grids, which can be used as an organizing principle
    for the page. Grids are discussed in greater depth later in this chapter.


    FIGURE 4.9 is an example of invisible, grids crafted into a three-column grid,
    with the header images at the top covering both the left and center columns.


    ![](img/ee113e5612d290709e494a0dae247fc5_157_0.png)


