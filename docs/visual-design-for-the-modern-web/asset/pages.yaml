  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 27


    # # Branding: Creating an Identity


    As mentioned earlier, one of the tasks of visual design is to make sure that a
    site has visual consistency. That is, all of the pages must look like they''re
    cut from the same cloth. They''ll have the same logo, and same color scheme, and
    (for the most part) the same layout. A visitor who has viewed one page in the
    site should be able to recognize immediately of all the other pages within the
    site. Additionally, that consistent look and feel should support the "branding"
    of the site.


    What, then, is branding? It''s the ever impression made by a product or the other
    organization. It encompasses logos, packaging, advertising, reputation, and, and
    of course, the web site itself. An effective brand has an identity, personality,
    and an individuality of its own, with a distinct look and feel that appeals to
    its target audience. It evokes emotion and separates a product, service, organization
    from its competitors. Most importantly, it''s memorable.


    Let''s look at some examples of branding:


    +   - Oreo® cookies. We can recognize Oreo from just a small piece, and most of
    us immediately think of an associated glass of milk, and twisting the cookie apart
    (or not).


    +   - Jaguar. The name instantly constructs an image of a cool, high-performance,
    luxury vehicle with the evocative jungle cat ornament. We see sleek lines and
    a leather interior and imagine being the envy of all of our friends if we owned
    one.


    +   - Ben and Jerry''s Ice Cream. The overall image is funny and humorous. We
    can practically taste Ben and Jerry''s ice cream in unusual but wonderful flavorful
    combinations.


    +   - UPS™. Very boring, very brown—but a UPS truck can be recognized blocks away.
    That boring brown comes to epitomize reliability, and UPS capitalizes on that
    image, to the point where the company uses the tag line "What brown can do for
    you?"


    +   - Cheerios®. Again, they are recognizable from just a tiny piece.


    Other examples of effective branding including Disney, Godiva Chocolates, Victoria''s
    Secret, Olive Garden, Harry Potter books and movies, and Nike''s "swosh" mark.


    Now let''s look at an example of ineffective branding. Think of the difference
    between Office Depot and Office Max...OK, time''s up. Can''t come with anything?
    That''s just it. Ineffective branding is in evidence because there is little differentiation
    in the consumer''s mind, little that is memorable. Their names, logos, and products
    are similar; the stores have a similar look. Most consumers would just go one
    as the other and might not even remember which of the two is located just a few
    blocks away in their own city.'
