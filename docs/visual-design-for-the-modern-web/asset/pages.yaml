  md: '# CHAPTER FOUR Page Layout 169


    The most important information on the page should be "above the fold" that is,
    it should be visible when the user opens the page, without scrolling vertically.
    The term "above the fold" comes from the newspaper industry, which the most important
    or interesting articles are deliberately put on the top half of the first page
    so that they are visible when the folded newspapers are stacked in sales racks.
    It''s the same idea for web page; only if you capture a visitor''s attention with
    that first view will he or she bother to scroll down the page. Therefore, use
    the area "above the fold" to capture your visitors. All of the web sites that
    we have seen in this chapter done that.


    Where will the "fold" be when a visitor opens a page? We never know for sure,
    because of all of the resolution and window size inconsistencies discussed earlier.
    A rule of thumb is to assume the fold is about 390 pixels, which is approximately
    the size of a window opened full-screen in an 800 x 600 display.


    # Required Page Elements


    The page layout is a visual framework from which we hang the content and graphics.
    That visual framework should include the following elements on every page:


    +   Logo and company identification. Keep in mind that a visitor doesn''t always
    come in the "front door," that is, the home page. Therefore, we must be sure to
    let her know where she landed if she is dropped into the middle of our site by
    virtue of a bookmark or a deep link (a link that bypasses the home page).


    +   Main identification or title. Without that, a visitor doesn''t know the purpose
    of the page she is currently viewing.


    +   Main navigation, including a link to the home page. After all, we hope that
    the visitor will continue to browse the site after viewing the current page.


    +   Local navigation (if needed) for getting to sub-pages.

    A standard footer, if appropriate. A footer might provide copyright information,
    date of last update, or links to privacy and legal notices. Additionally, there
    might be a repeat of the main navigation that appears at the top of the page.
    Such bottom navigation eliminates the need for visitors to scroll back to the
    top in order to move forward. It''s often presented in the form of small text
    links, even if the navigation at the top of the page is graphical.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# The Home Page


    The home page has unique requirements of its own. Since it''s the entrance point
    and its most valuable real estate, it should serve as table of contents for the
    site as a whole, as well as indicate how to access the content. The more important
    areas of content should, of course, have more prominent focus. It''s always good
    to try to reveal at least a bit of real content on the page, too, not just navigation,
    so that visitors come away with a better feel for what the rest of the site contains.


    Still, the home page shouldn''t contain elements that don''t relevance to the
    site as a whole. For instance, it would be a waste of valuable home page space
    if Amazon were to report the results of the company''s softball team. Customers,
    the primary audience of the site, simply wouldn''t care. Keep in mind that choosing
    content for the home page is often a political war between entities and departments
    in an organization, all of whom think that their content deserves to be featured.


    # Storyboard: Sketching the Layout


    At some point, we need to put the preliminary layout for the individual pages
    on paper or into digital format—a process called storyboarding. The first stage
    of this process is a grayscale sketch (shades of gray), with no color, no real
    content (use “greeksed,” or nonsense, text) and no graphics (although placeholders
    for future graphics are indicated). This grayscale version is sometimes called
    a wire-frame as well as a storyboard. FIGURE 4.28 shows an initial, hand-drawn
    storyboard sketch for a simple page layout.


    **FIGURE 4.28** Storyboard:

    Layout Sketch


    ![](img/ee113e5612d290709e494a0dae247fc5_178_0.png)


    The purpose of a grayscale storyboard is to show the layout and underlaying grid
    of the page: where the logo, navigation, page title, content, and main images
    will be located. We deliberately omit graphics and color at this stage we want
    everyone to focus on critiquing the layout.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Only after the grayscale sketch has been approved we should progress to a story
    board that includes color and graphics, sometimes called a color comp mock-up
    or prototype. To create the comp, some designers use an image-editing program
    such as Adobe Photoshop or Fireworks, while others prefer creating the comp as
    a fully-coded HTML prototype. Let''s look at each method.


    # Using an Image Editor to Create a Comp


    In general, designers who are artists first, web developers second, often prefer
    sketching the comp in an image-editing program, rather than creating a skeletal
    HTML page. Sketching this way is often faster than writing HTML, and it provides
    more freedom. That freedom is also the primary danger: Any number of wonderful
    graphics simply cannot be translated into effective and HTML code without making
    compromises in either the design or the HTML. As a result, sketching in an image
    editor is a viable method only if the designer keeps in mind the limitations of
    HTML and is willing to compromise the design when he runs up against those limitations.


    If you build your comp in an image editor, many of your graphic elements are already
    completed, or at least close to being completed, the comp is finished. For instance,
    if you have the logo that you designed for the comp, you can export that small
    section of the overall comp to a file that is inserted into the HTML with an `<img>`
    tag.


    # Using HTML to Create a Comp


    Building a comp in HTML is often preferred by designers who are techies first,
    designers second. Although somewhat more time-consuming than sketching in an image-editing
    program, this method keeps the designer grounded in the reality of what HTML can
    and cannot do, thereby circumventing the need for a site redesign after someone
    figures out that the design simply won''t work in HTML. As a final benefit, creating
    the comp in HTML results in a skeleton HTML file that can evolve into the production
    pages.


    # Page Templates


    Either way, after the layout sketches have been tweaked and approved, you are
    ready to create layout templates for the site. These templates, show layout and
    other design characteristics, are content-free HTML files that are the basis for
    each new page as the site is constructed—the consistent foundation on which you
    “pour” the content during construction phase.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    There are two ways to build a template:


    +   - Create and save a standard HTML page that contains the layout elements but
    no content, and manually copy that empty page into the HTML editor each time you
    add a new page to the site.


    +   - Use the template-creation features built in many development environments,
    such as Dreamweaver. The template starts out like a normal web page, but you designate
    some areas of the template page as being protected (modifiable only from within
    the template) and as unprotected (modifiable within individual pages, for the
    variable content). Each new page is simply linked to the template, thereby loading
    the entire page layout. That layout can be altered only within the template, not
    within the page itself, but it becomes available for all of the pages that link
    to. Thus, changing page layout for hundreds of pages might well involve changing
    a single template.


    ![](img/ee113e5612d290709e494a0dae247fc5_180_0.png)


    # BONUS TOPIC:

    Reusable Code


    See the book''s web site for more on using templates, server-side includes, and
    other techniques for reusable code.


    # Page Layout and Accessibility


    Building page layout so that pages are accessible is challenging, to say least.
    Tables are particularly problematic for the visually impaired. Screen readers
    read tables from left to right across each row, and then drop down to the same
    on the next row. Automatically reading a table in this order causes two problems:


    +   - Many tables aren''t designed to be linearized; that is, read left to right,
    top to bottom.


    +   - By the time a screen reader reads a cell in a data table, it''s no longer
    clear which headers apply for that cell data.


    Remedies for such problems in data tables (as opposed to layout tables) include:


    +   - Use title, caption, and summary attributes to describe the purpose and overall
    layout of the table.


    +   - Use the structural markup tags tread, tbody, th, colgroup, and col. Screen
    readers emphasize content within these tags in a way that the structure is clear.


    +   - Assign each column or row header a unique id attribute, and then use the
    headers="headerID1 headerID2..." to associate the appropriate data cells with
    their headers. The latest screen readers are able to read the appropriate header
    information for each data cell.


    +   - Use the abbr attribute to provide a shorter description of repetitive elements
    in appropriate header or data cells.'
  merge: -1
  pgno: 180
- img_proc: true
  md: "For both data tables and layout tables:\n\n+   - Avoid nested tables. They\
    \ are tricky for screen readers to interpret correctly.\n\n+   - Try to structure\
    \ tables (both data tables and layout tables) so that they make sense when read\
    \ left to right, top to bottom. Read them aloud as a test to see if they make\
    \ sense when linearized. Provide an alternative but equivalent page if it's impossible\
    \ to structure a single page so that it makes sense for all audiences.\n\nBut\
    \ of course we're not designing with just tables, and we need to remember that\
    \ accessibility standards apply to other layout tags as well:\n\n+   - Convey\
    \ page structure with structural markup tags (header tags, blockquote, lists,\
    \ etc.), because screen readers read structural markup in a different tone of\
    \ voice. Don't use structural markup tags for visual formatting, such as header\
    \ tags to provide boldface or `<blockquote>` to specify indentation.\n\n+   -\
    \ Structural markup tags can be *augmented* but should not be *replaced* by visual\
    \ cues, since the visually impaired don't access to such cues.\n\n+   - `<h2>`\
    \ elements follow `<h1>`, `<h3>` elements follow `<h2>` and so on. Don't skip\
    \ levels (for example, `<h1>` directly to `<h3>`) in order to get the formatting\
    \ you need. Keep the levels in numeric progression and use CSS to alter formatting.\n\
    \n+   - For ordered lists, use a numbering scheme that independently conveys the\
    \ level of each list item. For instance, compound numbers such as the following\
    \ are more informative about context than simple numbers:\n\n+   1. top-level\
    \ item\n    1.1 subordinate item\n        1.1.1 sub-sub item\n\nAn alternative\
    \ to compound numbers would be a list that changes the numbering scheme for different\
    \ levels, such as:\n\n+   I. top-level item\n    A. subordinate item\n       \
    \ 1. sub-sub item\n\n+   - Use the `<ul>` and `<li>` elements for bulleted lists.\
    \ If you aren't happy with the default bullet styles, use CSS to change them."
