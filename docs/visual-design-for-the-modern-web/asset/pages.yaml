- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**332**\n\n![](img/ee113e5612d290709e494a0dae247fc5_340_0.png)\n\
    \nIf the Help documentation consists of more than just a couple of pages, giving\
    \ it a \n\nhot-linked table of contents or site map can be a lifesaver. For larger\
    \ Help systems, \n\na search feature is almost mandatory.\n\nPeriodically review\
    \ your server logs to see which Help documents are accessed the \n\nmost often,\
    \ and what the user was attempting to do at the time help was consulted. \n\n\
    If you discern that some tasks generate numerous Help requests, you should rede-\n\
    \nsign those pages to make them easier to use.\n\nFeedback \n\nVisitors appreciate\
    \ feedback that tells them they’re on the right track or that they’ve \n\nencountered\
    \ an error (although of course they appreciate the latter less!). For instance,\
    \ \n\nif visitors enter shipping information on one page and credit card information\
    \ on the \n\nnext, the site should redisplay all of this information on a conﬁ\
    \ rmation page before \n\nsubmitting the order. As a result, visitors are reassured\
    \ that the system received the \n\ndata as they intended to enter it. Furthermore,\
    \ if an error arises, error feedback can \n\nnotify visitors as soon as possible,\
    \ while errors are still easily corrected.\n\nWhether the message is positive\
    \ or negative, there are two general types of feed-\n\nback: modal and modeless.\
    \ *Modal *feedback requires a response from the visitor \n\nbefore the ﬂ ow of\
    \ the activity can proceed, such as a dialog box that requires the \n\nvisitor\
    \ to click “OK” to dismiss the box before moving forward (as in **FIGURE 8.26**).\
    \ \n\n![](img/ee113e5612d290709e494a0dae247fc5_340_1.png)\n\n**FIGURE 8.25 **Amazon’s\
    \ \n\nContextual Help \n\n(www.amazon.com, \n\n© Amazon.com, Inc. or \n\nits affiliates.\
    \ All Rights \n\nReserved.)\n\n**FIGURE 8.25 **Amazon’s \n\nContextual Help \n\
    \n(www.amazon.com, \n\n© Amazon.com, Inc. or \n\nits affiliates. All Rights \n\
    \nReserved.)\n\n**SITE MAPS AND **\n\n**SEARCH**\n\nSee Chapter 3 for \n\nguidelines\
    \ concerning \n\nsite maps and search \n\nfunctions. \n\n**SITE MAPS AND **\n\n\
    **SEARCH**\n\nSee Chapter 3 for \n\nguidelines concerning \n\nsite maps and search\
    \ \n\nfunctions. \n\n**FIGURE 8.26 **Modal \n\nFeedback\n\n**FIGURE 8.26 **Modal\
    \ \n\nFeedback"
