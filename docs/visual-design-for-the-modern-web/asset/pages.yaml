  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**314**\n\nWhat if a few visitors need\
    \ substantially more characters than is typical for a particular \n\ninput ﬁ eld?\
    \ For instance, the vast majority of last names can be easily accommodated \n\n\
    in 15 characters. Still, a rare visitor might need 25 characters. We might be\
    \ reluctant to \n\ndevote the extra screen space to accommodate those rare longer\
    \ entries. \n\nThe compromise solution is to set the size to accommodate the majority\
    \ of entries \n\nand the maxlength to accommodate the longer ones. For instance,\
    \ we could set the \n\nsize of the last-name ﬁ eld to 15 characters and the maxlength\
    \ to 25 characters. \n\nSuch speciﬁ cations would permit most visitors to enter\
    \ their names without scroll-\n\ning, while the visitors with longer names would\
    \ be accommodated by scrolling. \n\nBut even though we usually want the visual\
    \ size of the input area to reﬂ ect the \n\napproximate number of characters allowed\
    \ in the ﬁ eld, it can be visually chaotic to \n\nmake every ﬁ eld a different\
    \ length. In **FIGURE 8.13**, the form on the left lacks visual \n\ncoherence\
    \ because the right sides of the input ﬁ elds don’t line up with one another.\
    \ \n\nThe form on the right is much more visually pleasing, because ﬁ elds are\
    \ the same \n\nlength whenever possible. It seems that we must ﬁ nd a compromise\
    \ between indi-\n\ncating ﬁ eld lengths accurately and making the form aesthetically\
    \ appealing, or at \n\nleast not as chaotic. \n\n![](img/ee113e5612d290709e494a0dae247fc5_322_0.png)![](img/ee113e5612d290709e494a0dae247fc5_322_1.png)\n\
    \n**Form Fields of Differing Lengths**\n\n**Form Fields of Similar Lengths**\n\
    \nPunctuation and Formatting in Text Input Controls\n\nIf a ﬁ eld has punctuation\
    \ embedded in it, such as dashes, slashes, or spaces, it’s \n\noften a good idea\
    \ to show that formatting, or at least give some indication to the \n\nuser as\
    \ to the formatting that we expect. For instance, **FIGURE 8.14** shows multiple\
    \ \n\nways of guiding visitors to enter a date correctly.\n\n**FIGURE 8.13 **Alignment\
    \ of \n\nForm Fields\n\n**FIGURE 8.13 **Alignment of \n\nForm Fields"
  merge: -1
