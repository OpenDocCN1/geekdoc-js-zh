  md: '# Graphics


    GIF, or Interchange Format, works best for line-based images with areas of solid
    color, such as cartoons, diagrams, line art, and graphic text. 6.2 earlier showed
    an image that would be best stored as a GIF. GIF supports index transparency,
    interlacing, and animation.


    A image can store up to 256 colors. If we want an image to be web-safe, but we
    didn''t create the original with a web-safe palette, we can specify a web-snap
    pallete when we export the image to GIF. The image editor converts every non-gif
    color to what it believes is the closest web-safe color. It''s also safer for
    us to convert to web-safe colors ourselves, automatic conversion can be a time-saving
    first step when we are preparing an existing image to web.


    If we aren''t restricted to a web-safe palette? GIF limits us to 256 colors, then
    we can use any 256 colors out of the 16.8 million choices. In this case, we choose
    a non-adaptive palette (colors chosen from the image) to preserve our color choices
    accurately—as long as we don''t exceed the 256-color limit.


    Unfortunately, although includes complex textures, gradients (gradient color blends
    into one color another), or drop shadows (a three-dimensional effect that uses
    a gradient) can easily limit. In these cases, the editing program retains the
    most frequently used colors and shifts the remaining colors to those 256 retained
    colors as best as it can. If we don''t like the choices we make, we can "lock"
    some of the critical colors on the palette, so that they remain.


    We can also "fake" colors by dithering, which alternates two similar colors to
    fool the eye into thinking a third color is present. Dithering, unfortunately,
    increases the size of a GIF.


    # GIF File Compression


    GIF employs a lossless/non/destructive compression algorithm, so that colors and
    edges remain true when saved, and not noise are introduced. The types of GIF that
    compress most efficiently are with few colors, horizontal bands of solid color,
    no noise or texture, no anti-aliasing, and no dithering. Let''s look at each of
    these characteristics GIF.


    GIF images make use of a lookup table (LUT) to keep track of the colors in an
    image, so that every 6-digit color code (e.g., #FF0000) is stored only once, and
    its number (01 through 256) in the table is used as the cross-reference for each
    pixel that uses color. The short explanation is that the smallest positional color
    for each pixel results in a smaller file than if using the full 6-digit color
    code.


    If fewer than 256 colors are used, the color code may be to shrink even further.
    In summary, a lower color depth (the total number of colors) has the potential


