  md: '# Features of This Book


    the preliminary title for this book was Web Design Alchemy, because medieval alchemy
    blurred the lines between science, art, magic, and while a fully designed web
    site may not be medieval gold, it is indeed magical.


    The book consists of eight chapters: Introduction, Site Analysis, Page Layout,
    Color, Graphics, Typography, and Format. Throughout the chapters, we present "code
    reviews" to show how to implement the design under consideration. Keep in mind
    that code examples are often abbreviated to use only CSS styles—rather than the
    more preferred external styles—for clarity and brevity.


    # Target Audience


    My only assumption is that you know at least the fundamentals of web technology,
    including basic HTML and CSS. Beyond that, my target audience is anyone who wants
    to teach technology further by developing or her aesthetic abilities in web design:


    Feel free to contact me if you have questions or suggestions for future editions.
    If you''re a teacher or professor using this book for a course, please contact
    me for Powerpoint slides and materials that may support your teaching efforts.


    +   - Techies, who know computer programming but desperately need to learn the
    aesthetic side of web design. This book can be used and understood by folks with
    no art training. Although developers in the corporate world often have graphic
    designers to do their visual design work, they still need to know about aesthetics
    to communicate with designers and evaluate their work. Also, there are many techs
    in smaller companies that are required to do web design without benefit of any
    training in design theory. Despite the fact that technical developers are only
    rarely to approach the design levels of trained artists, they can be taught to
    understand design to create professional and appealing web sites. After all, the
    best programmers are creative.


    The book''s site, www.VisualDesignModernWeb.com, contains all sorts of bonus topics
    and interesting tidbits. I hope to have the site up and running by the time the
    book is published, but I will also be adding content in the future I create or
    around things I might interest you.


    # Acknowledgments


    My deepest goes to all of the following:


    My reviewers. Their suggestions and criticisms have improved this book much. I
    am all because of: Philip Ankara, Olipha City College; Anne Shanley, Courtney
    College of Morris; Anthony Gavin, University of Maine at Kent; Arza Smyth, Bucks
    Community College; Blaine Robertson, Brigham Young University, Idaho; Bruce Long,
    University of North Carolina; Charlotte; Carol Pace-Pequero, DuPage Campus; Charles
    Goodman, College of DuPage; Christine L. Moore, College of Charleston; Dale Craig,
    Texas Tech; Fullerton


    +   - Designers, who understand aesthetics but are often baffled how to translate
    these aesthetics to the technical medium of the web. Color mixing is an easy game.
    Given points of red, yellow, blue, and white, an artist can make any imaginable
    color. But how does art pixels represented with hexadecimal numbers, and the primary
    colors are red, green, and blue? The yellow that is a mix of red and green pixels
    is completely foreign to most artists. This book can teach traditional artists
    how to transfer their skills to the web.'
