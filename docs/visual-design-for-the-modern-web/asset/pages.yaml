  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**262**\n\n**FURTHER DESIGN INSPIRATION**\n\
    \nJim Krause’s *Idea Index: Graphic Effects and Typographic Treatments* provides\
    \ many \n\nmore inspirational ideas for graphic effects. \n\nBackground Images\n\
    \nBackground images, like all images, take time to download, while background\
    \ colors \n\nalone do not. As a result, we should use background images cautiously,\
    \ making sure \n\nthe added impact is worth the resulting download hit. Another\
    \ consideration is that \n\nbusy background images are usually anathema to good\
    \ design; rarely should a page \n\nbackground be the focus of attention. Still,\
    \ a subtle background image can enhance \n\nthe ambiance of a site.\n\nBackground\
    \ Image Contrast\n\nOne way to make sure that a background image doesn’t overwhelm\
    \ the page or \n\nrender the foreground text illegible is to use a low-contrast\
    \ image, like the image in \n\n**FIGURE 6.30**. The colors in the image are very\
    \ similar in tone and value, so the image \n\ncan provide interest without overwhelming\
    \ any foreground elements. As long as \n\nany foreground text is a dark color,\
    \ it will show up effectively. \n\n**FIGURE 6.30 **Low Contrast \n\nBackground\
    \ Image\n\n**FIGURE 6.30 **Low Contrast \n\nBackground Image"
  merge: -1
  pgno: 270
- img_proc: true
  md: "**CHAPTER SIX** Graphics\n\n**263**\n\nWhat if we want to use an existing image,\
    \ perhaps a photo, but its contrast is too \n\nhigh? **FIGURE 6.31A** shows just\
    \ such a high contrast image that would distract from \n\nany content on the page\
    \ and render text difﬁ cult to decipher. The remedy is to \n\nlower the image’s\
    \ contrast in an image-editing program. Simply tweak the “levels,” \n\nbrightness,\
    \ contrast, or hue/color saturation controls, or overlay the entire image \n\n\
    with a semi-transparent layer of white, black, or another color. **FIGURES 6.31B**\
    \ and **C** \n\nshow two methods that transform the original high-contrast image\
    \ into one more \n\nsuitable for a background.\n\n![](img/ee113e5612d290709e494a0dae247fc5_271_0.png)\n\
    \n**A. High-contrast Image, Not Generally Suitable **\n\n**as a Background**\n\
    \n![](img/ee113e5612d290709e494a0dae247fc5_271_1.png)\n\n**B. High-Contrast Image,\
    \ Overlaid with Semi-**\n\n**Transparent Red to Lower Contrast**\n\n![](img/ee113e5612d290709e494a0dae247fc5_271_2.png)\n\
    \n**C. High-Contrast Image, With Levels Adjusted **\n\n**to Lower Contrast**\n\
    \nEven if a high-contrast background is appropriate, we must then be careful that\
    \ \n\ndark text isn’t placed on dark areas of the background, and light text isn’t\
    \ placed \n\nover light areas, as illustrated in **FIGURE 6.32A**.\n\n**FIGURE\
    \ 6.31 **Creating a \n\nLow-contrast Background \n\nImage\n\n**FIGURE 6.31 **Creating\
    \ a \n\nLow-contrast Background \n\nImage"
  merge: -1
  pgno: 271
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**264**\n\n**Outline**\n\n**the**\n\n**Text**\n\
    \n**A. High Contrast Background, **\n\n**Text Illegible**\n\n**Outline**\n\n**the**\n\
    \n**Text**\n\n**B. High Contrast Background, **\n\n**Outline on Text**\n\nOne\
    \ remedy is to be very careful to lock light foreground elements in place on an\
    \ \n\narea of dark background and vice versa, although that’s much easier said\
    \ than done \n\non the web. Alternately, we could add a contrasting outline or\
    \ glow to foreground \n\nelements, such that light foreground elements are outlined\
    \ in a darker color, as \n\nin Figure 6.32B, and dark foreground elements are\
    \ outlined in a light color. In this \n\nway, the text is legible regardless of\
    \ whether it lands on a dark or a light area of \n\nthe background. This still\
    \ presents problems. First, although we can create images \n\nwith outlined text\
    \ for a limited number of page elements like headers, we can’t do \n\nthat for\
    \ the HTML text that comprises most content. Additionally, not only does the \n\
    \nbackground still look “busy,” but now the text areas do, too. Busy-ness multiplied\
    \ is \n\nrarely a good idea on a web page.\n\nLet’s look at each of the three\
    \ general types of background images: tiled back-\n\nground images, full-screen\
    \ background images, and partial-background images.\n\nTiled Background Images\n\
    \nIf an image is too small to ﬁ ll the entire background, the browser *tiles*\
    \ (repeats) it \n\nhorizontally and vertically until the background is ﬁ lled.\
    \ Because a tiled image is, by \n\ndeﬁ nition, smaller than a full-screen background\
    \ image, it’s inherently a smaller ﬁ le.\n\nTiled backgrounds can take advantage\
    \ of many different effects: textures, stripes, \n\ncolor gradients, random patterns,\
    \ and checkerboards, to name a few. **FIGURE 6.33**\n\nillustrates several different\
    \ background tiles and the effects they produce when \n\ntiled in a 200 x 200-pixel\
    \ area. \n\nWhat pixel dimensions are ideal for a background tile? Don’t assume\
    \ that the smaller \n\nthe image, the better. There is a point when the image\
    \ is so small that the download \n\n**FIGURE 6.32 **Text on a High \n\nContrast\
    \ Background\n\n**FIGURE 6.32 **Text on a High \n\nContrast Background"
  merge: -1
  pgno: 272
- img_proc: true
