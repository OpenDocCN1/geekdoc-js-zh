    \ rename or move a file from within Dreamweaver, it offers to update all links\
    \ site-wide that refer to that file, as we saw in Chapter 1. If you attempt to\
    \ delete a file, Dreamweaver warns you if there are still links in the site pointing\
    \ to the file.\n\n> “DON'T LEAVE HOME WITHOUT THEM\"\nObviously, these features\
    \ are such huge timesavers-avoidance aids that you should never move, rename,\
