  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 19


    analysis and design is indeed done before much construction begins. But the construction
    and testing phase also includes tasks normally included in the independent analysis
    and design phases. This is because much of the analysis and design for individual
    pages is deferred until the construction and testing phase for those pages, since
    every page has unique requirements that often can''t be ascertained until''s under
    construction. The result is that each page requires its miniature life cycle,
    as shown by the connecting, spiraling circles of FIGURE 1.11. Each page is represented
    by a concentric circle, and each page progresses through its own analysis, design,
    and construction and testing phases. Now, all of the phases are tightly coupled
    with all of the other phases. To, to put a fine technical sheen on it, building
    a web site is iterative and recursive instead of rigidly sequential.


    ![](img/ee113e5612d290709e494a0dae247fc5_27_0.png)


    The iterative nature of web site construction also means that sometimes we need
    to revisit a page that we thought had already completed. As a result, we often
    move backward, not just forward. For instance, several pages might be so closely
    related that none of them can be finalized until all of them are finalized, as
    would be the case with the multiple pages of a shopping-cart application. A good
    suggestion made by a user or manager for the 25th page might cause revisions on
    earlier pages. We might discover that an error or missed requirement on a later
    page has implications for prior pages. All in all, creating a web site is indeed
    a spiraling, reiterative process.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Prototyping/Rapid Application Development


    Another reason the lines between analysis, design, and construction and testing
    are blurred is that we use prototyping, also called rapid application development
    (RAD), in web development. That is, rather than designing a site on paper first,
    perhaps with dozens or even hundreds of pages of formal specifications, we rapidly
    "sketch" the pages in the development environment itself. The "sketch" is thereby
    in HTML already, so we can refine the page when until and managers are happy with
    it. At that point, our demo page is close to being a finished product anyway.
    Thus, we complete analysis, design, and construction without ever noticing that
    we progressed through all of the steps along the way.


    In effect, the system development phases are no longer distinct entities in web
    site development; the boundary lines have blurred, perhaps disappeared, and the
    phases have become more integrated. You might even say that the phases have become
    tasks instead.


    Now we''ll look at overviews of content analysis, site architecture analysis,
    usability factors, visual design, interaction design, and accessibility, all introductions
    to the chapters that follow.


    # Introduction to Content Analysis


    If you build it, they will come. If you build good content, that is. Content,
    highlighted in FIGURE 1.12, if visitors seek out a web site in the first place,
    why they stay once they get there, and why they return. Content is king; if a
    site does not have good content, it will not have visitors. Chapter 2 will delve
    into creating content.


    > "It doesn''t matter how you present the content of a page if the content isn''t
    worth presenting." -Dave DeAngelo, student in one of the author''s early web design
    courses.


    ![](img/ee113e5612d290709e494a0dae247fc5_28_0.png)


