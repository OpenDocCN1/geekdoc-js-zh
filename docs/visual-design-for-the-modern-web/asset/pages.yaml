  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**258**\n\nAlthough effects can be great\
    \ fun, they can be overused or applied with a heavy hand, \n\nand often too many\
    \ effects end up on a single image. Always use effects and ﬁ lters \n\nwith restraint;\
    \ the trend these days seems to be toward simpler, more graceful effects. \n\n\
    For instance, the heavy, 10-pixel, 3-D bevels that were ubiquitous on navigation\
    \ but-\n\ntons just a few years ago (as in **FIGURE 6.25A**) look dated these\
    \ days. Now, most sites \n\nuse more subtle, 2–3-pixel bevels, if using bevels\
    \ at all (as in **FIGURE 6.25B**). \n\n![](img/ee113e5612d290709e494a0dae247fc5_266_0.png)\n\
    \n**A. Outdated Heavy **\n\n**Beveling **\n\n![](img/ee113e5612d290709e494a0dae247fc5_266_1.png)\n\
    \n**B. Updated Light **\n\n**Beveling**\n\nIn classical painting, light typically\
    \ shines down from the top left, which is, not coinci-\n\ndentally, also the default\
    \ lighting angle in most image-editing programs. Although we \n\ncan alter the\
    \ angle if we choose, we should make sure the light source shines at the \n\n\
    same angle for every item on the page. Also keep in mind that a drop-shadow effect\
    \ \n\nwon’t show up against a very dark background, but a glow effect in a light\
    \ color does. \n\nWhatever effect we choose, it’s best if we can check what it\
    \ looks like on an older, \n\nless powerful computer system. Some gradient effects,\
    \ like drop shadow and glow, \n\ncan look awful on older systems because there\
    \ just aren’t enough colors available \n\nfor a smooth transition. The effect\
    \ ends up looking *posterized* (showing distinct \n\nbands of color rather than\
    \ smooth gradients). \n\nDespite that, deliberately posterized effects (accomplished\
    \ by lowering the color depth \n\nof the image), as in **FIGURE 6.26**, seem to\
    \ be hot trend these days. The key to successful \n\nposterization seems to be\
    \ that the image must be strongly, obviously posterized; subtle \n\nposterization\
    \ could be mistaken for nothing more than a poor-quality image. \n\n![](img/ee113e5612d290709e494a0dae247fc5_266_2.png)\n\
    \n**FIGURE 6.25 **Bevel Effects\n\n**FIGURE 6.25 **Bevel Effects\n\n**FIREWORKS\
    \ **\n\n**PLUG-INS**\n\nSupposedly, any plug-in \n\nadvertised for Photoshop \n\
    \nshould work in Fireworks \n\nas well, although you will \n\nhave to install\
    \ it sepa-\n\nrately for each program. \n\n**FIREWORKS **\n\n**PLUG-INS**\n\n\
    Supposedly, any plug-in \n\nadvertised for Photoshop \n\nshould work in Fireworks\
    \ \n\nas well, although you will \n\nhave to install it sepa-\n\nrately for each\
    \ program. \n\n**FIGURE 6.26 **Posterized \n\nPhoto, Using Only Four \n\nColors\n\
    \n**FIGURE 6.26 **Posterized \n\nPhoto, Using Only Four \n\nColors"
