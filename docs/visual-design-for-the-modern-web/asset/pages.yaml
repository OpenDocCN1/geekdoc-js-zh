  md: '# CSS Pseudo-classes for color Indicating Link State


    Of course, we can specify the `<body>` tag for at-rest links, active links, and
    visited links using attributes more. With CSS formatting, we can do even more
    using pseudo-classes to change the underline, border, background color, and rollover
    effects. Examples of the four CSS link pseudo-classes are shown in the sidebar.


    CSS REVIEW: LINK STATE PSEUDO-CLASSES


    For CSS link styles to work as expected, they should normally appear in the order
    below the stylesheet.


    ```

    <style type="text/css">

    :link {color:#00ff00; text-decoration:none};

    a:visited {color:#00ff00; text-decoration:none};

    a:hover {color:#0000ff; text-decoration:underline};

    a:active {color:#00ff0ff; text-decoration:underline};

    </style>

    ```


    Rules later in the pseudo-class sequence always overrides earlier in the list.
    Here, `a:active` overrides all others, and `a:hover` overrides `a:visited` and
    `a:link`. Violating the above rule can result in breaking some effects. For instance,
    the result of moving `a:hover` to the second item in the list will be that roller
    effects will not work on any links that have been visited. On the other hand,
    that could be effective if you don''t want visited links to show rollover effects.


    What if you don''t want all of the link states to be visible? Perhaps, you want
    to avoid the visual cluster of different affordances for visited links. If you
    omit `a:visited` from the stylesheet, the browser''s default visited color might
    appear anyway. The remedy is to explicitly specify a style for the visited link
    that is identical to the at-rest link style. for instance:


    ```

    <style type="text/css">

    a:link {color:#00ff00; text-decoration:none};

    a:visited {color:#00ff00; text-decoration:none};

    a:hover {color:#00cc00; text-decoration:underline};

    a:active {color:#00ff00; text-decoration:underline};

    </style>

    ```


    Whatever effects we we should be cautious when using any effect that changes the
    size of the text, as does boldface, italic, or a different font size. Altering
    size characteristics can force any subsequent page elements to shift position
    on the page, an undesirable and potentially messy consequence.'
