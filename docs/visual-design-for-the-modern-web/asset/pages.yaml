  md: '# Mixing Other Colors


    You can also skew a hue toward one of its neighboring colors. For instance, you
    might want a yellow to have a greenish tint, or to have purple undertones. To
    accomplish this mathematically, increase the code for the pair or pairs that best
    reflects the direction you want the hue to go. Alternately, construct a gradient
    between the two colors, as FIGURE 5.30.


    FIGURE 5.30 Altering the Hue


    ![](img/ee113e5612d290709e494a0dae247fc5_211_0.png)


    You can skew an entire group of colors all at once in a certain color direction
    as a way to create a unified palette, as shown using Adobe’s continuous palette
    as the "model" in FIGURE 5.31. For instance, all of the colors could be lightened
    in a single step by overlaying a 50% transparent white over the top. Alternatively,
    the same palette could be an overall yellowish one by superimposing a transparent
    yellow over the top, which renders the colors on the palette more harmonious because
    they all have the color yellow in common. In any case, you can use the color picker
    to choose the colors you need from this new, altered palette.


