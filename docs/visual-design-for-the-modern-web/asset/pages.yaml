  md: "**CHAPTER SEVEN** Typography\n\n**293**\n\nAs shown in Table 7.2, now we’ve\
    \ got CSS to help us add decorative effects. For \n\ninstance, the ﬁ rst line\
    \ in uppercase:\n\nFOUR SCORE AND SEVEN YEARS AGO OUR FATHERS BROUGHT FORTH \n\
    \non this continent, a new nation, conceived in Liberty, and dedicated to the\
    \ \n\nproposition that all men are created equal.\n\n…or the ﬁ rst letter of a\
    \ paragraph larger:\n\n**F**our score and seven years ago our fathers brought\
    \ forth on this conti-\n\nnent, a new nation, conceived in Liberty, and dedicated\
    \ to the proposition \n\nthat all men are created equal.\n\nAgain, the HTML and\
    \ CSS for these text formats is summarized in Table 7.2. \n\nHTML Text Spacing\
    \ \n\nAltering the default line and character spacing can lighten the overall\
    \ “grayness” of \n\na bland page. In particular, increasing the leading from HTML’s\
    \ default single spac-\n\ning can improve eye tracking from one line to the next,\
    \ particularly on longer lines \n\nof text. Leading is controlled with CSS:\n\n\
    .largerLeading1 {line-height:1.1em}\n\n.largerLeading2 {line-height:110%}\n\n\
    Extra spacing between letters or words can be used for emphasis, such as for head-\n\
    \ners. **FIGURE 7.7** shows how letter spacing/tracking and word spacing can be\
    \ con-\n\ntrolled by CSS (in the newer browsers), using absolute (pixels) or relative\
    \ (ems and \n\npercents) text spacing.\n\n![](img/ee113e5612d290709e494a0dae247fc5_301_0.png)\n\
    \n**FIGURE 7.7 **Letter and Word \n\nSpacing\n\n**FIGURE 7.7 **Letter and Word\
    \ \n\nSpacing"
  merge: -1
  pgno: 301
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**294**\n\nThe print industry has other\
    \ spacing standards that we should follow on the web, too: \n\n■ Use only one\
    \ space, not two, at the end of sentences. Fortunately, this is the \n\ndefault\
    \ in HTML, since it doesn’t recognize multiple adjacent spaces.\n\n■ Use either\
    \ an indent at the beginning of a paragraph, or double spacing \n\nbetween paragraphs\
    \ (this is the easier automatic option in HTML), but certainly \n\nnot both. \n\
    \n■ Ideally, allow the automatic blank line before a header tag, but use CSS margin\
    \ \n\nstyling to omit the automatic blank line after the tag. In that way, the\
    \ header is \n\ncloser and more visually connected to the content that it introduces:\n\
    \nh1 {margin-bottom:0em;} \n\nUnfortunately, any <p> tag immediately following\
    \ the header tag will add the \n\nextra spacing back in, as <p> tags are wont\
    \ to do. Therefore, we must also \n\nremove the extra spacing from those <p> tags:\n\
    \np.firstParagraph {margin-top:0em;}\n\nHTML Text Justification\n\nLeft, right,\
    \ and center justiﬁ cation are easy enough to do in HTML and CSS, using \n\neither\
    \ HTML’s deprecated align=”...” attribute or the text-align property in CSS. \n\
    \nHowever, full justiﬁ cation (text aligned on both the left and the right) is\
    \ virtually \n\nimpossible to pull off on a computer interface; the 72–100 ppi\
    \ of a computer display \n\ncannot allow for subtle adjustments. At such low resolution,\
    \ the result could well be \n\nletters or words spaced so far apart that they\
    \ are difﬁ cult to read. For that reason, \n\nwe should not use full justiﬁ cation\
    \ at all. \n\nHTML Text Layout\n\nWe examined general layout guidelines earlier\
    \ in Chapter 4, but layout guidelines \n\nspeciﬁ c to HTML text should be considered,\
    \ too. \n\nWeb readers skim content, rather than reading carefully. Therefore,\
    \ it’s important \n\nto *chunk* that content; that is, group content into small,\
    \ identiﬁ able sections using \n\nHTML tags such as <table>, <div>, <ﬁ eldset>,\
    \ <ol>, and <ul>. For bulleted lists, we \n\ncan use the default bullets supplied\
    \ automatically by the browser (no CSS bullet \n\nstyling), choose a speciﬁ c\
    \ browser-supplied bullet, or supply an image of our own:\n\n.listItem1 {list-style-type:\
    \ square} \n\n.listItem2 {list-style-image: url(myBullet.gif)}\n\n**FULLY JUSTIFIED\
    \ **\n\n**TEXT ON PRINTING **\n\n**PRESSES**\n\nProfessional printing \n\npresses\
    \ have 2400 or \n\nmore dots per inch to \n\nplay with, so they can \n\nproduce\
    \ fully justified \n\nbody copy that looks \n\nterrific. \n\n**FULLY JUSTIFIED\
    \ **\n\n**TEXT ON PRINTING **\n\n**PRESSES**\n\nProfessional printing \n\npresses\
    \ have 2400 or \n\nmore dots per inch to \n\nplay with, so they can \n\nproduce\
    \ fully justified \n\nbody copy that looks \n\nterrific."
