  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**270**\n\nnavigation column might be 100–150\
    \ pixels wide, a content column 500 pixels wide, \n\na logo banner 100–200 pixels\
    \ high, a thumbnail around 100 x 100 pixels. Although \n\nthose pixels are not\
    \ going to display at the same size on all systems, as we learned \n\nin Chapter\
    \ 4, these guidelines give us a place to start. It doesn’t take all that long,\
    \ \n\nreally, to become at ease with thinking in pixels. \n\nEmploy Visual Echoes\n\
    \nThe visual consistency of a site is enhanced by repeating graphic elements through-\n\
    \nout the site. Consider the following:\n\n■ Repeat an element from the logo elsewhere\
    \ on a page. For instance, pick a \n\nsimple shape from the logo and repeat it\
    \ as an icon, a button, or a bullet.\n\n■ Choose a color from the logo or a photograph\
    \ and repeat it elsewhere—in a \n\nbackground, on a bullet, or on text links.\
    \ Use the eyedropper/color picker tools \n\nin Fireworks or Photoshop to identify\
    \ the color code. \n\n■ Choose a consistent mood for graphics. For instance, organic\
    \ shapes are \n\nrounded, ﬂ owing, and irregular. Manmade shapes are well-deﬁ\
    \ ned, with straight \n\nlines and right angles. In general, two distinctly different\
    \ moods such as these \n\ndon’t play well together on a web page. \n\nKeep a 1\
    \ x 1-Pixel GIF at Hand\n\nA 1 x 1-pixel transparent GIF is a handy thing to have\
    \ at your disposal. It can be used \n\nas a ﬁ ller for empty table cells to avoid\
    \ the tendency of older browsers to choke \n\nwhen exposed to an empty table cell.\
    \ At the same time, it allows cells to be taken \n\ndown to very small sizes,\
    \ which ﬁ lling with an &nbsp; character won’t allow. \n\nA transparent GIF is\
    \ also handy as a spacer. For instance, we might want extra space \n\nbetween\
    \ two images. Although we could use multiple &nbsp; characters for spac-\n\ning,\
    \ they don’t deliver an exact number of empty pixels. A transparent GIF in an\
    \ \n\n<img /> tag, though, could specify an exact height and width. Normally we\
    \ avoid \n\nstretching an image with height and width, but it’s acceptable in\
    \ this situation \n\nbecause we don’t have to worry about the quality of the stretched\
    \ image if it’s \n\ninvisible anyway. \n\nA 1 x 1-pixel *colored* GIF can be useful\
    \ as well. We can stretch it to make a square \n\nbullet of any size. It can also\
    \ be repeated or stretched into horizontal or vertical \n\nrules (HTML doesn’t\
    \ provide vertical rules). \n\n**WHY NOT AN **\n\n**&NBSP;?**\n\nThe browser assumes\
    \ \n\nthat an &nbsp*;* is the \n\nheight and width of a \n\nspace character in\
    \ the \n\ncurrent font specifica-\n\ntion. It then refuses \n\nto reduce the size\
    \ of a \n\ntable cell below that \n\nheight or width.\n\n**WHY NOT AN **\n\n**&NBSP;?**\n\
    \nThe browser assumes \n\nthat an &nbsp*;* is the \n\nheight and width of a \n\
    \nspace character in the \n\ncurrent font specifica-\n\ntion. It then refuses\
    \ \n\nto reduce the size of a \n\ntable cell below that \n\nheight or width."
