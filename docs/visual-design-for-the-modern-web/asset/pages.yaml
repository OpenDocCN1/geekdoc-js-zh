  md: '# Subtractive Color Mode: Reflected Light


    Color is produced by light waves. A beam of white light is actually composed of
    all of the colors of the visible spectrum. If such a beam of light shines upon
    a prism, it splits into its individual waves, so that we see the rainbow of colors.


    On the other hand, when a beam of white light strikes an object, the object absorbs
    some of the color waves while reflecting others. The color that we see is the
    color that the surface reflects. For instance, when we look at a yellow sunflower,
    all colors of the light spectrum are absorbed by the sunflower except the color
    yellow, which is reflected and thus perceived by our eyes. This system is termed
    the subtractive color mode, because colors absorbed by the object are the colors
    that we can see. Subtractive color mode is what''s going on when we look at any
    object that does not project its own light, and it is the base upon which traditional
    color theory (and traditional art) rests.


    ![](img/ee113e5612d290709e494a0dae247fc5_192_0.png)


    Light can be measured as ether waves or particles. A full description goes beyond
    the scope of this book, and the resulting knowledge is of little practical use
    for manipulating colors on the web.


    # Additive Color Mode: Projected Light


    Web works quite differently. Instead of using reflected light, a computer projects
    light, much as the sun, a light bulb, and a television screen (or just are) projected
    light. Here, we see a beam of light, so we perceive light combined rather than
    separated. For instance, a pixel of white on the screen is actually the combination
    of all the available colors. (Remember the prism?) This system, then, is called
    the additive color mode, because all of the colors are added together to produce
    the color we see.


    Since additive (web-based) colors are produced by projected light from computer
    players, light waves are mixed together without concern about what a surface might
    absorb—there is no surface to absorb on. The web designer is designing light rather
    than pigments. As we will soon see, much of what we know about traditional color
    theory is turned upside down with additive color mixing for computer displays.


    A pixel is, of course, a single dot of color on the screen, composed of a varying
    mix of red, blue, and green,, is why this system is referred to as RGB. The color
    wheel changes for RGB color, because now the primary colors are red, green, and
    blue.


    FIGURES 5.9, 5.10, and 5.11 present the RGB primary, secondary, and tertiary colors,
    respectively. Similar colors to the traditional color wheel are represented, but
    they are derived in different ways. For instance, the secondary colors are now
    yellow, magenta and cyan. The mind-boggler here is that yellow is mixed by combining
    equal amounts of green and red, a concept that is simply not intuitive to most
    of us.'
  merge: -1
  pgno: 192
