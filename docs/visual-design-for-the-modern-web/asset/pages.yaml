    \ leave some spaces unembellished. As a\nresult, it looks haphazard and makes\
    \ us uncomfortable; few folks would be willing\nshell out a down payment on a\
    \ house with obvious design flaws.\n\nHow does all of this relate to web page\
    \ layout? Just as an architect tries to or-\nga building facade to be visually\
    \ pleasing, so too should you strive to make\na page looks simple, uncluttered,\
    \ coherent, and organized. If visitors feel it\ntake too much mental effort to\
    \ sort out all of the visual noise (clutter), they\nm very well out of the site.\
    \ At the same time, we need to know how to\nstulate visitors by piquing their\
    \ interest with new, contrasting, and surprising\nelements. The right balance\
    \ between such serenity and stimulation provides a\nleasing visual harmony.\n\n\
    # Techniques for Providing Visual Harmony\n\nLet's look at the techniques for\
    \ manipulating the visual characteristics of a page to\nrike the perfect harmony\
    \ between serenity and stimulation."
