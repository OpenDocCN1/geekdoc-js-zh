  md: 'Mixing shades with a gradient is identical to mixing tints with a gradient,
    but uses black at the opposite end of the spectrum instead of white, as shown
    in FIGURE 5.26. To mix a shade using an overlay, repeat the directions for mixing
    a tint, but use a semi-transparent black overlay.


    # FIGURE 5.26 Mixing Shades with a Gradient


    ![](img/ee113e5612d290709e494a0dae247fc5_209_0.png)


    # Mixing Tones


    Mixing tones mathematically is a bit more complicated than mixing tints or shades.
    Now, we change the color code to approach gray (all three RGB pairs are closer
    to being) by simultaneously reducing the hex pairs for the base hue—cyan—while
    increasing the other pair. FIGURE 5.27 illustrates a few of the tones that result.


    # FIGURE 5.27 Mixing Tones Mathematically


    ![](img/ee113e5612d290709e494a0dae247fc5_209_1.png)


    Essentially, you create a tone by adding gray to a color. That is, you add components
    of gray. black and white. You add the black by reducing the hex pair for the original
    color (as you would to create a shade) and add white by increasing the other hex
    pairs (as you would to create a tint). In doing so, you decrease the numeric difference
    between the base hue pair and the other hues, approaching a pure gray (equal values
    of all three pairs).


    As you reduce the far base hue and increase the other pairs, you must remember
    that the base hue must always remain the largest pair(s) in the RGB code. After
    all, being the largest is what makes it the base hue in the first place. For instance,
    if we attempted to make a tone of cyan and ended up with #996666, we would have
    lost the cyan dominance and replaced it with a version of red.


    Yet another way to produce a tone is to start with a gray of the correct value,
    and tweak it mathematically toward the dominant color you have in mind, as in'
