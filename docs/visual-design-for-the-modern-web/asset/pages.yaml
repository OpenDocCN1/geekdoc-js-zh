    When brainstorming for labels, consider synonyms, abbreviations, acronyms, alternative
    spellings (yes, even misspellings), and associated terms. An example of an associated
    term for the word "pepper" might be "salt." Opportunities to provide additional
    relevant information or to expand a sale. For instance, an airline reservation
