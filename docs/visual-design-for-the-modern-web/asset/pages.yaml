    # Metaphor as a Design Tool


    The use of metaphor is pervasive in web design, particularly for navigation. For
    instance, a computer desktop, complete with icons of files, folders, and recycle
    bin is a metaphor. Navigation buttons often look like real buttons that we could
    press some task in the real world. A rollover effect to "depress" the buttons
    heights the effect. A few common web metaphors are navigation controls that look
    like folder tabs and icons that look like printers, computer disks, and shopping
    carts.


    We can employ metaphor in a more global way as well, for the site as whole. If
    you can identify an metaphor that lends itself to a visual interpretation, the
    entire design task becomes easier. For instance, a hotel''s home page might look
    like the lobby of a hotel, with a check-in desk, the entrance to a restaurant,
    and a concierge desk. Each of these elements could be clickable, leading to reservations,
    a restaurant menu, and local attractions, respectively.


    The benefit to visitors is that common metaphors can convey immediate understanding.
    To be effective, a metaphor needs to be appropriate both conceptually and visually.
    For instance, it''s appropriate for United Airlines to use a globe as a logo,
    because their airplanes do circle the globe. It''s not appropriate for a pet supply
    retailer to use a globe, just because it has a presence on the "world wide" web.


    Although engaging to visitors, metaphors can also be dangerous, particularly if
    the metaphor cannot extend to cover all the necessary categories. If some of our
    categories must exist outside of the metaphor, we''ve introduced inconsistencies
    in our visitor''s mental model, something we generally try to avoid.


    ![](img/ee113e5612d290709e494a0dae247fc5_37_0.png)


    > BOLDNESS

    "When you''ve chosen a style, make that style as clear and distinctive as you
    can. You be bold. Make it stand out."—From User-Centered Web Design, by John Cato.'
