    C. Second-level drop-down menu appears when the second-level menu is clicked.


    # CREATING A DYNAMIC MENU


    Dreamweaver and Fireworks provide support for creating dynamic menus, called "pop-up
    menus" by Adobe. For instructions in Dreamweaver, search Help for "Spry menu"
    in Fireworks, choose Help > Contents > Creating Buttons and Pop-up Windows. After
    the menu system is created, you can tweak it to get the visual effects you desire.


    Another alternative is to download menu code from such sites as www.javascriptsource.com
    (free) or www.macromedia.com (some free, for a fee). Entering "drop-down menu"
    into a search engine will provide you with dozens of more sites.


    Keep in mind that even menu systems that claim to be cross-browser aren''t, the
    system breaks in an obvious way in some of the browsers, the easiest way to fix
    the problem (even if you know JavaScript) is to simply delete what you have and
    start over with a completely different script from another source.'
