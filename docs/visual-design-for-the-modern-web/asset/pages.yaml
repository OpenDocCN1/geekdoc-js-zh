  md: '# Digital Cameras


    Digital cameras are wonderful little devices for capturing images that can be
    displayed on a computer screen just moments after snapping the picture, without
    film and development costs. "Free" pictures might encourage us to take more pictures,
    giving us a better chance of coming up with one "killer" shot we need.


    Of course, there are disadvantages to digital photography:


    +   - The quality of photography may not be as high as that of traditional 35mm
    cameras, when wielded by professionals; only the more expensive digital cameras
    are comparable. However, as we have seen, high-resolution photography is probably
    overkill for the web anyway.


    +   - Only a limited number of images can be stored on a memory card. Larger or
    extra memory cards can compensate, but they can be expensive. An alternative is
    to download images to a laptop computer or portable storage device periodically.


    +   - Only the expensive digital SLR cameras (Single Lens Reflex, which practically
    means that the camera accepts separate lenses) have a large selection of fun photography
    toys like filters and lenses such. Although filters can be applied to the image
    later, in image-editing programs like Photoshop and Fireworks, the results are
    often less natural when applied from a camera lens.


    Desired features of a digital camera, whether SLR or not, include:


    +   - A higher number of megapixels. More megapixels mean more pixels are captured,
    which means the image is of higher quality and can be used at larger sizes without
    degradation. As of writing, the cheaper digital camera offers 4 megapixels, while
    more expensive cameras may exceed 10 megapixels.


    +   - Optical telephoto zoom. This, of course, brings distant objects closer.
    The higher the number, with digital SLR cameras, this measurement depends on the
    camera itself but on the lenses attached to it. In contrast, a digital zoom (as
    opposed to optical zoom) does only what Photoshop or Fireworks does when a bitmap
    is enlarged; it invents pixels out of thin air. As a result, it''s little of worth.


    +   - Wide angle zoom. More of the image fits into the picture. For wide angle
    specifications, the smaller the number, the better. The better cameras have a
    35mm camera equivalent of 28mm or less. With a digital SLR camera, this measurement
    depends not on the camera itself but on the lenses attached to it.'
