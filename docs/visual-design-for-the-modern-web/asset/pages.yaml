  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**318**\n\nMulti-line Text Input Areas\n\
    \nOften, text input can’t be limited to just a single line; it needs to be the\
    \ equivalent of \n\na paragraph of text, as in **FIGURE 8.17**. Here’s the HTML:\
    \ \n\n<textarea name=”comments” id=”comments” rows=”4” cols=”40” wrap=”soft”>\n\
    \n \n\nNo comment.\n\n</textarea>\n\n![](img/ee113e5612d290709e494a0dae247fc5_326_0.png)\n\
    \n \n\nThe cols attribute speciﬁ es the approximate width of the ﬁ eld, while\
    \ rows dictates \n\nthe height of the box. If a visitor enters more characters\
    \ than can be shown within \n\nthe speciﬁ ed rows and cols attributes, a scrollbar\
    \ appears automatically so that she \n\ncan continue entering text. Keep in mind\
    \ that the browser allocates space for the \n\nscrollbar within the <textarea>\
    \ even it isn’t needed.\n\nThe optional wrap attribute dictates whether text is\
    \ wrapped within the allotted \n\nspace and whether carriage returns are submitted\
    \ along with the ﬁ eld. Since the \n\nwrap attribute is not included in the ofﬁ\
    \ cial HTML standard, some older browsers \n\ndidn’t support it. Modern browsers,\
    \ however, seem to have settled on three pos-\n\nsible values for this attribute:\n\
    \n■ soft (the default): The text automatically wraps as the user types, but the\
    \ \n\nautomatically inserted carriage returns are not embedded in the ﬁ eld when\
    \ it’s \n\nsubmitted to the server. \n\n■ hard: Word wrap is turned on, just as\
    \ it is with soft, but now the inserted car-\n\nriage returns are submitted with\
    \ the ﬁ eld.\n\n■ off: Word wrap is turned off, so the text area continues to\
    \ scroll to the right as \n\nthe visitor types. Only if the visitor presses the\
    \ Return or Enter key does the \n\ncursor drop down to the next line. \n\nThe\
    \ <textarea> tag has another use, beyond capturing visitor input; it can also\
    \ be \n\nused to display informational text that needs to scroll. For instance,\
    \ software license \n\nagreements are often shown using a <textarea> tag, whereby\
    \ the visitor employs \n\nthe scrollbar to read through the agreement (should\
    \ he or she actually choose to \n\nread the software license, that is). **FIGURE\
    \ 8.18** shows such an example. When used \n\n**FIGURE 8.17 **Multi-line \n\n\
    textarea\n\n**FIGURE 8.17 **Multi-line \n\ntextarea"
  merge: -1
