  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**272**\n\n**3\\. **Click “OK” so that\
    \ Dreamweaver writes the HTML and JavaScript for the rollover. \n\n**4\\. **Remove\
    \ just the <img /> tag from within the <a> tag that Dreamweaver gener-\n\nated,\
    \ and move it to the area on the page where the rollover image should \n\nactually\
    \ render. \n\n**5\\. **Replace the removed image in the <a> tag with the text\
    \ or image that should \n\ninstead serve as the rollover trigger.\n\nRegardless\
    \ of whether it’s a local or a remote rollover, be sure that the two images \n\
    \nare identical in size, or else the rollover image might be squashed or stretched\
    \ to ﬁ t \n\nthe footprint of the original image.\n\n**PRELOADING ROLLOVER IMAGES**\n\
    \nThe first time any type of rollover is invoked, the image swap effect might\
    \ not show \n\nup immediately, because the rollover image must be downloaded.\
    \ In fact, the visitor \n\nmay have long since moved the mouse elsewhere before\
    \ the rollover image is ready to \n\nappear. The solution is to preload the image,\
    \ which involves downloading the rollover \n\nimage at the time the rest of the\
    \ page initially loads, even though the image won’t be \n\nneeded until later.\
    \ This way, the image is ready and waiting for its first appearance. In \n\nDreamweaver,\
    \ you can check “preload image” when inserting the rollover, or you can \n\nadd\
    \ “preload” to the image later, in the Behaviors panel. \n\nName Images by Function,\
    \ Not Visual Attributes\n\nWhen saving images, be sure to name them by function,\
    \ not by some visual attri-\n\nbute, because visual attributes might change in\
    \ the future. Let’s say we have cre-\n\nated a web site with red buttons for navigation\
    \ and blue buttons for submitting \n\nforms. If we name the buttons “buttonRed”\
    \ and “buttonBlue” and then later the \n\ncolor scheme of the web site changes,\
    \ our button names become meaningless. On \n\nthe other hand, if we name the buttons\
    \ “buttonSave” and “buttonSubmit,” then the \n\nsudden order from Management to\
    \ change the color scheme of the site will not ﬁ ll \n\nus with dread and will\
    \ in fact be relatively painless. \n\nAnimation\n\nIncluding animation is, undoubtedly,\
    \ tempting—perhaps even more tempting than \n\nall the graphics- and photography-based\
    \ elements we’ve discussed up until now. \n\nBut often it’s more enjoyable for\
    \ the designer to create than it is for the viewer to"
