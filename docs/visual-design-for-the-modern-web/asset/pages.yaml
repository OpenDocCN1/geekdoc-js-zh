  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   - Avoid turning scrolling. Removing scrolling can render some of the page
    completely inaccessible for people with smaller or lower-resolution monitors,
    particularly disastrous if the inaccessible area contains the navigation. Instead,
    leaving scrolling on automatic, so that a scrollbar appears only when needed.


    +   - Turn off frame borders, which are just plain ugly, and anachronistic to
    boot.


    +   - Each content page should have at least some minimal backup navigation, in
    case the navigation frame errors or a search engine delivers the visitor directly
    to the content page without the enclosing framyset.


    +   - Consider including <frames> if there''s a chance that some of your visitors
    have browsers that don''t recognize frames (although such visitors are a minuscule
    percentage of today''s web surfers).


    # Local Search Functions


    Including a well-designed internal search function on your site can give users
    access to the information they need. For instance, the fastest way to locate a
    web design book on Amazon is to enter the title or author name in Amazon''s search
    box. Finding a specific book by browsing the "web design" category on the hierarchical
    map may be a daunting task, given the 8,176 books in that category on as of this
    writing.


    An effective search function can be expensive to develop. Although there are plug-in
    engines that can be tacked on a site and then cha indefinitely with little input
    from developers, they deliver mediocre results unrivalled to the content on a
    site. You''ll get the most pertinent results when a skilled indexer, with knowledge
    of the domain, configures the search engine with categories, keywords, and synonyms.
    Such hand-crafted search configuration doesn''t come cheaply. It''s a classic
    cost-benefit decision: is it site worthy of a search function? Is the bang worth
    the bucks? It might be, if several of the following are true:


    +   - The site is quite large, such that browsing isn''t a reasonable way to find
    something.


    +   - The site is complex, with interrelated information and many cross-references.


    +   - The site is fragmented, with ambiguous and overlapping categories.


    +   - The target audience would expect a search function.


    +   - The target audience would use the search function frequently to justify
    the cost.


    +   - The site has highly dynamic content. For instance, a site map for CNN.com
    couldn''t be maintained fast enough to keep up with ever-changing news.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'In tailoring a search engine to our site, we return to the extensive lists
    of labels we compiled when researching our site architecture in Chapter 2. At
    that time, we worked to narrow our choices to only the most perfect, most precise,
    and most succinct terms. Now, however, we include all of the terms that were on
    the original, unlisted lists, as well as all terms that users might come up with,
    including likely misspellings of popular search terms.


    We need to look at the site from radically different viewpoints, to come up with
    categories that perhaps weren''t required for the original site architecture.
    For instance, perhaps the site''s hierarchical structure organizes technical articles
    by the general subject category, but we know that visitors access by author, exact
    title, date, or geographical location. The list of possible search terms that
    we will feed to the search engine continues to expand.


    # Search Interface


    In most cases, the search interface on each page should be as simple as possible,
    consisting primarily of a text box for entering the search query. Research shows
    that 27 or so characters to be an optimal size (www.useit.com/alertbox/20020512.html)
    because it''s large enough that most search fit without scrolling.


    You might pre-populate the search text box with brief instructions. For instance,
    the search box on www.redvelope.com initially starts, "description or item #,"
    to give the search some idea of the type of search phrases that are allowed. (See
    Chapter 8 for the pros and cons of displaying instructions like that in a field.)


    Visitors often expect that the search process should be activated by hitting "Enter"
    on the keyboard while still within the search text input box. It is automagically
    the case as one of two things are true:


    +   - The "Search" action button is a standard HTML `button`.


    +   - The search input box is the only-entered field within the form that surrounds
    it.


    In all other cases, more extensive JavaScript will be needed for "Enter" to be
    recognized properly.


    We should initially present the simplest search interface possible, but we can
    also offer an advanced search page for users who needed it. Advanced search options
    may include:


    +   - Search of zones: the entire web, our site, or specific sub-areas within
    our site. For example, on Amazon.com, visitors can choose to search all of Amazon,
    or just books or movies or whatever. Figure 3.1 presented Amazon’s Advanced Search
    function, with the search narrowed to just books, as indicated by the “Search
    Books” header.


    > KEEP IT TOGETHER

    nThe "Search" action button should be adjacent to the text input box.'
