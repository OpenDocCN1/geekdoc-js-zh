    # Menu Size


    Menu hierarchies can be narrow but deep, with only a few choices on each menu
    (FIGURE 3.19), or broad but shallow, with numerous choices on each menu (FIGURE
    3.20).


    FIGURE 3.19 Narrow But Deep Hierarchy


    ![](img/ee113e5612d290709e494a0dae247fc5_114_0.png)'
