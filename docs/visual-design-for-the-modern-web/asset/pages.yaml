    # Navigation Affordances


    We all learned to recognize hyperlinks on web sites. The characteristics that
    clue us in to a link are called perceived affordances, or just affordances for
    short. For example, the underline affordance on text is a pretty reliable clue
    (or at least, it should be) that link. If we click on underlined text and nothing
    happens, we feel dejected. The point is that we should apply link affordances
    only to links. We''ll look at specific navigation affordances for text and graphics
    in a link.


    No matter what affordances we use, we should be consistent; for instance, size,
    color, and style of text links should be constant throughout the site. It''s usually
    appropriate to change affordances only if meaning is attached to the change. For
    instance, a site might use green links and page backgrounds for all "Products"
    pages, with blue links and page backgrounds for all "Services" pages.


    Whatever affordances we use, we walk a fine line when designing the visual appearance
    of navigation. Of course, we visitors to notice the navigation as enticement to
    explore the site. At the same time, the content is the heart and substance of
    the site, and it should be given primary focus. Just as page numbers and headers
    in a book are readily apparent but don''t need to be in bright colors and huge
    fonts, so too much navigation be apparent but shouldn''t distract the visitor
    from the content.'
