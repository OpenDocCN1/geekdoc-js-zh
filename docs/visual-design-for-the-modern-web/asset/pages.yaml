  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**286**\n\nSpacing\n\n*Leading* refers\
    \ to the empty space separating lines of horizontal text. **FIGURE 7.4** \n\n\
    shows three different leading values: leading decreased by 20%, default single-\n\
    \nspaced leading (in this case, equal to the text height), and leading increased\
    \ by 20%. \n\nPrint experts often recommend a *looser leading*, an extra 10–20%\
    \ of space, because \n\nit makes it easier for the viewer’s eyes to track from\
    \ the end of one line to the begin-\n\nning of the next. Looser leading is especially\
    \ preferred for readability on longer \n\nlines of text. Tighter leading is preferred\
    \ at larger font sizes, such as headings.\n\nTighter\n\nLeading\n\n(-20%)\n\n\
    Tighter leading is \n\npreferred at larger \n\nfont sizes, such as \n\nheadings,\n\
    \nalthough the \n\nleading above is \n\ntoo tight.\n\nSingle-\n\nspaced\n\nLeading\n\
    \nNormal, single \n\nspaced leading \n\ncan be as tight as \n\nthe exact size\
    \ of \n\nthe font (as here) \n\nto as much as \n\n10% larger. That \n\nis, a 12-pixel\
    \ font \n\nmight have 14 \n\npixels of leading. \n\nLooser\n\nLeading\n\n(+30)\n\
    \nLooser leading is \n\nespecially\n\npreferred for \n\nreadability on \n\nlonger\
    \ lines of \n\ntext, but it can \n\nlook too loose in \n\nlarger text sizes \n\
    \nlike the heading \n\nabove. \n\n**Tight Leading (-20%)**\n\n**Single Spaced\
    \ Leading**\n\n**Looser Leading (+20%)**\n\nVarying the leading can vary the “color”\
    \ of a page. That is, it can make a page look \n\ndarker and denser, or lighter\
    \ and less dense, as the examples in Figure 7.4 illustrate. \n\nWhile leading\
    \ refers to the amount of space between lines of text, *letter spacing *\n\n(also\
    \ called* letter tracking*) refers to the amount of space between individual char-\n\
    \nacters within a paragraph or another selected chunk of text. Although wider\
    \ spac-\n\ning can be used for emphasis in headings and other decorative elements,\
    \ if the \n\nspacing is too wide, readers can have difﬁ culty grouping the letters\
    \ into distinct \n\nwords, as you can see here:\n\nW i d e r s p a c i n g d o\
    \ e s n ’ t n e c e s s a r i l y l e a d \n\nt o g r e a t e r l e g i b i l\
    \ i t y .\n\n**LEADING**\n\nThe term *leading* \n\n(rhymes with “sledding”) \n\
    \nwas derived from the \n\nlead spacers used for \n\nthe hot-metal type of \n\n\
    traditional printing \n\npresses.\n\n**LEADING**\n\nThe term *leading* \n\n(rhymes\
    \ with “sledding”) \n\nwas derived from the \n\nlead spacers used for \n\nthe\
    \ hot-metal type of \n\ntraditional printing \n\npresses.\n\n**FIGURE 7.4 **Leading\
    \ \n\nExamples\n\n**FIGURE 7.4 **Leading \n\nExamples"
