    \ to generate a scrollbar.\n\n \n\n</textarea>\n\n**<!-- Submit Button-->**\n\n\
    \ \n\n<input type=”submit” value=”Unstyled Submit” /> \n\n \n\n<input type=”submit”\
    \ value=”Styled Submit”\n\n \n\n \n\nstyle=”background-color: #8bbbc1; border:\
    \ 5px #c2d7db ridge; \n\n \n\n \n\nfont-family: Papyrus, Times New Roman, Times,\
    \ serif; \n\n \n\n \n\nfont-size: 1.3em; color: #ffffff; font-weight:600;” />\n\
    \n</form>\n\nNote that this particular form is not intended to be pretty, but\
    \ rather to show the \n\nwide possibilities for styling form elements. In fact,\
    \ it serves as a graphic reminder \n\nthat just because we *can* change every\
    \ possible characteristic of form elements \n\ndoesn’t mean that we *should*.\
    \ Additionally, we shouldn’t change the default styling \n\nof a form control\
    \ so much that it no longer resembles the control at all. For instance, \n\nthe\
    \ styled text input on Figure 8.28 now begins to resemble a button, and the styled\
    \ \n\nradio button no longer looks like a radio button at all. \n\nIn any case,\
    \ it should be clear from the previous chapters that any changes we make \n\n\
    to color or borders or other attributes should coordinate with the overall look,\
    \ feel, \n\nand mood of the site as a whole.\n\nVisual characteristics of form\
    \ elements and their associated text descriptions can \n\nhelp to guide our visitors\
    \ through a form. For instance, we might use a contrasting \n\ncolor for the description\
    \ next to all required ﬁ elds in the form. Color, however, is \n\nnot enough direction\
    \ alone, because that color may not be visible to a visitor who is \n\ncolor blind.\
    \ Therefore, some additional cue should be used, such as the ever-familiar \n\n\
    asterisk next to the ﬁ eld description. \n\nAnother example of how styling can\
    \ help gather accurate data is shown in **FIGURE **\n\n**8.29**. Here, the different\
    \ background colors are visual clues that heighten the value \n\nassociations\
    \ of the text descriptions. \n\n![](img/ee113e5612d290709e494a0dae247fc5_345_0.png)\n\
    \n**FIGURE 8.29 **Using Styling \n\nfor Visual Cues\n\n**FIGURE 8.29 **Using Styling\
    \ \n\nfor Visual Cues"
