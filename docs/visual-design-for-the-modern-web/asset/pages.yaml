  md: '# 204 VISUAL DESIGN FOR THE MODERN WEB


    # TABLE 5.4 COLOR MIXING


    | Color | Method | Explanation |

    |---|---|---|

    | Neutrals (black, white, and shades of gray) | Mathematical | All six digits
    must be equal, with lighter grays approaching white (#FFFFFF) and darker grays
    approaching black (#000000). Examples: #666666 (dark gray) and #CCCCCC (light
    gray). |

    | | Gradient | Create a gradient between white and black, and then pick the gradient.
    |

    | Tints | Mathematical | Start with the code for the dominant hue and progressively
    add more of the other colors'' hex digits until they approach white. Example:
    #000FF (blue) becomes #CCCCFF (light blue). |

    | | Gradient | Create a gradient between the hue and white, and then pick the
    gradient. |

    | | Overlay | Overlay the hue with a semi-transparent white. |

    | Shades | Mathematical | Start with the dominant hue''s code and progressively
    decrease the hue''s hex digit until the pair approaches black. Example: #000FF
    (blue) becomes #000066, a dark blue. |

    | | Gradient | Create a gradient between the hue and black, and then pick the
    gradient. |

    | | Overlay | Overlay the hue with a semi-transparent black. |

    | Tones | Mathematical | * Start with the dominant hue''s code, decreasing the
    dominant hue''s hex digit pair toward while simultaneously increasing the other
    colors'' hex digits toward white. Example: #000FF (blue) becomes #666699 (a dark
    tone of blue).

    * Start with a gray of the desired value, and increase the dominant hue''s hex
    digit pair. Example: #666666 (dark gray) becomes #666699 (a dark tone of blue).
    |

    | | Gradient | Create a gradient between the hue and gray or between the hue and
    its RGB complement, and then pick from the gradient. |

    | | Overlay | Overlay the hue with a semi-transparent gray or the complementary
    RGB color. Example: blue with yellow, its RGB complementary color. |

    | Altering the hue | Mathematical | Start with the dominant hue''s code and increase
    the hex digit for the color you want to influence the original hue. Example: #000FF
    (blue) becomes a bluish-blue by increasing the red hex digit, with #9900FF as
    the result. |

    | | Gradient | Create a gradient between the dominant hue and the desired undertone,
    and then pick from the gradient. Example: create a gradient between blue and purple
    if you want a bluish-blue. |

    | | Overlay | Overlay the dominant hue with a semi-transparent version of the
    desired undertone, and then pick from the gradient. Example: overlay a blue with
    a semi-transparent purple if you want a bluish-blue. |'
