  md: "**CHAPTER EIGHT** Forms\n\n**315**\n\n![](img/ee113e5612d290709e494a0dae247fc5_323_0.png)\n\
    \n \n\nThe ﬁ rst line on Figure 8.14 is somewhat problematic. Although it conserves\
    \ key-\n\nstrokes because it omits punctuation, that omitted punctuation could\
    \ aid in verifying \n\nthe accuracy of data entry. For instance, it’s much easier\
    \ for a visitor to double-\n\ncheck a telephone number when it looks like 815-555-1212\
    \ rather than 8155551212. \n\nIt may well be that in trying to “feed” the need\
    \ of the busy web-visiting public to \n\nget everything done quickly, we’re sacriﬁ\
    \ cing accuracy for the sake of saving those \n\nfew keystrokes. \n\nAnother alternative\
    \ is to allow visitors to enter data in any way they please, while \n\nwe use\
    \ a scripting language like JavaScript to reformat and redisplay the data in \n\
    \nour preferred format, including punctuation. For instance, a visitor might enter\
    \ a \n\ntelephone number in any of the following acceptable formats:\n\n■ 8155551212\n\
    \n■ (815) 555-1212\n\n■ 815-555-1212\n\n■ 815.555.1212\n\nWe would then redisplay\
    \ the ﬁ eld in its new, edited format so that the visitor can see \n\nthat the\
    \ ﬁ eld was entered properly. For instance, if the visitor typed 8155551212, the\
    \ \n\nsystem might redisplay 815.555.1212. \n\nAlthough many usability experts\
    \ advocate such free-form entry, many visitors are \n\nunderstandably confused\
    \ when they encounter an input ﬁ eld that doesn’t provide any \n\nformatting clues\
    \ at all. Such confusion tends to make a visitor pause, which defeats \n\nthe\
    \ very usability principles that recommend free-form entry in the ﬁ rst place.\
    \ \n\n**FIGURE 8.14 **Input Controls \n\nShowing Formatting Options\n\n**FIGURE\
    \ 8.14 **Input Controls \n\nShowing Formatting Options"
  merge: -1
