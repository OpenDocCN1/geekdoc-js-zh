  md: '# CHAPTER ONE Introduction to Visual Design for the Modern Web 33


    Yet another reason is Section 508 of U.S. government regulations requires that
    technology used within the U.S. federal government be accessible to people with
    vari-disabilities. Many local and state governments follow suit and may refuse
    to do busi-ness with non-governmental business organizations that do not comply
    voluntarily.


    The general rule for web sites is that they should provide identical content in
    access-sible formats whenever possible, or equivalent content in a different format
    when not. We can do so by providing compatibility with a variety of techniques
    and devices used by people with disabilities. For instance, screen-reader technology
    can read the words of a web page to people with visual disabilities, as long as
    we make sure our page is compatible with these screen readers.


    # Types of Disabilities


    What general types of disabilities do we consider?


    +   **Visual impairment.** This can range from the extreme of total blindness
