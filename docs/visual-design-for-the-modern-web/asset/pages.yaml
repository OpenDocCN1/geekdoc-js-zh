    # Display Size and Resolution


    One of the more challenging aspects of designing web pages is taking into account
    a myriad of display sizes and resolutions. Display resolutions are measured in
    pixels. Even so, the term "resolution" can refer to two different measures:


    +   The height and width dimensions of the entire display screen, as are 800 x
    600 resolution or 1280 x 1024 resolution, are standard dimensions for computer
    displays,


    +   PPI (pixels per inch, analogous to DPI/dots per inch in print media). We commonly
    use 72–100 PPI as the rule of thumb, the true PPI measurement is determined by
    the interaction of the display property settings on the computer with the size
    of the monitor. This interaction means PPI is not as straightforward as it might
    seem—certainly not a measurement from system.


    As an example, let''s assume that we have two computer systems that are currently
    using identical monitors (FIGURE 4.1). One system displays 800 x 600 pixels on
    the monitor, while the other is set to a resolution which is, 1600 x 1200 pixels.
    Therefore:


    +   The pixels must necessarily be smaller and more closely spaced on the higher
    resolution, 1600 x 1200 pixel system, since it displays twice as many pixels on
    the monitor.


    +   It follows, then, that a given web page and all of its components will look
    smaller on that higher-resolution system, because the pixels are smaller and packed
    in tighter. For example, in Figure 4.1, since the pixels on the 1600 x 1200 resolution
    image, so will be the text and images. Keep in mind that the pixels are larger
    on the lower-resolution system, individual pixels are also going to be more obvious.


    Now let''s look at a similar problem but from a different angle. Instead of changing
    the resolution between our two systems'
