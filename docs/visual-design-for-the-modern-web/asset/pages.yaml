  md: "**CHAPTER SIX** Graphics** 269**\n\n USING CSS TO POSITION A SINGLE INSTANCE\
    \ OF A BACKGROUND IMAGE\n\n**Variations on the following **<body> **tag can be\
    \ used to position a single copy of a **\n\n**background image:**\n\n<body style=”background-color:#660000;\
    \ \n\n \n\nbackground-image:url(backgroundImage.jpg); \n\n \n\nbackground-position:\
    \ center 20px; \n\n \n\nbackground-repeat: no-repeat;”>\n\n**In this case, the\
    \ background image is centered horizontally in the window and **\n\n**drops down\
    \ 20 pixels from the top of the window. **\n\nAn Alternative to a Background Image\n\
    \nAs we have seen, background images can add interest to a page. Even so, there\
    \ is at \n\nleast one way to get the look of a background image without actually\
    \ using an image \n\nat all, by manipulating table cell background colors for\
    \ graphic effects. **FIGURE 6.37** \n\nshows how such color blocking can give\
    \ a very graphic, “Mondrian” effect to a page \n\nwithout using a single background\
    \ image. Table cells or <div>s use appropriate \n\nbackground colors, while the\
    \ dark lines are accomplished easily with wide spacing \n\nthat allows the dark\
    \ background to show through, or with wide borders. \n\n**Title**\n\n**content**\n\
    \n**content**\n\n**content**\n\nHints on Working with Graphics\n\nHere are miscellaneous\
    \ working-with-graphics hints that don’t ﬁ t neatly into the \n\nprevious sections\
    \ of this chapter.\n\nThink in Pixels\n\nTrain yourself to think in pixels; don’t\
    \ even try to translate pixels to inches or centi-\n\nmeters in your head. Soon,\
    \ you will start to not have to consciously ﬁ gure out that a \n\n**FIGURE 6.37\
    \ **Using Table \n\nCells to Create Graphic \n\nEffects\n\n**FIGURE 6.37 **Using\
    \ Table \n\nCells to Create Graphic \n\nEffects"
