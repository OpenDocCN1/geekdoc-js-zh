- img_proc: true
  md: '# CHAPTER THREE Navigation 117


    There are two schools of thought for creating good page titles. One is to start
    with the site identifier, followed by the unique page title. For instance, pages
    for the site that accompanies this book might be titled as such:


    ```

    <Visual Design: Chapter 2, Site Analysis</title>

    <Visual Design: Chapter 3, Navigation</title>

    ```


    All of the pages in the site contain the initial phrase "Visual Design," while
    "Chapter 2" and "Chapter 3" uniquely identify different pages. This naming convention
    certainly provides the most information, resulting in titles. The primary disadvantage
    is that, if the visitor has multiple pages open in our site at the same time,
    the taskbar at view of the user''s display shows only the first few title words,
    which are identical for all pages. Unfortunately, there simply isn''t a good compromise.


    The <meta name="description" content="..." /> tag provides the description that
    shows up on some SERPs, right after the title, instead of the content surrounding
    the search term. If there were a place to be engaging, to pique interest, this
    is it. Use all of your writing and marketing skills to make this thing!


    In what order should the results appear on the SERP? The options include by:


    +   **Relevancy:** the most relevant items are displayed first. The engine can
    make a judgment of relevancy based on such indications whether or not the query
    term was in the page title and URL and how often the query appears in the content.
    It also looks at the words of a query term in close proximity. For instance, if
    the search were "George Washington Carver," the phrase "Biography of George Washington
    Carver" would rank higher than "George Smith, a Washington, D.C. Meat Carver,"
    because the requested terms are not physically adjacent in the list. Realtor.com
    shows the results of a search sorted by relevancy, depending upon how closely
    the property matches the requested features from advanced query.

    * **Date:** either the most recent items are displayed first (as on news sites)
    or the oldest items are displayed first (as for any presenting pages from a historical
    perspective).

    * **Alphabetical order:** for anything naturally organized alphabetically, such
    as telephone book entries or titles of articles.

    * **Geography:** displayed by region or proximity. An example would be a retail
    store locator utility, with the closest stores at the top of the list.

    * **Popularity:** based on how many visitors the page have had, how those visitors
    ranked those pages (if visitor ranking is encouraged), and how many others link
    to them.


    # BE BRIEF


    Search engine results typically show around 66 characters of the title, so don''t
    waste space on an initial "The" or "To..." Make the first few words the most salient
    and information-dense.


    # SERP CONTENT DISPLAY


    Some SERPs show the content from the description-<meta> tag, while others display
    the content surrounding the search term instead.'
  merge: -1
