  md: "**CHAPTER SIX** Graphics\n\n**273**\n\nwatch. As “consumers,” we have all experienced\
    \ *splash pages* (introductory pages \n\ndesigned merely to entertain) that take\
    \ forever to load, have no real purpose, are \n\n“glued on” to the site with no\
    \ real relationship to the rest of the site, and are impos-\n\nsible to bypass.\
    \ We have all endured an animation that continuously ﬂ ashes at \n\nus from a\
    \ corner of the screen, attracting (more like “distracting”) our attention \n\n\
    despite our best attempts to ignore it. And we have all tolerated (or not) even\
    \ more \n\nirritating pages that have multiple animations going on at once, all\
    \ vying for our \n\nnotice. Finally, although as users we are not thinking about\
    \ this as consciously, with \n\nanimation we put up with increased ﬁ le sizes\
    \ and download times (since all anima-\n\ntions contain multiple images, even\
    \ when stored in an efﬁ cient format like Flash). \n\nAlthough animation is not\
    \ inherently evil, we should use it with restraint. If even a \n\nsingle animation\
    \ on a page might be considered one animation too many, don’t even \n\nthink about\
    \ multiple animations on a page. Furthermore, animation is counterproduc-\n\n\
    tive if it distracts from what you want to emphasize. Therefore, it should only\
    \ be used \n\nto call attention to whatever is most important; if you want your\
    \ viewer to click on the \n\n“Sale!” button, then it might make sense to animate\
    \ the button. Finally, avoid anima-\n\ntion that loops endlessly—it can be endlessly\
    \ irritating. Instead, loop through a time \n\nor two and then stop, or at least\
    \ provide the viewer with a way to halt it manually.\n\nAnimation Terminology\n\
    \nBefore looking at the more common animation formats, we need to be clear about\
    \ \n\ncommon terminology. A *frame* (called a *cell* in traditional animation)\
    \ is a single draw-\n\ning within an animation. A *keyframe* is the beginning\
    \ or ending of a path of motion. \n\nAn animated bouncing ball might have a keyframe\
    \ at the top of its bounce and \n\nanother one when it hits the ground. There\
    \ might be ten frames between the key-\n\nframe at ground level and the keyframe\
    \ at the top of the bounce arc, and another \n\n10 frames on the downward half\
    \ of the bounce. \n\n*Tweening* is the process of creating the “in between” frames\
    \ between two keyframes. \n\nMost animation-editing programs can tween automatically.\
    \ That is, we specify the \n\nbeginning and ending keyframes, and how many frames/tweens\
    \ to insert in between. \n\nThe program then creates the interim instances with\
    \ interpolated attributes. Thus, \n\nwe wouldn’t have to create the ten frames\
    \ between the bottom and top of the bounce \n\nof the ball, because the animation\
    \ program tweens it for us. \n\nWe can use tweening to do more than just change\
    \ the positioning of an object. \n\nTweening can interpolate almost any object\
    \ attribute, from shape to size to color. \n\nFor instance, the shadow of the\
    \ bouncing ball might be tweened to get bigger and \n\nlighter in color as the\
    \ ball goes up, and smaller and darker as the ball comes down. \n\nThe more tweens\
    \ there are between two keyframes, the smoother the animation \n\nappears. Traditionally,\
    \ smoother animation has always been desirable. These days, the"
