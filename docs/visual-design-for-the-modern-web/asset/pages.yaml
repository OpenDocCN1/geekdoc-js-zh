    \n**CHAPTER EIGHT**\n\nForms\n\nJEF RASKIN, *THE HUMANE INTERFACE: *\n\n*“An interface\
    \ is humane if it is responsive to human needs and *\n\n*considerate of human\
    \ frailties.” *\n\nALAN COOPER, *ABOUT FACE 2.0: *\n\n*THE ESSENTIALS OF INTERACTION\
    \ DESIGN:*\n\n*“The poor writer is a visible writer, and a poor interaction *\n\
    \n*designer looms with a clumsily visible presence in his software.” *\n\nInput\
    \ forms—the web-based equivalent of traditional \n\ndata-entry forms—capture information\
    \ from your visitors. \n\nIn fact, any time a visitor enters data in a shopping\
    \ cart, \n\nanswers an online questionnaire, or ﬁ lls out a “contact us” \n\n\
    page, he or she is using a form. Forms are the foundation \n\nupon which interactive\
    \ elements such as text ﬁ elds, check \n\nboxes, radio buttons, and Submit buttons\
    \ are built."
  merge: -1
  pgno: 311
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**304**\n\nFor a form to capture accurate\
    \ information, it must be so obvious and unambiguous \n\nthat the viewer has no\
    \ doubt about what to enter in each ﬁ eld. Bad design in forms \n\nresults in\
    \ bad input. This chapter will examine the visual design characteristics and \n\
    \nusability factors to keep in mind when designing input forms. \n\nPrinciples\
    \ of Form Design\n\nFace it—visitors to web sites despise ﬁ lling out forms. They\
    \ want to accomplish a \n\ntask in the minimum amount of time, with a minimum\
    \ amount of hassle and effort. \n\nThe longer the form, the more impatient they\
    \ become; only the most motivated \n\nvisitors will tolerate a form longer than\
    \ one page. All of this relates to the principles \n\nof form design that follow.\
    \ \n\nReduce physical effort \n\nMost visitors don’t much like typing and “keyboarding”\
    \ any more than they have \n\nto. Consequently, we should take advantage of any\
    \ chance we have to minimize \n\na visitor’s clicks, keystrokes, mouse movements,\
    \ and scrolling. Speciﬁ cally, don’t \n\nrequest any piece of information more\
    \ than once; whenever there’s a chance of \n\nsome input data being identical\
    \ to previously entered data, take advantage of that \n\nfact. For instance, if\
    \ a visitor has already entered a billing address, then provide \n\nher with the\
    \ shortcut of checking a “same as billing address” box for the shipping \n\naddress.\
    \ Taking this a step further, we can remember data from a visitor’s previous \n\
    \nforay on our site, such as when Amazon asks permission to store a visitor’s\
    \ shipping \n\nand billing information so that she need not enter it the next\
    \ time she stops in. \n\nReduce cognitive effort \n\nIn addition to minimizing\
    \ the physical effort of typing, we also need to reduce cog-\n\nnitive effort.\
    \ It almost goes without saying that a form should be simple and easy to \n\n\
    understand. Sorting out a visually confusing page, with many seemingly unrelated\
    \ \n\nand unorganized elements, requires more mental exertion than many users\
    \ are will-\n\ning to expend. \n\nAvoid requiring any information perceived to\
    \ be \n\nunnecessary \n\nVisitors are most irritated by questions that they view\
    \ as irrelevant to their own \n\nneeds. They recognize that marketing questions\
    \ (demographics, interests and \n\nhobbies, and so on) beneﬁ t not themselves\
    \ but the web site’s parent organization \n\ninstead. It’s a given that visitors\
    \ will be exceedingly annoyed if such non-task-spe-\n\nciﬁ c questions are mandatory."
  merge: -1
  pgno: 312
