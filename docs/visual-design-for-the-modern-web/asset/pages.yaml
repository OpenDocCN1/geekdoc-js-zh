  md: 'CHAPTER ONE Introduction to Visual Design for the Modern Web 23


    # Usability Testing


    Long before unleashing your site on the world at large, you must test the site
    exten-s with real users. Usability testing should be incremental, beginning as
    soon as there are several pages that are complete enough that testers can get
    some idea of least navigation. Even if the navigation is not wired up to go anywhere,
    you can show it to testers and ask, "Where do you think this will go? What would
    you expect to find if you click this link? If the testers'' view of how the navigation
    works differs from the way it was actually intended to work, you have a problem.
    Better to discover that problem now, when only a few pages are constructed, rather
    than later, after hundreds of pages are just a few days shy of deployment.


    Of course, early testing does not in any way eliminate the need for later testing.
    In fact, you should test early, fix the problems, test again, and continue testing
    throughout the entire development cycle, as shown in FIGURE 1.14 (an expansion
    of just the "testing" phase from Figure 1.10). Retest at least once month through-out
    the project. If you are, really good at listening to what your testers tell you,
    you won''t have any major problems left to fix on your final test.


    FIGURE 1.14 Testing Process


    ![](img/ee113e5612d290709e494a0dae247fc5_31_0.png)'
