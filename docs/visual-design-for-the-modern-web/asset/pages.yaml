  md: '# VISUAL DESIGN FOR THE MODERN WEB


    Analysis, then, is the process of determining exactly what is needed before we
    start building anything. Essentially, we must think before we build, because we
    cannot hit a target if we don''t have a clear view of it first. We ask a lot of
    questions of all stakeholders—managers, technical people on the project, and potential
    site visitors—before doing anything else.


    In the first chapter, we looked at the system life cycle and how analysis fit
    into it, as shown here in FIGURE 2.1. You might recall that we discussed how we
    must do for overall site analysis at the inception of a project, but that we will
    go through a mini life cycle (including analysis, design, and construction and
    testing) for each individual page as shown in FIGURE 2.2. Thus, analysis is tightly
    integrated into all other tasks of the life cycle, rather than existing as a totally
    independent process. Additionally, the process is iterative; content and design
    changes must be incorporated throughout the entire life cycle. For instance, we
    often backtrack to prior stages and pages as we get feedback from users and potential
    visitors. Regardless, the tasks of analysis must be completed at some point: site-wide
    analysis at the project and page-specific analysis throughout the project.


