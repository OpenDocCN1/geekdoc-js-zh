  md: '# Employ the golden-mean rectangle.


    When creating rectangular shapes, keep in mind that the golden-mean rectangle
    is the most visually pleasing. A golden-mean rectangle has an approximate width-to-height
    ratio of 1 to 1.6, as illustrated in FIGURE 4.25. For example, a rectangle that
    is three inches tall and five inches wide is a golden-mean rectangle, and as one
    that is five inches tall and eight inches wide. It''s no accident that these particular
    dimensions are used for many common objects, such as flags and photographs.


    FIGURE 4.25 Dimensions of a Golden-Mean Rectangle


    ![](img/ee113e5612d290709e494a0dae247fc5_174_0.png)


    # Round out a “rectangles only” layout.


    Golden-mean rectangles notwithstanding, pages filled with nothing but rectangles—visible
    table cells, rectangular photos, horizontal rules, blocks of text—can become boring.
    For variety, you might try to include some rounded or irregular shapes:


    +   * Use rounded corner “borders” on tables, cells, or <div>s (as in Figure 4.12,
    with the rounded-corner images), or irregular borders.

    * Use an image editor to round or blur the edges of an image, or cut out the background
    entirely, replacing it with transparency, as for the Chanel watch photo-graph
    in Figure 4.22.

    * Use graphics that cross over the implied background grid, as with the butterfly
    that crosses over into another column in FIGURE 4.26.


    > MORE ON THE GMR

    ••

    For more on the fasci-nating-nating mathematics behind the golden-mean rectangle,
    see Kimberly Elam’s Geometry of Design.'
