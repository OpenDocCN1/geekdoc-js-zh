  md: "**CHAPTER SEVEN** Typography\n\n**291**\n\nAbsolute versus Relative Text Sizing\n\
    \nThere are two major reasons for preferring relative text sizing:\n\n■ As we’ve\
    \ already seen, absolute text sizing can override visitors’ font size set-\n\n\
    tings, thereby degrading accessibility for the visually impaired.\n\n■ As we saw\
    \ in Table 7.1, text resolution changes when we cross the Windows PC \n\nversus\
    \ Mac divide. If absolute sizing is used, specifying a text size of 24 pixels\
    \ \n\nresults in 1/3\" (24/72) on a Mac but 1/4\" (24/96) on a PC, a substantial\
    \ difference. \n\nOn the other hand, since their base font sizes are approximately\
    \ the same, rela-\n\ntive text sizing applied on top of those similar base fonts\
    \ should result in text \n\nthat’s approximately the same size. \n\nHTML Formatting\n\
    \nThere are, of course, common formatting commands that we can use in HTML or\
    \ \n\nCSS, as reviewed in **TABLE 7.2**. What we really need to examine right\
    \ now, though, is \n\nwhen it is and is not appropriate to use such formatting.\
    \ \n\nTABLE 7.2 TEXT FORMATTING WITH HTML AND CSS\n\nFormat \n\nHTML \n\n \n\n\
    (deprecated in favor of \n\n \n\nCSS formatting) \n\nCSS\n\nColor \n\ncolor=”#nnnnnn”\
    \ \n\n{color:#nnnnnn;}\n\nBold \n\n<strong>, <b> \n\n{font-weight:bold;}\n\n*Italic*\
    \ \n\n<em>, <i> \n\n{font-style:italic;}\n\n Reversed type  \n\ncolor=”#ffffff”\
    \ \n\n{color:#nnnnnn;} for the font and\n\n \n\nbgcolor=”#000000” \n\n{background-color:#mmmmmm;}\n\
    \n \n\n \n\nfor the area behind the text\n\nALL CAPS \n\nType all caps \n\n{text-transform:uppercase;}\n\
    \nall lowercase \n\nType all lowercase \n\n{text-transform:lowercase;}\n\nTitle\
    \ Case \n\nType title case \n\n{text-transform:capitalize;}\n\nUnderline \n\n\
    <u> \n\n{text-decoration:underline;}\n\nStrikethrough \n\n<s>, <strike>, <del>\
    \ \n\n{text-decoration:line-through;}\n\nFIRST LINE \n\nType all caps \n\n.allCaps:first-line\n\
    \nin uppercase \n\n \n\n{text-transform:uppercase;}\n\nFirst letter larger \n\n\
    <font size=”...”> \n\n.largeCap:first-letter \n\n \n\nfor first letter only \n\
    \n{font-size:200%;}\n\n**Reversed type**"
