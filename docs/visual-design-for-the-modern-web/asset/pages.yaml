    \ =\n\n```\n2 x 16^0  = 2 x 1    = 2\nD x 16^1   = 13 x 16  = 208\n4 x 16^2  =\
    \ 4 x 256  = 1024\n          1234_{16}\n```\n\nNote again that same number is\
