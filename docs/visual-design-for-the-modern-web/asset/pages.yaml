    # POSITIONED <div>s


    Here is the code for the <div>s in Figure 4.6:


    ```

    <div name="relative" id="relative"

    style="position:relative; left:50px; top:0px">

    <p>RELATIVE<br /> /Four score . . created equal.</p>

