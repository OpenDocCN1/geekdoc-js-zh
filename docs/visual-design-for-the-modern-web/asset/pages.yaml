  md: "**CHAPTER SIX** Graphics** 259**\n\nThere are ways to “edge” a photo, other\
    \ than just slapping the standard rectangu-\n\nlar image on the page. Here are\
    \ three ways (illustrated in **FIGURE 6.27**) to disguise \n\nthe “rectangleness”\
    \ of an image, all using transparency:\n\n■ Feather the edges out gradually to\
    \ the background. Use a selection marquee \n\nwith a “soft” stroke or “feather”\
    \ option, depending upon the image editor. \n\nReverse the selection, vary the\
    \ width of the feathering (depending upon how far \n\nyou want the blended effect\
    \ to extend), and then delete the reversed selection. \n\n■ Round the corners\
    \ of a photo, or cut it out to an irregular shape, often following \n\nthe outline\
    \ of the main subject of the photo. To do so, replace the deleted areas \n\nwith\
    \ either a transparent background or the color that matches the background \n\n\
    of the web page. \n\n■ Use a third-party “edge” ﬁ lter to curl, tear, or burn\
    \ the edges of the photo. The \n\nexample in Figure 6.27 shows the “torn paper”\
    \ edge from Alien Skin’s Splat \n\nsoftware (see www.alienskin.com for further\
    \ examples of such edges). \n\n![](img/ee113e5612d290709e494a0dae247fc5_267_0.png)\n\
    \n**Feathered Edge**\n\n![](img/ee113e5612d290709e494a0dae247fc5_267_1.png)\n\n\
    **Rounded Outline**\n\n![](img/ee113e5612d290709e494a0dae247fc5_267_2.png)\n\n\
    **Torn Paper Edge**\n\n \n\nLogo Design\n\nA *logo* (also called a *trademark*\
    \ or just a *mark*) is a particularly tricky graphic to \n\ndesign. Since a logo\
    \ is typically used to identify an organization on all sorts of media, \n\nfrom\
    \ signage to letterhead to business cards to, of course, the web, it must be:\n\
    \n■ Simple and distinctive enough to have strong, identiﬁ able visual impact.\
    \ The \n\nNike “swoosh” is a perfect example. \n\n■ Timeless, avoiding any trendiness\
    \ that would date it rapidly.\n\n■ Compact and versatile, so that it adapts well\
    \ to multiple media. For instance, a \n\nfull-color logo must often translate\
    \ well to black and white, for circumstances \n\nwhen color printing is too expensive\
    \ or otherwise impractical. \n\n■ Unique, such that it doesn’t violate any other\
    \ organization’s trademarks.\n\n**FIGURE 6.27 **Edges for \n\nImages\n\n**FIGURE\
    \ 6.27 **Edges for \n\nImages"
  merge: -1
  pgno: 267
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**260**\n\n■ Universal, using appropriate\
    \ cultural associations while avoiding inappropriate \n\nor offensive connotations.\n\
    \n■ Descriptive of the product or company (see **FIGURE 6.28**):\n\n■ Descriptive\
    \ literally, such as an orange in the logo for an orange juice com-\n\npany (describes\
    \ the product) or the peach in the Peachpit logo (depicts a \n\nword in the name).\
    \ \n\n■ Descriptive ﬁ guratively, implying the purpose or characteristics of the\
    \ company \n\nor product. The logo for Before & After Magazine is a more ﬁ gurative\
    \ interpre-\n\ntation, using the black and white typography in the word “Before”\
    \ as a contrast \n\nto the gaily colored typography in the word “After.” \n\n\
    ![](img/ee113e5612d290709e494a0dae247fc5_268_0.png)\n\n**Ravenswood Winery **\n\
    \n**(www.ravenswoodwinery.com, ©2007 **\n\n**Ravenswood Winery, Sonoma, California.)**\n\
    \n**Peachpit Press **\n\n**(www.peachpit.com, ©Pearson Education, **\n\n**Peachpit\
    \ Press. All rights reserved.)**\n\n**IBM® (IBM is a registered trademark of **\n\
    \n**International Business Machines Corporation.)**\n\n![](img/ee113e5612d290709e494a0dae247fc5_268_1.png)\n\
    \n**Before & After magazine **\n\n**(www.bamagazine.com)**\n\nIt’s an added bonus\
    \ if a logo is clever, because visitors feel a sense of community or \n\nparticipation\
    \ if they decipher hidden meanings, symbols, metaphors, or allusions. \n\nThe\
    \ Ravenswood logo is a good example of just such visitor involvement. Notice \n\
    \nhow the seemingly abstract circular design, vaguely Celtic in feeling, resolves\
    \ into \n\nthree ravens (from Ravenswood) upon closer inspection. \n\nThe ﬁ rst\
    \ step in creating a logo is to look for visual symbolism, either literal (à la\
    \ \n\nthe peach in the Peachpit Press logo and the ravens in the Ravenswood logo)\
    \ or \n\nﬁ gurative (the Before & After logo), associated with the company name\
    \ or prod-\n\nucts. We might show objects that reﬂ ect the theme or people using\
    \ the product, \n\nor employ a metaphor. \n\nAn alternative is to explore purely\
    \ typographic manipulations, such as is used in the \n\nIBM logo. Play with the\
    \ letters: What happens if they touch, or overlap, or change in \n\nsize or style?\
    \ The Before & After logo manages to combine both visual symbolism \n\n**FIGURE\
    \ 6.28 **Logos\n\n**FIGURE 6.28 **Logos"
  merge: -1
  pgno: 268
- img_proc: true
  md: "**CHAPTER SIX** Graphics\n\n**261**\n\n(“Before” in grayscale, “After” in brilliant\
    \ color) as well as a typographic manipula-\n\ntion. Note how the colors changed,\
    \ but the typeface did not, which keeps focus on \n\nthe effect of the color change.\n\
    \nThe next step is to create multiple visual representations of the generated\
    \ ideas. \n\nOne idea may be great, but 20 ideas are much better at this stage.\n\
    \nJust as a poem must be even more tightly and perfectly constructed than a 300-\n\
    \npage book, so too must a logo be even more tightly and perfectly constructed\
    \ than \n\nan entire web site, brochure, or advertisement. Many of the concepts\
    \ presented \n\nin Chapter 4 apply to logos as well, only more so. As with designing\
    \ a layout, we \n\ntry to repeat lines, spacing, shapes, colors, and typographic\
    \ treatments. Whenever \n\npossible, we align elements on an invisible grid and\
    \ pay as much attention to the \n\nbackground and negative space as we do to foreground\
    \ elements. And, most impor-\n\ntantly, we do our best to simplify, to distill\
    \ to just the essence of any idea we are \n\nexploring. For instance, the Peachpit\
    \ logo in Figure 6.28 portrays only the most \n\nfundamental characteristics that\
    \ make a peach recognizable: the silhouette, the \n\ncrease that runs vertically\
    \ around a peach, and the branch the peach hangs from. \n\nNo attempt is made\
    \ to show shading or leaves on the branch or any other element \n\nthat doesn’t\
    \ directly contribute to distinguishing this as a peach. The point is that \n\n\
    the very best logo is often the simplest imaginable design that manages to portray\
    \ \n\nthe organization’s brand. \n\nImage Design Inspiration \n\nDesign inspiration\
    \ can come from many different sources, from printed materials \n\nto graphics\
    \ in movie credits to wallpaper patterns. That said, **FIGURE 6.29** is a ran-\n\
    \ndomly-organized set of inspirational ideas.\n\n![](img/ee113e5612d290709e494a0dae247fc5_269_0.png)\n\
    \n**FIGURE 6.29 **Inspiration\n\n**FIGURE 6.29 **Inspiration"
  merge: -1
