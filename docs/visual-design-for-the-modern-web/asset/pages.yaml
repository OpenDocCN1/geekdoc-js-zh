- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    # Vector Images


    Vector images don''t specify individual pixels but instead store an image as a
    series of mathematical equations. For instance, the vector specifications for
    a 100-pixel rectangle would be the vertical and horizontal dimensions, the thickness
    and color code for the stroke (outline), and the color code for the fill (solid
    area) inside the rectangle. Since the underlying equation remains the same, regardless
    of the values of equation elements, the image''s size remains the same whether
    it displays at 10 x 10 pixels or 1000 x 1000 pixels.


    Vector graphics scale beautifully; we can change the size without compromising
    quality in the least, because, again, the basic equation remains the same. Common
    vector-based formats include native files created in Fireworks (file extension
    .png), Core Draw (.dwg), and Flash (.fla). Unfortunately, vector graphics are
    not appropriate for non-mathematical images such as photographs, and Flash files
    are the only vector graphics that are currently completely reliable on the web.


    # Bitmapped/Raster Images


    Bitmapped (also called raster or just bitmap) images are made up of individual
    pixels mapped to two-dimensional grids. A 30 x 30-pixel image must keep track
    of each of its 900 pixels individually, including the color code for each, while
    a 300 x 300-pixel graphic must keep track of 90,000 pixels. Bitmaps are a much
    less efficient way to store image data than the mathematical formulas used by
    vector images, with file sizes increasing dramatically as image increases. Nonetheless,
    bitmapped formats are the only practical way to store pixel-based, continuous-tone
    images such as photographs.


    Bitmap images degrade when scaled: after all, how can we scale something, indivisible
    pixels to, say, 135%? Not well. The loss of quality is particularly evident when
    a bitmap is enlarged, because pixels that don''t exist in the original have to
    be invented for the new, larger version. Although image-editing programs can make
    some fairly intelligent decisions about how to invent those pixels, the result
    is not as good as it might have had the pixels existed in the original image.


    # RESAMPLING BITMAPPED IMAGES


    Besides bicubic interpolation, other available resampling methods include bilinear
    interpolation and soft interpolation, which add some blur to images, and nearest
    neighbor interpolation, which gives a pixelated, jagged effect. See www.dppreview.com/learn/?Glossary/Digital_Imaging/Interpolation_01.htm.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The process of adding or subtracting pixels to resize or rotate a bitmapped
    image is called resampling or interpolation (translation: "educated guess"). Image-editing
    programs often provide a choice of resampling methods. Luckily, the only one we
    need to remember is bicubic interpolation (usually the default), the sophisticated
    and accurate method for web imaging.


    After reducing the size of a bitmapped image with bicubic interpolation, try applying
    a sharpening filter like "Unsharp Mask" (available in most image editing programs)
    to restore any sharpness lost in the resampling process.


    # UNSHARP MASK: A STRANGE NAME FOR A SHARPENING FILTER


    "Unsharp Mask" is a traditional darkroom technique that involves merging a blurred
    image (hence the "unsharp") with a normal image. See www.earthboundlight.com/phototips/unsharp-mask.html
    for more unexplained explanation.


    Bitmapped file formats include BMP, TIFF, PSD (Adobe Photoshop), JPG, GIF, and
    compressed-for-the-web PNG files. Of these formats, only JPG, GIF, and compressed
    PNG are intended for display on the web.


    # CONVERTING A BITMAPPED IMAGE TO A VECTOR IMAGE


    If we can convert a bitmapped image to a vector image, we may be able to resize
    and manipulate it more effectively. This conversion is not usually successful
    with photographs but can be appropriate for flat color images cartoons and diagrams.
    Few image-editing programs have vector conversion algorithms built in, such as:


    +   * The "Modify > Bitmap > Trace Bitmap" command in Flash. Once you''ve converted
    the image, you can always export it to another file format like PNG for further
    editing.

    * The "Live Trace" command in Illustrator, followed by Object > Expand.

    * The Filter > Stylize > Trace Contour command or Find Edges in Photoshop (though
    the latter method is not all intuitive and the result requires further tweaking).'
  merge: -1
