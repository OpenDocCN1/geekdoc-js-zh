    +   2. When done shopping, the customer clicks the “checkout” button.


    +   3. The customer enters the shipping information.


    +   4. The system presents full order details, including shipping costs.


    +   5. The customer enters credit card data and clicks “place order.”


    +   6. The system verifies the credit card.


