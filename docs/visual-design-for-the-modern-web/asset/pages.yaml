  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**316**\n\nHiding Input Data on the Screen\n\
    \nSometimes, one-line text areas should be protected so that someone looking over\
    \ \n\nthe visitor’s shoulder can’t read them. For instance, we don’t normally\
    \ display pass-\n\nwords on the screen where they can be read by any bystander.\
    \ In such a case, you \n\nuse type=”password” on the <input /> tag to display\
    \ asterisks or dots instead of the \n\ncharacters actually being entered by the\
    \ user. Note that type=”password” doesn’t \n\nprotect or encrypt the data in any\
    \ way whatsoever, just hides it on the screen. \n\nDefault Values for Text Input\
    \ Controls\n\nA default entry for the value attribute can save the user keystrokes\
    \ in those cases \n\nwhere there’s one possible value that’s much more common\
    \ than others. Let’s say \n\nthat 90% of our visitors are from Chicago. If we\
    \ provide “Chicago” as the default value \n\nfor city of residence, we save 90%\
    \ of our users having to type that in. The tradeoff \n\nhere is that our non-Chicagoans\
    \ must go to the trouble of deleting “Chicago” from the \n\nﬁ eld before entering\
    \ a different value. Therefore, it’s probably best to use a default \n\nonly if\
    \ it applies to 80% or more of our visitors. \n\nIt’s possible make use of the\
    \ value attribute to provide instructions to the visitor \n\non what to enter\
    \ in the ﬁ eld, as in **FIGURE 8.15**. However, this practice isn’t much \n\n\
    recommended, because it carries serious disadvantages:\n\n■ Deleting the instructions\
    \ adds another layer of effort for all visitors—and all the \n\nmore so for visitors\
    \ with physical disabilities. \n\n■ The instructions disappear after the visitor\
    \ starts typing a new value. \n\n■ If the visitor skips the ﬁ eld, the instructions\
    \ will be submitted as the value \n\nunless you capture and handle that omission\
    \ with a validation script. \n\n![](img/ee113e5612d290709e494a0dae247fc5_324_0.png)\n\
    \nRe-entering Critical Fields\n\nFor critical ﬁ elds—those that cannot tolerate\
    \ any type of a mistake at all, such as \n\nchoosing a new password—we might require\
    \ the visitor to type the ﬁ eld twice, as \n\na way of catching most typos. One\
    \ way to ensure that the visitor doesn’t try to \n\noutsmart us by copying and\
    \ pasting the ﬁ rst entry into the second one, thereby \n\nperpetuating any mistake\
    \ entered in the ﬁ rst one, is to put the second entry on a \n\nsecond page. **FIGURE\
    \ 8.16** shows how AMCORE Bank requires visitors to retype a \n\nbillpayer account\
    \ number on a second page.\n\n**FIGURE 8.15 **Default Value \n\nUsed for Instructions\n\
    \n**FIGURE 8.15 **Default Value \n\nUsed for Instructions"
