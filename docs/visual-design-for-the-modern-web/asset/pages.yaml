  md: '# Link States


    Possibilities for link state include:


    +   - Available/at rest


    +   - Available/rollover


    +   - Active


    +   - Visited


    +   - Current


    We will look at an overview of each state in the sections that follow. Later in
    the chapter we will see exactly how to use affordances to indicate state in both
    navigational text and graphic links. Note that you don''t necessarily need to
    indicate all link states, but be consistent from page to page to avoid bewildering
    visitors.


    # Available/At Rest State


    Available/at rest links exhibit the default state, shown as the page is initially
    rendered, without a mouse positioned over the link. The default color for text
    links and image borders are blue in most browsers. This can be changed in the
    `<body>` tag with the link attribute, and virtually all link attributes (color,
    underline, etc.) can be styled with CSS''s `a:link` pseudo-class.


    # Available/Rollover State


    Available/rollover refers to the state when the mouse is positioned over it. Rollover
    effects can''t be rendered with HTML alone, but the CSS pseudo-class `a:hover`
    can specify text-rollovers, and JavaScript can implement image rollovers (easily
    imagine swaps).


    # Active State


    An active link is one that was just immediately clicked. The latter effect shows
    only briefly, while the new page is loading, but it gives useful feedback to reassure
    the visitor that the click was recognized. Red is the default active color for
    text links and image borders in most browsers, but it can be changed in the `<body>`
    tag with the `active` attribute, and virtually all link attributes (color, underline,
    etc.) can be styled with CSS''s `a:active` pseudo-class.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# VISITED LINKS


    # Visited State


    Visited links are those that have been visited recently, how long is "recently"
    it varies between browsers, but typically visited links stay marked for longer
    than the current browser session. In fact, the visitor might return days later
    to find that visited links are still flagged.


    A visited link is one that has been recently visited. Purple is the default visited
    color for navigational text in most browsers, but it can be changed in the `<body>`
    tag with the visited attribute, and virtually all link attributes (color, underline,
    etc.) can be styled with CSS''s `:active` pseudo-class.


    Indicating links is most important for larger sites who want to visit systematically,
    such as a list of articles on a particular subject. In contrast, indicating links
    on sites where visitors are more likely to return to the same link repeatedly
    would do little more than add visual clutter.


    Avoiding using clearly obvious color for visited links, because too much adds
    more visual clutter to the page. Instead, the color should be subtly noticeably
    different from the standard link. A less saturated (bright) version of the standard
    color is usually appropriate, as long as the text is still legible against the
    background color.


    # Current State


    The current link isn''t truly a link, because it shouldn''t actually be clickable.
    That is, we keep the item on the menu, but we remove the link affordances and
    the rounding `<a>` tag, disabling the link. We are saving our visitors from page
    re due to accidental clicks.


    Why, then, don''t we remove the link from the menu structure entirely? Because
    the disabled link serves as a placeholder for the current page; a “you are here”
    marker, if you will, and also ensures the menus on all pages look exactly alike.
    Otherwise, we would risk muddling your visitor''s mental model of the site structure.


    # Navigational Text


    You''ve seen, and used, this kind of construction all over the web:


    **Purchase this book at Amazon.**


    That''s a link—useful words that take you somewhere without displaying the actual
    URL. Here''s the ubiquitous and simple HTML for it:


    ```

    <a href="http://amazon.com">Purchase this book at Amazon</a>

    ```


    Text links are the navigational workhorse of web sites. This technique has several
    key advantages over navigational graphics like:


    +   * Text links present a compact, clean, and simple visual effect.'
