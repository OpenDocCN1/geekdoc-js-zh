  md: '# TABLE 5.5 COLOR SCHEMES


    | Description | Ambiance | Example |

    |---|---|--|

    | Monochromatic | Tints and shades of a single hue | Unified, harmonious, and
    professional | White, light blue, medium blue, dark blue, and black |

    | Complementary | Two colors opposing each other on the traditional color wheel
    | Vibrant, jarring, and attention-getting | Orange and blue |

    | Triad | Three evenly spaced colors around the color wheel | Bold, vibrant, potentially
    jarring | Yellow, blue, and red |

    | Analogous | Several colors adjacent to each other on the color wheel | Harmonious,
    stylish, and pleasing | Yellow, orange, and green |

    | Warm | Variations of yellow, and red | Warm, cozy, and inviting | Yellow, orange,
    and red |

    | Cool | Variations of greens, blues, and purple | Slick, sophisticated, and professional
    | Green, blue, and purple |


    # Inspiration for Color Schemes


    Pay attention to color trends in fashion and home décor, because colors that are
    hot in those areas today will be on web sites tomorrow. As of this writing, earthy
    tones like browns and oranges have returned after decades of being ridiculed as
    a passé holdover from the 1970s. In a recent time, home decorating magazine quoted
    several interior designers as saying that "brown is the new black." Shades of
    gray also seem to be replacing black as the neutral of choice on the web, particularly
    in high-end market web sites, like Chanel and Mercedes. These sites are often
    primarily in grayscale, with only a few well-placed shots of color.


    For ideas for appealing color schemes, simply look around. Inspiration can come
    from unlikely locations:


    +   * A favorite sweater or coffee mug.

    * Ads on TV.

    * Opening credits of movies.

    * Catalogs, assignments, and fashion decorating magazines.

    * Displays in gift, home, and fashion stores. Walk into any Crate & Barrel in
    the United States to see the trendiest colors in design today.'
