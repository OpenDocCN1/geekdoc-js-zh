  md: '# Client-side Technologies


    In a web environment, a client consists of the visitor''s computer (hardware)
    and the browser application (software) that displays a web page.


    # Browsers


    The browser''s mission is to request, retrieve, and display documents (another
    term for web pages) for the visitor. There are currently dozens of browsers and
    browser versions in use. Alas, each one may have its own quirky (the polite way
    of saying "madeningly buggy") of rendering a document.


    If you are fortunate enough to be coding for a corporate intranet environment,
    everyone in the organization properly uses the same version of the same browser.
    In such a case, you can simply code and test that specific browser. But if you
    are building a public-access internet web site, you need to keep in mind that
    many features are interpreted idiosyncyncratically by different browsers, or even
    different versions of the same browser.


    Microsoft Internet Explorer (IE) has dominated the browser marketplace for years,
    but other browsers (notably Firefox) have steadily gained market share. FIGURE
    1.3 shows browser market share as of July 2007. It seems safe to say that we should
    protect all public web sites on at least the latest versions of Internet Explorer
    and Firefox.


    > QUIPS AND QUOTES Eric Meyer, a leading author and CSS expert, calls coding for
    the vagaries of the different browsers bugwards coding."


    FIGURE 1.3 Browser Prevalence (statistics compiled by http://marketshare.hitslink.com/report.aspx?qrid=0,
    July 2007)


    ![](img/ee113e5612d290709e494a0dae247fc5_14_0.png)


    | Internet Explorer 79% |

    | Firefox 14% |

    | Safari 5% |

    | Netscape 1% |

    | Opera 1% |'
  merge: -1
