  md: "**CHAPTER EIGHT** Forms** 305**\n\nWe have to be careful about the way in which\
    \ we ask for even required data. For \n\ninstance, most users are turned off by\
    \ a site that won’t let them enter at all until they \n\nprovide some personal\
    \ information—how can they yet know if the site is worth the \n\ntrouble? They\
    \ aren’t even sure if the site is trustworthy. As a result, many of them tap \n\
    \nthe Back button, and it’s goodbye. In contrast, if visitors ﬁ rst see the contents\
    \ of the \n\nsite, they at least have the chance to become intrigued, and will\
    \ likely be more willing \n\nto provide information. All this relates to the issue\
    \ of *salience*, or importance, to visi-\n\ntors. The higher the salience, the\
    \ more willing visitors are to jump through hoops. \n\nIf some of the information\
    \ you’re asking for is required, while other ﬁ elds are \n\noptional, use some\
    \ visual clue to signify which is which, so that visitors can choose \n\nto ignore\
    \ the optional ﬁ elds (which, of course, most of them will do). Placing an \n\n\
    asterisk next to all of the required ﬁ elds is a common technique that most visitors\
    \ \n\nrecognize, as in **FIGURE 8.1**.\n\n![](img/ee113e5612d290709e494a0dae247fc5_313_0.png)\n\
    \nCollectively, the various form elements like text input areas and checkboxes\
    \ are \n\ncalled *controls*,* form controls*, or *widgets*, the subject of the\
    \ next section. \n\nInput Controls\n\nInput controls are wrapped in a <form> tag\
    \ that speciﬁ es the name of the form as \n\nwell as the method and action that\
    \ should transpire when the form is submitted. \n\nWithin a form, two general\
    \ categories of controls capture visitor input: \n\n■ *Predeﬁ ned choice controls*\
    \ such as radio buttons, checkboxes, and list boxes.\n\n■ *Text controls* that\
    \ allow the visitor to enter free-form text data. \n\nPredeﬁ ned choice controls\
    \ minimize visitor keystrokes and ensure accuracy because \n\nthere are a limited\
    \ number of choices, all guaranteed to be valid. For example, typos \n\nand spelling\
    \ errors are eliminated on state names if we provide a drop-down list \n\nof choices\
    \ (all presumably spelled correctly). It’s usually in our best interest to use\
    \ \n\npredeﬁ ned choice controls whenever there are a limited number of options\
    \ from \n\nwhich the visitor must select.\n\n**FIGURE 8.1 **Indicating \n\nRequired\
    \ Fields\n\n**FIGURE 8.1 **Indicating \n\nRequired Fields\n\n**TECHNICAL TERMS**\n\
    \nYes, “form control” \n\nreally is the technical \n\nterm for any field or \n\
    \nbutton that you need \n\nto interact with as \n\nyou move through the \n\nprocess\
    \ of filling out a \n\nform. If it makes you \n\nfeel any better to call \n\n\
    it a “widget,” that is a \n\ntechnologically correct \n\nalternative. \n\n**TECHNICAL\
    \ TERMS**\n\nYes, “form control” \n\nreally is the technical \n\nterm for any\
    \ field or \n\nbutton that you need \n\nto interact with as \n\nyou move through\
    \ the \n\nprocess of filling out a \n\nform. If it makes you \n\nfeel any better\
    \ to call \n\nit a “widget,” that is a \n\ntechnologically correct \n\nalternative."
  merge: -1
  pgno: 313
