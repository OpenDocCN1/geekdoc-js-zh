- img_proc: true
  md: '# 118 VISUAL DESIGN FOR THE MODERN WEB


    The best search functions allow visitors to choose what they consider to be the
    most important ranking characteristics. For instance, on Realtor.com choose between
    results by square feet, by how closely the home matches requested features, or
    by price.


    It''s also helpful to present a choice of how many results display per page. For
    instance, nordstrom.com initially displays 21 results per page but offers the
    option to display 99 results per page index.


    Search engine results pages should offer the visitor the opportunity to alert
    or refine the search if the results aren''t satisfactory. The initial results
    can serve as a springboard, helping a visitor decide how to construct a more focused
    query.


    # Search Logs


    Log files from your local search engine can show you which visitors enter into
    your search function. These logs can help you refine your navigation and the search
    system itself, since the terms that surprise you are often the terms where the
    "scent" of information has been lost for visitors. For instance, if the unexpected
    phrase turns up in the search logs repeatedly, you need to feature that phrase
    more prominently on your navigation.


    # Embedded Links


    Embedded links (also contextual or inline links) are text links within normal
    body text and indicated only by some formatting change, such as underlining or
    a color change. For example, this could be an embedded link if we were on a web
    page. Embedded links are pretty much like footnotes in a book; they provide secondary
    elaboration that supplements the main content without interrupting the flow of
    that content. At the same time, the context of the surrounding helps to clarify
    exactly what information will be presented if the visitor clicks the link.


    Embedded links shouldn''t be used as the sole navigation on a page, because they
    don''t offer the mental site mapping which menus provide. Moreover, numerous embedded
    links can overwhelm the page with visual noise, as just they are doing in this
    paragraph. Use such links judiciously.


    # Teasers


    A teaser is an "aside" designed to grab the visitor''s attention. Teasers are
    commonly used for announcements of sale items or news flashes. Even banner ads
    could be considered teasers. Teasers are often set off to the side of the main
    content, in an area of their own. Sometimes they instead appear at the end of
    a summary paragraph, offering the opportunity to read more information. For instance,
    a news site might provide one-paragraph news brief, with a More >> link to the
    longer article.'
  merge: -1
