  md: "# Image Maps\n\nAn image map is a single image with areas designated as hotspots\
    \ (links). Hotspots can be specified as rectangles, circles, or irregular polygons.\
    \ FIGURE 3.11 shows an image map with hotspots indicated by colored overlays.\n\
    \nFIGURE 3.11 Image Map with Hotspots\n\n![](img/ee113e5612d290709e494a0dae247fc5_106_0.png)\n\
    \nHTML REVIEW: IMAGE MAPS\n\n```\n<img name=\"fruitBowl\" id=\"fruitBowl\" src=\"\
    fruitBowl.jpg\" border=\"0\" width=\"392\" height=\"500\" alt=\"Fruit Image Map\"\
    \ usemap=\"#fruitImageMap />\n<map name=\"fruitImageMap\">\n  <area href=\"apple_info.html\"\
    \ shape=\"circle\" coords=\"251,146,311\" title=\"Nutritional Data for Apples\"\
    \ alt=\"Nutritional Data for Apples\" />\n  <area href=\"apple_info.html\" shape=\"\
    circle\" coords=\"219,203,256\" title=\"Nutritional Data for Apples\" alt=\"Nutritional\
    \ Data for Apples\" />\n  <area href=\"grape_info.html\" shape=\"rect\" coords=\"\
    14,154,97,333\" title=\"Nutritional Data for Grapes\" alt=\"Nutritional Data for\
