  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**268**\n\nNon-tiling Partial Background\
    \ Images\n\nSometimes, we want a background image that neither ﬁ lls the screen\
    \ nor tiles. \n\nThere are two ways to show a partial background image:\n\n■ Specify\
    \ a solid color background for the entire page, and a separate background \n\n\
    image for the <div> or <table> that holds the main content, as in **FIGURE 6.36A**.\
    \ \n\nYou can also use CSS (see sidebar) to position the image precisely on the\
    \ page, \n\nalthough it can be trickier to line up the content with the background\
    \ image.\n\n■ Make the image the background for the entire page, and use a solid\
    \ background \n\ncolor for the <div> or <table> that holds the main content (as\
    \ in **FIGURE 6.36B**)—\n\nin short, the reverse of the previous method. The primary\
    \ advantage to this \n\ntechnique is that you don’t have to worry at all about\
    \ whether or not the page \n\nbackground interferes with the legibility of the\
    \ content. \n\n![](img/ee113e5612d290709e494a0dae247fc5_276_0.png)\n\n**A. Content\
    \ over Background Image **\n\n![](img/ee113e5612d290709e494a0dae247fc5_276_1.png)\n\
    \n**B. Content over a Solid Color Area**\n\n**FIGURE 6.36 **Non-tiling \n\nPartial\
    \ Background Image\n\n**FIGURE 6.36 **Non-tiling \n\nPartial Background Image"
