  md: "**CHAPTER EIGHT** Forms\n\n**319**\n\nfor display of text, rather than input,\
    \ we can add the readonly attribute to the tag \n\nso that visitors can’t change\
    \ the displayed text. \n\n![](img/ee113e5612d290709e494a0dae247fc5_327_0.png)\n\
    \n \n\nForm Completion\n\nWe usually employ JavaScript to validate data locally\
    \ on the client as much as pos-\n\nsible, to make sure that we’re not submitting\
    \ obviously invalid data. Only after the \n\ndata is validated do we ship it off\
    \ to the web server. Let’s look ﬁ rst at the speciﬁ cs \n\nfor validating data,\
    \ and then at specifying Submit buttons.\n\nForm Validation\n\nAlthough this book\
    \ doesn’t cover the speciﬁ cs of how to use JavaScript for vali-\n\ndation, it\
    \ is appropriate here to discuss the types of validation that should be \n\ndone.\
    \ Validation on the client is generally limited to completeness and format. For\
    \ \n\ninstance, we might validate a customer number to make sure it’s not blank,\
    \ that \n\nit’s all numeric, that it contains the proper number of digits, and\
    \ that it’s within a \n\ncertain allowable range. What we can’t do from within\
    \ the HTML document is make \n\nsure that a customer number matches an existing\
    \ customer number in the data-\n\nbase; such validation would require a server-side\
    \ query to the customer database.\n\nIdeally, we validate each ﬁ eld as soon as\
    \ the focus moves away from it after it’s \n\nbeen changed. That way, we can provide\
    \ an error message and allow the visitor \n\nto re-enter the data immediately,\
    \ before moving forward. After the entire form is \n\nsubmitted, all of the data\
    \ should be validated again in order to catch any required \n\nﬁ elds that the\
    \ visitor might have skipped over. \n\n**FIGURE 8.18 **<textarea> \n\nfor Display\
    \ Only \n\n(www.grisoft.com)\n\n**FIGURE 8.18 **<textarea> \n\nfor Display Only\
    \ \n\n(www.grisoft.com)\n\n**CLIENTS AND **\n\n**SERVERS**\n\nRefer to Chapter\
    \ 1 for \n\na quick review of how \n\nclients and web servers \n\ninteract.\n\n\
    **CLIENTS AND **\n\n**SERVERS**\n\nRefer to Chapter 1 for \n\na quick review of\
    \ how \n\nclients and web servers \n\ninteract."
  merge: -1
  pgno: 327
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**320**\n\nWeb sites like http://javascript.internet.com\
    \ provide free scripts for many common \n\nvalidating tasks. For instance, you\
    \ might ﬁ nd scripts to validate email addresses, \n\ncheck for valid zip codes,\
    \ or strip away excess spaces from a text entry.\n\nThe important thing to remember\
    \ is that any efforts to trap formatting errors right \n\naway can save needless\
    \ (and in some cases costly) queries against the server-side \n\ndatabase. It’s\
    \ best to catch and correct as many errors as possible, as soon as pos-\n\nsible,\
    \ while the visitor is still on the page. We’ll discuss contending with those\
    \ errors \n\nin the Visitor Support section. \n\nSubmit Buttons \n\nSubmit buttons,\
    \ of course, submit the form and all of its data using the action and \n\nmethod\
    \ speciﬁ ed in the <form> tag. The button can be either a standard, browser-\n\
    \ngenerated Submit button, or a custom button created in an image-editing program.\
    \ \n\n**FIGURE 8.19** shows an example of each, and the sidebar reviews the HTML.\n\
    \n![](img/ee113e5612d290709e494a0dae247fc5_328_0.png)![](img/ee113e5612d290709e494a0dae247fc5_328_1.png)\n\
    \n**Browser-supplied **\n\n**Custom Image **\n\n BROWSER-SUPPLIED VERSUS CUSTOM\
    \ SUBMIT BUTTONS\n\n**A standard Submit button is supplied by the browser, using\
    \ code like this:**\n\n<input type=”submit” value=”Submit Form” />\n\n**A standard\
    \ Submit button automatically submits the form to the server (unless **\n\n**you\
    \ override with JavaScript). The **value** attribute specifies the text that appears\
    \ **\n\n**on the button. If the **value** attribute is omitted, the browser supplies\
    \ the wording, **\n\n**usually “Submit” or “Submit Query.” The left image in Figure\
    \ 8.19 shows how this **\n\n**Submit button appears in Internet Explorer. **\n\
    \n**A custom Submit button is nothing more than a button image created in the\
    \ same **\n\n**way as any other navigational button. Here’s the HTML for the right-hand\
    \ button **\n\n**in Figure 8.19:**\n\n<a href=”#” onClick=”formName.submit();”>\n\
    \n \n\n<img src=”submitButton2.gif” height=”25” width=”105” /></a>\n\n**Substitute\
    \ whatever name you’ve chosen for the form for the name highlighted above.**\n\
    \n**FIGURE 8.19 **Submit Buttons\n\n**FIGURE 8.19 **Submit Buttons\n\n**YOU DON'T\
    \ HAVE **\n\n**TO JUST SUBMIT**\n\nOf course, you can \n\nchoose to show a more\
    \ \n\nfriendly or specific term \n\non a Submit button. Ex-\n\namples include\
    \ “Check \n\nOut,” “Purchase,” \n\n“Register,” “Log In,” \n\n“Search,” and “Go.”\n\
    \n**YOU DON'T HAVE **\n\n**TO JUST SUBMIT**\n\nOf course, you can \n\nchoose to\
    \ show a more \n\nfriendly or specific term \n\non a Submit button. Ex-\n\namples\
    \ include “Check \n\nOut,” “Purchase,” \n\n“Register,” “Log In,” \n\n“Search,”\
    \ and “Go.”"
  merge: -1
