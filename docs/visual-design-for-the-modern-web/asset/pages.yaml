  md: 'Just how involved, expensive, and time-consuming does usability testing have
    to be? Until just recently, many experts believe that bigger testing was better
    testing. They thought needed to be bloated scenarios hundreds of testers, expensive
    usability labs with video taping of all tests, and convoluted and extensive reports
    complete with statistical analysis. The result of such an overtesting mentality
    was rarely done at all. Today, the belief is that more informal, less involved
    testing (termed "discount testing") can produce huge benefits—certainly more than
    grandiose testing scenarios that aren''t done at all. Major usability issues tend
    to become quickly obvious even with informal testing.


    How do you do discount testing? Choose three or four testers with different technical
    abilities for each round of testing. Avoid using team members as testers; only
    people who are "off the seat" and have not actually helped to create your site
    can be unbiased, laypersons'' opinions of what will and not work with your visitors.
    Feel free to enlist friends and family in the test, as long as you are sure they
    will give you that unbiased opinion. For instance, your mother''s "Yes, dear this
    is just a wonderful site. If am sooooo proud of you! would be a wonderful stroke,
    but it''s of little practical value as a critique. What you really need is honesty.
    Only frank critics can improve the site (as well as protect your reputation as
    a professional web designer). And what should be your reaction to a brutally review?
    A sincere, heartfelt "Thank you for identifying these flaws, so now we fix them!


    When you are testing, you are actually looking at two keys: do the testers get
    it," and can they accomplish the necessary tasks? The first refers to whether
    or not you understand the purpose of the site, how it''s organized, and the navigation
    works. For this question, it''s best to ask the users to think aloud, and then
    turn them loose, observe what patterns, and listen very carefully to what they
    say. A few well-considered questions can always spur more-depth evaluation as
    well. Did areas of the site irritate or baffle them? Why? And what would they
    change? Draw the testers'' first impression on a page? Second? Probe for specifics
    in all of these areas.


    To evaluate the two key issues—whether or not the testers can accomplish tasks—you
    might want to use tasks of their own choosing as assign specific tasks that you
    feel correct to future visitors. Again, what confused them or lost them?


    On the other hand, were there areas of the site that engaged them, or amused them,
    or intrigued them? Why? What would they suggest would allow you to propagate those
    positive aspects to other areas of the site?


    Although you definitely need to take notes and perhaps recall each test session,
    a 30-page report detailing the results is overkill and very much a waste of your


    # HEAR FOR YOURSELF


    What if management insists that certain elements of the site be done in a certain
    way, despite being those elements usability standards? Simple—invite the management
    to sit in on the testing. Let them hear for themselves the complaints and responses
    of their potential customers.'
