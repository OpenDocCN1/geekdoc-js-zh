  md: '# Disabling the Current Link


    As we''ve already discussed, we should disable the current link but keep it in
    the menu structure. To disable the link, simply remove the <a> tag. Also style
    it with some visual affordance that makes it clear that the text is no longer
    clickable. To do this, surround the text with a <span> tag (see sidebar for a
    review of <div> and <span> tags) to associate the text with a CSS class. For instance,
    the HTML might look like this:


    ```

    <span class="disabledLink">Contact Us</span>

    ```


    The CSS styling to "gray out" and remove the underline from all such disabled
    links might look like:


    ```

    .disabledLink {color:#999999; text-decoration:none};

    ```


    +   HTML REVIEW: <div> AND <span>


    | <div><span><span> tags are wrappers that prevent treating areas of content as
    a for styling reasons. For example, Paragraphs 1 and 2 in the following examples
    are red. Paragraph 3 reverts to the default text. |

    | <div style="color:#ff0000">

    |<p>Paragraph 1</p>

    |<p>Paragraph 2</p>

    |</div>

    |<p>Paragraph 3</p> |


    <div> tags are considered to block tags; that is, they force a link break when
    the <div> tag is encountered. <div> tags can wrap other block tags, such as the
    <p> tags in the example above.


    <span> tags are used for in-line content; that is, when a link break isn''t desired.
    For example:


    <p>Here''s <span style="color:#ff0000">red </span>word.</p>


    Unfortunately, there are some circumstances in which you can''t easily disable
    the current link. If you are using templates or server-side includes (a copy boilerplate
    HTML into a page) to copy identical navigational HTML into every page, there is
    no easy way to disable the current link automatically. Fortunately, there is a
    CSS "hack" that can disguise a hot (i.e., clickable) current link by removing
    link affordances, as explained in the sidebar.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# MAKING A HOT LINK APPEAR TO BE DISABLED


    When navigation is automatically copied into a page (using templates or server-side
    includes), it''s not practical to disable the current link. Instead, we disguise
    disguise the current link to make it look disabled so that visitors are unlikely
    to click on it.


    To accomplish this, first define a standard CSS file for the default characteristics
    of all links, just as you would normally. Next, uniquely identify each menu item
    in the boilerplate menu (that is, copied-in menu) using the id attribute, as shown
    in the sample menu:


    ```

    <-- navigation copied into each page -->

    <a href="homepage.html" id="HomeLink"></a><br/>

    <a href="products.html" id="productsLink">Products</a><br/>

    <a href="services.html" id="servicesLink">Services</a><br/>

    <a href="contact.html" id="contactLink">Contact Us</a><br/>

    ```


    Now use the idator to override the standard link styling for the current link
    on each page. In the <head> of every page, create a global style that references
    the id for the link that is the current page. For example, on the “Products” page,
    include the following:


    ```

    <style type="text/css">

    #productsLink {color:#666666; text-decoration:none};

    </style>

    ```


    On the “Services” page, include this:


    ```

    <style type="text/css">

    #servicesLink {color:#666666; text-decoration:none};

    </style>

    ```


    The specifically targeted style in the <head> grays out the color and removes
    the underline, so that the link appears to be disabled. Although the link is,
    unfortunately, clickable, visitors are unlikely to actually click it.


    # Enhancing Text Links


    Text links have been accused of being boring, even with styling and rollover effects.
    We can jazz up text links easily using bulleted lists with custom bullet images,
    roll-over bullets, background button images, or CSS borders that mimic buttons.'
