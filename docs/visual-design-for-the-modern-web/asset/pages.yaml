    \n**CHAPTER SEVEN**\n\nTypography\n\nDANIEL WILL-HARRIS, “CHOOSING & USING TYPE,”\
    \ \n\nWWW.WILL-HARRIS.COM/USE-TYPE.HTM:\n\n*“Type attracts attention, sets the\
    \ style and tone of a docu-*\n\n*ment, colors how readers interpret the words,\
    \ and defines the *\n\n*feeling of the page—usually without the reader recognizing\
    \ a *\n\n*particular typeface.” *\n\nPeruse a book, newspaper, or web site, and\
    \ chances are \n\nthe only time you notice the type is if it’s annoying in \n\n\
    some way— too small, too blurry, or too embellished to \n\nbe legible. A choice\
    \ of appropriate typography is usu-\n\nally transparent; that is, the reader doesn’t\
    \ even notice \n\nit. Thus, the primary function of type is to be utilitarian.\
    \ \n\nWords must be set in a legible typeface, an appropriate \n\nsize, and an\
    \ appropriate color for the background upon \n\nwhich the words rest."
