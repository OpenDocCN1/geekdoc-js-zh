    Included in the internal hyperlink category are action/command links, which initiate
    or complete some sort of action. Common action links include Submit, Reset, Back,
    Print, Go, and Search. Such actions are often indicated by some type of a graphic
    button, even when the rest of the navigation system uses navigational text.


    An internal anchor is a "domestic" link that jumps to a location depth within
    a page. If that location is within the current page, the page repositions to location
    but does not reload. If the location is within a different page, the new document
    loads, positioned so that the indicated location is at the top of the browser
    window. We see this on FAQ pages, for instance.


    # HTML REVIEW: INTERNAL ANCHORS


    There are two pieces to an internal anchor: the clickable link that points to
    the desired location, and the "bookmark" anchor, placed at the desired location.


    Here''s an internal anchor pointing to a bookmark within the current document:


    ```

    <a href="#destination">

    More information...

    </a>

    ```


    And here''s an internal anchor pointing to a bookmark within a new document:


    ```

    <a href="path/mypage.html#destination">

    More information...

    </a>

    ```


    This is the destination location "bookmark":


    ```

    <a name="destination" id="destination"></a>

    ```'
