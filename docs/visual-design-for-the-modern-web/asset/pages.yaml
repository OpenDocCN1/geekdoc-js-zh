  md: '+   Many visitors rarely size their browser windows up enough to fill the entire
    screen. Instead, they often have multiple programs and partially visible all at
    once.


    +   Laptop computers, not to mention web-enabled cell phones and PDAs, often support
    lower resolution than equivalent desktop computers.


    +   Liquid crystal displays (LCDs), like those on laptops and flat-panel computer
    displays, support only a single resolution. That is, if the visitor changes the
    resolution to something other than the default, the display quality can degrade
    dramatically.


    Various web sites provide statistics on the popularity of the possible resolutions,
    with some stats for many a few. But these stats are gathered from web sites that
    may have completely different user demographics than the demographics of your
    site. For instance, stats from a site like Webmonkey, which caters to web developers
    (who usually work on souped-up computer systems), have little relevance for a
    site designed for teachers at elementary schools (who have notoriously prehistoric
    systems). Again, you must identify your audience and try to ascertain the type
    of computer systems they are most likely to have before you make resolution-dependent
    decisions.


    # Horizontal Page Size


    We have seen that display size and size of elements on the page vary, depending
    upon the visitor''s site. Nonetheless, we must still decide on a standard size
    for the pages in our site. Keep in mind that if a page is too wide to fit on the
    visitor''s display, the browser automatically provides a horizontal scroll bar
    so that visitors can access the hidden areas. Visitors generally dislike scroll
    bars; no one wants to scroll repeatedly from the end of one line on the right
    side to the beginning of the line on the left side.


    As a result, we need to choose our page size so that our visitors do not need
    horizontal scroll bars. An 800-pixel-wide display is the safest for most public-access
    sites. In fact, that the resolution chosen for 50% of the twelve representative
    sites shown in TABLE 4.2.


    # WINDOW DIMENSIONS FOR VARIOUS SYSTEMS


    See http://hotwired.lycos.com/webmonkey/templates/print_template.html?meta=/webmonkey/99/41/index3a.html
    for the definitive listing of how many pixels are available for the various browsers
    and versions. 744 pixels is the safest recommendation, although 750 pixels works
    just fine for the vast majority of systems.'
