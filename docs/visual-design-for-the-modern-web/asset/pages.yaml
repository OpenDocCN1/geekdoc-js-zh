  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**334**\n\n■ Stand out on the page, with\
    \ the ﬁ elds or items in error highlighted somehow. \n\nTypical methods of highlighting\
    \ include color-coding, colored asterisks, bold-\n\nface, or an error icon, like\
    \ the exclamation point on a yellow triangle used by \n\nmany Windows applications.\
    \ **FIGURE 8.27** shows a form with an error indicated \n\nby a red asterisk.\
    \ \n\n![](img/ee113e5612d290709e494a0dae247fc5_342_0.png)\n\nIf, after submission\
    \ to the server, the server-side application discovers that the data \n\nis somehow\
    \ in error, there are two ways to address the situation:\n\n■ Present the entire\
    \ form to the visitor again, retaining and redisplaying the valid \n\nﬁ elds while\
    \ highlighting the invalid ﬁ elds. The visitor re-enters just the invalid \n\n\
    data and resubmits the form. \n\n■ Present a new, abbreviated form to the visitor,\
    \ containing only those ﬁ elds that \n\nwere in error. Such an abbreviated form\
    \ is particularly helpful to visitors when \n\nthe original form was long or complicated.\
    \ Thus, the visitor deals with only a \n\nﬁ eld or two, instead of the entire\
    \ form. \n\nWhichever method you choose, the important thing is to not require\
    \ visitors to re-\n\nenter every ﬁ eld on the form just because a single ﬁ eld\
    \ is in error. Unless they are \n\nhighly motivated (“Free car if you ﬁ ll out\
    \ this form!”), most visitors would refuse, \n\nparticularly on longer forms.\n\
    \nAvoid displaying the error message on a different page from the ﬁ eld that needs\
    \ to \n\nbe corrected, forcing the visitor to go back and forth between the error\
    \ page and \n\nthe input page as he or she sorts out what’s actually wrong. The\
    \ error message and \n\nthe ﬁ eld requiring correction should be on the same page.\
    \ \n\nRegardless of the type of problem a visitor encounters on a site, the surprising\
    \ news \n\nis that *successful resolution of a problem builds customer loyalty\
    \ faster than delivering *\n\n*a product that performs ﬂ awlessly*. Seems hard\
    \ to believe, but a cheerful and grace-\n\nful problem resolution strategy can\
    \ build loyalty to an organization faster than no \n\nproblems at all. Let’s say\
    \ there’s a problem with your car after the warranty expires. \n\n**FIGURE 8.27\
    \ **Highlighting \n\nError Messages and Fields\n\n**FIGURE 8.27 **Highlighting\
    \ \n\nError Messages and Fields\n\n**PROBLEM **\n\n**RESOLUTION**\n\nFor more\
    \ on how \n\nsuccessful problem \n\nresolution solidifies \n\ncustomer relation-\n\
    \nships, see “Make No \n\nMistake?” by Michael \n\nSchrage, in *Fortune* \n\n\
    magazine, December \n\n24, 2001. \n\n**PROBLEM **\n\n**RESOLUTION**\n\nFor more\
    \ on how \n\nsuccessful problem \n\nresolution solidifies \n\ncustomer relation-\n\
    \nships, see “Make No \n\nMistake?” by Michael \n\nSchrage, in *Fortune* \n\n\
    magazine, December \n\n24, 2001."
