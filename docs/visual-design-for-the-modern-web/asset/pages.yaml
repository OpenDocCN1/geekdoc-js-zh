  md: '# VISUAL DESIGN FOR THE MODERN WEB


    Accordingly, we will examine the first technical issues, and then the aesthetic
    issues of designing an effective, visually consistent, and well-organized web
    page. When controversy exists on a recommendation, we examine how our twelve popular
    web sites are handling the issue as of this writing.


    # TWELVE POPULAR WEB SITES


    See Chapter 1 for more information about the twelve popular web sites.


    # Technical Considerations


    To address the technical issues, you must first determine everything about your
    prospective visitors'' systems, as discussed in Chapter 2:


    +   - How speedy are your visitor''s computers and internet connections, and how
    fast is your server?

    - What display resolutions are they using?


    These factors are going to determine how large the site''s files can be as well
    as the display size and resolution we should use for our site.


    # File Size Concerns


    The larger the total size, the longer the page will wait to download and display.
    Keep in mind that total file size refers to all of the files that make up a web
    page, including HTML, external CSS, external JavaScript, images, sound, and video.
    Of these, HTML, CSS, and JavaScript files are simple text, and therefore fairly
    compact. It''s usually the image, sound, and video files that are large enough
    to cause download load problems.


    Even the so-called experts disagree on exactly how large a total page size should
    be, from less than 20K per page to more than 100K (including all the graphics
    for public web sites). The 20K is virtually impossible to follow if you professional-quality
    graphics on the site. If you are targeting an audience with slow internet connections
    or limited patience, you might have to forgo the larger graphics and abide by
    that limit.


    On the other hand, if you can determine that the majority of your visitors are
    on high-speed broadband connections like DSL or a corporate intranet (internet
    technologies used on an internal network), then larger file sizes may be acceptable.
    You also have less to worry about if your audience is so fascinated by the site''s
    content that they are willing to wait an interminable time to download the page,
    and will be fans of a particular band, anxiously waiting to download the prerelease
    of a new tune.


    # CSS: CASCADING STYLES


    Note that for the sake of ease and clarity, the examples in this book use inline
    styles rather than the more preferred external files.'
