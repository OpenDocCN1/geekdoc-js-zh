  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**322**\n\n**A custom reset button is simply\
    \ a button image created in the same way as any **\n\n**other navigational button.\
    \ Here’s the HTML:**\n\n<a href=”#” onClick=”formName.reset();”>\n\n \n\n<img\
    \ src=”resetButton.gif” height=”25” width=”105” /></a>\n\n**Substitute whatever\
    \ name you’ve chosen for the form in place of the highlighted **\n\n**code above.**\n\
    \nMany usability experts argue that we should never, ever, use a Reset button;\
    \ it’s \n\nfar too easy for a visitor to hit it accidentally, thereby clearing\
    \ several minutes of \n\ndata entry. And just how often does a visitor deliberately\
    \ want to clear an entire \n\nform, anyway? Rarely, it would seem. Most of the\
    \ time, the visitor wants to retype \n\na ﬁ eld or two but almost never needs\
    \ to retype an entire form. Besides, hitting the \n\nbrowser’s “refresh” button\
    \ would serve the same function as a Reset button.\n\nIf you do feel the need\
    \ to include a Reset button, use it with caution, and at least be \n\nsure to\
    \ use JavaScript to capture the reset event in order to ask, “Are you sure…?”,\
    \ thus \n\ndouble-checking the visitor’s intention before he or she does something\
    \ irreversible. \n\nSubmit and Reset Button Hints\n\nSubmit and Reset buttons\
    \ should be easy to see, and should be close to their related \n\nform controls.\
    \ In any circumstance where the user has to choose between two or \n\nmore action\
    \ buttons, like Submit and Reset, be sure to position the safer or more \n\npositive\
    \ action on the left, and the riskier or more negative action on the right. Also\
    \ \n\nmake sure default focus lands on the safer of the two actions, in case the\
    \ visitor hits \n\nEnter without paying attention to the offered choices. \n\n\
    Any time there could be irreversible consequences for a visitor’s action (so-called\
    \ \n\n“ejector seat functions”), be sure to conﬁ rm that the action is what was\
    \ actually \n\nintended. For example, never delete an account, submit an order,\
    \ or change critical \n\ndata in the database without ﬁ rst asking, “Are you sure\
    \ you want to \\_\\_\\_\\_\\_\\_” (ﬁ ll in \n\nthe blank, of course, with a description\
    \ of the critical action). \n\nAfter a form has been submitted to the server,\
    \ visitors are reassured if the server \n\nsends back a response page that redisplays\
    \ the entered information. That way, \n\nthey can double-check that the information\
    \ they intended to provide was not only \n\nentered properly but also received\
    \ correctly by the web site."
