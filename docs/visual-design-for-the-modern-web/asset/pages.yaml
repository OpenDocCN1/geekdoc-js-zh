  md: '# RGB COLOR CODES: UPPERCASE OR LOWERCASE?


    RGB codes, like HTML itself, will work just fine when written either in uppercase
    or lowercase. Throughout other chapters, they are shown in lowercase, to match
    the lowercase requirements of the newer XHTML standards. In this chapter, however,
    we''ll show them in uppercase because uppercase is easier to read both in the
    text and on the figures.


    ![](img/ee113e5612d290709e494a0dae247fc5_195_0.png)


    FIGURE 5.12 Sample RGB Colors


    # HTML REVIEW: RGB COLOR CODES


    Some of you may be familiar with the decimal color codes used in image-editing
    software for the print industry, which normally uses the code "255, 255, 255"
    to represent the maximum values of red, green, and blue, respectively. The equivalent
    HTML color code would be "#FFFFFF The numbers are now represented in hexadecimal
    (see upcoming sidebar for more about hexadecimal numbers). The hexadecimal code
    consists of the pound sign (\#) followed by six hexadecimal digits. The first
    pair of hex digits specifies the amount of red in the color, the second pair specifies
    green, and the third pair specifies blue (that is, "#rrggbb") is the maximum value
    for a given color in HTML, just as 255 is the maximum value for a color using
    the print codes.


    A 6-digit hexadecimal code can store 16.8 million (2^24) different color codes,
    which in turn supports 16.8 million unique colors, true color in geek-speak. Older
    computer systems may not be powerful enough to display true color.


    Color codes can be used in HTML and CSS for most visible elements. For example:


    ```

    <body style="color:#ff0000;"> . . </body>

    <td style="background-color:#001234;"> . . </td>

    ```'
