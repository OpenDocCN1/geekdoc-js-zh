  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   - Bookmarking "pages" within a Flash site bookmarks sorting out the entry,
    not the lower-level areas, as visitors intend.


    Although it''s likely that Flash-based sites will become more popular in the future,
    it''s unlikely that Flash will replace HTML entirely. Instead, it''s a question
    of using the right technology for the right purpose. For instance, an "experience"
    site such as a movie or fan site would be a fine candidate for a Flash-based layout.


    This book will not delve into Flash technology any further, because that would
    be beyond the scope of this book.


    # Aesthetic Issues


    The "information overload" of a disorganized, chaotic, overfilled page repels
    visitors so quickly and thoroughly that they may well shut down; they decide it
    is not worth bearing the mental gymnastics of sorting out the jumble. As Steve
    Krug of Don Me Make Me think says so succinctly, "If something requires an investment
    of time—or what it looks like—it is less likely to be used."


    In contrast, well-organized pages with adequate empty space give visitors impression
    of simplicity, even if the page is chock-full of stuff. The point is that the
    way you choose to structure your pages has a strong bearing on your visitors''
    comfort level.


    # Filling the Display Window


    We already know that we design for the lowest (within reason) common denomination
    of screen resolution. But then what happens when a page is viewed on a display
    system that is either larger or smaller? There are two ways we can accommodate
    this situation, doubled solid layout and liquid layout.


    # Solid Layout


    With solid layout (sometimes referred to as ice layout), we design the page to
    fit the smallest window size we expect visitors to have, filling the background
    of larger windows with a color or image. FIGURE 4.7 shows an example of solid
    layout, centered on the page, as it looks in both a wide window and one that is
    too narrow to display the content without horizontal scrolling. The sidebar shows
    the HTML for this particular example. The properties that create the solid design
    are highlighted.'
