  md: "**CHAPTER EIGHT** Forms** 309**\n\nList Boxes\n\nWhen options are so numerous\
    \ that radio buttons or checkboxes would take up \n\ntoo much space on the screen,\
    \ we can instead implement a list box. List boxes \n\nare commonly used for choices\
    \ such as states, countries, or dates, as well as for \n\njump menus. **FIGURE\
    \ 8.6** shows a typical drop-down list box, first as it displays \n\nupon page\
    \ load, and then as it might display when the visitor has clicked on the \n\n\
    “down” arrow. \n\n![](img/ee113e5612d290709e494a0dae247fc5_317_0.png)![](img/ee113e5612d290709e494a0dae247fc5_317_1.png)\n\
    \n**Before Clicking “Down” Arrow**\n\n**After Clicking “Down” Arrow**\n\n HTML\
    \ FOR A LIST BOX\n\n**Here is the HTML for the list box in Figure 8.6.**\n\n<select\
    \ name=”hobbies” size=”1”>\n\n \n\n<option value=”antiques”>Select one...</option>\
    \ \n\n \n\n<option value=”antiques”>Antiques</option>\n\n \n\n...\n\n</select>\n\
    \n</form>\n\nYes, list boxes do indeed irritate many users. Most of us would prefer\
    \ entering a \n\ntwo-character state abbreviation in a text box rather than scrolling\
    \ through a long \n\nlist of states (especially if we live in Wyoming). Nevertheless,\
    \ a list box absolutely \n\nguarantees that any submitted input is a valid choice.\
    \ That alone makes list boxes \n\nworth their annoyance factor. \n\nThink carefully\
    \ about the order of the list items. Presenting the items in alphabeti-\n\ncal\
    \ or numerical order is the most obvious solution. However, in situations in which\
    \ \n\nsome elements on the list are chosen much more often than others, it can\
    \ make \n\nsense to move those choices to the top of the list, and perhaps even\
    \ specify the \n\nmost common one as the selected default. For instance, a company\
    \ based in the \n\n**JUMP MENUS**\n\nSee Chapter 3 for an \n\nexplanation of jump\
    \ \n\nmenus. \n\n**JUMP MENUS**\n\nSee Chapter 3 for an \n\nexplanation of jump\
    \ \n\nmenus. \n\n**FIGURE 8.6 **Drop-down \n\nList Box\n\n**FIGURE 8.6 **Drop-down\
    \ \n\nList Box"
