    In the Layers panel, any layer closer to the top of the list is displayed in the\
    \ work-\n\nspace on top of any layers below it on the list. Thus, the “Contact\
    \ Us” layer must be \n\nat the top of the list. \n\nExporting Images\n\nWe have\
    \ already discussed some of the general principles of exporting original \n\n\
    images to web-friendly formats like GIF, JPG, or PNG. Now we need to look a bit\
    \ \n\nmore closely at what is actually involved in exporting a ﬁ le. \n\nExporting\
    \ an image to a bitmapped format like GIF, JPG, or web-friendly PNG is \n\ncalled\
    \ *ﬂ attening* the ﬁ le, because the original layer-based objects no longer exist\
    \ in \n\nthe exported version. All that remains is a bitmapped, two-dimensional\
    \ grid of inde-\n\npendent pixels. The fact that the objects in the ﬂ attened\
    \ image can no longer be \n\nresized or re-colored or manipulated independently\
    \ is a good argument for always \n\npreserving a copy of the image in the original\
    \ layered format so that we can, if need \n\nbe, modify it later. \n\nWhen exporting\
    \ an image, we ﬁ rst turn on the elements we want visible in the \n\nimage and\
    \ turn off the ones we don’t, by clicking on the “eye” icons next to the \n\n\
    layers (refer back to Figure 6.17). We specify the overall ﬁ le characteristics\
    \ (ﬁ le \n\nformat, number of colors, compression rate, dithering options, interlacing,\
    \ etc.) \n\nin the Optimize panel, as shown earlier in Figures 6.10 (JPG format)\
    \ and 6.16 (GIF \n\nformat). Finally, we either choose “Export” or “Save As” (depending\
    \ upon the image \n\neditor) from the File menu.\n\nMatching Colors across Software\
    \ Packages\n\nAs already mentioned, colors chosen in different software packages\
    \ do not nec-\n\nessarily look the same on a web page, even if they use the same\
    \ color code. For \n\ninstance, #FF0000 saved as a background in an image ﬁ le\
    \ may not necessarily \n\nmatch a web page background speciﬁ ed as #FF0000. And\
