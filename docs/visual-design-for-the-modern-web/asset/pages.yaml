- img_proc: true
  md: 'avoid the halo effect, we use the matte (background) color setting in the Optimize
    panel (again, see Figure 6.4) to tell the software that any image element adjacent
    to a transparent area should be anti-aliased to a specific color.


    # FIGURE 6.5 Anti-aliasing to an Improper Color


    ![](img/ee113e5612d290709e494a0dae247fc5_240_0.png)


    In the case of a patterned background as in Figure 6.3, our choices are not so
    straightforward, since the background consists of two or more colors. We have
    three matte options:


    +   - Use the most prevalent color in the pattern for the matte.


    +   - Choose an intermediate value between all of the colors of the pattern. The
    matte color for Figure 6.3 was an intermediate gray.


    +   - Turn off anti-aliasing entirely.


    When in doubt, try all three options before deciding which is the least intrusive.
    Index transparency, the transparency setting chosen in Figure 6.4, is fully supported
    by virtually all browsers but offers only two transparency options: fully transparent
    and fully opaque. On the other hand, channel transparency supports multiple levels
    of transparency; for instance, some elements in an image could be at 50% level
    of transparency, while other elements might be at a 25% level. An image employing
    alpha channel transparency doesn''t require anti-aliasing to a specific matte
    color; the image can be floated over any color background without worry about
    an unwanted color halo. Unfortunately, as of this writing, most web browsers don''t
    completely support alpha transparency, so it''s best to avoid.


    # Interlacing


    Normally, an image appears in the browser as a line-by-line download. That is,
    a few lines of the image appear on the screen, and then there may be a pause before
    a few more appear. The process continues, top to bottom, until the entire image
    is displayed. FIGURE 6.6A shows one intermediate step in the download process
    for a typical line-by-line image download.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'Interlacing refers to an alternate way to load an image. Visitors first see
    a complete but low-resolution, very pixelated version of the image that is incrementally
    replaced by higher-resolution versions until the final version appears. FIGURE
    6.6 shows a partial download for the same image as Figure 6.A, but now interlacing
    is in effect, and visitors see a low-quality but recognizable image faster than
    with a typical line-by-line image download.


    # FIGURE 6.6 Interlacing


    ![](img/ee113e5612d290709e494a0dae247fc5_241_0.png)


    Although interlacing may actually decrease the download time bit, visitors perceive
    it as being shorter. Obviously, interlacing is more important for large graphics
    than for smaller ones. There seems to be no consensus either way as to whether
    or not interlacing should be employed, but in fact, few sites today seem to use
    it. Interlacing is specified on the Optimize panel, as previously shown in Figure
    6.4.


    # Graphics File Compression


    Web-friendly file formats can compress images into smaller file sizes. Some compression
    techniques retain every single bit of image data, without degradation, no matter
    how many times the image is saved. Other graphics formats are said to be lossless,
    which means the compression algorithm discards some data each every time the image
    is saved, as a tradeoff for better compression.


    The easiest way to avoid such negative effects might be to avoid lossy formats,
    the web doesn''t currently allow that option (as we''ll discuss). For now, realize
    that the first defense is to avoid saving over (that is, overwriting) the original
    image. Always preserve a pristine, original copy, saving all modified versions
    under new names. In that way, multiple saves don''t compound the negative effects
    of a lossy format.'
  merge: -1
