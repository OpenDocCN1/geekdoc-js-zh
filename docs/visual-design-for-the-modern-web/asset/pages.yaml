  md: '# Limit the number of elements on the page.


    Eliminate text and graphics that don''t really contribute to the site''s purpose.
    Most of the time you shouldn''t try to cram too much information on a page. There
    are exceptions to this rule. For instance, portals like Yahoo! or MSN, by their
    very nature, need to provide a lot of information on the home page. Still, both
    Yahoo and MSN are well-organized to reduce visual chaos, so the visitor feels
    comfortable and able to cope with the myriad choices.


    # Repeat elements.


    Within a given page, repeat elements: shape, size, proportion, color, or layout.
    Such repetition adds to the serenity of a web page in the way that repeating the
    same size and shape of windows adds serenity to a building.


    For the site as a whole, repetition of color schemes, layouts, logos, navigation
    schemes, and graphic styles from page promotes visual continuity (also called
    consistency), creating a feeling of order, organization, and rhythm. For instance,
    continuity is in evidence when you repeat curvilinear, organic shapes, or only
    sharp-edged, nervous graphics, for the entire site. In Layout Index, Jim Krause
    calls such repetition visual echoes.


    # Repeat a standard page layout throughout the site.


    To facilitate continuity, create a general-purpose blank page template that proscribes
    repeating items (logo, navigation, and content areas) and use the template as
    the underneath for most pages on the site. Visitors can then create a mental picture
    of the page layout, never having to search for the main navigation, or logos,
    or titles. In this case, repetition isn''t boring; it''s consistent, which is
    indeed comforting and efficient, and grounds the viewer.


    Still, not every page must be absolutely identical. There might be a different
    decorative graphic on each page, or a different background color keyed to the
    subject matter of that page. Often the layout of the home page breaks away from
    the layout of lower-level content pages. And at times, a lower-level content page
    needs to use a different layout because its content is radically different. Let''s
    say the majority of a site uses a two-column layout, with a menu bar down the
    left and content area in the right column. A single page on the site might require
    the entire width of the window for a large data graph, in which case you might
    justify moving the links to a horizontal bar across the top of the screen. Even
    so, those links should be so similar to the links on the other pages that they
    are instantly recognizable as navigation.


    In short, vary the consistent structure of the pages only when you have good reason
    to do so. In pages that break from the norm, though, you must be even careful
    that all of the other page elements are consistent.'
