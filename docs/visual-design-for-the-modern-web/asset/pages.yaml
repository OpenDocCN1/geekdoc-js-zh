  md: '# Sequential Menus


    Sometimes pages are meant to be read sequentially, such as for a long article
    that spans multiple discrete pages. In such cases, sequential menus are often
    placed at the bottom of a page, as in **FIGURE 3.23:


    **FIGURE 3.23** Sequential Menus


    | Page 1 | 2 | 3 | 4 | 5 | 6 | Z | 8 | 9-16 |

    | <<< Previous Page | Next Page >>> |


    Here, the visitor can click on any page other than the disabled current link,
    shown here as Page 2. When there are too many pages to access directly from a
    single menu, a link like the "9-16" shown at the end of the top line can furnish
    the visitor to the next group of pages. It also shows how many pages remain, so
    that they can decide whether or not keep going. "Previous Page" and "Next Page"
    allow visitors to navigate all of the pages in order.


    # Drill-down Menu Pages


    Drill-down pages (also called click-through pages) contain mainly menus, with
    very little or no content. Portal sites like Yahoo or MSN are good examples of
    drill-down pages. It is perfectly acceptable for a portal page to be only a drill-down
    page; that, after all, is its purpose. But we usually try to avoid unnecessary
    drill-down pages within content sites because they force visitors to download
    still more pages without reaching any real content. It''s better to consolidate
    a couple of pages, so that each page has some useful content as well as navigation.


    For instance, it''s conceivable that Amazon''s home page could contain nothing
    but links to its many categories (books, music, movies, and so on) and a search
    box, that would be a deplorable lack of marketing imagination. Such a home page
    would hardly lure visitors into buying something more than what they came looking
    for. As matter of fact, Amazon''s home page (**FIGURE 3.24**) displays suggestions
    personalized to the visitor, in addition to providing the main menus and a prominent
    search feature. A visitor doesn''t feel quite so when there is at least some content
    of value on what would otherwise be just a click-through page.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# CHAPTER THREE Navigation 111


    ![](img/ee113e5612d290709e494a0dae247fc5_119_0.png)


    > FIGURE 3.24 Portal Page with Content (Amazon.com, or its affiliates. All Rights
    Reserved).


    Avoiding-driven pages benefit us and our visitors, as it decreases page loads,
    thereby decreasing the load on our servers. Nonetheless, sometimes there can be
    advantages to retaining drill-down pages:


    +   - A focused but tantalizing new visitors to look more closely at all of our
    offerings. Consider how grocery stores always put the dairy section at the far
    back of the store; every customer intending to buy a single gallon of milk must
    walk past a long aisle of tempting products. So, too, can a focused menu lists
    invite further exploration.


    +   - When a site pays advertising, each page load generates ad-impression revenue.
    Thus, clicks mean more revenue.


    # Frames


    Frames are highly controversial, to the point where many designers rant that they
    are inherently evil and refuse to use them. However, though we won''t go that
    far, it''s fair to say that frames should be avoided unless you have some over-whelming
    reason to use them.'
  merge: -1
