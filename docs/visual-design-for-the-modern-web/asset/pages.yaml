    ![](img/ee113e5612d290709e494a0dae247fc5_208_0.png)


    A final way to mix a tint is to layer a semi-transparent white shape over the
    original base color. To do this with the color cyan:


    +   1. Create a shape filled with cyan.


    +   2. Overlay the original shape with a color that has a white fill and an intermediate
    transparency value, such as 50%. Tweak the transparency percentage of the overlay
    until you get the exact color you need. (A transparency example isn''t illustrated
    because transparency is impossible to portray in print.)


    # Mixing Shades


    To generate shades of a color by altering the hex code mathematically, progressively
    reduce the hex pair(s) for the base hue until the color approaches black, as shown
    in FIGURE 5.25. Here, the cyan pairs were first reduced to CCCC, 9999, and so
    forth, with black as the ultimate result.


    FIGURE 5.25 Mixing Shades Mathematically


    ![](img/ee113e5612d290709e494a0dae247fc5_208_1.png)'
