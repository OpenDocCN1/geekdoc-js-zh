  md: 'Let''s say we are an organization selling electronics: computers, stereos,
    and appliances. It''s not sufficient to say, "Our audience consists of people
    who want to buy computers, stereos, and appliances." We need to be more specific.


    What are the demographics of the target audience, in terms of income, age, education,
    status, and health conditions? What problems do they have? What appeals to them?
    What do they need? Unless you have a very clear definition of the audience, you
    cannot design a site to appeal to that audience.


    Here are the characteristics to define the process of nailing down your target
    audience:


    +   **Physical demographics**—Gender, age range, health status. Females and males
    tend to prefer a different look for a web site. If you need to satisfy both, you
    will need to create a design that appeals to both. Age and health status implications
    for vision impairment and mobility. Additionally, older folks might well be computer-literate
    because they did not grow up with computers as younger generations.


    +   **Cultural demographics**—Economic status, employment, education level, social
    group, nationality, language, values. Economic status and employment might dictate
    whether a visitor accesses the web from a high-end home computer, an intranet
    at the office, or a low-end computer at the public library. Education level, social
    group, nationality, and language dictate the level of writing you can use. Values
    can dictate everything from the language that won''t offend the audience to the
    products that are appropriate to sell on the site.


    +   **Computer experience**—Knowledge of technology, usage patterns, favorite
    sites, web surfing and frequency. Computer experience is an important factor in
    determining the characteristics of such elements as navigation and search methods.


    +   **Findability**—Will your visitors find your site from a search engine, a
    banner ad, a link on another site, promoted materials, or from a friend''s referral?


    +   **Computer equipment profile**—Operating system, system speed and power, connection
    speed. You will be making design decisions based upon this knowledge. For instance,
    bandwidth (speed of the connection) is less of a concern if most of your visitors
    are on high-end systems within a corporate intranet, but a major concern if some
    of your visitors are on low-speed, dial-up lines.


    +   **Frequency of visits**—Repeatedly or infrequently? Inrequent visitors in
    particular sites need are exceedingly easy to use, because they will have to re-learn
    how to use the site each time they visit.'
