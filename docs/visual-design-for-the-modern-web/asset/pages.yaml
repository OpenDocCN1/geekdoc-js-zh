  md: '# TABLE 5.1 THE TRADITIONAL COLOR WHEEL


    | Traditional Color Wheel | Color Names | Derivation |

    | --- | --- | --- |

    | Primary Colors | Yellow Blue Red | Not applicable |

    | Secondary Colors | Green Purple Orange | Mixing two adjacent primary colors
    |

    | Tertiary Colors | Yellow-green Cyan Blush-purple Reddish-purple Red-orange Yellow-orange
    | Mixing one primary color and adjacent secondary color |

    | Neutrals | Black White Gray Blackish-brown | Not applicable Not applicable Mixing
    white with black or mixing two complementary colors (colors opposite one another
    on the color wheel) Mixing three evenly-spaced colors around the color wheel


    # Color Attributes


    Color has four specific attributes: hue, saturation, value, and temperature.


    # Hue


    Hue (or chroma) is the technical term for a specific color, like blue, green,
    or blue-green. Each of the separate wedges in the color wheel is a distinct hue.
    Hues can be mixed together to obtain hues, just as red and yellow can be mixed
    to obtain orange.


    # Value


    Value refers to the lightness or darkness of a color. Mixing white with a hue
    produces a tint, mixing black with a hue produces a shade. FIGURE 5.5 shows mixing
    red with white to form a pink tint, and mixing red with black to form a burgundy
    shade. Keep in mind that a shade of relatively light hue, such as yellow, could
    well have a higher value than a tint of relatively dark color, such as purple.
    Tints like the pink in Figure 5.5 are said to be high-key, which is merely another
    way of saying they are high in value. Shades like the burgundy in the figure are
    low-key, or dark in value.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 182 VISUAL DESIGN FOR THE MODERN WEB


    FIGURE 5.5 Tints (left) and Shades (right)


    ![](img/ee113e5612d290709e494a0dae247fc5_190_0.png)


    # Saturation


    Saturation refers to the level of purity or intensity of a hue. A fully-saturated
    hue is one that has not been mixed with black, white, gray, or the hue''s complementary
    color, because any of those additions desaturates the color. Fire-engine red,
    Kelly green, and cobalt blue are fully-saturated hues, as shown in FIGURE 5.6.


    FIGURE 5.6 Highly-Saturated Hues (left) versus Desaturated Hues (right)


    ![](img/ee113e5612d290709e494a0dae247fc5_190_1.png)


    Another way to decrease a hue''s saturation is to mix it with gray or with a small
    amount of the hue''s complementary color. The result is called a tone, from which
    we get the term ''toned down.'' See FIGURE 5.7 for examples of similar tones of
    red created in two separate ways.


    FIGURE 5.7 Tones. Red Tone Created by Mixing with Gray (left). Red Tone Created
    by Mixing with Red''s Complementary Color, Green (right)


    ![](img/ee113e5612d290709e494a0dae247fc5_190_2.png)


    Less saturated colors, like tones and shades, are by definition less intense,
    which is beneficial when you are looking for sophisticated, earthy, or rich colors.
    On the other hand, they can also appear drab, dull, or grungy. That''s not to
    say grungy is a bad thing; it all depends on the mood you want to evoke.


    # Temperature


    Color temperature refers to whether the color ''feels'' warm or cool. Warm colors
    are based on yellow, orange, and red, while cool colors are based on purple, blue,
    and green. FIGURE 5.8 identifies warm and cool colors.'
