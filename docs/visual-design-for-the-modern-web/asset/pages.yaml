  md: "# Frames\n\nFrames are highly controversial, to the extent that many designers\
    \ view them as inherently evil and refuse to use them, ever. Although this book\
    \ will not go quite far, it is to say that frames should be avoided unless you\
    \ have some overwhelming reason to use them. We have already looked at frames\
    \ in the Navigation chapter, so we won't review them here. Nonetheless, since\
    \ the subject of this chapter is page layout, it is worth mentioning that it is\
    \ certainly not appropriate to use frames merely to section the page off into\
    \ a grid; that is better served with `<table>`s or `<div>`s.\n\n# Tables\n\nA\
    \ table is nothing more than a two-dimensional grid on which we can arrange elements.\
    \ For instance, we might put objects in an invisible table (borders turned off)\
    \ just so that the objects line up the way we want them. FIGURE 4.3 shows a simple\
    \ two-row by two-column HTML table, with the first line designated as a header\
    \ line. See the sidebar for a review of the relevant HTML.\n\n![](img/ee113e5612d290709e494a0dae247fc5_147_0.png)\n\
    \nFIGURE 4.3 A Simple Table\n\n+   HTML REVIEW: TABLES\n\nHere is the HTML that\
    \ makes up the table you see in Figure 4.3:\n\n```\n<table style=\"border:2px\
    \ dotted #000000;width:250px;\n  background-color:#ffffff;\n<head>\n  <tr>\n \
    \   <th style=\"background-color:#dde79\">top left</th>\n    <th style=\"background-color:#c2d7db\"\
    >top right</th>\n  </tr>\n</head>\n<tbody>\n  <tr>\n    <td style=\"background-color:#c2d7db\"\
    >bottom left</td>\n    <td style=\"background-color:#dde79\">bottom right</td>\n\
    \  </tr>\n</tbody>\n</table>\n```\n\n> NOTE\nThroughout the chapter, HTML and\
    \ CSS content irrelevant to the topic at hand has been omitted for the sake of\
    \ brevity."
