  md: 'Single spacing (or other close spacing) within groups or chunks, and double
    spacing (or looser spacing) between groups or chunks.


    Similarity of style—fonts, colors, graphic styles, and so on—to group elements
    together.


    Horizontal and vertical rules (using <hr>, graphics, one-sided borders, or back-grounds
    on skinny table columns) to separate and join.


    Table, cell, and <div> borders. Much of the time, table borders are invisible,
    particularly when a table or <div> is used only as a positioning aid. Still, borders
    have gotten more attractive, diverse, and versatile over the years. Graceful CSS
    borders can be specified specifically for each side of the element and can carry
    various colors, styles, and widths.


    Varied background colors or images on tables, cells, and <div>.


    Sidebars (such those used in this book) and links to pop-up windows. Both serve
    the same purpose as footnotes in a book; they pull peripheral information out
    of the main flow of a page. A definition for a term, for instance, might appear
    in a pop-up window if the user clicks on the term, conserving visual space in
    the main window at the same time allowing visitors who need the information easy
    access to it, and visitors who aren''t interested to ignore the link entirely.


    <fieldset> tag, shown in FIGURE 4.16, which has the advantage of being recognized
    by screen readers as a grouping tool. See the sidebar for the <fieldset> HTML.


    ![](img/ee113e5612d290709e494a0dae247fc5_165_0.png)


    THE <FIELDSET> TAG


    Figure 4.16 shows a chunk of related elements wrapped in a <fieldset> tag. An
    optional <legend> tag specifies the header for the chunk.


    Here is the HTML:


    ```

    <form>

    <fieldset>

    <legend>Hobbies</legend>

    ```'
