  md: '# VISUAL DESIGN FOR THE MODERN WEB


    Why are aesthetics so important? Well, we do judge a book by its cover (envision
    the cover of a romance novel versus a book of photography of Ireland), a restaurant
    by its exterior (think McDonalds versus Olive Garden), and, ultimately, a web
    site by its design. Visitors are looking for children''s toys, they are probably
    going to spend very little time on a site with a dull visual design, all in shades
    of grey.


    # Visual Design versus Usability


    There have been two starkly opposing viewpoints when it comes to the visual design
    of a site. Usability gurus like Jakob Nielsen (www.use.com) have traditionally
    expanded that web sites should be usable, not pretty. Almost anything done for
    visual effect, he believes, gets in the way of usability. Starkly functional minimalism
    is the goal; images, colored backgrounds, and fancy layouts should be avoided.
    Black text on a white background with few or no graphics would be the ideal web.
    To be fair, folks have softened their position in the last few years, but nonetheless,
    the stricter still favor "plain vanilla" web.


    The opposing viewpoint promotes the web as an "experience." Consequently, web
    sites should take advantage of the uniqueness of the medium...stretch the limits
    of the medium...challenge/engage/mystify/amuse/enthral the terrific visual design
    creates means, provides context, and evokes emotion. It can engage a visitor and
    reassure him about the professionalism and reliability of the site. It can also
    establish focus, create emphasis, establish relationships between site elements,
    and guide the user to accomplish his mission. All of this is important for the
    visitor''s experience as well as his understanding of the site. The flip side
    is that the "web as an experience" folks, left unchecked, might well deliver good
    web sites that are to navigating, difficult to decipher, and nightmares to download.


    Fortunately for all of us using the web, neither side of the argument is right,
    totally wrong. In fact, usability and aesthetics don''t have to be on the web
    any more than they are in architecture. After all, a talented architect can craft
    a building that is both eminently functional and beautiful to behold. In the architecture
    of a building, the visual design can indeed follow function (the building''s usability).


    Why can''t the same balance apply to the web? Why we can''t have beauty and functionality?
    After all, the web is, as we said right at the beginning of this book, first and
    foremost a communication medium, like print media. If we encountered a magazine
    with no pictures, in most cases we would dismiss it as an amateur production,
    cheaply so it is on the web. And over time, this idea of balance is starting to
    inch the mainstream. In fact, some usability gurus (notably Jared Spool, www.uie.com)
    have grasped the fact that web site form and function are not necessarily at each
    other.


    So let''s do our best to balance form and function. If usability factors make
    a site functional, visual design makes it memorable. We aim for both.


    > ENGAGING THE VISITOR


    If the presentation is not clear, your audience might not be able to make it to
    content. If the presentation is not engaging, your audience might not be motivated
    to try.\ From Site-Seeing: A Visual Approach to Web Usability, by Luke Wrobleski.'
