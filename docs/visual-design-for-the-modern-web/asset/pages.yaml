  md: '# Master Images


    It''s best to create and maintain your original master images in either a vector
    format or a high-resolution bitmap format, even if the images will eventually
    end up as low-resolution bitmaps on the web. Why Because:


    +   - If stored in vector format, images can be scaled, rotated, and manipulated
    endlessly without loss of quality.


    +   - If stored as a high-resolution bitmap, we have more pixels available when
    editing and manipulating the images. High-resolution bitmapped images always scale
    better than low-resolution images.


    +   - High-resolution bitmapped images can be used for print as well as for the
    web. The reverse is often unsuccessful.


    For the most part, we create, manipulate, and maintain our original images in
    a format like BMP, TIFF, PSD, or non-compressed PNG, and export (convert and save)
    of the originals to a web-friendly, bitmapped format before editing them in a
    web page. Notice that even graphics that are best as vector images must be exported
    to a bitmapped format (JPG, GIF, or compressed PNG) for display on the web, with
    Flash being the only exception. TABLE 6.1 recaps the basics of graphics formats.


    We will look at the three bitmapped web formats next. We will further discuss
    of the vector-based Flash format until a later section that contains examples
    animation.


    | TABLE 6.1 GRAPHICS FORMATS | |

    | Vector Graphics | Bitmap Graphics |

    | Storage method | Mathematical equations | 2-D pixel mapping |

    | Types of images | Best for geometric shape-based (rather than pixel-based) images.
    Examples: cartoons, diagrams, line drawings. | Best for pixel-based images. Examples:
    photographs, gradients, patterns. |

    | Resizing quality | Resizes without loss of quality | Degrades (best results
    with bilinear interpolation method) |

    | File size related to image size | File size is stable regardless of image size
    | File size can increase exponentially with image size |

    | Common non-web image formats | Native Fireworks PNG, Adobe Illustrator, Corel
    Draw | BMP, TIFF, Photoshop''s PSD, Corel Paint |

    | Web formats | Only Flash | JPG, GIF, compressed PNG (some features not supported)
    |'
