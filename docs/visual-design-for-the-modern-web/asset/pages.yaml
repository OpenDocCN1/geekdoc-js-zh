    #  Review of Web Technology


    Before we can delve into any artistic endeavor, whether it''s sculpting in clay,
    painting in watercolor, or bending red-hot iron into decorative curlicues, we
    must understand the medium. Web design is so closely linked to the technology
    that every artistic decision has technological consequences, and vice versa. As
    a result, we should start off by ensuring that we have a general understanding
    of the technology as well as its strengths and weaknesses. Additional technological
    concerns will be addressed throughout the book, as appropriate.


    # TWELVE MODEL SITES


    Throughout the book, when controversial issues arise, we will look at how twelve
    popular but randomly selected sites handled each issue as of June 2007. Those
    twelve sites are:


    +   - adobe.com

    - amazon.com

    - cnn.com

    - ebay.com

    - imdb.com

    - mapquest.com

    - microsoft.com

    - msn.com

    - msnb.com

    - randmcnally.com

    - ticketmaster.com

    - yahoo.com'
