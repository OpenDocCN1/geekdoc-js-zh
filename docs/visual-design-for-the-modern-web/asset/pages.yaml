    # Navigation Organization Tools


    Navigation tools at our disposal include menus, embedded links, frames, teasers,
    search, breadcrumbs, and sitemaps. We will look at each in turn.


    # Menus


    Menus are the "meat and potatoes" of navigation. They serve not only as navigation
    but also as illumination of the underlying architecture of the site; a clear menu
    structure helps visitors build a mental map of the site.


    > NAVIGATION AIDS

    IN DREAMWEAVER


    In Dreamweaver, choose Window > Snippets \nNavigation to build

    a variety of simple, single-level text menus quickly and easily.


    # Mutually Exclusive Menus


    Although we saw earlier that multiple means of navigation are helpful, the elements
    within a single menu should not be allowed to overlap. Instead, they should be
    mutually exclusive. The easiest way to understand this is to look at an example.
    Let''s say that computer retailer found it useful to offer navigation by both
    user type (corporations, small businesses, home users) and by product type (desktops,
    laptops, accessories). Consequently, a home user who wants to purchase a laptop
    could click either "home user" or "laptops." Under such circumstances, what would
    be wrong with the menu in FIGURE 3.15?


    | corporations |

    | desktops |

    | small businesses |

    | home users |

    | laptops |


    FIGURE 3.15 What''s Wrong with this Picture?'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# VISUAL DESIGN FOR THE MODERN WEB


    The problem is that the two different categorization schemas (“user type”) and
    (“product type”) are combined into a single menu. Visitors have a hard time making
    a mental model of the site when a single menu presents multiple ways of performing
    the same task.


    In a case such as this, the different categories should be presented in two discrete
    menus, so that each independent menu contains only items that are mutually exclusive.
    Take a look at the resulting menu structures in FIGURE 3.16:


    FIGURE 3.16 Mutually Exclusive Menus


    | corporations | desktops |

    |---|---|

    | small businesses | laptops |

    | home users | accessories |


    Notice, in this simple case at least, each menu is intuitively clear, even though
    the words “users” and “products” don’t appear as menu titles. For that, we can
    thank our innate human propensity for discerning hierarchies.


    # Menu Location


    Placement of menus should be consistent from page to page. FIGURE 3.17 shows several
    alternatives. Chapter 4 will discuss menu placement further, in the context of
    the layout for the entire page.


    Here’s a quick description of the basic types of menu placement we’ve seen:


    +   - **Inverted-L layout** with main navigation typically across the top of the
    “L.” Local navigation, which changes depending upon where the visitor is in the
    site, is then aligned down the left side, as in Figure 3.17A. (Alternatively,
    Figure 3.17B features prominent main links down the left side, with less-frequently-used
    links like “History” “About Us,” and “Employment” featured across the top.)


    +   - **Horizontal main menu** with a sub-menu for local navigation just below,
    in Figure 3.17C. The contents of the local navigation bar change depending upon
    which main line has focus.


    +   - **Drop-down menus** for local navigation, as in Figure 3.17D.


    In any case, there must be an obvious logic to the menu groupings, because links
    that are clustered are considered to be somehow related. The visitor should be
    to grasp the purpose/category grouping of each menu intuitively.'
