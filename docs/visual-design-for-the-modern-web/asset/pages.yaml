  md: '# DESIGN PATTERNS


    One way of analyzing any task is to see how it might fit into a design pattern,
    a common, recurring problem that can make use of a standard solution. This technique
    relies on the belief that almost anything that anyone might want to be done already.
    We can leverage the “been there, done that” designs of the folks that came before.
    For example, think of typical shopping-cart applications. Only rarely does a site
    do something radically different from recognition metaphor. When it happens, it''s
    usually an unpleasant surprise. The point is that we can re-use the patterns of
    the web pages we have been visiting ourselves—patterns that have already been
    proven to work. We need not reinvent the wheel with every site. In fact, it''s
    not just a waste of time, it''s likely to be a failure!


    Design patterns can include not only a sequence of visitor interactions but also
    a recommended layout for the necessary pages and specific guidelines for designing
    pages. Such patterns proliferate on the web. We already mentioned shopping carts,
    but also consider standard patterns for:


    +   - Horizontal, tab-based navigation


    +   - Vertical menu navigation


    +   - Privacy policies


    +   - “About Us” pages


    +   - “Contact Us” pages


    +   - Quick checkout


    +   - Return instructions


    +   - Simple and advanced searches


    +   - Login screens


    +   - Creation of a new pattern


    +   - Verification of order status


    +   - Wish lists


    Note that some companies have actually patented some software patterns, such as
    Amazon’s “One Click” design pattern. In fact, several cases endured over rights
    to use such patterns, with ambiguous results. The legal controversy seems to have
    subsided over the last few years, but it remains possible that closely copying
    a design pattern from another web site could result in patent issues and legal
    battles.


    > MORE ABOUT PATTERNS


    For further information on design patterns as they relate to sites, The Design
    of Sites, by Douglas K. Van Duyne, James A. Landay, and Jason I. Hong.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'By identifying target audience goals, we can support visitors'' decisions and
    actions, not only the best-case scenarios (the user completes his or her intended
    task) but also the worst-case scenarios (the user doesn''t complete a task or
    encounters an error). We are always searching for ways to expedite the entire
    process.


    # Determine Site Constraints


    Site analysis results in a list of constraints as well as a list of requirements.
    In particular, a budget and time schedule must be met. For instance, a task-preparation
    web site must be completed in time for the visitors to prepare their taxes by
    the due date. Although it might be ideal to limit costs by using a small project
    team, the realities of this particular situation are that there must be a staff
    and budget adequate to complete the project within the given time constraint.


    Ideally, there are three goals we strive for in the development of a web site:


    +   - The finished product should provide value proportional to the incurred costs.


    +   - The site should be completed in an appropriate time frame.


    +   - The site should be of high quality.


    Unfortunately, we can usually choose only two of those three goals: the one, whichever
    of the three it is, always suffers. But perhaps we can build the site cheaply
    and fast, but then the quality will be compromised. On the other hand, if we are
    willing to increase the budget, we might be able to create the site quickly and
    still deliver high quality. In a nutshell, the site can be cheap to build, fast
    to build, or of high quality, but usually not all three.


    Cost-benefit analysis (deciding if the benefits are worthy of the attendant costs)
    plays a big part in the process of identifying constraints. Obviously, we want
    the benefits to exceed the costs. When the benefits are lower than the costs,
    however, that doesn''t automatically mean we should abandon the project. Perhaps
    we should first attempt to sniff out any "gold plating" and whistles that are
    not absolutely required but that increase the budget dramatically. Then, there
    are the areas we might trim in order to complete the project on time and within
    budget.


    One to keep in mind is that we not necessarily required to deliver the entire
    system at once. Often a phased rollout/launch, with critical areas of the site
    going online earlier than areas of lower priority, can relieve a tight development
    schedule or budget.'
