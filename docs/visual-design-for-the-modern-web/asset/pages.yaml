  md: '# Identify Target Audience Goals


    A visitor doesn''t drop in on a web site simply because it''s cool, or looks attractive,
    or has terrific navigation. Instead, a visitor hopes the site will help him or
    her to accomplish a goal. If the tasks necessary to achieve that goal are all
    difficult to complete, the visitor is likely to abandon the site and search for
    a competing site that is easier to use. Thus, we must determine the needs of our
    visitors and whatever we can to make those tasks effortless. If we can meet the
    visitor''s needs, we will have established a long-term relationship with that
    visitor, and our site has the potential to be a success on the web.


    Consequently, the best way to support an organization''s goals is to consider
    how best to support our visitors'' goals. How do we go about establishing a business
    goal, such as sells of products, while at the same time supporting visitors''
    goals to buy something? What for both of us? Of course we need to demonstrate
    to visitors that our site is reliable and provides the best value, or the best
    quality, or the best service. Then we allow the visitors to make purchases easily
    and quickly. Anything that interferes with visitors'' goals is ultimately counterproductive
    to a site''s goals as well, because visitors will be disinclined to use the site.


    We define our visitors'' goals by getting feedback from current customers, interviewing
    potential visitors, and analyzing competing sites. Visitor goals might include:


    +   * Purchasing products or services online, as economically and efficiently
    as possible.


    +   * Researching products or services for future purchase, either online or at
    a retail store.


    +   * Obtaining service for a product that he or she already owns.


    +   * Obtaining information about a topic of interest.


    A use case is a step-by-step documentation of a sequence of interactions that
    must be completed for a visitor to accomplish a task, presented from that visitor''s
    point of view. (This is where the personas come in handy.) Normally, there is
    one main scenario for successful completion of the basic task, plus alternate
    paths when things go wrong or when the task has an unusual component. Put all
    the scenarios together, and you have a complete use case for a typical user interaction.
    See the sidebar for an example of a use case that includes two alternate scenarios.'
  merge: -1
