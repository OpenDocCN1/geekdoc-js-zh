  md: '# JPG File Compression


    JPG compression is lossy. Specifically, saving a file to JPG:


    +   - Blurs crisp edges artifacts

    - Adds artifacts, also called noise (random pixels of a different color), to areas
    of solid color.

    - Alters the colors of the original.


    FIGURE 6.8, a JPG saved with fairly heavy compression, illustrates some of these
    problems. Keep in mind that this image is not really a good candidate for saving
    as a JPG, so the problems are exaggerated.


    FIGURE 6.8 Lossy JPG Compression, 20% Quality Setting


    ![](img/ee113e5612d290709e494a0dae247fc5_246_0.png)


    The degradation of this image reminds you to never save over an original image
    when loss compression is in effect, or the original high-quality image will be
    lost forever. Instead, maintain the original as an unadulterated master copy (preferably
    in some format other than JPG) and make any and all alterations only to copies.


    JPG compression is a variable type of compression, which means that we choose
    how much quality degradation we can tolerate a tradeoff for smaller sizes. From
    within image-editing software, we can view the effects of various compression
    rates and decide which version is the best compromise between quality and file
    size. Four compression previews from Fireworks, as shown in **6.9**, should convince
    you not to be afraid to try very compression. As you can see, even the heavy compression
    in the 30% quality image on the lower left can deliver an acceptable quality.
    After all, a very high-quality image is wasted on an inherently low-resolution
    computer display anyway. **6.10** shows an Optimize panel for exporting a file
    to JPG.


    Crisp focus and high contrast are the enemies of efficient file compression in
    the JPG format. Consequently, we can also minimize JPG sizes by adding a small
    amount of blur in non-critical areas and by reducing the contrast between the
    lightest and darkest areas in a photo.'
