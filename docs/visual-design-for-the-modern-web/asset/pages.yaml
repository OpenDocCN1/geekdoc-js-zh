  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**284**\n\nThere are also thousands of\
    \ script and decorative faces with distinct personalities \n\nthat defy categorization,\
    \ also shown in Figure 7.1. Almost anything goes, from curli-\n\ncues to “ice”\
    \ hanging from letters to balloons ﬂ oating above them. Although such \n\nfaces\
    \ are wonderful for display type, their very embellishment makes them illegible\
    \ \n\nin smaller body copy. \n\n*Dingbat *typefaces replace keyboard characters\
    \ with symbols, shapes, and orna-\n\nments, as in **FIGURE 7.2**. See the book’s\
    \ web site for a chart of the keyboard equiva-\n\nlents for some of the more common\
    \ and useful dingbat typefaces.\n\nZapfDingbats BT\n\nCommonBullets\n\nWingdings\n\
    \nWebdings\n\nShapes1\n\nArrows1\n\nStars1\n\nSome typefaces are tall and skinny,\
    \ while others are short and fat. We can use the \n\nwidth-to-height ratio to\
    \ our advantage, tailoring our typeface choices to accom-\n\nmodate “challenging”\
    \ or limited spaces. \n\nUse restraint in including multiple typefaces on a single\
    \ document. Just because \n\nI’ve installed (at latest count) 1536 typefaces on\
    \ my own computer doesn’t mean I \n\nshould subscribe to the “ransom note” school\
    \ of typography by using all of them at \n\nonce. Instead, as a general rule,\
    \ it’s best to use one simple typeface for body copy, \n\nand one or two decorative\
    \ faces in the logo and/or headers. Those typefaces might \n\ncontrast in structure;\
    \ perhaps the body copy is a simple serif font while the logo \n\nuses a bigger\
    \ and bolder version of the same font as well as another very decorative \n\n\
    typeface. Often, it’s best to choose two very different fonts that contrast sharply,\
    \ \n\nrather than two or more very similar fonts. \n\nFormatting and Contrast\n\
    \nCharacteristics other than just the design of the typeface can create emphasis\
    \ and \n\ntypographical contrast:\n\n■ Size: big versus small.\n\n■ Weight: **bold**\
    \ versus not bold.\n\n**FIGURE 7.2 **Dingbat \n\nTypefaces\n\n**FIGURE 7.2 **Dingbat\
    \ \n\nTypefaces\n\n**TOO MANY FONTS?**\n\nManaging typefaces is \n\nno easy task\
    \ if, like most \n\ndesigners, you have \n\nhundreds, maybe even \n\nthousands\
    \ of typefaces \n\non your system. Font-\n\nmanagement software \n\norganizes\
    \ typefaces by \n\ncategories so that find-\n\ning a script typeface, \n\nfor\
    \ instance, involves \n\nbrowsing through only \n\nthe script category in-\n\n\
    stead of all of the type-\n\nfaces on the system. \n\nYou could check out \n\n\
    linotype.com and exten-\n\nsis.com to get started \n\nwith some font-man-\n\n\
    agement information.\n\n**TOO MANY FONTS?**\n\nManaging typefaces is \n\nno easy\
    \ task if, like most \n\ndesigners, you have \n\nhundreds, maybe even \n\nthousands\
    \ of typefaces \n\non your system. Font-\n\nmanagement software \n\norganizes\
    \ typefaces by \n\ncategories so that find-\n\ning a script typeface, \n\nfor\
    \ instance, involves \n\nbrowsing through only \n\nthe script category in-\n\n\
    stead of all of the type-\n\nfaces on the system. \n\nYou could check out \n\n\
    linotype.com and exten-\n\nsis.com to get started \n\nwith some font-man-\n\n\
    agement information."
