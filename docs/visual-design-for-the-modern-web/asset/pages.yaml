  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**290**\n\nAbsolute Text Sizing\n\nWe use\
    \ *absolute text sizing* to stipulate a speciﬁ c pixel height for text, completely\
    \ \n\ndisregarding any text sizing currently set in the visitor’s browser. For\
    \ example: \n\n.largeText {font-size:18px;}\n\nIn older browsers, absolute sizing\
    \ overrides font settings the visitor might have speci-\n\nﬁ ed, which can cause\
    \ problems for those with vision impairment. (Newer browsers \n\nallow visitors\
    \ to override font settings on web sites.) Absolute sizing is most problematic\
    \ \n\nwhen used to reduce (rather than enlarge) text size. \n\nRelative Text Sizing\n\
    \nWith relative text sizing, the font size currently in effect is increased or\
    \ decreased \n\nby a certain proportion:\n\n.largeText {font-size: 110%;} \n\n\
    .largeText {font-size: 1.1em;}\n\nIt’s intuitively clear that the ﬁ rst example\
    \ increases text size by 10%. The second \n\nexample does the same thing, by referencing\
    \ “em,” the size of the letter M in the \n\ncurrent font. See the sidebar for\
    \ discussion of font size inheritance, which deter-\n\nmines the base font to\
    \ which the relative sizing applies. \n\n RELATIVE FONT SIZE AND INHERITANCE\n\
    \n**When using relative font size properties in CSS, such as **text-size:110%**\
    \ or **\n\ntext-size:1.1em**, the theory is that the relative size differential\
    \ should be applied **\n\n**to whatever size characteristics the font has already\
    \ inherited. For instance:**\n\n**If the page’s base font is size 3,**\n\n**And\
    \ the font for tables is specified as 110%,**\n\n**And a header (contained in\
    \ a table) is specified as 120%,**\n\n**Then, in theory, the header should be\
    \ displayed at **\n\n**base font size x 110% x 120%.**\n\n**Regrettably, not all\
    \ browsers apply font size inheritance in the same way; some **\n\n**browsers\
    \ have their own quirky way of interpreting inheritance. As always, be sure **\n\
    \n**to test in all of your target browsers.**"
  merge: -1
