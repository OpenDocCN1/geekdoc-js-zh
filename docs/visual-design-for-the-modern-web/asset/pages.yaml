  md: '+   ■ Provide sufficient contrast in color and value between foreground and
    background such that text and all links (static, on mouseover, visited, and active)
    are clear and easy to read?


    +   ■ Choose background color and separator neutrals (or lack thereof) that interact
    appealingly, to show off colors to best effect?


    +   ■ Choose prominent colors for the elements on the page that you want to notice
