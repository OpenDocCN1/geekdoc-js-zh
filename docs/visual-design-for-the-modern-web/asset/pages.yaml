  pgno: 61
- img_proc: true
  md: 'In the physical world, a well-designed building is no accident. If it''s strong,
    functional, easy to navigate, and aesthetically pleasing, it''s because an architect
    put a lot of thought and effort into discovering the user''s needs and designing
    the building to fulfill those needs. Similarly, in the web world, a strong, functional,
    and aesthetically pleasing web site is the result of thoughtful architecture.


    For the purposes of this chapter, we will narrow our terminology to site architecture—the
    organization and navigation of information within a web site. FIGURE 2.4 illustrates
    how site architecture relates to the rest of site design.


    FIGURE 2.4 Site Architecture


    ![](img/ee113e5612d290709e494a0dae247fc5_62_0.png)


    Site architecture is a fuzzy blend of information architecture and interaction
    design. It involves:


    +   - The content, or the fragments of information, buried in the site.

    - The relationship of individual fragments to one another; that is, the logical
    structure that ties those fragments together in a way that intuitively makes sense
    to visitors.

    - The navigation that visitors use to traverse the logical structure.


    Site architecture is the glue that holds the entire site together. Because a site
    must grow and change along with the evolution of business needs, the site architecture
    must be scalable and flexible.


    Notice that haven''t mentioned visual design yet. Site architecture is how the
    mind views the information, while visual design is how the eye sees it. Visual
    design is important, obviously, and we will examine in the chapters to come, but
    it can be implemented only after the site architecture is defined. Function must
    come before form; site architecture is the framework on which the visual elements
    hang.'
  merge: -1
