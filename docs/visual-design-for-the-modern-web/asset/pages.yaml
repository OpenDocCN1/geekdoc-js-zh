- img_proc: true
  md: 'the gradient. If you need web-safe colors, alter the resulting hex code to
    “snap” it to the nearest web-safe gray.


    FIGURE 5.22 Mixing Grays with a Gradient


    ![](img/ee113e5612d290709e494a0dae247fc5_207_0.png)


    # Mixing Tints


    To create tints of a color using a mathematical technique, pick a base hue #00FFFF
    (maximum saturation cyan) and alter the code mathematically so that it approaches
    white. To do that, add progressively larger equal amounts of the other hex pair(s):
    #00FFFF > #33FFFF > #66FFFF > #9FFFF > #FFFF, as illustrated in FIGURE 5.23.


