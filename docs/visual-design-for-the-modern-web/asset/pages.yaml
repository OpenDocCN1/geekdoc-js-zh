- img_proc: true
  md: 'In face-to-face conversation, words convey only a portion of the message. In
    fact, a great deal of the message is carried by tone of voice, facial expression,
    and hand gestures. Web content, like the words of a conversation, is influenced
    by presentation. Visual elements such as color, layout, typography, and images
    shape a site''s personality, or voice. The voice gives a site a unique tone, ambiance,
    and attitude; generates emotional impact, and makes the site engaging. Every element
    on the site should contribute to its unique voice.


    # QUIPS AND QUOTES


    > "We must discover what information the audience needs, then deliver it to them
    in a way they can absorb." -Creativepro Weekly, July 12, 2005, http://www.creativepro.com/storyarchive/newsletter/458.html


    The voice of a site should depend upon its purpose and its target audience, both
    topics we''ll explore within this book. For now, though, suffice to say that a
    site promoting the latest rap star will have a very different voice than one peddling
    expensive bassinets. If we were to reverse the look and feel of these two sites,
    audiences would be confused and unlikely to frequent their respective sites in
    the future.


    Web design is, therefore, not just about technology. In fact, it''s the melding
    of web-based technologies with content (the message), site architecture (the way
    the content is organized), visual design (the visual presentation), and interaction
    (your site''s behavior as it responds to a visitor), as shown in FIGURE 1.1. This
    collision of forces can explode as stunning fireworks—or it can fizzle out as
    a confusing and unappe visual middle.


    Figure 1.1 The Interdependent Components of Web Design


    ![](img/ee113e5612d290709e494a0dae247fc5_10_0.png)'
