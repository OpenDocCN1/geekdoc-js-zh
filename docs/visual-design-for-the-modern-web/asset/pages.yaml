  md: '# Usability Principles


    Usability principles are based on increasing visitor satisfaction, which determines
    whether or not the visitor stays on our site and returns to it later. Usability
    factors promoting visitor satisfaction include the following:


    +   -evidence. The site must be easy to use. Viewers will quickly leave a web
    site that is too complicated or requires extensive online explanations. In either
    case, the designers have not put enough thought into the design. We need to do
    the thinking so that users don''t have to. A consistent and predictable organization,
    presentation, and interaction style promotes a faster learning curve and resulting
    increase in visitor efficiency, and, of course, presence and loyalty.


    +   - Speed. We have no patience for slow. Unfortunately, many visitors are on
    dial-up lines with slow modems. Consequently, we should limit the sizes of our
    files, a topic discussed more fully in Chapter 4. We also shouldn''t require excessive
    clicks from visitors, because every new page requires a page load. We must establish
    clear and concise navigation so that visitors don''t take turns, again slowing
    them down. Ideally, we would like to deliver a visitor to her target within three
    clicks.


    +   - Feedback. If the visitor must wait for something, we should warn her of
    fact. For instance, a small animation that visually illustrates progress can indicate
    that the system is doing something and hasn''t just locked up. It''s much like
    background music on a phone call when you have been put on-you might not like
    the music, but at least that the connection isn''t broken.


    +   - Accuracy. Professional web pages have not broken lines, missing images,
    JavaScript errors, or anything else obviously doesn''t work. You must make absolutely
    that none of these flubs turn up on your pages. Moreover, you should test the
    site in multiple browsers and versions.


    Although the word "usability" may not be mentioned on every page of this book,
    it''s an enduring term. Keep in mind that all the aesthetic and interactive factors
    are going to examine the usability of a site. For instance, a poor layout or irritating
    color scheme will, of course, degrade usability. After all, what is usability
    if not the result of effective design choices?


    It''s all well and good to talk about how a web site is usable. Nevertheless,
    the only way to really know if we have satisfied those guidelines is to test against
    real users, which is the subject of our next section.


    ![](img/ee113e5612d290709e494a0dae247fc5_30_0.png)


    DON''T MAKE THEM THINK!


    Alfred Northhead said, "Civilization extending the number of important operations
    which we can perform without thinking about them."'
