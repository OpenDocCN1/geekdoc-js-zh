  md: "**CHAPTER SEVEN** Typography** 285**\n\n■ Color: you get the idea.\n\n■ Form:\
    \ *italic*, ALL CAPS, or SMALL CAPS versus not italic (also called *roman*) and\
    \ not \n\ncaps (also called *lowercase*).\n\n■ Direction: whether the type is\
    \ horizontal or at some other angle, such as running \n\nvertically, or on a curved\
    \ path. \n\n■ Rhythm and spacing: characters that are s p a c e d differently,\
    \ or \n\neven… isolated. (We’ll cover spacing in more depth, in the next section.)\n\
    \n■ Embellishment: patterns, bevels, shadows, and glow, as shown in **FIGURE 7.3**.\n\
    \n■ Texture: how a block of type arranges itself into a shape, either heavy (closely\
    \ \n\nspaced text) or lighter (widely spaced text) in feel.\n\n![](img/ee113e5612d290709e494a0dae247fc5_293_0.png)\n\
    \nOnce again, though, we must not be so dazzled by the inﬁ nite typographical\
    \ pos-\n\nsibilities that a page becomes visually chaotic. It’s wise to use all\
    \ of these attributes \n\nsparingly, with meaning attached. For instance, use\
    \ bold, italics, or color contrast \n\nto draw attention to the structure or to\
    \ give emphasis to the elements that should \n\nstand out in the visual hierarchy,\
    \ not just for random decoration. One way to identify \n\nmuch too much typographical\
    \ contrast is to stand back from the computer display \n\nand squint at the page.\
    \ The most emphatic text elements will stand out from the \n\nblur. If there are\
    \ too many areas of emphasis, some may need to be toned down. \n\n**FIGURE 7.3\
    \ **Text \n\nEmbellishments\n\n**FIGURE 7.3 **Text \n\nEmbellishments\n\n**TEXT\
    \ BLOCKS FORM **\n\n**SHAPES**\n\nSee Chapter 4 for \n\nmore on how blocks of\
    \ \n\ntype can form shapes \n\non a page.\n\n**TEXT BLOCKS FORM **\n\n**SHAPES**\n\
    \nSee Chapter 4 for \n\nmore on how blocks of \n\ntype can form shapes \n\non\
    \ a page."
