  md: "**CHAPTER EIGHT** Forms\n\n**339**\n\n**Usability—*****Did you:***\n\n■ Do\
    \ everything possible to reduce visitor effort—visually, cognitively, and physically?\n\
    \n■ Minimize visitor clicks, keystrokes, mouse movements, and scrolling? \n\n\
    ■ Avoid asking for any data until after visitors are aware of the beneﬁ ts?\n\n\
    ■ Avoid asking for unnecessary or redundant data?\n\n■ Indicate which elements\
    \ are required and which are optional?\n\n■ Present input controls in the expected\
    \ order?\n\n■ Use wizards and control panels appropriately? \n\n■ If employing\
    \ control panels, chunk the input elements by category?\n\n■ Specify an appropriate\
    \ tab order and initial focus, when appropriate?\n\n**Selection Controls—*****Did\
    \ you:***\n\n■ Use <input type=”radio” />, <input type=”checkbox” />, or <select>\
    \ for a \n\nlimited number of choices?\n\n■ Filter out those options that become\
    \ irrelevant because of earlier choices?\n\n■ Use <input type=”radio” /> for a\
    \ short list of mutually exclusive choices?\n\n■ Use <input type=”checkbox” />\
    \ for a short list that allows multiple choices?\n\n■ Align checkboxes and radio\
    \ buttons vertically? \n\n■ Visually chunk related radio buttons and checkboxes?\n\
    \n■ Use <select> for a longer list that would cover too much screen real estate\
    \ if all \n\nthe choices were displayed at once? \n\n■ Decide whether or not to\
    \ place the most common choices at the top of the list? \n\n■ Use size=”1” for\
    \ a drop-down list, and a size with a value greater than 1 for a \n\nscrollable\
    \ list? \n\n■ Use <optgroup> to chunk related options within a select box?\n\n\
    **Text Input Controls—*****Did you:***\n\n■ Use <input type=”text” /> for one-line\
    \ text input, or <input type=”password” \n\n/> for a one-line text input with\
    \ the entered characters hidden by asterisks?\n\n■ Specify a size and maxlength\
    \ that roughly correspond?\n\n■ Display relevant ﬁ eld formatting and punctuation,\
    \ such as dashes within dates?"
  merge: -1
