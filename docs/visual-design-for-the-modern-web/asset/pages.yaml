  md: '# Introduction to Site Architecture Analysis


    Information architecture—the organization and structure of any type of information—has
    been around since mankind assembling libraries. For example, the Library of Congress
    Classification system is an information architecture system for categorizing,
    labeling, and organizing books in libraries. Similarly, site architecture, as
    highlighted in FIGURE 1.13, is nothing more than information architecture applied
    to a web site. It entails many of the same tasks as information architecture for
    libraries: categorizing, labeling, and organizing the bits and pieces of information
    that the site will present. Just as patrons would be unable to find a book in
    a library if the books were jammed on shelves randomly, our visitors would be
    unable to find what they need if our web sites were not arranged on top of some
    underlying organizational principles.


    FIGURE 1.13 Site Architecture


    ![](img/ee113e5612d290709e494a0dae247fc5_29_0.png)


    # Introduction to Usability Factors


    Usability, also called user-centric design or human factors, is a hot topic these
    days. Whatever you call it, it refers to the underlying principle that we should
    be nice to our visitors; we should make it easy for them to do what they want
    to and find what they want to. Web sites should be polite and considerate, much
    like your favorite restaurant waiter—helpful when a visitor needs help and out
    of the visitor''s way when help isn''t needed. The site should be likeable and
    should not intrude upon the visitor''s experience.'
