- img_proc: true
  md: 'Here are some hints about building tables:


    +   - Cells are stacked one above another, forming columns. If you have an unequal
    number of cells in the rows, or if the cells in a column are of unequal width,
    your table displays unpredictably.

    - A row or cell cannot be sized any smaller than the largest element it contains.

    - If you are having trouble trying to get a single table to accommodate the layout
    for an entire page, stop trying. Use multiple independent tables instead, ending
    one before starting the next, with each table managing a different layout section.

    - Tables nested within tables are notorious for breaking, and can be difficult
    to troubleshoot. Nest tables only if you come up with an easier way to accomplish
    your goal.

    - Place cell widths on only a single row of the table. Other rows will be forced
    to obey those widths anyway, but now there is only a single row that needs to
    be updated if column changes.

    - For-browser compatibility, make sure that every table cell has some type of
    content, even if it is invisible content as &nbsp; or a 1x1 pixel transparent.


    # <div> Tag


    A<div> is merely a box that surrounds content so that we can treat content as
    a unit for layout and formatting reasons. For instance, we could wrap an image
    and its accompanying text in a <div> in order to surround the unit with a common
