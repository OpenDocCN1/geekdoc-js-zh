  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**288**\n\nTypography and Web Design \n\
    \nBesides the standard typography guidelines we’ve already examined, there are\
    \ addi-\n\ntional typographical and formatting issues to deal with on the web.\
    \ For instance, we can \n\nmanipulate some typographical characteristics with\
    \ HTML and CSS (size, color, bold-\n\nface, italic, and so on), but other effects\
    \ like a bevel or drop shadow can be applied only \n\nwithin a graphic image.\
    \ Let’s look at both HTML text and graphic text in more depth. \n\nHTML Text\n\
    \nHTML text is text that is embedded within HTML tags and that receives its format-\n\
    \nting instructions from HTML and/or CSS. \n\nHTML Typefaces \n\nIt’s very important\
    \ to know that a speciﬁ ed typeface displays in the viewer’s \n\nbrowser only\
    \ if that face is already installed on the viewer’s computer system. If it \n\n\
    isn’t, the browser replaces the speciﬁ ed typeface with the resident typeface\
    \ that \n\nit judges to be a reasonable replacement. Since browsers often make\
    \ pretty poor \n\ndecisions in this respect, we can take that responsibility away\
    \ from the browser, as \n\nshown in the sidebar. \n\n HTML AND CSS REVIEW: SPECIFYING\
    \ TYPEFACES\n\n**Here is how you can circumvent bad browser decisions and specify\
    \ backup type-**\n\n**faces using CSS:**\n\nbody {font-family: Georgia, Times,\
    \ serif;}\n\n**As mentioned earlier, “font family” in traditional typography refers\
    \ to variations **\n\n**on a particular typeface, including characteristics such\
    \ as bold and italic. In CSS, **\n\n**though, “font-family” refers to the list\
    \ of backup typefaces. When a font-family **\n\n**is specified, the browser works\
    \ its way down the list, using the first typeface that **\n\n**it finds on the\
    \ visitor’s system. Thus, we can feel free to specify uncommon type-**\n\n**faces\
    \ as long as we list commonly available backup typefaces as well.**\n\n**Some\
    \ newer browsers support downloading typefaces with the page. Alas, a stan-**\n\
    \n**dard decorative typeface might be 100K or more, which is an unreasonable down-**\n\
    \n**load cost for routine body copy. As a result, this isn’t a technique that\
    \ we’ll explore **\n\n**further. The alternative, of course, is to use a special\
    \ typeface sparingly by put-**\n\n**ting it in graphic images, a technique we’ll\
    \ look at later in the chapter.**\n\n**HTML's **<font>** tag is a deprecated method\
    \ you’re most likely to find on older sites, and **\n\n**you should not use it\
    \ in new development. For new sites, stick with the CSS equivalent.**"
