  md: '# Anti-aliasing


    In the commercial print world, which boasts 3200 dots per inch or even higher
    resolution, ink dots are so tiny that they blend together to provide perfectly
    smooth curves and diagonal lines. On the web, with 72–100 pixels-per-inch resolution,
    pixels are large enough to be seen by the naked eye. Curved or diagonal lines
    are particularly problematic, because pixels can present an obviously jagged,
    stair-step appearance ("aliased"), as shown in FIGURE 6.1.


    # FIGURE 6.1 Aliasing versus Anti-aliasing


    ![](img/ee113e5612d290709e494a0dae247fc5_237_0.png)


    Aliased Diagonal Edge


    Anti-Aliased Diagonal Edge


    The remedy for the "jaggies" is anti-aliasing, which refers to a technique for
    smoothing the jagged, pixelated appearance of a diagonal or curved line on a screen
    display. Anti-aliasing adds tiny bits of transitions between the object and its
    background, blending the pixelated edges gradually into the background color.
    As a result, the edge appears smoother. Figure 6.1 on the right shows an enlarged
    example of anti-aliasing for a diagonal edge. Even though the "anti" part of "anti-aliasing"
    sounds like a negative thing, it''s really something we try to employ whenever
    possible.


    In Fireworks, we set anti-aliasing in the stroke (outline) for objects with a
    visible outside stroke, and in the fill (solid color inside the outline) for objects
    without an outside stroke. Use "soft" or "anti-aliasing" to turn on anti-aliasing,
    and "hard" to turn it off.


    > ANTI-ALIASED

    TEXT EMBEDD IN

    GRAPHICS

    See the discussion about text anti-aliasing in Chapter 7.


    # Transparency


    Although all web images are required to have rectangular shapes, sometimes an
    image needs to appear to be an irregular shape, like the color wheel in FIGURE
    6.2. One way to impart a non-rectangular illusion is to color the background of
    the rectangular image to match the HTML page background color, just as our rectangular
    color wheel image appears to be a white background to match the book''s white
    page background.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# FIGURE 6.2 Rectangular

    Image that Appears

    Non-rectangular


    ![](img/ee113e5612d290709e494a0dae247fc5_238_0.png)


    Unfortunately, a color specified in an image-editing program sometimes doesn''t
    match the same color generated by a web browser even if the color codes are identical,
    because they were created and rendered in different programs. Therefore, a faint
    outline of the rectangular image might show, particularly on older computer displays.
    Patterned backgrounds are even more problematic, because chances slim that a background
    pattern on an image would line up precisely with a background-pattern on a web
    page.


    Consequently, one of the most useful attributes of some graphic formats is transparency,
    in which the web page background shows areas of the image designated as transparent.
    When loaded into the browser, a transparent image "floats" on-whatever background
    is in effect. See FIGURE 6.3 for an example of the color wheel image (with a transparent
    background) now floating on top of patterned background.


    FOLLOWING WITH FIREWORKS


    Although Adobe Fire-works is used for the examples in this chapter, all web-friendly
    image editing software packages have similar features.


    To transparency, we initially create our image on a canvas (background) temporarily
    rarely set to the same color as the intended web page background, so that we can
    see how the image looks on that color as we are creating it. Then, just before
    exporting (converting and saving) the image to a web-friendly format, we change
    the canvas color to transparent. The Optimize panel in Fireworks, shown in FIGURE
    6.4, specifies the characteristics of the file when saved for the web, including
    transparency on transparency.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# CHAPTER SIX Graphics 231


    > FIGURE 6.3 Image with Transparent Background, Floated over a Patterned Background


    ![](img/ee113e5612d290709e494a0dae247fc5_239_0.png)


    > FIGURE 6.4 The Optimize Panel in Fireworks


    ![](img/ee113e5612d290709e494a0dae247fc5_239_1.png)


    But transparent backgrounds can cause anti-aliasing problems. After all, what
    edge-blending (anti-aliasing) colors should be used if there''s no background
    color to blend to? Unless told otherwise, most image editors anti-alias to white.
    That''s fine if we''re putting the image on a white background, but if we''re
    placing it on any other color, the result is a white "halo" that sets the image
    off from the background instead of blending in it. FIGURE 6.5 shows a white halo
    around the teal diamond as the result of anti-aliasing to the default white but
    placing the diamond on a black background. To'
  merge: -1
