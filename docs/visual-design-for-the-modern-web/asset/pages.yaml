  md: '# CHAPTERTER TWO Site Analysis 59


    Categories can provide context for our content. Let''s say we see a menu labeled
    "Trains". If that item falls under a "Vehicles" category on the menu, it''s safe
    to assume the trains weigh tons and go very fast. If it''s under a "Toys" category,
    it''s going to be small, cheap, dealable, and appealing to children. If it falls
    under a "Hobbies and Models" category, it''s still going to be small, but now
    it''s likely to be fragile, expensive, and appealing to model railroad aficionados.
    Without knowing the context of the "Trains" link, visitors could be very led astray.
    This overlapping of categories is one of the reasons they struggle to develop
    and often somewhat ambiguous.


    Let''s look next at a bad example of categorization. A large retail photography
    site breaks its products down by "amateur" and "professional." Well, what about
    the "amateur" who is perfectly willing to spend big bucks on professional equipment?
    Will that visitor tolerate through the entire amateur line before discovering
    that the equipment offered there isn''t powerful enough? Perhaps it would have
    been better to group the products by price point, say "under $1000" and "over
    $1000." Most people, amateur or professional, have some idea of how much they
    are willing to spend before they hunt for a product. Consequently, categorization
    by price would have a better chance of hooking the buyer up an appropriate product.
    The problem with the aforementioned photography website is that the designers
    chose categories based upon the way they viewed the categories, not on the way
    visitor might view the categories.


    After the categories and their associated labels are chosen, we can start arranging
    the site into a hierarchical site plan, with major categories at the top, subcategories
    underneath, and sub-subcategories and labels under. What we are designing is essentially
    a multi-level table of contents for the site. For instance, a site''s selling
    computers might have the following categories and labels:


    +   * Desktops

    * Under $1000

    * Over $1000


    +   * Laptops

    * Under $1000

    * Over $1000


    +   * Accessories

    * Printers

    * Scanners

    * Networking'
