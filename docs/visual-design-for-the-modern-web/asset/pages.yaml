  md: '# 208 VISUAL DESIGN FOR THE MODERN WEB


    The point is that you shouldn''t fall into the trap that every element on the
    page needs to be a different color. In fact, the opposite is true; every color
    you use on the page should appear in more than one place on the page. You might
    use one color extracted from the logo for text links and navigational graphics,
    another color from the logo for backgrounds, and a third color for the headers,
    subheads, table backgrounds, and dividing rules. Repetition of color is the surely
    way to unify a page.


    For visual consistency, most sites should also repeat the same colors throughout
    the entire site. You might think such repetition would be considered boring, but
    it is a reassurance to visitors that they are still in the same state as the home
    page.


    That said, sometimes colors might vary from page to page because of a color-coding
    scheme. For instance, perhaps Amazon could use a blue header and a blue navigation
    tab for all book pages, green for movie pages, and purple for all music pages.
    Even so, the different colors should be of approximately the same value and saturation,
    express the same mood, and still appear to be part of a unified- site color scheme.
    The blue Amazon book pages have small touches of green and purple, and the green
    movie pages have touches of blue and purple. Finally, if the color scheme changes
    for different pages, it''s even more critical that other characteristics of the
    site are consistent, such as layout, navigation, and graphics.


    # Color Proportions


    When repeating colors throughout the site, you shouldn''t use equal amounts of
    each color. In a three-color scheme, for instance, using 33% of each color on
    a page would lead to a boring page without a focal point. Instead, you might use
    one color for the page background (perhaps 60% of the color on the page), another
    color for elements headers or graphics that receive a certain amount of emphasis
    (30% of the page), and reserve the third color—usually the most striking—for items
    that you want to give the most emphasis, like a "Sale Today!" announcement. Think
    of the color choices as being proportionate to the colors in a man''s business
    outfit: 60% of the color, usually subtle, is in the suit itself. 30% of the color,
    usually a bit brighter, is in the shirt, and 10%, usually the most vivid color,
    is in the short, the bright tie accents, but doesn''t overwhelm, the remainder
    of the image.


    # Color Schemes


    Predictable color combinations are usually successful: monochromatic, complementary,
    triad, analog, warm, and cool. All of these are based on the traditional color
    wheel discussed earlier in the chapter. It''s our job as designers to translate
    these traditional color schemes to the RGB color wheel.'
