  md: '# Creating a Sticky Web Site


    What can we do to create a sticky site, one that keeps visitors browsing for a
    long period of time and returning again and again? Of course, the quality of primary
    content has much to do with a site''s stickiness. In general, the content should
    emphasize that our site offers that is of value to users and how our services
    differ from those of key competitors. For example:


    +   - Don''t talk about how impressive the company is—give the visitors their
    value right now.

    - Update the content regularly, making sure visitors know when it will be updated.

    - Offer discount coupons or run special, preferably on a regular schedule so that
    visitors check back often.

    - Run a contest. Be careful, however, because there are legal ramifications as
    to what you can and cannot do with a contest.

    - Provide value-added content, content that goes above and beyond the original
    purpose of the site.

    - Williams-Sonoma (www.willssonoma.com) suggests recipes that use the cooking
    utensils and specialty foods sold on the site.

    - At www.photo.net, shutterbugs can contribute their own photos to the gallery
    and request critiques from other visitors. Encouraging visitors to contribute
    to a site termed building community. Amazon''s (www.amazon.com) visitor-submitted
    reviews are another example.

    - Rand-McNally (www.randmc.com) provides not only maps (its primary content) but
    also can suggest the menus of restaurants and hotels in a specific location.

    - As your high-school composition teacher drummed into your head, be to answer
    the “who,” “what,” “when,” “where,” “why,” and “how,” as appropriate.

    - Be careful with humor; extreme cleverness can be extremely irritating on subsequent
    iterations of the joke. Just think of those television ads that we find amusing
    only on the first viewing; then on, we find for the remote when those commercials
    pop up the tube.

    - Avoid displaying a visitor counter. Most visitors don''t trust them, and they
    will passé to boot.

    - Don''t explicitly welcome visitors to your site, as in “Welcome to Bill''s Bicycle
    Shop.” Such a welcome is unnecessary and a waste of good browser real estate.
    The only exception would be if you expected a large audience from the Orient,
    in which case a welcome message is required good manners.'
