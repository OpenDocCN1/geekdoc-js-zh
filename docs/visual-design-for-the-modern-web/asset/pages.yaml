    # Visual Harmony


    An effective design walks a fine line between being serene enough to lull the
    viewer into thinking the page is easy to use and stimulating enough that the viewer
    actually wants to use it. Too much serenity, and the site is boring. Too much
    stimulation, and the site is chaotic.


    Using architecture as an example, let''s consider the “sticky” home of **FIGURE
    4.13A**, in which tension and chaos reign. Contrast that with the house of **FIGURE
    4.13B**, with its overall impression of serenity and calm. Most people would agree
    that the house of Figure is visually pleasing.


    What factors influence our impression that the first is chaotic, while the second
    feels elegant and organized? The second house **iterates the base shape, for**
    most elements, including the shape of the house itself, the windows, the shutters,
    and the door. It also repeats the same dimensions for most of these rectangles.
    Even though the attic window is shorter than the other, it has the same width
    as the windows below. If for some reason necessitated making the attic window
    narrower, it could still be kept in harmony by retaining the same relative height-to-width
    ratio of the other windows rather than retaining the horizontal dimension.'
