  md: '# CHAPTER TWO Site Analysis 39


    ![](img/ee113e5612d290709e494a0dae247fc5_47_0.png)


    Site-wide analysis consists of the thinking and planning that goes into a site
    before a single page is designed or constructed. It essentially determines what
    will be included on the site, while the later stages of visual design determine
    how the elements of the site will be presented visually. We will examine in the
    six major tasks of site-wide analysis:


    +   1. Clarify the goals for the site.


    +   2. Identify the target audience, the site''s potential visitors.


    +   3. Identify visitor goals.


    +   4. Determine site constraints.


    +   5. Determine site content.


    +   6. Analyze site architecture.


    # Clarify the Organization’s Goals


    First, we need to form a clear picture of the organization''s goals for the site.
    What is its mission, its purpose, its objectives? For example, is the site intended
    to generate leads? To sell directly to customers? To build product awareness but
    not actually sell anything? To inform visitors about a political issue? To provide
    information?'
