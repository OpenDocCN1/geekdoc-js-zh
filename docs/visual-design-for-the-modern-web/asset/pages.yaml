  md: '# INTRODUCTION


    One夏天 day number of years ago, I was chatting with my boss, Rod Angotti, Chair
    of the Department of Computer Science at Northern Illinois University. I claimed
    that some faculty member in our department, any faculty member, needed to create
    a web design course, because I really wanted to take it. I said, in a fit of pique,
    "Well, if someone doesn''t develop a web design course, I''m forced to do it myself!"
    Of course I wasn''t all serious. I didn''t know anything about web design. I had
    been teaching computer science for almost two decades, I had been an artist in
    other media all my life. But what is web design? I was clueless.


    Two weeks later, the spring schedule came out, with me listed as the professor
    on record for our new web design course. What could I get up to speed? Fast. Luckily,
    first semester I had to pick-hand my teaching assistant, Jeff Cneau (who had an
    undergraduate degree in art, including web design) and my students (only students
    who were eager to share the adventure and understood that we were in this together).
    As the semester progressed, I often had to say,"I''m sorry, I don the know the
    answer. Let''s figure this thing out." Nonetheless, we had a blast; it was one
    of my exhilarating semesters. There was something to be challenging for the professor
    as well as the students.


    It''s been a while since first semester, but web design is still finalling. I
    don''t know so often anymore, even so, my students teach me tricks every year.
    I''m not ashamed to admit that I''m a much better teacher of web design than I
    am. In fact, my students'' design abilities, with training, often surpass my own.
    That delights me immensely.


    How did that saga lead to this? Through the years, I have never been able to find
    a good, comprehensive


    web design book. HTML, CSS, and JavaScript books abound, in textbook and reference
    form. There are books that are mainly eye candy, gorgeous web sites, and even
    books that teach design by what not to. But I never ran across a concise topic
    that systematically presented design concepts and how to apply them to a web site.
    I hope this is that book.


    # So what topics, exactly, does this book cover?


    First, let''s talk about what this book is. It''s not about all of deserve dedicated
    books:


    +   HTML or CSS. I assume you already know the basics of both, and perhaps a little
    JavaScript as well (although knowledge is not required). I do lots of practice
    HTML and CSS examples, however show how to implement the principles under discussion.


    +   Adobe Creative Suite. Although I don''t know these tools, I use screenshots
    to illustrate many techniques that could be accomplished in other development
    environments as.


    +   Server-side technologies such as ASP, JSP, ColdFusion, and PHP.


    +   Multimedia, including sound and video.


    What this book does are design concepts and how to implement them for a web site
    using HTML, CSS, and baby JavaScript. As a reader might guess from the title,
    the book concentrates on visual design and the characteristics that make a web
    site usable, engaging, and memorable. Web design is tough, frankly, because of
    considerations ranging from the technical to the organizational as. A matter of
    fact, it''s so that'
