  md: "**CHAPTER EIGHT** Forms\n\n**325**\n\n■ Wizards are ideal for visitors who\
    \ are not technically savvy or who perform the \n\ngiven task only occasionally.\
    \ \n\nBut of course there are some disadvantages as well:\n\n■ Breaking the interaction\
    \ across multiple pages entails multiple page loads, \n\nalthough that’s at least\
    \ somewhat offset by the fact that each smaller page \n\ndownloads faster than\
    \ one long page. \n\n■ Wizards seem tedious, cumbersome, and condescending to\
    \ visitors who are \n\nalready familiar with the process. \n\nControl Panels \n\
    \nInstead of using a wizard structure, we could put the entire interaction on\
    \ a single \n\n(possibly long) page, called a *control panel*. **FIGURE 8.21**\
    \ presents a section of Dell’s \n\ncontrol panel for conﬁ guring a custom computer.\
    \ The advantages and disadvan-\n\ntages are, for the most part, the reverse of\
    \ those listed for wizards; control panels \n\nsuit visitors who are familiar\
    \ with the process and want to complete their tasks as \n\nquickly as possible.\
    \ Note that Dell’s custom conﬁ guration screen is probably going \n\nto be used\
    \ primarily by computer-savvy customers anyway—other customers \n\nwould be more\
    \ inclined to buy a standard, non-customized system. \n\n![](img/ee113e5612d290709e494a0dae247fc5_333_0.png)\n\
    \n**FIGURE 8.21 **Dell’s Build-\n\nYour-Own-Computer Control \n\nPanel (www.dell.com,\
    \ \n\n©2007 Dell Inc. All Rights \n\nReserved.)\n\n**FIGURE 8.21 **Dell’s Build-\n\
    \nYour-Own-Computer Control \n\nPanel (www.dell.com, \n\n©2007 Dell Inc. All Rights\
    \ \n\nReserved.)"
  merge: -1
  pgno: 333
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**326**\n\nDependent choices (discussed\
    \ earlier under Input Controls) are more difﬁ cult to \n\nprogram for control\
    \ panels than for wizards. For instance, there is only one HTML-\n\nonly way to\
    \ handle the returning visitor versus new visitor situation examined ear-\n\n\
    lier. You’d have to present all of the information for both visitors on the same\
    \ page, \n\nwhich could serve to confuse both audiences.\n\nInput Form Page Layout\
    \ \n\nAfter deciding between a wizard and a control panel, we need to design layouts\
    \ \n\nfor the individual pages. Chapter 4 examined guidelines for page layout\
    \ in general, \n\nincluding the characteristics of line, color, grids, and white\
    \ space to create a visu-\n\nally coherent page. Nevertheless, we need to study\
    \ some additional page-layout \n\nconcerns speciﬁ c to input forms. \n\nControlling\
    \ Cursor Focus and Tab Order\n\nA form control is said to have *focus* if the\
    \ cursor is resting on it. Form controls nat-\n\nurally acquire focus following\
    \ the sequence of their location in the HTML source \n\ncode. For instance, the\
    \ default values in the controls in **FIGURE 8.22A** show how \n\nthe tab key\
    \ would, by default, traverse the form controls left to right, then top to \n\n\
    bottom. Most of the time, this order is the way we would want and expect the visi-\n\
    \ntor to progress through the form, because that’s how the majority of the Western\
    \ \n\nworld reads.\n\nBut sometimes—like here—that natural order doesn’t make\
    \ sense, and we might \n\nneed to violate it. We would want the visitor to progress\
    \ vertically down the left \n\ncolumn before going to the top of the right, as\
    \ in **FIGURE 8.22B**.\n\nWe can dictate this non-default tab order by assigning\
    \ a tabindex value for each \n\naffected form element, like this:\n\n<input type=”text”\
    \ tabindex=”n” name=”billAddress” id=”billAddress” />\n\nWhen the page loads,\
    \ the cursor is initially positioned on the control with the lowest \n\ntabindex\
    \ value greater than zero. The cursor then progresses through the remain-\n\n\
    ing controls in order by ascending tabindex. Elements lacking a tabindex or with\
    \ \n\na tabindex of zero come last in the tabbing order, in order of their location\
    \ in the \n\ndocument’s HTML source code. (In Internet Explorer, a negative number\
    \ removes \n\nthe item from the tabbing order entirely.) \n\nThe sidebar shows\
    \ the HTML for the “column ﬁ rst” tabbing order of Figure 8.22B, \n\nwith the\
    \ surrounding layout table, formatting, and irrelevant attributes removed for\
    \ \n\nthe sake of simplicity."
