  md: "**CHAPTER SIX** Graphics** 267**\n\nFull-screen Background Images\n\nA full-screen\
    \ background image is, of course, intended to ﬁ ll the browser window \n\nfrom\
    \ the upper left corner to the lower right corner. A full-screen JPG background\
    \ \n\nphoto has the potential to be a huge ﬁ le, with a resulting huge download\
    \ hit. \n\nConversely, a full-screen GIF image with only a few shapes, two or\
    \ three colors, \n\nmainly horizontal lines, and no gradients or patterns (as\
    \ in Figure 6.30) could be a \n\nfairly small ﬁ le. In any case, we should be\
    \ certain that the image adds enough piz-\n\nzazz to the page to make the download\
    \ hit worthwhile.\n\nThe ﬁ rst consideration for a full-screen background image\
    \ is its display size. If it’s \n\nlarge enough to ﬁ ll larger browser windows\
    \ (say, 1600 x 1200 pixels), it can appear \n\ntruncated and incomplete when displayed\
    \ on smaller windows (like 800 x 600 \n\npixels). Using a smaller image as a background\
    \ for the entire page won’t work, \n\neither, because, as we have seen, it often\
    \ tiles unattractively to ﬁ ll the entire page. \n\n**FIGURE 6.35** illustrates\
    \ both problems. A photograph rarely works under these cir-\n\ncumstances, although\
    \ a well-planned abstract design might. In any case, you need \n\nto test a full-screen\
    \ background at multiple window sizes. \n\n![](img/ee113e5612d290709e494a0dae247fc5_275_0.png)\n\
    \n**Background Image Too Small **\n\n**for Window**\n\n![](img/ee113e5612d290709e494a0dae247fc5_275_1.png)\n\
    \n**Background Image Too Large **\n\n**for Window**\n\nFull-screen background\
    \ images scroll by default, meaning that they move along \n\nwith the content\
    \ as the user scrolls down a page. We can use CSS to lock a back-\n\nground image\
    \ in place so that it doesn’t scroll:\n\nbody {background-image:url(someImage.gif);\
    \ background-attachment:fixed;}\n\nNow, the text scrolls over the top of the ﬁ\
    \ xed background, just like movie credits \n\noften scroll over a ﬁ xed background\
    \ image. In this case, it’s especially critical that \n\nthe background image\
    \ is of low contrast internally but has high contrast with fore-\n\nground elements,\
    \ in order to avoid foreground elements becoming illegible as they \n\nscroll\
    \ over areas of background that are too similar in value.\n\n**FIGURE 6.35 **Undesirable\
    \ \n\nBackground Tiling\n\n**FIGURE 6.35 **Undesirable \n\nBackground Tiling"
  merge: -1
