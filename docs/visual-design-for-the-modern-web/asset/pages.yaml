  md: "**CHAPTER EIGHT** Forms\n\n**313**\n\n**VISUAL SIZE OF FORM CONTROLS ACROSS\
    \ BROWSERS**\n\nIn the past, form controls displayed at widely differing sizes,\
    \ depending upon the \n\nbrowser. These days, IE and Firefox, at least, display\
    \ only minimal differences in the size \n\nof controls. Nonetheless, you should\
    \ be sure to test your form in all target browsers. \n\nFor further information\
    \ on the exact sizes of the various controls in older browsers, see \n\nhttp://hotwired.lycos.com/webmonkey/99/41/index3a\\\
    _page4.html?tw=design. \n\nSingle-line Text Input Areas\n\nSingle-line text input\
    \ areas are speciﬁ ed with an <input /> tag, like this:\n\n<input type=”text”\
    \ name=”city” id=”city” value=”Chicago” maxlength=”30” \n\nsize=”20” />\n\nThe\
    \ optional value attribute provides a default value that not only displays in\
    \ the \n\ninput area upon page load but also is submitted for the ﬁ eld unless\
    \ the visitor oth-\n\nerwise changes it. The optional maxlength attribute dictates\
    \ the number of charac-\n\nters the visitor will be allowed to enter.\n\nThe optional\
    \ size command speciﬁ es the horizontal space the input area takes up on \n\n\
    the screen. Usually, the visual length of a ﬁ eld should reﬂ ect the actual length—that\
    \ \n\nis, the size and maxlength attributes should roughly correspond. It would\
    \ be silly \n\nto expect a visitor to enter a full last name (maxlength=”25”)\
    \ in an input area that \n\nappears to be only 6 characters long (size=”6”), as\
    \ in **FIGURE 8.12**. Although the ﬁ eld \n\nwould scroll to allow entry of the\
    \ full 25 characters, the user could see only a few \n\ncharacters at a time,\
    \ which makes it hard to tell if he or she entered the text correctly. \n\nConversely,\
    \ it’s equally inappropriate to provide the visitor with a 25-character size \n\
    \nfor a nine-digit postal code, as in the bottom input ﬁ eld in Figure 8.12. \n\
    \n![](img/ee113e5612d290709e494a0dae247fc5_321_0.png)\n\n**FIGURE 8.12 **Inappropriate\
    \ \n\nInput Control Sizes…Don’t \n\nTry This at Home.\n\n**FIGURE 8.12 **Inappropriate\
    \ \n\nInput Control Sizes…Don’t \n\nTry This at Home."
  merge: -1
  pgno: 321
