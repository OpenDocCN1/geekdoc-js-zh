  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**276**\n\nOne option for Flash animations\
    \ is specifying that the animation starts to play \n\nbefore the entire ﬁ le is\
    \ downloaded; the remainder of the ﬁ le is downloaded in the \n\nbackground while\
    \ the beginning sequences are playing. The visitor sees content \n\nmore quickly,\
    \ but at the same time the animation might need to pause midway \n\nthrough playback\
    \ to allow the download to catch up. \n\nThe native format for an editable Flash\
    \ ﬁ le has the ﬁ le extension .ﬂ a, but animations \n\nmust be exported to a read-only\
    \ SWF (Small Web Format, ﬁ le extension .swf) ﬁ le \n\nfor replay in a browser.\
    \ Although Flash requires a browser plug-in on the viewer’s \n\nsystem, that plug-in\
    \ is bundled with all modern browsers. Adobe states that as of \n\nJuly 2007,\
    \ 98.7% of internet-enabled PCs included Flash Player (www.adobe.com/\n\nproducts/player\\\
    _census/ﬂ ashplayer/). Still, the remedy for those few remaining \n\nFlash-impaired\
    \ visitors is to offer the option either to download Flash Player or to \n\nskip\
    \ the Flash animation entirely.\n\nAlthough Flash Player is free, programs to\
    \ create Flash animations often are not. \n\nAdobe Flash is the most common program\
    \ for creating Flash animations, of course. \n\nFlash can be used to render an\
    \ entire site, not just animation. Flash sites can be \n\ngraphically stunning\
    \ while at the same time generally smaller than the equivalent \n\nfull-screen\
    \ JPGs or GIFs. A Flash site uses just enough HTML to embed the SWF \n\nﬁ les,\
    \ and Flash renders everything else, from images to text to navigation links to\
    \ \n\ndata pulled out of a server-side database. Flash as a tool to render an\
    \ entire site is \n\ndiscussed a bit more fully in Chapter 4. \n\nGraphics and\
    \ Accessibility\n\nSince graphics are, by their very nature, a visual medium,\
    \ our primary focus is to \n\nmake graphical information accessible to screen\
    \ readers for the visually impaired. \n\nThere are several ways we can facilitate\
    \ this:\n\n■ Provide equivalent alternatives to visual content. At the very least,\
    \ every non-\n\ntext element (images, applets, Flash ﬁ les, video ﬁ les, and audio\
    \ ﬁ les) should \n\ninclude an alt attribute to describe the purpose of the element.\
    \ Although the \n\nalt text should be complete enough that the purpose is clear,\
    \ it should also be \n\nterse enough that visually impaired visitors aren’t overly\
    \ delayed by unneces-\n\nsary description. Note that providing nothing more than\
    \ the name of the ﬁ le is \n\nnot generally an acceptable use of the alt attribute.\
    \ \n\n■ If a non-text element is a link, populate the alt attribute with a description\
    \ of \n\nthe link destination.\n\n■ If a longer description is necessary for any\
    \ non-text element, use the \n\nlongdesc attribute on the <img /> tag to link\
    \ to a separate page that contains \n\nthe description."
  merge: -1
  pgno: 284
- img_proc: true
  md: "**CHAPTER SIX** Graphics\n\n**277**\n\n■ For complex non-text elements like\
    \ graphs and charts, supplement them with \n\ndetailed textual descriptions, either\
    \ on the page itself or accessible by longdesc.\n\n■ For elements that are purely\
    \ decorative, provide either a brief alt attribute \n\n(alt=”Company logo”), or\
    \ an empty alt attribute (alt=””). Under no circum-\n\nstances should the alt\
    \ attribute be omitted.\n\n■ Use the “Site” and then “Report” commands in Dreamweaver\
    \ to check for \n\naccessibility lapses and missing alt tags. \n\n■ See www.w3.org/WAI/,\
    \ www.usablenet.com, and www.adobe.com/accessibility/ \n\nfor further information.\
    \ \n\nSummary\n\nGraphics are critical in deﬁ ning the ambiance, appeal, and professionalism\
    \ of a \n\nsite. While we try to deliver engaging graphics, we must also weigh\
    \ the tradeoff of \n\nincreasing the download times that heavy use of graphics\
    \ can entail. Saving images \n\nin the proper format, minimizing image sizes,\
    \ and using graphics appropriately can \n\ngo a long way toward minimizing download\
    \ times.\n\nDesign Checklist\n\nThe following checklist serves two functions:\
    \ to summarize the major points and \n\n“rules” presented in this chapter, and\
    \ to help ensure you’ve done all you should \n\nbefore ﬁ nalizing any web site\
    \ you are creating. \n\n**General—*****Did you:***\n\n■ Avoid gratuitous graphics?\n\
    \n■ Use an appropriate format: GIF, JPG, or PNG? \n\n■ Reuse graphics throughout\
    \ the site, whenever possible? \n\n■ Crop or downsize images so that they display\
    \ at the smallest reasonable size on \n\nthe screen? \n\n■ Use height and width\
    \ attributes appropriately?\n\n■ Use an alt attribute on each image?\n\n**JPG—*****Did\
    \ you:***\n\n■ Save photographs and other continuous tone images as JPGs, unless\
    \ the images \n\nneed transparency or animation?\n\n■ Export JPGs at the lowest\
    \ compression that still looks reasonably good on a \n\nweb page?"
  merge: -1
  pgno: 285
- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**278**\n\n■ Minimize JPG ﬁ le size by\
    \ adding a small amount of blur?\n\n■ Avoid saving over the original (master)\
    \ JPG?\n\n**GIF—*****Did you:***\n\n■ Save line-based images with areas of solid\
    \ color (such as cartoons, line art, \n\nand graphic text) as GIFs?\n\n■ Select\
    \ an appropriate GIF palette, either a web-snap or a non-safe adaptive \n\npalette?\n\
    \n■ Explore transparent image backgrounds so that images no longer appear to \n\
    \nbe rectangles?\n\n■ Turn on dithering if there are more than 256 colors in an\
    \ image?\n\n■ Specify interlacing, when appropriate?\n\n■ Keep in mind the ﬁ le\
    \ size implications of excessive colors, vertical stripes, \n\nanti-aliasing,\
    \ gradients, dithering, and textures?\n\n■ Store a photograph as a GIF only if\
    \ it needs transparency or animation, and then \n\nuse a 256-color adaptive palette\
    \ with dithering turned on?\n\n**PNG Images—*****Did you:***\n\n■ Use PNG format\
    \ if you have a ﬂ at color image that needs more than 256 colors?\n\n■ Remember\
    \ that alpha transparency increases ﬁ le sizes and may not be sup-\n\nported by\
    \ all browsers?\n\n■ Specify interlacing, when appropriate?\n\n■ Store a photograph\
