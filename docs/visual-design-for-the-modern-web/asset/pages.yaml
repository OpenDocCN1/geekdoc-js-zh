    # Download Links


    Download links let visitors download files that are not typical web files. For
    instance, visitors might be able to download MP3s (music), Docs (Word), PDFs (Adobe
    Document Format), PPTs (PowerPoint presentations), or even executable programs.
    Since these files are going to be stored on the visitor''s computer upon download,
    it''s helpful to define the file name to the link so that visitors can locate
    it on their computers later. Additionally, it''s a good idea to warn users if
    the file size is large. A typical download link might look like this on a web
    page:


    Penny Lane (penny.lane.mp3, 3.2 MB)


    Here, the name (penny.lane.mp3) is listed after the song title, followed by the
    file size (3.2 MB) that serves as a "Just how patient are you? warning for visitors
    with slow connections. The HTML for a download link is identical to a standard
    hyperlink.


    # Auto-email Links


    Auto-email links format a blank email, address as specified in the href attribute
    of the <a> tag, as shown in the sidebar. That you have two options for the text
    displayed for the visitor: Provide the actual address, or provide a text description
    for the destination. Showing the real email address has the advantage of being
    easily copy-able into the visitor''s address book or into email manually if the
    auto-email errors off. Conversely, a text-based description is easier for visitors
    to understand. Neither option is the "better" one; it depends on your audience
    and expectations.


    > HTML REVIEW: AUTO-EMAIL HYPERLINKS


    Auto-email link brings up an empty email in the visitor''s email program. The
    email is directed to the address specified in the href attribute of the <a> tag.


    Auto-email link displaying the actual address:


    ```

    <a href="mailto:support@somedomain.com">

    support@somedomain.com</a>

    ```'
