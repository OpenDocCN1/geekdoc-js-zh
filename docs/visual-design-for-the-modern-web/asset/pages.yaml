  md: '# FIGURE 5.3 Tertiary Colors


    ![](img/ee113e5612d290709e494a0dae247fc5_188_0.png)


    # IS BROWN REALLY A NEUTRAL?


    Though we sometimes consider brown to be a neutral color, it has-

    uertones of red, orange,

    and/or yellow. Only black, white, and grays

    are truly neutrals.


    Blending all of the primary, all of the secondary, or all of the tertiary colors
    produces

    a very dark brownish-black color, as shown in FIGURE 5.4.


    True neutrals are black, white, and various shades of gray. Black and white

    cannot be obtained by mixing other colors, but you can obtain gray by mixing black

    with white. You can also obtain gray by mixing opposing colors on the color wheel,

    called complementary colors, as shown in Figure 5.4.


    # FIGURE 5.4 Complementary Colors


    ![](img/ee113e5612d290709e494a0dae247fc5_188_1.png)


    Mixing Three or More Even Spaced Colors to Obtain a Blackish-brown


    Mixing Complementary Colors to Obtain Gray'
