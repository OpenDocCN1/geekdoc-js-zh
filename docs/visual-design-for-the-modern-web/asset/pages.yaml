  md: '# CHAPTER FOUR


    # Page Layout


    FROM THE WEB DESIGN WOW! BOOK,

    BY JACK DAVIS AND SUSAN MERRITT:


    > "Information can''t be left to simply float about on the screen.

    it has to be put in context, framed in windows and panels

    that are tied consistently and clearly to an underlying grid."


    Page layout has always had to contend with certain

    aesthetic issues. But modern—that is, electronic—page

    layout has to deal with technical issues every bit as much as

    with aesthetic ones in order to be successful. The

    technical issues include how large our files can be and

    how many pixels (single points, or dots, in a graphic image)

    we expect to use for our page display. The aesthetic

    choices are similar to those that have been used in other

    artistic media for centuries: how we arrange text, images,

    and empty space on the page to create areas of focus. In

    web design in particular, the technical and aesthetic issues

    are tightly coupled. We simply cannot design an appealing-

    paging layout without first understanding the technical

    limitations of the medium.'
