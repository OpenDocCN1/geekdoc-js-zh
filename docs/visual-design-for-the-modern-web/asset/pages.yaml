    # Introduction to Visual Design


    The visual design, or aesthetics, of a web site is the primary focus of this book.
    Webster''s New Collegiate Dictionary defines aesthetics as "artistic" or "a pleasing
    appearance or effect." Aesthetics for a web site encompass anything with visual
    communication characteristics: color, layout, graphics, fonts, input forms, and
    navigation. We use visual elements to clarify the site''s underlying structure
    and to provide an appropriate look and feel, or context. The design should provide
    a visual identity and consistency that carries throughout the entire site. Just
    like a design for a building or an automobile, the visual design for a web site
    must be appropriate. 1.15 highlights how visual design interacts with the other
    elements of web design.


