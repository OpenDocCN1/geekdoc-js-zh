  md: "**CHAPTER SIX** Graphics\n\n**271**\n\nAvoid Web Clichés\n\nAvoid web clichés\
    \ like spinning globes, spiders and webs, or animated envelopes for \n\nemail.\
    \ A spinning globe might be appropriate for NASA, but is not appropriate for,\
    \ \n\nsay, a site selling golf clubs, just because the site is on the “world-wide”\
    \ web. \n\nConsider Using Image Borders\n\nIn the “olden days” of the web, images\
    \ generally sported the default HTML borders. \n\nThen, for a number of years,\
    \ borders were viewed as passé and were turned off \n\ncompletely. These days,\
    \ however, a graceful, one-pixel border seems to be coming \n\nback into style.\
    \ \n\nIf the border is turned on but not otherwise styled, HTML renders the border\
    \ for a \n\nnormal image in the same color as normal text, and for link images\
    \ in the same color as \n\ntext links. You can, of course, use CSS to specify\
    \ various border attributes, from style \n\n(dashed, double-dashed, dotted, etc.)\
    \ to width to color. You can always embed a border \n\nin the graphic itself,\
    \ too, before exporting it from within an image-editing program. \n\nUse Dreamweaver\
    \ to Create Remote Rollovers\n\nWe looked at graphic *rollovers* (also termed\
    \ *mouseovers*) in depth in Chapter 3, since \n\nthe most common use of rollovers\
    \ is for navigational images. Here, though, we need \n\nto examine non-navigational\
    \ *remote rollovers*, in which rollovers on text or image links \n\nchange independent\
    \ images elsewhere on the page. These rollovers are used for graphic \n\neffects,\
    \ just to display alternating images, rather than as navigational affordances.\
    \ \n\nLike navigational rollovers, remote rollovers require JavaScript to implement,\
    \ but we don’t \n\nactually have to write the JavaScript ourselves. In fact, we\
    \ can use Adobe Dreamweaver \n\nto create a standard rollover, and then manually\
    \ convert it to a remote rollover:\n\n**1\\. **In Dreamweaver, select Insert >\
    \ Image Objects > Rollover Image.\n\n**2\\. **In the resulting form:\n\n■ Provide\
    \ a unique image name, or use the generic name that Dreamweaver \n\nsuggests.\n\
    \n■ Provide the URL for the original image as well as the URL for the rollover\
    \ image.\n\n■ Check “Preload rollover image.” \n\n■ Provide the alt text for the\
    \ image.\n\n■ Type “#” (used when the <a> tag isn’t intended to load another page)\
    \ in the \n\n“When clicked, Go to URL:” ﬁ eld."
