  md: '+   Minimize the number of navigation buttons. For instance, a site with different
    navigation buttons, each with unique wording and a rollover effect, will require
    downloading 100 different images. In contrast, 50 text links (with rollovers provided
    by CSS) carry only a small download price. As we saw in Chapter 3, text links
