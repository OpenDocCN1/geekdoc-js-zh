  md: "**CHAPTER SEVEN** Typography** 295**\n\nWe can break up text in other ways\
    \ as well. *Sidebars* (like those in this book) serve as \n\nfootnotes of sorts,\
    \ for displaying parenthetical content. Indenting an entire para-\n\ngraph of\
    \ text can serve the same function, using CSS’s text-indent property. \n\n*Pull\
    \ quotes* (quotes pulled off to the side or inserted in the middle \n\nof body\
    \ copy, as shown at right) can give visitors a particularly \n\nintriguing sample\
    \ of the content, as a form of enticement. To \n\nfurther emphasize a pull quote,\
    \ vary the typeface, its size, or \n\nits leading. It’s more typographically correct\
    \ if the initial quote \n\nmarks of a pull quote can be set outside the framing\
    \ lines of the \n\ntext, as shown. \n\nLine after uninterrupted line of text is\
    \ visually boring, and lines of text that are \n\nparticularly long are difﬁ cult\
    \ to decipher, as we can see in **FIGURE 7.8**. As a result, \n\nwe shouldn’t\
    \ completely ﬁ ll a page with text, stretching from page border to page \n\nborder.\
    \ Instead, limit line length to perhaps 350–550 pixels by splitting wide pages\
    \ \n\ninto two or more columns, as discussed in Chapter 4.\n\n![](img/ee113e5612d290709e494a0dae247fc5_303_0.png)\n\
    \nHTML Special Characters and Punctuation Marks\n\nTypography rules for print\
    \ content have just as much bearing when that content \n\nappears on the web.\
    \ A summary of the more valuable rules follows.\n\n■ Don’t use excessive exclamation\
    \ points in text! (Just look at how annoying this \n\nis!!!) Using numerous exclamation\
    \ points dilutes their power to the point that \n\nthey all become meaningless!\n\
    \n■ Use *en dashes* (a hyphen the width of the letter N, like this –) to separate\
    \ joined \n\nwords, and true *em dashes* (longer, the width of the letter M, like\
    \ this —) to \n\nseparate sentence clauses. Often, we fake the em dash with two\
    \ hyphens, but a \n\ntrue em dash looks more professional. \n\n en dash\n\n Example:\
    \ “Limit line length to 30–70 characters.”\n\n HTML code: &ndash; or &#8211;\n\
    \n em dash \n\n Example: “Email—like snail mail—gets the job done.”\n\n HTML code:\
    \ &mdash; or &#8212;\n\n**FIGURE 7.8 **Excessively \n\nLong Lines of Text\n\n\
    **FIGURE 7.8 **Excessively \n\nLong Lines of Text\n\n**DON’T FORGET **\n\n**SPELLING\
    \ AND **\n\n**GRAMMAR**\n\nIt’s not HTML-specific, \n\nbut it bears repeating:\
    \ \n\nAlways check spelling, \n\ngrammar, and sentence \n\nstructure. It’s perfectly\
    \ \n\nacceptable, even com-\n\nmendable, to have a \n\nfriend or colleague read\
    \ \n\nover the content to find \n\nmistakes that we might \n\nhave missed. Everyone,\
    \ \n\neven a web book author, \n\nneeds an editor. \n\n**DON’T FORGET **\n\n**SPELLING\
    \ AND **\n\n**GRAMMAR**\n\nIt’s not HTML-specific, \n\nbut it bears repeating:\
    \ \n\nAlways check spelling, \n\ngrammar, and sentence \n\nstructure. It’s perfectly\
    \ \n\nacceptable, even com-\n\nmendable, to have a \n\nfriend or colleague read\
    \ \n\nover the content to find \n\nmistakes that we might \n\nhave missed. Everyone,\
    \ \n\neven a web book author, \n\nneeds an editor. \n\n“A pull quote like this\
    \ \n\ncan lure the viewer \n\ninto the content.”"
