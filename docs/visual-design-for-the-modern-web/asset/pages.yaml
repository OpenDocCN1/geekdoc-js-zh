  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**310**\n\nUnited States might show USA\
    \ as the default at the top of the list, as shown in \n\n**FIGURE 8.7**. Even\
    \ so, usability experts are divided on the issue, with some suggest-\n\ning that\
    \ a standard order with a selected default choice is a better idea.\n\n![](img/ee113e5612d290709e494a0dae247fc5_318_0.png)\n\
    \n \n\nA list box can be implemented as a drop-down list or as a scrollable list.\
    \ Let’s look \n\nat each.\n\nDrop-down List Boxes\n\nIf you specify size=”1”,\
    \ which is actually the default on a <select> tag, only one \n\noption is initially\
    \ displayed in the list box, and the remainder of the list drops down \n\nwhen\
    \ the visitor clicks on the scroll arrow, as you saw in Figure 8.6. The ﬁ rst\
    \ item \n\nis usually not a valid choice, but rather an explanation, as it is\
    \ here with “Select \n\none…”. The HTML that renders this list as a drop-down\
    \ is as follows: \n\n<select name=”hobbies” id=”hobbies” size=”1”\\>\n\nScrollable\
    \ List Boxes\n\nA size greater than “1” provides a *scrollable* list box, with\
    \ the size attribute deter-\n\nmining how many choices show initially. The remaining\
    \ choices are accessible by \n\nscrolling. **FIGURE 8.8** shows a list box with\
    \ a size=”5”: \n\n<select name=”hobbies” id=”hobbies” size=”5”\\>\n\n![](img/ee113e5612d290709e494a0dae247fc5_318_1.png)\n\
    \n**FIGURE 8.7 **Displaying the \n\nMost Common Choice at \n\nthe Top\n\n**FIGURE\
    \ 8.7 **Displaying the \n\nMost Common Choice at \n\nthe Top\n\n**FIGURE 8.8 **Scrolling\
    \ List \n\nBox (size=”5 “)\n\n**FIGURE 8.8 **Scrolling List \n\nBox (size=”5 “)"
