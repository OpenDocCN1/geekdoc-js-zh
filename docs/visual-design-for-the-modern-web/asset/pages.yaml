- img_proc: true
  md: 'The black-outlined larger hexagon of chips halfway out on the palette displays
    the hues of full saturation. Inside that are the tints/pastels, and outside are
    the more sophisticated tones and shades, with blacks and grays showing up in a
    repeated pattern on the outside border. Colors evolve as we rotate around the
    wheel, which each blends into orange, and orange into yellow, yellow into green,
    and so forth. It becomes effortless to pick several colors that are related in
    some fashion to each other, such as a red, a dark red, and a pink.


    The hexagon palette is more artistically intuitive than most available palettes,
    and it''s mathematically correct as well. Each color code transforms into the
    code of the adjacent colors by following a mathematical progression.


    The primary problem with this palette is that it won''t fit into the tiny palette
    areas provided by the development environments. Instead, you must open the palette
    as a normal graphics file within the application, and use the eyedropper/color
    picker tool to sample from it.


    Regardless of the palette we choose, there will be only a limited number of colors
    shown, usually the 216 web-safe colors; because space limitations there simply
    isn''t room to show all 18.8 million colors. How do we get to the remaining millions
    of colors? One alternative is to pick the web-safe color closest to what we have
    in mind, and then tweak the color using the color mixing techniques that we''ll
    discuss in a bit.


    # Sampling Colors


    Many environments and image-editing packages offer eyedropper/color picker tools.
    If the tool is selected and moved over a color on the computer screen, "samples"
    the color and provides the HTML color code. Often, the eyedropper tool works even
    if it''s moved off of its native window, that is, onto the computer''s desktop
    or the window of another application. For instance, the eyedropper tool in Fireworks
    can be moved off over to an independent window, such as a browser window, allowing
    you to determine and copy the color codes of any web site.


    Taking the process step further, you can reveal the color codes of virtually any
    object that will fit on your scanner bed, be it fabric, a magazine ad, or autumn
    leaves. The process is the same; you first scan the object, and then you can sample
    it.'
