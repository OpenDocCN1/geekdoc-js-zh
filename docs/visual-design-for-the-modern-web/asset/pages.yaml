    Most of the remainder of the book concentrates on how to use the tools of layout,
    color, graphics, typography, and input forms to create appeal. Before we get to
    specifies, however, we need to introduce a few design concepts that may help to
    create appeal. We will discuss the use of metaphor and examine overall design
