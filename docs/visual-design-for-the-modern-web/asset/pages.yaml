    FIGURE 4.8 Liquid Layout in Two Different Window Widths


    ![](img/ee113e5612d290709e494a0dae247fc5_155_0.png)


    ![](img/ee113e5612d290709e494a0dae247fc5_155_1.png)


    # HTML REVIEW: LIQUID LAYOUT


    Simply omitting a width on the <body> and the <div><table> that contains the content
    means that the page expands and contracts to fill the available width.

    The liquid layout HTML for the <div> in Figure 4.8 is shown below:


    ```

    <body>

    <div style="background-color:#dde7e9; text-align:left;">

    <p>Four score . . . created equal. </p>

    </div>

    </body>

    </html>

    ```


    Similarly, tables can expand and contract as long as:


    +   - The table width is either omitted or specified as a percent.

    - There is at least one column that doesn''t have a fixed, pixel-based width.


    For the example below, the first column is always 100 pixels wide, while the second
    column expands and contracts to fill the remaining width of the window.


    ```

    <body>

    <table>

    <tr>

    <td style="width:100px;">Gettysburg Address</td>

    <td>Four . . . created equal. </td>

    </tr>

    </table>

    </body>

    ```'
