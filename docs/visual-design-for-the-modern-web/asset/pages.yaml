  md: '# VISUAL DESIGN FOR THE MODERN WEB


    or cell phones, which may support only 256 colors. For those users, web-safe colors
    are most critical in large blocks of solid color in graphics and in HTML back-colors,
    where dithering or color shifting is most apparent. Neither of these circumstances
    seems to affect a large number of your users, feel free to use any colors that
    strike your fancy.


    # UN-"SAFE" PHOTOS


    Never worry about photographs (continuous-tone images) are web-safe. They won''t
    be, because you cannot control those colors, and they will dither, and that''s
    okay. It''s simply noticeable in all the "noise" of a typical type.


    # Color Rendering on Different Systems


    Different systems can''t be counted to display a color all in the same way. The
    combination of a particular system''s operating system (Mac or Windows), browser,
    monitor, and video all have an effect on the color output. It might like viewing
    a row of different models of TVs in an appliance store; each one renders a color
    bit differently.


    Because of this, the color that ends up on a display''s system may vary much from
    the color that displays on, even if you use the same RGB color code. For example,
    #999966 looks born on some systems and raspberry on others, a variant that most
    designers would consider to be, significant.


    In particular, LCD (flat Crystal Display) screens typically have a much brighter
    and more saturated palette than CRT monitors. Additionally, viewing the angle
    of an screen alters the way colors appear. If you are designing on an LCD screen,
    it''s absolutely critical that you check the colors on a CRT monitor early in
    the design process.


    Another factor that affects colors on the system is the system''s gamma, the measure
    of the brightness or darkness of a system''s gamma. The lower the gamma measure,
    the lighter and brighter the colors look. Macintosh computers have a default gamma
    of 2.2 (as the visitor hasn''t viewed any settings on the system, we regrettably
    can''t control). The upset is that on a Mac, the colors will look darker and murkier
    than Windows. Of course, the reverse is also true; a page created on a Windows
    PC looks much lighter and brighter on a Mac.


    Although there are utilities to tune the gamma of your system, there are of limited
    help, because you cannot tune your gamma to match yours. For now, the best you
    can do is to be aware of gamma differences and to tune your pages to make sure
    they are acceptable at different gamma settings. In image editing packages allow
    you to check your images at a gamma different from the native gamma of your development
    computer. Alternately, you can simply make your page looks good on a Windows PC,
    because it''s a safe assumption that it will almost invariably look better and
    brighter on a Mac.


    To further complicate matters, as mentioned earlier, a color you choose might
    not be recognized by all users'' systems. FIGURE 5.15 shows how this can cause
    problems with a continuous-tone gradient.


    # PNG COLOR CORRECTION


    PNG, a newer graphics format, has built-in color correction so that colors in
    graphics will be consistent across various systems. However, one of the major
    browsers currently supports this feature.


    ![](img/ee113e5612d290709e494a0dae247fc5_200_0.png)'
