  md: '# Establishing Standard Naming Conventions


    You must also set up a standard format for directory and file names. All lowercase?
    Mixed lowercase and upper case? If mixed case, do you capitalize the first letter
    of each word ("NavShoppingCart.gif") or just the words that follow that first
    word ("navShoppingCart.gif")? Or you instead use underscores to separate words
    ("nav_shopping_cart.gif")? It may seem like a big at the moment, but actually,
    the convention you choose is less important than your consistency in following
    it. Many web servers are not tolerant of spaces and special characters in folder
    and file names, so stick to letters, numbers, hyphens, and underscores.


    Folder and file names should be chosen to mean something to the developers who
    are trying to wind their way through the maze. A file name like "aa123" is worthless
    in respect, while one "nav" is helpful. You might want to use a prefix, based
    on general purpose, for each type of file, such as prefixing navigation images
    with "nav" or all images with "logo." As a result, all files with a related purpose
    are grouped together by any one of files in the subdirectory.


    It''s tempting to name images by visual attributes, like "navBlueButton.gif."
    The downside is that visual attributes might very well change as the site evolves.
    For instance, "blueButton.gif" becomes an inappropriate and confusing name if
    you later decide to recolor all the buttons red. Better to name images by function,
    not by visual attributes, because the function of a graphic usually remains constant.
    "navButton.gif" is valid regardless of the button''s current (or future) visual
    characteristics.


    It''s important to use similar standards for CSS class and id names. As files,
    don''t choose names that refer to visual attributes of color or position. For
    instance, "bluebox" and "topNav" are names that can become outdated with minor
    visual adjustments to the page. Instead, use names with structural meaning, names
    that reflect what the element does, like "mainNav", "localNav", "mainContent,"
    "sidebar."


    # Choosing Relative versus Absolute Addressing


    Relative addressing means the link paths are set up to the directory where the
    current page resides. For instance, "images/myButton.gif" exhibits relative addressing,
    in which the file is in the subdirectory "gif," which is under the "images" subdirectory,
    which is in turn the directory in which the current HTML document resides. Furthermore,
    using "../ at the beginning of the reference browsers up a level, so that "../myButton.gif"
    sends the browser two levels from the location of the current page, and then down
    to the "gif" directory where the file is located.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Absolute addressing, conversely, means that each page is accessed independently,
    via the full URL. The absolute address for the aforementioned image might be "http://www.whatever.com/root/someSubCategory/images/gif/myButton.gif."


    The problem with absolute addressing is that if you move the site, either from
    your local machine to the web server or to an entirely new web server, all links
    break necessitate updating every absolute address to point to the new location,
    often a time-consuming and error-prone task. On the other hand, relative addressing
    should work flawlessly regardless of where the site happens to be located, as
    long as the site''s direction and link structure remain unchanged.


    Although you have no choice but use absolute addressing for links to pages outside-of
    your site, make sure to use relative addressing for all links within your own
    site.


    # Summary


    Site analysis is the thinking and planning that goes into a site before you so
    much as choose a color scheme or code a single line of HTML. Spending time and
    effort on analysis means we can design and construct the right site the first
    time. Our task is to identify the site goals, the target audience and their goals,
    and the time and budget constraints. All of things determine the content we will
    present on the site and the way we organize the site architecture.


    # Design Checklist


    The following checklist serves two functions: to summarize the major points and
    "rules" presented in the chapter, and to help ensure you''ve done all all you
    should before finalizing any site you are creating.


    # Overall Site Analysis—Did you:


    +   - Perform analysis to determine exactly what is needed before you started
    building- anything?

    - Determine primary and secondary site goals?

    - Identify primary and secondary target audiences?

    - Identify the tasks the target audience will want to perform?

    - Identify the tasks and budget constraints?


    > DOIT-YOURSELF CHECKLIST

    For a "fill-in-the-blanks" document that might be used to detail the results of
    overall site analysis, go to the web site.'
  merge: -1
  pgno: 72
