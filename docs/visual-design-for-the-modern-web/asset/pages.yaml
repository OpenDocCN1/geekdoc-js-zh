  md: "**CHAPTER SEVEN** Typography** 299**\n\n EMPHASIZING TYPE IN IMAGES\n\n**When\
    \ using a typeface with very thin strokes, making the text bold often doesn’t\
    \ **\n\n**provide enough emphasis for it to display well against the background.\
    \ One rem-**\n\n**edy is to create an exact copy of the original anti-aliased\
    \ text and position it di-**\n\n**rectly on top of the original. By doubling the\
    \ effect of the anti-aliasing, the type **\n\n**appears even stronger than bold\
    \ alone. You might have to specify a wider letter **\n\n**spacing than normal,\
    \ though, to prevent the characters from running together.**\n\n**Another way\
    \ to emphasize type, particularly when the type floats on top of a **\n\n**multicolored\
    \ background, is to use not only a fill color but also an outline stroke. **\n\
    \n**FIGURE 7.10****, repeated from Chapter 6, shows a high-contrast example.**\n\
    \n**Outline**\n\n**the**\n\n**Text**\n\n**Outline**\n\n**the**\n\n**Text**\n\n\
    We can use smaller text in graphic images than we can in HTML text, because we\
    \ \n\ncan select a font designed for a speciﬁ c, very tiny size without worrying\
    \ if the visitor \n\nhas the typeface on his or her computer. Three such fonts\
    \ are Sevenet (precisely 7 \n\npixels tall), Silkscreen (8 pixels tall), and Tenacity\
    \ (10 pixels tall). These small fonts \n\nshould be used *only* at the speciﬁ\
    \ ed size, with anti-aliasing turned off. \n\nBy the same token, we can also employ\
    \ characters from dingbat typefaces (see \n\nFigure 7.2), which, as we saw in\
    \ Chapter 6, are often smoother and less pixelated \n\nthan the same symbol drawn\
    \ manually. \n\n**FIGURE 7.10 **The Dramatic \n\nDifference Between \n\nOutlined\
    \ Text And \n\nUnoutlined Text.\n\n**FIGURE 7.10 **The Dramatic \n\nDifference\
    \ Between \n\nOutlined Text And \n\nUnoutlined Text.\n\n**PHOTOSHOP **\n\n**ANTI-ALIASING\
    \ **\n\n**HINT**\n\nIf even small levels of \n\nanti-aliasing still look \n\n\
    mushy, try deselecting \n\nthe Fractional Width \n\noption in the Character \n\
    \npalette menu.\n\n**PHOTOSHOP **\n\n**ANTI-ALIASING **\n\n**HINT**\n\nIf even\
    \ small levels of \n\nanti-aliasing still look \n\nmushy, try deselecting \n\n\
    the Fractional Width \n\noption in the Character \n\npalette menu."
