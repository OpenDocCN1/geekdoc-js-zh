    # Defining Colors for the Web


    Most print-media artists working with subtractive colors find mixing colors to
    be intuitive; they don''t need to research how to mix orange paint, for example,
    orange really looks like it should be (actually is) a combination of red and yellow.
    Conversely, color mixing is often not intuitive; yellow clearly does not appear
    to be a combination of green and red. Web artists therefore rely on selecting
    from predefined palettes built into the software. We will examine the next; however,
    as we will see later in this section, we don''t need to be limited by the available
    palettes we know how to sample or mix colors on the screen.


    ![](img/ee113e5612d290709e494a0dae247fc5_202_0.png)


    # Choosing from Predefined Color Palettes


    Most palettes provided in graphics and web development software are limited to
    a small number of hues, because it would be impossible to show all 16.8 billion
    possible hues on the screen at the same time, even if the palette used only a
    single pixel per hue. Often, we use web-safe palettes as a jumping-off point,
    tweaking the colors from there, simply because they are a manageable and responsive
    set of colors. Look at the palettes in Adobe Creative Suite to see what is available.


    The web-safe Color Cub Palette can be awkward to use because it physically separates
    related colors. For instance, colors appearing to be versions of yellow in three
    different color areas of the palette, which makes it tricky to pick two or three
    harmonious variations of a hue.


    FIGURE 5.16 Adobe''s Color Palette


    ![](img/ee113e5612d290709e494a0dae247fc5_202_1.png)


    FIGURE 5.17 shows the Continuous Tone used in Adobe Creative Suite. The colors
    are identical to the web-safe colors in the previous figure, in a different way.
    You can think of this palette as a long tube that has been split horizontally
    to lie flat on the page. This palette is more helpful than the Color Cub Palette,
    because most related colors are in the same vicinity, and those that are on the
    top and bottom are separated from their immediate relatives.'
