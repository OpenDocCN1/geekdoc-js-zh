  md: '# VISUAL DESIGN FOR THE MODERN WEB


    # INVISIBILITY


    “Perhaps the most easy-to-use products are the ones you don’t notice.”—From UserCentered
    Web Design, by John Cato.


    Poor interaction design is distracting to a visitor, like a small splinter. It
    avoids even though it might not be too painful. In contrast, visitors won’t notice
    how successful an interface is if we do our jobs properly; the design will be
    transparent, invisible to the visitor (like when we don’t notice we don’t have
    a splinter). An interface that is so natural and intuitive that the user doesn’t
    notice it at all is the very definition of a successful interface.


    How many visitors are willing to jump through to get to that goal depends, again,
    on its importance to the visitor. Visitors will typically tolerate long and draw-out
    processes only if the end result is of high personal solace.


    # COMPLEXITY


    “If you add features to your program that are necessarily complex to manage, users
    will be willing to tolerate complexity only if the rewards are worth it. This
    is why a program’s user interface cannot be complex to achieve simple results,
    but it can be complex to achieve complex results (as long as such results aren’t
    needed often.”—From About Face 2.0: The Essentials of Interaction Design, by Alan
    Cooper and Robert Reimann.


    Interaction design will be covered in more depth than Chapters 3 and 8.


    # Introduction to Web Accessibility


    One of the ongoing themes of this book is accessibility, also called universal
    design, which refers to providing access for all users regardless of physical
    abilities. As we go through each chapter, we will look at accessibility guidelines
    that relate to the topic at hand. For instance, in Chapter 5, we will examine
    how to make a colorful site great while making sure that the site is legible to
    individuals who are colorblind. Nonetheless, before looking at specifics in the
    following chapters, we need to understand the overarching principles that underlie
    these specifics.


    We can, with thoughtful universal design, provide access for everyone. Why should
    we bother, when the vast majority of our visitors have physical limitations? The
    foremost reason is for humanitarian purposes—it’s the right thing to do. Furthermore,
    many accessibility initiatives support usability for all visitors. For instance,
    choosing high-contrast colors to ensure they are legible to those with color vision
    problems can also render the site easier to read for other visitors with no impairments.'
