    to the industry and increasing the organization''s status. A news organization
    like CNN might post the latest updates and opinion pieces. A rock band''s site
    might provide a concert schedule and free MP3 samples of the band''s latest CD.


    Although these sites are not primarily concerned with selling something, that
    doesn''t mean there isn''t money involved. For instance, a news organization might
    sell ads that bring in revenue to the site. A political organization hopes to
    convince visitors of their wisdom and sincerity that visitors will donate money
    to the cause. Even though a rock band might not be actually selling their CDs
    directly from their web site, they are certainly hoping visitors purchase those
    CDs from retail stores.


    # Serving as the User Interface for a Business Application


    A user interface (the screen that displays all user input and displays system
    output) is needed for any computer system that communicates with people. Every
    time we visit a web site, we are interacting with that site''s user interface,
    also called the front-end.


    A traditional computer business application, such as for entering customer charges
    or keeping track of inventory, typically uses a graphic user interface, or GUI
    (pronounced "goo-ee\). The interface is built into the application software that
    actually processes transactions, and is usually hand-built by the programmers
    along with the rest of the application.


    A browser user interface, or BUI (pronounced "boo-ee"), communicates with the
    user through the browser while the back-end business application (business logic'
