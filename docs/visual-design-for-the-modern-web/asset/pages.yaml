  md: '# Warm Color Scheme


    A warm color scheme is an analogous variant based on yellows, oranges, and reds,
    as shown in the color wheel in FIGURE 5.37. It''s warm, cozy, and inviting. Warm
    colors appear to advance; they seem closer to the viewer. The web site in Figure
    5.36 used a warm color scheme.


    FIGURE 5.37 Warm Color Scheme


    ![](img/ee113e5612d290709e494a0dae247fc5_221_0.png)


    # Cool Color Scheme


    A cool color scheme is another analogous variant, based on purples, blues, and
    greens, as illustrated in FIGURE 5.38. Cool colors seem to recede from the viewer,
    appearing further away. The perception of distance is the result of our unconscious
    experience in viewing far-away objects, as distant mountains, through the bluish
    haze of the atmosphere. Cool colors are usually perceived as slick, sophisticated,
    and professional. It therefore makes good business sense that so many corporations
    use variations on blue for their branding.


    Note that the borderline colors of yellow-green and reddish-purple can be either
    warm or cool, because they blend well with both schemes.'
