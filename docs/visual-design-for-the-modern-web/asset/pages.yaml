    reservation, or a women''s clothing site might suggest a pair of red shoes if
    the visitor purchases a red dress.


    # Preferred Labels


    | QUIPS AND QUOTES


    "A good label is obvious it''s dull as dirt."

    *From Information Architecture: Blueprints for the Web, by Christina Wodtke.


    The next step is to focus the list in order to pinpoint the most concise, precise,
    descriptive, and familiar (to our visitors) that term as our *preferred* label.
    Both screen real estate and the visitor''s "cognitive space" are far too valuable
    to be wasted with vague or unnecessary words. By choosing an obvious term as a
    label that we use consistently throughout the site, we are effectively constructing
    a controlled vocabulary.


    A preferred label is ideally a single word, although sometimes phrases are unavoidable.
    The preferred label should be one that would serve as a good trigger for your
    audience, not that they would like to recognize. For example, a site designed
    for experienced gardeners could use labels like "annuals,"perennials," and "bienennials"
    without explanation. Those labels need explanation, however, if the site were
    for brand-new generators.


    If you have a mixed audience, don''t use technical and non-technical terms in
    the same context. For instance, don''t use "annual" and "plants" that return every
    year (that would be a "perennial" to experienced gardeners). If your navigation
    system must accommodate both novices and experts, then it is better to present
    separate targeted menus for each audience. Alternately, use the technical term
    but elaborate by displaying the non-technical description or next to the term.


    Be careful with overly clever labels. Although they have the potential to be amusing
    and engaging and can add appeal to a web site, cleverness can sabotage navigation.
    For example, if an auto dealership link a "Wheels," it is referring'
