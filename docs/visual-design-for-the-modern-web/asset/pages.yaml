  md: '# CHAPTER ONE


    # Introduction to Visual Design for the Modern Web


    A. MICHAEL GILDERSSLEE, UNIVERSITY OF NEW HAMPSHIRE:


    > "So much of it web design sounds like plain old common sense after you read
    it or hear it. But if it really were plain old common sense, there would be far
    more attractive and usable web sites on the Web."


    The web is, first and foremost, a form of communication. A web designer''s goal
    should be not just to make things visually appealing, but to communicate with
    the audience.'
  merge: -1
