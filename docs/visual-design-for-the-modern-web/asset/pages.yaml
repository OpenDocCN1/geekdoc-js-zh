  md: '# CSS BORDERS THAT MIMIC BUTTONS


    CSS can mimic a rectangular rollover button. Just include border-style:outset
    (for a normal button) and border-style:inset (for a depressed button) on the link
    styles:


    ```

    a:link {border-style:outset; border:5px inset; padding:6px;}

    a:visited {border-style:outset; border:5px inset; padding:6px;}

    a:hover {border-style:inset; border:5px inset; padding:6px;}

    a:active {border-style:outset; border:5px inset; padding:6px;}

    ```


    The extra padding ensures that the text doesn''t crowd against the edges of the
    button.


    # Navigational Images


    As we see, navigational graphics are more than just links. At times, though, only
    substantially longer to download than text links. They provide the visual impact.
    Sometimes we might compromise, using text links for the most of our navigational
    images for generic actions (Go, Search, Submit, Clear, Back, Reset) so that critical
    actions such as these stand out from the page more clearly.


    > <ALT TAGS

    Always use the alt attribute to repeat the wording of an image-based link, because
    screen readers for the visually impaired cannot read the text on images.


    # REUSE IMAGES THROUGHOUT THE SITE


    Remember, an image is downloaded to the visitor''s cache the first time it''s
    referenced on the site, and then reused from the cache. The download price is
    paid only once, even though the image might be referenced by many discrete pages.
    As a result, generic navigational images for actions such as "go" can be used
    multiple times with only a single download.


    # WORDING ON NAVIGATIONAL IMAGES


    Text associated with a navigational image must be terse. While a text link that
    stretches across 200 pixels might be acceptable, a button that does so in order
    to accommodate a long text description would look both clunky and amateurish.'
