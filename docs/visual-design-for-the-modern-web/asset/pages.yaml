- img_proc: true
  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**298**\n\nAlthough text saved as an image\
    \ is appropriate for decorative elements like logos, \n\nnavigation buttons, and\
    \ perhaps headers, text saved as a graphic should never be \n\nused for body copy.\
    \ It’s a sure mark of a new web designer, because experienced \n\ndesigners know\
    \ that decorative body copy is never worth the download hit that \n\nembedding\
    \ it in an image entails. Additionally, body copy embedded in an image is \n\n\
    not searchable, not visible to search engines, not visible to screen readers for\
    \ the \n\nvisually impaired, and not easy to update if changes are needed later.\n\
    \nMany of the general typography concepts presented earlier for HTML text, includ-\n\
    \ning the differences in typefaces, sizes, and formatting, still hold true for\
    \ text saved \n\nas an image. The major difference is that we have more freedom\
    \ in graphic text to \n\nuse effects, ﬁ lters, and whatever typefaces we please,\
    \ because we don’t have to \n\nworry about whether or not the visitor has the\
    \ typeface. \n\nWe can control graphic text anti-aliasing to make the type easier\
    \ to read and less \n\npixelated. Used inappropriately, however, anti-aliasing\
    \ can make text almost illeg-\n\nible. Extremely small text becomes “mushy” when\
    \ anti-aliased, with the letters run-\n\nning together and becoming indistinct.\
    \ As type becomes larger, anti-aliasing can \n\nget stronger, although stronger\
    \ anti-aliasing increases image ﬁ le sizes.\n\nThe terminology for text anti-aliasing\
    \ varies somewhat between image-editing \n\nprograms. The terminology for anti-aliasing\
    \ in Fireworks and Photoshop is listed in \n\nthe sidebar below.\n\n ANTI-ALIASING\
    \ SETTINGS IN FIREWORKS AND PHOTOSHOP\n\n***Settings are listed in order from\
    \ the least anti-aliasing to strongest. ***\n\n**Fireworks **\n\n**Photoshop**\n\
    \n■ **None **\n\n■** None**\n\n■ **Crisp **\n\n■** Sharp**\n\n■ **Strong **\n\n\
