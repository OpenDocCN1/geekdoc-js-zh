  md: "**CHAPTER EIGHT** Forms\n\n**323**\n\nTransaction Structure\n\nIn the Site\
    \ Architecture section of Chapter 2, we looked at creating a hierarchical \n\n\
    or sequential organization to glue separate pages into an intuitive site architecture.\
    \ \n\nOne identiﬁ ed task was to categorize information and then use those categories\
    \ \n\nto split content into individual pages. Now that we’re working with input\
    \ forms, \n\nhowever, we need to decide how to split the transaction structure\
    \ across individual \n\npages as well. For instance, if we have an interaction\
    \ that requires a lot of informa-\n\ntion from the visitor, should the transaction\
    \ be broken into multiple pages, one page \n\nper step, or should the entire interaction\
    \ take place on a single page? The decision \n\nhere is between using a wizard\
    \ structure or a control-panel structure, both of which \n\nare legitimate choices,\
    \ depending upon the circumstances. \n\nWizards \n\nA *wizard* is a linear, step-by-step\
    \ interaction that loads one page per step, in a \n\ndeﬁ ned order. For instance,\
    \ a wizard for placing an order might present one page \n\nfor reviewing the items\
    \ currently in the shopping cart, another page for entering \n\nshipping information,\
    \ and yet another page for entering payment information. See \n\nthe ﬁ rst three\
    \ pages of Amazon’s checkout wizard in **FIGURE 8.20**. \n\nWizards have certain\
    \ advantages:\n\n■ The entire process seems less overwhelming to visitors than\
    \ a single-page ver-\n\nsion. After all, when presented with a single, long, complicated,\
    \ scrolling form, \n\nvisitors are bound to wonder if it’s really worth the effort.\
    \ If we conceal some of \n\nthat complexity initially, visitors are more likely\
    \ to continue.\n\n■ Wizards are ideal for processes in which some steps are dependent\
    \ upon earlier \n\nchoices. Take, for instance, the sign-in process (Step 2) in\
    \ Figure 8.20. A returning \n\nvisitor needs a somewhat different process than\
    \ a new visitor, because the new \n\nvisitor needs to register. With a wizard\
    \ such as this, the subsequent page (register \n\nversus not needing to register,\
    \ in this case) can depend upon the earlier choices. \n\n■ Wizards ensure that\
    \ no steps are skipped or completed out of order, because \n\nvisitors can’t move\
    \ forward until the current step is completed successfully.\n\n■ Errors are reported\
    \ while the visitor is still focused on that particular step in \n\nthe process."
