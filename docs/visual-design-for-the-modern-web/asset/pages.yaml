  md: 'The form just looked at illustrates the use of an underlying grid, the framework
    upon which most layouts are built. A grid is nothing more than an invisible structure
    of rows and columns—a structure that has been used in newspapers and magazines
    for decades. A grid helps to unify the page, because there is a clear structure
    that the viewer perceives, even if only subconsciously.


    Tables and <div>s establish the grid. **FIGURE 4.15** on the table borders from
    Figure 4.14C so we can see the "spacer" columns that ensure "breathing room" between
    elements on the page. CSS margins and padding could be used instead to provide
    the same breathing room.


    # **FIGURE 4.15** Underlying Grid from Figure 4.14C


    | First Name | |

    |---||

    | Last Name | |

    | Street Address | |

    | City | |

    | State | |

    | Zip Code | |


    # Chunk information.


    Organizing the various page elements into chunks (clusters of related elements)
    also helps to make the page appear to be simpler. A news portal like www.ms.com
    uses several obvious chunks, including headers like "MSNBC News," "FOX Sports,"
    "Also on," and "Money," all so that users can zero in on the topics they interest
    without being forced to read through the links that connect.


    The tools used to chunk content are examples of Krause’s visual adhesive: a graphic
    element that forms what he describes in Layout Index "a connection between the
    scattered elements while adding aesthetic interest at the same time." Visual adhesive
    holds the page together aesthetically as well as conceptually, so that the various
    elements don''t seem to be planked randomly on the page.


    Consider using some type of visual adhesive if your page seems to lack interest
    or appear disjoint. Visual adhesive tools include the following:


    +   - Prominent headings and subheadings. Do not override headers, however. For
    instance, if you have the label "Search" next to a search input field, you don''t
    need a "Search" heading as well.

    - Bulleted or numbered lists.

    - Indentation. Elements that are indented to the right seem to be subordinate
    to any non-indented item above.'
