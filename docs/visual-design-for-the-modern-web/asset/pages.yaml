- img_proc: true
  md: 'As powerful as <div>s, however, we shouldn''t ignore tables because <div>s
    are a new tool. Tables are virtually bulletproof in browsers, with only the most
    minor of rendering differences. Additionally, there are some problems that are
    easier to solve with tables than <div>s. A sliced image is very easy to reassemble
    in a table, but not so with <div>s. The point is to use both tables and <div>s,
    as appropriate.


    # Adobe Flash


    Adobe Flash can be used to render an entire site, not just for animation. A Flash
    site uses just HTML to embed the Flash. Flash renders everything, from images
    to text linking data pulled out of a server-side database. In a Flash-based site,
    “pages” are no longer discrete; instead, they each just one location (or animation
    “cell”) within the single Flash site that encompasses the entire site.


    There are advantages to rendering an entire site in Flash:


    +   - A Flash site can be graphically stunning while at the same time generally
    smaller than the equivalent full-screen JPEG or GIFs.

    - The Flash authoring platform includes Adobe Flex/ActionScript, an XML-based
    language that facilitates both client-side and server-side programming.

    - Flash is component-based; that is, parts of a page can be reloaded without refreshing
    the entire page.

    - Flash makes it easier to build web sites that resize well to display on multiple
    media, including mobile devices.


    Of course, there are disadvantages to Flash-based sites as well:


    +   - Although Flash files are inherently smaller than their equivalent JPEGs
    and GIFs, that advantage is often more offset than by the fact that every of content
    on the entire site is now graphical. Obviously, that can present download issues.

    - The graphical nature of a Flash site also means that searching within the site
    (by search engines and by site-specific search functions) is not as effortless
    as it is on an HTML-based site, where a word on the site is no longer a word;
    it’s just independent pixels arranged around a picture of a word.


    +   - The browser’s Back and Forward buttons don’t work as most users expect.
    They return to the beginning or end of the entire animation, rather than to the
    previous or next action within the animation. Although a well-designed Flash site
    provides its own Back and Forward buttons, most users are so habitual to relying
    on the browser’s Back button that they use it anyway, thereby losing their places
    in the sites.


    ![](img/ee113e5612d290709e494a0dae247fc5_151_0.png)


    SLICED IMAGES

    A sliced image is one that is cut into pieces that can be manipulated independently,
    perhaps for rollover effects. Chapter 3 for more on sliced images.'
