  md: '# 248 VISUAL DESIGN FOR THE MODERN WEB


    Some flatbed scanners have adapters for scanning negatives and transparencies,
    but the quality is a far cry from that of dedicated transparency scanners, which
    can scan negatives and slides rather than printed materials. Since they scan original
    film, pictures that were degraded somewhat in the printing process, they usually
    produce higher-quality images than flatbed scanners. Some transparency scanners
    have a street price of $500 or so, the highly-rated ones seem to start around
    $1500.


    Although transparency scanners do indeed deliver the most accurate images, once
    those are degraded by being posted on the web at 71-122 pixels per inch, complete
    with the inherent web color vagaries that we examined in Chapter 5... well, it
    seems that a transparency scanner, though terrific, is overkill unless we use
    the images for collateral printed materials.


    # Scanner Specifications


    Even less expensive scanners seem capable of extremely high resolution, scanning
    at 2400 dots per inch or higher. Color fidelity, then, not resolution, is the
    mark of a high-quality scanner. How can you tell if a scanner has high color fidelity?
    Ideally, we would like to find a store that allows us to test different scanners.
    Keep in mind that the only accurate comparison is to evaluate the scanned images
    on some computer, thereby eliminating any color variations resulting from different
    video adapters and monitors.


    Another way to tell if a scanner is capable of high color fidelity is to look
    at its technical specifications. At a minimum, a scanner should handle 24-bit
    color/true color (16.8 million colors) and have better than a 3.0 luminosity rating
    (also referred to as the Dmax rating). The luminosity rating shows how well the
    scanner can pick detail out of shadows on an image. Although ours are outstanding
    at perceiving detail, scanners (as well as cameras, for that matter) are not so
    skillful. In any case, luminosity ratings today are in the following range:


    +   - 3.0 luminosity rating: low-end scanners, with less accurate shadow detail.

    - 3.3–3.4 luminosity rating: mid-range scanners, with generally good shadow detail.

    - 3.6 luminosity rating or higher: high-end professional-quality scanners, with
    very good shadow detail and very expensive price points.


    # Scanner Settings


    When you scan an image, exactly what resolution settings should you use? Well,
    you could just automatically scan at the highest resolution. After all, higher
    settings should, in theory, provide higher quality, particularly if you want to
    use the image for high-resolution printed materials in addition to posting on
    the web. The problem is higher resolutions produce much larger image files. Additionally,
    if you are scanning, say, an 8 x 10" image at the highest resolution and the highest
    depth, there is a good chance you will hang your computer (well, if it''s Windows'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'computer, anyway—at the very least, you can take a long break while you wait
    for the results. Few computers can handle the pixel-crunching demands of an image
    file that is large. Usually, it''s safer to scan at a somewhat lower resolution,
    because as we know, the web is a low-resolution medium.


    But how do we know resolution is correct for a given image? Let''s review bitmapped
    images a before we get to the mathematics of choosing a scanning resolution. Remember,
    bitmapped images don''t resize well, because image-editing programs have a hard
    time inventing pixels out of thin air for enlargements and deciding which pixels
    to discard for reductions. As a result, it seems that scanning an image at precisely
    the number of pixels we need for display on the web will deliver the best results.
    For example, if we need a 200 x 300-pixel image, we need the scanner to deliver
    an image that is exactly 200 x 300 pixels.


    Let''s look at a sample calculation for an original image that measures 4 x 6
    inches:


    +   - For width: 200 (target pixel width) divided by 4 (inch width of the original)
    = 50 dpi (dots per inch, the scanning resolution).


    +   - For height: 300 (target pixel height) divided by 6 (inches of height of
    the original) = 50 dpi.


    +   - Either way, the result is 50 dpi, so we can safely scan the image at 50
    dpi.


    +   - Double-check the math:


    +   - 50 (dpi) times 4 (inches of width in the original) results in 200 pixels
    of width, exactly what we need.


    +   - 50 (dpi) times 6 (inches of height in the original) results in 300 pixels
    of height, again what we need. (Note that some examples coming up won''t be quite
    so cut and dried).


    Now we see how this works, let''s put the same calculation into a matrix that
    we can use for future calculations:


    TABLE 6.3 CALCULATING SCANNING RESOLUTION, EXAMPLE 1

    | Target of Number Pixels | Divided by | Original Image, in Inches | Equals |
    Scanning Resolution DPI |

    |---|---|---|---|-|

    | Width | 200 | ÷ | 4 | = | 50 |

    | Height | 300 | ÷ | 6 | = | 50 |


    Let''s try another example. This time, we need to display that same 4 x 6-inch
    photo at 600 x 900 pixels:'
  merge: -1
  pgno: 257
- img_proc: true
  md: '| Target of Number Pixels | Divided by | Original Image, in Inches | Equals
    | Scanning Resolution DPI |

    | --- | --- | --- | --- | --- |

    | Width | 600 | + | 4 | = | 150 |

    | Height | 900 | + | 6 | = | 150 |


    # TABLE 6.4 CALCULATING SCANNING RESOLUTION, EXAMPLE 2


    Now let''s look at a trickier example, displaying the image at 400 x 500 pixels:


    # TABLE 6.5 CALCULATING SCANNING RESOLUTION, EXAMPLE 3A


    | Target of Number Pixels | Divided by | Original Image, in Inches | Equals |
    Scanning Resolution DPI |

    | --- | --- | --- | --- | --- |

    | Width | 400 | + | 4 | = | 100 |

    | Height | 500 | + | 6 | = | 83 |


    Notice that now, the calculated scanning resolution is different for the height
    and the width. The differing results tell us that the aspect ratio (ratio of width
    to height) of the original image is different from our target web image. Unfortunately,
    we cannot scan height and width at different resolutions to suit the two dpi results.
    No should we scan at one of the two calculated results, and then stretch or squash
    the image in one direction or so that it fits the target dimensions. The result
    is obviously distorted and looks amateur.

    Instead, we scan at the higher of the two calculated resolutions (here, 100 dpi)
    and then crop (delete) the extra height on the dimension that is now too large.
    In this particular case, cropping an inch off the height of the resulting image
    solves the problem:


    # TABLE 6.6 CALCULATING SCANNING RESOLUTION, EXAMPLE 3B


    | Target of Number Pixels | Divided by | Original Image, in Inches | Equals |
    Scanning Resolution DPI |

    | --- | --- | --- | --- | --- |

    | Width | 400 | + | 4 | = | 100 |

    | Height | 500 | + | 6 | = | 83 replaced by 100 (the scan results in 600 pixels
    vertically, but 100 pixels are cropped from the height after scanning)|'
