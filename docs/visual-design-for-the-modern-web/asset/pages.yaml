    as apply kerning manually if we aren’t happy with the automatic results. The larger\
    \ \n\nthe type, the more critical it is that the kerning is appropriate. \n\n\
    **ANTI-ALIASING**\n\nSee Chapter 6 for an \n\nextended explanation \n\nof anti-aliasing.\
