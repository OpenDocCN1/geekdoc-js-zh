  md: '# VISUAL DESIGN FOR THE MODERN WEB


    Once our goals are defined, we must identify which of these goals are mandatory
    and which are optional. For instance, Amazon would consider closing as many sales
    as possible to be a mandatory goal. Encouraging visitors to sign up for notification
    of forthcoming DVD releases might be a desirable optional goal that could be abandoned
    if necessary.


    We must also determine the scope of the project. That is, how extensive will it
    be? For example, Target would probably choose to offer only a small selection
    of its typically vast store inventory on its web site, thereby limiting the scope
    of the project. A retailer of large appliances might choose not to sell online
    at all, but instead only product offers and service information.


    In all cases, the scope needs to be explicitly defined. Otherwise, we run the
    risk of scope creep: the process of adding more and more unplanned features on
    the fly. The most insidious words in web design (not to mention new home construction)
    are, "Well, while we are at...


    > A mission statement that prioritizes goals will help in focus in a cacophony
    of competing demands. Keep in mind that different business units—marketing, customer
    service, techies, and management—will all be clamoring for space on the site.
    A mission statement will help the organization to be able to say “no” when some
    stakeholders must be told that not everything they want can be included in the
    site.


    ![](img/ee113e5612d290709e494a0dae247fc5_48_0.png)


    Keep in mind that if the CEO wants it, it''s mandatory, regardless of whether
    or not makes good business sense.


    Let''s look at the three basic categories of organizational goals for commercial
    web sites:


    +   - Increasing profits

    - Disseminating information or opinions

    - Serving as the user interface for a standard business application


    As we look at these three goals, keep in mind that most web sites are “selling”
    something, even if the site doesn''t involve monetary currency; a web site might
    well be “selling” opinions or information instead.


    # Increasing Profits


    Most e-commerce sites fall into this category by selling a product or service,
    as do Amazon, Dell, and E“TRADE. Web sites can also increase profits in ways other
    than just selling products directly, such as by boosting brand awareness or decreasing
    the costs associated with a high incidence of customer service calls.


    In any case, we design a sales site to provide the information and ambiance that
    persuades visitors to open their wallets. These days, such factors include not'
