  md: '# Data-driven Web Pages


    It''s a bit complicated if the page is data-driven, requiring access to a database
    on the server. For example, Amazon provides information on hundreds of thousands
    of books. It would be virtually impossible, not to mention expensive, for Amazon
    to hand-code a web page for every book. Instead, a skeleton book is set up, with
    data about individual books pulled from the books database at the time each page
    is requested.


    When a site is data-driven, we must use application programs written in PHP, ASP,
    CGI/Perl, ColdFusion, JSP (JavaPages), or some other programming language. The
    image in Figure 1 illustrates this process:


    +   1. The client sends a request for a page to web server. The request usually
    includes embedded variables that give the server additional information about
    the request. For instance, if a visitor attempts to purchase a book from web site,
    the request would include data that identifies the book as well as the quantity
    demanded.


    +   2. The web server passes control off to an application server (software and
    the computer it runs on), notifying to run the appropriate application program.
    In many cases, the application program retrieves and/ updates records from a database.


    +   3. The application server passes control back to the web server, with any
    information the web server needs (such as database records) to assemble the response
    page.


    +   4. The web server merges the application program''s data with the appropriate
    HTML file. It ships the newly composed HTML file as well as any image, CSS, and
    JavaScript files off to the client.


    +   5. The client''s browser merges the received files and displays the completed
    page.


    +   6. The web server disconnects the client. Any future requests from the client
    are treated independently of any prior requests.


    If a page requires security of some sort, as if credit card numbers or other confidential
    data needs to be passed, HTTPS (Secure Hypertext Transfer Protocol) is used instead
    of HTTP.


    Although you do have a basic understanding of how this process works, we will
    not cover server-side technologies (such as how to pull data from a database)
    in any depth here. Once again, that is a topic that deserves an entire book (or,
    for that matter, several books) of its own. We will, however, look briefly at
    two fairly new additions to our server-side technologies: XML and Ajax.'
  merge: -1
