- img_proc: true
  md: "**CHAPTER EIGHT** Forms\n\n**329**\n\nChunking Input Controls by Category\n\
    \nWe can clarify input form structure by chunking the controls by category. Such\
    \ \n\ngrouping is particularly welcome in a long control-panel layout. For instance,\
    \ on the \n\nDell control panel back in Figure 8.21, the category titles (“Hard\
    \ Drive,” “CD/DVD \n\nDrives,” and so on) are featured with a pale gray background,\
    \ which also serves to \n\nseparate each category from its neighbors. Other options\
    \ for visually chunking cat-\n\negories include using borders, the <ﬁ eldset>\
    \ tag, and different font characteristics \n\nlike size and color.\n\nVisitor\
    \ Support \n\nHistorically (meaning, essentially, pre-web), computer system designers\
    \ went to great \n\nlengths to create extensive-but-separate instructions and\
    \ Help documents to bail out \n\nusers who were confused by or who encountered\
    \ error conditions on their computers. \n\nThese days, you very rarely see, let\
    \ alone consult, separate Help pages on the web, \n\nand a visitor who loses patience\
    \ simply abandons the site and moves on to an easier \n\none. As a result, it’s\
    \ often wiser to expend your efforts on creating an intuitive and \n\neasy-to-use\
    \ site rather than on instructions, help, and extensive error handling. \n\nPrinciples\
    \ of Visitor Support\n\nLet’s remind ourselves about the basic tenets of visitor\
    \ support before we move on \n\nto speciﬁ cs.\n\n■ **Practice defensive design—**Good\
    \ design usually results in good input. Read \n\nthat sentence again, slowly,\
    \ and internalize its meaning: An intuitive form struc-\n\nture and helpful instructions\
    \ can go a long way toward guiding visitors to use \n\na form properly, thereby\
    \ minimizing visitor confusion and its logical successor, \n\nvisitor error (or\
    \ the sad and just as logical outcome—site abandonment).\n\n■ **Cope gracefully—**Don’t\
    \ let problems and errors take you by surprise or \n\nsomehow offend you by their\
    \ existence. We must face up to the fact that issues, \n\ndespite our best efforts,\
    \ inevitably crop up. We’ll talk more about that in the \n\nupcoming Error Handling\
    \ section.\n\n■ **Less is more—**Too much information serves only to confuse visitors.\
    \ If you \n\nhave one piece of critical information buried in a long paragraph\
    \ of unnecessary \n\nﬂ uff, chances are most visitors won’t read any of it, and\
    \ the critical information \n\nwill remain unnoticed. Therefore, try to be brief\
    \ and salient, telling visitors only \n\nwhat they absolutely need to know to\
    \ accomplish their tasks. \n\n**QUIPS AND QUOTES**\n\n“Don’t explain unless \n\
    \nyou have to, and con-\n\nsider all explanations as \n\nbad design, unless you\
    \ \n\ncan’t find a better way.” \n\n–John Cato, *User-*\n\n*Centered Web Design.\
    \ *\n\n**QUIPS AND QUOTES**\n\n“Don’t explain unless \n\nyou have to, and con-\n\
    \nsider all explanations as \n\nbad design, unless you \n\ncan’t find a better\
    \ way.” \n\n–John Cato, *User-*\n\n*Centered Web Design. *"
