  md: '# Multimedia: Audio and Video


    Sound and video effects can, in the right circumstances, add a great deal to a
    web site. For instance, fans of a musical group might appreciate being able to
    download a sample from the band''s latest track, or a news site offer videos of
    the latest world events. The downsides are:


    +   - CD-quality, uncompressed files can be huge and for the web use advanced
    compression algorithms that can alleviate the performance issue at least somewhat.
    To boot, many such formats can begin playback as soon as a portion of the file
    is downloaded, the remainder of the file downloads in the background, thereby
    delivering content to the faster victor.

    - If a visitor is surfing the web from work, audio can alert everyone within earshot
    that someone should be working is instead goofing off.

    - Unrequested sound interferes with any visitor who might already be playing on
    or her computer.


    Because of these problems, sound and video files should rarely automatically when
    a visitor drops in on a site. Instead, visitors should always be given a choice;
    they should be required to click on a link in order to see or hear the effects.
    Put generally, multimedia should be an option that is under control of the user,
    rather than being solely under the control of the designer.


    Common audio formats include MIDI (Musical Instrument Digital Interface), WAV
    (Windows Waveform), and MP3 (MPEG Layer 3). MP3 is probably the superior for general-purpose
    usage. Common video formats include AVI (Audio Video Interleaved), MPEG (Motion
    Picture Experts Group), MOV (QuickTime movie), and RealPlayer.


    # Server-side Technologies


    The term server can refer to both the server software (the Apache server) and
    the computer hardware upon which the server software runs. The server receives
    the web page request and processes it, eventually pushing the assembled web page
    off to the requesting client (the visitor''s computer and browser). The process
    is somewhat different, depending upon whether the requested web page is static
    (all of the displayed information is embedded in the HTML itself) or data-driven
    (much of the displayed information was actually pulled in from a separate database).
    Let''s look at each.'
  merge: -1
