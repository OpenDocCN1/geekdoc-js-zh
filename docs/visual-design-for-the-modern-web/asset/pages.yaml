  md: "**CHAPTER SIX** Graphics\n\n**275**\n\n![](img/ee113e5612d290709e494a0dae247fc5_283_0.png)\n\
    \n**GIF Animation Frame**\n\n![](img/ee113e5612d290709e494a0dae247fc5_283_1.png)\n\
    \n**GIF Animation Frame**\n\n![](img/ee113e5612d290709e494a0dae247fc5_283_2.png)\n\
    \n**GIF Animation Frame during Editing, **\n\n**showing the “handles” and lines\
    \ of motion **\n\n**for the animation. **\n\nSince GIF is a bitmapped format,\
    \ every single pixel in every single GIF frame must \n\nbe speciﬁ ed and rendered,\
    \ which means the ﬁ le size can get large quickly, depend-\n\ning upon how many\
    \ GIF frames are used and how big each one is. An animated GIF \n\ndoesn’t require\
    \ a plug-in; simply include the GIF in an <img /> tag the way you would \n\nany\
    \ other image.\n\nFlash Animation \n\nFlash is a vector-based graphics program,\
    \ which, as discussed earlier, means that, \n\nin it, *shapes* are deﬁ ned, rather\
    \ than each individual pixel. Because vector graphics \n\nare usually more compact\
    \ than bitmapped graphics, a Flash animation is generally a \n\nmore compact ﬁ\
    \ le than its equivalent animated GIF. The fact that it’s vector-based \n\nalso\
    \ means that Flash animations resize beautifully, without any loss of quality.\
    \ \n\n**FIGURE 6.38 **GIF Animation \n\n**FIGURE 6.38 **GIF Animation"
