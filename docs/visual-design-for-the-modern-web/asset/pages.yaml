  md: '# # Striking a Balance


    Too much serenity is monotonous. Too much contrast and stimulation are visually
    chaotic. To avoid either of those problems, there must be a certain amount of
    serenity, not too much, and a certain amount of contrast, but not too much. If
    resolved skillfully, the tension between serenity and stimulation can offer a
    visual harmony that balances the page. Generally, it is most effective to make
    all of the elements on the page uniform, and then choose a few things to tweak
    in order to add contrast.


    # # Positioning Page Elements


    Web surfaces have become accustomed to certain layout conventions, in particular,
    the arrangement with main navigation horizontally across the top of the page and/or
    vertically the left side. This inverted “L” page layout has been popular throughout
    the history of the web, for good reason:


    +   - The top and left areas display on every user''s screen, regardless of the
    user''s window size and resolution. As a result, this area is the screen''s most
    valuable real estate and the most consistently visible for such critical page
    components as the logo and site navigation. If those elements were at the bottom
    right side of the window, they might very well disappear in a downsized window
    or on a lower-resolution display.

    - The Western world left to right, top to bottom, our eyes are trained to land
    on that upper-left corner first.


    > QUIPS AND QUOTES

    “A web user can easily see 20 interfaces in one day, 20 others the next. Each
    has to be grounded in conventional schemes and familiar modes to minimize their
    learning curve, but that familiarity should not leave them bland and indistinguishable.”—From
    Design Whys, by Eric Eaton.


    Visitors are comfortable with this inverted "L" for navigation that they don''t
    need to think about it all. That''s not to say that you can put links anywhere
    else. Nonetheless, if you are going to violate traditional expectations, you must
    overcome penalties by making the new conventions crystal; "road less traveled"
    navigational elements must be even more prominent and even more consistent in
    order to make up for their unconventional location.


    # # ONE GOVERNMENT SITE RECOMMMENDS RIGHT-SIDE NAVIGATION!


    A.S. Government usability site actually recommends right-side navigation because
    there is less mouse movement needed between the navigation and the scrollbar.
    See www.usability.gov/guidelines/navigation.html#four.'
