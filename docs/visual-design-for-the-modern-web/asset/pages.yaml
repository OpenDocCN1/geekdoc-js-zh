  md: '# CHAPTER THREE Navigation 125


    +   Provide a "skip navigation" link so that vision-impaired visitors don''t have
    to wait for a screen reader to read through the repetitive navigation system on
    every page. The link bypasses the navigation entirely, jumping straight to the
    content on the page. To implement, link a 1xpixel transparent GIF just before
    the navigation menu. The alt text on the image should read "Skip navigation" or
    "Skip to content." Wrap the image in an <a> tag that links to a standard internal
    anchor new windows, but if you do, notify the visitor first.


    +   Avoid opening new windows.


    +   Provide HTML pages as alternatives to Flash-only pages. (See Chapter 4 for
    a brief discussion of Flash-only web site construction.)


    Remember, many features that are recommended for navigation accessibility are
    benefit to all users, not just the disabled. Prime examples include tables of
    contents, site maps, navigation flexibility, keyboard shortcuts, and consistent
    navigation.


    # Summary


    The bottom line of navigation is that visitors want their on-line experience to
    be easy, intuitive, predictable, and fast. The only way you can design a site
    that supports all of this is to look at the site from the point of view of the
    visitors: who will understand your site structure, labels, and navigation? In
    short, the site architecture should support the navigation elements, and the navigation
    should reveal the site architecture.


    # Design Checklist


    The following checklist serves two functions: to summarize the major points and
    “rules” presented in the chapter, and to help you ensure you''ve done all you
    should before finalizing any web site you are creating.


    # Navigation Principles—Did you:


    +   Employ navigation to provide a conceptual map of the site?


    +   Provide feedback as to the current location?


    +   Remind the visitor how or she navigated to the current location?


    +   Help the visitor find what he or she wants?


    +   Make the visitor aware of other offers on the site?


    +   Provide site and page identification, contact information, a link to the home
    page, and global navigation on every page?'
