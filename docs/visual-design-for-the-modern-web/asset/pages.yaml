  md: '# 60 VISUAL DESIGN FOR THE MODERN WEB


    Chapter 3 will examine how to build upon this preliminary structure to create
    an intuitive navigation system.


    # Organizing Site Structure for the Developers


    The more you put into planning the structure of the site from the developer''s
    point of view, the less likely you will be to reorganize the structure later.
    "After the fact" reorganization of directories and file names is not only time-consuming,
    but it also increases the risk of breaking links. And if visitors have bookmarked
    pages on your site during the reorganization, or external sites have linked to
    your pages, those bookmarked and linked pages will not be found after the reorganization
    (so-called 이때). Links from search engines to your site will also be broken until
    the engines have discovered the changes.


    Creating a structure involves organizing files and directories on the server,
    establishing standard naming conventions for directories and files, and using
    relative instead of absolute addressing.


    # QUIPS AND QUOTES


    The canon of skilled programmers, probably based on hard-won experience: "The
    sooner you start coding, the longer the project will take. The time to plan it
    first."


    # Organizing Files and Directories on the Server


    As soon as a site exceeds a few pages, it becomes unmanageable to cram all files
    into a single directory (also called a folder). Instead, create a directory structure
    that follows your carefully crafted site-architecture hierarchy. Just as you have
    a home page with several main pages underneath it, so too you can create a home
    directory with a subdirectory for each of the main pages. For larger sites, you
    might need subdirectories under main pages, just as you have subpages under main
    pages. It''s become standard practice to provide high-level CSS, JavaScript, and
    image directories for elements that are reused throughout the site. Additionally,
    each main subdirectory might have its own subdirectories for those elements that
    are unique to just that area of the site, as shown in the example of the sidebar.


    > SAMPLE DIRECTORY STRUCTURE FOR A RETAIL SITE SELLING COMPUTERS


    root folder (includes index.html)


    +   - images

    - webImages (includes all site-wide, web-ready images)

    - originalImages (includes all site-wide, original editable images)'
