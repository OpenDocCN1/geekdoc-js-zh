    The<img> places the image itself, using the map attribute that links to

    t <map> tag. Think of the map as a clear plastic overlay that lies on top of an
    image. On the overlay, an area tags each hotspot. <area> tags include

    both title and alt attributes, for explanation that is cross-browser

    compatible. The shape attribute determines the shape of the hotspot—circle,

    rect(angle), or poly(gon). The coords attribute identifies the defining

    points of the shape are located within the map:

    ```


    +   - A circle hotspot is defined by the x,y coordinates of its center point and
    the radius (three coordinates).

    - A rectangle hotspot is defined by the x,y coordinates for its upper left and
    lower right corners (four coordinates).

    - A polygon is defined by the x,y coordinates of each point on the polygon (an
    but variable number of coordinates).


    The coords attributes (inside the quotes) cannot be interrupted by any line formatting,
    such as spaces or line breaks, which is why the formatting is awkward for the
    last <area> tag above.


    Photoshop, Fireworks, and Dreamweaver all provide support for creating image maps;
    we merely click and drag to create shapes on the image, while the program calculates
    coordinates and writes the HTML. In general, an image map requires more complicated
    HTML than a rollover would several independent image links. For that reason, use
    an image map only when you can''t get the desired effect using separate navigational
    images.'
