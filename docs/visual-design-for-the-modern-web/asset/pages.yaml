  md: "VISUAL DESIGN FOR THE MODERN WEB\n\n**292**\n\nColor\n\nText color as it relates\
    \ to background color is probably the most important format-\n\nting decision.\
    \ Obviously, pale yellow text on a white background would be illegible \n\nbecause\
    \ there is so little *value* (degree of lightness or darkness) contrast between\
    \ \n\nforeground and background. \n\nBut while contrast is of paramount importance,\
    \ it’s not as limiting as it may sound. \n\nAlthough black text on a white background\
    \ provides the most familiar and readable \n\nvalue contrast, a less extreme contrast\
    \ can still be legible while providing a more \n\nserene mood to the site. For\
    \ instance, a creamy yellow on top of a mid-value tan \n\nmight be quite legible.\
    \ Nonetheless, we must be even more careful to test such a \n\nsite in grayscale\
    \ mode to make sure it’s accessible to color-blind visitors. \n\nLight text on\
    \ a dark background can sometimes be less legible than the more famil-\n\niar\
    \ dark-on-light scheme. We can often overcome this problem by making the text\
    \ \n\nlarger or bolder or by choosing a typeface with inherently thicker strokes.\
    \ \n\nEmphasis\n\nFor emphasizing words, our choices include all of the various\
    \ formatting options \n\nin Table 7.2. Each style has its place. For instance,\
    \ bold and italics are used in the \n\nprint world to indicate vocabulary words\
    \ (as in this book) or spoken emphasis. Many \n\nexperts assert that bold renders\
    \ more clearly on a display screen than italics, but it \n\noften depends on the\
    \ typeface. \n\nSetting text all in uppercase is a throwback to the days of typewriters,\
    \ when \n\nuppercase was one of the few methods available to emphasize type. TODAY,\
    \ WE \n\nGENERALLY AVOID USING ALL CAPS IN BODY TEXT BECAUSE IT MAKES THE \n\n\
    CONTENT HARD TO READ, AS YOU CAN SEE. ADDITIONALLY, ALL CAPS HAVE THE \n\nNEGATIVE\
    \ CONNOTATION OF SHOUTING IN EMAIL AND INSTANT MESSAGING. In \n\ngeneral, the\
    \ fewer capital letters, the easier text is to read, because the ascenders \n\n\
    and descenders of the lowercase alphabet afford a more distinct word shape, thus\
    \ \n\nincreasing readability. All caps can be acceptable, though, in short headings.\
    \ \n\nDecoration\n\nUsing underlining for emphasis is another throwback to the\
    \ ancient days of type-\n\nwriters. Today, a visitor who encounters underlined\
    \ text on the web is confused \n\nand annoyed if that text isn’t clickable. Strikethrough\
    \ is also seen as an outdated \n\nand potentially confusing formatting trick;\
    \ don’t use it unless you are attempting to \n\ndisplay edited versions of documents\
    \ such as legal contracts."
