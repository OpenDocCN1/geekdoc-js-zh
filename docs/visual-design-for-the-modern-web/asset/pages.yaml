- img_proc: true
  md: '# CHAPTER THREE Navigation 107


    ![](img/ee113e5612d290709e494a0dae247fc5_115_0.png)


    Traditional non-web user interface designers have always tried to follow The Rule
    of Seven, which states that the average person can remember or comprehend only
    seven discrete elements (plus minus two) at a time. As a result, menus on non-web
    interfaces usually exhibit small menus in a narrow-deep hierarchy, with seven
    or fewer choices on each menu. We trace our way down the hierarchies in Figures
    3.19 and 3.20, we can see that the relatively small menus on the narrow-deep hierarchy
    take more user clicks to get to the bottom. In a real system, all of those clicks
    refreshes aren''t a problem with a non-web application; since all of the pages
    normally reside on the same computer, or on a remote server, the time delay is
    negligible.


    For more information about The Rule of Seven, see George A. Miller on "Magical
    Number Seven, Plus Minus Two: Limits on Our Capacity for Processing Information,"
    at http://www.well.com/user/smalin/miller.html.


    However, the web is a different environment; visitors have the choice to move
    to another site if they are annoyed by too many clicks or too many page loads.
    Thus, we ignore the Rule of Seven and instead create broad-shallow hierarchies.
    We can minimize any comprehension problems by chunking (grouping or categorizing)
    the menu items appropriately. For instance, MSN.com chunks its main menu into
    categories such as "News and Sports,"Look it Up,"Living and Finances,"Entertainment."
    Visitors are not expected to comprehend all of the links on the page; instead
    they can quickly scan for relevant categories and only those categories. Longer
    (though chunked) menus also allow us to use more precise, less vague wording on
    each link.


    By chunking menus, we are once again using the human propensity for intuitively
    grasping hierarchies, this time to eliminate the cognitive clutter of long, undifferentiated
    menus.


    > THE RULE OF SEVEN

    There is controversy, about whether comprehending is the same as remembering.
    It may be very true that we can comprehend far than seven items at a time, thereby
    releasing us from The Rule of Seven when remembering isn''t required. In fact,
    rigidly following the rule may increase human error.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Expandable Menus


    For larger sites, consider using multi-level, expandable, interactive menus, often
    called drop-down, fly-out, or cascading menus, depending on their visual characteristics.
    Whatever the terminology, the sub-menus appear only on rollover or on click, conserving
    screen estate and reducing visual clutter on the page. At the same time, multi-level
    expandable menus reduce the need to load drill-down pages (pages whose only function
    is to display menus).


    There are two basic types of multi-level menus: jump menus created with HTML <select>
    boxes, and dynamic HTML menus that use CSS and JavaScript to show and hide<div>.


    # Jump Menu Using Select Boxes


    A drop-down menu using a <select> box looks like a standard box, except that the
    choices presented are link descriptions. We use JavaScript to open a new document
    based upon the chosen <option>. FIGURE 3.21 shows a jump menu after the dropown
    arrow is clicked. Click to create a jump menu in Dreamweaver, choose Insert >
    Form > Jump Menu. Use the “+” to add each new menu item, and the text and the
    URL for each. Click the box that inserts a “Go” button, and click “OK” when.


    > FIGURE 3.21 Jump Using HTML''s <select> Tag


    ![](img/ee113e5612d290709e494a0dae247fc5_116_0.png)


    # Dynamic HTML Menus


    Dynamic HTML menus use CSS positioning and JavaScript to show and hide submenus
    and sub-submenus over the top of the existing page content. Keep in mind that
    drop-down menus are notoriously finicky in some of the older browsers, because
    they depend on CSS positioning.


    > FIGURE 3.22 shows a very simple drop-down menu created automatically (well,
    almost) by Dreamweaver. Figure 3.22A shows the menu at rest, Figures 3.22B and
    3.22C the drop-downs that appear when the first and second menu items are clicked.
    Click the sidebar for more about creating dynamic menus.'
  merge: -1
  pgno: 116
- img_proc: true
