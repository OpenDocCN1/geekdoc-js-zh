  md: 'Filtering of search criteria: elimination or inclusion of elements based upon
    specified characteristics. Again looking back at Figure 3.1, we see how Amazon
    can filter the search based on media format, reader age, language, and publication
    date.


    # # Search Engine Results Pages


    The results of a search query are displayed on a search engine results page (SERP).
    The SERP should repeat the terms somewhere on the page, display the domain that
    was searched (the entire web, just this, or specific sub-area within the site),
    and include the number of matching pages found.


    Each individual result should include enough information about the destination
    page that visitors can make an informed decision about its relevance. Google''s
    SERP in FIGURE 3.26 is an excellent example (and probably the one that came to
    mind when you read this description); shows the page title, relevance, and URL
    of each resulting page.


    FIGURE 3.26 Search Engine Results Page ((google.com))


    ![](img/ee113e5612d290709e494a0dae247fc5_124_0.png)


    The <title> tag from the page face dictates the clickable headline that displays
    on the result, and it''s the very thing the search sees. Because of this, we should
    format page titles that are both accurate and enticing. But that''s another topic
    for another.'
  merge: -1
