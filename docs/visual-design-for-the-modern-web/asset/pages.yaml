    # Manipulate visual balance.


    Visual balance refers to the placement of items on a page. Symmetrical balance,
    in which similar elements are placed equally on both sides of a center line, provides
    balance by default, as in FIGURE 4.21. Symmetrical balance can be mind-numbingly
    boring: centered heading, centered photo, centered text block. However, it doesn''t
    have to be, you can insert "excitement" into this rigid structure. For example,
    in the case of Figure 4.21, symmetrical balance works well because the page uses
    texture, graphics, and other variations to provide visual "relief."


    We can achieve an exciting and dynamic visual balance with asymmetrical balance,
    as shown in FIGURE 4.22. For instance, a large, heavy graphic on one side of the
    page might be balanced by smaller graphics on the other side. The design in Figure
    4.22 brings the large block of text in the lower left with the smaller but more
    dramatic skyline on the right.


    To create a feeling of tension and unrest, you might perhaps make a page obviously
    unbalanced, as in FIGURE 4.23. The page in this case, unbalanced weights works
    well because it gives the page a very modern, feel.'
