  md: 'All sites allow search by topic, such as "eagle" or "happy." Some sites filter
    ing a search by color as well, so that a search for "happy" and "orange" would
    turn up predominantly orange pictures that embody the concept of happy.


    If we want to stay out of trouble with the U.S. Copyright Office, we simply cannot
    use images "borrowed" from other web sites. Unless a specifically gives permission
    to use an image, assume that we cannot use it. Even if the site claims the images
    are copyright-free or royalty-free, be sure to read the licensing agreement for
    any fine print that might cause legal problems.


    # BONUS TOPIC


    See Resources on the book''s web site for stock photos, clip art, screen capture
    utilities, and more.


    # Screen Capture Utilities


    Sometimes we need to capture a computer screen and embed it on a web page. Screen
    capture utilities are perfect for that task, providing the ability to capture
    pictures on an entire display, an entire window, or just a portion of a window.
    Some of these utilities are built into the operating system; others are easily
    obtainable.


    # Scanners


    Scanners are the obvious tool for capturing images or text from printed pages,
    but they can also capture images from photographic negatives as well as images
    of relatively flat, real-life objects. For instance, autumn leaves arranged on
    a scanner bed can result in a stunning photographic effect. Don''t be afraid to
    think outside the box for creative ways to use a scanner.


    # Types of Scanners


    In the last few years, flatbed scanners (for scanning flat materials as photographs
    or printed pages) have improved dramatically in accuracy while decreasing dramatically
    in price. Some flatbed scanners for less than $100 today.


    # SCANNING AN IMAGE FROM A PRINTED PAGE


    If an original image was scanned from a commercially printed page, a moiré pattern
    from the original dots can degrade the resulting scanned image. Our method to
    reduce the impact of the moiré is as follows:


    +   1. Blur the entire image slightly.


    +   2. Reduce the size of the image slightly.


    +   3. Use a "sharpen" command to restore some of the sharpness lost by the blur
    of the first step.'
