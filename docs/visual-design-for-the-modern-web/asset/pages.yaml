  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   Open each external link in the same "new window." That is, you open a new
    window the first time a visitor clicks an external link but then on continue to
    reuse that same window for all future external page requests. You thereby avoid
    cluttering the screen with a multitude of windows. Assign the same target name
