- img_proc: true
  md: '# CHAPTER TWO Site Analysis 55


    An ironic reality of site architecture is that the simpler, the more obvious,
    and the more elegant the site navigation appears to the visitor, the messier,
    more complicated, less obvious, and more difficult the site architecture probably
    was to construct. Essentially, our purpose as designers is to absorb complexity
    and render it so that visitors don''t see or feel it. We expend huge amounts of
    effort, skill, understanding of human needs, and (don''t forget) common sense
    to transform complexity into apparent simplicity, all in order to deliver the
    service back to our visitors. The more straightforward navigation is for the user,
    the more work it probably took us to craft.


    Let''s begin the whole process looking first at how we go about labeling and logically
    categorizing the content on our site, just as a library categorizes its books
    by topic.


    # Labeling


    Ever since humans invented language, they have been labeling as a way of organizing
    and understanding their world. It''s something we do naturally. That said, it''s
    not something we always do well. The more thought we put into the labels and the
    more we consider how visitors will interpret them, the more straightforward the
    site will be for our visitors to navigate.


    Labeling for a web site includes not only obvious navigational labels, such as
    links on menus, but also page titles, headers, and keywords for searching and
    browsing. All of these labels are components in the site architecture, and all
    of them help the user to find what he or she is seeking. Think of web labeling
    as analogous to creating an index and a table of contents for a book.


    The words that comprise labels are often ambiguous, and that ambiguity is further
    exacerbated by the need for brevity on web-based labels. In a conversation, we
    augment our words with gesture, facial expression, or tone of voice; we gauge
    our understanding by interpreting the other person''s facial expression; or our
    conversation partner asks us to clarify what we mean. None of this normal conversational
    interaction is available to a web visitor. Consequently, web site labels must
    be clearer and less ambiguous than our everyday spoken language if they are to
    be truly useful.


    Devising labels is a process of doing a content inventory and brainstorming for
    every possible label we can imagine. To come up with an initial list of labels,
    we can:


    +   - Extract meaningful labels from the content for the site, especially from
    headers and subheaders.

    - Peruse competitors'' sites for ideas.'
