  md: '# VISUAL DESIGN FOR THE MODERN WEB


    +   Don’t label "Click here." A throwback from the early days of the web, "Click
    here" adds nothing to a visitor’s understanding and therefore still requires an
    adjacent description of some sort. Instead, just make the description of the link
    "clickable":


    Unacceptable: Click here for Bob’s Bicycles, which offers racing bikes at discount
    prices.


    Acceptable: Bob’s Bicycles offers racing bikes at discount prices.


    +   If the labels need further elaboration, the title attribute of the <a> tag
    can provide a longer rollover description that’s visible in newer browsers.


    # Affordances for Text Links


    Virtually all users recognize an affordance and the standard link colors as the
    most common text affordances. Usability experts often claim that we shouldn’t
    muckle around with these affordances, doing so interferes with the visual cues
    that users have to expect. After, making our pages user-friendly is more important
    than making them color-coordinated.


    Still, these days web surfers are much more sophisticated than they were a few
    days ago. They seem to recognize several text-link affordances, including the
    following:


    **Underline.** Today we have multiple underline options. The underline itself
    can be:


    +   - Always present, for all link states.

    - Visible on the link at rest, but disappears on rollover.

    - Visible on rollover, but disappears on the link at rest.

    - Removed entirely, with links indicated by other affordances such as color and
    styling changes.


    **Style change.** Links may be indicated with boldface, italic, or a different
    typeface.


    **Text or background color change.** Everyone is familiar with the default link
    colors of blue, red, and purple. Unfortunately, these don’t show up well on dark
    page backgrounds, and they certainly clash with many color schemes. For instance,
    standard link colors would look positively garnish on a page of subtle brown and
    gold earth tones.


    As long as you provide at least one recognizable affordance, you don’t necessarily
    to provide all of them. But whatever text link affordances you choose, avoid using
    those same affordance characteristics for elements that aren’t intended to be
    links.'
