    ![](img/ee113e5612d290709e494a0dae247fc5_204_0.png)


    # HEXAGON PALETTE


    In the hexagon, or hexagonal, palette color codes are abbreviated with a single
    digit representing each pair of digits. An axis for each of the three primary
    and secondary RGB colors radiates out from the pure white in the center to one
    of the points of the hexagon on the outside edge. Each axis is terminated on the
    outside border with an extra color chip showing the color that “governs” that
    axis, so it''s easy to find the appropriate axis. For instance, locate the blue
    chip at the bottom, and follow it upward. First, consider the shades of blue on
    the outside, then primary blue around the middle, tints of blue toward the center,
    and finally, white in the dead center. *Tones* are in the outside diamonds that
    span each axis.


    The hexagon palette image is available for download from the book''s web site.'
