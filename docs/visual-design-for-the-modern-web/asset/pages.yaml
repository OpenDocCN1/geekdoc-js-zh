  md: '# Mixing Colors Manually


    As we''ve seen, palettes are a convenience, but they don''t come close to tapping
    the power of the 16.8 million colors available to us. For that, we need to mix
    colors manually. For each of the color types we''re about to discuss, we''ll look
    at three mixing techniques:


    +   - Manipulating the RGB color code mathematically (a whole new spin on "paint-by-number")

    - Using a color gradient (a gradual blend from one color to another)

    - Using a semi-transparent color overlay.


    As we manipulate the color codes, that #FFFFFF is #000000 is black. It makes sense,
    then, to make a color lighter in value, we "add" white; that is, the digits in
    the code larger, approaching #FFFFFF. Looking at #CAFO6, we might guess that it
    is a fairly light tint.


    To make a color darker, we "add" black; the numbers get smaller until they approach
    #000000 (again, the code for black). Thus, #302A1A is a fairly dark color. The
    fastest way to use the mathematical technique is to use a standard palette that
    is close to what you ultimately want, and then go on to tweak the color mathematically
    to end up with precisely the one you need.


    # Mixing Neutrals


    True neutrals are white, black, and variations of gray, and have RGB color codes
    that are composed of three equal hex pairs, as shown in FIGURE 5.21. Any color
    code that consists of three equal pairs, as as #D3D3D3 or #999999, produces some
    version of gray on the screen.


    FIGURE 5.21 Mixing Grays Mathematically


    ![](img/ee113e5612d290709e494a0dae247fc5_206_0.png)


    The higher the numbers in the code, the lighter the gray, as we have seen, the
    code is approaching the code for white. Conversely, the lower the numbers, the
    darker the gray. Thus, a color code of #CACACA is a much lighter gray than #AF4F4F4.


    We can also use a graphics package to create a shape and fill it with a gradient
    that shades from white on one side to black on the other, resulting in an infinite
    spectrum of gray along the gradient. FIGURE 5.22 shows such a gradient. Use the
    eye-dropper/color picker tool of an image-editing package to select a color from
    along'
