  md: '# Summary


    Color is powerful, evoking mood and ambiance instantly. Color on the web is cheaper
    to use than printed color, although there are myriad difficulties we must cope
    with our web pages are to display. Nonetheless, working with color can be one
    of the more creative and satisfying aspects of designing a user interface.


    Don''t be afraid to play with color. After all, colors on digital media can be
    changed on a whim if you don''t like them. Use color in unexpected ways and you
    might just get unexpected results. We leave this chapter with “thinking outside
    of the box” inspiration in the form of a Xerox ad, FIGURE 5.43.


    ![](img/ee113e5612d290709e494a0dae247fc5_231_0.png)


    > FIGURE 5.43 Creative Use of Color(©2007 Xerox Corporation. All rights reserved.
    Xerox®, Phaser Work Centre®, and Xerox Color, It Makes Business Sense are trademarks
    of Xerox Corporation in the United States and/or countries.)


    Who makes color for just pennies a page? Who has tracking software to ensure more
    efficient color usage? Who guarantees total color satisfaction? Who know him,
    Xerox Color. It makes business sense.


    | Technology | Document Management | Consulting Services |

    |---|---|---|


    # Design Checklist


    The following checklist serves two functions: to summarize the major points and
    “rules” presented in the chapter, and to help ensure you''ve done all you should
    before finalizing any web site you are creating.


    Did you:


    +   Choose an appropriate and appealing color scheme for your identified audience,
    providing the mood and ambiance that you intended? Be sure to consider factors
    such as age, gender, and culture.'
