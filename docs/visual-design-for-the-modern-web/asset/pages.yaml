    \n![](img/ee113e5612d290709e494a0dae247fc5_161_0.png)\n\nAnother factor influencing\
    \ the serene look of the second house is that the edges of\nt various rectangle\
    \ elements align with each other whenever possible. Second-story\n and attic align\
