  md: "**CHAPTER SEVEN** Typography** 289**\n\nMost typefaces were originally designed\
    \ for print media and are therefore not \n\noptimized for the low resolution of\
    \ a computer display. To remedy this, Microsoft \n\nhired famed type designer\
    \ Matthew Carter to create the faces Georgia (serif) and \n\nVerdana (sans serif)\
    \ speciﬁ cally for optimal screen display. The process took Carter \n\ntwo years\
    \ but was well worth the effort. The characters of these fonts have better \n\n\
    *hinting*; that is, larger and more uniform inter-character spacing, which does\
    \ indeed \n\nimprove legibility on the screen. We would be well advised to use\
    \ one of these two \n\ntypefaces on most body copy.\n\nTypographers have long\
    \ argued that printed body copy is more legible in a serif \n\ntypeface, because\
    \ the serifs provide quickly perceived cues to letter shape. In con-\n\ntrast,\
    \ sans serif typefaces might be more legible on a monitor, because the resolu-\n\
    \ntion of monitors is so low that the serifs cannot be shown clearly—they tend\
    \ to \n\nbleed together. But, of course, the key word here is *argued*—this debate\
    \ is likely to \n\ngo on indeﬁ nitely, and at least one study has shown that sans\
    \ serif typefaces signiﬁ -\n\ncantly improve onscreen readability *only* in sizes\
    \ smaller than 12-point type. \n\n**THE DEBATE CONTINUES**\n\nFor further (albeit\
    \ non-definitive) argument on the subject of different typefaces on \n\nthe web,\
    \ see various articles at http://psychology.wichita.edu/surl.\n\nHTML Font Sizes\n\
    \nHTML uses a scale of 1 to 7 for font sizes, with 1 being the smallest, 3 being\
    \ the default \n\nsize, and 7 being the largest. Despite what appear to be common\
    \ size designators, dif-\n\nferent operating systems may well use a different\
    \ number of pixels to build the fonts \n\nat each size. **TABLE 7.1** explains\
    \ Windows versus Mac OS differences in this respect. \n\nTABLE 7.1 DEFAULT FONT\
    \ SIZE IN WINDOWS VERSUS MAC\n\n \n\nAssumed Text Resolution \n\nDefault Text\
    \ Size (size=“3”)\n\nWindows \n\n96 pixels per inch \n\n16 pixels high (1/6 of\
    \ an inch)\n\nMac OS \n\n72 pixels per inch \n\n12 pixels high (1/6 of an inch)\n\
    \nFont size is speciﬁ ed in HTML with the <font size=”n”> tag. Since the <font>\
    \ tag is \n\ndeprecated, we will use only CSS font sizing in this discussion.\
    \ With CSS, we can use \n\neither absolute or relative text sizing."
