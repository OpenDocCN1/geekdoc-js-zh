  md: '# Align elements.


    As much as possible, line up the outside edges of the various page elements. For
    instance, FIGURE 4.14 shows three versions of an HTML form. The elements on Figure
    4.14A don''t line up at all; as a result, the form is visually confusing and amateurish.
    Figure 4.14B aligns the left side of both columns of elements, and it looks much
    more serene. Figure 4.14 is controversial; many experts state that you shouldn''t
    combine both right justification (on the labels) and left justification (on the
    form fields) on the same page. Nonetheless, it looks much calmer than the first
    example, and arguably even calmer than the second example. Moreover, the proximity
    of the labels to the input areas makes it easier to see how each label relates
    to a form element. In any case, you can align elements on the layout, following
