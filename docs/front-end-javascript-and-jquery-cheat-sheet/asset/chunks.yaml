    \ `new` 的 div 包裹每个类名为 `inner` 的 div 的内容：\n\n```\n$(\".inner\").wrapInner(\"<div\
    \ class='new'></div>\");\n```\n\n# 结论\n\nJavaScript 是世界上最流行的编程语言之一。要有效地使用它，我们需要了解它的基础知识。\n\
    \n它拥有任何语言的所有基本特性。\n\n它也是网络的语言。\n\n我们可以使用 jQuery 操作 DOM、发起 Ajax 请求等。\n\n"
