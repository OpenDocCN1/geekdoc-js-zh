  trans: "\n\n## `.scrollTop()`\n\n`.scrollTop()` 方法获取匹配元素集合中第一个元素的滚动条当前垂直位置，或设置每个匹配元素的滚动条垂直位置。\n\
    \n例如，如果我们有以下代码：\n\n```\n<p>Hello</p>\n<p></p>\n```\n\n那么我们可以通过以下代码获取滚动条的垂直位置：\n\
    \n```\nconst p = $(\"p\").first();\n$(\"p\").last().text(p.scrollTop());\n```\n\
    \n## `.select()`\n\n`.select()` 方法为 select JavaScript 事件绑定一个事件处理函数。\n\n我们也可以用它来触发元素上的事件。\n\
    \n例如，如果我们有以下代码：\n\n```\n<form>\n  <input id=\"target\" type=\"text\" value=\"\
    Hello there\">\n</form>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\
    \n我们可以通过以下代码监听输入框上触发的 select 事件：\n\n```\n$(\"#target\").select(function() {\n\
    \  console.log(\"Handler for .select() called.\");\n});\n```\n\n此外，我们还可以在点击 ID\
    \ 为 `other` 的 div 时触发输入框的 select 事件：\n\n```\n$(\"#target\").select(function()\
    \ {\n  console.log(\"Handler for .select() called.\");\n});\n$(\"#other\").click(function()\
    \ {\n  $(\"#target\").select();\n});\n```\n\n## `:selected` 选择器\n\n`:selected`\
    \ 选择器允许我们选择所有被选中的元素。\n\n例如，如果我们有以下代码：\n\n```\n<select name=\"garden\" multiple=\"\
    multiple\">\n  <option>Flowers</option>\n  <option selected=\"selected\">Shrubs</option>\n\
    \  <option>Trees</option>\n  <option selected=\"selected\">Bushes</option>\n \
    \ <option>Grass</option>\n  <option>Dirt</option>\n</select>\n<div></div>\n```\n\
    \n那么我们可以通过以下代码监听 `select` 元素上的 `select` 事件：\n\n```\n$(\"select\")\n  .change(function()\
    \ {\n    let str = \"\";\n    $(\"select option:selected\").each(function() {\n\
    \      str += $(this).text();\n    });\n    $(\"div\").text(str);\n  })\n  .trigger(\"\
    change\");\n```\n\n我们在 `change` 回调中获取所有选中的项，并将它们放入 div 中。\n\n## `.serialize()`\n\
    \n我们可以使用 `.serialize()` 方法将表单的值转换为键值对。\n\n例如，如果我们有以下代码：\n\n```\n<form>\n  <select\
    \ name=\"single\">\n    <option>Single</option>\n    <option>Single2</option>\n\
    \  </select>\n  <br>\n  <select name=\"multiple\" multiple=\"multiple\">\n   \
    \ <option selected=\"selected\">Multiple</option>\n    <option>Multiple2</option>\n\
    \    <option selected=\"selected\">Multiple3</option>\n  </select>\n  <br>\n \
    \ <input type=\"checkbox\" name=\"check\" value=\"check1\" id=\"ch1\">\n  <label\
    \ for=\"ch1\">check1</label>\n  <input type=\"checkbox\" name=\"check\" value=\"\
    check2\" checked=\"checked\" id=\"ch2\">\n  <label for=\"ch2\">check2</label>\n\
    \  <br>\n  <input type=\"radio\" name=\"radio\" value=\"radio1\" checked=\"checked\"\
    \ id=\"r1\">\n  <label for=\"r1\">radio1</label>\n  <input type=\"radio\" name=\"\
    radio\" value=\"radio2\" id=\"r2\">\n  <label for=\"r2\">radio2</label>\n</form>\n\
    ```\n\n那么我们可以通过以下代码在控件值改变时记录表单的值：\n\n```\nconst showValues = () => {\n  const\
    \ str = $(\"form\").serialize();\n  console.log(str);\n}\n$(\"input[type='checkbox'],\
    \ input[type='radio']\").on(\"click\", showValues);\n$(\"select\").on(\"change\"\
    , showValues);\nshowValues();\n```\n\n我们监听点击和 change 事件，并在表单发生任何操作时调用 `showValues`\
    \ 方法。\n\n那么 `str` 的值类似于：\n\n```\nsingle=Single&multiple=Multiple&multiple=Multiple3&check=check2&radio=radio1\n\
    ```\n\n## `.serializeArray()`\n\n我们可以调用 `serializeArray` 将一组表单元素编码为名称和值的数组。\n\n\
    例如，如果我们有以下代码：\n\n```\n<form>\n  <div><input type=\"text\" name=\"a\" value=\"\
    1\" id=\"a\"></div>\n  <div><input type=\"text\" name=\"b\" value=\"2\" id=\"\
    b\"></div>\n  <div><input type=\"hidden\" name=\"c\" value=\"3\" id=\"c\"></div>\n\
    \  <div>\n    <textarea name=\"d\" rows=\"8\" cols=\"40\">4</textarea>\n  </div>\n\
    \  <div><select name=\"e\">\n      <option value=\"5\" selected=\"selected\">5</option>\n\
    \      <option value=\"6\">6</option>\n      <option value=\"7\">7</option>\n\
    \    </select></div>\n  <div>\n    <input type=\"checkbox\" name=\"f\" value=\"\
    8\" id=\"f\">\n  </div>\n  <div>\n    <input type=\"submit\" name=\"g\" value=\"\
    Submit\" id=\"g\">\n  </div>\n</form>\n```\n\n那么我们可以通过以下代码将表单值序列化为对象数组：\n\n```\n\
    $(\"form\").submit(function(event) {\n  console.log($(this).serializeArray());\n\
    \  event.preventDefault();\n});\n```\n\n当我们点击 Submit 时，会得到类似以下的内容：\n\n```\n[\n\
    \  {\n    \"name\": \"a\",\n    \"value\": \"1\"\n  },\n  {\n    \"name\": \"\
    b\",\n    \"value\": \"2\"\n  },\n  {\n    \"name\": \"c\",\n    \"value\": \"\
    3\"\n  },\n  {\n    \"name\": \"d\",\n    \"value\": \"4\"\n  },\n  {\n    \"\
    name\": \"e\",\n    \"value\": \"5\"\n  }\n]\n```\n\n被记录。\n\n## `.show()`\n\n\
    `show` 方法显示匹配的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<div id=\"clickme\">\n  Click here\n\
    </div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\n以及 CSS：\n\n```\nimg {\n  display: none;\n}\n```\n\n那么我们可以通过以下代码在点击“Click\
    \ here”时调用 `show` 方法显示图片：\n\n```\n$(\"#clickme\").click(function() {\n  $(\"#book\"\
    ).show(\"slow\", function() {\n    // Animation complete.\n  });\n});\n```\n\n\
    ## `.siblings()`\n\n`siblings` 方法允许我们获取匹配元素集合中每个元素的兄弟元素。\n\n我们可以选择性地向该方法传递一个选择器。\n\
    \n例如，如果我们有以下代码：\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n\
    \  <li class=\"third-item\">list item 3</li>\n  <li>list item 4</li>\n  <li>list\
    \ item 5</li>\n</ul>\n```\n\n那么我们可以获取所有与 class 为 `third-item` 的 li 元素是兄弟关系的 li\
    \ 元素，并为其添加背景色：\n\n```\n$(\"li.third-item\").siblings().css(\"background-color\"\
    , \"red\");\n```\n\n## `.slice()`\n\n`slice` 方法允许我们将匹配的元素集合缩减为索引范围指定的子集。\n\n例如，如果我们有以下代码：\n\
    \n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n  <li>list item 3</li>\n\
    \  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\n那么我们可以通过以下代码获取从索引\
    \ 2 开始到索引 4（不包括 4）的 li 元素：\n\n```\n$(\"li\").slice(2, 4).css(\"background-color\"\
    , \"red\");\n```\n\n## `.slideDown()`\n\n`.slideDown()` 方法以滑动动画显示匹配的元素。\n\n例如，如果我们有以下\
    \ HTML：\n\n```\n<div id=\"clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"\
    https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\n以及 CSS：\n\n```\nimg {\n  display: none;\n}\n```\n\n那么我们可以通过以下代码在点击“Click\
    \ here”时以向下滑动动画显示图片：\n\n```\n$( \"#clickme\" ).click(function() {\n  $( \"#book\"\
    \ ).slideDown( \"slow\", function() {\n    // Animation complete.\n  });\n});\n\
    ```\n\n## `.slideToggle()`\n\n`.slideToggle()` 方法允许我们以滑动动画显示或隐藏匹配的元素。\n\n例如，如果我们有以下\
    \ HTML：\n\n```\n<div id=\"clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"\
    https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\n以及 CSS：\n\n```\nimg {\n  display: none;\n}\n```\n\n那么我们可以通过以下代码在点击“Click\
    \ here”时以滑动动画切换图片的显示状态：\n\n```\n$( \"#clickme\" ).click(function() {\n  $( \"\
    #book\" ).slideToggle( \"slow\", function() {\n    // Animation complete.\n  });\n\
    });\n```\n\n## `.slideUp()`\n\n`.slideUp()` 方法以滑动动画隐藏匹配的元素。\n\n例如，如果我们有以下 HTML：\n\
    \n```\n<div id=\"clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\n那么我们可以通过以下代码在点击“Click here”时以向上滑动动画隐藏图片：\n\n```\n$( \"#clickme\" ).click(function()\
    \ {\n  $( \"#book\" ).slideUp( \"slow\", function() {\n    // Animation complete.\n\
    \  });\n});\n```\n\n"
- fmt: "\n## .stop()\n\nThe `stop` method stops the currently running animation on\
    \ the matched elements.\n\nFor example, if we have:\n\n```\n<div id=\"hoverme\"\
    >\n  Hover me\n  <img id=\"hoverme\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n</div>\n```\n\nThen we can stop the animation on the matched element by writing:\n\
    \n```\n$(\"#hoverme\").hover(function() {\n  $(this).find(\"img\").stop(true,\
    \ true).fadeOut();\n}, function() {\n  $(this).find(\"img\").stop(true, true).fadeIn();\n\
    });\n```\n\nWhen we hover over the img with ID `hover`, then we fade out the image.\
    \ Otherwise, we fade in the image.\n\n## .submit()\n\nThe `.submit()` method lets\
    \ us bind an event handler to the `submit` JavaScript event or trigger the event\
    \ on an element.\n\nFor example, if we have:\n\n```\n<form id=\"target\" action=\"\
    destination.html\">\n  <input type=\"text\" value=\"Hello there\">\n  <input type=\"\
    submit\" value=\"Go\">\n</form>\n<div id=\"other\">\n  Trigger the handler\n</div>\n\
    ```\n\nThen we can listen to the `submit` event on the form by writing:\n\n```\n\
    $(\"#target\").submit(function(event) {\n  console.log(\"Handler for .submit()\
    \ called.\");\n  event.preventDefault();\n});\n```\n\nWe can also trigger the\
    \ submit event by writing:\n\n```\n$(\"#other\").click(function() {\n  $(\"#target\"\
    ).submit();\n});\n```\n\n## :submit Selector\n\nThe `:submit` selector lets us\
    \ select all elements of type submit.\n\nFor example, if we have:\n\n```\n<form\
    \ id=\"target\" action=\"destination.html\">\n  <input type=\"text\" value=\"\
    Hello there\">\n  <input type=\"submit\" value=\"Go\">\n</form>\n```\n\nThen we\
    \ can add a background and border on the submit button by writing:\n\n```\n$(\"\
    input:submit\")\n  .css({\n    background: \"yellow\",\n    border: \"3px red\
    \ solid\"\n  })\n  .end();\n```\n\n## :target Selector\n\nThe `:target` selector\
    \ selects the target element indicated by the fragment identifier of the document’s\
    \ URI.\n\nFor example, if we go to [https://example.com/#foo](https://medium.com/r/?url=https%3A%2F%2Fexample.com%2F%23foo),\
    \ then, `$(\"p:target\")` selects the `p` element with ID `foo`.\n\n## .text()\n\
    \nThe `.text()` method gets the combined text contents of each element in the\
    \ set of matched elements, including their descendants.\n\nFor example, if we\
    \ have:\n\n```\n<p><b>Test</b> Paragraph.</p>\n<p></p>\n```\n\nThen if we write:\n\
    \n```\nconsole.log($(\"p\").first().text())\n```\n\nWe get `'Test Paragraph.'`\
    \ logged.\n\n## :text Selector\n\nThe `:text` selector lets us select all input\
    \ elements of type `text`.\n\nFor example, if we have:\n\n```\n<form id=\"target\"\
    \ action=\"destination.html\">\n  <input type=\"text\" value=\"Hello there\">\n\
    \  <input type=\"submit\" value=\"Go\">\n</form>\n<div id=\"other\">\n  Trigger\
    \ the handler\n</div>\n```\n\nThen we can add a background and border to the text\
    \ input box by writing:\n\n```\n$(\"form input:text\").css({\n  background: \"\
    yellow\",\n  border: \"3px red solid\"\n});\n```\n\n## .toArray()\n\nThe `.toArray()`\
    \ method retrieves all elements contained in the jQuery set as an array.\n\nFor\
    \ example, if we have:\n\n```\n<div>One</div>\n<div>Two</div>\n<div>Three</div>\n\
    ```\n\nThen we can get the divs and put them into an array by writing:\n\n```\n\
    console.log($(\"div\").toArray());\n```\n\n## .toggle()\n\nThe `.toggle()` method\
    \ displays or hide the matched elements.\n\nFor example, if we have:\n\n```\n\
    <div id=\"clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nThen we can make the image toggle between on and off when we click the\
    \ Click here button by writing:\n\n```\n$(\"#clickme\").click(function() {\n \
    \ $(\"#book\").toggle(\"slow\", function() {\n    // Animation complete.\n  });\n\
    });\n```\n\n## .toggleClass()\n\nThe `.toggleClass()` method lets us add or remove\
    \ one or more classes from each element in the set of matched elements.\n\nFor\
    \ example, if we have the following HTML:\n\n```\n<p class=\"blue\">Click to toggle</p>\n\
    ```\n\nAnd CSS:\n\n```\np {\n  margin: 4px;\n  font-size: 16px;\n  font-weight:\
    \ bolder;\n  cursor: pointer;\n}\n.blue {\n  color: blue;\n}\n.highlight {\n \
    \ background: yellow;\n}\n```\n\nThen we can toggle the `highlight` class on the\
    \ `p` element by writing:\n\n```\n$(\"p\").click(function() {\n  $(this).toggleClass(\"\
    highlight\");\n});\n```\n\n## .trigger()\n\nThe `.trigger()` method runs all handlers\
    \ and behaviors attached to the matched elements for the given event type.\n\n\
    For example, if we have:\n\n```\n<button>Button #1</button>\n<button>Button #2</button>\n\
    ```\n\nThen we can trigger the click on the first button when we click on the\
    \ second button by writing:\n\n```\n$(\"button\").first().click(function() {\n\
    \  console.log('first button clicked');\n});\n$(\"button\").last().click(function()\
    \ {\n  $(\"button\").first().trigger(\"click\");\n});\n```\n\n## .triggerHandler()\n\
    \nThe `.triggerHandler()` method lets us run all handlers attached to an event\
    \ for an element.\n\nFor example, if we have:\n\n```\n<button id=\"new\">.triggerHandler(\
    \ \"focus\" )</button><br><br>\n<input type=\"text\" value=\"To Be Focused\">\n\
    ```\n\nThen we can trigger the `focus` event when we click on the button by writing:\n\
    \n```\n$(\"#new\").click(function() {\n  $(\"input\").triggerHandler(\"focus\"\
    );\n});\n$(\"input\").focus(function() {\n  $(\"<span>Focused!</span>\").appendTo(\"\
    body\").fadeOut(1000);\n});\n```\n\nWe show the `Focused!` text when we click\
    \ on the button as the input is focused.\n\n## .unbind()\n\nThe `.unbind()` method\
    \ removes a previous attached event handler from the elements.\n\nFor example,\
    \ if we have:\n\n```\n<button id=\"bind\">Bind Click</button>\n<button id=\"unbind\"\
    >Unbind Click</button>\n<div id=\"theone\"></div>\n```\n\nThen we can bind and\
    \ unbind the click handler for the div with id `theone` by writing:\n\n```\nfunction\
    \ aClick() {\n  $(\"div\").show().fadeOut(\"slow\");\n}\n$(\"#bind\").click(function()\
    \ {\n  $(\"#theone\")\n    .bind(\"click\", aClick)\n    .text(\"Can Click!\"\
    );\n});\n$(\"#unbind\").click(function() {\n  $(\"#theone\")\n    .unbind(\"click\"\
    , aClick)\n    .text(\"Does nothing...\");\n});\n```\n\nWe bind and unbind the\
    \ click events on the div in the `click` handlers for the buttons.\n\n## .undelegate()\n\
    \nThe `.undelegate()` method removes a handler from the event for all elements\
    \ which match the current selector based on the root element.\n\nFor example,\
    \ if we have:\n\n```\n<button id=\"bind\">Bind Click</button>\n<button id=\"unbind\"\
    >Unbind Click</button>\n<div id=\"theone\"></div>\n```\n\nThen we can bind and\
    \ unbind the `click` handler from the div with ID `theone` by writing:\n\n```\n\
    function aClick() {\n  $(\"div\").show().fadeOut(\"slow\");\n}\n$(\"#bind\").click(function()\
    \ {\n  $(\"body\")\n    .delegate(\"#theone\", \"click\", aClick)\n    .find(\"\
    #theone\")\n    .text(\"Can Click!\");\n});\n$(\"#unbind\").click(function() {\n\
    \  $(\"body\")\n    .undelegate(\"#theone\", \"click\", aClick)\n    .find(\"\
    #theone\")\n    .text(\"Does nothing...\");\n});\n```\n\n## .unwrap()\n\nThe `.unwrap()`\
    \ method removes the parent of the set of matched elements from the DOM.\n\nFor\
    \ example, if we have:\n\n```\n<button>wrap/unwrap</button>\n<p>Hello</p>\n<p>World</p>\n\
    ```\n\nWe can toggle the wrapping and unwrapping of the div around the `p` elements\
    \ by writing:\n\n```\nconst pTags = $(\"p\");\n$(\"button\").click(function()\
    \ {\n  if (pTags.parent().is(\"div\")) {\n    pTags.unwrap();\n  } else {\n  \
    \  pTags.wrap(\"<div></div>\");\n  }\n})\n```\n\n`wrap` all wrap each `p` element\
    \ in its own div.\n\n## .val()\n\nThe `.val()` method gets the current value of\
    \ the first element in the set of matched elements. We can also use it to set\
    \ the value of every matched element.\n\nFor example, if we have:\n\n```\n<select\
    \ id=\"single\">\n  <option>Single</option>\n  <option>Single2</option>\n</select>\n\
    <select id=\"multiple\" multiple=\"multiple\">\n  <option selected=\"selected\"\
    >Multiple</option>\n  <option>Multiple2</option>\n  <option selected=\"selected\"\
    >Multiple3</option>\n</select>\n```\n\nThen we can get the value selected from\
    \ the `select` element by writing:\n\n```\nfunction displayVals() {\n  const singleValues\
    \ = $(\"#single\").val();\n```\n"
