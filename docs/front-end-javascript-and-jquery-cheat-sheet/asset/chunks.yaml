    );\n```\n\n`push` adds elements to the end of the array.\n\nTo remove the first\
    \ element of an array, we can `shift` :\n\n```\nanimals.shift();\n```\n\nTo add\
    \ one more elements to the beginning of an array, we call `unshift` :\n\n```\n\
    animals.shift(\"fish\", \"bird\");\n```\n\nThe `splice` method insert one or more\
    \ elements anywhere in the array:"
