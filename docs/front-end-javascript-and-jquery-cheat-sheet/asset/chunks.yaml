    img\").stop(true, true).fadeIn();\n});\n```\n\n当鼠标悬停在 ID 为 `hover` 的 img 上时，图片淡出；否则图片淡入。\n\
    \n## .submit()\n\n`.submit()` 方法允许我们为 `submit` JavaScript 事件绑定事件处理程序，或在元素上触发该事件。\n\
    \n例如，如果我们有以下代码：\n\n```\n<form id=\"target\" action=\"destination.html\">\n  <input\
    \ type=\"text\" value=\"Hello there\">\n  <input type=\"submit\" value=\"Go\"\
    >\n</form>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\n那么我们可以通过以下代码监听表单的\
    \ `submit` 事件：\n\n```\n$(\"#target\").submit(function(event) {\n  console.log(\"\
    Handler for .submit() called.\");\n  event.preventDefault();\n});\n```\n\n我们也可以通过以下代码触发\
    \ submit 事件：\n\n```\n$(\"#other\").click(function() {\n  $(\"#target\").submit();\n\
    });\n```\n\n## :submit 选择器\n\n`:submit` 选择器允许我们选择所有类型为 submit 的元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<form id=\"target\" action=\"destination.html\">\n  <input type=\"text\"\
    \ value=\"Hello there\">\n  <input type=\"submit\" value=\"Go\">\n</form>\n```\n\
    \n那么我们可以通过以下代码为提交按钮添加背景和边框：\n\n```\n$(\"input:submit\")\n  .css({\n    background:\
    \ \"yellow\",\n    border: \"3px red solid\"\n  })\n  .end();\n```\n\n## :target\
    \ 选择器\n\n`:target` 选择器用于选择文档 URI 的片段标识符所指示的目标元素。\n\n例如，如果我们访问 [`example.com/#foo`](https://medium.com/r/?url=https%3A%2F%2Fexample.com%2F%23foo)，那么\
    \ `$(\"p:target\")` 会选择 ID 为 `foo` 的 `p` 元素。\n\n## .text()\n\n`.text()` 方法获取匹配元素集合中每个元素（包括其后代）的合并文本内容。\n\
    \n例如，如果我们有以下代码：\n\n```\n<p><b>Test</b> Paragraph.</p>\n<p></p>\n```\n\n那么如果我们编写：\n\
    \n```\nconsole.log($(\"p\").first().text())\n```\n\n控制台会输出 `'Test Paragraph.'`。\n\
    \n## :text 选择器\n\n`:text` 选择器允许我们选择所有类型为 `text` 的 input 元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<form id=\"target\" action=\"destination.html\">\n  <input type=\"text\"\
    \ value=\"Hello there\">\n  <input type=\"submit\" value=\"Go\">\n</form>\n<div\
    \ id=\"other\">\n  Trigger the handler\n</div>\n```\n\n那么我们可以通过以下代码为文本输入框添加背景和边框：\n\
    \n```\n$(\"form input:text\").css({\n  background: \"yellow\",\n  border: \"3px\
    \ red solid\"\n});\n```\n\n## .toArray()\n\n`.toArray()` 方法将 jQuery 集合中包含的所有元素以数组形式返回。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div>One</div>\n<div>Two</div>\n<div>Three</div>\n```\n\
    \n那么我们可以通过以下代码获取 div 并将其放入数组：\n\n```\nconsole.log($(\"div\").toArray());\n```\n\
    \n## .toggle()\n\n`.toggle()` 方法用于显示或隐藏匹配的元素。\n\n例如，如果我们有以下代码：\n\n```\n<div id=\"\
    clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\n那么我们可以通过以下代码在点击“Click here”按钮时让图片在显示和隐藏之间切换：\n\n```\n$(\"#clickme\"\
    ).click(function() {\n  $(\"#book\").toggle(\"slow\", function() {\n    // Animation\
    \ complete.\n  });\n});\n```\n\n## .toggleClass()\n\n`.toggleClass()` 方法允许我们在匹配元素集合中的每个元素上添加或删除一个或多个类。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<p class=\"blue\">Click to toggle</p>\n```\n\n以及 CSS：\n\
    \n```\np {\n  margin: 4px;\n  font-size: 16px;\n  font-weight: bolder;\n  cursor:\
    \ pointer;\n}\n.blue {\n  color: blue;\n}\n.highlight {\n  background: yellow;\n\
    }\n```\n\n那么我们可以通过以下代码在 `p` 元素上切换 `highlight` 类：\n\n```\n$(\"p\").click(function()\
    \ {\n  $(this).toggleClass(\"highlight\");\n});\n```\n\n## .trigger()\n\n`.trigger()`\
    \ 方法会运行所有附加到匹配元素上、针对给定事件类型的处理程序和行为。\n\n例如，如果我们有以下代码：\n\n```\n<button>Button #1</button>\n\
    <button>Button #2</button>\n```\n\n那么我们可以通过以下代码在点击第二个按钮时触发第一个按钮的点击事件：\n\n```\n\
    $(\"button\").first().click(function() {\n  console.log('first button clicked');\n\
    });\n$(\"button\").last().click(function() {\n  $(\"button\").first().trigger(\"\
    click\");\n});\n```\n\n## .triggerHandler()\n\n`.triggerHandler()` 方法允许我们运行所有附加到元素某个事件上的处理程序。\n\
    \n例如，如果我们有以下代码：\n\n```\n<button id=\"new\">.triggerHandler( \"focus\" )</button><br><br>\n\
    <input type=\"text\" value=\"To Be Focused\">\n```\n\n那么我们可以通过以下代码在点击按钮时触发 `focus`\
    \ 事件：\n\n```\n$(\"#new\").click(function() {\n  $(\"input\").triggerHandler(\"\
    focus\");\n});\n$(\"input\").focus(function() {\n  $(\"<span>Focused!</span>\"\
    ).appendTo(\"body\").fadeOut(1000);\n});\n```\n\n点击按钮时，输入框获得焦点，并显示 `Focused!`\
    \ 文本。\n\n## .unbind()\n\n`.unbind()` 方法用于移除元素上之前绑定的事件处理程序。\n\n例如，如果我们有以下代码：\n\n\
    ```\n<button id=\"bind\">Bind Click</button>\n<button id=\"unbind\">Unbind Click</button>\n\
    <div id=\"theone\"></div>\n```\n\n那么我们可以通过以下代码为 ID 为 `theone` 的 div 绑定和解绑点击处理程序：\n\
    \n```\nfunction aClick() {\n  $(\"div\").show().fadeOut(\"slow\");\n}\n$(\"#bind\"\
    ).click(function() {\n  $(\"#theone\")\n    .bind(\"click\", aClick)\n    .text(\"\
    Can Click!\");\n});\n$(\"#unbind\").click(function() {\n  $(\"#theone\")\n   \
    \ .unbind(\"click\", aClick)\n    .text(\"Does nothing...\");\n});\n```\n\n我们在按钮的\
    \ `click` 处理程序中为 div 绑定和解绑点击事件。\n\n## .undelegate()\n\n`.undelegate()` 方法用于从所有匹配当前选择器（基于根元素）的元素上移除事件处理程序。\n\
    \n例如，如果我们有以下代码：\n\n```\n<button id=\"bind\">Bind Click</button>\n<button id=\"\
    unbind\">Unbind Click</button>\n<div id=\"theone\"></div>\n```\n\n那么我们可以通过以下代码为\
    \ ID 为 `theone` 的 div 绑定和解绑 `click` 处理程序：\n\n```\nfunction aClick() {\n  $(\"\
    div\").show().fadeOut(\"slow\");\n}\n$(\"#bind\").click(function() {\n  $(\"body\"\
    )\n    .delegate(\"#theone\", \"click\", aClick)\n    .find(\"#theone\")\n   \
    \ .text(\"Can Click!\");\n});\n$(\"#unbind\").click(function() {\n  $(\"body\"\
    )\n    .undelegate(\"#theone\", \"click\", aClick)\n    .find(\"#theone\")\n \
    \   .text(\"Does nothing...\");\n});\n```\n\n## .unwrap()\n\n`.unwrap()` 方法用于从\
    \ DOM 中移除匹配元素集合的父元素。\n\n例如，如果我们有以下代码：\n\n```\n<button>wrap/unwrap</button>\n<p>Hello</p>\n\
    <p>World</p>\n```\n\n我们可以通过以下代码在 `p` 元素周围切换 div 的包裹和解除包裹：\n\n```\nconst pTags\
    \ = $(\"p\");\n$(\"button\").click(function() {\n  if (pTags.parent().is(\"div\"\
    )) {\n    pTags.unwrap();\n  } else {\n    pTags.wrap(\"<div></div>\");\n  }\n\
    })\n```\n\n`wrap` 会将每个 `p` 元素分别包裹在自己的 div 中。\n\n## .val()\n\n`.val()` 方法获取匹配元素集合中第一个元素的当前值。我们也可以用它来设置每个匹配元素的值。\n\
    \n例如，如果我们有以下代码：\n\n```\n<select id=\"single\">\n  <option>Single</option>\n  <option>Single2</option>\n\
    </select>\n<select id=\"multiple\" multiple=\"multiple\">\n  <option selected=\"\
    selected\">Multiple</option>\n  <option>Multiple2</option>\n  <option selected=\"\
    selected\">Multiple3</option>\n</select>\n```\n\n那么我们可以通过以下代码获取 `select` 元素中选中的值：\n\
    \n```\nfunction displayVals() {\n  const singleValues = $(\"#single\").val();\n\
    ```\n\n"
