- fmt: "\n![](Images/cover00153.jpeg)\n\n1. [Cover](kindle:embed:0001?mime=image/jpg)\n\
    2. [Table of contents](#part0001.xhtml_toc-title)\n\n# Introduction\n\nJavaScript\
    \ is the basic building block of front end web apps.\n\njQuery is a library that\
    \ is popular for manipulating the DOM.\n\nIn this book, we'll look at how to use\
    \ both together.\n\n# JavaScript\n\nJavaScript is one of the most popular programming\
    \ languages in the world. To use it effectively, we’ve to know about the basics\
    \ of it.\n\nIn this section, we’ll look at the basics of JavaScript.\n\n## Alerts\n\
    \nThe `alert` function displays an alert box with some text we pass in.\n\nThe\
    \ text comes from the string argument.\n\nFor instance, can write:\n\n```\nalert(\"\
    hello world!\");\n```\n\nand ‘hello world’ would be displayed.\n\nIt is a global\
    \ function, so it’s a property of `window`. `window.alert` is the same as `alert`.\n\
    \nThe short form is fine for inclusion in our code.\n\n## Variables and Strings\n\
    \nStrings are basic elements of JavaScript code. They store text data.\n\nA variable\
    \ with the given name can only be declared once.\n\nThey can be stored in variables.\
    \ Variables are names that we choose and assign values to so that we can store\
    \ them for use later.\n\nFor example, we can write:\n\n```\nlet name = \"james\"\
    ;\n```\n\nto store names.\n\nWe can set a variable declared with `let` to a new\
    \ value.\n\nFor example, we can write:\n\n```\nlet name = \"james\";\nname = \"\
    mark\";\n```\n\nThen the value of `name` will be `\"mark\"`.\n\nWe can declare\
    \ a variable and leave it undefined.\n\nFor instance, we can write:\n\n```\nlet\
    \ name;\nname = \"james\";\n```\n\nWe can do this with variables declared with\
    \ `let`.\n\nVariables can be declared with any name that isn’t in the reserved\
    \ keywords list.\n\nThe list is at [https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords).\n\
    \nVariables aren’t enclosed in quotes and text strings are enclosed in quotes.\n\
    \nJavaScript strings can be enclosed in single or double-quotes.\n\nThey can also\
    \ be enclosed with backticks.\n\nIf they’re enclosed with backticks, then they\
    \ have to have variables embedded in them.\n\nFor example, we can write:\n\n```\n\
    let firstName = 'james';\nlet lastName = 'smith';\nlet name = `${firstName} ${lastName}`;\n\
    ```\n\nWe interpolate the value of `firstName` and `lastName` into the string.\
    \ So `name` should be `'james smith'`.\n\nThis is a template literal. We can put\
    \ any expression inside the strings.\n\nThis is a very convenient way to combine\
    \ various expressions into a string.\n\nNow we can assign variables, we can pass\
    \ variables into `alert` instead of passing the whole string.\n\nFor example,\
    \ we can write:\n\n```\nlet text = \"hello world!\"\nalert(text);\n```\n\nWe pass\
    \ in `text` into `alert` as an argument to display the alert.\n\nWe can reference\
    \ `text` anywhere after it’s defined.\n\n## Variables and Numbers\n\nNumbers are\
    \ another primitive data type with JavaScript.\n\nWe can also assign them to variables.\n\
    \nFor example, we can write:\n\n```\nlet length = 100;\n```\n\nThis makes doing\
    \ operations on it easy. For example, we can add a number to `length`:\n\n```\n\
    length + 10\n```\n\nthen the sum of `length` and 10 is 110.\n\nWe know that `length`\
    \ isn’t a variable because it’s not enclosed in quotes.\n\nAnd numbers alone can\
    \ be used variable names, so JavaScript knows it’s a number.\n\nWe can replace\
    \ 10 with a variable by assigning it to a variable.\n\nFor example, we can write:\n\
    \n```\nlet length = 100;\nlet additionalLength = 10;\nlet totalLength = length\
    \ + additionaLength;\n```\n\nWe have the `additionalLength` variable that we add\
    \ to the `length` and assign the sum to the `totalLength` variable.\n\n## Looping\
    \ Through an Array\n\nWe can loop through an array with by using the `length`\
    \ property of an array for the ending condition.\n\nFor example, we can write:\n\
    \n```\nlet matchFound = false;\nfor (let i = 0; i < cleanestCities.length; i++)\
    \ {\n  if (city === cleanestCities[i]) {\n    matchFound = true;\n    console.log(\"\
    It's one of the cleanest cities\");\n  }\n}\n```\n\nWe get the `length` property\
    \ of the `cleanestCities` array for the ending condition.\n\nWe loop from 0 to\
    \ `cleanestCities.length — 1`. This way, we loop through the items from start\
    \ to end without setting comparing a fixed number value for the ending condition.\n\
    \nIf we want to stop a loop early, we can use the `break` keyword.\n\nFor example,\
    \ we can write:\n\n```\nfor (let i = 0; i < cleanestCities.length; i++) {\n  if\
    \ (city === cleanestCities[i]) {\n    console.log(\"It's one of the cleanest cities\"\
    );\n    break;\n  }\n}\n```\n\nIf `city` is equal to `clesnestCities[i]`, then\
    \ we end the loop with `break`.\n\nWe can nest loops in our code. For example,\
    \ we can write:\n\n```\nlet firstNames = ['james', 'mary', 'alex'];\nlet lastNames\
    \ = ['jones', 'wong', 'green'];\nlet fullNames = [];\nfor (let i = 0; i < firstNames.length;\
    \ i++) {\n  for (let j = 0; j < lastNames.length; j++) {\n    fullNames.push(`${firstNames[i]}\
    \ ${ lastNames[j]}`);\n  }\n}\n```\n\nWe have a `for` loop inside another `for`\
    \ loop.\n\nThe outer loop loops through the `firstNames` array.\n\nIn each iteration,\
    \ the inner loop is run to loop through the `lastNames` array.\n\nAnd inside the\
    \ inner loop, we push the combination of `firstNames[i]` and `lastNames[j]` into\
    \ the `fullNames` array.\n\nThe result is all the combinations of `firstNames`\
    \ and `lastNames` entries added to the `fullNames` array.\n\nWe can have as many\
    \ levels of nesting as we like. However, the more nesting we have, the harder\
    \ the code is to read.\n\n## Changing Case\n\nWe can change the case of strings\
    \ with the `toUpperCase` and `toLowerCase` methods.\n\n`toUpperCase` changes a\
    \ string’s letters all to upper case.\n\nAnd `toLowerCase` changes a string’s\
    \ letters all to lower case.\n\nFor example, we can write:\n\n```\n\"Santa Fe\"\
    .toLowerCase()\n```\n\nThen we get:\n\n```\n\"santa fe\"\n```\n\nreturned.\n\n\
    And if we write:\n\n```\n\"Santa Fe\".toUpperCase()\n```\n\nAnd we get:\n\n```\n\
    \"SANTA FE\"\n```\n\n## Strings Length and Parts\n\nWe can get the number of characters\
    \ of a string with the `length` property.\n\nFor example, we can write:\n\n```\n\
    \"Santa Fe\".length\n```\n\nand have 8 returned.\n\nTo get the parts of a string,\
    \ we can use the `slice` method.\n\nIt takes the start and end indexes that we\
    \ want to extract.\n\nThe end index itself is excluded.\n\nFor example, if we\
    \ write:\n\n```\n\"Santa Fe\".slice(2, 4)\n```\n\nThen we have `\"nt\"` returned.\n\
    \n## Finding String Segments\n\nWe can find string segments with the `indexOf`\
    \ method. It’ll return the starting index of the string that we pass in as the\
    \ argument if the string is inside the string we call `indexOf` with.\n\nFor example,\
    \ we can write:\n\n```\n\"Santa Fe\".indexOf('Fe')\n```\n\nthen 6 is returned\
    \ since The ‘F’ character is in index 6.\n\n## if Statements\n\nIf statements\
    \ let us run code conditionally.\n\nFor example, we can write:\n\n```\nconst answer\
    \ = prompt(\"Where's the capital of Italy?\");\nif (answer === \"Rome\") {\n \
    \ alert(\"Correct!\");\n}\n```\n\nto add a prompt to take in an answer to the\
    \ question.\n\nThen we check for it in th `if` statement. If `answer` is `'Rome'`,\
    \ then we show the `'Correct!'` alert.\n\nAn `if` statement if followed by a boolean\
    \ expression we’re checking for.\n\nIf the boolean expression returns `true`,\
    \ then we run the code between the curly brace.\n\nWe should always use `===`\
    \ to check for value equality since it checks for the type and value.\n\nSimple\
    \ `if` statements may be written without curtly brackets or the statement may\
    \ be written all in one line.\n\nBut it’s more convenient to read to have the\
    \ curly braces because it’s clearer.\n\n## Comparison Operators\n\nThe `===` operator\
    \ is the comparison operator.\n\nIt’s the equality operator.\n\nIt’s used to compare\
    \ 2 things to see if they’re equal.\n\nWe can use the equality operator to compare\
    \ the return value of any 2 expressions.\n\nFor example, we can write:\n\n```\n\
    if (totalCost === 81.50 + 100) {\n```\n\nor\n\n```\nif (fullName === firstName\
    \ + \" \" + \"wong\") {\n```\n\nString comparisons are case-sensitive, so only\
    \ if both cases are the same then the strings are considered the same.\n"
