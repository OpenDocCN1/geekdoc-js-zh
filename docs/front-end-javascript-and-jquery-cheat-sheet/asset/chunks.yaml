    >\n```\n\nThen we can call the `fadeToggle` method by writing:\n\n```\n$(\"button\"\
    ).click(function() {\n  $(\"#fork\").first().fadeToggle(\"slow\", \"linear\");\n\
    });\n\n$(\"button\").last().click(function() {\n  $(\"#fork\").first().fadeToggle(\"\
    fast\", \"linear\");\n});\n```\n\nWe add click listeners for the buttons so that\
    \ we can call `fadeToggle` inside to toggle the fading when we click the buttons.\n\
    \n## `:file` Selector\n\nWe can get the input with type `file` with the `:file`\
