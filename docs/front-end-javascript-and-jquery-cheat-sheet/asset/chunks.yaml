    \ />\");\n```\n\n## `.wrapInner()`\n\n我们可以使用 `wrapInner` 方法在匹配元素集合中每个元素的内容周围包裹一个\
    \ HTML 结构。\n\n例如，如果我们有：\n\n```\n<div class=\"container\">\n  <div class=\"inner\"\
