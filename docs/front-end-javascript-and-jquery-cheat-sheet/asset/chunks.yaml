    \ the same as the `li`.\n\n## Creating Elements and Text Nodes\n\nThere are 2\
    \ methods to let us create nodes. One is the `createElement` to create element\
    \ nodes. There’s also the `createTextNode` method to create a text node.\n\nWe\
    \ can use the `createAttribute` method for creating attributes and `createComment`\
    \ for creating comments.\n\nTo create an element, we can create one by writing:\n\
    \n```\nconst elementNode = document.createElement('div');\n```\n\nThen we create\
    \ a div.\n\nTo create a text node, we write:\n\n```\nconst textNode = document.createTextNode('hello');\n\
    ```\n\n## Creating and Adding Element and Text Nodes Using JavaScript Strings\n\
    \nWe can add nodes by setting the `innerHTML` method with a string.\n\nFor instance,\
    \ we can write:\n\n```\ndocument.getElementById('foo').innerHTML = '<strong>foo</strong>';\n\
    ```\n\nTo put a node into the following div:\n\n```\n<div id=\"foo\"></div>\n\
    ```\n\nWe have the div with ID `foo`.\n\nAnd setting the `innerHTML` property\
    \ would create the `strong` element node and put it into the div.\n\nTo replace\
    \ the enclosing node, we can write:\n\n```\ndocument.getElementById('foo').outerText\
    \ = 'foo';\n```\n\nto replace the div with the text node `'foo'`.\n\nThe `insertAdjancentHTML`\
    \ method only works with element nodes. It’s more precise than setting `innerHTML`\
    \ or creating a new node.\n\nFor instance, if we have the following HTML:\n\n\
    ```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n</div>\n```\n\nWe can write:\n\n\
    ```\nconst foo = document.getElementById('foo');foo.insertAdjacentHTML('beforebegin',\
    \ '<p>bar</p>');\n```\n\nThen we add a p tag before the p element with the text\
    \ `foo`. The position is the first argument and the content is the second argument.\n\
    \nOther positions include `'afterbwegin'`, `'beforeend'`, and `'afterend'`.\n\n\
    `innerHTML` will convert HTML elements found in the string to actual DOM nodes.\n\
    \n`textContent` can only construct text nodes.\n\n## Extracting Parts of a DOM\
    \ Tree as JavaScript Strings\n\n`innerHTML`, `outerHTML`, and `textContent` are\
    \ what we use to create and add nodes.\n\nWe can also use them to get the content.\n\
    \nFor instance, if we have:\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n</div>\n\
    ```\n\nThen we can write:\n\n```\nconsole.log(document.getElementById('foo').innerHTML);\n\
    ```\n\nto get the content of the div.\n\n`innerText` will give us the text nodes.\
    \ For instance, we can write:\n\n```\nconsole.log(document.getElementById('foo').innerText);\n\
    ```\n\nto get `foo`.\n\n## Adding Node Objects to the DOM\n\n`appendChild` and\
    \ `insertBefore` can be used to add node objects to the DOM.\n\n`appendChild`\
    \ is for adding a child element to the given element.\n\n`insetBefore` lets us\
    \ add an element before the current element.\n\nFor example, we can use `appendChild`\
    \ by writing:\n\n```\nconst elementNode = document.createElement('p');\nelementNode.innerText\
    \ = 'hello';\ndocument.getElementById('foo').appendChild(elementNode);\n```\n\n\
    Given that we have the following HTML:\n\n```\n<div id='foo'>\n  foo\n</div>\n\
    ```\n\nWe have added a new node after the text `foo` as a child node.\n\n`insertBefore`\
    \ takes 2 arguments. The first is the element to insert.\n\nThe 2nd is the element\
    \ that we want to insert before the node in the first argument.\n\nThe node that\
    \ we’re inserting before must be a child node of the node that we call `insertBefore`\
    \ on.\n\nSo given the following HTML:\n\n```\n<div id='foo'>\n  <p>\n    foo\n\
    \  </p>\n</div>\n```\n\nWe can insert an element before the p element by writing:\n\
    \n```\nconst elementNode = document.createElement('p');\nelementNode.innerText\
    \ = 'hello';\nconst foo = document.getElementById('foo')\nfoo.insertBefore(elementNode,\
    \ foo.firstChild);\n```\n\nWe created a p element with the p element and then\
    \ we pass it into the `insertBefore` method.\n\n`foo.firstChild` is the p element\
    \ since the parent div is `foo`.\n\nThen we get `hello` displayed before `foo`.\n\
    \n## Removing a Node with `removeChild()`\n\nTo remove a child element, we can\
    \ use the `removeChild` method to remove a child element.\n\nFor instance, given\
    \ the following HTML:\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n</div>\n\
    ```\n\nWe can write:\n\n```\nconst p = document.querySelector('p');\np.parentNode.removeChild(p);\n\
    ```\n\nto remove the p element from the div.\n\nWe got the direct parent of the\
    \ element we want to remove and then we can remove the element we want.\n\n##\
    \ Replacing a Child Element with `replaceChild()`\n\nThe `replaceChild` method\
    \ works similarly to `removeChild`. We get the parent and then we call `replaceChild`\
    \ to replace the item.\n\nFor instance, if we have:\n\n```\n<div id='foo'>\n \
    \ <p>\n    foo\n  </p>\n</div>\n```\n\nWe can write:\n\n```\nconst p = document.querySelector('p');\n\
    const bar = document.createTextNode('bar');\np.parentNode.replaceChild(bar, p);\n\
    ```\n\nto replace the p element with the text node with `bar` in it.\n\nThe first\
    \ argument is the new node that we want to replace the existing node with.\n\n\
    The 2nd argument has the original node that we want to replace.\n\n## Getting\
    \ an elements `offsetTop` and `offsetLeft` Values\n\nThe `offsetTop` and `offsetLeft`\
    \ to get the pixel value of an element node from the `offsetParent`.\n\nThe element\
    \ node properties give us the distance in pixels from elements outside the top\
    \ left border and inside the top left border of the `offserParent`.\n\n`offsetParent`\
    \ is determined by searching the nearest ancestor that has a CSS position that’s\
    \ not static.\n\nIf none is found, then the `body` position is used for the values\
    \ of `offsetParent`.\n\nFor instance, if we have a div inside the body:\n\n```\n\
    <!DOCTYPE html>\n<html>\n  <head> </head>\n  <body>\n    <div></div>\n  </body>\n\
    </html>\n```\n\nThen we can get the position of the div with:\n\n```\nconst div\
    \ = document.querySelector('div');console.log(div.offsetLeft);\nconsole.log(div.offsetTop);\n\
    console.log(div.offsetParent);\n```\n\nWe get `body` for `offsetparent` and numbers\
    \ for the other properties.\n\n## Get an Element’s Top, Right, Bottom, and Left\
    \ Border Edge\n\nThe `getBoundingClientRect()` method gets the position of an\
    \ element’s outside border edges relative to the top and left edge of the viewport.\n\
    \nFor example, if we have:\n\n```\n<!DOCTYPE html>\n<html>\n  <head></head>\n\
    \  <body>\n    <div></div>\n  </body>\n</html>\n```\n\nWe write:\n\n```\nconst\
    \ rect = document.querySelector('div').getBoundingClientRect();\nconsole.log(rect);\n\
    ```\n\nThen we get the `top`, `left`, `right`, and `bottom` properties with the\
    \ dimensions in pixels relative to the viewport.\n\n## Getting an Element’s Size\
    \ in the Viewport\n\nThe `getBoundingClientRect()` method also returns the `height`\
    \ and `width` properties.\n\nFor instance, if we have:\n\n```\n<!DOCTYPE html>\n\
    <html>\n  <head> </head>\n  <body>\n    <div></div>\n  </body>\n</html>\n```\n\
    \nWe write:\n\n```\nconst rect = document.querySelector('div').getBoundingClientRect();console.log(rect);\n\
    ```\n\nAnd we get the `height` and `width` properties that have the total height\
    \ and width including the padding and the borders together.\n\n## Getting an Element’s\
    \ Size in the Viewport Excluding Borders\n\nThe `clientHeight` and `clientWidth`\
    \ have the size of the element excluding the border.\n\nBut the padding and content\
    \ are included.\n\nIf we have:\n\n```\n<!DOCTYPE html>\n<html>\n  <head> </head>\n\
    \  <body>\n    <div></div>\n  </body>\n</html>\n```\n\nWe can write:\n\n```\n\
    const div = document.querySelector('div');console.log(div.clientHeight, div.clientWidth)\n\
    ```\n\n## Get the Topmost Element in Viewport at a Specific Point\n\n`elementFromPoint()`\
    \ gets a reference to the topmost element in an HTML document at a specific point\
    \ in the document.\n\nFor instance, if we have:\n\n```\n<!DOCTYPE html>\n<html>\n\
    \  <head> </head>\n  <body>\n    <div></div>\n  </body>\n</html>\n```\n\nThen\
    \ we can use it by writing:\n\n```\nconsole.log(document.elementFromPoint(10,\
    \ 12));\n```\n\nand we get the `html` element.\n\n## Get the Size of the Element\
    \ Being Scrolled Using `scrollHeight` and `scrollWidth`\n\n`scrollHeight` and\
    \ `scrolLWidtgh` gives us the height and width of the node being scrolled.\n\n\
    For example, if we have an HTML that scrolls the `html` element, then we get the\
    \ size of the `html` element, which is being scrolled.\n"
