    \ item 6</li>\n</ul>\n```\n\nWe can get the `li`s that are in an even number position\
    \ and add a red background to them by writing:\n\n```\n$(\"li\").filter(\":nth-child(2n)\"\
    ).css(\"background-color\", \"red\");\n```\n\nSo the 2nd, 4th, and 6th `li` elements\
    \ have a red background.\n\n## `.find()`\n\nThe `.find()` method gets the descendants\
    \ of each element in the current set of matched elements filtered by a selector,\
