    \ `css` to make the background red.\n\n## Class Selector (`.class`)\n\nWe can\
    \ select items with the class selector.\n\nFor example, if we have the following\
    \ HTML:\n\n```\n<div class=\"notMe\">div class=\"notMe\"</div>\n<div class=\"\
