    \ } catch (err) {\n\n    console.log(err);\n\n  }\n\n})()\n```\n\n我们有一个 `asyncEvent`\
    \ 函数，它在最后一行返回一个来自 deferred 对象的 promise。\n\n它会随机地 resolve 或 reject。\n\n然后在 `async`\
    \ 函数中，我们调用由 `asyncEvent` 函数返回的 promise。\n\n## deferred.reject()\n\n`deferred.reject()`\
    \ 方法用一个参数拒绝一个 deferred 对象，并调用所有失败回调。\n\n例如，我们可以这样使用它：\n\n```\nconst deferred =\
    \ jQuery.Deferred();\n\ndeferred.reject('error');\n```\n\n## deferred.rejectWith()\n\
    \n`deferred.rejectWith()` 方法使用上下文对象和参数拒绝一个 deferred 对象，并调用所有失败回调。\n\n例如，我们可以这样写：\n\
    \n```\nconst deferred = jQuery.Deferred();\n\ndeferred.rejectWith({\n    foo:\
    \ 'bar'\n  }, [1])\n  .catch(function(err) {\n    console.log(this, err);\n  })\n\
    ```\n\n我们调用 `rejectWith`，传入 `{ foo: 'bar' }` 作为 `this` 值，`[1]` 作为参数数组。\n\n然后我们可以在\
    \ `catch` 回调中获取它们。\n\n`this` 是 `{ foo: 'bar' }`，`err` 是 1。\n\n## deferred.resolve()\n\
    \n我们可以调用 `deferred.resolve()` 来 resolve 一个 deferred 对象，并使用给定的参数调用所有完成回调。\n\n例如，我们可以这样写：\n\
    \n```\n(async () => {\n  try {\n    const deferred = jQuery.Deferred();\n    const\
    \ res = await deferred.resolve(1)\n    console.log(res);\n  } catch (error) {\n\
    \    console.log(error);\n  }\n})()\n```\n\n我们创建了 `deferred` 对象。然后我们调用 `deferred.resolve`\
    \ 方法，传入 resolve 的值。\n\n然后 `res` 就拥有了 resolve 的值，因为我们在 `deferred.resolve` 前加了 `await`。\n\
    \n它能工作是因为它返回一个带有 `then` 方法的对象，该方法接受一个回调，回调参数就是 resolve 的值。\n\n## deferred.resolveWith()\n\
    \n`deferred.resolveWith()` 允许我们使用上下文对象和参数 resolve 一个 deferred 对象，并调用所有完成回调。\n\n\
    例如，我们可以这样使用它：\n\n```\nconst deferred = jQuery.Deferred();\n\ndeferred.resolveWith({\n\
    \    foo: 'bar'\n  }, [1])\n  .then(function(val) {\n    console.log(this, val);\n\
    \  })\n```\n\n我们调用 `resolveWith`，传入 `this` 值和一个参数数组。\n\n然后我们在返回的对象上调用 `then`，传入一个回调，并获取\
    \ `this` 和 `val` 的值。\n\n`this` 是 `{ foo: 'bar' }`，`val` 是 1。\n\n## deferred.state()\n\
    \n`deferred.state()` 方法返回 deferred 对象的状态。\n\n它可以返回 `'pending'`、`'resolved'` 或\
    \ `'rejected'`。\n\n`'pending'` 表示 deferred 对象尚未完成。\n\n`'resolved'` 表示 deferred\
    \ 对象已通过 `deferred.resolve()` 或 `deferred.resolveWith()` 调用。\n\n`'rejected'` 表示\
    \ deferred 对象处于拒绝状态。调用 `deferred.reject()` 或 `deferred.rejectedWith()` 会使其变为 `'rejected'`。\n\
    \n例如，我们可以这样使用它：\n\n```\nconst deferred = jQuery.Deferred();\n\ndeferred.resolveWith({\n\
    \    foo: 'bar'\n  }, [1])\n  .then(function(val) {\n    console.log(deferred.state())\n\
    \  })\n```\n\n然后控制台应该会输出 `'resolved'`。\n\n## :disabled 选择器\n\n我们可以使用 `:disabled`\
    \ 选择器获取被禁用的输入元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<form>\n  <input name=\"email\" disabled=\"\
