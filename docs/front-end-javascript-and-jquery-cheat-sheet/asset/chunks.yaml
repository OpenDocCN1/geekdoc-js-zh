    \ $(\"p\");\n\npara\n\n  .prop(\"code\", 1234)\n\n  .append(String(para.prop(\"\
    code\")))\n\n  .removeProp(\"code\")\n\n  .append(String(para.prop(\"code\")));\n\
    \n```\n\nThe first argument is the property name.\n\nAnd the 2nd argument is the\
    \ value of it.\n\n`removeProp` takes the name of the property we want to remove.\n\
    \n## .replaceAll()\n\nWe call `.replaceAll()` to replace each target element with\
    \ the set of matched elements.\n\nFor example, if we have:\n\n```\n\n<div class=\"\
    container\">\n\n  <div class=\"inner first\">Hello</div>\n\n  <div class=\"inner\
    \ second\">And</div>\n\n  <div class=\"inner third\">Goodbye</div>\n\n</div>\n\
    \n```\n\nThen we can replace all the divs with class `inner` with an `h2` element\
    \ by writing:\n\n```\n\n$(\"<h2>New heading</h2>\").replaceAll(\".inner\");\n\n\
    ```\n\n## .replaceWith()\n\nThe `.replaceWith()` method lets us replace each element\
    \ in the set of matched elements with the provided new content and return the\
    \ set of elements that were removed.\n\nFor example, if we have:\n\n```\n\n<div\
    \ class=\"container\">\n\n  <div class=\"inner first\">Hello</div>\n\n  <div class=\"\
    inner second\">And</div>\n\n  <div class=\"inner third\">Goodbye</div>\n\n</div>\n\
    \n```\n\nThen we can replace the div with the class `second` with an `h2` by writing:\n\
    \n```\n\n$(\"div.second\").replaceWith(\"<h2>New heading</h2>\");\n\n```\n\n##\
    \ :reset Selector\n\nThe `:reset` selector lets us select all elements of type\
    \ reset.\n\nFor example, if we have:\n\n```\n\n<form>\n\n  <input type=\"button\"\
    \ value=\"Input Button\">\n\n  <input type=\"checkbox\">\n\n  <input type=\"file\"\
    >\n\n  <input type=\"hidden\">\n\n  <input type=\"password\">\n\n  <input type=\"\
    radio\">\n\n  <input type=\"reset\">\n\n  <input type=\"submit\">\n\n  <input\
    \ type=\"text\">\n\n  <select>\n\n    <option>Option</option>\n\n  </select>\n\
    \n  <textarea></textarea>\n\n  <button>Button</button>\n\n</form>\n\n<div></div>\n\
    \n```\n\nThen we get input with type `reset` and add a background and border to\
    \ it by writing:\n\n```\n\n$(\"input:reset\").css({\n\n  background: \"yellow\"\
    ,\n\n  border: \"3px red solid\"\n\n});\n\n```\n\n## .resize()\n\nThe `.resize()`\
    \ method lets us watch for resize JavaScript event or trigger it on an element.\n\
    \nFor instance, we can use it by writing:\n\n```\n\n$(window).resize(function()\
    \ {\n\n  console.log(\"Handler for .resize() called.\");\n\n})\n\n```\n\nWe log\
    \ when `window` is resized.\n\n## :root Selector\n\nThe `:root` selector selects\
    \ the element that’s the root of the element.\n\nFor example, we can use it by\
    \ writing:\n\n```\n\nconsole.log($(\":root\")[0].nodeName)\n\n```\n\nThen we get\
    \ `'HTML’` logged.\n\n## .scroll()\n\nThe `.scroll()` method binds an event handler\
    \ to the scroll JavaScript event or lets us trigger it.\n\nFor example, if we\
    \ have:\n\n```\n\n<div id=\"target\" style=\"overflow: scroll; width: 200px; height:\
    \ 100px;\">\n\n  Lorem ipsum dolor sit amet, consectetur adipisicing elit,\n\n\
    \  sed do eiusmod tempor incididunt ut labore et dolore magna\n\n  aliqua. Ut\
    \ enim ad minim veniam, quis nostrud exercitation\n\n  ullamco laboris nisi ut\
    \ aliquip ex ea commodo consequat.\n\n  Duis aute irure dolor in reprehenderit\
    \ in voluptate velit\n\n  esse cillum dolore eu fugiat nulla pariatur. Excepteur\n\
    \n  sint occaecat cupidatat non proident, sunt in culpa qui\n\n  officia deserunt\
    \ mollit anim id est laborum.\n\n</div>\n\n<div id=\"other\">\n\n  Trigger the\
    \ handler\n\n</div>\n\n```\n\nThen we can watch for scrolling on the div with\
    \ the ID `target` by writing:\n\n```\n\n$(\"#target\").scroll(function() {\n\n\
    \  console.log('scrolling');\n\n});\n\n```\n\nWe can also trigger scrolling when\
    \ we click on the div with ID `other` by writing:\n\n```\n\n$(\"#target\").scroll(function()\
    \ {\n\n  console.log('scrolling');\n\n});\n\n$(\"#other\").click(function() {\n\
    \n  $(\"#target\").scroll();\n\n});\n\n```\n\n## .scrollLeft()\n\nThe `.scrollLeft()`\
    \ method gets the current horizontal position of the scroll bar for the first\
    \ element in the set of matched elements.\n\nFor example, if we have:\n\n```\n\
    \n<p>Hello</p>\n\n<p></p>\n\n```\n\nThen we get the horizontal positon of the\
    \ scrollbar by writing:\n\n```\n\nconst p = $(\"p\").first();\n\nconsole.log(p.scrollLeft())"
