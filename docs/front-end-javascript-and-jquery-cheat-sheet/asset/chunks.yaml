  trans: "\n我们调用 `defer.pipe` 并传入一个回调函数，该函数从 `defer` 对象获取解析后的值，将其乘以 2，然后在回调中返回。\n\n\
    然后我们调用 `defer.resolve(5)` 将 5 作为 `value` 的值传递给 `pipe` 回调。\n\n最终我们在 `done` 回调中获取到最终的\
    \ `value`，即 10。\n\n我们可以通过编写以下代码来链式调用 deferred：\n\n```\nconst url = 'https://jsonplaceholder.typicode.com/posts/1';\n\
    \nconst url2 = 'https://jsonplaceholder.typicode.com/posts/2';\n\nconst request\
    \ = $.ajax(url, {\n\n    dataType: \"json\"\n\n  })\n\n  .pipe(function(data)\
    \ {\n\n    console.log(data)\n\n    return $.ajax(url2);\n\n  })\n\n  .done(function(data)\
    \ {\n\n    console.log(data)\n\n  });\n```\n\n我们在 `$.ajax` 返回的第一个 deferred 对象上调用\
    \ `pipe`，然后调用 `done` 从第二个 `$.ajax` 调用中获取数据。\n\n## `:eq()` 选择器\n\n`:eq` 选择器允许我们在匹配集合中选取指定索引处的元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<ul>\n  <li>item 1</li>\n  <li>item 2</li>\n  <li>item\
    \ 3</li>\n  <li>item 4</li>\n  <li>item 5</li>\n</ul>\n```\n\n那么我们可以编写：\n\n```\n\
    $(\"li:eq(2)\").css(\"background-color\", \"red\");\n```\n\n来获取第三个 `li` 并为其添加红色背景。\n\
    \n## `.even()`\n\n我们可以使用 `even` 方法获取匹配集合中索引为偶数的元素。\n\n例如，如果我们有以下代码：\n\n```\n<ul>\n\
    \  <li>item 1</li>\n  <li>item 2</li>\n  <li>item 3</li>\n  <li>item 4</li>\n\
    \  <li>item 5</li>\n</ul>\n```\n\n那么我们可以通过编写以下代码来调用它：\n\n```\n$(\"li\").even().css(\"\
    background-color\", \"red\");\n```\n\n为索引为偶数的 `li` 元素添加红色背景。\n\n## `event.currentTarget`\n\
    \n我们可以使用 `event.currentTarget` 属性获取事件冒泡阶段中的当前 DOM 元素。\n\n例如，如果我们有以下代码：\n\n```\n\
    <p>\n  click me\n</p>\n```\n\n我们可以通过编写以下代码获取点击的 `p` 元素：\n\n```\n$(\"p\").click(function(event)\
    \ {\n  alert(event.currentTarget === this);\n});\n```\n\n`alert` 应该显示 `true`，因为\
    \ `this` 就是我们点击的 `p` 元素，与 `event.currentTarget` 相同。\n\n## `event.data`\n\n`event.data`\
    \ 是一个属性，包含传递给事件的数据。\n\n例如，如果我们有以下 HTML：\n\n```\n<button> 0 </button>\n<button>\
    \ 1 </button>\n<button> 2 </button>\n<button> 3 </button>\n<button> 4 </button>\n\
    ```\n\n那么我们可以为每个元素添加点击监听器，并通过编写以下代码获取数据：\n\n```\nfor (let i = 0; i < 5; i++) {\n\
    \  $(\"button\").eq(i).on(\"click\", {\n    value: i\n  }, function(event) {\n\
    \    console.log('value: ', event.data.value)\n  });\n}\n```\n\n我们在点击回调中获取 `event.data.value`\
    \ 属性的值。\n\n该值应与我们作为第二个参数传入的 `value` 属性值相同。\n\n## `event.delegateTarget`\n\n`event.delegateTarget`\
    \ 属性包含当前调用的 jQuery 事件处理程序所附加到的元素。\n\n例如，如果我们有以下代码：\n\n```\n<div class='box'>\n\
    \  <button>\n    0\n  </button>\n</div>\n<div class='box'>\n  <button>\n    1\n\
    \  </button>\n</div>\n<div class='box'>\n  <button>\n    2\n  </button>\n</div>\n\
    ```\n\n那么我们可以通过编写以下代码，在点击按钮时，将类为 `box` 的 div 设置为红色背景：\n\n```\n$(\".box\").on(\"\
    click\", \"button\", function(event) {\n  $(event.delegateTarget).css(\"background-color\"\
    , \"red\");\n});\n```\n\n## `event.isDefaultPrevented()`\n\n我们可以调用 `event.isDefaultPrevented()`\
    \ 来检查是否在某个对象上调用了 `event.preventDefault()`。\n\n例如，如果我们有以下代码：\n\n```\n<a>hello</a>\n\
    ```\n\n那么我们可以通过编写以下代码来调用此方法：\n\n```\n$(\"a\").click(function(event) {\n  alert(event.isDefaultPrevented());\n\
    \  event.preventDefault();\n  alert(event.isDefaultPrevented());\n});\n```\n\n\
    我们调用该方法并在警告框中显示其返回值。\n\n## `event.isPropagationStopped()`\n\n我们可以调用 `event.isPropagationStopped()`\
    \ 方法来检查是否调用了 `event.stopPropagation()`。\n\n例如，如果我们有以下代码：\n\n```\n<button>click\
    \ me</button>\n```\n\n那么我们可以通过编写以下代码来调用此方法：\n\n```\n$(\"button\").click(function(event)\
    \ {\n  alert(event.isPropagationStopped());\n  event.stopPropagation();\n  alert(event.isPropagationStopped());\n\
    });\n```\n\n## `event.metaKey`\n\n我们可以使用 `event.metaKey` 属性检查事件触发时是否按下了 meta 键。\n\
    \n在 Windows 中，meta 键是 Windows 键。\n\n在 macOS 中，meta 键是 command 键。\n\n例如，如果我们有以下代码：\n\
    \n```\n<button value=\"Test\" name=\"Test\" id=\"checkMetaKey\">Click me!</button>\n\
    ```\n\n那么我们可以通过编写以下代码来检查点击按钮时是否按下了 meta 键：\n\n```\n$(\"#checkMetaKey\").click(function(event)\
    \ {\n  console.log(event.metaKey);\n});\n```\n\n## `event.namespace`\n\n我们可以通过\
    \ `event.namespace` 属性获取事件的命名空间。\n\n例如，如果我们有以下代码：\n\n```\n<button>display event.namespace</button>\n\
    <p>\n</p>\n```\n\n那么我们可以通过编写以下代码来触发带有命名空间的事件：\n\n```\n$(\"p\").on(\"test.something\"\
    , function(event) {\n  alert(event.namespace);\n});\n\n$(\"button\").click(function(event)\
    \ {\n  $(\"p\").trigger(\"test.something\");\n});\n```\n\n当我们点击按钮时，我们在 `p` 元素上触发\
    \ `test.something` 事件。\n\n然后 `event.namespace` 应该是 `something`，并在警告框中显示。\n\n##\
    \ `event.pageX` 和 `event.pageY`\n\n我们可以分别使用 `event.pageX` 和 `event.pageY` 属性获取鼠标位置相对于文档左边缘的\
    \ x 和 y 坐标。\n\n例如，我们可以通过编写以下 HTML 来记录鼠标移动时的坐标：\n\n```\n<div id=\"log\"></div>\n\
    ```\n\n以及 JavaScript：\n\n```\n$(document).on(\"mousemove\", function({\n  pageX,\n\
    \  pageY\n}) {\n  $(\"#log\").text(`${pageX}, ${pageY}`);\n});\n```\n\n我们监听 `mousemove`\
    \ 事件，并从 `event` 对象中获取 `pageX` 和 `pageY` 属性。\n\n## `event.preventDefault()`\n\n\
    我们调用 `event.preventDefault()` 方法来阻止事件的默认行为被执行。\n\n例如，如果我们有以下代码：\n\n```\n<a href='https://google.com'>hello</a>Then\n\
    ```\n\n那么我们可以通过编写以下代码来阻止用户访问 [`google.com`](https://google.com)：\n\n```\n$(\"\
    a\").click(function(event) {\n  event.preventDefault();\n});\n```\n\n## `event.relatedTarget`\n\
    \n`event.relatedTarget` 属性获取事件中涉及的其他 DOM 元素。\n\n例如，如果我们有以下代码：\n\n```\n<div>\n\
    \  <a href='https://google.com'>hello</a>\n</div>\n```\n\n那么当鼠标移出 `a` 元素时，我们可以通过此属性获取鼠标移动到的元素：\n\
    \n```\n$(\"a\").mouseout(function(event) {\n  alert(event.relatedTarget.nodeName);\n\
    });\n```\n\n由于鼠标移动到了 div，我们应在警告框中看到 `DIV`。\n\n## `event.result`\n\n`event.result`\
    \ 属性返回由事件触发的事件处理程序最后返回的值。\n\n例如，如果我们有以下代码：\n\n```\n<button>display event.result</button>\n\
    ```\n\n那么我们可以在一个点击监听函数中返回一个值，并通过 `event.result` 获取该值：\n\n```\n$(\"button\").click(function(event)\
    \ {\n  return \"hello\";\n});\n\n$(\"button\").click(function(event) {\n  console.log(event.result);\n\
    });\n```\n\n我们在第一个点击监听器中返回 `'hello'`。\n\n然后在第二个点击监听器中记录 `event.result`。\n\n由于这是第一个点击监听器的返回值，因此应记录\
    \ `'hello'`。\n\n## `event.stopImmediatePropagation()`\n\n我们可以调用 `event.stopImmediatePropagation()`\
    \ 方法来停止事件传播。\n\n例如，如果我们有以下 HTML：\n\n```\n<p>paragraph</p>\n<div>division</div>\n\
    ```\n\n以及 CSS：\n\n```\np {\n   height: 30px;\n   width: 150px;\n   background-color:\
    \ #ccf;\n}\n\ndiv {\n   height: 30px;\n   width: 150px;\n   background-color:\
    \ #cfc;\n}\n```\n\n那么我们可以通过编写以下代码来调用 `stopImmediatePropagation` 以停止在 `p` 上触发的点击事件的传播：\n\
    \n```\n$(\"p\").click(function(event) {\n  event.stopImmediatePropagation();\n\
    });\n\n$(\"p\").click(function(event) {\n\n"
- fmt: "\n```\n$(this).css(\"background-color\", \"#f00\");\n\n});\n\n$(\"div\").click(function(event)\
    \ {\n\n  $(this).css(\"background-color\", \"#f00\");\n\n});\n```\n\n`event.stopImmediatePropagation()`\
    \ is called on the first click listener, so the 2nd one won’t run.\n\nThe `div`’s\
    \ click listener isn’t affected.\n\n## `event.stopPropagation()`\n\nWe can call\
    \ `event.stopPropagation` to stop event propagation to an element’s parent and\
    \ ancestor selectors.\n\nFor example, if we have:\n\n```\n<p>paragraph</p>\n```\n\
    \nWe can write:\n\n```\n$(\"p\").click(function(event) {\n  event.stopPropagation();\n\
    \  // Do something\n});\n```\n\nto stop the click event’s propagation.\n\n## `event.target`\n\
    \nWe can get the element that an event is triggered on with the `event.target`\
    \ property.\n\nFor example, if we have:\n\n```\n<p>paragraph</p>\n```\n\nThen\
    \ we can get which element is clicked in the `body` by writing:\n\n```\n$(\"body\"\
    ).click(function(event) {\n  console.log(\"clicked: \", event.target.nodeName);\n\
    });\n```\n\nThe `nodeName` gets the tag name of the element that’s clicked.\n\n\
    ## `event.timeStamp`\n\nWe can get when the event is triggered with the `timestamp`\
    \ property.\n\nFor example, if we have:\n\n```\n<p>paragraph</p>\n```\n\nThen\
    \ we can write:\n\n```\n$(\"body\").click(function(event) {\n  console.log(event.timeStamp);\n\
    });\n```\n\nThen when we click on the paragraph, we see the timestamp logged.\n\
    \n## `event.type`\n\nThe `event.type` property lets us get the type of event that’s\
    \ triggered.\n\nFor example, if we have:\n\n```\n<p>paragraph</p>\n```\n\nThen\
    \ we can write:\n\n```\n$(\"p\").click(function(event) {\n  alert(event.type);\n\
    });\n```\n\nto get the type of event that’s triggered with `event.type`.\n\n##\
    \ `event.which`\n\nThe `event.which` property lets us get the key on the keyboard\
    \ or mouse that’s pressed.\n\nFor example, if we have:\n\n```\n<input id=\"whichkey\"\
    \ value=\"type something\">\n```\n\nThen we can get the key code of the keyboard\
    \ key that's pressed by writing:\n\n```\n$(\"#whichkey\").on(\"keydown\", function(event)\
    \ {\n  console.log(event.type, event.which);\n});\n```\n\n`which` returns a number\
    \ that corresponds to the key.\n\n## `.fadeIn()`\n\nThe `.fadeIn()` method fades\
    \ an item to opaque.\n\nFor example, if we have the following HTML:\n\n```\n<div\
    \ id=\"clickme\">\n  Click here\n</div>\n<img id=\"fork\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nand CSS:\n\n```\n#book {\n  display: none;\n}\n```\n\nWe can make the\
    \ photo appear slowly when we click on Click here by writing:\n\n```\n$(\"#clickme\"\
    ).click(function() {\n  $(\"#fork\").fadeIn(\"slow\");\n});\n```\n\n## `.fadeOut()`\n\
    \nThe `.fadeOut()` method lets us make an element disappear.\n\nFor example, if\
    \ we have:\n\n```\n<div id=\"clickme\">\n  Click here\n</div>\n<img id=\"fork\"\
    \ src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nThen we can make the photo fade out when we click on Click here by writing:\n\
    \n```\n$(\"#clickme\").click(function() {\n  $(\"#fork\").fadeOut(\"slow\");\n\
    });\n```\n\n## `.fadeTo()`\n\nThe `.fadeTo()` method lets us set the opacity to\
    \ fade to.\n\nFor example, we can write:\n\n```\n<div id=\"clickme\">\n  Click\
