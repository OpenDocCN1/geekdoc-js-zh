    \ document.body));\n```\n\nto check if the `body` element is in the `document`\
    \ element.\n\nThis should return `true` since `body` is in `document`.\n\n## `jQuery.cssHooks`\n\
    \nThe `jQuery.cssHooks` lets us hook directly into jQuery to override how CSS\
    \ properties are retrieved or set.\n\nWe can also change how CSS properties are\
    \ normalized, property naming, or create custom properties.\n\nFor example, if\
    \ we have:\n\n```\n<div id='element'>\n  foo\n</div>\n<div id='another'>\n  bar\n\
    </div>\n```\n\nThen we can specify how the `border-radius` CSS property is get\
    \ and set by writing:\n\n```\nconst borderRadius = \"borderRadius\";\n\n$.cssHooks.borderRadius\
    \ = {\n  get(elem, computed, extra) {\n    return $.css(elem, borderRadius);\n\
    \  },\n  set(elem, value) {\n    elem.style[borderRadius] = value;\n  }\n};\n\n\
    $(\"#element\").css(\"borderRadius\", \"10px\");\n$(\"#another\").css(\"border-radius\"\
    , \"20px\");\n```\n\n## `jQuery.cssNumber`\n\nThe `jQuery.cssNumber` object has\
    \ all the CSS properties that may be used without a unit.\n\nFor example, we can\
    \ set the `borderRadius` CSS property to be used without a unit by writing:\n\n\
    ```\njQuery.cssNumber.borderRadius = true;\n```\n\nThe default object has the\
    \ following properties set to `true`:\n\n*   `zIndex`\n*   `fontWeight`\n*   `opacity`\n\
    *   `zoom`\n*   `lineHeight`\n*   `widows`\n*   `orphans`\n*   `fillOpacity`\n\
    *   `columnCount`\n*   `order`\n*   `flexGrow`\n*   `flexShrink`\n\n## `jQuery.data()`\n\
    \nWe can save arbitrary data associated with the specified element and returned\
    \ what value was set with the `jQuery.data()` method.\n\nFor example, if we have:\n\
    \n```\n<div>\n  The values stored were\n  <span></span>\n  and\n  <span></span>\n\
    </div>\n```\n\nThen we can save data into the `div` and get it by writing:\n\n\
    ```\nconst div = $(\"div\")[0];\njQuery.data(div, \"test\", {\n  first: 16,\n\
    \  last: \"pizza!\"\n});\n$(\"span\").first().text(jQuery.data(div, \"test\").first);\n\
    $(\"span\").last().text(jQuery.data(div, \"test\").last);\n```\n\nWe call `jQuery.data`\
    \ with the `div` to save the data.\n\nThe first argument is the element to save\
    \ the data.\n\nThe 2nd argument is the key to get the data.\n\nAnd the last argument\
    \ is the object we’re saving.\n\nThen we get the data in the last 2 lines and\
    \ set them as the text content of the span.\n\n## `jQuery.Deferred()`\n\nThe `jQuery.Deferred()`\
    \ method is a factory function that returns a chainable utility object with methods\
    \ to register callbacks, invoke callbacks, and relay success or failure states\
    \ of any sync or async operation.\n\n## `jQuery.dequeue()`\n\nThe `jQuery.dequeue()`\
    \ method lets us run the next function on the queue for the matched element.\n\
    \nFor example, if we have the following HTML:\n\n```\n<button>Start</button>\n\
    <div></div>\n```\n\nand the following CSS:\n\n```\ndiv {\n  margin: 3px;\n  width:\
    \ 50px;\n  position: absolute;\n  height: 50px;\n  left: 10px;\n  top: 30px;\n\
    \  background-color: yellow;\n}\n\ndiv.red {\n  background-color: red;\n}\n```\n\
    \nThen when we click on the Start button, we animate the div by writing:\n\n```\n\
    $(\"button\").click(function() {\n  $(\"div\")\n    .animate({\n      left: '+=200px'\n\
    \    }, 2000)\n    .animate({\n      top: '0px'\n    }, 600)\n    .queue(function()\
    \ {\n      $(this).toggleClass(\"red\");\n      $.dequeue(this);\n    })\n   \
    \ .animate({\n      left: '10px',\n      top: '30px'\n    }, 700);\n});\n```\n\
    \nWe call `$.dequeue` to call invoke the animation in the `animate` method.\n\n\
    ## `.is()`\n\nThe `is` method lets us check the current matched set of elements\
    \ against a selector, element, or jQuery object.\n\nIt returns `true` if at least\
    \ one of thee elements matches the given elements.\n\nFor example, if we have:\n\
    \n```\n<ul>\n  <li>list <strong>item 1</strong></li>\n  <li><span>list item 2</span></li>\n\
    \  <li>list item 3</li>\n</ul>\n```\n\nThen we can check if the element we currently\
    \ clicked on is an `li` and add a red background to it by writing:\n\n```\n$(\"\
    ul\").click(function(event) {\n  const target = $(event.target);\n  if (target.is(\"\
    li\")) {\n    target.css(\"background-color\", \"red\");\n  }\n});\n```\n\n##\
    \ `jQuery()`\n\nThe `jQuery()` function takes a string with a CSS selector to\
    \ match a set of elements.\n\nFor example, if we have the following HTML:\n\n\
    ```\n<div class='foo'>\n  <span>foo</span>\n</div>\n<div>\n  bar\n</div>\n```\n\
    \nand CSS:\n\n```\n.bar {\n  background: green\n}\n```\n\nWe can add the `bar`\
    \ class to a `span` inside the div with class `foo` by writing:\n\n```\n$(\"div.foo\"\
    ).click(function() {\n  $(\"span\", this).addClass(\"bar\");\n});\n```\n\n## `.jquery`\n\
    \nThe `.jquery` property lets us get a string containing the jQuery version number.\n\
    \nSo we can write:\n\n```\nconsole.log($.fn.jquery)\n```\n\nto get that.\n\n##\
    \ `jQuery.ajax()`\n\nWe can make an Ajax request with the `jQuery.ajax()` method.\n\
    \nFor example, we can make a GET request by writing:\n\n```\nconst jqxhr = $.ajax(\"\
    https://jsonplaceholder.typicode.com/posts/1\")\n  .done(function() {\n    alert(\"\
    success\");\n  })\n  .fail(function() {\n    alert(\"error\");\n  })\n  .always(function()\
    \ {\n    alert(\"complete\");\n  });\n\njqxhr.always(function() {\n  alert(\"\
    second complete\");\n});\n```\n\nWe call `done` with a callback to run something\
    \ after the request is successful.\n\nThe `fail` callback is run when the request\
    \ fails.\n\nThe `always` callback is run whenever the request is done regardless\
    \ of outcome.\n\n`jqxhr.always` 's callback is run whenever the request is done\
    \ regardless of outcome.\n\n## `jQuery.ajaxPrefilter()`\n\nThe `jQuery.ajaxPrefilter()`\
    \ method handles custom Ajax options or modifies existing options before each\
    \ request is sent and before they’re processed by `$.ajax()`.\n\nFor example,\
    \ we can write:\n\n```\nconst currentRequests = {};\n\n$.ajaxPrefilter(function(options,\
    \ originalOptions, jqXHR) {\n  if (options.abortOnRetry) {\n    if (currentRequests[options.url])\
    \ {\n      currentRequests[options.url].abort();\n    }\n    currentRequests[options.url]\
    \ = jqXHR;\n  }\n});\n\n$.ajax(\"https://jsonplaceholder.typicode.com/posts/1\"\
    )\n  .done(function() {\n    alert(\"success\");\n  })\n```\n\nto check if the\
    \ `abortOnRetry` option is enabled and call `abort` if the request URL is in the\
    \ `currentRequests` object.\n\nThis way, it won’t retry after it’s already been\
    \ tried.\n\n## `jQuery.ajaxSetup()`\n\nThe `jQuery.ajaxSetup()` method lets us\
    \ add set default values for future Ajax requests.\n\nBut its use isn’t recommended.\n\
    \nFor example, we can write:\n\n```\n$.ajaxSetup({\n  url: \"https://jsonplaceholder.typicode.com/posts/1\"\
    \n});\n\n$.ajax()\n  .done(function() {\n    alert(\"success\");\n  })\n```\n\n\
    Then the default URL to make the request to is `\"https://jsonplaceholder.typicode.com/posts/1\"\
    `.\n\n## `jQuery.ajaxTransport()`\n\nWe call the `jQuery.ajaxTransport()` method\
