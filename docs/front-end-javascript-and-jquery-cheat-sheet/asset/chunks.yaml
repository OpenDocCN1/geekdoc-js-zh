  trans: "\n`previousElementSibling` 表示当前元素的前一个兄弟元素。\n\n`children` 表示当前元素的子元素。\n\n\
    例如，我们可以使用：\n\n```\ndocument.body.children\n```\n\n来获取 body 元素的所有子节点。\n\n## 检查节点在\
    \ DOM 树中的位置\n\n我们可以使用 `contains` 方法来检查一个元素是否位于另一个元素内部。\n\n例如，我们可以这样写：\n\n```\n\
    const isInside = document.querySelector('html').contains(document.querySelector('body'));\n\
    ```\n\n这将返回 `true`，因为 `body` 始终位于 `html` 元素内部。\n\n`compareDocumentPosition` 返回一个数字，表示所比较元素之间的相对位置。\n\
    \n返回值为 0 表示元素相同。\n\n1 表示节点不在同一文档中。\n\n2 表示该节点位于所选节点之前。\n\n3 表示该节点位于所选节点之后。\n\n\
    8 表示传入的节点是所选节点的祖先。\n\n16 或十六进制的 10 表示传入的节点是所选节点的后代。\n\n一个节点可能与另一个节点存在多种关系。\n\n\
    在这种情况下，这些数字会被相加后返回。\n\n给定以下 HTML：\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n\
    \  <p>\n    bar\n  </p>\n</div>\n```\n\n我们可以这样使用它：\n\n```\nconst div = document.querySelector('div')\n\
    const p = document.querySelector('p')const result = div.compareDocumentPosition(p);\n\
    console.log(result);\n```\n\n我们得到 20，因为一个节点包含并位于另一个节点之前，这意味着 16 + 4 等于 20。\n\n\
    ## HTMLElement\n\n`HTMLElement` 是一个构造函数，用于创建表示 HTML 文档中节点的对象。\n\n它包含以下子构造函数：\n\
    \n*   `HTMLHtmlElement`\n\n*   `HTMLHeadElement`\n\n*   `HTMLLinkElement`\n\n\
    *   `HTMLTitleElement`\n\n*   `HTMLMetaElement`\n\n以及更多。\n\n它们代表页面上的各种元素。\n\n\
    ## HTMLElement 对象的属性和方法\n\n`HTMLElement` 实例有许多属性和方法供我们操作。\n\n我们可以使用 `createElement`\
    \ 来创建元素。\n\n使用 `tagName` 获取标签名。\n\n使用 `children` 获取子元素。\n\n使用 `getAttributes`\
    \ 获取子属性。\n\n使用 `setAttribute` 设置属性。\n\n使用 `hasAttribute` 检查元素是否存在。\n\n使用 `removeAttribute`\
    \ 移除属性。\n\n`classList` 是一个用于操作类集合的对象。\n\n`dataset` 返回所有以 `data-` 开头的属性。\n\n`attributes`\
    \ 包含属性列表。\n\n完整列表请参见 [`developer.mozilla.org/en-US/docs/Web/API/element`](https://developer.mozilla.org/en-US/docs/Web/API/element)。\n\
    \n## 创建元素\n\n我们可以使用 `createElement` 方法创建元素。\n\n例如，我们可以通过以下代码创建一个输入框：\n\n```\n\
    const input = document.createElement('input');\ndocument.body.appendChild(input);\n\
    ```\n\n然后我们会在屏幕上看到一个输入元素。\n\n## 获取元素的标签名\n\n`tagName` 属性返回元素的名称。\n\n它返回的值与 `nodeName`\
    \ 相同。\n\n标签名会以大写形式返回。\n\n例如，如果我们有：\n\n```\n<a href=\"http://example.com\">hello</a>\n\
    ```\n\n那么：\n\n```\nconsole.log(document.querySelector('a').tagName);\n```\n\n\
    会输出 `'A'`。\n\n## 获取元素属性的列表或集合\n\n`attributes` 属性返回元素当前已定义的属性节点集合。\n\n如果我们有：\n\n\
    ```\n<a href=\"http://example.com\" title=\"example\" data-foo=\"dataFoo\" class=\"\
    example\">hello</a>\n```\n\n那么我们可以通过以下代码将所有节点放入数组：\n\n```\nconst attrs = [...document.querySelector('a').attributes];\n\
    ```\n\n我们使用展开运算符将类数组对象转换为数组。\n\n返回的属性是动态的，意味着内容可以随时更改。\n\n`attributes` 实际返回的对象是\
    \ `NameNodeMap`，它是一个类数组对象。\n\n它有一个 `length` 属性。\n\n布尔属性会出现在 `attributes` 列表中，但没有值。\n\
    \n## 获取、设置和移除元素的属性值\n\n我们可以使用 `getAttribute()`、`setAttribute()` 和 `removeAttribute()`\
    \ 方法来操作属性。\n\n例如，如果我们有：\n\n```\n<a href=\"http://example.com\" title=\"example\"\
    \ data-foo=\"dataFoo\" class=\"example\">hello</a>\n```\n\n那么我们可以调用：\n\n```\n\
    const a = document.querySelector('a');\na.removeAttribute('href');\n```\n\n来移除\
    \ `href` 属性。\n\n我们也可以这样写：\n\n```\na.setAttribute('href', '#');\n```\n\n来设置 `href`\
    \ 属性。\n\n## 验证元素是否具有特定属性\n\n要检查元素是否具有特定属性，我们可以使用 `hasAttribute` 方法。\n\n例如，如果我们有：\n\
    \n```\n<a href='http://example.com' title=\"example\" data-foo='bar' class=\"\
    example\"></a>\n```\n\n那么我们可以通过以下代码检查它是否具有给定属性：\n\n```\nconst a = document.querySelector('a');\n\
    a.hasAttribute('title');\n```\n\n如果属性存在（无论是否有值），该方法将返回 `true`。\n\n## 获取类属性值的列表\n\
    \n我们可以使用 `classList` 属性来获取类属性的值。\n\n例如，如果我们有：\n\n```\n<div class=\"foo bar baz\"\
    ></div>\n```\n\n我们可以通过以下代码获取类名：\n\n```\nconst div = document.querySelector('div');\n\
    console.log(div.classList);\n```\n\n这将在一个类数组对象中分别返回每个类名。\n\n还有 `className` 属性可以将它们全部以字符串形式返回：\n\
    \n```\nconsole.log(div.className);\n```\n\n## 在 class 属性中添加和删除子值\n\n`classList`\
    \ 对象有一个 `add` 方法用于向类属性添加类名。\n\n它也有 `remove` 方法用于移除类名。\n\n例如，如果我们有：\n\n```\n<div\
    \ class=\"foo\"></div>​\n```\n\n那么我们可以这样写：\n\n```\nconst div = document.querySelector('div');\n\
    div.classList.add('bar');\n```\n\n来将 `bar` 与 `foo` 一起添加。\n\n以及：\n\n```\ndiv.classList.remove('foo');\n\
    ```\n\n来移除 `foo`，并在类属性中保留 `bar`。\n\n## 切换类属性值\n\n`classList` 还有一个 `toggle` 方法用于切换类名。\n\
    \n例如，如果我们有：\n\n```\n<div class=\"foo\"></div>​\n```\n\n那么我们可以这样写：\n\n```\nconst\
    \ div = document.querySelector('div');\ndiv.classList.toggle('foo');\n```\n\n\
    来关闭它，然后再次调用 `toggle` 并传入相同的类名可以重新添加它。\n\n## 检查两个节点是否相同\n\n我们可以根据 DOM 3 规范检查两个节点是否相同。根据规范，两个节点被视为相同，必须满足以下条件：两个节点类型相同。\n\
    \n`nodeName`、`localName`、`namespaceURI`、`prefix` 和 `nodeValue` 必须具有相同的值。\n\n`NameNodeMaps`\
    \ 属性必须相等。`children` NodeList 也必须相等。\n\n规范化可能会影响 `children` 中的条目，因此在比较之前应进行规范化。\n\
    \n`isEqualNode` 方法可以为我们完成所有检查。\n\n例如，如果我们有：\n\n```\n<div id='foo'>\n  <p>\n  \
    \  foo\n  </p>\n  <p>\n    bar\n  </p>\n</div>\n```\n\n我们可以这样写：\n\n```\nconst\
    \ p = document.querySelectorAll('div > p')\nconsole.log(p[0].isEqualNode(p[1]));\n\
    ```\n\n来检查两个 p 元素是否相同。\n\n它们不相同，因为内容不同，所以输出 `false`。\n\n如果我们有：\n\n```\n<div id='foo'>\n\
    \  <p>\n    foo\n  </p>\n  <p>\n    foo\n  </p>\n</div>\n```\n\n那么相同的代码会输出 `true`，因为\
    \ p 元素相同。\n\n## 文档节点\n\n`HTMLDocument` 构造函数继承自 `document`，表示一个特定的文档节点。\n\n## 文档属性和方法\n\
    \n`HTMLDocument` 实例的属性和方法包括以下内容：\n\n*   `doctype`\n\n*   `documentElement`\n\n\
    *   `implementation`\n\n*   `activeElement`\n\n*   `body`\n\n*   `head`\n\n* \
    \  `title`\n\n*   `lastModified`\n\n*   `referrer`\n\n*   `URL`\n\n*   `defaultview`\n\
    \n*   `compatMode`\n\n*   `ownerDocument`\n\n*   `hasFocus()`\n\n`doctype` 包含文档的文档类型。\n\
    \n`documentElement` 包含整个文档。\n"
- fmt: "\n# Document Object Properties\n\n- `implementation` has the `DOMImpkementation`\
    \ object which has some methods that don’t depend on any particular document.\n\
    - `activeElement` has the active element.\n- `body` has the body of the document.\n\
    - `title` has the `title` element.\n- `lastModified` has the last modified date.\n\
    - `referrer` has the URL that linked to the page.\n- `URL` is the URL of the current\
    \ page.\n- `defaultView` refers to the `window` object associated with a document.\n\
    - `compatMode` indicates whether a document is in quirks or standard mode.\n-\
    \ `ownerDocument` has the top-level document object of the node.\n- `hasFocus`\
    \ returns whether an element has focus.\n\n## Getting General HTML Document Information\n\
    \nWe can get general information about a document by writing the following:\n\n\
    ```\nconst {\n  title,\n  URL,\n  referrer,\n  lastModified,\n  compatMode\n}\
    \ = document;console.log(\n  title,\n  URL,\n  referrer,\n  lastModified,\n  compatMode\n\
    )\n```\n\nWe get general information from the `document` object itself.\n\n##\
    \ document Child Nodes\n\n`document` can contain one `DocumentType` node object\
    \ and one `Element` node object.\n\nThe `DocumentType` should be `<!doctype html>`\
    \ for most documents.\n\nThe child element should be the `html` element itself.\n\
    \nWe can use `document.childNodes` to get those elements.\n\n## Shortcuts to DOCTYPE,\
    \ html, head and body\n\nThe `document` object has properties to get those nodes\
    \ directly.\n\n`document.doctype` refers to `<!doctype html>` .\n\n`document.documentElement`\
    \ refers to the `<html>` element.\n\n`document.head` refers to `<head>` , and\
    \ `document.body` refers to `<body>` .\n\n## Detecting DOM Specifications or Features\n\
    \nThe `document.implement.hasFeatures` method lets us check if some feature is\
    \ supported by the DOM API.\n\nFor instance, we can write:\n\n```\ndocument.implementation.hasFeature('Core','3.0');\n\
    ```\n\nto check if the DOM Core 3.0 specs are implemented in our browser.\n\n\
    The following features are supported:\n\n- Core — supported in version 1.0, 2.0,\
    \ and 3.0\n- XML — 1.0, 2.0, 3.0\n- HTML — 1.0, 2.0\n- Views — 2.0\n- StyleSheets\
    \ — 2.0\n- CSS — 2.0\n- CSS2–2.0\n- Events — 2.0, 3.0\n- UIEvents — 2.0, 3.0\n\
    - MouseEvents — 2.0, 3.0\n- MutationEvents — 2.0, 3.0\n- HTMLEvents — 2.0\n- Range\
    \ — 2.0\n- Traversal — 2.0\n- Validation — 3.0\n\nWe shouldn’t trust `hasFeature`\
    \ to detect features.\n\n`isSupported` can also do the same check together supported\
    \ features for the supporting node:\n\n```\nelement.isSupported(feature, version)\n\
    ```\n\nwhere `element` is the specific element we want to check for.\n\n## Get\
    \ Reference to he Focused/Active Node\n\nWe can use the `document.activeElement`\
    \ property to get the element currently in focus.\n\n## Check if the document\
    \ or Any Node Inside it has Focus\n\nWe can call the `document.hasFocus()` method\
    \ to check if any element is focused inside the page.\n\n## document.defaultview\n\
    \n`document.defaultview` is the shortcut to the global JavaScript object in the\
    \ browser.\n\nThis means that `document.defaultView` is the `window` object in\
    \ the browser.\n\n## Check if a Class Attribute Value has a Specific Value\n\n\
    We can use the `classList.contains` method to check if a class name is in the\
    \ list of class names in the class attribute.\n\nFor instance, if we have:\n\n\
    ```\n<div class=\"foo bar baz\"></div>​\n```\n\nThen we can write:\n\n```\nconst\
    \ div = document.querySelector('div');\nconsole.log(elm.classList.contains('foo'));\n\
    ```\n\nThen it logs `true` since `foo` is in the class attribute.\n\n## Getting\
    \ and Setting data- Attributes\n\nWe can use the `datset` property to set any\
    \ attribute that starts with `data-` .\n\nFor example, if we have:\n\n```\n<div\
    \ data-foo-bar='foo'></div>​\n```\n\nThen we can write:\n\n```\nconst div = document.querySelector('div');\n\
    console.log(elm.dataset.fooBar);\n```\n\nto return the value of `data-foo-bar`\
    \ .\n\nAnything with kebab case in HTML is transformed to camelCase.\n\nTo set\
    \ it, we can write:\n\n```\nelm.dataset.baz = 'baz'\n```\n\nThen we get a `data-baz`\
    \ attribute on the div with value `baz` .\n\n## Selecting a Specific Element Node\n\
    \nThe most common methods for getting a reference to single element node is `querySelector`\
    \ or `getElementById` .\n\n`querySelector` is used for getting a single element\
    \ with any CSS selector.\n\nFor instance, we can write:\n\n```\nconst div = document.querySelector('div');\n\
    ```\n\nto get the first div on the page,\n\nWe can use `getElementById` to get\
    \ an element that has an `id` attribute set.\n\nFor example, if we have:\n\n```\n\
    <p id='foo'>foo</p>\n```\n\nThen we can use `getElementById` to get the p element\
    \ by writing:\n\n```\nconst foo = document.getElementById('foo');\n```\n\n## Selecting\
    \ or Creating a NodeList of Element Nodes\n\nWe can use the `querySelectorAll`\
    \ , `getElementsByTagName` or `getElementsByClassName` to get multiple elements\
    \ with a given selector, tag name, or class name respectively.\n\nFor instance,\
    \ if we have:\n\n```\n<ul>\n  <li class=\"item\">foo</li>\n  <li class=\"item\"\
    >bar</li>\n  <li class=\"item\">baz</li>\n</ul>\n```\n\nThen we can use `querySelectorAll`\
    \ to get all the li’s by writing:\n\n```\nconst lis = document.querySelectorAll('li');\n\
    ```\n\nTo use `getElementsByTagName` to do the same thing, we write:\n\n```\n\
    const lis = document.getElementsByTagName('li');\n```\n\nAlso, we can use the\
    \ `getElementsByClassName` as follows to get the same elements:\n\n```\nconst\
    \ lis = document.getElementsByTagName('item');\n```\n\n`NodeList` s created from\
    \ `getElementsByTagName` and `getElementsByClassName` are always live.\n\nThis\
    \ means that they always reflect the state of the document even if the document\
    \ is updated.\n\n`querySelectorAll` doesn’t return a live list of elements.\n\n\
    It returns a snapshot of a document at the time it was created.\n\nAll the methods\
    \ are also defined on the element node.\n\nSo we can chain them.\n\nFor example,\
    \ we can write:\n\n```\nconst lis = document.getElementById('list').getElementsByTagName('li');\n\
    ```\n\nWe can pass in `'*'` to `querySelectorAll` or `getElementsByTagName` to\
    \ get all elements on a page.\n\n`childNodes` will also return a `NodeList` .\n\
    \n## Selecting All Immediate Child Elements Nodes\n\nWe can use `children` to\
    \ select all child nodes of a given node.\n\nIf we have:\n\n```\n<ul>\n  <li class=\"\
    item\">foo</li>\n  <li class=\"item\">bar</li>\n  <li class=\"item\">baz</li>\n\
    </ul>\n```\n\nSo we can get the li elements by writing:\n\n```\nconst lis = document.querySelector('ul').children;\n\
    ```\n\n`children` gives us all the immediate elements nodes excluding other kinds\
    \ of nodes.\n\nThey are returned in the order that they appear in the DOM.\n\n\
    ## Contextual Element Selection\n\nWe can call `querySelector()` , `querySelectorAll()`\
    \ , `getElementsByTagBName()` , and `getElementsByClassName()` on an element node.\n\
    \nFor instance, if we have:\n\n```\n<ul>\n  <li class=\"item\">foo</li>\n  <li\
    \ class=\"item\">bar</li>\n  <li class=\"item\">baz</li>\n</ul>\n```\n\nWe can\
    \ write:\n\n```\nconst lis = document.querySelector('ul').getElementsByTagName('li');\n\
    ```\n\nto get the li elements.\n\n## Preconfigured Selections/List of Element\
    \ Nodes\n\nThere are many properties in the `document` object that can return\
    \ select nodes without calling the methods above.\n\n`document.all` returns all\
    \ elements in an HTML document.\n\n`document.forms` returns all the form elements\
    \ in an HTML document.\n\n`document.images` returns all img elements in the document.\n\
    \n`document.links` returns all `a` elements in the document.\n\n`document.scripts`\
    \ returns all script elements in a document.\n\n`document.styleSheets` returns\
    \ all link and style objects in an HTML document.\n\nThey return `HTMLCollection`\
    \ objects, so they’re live.\n\n`document.all` is created from the `HTMLAllCollection`\
    \ constructor and isn’t supported in Firefox.\n\n## Verify an Element will be\
    \ Selected Using matches()\n\nWe can use `matches` to check if an element's selector\
    \ matches one of the given element.\n\nFor example, if we have:\n\n```\n<ul>\n\
    \  <li class=\"item\">foo</li>\n  <li class=\"item\">bar</li>\n  <li class=\"\
    item\">baz</li>\n</ul>\n```\n\nWe can call it by writing:\n\n```\nconsole.log(document.querySelector('.item').matches('li:first-child'));\n\
    ```\n"
