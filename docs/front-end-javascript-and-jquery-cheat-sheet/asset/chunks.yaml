  trans: "\n```\n用于监听复选框输入的变化。\n```\n\n我们通过 `prop` 方法获取 `checked` 属性的值。\n\n## `.pushStack()`\n\
    \n我们调用 `pushStack` 方法将一组 DOM 元素添加到 jQuery 栈中。\n\n例如，如果我们有以下代码：\n\n```\n<div>\n\
    \  foo\n</div>\n```\n\n那么我们可以通过编写以下代码来调用 `pushStack` 将 div 添加到栈中，然后将其移除：\n\n```\n\
    jQuery([])\n  .pushStack(document.getElementsByTagName(\"div\"))\n  .remove()\n\
    \  .end();\n```\n\n## `.queue()`\n\n`.queue()` 方法显示要在匹配元素上执行的函数队列。\n\n例如，如果我们有以下代码：\n\
    \n```\n<p>队列长度为：<span></span></p>\n<div></div>\n```\n\n那么我们可以通过编写以下代码来显示队列中的项目数量：\n\
    \n```\nconst div = $(\"div\");\nfunction runIt() {\n  div\n    .show(\"slow\"\
    )\n    .animate({\n      left: \"+=200\"\n    }, 2000)\n    .slideToggle(1000)\n\
    \    .slideToggle(\"fast\")\n    .animate({\n      left: \"-=200\"\n    }, 1500)\n\
    \    .hide(\"slow\")\n    .show(1200)\n    .slideUp(\"normal\", runIt);\n}\nfunction\
    \ showIt() {\n  const n = div.queue(\"fx\");\n  $(\"span\").text(n.length);\n\
    \  setTimeout(showIt, 100);\n}\nrunIt();\nshowIt();\n```\n\n带有 `'fx'` 参数的 `queue`\
    \ 方法用于获取动画队列中的项目数量。\n\n## `:radio` 选择器\n\n`:radio` 选择器允许我们获取单选按钮元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<form>\n  <input type=\"button\" value=\"Input Button\">\n  <input type=\"\
    checkbox\">\n  <input type=\"file\">\n  <input type=\"hidden\">\n  <input type=\"\
    password\">\n  <input type=\"radio\" name=\"asdf\">\n  <input type=\"radio\" name=\"\
    asdf\">\n  <input type=\"reset\">\n  <input type=\"submit\">\n  <input type=\"\
    text\">\n  <select>\n    <option>Option</option>\n  </select>\n  <textarea></textarea>\n\
    \  <button>Button</button>\n</form>\n```\n\n那么我们可以通过编写以下代码为单选按钮添加背景和边框：\n\n```\n\
    $(\"form input:radio\")\n  .wrap(\"<span></span>\")\n  .parent()\n  .css({\n \
    \   background: \"yellow\",\n    border: \"3px red solid\"\n  });\n```\n\n## `.ready()`\n\
    \n`ready` 方法指定一个在 DOM 完全加载后执行的函数。\n\n我们可以这样写：\n\n```\n$(document).ready(function()\
    \ {\n  // .ready() 的处理程序被调用。\n});\n```\n\n或者：\n\n```\n$(function() {\n  // .ready()\
    \ 的处理程序被调用。\n});\n```\n\n当 `document` 加载完成后，我们在回调中执行代码。\n\n## `.remove()`\n\n\
    `.remove()` 方法允许我们移除 DOM 中的一组匹配元素。\n\n例如，如果我们有以下代码：\n\n```\n<div class=\"container\"\
    >\n  <div class=\"hello\">Hello</div>\n  <div class=\"goodbye\">Goodbye</div>\n\
    </div>\n```\n\n那么我们可以通过编写以下代码来移除带有 `hello` 类的 div：\n\n```\n$(\".hello\").remove();\n\
    ```\n\n## `.removeAttr()`\n\n`.removeAttr()` 方法从匹配元素集合中的每个元素中移除一个属性。\n\n例如，如果我们有以下代码：\n\
    \n```\n<input type=\"text\" title=\"hello there\">\n<button>Change title</button>\n\
    ```\n\n那么我们可以通过编写以下代码在点击按钮时切换 `title` 属性的开启和关闭：\n\n```\nconst inputTitle = $(\"\
    input\").attr(\"title\");\n$(\"button\").click(function() {\n  const input = $(this).next();\n\
    \  if (input.attr(\"title\") === inputTitle) {\n    input.removeAttr(\"title\"\
    )\n  } else {\n    input.attr(\"title\", inputTitle);\n  }\n});\n```\n\n## `.removeClass()`\n\
    \n我们可以调用 `.removeClass()` 方法来移除元素上的一个或多个类。\n\n例如，如果我们有以下代码：\n\n```\n<p class=\"\
    blue under\">Hello</p>\n```\n\n那么我们可以通过编写以下代码来移除 `blue` 和 `under` 类：\n\n```\n\
    $(\"p\").removeClass(\"blue under\")\n```\n\n## `.removeData()`\n\n`.removeData()`\
    \ 方法用于移除之前存储的数据。\n\n例如，如果我们有以下代码：\n\n```\n<div>hello</div>\n```\n\n那么我们可以通过编写以下代码向\
    \ div 添加数据并移除它：\n\n```\n$(\"div\").data(\"test1\", \"value\");\nconsole.log($(\"\
    div\").data(\"test1\"));\n$(\"div\").removeData(\"test1\");\nconsole.log($(\"\
    div\").data(\"test1\"));\n```\n\n我们调用 `removeData` 通过键来移除一条数据。\n\n## `.removeProp()`\n\
    \n我们可以对匹配元素集合使用 `removeProp` 属性。\n\n例如，如果我们有以下代码：\n\n```\n<p></p>\n```\n\n那么我们可以通过编写以下代码添加一个属性并移除它：\n\
    \n```\nconst para = $(\"p\");\npara\n  .prop(\"code\", 1234)\n  .append(String(para.prop(\"\
    code\")))\n  .removeProp(\"code\")\n  .append(String(para.prop(\"code\")));\n\
    ```\n\n第一个参数是属性名。\n\n第二个参数是它的值。\n\n`removeProp` 接受我们要移除的属性名。\n\n## `.replaceAll()`\n\
    \n我们调用 `.replaceAll()` 来用匹配元素集合替换每个目标元素。\n\n例如，如果我们有以下代码：\n\n```\n<div class=\"\
    container\">\n  <div class=\"inner first\">Hello</div>\n  <div class=\"inner second\"\
    >And</div>\n  <div class=\"inner third\">Goodbye</div>\n</div>\n```\n\n那么我们可以通过编写以下代码将所有带有\
    \ `inner` 类的 div 替换为一个 `h2` 元素：\n\n```\n$(\"<h2>New heading</h2>\").replaceAll(\"\
    .inner\");\n```\n\n## `.replaceWith()`\n\n`.replaceWith()` 方法允许我们用提供的新内容替换匹配元素集合中的每个元素，并返回被移除的元素集合。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div class=\"container\">\n  <div class=\"inner first\"\
    >Hello</div>\n  <div class=\"inner second\">And</div>\n  <div class=\"inner third\"\
    >Goodbye</div>\n</div>\n```\n\n那么我们可以通过编写以下代码将带有 `second` 类的 div 替换为一个 `h2`：\n\
    \n```\n$(\"div.second\").replaceWith(\"<h2>New heading</h2>\");\n```\n\n## `:reset`\
    \ 选择器\n\n`:reset` 选择器允许我们选择所有类型为 reset 的元素。\n\n例如，如果我们有以下代码：\n\n```\n<form>\n\
    \  <input type=\"button\" value=\"Input Button\">\n  <input type=\"checkbox\"\
    >\n  <input type=\"file\">\n  <input type=\"hidden\">\n  <input type=\"password\"\
    >\n  <input type=\"radio\">\n  <input type=\"reset\">\n  <input type=\"submit\"\
    >\n  <input type=\"text\">\n  <select>\n    <option>Option</option>\n  </select>\n\
    \  <textarea></textarea>\n  <button>Button</button>\n</form>\n<div></div>\n```\n\
    \n那么我们可以获取类型为 `reset` 的输入，并通过编写以下代码为其添加背景和边框：\n\n```\n$(\"input:reset\").css({\n\
    \  background: \"yellow\",\n  border: \"3px red solid\"\n});\n```\n\n## `.resize()`\n\
    \n`.resize()` 方法允许我们监听 resize JavaScript 事件，或在元素上触发该事件。\n\n例如，我们可以这样使用它：\n\n```\n\
    $(window).resize(function() {\n  console.log(\".resize() 的处理程序被调用。\");\n})\n```\n\
    \n当 `window` 调整大小时，我们会记录日志。\n\n## `:root` 选择器\n\n`:root` 选择器选择作为文档根元素的元素。\n\n\
    例如，我们可以这样使用它：\n\n```\nconsole.log($(\":root\")[0].nodeName)\n```\n\n然后我们会看到 `'HTML'`\
    \ 被记录。\n\n## `.scroll()`\n\n`.scroll()` 方法将一个事件处理程序绑定到 scroll JavaScript 事件，或者允许我们触发该事件。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div id=\"target\" style=\"overflow: scroll; width: 200px;\
    \ height: 100px;\">\n  Lorem ipsum dolor sit amet, consectetur adipisicing elit,\n\
    \  sed do eiusmod tempor incididunt ut labore et dolore magna\n  aliqua. Ut enim\
    \ ad minim veniam, quis nostrud exercitation\n  ullamco laboris nisi ut aliquip\
    \ ex ea commodo consequat.\n  Duis aute irure dolor in reprehenderit in voluptate\
    \ velit\n  esse cillum dolore eu fugiat nulla pariatur. Excepteur\n  sint occaecat\
    \ cupidatat non proident, sunt in culpa qui\n  officia deserunt mollit anim id\
    \ est laborum.\n</div>\n<div id=\"other\">\n  触发处理程序\n</div>\n```\n\n那么我们可以通过编写以下代码来监听\
    \ ID 为 `target` 的 div 上的滚动事件：\n\n```\n$(\"#target\").scroll(function() {\n  console.log('正在滚动');\n\
    });\n```\n\n我们还可以通过编写以下代码在点击 ID 为 `other` 的 div 时触发滚动：\n\n```\n$(\"#target\").scroll(function()\
    \ {\n  console.log('正在滚动');\n});\n$(\"#other\").click(function() {\n  $(\"#target\"\
    ).scroll();\n});\n```\n\n## `.scrollLeft()`\n\n`.scrollLeft()` 方法获取匹配元素集合中第一个元素的滚动条当前水平位置。\n\
    \n例如，如果我们有以下代码：\n\n```\n<p>Hello</p>\n<p></p>\n```\n\n那么我们可以通过编写以下代码获取滚动条的水平位置：\n\
    \n```\nconst p = $(\"p\").first();\nconsole.log(p.scrollLeft())\n```\n"
- fmt: "\n## `.scrollTop()`\n\nThe `.scrollTop()` method gets the current vertical\
    \ position of the scroll bar for the first element in the set of matched elements\
    \ or set the vertical position of the scroll bar for each matched element.\n\n\
    For example, if we have:\n\n```\n<p>Hello</p>\n<p></p>\n```\n\nThen we get the\
    \ vertical positon of the scrollbar by writing:\n\n```\nconst p = $(\"p\").first();\n\
    $(\"p\").last().text(p.scrollTop());\n```\n\n## `.select()`\n\nThe `.select()`\
    \ method binds to an event handler for the select JavaScript event.\n\nWe can\
    \ also use it to trigger the event on an element.\n\nFor example, if we have:\n\
    \n```\n<form>\n  <input id=\"target\" type=\"text\" value=\"Hello there\">\n</form>\n\
    <div id=\"other\">\n  Trigger the handler\n</div>\n```\n\nWe can watch for select\
    \ events triggered on the input by writing:\n\n```\n$(\"#target\").select(function()\
    \ {\n  console.log(\"Handler for .select() called.\");\n});\n```\n\nAlso, we can\
    \ trigger select on the input when we click on the div with ID `other` by writing:\n\
    \n```\n$(\"#target\").select(function() {\n  console.log(\"Handler for .select()\
    \ called.\");\n});\n$(\"#other\").click(function() {\n  $(\"#target\").select();\n\
    });\n```\n\n## `:selected` Selector\n\nThe `:selected` selector lets us select\
    \ all elements that are selected.\n\nFor example, if we have:\n\n```\n<select\
    \ name=\"garden\" multiple=\"multiple\">\n  <option>Flowers</option>\n  <option\
    \ selected=\"selected\">Shrubs</option>\n  <option>Trees</option>\n  <option selected=\"\
    selected\">Bushes</option>\n  <option>Grass</option>\n  <option>Dirt</option>\n\
    </select>\n<div></div>\n```\n\nThen we can watch the `select` event on the `select`\
    \ element by writing:\n\n```\n$(\"select\")\n  .change(function() {\n    let str\
    \ = \"\";\n    $(\"select option:selected\").each(function() {\n      str += $(this).text();\n\
    \    });\n    $(\"div\").text(str);\n  })\n  .trigger(\"change\");\n```\n\nWe\
    \ get all the selected items in the `change` callback and put them all in the\
    \ div.\n\n## `.serialize()`\n\nWe can use the `.serialize()` method to convert\
    \ the form’s values into key-value pairs.\n\nFor example, if we have:\n\n```\n\
    <form>\n  <select name=\"single\">\n    <option>Single</option>\n    <option>Single2</option>\n\
    \  </select>\n  <br>\n  <select name=\"multiple\" multiple=\"multiple\">\n   \
    \ <option selected=\"selected\">Multiple</option>\n    <option>Multiple2</option>\n\
    \    <option selected=\"selected\">Multiple3</option>\n  </select>\n  <br>\n \
    \ <input type=\"checkbox\" name=\"check\" value=\"check1\" id=\"ch1\">\n  <label\
    \ for=\"ch1\">check1</label>\n  <input type=\"checkbox\" name=\"check\" value=\"\
    check2\" checked=\"checked\" id=\"ch2\">\n  <label for=\"ch2\">check2</label>\n\
    \  <br>\n  <input type=\"radio\" name=\"radio\" value=\"radio1\" checked=\"checked\"\
    \ id=\"r1\">\n  <label for=\"r1\">radio1</label>\n  <input type=\"radio\" name=\"\
    radio\" value=\"radio2\" id=\"r2\">\n  <label for=\"r2\">radio2</label>\n</form>\n\
    ```\n\nThen we can log the values of the form whenever we change the value of\
    \ the controls by writing:\n\n```\nconst showValues = () => {\n  const str = $(\"\
    form\").serialize();\n  console.log(str);\n}\n$(\"input[type='checkbox'], input[type='radio']\"\
    ).on(\"click\", showValues);\n$(\"select\").on(\"change\", showValues);\nshowValues();\n\
    ```\n\nWe watch for clicks and change events and call the `showValues` method\
    \ whenever something is done to the form.\n\nThen `str` is something like:\n\n\
    ```\nsingle=Single&multiple=Multiple&multiple=Multiple3&check=check2&radio=radio1\n\
    ```\n\n## `.serializeArray()`\n\nWe can call `serializeArray` to encode a set\
    \ of form elements as an array of names and values.\n\nFor example, if we have:\n\
    \n```\n<form>\n  <div><input type=\"text\" name=\"a\" value=\"1\" id=\"a\"></div>\n\
    \  <div><input type=\"text\" name=\"b\" value=\"2\" id=\"b\"></div>\n  <div><input\
    \ type=\"hidden\" name=\"c\" value=\"3\" id=\"c\"></div>\n  <div>\n    <textarea\
    \ name=\"d\" rows=\"8\" cols=\"40\">4</textarea>\n  </div>\n  <div><select name=\"\
    e\">\n      <option value=\"5\" selected=\"selected\">5</option>\n      <option\
    \ value=\"6\">6</option>\n      <option value=\"7\">7</option>\n    </select></div>\n\
    \  <div>\n    <input type=\"checkbox\" name=\"f\" value=\"8\" id=\"f\">\n  </div>\n\
    \  <div>\n    <input type=\"submit\" name=\"g\" value=\"Submit\" id=\"g\">\n \
    \ </div>\n</form>\n```\n\nThen we can serialize the form values to an array of\
    \ objects by writing:\n\n```\n$(\"form\").submit(function(event) {\n  console.log($(this).serializeArray());\n\
    \  event.preventDefault();\n});\n```\n\nWhen we click Submit, we get something\
    \ like:\n\n```\n[\n  {\n    \"name\": \"a\",\n    \"value\": \"1\"\n  },\n  {\n\
    \    \"name\": \"b\",\n    \"value\": \"2\"\n  },\n  {\n    \"name\": \"c\",\n\
    \    \"value\": \"3\"\n  },\n  {\n    \"name\": \"d\",\n    \"value\": \"4\"\n\
    \  },\n  {\n    \"name\": \"e\",\n    \"value\": \"5\"\n  }\n]\n```\n\nlogged.\n\
    \n## `.show()`\n\nThe `show` displays the matched elements.\n\nFor example, if\
    \ we have the following HTML:\n\n```\n<div id=\"clickme\">\n  Click here\n</div>\n\
    <img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nAnd CSS:\n\n```\nimg {\n  display: none;\n}\n```\n\nThen we can call\
    \ the `show` method to show the image when we click on Click here by writing:\n\
    \n```\n$(\"#clickme\").click(function() {\n  $(\"#book\").show(\"slow\", function()\
    \ {\n    // Animation complete.\n  });\n});\n```\n\n## `.siblings()`\n\nThe `siblings`\
    \ method lets us get the siblings of each element in the set of matched elements.\n\
    \nWe can optionally pass in a selector into this method.\n\nFor example, if we\
    \ have:\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n  <li class=\"\
    third-item\">list item 3</li>\n  <li>list item 4</li>\n  <li>list item 5</li>\n\
    </ul>\n```\n\nThen we can get all the `li` s that are sibling of the one with\
    \ the class `third-item` and add a background to it:\n\n```\n$(\"li.third-item\"\
    ).siblings().css(\"background-color\", \"red\");\n```\n\n## `.slice()`\n\nThe\
    \ `slice` method lets us reduce a set of matched elements to a subset specified\
    \ by the range of indexes.\n\nFor example, if we have:\n\n```\n<ul>\n  <li>list\
    \ item 1</li>\n  <li>list item 2</li>\n  <li>list item 3</li>\n  <li>list item\
    \ 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\nThen we get the `li` starting\
    \ with index 2 and up to and not including 4 by writing:\n\n```\n$(\"li\").slice(2,\
    \ 4).css(\"background-color\", \"red\");\n```\n\n## `.slideDown()`\n\nThe `.slideDown()`\
    \ method displays the matched elements with a sliding motion.\n\nFor example,\
    \ if we have the following HTML:\n\n```\n<div id=\"clickme\">\n  Click here\n\
    </div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nAnd CSS:\n\n```\nimg {\n  display: none;\n}\n```\n\nThen we can get\
    \ show the image with a slide down animation when we click on Click here by writing:\n\
    \n```\n$( \"#clickme\" ).click(function() {\n  $( \"#book\" ).slideDown( \"slow\"\
    , function() {\n    // Animation complete.\n  });\n});\n```\n\n## `.slideToggle()`\n\
    \nThe `.slideToggle()` method lets us display or hide the matched elements with\
    \ the sliding motion.\n\nFor example, if we have the following HTML:\n\n```\n\
    <div id=\"clickme\">\n  Click here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nAnd CSS:\n\n```\nimg {\n  display: none;\n}\n```\n\nThen we can get\
    \ toggle the image with a slide animation when we click on Click here by writing:\n\
    \n```\n$( \"#clickme\" ).click(function() {\n  $( \"#book\" ).slideToggle( \"\
    slow\", function() {\n    // Animation complete.\n  });\n});\n```\n\n## `.slideUp()`\n\
    \nThe `.slideUp()` method hides the matched elements with a sliding motion.\n\n\
    For example, if we have the following HTML:\n\n```\n<div id=\"clickme\">\n  Click\
    \ here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n```\n\nThen we can get hide the image with a slide up animation when we click\
    \ on Click here by writing:\n\n```\n$( \"#clickme\" ).click(function() {\n  $(\
    \ \"#book\" ).slideUp( \"slow\", function() {\n    // Animation complete.\n  });\n\
    });\n```\n"
  raw: "```\n\n## .scrollTop()\n\nThe `.scrollTop()` method gets the current vertical\
    \ position of the scroll bar for the first element in the set of matched elements\
    \ or set the vertical position of the scroll bar for each matched element.\n\n\
    For example, if we have:\n\n```\n\n<p>Hello</p>\n\n<p></p>\n\n```\n\nThen we get\
    \ the vertical positon of the scrollbar by writing:\n\n```\n\nconst p = $(\"p\"\
    ).first();\n\n$(\"p\").last().text(p.scrollTop());\n\n```\n\n## .select()\n\n\
    The `.select()` method binds to an event handler for the select JavaScript event.\n\
    \nWe can also use it to trigger the event on an element.\n\nFor example, if we\
    \ have:\n\n```\n\n<form>\n\n  <input id=\"target\" type=\"text\" value=\"Hello\
    \ there\">\n\n</form>\n\n<div id=\"other\">\n\n  Trigger the handler\n\n</div>\n\
    \n```\n\nWe can watch for select events triggered on the input by writing:\n\n\
    ```\n\n$(\"#target\").select(function() {\n\n  console.log(\"Handler for .select()\
    \ called.\");\n\n});\n\n```\n\nAlso, we can trigger select on the input when we\
    \ click on the div with ID `other` by writing:\n\n```\n\n$(\"#target\").select(function()\
    \ {\n\n  console.log(\"Handler for .select() called.\");\n\n});\n\n$(\"#other\"\
    ).click(function() {\n\n  $(\"#target\").select();\n\n});\n\n```\n\n## :selected\
    \ Selector\n\nThe `:selected` selector lets us select all elements that are selected.\n\
    \nFor example, if we have:\n\n```\n\n<select name=\"garden\" multiple=\"multiple\"\
    >\n\n  <option>Flowers</option>\n\n  <option selected=\"selected\">Shrubs</option>\n\
    \n  <option>Trees</option>\n\n  <option selected=\"selected\">Bushes</option>\n\
    \n  <option>Grass</option>\n\n  <option>Dirt</option>\n\n</select>\n\n<div></div>\n\
    \n```\n\nThen we can watch the `select` event on the `select` element by writing:\n\
    \n```\n\n$(\"select\")\n\n  .change(function() {\n\n    let str = \"\";\n\n  \
    \  $(\"select option:selected\").each(function() {\n\n      str += $(this).text();\n\
    \n    });\n\n    $(\"div\").text(str);\n\n  })\n\n  .trigger(\"change\");\n\n\
    ```\n\nWe get all the selected items in the `change` callback and put them all\
    \ in the div.\n\n## .serialize()\n\nWe can use the `.serialize()` method to convert\
    \ the form’s values into key-value pairs.\n\nFor example, if we have:\n\n```\n\
    \n<form>\n\n  <select name=\"single\">\n\n    <option>Single</option>\n\n    <option>Single2</option>\n\
    \n  </select>\n\n  <br>\n\n  <select name=\"multiple\" multiple=\"multiple\">\n\
    \n    <option selected=\"selected\">Multiple</option>\n\n    <option>Multiple2</option>\n\
    \n    <option selected=\"selected\">Multiple3</option>\n\n  </select>\n\n  <br>\n\
    \n  <input type=\"checkbox\" name=\"check\" value=\"check1\" id=\"ch1\">\n\n \
    \ <label for=\"ch1\">check1</label>\n\n  <input type=\"checkbox\" name=\"check\"\
    \ value=\"check2\" checked=\"checked\" id=\"ch2\">\n\n  <label for=\"ch2\">check2</label>\n\
    \n  <br>\n\n  <input type=\"radio\" name=\"radio\" value=\"radio1\" checked=\"\
    checked\" id=\"r1\">\n\n  <label for=\"r1\">radio1</label>\n\n  <input type=\"\
    radio\" name=\"radio\" value=\"radio2\" id=\"r2\">\n\n  <label for=\"r2\">radio2</label>\n\
    \n</form>\n\n```\n\nThen we can log the values of the form whenever we change\
    \ the value of the controls by writing:\n\n```\n\nconst showValues = () => {\n\
    \n  const str = $(\"form\").serialize();\n\n  console.log(str);\n\n}\n\n$(\"input[type='checkbox'],\
    \ input[type='radio']\").on(\"click\", showValues);\n\n$(\"select\").on(\"change\"\
    , showValues);\n\nshowValues();\n\n```\n\nWe watch for clicks and change events\
    \ and call the `showValues` method whenever something is done to the form.\n\n\
    Then `str` is something like:\n\n```\n\nsingle=Single&multiple=Multiple&multiple=Multiple3&check=check2&radio=radio1\n\
    \n```\n\n## .serializeArray()\n\nWe can call `serializeArray` to encode a set\
    \ of form elements as an array of names and values.\n\nFor example, if we have:\n\
    \n```\n\n<form>\n\n  <div><input type=\"text\" name=\"a\" value=\"1\" id=\"a\"\
    ></div>\n\n  <div><input type=\"text\" name=\"b\" value=\"2\" id=\"b\"></div>\n\
    \n  <div><input type=\"hidden\" name=\"c\" value=\"3\" id=\"c\"></div>\n\n  <div>\n\
    \n    <textarea name=\"d\" rows=\"8\" cols=\"40\">4</textarea>\n\n  </div>\n\n\
    \  <div><select name=\"e\">\n\n      <option value=\"5\" selected=\"selected\"\
    >5</option>\n\n      <option value=\"6\">6</option>\n\n      <option value=\"\
    7\">7</option>\n\n    </select></div>\n\n  <div>\n\n    <input type=\"checkbox\"\
    \ name=\"f\" value=\"8\" id=\"f\">\n\n  </div>\n\n  <div>\n\n    <input type=\"\
    submit\" name=\"g\" value=\"Submit\" id=\"g\">\n\n  </div>\n\n</form>\n\n```\n\
    \nThen we can serialize the form values to an array of objects by writing:\n\n\
    ```\n\n$(\"form\").submit(function(event) {\n\n  console.log($(this).serializeArray());\n\
    \n  event.preventDefault();\n\n});\n\n```\n\nWhen we click Submit, we get something\
    \ like:\n\n```\n\n[\n\n  {\n\n    \"name\": \"a\",\n\n    \"value\": \"1\"\n\n\
    \  },\n\n  {\n\n    \"name\": \"b\",\n\n    \"value\": \"2\"\n\n  },\n\n  {\n\n\
    \    \"name\": \"c\",\n\n    \"value\": \"3\"\n\n  },\n\n  {\n\n    \"name\":\
    \ \"d\",\n\n    \"value\": \"4\"\n\n  },\n\n  {\n\n    \"name\": \"e\",\n\n  \
    \  \"value\": \"5\"\n\n  }\n\n]\n\n```\n\nlogged.\n\n## .show()\n\nThe `show`\
    \ displays the matched elements.\n\nFor example, if we have the following HTML:\n\
    \n```\n\n<div id=\"clickme\">\n\n  Click here\n\n</div>\n\n<img id=\"book\" src=\"\
    https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n\n```\n\nAnd CSS:\n\n```\n\nimg {\n\n  display: none;\n\n}\n\n```\n\nThen we\
    \ can call the `show` method to show the image when we click on Click here by\
    \ writing:\n\n```\n\n$(\"#clickme\").click(function() {\n\n  $(\"#book\").show(\"\
    slow\", function() {\n\n    // Animation complete.\n\n  });\n\n});\n\n```\n\n\
    ## .siblings()\n\nThe `siblings` method lets us get the siblings of each element\
    \ in the set of matched elements.\n\nWe can optionally pass in a selector into\
    \ this method.\n\nFor example, if we have:\n\n```\n\n<ul>\n\n  <li>list item 1</li>\n\
    \n  <li>list item 2</li>\n\n  <li class=\"third-item\">list item 3</li>\n\n  <li>list\
    \ item 4</li>\n\n  <li>list item 5</li>\n\n</ul>\n\n```\n\nThen we can get all\
    \ the `li` s that are sibling of the one with the class `third-item` and add a\
    \ background to it:\n\n```\n\n$(\"li.third-item\").siblings().css(\"background-color\"\
    , \"red\");\n\n```\n\n## .slice()\n\nThe `slice` method lets us reduce a set of\
    \ matched elements to a subset specified by the range of indexes.\n\nFor example,\
    \ if we have:\n\n```\n\n<ul>\n\n  <li>list item 1</li>\n\n  <li>list item 2</li>\n\
    \n  <li>list item 3</li>\n\n  <li>list item 4</li>\n\n  <li>list item 5</li>\n\
    \n</ul>\n\n```\n\nThen we get the `li` starting with index 2 and up to and not\
    \ including 4 by writing:\n\n```\n\n$(\"li\").slice(2, 4).css(\"background-color\"\
    , \"red\");\n\n```\n\n## .slideDown()\n\nThe `.slideDown()` method displays the\
    \ matched elements with a sliding motion.\n\nFor example, if we have the following\
    \ HTML:\n\n```\n\n<div id=\"clickme\">\n\n  Click here\n\n</div>\n\n<img id=\"\
    book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n\n```\n\nAnd CSS:\n\n```\n\nimg {\n\n  display: none;\n\n}\n\n```\n\nThen we\
    \ can get show the image with a slide down animation when we click on Click here\
    \ by writing:\n\n```\n\n$( \"#clickme\" ).click(function() {\n\n  $( \"#book\"\
    \ ).slideDown( \"slow\", function() {\n\n    // Animation complete.\n\n  });\n\
    \n});\n\n```\n\n## .slideToggle()\n\nThe `.slideToggle()` method lets us display\
    \ or hide the matched elements with the sliding motion.\n\nFor example, if we\
    \ have the following HTML:\n\n```\n\n<div id=\"clickme\">\n\n  Click here\n\n\
    </div>\n\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n\n```\n\nAnd CSS:\n\n```\n\nimg {\n\n  display: none;\n\n}\n\n```\n\nThen we\
    \ can get toggle the image with a slide animation when we click on Click here\
    \ by writing:\n\n```\n\n$( \"#clickme\" ).click(function() {\n\n  $( \"#book\"\
    \ ).slideToggle( \"slow\", function() {\n\n    // Animation complete.\n\n  });\n\
    \n});\n\n```\n\n## .slideUp()\n\nThe `.slideUp()` method hides the matched elements\
    \ with a sliding motion.\n\nFor example, if we have the following HTML:\n\n```\n\
    \n<div id=\"clickme\">\n\n  Click here\n\n</div>\n\n<img id=\"book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    >\n\n```\n\nThen we can get hide the image with a slide up animation when we click\
    \ on Click here by writing:\n\n```\n\n$( \"#clickme\" ).click(function() {\n\n\
    \  $( \"#book\" ).slideUp( \"slow\", function() {\n\n    // Animation complete.\n\
    \n  });\n\n});"
