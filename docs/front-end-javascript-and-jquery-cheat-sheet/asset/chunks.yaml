  trans: "\n```\n$(\"input[name$='letter']\").val(\"a letter\");\n```\n\n我们获取所有 `name`\
    \ 属性值以 `letter` 结尾的输入元素。\n\n然后通过调用 `val` 将前两个输入框填充为 `a letter`。\n\n## 属性等于选择器\
    \ [name=”value”]\n\n我们可以使用此选择器获取属性等于某个值的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<div>\n\
    \  <label>\n    <input type=\"radio\" name=\"newsletter\" value=\"Hot Fuzz\">\n\
    \    <span>name?</span>\n  </label>\n</div>\n<div>\n  <label>\n    <input type=\"\
    radio\" name=\"newsletter\" value=\"Cold Fusion\">\n    <span>value?</span>\n\
    \  </label>\n</div>\n<div>\n  <label>\n    <input type=\"radio\" name=\"newsletter\"\
    \ value=\"Evil Plans\">\n    <span>value?</span>\n  </label>\n</div>\n```\n\n\
    我们获取 `value` 设置为 `Hot Fuzz` 的 `span`，并通过编写以下代码用文本内容填充名称：\n\n```\n$(\"input[value='Hot\
    \ Fuzz']\").next().text(\"Hot Fuzz\");\n```\n\n现在第一个单选按钮旁边应该显示文本 Hot Fuzz。\n\n\
    ## 属性不等于选择器 [name!=”value”]\n\n我们可以使用此选择器选择属性不等于给定值的元素。\n\n例如，如果我们有以下 HTML：\n\n\
    ```\n<div>\n  <label>\n    <input type=\"radio\" name=\"newsletter\" value=\"\
    Hot Fuzz\">\n    <span>name?</span>\n  </label>\n</div>\n<div>\n  <input type=\"\
    radio\" value=\"Cold Fusion\">\n  <span>no name</span>\n</div>\n<div>\n  <label>\n\
    \    <input type=\"radio\" name=\"newsletter\" value=\"Evil Plans\">\n    <span>value?</span>\n\
    \  </label>\n</div>\n```\n\n然后我们可以获取 `name` 属性未设置为 `newsletter` 的单选按钮，并通过编写以下代码在其旁边的\
    \ span 中添加文本：\n\n```\n$(\"input[name!='newsletter']\").next().append(\"<b>; not\
    \ newsletter</b>\");\n```\n\n现在第二个单选按钮旁边显示：\n\n```\nno name**; not newsletter**\n\
    ```\n\n## 属性以指定值开头选择器 [name^=”value”]\n\n此选择器允许我们选择具有指定属性且属性值以给定字符串开头的元素。\n\n\
    例如，如果我们有以下代码：\n\n```\n<input name=\"newsletter\">\n<input name=\"milkman\">\n\
    <input name=\"newsboy\">\n```\n\n然后我们获取所有 `name` 属性以 `news` 开头的输入元素，并通过编写以下代码为它们设置值：\n\
    \n```\n$(\"input[name^='news']\").val(\"news here!\");\n```\n\n因此，第一个和最后一个输入框将添加\
    \ `news here` 输入。\n\n### .before()\n\n`.before()` 方法允许我们在匹配元素集合中的每个元素之前插入内容。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div class=\"container\">\n  <h2>Greetings</h2>\n  <div\
    \ class=\"inner\">foo</div>\n  <div class=\"inner\">bar</div>\n</div>\n```\n\n\
    然后我们可以通过编写以下代码在每个 class 为 `inner` 的 div 之前添加一个元素：\n\n```\n$(\".inner\").before(\"\
    <p>Test</p>\");\n```\n\n然后我们会看到：\n\n```\nTest\n\nfoo\n\nTest\n\nbar\n```\n\n显示出来。\n\
    \n### .bind()\n\n`.bind()` 方法允许我们为元素的某个事件添加处理程序。\n\n例如，如果我们有以下 HTML：\n\n```\n\
    <div id=\"foo\">\n  foo\n</div>\n```\n\n我们可以通过编写以下代码为其添加点击监听器：\n\n```\n$(\"#foo\"\
    ).bind(\"click\", function() {\n  alert(\"User clicked on 'foo.'\");\n});\n```\n\
    \n第一个参数是事件名称。\n\n第二个参数是事件触发时运行的回调函数。\n\n### .blur()\n\n`.blur()` 方法将一个事件处理程序绑定到\
    \ `blur` JavaScript 事件。\n\n例如，如果我们有以下 HTML：\n\n```\n<form>\n  <input id=\"target\"\
    \ type=\"text\" value=\"Field 1\">\n  <input type=\"text\" value=\"Field 2\">\n\
    </form>\n```\n\n然后我们可以通过编写以下代码监听 ID 为 `target` 的输入字段上的 `blur` 事件：\n\n```\n$(\"\
    #target\").blur(function() {\n  alert(\"Handler for .blur() called.\");\n});\n\
    ```\n\n我们获取元素，然后传入回调函数，当我们离开第一个输入框时显示一个警告。\n\n### :button 选择器\n\n`:button` 选择器选择所有按钮元素以及\
    \ `type` 设置为 `button` 的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<form>\n  <fieldset>\n\
    \    <input type=\"button\" value=\"Input Button\">\n    <input type=\"checkbox\"\
    >\n\n    <input type=\"file\">\n    <input type=\"submit\">\n    <input type=\"\
    text\">\n    <select>\n      <option>Option</option>\n    </select>\n\n    <textarea></textarea>\n\
    \    <button>Button</button>\n  </fieldset>\n</form>\n```\n\n以及以下 CSS：\n\n```\n\
    .marked {\n  background-color: yellow;\n  border: 3px red solid;\n}\n```\n\n然后我们可以获取按钮并为其添加\
    \ `marked` 类，通过编写以下代码：\n\n```\nconst input = $(\":button\").addClass(\"marked\"\
    );\nconsole.log(input.length)\n```\n\n`type` 设置为 `button` 的输入元素和 `button` 元素将被选中。\n\
    \n### callbacks.add()\n\n`callbacks.add` 方法允许我们向回调列表中添加回调函数。\n\n例如，我们可以编写：\n\n\
    ```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst\
    \ bar = function(value) {\n  console.log(`bar: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.add(bar);\n\
    callbacks.fire(\"world\");\n```\n\n我们调用 `$.Callbacks` 方法获取一个回调列表。\n\n然后我们调用 `add`\
    \ 方法将 `foo` 和 `bar` 方法添加到回调列表中。\n\n`callbacks.fire` 方法将使用给定的参数调用列表中的每个回调函数。\n\n\
    因此，我们在控制台日志中看到：\n\n```\nfoo: hello\nfoo: world\nbar: world\n```\n\n### callbacks.disable()\n\
    \n我们可以调用 `callbacks.disable` 来禁用一个回调列表。\n\n例如，如果我们有以下代码：\n\n```\nconst foo = function(value)\
    \ {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.disable();\ncallbacks.fire(\"\
    world\");\n```\n\n然后我们调用 `callbacks.disable` 来阻止回调列表再次被调用。\n\n因此，我们只看到：\n\n```\n\
    foo: hello\n```\n\n被记录。\n\n### callbacks.disabled()\n\n我们可以使用 `callbacks.disabled()`\
    \ 方法来检查回调是否已被禁用。\n\n例如，我们可以编写：\n\n```\nconst foo = function(value) {\n  console.log(`foo:\
    \ ${value}`);\n};\n\nconst callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"\
    hello\");\ncallbacks.disable();\nconsole.log(callbacks.disabled());\ncallbacks.fire(\"\
    world\");\n```\n\n由于我们调用了 `callbacks.disable`，`callbacks.disabled` 应该记录 `true`。\n\
    \n### callbacks.empty()\n\n`callbacks.empty()` 方法从列表中移除所有回调。\n\n例如，我们可以编写：\n\n\
    ```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst\
    \ bar = function(value) {\n  console.log(`bar: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.add(bar);\ncallbacks.empty();\n\
    console.log(callbacks.has(foo));\nconsole.log(callbacks.has(bar));\n```\n\n由于我们调用了\
    \ `callbacks.empty` 来移除所有回调，因此两个控制台日志都应该记录 `false`，因为两个回调都已被 `empty` 移除。\n\n###\
    \ callbacks.fire()\n\n`callbacks.fire()` 方法允许我们使用给定的参数调用列表中的所有回调。\n\n例如，我们可以编写：\n\
    \n```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\n\
    const bar = function(value) {\n  console.log(`bar: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.fire(\"\
    world\");\ncallbacks.add(bar);\ncallbacks.fire(\"hello again\");\n```\n\n我们添加了\
    \ `foo` 回调，并分别用 `'hello'` 和 `'world'` 调用了 `fire`，因此我们应该看到：\n\n```\nfoo: hello\n\
    foo: world\n```\n\n被记录。\n\n然后我们将 `bar` 添加到回调列表，并用 `'hello again'` 调用了 `fire`。\n\
    \n因此我们看到：\n\n```\nfoo: hello again\nbar: hello again\n```\n\n被记录。\n\n### callbacks.fired()\n\
    \n我们可以使用 `callbacks.fired()` 方法检查回调是否至少被触发过一次。\n\n例如，我们可以编写：\n\n```\nconst foo\
    \ = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.fire(\"\
    world\");\nconsole.log(callbacks.fired());\n```\n\n以记录是否有任何回调被 `fired` 调用过。\n\n\
    由于它已被调用，应该记录 `true`。\n\n### callbacks.fireWith()\n\n"
- fmt: "\nThe `callbacks.fireWith()` method lets us call a callback with the given\
    \ context and arguments.\n\nFor example, if we have:\n\n```\nconst log = function(value1,\
    \ value2) {\n  console.log(this, value1, value2);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(log);\ncallbacks.fireWith(window, [\"foo\", \"bar\"]);\n```\n\n\
    Then `this` is `window`, `value1` is `foo` and `value2` is `bar`.\n\n## `callbacks.has()`\n\
    \nThe `callbacks.has()` method lets us check whether the callbacks list has any\
    \ callbacks attached.\n\nFor example, we can write:\n\n```\nconst log = function(value1,\
    \ value2) {\n  console.log(this, value1, value2);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(log);\nconsole.log(callbacks.has(log));\n```\n\nThe console log\
    \ should log `true` since we added it with `add`.\n\n## `callbacks.lock()`\n\n\
    The `callbacks.lock()` method locks the callbacks list in its current state.\n\
    \nFor example, we can use it by writing:\n\n```\nconst foo = function(value) {\n\
    \  console.log(`foo: ${value}`);\n};\n\nconst callbacks = $.Callbacks();\ncallbacks.add(foo);\n\
    callbacks.fire(\"hello\");\ncallbacks.lock();\ncallbacks.fire(\"world\");\n```\n\
    \nWe call the `callbacks.lock` method to prevent any callbacks from being called.\n\
    \nSo we only have:\n\n```\nfoo: hello\n```\n\nlogged.\n\n## `callbacks.locked()`\n\
    \nWe can use the `callbacks.locked()` method to check if the callbacks list has\
    \ been locked.\n\nFor example, if we write:\n\n```\nconst foo = function(value)\
    \ {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.lock();\nconsole.log(callbacks.locked());\n\
    ```\n\nThen the last console log should be `true` since we called `lock` to lock\
    \ the callbacks list.\n\n## `callbacks.remove()`\n\nWe can remove a callback with\
    \ the `callback.remove` method.\n\nFor example, we can write:\n\n```\nconst foo\
    \ = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.remove(foo);\n\
    callbacks.fire(\"world\");\n```\n\nWe called `remove` on `foo` to remove `foo`\
    \ from the callbacks list.\n\nTherefore, then 2nd `fire` callback won’t call `foo`.\n\
    \n## `.change()`\n\nThe `.change()` method binds an event handler to the `change`\
    \ JavaScript event.\n\nIt can also be used to trigger an the `change` event on\
    \ an element.\n\nFor example, if we have the following HTML:\n\n```\n<form>\n\
    \  <input class=\"target\" type=\"text\" value=\"Field 1\">\n  <select class=\"\
    target\">\n    <option value=\"option1\" selected=\"selected\">Option 1</option>\n\
    \    <option value=\"option2\">Option 2</option>\n  </select>\n</form>\n```\n\n\
    Then we can listen to the `change` event triggered on the elements with the class\
    \ `target` by writing:\n\n```\n$(\".target\").change(function() {\n  alert(\"\
    Handler for .change() called.\");\n});\n```\n\nWe can also trigger the change\
    \ ebent on the element.\n\nFor example, if we have the following HTML:\n\n```\n\
    <form>\n  <input class=\"target\" type=\"text\" value=\"Field 1\">\n  <select\
    \ class=\"target\">\n    <option value=\"option1\" selected=\"selected\">Option\
    \ 1</option>\n    <option value=\"option2\">Option 2</option>\n  </select>\n</form>\n\
    <div id=\"other\">\n  click me\n</div>\n```\n\nThen we can add a click listen\
    \ to the div with ID `other`.\n\nWhen we click the div, we can trigger by `change`\
    \ event on all the elements with class `target` by writing:\n\n```\n$(\".target\"\
    ).change(function() {\n  alert(\"Handler for .change() called.\");\n});\n\n$(\"\
