    \ fade to.\n\n## `.fadeToggle()`\n\nThe `.fadeToggle()` lets us display or hide\
    \ the matched elements by animating their opacity.\n\nFor example, if we have:\n\
    \n```\n<button>fadeToggle 1</button>\n<button>fadeToggle 2</button>\n<img id=\"\
