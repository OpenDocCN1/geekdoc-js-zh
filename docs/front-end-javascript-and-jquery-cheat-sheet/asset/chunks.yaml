    \n</div>\n\n<div>\n\n  <input type=\"checkbox\" name=\"b\">\n\n  <span>lcm</span>\n\
    \n</div>\n\n<div>\n\n  <input type=\"checkbox\" name=\"c\" checked=\"checked\"\
    >\n\n  <span>Peter</span>\n\n</div>\n\n```\n\nThen we add a yellow background\
    \ to all the checkboxes that are unchecked by writing:\n\n```\n\n$(\"input:not(:checked)\
    \ + span\").css(\"background-color\", \"yellow\");\n\n```\n\n## :nth-child() Selector\n\
    \nThe `:nth-child()` selector lets us select all elements that are the nth-child\
    \ of their parent.\n\nFor example, if we have:\n\n```\n\n<div>\n\n  <ul>\n\n \
    \   <li>John</li>\n\n    <li>Karl</li>\n\n    <li>Brandon</li>\n\n  </ul>\n\n\
    </div>\n\n<div>\n\n  <ul>\n\n    <li>Sam</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n\
    \  <ul>\n\n    <li>John</li>\n\n    <li>Jane</li>\n\n    <li>Ralph</li>\n\n  \
    \  <li>David</li>\n\n  </ul>\n\n</div>\n\n```\n\nThen we add a `span` to the name\
    \ that is in the 2nd `li` of each `ul` by writing:\n\n```\n\n$(\"ul li:nth-child(2)\"\
    ).append(\"<span> - 2nd!</span>\");\n\n```\n\n## :nth-last-child() Selector\n\n\
    The `:nth-last-child` selector lets us select all elements that are the nth-child\
    \ of their parent.\n\nFor example, if we have:\n\n```\n\n<div>\n\n  <ul>\n\n \
    \   <li>John</li>\n\n    <li>Karl</li>\n\n    <li>Brandon</li>\n\n  </ul>\n\n\
    </div>\n\n<div>\n\n  <ul>\n\n    <li>Sam</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n\
    \  <ul>\n\n    <li>John</li>\n\n    <li>Jane</li>\n\n    <li>Ralph</li>\n\n  \
    \  <li>David</li>\n\n  </ul>\n\n</div>\n\n```\n\nThen we get the 2nd last `li`\
    \ in each `ul` and add a child span to it by writing:\n\n```\n\n$(\"ul li:nth-last-child(2)\"\
    ).append(\"<span> - 2nd to last!</span>\");\n\n```\n\n## :nth-last-of-type() Selector\n\
    \nThe `:nth-last-of-type` selector lets get the last element of the given type.\n\
    \nFor example, if we have:\n\n```\n\n<div>\n\n  <ul>\n\n    <li>John</li>\n\n\
    \    <li>Karl</li>\n\n    <li>Brandon</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n \
    \ <ul>\n\n    <li>Sam</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n  <ul>\n\n    <li>John</li>\n\
    \n    <li>Jane</li>\n\n    <li>Ralph</li>\n\n    <li>David</li>\n\n  </ul>\n\n\
    </div>\n\n```\n\nThen we can get the 2nd last `li` s in the `ul` and add a `span`\
    \ in them by writing:\n\n```\n\n$(\"ul li:nth-last-of-type(2)\").append(\"<span>\
    \ - 2nd to last!</span>\");\n\n```\n\n## :nth-of-type() Selector\n\nThe `:nth-of-type`\
    \ selector selects all elements that are the nth child of their parent in relation\
    \ to siblings with the same element name.\n\nFor example, if we have:\n\n```\n\
    \n<div>\n\n  <span>John</span>,\n\n  <b>Kim</b>,\n\n  <span>Adam</span>,\n\n \
    \ <b>Rafael</b>,\n\n  <span>Oleg</span>\n\n</div>\n\n<div>\n\n  <b>Dave</b>,\n\
    \n  <span>Ann</span>\n\n</div>\n\n<div>\n\n  <i><span>Maurice</span></i>,\n\n\
    \  <span>Richard</span>,\n\n  <span>Ralph</span>,\n\n  <span>Jason</span>\n\n\
    </div>\n\n```\n\nThen we get the 2nd sibling `span` and add another `span` into\
    \ it by writing:\n\n```\n\n$(\"span:nth-of-type(2)\")\n\n  .append(\"<span> is\
    \ 2nd sibling span</span>\")\n\n  .addClass(\"nth\");\n\n```\n\n## .odd()\n\n\
    We can reduce the set of matched elements to the odd ones in the set with the\
    \ `odd` selector.\n\nFor example, if we have:\n\n```\n\n<ul>\n\n  <li>list item\
    \ 1</li>\n\n  <li>list item 2</li>\n\n  <li>list item 3</li>\n\n  <li>list item\
    \ 4</li>\n\n  <li>list item 5</li>\n\n</ul>\n\n```\n\nThen we select the `li`\
    \ ‘s with an odd index by writing:\n\n```\n\n$(\"li\").odd().css(\"background-color\"\
    , \"red\");\n\n```\n\nWe add a red background to the 2nd and 4th `li` since the\
    \ index starts at 0.\n\n## .off()\n\nThe `.off()` select removes an event handler.\n\
    \nFor example, if we have:\n\n```\n\n<button id=\"theone\">Does nothing...</button>\n\
    \n<button id=\"bind\">Add Click</button>\n\n<button id=\"unbind\">Remove Click</button>\n\
    \n<div style=\"display:none;\">Click!</div>\n\n```\n\nThen we can use the `off`\
    \ method to remove a `click` handler by writing:\n\n```\n\nfunction flash() {\n\
    \n  $(\"div\").show().fadeOut(\"slow\");\n\n}\n\n$(\"#bind\").click(function()\
    \ {\n\n  $(\"body\")\n\n    .on(\"click\", \"#theone\", flash)\n\n    .find(\"\
    #theone\")\n\n    .text(\"Can Click!\");\n\n});\n\n$(\"#unbind\").click(function()\
    \ {\n\n  $(\"body\")\n\n    .off(\"click\", \"#theone\", flash)\n\n    .find(\"\
    #theone\")\n\n    .text(\"Does nothing...\");\n\n});\n\n```\n\nThe click listener\
    \ for the button with ID `unbind` has the `off` method to remove the `flash` function\
    \ as the body’s `click` handler.\n\n## .offset()\n\nThe `.offset()` method gets\
    \ the current coordinates of the first element in the set of matched elements\
    \ relative to the document.\n\nFor example, if we have:\n\n```\n\n<p>Hello</p>\n\
    \n<p>2nd Paragraph</p>\n\n```\n\nThen we can get the last `p` element’s offset\
    \ by writing:\n\n```\n\nconst p = $(\"p\").last();\n\nconst offset = p.offset();\n\
    \nconsole.log(offset);\n\n```\n\nThen we get:\n\n```\n\n{\n\n  \"top\": 50,\n\n\
    \  \"left\": 8\n\n}\n\n```\n\nas the value of `offset` .\n\n## .offsetParent()\n\
    \nThe `.offsetParent()` method gets the closes ancestor element that’s positioned.\n\
    \nFor example, if we have:\n\n```\n\n<ul class=\"level-1\">\n\n  <li class=\"\
    item-i\">I</li>\n\n  <li class=\"item-ii\" style=\"position: relative;\">II\n\n\
    \    <ul class=\"level-2\">\n\n      <li class=\"item-a\">A</li>\n\n      <li\
    \ class=\"item-b\">B\n\n        <ul class=\"level-3\">\n\n          <li class=\"\
    item-1\">1</li>\n\n          <li class=\"item-2\">2</li>\n\n          <li class=\"\
    item-3\">3</li>\n\n        </ul>\n\n      </li>\n\n      <li class=\"item-c\"\
    >C</li>\n\n    </ul>\n\n  </li>\n\n  <li class=\"item-iii\">III</li>\n\n</ul>\n\
    \n```\n\nThen we get the `li` with class `item-a` ‘s parent with the `offsetParent`\
    \ method and add a background to it by writing:\n\n```\n\n$(\"li.item-a\").offsetParent().css(\"\
    background-color\", \"red\");\n\n```\n\n## .on()\n\nThe `.on()` method attaches\
    \ an event handler function for one or more events to the selected elements.\n\
    \nFor example, if we have:\n\n```\n\n<p>Has an attached custom event.</p>\n\n\
    <button>Trigger custom event</button>\n\n<span style=\"display:none;\"></span>\n\
    \n```\n\nThen we can trigger a custom event when we click on the button by writing:\n\
    \n```\n\n$(\"p\").on(\"myCustomEvent\", function(event, myName) {\n\n  $(this).text(`${myName},\
    \ hi there`);\n\n  $(\"span\")\n\n    .stop()\n\n    .css(\"opacity\", 1)\n\n\
    \    .text(`myName = ${myName}`)\n\n    .fadeIn(30)\n\n    .fadeOut(1000);\n\n\
    });\n\n$(\"button\").click(function() {\n\n  $(\"p\").trigger(\"myCustomEvent\"\
    , [\"John\"]);\n\n});"
