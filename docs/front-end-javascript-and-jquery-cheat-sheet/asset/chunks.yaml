    \ beside it.\n\n## Attribute Not Equal Selector [name!=”value”]\n\nWe can use\
    \ this selector to select an attribute that doesn’t equal to the given value.\n\
    \nFor example, if we have the following HTML:\n\n```\n<div>\n  <label>\n    <input\
    \ type=\"radio\" name=\"newsletter\" value=\"Hot Fuzz\">\n    <span>name?</span>\n\
    \  </label>\n</div>\n<div>\n  <input type=\"radio\" value=\"Cold Fusion\">\n \
    \ <span>no name</span>\n</div>\n<div>\n  <label>\n    <input type=\"radio\" name=\"\
    newsletter\" value=\"Evil Plans\">\n    <span>value?</span>\n  </label>\n</div>\n\
    ```\n\nThen we can get the radio button that doesn’t have `name` attribute set\
    \ to `newsletter` and add text to the span beside it by writing:\n\n```\n$(\"\
    input[name!='newsletter']\").next().append(\"<b>; not newsletter</b>\");\n```\n\
    \nNow the second radio button has:\n\n```\nno name**; not newsletter**\n```\n\n\
    beside the radio button.\n\n## Attribute Starts With Selector [name^=”value”]\n\
    \nThis selector let us select elements that have the specified attribute with\
    \ a value starting exactly with a given string.\n\nFor example, if we have:\n\n\
    ```\n<input name=\"newsletter\">\n<input name=\"milkman\">\n<input name=\"newsboy\"\
    >\n```\n\nThen we get all the inputs with the `name` attribute starting with `news`\
    \ and setting the value for them by writing:\n\n```\n$(\"input[name^='news']\"\
    ).val(\"news here!\");\n```\n\nTherefore, the first and last inputs will have\
    \ the `news here` input added.\n\n## .before()\n\nThe `.before()` method lets\
    \ us insert content before each element in the set of matched elements.\n\nFor\
    \ example, if we have:\n\n```\n<div class=\"container\">\n  <h2>Greetings</h2>\n\
    \  <div class=\"inner\">foo</div>\n  <div class=\"inner\">bar</div>\n</div>\n\
    ```\n\nThen we can add an elements before each div with class `inner` by writing:\n\
    \n```\n$(\".inner\").before(\"<p>Test</p>\");\n```\n\nThen we get:\n\n```\nTest\n\
    \nfoo\n\nTest\n\nbar\n```\n\ndisplayed.\n\n## .bind()\n\nThe `.bind()` method\
    \ lets us add a handler to an event for the elements.\n\nFor example, if we have\
    \ the following HTML:\n\n```\n<div id=\"foo\">\n  foo\n</div>\n```\n\nWe can add\
    \ a click listener to it by writing:\n\n```\n$(\"#foo\").bind(\"click\", function()\
    \ {\n  alert(\"User clicked on 'foo.'\");\n});\n```\n\nThe first argument is the\
    \ event name.\n\nThe 2nd argument is the callback that’s run when the event is\
    \ triggered.\n\n## .blur()\n\nThe `.blur()` method binds an event handler to the\
    \ `blur` JavaScript event.\n\nFor example, if we have the following HTML:\n\n\
    ```\n<form>\n  <input id=\"target\" type=\"text\" value=\"Field 1\">\n  <input\
    \ type=\"text\" value=\"Field 2\">\n</form>\n```\n\nThen we can listen to the\
    \ `blur` event on the input field with ID `target` by writing:\n\n```\n$(\"#target\"\
    ).blur(function() {\n  alert(\"Handler for .blur() called.\");\n});\n```\n\nWe\
    \ get the element and then pass in the callback to show an alert when we move\
    \ away from the first input.\n\n## :button Selector\n\nThe `:button` select selects\
    \ all button elements and elements with `type` set to `button` .\n\nFor example,\
    \ if we have the following HTML:\n\n```\n<form>\n  <fieldset>\n    <input type=\"\
    button\" value=\"Input Button\">\n    <input type=\"checkbox\">\n\n    <input\
    \ type=\"file\">\n    <input type=\"submit\">\n    <input type=\"text\">\n   \
    \ <select>\n      <option>Option</option>\n    </select>\n\n    <textarea></textarea>\n\
    \    <button>Button</button>\n  </fieldset>\n</form>\n```\n\nAnd the following\
    \ CSS:\n\n```\n.marked {\n  background-color: yellow;\n  border: 3px red solid;\n\
    }\n```\n\nThen we can get the buttons and add the `marked` class to them by writing:\n\
    \n```\nconst input = $(\":button\").addClass(\"marked\");\nconsole.log(input.length)\n\
    ```\n\nThe input with type set to `button` and the `button` element will be selected.\n\
    \n## callbacks.add()\n\nThe `callbacks.add` method lets us add callbacks to a\
    \ callback list.\n\nFor example, we can write:\n\n```\nconst foo = function(value)\
    \ {\n  console.log(`foo: ${value}`);\n};\n\nconst bar = function(value) {\n  console.log(`bar:\
    \ ${value}`);\n};\n\nconst callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"\
    hello\");\ncallbacks.add(bar);\ncallbacks.fire(\"world\");\n```\n\nWe call the\
    \ `$.Callbacks` method to get a list of callbacks.\n\nThen we call the `add` method\
    \ to add the `foo` and `bar` methods to add to the callback list.\n\nThe `callbacks.fire`\
    \ method will call each callback on the list with the given argument.\n\nTherefore,\
    \ we get:\n\n```\nfoo: hello\nfoo: world\nbar: world\n```\n\nfrom the console\
    \ log.\n\n## callbacks.disable()\n\nWe can call `callbacks.disable` to disable\
    \ a callback.\n\nFor example, if we have:\n\n```\nconst foo = function(value)\
    \ {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.disable();\ncallbacks.fire(\"\
    world\");\n```\n\nThen we call `callbacks.disable` to stop the list of callbacks\
    \ from being called again.\n\nTherefore, we only see:\n\n```\nfoo: hello\n```\n\
    \nlogged.\n\n## callbacks.disabled()\n\nWe can use the `callbacks.disabled()`\
    \ method to check if callbacks have been disabled.\n\nFor example, we can write:\n\
    \n```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\n\
    const callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\"\
    );\ncallbacks.disable();\nconsole.log(callbacks.disabled());\ncallbacks.fire(\"\
    world\");\n```\n\nSince we called `callbacks.disable` , `callbacks.disabled` should\
    \ log `true` .\n\n## callbacks.empty()\n\nThe `callbacks.empty()` method removes\
    \ all callbacks from the list.\n\nFor example, we can write:\n\n```\nconst foo\
    \ = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst bar = function(value)\
    \ {\n  console.log(`bar: ${value}`);\n};\n\nconst callbacks = $.Callbacks();\n\
    callbacks.add(foo);\ncallbacks.add(bar);\ncallbacks.empty();\nconsole.log(callbacks.has(foo));\n\
    console.log(callbacks.has(bar));\n```\n\nSince we called `callbacks.empty` to\
    \ remove all callbacks, then both console logs should log `false` since both callbacks\
    \ have been removed by `empty` .\n\n## callbacks.fire()\n\nThe `callbacks.fire()`\
    \ method lets us call all callbacks on the list with the given argument.\n\nFor\
    \ example, we can write:\n\n```\nconst foo = function(value) {\n  console.log(`foo:\
    \ ${value}`);\n};\n\nconst bar = function(value) {\n  console.log(`bar: ${value}`);\n\
    };\n\nconst callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"\
    hello\");\ncallbacks.fire(\"world\");\ncallbacks.add(bar);\ncallbacks.fire(\"\
    hello again\");\n```\n\nWe added the `foo` callback and called `fire` with `'hello'`\
    \ and `'world'` , so we should get:\n\n```\nfoo: hello\nfoo: world\n```\n\nlogged.\n\
    \nThen we added `bar` to the callbacks list and called `fire` with `'hello again'` .\n\
    \nSo we get:\n\n```\nfoo: hello again\nbar: hello again\n```\n\nlogged.\n\n##\
    \ callbacks.fired()\n\nWe can check is the callback has been fired at least once\
    \ with the `callbacks.fired()` method.\n\nFor example, we can write:\n\n```\n\
    const foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.fire(\"\
    world\");\nconsole.log(callbacks.fired());\n```\n\nto log is any callbacks have\
    \ been called with `fired` .\n\nSince it’s been called, it should log `true` .\n\
    \n## callbacks.fireWith()"
