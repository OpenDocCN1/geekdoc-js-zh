    ```\n$(\"td:parent\").fadeTo(1500, 0.3);\n```\n\n## `.prev()`\n\n我们调用 `.prev()`\
    \ 方法来获取匹配元素集合中每个元素的前一个兄弟元素。\n\n如果提供了选择器，则仅当该兄弟元素匹配该选择器时才会被获取。\n\n例如，如果我们有以下代码：\n\
    \n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n  <li class=\"third-item\"\
    >list item 3</li>\n  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\
    \n那么我们可以通过编写以下代码，获取紧邻带有 `third-item` 类的 `li` 之前的 `li`：\n\n```\n$(\"li.third-item\"\
