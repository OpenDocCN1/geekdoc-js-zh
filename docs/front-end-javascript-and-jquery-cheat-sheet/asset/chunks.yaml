  trans: "\n\n`stopImmediatePropagation` 阻止同一事件的其他监听器被调用。\n\n`preventDefault` 阻止元素的默认行为被执行。\n\
    \n## addEventListener 中 this 的值\n\n我们传递给 `addEventListener` 的事件监听器函数中，`this` 的值指向事件所附加到的节点或对象的引用。\n\
    \n这仅适用于传统函数。\n\n例如，如果我们有一个按钮：\n\n```\n<button>\n  click me\n</button>\n```\n\n\
    那么如果我们编写：\n\n```\nconst button = document.querySelector('button');\n\nbutton.addEventListener('click',\
    \ function(event) {\n  console.log(this);\n});\n```\n\n`this` 将指向注册了该监听器的按钮。\n\
    \n我们可以使用 `event.currentTarget` 来获取相同的引用。\n\n它比 `this` 更可靠，因为箭头函数也能使用它。\n\n## 引用事件的目标\n\
    \n我们可以使用 `event.target` 属性来获取作为事件目标的元素。\n\n这可能与调用事件的节点不同。\n\n例如，我们可以编写：\n\n```\n\
    document.body.addEventListener('click', (event) => {\n  console.log(event.target);\n\
    }, false);\n```\n\n来获取被点击的元素。\n\n## 取消浏览器默认事件\n\n我们可以使用 `preventDefault` 来取消浏览器默认事件。\n\
    \n例如，我们可以通过此方法阻止链接的默认行为。\n\n如果我们有以下 HTML：\n\n```\n<a href=\"http://example.com\"\
    >don't go</a>\n```\n\n那么我们可以通过编写以下代码来阻止用户点击链接时跳转到 [`example.com`](http://example.com)：\n\
    \n```\ndocument.querySelector('a').addEventListener('click', (event) => {\n  event.preventDefault();\n\
    }, false);\n```\n\n点击链接时它将不会执行任何操作。\n\n`preventDefault` 不会阻止事件在冒泡或捕获阶段传播。\n\n\
    在事件监听器函数体末尾添加 `return false` 与 `preventDefault` 效果相同。\n\n事件对象具有 `cancelable` 属性，用于指示事件是否会对\
    \ `preventDefault` 做出响应。\n\n## 停止事件流\n\n要阻止事件流向祖先元素或反向流动，我们可以使用 `stopPropagation`\
    \ 方法。\n\n例如，我们可以编写：\n\n```\nconst button = document.querySelector('button')\n\n\
    button.addEventListener('click', (e) => {\n  e.stopPropagation();\n}, false);\n\
    ```\n\n来阻止事件从起源元素向祖先元素传播。\n\n## 停止事件流及同一目标上的其他同类事件\n\n`stopImmediatePropagation`\
    \ 会停止事件流阶段，以及事件目标上在该事件监听器之后附加的任何其他同类事件。\n\n例如，我们可以编写：\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n```\n\n那么如果我们有：\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n\ndocument.querySelector('button').addEventListener('click', () =>\
    \ {\n  //...\n}, false);\n\ndocument.body.addEventListener('click', () => {\n\
    \  //...\n}, false);\n```\n\n第一个监听器之后的所有监听器都不会被调用，因为我们在第一个监听器中调用了 `stopImmediatePropagation`。\n\
    \n## DOM 事件类型\n\n我们可以监听的事件种类繁多。\n\n以下是用户事件：\n\n*   `load` — 当某内容加载完成时触发\n*   `unload`\
    \ — 当用户代理移除资源时触发\n*   `abort` — 当资源在加载完成前停止加载时触发\n*   `error` — 当某内容加载失败时触发\n\
    *   `resize` — 当文档视图大小改变时触发\n*   `scroll` — 当用户滚动时触发\n*   `contextmenu` — 通过右键点击元素触发\n\
    \n以下是焦点事件：\n\n*   `blur` — 当元素失去焦点时触发（通过点击其他地方或按 Tab 键）\n*   `focus` — 当元素获得焦点时触发\n\
    *   `focusin` — 当事件目标即将获得焦点但在焦点转移之前触发\n*   `focusout` — 当事件目标即将失去焦点时触发\n\n表单事件包括：\n\
    \n*   `change` — 当控件失去输入焦点时触发\n*   `reset` — 当表单重置时触发\n*   `submit` — 当表单提交时触发\n\
    *   `select` — 当用户在字段中选择一些文本时触发\n\n鼠标事件包括：\n\n*   `click` — 当鼠标指针点击元素时触发\n*  \
    \ `dblclick` — 当鼠标指针双击元素时触发\n*   `mousedown` — 当鼠标指针在元素上按下时触发\n*   `mouseenter`\
    \ — 当鼠标指针移入元素时触发\n*   `mouseleave` — 当鼠标指针移出元素及其所有子元素的边界时触发\n*   `mousemove` —\
    \ 当鼠标指针在元素上移动时触发\n*   `mouseup` — 当鼠标指针在元素上释放时触发\n*   `mouseover` — 当鼠标指针移过元素时触发\n\
    \n滚轮事件包括：\n\n*   `wheel` — 当鼠标滚轮旋转时触发\n\n键盘事件包括：\n\n*   `keydown` — 当按键最初被按下时触发\n\
    *   `keypress` — 当按键最初被按下时触发\n*   `keyup` — 当按键被释放时触发\n\n触摸事件包括：\n\n*   `touchstart`\
    \ — 指示用户将触摸点放在触摸表面上时触发\n*   `touchend` — 指示用户从触摸表面移除触摸点时触发\n*   `touchmove` —\
    \ 当用户沿触摸表面移动触摸点时触发\n*   `touchenter` — 当触摸点移入 DOM 元素定义的交互区域时触发\n*   `touchleave`\
    \ — 指示触摸点移出 DOM 元素定义的区域时触发\n*   `touchcancel` — 当触摸点被中断时触发\n\n窗口/主体事件包括：\n\n*\
    \   `afterprint` — 当打印完成后触发\n*   `beforeprint` — 在打印之前触发\n*   `beforeunload` —\
    \ 在文档卸载之前触发\n*   `hashchange` — 当 URL 中 `#` 后面的部分发生变化时触发\n*   `message` — 当用户向\
    \ worker 发送消息时触发\n*   `offline` — 当浏览器离线时触发\n*   `online` — 当浏览器在线时触发\n*   `pagehide`\
    \ — 当从会话历史记录条目中遍历时触发\n*   `pageshow` — 当从会话历史记录条目中进入时触发\n\n文档事件包括：\n\n*   `readystatechange`\
    \ — 当就绪状态改变时触发\n*   `DOMContentLoaded` — 当网页加载完成但所有资源尚未下载时触发\n\n拖拽事件包括：\n\n* \
    \  `drag` — 当源对象被拖拽时触发\n*   `dragstart` — 当源对象开始被拖拽时触发\n*   `dragend` — 当用户释放被拖拽对象上的鼠标时在源对象上触发\n\
    *   `dragenter` — 当被拖拽元素进入放置目标时触发\n*   `dragleave` — 当对象移出放置目标时触发\n*   `dragover`\
    \ — 当对象被拖拽经过放置目标时触发\n*   `drop` — 当对象被放置时触发\n\n## 事件流\n\n事件在 DOM 中传播。\n\n它们从起源元素一直传播到根元素对象。这被称为冒泡阶段。\n\
    \n因此，当我们在祖先对象上注册监听器时，它们也会运行。\n\n还有捕获阶段，它与冒泡阶段相反。\n\n## 自定义事件\n\n我们可以在 JavaScript\
    \ 代码中触发自定义事件。\n\n为此，我们可以使用 `createEvent` 方法，然后使用 `addEventListener` 来监听该事件。\n\n\
    例如，如果我们有一个按钮：\n\n```\n<button>\n  click me\n</button>\n```\n\n我们可以编写：\n\n```\n\
    const button = document.querySelector('button');\nconst customEvent = document.createEvent('CustomEvent');\n\
    button.addEventListener('hello', (event) => {\n  console.log(event.detail.foo)\n\
    }, false);\n\ncustomEvent.initCustomEvent('hello', true, false, {\n  foo: 'bar'\n\
    });\n\nbutton.dispatchEvent(customEvent);\n```\n\n"
- fmt: "\nWe called `createEvent` to create a custom event. We pass in `'CustomEvent'`\
    \ to create a custom event.\n\nThen we called `initCustomEvent` to initialize\
    \ the custom event with data.\n\nNext, we called `dispatchEvent` to trigger the\
    \ event.\n\nThen in the event handler we passed into `addEventListener` , we log\
    \ the data which in the `detail` property.\n\nSo we get `'bar'` when we access\
    \ the `foo` property.\n\n## Simulating or Trigger Mouse Events\n\nWe can trigger\
    \ mouse events by using the `initMouseEvent` method.\n\nFor instance, if we have:\n\
    \n```\n<button>\n  click me\n</button>\n```\n\nWe can write:\n\n```\nconst button\
    \ = document.querySelector('button');\nbutton.addEventListener('click', (event)\
    \ => {\n  console.log(event);\n}, false);\n\nconst simulatedClick = document.createEvent('MouseEvents');\n\
    \nsimulatedClick.initMouseEvent('click', true, true, document.defaultView, 0,\
    \ 0, 0, 0, 0, false, false, false, 0, null, null);\n\nbutton.dispatchEvent(simulatedClick);\n\
    ```\n\nWe called `createEvent` with the `'MouseEvents'` .\n\nThen we call the\
    \ `initMouse` event with it. It takes many arguments.\n\nThey the arguments are\
    \ in the following order:\n\n*   `type` — type of mouse event we want to trigger\n\
    \n*   `canBubble` — indicates whether the event bubbles or not\n\n*   `cancelable`\
    \ — indicates whether the event is cancelable or not\n\n*   `view` — the abstract\
    \ view of the event, which should be `window`\n\n*   `detail` — click count\n\n\
    *   `screenX` — the event’s x coordinate\n\n*   `screenY` — the event’s y coordinate\n\
    \n*   `clientX` — the event client’s x coordinate\n\n*   `clientY` — the event\
    \ client’s y coordinate\n\n*   `ctrlKey` — whether the Ctrl key is pressed during\
    \ the event\n\n*   `altKey` — whether the Alt key is pressed during the event\n\
    \n*   `shiftKey` — whether the Shift key is pressed during the event\n\n*   `metaKey`\
    \ — whether the meta (Windows / Command) key is pressed during the event\n\n*\
    \   `button` — mouse button\n\n*   `relatedTarget` — related event target\n\n\
    This is a deprecated API so other solutions should be considered.\n\n## Event\
    \ Delegation\n\nWe can use one event handler to listen to events originating from\
    \ a different sources.\n\nFor instance, if we have:\n\n```\n<button>\n  button\
    \ 1\n</button>\n<button>\n  button 2\n</button>\n<button>\n  button 3\n</button>\n\
    ```\n\nWe can write:\n\n```\ndocument.addEventListener('click', (event) => {\n\
    \  if (event.target.tagName.toLowerCase() === 'button') {\n    console.log(event.target.textContent);\n\
    \  }\n}, false);\n```\n\nWe listen to the click event on the whole page with `document.addEventListener`\
    \ .\n\nThen get the element where the event originated with `event.target` .\n\
    \nIf we clicked a button, then we log the text content.\n\n## CSSStyleRule Overview\n\
    \nA `CSSStyleRule` object represents each CSS rule in a style sheet,\n\nIt’s the\
    \ interface to the CSS properties and values attached to the selector.\n\nTo access\
    \ them, if we have:\n\n```\n<style id='styles'>\n  body {\n    background-color:\
    \ orange;\n    margin: 20px;\n  }\n\n  p {\n    font-weight: 20px;\n    color:\
    \ blue;\n  }\n</style>\n```\n\nThen we can write:\n\n```\nconst styles = document.querySelector('#styles');\n\
    console.dir(styles.sheet.cssRules);\n```\n\nto get the CSS rules from the `style`\
    \ element.\n\n## CSSStyleRule Properties and Methods\n\nA `CSSStyleRule` has properties\
    \ and methods of its own.\n\nIt has the following properties:\n\n*   `cssText`\
    \ — the text of the CSS rule\n\n*   `parentRule` — the rule that’s the parent\
    \ of the given style block\n\n*   `parentStylesSheet` — parent style sheet object\n\
    \n*   `selectorText` — the selector for the rule\n\n*   `style` — the style for\
    \ the rule\n\n*   `type` — the type of rule, which is CSS rule, and the value\
    \ is 1\n\nFor instance, we can write:\n\n```\nconst styles = document.querySelector('#styles');\n\
    console.dir(styles.sheet.cssRules[0].cssText);\n```\n\nThen we get the styles\
    \ for the body element since that’s the first entry.\n\n## Getting a List of CSS\
    \ Rules in a Style Sheet\n\nThe `cssRules` has the list of CSS rules of the style\
    \ sheet.\n\nFor instance, if we have the same style elements as the previous example,\
    \ we write:\n\n```\nconst styles = document.querySelector('#styles');\nconsole.dir(styles.sheet.cssRules);\n\
    ```\n\nto get all the `cssRules` .\n\n## Inserting or Deleting CSS Rules\n\n`insertRule`\
    \ lets us insert a CSS rule in the style sheet.\n\n`deleteRule` lets us remove\
    \ them.\n\nFor example, if we have a style element:\n\n```\n<style id='styles'>\n\
    \  body {\n    background-color: orange;\n    margin: 20px;\n  }\n\n  p {\n  \
    \  font-weight: 20px;\n    color: blue;\n  }\n</style>\n```\n\nWe can write:\n\
    \n```\nconst styles = document.querySelector('#styles');\nstyles.sheet.insertRule('p\
    \ { color:green }', 1);\n```\n\nThen we added a new CSS rule for p tags, which\
    \ is overridden by the existing rule.\n\nWe can delete the old rule by writing:\n\
    \n```\nstyles.sheet.deleteRule(1);\n```\n\nNow our new rule is the rule for p\
    \ elements on the page.\n\nAll we did is to pass in the index for the rule to\
    \ remove.\n\n## Editing the Value of a CSSStyleRule\n\nWe can assign a value to\
    \ the `style` property to change the style value.\n\nFor example, if we have:\n\
    \n```\n<style id='styles'>\n  body {\n    background-color: orange;\n    margin:\
    \ 20px;\n  }\n\n  p {\n    font-weight: 20px;\n    color: blue;\n  }\n</style>\n\
    <p>\n  foo\n</p>\n```\n\nWe can write:\n\n```\nconst styles = document.querySelector('#styles');\n\
    styles.sheet.cssRules[1].style.color = 'green';\n```\n\nto set the p elements’\
    \ color to green.\n\n## Create a New Inline CSS Style Sheets\n\nWe can add new\
    \ styles to a style element by using the `innerHTML` property.\n\nFor example,\
    \ if we have:\n\n```\nconst style = document.createElement('style');\nstyle.innerHTML\
    \ = 'body { color: orange }';document.querySelector('head').appendChild(style);\n\
    ```\n\nNow all the content of the body will be orange since we have a style element\
    \ with that style added.\n\n## Add External Style Sheets Programmatically\n\n\
    Adding external style sheets programmatically can be done as we did with adding\
    \ style tags.\n\nTo do it, we just use `createElement` :\n\n```\nconst link =\
    \ document.createElement('link');\nlink.setAttribute('rel', 'stylesheet');\nlink.setAttribute('type',\
    \ 'text/css');\nlink.setAttribute('id', 'link');\nlink.setAttribute('href', 'https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css');\n\
    ```\n\nWe added a new link element with the Bootstrap stylesheet.\n\n## Disabling\
    \ or Enabling Stylesheets\n\n`disabled` property is a property that we can set\
    \ on stylesheets to toggle on and off stylesheets.\n\nIf we have a link element:\n\
    \n```\n<link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
    >\n```\n\nThen we can toggle on or off by writing:\n\n```\ndocument.querySelector('link').disabled\
    \ = true;\n```\n\nNow we disabled it. To enable it, we can write:\n\n```\ndocument.querySelector('link').disabled\
    \ = false;\n```\n\n## Inserting and Running JavaScript\n\nWe can insert JavaScript\
    \ into an HTML document.\n\nJavaScript code are always inside script tags as an\
    \ external file or inline code.\n\nscript elements don’t have any required attributes.\n\
    \nSelf-closing script tags should also be avoided.\n\nTrying to include an external\
    \ script file that manipulates a script element on the page will result in the\
    \ one on the page being ignored.\n\nFor instance, we can write:\n\n```\n<script>\n\
    console.log('hello');\n</script>\n```\n\nto include a script tag.\n\n## JavaScript\
    \ Loads Synchronously\n\nThe default option for loading scripts is to load them\
    \ synchronously.\n\nThis means that they’ll block the rendering and downloading\
    \ of other scripts if they exist.\n\nIf a script is eternal to the document is\
    \ blocking the loading of everything else, then the script has to be downloaded\
    \ first before parsing, which means it’ll be slower.\n\n## Opening Popup Windows\n\
    \nWe can open popup windows with the `window.open` method.\n\nFor example, we\
    \ can write:\n\n```\nconst monkeyWindow = window.open();\n```\n\nTo add some content\
    \ to the window, we can write:\n\n```\nconst monkeyWindow = window.open();\nconst\
    \ windowContent = `<h1>hello world</h1>`;\nmonkeyWindow.document.write(windowContent);\n\
    ```\n"
