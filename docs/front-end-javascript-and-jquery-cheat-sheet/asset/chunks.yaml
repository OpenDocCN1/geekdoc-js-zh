  trans: "\n```\npets.splice(2, 2, \"pig\", \"duck\", \"emu\");\n```\n\n第一个参数是要插入的起始索引。\
    \  \n第二个参数是要删除的元素数量。  \n后续参数是我们想要替换被删除元素而插入的元素。\n\n`slice` 方法允许我们复制任意位置的一个或多个连续元素，并将它们放入一个新数组中。\n\
    \n例如，我们可以这样写：\n\n```\nlet pets = animals.slice(2, 4);\n```\n\n从 `animals` 中复制索引\
    \ 2 到 3 的元素，并返回该数组。  \n第一个参数是要复制的起始索引。第二个参数是结束索引的后一个位置。  \n第二个索引本身不包含在范围内。\n\n\
    ## for 循环\n\nJavaScript 提供了循环，以便我们可以重复运行代码。\n\n为此，我们可以使用 `for` 循环：\n\n```\nfor\
    \ (let i = 0; i <= 10; i++) {\n  if (city === cleanestCities[i]) {\n    console.log(\"\
    It's one of the cleanest cities\");\n  }\n}\n```\n\n`for` 循环由头部组成，头部包含起始索引、继续运行循环的条件以及更新索引的语句。\
    \  \n在循环体中，我们可以执行想要的操作。\n\n在上面的例子中，我们检查 `city` 是否等于 `cleanestCities[i]`。  \n如果为\
    \ `true`，则通过 `console.log` 输出一条消息。  \n循环索引用于访问数组元素，同时也用于使循环向结束条件（即 `i <= 10`）推进。\
    \  \n如果 `i` 大于 10，则循环停止。\n\n我们还可以在 `for` 循环中设置标志，以便记录某些信息。\n\n例如，我们可以这样写：\n\n\
    ```\nlet matchFound = false;\nfor (let i = 0; i <= 10; i++) {\n  if (city ===\
    \ cleanestCities[i]) {\n    matchFound = true;\n    console.log(\"It's one of\
    \ the cleanest cities\");\n  }\n}\n```\n\n一旦我们从 `cleanestCities` 中找到等于 `city`\
    \ 的值，就将 `matchFound` 设置为 `true`。\n\n## 数学表达式\n\n我们应该消除 JavaScript 数学表达式中的歧义。\n\
    \n例如，如果我们有：\n\n```\nlet totalCost = 1 + 3 * 10;\n```\n\n那么读者可能会对哪个运算先执行感到困惑。 \
    \ \nJavaScript 对运算符有优先级规则。它们通常遵循与普通数学相同的规则。  \n然而，我们可以通过将具有更高优先级的表达式用括号括起来，让每个人的生活更轻松。\n\
    \n例如，我们可以这样写：\n\n```\nlet totalCost = 1 + (3 * 10);\n```\n\n这样我们将乘法表达式括起来。  \n\
    现在我们知道乘法运算先执行。  \n如果我们移动括号，那么运算顺序就会不同。\n\n例如，如果我们有：\n\n```\nlet totalCost = (1\
    \ + 3) * 10;\n```\n\n那么加法会在乘法之前执行。\n\n## 拼接字符串\n\n字符串是文本值，可以通过拼接组合在一起。\n\n例如，我们可以这样写：\n\
    \n```\nalert(\"Thanks, \" + userName + \"!\");\n```\n\n使用 `+` 运算符将 3 个表达式组合成 1\
    \ 个。  \n如果 `userName` 是 `'james'`，那么我们会得到：\n\n```\n'Thanks, james!'\n```\n\n这三个部分组合在一起，作为一个字符串返回。\
    \  \n我们可以将字符串与任何其他 JavaScript 表达式拼接。  \n它们会自动转换为字符串，以便可以拼接在一起。\n\n所以如果我们有：\n\n\
    ```\nalert(\"2 plus 3 equals \" + 2 + 3);\n```\n\n那么我们会得到 `'2 plus 3 equals 23'`。\
    \  \n这是因为 2 和 3 在拼接之前被转换成了字符串。\n\n一种更便捷的组合字符串和其他表达式的方法是使用模板字面量。\n\n例如，我们可以这样写：\n\
    \n```\nalert(`2 plus 3 equals ${2 + 3}`);\n```\n\n我们将引号替换为反引号。  \n然后使用 `${}` 符号包围\
    \ JavaScript 表达式，以插入这些表达式。  \n这样，`2 + 3` 返回一个数字，因为它们与字符串拼接在一起。  \n所以我们得到 `'2 plus\
    \ 3 equals 5'`。\n\n## 提示框\n\n提示框允许我们向用户询问一些信息，并提供一个用于回答的输入字段。\n\n例如，我们可以这样写：\n\
    \n```\nlet name = prompt(\"Your name?\", \"mary\");\n```\n\n我们调用 `prompt`，第一个参数是问题字符串。\
    \  \n第二个参数是返回的默认答案。  \n如果调用它，浏览器会显示一个带有输入框的提示框，让我们输入答案。  \n然后当我们点击确定时，如果输入了内容，则返回该响应。\
    \  \n否则，返回默认答案。  \n如果我们在第二个参数中省略了默认答案，并且没有输入任何内容，则返回 `null`。  \n`prompt` 是一个全局函数，所以\
    \ `window.prompt` 与 `prompt` 相同。  \n但我们只需写 `prompt` 即可。\n\n## 变量命名\n\n变量名不能以数字开头，但可以在中间包含数字。\n\
    \n例如，我们可以这样写：\n\n```\nlet name1 = \"james\";\n```\n\n但不能这样写：\n\n```\nlet 1name\
    \ = \"james\";\n```\n\nJavaScript 变量命名还有更多规则。  \n变量名不能包含空格。  \n变量名只能包含字母、数字、美元符号和下划线。\
    \  \n变量名不能是 JavaScript 保留关键字，但可以包含它们。  \n可以使用大写字母，但必须注意变量名是区分大小写的。  \n所以 `name`\
    \ 与 `Name` 不同。  \nJavaScript 变量名通常采用驼峰命名法。它们让我们可以形成由多个单词组成的变量，并且可以轻松阅读。  \n因此，我们可以编写像\
    \ `firstName` 这样的变量名，使变量名中的两个单词清晰明了。\n\n## 数学表达式\n\n大多数 JavaScript 程序都会进行数学运算。因此，JavaScript\
    \ 提供了各种常见数学运算的运算符。\n\n例如，我们可以使用 `+` 运算符进行加法：\n\n```\nlet num = 2 + 2;\n```\n\n\
    要执行减法，可以使用 `-` 运算符：\n\n```\nlet num = 2 - 2;\n```\n\n乘法使用 `*` 运算符：\n\n```\nlet\
    \ num = 2 * 2;\n```\n\n除法使用 `/` 运算符：\n\n```\nlet num = 2 / 2;\n```\n\n还有 `%` 取模运算符，用于求左操作数除以右操作数的余数。\n\
    \n例如，我们可以这样写：\n\n```\nlet num = 2 % 2;\n```\n\n我们得到 0，因为 2 可以被自身整除。\n\n指数运算符用\
    \ `**` 表示。例如，我们可以这样使用它：\n\n```\nlet num = 2 ** 2;\n```\n\n这样将 2 提升到 2 次幂。\n\n\
    `++` 运算符将变量的值加 1，并将结果赋给该变量。\n\n例如：\n\n```\nnum++;\n```\n\n等同于：\n\n```\nnum = num\
    \ + 1;\n```\n\n我们可以将表达式与赋值运算符一起使用，但可能会得到意想不到的结果。\n\n例如，如果我们有：\n\n```\nlet num\
    \ = 1;\nlet newNum = num++;\n```\n\n那么 `newNum` 是 1，因为返回的是 `num` 的原始值。\n\n另一方面，如果我们有：\n\
    \n```\nlet num = 1;\nlet newNum = ++num;\n```\n\n那么 `newNum` 是 2，因为如果 `++` 在 `num`\
    \ 之前，则返回 `num` 的最新值。\n\n同样，JavaScript 有 `--` 运算符，用于将变量减 1，并将最新值赋给该变量。\n\n例如，我们可以这样写：\n\
    \n```\nlet num = 1;\nlet newNum = num--;\n```\n\n对于 `newNum` 我们得到 1，而：\n\n```\n\
    let num = 1;\nlet newNum = --num;\n```\n\n则对于 `newNum` 我们得到 0。  \n值的返回方式与 `++`\
    \ 相同。\n\n## 控制小数位数\n\n我们可以使用 `toFixed` 方法控制小数位数。\n\n例如，如果我们有：\n\n```\nlet total\
    \ = (8.8888).toFixed(2);\n```\n\n那么 `total` 是 `'8.89'`。`toFixed` 接受要四舍五入的位数，并返回一个包含四舍五入后数字的字符串。\
    \  \n如果小数以 5 结尾，通常向上舍入。  \n但某些浏览器可能会向下舍入。\n\n## 获取当前日期和时间\n\n要获取当前日期和时间，我们可以使用\
    \ `new Date()` 创建一个新的 `Date` 实例。  \n然后我们可以通过编写以下代码将 `Date` 实例转换为字符串：\n\n```\n\
    let now = new Date();\nlet dateString = now.toString();\n```\n\n要获取星期几，我们调用 `getDay`\
    \ 方法：\n\n```\nlet now = new Date();\nlet day = now.getDay();\n```\n\n它返回一个从 0\
    \ 到 6 的数字，其中 0 表示星期日，6 表示星期六。\n\n如果我们想显示更易读的日期，可以这样写：\n\n"
- fmt: "\n```\nlet dayNames = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"\
    , \"Sat\"]\nlet now = new Date();\nlet day = now.getDay();\nlet dayName = dayNames[day];\n\
    ```\n\nWe can use `day` as the index of `dayNames` to get the English version\
    \ of the day of the week.\n\n## Extracting Parts of Date and Time\n\nThe `Date`\
    \ instance comes with various methods to get various parts of a date and time.\n\
    \n`getMonth` returns the month of the date from 0 to 11, with 0 being January\
    \ and 11 being December.\n\n`getDate` gives us the number for the day of the month.\n\
    \n`getFullYear` returns the 4 digit version of the year.\n\n`getHours` gives us\
    \ a number from 0 to 23, which corresponds to midnight and 11pm.\n\n`getMinutes`\
    \ returns the minutes of the hour from 0 to 59.\n\n`getSeconds` returns the seconds\
    \ of the minute from 0 to 59.\n\nAnd `getMilliseconds` returns a number from 0\
    \ to 999.\n\n`getTime` gives us the number of milliseconds that have elapsed since\
    \ Jan 1, 1970 midnight UTC.\n\nWe can call them all from a date instance. For\
    \ example, we can write:\n\n```\nlet now = new Date();\nlet day = now.getMilliseconds();\n\
    ```\n\n## Specify Date and Time\n\nWe can specify date and time with the `Date`\
    \ constructor.\n\nTo return the current date and time, we write:\n\n```\nlet today\
    \ = new Date();\n```\n\nAnd we can calculate the number of days difference by\
    \ subtracting the timestamp between 2 dates:\n\n```\nlet msToday = new Date().getTime();\n\
    let msAnotherDay = new Date(2029, 1, 1).getTime()\nlet msDiff = msAnotherDay -\
    \ msToday;\n```\n\nThen to get the number of days difference, we can write:\n\n\
    ```\nlet daysDiff = msDiff / (1000 * 60 * 60 * 24);\n```\n\nIf we want to return\
    \ the round the days to a whole number, we round down with `Math.floor`:\n\n```\n\
    daysDiff = Math.floor(daysDiff);\n```\n\n## Change Date and Time\n\nThe `Date`\
    \ instance lets us change various parts of the date and time.\n\n`setFullYear`\
    \ lets us set the year of a `Date` instance.\n\n`setMonth` lets us set the month\
    \ of a `Date` instance. It accepts a number from 0 to 11, with 0 being January\
    \ and 11 being December.\n\n`setDate` lets us set the day of the month.\n\n`setHours`\
    \ lets us set the minutes past an hour.\n\n`setSeconds` lets us set the seconds\
    \ past the minute.\n\nAnd `setMilliseconds` lets us set the milliseconds past\
    \ the second.\n\nFor example, we can call `setFullYear` by writing:\n\n```\nlet\
    \ d = new Date();\nd.setFullYear(2040);\n```\n\nor:\n\n```\nlet d = new Date();\n\
    d.setMonth(11);\n```\n\nThe rest can be called the same way.\n\n## Functions\n\
    \nFunctions are blocks of code that we can use repeatedly to do what we want.\n\
    \nWe called functions before with `setFullYear`, `setMonth`, etc.\n\nThey may\
    \ take 0 or more arguments.\n\nFor example, we can create our own `tellTime` function\
    \ by writing:\n\n```\nfunction tellTime() {\n  let now = new Date();\n  let jr\
    \ = now.getHours();\n  let min = now.getMinutes();\n  alert(`${hr}:${min}`);\n\
    }\n```\n\nWe called `getHours` to get the hours and `getMinutes` to get the minutes.\n\
    \n## Pass Data to Functions\n\nFunctions can have parameters so we can pass data\
    \ to them.\n\nFor example, we can write:\n\n```\nfunction greetUser(greeting)\
    \ {\n  alert(greeting);\n}\n```\n\nThe `greetUser` method accepts the `greeting`\
    \ parameter, and we use the value as the argument for the `alert` function.\n\n\
    This way, we can specify the message for the alert.\n\nWe can call our function\
    \ by writing:\n\n```\ngreetUser('hello james');\n```\n\nNow we should see an alert\
    \ with the ‘hello james’ text displayed.\n\nWe can separate multiple parameters\
    \ and arguments with commas. For example, we can write:\n\n```\nfunction showMessage(greeting,\
    \ name) {\n  alert(`${greeting}, ${name}`);\n}\n```\n\nThe `showMessage` function\
    \ has the `greeting` and `name` parameters.\n\nThen we can call `showMessage`\
    \ by writing:\n\n```\nshowMessage('hello', 'mary');\n```\n\nWith parameters, we\
    \ can customize how functions can be called.\n\n## Return Data in Functions\n\n\
    If we want to get the data computed by functions, then we add the `return` statement\
    \ to return the data we want from the function.\n\nFor example, we can write:\n\
    \n```\nfunction getTotal(subtTotal, taxRate) {\n  return subTotal * (1 + taxRate);\n\
    }\n```\n\nWe created the `getTotal` function that takes the `subTotal` and `taxRate`\
    \ parameters.\n\nThen we return the computed result by using the `return` statement.\n\
    \nWe can call the `getTotal` function by writing:\n\n```\nconst total = getTotal(100,\
    \ 0.05);\n```\n\nWe pass in the numbers for the `subTotal` and `taxRate` and assign\
    \ the returned value to `total`.\n\nTherefore, `total` is 105.\n\n## do…while\
    \ Loops\n\nWe can use the `do...while` loop to repeatedly run code.\n\nThe `do`\
    \ block is always run, so the first iteration is always run.\n\nFor example, we\
    \ can write:\n\n```\nlet i = 0;\ndo {\n  console.log(i);\n  i++;\n} while (i <=\
    \ 3);\n```\n\nThe `do` block is always run because the `while` condition is checked\
    \ after the iteration of a loop is done.\n\n## Script Tags\n\nTo run JavaScript\
    \ code in the browser, we have to add script tags to our code.\n\nFor example,\
    \ we can write:\n\n```\n<script>\n  function sayHi() {\n    alert(\"hi\");\n \
    \ }\n\n  function sayBye() {\n    alert(\"bye\");\n  }\n</script>\n```\n\nWe define\
    \ the `sayHi` and `sayBye` functions in the script tag.\n\nWe can have any JavaScript\
    \ code in our script tags.\n\nJavaScript code is just text, so we can add them\
    \ to HTML files easily, since they’re also text.\n\nIf we have lots of code in\
    \ between the script tags, then we should move them to their own file.\n\nFor\
    \ example, we can write:\n\n```\n<script src=\"script.js\"></script>\n```\n\n\
    We create a `script.js` file and then reference it with the `src` attribute.\n\
    \nThis way, we can keep our code files short.\n\n## Comments\n\nWe can add comments\
    \ to our JavaScript code to explain what we’re doing what our code.\n\nFor example,\
    \ we can write:\n\n```\n// This is a comment\nfor (let i = 0; i < 10; i++) {\n\
    \  console.log(i);\n}\n```\n\nThe `//` indicates the start of a comment. It’ll\
    \ be ignored by the browser.\n\nWe can write multiline comments by writing:\n\n\
    ```\n/*\n  Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas at\
    \ volutpat ipsum, dapibus tincidunt nisl. Donec vestibulum ultricies laoreet.\
    \ Suspendisse sit amet faucibus justo.\n*/\nfor (let i = 0; i < 10; i++) {\n \
