    ).click(function() {\n\n  $(\"#target\").keydown();\n\n});\n```\n\n当点击 ID 为 `other`\
    \ 的 div 时，触发输入框上的 `keydown` 事件。本文中，我们将探讨如何在 Web 应用中使用 jQuery。\n\n## `.parents()`\n\
    \n`.parents()` 方法允许我们获取当前匹配元素集合中每个元素的祖先元素。\n\n我们可以通过选择器来过滤这些祖先元素。\n\n例如，如果我们有以下\
    \ HTML：\n\n```\n<ul class=\"level-1\">\n\n  <li class=\"item-i\">I</li>\n\n  <li\
    \ class=\"item-ii\">II\n\n    <ul class=\"level-2\">\n\n      <li class=\"item-a\"\
    >A</li>\n\n      <li class=\"item-b\">B\n\n        <ul class=\"level-3\">\n\n\
    \          <li class=\"item-1\">1</li>\n\n          <li class=\"item-2\">2</li>\n\
    \n          <li class=\"item-3\">3</li>\n\n        </ul>\n\n      </li>\n\n  \
    \    <li class=\"item-c\">C</li>\n\n    </ul>\n\n  </li>\n\n  <li class=\"item-iii\"\
    >III</li>\n\n</ul>\n```\n\n那么我们可以通过以下代码获取 class 为 `item-a` 的 `li` 的所有祖先元素：\n\n\
    ```\n$(\"li.item-a\").parents().css(\"background-color\", \"red\");\n```\n\n然后为它们添加红色背景。\n\
    \n## `.parentsUntil()`\n\n`.parentsUntil()` 方法获取当前匹配元素集合中每个元素的祖先元素，直到（但不包括）由选择器、DOM\
    \ 节点或 jQuery 对象匹配的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<ul class=\"level-1 yes\">\n\
    \n  <li class=\"item-i\">I</li>\n\n  <li class=\"item-ii\">II\n\n    <ul class=\"\
    level-2 yes\">\n\n      <li class=\"item-a\">A</li>\n\n      <li class=\"item-b\"\
    >B\n\n        <ul class=\"level-3\">\n\n          <li class=\"item-1\">1</li>\n\
    \n          <li class=\"item-2\">2</li>\n\n          <li class=\"item-3\">3</li>\n\
    \n        </ul>\n\n      </li>\n\n      <li class=\"item-c\">C</li>\n\n    </ul>\n\
    \n  </li>\n\n  <li class=\"item-iii\">III</li>\n\n</ul>\n```\n\n那么我们可以获取 class\
    \ 为 `item-a` 的 `li` 的祖先元素，直到（但不包括）class 为 `level-1` 的 `li`，并为它们添加背景色：\n\n```\n\
    $(\"li.item-a\")\n\n  .parentsUntil(\".level-1\")\n\n  .css(\"background-color\"\
    , \"red\");\n```\n\n## `:password` 选择器\n\n`:password` 选择器允许我们选择所有 `type` 为 password\
    \ 的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<form>\n\n  <input type=\"button\" value=\"\
    Input Button\">\n\n  <input type=\"checkbox\">\n\n  <input type=\"file\">\n\n\
    \  <input type=\"hidden\">\n\n  <input type=\"password\">\n\n  <select>\n\n  \
    \  <option>Option</option>\n\n  </select>\n\n  <textarea></textarea>\n\n  <button>Button</button>\n\
    \n</form>\n```\n\n那么我们可以这样写：\n\n```\n$(\"input:password\").css({\n\n  background:\
    \ \"yellow\",\n\n  border: \"3px red solid\"\n\n});\n```\n\n为 `type` 为 password\
    \ 的输入框添加黄色背景和红色边框。\n\n## `.position()`\n\n`.position()` 方法获取匹配元素集合中第一个元素相对于其偏移父元素的当前坐标。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<p>Hello</p>\n```\n\n那么我们可以通过以下代码获取 `p` 元素的位置：\n\n\
    ```\nconst p = $(\"p\").first();\n\nconst position = p.position();\n\nconsole.log(position)\n\
    ```\n\n得到的结果为：\n\n```\n{top: 0, left: 8}\n```\n\n作为 `position` 的值。\n\n## `.prepend()`\n\
    \n`.prepend()` 方法将内容插入到匹配元素集合中每个元素的开头。\n\n例如，如果我们有以下 HTML：\n\n```\n<div class=\"\
    container\">\n\n  <div class=\"inner\">Hello</div>\n\n  <div class=\"inner\">Goodbye</div>\n\
    \n</div>\n```\n\n那么我们可以通过以下代码在每个 class 为 `inner` 的 div 的文本节点之前添加一个元素：\n\n```\n\
    $(\".inner\").prepend(\"<p>Test</p>\");\n```\n\n## `.prependTo()`\n\n`.prependTo()`\
    \ 方法允许我们将一个元素前置到匹配元素集合中。\n\n例如，如果我们有以下 HTML：\n\n```\n<div class=\"container\"\
    >\n\n  <div class=\"inner\">Hello</div>\n\n  <div class=\"inner\">Goodbye</div>\n\
    \n</div>\n```\n\n那么我们可以通过以下代码将一个 `p` 元素作为子元素前置到每个 class 为 `inner` 的 div 中：\n\n\
    ```\n$(\"<p>Test</p>\").prependTo(\".inner\");\n```\n\n## `jQuery.merge()`\n\n\
    `jQuery.merge()` 方法将两个数组的内容合并到第一个数组中。\n\n例如，我们可以这样使用它：\n\n```\nconst arr = $.merge([0,\
    \ 1, 2], [2, 3, 4])\n\nconsole.log(arr);\n```\n\n那么 `arr` 的值为：\n\n```\n[0, 1,\
    \ 2, 2, 3, 4]\n```\n\n## `jQuery.noConflict()`\n\n`jQuery.noConflict()` 方法放弃 jQuery\
    \ 对 `$` 变量的控制。\n\n我们可以这样使用它：\n\n```\njQuery.noConflict();\n\njQuery( \"div p\"\
    \ ).hide();\n```\n\n调用 `noConflict`。\n\n然后我们可以用 `jQuery` 代替 `$` 来调用 jQuery。\n\n\
    ## `jQuery.noop()`\n\n`jQuery.noop()` 方法返回一个空函数。\n\n## `jQuery.param()`\n\n`jQuery.param()`\
    \ 方法将对象的键值对转换为查询字符串。\n\n例如，我们可以这样写：\n\n```\nconst params = {\n\n  width: 1680,\n\
    \n  height: 1050\n\n};\n\nconst str = jQuery.param(params);\n\nconsole.log(str)\n\
    ```\n\n那么 `str` 的值为 `'width=1680&height=1050'`。\n\n## `jQuery.parseHTML()`\n\n\
    `jQuery.parseHTML()` 方法允许我们将字符串解析为 DOM 节点数组。\n\n例如，如果我们有以下 HTML：\n\n```\n<div\
    \ id=\"log\">\n\n  <h3>Content:</h3>\n\n</div>\n```\n\n那么我们可以通过以下代码将解析后的 HTML\
    \ 追加到 ID 为 `log` 的 div 中：\n\n```\nconst str = \"hello, <b>my name is</b> jQuery.\"\
    ;\n\nconst html = $.parseHTML(str);\n\n$(\"#log\").append(html);\n```\n\n我们使用\
    \ `$.parseHTML` 解析 HTML 字符串，然后调用 `append` 追加内容。\n\n## `jQuery.parseJSON()`\n\n\
    我们可以使用 `jQuery.parseJSON()` 方法将 JSON 字符串解析为对象。\n\n例如，如果我们有以下代码：\n\n```\nconst\
    \ obj = jQuery.parseJSON('{ \"name\": \"John\" }');\n\nconsole.log(obj.name ===\
    \ \"John\");\n```\n\n那么我们将字符串解析为 `obj` 对象。\n\n`obj.name` 的值为 `'John'`。\n\n因此 console.log\
    \ 输出 `true`。\n\n## `jQuery.parseXML()`\n\n`jQuery.parseXML()` 方法允许我们将 XML 解析为对象。\n\
    \n例如，我们可以这样使用它：\n\n```\nconst xml = \"<rss version='2.0'><channel><title>RSS Title</title></channel></rss>\"\
    ,\n\n  xmlDoc = $.parseXML(xml),\n\n  $xml = $(xmlDoc),\n\n  title = $xml.find(\"\
    title\");\n\nconsole.log(title.text())\n```\n\n"
