    \nThe `.mouseover()` method lets us add an event listener for the `mouseover`\
    \ event or trigger it.\n\nFor example, if we have:\n\n```\n\n<div id=\"target\"\
    >\n\n  Click here\n\n</div>\n\n<div id=\"other\">\n\n  Trigger the handler\n\n\
    </div>\n\n```\n\nThen we can listen to the `mouswdown` event on the div with ID\
    \ `target` by writing:\n\n```\n\n$(\"#target\").mouseover(function() {\n\n  console.log(\"\
