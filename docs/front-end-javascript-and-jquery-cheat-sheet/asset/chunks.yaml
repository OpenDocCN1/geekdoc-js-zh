    \ the paragraphs when we click the button by writing:\n\n```\n\nlet p;\n\n$(\"\
    button\").click(function() {\n\n  if (p) {\n\n    p.appendTo(\"body\");\n\n  \
    \  p = null;\n\n  } else {\n\n    p = $(\"p\").detach();\n\n  }\n\n});\n\n```\n\
    \nIn the `click` handler, we check if there’s any `p` elements.\n\nIf there are\
    \ any, then we call `detach` to remove them. The remove elements are returned\
    \ by `detach` .\n\nIf there isn’t then we attach the `p` elements to the `body`\
    \ and set `p` to `null` .\n\n## `.die()`\n\nThe `die` method removes event handlers\
    \ previous attached using the `live` method.\n\nFor example, we can write:\n\n\
    ```\n\n$(\"p\").die();\n\n```\n\nto unbind all event handlers bound to `p` elements.\n\
    \nWe can also unbind only `click` event handlers by writing:\n\n```\n\n$(\"p\"\
    ).die('click');\n\n```\n\nAlso, we can unbind a single event handler by writing:\n\
    \n```\n\nconst foo = function() {\n\n};\n\n$(\"p\").live(\"click\", foo);\n\n\
    $(\"p\").die(\"click\", foo);\n\n```\n\nWe remove the `foo` click handler with\
    \ the `die` method.\n\n## `:first-child` Selector\n\nWe can use the `:first-child`\
    \ selector to get the first child element.\n\nFor example, if we have the following\
    \ HTML:\n\n```\n\n<div>\n\n  <span>Glen,</span>\n\n  <span>Jane,</span>\n\n  <span>Ralph</span>\n\
    \n</div>\n\n```\n\nAnd the following CSS:\n\n```\n\n.green {\n\n  color: green\n\
