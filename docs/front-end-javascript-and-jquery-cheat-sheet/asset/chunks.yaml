  trans: "\n我们在 `monkeyWindow` 上调用 `document.write` 来显示内容。\n\n此外，我们还可以使用 `location.assign`\
    \ 方法显示某个 URL 的内容：\n\n```\nconst monkeyWindow = window.open();\nmonkeyWindow.location.assign(\"\
    https://www.google.com\");\n```\n\n现在我们应该能看到新窗口中显示了 Google 页面。\n\n我们也可以这样写：\n\n\
    ```\nconst monkeyWindow = window.open();\nmonkeyWindow.location.href = \"https://www.google.com\"\
    ;\n```\n\n来实现同样的效果。\n\n要关闭窗口，我们可以这样写：\n\n```\nconst monkeyWindow = window.open();\n\
    monkeyWindow.location.href = \"https://www.google.com\";\nmonkeyWindow.close();\n\
    ```\n\n# 控制窗口的大小和位置\n\n我们可以通过 `window.open` 的第三个参数中的字符串来设置弹出窗口的大小和位置。\n\n例如，我们可以这样写：\n\
    \n```\nconst monkeyWindow = window.open(\"https://www.google.com\", \"win1\",\
    \ \"width=420,height=380\");\n```\n\n现在窗口的宽度为 420px，高度为 380px。\n\n要改变它的位置，我们可以这样写：\n\
    \n```\nconst monkeyWindow = window.open(\"https://www.google.com\", \"win1\",\
    \ \"width=420,height=380,left=200,top=100\");\n```\n\n通过添加 `left` 和 `top` 键来设置位置。\n\
    \n# 表单验证\n\n我们可以为表单添加表单验证。\n\n例如，我们可以编写以下 HTML：\n\n```\n<form onSubmit=\"return\
    \ checkForLastName();\">\n  Please enter your last name.<br>\n  <input type=\"\
    text\" id=\"lastNameField\">\n  <input type=\"submit\" value=\"Submit\">\n</form>\n\
    ```\n\n然后添加以下 JavaScript 来实现验证：\n\n```\nconst checkForLastName = () => {\n  if\
    \ (document.getElementById(\"lastNameField\").value.length === 0) {\n    alert(\"\
    Please enter your last name\");\n    return false;\n  }\n}\n```\n\n在 `checkForLastName`\
    \ 函数中，我们获取 ID 为 `lastNameField` 的输入框的值。\n\n如果 `value` 的 `length` 为 0，则弹出提示。\n\n\
    `onSubmit` 属性值中的 `return` 确保我们阻止了默认的提交行为，同时 `checkForLastName` 中的 `return false`\
    \ 也起到了同样的作用，这样我们就可以运行 JavaScript 验证。\n\n为了改善用户体验，我们可以在元素上调用 `focus`：\n\n```\n\
    const checkForLastName = () => {\n  const lastNameField = document.getElementById(\"\
    lastNameField\")\n  if (lastNameField.value.length === 0) {\n    alert(\"Please\
    \ enter your last name\");\n    lastNameField.focus();\n    return false;\n  }\n\
    }\n```\n\n我们在输入元素上调用 `focus`，这样用户无需点击输入框即可直接输入文本。\n\n此外，我们还可以添加背景颜色，让用户更容易看到输入框：\n\
    \n```\nconst checkForLastName = () => {\n  const lastNameField = document.getElementById(\"\
    lastNameField\")\n  if (lastNameField.value.length === 0) {\n    alert(\"Please\
    \ enter your last name\");\n    lastNameField.focus();\n    lastNameField.style.background\
    \ = \"yellow\";\n    return false;\n  }\n  lastNameField.style.background = \"\
    white\";\n}\n```\n\n我们通过设置 `lastNameField.style.background` 属性来设置背景颜色。\n\n# 下拉菜单验证\n\
    \n我们可以为选择下拉菜单字段添加验证。\n\n例如，我们可以编写以下 HTML：\n\n```\n<form onSubmit=\"return checkForSelection();\"\
    >\n  <select id=\"fruits\">\n    <option value=\"\" selected=\"selected\">\n \
    \     SELECT A FRUIT</option>\n    <option value=\"apple\">apple</option>\n  \
    \  <option value=\"orange\">orange</option>\n    <option value=\"grape\">grape</option>\n\
    \  </select>\n  <br>\n  <input type=\"submit\" value=\"Submit Form\">\n</form>\n\
    ```\n\n然后添加以下 JavaScript：\n\n```\nconst checkForSelection = () => {\n  if (document.getElementById(\"\
    fruits\").selectedIndex === 0) {\n    alert(\"Please select a fruit.\");\n   \
    \ return false;\n  }\n}\n```\n\n我们添加了一个 select 元素，当点击“Submit Form”时，会运行 `checkForSelection`\
    \ 函数。\n\n我们添加了 `return` 关键字，以便阻止默认的提交行为，并让 `checkForSelection` 运行。\n\n# 单选按钮验证\n\
    \n此外，我们还可以为一组单选按钮添加验证。\n\n例如，我们可以编写以下 HTML：\n\n```\n<form onSubmit=\"return validateRadios();\"\
    >\n  <input type=\"radio\" name=\"r1\" value=\"apple\"> apple<br>\n  <input type=\"\
    radio\" name=\"r1\" value=\"orange\"> orange<br>\n  <input type=\"radio\" name=\"\
    r1\" value=\"grape\"> grape<br>\n  <input type=\"submit\" value=\"Submit Form\"\
    >\n</form>\n```\n\n以及以下 JavaScript：\n\n```\nconst validateRadios = () => {\n \
    \ const radios = document.getElementsByName(\"r1\");\n  for (const r of radios)\
    \ {\n    if (r.checked) {\n      return true;\n    }\n  }\n  alert(\"Please check\
    \ one.\");\n  return false;\n}\n```\n\n我们有一个表单，其中包含一组具有相同 `name` 属性值的单选按钮。\n\n\
    它们应该具有相同的名称，这样它们才会被视为同一组。\n\n当我们点击“Submit Form”按钮时，`validateRadios` 函数会运行。\n\n\
    在函数中，我们通过调用 `getElementsByName` 并传入单选按钮的 `name` 属性值来获取所有单选按钮。\n\n我们使用 for-of 循环遍历这些单选按钮。\n\
    \n如果其中一个被选中，则返回 `true`。\n\n否则，弹出提示，如果没有任何一个被选中，则返回 `false`。\n\n# 电子邮件验证\n\n我们可以通过使用正则表达式检查输入文本的格式来验证表单字段中的电子邮件地址。\n\
    \n例如，我们可以编写以下 HTML：\n\n```\n<form onSubmit=\"return validateEmail();\">\n  Please\
    \ enter your email.<br>\n  <input type=\"text\" id=\"emailField\">\n  <input type=\"\
    submit\" value=\"Submit\">\n</form>\n```\n\n并编写以下 JavaScript 代码：\n\n```\nconst\
    \ validateEmail = () => {\n  const emailField = document.getElementById(\"emailField\"\
    );\n  const regex = /^[w-.+]+@[a-zA-Z0-9\\. -]+.[a-zA-z0-9]{2,4}$/;\n  if (!(regex.test(emailField.value)))\
    \ {\n    alert(\"Please correct email address\");\n    return false;\n  }\n}\n\
    ```\n\n我们有一个 `validateEmail` 函数，它获取 ID 为 `emailField` 的输入框的值。\n\n然后我们调用 `regex.test`\
    \ 方法来检查输入的值是否匹配正则表达式格式。\n\n如果不匹配，则弹出提示并返回 `false`。\n\n`return` 关键字让我们阻止默认的提交行为。\n\
    \n# 处理事件\n\n我们可以为 HTML 元素附加事件监听器。\n\n例如，我们可以编写以下 HTML：\n\n```\n<input type=\"\
    button\" value=\"Click\" id='button1'>\n```\n\n并编写以下 JavaScript：\n\n```\nconst\
    \ b1 = document.getElementById(\"button1\");\nconst sayHello = () => {\n  alert('hello');\n\
    }\nb1.onclick = sayHello;\n```\n\n我们通过 `getElementById` 获取按钮。\n\n然后将 `onclick`\
    \ 属性设置为 `sayHello` 事件处理函数。\n\n该函数通过 `alert` 函数显示一个提示框。\n\n现在当我们点击按钮时，就会显示提示框。\n\
    \n# jQuery\n\njQuery 是一个流行的 JavaScript 库，用于创建动态网页。\n\n在本节中，我们将了解如何在我们的 Web 应用中使用\
    \ jQuery。\n\n## 添加 jQuery\n\n我们可以通过添加一个 script 标签来添加 jQuery：\n\n```\n<script src=\"\
    https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js\"></script>\n\
    ```\n\n我们也可以通过运行以下命令来安装 `jquery` 包：\n\n```\nnpm install jquery\n```\n\n使用 NPM，或者：\n\
    \n```\nyarn add jquery\n```\n\n此外，我们还可以使用 Bower 安装它：\n\n```\nbower install jquery\n\
    ```\n\n安装完成后，我们就可以开始使用它了。\n\n## .add()\n\n`.add()` 方法允许我们从父元素中获取子元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<p>\n  <div>\n    foo\n  </div>\n</p>\n```\n\n那么我们可以调用：\n\n```\n$(\"p\"\
    ).add(\"div\").addClass(\"widget\");\n```\n\n来获取 `p` 元素内部的 `div`。\n\n然后我们调用 `addClass`\
    \ 来为 `p` 元素内部的 `div` 添加一个类。\n\n## .addBack()\n\n`.addBack()` 方法允许我们从父元素中获取子元素。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<div class=\"after-addback\">\n  <p>First Paragraph</p>\n\
    \  <p>Second Paragraph</p>\n</div>\n```\n\n以及以下 CSS：\n\n```\n.background {\n \
    \ background: yellow;\n}\n```\n\n那么我们可以获取 `div` 中的 `p` 元素。\n\n然后使用 `addBack` 再次获取\
    \ `div`。\n\n最后，我们调用 `addClass` 来添加 `background` 类。\n\n## .addClass()\n\n"
- fmt: "\nThe `.addClass()` method lets us add one or more classes to an element.\n\
    \nFor example, we can write:\n\n```\n$(\"p\").addClass(\"myClass yourClass\");\n\
    ```\n\nto add the `myClass` and `yourClass` classes to the `p` element.\n\n##\
    \ `.after()`\n\nThe `.after()` method inserts content after each element in the\
    \ set of matched elements.\n\nFor example, if we have the following HTML:\n\n\
    ```\n<div class=\"container\">\n  <h2>Greetings</h2>\n  <div class=\"inner\">Hello</div>\n\
    \  <div class=\"inner\">Goodbye</div>\n</div>\n```\n\nThen we get the item with\
    \ the `inner` class and add the HTML TO it by writing:\n\n```\n$(\".inner\").after(\"\
    <p>Test</p>\");\n```\n\n## `.ajaxComplete()`\n\nThe `.ajaxComplete()` lets us\
    \ add a callback that’s called when the Ajax request is completed.\n\nFor example,\
    \ we can write:\n\n```\n$(document).ajaxComplete(function(event, xhr, settings)\
    \ {\n  console.log(event, xhr, settings)\n});\n\n$.ajax({\n  url: \"https://yesno.wtf/api\"\
    ,\n  context: document.body\n}).done(function() {\n  $(this).addClass(\"done\"\
    );\n});\n```\n\nWe called `ajaxComplete` with the callback that’s called when\
    \ we make a request with `$.ajax`.\n\nThen we call `$.ajax` to make the Ajax request.\n\
    \n`settings` has the `url` property with the request URL.\n\nThe `settings.type`\
    \ property has the request method name.\n\n`xhr` has the XHR object. The `readyState`\
    \ property has the ready state.\n\n## `.ajaxError()`\n\nThe `.ajaxError()` method\
    \ lets us add a callback that’s called when there’s an error.\n\nFor example,\
    \ we can use it by writing:\n\n```\n$(document).ajaxError(function(event, xhr,\
    \ settings, thrownError) {\n  console.log(event, xhr, settings, thrownError)\n\
    });\n\n$.ajax({\n  url: \"bad-url\",\n  context: document.body\n}).done(function()\
    \ {\n  $(this).addClass(\"done\");\n});\n```\n\nWe have an invalid URL set as\
    \ the value of the `url` property.\n\nThen the `ajaxError` callback will be called.\n\
    \nIt has the `thrownError` parameter which isn’t in the `ajaxComplete` callback.\n\
    \n## `.ajaxSend()`\n\nThe `ajaxSend` method lets us add a callback that’s called\
    \ when the request is sent.\n\nFor example, we can write:\n\n```\n$(document).ajaxSend(function(event,\
    \ xhr, settings) {\n  console.log(event, xhr, settings)\n});\n\n$.ajax({\n  url:\
    \ \"https://yesno.wtf/api\",\n  context: document.body\n}).done(function() {\n\
    \  $(this).addClass(\"done\");\n});\n```\n\nWe have the same callback as the other\
    \ ajax methods.\n\nAnd the content is the same.\n\n## `.ajaxStop()`\n\nThe `.ajaxStop()`\
    \ method lets us add a callback that’s called when the Ajax request is done.\n\
    \nFor example, we can write:\n\n```\n$(document).ajaxStop(function(event, xhr,\
    \ settings) {\n  console.log(event, xhr, settings)\n});\n\n$.ajax({\n  url: \"\
    https://yesno.wtf/api\",\n  context: document.body\n}).done(function() {\n  $(this).addClass(\"\
    done\");\n});\n```\n\nWe passed in a callback with the `event`, `xhr`, and `settings`\
    \ parameter.\n\n`settings` has the request data like the URL and request method.\n\
    \n`xhr` is an object with the request state.\n\n## `.ajaxSuccess()`\n\nThe `.ajaxSuccess()`\
    \ method lets us add a callback that’s run when an Ajax request completes successfully.\n\
    \nFor example, we can write:\n\n```\n$(document).ajaxSuccess(function(event, xhr,\
    \ settings) {\n  console.log(event, xhr, settings)\n});\n\n$.ajax({\n  url: \"\
    https://yesno.wtf/api\",\n  context: document.body\n}).done(function() {\n  $(this).addClass(\"\
    done\");\n});\n```\n\nWe have a callback with the same parameters as the other\
    \ Ajax methods.\n\n## All Selector\n\nWe can get all elements within another element\
    \ with the `*` selector.\n\nFor example, if we have:\n\n```\n<div id=\"test\"\
    >\n  <div>DIV</div>\n  <span>SPAN</span>\n  <p>P <button>Button</button></p>\n\
    </div>\n```\n\nThen we can get all the elements inside the `div` with ID `test`\
    \ by writing:\n\n```\n$(\"#test\").find(\"*\").css(\"border\", \"3px solid red\"\
    )\n```\n\nThen we call `css` to add a red border in all the elements.\n\n## `.animate()`\n\
    \nThe `.animate()` method lets us perform custom animation of a set of CSS properties.\n\
    \nFor example, if we have the following HTML:\n\n```\n<div id=\"clickme\">\n \
    \ Click here\n</div>\n<img id=\"book\" src=\"https://i.picsum.photos/id/25/300/300.jpg?hmac=hXirsaKumNCLu7iGSrMI_RkAEfXF01DGx6c4wzBUpXs\"\
    \ alt=\"\" width=\"100\" height=\"123\"\n  style=\"position: relative; left: 10px;\"\
    >\n```\n\nWe can add an animation to the when we click on Click here by writing:\n\
    \n```\n$(\"#clickme\").click(function() {\n  $(\"#book\").animate({\n    opacity:\
    \ 0.25,\n    left: \"+=50\",\n    height: \"toggle\"\n  }, 5000, function() {\n\
    \    // Animation complete.\n  });\n});\n```\n\nWe get the div with ID `clickme`,\
    \ then we call `click` to listen to clicks on it.\n\nThen we call `animate` to\
    \ animate the image by changing the `left` property.\n\n## `:animated` Selector\n\
    \nWe can select the element that’s animated with the `:animated` selector.\n\n\
    For example, if we have the following HTML:\n\n```\n<button id=\"run\">Run</button>\n\
    \n<div></div>\n<div id=\"mover\"></div>\n<div></div>\n```\n\nAnd the following\
    \ CSS:\n\n```\ndiv {\n   background: yellow;\n   border: 1px solid #AAA;\n   width:\
    \ 80px;\n   height: 80px;\n   margin: 0 5px;\n   float: left;\n }\n\ndiv.colored\
    \ {\n   background: green;\n}\n```\n\nThen we can toggle the color of the animate\
    \ div, which has the ID `mover` by writing:\n\n```\n$(\"#run\").click(function()\
    \ {\n  $(\"div:animated\").toggleClass(\"colored\");\n});\n\nfunction animate()\
    \ {\n  $(\"#mover\").slideToggle(\"slow\", animate);\n}\n\nanimate();\n```\n\n\
    When we click Run, the `toggleClass` method is called to change its color.\n\n\
    ## `.append()`\n\nWe can use the `.append` method to add elements after another\
    \ element.\n\nFor example, if we have:\n\n```\n<div class=\"container\">\n  <div\
    \ class=\"inner\">Hello</div>\n  <div class=\"inner\">Goodbye</div>\n</div>\n\
    ```\n\nThen we can get the elements with the `inner` class by writing:\n\n```\n\
    $(\".inner\").append(\"<p>Test</p>\");\n```\n\nThen both divs will have `<p>Test</p>`\
    \ HTML attached to it.\n\n## `.attr()`\n\nThe `.attr()` method lets us get or\
    \ set an attribute for every matched element.\n\nFor example, if we have:\n\n\
    ```\n<p>Once there was a <em title=\"huge, gigantic\">large</em> cat</p>\n<div></div>\n\
    ```\n\nThen we can get the `title` attribute from the `em` element and put that\
    \ in the `div` by writing:\n\n```\nconst title = $(\"em\").attr(\"title\");\n\
    $(\"div\").text(title);\n```\n\nWe can also use it to set the `title` attribute:\n\
    \n```\nconst title = $(\"em\").attr(\"title\", \"big\");\n```\n\n## Attribute\
    \ Contains Prefix Selector `[name|=\"value\"]`\n\nWe can get elements by the attribute\
    \ and name and value. `|` will get the value equal to the given string or the\
    \ string followed by a hyphen.\n\nFor example, if we have:\n\n```\n<a href=\"\
    example.html\" hreflang=\"en\">Some text</a>\n```\n\nThen we can get this element\
    \ by writing:\n\n```\n$(\"a[hreflang|='en']\").css(\"border\", \"3px dotted green\"\
    );\n```\n\n`hreflang` is the attribute name and `'en'` is the value.\n\n## Attribute\
    \ Contains Selector `[name*=\"value\"]`\n\nThis selector selects elements that\
    \ have specified attribute with a value having a given substring.\n\nFor example,\
    \ if we have the following HTML:\n\n```\n<input name=\"man-news\">\n<input name=\"\
    milkman\">\n<input name=\"letterman2\">\n<input name=\"newmilk\">\n```\n\nThen\
    \ we get all the inputs with the `name` attribute having the `man` substring as\
    \ the value by writing:\n\n```\n$(\"input[name*='man']\").val(\"has man\");\n\
    ```\n\nNow the value of the first 3 input boxes are `'has man'`.\n\n## Attribute\
    \ Contains Word Selector `[name~=\"value\"]`\n\nWe can get the elements that have\
    \ a specified attribute with a value containing the given word, delimited by spaces.\n\
    \nFor example, if we have:\n\n```\n<input name=\"man-news\">\n<input name=\"milk\
    \ man\">\n<input name=\"letterman2\">\n<input name=\"newmilk\">\n```\n\nThen we\
    \ can write:\n\n```\n$(\"input[name~='man']\").val(\"has man\");\n```\n\nto get\
    \ the inputs with the `name` attribute with the word `man` in it separated by\
    \ a space.\n\nOnly the 2nd input meets that condition, so `has man` will be in\
    \ that input.\n\n## Attribute Ends With Selector `[name$=\"value\"]`\n\nWe can\
    \ get elements that have the specified attribute with a value ending with the\
    \ given string.\n\nFor example, if we have the following HTML:\n\n```\n<input\
    \ name=\"newsletter\">\n<input name=\"milkman\">\n<input name=\"jobletter\">\n\
    ```\n\nThen we use this selector by writing:\n"
