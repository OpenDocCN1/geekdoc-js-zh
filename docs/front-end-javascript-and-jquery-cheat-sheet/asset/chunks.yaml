    \n```\n\nto get the first `span` in the `div` with the `:first-child` selector.\n\
    \nThen we called `css` to add the underline to the first `span`.\n\nAnd finally\
    \ we add hover to it with `hover` .\n\nThe first callback is called when we hover\
    \ over the element, and the second one is called when we hover away from it.\n\
    \n## `:first-of-type` Selector\n\nWe can use the `:first-of-type` selector to\
    \ select all elements that are the first among the siblings with the same element\
    \ name.\n\nFor example, if we have the following HTML:\n\n```\n\n<div>\n\n  <span>Glen,</span>\n\
    \n  <span>Tane,</span>\n\n  <span>Ralph</span>\n\n</div>\n\n<div>\n\n  <b>Nobody,</b>\n\
    \n  <span>John,</span>\n\n  <span>Scott,</span>\n\n  <span>Tim</span>\n\n</div>\n\
    \n```\n\nand the following CSS:\n\n```\n\n.green {\n\n  color: green\n\n}\n\n\
    ```\n\nThen we can add the `green` class to the first `span` in each `div` by\
    \ writing:\n\n```\n\n$(\"span:first-of-type\").addClass(\"green\");\n\n```\n\n\
    ## `:first` Selector\n\nThe `:first` select lets us select the first matched DOM\
    \ element.\n\nFor example, if we have:\n\n```\n\n<table>\n\n  <tr>\n\n    <td>Row\
    \ 1</td>\n\n  </tr>\n\n  <tr>\n\n    <td>Row 2</td>\n\n  </tr>\n\n  <tr>\n\n \
    \   <td>Row 3</td>\n\n  </tr>\n\n</table>\n\n```\n\nThen we can make the first\
    \ `tr` italic by writing:\n\n```\n\n$(\"tr:first\").css(\"font-style\", \"italic\"\
    );\n\n```\n\nNow everything in the `tr` is italic.\n\n## `.focus()`\n\nThe `focus`\
    \ method lets us add an event handler for the `focus` event or trigger the event\
    \ on an element.\n\nFor example, if we have:\n\n```\n\n<form>\n\n  <input id=\"\
    target\" type=\"text\" value=\"Field 1\">\n\n  <input type=\"text\" value=\"Field\
    \ 2\">\n\n</form>\n\n<div id=\"other\">\n\n  Trigger the handler\n\n</div>\n\n\
    ```\n\nThen we can add a callback that’s called when the `focus` event is triggered\
    \ on the input with ID `target` by writing:\n\n```\n\n$(\"#target\").focus(function()\
    \ {\n\n  console.log(\"Handler for .focus() called.\");\n\n});\n\n```\n\n## `:focus`\
    \ Selector\n\nThe `:focus` selector selects an element if it’s currently focused.\n\
    \nFor example, if we have the following HTML:\n\n```\n\n<div id=\"content\">\n\
    \n  <input tabIndex=\"1\">\n\n  <input tabIndex=\"2\">\n\n  <select tabIndex=\"\
    3\">\n\n    <option>select menu</option>\n\n  </select>\n\n  <div tabIndex=\"\
    4\">\n\n    a div\n\n  </div>\n\n</div>\n\n```\n\nAnd the following CSS:\n\n```\n\
    \n.focused {\n\n  background: green;\n\n}\n\n```\n\nThen we can add the `green`\
    \ class to element that’s focused by writing:\n\n```\n\n$(\"#content\").delegate(\"\
    *\", \"focus blur\", function() {\n\n  const elem = $(this);\n\n  setTimeout(function()\
    \ {\n\n    elem.toggleClass(\"focused\", elem.is(\":focus\"));\n\n  }, 0);\n\n\
    });\n\n```\n\nThe `delegate` method’s callback has the child elements of the `div`\
    \ with ID `content` as the value of `this` .\n\nAnd the callback is called when\
    \ `focus` or `blur` event is triggered on any child element in it.\n\nSo we can\
    \ use `toggleClass` to toggle the `green` class on when the element is focused.\n\
    \nThe first argument is the class name and the second argument is the condition\
    \ that toggles on the class in the first argument.\n\n## `.focusin()`\n\nThe `.focusin()`\
    \ method binds an event handler to the `focusin` event.\n\nFor example, if we\
    \ have:\n\n```\n\n<p><input type=\"text\"> <span>focusin fire</span></p>\n\n<p><input\
    \ type=\"text\"> <span>focusin fire</span></p>\n\n```\n\nThen we can write:\n\n\
    ```\n\n$(\"p\").focusin(function() {\n\n  $(this).find(\"span\").css(\"display\"\
    , \"inline\").fadeOut(1000);\n\n});\n\n```\n\nWe get the `span` and fade it out\
    \ when we focus on the input inside the `p` element.\n\n## `.focusout()`\n\nThe\
    \ `focusout` method lets us bind an event handler to the `focusout` JavaScript\
    \ event.\n\nFor example, if we have:\n\n```\n\n<p><input type=\"text\"> <span>focusout\
