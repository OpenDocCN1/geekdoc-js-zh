  trans: "\n它应返回 `true`，因为第一个带有类 `item` 的元素与 `li` 相同。\n\n## 创建元素和文本节点\n\n有两种方法可以让我们创建节点。一种是\
    \ `createElement`，用于创建元素节点。还有 `createTextNode` 方法，用于创建文本节点。\n\n我们可以使用 `createAttribute`\
    \ 方法创建属性，使用 `createComment` 创建注释。\n\n要创建一个元素，我们可以这样写：\n\n```\nconst elementNode\
    \ = document.createElement('div');\n```\n\n然后我们创建了一个 div。\n\n要创建一个文本节点，我们这样写：\n\
    \n```\nconst textNode = document.createTextNode('hello');\n```\n\n## 使用 JavaScript\
    \ 字符串创建并添加元素和文本节点\n\n我们可以通过将 `innerHTML` 方法设置为一个字符串来添加节点。\n\n例如，我们可以这样写：\n\n```\n\
    document.getElementById('foo').innerHTML = '<strong>foo</strong>';\n```\n\n将节点放入以下\
    \ div 中：\n\n```\n<div id=\"foo\"></div>\n```\n\n我们有一个 ID 为 `foo` 的 div。\n\n设置\
    \ `innerHTML` 属性会创建 `strong` 元素节点并将其放入 div 中。\n\n要替换外层节点，我们可以这样写：\n\n```\ndocument.getElementById('foo').outerText\
    \ = 'foo';\n```\n\n将 div 替换为文本节点 `'foo'`。\n\n`insertAdjacentHTML` 方法仅适用于元素节点。它比设置\
    \ `innerHTML` 或创建新节点更精确。\n\n例如，如果我们有以下 HTML：\n\n```\n<div id='foo'>\n  <p>\n \
    \   foo\n  </p>\n</div>\n```\n\n我们可以这样写：\n\n```\nconst foo = document.getElementById('foo');foo.insertAdjacentHTML('beforebegin',\
    \ '<p>bar</p>');\n```\n\n然后我们在包含文本 `foo` 的 p 元素之前添加一个 p 标签。第一个参数是位置，第二个参数是内容。\n\
    \n其他位置包括 `'afterbegin'`、`'beforeend'` 和 `'afterend'`。\n\n`innerHTML` 会将字符串中的 HTML\
    \ 元素转换为实际的 DOM 节点。\n\n`textContent` 只能构造文本节点。\n\n## 将 DOM 树的部分提取为 JavaScript 字符串\n\
    \n`innerHTML`、`outerHTML` 和 `textContent` 是我们用来创建和添加节点的工具。\n\n我们也可以使用它们来获取内容。\n\
    \n例如，如果我们有：\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n</div>\n```\n\n那么我们可以这样写：\n\
    \n```\nconsole.log(document.getElementById('foo').innerHTML);\n```\n\n来获取 div\
    \ 的内容。\n\n`innerText` 会给我们文本节点。例如，我们可以这样写：\n\n```\nconsole.log(document.getElementById('foo').innerText);\n\
    ```\n\n来获取 `foo`。\n\n## 将节点对象添加到 DOM\n\n`appendChild` 和 `insertBefore` 可用于将节点对象添加到\
    \ DOM。\n\n`appendChild` 用于向给定元素添加子元素。\n\n`insertBefore` 允许我们在当前元素之前添加一个元素。\n\n\
    例如，我们可以这样使用 `appendChild`：\n\n```\nconst elementNode = document.createElement('p');\n\
    elementNode.innerText = 'hello';\ndocument.getElementById('foo').appendChild(elementNode);\n\
    ```\n\n假设我们有以下 HTML：\n\n```\n<div id='foo'>\n  foo\n</div>\n```\n\n我们在文本 `foo`\
    \ 之后添加了一个新节点作为子节点。\n\n`insertBefore` 接受两个参数。第一个是要插入的元素。\n\n第二个是我们希望在其之前插入第一个参数中节点的元素。\n\
    \n我们插入之前的节点必须是调用 `insertBefore` 的节点的子节点。\n\n因此，给定以下 HTML：\n\n```\n<div id='foo'>\n\
    \  <p>\n    foo\n  </p>\n</div>\n```\n\n我们可以通过以下方式在 p 元素之前插入一个元素：\n\n```\nconst\
    \ elementNode = document.createElement('p');\nelementNode.innerText = 'hello';\n\
    const foo = document.getElementById('foo')\nfoo.insertBefore(elementNode, foo.firstChild);\n\
    ```\n\n我们创建了一个 p 元素，然后将其传递给 `insertBefore` 方法。\n\n`foo.firstChild` 是 p 元素，因为父\
    \ div 是 `foo`。\n\n然后我们在 `foo` 之前显示 `hello`。\n\n## 使用 `removeChild()` 移除节点\n\n\
    要移除子元素，我们可以使用 `removeChild` 方法。\n\n例如，给定以下 HTML：\n\n```\n<div id='foo'>\n  <p>\n\
    \    foo\n  </p>\n</div>\n```\n\n我们可以这样写：\n\n```\nconst p = document.querySelector('p');\n\
    p.parentNode.removeChild(p);\n```\n\n从 div 中移除 p 元素。\n\n我们获取要移除元素的直接父元素，然后移除目标元素。\n\
    \n## 使用 `replaceChild()` 替换子元素\n\n`replaceChild` 方法的工作方式与 `removeChild` 类似。我们获取父元素，然后调用\
    \ `replaceChild` 来替换项目。\n\n例如，如果我们有：\n\n```\n<div id='foo'>\n  <p>\n    foo\n\
    \  </p>\n</div>\n```\n\n我们可以这样写：\n\n```\nconst p = document.querySelector('p');\n\
    const bar = document.createTextNode('bar');\np.parentNode.replaceChild(bar, p);\n\
    ```\n\n将 p 元素替换为包含 `bar` 的文本节点。\n\n第一个参数是我们想要用来替换现有节点的新节点。\n\n第二个参数是我们要替换的原始节点。\n\
    \n## 获取元素的 `offsetTop` 和 `offsetLeft` 值\n\n`offsetTop` 和 `offsetLeft` 用于获取元素节点相对于\
    \ `offsetParent` 的像素值。\n\n这些元素节点属性给出了从 `offsetParent` 左上边框外部到内部左上边框的像素距离。\n\n\
    `offsetParent` 是通过搜索最近的、CSS 位置不为 static 的祖先元素来确定的。\n\n如果未找到，则使用 `body` 位置作为 `offsetParent`\
    \ 的值。\n\n例如，如果我们在 body 内有一个 div：\n\n```\n<!DOCTYPE html>\n<html>\n  <head> </head>\n\
    \  <body>\n    <div></div>\n  </body>\n</html>\n```\n\n那么我们可以通过以下方式获取 div 的位置：\n\
    \n```\nconst div = document.querySelector('div');console.log(div.offsetLeft);\n\
    console.log(div.offsetTop);\nconsole.log(div.offsetParent);\n```\n\n我们得到 `body`\
    \ 作为 `offsetParent`，其他属性得到数值。\n\n## 获取元素的上、右、下、左边框边缘\n\n`getBoundingClientRect()`\
    \ 方法获取元素外部边框边缘相对于视口顶部和左侧的位置。\n\n例如，如果我们有：\n\n```\n<!DOCTYPE html>\n<html>\n  <head></head>\n\
    \  <body>\n    <div></div>\n  </body>\n</html>\n```\n\n我们这样写：\n\n```\nconst rect\
    \ = document.querySelector('div').getBoundingClientRect();\nconsole.log(rect);\n\
    ```\n\n然后我们得到 `top`、`left`、`right` 和 `bottom` 属性，其尺寸以像素为单位，相对于视口。\n\n## 获取元素在视口中的大小\n\
    \n`getBoundingClientRect()` 方法还返回 `height` 和 `width` 属性。\n\n例如，如果我们有：\n\n```\n\
    <!DOCTYPE html>\n<html>\n  <head> </head>\n  <body>\n    <div></div>\n  </body>\n\
    </html>\n```\n\n我们这样写：\n\n```\nconst rect = document.querySelector('div').getBoundingClientRect();console.log(rect);\n\
    ```\n\n我们得到 `height` 和 `width` 属性，它们包含总高度和宽度，包括内边距和边框。\n\n## 获取元素在视口中的大小（排除边框）\n\
    \n`clientHeight` 和 `clientWidth` 包含元素的大小，不包括边框。\n\n但内边距和内容包含在内。\n\n如果我们有：\n\n\
    ```\n<!DOCTYPE html>\n<html>\n  <head> </head>\n  <body>\n    <div></div>\n  </body>\n\
    </html>\n```\n\n我们可以这样写：\n\n```\nconst div = document.querySelector('div');console.log(div.clientHeight,\
    \ div.clientWidth)\n```\n\n## 获取视口中特定点的最顶层元素\n\n`elementFromPoint()` 获取 HTML 文档中特定点的最顶层元素的引用。\n\
    \n例如，如果我们有：\n\n```\n<!DOCTYPE html>\n<html>\n  <head> </head>\n  <body>\n    <div></div>\n\
    \  </body>\n</html>\n```\n\n那么我们可以这样使用它：\n\n```\nconsole.log(document.elementFromPoint(10,\
    \ 12));\n```\n\n我们得到 `html` 元素。\n\n## 使用 `scrollHeight` 和 `scrollWidth` 获取正在滚动的元素的大小\n\
    \n`scrollHeight` 和 `scrollWidth` 给出了正在滚动的节点的高度和宽度。\n\n例如，如果我们有一个滚动 `html` 元素的\
    \ HTML，那么我们会得到正在滚动的 `html` 元素的大小。\n"
- fmt: "\nIf we have:\n\n```\n<p></p>\n```\n\nand:\n\n```\np {\n  height: 1000px;\n\
    \  width: 1000px;\n  background-color: green;\n}\n```\n\nThen we get the width\
    \ of the `p` element which is being scrolled by writing:\n\n```\nconst p = document.querySelector('p');\n\
    \nconsole.log(p.scrollHeight, p.scrollWidth);\n```\n\nand we get 1000 for each\
    \ property.\n\n## Getting and Setting Pixels Scrolled from the Top and Left\n\n\
    `scrollTop` and `scrollLeft` are read-write properties that return the pixels\
    \ to the left or top that aren’t currently viewable in the scrollable viewport\
    \ because of scrolling.\n\nFor instance, if we have:\n\n```\n<p></p>\n```\n\n\
    and:\n\n```\np {\n  height: 1000px;\n  width: 1000px;\n  background-color: green;\n\
    }\n```\n\nThen we can set them by writing:\n\n```\nconst p = document.querySelector('p');\n\
    p.scrollTop = 750;\np.scrollLeft = 750;\n```\n\nThen we should see those values\
    \ logged when we log them.\n\n## Scrolling an Element into View\n\nWe can call\
    \ the `scrollIntoView()` method to scroll an item into view.\n\nFor instance,\
    \ if we have:\n\n```\nfor (let i = 0; i < 50; i++) {\n  const p = document.createElement('p');\n\
    \  p.innerText = i;\n  document.body.appendChild(p);\n}\n```\n\nto generate 50\
    \ `p` elements and attach them to the body, then we scroll the 41st one into view\
    \ by writing:\n\n```\ndocument.querySelectorAll('p')[40].scrollIntoView(true);\n\
    ```\n\n## Style Attributes\n\nDOM node objects have the `style` attribute which\
    \ is used to style the elements of our choice.\n\nIt also returns the style of\
    \ the element.\n\nFor instance, if we have:\n\n```\n<div></div>\n```\n\nThen we\
    \ can get the styles by writing:\n\n```\nconst styles = document.querySelector('div').style;\n\
    ```\n\nAnd then `styles` will have all the styles.\n\n## Getting, Setting, and\
    \ Removing Inline CSS Properties\n\nWe can set the CSS styles by using the `style`\
    \ property.\n\nFor instance, if we have a `div`:\n\n```\n<div></div>\n```\n\n\
    We can write:\n\n```\nconst divStyle = document.querySelector('div').style;\n\
    divStyle.backgroundColor = 'yellow';\ndivStyle.border = '1px solid green';\ndivStyle.width\
    \ = '200px';\ndivStyle.height = '200px';\n```\n\nThen we get a yellow box with\
    \ a green border, with heights and widths 200px each.\n\nCSS attributes that are\
    \ kebab case are transformed to camelCase in JavaScript.\n\nFor instance, if we\
    \ have `background-color` in CSS, then it’ll be `backgroundColor` in JavaScript.\n\
    \nThis applies to all attributes with multiple words.\n\nWe can also use the `setProperty()`\
    \ method to set the styles and `getPropertyValue()` to get them.\n\nFor instance,\
    \ we can rewrite the code above with:\n\n```\nconst divStyle = document.querySelector('div').style;\n\
    divStyle.setProperty('background-color', 'yellow');\ndivStyle.setProperty('border',\
    \ '1px solid green');\ndivStyle.setProperty('height', '200px');\ndivStyle.setProperty('width',\
    \ '200px');\n```\n\nInstead of setting the `style` property, we call `setProperty()`\
    \ instead.\n\nTo get the styles, we can use the `getPropertyValue()` method:\n\
    \n```\nconsole.log(divStyle.getPropertyValue('background-color'));\n```\n\n##\
    \ Getting, Setting and Removing all Inline CSS Properties\n\nWe can use the `getAttribute()`\
    \ and `setAttribute()` to get or set all CSS properties.\n\nFor instance, we can\
    \ write:\n\n```\nconst div = document.querySelector('div');\ndiv.setAttribute('style',\
    \ 'background-color: yellow; height: 200px; width: 200px');\n```\n\nThen we set\
    \ all the styles in the string by setting the `style` attribute of the `div`.\n\
    \nTo get the styles, we can use `getAttribute()` as follows:\n\n```\nconsole.log(div.getAttribute('style'));\n\
    ```\n\n## Getting an Element’s Computed Styles\n\nWe can get all the styles of\
    \ an element with `getComputedStyle()`.\n\nIt includes all the styles including\
    \ inline styles, styles from stylesheets, and style tags.\n\nFor example, if we\
    \ have:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <style>\n \
    \     div {\n        background-color: green;\n        border: 1px solid yellow;\n\
    \        height: 150px;\n        width: 150px;\n      }\n     </style>\n  </head>\n\
    \n  <body>\n    <div style=\"background-color:orange;\"></div>\n   </body>\n</html>\n\
    ```\n\nwe can use it as follows:\n\n```\nconst div = document.querySelector('div');\n\
    console.log(window.getComputedStyle(div).backgroundColor);\n```\n\nThe inline\
    \ styles override the other styles, so it’ll return `rgb(255, 165, 0)` which is\
    \ orange.\n\nIt always returns `rgb` format for colors.\n\n## Apply and Remove\
    \ CSS Properties Using class and id Attributes\n\nWe can put our styles in ID\
    \ or class CSS selectors and apply the styles with it.\n\nFor instance, if we\
    \ have a `div`:\n\n```\n<div></div>\n```\n\nand some CSS:\n\n```\n.foo{\n  background-color:\
    \ green;\n  width: 100px;\n  height: 100px;\n}\n\n#bar{\n  border:10px solid red;\n\
    \  width: 100px;\n  height: 100px;\n}\n```\n\nWe can write:\n\n```\nconst div\
    \ = document.querySelector('div');\ndiv.setAttribute('id','bar');\n```\n\nThen\
    \ we get a box with a red border.\n\nWe can add the `foo` class to the `div` by\
    \ writing:\n\n```\nconst div = document.querySelector('div');\ndiv.classList.add('foo');\n\
    ```\n\nThen the box will have a green background color added.\n\n## Text Nodes\n\
    \nText nodes in an HTML document are instances of the `Text` constructor.\n\n\
    They return text nodes.\n\nFor instance, if we have:\n\n```\n<p>hello</p>\n```\n\
    \nThen we can get the text inside the `p` element as follows:\n\n```\nconst hello\
    \ = document.querySelector('p').firstChild;\n```\n\n## Text Objects and Properties\n\
    \nA `Text` instance has various objects and properties.\n\nThey have the following\
    \ properties and methods:\n\n*   `textContent` — content of the text node\n* \
    \  `splitText()` — split the text into 2 nodes by a specified offset\n*   `appendData()`\
    \ — append data into the node\n*   `deleteData()` — delete data from the node\n\
    *   `insertData()` — add data to the node at the position we want\n*   `replaceData()`\
    \ — replace data at the given position\n*   `subStringData()` — extracts part\
    \ of the text from a text node\n*   `normalize()` — put the node and the child\
    \ nodes into a normalized form. This means removing empty nodes\n*   `data` —\
    \ returns the data of the node\n*   `createTextNode()` — create a new text node\n\
    \n## White Space Creates Text Nodes\n\nWhite spaces create text nodes.\n\nIf they’re\
    \ empty then the string will have spaces in it.\n\nFor instance, if we have:\n\
    \n```\n<p> </p>\n```\n\nThen we write:\n\n```\ndocument.querySelector('p').firstChild.nodeName\n\
    ```\n\nThen we get `#text`, which indicates that it’s a text node.\n\n## Add Event\
    \ Listeners to Element Nodes\n\nWe can add event listeners to element nodes by\
    \ using `addEventListener()`.\n\nFor example, we can write:\n\n```\nwindow.addEventListener('mousemove',\
    \ (e) => {\n  console.log(e.clientX, e.clientY);\n}, false);\n```\n\nto listen\
    \ to the `mousemove` event and log the mouse coordinates as the mouse moves.\n\
    \nThe same can be done to an element. If we have:\n\n```\n<button>\n  click me\n\
    </button>\n```\n\nThen we can write:\n\n```\nconst button = document.querySelector('button');\n\
    \nbutton.addEventListener('click', () => {\n  console.log('clicked');\n}, false);\n\
    ```\n\nto listen to clicks on the button.\n\n## Remove Event Listeners\n\nWe can\
    \ use `removeEventListener()` to remove event listeners if the original listener\
    \ is a named function.\n\nFor instance, if we have:\n\n```\n<button>\n  click\
    \ me\n</button>\n```\n\nThen we can write:\n\n```\nconst button = document.querySelector('button');\n\
    \nconst listener = () => {\n  console.log('clicked');\n  button.removeEventListener('click',\
    \ listener);\n}\n\nbutton.addEventListener('click', listener, false);\n```\n\n\
    to only log `'clicked'` on the first click.\n\nThis is because we called `removeEventListener()`\
    \ on the `button`’s `click` event to remove the listener once we called it once.\n\
    \n## Get Event Properties from the Event Object\n\nWe can get event properties\
    \ from the event object.\n\nIt’s the first parameter of the listener.\n\nFor instance,\
    \ we can write:\n\n```\nwindow.addEventListener('load', (event) => {\n  console.log(event);\n\
    });\n```\n\nTo log the `event` object, which has various properties.\n\nIt has\
    \ many properties and the `stopPropagation()`, `stopImmediatePropagation()`, and\
    \ `preventDefault()` methods.\n\n`stopPropagation()` stops event propagation to\
    \ all ancestor elements.\n"
