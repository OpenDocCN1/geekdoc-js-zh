    #target\").keypress();\n});\n```\n\n## `.keyup()`\n\n`.keyup()` 方法允许我们监听 `keyup`\
    \ 事件或触发它。\n\n例如，如果我们有以下代码：\n\n```\n<form>\n  <fieldset>\n    <input id=\"target\"\
    \ type=\"text\" value=\"Hello there\">\n  </fieldset>\n</form>\n<div id=\"other\"\
    >\n  Trigger the handler\n</div>\n```\n\n那么我们可以通过以下代码监听输入框上的 `keyup` 事件：\n\n```\n\
    $(\"#target\").keyup(function() {\n  console.log(\"Handler for .keypress() called.\"\
    );\n});\n```\n\n我们还可以在点击 ID 为 `other` 的 div 时触发 `keyup` 事件，代码如下：\n\n```\n$(\"\
    #target\").keyup(function() {\n  console.log(\"Handler for .keypress() called.\"\
    );\n});\n\n$(\"#other\").click(function() {\n  $(\"#target\").keyup();\n});\n\
    ```\n\n## `:lang()` 选择器\n\n`:lang` 选择器允许我们选择所有指定语言的元素。\n\n例如，如果我们有以下 HTML：\n\n\
    ```\n<div lang=\"en-us\">red\n  <div>white\n    <div>and blue</div>\n  </div>\n\
    </div>\n<div lang=\"es-es\">rojo\n  <div>amarillo\n    <div>y rojo</div>\n  </div>\n\
    </div>\n```\n\n以及 CSS：\n\n```\n.spain {\n  background-color: red;\n  color: #ff0;\n\
    }\n\n.usa {\n  background-color: red;\n  color: #fff;\n}\n```\n\n那么我们可以通过以下代码为具有不同\
    \ `lang` 属性值的 div 添加不同的类：\n\n```\n$(\"div:lang(en-us)\").addClass(\"usa\");\n\
    $(\"div:lang(es-es)\").addClass(\"spain\");\n```\n\n## `.last()`\n\n我们可以使用 `.last`\
    \ 方法获取一组匹配元素中的最后一个元素。\n\n例如，如果我们有以下代码：\n\n```\n<ul>\n  <li>list item 1</li>\n\
    \  <li>list item 2</li>\n  <li>list item 3</li>\n  <li>list item 4</li>\n  <li>list\
    \ item 5</li>\n</ul>\n```\n\n那么我们可以通过以下代码为最后一个 `li` 添加红色背景：\n\n```\n$(\"li\").last().css(\"\
    background-color\", \"red\");\n```\n\n我们获取所有 `li`，然后调用 `last` 获取最后一个。\n\n## `:last-child`\
    \ 选择器\n\n`:last-child` 选择器选择所有作为父元素最后一个子元素的元素。\n\n例如，如果我们有以下 HTML：\n\n```\n<div>\n\
    \  <span>John,</span>\n  <span>Karl,</span>\n  <span>Brandon,</span>\n  <span>Sam</span>\n\
    </div>\n<div>\n  <span>James,</span>\n  <span>Mary,</span>\n  <span>Ralph,</span>\n\
    \  <span>David</span>\n</div>\n```\n\n以及 CSS：\n\n```\nspan.solast {\n  text-decoration:\
    \ line-through;\n}\n```\n\n那么我们可以通过以下代码将每个 `div` 中的最后一个 `span` 设置为红色，并在鼠标悬停时添加删除线：\n\
    \n```\n$(\"div span:last-child\")\n  .css({\n    color: \"red\",\n    fontSize:\
    \ \"80%\"\n  })\n  .hover(function() {\n    $(this).addClass(\"solast\");\n  },\
    \ function() {\n    $(this).removeClass(\"solast\");\n  });\n```\n\n## `:last-of-type`\
    \ 选择器\n\n我们可以使用 `:last-of-type` 选择器获取给定类型的最后一个元素。\n\n例如，如果我们有以下 HTML：\n\n```\n\
    <div>\n  <span>Corey,</span>\n  <span>Yehuda,</span>\n  <span>Adam,</span>\n \
    \ <span>Todd</span>\n</div>\n<div>\n  <span>James,</span>\n  <span>Mary,</span>\n\
    \  <span>Tim,</span>\n  <b>Nobody</b>\n</div>\n```\n\n以及 CSS：\n\n```\nspan.solast\
    \ {\n  text-decoration: line-through;\n}\n```\n\n那么我们可以通过以下代码将每个 `div` 中的最后一个\
    \ `span` 设置为红色，并在鼠标悬停时添加删除线：\n\n```\n$(\"span:last-of-type\")\n  .css({\n    color:\
    \ \"red\",\n    fontSize: \"80%\"\n  })\n  .hover(function() {\n    $(this).addClass(\"\
    solast\");\n  }, function() {\n    $(this).removeClass(\"solast\");\n  });\n```\n\
    \n## `.length`\n\n我们可以使用 `.length` 属性获取 jQuery 对象中的元素数量。\n\n例如，如果我们有以下代码：\n\n\
    ```\n<div></div>\n```\n\n那么我们可以通过以下代码添加一个 div 并获取 div 的总数：\n\n```\n$(document.body).append($(\"\
    <div>\"));\nconst n = $(\"div\").length;\nconsole.log(n);\n```\n\n控制台应输出 2。\n\n\
    ## `.load()`\n\n`.load()` 方法允许我们从服务器加载数据，并将返回的 HTML 放入匹配的元素中。\n\n例如，如果我们有以下代码：\n\
    \n```\n<div id='result'></div>\n```\n\n那么我们可以编写：\n\n```\n$(\"#result\").load(\"\
    https://jsfiddle.net\");\n```\n\n将 [`jsfiddle.net`](https://jsfiddle.net) 的内容加载到\
    \ ID 为 `result` 的 div 中。\n\n## `.map()`\n\n`.map()` 方法允许我们将每个项的值映射为一个新值。\n\n例如，如果我们有以下代码：\n\
    \n```\n<form method=\"post\" action=\"\">\n  <fieldset>\n    <div>\n      <label\
    \ for=\"two\">2</label>\n      <input type=\"checkbox\" value=\"2\" id=\"two\"\
    \ name=\"number[]\">\n    </div>\n    <div>\n      <label for=\"four\">4</label>\n\
    \      <input type=\"checkbox\" value=\"4\" id=\"four\" name=\"number[]\">\n \
    \   </div>\n    <div>\n      <label for=\"six\">6</label>\n      <input type=\"\
    checkbox\" value=\"6\" id=\"six\" name=\"number[]\">\n    </div>\n    <div>\n\
    \      <label for=\"eight\">8</label>\n      <input type=\"checkbox\" value=\"\
    8\" id=\"eight\" name=\"number[]\">\n    </div>\n  </fieldset>\n</form>\n```\n\
    \n那么我们可以通过以下代码获取所有复选框的 ID，然后将它们连接成一个字符串：\n\n```\nconst str = $(\":checkbox\")\n\
    \  .map(function() {\n    return this.id;\n  })\n  .get()\n  .join();\nconsole.log(str);\n\
    ```\n\n此时 `str` 的值为 `'two,four,six,eight'`。\n\n## `.mousedown()`\n\n`.mousedown()`\
    \ 方法允许我们为 `mousedown` 事件添加事件监听器或触发它。\n\n例如，如果我们有以下代码：\n\n```\n<div id=\"target\"\
    >\n  Click here\n</div>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\
    \n那么我们可以通过以下代码监听 ID 为 `target` 的 div 上的 `mousedown` 事件：\n\n```\n$(\"#target\"\
    ).mousedown(function() {\n  console.log(\"Handler for .mousedown() called.\");\n\
    });\n```\n\n此外，我们还可以在点击 ID 为 `other` 的 div 时触发 ID 为 `target` 的 div 上的 `mousedown`\
    \ 事件，代码如下：\n\n```\n$(\"#target\").mousedown(function() {\n  console.log(\"Handler\
    \ for .mousedown() called.\");\n});\n\n$(\"#other\").click(function() {\n  $(\"\
    #target\").mousedown();\n});\n```\n\n## `.mouseenter()`\n\n`.mouseenter()` 方法允许我们为\
    \ `mouseenter` 事件添加事件监听器或触发它。\n\n例如，如果我们有以下代码：\n\n```\n<div id=\"target\">\n \
    \ Click here\n</div>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\
    \n那么我们可以通过以下代码监听 ID 为 `target` 的 div 上的 `mouseenter` 事件：\n\n```\n$(\"#target\"\
    ).mouseenter(function() {\n  console.log(\"Handler for .mouseenter() called.\"\
    );\n});\n```\n\n此外，我们还可以在点击 ID 为 `other` 的 div 时触发 ID 为 `target` 的 div 上的 `mouseenter`\
    \ 事件，代码如下：\n\n```\n$(\"#target\").mouseenter(function() {\n  console.log(\"Handler\
    \ for .mouseenter() called.\");\n});\n\n$(\"#other\").click(function() {\n  $(\"\
    #target\").mouseenter();\n});\n```\n\n## `.mouseleave()`\n\n`.mouseleave()` 方法允许我们为\
    \ `mouseleave` 事件添加事件监听器或触发它。\n\n例如，如果我们有以下代码：\n\n```\n<div id=\"target\">\n \
    \ Click here\n</div>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\
    \n那么我们可以通过以下代码监听 ID 为 `target` 的 div 上的 `mouseleave` 事件：\n\n```\n$(\"#target\"\
    ).mouseleave(function() {\n  console.log(\"Handler for .mouseleave() called.\"\
    );\n});\n```\n\n此外，我们还可以在点击 ID 为 `other` 的 div 时触发 ID 为 `target` 的 div 上的 `mouseleave`\
    \ 事件，代码如下：\n\n```\n$(\"#target\").mouseleave(function() {\n  console.log(\"Handler\
    \ for .mouseleave() called.\");\n});\n\n$(\"#other\").click(function() {\n  $(\"\
    #target\").mouseleave();\n});\n```\n\n## `.mousemove()`\n\n`.mousemove()` 方法允许我们为\
    \ `mousemove` 事件添加事件监听器或触发它。\n\n例如，如果我们有以下代码：\n\n```\n<div id=\"target\">\n  Click\
    \ here\n</div>\n<div id=\"other\">\n  Trigger the handler\n</div>\n```\n\n那么我们可以通过以下代码监听\
    \ ID 为 `target` 的 div 上的 `mousemove` 事件：\n\n```\n$(\"#target\").mousemove(function()\
    \ {\n  console.log(\"Handler for .mouseleave() called.\");\n});\n```\n\n"
- fmt: "\nAlso, we can trigger then `mousedown` event on the div with ID `target`\
