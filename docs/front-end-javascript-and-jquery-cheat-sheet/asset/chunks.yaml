    \ .mouseup() called.\");\n});\n$(\"#other\").click(function() {\n  $(\"#target\"\
    ).mouseup();\n});\n```\n\n## 多重属性选择器 `[name=”value”][name2=”value2″]`\n\n我们可以使用多重属性选择器来选择具有多个属性的元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<input id=\"man-news\" name=\"man-news\">\n<input name=\"\
    milkman\">\n<input id=\"letterman\" name=\"new-letterman\">\n<input name=\"newmilk\"\
    >\n```\n\n那么我们可以通过编写以下代码来获取 ID 为 `letterman` 且 `name` 属性值为 `new-letterman` 的输入框：\n\
    \n```\n$(\"input[id][name$='man']\").val(\"only this one\");\n```\n\n获取元素后，我们调用\
    \ `val` 来设置输入框的值。\n\n## 多重选择器（`“selector1, selector2, selectorN”`）\n\n多重选择器允许我们获取匹配任意给定选择器的元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div>div</div>\n<p class=\"myClass\">p class=\"myClass\"\
    </p>\n<p class=\"notMyClass\">p class=\"notMyClass\"</p>\n<span>span</span>\n\
    ```\n\n那么我们可以通过编写以下代码，为 `div`、`span` 以及 class 为 `myClass` 的 `p` 元素添加红色边框：\n\n\
    ```\n$(\"div, span, p.myClass\").css(\"border\", \"3px solid red\");\n```\n\n\
    ## `.next()`\n\n`.next()` 方法获取紧跟在给定元素之后的同级元素。\n\n例如，如果我们有以下代码：\n\n```\n<ul>\n\
    \  <li>list item 1</li>\n  <li>list item 2</li>\n  <li class=\"third-item\">list\
    \ item 3</li>\n  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\n\
    那么我们可以通过编写以下代码，获取 class 为 `third-item` 的 `li` 元素紧邻的下一个 `li` 元素：\n\n```\n$(\"li.third-item\"\
    ).next().css(\"background-color\", \"red\");\n```\n\n然后我们调用 `css` 为其添加红色背景。\n\n\
    ## 下一个相邻选择器（`“prev + next”`）\n\n我们可以使用下一个相邻选择器来获取给定元素之后的下一个同级元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<form>\n  <label for=\"name\">Name:</label>\n  <input name=\"name\" id=\"\
    name\">\n  <fieldset>\n    <label for=\"newsletter\">Newsletter:</label>\n   \
    \ <input name=\"newsletter\" id=\"newsletter\">\n  </fieldset>\n</form>\n<input\
    \ name=\"none\">\n```\n\n那么我们可以通过编写以下代码，获取 label 元素之后紧邻的 input 元素，并为其添加样式和设置值：\n\
    \n```\n$(\"label + input\").css(\"color\", \"blue\").val(\"Labeled!\");\n```\n\
    \n## 下一个兄弟选择器（`“prev ~ siblings”`）\n\n下一个兄弟选择器允许我们选择所有跟在 prev 元素之后的同级元素。\n\n这些兄弟元素必须具有相同的父元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div>div (doesn't match since before #prev)</div>\n<span\
    \ id=\"prev\">span#prev</span>\n<div>div sibling</div>\n<div>div sibling <div\
    \ id=\"small\">div niece</div>\n</div>\n<span>span sibling (not div)</span>\n\
    <div>div sibling</div>\n```\n\n那么我们可以通过编写以下代码，获取所有跟在 ID 为 `prev` 的 span 元素之后的\
    \ div 元素：\n\n```\n$(\"#prev ~ div\").css(\"border\", \"3px groove blue\");\n```\n\
    \n我们调用 `css` 为匹配的元素添加蓝色边框。\n\n## `.nextAll()`\n\n`.nextAll()` 方法获取匹配元素集合中每个元素之后的所有同级元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n\
    \  <li class=\"third-item\">list item 3</li>\n  <li>list item 4</li>\n  <li>list\
    \ item 5</li>\n</ul>\n```\n\n那么我们可以通过编写以下代码，获取 class 为 `third-item` 的 `li` 元素之后的所有\
    \ `li` 元素，并为它们添加红色背景：\n\n```\n$(\"li.third-item\").nextAll().css(\"background-color\"\
    , \"red\");\n```\n\n## `.nextUntil()`\n\n`.nextUntil()` 方法获取每个元素之后的所有同级元素，直到（但不包括）由选择器、DOM\
    \ 节点或 jQuery 对象匹配的元素。\n\n例如，如果我们有以下代码：\n\n```\n<dl>\n  <dt id=\"term-1\">term\
    \ 1</dt>\n  <dd>definition 1-a</dd>\n  <dd>definition 1-b</dd>\n  <dd>definition\
    \ 1-c</dd>\n  <dd>definition 1-d</dd>\n  <dt id=\"term-2\">term 2</dt>\n  <dd>definition\
    \ 2-a</dd>\n  <dd>definition 2-b</dd>\n  <dd>definition 2-c</dd>\n  <dt id=\"\
    term-3\">term 3</dt>\n  <dd>definition 3-a</dd>\n  <dd>definition 3-b</dd>\n</dl>\n\
    ```\n\n那么我们可以通过编写以下代码，获取 ID 为 `term-2` 的 `dt` 元素之后直到（但不包括）ID 为 `term-3` 的 `dt`\
    \ 元素之间的所有元素：\n\n```\n$(\"#term-2\")\n  .nextUntil(\"dt\")\n  .css(\"background-color\"\
    , \"red\");\n```\n\n然后我们为其添加红色背景。\n\n## `.not()`\n\n我们调用 `not` 来从匹配的元素集合中移除某些元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n\
    \  <li>list item 3</li>\n  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n\
    ```\n\n那么我们可以通过编写以下代码，获取所有奇数位置的 `li` 元素：\n\n```\n$(\"li\").not(\":nth-child(2n)\"\
    ).css(\"background-color\", \"red\");\n```\n\n然后我们调用 `css` 为其添加红色背景。\n\n## `jQuery.ready`\n\
    \n`jQuery.ready` 是一个 thenable 对象，当文档准备就绪时，它会 resolve。\n\n例如，我们可以编写：\n\n```\n(async\
    \ () => {\n  const data = await $.when(\n    $.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\"\
    ),\n    $.ready\n  )\n  console.log(data);\n})()\n```\n\n我们调用 `getJSON` 来获取 JSON\
    \ 数据。\n\n然后我们调用 `$.ready` 来等待 `document` 准备就绪。\n\n当两个操作都完成后，我们获取 `data`。\n\n##\
    \ `jQuery.readyException()`\n\n`jQuery.readyException` 方法用于处理在 jQuery 包装的函数中同步抛出的错误。\n\
    \n例如，我们可以编写：\n\n```\njQuery.readyException = function(error) {\n  console.error(error);\n\
    };\n```\n\n将 `error` 对象传递给 `console.error` 方法并记录它。\n\n## `jQuery.removeData()`\n\
    \n`jQuery.removeData()` 方法允许我们从元素中移除数据。\n\n例如，如果我们有以下代码：\n\n```\n<div></div>\n\
    ```\n\n那么我们可以使用 `removeData` 从 div 中移除数据：\n\n```\nconst div = $(\"div\")[0];\n\
    ```\n\n"
- fmt: "\n```\njQuery.data(div, \"test1\", \"value\");\n\nconsole.log(jQuery.data(div,\
    \ \"test1\"))\n\njQuery.removeData(div, \"test1\");\n\nconsole.log(jQuery.data(div,\
    \ \"test1\"))\n```\n\nWe get the div and then call `jQuery.data` to get the data.\n\
    \nThen we call `removeData` to remove the data.\n\nSo the first console log logs\
    \ `'value'` and the 2nd one logs `undefined`.\n\n## `jQuery.support`\n\nThe `jQuery.support`\
    \ property has an object that shows what browser features are supported.\n\n##\
    \ `jQuery.uniqueSort()`\n\nThe `jQuery.uniqueSort()` method sorts an array of\
