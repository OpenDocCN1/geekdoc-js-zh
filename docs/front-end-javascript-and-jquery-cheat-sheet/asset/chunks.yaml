    \ $(\"div\").promise().done(function() {\n    $(\"p\").append(\" Finished! \"\
    );\n  });\n});\n```\n\n我们遍历每个 `div`，并使用 `fadeIn` 和 `fadeOut` 应用一些淡入淡出效果。\n\n然后我们调用\
    \ `promise`，并在所有方法调用完成时通过 `promise().done()` 方法运行代码。\n\n## `.prop()`\n\n我们可以使用\
