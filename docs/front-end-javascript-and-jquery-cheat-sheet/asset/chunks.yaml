    \ 4</li>\n  <li>item 5</li>\n</ul>\n```\n\n那么我们可以获取索引为 2 的 `li`（即第三个），并为其添加红色背景：\n\
    \n```\n$(\"li\").eq(2).css(\"background-color\", \"red\");\n```\n\n## deferred.then()\n\
    \n`deferred.then()` 允许我们添加处理程序，这些处理程序在 deferred 对象被 resolve、reject 或仍在进行中时被调用。\n\
    \n例如，我们可以这样写：\n\n```\n$.get(\"https://jsonplaceholder.typicode.com/posts/1\")\n\
