  trans: "\n那么 `theSum` 就是一个全局变量。\n\n我们可以在任何地方访问这个值。\n\n如果一个变量是全局的，那么它就是 `window`\
    \ 全局对象的一个附加属性。\n\n我们应该避免使用全局变量，因为很容易创建同名的全局变量。\n\n因此，很容易产生冲突。\n\n而且很难追踪变量是如何被修改的。\n\
    \n## Switch 语句\n\n`switch` 语句让我们可以在一个语句中针对不同情况执行不同操作。\n\n例如，我们可以这样写：\n\n```\n\
    switch (dayOfWk) {\n  case \"Sat\":\n    alert(\"very happy\");\n    break;\n\
    \  case \"Sun\":\n    alert(\"happy\");\n    break;\n  case \"Fri\":\n    alert(\"\
    happy friday\");\n    break;\n  default:\n    alert(\"sad\");\n}\n```\n\n我们检查\
    \ `dayOfWk` 的值，当它具有给定值时，让我们执行不同的操作。\n\n如果 `dayOfWk` 是 `'Sat'`，则显示一个 `'very happy'`\
    \ 的提示框。\n\n如果 `dayOfWk` 是 `'Sun'`，则显示一个 `'happy'` 的提示框。\n\n如果 `dayOfWk` 是 `'Fri'`，则显示一个\
    \ `'happy friday'` 的提示框。\n\n当 `dayOfWk` 有其他任何值时，会执行 `default` 子句，并显示 `'sad'` 提示框。\n\
    \n`break` 关键字是必需的，这样在找到匹配的 case 后，`switch` 语句的其余部分就不会执行。\n\n上面的 `switch` 语句等同于：\n\
    \n```\nif (dayOfWk === \"Sat\") {\n  alert(\"very happy\");\n} else if (dayOfWk\
    \ === \"Sun\") {\n  alert(\"happy\");\n} else if (dayOfWk === \"Fri\") {\n  alert(\"\
    hapopy friday\");\n} else {\n  alert(\"sad\");\n}\n```\n\n`switch` 语句中的 `default`\
    \ 等同于 `if` 语句中的 `else`。\n\n## While 循环\n\nJavaScript 的 `while` 循环是我们可以使用的另一种循环。\n\
    \n它允许我们在给定条件为 `true` 时运行循环。\n\n例如，我们可以这样写：\n\n```\nlet i = 0;\nwhile (i <= 3)\
    \ {\n  console.log(i);\n  i++;\n}\n```\n\n在上面的循环中，当 `i` 小于或等于 3 时，我们运行循环。\n\n\
    在循环体内，我们更新 `i`，以便朝着结束循环的方向努力。\n\n我们将循环块缩进 2 个空格，以便于输入和阅读。\n\n## 按钮事件\n\n我们可以为按钮添加事件处理代码，这样点击按钮时就能执行某些操作。\n\
    \n例如，我们可以这样写：\n\n```\n<input type=\"button\" value=\"Click Me\" onClick=\"alert('Hello\
    \ world!');\">\n```\n\n我们有一个按钮，其 `onClick` 属性包含调用 `alert` 的 JavaScript 代码。\n\n\
    因此，当我们点击它时，会看到一个提示框显示出来。\n\n`value` 属性包含按钮文本。\n\n我们也可以对其他元素做同样的事情。\n\n例如，我们可以这样写：\n\
    \n```\n<a href=\"http://google.com\"><img onClick=\"alert('Hello world!');\" src=\"\
    https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    ></a>\n```\n\n当我们点击图片时，会看到提示框显示出来。\n\n如果我们想让代码更整洁，可以将 `alert` 调用放到一个单独的函数中。\n\n\
    我们可以编写以下 HTML：\n\n```\n<a href=\"http://google.com\"><img onClick=\"greet()\"\
    \ src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    ></a>\n```\n\n以及以下 JavaScript：\n\n```\nconst greet = () => {\n  alert('Hello world!');\n\
    }\n```\n\n## 鼠标事件\n\n我们可以通过使用属性并将其值设置为 JavaScript 代码来监听鼠标事件。\n\n例如，我们可以这样写：\n\n\
    ```\n<h1 onMouseover=\"alert('hello world.');\">hello world</h1>\n```\n\n当鼠标悬停在\
    \ h1 元素上时，显示一个提示框。\n\n我们还可以添加 `onMouseout` 事件处理程序，在鼠标悬停时执行某些操作，并在鼠标移开时恢复：\n\n\
    ```\n<h1 onMouseover=\"this.style.color='green'\" onMouseout=\"this.style.color='black'\"\
    >hello world</h1>\n```\n\n上面代码中的 `this` 指的是 h1 元素。\n\n当鼠标悬停在 h1 元素上时，我们将 `color`\
    \ 样式设置为 `'green'`。\n\n然后当鼠标移开时，我们将 `color` 设置回黑色。\n\n## 输入事件\n\n同样，我们可以监听 input\
    \ 元素发出的事件。\n\n例如，我们可以这样写：\n\n```\n<input type=\"text\" size=\"30\" onFocus=\"\
    this.style.backgroundColor = 'yellow';\" onBlur=\"this.style.backgroundColor =\
    \ 'white';\">\n```\n\n我们添加了 `onFocus` 和 `onBlur` 处理程序，当聚焦到 input 元素时，将 `backgroundColor`\
    \ 样式设置为 `'yellow'`。\n\n然后当光标移出输入框时，背景恢复为白色。\n\n## 读取字段值\n\n我们可以在提交表单时读取输入字段中输入的值。\n\
    \n我们可以编写以下 HTML：\n\n```\n<form onSubmit=\"checkAddress('email'); return false;\"\
    >\n  Email:\n  <input type=\"text\" id=\"email\">\n  <input type=\"submit\" value=\"\
    Submit\">\n</form>\n```\n\n以及以下 JavaScript 来检查 email 字段：\n\n```\nconst checkAddress\
    \ = (fieldId) => {\n  if (document.getElementById(fieldId).value === \"\") {\n\
    \    alert(\"Email is required.\");\n  }\n  return false;\n}\n```\n\n`checkAddress`\
    \ 函数获取 ID 为 `email` 的输入框的值。\n\n如果为空，我们会在提示框中看到 `'Email is required'` 消息。\n\n我们需要在\
    \ `onSubmit` 属性和 `checkAddress` 函数中加上 `return false`，以防止默认的提交行为。\n\n我们可以通过以下方式简化函数：\n\
    \n```\nconst checkAddress = (fieldId) => {\n  const {\n    value\n  } = document.getElementById(fieldId)\n\
    \  if (value === \"\") {\n    alert(\"Email is required.\");\n  }\n  return false;\n\
    }\n```\n\n## 设置字段值\n\n我们可以使用 JavaScript 设置输入字段的值。\n\n例如，我们可以编写以下 HTML：\n\n```\n\
    <form>\n  fruit:<br>\n  <input type=\"text\" id=\"fruit\" onBlur=\"fillColor();\"\
    ><br>\n  color:<br>\n  <input type=\"text\" id=\"color\">\n</form>\n```\n\n然后我们可以编写以下\
    \ JavaScript 代码：\n\n```\nconst fillColor = () => {\n  let color;\n  const {\n\
    \    value\n  } = document.getElementById(\"fruit\");\n  switch (value) {\n  \
    \  case \"apple\":\n      color = \"red\";\n      break;\n    case \"orange\"\
    :\n      color = \"orange\";\n      break;\n    case \"grape\":\n      color =\
    \ \"purple\";\n  }\n  document.getElementById(\"color\").value = color;\n}\n```\n\
    \n我们在第一个输入框上添加了 `onBlur` 属性。\n\n因此，当光标移出第一个输入框时，会调用 `fillColor` 函数。\n\n然后我们通过\
    \ `value` 属性获取 ID 为 `fruit` 的输入框的值。\n\n接着根据 `value` 的值设置 `color` 变量的值。\n\n最后将\
    \ ID 为 `color` 的输入框的值设置为 `color` 变量的值。\n\n## 读取和设置段落文本\n\n我们可以读取和设置段落文本。\n\n例如，我们可以编写以下\
    \ HTML：\n\n```\n<p id=\"text\">\n  Lorem ipsum dolor sit amet.\n  <a href=\"javascript:void(0);\"\
    \ onClick=\"expandText();\">\n    <em>Click for more.</em>\n  </a>\n</p>\n```\n\
    \n然后我们可以添加 `expandText` 函数如下：\n\n```\nconst expandText = () => {\n  const expandedParagraph\
    \ = `Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras id lorem eget\
    \ erat vestibulum consectetur. Donec vehicula porta est ut vestibulum. Mauris\
    \ et nisl a sem iaculis laoreet. Nunc eleifend facilisis massa ut luctus. Nullam\
    \ sollicitudin non lorem non eleifend. Curabitur elementum felis quis enim malesuada\
    \ varius.`;\n  document.getElementById(\"text\").innerHTML = expandedParagraph;\n\
    }\n```\n\n`a` 元素具有 `onClick` 属性，其值设置为 `expandText()` 表达式。\n\n因此，当我们点击“Click for\
    \ more”文本时，会在屏幕上看到展开的文本。\n\n这是因为我们将 `expandedParagraph` 变量的值设置为 ID 为 `text` 的元素的\
    \ `innerHTML` 属性的值。\n\n我们可以通过设置 `innerHTML` 属性向元素中插入任何内容。\n\n例如，我们可以保留现有的 HTML，并将\
    \ JavaScript 改为：\n\n```\nconst expandText = () => {\n  const expandedParagraph\
    \ = `\n    <ol>\n      <li>Slow</li>\n      <li>Fast</li>\n      <li>Just-right</li>\n\
    \     </ol>\n   `;\n  document.getElementById(\"text\").innerHTML = expandedParagraph;\n\
    }\n```\n\n我们将 ID 为 `text` 的元素的内容设置为一个有序列表。\n\n因此，当我们点击“Click for more”时，就会看到这个列表。\n\
    \n## 操作图像和文本\n\n我们可以使用 JavaScript 操作图像。\n\n"
- fmt: "\nFor example, we can write the following HTML:\n\n```\n<img src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onClick=\"makeInvisible();\">\n```\n\nThen we can add the following\
    \ CSS:\n\n```\n.hidden {\n  visibility: hidden;\n}\n```\n\nThen the `makeInvisible`\
    \ function is:\n\n```\nconst makeInvisible = () => {\n  document.getElementById(\"\
    image\").className = \"hidden\";\n}\n```\n\nThe `hidden` class has the `visibility`\
    \ property set to `hidden`.\n\nTherefore, when we click on the image, the `makeInvisible`\
    \ function is run.\n\nThen the `hidden` class is added to the `img` element.\n\
    \nSo the image will be hidden.\n\n## Adding Class Names\n\nWe can add a class\
    \ name to an HTML element with the JavaScript class names API.\n\nFor example,\
    \ we can write the following HTML:\n\n```\n<img src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onClick=\"expand();\">\n```\n\nThen we can write the following\
    \ CSS:\n\n```\n.big {\n  width: 500px;\n}\n```\n\nThen we can add the `expand`\
    \ function by writing:\n\n```\nconst expand = () => {\n  document.getElementById(\"\
    image\").classList.add('big');\n}\n```\n\nThe `big` class has the width set to\
    \ 500px.\n\nIn the `expand` function, we call the `class:ist.add` method to add\
    \ the `'big'` class to the element with the ID `image`.\n\nAnd we set the `onClick`\
    \ attribute with `expand()` to call the `expand` function when we click the image.\n\
    \nThe image will then be expanded when we click on the image.\n\n## Swapping Images\n\
    \nWe can swap an image for another when we hover over the image.\n\nFor example,\
    \ we can write the following HTML:\n\n```\n<img src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onMouseover=\"swap(1);\" onMouseout=\"swap(0)\">\n```\n\nAnd the\
    \ following JavaScript code:\n\n```\nconst swap = (index) => {\n  const images\
    \ = [\n    'https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo',\n\
    \    'https://i.picsum.photos/id/25/200/300.jpg?hmac=ScdLbPfGd_kI3MUHvJUb12Fsg1meDQEaHY_mM613BVM'\n\
    \  ]\n  const image = document.querySelector('#image');\n  image.src = images[index];\n\
    }\n```\n\nWhen we hover over the image, the `swap(1)` expression is run.\n\nIt’s\
    \ set as the value of the `onMouseover` attribute, so it’ll run when we hover\
    \ over the image element.\n\nIf we move our mouse out of the image, then `swap(0)`\
    \ is run to show the original image.\n\nThis is because `swap(0)` is set as the\
    \ value of the `onMouseout` attribute.\n\n## Setting Styles\n\nWe can set styles\
    \ with the `className` or `style` property.\n\nFor example, we can write the following\
    \ HTML:\n\n```\n<p>\n  hello world\n</p>\n```\n\nAnd write the following CSS:\n\
    \n```\n.big {\n  font-size: 2em\n}\n```\n\nThen write the following to make the\
    \ text big with JavaScript:\n\n```\ndocument.querySelector(\"p\").classList.add(\"\
    big\");\n```\n\nWe get the `p` element with the `document.querySelector` method.\n\
    \nThen we add the `big` class to the `p` element with the `classList.add` method.\n\
    \nAlternatively, we can set the `style` property to the value we want:\n\n```\n\
    document.querySelector(\"p\").style.fontSize = '2em'\n```\n\nThe `style.fontSize`\
    \ property is the same as the `font-size` CSS property.\n\nHowever, it’s better\
    \ to use CSS and class names since it’s faster than setting styles with JavaScript.\n\
    \nAlso, CSS code is more reusable.\n\nOther `style` properties we can set include:\n\
    \n```\ndocument.querySelector(\"p\").style.cssFloat = \"left\";\n```\n\nto set\
    \ the CSS `float` property to `left`.\n\nWe can set the `visibility` CSS property\
    \ by writing:\n\n```\ndocument.querySelector(\"p\").style.visibility = \"hidden\"\
    ;\n```\n\nAnd the margin can be set by writing:\n\n```\ndocument.querySelector(\"\
    p\").style.margin = \"0 10px 0 10px;\";\n```\n\n## Target All Elements by Tag\
    \ Name\n\nWe can get all elements by tag name.\n\nThis is more convenient than\
    \ getting a single element with its ID or using `querySelector` to get the first\
    \ element with the given selector.\n\nFor example, we can write the following\
    \ HTML:\n\n```\n<p>foo.</p>\n<p>bar.</p>\n<p>baz.</p>\n```\n\nThen we can get\
    \ all the `p` elements and loop through them by writing:\n\n```\nconst pars =\
    \ document.getElementsByTagName('p')\nfor (const p of pars) {\n  p.style.fontFamily\
    \ = \"Verdana, Geneva, sans-serif\";\n}\n```\n\nWe get the `p` elements, then\
    \ loop through them with the `for-of` loop.\n\nIn the loop body, we set the `fontFamily`\
    \ style to change the font of the text.\n\n## Constructor Methods\n\nWe can add\
    \ methods to constructors or classes.\n\nFor example, we can write:\n\n```\nclass\
    \ Plan {\n  constructor(name, price, space, pages) {\n    this.name = name;\n\
    \    this.price = price;\n    this.space = space;\n    this.pages = pages;\n \
    \ }\n\n  calcAnnualPrice() {\n    return this.price * 12;\n  }\n}\n```\n\nWe add\
    \ the `calcAnnualPrice` method to return the value of `this.price * 12`.\n\n`this`\
    \ is the class instance, which is the object that’s created and returned when\
    \ we invoke the `Plan` class.\n\nSo we get the `price` property from the object\
    \ we create from the class and multiply it by 12.\n\nTo invoke the constructor\
    \ and call the method on the created object, we can write:\n\n```\nconst plan\
    \ = new Plan('basic', 3, 100, 10)\nconsole.log(plan.calcAnnualPrice())\n```\n\n\
    We invoke the `Plan` constructor with the `new` keyword.\n\nThen we call `calcAnnualPrice`\
    \ on the `plan` object to get the annual price.\n\nThe class syntax is just syntactic\
    \ sugar on top of prototype inheritance.\n\nThe `calcAnnualPrice` method is just\
    \ a property of the `Plan`’s `prototype` property.\n\nThe `prototype` is the prototype\
    \ of the `Plan` class, which is the object that it inherits from.\n\nIf we log\
    \ the value of `Plan.prototype.calcAnnualPrice`:\n\n```\nconsole.log(Plan.prototype.calcAnnualPrice)\n\
    ```\n\nwe see the code of the `calcAnnualPrice` method logged.\n\n## Checking\
    \ for Properties and Methods\n\nTo check if a property or method is actually in\
    \ the object itself rather than its prototype, we can use the `hasOwnProperty`\
    \ method.\n\nFor example, if we created an object from the `Plan` class:\n\n```\n\
    const plan = new Plan('basic', 3, 100, 10)\n```\n\nThen we can call `hasOwnProperty`\
    \ by writing:\n\n```\nconsole.log(plan.hasOwnProperty('name'))\n```\n\nThen we\
    \ should see `true` logged since `name` is a property of the `plan` object itself.\n\
    \nThe `hasOwnProperty` method comes from `Object.prototype`, which is a property\
    \ of almost all JavaScript objects.\n\nIf we want to list an object’s properties,\
    \ we can write:\n\n```\nfor (const prop in plan) {\n  if (plan.hasOwnProperty(prop))\
    \ {\n    console.log(prop);\n  }\n}\n```\n\nWe loop through the `plan`’s property\
    \ keys with the `for-in` loop.\n\nThe `for-in` loop loops through all the properties\
    \ and its prototypes, so we have to use the `hasOwnProperty` method to check if\
    \ a property is actually in the `plan` object itself.\n\n`prop` is the property\
    \ name itself.\n\nTherefore, we should see:\n\n```\nname\nprice\nspace\npages\n\
    ```\n\nlogged.\n\n## Getting the URL\n\nWe can get and set the URL of the page\
    \ with JavaScript.\n\nTo get the URL, we can use the `window.location.href` property.\n\
    \nIf we type that into the browser dev console, we should get the full URL of\
    \ the page.\n\n`window.location.hostname` has the hostname which is the first\
    \ part of the URL.\n\nFor example, if we have the URL `\"https://jsfiddle.net/09t6La27/10/\"\
    `, then `window.location.hostname` returns `\"jsfiddle.net\"`.\n\n`window.location.hash`\
    \ returns the part of the URL after the `#` sign.\n\nFor example, if we have `http://example.com/#foo`,\
    \ `window.location.hash` returns `\"#foo\"`.\n\n## Objects\n\nWe need objects\
    \ to store values other than primitive values like numbers, strings, booleans,\
    \ etc.\n\nIt serves as a container for all the items we want to store.\n\nFor\
    \ example, we can define an object by writing:\n\n```\nconst plan = {\n  name:\
    \ \"Basic\",\n  price: 3,\n  space: 100,\n  transfer: 1000,\n  pages: 10\n};\n\
    ```\n\nWe created the `plan` object with various properties.\n\n`name`, `price`,\
    \ `space`, `transfer`, and `pages` are property names.\n\nThe expressions after\
    \ the colon are their values.\n\nProperties are separated by a comma.\n"
