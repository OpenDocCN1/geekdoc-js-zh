  trans: "\n我们调用 `createEvent` 来创建一个自定义事件。传入 `'CustomEvent'` 以创建自定义事件。\n\n然后调用 `initCustomEvent`\
    \ 用数据初始化该自定义事件。\n\n接着，调用 `dispatchEvent` 来触发该事件。\n\n随后，在传入 `addEventListener`\
    \ 的事件处理函数中，我们记录 `detail` 属性中的数据。\n\n因此，当我们访问 `foo` 属性时，得到 `'bar'`。\n\n## 模拟或触发鼠标事件\n\
    \n我们可以使用 `initMouseEvent` 方法来触发鼠标事件。\n\n例如，如果我们有以下代码：\n\n```\n<button>\n  点击我\n\
    </button>\n```\n\n我们可以这样写：\n\n```\nconst button = document.querySelector('button');\n\
    button.addEventListener('click', (event) => {\n  console.log(event);\n}, false);\n\
    \nconst simulatedClick = document.createEvent('MouseEvents');\n\nsimulatedClick.initMouseEvent('click',\
    \ true, true, document.defaultView, 0, 0, 0, 0, 0, false, false, false, 0, null,\
    \ null);\n\nbutton.dispatchEvent(simulatedClick);\n```\n\n我们调用 `createEvent` 并传入\
    \ `'MouseEvents'`。\n\n然后调用 `initMouse` 事件，它接受多个参数。\n\n这些参数按以下顺序排列：\n\n*   `type`\
    \ — 要触发的鼠标事件类型\n*   `canBubble` — 指示事件是否冒泡\n*   `cancelable` — 指示事件是否可取消\n*  \
    \ `view` — 事件的抽象视图，应为 `window`\n*   `detail` — 点击次数\n*   `screenX` — 事件的屏幕 x 坐标\n\
    *   `screenY` — 事件的屏幕 y 坐标\n*   `clientX` — 事件客户区的 x 坐标\n*   `clientY` — 事件客户区的\
    \ y 坐标\n*   `ctrlKey` — 事件期间是否按下了 Ctrl 键\n*   `altKey` — 事件期间是否按下了 Alt 键\n*  \
    \ `shiftKey` — 事件期间是否按下了 Shift 键\n*   `metaKey` — 事件期间是否按下了 meta（Windows / Command）键\n\
    *   `button` — 鼠标按钮\n*   `relatedTarget` — 相关事件目标\n\n这是一个已弃用的 API，因此应考虑其他解决方案。\n\
    \n## 事件委托\n\n我们可以使用一个事件处理函数来监听来自不同源的事件。\n\n例如，如果我们有以下代码：\n\n```\n<button>\n  按钮\
    \ 1\n</button>\n<button>\n  按钮 2\n</button>\n<button>\n  按钮 3\n</button>\n```\n\
    \n我们可以这样写：\n\n```\ndocument.addEventListener('click', (event) => {\n  if (event.target.tagName.toLowerCase()\
    \ === 'button') {\n    console.log(event.target.textContent);\n  }\n}, false);\n\
    ```\n\n我们通过 `document.addEventListener` 监听整个页面上的点击事件。\n\n然后通过 `event.target` 获取事件起源的元素。\n\
    \n如果点击了一个按钮，则记录其文本内容。\n\n## CSSStyleRule 概述\n\n`CSSStyleRule` 对象表示样式表中的每条 CSS\
    \ 规则。\n\n它是与选择器关联的 CSS 属性和值的接口。\n\n要访问它们，如果我们有以下代码：\n\n```\n<style id='styles'>\n\
    \  body {\n    background-color: orange;\n    margin: 20px;\n  }\n\n  p {\n  \
    \  font-weight: 20px;\n    color: blue;\n  }\n</style>\n```\n\n那么我们可以这样写：\n\n\
    ```\nconst styles = document.querySelector('#styles');\nconsole.dir(styles.sheet.cssRules);\n\
    ```\n\n以从 `style` 元素中获取 CSS 规则。\n\n## CSSStyleRule 的属性和方法\n\n`CSSStyleRule` 拥有自己的属性和方法。\n\
    \n它具有以下属性：\n\n*   `cssText` — CSS 规则的文本\n*   `parentRule` — 给定样式块的父规则\n*   `parentStylesSheet`\
    \ — 父样式表对象\n*   `selectorText` — 规则的选择器\n*   `style` — 规则的样式\n*   `type` — 规则的类型，即\
    \ CSS 规则，值为 1\n\n例如，我们可以这样写：\n\n```\nconst styles = document.querySelector('#styles');\n\
    console.dir(styles.sheet.cssRules[0].cssText);\n```\n\n然后我们得到 body 元素的样式，因为它是第一个条目。\n\
    \n## 获取样式表中的 CSS 规则列表\n\n`cssRules` 包含样式表的 CSS 规则列表。\n\n例如，如果我们有与前一个示例相同的 style\
    \ 元素，我们可以这样写：\n\n```\nconst styles = document.querySelector('#styles');\nconsole.dir(styles.sheet.cssRules);\n\
    ```\n\n以获取所有 `cssRules`。\n\n## 插入或删除 CSS 规则\n\n`insertRule` 允许我们在样式表中插入一条 CSS\
    \ 规则。\n\n`deleteRule` 允许我们删除它们。\n\n例如，如果我们有一个 style 元素：\n\n```\n<style id='styles'>\n\
    \  body {\n    background-color: orange;\n    margin: 20px;\n  }\n\n  p {\n  \
    \  font-weight: 20px;\n    color: blue;\n  }\n</style>\n```\n\n我们可以这样写：\n\n```\n\
    const styles = document.querySelector('#styles');\nstyles.sheet.insertRule('p\
    \ { color:green }', 1);\n```\n\n然后我们为 p 标签添加了一条新的 CSS 规则，该规则会被现有规则覆盖。\n\n我们可以通过以下方式删除旧规则：\n\
    \n```\nstyles.sheet.deleteRule(1);\n```\n\n现在我们的新规则成为页面上 p 元素的规则。\n\n我们只需传入要删除的规则的索引即可。\n\
    \n## 编辑 CSSStyleRule 的值\n\n我们可以为 `style` 属性赋值来更改样式值。\n\n例如，如果我们有以下代码：\n\n```\n\
    <style id='styles'>\n  body {\n    background-color: orange;\n    margin: 20px;\n\
    \  }\n\n  p {\n    font-weight: 20px;\n    color: blue;\n  }\n</style>\n<p>\n\
    \  foo\n</p>\n```\n\n我们可以这样写：\n\n```\nconst styles = document.querySelector('#styles');\n\
    styles.sheet.cssRules[1].style.color = 'green';\n```\n\n将 p 元素的颜色设置为绿色。\n\n##\
    \ 创建新的内联 CSS 样式表\n\n我们可以使用 `innerHTML` 属性向 style 元素添加新样式。\n\n例如，如果我们有以下代码：\n\n\
    ```\nconst style = document.createElement('style');\nstyle.innerHTML = 'body {\
    \ color: orange }';document.querySelector('head').appendChild(style);\n```\n\n\
    现在 body 的所有内容都将变为橙色，因为我们添加了包含该样式的 style 元素。\n\n## 以编程方式添加外部样式表\n\n以编程方式添加外部样式表的方法与添加\
    \ style 标签类似。\n\n为此，我们只需使用 `createElement`：\n\n```\nconst link = document.createElement('link');\n\
    link.setAttribute('rel', 'stylesheet');\nlink.setAttribute('type', 'text/css');\n\
    link.setAttribute('id', 'link');\nlink.setAttribute('href', 'https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css');\n\
    ```\n\n我们添加了一个包含 Bootstrap 样式表的新 link 元素。\n\n## 禁用或启用样式表\n\n`disabled` 属性是我们可以设置在样式表上以切换样式表开启或关闭的属性。\n\
    \n如果我们有一个 link 元素：\n\n```\n<link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
    >\n```\n\n那么我们可以通过以下方式切换：\n\n```\ndocument.querySelector('link').disabled = true;\n\
    ```\n\n现在禁用了它。要启用，我们可以写：\n\n```\ndocument.querySelector('link').disabled = false;\n\
    ```\n\n## 插入并运行 JavaScript\n\n我们可以将 JavaScript 插入到 HTML 文档中。\n\nJavaScript 代码始终位于\
    \ script 标签内，可以是外部文件或内联代码。\n\nscript 元素没有必需的属性。\n\n也应避免使用自闭合 script 标签。\n\n尝试包含一个操作页面上\
    \ script 元素的外部脚本文件会导致页面上的 script 被忽略。\n\n例如，我们可以这样写：\n\n```\n<script>\nconsole.log('hello');\n\
    </script>\n```\n\n以包含一个 script 标签。\n\n## JavaScript 同步加载\n\n加载脚本的默认选项是同步加载。\n\n\
    这意味着如果存在其他脚本，它们会阻塞渲染和下载。\n\n如果脚本是外部文档，并且阻塞了其他所有内容的加载，那么必须先下载脚本才能解析，这意味着速度会更慢。\n\
    \n## 打开弹出窗口\n\n我们可以使用 `window.open` 方法打开弹出窗口。\n\n例如，我们可以这样写：\n\n```\nconst monkeyWindow\
    \ = window.open();\n```\n\n要向窗口添加一些内容，我们可以写：\n\n```\nconst monkeyWindow = window.open();\n\
    const windowContent = `<h1>hello world</h1>`;\nmonkeyWindow.document.write(windowContent);\n\
    ```\n"
- fmt: "\nWe call `document.write` on the `monkeyWindow` to show the content.\n\n\
    Also, we can show the content of a URL with the `location.assign` method:\n\n\
    ```\nconst monkeyWindow = window.open();\nmonkeyWindow.location.assign(\"https://www.google.com\"\
    );\n```\n\nNow we should see Google displayed in the new window.\n\nWe can also\
    \ write:\n\n```\nconst monkeyWindow = window.open();\nmonkeyWindow.location.href\
    \ = \"https://www.google.com\";\n```\n\nto do the same thing.\n\nTo close a window,\
    \ we can write:\n\n```\nconst monkeyWindow = window.open();\nmonkeyWindow.location.href\
    \ = \"https://www.google.com\";\nmonkeyWindow.close();\n```\n\n# Controlling the\
    \ Window’s Size and Location\n\nWe can set the popup window’s size and location\
    \ with a string in the 3rd argument of `window.open`.\n\nFor example, we can write:\n\
    \n```\nconst monkeyWindow = window.open(\"https://www.google.com\", \"win1\",\
    \ \"width=420,height=380\");\n```\n\nNow the window is 420px in width and 380px\
    \ for height.\n\nTo change its location, we can write:\n\n```\nconst monkeyWindow\
    \ = window.open(\"https://www.google.com\", \"win1\", \"width=420,height=380,left=200,top=100\"\
    );\n```\n\nto add the `left` and `top` keys to set the position.\n\n# Form Validation\n\
    \nWe can add form validation to a form.\n\nFor example, we can write the following\
    \ HTML:\n\n```\n<form onSubmit=\"return checkForLastName();\">\n  Please enter\
    \ your last name.<br>\n  <input type=\"text\" id=\"lastNameField\">\n  <input\
    \ type=\"submit\" value=\"Submit\">\n</form>\n```\n\nAnd we can add the following\
    \ JavaScript to add the validation:\n\n```\nconst checkForLastName = () => {\n\
    \  if (document.getElementById(\"lastNameField\").value.length === 0) {\n    alert(\"\
    Please enter your last name\");\n    return false;\n  }\n}\n```\n\nIn the `checkForLastName`\
    \ function, we get the value of the input with the ID `lastNameField`.\n\nIf the\
    \ `value`'s `length` is 0, then we show the alert.\n\nThe `return` in the `onSubmit`\
    \ attribute value makes sure that we prevent the default submit behavior along\
    \ with the `return false` in `checkForLastName` so that we can run the JavaScript\
    \ validation.\n\nTo improve the user experience, we can call `focus` on the element:\n\
    \n```\nconst checkForLastName = () => {\n  const lastNameField = document.getElementById(\"\
    lastNameField\")\n  if (lastNameField.value.length === 0) {\n    alert(\"Please\
    \ enter your last name\");\n    lastNameField.focus();\n    return false;\n  }\n\
    }\n```\n\nWe call `focus` on the input element so that the user can type in the\
    \ text without clicking on the input.\n\nAlso, we can add background color so\
    \ that the user can see the input field more easily:\n\n```\nconst checkForLastName\
    \ = () => {\n  const lastNameField = document.getElementById(\"lastNameField\"\
    )\n  if (lastNameField.value.length === 0) {\n    alert(\"Please enter your last\
    \ name\");\n    lastNameField.focus();\n    lastNameField.style.background = \"\
    yellow\";\n    return false;\n  }\n  lastNameField.style.background = \"white\"\
    ;\n}\n```\n\nWe set the background color by setting the `lastNameField.style.background`\
    \ property.\n\n# Dropdown Validation\n\nWe can add validation to select dropdown\
    \ fields.\n\nFor example, we can write the following HTML:\n\n```\n<form onSubmit=\"\
    return checkForSelection();\">\n  <select id=\"fruits\">\n    <option value=\"\
    \" selected=\"selected\">\n      SELECT A FRUIT</option>\n    <option value=\"\
    apple\">apple</option>\n    <option value=\"orange\">orange</option>\n    <option\
    \ value=\"grape\">grape</option>\n  </select>\n  <br>\n  <input type=\"submit\"\
    \ value=\"Submit Form\">\n</form>\n```\n\nAnd then add the following JavaScript:\n\
    \n```\nconst checkForSelection = () => {\n  if (document.getElementById(\"fruits\"\
    ).selectedIndex === 0) {\n    alert(\"Please select a fruit.\");\n    return false;\n\
    \  }\n}\n```\n\nWe added a select element and when we click on Submit Form, the\
    \ `checkForSelection` function is run.\n\nWe add the `return` keyword so that\
    \ we stop the default submit behavior and let the `checkForSelection` run.\n\n\
    # Radio Button Validation\n\nAlso, we can add validation to a group of radio buttons.\n\
    \nFor instance, we can write the following HTML:\n\n```\n<form onSubmit=\"return\
    \ validateRadios();\">\n  <input type=\"radio\" name=\"r1\" value=\"apple\"> apple<br>\n\
    \  <input type=\"radio\" name=\"r1\" value=\"orange\"> orange<br>\n  <input type=\"\
    radio\" name=\"r1\" value=\"grape\"> grape<br>\n  <input type=\"submit\" value=\"\
    Submit Form\">\n</form>\n```\n\nAnd the following JavaScript:\n\n```\nconst validateRadios\
    \ = () => {\n  const radios = document.getElementsByName(\"r1\");\n  for (const\
    \ r of radios) {\n    if (r.checked) {\n      return true;\n    }\n  }\n  alert(\"\
    Please check one.\");\n  return false;\n}\n```\n\nWe have a form with a bunch\
    \ of radio buttons with the same `name` attribute value.\n\nThey should have the\
    \ same name so that they’re considered to be in the same group.\n\nWhen we click\
    \ the Submit Form button, the `validateRadios` function runs.\n\nIn the function,\
    \ we get all the radio buttons by calling `getElementsByName` with the `name`\
    \ attribute value of the radio buttons.\n\nWe loop through the radio buttons with\
    \ the for-of loop.\n\nThen if one is checked, we return `true`.\n\nOtherwise,\
    \ we show an alert and return `false` is none of them are checked.\n\n# Email\
    \ Validation\n\nWe can validate email address in a form field by checking the\
    \ format of the entered text with a regex.\n\nFor example, we can write the following\
    \ HTML:\n\n```\n<form onSubmit=\"return validateEmail();\">\n  Please enter your\
    \ email.<br>\n  <input type=\"text\" id=\"emailField\">\n  <input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n```\n\nAnd write the following JavaScript code:\n\
    \n```\nconst validateEmail = () => {\n  const emailField = document.getElementById(\"\
    emailField\");\n  const regex = /^[w-.+]+@[a-zA-Z0-9\\. -]+.[a-zA-z0-9]{2,4}$/;\n\
    \  if (!(regex.test(emailField.value))) {\n    alert(\"Please correct email address\"\
    );\n    return false;\n  }\n}\n```\n\nWe have the `validateEmail` function that\
    \ gets the value of the input with ID `emailField`.\n\nThen we call the `regex.test`\
    \ method to check if the inputted value matches the regex format.\n\nIf it doesn’t\
    \ then we show an alert and return `false`.\n\nThe `return` keyword lets us prevent\
    \ the default submit behavior from running.\n\n# Handling Events\n\nWe can attach\
    \ event listeners to HTML elements.\n\nFor example, we can write the following\
    \ HTML:\n\n```\n<input type=\"button\" value=\"Click\" id='button1'>\n```\n\n\
    And write the following JavaScript:\n\n```\nconst b1 = document.getElementById(\"\
    button1\");\nconst sayHello = () => {\n  alert('hello');\n}\nb1.onclick = sayHello;\n\
    ```\n\nWe get the button with `getElementById`.\n\nThen we set the `onclick` property\
    \ to the `sayHello` event handler function.\n\nThe functions show an alert with\
    \ the `alert` function.\n\nNow when we click on the button, we show the alert.\n\
    \n# jQuery\n\njQuery is a popular JavaScript for creating dynamic web pages.\n\
    \nIn this section, we’ll look at how to using jQuery in our web apps.\n\n## Adding\
    \ jQuery\n\nWe can add jQuery by adding a script tag:\n\n```\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js\"\
    ></script>\n```\n\nWe can also install the `jquery` package by running:\n\n```\n\
    npm install jquery\n```\n\nwith NPM or:\n\n```\nyarn add jquery\n```\n\nAlso,\
    \ we can install it with Bower:\n\n```\nbower install jquery\n```\n\nAfter installing\
    \ it, we can start using it.\n\n## .add()\n\nThe `.add()` method lets us get a\
    \ child element from a parent.\n\nFor example, if we have:\n\n```\n<p>\n  <div>\n\
    \    foo\n  </div>\n</p>\n```\n\nThen we call:\n\n```\n$(\"p\").add(\"div\").addClass(\"\
    widget\");\n```\n\nto get the `div` that’s inside the `p` element.\n\nThen we\
    \ call `addClass` to add a class to the `div` inside the `p` element.\n\n## .addBack()\n\
    \nThe `.addBack()` method lets us get the child elements from the parent element.\n\
    \nFor example, if we have the following HTML:\n\n```\n<div class=\"after-addback\"\
    >\n  <p>First Paragraph</p>\n  <p>Second Paragraph</p>\n</div>\n```\n\nand the\
    \ following CSS:\n\n```\n.background {\n  background: yellow;\n}\n```\n\nThen\
    \ we get the `p` elements in the `div`.\n\nThen we use `addBack` to get the `div`\
    \ again.\n\nAnd finally, we call `addClass` to add the `background` class.\n\n\
    ## .addClass()\n"
