    \ console.log(\"Handler for .mouseover() called.\");\n\n});\n\n$(\"#other\").click(function()\
    \ {\n\n  $(\"#target\").mouseover();\n\n});\n\n```\n\n## .mouseup()\n\nThe `.mouseup()`\
    \ method lets us add an event listener for the `mouseup` event or trigger it.\n\
    \nFor example, if we have:\n\n```\n\n<div id=\"target\">\n\n  Click here\n\n</div>\n\
    \n<div id=\"other\">\n\n  Trigger the handler\n\n</div>\n\n```\n\nThen we can\
    \ listen to the `mouswdown` event on the div with ID `target` by writing:\n\n\
    ```\n\n$(\"#target\").mouseup(function() {\n\n  console.log(\"Handler for .mouseup()\
    \ called.\");\n\n});\n\n```\n\nAlso, we can trigger then `mouseup` event on the\
    \ div with ID `target` when we click on the div with ID `other` by writing:\n\n\
    ```\n\n$(\"#target\").mouseup(function() {\n\n  console.log(\"Handler for .mouseup()\
    \ called.\");\n\n});\n\n$(\"#other\").click(function() {\n\n  $(\"#target\").mouseup();\n\
    \n});\n\n```\n\n## Multiple Attribute Selector [name=”value”][name2=”value2″]\n\
    \nWe can select items with multiple attributes with the multiple attribute selector.\n\
    \nFor example, if we have:\n\n```\n\n<input id=\"man-news\" name=\"man-news\"\
    >\n\n<input name=\"milkman\">\n\n<input id=\"letterman\" name=\"new-letterman\"\
    >\n\n<input name=\"newmilk\">\n\n```\n\nThen we can get the input with ID `letterman`\
    \ and `name` value `new-letterman` by writing:\n\n```\n\n$(\"input[id][name$='man']\"\
    ).val(\"only this one\");\n\n```\n\nAfter we got the element, we call `val` to\
    \ set the input value.\n\n## Multiple Selector (“selector1, selector2, selectorN”)\n\
    \nThe multiple selector selector lets us get elements that match any of the given\
    \ selectors.\n\nFor example, if we have:\n\n```\n\n<div>div</div>\n\n<p class=\"\
    myClass\">p class=\"myClass\"</p>\n\n<p class=\"notMyClass\">p class=\"notMyClass\"\
    </p>\n\n<span>span</span>\n\n```\n\nThen we can add a red border to the `div` ,\
    \ `span` , and the `p` element with class `myClass` by writing:\n\n```\n\n$(\"\
    div, span, p.myClass\").css(\"border\", \"3px solid red\");\n\n```\n\n## .next()\n\
    \nThe `.next()` method get the element sibling element that immediately follows\
    \ a given element.\n\nFor example, if we have:\n\n```\n\n<ul>\n\n  <li>list item\
    \ 1</li>\n\n  <li>list item 2</li>\n\n  <li class=\"third-item\">list item 3</li>\n\
    \n  <li>list item 4</li>\n\n  <li>list item 5</li>\n\n</ul>\n\n```\n\nThen we\
    \ get the `li` that’s immediately next to the `li` with class `third-item` by\
    \ writing:\n\n```\n\n$(\"li.third-item\").next().css(\"background-color\", \"\
    red\");\n\n```\n\nThen we call `css` to add a red background color to it.\n\n\
    ## Next Adjacent Selector (“prev + next”)\n\nWe can use the next adjacent selector\
    \ to add the adjacent selector to get the sibling element next to the given element.\n\
    \nFor example, if we have:\n\n```\n\n<form>\n\n  <label for=\"name\">Name:</label>\n\
    \n  <input name=\"name\" id=\"name\">\n\n  <fieldset>\n\n    <label for=\"newsletter\"\
    >Newsletter:</label>\n\n    <input name=\"newsletter\" id=\"newsletter\">\n\n\
    \  </fieldset>\n\n</form>\n\n<input name=\"none\">\n\n```\n\nThen we can get the\
    \ input next to the label and add some styles and set their value by writing:\n\
    \n```\n\n$(\"label + input\").css(\"color\", \"blue\").val(\"Labeled!\");\n\n\
    ```\n\n## Next Siblings Selector (“prev ~ siblings”)\n\nThe next sibling selector\
    \ lets us select all sibling elements that follow the prev element.\n\nThe siblings\
    \ must have the same parent.\n\nFor example, if we have:\n\n```\n\n<div>div (doesn't\
    \ match since before #prev)</div>\n\n<span id=\"prev\">span#prev</span>\n\n<div>div\
    \ sibling</div>\n\n<div>div sibling <div id=\"small\">div niece</div>\n\n</div>\n\
    \n<span>span sibling (not div)</span>\n\n<div>div sibling</div>\n\n```\n\nThen\
    \ we can get all the divs that comes with the span with ID `prev` by writing:\n\
    \n```\n\n$(\"#prev ~ div\").css(\"border\", \"3px groove blue\");\n\n```\n\nWe\
    \ call `css` to add a blue border to the matching elements.\n\n## .nextAll()\n\
    \nThe `.nextAll()` method gets all the following siblings of each element in the\
    \ set of matched elements.\n\nFor example, if we have:\n\n```\n\n<ul>\n\n  <li>list\
    \ item 1</li>\n\n  <li>list item 2</li>\n\n  <li class=\"third-item\">list item\
    \ 3</li>\n\n  <li>list item 4</li>\n\n  <li>list item 5</li>\n\n</ul>\n\n```\n\
    \nThen we get all the `li` s that comes after the `li` with the class `third-item`\
    \ and add a red background to them by writing:\n\n```\n\n$(\"li.third-item\").nextAll().css(\"\
    background-color\", \"red\");\n\n```\n\n## .nextUntil()\n\nThe `.nextUntil()`\
    \ method gets all the following siblings of each element up to but not including\
    \ the element matched by a selector, DOM node, or jQuery object passed in.\n\n\
    For example, if we have:\n\n```\n\n<dl>\n\n  <dt id=\"term-1\">term 1</dt>\n\n\
    \  <dd>definition 1-a</dd>\n\n  <dd>definition 1-b</dd>\n\n  <dd>definition 1-c</dd>\n\
    \n  <dd>definition 1-d</dd>\n\n  <dt id=\"term-2\">term 2</dt>\n\n  <dd>definition\
    \ 2-a</dd>\n\n  <dd>definition 2-b</dd>\n\n  <dd>definition 2-c</dd>\n\n  <dt\
    \ id=\"term-3\">term 3</dt>\n\n  <dd>definition 3-a</dd>\n\n  <dd>definition 3-b</dd>\n\
    \n</dl>\n\n```\n\nThen we get the `dt` element with ID `term-2` up to the `dt`\
    \ with ID `term-3` by writing:\n\n```\n\n$(\"#term-2\")\n\n  .nextUntil(\"dt\"\
    )\n\n  .css(\"background-color\", \"red\");\n\n```\n\nThen we add a red background\
    \ to it.\n\n## .not()\n\nWe call `not` to remove elements from a set of matched\
    \ elements.\n\nFor example, if we have:\n\n```\n\n<ul>\n\n  <li>list item 1</li>\n\
    \n  <li>list item 2</li>\n\n  <li>list item 3</li>\n\n  <li>list item 4</li>\n\
    \n  <li>list item 5</li>\n\n</ul>\n\n```\n\nThen we get all the `li` s in odd-numbered\
    \ positions by writing:\n\n```\n\n$(\"li\").not(\":nth-child(2n)\").css(\"background-color\"\
    , \"red\");\n\n```\n\nThen we call `css` to add a red background to it.\n\n##\
    \ jQuery.ready\n\nThe `jQuery.ready` is a thenable object that resolves when the\
    \ document is ready.\n\nFor example, we can write:\n\n```\n\n(async () => {\n\n\
    \  const data = await $.when(\n\n    $.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\"\
    ),\n\n    $.ready\n\n  )\n\n  console.log(data);\n\n})()\n\n```\n\nWe call `getJSON`\
    \ to get JSON data.\n\nThen we call `$.ready` to wait for the `document` to be\
    \ ready.\n\nThen we get the `data` after both operations are done.\n\n## jQuery.readyException()\n\
    \nThe `jQuery.readyException` method handles errors that are thrown synchronously\
    \ in functions wrapped in jQuery.\n\nFor example, we can write:\n\n```\n\njQuery.readyException\
    \ = function(error) {\n\n  console.error(error);\n\n};\n\n```\n\nto pass the `error`\
    \ object into the `console.error` method and log it.\n\n## jQuery.removeData()\n\
    \nThe `jQuery.removeData()` method lets us remove data from an element.\n\nFor\
    \ example, if we have:\n\n```\n\n<div></div>\n\n```\n\nThen we can use `removeData`\
    \ to remove data from the div:\n\n```\n\nconst div = $(\"div\")[0];"
