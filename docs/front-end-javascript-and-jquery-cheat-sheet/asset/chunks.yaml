  trans: "\n\n要访问一个属性，我们可以这样写：\n\n```\nplan.name\n```\n\n`plan.name` 的值应为 `'Basic'`。\n\
    \n我们可以为属性赋予不同的值。\n\n例如，我们可以这样写：\n\n```\nplan.name = 'Deluxe';\n```\n\n那么 `name`\
    \ 属性的新值就是 `'Deluxe'`。\n\n我们可以使用赋值运算符为属性赋予任意数据类型的值。\n\n要检查一个属性是否存在于对象中，可以使用 `in`\
    \ 运算符。\n\n例如，如果我们有：\n\n```\n'name' in plan\n```\n\n那么它应该返回 `true`，因为 `name` 是\
    \ `plan` 的一个属性。\n\n但如果我们有：\n\n```\n'foo' in plan\n```\n\n那么它会返回 `false`，因为 `foo`\
    \ 不是 `plan` 的属性。\n\n我们需要将属性名用引号括起来，因为左操作数是一个字符串。\n\n## 对象方法\n\n对象可以拥有方法。\n\n例如，我们可以这样写：\n\
    \n```\nconst plan = {\n  name: \"Basic\",\n  price: 3,\n  space: 100,\n  transfer:\
    \ 1000,\n  pages: 10,\n  calcAnnualPrice() {\n    return this.price * 12;\n  }\n\
    };\n```\n\n将 `calcAnnualPrice` 方法添加到 `plan` 对象中。\n\n`this` 指向对象本身，因此 `this.price\
    \ * 12` 返回 `price` 属性的值乘以 12 的结果。\n\n## 构造函数\n\n我们可以使用构造函数创建具有相同结构的对象。\n\n它们是对象的模板。\n\
    \n要创建一个构造函数，我们可以这样写：\n\n```\nfunction Plan(name, price, space, pages) {\n  this.name\
    \ = name;\n  this.price = price;\n  this.space = space;\n  this.pages = pages;\n\
    }\n```\n\n我们创建了 `Plan` 构造函数，它接受 `name`、`price`、`space` 和 `pages` 参数。\n\n然后我们将它们赋值给\
    \ `this` 的同名属性。\n\n当我们调用构造函数时，`this` 会返回我们赋值的所有属性。\n\n要调用它，我们可以这样写：\n\n```\nconst\
    \ plan = new Plan('basic', 3, 100, 10)\n```\n\n我们使用 `new` 关键字来调用构造函数并创建对象。\n\n\
    `plan` 的值是：\n\n```\n{\n  name: \"basic\"\n  pages: 10\n  price: 3\n  space: 100\n\
    }\n```\n\n编写构造函数的更好方式是使用类语法。\n\n例如，我们可以这样写：\n\n```\nclass Plan {\n  constructor(name,\
    \ price, space, pages) {\n    this.name = name;\n    this.price = price;\n   \
    \ this.space = space;\n    this.pages = pages;\n  }\n}\n```\n\n`constructor` 方法与我们之前使用的构造函数函数相同。\n\
    \n只是写法不同。这是创建构造函数的首选方式，因为它与其他流行的面向对象语言一致。\n\n## 使用 `querySelectorAll` 按标签名定位所有元素\n\
    \n`document.querySelectorAll` 方法允许我们获取所有匹配给定选择器的元素。\n\n因此，要获取所有具有给定标签名的元素，我们可以编写以下\
    \ HTML：\n\n```\n<p>foo.</p>\n<p>bar.</p>\n<p>baz.</p>\n```\n\n然后我们可以通过以下代码获取所有元素并设置它们的样式：\n\
    \n```\nconst pars = document.querySelectorAll('p')\nfor (const p of pars) {\n\
    \  p.style.fontFamily = \"Verdana, Geneva, sans-serif\";\n}\n```\n\n我们使用 `document.querySelectorAll`\
    \ 获取所有 `p` 元素。\n\n然后使用 for-of 循环遍历每个元素，并设置 `style.fontFamily` 属性来指定字体。\n\n## 按标签名定位部分元素\n\
    \n我们可以使用 `document.querySelectorAll` 方法按标签名定位部分元素，因为它接受任何选择器字符串作为参数。\n\n例如，如果我们有以下\
    \ HTML 表格：\n\n```\n<table>\n  <tr>\n    <td>foo</td>\n    <td>bar</td>\n    <td>baz</td>\n\
    \  </tr>\n</table>\n```\n\n并且我们想要获取表格中的所有 `td` 元素，我们可以这样写：\n\n```\nconst tds =\
    \ document.querySelectorAll('table td')\nfor (const t of tds) {\n  t.style.backgroundColor\
    \ = \"pink\";\n}\n```\n\n我们使用 `table td` 选择器获取 `table` 元素内的 `td` 元素。\n\n然后遍历 `td`\
    \ 元素并将 `backgroundColor` 设置为 `'pink'`。\n\n## DOM\n\nDOM 代表文档对象模型（Document Object\
    \ Model）。它是浏览器用 JavaScript 表示 HTML 元素的方式。\n\nHTML 元素在 DOM 中以树形结构组织。\n\n每个层级通过缩进表示。\n\
    \n例如，如果我们有：\n\n```\n<html>\n\n  <head>\n    <title>\n      Simple document\n \
    \   </title>\n  </head>\n\n  <body>\n    <p>\n      hello world\n    </p>\n  </body>\n\
    \n</html>\n```\n\n那么 `html` 元素是树的根节点。\n\n`head` 和 `body` 位于第二层。\n\n`title` 和 `p`\
    \ 元素位于第三层。\n\n最顶层的元素是 `document` 对象。\n\n因此，`html` 元素是 `head` 和 `body` 元素的父节点。\n\
    \n`title` 元素是 `head` 元素的子节点。\n\n`p` 元素是 `body` 元素的子节点。\n\n我们可以使用之前用过的 DOM 方法（如\
    \ `querySelector`、`querySelectorAll`、`getElementById` 和 `getElementByTagName`）来查找子元素。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<html>\n\n<head>\n    <title>\n      Simple document\n\
    \    </title>\n  </head>\n\n  <body>\n    <div id=\"weather\">\n      <p>Today\
    \ is sunny.</p>\n      <p>Yesterday is rainy.</p>\n    </div>\n    <div id=\"\
    density\">\n      <p>City is crowded.</p>\n      <p>Desert is sparse.</p>\n  \
    \  </div>\n  </body>\n</html>\n```\n\n那么如果我们想获取 \"Today is sunny\" 文本，可以这样写：\n\
    \n```\nconst sunny = document.querySelector('#weather p');\nconsole.log(sunny.innerHTML)\n\
    ```\n\n我们使用 `#weather p` 选择器与 `querySelector` 方法，从 ID 为 `weather` 的 div 中获取第一个\
    \ p 元素。\n\n然后通过 `innerHTML` 属性获取其内容。\n\n## 节点对象类型\n\n节点类型有几种。\n\n它们包括：\n\n*  \
    \ `DOCUMENT_NODE` — `window.document`\n\n*   `ELEMENT_NODE` — body、a、p、h1 等\n\n\
    *   `ATTRIBUTE_NODE` — `id='foo'`、`class='foo'`\n\n*   `TEXT_NODE` — 标签之间的文本\n\
    \n*   `DOCUMENT_FRAGMENT_NODE` — 由 `document.createDocumentFragment()` 返回的任何内容\n\
    \n*   `DOCUMENT_TYPE_NODE` — `<!doctype html>`\n\n例如，我们可以写：\n\n```\ndocument.ELEMENT_NODE\n\
    ```\n\n来获取 `ELEMENT_NODE` 的值，即 1。\n\n`Node` 对象包含所有节点常量值。\n\n从 `Node` 对象中，我们可以看到\
    \ `ELEMENT_NODE` 是 1。\n\n`TEXT_NODE` 是 3，`ATTRIBUTE_NODE` 是 2，`DOCUMENT_NODE`\
    \ 是 9，`DOCUMENT_FRAGMENT_NODE` 是 11，`DOCUMENT_TYPE_NODE` 是 10。\n\n## 子节点对象\n\n\
    `HTMLElement` 对象通过 `Element` 对象继承自 `Node` 对象。\n\n其他如 `Attr`、`Text`、`HTMLDocument`\
    \ 和 `DocumentFragment` 都继承自 `Node`。\n\n例如，我们可以写：\n\n```\nconst body = document.querySelector('body');\n\
    ```\n\n然后我们可以像这样遍历键：\n\n```\nfor (const key in body) {\n  console.log(key);\n\
    }\n```\n\n除了 `HTMLElement` 的属性外，我们还应该看到节点属性。\n\n## 节点的属性和方法\n\n每个节点都有以下属性：\n\n\
    *   `childNodes`\n\n*   `firstChild`\n\n*   `lastChild`\n\n*   `nextSibling`\n\
    \n*   `nodeName`\n\n*   `nodeType`\n\n*   `nodeValue`\n\n*   `parentNode`\n\n\
    *   `previousSibling`\n\n它们允许我们在不同节点之间遍历。\n\n`childNodes` 包含子节点。\n\n`firstChild`\
    \ 包含第一个子节点。\n\n`lastChild` 包含最后一个子节点。\n\n`nextSibling` 包含下一个兄弟节点。\n\n`nodeName`\
    \ 包含节点的名称。\n\n`nodeType` 包含节点的类型。\n\n`parentNode` 包含当前节点的父节点。\n\n`previousSibling`\
    \ 包含当前节点的上一个兄弟节点。\n\n方法包括：\n\n*   `appendChild()`\n\n*   `cloneNode()`\n\n*  \
    \ `compareDocumentPosition()`\n\n*   `contains()`\n\n*   `hasChildNodes()`\n\n\
    *   `insertBefore()`\n\n*   `isEqualNode()`\n\n*   `removeChild()`\n\n*   `replaceChild()`\n\
    \n`appendChild` 添加一个新的子节点。\n\n`cloneNode` 克隆当前节点并返回它。\n\n`compareDocumentPosition`\
    \ 比较每个节点的位置。\n\n`contains` 检查节点是否包含另一个节点作为子节点。\n\n`insertBefore` 在当前节点之前添加一个节点。\n\
    \n`isEqualNode` 检查是否相等。\n\n`removeChild` 移除一个给定的子节点。\n\n`replaceChild` 用一个子元素替换另一个子元素。\n\
    \n文档方法包括：\n\n*   `document.createElement()`\n\n*   `document.createTextNode()`\n\
    \n"
- fmt: "\n`createElement` creates a new element as the name suggests, `createTextNode`\
    \ creates a text node that can be put into an element.\n\nHTML Element Properties\
    \ include:\n\n*   `innerHTML`\n*   `outerHTML`\n*   `textContent`\n*   `innerText`\n\
    *   `outerText`\n*   `firstElementChild`\n*   `lastElementChild`\n*   `nextElementChild`\n\
    *   `previousElementChild`\n*   `children`\n\n`innerHTML` has the HTML content\
    \ inside an element.\n\n`outerHTML` has all the HTML content of `innerHTML` in\
    \ addition to the enclosing tags.\n\n`textContent` has the text content inside\
    \ an element.\n\n`innerText` has the text content inside an element.\n\n`outerText`\
    \ include the content from `innerText` plus the enclosing tags.\n\n`firstElementChild`\
    \ has the first child node that’s an HTML element.\n\n`lastElementChild` has the\
    \ last child node that’s an HTML element.\n\n`nextElementChild` has the element\
    \ node after the current node.\n\n`previousElementChild` has the element node\
    \ before the current node.\n\n`children` has the child nodes of the current node.\n\
    \nHTML element objects have the `insertAdjacentHTML` method to insert a node according\
    \ to the position specified.\n\n## Identifying the Type and Name of a Node\n\n\
    We can identify the type with the `nodeType` property and `nodeName` identifies\
    \ the name.\n\nFor instance, `document.nodeName` return `'#document'`, and `document.nodeType`\
    \ returns 9, which means it’s a `DOCUMENT_NODE`.\n\n## Getting a Node’s Value\n\
    \nThe `nodeValue` property returns `null` for most types of nodes.\n\nBut we can\
    \ use it to extract the text from `Text` and `Comment` nodes.\n\nFor instance,\
    \ if we have:\n\n```\n<a>hi</a>\n```\n\nThen:\n\n```\nconsole.log(document.querySelector('a').firstChild.nodeValue);\n\
    ```\n\nlogs `'hi'`.\n\n## DocumentFragment\n\nA `DocumentFragment` is a type of\
    \ node that provides a lightweight document DOM that’s external to the live DOM\
    \ tree.\n\nIt’s a document template that acts like the real one but lives in memory.\n\
    \nIts child nodes can easily be manipulated in memory and appended to the live\
    \ DOM.\n\n## Creating DocumentFragments\n\nThe `createDocumentFragment` method\
    \ lets us create document fragments.\n\nFor instance, we can write:\n\n```\nconst\
    \ frag = document.createDocumentFragment();for (const s of ['foo', 'bar', 'baz'])\
    \ {\n  const p = document.createElement(\"p\");\n  p.textContent = s;\n  frag.appendChild(p);\n\
    }\n```\n\nWe created a document fragment with `createDocumentFragment`.\n\nThen\
    \ we loop through the array strings to create p elements and append them as child\
    \ elements of the fragment.\n\nThe advantage of creating a document fragment is\
    \ that we can store it in memory.\n\nIt may contain any kind of node except `body`\
    \ or `html`.\n\nThe fragment itself isn’t added to the DOM when we append a fragment.\n\
    \nOnly the node in it is added.\n\nWhen a document fragment is appended to the\
    \ DOM, it transfers from the document to the place where it’s appended.\n\nIt’ll\
    \ be removed from memory.\n\nElements, on the other hand, are always in memory.\n\
    \n## Adding a DocumentFragment to the DOM\n\nWe can pass a document fragment to\
    \ the `appendchild` and `insertBefore` to another element.\n\nFor instance, we\
    \ can append what we have in the previous example to the body by writing:\n\n\
    ```\nconst frag = document.createDocumentFragment();for (const s of ['foo', 'bar',\
    \ 'baz']) {\n  const p = document.createElement(\"p\");\n  p.textContent = s;\n\
    \  frag.appendChild(p);\n}document.body.appendChild(frag);\n```\n\nNow we add\
    \ the p elements created to the body.\n\n## Using innerHTML on a Document Fragment\n\
    \nWe can use `innerHTML` to set the content of the fragment with a string.\n\n\
    For instance, we can create a document fragment by writing:\n\n```\nconst frag\
    \ = document.createDocumentFragment();const div = document.createElement('div');\n\
    frag.appendChild(div);\nfrag.querySelector('div').innerHTML = '<p>foo</p><p>bar</p>';document.body.appendChild(frag);\n\
    ```\n\nWe create a fragment with `createFragment`. Then we create a div to hold\
    \ the contents.\n\nAnd then we set the content of the div our own HTML.\n\nFinally,\
    \ append the fragment content to body with `appendChild`.\n\n## Leaving Fragments\
    \ Containing Nodes in Memory\n\nIf we want to keep the contents of the fragment,\
    \ we can clone it.\n\nFor instance, if we have the following fragment:\n\n```\n\
    const frag = document.createDocumentFragment();for (const s of ['foo', 'bar',\
    \ 'baz']) {\n  const p = document.createElement(\"p\");\n  p.textContent = s;\n\
    \  frag.appendChild(p);\n}\n```\n\nWe can clone it by writing:\n\n```\ndocument.body.appendChild(frag.cloneNode(true));\n\
    ```\n\nThen we keep the document fragment content while appending it to the body.\n\
    \n## CSS Stylesheets\n\nWe can add styles to a page by using the link tag.\n\n\
    Also, we can add style tags or style attributes to documents.\n\nEach style sheet\
    \ is added to an HTML document is represented by the `CSSStylesheer` object.\n\
    \nIf we have a style element:\n\n```\n<style>\n  body {\n    background-color:\
    \ green;\n  }\n</style>\n```\n\nWe can retrieve a stylesheet with JavaScript by\
    \ writing:\n\n```\nconsole.log(document.querySelector('style').sheet);\n```\n\n\
    And we get an object with the style sheet.\n\n## Accessing All Style Sheets\n\n\
    We can use the `styleSheets` property to get all the style sheets.\n\nFor example,\
    \ if we have the following CSS:\n\n```\n<!doctype html>\n<html lang=\"en\">\n\
    \  <head>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh\"\
    \ crossorigin=\"anonymous\">\n    <style>\n      body {\n        background-color:\
    \ #fff;\n      }\n    </style>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\
    \nThen we can get the style sheets with:\n\n```\nconsole.log(document.styleSheets);\n\
    ```\n\nWe can also use the `sheet` property of a link element as follows:\n\n\
    ```\nconsole.log(document.querySelector('link').sheet);\n```\n\n## CSSStyleSheet\
    \ Properties and Methods\n\nA `CSSStyleSheet` has properties and methods.\n\n\
    They have the following:\n\n*   `disabled` — indicates whether the style sheet\
    \ is disabled\n*   `href` — value of the `href` attribute\n*   `media` — destination\
    \ media for the style information\n*   `ownerNode` — the node that associates\
    \ the stylesheet with the document\n*   `parentStylesheet` — the parent style\
    \ sheet\n*   `title` — value of the `title` attribute\n*   `type` — value of the\
    \ `type` attribute\n*   `cssRules` — an array-like object for holding rules that\
    \ compose the stylesheet\n*   `ownerRule` — holds the import rule which imported\
    \ the stylesheet\n*   `deleteRule` — method to remove a rule from the stylesheet\
    \ object\n*   `insertRule` — method to insert a rule into the stylesheet\n\n##\
    \ Convert a NodeList or HTMLCollection to an Array\n\nTo convert a `NodeList`\
    \ or `HTMLCollection` to an array, we can use the spread operator or the `Array.from`\
    \ method to do it.\n\nWe can write:\n\n```\nconst arr = [...document.querySelectorAll('p')];\n\
    ```\n\nor we can write:\n\n```\nconst arr = Array.from(document.querySelectorAll('p'));\n\
    ```\n\nNow we can use the array method that we want to use like `map`, `filter`,\
    \ `pop`, `push`, etc. on a `NodeList` or `HTMLCollection` object.\n\n## Traversing\
    \ Nodes in the DOM\n\nWe can traverse nodes in the DOM with various properties.\n\
    \nThey include:\n\n*   `parentNode`\n*   `firstChild`\n*   `lastChild`\n*   `nextSibling`\n\
    *   `previousSibling`\n\n`parentNode` has the parent nodes of the current node.\n\
    \n`firstChild` has the first child of the current node.\n\n`lastChild` has the\
    \ last one.\n\n`nextSibling` has the node immediately after the current node.\n\
    \n`previousSibling` has the node immediately before the current node.\n\nTo traverse\
    \ the DOM but ignore the text and comment nodes, we can use the following properties:\n\
    \n*   `firstElementChild`\n*   `lastElementChild`\n*   `nextElementSibling`\n\
    *   `previousElementSibling`\n*   `children`\n\nThe `firstElementChild` has the\
    \ first child element of the current element.\n\n`lastElementChild` has the last\
    \ child element of the current element.\n\n`nextElementChild` has the sibling\
    \ element immediately after the current one.\n"
  raw: "`createElement` creates a new element as the name suggests, `createTextNode`\
    \ creates a text node that can be put into an element.\n\nHTML Element Properties\
    \ include:\n\n*   `innerHTML`\n\n*   `outerHTML`\n\n*   `textContent`\n\n*   `innerText`\n\
    \n*   `outerText`\n\n*   `firstElementChild`\n\n*   `lastElementChild`\n\n*  \
    \ `nextElementChild`\n\n*   `previousElementChild`\n\n*   `children`\n\n`innerHTML`\
    \ has the HTML content inside an element.\n\n`outerHTML` has all the HTML content\
    \ of `innerHTML` in addition to the enclosing tags.\n\n`textContent` has the text\
    \ content inside an element.\n\n`innerText` has the text content inside an element.\n\
    \n`outerText` include the content from `innerText` plus the enclosing tags.\n\n\
    `firstElementChild` has the first child node that’s an HTML element.\n\n`lastElementChild`\
    \ has the last child node that’s an HTML element.\n\n`nextElementChild` has the\
    \ element node after the current node.\n\n`previousElementChild` has the element\
    \ node before the current node.\n\n`children` has the child nodes of the current\
    \ node.\n\nHTML element objects have the `insertAdjacentHTML` method to insert\
    \ a node according to the position specified.\n\n## Identifying the Type and Name\
    \ of a Node\n\nWe can identify the type with the `nodeType` property and `nodeName`\
    \ identifies the name.\n\nFor instance, `document.nodeName` return `'#document`\
    \ , and `document.nodeType` returns 9, which means it’s a `DOCUMENT_NODE` .\n\n\
    ## Getting a Node’s Value\n\nThe `nodeValue` property returns `null` for most\
    \ types of nodes.\n\nBut we can use it to extract the text from `Text` and `Comment`\
    \ nodes.\n\nFor instance, if we have:\n\n```\n<a>hi</a>\n```\n\nThen:\n\n```\n\
    console.log(document.querySelector('a').firstChild.nodeValue);\n```\n\nlogs `'hi'`\
    \ .\n\n## DocumentFragment\n\nA `DocumentFragment` is a type of node that provides\
    \ a lightweight document DOM that’ external to the live DOM tree.\n\nIt’s a document\
    \ template that acts like the real one but lives in memory.\n\nIts child nodes\
    \ can easily be manipulated in memory and appended to the live DOM.\n\n## Creating\
    \ DocumentFragments\n\nThe `createDocumentFragment` method lets us create document\
    \ fragments.\n\nFor instance, we can write:\n\n```\nconst frag = document.createDocumentFragment();for\
    \ (const s of ['foo', 'bar', 'baz']) {\n  const p = document.createElement(\"\
    p\");\n  p.textContent = s;\n  frag.appendChild(p);\n}\n```\n\nWe created a document\
    \ fragment with `createDocumentFragment` .\n\nThen we loop through the array strings\
    \ to create p elements and append them as child elements of the fragment.\n\n\
    The advantage of creating a document fragment is that we can store it in memory.\n\
    \nIt may contain any kind of node except `body` or `html`.\n\nThe fragment itself\
    \ isn’t added to the DOM when we append a fragment.\n\nOnly the node in it is\
    \ added.\n\nWhen a document fragment is appended to the DOM, it transfers from\
    \ the document to the place where it’s appended.\n\nIt’ll be removed from memory.\n\
    \nElements, on the other hand, are always in memory.\n\n## Adding a DocumentFragment\
    \ to the DOM\n\nWe can pass a document fragment to the `appendchild` and `insertBefore`\
    \ to another element.\n\nFor instance, we can append what we have in the previous\
    \ example to the body by writing:\n\n```\nconst frag = document.createDocumentFragment();for\
    \ (const s of ['foo', 'bar', 'baz']) {\n  const p = document.createElement(\"\
    p\");\n  p.textContent = s;\n  frag.appendChild(p);\n}document.body.appendChild(frag);\n\
    ```\n\nNow we add the p elements created to the body.\n\n## Using innerHTML on\
    \ a Document Fragment\n\nWe can use `innerHTML` to set the content of the fragment\
    \ with a string.\n\nFor instance, we can create a document fragment by writing:\n\
    \n```\nconst frag = document.createDocumentFragment();const div = document.createElement('div');\n\
    frag.appendChild(div);\nfrag.querySelector('div').innerHTML = '<p>foo</p><p>bar</p>';document.body.appendChild(frag);\n\
    ```\n\nWe create a fragment with `createFragment` . Then we create a div to hold\
    \ the contents.\n\nAnd then we set the content of the div our own HTML.\n\nFinally,\
    \ append the fragment content to body with `appendChild` .\n\n## Leaving Fragments\
    \ Containing Nodes in Memory\n\nIf we want to keep the contents of the fragment,\
    \ we can clone it.\n\nFor instance,e if we have the following fragment:\n\n```\n\
    const frag = document.createDocumentFragment();for (const s of ['foo', 'bar',\
    \ 'baz']) {\n  const p = document.createElement(\"p\");\n  p.textContent = s;\n\
    \  frag.appendChild(p);\n}\n```\n\nWe can clone it by writing:\n\n```\ndocument.body.appendChild(frag.cloneNode(true));\n\
    ```\n\nThen we keep the document fragment content while appending it to the body.\n\
    \n## CSS Stylesheets\n\nWe can add styles to a page by using the link tag.\n\n\
    Also, we can add style tags or style attributes to documents.\n\nEach style sheet\
    \ is added to an HTML document is represented by the `CSSStylesheer` object.\n\
    \nIf we have a style element:\n\n```\n<style>\n  body {\n    background-color:\
    \ green;\n  }\n</style>\n```\n\nWe can retrieve a stylesheet with JavaScript by\
    \ writing:\n\n```\nconsole.log(document.querySelector('style').sheet);\n```\n\n\
    And we get an object with the style sheet.\n\n## Accessing All Style Sheets\n\n\
    We can use the `styleSheets` property to get all the style sheets.\n\nFor example,\
    \ if we have the following CSS:\n\n```\n<!doctype html>\n<html lang=\"en\">\n\
    \  <head>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh\"\
    \ crossorigin=\"anonymous\">\n    <style>\n      body {\n        background-color:\
    \ #fff;\n      }\n    </style>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\
    \nThen we can get the style sheets with:\n\n```\nconsole.log(document.styleSheets);\n\
    ```\n\nWe can also use the `sheet` property of a link element as follows:\n\n\
    ```\nconsole.log(document.querySelector('link').sheet);\n```\n\n## CSSStyleSheet\
    \ Properties and Methods\n\nA `CSSStyleSheet` has properties and methods.\n\n\
    They have the following:\n\n*   `disabled` — indicates whether the style sheet\
    \ is disabled\n\n*   `href` — value of the `href` attribute\n\n*   `media` — destination\
    \ media for the style information\n\n*   `ownerNode` — the node that associates\
    \ the stylesheet with the document\n\n*   `parentStylesheet` — the parent style\
    \ sheet\n\n*   `title` — value of the `title` attribute\n\n*   `type` — value\
    \ of the `type` attribute\n\n*   `cssRules` — an array-like object for holding\
    \ rules that compose the stylesheet\n\n*   `ownerRule` — holds the import rule\
    \ which imported the stylesheet\n\n*   `deleteRule` — method to remove a rule\
    \ from the stylesheet object\n\n*   `insertRule` — method to insert a rule into\
    \ the stylesheet\n\n## Convert a NodeList or HTMLCollection to an Array\n\nTo\
    \ convert a NodeList or HTMLCollection to an array, we can use the spread operator\
    \ or the `Array.from` method to do it.\n\nWe can write:\n\n```\nconst arr = [...document.querySelectorAll('p')];\n\
    ```\n\nor we can write:\n\n```\nconst arr = Array.from(document.querySelectorAll('p'));\n\
    ```\n\nNow we can use the array method that we want to use like `map` , `filter`\
    \ , `pop` , `push` , etc. on a NodeList of HTMLCollection object.\n\n## Traversing\
    \ Nodes in the DOM\n\nWe can traverse nodes in the DOM with various properties.\n\
    \nThey include:\n\n*   `parentNode`\n\n*   `firstChild`\n\n*   `lastChild`\n\n\
    *   `nextSibling`\n\n*   `previousSibling`\n\n`parentNode` has the parent nodes\
    \ of the current node.\n\n`firstChild` has the first child of the current node.\n\
    \n`lastChild` has the last one.\n\n`nextSibling` has the node immediately after\
    \ the current node.\n\n`previousSibling` has the node immediately before the current\
    \ node.\n\nTo traverse the DOM but ignore the text and comment nodes, we can use\
    \ the following properties:\n\n*   `firstElementChild`\n\n*   `lastElementChild`\n\
    \n*   `nextElementSibling`\n\n*   `previousElementSibling`\n\n*   `children`\n\
    \nThe `firstElementChild` has the first child element of the current element.\n\
    \n`lastElementChild` has the last child element of the current element.\n\n`nextElementChild`\
    \ has the sibling element immediately after the current one."
