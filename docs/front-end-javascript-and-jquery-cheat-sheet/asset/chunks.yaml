  trans: "\n\n![](img/cover00153.jpeg)\n\n1. 封面\n2. 目录\n\n# 简介\n\nJavaScript 是前端 Web\
    \ 应用的基本构建块。\n\njQuery 是一个流行的用于操作 DOM 的库。\n\n在本书中，我们将探讨如何将两者结合使用。\n\n# JavaScript\n\
    \nJavaScript 是世界上最流行的编程语言之一。要有效使用它，我们需要了解其基础知识。\n\n在本节中，我们将介绍 JavaScript 的基础知识。\n\
    \n## 警告框\n\n`alert` 函数会显示一个包含我们传入文本的警告框。\n\n文本来自字符串参数。\n\n例如，可以这样写：\n\n```\nalert(\"\
    hello world!\");\n```\n\n然后会显示“hello world”。\n\n它是一个全局函数，因此是 `window` 的一个属性。`window.alert`\
    \ 与 `alert` 相同。\n\n简写形式在代码中使用没有问题。\n\n## 变量与字符串\n\n字符串是 JavaScript 代码的基本元素。它们存储文本数据。\n\
    \n具有给定名称的变量只能声明一次。\n\n字符串可以存储在变量中。变量是我们选择并赋值的名称，以便存储数据供以后使用。\n\n例如，我们可以这样写：\n\n\
    ```\nlet name = \"james\";\n```\n\n来存储名字。\n\n我们可以将用 `let` 声明的变量设置为新值。\n\n例如，我们可以这样写：\n\
    \n```\nlet name = \"james\";\nname = \"mark\";\n```\n\n那么 `name` 的值将是 `\"mark\"\
    `。\n\n我们可以声明一个变量而不给它赋值，此时它是未定义的。\n\n例如，我们可以这样写：\n\n```\nlet name;\nname = \"james\"\
    ;\n```\n\n用 `let` 声明的变量可以这样操作。\n\n变量可以使用任何不在保留关键字列表中的名称来声明。\n\n该列表位于 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#Keywords)。\n\
    \n变量不用引号括起来，而文本字符串需要用引号括起来。\n\nJavaScript 字符串可以用单引号或双引号括起来。\n\n也可以用反引号括起来。\n\n\
    如果用反引号括起来，则字符串中必须嵌入变量。\n\n例如，我们可以这样写：\n\n```\nlet firstName = 'james';\nlet lastName\
    \ = 'smith';\nlet name = `${firstName} ${lastName}`;\n```\n\n我们将 `firstName` 和\
    \ `lastName` 的值插值到字符串中。因此 `name` 应该是 `'james smith'`。\n\n这就是模板字面量。我们可以在字符串中放入任何表达式。\n\
    \n这是一种将各种表达式组合成字符串的非常方便的方式。\n\n现在我们可以赋值变量，也可以将变量传递给 `alert`，而不是传递整个字符串。\n\n例如，我们可以这样写：\n\
    \n```\nlet text = \"hello world!\"\nalert(text);\n```\n\n我们将 `text` 作为参数传递给 `alert`\
    \ 来显示警告框。\n\n在 `text` 定义之后，我们可以在任何地方引用它。\n\n## 变量与数字\n\n数字是 JavaScript 中的另一种原始数据类型。\n\
    \n我们也可以将它们赋值给变量。\n\n例如，我们可以这样写：\n\n```\nlet length = 100;\n```\n\n这使得对数字进行操作变得容易。例如，我们可以给\
    \ `length` 加上一个数字：\n\n```\nlength + 10\n```\n\n那么 `length` 与 10 的和是 110。\n\n我们知道\
    \ `length` 不是变量，因为它没有用引号括起来。\n\n而单独的数字可以用作变量名，因此 JavaScript 知道它是一个数字。\n\n我们可以将\
    \ 10 赋值给一个变量，然后用变量替换它。\n\n例如，我们可以这样写：\n\n```\nlet length = 100;\nlet additionalLength\
    \ = 10;\nlet totalLength = length + additionalLength;\n```\n\n我们有一个 `additionalLength`\
    \ 变量，将其加到 `length` 上，并将和赋值给 `totalLength` 变量。\n\n## 遍历数组\n\n我们可以使用数组的 `length`\
    \ 属性作为结束条件来遍历数组。\n\n例如，我们可以这样写：\n\n```\nlet matchFound = false;\nfor (let i =\
    \ 0; i < cleanestCities.length; i++) {\n  if (city === cleanestCities[i]) {\n\
    \    matchFound = true;\n    console.log(\"It's one of the cleanest cities\");\n\
    \  }\n}\n```\n\n我们使用 `cleanestCities` 数组的 `length` 属性作为结束条件。\n\n我们从 0 循环到 `cleanestCities.length — 1`。这样，我们从头到尾遍历所有项，而无需为结束条件设置固定的数值。\n\
    \n如果我们想提前停止循环，可以使用 `break` 关键字。\n\n例如，我们可以这样写：\n\n```\nfor (let i = 0; i < cleanestCities.length;\
    \ i++) {\n  if (city === cleanestCities[i]) {\n    console.log(\"It's one of the\
    \ cleanest cities\");\n    break;\n  }\n}\n```\n\n如果 `city` 等于 `cleanestCities[i]`，则用\
    \ `break` 结束循环。\n\n我们可以在代码中嵌套循环。例如，我们可以这样写：\n\n```\nlet firstNames = ['james',\
    \ 'mary', 'alex'];\nlet lastNames = ['jones', 'wong', 'green'];\nlet fullNames\
    \ = [];\nfor (let i = 0; i < firstNames.length; i++) {\n  for (let j = 0; j <\
    \ lastNames.length; j++) {\n    fullNames.push(`${firstNames[i]} ${ lastNames[j]}`);\n\
    \  }\n}\n```\n\n我们在一个 `for` 循环内部嵌套了另一个 `for` 循环。\n\n外层循环遍历 `firstNames` 数组。\n\n\
    每次迭代中，内层循环都会运行，遍历 `lastNames` 数组。\n\n在内层循环中，我们将 `firstNames[i]` 和 `lastNames[j]`\
    \ 的组合推入 `fullNames` 数组。\n\n结果是 `firstNames` 和 `lastNames` 条目的所有组合都被添加到 `fullNames`\
    \ 数组中。\n\n我们可以根据需要设置任意多层嵌套。然而，嵌套越多，代码越难阅读。\n\n## 改变大小写\n\n我们可以使用 `toUpperCase`\
    \ 和 `toLowerCase` 方法来改变字符串的大小写。\n\n`toUpperCase` 将字符串中的所有字母转换为大写。\n\n`toLowerCase`\
    \ 将字符串中的所有字母转换为小写。\n\n例如，我们可以这样写：\n\n```\n\"Santa Fe\".toLowerCase()\n```\n\n\
    然后得到：\n\n```\n\"santa fe\"\n```\n\n返回。\n\n而如果我们写：\n\n```\n\"Santa Fe\".toUpperCase()\n\
    ```\n\n则会得到：\n\n```\n\"SANTA FE\"\n```\n\n## 字符串长度与部分提取\n\n我们可以使用 `length` 属性获取字符串的字符数。\n\
    \n例如，我们可以这样写：\n\n```\n\"Santa Fe\".length\n```\n\n返回 8。\n\n要获取字符串的一部分，可以使用 `slice`\
    \ 方法。\n\n它接受要提取的起始索引和结束索引。\n\n结束索引本身不包含在内。\n\n例如，如果我们写：\n\n```\n\"Santa Fe\".slice(2,\
    \ 4)\n```\n\n则会返回 `\"nt\"`。\n\n## 查找字符串片段\n\n我们可以使用 `indexOf` 方法查找字符串片段。如果传入的字符串存在于调用\
    \ `indexOf` 的字符串中，它会返回该字符串的起始索引。\n\n例如，我们可以这样写：\n\n```\n\"Santa Fe\".indexOf('Fe')\n\
    ```\n\n返回 6，因为字符 'F' 位于索引 6。\n\n## if 语句\n\nif 语句让我们有条件地执行代码。\n\n例如，我们可以这样写：\n\
    \n```\nconst answer = prompt(\"Where's the capital of Italy?\");\nif (answer ===\
    \ \"Rome\") {\n  alert(\"Correct!\");\n}\n```\n\n添加一个提示框来接收问题的答案。\n\n然后在 `if`\
    \ 语句中检查答案。如果 `answer` 是 `'Rome'`，则显示 `'Correct!'` 警告框。\n\n`if` 语句后面跟着一个我们正在检查的布尔表达式。\n\
    \n如果布尔表达式返回 `true`，则执行花括号之间的代码。\n\n我们应该始终使用 `===` 来检查值相等，因为它会检查类型和值。\n\n简单的 `if`\
    \ 语句可以不写花括号，或者将语句写在一行。\n\n但使用花括号更便于阅读，因为更清晰。\n\n## 比较运算符\n\n`===` 运算符是比较运算符。\n\
    \n它是相等运算符。\n\n用于比较两个事物是否相等。\n\n我们可以使用相等运算符来比较任意两个表达式的返回值。\n\n例如，我们可以这样写：\n\n```\n\
    if (totalCost === 81.50 + 100) {\n```\n\n或者\n\n```\nif (fullName === firstName\
    \ + \" \" + \"wong\") {\n```\n\n字符串比较区分大小写，因此只有大小写完全相同时，字符串才被视为相等。\n\n"
- fmt: "\nIf we want to check if 2 expressions aren’t the same, then we can use the\
    \ `!==` inequality comparison operator.\n\nSo if we have:\n\n```\n\"Rose\" !==\
    \ \"rose\"\n```\n\nthen that returns `true` since they have letters with different\
    \ cases.\n\nJavaScript comes with more operators.\n\nThey include `>` for the\
    \ greater-than operator.\n\n`<` is the less-than operator.\n\n`>=` is the greater\
    \ than or equal to operator.\n\n`<=` is the less than or equal to operator.\n\n\
    We can use them by writing:\n\n```\nif (2 > 0) {\nif (0 < 2) {\nif (2 >= 0) {\n\
    if (2 >= 1) {\nif (0 <= 2) {\nif (1 <= 2) {\n```\n\n## if…else and else if Statements\n\
    \nIf we have more than one case to check for then we can use the `else` keyword\
    \ to add more cases.\n\nFor example, we can write:\n\n```\nconst answer = prompt(\"\
    Where's the capital of Italy?\");\nif (answer === \"Rome\") {\n  alert(\"Correct!\"\
    );\n} else {\n  alert(\"Wrong!\");\n}\n```\n\nThe `else` keyword is before the\
    \ block that’s run when `answer` isn’t `'Rome'` .\n\nIf we have more cases, then\
    \ we can add the `else if` statement.\n\nFor example, we can write:\n\n```\nconst\
    \ answer = prompt(\"Where's the capital of Italy?\");\nif (answer === \"Rome\"\
    ) {\n  alert(\"Correct!\");\n} else if (answer === \"Vatican\") {\n  alert(\"\
    Close!\");\n} else {\n  alert(\"Wrong!\");\n}\n```\n\nWe run something is `answer`\
    \ is `'Vatican'` .\n\nIf `answer` isn’t `'Rome'` or `'Vatican'` , then we run\
    \ the last block.\n\n## Testing Sets of Conditions\n\nWe can test more than one\
    \ condition with an `if` statement.\n\nTo combine them, we can use the `&&` or\
    \ `||` operators.\n\n`&&` is the logical AND operator and `||` is the logical\
    \ OR operator.\n\nFor example, we can write:\n\n```\nif (weight > 300 && time\
    \ < 6) {\n  alert(\"athlete\");\n} else {\n  alert(\"chef\");\n}\n```\n\nto check\
    \ the value of `weight` and `time` together.\n\nIf `weight` is less than 300 and\
    \ `time` is less than 6, then the first block is run.\n\nOtherwise, then 2nd block\
    \ is run.\n\nWe can chain more conditional together:\n\n```\nif (weight > 300\
    \ && time < 6 && age > 17 && gender === \"male\") {\n  alert(\"athlete\");\n}\
    \ else {\n  alert(\"chef\");\n}\n```\n\nThis will test if all the conditional\
    \ are `true` . If they’re all `true` , then the first block is run,\n\nOtherwise,\
    \ the 2nd block is run.\n\nThe `||` operator can be used in a similar way.\n\n\
    For example, we can write:\n\n```\nif (SAT > avg || GPA > 2.5 || sport === \"\
    football\") {\n  alert(\"accepted\");\n} else {\n  alert(\"not accepted\");\n\
    }\n```\n\nThe `||` operator returns `true` if any of the conditional returns `true` .\n\
    \nWe can mix `||` and `&&` together.\n\nFor example, we can write:\n\n```\nif\
    \ (age > 65 || age < 21 && res === \"U.S.\")\n```\n\nThe `&&` takes precedence,\
    \ so `res === \"U.S.\"` is evaluated first.\n\nAnd the `||` operator is evaluated\
    \ next.\n\nTo make this clearer, we should surround the expressions with parentheses\
    \ so everyone can read it easily:\n\n```\nif ((age > 65 || age < 21) && res ===\
    \ \"U.S.\")\n```\n\n## Nested if Statements\n\nWe can nest `if` statements. For\
    \ example, we can write:\n\n```\nif (c === d) {\n  if (x === y) {\n    g = h;\n\
    \  } else if (a === b) {\n    g = h;\n  } else {\n    v = u;\n  }\n} else {\n\
    \  v = u;\n}\n```\n\nWe nest the inner expressions with 2 spaces to make them\
    \ easy to type and readable.\n\nWe shouldn't have too many levels of nesting since\
    \ it’s hard to read.\n\n## Arrays\n\nThere’s often a need to store many values\
    \ in our programs.\n\nTo make this easier, we can use arrays.\n\nFor example,\
    \ instead of repeatedly declaring variables to store similar values:\n\n```\n\
    let city0 = \"Oslo\";\nlet city1 = \"Rome\";\nlet city2 = \"Toronto\";\nlet city3\
    \ = \"Denver\";\nlet city4 = \"Los Angeles\";\nlet city5 = \"Seattle\";\n```\n\
    \nWe can put them all into an array by writing:\n\n```\nlet cities = [\"Oslo\"\
    , \"Rome\", \"Toronto\", \"Denver\", \"Los Angeles\", \"Seattle\"];\n```\n\nArrays\
    \ are very useful for storing a list of data that are fixed size or dynamic size.\n\
    \nWe can access an array entry by its index.\n\nFor example, we can write:\n\n\
    ```\ncities[2]\n```\n\nJavaScript can be an array with different types. For example,\
    \ we can write:\n\n```\nlet mixedArray = [1, \"james\", \"mary\", true];\n```\n\
    \nThe index of the first entry is 0\\. The same naming rules for variables apply\
    \ to arrays.\n\nArrays can only be declared once like other variables.\n\n## Finding\
    \ a Character at a Location in a String\n\nWe can find a character at a location\
    \ in a string with the `charAt` method or the square brackets notation.\n\nFor\
    \ example, we can write:\n\n```\nlet firstChar = 'james'.charAt(0)\n```\n\nthen\
    \ `firstChar` is `'j'` .\n\nThis is the same as:\n\n```\nlet firstChar = 'james'[0]\n\
    ```\n\nThey’re the same, so the square brackets are used more often since it’s\
    \ shorter.\n\n## Replacing Characters\n\nThe `replace` method lets us replace\
    \ characters.\n\nFor example, we can write:\n\n```\nlet newText = text.replace(\"\
    World War II\", \"the Second World War\");\n```\n\nto replace `\"World War II\"\
    ` with the `\"the Second World War\"` .\n\nIt’ll search for the first instance\
    \ of it and replace it.\n\nTo search all instances of it and replace all of them,\
    \ we need to use a regex:\n\n```\nlet newText = text.replace(/World War II/g,\
    \ \"the Second World War\");\n```\n\nThe `g` flag stands for global. This means\
    \ it’ll replace all of them.\n\n## Rounding Numbers\n\nWe can use the `Math.round`\
    \ method to round numbers.\n\nFor example, we can write:\n\n```\nlet score = Math.round(11.1);\n\
    ```\n\nThen we round 11.1 to 11 with `Math.round` .\n\nIt rounds to the nearest\
    \ integer.\n\nThe function rounds up when the decimal is .5.\n\nTo always round\
    \ up to the nearest integer, we can use the `Math.ceil` method:\n\n```\nlet score\
    \ = Math.ceil(11.1);\n```\n\nThen we get 12.\n\nTo always round down to the nearest\
    \ integer, we can use the `Math.floor` method:\n\n```\nlet score = Math.floor(11.1);\n\
    ```\n\n## Generating Random Numbers\n\nJavaScript comes with a function to generate\
    \ random numbers.\n\nThe `Math.random` method lets us create a random number between\
    \ 0 and 1.\n\nFor example, we can write:\n\n```\nlet randomNumber = Math.random();\n\
    ```\n\nThe returned number has 16 decimal places.\n\n## Converting Strings to\
    \ Integers and Decimals\n\nConvert strings with numbers to an integer or decimal\
    \ number is something that we often have to do.\n\nWe can use the `parseInt` method\
    \ to convert a string into an integer.\n\nAnd we can use the `parseFloat` method\
    \ to convert a string into a decimal number.\n\nFor example, we can write:\n\n\
    ```\nlet currentAge = prompt(\"Enter your age.\");\nlet age = parseInt(currentAge);\n\
    ```\n\nWe have the `parseInt` method to convert the entered number into an integer.\n\
    \n`prompt` always returns a string, so we’ll have to convert it to an integer.\n\
    \nTo convert the entered text into a decimal number, we can use `parseFloat` :\n\
    \n```\nlet currentAge = prompt(\"Enter your age.\");\nlet age = parseFloat(currentAge);\n\
    ```\n\n## Converting Strings to Numbers and Vice Versa\n\nTo convert a string\
    \ to a number, we can use the `Number` global function:\n\n```\nlet num = Number('123');\n\
    ```\n\nThen `num` is `123` .\n\nTo convert a number to a string, we can use the\
    \ `toString` method:\n\n```\nlet num = 1234;\nlet numberAsString = num.toString();\n\
    ```\n\nThe `numberAsString` is `'1234'` .\n\n## Adding and Removing elements\n\
    \nWe can add and remove array elements easily with JavaScript.\n\nTo add elements,\
    \ we just assign a value to the array index we want.\n\nFor example, we can write:\n\
    \n```\nlet animals = [];\nanimals[0] = \"dog\";\nanimals[1] = \"cat\";\nanimals[2]\
    \ = \"mouse\";\n```\n\nWe created the `animals` array by creating a variable and\
    \ assigning it to an empty array.\n\nThen we assign values to the given index\
    \ of `animals` .\n\nWe can do this for any index and the indexes don’t have to\
    \ be consecutive or in order.\n\nTo remove the last item from the array, we call\
    \ the `pop` method:\n\n```\nanimals.pop()\n```\n\nAn alternative to add elements\
    \ to an array is to use the `push` method:\n\n```\nanimals.push(\"fish\", \"bird\"\
    );\n```\n\n`push` adds elements to the end of the array.\n\nTo remove the first\
    \ element of an array, we can `shift` :\n\n```\nanimals.shift();\n```\n\nTo add\
    \ one more elements to the beginning of an array, we call `unshift` :\n\n```\n\
    animals.shift(\"fish\", \"bird\");\n```\n\nThe `splice` method insert one or more\
    \ elements anywhere in the array:\n"
