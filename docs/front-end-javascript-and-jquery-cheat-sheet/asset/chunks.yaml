    For example, if we have:\n\n```\n\n<p>\n\n  click me\n\n</p>\n\n```\n\nWe can\
    \ get the `p` element that we clicked on by writing:\n\n```\n\n$(\"p\").click(function(event)\
    \ {\n\n  alert(event.currentTarget === this);\n\n});\n\n```\n\nThe `alert` should\
    \ be `true` since `this` is the `p` element that we clicked on, which is the same\
    \ as `event.currentTarget` .\n\n## event.data\n\nThe `event.data` is a property\
    \ with the data that as pass into an event.\n\nFor example, if we have the following\
    \ HTML:\n\n```\n\n<button> 0 </button>\n\n<button> 1 </button>\n\n<button> 2 </button>\n\
    \n<button> 3 </button>\n\n<button> 4 </button>\n\n```\n\nThen we can add click\
    \ listeners to each element and get the data by writing:\n\n```\n\nfor (let i\
    \ = 0; i < 5; i++) {\n\n  $(\"button\").eq(i).on(\"click\", {\n\n    value: i\n\
    \n  }, function(event) {\n\n    console.log('value: ', event.data.value)\n\n \
    \ });\n\n}\n\n```\n\nWe get the `event.data.value` property’s value in the click\
    \ callback.\n\nThis should be the same value as the `value` property we pass in\
    \ as the 2nd argument.\n\n## event.delegateTarget\n\nThe `event.delegateTarget`\
    \ property has the element where the currently called jQuery event handler was\
    \ attached.\n\nFor example, if we have:\n\n```\n\n<div class='box'>\n\n  <button>\n\
    \n    0\n\n  </button>\n\n</div>\n\n<div class='box'>\n\n  <button>\n\n    1\n\
    \n  </button>\n\n</div>\n\n<div class='box'>\n\n  <button>\n\n    2\n\n  </button>\n\
    \n</div>\n\n```\n\nThen we can set the div with the class `box` to have a red\
    \ background when we click on the button inside by writing:\n\n```\n\n$(\".box\"\
    ).on(\"click\", \"button\", function(event) {\n\n  $(event.delegateTarget).css(\"\
    background-color\", \"red\");\n\n});\n\n```\n\n## event.isDefaultPrevented()\n\
    \nWe can call `event.isDefaultPrevented()` to check whether `event.preventDefault()`\
    \ is called on an object.\n\nFor example, if we have:\n\n```\n\n<a>hello</a>\n\
    \n```\n\nThen we can call this method by writing:\n\n```\n\n$(\"a\").click(function(event)\
    \ {\n\n  alert(event.isDefaultPrevented());\n\n  event.preventDefault();\n\n \
    \ alert(event.isDefaultPrevented());\n\n});\n\n```\n\nWe call the method and show\
    \ its return value in the alert box.\n\n## event.isPropagationStopped()\n\nWe\
    \ can call the `event.isPropagationStopped()` method to check if we called `event.stopPropagation()` .\n\
    \nFor example, if we have:\n\n```\n\n<button>click me</button>\n\n```\n\nThen\
    \ we can call this method by writing:\n\n```\n\n$(\"button\").click(function(event)\
    \ {\n\n  alert(event.isPropagationStopped());\n\n  event.stopPropagation();\n\n\
    \  alert(event.isPropagationStopped());\n\n});\n\n```\n\n## event.metaKey\n\n\
    We can check whether the meta key is pressed when an event is fired with the `event.metaKey`\
    \ property.\n\nIn Windows, the meta key is the Windows key.\n\nIn macOS, the meta\
    \ key is the command key.\n\nFor example, if we have:\n\n```\n\n<button value=\"\
    Test\" name=\"Test\" id=\"checkMetaKey\">Click me!</button>\n\n```\n\nThen we\
    \ can check if the meta key is pressed when we click on the click me button by\
    \ writing:\n\n```\n\n$(\"#checkMetaKey\").click(function(event) {\n\n  console.log(event.metaKey);\n\
    \n});\n\n```\n\n## event.namespace\n\nWe can get the namespace of the event by\
    \ using the `event.namespace` property.\n\nFor example, if we have:\n\n```\n\n\
    <button>display event.namespace</button>\n\n<p>\n\n</p>\n\n```\n\nThen we can\
    \ trigger an event with a namespace by writing:\n\n```\n\n$(\"p\").on(\"test.something\"\
    , function(event) {\n\n  alert(event.namespace);\n\n});\n\n$(\"button\").click(function(event)\
    \ {\n\n  $(\"p\").trigger(\"test.something\");\n\n});\n\n```\n\nWe trigger the\
    \ `test.something` event on thr `p` element when we click on a button.\n\nThen\
    \ `event.namespace` should be `something` and that’s displayed in the alert.\n\
    \n## event.pageX and event.pageY\n\nWe can get the x and y-coordinates of the\
    \ mouse position relative to the left edge of the document with the `event.pageX`\
    \ and `event.pageY` properties respectively.\n\nFor example, we can log the mouse\
    \ coordinate as the mouse moves by writing HTML:\n\n```\n\n<div id=\"log\"></div>\n\
    \n```\n\nand JavaScript:\n\n```\n\n[](#cb472-1)$(document).on(\"mousemove\", function({\n\
    \n[](#cb472-2)  pageX,\n\n[](#cb472-3)  pageY\n\n[](#cb472-4)}) {\n\n[](#cb472-5)\
    \  $(\"#log\").text(`${pageX}, ${pageY}`);\n\n[](#cb472-6)});\n\n```\n\nWe listen\
    \ to the `mousemove` event and get the `pageX` and `pageY` properties from the\
    \ `event` object.\n\n## event.preventDefault()\n\nWe call the `event.preventDefault()`\
    \ method to prevent the default action from being run in our event.\n\nFor example,\
    \ if we have:\n\n```\n\n<a href='https://google.com'>hello</a>Then\n\n```\n\n\
    Then we can prevent users from going to [https://google.com](https://google.com)\
    \ by writing:\n\n```\n\n$(\"a\").click(function(event) {\n\n  event.preventDefault();\n\
    \n});\n\n```\n\n## event.relatedTarget\n\nThe `event.relatedTarget` property gets\
    \ the other DOM elements involved in an event.\n\nFor example, if we have:\n\n\
    ```\n\n<div>\n\n  <a href='https://google.com'>hello</a>\n\n</div>\n\n```\n\n\
    Then when we move the mouse of of the `a` element, we can get the element that\
    \ the mouse moved to with this property:\n\n```\n\n$(\"a\").mouseout(function(event)\
    \ {\n\n  alert(event.relatedTarget.nodeName);\n\n});\n\n```\n\nWe should see `DIV`\
    \ in the alert since the mouse moved to the div.\n\n## event.result\n\nThe `event.result`\
    \ property returns the last value returned by an event handler that’s triggered\
    \ by the event.\n\nFor example, if we have:\n\n```\n\n<button>display event.result</button>\n\
    \n```\n\nThen we can return a value in a click listener function and get its value\
    \ with `event.result` :\n\n```\n\n$(\"button\").click(function(event) {\n\n  return\
    \ \"hello\";\n\n});\n\n$(\"button\").click(function(event) {\n\n  console.log(event.result);\n\
    \n});\n\n```\n\nWe return `'hello'` in the first click listener.\n\nThen we log\
    \ `event.result` in the 2nd click listener.\n\nIt should log `'hello'` since that’s\
    \ the return value of the first click listener.\n\n## event.stopImmediatePropagation()\n\
    \nWe can call the `event.stopImmediatePropagation()` method to stop event propagation.\n\
