  trans: "\n我们调用 `trigger`，第一个参数是事件名称，第二个参数是一个数组，包含我们想要随事件发送的数据。\n\n要监听 `myCustomEvent`\
    \ 事件，我们调用 `on`，第一个参数是相同的事件名称。\n\n第二个参数是一个回调函数，在事件触发时运行。\n\n`myName` 的值是 `'John'`，所以我们看到它被添加到了\
    \ `p` 元素中。\n\n## `.one()`\n\n`.one()` 方法为元素上的事件附加一个处理程序。\n\n该处理程序在每个元素上，针对每种事件类型，最多运行一次。\n\
    \n例如，如果我们有以下代码：\n\n```\n<p id='foo'>foo</p>\n```\n\n那么我们可以这样写：\n\n```\n$(\"#foo\"\
    ).one(\"click mouseover\", function(event) {\n  alert(\"The \" + event.type +\
    \ \" event happened!\");\n});\n```\n\n使用 `one` 方法为 ID 为 `foo` 的 `p` 元素上的 `click`\
    \ 和 `mouseover` 事件添加监听器。\n\n## `:only-child` 选择器\n\n`:only-child` 选择器选取所有作为其父元素唯一子元素的元素。\n\
    \n例如，如果我们有以下代码：\n\n```\n<div>\n  <button>Sibling</button>\n  <button>Sibling</button>\n\
    </div>\n<div>\n  <button>Sibling</button>\n</div>\n<div>\n  None\n</div>\n<div>\n\
    \  <button>Sibling</button>\n  <button>Sibling</button>\n  <button>Sibling</button>\n\
    </div>\n<div>\n  <button>Sibling</button>\n</div>\n```\n\n那么我们可以通过编写以下代码，为 div\
    \ 中唯一的按钮添加边框并更改文本：\n\n```\n$(\"div button:only-child\").text(\"Alone\").css(\"\
    border\", \"2px blue solid\");\n```\n\n因此，第二个和最后一个 div 中的按钮文本会被更改，并添加边框。\n\n##\
    \ `:only-of-type` 选择器\n\n我们可以使用 `:only-of-type` 选择器选取所有没有相同元素名称兄弟元素的元素。\n\n例如，如果我们有以下代码：\n\
    \n```\n<div>\n  <button>Sibling</button>\n  <button>Sibling</button>\n</div>\n\
    <div>\n  <button>Sibling</button>\n</div>\n<div>\n  None\n</div>\n<div>\n  <button>Sibling</button>\n\
    \  <button>Sibling</button>\n  <button>Sibling</button>\n</div>\n<div>\n  <button>Sibling</button>\n\
    </div>\n```\n\n那么我们可以通过编写以下代码，获取 div 中唯一的按钮：\n\n```\n$(\"button:only-of-type\"\
    ).text(\"Alone\").css(\"border\", \"2px blue solid\");\n```\n\n然后更改它们的文本并添加边框。\n\
    \n## `.outerHeight()`\n\n`.outerHeight()` 方法允许我们获取计算后的外部高度，包括内边距、边框，以及可选的边距，适用于匹配元素集合中的第一个元素。\n\
    \n它也可以用于设置每个匹配元素的外部高度。\n\n例如，如果我们有以下代码：\n\n```\n<p>Hello</p>\n```\n\n那么我们可以通过编写以下代码，获取包含边距的外部高度：\n\
    \n```\nconst p = $(\"p\").first();\nconsole.log(p.outerHeight(true));\n```\n\n\
    `true` 表示包含边距。\n\n如果我们有以下代码：\n\n```\n<div>d</div>\n<div>d</div>\n<div>d</div>\n\
