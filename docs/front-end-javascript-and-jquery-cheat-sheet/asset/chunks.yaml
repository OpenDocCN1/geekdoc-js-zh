    );\n\n[](#cb450-7)  });\n\n```\n\nto add that.\n\n## deferred.pipe()\n\nWe can\
    \ use the `deferred.pipe()` method to filter and chain deferred objects.\n\nIt\
    \ returns another deferred object.\n\nWe can use it by writing:\n\n```\n\nconst\
    \ defer = $.Deferred(),\n\n  filtered = defer.pipe(function(value) {\n\n    return\
    \ value * 2;\n\n  });\n\ndefer.resolve(5);\n\nfiltered.done(function(value) {\n\
    \n  alert(value);\n\n});"
