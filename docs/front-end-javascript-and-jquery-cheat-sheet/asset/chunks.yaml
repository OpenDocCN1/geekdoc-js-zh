  trans: "\n例如，我们可以编写以下 HTML：\n\n```\n<img src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onClick=\"makeInvisible();\">\n```\n\n然后我们可以添加以下 CSS：\n\n```\n\
    .hidden {\n  visibility: hidden;\n}\n```\n\n接着 `makeInvisible` 函数如下：\n\n```\n\
    const makeInvisible = () => {\n  document.getElementById(\"image\").className\
    \ = \"hidden\";\n}\n```\n\n`hidden` 类将 `visibility` 属性设置为 `hidden`。\n\n因此，当我们点击图片时，会执行\
    \ `makeInvisible` 函数。\n\n然后 `hidden` 类会被添加到 `img` 元素上。\n\n于是图片就会隐藏。\n\n## 添加类名\n\
    \n我们可以使用 JavaScript 的类名 API 为 HTML 元素添加类名。\n\n例如，我们可以编写以下 HTML：\n\n```\n<img src=\"\
    https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onClick=\"expand();\">\n```\n\n然后我们可以编写以下 CSS：\n\n```\n.big {\n\
    \  width: 500px;\n}\n```\n\n接着我们可以通过编写以下代码来添加 `expand` 函数：\n\n```\nconst expand\
    \ = () => {\n  document.getElementById(\"image\").classList.add('big');\n}\n```\n\
    \n`big` 类将宽度设置为 500px。\n\n在 `expand` 函数中，我们调用 `classList.add` 方法，将 `'big'` 类添加到\
    \ ID 为 `image` 的元素上。\n\n并且我们将 `onClick` 属性设置为 `expand()`，以便在点击图片时调用 `expand` 函数。\n\
    \n这样，当我们点击图片时，图片就会放大。\n\n## 交换图片\n\n我们可以在鼠标悬停时交换图片。\n\n例如，我们可以编写以下 HTML：\n\n```\n\
    <img src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    \ id=\"image\" onMouseover=\"swap(1);\" onMouseout=\"swap(0)\">\n```\n\n以及以下 JavaScript\
    \ 代码：\n\n```\nconst swap = (index) => {\n  const images = [\n    'https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo',\n\
    \    'https://i.picsum.photos/id/25/200/300.jpg?hmac=ScdLbPfGd_kI3MUHvJUb12Fsg1meDQEaHY_mM613BVM'\n\
    \  ]\n  const image = document.querySelector('#image');\n  image.src = images[index];\n\
    }\n```\n\n当我们悬停在图片上时，会执行 `swap(1)` 表达式。\n\n它被设置为 `onMouseover` 属性的值，因此当我们悬停在图片元素上时就会执行。\n\
    \n如果我们将鼠标移出图片，则会执行 `swap(0)` 来显示原始图片。\n\n这是因为 `swap(0)` 被设置为 `onMouseout` 属性的值。\n\
    \n## 设置样式\n\n我们可以使用 `className` 或 `style` 属性来设置样式。\n\n例如，我们可以编写以下 HTML：\n\n```\n\
    <p>\n  hello world\n</p>\n```\n\n并编写以下 CSS：\n\n```\n.big {\n  font-size: 2em\n\
    }\n```\n\n然后编写以下代码，用 JavaScript 将文本放大：\n\n```\ndocument.querySelector(\"p\").classList.add(\"\
    big\");\n```\n\n我们通过 `document.querySelector` 方法获取 `p` 元素。\n\n然后通过 `classList.add`\
    \ 方法将 `big` 类添加到 `p` 元素上。\n\n或者，我们可以将 `style` 属性设置为我们想要的值：\n\n```\ndocument.querySelector(\"\
    p\").style.fontSize = '2em'\n```\n\n`style.fontSize` 属性等同于 CSS 的 `font-size` 属性。\n\
    \n不过，最好使用 CSS 和类名，因为这样比用 JavaScript 设置样式更快。\n\n此外，CSS 代码的可复用性也更高。\n\n我们可以设置的其他\
    \ `style` 属性包括：\n\n```\ndocument.querySelector(\"p\").style.cssFloat = \"left\"\
    ;\n```\n\n用于将 CSS 的 `float` 属性设置为 `left`。\n\n我们可以通过编写以下代码来设置 CSS 的 `visibility`\
    \ 属性：\n\n```\ndocument.querySelector(\"p\").style.visibility = \"hidden\";\n```\n\
    \n而外边距可以通过编写以下代码来设置：\n\n```\ndocument.querySelector(\"p\").style.margin = \"0\
    \ 10px 0 10px;\";\n```\n\n## 按标签名获取所有元素\n\n我们可以通过标签名获取所有元素。\n\n这比通过 ID 获取单个元素或使用\
    \ `querySelector` 获取第一个匹配选择器的元素更方便。\n\n例如，我们可以编写以下 HTML：\n\n```\n<p>foo.</p>\n\
    <p>bar.</p>\n<p>baz.</p>\n```\n\n然后我们可以通过编写以下代码获取所有 `p` 元素并遍历它们：\n\n```\nconst\
    \ pars = document.getElementsByTagName('p')\nfor (const p of pars) {\n  p.style.fontFamily\
    \ = \"Verdana, Geneva, sans-serif\";\n}\n```\n\n我们获取 `p` 元素，然后使用 `for-of` 循环遍历它们。\n\
    \n在循环体中，我们设置 `fontFamily` 样式来改变文本的字体。\n\n## 构造函数方法\n\n我们可以向构造函数或类中添加方法。\n\n例如，我们可以编写：\n\
    \n```\nclass Plan {\n  constructor(name, price, space, pages) {\n    this.name\
    \ = name;\n    this.price = price;\n    this.space = space;\n    this.pages =\
    \ pages;\n  }\n\n  calcAnnualPrice() {\n    return this.price * 12;\n  }\n}\n\
    ```\n\n我们添加了 `calcAnnualPrice` 方法，用于返回 `this.price * 12` 的值。\n\n`this` 是类的实例，即当我们调用\
    \ `Plan` 类时创建并返回的对象。\n\n因此，我们从类创建的对象中获取 `price` 属性，并将其乘以 12。\n\n要调用构造函数并在创建的对象上调用方法，我们可以编写：\n\
    \n```\nconst plan = new Plan('basic', 3, 100, 10)\nconsole.log(plan.calcAnnualPrice())\n\
    ```\n\n我们使用 `new` 关键字调用 `Plan` 构造函数。\n\n然后我们在 `plan` 对象上调用 `calcAnnualPrice` 来获取年费。\n\
    \n类语法只是原型继承之上的语法糖。\n\n`calcAnnualPrice` 方法只是 `Plan` 的 `prototype` 属性的一个属性。\n\n\
    `prototype` 是 `Plan` 类的原型，即它继承的对象。\n\n如果我们打印 `Plan.prototype.calcAnnualPrice`\
    \ 的值：\n\n```\nconsole.log(Plan.prototype.calcAnnualPrice)\n```\n\n我们会看到 `calcAnnualPrice`\
    \ 方法的代码被打印出来。\n\n## 检查属性和方法\n\n要检查某个属性或方法是否真正存在于对象本身而非其原型中，我们可以使用 `hasOwnProperty`\
    \ 方法。\n\n例如，如果我们从 `Plan` 类创建了一个对象：\n\n```\nconst plan = new Plan('basic', 3, 100,\
    \ 10)\n```\n\n那么我们可以通过编写以下代码来调用 `hasOwnProperty`：\n\n```\nconsole.log(plan.hasOwnProperty('name'))\n\
    ```\n\n我们应该会看到 `true` 被打印出来，因为 `name` 是 `plan` 对象自身的属性。\n\n`hasOwnProperty` 方法来自\
    \ `Object.prototype`，这是几乎所有 JavaScript 对象都有的属性。\n\n如果我们想列出对象的属性，可以编写：\n\n```\n\
    for (const prop in plan) {\n  if (plan.hasOwnProperty(prop)) {\n    console.log(prop);\n\
    \  }\n}\n```\n\n我们使用 `for-in` 循环遍历 `plan` 的属性键。\n\n`for-in` 循环会遍历所有属性及其原型上的属性，因此我们必须使用\
    \ `hasOwnProperty` 方法来检查某个属性是否真正存在于 `plan` 对象本身。\n\n`prop` 是属性名本身。\n\n因此，我们应该看到：\n\
    \n```\nname\nprice\nspace\npages\n```\n\n被打印出来。\n\n## 获取 URL\n\n我们可以使用 JavaScript\
    \ 获取和设置页面的 URL。\n\n要获取 URL，我们可以使用 `window.location.href` 属性。\n\n如果我们在浏览器开发者控制台中输入该属性，应该会得到页面的完整\
    \ URL。\n\n`window.location.hostname` 包含主机名，即 URL 的第一部分。\n\n例如，如果 URL 是 `\"https://jsfiddle.net/09t6La27/10/\"\
    `，那么 `window.location.hostname` 返回 `\"jsfiddle.net\"`。\n\n`window.location.hash`\
    \ 返回 URL 中 `#` 符号之后的部分。\n\n例如，如果 URL 是 `http://example.com/#foo`，那么 `window.location.hash`\
    \ 返回 `\"#foo\"`。\n\n## 对象\n\n我们需要对象来存储除原始值（如数字、字符串、布尔值等）之外的值。\n\n它作为我们想要存储的所有项目的容器。\n\
    \n例如，我们可以通过编写以下代码来定义一个对象：\n\n```\nconst plan = {\n  name: \"Basic\",\n  price:\
    \ 3,\n  space: 100,\n  transfer: 1000,\n  pages: 10\n};\n```\n\n我们创建了带有多个属性的 `plan`\
    \ 对象。\n\n`name`、`price`、`space`、`transfer` 和 `pages` 是属性名。\n\n冒号后面的表达式是它们的值。\n\
    \n属性之间用逗号分隔。\n\n"
- fmt: "\nTo access a property, we can write:\n\n```\nplan.name\n```\n\n`plan.name`'s\
    \ value should be `'Basic'`.\n\nWe can assign properties with different values.\n\
    \nFor example, we can write:\n\n```\nplan.name = 'Deluxe';\n```\n\nThen `name`\
    \ property's new value is `'Deluxe'`.\n\nWe can assign values with any data type\
    \ with the assignment operator.\n\nTo check if a property is in an object, we\
    \ can use the `in` operator.\n\nFor example, if we have:\n\n```\n'name' in plan\n\
    ```\n\nthen that should return `true` since `name` is a property of `plan`.\n\n\
    But if we have:\n\n```\n'foo' in plan\n```\n\nthen that returns `false` since\
    \ `foo` isn't a property of `plan`.\n\nWe need the property name in quotes since\
    \ the left operand is a string.\n\n## Object Methods\n\nObjects can have methods.\n\
    \nFor example, we can write:\n\n```\nconst plan = {\n  name: \"Basic\",\n  price:\
    \ 3,\n  space: 100,\n  transfer: 1000,\n  pages: 10,\n  calcAnnualPrice() {\n\
    \    return this.price * 12;\n  }\n};\n```\n\nto add the `calcAnnualPrice` method\
    \ into the `plan` object.\n\n`this` is the object itself, so `this.price * 12`\
    \ returns the value of the `price` property multiplied by 12.\n\n## Constructors\n\
    \nWe can create objects with the same structure with constructors.\n\nThey're\
    \ the templates for objects.\n\nTo create a constructor, we can write:\n\n```\n\
    function Plan(name, price, space, pages) {\n  this.name = name;\n  this.price\
    \ = price;\n  this.space = space;\n  this.pages = pages;\n}\n```\n\nWe created\
    \ the `Plan` constructor that takes the `name`, `price`, `space`, and `pages`\
    \ parameters.\n\nThen we assign them to properties of `this` with the same name.\n\
    \nWhen we invoke the constructor, `this` will be returned with all the properties\
    \ we assigned.\n\nTo invoke it, we can write:\n\n```\nconst plan = new Plan('basic',\
    \ 3, 100, 10)\n```\n\nWe use the `new` keyword to call the constructor and create\
    \ the object.\n\nThe value of `plan` is:\n\n```\n{\n  name: \"basic\"\n  pages:\
    \ 10\n  price: 3\n  space: 100\n}\n```\n\nA better way to write the constructor\
    \ is to use the class syntax.\n\nFor example, we can write:\n\n```\nclass Plan\
    \ {\n  constructor(name, price, space, pages) {\n    this.name = name;\n    this.price\
    \ = price;\n    this.space = space;\n    this.pages = pages;\n  }\n}\n```\n\n\
    The `constructor` method is the same as the constructor function we have before.\n\
    \nIt just looks different. This is the preferred way to create constructors since\
    \ it's consistent with other popular object-oriented languages.\n\n## Target All\
    \ Elements by Tag Name with `querySelectorAll`\n\nThe `document.querySelectorAll`\
    \ method lets us get all the elements with the given selector.\n\nSo to get all\
    \ the elements with the given tag name, we can write the following HTML:\n\n```\n\
    <p>foo.</p>\n<p>bar.</p>\n<p>baz.</p>\n```\n\nThen we can get all of them and\
    \ style them by writing:\n\n```\nconst pars = document.querySelectorAll('p')\n\
    for (const p of pars) {\n  p.style.fontFamily = \"Verdana, Geneva, sans-serif\"\
    ;\n}\n```\n\nWe get all the `p` elements with `document.querySelectorAll`.\n\n\
    Then we loop through each item with the for-of loop and set the `style.fontFamily`\
    \ property to set the font family.\n\n## Target Some Elements by Tag Name\n\n\
    We can target some elements by tag name with the `document.querySelectorAll` method\
    \ since it takes any selector string as an argument.\n\nFor example, if we have\
    \ the following HTML table:\n\n```\n<table>\n  <tr>\n    <td>foo</td>\n    <td>bar</td>\n\
    \    <td>baz</td>\n  </tr>\n</table>\n```\n\nand we want to get all the `td` elements\
    \ in the table, we can write:\n\n```\nconst tds = document.querySelectorAll('table\
    \ td')\nfor (const t of tds) {\n  t.style.backgroundColor = \"pink\";\n}\n```\n\
    \nWe get the `td` elements within the `table` element with the `table td` selector.\n\
    \nThen we loop through the `td` elements and set the `backgroundColor` to `'pink'`.\n\
    \n## The DOM\n\nThe DOM stands for Document Object Model. It's the way that browsers\
    \ represent the HTML elements with JavaScript.\n\nHTML elements are organized\
    \ in a tree structure in the DOM.\n\nEach level is indicated by the indentation.\n\
    \nFor example, if we have:\n\n```\n<html>\n\n  <head>\n    <title>\n      Simple\
    \ document\n    </title>\n  </head>\n\n  <body>\n    <p>\n      hello world\n\
    \    </p>\n  </body>\n\n</html>\n```\n\nThen the `html` element is the root of\
    \ the tree.\n\nThe `head` and `body` are at the 2nd level.\n\nThe `title` and\
    \ `p` elements are at the 3rd level.\n\nThe topmost element is the `document`\
    \ object.\n\nTherefore `html` element is the parent of the `head` and `body` elements.\n\
    \nThe `title` element is the child of the `head` element.\n\nAnd the `p` element\
    \ is the child of the `body` element.\n\nWe can find child elements with the DOM\
    \ methods that we used before like `querySelector`, `querySelectorAll`, `getElementById`\
    \ and `getElementByTagName`.\n\nFor example, if we have the following HTML:\n\n\
    ```\n<html>\n\n<head>\n    <title>\n      Simple document\n    </title>\n  </head>\n\
    \n  <body>\n    <div id=\"weather\">\n      <p>Today is sunny.</p>\n      <p>Yesterday\
    \ is rainy.</p>\n    </div>\n    <div id=\"density\">\n      <p>City is crowded.</p>\n\
    \      <p>Desert is sparse.</p>\n    </div>\n  </body>\n</html>\n```\n\nThen if\
    \ we want to get the 'Today is sunny' text, we can write:\n\n```\nconst sunny\
    \ = document.querySelector('#weather p');\nconsole.log(sunny.innerHTML)\n```\n\
    \nWe use the `#weather p` selector with the `querySelector` method to get the\
    \ first p element from the div with the ID `weather`.\n\nThen we get its content\
    \ with the `innerHTML` property.\n\n## Node Object Types\n\nThere are several\
    \ kinds of node types.\n\nThey include:\n\n*   `DOCUMENT_NODE` — `window.document`\n\
    \n*   `ELEMENT_NODE` — body, a, p, h1, etc.\n\n*   `ATTRIBUTE_NODE` — `id='foo'`,\
    \ `class='foo'`\n\n*   `TEXT_NODE` — text that is between the tags.\n\n*   `DOCUMENT_FRAGMENT_NODE`\
    \ — anything returned by `document.createDocumentFragment()`\n\n*   `DOCUMENT_TYPE_NODE`\
    \ — `<!doctype html>`\n\nNot instance, we can write:\n\n```\ndocument.ELEMENT_NODE\n\
    ```\n\nto get the value for `ELEMENT_NODE` which is 1.\n\nThe `Node` object has\
    \ all the node constant values.\n\nFrom the `Node` object, we can see that `ELEMENT_NODE`\
    \ is 1.\n\n`TEXT_NODE` is 3, `ATTRIBUTE_NODE` is 2, `DOCUMENT_NODE` is 9, `DOCUMENT_FRAGMENT_NODE`\
    \ is 11, and `DOCUMENT_TYPE_NODE` is 10.\n\n## Sub-Node Objects\n\nThe `HTMLElement`\
    \ object inherits from the `Node` object via the `Element` object.\n\nOther things\
    \ like `Attr`, `Text`, `HTMLDocument`, and `DocumentFragment` all insert from\
    \ `Node`.\n\nFor instance, we can write:\n\n```\nconst body = document.querySelector('body');\n\
    ```\n\nAnd we can loop through the keys as follows:\n\n```\nfor (const key in\
    \ body) {\n  console.log(key);\n}\n```\n\nWe should see the node properties in\
    \ addition to the `HTMLElement` properties.\n\n## Properties and Methods for Nodes\n\
    \nEach node has the following properties:\n\n*   `childNodes`\n\n*   `firstChild`\n\
    \n*   `lastChild`\n\n*   `nextSibling`\n\n*   `nodeName`\n\n*   `nodeType`\n\n\
    *   `nodeValue`\n\n*   `parentNode`\n\n*   `previousSibling`\n\nThey allow us\
    \ to traverse between different nodes.\n\n`childNodes` has the child nodes.\n\n\
    `firstChild` has the first child.\n\n`lastChild` has the last child.\n\n`nextSibling`\
    \ has the next sibling node.\n\n`nodeName` has the name of the node.\n\n`nodeType`\
    \ has the type of the node.\n\n`parentNode` has the parent of the current node.\n\
    \n`previousSibling` has the previous sibling of the current node.\n\nMethods include:\n\
    \n*   `appendChild()`\n\n*   `cloneNode()`\n\n*   `compareDocumentPosition()`\n\
    \n*   `contains()`\n\n*   `hasChildNodes()`\n\n*   `insertBefore()`\n\n*   `isEqualNode()`\n\
    \n*   `removeChild()`\n\n*   `replaceChild()`\n\n`appendChild` adds a new child.\n\
    \n`cloneNode` clones the current node and returns it.\n\n`compareDocumentPosition`\
    \ compares the position of each node.\n\n`contains` check if the node has another\
    \ node as a child.\n\n`insertBefore` adds a node before the current node.\n\n\
    `isEqualNode` checks if it's the same.\n\n`removeChild` removes a given child\
    \ node.\n\n`replaceChild` replaces one child element with another.\n\nDocument\
    \ methods include:\n\n*   `document.createElement()`\n\n*   `document.createTextNode()`\n"
