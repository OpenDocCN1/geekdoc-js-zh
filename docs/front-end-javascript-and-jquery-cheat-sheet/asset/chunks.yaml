  trans: "\n触发处理程序\n\n</div>\n\n```\n$(\"#target\").click(function() {\n  alert(\"\
    Handler for .click() called.\");\n});\n```\n\n现在，当我们点击它时，会看到弹出警告框。\n\n此外，我们也可以通过编程方式触发\
    \ `click` 事件，代码如下：\n\n```\n$(\"#target\").click(function() {\n  alert(\"Handler\
    \ for .click() called.\");\n});\n$(\"#other\").click(function() {\n  $(\"#target\"\
    ).click();\n});\n```\n\n当我们点击 ID 为 `other` 的 div 时，会触发 ID 为 `target` 的 div 上的\
    \ `click` 事件。\n\n## .clone()\n\n`.clone()` 方法会创建匹配元素集合的深拷贝。\n\n例如，如果我们有以下 HTML：\n\
    \n```\n<div class=\"container\">\n  <div class=\"hello\">Hello</div>\n  <div class=\"\
    goodbye\">Goodbye</div>\n</div>\n```\n\n那么我们可以通过以下代码获取 class 为 `hello` 的 div，复制它，并将其追加到\
    \ class 为 `goodbye` 的 div 中：\n\n```\n$(\".hello\").clone().appendTo(\".goodbye\"\
    );\n```\n\n## .closest()\n\n`.closest()` 方法用于获取与给定选择器匹配的最近元素。\n\n例如，如果我们有以下 HTML：\n\
    \n```\n<ul id=\"one\" class=\"level-1\">\n  <li class=\"item-i\">I</li>\n  <li\
    \ id=\"ii\" class=\"item-ii\">II\n    <ul class=\"level-2\">\n      <li class=\"\
    item-a\">A</li>\n      <li class=\"item-b\">B\n        <ul class=\"level-3\">\n\
    \          <li class=\"item-1\">1</li>\n          <li class=\"item-2\">2</li>\n\
    \          <li class=\"item-3\">3</li>\n        </ul>\n      </li>\n      <li\
    \ class=\"item-c\">C</li>\n    </ul>\n  </li>\n  <li class=\"item-iii\">III</li>\n\
    </ul>\n```\n\n我们可以通过以下代码获取与 class 为 `item-a` 的元素最近的 `ul`：\n\n```\n$(\"li.item-a\"\
    )\n  .closest(\"ul\")\n  .css(\"background-color\", \"red\");\n```\n\n这样会同时获取\
    \ class 为 `level-2` 和 `level-3` 的 `ul`，并为它们添加红色背景。\n\n## :contains() 选择器\n\n我们可以使用\
    \ `:contains` 选择器来匹配包含指定文本的元素。\n\n例如，如果我们有以下内容：\n\n```\n<div>John Smith</div>\n\
    <div>George Martin</div>\n<div>Malcom John Sinclair</div>\n<div>J. Ohn</div>\n\
    ```\n\n那么我们可以通过以下代码获取所有包含文本 `'John'` 的 div，并为其应用样式：\n\n```\n$(\"div:contains('John')\"\
    ).css(\"text-decoration\", \"underline\");\n```\n\n这样会给所有包含文本 `'John'` 的 div 添加下划线。\n\
    \n因此，第一个和第三个 div 会带有下划线。\n\n## .contents()\n\n`.contents()` 方法会返回元素的内容。\n\n例如，如果我们有以下内容：\n\
    \n```\n<div class=\"container\">\n  Lorem ipsum dolor sit amet, consectetur adipisicing\
    \ elit, sed\n  do eiusmod tempor incididunt ut labore et dolore magna aliqua.\n\
    \  <br><br>\n  Ut enim ad minim veniam, quis nostrud exercitation ullamco\n  laboris\
    \ nisi ut aliquip ex ea commodo consequat.\n  <br><br>\n  Duis aute irure dolor\
    \ in reprehenderit in voluptate velit\n  esse cillum dolore eu fugiat nulla pariatur.\n\
    </div>\n```\n\n那么我们可以通过以下代码获取文本节点：\n\n```\nconst els = $(\".container\")\n  .contents()\n\
    \  .filter(function() {\n    return this.nodeType === 3;\n  })\nconsole.log(els);\n\
    ```\n\n`nodeType` 值为 3 的节点即为文本节点。\n\n## .contextmenu()\n\n我们可以使用 `.contextmenu()`\
    \ 方法绑定 `contextmenu` 事件。\n\n例如，如果我们有以下 HTML：\n\n```\n<div id=\"target\">\n  Right-click\
    \ here\n</div>\n```\n\n那么我们可以通过以下代码监听右键点击：\n\n```\n$(\"#target\").contextmenu(function()\
    \ {\n  alert(\"Handler for .contextmenu() called.\");\n});\n```\n\n当我们右键点击该 div\
    \ 时，会看到弹出警告框。\n\n## .css()\n\n我们也可以使用 `css` 方法获取计算样式的值，该方法还能为选中的元素设置样式。\n\n例如，如果我们有以下\
    \ HTML：\n\n```\n<div style=\"background-color:blue;\"></div>\n<div style=\"background-color:rgb(15,99,30);\"\
    ></div>\n<div style=\"background-color:#123456;\"></div>\n<div style=\"background-color:#f11;\"\
    ></div>\n```\n\n以及以下 CSS：\n\n```\ndiv {\n   width: 60px;\n   height: 60px;\n \
    \  margin: 5px;\n   float: left;\n}\n```\n\n那么我们可以通过以下代码监听点击事件，并在点击 div 时获取样式：\n\
    \n```\n$(\"div\").click(function() {\n  const color = $(this).css(\"background-color\"\
    );\n  console.log(color)\n});\n```\n\n这样就能获取 `background-color` 属性的值。\n\n此外，我们还可以通过以下代码获取多个样式：\n\
    \n```\n$(\"div\").click(function() {\n  const styles = $(this).css([\n    \"width\"\
    , \"height\", \"color\", \"background-color\"\n  ]);\n  console.log(styles)\n\
    });\n```\n\n只需传入一个包含属性名的数组即可。\n\n## .data()\n\n我们可以使用 `data` 方法在匹配的元素中存储数据。\n\n\
    例如，我们可以编写以下 HTML：\n\n```\n<span></span>\n```\n\n然后使用 `data` 存储和获取数据，如下所示：\n\n\
    ```\n$(\"body\").data(\"foo\", 52);\n$(\"span\").first().text($(\"body\").data(\"\
    foo\"));\n```\n\n第一行中，我们以键 `'foo'` 和值 52 存储了 `data`。\n\n然后在第二行中，我们获取该数据并将其放入 `span`\
    \ 中。\n\n## .dblclick()\n\n`.dblclick()` 方法用于绑定 `dblclick` 事件的处理程序，或触发元素上的该事件。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<div id=\"target\">\n  Double-click here\n</div>\n\
    <div id=\"other\">\n  Trigger the handler\n</div>\n```\n\n那么我们可以通过以下代码监听 ID 为\
    \ `target` 的 div 上的双击事件：\n\n```\n$(\"#target\").dblclick(function() {\n  alert(\"\
    Handler for .dblclick() called.\");\n});\n```\n\n我们还可以在点击 ID 为 `other` 的 div 时，触发\
    \ ID 为 `target` 的 div 上的双击事件，代码如下：\n\n```\n$(\"#target\").dblclick(function()\
    \ {\n  alert(\"Handler for .dblclick() called.\");\n});\n$(\"#other\").click(function()\
    \ {\n  $(\"#target\").dblclick();\n});\n```\n\n## deferred.always()\n\n`deferred.always()`\
    \ 用于添加一个回调，该回调在 deferred 对象被解决或拒绝时都会被调用。\n\n例如，我们可以编写：\n\n```\n[](#cb446-1)$.get(\"\
    foo.php\").always(function() {\n[](#cb446-2)  alert(\"$.get completed\");\n[](#cb446-3)});\n\
    ```\n\n这样，当我们向 `foo.php` 发起 GET 请求时，就会调用 `alert`。\n\n## deferred.catch()\n\n`deferred.catch`\
    \ 方法用于添加一个回调，该回调在 deferred 对象被拒绝时被调用。\n\n例如，我们可以编写：\n\n```\n[](#cb447-1)$.get(\"\
    foo.php\")\n[](#cb447-2)  .then(function() {\n[](#cb447-3)    alert(\"$.get succeeded\"\
    );\n[](#cb447-4)  })\n[](#cb447-5)  .catch(function() {\n[](#cb447-6)    alert(\"\
    $.get failed!\");\n[](#cb447-7)  });\n```\n\n或者：\n\n```\n(async () => {\n  try\
    \ {\n    const res = await $.get(\"foo.php\")\n  } catch (error) {\n    alert(\"\
    $.get failed!\");\n  }\n})()\n```\n\n`$.get` 返回一个 thenable 对象，因此它可以与 `async` 和\
    \ `await` 一起使用。\n\n## deferred.done()\n\n`deferred.done()` 方法允许我们添加一个回调，该回调在 deferred\
    \ 对象被解决时被调用。\n\n例如，我们可以编写：\n\n```\n$.get(\"https://jsonplaceholder.typicode.com/todos/1\"\
    )\n  .done(function() {\n    alert(\"$.get succeeded\");\n  });\n```\n\n这样会向 [`jsonplaceholder.typicode.com/todos/1`](https://jsonplaceholder.typicode.com/todos/1)\
    \ 发起 GET 请求，并在之后执行某些操作。\n\n## deferred.fail()\n\n`deferred.fail()` 方法允许我们添加一个回调，该回调在\
    \ deferred 对象被拒绝时被调用。\n\n例如，我们可以编写：\n\n```\n[](#cb450-1)$.get(\"test.php\")\n\
    [](#cb450-2)  .done(function() {\n[](#cb450-3)    alert(\"$.get succeeded\");\n\
    [](#cb450-4)  })\n[](#cb450-5)  .fail(function() {\n[](#cb450-6)    alert(\"$.get\
    \ failed!\");\n[](#cb450-7)  });\n```\n\n来添加该回调。\n\n## deferred.pipe()\n\n我们可以使用\
    \ `deferred.pipe()` 方法来过滤和链式处理 deferred 对象。\n\n它会返回另一个 deferred 对象。\n\n我们可以这样使用它：\n\
    \n```\nconst defer = $.Deferred(),\n  filtered = defer.pipe(function(value) {\n\
    \    return value * 2;\n  });\ndefer.resolve(5);\nfiltered.done(function(value)\
    \ {\n  alert(value);\n});\n```\n\n"
- fmt: "\nWe call `defer.pipe` with a callback that takes the resolved value from\
    \ the `defer` object, multipole by it by 2, and return it in the callback.\n\n\
    Then we call `defer.resolve(5)` to pass 5 as the value of `value` in the `pipe`\
    \ callback.\n\nAnd we get the final`value` in the `done` callback, which is 10.\n\
    \nWe can chain deferred by writing:\n\n```\nconst url = 'https://jsonplaceholder.typicode.com/posts/1';\n\
    \nconst url2 = 'https://jsonplaceholder.typicode.com/posts/2';\n\nconst request\
    \ = $.ajax(url, {\n\n    dataType: \"json\"\n\n  })\n\n  .pipe(function(data)\
    \ {\n\n    console.log(data)\n\n    return $.ajax(url2);\n\n  })\n\n  .done(function(data)\
    \ {\n\n    console.log(data)\n\n  });\n```\n\nWe call `pipe` on the first deferred\
    \ object returned by `$.ajax` and then call `done` to get the data from the 2nd\
    \ `$.ajax` call.\n\n## `:eq()` Selector\n\nThe `:eq` selector lets us select an\
    \ element at the given index within the matched set.\n\nFor example, if we have:\n\
    \n```\n<ul>\n  <li>item 1</li>\n  <li>item 2</li>\n  <li>item 3</li>\n  <li>item\
    \ 4</li>\n  <li>item 5</li>\n</ul>\n```\n\nThen we can write:\n\n```\n$(\"li:eq(2)\"\
    ).css(\"background-color\", \"red\");\n```\n\nto get the 3rd `li` and add a red\
    \ background to it.\n\n## `.even()`\n\nWe can get the elements that are the ones\
    \ with an even number index in the matched set with the `even` method.\n\nFor\
    \ example, if we have:\n\n```\n<ul>\n  <li>item 1</li>\n  <li>item 2</li>\n  <li>item\
    \ 3</li>\n  <li>item 4</li>\n  <li>item 5</li>\n</ul>\n```\n\nThen we call it\
    \ by writing:\n\n```\n$(\"li\").even().css(\"background-color\", \"red\");\n```\n\
    \nto add a red background to the `li` elements with an even index.\n\n## `event.currentTarget`\n\
    \nWe can use the `event.currentTarget` property to get the current DOM element\
    \ within the event bubbling phase.\n\nFor example, if we have:\n\n```\n<p>\n \
    \ click me\n</p>\n```\n\nWe can get the `p` element that we clicked on by writing:\n\
    \n```\n$(\"p\").click(function(event) {\n  alert(event.currentTarget === this);\n\
    });\n```\n\nThe `alert` should be `true` since `this` is the `p` element that\
    \ we clicked on, which is the same as `event.currentTarget`.\n\n## `event.data`\n\
    \nThe `event.data` is a property with the data that as pass into an event.\n\n\
    For example, if we have the following HTML:\n\n```\n<button> 0 </button>\n<button>\
    \ 1 </button>\n<button> 2 </button>\n<button> 3 </button>\n<button> 4 </button>\n\
    ```\n\nThen we can add click listeners to each element and get the data by writing:\n\
    \n```\nfor (let i = 0; i < 5; i++) {\n  $(\"button\").eq(i).on(\"click\", {\n\
    \    value: i\n  }, function(event) {\n    console.log('value: ', event.data.value)\n\
    \  });\n}\n```\n\nWe get the `event.data.value` property’s value in the click\
    \ callback.\n\nThis should be the same value as the `value` property we pass in\
    \ as the 2nd argument.\n\n## `event.delegateTarget`\n\nThe `event.delegateTarget`\
    \ property has the element where the currently called jQuery event handler was\
    \ attached.\n\nFor example, if we have:\n\n```\n<div class='box'>\n  <button>\n\
    \    0\n  </button>\n</div>\n<div class='box'>\n  <button>\n    1\n  </button>\n\
    </div>\n<div class='box'>\n  <button>\n    2\n  </button>\n</div>\n```\n\nThen\
    \ we can set the div with the class `box` to have a red background when we click\
    \ on the button inside by writing:\n\n```\n$(\".box\").on(\"click\", \"button\"\
    , function(event) {\n  $(event.delegateTarget).css(\"background-color\", \"red\"\
    );\n});\n```\n\n## `event.isDefaultPrevented()`\n\nWe can call `event.isDefaultPrevented()`\
    \ to check whether `event.preventDefault()` is called on an object.\n\nFor example,\
    \ if we have:\n\n```\n<a>hello</a>\n```\n\nThen we can call this method by writing:\n\
    \n```\n$(\"a\").click(function(event) {\n  alert(event.isDefaultPrevented());\n\
    \  event.preventDefault();\n  alert(event.isDefaultPrevented());\n});\n```\n\n\
    We call the method and show its return value in the alert box.\n\n## `event.isPropagationStopped()`\n\
    \nWe can call the `event.isPropagationStopped()` method to check if we called\
    \ `event.stopPropagation()`.\n\nFor example, if we have:\n\n```\n<button>click\
    \ me</button>\n```\n\nThen we can call this method by writing:\n\n```\n$(\"button\"\
    ).click(function(event) {\n  alert(event.isPropagationStopped());\n  event.stopPropagation();\n\
    \  alert(event.isPropagationStopped());\n});\n```\n\n## `event.metaKey`\n\nWe\
    \ can check whether the meta key is pressed when an event is fired with the `event.metaKey`\
    \ property.\n\nIn Windows, the meta key is the Windows key.\n\nIn macOS, the meta\
    \ key is the command key.\n\nFor example, if we have:\n\n```\n<button value=\"\
    Test\" name=\"Test\" id=\"checkMetaKey\">Click me!</button>\n```\n\nThen we can\
    \ check if the meta key is pressed when we click on the click me button by writing:\n\
    \n```\n$(\"#checkMetaKey\").click(function(event) {\n  console.log(event.metaKey);\n\
    });\n```\n\n## `event.namespace`\n\nWe can get the namespace of the event by using\
    \ the `event.namespace` property.\n\nFor example, if we have:\n\n```\n<button>display\
    \ event.namespace</button>\n<p>\n</p>\n```\n\nThen we can trigger an event with\
    \ a namespace by writing:\n\n```\n$(\"p\").on(\"test.something\", function(event)\
    \ {\n  alert(event.namespace);\n});\n\n$(\"button\").click(function(event) {\n\
    \  $(\"p\").trigger(\"test.something\");\n});\n```\n\nWe trigger the `test.something`\
    \ event on thr `p` element when we click on a button.\n\nThen `event.namespace`\
    \ should be `something` and that’s displayed in the alert.\n\n## `event.pageX`\
    \ and `event.pageY`\n\nWe can get the x and y-coordinates of the mouse position\
    \ relative to the left edge of the document with the `event.pageX` and `event.pageY`\
    \ properties respectively.\n\nFor example, we can log the mouse coordinate as\
    \ the mouse moves by writing HTML:\n\n```\n<div id=\"log\"></div>\n```\n\nand\
    \ JavaScript:\n\n```\n[](#cb472-1)$(document).on(\"mousemove\", function({\n[](#cb472-2)\
    \  pageX,\n[](#cb472-3)  pageY\n[](#cb472-4)}) {\n[](#cb472-5)  $(\"#log\").text(`${pageX},\
    \ ${pageY}`);\n[](#cb472-6)});\n```\n\nWe listen to the `mousemove` event and\
    \ get the `pageX` and `pageY` properties from the `event` object.\n\n## `event.preventDefault()`\n\
    \nWe call the `event.preventDefault()` method to prevent the default action from\
    \ being run in our event.\n\nFor example, if we have:\n\n```\n<a href='https://google.com'>hello</a>Then\n\
    ```\n\nThen we can prevent users from going to [https://google.com](https://google.com)\
    \ by writing:\n\n```\n$(\"a\").click(function(event) {\n  event.preventDefault();\n\
    });\n```\n\n## `event.relatedTarget`\n\nThe `event.relatedTarget` property gets\
    \ the other DOM elements involved in an event.\n\nFor example, if we have:\n\n\
    ```\n<div>\n  <a href='https://google.com'>hello</a>\n</div>\n```\n\nThen when\
    \ we move the mouse of of the `a` element, we can get the element that the mouse\
    \ moved to with this property:\n\n```\n$(\"a\").mouseout(function(event) {\n \
    \ alert(event.relatedTarget.nodeName);\n});\n```\n\nWe should see `DIV` in the\
    \ alert since the mouse moved to the div.\n\n## `event.result`\n\nThe `event.result`\
    \ property returns the last value returned by an event handler that’s triggered\
    \ by the event.\n\nFor example, if we have:\n\n```\n<button>display event.result</button>\n\
    ```\n\nThen we can return a value in a click listener function and get its value\
    \ with `event.result`:\n\n```\n$(\"button\").click(function(event) {\n  return\
    \ \"hello\";\n});\n\n$(\"button\").click(function(event) {\n  console.log(event.result);\n\
    });\n```\n\nWe return `'hello'` in the first click listener.\n\nThen we log `event.result`\
    \ in the 2nd click listener.\n\nIt should log `'hello'` since that’s the return\
    \ value of the first click listener.\n\n## `event.stopImmediatePropagation()`\n\
    \nWe can call the `event.stopImmediatePropagation()` method to stop event propagation.\n\
    \nFor example, if we have the following HTML:\n\n```\n<p>paragraph</p>\n<div>division</div>\n\
    ```\n\nand CSS:\n\n```\np {\n   height: 30px;\n   width: 150px;\n   background-color:\
    \ #ccf;\n}\n\ndiv {\n   height: 30px;\n   width: 150px;\n   background-color:\
    \ #cfc;\n}\n```\n\nThen we can call `stopImmediatePropagation` to stop the propagation\
    \ of the click event trigger on the `p` by writing:\n\n```\n$(\"p\").click(function(event)\
    \ {\n  event.stopImmediatePropagation();\n});\n\n$(\"p\").click(function(event)\
    \ {\n"
