    $(\"#term-2\").prevUntil(\"dt\")\n  .css(\"background-color\", \"red\");\n```\n\
    \n并将它们的背景色设置为红色。\n\n## `.promise()`\n\n`.promise()` 方法返回一个 Promise，用于观察绑定到集合的某种类型的所有操作何时完成。\n\
