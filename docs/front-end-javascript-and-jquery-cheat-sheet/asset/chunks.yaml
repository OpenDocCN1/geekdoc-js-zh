  trans: "\n\n```\nlet dayNames = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"\
    Fri\", \"Sat\"]\nlet now = new Date();\nlet day = now.getDay();\nlet dayName =\
    \ dayNames[day];\n```\n\n我们可以使用 `day` 作为 `dayNames` 的索引来获取星期几的英文版本。\n\n## 提取日期和时间的各个部分\n\
    \n`Date` 实例提供了多种方法来获取日期和时间的各个部分。\n\n`getMonth` 返回日期中的月份，范围从 0 到 11，其中 0 表示一月，11\
    \ 表示十二月。\n\n`getDate` 返回月份中的日期数字。\n\n`getFullYear` 返回四位数的年份。\n\n`getHours` 返回\
    \ 0 到 23 之间的数字，对应午夜和晚上 11 点。\n\n`getMinutes` 返回小时中的分钟数，范围从 0 到 59。\n\n`getSeconds`\
    \ 返回分钟中的秒数，范围从 0 到 59。\n\n而 `getMilliseconds` 返回 0 到 999 之间的数字。\n\n`getTime` 返回自\
    \ 1970 年 1 月 1 日午夜 UTC 以来经过的毫秒数。\n\n我们可以从日期实例中调用所有这些方法。例如，我们可以这样写：\n\n```\nlet\
    \ now = new Date();\nlet day = now.getMilliseconds();\n```\n\n## 指定日期和时间\n\n我们可以使用\
    \ `Date` 构造函数来指定日期和时间。\n\n要返回当前日期和时间，我们可以这样写：\n\n```\nlet today = new Date();\n\
    ```\n\n我们可以通过计算两个日期的时间戳差来得到天数差：\n\n```\nlet msToday = new Date().getTime();\n\
    let msAnotherDay = new Date(2029, 1, 1).getTime()\nlet msDiff = msAnotherDay -\
    \ msToday;\n```\n\n然后，要得到天数差，我们可以这样写：\n\n```\nlet daysDiff = msDiff / (1000 *\
    \ 60 * 60 * 24);\n```\n\n如果我们想将天数取整为整数，可以使用 `Math.floor` 向下取整：\n\n```\ndaysDiff\
    \ = Math.floor(daysDiff);\n```\n\n## 更改日期和时间\n\n`Date` 实例允许我们更改日期和时间的各个部分。\n\n\
    `setFullYear` 允许我们设置 `Date` 实例的年份。\n\n`setMonth` 允许我们设置 `Date` 实例的月份。它接受 0 到 11\
    \ 之间的数字，其中 0 表示一月，11 表示十二月。\n\n`setDate` 允许我们设置月份中的日期。\n\n`setHours` 允许我们设置小时后的分钟数。\n\
    \n`setSeconds` 允许我们设置分钟后的秒数。\n\n而 `setMilliseconds` 允许我们设置秒后的毫秒数。\n\n例如，我们可以通过以下方式调用\
    \ `setFullYear`：\n\n```\nlet d = new Date();\nd.setFullYear(2040);\n```\n\n或者：\n\
    \n```\nlet d = new Date();\nd.setMonth(11);\n```\n\n其余的方法可以以相同的方式调用。\n\n## 函数\n\
    \n函数是可以重复使用以完成我们想要的操作的代码块。\n\n我们之前调用过 `setFullYear`、`setMonth` 等函数。\n\n它们可以接受零个或多个参数。\n\
    \n例如，我们可以通过以下方式创建自己的 `tellTime` 函数：\n\n```\nfunction tellTime() {\n  let now =\
    \ new Date();\n  let jr = now.getHours();\n  let min = now.getMinutes();\n  alert(`${hr}:${min}`);\n\
    }\n```\n\n我们调用了 `getHours` 来获取小时，`getMinutes` 来获取分钟。\n\n## 向函数传递数据\n\n函数可以有参数，这样我们就可以向它们传递数据。\n\
    \n例如，我们可以这样写：\n\n```\nfunction greetUser(greeting) {\n  alert(greeting);\n}\n\
    ```\n\n`greetUser` 方法接受 `greeting` 参数，我们将该值用作 `alert` 函数的参数。\n\n这样，我们就可以指定警告框的消息。\n\
    \n我们可以通过以下方式调用函数：\n\n```\ngreetUser('hello james');\n```\n\n现在我们应该会看到一个显示“hello\
    \ james”文本的警告框。\n\n我们可以用逗号分隔多个参数和实参。例如，我们可以这样写：\n\n```\nfunction showMessage(greeting,\
    \ name) {\n  alert(`${greeting}, ${name}`);\n}\n```\n\n`showMessage` 函数有 `greeting`\
    \ 和 `name` 参数。\n\n然后我们可以通过以下方式调用 `showMessage`：\n\n```\nshowMessage('hello', 'mary');\n\
    ```\n\n有了参数，我们可以自定义函数的调用方式。\n\n## 在函数中返回数据\n\n如果我们想获取函数计算出的数据，可以在函数中添加 `return`\
    \ 语句来返回我们想要的数据。\n\n例如，我们可以这样写：\n\n```\nfunction getTotal(subtTotal, taxRate) {\n\
    \  return subTotal * (1 + taxRate);\n}\n```\n\n我们创建了 `getTotal` 函数，它接受 `subTotal`\
    \ 和 `taxRate` 参数。\n\n然后通过 `return` 语句返回计算结果。\n\n我们可以通过以下方式调用 `getTotal` 函数：\n\n\
    ```\nconst total = getTotal(100, 0.05);\n```\n\n我们为 `subTotal` 和 `taxRate` 传入数字，并将返回值赋给\
    \ `total`。\n\n因此，`total` 的值为 105。\n\n## do…while 循环\n\n我们可以使用 `do...while` 循环来重复执行代码。\n\
    \n`do` 块总是会执行，因此第一次迭代总是会运行。\n\n例如，我们可以这样写：\n\n```\nlet i = 0;\ndo {\n  console.log(i);\n\
    \  i++;\n} while (i <= 3);\n```\n\n`do` 块总是会执行，因为 `while` 条件是在循环迭代完成后才进行检查的。\n\
    \n## 脚本标签\n\n要在浏览器中运行 JavaScript 代码，我们需要在代码中添加脚本标签。\n\n例如，我们可以这样写：\n\n```\n<script>\n\
    \  function sayHi() {\n    alert(\"hi\");\n  }\n\n  function sayBye() {\n    alert(\"\
    bye\");\n  }\n</script>\n```\n\n我们在脚本标签中定义了 `sayHi` 和 `sayBye` 函数。\n\n我们可以在脚本标签中放置任何\
    \ JavaScript 代码。\n\nJavaScript 代码只是文本，因此我们可以轻松地将它们添加到 HTML 文件中，因为 HTML 文件也是文本。\n\
    \n如果脚本标签之间的代码很多，那么我们应该将它们移到单独的文件中。\n\n例如，我们可以这样写：\n\n```\n<script src=\"script.js\"\
    ></script>\n```\n\n我们创建一个 `script.js` 文件，然后通过 `src` 属性引用它。\n\n这样，我们就可以保持代码文件简短。\n\
    \n## 注释\n\n我们可以在 JavaScript 代码中添加注释来解释代码的作用。\n\n例如，我们可以这样写：\n\n```\n// 这是一个注释\n\
    for (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\n`//` 表示注释的开始。浏览器会忽略它。\n\
    \n我们可以通过以下方式编写多行注释：\n\n```\n/*\n  Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit. Maecenas at volutpat ipsum, dapibus tincidunt nisl. Donec vestibulum ultricies\
    \ laoreet. Suspendisse sit amet faucibus justo.\n*/\nfor (let i = 0; i < 10; i++)\
    \ {\n  console.log(i);\n}\n```\n\n我们有一个跨越多行的长注释。它由 `/*` 和 `*/` 分隔。\n\n## 链接事件\n\
    \n当我们点击链接时，可以监听链接在点击等操作时发出的事件。\n\n这对于在允许我们点击跳转到不同页面之外，还用于执行其他操作非常方便。\n\n例如，我们可以这样写：\n\
    \n```\n<a href=\"#\" onClick=\"alert('hello');\">点击</a>\n```\n\n我们在 `a` 标签中添加了\
    \ `onClick` 属性，以便在其中运行 JavaScript 代码。\n\n`onClick` 不区分大小写。\n\n`href='#'` 告诉浏览器重新加载页面，这在我们希望点击链接时运行\
    \ JavaScript 代码的情况下可能不是我们想要的。\n\n为了防止页面刷新，我们可以这样写：\n\n```\n<a href=\"javaScript:void(0)\"\
    \ onClick=\"alert('hello');\">点击</a>\n```\n\n我们添加了 `javaScript:void(0)` 代码来避免刷新。\n\
    \n如果我们想编写多条语句，可以这样写：\n\n```\n<a href=\"javaScript:void(0)\" onClick=\"let greeting='hi';\
    \ alert(greeting);\">点击</a>\n```\n\n我们用分号分隔语句。\n\n## 局部变量与全局变量\n\nJavaScript 有局部变量和全局变量。\n\
    \n局部变量只能在块内访问。\n\n而全局变量在整个应用程序中都可以使用。\n\n在 JavaScript 中，我们使用 `let` 和 `const` 关键字创建局部变量。\n\
    \n它们都是块级作用域，因此只能在函数、`if` 块等块内使用。\n\n`let` 创建变量，`const` 创建常量。\n\n常量在赋值后不能重新赋值。\n\
    \n但其内容可能仍然会改变。\n\n常量在创建时必须赋予初始值。\n\n例如，如果我们有：\n\n```\nfunction addNumbers() {\n\
    \  let theSum = 2 + 2;\n}\n```\n\n`theSum` 只能在 `addNumbers` 函数内使用。\n\n但如果我们有：\n\
    \n```\nfunction addNumbers() {\n  theSum = 2 + 2;\n}\n```\n\n"
- fmt: "\nthen `theSum` is a global variable.\n\nWe can access the value anywhere.\n\
    \nIf a variable is global, then it’s attached property of the `window` global\
    \ object.\n\nWe should avoid global variables since it’s easy to create global\
    \ variables with the same name.\n\nTherefore, it’s easy to have conflicts.\n\n\
    And it’s hard to track how variables are changed.\n\n## Switch Statements\n\n\
    The `switch` statement lets us do different things for different cases in one\
    \ statement.\n\nFor example, we can write:\n\n```\nswitch (dayOfWk) {\n  case\
    \ \"Sat\":\n    alert(\"very happy\");\n    break;\n  case \"Sun\":\n    alert(\"\
    happy\");\n    break;\n  case \"Fri\":\n    alert(\"happy friday\");\n    break;\n\
    \  default:\n    alert(\"sad\");\n}\n```\n\nWe check the value of `dayOfWk` to\
    \ let us do different things when it has the given values.\n\nIf `dayOfWk` is\
    \ `'Sat'`, then we show a `'very happy'` alert.\n\nIf `dayOfWk` is `'Sun'`, then\
    \ we show a `'happy'` alert.\n\nIf `dayOfWk` is `'Fri'`, then we show a `'happy\
    \ friday'` alert.\n\nThe `default` clause is run when `dayOfWk` has any other\
    \ value, and we show the `'sad'` alert.\n\nThe `break` keyword is required so\
    \ that the rest of the `switch` statement won’t run after a case is found.\n\n\
    The `switch` statement above is the same as:\n\n```\nif (dayOfWk === \"Sat\")\
    \ {\n  alert(\"very happy\");\n} else if (dayOfWk === \"Sun\") {\n  alert(\"happy\"\
    );\n} else if (dayOfWk === \"Fri\") {\n  alert(\"hapopy friday\");\n} else {\n\
    \  alert(\"sad\");\n}\n```\n\n`default` in the `switch` statement is the same\
    \ as the `else` in the `if` statement.\n\n## While Loops\n\nThe JavaScript `while`\
    \ loop is another kind of loop that we may use.\n\nIt lets us run a loop when\
    \ a given condition is `true`.\n\nFor example, we can write:\n\n```\nlet i = 0;\n\
    while (i <= 3) {\n  console.log(i);\n  i++;\n}\n```\n\nIn the loop above, when\
    \ `i` is less than or equal to 3, then we run the loop.\n\nInside the loop body,\
    \ we update `i` so that we work toward ending the loop.\n\nWe indent the loop\
    \ block with 2 spaces for easy typing and readability.\n\n## Button Events\n\n\
    We can add event handling code to buttons so that it can do something when we\
    \ click it.\n\nFor example, we can write:\n\n```\n<input type=\"button\" value=\"\
    Click Me\" onClick=\"alert('Hello world!');\">\n```\n\nWe have a button that has\
    \ the `onClick` attribute with JavaScript code to call `alert`.\n\nTherefore,\
    \ we’ll see an alert box displayed when we click it.\n\nThe `value` attribute\
    \ has the button text.\n\nWe can do the same for other elements.\n\nFor example,\
    \ we can write:\n\n```\n<a href=\"http://google.com\"><img onClick=\"alert('Hello\
    \ world!');\" src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    ></a>\n```\n\nWhen we click on the image, we see the alert box displayed.\n\n\
    If we want to make the code cleaner, we can put the `alert` call into its own\
    \ function.\n\nWe can write the following HTML:\n\n```\n<a href=\"http://google.com\"\
    ><img onClick=\"greet()\" src=\"https://i.picsum.photos/id/23/200/300.jpg?hmac=NFze_vylqSEkX21kuRKSe8pp6Em-4ETfOE-oyLVCvJo\"\
    ></a>\n```\n\nAnd the following JavaScript:\n\n```\nconst greet = () => {\n  alert('Hello\
    \ world!');\n}\n```\n\n## Mouse Events\n\nWe can listen to mouse events by using\
    \ attributes and set their values to JavaScript code.\n\nFor example, we can write:\n\
    \n```\n<h1 onMouseover=\"alert('hello world.');\">hello world</h1>\n```\n\nto\
    \ show an alert box when we hover over the h1 element.\n\nWe can also add the\
    \ `onMouseout` event handler to do something when we hover over the element and\
    \ then reverse it when we move the mouse away from it:\n\n```\n<h1 onMouseover=\"\
    this.style.color='green'\" onMouseout=\"this.style.color='black'\">hello world</h1>\n\
    ```\n\n`this` in the code above is the h1 element.\n\nWe set the `color` style\
    \ to `'green'` when we hover over the h1 element.\n\nThen when we move the mouse\
    \ away, then we set the `color` back to black.\n\n## Input Events\n\nLikewise,\
    \ we can listen to events emitted by the input element.\n\nFor example, we can\
    \ write:\n\n```\n<input type=\"text\" size=\"30\" onFocus=\"this.style.backgroundColor\
    \ = 'yellow';\" onBlur=\"this.style.backgroundColor = 'white';\">\n```\n\nWe added\
    \ the `onFocus` and `onBlur` handlers to set the `backgroundColor` style to `'yellow'`\
    \ when we focus on the input element.\n\nThen when we move the cursor away from\
    \ the input, it goes back to a white background.\n\n## Reading Field Values\n\n\
    We can read the value entered into the input field when we submit the form.\n\n\
    We can write the following HTML:\n\n```\n<form onSubmit=\"checkAddress('email');\
    \ return false;\">\n  Email:\n  <input type=\"text\" id=\"email\">\n  <input type=\"\
    submit\" value=\"Submit\">\n</form>\n```\n\nAnd the following JavaScript to check\
    \ the email field:\n\n```\nconst checkAddress = (fieldId) => {\n  if (document.getElementById(fieldId).value\
    \ === \"\") {\n    alert(\"Email is required.\");\n  }\n  return false;\n}\n```\n\
    \nThe `checkAddress` function gets the value of the input with ID `email`.\n\n\
    Then if it’s empty, we see the `'Email is required'` message in the alert.\n\n\
    We need the `return false` in the `onSubmit` attribute and the `checkAddress`\
    \ function to prevent the default submit behavior.\n\nWe can clean up the function\
    \ by writing:\n\n```\nconst checkAddress = (fieldId) => {\n  const {\n    value\n\
    \  } = document.getElementById(fieldId)\n  if (value === \"\") {\n    alert(\"\
    Email is required.\");\n  }\n  return false;\n}\n```\n\n## Setting Field Values\n\
    \nWe can set input field values by using JavaScript.\n\nFor example, we can write\
    \ the following HTML:\n\n```\n<form>\n  fruit:<br>\n  <input type=\"text\" id=\"\
    fruit\" onBlur=\"fillColor();\"><br>\n  color:<br>\n  <input type=\"text\" id=\"\
    color\">\n</form>\n```\n\nThen we can write the following JavaScript code:\n\n\
    ```\nconst fillColor = () => {\n  let color;\n  const {\n    value\n  } = document.getElementById(\"\
    fruit\");\n  switch (value) {\n    case \"apple\":\n      color = \"red\";\n \
    \     break;\n    case \"orange\":\n      color = \"orange\";\n      break;\n\
    \    case \"grape\":\n      color = \"purple\";\n  }\n  document.getElementById(\"\
    color\").value = color;\n}\n```\n\nWe added the `onBlur` attribute to the first\
    \ input box.\n\nSo when we move the cursor away from the first input, the `fillColor`\
    \ function is called.\n\nThem we get the value if the input with ID `fruit`’s\
    \ value with the `value` property.\n\nThen we set the `color` variable’s value\
    \ with according to the value of `value`.\n\nWe then set the input with ID `color`’s\
    \ value with the value of the `color` variable.\n\n## Reading and Setting Paragraph\
    \ Text\n\nWe can read and set paragraph text.\n\nFor example, we can write the\
    \ following HTML:\n\n```\n<p id=\"text\">\n  Lorem ipsum dolor sit amet.\n  <a\
    \ href=\"javascript:void(0);\" onClick=\"expandText();\">\n    <em>Click for more.</em>\n\
    \  </a>\n</p>\n```\n\nThen we can add the `expandText` function as follows:\n\n\
    ```\nconst expandText = () => {\n  const expandedParagraph = `Lorem ipsum dolor\
    \ sit amet, consectetur adipiscing elit. Cras id lorem eget erat vestibulum consectetur.\
    \ Donec vehicula porta est ut vestibulum. Mauris et nisl a sem iaculis laoreet.\
    \ Nunc eleifend facilisis massa ut luctus. Nullam sollicitudin non lorem non eleifend.\
    \ Curabitur elementum felis quis enim malesuada varius.`;\n  document.getElementById(\"\
    text\").innerHTML = expandedParagraph;\n}\n```\n\nThe `a` element has the `onClick`\
    \ attribute that is set to the `expandText()` expression.\n\nSo when we click\
    \ on the ‘Click for more’ text, we’ll see the expanded text displayed on the screen.\n\
    \nThis is because we set the `expandedParagraph` variable’s value as the value\
    \ of the `innerHTML` property of the element with ID `text`.\n\nWe can insert\
    \ anything into an element by setting the `innerHTML` property.\n\nFor example,\
    \ we can keep the existing HTML and change the JavaScript to:\n\n```\nconst expandText\
    \ = () => {\n  const expandedParagraph = `\n    <ol>\n      <li>Slow</li>\n  \
    \    <li>Fast</li>\n      <li>Just-right</li>\n     </ol>\n   `;\n  document.getElementById(\"\
    text\").innerHTML = expandedParagraph;\n}\n```\n\nWe set the content of the element\
    \ with ID `text` to an ordered list.\n\nSo that’s what we’ll see when we click\
    \ on Click for more.\n\n## Manipulating Images and Text\n\nWe can manipulate images\
    \ with JavaScript.\n"
