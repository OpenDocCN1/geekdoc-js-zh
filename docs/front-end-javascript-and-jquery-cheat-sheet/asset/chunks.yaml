    \n});\n```\n\n在回调中，我们将当前点击元素的文本内容设置为 `id` 属性的值。\n\n## `:has()` 选择器\n\n`:has` 选择器允许我们获取所有包含至少一个匹配指定选择器的元素的元素。\n\
    \n例如，如果我们有以下 HTML：\n\n```\n<div>\n  <p>paragraph</p>\n</div>\n<div>Hello again!\
    \ (with no paragraph)</div>\n```\n\n以及以下 CSS：\n\n```\n.test {\n  border: 3px inset\
    \ red;\n}\n```\n\n那么我们可以通过以下代码为包含 `p` 元素的 div 添加边框：\n\n```\n$(\"div:has(p)\").addClass(\"\
    test\");\n```\n\n## `.hasClass()`\n\n`.hasClass()` 方法用于判断任何匹配的元素是否被赋予了指定的类。\n\n\
    例如，如果我们有以下内容：\n\n```\n<div id=\"mydiv\" class=\"foo bar\"></div>\n```\n\n那么我们可以通过以下代码检查\
    \ ID 为 `mydiv` 的 div 是否添加了 `foo` 类：\n\n```\n$(\"#mydiv\").hasClass(\"foo\")\n\
    ```\n\n## `:header` 选择器\n\n`:header` 选择器用于选取所有标题元素（例如 `h1`、`h2` 等）。\n\n例如，如果我们有以下内容：\n\
    \n```\n<h1>Header 1</h1>\n<p>Contents 1</p>\n<h2>Header 2</h2>\n<p>Contents 2</p>\n\
    ```\n\n那么我们可以编写：\n\n```\n$(\":header\").css({\n  background: \"gray\",\n  color:\
    \ \"blue\"\n});\n```\n\n为 `h1` 和 `h2` 元素添加灰色背景并将文字颜色设为蓝色。\n\n## `.height()`\n\n\
    `.height()` 方法获取匹配元素集合中第一个元素的当前计算高度。\n\n它也可以设置每个匹配元素的高度。\n\n例如，我们可以通过以下代码获取 `window`\
    \ 的高度：\n\n```\nconsole.log($(window).height())\n```\n\n如果我们有一个 div：\n\n```\n<div></div>\n\
    ```\n\n以及以下 CSS：\n\n```\ndiv {\n  width: 50px;\n  height: 70px;\n  float: left;\n\
    \  margin: 5px;\n  background: red;\n  cursor: pointer;\n}\n```\n\n我们可以通过以下代码在点击时设置其高度：\n\
    \n```\n$(\"div\").one(\"click\", function() {\n  $(this).height(30).css({\n  \
    \  cursor: \"auto\",\n    backgroundColor: \"green\"\n  });\n});\n```\n\n高度以像素为单位。\n\
    \n## `:hidden` 选择器\n\n我们可以使用 `:hidden` 选择器选取所有隐藏的元素。\n\n例如，如果我们有以下内容：\n\n```\n\
    <div></div>\n<div style=\"display:none;\">Hidden</div>\n<div></div>\n<div class=\"\
    starthidden\">Hidden</div>\n<div></div>\n<form>\n  <input type=\"hidden\">\n \
    \ <input type=\"hidden\">\n  <input type=\"hidden\">\n</form>\n```\n\n以及以下 CSS：\n\
    \n```\n.starthidden {\n  display: none;\n}\n```\n\n那么我们可以通过以下代码获取所有非 `script`\
    \ 元素的隐藏元素：\n\n```\nconst hiddenElements = $(\"body\").find(\":hidden\").not(\"\
    script\");\nconsole.log(hiddenElements)\n```\n\n我们也可以通过以下代码显示隐藏的 div：\n\n```\n\
    $(\"div:hidden\").show(3000);\n```\n\n## `.hide()`\n\n`.hide()` 方法用于隐藏匹配的元素。\n\
    \n例如，如果我们有以下内容：\n\n```\n<div id=\"clickme\">\n  Click here\n</div>\n<img id=\"\
    book\" src=\"https://i.picsum.photos/id/23/200/200.jpg?hmac=IMR2f77CBqpauCb5W6kGzhwbKatX_r9IvgWj6n7FQ7c\"\
    \ alt=\"\">\n```\n\n那么我们可以通过以下代码在点击“Click here”时隐藏图片：\n\n```\n$(\"#clickme\").click(function()\
    \ {\n  $(\"#book\").hide(\"slow\", function() {\n    alert(\"Animation complete.\"\
    );\n  });\n});\n```\n\n`hide` 的第一个参数是动画类型。\n\n第二个参数是动画完成时调用的回调函数。\n\n## `.hover()`\n\
    \n`hover` 方法允许我们绑定鼠标悬停和移出元素的事件处理程序。\n\n例如，如果我们有以下内容：\n\n```\n<ul>\n  <li>Milk</li>\n\
    \  <li>Bread</li>\n  <li class=\"fade\">Chips</li>\n  <li class=\"fade\">Socks</li>\n\
    </ul>\n```\n\n那么我们可以通过以下代码在鼠标悬停时向 `li` 文本添加 `***`：\n\n```\n$(\"li\").hover(\n\
    \  function() {\n    $(this).append($(\"<span> ***</span>\"));\n  },\n  function()\
    \ {\n    $(this).find(\"span\").last().remove();\n  }\n);\n$(\"li.fade\").hover(function()\
    \ {\n  $(this).fadeOut(100);\n  $(this).fadeIn(500);\n});\n```\n\n当鼠标移出时，`***`\
    \ 会消失。\n\n## `.html()`\n\n`.html()` 方法获取匹配元素集合中第一个元素的 HTML 内容。\n\n它也可以用于设置每个匹配元素的\
    \ HTML。\n\n例如，如果我们有以下内容：\n\n```\n<p>\n  <b>Click</b> to change the <span id=\"\
    tag\">html</span>\n</p>\n```\n\n那么我们可以通过以下代码点击 `p` 元素将其文本更改为原始 HTML 形式：\n\n```\n\
    $(\"p\").click(function() {\n  const htmlString = $(this).html();\n  $(this).text(htmlString);\n\
    });\n```\n\n我们在第一行调用 `html` 获取 HTML 代码，然后将其设置为 `text` 值。\n\n当设置为文本内容时，它会被转义，因此我们会看到原始代码显示出来。\n\
    \n## ID 选择器（`#id`）\n\n我们可以使用 ID 选择器选取单个元素。\n\n例如，如果我们有以下内容：\n\n```\n<div id=\"\
    myDiv\">id=\"myDiv\"</div>\n```\n\n那么我们可以通过以下代码为 div 添加红色边框：\n\n```\n$(\"#myDiv\"\
    ).css(\"border\", \"3px solid red\");\n```\n\n## `jQuery.globalEval()`\n\n我们可以使用\
    \ `jQuery.globalEval()` 方法在全局范围内执行一些 JavaScript 代码。\n\n例如，我们可以编写：\n\n```\njQuery.globalEval(\"\
    let newVar = true;\");\n```\n\n来执行一些代码。\n\n## `jQuery.grep()`\n\n`jQuery.grep()`\
    \ 方法用于查找数组中满足过滤函数的元素。\n\n例如，我们可以编写：\n\n```\nconst arr = [1, 9, 3, 8, 6, 1, 5,\
    \ 9, 4, 7, 3, 8, 6, 9, 1];\nconst filteredArr = jQuery.grep(arr, function(n, i)\
    \ {\n  return (n !== 5 && i > 4);\n});\nconsole.log(filteredArr)\n```\n\n然后我们返回一个数组，其中包含满足传入\
    \ `grep` 的回调中条件的元素。\n\n`n` 是数组条目，`i` 是其索引。\n\n## `jQuery.hasData()`\n\n`jQuery.hasData()`\
    \ 方法允许我们检查是否有数据保存到元素中。\n\n例如，如果我们有以下内容：\n\n```\n<p> </p>\n```\n\n那么我们可以通过以下代码使用它：\n\
    \n```\nconst p = jQuery(\"p\")[0];\nconsole.log(jQuery.hasData(p));\n$.data(p,\
    \ \"testing\", 123);\nconsole.log(jQuery.hasData(p))\n```\n\n我们在 `p` 元素上调用 `hasData`\
    \ 来检查是否有任何数据保存到其中。\n\n因此，第一个控制台日志应输出 `false`，第二个应输出 `true`。\n\n## `jQuery.inArray()`\n\
    \n`jQuery.inArray()` 方法允许我们检查一个元素是否在数组中。\n\n如果找到，则返回其索引，否则返回 -1。\n\n例如，我们可以编写：\n\
    \n```\nconsole.log($.inArray(5 + 5, [\"8\", \"9\", \"10\", 10 + \"\"]));\n```\n\
    \n来检查 10 是否在数组中。\n\n由于它不在数组中，应返回 -1。\n\n## `jQuery.isEmptyObject()`\n\n我们可以使用\
    \ `jQuery.isEmptyObject()` 检查一个元素是否为空对象。\n\n例如，如果我们有以下内容：\n\n```\nconsole.log(jQuery.isEmptyObject({}));\n\
    ```\n\n由于我们向方法传递了一个空对象，这应输出 `true`。\n\n## `jQuery.isPlainObject()`\n\n`jQuery.isPlainObject()`\
    \ 方法允许我们检查一个 JavaScript 对象是否为普通对象。\n\n普通对象是对象字面量。\n\n例如，如果我们有以下内容：\n\n```\nconsole.log(jQuery.isPlainObject({}))\n\
    console.log(jQuery.isPlainObject(\"test\"))\n```\n\n那么第一个控制台日志输出 `true`，第二个输出\
    \ `false`。\n\n## `jQuery.isXMLDoc()`\n\n我们可以使用 `jQuery.isXMLDoc()` 方法检查一个文档对象是否为\
    \ XML 文档。\n\n例如，我们可以编写：\n\n```\nconsole.log(jQuery.isXMLDoc(document))\n```\n\n\
    那么控制台日志输出 `false`。\n\n## `jQuery.makeArray()`\n\n我们可以使用 `jQuery.makeArray()` 方法将元素列表转换为数组。\n\
    \n例如，如果我们有以下内容：\n\n```\n<div>First</div>\n<div>Second</div>\n<div>Third</div>\n\
    <div>Fourth</div>\n```\n\n那么我们可以编写：\n\n```\nconst elems = document.getElementsByTagName(\"\
    div\");\nconst arr = jQuery.makeArray(elems);\nconsole.log(arr)\n```\n\n我们使用 `getElementsByTagName`\
    \ 获取 div 元素。\n\n然后调用 `jQuery.makeArray` 将元素列表转换为数组。\n\n## `jQuery.map()`\n\n`jQuery.map()`\
    \ 方法将数组或对象中的所有项转换为一个新的项数组。\n\n例如，我们可以编写：\n\n```\nconst fakeArray = {\n  \"length\"\
    : 2,\n  0: \"foo\",\n  1: \"bar\"\n};\nconst realArray = $.makeArray(fakeArray)\n\
    ```\n\n"
