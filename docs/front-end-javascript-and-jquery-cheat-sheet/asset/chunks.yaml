  trans: "\n`createElement` 顾名思义会创建一个新元素，`createTextNode` 则创建一个可放入元素的文本节点。\n\nHTML\
    \ 元素属性包括：\n\n*   `innerHTML`\n*   `outerHTML`\n*   `textContent`\n*   `innerText`\n\
    *   `outerText`\n*   `firstElementChild`\n*   `lastElementChild`\n*   `nextElementChild`\n\
    *   `previousElementChild`\n*   `children`\n\n`innerHTML` 包含元素内部的 HTML 内容。\n\n\
    `outerHTML` 除了包含 `innerHTML` 的所有 HTML 内容外，还包含外层标签。\n\n`textContent` 包含元素内部的文本内容。\n\
    \n`innerText` 包含元素内部的文本内容。\n\n`outerText` 包含 `innerText` 的内容以及外层标签。\n\n`firstElementChild`\
    \ 是第一个为 HTML 元素的子节点。\n\n`lastElementChild` 是最后一个为 HTML 元素的子节点。\n\n`nextElementChild`\
    \ 是当前节点之后的下一个元素节点。\n\n`previousElementChild` 是当前节点之前的元素节点。\n\n`children` 是当前节点的子节点。\n\
    \nHTML 元素对象拥有 `insertAdjacentHTML` 方法，用于根据指定位置插入节点。\n\n## 识别节点的类型和名称\n\n我们可以通过\
    \ `nodeType` 属性识别类型，通过 `nodeName` 识别名称。\n\n例如，`document.nodeName` 返回 `'#document'`，`document.nodeType`\
    \ 返回 9，表示它是一个 `DOCUMENT_NODE`。\n\n## 获取节点的值\n\n对于大多数类型的节点，`nodeValue` 属性返回 `null`。\n\
    \n但我们可以用它从 `Text` 和 `Comment` 节点中提取文本。\n\n例如，如果我们有以下代码：\n\n```\n<a>hi</a>\n```\n\
    \n那么：\n\n```\nconsole.log(document.querySelector('a').firstChild.nodeValue);\n\
    ```\n\n会输出 `'hi'`。\n\n## DocumentFragment\n\n`DocumentFragment` 是一种节点类型，它提供了一个轻量级的文档\
    \ DOM，独立于活动 DOM 树之外。\n\n它是一个文档模板，行为类似于真实 DOM，但存在于内存中。\n\n它的子节点可以轻松地在内存中操作，并追加到活动\
    \ DOM 中。\n\n## 创建 DocumentFragment\n\n`createDocumentFragment` 方法允许我们创建文档片段。\n\
    \n例如，我们可以这样写：\n\n```\nconst frag = document.createDocumentFragment();for (const\
    \ s of ['foo', 'bar', 'baz']) {\n  const p = document.createElement(\"p\");\n\
    \  p.textContent = s;\n  frag.appendChild(p);\n}\n```\n\n我们使用 `createDocumentFragment`\
    \ 创建了一个文档片段。\n\n然后遍历字符串数组，创建 p 元素，并将它们作为子元素追加到片段中。\n\n创建文档片段的好处是我们可以将其存储在内存中。\n\
    \n它可以包含除 `body` 或 `html` 之外的任何类型的节点。\n\n当我们追加片段时，片段本身不会添加到 DOM 中。\n\n只有其中的节点会被添加。\n\
    \n当文档片段被追加到 DOM 时，它会从文档转移到被追加的位置。\n\n它会被从内存中移除。\n\n而元素则始终存在于内存中。\n\n## 将 DocumentFragment\
    \ 添加到 DOM\n\n我们可以将文档片段传递给另一个元素的 `appendChild` 和 `insertBefore` 方法。\n\n例如，我们可以通过以下代码将前面示例中的内容追加到\
    \ body：\n\n```\nconst frag = document.createDocumentFragment();for (const s of\
    \ ['foo', 'bar', 'baz']) {\n  const p = document.createElement(\"p\");\n  p.textContent\
    \ = s;\n  frag.appendChild(p);\n}document.body.appendChild(frag);\n```\n\n现在我们将创建的\
    \ p 元素添加到了 body 中。\n\n## 在 DocumentFragment 上使用 innerHTML\n\n我们可以使用 `innerHTML`\
    \ 通过字符串设置片段的内容。\n\n例如，我们可以这样创建一个文档片段：\n\n```\nconst frag = document.createDocumentFragment();const\
    \ div = document.createElement('div');\nfrag.appendChild(div);\nfrag.querySelector('div').innerHTML\
    \ = '<p>foo</p><p>bar</p>';document.body.appendChild(frag);\n```\n\n我们使用 `createFragment`\
    \ 创建了一个片段。然后创建一个 div 来容纳内容。\n\n接着用我们自己的 HTML 设置 div 的内容。\n\n最后，使用 `appendChild`\
    \ 将片段内容追加到 body。\n\n## 将包含节点的片段保留在内存中\n\n如果我们想保留片段的内容，可以克隆它。\n\n例如，如果我们有以下片段：\n\
    \n```\nconst frag = document.createDocumentFragment();for (const s of ['foo',\
    \ 'bar', 'baz']) {\n  const p = document.createElement(\"p\");\n  p.textContent\
    \ = s;\n  frag.appendChild(p);\n}\n```\n\n我们可以通过以下代码克隆它：\n\n```\ndocument.body.appendChild(frag.cloneNode(true));\n\
    ```\n\n这样我们在将文档片段内容追加到 body 的同时，保留了它。\n\n## CSS 样式表\n\n我们可以通过使用 link 标签向页面添加样式。\n\
    \n此外，我们还可以向文档添加 style 标签或 style 属性。\n\n每个添加到 HTML 文档的样式表都由 `CSSStyleSheet` 对象表示。\n\
    \n如果我们有一个 style 元素：\n\n```\n<style>\n  body {\n    background-color: green;\n\
    \  }\n</style>\n```\n\n我们可以通过 JavaScript 获取样式表，代码如下：\n\n```\nconsole.log(document.querySelector('style').sheet);\n\
    ```\n\n我们会得到一个包含样式表的对象。\n\n## 访问所有样式表\n\n我们可以使用 `styleSheets` 属性获取所有样式表。\n\n例如，如果我们有以下\
    \ CSS：\n\n```\n<!doctype html>\n<html lang=\"en\">\n  <head>\n    <link rel=\"\
    stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
    \ integrity=\"sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh\"\
    \ crossorigin=\"anonymous\">\n    <style>\n      body {\n        background-color:\
    \ #fff;\n      }\n    </style>\n  </head>\n  <body>\n  </body>\n</html>\n```\n\
    \n那么我们可以通过以下方式获取样式表：\n\n```\nconsole.log(document.styleSheets);\n```\n\n我们也可以像下面这样使用\
    \ link 元素的 `sheet` 属性：\n\n```\nconsole.log(document.querySelector('link').sheet);\n\
    ```\n\n## CSSStyleSheet 的属性和方法\n\n`CSSStyleSheet` 拥有属性和方法。\n\n它们包括：\n\n*   `disabled`\
    \ — 指示样式表是否被禁用\n*   `href` — `href` 属性的值\n*   `media` — 样式信息的目标媒体\n*   `ownerNode`\
    \ — 将样式表与文档关联的节点\n*   `parentStylesheet` — 父样式表\n*   `title` — `title` 属性的值\n\
    *   `type` — `type` 属性的值\n*   `cssRules` — 一个类数组对象，用于保存组成样式表的规则\n*   `ownerRule`\
    \ — 保存导入样式表的 import 规则\n*   `deleteRule` — 从样式表对象中移除规则的方法\n*   `insertRule` —\
    \ 向样式表插入规则的方法\n\n## 将 NodeList 或 HTMLCollection 转换为数组\n\n要将 `NodeList` 或 `HTMLCollection`\
    \ 转换为数组，我们可以使用展开运算符或 `Array.from` 方法。\n\n我们可以这样写：\n\n```\nconst arr = [...document.querySelectorAll('p')];\n\
    ```\n\n或者这样写：\n\n```\nconst arr = Array.from(document.querySelectorAll('p'));\n\
    ```\n\n现在我们可以对 `NodeList` 或 `HTMLCollection` 对象使用我们想要的数组方法，比如 `map`、`filter`、`pop`、`push`\
    \ 等。\n\n## 遍历 DOM 中的节点\n\n我们可以使用各种属性遍历 DOM 中的节点。\n\n这些属性包括：\n\n*   `parentNode`\n\
    *   `firstChild`\n*   `lastChild`\n*   `nextSibling`\n*   `previousSibling`\n\n\
    `parentNode` 包含当前节点的父节点。\n\n`firstChild` 包含当前节点的第一个子节点。\n\n`lastChild` 包含最后一个子节点。\n\
    \n`nextSibling` 包含当前节点之后紧邻的节点。\n\n`previousSibling` 包含当前节点之前紧邻的节点。\n\n要遍历 DOM\
    \ 但忽略文本和注释节点，我们可以使用以下属性：\n\n*   `firstElementChild`\n*   `lastElementChild`\n\
    *   `nextElementSibling`\n*   `previousElementSibling`\n*   `children`\n\n`firstElementChild`\
    \ 包含当前元素的第一个子元素。\n\n`lastElementChild` 包含当前元素的最后一个子元素。\n\n`nextElementChild` 包含当前元素之后紧邻的兄弟元素。\n\
    \n"
- fmt: "\n`previousElementSibling` has the sibling element immediately before the\
    \ current one.\n\n`children` has the children of the current element.\n\nFor instance,\
    \ we can use:\n\n```\ndocument.body.children\n```\n\nto get all the child nodes\
    \ of the body element.\n\n## Check the Node Position in the DOM Tree\n\nWe can\
    \ use the `contains` method to check if an element is inside another element.\n\
    \nFor instance, we can write:\n\n```\nconst isInside = document.querySelector('html').contains(document.querySelector('body'));\n\
    ```\n\nThen that should return `true` since `body` is always inside the `html`\
    \ element.\n\n`compareDocumentPosition` returns a number that indicates where\
    \ the position is of the elements we’re comparing relative to each other.\n\n\
    The return value 0 means that the elements are identical.\n\n1 means the nodes\
    \ aren’t in the same document.\n\n2 means that the node precedes the selected\
    \ node.\n\n3 means the node follows the selected node.\n\n8 means the passed node\
    \ is the ancestor of the selected node.\n\n16 or 10 in hex means the passed node\
    \ is a descendant of the selected node.\n\nIt’s possible for a node to have more\
    \ than one type of relationship with another node.\n\nIn that case, the numbers\
    \ will be added together and returned.\n\nGiven the following HTML:\n\n```\n<div\
    \ id='foo'>\n  <p>\n    foo\n  </p>\n  <p>\n    bar\n  </p>\n</div>\n```\n\nWe\
    \ can use it as follows:\n\n```\nconst div = document.querySelector('div')\nconst\
    \ p = document.querySelector('p')const result = div.compareDocumentPosition(p);\n\
    console.log(result);\n```\n\nWe get 20 since a node contains and precedes a node,\
    \ this means it’s 16 + 4 which is 20.\n\n## HTMLElement\n\n`HTMLElement` is a\
    \ constructor that’s used to create objects that represent nodes in a HTML document.\n\
    \nIt includes the following child constructors:\n\n*   `HTMLHtmlElement`\n\n*\
    \   `HTMLHeadElement`\n\n*   `HTMLLinkElement`\n\n*   `HTMLTitleElement`\n\n*\
    \   `HTMLMetaElement`\n\nand many more.\n\nThey represent various elements on\
    \ the page.\n\n## HTMLElement Object Properties and Methods\n\n`HTMLElement` instances\
    \ have many properties and methods to let us manipulate them.\n\nWe can use `createElement`\
    \ to create an element.\n\n`tagName` to get the tag name.\n\n`children` to get\
    \ the child elements.\n\n`getAttributes` to get the child attributes\n\n`setAttribute`\
    \ to set an attribute.\n\n`hasAttribute` to check if an element exists.\n\n`removeAttribute`\
    \ to remove an attribute.\n\n`classList` is an object used to manipulate the set\
    \ of classes.\n\n`dataset` returns any attribute that starts with `data-` .\n\n\
    `attributes` has the attribute list.\n\nThe full list is at [https://developer.mozilla.org/en-US/docs/Web/API/element](https://developer.mozilla.org/en-US/docs/Web/API/element).\n\
    \n## Creating Elements\n\nWe can create elements with the `createElement` method.\n\
    \nFor example, we can create an input by writing:\n\n```\nconst input = document.createElement('input');\n\
    document.body.appendChild(input);\n```\n\nThen we see an input element on the\
    \ screen.\n\n## Getting the Tag Name of an Element\n\nThe `tagName` property returns\
    \ the name of an element.\n\nIt returns the same value that `nodeName` would return.\n\
    \nThe tag name would be returned in upper case.\n\nFor instance, if we have:\n\
    \n```\n<a href=\"http://example.com\">hello</a>\n```\n\nThen:\n\n```\nconsole.log(document.querySelector('a').tagName);\n\
    ```\n\nlogs `'A'` .\n\n## Getting a List or Collection of element Attributes\n\
    \nThe `attributes` property returns a collection of attribute nodes that an element\
    \ currently has defined.\n\nIf we have:\n\n```\n<a href=\"http://example.com\"\
    \ title=\"example\" data-foo=\"dataFoo\" class=\"example\">hello</a>\n```\n\n\
    Then we can get all the nodes into an array by writing:\n\n```\nconst attrs =\
    \ [...document.querySelector('a').attributes];\n```\n\nWe convert the attributes\
    \ array-like object into an array using the spread operator.\n\nThe attributes\
    \ returned are live which means the content can be changed at any time.\n\nThe\
    \ actual object return by `attributes` is a `NameNodeMap` , which is an array-like\
    \ object.\n\nIt has a `length` property.\n\nBoolean attributes show up in the\
    \ `attributes` list but have no value.\n\n## Getting, Setting, & Removing an Element’s\
    \ Attribute Value\n\nWe can use the `getAttribute()` , `setAttribute()` , and\
    \ `removeAttribute()` methods to manipulate attributes.\n\nFor example, if we\
    \ have:\n\n```\n<a href=\"http://example.com\" title=\"example\" data-foo=\"dataFoo\"\
    \ class=\"example\">hello</a>\n```\n\nThen we can call:\n\n```\nconst a = document.querySelector('a');\n\
    a.removeAttribute('href');\n```\n\nto remove the `href` attribute.\n\nAnd we can\
    \ write:\n\n```\na.setAttribute('href', '#');\n```\n\nto set the `href` attribute.\n\
    \n## Verify an Element has Specific Attribute\n\nTo check if an element has a\
    \ specific attribute, we can use the `hasAttribute` method.\n\nFor instance, if\
    \ we have:\n\n```\n<a href='http://example.com' title=\"example\" data-foo='bar'\
    \ class=\"example\"></a>\n```\n\nThen we can check if it has a given attribute\
    \ by writing:\n\n```\nconst a = document.querySelector('a');\na.hasAttribute('title');\n\
    ```\n\nThe method will return `true` if the attribute exists whether if it has\
    \ a value or not.\n\n## Getting a List of Class Attribute Values\n\nWe can use\
    \ the `classList` property to get the values of the class attribute.\n\nFor instance,\
    \ if we have:\n\n```\n<div class=\"foo bar baz\"></div>\n```\n\nWe can get the\
    \ class names by writing:\n\n```\nconst div = document.querySelector('div');\n\
    console.log(div.classList);\n```\n\nThis will return each class’s name separately\
    \ in an array-like object\n\nThere’s also the `className` property to return them\
    \ all in one string:\n\n```\nconsole.log(div.className);\n```\n\n## Adding and\
    \ Removing Subvalues in the class Attribute\n\nThe `classList` object has an `add`\
    \ to add a class name to the class attribute.\n\nIt also has the `remove` method\
    \ to remove it.\n\nFor instance, if we have:\n\n```\n<div class=\"foo\"></div>​\n\
    ```\n\nThen we can write:\n\n```\nconst div = document.querySelector('div');\n\
    div.classList.add('bar');\n```\n\nto add `bar` with `foo` .\n\nand:\n\n```\ndiv.classList.remove('foo');\n\
    ```\n\nto remove `foo` and leave `bar` in the class attribute.\n\n## Toggle a\
    \ Class Attribute Value\n\n`classList` also has a `toggle` method to toggle a\
    \ class name.\n\nFor instance, if we have:\n\n```\n<div class=\"foo\"></div>​\n\
    ```\n\nThen we can write:\n\n```\nconst div = document.querySelector('div');\n\
    div.classList.toggle('foo');\n```\n\nto turn it off, and we can call `toggle`\
    \ again with the same class name to add it back.\n\n## Check if 2 Nodes are Identical\n\
    \nWe can check if 2 nodes are identical according to the DOM 3 specification.\
    \ According to the spec, for 2 nodes to be considered identical, the 2 nodes have\
    \ to be of the same type.\n\nThe `nodeName`, `localName`, `namespaceURI`, `prefix`\
    \ and `nodeValue` must have the same values.\n\nThe `NameNodeMaps` attribute must\
    \ be equal. The `children` NodeList must also be equal.\n\nNormalization may affect\
    \ what entries are in `children` so that should be done before comparing them.\n\
    \nThe `isEqualNode` method can do all the checks for us.\n\nFor instance, if we\
    \ have:\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n  <p>\n    bar\n  </p>\n\
    </div>\n```\n\nWe can write:\n\n```\nconst p = document.querySelectorAll('div\
    \ > p')\nconsole.log(p[0].isEqualNode(p[1]));\n```\n\nto check if both p elements\
    \ are the same.\n\nThey aren’t since they have different content, so it logs`false`\
    \ .\n\nIf we have:\n\n```\n<div id='foo'>\n  <p>\n    foo\n  </p>\n  <p>\n   \
    \ foo\n  </p>\n</div>\n```\n\nThen the same code logs `true` since the p elements\
    \ are the same.\n\n## Document Nodes\n\nThe `HTMLDocument` constructor inherits\
    \ from `document` and represents a specific document node.\n\n## Document Properties\
    \ and Methods\n\nProperties and methods of the `HTMLDocument` instance includes\
    \ the following:\n\n*   `doctype`\n\n*   `documentElement`\n\n*   `implementation`\n\
    \n*   `activeElement`\n\n*   `body`\n\n*   `head`\n\n*   `title`\n\n*   `lastModified`\n\
    \n*   `referrer`\n\n*   `URL`\n\n*   `defaultview`\n\n*   `compatMode`\n\n*  \
    \ `ownerDocument`\n\n*   `hasFocus()`\n\n`doctype` has the doctype of the document.\n\
    \n`documentElement` has the whole document.\n"
