    \n```\nlet divs = $(\"div\").get();\n\ndivs = divs.concat($(\".dup\").get());\n\
    \nconsole.log(divs.length)\n\ndivs = jQuery.uniqueSort(divs);\n\nconsole.log(divs.length)\n\
    ```\n\nWe get the divs. Then we add the divs with class `dup` into the divs element\
    \ list.\n\nThen we call `uniqueSort` to sort them and remove the duplicates.\n\
    \nTherefore, the first console log logs 8 and the 2nd one logs 5.\n\n## `jQuery.when()`\n\
    \nWe can use the `jQuery.when()` method to run callback functions based on 0 or\
