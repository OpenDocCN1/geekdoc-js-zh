    \ = (val) => console.log('fn2', val);\nconst callbacks = $.Callbacks();\ncallbacks.add(fn1);\n\
    callbacks.fire(\"foo!\");\ncallbacks.add(fn2);\ncallbacks.fire(\"bar!\");\n```\n\
    \nWe call `$.Callbacks()` to returns the callbacks list object.\n\nThen we call\
    \ `add` to add the callback functions.\n\nAnd we call `fire` to call the callbacks\
    \ with the given argument.\n\nSo, we’ll get:\n\n```\nfn1 foo!\nfn1 bar!\nfn2 bar!\n\
    ```\n\nlogged in the console.\n\n## `jQuery.contains()`\n\nThe `jQuery.contains()`\
    \ method lets us check to see if a DOM element is a descendant of another DOM\
