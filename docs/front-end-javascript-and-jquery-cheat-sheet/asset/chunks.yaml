    >III</li>\n</ul>\n```\n\n那么我们可以获取带有 `item-a` 类的 `li` 的父元素，并为其添加背景色：\n\n```\n$(\"\
    li.item-a\").parent().css(\"background-color\", \"red\");\n```\n\n## `:parent`\
    \ 选择器\n\n`:parent` 选择器允许我们获取给定元素的父元素。\n\n例如，如果我们有以下代码：\n\n```\n<table border=\"\
