    \ modHeight = 60;\n$(\"div\").one(\"click\", function() {\n  $(this).outerHeight(modHeight);\n\
    });\n```\n\n## `.outerWidth()`\n\n`.outerWidth()` 方法获取当前计算后的外部宽度，包括内边距、边框，以及可选的边距，适用于匹配元素集合中的第一个元素。\n\
    \n它也可以用于设置所有匹配元素的外部宽度。\n\n它也可以用于设置每个匹配元素的外部高度。\n\n例如，如果我们有以下代码：\n\n```\n<p>Hello</p>\n\
    ```\n\n那么我们可以通过编写以下代码，获取包含边距的外部宽度：\n\n```\nconst p = $(\"p\").first();\nconsole.log(p.outerWidth(true));\n\
    ```\n\n`true` 表示包含边距。\n\n如果我们有以下 HTML：\n\n```\n<div>d</div>\n<div>d</div>\n<div>d</div>\n\
