  trans: "\n\n如果我们有以下代码：\n\n```\n<p></p>\n```\n\n以及：\n\n```\np {\n  height: 1000px;\n\
    \  width: 1000px;\n  background-color: green;\n}\n```\n\n那么，通过编写以下代码，我们可以获取正在滚动的\
    \ `p` 元素的宽度：\n\n```\nconst p = document.querySelector('p');\n\nconsole.log(p.scrollHeight,\
    \ p.scrollWidth);\n```\n\n并且每个属性都会返回 1000。\n\n## 获取和设置从顶部和左侧滚动的像素数\n\n`scrollTop`\
    \ 和 `scrollLeft` 是读写属性，它们返回由于滚动而在可滚动视口中当前不可见的左侧或顶部的像素数。\n\n例如，如果我们有以下代码：\n\n```\n\
    <p></p>\n```\n\n以及：\n\n```\np {\n  height: 1000px;\n  width: 1000px;\n  background-color:\
    \ green;\n}\n```\n\n那么我们可以通过编写以下代码来设置它们：\n\n```\nconst p = document.querySelector('p');\n\
    p.scrollTop = 750;\np.scrollLeft = 750;\n```\n\n然后，当我们记录这些值时，应该会看到这些数值。\n\n##\
    \ 将元素滚动到视图中\n\n我们可以调用 `scrollIntoView()` 方法将元素滚动到视图中。\n\n例如，如果我们有以下代码：\n\n```\n\
    for (let i = 0; i < 50; i++) {\n  const p = document.createElement('p');\n  p.innerText\
    \ = i;\n  document.body.appendChild(p);\n}\n```\n\n生成 50 个 `p` 元素并将它们附加到 body，然后通过编写以下代码将第\
    \ 41 个元素滚动到视图中：\n\n```\ndocument.querySelectorAll('p')[40].scrollIntoView(true);\n\
    ```\n\n## 样式属性\n\nDOM 节点对象具有 `style` 属性，用于设置我们选择的元素的样式。\n\n它也会返回元素的样式。\n\n例如，如果我们有以下代码：\n\
    \n```\n<div></div>\n```\n\n那么我们可以通过编写以下代码来获取样式：\n\n```\nconst styles = document.querySelector('div').style;\n\
    ```\n\n然后 `styles` 将包含所有样式。\n\n## 获取、设置和移除内联 CSS 属性\n\n我们可以使用 `style` 属性来设置 CSS\
    \ 样式。\n\n例如，如果我们有一个 `div`：\n\n```\n<div></div>\n```\n\n我们可以编写：\n\n```\nconst divStyle\
    \ = document.querySelector('div').style;\ndivStyle.backgroundColor = 'yellow';\n\
    divStyle.border = '1px solid green';\ndivStyle.width = '200px';\ndivStyle.height\
    \ = '200px';\n```\n\n然后我们会得到一个带有绿色边框的黄色盒子，高度和宽度各为 200px。\n\n在 CSS 中为 kebab-case\
    \ 的属性在 JavaScript 中会转换为 camelCase。\n\n例如，如果在 CSS 中有 `background-color`，那么在 JavaScript\
    \ 中就是 `backgroundColor`。\n\n这适用于所有多词属性。\n\n我们也可以使用 `setProperty()` 方法来设置样式，使用\
    \ `getPropertyValue()` 来获取样式。\n\n例如，我们可以用以下代码重写上面的代码：\n\n```\nconst divStyle =\
    \ document.querySelector('div').style;\ndivStyle.setProperty('background-color',\
    \ 'yellow');\ndivStyle.setProperty('border', '1px solid green');\ndivStyle.setProperty('height',\
    \ '200px');\ndivStyle.setProperty('width', '200px');\n```\n\n这里我们调用 `setProperty()`\
    \ 而不是直接设置 `style` 属性。\n\n要获取样式，我们可以使用 `getPropertyValue()` 方法：\n\n```\nconsole.log(divStyle.getPropertyValue('background-color'));\n\
    ```\n\n## 获取、设置和移除所有内联 CSS 属性\n\n我们可以使用 `getAttribute()` 和 `setAttribute()` 来获取或设置所有\
    \ CSS 属性。\n\n例如，我们可以编写：\n\n```\nconst div = document.querySelector('div');\ndiv.setAttribute('style',\
    \ 'background-color: yellow; height: 200px; width: 200px');\n```\n\n然后通过设置 `div`\
    \ 的 `style` 属性，在字符串中设置所有样式。\n\n要获取样式，我们可以使用 `getAttribute()` 如下：\n\n```\nconsole.log(div.getAttribute('style'));\n\
    ```\n\n## 获取元素的计算样式\n\n我们可以使用 `getComputedStyle()` 获取元素的所有样式。\n\n它包括所有样式，包括内联样式、来自样式表的样式以及\
    \ style 标签中的样式。\n\n例如，如果我们有以下代码：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    \  <head>\n    <style>\n      div {\n        background-color: green;\n      \
    \  border: 1px solid yellow;\n        height: 150px;\n        width: 150px;\n\
    \      }\n     </style>\n  </head>\n\n  <body>\n    <div style=\"background-color:orange;\"\
    ></div>\n   </body>\n</html>\n```\n\n我们可以这样使用它：\n\n```\nconst div = document.querySelector('div');\n\
    console.log(window.getComputedStyle(div).backgroundColor);\n```\n\n内联样式会覆盖其他样式，因此它会返回\
    \ `rgb(255, 165, 0)`，即橙色。\n\n对于颜色，它总是返回 `rgb` 格式。\n\n## 使用 class 和 id 属性应用和移除\
    \ CSS 属性\n\n我们可以将样式放在 ID 或类 CSS 选择器中，并使用它们来应用样式。\n\n例如，如果我们有一个 `div`：\n\n```\n\
    <div></div>\n```\n\n以及一些 CSS：\n\n```\n.foo{\n  background-color: green;\n  width:\
    \ 100px;\n  height: 100px;\n}\n\n#bar{\n  border:10px solid red;\n  width: 100px;\n\
    \  height: 100px;\n}\n```\n\n我们可以编写：\n\n```\nconst div = document.querySelector('div');\n\
    div.setAttribute('id','bar');\n```\n\n然后我们会得到一个带有红色边框的盒子。\n\n我们可以通过编写以下代码将 `foo`\
    \ 类添加到 `div`：\n\n```\nconst div = document.querySelector('div');\ndiv.classList.add('foo');\n\
    ```\n\n然后盒子将添加绿色背景色。\n\n## 文本节点\n\nHTML 文档中的文本节点是 `Text` 构造函数的实例。\n\n它们返回文本节点。\n\
    \n例如，如果我们有以下代码：\n\n```\n<p>hello</p>\n```\n\n那么我们可以通过以下方式获取 `p` 元素内部的文本：\n\n```\n\
    const hello = document.querySelector('p').firstChild;\n```\n\n## 文本对象和属性\n\n`Text`\
    \ 实例具有各种对象和属性。\n\n它们具有以下属性和方法：\n\n*   `textContent` — 文本节点的内容\n*   `splitText()`\
    \ — 按指定的偏移量将文本拆分为两个节点\n*   `appendData()` — 向节点追加数据\n*   `deleteData()` — 从节点删除数据\n\
    *   `insertData()` — 在所需位置向节点添加数据\n*   `replaceData()` — 替换给定位置的数据\n*   `subStringData()`\
    \ — 从文本节点中提取部分文本\n*   `normalize()` — 将节点和子节点规范化为标准形式。这意味着移除空节点\n*   `data` —\
    \ 返回节点的数据\n*   `createTextNode()` — 创建一个新的文本节点\n\n## 空白会创建文本节点\n\n空白会创建文本节点。\n\
    \n如果它们是空的，那么字符串中会包含空格。\n\n例如，如果我们有以下代码：\n\n```\n<p> </p>\n```\n\n然后我们编写：\n\n```\n\
    document.querySelector('p').firstChild.nodeName\n```\n\n然后我们会得到 `#text`，表明它是一个文本节点。\n\
    \n## 向元素节点添加事件监听器\n\n我们可以使用 `addEventListener()` 向元素节点添加事件监听器。\n\n例如，我们可以编写：\n\
    \n```\nwindow.addEventListener('mousemove', (e) => {\n  console.log(e.clientX,\
    \ e.clientY);\n}, false);\n```\n\n来监听 `mousemove` 事件，并在鼠标移动时记录鼠标坐标。\n\n同样的操作也可以应用于元素。如果我们有以下代码：\n\
    \n```\n<button>\n  click me\n</button>\n```\n\n那么我们可以编写：\n\n```\nconst button\
    \ = document.querySelector('button');\n\nbutton.addEventListener('click', () =>\
    \ {\n  console.log('clicked');\n}, false);\n```\n\n来监听按钮的点击事件。\n\n## 移除事件监听器\n\
    \n如果原始监听器是一个命名函数，我们可以使用 `removeEventListener()` 来移除事件监听器。\n\n例如，如果我们有以下代码：\n\n\
    ```\n<button>\n  click me\n</button>\n```\n\n那么我们可以编写：\n\n```\nconst button =\
    \ document.querySelector('button');\n\nconst listener = () => {\n  console.log('clicked');\n\
    \  button.removeEventListener('click', listener);\n}\n\nbutton.addEventListener('click',\
    \ listener, false);\n```\n\n这样只在第一次点击时记录 `'clicked'`。\n\n这是因为我们在第一次调用监听器后，对 `button`\
    \ 的 `click` 事件调用了 `removeEventListener()` 来移除该监听器。\n\n## 从事件对象获取事件属性\n\n我们可以从事件对象中获取事件属性。\n\
    \n它是监听器的第一个参数。\n\n例如，我们可以编写：\n\n```\nwindow.addEventListener('load', (event) =>\
    \ {\n  console.log(event);\n});\n```\n\n来记录 `event` 对象，该对象具有各种属性。\n\n它有许多属性，以及\
    \ `stopPropagation()`、`stopImmediatePropagation()` 和 `preventDefault()` 方法。\n\n\
    `stopPropagation()` 会阻止事件传播到所有祖先元素。\n\n"
- fmt: "\n`stopImmediatePropagation` stop other listeners of the same event from being\
    \ called.\n\n`preventDefault` stops the default action of the element from being\
    \ run.\n\n## Value of this Inside addEventListener\n\nThe value of `this` inside\
    \ the event listener function that we pass into `addEventListener` is the reference\
    \ to the node or object the event is attached to.\n\nThis only applies to traditional\
    \ functions.\n\nFor instance, if we have a button:\n\n```\n<button>\n  click me\n\
    </button>\n```\n\nThen if we write:\n\n```\nconst button = document.querySelector('button');\n\
    \nbutton.addEventListener('click', function(event) {\n  console.log(this);\n});\n\
    ```\n\n`this` would the button that the listener is registered to.\n\nWe can use\
    \ `event.currentTarget` to get the same reference.\n\nIt’s more reliable than\
    \ `this` since that works with arrow functions as well.\n\n## Referencing the\
    \ target of an Event\n\nWe can use the `event.target` property to get the element\
    \ that’s the target of the event.\n\nThis can be different from the node that\
    \ the event is invoked on.\n\nFor instance, we can write:\n\n```\ndocument.body.addEventListener('click',\
    \ (event) => {\n  console.log(event.target);\n}, false);\n```\n\nto get the element\
    \ that’s clicked.\n\n## Canceling Default Browser Events\n\nWe can cancel default\
    \ browser events using `preventDefault` .\n\nFor instance, we can stop the default\
    \ behavior of a link by using this method.\n\nIf we have the following HTML:\n\
    \n```\n<a href=\"http://example.com\">don't go</a>\n```\n\nThen we can stop users\
    \ from going to [http://example.com](http://example.com) when users click on the\
    \ link by writing:\n\n```\ndocument.querySelector('a').addEventListener('click',\
    \ (event) => {\n  event.preventDefault();\n}, false);\n```\n\nThe link will do\
    \ nothing when we click it.\n\n`preventDefault` doesn’t stop events from propagating\
    \ either in the bubbling or capture phase.\n\nAdding `return false` at the end\
    \ of the event listener function body has the same result as `preventDefault`\
    \ .\n\nAn event object has the `cancelable` property to indicate if an event will\
    \ respond to `preventDefault` .\n\n## Stop Event Flow\n\nTo stop events from flowing\
    \ to ancestor elements or vice versa, we can use the `stopPropagation` method.\n\
    \nFor instance, we can write:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopPropagation();\n}, false);\n\
    ```\n\nto stop propagation from the element where the event originated to the\
    \ ancestor.\n\n## Stop the Event Flow and Other Like Events on the Same Target\n\
    \n`stopImmediatePropagation` stops the event flow phase as well as any other like\
    \ events attached to the event target that are attached after the event listener.\n\
    \nFor instance, we can write:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n```\n\nThen if we have:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n\ndocument.querySelector('button').addEventListener('click', () =>\
    \ {\n  //...\n}, false);\n\ndocument.body.addEventListener('click', () => {\n\
    \  //...\n}, false);\n```\n\nNone of the listeners below the first one will be\
    \ called because we called `stopImmediatePropagation` in the first listener.\n\
    \n## DOM Event Types\n\nThere are many kinds of events that we can listen to.\n\
    \nThe following are user events:\n\n*   `load` — fired when something is loaded\n\
    *   `unload` — fires when a user agent removes the resource\n*   `abort` — fires\
    \ when a resource stopped from loading before it finished loading\n*   `error`\
    \ — fires when something fails to load\n*   `resize` — fires when a document view\
    \ has been resized\n*   `scroll` —fires when user scrolls\n*   `contextmenu` —\
    \ fires by right-clicking and element\n\nThere are focus events:\n\n*   `blur`\
    \ — fires when an element loses focus by firing the most or pressing tab\n*  \
    \ `focus` — fires when an element receives focus\n*   `focusin` — fires when an\
    \ event target is about to receive focus but before focus is shifted\n*   `focusout`\
    \ — fires when an event target is about to lose focus\n\nForm events include:\n\
    \n*   `change` — fires when control lose input focus\n*   `reset` — fires when\
    \ a form is reset\n*   `submit` — fires when a form is submitted\n*   `select`\
    \ — fires when a user selects some text in a field\n\nMouse events include:\n\n\
    *   `click` — fires when a mouse pointer is clicked over an element\n*   `dblclick`\
    \ — fires when a mouse pointer is liked twice over an element\n*   `mousedown`\
    \ — fires when a mouse pointer is pressed over an element\n*   `mouseenter` —\
    \ fires when a mouse pointer is moved onto an element\n*   `mouseleave` — fires\
    \ when the mouse pointer is moved off of the boundaries of an element all of its\
    \ children elements.\n*   `mousemove` — fires when the mouse pointer is moved\
    \ while it’s over an element\n*   `mouseup` — fire when the mouse pointer is released\
    \ over an element\n*   `mouseover` — fires when the mouse pointer is moved over\
    \ an element\n\nWheel events include:\n\n*   `wheel` — fires when a mouse wheel\
    \ is rotated\n\nKeyword events include:\n\n*   `keydown` — fires when a key is\
    \ initially pressed\n*   `keypress` — fires when a key is initially pressed\n\
    *   `keyup` — fires when a key is released\n\nTouch events include:\n\n*   `touchstart`\
    \ — fires event to indicate when the user places a touchpoint on the touch surface\n\
    *   `touchend` — fires to indicate when a user removes a touchpoint from the touch\
    \ surface\n*   `touchmove` — fires when the user moves a touchpoint along the\
    \ touch surface\n*   `toucheneter` — fires when a touchpoint moves onto the interactive\
    \ area defined by a DOM element\n*   `touchleave` — fires to indicate when a touchpoint\
    \ moves off the area defined by a DOM element\n*   `touchcancel` — fires when\
    \ a touchpoint is disrupted\n\nWindow /body events include:\n\n*   `afterprint`\
    \ — fire when something is printed\n*   `beforeprint` — fires before something\
    \ prints\n*   `beforeunload` — fires before a document are unloaded\n*   `hashchange`\
    \ — fires when the part of the URL followed by `#` changes\n*   `message` — fires\
    \ when a user sends a message to a worker\n*   `offline` — fires when the browser\
    \ is offline\n*   `online` — fires when the browser is online\n*   `pagehide`\
    \ — fires when traversing from a session history entry\n*   `pageshow` — fired\
    \ when traveling from a session history entry\n\nDocument events include:\n\n\
    *   `readystatechange` — fires when the ready state is changed\n*   `DOMContentLoaded`\
    \ — firs when a webpage is loaded but before all resources are downloaded\n\n\
    Drag events include:\n\n*   `drag` — fires when the source object is dragged\n\
    *   `dragstart` — fires when the source object begins to be dragged\n*   `dragend`\
    \ — fires on the source object when the user releases the mouse on the dragged\
    \ object\n*   `dragenter` — fires when the dragged element enters the drop target\n\
    *   `dragleave` — fires hen the object moves to the drop target\n*   `dragover`\
    \ — fires when the object is dragged over a drop target\n*   `drop` — fires when\
    \ the object is dropped\n\n## Event Flow\n\nEvents propagate through the DOM.\n\
    \nThey go from the originating element all the way to the root element object.\
    \ This is called the bubbling phase\n\nTherefore. when we register listeners on\
    \ the ancestor objects, they’ll also run.\n\nThere’s also the capture phase, which\
    \ is the reverse of the bubbling phase.\n\n## Custom Events\n\nWe can emit custom\
    \ events in our JavaScript code.\n\nTh do that we can use the `createEvent` method\
    \ and then use `addEventListener` to listen to the event.\n\nFor instance, if\
    \ we have a button:\n\n```\n<button>\n  click me\n</button>\n```\n\nWe can write:\n\
    \n```\nconst button = document.querySelector('button');\nconst customEvent = document.createEvent('CustomEvent');\n\
    button.addEventListener('hello', (event) => {\n  console.log(event.detail.foo)\n\
    }, false);\n\ncustomEvent.initCustomEvent('hello', true, false, {\n  foo: 'bar'\n\
    });\n\nbutton.dispatchEvent(customEvent);\n```\n"
  raw: "`stopImmediatePropagation` stop other listeners of the same event from being\
    \ called.\n\n`preventDefault` stops the default action of the element from being\
    \ run.\n\n## Value of this Inside addEventListener\n\nThe value of `this` inside\
    \ the event listener function that we pass into `addEventListener` is the reference\
    \ to the node or object the event is attached to.\n\nThis only applies to traditional\
    \ functions.\n\nFor instance, if we have a button:\n\n```\n<button>\n  click me\n\
    </button>\n```\n\nThen if we write:\n\n```\nconst button = document.querySelector('button');\n\
    \nbutton.addEventListener('click', function(event) {\n  console.log(this);\n});\n\
    ```\n\n`this` would the button that the listener is registered to.\n\nWe can use\
    \ `event.currentTarget` to get the same reference.\n\nIt’s more reliable than\
    \ `this` since that works with arrow functions as well.\n\n## Referencing the\
    \ target of an Event\n\nWe can use the `event.target` property to get the element\
    \ that’s the target of the event.\n\nThis can be different from the node that\
    \ the event is invoked on.\n\nFor instance, we can write:\n\n```\ndocument.body.addEventListener('click',\
    \ (event) => {\n  console.log(event.target);\n}, false);\n```\n\nto get the element\
    \ that’s clicked.\n\n## Canceling Default Browser Events\n\nWe can cancel default\
    \ browser events using `preventDefault` .\n\nFor instance, we can stop the default\
    \ behavior of a link by using this method.\n\nIf we have the following HTML:\n\
    \n```\n<a href=\"http://example.com\">don't go</a>\n```\n\nThen we can stop users\
    \ from going to [http://example.com](http://example.com) when users click on the\
    \ link by writing:\n\n```\ndocument.querySelector('a').addEventListener('click',\
    \ (event) => {\n  event.preventDefault();\n}, false);\n```\n\nThe link will do\
    \ nothing when we click it.\n\n`preventDefault` doesn’t stop events from propagating\
    \ either in the bubbling or capture phase.\n\nAdding `return false` at the end\
    \ of the event listener function body has the same result as `preventDefault`\
    \ .\n\nAn event object has the `cancelable` property to indicate if an event will\
    \ respond to `preventDefault` .\n\n## Stop Event Flow\n\nTo stop events from flowing\
    \ to ancestor elements or vice versa, we can use the `stopPropagation` method.\n\
    \nFor instance, we can write:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopPropagation();\n}, false);\n\
    ```\n\nto stop propagation from the element where the event originated to the\
    \ ancestor.\n\n## Stop the Event Flow and Other Like Events on the Same Target\n\
    \n`stopImmediatePropagation` stops the event flow phase as well as any other like\
    \ events attached to the event target that are attached after the event listener.\n\
    \nFor instance, we can write:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n```\n\nThen if we have:\n\n```\nconst button = document.querySelector('button')\n\
    \nbutton.addEventListener('click', (e) => {\n  e.stopImmediatePropagation();\n\
    }, false);\n\ndocument.querySelector('button').addEventListener('click', () =>\
    \ {\n  //...\n}, false);\n\ndocument.body.addEventListener('click', () => {\n\
    \  //...\n}, false);\n```\n\nNone of the listeners below the first one will be\
    \ called because we called `stopImmediatePropagation` in the first listener.\n\
    \n## DOM Event Types\n\nThere are many kinds of events that we can listen to.\n\
    \nThe following are user events:\n\n*   `load` — fired when something is loaded\n\
    \n*   `unload` — fires when a user agent removes the resource\n\n*   `abort` —\
    \ fires when a resource stopped from loading before it finished loading\n\n* \
    \  `error` — fires when something fails to load\n\n*   `resize` — fires when a\
    \ document view has been resized\n\n*   `scroll` —fires when user scrolls\n\n\
    *   `contextmenu` — fires by right-clicking and element\n\nThere are focus events:\n\
    \n*   `blur` — fires when an element loses focus by firing the most or pressing\
    \ tab\n\n*   `focus` — fires when an element receives focus\n\n*   `focusin` —\
    \ fires when an event target is about to receive focus but before focus is shifted\n\
    \n*   `focusout` — fires when an event target is about to lose focus\n\nForm events\
    \ include:\n\n*   `change` — fires when control lose input focus\n\n*   `reset`\
    \ — fires when a form is reset\n\n*   `submit` — fires when a form is submitted\n\
    \n*   `select` — fires when a user selects some text in a field\n\nMouse events\
    \ include:\n\n*   `click` — fires when a mouse pointer is clicked over an element\n\
    \n*   `dblclick` — fires when a mouse pointer is liked twice over an element\n\
    \n*   `mousedown` — fires when a mouse pointer is pressed over an element\n\n\
    *   `mouseenter` — fires when a mouse pointer is moved onto an element\n\n*  \
    \ `mouseleave` — fires when the mouse pointer is moved off of the boundaries of\
    \ an element all of its children elements.\n\n*   `mousemove` — fires when the\
    \ mouse pointer is moved while it’s over an element\n\n*   `mouseup` — fire when\
    \ the mouse pointer is released over an element\n\n*   `mouseover` — fires when\
    \ the mouse pointer is moved over an element\n\nWheel events include:\n\n*   `wheel`\
    \ — fires when a mouse wheel is rotated\n\nKeyword events include:\n\n*   `keydown`\
    \ — fires when a key is initially pressed\n\n*   `keypress` — fires when a key\
    \ is initially pressed\n\n*   `keyup` — fires when a key is released\n\nTouch\
    \ events include:\n\n*   `touchstart` — fires event to indicate when the user\
    \ places a touchpoint on the touch surface\n\n*   `touchend` — fires to indicate\
    \ when a user removes a touchpoint from the touch surface\n\n*   `touchmove` —\
    \ fires when the user moves a touchpoint along the touch surface\n\n*   `toucheneter`\
    \ — fires when a touchpoint moves onto the interactive area defined by a DOM element\n\
    \n*   `touchleave` — fires to indicate when a touchpoint moves off the area defined\
    \ by a DOM element\n\n*   `touchcancel` — fires when a touchpoint is disrupted\n\
    \nWindow /body events include:\n\n*   `afterprint` — fire when something is printed\n\
    \n*   `beforeprint` — fires before something prints\n\n*   `beforeunload` — fires\
    \ before a document are unloaded\n\n*   `hashchange` — fires when the part of\
    \ the URL followed by `#` changes\n\n*   `message` — fires when a user sends a\
    \ message to a worker\n\n*   `offline` — fires when the browser is offline\n\n\
    *   `online` — fires when the browser is online\n\n*   `pagehide` — fires when\
    \ traversing from a session history entry\n\n*   `pageshow` — fired when traveling\
    \ from a session history entry\n\nDocument events include:\n\n*   `readystatechange`\
    \ — fires when the ready state is changed\n\n*   `DOMContentLoaded` — firs when\
    \ a webpage is loaded but before all resources are downloaded\n\nDrag events include:\n\
    \n*   `drag` — fires when the source object is dragged\n\n*   `dragstart` — fires\
    \ when the source object begins to be dragged\n\n*   `dragend` — fires on the\
    \ source object when the user releases the mouse on the dragged object\n\n*  \
    \ `dragenter` — fires when the dragged element enters the drop target\n\n*   `dragleave`\
    \ — fires hen the object moves to the drop target\n\n*   `dragover` — fires when\
    \ the object is dragged over a drop target\n\n*   `drop` — fires when the object\
    \ is dropped\n\n## Event Flow\n\nEvents propagate through the DOM.\n\nThey go\
    \ from the originating element all the way to the root element object. This is\
    \ called the bubbling phase\n\nTherefore. when we register listeners on the ancestor\
    \ objects, they’ll also run.\n\nThere’s also the capture phase, which is the reverse\
    \ of the bubbling phase.\n\n## Custom Events\n\nWe can emit custom events in our\
    \ JavaScript code.\n\nTh do that we can use the `createEvent` method and then\
    \ use `addEventListener` to listen to the event.\n\nFor instance, if we have a\
    \ button:\n\n```\n<button>\n  click me\n</button>\n```\n\nWe can write:\n\n```\n\
    const button = document.querySelector('button');\nconst customEvent = document.createEvent('CustomEvent');\n\
    button.addEventListener('hello', (event) => {\n  console.log(event.detail.foo)\n\
    }, false);\n\ncustomEvent.initCustomEvent('hello', true, false, {\n  foo: 'bar'\n\
    });\n\nbutton.dispatchEvent(customEvent);\n```"
