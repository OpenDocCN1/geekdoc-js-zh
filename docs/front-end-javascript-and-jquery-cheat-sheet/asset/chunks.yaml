    ```\n\nThen we can show all the divs that are hidden when we click on the button\
    \ by writing:\n\n```\n$(\"div:visible\").click(function() {\n  $(this).css(\"\
    background\", \"yellow\");\n});\n$(\"button\").click(function() {\n  $(\"div:hidden\"\
    ).show(\"fast\");\n});\n```\n\nAnd when we click on the visible divs, we see a\
    \ yellow background.\n\n## `.width()`\n\nThe `.width()` method gets the current\
    \ computed width for the first element in the set of matched elements or set the\
    \ width of every matched element.\n\nFor example, we can write:\n\n```\nconsole.log($(window).width());\n\
    ```\n\nto log the width of the window.\n\nTo set the widths of the divs given\
    \ the following HTML:\n\n```\n<div>d</div>\n<div>d</div>\n<div>d</div>\n<div>d</div>\n\
    <div>d</div>\n```\n\nAnd CSS:\n\n```\ndiv {\n  width: 70px;\n  height: 50px;\n\
    \  float: left;\n  margin: 5px;\n  background: red;\n  cursor: pointer;\n}\n```\n\
    \nWe can add click handlers to the divs and change the width inside by writing:\n\
    \n```\nconst modWidth = 50;\n$(\"div\").one(\"click\", function() {\n  $(this).width(modWidth)\n\
    });\n```\n\n## `.wrap()`\n\nThe `.wrap()` method lets us wrap an element with\
    \ a wrapper element.\n\nFor example, if we have:\n\n```\n<div class=\"container\"\
    >\n  <div class=\"inner\">Hello</div>\n  <div class=\"inner\">Goodbye</div>\n\
    </div>\n```\n\nThen we can wrap each div with the class `inner` with a div with\
    \ class `new` by writing:\n\n```\n$(\".inner\").wrap(\"<div class='new'></div>\"\
    );\n```\n\n## `.wrapAll()`\n\nThe `.wrapAll()` method lets us wrap an HTML structure\
    \ around all elements in the set of matched elements.\n\nFor example, if we have:\n\
    \n```\n<div class=\"container\">\n  <div class=\"inner\">Hello</div>\n  <div class=\"\
    inner\">Goodbye</div>\n</div>\n```\n\nThen we can wrap a div with class `new`\
    \ around all the divs with class `inner` by writing:\n\n```\n$(\".inner\").wrapAll(\"\
    <div class='new' />\");\n```\n\n## `.wrapInner()`\n\nWe can wrap an HTML structure\
    \ around the content of each element in the set of matched elements with the `wrapInner`\
    \ method.\n\nFor example, if we have:\n\n```\n<div class=\"container\">\n  <div\
    \ class=\"inner\">Hello</div>\n  <div class=\"inner\">Goodbye</div>\n</div>\n\
    ```\n\nThen we can wrap the content of each div with class `inner` with a div\
    \ with class `new` by writing:\n\n```\n$(\".inner\").wrapInner(\"<div class='new'></div>\"\
    );\n```\n\n# Conclusion\n\nJavaScript is one of the most popular programming languages\
    \ in the world. To use it effectively, we’ve to know about the basics of it.\n\
    \nIt has all the basic features of any language.\n\nIt's also the language of\
