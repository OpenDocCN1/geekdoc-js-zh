  trans: "\n\n如果我们想检查两个表达式是否不相等，可以使用 `!==` 不等比较运算符。\n\n例如：\n\n```\n\"Rose\" !== \"\
    rose\"\n```\n\n这会返回 `true`，因为它们的字母大小写不同。\n\nJavaScript 还提供了更多运算符。\n\n包括 `>` 表示大于运算符。\n\
    \n`<` 表示小于运算符。\n\n`>=` 表示大于或等于运算符。\n\n`<=` 表示小于或等于运算符。\n\n我们可以这样使用它们：\n\n```\n\
    if (2 > 0) {\nif (0 < 2) {\nif (2 >= 0) {\nif (2 >= 1) {\nif (0 <= 2) {\nif (1\
    \ <= 2) {\n```\n\n## if…else 和 else if 语句\n\n如果有多个条件需要检查，可以使用 `else` 关键字来添加更多分支。\n\
    \n例如，我们可以这样写：\n\n```\nconst answer = prompt(\"意大利的首都在哪里？\");\nif (answer === \"\
    罗马\") {\n  alert(\"正确！\");\n} else {\n  alert(\"错误！\");\n}\n```\n\n`else` 关键字位于当\
    \ `answer` 不是 `'罗马'` 时执行的代码块之前。\n\n如果有更多分支，可以添加 `else if` 语句。\n\n例如，我们可以这样写：\n\
    \n```\nconst answer = prompt(\"意大利的首都在哪里？\");\nif (answer === \"罗马\") {\n  alert(\"\
    正确！\");\n} else if (answer === \"梵蒂冈\") {\n  alert(\"很接近！\");\n} else {\n  alert(\"\
    错误！\");\n}\n```\n\n当 `answer` 是 `'梵蒂冈'` 时，会执行相应代码。\n\n如果 `answer` 既不是 `'罗马'` 也不是\
    \ `'梵蒂冈'`，则执行最后一个代码块。\n\n## 测试条件组合\n\n我们可以用 `if` 语句测试多个条件。\n\n要组合它们，可以使用 `&&`\
    \ 或 `||` 运算符。\n\n`&&` 是逻辑与运算符，`||` 是逻辑或运算符。\n\n例如，我们可以这样写：\n\n```\nif (weight\
    \ > 300 && time < 6) {\n  alert(\"运动员\");\n} else {\n  alert(\"厨师\");\n}\n```\n\
    \n同时检查 `weight` 和 `time` 的值。\n\n如果 `weight` 小于 300 且 `time` 小于 6，则执行第一个代码块。\n\n\
    否则，执行第二个代码块。\n\n我们可以链式组合更多条件：\n\n```\nif (weight > 300 && time < 6 && age > 17\
    \ && gender === \"male\") {\n  alert(\"运动员\");\n} else {\n  alert(\"厨师\");\n}\n\
    ```\n\n这会检查所有条件是否都为 `true`。如果全部为 `true`，则执行第一个代码块。\n\n否则，执行第二个代码块。\n\n`||` 运算符的使用方式类似。\n\
    \n例如，我们可以这样写：\n\n```\nif (SAT > avg || GPA > 2.5 || sport === \"football\") {\n\
    \  alert(\"录取\");\n} else {\n  alert(\"未录取\");\n}\n```\n\n如果任意一个条件返回 `true`，`||`\
    \ 运算符就会返回 `true`。\n\n我们可以混合使用 `||` 和 `&&`。\n\n例如，我们可以这样写：\n\n```\nif (age > 65\
    \ || age < 21 && res === \"U.S.\")\n```\n\n`&&` 优先级更高，因此先计算 `res === \"U.S.\"\
    `。\n\n然后计算 `||` 运算符。\n\n为了更清晰，应该用括号将表达式括起来，方便所有人阅读：\n\n```\nif ((age > 65 || age\
    \ < 21) && res === \"U.S.\")\n```\n\n## 嵌套 if 语句\n\n我们可以嵌套 `if` 语句。例如，我们可以这样写：\n\
    \n```\nif (c === d) {\n  if (x === y) {\n    g = h;\n  } else if (a === b) {\n\
    \    g = h;\n  } else {\n    v = u;\n  }\n} else {\n  v = u;\n}\n```\n\n我们将内部表达式缩进两个空格，使其易于输入和阅读。\n\
    \n嵌套层级不宜过多，否则难以阅读。\n\n## 数组\n\n程序中经常需要存储多个值。\n\n为了简化操作，我们可以使用数组。\n\n例如，与其重复声明变量来存储相似的值：\n\
    \n```\nlet city0 = \"奥斯陆\";\nlet city1 = \"罗马\";\nlet city2 = \"多伦多\";\nlet city3\
    \ = \"丹佛\";\nlet city4 = \"洛杉矶\";\nlet city5 = \"西雅图\";\n```\n\n我们可以将它们全部放入一个数组中：\n\
    \n```\nlet cities = [\"奥斯陆\", \"罗马\", \"多伦多\", \"丹佛\", \"洛杉矶\", \"西雅图\"];\n```\n\
    \n数组对于存储固定大小或动态大小的数据列表非常有用。\n\n我们可以通过索引访问数组元素。\n\n例如，我们可以这样写：\n\n```\ncities[2]\n\
    ```\n\nJavaScript 数组可以包含不同类型。例如，我们可以这样写：\n\n```\nlet mixedArray = [1, \"james\"\
    , \"mary\", true];\n```\n\n第一个元素的索引是 0。变量的命名规则同样适用于数组。\n\n数组和其他变量一样，只能声明一次。\n\n\
    ## 查找字符串中某个位置的字符\n\n我们可以使用 `charAt` 方法或方括号表示法来查找字符串中某个位置的字符。\n\n例如，我们可以这样写：\n\n\
    ```\nlet firstChar = 'james'.charAt(0)\n```\n\n那么 `firstChar` 就是 `'j'`。\n\n这与以下写法相同：\n\
    \n```\nlet firstChar = 'james'[0]\n```\n\n两者效果相同，但由于方括号更简洁，使用更频繁。\n\n## 替换字符\n\
    \n`replace` 方法允许我们替换字符。\n\n例如，我们可以这样写：\n\n```\nlet newText = text.replace(\"第二次世界大战\"\
    , \"二战\");\n```\n\n将 `\"第二次世界大战\"` 替换为 `\"二战\"`。\n\n它会搜索第一个匹配项并进行替换。\n\n要搜索所有匹配项并全部替换，需要使用正则表达式：\n\
    \n```\nlet newText = text.replace(/第二次世界大战/g, \"二战\");\n```\n\n`g` 标志表示全局匹配，即替换所有匹配项。\n\
    \n## 数字取整\n\n我们可以使用 `Math.round` 方法对数字进行四舍五入。\n\n例如，我们可以这样写：\n\n```\nlet score\
    \ = Math.round(11.1);\n```\n\n这样 `Math.round` 会将 11.1 四舍五入为 11。\n\n它会四舍五入到最接近的整数。\n\
    \n当小数部分为 .5 时，函数会向上取整。\n\n要始终向上取整到最接近的整数，可以使用 `Math.ceil` 方法：\n\n```\nlet score\
    \ = Math.ceil(11.1);\n```\n\n得到 12。\n\n要始终向下取整到最接近的整数，可以使用 `Math.floor` 方法：\n\n\
    ```\nlet score = Math.floor(11.1);\n```\n\n## 生成随机数\n\nJavaScript 自带生成随机数的函数。\n\
    \n`Math.random` 方法可以生成 0 到 1 之间的随机数。\n\n例如，我们可以这样写：\n\n```\nlet randomNumber =\
    \ Math.random();\n```\n\n返回的数字有 16 位小数。\n\n## 将字符串转换为整数和小数\n\n将包含数字的字符串转换为整数或小数是我们经常需要做的事情。\n\
    \n我们可以使用 `parseInt` 方法将字符串转换为整数。\n\n使用 `parseFloat` 方法将字符串转换为小数。\n\n例如，我们可以这样写：\n\
    \n```\nlet currentAge = prompt(\"请输入你的年龄。\");\nlet age = parseInt(currentAge);\n\
    ```\n\n我们使用 `parseInt` 方法将输入的数字转换为整数。\n\n`prompt` 总是返回字符串，因此我们需要将其转换为整数。\n\n要将输入的文本转换为小数，可以使用\
    \ `parseFloat`：\n\n```\nlet currentAge = prompt(\"请输入你的年龄。\");\nlet age = parseFloat(currentAge);\n\
    ```\n\n## 字符串与数字的相互转换\n\n要将字符串转换为数字，可以使用全局函数 `Number`：\n\n```\nlet num = Number('123');\n\
    ```\n\n那么 `num` 就是 `123`。\n\n要将数字转换为字符串，可以使用 `toString` 方法：\n\n```\nlet num =\
    \ 1234;\nlet numberAsString = num.toString();\n```\n\n`numberAsString` 就是 `'1234'`。\n\
    \n## 添加和删除元素\n\n使用 JavaScript 可以轻松地添加和删除数组元素。\n\n要添加元素，只需将值赋给所需的数组索引。\n\n例如，我们可以这样写：\n\
    \n```\nlet animals = [];\nanimals[0] = \"狗\";\nanimals[1] = \"猫\";\nanimals[2]\
    \ = \"老鼠\";\n```\n\n我们通过创建变量并赋值为空数组来创建 `animals` 数组。\n\n然后为 `animals` 的指定索引赋值。\n\
    \n我们可以对任何索引执行此操作，索引不必连续或按顺序。\n\n要删除数组中的最后一个元素，可以调用 `pop` 方法：\n\n```\nanimals.pop()\n\
    ```\n\n另一种添加元素的方法是使用 `push` 方法：\n\n```\nanimals.push(\"鱼\", \"鸟\");\n```\n\n`push`\
    \ 将元素添加到数组末尾。\n\n要删除数组的第一个元素，可以使用 `shift`：\n\n```\nanimals.shift();\n```\n\n要在数组开头添加一个或多个元素，可以调用\
    \ `unshift`：\n\n```\nanimals.unshift(\"鱼\", \"鸟\");\n```\n\n`splice` 方法可以在数组中的任意位置插入一个或多个元素：\n\
    \n"
- fmt: "\n```\npets.splice(2, 2, \"pig\", \"duck\", \"emu\");\n```\n\nThe first argument\
    \ is the starting index to insert.  \nThe 2nd is number of items to remove.  \n\
    The subsequent arguments are the items we want to insert in place of the removed\
    \ items.\n\nThe `slice` method lets us copy one or more consecutive elements in\
    \ any position and put them in a new array.\n\nFor example, we can write:\n\n\
    ```\nlet pets = animals.slice(2, 4);\n```\n\nto copy the items from index 2 to\
    \ 3 from `animals` and return that array.  \nThe first argument is the starting\
    \ index copy. The 2nd is 1 after the ending index to copy.  \nThe 2nd index itself\
    \ isn’t included in the range.\n\n## for loops\n\nLoops are provided by JavaScript\
    \ so we can run code repeatedly.\n\nTo do this, we can use the `for` loop:\n\n\
    ```\nfor (let i = 0; i <= 10; i++) {\n  if (city === cleanestCities[i]) {\n  \
    \  console.log(\"It's one of the cleanest cities\");\n  }\n}\n```\n\nA `for` loop\
    \ is composed of the heading, which has the starting index, the condition to continue\
    \ running the loop, and a statement to update the index.  \nIn the loop body,\
    \ we can do what we want.\n\nIn the example above, we check if `city` is equal\
    \ to `cleanestCities[i]`.  \nAnd if it’s `true`, we console log a message.  \n\
    The loop index is used for accessing the array item and also to move the loop\
    \ towards the ending condition, which is `i <= 10`.  \nIf `i` is bigger than 10,\
    \ then the loop stops.\n\nWe can also set flags in `for` loops so that we can\
    \ record some information.\n\nFor example, we can write:\n\n```\nlet matchFound\
    \ = false;\nfor (let i = 0; i <= 10; i++) {\n  if (city === cleanestCities[i])\
    \ {\n    matchFound = true;\n    console.log(\"It's one of the cleanest cities\"\
    );\n  }\n}\n```\n\nWe set `matchFound` to `true` once we found a value from `cleanestCities`\
    \ that’s equal to `city`.\n\n## Math Expressions\n\nWe should eliminate ambiguity\
    \ with JavaScript math expressions.\n\nFor example, if we have:\n\n```\nlet totalCost\
    \ = 1 + 3 * 10;\n```\n\nthen readers may be confused about which operation comes\
    \ first.  \nJavaScript has precedence rules for operators. They generally follow\
    \ the same rules as normal math.  \nHowever, we can make everyone’s lives easier\
    \ by wrapping parentheses around expressions that have higher precedence.\n\n\
    For example, we can write:\n\n```\nlet totalCost = 1 + (3 * 10);\n```\n\nthen\
    \ we wrap the expressions around the multiplication.  \nNow we know the multiplication\
    \ operation comes first.  \nIf we move the parentheses, then the operations would\
    \ be done in a different order.\n\nFor instance, if we have:\n\n```\nlet totalCost\
    \ = (1 + 3) * 10;\n```\n\nthen the addition is done before the multiplication.\n\
    \n## Concatenating Strings\n\nStrings are text values and they can be combined\
    \ with concatenation.\n\nFor example, we can write:\n\n```\nalert(\"Thanks, \"\
    \ + userName + \"!\");\n```\n\nto combine the 3 expressions into 1 with the `+`\
    \ operator.  \nIf `userName` is `'james'`, then we have:\n\n```\n'Thanks, james!'\n\
    ```\n\nThe 3 parts are combined together and returned as one string.  \nWe can\
    \ concatenate strings with any other JavaScript expressions.  \nThey’ll be converted\
    \ to strings automatically so that they can be concatenated together.\n\nSo if\
    \ we have:\n\n```\nalert(\"2 plus 3 equals \" + 2 + 3);\n```\n\nThen we get `'2\
    \ plus 3 equals 23'`.  \nThis is because 2 and 3 are converted to strings before\
    \ they’re concatenated.\n\nA more convenient way to combine strings and other\
    \ expressions is to use template literals.\n\nFor example, we can write:\n\n```\n\
    alert(`2 plus 3 equals ${2 + 3}`);\n```\n\nWe replaced the quotes with the backticks.\
    \  \nThen we use the `${}` symbols to surround the JavaScript expressions to interpolate\
    \ the expressions.  \nThis way, we have `2 + 3` returning a number since they’re\
    \ concatenated with strings.  \nSo we get `'2 plus 3 equals 5'`.\n\n## Prompts\n\
    \nA prompt box lets us ask users for some information and provide a response field\
    \ for the answer.\n\nFor example, we can write:\n\n```\nlet name = prompt(\"Your\
    \ name?\", \"mary\");\n```\n\nWe call `prompt` with the question string as the\
    \ first argument.  \nThe 2nd argument is the default answer returned.  \nIf we\
    \ call that, the browser will show an alert box with an input box to let us enter\
    \ our answer.  \nThen when we click OK, then the response is returned if it’s\
    \ entered.  \nOtherwise, the default answer is returned.  \nIf we omit the default\
    \ answer in the 2nd argument and we entered nothing, then it returns `null`. \
    \ \n`prompt` is a global function, so `window.prompt` is the same as `prompt`.\
    \  \nBut we can just write `prompt`.\n\n## Variable Naming\n\nWe can’t have variable\
    \ names that start with a number, but we can have variables that have numbers\
    \ in the middle.\n\nFor example, we can write:\n\n```\nlet name1 = \"james\";\n\
    ```\n\nbut not:\n\n```\nlet 1name = \"james\";\n```\n\nThere are more rules to\
    \ JavaScript variable naming.  \nA variable name can’t have any spaces.  \nVariable\
    \ names can only have letters, numbers, dollar signs and underscores.  \nVariable\
    \ names can’t be a reserved JavaScript keyword, but they can contain them.  \n\
    Capital letters can be used, but we must be aware that variable names are case\
    \ sensitive.  \nSo `name` isn’t the same as `Name`.  \nJavaScript variable names\
    \ are usually camelCase. They let us form variables with multiple words and we\
    \ can read them all easily.  \nSo we can write variable names like `firstName`\
    \ to make the 2 words in the variable name clear.\n\n## Math Expressions\n\nMost\
    \ JavaScript programs will do math. Therefore, JavaScript comes with operators\
    \ for various common math operations.\n\nFor example, we can add with the `+`\
    \ operator:\n\n```\nlet num = 2 + 2;\n```\n\nTo subtract, we can use the `-` operator:\n\
    \n```\nlet num = 2 - 2;\n```\n\nMultiplication is done with the `*` operator:\n\
    \n```\nlet num = 2 * 2;\n```\n\nAnd division is done with the `/` operator:\n\n\
    ```\nlet num = 2 / 2;\n```\n\nThere’s also the `%` modulus operator to find the\
    \ remainder of the left operand divided by the right one.\n\nFor example, we can\
    \ write:\n\n```\nlet num = 2 % 2;\n```\n\nWe get 0 because 2 is evenly divisible\
    \ by itself.\n\nThe exponentiation operator is denoted by `**`. For example, we\
    \ can use it by writing:\n\n```\nlet num = 2 ** 2;\n```\n\nThen we raise 2 to\
    \ the 2nd power.\n\nThe `++` operator adds the variable’s value by 1 and assign\
    \ it to the variable.\n\nFor example:\n\n```\nnum++;\n```\n\nis the same as:\n\
    \n```\nnum = num + 1;\n```\n\nWe can use the expressions with the assignment operator,\
    \ but we may get results that we don’t expect.\n\nFor example, if we have:\n\n\
    ```\nlet num = 1;\nlet newNum = num++;\n```\n\nThen `newNum` is 1 since the original\
    \ value of `num` is returned.\n\nOn the other hand, if we have:\n\n```\nlet num\
    \ = 1;\nlet newNum = ++num;\n```\n\nThen `newNum` is 2 since the latest value\
    \ of `num` is returned if `++` is before the `num`.\n\nLikewise, JavaScript has\
    \ the `--` operator to subtract a variable by 1 and assign the latest value to\
    \ the variable.\n\nFor example, we can write:\n\n```\nlet num = 1;\nlet newNum\
    \ = num--;\n```\n\nAnd we get 1 for `newNum` and:\n\n```\nlet num = 1;\nlet newNum\
    \ = --num;\n```\n\nthen we get 0 for `newNum`.  \nHow the values are returned\
    \ work the same way as `++`.\n\n## Controlling the Length of Decimals\n\nWe can\
    \ control the length of decimals by using the `toFixed` method.\n\nFor example,\
    \ if we have:\n\n```\nlet total = (8.8888).toFixed(2);\n```\n\nThen `total` is\
    \ `'8.89'`. `toFixed` takes the number of digits to round to and returns a string\
    \ with the rounded number.  \nIf the decimal ends with a 5, it is usually rounded\
    \ up.  \nBut some browsers may round down.\n\n## Get the Current Date and Time\n\
    \nTo get the current date and time, we can create a new `Date` instance with `new\
    \ Date()`.  \nThen we can convert the `Date` instance to a string by writing:\n\
    \n```\nlet now = new Date();\nlet dateString = now.toString();\n```\n\nTo get\
    \ the day of the week, we call the `getDay` method:\n\n```\nlet now = new Date();\n\
    let day = now.getDay();\n```\n\nIt returns a number from 0 to 6, with 0 being\
    \ Sunday, and 6 being Saturday.\n\nIf we want to show a more human-readable date,\
    \ we can write:\n"
