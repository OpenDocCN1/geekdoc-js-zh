  trans: "\n\n`callbacks.fireWith()` 方法允许我们使用给定的上下文和参数来调用回调函数。\n\n例如，如果我们有以下代码：\n\n\
    ```\nconst log = function(value1, value2) {\n  console.log(this, value1, value2);\n\
    };\n\nconst callbacks = $.Callbacks();\ncallbacks.add(log);\ncallbacks.fireWith(window,\
    \ [\"foo\", \"bar\"]);\n```\n\n那么 `this` 就是 `window`，`value1` 是 `foo`，`value2`\
    \ 是 `bar`。\n\n## `callbacks.has()`\n\n`callbacks.has()` 方法允许我们检查回调列表中是否已添加任何回调。\n\
    \n例如，我们可以这样写：\n\n```\nconst log = function(value1, value2) {\n  console.log(this,\
    \ value1, value2);\n};\n\nconst callbacks = $.Callbacks();\ncallbacks.add(log);\n\
    console.log(callbacks.has(log));\n```\n\n控制台应输出 `true`，因为我们已通过 `add` 添加了它。\n\n\
    ## `callbacks.lock()`\n\n`callbacks.lock()` 方法将回调列表锁定在当前状态。\n\n例如，我们可以这样使用它：\n\
    \n```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\n\
    const callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\"\
    );\ncallbacks.lock();\ncallbacks.fire(\"world\");\n```\n\n我们调用 `callbacks.lock`\
    \ 方法来阻止任何回调被调用。\n\n因此，我们只会看到：\n\n```\nfoo: hello\n```\n\n被输出。\n\n## `callbacks.locked()`\n\
    \n我们可以使用 `callbacks.locked()` 方法来检查回调列表是否已被锁定。\n\n例如，如果我们这样写：\n\n```\nconst foo\
    \ = function(value) {\n  console.log(`foo: ${value}`);\n};\n\nconst callbacks\
    \ = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\");\ncallbacks.lock();\n\
    console.log(callbacks.locked());\n```\n\n那么最后一个控制台输出应为 `true`，因为我们调用了 `lock` 来锁定回调列表。\n\
    \n## `callbacks.remove()`\n\n我们可以使用 `callback.remove` 方法移除一个回调。\n\n例如，我们可以这样写：\n\
    \n```\nconst foo = function(value) {\n  console.log(`foo: ${value}`);\n};\n\n\
    const callbacks = $.Callbacks();\ncallbacks.add(foo);\ncallbacks.fire(\"hello\"\
    );\ncallbacks.remove(foo);\ncallbacks.fire(\"world\");\n```\n\n我们在 `foo` 上调用了\
    \ `remove`，以从回调列表中移除 `foo`。\n\n因此，第二次 `fire` 回调不会调用 `foo`。\n\n## `.change()`\n\
    \n`.change()` 方法将一个事件处理程序绑定到 `change` JavaScript 事件上。\n\n它也可以用于触发元素上的 `change`\
    \ 事件。\n\n例如，如果我们有以下 HTML：\n\n```\n<form>\n  <input class=\"target\" type=\"text\"\
    \ value=\"Field 1\">\n  <select class=\"target\">\n    <option value=\"option1\"\
    \ selected=\"selected\">Option 1</option>\n    <option value=\"option2\">Option\
    \ 2</option>\n  </select>\n</form>\n```\n\n那么我们可以通过以下代码监听类为 `target` 的元素上触发的 `change`\
    \ 事件：\n\n```\n$(\".target\").change(function() {\n  alert(\"Handler for .change()\
    \ called.\");\n});\n```\n\n我们也可以触发元素上的 change 事件。\n\n例如，如果我们有以下 HTML：\n\n```\n\
    <form>\n  <input class=\"target\" type=\"text\" value=\"Field 1\">\n  <select\
    \ class=\"target\">\n    <option value=\"option1\" selected=\"selected\">Option\
    \ 1</option>\n    <option value=\"option2\">Option 2</option>\n  </select>\n</form>\n\
    <div id=\"other\">\n  click me\n</div>\n```\n\n那么我们可以为 ID 为 `other` 的 div 添加一个点击监听。\n\
    \n当我们点击该 div 时，可以通过以下代码触发所有类为 `target` 的元素上的 `change` 事件：\n\n```\n$(\".target\"\
    ).change(function() {\n  alert(\"Handler for .change() called.\");\n});\n\n$(\"\
    #other\").click(function() {\n  $(\".target\").change();\n});\n```\n\n现在，当我们点击“click\
    \ me”按钮时，每个类为 `target` 的元素都会弹出警告框。\n\n## `:checkbox` 选择器\n\n`:checkbox` 选择器允许我们选择所有类型为\
