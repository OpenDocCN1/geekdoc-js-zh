    \nThen we call `$.map` to map the array entries into new values.\n\nSo `mapped`\
    \ is `[\"foofoo\", \"barbar\"]`.\n\n## `jQuery.Callbacks()`\n\nThe `jQuery.Callbacks()`\
    \ method lets us create a callback list to manage callbacks.\n\nFor example, we\
