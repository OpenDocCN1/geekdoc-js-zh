    \ called.\");\n});\n$(\"#other\").click(function() {\n  $(\"#target\").mouseout();\n\
    });\n```\n\n## `.mouseover()`\n\nThe `.mouseover()` method lets us add an event\
    \ listener for the `mouseover` event or trigger it.\n\nFor example, if we have:\n\
    \n```\n<div id=\"target\">\n  Click here\n</div>\n<div id=\"other\">\n  Trigger\
    \ the handler\n</div>\n```\n\nThen we can listen to the `mouswdown` event on the\
    \ div with ID `target` by writing:\n\n```\n$(\"#target\").mouseover(function()\
    \ {\n  console.log(\"Handler for .mouseover() called.\");\n});\n```\n\nAlso, we\
    \ can trigger then `mousedown` event on the div with ID `target` when we click\
    \ on the div with ID `other` by writing:\n\n```\n$(\"#target\").mouseover(function()\
    \ {\n  console.log(\"Handler for .mouseover() called.\");\n});\n$(\"#other\").click(function()\
    \ {\n  $(\"#target\").mouseover();\n});\n```\n\n## `.mouseup()`\n\nThe `.mouseup()`\
    \ method lets us add an event listener for the `mouseup` event or trigger it.\n\
    \nFor example, if we have:\n\n```\n<div id=\"target\">\n  Click here\n</div>\n\
    <div id=\"other\">\n  Trigger the handler\n</div>\n```\n\nThen we can listen to\
    \ the `mouswdown` event on the div with ID `target` by writing:\n\n```\n$(\"#target\"\
    ).mouseup(function() {\n  console.log(\"Handler for .mouseup() called.\");\n});\n\
    ```\n\nAlso, we can trigger then `mouseup` event on the div with ID `target` when\
    \ we click on the div with ID `other` by writing:\n\n```\n$(\"#target\").mouseup(function()\
    \ {\n  console.log(\"Handler for .mouseup() called.\");\n});\n$(\"#other\").click(function()\
    \ {\n  $(\"#target\").mouseup();\n});\n```\n\n## Multiple Attribute Selector `[name=”value”][name2=”value2″]`\n\
    \nWe can select items with multiple attributes with the multiple attribute selector.\n\
    \nFor example, if we have:\n\n```\n<input id=\"man-news\" name=\"man-news\">\n\
    <input name=\"milkman\">\n<input id=\"letterman\" name=\"new-letterman\">\n<input\
    \ name=\"newmilk\">\n```\n\nThen we can get the input with ID `letterman` and\
    \ `name` value `new-letterman` by writing:\n\n```\n$(\"input[id][name$='man']\"\
    ).val(\"only this one\");\n```\n\nAfter we got the element, we call `val` to set\
    \ the input value.\n\n## Multiple Selector (`“selector1, selector2, selectorN”`)\n\
    \nThe multiple selector selector lets us get elements that match any of the given\
    \ selectors.\n\nFor example, if we have:\n\n```\n<div>div</div>\n<p class=\"myClass\"\
    >p class=\"myClass\"</p>\n<p class=\"notMyClass\">p class=\"notMyClass\"</p>\n\
    <span>span</span>\n```\n\nThen we can add a red border to the `div`, `span`, and\
    \ the `p` element with class `myClass` by writing:\n\n```\n$(\"div, span, p.myClass\"\
    ).css(\"border\", \"3px solid red\");\n```\n\n## `.next()`\n\nThe `.next()` method\
    \ get the element sibling element that immediately follows a given element.\n\n\
    For example, if we have:\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item\
    \ 2</li>\n  <li class=\"third-item\">list item 3</li>\n  <li>list item 4</li>\n\
    \  <li>list item 5</li>\n</ul>\n```\n\nThen we get the `li` that’s immediately\
    \ next to the `li` with class `third-item` by writing:\n\n```\n$(\"li.third-item\"\
    ).next().css(\"background-color\", \"red\");\n```\n\nThen we call `css` to add\
    \ a red background color to it.\n\n## Next Adjacent Selector (`“prev + next”`)\n\
    \nWe can use the next adjacent selector to add the adjacent selector to get the\
    \ sibling element next to the given element.\n\nFor example, if we have:\n\n```\n\
    <form>\n  <label for=\"name\">Name:</label>\n  <input name=\"name\" id=\"name\"\
    >\n  <fieldset>\n    <label for=\"newsletter\">Newsletter:</label>\n    <input\
    \ name=\"newsletter\" id=\"newsletter\">\n  </fieldset>\n</form>\n<input name=\"\
    none\">\n```\n\nThen we can get the input next to the label and add some styles\
    \ and set their value by writing:\n\n```\n$(\"label + input\").css(\"color\",\
    \ \"blue\").val(\"Labeled!\");\n```\n\n## Next Siblings Selector (`“prev ~ siblings”`)\n\
    \nThe next sibling selector lets us select all sibling elements that follow the\
    \ prev element.\n\nThe siblings must have the same parent.\n\nFor example, if\
    \ we have:\n\n```\n<div>div (doesn't match since before #prev)</div>\n<span id=\"\
    prev\">span#prev</span>\n<div>div sibling</div>\n<div>div sibling <div id=\"small\"\
    >div niece</div>\n</div>\n<span>span sibling (not div)</span>\n<div>div sibling</div>\n\
    ```\n\nThen we can get all the divs that comes with the span with ID `prev` by\
    \ writing:\n\n```\n$(\"#prev ~ div\").css(\"border\", \"3px groove blue\");\n\
    ```\n\nWe call `css` to add a blue border to the matching elements.\n\n## `.nextAll()`\n\
    \nThe `.nextAll()` method gets all the following siblings of each element in the\
    \ set of matched elements.\n\nFor example, if we have:\n\n```\n<ul>\n  <li>list\
    \ item 1</li>\n  <li>list item 2</li>\n  <li class=\"third-item\">list item 3</li>\n\
    \  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\nThen we get all\
    \ the `li`s that comes after the `li` with the class `third-item` and add a red\
    \ background to them by writing:\n\n```\n$(\"li.third-item\").nextAll().css(\"\
    background-color\", \"red\");\n```\n\n## `.nextUntil()`\n\nThe `.nextUntil()`\
    \ method gets all the following siblings of each element up to but not including\
    \ the element matched by a selector, DOM node, or jQuery object passed in.\n\n\
    For example, if we have:\n\n```\n<dl>\n  <dt id=\"term-1\">term 1</dt>\n  <dd>definition\
    \ 1-a</dd>\n  <dd>definition 1-b</dd>\n  <dd>definition 1-c</dd>\n  <dd>definition\
    \ 1-d</dd>\n  <dt id=\"term-2\">term 2</dt>\n  <dd>definition 2-a</dd>\n  <dd>definition\
    \ 2-b</dd>\n  <dd>definition 2-c</dd>\n  <dt id=\"term-3\">term 3</dt>\n  <dd>definition\
    \ 3-a</dd>\n  <dd>definition 3-b</dd>\n</dl>\n```\n\nThen we get the `dt` element\
    \ with ID `term-2` up to the `dt` with ID `term-3` by writing:\n\n```\n$(\"#term-2\"\
    )\n  .nextUntil(\"dt\")\n  .css(\"background-color\", \"red\");\n```\n\nThen we\
    \ add a red background to it.\n\n## `.not()`\n\nWe call `not` to remove elements\
    \ from a set of matched elements.\n\nFor example, if we have:\n\n```\n<ul>\n \
    \ <li>list item 1</li>\n  <li>list item 2</li>\n  <li>list item 3</li>\n  <li>list\
    \ item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\nThen we get all the `li`s\
    \ in odd-numbered positions by writing:\n\n```\n$(\"li\").not(\":nth-child(2n)\"\
    ).css(\"background-color\", \"red\");\n```\n\nThen we call `css` to add a red\
    \ background to it.\n\n## `jQuery.ready`\n\nThe `jQuery.ready` is a thenable object\
    \ that resolves when the document is ready.\n\nFor example, we can write:\n\n\
    ```\n(async () => {\n  const data = await $.when(\n    $.getJSON(\"https://jsonplaceholder.typicode.com/posts/1\"\
    ),\n    $.ready\n  )\n  console.log(data);\n})()\n```\n\nWe call `getJSON` to\
    \ get JSON data.\n\nThen we call `$.ready` to wait for the `document` to be ready.\n\
    \nThen we get the `data` after both operations are done.\n\n## `jQuery.readyException()`\n\
    \nThe `jQuery.readyException` method handles errors that are thrown synchronously\
    \ in functions wrapped in jQuery.\n\nFor example, we can write:\n\n```\njQuery.readyException\
    \ = function(error) {\n  console.error(error);\n};\n```\n\nto pass the `error`\
    \ object into the `console.error` method and log it.\n\n## `jQuery.removeData()`\n\
    \nThe `jQuery.removeData()` method lets us remove data from an element.\n\nFor\
    \ example, if we have:\n\n```\n<div></div>\n```\n\nThen we can use `removeData`\
