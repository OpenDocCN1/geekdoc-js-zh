  trans: "\n我们使用 XML 字符串调用 `parseXML`。\n\n然后将其放入 `$` 函数中，以便调用 `find` 来查找我们想要的元素。\n\
    \n接着，我们可以通过 `text` 方法获取匹配元素的文本内容。\n\n## `jQuery.post()`\n\n`jQuery.post()` 方法允许我们向指定\
    \ URL 发起 POST 请求。\n\n例如，我们可以编写：\n\n```\nconst jqxhr = $.post(\"https://jsonplaceholder.typicode.com/posts\"\
    , {\n\n    title: \"title\",\n\n    body: \"body\"\n\n  }, function() {\n\n  \
    \  console.log(\"success\");\n\n  }, \"json\")\n\n  .done(function() {\n\n   \
    \ console.log(\"second success\");\n\n  })\n\n  .fail(function() {\n\n    console.log(\"\
    error\");\n\n  })\n\n  .always(function() {\n\n    console.log(\"finished\");\n\
    \n  });\n\njqxhr.always(function() {\n\n  console.log(\"second finished\");\n\n\
    });\n```\n\n来发起一个 POST 请求。\n\n第二个参数是我们要随请求发送的表单数据键值对。\n\n`done` 回调在请求成功时被调用。\n\
    \n`fail` 回调在请求失败时被调用。\n\n`always` 回调在请求完成时被调用，无论结果如何。\n\n## `jQuery.queue()`\n\
    \n`jQuery.queue()` 方法用于显示或操作要在匹配元素上运行的函数队列。\n\n例如，如果我们有以下 HTML：\n\n```\n<div></div>\n\
    ```\n\n以及 CSS：\n\n```\ndiv {\n\n  margin: 3px;\n\n  width: 40px;\n\n  height:\
    \ 40px;\n\n  position: absolute;\n\n  left: 0px;\n\n  top: 30px;\n\n  background:\
    \ green;\n\n  display: none;\n\n}\n\ndiv.newcolor {\n\n  background: blue;\n\n\
    }\n\nspan {\n\n  color: red;\n\n}\n```\n\n那么我们可以通过编写以下代码来对 div 进行动画：\n\n```\n\
    $(\"div\")\n\n  .show(\"slow\")\n\n  .animate({\n\n    left: \"+=200\"\n\n  },\
    \ 2000)\n\n  .slideToggle(1000)\n\n  .slideToggle(\"fast\")\n\n  .animate({\n\n\
    \    left: \"-=200\"\n\n  }, 1500)\n\n  .hide(\"slow\")\n\n  .show(1200)\n\nconsole.log(jQuery.queue($(\"\
    div\")[0], \"fx\"))\n```\n\n我们获取 div 并将其作为 `jQuery.queue` 的参数，以检查队列中的项目。\n\n##\
    \ `:not()` 选择器\n\n`:not` 选择器选取所有不匹配给定选择器的元素。\n\n例如，如果我们有以下内容：\n\n```\n<div>\n\n\
    \  <input type=\"checkbox\" name=\"a\">\n\n  <span>Mary</span>\n\n</div>\n\n<div>\n\
    \n  <input type=\"checkbox\" name=\"b\">\n\n  <span>lcm</span>\n\n</div>\n\n<div>\n\
    \n  <input type=\"checkbox\" name=\"c\" checked=\"checked\">\n\n  <span>Peter</span>\n\
    \n</div>\n```\n\n那么我们可以通过编写以下代码，为所有未选中的复选框添加黄色背景：\n\n```\n$(\"input:not(:checked)\
    \ + span\").css(\"background-color\", \"yellow\");\n```\n\n## `:nth-child()` 选择器\n\
    \n`:nth-child()` 选择器允许我们选取所有作为其父元素第 n 个子元素的元素。\n\n例如，如果我们有以下内容：\n\n```\n<div>\n\
    \n  <ul>\n\n    <li>John</li>\n\n    <li>Karl</li>\n\n    <li>Brandon</li>\n\n\
    \  </ul>\n\n</div>\n\n<div>\n\n  <ul>\n\n    <li>Sam</li>\n\n  </ul>\n\n</div>\n\
    \n<div>\n\n  <ul>\n\n    <li>John</li>\n\n    <li>Jane</li>\n\n    <li>Ralph</li>\n\
    \n    <li>David</li>\n\n  </ul>\n\n</div>\n```\n\n那么我们可以通过编写以下代码，为每个 `ul` 中的第二个\
    \ `li` 添加一个 `span`：\n\n```\n$(\"ul li:nth-child(2)\").append(\"<span> - 2nd!</span>\"\
    );\n```\n\n## `:nth-last-child()` 选择器\n\n`:nth-last-child` 选择器允许我们选取所有作为其父元素倒数第\
    \ n 个子元素的元素。\n\n例如，如果我们有以下内容：\n\n```\n<div>\n\n  <ul>\n\n    <li>John</li>\n\n\
    \    <li>Karl</li>\n\n    <li>Brandon</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n \
    \ <ul>\n\n    <li>Sam</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n  <ul>\n\n    <li>John</li>\n\
    \n    <li>Jane</li>\n\n    <li>Ralph</li>\n\n    <li>David</li>\n\n  </ul>\n\n\
    </div>\n```\n\n那么我们可以获取每个 `ul` 中倒数第二个 `li`，并为其添加一个子 `span`，通过编写：\n\n```\n$(\"\
    ul li:nth-last-child(2)\").append(\"<span> - 2nd to last!</span>\");\n```\n\n\
    ## `:nth-last-of-type()` 选择器\n\n`:nth-last-of-type` 选择器允许我们获取指定类型的最后一个元素。\n\n\
    例如，如果我们有以下内容：\n\n```\n<div>\n\n  <ul>\n\n    <li>John</li>\n\n    <li>Karl</li>\n\
    \n    <li>Brandon</li>\n\n  </ul>\n\n</div>\n\n<div>\n\n  <ul>\n\n    <li>Sam</li>\n\
    \n  </ul>\n\n</div>\n\n<div>\n\n  <ul>\n\n    <li>John</li>\n\n    <li>Jane</li>\n\
    \n    <li>Ralph</li>\n\n    <li>David</li>\n\n  </ul>\n\n</div>\n```\n\n那么我们可以获取\
    \ `ul` 中倒数第二个 `li`，并在其中添加一个 `span`，通过编写：\n\n```\n$(\"ul li:nth-last-of-type(2)\"\
    ).append(\"<span> - 2nd to last!</span>\");\n```\n\n## `:nth-of-type()` 选择器\n\n\
    `:nth-of-type` 选择器选取所有作为其父元素第 n 个子元素且与同元素名称的兄弟元素相关的元素。\n\n例如，如果我们有以下内容：\n\n```\n\
    <div>\n\n  <span>John</span>,\n\n  <b>Kim</b>,\n\n  <span>Adam</span>,\n\n  <b>Rafael</b>,\n\
    \n  <span>Oleg</span>\n\n</div>\n\n<div>\n\n  <b>Dave</b>,\n\n  <span>Ann</span>\n\
    \n</div>\n\n<div>\n\n  <i><span>Maurice</span></i>,\n\n  <span>Richard</span>,\n\
    \n  <span>Ralph</span>,\n\n  <span>Jason</span>\n\n</div>\n```\n\n那么我们可以获取第二个兄弟\
    \ `span`，并向其中添加另一个 `span`，通过编写：\n\n```\n$(\"span:nth-of-type(2)\")\n\n  .append(\"\
    <span> is 2nd sibling span</span>\")\n\n  .addClass(\"nth\");\n```\n\n## `.odd()`\n\
    \n我们可以使用 `odd` 选择器将匹配元素集缩减为其中的奇数元素。\n\n例如，如果我们有以下内容：\n\n```\n<ul>\n\n  <li>list\
    \ item 1</li>\n\n  <li>list item 2</li>\n\n  <li>list item 3</li>\n\n  <li>list\
    \ item 4</li>\n\n  <li>list item 5</li>\n\n</ul>\n```\n\n那么我们可以通过编写以下代码，选择索引为奇数的\
    \ `li`：\n\n```\n$(\"li\").odd().css(\"background-color\", \"red\");\n```\n\n由于索引从\
    \ 0 开始，我们为第 2 个和第 4 个 `li` 添加了红色背景。\n\n## `.off()`\n\n`.off()` 方法用于移除事件处理程序。\n\
    \n例如，如果我们有以下内容：\n\n```\n<button id=\"theone\">Does nothing...</button>\n\n<button\
    \ id=\"bind\">Add Click</button>\n\n<button id=\"unbind\">Remove Click</button>\n\
    \n<div style=\"display:none;\">Click!</div>\n```\n\n那么我们可以通过编写以下代码，使用 `off` 方法移除\
    \ `click` 处理程序：\n\n```\nfunction flash() {\n\n  $(\"div\").show().fadeOut(\"slow\"\
    );\n\n}\n\n$(\"#bind\").click(function() {\n\n  $(\"body\")\n\n    .on(\"click\"\
    , \"#theone\", flash)\n\n    .find(\"#theone\")\n\n    .text(\"Can Click!\");\n\
    \n});\n\n$(\"#unbind\").click(function() {\n\n  $(\"body\")\n\n    .off(\"click\"\
    , \"#theone\", flash)\n\n    .find(\"#theone\")\n\n    .text(\"Does nothing...\"\
    );\n\n});\n```\n\nID 为 `unbind` 的按钮的点击监听器使用了 `off` 方法，将 `flash` 函数作为 body 的 `click`\
    \ 处理程序移除。\n\n## `.offset()`\n\n`.offset()` 方法获取匹配元素集中第一个元素相对于文档的当前坐标。\n\n例如，如果我们有以下内容：\n\
    \n```\n<p>Hello</p>\n\n<p>2nd Paragraph</p>\n```\n\n那么我们可以通过编写以下代码，获取最后一个 `p`\
    \ 元素的偏移量：\n\n```\nconst p = $(\"p\").last();\n\nconst offset = p.offset();\n\n\
    console.log(offset);\n```\n\n然后我们得到：\n\n```\n{\n\n  \"top\": 50,\n\n  \"left\"\
    : 8\n\n}\n```\n\n作为 `offset` 的值。\n\n## `.offsetParent()`\n\n`.offsetParent()`\
    \ 方法获取最近的已定位祖先元素。\n\n例如，如果我们有以下内容：\n\n```\n<ul class=\"level-1\">\n\n  <li class=\"\
    item-i\">I</li>\n\n  <li class=\"item-ii\" style=\"position: relative;\">II\n\n\
    \    <ul class=\"level-2\">\n\n      <li class=\"item-a\">A</li>\n\n      <li\
    \ class=\"item-b\">B\n\n        <ul class=\"level-3\">\n\n          <li class=\"\
    item-1\">1</li>\n\n          <li class=\"item-2\">2</li>\n\n          <li class=\"\
    item-3\">3</li>\n\n        </ul>\n\n      </li>\n\n      <li class=\"item-c\"\
    >C</li>\n\n    </ul>\n\n  </li>\n\n  <li class=\"item-iii\">III</li>\n\n</ul>\n\
    ```\n\n那么我们可以通过编写以下代码，获取类为 `item-a` 的 `li` 的父元素，并为其添加背景：\n\n```\n$(\"li.item-a\"\
    ).offsetParent().css(\"background-color\", \"red\");\n```\n\n## `.on()`\n\n`.on()`\
    \ 方法为选定的元素附加一个或多个事件的事件处理函数。\n\n例如，如果我们有以下内容：\n\n```\n<p>Has an attached custom\
    \ event.</p>\n\n<button>Trigger custom event</button>\n\n<span style=\"display:none;\"\
    ></span>\n```\n\n那么我们可以通过编写以下代码，在点击按钮时触发一个自定义事件：\n\n```\n$(\"p\").on(\"myCustomEvent\"\
    , function(event, myName) {\n\n  $(this).text(`${myName}, hi there`);\n\n  $(\"\
    span\")\n\n    .stop()\n\n    .css(\"opacity\", 1)\n\n    .text(`myName = ${myName}`)\n\
    \n    .fadeIn(30)\n\n    .fadeOut(1000);\n\n});\n\n$(\"button\").click(function()\
    \ {\n\n  $(\"p\").trigger(\"myCustomEvent\", [\"John\"]);\n\n});\n```\n\n"
- fmt: "\nWe call `trigger` with the event name as the first argument and the data\
    \ we want to send with the event in an array.\n\nTo listen to the `myCustomEvent`\
    \ event, we call `on` with the same event name as the first argument.\n\nThe 2nd\
    \ argument is a callback that runs when the event is triggered.\n\n`myName` is\
    \ `'John'` so we see that added to the `p` element.\n\n## `.one()`\n\nThe `.one()`\
    \ method attaches a handler to an event for the elements.\n\nThe handler is run\
    \ at most once per element per event type.\n\nFor example, if we have:\n\n```\n\
    <p id='foo'>foo</p>\n```\n\nThen we write:\n\n```\n$(\"#foo\").one(\"click mouseover\"\
    , function(event) {\n  alert(\"The \" + event.type + \" event happened!\");\n\
    });\n```\n\nto add a listener for the `click` and `mouseover` events on the `p`\
    \ element wiuth ID `foo`with the `one` method.\n\n## `:only-child` Selector\n\n\
    The `:only-child` selector selects all elements that are the only child of their\
    \ parent.\n\nFor example, if we have:\n\n```\n<div>\n  <button>Sibling</button>\n\
    \  <button>Sibling</button>\n</div>\n<div>\n  <button>Sibling</button>\n</div>\n\
    <div>\n  None\n</div>\n<div>\n  <button>Sibling</button>\n  <button>Sibling</button>\n\
    \  <button>Sibling</button>\n</div>\n<div>\n  <button>Sibling</button>\n</div>\n\
    ```\n\nThen we add a border and change the text of the buttons that are the only\
    \ in the div by writing:\n\n```\n$(\"div button:only-child\").text(\"Alone\").css(\"\
    border\", \"2px blue solid\");\n```\n\nSo the 2nd and last div will have the text\
    \ changed and the border added.\n\n## `:only-of-type` Selector\n\nWe can use the\
    \ `:only-of-type` selector to select all elements that have no siblings with the\
    \ same element name.\n\nFor example, if we have:\n\n```\n<div>\n  <button>Sibling</button>\n\
    \  <button>Sibling</button>\n</div>\n<div>\n  <button>Sibling</button>\n</div>\n\
    <div>\n  None\n</div>\n<div>\n  <button>Sibling</button>\n  <button>Sibling</button>\n\
    \  <button>Sibling</button>\n</div>\n<div>\n  <button>Sibling</button>\n</div>\n\
    ```\n\nThen we can get buttons that are the only child in the div by writing:\n\
    \n```\n$(\"button:only-of-type\").text(\"Alone\").css(\"border\", \"2px blue solid\"\
    );\n```\n\nThen we change their text and add a border to them.\n\n## `.outerHeight()`\n\
    \nThe `.outerHeight()` method lets us get the computed outer height, which includes\
    \ the padding, border, and optionally margin, for the first element in the set\
    \ of matched elements.\n\nIt can also be used to set the outer height of every\
    \ matched element.\n\nFor example, if we have:\n\n```\n<p>Hello</p>\n```\n\nThen\
    \ we get the outer height with the margin by writing:\n\n```\nconst p = $(\"p\"\
    ).first();\nconsole.log(p.outerHeight(true));\n```\n\n`true` means we include\
    \ the margin.\n\nIf we have:\n\n```\n<div>d</div>\n<div>d</div>\n<div>d</div>\n\
    <div>d</div>\n<div>d</div>\n```\n\nThen we can set the outer height of the div\
    \ when we click it by writing:\n\n```\nconst modHeight = 60;\n$(\"div\").one(\"\
    click\", function() {\n  $(this).outerHeight(modHeight);\n});\n```\n\n## `.outerWidth()`\n\
    \nThe `.outerWidth()` method gets the current computed outer width, including\
    \ the padding, border, and optionally the margin, for the first element of the\
    \ set of matched elements.\n\nIt can also be used to set the outer width of all\
    \ matched elements.\n\nIt can also be used to set the outer height of every matched\
    \ element.\n\nFor example, if we have:\n\n```\n<p>Hello</p>\n```\n\nThen we get\
    \ the outer height with the margin by writing:\n\n```\nconst p = $(\"p\").first();\n\
    console.log(p.outerWidth(true));\n```\n\n`true` means we include the margin.\n\
    \nIf we have the following HTML:\n\n```\n<div>d</div>\n<div>d</div>\n<div>d</div>\n\
    <div>d</div>\n<div>d</div>\n```\n\nand CSS:\n\n```\n.mod {\n  background: blue;\n\
    \  cursor: default;\n}\n```\n\nThen we can set the outer height of the div when\
    \ we click it by writing:\n\n```\nconst modHeight = 60;\n$(\"div\").one(\"click\"\
    , function() {\n  $(this).outerWidth(modHeight).addClass(\"mod\");;\n});\n```\n\
    \nWe call `addClass` to add the `mod` class with a blue background.\n\n## `.parent()`\n\
    \nThe `.parent()` method lets us get the parent element of the given element.\n\
    \nFor example, if we have:\n\n```\n<ul class=\"level-1\">\n  <li class=\"item-i\"\
    >I</li>\n  <li class=\"item-ii\">II\n    <ul class=\"level-2\">\n      <li class=\"\
    item-a\">A</li>\n      <li class=\"item-b\">B\n        <ul class=\"level-3\">\n\
    \          <li class=\"item-1\">1</li>\n          <li class=\"item-2\">2</li>\n\
    \          <li class=\"item-3\">3</li>\n        </ul>\n      </li>\n      <li\
    \ class=\"item-c\">C</li>\n    </ul>\n  </li>\n  <li class=\"item-iii\">III</li>\n\
    </ul>\n```\n\nThen the `li` with the `item-a` class’s parent and add a background\
    \ to it by writing:\n\n```\n$(\"li.item-a\").parent().css(\"background-color\"\
    , \"red\");\n```\n\n## `:parent` Selector\n\nThe `:parent` selector lets us get\
    \ the parent of a given element.\n\nFor example, if we have:\n\n```\n<table border=\"\
    1\">\n  <tr>\n    <td>Value 1</td>\n    <td></td>\n  </tr>\n  <tr>\n    <td>Value\
    \ 2</td>\n    <td></td>\n  </tr>\n</table>\n```\n\nThen we can fade the `tr` by\
    \ writing:\n\n```\n$(\"td:parent\").fadeTo(1500, 0.3);\n```\n\n## `.prev()`\n\n\
    We call the `.prev()` method to get the immediately preceding sibling of each\
    \ element in the set of matched elements.\n\nIf a selector is provided, it gets\
    \ the precious siblings only if it matches that selector.\n\nFor example, if we\
    \ have:\n\n```\n<ul>\n  <li>list item 1</li>\n  <li>list item 2</li>\n  <li class=\"\
    third-item\">list item 3</li>\n  <li>list item 4</li>\n  <li>list item 5</li>\n\
    </ul>\n```\n\nThen we get the `li` that’s immediately before the `li` with the\
    \ class `third-item` by writing:\n\n```\n$(\"li.third-item\").prev().css(\"background-color\"\
    , \"red\");\n```\n\nThen we add a red background to it.\n\n## `.prevAll()`\n\n\
    The `.prevAll()` method gets all preceding siblings of each element in the set\
    \ of matched elements.\n\nFor example, if we have:\n\n```\n<ul>\n  <li>list item\
    \ 1</li>\n  <li>list item 2</li>\n  <li class=\"third-item\">list item 3</li>\n\
    \  <li>list item 4</li>\n  <li>list item 5</li>\n</ul>\n```\n\nThen we get all\
    \ the preceding siblings of the `li` that has the class `third-item` and add a\
    \ background to them by writing:\n\n```\n$(\"li.third-item\").prevAll().css(\"\
    background-color\", \"red\");\n```\n\n## `.prevUntil()`\n\nThe `.prevUntil()`\
    \ gets all preceding siblings of each element up to but not including the element\
    \ matched by the selector, DOM node, or jQuery object.\n\nFor example, if we have:\n\
    \n```\n<dl>\n  <dt id=\"term-1\">term 1</dt>\n  <dd>definition 1-a</dd>\n  <dd>definition\
    \ 1-b</dd>\n  <dd>definition 1-c</dd>\n  <dd>definition 1-d</dd>\n  <dt id=\"\
    term-2\">term 2</dt>\n  <dd>definition 2-a</dd>\n  <dd>definition 2-b</dd>\n \
    \ <dd>definition 2-c</dd>\n  <dt id=\"term-3\">term 3</dt>\n  <dd>definition 3-a</dd>\n\
    \  <dd>definition 3-b</dd>\n</dl>\n```\n\nThen we get all the `dd` before the\
    \ `dt` with ID `term-2` and up to but not including the first `dt` by writing:\n\
    \n```\n$(\"#term-2\").prevUntil(\"dt\")\n  .css(\"background-color\", \"red\"\
    );\n```\n\nand we set their background to red.\n\n## `.promise()`\n\nThe `.promise()`\
    \ method returns a promise to observe when all actions of a certain type bound\
    \ to the collection have finished.\n\nFor instance, if we have:\n\n```\n<button>Go</button>\n\
    <p>Ready...</p>\n<div></div>\n<div></div>\n<div></div>\n<div></div>\n```\n\nThen\
    \ we can show some text when we click on a button by writing:\n\n```\n$(\"button\"\
    ).on(\"click\", function() {\n  $(\"p\").append(\"Started...\");\n  $(\"div\"\
    ).each(function(i) {\n    $(this).fadeIn().fadeOut(1000 * (i + 1));\n  });\n \
    \ $(\"div\").promise().done(function() {\n    $(\"p\").append(\" Finished! \"\
    );\n  });\n});\n```\n\nWe loop through each `div` and apply some fade effects\
    \ with `fadeIn` and `fadeOut`.\n\nThen we call `promise` and run code when all\
    \ the method calls are done with the `promise().done()` method.\n\n## `.prop()`\n\
    \nWe can use the `prop` method to get the attribute value.\n\nFor example, if\
    \ we have:\n\n```\n<input id=\"check1\" type=\"checkbox\" checked=\"checked\"\
    >\n```\n\nThen we can write:\n\n```\n$(\"input\").change(function() {\n  const\
    \ $input = $(this);\n  console.log($input.prop(\"checked\"));\n}).change();\n\
    ```\n"
