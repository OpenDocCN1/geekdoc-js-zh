  \n\n\n\n\n# JavaScript switch 语句\n\nJavaScript `switch` 语句用于将许多表达式合并到段代码中。它与上一页学习的\
  \ `else if` 语句相同。然而，它比 `if..else..if` 更实用，因为它可以用于整数、字符和其他变量。\n\nJavaScript `switch`\
  \ 语句的签名下所示。\n\n```javascript\nswitch(expression){\n  case value1:\n    code to be\
  \ executed;\n    break;\n  case value2:\n    code to be executed;\n    break;\n\
  \  ......\n  default:\n    // 如果上述值都不匹配，则执行此代码;\n}\n```\n\n## 简单示例 - switch 语句 -\
  \ javascript\n\n```html\n<script>\n  var grade='B';\n  var result;\n  switch(grade){\n\
  \    case 'A':  result=\"A Grade\";\n    break;\n    case 'B':\n      result=\"\
  B Grade\";\n    break;\n    case 'C':\n      result=\"C Grade\";\n    break;\n \
  \   default:\n      result=\"No Grade\";\n  }\n  document.write(result);\n</script>\n\
  ```\n**输出**\nB Grade\n\n## switch 语句的行为\n\n```html\n<script>\n  var grade='B';\n\
  \  var result;\n  switch(grade){\n    case 'A':\n      result+=\" A Grade\";\n \
  \   case 'B':\n      result+=\" B Grade\";\n    case 'C':\n      result+=\" C Grade\"\
  ;\n    default:\n      result+=\" No Grade\";\n  }\n  document.write(result);\n\
  </script>\n```\n**输出**\nundefined B Grade C Grade No Grade\n\n# JavaScript 循环\n\n\
  `for`、`while`、`do while` 和 `for-in` 循环用于在 JavaScript 中迭代一段代码。它可以减少代码量。它们最常见于数组。\n\
  \n1. `for` 循环\n2. `while` 循环\n3. `do-while` 循环\n4. `for-in` 循环\n\n## 1) JavaScript\
  \ For 循环\n\nJavaScript 中的循环按指定的次数迭代组件。如果迭代次数已知，则应该使用它。`for` 循环的语法所示。\n\n```javascript\n\
  for (initialization; condition; increment)\n{\n  // 要执行的代码\n}\n```\n\n### 示例\n```html\n\
  <script>\n  for (i=1; i<=5; i++)\n  {\n    document.write(i + \"<br/>\")\n  }\n\
  </script>\n```\n**输出：**\n1\n2\n3\n4\n5\n\n## 2) JavaScript while 循环\n\nJavaScript\
  \ 中的 `while` 循环无限迭代组件。如果迭代次数未知，则应该使用它。`while` 循环的语法所示。\n\n```javascript\nwhile (condition)\n\
  {\n  // 要执行的代码\n}\n```\n\n### 示例\n```html\n<script>\n  var i=11;\n  while (i<=15)\n\
  \  {\n    document.write(i + \"<br/>\");\n    i++;\n  }\n</script>\n```\n**输出：**\n\
  11\n12\n13\n14\n15\n\n## 3) Do while 循环\n\nJavaScript 的 `do while` 循环与 `while` 循环一样，无限迭代元素。无论条件真假，代码至少执行一次。以下是\
  \ `do while` 循环的语法。\n\n```javascript\ndo{\n  // 要执行的代码\n}while (condition);\n```\n\
  \n### 示例\n```html\n<script>\n  var i=21;\n  do{\n    document.write(i + \"<br/>\"\
  );\n    i++;\n  }while (i<=25);\n</script>\n```\n**输出：**\n21\n22\n23\n24\n25\n\n\
  ## 4) JavaScript for in 循环\n\nJavaScript 的 `for in` 循环用于遍历对象的属性。\n\n# JavaScript\
  \ 函数\n\n为了执行操作，需要 JavaScript 函数。为了复用代码，我们可以多次调用 JavaScript 函数。\n\n## 使用 JavaScript\
  \ 的用处\n\nJavaScript 函数主要有两个优势：\n\n1. **代码的可重用性**：因为我们可以多次调用函数，所以可以节省编写代码的时间。\n2.\
  \ **更少的代码**：意味着我们的程序更紧凑。为了完成一项常见任务，我们不需要每次都编写许多行代码。\n\n## JavaScript 函数语法\n\n```javascript\n\
  function functionName([arg1, arg2, ...argN]){\n  // 要执行的代码\n}\n```\n\n### 示例\n```html\n\
  <script>\n  function msg(){\n    alert(\"hello! this is message\");\n  }\n</script>\n\
  <input type=\"button\" onclick=\"msg()\" value=\"call function\"/>\n```\n\n## JavaScript\
  \ 函数参数\n\n```html\n<script>\n  function getcube(number){\n    alert(number*number*number);\n\
  \  }\n</script>\n<form>\n  <input type=\"button\" value=\"click\" onclick=\"getcube(4)\"\
  />\n</form>\n```\n\n## 带返回值的函数\n\n我们可以通过调用函数在程序中使用返回返回值的函数。让我们看一个返回返回值的函数作为示例。\n\
  \n```html\n<script>\n  function getInfo(){\n    return \"hello javatpoint! How r\
  \ u?\";\n  }\n</script>\n<script>\n  document.write(getInfo());\n</script>\n```\n\
  **输出**\nhello javatpoint! How r u?\n\n## JavaScript 函数对象\n\nJavaScript 中的 `Function`\
  \ 对象 `Object() { [native code] }` 用于生成一个新的 `Function` 对象。它在全局范围内运行代码。然而，当我们直接调用函数\
  \ `Object() { [native code] }` 时，会构建一个函数。\n\n### 语法\n`function functionName([arg1,\
  \ arg2, ...argN])`\n\n### 函数对象示例\n```javascript\nvar add = Function(\"num1\", \"\
  num2\", \"return num1+num2\");\n```\n\n### 函数对象示例\n```javascript\nvar pow = Function(\"\
  num1\", \"num2\", \"return num1*num2\");\n```\n\n## 定义方法 - JavaScript 对象\n\n在 JavaScript\
  \ 对象中，我们可以指定方法。然而，在定义方法之前，我们必须向函数添加一个与方法同名的属性。\n\n### 示例\n```html\n<script>\n  function\
  \ emp(id,name,salary){\n    this.id=id;\n    this.name=name;\n    this.salary=salary;\n\
  \    this.changeSalary=changeSalary;\n  }\n  function changeSalary(otherSalary){\n\
  \    this.salary=otherSalary;\n  }\n  e=new emp(103,\"Sonoo Jaiswal\",30000);\n\
  \  document.write(e.id+\" \"+e.name+\" \"+e.salary);\n  e.changeSalary(45000);\n\
  \  document.write(\"<br>\"+e.id+\" \"+e.name+\" \"+e.salary);\n</script>\n```\n\
  **输出**\n103 Sonoo Jaiswal 30000\n103 Sonoo Jaiswal 45000\n\n# JavaScript 数组\n\n\
  JavaScript 数组是一个表示相同类型对象组的对象。\n\n在 JavaScript 中，有三种方法创建数组：\n\n1. 通过数组字面量\n2. 直接创建\
  \ `Array` 实例（使用 `new` 关键字）\n3. 通过使用 `Array` 构造函数（使用 `new` 关键字）\n\n## 1) JavaScript\
  \ 数组字面量\n\n```javascript\nvar arrayname=[value1,value2.....valueN];\n```\n值包含在 `[]`\
  \ 中，并正如你所看到的，用逗号（comma）分隔。\n\n\n\n\n\n让我们来看一个在 JavaScript 中创建和使用数组的简单示例。\n\n```javascript\n\
  <script>\n  var emp=[\"Sonoo\",\"Vimal\",\"Ratan\"];\n  for (i=0;i<emp.length;i++){\n\
  \    document.write(emp[i] + \"<br/>\");\n  }\n</script>\n```\n\nOutput\nSonoo\n\
  Vimal\nRatan\n\n## 2) 直接数组\n\n以下是直接创建数组的语法：\n\n```javascript\nvar arrayname=new\
  \ Array();\n```\n\n在这种情况下，使用 `new` 关键字来创建一个数组对象。\n\n让我们来看从零生成数组的示例。\n\n```javascript\n\
  <script>\n  var i;\n  var emp = new Array();\n  emp[0] = \"Arun\";\n  emp[1] = \"\
  Varun\";\n  emp[2] = \"John\";\n  for (i=0;i<emp.length;i++){\n    document.write(emp[i]\
  \ + \"<br>\");\n  }\n</script>\n```\nOutput\nArun\nVarun\nJohn\n\n## 3) JavaScript\
  \ 数组构造函数\n\n为了我们不需要显式地提供值，你必须通过向函数 `Object() { [native code] }` 传递参数来创建数组实例。\n\n\
  以下是使用数组函数 `Object() { [native code] }` 创建对象的示例。\n\n```javascript\n<script>\n  var\
  \ emp=new Array(\"Jai\",\"Vijay\",\"Smith\");\n  for (i=0;i<emp.length;i++){\n \
  \   document.write(emp[i] + \"<br>\");\n  }\n</script>\n```\nOutput\nJai\nVijay\n\
  Smith\n\n## JavaScript 数组方法\n\n![](img/image00222.jpeg)\n![](img/image00223.jpeg)\n\
  ![](img/image00224.jpeg)\n![](img/image00225.jpeg)\n![](img/image00226.jpeg)\n\n\
  ## JavaScript String\n\nJavaScript 中的字符串是一个表示字符序列的对象。\n\n在 JavaScript 中，有两种创建字符串：\n\
  \n1. 通过字符串字面量\n2. 通过字符串对象（使用 `new` 关键字）\n\n### 1) 通过字符串字面量\n\n使用双引号来构建字符串字面量。以下是使用字符串字面量创建字符串的语法：\n\
  \n```javascript\nvar stringname=\"string value\";\n```\n\n### 示例\n```javascript\n\
  <script>\n  var str=\"This is string literal\";\n  document.write(str);\n</script>\n\
  ```\nOutput:\nThis is string literal\n\n### 2) 通过字符串对象（使用 new 关键字）\n\n以下是使用 `new`\
  \ 关键字创建字符串对象的语法：\n\n```javascript\nvar stringname=new String(\"string literal\"\
  );\n```\n\n`new` 关键字用于创建字符串实例。\n\n让我们来看在 JavaScript 中使用 `new` 关键字创建字符串的示例。\n\n```javascript\n\
  <script>\n  var stringname=new String(\"hello javascript string\");\n  document.write(stringname);\n\
  </script>\n```\nOUTPUT\nhello javascript string\n\n## JavaScript String 方法\n\n![](img/image00227.jpeg)\n\
  ![](img/image00228.jpeg)\n![](img/image00229.jpeg)\n\n## JavaScript Date 对象\n\n\
  你可以使用 JavaScript 日对象获取年、月、日。JavaScript 日对象可以用于在网页上显示计时器。\n\n要生成日期对象，你可以使用多种 `Date`\
  \ 构造函数。它具有获取和设置日、月、年、时、分、秒的方法。\n\n### 构造函数\n4 种 Date 构造变体\n\n1. `Date()`\n2. `Date(milliseconds)`\n\
  3. `Date(dateString)`\n4. `Date(year, month, day, hours, minutes, seconds, milliseconds)`\n\
  \n## JavaScript Date 方法\n\n![](img/image00230.jpeg)\n![](img/image00231.jpeg)\n\
  ![](img/image00232.jpeg)\n![](img/image00233.jpeg)\n![](img/image00234.jpeg)\n\n\
  ## JavaScript Date 示例\n\n1. 当前日期和时间: <span id=\"txt\"></span>\n```javascript\n<script>\n\
  \  var today=new Date();\n  document.getElementById('txt').innerHTML=today;\n</script>\n\
  ```\nOUTPUT\nCurrent Date: Sat Feb 12 2022 23:47:52 GMT+0530 (India Standard Time)\n\
  \n示例 2\n```javascript\n<script>\n  var date=new Date();\n  var day=date.getDate();\n\
  \  var month=date.getMonth()+1;\n  var year=date.getFullYear();\n  document.write(\"\
  <br>Date is: \"+month+\"/\"+year);\n</script>\n```\n\n### 当前时间示例\n1. 当前时间: <span\
  \ id=\"txt\"></span>\n```javascript\n<script>\n  var today=new Date();\n  var h=today.getHours();\n\
  \  var m=today.getMinutes();\n  var s=today.getSeconds();\n  document.getElementById('txt').innerHTML=h+\"\
  :\"+m+\":\"+s;\n</script>\n```\n\n### 数字钟示例\n让我们来看一个使用 JavaScript 日对象显示数字钟的简单示例。在\
  \ JavaScript 中，你可以使用 `setTimeout()` 或 `setInterval()` 方法指定指定间隔。\n\n示例\n```javascript\n\
  Current Time: <span id=\"txt\"></span>\n<script>\n  window.onload=function(){\n\
  \    var today=new Date();\n    var h=today.getHours();\n    var m=today.getMinutes();\n\
  \    var s=today.getSeconds();\n    //在数字小于 10 前加一个零\n    m=checkTime(m);\n    s=checkTime(s);\n\
  \    document.getElementById('txt').innerHTML=h+\":\"+m+\":\"+s;\n    setTimeout(function(){getTime()},1000);\n\
  \  }\n  //setInterval(\"getTime()\",1000);另一种方法\n  function checkTime(i){\n    if\
  \ (i<10){\n      i=\"0\"+i;\n    }\n    return i;\n  }\n</script>\n```\n\n## JavaScript\
  \ Math\n\n为了进行数学运算，JavaScript math 对象暴露了各种常量和方法。与 `date` 对象不同，它没有构造函数。\n\n### JavaScript\
  \ Math 方法\n![](img/image00235.jpeg)\n![](img/image00236.jpeg)\n![](img/image00237.jpeg)\n\
  \n### Math.sqrt(n)\n`math.sqrt(n)` 方法返回数的平方根。\n\n```javascript\nSquare Root of 17\
  \ is: <span id=\"p1\"></span>\n<script>\n  document.getElementById('p1').innerHTML=Math.sqrt(17);\n\
  </script>\n```\nOutput:\nSquare Root of 17 is: 4.123105625617661\n\n### Math.random()\n\
  JavaScript 中的 `math.random()` 方法返回一个 0 到 1 之间的随机数。\n\n```javascript\nRandom Number\
  \ is: <span id=\"p2\"></span>\n<script>\n  document.getElementById('p2').innerHTML=Math.random();\n\
  </script>\n```\nOutput:\nRandom Number is: 0.02157876559753591\n\n### Math.pow(m,n)\n\
  ```javascript\n3 的 4 次方结果是: <span id=\"p3\"></span>\n<script>\n  document.getElementById('p3').innerHTML=Math.pow(3,4);\n\
  </script>\n```\nOutput:\n3 to the power of 4 is: 81\n\n### Math.floor(n)\nJavaScript\
  \ `math.floor(n)` 方法返回数的最低整数。例如，对于 3.7 返回 3，对于 5.9 返回 5。\n\n```javascript\nFloor\
  \ of 4.6 is: <span id=\"p4\"></span>\n<script>\n  document.getElementById('p4').innerHTML=Math.floor(4.6);\n\
  </script>\n```\nOutput:\nFloor of 4.6 is: 4\n\n### Math.ceil(n)\nJavaScript `math.ceil(n)`\
  \ 方法返回给定值的最大整数。例如，对于 3.7 返回 4，对于 5.9 返回 6。\n\n```javascript\nCeil of 4.6 is: <span\
  \ id=\"p5\"></span>\n<script>\n  document.getElementById('p5').innerHTML=Math.ceil(4.6);\n\
  </script>\n```\nOutput:\nCeil of 4.6 is: 5\n\n### Math.round(n)\nJavaScript math。`round(n)`\
  \ 方法给出给定数字最接近的整数。如果小数部分大于等于 0.5，则赋值高值 1；否则赋值低值 0。例如，对于 3.7 返回 4，对于 3.3 返回 3，对于 5.9\
  \ 返回 6。\n\n```javascript\nRound of 4.3 is: <span id=\"p6\"></span>\nRound of 4.7\
  \ is: <span id=\"p7\"></span>\n<script>\n  document.getElementById('p6').innerHTML=Math.round(4.3);\n\
  \  document.getElementById('p7').innerHTML=Math.round(4.7);\n</script>\n```\nOutput:\n\
  Round of 4.3 is: 4\nRound of 4.7 is: 5\n\n## JavaScript Number 对象\n\n你可以使用 JavaScript\
  \ 数字对象表示一个数值。它可以是整数也可以是浮点数。JavaScript 数字对象遵循表示浮点数的 IEEE 标准。\n\n在 JavaScript 中，你可以通过\
  \ `Number()` 函数 `Object() { [native code] }` 创建一个数字对象。\n\n如果值无法转换为数字，它将返回 `NaN`（不是数字），可以使用\
  \ `isNaN()` 方法进行验证。\n\n你也可以直接将数字赋值给变量。以下是场景示例：\n\n```javascript\nvar x=102;//整数值\n\
  var y=102.7;//浮点值\n```\n\n\n\n\n\n3. `var z=13e4;`指数值，输出：130000\n4. `var n=new Number(16);`通过数字对象的整数值\n\
  \n输出：\n102 102.7 130000 16\n\n## JavaScript 数字常量\n\n![](img/image00238.jpeg)\n\n\
