  \n### JavaScript If-else\n\n![](img/image00209.jpeg)\n\n### JavaScript If 语句\n\n\
  只有当 if 表达式为真时，才会评估内容。JavaScript 中的 if 语句具有以下签名：\n\n```javascript\nif(expression){\n\
