    \n## JavaScript Date 对象\n\n你可以使用 JavaScript 日对象获取年、月、日。JavaScript 日对象可以用于在网页上显示计时器。\n\
    \n要生成日期对象，你可以使用多种 `Date` 构造函数。它具有获取和设置日、月、年、时、分、秒的方法。\n\n### 构造函数\n4 种 Date 构造变体\n\
    \n1. `Date()`\n2. `Date(milliseconds)`\n3. `Date(dateString)`\n4. `Date(year,\
    \ month, day, hours, minutes, seconds, milliseconds)`\n\n## JavaScript Date 方法\n\
    \n![](img/image00230.jpeg)\n![](img/image00231.jpeg)\n![](img/image00232.jpeg)\n\
    ![](img/image00233.jpeg)\n![](img/image00234.jpeg)\n\n## JavaScript Date 示例\n\n\
    1. 当前日期和时间: <span id=\"txt\"></span>\n```javascript\n<script>\n  var today=new\
    \ Date();\n  document.getElementById('txt').innerHTML=today;\n</script>\n```\n\
    OUTPUT\nCurrent Date: Sat Feb 12 2022 23:47:52 GMT+0530 (India Standard Time)\n\
    \n示例 2\n```javascript\n<script>\n  var date=new Date();\n  var day=date.getDate();\n\
    \  var month=date.getMonth()+1;\n  var year=date.getFullYear();\n  document.write(\"\
    <br>Date is: \"+month+\"/\"+year);\n</script>\n```\n\n### 当前时间示例\n1. 当前时间: <span\
    \ id=\"txt\"></span>\n```javascript\n<script>\n  var today=new Date();\n  var\
    \ h=today.getHours();\n  var m=today.getMinutes();\n  var s=today.getSeconds();\n\
    \  document.getElementById('txt').innerHTML=h+\":\"+m+\":\"+s;\n</script>\n```\n\
    \n### 数字钟示例\n让我们来看一个使用 JavaScript 日对象显示数字钟的简单示例。在 JavaScript 中，你可以使用 `setTimeout()`\
    \ 或 `setInterval()` 方法指定指定间隔。\n\n示例\n```javascript\nCurrent Time: <span id=\"\
    txt\"></span>\n<script>\n  window.onload=function(){\n    var today=new Date();\n\
    \    var h=today.getHours();\n    var m=today.getMinutes();\n    var s=today.getSeconds();\n\
    \    //在数字小于 10 前加一个零\n    m=checkTime(m);\n    s=checkTime(s);\n    document.getElementById('txt').innerHTML=h+\"\
    :\"+m+\":\"+s;\n    setTimeout(function(){getTime()},1000);\n  }\n  //setInterval(\"\
    getTime()\",1000);另一种方法\n  function checkTime(i){\n    if (i<10){\n      i=\"\
    0\"+i;\n    }\n    return i;\n  }\n</script>\n```\n\n## JavaScript Math\n\n为了进行数学运算，JavaScript\
    \ math 对象暴露了各种常量和方法。与 `date` 对象不同，它没有构造函数。\n\n### JavaScript Math 方法\n![](img/image00235.jpeg)\n\
    ![](img/image00236.jpeg)\n![](img/image00237.jpeg)\n\n#### Math.sqrt(n)\n`math.sqrt(n)`\
    \ 方法返回数的平方根。\n\n```javascript\nSquare Root of 17 is: <span id=\"p1\"></span>\n\
    <script>\n  document.getElementById('p1').innerHTML=Math.sqrt(17);\n</script>\n\
    ```\nOutput:\nSquare Root of 17 is: 4.123105625617661\n\n#### Math.random()\n\
    JavaScript 中的 `math.random()` 方法返回一个 0 到 1 之间的随机数。\n\n```javascript\nRandom Number\
    \ is: <span id=\"p2\"></span>\n<script>\n  document.getElementById('p2').innerHTML=Math.random();\n\
    </script>\n```\nOutput:\nRandom Number is: 0.02157876559753591\n\n#### Math.pow(m,n)\n\
    ```javascript\n3 的 4 次方结果是: <span id=\"p3\"></span>\n<script>\n  document.getElementById('p3').innerHTML=Math.pow(3,4);\n\
    </script>\n```\nOutput:\n3 to the power of 4 is: 81\n\n#### Math.floor(n)\nJavaScript\
    \ `math.floor(n)` 方法返回数的最低整数。例如，对于 3.7 返回 3，对于 5.9 返回 5。\n\n```javascript\nFloor\
    \ of 4.6 is: <span id=\"p4\"></span>\n<script>\n  document.getElementById('p4').innerHTML=Math.floor(4.6);\n\
    </script>\n```\nOutput:\nFloor of 4.6 is: 4\n\n#### Math.ceil(n)\nJavaScript `math.ceil(n)`\
    \ 方法返回给定值的最大整数。例如，对于 3.7 返回 4，对于 5.9 返回 6。\n\n```javascript\nCeil of 4.6 is: <span\
    \ id=\"p5\"></span>\n<script>\n  document.getElementById('p5').innerHTML=Math.ceil(4.6);\n\
    </script>\n```\nOutput:\nCeil of 4.6 is: 5\n\n#### Math.round(n)\nJavaScript math。`round(n)`\
    \ 方法给出给定数字最接近的整数。如果小数部分大于等于 0.5，则赋值高值 1；否则赋值低值 0。例如，对于 3.7 返回 4，对于 3.3 返回 3，对于\
    \ 5.9 返回 6。\n\n```javascript\nRound of 4.3 is: <span id=\"p6\"></span>\nRound\
    \ of 4.7 is: <span id=\"p7\"></span>\n<script>\n  document.getElementById('p6').innerHTML=Math.round(4.3);\n\
    \  document.getElementById('p7').innerHTML=Math.round(4.7);\n</script>\n```\n\
    Output:\nRound of 4.3 is: 4\nRound of 4.7 is: 5\n\n## JavaScript Number 对象\n\n\
