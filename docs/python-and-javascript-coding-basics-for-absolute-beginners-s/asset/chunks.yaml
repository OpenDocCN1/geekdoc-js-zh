  trans: "\n\n# JavaScript switch 语句\n\nJavaScript `switch` 语句用于将许多表达式合并到段代码中。它与上一页学习的\
    \ `else if` 语句相同。然而，它比 `if..else..if` 更实用，因为它可以用于整数、字符和其他变量。\n\nJavaScript `switch`\
    \ 语句的签名下所示。\n\n```javascript\nswitch(expression){\n  case value1:\n    code to\
    \ be executed;\n    break;\n  case value2:\n    code to be executed;\n    break;\n\
    \  ......\n  default:\n    // 如果上述值都不匹配，则执行此代码;\n}\n```\n\n## 简单示例 - switch 语句\
    \ - javascript\n\n```html\n<script>\n  var grade='B';\n  var result;\n  switch(grade){\n\
    \    case 'A':  result=\"A Grade\";\n    break;\n    case 'B':\n      result=\"\
    B Grade\";\n    break;\n    case 'C':\n      result=\"C Grade\";\n    break;\n\
    \    default:\n      result=\"No Grade\";\n  }\n  document.write(result);\n</script>\n\
    ```\n**输出**\nB Grade\n\n## switch 语句的行为\n\n```html\n<script>\n  var grade='B';\n\
    \  var result;\n  switch(grade){\n    case 'A':\n      result+=\" A Grade\";\n\
    \    case 'B':\n      result+=\" B Grade\";\n    case 'C':\n      result+=\" C\
    \ Grade\";\n    default:\n      result+=\" No Grade\";\n  }\n  document.write(result);\n\
    </script>\n```\n**输出**\nundefined B Grade C Grade No Grade\n\n# JavaScript 循环\n\
    \n`for`、`while`、`do while` 和 `for-in` 循环用于在 JavaScript 中迭代一段代码。它可以减少代码量。它们最常见于数组。\n\
    \n1. `for` 循环\n2. `while` 循环\n3. `do-while` 循环\n4. `for-in` 循环\n\n## 1) JavaScript\
    \ For 循环\n\nJavaScript 中的循环按指定的次数迭代组件。如果迭代次数已知，则应该使用它。`for` 循环的语法所示。\n\n```javascript\n\
    for (initialization; condition; increment)\n{\n  // 要执行的代码\n}\n```\n\n### 示例\n\
    ```html\n<script>\n  for (i=1; i<=5; i++)\n  {\n    document.write(i + \"<br/>\"\
    )\n  }\n</script>\n```\n**输出：**\n1\n2\n3\n4\n5\n\n## 2) JavaScript while 循环\n\n\
    JavaScript 中的 `while` 循环无限迭代组件。如果迭代次数未知，则应该使用它。`while` 循环的语法所示。\n\n```javascript\n\
    while (condition)\n{\n  // 要执行的代码\n}\n```\n\n### 示例\n```html\n<script>\n  var\
    \ i=11;\n  while (i<=15)\n  {\n    document.write(i + \"<br/>\");\n    i++;\n\
    \  }\n</script>\n```\n**输出：**\n11\n12\n13\n14\n15\n\n## 3) Do while 循环\n\nJavaScript\
    \ 的 `do while` 循环与 `while` 循环一样，无限迭代元素。无论条件真假，代码至少执行一次。以下是 `do while` 循环的语法。\n\
    \n```javascript\ndo{\n  // 要执行的代码\n}while (condition);\n```\n\n### 示例\n```html\n\
    <script>\n  var i=21;\n  do{\n    document.write(i + \"<br/>\");\n    i++;\n \
    \ }while (i<=25);\n</script>\n```\n**输出：**\n21\n22\n23\n24\n25\n\n## 4) JavaScript\
    \ for in 循环\n\nJavaScript 的 `for in` 循环用于遍历对象的属性。\n\n# JavaScript 函数\n\n为了执行操作，需要\
    \ JavaScript 函数。为了复用代码，我们可以多次调用 JavaScript 函数。\n\n## 使用 JavaScript 的用处\n\nJavaScript\
    \ 函数主要有两个优势：\n\n1. **代码的可重用性**：因为我们可以多次调用函数，所以可以节省编写代码的时间。\n2. **更少的代码**：意味着我们的程序更紧凑。为了完成一项常见任务，我们不需要每次都编写许多行代码。\n\
    \n## JavaScript 函数语法\n\n```javascript\nfunction functionName([arg1, arg2, ...argN]){\n\
    \  // 要执行的代码\n}\n```\n\n### 示例\n```html\n<script>\n  function msg(){\n    alert(\"\
    hello! this is message\");\n  }\n</script>\n<input type=\"button\" onclick=\"\
    msg()\" value=\"call function\"/>\n```\n\n## JavaScript 函数参数\n\n```html\n<script>\n\
    \  function getcube(number){\n    alert(number*number*number);\n  }\n</script>\n\
    <form>\n  <input type=\"button\" value=\"click\" onclick=\"getcube(4)\"/>\n</form>\n\
    ```\n\n## 带返回值的函数\n\n我们可以通过调用函数在程序中使用返回返回值的函数。让我们看一个返回返回值的函数作为示例。\n\n```html\n\
    <script>\n  function getInfo(){\n    return \"hello javatpoint! How r u?\";\n\
    \  }\n</script>\n<script>\n  document.write(getInfo());\n</script>\n```\n**输出**\n\
    hello javatpoint! How r u?\n\n## JavaScript 函数对象\n\nJavaScript 中的 `Function` 对象\
    \ `Object() { [native code] }` 用于生成一个新的 `Function` 对象。它在全局范围内运行代码。然而，当我们直接调用函数\
    \ `Object() { [native code] }` 时，会构建一个函数。\n\n### 语法\n`function functionName([arg1,\
    \ arg2, ...argN])`\n\n### 函数对象示例\n```javascript\nvar add = Function(\"num1\",\
    \ \"num2\", \"return num1+num2\");\n```\n\n### 函数对象示例\n```javascript\nvar pow\
    \ = Function(\"num1\", \"num2\", \"return num1*num2\");\n```\n\n## 定义方法 - JavaScript\
    \ 对象\n\n在 JavaScript 对象中，我们可以指定方法。然而，在定义方法之前，我们必须向函数添加一个与方法同名的属性。\n\n### 示例\n\
    ```html\n<script>\n  function emp(id,name,salary){\n    this.id=id;\n    this.name=name;\n\
    \    this.salary=salary;\n    this.changeSalary=changeSalary;\n  }\n  function\
    \ changeSalary(otherSalary){\n    this.salary=otherSalary;\n  }\n  e=new emp(103,\"\
    Sonoo Jaiswal\",30000);\n  document.write(e.id+\" \"+e.name+\" \"+e.salary);\n\
    \  e.changeSalary(45000);\n  document.write(\"<br>\"+e.id+\" \"+e.name+\" \"+e.salary);\n\
    </script>\n```\n**输出**\n103 Sonoo Jaiswal 30000\n103 Sonoo Jaiswal 45000\n\n#\
    \ JavaScript 数组\n\nJavaScript 数组是一个表示相同类型对象组的对象。\n\n在 JavaScript 中，有三种方法创建数组：\n\
    \n1. 通过数组字面量\n2. 直接创建 `Array` 实例（使用 `new` 关键字）\n3. 通过使用 `Array` 构造函数（使用 `new`\
    \ 关键字）\n\n## 1) JavaScript 数组字面量\n\n```javascript\nvar arrayname=[value1,value2.....valueN];\n\
    ```\n值包含在 `[]` 中，并正如你所看到的，用逗号（comma）分隔。\n\n"
- fmt: "\nLet's have a look at a simple example of how to create and use an array\
    \ in JavaScript.\n\n```javascript\n<script>\n  var emp=[\"Sonoo\",\"Vimal\",\"\
    Ratan\"];\n  for (i=0;i<emp.length;i++){\n    document.write(emp[i] + \"<br/>\"\
    );\n  }\n</script>\n```\n\nOutput\nSonoo\nVimal\nRatan\n\n## 2) JavaScript Array\
    \ directly\n\nThe following is the syntax for directly creating an array:\n\n\
    ```javascript\nvar arrayname=new Array();\n```\n\nIn this case, the `new` keyword\
    \ is used to create an array object.\n\nLet's look at an example of generating\
    \ an array from scratch.\n\n```javascript\n<script>\n  var i;\n  var emp = new\
    \ Array();\n  emp[0] = \"Arun\";\n  emp[1] = \"Varun\";\n  emp[2] = \"John\";\n\
    \  for (i=0;i<emp.length;i++){\n    document.write(emp[i] + \"<br>\");\n  }\n\
    </script>\n```\nOutput\nArun\nVarun\nJohn\n\n## 3) JavaScript array constructor\n\
    \nSo that we don't have to provide value explicitly, you must create an instance\
    \ of array by passing arguments to the function `Object() { [native code] }`.\n\
    \nThe following is an example of using the array function `Object() { [native\
    \ code] }` to create an object.\n\n```javascript\n<script>\n  var emp=new Array(\"\
    Jai\",\"Vijay\",\"Smith\");\n  for (i=0;i<emp.length;i++){\n    document.write(emp[i]\
    \ + \"<br>\");\n  }\n</script>\n```\nOutput\nJai\nVijay\nSmith\n\n## JavaScript\
    \ Array Methods\n\n![](Images/image00222.jpeg)\n![](Images/image00223.jpeg)\n\
    ![](Images/image00224.jpeg)\n![](Images/image00225.jpeg)\n![](Images/image00226.jpeg)\n\
    \n## JavaScript String\n\nA string in JavaScript is an object that represents\
    \ a string of characters.\n\nIn JavaScript, there are two ways to make a string:\n\
    \n1. By string literal\n2. By string object (using `new` keyword)\n\n### 1) By\
    \ string literal\n\nDouble quotations are used to construct the string literal.\
    \ The following is the syntax for creating a string using a string literal:\n\n\
    ```javascript\nvar stringname=\"string value\";\n```\n\n#### EXAMPLE\n```javascript\n\
    <script>\n  var str=\"This is string literal\";\n  document.write(str);\n</script>\n\
    ```\nOutput:\nThis is string literal\n\n### 2) By string object (using new keyword)\n\
    \nThe following is the syntax for creating a string object with the `new` keyword:\n\
    \n```javascript\nvar stringname=new String(\"string literal\");\n```\n\nThe `new`\
    \ keyword is used to create a string instance.\n\nLet's look at an example of\
    \ using the `new` keyword in JavaScript to create a string.\n\n```javascript\n\
    <script>\n  var stringname=new String(\"hello javascript string\");\n  document.write(stringname);\n\
    </script>\n```\nOUTPUT\nhello javascript string\n\n## JavaScript String Methods\n\
    \n![](Images/image00227.jpeg)\n![](Images/image00228.jpeg)\n![](Images/image00229.jpeg)\n\
    \n## JavaScript Date Object\n\nYou may get the year, month, and day using the\
    \ JavaScript date object. The JavaScript date object can be used to display a\
    \ timer on a webpage.\n\nTo generate a date object, you can use a variety of `Date`\
    \ constructors. It has methods for retrieving and setting the day, month, year,\
    \ hour, minute, and second.\n\n### Constructor\n4 variant of Date constructor\n\
    \n1. `Date()`\n2. `Date(milliseconds)`\n3. `Date(dateString)`\n4. `Date(year,\
    \ month, day, hours, minutes, seconds, milliseconds)`\n\n## JavaScript Date Methods\n\
    \n![](Images/image00230.jpeg)\n![](Images/image00231.jpeg)\n![](Images/image00232.jpeg)\n\
    ![](Images/image00233.jpeg)\n![](Images/image00234.jpeg)\n\n## JavaScript Date\
    \ Example\n\n1. Current Date and Time: <span id=\"txt\"></span>\n```javascript\n\
    <script>\n  var today=new Date();\n  document.getElementById('txt').innerHTML=today;\n\
    </script>\n```\nOUTPUT\nCurrent Date: Sat Feb 12 2022 23:47:52 GMT+0530 (India\
    \ Standard Time)\n\nEXAMPLE 2\n```javascript\n<script>\n  var date=new Date();\n\
    \  var day=date.getDate();\n  var month=date.getMonth()+1;\n  var year=date.getFullYear();\n\
    \  document.write(\"<br>Date is: \"+month+\"/\"+year);\n</script>\n```\n\n###\
    \ Current Time Example\n1. Current Time: <span id=\"txt\"></span>\n```javascript\n\
    <script>\n  var today=new Date();\n  var h=today.getHours();\n  var m=today.getMinutes();\n\
    \  var s=today.getSeconds();\n  document.getElementById('txt').innerHTML=h+\"\
    :\"+m+\":\"+s;\n</script>\n```\n\n### Digital Clock Example\nLet's look at a simple\
    \ example using the JavaScript date object to display a digital clock. In JavaScript,\
    \ you can specify interval using the `setTimeout()` or `setInterval()` methods.\n\
    \nEXAMPLE\n```javascript\nCurrent Time: <span id=\"txt\"></span>\n<script>\n \
    \ window.onload=function(){\n    var today=new Date();\n    var h=today.getHours();\n\
    \    var m=today.getMinutes();\n    var s=today.getSeconds();\n    //add a zero\
    \ in front of numbers<10\n    m=checkTime(m);\n    s=checkTime(s);\n    document.getElementById('txt').innerHTML=h+\"\
    :\"+m+\":\"+s;\n    setTimeout(function(){getTime()},1000);\n  }\n  //setInterval(\"\
    getTime()\",1000);another way\n  function checkTime(i){\n    if (i<10){\n    \
    \  i=\"0\"+i;\n    }\n    return i;\n  }\n</script>\n```\n\n## JavaScript Math\n\
    \nTo conduct mathematical operations, the JavaScript math object object exposes\
    \ various constants and methods. It does not have constructors, unlike the `date`\
    \ object.\n\n### JavaScript Math Methods\n![](Images/image00235.jpeg)\n![](Images/image00236.jpeg)\n\
    ![](Images/image00237.jpeg)\n\n#### Math.sqrt(n)\nThe square root of a number\
    \ is returned by the `math.sqrt(n)` method.\n\n```javascript\nSquare Root of 17\
    \ is: <span id=\"p1\"></span>\n<script>\n  document.getElementById('p1').innerHTML=Math.sqrt(17);\n\
    </script>\n```\nOutput:\nSquare Root of 17 is: 4.123105625617661\n\n#### Math.random()\n\
    The `math.random()` method in JavaScript returns a random number between 0 and\
    \ 1.\n\n```javascript\nRandom Number is: <span id=\"p2\"></span>\n<script>\n \
    \ document.getElementById('p2').innerHTML=Math.random();\n</script>\n```\nOutput:\n\
    Random Number is: 0.02157876559753591\n\n#### Math.pow(m,n)\n```javascript\n3\
    \ to the power of 4 is: <span id=\"p3\"></span>\n<script>\n  document.getElementById('p3').innerHTML=Math.pow(3,4);\n\
    </script>\n```\nOutput:\n3 to the power of 4 is: 81\n\n#### Math.floor(n)\nThe\
    \ JavaScript `math.floor(n)` method returns the number's lowest integer. For instance,\
    \ 3 for 3.7, 5 for 5.9, and so on.\n\n```javascript\nFloor of 4.6 is: <span id=\"\
    p4\"></span>\n<script>\n  document.getElementById('p4').innerHTML=Math.floor(4.6);\n\
    </script>\n```\nOutput:\nFloor of 4.6 is: 4\n\n#### Math.ceil(n)\nThe `math.ceil(n)`\
    \ method in JavaScript returns the largest integer for a given value. For instance,\
    \ 4 for 3.7, 6 for 5.9.\n\n```javascript\nCeil of 4.6 is: <span id=\"p5\"></span>\n\
    <script>\n  document.getElementById('p5').innerHTML=Math.ceil(4.6);\n</script>\n\
    ```\nOutput:\nCeil of 4.6 is: 5\n\n#### Math.round(n)\nThe math in JavaScript.\
    \ The `round(n)` method gives the nearest rounded integer for a supplied number.\
    \ If the fractional component is equal to or higher than 0.5, it is assigned to\
    \ the upper value 1; otherwise, it is assigned to the lower value 0. For instance,\
    \ 4 for 3.7, 3 for 3.3, 6 for 5.9.\n\n```javascript\nRound of 4.3 is: <span id=\"\
    p6\"></span>\nRound of 4.7 is: <span id=\"p7\"></span>\n<script>\n  document.getElementById('p6').innerHTML=Math.round(4.3);\n\
    \  document.getElementById('p7').innerHTML=Math.round(4.7);\n</script>\n```\n\
    Output:\nRound of 4.3 is: 4\nRound of 4.7 is: 5\n\n## JavaScript Number Object\n\
    \nYou can represent a numeric value with the JavaScript number object. It could\
    \ be either an integer or a floating-point number. The IEEE standard for representing\
    \ floating-point numbers is followed by the JavaScript number object.\n\nIn JavaScript,\
    \ you can make a number object with the `Number()` function `Object() { [native\
    \ code] }`. Consider the following scenario:\n\n```javascript\nvar n=new Number(value);\n\
    ```\n\nIf the value cannot be converted to a number, it returns `NaN` (Not a Number),\
    \ which the `isNaN()` method can validate.\n\nYou can also assign a number directly\
    \ to a variable. Consider the following scenario:\n\n```javascript\nvar x=102;//integer\
    \ value\nvar y=102.7;//floating point value\n```\n"
