    4.  document.getElementById(''p6'').innerHTML=Math.round(4.3);   


    5.  document.getElementById(''p7'').innerHTML=Math.round(4.7);    


    6.  </script>   


    Output:


    Round of 4.3 is: 4


    Round of 4.7 is: 5


    JavaScript Number Object


    You can represent a numeric value with the JavaScript number object. It could
    be either an integer or a floating-point number. The IEEE standard for representing
    floating-point numbers is followed by the JavaScript number object.


    In JavaScript, you can make a number object with the Number() function Object()
    { [native code] }. Consider the following scenario:


    1.  var n=new Number(value);  


    If the value cannot be converted to a number, it returns NaN (Not a Number), which
    the isNaN() method can validate.


    You can also assign a number directly to a variable. Consider the following scenario:


