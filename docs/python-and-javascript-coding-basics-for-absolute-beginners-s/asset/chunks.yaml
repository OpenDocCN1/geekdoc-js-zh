    Python 识别三种类型的数值数据。整数值可以是任何长度，例如 10、2、29、-15 等。整数的长度在 Python 中没有限制。它的值类型是 `int`。


    浮点数（Float）用于存储浮点数，如 1.9、902、15 等。它的精度高达 15 位小数。


    复数由一个有序对组成，即 `x + iy`，其中 `x` 和 `y` 分别代表实部和虚部。复数如 `2.14j`、`2.0 + 2j` 等。


