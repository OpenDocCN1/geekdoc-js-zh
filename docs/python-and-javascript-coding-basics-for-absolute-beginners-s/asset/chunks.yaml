    ### Docstrings Python Comment


    The docstring comment is typically found in a module, function, class, or method.
    It''s a Python documentation string. In subsequent tutorials, we will explain
    the class/method.


    Example:


    ```python

    1. def intro():

    2. """

    3. This function prints Hello Joseph

    4. """

    5. print("Hi Joseph")

    6. intro()

    ```


    Output:

    ```

    Hello Joseph

    ```


    Using the `__doc__` attribute, we can inspect a function''s docstring.


    In most cases, four whitespaces are used as indentation. The amount of indentation
    is up to the user, but it must be consistent across the block.


    ```python

    1. def intro():

    2. """

    3. This function prints Hello Joseph

    4. """

    5. print("Hello Joseph")

    6. intro.__doc__

    ```


    Output:

    ```

    ''\n  This function prints Hello Joseph\n  ''

    ```


    ### Python indentation


    Python indentation is used to define code blocks. Curly braces are used in other
    programming languages such as C, C++, and Java, whereas Python uses indentation.
    In Python, whitespaces are used to indicate indentation.


    Indentation is used at the start of the code and ends with an unexpected line.
    The code block is defined by the same line indentation (body of a function, loop,
    etc.)


    In most cases, four whitespaces are used as indentation. The amount of indentation
    is up to the user, but it must be consistent across the block.


    ```python

    1. for i in range(5):

    2. print(i)

    3. if(i == 3):

    4. break

    ```


    We used the same whitespaces to indent each line of code to indicate a block of
    code.


    Consider the following scenario.


    ```python

    1. n = int(input("Enter the number:"))

    2. if(n%2 == 0):

    3. print("Even Number")

    4. else:

    5. print("Odd Number")

    7. print("Task Complete")

    ```


    Output:

    ```

    Enter the number: 10

    Even Number

    Task Complete

    ```


    `if` and `else` are two separate code blocks in the preceding code. Both code
    blocks are four spaces indented. The `print("Task Complete")` statement is out
    of the `if-else` block and is not indented four whitespaces.


    `IndentationError` will be thrown if the indentation is not used correctly.


    # Python If-else statements


    The most important aspect of almost all programming languages is decision making.
    Decision making, as the name implies, allows us to run a specific block of code
    for a specific decision. Decisions on the validity of specific conditions are
    made here. The foundation of decision making is condition checking.


    The following statements in Python are used to make decisions.


    ![](Images/image00188.jpeg)


    ### Indentation in Python


    Python does not allow the use of parentheses in block level code for the sake
    of simplicity and ease of programming. To declare a block in Python, use indentation.
    If two statements have the same indentation level, they are in the same block.


    In general, four spaces are used to indent the statements, which is the standard
    amount of indentation in Python.


    Because it declares the block of code, indentation is the most commonly used feature
    of the Python programming language. All of the statements in a block are intended
    to be indented at the same level. We''ll look at how actual indentation occurs
    in Python decision making and other areas.


    ### The if statement


    The `if` statement is used to test a condition, and if the condition is true,
    it executes an `if-block` of code. Any valid logical expression that can be evaluated
    to true or false can be used as the condition of an `if` statement.


    ![](Images/image00189.jpeg)


    The `if-statement` syntax is shown below.


    ```python

    1. if expression:

    2. statement

    ```


    #### Example 1


    ```python

    1. num = int(input("enter the number?"))

    2. if num%2 == 0:

    3. print("Number is even")

    ```


    Output:

    ```

    enter the number?10

    Number is even

    ```


    #### Example 2


    Print the largest of the three numbers using the program


    ```python

    1. a = int(input("Enter a?"));

    2. b = int(input("Enter b?"));

    3. c = int(input("Enter c?"));

    4. if a>b and a>c:

    5. print("a is largest");

    6. if b>a and b>c:

    7. print("b is largest");

    8. if c>a and c>b:

    9. print("c is largest");

    ```


    Output:

    ```

    Enter a? 100

    Enter b? 120

    Enter c? 130

    c is largest

    ```


    ### The if-else statement


    The `if-else` statement combines an `else` block with the `if` statement, which
    is executed when the condition is false.


    If the condition is met, the `if-block` is run. If not, the `else-block` is executed.


    ![](Images/image00190.jpeg)


    The `if-else` syntax is shown below.


    ```python

    1. if condition:

