  trans: "\n\n双正斜杠 (`//`) 用于表示注释。在句子之前或之后使用它都是适当的。\n\n让我们来看单行注释的示例，它是放置在语句之前的注释。\n\
    \n```javascript\n<script>  \n// 这是一个单行注释\ndocument.write(\"hello javascript\"\
    );  \n</script>\n```\n\n**示例**\n\n```javascript\n<script>  \nvar a=10;  \nvar\
    \ b=20;  \nvar c=a+b;//它相加变量 a 和 b 的值  \ndocument.write(c);//打印 10 和 20 的和  \n\
    </script>\n```\n\n## 多行注释\n\n它可以用于创建单行和多行注释。因此，它更具实用。\n\n它的符号是一个正斜杠后跟一个星号，然后另一个正斜杠。考虑以下场景：\n\
    \n```javascript\n/* 在此处输入你的代码 */\n```\n\n它可能出现在语句的之前、之后或中间。\n\n```javascript\n\
    <script>  \n/* 这是一个多行注释。  \n它不会被显示 */  \ndocument.write(\"example of javascript\
    \ multiline comment\");  \n</script>\n```\n\n## JavaScript 变量\n\nJavaScript 变量仅仅是存储位置的名称。在\
    \ JavaScript 中，有两种变量：局部变量和全局变量。\n\n在声明 JavaScript 变量时，有一些需要遵循的指南（也称为标识符）。\n\n\
    - 名称必须以字母（`a` 到 `z` 或 `A` 到 `Z`）、下划线（`_`）或美元符号（`$`）开头。\n- 可以在初始字母后放置数字（`0` 到 `9`），例如\
    \ `value1`。\n- JavaScript 变量区分大小写，因此 `x` 和 `X` 是两个变量。\n\n### 正确的 JavaScript 变量\n\
    \n```javascript\nvar x = 10;  \nvar _value=\"sonoo\";  \n```\n\n### 错误的 JavaScript\
    \ 变量\n\n```javascript\nvar 123=30;  \nvar *aa=320;\n```\n\n### 示例 - JavaScript\
    \ 变量\n\n```javascript\n<script>  \nvar x = 10;  \nvar y = 20;  \nvar z=x+y;  \n\
    document.write(z);  \n</script>\n```\n\n**输出**\n30\n\n## JavaScript 局部变量\n\nJavaScript\
    \ 中的局部变量声明在块或函数内部。它只能在函数或块内部被访问。考虑以下场景：\n\n```javascript\n<script>  \nfunction\
    \ abc(){  \nvar x=10;//局部变量  \n}  \n</script>\n```\n\n或者，\n\n```javascript\n<script>\
    \  \nIf(10<13){  \nvar y=20;//JavaScript 局部变量  \n}  \n</script>\n```\n\n## JavaScript\
    \ 全局变量\n\nJavaScript 中的全局变量可以从任何函数访问。全局变量是在函数外部或使用 `window` 对象声明的变量。考虑以下场景：\n\n\
    ```javascript\n<script>  \nvar data=200;//全局变量  \nfunction a(){  \ndocument.writeln(data);\
    \  \n}  \nfunction b(){  \ndocument.writeln(data);  \n}  \na();//调用 JavaScript\
    \ 函数  \nb();  \n</script>\n```\n\n### JavaScript 全局变量\n\nJavaScript 中的全局变量在函数外部或使用\
    \ `window` 对象声明。可以从任何函数访问它。让我们来看一个简单的全局变量 JavaScript 示例。\n\n```javascript\n<script>\
    \  \nvar value=50;//全局变量  \nfunction a(){  \nalert(value);  \n}  \nfunction b(){\
    \  \nalert(value);  \n}  \n</script>\n```\n\n### 在 JavaScript 函数内部中声明全局变量\n\n\
    你必须利用 `window` 对象在函数内部声明 JavaScript 全局变量。考虑以下场景：\n\n```javascript\nwindow.value=90;\n\
    ```\n\n现在可以在任何函数内部声明并从任何函数内部访问它。考虑以下场景：\n\n```javascript\nfunction m(){  \nwindow.value=100;//通过\
    \ window 对象声明全局变量  \n}  \nfunction n(){  \nalert(window.value);//从其他函数访问全局变量 \
    \ \n}\n```\n\n## 在 JavaScript 中，全局变量的内部\n\n当你在函数外部声明变量时，它会自动添加到 `window` 对象中。你也可以使用\
    \ `window` 对象来访问它。考虑以下场景：\n\n```javascript\nvar value=50;  \nfunction a(){  \n\
    alert(window.value);//访问全局变量  \n}\n```\n\n## JavaScript 数据类型\n\nJavaScript 提供了不同的数据类型来存储各种类型的值。在\
    \ JavaScript 中，有两种数据类型。\n\n1. 原始数据类型\n2. 非原始（引用）数据类型\n\nJavaScript 是一种动态类型语言，这意味着你不需要指定变量的类型，因为\
    \ JavaScript 引擎动态地使用它。要指定数据类型，必须使用 `var`。它可能存储任何类型的值，包括数字、字符串等。考虑以下场景：\n\n```javascript\n\
    var a=40;//存储数字  \nvar b=\"Rahul\";//存储字符串  \n```\n\n![](img/image00201.jpeg)\n\
    ![](img/image00202.jpeg)\n\n## JavaScript 运算符\n\nJavaScript 中的运算符是会对操作数执行操作的符号。考虑以下场景：\n\
    \n```javascript\nvar sum=10+20;\n```\n\n在这里，`+` 是算术运算符，=` 是赋值运算符。\n\n### JavaScript\
    \ 运算符的类型。\n\n1. 算术运算符\n2. 比较（关系）运算符\n3. 位运算符\n4. 逻辑运算符\n5. 赋值运算符\n6. 特殊运算符\n\n\
    ### JavaScript 算术运算符\n\n为了对操作数进行算术运算，使用了算术运算符。JavaScript 算术运算符是下面列出的运算符。\n\n![](img/image00203.jpeg)\n\
    \n### JavaScript 比较运算符\n\nJavaScript 中的比较运算符比较两个操作数。以下是比较运算符：\n\n![](img/image00204.jpeg)\n\
    \n### JavaScript 位运算符\n\n位运算符在操作数上执行位操作。以下是位运算符：\n\n![](img/image00205.jpeg)\n\
    \n### JavaScript 逻辑运算符\n\nJavaScript 逻辑运算符是下面列出的运算符。\n\n![](img/image00206.jpeg)\n\
    \n### JavaScript 赋值运算符\n\n![](img/image00207.jpeg)\n\n### JavaScript 特殊运算符\n\n\
    ![](img/image00208.jpeg)\n\n### JavaScript If-else\n\n![](img/image00209.jpeg)\n\
    \n### JavaScript If 语句\n\n只有当 if 表达式为真时，才会评估内容。JavaScript 中的 if 语句具有以下签名：\n\n\
    ```javascript\nif(expression){\n  content\n}\n```\n\n![](img/image0210.jpeg)\n\
    ```javascript\n<script>  \nvar a=20;  \nif(a>10){  \ndocument.write(\"a is greater\
    \ than 10\");  \n</script>\n```\n**输出**\ngreater than 10\n\n### JavaScript If...else\
    \ 语句\n\n它确定条件为真为假。JavaScript 中 if-else 语句的语法所示：\n\n```javascript\nif(expression){\n\
    \  content\n}\nelse{\n  content\n}\n```\n\n![](img/image0211.jpeg)\n```javascript\n\
    <script>  \nvar a=20;  \nif(a%2==0){  \ndocument.write(\"a is even number\");\
    \  \n}  \nelse{  \ndocument.write(\"a is odd number\");  \n}  \n</script>\n```\n\
    **输出**\na is even number\n\n### If...else 语句 – 在 JavaScript 中\n\n只有当一个或多个表达式为真时，才会分析内容。JavaScript\
    \ 中的 if else 语句具有以下签名：\n\n```javascript\nif(expression1){\n  content\n}\nelse\
    \ if(expression2){\n  content\n}\nelse if(expression3){\n  content\n}\nelse{\n\
    \  content\n}\n```\n\n```javascript\n<script>  \nvar a=20;  \nif(a==10){  \ndocument.write(\"\
    a is equal to 10\");  \n}  \nelse if(a==15){  \ndocument.write(\"a is equal to\
    \ 15\");  \n}  \nelse if(a==20){  \ndocument.write(\"a is equal to 20\");  \n\
    }  \nelse{  \ndocument.write(\"a is not equal to 10, 15 or 20\");  \n}  \n</script>\n\
    ```\n**输出**\na is equal to 20\n\n"
- fmt: "\n# JavaScript switch statement\n\nThe JavaScript `switch` statement is used\
    \ to combine numerous expressions into a single code. It's the same as the `else\
    \ if` statement we learnt on the previous page. It is, however, more useful than\
    \ `if..else..if` because it may be used with integers, characters, and other variables.\n\
    \nThe JavaScript `switch` statement's signature is shown below.\n\n```javascript\n\
    switch(expression){\n  case value1:\n    code to be executed;\n    break;\n  case\
    \ value2:\n    code to be executed;\n    break;\n  ......\n  default:\n    code\
    \ to be executed if above values are not matched;\n}\n```\n\n## Simple example\
    \ - switch statement - javascript\n\n```html\n<script>\n  var grade='B';\n  var\
    \ result;\n  switch(grade){\n    case 'A':  result=\"A Grade\";\n    break;\n\
    \    case 'B':\n      result=\"B Grade\";\n    break;\n    case 'C':\n      result=\"\
    C Grade\";\n    break;\n    default:\n      result=\"No Grade\";\n  }\n  document.write(result);\n\
    </script>\n```\n**OUTPUT**\nB Grade\n\n## Behaviour of switch statement\n\n```html\n\
    <script>\n  var grade='B';\n  var result;\n  switch(grade){\n    case 'A':\n \
    \     result+=\" A Grade\";\n    case 'B':\n      result+=\" B Grade\";\n    case\
    \ 'C':\n      result+=\" C Grade\";\n    default:\n      result+=\" No Grade\"\
    ;\n  }\n  document.write(result);\n</script>\n```\n**OUTPUT**\nundefined B Grade\
    \ C Grade No Grade\n\n# JavaScript Loops\n\nThe `for`, `while`, `do while`, and\
    \ `for-in` loops are used to iterate the piece of code in JavaScript. It reduces\
    \ the size of the code. It's most commonly found in arrays.\n\n1. `for` loop\n\
    2. `while` loop\n3. `do-while` loop\n4. `for-in` loop\n\n## 1) JavaScript For\
    \ loop\n\nThe loop in JavaScript iterates the components for a set number of times.\
    \ If the number of iterations is known, it should be used. The `for` loop's syntax\
    \ is seen below.\n\n```javascript\nfor (initialization; condition; increment)\n\
    {\n  code to be executed\n}\n```\n\n### EXAMPLE\n```html\n<script>\n  for (i=1;\
    \ i<=5; i++)\n  {\n    document.write(i + \"<br/>\")\n  }\n</script>\n```\n**Output:**\n\
    1\n2\n3\n4\n5\n\n## 2) JavaScript while loop\n\nThe `while` loop in JavaScript\
    \ iterates the components an infinite amount of times. If the number of iterations\
    \ is unknown, it should be utilised. The `while` loop's syntax is seen below.\n\
    \n```javascript\nwhile (condition)\n{\n  code to be executed\n}\n```\n\n### EXAMPLE\n\
    ```html\n<script>\n  var i=11;\n  while (i<=15)\n  {\n    document.write(i + \"\
    <br/>\");\n    i++;\n  }\n</script>\n```\n**Output:**\n11\n12\n13\n14\n15\n\n\
    ## 3) Do while loop\n\nThe JavaScript `do while` loop, like the `while` loop,\
    \ iterates the elements indefinitely. Regardless of whether the condition is true\
    \ or false, the code is performed at least once. The following is the syntax for\
    \ the `do while` loop.\n\n```javascript\ndo{\n  code to be executed\n}while (condition);\n\
    ```\n\n### EXAMPLE\n```html\n<script>\n  var i=21;\n  do{\n    document.write(i\
    \ + \"<br/>\");\n    i++;\n  }while (i<=25);\n</script>\n```\n**Output:**\n21\n\
    22\n23\n24\n25\n\n## 4) JavaScript for in loop\n\nThe JavaScript `for in` loop\
    \ is used to cycle through an object's properties.\n\n# JavaScript Functions\n\
    \nTo conduct operations, JavaScript functions are needed. To reuse the code, we\
    \ can call the JavaScript function many times.\n\n## Benefits of Using JavaScript\n\
    \nJavaScript functions have primarily two advantages:\n\n1. **Reusability of code**:\
    \ Because we can call a function multiple times, we can save time coding.\n2.\
    \ **Less coding**: means our program is more compact. To accomplish a common task,\
    \ we don't need to write many lines of code each time.\n\n## JavaScript Function\
    \ Syntax\n\n```javascript\nfunction functionName([arg1, arg2, ...argN]){\n  //code\
    \ to be executed\n}\n```\n\n### EXAMPLE\n```html\n<script>\n  function msg(){\n\
    \    alert(\"hello! this is message\");\n  }\n</script>\n<input type=\"button\"\
    \ onclick=\"msg()\" value=\"call function\"/>\n```\n\n## JavaScript Function Arguments\n\
    \n```html\n<script>\n  function getcube(number){\n    alert(number*number*number);\n\
    \  }\n</script>\n<form>\n  <input type=\"button\" value=\"click\" onclick=\"getcube(4)\"\
    />\n</form>\n```\n\n## Function with Return Value\n\nWe can use a function that\
    \ returns a value in our program by calling it. Let's look at a function that\
    \ returns a value as an example.\n\n```html\n<script>\n  function getInfo(){\n\
    \    return \"hello javatpoint! How r u?\";\n  }\n</script>\n<script>\n  document.write(getInfo());\n\
    </script>\n```\n**OUTPUT**\nhello javatpoint! How r u?\n\n## JavaScript Function\
    \ Object\n\nThe `Function` object `Object() { [native code] }` in JavaScript is\
    \ used to generate a new `Function` object. It runs the code on a global scale.\
    \ When we call the function `Object() { [native code] }` directly, however, a\
    \ function is constructed.\n\n### Syntax\n`function functionName([arg1, arg2,\
    \ ...argN])`\n\n### Function Object Example\n```javascript\nvar add = Function(\"\
    num1\", \"num2\", \"return num1+num2\");\n```\n\n### Function Object Example\n\
    ```javascript\nvar pow = Function(\"num1\", \"num2\", \"return num1*num2\");\n\
    ```\n\n## Defining method - JavaScript Object\n\nIn a JavaScript object, we can\
    \ specify methods. However, before we define the method, we must add a property\
    \ to the function with the same name as the method.\n\n### EXAMPLE\n```html\n\
    <script>\n  function emp(id,name,salary){\n    this.id=id;\n    this.name=name;\n\
    \    this.salary=salary;\n    this.changeSalary=changeSalary;\n  }\n  function\
    \ changeSalary(otherSalary){\n    this.salary=otherSalary;\n  }\n  e=new emp(103,\"\
    Sonoo Jaiswal\",30000);\n  document.write(e.id+\" \"+e.name+\" \"+e.salary);\n\
    \  e.changeSalary(45000);\n  document.write(\"<br>\"+e.id+\" \"+e.name+\" \"+e.salary);\n\
    </script>\n```\n**OUTPUT**\n103 Sonoo Jaiswal 30000\n103 Sonoo Jaiswal 45000\n\
    \n# JavaScript Array\n\nA JavaScript array is an object that represents a group\
    \ of objects of the same type.\n\nIn JavaScript, there are three ways to create\
    \ an array:\n\n1. By array literal\n2. By creating instance of `Array` directly\
    \ (using `new` keyword)\n3. By using an `Array` constructor (using `new` keyword)\n\
    \n## 1) JavaScript array literal\n\n```javascript\nvar arrayname=[value1,value2.....valueN];\n\
    ```\nValues are contained within `[]` and separated by, as you can see (comma).\n"
