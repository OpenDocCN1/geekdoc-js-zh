    (1, 2, 3, 4)


    (1, 3, 5)


    ## Negative Indexing


    Negative indexing can also be used to reach the tuple element. The rightmost element
    has an index of -1, while the second last item has an index of -2, and so on.


    Negative indexing is used to navigate the items from left to right. Consider the
    following illustration:


    1.  tuple1 = (1, 2, 3, 4, 5)    


