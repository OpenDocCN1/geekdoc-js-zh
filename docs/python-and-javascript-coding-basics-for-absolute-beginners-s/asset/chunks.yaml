    Math.round(n)


    The math in JavaScript. The round(n) method gives the nearest rounded integer
    for a supplied number. If the fractional component is equal to or higher than
    0.5, it is assigned to the upper value 1; otherwise, it is assigned to the lower
    value 0\. For instance, 4 for 3.7, 3 for 3.3, 6 for 5.9, and so on.


    1.  Round of 4.3 is: <span id="p6"></span><br>    


