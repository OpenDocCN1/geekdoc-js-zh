    This is string literal\n\n### 2) 通过字符串对象（使用 new 关键字）\n\n以下是使用 `new` 关键字创建字符串对象的语法：\n\
    \n```javascript\nvar stringname=new String(\"string literal\");\n```\n\n`new`\
    \ 关键字用于创建字符串实例。\n\n让我们来看在 JavaScript 中使用 `new` 关键字创建字符串的示例。\n\n```javascript\n\
