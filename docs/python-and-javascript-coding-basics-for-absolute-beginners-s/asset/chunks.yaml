    102 Shyam Kumar 40000


    ![](Images/image00216.jpeg)


    EXAMPLE


    1.  <script>  


    2.  var emp=new Object();  


    3.  emp.id=101;  


    4.  emp.name="Ravi Malik";  


    5.  emp.salary=50000;  


    6.  document.write(emp.id+" "+emp.name+" "+emp.salary);  


    7.  </script>  


    OUTPUT


    101 Ravi 50000


    ![](Images/image00217.jpeg)


    EXAMPLE


    1.  <script>  


    2.  function emp(id,name,salary){  


    3.  this.id=id;  


    4.  this.name=name;  


    5.  this.salary=salary;  


    6.  }  


