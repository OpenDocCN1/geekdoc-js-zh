  trans: "\n\n通过循环控制语句，我们可以改变 `while` 循环的标准执行顺序。当 `while` 循环结束时，在该作用范围内定义的所有自动对象都会被销毁。在\
    \ `while` 循环内部，Python 提供了控制语句。\n\n### 1. Continue 语句\n当遇到 `continue` 语句时，控制将返回循环的开头。让我们来看一个例子。\n\
    \n示例：\n```python\n# prints all letters except 'a' and 't'\ni = 0\nstr1 = 'javapoint'\n\
    while i < len(str1):\n    if str1[i] == 'a' or str1[i] == 't':\n        i += 1\n\
    \        continue\n    print('Current Letter :', str1[i])\n    i += 1\n```\n输出:\n\
    ```\nCurrent Letter : j\nCurrent Letter : v\nCurrent Letter : p\nCurrent Letter\
    \ : o\nCurrent Letter : i\nCurrent Letter : n\n```\n\n### 2. Break 语句\n当遇到 `break`\
    \ 语句时，控制将离开循环。\n\n示例：\n```python\n# 当 break 语句很快遇到 t 时，控制发生转移\ni = 0\nstr1 = 'javapoint'\n\
    while i < len(str1):\n    if str1[i] == 't':\n        i += 1\n        break\n\
    \    print('Current Letter :', str1[i])\n    i += 1\n```\n输出:\n```\nCurrent Letter\
    \ : j\nCurrent Letter : a\nCurrent Letter : v\nCurrent Letter : a\n```\n\n###\
    \ 3. Pass 语句\n使用 `pass` 语句声明空循环。它也可以用于定义空类、函数或控制语句。让我们来看一个例子。\n\n示例：\n```python\n\
    # An empty loop\nstr1 = 'javapoint'\ni = 0\nwhile i < len(str1):\n    i += 1\n\
    \    pass\nprint('Value of i :', i)\n```\n输出:\n```\nValue of i : 9\n```\n\n###\
    \ 示例\n使用此程序打印给定数字的表格。\n```python\ni=1\nnumber=0\nb=9\nnumber = int(input(\"Enter\
