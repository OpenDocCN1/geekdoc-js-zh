    Python 缩进用于定义代码块。C、C++ 和 Java 等其他编程语言使用大括号，而 Python 使用缩进。在 Python 中，使用空白字符来表示缩进。


    缩进用于代码的开头，并在意料之外的行结束。代码块由相同的行缩进（函数体、循环等）定义。


    在大多数情况下，使用四个空格作为缩进。缩进量由用户决定，但在整个块中必须保持一致。


