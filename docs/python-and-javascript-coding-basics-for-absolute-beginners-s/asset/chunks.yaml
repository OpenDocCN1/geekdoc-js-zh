    # Python Variables


    A variable is a term that refers to a memory region. A Python variable, often
    known as an identifier, is a container for data.


    Because Python is an infer language, we don''t need to describe the type of variable
    because it is smart enough to figure it out.


    Variable names can consist of a combination of letters and digits, but they must
    start with a letter or underscore.


    The variable name should be written in lowercase letters. Both rahul and rahul
    are two distinct variables.


    ## Identifier Naming


    Identifiers are examples of variables. The literals in the program are identified
    using an Identifier. The following are the rules for naming an identifier.


    *   The variable''s initial character must be an alphabet or underscore ( ).


    *   All characters except the first may be a lower-case (a-z), upper-case (A-Z),
    underscore, or digit alphabet (0-9).


    *   There must be no whitespace or special characters in the identifier name (!,
    @, #, percent,,, &, *).


    *   The name of the identifier must not be identical to any of the language''s
    keywords.


    *   Case matters when it comes to identifier names; for example, my name and MyName
    are not the same thing.


    *   Valid identifiers include a123, _n, n 9, and others.


    *   1a, n percent 4, n 9, and other incorrect identifiers are examples.


    ## Declaring Variable


    Python does not require us to declare variables before utilising them in our code.
    It enables us to construct a variable at a certain point in time.


    In Python, we don''t need to declare variables explicitly. Any time we assign
    a value to a variable, it is automatically defined.


    A variable''s value is assigned using the equal (=) operator.


    ## Object References


    When declaring a variable, it''s important to understand how the Python interpreter
    works. The way variables are handled differs from that of many other programming
    languages.


    Because Python is an object-oriented programming language, each data item belongs
    to a specific type of class. Consider the following illustration.


    1.  print("John")  


    Output:


    John


    The Python object builds and displays an integer object on the terminal. We created
    a string object in the print command above. Let''s see what type it is using the
    built-in type() function in Python.


    1.  type("John")  


    Output:


    <class ''str''>


    Variables are a symbolic term for a reference or pointer to an object in Python.
    The variables are used to represent objects with the same name.


    Let''s take a look at the following example.


    a = 50 


    ![](Images/image00169.jpeg)


    The variable an in the illustration above corresponds to an integer object.


    Assume we give a new variable b the integer value 50.


    a = 50


    b = a


    ![](Images/image00170.jpeg)


    Because Python does not generate new objects, the variable b refers to the same
    object as a.


    Let''s change the value of b. Both variables will now relate to distinct objects.


    a = 50


    b =100


    ![](Images/image00171.jpeg)


    If we assign the same variable to two different values, Python maintains memory
    efficiently.


    ## Object Identity


    Every created object in Python has a unique identifier. Python ensures that no
    two objects share the same identifier. The object identification is identified
    using the built-in id() function. Consider the following illustration.


    1.  a = 50  


    2.  b = a  


    3.  print(id(a))  


    4.  print(id(b))  


    5.  # Reassigned variable a  


    6.  a = 500  


    7.  print(id(a))


    Output:


    140734982691168


    140734982691168


    2822056960944


    We set b = a because a and b both refer to the same thing. The id() function returned
    the same number when we examined it. We changed the value of a to 500, and it
    now refers to the new object identification.


    # Python Data Types


    Values can be stored in variables, and each value has a data type. Because Python
    is a dynamically typed language, we don''t need to specify the variable''s type
    when declaring it. The value is implicitly bound to its type by the interpreter.


    1.  a = 5  


    We didn''t define the type of the variable a, which has the integer value of five.
    Variable a will be automatically interpreted as an integer type by the Python
    interpreter.


    The type of a variable used in a program can be checked using Python. The type()
    method in Python returns the type of the variable supplied to it.


    Consider the following scenario for defining the values of various data kinds
    and determining their type.


    1.  a=10  


    2.  b="Hi Python"  


    3.  c = 10.5  


    4.  print(type(a))  


    5.  print(type(b))  


    6.  print(type(c))  


    Output:


    <type ''int''>


    <type ''str''>


    <type ''float''>


    ## Standard data types


    Different types of values can be stored in a variable. A person''s name, for example,
    must be saved as a string, whereas his or her id must be recorded as an integer.


    Python supports a number of standard data types, each with its own storage technique.
    The following is a list of Python data types.


    1.  Numbers


    2.  Sequence Type


    3.  Boolean


    4.  Set


    5.  Dictionary


    ![](Images/image00172.jpeg)


    We''ll give a quick overview of the above data types in this section of the lesson.
    Later in this course, we''ll go over each of them in depth.


    ### Numbers


    Number is a type of data that stores numerical values. A Python Numbers data-type
    has integer, float, and complex values. The type() method in Python can be used
    to determine the data type of a variable. The isinstance() function is used to
    determine whether an object belongs to a specific class.


    When a variable is assigned a number, Python produces Number objects. As an example;


    1.  a = 5  


    2.  print("The type of a", type(a))  


    4.  b = 40.5  


    5.  print("The type of b", type(b))  


    7.  c = 1+3j  


    8.  print("The type of c", type(c))  


    9.  print(" c is a complex number", isinstance(1+3j,complex)) 


    Output:


    The type of a <class ''int''>


    The type of b <class ''float''>


    The type of c <class ''complex''>


    c is complex number: True


    Python recognises three types of numerical data.


    Integer values can be any length, such as 10, 2, 29, -20, -150, and so on. An
    integer''s length is not limited in Python. Its value is an int.


    Float is used to store floating-point numbers such as 1.9, 9.902, 15.2, and so
    on. It has a precision of up to 15 decimal places.


    A complex number is made up of an ordered pair, i.e., x + iy, where x and y represent
    the real and imaginary parts, respectively. Complex numbers such as 2.14j, 2.0
    + 2.3j, and so on.


    # Python Keywords


    Python keywords are reserved words that communicate a specific meaning to the
    compiler/interpreter. Each keyword has a distinct meaning and a distinct operation.
    These keywords are ineligible for use as variables. The list of Python keywords
    is as follows.


    ![](Images/image00173.jpeg)


    True - It represents the Boolean true, which means that if the given condition
    is true, it returns "True." Non-zero values are assumed to be true.


    False - It represents the Boolean false; it returns "False" if the given condition
    is false. A value of zero is interpreted as false.


    None - It denotes a null or void value. An empty list or Zero cannot be used to
    represent None.


    And - It is also a logical operator. It''s used to test for multiple conditions.
    If both conditions are met, it returns true. Consider the truth table below.


    ![](Images/image00174.jpeg)


    or - In Python, it is a logical operator. If one of the conditions is met, it
    returns true. Consider the truth table below.


    ![](Images/image00175.jpeg)


    not - It''s a logical operator that flips the truth value. Consider the truth
    table below.


    ![](Images/image00176.jpeg)


    assert - In Python, this keyword is used as a debugging tool. It verifies the
    code''s correctness. If an error is found in the code, it raises an AssertionError
    and prints an error message.


    Example:


    1.  a = 10  


    2.  b = 0  


    3.  print(''a is dividing by Zero'')  


