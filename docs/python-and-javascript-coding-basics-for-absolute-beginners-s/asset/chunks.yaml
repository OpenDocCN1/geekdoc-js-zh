    ![](Images/image00215.jpeg)


    EXAMPLE


    1.  <script>  


    2.  emp={id:102,name:"Shyam Kumar",salary:40000}  


    3.  document.write(emp.id+" "+emp.name+" "+emp.salary);  


    4.  </script> 


