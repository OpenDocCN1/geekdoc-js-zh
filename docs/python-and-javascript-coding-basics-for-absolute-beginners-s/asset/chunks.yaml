    # Introduction to Python


    Python has a variety of beneficial features that distinguish it from other programming
    languages. It enables object-oriented programming, procedural programming, and
    memory allocation that is dynamic. A few crucial aspects are described below.


    ### 1) Easy to Learn

    Python is a simple programming language to learn when compared to other programming
    languages. Its syntax is simple and similar to that of the English language. The
    semicolon and curly brackets are not used; instead, the indentation defines the
    code block. For novices, it is the suggested programming language.


    ### 2) Expressive Language

    Python is capable of performing complex tasks with just a few lines of code. For
    example, to run the hello world program, simply type `print ("Hello World")`.
    It will just require one line of code to run, whereas Java or C will require numerous
    lines.


    ### 3) Interpreted Language

    Python is an interpreted language, which implies that each line of a Python program
    is executed separately. The benefit of being an interpreted language is that debugging
    is simple and portable.


    ### 4) Cross-platform Language

    Python can operate on a variety of platforms, including Windows, Linux, UNIX,
    and Macintosh. As a result, we may conclude that Python is a portable programming
    language. It allows programmers to create software for several rival platforms
    by creating only one program.


    ### 5) Free and Open Source

    Python is a free programming language that anyone can use. On its official website,
    `www.python.org`, it is freely available. It has a vast community all around the
    world working hard to create new Python modules and functions. The Python community
    welcomes contributions from everyone. "Anyone can get its source code without
    paying a penny," says open-source.


    ### 6) Object-Oriented Language

    Python enables object-oriented programming, which introduces the notions of classes
    and objects. It allows for inheritance, polymorphism, and encapsulation, among
    other things. The object-oriented method aids programmers in writing reusable
    code.


    ### 7) Extensible

    It means that other languages like `C++` can be used within Python.


    ### 8) Large Standard Library

    It offers diverse set of libraries for machine learning including `Pandas`, `Numpy`,
    `Keras`, and `Pytorch`.


    ### 9) GUI Support

    For the development of desktop, a graphical interface is used like `PyQt5`, `Tkinter`,
    and `Kivy`.


    ### 10) Integrated

    It''s simple to integrate with languages like `C++` and `Java`.


    ### 11. Embeddable

    Python can be embedded into programs.


    ### 12. Dynamic Memory Allocation

    Memory is allocated at runtime. When we assign a value to a variable, memory is
    handled automatically.


    # Install Python


    The first step toward becoming a developer is to understand how to install and
    update Python. We''ll go over how to install Python on various systems.


    ## Installation on Windows

    To get the newest version of Python, go to `https://www.python.org/downloads/`.
    We will install it on our operating system.


    Step 1: Select Python''s version - download.

    (Images/00161.jpeg)


    Step 2: Click Install Now

    Double-click the downloaded executable file to bring up the following window.
    Proceed by selecting Customize. When you select the `Add Path` check box, the
    Python path will be automatically configured.

    (Images/00162.jpeg)


    We may also select the required location and features by clicking on the customize
    installation button. Another key factor to consider is whether to install a launcher
    for all users.


    Step 3: Installation in Process

    (Images/00163.jpeg)


    Try running `python` from the command prompt. If you''re using Python 3, type
    `python -version`.

    (Images/00164.jpeg)


    # First Python Program


    In this section, we''ll go through Python''s fundamental syntax and run a simple
    program that prints Hello World to the terminal.


    Python gives us two options for running a program:

    * Using a prompt from an interactive interpreter

    * Making use of a script file


    ## Interactive interpreter prompt

    At the interactive prompt, Python allows us to execute each Python statement one
    by one. When we are concerned with the output of each line of our Python program,
    it is preferable.


    To enter interactive mode, type `python` on the terminal (or command prompt) (`python3`
    in case if you have Python2 and Python3 both installed on your system).


    It will open the prompt below, where we can run the Python statement and see how
    it affects the terminal.


    ```

    print("Hello World")

    ```

    (Images/00165.jpeg)


    ## Multi-line Statements

    Multi-line statements are typed into a notepad like text editor and saved as `.py`
    files. We''ve used the Python script to describe the execution of numerous code
    lines in the following example.


    ```python

    name = "Andrew Venis"

    branch = "Computer Science"

    ```

