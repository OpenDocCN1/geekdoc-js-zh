    ### 数字


    数字是存储数值的数据类型。Python 的数字数据类型包含整数（integer）、浮点数（float）和复数（complex）值。Python 中的 `type()`
    方法可确定变量的数据类型。`isinstance()` 函数用于判断对象是否属于特定的类。


    当给变量分配数字时，Python 会产生数字对象。例如：


    ```

    1. a = 5

