    # Python Tuple


    Python Tuple is a data structure for storing a sequence of immutable Python objects.
    The tuple is similar to lists in that the value of the items placed in the list
    can be modified, however the tuple is immutable and its value cannot be changed.


    Creating a tuple


    The collection of comma-separated (,) values contained by small () brackets is
    known as a tuple. The use of parentheses is optional, however it is recommended.
    The following is a definition of a tuple.


    1.  T1 = (101, "Peter", 22)    


