    \ 循环，则不会执行 `else` 块，而是执行 `else` 块之后的语句。在使用 `while` 循环时，`else` 语句是可选的。考虑以下场景。\n\
    \n### 示例 1\n```python\ni=1\nwhile(i<=5):\n    print(i)\n    i=i+1\nelse:\n   \
