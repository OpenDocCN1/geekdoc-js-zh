    Math.sqrt(n)


    The square root of a number is returned by the JavaScript math.sqrt(n) method.


    1.  Square Root of 17 is: <span id="p1"></span>    


    2.  <script>    


    3.  document.getElementById(''p1'').innerHTML=Math.sqrt(17);    


