    In the same way that lists are indexed, tuples are indexed as well. The index
    value of each item in the tuple can be used to access it.


    ## Tuple indexing and slicing


    The tuple''s indexing and slicing are analogous to lists. The tuple''s indexing
    begins at 0 and ends at length(tuple) - 1.


    The index [] operator can be used to access the items in the tuple. The colon
    operator in Python can also be used to access multiple items in a tuple.


    To further comprehend indexing and slicing, look at the image below.


    ![](Images/image00199.jpeg)


    1.  tup = (1,2,3,4,5,6,7)  


