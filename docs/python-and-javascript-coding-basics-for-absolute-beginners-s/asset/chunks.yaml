    ## 标准数据类型


    变量可以存储不同类型的值。例如，人的名字必须保存为字符串，而他的 ID 必须被记录为整数。


    Python 支持多种标准数据类型，每种类型都有自己的存储技术。以下是 Python 数据类型的列表：


    1. 数字 (Numbers)

    2. 序列类型 (Sequence Type)

    3. 布尔值 (Boolean)

    4. 集合 (Set)

