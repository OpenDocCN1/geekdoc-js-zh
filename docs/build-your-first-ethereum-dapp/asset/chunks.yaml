  trans: "\n接下来，我们计算提交一个新条目需要多少费用，然后检查交易附带的价值是否等于或大于该费用。\n\n```\nbytes32 hash = keccak256(abi.encodePacked(_content,\
    \ block.number));\nrequire(!submissions[hash].exists, \"Submission must not already\
    \ exist in same block!\");\n```\n\n然后我们计算该条目的哈希值（`bytes32` 是一个固定大小为 32 字节的数组，即\
    \ 32 个字符，这也是 `keccak256` 输出的长度）。我们使用这个哈希值来检查是否已存在具有该哈希值的提交，如果存在则取消所有操作。\n\n```\n\
    submissions[hash] = Submission(\n    _content,\n    _image,\n    submissionIndex.push(hash),\n\
    \    msg.sender,\n    true\n);\n```\n\n这部分在 `submissions` 映射中的哈希位置创建了一个新的提交。它通过合约中上面定义的新结构体直接传入值。请注意，虽然你可能习惯其他语言中的\
    \ `new` 关键字，但这里不需要（也不允许）使用它。然后我们触发事件（不言自明），最后是 `nonDeletedSubmissions += 1;`：这增加了下一个提交的费用（参见\
    \ `calculateSubmissionFee`）。\n\n但这里缺少很多逻辑。我们还需要：\n\n*   处理图片，以及\n*   检查提交账户的白名单/黑名单状态以及是否拥有\
    \ 1 个 TNS 代币。\n\n我们先处理图片。我们最初的计划是每 50 条文本才能提交一张图片。我们需要再添加两个合约属性：\n\n```\nuint256\
    \ public imageGapMin = 50;\nuint256 public imageGap = 0;\n```\n\n想必你已经能猜到我们要如何处理了？让我们在\
    \ `createSubmission` 方法中，在 `submissions[hash] = ...` 创建新提交之前，添加以下代码：\n\n```\n\
    if (_image) {\n    require(imageGap >= imageGapMin, \"Image can only be submitted\
    \ if more than {imageGapMin} texts precede it.\");\n    imageGap = 0;\n} else\
    \ {\n    imageGap += 1;\n}\n```\n\n非常简单：如果条目是图片，则先检查图片之间的间隔是否大于 49，如果是则将其重置为 0。否则，间隔加\
    \ 1。就这样，每第 50 次（或更多）提交现在可以是图片。\n\n最后，我们进行访问检查。我们可以将此代码放在费用计算*之前*，紧接在函数入口之后，因为访问检查应该首先进行。\n\
    \n```\nrequire(token.balanceOf(msg.sender) >= 10**token.decimals());\nrequire(whitelist[msg.sender],\
    \ \"Must be whitelisted\");\nrequire(!blacklist[msg.sender], \"Must not be blacklisted\"\
    );\n```\n\n第一行检查消息发送者拥有的代币数量是否大于 10 的（代币合约中小数位数）次方（因为我们可以更改代币地址，所以以后可能会有其他代币取代我们的代币，而那个代币可能没有\
    \ 18 位小数！）。换句话说，在我们的例子中，`10**token.decimals` 就是 `10**18`，即 `1 000 000 000 000\
    \ 000 000`，也就是 1 后面跟 18 个零。如果我们的代币有 18 位小数，那就是 `1.000000000000000000`，即一个（1）TNS\
    \ 代币。请注意，你的编译器或 linter 在分析此代码时可能会给出一些警告。这是因为代币的 `decimals` 属性是公开的，因此其 getter 函数是自动生成的（`decimals()`），但它并未明确列在合约顶部我们列出的代币接口中。为了解决这个问题，我们可以通过添加以下行来更改接口：\n\
    \n```\nfunction decimals() public view returns (uint256);\n```\n\n还有一件事：由于使用合约的所有者费用当前设置为\
    \ 1%，让我们将所有者可以提取的金额单独存放，其余部分保留在 DAO 中。最简单的方法是跟踪所有者可以提取的金额，并在每次提交创建后增加该数字。让我们向合约添加一个新属性：\n\
    \n```\nuint256 public withdrawableByOwner = 0;\n```\n\n然后将其添加到 `createSubmission`\
    \ 函数的末尾：\n\n```\nwithdrawableByOwner += fee.div(daofee);\n```\n\n我们可以通过如下函数让所有者提取资金：\n\
    \n```\nfunction withdrawToOwner() public {\n    owner.transfer(withdrawableByOwner);\n\
    \    withdrawableByOwner = 0;\n}\n```\n\n这将允许的金额发送给所有者，并将计数器重置为 0。如果所有者不想提取全部金额，我们可以为这种边缘情况添加另一个函数：\n\
    \n```\nfunction withdrawAmountToOwner(uint256 _amount) public {\n    uint256 withdraw\
    \ = _amount;\n    if (withdraw > withdrawableByOwner) {\n        withdraw = withdrawableByOwner;\n\
    \    }\n    owner.transfer(withdraw);\n    withdrawableByOwner = withdrawableByOwner.sub(withdraw);\n\
    }\n```\n\n由于我们经常需要通过哈希值引用提交，让我们编写一个函数来检查提交是否存在，以便我们可以用其替换 `submissions[hash].exists`\
    \ 检查：\n\n```\nfunction submissionExists(bytes32 hash) public view returns (bool)\
    \ {\n    return submissions[hash].exists;\n}\n```\n\n还需要一些其他辅助函数来读取提交：\n\n```\n\
    function getSubmission(bytes32 hash) public view returns (bytes content, bool\
    \ image, address submitter) {\n    return (submissions[hash].content, submissions[hash].image,\
    \ submissions[hash].submitter);\n}\n\nfunction getAllSubmissionHashes() public\
    \ view returns (bytes32[]) {\n    return submissionIndex;\n}\n\nfunction getSubmissionCount()\
    \ public view returns (uint256) {\n    return submissionIndex.length;\n}\n```\n\
    \n这些不言自明。`getSubmission` 获取提交数据，`getAllSubmissionHashes` 获取系统中所有唯一的哈希值，`getSubmissionCount`\
    \ 列出总共有多少提交（包括已删除的）。我们在客户端（UI 中）使用这些函数的组合来获取内容。\n\n完整的 `createSubmission` 函数现在如下所示：\n\
    \n```\nfunction createSubmission(bytes _content, bool _image) storyActive external\
    \ payable {\n\n    require(token.balanceOf(msg.sender) >= 10**token.decimals());\n\
    \    require(whitelist[msg.sender], \"Must be whitelisted\");\n    require(!blacklist[msg.sender],\
    \ \"Must not be blacklisted\");\n\n    uint256 fee = calculateSubmissionFee();\n\
    \    require(msg.value >= fee, \"Fee for submitting an entry must be sufficient.\"\
    );\n\n    bytes32 hash = keccak256(abi.encodePacked(_content, block.number));\n\
    \    require(!submissionExists(hash), \"Submission must not already exist in same\
    \ block!\");\n\n    if (_image) {\n        require(imageGap >= imageGapMin, \"\
    Image can only be submitted if more than {imageGapMin} texts precede it.\");\n\
    \        imageGap = 0;\n    } else {\n        imageGap += 1;\n    }\n\n    submissions[hash]\
    \ = Submission(\n        _content,\n        _image,\n        submissionIndex.push(hash),\n\
    \        msg.sender,\n        true\n    );\n\n    emit SubmissionCreated(\n  \
    \      submissions[hash].index,\n        submissions[hash].content,\n        submissions[hash].image,\n\
    \        submissions[hash].submitter\n    );\n\n    nonDeletedSubmissions += 1;\n\
    \    withdrawableByOwner += fee.div(daofee);\n}\n```\n\n### 删除\n\n那么删除提交呢？这很简单：我们只需将\
    \ `exists` 标志切换为 `false`！\n\n```\nfunction deleteSubmission(bytes32 hash) internal\
    \ {\n    require(submissionExists(hash), \"Submission must exist to be deletable.\"\
    );\n    Submission storage sub = submissions[hash];\n\n    sub.exists = false;\n\
    \    deletions[submissions[hash].submitter] += 1;\n\n    emit SubmissionDeleted(\n\
    \        sub.index,\n        sub.content,\n        sub.image,\n        sub.submitter\n\
    \    );\n\n    nonDeletedSubmissions -= 1;\n}\n```\n\n首先，我们确保提交存在且尚未被删除；然后从存储中检索它。接下来，我们将其\
    \ `exists` 标志设置为 false，将该地址在 DAO 中的删除次数增加 1（这在以后跟踪用户有多少条目被删除时很有用；这可能导致黑名单！），并触发一个删除事件。\n"
- fmt: "\nFinally, we reduce the new submission creation fee by reducing the number\
    \ of non-deleted submissions in the system. Let’s not forget to add a new property\
    \ to our contract as well — one to track these deletions:\n\n```\nmapping (address\
    \ => uint256) public deletions;\n```\n\n## Deployments Get More Complicated\n\n\
    Now that we’re using tokens in another contract, we need to update the deployment\
    \ script (`3_deploy_storydao`) to pass the token’s address into the constructor\
    \ of the `StoryDao`, like so:\n\n```\nvar Migrations = artifacts.require(\"./Migrations.sol\"\
    );\nvar StoryDao = artifacts.require(\"./StoryDao.sol\");\nvar TNSToken = artifacts.require(\"\
    ./TNSToken.sol\");\n\nmodule.exports = function(deployer, network, accounts) {\n\
    if (network == \"development\") {\n    deployer.deploy(StoryDao, TNSToken.address,\
    \ {from: accounts[0]});\n} else {\n    deployer.deploy(StoryDao, TNSToken.address);\n\
    }\n};\n```\n\nRead more about configuring deployments [here](https://truffleframework.com/docs/getting_started/migrations).\n\
    \n## Conclusion\n\nIn this part, we added the ability for participants to buy\
    \ tokens from our DAO and to add submissions into the story. Another part of the\
    \ DAO contract remains: voting and democratization. That’s what we’ll handle in\
    \ the next part.\n\n# Chapter 6: Voting with Custom Tokens\n\n**In [part 5](#part0006_split_000.html_5N3C0-63b9e60a50594bb1b6dced0e79731cb3)\
    \ of this tutorial series on building DApps with Ethereum, we dealt with adding\
    \ content to the story, looking at how to add the ability for participants to\
    \ buy tokens from the DAO and to add submissions into the story. It’s now time\
    \ for the DAO’s final form: voting, blacklisting/unblacklisting, and dividend\
    \ distribution and withdrawal. We’ll throw in some additional helper functions\
    \ for good measure.**\n\nIf you get lost in all this, the full source code is\
    \ available in the [the repo](https://github.com/bitfalls/storydao).\n\n#### Github\n\
    \nIf you get lost in all this, the full source code is available in the [the repo](https://github.com/bitfalls/storydao).\n\
    \n## Votes and Proposals\n\nWe’ll be issuing `Proposal`s and voting with `Vote`s.\
    \ We need two new structs:\n\n```\nstruct Proposal {\n    string description;\n\
    \    bool executed;\n    int256 currentResult;\n    uint8 typeFlag; // 1 = delete\n\
    \    bytes32 target; // ID of the proposal target. I.e. flag 1, target XXXXXX\
    \ (hash) means proposal to delete submissions[hash]\n    uint256 creationDate;\n\
    \    uint256 deadline;\n    mapping (address => bool) voters;\n    Vote[] votes;\n\
    \    address submitter;\n}\n\nProposal[] public proposals;\nuint256 proposalCount\
    \ = 0;\nevent ProposalAdded(uint256 id, uint8 typeFlag, bytes32 hash, string description,\
    \ address submitter);\nevent ProposalExecuted(uint256 id);\nevent Voted(address\
    \ voter, bool vote, uint256 power, string justification);\n\nstruct Vote {\n \
    \   bool inSupport;\n    address voter;\n    string justification;\n    uint256\
    \ power;\n}\n```\n\nA `Proposal` will have a mapping of voters to prevent people\
    \ from voting on a proposal twice, and some other metadata which should be self-explanatory.\
    \ The `Vote` will either be a yes or no vote, and will remember the voter along\
    \ with their justification for voting a certain way, and the voting power — the\
    \ number of tokens they want to devote to voting for this proposal. We also added\
    \ an array of `Proposal`s so we can store them somewhere, and a counter for counting\
    \ how many proposals there are.\n\nLet’s build their accompanying functions now,\
    \ starting with the voting function:\n\n```\nmodifier tokenHoldersOnly() {\n \
    \   require(token.balanceOf(msg.sender) >= 10**token.decimals());\n    _;\n}\n\
    \nfunction vote(uint256 _proposalId, bool _vote, string _description, uint256\
    \ _votePower) tokenHoldersOnly public returns (int256) {\n\n    require(_votePower\
    \ > 0, \"At least some power must be given to the vote.\");\n    require(uint256(_votePower)\
    \ <= token.balanceOf(msg.sender), \"Voter must have enough tokens to cover the\
    \ power cost.\");\n\n    Proposal storage p = proposals[_proposalId];\n\n    require(p.executed\
    \ == false, \"Proposal must not have been executed already.\");\n    require(p.deadline\
    \ > now, \"Proposal must not have expired.\");\n    require(p.voters[msg.sender]\
    \ == false, \"User must not have already voted.\");\n\n    uint256 voteid = p.votes.length++;\n\
    \    Vote storage pvote = p.votes[voteid];\n    pvote.inSupport = _vote;\n   \
    \ pvote.justification = _description;\n    pvote.voter = msg.sender;\n    pvote.power\
    \ = _votePower;\n\n    p.voters[msg.sender] = true;\n\n    p.currentResult = (_vote)\
    \ ? p.currentResult + int256(_votePower) : p.currentResult - int256(_votePower);\n\
    \    token.increaseLockedAmount(msg.sender, _votePower);\n\n    emit Voted(msg.sender,\
    \ _vote, _votePower, _description);\n    return p.currentResult;\n}\n```\n\nNotice\
    \ the function modifier: by adding that modifier into our contract, we can attach\
    \ it to any future function and make sure only token holders can execute that\
    \ function. It’s a reusable security check!\n\nThe `vote` function does some sanity\
    \ checks like the voting power being positive, the voter having enough tokens\
    \ to actually vote etc. Then we fetch the proposal from storage and make sure\
    \ it’s neither expired nor already executed. It wouldn’t make sense to vote on\
    \ a proposal that’s already done. We also need to make sure this person hasn’t\
    \ yet voted. We could allow changing the vote power, but this opens the DAO to\
    \ some vulnerabilities like people withdrawing their votes at the last minute\
    \ etc. Perhaps a candidate for a future version?\n\nThen we register a new `Vote`\
    \ into the proposal, change the current result for easy lookup of scores, and\
    \ finally emit the `Voted` event. But what’s `token.increaseLockedAmount`?\n\n\
    This bit of logic increases the amount of locked tokens for a user. The function\
    \ is only executable by the owner of the token contract (by this point that’s\
    \ hopefully the DAO) and will prevent the user from sending an amount of tokens\
    \ that exceeds the locked amount registered to their account. This lock is lifted\
    \ after the proposal falls through or executes.\n\nLet’s write the functions for\
    \ proposing the deletion of an entry now.\n\n## Voting to Delete and Blacklist\n\
    \nAs established in [part 1](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup)\
    \ in this series, we have three entry deletion functions planned:\n\n1.  **Remove\
    \ entry**: when confirmed by vote, the target entry is removed. Voting time: **48\
    \ hours**.\n\n2.  **Emergency remove entry [Only Owner]**: can only be triggered\
    \ by Owner. When confirmed by vote, the target entry is removed. Voting time:\
    \ **24 hours**.\n\n3.  **Emergency remove image [Only Owner]**: only applies to\
    \ image entries. Can only be triggered by Owner. When confirmed by vote, the target\
    \ entry is removed. Voting time: **4 hours**.\n\nFive deletions of a single address’\
    \ entries lead to a blacklisting.\n\nLet’s see how we can do that now. First up,\
    \ the deletion functions:\n"
