  trans: "\n该函数随后进行一些合理性检查。首先，它检查目标地址是否为空地址。换句话说，代币不能被发送到虚无之中。接着，它通过比较发送者的余额（`balances[msg.sender]`）与传入的发送数量，来检查发送者是否有权限发送这么多代币。如果任何一项检查失败，该函数将拒绝交易并失败。它会退还已发送的任何代币，但执行到该点所消耗的\
    \ gas 将已被花费。\n\n接下来的两行从发送者的余额中减去代币数量，并将该数量添加到目标余额中。然后使用 `emit` 触发事件，并传入一些值：发送者、接收者和数量。任何订阅了此合约上\
    \ `Transfer` 事件的客户端现在都会收到此事件的通知。\n\n好了，现在我们的代币持有者可以四处发送代币了。信不信由你，这就是一个基础代币所需的全部功能。但我们还要更进一步，添加更多功能。\n\
    \n### 授权额度\n\n有时，第三方可能被授权从另一个账户的余额中提取代币。这对于可能促进游戏内购买、去中心化交易所等的游戏非常有用。我们通过构建一个名为\
    \ `allowance` 的多维 `mapping` 来实现这一点，它存储了所有此类权限。让我们添加以下内容：\n\n```\nmapping (address\
    \ => mapping (address => uint256)) internal allowed;\nevent Approval(address indexed\
    \ owner, address indexed spender, uint256 value);\n```\n\n该事件的存在是为了让监听的应用程序能够知道何时有人预先批准了他人花费其余额——这是一个有用的功能，也是[标准](https://github.com/ethereum/EIPs/issues/20)的一部分。\n\
    \n该映射将地址与另一个映射结合起来，而后者将地址与数字结合起来。它基本上形成了一个类似这样的电子表格：\n\n![数值表](img/00002.jpeg)\n\
    \n因此，Bob 的余额可以被 Mary 最多花费 1000 个代币，被 Billy 最多花费 50 个代币。Mary 的余额可以被 Bob 最多花费 750\
    \ 个代币。Billy 的余额可以被 Mary 最多花费 300 个代币，被 Joe 最多花费 1500 个代币。\n\n鉴于这个映射是 `internal`\
    \ 的，它只能被本合约中的函数以及以本合约为基类的合约使用。\n\n要批准他人从你的账户中花费代币，你需要调用 `approve` 函数，传入被允许花费你代币的人的地址以及允许他们花费的金额，并在函数中触发一个\
    \ `Approval` 事件：\n\n```\nfunction approve(address _spender, uint256 _value) public\
    \ returns (bool) {\n  allowed[msg.sender][_spender] = _value;\n  emit Approval(msg.sender,\
    \ _spender, _value);\n  return true;\n}\n```\n\n我们还需要一种方法来读取一个用户可以从另一个用户账户中花费多少：\n\
    \n```\nfunction allowance(address _owner, address _spender) public view returns\
    \ (uint256) {\n    return allowed[_owner][_spender];\n}\n```\n\n所以这是另一个 `read\
    \ only` 函数（`view`），这意味着它是免费执行的。它只是读取剩余的可提取余额。\n\n那么如何代表他人发送呢？通过一个新的 `transferFrom`\
    \ 函数：\n\n```\nfunction transferFrom(address _from, address _to, uint256 _value)\
    \ public returns (bool) {\n    require(_to != address(0));\n    require(_value\
    \ <= balances[_from]);\n    require(_value <= allowed[_from][msg.sender]);\n\n\
    \    balances[_from] = balances[_from].sub(_value);\n    balances[_to] = balances[_to].add(_value);\n\
    \    allowed[_from][msg.sender] = allowed[_from][msg.sender].sub(_value);\n  \
    \  emit Transfer(_from, _to, _value);\n    return true;\n}\n```\n\n和之前一样，有一些合理性检查：目标地址不能是空地址，因此不能将代币发送到黑洞。被转移的数量不仅需要小于或等于被转出账户的当前余额，还需要小于或等于消息发送者（发起此交易的地址）仍然被允许为其花费的余额。\n\
    \n接下来，余额被更新，并且允许的余额与之同步，然后触发关于 `Transfer` 的事件。\n\n#### 在没有 `allowed` 的情况下花费代币\n\
    \n代币持有者有可能在不更新 `allowed` 映射的情况下花费代币。如果代币持有者手动使用 `transfer` 发送代币，就可能发生这种情况。在这种情况下，持有者的代币数量可能会少于授权额度所规定的第三方可以为其花费的数量。\n\
    \n有了批准和授权额度，我们还可以创建函数，让代币持有者增加或减少某人的授权额度，而不是完全覆盖该值。尝试将其作为练习，然后参考下面的源代码获取解决方案。\n\
    \n```\nfunction increaseApproval(address _spender, uint _addedValue) public returns\
    \ (bool) {\n    allowed[msg.sender][_spender] = (\n    allowed[msg.sender][_spender].add(_addedValue));\n\
    \    emit Approval(msg.sender, _spender, allowed[msg.sender][_spender]);\n   \
    \ return true;\n}\n\nfunction decreaseApproval(address _spender, uint _subtractedValue)\
    \ public returns (bool) {\n    uint oldValue = allowed[msg.sender][_spender];\n\
    \    if (_subtractedValue > oldValue) {\n        allowed[msg.sender][_spender]\
    \ = 0;\n    } else {\n        allowed[msg.sender][_spender] = oldValue.sub(_subtractedValue);\n\
    \    }\n    emit Approval(msg.sender, _spender, allowed[msg.sender][_spender]);\n\
    \    return true;\n}\n```\n\n## 构造函数\n\n到目前为止，我们只是构建了一个代币“合约”。但这个代币是什么？它叫什么名字？它有多少位小数？我们如何使用它？\n\
    \n在最开始，我们定义了一个 `constructor` 函数。现在，让我们完成它的主体并添加属性 `name`、`symbol` 和 `decimals`：\n\
    \n```\nstring public name;\nstring public symbol;\nuint8 public decimals;\n\n\
    constructor(string _name, string _symbol, uint8 _decimals, uint256 _totalSupply)\
    \ public {\n    name = _name;\n    symbol = _symbol;\n    decimals = _decimals;\n\
    \    totalSupply_ = _totalSupply;\n}\n```\n\n这样做可以让我们以后为其他相同类型的代币重用该合约。但鉴于我们确切知道我们在构建什么，让我们硬编码这些值：\n\
    \n```\nstring public name;\nstring public symbol;\nuint8 public decimals;\n\n\
    constructor() public {\n    name = \"The Neverending Story Token\";\n    symbol\
    \ = \"TNS\";\n    decimals = 18;\n    totalSupply_ = 100 * 10**6 * 10**18;\n}\n\
    ```\n\n这些细节会被各种以太坊工具和平台在显示代币信息时读取。构造函数在合约部署到以太坊网络时自动调用，因此这些值将在部署时自动配置。\n\n关于 `totalSupply_\
    \ = 100 * 10**6 * 10**18;` 的一点说明：这只是为了让人类更容易阅读这个数字。由于以太坊中的所有转账都是以以太或代币的最小单位（包括小数）进行的，最小单位是小数点后\
    \ 18 位。这就是为什么一个 TNS 代币是 `1 * 10**18`。此外，我们想要 1 亿个，所以是 `100 * 10**6` 或 `100*10*10*10*10*10*10`。这使得数字比\
    \ `100000000000000000000000000` 更易读。\n\n## 替代开发流程\n\n或者，我们可以直接扩展 Zeppelin 合约，修改一些属性，然后我们就得到了自己的代币。这是大多数人的做法，但在处理可能处理数百万他人资金的软件时，我个人倾向于*确切地*知道我在代码中放了什么，因此在我个人情况下，盲目代码复用是最少的。\n"
