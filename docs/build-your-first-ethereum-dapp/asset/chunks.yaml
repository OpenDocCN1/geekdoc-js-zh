  trans: "\n\n![](img/00045.jpeg)\n\n## 构建你的第一个以太坊去中心化应用\n\n版权所有 © 2018 SitePoint\
    \ Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-07-3\n\n*   **作者：** Bruno Škvorc\n*   **封面设计：**\
    \ Alex Walker\n\n## 版权声明\n\n版权所有。未经出版商事先书面许可，不得以任何形式或任何方式复制、存储在检索系统中或传播本书的任何部分，除非在批评性文章或评论中引用简短片段。\n\
    \n## 免责声明\n\n作者和出版商已尽一切努力确保本书信息的准确性。然而，本书所包含的信息按“原样”销售，不提供任何明示或暗示的担保。作者、SitePoint\
    \ Pty. Ltd. 及其经销商或分销商均不对因本书中的说明或其中描述的软件或硬件产品直接或间接造成的任何损害承担责任。\n\n## 商标声明\n\n本书不以任何方式标明每个商标名称的出现，仅以编辑方式使用这些名称，以利于商标所有者，无意侵犯商标权。\n\
    \n![SitePoint 标志](img/00001.gif)\n\n由 SitePoint Pty. Ltd. 出版\n\n48 Cambridge Street\
    \ Collingwood\n\nVIC Australia 3066\n\n网址：www.sitepoint.com\n\n电子邮件：books@sitepoint.com\n\
    \n## 关于 SitePoint\n\nSitePoint 专注于为网络专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 可查看我们的博客、书籍、新闻通讯、文章和社区论坛。您将找到大量关于 JavaScript、PHP、设计等方面的信息。\n\n# 前言\n\n在本书中，我们将逐步创建一个基于以太坊平台的完整分布式应用（DApp）。我们将构建一个名为\
    \ *永无止境的故事* 的众包式“选择你自己的冒险”故事，并具备众包策展和社区审查功能。\n\n## 谁应该阅读本书？\n\n本书适合所有对使用以太坊平台进行开发感兴趣的人。如果你不熟悉区块链技术，建议在阅读本书之前先阅读《以太坊开发者指南》。\n\
    \n## 使用的约定\n\n### 代码示例\n\n本书中的代码使用等宽字体显示，如下所示：\n\n```\n <h1>A Perfect Summer's\
    \ Day</h1>\n<p>It was a lovely day for a walk in the park.\nThe birds were singing\
    \ and the kids were all back at school.</p> \n```\n\n当需要现有代码作为上下文时，为避免重复全部代码，将使用\
    \ ⋮ 表示：\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\
    \n某些代码行本应在一行内输入，但由于页面限制我们进行了换行。➥ 表示仅出于格式考虑而存在的换行，应忽略：\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
    ➥design-real-user-testing/?responsive1\");\n```\n\n你会注意到我们在本书中使用了某些布局样式来表示不同类型的信息。请注意以下项目。\n\
    \n### 提示、注释和警告\n\n#### 嘿，注意！\n\n提示提供有用的小建议。\n\n#### 嗯，打扰一下……\n\n注释是与当前主题相关但不关键的补充说明。可以将其视为额外的信息片段。\n\
    \n#### 请务必……\n\n……注意这些重要要点。\n\n#### 当心！\n\n警告突出显示可能让你在过程中遇到麻烦的任何陷阱。\n\n# 第 1 章：应用规则与区块链设置\n\
    \n**这是关于使用 [以太坊](https://www.sitepoint.com/ethereum-introduction) 区块链构建去中心化应用系列的第一部分。**\n\
    \n我们将构建 3 个东西：\n\n1.  一个自定义代币\n2.  一个使用该代币作为投票权的 DAO\n3.  一个用于与智能合约交互的原型 Web 界面\n\
    \n按照本书中的说明操作后，你将能够构建自己的自定义以太坊代币，并可选择是否附带 DAO 和应用。\n\n## 我们将构建什么\n\n我们正在构建的项目名为\
    \ *永无止境的故事*（TNS）。完整项目可在 [storydao.bitfalls.com](http://storydao.bitfalls.com)\
    \ 找到。其完整代码位于 [GitHub](https://github.com/bitfalls/storydao)。\n\n永无止境的故事是一个带有输入字段（文本和图像）的\
    \ Web 应用程序，安装了 [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/)\
    \ 的用户可以根据特定条件提交一段文本或一张图片。（图片每 50 段出现一次，且只能是 URL。）\n\n完整的故事会显示在输入字段旁边。故事中的条目越多，提交条目的费用就越高。提交条目是每个支付费用、被列入白名单且至少拥有一个\
    \ TNS 代币的用户都可以执行的操作。\n\n操作类型：\n\n1.  **提交条目**：要求发送者至少拥有 1 个 TNS 代币，并且位于白名单中（见下文）。费用为\
    \ `0.0001 ether * 当前章节的条目数`（见下面的“章节”部分）。每 50 个文本条目可包含一次图片，且只能是 URL。否则为文本。无代码，纯文本。无论哪种情况，文本字段大小限制为\
    \ 256 个字符。\n2.  **转移所有权 [仅限所有者]**：可以将所有权转移到新地址。\n3.  **降低费用 [仅限所有者]**：所有者可以降低提交条目的费用（见下面的“费用”部分），无需投票。\n\
    4.  **购买 TNS 代币**：向 DAO 发送以太币，自动按比例获得相应数量的 TNS 代币。如果 DAO 中没有足够的 TNS 代币，则必须从交易所获取。\n\
    5.  **检查代币余额**：只读操作，检查 DAO 中有多少 TNS 代币。\n6.  **白名单**：当以太币发送到 DAO 地址时，此功能会自动调用。它将发送者记录在白名单数组中，以备将来参考，以防止获得大量\
    \ TNS 的人将其分发给多个账户。\n7.  **结束章节**：触发章节结束流程，用于分配以太币分红并重置条目费用。\n8.  **提款**：当利益相关者想要提取分红时调用。\n\
    9.  **所有者提款 [仅限所有者]**：由所有者调用，提取费用收益。\n\n利益相关者（TNS 代币持有者）可以对提案进行投票，任何获得“赞成”票数多于“反对”票数的提案都将获得批准。票数多少不重要，比例才重要。提案需要在特定时间段内开放投票，具体取决于提案类型。\n\
    \n提案类型：\n\n1.  **移除条目**：经投票确认后，目标条目被移除。投票时间：**48 小时**。\n2.  **紧急移除条目 [仅限所有者]**：只能由所有者触发。经投票确认后，目标条目被移除。投票时间：**12\
    \ 小时**。\n3.  **紧急移除图片 [仅限所有者]**：仅适用于图片条目。只能由所有者触发。经投票确认后，目标条目被移除。投票时间：**4 小时**。\n\
    \n之后，我们可以使用相同的方法添加其他类型的提案。\n\n**提案** 当然都需要在 UI 中明确列出，以便人们知道需要他们的投票。投票者只需拥有一个 TNS\
    \ 代币即可投票，但拥有的代币越多，投票权重越大。\n\n#### 投票期间代币被锁定\n\n用户的代币在投票期间被**锁定**。这可以防止大型 TNS 持有者压倒所有活跃投票。投票者需要将他们的投票权分配给他们关心的提案上。\n\
    \n### 章节\n\n在达到 1000 个条目或三周时间后，任何用户都可以调用章节结束。然后 DAO 将收集到的以太币按比例分配给所有 TNS 持有者，分配比例基于其余额。持有者无需在\
    \ DAO 中列入白名单即可获得分红以太币。他们只需在分配时刻持有 TNS 代币即可。\n\n"
