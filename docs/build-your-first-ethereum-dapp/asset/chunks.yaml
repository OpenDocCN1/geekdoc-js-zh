  trans: "\n首先，通过请求 `Migrations.sol` 导入执行迁移的能力。这是每次迁移所必需的。接下来，部署代币意味着我们需要导入其 Solidity\
    \ 代码，我们通过引入 `TNSToken.sol`（即我们在上一部分编写的代码）来实现这一点。最后，这是一个模板化的迁移，只有 `function(deployer,\
    \ network, accounts) {` 和最后一个 `}` 之间的部分会发生变化。\n\n在这种情况下，我们告诉部署器部署 TNSToken，并传入\
    \ `from` 参数以设置初始代币持有者。这里使用的地址是 Ganache 生成的随机地址，但通过使用自动传递给部署器的 `accounts` 数组，我们确保能够访问运行节点（无论是实时的\
    \ Geth 节点还是 Ganache）中的账户列表。在我的具体示例中，`account[0]` 地址是 `0xdFb659D556d926dd3585d0f18d4F8eD7939E8061`，这在上面的截图中也很明显。\n\
    \n我们也不要忘记在 `truffle.js` 中配置开发环境：\n\n```\nmodule.exports = {\n  networks: {\n \
    \   development: {\n      host: \"127.0.0.1\",\n      port: 7545,\n      network_id:\
    \ \"*\"\n    }\n  }\n};\n```\n\n#### 咳咳，打扰一下……\n\n请注意端口和 IP；你的可能不同！\n\n最后，在项目文件夹中运行\
    \ `truffle migrate`。你应该会看到类似这样的内容：\n\n![A successful migration](img/00005.jpeg)\n\
    \n注意 `TNStoken` 旁边的以太坊地址：`0x3134bcded93e810e1025ee814e87eff252cff422`。这就是我们的代币部署的位置。现在让我们看看它的实际运行情况。\n\
    \n## 测试代币\n\n在这种情况下，自动化测试并非必需。代币合约高度标准化且经过实战检验。如果我们使用了超出传统代币范围的功能，那么自动化测试就会派上用场。不过，就目前而言，通过在不同地址之间发送代币来进行测试已经足够了。\n\
    \n打开一个钱包 UI，比如 [MyEtherWallet](https://bitfalls.com/2018/02/19/first-ethereum-address-learning-use-myetherwallet/)，然后在右上角的菜单中选择自定义网络。在对话框中，输入你的私有区块链提供的信息——无论是\
    \ Ganache 还是实际的 PoA 区块链，取决于你基于本教程系列[第 1 部分](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup)运行的是哪个。在我的示例中，地址是\
    \ `127.0.0.1`，端口是 `7545`。\n\n![Configuring the network in MEW](img/00006.jpeg)\n\
    \n打开你在部署脚本中设置为 `from` 值的钱包。如果你使用的是 Ganache，你会在 Ganache 界面或终端中的 Ganache 输出中看到它的私钥。\n\
    \n![The private key is accessible in the Ganache UI](img/00007.jpeg)\n\n最后，需要告诉\
    \ MEW 这个代币的存在。我们通过添加一个自定义代币来实现这一点。\n\n![Adding a custom token in MEW](img/00008.jpeg)\n\
    \n添加代币后，你会立即注意到该账户现在拥有 1 亿个代币的余额，并且可以在货币下拉选择菜单中发送它们。让我们尝试向另一个地址发送一些代币。\n\n![Sending\
    \ some tokens](img/00009.jpeg)\n\n![Transaction is being prepared](img/00010.jpeg)\n\
    \n![Tokens have been received](img/00011.jpeg)\n\n现在继续将这些代币发送回去，使原始账户余额恢复到 1 亿。我们刚刚确认了代币的基本功能按预期工作。\n\
    \n## 部署到实时网络\n\n如果不将代币部署到实时网络上，这就算不上真正的代币测试。不过，我们不要使用主网，而是使用像 Rinkeby 这样的[测试网](https://bitfalls.com/hr/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/)。\n\
    \n在 `truffle.js` 中，让我们添加一个新网络——`rinkeby`——这样我们的文件看起来像这样：\n\n```\nrequire('dotenv').config();\n\
    const WalletProvider = require(\"truffle-wallet-provider\");\nconst Wallet = require('ethereumjs-wallet');\n\
    const Web3 = require(\"web3\");\nconst w3 = new Web3();\n\nconst PRIVKEY = process.env[\"\
    PRIVKEY\"];\nconst INFURAKEY = process.env[\"INFURAKEY\"];\n\nmodule.exports =\
    \ {\n  networks: {\n    development: {\n      host: \"127.0.0.1\",\n      port:\
    \ 7545,\n      network_id: \"*\"\n    },\n    rinkeby: {\n      provider: function()\
    \ {\n        return new WalletProvider(\n          Wallet.fromPrivateKey(\n  \
    \          Buffer.from(PRIVKEY, \"hex\")), \"https://rinkeby.infura.io/\"+INFURAKEY\n\
    \n        );\n      },\n      gas: 4600000,\n      gasPrice: w3.utils.toWei(\"\
    50\", \"gwei\"),\n      network_id: \"3\",\n    },\n  }\n};\n```\n\n哎呀！这些都是什么？\n\
    \n让我们逐行处理。\n\n前几行导入了一些节点模块，以便我们可以在下面使用这些函数。如果其中任何一个出现缺少模块的消息，只需运行 `npm install\
    \ web3-wallet-provider truffle-wallet-provider web3 dotenv --save` 即可解决问题。\n\n\
    接下来，我们从项目文件夹根目录下的 `.env` 文件中加载运行合约的钱包的私钥（即将要获得 1 亿代币的钱包；这里我们不能使用 `from` 值）。如果该文件不存在，请创建它。同一个文件还包含一个\
    \ Infura.io 访问密钥，这是一个托管以太坊节点并允许应用程序连接它们的网站，这样开发者就不需要在他们的计算机上运行完整的以太坊节点。\n\n`.env`\
    \ 文件默认是隐藏的，并且可以在 `.gitignore` 中被忽略，这样你的私钥就不会有泄露的风险——这是一个非常重要的预防措施！该文件包含以下内容：\n\
    \n```\nPRIVKEY=\"YOUR_PRIVATE_KEY\";\nINFURAKEY=\"YOUR_INFURA_ACCESS_KEY\";\n\
    ```\n\n你可以通过[在此注册](https://infura.io/signup)来获取你的 Infura 密钥。如果你安装了 [Metamask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/)，将其切换到\
    \ Rinkeby，然后转到“导出私钥”，就可以轻松获得私钥。不过任何方法都可以，所以选择你喜欢的。你也可以使用 Ganache 的私钥。一个私钥可以在所有以太坊网络上解锁同一个钱包——测试网、Rinkeby、主网，等等。\n\
    \n回到我们的配置文件。我们有一个新的 `network` 条目：`rinkeby`。这是我们将要部署到的以太坊测试网的名称，provider 内部的代码基本上是模板化的复制粘贴，告诉\
    \ Truffle“获取我的私钥，进行十六进制编码，将其变成一个解锁的钱包，然后通过它与 Infura 通信”。\n\n最后，我们定义了执行此合约想要花费的\
    \ Gas 上限（460 万足够了，如果需要可以更改）、Gas 的价格（50 Gwei 实际上[相当昂贵](https://bitfalls.com/2017/12/05/ethereum-gas-and-transaction-fees-explained/)，但我们使用的以太币是模拟的，所以没关系），并将网络\
    \ ID 设置为 4，因为 Rinkeby 测试网就是这样[标记的](https://ethereum.stackexchange.com/questions/17051/how-to-select-a-network-id-or-is-there-a-list-of-network-ids)。\n\
    \n还有一件事我们需要做。我们之前编写的迁移文件指定了一个 `from` 地址，但 Rinkeby 的地址不同。这是否意味着我们需要根据网络更改部署脚本？当然不是！让我们将\
    \ `2_deploy_tnstoken.js` 文件修改为如下所示：\n\n```\nvar Migrations = artifacts.require(\"\
    ./Migrations.sol\");\nvar TNSToken = artifacts.require(\"./TNSToken.sol\");\n\n\
    module.exports = function(deployer, network, accounts) {\n  if (network == \"\
    development\") {\n    deployer.deploy(TNSToken, {from: accounts0});\n  } else\
    \ {\n    deployer.deploy(TNSToken);\n  }\n};\n```\n\n如你所见，部署脚本是简单的 JavaScript，传递给部署器的第二个参数始终是网络名称——我们可以用它来区分不同的网络。\n\
    \n如果我们现在尝试使用 `truffle migrate --network rinkeby` 运行迁移，如果我们使用的地址是新的，它将会失败：\n\n\
    ![A failing migration\n\n"
- fmt: "\nThis is because the address has no Ether to spend on deploying the contract.\
    \ That’s easy to solve, though. Just head over to the [Rinkeby Faucet](https://www.rinkeby.io/#faucet)\
    \ and ask for some. It’s free.\n\n![Asking for Rinkeby test ether](images/00013.jpeg)\n\
    \nNow re-run the migration and the token contract will be deployed live on the\
    \ Rinkeby network. It can be tested just like in the Ganache use case above. Everything\
    \ should work exactly the same, only now you can also test it with your friends\
    \ and colleagues. Progress!\n\n## Bonus: Verification and ENS\n\nFor extra trust\
    \ points, it’s recommended that you verify the token on Etherscan and register\
    \ an ENS domain for it.\n\n### Verification\n\n**Verification** means submitting\
    \ the source code of the token to Etherscan so it can compare it to what’s deployed\
    \ on the network, thereby verifying it as backdoor-free. This is done on the *Code*\
    \ tab of the token’s address. Since our token uses some third-party code and those\
    \ can’t be easily pulled into the code window in the *Verify* screen, we need\
    \ to *flatten* our contract. For that, we’ll use a tool called `truffle-flattener`:\n\
    \n```\nnpm install --global truffle-flattener\n```\n\nThis tool will copy all\
    \ the dependencies and the token’s source code into a single file. We can run\
    \ it like this:\n\n```\ntruffle-flattener contracts/TNSToken.sol >> ./contracts/TNSTokenFlat.sol\n\
    ```\n\nA new file should be present in the `contracts` folder now, virtually identical\
    \ to our source code but with dependency code pasted in (so `SafeMath.sol`, for\
    \ example, will be pasted at the top of the file).\n\nPaste the contents of that\
    \ new file into the code window of the *Verify* screen, set the compiler to whatever\
    \ version you get by running `truffle version`, and set *Optimization* to *No*.\
    \ Click *Verify* and *Publish*, and once the process completes, your token’s address\
    \ screen will have new tabs: *Read Contract* and *Write Contract*, and the *Code*\
    \ tab will have a green checkmark, indicating that the code has been verified.\
    \ This gives you additional trust points with the community.\n\n![The token is\
    \ now marked as trusted](images/00014.jpeg)\n\n### ENS\n\nThe ENS is the Ethereum\
    \ Name System. It’s used to give Ethereum addresses human-readable names so you\
    \ don’t have to remember the `0xmumbojumbo` strings and can instead remember addresses\
    \ like `bitfalls.eth`. You can then even register subdomains like `token.bitfalls.eth`.\
    \ The process of registering an ENS domain is not simple and it takes time, so\
    \ if you’d like to do that I recommend you read [this guide](https://ens.domains/)\
    \ and follow the instructions [here](https://www.myetherwallet.com/#ens).\n\n\
    ## Conclusion\n\nIn this part we went through compiling and deploying a custom\
    \ token. This token is compatible with all exchanges and can be used as a regular\
    \ ERC20 token.\n\n# Chapter 4: Whitelisting & Testing a Story DAO\n\n**In [part\
    \ 3](#part0004_split_000.html_3Q280-63b9e60a50594bb1b6dced0e79731cb3) of this\
    \ tutorial series on building DApps with Ethereum, we built and deployed our token\
    \ to the Ethereum testnet Rinkeby. In this part, we’ll start writing the Story\
    \ DAO code.**\n\nWe’ll use the conditions laid out in the [first chapter](#part0002_split_000.html_1T140-63b9e60a50594bb1b6dced0e79731cb3)\
    \ to guide us.\n\n## Contract Outline\n\nLet’s create a new contract, `StoryDao.sol`,\
    \ with this skeleton:\n\n```\npragma solidity ^0.4.24;\n\nimport \"../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\"\
    ;\nimport \"../node_modules/openzeppelin-solidity/contracts/ownership/Ownable.sol\"\
    ;\n\ncontract StoryDao is Ownable {\n    using SafeMath for uint256;\n\n    mapping(address\
    \ => bool) whitelist;\n    uint256 public whitelistedNumber = 0;\n    mapping(address\
    \ => bool) blacklist;\n    event Whitelisted(address addr, bool status);\n   \
    \ event Blacklisted(address addr, bool status);\n\n    uint256 public daofee =\
    \ 100; // hundredths of a percent, i.e. 100 is 1%\n    uint256 public whitelistfee\
    \ = 10000000000000000; // in Wei, this is 0.01 ether\n\n    event SubmissionCommissionChanged(uint256\
    \ newFee);\n    event WhitelistFeeChanged(uint256 newFee);\n\n    uint256 public\
    \ durationDays = 21; // duration of story's chapter in days\n    uint256 public\
    \ durationSubmissions = 1000; // duration of story's chapter in entries\n\n  \
    \  function changedaofee(uint256 _fee) onlyOwner external {\n        require(_fee\
    \ < daofee, \"New fee must be lower than old fee.\");\n        daofee = _fee;\n\
    \        emit SubmissionCommissionChanged(_fee);\n    }\n\n    function changewhitelistfee(uint256\
    \ _fee) onlyOwner external {\n        require(_fee < whitelistfee, \"New fee must\
    \ be lower than old fee.\");\n        whitelistfee = _fee;\n        emit WhitelistFeeChanged(_fee);\n\
    \    }\n\n    function lowerSubmissionFee(uint256 _fee) onlyOwner external {\n\
    \        require(_fee < submissionZeroFee, \"New fee must be lower than old fee.\"\
    );\n        submissionZeroFee = _fee;\n        emit SubmissionFeeChanged(_fee);\n\
    \    }\n\n    function changeDurationDays(uint256 _days) onlyOwner external {\n\
    \        require(_days >= 1);\n        durationDays = _days;\n    }\n\n    function\
    \ changeDurationSubmissions(uint256 _subs) onlyOwner external {\n        require(_subs\
    \ > 99);\n        durationSubmissions = _subs;\n    }\n}\n```\n\nWe’re importing\
    \ `SafeMath` to have safe calculations again, but this time we’re also using Zeppelin’s\
    \ `Ownable` contract, which lets someone “own” the story and execute certain admin-only\
    \ functions. Simply saying that our `StoryDao is Ownable` is enough; feel free\
    \ to inspect the contract to see how it works.\n\nWe also use the `onlyOwner`\
    \ modifier from this contract. Function modifiers are basically extensions, plugins\
    \ for functions. The `onlyOwner` modifier looks like this:\n\n```\nmodifier onlyOwner()\
    \ {\n  require(msg.sender == owner);\n  _;\n}\n```\n\nWhen `onlyOwner` is added\
    \ to a function, then that function’s body is *pasted* into the part where the\
    \ `_;` part is, and everything before it executes first. So by using this modifier,\
    \ the function automatically checks if the message sender is also the owner of\
    \ the contract and then continues as usual if so. If not, it crashes.\n\nBy using\
    \ the `onlyOwner` modifier on the functions that change the fees and other parameters\
    \ of our story DAO, we make sure that only the admin can do these changes.\n\n\
    ### Testing\n\nLet’s test the initial functions.\n\nCreate the folder `test` if\
    \ it doesn’t exist. Then inside it, create the files `TestStoryDao.sol` and `TestStoryDao.js`.\
    \ Because there’s no native way to test for exceptions in Truffle, also create\
    \ `helpers/expectThrow.js` with the content:\n\n```\nexport default async promise\
    \ => {\n    try {\n      await promise;\n    } catch (error) {\n      const invalidOpcode\
    \ = error.message.search('invalid opcode') >= 0;\n      const outOfGas = error.message.search('out\
    \ of gas') >= 0;\n      const revert = error.message.search('revert') >= 0;\n\
    \      assert(\n        invalidOpcode || outOfGas || revert,\n        'Expected\
    \ throw, got \\'' + error + '\\' instead',\n      );\n      return;\n    }\n \
    \   assert.fail('Expected throw not received');\n  };\n```\n\n#### Solidity Testing\
    \ vs. JS testing\n\nSolidity tests are generally used to test low-level, contract-based\
    \ functions, the internals of a smart contract. JS tests are generally used to\
    \ test if the contract can be properly interacted with from the outside, which\
    \ is something our end users will be doing.\n\nIn `TestStoryDao.sol`, put the\
    \ following content:\n"
