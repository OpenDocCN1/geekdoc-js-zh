    \n```\n@supports (grid-area: auto) {\n    .grid-container{\n      display: grid;\n\
    \      grid-template-columns: 6fr 5fr 4fr;\n      grid-template-rows: 10rem ;\n\
    \      grid-column-gap: 0.5rem;\n      grid-row-gap: 0.5rem;\n      justify-items:\
    \ stretch;\n      align-items: stretch;\n      grid-template-areas:\n      \"\
    header header information\"\n      \"content events information\";\n      height:\
    \ 100vh;\n    }\n    .events {\n      grid-area: events;\n    }\n    .content\
    \ {\n      grid-area: content;\n    }\n    .information {\n      grid-area: information;\n\
    \    }\n    .header {\n      grid-area: header;\n      text-align: center;\n \
    \   }\n\n    .container {\n        border: 1px solid black;\n        padding:\
    \ 15px;\n        overflow-y: scroll;\n    }\n\n    p {\n        margin: 0;\n \
    \   }\n  }\n\nbody {\n    padding: 0;\n    margin: 0;\n    font-family: sans-serif;\n\
    }\n```\n\n然后，对于 JS，我们从 `public/assets/js/app.js` 中的以下内容开始：\n\n```\nvar Web3 =\
    \ require('web3');\n\nvar web3 = new Web3(web3.currentProvider);\nconsole.log(web3);\n\
    ```\n\n这是怎么回事？\n\n由于我们约定假设所有用户都已安装 [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/)，并且\
    \ MetaMask 会将其自身的 `Web3` 实例注入到任何访问页面的 DOM 中，因此我们基本上可以在网站中直接访问 MetaMask 的“钱包提供者”。确实，如果在页面打开时登录\
    \ MetaMask，我们会在控制台中看到：\n\n![MetaMask 提供者已激活](img/00017.jpeg)\n\n注意 `MetamaskInpageProvider`\
    \ 已激活。实际上，如果在控制台中输入 `web3.eth.accounts`，所有通过 MetaMask 可访问的账户都会被打印出来：\n\n![账户被打印到控制台](img/00018.jpeg)\n\
    \n然而，这个特定账户是默认添加到我的个人 MetaMask 中的，因此余额为 0 ETH。它不属于我们正在运行的 Ganache 或 PoA 链：\n\n\
    ![一个空账户](img/00019.jpeg)\n\n注意，查询当前（MetaMask）账户余额返回 0，而查询我们的私有区块链账户余额则返回 100 ETH（在我的例子中是\
    \ Ganache，因此所有账户初始化为 100 ETH）。\n\n### 关于语法\n\n你会注意到这些调用的语法看起来有点奇怪：\n\n```\nweb3.eth.getBalance(\"\
    0x35d4dCDdB728CeBF80F748be65bf84C776B0Fbaf\", function(err, res){console.log(JSON.stringify(res));});\n\
    ```\n\n为了读取区块链数据，大多数 MetaMask 用户不会在本地运行节点，而是通过 Infura 或其他远程节点请求数据。因此，我们几乎可以预料到延迟。正因如此，[同步方法通常不被支持](https://github.com/MetaMask/faq/blob/master/DEVELOPERS.md#dizzy-all-async---think-of-metamask-as-a-light-client)。相反，所有操作都通过\
    \ Promise 或回调函数完成——就像本文开头的部署步骤一样。这是否意味着你需要非常熟悉 Promise 才能为以太坊开发 JS？不。这意味着：在 DOM\
    \ 中执行 JS 调用时……\n\n*   始终将回调函数作为所调用函数的最后一个参数\n*   假设其返回值有两部分：首先是 `error`，然后是 `result`。\n\
    \n所以，基本上，将其视为延迟响应。当节点返回数据时，你定义的回调函数将被 JavaScript 调用。**是的，这意味着你不能期望代码按书写顺序逐行执行！**\n\
    \n有关 Promise、回调以及所有异步内容的更多信息，请参阅[这篇文章](https://www.sitepoint.com/overview-javascript-promises/)。\n\
    \n## 账户信息\n\n如果我们打开上面展示的网站骨架，会得到类似这样的结果：\n\n![网站骨架](img/00020.jpeg)\n\n让我们用*真实*数据填充最右侧的账户信息列。\n\
    \n### 会话\n\n"
- fmt: "\nWhen the user is not signed into their MetaMask extension, the account list\
    \ will be empty. When MetaMask isn’t even installed, the provider will be empty\
    \ (`undefined`). When they are signed into MetaMask, the provider will be available\
    \ and offer account info and interaction with the connected Ethereum node (live\
    \ or Ganache or something else).\n\n#### Testing\n\nFor testing, you can log out\
    \ of MetaMask by clicking on your avatar icon in the top right and then selecting\
    \ Log Out. If the UI doesn’t look like it does in the screenshot below, you might\
    \ need to activate the Beta UI by opening the menu and clicking on “Try Beta”.\n\
    \n![MetaMask Log out](images/00021.jpeg)\n\nFirst, let’s replace all the content\
    \ of the right status column with a message for the user if they’re logged out:\n\
    \n```\n<div class=\"information container\">\n    <div class=\"logged out\">\n\
    \        <p>You seem to be logged out of MetaMask or MetaMask isn't installed.\
    \ Please log into MetaMask - to learn more,\n            see\n            <a href=\"\
    https://bitfalls.com/2018/02/16/metamask-send-receive-ether/\">this tutorial</a>.</p>\n\
    \    </div>\n    <div class=\"logged in\" style=\"display: none\">\n        <p>You\
    \ are logged in!</p>\n    </div>\n</div>\n```\n\nThe JS to handle this looks like\
    \ this (in `public/assets/js/main.js`):\n\n```\nvar loggedIn;\n\n(function ()\
    \ {\n\n    loggedIn = setLoggedIn(web3.currentProvider !== undefined && web3.eth.accounts.length\
    \ > 0);\n\n})();\n\nfunction setLoggedIn(isLoggedIn) {\n    let loggedInEl = document.querySelector('div.logged.in');\n\
    \    let loggedOutEl = document.querySelector('div.logged.out');\n\n    if (isLoggedIn)\
    \ {\n        loggedInEl.style.display = \"block\";\n        loggedOutEl.style.display\
    \ = \"none\";\n    } else {\n        loggedInEl.style.display = \"none\";\n  \
    \      loggedOutEl.style.display = \"block\";\n    }\n\n    return isLoggedIn;\n\
    }\n```\n\nThe first part — `(function () {` — wraps the bit of logic to be executed\
    \ once the website loads. So anything inside that will get executed immediately\
    \ when the page is ready. A single function `setLoggedIn` is called and a condition\
    \ is passed to it. The condition is that:\n\n1.  The `currentProvider` of the\
    \ `web3` object is set (i.e. there’s a web3 client present in the website).\n\n\
    2.  There’s a non-zero number of accounts available, i.e. an account is available\
    \ for use via this web3 provider. In other words, we’re logged in to at least\
    \ one account.\n\nIf these conditions together evaluate to `true`, the `setLoggedIn`\
    \ function makes the “Logged out” message invisible, and the “Logged In” message\
    \ visible.\n\nAll this has the added advantage of being able to use any other\
    \ web3 provider as well. If a MetaMask alternative shows up eventually, it’ll\
    \ be instantly compatible with this code because we’re not explicitly expecting\
    \ MetaMask anywhere.\n\n### Account avatar\n\nBecause each private key to an Ethereum\
    \ wallet is unique, it can be used to generate a unique image. This is where colorful\
    \ avatars like the ones you see in MetaMask’s upper right corner or when using\
    \ MyEtherWallet come from, though Mist, MyEtherWallet and MetaMask all use different\
    \ approaches. Let’s generate one for our logged-in user and display it.\n\nThe\
    \ icons in [Mist](https://www.sitepoint.com/mist-introduction/) are generated\
    \ with the Blockies library — but a customized one, because the original has a\
    \ broken random number generator and can produce identical images for different\
    \ keys. So to install this one, download [this file](https://github.com/ethereum/blockies/blob/master/blockies.min.js)\
    \ into one in your `assets/js` folder. Then, in `index.html` we include it before\
    \ `main.js`:\n\n```\n <script src=\"assets/js/app.js\"></script>\n    <script\
    \ src=\"assets/js/blockies.min.js\"></script>\n    <script src=\"assets/js/main.js\"\
    ></script>\n\n</body>\n```\n\nWe should also upgrade the `logged.in` container:\n\
    \n```\n<div class=\"logged in\" style=\"display: none\">\n    <p>You are logged\
    \ in!</p>\n    <div class=\"avatar\">\n\n    </div>\n</div>\n```\n\nIn `main.js`,\
    \ we kickstart the function.\n\n```\n if (isLoggedIn) {\n      loggedInEl.style.display\
    \ = \"block\";\n      loggedOutEl.style.display = \"none\";\n\n      var icon\
    \ = blockies.create({ // All options are optional\n          seed: web3.eth.accounts[0],\
    \ // seed used to generate icon data, default: random\n          size: 20, //\
    \ width/height of the icon in blocks, default: 8\n          scale: 8, // width/height\
    \ of each block in pixels, default: 4\n      });\n\n      document.querySelector(\"\
    div.avatar\").appendChild(icon);\n```\n\nSo we upgrade the logged-in section of\
    \ the JS code to generate the icon and paste it into the avatar section. We should\
    \ align that a little with CSS before rendering:\n\n```\ndiv.avatar {\n    width:\
    \ 100%;\n    text-align: center;\n    margin: 10px 0;\n}\n```\n\nNow if we refresh\
    \ the page when logged in to MetaMask, we should see our generated avatar icon.\n\
    \n![The Avatar Icon](images/00022.jpeg)\n\n### Account balances\n\nNow let’s output\
    \ some of the account balance information.\n\nWe have a bunch of read-only functions\
    \ at our disposal that we developed exclusively for this purpose. So let’s query\
    \ the blockchain and ask it for some info. To do that, we need to [call a smart\
    \ contract function](https://bitfalls.com/2018/04/08/how-to-call-ethereum-smart-contract-functions/)\
    \ via the following steps.\n\n#### 1. ABI\n\nGet the ABI of the contracts whose\
    \ functions we’re calling. The ABI contains function signatures, so our JS code\
    \ knows how to call them. Learn more about ABI [here](https://www.sitepoint.com/compiling-smart-contracts-abi/).\n\
    \nYou can get the ABI of the TNS token and the StoryDAO by opening the `build/TNSToken.json`\
    \ and `build/StoryDao.json` files in your project folder after compilation and\
    \ selecting *only* the `abi` part — so the part between the square brackets `[`\
    \ and `]`:\n\n![ABI selection](images/00023.jpeg)\n\nWe’ll put this ABI at the\
    \ top of our JavaScript code into `main.js` like so:\n\n![Token and DAO ABI loaded](images/00024.jpeg)\n\
    \n#### An Abbreviation\n\nNote that the above screenshot shows the abbreviated\
    \ insertion, collapsed by my code editor (Microsoft Visual Code). If you look\
    \ at line numbers, you’ll notice that the ABI of the token is 400 lines of code,\
    \ and the ABI of the DAO is another 1000, so pasting that into this book would\
    \ make no sense.\n\n#### 2. Instantiate token\n\n```\nif (loggedIn) {\n\n    var\
    \ token = TNSToken.at('0x3134bcded93e810e1025ee814e87eff252cff422');\n    var\
    \ story = StoryDao.at('0x729400828808bc907f68d9ffdeb317c23d2034d5');\n    token.balanceOf(web3.eth.accounts[0],\
    \ function(error, result) {console.log(JSON.stringify(result))});\n    story.getSubmissionCount(function(error,\
    \ result) {console.log(JSON.stringify(result))});\n//...\n```\n\nWe call upon\
    \ each contract with the address given to us by Truffle and create an instance\
    \ for each — `token` and `story` respectively. Then, we simply call the functions\
    \ (asynchronously as before). The console gives us two zeroes because the account\
    \ in MetaMask has 0 tokens, and because there are 0 submissions in the story for\
    \ now.\n\n![Console produces two zeroes](images/00025.jpeg)\n\n#### 3. Read and\
    \ output data\n\nFinally, we can populate the user’s profile data with the info\
    \ we have available.\n\nLet’s update our JavaScript:\n"
