    ></script>\n<script src=\"assets/js/app.js\"></script>\n<script src=\"assets/js/main.js\"\
    ></script>\n\n</body>\n</html>\n```\n\n## Just a Skeleton ...\n\nThis is a really\
    \ really basic skeleton, just to demo integration. Please don’t rely on this being\
    \ the final product!\n\nIt’s possible that you’re missing the `dist` folder in\
    \ the `web3` folder. The software is still beta, so minor slip-ups are still possible\
    \ there. To get around this and install web3 with the `dist` folder, run `npm\
    \ install ethereum/web3.js --save`.\n\nFor CSS, let’s put something rudimentary\
    \ into `public/assets/css/main.css`:\n\n```\n@supports (grid-area: auto) {\n \
    \   .grid-container{\n      display: grid;\n      grid-template-columns: 6fr 5fr\
    \ 4fr;\n      grid-template-rows: 10rem ;\n      grid-column-gap: 0.5rem;\n  \
    \    grid-row-gap: 0.5rem;\n      justify-items: stretch;\n      align-items:\
    \ stretch;\n      grid-template-areas:\n      \"header header information\"\n\
    \      \"content events information\";\n      height: 100vh;\n    }\n    .events\
    \ {\n      grid-area: events;\n    }\n    .content {\n      grid-area: content;\n\
    \    }\n    .information {\n      grid-area: information;\n    }\n    .header\
    \ {\n      grid-area: header;\n      text-align: center;\n    }\n\n    .container\
    \ {\n        border: 1px solid black;\n        padding: 15px;\n        overflow-y:\
    \ scroll;\n    }\n\n    p {\n        margin: 0;\n    }\n  }\n\nbody {\n    padding:\
    \ 0;\n    margin: 0;\n    font-family: sans-serif;\n}\n```\n\nThen as JS we’ll\
    \ start with this in `public/assets/js/app.js`:\n\n```\nvar Web3 = require('web3');\n\
    \nvar web3 = new Web3(web3.currentProvider);\nconsole.log(web3);\n```\n\nWhat’s\
    \ going on here?\n\nSince we agreed that we’ll assume all our users will have\
    \ [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/) installed,\
    \ and MetaMask injects its own instance of `Web3` into the DOM of any visited\
    \ web page, we basically have access to the “wallet provider” from MetaMask right\
    \ in our website. Indeed, if we log in to MetaMask while the page is open, we’ll\
    \ see this in the console:\n\n![MetaMask provider is active](images/00017.jpeg)\n\
    \nNotice how the `MetamaskInpageProvider` is active. In fact, if we type `web3.eth.accounts`\
    \ into the console, all the accounts we have access to through MetaMask will be\
    \ printed out:\n\n![Account is printed into the console](images/00018.jpeg)\n\n\
    This particular account is, however, one that’s added to my own personal Metamask\
    \ by default and as such will have a balance of 0 eth. It’s not part of our running\
    \ Ganache or PoA chain:\n\n![An empty account](images/00019.jpeg)\n\nNotice how\
    \ asking for the balance of our active (MetaMasked) account yields 0, while asking\
    \ for balance of one of our private blockchain accounts yields 100 ether (in my\
    \ case it’s Ganache, so all accounts are initialized with 100 ether).\n\n### About\
    \ the syntax\n\nYou’ll notice that the syntax for these calls looks a little odd:\n\
    \n```\nweb3.eth.getBalance(\"0x35d4dCDdB728CeBF80F748be65bf84C776B0Fbaf\", function(err,\
    \ res){console.log(JSON.stringify(res));});\n```\n\nIn order to read blockchain\
    \ data, most MetaMask users will not have a node running locally but will instead\
    \ request it from Infura or another remote node. Because of this, we can practically\
    \ count on lag. For this reason, [synchronous methods are generally not supported](https://github.com/MetaMask/faq/blob/master/DEVELOPERS.md#dizzy-all-async---think-of-metamask-as-a-light-client).\
    \ Instead, everything is done through promises or with callbacks — just like with\
    \ the deployment step at the beginning of this post. Does this mean you need to\
    \ be intimately familiar with promises to develop JS for Ethereum? No. It means\
    \ the following. When doing JS calls in the DOM …\n\n*   always provide a callback\
    \ function as the last argument to a function you’re calling\n*   assume its return\
    \ values will be twofold: first `error`, then `result`.\n\nSo, basically, just\
    \ think of it in terms of a delayed response. When the node responds back with\
    \ data, the function you defined as the callback function will be called by JavaScript.\
    \ **Yes, this does mean you can’t expect your code to execute line by line as\
    \ it’s written!**\n\nFor more information about promises, callbacks and all that\
    \ async jazz, see [this post](https://www.sitepoint.com/overview-javascript-promises/).\n\
    \n## Account Information\n\nIf we open the website skeleton as presented above,\
    \ we get something like this:\n\n![The website skeleton](images/00020.jpeg)\n\n\
    Let’s populate the right-most column about account information with *real* data.\n\
    \n### Session\n"
