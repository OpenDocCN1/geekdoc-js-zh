  trans: "\n\n当用户未登录其 MetaMask 扩展时，账户列表将为空。如果甚至没有安装 MetaMask，则提供者将为空（`undefined`）。当用户登录\
    \ MetaMask 时，提供者将可用，并提供账户信息以及与已连接的以太坊节点（实时节点、Ganache 或其他）的交互。\n\n#### 测试\n\n为了测试，你可以点击右上角的头像图标，然后选择“注销”来退出\
    \ MetaMask。如果 UI 看起来与下方截图不同，你可能需要打开菜单并点击“尝试 Beta 版”来激活 Beta 版 UI。\n\n![MetaMask\
    \ 注销](img/00021.jpeg)\n\n首先，如果用户已注销，我们将右侧状态列的所有内容替换为一条消息：\n\n```\n<div class=\"\
    information container\">\n    <div class=\"logged out\">\n        <p>您似乎已退出 MetaMask\
    \ 或未安装 MetaMask。请登录 MetaMask - 了解更多信息，请参阅\n            <a href=\"https://bitfalls.com/2018/02/16/metamask-send-receive-ether/\"\
    >本教程</a>。</p>\n    </div>\n    <div class=\"logged in\" style=\"display: none\"\
    >\n        <p>您已登录！</p>\n    </div>\n</div>\n```\n\n处理此功能的 JS 代码如下（位于 `public/assets/js/main.js`\
    \ 中）：\n\n```\nvar loggedIn;\n\n(function () {\n\n    loggedIn = setLoggedIn(web3.currentProvider\
    \ !== undefined && web3.eth.accounts.length > 0);\n\n})();\n\nfunction setLoggedIn(isLoggedIn)\
    \ {\n    let loggedInEl = document.querySelector('div.logged.in');\n    let loggedOutEl\
    \ = document.querySelector('div.logged.out');\n\n    if (isLoggedIn) {\n     \
    \   loggedInEl.style.display = \"block\";\n        loggedOutEl.style.display =\
    \ \"none\";\n    } else {\n        loggedInEl.style.display = \"none\";\n    \
    \    loggedOutEl.style.display = \"block\";\n    }\n\n    return isLoggedIn;\n\
    }\n```\n\n第一部分——`(function () {`——包装了一段逻辑，该逻辑将在网站加载时执行。因此，其中的任何内容都会在页面准备就绪时立即执行。调用了一个函数\
    \ `setLoggedIn`，并向其传递了一个条件。该条件是：\n\n1.  `web3` 对象的 `currentProvider` 已设置（即网站中存在\
    \ web3 客户端）。\n\n2.  存在非零数量的可用账户，即通过此 web3 提供者至少有一个账户可供使用。换句话说，我们已登录至少一个账户。\n\n\
    如果这些条件同时评估为 `true`，则 `setLoggedIn` 函数会使“已注销”消息不可见，并使“已登录”消息可见。\n\n这样做还有一个额外的好处，即也可以使用任何其他\
    \ web3 提供者。如果将来出现 MetaMask 的替代品，它将立即与此代码兼容，因为我们没有在任何地方显式地期望 MetaMask。\n\n### 账户头像\n\
    \n由于每个以太坊钱包的私钥都是唯一的，因此可以用它来生成唯一的图像。这就是你在 MetaMask 右上角或使用 MyEtherWallet 时看到的彩色头像的来源，尽管\
    \ Mist、MyEtherWallet 和 MetaMask 都使用了不同的方法。让我们为已登录的用户生成一个并显示出来。\n\n[Mist](https://www.sitepoint.com/mist-introduction/)\
    \ 中的图标是使用 Blockies 库生成的——但这是一个定制版本，因为原始版本的随机数生成器有缺陷，可能会为不同的密钥生成相同的图像。因此，要安装此版本，请将[此文件](https://github.com/ethereum/blockies/blob/master/blockies.min.js)下载到你的\
    \ `assets/js` 文件夹中。然后，在 `index.html` 中，我们在 `main.js` 之前引入它：\n\n```\n <script src=\"\
    assets/js/app.js\"></script>\n    <script src=\"assets/js/blockies.min.js\"></script>\n\
    \    <script src=\"assets/js/main.js\"></script>\n\n</body>\n```\n\n我们还应该升级 `logged.in`\
    \ 容器：\n\n```\n<div class=\"logged in\" style=\"display: none\">\n    <p>您已登录！</p>\n\
    \    <div class=\"avatar\">\n\n    </div>\n</div>\n```\n\n在 `main.js` 中，我们启动该函数。\n\
    \n```\n if (isLoggedIn) {\n      loggedInEl.style.display = \"block\";\n     \
    \ loggedOutEl.style.display = \"none\";\n\n      var icon = blockies.create({\
    \ // 所有选项都是可选的\n          seed: web3.eth.accounts[0], // 用于生成图标数据的种子，默认：随机\n \
    \         size: 20, // 图标的宽度/高度（以块为单位），默认：8\n          scale: 8, // 每个块的宽度/高度（以像素为单位），默认：4\n\
    \      });\n\n      document.querySelector(\"div.avatar\").appendChild(icon);\n\
    ```\n\n因此，我们升级了 JS 代码的已登录部分，以生成图标并将其粘贴到头像区域。在渲染之前，我们应该用 CSS 稍微对齐一下：\n\n```\ndiv.avatar\
    \ {\n    width: 100%;\n    text-align: center;\n    margin: 10px 0;\n}\n```\n\n\
    现在，如果我们在登录 MetaMask 时刷新页面，应该会看到生成的头像图标。\n\n![头像图标](img/00022.jpeg)\n\n### 账户余额\n\
    \n现在让我们输出一些账户余额信息。\n\n我们有一系列专门为此目的开发的只读函数可供使用。因此，让我们查询区块链并请求一些信息。为此，我们需要通过以下步骤[调用智能合约函数](https://bitfalls.com/2018/04/08/how-to-call-ethereum-smart-contract-functions/)。\n\
    \n#### 1. ABI\n\n获取我们要调用其函数的合约的 ABI。ABI 包含函数签名，因此我们的 JS 代码知道如何调用它们。在此处了解更多关于 ABI\
    \ 的信息：[此处](https://www.sitepoint.com/compiling-smart-contracts-abi/)。\n\n你可以通过打开编译后项目文件夹中的\
    \ `build/TNSToken.json` 和 `build/StoryDao.json` 文件，并*仅*选择 `abi` 部分——即方括号 `[` 和\
    \ `]` 之间的部分——来获取 TNS 代币和 StoryDAO 的 ABI：\n\n![ABI 选择](img/00023.jpeg)\n\n我们将把这个\
    \ ABI 放在 JavaScript 代码的顶部，放入 `main.js` 中，如下所示：\n\n![加载了代币和 DAO 的 ABI](img/00024.jpeg)\n\
    \n#### 一个缩写说明\n\n请注意，上面的截图显示了缩写插入，由我的代码编辑器（Microsoft Visual Code）折叠。如果你查看行号，会发现代币的\
    \ ABI 有 400 行代码，而 DAO 的 ABI 又有 1000 行，因此将其粘贴到本书中没有意义。\n\n#### 2. 实例化代币\n\n```\n\
    if (loggedIn) {\n\n    var token = TNSToken.at('0x3134bcded93e810e1025ee814e87eff252cff422');\n\
    \    var story = StoryDao.at('0x729400828808bc907f68d9ffdeb317c23d2034d5');\n\
    \    token.balanceOf(web3.eth.accounts[0], function(error, result) {console.log(JSON.stringify(result))});\n\
    \    story.getSubmissionCount(function(error, result) {console.log(JSON.stringify(result))});\n\
    //...\n```\n\n我们使用 Truffle 提供的地址调用每个合约，并为每个合约创建一个实例——分别是 `token` 和 `story`。然后，我们简单地调用这些函数（像之前一样异步）。控制台给出了两个零，因为\
    \ MetaMask 中的账户有 0 个代币，并且目前故事中有 0 个提交。\n\n![控制台输出两个零](img/00025.jpeg)\n\n####\
    \ 3. 读取并输出数据\n\n最后，我们可以用已有的信息填充用户的个人资料数据。\n\n让我们更新 JavaScript：\n\n"
- fmt: "\n```\nvar loggedIn;\n\n(function () {\n\n    loggedIn = setLoggedIn(web3.currentProvider\
    \ !== undefined && web3.eth.accounts.length > 0);\n\n    if (loggedIn) {\n\n \
    \       var token = TNSToken.at('0x3134bcded93e810e1025ee814e87eff252cff422');\n\
    \        var story = StoryDao.at('0x729400828808bc907f68d9ffdeb317c23d2034d5');\n\
    \n        token.balanceOf(web3.eth.accounts[0], function(error, result) {console.log(JSON.stringify(result))});\n\
    \        story.getSubmissionCount(function(error, result) {console.log(JSON.stringify(result))});\n\
    \n        readUserStats().then(User => renderUserInfo(User));\n    }\n\n})();\n\
    \nasync function readUserStats(address) {\n    if (address === undefined) {\n\
    \        address = web3.eth.accounts[0];\n    }\n    var User = {\n        numberOfSubmissions:\
    \ await getSubmissionsCountForUser(address),\n        numberOfDeletions: await\
    \ getDeletionsCountForUser(address),\n        isWhitelisted: await isWhitelisted(address),\n\
    \        isBlacklisted: await isBlacklisted(address),\n        numberOfProposals:\
    \ await getProposalCountForUser(address),\n        numberOfVotes: await getVotesCountForUser(address)\n\
    \    }\n    return User;\n}\n\nfunction renderUserInfo(User) {\n    console.log(User);\n\
    \n    document.querySelector('#user_submissions').innerHTML = User.numberOfSubmissions;\n\
    \    document.querySelector('#user_deletions').innerHTML = User.numberOfDeletions;\n\
    \    document.querySelector('#user_proposals').innerHTML = User.numberOfProposals;\n\
    \    document.querySelector('#user_votes').innerHTML = User.numberOfVotes;\n \
    \   document.querySelector('dd.user_blacklisted').style.display = User.isBlacklisted\
    \ ? 'inline-block' : 'none';\n    document.querySelector('dt.user_blacklisted').style.display\
    \ = User.isBlacklisted ? 'inline-block' : 'none';\n    document.querySelector('dt.user_whitelisted').style.display\
    \ = User.isWhitelisted ? 'inline-block' : 'none';\n    document.querySelector('dd.user_whitelisted').style.display\
    \ = User.isWhitelisted ? 'inline-block' : 'none';\n}\n\nasync function getSubmissionsCountForUser(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(0);\n\
    \    });\n}\nasync function getDeletionsCountForUser(address) {\n    if (address\
    \ === undefined) {\n        address = web3.eth.accounts[0];\n    }\n    return\
    \ new Promise(function (resolve, reject) {\n        resolve(0);\n    });\n}\n\
    async function getProposalCountForUser(address) {\n    if (address === undefined)\
    \ {\n        address = web3.eth.accounts[0];\n    }\n    return new Promise(function\
    \ (resolve, reject) {\n        resolve(0);\n    });\n}\nasync function getVotesCountForUser(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(0);\n\
    \    });\n}\nasync function isWhitelisted(address) {\n    if (address === undefined)\
    \ {\n        address = web3.eth.accounts[0];\n    }\n    return new Promise(function\
    \ (resolve, reject) {\n        resolve(false);\n    });\n}\nasync function isBlacklisted(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(false);\n\
    \    });\n}\n```\n\nAnd let’s change the profile info section:\n\n```\n<div class=\"\
    logged in\" style=\"display: none\">\n    <p>You are logged in!</p>\n    <div\
    \ class=\"avatar\">\n\n    </div>\n    <dl>\n        <dt>Submissions</dt>\n  \
    \      <dd id=\"user_submissions\"></dd>\n        <dt>Proposals</dt>\n       \
    \ <dd id=\"user_proposals\"></dd>\n        <dt>Votes</dt>\n        <dd id=\"user_votes\"\
    ></dd>\n        <dt>Deletions</dt>\n        <dd id=\"user_deletions\"></dd>\n\
    \        <dt class=\"user_whitelisted\">Whitelisted</dt>\n        <dd class=\"\
    user_whitelisted\">Yes</dd>\n        <dt class=\"user_blacklisted\">Blacklisted</dt>\n\
    \        <dd class=\"user_blacklisted\">Yes</dd>\n    </dl>\n</div>\n```\n\nYou’ll\
    \ notice we used promises when fetching the data, even though our functions are\
    \ currently just mock functions: they return flat data immediately. This is because\
    \ each of those functions will need a different amount of time to fetch the data\
    \ we asked it to fetch, so we’ll *await* their completion before populating the\
    \ `User` object and then passing it on into the render function which updates\
    \ the info on the screen.\n\nIf you’re unfamiliar with JS promises and would like\
    \ to learn more, see [this post](https://medium.freecodecamp.org/javascript-from-callbacks-to-async-await-1cc090ddad99).\n\
    \nFor now, all our functions are mocks; we’ll need to do some writes before there’s\
    \ something to read. But first we’ll need to be ready to notice those writes happening!\n\
    \n### Listening to events\n\nIn order to be able to follow events emitted by the\
    \ contract, we need to listen for them — as otherwise we’ve put all those `emit`\
    \ statements into the code for nothing. The middle section of the mock UI we built\
    \ is meant to hold those events.\n\nHere’s how we can listen to events emitted\
    \ by the blockchain:\n\n```\n// Events\n\nvar WhitelistedEvent = story.Whitelisted(function(error,\
    \ result) {\n    if (!error) {\n        console.log(result);\n    }\n});\n```\n\
    \nHere we call the `Whitelisted` function on the `story` instance of our `StoryDao`\
    \ contract, and pass a callback into it. This callback is automatically called\
    \ whenever this given event is fired. So when a user gets whitelisted, the code\
    \ will automatically log to the console the output of that event.\n\nHowever,\
    \ this will only get the last event of the last block mined by a network. So if\
    \ there are several `Whitelisted` events fired from block 1 to 10, it will only\
    \ show us those in block 10, if any. A better way is to use this approach:\n\n\
    ```\nstory.Whitelisted({}, { fromBlock: 0, toBlock: 'latest' }).get((error, eventResult)\
    \ => {\n  if (error) {\n    console.log('Error in myEvent event handler: ' + error);\n\
    \  } else {  \n    // eventResult contains list of events!\n    console.log('Event:\
    \ ' + JSON.stringify(eventResult[0].args));\n  }\n});\n```\n\n#### Ahem, Excuse\
    \ Me ...\n\nPut the above into a separate section at the bottom of your JS file,\
    \ one dedicated to events.\n\nHere, we use the `get` function which lets us define\
    \ the block range from which to fetch events. We use 0 to latest, meaning we can\
    \ fetch all events of this type, ever. But this has the added problem of clashing\
    \ with the watching method above. The watching method outputs the last block’s\
    \ event, and the `get` method outputs all of them. We need a way to make the JS\
    \ ignore double events. Don’t write those you already fetched from history. We’ll\
    \ do that further down, but for now, let’s deal with whitelisting.\n\n### Account\
    \ whitelisting\n\nFinally, let’s get to some write operations.\n\nThe first and\
    \ simplest one is getting whitelisted. Remember, to get whitelisted, an account\
    \ needs to send at least 0.01 ether to the DAO’s address. You’ll get this address\
    \ on deployment. If your Ganache/PoA chain restarted in between parts of this\
    \ course, that’s okay, simply re-run the migrations with `truffle migrate --reset`\
    \ and you’ll get the new addresses for both the token and the DAO. In my case,\
    \ the address of the DAO is `0x729400828808bc907f68d9ffdeb317c23d2034d5` and my\
    \ token is at `0x3134bcded93e810e1025ee814e87eff252cff422`.\n\nWith everything\
    \ above set up, let’s try sending an amount of ether to the DAO address. Let’s\
    \ try it with 0.05 ether just for fun, so we can see if the DAO gives us the extra\
    \ calculated tokens, too, for overpaying.\n\n#### Customize the Gas Amount\n\n\
    Don’t forget to customize the gas amount — just slap another zero on top of the\
    \ 21000 limit — using the icon marked red. Why is this necessary? Because the\
    \ function that gets triggered by a simple ether send (the fallback function)\
    \ executes additional logic which goes beyond 21000, which is enough for simple\
    \ sends. So we need to up the limit. Don’t worry: anything over this limit is\
    \ instantly refunded. For a primer on how gas works, see [here](https://www.sitepoint.com/ethereum-transaction-costs).\n\
    \n![Sending ether to the DAO](images/00026.jpeg)\n"
