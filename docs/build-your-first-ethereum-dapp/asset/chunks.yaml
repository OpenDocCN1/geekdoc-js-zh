    module.exports = {\n  solc: {\n    optimizer: {\n      enabled: true,\n      runs:\
    \ 200\n    }\n  },\n  networks: {\n    development: {\n// ...\n```\n\nThis will\
    \ run the optimizer across the code 200 times to find areas that can be minified,\
    \ removed or abstracted before deployment, which should reduce the deployment\
    \ cost significantly.\n\n## Conclusion\n\nThis concludes our exhaustive DAO development\
    \ — but the course isn’t over yet! We still have to build and deploy the UI for\
    \ this story. Luckily, with the back end completely hosted on the blockchain,\
    \ building the front end is much less complicated. Let’s look at that in our penultimate\
    \ part of this series.\n\n# Chapter 7: Building a Web3 UI for a DAO Contract\n\
    \n**In [part 6](#part0007_split_000.html_6LJU0-63b9e60a50594bb1b6dced0e79731cb3)\
    \ of this tutorial series on building DApps with Ethereum, we took the DAO towards\
    \ completion by adding voting, blacklisting/unblacklisting, and dividend distribution\
    \ and withdrawal, while throwing in some additional helper functions for good\
    \ measure. In this tutorial, we’ll build a web interface for interacting with\
    \ our story, as we otherwise can’t count on any user engagement. So this is the\
    \ final part of our story before we launch it into the wild.**\n\nSince this isn’t\
    \ a web application tutorial, we’ll keep things extremely simple. The code below\
    \ is not production-ready, and is meant to serve only as a proof of concept on\
    \ how to connect JavaScript to the blockchain. But first, let’s add a new migration.\n\
    \n## Automating Transfers\n\nRight now as we deploy our token and DAO, they sit\
    \ on the blockchain but don’t interact. To test what we’ve built, we need to manually\
    \ transfer token ownership and balance to the DAO, which can be tedious during\
    \ testing.\n\nLet’s write a new migration which does this for us. Create the file\
    \ `4_configure_relationship.js` and put the following content in there:\n\n```\n\
    var Migrations = artifacts.require(\"./Migrations.sol\");\nvar StoryDao = artifacts.require(\"\
    ./StoryDao.sol\");\nvar TNSToken = artifacts.require(\"./TNSToken.sol\");\n\n\
    var storyInstance, tokenInstance;\n\nmodule.exports = function (deployer, network,\
    \ accounts) {\n\n    deployer.then(function () {\n            return TNSToken.deployed();\n\
    \        }).then(function (tIns) {\n            tokenInstance = tIns;\n      \
    \      return StoryDao.deployed();\n        }).then(function (sIns) {\n      \
    \      storyInstance = sIns;\n            return balance = tokenInstance.totalSupply();\n\
    \        }).then(function (bal) {\n            return tokenInstance.transfer(storyInstance.address,\
    \ bal);\n        })\n        .then(function (something) {\n            return\
    \ tokenInstance.transferOwnership(storyInstance.address);\n        });\n}\n```\n\
    \nHere’s what this code does. First, you’ll notice it’s promise-based. It’s full\
    \ of `then` calls. This is because we depend on a function returning some data\
    \ before we call the next one. All contract calls are promise-based, meaning they\
    \ don’t return data immediately because Truffle needs to ask the node for information,\
    \ so a *promise to return data at a future time* is made. We force the code to\
    \ wait for this data by using `then` and providing all `then` calls with callback\
    \ functions which get called with this result when it’s finally given.\n\nSo,\
    \ in order:\n\n*   first, ask the node for the address of the deployed token and\
    \ return it\n\n*   then, accepting this data, save it into a global variable and\
    \ ask for the address of the deployed DAO and return it\n\n*   then, accepting\
    \ this data, save it into a global variable and ask for the balance the owner\
    \ of the token contract will have in their account, which is technically the total\
    \ supply, and return this data\n\n*   then, once you get this balance, use it\
    \ to call the `transfer` function of this token and send tokens to the DAO’s address\
    \ and return the result\n\n*   then, ignore the returned result — we just wanted\
    \ to know when it’s done — and finally transfer ownership of the token to the\
    \ DAO’s address, returning the data but not discarding it.\n\nRunning `truffle\
    \ migrate --reset` should now produce an output like this:\n\n![Truffle migrate](images/00016.jpeg)\n\
    \n## The Front End\n\nThe front end is a regular, static HTML page with some JavaScript\
    \ thrown in for communicating with the blockchain and some CSS to make things\
    \ less ugly.\n\nLet’s create a file `index.html` in the subfolder `public` and\
    \ give it the following content:\n"
