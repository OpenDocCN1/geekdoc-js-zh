- fmt: "\nTo develop our application, we can use one of several frameworks and starter\
    \ kits at our disposal: [Dapp](http://dapp.readthedocs.io/en/latest/), [eth-utils](https://github.com/ethersphere/eth-utils),\
    \ [Populus](https://populus.readthedocs.io/en/latest/quickstart.html), [Embark](https://github.com/embark-framework/embark)\
    \ … and so on. But we’ll go with the current king of the ecosystem, [Truffle](http://truffleframework.com/).\n\
    \nInstall it with the following:\n\n```\nnpm install -g truffle\n```\n\nThis will\
    \ make the `truffle` command available everywhere. Now we can start the project\
    \ with `truffle init`.\n\n## Starting the Token\n\nLet’s get right into it and\
    \ build our token. It’ll be a somewhat standard cookie-cutter ERC20 token with\
    \ a twist. (You’ll see which twist lower in this post.) First, we’ll pull in some\
    \ dependencies. The OpenZeppelin libraries are battle-tested high quality solidity\
    \ contracts usable for extending and building contracts from.\n\n```\nnpm install\
    \ openzeppelin-solidity\n```\n\nNext, let’s create a new token file:\n\n```\n\
    truffle create contract TNSToken\n```\n\nThe default template that truffle generates\
    \ here is a little out of date, so let’s get it updated:\n\n```\npragma solidity\
    \ ^0.4.24;\n\ncontract TNStoken {\n    constructor() public {\n\n    }\n}\n```\n\
    \nUp until now, the constructor of the token contract was supposed to be called\
    \ the same as the contract itself, but for clarity it was changed to `constructor`.\
    \ It should also always have a modifier telling the compiler who is allowed to\
    \ deploy and interact with this contract (`public` meaning everyone).\n\n## SafeMath\n\
    \nThe only Zeppelin contract we’ll be using in this case is their `SafeMath` contract.\
    \ In Solidity, we import contracts with the `import` keyword, while the compiler\
    \ will generally not require a full path, only a relative one, like so:\n\n```\n\
    pragma solidity ^0.4.24;\n\nimport \"../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\"\
    ;\n\ncontract TNStoken {\n    using SafeMath for uint256;\n    constructor() public\
    \ {\n\n    }\n}\n```\n\nSo, what is `SafeMath`? Long ago, there was an issue of\
    \ [184 billion bitcoins being created](https://bitfalls.com/2018/01/14/curious-case-184-billion-bitcoin/)\
    \ because of a math problem in code. To prevent issues even remotely similar to\
    \ these (not that this one in particular is possible in Ethereum), the SafeMath\
    \ library exists. When two numbers are of the `MAX_INT` size (i.e. the maximum\
    \ possible number in an operating system), summing them up would make the value\
    \ “wrap around” to zero, like a car’s odometer being reset to 0 after reaching\
    \ 999999 kilometers. So the SafeMath library has functions like these:\n\n```\n\
    /**\n* @dev Adds two numbers, throws on overflow.\n*/\nfunction add(uint256 a,\
    \ uint256 b) internal pure returns (uint256 c) {\n  c = a + b;\n  assert(c >=\
    \ a);\n  return c;\n}\n```\n\nThis function prevents this issue: it checks whether\
    \ the sum of two numbers is still bigger than each of the two operands.\n\nWhile\
    \ it’s not too easy to make such silly mistakes when writing Solidity contracts,\
    \ it’s still better to be safe than sorry.\n\nBy `using SafeMath for uint256`,\
    \ we replace the standard `uint256` numbers in Solidity (256bit unsigned — a.k.a.\
    \ positive-only — whole numbers) with these “safe” versions. Instead of summing\
    \ numbers like this: `sum = someBigNumber + someBiggerNumber`, we’ll be summing\
    \ them like this: `sum = someBigNumber.add(someBiggerNumber)`, thereby being safe\
    \ in our calculations.\n\n## ERC20 from Scratch\n\nWith our math made safe, we\
    \ can create our token.\n\nERC20 is a standard with a well-defined interface,\
    \ so for reference, let’s add it into the contract. Read about [the token standards\
    \ here](https://medium.freecodecamp.org/lets-talk-about-the-ethereum-token-standards-you-need-to-know-8af9fcb7e54b).\n\
    \nSo the functions that an ERC20 token should have are:\n\n```\npragma solidity\
    \ ^0.4.24;\n\nimport \"../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\"\
    ;\n\ncontract ERC20 {\n    function totalSupply() public view returns (uint256);\n\
    \    function balanceOf(address who) public view returns (uint256);\n    function\
    \ transfer(address to, uint256 value) public returns (bool);\n    event Transfer(address\
    \ indexed from, address indexed to, uint256 value);\n    function allowance(address\
    \ owner, address spender) public view returns (uint256);\n    function transferFrom(address\
    \ from, address to, uint256 value) public returns (bool);\n    function approve(address\
    \ spender, uint256 value) public returns (bool);\n    event Approval(address indexed\
    \ owner, address indexed spender, uint256 value);\n}\n\ncontract TNStoken {\n\n\
    \    using SafeMath for uint256;\n\n    constructor() public {\n\n    }\n}\n```\n\
    \nThis might seem complex, but it’s actually very simple. This is a “directory”\
    \ of functions our token needs to have, and we’ll build them one by one, explaining\
    \ what each of them means. Consider the above an *interface* for our token. We’ll\
    \ see how and why this is useful when we create the Story DAO application.\n\n\
    ### Basic balances\n\nLet’s start. A **token** is actually just a “spreadsheet”\
    \ in the Ethereum blockchain, like this:\n\n```\n| Name | Amount |\n|:--|:--|\n\
    | Bruno | 4000 |\n| Joe | 5000 |\n| Anne | 0 |\n| Mike | 300 |\n```\n\nSo let’s\
    \ create a `mapping`, which is essentially exactly like a spreadsheet in the contract:\n\
    \n```\nmapping(address => uint256) balances;\n```\n\nAccording to the interface\
    \ above, this needs to be accompanied by a `balanceOf` function, which can read\
    \ this table:\n\n```\nfunction balanceOf(address _owner) public view returns (uint256)\
    \ {\n    return balances[_owner];\n}\n```\n\nThe function `balanceOf` accepts\
    \ one argument: `_owner` is public (can be used by anyone), is a `view` function\
    \ (meaning it’s free to use — does not require a transaction), and returns a `uint256`\
    \ number, the balance of the owner of the address sent in. Everyone’s balance\
    \ of tokens is publicly readable.\n\n### Total supply\n\nKnowing the total supply\
    \ of the token is important for its users and for coin tracking applications,\
    \ so let’s define a contract property (variable) to track this and another free\
    \ function through which to read this:\n\n```\nuint256 totalSupply_;\nfunction\
    \ totalSupply() public view returns (uint256) {\n    return totalSupply_;\n}\n\
    ```\n\n### Sending tokens\n\nNext, let’s make sure the owner of a number of tokens\
    \ can transfer them to someone else. We’ll also want to know when a transfer has\
    \ occurred, so we’ll define a Transfer event as well. A **Transfer event** lets\
    \ us listen for transfers in the blockchain via JavaScript, so that our applications\
    \ can be aware of when these events are emitted instead of constantly manually\
    \ checking if a transfer happened. Events are declared alongside variables in\
    \ a contract, and emitted with the `emit` keyword. Let’s add the following into\
    \ our contract now:\n\n```\nevent Transfer(address indexed from, address indexed\
    \ to, uint256 value);\n\nfunction transfer(address _to, uint256 _value) public\
    \ returns (bool) {\n    require(_to != address(0));\n    require(_value <= balances[msg.sender]);\n\
    \n    balances[msg.sender] = balances[msg.sender].sub(_value);\n    balances[_to]\
    \ = balances[_to].add(_value);\n    emit Transfer(msg.sender, _to, _value);\n\
    \    return true;\n}\n```\n\nThis function accepts two arguments: `_to`, which\
    \ is the destination address which will receive the tokens, and `value`, which\
    \ is the number of tokens. It’s important to remember that `value` is the number\
    \ of the smallest units of the token, not the whole units. So if a token is declared\
    \ to have 10 decimals, then in order to send one token you would send 10000000000.\
    \ This level of granularity lets us transact minuscule amounts.\n\nThe function\
    \ is public, meaning anyone can use it — both other contracts and users — and\
    \ it returns `true` if the operation was successful.\n"
