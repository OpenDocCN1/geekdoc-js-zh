  trans: "\n这里我们为提交表单添加了一个事件监听器，一旦提交，首先会拒绝所有未登录用户的操作，然后获取内容并将其转换为十六进制格式（这是我们将值存储为\
    \ `bytes` 所需的格式）。\n\n最后，它通过调用 `createSubmission` 函数并传入两个参数来创建一笔交易：条目文本和 `false`\
    \ 标志（表示不是图片）。第三个参数是交易设置：`value` 表示要发送的以太币数量，`gas` 表示你希望默认使用的 gas 限额。这些可以在客户端（MetaMask）中手动更改，但这是一个确保我们不会触及限额的良好起点。最后一个参数是我们已经熟悉的回调函数，该回调会调用一个刷新函数，加载故事的所有提交内容。目前，这个刷新函数只加载故事哈希并将其输出到控制台，以便我们检查一切是否正常。\n\
    \n#### 为什么是零？\n\n以太币数量为 0，因为第一个条目是免费的。后续条目需要添加以太币。我们将这个动态计算留作你的家庭作业。提示：我们的 DAO\
    \ 中有一个 `calculateSubmissionFee` 函数正是为此目的。\n\n此时，我们需要修改 JavaScript 顶部在页面加载时自动执行的函数：\n\
    \n```\nif (loggedIn) {\n\n    token.balanceOf(web3.eth.accounts[0], function(error,\
    \ result) {console.log(JSON.stringify(result))});\n    story.getSubmissionCount(function(error,\
    \ result) {console.log(JSON.stringify(result))});\n\n    web3.eth.defaultAccount\
    \ = web3.eth.accounts[0]; // CHANGE\n\n    readUserStats().then(User => renderUserInfo(User));\n\
    \    refreshSubmissions(); // CHANGE\n} else {\n    document.getElementById(\"\
    submission-body-btn\").disabled = \"disabled\";\n}\n```\n\n修改处用 `// CHANGE` 标记：第一个修改让我们设置执行交易的默认账户。这可能会在\
    \ Web3 的未来版本中成为默认行为。第二个修改在页面加载时刷新提交内容，这样当网站打开时，我们就能获得完整加载的故事。\n\n如果你现在尝试提交一个条目，一旦你点击\
    \ *提交*，MetaMask 应该会打开并要求你确认提交。\n\n![提交条目](img/00032.jpeg)\n\n![确认条目](img/00033.jpeg)\n\
    \n你还应该看到事件在事件部分打印出来。\n\n![事件已确认](img/00034.jpeg)\n\n控制台应该会输出这个新条目的哈希。\n\n![哈希已打印](img/00035.jpeg)\n\
    \n#### MetaMask 和 Nonce\n\nMetaMask 目前存在私有网络和 nonce 的问题。问题描述见[此处](https://ethereum.stackexchange.com/questions/30921/tx-doesnt-have-the-correct-nonce-metamask)，这个问题很快会修复，但如果你在提交条目时在\
    \ JavaScript 控制台中遇到 `nonce` 错误，目前的临时解决方案是重新安装 MetaMask（禁用再启用无效）。请记住先备份你的助记词：你需要它来重新导入你的\
    \ MetaMask 账户！\n\n最后，让我们获取这些条目并显示它们。先从一些 CSS 开始：\n\n```\n.content-submissions\
    \ .submission-submitter {\n  font-size: small;\n}\n```\n\n现在更新 `refreshSubmissions`\
    \ 函数：\n\n```\nfunction refreshSubmissions() {\n  story.getAllSubmissionHashes(function\
    \ (error, result) {\n    var entries = [];\n    for (var i = 0; i < result.length;\
    \ i++) {\n      story.getSubmission(result[i], (err, res) => {\n\n        if (res[2]\
    \ === web3.eth.accounts[0]) {\n          res[2] = 'you';\n        }\n        let\
    \ el = \"\";\n        el += '<div class=\"submission\">';\n        el += '<div\
    \ class=\"submission-body\">' + web3.toAscii(res[0]) + '</div>';\n        el +=\
    \ '<div class=\"submission-submitter\">by: ' + res[2] + '</div>';\n        el\
    \ += '</div>';\n        el += '</div>';\n        document.querySelector('.content-submissions').innerHTML\
    \ += el;\n      });\n    }\n  });\n}\n```\n\n我们遍历所有提交内容，获取它们的哈希，逐一获取并输出到屏幕上。如果提交者与登录用户相同，则显示“you”而不是地址。\n\
    \n![渲染后的提交](img/00036.jpeg)\n\n让我们再添加一个条目来测试。\n\n![另一个条目](img/00037.jpeg)\n\n\
    ## 结论\n\n在这一部分中，我们为 DApp 开发了一个基本前端的基础。\n\n由于开发完整的前端应用程序本身就可以是一门课程，我们将进一步的开发留作你的家庭作业。只需按照演示的方式调用函数，将它们集成到常规的\
    \ JavaScript 流程中（通过 VueJS 这样的框架，或者像我们上面那样使用普通的 jQuery 或原生 JS），然后将所有内容绑定在一起。这实际上就像与标准服务器\
    \ API 通信一样。如果你遇到困难，可以查看项目仓库中的代码！\n\n你可以做的其他升级包括：\n\n*   检测 web3 提供者何时更改或可用账户数量何时变化，以指示登录或登出事件并自动重新加载页面\n\
    \n*   除非用户已登录，否则阻止渲染提交表单\n\n*   除非用户至少拥有 1 个代币，否则阻止渲染投票和删除按钮等\n\n*   允许用户提交并渲染\
    \ Markdown！\n\n*   按时间（区块编号）而不是按类型对事件进行排序！\n\n*   让事件更美观、更易读：不显示十六进制内容，而是将其转换为\
    \ ASCII 并截断为 30 个字符左右\n\n*   使用像 VueJS 这样的合适 JS 框架，让你的项目更具可重用性，并拥有更结构化的代码。\n\n\
    在下一部分也是最后一部分中，我们将专注于将项目部署到实时互联网上。敬请期待！\n\n# 第 8 章：启动 StoryDao\n\n**在本系列关于使用以太坊构建\
    \ DApp 教程的第 7 部分中，我们展示了如何构建应用的前端，为我们一直在开发的故事设置并部署 UI。**\n\n现在是时候进行一些部署并编写一些最终函数了。\n\
    \n## 自毁\n\n某些事情可能会非常非常糟糕，整个 DAO 可能会被摧毁——要么是由于糟糕且仓促编写的代码被黑客攻击，要么是由于参与者太多导致无法执行长循环。（提案上的投票者太多可能会破坏系统；我们确实没有为此采取任何预防措施！）以防万一，拥有一个相当于“大红按钮”的东西可能会很有用。首先，让我们升级我们的\
    \ StoryDao：\n\n```\nfunction bigRedButton() onlyOwner external {\n    active =\
    \ false;\n    withdrawToOwner();\n    token.unlockForAll();\n}\n```\n\n然后，让我们在\
    \ Token 合约中实现一次性解锁所有代币的功能：\n\n```\n/**\n@dev 解锁每个曾经被锁定过代币的用户的所有代币\n*/\nfunction\
    \ unlockForAll() public onlyOwner {\n    uint256 len = touchedByLock.length;\n\
    \    for (uint256 i = 0; i < len; i++) {\n        locked[touchedByLock[i]] = 0;\n\
    \    }\n}\n```\n\n自然，我们需要将这个新的地址列表添加到合约中：\n\n```\naddress[] touchedByLock;\n```\n\
    \n并且我们需要升级 `increaseLockedAmount` 函数，将地址添加到此列表中：\n\n```\n/**\n@dev _owner 将被阻止发送\
    \ _amount 数量的代币。超出此数量的代币将可花费。\n*/\nfunction increaseLockedAmount(address _owner,\
    \ uint256 _amount) public onlyOwner returns (uint256) {\n    uint256 lockingAmount\
    \ = locked[_owner].add(_amount);\n    require(balanceOf(_owner) >= lockingAmount,\
    \ \"锁定金额不得超过余额\");\n    locked[_owner] = lockingAmount;\n    touchedByLock.push(_owner);\n\
    \    emit Locked(_owner, lockingAmount);\n    return lockingAmount;\n}\n```\n\n\
    我们还应该更新 StoryDao 合约中所需的代币接口，以包含这个新函数的签名：\n\n```\n// ...\n    function getUnlockedAmount(address\
    \ _owner) view public returns (uint256);\n    function unlockForAll() public;\n\
    }\n```\n\n"
- fmt: "\nWith the active-story block we added before (inability to run certain functions\
    \ unless the story’s `active` flag is true), this should do the trick. No one\
    \ else will be able to waste money by sending it to the contract, and everyone’s\
    \ tokens will get unlocked.\n\nThe owner doesn’t get the ether people submitted.\
    \ Instead, the withdrawal function becomes available so people can take their\
    \ ether back, and everyone’s taken care of.\n\nNow our contracts are finally ready\
    \ for deployment.\n\n### What about `selfdestruct`?\n\nThere’s a function called\
    \ `selfdestruct` which makes it possible to destroy a contract. It looks like\
    \ this:\n\n```\nselfdestruct(address);\n```\n\nCalling it will disable the contract\
    \ in question, removing its code from the blockchain’s state and disabling all\
    \ functions, all while sending the ether in that address to the address provided.\
    \ This is not a good idea in our case: we still want people to be able to withdraw\
    \ their ether; we don’t want to take it from them. Besides, any ether sent straight\
    \ to the address of a suicided contract will get lost forever (burned) because\
    \ there’s no way to get it back.\n\n## Deploying the Contract\n\nTo deploy the\
    \ smart contracts fully, we need to do the following:\n\n1.  deploy to mainnet\n\
    2.  send tokens to `StoryDAO` address\n3.  transfer ownership of `Token` contract\
    \ to `StoryDao`.\n\nLet’s go.\n\n### Mainnet Deployment\n\nTo deploy to mainnet,\
    \ we need to add a new network into our `truffle.js` file:\n\n```\nmainnet: {\n\
    \  provider: function() {\n    return new WalletProvider(\n      Wallet.fromPrivateKey(\n\
    \        Buffer.from(PRIVKEY, \"hex\")), \"https://mainnet.infura.io/\"+INFURAKEY\n\
    \    );\n  },\n  gasPrice: w3.utils.toWei(\"20\", \"gwei\"),\n  network_id: \"\
    1\",\n},\n```\n\nLuckily, this is very simple. It’s virtually identical to the\
    \ Rinkeby deployment; we just need to remove the gas amount (let it calculate\
    \ it on its own) and change the gas price. We should also change the network ID\
    \ to 1 since that’s the mainnet ID.\n\nWe use this like so:\n\n```\ntruffle migrate\
    \ --network mainnet\n```\n\nThere’s one caveat to note here. If you’re deploying\
    \ on a network you previously deployed on (even if you just deployed the token\
    \ onto the mainnet and wanted to deploy the `StoryDao` later) you might get this\
    \ error:\n\n```\nAttempting to run transaction which calls a contract function,\
    \ but recipient address XXX is not a contract address\n```\n\nThis happens because\
    \ Truffle remembers where it deployed already-deployed contracts so that it can\
    \ reuse them in subsequent migrations, avoiding the need to re-deploy. But if\
    \ your network restarted (i.e. Ganache) or you made some incompatible changes,\
    \ it can happen that the address it has saved doesn’t actually contain this code\
    \ any more, so it will complain. You can get around this by resetting migrations:\n\
    \n```\ntruffle migrate --network mainnet --reset\n```\n\n### Send tokens to `StoryDao`\
    \ address\n\nGet the address of the token and the address of the `StoryDao` from\
    \ the deployment process.\n\n![Addresses from Deployment](images/00038.gif)\n\n\
    Then just use MEW as previously described to send the tokens.\n\n![Sending tokens](images/00039.jpeg)\n\
    \n![Generating and confirming transaction](images/00040.jpeg)\n\nIf you get Out\
    \ of Gas errors, just increase the gas limit. Remember: the rest of the unused\
    \ gas always gets refunded, so there’s no fear of losing any more money than your\
    \ transaction costs (sending the tokens should be under 40000 gas).\n\n### Transfer\
    \ ownership of token to `StoryDao`\n\nTo transfer ownership, we need to call the\
    \ `transferOwnership` function on the token. Let’s load the token into MEW. In\
    \ the `Contracts` screen, we enter the address and the contract’s ABI (grab it\
    \ from the `/build` folder). Clicking *Access* will then let us access the functions\
    \ in that contract in a menu from which we select `transferOwnership`.\n\n![Transfer\
    \ Ownership](images/00041.jpeg)\n\n#### You Only Need the ABI of Functions You'll\
    \ Call\n\nIt’s enough to only include the ABI of the functions you intend to call:\
    \ it doesn’t have to be the whole ABI of the token! You could just include the\
    \ ABI of the `transferOwnership` function and it would be fine!\n\nWe then select\
    \ the new owner (the address of the deployed `StoryDao`) and unlock the current\
    \ owner’s wallet (the same wallet we previously sent tokens from).\n\n![Unlocking\
    \ and writing](images/00042.jpeg)\n\nAfter writing this change, we can inspect\
    \ the read-only function `owner` in the token contract (same menu as `transferOwnership`).\
    \ It should show the new owner now.\n\n![Changed owner](images/00043.gif)\n\n\
    To make sure that the `StoryDao` address actually has the tokens, we can select\
    \ the `balanceOf` function and enter the `StoryDao`’s address into the `_owner`\
    \ field, then click on *Read*:\n\n![StoryDao has tokens](images/00044.jpeg)\n\n\
    Indeed, 100 million tokens are in the `StoryDao` address.\n\n#### Could Have Been\
    \ Done In Deployment\n\nWe could have done the token sending and ownership transferring\
    \ as part of the deployment step as well. Try figuring out how in a test environment.\n\
    \n## Verification\n\nAs per [part 3](https://www.sitepoint.com/ethereum-dapps-compiling-deploying-testing-tns-tokens)\
    \ of this series, it would benefit us greatly to verify the contracts of both\
    \ the DAO and the Token on Etherscan. That green checkmark can go a long way.\n\
    \nFollow the instructions in that part to get your contracts verified. Note that,\
    \ during the verification step, you’ll now have to mark the optimizer as active,\
    \ since we’re optimizing our code for cheaper deployment!\n\n## Deploying to the\
    \ Web\n\nTo deploy the web UI of `StoryDao`, follow the instructions from the\
    \ “regular” web development world. Since, in this case, it’s all static code,\
    \ you can even host it on GitHub Pages or something similar.\n\nRead about some\
    \ of the options [here](https://www.sitepoint.com/tag/deploy/) and [here](https://developer.mozilla.org/en-US/docs/Learn/Getting_started_with_the_web/Publishing_your_website).\n\
    \nOnce the page is up, configure the UI to use the addresses of contracts we got\
    \ from the migration step. Alternatively, register ENS names for the token and\
    \ the `StoryDao`, and you can keep the web UI static and fixed, hardcoding the\
    \ addresses, and then only change the Ethereum address those ENS names are pointing\
    \ at.\n\n## Conclusion\n\nThis concludes the DAO tutorial. We hope it helped you\
    \ recognize the complexities of Solidity development, but we also hope that it\
    \ made some things clearer and made you more curious.\n\nAs always, the best way\
    \ to learn is by doing. Experiment, make mistakes, reboot and rebuild. Blockchain\
    \ development of this type is in high demand, and it’s only getting more popular,\
    \ so you have an opportunity to get in on the ground floor.\n\nGood luck!\n\n\
    *P.S. If you enjoyed this tutorial, feel free to [ping the author on Twitter](https://twitter.com/bitfalls?lang=en).\
    \ If you have complaints, suggestions, ideas, etc. please shoot them over into\
    \ the repository on GitHub!*\n"
