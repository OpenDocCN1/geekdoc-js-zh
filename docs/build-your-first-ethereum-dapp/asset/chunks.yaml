    \        StoryDao sd = StoryDao(DeployedAddresses.StoryDao());\n\n        uint256\
    \ daofee = 100; // 百分之一，即 100 表示 1%\n        uint256 whitelistfee = 10000000000000000;\
    \ // 以 Wei 为单位，即 0.01 以太币\n\n        uint256 durationDays = 21; // 故事章节的持续时间（天）\n\
    \        uint256 durationSubmissions = 1000; // 故事章节的提交数量限制\n\n        Assert.equal(sd.daofee(),\
    \ daofee, \"初始 DAO 费用应为 100\");\n        Assert.equal(sd.whitelistfee(), whitelistfee,\
    \ \"初始白名单费用应为 0.01 以太币\");\n        Assert.equal(sd.durationDays(), durationDays,\
    \ \"初始天数持续时间应设为 3 周\");\n        Assert.equal(sd.durationSubmissions(), durationSubmissions,\
    \ \"初始提交持续时间应设为 1000 条\");\n    }\n}\n```\n\n这段代码检查`StoryDao`合约是否以正确的费用和持续时间参数成功部署。第一行通过从已部署地址列表中读取合约来确保其已部署，最后一部分执行了一些`assertions`——检查某个断言是否为真。在我们的例子中，我们将数值与已部署合约的初始值进行比较。当结果为“真”时，`Assert.equals`部分会触发一个“True”事件，这正是\
    \ Truffle 在测试时监听的内容。\n\n在`TestStoryDao.js`中，放入以下内容：\n\n```javascript\nimport expectThrow\
    \ from './helpers/expectThrow';\n\nconst StoryDao = artifacts.require(\"StoryDao\"\
    );\n\ncontract('StoryDao Test', async (accounts) => {\n\n    it(\"应通过检查前 3 个账户余额超过\
    \ 20 以太币来确认环境正常\", async () =>{\n        assert.equal(web3.eth.getBalance(accounts[0]).toNumber()\
    \ > 2e+19, true, \"账户 0 余额超过 20 以太币\");\n        assert.equal(web3.eth.getBalance(accounts[1]).toNumber()\
    \ > 2e+19, true, \"账户 1 余额超过 20 以太币\");\n        assert.equal(web3.eth.getBalance(accounts[2]).toNumber()\
    \ > 2e+19, true, \"账户 2 余额超过 20 以太币\");\n    });\n\n    it(\"应使部署者成为合约所有者\", async\
    \ () => {\n        let instance = await StoryDao.deployed();\n        assert.equal(await\
    \ instance.owner(), accounts[0]);\n    });\n\n    it(\"应允许所有者更改费用和持续时间\", async\
    \ () => {\n        let instance = await StoryDao.deployed();\n\n        let newDaoFee\
    \ = 50;\n        let newWhitelistFee = 1e+10; // 1 以太币\n        let newDayDuration\
    \ = 42;\n        let newSubsDuration = 1500;\n\n        instance.changedaofee(newDaoFee,\
    \ {from: accounts[0]});\n        instance.changewhitelistfee(newWhitelistFee,\
    \ {from: accounts[0]});\n        instance.changedurationdays(newDayDuration, {from:\
    \ accounts[0]});\n        instance.changedurationsubmissions(newSubsDuration,\
    \ {from: accounts[0]});\n\n        assert.equal(await instance.daofee(), newDaoFee);\n\
    \        assert.equal(await instance.whitelistfee(), newWhitelistFee);\n     \
    \   assert.equal(await instance.durationDays(), newDayDuration);\n        assert.equal(await\
    \ instance.durationSubmissions(), newSubsDuration);\n    });\n\n    it(\"应禁止非所有者更改费用和持续时间\"\
