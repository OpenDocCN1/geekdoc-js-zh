    \ await getProposalCountForUser(address),\n        numberOfVotes: await getVotesCountForUser(address)\n\
    \    }\n    return User;\n}\n\nfunction renderUserInfo(User) {\n    console.log(User);\n\
    \n    document.querySelector('#user_submissions').innerHTML = User.numberOfSubmissions;\n\
    \    document.querySelector('#user_deletions').innerHTML = User.numberOfDeletions;\n\
    \    document.querySelector('#user_proposals').innerHTML = User.numberOfProposals;\n\
    \    document.querySelector('#user_votes').innerHTML = User.numberOfVotes;\n \
    \   document.querySelector('dd.user_blacklisted').style.display = User.isBlacklisted\
    \ ? 'inline-block' : 'none';\n    document.querySelector('dt.user_blacklisted').style.display\
    \ = User.isBlacklisted ? 'inline-block' : 'none';\n    document.querySelector('dt.user_whitelisted').style.display\
    \ = User.isWhitelisted ? 'inline-block' : 'none';\n    document.querySelector('dd.user_whitelisted').style.display\
    \ = User.isWhitelisted ? 'inline-block' : 'none';\n}\n\nasync function getSubmissionsCountForUser(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(0);\n\
    \    });\n}\nasync function getDeletionsCountForUser(address) {\n    if (address\
    \ === undefined) {\n        address = web3.eth.accounts[0];\n    }\n    return\
    \ new Promise(function (resolve, reject) {\n        resolve(0);\n    });\n}\n\
    async function getProposalCountForUser(address) {\n    if (address === undefined)\
    \ {\n        address = web3.eth.accounts[0];\n    }\n    return new Promise(function\
    \ (resolve, reject) {\n        resolve(0);\n    });\n}\nasync function getVotesCountForUser(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(0);\n\
    \    });\n}\nasync function isWhitelisted(address) {\n    if (address === undefined)\
    \ {\n        address = web3.eth.accounts[0];\n    }\n    return new Promise(function\
    \ (resolve, reject) {\n        resolve(false);\n    });\n}\nasync function isBlacklisted(address)\
    \ {\n    if (address === undefined) {\n        address = web3.eth.accounts[0];\n\
    \    }\n    return new Promise(function (resolve, reject) {\n        resolve(false);\n\
    \    });\n}\n```\n\n接下来，我们来修改个人资料信息部分：\n\n```\n<div class=\"logged in\" style=\"\
    display: none\">\n    <p>您已登录！</p>\n    <div class=\"avatar\">\n\n    </div>\n\
    \    <dl>\n        <dt>提交数</dt>\n        <dd id=\"user_submissions\"></dd>\n \
    \       <dt>提案数</dt>\n        <dd id=\"user_proposals\"></dd>\n        <dt>投票数</dt>\n\
    \        <dd id=\"user_votes\"></dd>\n        <dt>删除数</dt>\n        <dd id=\"\
    user_deletions\"></dd>\n        <dt class=\"user_whitelisted\">白名单</dt>\n    \
    \    <dd class=\"user_whitelisted\">是</dd>\n        <dt class=\"user_blacklisted\"\
    >黑名单</dt>\n        <dd class=\"user_blacklisted\">是</dd>\n    </dl>\n</div>\n\
    ```\n\n你会注意到我们在获取数据时使用了 Promise，尽管当前这些函数只是模拟函数：它们立即返回扁平数据。这是因为每个函数获取所需数据的时间不同，所以我们需要*等待*它们全部完成，然后填充\
    \ `User` 对象，再将其传递给渲染函数，从而更新屏幕上的信息。\n\n如果你不熟悉 JS 的 Promise 并想了解更多，请参阅[这篇文章](https://medium.freecodecamp.org/javascript-from-callbacks-to-async-await-1cc090ddad99)。\n\
    \n目前，所有函数都是模拟的；我们需要先进行一些写入操作，然后才能读取数据。但首先，我们需要准备好监听这些写入操作！\n\n### 监听事件\n\n为了能够跟踪合约发出的事件，我们需要监听它们——否则我们在代码中放置的所有\
    \ `emit` 语句就白费了。我们构建的模拟 UI 的中间部分就是用来显示这些事件的。\n\n以下是如何监听区块链发出的事件：\n\n```\n// 事件\n\
    \nvar WhitelistedEvent = story.Whitelisted(function(error, result) {\n    if (!error)\
    \ {\n        console.log(result);\n    }\n});\n```\n\n这里我们在 `StoryDao` 合约的 `story`\
    \ 实例上调用了 `Whitelisted` 函数，并传入了一个回调函数。每当这个特定事件被触发时，该回调函数会自动被调用。因此，当用户被列入白名单时，代码会自动将事件输出记录到控制台。\n\
    \n然而，这只会获取网络挖出的最后一个区块的最后一个事件。因此，如果从区块 1 到 10 触发了多个 `Whitelisted` 事件，它只会显示区块 10\
    \ 中的事件（如果有的话）。更好的方法是使用以下方式：\n\n```\nstory.Whitelisted({}, { fromBlock: 0, toBlock:\
    \ 'latest' }).get((error, eventResult) => {\n  if (error) {\n    console.log('myEvent\
    \ 事件处理程序出错: ' + error);\n  } else {  \n    // eventResult 包含事件列表！\n    console.log('事件:\
    \ ' + JSON.stringify(eventResult[0].args));\n  }\n});\n```\n\n#### 嗯，打扰一下……\n\n\
    将上述代码放入 JS 文件底部的一个独立部分中，专门用于处理事件。\n\n这里我们使用了 `get` 函数，它允许我们定义获取事件的区块范围。我们使用 0\
    \ 到 latest，意味着可以获取该类型的所有事件（从开始到现在）。但这会带来与上述监视方法冲突的问题。监视方法输出最后一个区块的事件，而 `get` 方法输出所有事件。我们需要一种方法让\
    \ JS 忽略重复事件，不要重复写入已经从历史中获取的事件。我们稍后会处理这个问题，但现在先来处理白名单。\n\n### 账户白名单\n\n最后，我们来处理一些写入操作。\n\
    \n第一个也是最简单的一个是获取白名单资格。记住，要获得白名单资格，账户需要向 DAO 地址发送至少 0.01 以太币。部署时会得到这个地址。如果你的 Ganache/PoA\
    \ 链在本课程中间重启过，没关系，只需使用 `truffle migrate --reset` 重新运行迁移，你就会得到代币和 DAO 的新地址。在我的例子中，DAO\
    \ 的地址是 `0x729400828808bc907f68d9ffdeb317c23d2034d5`，代币地址是 `0x3134bcded93e810e1025ee814e87eff252cff422`。\n\
    \n完成上述设置后，让我们尝试向 DAO 地址发送一定数量的以太币。为了好玩，我们试试发送 0.05 以太币，这样我们也能看看 DAO 是否会因为超额支付而额外计算代币。\n\
    \n#### 自定义 Gas 数量\n\n不要忘记自定义 Gas 数量——只需在 21000 限制的基础上再加一个零——使用红色标记的图标。为什么需要这样做？因为简单的以太币发送所触发的函数（回退函数）会执行额外的逻辑，这超出了\
    \ 21000 的限制（该限制仅适用于简单发送）。所以我们需要提高限制。别担心：超出限制的部分会立即退还。关于 Gas 如何工作的入门介绍，请参见[此处](https://www.sitepoint.com/ethereum-transaction-costs)。\n\
    \n![向 DAO 发送以太币](img/00026.jpeg)\n\n"
- fmt: "\n![Customizing Gas Amount](images/00027.jpeg)\n\nAfter the transaction confirms\
    \ (you’ll see this in MetaMask as “confirmed”), we can check the token amount\
    \ in our MetaMask account. We’ll need to add our custom token to MetaMask first\
    \ so it can track them. The process is as follows: select the MetaMask menu, scroll\
    \ down to *Add Tokens*, select *Custom Token*, paste in the address of the token\
    \ given to you by Truffle on migration, click *Next*, see if the balance is fine,\
    \ and then select *Add Tokens*.\n\nFor 0.05 eth we should have 400k tokens, and\
    \ we do.\n\n![Customizing Gas Amount](images/00028.jpeg)\n\nWhat about the event,\
    \ though? Were we notified of this whitelisting? Let’s look in the console.\n\n\
    ![Event in console](images/00029.jpeg)\n\nIndeed, the full dataset is there —\
    \ the address which emitted the event, the block number and hash in which this\
    \ was mined, and so on. Among all this is the `args` object, which tells us the\
    \ event data: `addr` is the address being whitelisted, and `status` is whether\
    \ it was added to the whitelist or removed from it. Success!\n\nIf we refresh\
    \ the page now, the event is again in the console. But how? We didn’t whitelist\
    \ anyone new. Why did the event fire? The thing with events in EVM is that they\
    \ are not one-off things like in JavaScript. Sure, they contain arbitrary data\
    \ and serve as output only, but their output is forever registered in the blockchain\
    \ because the transaction that caused them is also forever registered in the blockchain.\
    \ So events will remain after having been emitted, which saves us from having\
    \ to store them somewhere and recall them on page refresh!\n\nNow let’s add this\
    \ to the events screen in the UI! Edit the Events section of the JavaScript file\
    \ like so:\n\n```\n// Events\n\nvar highestBlock = 0;\nvar WhitelistedEvent =\
    \ story.Whitelisted({}, { fromBlock: 0, toBlock: \"latest\" });\n\nWhitelistedEvent.get((error,\
    \ eventResult) => {\n  if (error) {\n    console.log('Error in Whitelisted event\
    \ handler: ' + error);\n  } else {  \n    console.log(eventResult);\n    let len\
    \ = eventResult.length;\n    for (let i = 0; i < len; i++) {\n      console.log(eventResult[i]);\n\
    \      highestBlock = highestBlock < eventResult[i].blockNumber ? eventResult[i].blockNumber\
    \ : highestBlock;\n      printEvent(\"Whitelisted\", eventResult[i]);\n    }\n\
    \  }\n});\n\nWhitelistedEvent.watch(function(error, result) {\n  if (!error &&\
    \ result.blockNumber > highestBlock) {\n    printEvent(\"Whitelisted\", result);\n\
    \  }\n});\n\nfunction printEvent(type, object) {\n  switch (type) {\n    case\
    \ \"Whitelisted\":\n      let el;\n      if (object.args.status === true) {\n\
    \          el = \"<li>Whitelisted address \"+ object.args.addr +\"</li>\";\n \
    \     } else {\n          el = \"<li>Removed address \"+ object.args.addr +\"\
    \ from whitelist!</li>\";\n      }\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    default:\n    break;\n  }\n}\n```\n\nWow,\
    \ events got complicated fast, huh? Not to worry, we’ll clarify.\n\nThe `highestBlock`\
    \ variable will remember the latest block fetched from history. We create an instance\
    \ of our event and attach two listeners to it. One is `get`, which gets all events\
    \ from history and remembers the latest block. The other is `watch`, which watches\
    \ for events “live” and triggers when a new one appears in the most recent block.\
    \ The watcher only triggers if the block that just came in is bigger than the\
    \ block we have remembered as highest, making sure that only the new events get\
    \ appended to the list of events.\n\nWe also added a `printEvent` function to\
    \ make things easier; we can re-use it for other event types too!\n\nIf we test\
    \ this now, indeed, we get it nicely printed out.\n\n![Event is on screen](images/00030.jpeg)\n\
    \nTry doing this yourself now for all the other events our story can emit! See\
    \ if you can figure out how to handle them all at once rather than having to write\
    \ this logic for each of them. (Hint: define their names in an array, then loop\
    \ through those names and dynamically register the events!)\n\n#### Manual checking\n\
    \nYou can also manually check the whitelist and all other public parameters of\
    \ the StoryDAO by opening it in MyEtherWallet and calling its `whitelist` function.\n\
    \n![Whitelist inspection](images/00031.jpeg)\n\nYou’ll notice that if we check\
    \ the account from which we just sent the whitelisting amount we’ll get a `true`\
    \ back, indicating that this account really exists in the `whitelist` mapping.\n\
    \nUse this same function menu to experiment with other functions before adding\
    \ them to the web UI.\n\n### Submitting an entry\n\nAt long last, let’s do a proper\
    \ write-function call from our UI. This time, we’ll submit an entry into our story.\
    \ First we need to clear the sample entries we put there at the beginning. Edit\
    \ the HTML to this:\n\n```\n<div class=\"content container\">\n    <div class=\"\
    intro\">\n        <h3>Chapter 0</h3>\n        <p class=\"intro\">It's a rainy\
    \ night in central London.</p>\n    </div>\n    <hr>\n    <div class=\"submission_input\"\
    >\n        <textarea name=\"submission-body\" id=\"submission-body-input\" rows=\"\
    5\"></textarea>\n        <button id=\"submission-body-btn\">Submit</button>\n\
    \    </div>\n    ...\n```\n\nAnd some basic CSS:\n\n```\n.submission_input textarea\
    \ {\n  width: 100%;\n}\n```\n\nWe added a very simple textarea through which users\
    \ can submit new entries.\n\nLet’s do the JS part now.\n\nFirst, let’s get ready\
    \ to accept this event by adding a new one and modifying our `printEvent` function.\
    \ We can also refactor the whole event section a bit to make it more reusable.\n\
    \n```\n// Events\n\nvar highestBlock = 0;\nvar WhitelistedEvent = story.Whitelisted({},\
    \ { fromBlock: 0, toBlock: \"latest\" });\nvar SubmissionCreatedEvent = story.SubmissionCreated({},\
    \ { fromBlock: 0, toBlock: \"latest\" });\n\nvar events = [WhitelistedEvent, SubmissionCreatedEvent];\n\
    for (let i = 0; i < events.length; i++) {\n  events[i].get(historyCallback);\n\
    \  events[i].watch(watchCallback);\n}\n\nfunction watchCallback(error, result)\
    \ {\n  if (!error && result.blockNumber > highestBlock) {\n    printEvent(result.event,\
    \ result);\n  }\n}\n\nfunction historyCallback(error, eventResult) {\n  if (error)\
    \ {\n    console.log('Error in event handler: ' + error);\n  } else {  \n    console.log(eventResult);\n\
    \    let len = eventResult.length;\n    for (let i = 0; i < len; i++) {\n    \
    \  console.log(eventResult[i]);\n      highestBlock = highestBlock < eventResult[i].blockNumber\
    \ ? eventResult[i].blockNumber : highestBlock;\n      printEvent(eventResult[i].event,\
    \ eventResult[i]);\n    }\n  }\n}\n\nfunction printEvent(type, object) {\n  let\
    \ el;\n  switch (type) {\n    case \"Whitelisted\":\n      if (object.args.status\
    \ === true) {\n          el = \"<li>Whitelisted address \"+ object.args.addr +\"\
    </li>\";\n      } else {\n          el = \"<li>Removed address \"+ object.args.addr\
    \ +\" from whitelist!</li>\";\n      }\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    case \"SubmissionCreated\":\n      el = \"\
    <li>User \" + object.args.submitter + \" created a\"+ ((object.args.image) ? \"\
    n image\" : \" text\") +\" entry: #\" + object.args.index + \" of content \" +\
    \ object.args.content+\"</li>\";\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    default:\n    break;\n  }\n}\n```\n\nNow all\
    \ we need to do to add a brand new event is instantiate it, and then define a\
    \ `case` for it.\n\nNext, let’s make it possible to make a submission.\n\n```\n\
    document.getElementById(\"submission-body-btn\").addEventListener(\"click\", function(e)\
    \ {\n    if (!loggedIn) {\n        return false;\n    }\n\n    var text = document.getElementById(\"\
    submission-body-input\").value;\n    text = web3.toHex(text);\n\n    story.createSubmission(text,\
    \ false, {value: 0, gas: 400000}, function(error, result) {\n        refreshSubmissions();\n\
    \    });\n});\n\nfunction refreshSubmissions() {\n    story.getAllSubmissionHashes(function(error,\
    \ result){\n        console.log(result);\n    });\n}\n```\n"
