  trans: "\n\n为了开发我们的应用程序，我们可以使用几个可用的框架和入门套件之一：[Dapp](http://dapp.readthedocs.io/en/latest/)、[eth-utils](https://github.com/ethersphere/eth-utils)、[Populus](https://populus.readthedocs.io/en/latest/quickstart.html)、[Embark](https://github.com/embark-framework/embark)……等等。但我们将选择当前生态系统中的王者——[Truffle](http://truffleframework.com/)。\n\
    \n通过以下命令安装它：\n\n```\nnpm install -g truffle\n```\n\n这将使 `truffle` 命令在任何地方都可用。现在我们可以使用\
    \ `truffle init` 启动项目。\n\n## 启动代币\n\n让我们直接开始构建我们的代币。它将是一个有点标准的、千篇一律的 ERC20 代币，但带有一个小变化。（你会在本文后面看到这个变化是什么。）首先，我们将引入一些依赖项。OpenZeppelin\
    \ 库是经过实战检验的高质量 Solidity 合约，可用于扩展和构建合约。\n\n```\nnpm install openzeppelin-solidity\n\
    ```\n\n接下来，让我们创建一个新的代币文件：\n\n```\ntruffle create contract TNSToken\n```\n\nTruffle\
    \ 生成的默认模板有点过时了，所以让我们更新它：\n\n```\npragma solidity ⁰.4.24;\n\ncontract TNStoken\
    \ {\n    constructor() public {\n\n    }\n}\n```\n\n到目前为止，代币合约的构造函数本应与合约本身同名，但为了清晰起见，它被改成了\
    \ `constructor`。它还应该始终有一个修饰符，告诉编译器谁被允许部署和与此合约交互（`public` 意味着所有人）。\n\n## SafeMath\n\
    \n在这种情况下，我们将使用的唯一 Zeppelin 合约是它们的 `SafeMath` 合约。在 Solidity 中，我们使用 `import` 关键字导入合约，而编译器通常不需要完整路径，只需要相对路径，如下所示：\n\
    \n```\npragma solidity ⁰.4.24;\n\nimport \"../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\"\
    ;\n\ncontract TNStoken {\n    using SafeMath for uint256;\n    constructor() public\
    \ {\n\n    }\n}\n```\n\n那么，什么是 `SafeMath`？很久以前，由于代码中的数学问题，曾出现过[1840 亿比特币被凭空创造](https://bitfalls.com/2018/01/14/curious-case-184-billion-bitcoin/)的问题。为了防止出现哪怕只是类似的问题（尽管在以太坊中不太可能发生这种特定情况），SafeMath\
    \ 库应运而生。当两个数字达到 `MAX_INT` 大小（即操作系统中可能的最大数字）时，将它们相加会导致值“回绕”到零，就像汽车里程表在达到 999999\
    \ 公里后重置为 0 一样。因此，SafeMath 库具有如下函数：\n\n```\n/**\n* @dev 将两个数相加，溢出时抛出异常。\n*/\nfunction\
    \ add(uint256 a, uint256 b) internal pure returns (uint256 c) {\n  c = a + b;\n\
    \  assert(c >= a);\n  return c;\n}\n```\n\n这个函数可以防止这个问题：它检查两个数的和是否仍然大于两个操作数中的每一个。\n\
    \n虽然在编写 Solidity 合约时不太容易犯这种愚蠢的错误，但安全总比后悔好。\n\n通过 `using SafeMath for uint256`，我们将\
    \ Solidity 中的标准 `uint256` 数字（256 位无符号——即仅正数——整数）替换为这些“安全”版本。我们不再像这样求和：`sum = someBigNumber\
    \ + someBiggerNumber`，而是像这样求和：`sum = someBigNumber.add(someBiggerNumber)`，从而确保计算安全。\n\
    \n## 从零开始实现 ERC20\n\n在确保数学运算安全后，我们可以创建自己的代币了。\n\nERC20 是一个具有明确定义接口的标准，因此作为参考，让我们将其添加到合约中。阅读[关于代币标准的内容](https://medium.freecodecamp.org/lets-talk-about-the-ethereum-token-standards-you-need-to-know-8af9fcb7e54b)。\n\
    \n因此，ERC20 代币应具有的函数如下：\n\n```\npragma solidity ⁰.4.24;\n\nimport \"../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\"\
    ;\n\ncontract ERC20 {\n    function totalSupply() public view returns (uint256);\n\
    \    function balanceOf(address who) public view returns (uint256);\n    function\
    \ transfer(address to, uint256 value) public returns (bool);\n    event Transfer(address\
    \ indexed from, address indexed to, uint256 value);\n    function allowance(address\
    \ owner, address spender) public view returns (uint256);\n    function transferFrom(address\
    \ from, address to, uint256 value) public returns (bool);\n    function approve(address\
    \ spender, uint256 value) public returns (bool);\n    event Approval(address indexed\
    \ owner, address indexed spender, uint256 value);\n}\n\ncontract TNStoken {\n\n\
    \    using SafeMath for uint256;\n\n    constructor() public {\n\n    }\n}\n```\n\
    \n这看起来可能很复杂，但实际上非常简单。这是我们的代币需要拥有的函数“目录”，我们将逐一构建它们，并解释每个函数的含义。将上述内容视为我们代币的一个*接口*。当我们创建\
    \ Story DAO 应用程序时，我们将看到这如何以及为什么有用。\n\n### 基本余额\n\n让我们开始。一个**代币**实际上只是以太坊区块链中的一个“电子表格”，如下所示：\n\
    \n```\n| 姓名 | 数量 |\n|:--|:--|\n| Bruno | 4000 |\n| Joe | 5000 |\n| Anne | 0 |\n\
    | Mike | 300 |\n```\n\n因此，让我们创建一个 `mapping`，它本质上与合约中的电子表格完全一样：\n\n```\nmapping(address\
    \ => uint256) balances;\n```\n\n根据上面的接口，这需要附带一个 `balanceOf` 函数，该函数可以读取这个表格：\n\n\
    ```\nfunction balanceOf(address _owner) public view returns (uint256) {\n    return\
    \ balances[_owner];\n}\n```\n\n函数 `balanceOf` 接受一个参数：`_owner` 是公开的（任何人都可以使用），是一个\
    \ `view` 函数（意味着它是免费的——不需要交易），并返回一个 `uint256` 数字，即传入地址所有者的余额。每个人的代币余额都是公开可读的。\n\
    \n### 总供应量\n\n了解代币的总供应量对其用户和代币追踪应用程序很重要，因此让我们定义一个合约属性（变量）来跟踪这一点，以及另一个用于读取该值的免费函数：\n\
    \n```\nuint256 totalSupply_;\nfunction totalSupply() public view returns (uint256)\
    \ {\n    return totalSupply_;\n}\n```\n\n### 发送代币\n\n接下来，让我们确保一定数量代币的所有者可以将它们转移给其他人。我们还希望知道何时发生了转移，因此我们也将定义一个\
    \ Transfer 事件。**Transfer 事件**让我们可以通过 JavaScript 监听区块链中的转移，这样我们的应用程序就能知道这些事件何时被触发，而无需不断手动检查是否发生了转移。事件与合约中的变量一起声明，并使用\
    \ `emit` 关键字触发。现在让我们将以下内容添加到合约中：\n\n```\nevent Transfer(address indexed from,\
    \ address indexed to, uint256 value);\n\nfunction transfer(address _to, uint256\
    \ _value) public returns (bool) {\n    require(_to != address(0));\n    require(_value\
    \ <= balances[msg.sender]);\n\n    balances[msg.sender] = balances[msg.sender].sub(_value);\n\
    \    balances[_to] = balances[_to].add(_value);\n    emit Transfer(msg.sender,\
    \ _to, _value);\n    return true;\n}\n```\n\n这个函数接受两个参数：`_to`，即接收代币的目标地址，以及 `value`，即代币的数量。重要的是要记住，`value`\
    \ 是代币最小单位的数量，而不是整个单位。因此，如果一个代币声明有 10 位小数，那么要发送一个代币，你需要发送 10000000000。这种粒度级别使我们能够交易极小数量。\n\
    \n该函数是公开的，意味着任何人都可以使用它——包括其他合约和用户——如果操作成功，则返回 `true`。\n\n"
- fmt: "\nThe function then does some sanity checks. First, it checks that the destination\
    \ address isn’t a null address. In other words, tokens must not be sent into oblivion.\
    \ Next, it checks if the sender is even allowed to send this many tokens by comparing\
    \ their balance (`balances[msg.sender]`) with the value passed in for sending.\
    \ If any of these checks fail, the function will reject the transaction and fail.\
    \ It will refund any tokens sent, but the gas spent on executing the function\
    \ up until that point will have been spent.\n\nThe next two lines subtract the\
    \ amount of tokens from the sender’s balance and add that amount to the destination’s\
    \ balance. Then the event is emitted with `emit`, and some values are passed in:\
    \ the sender, the recipient, and the amount. Any client subscribed to `Transfer`\
    \ events on this contract will now be notified of this event.\n\nOkay, now our\
    \ token holders can send tokens around. Believe it or not, that’s all you need\
    \ for a basic token. But we’re going beyond that and adding some more functionality.\n\
    \n### Allowance\n\nSometimes a third party may be given permission to withdraw\
    \ from another account’s balance. This is useful for games which might facilitate\
    \ in-game purchases, decentralized exchanges, and more. We do this by building\
    \ a multi-dimensional `mapping` called `allowance`, which stores all such permissions.\
    \ Let’s add the following:\n\n```\nmapping (address => mapping (address => uint256))\
    \ internal allowed;\nevent Approval(address indexed owner, address indexed spender,\
    \ uint256 value);\n```\n\nThe event is there so that apps listening can know when\
    \ someone has pre-approved spending of their balance by someone else — a useful\
    \ feature, and part of [the standard](https://github.com/ethereum/EIPs/issues/20).\n\
    \nThe mapping combines addresses with another mapping, which combines addresses\
    \ with numbers. It basically forms a spreadsheet like this one:\n\n![Table of\
    \ Values](images/00002.jpeg)\n\nSo Bob’s balance may be spent by Mary up to 1000\
    \ tokens and Billy up to 50 tokens. Mary’s balance can be spent by Bob up to 750\
    \ tokens. Billy’s balance can be spent up to 300 tokens by Mary and 1500 by Joe.\n\
    \nGiven that this mapping is `internal`, it can only be used by functions in this\
    \ contract and contracts that use this contract as a base.\n\nTo approve someone\
    \ else spending from your account, you call the `approve` function with the address\
    \ of the person allowed to spend your tokens, the amount they are allowed to spend,\
    \ and in the function you emit an `Approval` event:\n\n```\nfunction approve(address\
    \ _spender, uint256 _value) public returns (bool) {\n  allowed[msg.sender][_spender]\
    \ = _value;\n  emit Approval(msg.sender, _spender, _value);\n  return true;\n\
    }\n```\n\nWe also need a way to read how much a user can spend from another user’s\
    \ account:\n\n```\nfunction allowance(address _owner, address _spender) public\
    \ view returns (uint256) {\n    return allowed[_owner][_spender];\n}\n```\n\n\
    So it’s another `read only` function (`view`) which means it’s free to execute.\
    \ It simply reads the remaining withdrawable balance.\n\nSo how does one send\
    \ for someone else? With a new `transferFrom` function:\n\n```\nfunction transferFrom(address\
    \ _from, address _to, uint256 _value) public returns (bool) {\n    require(_to\
    \ != address(0));\n    require(_value <= balances[_from]);\n    require(_value\
    \ <= allowed[_from][msg.sender]);\n\n    balances[_from] = balances[_from].sub(_value);\n\
    \    balances[_to] = balances[_to].add(_value);\n    allowed[_from][msg.sender]\
    \ = allowed[_from][msg.sender].sub(_value);\n    emit Transfer(_from, _to, _value);\n\
    \    return true;\n}\n```\n\nAs before, there are sanity checks: the destination\
    \ address must not be a null-address, so no sending tokens to a black hole. The\
    \ value being transferred also needs to be less than or equal to not only the\
    \ current balance of the account the value is being transferred from, but also\
    \ the balance the message sender (the address initiating this transaction) is\
    \ still allowed to spend for them.\n\nNext, the balance is updated and the allowed\
    \ balance is brought into sync with that before emitting the event about the `Transfer`.\n\
    \n#### Spending Tokens Without `allowed`\n\nIt’s possible for the token holder\
    \ to spend tokens without the `allowed` mapping being updated. This can happen\
    \ if the token holder sends tokens around manually using `transfer`. In that case,\
    \ it’s possible that the holder will have fewer tokens than the allowance dictates\
    \ a third party can spend for them.\n\nWith approvals and allowances in place,\
    \ we can also create functions that let a token holder increase or decrease someone’s\
    \ allowance, rather than overwrite the value entirely. Try doing this as an exercise,\
    \ then refer to source code below for the solution.\n\n```\nfunction increaseApproval(address\
    \ _spender, uint _addedValue) public returns (bool) {\n    allowed[msg.sender][_spender]\
    \ = (\n    allowed[msg.sender][_spender].add(_addedValue));\n    emit Approval(msg.sender,\
    \ _spender, allowed[msg.sender][_spender]);\n    return true;\n}\n\nfunction decreaseApproval(address\
    \ _spender, uint _subtractedValue) public returns (bool) {\n    uint oldValue\
    \ = allowed[msg.sender][_spender];\n    if (_subtractedValue > oldValue) {\n \
    \       allowed[msg.sender][_spender] = 0;\n    } else {\n        allowed[msg.sender][_spender]\
    \ = oldValue.sub(_subtractedValue);\n    }\n    emit Approval(msg.sender, _spender,\
    \ allowed[msg.sender][_spender]);\n    return true;\n}\n```\n\n## Constructor\n\
    \nSo far, we’ve merely built a token “contract”. But what is this token? What’s\
    \ it called? How many decimals does it have? How do we use it?\n\nAt the very\
    \ beginning, we defined a `constructor` function. Now, let’s finish its body and\
    \ add the attributes `name`, `symbol` and `decimals`:\n\n```\nstring public name;\n\
    string public symbol;\nuint8 public decimals;\n\nconstructor(string _name, string\
    \ _symbol, uint8 _decimals, uint256 _totalSupply) public {\n    name = _name;\n\
    \    symbol = _symbol;\n    decimals = _decimals;\n    totalSupply_ = _totalSupply;\n\
    }\n```\n\nDoing it like this lets us reuse the contract later for other tokens\
    \ of the same type. But seeing as we know exactly what we’re building, let’s hard-code\
    \ those values:\n\n```\nstring public name;\nstring public symbol;\nuint8 public\
    \ decimals;\n\nconstructor() public {\n    name = \"The Neverending Story Token\"\
    ;\n    symbol = \"TNS\";\n    decimals = 18;\n    totalSupply_ = 100 * 10**6 *\
    \ 10**18;\n}\n```\n\nThese details are read by the various Ethereum tools and\
    \ platforms when displaying the token’s information. The constructor function\
    \ is automatically called when a contract is deployed to an Ethereum network,\
    \ so these values will be auto-configured at deploy-time.\n\nA word about `totalSupply_\
    \ = 100 * 10**6 * 10**18;`: this is just a way to make it easier for humans to\
    \ read the number. Since all transfers in Ethereum are done with the smallest\
    \ unit of ether or token (including decimals) the smallest unit is 18 decimals\
    \ deep into the decimal point. This is why a single TNS token is `1 * 10**18`.\
    \ Furthermore, we want 100 million of them, so that’s `100 * 10**6` or `100*10*10*10*10*10*10`.\
    \ This makes the number much more readable than `100000000000000000000000000`.\n\
    \n## Alternative Development Flow\n\nAlternatively, we can just extend the Zeppelin\
    \ contract, modify some attributes, and we have our token. That’s what most people\
    \ do, but when dealing with software that potentially handles millions of other\
    \ people’s money, I personally tend to want to know *exactly* what I put in the\
    \ code, so blind code reuse is minimal in my personal case.\n"
