  trans: "\n\n![自定义 Gas 数量](img/00027.jpeg)\n\n交易确认后（在 MetaMask 中会显示为“已确认”），我们就可以在\
    \ MetaMask 账户中查看代币数量了。我们需要先将自定义代币添加到 MetaMask 中，以便它能够追踪这些代币。操作步骤如下：选择 MetaMask\
    \ 菜单，向下滚动到 *添加代币*，选择 *自定义代币*，粘贴 Truffle 在迁移时提供给您的代币地址，点击 *下一步*，确认余额无误，然后选择 *添加代币*。\n\
    \n对于 0.05 ETH，我们应该获得 40 万个代币，实际也确实如此。\n\n![自定义 Gas 数量](img/00028.jpeg)\n\n不过，事件呢？我们是否收到了这个白名单添加的通知？让我们看看控制台。\n\
    \n![控制台中的事件](img/00029.jpeg)\n\n确实，完整的数据集就在那里——触发事件的地址、该交易被挖出的区块编号和哈希值等等。其中包含\
    \ `args` 对象，它告诉我们事件数据：`addr` 是被加入白名单的地址，`status` 表示该地址是被添加到白名单还是从白名单中移除。成功！\n\n\
    如果我们现在刷新页面，事件会再次出现在控制台中。但这是为什么呢？我们并没有添加任何新的白名单地址。为什么事件会触发？EVM 中的事件与 JavaScript\
    \ 中的一次性事件不同。当然，它们包含任意数据并仅作为输出，但由于触发它们的事务也永久记录在区块链中，因此它们的输出也永久记录在区块链中。所以事件在触发后会一直存在，这让我们无需将它们存储在其他地方，也无需在页面刷新时重新获取！\n\
    \n现在，让我们将其添加到 UI 的事件屏幕中！按如下方式编辑 JavaScript 文件中的 Events 部分：\n\n```\n// Events\n\
    \nvar highestBlock = 0;\nvar WhitelistedEvent = story.Whitelisted({}, { fromBlock:\
    \ 0, toBlock: \"latest\" });\n\nWhitelistedEvent.get((error, eventResult) => {\n\
    \  if (error) {\n    console.log('Error in Whitelisted event handler: ' + error);\n\
    \  } else {  \n    console.log(eventResult);\n    let len = eventResult.length;\n\
    \    for (let i = 0; i < len; i++) {\n      console.log(eventResult[i]);\n   \
    \   highestBlock = highestBlock < eventResult[i].blockNumber ? eventResult[i].blockNumber\
    \ : highestBlock;\n      printEvent(\"Whitelisted\", eventResult[i]);\n    }\n\
    \  }\n});\n\nWhitelistedEvent.watch(function(error, result) {\n  if (!error &&\
    \ result.blockNumber > highestBlock) {\n    printEvent(\"Whitelisted\", result);\n\
    \  }\n});\n\nfunction printEvent(type, object) {\n  switch (type) {\n    case\
    \ \"Whitelisted\":\n      let el;\n      if (object.args.status === true) {\n\
    \          el = \"<li>Whitelisted address \"+ object.args.addr +\"</li>\";\n \
    \     } else {\n          el = \"<li>Removed address \"+ object.args.addr +\"\
    \ from whitelist!</li>\";\n      }\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    default:\n    break;\n  }\n}\n```\n\n哇，事件突然变得复杂了，对吧？别担心，我们会解释清楚。\n\
    \n`highestBlock` 变量会记住从历史记录中获取的最新区块。我们创建了一个事件实例，并为其附加了两个监听器。一个是 `get`，它获取所有历史事件并记住最新区块。另一个是\
    \ `watch`，它“实时”监听事件，并在最新区块中出现新事件时触发。观察者仅在刚到达的区块大于我们记住的最高区块时触发，从而确保只有新事件被追加到事件列表中。\n\
    \n我们还添加了一个 `printEvent` 函数来简化操作；我们也可以将其重用于其他事件类型！\n\n现在测试一下，确实，事件被很好地打印出来了。\n\n\
    ![事件显示在屏幕上](img/00030.jpeg)\n\n现在，请尝试为我们的故事可以发出的所有其他事件自行完成此操作！看看你是否能找出一次性处理所有事件的方法，而不是为每个事件都编写这段逻辑。（提示：将它们的名称定义在一个数组中，然后遍历这些名称并动态注册事件！）\n\
    \n#### 手动检查\n\n您还可以通过 MyEtherWallet 打开 StoryDAO 并调用其 `whitelist` 函数，手动检查白名单和所有其他公共参数。\n\
    \n![白名单检查](img/00031.jpeg)\n\n您会注意到，如果我们检查刚刚发送白名单金额的账户，会返回 `true`，表明该账户确实存在于 `whitelist`\
    \ 映射中。\n\n在将这些函数添加到 Web UI 之前，请使用相同的函数菜单来试验其他函数。\n\n### 提交条目\n\n终于，让我们从 UI 中进行一次真正的写入函数调用。这次，我们将向故事中提交一个条目。首先，我们需要清除一开始放入的示例条目。将\
    \ HTML 编辑为以下内容：\n\n```\n<div class=\"content container\">\n    <div class=\"intro\"\
    >\n        <h3>Chapter 0</h3>\n        <p class=\"intro\">It's a rainy night in\
    \ central London.</p>\n    </div>\n    <hr>\n    <div class=\"submission_input\"\
    >\n        <textarea name=\"submission-body\" id=\"submission-body-input\" rows=\"\
    5\"></textarea>\n        <button id=\"submission-body-btn\">Submit</button>\n\
    \    </div>\n    ...\n```\n\n以及一些基本的 CSS：\n\n```\n.submission_input textarea {\n\
    \  width: 100%;\n}\n```\n\n我们添加了一个非常简单的文本区域，用户可以通过它提交新条目。\n\n现在来处理 JS 部分。\n\n\
    首先，让我们通过添加一个新事件并修改 `printEvent` 函数来准备接受这个事件。我们还可以稍微重构整个事件部分，使其更具可重用性。\n\n```\n\
    // Events\n\nvar highestBlock = 0;\nvar WhitelistedEvent = story.Whitelisted({},\
    \ { fromBlock: 0, toBlock: \"latest\" });\nvar SubmissionCreatedEvent = story.SubmissionCreated({},\
    \ { fromBlock: 0, toBlock: \"latest\" });\n\nvar events = [WhitelistedEvent, SubmissionCreatedEvent];\n\
    for (let i = 0; i < events.length; i++) {\n  events[i].get(historyCallback);\n\
    \  events[i].watch(watchCallback);\n}\n\nfunction watchCallback(error, result)\
    \ {\n  if (!error && result.blockNumber > highestBlock) {\n    printEvent(result.event,\
    \ result);\n  }\n}\n\nfunction historyCallback(error, eventResult) {\n  if (error)\
    \ {\n    console.log('Error in event handler: ' + error);\n  } else {  \n    console.log(eventResult);\n\
    \    let len = eventResult.length;\n    for (let i = 0; i < len; i++) {\n    \
    \  console.log(eventResult[i]);\n      highestBlock = highestBlock < eventResult[i].blockNumber\
    \ ? eventResult[i].blockNumber : highestBlock;\n      printEvent(eventResult[i].event,\
    \ eventResult[i]);\n    }\n  }\n}\n\nfunction printEvent(type, object) {\n  let\
    \ el;\n  switch (type) {\n    case \"Whitelisted\":\n      if (object.args.status\
    \ === true) {\n          el = \"<li>Whitelisted address \"+ object.args.addr +\"\
    </li>\";\n      } else {\n          el = \"<li>Removed address \"+ object.args.addr\
    \ +\" from whitelist!</li>\";\n      }\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    case \"SubmissionCreated\":\n      el = \"\
    <li>User \" + object.args.submitter + \" created a\"+ ((object.args.image) ? \"\
    n image\" : \" text\") +\" entry: #\" + object.args.index + \" of content \" +\
    \ object.args.content+\"</li>\";\n      document.querySelector(\"ul.eventlist\"\
    ).innerHTML += el;\n    break;\n    default:\n    break;\n  }\n}\n```\n\n现在，要添加一个全新的事件，我们只需要实例化它，然后为其定义一个\
    \ `case` 即可。\n\n接下来，让我们实现提交功能。\n\n```\ndocument.getElementById(\"submission-body-btn\"\
    ).addEventListener(\"click\", function(e) {\n    if (!loggedIn) {\n        return\
    \ false;\n    }\n\n    var text = document.getElementById(\"submission-body-input\"\
    ).value;\n    text = web3.toHex(text);\n\n    story.createSubmission(text, false,\
    \ {value: 0, gas: 400000}, function(error, result) {\n        refreshSubmissions();\n\
    \    });\n});\n\nfunction refreshSubmissions() {\n    story.getAllSubmissionHashes(function(error,\
    \ result){\n        console.log(result);\n    });\n}\n```\n\n"
- fmt: "\nHere we add an event listener to our submission form which, once submitted,\
    \ first rejects everything if the user isn’t logged in, then grabs the content\
    \ and converts it to hex format (which is what we need to store values as `bytes`).\n\
    \nLastly, it creates a transaction by calling the `createSubmission` function\
    \ and providing two params: the text of the entry, and the `false` flag (meaning,\
    \ not an image). The third argument is the transaction settings: value means how\
    \ much ether to send, and gas means how much of a gas limit you want to default\
    \ to. This can be changed in the client (MetaMask) manually, but it’s a good starting\
    \ point to make sure we don’t run into a limit. The final argument is the callback\
    \ function which we’re already used to by now, and this callback will call a refresh\
    \ function which loads all the submissions of the story. Currently, this refresh\
    \ function only loads story hashes and puts them into the console so we can check\
    \ that everything works.\n\n#### Why Zero?\n\nEther amount is 0 because the first\
    \ entry is free. Further entries will need ether added to them. We’ll leave that\
    \ dynamic calculation up to you for homework. Tip: there’s a `calculateSubmissionFee`\
    \ function in our DAO for this very purpose.\n\nAt this point, we need to change\
    \ something at the top of our JS where the function auto-executes on page load:\n\
    \n```\nif (loggedIn) {\n\n    token.balanceOf(web3.eth.accounts[0], function(error,\
    \ result) {console.log(JSON.stringify(result))});\n    story.getSubmissionCount(function(error,\
    \ result) {console.log(JSON.stringify(result))});\n\n    web3.eth.defaultAccount\
    \ = web3.eth.accounts[0]; // CHANGE\n\n    readUserStats().then(User => renderUserInfo(User));\n\
    \    refreshSubmissions(); // CHANGE\n} else {\n    document.getElementById(\"\
    submission-body-btn\").disabled = \"disabled\";\n}\n```\n\nThe changes are marked\
    \ with `// CHANGE`: the first one lets us set the default account from which to\
    \ execute transactions. This will probably be made default in a future version\
    \ of Web3. The second one refreshes the submissions on page load, so we get a\
    \ fully loaded story when the site opens.\n\nIf you try to submit an entry now,\
    \ MetaMask should open as soon as you click *Submit* and ask you to confirm submission.\n\
    \n![Submitting an entry](images/00032.jpeg)\n\n![Confirming an entry](images/00033.jpeg)\n\
    \nYou should also see the event printed out in the events section.\n\n![Event\
    \ confirmed](images/00034.jpeg)\n\nThe console should echo out the hash of this\
    \ new entry.\n\n![Hash printed](images/00035.jpeg)\n\n#### MetaMask and Nonces\n\
    \nMetaMask currently has a problem with private network and nonces. It’s described\
    \ [here](https://ethereum.stackexchange.com/questions/30921/tx-doesnt-have-the-correct-nonce-metamask)\
    \ and will be fixed soon, but in case you get the `nonce` error in your JavaScript\
    \ console when submitting entries, the stopgap solution for now is to re-install\
    \ MetaMask (disabling and enabling will not work). REMEMBER TO BACK UP YOUR SEED\
    \ PHRASE FIRST: you’ll need it to re-import your MetaMask accounts!\n\nFinally,\
    \ let’s fetch these entries and display them. Let’s start with a bit of CSS:\n\
    \n```\n.content-submissions .submission-submitter {\n  font-size: small;\n}\n\
    ```\n\nNow let’s update the `refreshSubmissions` function:\n\n```\nfunction refreshSubmissions()\
    \ {\n  story.getAllSubmissionHashes(function (error, result) {\n    var entries\
    \ = [];\n    for (var i = 0; i < result.length; i++) {\n      story.getSubmission(result[i],\
    \ (err, res) => {\n\n        if (res[2] === web3.eth.accounts[0]) {\n        \
    \  res[2] = 'you';\n        }\n        let el = \"\";\n        el += '<div class=\"\
    submission\">';\n        el += '<div class=\"submission-body\">' + web3.toAscii(res[0])\
    \ + '</div>';\n        el += '<div class=\"submission-submitter\">by: ' + res[2]\
    \ + '</div>';\n        el += '</div>';\n        el += '</div>';\n        document.querySelector('.content-submissions').innerHTML\
    \ += el;\n      });\n    }\n  });\n}\n```\n\nWe roll through all the submissions,\
    \ get their hashes, fetch each one, and output it on the screen. If the submitter\
    \ is the same as the logged-in user, “you” is printed instead of the address.\n\
    \n![Rendered submission](images/00036.jpeg)\n\nLet’s add another entry to test.\n\
    \n![Another entry](images/00037.jpeg)\n\n## Conclusion\n\nIn this part, we developed\
    \ the beginnings of a basic front end for our DApp.\n\nSince developing the full\
    \ front-end application could just as well be a course of its own, we’ll leave\
    \ further development up to you as homework. Just call the functions as demonstrated,\
    \ tie them into a regular JavaScript flow (either via a framework like VueJS or\
    \ plain old jQuery or raw JS like we did above) and bind it all together. It’s\
    \ literally like talking to a standard server API. If you do get stuck, check\
    \ out the project repo for the code!\n\nOther upgrades you can do:\n\n*   detect\
    \ when the web3 provider changes or when the number of available accounts changes,\
    \ indicating log-in or log-out events and auto-reload the page\n\n*   prevent\
    \ the rendering of the submission form unless the user is logged in\n\n*   prevent\
    \ the rendering of the vote and delete buttons unless the user has at least 1\
    \ token, etc.\n\n*   let people submit and render Markdown!\n\n*   order events\
    \ by time (block number), not by type!\n\n*   make events prettier and more readable:\
    \ instead of showing hex content, translate it to ASCII and truncate to 30 or\
    \ so characters\n\n*   use a proper JS framework like VueJS to get some reusability\
    \ out of your project and to have better structured code.\n\nIn the next and final\
    \ part, we’ll focus on deploying our project to the live internet. Stay tuned!\n\
    \n# Chapter 8: Launching the StoryDao\n\n**In [part 7](#part0008_split_000.html_7K4G0-63b9e60a50594bb1b6dced0e79731cb3)\
    \ of this tutorial series on building DApps with Ethereum, we showed how to build\
    \ the app’s front end, setting up and deploying the UI for this story we’ve been\
    \ working on.**\n\nIt’s time to do some deploying and write a few final functions.\n\
    \n## Suicide\n\nSomething could go very, very wrong and the whole DAO somehow\
    \ get destroyed — either through hacks of bad and hastily written code, or through\
    \ the inability to make long loops due to too many participants. (Too many voters\
    \ on a proposal might as well break the system; we really didn’t put any precaution\
    \ in place for that!) Just in case this happens, it might be useful to have the\
    \ equivalent of a “big red button”. First, let’s upgrade our StoryDao:\n\n```\n\
    function bigRedButton() onlyOwner external {\n    active = false;\n    withdrawToOwner();\n\
    \    token.unlockForAll();\n}\n```\n\nThen, let’s make it possible to unlock all\
    \ the tokens at once in our Token contract:\n\n```\n/**\n@dev unlocks the tokens\
    \ of every user who ever had any tokens locked for them\n*/\nfunction unlockForAll()\
    \ public onlyOwner {\n    uint256 len = touchedByLock.length;\n    for (uint256\
    \ i = 0; i < len; i++) {\n        locked[touchedByLock[i]] = 0;\n    }\n}\n```\n\
    \nNaturally, we need to add this new list of addresses into the contract:\n\n\
    ```\naddress[] touchedByLock;\n```\n\nAnd we need to upgrade our `increaseLockedAmount`\
    \ function to add addresses to this list:\n\n```\n/**\n@dev _owner will be prevented\
    \ from sending _amount of tokens. Anything\nbeyond this amount will be spendable.\n\
    */\nfunction increaseLockedAmount(address _owner, uint256 _amount) public onlyOwner\
    \ returns (uint256) {\n    uint256 lockingAmount = locked[_owner].add(_amount);\n\
    \    require(balanceOf(_owner) >= lockingAmount, \"Locking amount must not exceed\
    \ balance\");\n    locked[_owner] = lockingAmount;\n    touchedByLock.push(_owner);\n\
    \    emit Locked(_owner, lockingAmount);\n    return lockingAmount;\n}\n```\n\n\
    We should also update the required interface of the token inside the StoryDao\
    \ contract to include this new function’s signature:\n\n```\n// ...\n    function\
    \ getUnlockedAmount(address _owner) view public returns (uint256);\n    function\
    \ unlockForAll() public;\n}\n```\n"
