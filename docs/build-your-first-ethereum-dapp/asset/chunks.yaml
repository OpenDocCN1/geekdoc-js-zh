    \ of this series, it would benefit us greatly to verify the contracts of both\
    \ the DAO and the Token on Etherscan. That green checkmark can go a long way.\n\
    \nFollow the instructions in that part to get your contracts verified. Note that,\
    \ during the verification step, you’ll now have to mark the optimizer as active,\
    \ since we’re optimizing our code for cheaper deployment!\n\n## Deploying to the\
    \ Web\n\nTo deploy the web UI of StoryDao, follow the instructions from the “regular”\
    \ web development world. Since, in this case, it’s all static code, you can even\
    \ host it on GitHub Pages or something similar.\n\nRead about some of the options\
    \ [here](https://www.sitepoint.com/tag/deploy/) and [here](https://developer.mozilla.org/en-US/docs/Learn/Getting_started_with_the_web/Publishing_your_website).\n\
    \nOnce the page is up, configure the UI to use the addresses of contracts we got\
    \ from the migration step. Alternatively, register ENS names for the token and\
    \ the StoryDao, and you can keep the web UI static and fixed, hardcoding the addresses,\
    \ and then only change the Ethereum address those ENS names are pointing at.\n\
    \n## Conclusion\n\nThis concludes the DAO tutorial. We hope it helped you recognize\
    \ the complexities of Solidity development, but we also hope that it made some\
    \ things clearer and made you more curious.\n\nAs always, the best way to learn\
    \ is by doing. Experiment, make mistakes, reboot and rebuild. Blockchain development\
    \ of this type is in high demand, and it’s only getting more popular, so you have\
    \ an opportunity to get in on the ground floor.\n\nGood luck!\n\n*P.S. If you\
    \ enjoyed this tutorial, feel free to [ping the author on Twitter](https://twitter.com/bitfalls?lang=en).\
    \ If you have complaints, suggestions, ideas, etc. please shoot them over into\
    \ the repository on GitHub!*"
