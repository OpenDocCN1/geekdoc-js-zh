  trans: "\n\n未命名的函数 `function()` 被称为 `fallback 函数`，当向该合约发送资金且没有附带特定指令（即没有专门调用其他函数）时，就会调用这个函数。这使得人们只需向\
    \ DAO 发送以太币即可加入 StoryDao，并根据他们是否已被列入白名单，要么立即获得白名单资格，要么购买代币。\n\n`whitelistSender`\
    \ 函数用于白名单操作，可以直接调用，但我们会确保 fallback 函数在收到以太币时，如果发送者尚未被列入白名单，则自动调用它。`whitelistAddress`\
    \ 函数被声明为 `public`，因为它也应该能被其他合约调用，而 fallback 函数是 `external` 的，因为资金只会从外部地址发送到该地址。调用此合约的合约可以轻松直接调用所需的函数。\n\
    \n我们先处理 fallback 函数。\n\n```\nfunction() external payable {\n\n    if (!whitelist[msg.sender])\
    \ {\n        whitelistAddress(msg.sender);\n    } else {\n        // buyTokens(msg.sender,\
    \ msg.value);\n    }\n}\n```\n\n我们检查发送者是否尚未被列入白名单，并将调用委托给 `whitelistAddress` 函数。注意，我们注释掉了\
    \ `buyTokens` 函数，因为我们还没有实现它。\n\n接下来，处理白名单操作。\n\n```\nfunction whitelistAddress(address\
    \ _add) public payable {\n    require(!whitelist[_add], \"候选地址不能已被列入白名单。\");\n\
    \    require(!blacklist[_add], \"候选地址不能已被列入黑名单。\");\n    require(msg.value >=\
    \ whitelistfee, \"发送者必须发送足够的以太币以支付白名单费用。\");\n\n    whitelist[_add] = true;\n\
    \    whitelistedNumber++;\n    emit Whitelisted(_add, true);\n\n    if (msg.value\
    \ > whitelistfee) {\n        // buyTokens(_add, msg.value.sub(whitelistfee));\n\
    \    }\n}\n```\n\n注意，这个函数接受地址作为参数，而不是从消息（交易）中提取地址。这样做还有一个额外的好处：如果某人无法负担加入 DAO\
    \ 的费用，其他人可以为其进行白名单操作。\n\n我们以一些合理性检查开始函数：发送者不能已被列入白名单或黑名单（禁止），并且必须发送足够的以太币以覆盖费用。如果这些条件满足，地址将被添加到白名单中，触发\
    \ `Whitelisted` 事件，最后，如果发送的以太币数量大于所需的白名单费用，剩余部分将用于购买代币。\n\n#### `sub`\n\n我们使用\
    \ `sub` 而不是 `-` 进行减法，因为这是用于安全计算的 `SafeMath` 函数。\n\n现在，用户只需向 StoryDao 合约发送 0.01\
    \ 以太币或更多，即可为自己或他人获得白名单资格。\n\n## 结论\n\n在本教程中，我们构建了 DAO 的初始部分，但还有很多工作要做。敬请期待：在下一部分中，我们将处理向故事添加内容！\n\
    \n# 第 5 章：跨合约通信与代币销售\n\n**在本系列关于使用以太坊构建 DApp 的教程的第 4 部分中，我们开始构建和测试我们的 DAO 合约。现在，让我们更进一步，根据我们的[介绍](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup)，处理向故事添加内容和代币。**\n\
    \n## 添加代币\n\n要使一个合约能够与另一个合约交互，它需要知道那个合约的接口——即可用的函数。由于我们的 TNS 代币具有相当简单的接口，我们可以将其包含在\
    \ DAO 合约中，放在 `contract StoryDao` 声明之上和我们的 `import` 语句之下：\n\n```\ncontract LockableToken\
    \ is Ownable {\n    function totalSupply() public view returns (uint256);\n  \
    \  function balanceOf(address who) public view returns (uint256);\n    function\
    \ transfer(address to, uint256 value) public returns (bool);\n    event Transfer(address\
    \ indexed from, address indexed to, uint256 value);\n    function allowance(address\
    \ owner, address spender) public view returns (uint256);\n    function transferFrom(address\
    \ from, address to, uint256 value) public returns (bool);\n    function approve(address\
    \ spender, uint256 value) public returns (bool);\n    event Approval(address indexed\
    \ owner, address indexed spender, uint256 value);\n    function approveAndCall(address\
    \ _spender, uint256 _value, bytes _data) public payable returns (bool);\n    function\
    \ transferAndCall(address _to, uint256 _value, bytes _data) public payable returns\
    \ (bool);\n    function transferFromAndCall(address _from, address _to, uint256\
    \ _value, bytes _data) public payable returns (bool);\n\n    function increaseLockedAmount(address\
    \ _owner, uint256 _amount) public returns (uint256);\n    function decreaseLockedAmount(address\
    \ _owner, uint256 _amount) public returns (uint256);\n    function getLockedAmount(address\
    \ _owner) view public returns (uint256);\n    function getUnlockedAmount(address\
    \ _owner) view public returns (uint256);\n}\n```\n\n注意，我们不需要粘贴函数的“实质内容”，只需要它们的签名（骨架）。这就是合约间交互所需的全部内容。\n\
    \n现在，我们可以在 DAO 合约中使用这些函数。计划如下：\n\n*   部署代币（我们已经完成）\n*   从同一地址部署 DAO\n*   将所有代币从代币部署者发送到\
    \ DAO，然后将合约的所有权转移给 DAO 本身\n*   此时，DAO 拥有所有代币，可以使用 `transfer` 函数将其出售给用户，或者使用 `approve`\
    \ 函数预留代币用于支出（在投票期间有用），等等。\n\n但 DAO 如何知道代币部署在哪个地址？我们告诉它。\n\n首先，我们在 DAO 合约顶部添加一个新变量：\n\
    \n```\nLockableToken public token;\n```\n\n然后，添加一些函数：\n\n```\nconstructor(address\
    \ _token) public {\n    require(_token != address(0), \"代币地址不能为空地址\");\n    token\
    \ = LockableToken(_token);\n}\n```\n\n构造函数是在合约部署时自动调用的函数。它用于初始化链接合约、默认值等值。在我们的例子中，我们将使用它来接收并保存\
    \ TNS 代币的地址。`require` 检查用于确保代币地址有效。\n\n趁此机会，让我们添加一个函数，让用户可以检查 DAO 中还有多少代币可供出售，以及当出现问题时能够更换为其他代币（如果需要）。这种更改也应该触发一个事件，所以我们也添加它。\n\
    \n```\nevent TokenAddressChange(address token);\n\nfunction daoTokenBalance()\
    \ public view returns (uint256) {\n    return token.balanceOf(address(this));\n\
    }\n\nfunction changeTokenAddress(address _token) onlyOwner public {\n    require(_token\
    \ != address(0), \"代币地址不能为空地址\");\n    token = LockableToken(_token);\n    emit\
    \ TokenAddressChange(_token);\n}\n```\n\n第一个函数被设置为 `view`，因为它不改变区块链的状态；它不改变任何值。这意味着这是一个对区块链的免费只读函数调用：它不需要付费交易。它还返回代币余额作为数字，因此需要在函数签名中声明\
    \ `returns (uint256)`。代币有一个 `balanceOf` 函数（参见我们上面粘贴的接口），它接受一个参数——要检查余额的地址。我们检查我们（这个）DAO\
    \ 的余额，所以使用“this”，并通过 `address()` 将“this”转换为地址。\n\n代币地址更改函数允许所有者（管理员）更改代币合约。其逻辑与构造函数相同。\n\
    \n现在让我们看看如何让用户购买代币。\n\n### 购买代币\n\n根据本系列的前一部分，用户可以通过以下方式购买代币：\n\n"
- fmt: "\n*   Using the fallback function if already whitelisted. In other words,\
    \ just sending ether to the DAO contract.\n*   Using the `whitelistAddress` function\
    \ by sending more than the fee required for whitelisting.\n*   Calling the `buyTokens`\
    \ function directly.\n\nThere is a caveat, however. When someone calls the `buyTokens`\
    \ function from the outside, we want it to fail if there aren’t enough tokens\
    \ in the DAO to sell. But when someone buys tokens via the whitelist function\
    \ by sending in too much in the first whitelisting attempt, we don’t want it to\
    \ fail, because then the whitelisting process will get canceled as everything\
    \ fails at once. Transactions in Ethereum are atomic: either everything has to\
    \ succeed, or nothing. So we’ll make two `buyTokens` functions.\n\n```\n// This\
    \ goes at the top of the contract with other properties\nuint256 public tokenToWeiRatio\
    \ = 10000;\n\nfunction buyTokensThrow(address _buyer, uint256 _wei) external {\n\
    \n    require(whitelist[_buyer], \"Candidate must be whitelisted.\");\n    require(!blacklist[_buyer],\
    \ \"Candidate must not be blacklisted.\");\n\n    uint256 tokens = _wei * tokenToWeiRatio;\n\
    \    require(daoTokenBalance() >= tokens, \"DAO must have enough tokens for sale\"\
    );\n    token.transfer(_buyer, tokens);\n}\n\nfunction buyTokensInternal(address\
    \ _buyer, uint256 _wei) internal {\n    require(!blacklist[_buyer], \"Candidate\
    \ must not be blacklisted.\");\n    uint256 tokens = _wei * tokenToWeiRatio;\n\
    \    if (daoTokenBalance() < tokens) {\n        msg.sender.transfer(_wei);\n \
    \   } else {\n        token.transfer(_buyer, tokens);\n    }\n}\n```\n\nSo, 100\
    \ million TNS tokens exist. If we set a price of 10000 tokens per one ether, that\
    \ comes down to around 4–5 cents per token, which is acceptable.\n\nThe functions\
    \ do some calculations after doing sanity checks against banned users and other\
    \ factors, and immediately send the tokens out to the buyer, who can start using\
    \ them as they see fit — either for voting, or for selling on exchanges. If there’s\
    \ fewer tokens in the DAO than the buyer is trying to buy, the buyer is refunded.\n\
    \nThe part `token.transfer(_buyer, tokens)` is us using the TNS token contract\
    \ to initiate a transfer from the *current* location (the DAO) to the destination\
    \ `_buyer` for amount `tokens`.\n\nNow that we know people can get their hands\
    \ on the tokens, let’s see if we can implement submissions.\n\n## Structs and\
    \ Submissions\n\nAs per our intro post, submitting an entry will cost 0.0001 eth\
    \ times the number of entries in the story already. We only need to count non-deleted\
    \ submissions (because submissions can be deleted) so let’s add the properties\
    \ required for this and a method to help us.\n\n```\nuint256 public submissionZeroFee\
    \ = 0.0001 ether;\nuint256 public nonDeletedSubmissions = 0;\n\nfunction calculateSubmissionFee()\
    \ view internal returns (uint256) {\n    return submissionZeroFee * nonDeletedSubmissions;\n\
    }\n```\n\n#### Solidity's Built-In Units\n\nSolidity has built in time and ether\
    \ units. Read more about them [here](http://solidity.readthedocs.io/en/develop/units-and-global-variables.html#ether-units).\n\
    \nThis fee can only be changed by the owner, but only lowered. For increasing,\
    \ it needs a vote. Let’s write the decrease function:\n\n```\nfunction lowerSubmissionFee(uint256\
    \ _fee) onlyOwner external {\n    require(_fee < submissionZeroFee, \"New fee\
    \ must be lower than old fee.\");\n    submissionZeroFee = _fee;\n    emit SubmissionFeeChanged(_fee);\n\
    }\n```\n\nWe’re emitting an event to notify all observing clients that the fee\
    \ has been changed, so let’s declare that event:\n\n```\nevent SubmissionFeeChanged(uint256\
    \ newFee);\n```\n\nA submission can be text of up to 256 characters, and the same\
    \ limit applies to images. Only their type changes. This is a great use case for\
    \ a custom struct. Let’s define a new data type.\n\n```\nstruct Submission {\n\
    \    bytes content;\n    bool image;\n    uint256 index;\n    address submitter;\n\
    \    bool exists;\n}\n```\n\nThis is like an “object type” in our smart contract.\
    \ The object has properties of different types. The `content` is a [`bytes` type\
    \ value](https://medium.com/@cryptopusco/bytes-and-strings-in-solidity-f2cd4e53f388).\
    \ The `image` property is a boolean denoting if it’s an image (true/false). The\
    \ `index` is a number equal to the ordinary number of the submission; its index\
    \ in the list of all submissions (0, 1, 2, 3 …). The `submitter` is an address\
    \ of the account which submitted the entry, and the `exists` flag is there because\
    \ in mappings all the values of all keys are initialized to default values (false)\
    \ even if keys don’t exist yet.\n\nIn other words, when you have a mapping of\
    \ `address => bool`, that mapping is already going to have *all* the addresses\
    \ in the world set to “false”. That’s just how Ethereum works. So by checking\
    \ if the submission exists at a certain hash, we’d get “yes”, whereas the submission\
    \ might not be there at all. The `exists` flag helps with that. It lets us check\
    \ that the submission is there *and* it exists — that is, was submitted and not\
    \ just implicitly added by the EVM. Furthermore, it makes “deleting” entries later\
    \ on much easier.\n\n#### Ahem, Excuse Me ...\n\nTechnically, we could also check\
    \ to make sure that the submitter’s address isn’t a zero-address.\n\nWhile we’re\
    \ here, let’s define two events: one for deleting an entry, one for creating it.\n\
    \n```\nevent SubmissionCreated(uint256 index, bytes content, bool image, address\
    \ submitter);\nevent SubmissionDeleted(uint256 index, bytes content, bool image,\
    \ address submitter);\n```\n\nThere’s a problem, though. Mappings in Ethereum\
    \ are not iterable: we can’t loop through them without [significant hacking](https://github.com/chriseth/solidity-examples/blob/master/iterable_mapping.sol).\n\
    \nTo loop through them all, we’ll create an array of identifiers for these submissions\
    \ wherein the keys of the array will be the index of the submission, while the\
    \ values will be unique hashes we’ll generate for each submission. Solidity provides\
    \ us with the `keccak256` hashing algorithm for generating hashes from arbitrary\
    \ values, and we can use that in tandem with the current block number to make\
    \ sure an entry isn’t duplicated in the same block and get some degree of uniqueness\
    \ for each entry. We use it like this: `keccak256(abi.encodePacked(_content, block.number));`.\
    \ We need to `encodePacked` the variables passed to the algorithm because it needs\
    \ a single parameter from us. That’s what this function does.\n\nWe also need\
    \ to store the submissions somewhere, so let’s define two more contract variables.\n\
    \n```\nmapping (bytes32 => Submission) public submissions;\nbytes32[] public submissionIndex;\n\
    ```\n\nOkay, let’s try and build the `createSubmission` function now.\n\n```\n\
    function createSubmission(bytes _content, bool _image) external payable {\n\n\
    \    uint256 fee = calculateSubmissionFee();\n    require(msg.value >= fee, \"\
    Fee for submitting an entry must be sufficient.\");\n\n    bytes32 hash = keccak256(abi.encodePacked(_content,\
    \ block.number));\n    require(!submissions[hash].exists, \"Submission must not\
    \ already exist in same block!\");\n\n    submissions[hash] = Submission(\n  \
    \      _content,\n        _image,\n        submissionIndex.push(hash),\n     \
    \   msg.sender,\n        true\n    );\n\n    emit SubmissionCreated(\n       \
    \ submissions[hash].index,\n        submissions[hash].content,\n        submissions[hash].image,\n\
    \        submissions[hash].submitter\n    );\n\n    nonDeletedSubmissions += 1;\n\
    }\n```\n\nLet’s go through this line by line:\n\n```\nfunction createSubmission(bytes\
    \ _content, bool _image) external payable {\n```\n\nThe function accepts bytes\
    \ of content (bytes is a dynamically sized array of bytes, useful for storing\
    \ arbitrary amounts of data) and a boolean flag for whether or not this input\
    \ is an image. The function is only callable from the outside world and is payable\
    \ which means it accepts Ether alongside the transaction call.\n\n```\nuint256\
    \ fee = calculateSubmissionFee();\nrequire(msg.value >= fee, \"Fee for submitting\
    \ an entry must be sufficient.\");\n```\n"
