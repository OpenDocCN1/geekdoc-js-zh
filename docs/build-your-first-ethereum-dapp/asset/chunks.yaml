    \ let newDaoFee = 50;\n        let newWhitelistFee = 1e+10; // 1 以太币\n       \
    \ let newDayDuration = 42;\n        let newSubsDuration = 1500;\n\n        await\
    \ expectThrow(instance.changedaofee(newDaoFee, {from: accounts[1]}));\n      \
    \  await expectThrow(instance.changewhitelistfee(newWhitelistFee, {from: accounts[1]}));\n\
    \        await expectThrow(instance.changedurationdays(newDayDuration, {from:\
    \ accounts[1]}));\n        await expectThrow(instance.changedurationsubmissions(newSubsDuration,\
    \ {from: accounts[1]}));\n    });\n\n    it(\"应确保所有者只能将费用和持续时间更改为有效值\", async\
    \ () =>{\n        let instance = await StoryDao.deployed();\n\n        let invalidDaoFee\
    \ = 20000;\n        let invalidDayDuration = 0;\n        let invalidSubsDuration\
    \ = 98;\n\n        await expectThrow(instance.changedaofee(invalidDaoFee, {from:\
    \ accounts[0]}));\n        await expectThrow(instance.changedurationdays(invalidDayDuration,\
    \ {from: accounts[0]}));\n        await expectThrow(instance.changedurationsubmissions(invalidSubsDuration,\
