    ```


    What Ganache is doing here is starting a private blockchain with virtually no
    mining time and no nodes. It executes transactions as soon as they come in. It’s
    also generating 10 addresses pre-loaded with a lot of virtual ether, and spitting
    out their private keys so you can import them into various tools like [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/),
    [MyEtherWallet](https://www.sitepoint.com/myetherwallet-introduction), or the
    previously downloaded Mist.


    We’ll be using a mix of this method and the method above, depending on our needs,
    so make sure you set up both.


    #### Ganache UI


    Preferably and alternatively, use the [Ganache UI tool](http://truffleframework.com/ganache/)
    to have a visual interface for managing your Ganache blockchain.


    ## Conclusion


    Use [this guide](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/)
    to connect to the private blockchain (either version) with tools like [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/),
    [MyEtherWallet](https://www.sitepoint.com/myetherwallet-introduction), or the
    previously downloaded Mist. Both bootstrapping options, when running, run on `localhost:8545`
    by default, so the process of connecting to them is identical.


    Now that our app’s rules and features are laid out and our private blockchain
    is set up and we can connect to it, let’s focus on tools, packages, and dependencies
    next.


