    \ a Proposal is added to the list of proposals and notes which entry is being\
    \ targeted by the entry hash. The description is saved and some defaults added,\
    \ and a deadline is calculated depending on proposal type. The proposal added\
    \ event gets emitted and the total number of proposals is increased.\n\nNext let’s\
    \ see how to execute a proposal. To be executable, a proposal must have enough\
    \ votes, and must be past its deadline. The execution function will accept the\
    \ ID of the proposal to execute. There’s no easy way to make the EVM execute all\
    \ pending proposals at once. It’s possible that too many would be pending to execute\
    \ and that they would make big changes to the data in the DAO, which might exceed\
    \ the gas limit of Ethereum blocks, thereby failing the transaction. It’s much\
    \ easier to build a manual execution function callable by anyone with well defined\
    \ rules, so the community can keep an eye on the proposals that need executing.\n\
    \n```\nfunction executeProposal(uint256 _id) public {\n    Proposal storage p\
    \ = proposals[_id];\n    require(now >= p.deadline && !p.executed);\n\n    if\
    \ (p.typeFlag == 1 && p.currentResult > 0) {\n        assert(deleteSubmission(p.target));\n\
    \    }\n\n    uint256 len = p.votes.length;\n    for (uint i = 0; i < len; i++)\
    \ {\n        token.decreaseLockedAmount(p.votes[i].voter, p.votes[i].power);\n\
    \    }\n\n    p.executed = true;\n    emit ProposalExecuted(_id);\n}\n```\n\n\
    We grab the proposal by its ID, check that it meets requirements of not having\
    \ been executed and deadline being expired, and then if the type of the proposal\
    \ is a deletion proposal and the voting result is positive, we use the already\
    \ written deletion function, finally emitting a new event we added (add it to\
    \ the top of the contract). The `assert` call is there serving the same purpose\
    \ as the `require` statement: assert is generally used when you “assert” that\
    \ a result is true. Require is used for prerequisites. Functionally they’re identical,\
    \ with the difference of `assert` statements not being able to accept message\
    \ parameters for cases when they fail. The function ends by unlocking the tokens\
    \ for all the votes in that one proposal.\n\nWe can use this same approach to\
