    \n在本系列的下一部分中，我们将学习如何编译、部署和测试这个代币。\n\n# 第 3 章：以太坊 DApp：编译、部署、测试 TNS 代币\n\n**在本教程系列关于使用以太坊构建\
    \ DApp 的第 2 部分中，我们编写了 TNS 代币的代码。但我们还没有编译、部署、测试或验证它。让我们在这一部分完成所有这些工作，为接下来的内容做好准备。**\n\
    \n## 编译\n\n此时，我们有一个包含一些 Solidity 代码的文件。但为了让以太坊虚拟机理解它，我们需要将其转换为机器码。此外，为了从 Web 应用程序与之通信，我们需要一个\
    \ ABI（应用程序二进制接口），它是某个智能合约（无论是代币还是更复杂的东西）中存在的函数的通用可读描述。我们可以通过使用 Truffle 的编译器同时为\
    \ EVM 和 ABI 创建机器码。\n\n在项目文件夹中，运行：\n\n```\ntruffle compile\n```\n\n此命令将查看`contracts`子文件夹，编译所有合约，并将编译后的版本放入`build`子文件夹。请注意，如果您使用了上一部分中的替代开发流程，那么我们的`TNSToken`合约继承功能的所有父合约也将被逐一编译，每个合约都有自己的文件。\n\
    \n![编译后的合约](img/00003.jpeg)\n\n请随意检查生成的 JSON 文件的内容。我们的`TNSToken`应该有超过 10000 行\
    \ JSON 代码。\n\n## 部署到 Ganache\n\n现在让我们看看是否可以将此代币部署到我们模拟的 Ganache 区块链上。如果 Ganache\
    \ 尚未在终端标签页或操作系统应用程序中运行，请使用以下命令运行它：\n\n```\nganache-cli\n```\n\n或者运行应用程序以获得如下屏幕：\n\
    \n![Ganache UI](img/00004.jpeg)\n\n然后，回到我们刚刚编译合约的文件夹，我们需要添加一个迁移。创建文件`migrations/2_deploy_tnstoken.js`。如果您不熟悉\
    \ Truffle 生态系统中的迁移，请参阅[本指南](https://www.sitepoint.com/truffle-migrations-explained/)。\n\
    \n让我们将以下内容放入该文件：\n\n```\nvar Migrations = artifacts.require(\"./Migrations.sol\"\
    );\nvar TNSToken = artifacts.require(\"./TNSToken.sol\");\n\nmodule.exports =\
    \ function(deployer, network, accounts) {\n  deployer.deploy(TNSToken, {from:\
    \ accounts[0]});\n};\n```\n\n"
- fmt: "\nFirst the ability to do migrations at all is imported by requesting `Migrations.sol`.\
    \ This is required in every migration. Next, deploying a token means we need to\
    \ import its Solidity code, and we do this by pulling in `TNSToken.sol`, the code\
    \ we wrote in the previous part. Finally, this is cookie cutter migrating with\
    \ only the part between `function(deployer, network, accounts) {` and the last\
    \ `}` changing.\n\nIn this case, we tell the deployer to deploy the TNSToken and\
    \ pass in the `from` argument in order to set the initial token holder. The address\
    \ used here is a random one generated by Ganache, but by using the `accounts`\
    \ array automatically passed to the deployer, we make sure we have access to the\
    \ list of accounts present in the running node (be it a live Geth node or Ganache).\
    \ In my particular example, the `account[0]` address was `0xdFb659D556d926dd3585d0f18d4F8eD7939E8061`,\
    \ also evident in the screenshot above.\n\nLet’s also not forget to configure\
    \ a development environment in `truffle.js`:\n\n```\nmodule.exports = {\n  networks:\
    \ {\n    development: {\n      host: \"127.0.0.1\",\n      port: 7545,\n     \
    \ network_id: \"*\"\n    }\n  }\n};\n```\n\n#### Ahem, Excuse Me ...\n\nTake care\
    \ of the port and IP; yours might be different!\n\nFinally, in the project folder,\
    \ run `truffle migrate`. You should see something like this:\n\n![A successful\
    \ migration](images/00005.jpeg)\n\nNotice the Ethereum address next to `TNStoken`:\
    \ `0x3134bcded93e810e1025ee814e87eff252cff422`. This is where our token was deployed.\
    \ Now let’s see it in action.\n\n## Testing the Token\n\nAutomated tests are not\
    \ necessary in this case. Token contracts are highly standardized and battle tested.\
    \ If we had used some functionality that goes beyond the scope of a traditional\
    \ token, then automated tests would have come in handy. As it is, though, testing\
    \ it by sending it around to and from addresses is quite enough.\n\nOpen a wallet\
    \ UI like [MyEtherWallet](https://bitfalls.com/2018/02/19/first-ethereum-address-learning-use-myetherwallet/)\
    \ and in the top right menu select a custom network. In the dialog, enter the\
    \ information given to you by your private blockchain — either Ganache or an actual\
    \ PoA blockchain, whichever you’re running based on [part 1](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup)\
    \ of this tutorial series. In my example, that’s `127.0.0.1` for the address,\
    \ and `7545` for the port.\n\n![Configuring the network in MEW](images/00006.jpeg)\n\
    \nOpen the wallet which you set as the `from` value in the deployment script.\
    \ If you’re using Ganache, you’ll see its private key printed on screen in the\
    \ Ganache UI or the ganache output in the terminal.\n\n![The private key is accessible\
    \ in the Ganache UI](images/00007.jpeg)\n\nFinally, MEW needs to be told that\
    \ this token exists. We do this by adding a custom token.\n\n![Adding a custom\
    \ token in MEW](images/00008.jpeg)\n\nImmediately after having added the token,\
    \ you’ll notice that the account now has a balance of 100 million of them, and\
    \ that it’s able to send them in the currency dropdown selection menu. Let’s try\
    \ sending some to another address.\n\n![Sending some tokens](images/00009.jpeg)\n\
    \n![Transaction is being prepared](images/00010.jpeg)\n\n![Tokens have been received](images/00011.jpeg)\n\
    \nGo ahead and send those back now to get the original account back to 100 million\
    \ again. We’ve just made sure our token’s basic functionality works as intended.\n\
    \n## Deploying to a Live Network\n\nThis wouldn’t be a real token test without\
    \ also deploying it on a live network. Let’s not use the mainnet, though, but\
    \ a [testnet](https://bitfalls.com/hr/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/)\
    \ like Rinkeby.\n\nIn `truffle.js`, let’s add a new network — `rinkeby` — so that\
    \ our file looks like this:\n\n```\nrequire('dotenv').config();\nconst WalletProvider\
    \ = require(\"truffle-wallet-provider\");\nconst Wallet = require('ethereumjs-wallet');\n\
    const Web3 = require(\"web3\");\nconst w3 = new Web3();\n\nconst PRIVKEY = process.env[\"\
    PRIVKEY\"];\nconst INFURAKEY = process.env[\"INFURAKEY\"];\n\nmodule.exports =\
    \ {\n  networks: {\n    development: {\n      host: \"127.0.0.1\",\n      port:\
    \ 7545,\n      network_id: \"*\"\n    },\n    rinkeby: {\n      provider: function()\
    \ {\n        return new WalletProvider(\n          Wallet.fromPrivateKey(\n  \
    \          Buffer.from(PRIVKEY, \"hex\")), \"https://rinkeby.infura.io/\"+INFURAKEY\n\
    \n        );\n      },\n      gas: 4600000,\n      gasPrice: w3.utils.toWei(\"\
    50\", \"gwei\"),\n      network_id: \"3\",\n    },\n  }\n};\n```\n\nYikes! What\
    \ is all this now?\n\nLet’s process it line by line.\n\nThe first few lines import\
    \ some node modules so we can use the functions below. If you get a missing module\
    \ message for any of those, just running `npm install web3-wallet-provider truffle-wallet-provider\
    \ web3 dotenv --save` should fix things.\n\nNext, we load the private key of the\
    \ wallet from which we’re running the contract (so the wallet which will be getting\
    \ the 100 million tokens; we can’t use the `from` value here) from a `.env` file\
    \ in the root of the project folder. If it doesn’t exist, create it. That same\
    \ file also has an Infura.io access key, which is a website that hosts Ethereum\
    \ nodes and lets apps connect to them so developers don’t need to run full Ethereum\
    \ nodes on their computers.\n\nThe `.env` file is hidden by default and can be\
    \ ignored in `.gitignore` so there’s no danger of your private key ever leaking\
    \ — a very important precaution! This is what the file contains:\n\n```\nPRIVKEY=\"\
    YOUR_PRIVATE_KEY\";\nINFURAKEY=\"YOUR_INFURA_ACCESS_KEY\";\n```\n\nYou can get\
    \ your Infura key by [registering here](https://infura.io/signup). The private\
    \ key can easily be obtained if you just install [Metamask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/),\
    \ switch it to Rinkeby, and go to Export Private Key. Any method will work, though,\
    \ so choose whatever you like. You can also use Ganache’s private key. A single\
    \ private key unlocks the same wallet on all Ethereum networks — testnet, rinkeby,\
    \ mainnet, you name it.\n\nBack to our config file. We have a new `network` entry:\
    \ `rinkeby`. This is the name of the Ethereum testnet we’ll be deploying to and\
    \ the code inside the provider is basically cookie-cutter copy paste telling Truffle\
    \ “grab my private key, hex-encode it, make it into an unlocked wallet, and then\
    \ talk to Infura through it”.\n\nLastly, we define the gas limit we want to spend\
    \ on executing this contract (4.6 million is enough, which can be changed if needed),\
    \ how much the gas will cost (50 Gwei is actually [quite expensive](https://bitfalls.com/2017/12/05/ethereum-gas-and-transaction-fees-explained/),\
    \ but the Ether we’re playing with is simulated so it doesn’t matter) and the\
    \ network ID is set to 4 because that’s how the Rinkeby testnet [is labeled](https://ethereum.stackexchange.com/questions/17051/how-to-select-a-network-id-or-is-there-a-list-of-network-ids).\n\
    \nThere’s one more thing we need to do. The migration file we wrote earlier is\
    \ targeting a `from` address, but the address for Rinkeby is different. Does this\
    \ mean we need to change the deployment script depending on the network? Of course\
    \ not! Let’s change the `2_deploy_tnstoken.js` file to look like this:\n\n```\n\
    var Migrations = artifacts.require(\"./Migrations.sol\");\nvar TNSToken = artifacts.require(\"\
    ./TNSToken.sol\");\n\nmodule.exports = function(deployer, network, accounts) {\n\
    \  if (network == \"development\") {\n    deployer.deploy(TNSToken, {from: accounts[0});\n\
    \  } else {\n    deployer.deploy(TNSToken);\n  }\n};\n```\n\nAs you can see, deployment\
    \ scripts are simple JavaScript and the second parameter given to the deployer\
    \ is always the network’s name — which is what we can use to differentiate between\
    \ them.\n\nIf we try to run the migration now with `truffle migrate --network\
    \ rinkeby`, it will fail if the address we used is new:\n\n![A failing migration](images/00012.jpeg)\n"
