    \ user :/\");\n    blacklist[_offender] == true;\n    token.increaseLockedAmount(_offender,\
    \ token.getUnlockedAmount(_offender));\n    emit Blacklisted(_offender, true);\n\
    }\n\nfunction unblacklistMe() payable public {\n    unblacklistAddress(msg.sender);\n\
    }\n\nfunction unblacklistAddress(address _offender) payable public {\n    require(msg.value\
    \ >= 0.05 ether, \"Unblacklisting fee\");\n    require(blacklist[_offender] ==\
    \ true, \"Can't unblacklist a non-blacklisted user :/\");\n    require(notVoting(_offender),\
