    \n## 结论\n\n至此，我们详尽的 DAO 开发告一段落——但课程尚未结束！我们仍需为这个故事构建并部署 UI。幸运的是，后端完全托管在区块链上，构建前端要简单得多。让我们在本系列的倒数第二部分中探讨这一点。\n\
    \n# 第 7 章：为 DAO 合约构建 Web3 UI\n\n**在本系列关于使用以太坊构建 DApp 的第 6 部分中，我们通过添加投票、黑名单/取消黑名单、股息分配与提取，以及一些额外的辅助函数，使\
    \ DAO 趋于完善。在本教程中，我们将构建一个用于与故事交互的 Web 界面，否则我们无法指望任何用户参与。因此，这是我们将故事发布到现实世界之前的最后一部分。**\n\
    \n由于这不是一个 Web 应用教程，我们将保持一切极其简单。以下代码并非生产就绪，仅作为如何将 JavaScript 连接到区块链的概念验证。但首先，让我们添加一个新的迁移。\n\
    \n## 自动化转账\n\n目前，当我们部署代币和 DAO 时，它们位于区块链上但并未交互。为了测试我们构建的内容，我们需要手动将代币所有权和余额转移到 DAO，这在测试过程中可能很繁琐。\n\
    \n让我们编写一个新的迁移来自动完成此操作。创建文件 `4_configure_relationship.js` 并放入以下内容：\n\n```\nvar\
    \ Migrations = artifacts.require(\"./Migrations.sol\");\nvar StoryDao = artifacts.require(\"\
    ./StoryDao.sol\");\nvar TNSToken = artifacts.require(\"./TNSToken.sol\");\n\n\
    var storyInstance, tokenInstance;\n\nmodule.exports = function (deployer, network,\
    \ accounts) {\n\n    deployer.then(function () {\n            return TNSToken.deployed();\n\
    \        }).then(function (tIns) {\n            tokenInstance = tIns;\n      \
    \      return StoryDao.deployed();\n        }).then(function (sIns) {\n      \
    \      storyInstance = sIns;\n            return balance = tokenInstance.totalSupply();\n\
    \        }).then(function (bal) {\n            return tokenInstance.transfer(storyInstance.address,\
    \ bal);\n        })\n        .then(function (something) {\n            return\
    \ tokenInstance.transferOwnership(storyInstance.address);\n        });\n}\n```\n\
    \n以下是这段代码的作用。首先，你会注意到它是基于 Promise 的，充满了 `then` 调用。这是因为我们在调用下一个函数之前依赖于某个函数返回的数据。所有合约调用都是基于\
    \ Promise 的，这意味着它们不会立即返回数据，因为 Truffle 需要向节点请求信息，因此会做出一个*在未来某个时间返回数据的承诺*。我们通过使用\
    \ `then` 并为所有 `then` 调用提供回调函数来强制代码等待这些数据，当数据最终返回时，这些回调函数会被调用。\n\n因此，按顺序：\n\n*\
    \   首先，向节点请求已部署代币的地址并返回它\n*   然后，接受此数据，将其保存到全局变量中，并请求已部署 DAO 的地址并返回它\n*   然后，接受此数据，将其保存到全局变量中，并请求代币合约所有者账户中的余额，这实际上是总供应量，并返回此数据\n\
    *   然后，一旦获得此余额，使用它调用代币的 `transfer` 函数，将代币发送到 DAO 的地址，并返回结果\n*   然后，忽略返回的结果——我们只想知道何时完成——最后将代币的所有权转移到\
    \ DAO 的地址，返回数据但不丢弃它。\n\n运行 `truffle migrate --reset` 现在应该产生如下输出：\n\n![Truffle\
    \ 迁移](img/00016.jpeg)\n\n## 前端\n\n前端是一个普通的静态 HTML 页面，包含一些用于与区块链通信的 JavaScript\
    \ 和一些用于美化外观的 CSS。\n\n让我们在子文件夹 `public` 中创建一个文件 `index.html`，并赋予以下内容：\n\n"
