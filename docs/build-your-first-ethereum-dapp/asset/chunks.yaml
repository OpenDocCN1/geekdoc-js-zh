  trans: "\n这是因为该地址没有足够的以太币来支付部署合约的费用。不过，这个问题很容易解决。只需前往 [Rinkeby 水龙头](https://www.rinkeby.io/#faucet)\
    \ 申请一些即可。这是免费的。\n\n![申请 Rinkeby 测试以太币](img/00013.jpeg)\n\n现在重新运行迁移，代币合约将部署到 Rinkeby\
    \ 网络上。它可以像上面 Ganache 用例一样进行测试。一切应该完全相同，只不过现在你还可以与朋友和同事一起测试。进展顺利！\n\n## 附加内容：验证与\
    \ ENS\n\n为了增加信任度，建议你在 Etherscan 上验证代币，并为其注册一个 ENS 域名。\n\n### 验证\n\n**验证** 是指将代币的源代码提交给\
    \ Etherscan，以便其与网络上部署的代码进行比较，从而确认没有后门。这可以在代币地址的 *Code* 标签页中完成。由于我们的代币使用了某些第三方代码，而这些代码无法轻松导入到\
    \ *Verify* 界面的代码窗口中，因此我们需要 *展平* 合约。为此，我们将使用一个名为 `truffle-flattener` 的工具：\n\n```\n\
    npm install --global truffle-flattener\n```\n\n该工具会将所有依赖项和代币的源代码复制到一个文件中。我们可以这样运行它：\n\
    \n```\ntruffle-flattener contracts/TNSToken.sol >> ./contracts/TNSTokenFlat.sol\n\
    ```\n\n现在，`contracts` 文件夹中应该会出现一个新文件，其内容与我们的源代码几乎相同，但粘贴了依赖代码（例如，`SafeMath.sol`\
    \ 会被粘贴到文件顶部）。\n\n将该新文件的内容粘贴到 *Verify* 界面的代码窗口中，将编译器设置为运行 `truffle version` 得到的版本，并将\
    \ *Optimization* 设置为 *No*。点击 *Verify* 和 *Publish*，一旦过程完成，你的代币地址页面将出现新标签页：*Read\
    \ Contract* 和 *Write Contract*，而 *Code* 标签页将显示一个绿色对勾，表示代码已验证通过。这将为你赢得社区的额外信任。\n\
    \n![代币现在被标记为可信](img/00014.jpeg)\n\n### ENS\n\nENS 是以太坊名称系统。它用于为以太坊地址赋予人类可读的名称，这样你就不必记住\
    \ `0xmumbojumbo` 这样的字符串，而是可以记住像 `bitfalls.eth` 这样的地址。你甚至可以注册子域名，例如 `token.bitfalls.eth`。注册\
    \ ENS 域名的过程并不简单，且需要时间，因此如果你想这样做，建议你阅读 [本指南](https://ens.domains/) 并按照 [此处](https://www.myetherwallet.com/#ens)\
    \ 的说明操作。\n\n## 结论\n\n在本部分中，我们完成了自定义代币的编译和部署。该代币与所有交易所兼容，并且可以作为常规 ERC20 代币使用。\n\
    \n# 第 4 章：白名单与测试 Story DAO\n\n**在 第 3 部分 的《使用以太坊构建 DApp》系列教程中，我们构建并部署了代币到以太坊测试网\
    \ Rinkeby。在本部分中，我们将开始编写 Story DAO 代码。**\n\n我们将使用 第一章 中列出的条件作为指导。\n\n## 合约大纲\n\n\
    让我们创建一个新合约 `StoryDao.sol`，其骨架如下：\n\n```\npragma solidity ⁰.4.24;\n\nimport \"\
    ../node_modules/openzeppelin-solidity/contracts/math/SafeMath.sol\";\nimport \"\
    ../node_modules/openzeppelin-solidity/contracts/ownership/Ownable.sol\";\n\ncontract\
    \ StoryDao is Ownable {\n    using SafeMath for uint256;\n\n    mapping(address\
    \ => bool) whitelist;\n    uint256 public whitelistedNumber = 0;\n    mapping(address\
    \ => bool) blacklist;\n    event Whitelisted(address addr, bool status);\n   \
    \ event Blacklisted(address addr, bool status);\n\n    uint256 public daofee =\
    \ 100; // hundredths of a percent, i.e. 100 is 1%\n    uint256 public whitelistfee\
    \ = 10000000000000000; // in Wei, this is 0.01 ether\n\n    event SubmissionCommissionChanged(uint256\
    \ newFee);\n    event WhitelistFeeChanged(uint256 newFee);\n\n    uint256 public\
    \ durationDays = 21; // duration of story's chapter in days\n    uint256 public\
    \ durationSubmissions = 1000; // duration of story's chapter in entries\n\n  \
    \  function changedaofee(uint256 _fee) onlyOwner external {\n        require(_fee\
    \ < daofee, \"New fee must be lower than old fee.\");\n        daofee = _fee;\n\
    \        emit SubmissionCommissionChanged(_fee);\n    }\n\n    function changewhitelistfee(uint256\
    \ _fee) onlyOwner external {\n        require(_fee < whitelistfee, \"New fee must\
    \ be lower than old fee.\");\n        whitelistfee = _fee;\n        emit WhitelistFeeChanged(_fee);\n\
    \    }\n\n    function lowerSubmissionFee(uint256 _fee) onlyOwner external {\n\
    \        require(_fee < submissionZeroFee, \"New fee must be lower than old fee.\"\
    );\n        submissionZeroFee = _fee;\n        emit SubmissionFeeChanged(_fee);\n\
    \    }\n\n    function changeDurationDays(uint256 _days) onlyOwner external {\n\
    \        require(_days >= 1);\n        durationDays = _days;\n    }\n\n    function\
    \ changeDurationSubmissions(uint256 _subs) onlyOwner external {\n        require(_subs\
    \ > 99);\n        durationSubmissions = _subs;\n    }\n}\n```\n\n我们导入了 `SafeMath`\
    \ 以再次进行安全计算，但这次我们还使用了 Zeppelin 的 `Ownable` 合约，它允许某人“拥有”故事并执行某些仅限管理员的功能。只需声明 `StoryDao\
    \ is Ownable` 即可；你可以自行检查该合约以了解其工作原理。\n\n我们还使用了该合约中的 `onlyOwner` 修饰符。函数修饰符本质上是函数的扩展或插件。`onlyOwner`\
    \ 修饰符如下所示：\n\n```\nmodifier onlyOwner() {\n  require(msg.sender == owner);\n \
    \ _;\n}\n```\n\n当 `onlyOwner` 被添加到函数中时，该函数的函数体会被 *粘贴* 到 `_;` 所在的位置，并且其前面的代码会先执行。因此，通过使用此修饰符，函数会自动检查消息发送者是否也是合约的所有者，如果是，则继续正常执行；如果不是，则崩溃。\n\
    \n通过在对故事 DAO 的费用和其他参数进行更改的函数上使用 `onlyOwner` 修饰符，我们确保只有管理员才能进行这些更改。\n\n### 测试\n\
    \n让我们测试初始函数。\n\n如果 `test` 文件夹不存在，请创建它。然后在其中创建文件 `TestStoryDao.sol` 和 `TestStoryDao.js`。由于\
    \ Truffle 中没有原生方法来测试异常，还需要创建 `helpers/expectThrow.js`，内容如下：\n\n```\nexport default\
    \ async promise => {\n    try {\n      await promise;\n    } catch (error) {\n\
    \      const invalidOpcode = error.message.search('invalid opcode') >= 0;\n  \
    \    const outOfGas = error.message.search('out of gas') >= 0;\n      const revert\
    \ = error.message.search('revert') >= 0;\n      assert(\n        invalidOpcode\
    \ || outOfGas || revert,\n        'Expected throw, got \\'' + error + '\\' instead',\n\
    \      );\n      return;\n    }\n    assert.fail('Expected throw not received');\n\
    \  };\n```\n\n#### Solidity 测试与 JS 测试\n\nSolidity 测试通常用于测试底层、基于合约的函数，即智能合约的内部逻辑。JS\
