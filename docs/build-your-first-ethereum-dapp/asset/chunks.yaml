  trans: "\n\n*   如果已经列入白名单，则使用回退函数。换句话说，只需向 DAO 合约发送以太币。\n*   通过发送超过白名单所需费用的金额来使用\
    \ `whitelistAddress` 函数。\n*   直接调用 `buyTokens` 函数。\n\n然而，有一个注意事项。当有人从外部调用 `buyTokens`\
    \ 函数时，如果 DAO 中没有足够的代币可出售，我们希望它失败。但是，当有人通过白名单函数在首次白名单尝试中发送过多以太币来购买代币时，我们不希望它失败，因为那样的话，白名单过程会因为所有操作同时失败而被取消。以太坊中的交易是原子性的：要么全部成功，要么全部失败。因此，我们将创建两个\
    \ `buyTokens` 函数。\n\n```\n// 这放在合约顶部，与其他属性一起\nuint256 public tokenToWeiRatio =\
    \ 10000;\n\nfunction buyTokensThrow(address _buyer, uint256 _wei) external {\n\
    \n    require(whitelist[_buyer], \"候选人必须已被列入白名单。\");\n    require(!blacklist[_buyer],\
    \ \"候选人不得被列入黑名单。\");\n\n    uint256 tokens = _wei * tokenToWeiRatio;\n    require(daoTokenBalance()\
    \ >= tokens, \"DAO 必须有足够的代币用于出售\");\n    token.transfer(_buyer, tokens);\n}\n\n\
    function buyTokensInternal(address _buyer, uint256 _wei) internal {\n    require(!blacklist[_buyer],\
    \ \"候选人不得被列入黑名单。\");\n    uint256 tokens = _wei * tokenToWeiRatio;\n    if (daoTokenBalance()\
    \ < tokens) {\n        msg.sender.transfer(_wei);\n    } else {\n        token.transfer(_buyer,\
    \ tokens);\n    }\n}\n```\n\n因此，存在 1 亿个 TNS 代币。如果我们设定每 1 个以太币兑换 10000 个代币的价格，那么每个代币大约价值\
    \ 4-5 美分，这是可以接受的。\n\n这些函数在对被封禁用户和其他因素进行合理性检查后执行一些计算，并立即将代币发送给买家，买家可以按自己的意愿使用它们——无论是用于投票，还是在交易所出售。如果\
    \ DAO 中的代币少于买家试图购买的数量，则买家将获得退款。\n\n`token.transfer(_buyer, tokens)` 这部分是我们使用 TNS\
    \ 代币合约，从*当前*位置（DAO）向目标 `_buyer` 发起转账，转账金额为 `tokens`。\n\n现在我们已经知道人们可以获取代币，接下来看看我们能否实现提交功能。\n\
    \n## 结构体与提交\n\n根据我们的介绍文章，提交一个条目将花费 0.0001 以太币乘以故事中已有的条目数量。我们只需要统计未删除的提交（因为提交可以被删除），所以让我们添加所需的属性以及一个辅助方法。\n\
    \n```\nuint256 public submissionZeroFee = 0.0001 ether;\nuint256 public nonDeletedSubmissions\
    \ = 0;\n\nfunction calculateSubmissionFee() view internal returns (uint256) {\n\
    \    return submissionZeroFee * nonDeletedSubmissions;\n}\n```\n\n#### Solidity\
    \ 的内置单位\n\nSolidity 内置了时间和以太币单位。更多信息请阅读[此处](http://solidity.readthedocs.io/en/develop/units-and-global-variables.html#ether-units)。\n\
    \n此费用只能由所有者更改，且只能降低。如需提高，则需要投票。让我们编写降低费用的函数：\n\n```\nfunction lowerSubmissionFee(uint256\
    \ _fee) onlyOwner external {\n    require(_fee < submissionZeroFee, \"新费用必须低于旧费用。\"\
    );\n    submissionZeroFee = _fee;\n    emit SubmissionFeeChanged(_fee);\n}\n```\n\
    \n我们正在触发一个事件，以通知所有观察客户端费用已更改，因此让我们声明该事件：\n\n```\nevent SubmissionFeeChanged(uint256\
    \ newFee);\n```\n\n一个提交可以是最多 256 个字符的文本，图片也适用相同的限制。只是它们的类型不同。这是自定义结构体的绝佳用例。让我们定义一个新的数据类型。\n\
    \n```\nstruct Submission {\n    bytes content;\n    bool image;\n    uint256 index;\n\
    \    address submitter;\n    bool exists;\n}\n```\n\n这类似于我们智能合约中的“对象类型”。该对象具有不同类型的属性。`content`\
    \ 是一个 [`bytes` 类型值](https://medium.com/@cryptopusco/bytes-and-strings-in-solidity-f2cd4e53f388)。`image`\
    \ 属性是一个布尔值，表示是否为图片（true/false）。`index` 是一个数字，等于提交的普通序号；即它在所有提交列表中的索引（0, 1, 2,\
    \ 3 …）。`submitter` 是提交条目的账户地址，而 `exists` 标志的存在是因为在映射中，所有键的值都被初始化为默认值（false），即使键尚不存在。\n\
    \n换句话说，当你有一个 `address => bool` 的映射时，该映射已经将世界上*所有*地址都设置为“false”。这就是以太坊的工作方式。因此，通过检查某个哈希值处是否存在提交，我们会得到“是”，而实际上该提交可能根本不存在。`exists`\
    \ 标志有助于解决这个问题。它让我们能够检查提交是否存在*并且*是真实存在的——即已被提交，而不是由 EVM 隐式添加的。此外，它使得后续“删除”条目变得更加容易。\n\
    \n#### 呃，不好意思……\n\n严格来说，我们还可以检查提交者的地址是否不是零地址。\n\n趁此机会，让我们定义两个事件：一个用于删除条目，一个用于创建条目。\n\
    \n```\nevent SubmissionCreated(uint256 index, bytes content, bool image, address\
    \ submitter);\nevent SubmissionDeleted(uint256 index, bytes content, bool image,\
    \ address submitter);\n```\n\n不过，有一个问题。以太坊中的映射是不可迭代的：我们无法在不进行[大量黑客操作](https://github.com/chriseth/solidity-examples/blob/master/iterable_mapping.sol)的情况下遍历它们。\n\
    \n为了遍历所有提交，我们将为这些提交创建一个标识符数组，其中数组的键是提交的索引，而值则是我们为每个提交生成的唯一哈希值。Solidity 为我们提供了\
    \ `keccak256` 哈希算法，用于从任意值生成哈希值，我们可以将其与当前区块号结合使用，以确保同一区块中不会出现重复条目，并为每个条目获得一定程度的唯一性。我们这样使用它：`keccak256(abi.encodePacked(_content,\
    \ block.number));`。我们需要对传递给算法的变量进行 `encodePacked` 操作，因为它需要一个单一参数。这就是该函数的作用。\n\n\
    我们还需要将提交存储在某处，因此让我们再定义两个合约变量。\n\n```\nmapping (bytes32 => Submission) public submissions;\n\
    bytes32[] public submissionIndex;\n```\n\n好的，现在让我们尝试构建 `createSubmission` 函数。\n\
    \n```\nfunction createSubmission(bytes _content, bool _image) external payable\
    \ {\n\n    uint256 fee = calculateSubmissionFee();\n    require(msg.value >= fee,\
    \ \"提交条目的费用必须充足。\");\n\n    bytes32 hash = keccak256(abi.encodePacked(_content,\
    \ block.number));\n    require(!submissions[hash].exists, \"同一区块中不得已存在该提交！\");\n\
    \n    submissions[hash] = Submission(\n        _content,\n        _image,\n  \
    \      submissionIndex.push(hash),\n        msg.sender,\n        true\n    );\n\
    \n    emit SubmissionCreated(\n        submissions[hash].index,\n        submissions[hash].content,\n\
    \        submissions[hash].image,\n        submissions[hash].submitter\n    );\n\
    \n    nonDeletedSubmissions += 1;\n}\n```\n\n让我们逐行分析：\n\n```\nfunction createSubmission(bytes\
    \ _content, bool _image) external payable {\n```\n\n该函数接受字节类型的内容（bytes 是动态大小的字节数组，适用于存储任意数量的数据）和一个布尔标志，用于指示此输入是否为图片。该函数只能从外部调用，并且是\
    \ payable 的，这意味着它可以在交易调用时接收以太币。\n\n```\nuint256 fee = calculateSubmissionFee();\n\
    require(msg.value >= fee, \"提交条目的费用必须充足。\");\n```\n\n"
- fmt: "\nNext, we calculate how much it costs to submit a new entry and then check\
    \ if the value passed along with the transaction is equal to or greater than the\
    \ fee.\n\n```\nbytes32 hash = keccak256(abi.encodePacked(_content, block.number));\n\
    require(!submissions[hash].exists, \"Submission must not already exist in same\
    \ block!\");\n```\n\nWe then calculate the hash of this entry (`bytes32` is a\
    \ fixed-size array of 32 bytes, so 32 characters which is also the length of the\
    \ output of `keccak256`). We use this hash to find out if a submission with that\
    \ hash already exists and cancel everything if it does.\n\n```\nsubmissions[hash]\
    \ = Submission(\n    _content,\n    _image,\n    submissionIndex.push(hash),\n\
    \    msg.sender,\n    true\n);\n```\n\nThis part creates a new submission at the\
    \ hash location in the `submissions` mapping. It simply passes in the values via\
    \ a new struct as defined above in the contract. Note that while you might be\
    \ used to the `new` keyword from other languages, it isn’t necessary (or allowed)\
    \ here. We then emit the event (self-explanatory) and finally, there’s `nonDeletedSubmissions\
    \ += 1;`: this is what increases the fee for the next submission (see `calculateSubmissionFee`).\n\
    \nBut there’s a lot of logic missing here. We still need to:\n\n*   account for\
    \ images, and\n*   check for whitelist/blacklist presence and 1 TNS token ownership\
    \ on submitting accounts.\n\nLet’s do images first. Our original plan said that\
    \ an image can only be submitted every 50 texts. We’ll need two more contract\
    \ properties:\n\n```\nuint256 public imageGapMin = 50;\nuint256 public imageGap\
    \ = 0;\n```\n\nSurely you can already assume how we’re going to handle this? Let’s\
    \ add the following into our `createSubmission` method, immediately before creating\
    \ the new submission with `submissions[hash] = ...`.\n\n```\nif (_image) {\n \
    \   require(imageGap >= imageGapMin, \"Image can only be submitted if more than\
    \ {imageGapMin} texts precede it.\");\n    imageGap = 0;\n} else {\n    imageGap\
    \ += 1;\n}\n```\n\nExtremely simple: if the entry is supposed to be an image,\
    \ then first check that the gap between images is more than 49 and reset it to\
    \ 0 if it is. Otherwise, increase the gap by one. Just like that, every 50th (or\
    \ more) submission can now be an image.\n\nFinally, let’s do the access check.\
    \ We can put this code *before* the fee calculation and immediately after the\
    \ entry point to the function, because access checking should happen first.\n\n\
    ```\nrequire(token.balanceOf(msg.sender) >= 10**token.decimals());\nrequire(whitelist[msg.sender],\
    \ \"Must be whitelisted\");\nrequire(!blacklist[msg.sender], \"Must not be blacklisted\"\
    );\n```\n\nThe first line checks if the message sender has more tokens than 10\
    \ to the power of the number of decimals in a token’s contract (because we can\
    \ change the token address, so it’s possible another token will take our token’s\
    \ place later on and that one might not have 18 decimals!). In other words, `10**token.decimals`\
    \ is, in our case, `10**18`, which is `1 000 000 000 000 000 000`, or 1 followed\
    \ by 18 zeroes. If our token has 18 decimals, that’s `1.000000000000000000`, or\
    \ one (1) TNS token. Note that your compiler or linter might give you some warnings\
    \ when analyzing this code. That’s because the `decimals` property of the token\
    \ is public, so its getter function is auto-generated (`decimals()`), but it’s\
    \ not explicitly listed in the interface of the token which we listed at the top\
    \ of the contract. To get around this, we can change the interface by adding this\
    \ line:\n\n```\nfunction decimals() public view returns (uint256);\n```\n\nOne\
    \ more thing: since there’s an owner fee for using the contract currently set\
    \ as 1%, let’s put aside the amount that the owner can withdraw and keep the rest\
    \ in the DAO. The easiest way to do this is to track how much the owner can withdraw\
    \ and increase that number after every submission’s creation. Let’s add a new\
    \ property to the contract:\n\n```\nuint256 public withdrawableByOwner = 0;\n\
    ```\n\nAnd then add this to the end of our `createSubmission` function:\n\n```\n\
    withdrawableByOwner += fee.div(daofee);\n```\n\nWe can let the owner withdraw\
    \ with a function like this:\n\n```\nfunction withdrawToOwner() public {\n   \
    \ owner.transfer(withdrawableByOwner);\n    withdrawableByOwner = 0;\n}\n```\n\
    \nThis sends the allowed amount to the owner and resets the counter to 0. In case\
    \ the owner doesn’t want to withdraw the whole amount, we can add another function\
    \ for that edge case:\n\n```\nfunction withdrawAmountToOwner(uint256 _amount)\
    \ public {\n    uint256 withdraw = _amount;\n    if (withdraw > withdrawableByOwner)\
    \ {\n        withdraw = withdrawableByOwner;\n    }\n    owner.transfer(withdraw);\n\
    \    withdrawableByOwner = withdrawableByOwner.sub(withdraw);\n}\n```\n\nSince\
    \ we’ll be referencing submissions by their hashes often, let’s write a function\
    \ which checks if a submission exists so we can replace our `submissions[hash].exists`\
    \ checks with it:\n\n```\nfunction submissionExists(bytes32 hash) public view\
    \ returns (bool) {\n    return submissions[hash].exists;\n}\n```\n\nSome other\
    \ helper functions for reading submissions will also be necessary:\n\n```\nfunction\
    \ getSubmission(bytes32 hash) public view returns (bytes content, bool image,\
    \ address submitter) {\n    return (submissions[hash].content, submissions[hash].image,\
    \ submissions[hash].submitter);\n}\n\nfunction getAllSubmissionHashes() public\
    \ view returns (bytes32[]) {\n    return submissionIndex;\n}\n\nfunction getSubmissionCount()\
    \ public view returns (uint256) {\n    return submissionIndex.length;\n}\n```\n\
    \nThis is self explanatory. `getSubmission` fetches the submission data, `getAllSubmissionHashes`\
    \ fetches all the unique hashes in the system, and `getSubmissionCount` lists\
    \ how many submissions there are in total (including deleted ones). We use a combination\
    \ of these functions on the client side (in the UI) to fetch the content.\n\n\
    The full `createSubmission` function now looks like this:\n\n```\nfunction createSubmission(bytes\
    \ _content, bool _image) storyActive external payable {\n\n    require(token.balanceOf(msg.sender)\
    \ >= 10**token.decimals());\n    require(whitelist[msg.sender], \"Must be whitelisted\"\
    );\n    require(!blacklist[msg.sender], \"Must not be blacklisted\");\n\n    uint256\
    \ fee = calculateSubmissionFee();\n    require(msg.value >= fee, \"Fee for submitting\
    \ an entry must be sufficient.\");\n\n    bytes32 hash = keccak256(abi.encodePacked(_content,\
    \ block.number));\n    require(!submissionExists(hash), \"Submission must not\
    \ already exist in same block!\");\n\n    if (_image) {\n        require(imageGap\
    \ >= imageGapMin, \"Image can only be submitted if more than {imageGapMin} texts\
    \ precede it.\");\n        imageGap = 0;\n    } else {\n        imageGap += 1;\n\
    \    }\n\n    submissions[hash] = Submission(\n        _content,\n        _image,\n\
    \        submissionIndex.push(hash),\n        msg.sender,\n        true\n    );\n\
    \n    emit SubmissionCreated(\n        submissions[hash].index,\n        submissions[hash].content,\n\
    \        submissions[hash].image,\n        submissions[hash].submitter\n    );\n\
    \n    nonDeletedSubmissions += 1;\n    withdrawableByOwner += fee.div(daofee);\n\
    }\n```\n\n### Deleting\n\nSo what about deleting submissions? That’s easy enough:\
    \ we just switch the `exists` flag to `false`!\n\n```\nfunction deleteSubmission(bytes32\
    \ hash) internal {\n    require(submissionExists(hash), \"Submission must exist\
    \ to be deletable.\");\n    Submission storage sub = submissions[hash];\n\n  \
    \  sub.exists = false;\n    deletions[submissions[hash].submitter] += 1;\n\n \
    \   emit SubmissionDeleted(\n        sub.index,\n        sub.content,\n      \
    \  sub.image,\n        sub.submitter\n    );\n\n    nonDeletedSubmissions -= 1;\n\
    }\n```\n\nFirst, we make sure the submission exists and isn’t already deleted;\
    \ then we retrieve it from the storage. Next we set its `exists` flag to false,\
    \ increase the number of deletions in the DAO for that address by 1 (useful when\
    \ tracking how many entries a user has had deleted for them later on; this can\
    \ lead to a blacklist!), and we emit a deletion event.\n"
