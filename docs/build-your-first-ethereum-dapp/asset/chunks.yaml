    Ganache 在这里所做的是启动一个私有区块链，几乎没有挖矿时间，也没有节点。它会在交易到达时立即执行。它还会生成 10 个预先加载了大量虚拟以太币的地址，并输出它们的私钥，以便你可以将它们导入到各种工具中，例如
    [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/)、[MyEtherWallet](https://www.sitepoint.com/myetherwallet-introduction)
    或之前下载的 Mist。


    我们将根据需求混合使用这种方法与上述方法，因此请确保两者都已设置好。


    #### Ganache UI


    最好（或者作为替代方案）使用 [Ganache UI 工具](http://truffleframework.com/ganache/) 来获得管理 Ganache
    区块链的可视化界面。


    ## 结论


    使用[本指南](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/)通过
    [MetaMask](https://bitfalls.com/2018/02/16/metamask-send-receive-ether/)、[MyEtherWallet](https://www.sitepoint.com/myetherwallet-introduction)
    或之前下载的 Mist 等工具连接到私有区块链（任一版本）。两种引导启动选项在运行时默认都监听 `localhost:8545`，因此连接它们的过程是相同的。


    现在，我们已经制定了应用的规则和功能，设置好了私有区块链并且可以连接到它，接下来让我们关注工具、包和依赖项。


    # 第 2 章：创建和部署 TNS 代币


    **在本系列关于使用以太坊构建 DApp 教程的第 1 部分中，我们引导启动了两种用于开发的本地区块链版本：一个 Ganache 版本和一个完整的私有 PoA
    版本。**


    在这一部分中，我们将直接深入，构建并部署我们的 TNS 代币——用户将使用该代币在 Story DAO 中对提案进行投票。


    ## 前提条件


    按照上一部分所述，启动并运行一个 Ganache 版本。或者，如果你没有从第一部分开始跟随，也可以运行任何本地版本的区块链，但请确保你可以[使用我们需要的工具连接到它](https://bitfalls.com/2018/03/26/connecting-myetherwallet-mist-metamask-private-blockchain/)。


    我们假设你已经拥有一个可用的私有区块链，并且能够通过终端应用（或在 Windows 上通过 Git Bash、Console、CMD Prompt、Powershell
    等应用）向其控制台和操作系统终端输入命令。


    ## 基本依赖项


