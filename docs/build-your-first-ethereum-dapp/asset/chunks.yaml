    ).innerHTML += el;\n    break;\n    default:\n    break;\n  }\n}\n```\n\nNow all\
    \ we need to do to add a brand new event is instantiate it, and then define a\
    \ `case` for it.\n\nNext, let’s make it possible to make a submission.\n\n```\n\
    document.getElementById(\"submission-body-btn\").addEventListener(\"click\", function(e)\
    \ {\n    if (!loggedIn) {\n        return false;\n    }\n\n    var text = document.getElementById(\"\
    submission-body-input\").value;\n    text = web3.toHex(text);\n\n    story.createSubmission(text,\
    \ false, {value: 0, gas: 400000}, function(error, result) {\n        refreshSubmissions();\n\
    \    });\n});\n\nfunction refreshSubmissions() {\n    story.getAllSubmissionHashes(function(error,\
    \ result){\n        console.log(result);\n    });\n}\n```"
