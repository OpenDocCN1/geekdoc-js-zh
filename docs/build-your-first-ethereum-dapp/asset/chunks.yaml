    ```json\n{\n  \"name\": \"storydao\",\n  \"devDependencies\": {\n    \"babel-preset-es2015\"\
    : \"⁶.18.0\",\n    \"babel-preset-stage-2\": \"⁶.24.1\",\n    \"babel-preset-stage-3\"\
    : \"⁶.17.0\",\n    \"babel-polyfill\": \"⁶.26.0\",\n    \"babel-register\": \"\
    ⁶.23.0\",\n    \"dotenv\": \"⁶.0.0\",\n    \"truffle\": \"⁴.1.12\",\n    \"openzeppelin-solidity\"\
    : \"¹.10.0\",\n    \"openzeppelin-solidity-metadata\": \"¹.2.0\",\n    \"openzeppelin-zos\"\
    : \"\",\n    \"truffle-wallet-provider\": \"⁰.0.5\",\n    \"ethereumjs-wallet\"\
    : \"⁰.6.0\",\n    \"web3\": \"¹.0.0-beta.34\",\n    \"truffle-assertions\": \"\
    ⁰.3.1\"\n  }\n}\n```\n\n以及一个包含以下内容的`.babelrc`文件：\n\n```json\n{\n  \"presets\"\
    : [\"es2015\", \"stage-2\", \"stage-3\"]\n}\n```\n\n我们还需要在 Truffle 配置中引入 Babel，以便它在编译测试时知道使用它。\n\
    \n#### Babel\n\nBabel 是 NodeJS 的一个附加组件，它允许我们在当前版本的 NodeJS 中使用下一代 JavaScript 语法，例如编写`import`等。如果你不理解这些，只需忽略并直接粘贴即可。按照这种方式安装后，你可能再也不需要处理这个问题了。\n\
    \n```javascript\nrequire('dotenv').config();\n\n================== 添加以下两行 ================\n\
    require('babel-register');\nrequire('babel-polyfill');\n=======================================================\n\
    \nconst WalletProvider = require(\"truffle-wallet-provider\");\nconst Wallet =\
    \ require('ethereumjs-wallet');\n\n// ...\n```\n\n现在，**终于**可以运行`truffle test`了。输出应该类似于下图：\n\
    \n![测试成功](img/00015.jpeg)\n\n有关测试的更多信息，请参阅[本教程](https://www.sitepoint.com/truffle-testing-smart-contracts/)，我们专门为覆盖智能合约测试而准备了它。\n\
    \n在本课程的后续部分，我们将跳过测试，因为逐一编写会使教程过于冗长，但请参考项目的最终源代码以查看所有测试。我们刚刚完成的过程已经设置了测试环境，因此你可以直接编写测试，无需进一步配置。\n\
    \n## 白名单\n\n现在让我们构建白名单机制，它允许用户参与故事创作。在`StoryDao.sol`中添加以下函数骨架：\n\n```solidity\n\
    function whitelistAddress(address _add) public payable {\n    // 如果发送了足够的资金，则将发送者加入白名单\n\
    }\n\nfunction() external payable {\n    // 如果未加入白名单，且支付足够，则加入白名单\n    // 如果已加入白名单，则以指定价格购买\
    \ X 个代币\n}\n```\n\n"
- fmt: "\nThe unnamed function `function()` is called a `fallback function`, and that’s\
    \ the function that gets called when money is sent to this contract without a\
    \ specific instruction (i.e. without calling another function specifically). This\
    \ lets people join the StoryDao by just sending Ether to the DAO and either getting\
    \ whitelisted instantly, or buying tokens, depending on whether or not they are\
    \ already whitelisted.\n\nThe `whitelistSender` function is there for whitelisting\
    \ and can be called directly, but we’ll make sure the fallback function automatically\
    \ calls it when it receives some ether if the sender has not yet been whitelisted.\
    \ The `whitelistAddress` function is declared `public` because it should be callable\
    \ from other contracts as well, and the fallback function is `external` because\
    \ money will be going to this address only from external addresses. Contracts\
    \ calling this contract can easily call required functions directly.\n\nLet’s\
    \ deal with the fallback function first.\n\n```\nfunction() external payable {\n\
    \n    if (!whitelist[msg.sender]) {\n        whitelistAddress(msg.sender);\n \
    \   } else {\n        // buyTokens(msg.sender, msg.value);\n    }\n}\n```\n\n\
    We check if the sender isn’t already on the whitelist, and delegate the call to\
    \ the `whitelistAddress` function. Notice that we commented out our `buyTokens`\
    \ function because we don’t yet have it.\n\nNext, let’s handle the whitelisting.\n\
    \n```\nfunction whitelistAddress(address _add) public payable {\n    require(!whitelist[_add],\
    \ \"Candidate must not be whitelisted.\");\n    require(!blacklist[_add], \"Candidate\
    \ must not be blacklisted.\");\n    require(msg.value >= whitelistfee, \"Sender\
    \ must send enough ether to cover the whitelisting fee.\");\n\n    whitelist[_add]\
    \ = true;\n    whitelistedNumber++;\n    emit Whitelisted(_add, true);\n\n   \
    \ if (msg.value > whitelistfee) {\n        // buyTokens(_add, msg.value.sub(whitelistfee));\n\
    \    }\n}\n```\n\nNotice that this function accepts the address as a parameter\
    \ and doesn’t extract it from the message (from the transaction). This has the\
    \ added advantage of people being able to whitelist other people, if someone can’t\
    \ afford to join the DAO for example.\n\nWe start the function with some sanity\
    \ checks: the sender must not be whitelisted already or blacklisted (banned) and\
    \ must have sent in enough to cover the fee. If these conditions are satisfactory,\
    \ the address is added to the whitelist, the `Whitelisted` event is emitted, and,\
    \ finally, if the amount of ether sent in is greater than the amount of ether\
    \ needed to cover the whitelisting fee, the remainder is used to buy the tokens.\n\
    \n#### `sub`\n\nWe’re using `sub` instead of `-` to subtract, because that’s a\
    \ `SafeMath` function for safe calculations.\n\nUsers can now get themselves or\
    \ others whitelisted as long as they send 0.01 ether or more to the StoryDao contract.\n\
    \n## Conclusion\n\nWe built the initial part of our DAO in this tutorial, but\
    \ a lot more work remains. Stay tuned: in the next part we’ll deal with adding\
    \ content to the story!\n\n# Chapter 5: Cross-contract Communication & Token Selling\n\
    \n**In [part 4](#part0005_split_000.html_4OIQ0-63b9e60a50594bb1b6dced0e79731cb3)\
    \ of this tutorial series on building DApps with Ethereum, we started building\
    \ and testing our DAO contract. Now let’s go one step further and handle adding\
    \ content and tokens to the story, as per our [introduction](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup).**\n\
    \n## Adding Tokens\n\nFor a contract to be able to interact with another contract,\
    \ it needs to be aware of that other contract’s interface — the functions available\
    \ to it. Since our TNS token has a fairly straightforward interface, we can include\
    \ it as such in the contract of our DAO, above the `contract StoryDao` declaration\
    \ and under our `import` statements:\n\n```\ncontract LockableToken is Ownable\
    \ {\n    function totalSupply() public view returns (uint256);\n    function balanceOf(address\
    \ who) public view returns (uint256);\n    function transfer(address to, uint256\
    \ value) public returns (bool);\n    event Transfer(address indexed from, address\
    \ indexed to, uint256 value);\n    function allowance(address owner, address spender)\
    \ public view returns (uint256);\n    function transferFrom(address from, address\
    \ to, uint256 value) public returns (bool);\n    function approve(address spender,\
    \ uint256 value) public returns (bool);\n    event Approval(address indexed owner,\
    \ address indexed spender, uint256 value);\n    function approveAndCall(address\
    \ _spender, uint256 _value, bytes _data) public payable returns (bool);\n    function\
    \ transferAndCall(address _to, uint256 _value, bytes _data) public payable returns\
    \ (bool);\n    function transferFromAndCall(address _from, address _to, uint256\
    \ _value, bytes _data) public payable returns (bool);\n\n    function increaseLockedAmount(address\
    \ _owner, uint256 _amount) public returns (uint256);\n    function decreaseLockedAmount(address\
    \ _owner, uint256 _amount) public returns (uint256);\n    function getLockedAmount(address\
    \ _owner) view public returns (uint256);\n    function getUnlockedAmount(address\
    \ _owner) view public returns (uint256);\n}\n```\n\nNotice that we don’t need\
    \ to paste in the “meat” of the functions, but only their signatures (skeletons).\
    \ This is all that’s needed to interact between contracts.\n\nNow we can use these\
    \ functions in the DAO contract. The plan is as follows:\n\n*   launch the token\
    \ (we already did this)\n\n*   launch the DAO from the same address\n\n*   send\
    \ all tokens from the token-launcher to the DAO, then transfer ownership over\
    \ the contract to the DAO itself\n\n*   at this point the DAO owns all tokens\
    \ and can sell them to people using the `transfer` function, or can reserve them\
    \ for spending using the `approve` function (useful during votes), etc.\n\nBut\
    \ how does the DAO know which address the token is deployed on? We tell it.\n\n\
    First, we add a new variable at the top of the DAO contract:\n\n```\nLockableToken\
    \ public token;\n```\n\nThen, we add some functions:\n\n```\nconstructor(address\
    \ _token) public {\n    require(_token != address(0), \"Token address cannot be\
    \ null-address\");\n    token = LockableToken(_token);\n}\n```\n\nThe constructor\
    \ is the function which gets called automatically when a contract is deployed.\
    \ It’s useful for initializing values like linked contracts, default values, etc.\
    \ In our case, we’ll use it to consume and save the address of the TNS token.\
    \ The `require` check is there to make sure the token’s address is valid.\n\n\
    While we’re at it, let’s add a function that lets users check how many tokens\
    \ remain for sale in the DAO, and the ability to change to another token should\
    \ something go wrong and such a change be required. This change deserves an event,\
    \ too, so let’s add that in as well.\n\n```\nevent TokenAddressChange(address\
    \ token);\n\nfunction daoTokenBalance() public view returns (uint256) {\n    return\
    \ token.balanceOf(address(this));\n}\n\nfunction changeTokenAddress(address _token)\
    \ onlyOwner public {\n    require(_token != address(0), \"Token address cannot\
    \ be null-address\");\n    token = LockableToken(_token);\n    emit TokenAddressChange(_token);\n\
    }\n```\n\nThe first function is set to `view` because it doesn’t change the state\
    \ of the blockchain; it doesn’t alter any values. This means it’s a free, read-only\
    \ function call to the blockchain: it doesn’t need a paid transaction. It also\
    \ returns the balance of tokens as a number, so this needs to be declared on the\
    \ function’s signature with `returns (uint256)`. The token has a `balanceOf` function\
    \ (see the interface we pasted in above) and it accepts one parameter — the address\
    \ whose balance to check. We’re checking our (this) DAO’s balance, so “this”,\
    \ and we turn “this” into an address with `address()`.\n\nThe token address changing\
    \ function allows the owner (admin) to change the token contract. It’s identical\
    \ to the logic of the constructor.\n\nLet’s see how we can let people buy the\
    \ tokens now.\n\n### Buying Tokens\n\nAs per the previous part of the series,\
    \ users can buy tokens by:\n"
