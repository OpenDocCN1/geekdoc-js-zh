  trans: "\n\n最后，我们通过减少系统中未删除的提交数量来降低新提交的创建费用。别忘了还要给我们的合约添加一个新属性——用来追踪这些删除操作：\n\n\
    ```\nmapping (address => uint256) public deletions;\n```\n\n## 部署变得更加复杂\n\n既然我们在另一个合约中使用了代币，就需要更新部署脚本（`3_deploy_storydao`），将代币地址传入\
    \ `StoryDao` 的构造函数，如下所示：\n\n```\nvar Migrations = artifacts.require(\"./Migrations.sol\"\
    );\nvar StoryDao = artifacts.require(\"./StoryDao.sol\");\nvar TNSToken = artifacts.require(\"\
    ./TNSToken.sol\");\n\nmodule.exports = function(deployer, network, accounts) {\n\
    if (network == \"development\") {\n    deployer.deploy(StoryDao, TNSToken.address,\
    \ {from: accounts[0]});\n} else {\n    deployer.deploy(StoryDao, TNSToken.address);\n\
    }\n};\n```\n\n更多关于配置部署的信息，请阅读[此处](https://truffleframework.com/docs/getting_started/migrations)。\n\
    \n## 结论\n\n在这一部分中，我们为参与者增加了从 DAO 购买代币以及向故事中添加提交内容的能力。DAO 合约的另一部分仍然存在：投票和民主化。这将是我们在下一部分中处理的内容。\n\
    \n# 第 6 章：使用自定义代币进行投票\n\n**在本系列关于使用以太坊构建 DApp 的教程的第 5 部分中，我们处理了向故事中添加内容的问题，探讨了如何让参与者从\
    \ DAO 购买代币以及向故事中添加提交内容。现在是时候让 DAO 呈现最终形态了：投票、黑名单/取消黑名单、分红发放与提取。我们还会额外添加一些辅助函数以备不时之需。**\n\
    \n如果你在这个过程中迷失了方向，完整的源代码可以在[这个仓库](https://github.com/bitfalls/storydao)中找到。\n\n\
    #### Github\n\n如果你在这个过程中迷失了方向，完整的源代码可以在[这个仓库](https://github.com/bitfalls/storydao)中找到。\n\
    \n## 投票与提案\n\n我们将发布 `Proposal`（提案）并使用 `Vote`（投票）进行表决。我们需要两个新的结构体：\n\n```\nstruct\
    \ Proposal {\n    string description;\n    bool executed;\n    int256 currentResult;\n\
    \    uint8 typeFlag; // 1 = 删除\n    bytes32 target; // 提案目标的 ID。例如，flag 1，目标 XXXXXX（哈希）表示删除\
    \ submissions[hash] 的提案\n    uint256 creationDate;\n    uint256 deadline;\n  \
    \  mapping (address => bool) voters;\n    Vote[] votes;\n    address submitter;\n\
    }\n\nProposal[] public proposals;\nuint256 proposalCount = 0;\nevent ProposalAdded(uint256\
    \ id, uint8 typeFlag, bytes32 hash, string description, address submitter);\n\
    event ProposalExecuted(uint256 id);\nevent Voted(address voter, bool vote, uint256\
    \ power, string justification);\n\nstruct Vote {\n    bool inSupport;\n    address\
    \ voter;\n    string justification;\n    uint256 power;\n}\n```\n\n一个 `Proposal`\
    \ 会有一个投票者映射，以防止有人对同一个提案投两次票，以及其他一些不言自明的元数据。`Vote` 要么是赞成票，要么是反对票，它会记录投票者及其投票理由，以及投票权重——即他们愿意为这个提案投入的代币数量。我们还添加了一个\
    \ `Proposal` 数组，以便将它们存储起来，以及一个用于统计提案数量的计数器。\n\n现在我们来构建它们对应的函数，先从投票函数开始：\n\n```\n\
    modifier tokenHoldersOnly() {\n    require(token.balanceOf(msg.sender) >= 10**token.decimals());\n\
    \    _;\n}\n\nfunction vote(uint256 _proposalId, bool _vote, string _description,\
    \ uint256 _votePower) tokenHoldersOnly public returns (int256) {\n\n    require(_votePower\
    \ > 0, \"投票必须赋予至少一定的权重。\");\n    require(uint256(_votePower) <= token.balanceOf(msg.sender),\
    \ \"投票者必须拥有足够的代币来覆盖投票权重。\");\n\n    Proposal storage p = proposals[_proposalId];\n\
    \n    require(p.executed == false, \"提案不能已经被执行。\");\n    require(p.deadline >\
    \ now, \"提案不能已经过期。\");\n    require(p.voters[msg.sender] == false, \"用户不能已经投过票。\"\
    );\n\n    uint256 voteid = p.votes.length++;\n    Vote storage pvote = p.votes[voteid];\n\
    \    pvote.inSupport = _vote;\n    pvote.justification = _description;\n    pvote.voter\
    \ = msg.sender;\n    pvote.power = _votePower;\n\n    p.voters[msg.sender] = true;\n\
    \n    p.currentResult = (_vote) ? p.currentResult + int256(_votePower) : p.currentResult\
    \ - int256(_votePower);\n    token.increaseLockedAmount(msg.sender, _votePower);\n\
    \n    emit Voted(msg.sender, _vote, _votePower, _description);\n    return p.currentResult;\n\
    }\n```\n\n注意这个函数修饰符：通过将这个修饰符添加到我们的合约中，我们可以将其附加到任何未来的函数上，确保只有代币持有者才能执行该函数。这是一个可复用的安全检查！\n\
    \n`vote` 函数进行了一些合理性检查，比如投票权重必须为正数、投票者必须拥有足够的代币来实际投票等。然后我们从存储中获取提案，并确保它既没有过期也没有被执行。对一个已经完成的提案进行投票是没有意义的。我们还需要确保这个人还没有投过票。我们可以允许更改投票权重，但这会使\
    \ DAO 面临一些漏洞，比如人们在最后一刻撤回投票等。也许这是未来版本可以考虑的功能？\n\n然后我们在提案中注册一个新的 `Vote`，更新当前结果以便于快速查看分数，最后触发\
    \ `Voted` 事件。但 `token.increaseLockedAmount` 是什么？\n\n这段逻辑增加了用户的锁定代币数量。该函数只能由代币合约的所有者（此时希望是\
    \ DAO）执行，并且会阻止用户发送超过其账户中注册的锁定代币数量的代币。这个锁定会在提案失败或执行后解除。\n\n现在我们来编写用于提议删除条目的函数。\n\
    \n## 投票删除与黑名单\n\n正如本系列[第 1 部分](https://www.sitepoint.com/building-ethereum-dapps-app-rules-blockchain-setup)中所确定的，我们计划了三种条目删除函数：\n\
    \n1.  **移除条目**：经投票确认后，目标条目被移除。投票时间：**48 小时**。\n\n2.  **紧急移除条目 [仅限所有者]**：只能由所有者触发。经投票确认后，目标条目被移除。投票时间：**24\
    \ 小时**。\n\n3.  **紧急移除图片 [仅限所有者]**：仅适用于图片条目。只能由所有者触发。经投票确认后，目标条目被移除。投票时间：**4 小时**。\n\
    \n某个地址的条目被删除五次后，该地址将被列入黑名单。\n\n现在让我们看看如何实现这一点。首先是删除函数：\n\n"
