    The distribution is a pull-mechanism: the holders need to call the `withdraw`
    function of the DAO to get their ether. It will not be automatically called. The
    withdrawal window is 72 hours. 50% of the unclaimed ether goes to the owner, while
    50% goes into the next chapter’s dividend.


    ### Fees


    1% of every submitted entry fee goes to the current Owner. The rest is put into
    a pool and distributed to all TNS holders after every chapter ends, proportionate
    to their TNS holdings.


    The Owner’s fees go into a separate balance from which they can periodically withdraw
    at will.


    To get whitelisted, the user must send 0.01 ether to the DAO. All future purchases
    of tokens are at a much lower price. The 0.01 ether entry fee is there to prevent
    [Sybil attacks](https://bitfalls.com/glossary/#sybil-attack). If the user sends
    more than 0.01 in the first go, the 0.01 go towards the whitelisting, while the
    leftovers will be used to calculate how much more TNS the user gets. All tokens
    will be sent back to the user in one go.


    In a nutshell, think of this project as a crowdsourced choose-your-own-adventure
    story with crowd curation and community censorship. A story-DAO.


    ## Bootstrapping: PoA Private Blockchain


    We’ll do two bootstrapping procedures: this one will focus on running our own
    real Ethereum blockchain locally. It will use [Proof of Authority](https://www.sitepoint.com/proof-of-stake-vs-proof-of-work)
    as a consensus mechanism, and function as any real Ethereum [testnet](https://bitfalls.com/2018/02/08/what-is-an-ethereum-testnet-and-how-is-it-used/)
    would.


    * Download and install [Virtualbox](https://www.virtualbox.org/).

    * Download and install [Vagrant](https://www.vagrantup.com/). If you’re not sure
    what virtual machines are, please see [this post](http://www.sitepoint.com/re-introducing-vagrant-right-way-start-php/).

    * Download Geth from [here](https://ethereum.github.io/go-ethereum/downloads/).
    Be sure to scroll down and download “Geth & Tools”, not just “Geth”. If you’re
    on macOS, you can also use Homebrew and install it with `brew install ethereum`.

    * Mist can be downloaded [here](https://github.com/ethereum/mist/releases). Be
    sure to download “Mist” and not “Ethereum Wallet”. Mist is the Ethereum “browser”
    which can open various DApps. Ethereum Wallet is the same thing, but locked into
    wallet-mode, so you can’t open other apps with it. This is to prevent non-technical
    users from visiting malicious DApps.


    We need VirtualBox and Vagrant because we’ll be using [this approach](http://www.sitepoint.com/quick-tip-get-homestead-vagrant-vm-running/)
    to launch two virtual machines on which our nodes will be running, simulating
    two computers running an Ethereum node.


    Next, follow the instructions from [this post](https://www.sitepoint.com/puppeth-introduction)
    to get a PoA private blockchain set up.


    You’ll end up with two running nodes. Each will be mining to its own address.
    Make a note of those addresses. Mine were:


    * Node1: `0x4b61dc81fe382068e459444e8beed1aab9940e3b`

    * Node2: `0x97e01610f1c4f4367c326ed1e9c41896b4378458`


    ## Bootstrapping: Ganache CLI


    The second type of bootstrapping we can approach, and this is particularly useful
    for testing our contracts, is Ganache CLI, previously known as Testrpc.


    [Ganache](http://truffleframework.com/ganache/) is a JavaScript-based blockchain
    simulation running locally. It re-runs the blockchain from scratch every time
    we run tests or relaunch our app. This helps us test edge cases quickly but doesn’t
    lend itself well to long-term testing of long-lasting contracts.


    First, install Ganache with `npm install -g ganache-cli`.


    Then, simply run `ganache-cli` and you’re ready. You should see output similar
    to this one:


    ```

