  trans: "\n\n字符串转义序列允许用户解析 JavaScript 字符串字面量中的特殊字符/格式，例如 TEXTATEA 输入中的换行符。\n\n| 转义序列\
    \ | 属性 | 描述 |\n| :--- | :--- | :--- |\n| `\\b` | 退格 | |\n| `\\f` | 分页符 | |\n|\
    \ `\\n` | 换行符 | |\n| `\\O` | 空字符 | |\n| `\\r` | 回车 | |\n| `\\t` | 水平制表 | |\n|\
    \ `\\v` | 垂直制表 | |\n| `\\’` | 单引号或省撇号 | |\n| `\\”` | 双引号 | |\n| `\\\\` | 反斜杠 |\
    \ |\n| `\\ddd` | 由 0 到 377 之间的三个八进制数字指定的 Latin-1 字符。例如版权符号为 `\\251` | |\n| `\\\
    xdd` | 由 00 到 FF 之间的两个十六进制数字 `dd` 指定的 Latin-1 字符。例如版权符号为 `\\xA9` | |\n| `\\udddd`\
    \ | 由四个十六进制数字 `dddd` 指定 Unicode 字符。例如版权符号为 `\\u00A9` | |\n\n### JavaScript 布尔值\n\
    \n```javascript\nBoolean(15 >10) // 返回 true\n(5>10) 1 ………// 返回 true\n11>10…… …….//\
    \ 返回 true\n```\n\n极大或极小的数字可以使用科学计数法（指数法）书写：\n\n```javascript\nvar x = 124e5; //\
    \ 12400000\nvar y = 124e-5; // 0.00124\n```\n\n### JavaScript 数字\n\nJavaScript\
    \ 只有一种数字类型。数字可以带小数点也可以不带小数点写，例如：\n\n```javascript\nvar x – 39.00 // 一个带有小数点的数字\n\
    var y = 39…// 一个不带小数点的数字\n```\n\n**关于数字的提示**\n\n- 数字始终使用 64 位浮点数。\n- 与许多其他编程语言不同，JavaScript\
    \ 没有定义不同类型的数字，例如整数、短整型、长整型、浮点型等。\n- JavaScript 数字始终存储为遵循国际 IEEE 754 标准的双倍精度浮点数。\n\
    \n### JavaScript Null\n\nNull 被认为是没有值、无或简单地为不存在。在 JavaScript 中，`null` 的数据类型是一个对象。可以通过将其设置为\
    \ `null` 来清空一个对象，如下：\n\n```javascript\nvar person = null; // 值为 null，但类型仍然是对象\n\
    ```\n\n### JavaScript Void\n\nJavaScript 中的 `void` 关键字被用作一元运算符，出现在其单个操作数之前。该运算符指定一个要评估的表达式但不返回任何值。\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\"></script>\n</head>\n\
    <body>\n<p>请点击下方内容，这对我没有任何影响……</p>\n<a href=\"javascript:void(alert(0))\">请点击我！</a>\n\
    </body>\n</html>\n```\n\n当点击 **请点击我** 链接时，上述脚本将产生以下结果：\n\n![images/himg-7-1.png](img/00009.jpeg)\n\
    \n### 复合类型\n\n#### 函数\n\n函数是一个 JavaScript 代码块，每当它执行或调用时都会执行特定任务。它用 `function`\
    \ 关键字定义，后面跟着函数名和括号 `()`。它可能包含字母、数字、下划线符号和美元符号。括号中可以包含逗号分隔的参数名，例如 `parameter1`、`parameter2`\
    \ 等。要执行的代码放在花括号 `{}` 内部。\n\n![images/himg-7-2.png](img/00010.jpeg)\n\n**示例：**\n\
    \n```javascript\nfunction convertDataToCentrigrade (degFarenheit)\n{\n  var degCentigrade;\n\
    \  degCentigrade = 5/9 * (degFarenheit – 32);\n  return degCentigrade;\n}\n```\n\
    \n## 对象\n\n对象包含属性和方法的复合数据类型。网页、文本框、表单、按钮和图像等屏幕元素被视为对象。在 JavaScript 中，除了**原始值**之外，所有值都被视为对象。\n\
    \n属性定义对象的特性。\n\n### 属性\n\n| 对象属性 | 属性 | 值 |\n| :--- | :--- | :--- |\n| `firstName`\
    \ | Clark | |\n| `lastName` | Mays | |\n| `age` | 18 | |\n| `eyeColor` | Green\
    \ | |\n\n### 方法\n\n可以在对象上执行的操作被称为**方法**。一个**对象方法**是一个包含函数定义的对象属性。\n\n| 对象方法 |\
    \ 属性 | 值 |\n| :--- | :--- | :--- |\n| `firstName` | Clark | |\n| `lastName` |\
    \ Mays | |\n| `age` | 18 | |\n| `eyeColor` | Green | |\n| `fullName` | `function()\
    \ { return this.firstName + “ ” + this.lastName; }` | |\n\n| 对象名称 | 描述 | 标识符 |\n\
    | :--- | :--- | :--- |\n| 当引用一个**对象**时 | `objectName` | |\n| 当引用对象的某个**属性**时 |\
    \ `objectName.propertyName` | |\n| 当引用对象的**方法**时 | `objectName.methodName()` |\
    \ |\n\n| 内置对象 | 对象名称 | 描述 | 格式 |\n| :--- | :--- | :--- | :--- |\n| Math 对象 | 为各种数学操作提供方法，包括\
    \ `abs()`，`log()`，`pow()`，`random()`，`round()`，`sqrt()` | `Math.method(#)` | |\n\
    | | `<SCRIPT language = “JavaScript”> Var theValue =3.14 myAns = Math.round (the\
    \ value)</SCRIPT>` | | |\n| Date 对象 | 提供日期和时间信息 | `dateObject.method()` | |\n\
    | | `<SCRIPT language = “JavaScript”> var valDat = new Date() theYr = valDat.getFullYear()</SCRIPT>`\
    \ | | |\n| String 对象 | 提供字符串操作和格式化的方法和属性 | `stringName.method()` | |\n| | `<SCRIPT\
    \ language = “JavaScript”> var theStringValue = “my name” var printString = theString.bold()\
    \ var numChars = theStringValue.length</SCRIPT>` | | |\n| Array 对象 | 用于在变量中存储多个称为**元素**的值\
    \ | `var array.name =[item1, item2…];` | | |\n| | `<SCRIPT language = “JavaScript”>\
    \ var cars = [“Toyota”, “Isuzu”, “Kia”]; document.getElementById(“demo”).innerHTML\
    \ = cars;</SCRIPT>` | | |\n| Boolean 对象 | 代表真或假 | `var val = new Boolean (value);`\
    \ | | |\n| | `<SCRIPT language = “JavaScript”> myFunction() { var x = 0; document.getElementById(“demo”).innerHTML\
    \ = Boolean(x); }</SCRIPT>` | | |\n\n| 文档方法 | 属性/方法 | 描述 | 语法 |\n| :--- | :---\
    \ | :--- | :--- |\n| `document.body` | 获取文档的主体 `<body>` | `document.body` | `document.body.style.backgroundColor\
    \ = “red”;` |\n| `document.close()` | 关闭文档 | `document.close()` | `document.open();\
    \ document.write(“<h1>Hello Earth</h1>”); document.close();` | |\n| `document.cookie`\
    \ | 获取 cookie 的键/值对 | `document.cookie` | `var y = document.cookie;` | |\n| `document.domain`\
    \ | 获取服务器的域名 | `document.domain` | `var y = document.domain;` | |\n| `document.links`\
    \ | 获取文档中所有带有 `href` 属性的 `<a>` 和 `<area>` 元素 | `document.links` | `var y = document.links.length;`\
    \ | |\n| `document.open()` | 打开文档 | `document.open (MIMEtype, replace)` | `document.open();\
    \ document.write(“<h1>Hello Earth</h1>”); document.close();` | |\n| `document.renameNode()`\
    \ | 重命名指定的节点 | `document.renameNode(node,namespaceURI,nodename)` | `var y = document.getElementsByTagName(“P”)[0];\
    \ document.renameNode(p, null, “h1”);` | |\n| `document.scripts` | 获取文档中的 `<script>`\
    \ 元素 | `document.scripts` | `var y = document.scripts.length;` | |\n| `document.title`\
    \ | 获取文档标题 | `document.title` | `var y = document.title;` | |\n| `document.URL`\
    \ | 获取 URL | `document.URL` | `var y = document.URL;` | |\n| `document.write()`\
    \ | 写入 HTML 表达式或 JavaScript 代码 | `document.write(exp1,exp2,exp3…)` | `document.write(“Hello\
    \ Earth”);` | |\n\n## HTML DOM\n\nHTML 文对象模型 (DOM) 是 HTML 和 XML 的标准对象模型和编程接口。它定义了文档的逻辑结构以及访问和操作它们的方式。可以使用\
    \ JavaScript 或其他编程语言访问和使用 DOM。所有 HTML 元素在 DOM 中都被定义为对象。提供了文档方法的示例：\n\n| 属性/方法\
    \ | 描述 | 语法 |\n| :--- | :--- | :--- |\n| `document.body` | 获取文档的主体 `<body>` |\
    \ `document.body` |\n\n"
