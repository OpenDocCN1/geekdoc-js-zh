    ## JavaScript Object Hierarchy


    When the user loads a document in a browser, JavaScript objects with property
    values based on the HTML in the document and other information are created. These
    objects exist in a hierarchy that is based on the structure of the HTML page.
    DOM made it possible to change a web page dynamically. Through DOM, the user can
    locate any element in the HTML document and use JavaScript to change the element’s
    properties. The DOM hierarchy is illustrated below:


    ![images/himg-8-1.png](images/00011.jpeg)


    ### Window Object


    The window object refers to an open window in a browser. It is used to open a
    web page in a new window and to set the attributes for the window. The two main
    window properties are:


    | Window Properties | Property | Value |

    | :--- | :--- |

    | Status | Sets the message for the status |

    | Self | Stores the name of the current window |


    ### Window Methods


    The window methods are used for opening and closing new windows. The main window
    methods are:


    | Window Methods | Method | Description |

    | :--- | :--- |

    | `alert()` | Displays a message box |

    | `confirm()` | Displays a confirmation box |

    | `prompt()` | Displays a prompt box |

    | `open()` | Opens a new window |

    | `close()` | Closes a window |


    ## JAVASCRIPT ARRAYS


    In JavaScript, an `array` is a special variable that can hold multiple values
    in a single variable. To create an array, an `array literal` is used.


    **Syntax:**


    ```

    var array-name = [item1, item2, ...];

    ```


    **Example:**


    ```

    var car = [“Toyota”, “Mazda”, “Isuzu”];

    ```


    Arrays use numbers to access elements. In the example below, `person[0]` returns
    Harry:


    **Example:**


    ```

    var person = [“Harry”, “Crawford”, 45]);

    ```


    ## JAVASCRIPT EVENTS


    Events refer to how feedback is elicited from the web user. Interaction with HTML
    is being handled through events that happen when the user interacts with the browser
    by clicking, loading, closing, resizing, or manipulating a web page. Events are
    a part of DOM Level 3 and every HTML element has a certain set of events which
    trigger a JavaScript code. Examples of these are included below:


    | Types of Events | Event | Description |

    | :--- | :--- | :--- |

    | `onblur` | Executed when the element loses focus |

    | `onchange` | Executed when the element changes |

    | `onclick` | Executed when an object is clicked |

    | `ondblclick` | Executed when an object is double-clicked |

    | `onfocus` | Executed when the element gets focus |

    | `onkeydown` | Executed when key is pressed |

    | `onkeypress` | Executed when key is pressed and released |

    | `onkeyup` | Executed when key is released |

    | `onmousedown` | Executed when mouse button is pressed |

    | `onmousemove` | Executed when mouse pointer moves |

    | `onmouseout` | Executed when mouse pointer moves out of an element |

    | `onmouseover` | Executed when mouse pointer moves over an element |

    | `onmouseup` | Executed when mouse button is released |

    | `onreset` | Executed when the form is reset |

    | `onselect` | Executed when the element is selected |

    | `onsubmit` | Executed when the form is submitted |


    ## AJAX AND CSS


    JavaScript can be used with AJAX and CSS.


    - **AJAX**: AJAX is short for **Asynchronous JavaScript** and XML. By updating
    a segment of the page without the need to reload the entire page, AJAX provides
    a much faster and easier way to create interactive web applications. It uses XHTML
    for the content, CSS for the style and presentation, and the Document Object Model
    and JavaScript for displaying dynamic content. To know more about AJAX, please
    visit this site:

    [https://developer.mozilla.org/en-US/docs/AJAX/Getting_Started](https://developer.mozilla.org/en-US/docs/AJAX/Getting_Started)


    - **CSS**: CSS stands for **Cascading Style Sheets**. A style sheet language that
    is used to specify how documents are presented.


    ## ONLINE RESOURCES


    **Mozilla Developer Network**

    [https://developer.mozilla.org/en-US/docs/JavaScript](https://developer.mozilla.org/en-US/docs/JavaScript)

    Resource for beginners and advanced users. This site contains official and complete
    JavaScript reference, including guides, tutorials and articles.


    **Eloquent JavaScript**

    [http://eloquentjavascript.net](http://eloquentjavascript.net)

    A free ebook by programmer and tech writer Marijn Haverbek. Fundamentals of JavaScript
    are taught, and includes mini exercises after chapter. This book covers how JavaScript
    works in a browser, as well as two chapters on Node.js.


    **Douglas Crockford’s JavaScript Videos**

    [http://javascript.crockford.com](http://javascript.crockford.com)

    Douglas Crockford is a Yahoo programmer and is instrumental in the planning, development
    and growth of JavaScript. On the website are Crockford’s videos and transcripts
    on the Yahoo User Interface blog.


    **WebPlatform.org**

    [http://docs.webplatform.org/wiki/javascript](http://docs.webplatform.org/wiki/javascript)

    This site contains documentations for learning programming languages such as HTML,
    CSS, and JavaScript.


    **Khan Academy**

    [https://www.khanacademy.org/computing/cs](https://www.khanacademy.org/computing/cs)

    A site where users can learn JavaScript to create drawings and animations through
    screencasts, code games, and create web pages with HTML and CSS.


    **Tutorials Point**

    [http://www.tutorialspoint.com/javascript/index.htm](http://www.tutorialspoint.com/javascript/index.htm)

    A comprehensive online resource, not only for JavaScript, but also for other technologies,
    such as SIP, Pay Per Click (PPC), Awk, HBase, XStream, Java8, Guava, Memcached,
