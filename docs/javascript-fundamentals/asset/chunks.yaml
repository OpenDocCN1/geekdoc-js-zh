    | | `A++` | `Result = 16` |

    | `--` | Decrement operator; decreases integer value by one | |

    | | `A--` | `Result = 14` |


    ## Assignment Operators


    | Operator | Description | Result |

    | :--- | :--- | :--- |

    | `=` | Simple assignment operator assigns values from right side operands to
    left side operand | |

    | | `C = A + B` | Assigns value of `A+B` into `C` |

    | `+=` | Add AND assignment operator adds right operand to the left operands and
    assigns the result to the left operand | |

    | | `C += A` | Equivalent to `C = C + A` |

    | `-=` | Subtract AND assignment operator subtracts right operand from left operand
    and assigns the result to the left operand | |

    | | `C -= A` | Equivalent to `C = C-A` |

    | `*=` | Multiply AND assignment operator multiplies right operand with the left
    operand and assigns the result to the left operand | |

    | | `C *= A` | Equivalent to `C = C * A` |

    | `/=` | Divide AND assignment operator divides left operand with the right operand
    and assigns the result to the left operand | |

    | | `C /= A` | Equivalent to `C = C / A` |

    | `%=` | Modulus AND assignment operator takes modulus using two operands and
    assigns the result to left operand | |

    | | `C %= A` | Equivalent to `C = C % A` |


    ## Bitwise Operators


    | Operator | Description | Given Variables A = 2 and B = 3 |

    | :--- | :--- | :--- |

    | `&` | Bitwise AND operator performs a Boolean AND operation on each bit of its
    integer arguments | |

    | | `(A & B)` | `Result = 2` |

    | `\|` | Bitwise OR operator performs a Boolean OR operation on each bit of its
    integer arguments | |

    | | `(A \| B)` | `Result = 3` |

    | `^` | Bitwise XOR operator performs a Boolean OR operation on each bit of its
    integer arguments | |

    | | `(A ^ B)` | `Result = 1` |

    | `~` | Bitwise NOT operator is a unary operator that reverses all bits in the
    operand | |

    | | `(~ B)` | `Result = -4` |

    | `<<` | Bitwise Shift Left operator moves all bits in its first operand to the
    left by the number of places specified in the second operand | |

    | | `A << 1` | `Result = 4` |

    | `>>` | Bitwise Shift Right operator moves all bits in its first operand to the
    right by the number of places specified in the second operand | |

    | | `A >> 1` | `Result = 1` |

    | `>>>` | Bitwise Shift Right with Zero operator; similar to the >> operator except
    that the bits shifted in on the left are always zero (0) | |

    | | `A >>> 1` | `Result = 1` |


    ## Comparison Operators


    | Operator | Description | Given Variables A = 15 and B = 30 |

    | :--- | :--- | :--- |

    | `==` | Checks if the value of two operands are equal or not; if yes, then the
    condition becomes true | |

    | | `(A == B)` | `Result = Not true` |

    | `!=` | Checks if the value of two operands are equal or not; if values are not
    equal then the condition becomes true | |

    | | `(A != B)` | `Result = True` |

    | `>` | Checks if the value of the left operand is greater than the value of the
    right operand, then the condition becomes true | |

    | | `(A > B)` | `Result = Not true` |

    | `<` | Checks if the value of the left operand is less than the value of the
    right operand, then the condition becomes true | |

    | | `(A <= B)` | `Result = True` |

    | `>=` | Checks if the value of the left operand is greater than or equal to the
    value of the right operand, then the condition becomes true | |

    | | `(A >= B)` | `Result = Not true` |

    | `<=` | Checks if the value of the left operand is less than or equal to the
    value of the right operand, then the condition becomes true | |

    | | `(A <= B)` | `Result = True` |


    ## Conditional Operators


    | Operator | Description |

    | :--- | :--- |

    | `?:` | Conditional expression |

    | | If Condition is true, then value = X, otherwise value =Y |


    ## Logical Operators


    | Operator | Description | Given Variables A = 15 and B = 30 |

    | :--- | :--- | :--- |

    | `&&` | Logical AND operator. If both the operands are non-zero, then the condition
    becomes true | |

    | | `(A && B)` | `Result = True` |

    | `\|\|` | Logical OR operators. If any of the two operands are non-zero, then
    the condition becomes true | |

    | | `(A \|\| B)` | `Result = True` |

    | `!` | Logical NOT operator. Use to reverse the logical state of its operand.
    If a condition is true, then the Logical NOT operator will make it false. | |

    | | `(A && B)` | `Result = False` |


    ## KEYWORDS AND COMMENTS


    ### JavaScript Keywords


    Keywords in JavaScript are utilized to identify actions to be performed. For example,
    the `var` keyword instructs the browser to create a new keyword:


    ```javascript

    var x = 1 + 2;

    var y = x * 15;

    ```


    ### Reserved Words


    In JavaScript, several identifiers are reserved words. These keywords cannot be
    used as variables, functions, methods, loop labels, or any object names when programming
    with JavaScript.


    | abstract | else | instanceof | switch |

    | : | : | | : | : : |

    | boolean | enum | int | synchronized |

    | break | export | interface | this |

    | byte | extends | long | throw |

    | case | false | native | throws |

    | catch | final | new | transient |

    | char | finally | null | true |

    | class | float | package | try |

    | const | for | private | typeof |

    | continue | function | protected | var |

    | debugger | goto | public | void |

    | default | if | return | volatile |

    | delete | implements | short | while |

    | do | import | static | with |

    | double | in | super | |


    ### Comments


    JavaScript supports C-, C++-, and HTML comments. Text entered between `//` and
    the end of a line is treated as a comment and is ignored by JavaScript. Another
    comment formatting recognized by JavaScript is the tag `/*`. Text that is entered
    between `/*` and `*/` (may span multiple lines) is ignored, as is the opening
    and closing tags `<!<!--` and `//-->`.


    **Example:**


    ![images/himg-6-1.png](images/00008.jpeg)


    #### Tips When Writing JavaScript


    * Line breaks are ignored except within a statement.

    * JavaScript is case sensitive—keywords, variables, function names, and other
    identifiers should use consistent capitalizaton.

    * White spaces between words and tabs are ignored.

    * JavaScript statements end with a semicolon, unless they are placed on a separate
    line.


    ## JAVASCRIPT DATA TYPES


    Data types are the classification of values based on the specific categories where
    they are stored. There are two types:


    * Primitive Types – refer to String, Boolean, Integer, Floating Point, Null, Void

    * Composite Types – refer to Object, Array, Function


    ### JavaScript Numeric


    | Type | Description |

    | :--- | :--- |

    | Integer | Positive or negative numerical values that have no fractional parts
    or decimal places |

    | Floating Point | Positive or negative numerical values that have a decimal point
    or exponential notations |

    | String | Characters or text surrounded by single or double quotes |

    | Boolean | Logical values True or False |

    | Null | Variable that does not have a value |

    | Casting | Moving the contents of a variable from one type to another |


    ### JavaScript String


    JavaScript strings are used for storing and manipulating text. The JavaScript
    string stores a series of characters like “study guides.” A string can be any
    text inside quotes. You can use single or double quotes. You can also use quotes
    inside a string, as long as they do not match the quotes surrounding the string.


