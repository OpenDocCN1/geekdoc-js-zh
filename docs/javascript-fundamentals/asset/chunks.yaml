  trans: "\n\n![](img/00013.jpeg)\n\n# 目录\n\n- 什么是 JAVASCRIPT？\n- 在网页中嵌入 JAVASCRIPT\n\
    - 核心术语\n- 操作 JAVASCRIPT\n- 值\n- 运算符\n- 关键字与注释\n- JAVASCRIPT 数据类型\n- 对象\n- HTML\
    \ DOM\n- JAVASCRIPT 对象层次结构\n- JAVASCRIPT 数组\n- JAVASCRIPT 事件\n- AJAX 与 CSS\n-\
    \ 在线资源\n\n![images/img-2-1.png](img/00001.jpeg)\n\n# JavaScript 基础\n\n## 什么是 JAVASCRIPT？\n\
    \nJavaScript 是一种跨平台的、解释性的、基于对象的脚本语言，它最初由网景通信公司（现为甲骨文公司）开发，用于为网站添加多媒体元素、动态页面和交互内容。JavaScript\
    \ 允许 Web 开发者动态更改网页的内容，还可以添加表单验证、处理图像、打开新窗口等许多功能。JavaScript 还可以用于获取有关浏览器浏览器和 HTML\
    \ 页面的信息。JavaScript 可以与样式表（CSS）结合使用创建动态 HTML。它被大多数互联网浏览器支持，并允许为网页添加交互功能。\n\n###\
    \ JavaScript 的两种类型\n\n- **客户端**\n    - 允许对网页和客户端浏览器进行增强处理\n    - 在客户端机器上进行解析和执行\n\
    - **服务端**（也称为 \"LiveWire”）\n    - 允许访问后端数据库、文件系统和服务器\n    - 存储并执行在服务器机器上\n\n###\
    \ JavaScript 与 Java\n\nJavaScript 并不是 Java 平台的一部分，它也不创建 Applet 或独立应用程序。它嵌入在 HTML\
    \ 文件中，为原本静态的 HTML 网页添加交互性。Java 是一种面向对象的编程语言，而 JavaScript 是一种基于对象的脚本语言。Java 创建运行在虚拟机或浏览器上的应用程序，而\
    \ JavaScript 代码仅在浏览器中运行。Java 代码需要编译，而 JavaScript 代码全以文本形式存在。两者都需要不同的插件。\n\n###\
    \ JavaScript 和 Java 的区别\n\n| JavaScript | Java |\n| :--- | :--- |\n| 由客户端解释（无需编译即可执行）\
    \ | 在服务器上编译 |\n| 基于对象 | 面向对象 |\n| 变量数据类型无需声明，动态绑定 | 变量数据类型应当声明，静态绑定 |\n| 动态绑定\
    \ | 静态绑定 |\n| 代码嵌入 HTML 中 | 代码仅在安装了 Java 平台的系统上运行 |\n\n**你你知道吗？**\n\n当网景通信公司在\
    \ 1995 年开发 JavaScript 时，它最初名为 Mocha，后来重命名为 LiveScript，因为它旨在用作类似于 PHP 的服务端语言。后来在\
    \ Netscape 3.0 中它被重命名为 JavaScript，这是一种营销手段，为了推广 Sun Microsystems 的 Java 编程语言。\n\
    \n### JavaScript 版本历史\n\n| 发布日期 | 版本 | 浏览器 | 备注 |\n| :--- | :--- | :--- | :---\
    \ |\n| 1996 | 1.0-1.1 | Netscape Navigator 2.0-3.0 和 Internet Explorer 2.0。 |\
    \ 添加了新对象，如数组、布尔、函数和数字 |\n| 1997 | 1.2 | Netscape Navigator 4.0-4.05 | 添加了函数内嵌套函数和正则表达式，以及使用字面量符号创建对象和数组的能力\
    \ |\n| 1998 | 1.3 | Netscape Navigator 4.06-4.7x | 支持 Unicode、JavaScript 控制台、对\
    \ `data.prototype` 方法的若干更改以及严格相等运算符 |\n| 1999 | 1.4 | 服务端 JavaScript | LiveConnect\
    \ 的更改，异常处理（`throw` 和 `try… catch`） |\n| 2000 | 1.5 | Netscape Navigator 6.0 和\
    \ Firefox 1.0 | 包含了符合 ECMA-262 第 3 版的标准化 |\n| 2005 | 1.6 | Firefox 1.5 | 包含用于\
    \ XML 的 JavaScript (E4X)，数组方法以及字符串和数组泛型 |\n| 2006 | 1.7 | Firefox 2 | 包含生成器、迭代器、数组推导式、let\
    \ 表达式和解构赋值 |\n| 2008 | 1.8 | Firefox 3 | 包含表达式闭包、生成器表达式、`array.prototype.reduce()`\
    \ 和 `array.prototype.reduceRight()` |\n| 2009 | 1.8.1-1.8.2 | Firefox 3.5-3.6\
    \ | 包含 TraceMonkey JIT 并支持原生 JSON |\n| 2010 | 1.8.5 | Firefox 4 | 包含了许多符合 ECMA-262\
    \ 第 5 版的新功能 |\n\n### JavaScript 的组成\n\n- **基础语法**：JavaScript 基于 ECMAScript 262\
    \ 标准，该标准定义了语言核心部分的工作原理。这包括如何定义变量、如何对这些变量进行计算、如何设置循环和函数以及如何定义对象。\n\n![images/himg-2-1.png](img/00002.jpeg)\n\
    \n- **文档对象模型 (DOM)**：定义了 JavaScript 如何与网页通信，以便从页面提取内容进行处理、添加内容或访问样式表以更改页面外观。\n\
    - **浏览器对象模型 (BOM)**：定义了脚本如何从浏览器获取信息并将信息传回浏览器。\n\n## 在网页中嵌入 JavaScript\n\n有两种方法可以在\
    \ HTML 文件中嵌入 JavaScript：\n\n### 步骤\n\n- 链接到扩展名为 `.js` 的外部文件\n    1. 在记事本或任何文本编辑器中输入以下代码并将其保存为\
    \ `FirstCode htm`\n       ![images/himg-2-2.png](img/00003.jpeg)\n    2. 在记事本或任何文本编辑器中输入以下代码并将其保存为\
    \ `MyFirstJavaScriptFile.js`\n       ![images/himg-2-3.png](img/00004.jpeg)\n\
    \    3. 打开你的网页浏览器（如 Internet Explorer、Mozilla Firefox 和 Google Chrome）查看结果：\n\
    \       ![images/himg-3-1.png](img/00005.jpeg)\n- 在 HTML 文档中使用 `<script>` 标签编写代码块\n\
    \    **步骤**\n    1. 将以下代码复制并粘贴到记事本或任何文本编辑器中，保存为 `FirstCode.htm`\n       ![images/himg-3-2.png](img/00006.jpeg)\n\
    \    2. 打开你的网页浏览器（如 Internet Explorer、Mozilla Firefox 和 Google Chrome）查看结果：\n\
    \       ![images/himg-3-3.png](img/00007.jpeg)\n\n## 核心术语\n\n| 术语 | 描述 | 术语 |\
    \ 描述 |\n| :--- | :--- | :--- | :--- |\n| 类 (Class) | 定义对象的特征 | 命名空间 (Namespace)\
    \ | 用于将所有功能封装在唯一的、特定应用程序名称下的容器 |\n| Cookie | 包含客户端信息的对象，服务器可以访问该信息 | 对象 (Objects)\
    \ | 指窗口、文档、图像、表格、表单、按钮或链接等 |\n| 事件 (Events) |发生在 Web 服务器、用户和浏览器之间交互背景下的事件 | 运算符\
    \ (Operators) | 用于处理变量 |\n| 表达式 (Expressions) | 为变量赋值的命令 | 属性 (Properties) | 指对象的属性\
    \ |\n| 函数 (Functions) | 执行任务并包含内置函数和用户定义函数的语句 | 值 (Values) | 指信息片段，如数字、字符串、布尔、null、对象和函数\
    \ |\n| 方法 (Methods) | 应用于特定对象的动作 | 变量 (Variables) | 内存中命名的位置，用于存储程序可以更改的值 |\n\n\
    ## 操作 JavaScript\n\n### 语句\n\nJavaScript 语句由值、运算符、表达式、关键字和注释组成。\n\n| 语句 | 描述 |\n\
    | :--- | :--- |\n| const | 定义一个只读**常量**，其值无法更改（与使用 `var` 的变量不同）。定义后不能重新声明。 |\n\
    \n```\nconst mysalary =3000 //开始（以字母或下划线开头，然后是字母）\n```\n\n"
- fmt: "\n| `var` | The `var` statement is used to explicitly declare a variable in\
    \ JavaScript. While technically it is not necessary to insert the `var` statement\
    \ in front of a variable to create it, it is a good programming practice. Once\
    \ a variable is declared, that variable can continue to be referenced without\
    \ including the `var` statement. |\n\n```javascript\nvar x=5\nx=x+10\n// (x now\
    \ contains 15)\n```\n\n| `with` | The `with` statement is a time-saving statement\
    \ to “cache” an object so that for `for` statements that follow it is no longer\
    \ necessary to reference the object again when referring to it. |\n\n```javascript\n\
    with (document form 1)[field1 value=”test” field 2 value=”test2”]\n```\n\n## Conditional\
    \ Statements\n\n| Statement | Description |\n| :--- | :--- |\n| `if` | Specifies\
    \ a block of code to be executed if the condition is true. |\n\n```html\n<html>\n\
    <body>\n<script type=\"text/javascript\">\nvar age=28;\nif (age > 18){document.write\
    \ (<<b>Qualifies for a driving license</b>>);}\n</script>\n</body>\n</html>\n\
    ```\n**Result:** Qualifies for a driving license\n\n| `if/else` | Specifies a\
    \ new condition to test if the first condition is false. |\n\n```html\n<html>\n\
    <body>\n<script type=\"text/javascript\">\nvar age=17; \nif (age > 18){document.write\
    \ (<<b>Qualifies for a driving license</b>>);}\nelse {document.write (<<b>Does\
    \ not qualify for a driving license</b>>);}\n</script>\n</body>\n</html>\n```\n\
    **Result:** Qualifies for a driving license or does not qualify for a driving\
    \ license\n\n| `switch`, `case`, `break`, `default` | “**Switch**” executes a\
    \ different statement depending on the value of an expression. “**Break**” is\
    \ an optional statement that instructs “switch” to exit should the preceding statement\
    \ be executed. “**Default**” instructs the statement to execute if none of the\
    \ statements are executed. |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nvar grade=’A’;\ndocument.write (“Entering switch block=<br/>);\nswitch (grade)\n\
    {\ncase ‘A’: document.write(“Excellent<br/>);break;\ncase ‘B’ document.write(“Good<br/>);break;\n\
    case ‘C’ document.write(“Average<br/>);break;\ncase ‘D’ document.write(“Below\
    \ average<br/>);break;\ncase ‘F’ document.write(“Poor<br/>);break;\ndefault: document.write(“No\
    \ grade<br/>);break; \n}\ndocument.write (“Exiting switch block);\n</script>\n\
    </body>\n</html>\n```\n**Result:** Entering switch block/ Excellent/ Exiting switch\
    \ block\n\n| `?:` | “`?:`” or the conditional operator is used for constructing\
    \ an evaluation and executing two different assignments depending on the result.\
    \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar a = 15;\n\
    var b = 30;\nvar linebreak = “<br />”;\ndocument.write (“((a > b) ? 150 : 300)\
    \ => “);\nresult = (a > b) ? 150 : 300;\ndocument.write (result);\ndocument.write\
    \ (linebreak);\ndocument.write (“((a < b) ? 150 : 300) => “);\nresult = (a < b)\
    \ ? 150 : 300;\ndocument.write (result);\ndocument.write (linebreak);\n</script>\n\
    </body>\n</html>\n```\n**Result:** ((a > b) ? 150 : 300) => 300 ((a < b) ? 150\
    \ : 300) => 150\n\n| `return` | “**Return**” exits a function and optionally returns\
    \ a value. It is used inside functions. |\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nfunction concatenate(first, last)\n{\nvar full;\n\
    full = first + last;\nreturn full;\n}\nfunction secondFunction()\n{\nvar result;\n\
    result = concatenate (‘Book’, ‘Dog’);\nalert(result );\n}\n</script>\n</head>\n\
    <body>\n<p>Click the following button to call the function</p>\n<form>\n<input\
    \ type=\"button\" onclick=”secondFunction()” value=”Call Function”>\n</form>\n\
    </body>\n</html>\n```\n**Result:** BookDog\n\n## Looping Statements\n\n| Statement\
    \ | Description |\n| :--- | :--- |\n| `for` | The statement `**for**` executes\
    \ the enclosed statements multiple times based on three conditions **initial**,\
    \ **limit**, and **increment** defined inside the `for` parenthesis `()`. |\n\n\
    ```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar count;\ndocument.write\
    \ (“Start Loop…”+”<br/>);\nfor(count=0;count=6; count++)\n{\ndocument.write(“Current\
    \ Count :”+ count );\na document.write(<br/>);}\n}\ndocument.write(“…End loop!”);\n\
    </script>\n</body>\n</html>\n```\n\n| `while` | A ****while** loop continuously\
    \ executes the enclosed statements as long as the tested expression evaluates\
    \ to true. If the expression is false, the entire `while` loop is skipped. |\n\
    \n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar count = 0;\n\
    document.write(“Start loop...”);\nwhile (count < 6){\ndocument.write(“Current\
    \ Count : “ + count + “<br />”);\ncount++;\n}\ndocument.write(“... End loop!”);\n\
    </script>\n</body>\n</html>\n```\n\n| `do/while` | This statement differs from\
    \ the standard ****while** statement in that the expression tested for is placed\
    \ at the end, ensuring that a ****do/while** loop is always executed at least\
    \ once. |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\n<!--\n\
    var count = 1;\ndocument.write (“Starting Loop” + “<br />”);\ndo{\ndocument.write\
    \ (“Current Count : “ + count + “<br />”);\ncount++;\n}while (count < 0);\ndocument.write(“Loop\
    \ stopped!”);\n//-->\n</script>\n</body>\n</html>\n```\n\n| `for/in` | Loops through\
    \ the properties of an object; applies to built-in or custom objects. |\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nvar aProperty;\ndocument.write\
    \ (“Object<br/>);\nfor (aProperty in Navigator)\n{\ndocument.write(aProperty);\n\
    }\ndocument.write (“End loop”);\n</script>\n</body>\n</html>\n```\n\n| `break`\
    \ | Causes an exit of the innermost loop. |\n\n```html\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\nvar x = 0;\ndocument.write (“Start loop...”);\nwhile\
    \ (x < 20)\n{\nif (x == 5){\nbreak; // out of loop\n}\nx = x + 1;\n}\ndocument.write\
    \ (“End loop”);\n</script>\n</body>\n</html>\n```\n\n| `continue` | Causes JavaScript\
    \ to skip the rest of the statements that follow, and continue with the next iteration.\
    \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar x = 0;\n\
    document.write (“Start loop...”);\nwhile (x < 6)\n{\nif (x == 5){\ncontinue; //\
    \ rest of the loop\n}\nx = x + 1;\n}\ndocument.write (“End loop”);\n</script>\n\
    </body>\n</html>\n```\n\n## VALUES\n\nThe two types of **values** used in JavaScript\
    \ syntax are fixed and variable.\n\n*   **Literals:** Fixed values are called\
    \ **literals**. In JavaScript, numeric values are written with or without decimals\
    \ such as:\n    9.5\n    9\n    text strings are written either with double or\
    \ single quotes such as\n    study guide”\n    Harvard University’\n    Fixed\
    \ values can also refer to expressions written as:\n    5 + 7\n    5 * 7\n\n*\
    \   **Variables:** Non-fixed values are called **variables**, which used to store\
    \ values. In JavaScript, the keyword `var` is used to define variables. The equal\
    \ sign (=) is used to assign values to variables such as:\n    `var myName = “John”`\n\
    \n## Operators\n\nAn **operator** acts on a variable and changes its value. JavaScript\
    \ language supports the following type of operators: arithmetic, assignment, bitwise,\
    \ comparison, conditional, and logical.\n\n| **Arithmetic Operators** |\n\n| **Operator**\
    \ | **Description** | **Given Variables** A = **15** and B = **30** |\n"
