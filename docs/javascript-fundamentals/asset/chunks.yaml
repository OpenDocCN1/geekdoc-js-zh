    **Code Combat**

    [https://codecombat.com/](https://codecombat.com/)

    An interactive site to quickly learn programming such as JavaScript or Python.
    It is a live coding strategy game for beginners.


    **JS Fiddle**

    [http://jsfiddle.net/](http://jsfiddle.net/)

