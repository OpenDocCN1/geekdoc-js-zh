    \n![images/img-2-1.png](images/00001.jpeg)\n\n# JavaScript Fundamentals\n\n##\
    \ WHAT IS JAVASCRIPT?\n\nJavaScript is a cross-platform, interpreted, object-based\
    \ scripting language originally developed by Netscape Communications Corporation\
    \ (now Oracle Corporation) to add multimedia elements, dynamic pages, and interactive\
    \ content to a website. JavaScript allows web developers to dynamically change\
    \ the content of a web page, as well as add form validation, manipulate images,\
    \ open new windows, and much more. JavaScript can also be used to get information\
    \ about the Internet browser and HTML page. JavaScript can be used together with\
    \ Cascading Style Sheets to create Dynamic HTML. It is supported by most Internet\
    \ browsers and enables interactive functions to be added to web pages.\n\n###\
    \ Two Types of JavaScript\n\n- **Client-side**\n    - Enables enhancement and\
    \ manipulation of web pages and client browsers\n    - Parsed and executed on\
    \ client machine\n- **Server-side** (also known as \"LiveWire\")\n    - Enables\
    \ back-end access to databases, file systems, and servers\n    - Stored and executed\
    \ on server machine\n\n### JavaScript versus Java\n\nJavaScript is not part of\
    \ the Java platform, nor does it create applets or standalone applications. It\
    \ is embedded inside HTML files and adds interactivity to otherwise static HTML\
    \ web pages. Java is an object-oriented programming language while JavaScript\
    \ is an object-based scripting language. Java creates applications that run on\
    \ a virtual machine or browser while JavaScript code is run on a browser only.\
    \ Java code needs to be compiled while JavaScript code is all in text. Both require\
    \ different plug-ins.\n\n### Differences between JavaScript and Java\n\n| JavaScript\
    \ | Java |\n| :--- | :--- |\n| Interpreted by client (executes without compiling)\
    \ | Compiled on server |\n| Object-based | Object-oriented |\n| Variable data\
    \ types are not declared Dynamic binding | Variable data types should be declared\
    \ Static binding |\n| Dynamic binding | Static binding |\n| Code embedded in HTML\
    \ | Code runs only on systems with installed Java platform |\n\n**Did you know?**\n\
    \nWhen JavaScript was developed by Netscape Communications Corporation back in\
    \ 1995, it was originally named Mocha, then renamed to LiveScript since it was\
    \ intended to be used as a server-side language similar to PHP. It was later renamed\
    \ to JavaScript in Netscape 3.0 as a marketing move in order to promote Sun Microsystems’\
    \ programming language called Java.\n\n### JavaScript Version History\n\n| Release\
    \ Date | Version | Browser | Remarks |\n| :--- | :--- | :--- | :--- |\n| 1996\
    \ | 1.0-1.1 | Netscape Navigator 2.0-3.0 and Internet Explorer 2.0. | Added new\
    \ objects such as array, Boolean, function, and number |\n| 1997 | 1.2 | Netscape\
    \ Navigator 4.0-4.05 | Added ability to nest functions within functions and regular\
    \ expressions, as well as ability to create objects and arrays using literal notation\
    \ |\n| 1998 | 1.3 | Netscape Navigator 4.06-4.7x | Includes Unicode support, JavaScript\
    \ console, several changes to `data.prototype` methods, and strict equality operators\
    \ |\n| 1999 | 1.4 | Server-side JavaScript | Changes to LiveConnect, exception\
    \ handling (`throw` and `try… catch`) |\n| 2000 | 1.5 | Netscape Navigator 6.0\
    \ and Firefox 1.0 | Included standardization for ECMA-262 3^(rd) Edition compliance\
    \ |\n| 2005 | 1.6 | Firefox 1.5 | Includes ECMAScript for XML (E4X), Array methods\
    \ plus string and array generics |\n| 2006 | 1.7 | Firefox 2 | Includes generators,\
    \ iterators, array comprehensions, let expressions, and destructuring assignment\
    \ |\n| 2008 | 1.8 | Firefox 3 | Includes expression closures, generator expressions,\
    \ `array.prototype.reduce()`, and `array.prototype.reduceRight()` |\n| 2009 |\
    \ 1.8.1-1.8.2 | Firefox 3.5-3.6 | Includes the TraceMonkey JIT and supports native\
    \ JSON |\n| 2010 | 1.8.5 | Firefox 4 | Includes many new features for ECMA-262\
    \ Edition 5 compliance |\n\n### Parts of JavaScript\n\n- **Basic Syntax**: JavaScript\
    \ is based on the ECMAScript 262 standard, which defines how the core part of\
    \ the language works. This includes the definition of how variables are defined,\
    \ how calculations on those variables are performed, how loops and functions are\
    \ set up, and how objects are defined.\n\n![images/himg-2-1.png](images/00002.jpeg)\n\
    \n- **Document Object Model**: Defines how JavaScript communicates with a web\
    \ page to extract content from the page for processing, adding content, or accessing\
    \ the stylesheet to change the appearance of a page.\n- **Browser Object Model**:\
    \ Defines how the scripts obtain information from the browser and pass information\
    \ back to it.\n\n## EMBEDDING JAVASCRIPT IN A WEB PAGE\n\nThere are two ways to\
    \ embed JavaScript in an HTML file:\n\n### Steps\n\n- Link to external file(s)\
    \ with the file extension `.js`\n    1. Enter the following code to notepad or\
    \ any text editor and then save it as `FirstCode htm`\n       ![images/himg-2-2.png](images/00003.jpeg)\n\
    \    2. Enter the following code to notepad or any text editor and then save it\
    \ as `MyFirstJavaScriptFile.js`\n       ![images/himg-2-3.png](images/00004.jpeg)\n\
    \    3. Open your web browser, such as Internet Explorer, Mozilla Firefox, and\
    \ Google Chrome, to see the result:\n       ![images/himg-3-1.png](images/00005.jpeg)\n\
    - Write blocks of code in HTML documents with the `<script>` tag\n    **Steps**\n\
    \    1. Copy and paste the following code to notepad or any text editor and save\
    \ it as `FirstCode.htm`\n       ![images/himg-3-2.png](images/00006.jpeg)\n  \
    \  2. Open your web browser, such as Internet Explorer, Mozilla Firefox, and Google\
    \ Chrome, to see the result:\n       ![images/himg-3-3.png](images/00007.jpeg)\n\
    \n## KEY TERMS\n\n| Terms | Description | Terms | Description |\n| :--- | :---\
    \ | :--- | :--- |\n| Class | Defines the characteristics of an object | Namespace\
    \ | A container which is used to bundle all functionality under a unique, application-specific\
    \ name |\n| Cookie | An object containing information about the client that can\
    \ be accessed by the server | Objects | Refers to windows, documents, images,\
    \ tables, forms, buttons or links, etc. |\n| Events | Occurrences that happen\
    \ in the context of the interaction between the web server, user and the browser\
    \ | Operators | Used to handle variables |\n| Expressions | Commands that assign\
    \ values to variables | Properties | Refers to object attributes |\n| Functions\
    \ | Statements that perform tasks and include built-in and user-defined functions\
    \ | Values | Refers to bits of information, such as number, string, boolean, null,\
    \ object, and function |\n| Methods | Actions applied to particular objects |\
    \ Variables | A named location in memory that is used to hold a value that can\
    \ be changed by the program |\n\n## WORKING WITH JAVASCRIPT\n\n### Statements\n\
    \nJavaScript statements consist of values, operators, expressions, keywords, and\
    \ comments.\n\n| Statement | Description |\n| :--- | :--- |\n| const | Defines\
    \ a read-only **constant** whose value cannot be changed (unlike a variable using\
    \ `var`). It also cannot be re-declared once initially defined. |\n\n```\nconst\
    \ mysalary =3000 //start (with a letter or underscore, then alphabetic)\n```\n"
