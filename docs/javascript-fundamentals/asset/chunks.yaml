    | \O | Null character |


    | \r | Carriage return |


    | \t | Horizontal tab |


    | \v | Vertical tab |


    | \’ | Single quote or apostrophe |


    | \” | Double quote |


    | \\ | Backslash |


    | \ddd | The Latin-1 character specified by the three octal digits between 0 and
    377\. i.e. copyright symbol is \251 |


    | \xdd | The Latin-1 character specified by the two hexadecimal digits dd between
    00 and FF. i.e. copyright symbol is \xA9 |


    | \udddd | The Unicode character specified by the four hexadecimal digits dddd.
    i.e. copyright symbol is \u00A9 |


    ### JavaScript Boolean


    Boolean (15 >10) // returns true


    (5>10) 1 ………// returns true


    11>10…… …….// returns true


    Extra large or extra small numbers can be written with scientific (exponent) notation:


    var x = 124e5; // 12400000


    var y = 124e-5; // 0.00124


    ### JavaScript Numbers


    JavaScript has only one type of number. Numbers can be written with or without
    the decimal point such as:


    var x – 39.00 // A number with a decimal point


    var y = 39…// A number without a decimal point


    **Tip On Numbers**


    *   Numbers always use 64-bit floating point.


    *   Unlike many other programming languages, JavaScript does not define defferent
    types of numbers, such as integers, short, long, floating point, etc.


    *   JavaScript numbers are always stored as double precision floating point numbers,
    following the international IEEE 754 standard.


    ### JavaScript Null


    Null is considered something without value, nothing, or simply does not exist.
    In JavaScript, the data type of null is an object. An object can be emptied by
    setting it to null, like this:


    var person = null; // Value is null, but type is still an object


    ### JavaScript Void


    The void keyword in JavaScript is used as a unary operator that appears before
    its single operand. This operator specifies an expression to be evaluated without
    returning a value.


    <html>


    <head>


    <script type="text/javascript">


    </script>


    </head>


    <body>


    <p>Please click the following, This won''t affect me at


    all...</p>


    <a href="javascript:void(alert(0))">Please click me!</a>


    </body>


    </html>


    The above script produces the following result when the **Please click me** link
    is clicked:


    ![images/himg-7-1.png](images/00009.jpeg)


    ### Composite Types


    **Functions**


    A function is a block of JavaScript code that performs a specific task whenever
    it is executed or invoked. It is defined with the **function keyword,** followed
    by the function name and parenthesis ( ). It may contain letters, digits, underscore
    symbol, and dollar signs. The parentheses may include parameter names separated
    by commas such as parameter1, parameter2, etc. The code to be executed is placed
    inside the curly brackets { }.


    ![images/himg-7-2.png](images/00010.jpeg)


    **Example:**


    function convertDataToCentrigrade (degFarenheit)


    {


    var degCentigrade;


    degCentigrade = 5/9 * (degFarenheit – 32);


    return degCentigrade;


    }


    ## OBJECTS


    Objects are composite data types that contain properties and methods. Screen elements
    such as web pages, text boxes, forms, buttons, and images are considered as objects.
    In JavaScript, all values, except **primitive values**, are considered as objects.


    Properties define the characteristics of an object.


    ### Properties


    | **Object Properties** |


    | **Property** | **Value** |


    | firstName | Clark |


    | lastName | Mays |


    | age | 18 |


    | eyeColor | Green |


    ### Methods


    Actions that can be performed on objects are called **methods**. An **object method**
    is an object property containing a function definition.


    | **Object Methods** |


    | **Property** | **Value** |


    | firstName | Clark |


    | lastName | Mays |


    | age | 18 |


    | eyeColor | Green |


    | fullName | function() {


    return this.firstName + “ “ + this.


    lastName;


    } |


