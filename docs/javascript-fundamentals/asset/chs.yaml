- "# JavaScript 入门指南\n\n\n\n![](img/00013.jpeg)\n\n\n![images/img-2-1.png](img/00001.jpeg)\n\
  \n# JavaScript 基础\n\n## 什么是 JAVASCRIPT？\n\nJavaScript 是一种跨平台的、解释性的、基于对象的脚本语言，它最初由网景通信公司（现为甲骨文公司）开发，用于为网站添加多媒体元素、动态页面和交互内容。JavaScript\
  \ 允许 Web 开发者动态更改网页的内容，还可以添加表单验证、处理图像、打开新窗口等许多功能。JavaScript 还可以用于获取有关浏览器浏览器和 HTML\
  \ 页面的信息。JavaScript 可以与样式表（CSS）结合使用创建动态 HTML。它被大多数互联网浏览器支持，并允许为网页添加交互功能。\n\n### JavaScript\
  \ 的两种类型\n\n- **客户端**\n    - 允许对网页和客户端浏览器进行增强处理\n    - 在客户端机器上进行解析和执行\n- **服务端**（也称为\
  \ \"LiveWire”）\n    - 允许访问后端数据库、文件系统和服务器\n    - 存储并执行在服务器机器上\n\n### JavaScript 与\
  \ Java\n\nJavaScript 并不是 Java 平台的一部分，它也不创建 Applet 或独立应用程序。它嵌入在 HTML 文件中，为原本静态的 HTML\
  \ 网页添加交互性。Java 是一种面向对象的编程语言，而 JavaScript 是一种基于对象的脚本语言。Java 创建运行在虚拟机或浏览器上的应用程序，而\
  \ JavaScript 代码仅在浏览器中运行。Java 代码需要编译，而 JavaScript 代码全以文本形式存在。两者都需要不同的插件。\n\n### JavaScript\
  \ 和 Java 的区别\n\n| JavaScript | Java |\n| :--- | :--- |\n| 由客户端解释（无需编译即可执行） | 在服务器上编译\
  \ |\n| 基于对象 | 面向对象 |\n| 变量数据类型无需声明，动态绑定 | 变量数据类型应当声明，静态绑定 |\n| 动态绑定 | 静态绑定 |\n|\
  \ 代码嵌入 HTML 中 | 代码仅在安装了 Java 平台的系统上运行 |\n\n**你你知道吗？**\n\n当网景通信公司在 1995 年开发 JavaScript\
  \ 时，它最初名为 Mocha，后来重命名为 LiveScript，因为它旨在用作类似于 PHP 的服务端语言。后来在 Netscape 3.0 中它被重命名为\
  \ JavaScript，这是一种营销手段，为了推广 Sun Microsystems 的 Java 编程语言。\n\n### JavaScript 版本历史\n\
  \n| 发布日期 | 版本 | 浏览器 | 备注 |\n| :--- | :--- | :--- | :--- |\n| 1996 | 1.0-1.1 | Netscape\
  \ Navigator 2.0-3.0 和 Internet Explorer 2.0。 | 添加了新对象，如数组、布尔、函数和数字 |\n| 1997 | 1.2\
  \ | Netscape Navigator 4.0-4.05 | 添加了函数内嵌套函数和正则表达式，以及使用字面量符号创建对象和数组的能力 |\n| 1998\
  \ | 1.3 | Netscape Navigator 4.06-4.7x | 支持 Unicode、JavaScript 控制台、对 `data.prototype`\
  \ 方法的若干更改以及严格相等运算符 |\n| 1999 | 1.4 | 服务端 JavaScript | LiveConnect 的更改，异常处理（`throw`\
  \ 和 `try… catch`） |\n| 2000 | 1.5 | Netscape Navigator 6.0 和 Firefox 1.0 | 包含了符合\
  \ ECMA-262 第 3 版的标准化 |\n| 2005 | 1.6 | Firefox 1.5 | 包含用于 XML 的 JavaScript (E4X)，数组方法以及字符串和数组泛型\
  \ |\n| 2006 | 1.7 | Firefox 2 | 包含生成器、迭代器、数组推导式、let 表达式和解构赋值 |\n| 2008 | 1.8 | Firefox\
  \ 3 | 包含表达式闭包、生成器表达式、`array.prototype.reduce()` 和 `array.prototype.reduceRight()`\
  \ |\n| 2009 | 1.8.1-1.8.2 | Firefox 3.5-3.6 | 包含 TraceMonkey JIT 并支持原生 JSON |\n\
  | 2010 | 1.8.5 | Firefox 4 | 包含了许多符合 ECMA-262 第 5 版的新功能 |\n\n### JavaScript 的组成\n\
  \n- **基础语法**：JavaScript 基于 ECMAScript 262 标准，该标准定义了语言核心部分的工作原理。这包括如何定义变量、如何对这些变量进行计算、如何设置循环和函数以及如何定义对象。\n\
  \n![images/himg-2-1.png](img/00002.jpeg)\n\n- **文档对象模型 (DOM)**：定义了 JavaScript 如何与网页通信，以便从页面提取内容进行处理、添加内容或访问样式表以更改页面外观。\n\
  - **浏览器对象模型 (BOM)**：定义了脚本如何从浏览器获取信息并将信息传回浏览器。\n\n## 在网页中嵌入 JavaScript\n\n有两种方法可以在\
