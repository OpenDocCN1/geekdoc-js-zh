  \    **步骤**\n    1. 将以下代码复制并粘贴到记事本或任何文本编辑器中，保存为 `FirstCode.htm`\n       ![images/himg-3-2.png](img/00006.jpeg)\n\
  \    2. 打开你的网页浏览器（如 Internet Explorer、Mozilla Firefox 和 Google Chrome）查看结果：\n  \
  \     ![images/himg-3-3.png](img/00007.jpeg)\n\n## 核心术语\n\n| 术语 | 描述 | 术语 | 描述 |\n\
  | :--- | :--- | :--- | :--- |\n| 类 (Class) | 定义对象的特征 | 命名空间 (Namespace) | 用于将所有功能封装在唯一的、特定应用程序名称下的容器\
  \ |\n| Cookie | 包含客户端信息的对象，服务器可以访问该信息 | 对象 (Objects) | 指窗口、文档、图像、表格、表单、按钮或链接等 |\n\
  | 事件 (Events) |发生在 Web 服务器、用户和浏览器之间交互背景下的事件 | 运算符 (Operators) | 用于处理变量 |\n| 表达式\
  \ (Expressions) | 为变量赋值的命令 | 属性 (Properties) | 指对象的属性 |\n| 函数 (Functions) | 执行任务并包含内置函数和用户定义函数的语句\
  \ | 值 (Values) | 指信息片段，如数字、字符串、布尔、null、对象和函数 |\n| 方法 (Methods) | 应用于特定对象的动作 | 变量\
  \ (Variables) | 内存中命名的位置，用于存储程序可以更改的值 |\n\n## 操作 JavaScript\n\n### 语句\n\nJavaScript\
  \ 语句由值、运算符、表达式、关键字和注释组成。\n\n| 语句 | 描述 |\n| :--- | :--- |\n| const | 定义一个只读**常量**，其值无法更改（与使用\
  \ `var` 的变量不同）。定义后不能重新声明。 |\n\n```\nconst mysalary =3000 //开始（以字母或下划线开头，然后是字母）\n\
  ```\n\n\n\n\n\n| `var` | `var` 语句用于在 JavaScript 中显式声明变量。虽然从技术上讲，并不非在变量前面插入 `var`\
  \ 语句来创建它，但这是一种良好的编程习惯。一旦声明了变量，就可以继续引用该变量而无需包含 `var` 语句。 |\n\n```javascript\nvar\
  \ x=5\nx=x+10\n// (x now contains 15)\n```\n\n| `with` | `with` 语句是一种节省时间的语句，用于“缓存”对象，这样在随其后的\
  \ `for` 语句中，引用该对象时不再需要再次引用它。 |\n\n```javascript\nwith (document form 1)[field1 value=”test”\
  \ field 2 value=”test2”]\n```\n\n### 条件语句\n\n| 语句 | 描述 |\n| :--- | :--- |\n| `if`\
  \ | 如果条件为真，则执行指定的代码块。 |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
  >\nvar age=28;\nif (age > 18){document.write (<<b>Qualifies for a driving license</b>>);}\n\
  </script>\n</body>\n</html>\n```\n**Result：** 具备驾照资格\n\n| `if/else` | 如果第一个条件为假，则指定一个新条件进行测试。\
  \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar age=17; \n\
  if (age > 18){document.write (<<b>Qualifies for a driving license</b>>);}\nelse\
  \ {document.write (<<b>Does not qualify for a driving license</b>>);}\n</script>\n\
  </body>\n</html>\n```\n**Result：** 驾照资格或不具备驾照资格\n\n| `switch`, `case`, `break`,\
  \ `default` | “**Switch**”根据表达式的值执行不同的语句。“**Break**”是一个可选语句，如果执行了先前的语句，它将指示“switch”退出。“**Default**”在没有语句被执行时，指令语句执行相应的默认操作。\
  \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar grade=’A’;\n\
  document.write (“Entering switch block=<br/>);\nswitch (grade)\n{\ncase ‘A’: document.write(“Excellent<br/>);break;\n\
  case ‘B’ document.write(“Good<br/>);break;\ncase ‘C’ document.write(“Average<br/>);break;\n\
  case ‘D’ document.write(“Below average<br/>);break;\ncase ‘F’ document.write(“Poor<br/>);break;\n\
  default: document.write(“No grade<br/>);break; \n}\ndocument.write (“Exiting switch\
  \ block);\n</script>\n</body>\n</html>\n```\n**Result：** Entering switch block/\
  \ Excellent/ Exiting switch block\n\n| `?:` | “`?:`”或条件运算符用于构建一个评估并根据结果执行两个不同的赋值。\
  \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar a = 15;\n\
  var b = 30;\nvar linebreak = “<br />”;\ndocument.write (“((a > b) ? 150 : 300) =>\
  \ “);\nresult = (a > b) ? 150 : 300;\ndocument.write (result);\ndocument.write (linebreak);\n\
  document.write (“((a < b) ? 150 : 300) => “);\nresult = (a < b) ? 150 : 300;\ndocument.write\
  \ (result);\ndocument.write (linebreak);\n</script>\n</body>\n</html>\n```\n**Result：**\
  \ ((a > b) ? 150 : 300) => 300 ((a < b) ? 150 : 300) => 150\n\n| `return` | “**Return**”退出函数并可选地返回一个值。它用在函数内部。\
  \ |\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction concatenate(first,\
  \ last)\n{\nvar full;\nfull = first + last;\nreturn full;\n}\nfunction secondFunction()\n\
  {\nvar result;\nresult = concatenate (‘Book’, ‘Dog’);\nalert(result );\n}\n</script>\n\
  </head>\n<body>\n<p>点击下方按钮调用函数</p>\n<form>\n<input type=\"button\" onclick=”secondFunction()”\
  \ value=”Call Function”>\n</form>\n</body>\n</html>\n```\n**Result：** BookDog\n\n\
  ### 循环语句\n\n| 语句 | 描述 |\n| :--- | :--- |\n| `for` | `**for**` 语句根据 `for` 括号 `()`\
  \ 内定义的三个条件**初始化 (initial)**、**限制 (limit)** 和**增量 (increment)**，多次执行包含的语句。 |\n\n\
  ```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar count;\ndocument.write\
  \ (“Start Loop…”+”<br/>);\nfor(count=0;count=6; count++)\n{\ndocument.write(“Current\
  \ Count :”+ count );\na document.write(<br/>);}\n}\ndocument.write(“…End loop!”);\n\
  </script>\n</body>\n</html>\n```\n\n| `while` | 只要测试的表达式为真，***循环就会持续执行包含的语句。如果表达式为假，则跳过整个\
  \ `while` 循环。 |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\n\
  var count = 0;\ndocument.write(“Start loop...”);\nwhile (count < 6){\ndocument.write(“Current\
  \ Count : “ + count + “<br />”);\ncount++;\n}\ndocument.write(“... End loop!”);\n\
  </script>\n</body>\n</html>\n```\n\n| `do/while` | 该语句与标准的***while** 语句的区别在于，测试的表达式被放在末尾，确保***do/while**\
  \ 循环至少执行一次。 |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\n<!--\n\
  var count = 1;\ndocument.write (“Starting Loop” + “<br />”);\ndo{\ndocument.write\
  \ (“Current Count : “ + count + “<br />”);\ncount++;\n}while (count < 0);\ndocument.write(“Loop\
  \ stopped!”);\n//-->\n</script>\n</body>\n</html>\n```\n\n| `for/in` | 遍历对象的属性；适用于内置对象或自定义对象。\
  \ |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar aProperty;\n\
  document.write (“Object<br/>);\nfor (aProperty in Navigator)\n{\ndocument.write(aProperty);\n\
  }\ndocument.write (“End loop”);\n</script>\n</body>\n</html>\n```\n\n| `break` |\
  \ 退出最内层循环。 |\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\">\nvar\
  \ x = 0;\ndocument.write (“Start loop...”);\nwhile (x < 20)\n{\nif (x == 5){\nbreak;\
  \ // 跳出循环\n}\nx = x + 1;\n}\ndocument.write (“End loop”);\n</script>\n</body>\n\
  </html>\n```\n\n| `continue` | 使 JavaScript 跳过后续的所有语句，并继续下次迭代。 |\n\n```html\n<html>\n\
  <body>\n<script type=\"text/javascript\">\nvar x = 0;\ndocument.write (“Start loop...”);\n\
  while (x < 6)\n{\nif (x == 5){\ncontinue; // 循环剩余语句\n}\nx = x + 1;\n}\ndocument.write\
  \ (“End loop”);\n</script>\n</body>\n</html>\n```\n\n### 值\n\nJavaScript 语法中使用的两种**值**是固定值和变量值。\n\
  \n*   **字面量：** 固定值被称为**字面量**。在 JavaScript 中，数值可以带有或不带有小数，例如：\n    9.5\n    9\n \
  \   文本字符串可以使用双引号或单引号编写，例如\n    study guide”\n    Harvard University’\n    固定值也可以指向表达式，如：\n\
  \    5 + 7\n    5 * 7\n\n*   **变量：** 非固定值被称为**变量**，用于存储值。在 JavaScript 中，使用 `var`\
  \ 关键字定义变量。等号 (=) 用于为变量赋值，例如：\n    `var myName = “John”`\n\n### 运算符\n\n**运算符**作用于变量并改变其值。JavaScript\
  \ 语言支持以下类型的运算符：算术、赋值、位运算、比较、条件和逻辑。\n\n| **算术运算符** |\n\n| **运算符** | **描述** | **给定变量**\
  \ A = **15** 和 B = **30** |\n\n\n\n\n\n| 运算符 | 说明 | 结果 |\n| :--- | :--- | :--- |\n\
  | `+` | 将两个操作数相 | |\n| | `A + B` | `Result = 45` |\n| `-` | 从第一个操作数中减去第二个操作数 | |\n\
  | | `A - B` | `Result = -15` |\n| `*` | 两个操作数乘 | |\n| | `A * B` | `Result = 450`\
  \ |\n| `/` | 被除数除以除数 | |\n| | `B / A` | `Result = 2` |\n| `%` | 取模运算符；找到一个数除以另一个数的余数\
  \ | |\n| | `B % A` | `Result = 0` |\n| `++` | 增增运算符；将整数值加一 | |\n| | `A++` | `Result\
  \ = 16` |\n| `--` | 减减运算符；将整数值减一 | |\n| | `A--` | `Result = 14` |\n\n### 赋值运算符\n\
  \n| 运算符 | 说明 | 结果 |\n| :--- | :--- | :--- |\n| `=` | 简单赋值运算符，将右侧操作数的值赋给左侧操作数 | |\n\
  | | `C = A + B` | 将 `A+B` 的值赋给 `C` |\n| `+=` | 加赋值运算符，将右操作数加到左侧操作数上并将结果赋给左侧操作数 |\
  \ |\n| | `C += A` | 等同于 `C = C + A` |\n| `-=` | 减赋值运算符，从左操作数中减去右操作数并将结果赋给左侧操作数 |\
  \ |\n| | `C -= A` | 等同于 `C = C-A` |\n| `*=` | 乘赋值运算符，将右操作数与左操作数相乘并将结果赋给左侧操作数 | |\n\
  | | `C *= A` | 等同于 `C = C * A` |\n| `/=` | 除赋值运算符，将左操作数除以右操作数并将结果赋给左侧操作数 | |\n|\
  \ | `C /= A` | 等同于 `C = C / A` |\n| `%=` | 取模赋值运算符，使用两个操作数取模并将结果赋给左侧操作数 | |\n| |\
  \ `C %= A` | 等同于 `C = C % A` |\n\n### 位运算符\n\n| 运算符 | 说明 | 给定变量 A = 2 且 B = 3 |\n\
  | :--- | :--- | :--- |\n| `&` | 位与运算符，对整数参数的每个位执行布尔逻辑与操作 | |\n| | `(A & B)` | `Result\
  \ = 2` |\n| `\\|` | 位或运算符，对整数参数的每个位执行布尔逻辑或操作 | |\n| | `(A \\| B)` | `Result = 3`\
  \ |\n| `^` | 位异异运算符，对整数参数的每个位执行布尔逻辑异或操作 | |\n| | `(A ^ B)` | `Result = 1` |\n| `~`\
  \ | 位非运算符，是一个一元运算符，用于反转操作数中的所有位 | |\n| | `(~ B)` | `Result = -4` |\n| `<<` | 位左移运算符，将第一个操作数中的所有位向左移动第二个操作数指定的位数\
  \ | |\n| | `A << 1` | `Result = 4` |\n| `>>` | 位右移运算符，将第一个操作数中的所有位向右移动第二个操作数指定的位数\
  \ | |\n| | `A >> 1` | `Result = 1` |\n| `>>>` | 无符号右移运算符；与 >> 运算符类似，不同之处左侧移入的位始终为\
  \ 0 (0) | |\n| | `A >>> 1` | `Result = 1` |\n\n### 比较运算符\n\n| 运算符 | 说明 | 给定变量 A\
  \ = 15 且 B = 30 |\n| :--- | :--- | :--- |\n| `==` | 检查两个操作数的值是否相等；如果是，则条件为真 | |\n\
  | | `(A == B)` | `Result = Not true` |\n| `!=` | 检查两个操作数的值是否相等；如果值不相等，则条件为真 | |\n\
  | | `(A != B)` | `Result = True` |\n| `>` | 检查左操作数的值是否大于右操作数的值，如果是，则条件为真 | |\n|\
  \ | `(A > B)` | `Result = Not true` |\n| `<` | 检查左操作数的值是否小于右操作数的值，如果是，则条件为真 | |\n\
  | | `(A <= B)` | `Result = True` |\n| `>=` | 检查左操作数的值是否大于或等于右操作数的值，如果是，则条件为真 | |\n\
  | | `(A >= B)` | `Result = Not true` |\n| `<=` | 检查左操作数的值是否小于或等于右操作数的值，如果是，则条件为真\
  \ | |\n| | `(A <= B)` | `Result = True` |\n\n### 条件运算符\n\n| 运算符 | 说明 |\n| :--- |\
  \ :--- |\n| `?:` | 条件条件表达式 |\n| | 如果条件为真，则 value = X，否则 value = Y |\n\n### 逻辑运算符\n\
  \n| 运算符 | 说明 | 给定变量 A = 15 且 B = 30 |\n| :--- | :--- | :--- |\n| `&&` | 逻辑与运算符。如果两个操作数都非零，则条件为真\
  \ | |\n| | `(A && B)` | `Result = True` |\n| `\\|\\|` | 逻辑或运算符。如果两个操作数中有一个非零，则条件为真\
  \ | |\n| | `(A \\|\\| B)` | `Result = True` |\n| `!` | 逻辑非运算符。用于反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符将使其为假\
  \ | |\n| | `(A && B)` | `Result = False` |\n\n## 关键字与注释\n\n### JavaScript 关键字\n\n\
  JavaScript 中的关键字用于标识标识要执行的动作。例如，`var` 关键字指示浏览器创建一个新的关键字：\n\n```javascript\nvar x\
  \ = 1 + 2;\nvar y = x * 15;\n```\n\n### 保留字\n\n在 JavaScript 中，有几个标识符是保留字。在编写 JavaScript\
  \ 时，这些关键字不能用作变量、函数、方法、循环标签或任何对象名称。\n\n| abstract | else | instanceof | switch |\n\
  | :--- | :--- | :--- | :--- |\n| boolean | enum | int | synchronized |\n| break\
  \ | export | interface | this |\n| byte | extends | long | throw |\n| case | false\
  \ | native | throws |\n| catch | final | new | transient |\n| char | finally | null\
  \ | true |\n| class | float | package | try |\n| const | for | private | typeof\
  \ |\n| continue | function | protected | var |\n| debugger | goto | public | void\
  \ |\n| default | if | return | volatile |\n| delete | implements | short | while\
  \ |\n| do | import | static | with |\n| double | in | super | |\n\n### 注释\n\nJavaScript\
  \ 支持 C-、C++- 和 HTML 注释。在 `//` 到行尾之间的文本被视为注释并被 JavaScript 忽略。JavaScript 识别的另一种注释格式是标签\
  \ `/*`。在 `/*` 和 `*/` 之间输入的文本（可以跨多行）会被忽略，起始和结束标签 `<!<!--` 和 `//-->` 也是如此。\n\n**示例：**\n\
  \n![images/himg-6-1.png](img/00008.jpeg)\n\n#### 编写 JavaScript 的提示\n\n* 换行在语句内部会被忽略。\n\
  * JavaScript 是大小写敏感的——关键字、变量、函数名和其他标识符应使用一致的大小写。\n* 单词之间的空格和制表符会被忽略。\n* JavaScript\
  \ 语句以分号结束，除非它们单独成行。\n\n## JavaScript 数据类型\n\n数据类型是根据存储的特定类别对值进行分类。有两种类型：\n\n* 原始类型\
  \ —— 指 String, Boolean, Integer, Floating Point, Null, Void\n* 复合类型 —— 指 Object,\
  \ Array, Function\n\n### JavaScript 数字\n\n| 类型 | same |\n| :--- | :--- |\n| Integer\
  \ | 没有分数部分或小数位的正负数值 |\n| Floating Point | 带有小数点或指数表示法的正负数值 |\n| String | 被单引号或双引号围绕的字符或文本\
  \ |\n| Boolean | 逻辑值 True 或 False |\n| Null | 无值的变量 |\n| Casting | 将变量的内容从一种类型转换为另一种类型\
  \ |\n\n\n\n\n\n字符串转义序列允许用户解析 JavaScript 字符串字面量中的特殊字符/格式，例如 TEXTATEA 输入中的换行符。\n\n\
  | 转义序列 | 属性 | 描述 |\n| :--- | :--- | :--- |\n| `\\b` | 退格 | |\n| `\\f` | 分页符 | |\n\
  | `\\n` | 换行符 | |\n| `\\O` | 空字符 | |\n| `\\r` | 回车 | |\n| `\\t` | 水平制表 | |\n| `\\\
  v` | 垂直制表 | |\n| `\\’` | 单引号或省撇号 | |\n| `\\”` | 双引号 | |\n| `\\\\` | 反斜杠 | |\n| `\\\
  ddd` | 由 0 到 377 之间的三个八进制数字指定的 Latin-1 字符。例如版权符号为 `\\251` | |\n| `\\xdd` | 由 00\
  \ 到 FF 之间的两个十六进制数字 `dd` 指定的 Latin-1 字符。例如版权符号为 `\\xA9` | |\n| `\\udddd` | 由四个十六进制数字\
  \ `dddd` 指定 Unicode 字符。例如版权符号为 `\\u00A9` | |\n\n### JavaScript 布尔值\n\n```javascript\n\
  Boolean(15 >10) // 返回 true\n(5>10) 1 ………// 返回 true\n11>10…… …….// 返回 true\n```\n\
  \n极大或极小的数字可以使用科学计数法（指数法）书写：\n\n```javascript\nvar x = 124e5; // 12400000\nvar y\
  \ = 124e-5; // 0.00124\n```\n\n### JavaScript 数字\n\nJavaScript 只有一种数字类型。数字可以带小数点也可以不带小数点写，例如：\n\
  \n```javascript\nvar x – 39.00 // 一个带有小数点的数字\nvar y = 39…// 一个不带小数点的数字\n```\n\n\
  **关于数字的提示**\n\n- 数字始终使用 64 位浮点数。\n- 与许多其他编程语言不同，JavaScript 没有定义不同类型的数字，例如整数、短整型、长整型、浮点型等。\n\
  - JavaScript 数字始终存储为遵循国际 IEEE 754 标准的双倍精度浮点数。\n\n### JavaScript Null\n\nNull 被认为是没有值、无或简单地为不存在。在\
  \ JavaScript 中，`null` 的数据类型是一个对象。可以通过将其设置为 `null` 来清空一个对象，如下：\n\n```javascript\n\
  var person = null; // 值为 null，但类型仍然是对象\n```\n\n### JavaScript Void\n\nJavaScript\
  \ 中的 `void` 关键字被用作一元运算符，出现在其单个操作数之前。该运算符指定一个要评估的表达式但不返回任何值。\n\n```html\n<html>\n\
  <head>\n<script type=\"text/javascript\"></script>\n</head>\n<body>\n<p>请点击下方内容，这对我没有任何影响……</p>\n\
  <a href=\"javascript:void(alert(0))\">请点击我！</a>\n</body>\n</html>\n```\n\n当点击 **请点击我**\
  \ 链接时，上述脚本将产生以下结果：\n\n![images/himg-7-1.png](img/00009.jpeg)\n\n### 复合类型\n\n####\
  \ 函数\n\n函数是一个 JavaScript 代码块，每当它执行或调用时都会执行特定任务。它用 `function` 关键字定义，后面跟着函数名和括号 `()`。它可能包含字母、数字、下划线符号和美元符号。括号中可以包含逗号分隔的参数名，例如\
  \ `parameter1`、`parameter2` 等。要执行的代码放在花括号 `{}` 内部。\n\n![images/himg-7-2.png](img/00010.jpeg)\n\
  \n**示例：**\n\n```javascript\nfunction convertDataToCentrigrade (degFarenheit)\n{\n\
  \  var degCentigrade;\n  degCentigrade = 5/9 * (degFarenheit – 32);\n  return degCentigrade;\n\
  }\n```\n\n## 对象\n\n对象包含属性和方法的复合数据类型。网页、文本框、表单、按钮和图像等屏幕元素被视为对象。在 JavaScript 中，除了**原始值**之外，所有值都被视为对象。\n\
  \n属性定义对象的特性。\n\n### 属性\n\n| 对象属性 | 属性 | 值 |\n| :--- | :--- | :--- |\n| `firstName`\
  \ | Clark | |\n| `lastName` | Mays | |\n| `age` | 18 | |\n| `eyeColor` | Green |\
  \ |\n\n### 方法\n\n可以在对象上执行的操作被称为**方法**。一个**对象方法**是一个包含函数定义的对象属性。\n\n| 对象方法 | 属性 |\
  \ 值 |\n| :--- | :--- | :--- |\n| `firstName` | Clark | |\n| `lastName` | Mays |\
  \ |\n| `age` | 18 | |\n| `eyeColor` | Green | |\n| `fullName` | `function() { return\
  \ this.firstName + “ ” + this.lastName; }` | |\n\n| 对象名称 | 描述 | 标识符 |\n| :--- |\
  \ :--- | :--- |\n| 当引用一个**对象**时 | `objectName` | |\n| 当引用对象的某个**属性**时 | `objectName.propertyName`\
  \ | |\n| 当引用对象的**方法**时 | `objectName.methodName()` | |\n\n| 内置对象 | 对象名称 | 描述 | 格式\
  \ |\n| :--- | :--- | :--- | :--- |\n| Math 对象 | 为各种数学操作提供方法，包括 `abs()`，`log()`，`pow()`，`random()`，`round()`，`sqrt()`\
  \ | `Math.method(#)` | |\n| | `<SCRIPT language = “JavaScript”> Var theValue =3.14\
  \ myAns = Math.round (the value)</SCRIPT>` | | |\n| Date 对象 | 提供日期和时间信息 | `dateObject.method()`\
  \ | |\n| | `<SCRIPT language = “JavaScript”> var valDat = new Date() theYr = valDat.getFullYear()</SCRIPT>`\
  \ | | |\n| String 对象 | 提供字符串操作和格式化的方法和属性 | `stringName.method()` | |\n| | `<SCRIPT\
  \ language = “JavaScript”> var theStringValue = “my name” var printString = theString.bold()\
  \ var numChars = theStringValue.length</SCRIPT>` | | |\n| Array 对象 | 用于在变量中存储多个称为**元素**的值\
  \ | `var array.name =[item1, item2…];` | | |\n| | `<SCRIPT language = “JavaScript”>\
  \ var cars = [“Toyota”, “Isuzu”, “Kia”]; document.getElementById(“demo”).innerHTML\
  \ = cars;</SCRIPT>` | | |\n| Boolean 对象 | 代表真或假 | `var val = new Boolean (value);`\
  \ | | |\n| | `<SCRIPT language = “JavaScript”> myFunction() { var x = 0; document.getElementById(“demo”).innerHTML\
  \ = Boolean(x); }</SCRIPT>` | | |\n\n| 文档方法 | 属性/方法 | 描述 | 语法 |\n| :--- | :--- |\
  \ :--- | :--- |\n| `document.body` | 获取文档的主体 `<body>` | `document.body` | `document.body.style.backgroundColor\
  \ = “red”;` |\n| `document.close()` | 关闭文档 | `document.close()` | `document.open();\
  \ document.write(“<h1>Hello Earth</h1>”); document.close();` | |\n| `document.cookie`\
  \ | 获取 cookie 的键/值对 | `document.cookie` | `var y = document.cookie;` | |\n| `document.domain`\
  \ | 获取服务器的域名 | `document.domain` | `var y = document.domain;` | |\n| `document.links`\
  \ | 获取文档中所有带有 `href` 属性的 `<a>` 和 `<area>` 元素 | `document.links` | `var y = document.links.length;`\
  \ | |\n| `document.open()` | 打开文档 | `document.open (MIMEtype, replace)` | `document.open();\
  \ document.write(“<h1>Hello Earth</h1>”); document.close();` | |\n| `document.renameNode()`\
  \ | 重命名指定的节点 | `document.renameNode(node,namespaceURI,nodename)` | `var y = document.getElementsByTagName(“P”)[0];\
  \ document.renameNode(p, null, “h1”);` | |\n| `document.scripts` | 获取文档中的 `<script>`\
  \ 元素 | `document.scripts` | `var y = document.scripts.length;` | |\n| `document.title`\
  \ | 获取文档标题 | `document.title` | `var y = document.title;` | |\n| `document.URL`\
  \ | 获取 URL | `document.URL` | `var y = document.URL;` | |\n| `document.write()`\
  \ | 写入 HTML 表达式或 JavaScript 代码 | `document.write(exp1,exp2,exp3…)` | `document.write(“Hello\
  \ Earth”);` | |\n\n## HTML DOM\n\nHTML 文对象模型 (DOM) 是 HTML 和 XML 的标准对象模型和编程接口。它定义了文档的逻辑结构以及访问和操作它们的方式。可以使用\
  \ JavaScript 或其他编程语言访问和使用 DOM。所有 HTML 元素在 DOM 中都被定义为对象。提供了文档方法的示例：\n\n| 属性/方法 |\
  \ 描述 | 语法 |\n| :--- | :--- | :--- |\n| `document.body` | 获取文档的主体 `<body>` | `document.body`\
  \ |\n\n\n\n\n\n| 方法 | 说明 | 语法 | 示例 |\n| :--- | :--- | :--- | :--- |\n| `document.close()`\
  \ | 关闭文档 | `document.close()` | `document.open(); document.write(\"<h1> Hello Earth</h1>”);\
  \ document.close();` |\n| `document.cookie` | 获取 cookie 的键/值对 | `document.cookie`\
  \ | `var y = document.cookie;` |\n| `document.domain` | 获取服务器的域名 | `document.domain`\
  \ | `var y = document.domain;` |\n| `document.links` | 获取文档中所有带有 `href` 属性的 `<a>`\
  \ 和 `<area>` 元素 | `document.links` | `var y = document.links.length;` |\n| `document.open()`\
  \ | 打开文档 | `document.open(MIME type,replace)` | `document.open(); document.write(\"\
  <h1> Hello Earth</h1>”); document.close();` |\n| `document.renameNode()` | 重命名指定的节点\
  \ | `document.renameNode(node,namespaceURI,nodename)` | `var y = document.getElementsByTagName“P”)[0];\
  \ document.renameNode(p, null, “h1”);` |\n| `document.scripts` | 获取文档中的 `<script>`\
  \ 元素 | `document.scripts` | `var y = document.scripts.length;` |\n| `document.title`\
  \ | 获取文档标题 | `document.title` | `var y = document.title;` |\n| `document.URL` |\
  \ 获取 URL | `document.URL` | `var y = document.URL;` |\n| `document.write()` |  HTML\
  \ 表达式或 JavaScript 代码 | `document.write(exp1, exp2,exp3,...)` | `document.write(“Hello\
  \ Earth”);` |\n\n## JavaScript 对象层次结构\n\n当用户在浏览器中加载文档时，会创建基于文档 HTML 内容和其他信息的属性值的\
  \ JavaScript 对象。这些对象存在于基于 HTML 页面结构的层级结构。DOM 使得动态更改网页成为可能。通过 DOM，用户可以定位 HTML 文档中的任何元素，并使用\
  \ JavaScript 更改元素的属性。DOM 层级结构所示：\n\n![images/himg-8-1.png](img/00011.jpeg)\n\n###\
  \ Window 对象\n\nwindow 对象指的是浏览器中打开的窗口。它用于在新窗口中打开网页并设置窗口的属性。两个主要的窗口属性是：\n\n| 窗口属性\
  \ | 属性 | 值 |\n| :--- | :--- | :--- |\n| Status | 设置状态消息 |\n| Self | 存储当前窗口的名称 |\n\
  \n### Window 方法\n\nwindow 方法用于打开和关闭新窗口。主要的窗口方法有：\n\n| 窗口方法 | 方法 | same |\n| :---\
  \ | :--- | :--- |\n| `alert()` | 显示消息框 |\n| `confirm()` | 显示确认框 |\n| `prompt()`\
  \ | 显示提示框 |\n| `open()` | 打开新窗口 |\n| `close()` | 关闭窗口 |\n\n## JavaScript 数组\n\n\
  在 JavaScript 中，`array`是一种特殊的变量，可以在单个变量中存储多个值。要创建数组，可以使用`数组字面量`（array literal）。\n\
  \n**语法：**\n\n```\nvar array-name = [item1, item2, ...];\n```\n\n**示例：**\n\n```\n\
  var car = [“Toyota”, “Mazda”, “Isuzu”];\n```\n\n数组使用数字访问元素。在下面的示例中，`person[0]` 返回\
  \ Harry：\n\n**示例：**\n\n```\nvar person = [“Harry”, “Crawford”, 45]);\n```\n\n##\
  \ JavaScript 事件\n\n事件指的是如何从 Web 用户处获取反馈。与 HTML 的交互通过事件处理，这些事件会在用户点击、加载、关闭、调整大小或操作网页与浏览器进行交互时发生。事件是\
  \ DOM  级的一部分，每个 HTML 元素都有一组特定的触发 JavaScript 代码的事件。以下是示例：\n\n| 事件类型 | 事件 | same |\n\
  | :--- | :--- | :--- |\n| `onblur` | 元素失去焦点时执行 |\n| `onchange` | 元素发生变化时执行 |\n|\
  \ `onclick` | 对象被点击时执行 |\n| `ondblclick` | 对象被双击时执行 |\n| `onfocus` | 元素获得焦点时执行 |\n\
  | `onkeydown` | 键被按下时执行 |\n| `onkeypress` | 键按下并释放时执行 |\n| `onkeyup` | 键被释放时执行 |\n\
  | `onmousedown` | 鼠标键被按下时执行 |\n| `onmousemove` | 鼠标指针移动时执行 |\n| `onmouseout` | 鼠标指针移出元素时执行\
  \ |\n| `onmouseover` | 鼠标指针移动到元素上时执行 |\n| `onmouseup` | 鼠标键被释放时执行 |\n| `onreset`\
  \ | 表单重置时执行 |\n| `onselect` | 元素被选中时执行 |\n| `onsubmit` | 表单提交时执行 |\n\n## AJAX 与\
  \ CSS\n\nJavaScript 可以与 AJAX 和 CSS 使用。\n\n- **AJAX**: AJAX 是**异步 JavaScript**（Asynchronous\
  \ JavaScript）和 XML 的缩写。通过无需刷新整个页面即可更新页面局部，AJAX 提供了一种更快更简单的创建交互式 Web 应用的方法。它使用 XHTML\
  \ 用于内容，使用 CSS 用于样式和呈现，使用文档对象模型和 JavaScript 显示动态内容。要了解更多 AJAX，请访问此网站：\n[`developer.mozilla.org/en-US/docs/AJAX/Getting_Started`](https://developer.mozilla.org/en-US/docs/AJAX/Getting_Started)\n\
  \n- **CSS**: CSS 代表**级联样式表**（Cascading Style Sheets）。一种用于指定文档呈现方式的样式表语言。\n\n## 在线资源\n\
