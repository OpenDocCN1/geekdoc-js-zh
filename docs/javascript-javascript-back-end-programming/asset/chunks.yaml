  trans: "\n\n- `--save`: 这会安装包并将其项添加到 `package.json` 中名为 `dependencies` 的文件中。\n-\
    \ `--save-dev`: 这会安装包并将其项添加到 `package.json` 中名为 `devDependencies` 的文件中。\n\n这两者之间的区别在于，`devDependencies`\
    \ 往往是开发工具，例如测试库），而 `dependencies` 是被包含在应用程序中的包。你也可以通过运行此命令来更新包：`npm update`。`npm\
    \ update` 会检查每个包，寻找符合你版本限制的更新版本。如果你有一个想要更新的单个包，只需指定包名：`npm update <package-name>`\
    \ 即可。\n\n## 版本控制\n除了标准下载外，你还可以使用 `npm` 进行版本控制，允许你指定特定的包版本，或者请求比你需要的版本更高或更低的版本。大多数情况下，库只与另一个库的主版本发布兼容。或者，你可能由于某个\
    \ `lib` 导致了问题，因为它包含一个未修复的错误。\n\n当你显式指定库版本时，它有助于帮助人都保持在该版本上，确保整个团队在 `package.json`\
    \ 更新之前都在使用相同的版本。在这些情况下，版本控制是有帮助的，且 `npm` 将始终遵循 `semver`（语义化版本）标准。\n\n## 运行任务\n\
    `package.json` 支持指定命令行任务的格式，你可以使用以下命令运行这些任务：`npm run <task-name>`。\n\n这里有一个示例：\n\
    ```json\n{\n  \"scripts\": {\n    \"start-dev\": \"node lib/server-development\"\
    ,\n    \"start\": \"node lib/server-production\"\n  }\n}\n```\n同样使用此功能运行 Webpack\
    \ 也是很常见的：\n```json\n{\n  \"scripts\": {\n    \"watch\": \"webpack --watch --progress\
    \ --colors --config webpack.conf.js\",\n    \"dev\": \"webpack --progress --colors\
    \ --config webpack.conf.js\",\n    \"prod\": \"NODE_ENV=production webpack -p\
    \ --config webpack.conf.js\"\n  }\n}\n```\n与其不得不输入长长的命令，或者尝试记住它们并确保没有输入错误，不如你可以这样做：\n\
    ```bash\n$ npm run watch\n$ npm run dev\n$ npm run prod\n```\n\n## npm 将包安装在何处？\n\
    当使用 `npm` 安装包时，你有两种安装类型——本地安装或全局安装。\n\n当你在 `npm` 中输入 `install` 命令时，例如 `npm install\
    \ lodash`，默认情况下，包会被安装在当前树的名为 `node_modules` 的子文件夹中。同时，`lodash` 项也会添加到当前文件夹下 `package.json`\
    \ 的 `dependencies` 属性中。\n\n要进行全局安装，你需要添加 `-g` 标记：`npm install -g lodash`。这次，包将使用全局位置而不是将包安装在本地文件夹中。但在哪里呢？\n\
    \n`-g` 命令会告诉你它在计算机上的确切位置。在 Linux 或 Mac 系统上，这可能是 `/usr/local/lib/node_modules`，而在\
    \ Windows 上，它可能在 `C:\\Users\\YOU\\AppData\\Roaming\\npm\\node_modules`。如果你使用 `npm`\
    \ 管理 Node.js 版本，这些位置将会不同。\n\n## 使用或执行用 npm 安装的包\n当你使用 `npm` 在名为 `node_modules`\
    \ 的文件夹中或全局安装包时，它在 Node.js 代码中是如何使用的？假设你使用此命令安装了流行的 JS 实用库 `lodash`：`npm install\
    \ lodash`。\n\n包将安装在本地的 `node_modules` 文件夹中。在代码中使用它需要你使用 `require` 命令将它导入程序：\n\
    ```javascript\nconst _ = require('lodash')\n```\n那么，如果你有一个可执行的包呢？可执行文件将进入 `node_modules/.bin/`\
    \ 文件夹而不是那里。演示这一点的最简单的方法之一是使用 `cowsay` 包，它有一个命令行程序。可以执行该程序让一个动物（如牛）说一些话。\n\n当以这种方式安装包时：`npm\
    \ install cowsay`，它会同所需的依赖项一起安装到 `node_modules` 文件夹中：\n![node_modules 文件夹内容](https://nodejs.dev/static/b245c50f5080dae16a2525fae0ba2c91/d2c2a/node_modules-content.png)\n\
    \n一个隐藏的 `bin` 文件夹包含指向 `cowsay` 二进制文件的符号链接：\n![二进制文件](https://nodejs.dev/static/99830aefa055e247397de544ad7b7744/d2c2a/binary-files.png)\n\
    \n那么，这些是如何执行的？你可以通过输入 `./node_modules/.bin/cowsay` 来运行它，它将会工作。然而，最近 `npm` 版本中的\
    \ `npx` 更好。你只需要运行：`npx cowsay`，系统会自动找到包的位置。\n![牛在说什么](https://nodejs.dev/static/ad4f3d3a7464bb0f8a2845fe8e6588c2/d2c2a/cow-say.png)\n\
    \n## 第四章：Node.js 回调与 Promise\n当你刚开始学习 Node.js，最可能遇到的问题之一就是回调。在我们深入研究回调是什么之前，我们需要知道它们为什么存在，这归于\
    \ Node 的异步特性。大多数人知道异步编程“更好但更难”。这听起来可能有些简单，所以让我们通过对比同步和异步代码来看。\n\n你首先看到的现象是，异步版本的代码看起来非常糟糕。它看起来过于复杂，但我们并没有从中获得比同步代码多多的益处。然而，不可否认它是有收益的，所以让我们谈谈这些。\n\
    \n异步代码很酷的地方在于，当你的代码在等待诸如 API 调用或数据库响应时，它并没有挂在那里无所事事。在同步代码中，当它执行某件事时，它会阻塞你的代码，如果执行该操作需要很长时间，它会让其他一切都停止。在异步代码中，你可以同时处理其他事情。这是\
    \ Node.js 存在的主要原因之一——异步服务器可以在等待 I/O 或输入/输出时继续处理请求。\n\n是的，当我们对这一点有了更好的了解，让我们深入研究回调。回调到底是什么？回调仅仅是作为参数传递给其他函数，接收函数随后会使用它，或回调它。看看这个回调函数生效的简单示例：\n\
    ```javascript\nfs.readFile(funFileName, function(err, file) {\n  if(err)\n   \
    \ handleError(err);\n  console.log(\"file: \", file)\n})\n```\n\n"
- fmt: "\nOnce `fs.readFile` has fetched the `funFileName` file, the callback function\
    \ is executed. This function will then handle any errors thrown, logging the file\
    \ it retrieves to the console.\n\nThe callback function takes two arguments or\
    \ parameters – `err` and `file`. Convention dictates that the callback function’s\
    \ first argument is an error. If the parent function throws an error, it is there\
    \ to be dealt with but, if an error is not thrown, which does happen sometimes,\
    \ the function’s first argument must be `null`. Convention also dictates that\
    \ the functions that follow this are the response data.\n\nOk, so that’s fine\
    \ but, why didn’t we just write our code like this?\n\n```javascript\nlet file\
    \ = fs.readFile(fooFileName);\nconsole.log(\"file: \", file);\n```\n\nThe short\
    \ answer to that is `async`. The second example shows that the file is not defined\
    \ when we try logging it. This is because `fs.readFile` won’t have finished fetching\
    \ before we reach `console.log()`.\n\nHowever, it is worth noting that the following\
    \ will work:\n\n```javascript\nlet file = 1+1;\nconsole.log(\"file: \", file);\n\
    ```\n\nTo those of you who really are new to this and have only worked with synchronous\
    \ programming, this will feel somewhat confusing, not to mention a little cumbersome.\
    \ With synchronous programming, your life has been easy, filled with logic, and\
    \ then, all of a sudden, line four can be executed before line three! So, should\
    \ callbacks be used all over the place, all of the time, just in case? The answer\
    \ to that is a resounding no.\n\nYou should only ever use a callback when you\
    \ don’t know that something is going to be done. Again, think of getting data\
    \ from databases, API calls, and so on. These all take time, so the callback needs\
    \ to be called when the event has happened, which is where we get the term “event-driven\
    \ programming.” If you don’t feel like you really understand this right now, don’t\
    \ worry – you are not the only one, and the only real way to understand it is\
    \ to do it. Let’s move onto a more in-depth look at asynchronous programming and\
    \ all it entails.\n\n# Chapter Five: Asynchronous JavaScript Programming\n\nIn\
    \ this chapter, we are going to look at asynchronous JavaScript programming but,\
    \ first, we need to look back at some of the issues of asynchronous JavaScript.\
    \ We’ll then look at asynchronous techniques and show how they can help us get\
    \ around these problems.\n\n## [Synchronous JavaScript](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing#synchronous_javascript)\n\
    \nTo understand asynchronous JavaScript, we must first understand synchronous\
    \ JavaScript. Much of the basic JavaScript code you see revolves around synchronous\
    \ code – you run code and, as soon as the browser is able to, it returns the result.\
    \ Here’s a very simple example:\n\n```javascript\nconst btn = document.querySelector('button');\n\
    btn.addEventListener('click', () => {\n  alert('You clicked on me!');\n  let pElem\
    \ = document.createElement('p');\n  pElem.textContent = 'This is a new paragraph.';\n\
    \  document.body.appendChild(pElem);\n});\n```\n\nHere, each line is executed\
    \ one after the other:\n1. First, we get a reference to a readily available `<button>`\
    \ element in the DOM.\n2. Then a click event listener is added; when the button\
    \ gets clicked, four things happen in order:\n    - An `alert()` message is displayed\n\
    \    - After dismissing the alert, a `<p>` element is created\n    - The element\
    \ is then provided with text\n    - The paragraph is appended to the document\
    \ body\n"
