  trans: "\n如果你觉得这很困惑，请看这个示例：\n\n```javascript\nconsole.log(\"registering click handler\"\
    );\nbutton.addEventListener('click', () => {\n    console.log(\"get click\");\n\
    });\nconsole.log(\"all done\");\n```\n\n它的行为方式其实非常相似——第一条和第三条 `console.log()`\
    \ 信息会立即显示，但中间的那条会被阻塞，直到点击鼠标按钮。在第一个示例中，区别在于中间的消息被阻塞了，它在等待资源在屏幕上显示，而不是等待按钮被点击。\n\
    \n这种设置在复杂的代码中可能会导致真实问题。如果异步代码块返回的结果在随后的同步块中被依赖，则无法包含异步代码块。没有办法可以保证异步函数在浏览器处理同步块之前返回。\n\
    \n为了查看它是如何工作的，请参考以下示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    utf-8\">\n<title>简单的异步/同步示例</title>\n</head>\n<body>\n<script>\nconsole.log ('Starting');\n\
    let image;\nfetch('coffee.jpg').then((response) => {\nconsole.log('It worked :)')\n\
    return response.blob();\n}).then((myBlob) => {\nlet objectURL = URL.createObjectURL(myBlob);\n\
    image = document.createElement('img');\nimage.src = objectURL;\ndocument.body.appendChild(image);\n\
    }).catch((error) => {\nconsole.log('There is a problem with your fetch operation:\
    \ ' + error.message);\n});\nconsole.log ('All done!');\n</script>\n</body>\n</html>\n\
    ```\n\n将第四个 `console.log()` 修改为：\n```javascript\nconsole.log ('All done! ' + image.src\
    \ + 'displayed.');\n```\n\n现在你的控制台应该显示一个错误而不是第三条消息：`TypeError: image is undefined;\
    \ can't access its \"src\" property`。这发生在浏览器尝试运行第三个 `console.log()` 而 `fetch()`\
    \ 块尚未完成时——此时 `image` 变量还没有值。\n\n注意：出于安全考虑，你不能使用 `fetch()` 从本地文件系统获取文件，因此你需要通过本地服务器运行上述示例。要修复此\
    \ `fetch()` 问题并确保所有 `console.log()` 语句按照你想要的顺序出现，可以通过使第三个语句异步运行。你可以通过将其放在与第二个语句链连的\
    \ `.then()` 块中来实现，也可以将其放在第二个 `.then()` 块中。\n\n# 第六章：Node.js 事件循环与发射器\n\n事件循环帮助\
    \ Node.js 执行非阻塞 I/O 操作，尽管 JS 是一种单线程语言。为了做到这一点，只要可能，操作就会被卸载到系统内核。如今，内核是多线程的，这意味着它们可以在后台执行时同时处理多个操作。当一个操作完成后，内核会通知\
    \ node.js，确保正确的回调进入轮询队列以便在某个时间点执行。在本章结束时，你将理解这一点。\n\n当 Node.js 启动时，事件循环会被初始化。输入脚本会被处理或丢入\
    \ REPL——这可能涉及定时器、异步 API 调用，或者调用 `process.nextTick()`——然后处理事件循环。在下图中，你可以看到事件循环中操作执行顺序的简单概述：\n\
    \n```\n┌─────────────────────────┐\n┌─>timers               │\n│   └─────────────┬\
    \ ─────┘\n┌─────────────┴ ─────┐\n│   pending callbacks    │\n│   └─────────────┬\
    \ ─────┘\n┌─────────────┴ ─────┐\n│   idle, prepare        │\n│   └─────────────┬\
    \ ─────┘\n┌───────────────────────┐\n┌─────────────┴ ─────┐\n│   incoming:   \
    \        │\n│   poll                 │\n│   <─────┤connections, │\n│   └─────────────┬\
    \ ─────┘\n│   data, etc.           │\n│   ┌─────────────┴ ─────┘\n│   ───────────────────────┘\n\
    │   check               │\n│   └─────────────┬ ─────┘\n┌─────────────┴ ─────┐\n\
    └──┤close callbacks    │\n      │\n└─────────────────────────┘\n```\n\n上述图中每个框被称为“事件循环阶段”。每个阶段包含一个需要执行的回调\
    \ FIFO（先入先出）队列。当事件循环进入任何阶段时，会执行该阶段特定的操作，并执行该阶段队列中的回调，直到它们全部完成或达到回调限制。发生这种情况时，事件循环将进入下一个阶段，并按顺序一直持续。\n\
    \n任何一个操作都可能导致更多操作被调度，内核会在轮询阶段将新的事件处理。轮询事件可能在处理轮询事件的同时被入队。其结果是回调运行时间更长，导致轮询阶段运行时间比定时器允许的久。\n\
    \n## 阶段概述\n\n在每个阶段之间，事件循环运行时，Node.js 会检查是否有定时器或异步 I/O 需要运行；如果没有，它将正常关闭。\n\n###\
    \ 定时器\n\n定时器用于指定阈值，在该阈值后执行指定的回调，而不是等待人们所需的确切时间。这些回调在阈值后被调度后立即运行，但可能会被操作系统调度的其他回调推迟。从技术上讲，定时器的执行是由轮询阶段控制的。\n\
    \n假设你想调度一个在 100ms 阈值后执行的超时；在这种情况下，你的回调将在阈值后被调度后立即运行，但可能会被操作系统调度的其他回调推迟：\n\n```javascript\n\
    const fs = require('fs');\nfunction someAsyncOperation(callback) {\n  // 这需要 95ms\
    \ 来完成\n  fs.readFile('/path/to/file', callback);\n}\nconst timeoutScheduled =\
    \ Date.now();\nsetTimeout(() => {\n  const delay = Date.now() - timeoutScheduled;\n\
    \  console.log(`${delay}ms have passed since scheduling`);\n}, 100);\n\n// 执行某些需要\
    \ 95ms 完成的操作\nsomeAsyncOperation(() => {\n  const startCallback = Date.now();\n\
    \  // 如果少于 10ms...\n  while (Date.now() - startCallback < 10) {\n    // 什么都不做\n\
    \  }\n});\n```\n\n当事件循环进入轮询阶段时，队列是空的——`readFile()` 尚未完成——所以循环等待直到定时器的剩余毫秒。在此期间，`readFile()`\
    \ 继续读取文件，耗时 10ms 的回调被放入轮询队列并执行。一旦回调完成，所有队列的回调都已完成，事件循环可以看到最早定时器的阈值已达到。它回到定时器阶段，并执行定时器回调。此示例中调度与执行之间的延迟为\
    \ 105ms。\n\n注意：防止轮询阶段饿饿事件循环需要一个名为 `libuv` 的库在硬性限制之前停止轮询新事件。该限制取决于系统。`libuv` 是一个负责实现事件循环和所有平台异步行为的\
    \ C 库。\n\n### 待处理回调\n\n待处理回调阶段负责执行针对 TCP 错误类型操作的回调。例如，如果 TCP Socket 在尝试连接时接收到\
    \ `ECONNREFUSED`，某些 Unix 系统可能不会立即报告错误。相反，它会被排在待处理回调阶段，等待执行。\n\n该阶段执行某些系统操作的回调，例如\
    \ TCP 错误类型。例如，如果 TCP Socket 在尝试连接时接收到 `ECONNREFUSED`，某些 Unix 系统希望等待报告错误。\n\n###\
    \ 轮询\n\n轮询阶段有两个主要功能：\n\n*   计算阻塞和轮询 I/O 的时间\n*   处理轮询队列事件\n\n当事件循环进入轮询阶段时，如果没有调度任何定时器，可能会发生以下两种情况之一：\n\
    \n1.  如果队列不为空，循环遍历回调队列，异步执行它们，直到达到硬性限制或队列为空\n\n2.  如果队列为空，可能会发生以下两种情况之一：\n\n"
- fmt: "\n- If `setImmediate()` has been used to schedule scripts, the poll phase\
    \ is ended by the event loop. The loop then goes on to the check phase and executes\
    \ all the scheduled scripts.\n- If `setImmediate()` has not been used to schedule\
    \ the scripts, the event loop waits until callbacks are added to the queue, at\
    \ which point, they will be immediately executed.\n\nWhen there is nothing left\
    \ in the poll queue, the event loop looks for timers who have reached their time\
    \ thresholds. If there is at least one ready, the event loop goes back to the\
    \ timers phase and executes the callbacks.\n\n### Check Phase\nThe check phase\
    \ allows callbacks to execute immediately upon completion of the poll phase. If\
    \ the phase is idle and `setImmediate()` has queued some scripts, the loop continues\
    \ checking the phase instead of waiting.\n\n`setImmediate()` is a timer, a special\
    \ one running in a different event loop phase. The `libuv` API is used to schedule\
    \ the execution of callbacks once the poll phase is complete. Typically, when\
    \ code is executing, the event loop has to hit the poll phase at some point. It\
    \ waits there for incoming requests, connections, etc., but if `setImmediate`\
    \ has been used to schedule a callback and the poll phase is idle, rather than\
    \ wait for the poll events, the loop will end and carry on to the check phase.\n\
    \n### Close Callbacks\nIf a handle or socket has been abruptly closed, i.e., with\
    \ `socket.destroy()`, the ‘close’ event is emitted during the close callbacks\
    \ phase. Otherwise, `process.nextTick()` is used to emit it instead.\n\n### setImmediate()\
    \ vs setTimeout()\nThese are quite similar, but when they are called, they may\
    \ act in different ways.\n\n- `setImmediate()` executes scripts when the current\
    \ poll phase is done\n- `setTimeout()` schedules a script to run once a minimum\
    \ `ms` threshold has elapsed\n\nThe order of execution varies and is dependent\
    \ on the calling context. If they both get called from the main module, the process\
    \ performance binds their timing, but other machine applications can impact the\
    \ performance. \n\nLet’s say, for example, that the following script is run. It\
    \ is not in the main module, which is an I/O cycle so the order of execution is\
    \ non-deterministic as the performance process binds it:\n\n```javascript\n//\
    \ timeout_vs_immediate.js\nsetTimeout(() => {console.log('timeout');}, 0);\nsetImmediate(()\
    \ => {console.log('immediate');});\n```\n`$ node timeout_vs_immediate.js`\n`timeoutimmediate`\n\
    `$ node timeout_vs_immediate.js`\n`immediatetimeout`\n\nOn the other hand, if\
    \ the two calls are placed within an I/O cycle, the immediate one is the first\
    \ to be executed:\n\n```javascript\n// timeout_vs_immediate.js\nconst fs = require('fs');\n\
    fs.readFile(__filename, () => {\n  setTimeout(() => {console.log('timeout');},\
    \ 0);\n  setImmediate(() => {console.log('immediate');});\n});\n```\n`$ node timeout_vs_immediate.js`\n\
    `immediatetimeout`\n`$ node timeout_vs_immediate.js`\n`immediateatout`\n\nUsing\
    \ `setImmediate()` has one primary advantage over `setTimeout()`; if it is scheduled\
    \ in an I/O cycle, it is executed first, before the timers, regardless of how\
    \ many there are.\n\n### process.nextTick()\nYou might also have seen that `process.nextTick()`\
    \ is not in the diagram above, despite it being a part of the asynchronous API.\
    \ Technically, it is not a part of the event loop. `nextTickQueue` is processed\
    \ first once the current operation is finished, no matter what the event loop’s\
    \ current phase is.\n\nGoing back to that diagram, whenever `process.nextTick()`\
    \ is called in a phase, all the callbacks passed to it get resolved before the\
    \ event loop can continue. However, this can lead to bad stuff happening – because\
    \ recursive `process.nextTick()` calls are made, it lets your I/O starve. This\
    \ stops the event loop from getting to the poll phase.\n\nSo, why would Node.js\
    \ allow this to happen? It is part of the design philosophy that allows for an\
    \ API always being asynchronous, whether it needs to be or not. Have a look at\
    \ this example:\n\n```javascript\nfunction apiCall(arg, callback) {\n  if (typeof\
    \ arg !== 'string')\n    return process.nextTick(callback, new TypeError('argument\
    \ should be a string'));\n}\n```\nThe code checks the argument, and if it isn’t\
    \ right, the error is passed to the callback. The recently updated API allows\
    \ arguments to be passed to `process.nextTick()`, which means it can take arguments\
    \ that were passed after the callback. These are then propagated as callback arguments,\
    \ eliminating the need to nest functions.\n\nWhat we have done is passed an error\
    \ to the user, but this only happens when the rest of the user code has been executed.\
    \ `process.nextTick` allows a guarantee that the `apiCall()` callback is run only\
    \ once the remaining user code and before the event loop can go on. Achieving\
    \ this is done by allowing the JS stack to unwind. Then the specified callback\
    \ is immediately executed, allowing recursive calls to be made to `process.nextTick()`\
    \ without getting to a `RangeError: Maximum call stack size exceeded` from v8.\n\
    \nHowever, this can cause some problems. Have a look at this code:\n\n```javascript\n\
    let bar;\n// the signature is asynchronous but synchronously calls callback\n\
    function someAsyncApiCall(callback) {\n  callback();\n}\n// the callback gets\
    \ called before `someAsyncApiCall` is finished.\nsomeAsyncApiCall(() => {\n  //\
    \ because someAsyncApiCall hasn't finished, bar doesn’t get a value assigned\n\
    \  console.log('bar', bar); // undefined\n});\nbar = 1;\n```\n`someAsyncApiCall()`\
    \ is defined with an asynchronous signature even though it is synchronous in its\
    \ operations. When called, the `someAsyncApiCall()` is called in the event loop\
    \ phase because `someAsyncApiCall()` does nothing asynchronously. This is because\
    \ the callback attempts to reference `bar` despite the variable potentially not\
    \ being in scope because the script has not been completed.\n\nWhen you put the\
    \ callback in `process.nextTick()`, the script can still complete, allowing initialization\
    \ of all the functions, variables, etc., before the callback is called. This stops\
    \ the event loop from continuing. It could also be useful for alerting the user\
    \ to an error before the event loop can proceed. Here’s the previous `nextTick()`\
    \ example:\n\n```javascript\nlet bar;\nfunction someAsyncApiCall(callback) {\n\
    \  process.nextTick(callback);\n}\nsomeAsyncApiCall(() => {\n  console.log('bar',\
    \ bar); // 1\n});\nbar = 1;\n```\nAnd another real-world example:\n\n```javascript\n\
    const server = net.createServer(() => {}).listen(8080);\nserver.on('listening',\
    \ () => {});\n```\nWhen it is just a port being passed, the port is immediately\
    \ bound. This means the listening callback could be immediately, but there’s a\
    \ problem – the `on('listening')` callback will not yet been set. Getting around\
    \ this requires that the listening event go into a `nextTick()` queue to complete\
    \ the script.\n\n### process.nextTick() vs setImmediate()\nThese are very similar\
    \ calls with confusing names:\n\n- `process.nextTick()` will immediately fire\
    \ on the same phase\n- `setImmediate()` will wait for the following event loop\
    \ iteration or tick before firing.\n\nReally, these two names should be swapped\
    \ over, given that `process.nextTick()` is more immediate to fire than `setImmediate()`.\
    \ However, this is something that comes from the early days isn’t likely to change.\
    \ The simple reason for that is because it breaks quite a lot of the npm packages.\
    \ More modules get added daily, and that leads to more potential breakages, so,\
    \ while confusing, the names will not change. It is our recommendation that you\
    \ use `setImmediate()` all the time.\n\n### Why process.nextTick()?\nThere are\
    \ a couple of good reasons why you should use `process.nextTick()`:\n\n- Users\
    \ can better handle errors, clean out any resources they don’t need, or submit\
    \ requests again before the loop carries on.\n- Sometimes, a callback needs to\
    \ run between the call stack unwinding and the event loop continuing.\n"
