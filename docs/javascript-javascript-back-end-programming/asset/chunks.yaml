- fmt: "\n# Step One — Start and Stop the REPL\n\nSo long as Node is installed on\
    \ your computer, you also have the REPL. So starting it is easy – open your command-line\
    \ shell and type in the following:\n\n```\nnode\n```\n\nThis will bring up the\
    \ REPL prompt, which looks like this:\n`> `\n\nWhen you see the `>` symbol, it\
    \ tells you that JavaScript code can be input for immediate evaluation. Let's\
    \ try an example. Type the following into the REPL to add two numbers:\n\n`> 2\
    \ + 3`\n\nNow press **ENTER**, and REPL does the evaluation and returns the result:\
    \ \n`5`\n\nIf you want to get out of the REPL, type `.exit`. Alternatively, press\
    \ `CTRL+C` twice or `CTRL+D` once, and you will go back to the shell prompt. Now\
    \ you know how to start and stop the REPL, let's look at using it for simple JavaScript\
    \ code execution.\n\n# Step Two — Execute Code in the REPL\n\nYou can use the\
    \ REPL to quickly test your JavaScript code without creating files to store it\
    \ in, and virtually all Node.js or JavaScript expressions may be executed here.\
    \ In step one, we tried an expression to add two numbers, so now let's have a\
    \ go at division.\n\nStart a REPL:\n```\nnode\n```\n\nAnd type the following at\
    \ the prompt:\n`> 20 / 5`\n\nPress the **ENTER** key, and you will see, as you\
    \ would expect, an output of: \n`4`\n\nWe can also test string operations in the\
    \ REPL. Let's try to concatenate a pair of strings in the REPL. Type the following:\n\
    `> \"Hello \" + \"World\"`\n\nPress **ENTER** again, and the REPL evaluates the\
    \ result of the expression, outputting: `'Hello World'`\n\n**NOTE**: You might\
    \ have spotted that the output is enclosed in single quotes rather than double.\
    \ Unlike many other programming languages, the quotes used in JavaScript strings\
    \ have no effect on their value. If you used a single quote in your string input,\
    \ REPL is clever enough to change it to double quotes in the output.\n\n### Calling\
    \ Functions\n\nWhen you write Node.js code, messages are commonly printed using\
    \ the global `console.log` method or another function similar to it. Type the\
    \ command below at the REPL prompt:\n\n`> console.log(\"Hey\")`\n\nPress the **ENTER**\
    \ key, and you should see the following:\n`Hey`\n`undefined`\n\nThe first line\
    \ of the output is what we get from `console.log`. The message in the string is\
    \ printed to the `stdout` stream, which is your screen. Note the absence of quotes\
    \ – this is because `console.log` prints strings without them. The second line\
    \ that reads `'undefined'` is the function's return value.\n\n### Creating Variables\n\
    \nVery rarely will you only be working with literals in JavaScript. When you create\
    \ variables in the REPL, it works much the same as when you work with `.js` files.\
    \ Type the command below at the prompt:\n\n`> let age = 45`\n\nPress the **ENTER**\
    \ key, and you will see the following:\n`undefined`\n\nAs before, when we used\
    \ `console.log`, the command's return value is `'undefined.'`. The variable called\
    \ `age` will remain available until the REPL session is closed. So, for example,\
    \ you could multiply it by three, like this:\n`> age *`\n\nPress **ENTER** and\
    \ the output will be: \n`135`\n\nBecause the REPL returns values, there is no\
    \ need to use functions like `console.log` to see the output. By default, REPL\
    \ values will automatically show on the screen.\n\n### Multi-Line Blocks\n\nAlso\
    \ supported are multi-line blocks. For example, we could create a function that\
    \ will add 10 to any given number. Begin the function by inputting the following:\n\
    \n`> const add10 = (num) => {`\n\nPress **ENTER**, and the prompt will change,\
    \ looking like this:\n`...`\n\nWhy did it do that? Because the REPL saw a curly\
    \ bracket at the end of the command and assumed that there would be more lines\
    \ of code, and these must be indented. To make reading it easier, the REPL puts\
    \ three dots and a space on the following line, so the next code line looks like\
    \ it is indented. Enter the next two lines of this function, one line at a time,\
    \ and press **ENTER** after each one:\n`... return num + ;`\n`... }`\n\nWhen you\
    \ press **ENTER** after the closing bracket, the output will read:\n`undefined`\n\
    \nThis is the value of the function being assigned to a variable, and the `…`\
    \ prompt is replaced once more with the `>` prompt.\n`undefined >`\n\nNext, we\
    \ can call `add10()` on a specified value:\n`> add10(10)`\n\nAs you would expect,\
    \ the output shows: \n`20`\n\nThe REPL can be used to try pieces of JS code before\
    \ you add them to your programs. And, to make things even easier for you, there\
    \ are some shortcuts in the REPL.\n\n# Step Three — Mastering REPL Shortcuts\n\
    \nThere are shortcuts in the REPL that can help to cut down on time spent coding.\
    \ For a start, it will retain a history showing all entered commands and lets\
    \ you go through them and repeat commands where needed. For example, input this\
    \ string:\n`\"The answer to everything is 50\"`\n\nThe result from this is: `'The\
    \ answer to everything is 50'`\n\nWe can edit this and change `\"50\"` to `\"\
    40\"` so, at the prompt, press the **UP** arrow to go to the last command used:\n\
    `> \"The answer to everything is 50\"`\n\nShift the cursor left, delete the `5`,\
    \ and input `4`; press **ENTER**, and this is what you see:\n`'The answer to everything\
    \ is 40'`\n\nCarry on pressing the **UP** arrow, and it will take you back through\
    \ your command history until you get to the first one used in the current session.\
    \ Using the **DOWN** arrow will take you to the most recently used commands. When\
    \ you have finished playing about with this and seeing how it all works, press\
    \ the **DOWN** key repeatedly until you get back to the prompt.\n\nTo get the\
    \ last value evaluated, you can use the underscore. Type it at the prompt:\n`>\
    \ _`\n\nThen press the **ENTER** key. The output on the screen is the last string\
    \ entered: `'The answer to everything is 40'`\n\nAlso, in the REPL is an autocomplete\
    \ function you can use on keywords, variables, and functions. Let's say you want\
    \ to use the `Math.sqrt` function to find a given number's square root; you would\
    \ enter the first few characters:\n`> Math.sq`\n\nPress the **TAB** key, and the\
    \ function is autocompleted. Should there be more than one possibility, REPL will\
    \ show you all the options. Try entering the following at the command:\n`> Math.`\n\
    \nPress the **TAB** button twice, and you will be shown the potential autocompletions:\n\
    `Math.__defineGetter__`\n`Math.__defineSetter__`\n`Math.__lookupGetter__`\n`Math.__lookupSetter__`\n\
    `Math.__proto__`\n`Math.constructor`\n`Math.hasOwnProperty`\n`Math.isPrototypeOf`\n\
    `Math.isEnumerable`\n`Math.toLocaleString`\n`Math.valueOf`\n`Math.E`\n`Math.LN10`\n\
    `Math.LN2`\n`Math.LOG10E`\n`Math.LOG2E`\n`Math.SQRT1_2`\n`Math.SQRT2`\n`Math.abs`\n\
    `Math.acos`\n`Math.acosh`\n`Math.asin`\n`Math.asin`\n`Math.atan`\n`Math.atan2`\n\
    `Math.atanh`\n`Math.cbrt`\n`Math.ceil`\n`Math.clz32`\n`Math.cos`\n`Math.cosh`\n\
    `Math.exp`\n`Math.expm1`\n`Math.floor`\n`Math.fround`\n`Math.hypot`\n`Math.imul`\n\
    `Math.log`\n`Math.log10`\n`Math.log1p`\n`Math.log2`\n`Math.max`\n`Math.min`\n\
    `Math.pow`\n`Math.random`\n`Math.round`\n`Math.sign`\n`Math.sin`\n`Math.sinh`\n\
    `Math.sqrt`\n`Math.tan`\n`Math.tanh`\n`Math.trunc`\n\nHow many rows and columns\
    \ you see depends on your screen size, but the above list contains all the properties\
    \ and functions from the Math module. To get another line in the prompt without\
    \ needing to execute the current line, press the **CTRL+C**. Those are just a\
    \ couple of REPL shortcuts, and they all make your coding more efficient. However,\
    \ something else helps increase productivity, and that's REPL commands.\n\n# Step\
    \ Four — The REPL Commands\n\nSome specific keywords help control REPL behavior,\
    \ and each starts with a dot (.).\n\n`.help` If you want to see all the commands\
    \ available, use this command: `: .help`. You won't see huge lists because there\
    \ are not many, but they are all useful for helping you do things in the REPL.\n\
    `.break` If you get stuck, this can get you out.\n`.clear` Alias for `.break`.\n\
    `.editor` Enter into editor mode.\n`.exit` Exit the REPL.\n`.load` Print the help\
    \ message. Load JS into the REPL session from a file.\n`.save` Save evaluated\
    \ commands from this session to a file. If you want to get out of the current\
    \ expression, press **C**, or if you want to exit the REPL, press **D**. If you\
    \ need refreshing on what a command does, simply go back to the `.help` command\
    \ to find out.\n\n.You can exit from a multi-line expression by using `.clear`\
    \ or `.break`. Let's start a for loop, like this:\n`> for (let i = 0; i < 1000000;\
    \ i++) {`\n\nIf you want to exit from more lines, use the `.clear` or `.break`\
    \ command rather than inputting the next line. This will break you out of the\
    \ loop:\n`... .break`\n\nA new prompt appears:\n`> `\n\nAnd the REPL goes to a\
    \ new line without having to execute the code. This works in a similar way to\
    \ pressing **CTRL+C**.\n\n`.save` and `.load` You can use the `.save` command\
    \ to store all code run since the REPL started in a single file, while the `.load`\
    \ command will run the JS code in a file in the REPL. Use the **CTRL+D** or `.exit`\
    \ command to get out of the session and start a new session using `node`. The\
    \ only code saved will be what you are going to write now. Create an array listing\
    \ some vegetables:\n`> vegetables = ['pepper', 'onion', 'potato']`\n\nThe next\
    \ line will show you the REPL output: `['pepper', 'onion', 'potato']` Save this\
    \ to a file and call it `vegetables.js`:\n`> .save vegetables.js`\n\nNow you will\
    \ see the following message: Session saved to: vegetables.js. The file will be\
    \ saved to the directory where the REPL was opened. For example, if it was opened\
    \ in your home directory, that's where your file will be saved: Come out of the\
    \ session and use `node` to open a new REPL. Load the file at the prompt like\
    \ this:\n`> .load vegetables.js`\n\nThe result will be `vegetables = ['pepper',\
    \ 'onion', 'potato'] ['pepper', 'onion', 'potato']`. The `.load` command can be\
    \ used to read each code line and execute it, as you would expect a JavaScript\
    \ interpreter to do. Now the `vegetables` variable can be used as though it had\
    \ been in the current session all the time. Type in the following:\n`> vegetables[1]`\n\
    \nPress **ENTER**, and you will see the following output: `'onion'` Any JavaScript\
    \ file can be loaded with this command, not just the items you save. To show you\
    \ a quick demonstration of this, open your code editor or, if you are using it,\
    \ a command-line editor called `nano`. Now create a file and call it `walnuts.js`:\
    \ You can load any JavaScript file with the `.load` command, not only items you\
    \ saved. Let's quickly demonstrate by opening your preferred code editor or `nano`,\
    \ a command-line editor, and create a new file called `walnuts.js`:\n`nano walnuts.js`\n\
    \nWith the file open, input the following: Now that the file is open, type the\
    \ following:\n`walnuts.js`\n`console.log('I love walnuts!');`\n\nSave and exit\
    \ by pressing **CTRL+X** and, in the directory where `walnuts.js` was saved, start\
    \ the REPL using `node`. Then load the `walnuts.js` file in the session:\n`> .load\
    \ walnuts.js`\n\nUsing the `.load` command, you can execute the `console.log`\
    \ statement, and you will see the following:\n`console.log('I love walnuts!');`\n\
    `I love walnuts!`\n`undefined`\n\nIf you end up using REPL for longer than you\
    \ thought you would, or you have a piece of code that you want to go further into\
    \ or share, use the `.load` and `.save` commands to help you. That was a brief\
    \ look at the REPL in Node.js. In the next chapter, we will look at the package\
    \ manager.\n\n# Chapter Three: Node.js - Package Manager (NPM)\n\nBy January 2017,\
    \ the npm had more than 350,000 different packages and, with that number continually\
    \ increasing, it is now one of the largest language code repositories in the world.\
    \ It’s safe to say that, if you can think of it, there is likely to be a package\
    \ for it!Npm started life as a way of downloading Node.js packages and managing\
    \ their dependencies. It has now become one of the most popular tools for use\
    \ in frontend JavaScript development and is used for lots of different things:\n\
    \n### Downloads and Installing Dependencies\n\nNpm is used to manage all your\
    \ project’s download dependencies. If your package contains a file called `package.json`,\
    \ running `npm install` will ensure that your project gets everything it needs.\
    \ This will all be installed in a folder called `node_modules` – if that folder\
    \ doesn’t already exist, npm will create it.\n\n### Installing and Updating Packages\n\
    \nSingle packages can be installed by running the following command:\n`npm install\
    \ <package-name>`\n\nMore often than not, other flags will be added to the command,\
    \ like:\n"
