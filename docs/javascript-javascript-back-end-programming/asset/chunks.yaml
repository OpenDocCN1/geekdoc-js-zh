    (eachName, index){console.log(index + ''. '' + eachName);});Here, an array containing
    names of Gods is looped, though, and the index numbers and relevant values are
    printed to the console. The forEach() parameter is a callback function, and this
    also accepts two parameters. These are references to the array name and the index
    values. However, what it doesn’t do is wait – it will run straight away.PromisesPromises
    are the newest async code style typically used in today’s Web APIs. One of the
    best examples is an API called fetch(), which is a modern version of XMLHttpRequest
    and is far more efficient. Here’s an example:fetch(''products.json'').then(function(response)
    {return response.json();}).then(function(json) {products = json;initialize();}).catch(function(err)
    {console.log(''Fetch problem: '' + err.message);});In this code, fetch() takes
    just one parameter: the URL of the network resource you want to fetch, and it
    returns a promise. Promises are objects that represent the failure or the completion
