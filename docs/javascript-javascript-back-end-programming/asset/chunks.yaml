    to a single machine over adding other machines, the Cluster module works well,
    helping you implement the strategy quickly.Even a small machine is likely to have
    several cores; even if you are not concerned about your Node server’s load, the
    Cluster module should be enabled anyway, increasing your server''s availability
    and fault tolerance level. It is easy to do and, when you use a process manager,
    such as PM2, for example, all you have to do is provide the launch command with
    an argument.Let’s look at how the cluster module is used natively and how it works.The
    Cluster module structure is quite simple. A master process is created to fork
    and manage several worker processes. The worker processes each represent an application
    instance that needs to be scaled. The master process handles all the incoming
    requests and decides which worker process an incoming request should be handled
    by.![](Image00020.jpg)The master process has a relatively easy job because it
    picks the worker process using a round-robin algorithm. This is already enabled
    as a default setting on all platforms except for Windows, and global modification
    can let the operating system handle the load balancing.The load is evenly distributed
    across the available processes by the round-robin algorithm, using a rotational
    basis process. The first incoming request goes to the first available worker process,
    the second to the second process, and so on. When the list has got to the end,
    the algorithm will go right back to the beginning and start over.This is one of
    the easiest load balancing algorithms to use, but it’s one of many. There are
    other algorithms that allow priorities to be assigned and the least loaded server
    selected or the one that responds the quickest.Load-Balancing an HTTP ServerLet’s
    get into some practical work. We want to close a simple HTTP server and load balance
    it using the Cluster module. We’ll use the hello-world example server from Node
    and modify it slightly to simulate CPU work before it responds.Create a server.js
    file and add the following code:// server.jsconst http = require(''http'');const
    pid = process.pid;http.createServer((req, res) => {for (let i=0; i<1e7; i++);
    // simulate CPU workres.end(`Handled by process ${pid}`);}).listen(8080, () =>
    {console.log(`Started process ${pid}`);});I have included process pid inside the
    HTTP response. This will verify our balancer will work by identifying the application
    instance that is handling a request.Before a cluster is created for cloning the
    server into several worker processes, we need to run a benchmark to see how many
    requests can be handled by the server every second. The Apache benchmarking tool
    is a good one for this; once the server code above has been run, go ahead and
    run the command below:ab -c200 -t10 http://localhost:8080/This uses 200 concurrent
    connections to test-load our server for 10 seconds.![](Image00021.jpg)My machine
    managed about 51 requests every second when I tried it, but these results will
    differ by machine and platform. This is just a simple test that gives you an idea
    of performance but must not be taken as being 100% accurate – all it will show
    you is what difference using a cluster makes on an environment with several cores.We
    now have a benchmark we can use for reference, so now is the time to use the Cluster
    module to use cloning to scale the application.Using the same server as your server.js
    file, create another new file and name it cluster.js. This is for the master process
    and needs the following content:// cluster.jsconst cluster = require(''cluster'');const
    os = require(''os'');if (cluster.isMaster) {const cpus = os.cpus().length;console.log(`Forking
    for ${cpus} CPUs`);for (let i = 0; i<cpus; i++) {cluster.fork();}} else {require(''./server'');}In
    our cluste.js file, first, we required the os and the cluster modules. The os
    module is used to read how many CPU cores that os.cpus() can work with. With the
    cluster module, we get the isMaster Boolean flag that is used to see if the cluster.js
    file is loaded as a master process. When the file is executed the first time,
    the master process is executed, and the isMaster flag is set a true. The master
    process can be instructed to fork the server as many times as there are CPU cores.Now
    that we have used the os module to read how many CPU cores we have,  we can use
    a for loop over the number to call the cluster.fork method. All the for loop does
    is creates the number of workers that matches the number of system CPUs, taking
    full advantage of the system’s processing power.When cluster.fork is executed
    in the master process, cluster.js is run once more but in worker mode this time,
    with isMaster set as false. If you need it, there is an isWorker flag that can
    be run in this case, set as true.The application can begin to do the real work
    when it is run in worker mode, and this is where the server logic needs to be
    defined. In this example, we can require the server.js file we created to do this.That’s
    pretty much it. That is how you can take advantage of your machine’s processing
    power and testing the cluster is as simple as running cluster.js:![](Image00022.jpg)Because
    my machine has eight cores, eight processes were started. What you must understand
    is that each process is a different Node.js process – every individual worker
    process has an event loop and memory space of its own.Now, when the webserver
    is hit multiple times, different worker processes will begin handling the request,
    and each process has its own process id. The workers are not sequentially rotated
    because the cluster module only picks a worker after performing a few optimizations,
    but the load will be evenly distributed throughout all the worker processes.The
    ab command we used above can now be used again to load-test the process clusters:![](Image00023.jpg)The
    cluster created on my machine could handle around 181 requests every second, compared
    to the 52 requests per second we got from a single Node process. With just a couple
    of lines of code, we tripled this simple app’s performance.Broadcasting Messages
    to All WorkersThe communication between the master and worker processes is simple
    because the child_process.fork API is being used under the hood by the Cluster
    module. This means there are also available communication channels between the
    master and each worker process.Using our example from above, the list of worker
    objects can be accessed using cluster.workers. This is another object containing
    references to each worker and used for reading information about them. Because
    there are communication channels between the master and worker processes, broadcasting
    a message to them all requires nothing more than a loop over the workers. Here’s
    an example:Object.values(cluster.workers).forEach(worker => {worker.send(`Hello
    Worker ${worker.id}`);});Object.values is used to obtain an array containing the
    workers in the cluster.workers object. The send function is used, for each individual
    worker, to send the values that we want.In our server.js file, which is the worker
    file, when a message is received from the master process, it is read by registering
    a message event handler on the global process object. Here’s an example:process.on(''message'',
    msg => {console.log(`Message from master: ${msg}`);});When I test these additions
    to our server/cluster example, this is what I see:![](Image00024.jpg)Here, the
    master process sent every worker a message. One thing to note from this is that
    the workers didn’t start in the order they were in.Let’s make things a bit more
    practical. We want to make our server reply with a number indicating how many
    users were created in the database. We need a mock function that will return the
    number indicating how many users are in the database and, whenever it is called,
    we want the value squared – this is known as dream growth:// **** Mock DB Callconst
    numberOfUsersInDB = function() {this.count = this.count || 5;this.count = this.count
    * this.count;return this.count;}// ****Whenever we call numberOfUsersInDB, we
    assume that a connection to the database has been made. To get away from multiple
    DB requests being made, we want this call cached for a set period, like 10 seconds. 
    What we don’t want is the eight forked workers doing their own requests because
    we don’t want eight requests every 10 seconds. Instead, the master process can
    just do one request and let the workers know the new user count value through
    the communication interface.For example, in the master process mode, we can use
    one loop for broadcasting that value to all of the workers:// Immediately after
    fork loop within isMaster=true blockconst updateWorkers = () => {const usersCount
    = numberOfUsersInDB();Object.values(cluster.workers).forEach(worker => {worker.send({
    usersCount });});};updateWorkers();setInterval(updateWorkers, 10000);Here, updateWorkers
    was invoked for the first time, and then a setInterval was used to invoke it every
    10 seconds. That way, all the workers will get the new value for the user count
    every 10 seconds via the communication channel, ensuring that only a single connection
    is made to the database.The usersCount value can be used in the server code, with
    the exact same handler for the message event. We need to use a module global variable
    to cache the value, and then we can use it where we need it.Here’s another example:const
    http = require(''http'');const pid = process.pid;let usersCount;http.createServer((req,
    res) => {for (let i=0; i<1e7; i++); // simulate CPU workres.write(`Handled by
    process ${pid}\n`);res.end(`Users: ${usersCount}`);}).listen(8080, () => {console.log(`Started
    process ${pid}`);});process.on(''message'', msg => {usersCount = msg.usersCount;});Here,
    the worker web server is made to respond with the value of the cached usersCount.
    If the cluster code were tested now, you would get a value of 25 within the first
    10 seconds, as the total user count from all the workers – and don’t forget, only
    one DB request gets made. After a further 10 seconds, you would see all the workers
    start to report the new count of 625, with just one more request being made.This
    is all down to there being communication channels running between the workers
    and the master process.Increasing Availability of the ServerWhen you run a single
    Node application instance, there is a problem in that the instance must be restarted
    whenever it crashes. That means there will be some downtime between the crash
    and the restart, even with automated processes.This will also apply when the server
    needs to deploy new code and has to be restarted – with a single instance, there
    will be some downtime, and that will affect the system availability.When you are
    working with several instances, you just need a few extra lines of code to increase
    the system availability.The example below is a simulation of the server process
    randomly crashing. To do this a call to process.exit is made in a timer that will
    fire after a random time:// In server.jssetTimeout(() => {process.exit(1) // death
    by random timeout}, Math.random() * 10000);When worker processes exit in this
    manner, the master process is sent a notification. This is done with the cluster
    model object’s exit event and a handler can be registered for the event, with
    a new worker process being forked whenever another worker process exits. Here’s
    an example:// Immediately after fork loop within isMaster=true blockcluster.on(''exit'',
    (worker, code, signal) => {if (code !== 0 && !worker.exitedAfterDisconnect) {console.log(`Worker
    ${worker.id} crashed. ` +''Starting a new worker...'');cluster.fork();}});It makes
    sense to add an if condition as this ensures the worker process crashed and wasn’t
    disconnected manually by the user or that the master process didn’t kill it. For
    example, the master process may determine that too many resources are being used
    based on what load patterns it observes, and if that is the case, it will need
    to kill some workers. To do this, the disconnect methods can be used on a worker
    and the exitedAfterDisconnect flag set as true. The if statement we included guards
    against a new worker being forked in that case.If the cluster were run using the
    above handler, along with the server.js random crash, workers will begin crashing
    after a random amount of time in seconds. The master process will begin forking
    new ones to increase the system’s availability. The availability can actually
    be measured with the ab command we used earlier – it will show you the number
    of requests the server cannot handle. That’s because some of the requests will
    be unlucky enough to face the crash and that cannot really be avoided.I tested
    this code, and I got 17 failed requests in the 10-second test out of more than
    1800, and that was using 200 concurrent requests:![](Image00025.jpg)That shows
    availability of more than 99%. With just a couple of extra lines of code, we can
    forget about process crashes because the master guardian is watching them for
    us.Zero-Downtime RestartsSo, what about when we want all worker processes restarted,
    say when we need new code deployed?We’ve got several running instances so, rather
    than all of them be restarted together; they can be restarted one at a time, leaving
    the other workers serving requests while one is restarted.This is pretty easy
    to implement using the Cluster module. Once the master process is up and running,
    we don’t want it restarted so we need to find a way of sending a command to it
    to tell it to begin restarting the workers. If you are using Linux, this is easy
    because you just listen to SIGUSR2, or some other process signal. The kill command
    can be triggered on the process id, and the signal passed:// In Nodeprocess.on(''SIGUSR2'',
    () => { ... });// To trigger that$ kill -SIGUSR2 PIDIn this way, the master process
    is not killed, and we can tell it to start doing something else. SIGUSR2 is the
    correct signal to use in this case because it is a user command. SIGUSR1 is used
    by Node as a debugger, and you really don’t want any conflicts.On Windows, there
    is no support for those process signals, so another way needs to be found. There
    are few ways – we could use socket or standard input. Or we could monitor the
    process.pid file for a remove event. To keep things simple, I’m using Linux though,
    so you may just have to read this and not follow along practically if you use
    another system.While Node does work okay on Windows, Linux is a safer platform
    for hosting Node applications on. It might interest you to know that, if you are
    using the latest Windows versions, you can make use of a Linux subsystem – if
    you are interested, look at Bash on Windows.Back to our example,  when the SIGUSR2
    signal is received by the master process, it tells it the workers can be restarted
    but we want this done one at a time. What this means is that the master process
    should only restart a worker when the previous one has been restarted.To start
    this, what we need is a reference to all the current workers and we do this using
    the cluster.workers object. Then, the workers can be stored in an array:const
    workers = Object.values(cluster.workers);After that, a restartWorker function
    can be created to receive an index for the worker that needs to be restarted.
    That way, the function can call itself when it is ready for a worker, ensuring
    the workers are restarted in sequence. Here’s an example of that function:const
    restartWorker = (workerIndex) => {const worker = workers[workerIndex];if (!worker)
    return;worker.on(''exit'', () => {if (!worker.exitedAfterDisconnect) return;console.log(`Exited
    process ${worker.process.pid}`);cluster.fork().on(''listening'', () => {restartWorker(workerIndex
    + 1);});});worker.disconnect();};restartWorker(0);In the function, we get a reference
    to worker that needs to be restarted. This function is being called recursively
    so a sequence can be forms so we need to add a stop condition. When there are
    no workers left to restart, we can return. Then, we want to use worker.disconnect
    to disconnect the worker but, before the next worker is restarted, a new worker
    needs to be forked to replace the one being disconnected.The exit event can be
    used on the worker to fork new workers when a current one is already in existence.
    However, we need to be sure that, after a disconnect call, the exit action got
    triggered, and we can do that using the exitedAfterDisconnect flag. If the flag
    is not true, something other than the disconnect call triggered the exit – in
    that case, we can return, and we don’t need to do anything else. However, if it
    is true, a new worker can be forked to replace the disconnected one.When the new
    worker is ready, the next one can be restarted. However, keep in mind that fork
    processes are not synchronous, so the next worker cannot just be restarted after
    the call to fork. Instead, the listening event needs to be monitored on the new
    forked worker – this will tell us that the worker is connected. Once we get the
    event, the next worker in the sequence can be restarted safely.That is all that
    is needed for a restart with zero downtime. Testing it is just a case of reading
    the master process id that is going to the SIGUSR2 signal:console.log(`Master
    PID: ${process.pid}`);Start the cluster, then the master process id needs to be
    copied, and the kill -SIGUSR2 PID command is used to restart the cluster. The
    ab command can also be run while the cluster is being restarted, showing you the
    effect this will have on the system availability. In theory, you should not get
    any failed requests:![](Image00026.jpg)PM2, and other process monitors that you
    use in production should make all of this pretty easy to do, as well as providing
    you with tons of features to keep an eye on your Node application’s health. As
    an example, if you use PM2 and want a cluster launched for any application, all
    you need is the -i argument:pm2 start server.js -i maxAnd a zero downtime restart
    requires just this simple command:pm2 reload allHowever, while it''s easy for
    me to tell you which commands to use, understanding what is happening under the
    hood is very important.Shared State and Sticky Load BalancingLike all good things,
    there is always a cost. When a Node application is load-balanced, some of the
    features that suit single processes are lost, and this is similar to what you
    might know as thread safety in other programming languages. Thread safety is all
    about data sharing between threads but, in our cases, it’s all about data sharing
    between the worker processes.Take the cluster setup, for example. Things can no
    longer be cached in memory because each worker process has memory space of its
    own. Caching something in one worker’s memory means it is not accessible to any
    of the other workers.If something needs to be cached in a cluster setup, a separate
    entity is required. All workers need to be able to read and write to the API for
    that entity, which could be a database server or, where you want in-memory cache
    used, Redis or another server could be used. Alternatively, you could create a
    Node process containing a Read/Write API that all the other workers can talk to.![](Image00027.jpg)This
    isn’t a disadvantage though, and you shouldn’t see it that way – using separate
    entities for caching needs falls under one of the scalability strategies – decomposing.
    In fact, even if you are using a single-core machine, you should really be doing
    this anyway.When running a cluster setup, besides caching, something else becomes
    a problem – general stateful communication. Because there is no guarantee the
    communication will be with the same worker, it isn’t an option to create stateful
    channels on any specific worker.  User authentication is one of the most common
    examples of this:![](Image00028.jpg)In a cluster setup, the authentication request
    is sent to the master balancer process. From there, it is sent on to a worker
    – in this example, we assume that to be Worker A:![](Image00029.jpg)Now, Worker
    A recognizes this user’s state. However, if another request is made by the same
    user, eventually it will be sent to the other workers by the load balancer, even
    though they don’t have the user authenticated. It will no longer work to keep
    a reference to authenticated user sessions in memory for a single instance.We
    can solve this in a few ways. We could just share the state across all the workers
    – this is done by storing the information for these sessions in a Redis node or
    a shared database. However, some code changes would be needed for this strategy
    and it isn’t always an option to do that.If modifying the code to make this shared
    session storage is not possible, another strategy could be used, although it isn’t
    as efficient.  You can use something called Sticky Load Balancing, and implementing
    it is easier as it is supported out of the box by many load balancers. It’s a
    simple idea – when a user is authenticated with an instance of a worker, a record
    of the relationship is maintained on the load balancer level:![](Image00030.jpg)Now,
    when a new request is sent by the same user, a lookup is done in the record to
    work out which server has the authenticated session; the requests are then sent
    to that server, rather than using the standard distributed behavior. That way,
    the server-side code doesn’t have to be changed. What we don’t get is the load
    balancing benefits for the authenticated users so it really is something you should
    use if there is no other way.Sticky load balancing is not actually supported by
    the cluster module, but there are some load balancers that do it by default.Chapter
    Sixteen: Node.js PackagingIn recent times, the popularity of Node.js has shot
    up, with JavaScript being ranked as the top programming language for many years
    – by now, you should understand why that isn’t so surprising.JavaScript is the
    ubiquitous front-end web programming language, meaning developers use and understand
    it, no matter what programming language they have used in the past – C, C#, Java,
    Ruby, and so on. Because the number of developers already using JavaScript is
    so huge, the community is already full of frameworks and libraries, offering help
    for just about every requirement. That means it’s the right approach to use it
    for server-side projects.Things Do Go WrongSometimes, and for no apparent reason,
    many programmers who switch from a compiled to a scripted language leave their
    good programming habits behind.All too often, we see programmers developing applications
    in Node.js, or pure JS applications using Node.js, storing their code somewhere
    like GitHub and then trying to pull it straight to their production servers. Then
    they follow it with an npm install and a web build – sometimes, they write tests
    but, more often than not, they decide it is much easier to rebuild it all whenever
    they deploy their application. This can cause a number of problems:'
  toc: []
  trans: "\n最后一种策略是将应用程序拆分为多个较小的实例——每个实例负责应用程序数据的一个较小部分。在数据库中，你经常看到这种策略被称为分片（sharding）或水平分区（horizontal\
    \ partitioning）。在数据分区中，每次操作之前都需要一个查找步骤。这决定了应该使用哪个应用程序实例。例如，我们可能想根据语言或国家对用户进行分区，那么我们需要先查找这些信息。\n\
    \n当你成功扩展一个大型应用程序时，最终这三种策略都应该被实现。虽然 Node.js 让实现这一切变得简单，但我将重点关注第一种策略——克隆（cloning），因为它最基础，并将查看实现它所需的\
    \ Node.js 工具。在继续之前，你确实需要很好地了解 Node.js 子进程（child processes）是如何运作的。\n\n## Cluster\
    \ 模块\n\n你可以使用内置的 `cluster` 模块在环境的 CPU 核心上启用负载均衡。该模块基于 `child process` 模块中的 `fork`\
    \ 方法，允许主应用程序进程根据 CPU 核心数进行相应次数派叉。然后，它会接管发送到主进程的请求并通过派生进程进行负载均衡。\n\n`Cluster` 模块是\
    \ Node.js 提供的一个辅助工具，帮助我们实现这种克隆策略，但仅限于单机。当你拥有具有多个资源的大型机器，或者当向单台机器添加额外资源比添加其他机器更便宜、更方便时，`Cluster`\
    \ 模块运行良好，帮助你快速实现该策略。\n\n即使是小型的机器也可能有几个核心；即使你不担心 Node 服务器的负载，也应该启用 `Cluster` 模块，以增加服务器的可用性和容错能力。这很容易做到，而且当你使用进程管理器（例如\
    \ `PM2`）时，你只需要提供带参数的启动命令即可。\n\n让我们看看 `cluster` 模块是如何原生使用的以及它是如何工作的。`Cluster` 模块的结构非常简单。创建一个主进程（master\
    \ process）来派生并管理多个工作进程（worker processes）。每个工作进程代表一个需要扩展的应用程序实例。主进程处理所有传入的请求，并决定由哪个工作进程来处理该请求。\n\
    \n![](img/Image0002.jpg)\n\n主进程的工作相对简单，因为它使用轮询算法（round-robin algorithm）来选择工作进程。除了\
    \ Windows 之外，所有平台默认都启用了此设置，通过全局修改可以让操作系统处理负载均衡。\n\n轮询算法通过旋转基准将负载均匀地分布在所有可用进程中。第一个传入的请求发送到第一个可用工作进程，第二个发送到第二个进程，依此类推。当列表到达末尾时，算法将回到开头并重新开始。\n\
    \n这是最易使用的负载均衡算法之一，但它只是众多之一。还有其他算法允许分配优先级，并选择负载最低或响应最快的的服务器。\n\n## HTTP 服务器的负载均衡\n\
    \n让我们开始一些实际工作。我们想构建一个简单的 HTTP 服务器并使用 `Cluster` 模块对其进行负载均衡。我们将使用 Node 的 hello-world\
    \ 示例服务器，并对其进行轻微修改，以在响应之前模拟 CPU 工作。\n\n创建一个 `server.js` 文件并添加以下代码：\n\n```javascript\n\
    // server.js\nconst http = require('http');\nconst pid = process.pid;\nhttp.createServer((req,\
    \ res) => {\n  for (let i=0; i<1e7; i++); // simulate CPU work\n  res.end(`Handled\
    \ by process ${pid}`);\n}).listen(8080, () => {\n  console.log(`Started process\
    \ ${pid}`);\n});\n```\n\n我在 HTTP 响应中包含了 `process.pid`。这将通过识别处理请求的应用程序实例来验证我们的负载均衡器工作工作。\n\
    \n在创建集群以将服务器克隆到多个工作进程之前，我们需要运行一个基准测试，查看服务器每秒可以处理多少请求。Apache 基准测试工具是一个很好的选择；一旦运行了上面的服务器代码，请运行下面的命令：\n\
    \n```bash\nab -c200 -t10 http://localhost:8080/\n```\n\n这使用 200 个并发连接来测试服务器 10\
    \ 秒的负载。\n\n![](img/Image00021.jpg)\n\n当我尝试时，我的机器每秒处理大约 51 次请求，但这些结果会因机器和平台而异。这只是一个让你对性能有概念的简单测试，但不能认为是\
    \ 100% 准确——它只会向你展示在具有多个核心的环境中使用集群会带来什么差异。\n\n现在我们有了可以参考的基准测试，现在是时候使用 `Cluster`\
    \ 模块通过克隆来扩展应用程序了。使用与你的 `server.js` 文件相同的服务器，创建另一个新文件并命名为 `cluster.js`。这是用于主进程，需要以下内容：\n\
    \n```javascript\n// cluster.js\nconst cluster = require('cluster');\nconst os\
    \ = require('os');\nif (cluster.isMaster) {\n  const cpus = os.cpus().length;\n\
    \  console.log(`Forking for ${cpus} CPUs`);\n  for (let i = 0; i<cpus; i++) {\n\
    \    cluster.fork();\n  }\n} else {\n  require('./server');\n}\n```\n\n在我们的 `cluster.js`\
    \ 文件中，我们首先引入了 `os` 和 `cluster` 模块。`os` 模块用于读取有多少个 CPU 核心。通过 `cluster` 模块，我们获得\
    \ `isMaster` 布尔标志，用于判断是否为主进程。当 `cluster.js` 文件第一次执行时，`isMaster` 标志被设置为 true。主进程可以被指示根据\
    \ CPU 核心数来派生服务器。\n\n现在我们已经使用了 `os` 模块来读取有多少个 CPU 核心，可以使用循环来调用 `cluster.fork()`。当\
    \ `cluster.fork()` 在主进程中执行时，`exitedAfterDisconnect` 标志被设置为 false。即使是小机器也可能有几个核心；即使你不担心你的\
    \ Node 服务器的负载，也应该启用 `Cluster` 模块，以增加服务器的可用性和容错能力。这很容易做到，而且当你使用进程管理器（例如 `PM2`）时，你只需要提供带参数的启动命令。\n\
    \n让我们看看 `cluster` 模块是如何原生使用的以及它是如何工作的。`Cluster` 模块的结构非常简单。创建一个主进程来派生并管理多个工作进程。每个工作进程代表一个需要扩展的应用程序实例。主进程处理所有传入的请求，并决定由哪个工作进程来处理该请求。\n\
    \n![](img/Image0002.jpg)\n\n## 广播消息\n\n主进程和工作进程之间的通信是简单的，因为 `Cluster` 模块在底层使用了\
    \ `child_process.fork`。这意味着主进程和每个工作进程之间有可用的通信通道。使用上面的示例，可以使用 `cluster.workers`\
    \ 访问工作对象的列表。`Object.values` 用于获取包含工作对象的数组。`send` 函数用于向每个工作进程发送我们想要的值。在我们的 `server.js`\
    \ 文件中，当工作进程接收到主进程的消息时，在全局进程上注册一个消息处理器。这是一个示例：\n\n```javascript\nprocess.on('message',\
    \ msg => {\n  console.log(`Message from master: ${msg}`);\n});\n```\n\n当我测试这些\
    \ server/cluster 示例添加时，我看到的是：\n\n![](img/Image024.jpg)\n\n这里，主进程向每个工作进程发送了消息。这一点要注意，工作进程并不是按照顺序启动的。让我们让事情变得更实用。我们想让服务器返回一个指示数据库中创建了多少用户的数字。我们需要一个模拟函数返回数据库中的用户数量，每当被调用时，我们想要该值的平方——这被称为增长：\n\
    \n```javascript\n// **** Mock Call\nconst numberOfUsersInDB = function() {\n \
    \ this.count = this.count || 5;\n  this.count = this.count * this.count;\n  return\
    \ this.count;\n}\n```\n\n每当我们调用 `numberOfUsersInDB`，假设已经建立了数据库连接。为了避免多次数据库请求，我们希望此调用缓存一段时间，例如\
    \ 10 秒。我们不希望 8 个派生的工作进程执行自己的请求，因为我们不想每 10 秒执行 8 次请求。相反，主进程只需执行一次请求并通过通信接口让工作知道新的计数。例如，在主进程模式下，我们可以使用一个循环将该值广播给所有工作：\n\
    \n```javascript\n// isMaster=true 块中 fork 循环之后\nconst updateWorkers = () => {\n\
    \  const usersCount = numberOfUsersInDB();\n  Object.values(cluster.workers).forEach(worker\
    \ => {\n    worker.send({ usersCount });\n  });\n};\nupdateWorkers();\nsetInterval(updateWorkers,\
    \ 10000);\n```\n\n这里`updateWorkers` 被第一次调用，然后使用 `setInterval` 每 10 秒调用它一次。这样，所有工作都会每\
    \ 10 秒通过通信通道获取用户计数的新值，确保只到数据库建立单个连接。`usersCount` 值可以在服务器代码中使用，使用完全相同的消息事件处理器。我们需要使用一个模块全局变量来缓存该值，然后我们可以在需要的地方使用它。这是另一个示例：\n\
    \n```javascript\nconst http = require('http');\nconst pid = process.pid;\nlet\
    \ usersCount;\nhttp.createServer((req, res) => {\n  for (let i=0; i<1e7; i++);\
    \ // simulate CPU work\n  res.write(`Handled by process ${pid}\\n`);\n  res.end(`Users:\
    \ ${usersCount}`);\n}).listen(8080, () => {\n  console.log(`Started process ${pid}`);\n\
    });\nprocess.on('message', msg => {\n  usersCount = msg.usersCount;\n});\n```\n\
    \n## 增加服务器的可用性\n\n当你运行单个 `Node.js` 实例时，问题在于实例崩溃时必须重启。这意味着在崩溃和重启之间会有一些停机。这同样适用于服务器需要部署新代码并重启的情况。当你与多个实例一起时，只需要几行额外代码来增加可用性。下面的示例是服务器随机崩溃的模拟。这在随机时间调用\
    \ `process.exit`：\n\n```javascript\n// In server.js\nsetTimeout(() => {\n  process.exit(1)\
    \ // death by random\n}, Math.random() * 10000);\n```\n\n当工作进程以这种方式退出时，主进程会收到通知。这是通过\
    \ `cluster` 对象的 `exit` 事件完成的，在这种情况下会派生一个新的工作。我们可以为该事件注册处理程序：\n\n```javascript\n\
    // isMaster=true 块中 fork 循环之后\ncluster.on('exit', (worker, code, signal) => {\n\
    \  if (code !== 0 && !worker.exitedAfterDisconnect) {\n    console.log(`Worker\
    \ ${worker.id} crashed. Starting new worker...`);\n    cluster.fork();\n  }\n\
    });\n```\n\n添加 `if` 条件是有意义的，因为它确保了工作是崩溃了，而不是被用户或主进程手动断开。主进程可能会根据观察到的负载判断使用了过多资源，如果是这样，将杀死某些工作。为了做到这一点，可以在工作上使用\
    \ disconnect 方法，并将 `exitedAfterDisconnect` 标志设置为 true。可用性实际上可以使用我们之前使用的 `ab` 命令来测量——我测试了这段代码，在\
    \ 200 个并发请求的 10 秒测试中，得到了 7 次失败请求：\n\n![](img/Image025.jpg)\n\n这显示可用性高于 99%。只需要几行额外代码，我们就可以忘记进程崩溃了，因为主进程在为我们监控它们。\n\
    \n## 零停机重启\n\n那么，当我们想要重启所有工作进程时（例如需要部署新代码时）该怎么办？我们有多个运行中的实例，与其让它们一起重启，我们可以一个一个重启，让其他工作继续服务。使用\
    \ `Cluster` 模块实现这一点非常容易。一旦主进程启动运行，我们不希望它重启，因此我们需要找到向它发送命令来开始重启的方法。如果你使用的是 Linux，这很容易，因为只需要监听\
    \ `SIGUSR2` 或其他进程信号。可以在进程 ID 上触发 `kill` 命令并传递信号：\n\n```javascript\n// In Node\n\
    process.on('SIGUSR2', () => {\n  // ...\n});\n// To trigger that\n$ kill -SIGUSR2\
    \ PID\n```\n\n通过这种方式主进程不会被杀死，我们可以告诉它启动。`SIGUSR2` 是这种情况下使用的正确信号，因为它是用户命令。Node 使用\
    \ `SIG1` 作为调试器，我们真的不希望出现任何冲突。在 Windows 上不支持这些进程信号，因此需要找到另一种方法。有几种方法——我们可以使用 socket\
    \ 或标准输入。或者我们可以监控 `process.pid` 文件的删除事件。为了保持简单，我使用的是 Linux，但如果你使用其他系统，你可能只需要读取但不实际遵循。虽然\
    \ Node 在 Windows 上运行良好，但 Linux 是托管 Node 应用程序的更安全的平台。你可能感兴趣的是，如果你使用最新版本的 Windows，可以利用\
    \ Linux 子系统——如果你感兴趣，查看 Windows 上的 Bash。\n\n回到我们的示例，当主进程接收到 `SIGUSR2` 信号时，它告诉工作可以重启，但我们希望逐一个地进行。这意味着主进程应该只在上一个工作重启后才重启下一个。为了启动这一点，我们需要所有当前工作的引用，我们通过\
    \ `cluster.workers` 对象来实现这一点。然后，工作工作可以存储在数组中：\n\n```javascript\nconst workers\
    \ = Object.values(cluster.workers);\n```\n\n之后，可以创建一个 `restartWorker` 函数来接收需要重启的工作索引。这样，函数在准备好处理工作时可以调用自己，确保工作按顺序重启。以下是该函数的示例：\n\
    \n```javascript\nconst restartWorker = (workerIndex) => {\n  const worker = workers[workerIndex];\n\
    \  if (!worker) return;\n  worker.on('exit', () => {\n    if (!worker.exitedAfterDisconnect)\
    \ return;\n    console.log(`Exited process ${worker.id}`);\n    cluster.fork().on('listening',\
    \ () => {\n      restartWorker(workerIndex + 1);\n    });\n  });\n  worker.disconnect();\n\
    };\nrestartWorker(0);\n```\n\n在函数中，我们得到了一个需要重启的工作引用。由于 `cluster.fork()` 在主进程中执行时递归调用该函数，可以形成一个序列。当没有工作需要重启时，我们可以返回。然后，我们想要使用\
    \ `worker.disconnect` 来断开，但在下一个工作重启之前，会派生一个新的工作来替换被断开的。`exit` 事件可以用于工作以派生新的工作。如果\
    \ `exitedAfterDisconnect` 标志设置为 true，这对于零停机重启是需要的。\n\n## 共享状态与负载均衡\n\n就像所有好事情一样，总会有代价。当\
    \ Node 应用被负载均衡时，某些功能丢失了，这类似于你在其他语言中可能熟悉的线程安全（thread safety）。线程安全是指线程之间的数据共享，但在我们的案例中，它是工作进程之间的数据共享。由于每个工作进程都有自己的内存，因此在内存中缓存数据已经不再工作了。在集群设置中，如果某些东西需要缓存，则需要单独的实体。所有工作都需要能够读取和写入该实体的\
    \ API，这可以是数据库或你想要使用的内存缓存的另一个服务器。或者，你可以创建一个所有工作都可以通信的 Node 读写 API。\n\n![](img/Image027.jpg)\n\
    \n这并不是一个缺点，你不应该以这种方式看待它——在扩展性策略下，拆分是必要的。事实上，即使你使用的是单核机器，你也应该真的这样做。当运行集群设置时，除了缓存之外，另一个问题变成了问题——通用状态通信。因为无法保证通信会在同一个工作上进行，在任何特定工作上创建状态通道并不是选项。用户认证是这最常见的例子之一：\n\
    \n![](img/Image028.jpg)\n\n在集群设置中，认证请求被发送到主进程。从那里，它被发送到一个工作——在这个示例中，我们假设它是工作 A：\n\
    \n![](img/Image029.jpg)\n\n现在，工作 A 识别了这个用户的状态。然而，如果同一个用户发出了另一个请求，它会被负载均衡器发送到其他工作，尽管它们没有该用户的认证信息。对于单个实例，在内存中保留已认证的用户会话已不再工作了。我们可以通过几种方法解决这个问题。我们可以直接在所有工作之间共享状态——通过将这些会话存储在\
    \ Redis 或共享数据库中来实现。然而，这种策略需要一些代码更改，而且这并不总是可行的。\n\n如果修改代码来实现共享会话存储是不可能的，可以使用另一种策略，尽管它没有那么。你可以使用被称为粘性负载均衡（Sticky\
    \ Load Balancing）的东西，实现它更容易，因为许多负载均衡器原生支持它。这是一个简单的想法——当用户与工作实例进行认证时，在负载均衡器级别维护该关系的记录：\n\
    \n![](img/Image030.jpg)\n\n现在，当同一个用户发送新请求时，会在记录中进行查找以确定哪个服务器拥有该认证会话；然后请求会被发送到该服务器，而不是使用标准的分布式行为。\n\
    \n## 第十六章：Node.js 打包\n\n最近，Node.js 的流行性飙升，JavaScript 多年来一直被列为顶级编程语言——到现在，你应该理解为什么这并不意外了。JavaScript\
    \ 是无处不在的前端 Web 编程语言，这意味着开发者无论过去使用过什么编程语言（C、C#、Java、Ruby 等）都使用并理解它。因为已经使用 JavaScript\
    \ 的开发者人数如此巨大，社区已经充满了框架和库，为每种需求提供帮助。这意味着将它用于服务器端项目是正确的方法。事情有时会出错，而且由于没有明显的原因，许多从编译语言切换到脚本语言的程序员丢掉了他们良好的编程习惯。我们经常看到程序员在\
    \ Node.js 中开发应用程序，或者使用 Node.js 开发纯 JS 应用，将他们的代码存储在 GitHub 等地方，然后尝试直接拉取到他们的生产服务器上。然后紧接着执行\
    \ `npm install` 和 Web 构建——有时他们会编写测试，但更多时候，他们决定每当部署应用程序时重新构建一切要容易得多。这会导致许多问题：\n\
    \n"
- fmt: "\n## Dependency Versioning\n\nWhen your `packages.json` file includes a semver,\
    \ you could end up with your config telling you a package dependency requires\
    \ a match to a specific version, say `4.17.2`. Your production machine will pull\
    \ `4.17.3` down, and then `4.17.4` is used to run tests against. By the time you\
    \ get to deploy your production, the author of the library has updated it once\
    \ again, and your software ends up on version `4.17.9` – this is in production.\
    \ Many times, library authors have updated their libraries with significant changes\
    \ that can break production, whether they did it accidentally or just didn’t realize\
    \ what effect their changes would have. Their update bumps up the version number,\
    \ and this can cause broad versioning, leading to serious code crashes. This is\
    \ further exacerbated by a dependency chain that is incredibly complex in your\
    \ `node_modules`.\n\nLet’s say you have `Module A`, an explicitly dependent module\
    \ that depends on a version range of `Module B`. In turn, `Module B` is dependent\
    \ on a version range of several more modules. Don’t forget – when `npm install`\
    \ is run, you are not just dynamically determining your modules and resolving\
    \ them – it is everything else in the dependency chain. Using the recently added\
    \ `package-lock` feature can go some way towards mitigating this so long as the\
    \ file is committed to source control.\n\n## Deployment Success is Not In Your\
    \ Control\n\nWhenever your application is deployed, you download new dependencies\
    \ that are potentially untested. And that’s only if everything goes to plan. It\
    \ isn’t news that `npm` doesn’t support the ability to push new files onto old\
    \ versions anymore but, more than once, we’ve seen production releases failing\
    \ because the packages weren’t downloaded – typically because `npm` was down or\
    \ there were issues with the network. Often, this installation failure goes hand-in-hand\
    \ with the old version being overwritten. The result of this is a server that\
    \ is worth nothing until `npm` access is brought back.\n\nI can tell you of one\
    \ case where a developer was doing a fresh install every time they wanted a new\
    \ server from their `AWS Elastic Beanstalk`, when the farm they already had was\
    \ loaded. Because the `npm` servers were out, the new ones couldn’t come online\
    \ and because not all the traffic could be handled, the website, which was working\
    \ just fine, suddenly crashed too – many days before, the original installation\
    \ had succeeded and all the new servers were getting the same product version\
    \ deployed to them.\n\nLuckily, there is a way out of this.\n\n## Packaging Your\
    \ Node.js App\n\nWe should be able to agree on one thing – all JS applications\
    \ should be treated the way we treat any other compiled language – at build time,\
    \ the applications should be packaged up into an artifact that can be deployed.\n\
    \nLet’s assume, for the purposes of this chapter, that we are going to develop\
    \ the `RandomQuote-JS` dummy app. We could do this as a very simple build step:\n\
    \n```bash\nnpm install\ngulp build    # insert the build tool you want\nzip -r\
    \ ../RandomQuotes.1.0.zip .\n# ../RandomQuotes.1.0.zip created (5.2 MB)\n```\n\
    \nThe `zip` file that gets generated could then be extracted onto your production\
    \ servers and the application would be ready to run as it is. However, here we\
    \ have zipped the entire application directory and most of this is the libraries\
    \ needed to compile and debug the application. The `typescript` compilers are\
    \ not really needed, neither are the testing frameworks or `webpack` libraries,\
    \ once the application has been fully built and is ready to put into production.\
    \ The big question is, how do we keep the production and dev-time dependencies\
    \ separate?\n\nRunning the following `npm` removes all the packages specified\
    \ in the `package.json` `devDependencies` section from `node_modules`:\n\n```bash\n\
    npm prune --production\n```\n\nIt is recommended that you run this before your\
    \ entire application is zipped into an archive file, no matter whether you use\
    \ a manual process or a deployment tool such as `VSTS`, `Octopus Deploy`, or `Chef`.\n\
    \nWe can make the entire process simpler by using `octojs`. This is Node.js `cli`\
    \ tool released by `Octopus Deploy` and helps us create the `zip` or `tar.gz`\
    \ files without needing to do that prune step first. By default, the package name\
    \ gets generated with the same name and same version as you have in the `package.json`\
    \ file for your project. However, all of those values can be overridden. You can\
    \ use `octojs` in two ways – imported and then used as part of your application’s\
    \ build process or through the console.\n\n### Package Using the Command-Line\n\
    \nThe easiest way is globally installing the tool:\n\n```bash\nnpm install -g\
    \ @octopusdeploy/octojs\n```\n\nNow, you can invoke `octojs` from inside any project\
    \ and get it to package your application. Let’s assume that we built our project\
    \ and tested it; we can now package it in this simple way:\n\n```bash\noctojs\
    \ pack -O C:\\Bin --gitignore --dependencies prod\nCreated package C:\\Bin\\RandomQuotes.1.0.0.zip\
    \ (1.66 MB)\n```\n\nThe generated package size is significantly smaller and the\
    \ ID and version for the package come from the project. Now the package is generated,\
    \ it can be pushed straight to the built-in `Octopus Deploy` feed so it can be\
    \ deployed:\n\n```bash\noctojs push --package C:\\Bin\\ramdomquotes.1.0.0.zip\
    \ --server http://octopusserver.acme.com --apiKey API-F2K29BA08AA123\nPush response\
    \ 201 - Created\n```\n\n### Package Using the Code\n\nAn alternative way is to\
    \ package your project and push it through your code by one step, using the same\
    \ library:\n\n```javascript\nvar octo = require(\"@octopusdeploy/octojs\");\n\
    octo.pack({dependencies: 'prod', bypassDisk: true, root: \".\"},(err, data) =>\
    \ {\n  console.log(\"Uploading package: \"+ data.name);\n  octo.push(data.stream,\
    \ {apiKey: 'API-F2K29BA08AA123',server: 'http://octopusserver.acme.com',name:\
    \ data.name}, () => {\n    console.log(\"Uploaded\");\n  });\n});\n```\n\nNode\
    \ is a Serious Language\n\nAnd it’s time we started treating it as such in our\
    \ CD pipelines. What this means is that dependencies can be downloaded and built\
    \ or transpiled on the build server once and the result packaged with its dependencies\
    \ into one self-contained package for deployment.\n\n## MongoDB + Mongoose\n\n\
    MongoDB has to be one of the most popular of all NOSQL databases and it is backed\
    \ up with a fantastic ecosystem and a great community. This chapter will cover\
    \ some of the best practices to follow when you use MongoDB and Mongoose with\
    \ your Node.js applications:\n\n### Why You Need Mongoose\n\nUnderstanding Mongoose\
    \ requires that we understand the way MongoDB and databases work at an architectural\
    \ level.\n\nLet’s say you have:\n\n1.  A database server, i.e. a MongoDB community\
    \ server\n2.  A running Node.js script as a process\n"
