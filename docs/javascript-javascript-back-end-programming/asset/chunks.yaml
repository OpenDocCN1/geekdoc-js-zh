  trans: "\n一旦 `fs.readFile` 获取了 `funFileName` 文件，回调函数就会执行。该函数随后将处理任何抛出的错误，并将检索到的文件打印到控制台。\n\
    \n回调函数接受两个参数或参数——`err` 和 `file`。按照约定，回调函数的第一个参数是错误。如果父函数抛出错误，它将在该处**待处理；但如果没有抛出错误（这有时会发生），函数的第一个参数必须是\
    \ `null`。约定还规定，随其后的函数是响应数据。\n\n好了，这没问题，但是，我们为什么不直接这样写代码呢？\n\n```javascript\nlet\
    \ file = fs.readFile(fooFileName);\nconsole.log(\"file: \", file);\n```\n\n对此问题的简短回答是\
    \ `async`（异步）。第二个示例显示，当我们尝试打印它时，该文件尚未被定义。这是因为在到达 `console.log()` 之前，`fs.readFile`\
    \ 还没有完成获取。\n\n然而，值得注意的是，以下代码可以运行：\n\n```javascript\nlet file = 1+1;\nconsole.log(\"\
    file: \", file);\n```\n\n对于那些 true 是初学者且只接触过同步编程的人来说，这会让你有些困惑，更不用说繁琐了。在同步编程中，你的生活一直简单且充满逻辑，但突然之间，第四行可能会在第三行之前执行！那么，我们是否应该为了防万一而在任何地方、随时随地使用回调呢？答案是肯定的否。\n\
    \n只有在你不知道某件事是否会被完成时，才应该使用回调。再次，考虑从数据库获取数据、API 调用等。这些操作都需要时间，因此在事件发生时需要调用回调，这正是我们“事件驱动编程”这一术语的由来。如果你觉得现在还没有真正理解这一点，不要担心——你不是一个人，而理解它的唯一真正方法就是实践。让我们深入探讨一下异步编程及其包含的所有内容。\n\
    \n# 第五章：异步 JavaScript 编程\n\n在本章中，我们将介绍异步 JavaScript 编程，但在此之前，我们需要回顾异步 JavaScript\
    \ 的一些问题。然后，我们将研究异步技术，并展示它们如何帮助我们解决这些问题。\n\n## [同步 JavaScript](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing#synchronous_javascript)\n\
    \n要理解异步 JavaScript，我们必须首先理解同步 JavaScript。你看到的许多基础 JavaScript 代码都是围绕同步代码展开的——你运行代码，一旦浏览器能够，它就会返回结果。这是一个非常简单的示例：\n\
    \n```javascript\nconst btn = document.querySelector('button');\nbtn.addEventListener('click',\
    \ () => {\n  alert('You clicked on me!');\n  let pElem = document.createElement('p');\n\
    \  pElem.textContent = 'This is a new paragraph.';\n  document.body.appendChild(pElem);\n\
    });\n```\n\n在这里，每一行代码都按顺序执行：\n1. 首先，我们在 DOM 中获取一个可用的 `<button>` 元素的引用。\n2. 然后，添加一个点击事件监听器；当按钮被点击时，按顺序发生四件事：\n\
    \    - 显示 `alert()` 消息\n    - 在关闭弹窗后，创建一个 `<p>` 元素\n    - 然后为该元素提供文本内容\n    -\
    \ 将段落添加到文档主体中\n"
- fmt: "\nNow, here’s where the problem with synchronous code lies – JavaScript is\
    \ single-threaded so, while each of those operations listed above is happening,\
    \ nothing else can. Each step is dependent on the previous one completed before\
    \ it can run – until it does, all other operations are blocked. Take the example\
    \ above – once the button is clicked, the alert message appears. Until the OK\
    \ button on the message has been clicked, the paragraph will not appear.\n\n**NOTE**:\
    \ While `alert()` is useful for demonstrating how synchronous blocking operations\
    \ work, it isn’t suited for real-world applications.\n\n## Asynchronous JavaScript\n\
    Because of the issues surrounding blocking, most Web APIs prefer to run asynchronous\
    \ code, especially where the application needs to fetch or have access to an external\
    \ resource. That could include getting a file off the network, getting into a\
    \ database to return data from it, accessing a web cam’s video stream, broadcasting\
    \ display onto a VR headset, and so on.\n\nSo, why can’t we do this using synchronous\
    \ code? We can demonstrate that with an example. When an image is fetched from\
    \ the server, the result cannot be immediately returned, which means the code\
    \ below, which is pseudocode, will not work.\n\n```\nlet response = fetch('myImage.png');\
    \ // fetch is asynchronous\nlet blob = response.blob(); // somehow display image\
    \ blob in the UI\n```\n\nThe code doesn’t work because we have no idea how long\
    \ it will take the image to download. So, when the second code line is run, an\
    \ error is thrown – this may be every time, or it may be intermittent – because\
    \ there is no available response. You really need your code to wait for the response\
    \ before it attempts anything else.\n\nAsynchronous code comes in two styles –\
    \ callbacks and promise-style, which is the newer code style. We’ll look at both\
    \ of these now.\n\n## Async Callbacks\nA callback is a function that we specify\
    \ as an argument when we call a function that executes background code. Once the\
    \ background code is run, the callback function is called to tell you that the\
    \ work is complete or that something interesting has happened. Callbacks are old-fashioned,\
    \ but they are still in use in some of the older but common APIs.\n\nIn the code\
    \ above, we saw an example of one async callback – it was in the `addEventListener()`\
    \ method as the second parameter:\n\n```javascript\nbtn.addEventListener('click',\
    \ () => {\n    alert('You clicked on me!');\n    let pElem = document.createElement('p');\n\
    \    pElem.textContent = 'This is a new paragraph.';\n    document.body.appendChild(pElem);\n\
    });\n```\n\nThe first parameter indicates what event type we want to listen for,\
    \ while the second is the callback function, not invoked until the event has fired.\
    \ When a callback function is passed to another function as a parameter, all we\
    \ do is pass a reference to the function as the argument; for example, the callback\
    \ function does not get immediately executed. The containing function executes\
    \ the callback when the time is right.\n\nIt is simple enough to write functions\
    \ containing callbacks. Here’s an example that loads resources using `XMLHttpRequest`\
    \ API:\n\n```javascript\nfunction loadAsset(url, type, callback) {\n    let xhr\
    \ = new XMLHttpRequest();\n    xhr.open('GET', url);\n    xhr.responseType = type;\n\
    \    xhr.onload = function() {\n        callback(xhr.response);\n    };\n    xhr.send();\n\
    }\n\nfunction displayImage(blob) {\n    let objectURL = URL.createObjectURL(blob);\n\
    \    let image = document.createElement('img');\n    image.src = objectURL;\n\
    \    document.body.appendChild(image);\n}\n\nloadAsset('coffee.jpg', 'blob', displayImage);\n\
    ```\n\nA `displayImage()` function is created to represent a blob. This blob has\
    \ been passed to the function as an object URL; an image is created to show the\
    \ URL in, and this is appended to the `<body>` of the document. A `loadAsset()`\
    \ function is created, taking a parameter which is a callback and content type\
    \ and a URL to fetch. `XMLHttpRequest`, often seen as `XHR`, is used to fetch\
    \ the resource from the specified URL, and the response is passed to the callback\
    \ so it can do something with it. In our case, the callback waits for `XHR` to\
    \ use the `onload` event handler to download the resource, which then gets passed\
    \ back to the callback.\n\nCallbacks are quite versatile in that they let you\
    \ control what order of the functions are run in and determine the data that passes\
    \ between them, but they also let you pass data to other functions, dependent\
    \ on the current situation. In that way, different actions can run on the downloaded\
    \ response, such as `displayText()`, `processJSON()`, and so on.\n\nBe aware that\
    \ not every callback is async; some are synchronous, and one example of that is\
    \ when `Array.prototype.forEach()` is used for looping through an array of items:\n\
    \n```javascript\nconst gods = ['Apollo', ‘Demeter', 'Ares', 'Hades'];\ngods.forEach(function\
    \ (eachName, index) {\n    console.log(index + '. ' + eachName);\n});\n```\n\n\
    Here, an array containing names of Gods is looped, though, and the index numbers\
    \ and relevant values are printed to the console. The `forEach()` parameter is\
    \ a callback function, and this also accepts two parameters. These are references\
    \ to the array name and the index values. However, what it doesn’t do is wait\
    \ – it will run straight away.\n\n## Promises\nPromises are the newest async code\
    \ style typically used in today’s Web APIs. One of the best examples is an API\
    \ called `fetch()`, which is a modern version of `XMLHttpRequest` and is far more\
    \ efficient. Here’s an example:\n\n```javascript\nfetch('products.json').then(function(response)\
    \ {\n    return response.json();\n}).then(function(json) {\n    products = json;\n\
    \    initialize();\n}).catch(function(err) {\n    console.log('Fetch problem:\
    \ ' + err.message);\n});\n```\n\nIn this code, `fetch()` takes just one parameter:\
    \ the URL of the network resource you want to fetch, and it returns a promise.\
    \ Promises are objects that represent the failure or the completion of an async\
    \ operation, a representation of intermediate state if like. It is just the browser\
    \ saying to you that it promises to get an answer back as soon as possible – and\
    \ that is where the name comes from. This can take a little getting used to and\
    \ feels somewhat like Schrödinger’s cat – none of the potential outcomes has happened,\
    \ and `fetch()` is waiting for the browser result, which will come sometime in\
    \ the future.\n\n- There are two `then()` blocks, both of which have a callback\
    \ function. This function runs only if the operation before it is successful,\
    \ and each of the callbacks receives an input of the result of that operation.\
    \ That way, you can continue on and do something else. The `.then()` blocks return\
    \ a promise and several `.then()` blocks can be chained together, allowing asynchronous\
    \ operations to run, one after the other, in order.\n- There is also a `catch()`\
    \ block at the end, which will only run if one or both `.then()` blocks fail.\
    \ Like the `try...catch` blocks in synchronous JavaScript, the `catch()` block\
    \ has an error object in it, which is used to report any errors that occur. It\
    \ is worth noting that the synchronous `try...catch` doesn’t work with promises.\n\
    \n## Promises vs. Callbacks\nPromises are somewhat similar to callbacks and are\
    \ nothing more than returned objects with callback functions attached rather than\
    \ callbacks passed into a function. But promises have been specifically designed\
    \ for async operations and have several advantages over the callback:\n\n- Several\
    \ async operations can be chained together with as many `.then()` operations as\
    \ needed. The result is passed from one as an input to the next, something that\
    \ is hard to do with callbacks – try it and you end up with a complete mess.\n"
