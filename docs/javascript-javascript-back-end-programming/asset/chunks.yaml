- fmt: "\n\n# Socket Methods\n\n| `socket.connect(path[, connectListener])` | Used\
    \ to open a connection for a specified socket. If the host and port are provided,\
    \ the socket opens as TCP but, if host is not provided, it will be assumed as\
    \ localhost. If the path is provided, the socket opens to the path as a UNIX socket\
    \ |\n| `socket.setEncoding([encoding])` | Used to set the socket encoding as a\
    \ Readable Stream |\n| `socket.write(data[, encoding][, callback])` | Used for\
    \ sending data on the socket. If it is a string, the second argument is used to\
    \ specify what the encoding is – the default is UTF8 |\n| `socket.end([data][,\
    \ encoding])` | Used to send a FIN package, which half closes the socket. The\
    \ server may still be able to send data |\n| `socket.destroy()` | Used to make\
    \ sure that I/O activity cannot happen on the socket. This is only necessary where\
    \ there are errors, such as the parse error, etc. |\n| `socket.pause()` | Used\
    \ to pause the data reading, which means data events stop being emitted. This\
    \ is useful when you want uploads throttled back. |\n| `socket.resume()` | Used\
    \ to resume data reading after a call to the pause method |\n| `socket.setTimeout(timeout[,\
    \ callback])` | Used to set the socket so it times out after a specified number\
    \ of inactive timeout milliseconds on the socket. By default, there is no timeout\
    \ on `net.socket`. |\n| `socket.setNoDelay([noDelay])` | Used for disabling the\
    \ Nagle algorithm. This algorithm is used by default by TCP connections and, before\
    \ they send data off, it is buffered. If `noDelay` is set as true, it fires off\
    \ data immediately `socket.write()` is called. By default, `noDelay` is set as\
    \ true. |\n| `socket.setKeepAlive([enable][, initialDelay])` | Helps to enable\
    \ or disable the keep-alive functionality. Optionally, it can also set the delay\
    \ before an idle socket sends the initial keepalive probe. By default, `enable`\
    \ is set to false. |\n| `socket.address()` | Returns the address family name,\
    \ the bound address and the socket port the OS reports. An object with three properties\
    \ is returned, i.e., `{port 23467, family: ‘IPv6’, address: ‘128.0.1.1’}` |\n\
    | `socket.unref()` | When you call `unref` on the socket, the program can exit\
    \ if the event system has no other active socket. Calling `unref` will have no\
    \ effect if the socket is unrefd. |\n| `socket.ref()` | The opposite of above\
    \ – if you call `ref` on a socket that was previously unrefd, the program cannot\
    \ exit if it is the sole remaining socket. Where the socket is refd, it will have\
    \ no effect if you call `ref` again. |\n\nHere’s an example of these methods being\
    \ used. First, create a new file and call it `server.js`. Then input the following:\n\
    \n```javascript\nvar net = require('net');\nvar server = net.createServer(function(connection)\
    \ {\n  console.log('client connected');\n  connection.on('end', function() {\n\
    \    console.log('client disconnected');\n  });\n  connection.write('Hello World!\\\
    r\\n');\n  connection.pipe(connection);\n});\nserver.listen(8080, function() {\n\
    \  console.log('server is listening');\n});\n```\n\nNow run it and see what the\
    \ output is:\n`$ node server.js`\n\nVerify the Output.\n`server is listening`\n\
    \nNext, create another new file called `client.js` and input this code:\n\nFile:\
    \ `client.js`\n```javascript\nvar net = require('net');\nvar client = net.connect({port:\
    \ 8080}, function() {\n  console.log('connected to server!');\n});\nclient.on('data',\
    \ function(data) {\n  console.log(data.toString());\n  client.end();\n});\nclient.on('end',\
    \ function() {\n  console.log('disconnected from server');\n});\n```\n\nNow try\
    \ running this file from a different terminal and see what the output is:\n`$\
    \ node client.js`\n\nVerify the Output.\n`connected to server!`\n`Hello World!`\n\
    `disconnected from server`\n\nLastly, on the terminal where you are running the\
    \ `server.js` file, verify the output:\n`server is listening`\n`client connected`\n\
    `client disconnected`\n\n# DNS Module\n\nThe DNS module contains functions that\
    \ allow us to do DNS lookup and use the name resolution functionalities that underly\
    \ the operating system. It gives us an asynchronous wrapper for the network, and\
    \ the following syntax is needed to import it:\n\n```javascript\nvar dns = require(\"\
    dns\")\n```\n\n## DNS Module Methods\n\nThese are the methods that come from the\
    \ DNS Module:\n\n| METHOD | DESCRIPTION |\n| `dns.lookup(hostname[, options],\
    \ callback)` | This method is used to resolve hostnames into the first IPv4 (A)\
    \ or IPv6 (AAAA) record. The options parameter can be an integer or object but\
    \ if this is not provides, both IPv4 and 6 addresses are valid. If it is set as\
    \ an integer, it is 4 or 6 |\n| `dns.lookupService(address, port, callback)` |\
    \ Uses `getnameinfo` to resolve the specified port and address into a service\
    \ and hostname. |\n| `dns.resolve(hostname[, rrtype], callback)` | Used to resolve\
    \ a hostname into an array containing record types that `rrtype` specifies. |\n\
    | `dns.resolve4(hostname, callback)` | As above but only as far as IPv4 or A record\
    \ queries are concerned. |\n| `dns.resolve6(hostname, callback)` | As above but\
    \ for IPv6 or AAAA record queries |\n| `dns.resolveMx(hostname, callback)` | As\
    \ above but only for MX record or mail exchange queries |\n| `dns.resolveTxt(hostname,\
    \ callback)` | As above but for TXT record or text queries. |\n| `dns.resolveSrv(hostname,\
    \ callback)` | As above but for SRV records or service record queries |\n| `dns.resolveSoa(hostname,\
    \ callback)` | As above but only for SOA or start of authority records |\n| `dns.resolveNs(hostname,\
    \ callback)` | As above but only for NS or name server records |\n| `dns.resolveCname(hostname,\
    \ callback)` | As above but only for CNAME or canonical records |\n| `dns.reverse(ip,\
    \ callback)` | Reverse resolves IP address to a hostnames array |\n| `dns.getServers()`\
    \ | Used to return an array containing IP addresses as a string currently in use\
    \ for resolution |\n| `dns.setServers(servers)` | Used to set a given array of\
    \ IP addresses in string format as the servers needed to resolve them |\n\n##\
    \ DNS Module rrtypes\n\nThese are the valid rrtypes the `dns.resolve()` method\
    \ uses:\n\n*   `A` - the default, IPv4 addresses\n*   `AAAA` – Ipv6 addresses\n\
    *   `MX` – these are the mail exchange records\n*   `SRV` – these are the SRV\
    \ records\n*   `TXT` – these are the text records\n*   `PTR` – this is used to\
    \ do reverse IP lookups\n*   `CNAME` – these are canonical name records\n*   `NS`\
    \ – these are the name server records\n*   `SOA` – these are the start of authority\
    \ records\n"
