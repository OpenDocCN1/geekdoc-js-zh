    | socket.end([data][, encoding]) | Used to send a FIN package, which half closes
    the socket. The server may still be able to send data |


    | socket.destroy() | Used to make sure that I/O activity cannot happen on the
    socket. This is only necessary where there are errors, such as the parse error,
    etc. |


    | socket.pause() | Used to pause the data reading, which means data events stop
    being emitted. This is useful when you want uploads throttled back. |


    | socket.resume() | Used to resume data reading after a call to the pause method
    |


    | socket.setTimeout(timeout[, callback]) | Used to set the socket so it times
    out after a specified number of inactive timeout milliseconds on the socket. By
    default, there is no timeout on net.socket. |


    | socket.setNoDelay([noDelay]) | Used for disabling the Nagle algorithm. This
    algorithm is used by default by TCP connections and, before they send data off,
    it is buffered. If noDelay is set as true, it fires off data immediately socket.write()
    is called. By default, noDelay is set as true. |


    | socket.setKeepAlive([enable][, initialDelay]) | Helps to enable or disable the
    keep-alive functionality. Optionally, it can also set the delay before an idle
    socket sends the initial keepalive probe. By default, enable is set to false.
    |


    | socket.address() | Returns the address family name, the bound address and the
    socket port the OS reports. An object with three properties is returned, i.e.
    {port 23467, family: ‘IPv6’, address: ‘128.0.1.1’} |


    | socket.unref() | When you call unref on the socket, the program can exit if
    the event system has no other active socket. Calling unref will have no effect
    if the socket is unrefd. |


    | socket.ref() | The opposite of above – if you call ref on a socket that was
    previously unrefd, the program cannot exit if it is the sole remaining socket.
    Where the socket is refd, it will have no effect if you call ref again. |


    Here’s an example of these methods being used. First, create a new file and call
    it server.js. Then input the following:var net = require(''net'');var server =
    net.createServer(function(connection) {console.log(''client connected'');connection.on(''end'',
    function() {console.log(''client disconnected'');});connection.write(''Hello World!\r\n'');connection.pipe(connection);});server.listen(8080,
    function() {console.log(''server is listening'');});Now run it and see what the
    output is:$ node server.jsVerify the Output.server is listeningNext, create another
    new file called client.js and input this code:File: client.jsvar net = require(''net'');var
    client = net.connect({port: 8080}, function() {console.log(''connected to server!'');});client.on(''data'',
    function(data) {console.log(data.toString());client.end();});client.on(''end'',
    function() {console.log(''disconnected from server'');});Now try running this
    file from a different terminal and see what the output is:$ node client.jsVerify
    the Output.connected to server!Hello World!disconnected from serverLastly, on
    the terminal where you are running the server.js file, verify the output:server
    is listeningclient connectedclient disconnectedDNS ModuleThe DNS module contains
    functions that allow us to do DNS lookup and use the name resolution functionalities
    that underly the operating system.  It gives us an asynchronous wrapper for the
    network, and the following syntax is needed to import it:var dns = require("dns")DNS
    Module MethodsThese are the methods that come from the DNS Module:


    | METHOD | DESCRIPTION |


    | dns.lookup(hostname[, options], callback) | This method is used to resolve hostnames
    into the first IPv4 (A) or IPv6 (AAAA) record. The options parameter can be an
    integer or object but if this is not provides, both IPv4 and 6 addresses are valid.
    If it is set as an integer, it is 4 or 6 |


    | dns.lookupService(address, port, callback) | Uses getnameinfo to resolve the
    specified port and address into a service and hostname. |


    | dns.resolve(hostname[, rrtype], callback) | Used to resolve a hostname into
    an array containing record types that rrtype specifies. |


    | dns.resolve4(hostname, callback) | As above but only as far as IPv4 or A record
    queries are concerned. |


    | dns.resolve6(hostname, callback) | As above but for IPv6 or AAAA record queries
    |


    | dns.resolveMx(hostname, callback) | As above but only for MX record or mail
    exchange queries |


    | dns.resolveTxt(hostname, callback) | As above but for TXT record or text queries.
    |


    | dns.resolveSrv(hostname, callback) | As above but for SRV records or service
    record queries |


    | dns.resolveSoa(hostname, callback) | As above but only for SOA or start of authority
    records |


    | dns.resolveNs(hostname, callback) | As above but only for NS or name server
    records |


    | dns.resolveCname(hostname, callback) | As above but only for CNAME or canonical
    records |


    | dns.reverse(ip, callback) | Reverse resolves IP address to a hostnames array
    |


    | dns.getServers() | Used to return an array containing IP addresses as a string
    currently in use for resolution |


    | dns.setServers(servers) | Used to set a given array of IP addresses in string
    format as the servers needed to resolve them |


    DNS Module rrtypesThese are the valid rrtypes the dns,resolve() method uses:


    *   A - the default, IPv4 addresses


    *   AAAA – Ipv6 addresses


    *   MX – these are the mail exchange records


    *   SRV – these are the SRV records


    *   TXT – these are the text records


    *   PTR – this is used to do reverse IP lookups


    *   CNAME – these are canonical name records


    *   NS – these are the name server records


    *   SOA – these are the start of authority records'
