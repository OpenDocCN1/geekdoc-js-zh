  trans: "\n\n## 效率\n\n1. **内存效率**：在处理数据之前，不需要将大量数据加载到内存中。\n2. **时间效率**：当你获取数据时立即进行处理，而不是等待其传输时，速度会显著加快。\n\
    \nNode.js 有四种流：\n\n1. `Writable`（可写）：这些是我们向其写入数据的流。例如，我们可以使用 `fs.createWriteStream()`\
    \ 使用流向文件写入数据。\n2. `Readable`（可读）：这些是我们可以从中读取数据的流。例如，我们可以使用 `fs.createReadStream()`\
    \ 读取文件内容。\n3. `Duplex`（双向）：这些是我们既可以读也可以写入的流。一个很好的例子是 `net.Socket`。\n4. `Transform`（转换）：这些流可以在读取和写入数据时对其进行转换或修改。例如，可以使用\
    \ `file-compression` 写入压缩数据，并从文件中读取和写入解压缩后的数据。\n\n如果你有 `Node.js` 的经验，毫无疑问你已经接触过流（streams）。例如，在基于\
    \ `Node.js` 的 HTTP 服务器中，`response` 是一个 `writable`（可写）流，而 `request` 是一个 `readable`（可读）流。如果你用过\
    \ `fs` 模块，你就处理过可读和可写流。当你使用 `Express` 时，你正在通过流与客户端交互。而且，由于 `TLS` 栈、`TCP` 栈和其他基于\
    \ `Node.js` 的连接，你在使用的每个数据库连接驱动程序中处理流。\n\n## 实际示例\n\n要创建一个可读流，我们需要 `Readable` 流并且它需要被初始化。\n\
    \n```javascript\nconst Stream = require('stream')\nconst readableStream = new\
    \ Stream.Readable()\n```\n\n一旦流初始化完成，就可以向它发送数据：\n\n```javascript\nreadableStream.push('ping!')\n\
    readableStream.push('pong!')\n```\n\n### 异步迭代器 (Async Iterator)\n\n在处理流时，应该使用\
    \ `async iterator`。异步迭代是一种用于异步获取数据容器中内容的协议——这意味着在获取项目之前可以停止当前任务。同样需要记住的一点是，当你实现流的\
    \ `async iterator` 时，它使用了其内部的可读事件。\n\n异步迭代器可以用于从可读流中读取数据：\n\n```javascript\nimport\
    \ * as fs from 'fs';\nasync function logChunks(readable) {\n  for await (const\
    \ chunk of readable) {\n    console.log(chunk);\n  }\n}\nconst readable = fs.createReadStream('tmp/test.txt',\
    \ {encoding: 'utf8'});\nlogChunks(readable);\n// 输出:\n// 'This is a test!\\n'\n\
    ```\n\n可读字符串的内容也可以收集到一个字符串中：\n\n```javascript\nimport {Readable} from 'stream';\n\
    async function readableToString2(readable) {\n  let result = '' ;\n  for await\
    \ (const chunk of readable) {\n    result += chunk;\n  }\n  return result;\n}\n\
    const readable = Readable.from('Good morning!', {encoding: 'utf8'});\nassert.equal(await\
    \ readableToString2(readable), 'Good morning!');\n```\n\n在这种情况下，我们使用了 `async`\
    \ 函数是因为我们希望返回一个 `promise`。你还应该记住，`async` 函数不能与 `EventEmitter` 混合使用。当事件处理程序中触发拒绝（rejections）时，没有方法可以捕获，这意味着内存泄漏和\
    \ bug 很难追踪。目前最佳实践是将 `async` 函数的内容封装在 `try…catch` 块中并处理错误。\n\n### Readable.from():\
    \ 如何从可迭代对象创建可读流\n\n`stream.Readable.from(iterable, [options])` 是一个实用方法，用于从迭代器（iterators）创建可读流，其中\
    \ `iterable` 用于存储数据。`Options` 是可选参数，你可以用它来指定文本编码等：\n\n```javascript\nconst { Readable\
    \ } = require('stream');\nasync function * generate() {\n  yield 'hello';\n  yield\
    \ 'streams';\n}\nconst readable = Readable.from(generate());\nreadable.on('data',\
    \ (chunk) => {\n  console.log(chunk);\n});\n```\n\n## 两种读取模式\n\n`Streams` API\
    \ 告诉我们可读流可以在两种模式下运行：暂停（paused）和流动（flowing）。无论处于暂停模式还是流动模式，`Readable` 流都可以处于对象模式（object\
    \ mode）或之外。\n\n- **流动模式 (Flowing mode)** —— 数据自动从底层系统读取。它被快速地交给应用程序，这是这种带有事件和\
    \ `EventEmitter` 接口的模式。\n- **暂停模式 (Paused mode)** —— 为了从流中读取数据块，需要显式调用 `stream.read()`\
    \ 方法。\n\n如果我们想从流中读取数据，可以在流动模式下监听数据事件并附加回调函数。当数据可用时，可读流会发出 `data` 事件，并执行回调函数。这是一个示例：\n\
    \n```javascript\nvar fs = require(\"fs\");\nvar data = '';\nvar readerStream =\
    \ fs.createReadStream('file.txt'); // 创建一个可读流\nreaderStream.setEncoding('UTF8');\
    \ // 设置编码为 utf8\n// 处理流事件 --> data, end, 和 error\nreaderStream.on('data', function(chunk)\
    \ {\n  data += chunk;\n});\nreaderStream.on('end',function() {\n  console.log(data);\n\
    });\nreaderStream.on('error', function(err) {\n  console.log(err.stack);\n});\n\
    console.log(\"Program Ended\");\n```\n\n"
- fmt: '

    One of the most important things you need to remember is that no `Readable` will
    generate any data until there is a mechanism in place to consume or ignore the
    data. If a consuming mechanism is in place and it gets removed or disabled, the
    `Readable` will try to stop the data generation. If a readable event handler is
    added, the stream automatically stops flowing, and the data is consumed by `readable.read()`.
    If a readable event handler gets taken away, the stream automatically flows, provided
    a data event handler is in place.


    ## How to Create a Writable Stream

    Writing data to a writable stream requires `write()` to be called on the stream
    instance, like in this example:


    ```javascript

    var fs = require(''fs'');

    var readableStream = fs.createReadStream(''file1.txt'');

    var writableStream = fs.createWriteStream(''file2.txt'');

    readableStream.setEncoding(''utf8'');

    readableStream.on(''data'', function(chunk) {

    writableStream.write(chunk);

    });

    ```


    This is straightforward code. All it does is reads data chunks off an input stream
    and uses `write()` to write to the destination. The function returns a `Boolean`
    value to indicate whether the operation was successful or otherwise. Those `Boolean`
    values are `true` and `false` – `true` indicates a successful write and that you
    can continue writing data, while `false` indicates something isn’t right and no
    more data can be written for now. A `drain` event will be emitted in this case
    to tell you when you can begin writing again.


    When the `writable.end()` method is called, it tells us that data is no longer
    being written to the `Writable`. If an optional callback function was provided,
    it will be attached for the `finish` event as a listener:


    ```javascript

    // Write ''hello, '' and end with ''world!''.

    const fs = require(''fs'');

    const file = fs.createWriteStream(''example.txt'');

    file.write(''hello, '');

    file.end(''world!'');

    // You cannot Write anymore!

    ```


    A writable stream allows you to read data off a readable stream:


    ```javascript

    const Stream = require(''stream'')

    const readableStream = new Stream.Readable()

    const writableStream = new Stream.Writable()

    writableStream._write = (chunk, encoding, next) => {

    console.log(chunk.toString())

    next()

    }

    readableStream.pipe(writableStream)

    readableStream.push(''ping!'')

    readableStream.push(''pong!'')

    writableStream.end()

    ```


    Async iterators can also be used for writing to a writable stream – this is the
    recommended course of action:


    ```javascript

    import * as util from ''util'';

    import * as stream from ''stream'';

    import * as fs from ''fs'';

    import {once} from ''events'';

    const finished = util.promisify(stream.finished); // (A)

    async function writeIterableToFile(iterable, filePath) {

    const writable = fs.createWriteStream(filePath, {encoding: ''utf8''});

    for await (const chunk of iterable) {

    if (!writable.write(chunk)) { // (B)

    // Handle backpressure

    await once(writable, ''drain'');

    }

    }

    writable.end(); // (C)

    // Wait until done. Throws if there are errors.

    await finished(writable);

    }

    await writeIterableToFile([''One'', '' line of text.\n''], ''tmp/log.txt'');

    assert.equal(fs.readFileSync(''tmp/log.txt'', {encoding: ''utf8''}),''One line
    of text.\n'');

    ```


    By default, `stream.finished()` is based on a callback but you can use `util.promisify()`
    (line A) to transform it into a promise-based version. This example shows it being
    used in two patterns:


    Write to a writable stream and handle backpressure (line B):

    ```javascript

    if (!writable.write(chunk)) {

    await once(writable, ''drain'');

    }

    ```


    Close a writable stream and wait for writing to be done (line C):

    ```javascript

    writable.end();

    await finished(writable);

    ```


    ## Pipeline

    Piping is another mechanism whereby the output from one stream is provided to
    another. Normally, pipelines are used to obtain the data out of a stream and then
    pass it to another, and there is no limit on how many you can use. In simple terms,
    you use pipelines to process streamed data over several steps.


    One of the latest additions to Node was a module method called `stream.pipeline()`.
    This is used for piping between streams to forward errors, clean up and provide
    callbacks for when the pipeline finishes. Here is an example:


    ```javascript

    const { pipeline } = require(''stream'');

    const fs = require(''fs'');

    const zlib = require(''zlib'');

    // The pipeline API is used to make it easy pipe multiple streams

    // together and be notified when the pipeline has completely finished.

    // A pipeline to gzip can move a potentially large video file in an efficient
    manner.

    pipeline(fs.createReadStream(''The.Matrix.1080p.mkv''),

    zlib.createGzip(),

    fs.createWriteStream(''The.Matrix.1080p.mkv.gz''),

    (err) => {

    if (err) {

    console.error(''Pipeline failed'', err);

    } else {

    console.log(''Pipeline succeeded'');

    }

    });

    ```


    Always make sure you use `pipeline` and not `pipe` as the latter is not safe to
    use.


    ## The Stream Module

    The `stream` module in Node.js is the foundation on which all the streaming APIs
    are built. It is a native module to Node.js, there by default when you install
    it. It is an `EventEmitter` class instance used to asynchronously handle Node
    events. This means that, inherently, streams are event-based.


    Accessing the stream module is done like this:


    ```javascript

    const stream = require(''stream'');

    ```


    The `stream` module is good for when you want new stream instance types created.
    Typically, when you want streams consumed, you do not need to use the `stream`
    module.


    ## Streams-Powered Node APIs

    Because of their many advantages, some Node.js core modules provide us with native
    capabilities to handle streams. The most notable capabilities are:


    *   `net.Socket` – this is the primary node API streams are based on and underlies
    almost all of the rest of these APIs.

    *   `process.stdin` – a stream that is connected to stdin is returned

    *   `process.stdout` – a stream that is connected to stdout is returned

    *   `process.stderr` – a stream that is connected to stderr is returned

    *   `fs.createReadStream()` – a readable stream is created to a file

    *   `fs.createWriteStream()` – a writable stream is created to a file

    *   `net.connect` – a stream-based connection is initiated

    *   `http.request()` - an `http.ClientRequest` class instance is returned – this
    is a writable stream.

    *   `zlib.createGzip()` – this uses a compression algorithm called gzip to compress
    data into a stream

    *   `zlib.createGunzip()` – this decompresses gzip streams

    *   `zlib.createDeflate()` – this uses a compression algorithm called deflate
    to compress data into a stream

    *   `zlib.createInflate()` – this decompresses deflate streams


    To finish this chapter, these are some of the most important events related to
    the writable streams:


    *   `error` – this is emitted to tell us that an error happens during piping/writing

    *   `pipeline` – the writable stream emits this when readable streams are piped
    into writable streams.

    *   `unpipe` – this is emitted when `unpipe` is called on the readable stream.
    It stops it from being piped into the destination.


