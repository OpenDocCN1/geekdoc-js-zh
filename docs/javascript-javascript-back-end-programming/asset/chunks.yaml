    6d 20 61 20 73 74 72 69 6e 67 21>In this third way, the buffer is initialized
    to a binary encoding. This is the first string that the second argument specifies
    – utf-8\. This is one of the most common methods of encoding with Node.js.Writing
    to BuffersGiven that we already created a buffer:> var buffer = Buffer.alloc(16)Strings
    can be written to it:> buffer.write("Hello", "utf-8")5Buffer.write’s first argument
    is the string that needs to be written to the buffers, while the second one is
    the string encoding. Because it defaults to utf-8, the argument is irrelevant.We
    got a result of 5 from buffer.write, which means the first five bytes were written
    to the buffer. It is pure coincidence that the string “Hello,” also happens to
    be five characters long because each character is coincidentally 8 bits. That
    is useful information for when you want the message completed:> buffer.write("
    world!", 5, "utf-8")7When there are three arguments to buffer.write, the second
    one is indicative of an offset, which is the buffer index to begin writing at.Reading
    from Buffers:toString:The commonest way of reading buffers is with the toString
    method because the vast majority of buffers have text in them:> buffer.toString(''utf-8'')''Hello
    world!\u0000k\t''Once again, the initial argument is the encoding and, here, we
    can see that not all the buffer was used. However, because we happen to know the
    number of bytes written to the buffer, we can just add some more arguments, allowing
    us to stringify the interesting slice:> buffer.toString("utf-8", 0, 12)''Hello
    world!''Individual OctetsIt is also possible to use a syntax similar to an array
    to set individual bytes:> buffer[12] = buffer[11];33> buffer[13] = "1".charCodeAt();49>
    buffer[14] = buffer[13];49> buffer[15] = 3333> buffer.toString("utf-8")''Hello
    world!!11!''Here, the remaining bytes were set by hand to represent the 1 and
    ! characters encoded by utf-8.More Fun With BuffersBuffer.isBuffer(object)We use
    this method to check whether an object is actually a buffer, much like the Array.isArray
    method.Buffer.byteLength(string, encoding)This function lets us check how many
    bytes are needed for encoding a string that has a specified encoding – this defaults
    to the utf-8 encoding. The length will not be the same as the string length as
    lots of characters need a lot more bytes for encoding. Here’s an example:> var
    snowman = "☃ ";> snowman.length1> Buffer.byteLength(snowman)3This is a Unicode
