    # Update Operation


    The Update OperationWithout `.lean()` being fired, if you already have a Mongoose
    document, the object property can be modified and saved with `object.save()`:


    ```javascript

    const doc = await CompletedSchema.findOne(info)

    doc.slug = ''something-else''

    await doc.save()

    ```


    Here, we are making two database calls – `findOne` and `doc.save`. Where possible,
    try to have as few requests as possible hitting the database. When you compare
    network, memory and disk, network is almost always going to be the slowest.


    The other case lets you use something like this to make just one call to your
    database:


    ```javascript

    const res = await CompletedSchema.updateOne(<condition>, <query>).lean()

    ```


    # Delete Operation


    Lastly, the delete operation which Mongoose also makes straightforward. Here’s
    how a single document can be deleted:


    ```javascript

    const res = await CompletedSchema.deleteOne(<condition>)

    ```


    In much the same way as `updateOne`, `deleteOne` will also take the document’s
    matching condition as its first argument.


    Another method, `deleteMany`, should be used when you have multiple documents
    to be deleted. However, where you want to avoid deleting multiple queries, use
    `deleteOne`, especially where you are attempting to execute your own queries.


    # Conclusion


    Thank you for taking the time to read my guide. Over the years, JavaScript has
    risen in popularity, and today, the face of web development has changed beyond
    all recognition. Several years ago, we could not have even imagined the things
    we can do today on the web, using JavaScript in the browser and the server. Back
    then, anything remotely like that would have been encapsulated inside a Java Applet,
    Flash, or other similar sandboxed environments.


    For more than 20 years, we have lived with the stateless-web based on a stateless
    request-response paradigm, but now we have web applications based on two-way,
    real-time connections. Node.js has made it possible for the server and the client
    to initiate communication and freely exchange data. The typical response paradigm
    is in direct contrast to this, with the client always being the one to initiate
    communications. All of this is based on an open web stack of JS, CSS, and HTML,
    running on port 80.


    Sure, you can argue that this has been around for years. We''ve long had Java
    Applets and Flash, but these are nothing more than sandboxed environments that
    use the web as a form of transport to the client. Being sandboxed, they were isolated,
    running on non-standard ports that likely needed extra things, such as more permissions.


    Node.js has all the advantages and is now used by high-profile companies that
    depend almost entirely on what it offers. And that means there will always be
    room for one more Node.js expert in the world – is it you?


