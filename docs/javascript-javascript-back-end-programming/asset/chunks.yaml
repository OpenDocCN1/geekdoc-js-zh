    sourceEnd=buffer.length)Using buffer.copy lets us copy one buffer’s contents to
    another one. The initial argument is the target buffer where the buffer contents
    are copied to. The remaining arguments let us copy subsections of the source buffer
    to the target buffer. Here’s an example:> var frosty = Buffer.alloc(24)> var snowman
