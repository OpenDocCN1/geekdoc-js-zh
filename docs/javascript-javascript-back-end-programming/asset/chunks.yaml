    # Net 模块

    `net` 模块提供了客户端和流支持，并提供了一个异步封装器用于网络传输。使用以下语法导入它：


    ```javascript

    var net = require("net")

    ```


    ## Net 模块方法

    这些是 `net` 模块中的方法：


    | 方法 |  |

    | :--- | :--- |

    | `net.createServer([options][, connectionListener])` | 创建一个 TCP 服务器，并将参数 (`connectionListener`)
    自动设置为连接事件监听器 |

    | `net.connect(options[, connectionListener])` | 这是一个工厂方法，返回一个 `net.Socket` 并连接到提供的地址和端口
    |

    | `net.createConnection(options[, connectionListener])` | 与上述相同 |

    | `net.connect(port[, host][, connectListener])` | 在主机的端口上创建 TCP 连接。如果没有指定 host，则默认为
    localhost。参数 `connectListener` 被添加连接事件监听器，与前两个方法一样，它也会返回一个 `net.Socket`。 |

    | `net.connect(path[, connectListener])` | 创建到路径的 Unix socket 连接。参数 `connectListener`
    被添加连接事件监听器，与之前的方法一样，它也会返回一个 `net.Socket`。 |

    | `net.createConnection(path[, connectListener])` | 同上 |

    | `net.isIP(input)` | 测试 `input` 是否为 IP 地址；如果字符串无效则返回 0，如果是 IP v4 地址返回 4，如果是 IP
    v6 地址则返回 6 |

    | `net.isIPv4(input)` | 如果 `input` 是 IP v4 地址则返回 true，否则返回 false |

    | `net.isIPv6(input)` | 如果 `input` 是 IP v6 地址则返回 true，否则返回 false |


    ## 类 - net.Server

    `net.Server` 类用于创建本地或 TCP 服务器。


    ### net.Server 方法

    这些是与该类相关的方法：


    | 方法 | 描述 |

    | :--- | :--- |

    | `server.listen(port[, host][, backlog][, callback])` | 允许你在指定的端口和主机上开始接受连接。如果没有指定主机，如果连接指向
    IPv4 地址（INADDR_ANY），服务器将接受该连接。如果缺少端口号，将分配一个随机端口。 |

    | `server.listen(path[, callback])` | 启动本地 socket 服务器，在指定的路径上监听连接 |

    | `server.listen(handle[, callback])` | 只要 handle 对象具有 `{fd: <n>}` 对象或底层的 `_handle`
    成员，你就可以将该设置为 socket 或服务器。服务器将被强制在给定的 handle 上接受连接，但假设 handle 或文件描述符已绑定到域套接字或端口。Windows
    不支持在文件描述符上监听 |

    | `server.listen(options[, callback])` | 在此方法中，host、port、option 属性 backlog 和回调函数（可选）的行为与调用
    `server.listen(port, [host], [backlog], [callback])` 时完全相同。你还可以使用 `path` 选项来指定
    UNIX sockets。 |

    | `server.close([callback])` | 当没有更多打开的连接且服务器发出 close 事件时，服务器将被关闭 |

    | `server.address()` | 此方法将返回绑定的地址、服务器端口以及操作系统报告的地址族名称 |

    | `server.unref()` | 当你对服务器调用 `unref` 时，如果事件系统没有其他活跃的服务器，程序可以退出。调用 `unref` 将执行此操作
    |

    | `server.ref()` | 当你对服务器调用 `ref` 时，即使没有其他活跃服务器，程序也不会退出 |

    | `server.getConnections(callback)` | 获取并发连接数 |


    ### 事件

    这些是服务器的事件：


    | 事件 | 描述 |

    | :--- | :--- |

    | `listening` | 在服务器绑定后发出 |

    | `connection` | 当有新连接建立时发出 |

    | `close` | 在 socket 关闭时发出。接收一个 `had_error` 参数，指示是否由于错误导致关闭 |


    ## 类 - net.Socket

    这是一个本地或 TCP socket 抽象，socket 实例用于实现双工接口。


    ### net.Socket 事件

    这些是 `net.Socket` 发出的事件：


    | 事件 | 描述 |

    | :--- | :--- |

    | `lookup` | 在解析主机后发出，但不适用于 UNIX sockets |

    | `connect` | 在连接建立后发出 |

    | `data` | 接收到数据时任何。String 或 Buffer 用于数据 |

    | `end` | 当对方发送 FIN 包时发出 |

    | `timeout` | 当空闲导致 socket 超时时发出 |

    | `drain` | 在缓冲区清空后发出，用于限流 |

    | `error` | 发生错误后发出，随后是 `close` 事件 |

    | `close` | 仅当 socket 关闭时发出 |


    ### net.Socket 属性

    这些是 `net.Socket` 用于控制 socket 交互的属性：


    | 属性 | 描述 |

    | :--- | :--- |

    | `bufferSize` | 指明等待写入的缓冲区字符数 |

    | `remoteAddress` | 字符串形式的远程 IP 地址 |

    | `remoteFamily` | 字符串形式的远程 IP 族，即 IPv4 或 IPv6 |

    | `remotePort` | 数字表示的远程端口 |

    | `localAddress` | 远程客户端连接的本地 IP 地址的字符串表示。例如，如果你监听 0.0.0.0 且远程客户端使用 192.168.1.1
    连接，则值为 192.168.1.1 |

    | `localPort` | 数字表示的本地端口 |

    | `bytesRead` | 指明接收到的字节数 |

    | `bytesWritten` | 指明发送的字节数 |


    ### net.Socket 方法

    这些是 `net.Socket` 方法：


    | 方法 | 描述 |

    | :--- | :--- |

    | `new net.Socket([options])` | 此方法用于构造新的 socket 对象 |

    | `socket.connect(port[, host][, connectListener])` | 用于为指定的 socket 打开连接 |


