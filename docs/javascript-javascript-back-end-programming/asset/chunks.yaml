    \n`{\"user1\" : {\"name\" : \"michael\",\"password\" : \"password1\",\"profession\"\
    \ : \"teacher\",\"id\": 1},\"user2\" : {\"name\" : \"sara\",\"password\" : \"\
    password2\",\"profession\" : \"scientist\",\"id\": 2},\"user3\" : {\"name\" :\
    \ \"ronnie\",\"password\" : \"password3\",\"profession\" : \"clerk\",\"id\": 3}}`\n\
    \n## 添加用户\n我们将实现的下一个 RESTful API 是 `newUser`，使用以下详情：\n`user = {\"user4\" : {\"\
    name\" : \"monica\",\"password\" : \"password4\",\"profession\" : \"teacher\"\
    ,\"id\": 4}}`\n\n可以通过 AJAX 调用用 JSON 格式接受相同的输入，但为了本章的内容，我们将全部进行硬编码。清空你的 `server.js`\
    \ 文件并添加以下内容：\n\n```javascript\nserver.js\nvar express = require('express');\n\
    var app = express();\nvar fs = require(\"fs\");\nvar user = {\"user4\" : {\"name\"\
    \ : \"monica\",\"password\" : \"password4\",\"profession\" : \"teacher\",\"id\"\
    : 4}}\napp.post('/addUser', function (req, res) {\n  // 首先读取现有用户。\n  fs.readFile(\
    \ __dirname + \"/\" + \"users.json\", 'utf8', function (err, data) {\n    data\
    \ = JSON.parse( data );\n    data[\"user4\"] = user[\"user4\"];\n    console.log(\
    \ data );\n    res.end( JSON.stringify(data));\n  });\n})\nvar server = app.listen(8081,\
    \ function () {\n  var host = server.address().address;\n  var port = server.address().port;\n\
    \  console.log(\"Example app listening at http://%s:%s\", host, port)\n})\n```\n\
    \n现在尝试通过 URL 访问：`http://127.0.0.1:8081/addUser` 并使用 HTTP 方法：`POST`。使用本地机器和 REST\
    \ 客户端，你应该能看到以下内容：\n\n`{\"user1\":{\"name\":\"michael\",\"password\":\"password1\"\
    ,\"profession\":\"teacher\",\"id\":1},\"user2\":{\"name\":\"sara\",\"password\"\
    :\"password2\",\"profession\":\"scientist\",\"id\":2},\"user3\":{\"name\":\"ronnie\"\
    ,\"password\":\"password3\",\"profession\":\"clerk\",\"id\":3},\"user4\":{\"name\"\
    :\"monica\",\"password\":\"password4\",\"profession\":\"teacher\",\"id\":4}}`\n\
    \n## 显示详情\n现在我们实现一个通过用户 ID 调用并显示相应用户详情的 RESTful API。再次清空 `server.js` 文件并添加此代码：\n\
    \n```javascript\nserver.js\nvar express = require('express');\nvar app = express();\n\
    var fs = require(\"fs\");\napp.get('/:id', function (req, res) {\n  // 首先读取现有用户。\n\
    \  fs.readFile( __dirname + \"/\" + \"users.json\", 'utf8', function (err, data)\
    \ {\n    var users = JSON.parse( data );\n    var user = users[\"user\" + req.params.id]\n\
    \    console.log( user );\n    res.end( JSON.stringify(user));\n  });\n})\nvar\
    \ server = app.listen(8081, function () {\n  var host = server.address().address;\n\
    \  var port = server.address().port;\n  console.log(\"Example app listening at\
    \ http://%s:%s\", host, port)\n})\n```\n\n与之前一样，使用本地机器和 REST 客户端尝试使用 [`127.0.0.1:8081/2`](http://127.0.0.1:8081/2)\
    \ 并使用 HTTP 方法：`GET` 访问，你应该看到这个：\n\n`{\"name\":\"sara\",\"password\":\"password2\"\
    ,\"profession\":\"scientist\",\"id\":2}`\n\n## 删除用户\n这与 `addUser` API 非常相似。输入数据通过\
    \ `req.body` 传入，并使用用户 ID 从系统中删除正确的用户。为了简单起见，我们将删除用户 ID `2`。清空 `server.js` 文件并添加此代码：\n\
    \n```javascript\nvar express = require('express');\nvar app = express();\nvar\
    \ fs = require(\"fs\");\nvar id = 2;\napp.delete('/deleteUser', function (req,\
    \ res) {\n  // 首先读取现有用户。\n  fs.readFile( __dirname + \"/\" + \"users.json\", 'utf8',\
    \ function (err, data) {\n    data = JSON.parse( data );\n    delete data[\"user\"\
    \ + 2];\n    console.log( data );\n    res.end( JSON.stringify(data));\n  });\n\
    })\nvar server = app.listen(8081, function () {\n  var host = server.address().address;\n\
    \  var port = server.address().port;\n  console.log(\"Example app listening at\
    \ http://%s:%s\", host, port)\n})\n```\n\n再次，使用本地机器和 REST 客户端访问 [`127.0.0.1:8081/deleteUser`](http://127.0.0.1:8081/deleteUser)\
    \ 并使用 HTTP 方法：`DELETE`，你应该能看到这个：\n\n`{\"user1\":{\"name\":\"michael\",\"password\"\
    :\"password1\",\"profession\":\"teacher\",\"id\":1},\"user3\":{\"name\":\"ronnie\"\
    ,\"password\":\"password3\",\"profession\":\"clerk\",\"id\":3}}`\n\n"
- fmt: "\nThe final strategy involves splitting the application into several smaller\
    \ instances – each instance is responsible for its own small part of the application's\
    \ data. Often, you will see this strategy known as sharding or horizontal partitioning\
    \ in databases. In data partitioning, a lookup step is required before every operation.\
    \ This determines which application instance should be used. For example, we might\
    \ want our users partitioned based on language or country, and we would need that\
    \ information looked up first.\n\nWhen you scale a large application successfully,\
    \ eventually, all three of these strategies should be implemented. While Node.js\
    \ does make it simple to do all of this, I will be focusing on using the first\
    \ strategy, cloning, as it is the most basic, and take a look at the Node.js tools\
    \ needed to implement it. Before you move on, you do need to have a good idea\
    \ of how the Node child processes work.\n\n## The Cluster Module\n\nYou can use\
    \ the built-in `cluster` module to enable load balancing over the CPU cores in\
    \ an environment. The module is based on the `fork` method from the `child process`\
    \ module, allowing the main application process to be forked as many times as\
    \ there are CPU cores. Then, it takes over the requests that go to the main process\
    \ over the forked processes and load balances them.\n\nThe `Cluster` module is\
    \ a helper provided by Node.js, helping us get this cloning strategy implemented\
    \ but only on a single machine. Where you have larger machines with multiple resources\
    \ or when it works out cheaper and easier to add extra resources to a single machine\
    \ over adding other machines, the `Cluster` module works well, helping you implement\
    \ the strategy quickly.\n\nEven a small machine is likely to have several cores;\
    \ even if you are not concerned about your Node server’s load, the `Cluster` module\
    \ should be enabled anyway, increasing your server's availability and fault tolerance\
    \ level. It is easy to do and, when you use a process manager, such as `PM2`,\
    \ for example, all you have to do is provide the launch command with an argument.\n\
    \nLet’s look at how the `cluster` module is used natively and how it works. The\
    \ `Cluster` module structure is quite simple. A master process is created to fork\
    \ and manage several worker processes. The worker processes each represent an\
    \ application instance that needs to be scaled. The master process handles all\
    \ the incoming requests and decides which worker process an incoming request should\
    \ be handled by.\n\n![](Image0002.jpg)\n\nThe master process has a relatively\
    \ easy job because it picks the worker process using a round-robin algorithm.\
    \ This is already enabled as a default setting on all platforms except for Windows,\
    \ and global modification can let the operating system handle the load balancing.\n\
    \nThe load is evenly distributed across the available processes by the round-robin\
    \ algorithm, using a rotational basis process. The first incoming request goes\
    \ to the first available worker process, the second to the second process, and\
    \ so on. When the list has got to the end, the algorithm will go right back to\
    \ the beginning and start over.\n\nThis is one of the easiest load balancing algorithms\
    \ to use, but it’s one of many. There are other algorithms that allow priorities\
    \ to be assigned and the least loaded server selected or the one that responds\
    \ the quickest.\n\n## Load-Balancing an HTTP Server\n\nLet’s get into some practical\
    \ work. We want to close a simple HTTP server and load balance it using the `Cluster`\
    \ module. We’ll use the hello-world example server from Node and modify it slightly\
    \ to simulate CPU work before it responds.\n\nCreate a `server.js` file and add\
    \ the following code:\n\n```javascript\n// server.js\nconst http = require('http');\n\
    const pid = process.pid;\nhttp.createServer((req, res) => {\n  for (let i=0; i<1e7;\
    \ i++); // simulate CPU work\n  res.end(`Handled by process ${pid}`);\n}).listen(8080,\
    \ () => {\n  console.log(`Started process ${pid}`);\n});\n```\n\nI have included\
    \ `process.pid` inside the HTTP response. This will verify our balancer will work\
    \ by identifying the application instance that is handling a request.\n\nBefore\
    \ a cluster is created for cloning the server into several worker processes, we\
    \ need to run a benchmark to see how many requests can be handled by the server\
    \ every second. The Apache benchmarking tool is a good one for this; once the\
    \ server code above has been run, go ahead and run the command below:\n\n```bash\n\
    ab -c200 -t10 http://localhost:8080/\n```\n\nThis uses 200 concurrent connections\
    \ to test-load our server for 10 seconds.\n\n![](Image00021.jpg)\n\nMy machine\
    \ managed about 51 requests every second when I tried it, but these results will\
    \ differ by machine and platform. This is just a simple test that gives you an\
    \ idea of performance but must not be taken as being 100% accurate – all it will\
    \ show you is what difference using a cluster makes on an environment with several\
    \ cores.\n\nWe now have a benchmark we can use for reference, so now is the time\
    \ to use the `Cluster` module to use cloning to scale the application. Using the\
    \ same server as your `server.js` file, create another new file and name it `cluster.js`.\
    \ This is for the master process and needs the following content:\n\n```javascript\n\
    // cluster.js\nconst cluster = require('cluster');\nconst os = require('os');\n\
    if (cluster.isMaster) {\n  const cpus = os.cpus().length;\n  console.log(`Forking\
    \ for ${cpus} CPUs`);\n  for (let i = 0; i<cpus; i++) {\n    cluster.fork();\n\
    \  }\n} else {\n  require('./server');\n}\n```\n\nIn our `cluster.js` file, first,\
    \ we required the `os` and the `cluster` modules. The `os` module is used to read\
    \ how many CPU cores that `os.cpus()` can work with. With the `cluster` module,\
    \ we get the `isMaster` Boolean flag that is used to see if the `cluster.js` file\
    \ is loaded as a master process. When the file is executed the first time, the\
    \ master process is executed, and the `isMaster` flag is set a true. The master\
    \ process can be instructed to fork the server as many times as there are CPU\
    \ cores.\n\nNow that we have used the `os` module to read how many CPU cores we\
    \ have, we can use a for loop over the number to call `cluster.fork()`. When `cluster.fork`\
    \ is executed in the master process, `cluster.js` is run once but in worker mode\
    \ with `isMaster` set as false.\n\nEven a small machine is likely to have several\
    \ cores; even if you are not concerned about your Node server’s load, the `Cluster`\
    \ module should be enabled anyway, increasing your server's availability and fault\
    \ tolerance level. It is easy to do and, when you use a process manager, such\
    \ as `PM2`, for example, all you have to do is provide the launch command with\
    \ an argument. Let’s look at how the `cluster` module is used natively and how\
    \ it works.\n\nThe `Cluster` module structure is quite simple. A master process\
    \ is created to fork and manage several worker processes. The worker processes\
    \ each represent an application instance that needs to be scaled. The master process\
    \ handles all the incoming requests and decides which worker process an incoming\
    \ request should be handled by.\n\n![](Image00022.jpg)\n\n## Broadcasting Messages\
    \ to All Workers\n\nThe communication between the master and worker processes\
    \ is simple because `child_process.fork` API is used under the hood by the `Cluster`\
    \ module. This means there are also available communication channels between the\
    \ master and each worker process. Using our example from above, the list of worker\
    \ objects can be accessed using `cluster.workers`. This is another object containing\
    \ references to each worker and used for reading information about them. Because\
    \ there are communication channels between the master and worker processes, broadcasting\
    \ a message to all requires nothing more than a loop over the workers. Here’s\
    \ an example:\n\n```javascript\nObject.values(cluster.workers).forEach(worker\
    \ => {\n  worker.send(`Hello Worker ${worker.id}`);\n});\n```\n\n`Object.values`\
    \ is used to obtain an array containing the workers in the `cluster.workers` object.\
    \ The `send` function is used, for each individual worker, to send the values\
    \ that we want. In our `server.js` file, which is the worker file, when a message\
    \ is received from the master process, it is read by registering a message handler\
    \ on the global process. Here’s an example:\n\n```javascript\nprocess.on('message',\
    \ msg => {\n  console.log(`Message from master: ${msg}`);\n});\n```\n\nWhen I\
    \ test these additions to our server/cluster example, this is what I see:\n\n\
    ![](Image0024.jpg)\n\nHere, the master process sent every worker a message. One\
    \ thing to note from this is that the workers didn’t start in the order they were.\
    \ Let’s make things a bit more practical. We want to make our server reply with\
    \ a number indicating how many users were created in the database. We need a mock\
    \ function that will return the number of users in the database and, whenever\
    \ it is called, we want the value squared – this is known as growth:\n\n```javascript\n\
    // **** Mock DB Call\nconst numberOfUsersInDB = function() {\n  this.count = this.count\
    \ || 5;\n  this.count = this.count * this.count;\n  return this.count;\n}\n```\n\
    \nWhenever we call `numberOfUsersInDB`, we assume that a connection to the database\
    \ has been made. To get away from multiple DB requests being made, we want this\
    \ call cached for a set period, like 10 seconds. What we don’t want is the eight\
    \ forked workers doing their own requests because we don’t want eight requests\
    \ every 10 seconds. Instead, the master process can just do one request and let\
    \ the workers know the new user count value through the communication interface.\
    \ For example, in the master process mode, we can use one loop for broadcasting\
    \ that value to all of the workers:\n\n```javascript\n// Immediately after fork\
    \ loop within isMaster=true block\nconst updateWorkers = () => {\n  const usersCount\
    \ = numberOfUsersInDB();\n  Object.values(cluster.workers).forEach(worker => {\n\
    \    worker.send({ usersCount });\n  });\n};\nupdateWorkers();\nsetInterval(updateWorkers,\
    \ 10000);\n```\n\nHere, `updateWorkers` was invoked for the first time, and then\
    \ a `setInterval` was used to invoke it every 10 seconds. That way, all the workers\
    \ will get the new value for the user count every 10 seconds via the communication\
    \ channel, ensuring that only a single connection is made to the database. The\
    \ `usersCount` value can be used in the server code, with the exact same handler\
    \ for the message event. We need to use a module global variable to cache the\
    \ value, and then we can use it where we need it. Here’s another example:\n\n\
    ```javascript\nconst http = require('http');\nconst pid = process.pid;\nlet usersCount;\n\
    http.createServer((req, res) => {\n  for (let i=0; i<1e7; i++); // simulate CPU\
    \ work\n  res.write(`Handled by process ${pid}\\n`);\n  res.end(`Users: ${usersCount}`);\n\
    }).listen(8080, () => {\n  console.log(`Started process ${pid}`);\n});\nprocess.on('message',\
    \ msg => {\n  usersCount = msg.usersCount;\n});\n```\n\nHere, the worker web server\
    \ is made to respond with the value of the cached `usersCount`. If the cluster\
    \ code were tested now, you would get a value of 25 within the first 10 seconds,\
    \ as the total user count from all the workers – and don’t forget, only one request\
    \ gets made. This is all down to being communication channels between the workers\
    \ and master process.\n\n## Increasing Availability of the Server\n\nWhen you\
    \ run a single `Node.js` instance, there is a problem in that the instance must\
    \ be restarted whenever it crashes. That means there will be some downtime between\
    \ the crash and the restart, even with automated processes. This will also apply\
    \ when the server needs to deploy new code and has to be restarted. When you are\
    \ working with several instances, you just need a few extra lines of code to increase\
    \ system availability. The example below is a simulation of the server randomly\
    \ crashing. To do this a call to `process.exit` is made in a timer that will fire\
    \ after random time:\n\n```javascript\n// In server.js\nsetTimeout(() => {\n \
    \ process.exit(1) // death by random\n}, Math.random() * 10000);\n```\n\nWhen\
    \ worker processes exit in this manner, the master process is sent a notification.\
    \ This is done with the `cluster` object’s `exit` event and a handler can be registered\
    \ for the event, with a new worker being forked in that case.\n\n```javascript\n\
    // Immediately after fork loop within isMaster=true\ncluster.on('exit', (worker,\
    \ code, signal) => {\n  if (code !== 0 && !worker.exitedAfterDisconnect) {\n \
    \   console.log(`Worker ${worker.id} crashed. Starting new worker...`);\n    cluster.fork();\n\
    \  }\n});\n```\n\nIt makes sense to add an `if` condition as this ensures the\
    \ worker crashed and wasn’t disconnected manually by the user or the master process\
    \ didn’t kill it. For example, the master process may determine that too many\
    \ resources are used based on what load observes, and if that is the case, it\
    \ will need to kill some workers. To do this, the disconnect methods can be used\
    \ on worker and the `exitedAfterDisconnect` flag set as true. If the cluster were\
    \ run using the above handler, with `server.js` random crash, workers will begin\
    \ crashing after a random amount of time. The master process will begin forking\
    \ new ones to increase the’s availability. The availability can actually be measured\
    \ with the `ab` command we used earlier – it will show you the number of requests\
    \ the server cannot handle. I tested this code, and I got 7 failed requests in\
    \ the 10-second test out of more than 800, and was using 200 concurrent requests:\n\
    \n![](Image0025.jpg)\n\nThat shows availability of more than 99%. With just a\
    \ couple extra lines of code, we can forget about process crashes because the\
    \ master is watching them for us.\n\n## Zero-Downtime Restarts\n\nSo, what about\
    \ when we want all worker processes restarted, say when we need new code deployed?\
    \ We’ve got several running instances so, rather than all of them be together;\
    \ they can be restarted one at a time leaving the other workers serving requests\
    \ while one is restarted. This is pretty easy to implement using the `Cluster`\
    \ module. Once the master process is up and running, we don’t want it restarted\
    \ so we need to find a way of sending a command to it to tell it to begin restarting\
    \ the workers. If you are using Linux, this is easy because you just listen to\
    \ `SIGUSR2`, or some other process signal. The `kill` command can be triggered\
    \ on the process id, and the signal passed:\n\n```javascript\n// In Node\nprocess.on('SIGUSR2',\
    \ () => {\n  // ...\n});\n// To trigger that\n$ kill -SIGUSR2 PID\n```\n\nIn this\
    \ way, the master process is not killed, and we can tell it to start something\
    \ else. `SIGUSR2` is the correct signal to use in this case because it is a user\
    \ command. `SIGUSR1` is used by Node as a debugger, and you really don’t want\
    \ any conflicts. On Windows, there is no support for those process signals, so\
    \ another way needs to be found. There are few ways – we could use socket or standard\
    \ input. Or we could monitor the `process.pid` file for a remove event. To keep\
    \ things simple, I’m using Linux though, so you may just have to read this and\
    \ not follow practically if you use another system. While Node does work okay\
    \ on Windows, Linux is a safer platform for hosting Node applications on. It might\
    \ interest you to know that, if you are using the latest Windows versions, you\
    \ can make use of a Linux subsystem – if you are interested, look at Bash on Windows.\n\
    \nBack to our example, when the `SIGUSR2` signal is received by the master process,\
    \ it tells it the workers can be restarted but we want this done one at a time.\
    \ What this means is that the master process should only restart a worker when\
    \ the previous one has been restarted. To start this, what we need is a reference\
    \ to all the current workers and we do this using the `cluster.workers` object.\
    \ Then, the workers can be stored in an array:\n\n```javascript\nconst workers\
    \ = Object.values(cluster.workers);\n```\n\nAfter that, a `restartWorker` function\
    \ can be created to receive an index for the worker that needs to be restarted.\
    \ That way, the function can call itself when it is ready for a worker, ensuring\
    \ the workers are restarted in sequence. Here’s an example of that function:\n\
    \n```javascript\nconst restartWorker = (workerIndex) => {\n  const worker = workers[workerIndex];\n\
    \  if (!worker) return;\n  worker.on('exit', () => {\n    if (!worker.exitedAfterDisconnect)\
    \ return;\n    console.log(`Exited process ${worker.process.pid}`);\n    cluster.fork().on('listening',\
    \ () => {\n      restartWorker(workerIndex + 1);\n    });\n  });\n  worker.disconnect();\n\
    };\nrestartWorker(0);\n```\n\nIn the function, we get a reference to worker that\
    \ needs to be restarted. This function is called recursively so a sequence can\
    \ be formed. When there are no workers left to restart, we can return. Then, we\
    \ want to use `worker.disconnect` to disconnect the worker but before the next\
    \ worker is restarted, a new worker is forked to replace the one being disconnected.\
    \ The `exit` event can be used on worker to fork new workers. The `exitedAfterDisconnect`\
    \ flag set as true. If the flag is not true, something other than the `disconnect`\
    \ call triggered the `exit` – in that case, we can return. This is all that is\
    \ needed for a restart with zero downtime. Testing is just a case of reading master\
    \ process that is going to the `SIGUSR2` signal:\n\n```javascript\nconsole.log(`Master\
    \ PID: ${process.pid}`);\n```\n\nStart the cluster, then master process id needs\
    \ to be copied, and `kill -SIGUSR2` command is used to restart the cluster. The\
    \ `ab` command can also be run while cluster is being restarted, showing you the\
    \ effect this will have on availability.\n\n![](Image0026.jpg)\n\n## Shared State\
    \ and Sticky Load Balancing\n\nLike all good things, there is always a cost. When\
    \ a Node application is load-balanced, some of the features that single processes\
    \ are lost, and this is similar to what you might know as thread safety in other\
    \ languages. Thread safety is all about data sharing between threads but, in our\
    \ cases, it’s all about data sharing between worker processes. Take the cluster\
    \ setup, for example. Things can no longer be cached in memory because each worker\
    \ process has memory of its own. Caching something in one worker’s memory means\
    \ it is not accessible to any of the other workers. If something needs to be cached\
    \ in a cluster setup, a separate entity is required. All workers need to be able\
    \ to read and write to the API for that entity, which could be a database server\
    \ or where you want in-memory cache used, Redis or another server could be used.\
    \ Alternatively, you could create a Node process containing a Read/Write API that\
    \ all the other workers can talk to.\n\n![](Image0027.jpg)\n\nThis isn’t a disadvantage,\
    \ and you shouldn’t see it that way – using separate entities for caching needs\
    \ under one of the scalability strategies – decomposing. In fact, even if you\
    \ are using a single-core machine, you should really be doing this anyway. When\
    \ running a cluster setup, besides caching, something else becomes a problem –\
    \ general stateful communication. Because there is no guarantee the communication\
    \ will be with the same worker, it isn’t an option to create stateful channels\
    \ on any specific worker. User authentication is one of the most common examples\
    \ of this:\n\n![](Image0028.jpg)\n\nIn a cluster setup, the authentication request\
    \ is sent to the master balancer process. From there, it is sent on to a worker\
    \ – in this example, we assume that to be Worker A:\n\n![](Image0029.jpg)\n\n\
    Now, Worker A recognizes this user’s state. However, if another request is made\
    \ by the same user, eventually it will be sent to the other workers by the load\
    \ balancer, even though they don’t have the user authenticated. It will no longer\
    \ work to keep a reference to authenticated user sessions in memory for a single\
    \ instance. We can solve this in a few ways. We could just share the state across\
    \ all the workers – this is done by storing the information for these sessions\
    \ in a Redis node or a shared database. However, some code changes would be needed\
    \ for this strategy and it isn’t always an option to do that.\n\nIf modifying\
    \ the code to make this shared session storage is not possible, another strategy\
    \ could be used, although it isn’t as efficient. You can use something called\
    \ Sticky Load Balancing, and implementing it is easier as it is supported out\
    \ of the box by many load balancers. It’s a simple idea – when a user is authenticated\
    \ with an instance of a worker, a record of the relationship is maintained on\
    \ the load balancer level:\n\n![](Image0030.jpg)\n\nNow, when a new request is\
    \ sent by the same user, a lookup is done in the record to work out which server\
    \ has the authenticated session; the requests are then sent to that server, rather\
    \ than using standard distributed behavior. That way, the server-side code doesn’t\
    \ have to be changed. What we don’t get is the load balancing benefits for the\
    \ authenticated users so it really is something you should use if there is no\
    \ other way. Sticky load balancing is not actually supported by the cluster module,\
    \ but there are some load balancers that do it by default.\n\nChapter Sixteen:\
    \ Node.js Packaging\n\nIn recent times, the popularity of Node.js has shot up,\
    \ with JavaScript being ranked as the top programming language for many years\
    \ – by now, you should understand why that isn’t so surprising. JavaScript is\
    \ the ubiquitous front-end web programming language, meaning developers use and\
    \ understand it, no matter what programming language they have used in the past\
    \ – C, C#, Java, Ruby, and so on. Because the number of developers already using\
    \ JavaScript is so huge, the community is already full of frameworks and libraries,\
    \ offering help for just every requirement. That means it’s the right approach\
    \ to use it for server-side projects. Things Do Go Wrong Sometimes, and for no\
    \ apparent reason, many programmers who switch from a compiled to a scripted language\
    \ leave their good programming habits behind. All too often, we see programmers\
    \ developing applications in Node.js, or pure JS applications using Node.js, storing\
    \ their code somewhere like GitHub and then trying to pull it straight to their\
    \ production servers. Then they follow it with an `npm install` and a web build\
    \ – sometimes, they write tests but, more often than not, they decide it is much\
    \ easier to rebuild it all whenever they deploy their application. This can cause\
    \ a number of problems:\n"
