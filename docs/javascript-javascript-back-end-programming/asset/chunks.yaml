  trans: "\n\n- **Server（服务器）** – 服务器层是 Web 服务器所在的地方，它可以拦截客户端的任何请求并向其发送响应。\n- **Business（业务）**\
    \ – 业务层是应用服务器所在的地方。Web 服务器利用它进行需要处理的操作。它通过外部程序或数据库与最终层——数据层进行交互。\n- **Data（数据）**\
    \ – 数据层包含数据库和其他数据源。\n\n## 使用 Node 创建 Web 服务器\n\n在 Node.js 中，你可以访问 `http` 模块。它被用于创建服务器的\
    \ HTTP 客户端。下面你可以看到在端口 `8081` 监听的 HTTP 服务器的极精简结构。首先，创建一个名为 `server.js` 的程序，然后将此代码添加其中：\n\
    \n```javascript\nvar http = require('http');\nvar fs = require('fs');\nvar url\
    \ = require('url');\n// Create the server\nhttp.createServer( function (request,\
    \ response) {\n  // 解析包含文件名的请求\n  var pathname = url.parse(request.url).pathname;\n\
    \  // 打印请求所请求的文件名。\n  console.log(\"Request for \" + pathname + \" received.\"\
    );\n  // 从文件系统读取请求的文件内容\n  fs.readFile(pathname.substr(1), function (err, data)\
    \ {\n    if (err) {\n      console.log(err);\n      // HTTP Status: 404 : NOT\
    \ FOUN D\n      // Content Type: text/plain\n      response.writeHead(404, {'Content-Type':\
    \ 'text/html'});\n    } else {\n      // 找到页面\n      // HTTP Status: 200 : OK\n\
    \      // Content Type: text/plain\n      response.writeHead(200, {'Content-Type':\
    \ 'text/html'});\n      // 将文件内容写入响应体\n      response.write(data.toString());\n\
    \    }\n    // 发送响应体\n    response.end();\n  });\n}).listen(8081);\n// Console\
    \ 打印消息\nconsole.log('Server running at http://127.0.0.1:8081/');\n```\n\n接下来，创建另一个文件，这是一个\
    \ html 文件，并命名为 `index.htm`。将它保存到 `server.js` 所在的相同目录下：\n\n```html\n<html><head><title>Sample\
    \ Page</title></head><body>Hello World !</body></body></html>\n```\n\n现在你可以运行\
    \ `server.js` 来查看输出结果是什么：\n```bash\n$ node server.js\n```\n\n最后，需要验证输出：\n`Server\
    \ running at http://127.0.0.1:8081/`\n\n## 向 Node.js 服务器发送请求\n\n打开你正在使用的浏览器，然后打开此地址\
    \ – [`http://127.0.0.1:8081/index.htm`](http://127.0.0.1:8081/index.htm)，你应该能看到类似的内容：\n\
    \n![First Server Application](img/Image00017.jpg)\n\n需要在服务器端验证输出：\n`Server running\
    \ at http://127.0.0.1:8081/`\n`Request for /index.htm received.`\n\n## 使用 Node\
    \ 创建 Web 客户端\n\n你也可以使用 `http` 模块来创建一个 Web 客户端。首先，创建一个名为 `client.js` 的文件，并将以下内容复制进去：\n\
    \n```javascript\nvar http = require('http');\n// 请求将使用的选项\nvar options = {host:\
    \ 'localhost',port: '8081',path: '/index.htm'};\n// 我们使用回调函数来处理响应\nvar callback\
    \ = function(response) {\n  // 流会持续更新数据\n  var body = '';\n  response.on('data',\
    \ function(data) {\n    body += data;\n  });\n  response.on('end', function()\
    \ {\n    // 数据已完全接收。\n    console.log(body);\n  });\n};\n// 向服务器发送请求\nvar req\
    \ = http.request(options, callback);\nreq.end();\n```\n\n现在打开一个与 `server.js` 不同的命令行终端，并运行\
    \ `client.js` 来查看结果：\n```bash\n$ node client.js\n```\n\n不要忘记验证输出：\n```html\n<html><head><title>Sample\
    \ Page</title></head><body>Hello World!</body></body></html>\n```\n\n然后在服务器端验证：\n\
    `Server running at http://127.0.0.1:8081/`\n`Request for /index.htm received.`\n\
    \n如你所见，web 模块对于创建 Web 服务器和客户端来说非常简单。\n\n## 第十三章：Node.js Express 框架\n\n在本章中，我们将介绍\
    \ Express，它是一个构建为 Node.js 设计的灵活但极简的 Web 应用框架。它提供了强大的功能集，帮助我们构建单页和多页 Web 应用程序，以及混合应用。\n\
    \n### 什么是 Express.js?\n\n它是一个构建在 Node.js 之上的 Web 应用服务器框架，帮助我们构建不同类型的 Web 应用。现在标准的\
    \ Node.js 服务器框架是 MEAN 栈的后端。这是一个开源免费的软件栈，帮助我们构建动态 Web 应用程序和网站，它包含以下组件：\n\n1. **MongoDB**\
    \ – 这是标准的 NoSQL 数据库\n2. **Express.js** – 这是默认的框架\n3. **Angular** – 这是一个前端框架\n\
    4. **Node.js** – 这是一个 JavaScript 运行时环境\n\n（注：原文此处未列出完整 MEAN 组件，但根据常识补充了对应逻辑翻译）\n\
    \n### 安装并使用 Express\n\nExpress 很容易安装；通过命令行输入以下命令完成：\n\n```bash\nnpm install express\n\
    ```\n\n该命令会从 Node 包管理器下载并安装 Express。让我们创建一个监听 3000 端口的服务器：\n\n```javascript\n\
    var express=require('express');\nvar app=express();\napp.get('/',function(req,res){\n\
    \  res.send('Hello World!');\n});\nvar server=app.listen(3000);\n```\n\n代码说明：\n\
    \n1. 第一行 `require` 用于引入 `express` 模块。\n2. 第二行通过该模块创建一个实例。\n3. 第三行，我们创建了一个回调函数，当访问根路径时会被调用。\n\
    4. 参数 `res` 用于发送响应。\n5. 最后，`listen` 用于让服务器监听 3000 端口。\n\n![Node.js Express Framework\
    \ Tutorial - Learn in 10 Minutes](img/Image0018.jpg)\n\n从输出中可以看出，如果访问 localhost\
    \ 的 3000 端口，将显示 Hello World!。\n\n### 什么是路由 (Routes)?\n\n路由决定了应用程序如何响应对特定端点的请求。例如，客户端可以发送\
    \ `http` 请求，如 `POST`、`GET`、`DELETE` 或 `PUT`，针对任何 URL，例如：\n- `http://localhost:3000/Books`\n\
    - `http://localhost:3000/Students`\n\n在这个示例中，当对第一个 URL 发起 `GET` 请求时，输出将是书籍列表；如果对第二个发起，你将看到学生列表。根据你访问的\
    \ URL，Web 服务器会调用相应的功能，并将响应发送给客户端——这就是路由的工作原理。\n\n每个路由可以拥有一个处理函数，当路由匹配时，这些函数会被执行。典型的路由语法为：`app.METHOD(PATH,\
    \ HANDLER)` 在语法中：\n\n- `app` 是一个 express 模块实例。\n- `METHOD` 是 HTTP 请求方法之一，即 `POST`、`GET`、`DELETE`\
    \ 或 `PUT`。\n- `PATH` 指明服务器路径。\n- `HANDLER` 是在路由匹配时执行的函数。\n\n让我们看看如何在 Express 中实现路由。我们将创建三个路由：\n\
    \n1. `/Node` 路由 – 访问该路由时将显示 Node Tutorial 字符串。\n2. `/Angular` 路由 – 访问该路由时将显示 Angular\
    \ Tutorial 字符串。\n\n"
- fmt: "\n### 3. A default route / - this will display the Welcome to My Tutorials\
    \ String\n\nThe basic code is the same as we have seen previously, and the code\
    \ below is an add-on showing how to implement routing:\n\n```javascript\nvar express\
    \ = require('express');\nvar app = express();\napp.route('/Node').get(function(req,res){res.send(\"\
    Node Tutorial\");});\napp.route('/Angular').get(function(req,res){res.send(\"\
    Angular Tutorial\");});\napp.get('/',function(req,res){res.send('Welcome to My\
    \ Tutorials');}));\n```\n\n#### Code Explanation:\n\n1. The route is defined if\
    \ the [http://localhost:3000/Node](http://localhost:3000/Node) URL is accessed\
    \ in the browser. A callback function is attached to the route, and this is called\
    \ when the Node URL is browsed to.\n\nThere are two parameters to the callback\
    \ function:\n   - `res` is the primary parameter used for sending information\
    \ to the client\n   - `req` is the secondary parameter and contains information\
    \ pertaining to the request. On occasion, other parameters may be sent with the\
    \ request, and the `req` parameter helps find those parameters.\n\n2. The `send`\
    \ function is used to send the Node Tutorial string to the client should the Node\
    \ route be chosen.\n\n3. The route is defined if the [http://localhost:3000/Angular](http://localhost:3000/Angular)\
    \ URL is visited in the browser. A callback function is attached to the callback\
    \ function, which is called when the Angular URL is browsed to.\n\n4. The `send`\
    \ function is used to send the Angular Tutorial string to the client should the\
    \ Angular route be chosen.\n\n5. The default route is chosen if the [http://localhost:3000/Angular](http://localhost:3000/Angular)\
    \ URL is visited in the browser – this is the application root. When this is chosen,\
    \ the Welcome to My Tutorials message is sent to the client.\n\nProvided the command\
    \ successfully executes, you should see the Welcome to My Tutorials screen in\
    \ your browser. The output will show that, by browsing to the localhost on port\
    \ 3000 URL, the Welcome to My Tutorials message is shown on the screen – this\
    \ is the default message that we specified in the code.\n\n### Building a Web\
    \ Server with Express.js\n\nIn our example above, we saw how to decide what the\
    \ output should be based on a route. This is what is used in modern-day web applications,\
    \ while the rest of the webserver is all about using Node.js templates. When you\
    \ create quick Node applications on the fly, one of the easiest ways to do it\
    \ is to use Node.js templates. There are loads of frameworks in the market, and\
    \ we are going to use the jade framework.\n\nThe Node Package Manager is used\
    \ to install jade by inputting the following on the command line:\n```bash\nnpm\
    \ install jade\n```\nThis command asks the `NPM` to download the modules we want\
    \ and install them.\n\nLet’s create a jade template. Create a new file and call\
    \ it `index.jade` and put the following code in, making sure the file is created\
    \ in the folder called views.![![Node.js Express FrameWork Tutorial - Learn in\
    \ 10 Minutes](Image00019.jpg)](https://www.guru99.com/images/NodeJS/010716_0613_NodejsExpre7.png)\n\
    \nThe page title is going to be changed to the value that gets passed when invoking\
    \ the template. We are also indicating that the header tag text will be replaced\
    \ with what is passed in the template.\n\n```javascript\nvar express=require('express');\n\
    var app=express();\napp.set('view engine','jade');\napp.get('/',function(req,res){res.render('index',{title:'My\
    \ Tutorials',message:'Welcome'})});\nvar server=app.listen(3000,function() {});\n\
    ```\n\n#### Code Explanation:\n\n1. First, “view engine” is specified in the applications\
    \ – this is used for rendering the templates and, because jade is being used,\
    \ that is what we specify.\n\n2. We use the `render` function for rendering the\
    \ web page. Here, we render the `index.jade` template we created before.\n\n3.\
    \ We pass two values into the `title` and `message` parameters – “My Tutorials”\
    \ and “Welcome” respectively. These are replaced by the parameters we specified\
    \ in the template for the `title` and `message` parameters.\n\nIf you successfully\
    \ execute the command, you will see the Welcome screen in your browser. From the\
    \ output, you can see that the page title is set as My Tutorials and the page\
    \ header is set as Welcome. This happens because we invoked the Jade template\
    \ in the application.\n\n### Quick Summary\n\nThe Express framework is commonly\
    \ used in the development of applications in Node.js and is built on the Node\
    \ framework. It is used to help us build server-based applications quickly. We\
    \ use routes to divert our users to different areas in the application based on\
    \ what they request – the route responses may be varied based on what the user\
    \ needs to see. Lastly, templates are used for efficiently injecting the right\
    \ content, and one of the more popular templating engines for Node applications\
    \ is Jade.\n\n### Chapter Fourteen: Node.js RESTful API\n\nLet’s start with the\
    \ name – REST comes from Representational State Transfer. First introduced in\
    \ 2000 by Roy Fielding, REST is an architecture with web-based standards that\
    \ uses the `HTTP` protocol. REST revolves around resources – all components are\
    \ resources, and a common interface accesses these by using the standard `HTTP`\
    \ methods. REST servers basically provide an access point to the resources, and\
    \ the REST client uses the `HTTP` protocol to access the resources and modify\
    \ them. `URIs` and global IDs are used to identify each resource, and REST represents\
    \ resources in different ways, such as `XML`, and text but the most common representation\
    \ is `JSON`.\n\n#### HTTP Methods\n\nThese are the four most common `HTTP` methods\
    \ used in REST architecture:\n- `GET` – used for providing read-only access to\
    \ resources.\n- `PUT` – used for creating new resources.\n- `DELETE` – used for\
    \ removing resources.\n- `POST` – used for updating resources or creating new\
    \ ones.\n\n#### RESTful Web Services\n\nWeb services are collections containing\
    \ standards and open protocols for the exchange of data between systems and applications.\
    \ Software applications use web services for data exchange over computer networks\
    \ – these applications are written in all sorts of programming languages and are\
    \ run on all platforms. The interoperability, i.e., when Python and Java communicate\
    \ or Linux applications and Windows applications, is all down to the open standards.\
    \ When a web service is based on REST architecture, it is called a RESTful web\
    \ service. These implement the REST architecture concept by using `HTTP` methods.\
    \ Typically, a RESTful web service will define a Uniform Resource Identifier (`URI`),\
    \ a service that provides a representation of the resources, like `JSON` and the\
    \ `HTTP` methods.\n\n#### How to Create RESTful for a Library\n\nLet’s say that\
    \ we have a database, based on JSON, containing a list of users in a file called\
    \ `users.json`:\n```json\n{\"user1\" : {\"name\" : \"michael\",\"password\" :\
    \ \"password1\",\"profession\" : \"teacher\",\"id\": 1}\n\"user2\" : {\"name\"\
    \ : \"sara\",\"password\" : \"password2\",\"profession\" : \"scientist\",\"id\"\
    : 2}\n\"user3\" : {\"name\" : \"ronnie\",\"password\" : \"password3\",\"profession\"\
    \ : \"clerk\",\"id\": 3}}\n```\nUsing this information we can provide all of these\
    \ RESTful APIs:\n\n| | URI | HTTP Method | POST Body | Result |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| 1 | `listUsers` | `GET` | Empty | Shows list of all\
    \ the users |\n| 2 | `addUser` | `POST` | JSON string | Adds a new user’s details\
    \ |\n| 3 | `deleteUser` | `DELETE` | JSON string | Deletes a user |\n| 4 | `:id`\
    \ | `GET` | Empty | Shows a user’s details |\n"
