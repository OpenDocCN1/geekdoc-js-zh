    port that the server listens to, you can see the right output on your screen.What
    are Routes?Routes determine how a client request for a specific endpoint is responded
    to by the application. For example, the client can make http requests, such as
    POST, GET, DELETE, or PUT, for any URL, such as these:http://localhost:3000/Bookshttp://localhost:3000/StudentsIn
    this example, when a GET request is made on the first of the URLs, the ideal output
    would be a list of books, while if it was made on the second one, you would see
    a list of students. Based on what URL you access, certain functionality is invoked
    on the webserver, and the response is sent on to the client – that is how routing
    works.Each route can have at least one handler function and, when the route is
    matched, these are executed.The typical route syntax is:app.METHOD(PATH, HANDLER)In
    the syntax:


    1.  app is an express module instance


    2.  METHOD is one of the HTTP request methods, i.e., POST, GET, DELETE, or PUT


    3.  PATH indicates a server path


    4.  HANDLER is a function that is executed when a route has been matched


    Let’s see how routes can be implemented in Express. We will create three routes:


    1.  A /Node route – this displays the Node Tutorial string when the route is accessed


    2.  A /Angular route – this displays the Angular Tutorial string if the route
    is accessed'
