    referencing a subset of the memory space; it is NOT a new one. When you modify
    the slice, you also modify the buffer. For example:var puddle = frosty.slice(16,
    19)> puddle.toString()''☃ ''> puddle.write("___")3> frosty.toString("utf-8", 0,
    19)''Happy birthday! ___''And now, Frosty is nothing more than a bunch of underscores!In
    the next chapter, we move on to Node.js StreamsChapter Eight: Node.js StreamsNode.js
    streams are not easy to work with and they are certainly not easy to understand.
    Some of the biggest names in the business fear them and find them hard to works
    with so how are you supposed to understand them?Don’t worry, in this chapter,
    we will simplify things as much as we possibly can.What Are Streams?They are one
    of the most fundamental concepts behind any Node.js applications. Streams are
    a method to handle data and sequentially or read and write input to output.Streams
    can be used to read and write network communications, files, and any other end-to-end
    exchange of information, and they do it quite efficiently too. So what makes them
    unique?Rather than a file being read all at once into a file, as is traditional,
    streams take data in chunks, reading it a bit at a time and processing it without
    needing it all to stay in memory.When you work with large amounts of data, streams
    come into their own, proving incredibly powerful. For example, some files are
    larger than the memory space you have free, which makes it all but impossible
    to read the entire file into memory for processing. Because streams can process
    data in smaller chunks, larger files can easily be read.For example, take Netflix,
    YouTube, or some other streaming service. When you use these services, the files
    don’t need to be downloaded before watching and listening to them. Your browser
    will receive the video and audio as a continuous stream of data chunks, allowing
    you to listen and watch without interruption.However, streams are not just about
    big data and media. They also provide us with another powerful aspect of coding
    – composability. When you have composability in mind while designing, you can
    combine multiple components is a specific way to get the same result type. Node.js
    allows us to compose powerful code, using streams to pipe data between smaller
    code chunks.Why StreamsBecause streams give us two very big advantages over other
    methods of data handling:'
