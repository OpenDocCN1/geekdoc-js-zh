    \n# 第十章：Node.js 全局对象\n\n本章分为两个部分——第一部分讨论 Node.js 全局对象，第二部分查看 node.js 全局对象。如你所见，它们是不同的。\n\
    \n## 全局对象\n\n全局对象是顶层对象，我们可以从任何地方访问它。事实上，你可能在甚至没有意识到的情况下就已经在使用它的模块和函数了。假设我们想检查一个变量是否为数组：\n\
    \n```javascript\nlet x = [1, 2, 3];\nlet result = Array.isArray(x) // true\n```\n\
    \n那么，`Array` 是如何在不需要将其作为模块的情况下使用的呢？通过全局对象。要查看全局对象中包含的内容，你只需要做的就是使用 `node` 命令进入\
    \ REPL。打开命令行界面并运行不带选项的 `node` 命令。然后按两次 Tab 键，你将看到全局对象中所有可用模块和函数——这些可以在不需要模块的情况下使用。\n\
    \n![我们如何查看全局对象中包含什么？](img/Image00010.jpg)\n\n## 全局模块和函数\n\n我毫不怀疑，在这一过程中，你已经使用了其中相当多，例如\
    \ `NaN`、`isNaN`、`Infinity`、`Promise`、`String` 等。当你想向全局对象添加内容时，你必须先修改全局对象：\n\n\
    `global.myName = “marypoppins\"`\n\n现在，可以在你项目的任何地方调用 `myName`。这里有一个简单的示例示例：\n\n\
    FirstFile.js\n```javascript\nglobal.myName = \"marypoppins\";\n```\n\nSecondFile.js\n\
    ```javascript\nrequire('FirstFile.js');\nconsole.log(myName); // 它将记录 \"marypoppins\"\
    \n```\n\n这仅仅是为了演示——Node.js 的最佳实践规定，出于任何原因，都不应该修改全局对象。让我们来看全局对象中两个非常重要的模块——`process`\
    \ 和 `buffer`。\n\n### Process\n\n该对象包含了许多关于进程的有用信息：\n\n*   `Process.versions` –\
    \ 这告诉我们每个 node 核心模块的各个，例如 `openssl`、`zlib`、`v8` 等。\n\n![全局对象中 process 模块的结果](img/Image00011.jpg)\n\
    \n*   `Process.env` – 告诉我们关于 node 运行环境的一些重要信息。这里是一些好的例子：\n\n```\nprocess.env.shell‘/usr/bin/fish’\n\
    process.env.LANG‘en_US.UTF-8’\nprocess.env.USER‘marypoppins’\n```我们我们还可以使用 `process.stdin`、`process.stdout`\
    \ 和 `process.stderr`（它们都是流）来与环境交互。process 对象是一个 `EventEmitter` 实例，这意味着该对象可以用于注册事件监听器：\n\
    \n![显示 process 如何作为事件监听器的简单代码](img/Image00012.jpg)\n\n这段代码的结果是：![用于文章的图片](img/Image00013.jpg)\
    \ 你也可以使用 `process.exit(exitCode)` 用你指定的退出代码来结束你的代码。\n\n### Buffer\n\nbuffer 是一个\
    \ `v8` 堆外部的内存块，用于帮助我们把数据放入内存。简单来说，它是一个表示二进制数据序列的低级数据结构；一旦分配，就无法调整其大小。从 buffer\
    \ 读取数据需要指定编码。创建 buffer 的方式包括：\n\n*   `Buffer.from()` - 这使用任何内容（如图像、文件或字符串）来创建\
    \ buffer\n*   `Buffer.alloc()` – 这创建一个具有指定大小的填充缓冲区\n*   `Buffer.allocUnsafe()`\
    \ - 这创建一个指定大小的缓冲区，它们可能包含旧数据，但在性能方面具有优势。这也可以使用 `.fill()` 进行填充。\n\n下面的图片显示了 `Buffer.alloc()`\
    \ 和 `Buffer.allocUnsafe()` 之间的差异。![Buffer.alloc 和 Buffer.allocUnsafe 的差异](img/Image00014.jpg)\
    \ 正如你所见，alloc 创建的 buffer 没有数据，但 unsafe buffer 中包含一些旧数据。这是另一个例子：![简单的 buffer 创建](img/Image00015.jpg)\
    \ 在看控制台输出之前，先对结果猜一看：`<Buffer 48 65 6c 6c 6f 20 47 75>`\n\n## 全局对象\n\n如你现在所收集到的，Node.js\
    \ 采用模块化方法，这意味着当一个函数、变量或对象定义在文件内部时，它是文件局。当你想在另一个文件中使用一个文件中定义的变量时，你需要使用 `module.exports`\
    \ 语法导出，然后使用 `require(path_of_file)` 导入另一个文件。在 Node.js 中，全局对象的工作方式有点不同。因为它们是全局的并且可以在所有模块中访问，因此不需要导入或导出它们——它们可以直接位于你的应用程序中任何你想的地方。\n\
    \n### 前提条件\n\n你需要安装 Node.js，并且需要一些命令行或终端知识。我们将查看一些重要的常用的 Node.js 全局对象：\n\n*  \
    \ `process`\n*   `__dirname`\n*   `__filename`\n*   `require()`\n*   `module`\n\
    *   `URL`\n\n首先，在主目录下创建一个文件夹并命名为 `nodejs`：`mkdir nodejs`。现在进入该文件夹：`cd nodejs`。一旦进入\
    \ nodejs 目录，创建一个新文件并命名为 `main.js`：`touch main.js`。注意 如果你使用的是 Windows，`touch` 将不起作用。唯一的解决方法是使用文本编辑器创建文件并将其保存到你的\
    \ nodejs 目录。\n\n让我们来看这些对象。\n\n### Process\n\n这个全局对象提供了许多关于程序执行环境的有用信息。它提供的一些信息包括架构、平台、进程\
    \ ID、运行时间、环境变量、当前工作目录等。\n\n*   `process.arch` – 返回系统的 CPU 架构，某些值包括 `x32`、`x64`\
    \ 和 `ia32`。\n*   `process.platform` – 返回运行程序的操作系统或平台。返回的字符串示例包括 `openbsd`、`linux`、`freebsd`\
    \ 和 `win32`。\n*   `process.id` – 返回 node 进程的 PID 或进程 ID\n*   `process.cwd()` –\
    \ 这是一个返回执行程序当前工作目录的方法\n*   `process.chdir(directory)` - 此方法用于更改当前工作目录\n\n"
- fmt: '

    The `process` object has many properties but we are going to focus our attention
    on the four primary ones and create a program with them:


    Open `main.js` and input the following:


    ```javascript

    // print current working directory

    console.log(`Starting directory: ${process.cwd()}`);

    console.log(`This platform is ${process.platform}`);

    console.log(`Process PID: ${process.pid}`);

    console.log(`The CPU Architecture is: ${process.arch}`);

    // change working directory to Documents

    process.chdir(''../Documents'');

    console.log(`Ending directory: ${process.cwd()}`);

    ```


    Now run this, ensuring you are in the `nodejs` directory when you do so:

    ```bash

    node main.js

    ```


    And the output is something like:

    Starting directory: /home/<your username>/nodejs

    This platform is linux

    Process PID: 19253

    The CPU Architecture is: x64

    Ending directory: /home/<your username>/Documents


    ## require()

    `require()` method is used for importing or loading JSON, local files, and modules.


    If you want to import JSON or a local module, the file’s relative path is required:

    Local Module:

    ```javascript

    const localModule = require(''.path/filename.js'');

    ```

    JSON file:

    ```javascript

    const jsonData = require(''.path/filename.json'');

    ```


    If you want a module imported from the `node_modules` directory or a built-in
    Nodejs module, the module name must be passed to the `require()` method:

    ```javascript

    // fs is a built-in module

    const fileSystem = require(''fs'');

    ```


    ## __dirname

    `__dirname` returns the path of the directory where the script is being executed.
    You will not be able to access it in the Node.js REPL.


    Take the code out of `main.js` and add this in instead:

    ```javascript

    console.log(__dirname);

    ```

    The output will be:

    /home/<your username>/nodejs

    This is useful when you want to use Node.js to read and write files.


    ## __filename

    `__filename` returns the executing file’s absolute path. Again, it cannot be accessed
    in the REPL.


    Remove the code from `main.js` and put this in instead:

    ```javascript

    console.log(__filename);

    ```

    The output will be:

    /home/<your username>/nodejs/main.js


    ## module

    The `module` global object references the current module and in it is information
    concerning the current module. CommonJS can use for working out how the module
    should be imported.


    Whenever a file is created, like the `main.js` file we created earlier, it turns
    into a module. Logging the `module` allows us to get information about our `main.js`
    module:

    ```javascript

    console.log(module);

    ```

    When you log the `module`, an object is returned with all the information about
    the module:

    ```javascript

    Module {id: ''.'',path: ''/home/<your username>/nodejs'',exports: {},parent: null,filename:
    ''/home/<your username>/nodejs/main.js'',loaded: false,children: [],paths: [''/home/<your
    username>/nodejs/node_modules'',''/home/<your username>/node_modules'',''/home/node_modules'',''/node_modules'']}

    ```

    When the `main.js` module is being imported in another file by CommonJS, it will
    look in the `paths` that come from `Module.paths` for the `main.js` file.


    ## URL

    `URL` is a constructor method used for parsing the URL and returning an object
    that has the parsed data in it.


    Delete everything from `main.js` so we can parse the following URL (this is not
    a real URL) – `https://www.marypoppins.madeup`. If you want, you can try this
    with a real URL – just input the details:

    ```javascript

    const url = new URL(''https://www.marypoppins.madeup/'');

    console.log(`The url protocol: ${url.protocol}`);

    console.log(`The url path : ${url.pathname}`);

    console.log(`The url hostname: ${url.hostname}`);

    ```

    The output will be:

    The url protocol: https:

    The url path : /articles/

    The url hostname: www.marypoppins,madeup


    Now you know what the global object is and how to use the most common global objects
    Node.js has to offer.


    # Chapter Eleven: Node.JS Utility Modules

    The Node.js module library contains quite a few utility modules commonly used
    while developing applications based on Node. This chapter will detail those modules,
    what they are used for, and give a few code examples.


    ## OS Module

    The `OS` module provides utility functions related to the operating system. The
    syntax below is used to import it:

    ```javascript

    var os = require("os")

    ```


    ### OS Module Methods

    These are the methods for the `os` module:


    | METHOD | DESCRIPTION |

    | :--- | :--- |

    | `os.tmpdir()` | Will return the default directory for the OS temp files |

    | `os.endianness()` | Returns the CPU’s endianness, with possible values of LE
    or BE |

    | `os.hostname()` | Returns the operating system’s hostname |

    | `os.type()` | Returns the system name for the operating system |

    | `os.arch()` | Returns the CPU architecture for the operating system. Possible
    values are arm, x64 and ia32. |

    | `os.platform()` | Returns the OS platform |

    | `os.release()` | Returns the release version of the operating system |

    | `os.uptime()` | Returns system uptime (seconds) |

    | `os.loadavg()` | Returns an array with load averages of 1, 5, and 15 minutes
    |

    | `os.totalmem()` | Returns the total system memory amount (bytes) |

    | `os.freemem()` | Returns the free system memory amount (bytes) |

    | `os.cpus()` | Returns an object array with information about each installed
    CPU/core. This includes the speed (MHz), model, and times – how much time in seconds
    was spend in irq, idle, sys, nice, and user by the CPU/core |

    | `os.networkInterfaces()` | Provides a list of the network interfaces |


    ### OS Module Properties

    The primary property for this module is `os.EOL`. It is a constant that defines
    the right Endof-Line marker for the operating system.


    In the code demonstration below, you can see some of the OS module methods. If
    you want to join, create a file `main.js` and input this:

    ```javascript

    var os = require("os");

    // Endianness

    console.log(''endianness : '' + os.endianness());

    // OS type

    console.log(''type : '' + os.type());

    // OS platform

    console.log(''platform : '' + os.platform());

    // Total system memory

    console.log(''total memory : '' + os.totalmem() + " bytes.");

    // Total free memory

    console.log(''free memory : '' + os.freemem() + " bytes.");

    ```

    Run the program and you should see something similar to the following:

    ```bash

    $ main.js

    ```


    ## Path Module

    The `path` module contains utilities to help us handle and transform file paths.
    The following syntax is used for importing it:

    ```javascript

    var path = require("path")

    ```


    ### Path Module Methods

    These are the Path methods you are likely to use:


    | METHOD | DESCRIPTION |

    | :--- | :--- |

    | `path.normalize(p)` | Used to normalize string paths, take care of the `.` and
    `..` bits |

    | `path.join([path1][, path2][ ...])` | Joins the arguments and the resulting
    path is normalized |

    | `path.resolve([from ...], to)` | Will resolve to an absolute path |

    | `path.isAbsolute(path)` | Determines if a path is absolute. No matter what the
    working directory is, absolute paths always resolve to the same location. |

    | `path.relative(from, to)` | Solves the relative path between from and to |

    | `path.dirname(p)` | Returns a path’s directory name |

    | `path.basename(p[, ext])` | Returns a path’s last portion |

    | `path.extname(p)` | Returns a path’s extension form the final `.` to the string’s
    end in the path’s last portion. If the last portion does not have a `.` or `.`
    is its first character, an empty string is returned |

    | `path.parse(pathString)` | Returns an object from the path string |

    | `path.format(pathObject)` | Returns a path string from an object |


    ### Path Module Properties

    These are the properties for the Path module:


    | PROPERTIES | DESCRIPTION |

    | :--- | :--- |

    | `path.sep` | File separator specific to the platform and is `/` or `\` |

    | `path.delimiter` | Path delimiter specific to the platform and `:` or `;` |

    | `path.posix` | Gives access to the path methods mentioned above but only allows
    interaction in a way compatible with posix |

    | `path.win32` | This also gives us access to the path methods mentioned above
    but only allows interaction in a way compatible with win32 |

