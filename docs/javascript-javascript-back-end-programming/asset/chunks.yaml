  trans: "\n\n# DNS 模块错误代码\n\n所有的 DNS 查询可能返回以下代码之一：\n\n- `dns.NODATA` – DNS 服务器回答中没有返回数据\n\
    - `dns.FORMERR` – 根据 DNS 服务器的判断，查询格式错误。\n- `dns.SERVFAIL` – DNS 服务器返回了通用性失败。\n\
    - `dns.NOTFOUND` – 未找到域名。\n- `dns.NOTIMP` – DNS 服务器未实现请求的操作。\n- `dns.REFUSED`\
    \ – DNS 服务器拒绝了查询。\n- `dns.BADQUERY` – DNS 查询格式错误。\n- `dns.BADNAME` – 主机名格式错误。\n\
    - `dns.BADFAMILY` – 不支持地址族。\n- `dns.BADRESP` – DNS 回复格式错误。\n- `dns.CONNREFUSED`\
    \ – 无法连接 DNS 服务器。\n- `dns.TIMEOUT` – 连接 DNS 服务器超时。\n- `dns.EOF` – 文件结束符。\n- `dns.FILE`\
    \ – 读取文件时出错。\n- `dns.NOMEM` – 内存不足。\n- `dns.DESTRUCTION` – 通道正在销毁。\n- `dns.BADSTR`\
    \ – 字符串格式错误。\n- `dns.BADFLAGS` – 指定的标志非法。\n- `dns.NONAME` – 指定的主机名不是数字。\n- `dns.BADHINTS`\
    \ – 指定了非提示标志。\n- `dns.NOTINITIALIZED` –尚未初始化 c-ares 库。\n- `dns.LOADIPHLPAPI` –\
    \ 加载 `iphlpapi.dll` 错。\n- `dns.ADDRGETNETWORKPARAMS` – 未找到 `GetNetworkParams`\
    \ 函数。\n- `dns.CANCELLED` – DNS 查询已取消。\n\n# Domain 模块\n\n`Domain` 模块是一个帮助将多个 I/O\
    \ 操作作为一组处理的工具。如果这些操作没有被处理，Node 应用将会崩溃。\n\n### 内部绑定\n错误发射器在 `domain` 的上下文中执行代码。使用以下语法创建它：\n\
    \n```javascript\nvar domain = require(\"domain\");\nvar child = domain.create();\n\
    domain.on('error', function (err) {\n    if (err) {\n        console.log('reverse\
    \ for ' + address + ': ' + JSON.stringify(hostnames));\n    }\n});\ndns.lookup('www.com',\
    \ function onLookup(err, address) {\n    console.log('address:', address);\n});\n\
    ```\n\n运行文件查看输出：\n```bash\n$ node main.js\n```\n最后，验证输出：\nlistener handled this\
    \ error (To be handled by listener)\ndomain1 handled this error (To be handled\
    \ by domain1)\ndomain2 handled this error (To be handled by domain2)\nevents.js:72\
    \ throw er; // 未处理的 'error' 事件\nError: Converted to exception. System will crash!\n\
    at Object. (/web/com/142772220_30772/main.js:40:24)\nat Module._compile (module.js:456:26)\n\
    at Object.Module._extensions..js (module.js:474:10)\nat Module.load (module.js:356:32)\n\
    at Function.Module._load (module.js:312:12)\nat Function.Module.runMain (module.js:497:10)\n\
    at startup (node.js:119:16)\nat node.js:906:3\n\n### 外部绑定\n错误发射器使用自己的方法被显式添加到\
    \ domain 中。使用以下语法导入该模块：\n\n```javascript\nvar EventEmitter = require(\"events\"\
    ).EventEmitter;\nvar domain = require(\"domain\");\nvar emitter1 = new EventEmitter();\n\
    // 创建一个 domain\nvar domain1 = domain.create();\ndomain1.on('error', function(err)\
    \ {\n    console.log(\"domain1 handled this error (\"+err.message+\")\");\n});\n\
    // 显式绑定\ndomain1.add(emitter1);\nemitter1.on('error',function(err) {\n    console.log(\"\
    listener handled this error (\"+err.message+\")\");\n});\nemitter1.emit('error',new\
    \ Error('To be handled by listener'));\nemitter1.removeAllListeners('error');\n\
    emitter1.emit('error',new Error('To be handled by domain1'));\n\nvar domain2 =\
    \ domain.create();\ndomain2.on('error', function(err) {\n    console.log(\"domain2\
    \ handled this error (\"+err.message+\")\");\n});\n// 隐式绑定\ndomain2.run(function()\
    \ {\n    var emitter2 = new EventEmitter();\n    emitter2.emit('error',new Error('To\
    \ be handled by domain2'));\n});\ndomain1.remove(emitter1);\nemitter1.emit('error',\
    \ new Error('Converted to exception. System will crash!'));\n```\n\n### Domain\
    \ 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `domain.run(function)` | 该方法在 `domain`\
    \ 上下文中运行指定的函数。它隐式地绑定所有定时器和低级请求。这是 domain 的基本用法。 |\n| `domain.add(emitter)` | 显式将发射器添加到\
    \ domain。如果任何事件处理器抛出错误或发射器发射了错误，该错误将发送到 domain 的错误事件。 |\n| `domain.remove(emitter)`\
    \ | 与上述相反，从 domain 中移除指定的发射器。 |\n| `domain.bind(callback)` | 返回的函数是 `callback`\
    \ 函数的包装。当函数被调用时，抛出的错误将发送到 domain 的错误事件。 |\n| `domain.intercept(callback)` | 与\
    \ `domain.bind(callback)` 相似，但它还可以拦截作为第一个参数传递的错误消息。 |\n| `domain.enter()` | 被\
    \ `bind`、`run` 和 `intercept` 方法使用，将 `process.domain` 和 `active` 指向 domain 并将其隐式推入栈中。此方法标记绑定到特定\
    \ domain 的 I/O 操作的开始。 |\n| `domain.exit()` | 从栈中弹出并退出当前 domain。当执行切换到另一个异步调用的上下文时，必须退出当前\
    \ domain。此方法标记调用链的中断或结束。 |\n| `domain.dispose()` | 当调用此方法时，通过 `intercept`、`bind`\
    \ 或 `run` 绑定到 domain 的回调失效，并触发 `dispose` 事件。 |\n\n### Domain 属性\n\n有一个主要的 domain\
    \ 属性 `domain.members`。它是一个包含显式添加到 domain 的发射器和定时器的数组。\n\n# 第十二章：Node.js Web 模块\n\
    \nWeb 服务器就是应用程序；简单如此。它们处理 HTTP 客户端发送的 HTTP 请求——这可能是 浏览器——并通过返回网页进行响应。通常，Web 服务器会交付带有样式表、图像和脚本的\
    \ HTML 文档。\n\n大多数 Web 服务器支持服务器端脚本，它们使用脚本语言或将任务发送到其他地方（通常是应用程序服务器），后者从数据库中检索数据并执行复杂的逻辑。然后，结果通过\
    \ Web 服务器发送给 HTTP 客户端。最常见的之一是开源项目 Apache Web 服务器。\n\n## Web 应用架构\n\n通常，Web 应用被分为四个独立的层，如下所示：\n\
    \n![Web 架构](img/Image00016.jpg)\n\n让我们分解这张图：\n\n- **客户端 (Client)** – 客户端层由应用程序、移动浏览器或\
    \ 浏览器组成，它们可以发起并发送 Web 服务器的 HTTP 请求。\n\n"
- fmt: "\n- **Server** – The server layer is where the webserver resides, and this\
    \ can intercept any request the client makes and send it the response.\n- **Business**\
    \ – The business layer is where the application server resides. The web server\
    \ utilizes this for the processing that needs to be done. It interacts with the\
    \ final layer, the data layer, through an external program or the database.\n\
    - **Data** – The data layer contains databases and other data sources.\n\n## Using\
    \ Node to Create a Web Server\n\nIn Node.js, you have access to an `http` module.\
    \ This is used for creating a server’s HTTP client. Below you can see the absolute\
    \ minimum structure of an HTTP server listening at port `8081`. First, create\
    \ a program called `server.js` and then add this code to it:\n\n```javascript\n\
    var http = require('http');\nvar fs = require('fs');\nvar url = require('url');\n\
    // Create the server\nhttp.createServer( function (request, response) {\n  //\
    \ Parse the request that contains the file name\n  var pathname = url.parse(request.url).pathname;\n\
    \  // Print the name of the file the request was made for.\n  console.log(\"Request\
    \ for \" + pathname + \" received.\");\n  // Read the requested file content from\
    \ the file system\n  fs.readFile(pathname.substr(1), function (err, data) {\n\
    \    if (err) {\n      console.log(err);\n      // HTTP Status: 404 : NOT FOUN\
    \ D\n      // Content Type: text/plain\n      response.writeHead(404, {'Content-Type':\
    \ 'text/html'});\n    } else {\n      //Page found\n      // HTTP Status: 200\
    \ : OK\n      // Content Type: text/plain\n      response.writeHead(200, {'Content-Type':\
    \ 'text/html'});\n      // Write the content of file to the response body\n  \
    \    response.write(data.toString());\n    }\n    // Send the response body\n\
    \    response.end();\n  });\n}).listen(8081);\n// Console prints the message\n\
    console.log('Server running at http://127.0.0.1:8081/');\n```\n\nNext, create\
    \ another file, this one an html file, and name it `index.htm`. Save it in the\
    \ same directory `server.js` was created in:\n\n```html\n<html><head><title>Sample\
    \ Page</title></head><body>Hello World !</body></html>\n```\n\nNow you can run\
    \ `server.js` to see what the output is:\n```bash\n$ node server.js\n```\n\nLastly,\
    \ the output needs to be verified:\n`Server running at http://127.0.0.1:8081/`\n\
    \n## Make a Request to Node.js Server\n\nOpen the browser you use and then open\
    \ this address – [`http://127.0.0.1:8081/index.htm`](http://127.0.0.1:8081/index.htm)\
    \ and you should see something like this:\n\n![First Server Application](Image00017.jpg)\n\
    \nThe output needs to be verified at the server end.\n`Server running at http://127.0.0.1:8081/`\n\
    `Request for /index.htm received.`\n\n## Create a Web Client Using Node\n\nYou\
    \ can also use the `http` module to create a web client. First, create a file\
    \ called `client.js` and copy the following into it:\n\n```javascript\nvar http\
    \ = require('http');\n// Options the request will use\nvar options = {host: 'localhost',port:\
    \ '8081',path: '/index.htm'};\n// We use a callback function to deal with the\
    \ response\nvar callback = function(response) {\n  // The stream is continuously\
    \ updated with data\n  var body = '';\n  response.on('data', function(data) {\n\
    \    body += data;\n  });\n  response.on('end', function() {\n    // Data completely\
    \ received.\n    console.log(body);\n  });\n};\n// Make a request to the server\n\
    var req = http.request(options, callback);\nreq.end();\n```\n\nNow open a different\
    \ command terminal to `server.js` and run `client.js` to see what the result is:\n\
    ```bash\n$ node client.js\n```\n\nDon’t forget to verify the output:\n```html\n\
    <html><head><title>Sample Page</title></head><body>Hello World!</body></html>\n\
    ```\n\nAnd then verify at the server end:\n`Server running at http://127.0.0.1:8081/`\n\
    `Request for /index.htm received.`\n\nAs you can see, the web module is pretty\
    \ easy to use for creating web servers and clients.\n\n## Chapter Thirteen: Node.js\
    \ Express Framework\n\nIn this chapter, we are going to look at Express, a framework\
    \ built as a flexible but minimal web app framework for Node.js. It provides a\
    \ robust feature set that helps us build both single and multiple-page web applications,\
    \ as well as hybrid ones.\n\n### What is Express.js?\n\nIt is a web application\
    \ server framework built on Node.js to help us build different types of web applications.\
    \ Now the standard Node.js server framework is the backend of the MEAN stack.\
    \ This is an open-source, free software stack that helps us in building dynamic\
    \ web applications and websites, and it has these components:\n\n1. **MongoDB**\
    \ – this is the standard NoSQL database\n2. **Express.js** – this is the default\
    \ framework for web applications\n3. **Angular .js** – this is the JavaScript\
    \ MVC framework that we use in web applications\n4. **Node .js** – this is the\
    \ framework for scalable networking and server-side applications\n\nWith the Express\
    \ framework, you can easily develop applications that can handle several request\
    \ types, such as `PUT`, `GET`, `DELETE`, and `POST` requests.\n\n### Installing\
    \ and Using Express\n\nExpress is easy enough to install; it’s done from the Node\
    \ Package Manager by opening the command line and inputting this command:\n\n\
    ```bash\nnpm install express\n```\n\nThis command is asking the Node Package Manager\
    \ to download the Express modules and install them.\n\nLet’s start by creating\
    \ a Hello World application. All it will do is create a server module. This listens\
    \ on port 3000.\n\n```javascript\nvar express=require('express');\nvar app=express();\n\
    app.get('/',function(req,res){\n  res.send('Hello World!');\n});\nvar server=app.listen(3000);\n\
    ```\n\nCode Explanation:\n\n1. In line one, `require` is used to include the `express`\
    \ module.\n2. Before the module can be used, an object must be made from it.\n\
    3. In line three, we create the callback function, which gets called when the\
    \ root is accessed.\n4. The parameter `res` is used for sending the response.\n\
    5. Lastly, `listen` is used to make the application listen on 3000.\n\n![Node.js\
    \ Express FrameWork Tutorial - Learn in 10 Minutes](Image0018.jpg)\n\nFrom this\
    \ output, you can see that if the localhost URL is browsed to on port 3000, the\
    \ string, Hello World, is shown on your page. Provided you browse to the specified\
    \ port that the server listens to, you can see the right output.\n\n### What are\
    \ Routes?\n\nRoutes determine how a client request for a specific endpoint is\
    \ responded to by the application. For example, the client can make `http` requests,\
    \ such as `POST`, `GET`, `DELETE`, or `PUT`, for any URL, such as these:\n- `http://localhost:3000/Books`\n\
    - `http://localhost:3000/Students`\n\nIn this example, when a `GET` request is\
    \ made on the first of the URLs, the output would be a list of books, while if\
    \ it was made on the second one, you would see a list of students. Based on what\
    \ URL you access, certain functionality is invoked on the webserver, and the response\
    \ is sent on to the client – that is how routing works.\n\nEach route can have\
    \ at least one handler function and, when the route is matched, these are executed.\
    \ The typical route syntax is: `app.METHOD(PATH, HANDLER)` In the syntax:\n\n\
    - `app` is an express module instance.\n- `METHOD` is one of the HTTP request\
    \ methods, i.e., `POST`, `GET`, `DELETE`, or `PUT`.\n- `PATH` indicates a server\
    \ path.\n- `HANDLER` is a function that is executed when a route has been matched.\n\
    \nLet’s see how routes can be implemented in Express. We will create three routes:\n\
    \n1. A `/Node` route – this displays the Node Tutorial string when the route is\
    \ accessed.\n2. A `/Angular` route – this displays the Angular Tutorial string\
    \ if the route is accessed.\n"
