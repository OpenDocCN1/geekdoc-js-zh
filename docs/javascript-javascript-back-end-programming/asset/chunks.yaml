    team is working on the same version until package.json gets updated.In cases like
    these, versioning is helpful, and npm will always follow the semver (semantic
    versioning) standard.Running TasksThe format to specify command-line tasks is
    supported by package.json and you can run these tasks with this:npm run <task-name>Here’s
    an example:{"scripts": {"start-dev": "node lib/server-development","start": "node
    lib/server-production"},}It is also common to run Webpack using this feature too:{"scripts":
    {"watch": "webpack --watch --progress --colors --config webpack.conf.js","dev":
    "webpack --progress --colors --config webpack.conf.js","prod": "NODE_ENV=production
    webpack -p --config webpack.conf.js",},}Instead of having to type long commands,
    of having to try remembering them and making sure you don’t mistype them, you
    can do this instead:$ npm run watch$ npm run dev$ npm run prodWhere Does npm Install
    the Packages?When npm is used to install packages, you can use two installation
    types – local or global installation.When you type install commands in npm, like
    this:npm install lodashby default, the package gets installed in the current tree,
    in the subfolder called node_modules. At the same time, the lodash entry is also
    added to the dependencies property in package.json in the current folder.To do
    a global installation, you need to add the -g flag:npm install -g lodashThis time,
    the package uses a global location instead of installing the package in the local
    folder. But where?The root -g command tells you the exact location on your computer.
    On a Linux or Mac system, this might be /usr/local/lib/node_modules, while on
    Windows, it might be in C:\Users\YOU\AppData\Roaming\nom\node_modules.If you manage
    Node.js versions using npm, those locations would be different.Using or Executing
    Packages Installed With npmWhen you use npm to install a package in the folder
    called node_modules, or globally, how is that used in Node.js code. Let’s say
    you install the popular JS utility library, lodash, using this command:npm install
    lodashThe package will be installed in the local node_modules folder. Using it
    in your code requires that you import it to the program using the require command:const
    _ = require(''lodash'')So, what about if you have an executable package?The executable
    file would go to the node_modules/.bin/ folder instead.One of the easiest ways
    to demonstrate this is using the cowsay package, which has a command-line program.
    This program can be executed to make an animal, like a cow, say something.When
    the package is installed like thisnpm install cowsayit installs along with required
    dependencies in the node_modules folder:[![The node_modules folder content](Image00007.jpg)](https://nodejs.dev/static/b245c50f5080dae16a2525fae0ba2c91/d2c2a/node_modules-content.png)A
    hidden bin folder contains the symbolic links pointing to the cowsay binaries:[![The
    binary files](Image00008.jpg)](https://nodejs.dev/static/99830aefa055e247397de544ad7b7744/d2c2a/binary-files.png)So,
    how are these executed?You could run it by typing ./node_modules/.bin/cowsay and
    it will work. However npx, which is in recent npm versions, is better. All you
    do is run:npx cowsayAnd the package location will be automatically found.[![Cow
    says something](Image00009.jpg)](https://nodejs.dev/static/ad4f3d3a7464bb0f8a2845fe8e6588c2/d2c2a/cow-say.png)Chapter
    Four: Node.js Callbacks and PromisesWhen you first start out with Node.js, one
    of the first things you are likely to come across is callbacks. Before we look
    into what callbacks are, we need to know why they exist, and this is down to Node''s
    asynchronous nature. Most people know that asynchronous programming is “better
    but harder.” That might sound somewhat simplistic so let’s look at it by comparing
    synchronous with asynchronous code.The first thing you will see is that the asynchronous
    version of code is nothing short of ugly. It looks like it is overly complicated,
    but we’re not getting that much more out of it than we do from synchronous code.
    However, it’s undeniable that there are gains, so let’s talk about them.Asynchronous
    code is pretty cool in that while your code is hanging about, waiting for something
    like an API call or a database response, it isn’t hanging about not doing anything.
    With synchronous code, when it’s doing something, it blocks up your code, and
    if it takes a long time to do that thing, it brings everything else to a halt.
    With asynchronous code, you can get on with other things at the same time. This
    is one of the primary reasons why Node.js even exists – asynchronous servers can
    get on with processing requests while waiting for I/O or Input/Output.Yes, when
    you do asynchronous programming, which we will be delving deeper into in the next
    chapter, things do feel more complicated, but it isn’t that hard to understand,
    and it offers benefits that are well worth the time it takes to understand it.So,
    now we understand that a little better, let’s get deeper into callbacks. What,
    exactly, are they?Callbacks are nothing more than functions passed to other functions
    as arguments, which the receiving function will then use, or call it back.Have
    a look at this simple example of a callback function in action:fs.readFile(funFileName,
