  trans: "\n\n- 如果使用了 `setImmediate()` 来调度脚本，事件循环将结束轮询阶段（poll phase）。随后，循环将进入检查阶段（check\
    \ phase）并执行所有调度的脚本。\n- 如果没有使用 `setImmediate()` 来调度脚本，事件循环将等待直到回调函数被添加到队列中，此时它们将立即被执行。\n\
    \n当轮询队列中没有任何内容时，事件循环会寻找已达到时间阈值的定时器。如果至少有一个定时器就绪，事件循环将返回定时器阶段（timers phase）并执行回调函数。\n\
    \n### 检查阶段 (Check Phase)\n检查阶段允许在轮询阶段完成后立即执行回调。如果该阶段处于空闲状态且 `setImmediate()` 队列了一些脚本，循环将继续检查该阶段，而不是等待。\n\
    \n`setImmediate()` 是一个定时器，一个运行在不同事件循环阶段的特殊定时器。`libuv` API 用于在轮询阶段完成后调度回调的执行。通常，当代码在执行时，事件循环必须在某个时刻进入轮询阶段。它在何处等待传入的请求、连接等，但如果使用了\
    \ `setImmediate` 来调度回调且轮询阶段处于空闲状态，循环将不会等待轮询事件，而是结束并进入检查阶段。\n\n### 关闭回调 (Close\
    \ Callbacks)\n如果句柄（handle）或套接字意外关闭（例如通过 `socket.destroy()`），则在关闭回调阶段会发出“close”（close）事件。否则，将使用\
    \ `process.nextTick()` 来发出它。\n\n### setImmediate() vs setTimeout()\n这两者非常相似，但在调用它们时，其行为方式可能不同。\n\
    \n- `setImmediate()` 在当前轮询阶段完成后执行脚本\n- `setTimeout()` 调度一个脚本，在经过最小 `ms` 阈值后运行\n\
    \n执行顺序是因情况而异的，并取决于调用上下文。如果它们都从主模块中调用，进程性能将绑定它们的计时时机，但其他机器应用程序可能会影响性能。\n\n例如，假设运行了以下脚本。它不在主模块中，属于\
    \ I/O 周期，因此由于性能进程的绑定，执行顺序是非确定的：\n\n```javascript\n// timeout_vs_immediate.js\n\
    setTimeout(() => {console.log('timeout');}, 0);\nsetImmediate(() => {console.log('immediate');});\n\
    ```\n`$ node timeout_vs_immediate.js`\n`timeoutimmediate`\n`$ node timeout_vs_immediate.js`\n\
    `immediatetimeout`\n\n相反，如果两个调用被放置在 I/O 周期内，则立即执行将第一个执行：\n\n```javascript\n//\
    \ timeout_vs_immediate.js\nconst fs = require('fs');\nfs.readFile(__filename,\
    \ () => {\n  setTimeout(() => {console.log('timeout');}, 0);\n  setImmediate(()\
    \ => {console.log('immediate');});\n});\n```\n`$ node timeout_vs_immediate.js`\n\
    `immediatetimeout`\n`$ node timeout_vs_immediate.js`\n`immediateatout`\n\n使用 `setImmediate()`\
    \ 相比 `setTimeout()` 有一个主要优势：如果它在 I/O 周期中被调度，它将最先执行，无论有多少个定时器，它都会在定时器之前执行。\n\n\
    ### process.nextTick()\n你可能已经注意到 `process.nextTick()` 不在上面的图中，尽管它是异步 API 的一部分。从技术上讲，它并不是事件循环的一部分。一旦当前操作完成，无论事件循环当前处于哪个阶段，都会首先处理\
    \ `nextTickQueue`。\n\n回到那张图，每当在某个阶段调用 `process.nextTick()` 时，传递给它的所有回调在事件循环继续之前解析。然而，这可能导致糟糕情况的发生——因为发生了递归的\
    \ `process.nextTick()` 调用，它会让你的 I/O 出现饥饿。这会阻止事件循环到达轮询阶段。\n\n那么，为什么 Node.js 允许这种事情发生呢？这是设计哲学的一部分，允许\
    \ API 始终保持异步状态，无论是否需要。看看这个示例：\n\n```javascript\nfunction apiCall(arg, callback)\
    \ {\n  if (typeof arg !== 'string')\n    return process.nextTick(callback, new\
    \ TypeError('argument should be a string'));\n}\n```\n代码检查参数，如果不对，则将错误传递给回调。最近更新的\
    \ API 允许将参数传递给 `process.nextTick()`，这意味着它可以接收在回调之后传递的参数。这些参数随后作为回调参数传播，消除了嵌套函数的需要。\n\
    \n我们所做的是将错误传递给用户，但这只在用户其余代码执行后才会发生。`process.nextTick` 提供了一种保证，允许 `apiCall()` 回调仅在剩余用户代码执行后且事件循环继续之前运行。这种实现是通过允许\
    \ JS 栈展开完成的。然后指定的回调被立即执行，允许对 `process.nextTick()` 进行递归调用，而不会产生 v8 的 `RangeError:\
    \ Maximum call stack size exceeded` 错误。\n\n然而，这可能会导致一些问题。看这段代码：\n\n```javascript\n\
    let bar;\n// 签名是异步的但同步调用了回调\nfunction someAsyncApiCall(callback) {\n  callback();\n\
    }\n// 回调在 someAsyncApiCall 完成之前被调用。\nsomeAsyncApiCall(() => {\n  // 因为 someAsyncApiCall\
    \ 尚未完成，bar 没有被赋值\n  console.log('bar', bar); // undefined\n});\nbar = 1;\n```\n\
    这里的 `someAsyncApiCall()` 尽管是异步签名，但它是同步调用回调的。当 `someAsyncApiCall()` 被调用时，它在事件循环阶段之前执行，由于引用\
    \ `bar` 是因为 `someAsyncApiCall()` 尚未完成。\n\n当你将回调放在 `nextTick()` 中，脚本仍然可以完成，在回调被调用之前允许所有函数、变量等的初始化。这阻止了事件循环的继续。它对于在事件循环继续之前向用户报告错误可能是用的。这里是之前的\
    \ `nextTick()` 示例：\n\n```javascript\nlet bar;\nfunction someAsyncApiCall(callback)\
    \ {\n  process.nextTick(callback);\n}\nsomeAsyncApiCall(() => {\n  console.log('bar',\
    \ bar); // 1\n});\nbar = 1;\n```\n另一个真实世界的示例：\n\n```javascript\nconst server =\
    \ net.createServer(() => {}).listen(8080);\nserver.on('listening', () => {});\n\
    ```\n当仅传递端口时，端口立即绑定。这意味着监听回调可能是立即，但有一个问题——`on('listening')` 回调尚未设置。解决这个问题需要监听事件进入\
    \ `nextTick()` 队列以完成脚本。\n\n### process.nextTick() vs setImmediate()\n这些调用非常相似，但命名混淆：\n\
    \n- `process.nextTick()` 会在同一阶段立即触发\n- `setImmediate()` 将等待下次事件循环迭代或 tick 之前触发。\n\
    \n实际上，考虑到 `process.nextTick()` 触发比 `setImmediate()` 更快，这两个名字应该对调。然而，这是源自早期的遗留，不太可能改变。一个简单的原因是这会破坏大量的\
    \ npm 包。每天都有新模块被添加，这导致了更多潜在的破坏，所以尽管命名很混淆，但名称不会改变的。我们建议你始终使用 `setImmediate()`。\n\
    \n### 为什么使用 process.nextTick()？\n你使用 `process.nextTick()` 有几个充分的理由：\n\n- 用户可以在循环继续之前更好地处理错误、清理掉不需要的资源或重新提交请求。\n\
    - 有时，回调需要在调用栈展开和事件循环继续之间运行。\n\n"
- fmt: "\nOne of the best examples is matching user expectations and a simple example\
    \ of that is:\n\n```javascript\nconst server = net.createServer();\nserver.on('connection',\
    \ (conn) => { });\nserver.listen(8080);\nserver.on('listening', () => { });\n\
    ```\n\nLet’s assume that we have `listen()` running at the start of the event\
    \ loop, but the callback is in `setImmediate()`. If a hostname is not passed,\
    \ port binding happens straight away. The event loop needs to get to the `poll`\
    \ phase before it can proceed, and that means a non-zero chance of a connection\
    \ being received so the `connection` event could be fired before the `listening`\
    \ event.\n\nAnother example would be to run a function constructor that inherits\
    \ from `EventEmitter` and wants an event called in the constructor:\n\n```javascript\n\
    const EventEmitter = require('events');\nconst util = require('util');\nfunction\
    \ MyEmitter() {\n  EventEmitter.call(this);\n  this.emit('event');\n}\nutil.inherits(MyEmitter,\
    \ EventEmitter);\nconst myEmitter = new MyEmitter();\nmyEmitter.on('event', ()\
    \ => {\n  console.log('an event occurred!');\n});\n```\n\nAn event cannot be emitted\
    \ immediately from a constructor because the script hasn’t processed far enough\
    \ for the user to assign the event a callback. In the constructor, `process.nextTick()`\
    \ can be used to set a callback. The event is emitted by the callback once the\
    \ constructor is done, and this gives the results the user expects:\n\n```javascript\n\
    const EventEmitter = require('events');\nconst util = require('util');\nfunction\
    \ MyEmitter() {\n  EventEmitter.call(this);\n  // use nextTick to emit the event\
    \ when a handler is assigned\n  process.nextTick(() => {\n    this.emit('event');\n\
    \  });\n}\nutil.inherits(MyEmitter, EventEmitter);\nconst myEmitter = new MyEmitter();\n\
    myEmitter.on('event', () => {\n  console.log('an event occurred!');\n});\n```\n\
    \n# Chapter Seven: Node.js Buffers\n\nWhile pure JavaScript is good for using\
    \ with Unicode-encoded strings, it isn’t very good where straight binary data\
    \ is concerned. On a browser, most data is in string format, so this is fine but,\
    \ things are different for the Node.js servers. These also have TCP streams to\
    \ deal with, and they need to read the filesystem and write to it. Both of these\
    \ mean that we also need to deal with binary data streams.\n\nOne way of handling\
    \ this is to use strings, which is what Node.js used to do. However, this is a\
    \ troublesome approach – not only is it slow, but it also means you are working\
    \ with APIs for strings and not with binary data. And they also seem to break\
    \ quite easily in very strange ways.\n\nSo, what do you use instead of a binary\
    \ string? A buffer.\n\n## What Are Buffers?\n\nIn Node.js, the `Buffer` class\
    \ is meant for handling raw binary data. Every buffer corresponds to raw memory\
    \ that has been allocated externally to V8. Buffers are quite similar in the way\
    \ they act to integer arrays, but they cannot be resized, and they include tons\
    \ of methods designed specifically for handling binary data. In a buffer, the\
    \ integers represent bytes, one byte for each buffer, and that means they are\
    \ limited in values to between 0 and 255 inclusively. When you print the `Buffer`\
    \ instance using `console.log()`, the result is a chain full of hexadecimal values.\n\
    \nTypically, the context buffers are seen in is binary data coming out of streams,\
    \ like `fs.createReadStream`.\n\n## Creating Buffers\n\nThere are several ways\
    \ a buffer can be created:\n\n```javascript\nvar buffer = Buffer.alloc(8);\n//\
    \ This prints 8 bytes of zero\n// <Buffer 00 00 00 00 00 00 00 00>\n```\n\nThis\
    \ way, the buffer has been initialized and has eight zero bytes.\n\n```javascript\n\
    var buffer = Buffer.from([ 8, 6, 7, 5, 3, 0, 9]);\n// This prints 8 bytes of certain\
    \ values\n// <Buffer 08 06 07 05 03 00 09>\n```\n\nThis way, the buffer is initialized\
    \ to the array contents. Bear in mind that the array contents are integers that\
    \ represent bytes.\n\n```javascript\nvar buffer = Buffer.from(\"I'm a string!\"\
    , \"utf-8\");\n// This prints a chain of values in utf-8\n// <Buffer 49 27 6d\
    \ 20 61 20 73 74 72 69 6e 67 21>\n```\n\nIn this third way, the buffer is initialized\
    \ to a binary encoding. This is the first string that the second argument specifies\
    \ – `utf-8`. This is one of the most common methods of encoding with Node.js.\n\
    \n## Writing to Buffers\n\nGiven that we already created a buffer:\n\n```javascript\n\
    var buffer = Buffer.alloc(16)\n```\n\nStrings can be written to it:\n\n```javascript\n\
    buffer.write(\"Hello\", \"utf-8\")\n```\n\n`Buffer.write()`’s first argument is\
    \ the string that needs to be written to the buffers, while the second one is\
    \ the string encoding. Because it defaults to `utf-8`, the argument is irrelevant.\n\
    \nWe got a result of `5` from `buffer.write()`, which means the first five bytes\
    \ were written to the buffer. It is pure coincidence that the string “Hello,”\
    \ also happens to be five characters long because each character is coincidentally\
    \ 8 bits. That is useful information for when you want the message completed:\n\
    \n```javascript\nbuffer.write(\" world!\", 5, \"utf-8\")\n```\n\nWhen there are\
    \ three arguments to `buffer.write()`, the second one is indicative of an offset,\
    \ which is the buffer index to begin writing at.\n\n## Reading from Buffers: toString:\n\
    \nThe commonest way of reading buffers is with the `toString()` method because\
    \ the vast majority of buffers have text in them:\n\n```javascript\nbuffer.toString('utf-8')\n\
    'Hello world!\\u0000k\\t'\n```\n\nOnce again, the initial argument is the encoding\
    \ and, here, we can see that not all the buffer was used. However, because we\
    \ happen to know the number of.\n"
