  trans: '


    如果你真的想掌握 JavaScript 后端编程，你需要从 Node.js 开始。所以，请坐好，让我们开始深入吧。


    # 第一章：搭建你的 Node.js 环境


    在第一章中，从搭建你的 Node.js 环境开始是合理的。在这里，我将向你展示你所需的工具以及如何进行操作。你可以在 Linux、Mac、Windows 和
    Solaris 上搭建 Node.js 开发环境，并且无论在什么种平台上，你都需要以下内容：


    * `Node.js`

    * `NPM` – Node 包管理器

    * `IDE` – 集成开发环境，或者你也可以使用任何兼容的文本编辑器。


    '
- fmt: "\nSince version 0.6.0, the Node.js download has included the package manager,\
    \ so you won't need to do a separate install for it.\n\n## Windows\nTo install\
    \ Node.js on Windows, go to [https://nodejs.org](https://nodejs.org). Your operating\
    \ system will automatically be detected, and the correct download link will be\
    \ displayed. Click on the `LTS` or `Current` button to download the Node MSI –\
    \ the `Current` button is best as it gives you the latest version.\n\nOnce the\
    \ MSI is downloaded, double-click on it, and you will see an installation screen\
    \ like this:\n![![](Image00002.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/nodejs-installation.png)\n\
    \nClick on the `Next` button, and the License Agreement will appear; read it and\
    \ accept it and then click on `Install`. Node.js will be quickly installed on\
    \ your computer; click the `Finish` button to complete it.\n\n### Verify the Installation\n\
    Now that Node.js is installed, you can verify the installation by launching the\
    \ command prompt. Click on your Start bar, type in `Command Prompt`, and click\
    \ the result. Now type the following command:\n\n```\nnode -v\n```\n\nIf the installation\
    \ were successful, you would see a screen showing your Node version; if you don't\
    \ see that, you need to try installing it again.\n\n## Mac and Linux\nFirst, go\
    \ to the official Node.js website – [https://nodejs.org/en/download](https://nodejs.org/en/download).\
    \ Click the right installer for your system, as seen in the screenshot below:\n\
    ![![](Image00003.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/download-nodejs-mac.png)\n\
    \nWhen the right package has downloaded, click on the installer, and the Node.js\
    \ Installation Wizard will load. Click the `Continue` button and follow the on-screen\
    \ steps. Once successful, you will see an installation summary telling you where\
    \ `NPM` and `Node.js` have been installed.\n![![](Image00004.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/nodejs-installation-mac2.png)\n\
    \n### Verify the Download\nOpen your terminal window and verify the installation\
    \ by typing the following command (note, the `$` sign is the command prompt):\n\
    \n```\nnode -v\n```\n\nYou should see the version number shown on your screen.\n\
    \nMac or Linux users also have an alternative method of installing Node.js. It\
    \ involves using the Homebrew (Mac) or Linuxbrew (Linux) package manager and installing\
    \ Node.js directly from the command line. If you use Linux, you will need to install\
    \ extra dependencies, such as `Ruby v 1.8.6` or above and `GCC v4.2` or above,\
    \ before you can install Node.js.\n\nWhen you are ready to install it, type the\
    \ following command at the prompt:\n\n```bash\n$ brew install node\n```\n\n##\
    \ IDE Installation\nNode.js makes use of JavaScript when it develops applications,\
    \ so any text editor tool or IDE can be used so long as it supports JavaScript.\
    \ That said, I would recommend you use an IDE that has support for auto-complete\
    \ features for the Node.js API, for example, Sublime Text, Aptana, Eclipse, Visual\
    \ Studio, etc.\n\n### IDE – Visual Studio Code\nNode.js application uses JavaScript\
    \ to develop an application. So, you can use any IDE or text editor tool that\
    \ supports JavaScript syntax. However, an IDE that supports auto-complete features\
    \ for Node.js API is recommended, e.g., Visual Studio, Sublime Text, Eclipse,\
    \ Aptana, etc.\n\nVisual Studio Code supports both TypeScript and JavaScript languages\
    \ right from the word go, and it also supports debugging. You will need the Node.js\
    \ runtime on your machine to run Node.js applications, though.\n\nOnce Node.js\
    \ is installed on your system, including the Node Package Manager, we can install\
    \ VSC:\n\n#### Windows\nOpen [https://code.visualstudio.com/download](https://code.visualstudio.com/download)\
    \ and download VSC for your system. When it's done, open the folder and run the\
    \ installer – it will be called `VSCodeUserSetup (version).exe`. When the License\
    \ agreement age loads, accept it and click on `Next`. On the next page, click\
    \ on the option to Create a Desktop Icon – this allows easy access from your desktop.\
    \ Click on `Next`!\n![next screen](Image00005.jpg)\n\nLastly, click the `Install`\
    \ button. When the installation is done, click on `Finish`, and Visual Studio\
    \ Code will open.\n\n#### Mac\nFirst, go to [https://code.visualstudio.com/download](https://code.visualstudio.com/download)\
    \ and download the Mac version of Visual Studio Code. The file downloads in `.zip`\
    \ format; find it and double-click to see the file contents. Find the file called\
    \ `Visual Studio Code.app` and drag it to your Applications folder. Double click\
    \ the file to open it\n\n## Hello World\nLet's begin with VSC by creating the\
    \ Hello World application. Create a folder, call it `hello`, and then open your\
    \ command prompt. Go to the folder and go into VS Code. Here are the commands\
    \ you need:\n\n```bash\nmkdir hello\ncd hello\ncode\n```\n\nNow go to the File\
    \ Explorer toolbar and press the button that says New File; call it `app.js`.\
    \ When you use the file extension of `.js`, VSC can interpret it as a JavaScript\
    \ file and use the JS language service to evaluate the file contents.\n\nIn the\
    \ `app.js` file, create a string variable and send its contents to the console,\
    \ like this:\n\n```javascript\nvar msg = 'Hello World';\nconsole.log(msg);\n```\n\
    \nYou may have noticed that when you typed in `console.` you were automatically\
    \ presented with IntelliSense on the `console` object. VS Code also knows that\
    \ `msg` is a string and that it is based on the Hello World initialization. As\
    \ such, when `msg` is typed, IntelliSense will show you all the `msg` string functions.\n\
    \nSave your file using `CTRL+S`, and now we can run the app. On your terminal,\
    \ type in:\n\n```bash\nnode app.js\n```\n\nThe output should be the words \"Hello\
    \ World\".\n\n### The Integrated Terminal\nVS Code also has an integrated terminal\
    \ where you can run your shell commands, but also also allows to directly run\
    \ Node.js without needing to come out of VS Code when you run command-line tools.\
    \ To open the integrated terminal, go to `View>Terminal`, and when the terminal\
    \ opens, you can run Node.js from there.\n\n### Debugging Hello World\nVS Code\
    \ also has a built-in debugger, which helps debug Node.js apps, so let's try it\
    \ with the Hello World application. First, we need a breakpoint in `app.js`, so\
    \ place your editor on line 1 and press `F9`. Alternatively, click in the left\
    \ gutter beside the line – you will see a red circle.\n\nTo begin debugging your\
    \ code, go to the Activity bar and click on `Run`. Then click on the green arrow\
    \ on Debug toolbar or press `F5`. Your app will now be debugged and, when it gets\
    \ to the breakpoint, you can step through the application. VS Code shows the debug\
    \ mode as a different-colored status bar, and you will see the console on the\
    \ screen.\n![hello world debugging](Image0006.jpg)\n\nThat was a simple example\
    \ with code to show you how VS Code works. Let's take one step further and use\
    \ it with a full-stack web app built in Node.js. First, come out of the Hello\
    \ World folder as you won't need it anymore. If you want, you can delete it.\n\
    \n## Express Application\nExpress is one of the most popular frameworks for building\
    \ Node.js applications and running them – we will be going over it in far detail;\
    \ for now this is just a quick example. Express offers several tools, one of which\
    \ is the Express Generator that helps you create or scaffold a new application.\
    \ Express Generator is an `npm` module, and you install it using the `npm` command-line.\n\
    \nFirst, open your terminal and type `npm --help` to check that you installed\
    \ it properly – you should see documentation about its use on the screen. Now\
    \ install Express Generator using the following command:\n\n```bash\nnpm install\
    \ -g express-generator\n```\n\nNote the inclusion of `-g`; this globally installs\
    \ Express Generator on your computer, allowing you to run it wherever you want.\n\
    \nNext, use the command below to create a new application named `myApp`:\n\n```bash\n\
    express myApp --view pug\n```\n\nA new folder will be created called `myApp`,\
    \ and it will contain your application contents. The parameters at the end of\
    \ the command, `--view pug`, inform the generator it should use the pug template\
    \ engine. You will also need to install application dependencies, all of which\
    \ are `npm` modules; navigate to the folder, and execute the:\n\n```bash\ncd myApp\n\
    npm install\n```\n\nNow we need to make sure the application will run. In the\
    \ generated Express application is a file called `package.json` and, in that,\
    \ is a start script that runs `node./bin/www` – this will get the Node.js application\
    \ running. Type the following in a terminal within the `myApp` folder:\n\n```bash\n\
    npm start\n```\n\nThe Node.js web server starts up; navigate to `http://localhost:3000`,\
    \ and you can see the application running. Close the browser and open a terminal\
    \ in the `myApp` folder; press `CTRL+C` to stop the server. Now open VS Code:\n\
    \n```bash\ncode .\n```\n\nIf you used the integrated terminal to install the generator\
    \ and create your app, all you need to do is use `File>Folder` to open the app\
    \ from the VS Code instance.\n\n### Great Code Editing\nOpen the `app.js` file\
    \ and find the Node.js global object called `__dirname`. Hover the cursor over\
    \ it, and you will see that VS Code sees `__dirname` as a string. And you can\
    \ get IntelliSense against the framework. For example, you can get IntelliSense\
    \ against something you require in the code, such as `HTTP`, while typing it in\
    \ the VS Code.\n\nVS Code uses declaration files of `TypeScript` type to provide\
    \ VS Code with metadata about the JS frameworks your application consumes. Type\
    \ declarations use TypeScript to enable Express to know the function and parameter\
    \ data types. This lets VS Code provide the best IntelliSense experience, and\
    \ there is no need for you to worry about downloading these files – thanks to\
    \ the Automatic Type Acquisition features, VS Code automatically installs them.\n\
    \nYou can also reference other modules in different files in your code. For example,\
    \ we needed the `./routes/index` module in `app.js`, and that exports an `Express.Router`\
    \ class.\n\n### Debugging the Express App\nFirst, your Express application needs\
    \ a debugger configuration file created called `launch.json`. Go to the Activity\
    \ bar and click on the Run icon. Then click the Configure icon (it looks like\
    \ a gear) in the Run view to create the default `launch.json` file. In Configurations,\
    \ make sure the `type` property is set to `node` – this will ensure the Node.js\
    \ environment is selected. When the file has been created, VS Code looks for the\
    \ start script in `package.json` and uses the value as the `program` for the Launch\
    \ Program configuration – in our case, it is `${workspaceFolder}\\bin\\www`.\n\
    \n```json\n{\n  \"version\": \"0.2.0\",\n  \"configurations\": [\n    {\n    \
    \  \"type\": \"node\",\n      \"request\": \"launch\",\n      \"name\": \"Launch\
    \ Program\",\n      \"program\": \"${workspaceFolder}\\\\bin\\\\www\"\n    }\n\
    \  ]\n}\n```\n\nSave the file and go to the Run View. Click the Configuration\
    \ option and ensure Launch Program is selected. Open `app.js` and set your breakpoint\
    \ where the Express app object is, near the beginning of the file, by clicking\
    \ the left gutter. Start the debug by pressing `F5`, and the server is started\
    \ in a new terminal. From the breakpoint, you can step through the code, create\
    \ watches and inspect the variables.\n\nThat ends this first chapter. Your Node.js\
    \ environment has been set up, so now we can look at the REPL terminal.\n\n##\
    \ Chapter Two: Node.js - REPL Terminal\nREPL or Read-Eval-Print-Loop is an interactive\
    \ shell where Node.js expressions are evaluated. REPL reads user-entered code,\
    \ evaluates the result of the interpretation, prints it so the user can see it,\
    \ and loops until given the signal to quit. It comes built-in as a part of Node.js\
    \ and gives users a quick and easy way to explore and test JS code in the Node\
    \ environment without needing to save and store it in files first.\n\n### Prerequisites\n\
    To follow along with this chapter, you will need two things:\n"
