  trans: "\n\n### 3. 默认路由 / - 这将显示“Welcome to My Tutorials”字符串\n\n基础代码与我们之前看到的相同，下面的代码是一个展示如何实现路由的扩展部分：\n\
    \n```javascript\nvar express = require('express');\nvar app = express();\napp.route('/Node').get(function(req,res){res.send(\"\
    Node Tutorial\");});\napp.route('/Angular').get(function(req,res){res.send(\"\
    Angular Tutorial\");});\napp.get('/',function(req,res){res.send('Welcome to My\
    \ Tutorials');}));\n```\n\n#### 代码解释：\n\n1. 如果在浏览器中访问 [`localhost:3000/Node`](http://localhost:3000/Node)\
    \ URL，则定义该路由。路由上绑定了一个回调函数，当浏览到该 Node URL 时，就会调用该函数。\n\n回调函数有两个参数：\n   - `res`\
    \ 是用于向客户端发送信息的主要参数\n   - `req` 是次要参数，包含了与请求相关的信息。有时，请求会随请求发送其他参数，`req` 参数有助于找到这些参数。\n\
    \n2. 如果选择了 Node 路由，则使用 `send` 函数向客户端发送 Node Tutorial 字符串。\n\n3. 如果在浏览器中访问 [`localhost:3000/Angular`](http://localhost:3000/Angular)\
    \ URL，则定义该路由。路由上绑定了一个回调函数，当浏览到 Angular URL 时就会调用该函数。\n\n4. 如果选择了 Angular 路由，则使用\
    \ `send` 函数向客户端发送 Angular Tutorial 字符串。\n\n5. 如果在浏览器中访问 [`localhost:3000/Angular`](http://localhost:3000/Angular)\
    \ URL，则选择默认路由——这是应用程序根目录。选中时，会将 Welcome to My Tutorials 发送给客户端。\n\n只要命令执行成功，你应该会在浏览器中看到\
    \ Welcome to My Tutorials 界面。输出将显示，通过浏览端口为 3000 的 localhost URL，屏幕上显示了 Welcome\
    \ to My Tutorials 消息——这就是我们在代码中指定的默认消息。\n\n### 使用 Express.js 构建 Web 服务器\n\n在上面的示例中，我们看到了如何根据路由来决定输出内容。这是现代\
    \ Web 应用程序中使用的技术，而 Web 服务器的其他部分都是关于使用 Node.js 模板的。当你快速创建 Node 应用程序时，最简单的方法之一就是使用\
    \ Node.js 模板。市场上有很多框架，我们将使用 jade 框架。\n\nNode 包管理器（Node Package Manager）用于在命令行中输入以下内容来安装\
    \ jade：\n```bash\nnpm install jade\n```\n此命令要求 `NPM` 下载我们需要的模块并安装它们。\n\n让我们创建一个\
    \ jade 模板。创建一个新文件并命名为 `index.jade`，将以下代码放入其中，确保该文件创建在名为 `views` 的文件夹中![![Node.js\
    \ Express 框架教程 - 10 分钟快速入门](img/Image00019.jpg)](https://www.guru99.com/images/NodeJS/010716_0613_NodejsExpre7.png)\n\
    \n页面标题将更改为调用模板时传递的值。我们还指示 header 标签文本将被模板中传递的内容所替换。\n\n```javascript\nvar express=require('express');\n\
    var app=express();\napp.set('view engine','jade');\napp.get('/',function(req,res){res.render('index',{title:'My\
    \ Tutorials',message:'Welcome'})});\nvar server=app.listen(3000,function() {});\n\
    ```\n\n#### 代码解释：\n\n1. 首先，在应用程序中指定了“view engine”（视图引擎）——这用于渲染模板，因为使用了 jade，所以我们指定了它。\n\
    \n2. 我们使用 `render` 函数来渲染网页。在这里，我们渲染了之前创建的 `index.jade` 模板。\n\n3. 我们向 `title` 和\
    \ `message` 参数传递了两个值——分别是“My Tutorials”和“Welcome”。这些值会被模板中指定的 `title` 和 `message`\
    \ 参数所替换。\n\n如果你成功执行了该命令，你将在浏览器中看到 Welcome 界面。从输出中，你可以看到页面标题设置为 My Tutorials，页面页头被设置为\
    \ Welcome。这是因为我们在应用程序中调用了 Jade 模板。\n\n### 快速总结\n\nExpress 框架通常用于 Node.js 应用程序开发，它构建在\
    \ Node 框架之上。它用于帮助我们快速构建基于服务器的应用程序。我们使用路由根据用户的请求将他们引导到应用程序的不同区域——路由响应可能会根据用户需要的内容而异。最后，模板用于高效地注入正确的内容，Node\
    \ 应用程序流行的模板引擎之一是 Jade。\n\n### 第十四章章：Node.js RESTful API\n\n让我们从名称开始——REST 源于 Representational\
    \ State Transfer（表述状态转移）。REST 由 Roy Fielding 在 2000 年首次引入，它是一种基于 Web 标准并使用 `HTTP`\
    \ 协议的架构。REST 围绕资源展开——所有组件都是资源，通过通用接口使用标准的 `HTTP` 方法访问这些资源。REST 服务器基本上为资源提供访问点，而\
    \ REST 客户端使用 `HTTP` 协议来访问并修改资源。`URIs` 和全局标识符用于标识每个资源，REST 以不同的方式表示资源，如 `XML` 和文本，但最常见的表示是\
    \ `JSON`。\n\n#### HTTP 方法\n\n这些是 REST 架构中常用的四种 `HTTP` 方法：\n- `GET` —— 用于只读访问资源。\n\
    - `PUT` —— 用于创建新资源。\n- `DELETE` —— 用于删除资源。\n- `POST` —— 用于更新资源或创建新的。\n\n#### RESTful\
    \ 服务\n\nWeb 服务是包含标准和开放协议的集合，用于系统和应用程序之间的数据交换。应用程序通过计算机网络交换数据——这些应用程序使用各种编程语言编写并运行在所有平台上。互操作性（例如\
    \ Python 和 Java 的通信，或 Linux 应用程序与 Windows 应用程序的通信）取决于开放标准。当 Web 服务基于 REST 架构时，它被称为\
    \ RESTful 服务。这些通过使用 `HTTP` 方法实现 REST 概念。\n\n#### 为库创建 RESTful\n\n假设我们有一个基于 JSON\
    \ 的数据库，其中在一个名为 `users.json` 的文件中包含用户列表：\n```json\n{\"user1\" : {\"name\" : \"\
    michael\",\"password\" : \"password1\",\"profession\" : \"teacher\",\"id\": 1}\n\
    \"user2\" : {\"name\" : \"sara\",\"password\" : \"password2\",\"profession\" :\
    \ \"scientist\",\"id\": 2}\n\"user3\" : {\"name\" : \"ronnie\",\"password\" :\
    \ \"password3\",\"profession\" : \"clerk\",\"id\": 3}}\n```\n利用这些信息我们可以提供所有的 RESTful\
    \ API：\n\n| | URI | HTTP 方法 | POST 体 | 结果 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 1 | `listUsers` | `GET` | 空 | 显示所有用户列表 |\n| 2 | `addUser` | `POST` | JSON\
    \ 字符串 | 添加新用户详情 |\n| 3 | `deleteUser` | `DELETE` | JSON 字符串 | 删除用户 |\n| 4 | `:id`\
    \ | `GET` | 空 | 显示用户详情 |\n\n"
- fmt: "\nI am assuming that, by now, you already know how to pass values, using form\
    \ data or AJAX, from the front end and how to use the Express `Request` object\
    \ to process them.\n\n## List Users\nThe first RESTful API we will implement is\
    \ `listUsers`. Create a file called `server.js` and add the following code:\n\n\
    ```javascript\nvar express = require('express');\nvar app = express();\nvar fs\
    \ = require(\"fs\");\napp.get('/listUsers', function (req, res) {\n  fs.readFile(\
    \ __dirname + \"/\" + \"users.json\", 'utf8', function (err, data) {\n    console.log(\
    \ data );\n    res.end( data );\n  });\n})\nvar server = app.listen(8081, function\
    \ () {\n  var host = server.address().address;\n  var port = server.address().port;\n\
    \  console.log(\"Example app listening at http://%s:%s\", host, port)\n})\n```\n\
    \nNow use [http://127.0.0.1:8001/listUsers](http://127.0.0.1:8001/listUsers) together\
    \ with HTTP Method: `GET` on a local machine. Make sure you use a REST client\
    \ so you can access the API and you should see the result below – given IP addresses\
    \ can be changed when you use this code in a production environment:\n\n`{\"user1\"\
    \ : {\"name\" : \"michael\",\"password\" : \"password1\",\"profession\" : \"teacher\"\
    ,\"id\": 1},\"user2\" : {\"name\" : \"sara\",\"password\" : \"password2\",\"profession\"\
    \ : \"scientist\",\"id\": 2},\"user3\" : {\"name\" : \"ronnie\",\"password\" :\
    \ \"password3\",\"profession\" : \"clerk\",\"id\": 3}}`\n\n## Add User\nThe next\
    \ RESTful API we will implement is `newUser`, using these details:\n`user = {\"\
    user4\" : {\"name\" : \"monica\",\"password\" : \"password4\",\"profession\" :\
    \ \"teacher\",\"id\": 4}}`\n\nThe same input can be accepted in the JSON form\
    \ using an AJAX call but, for the purposes of this chapter, we are hard-coding\
    \ everything. Clear your `server.js` file and add the following:\n\n```javascript\n\
    server.js\nvar express = require('express');\nvar app = express();\nvar fs = require(\"\
    fs\");\nvar user = {\"user4\" : {\"name\" : \"monica\",\"password\" : \"password4\"\
    ,\"profession\" : \"teacher\",\"id\": 4}}\napp.post('/addUser', function (req,\
    \ res) {\n  // First read existing users.\n  fs.readFile( __dirname + \"/\" +\
    \ \"users.json\", 'utf8', function (err, data) {\n    data = JSON.parse( data\
    \ );\n    data[\"user4\"] = user[\"user4\"];\n    console.log( data );\n    res.end(\
    \ JSON.stringify(data));\n  });\n})\nvar server = app.listen(8081, function ()\
    \ {\n  var host = server.address().address;\n  var port = server.address().port;\n\
    \  console.log(\"Example app listening at http://%s:%s\", host, port)\n})\n```\n\
    \nNow attempt to access it via URL: `http://127.0.0.1:8081/addUser` and HTTP Method\
    \ : `POST`. Use a local machine and a REST client and you should see the following:\n\
    \n`{\"user1\":{\"name\":\"michael\",\"password\":\"password1\",\"profession\"\
    :\"teacher\",\"id\":1},\"user2\":{\"name\":\"sara\",\"password\":\"password2\"\
    ,\"profession\":\"scientist\",\"id\":2},\"user3\":{\"name\":\"ronnie\",\"password\"\
    :\"password3\",\"profession\":\"clerk\",\"id\":3},\"user4\":{\"name\":\"monica\"\
    ,\"password\":\"password4\",\"profession\":\"teacher\",\"id\":4}}`\n\n## Show\
    \ Detail\nNow we want to implement a RESTful API that is called with the user\
    \ ID and displays the corresponding user’s details. Again, clear the `server.js`\
    \ file and add this code:\n\n```javascript\nserver.js\nvar express = require('express');\n\
    var app = express();\nvar fs = require(\"fs\");\napp.get('/:id', function (req,\
    \ res) {\n  // First read existing users.\n  fs.readFile( __dirname + \"/\" +\
    \ \"users.json\", 'utf8', function (err, data) {\n    var users = JSON.parse(\
    \ data );\n    var user = users[\"user\" + req.params.id]\n    console.log( user\
    \ );\n    res.end( JSON.stringify(user));\n  });\n})\nvar server = app.listen(8081,\
    \ function () {\n  var host = server.address().address;\n  var port = server.address().port;\n\
    \  console.log(\"Example app listening at http://%s:%s\", host, port)\n})\n```\n\
    \nThe same as before, use a local machine and a REST client to try accessing it\
    \ using [http://127.0.0.1:8081/2](http://127.0.0.1:8081/2) and HTTP Method : `GET`\
    \ and you should see this:\n\n`{\"name\":\"sara\",\"password\":\"password2\",\"\
    profession\":\"scientist\",\"id\":2}`\n\n## Delete User\nThis is much like the\
    \ `addUser` API. The input data comes via `req.body` and, using the user ID, we\
    \ delete the right user from the system. Keeping things simple, we will delete\
    \ user ID `2`. Clear the `server.js` file and add this code:\n\n```javascript\n\
    var express = require('express');\nvar app = express();\nvar fs = require(\"fs\"\
    );\nvar id = 2;\napp.delete('/deleteUser', function (req, res) {\n  // First read\
    \ existing users.\n  fs.readFile( __dirname + \"/\" + \"users.json\", 'utf8',\
    \ function (err, data) {\n    data = JSON.parse( data );\n    delete data[\"user\"\
    \ + 2];\n    console.log( data );\n    res.end( JSON.stringify(data));\n  });\n\
    })\nvar server = app.listen(8081, function () {\n  var host = server.address().address;\n\
    \  var port = server.address().port;\n  console.log(\"Example app listening at\
    \ http://%s:%s\", host, port)\n})\n```\n\nOnce more, using a local machine and\
    \ a REST client, access [http://127.0.0.1:8081/deleteUser](http://127.0.0.1:8081/deleteUser)\
    \ and HTTP Method : `DELETE` and you should see this:\n\n`{\"user1\":{\"name\"\
    :\"michael\",\"password\":\"password1\",\"profession\":\"teacher\",\"id\":1},\"\
    user3\":{\"name\":\"ronnie\",\"password\":\"password3\",\"profession\":\"clerk\"\
    ,\"id\":3}}`\n"
