    # 第一步 — 启动和停止 REPL


    只要你的电脑上安装了 Node.js，你就拥有了 REPL。因此，启动它非常简单——打开你的命令行终端（shell）并输入以下内容：


    ```

    node

    ```


    这将显示 REPL 提示符，它看起来如下：

    `> `


    当你看到 `>` 符号时，它表示你可以输入 JavaScript 代码进行立即求值。让我们尝试一个例子。在 REPL 中输入以下内容来将两个数字相加：


    `> 2 + 3`


    现在按下 **ENTER**（回车），REPL 就会求值并返回结果：

    `5`


    如果你想退出 REPL，请输入 `.exit`。或者，按两次 `CTRL+C` 或按一次 `CTRL+D`，你就会返回 shell 提示符。现在你已经知道如何启动和停止
    REPL 了，让我们来看看如何使用它来执行简单的 JavaScript 代码。


    # 第二步 — 在 REPL 中执行代码


    你可以使用 REPL 快速测试你的 JavaScript 代码，而无需创建文件来存储它，几乎所有的 Node.js 或 JavaScript 表达式都可以在这里执行。在第一步中，我们尝试了一个两个数字相加的表达式，现在我们来尝试除法。


    启动 REPL：

    ```

    node

    ```


    然后在提示符后输入以下内容：

    `> 20 / 5`


    按下 **ENTER** 键，你将如所料的那样看到输出为：

    `4`


    我们还可以在 REPL 中测试字符串操作。让我们尝试在 REPL 中拼接一对字符串。输入以下内容：

    `> "Hello " + "World"`


    再次按下 **ENTER**，REPL 会求值表达式的结果，并输出：`''Hello World''`


    **注意**：你可能已经发现输出被包裹在单引号中，而不是双引号。与许多其他编程语言不同，JavaScript 字符串中使用的引号对它们值没有影响。如果你在字符串输入中使用了单引号，REPL
    足够聪明，会在输出时将其更改为双引号。


    ### 调用函数


    当你编写 Node.js 代码时，通常会使用全局 `console.log` 方法或类似的函数来打印消息。在 REPL 提示符处输入以下命令：


    `> console.log("Hey")`


    按下 **ENTER** 键，你应该看到以下内容：

    `Hey`

    `undefined`


    输出的第一行是我们从 `console.log` 获取的内容。字符串中的消息被打印到 `stdout` 流（即你的屏幕上）。注意这里没有引号——这是因为 `console.log`
    打印字符串时不带引号。显示为 `''undefined''` 的第二行是函数的返回值。


    ### 创建变量


    在 JavaScript 中，你极少只与字面量一起。当你在 REPL 中创建变量时，工作原理与处理 `.js` 文件非常相似。在提示符处输入以下命令：


    `> let age = 45`


    按下 **ENTER** 键，你将看到以下内容：

    `undefined`


    和之前一样，当我们使用 `console.log` 时，命令的返回值为 `''undefined''`。名为 `age` 的变量将一直可用，直到 REPL
    会话关闭。例如，你可以像这样将其乘以三：

    `> age * 3`


    按下 **ENTER**，输出将是：

    `135`


    因为 REPL 会返回值，所以不需要使用 `console.log` 这样的函数来查看输出。默认情况下，REPL 的值会自动显示在屏幕上。


    ### 多行块


    REPL 也支持多行块。例如，我们可以创建一个给任何数字加 10 的函数。通过输入以下内容开始函数：


    `> const add10 = (num) => {`


    按下 **ENTER**，提示符会改变，看起来如下：

    `...`


    为什么会这样？因为 REPL 在命令末尾看到了一个大括号，并假设会有更多代码行，而且这些行必须是缩进。为了方便阅读，REPL 在下一行放置了三个点和一个空格，使得下一行代码看起来像是缩进的。逐行输入该函数的后续行，每次一行，并在每行后按下
    **ENTER**：

    `... return num + 10;`

    `... }`


    当你在右括号后按下 **ENTER** 时，输出将显示：

    `undefined`


    这是赋值给变量的返回值，`...` 提示符再次替换为 `>` 提示符。

    `undefined >`


    接下来，我们可以对指定值调用 `add10()`：

    `> add10(10)`


    如你所预期的，输出显示为：

    `20`


    在将 JS 代码添加到程序之前，可以使用 REPL 尝试代码片段。而且，为了让你更方便，REPL 中还有一些快捷键。


    # 第三步 — 掌握 REPL 快捷键


    REPL 中有一些可以减少编写代码时间的快捷键。首先，它会保留历史记录，显示所有输入的命令，并让你查阅并在需要时重复命令。例如，输入此字符串：

    `"The answer to everything is 50"`


    得到的结果是：`''The answer to everything is 50''`


    我们可以编辑它并将 `"50"` 改为 `"40"`，因此在提示符处，按 **UP**（向上）箭头回到上一次使用的命令：

    `> "The answer to everything is 50"`


    将光标左移，删除 `5` 并输入 `4`；按下 **ENTER**，这就是你看到的：

    `''The answer to everything is 40''`


    继续按 **UP** 箭头，它会带带你回到命令历史，直到回到当前会话中的第一个命令。使用 **DOWN**（向下）箭头会带你回到最近使用的命令。当你熟悉了这些并知道它们如何工作后，反复按
    **DOWN** 键，直到回到提示符。


    要获取上一次的值，可以使用下划线 `_`。在提示符处输入：

    `> _`


    然后按下 **ENTER** 键。屏幕上的输出是最后输入的字符串：`''The answer to everything is 40''`


    此外，REPL 中的自动补全功能可以用于关键字、变量和函数。假设你想使用 `Math.sqrt` 函数来找到某个数的平方根；输入前几个字符：

    `> Math.sq`


    按下 **TAB** 键，函数就会自动补全。如果有多个可能性，REPL 将显示所有选项。尝试输入：

    `> Math.`


    双击 **TAB** 键将显示可能的补全项：

    `Math.__defineGetter__`

    `Math.__defineSetter__`

    `Math.__lookupGetter__`

    `Math.__lookupSetter__`

    `Math.__proto__`

    `Math.constructor`

    `Math.hasOwnProperty`

    `Math.isPrototypeOf`

    `Math.isEnumerable`

    `Math.toLocaleString`

    `Math.valueOf`

    `Math.abs`

    `Math.acos`

    `Math.acosh`

    `Math.asin`

    `Math.acos`

    `Math.atan`

    `Math.atan2`

    `Math.atanh`

    `Math.cbrt`

    `Math.ceil`

    `Math.clz32`

    `Math.cos`

    `Math.cosh`

    `Math.exp`

    `Math.expm1`

    `Math.floor`

    `Math.fround`

    `Math.hypot`

    `Math.imul`

    `Math.log`

    `Math.log10`

    `Math.log1p`

    `Math.log2`

    `Math.max`

    `Math.min`

    `Math.pow`

    `Math.random`

    `Math.round`

    `Math.sign`

    `Math.sin`

    `Math.sinh`

    `Math.tan`

    `Math.tanh`

    `Math.trunc`


    看到多少行取决于屏幕大小，但上面的列表包含了 Math 模块的所有属性和函数。要在不执行当前行的情况下获取新行，请按 **CTRL+C**。这些只是几个 REPL
    快捷键，它们让你的编码更高效。然而，还有其他方法可以提高生产力，那就是 REPL 命令。


    # 第四步 — REPL 命令


    某些特定的关键字有助于控制 REPL 行为，每个命令都以点（.）开头。


    `.help` 如果你想查看所有可用命令，使用此命令：`.help`。你看不到巨大的列表，因为命令并不多，但它们对你在 REPL 中操作很有帮助。

    `.break` 如果你卡住了，可以用它退出。

    `.clear` `.break` 的别名。

    `.editor` 进入编辑器模式。

    `.exit` 退出 REPL。

    `.load` 打印帮助信息。从文件将 JS 加载到 REPL 会话。`.save` 将此会话求值的命令保存到文件中。如果你想退出当前表达式，按 **C**；如果你想退出
    REPL，按 **D**。如果你需要刷新某个命令的作用，只需返回 `.help` 命令即可。


    你可以使用 `.clear` 或 `.break` 退出多行表达式。让我们这样开始一个 for 循环：

    `> for (let i = 0; i < 1000000; i++) {`


    如果你想退出更多行，请使用 `.clear` 或 `.break` 命令，而不是输入下一行。这将跳出循环：

    `... .break`


    出现了一个新提示符：

    `> `


    REPL 到了新行，而无需执行代码。这种工作方式与按下 **CTRL+C** 类似。


    `.save` 和 `.load` 你可以使用 `.save` 命令将 REPL 启动以来运行的所有代码存储到单个文件中，而 `.load` 命令将在 REPL
    中运行文件中的 JS 代码。使用 **CTRL+D** 或 `.exit` 命令退出会话并使用 `node` 开始新会话。唯一保存的代码将是你现在要编写的内容。创建一个列出蔬菜的数组：

    `> vegetables = [''pepper'', ''onion'', ''potato'']`


    下一行将显示 REPL 输出：`[''pepper'', ''onion'', ''potato'']` 将其保存到文件并命名为 `vegetables.js`：

    `> .save vegetables.js`


    现在你将看到以下消息：Session saved to: vegetables.js（会话已保存至：vegetables.js）。'
- fmt: "\n- `--save`: this installs and then adds an entry to the file called `dependencies`\
    \ in `package.json`\n- `--save-dev`: this installs and then adds an entry to the\
    \ file called `devDependencies` in `package.json`\n\nThe difference between these\
    \ is that `devDependencies` tend to be development tools, such as testing libraries,\
    \ and `dependencies` are found bundled in the app. You can also update packages\
    \ by running this command: `npm update`. `npm update` checks every package, looking\
    \ for an updated version that matches the restraints of your version. And if you\
    \ have a single package you want to be updated, simply specify the package name:\
    \ `npm update <package-name>`.\n\n## Versioning\nAs well as standard downloads,\
    \ you can also use `npm` for versioning, allowing you to specify a specific package\
    \ version or ask for a version above or below the one you need. Most of the time,\
    \ libraries are only compatible with another library’s major release. Or you may\
    \ have a `lib` causing an issue because it has an unfixed bug in it. \n\nWhen\
    \ you explicitly specify a library version, it helps everyone stay on that version,\
    \ ensuring an entire team is working on the same version until `package.json`\
    \ gets updated. In cases like these, versioning is helpful, and `npm` will always\
    \ follow the `semver` (semantic versioning) standard.\n\n## Running Tasks\nThe\
    \ format to specify command-line tasks is supported by `package.json` and you\
    \ can run these tasks with this: `npm run <task-name>`.\n\nHere’s an example:\n\
    ```json\n{\n  \"scripts\": {\n    \"start-dev\": \"node lib/server-development\"\
    ,\n    \"start\": \"node lib/server-production\"\n  }\n}\n```\nIt is also common\
    \ to run Webpack using this feature too:\n```json\n{\n  \"scripts\": {\n    \"\
    watch\": \"webpack --watch --progress --colors --config webpack.conf.js\",\n \
    \   \"dev\": \"webpack --progress --colors --config webpack.conf.js\",\n    \"\
    prod\": \"NODE_ENV=production webpack -p --config webpack.conf.js\"\n  }\n}\n\
    ```\nInstead of having to type long commands, of having to try remembering them\
    \ and making sure you don’t mistype them, you can do this instead:\n```bash\n\
    $ npm run watch\n$ npm run dev\n$ npm run prod\n```\n\n## Where Does npm Install\
    \ the Packages?\nWhen `npm` is used to install packages, you can use two installation\
    \ types – local or global installation.\n\nWhen you type `install` commands in\
    \ `npm`, like this: `npm install lodash`, by default, the package gets installed\
    \ in the current tree, in the subfolder called `node_modules`. At the same time,\
    \ the `lodash` entry is also added to the `dependencies` property in `package.json`\
    \ in the current folder.\n\nTo do a global installation, you need to add the `-g`\
    \ flag: `npm install -g lodash`. This time, the package uses a global location\
    \ instead of installing the package in the local folder. But where?\n\nThe `-g`\
    \ command tells you the exact location on your computer. On a Linux or Mac system,\
    \ this might be `/usr/local/lib/node_modules`, while on Windows, it might be in\
    \ `C:\\Users\\YOU\\AppData\\Roaming\\npm\\node_modules`. If you manage Node.js\
    \ versions using `npm`, those locations would be different.\n\n## Using or Executing\
    \ Packages Installed With npm\nWhen you use `npm` to install a package in the\
    \ folder called `node_modules`, or globally, how is that used in Node.js code.\
    \ Let’s say you install the popular JS utility library, `lodash`, using this command:\
    \ `npm install lodash`.\n\nThe package will be installed in the local `node_modules`\
    \ folder. Using it in your code requires that you import it to the program using\
    \ the `require` command:\n```javascript\nconst _ = require('lodash')\n```\nSo,\
    \ what about if you have an executable package? The executable file would go to\
    \ the `node_modules/.bin/` folder instead. One of the easiest ways to demonstrate\
    \ this is using the `cowsay` package, which has a command-line program. This program\
    \ can be executed to make an animal, like a cow, say something.\n\nWhen the package\
    \ is installed like this: `npm install cowsay`, it installs along with required\
    \ dependencies in the `node_modules` folder:\n[![The node_modules folder content](Image00007.jpg)](https://nodejs.dev/static/b245c50f5080dae16a2525fae0ba2c91/d2c2a/node_modules-content.png)\n\
    \nA hidden `bin` folder contains the symbolic links pointing to the `cowsay` binaries:\n\
    [![The binary files](Image00008.jpg)](https://nodejs.dev/static/99830aefa055e247397de544ad7b7744/d2c2a/binary-files.png)\n\
    \nSo, how are these executed? You could run it by typing `./node_modules/.bin/cowsay`\
    \ and it will work. However `npx`, which is in recent `npm` versions, is better.\
    \ All you do is run: `npx cowsay` and the package location will be automatically\
    \ found.\n[![Cow says something](Image00009.jpg)](https://nodejs.dev/static/ad4f3d3a7464bb0f8a2845fe8e6588c2/d2c2a/cow-say.png)\n\
    \n## Chapter Four: Node.js Callbacks and Promises\nWhen you first start out with\
    \ Node.js, one of the first things you are likely to come across is callbacks.\
    \ Before we look into what callbacks are, we need to know why they exist, and\
    \ this is down to Node's asynchronous nature. Most people know that asynchronous\
    \ programming is “better but harder.” That might sound somewhat simplistic so\
    \ let’s look at it by comparing synchronous with asynchronous code.\n\nThe first\
    \ thing you will see is that the asynchronous version of code is nothing short\
    \ of ugly. It looks like it is overly complicated, but we’re not getting that\
    \ much more out of it than we do from synchronous code. However, it’s undeniable\
    \ that there are gains, so let’s talk about them.\n\nAsynchronous code is pretty\
    \ cool in that while your code is hanging about, waiting for something like an\
    \ API call or a database response, it isn’t hanging about doing anything. With\
    \ synchronous code, when it’s doing something, it blocks up your code, and if\
    \ it takes a long time to do that thing, it brings everything else to a halt.\
    \ With asynchronous code, you can get on with other things at the same time. This\
    \ is one of the primary reasons why Node.js even exists – asynchronous servers\
    \ can get on processing requests while waiting for I/O or Input/Output.\n\nYes,\
    \ when you do asynchronous programming, which we will be delving deeper in the\
    \ next chapter, things do feel more complicated, but it isn’t that hard to understand,\
    \ and it offers benefits that are well worth the time it takes to understand it.\n\
    \nSo, now we understand that a little better, let’s get deeper into callbacks.\
    \ What, exactly, are they? Callbacks are nothing more than functions passed to\
    \ other functions as arguments, which the receiving function will then use, or\
    \ call it back. Have a look at this simple example of a callback function in action:\n\
    ```javascript\nfs.readFile(funFileName, function(err, file) {\n  if(err)\n   \
    \ handleError(err);\n  console.log(\"file: \", file)\n})\n```\n"
