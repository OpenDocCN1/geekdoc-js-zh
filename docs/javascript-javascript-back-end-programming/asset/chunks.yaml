    - [References](#\n\n# Introduction\n\nBack-end development describes everything\
    \ that goes on behind the scenes when you do something on web app. Mostly, it\
    \ refers to the application's server-side and the communication that goes on between\
    \ the front-end (the browser) and the database.\n\nNode.js was developed in 2009\
    \ by Ryan Dahl, built on the Chrome JavaScript Engine. According to the official\
    \ documentation, Node.js is designed to make it easy to build scalable, fast network\
    \ applications using a lightweight, efficient I/O model that non-blocking and\
    \ event-driven. That makes it perfect for real-time, data-intensive applications\
    \ running on distributed devices. It is open-source. It works cross-platform,\
    \ using JavaScript to write applications that can run inside the Node.js runtime\
    \ in Linux, Windows, and OS X. It provides a great library full of JS modules\
    \ making development simple.\n\n## Node.js Features\n\n*   **Event-Driven and\
    \ Asynchronous**: All Node.js APIs are asynchronous, i.e., they are non-blocking.\
    \ This means that a Node.js server will never wait for data to come back from\
    \ an API; it will move on to the next one, and the Events notification mechanism\
    \ will help get the response from previous calls.\n*   **Fast**: as it is built\
    \ on the Google Chrome V8 JavaScript Engine, it is one of the fastest libraries\
    \ for code execution.\n*   **Single-Thread, Scalable**: using a single-thread\
    \ model containing event-looping, the server can respond in a non-blocking manner,\
    \ making it scalable. The single-threaded program can serve many more requests\
    \ than the traditional servers, such as Apache HTTP.\n*   **No Buffering**: data\
    \ is never buffered in Node.js applications; instead, it is output in large chunks.\n\
    \n## Prerequisites\nYou must have at least a basic understanding of JavaScript\
    \ and some ideas of other technologies, such as CSS, HTML, AJAX, and so on.\n"
