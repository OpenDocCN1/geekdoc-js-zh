  trans: "\n\n- Promise 总是按照它们进入事件队列的精确顺序被调用的。\n- 处理错误变得更加容易，因为所有错误都可以通过放在末尾的一个 `.catch()`\
    \ 块进行处理，而不是在每个层级单独处理。\n- Promise 还避免了控制反反转（inversion of control），而旧的回调函数在回调传递给第三方库时会失去对函数执行的控制权。\n\
    \n### 异步代码的本质\n\n让我们来看另一个示例，它展示了异步代码的本质。它展示了当我们不完全清楚代码执行顺序时可能会发生什么，以及将异步代码和同步代码同等对待的后果。这与我们之前过的示例类似，但这次包含了几个\
    \ `console.log()` 语句，以展示你可能认为代码会执行的顺序：\n\n```javascript\nconsole.log ('Starting');\n\
    let image;\nfetch('coffee.jpg').then((response) => {\n    console.log('It worked\
    \ :)')\n    return response.blob();\n}).then((myBlob) => {\n    let objectURL\
    \ = URL.createObjectURL(myBlob);\n    image = document.createElement('img');\n\
    \    image.src = objectURL;\n    document.body.appendChild(image);\n}).catch((error)\
    \ => {\n    console.log('There is a problem with your fetch operation: ' + error.message);\n\
    });\nconsole.log ('All done!');\n```\n\n浏览器开始执行代码。它看到初始的 `console.log()` 语句并执行它，随后创建了\
    \ `image` 变量。然后它进入下一行并开始执行 `fetch()` 块。然而，`fetch()` 是异步执行且不会阻塞的，执行完与 相关的代码后，剩余代码继续执行。因此，执行了最后一个\
    \ `console.log()`，并将结果输出到控制台。\n\n只有当 `fetch()` 完成并且结果通过 `.then()` 块传递时，第二个 `console.log()`\
    \ 消息才会出现在控制台上。如你所见，消息出现的顺序与你预期的并不符：\n\n- Starting\n- All done!\n- It worked :)\n\
    \n"
- fmt: "\nIf you find this confusing, have a look at this example:\n\n```javascript\n\
    console.log(\"registering click handler\");\nbutton.addEventListener('click',\
    \ () => {\n    console.log(\"get click\");\n});\nconsole.log(\"all done\");\n\
    ```\n\nThis is much the same in the way it behaves – the first and the third `console.log()`\
    \ messages are immediately shown, but the middle one has been blocked until the\
    \ mouse button is clicked. In the first example, the difference was that the middle\
    \ message was blocked, waiting for a resource to be displayed on the screen rather\
    \ than a button being clicked.\n\nThis kind of setup could cause real issues in\
    \ less trivial code. Async code blocks cannot be included if they return a result\
    \ that is then relied on in a later sync block. There is no way of guaranteeing\
    \ the async function returns before the browser processes the sync block.\n\n\
    To see how this works, take the following as an example:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Simple async sync example</title>\n\
    </head>\n<body>\n<script>\nconsole.log ('Starting');\nlet image;\nfetch('coffee.jpg').then((response)\
    \ => {\nconsole.log('It worked :)')\nreturn response.blob();\n}).then((myBlob)\
    \ => {\nlet objectURL = URL.createObjectURL(myBlob);\nimage = document.createElement('img');\n\
    image.src = objectURL;\ndocument.body.appendChild(image);\n}).catch((error) =>\
    \ {\nconsole.log('There is a problem with your fetch operation: ' + error.message);\n\
    });\nconsole.log ('All done!');\n</script>\n</body>\n</html>\n```\n\nChange the\
    \ fourth `console.log()` to:\n```javascript\nconsole.log ('All done! ' + image.src\
    \ + 'displayed.');\n```\n\nNow your console should display an error rather than\
    \ message three: `TypeError: image is undefined; can't access its \"src\" property`.\
    \ This happens when the browser attempts to run `console.log()` number three and\
    \ the `fetch()` block hasn’t completed – the `image` variable does not yet have\
    \ a value.\n\nNOTE You cannot use `fetch()` to get files off your local filesystem,\
    \ for security reasons, so you will need to run the example above through a local\
    \ server. Fixing this `fetch()` problem and ensuring that all `console.log()`\
    \ statements appear in the order you want could be done by making the third one\
    \ run async. You do this by putting it inside a `.then()` block chained to the\
    \ second one, or you could place it in the second `.then()` block.\n\n# Chapter\
    \ Six: Node.js Event Loops and Emitters\n\nEvent loops help Node.js carry out\
    \ non-blocking I/O operations, even though JS is a single-threaded language. To\
    \ do this, operations are offloaded to the system kernel whenever it is possible\
    \ to do. These days, kernels are multi-threaded, which means they can handle several\
    \ operations at once as they execute in the background. When one has completed,\
    \ the kernel lets node.js know, ensuring the right callback goes on the poll queue\
    \ to be executed at some point. You will understand this by the end of the chapter.\n\
    \nWhen Node.js is started, the event loop is initialized. The input script is\
    \ processed or dropped onto the REPL – this can take timers, async API calls,\
    \ or it can call `process.nextTick()` - and the event loop is processed. In the\
    \ diagram below, you can see a simple overview of the order of operations in the\
    \ event loop:\n\n```\n┌─────────────────────────┐\n┌─>timers               │\n\
    │   └─────────────┬ ─────┘\n┌─────────────┴ ─────┐\n│   pending callbacks    │\n\
    │   └─────────────┬ ─────┘\n┌─────────────┴ ─────┐\n│   idle, prepare        │\n\
    │   └─────────────┬ ─────┘\n┌───────────────────────┐\n┌─────────────┴ ─────┐\n\
    │   incoming:           │\n│   poll                 │\n│   <─────┤connections,\
    \ │\n│   └─────────────┬ ─────┘\n│   data, etc.           │\n│   ┌─────────────┴\
    \ ─────┘\n│   ───────────────────────┘\n│   check               │\n│   └─────────────┬\
    \ ─────┘\n┌─────────────┴ ─────┐\n└──┤close callbacks    │\n      │\n└─────────────────────────┘\n\
    ```\n\nEach of the boxes in the above diagram is called event loop phases. Each\
    \ phase contains a FIFO (First In Out) queue of callbacks that need executing.\
    \ When the event loop goes into any phase, the phase-specific operations are performed,\
    \ and the callbacks in the phase queue are executed until they are all done, or\
    \ the callback limit is reached. When this happens, the event loop goes to the\
    \ next phase and so on throughout the order.\n\nAny one of the operations can\
    \ result in more operations being scheduled, and the kernel queues new events\
    \ processing in the poll phase. It is possible for poll events to be queued at\
    \ the same time as polling events get processed. The result of this is much longer\
    \ running callbacks, leading to the poll phase running longer than the timer allows.\n\
    \n## Phase Overview\n\nBetween each, the event loop runs, Node.js looks to see\
    \ if any timers or asynchronous I/O needs to be run; if not, it will cleanly shut\
    \ down.\n\n### Timers\n\nTimers are used to specify the threshold after which\
    \ given callbacks are executed instead of waiting for the exact time someone requires.\
    \ These callbacks run as soon as they are scheduled after the threshold but may\
    \ be delayed by other callbacks scheduling in the operating system. Technically\
    \ speaking, the timer executions are controlled by the poll phase.\n\nLet’s say\
    \ you want a timeout scheduled to execute after a threshold of 100ms; in that\
    \ case, your script would begin asynchronous reading of a file that takes 95 ms:\n\
    \n```javascript\nconst fs = require('fs');\nfunction someAsyncOperation(callback)\
    \ {\n  // This takes 95ms to complete\n  fs.readFile('/path/to/file', callback);\n\
    }\nconst timeoutScheduled = Date.now();\nsetTimeout(() => {\n  const delay = Date.now()\
    \ - timeoutScheduled;\n  console.log(`${delay}ms have passed since scheduling`);\n\
    }, 100);\n\n// do someAsyncOperation that takes 95 ms to complete\nsomeAsyncOperation(()\
    \ => {\n  const startCallback = Date.now();\n  // do something else that takes\
    \ 10ms...\n  while (Date.now() - startCallback < 10) {\n    // do nothing\n  }\n\
    });\n```\n\nWhen the event loop goes into the poll phase, there is an empty queue\
    \ – `fs.readFile()` has not completed – so the loop waits for the specified number\
    \ of remaining ms until the threshold for the earliest timer is reached. In the\
    \ meantime, `fs.readFile()` continues reading the file, and the callback, taking\
    \ 10 ms, gets put on the poll queue and then executed. Once the callback is complete,\
    \ all the queued callbacks are finished, and the event loop can see that the soonest\
    \ timer’s threshold is reached. It goes back to the timers phase, and the timer\
    \ callback is executed. The delay between the scheduled timer and execution of\
    \ its callback is 105 ms in this example.\n\nNOTE Preventing starvation of the\
    \ event loop by the poll phase requires a library called `libuv` have a hard maximum\
    \ before it ceases to poll for new events. That maximum is system-dependent. `libuv`\
    \ is a C library responsible for implementing the event loop and all the platform’s\
    \ asynchronous behaviors.\n\n### Pending callbacks\n\nThe pending callbacks phase\
    \ is responsible for executing callbacks for system operations like TCP error\
    \ types. For example, if `ECONNREFUSED` is received by a TCP socket during an\
    \ attempt to connect, the error may not be reported immediately by some *nix systems.\
    \ Instead, it gets queued in the pending callbacks phase, waiting for execution.\n\
    \nThis phase executes callbacks for some system operations, such as types of TCP\
    \ errors. For example, if a TCP socket receives `ECONNREFUSED` when attempting\
    \ to connect, some *nix systems want to wait to report the error. This will be\
    \ queued to execute in the `pending callbacks` phase.\n\n### Poll\n\nThere are\
    \ two main functions to the poll phase:\n\n*   To calculate the length of time\
    \ to block and poll for I/O\n*   Process poll queue events\n\nWhen the event loop\
    \ goes into the poll phase, if no timers have been scheduled, one of the two things\
    \ below can happen:\n\n1.  If the queue isn’t empty, the loop iterates through\
    \ the callback queue, asynchronously executing them until the hard limit is reached,\
    \ or the queue is empty\n\n2.  If the queue is empty, one of two things can happen:\n"
