    the result cannot be immediately returned, which means the code below, which is
    pseudocode, will not work.let response = fetch(''myImage.png''); // fetch is asynchronouslet
    blob = response.blob();// somehow display image blob in the UIThe code doesn’t
    work because we have no idea how long it will take the image to download. So,
    when the second code line is run, an error is thrown – this may be every time,
    or it may be intermittent – because there is no available response. You really
    need your code to wait for the response before it attempts anything else.Asynchronous
    code comes in two styles – callbacks and promise-style, which is the newer code
    style. We’ll look at both of these now.[Async Callback s](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Introducing#async_callbacks)A
    callback is a function that we specify as an argument when we call a function
    that executes background code. Once the background code is run, the callback function
    is called to tell you that the work is complete or that something interesting
    has happened. Callbacks are old-fashioned, but they are still in use in some of
    the older but common APIs.In the code above, we saw an example of one async callback
    – it was in the addEventListener() method as the second parameter:btn.addEventListener(''click'',
