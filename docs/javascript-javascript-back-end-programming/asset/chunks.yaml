  trans: "\n服务器通常会监听一个 TCP 套接字，而 Node.js 进程通过 TCP 连接连接到服务器。然而，MongoDB 也有自己的协议，用以帮助它理解进程（即客户端）从数据库中需要什么。与其学习在\
    \ TCP 层上需要发送的所有消息，我们可以使用驱动程序软件来帮助我们抽象掉这一切。在这种情况下，我们使用 MongoDB 驱动程序，你可以在[此处作为 npm\
    \ 软件包找到它](https://www.npmjs.com/package/mongodb)。\n\n现在，你需要记住的是，虽然这个驱动程序可以帮助我们连接并抽象底层的通信请求和响应，但它只能让我们这些开发者在道路上走得那么一小段。MongoDB\
    \ 是所谓的“无无模式（schema less）”数据库，这意味着当你刚开始时，你拥有的权力远超你实际所需的。你拥的力量越大，出现问题的表面积就越大。减少\
    \ Bug 和错误走弯的表面积，你就能走在通正确的道路上，但这还需要一些额外的东西。\n\n这就是 Mongoose 上用场的地方——它是对上面提到的驱动程序的抽象。通常情况下，每种抽象都会减少你的低级操作能力。但这并不总是是一件坏事，因为在某些情况下，它甚至可以将你的生产力提高\
    \ 1000 倍或更多，因为到底，你并不真的需要完全访问底层 API。你可以这样想：从技术上来说，实时聊天应用可以用 Python 和 C 同时创建。作为开发者，Python\
    \ 能帮助你以更高的生产力更快地实现。C 是更高效的选择，但会在开发生产力和速度上让你付出巨大代价，更不用说崩溃和 Bug 了。而且，实现 websockets\
    \ 并不需要 C 提供的能力。类似地，Mongoose 让你减少低级 API 的访问表面积，但它带来了极佳的开发者体验（DX）和许多收益。\n\n## 连接\
    \ Mongoose + MongoDB\n\n首先，我们想看看 MongoDB 数据库如何与 Mongoose 连接：\n\n```javascript\n\
    mongoose.connect(DB_CONNECTION_STRING, { useNewUrlParser: true, useUnifiedTopology:\
    \ true, useCreateIndex: true, useFindAndModify: false})\n```\n\n使用这种格式进行连接可以确保你使用的是\
    \ Mongoose URL 解析器，并且没有使用任何已废弃的做法。\n\n## 执行 Mongoose 操作\n\n现在我们可以查看 Mongoose 操作以及应该如何执行它们。Mongoose\
    \ 提供了两个选项：\n\n1. 基于游标的查询（Cursor-based querying）\n2. 全量查询（Full fetching query）\n\
    \n### 基于游标的查询\n\n基于游标的查询在于任何时候只处理一条记录，同时从数据库获取单个或批量文档。当你拥有大量数据且内存受限的环境时，这是最有效的方法之一。假设你有总计约\
    \ 10GB 的文档，并且它们需要在 1 核 1GB 的内存云服务器上解析。整个内容无法一次性获取，因为根本无法放入你的环境中，所以唯一可行的方案就是使用基于游标的查询。\n\
    \n### 全量查询\n\n这种查询类型允许你一次性获取整个查询响应，这通常也是你将使用的类型——也是我们在这里关注的重点。\n\n## 使用 Mongoose\
    \ 模型\n\n模型是 Mongoose 的超级力量，帮助你强制执行模式规则并将 Node 代码无缝集成到数据库单元中。因此，首先，我们需要定义一个良好的模型：\n\
    \n```javascript\nimport mongoose from 'mongoose'\nconst CompletedSchema = new\
    \ mongoose.Schema({\n  type: { type: String, enum: ['course', 'classroom'], required:\
    \ true },\n  parentslug: { type: String, required: true },\n  slug: { type: String,\
    \ required: true },\n  userid: { type: String, required: true }\n}, { collection:\
    \ 'completed' })\n\nCompletedSchema.index({ slug: 1, userid: 1 }, { unique: true\
    \ })\nconst model = mongoose.model('Completed', CompletedSchema)\nexport default\
    \ model\n```\n\n从这里你需要注意的一些有趣的点是：\n\n1. **Required**：尽可能在所有必填字段上保持为 true。这可以为你节省很多痛苦，特别是当你没有使用\
    \ TypeScript 或静态类型检查系统来帮助你正确编写创建对象的属性名时。\n2. **索引和唯一字段（Indexes and unique fields）**应该被定义，你也可以在\
    \ schema 中添加唯一属性。在这里不会深入讨论索引，这是一个非常广泛的主题，但它们可以显著加快你的查询，特别在大规模下。\n3. **集合名称（Collection\
    \ names）**应该显式定义。虽然 Mongoose 能够根据模型的名称自动提供集合名称，但这也是一种抽象，对于我们的需求来说过度了。至少你应该在代码库中知道集合和数据库名称。\n\
    4. 如果可能，使用**枚举（enums）**来限制值。\n\n## 执行 CRUD 操作\n\nCRUD 代表创建（Create）、读取（Read）、更新（Update）、删除（Delete）——这是操作数据库数据的基本选项。让我们通过几个示例作为结束。\n\
    \n### 创建操作（Create Operation）\n\n这仅用于创建新的数据库记录。我们将使用之前定义的模型来创建记录：\n\n```javascript\n\
    try {\n  const res = await CompletedSchema.create(record)\n} catch(error) {\n\
    \  console.error(error)// 处理错误\n}\n```\n\n同样，有几点需要注意：\n\n1. 不要使用回调，改用 `async-wait`。\n\
    2. 你应该在查询中使用 `try-catch` 块，因为查询可能会因为多种原因失败，包括值错误、重复记录等。\n\n### 读取操作（Read Operation）\n\
    \n此操作从数据库中读取值，虽然听起来很简单，但关于 Mongoose 有几点需要注意：\n\n```javascript\nconst res = await\
    \ CompletedSchema.find(info).lean()\n```\n\n1. 你发现 `lean()` 函数了吗？这是提升性能最好的函数之一。默认情况下，Mongoose\
    \ 会获取从数据库返回的文档并进行处理并为它们添加魔法方法，如 `.save()`。\n2. 使用 `.lean()` 时，返回的是纯 JSON 对象，而不是消耗资源和内存的文档。这会让你的查询快得多，而且不会消耗太多的\
    \ CPU。\n3. 话虽如此，如果你正在考虑更新数据，可以省略 `.lean()`。\n"
