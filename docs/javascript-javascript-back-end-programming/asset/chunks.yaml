- fmt: "\n* Synchronous approach – these are blocking functions. They wait for each\
    \ operation to finish, and then they will execute the next operation. This is\
    \ why they are known as blocking – they block the subsequent command from executing.\
    \ Simply put, a command cannot be executed unless and until the current one is\
    \ done.\n* Asynchronous approach – these are non-blocking functions. They do not\
    \ wait for one command to finish before executing the next one. Instead, all operations\
    \ are executed on the first go around. Each operation’s result is handled once\
    \ the result is in, i.e., each command is executed as soon as possible after the\
    \ previous command is executed, and the previous command will remain in the background,\
    \ processing data and producing the result.\n\n## Use Cases\n\n* Where your operations\
    \ don’t query large data from DB or do any other heavy lifting, you can use Synchronous;\
    \ otherwise, you should use Asynchronous.\n* When you use Asynchronous, you can\
    \ display a progress indicator to users while continuing with the heavy lifting\
    \ in the background – this works well for GUI applications.\n\n## Some of the\
    \ more common I/O operations that use the `fs` module are:\n\n### Reading Files\n\
    To asynchronously read a physical file, use: `fs.readFile()`\n\nAn example of\
    \ how it works:\n```javascript\nfs.readFile(fileName [,options], callback)\n```\n\
    \n#### Parameters\nThere are three parameters or arguments here:\n\n* `filename`\
    \ : the full path and file name in string format.\n* `options` : this can be a\
    \ string or an object, and it can include flags and encoding. The default flag\
    \ is ‘r’ and `utf8` is the default encoding.\n* `callback` : this is a function\
    \ that has two parameters – `fd` and `err`. It is called when the operation has\
    \ finished.\n\nIn the next example, you can see how a file called `TestFile.txt`\
    \ is asynchronously read:\n```javascript\nvar fs = require('fs');\nfs.readFile('TestFile.txt',\
    \ function (err, data) {\n  if (err) throw err;\n  console.log(data);\n});\n```\n\
    This code asynchronously reads `TestFile.txt` on the Windows operating system.\
    \ The callback function is executed when the read operation has been completed.\
    \ The operation will successfully complete, or it will throw an error. If an error\
    \ is thrown, the `err` parameter has all the error information in it. In the `data`\
    \ parameter, you will find the specified file’s content.\n\nThis is a sample file\
    \ called `TextFile.txt` with this content:\n```\nThis test file tests the fs module\
    \ of Node.js\n```\nRunning it will give you the following result:\n```\nC:\\>\
    \ node server.js\nThis test file tests the fs module of Node.js\n```\nIf you want\
    \ to read the file synchronously, use the method called `fs.readFileSync()`:\n\
    ```javascript\nvar fs = require('fs');\nvar data = fs.readFileSync('dummyfile.txt',\
    \ 'utf8');\nconsole.log(data);\n```\n\n### Writing Files\nThe `fs.writeFile` method\
    \ is used for writing data to files. If the file is already in existence, the\
    \ existing content is overwritten, but the method will create the file and write\
    \ the data to it if it doesn't exist.\n\nSignature:\n`fs.writeFile(filename, data[,\
    \ options], callback)`\n\n#### Parameters\nThis method has four parameters:\n\n\
    * `filename` : the full path and file name as a string.\n* `Data` : this is what\
    \ gets written into the file.\n* `options` : this can be a string or an object\
    \ and it can include flags and encoding. The default flag is ‘r’ and `utf8` is\
    \ the default encoding.\n* `callback` : this is a function that has two parameters\
    \ – `fd` and `err`. It is called when the operation has finished.\n\nIn the next\
    \ example you can see a new file named `test.txt` being created and “hello World”\
    \ written asynchronously into it:\n```javascript\nvar fs = require('fs');\nfs.writeFile('test.txt',\
    \ 'Hello World!', function (err) {\n  if (err) console.log(err);\n  else console.log('Write\
    \ operation complete.');\n});\n```\nAnd if you want to append this content to\
    \ a file that already exists, use the method called `fs.appendFile()`:\n```javascript\n\
    var fs = require('fs');\nfs.appendFile('test.txt', 'Hello World!', function (err)\
    \ {\n  if (err) console.log(err);\n  else console.log('Append operation complete.');\n\
    });\n```\n\n### Open Files\nThe `fs.open()` method can be used for opening files\
    \ to read or write to\nSignature:\n`fs.open(path, flags[, mode], callback)`\n\n\
    #### Parameters:\n* `path` : the full path and file name as a string.\n* `Flag`\
    \ : this is the flag required for performing the operation.\n* `Mode` : this indicates\
    \ which mode is required – read, write, readwrite. The default is readwrite, which\
    \ is 0666..\n* `callback` : this is a function that has two parameters – `fd`\
    \ and `err`. It is called when the operation has finished.\n\n#### Flags\nJust\
    \ to divert slightly, these are the flags you can use in read/write operations:\n\
    \n| FLAG | DESCRIPTION |\n| :--- | :--- |\n| r | Opens a file so it can be read.\
    \ If the file doesn’t exist, an exception happens |\n| rs | Opens a file to be\
    \ read in synchronous mode |\n| rs+ | Opens a file for reading from and writing\
    \ to. The OS is told to open the file synchronously |\n| w | Opens a file to be\
    \ written to. If it doesn’t exist, the file is created and if it does exist, it\
    \ will be truncated |\n| wx | Similar to the ‘w’ flag but, if the path exists,\
    \ it will fail |\n| w+ | Opens a file to be written to. If it doesn’t exist, the\
    \ file is created and if it does exist, it will be truncated |\n| wx+ | Similar\
    \ to the ‘w+’ flag but, if the path exists, it fails |\n| a | Opens a file to\
    \ be appended to. If the file does not exist, it is created |\n| ax | Similar\
    \ to the ‘a’ flag but, if the path exists, it fails |\n| a+ | Opens a file to\
    \ be written to. If it doesn’t exist, the file is created |\n| wx+ | Similar to\
    \ the ‘w+’ flag but, if the path exists, it fails |\n\nIn the example below, you\
    \ can see a file being opened and its contents:\n```javascript\nvar fs = require('fs');\n\
    fs.open('TestFile.txt', 'r', function (err, fd) {\n  if (err) throw err;\n  //\
    \ Print bytes only\n  var buffr = new Buffer(1024);\n  fs.read(fd, buffr, 0, 1024,\
    \ 0, function (err, bytes) {\n    if (err) throw err;\n    console.log(buffr.toString('utf8',\
    \ 0, bytes));\n    fs.close(fd, function (err) {\n      if (err) throw err;\n\
    \    });\n  });\n});\n```\nClose the opened file.\n\n### Delete Files\nIf you\
    \ want to delete a file, use the `fs.unlink()` method\nSignature:\n`fs.unlink(path)`\n\
    \nIn the example below, you can see a file being deleted:\n```javascript\nvar\
    \ fs = require('fs');\nfs.unlink('test.txt', function (err) {\n  if (err) throw\
    \ err;\n  console.log('write operation complete.');\n});\n```\n\n## Important\
    \ fs.module Methods\nThis is a list of the most important methods in the FS:\n\
    \n| METHOD | DESCRIPTION |\n| :--- | :--- |\n| `fs.access()` | Looks to see if\
    \ the file exists and it can be accessed by Node.js with its permissions |\n|\
    \ `fs.appendFile()` | Appends data to files – it will create a file if the specified\
    \ one doesn’t exist |\n| `fs.chmod()` | Change a specified file’s permissions.\
    \ Related to `fs.lchmod()` and `fs.fchmod()` |\n| `fs.chown()` | Change a specified\
    \ file’s owner and/or group. Related to `fs.chown()` and `fs.lchown()` |\n| `fs.close()`\
    \ | Close a file descriptor |\n| `fs.copyFile()` | Copy a specified file |\n|\
    \ `fs.createReadStream()` | Create readable file streams |\n| `fs.createWriteStream()`\
    \ | Create writable file streams |\n| `fs.link()` | Create hard links to specified\
    \ files |\n| `fs.mkdir()` | Create new folders |\n| `fs.mkdtemp()` | Create temporary\
    \ directories |\n| `fs.open()` | Set the required file mode |\n| `fs.readdir()`\
    \ | Read a specified directory’s contents |\n| `fs.readFile()` | Read a specified\
    \ file’s contents. Related to `fs.read()` |\n| `fs.readlink()` | Read a symbolic\
    \ link’s specified value |\n| `fs.realpath()` | Resolve relative file path pointers\
    \ to the full path |\n| `fs.rename()` | Rename specified files or folders |\n\
    | `fs.rmdir()` | Remove a specified folder |\n| `fs.stat()` | Return the status\
    \ of the specified filename. Related to `fs.fstat()` and `fs.lstat()` |\n| `fs.symlink()`\
    \ | Create new symbolic links to specified files |\n| `fs.truncate()` | Truncate\
    \ a specified file to the specified length. Related to `fs.ftruncate()` |\n"
  raw: '*   Synchronous approach – these are blocking functions. They wait for each
    operation to finish, and then they will execute the next operation. This is why
    they are known as blocking – they block the subsequent command from executing.
    Simply put, a command cannot be executed unless and until the current one is done.


    *   Asynchronous approach – these are non-blocking functions. They do not wait
    for one command to finish before executing the next one. Instead, all operations
    are executed on the first go around. Each operation’s result is handled once the
    result is in, i.e., each command is executed as soon as possible after the previous
    command is executed, and the previous command will remain in the background, processing
    data and producing the result.


    Use Cases


    *   Where your operations don’t query large data from DB or do any other heavy
    lifting, you can use Synchronous; otherwise, you should use Asynchronous.


    *   When you use Asynchronous, you can display a progress indicator to users while
    continuing with the heavy lifting in the background – this works well for GUI
    applications.


    Some of the more common I/O operations that use the fs module are:Reading FilesTo
    asynchronously read a physical file, use:fs.readFile()An example of how it works:fs.readFile(fileName
    [,options], callback)ParametersThere are three parameters or arguments here:


    *   filename : the full path and file name in string format.


    *   options : this can be a string or an object, and it can include flags and
    encoding. The default flag is ‘r’ and utf8 is the default encoding.


    *   callback : this is a function that has two parameters – fd and err. It is
    called when the operation has finished.


    In the next example, you can see how a file called TestFile.txt is asynchronously
    read:var fs = require(''fs'');fs.readFile(''TestFile.txt'', function (err, data)
    {if (err) throw err;console.log(data);});This code asynchronously reads TestFile.txt
    on the Windows operating system. The callback function is executed when the read
    operation has been completed. The operation will successfully complete, or it
    will throw an error. If an error is thrown, the err parameter has all the error
    information in it. In the data parameter, you will find the specified file’s content.This
    is a sample file called TextFile.txt with this content:This test file tests the
    fs module of Node.jsRunning it will give you the following result:C:\> node server.jsThis
    test file tests the fs module of Node.jsIf you want to read the file synchronously,
    use the method called fs.readFileSync():var fs = require(''fs'');var data = fs.readFileSync(''dummyfile.txt'',
    ''utf8'');console.log(data);Writing FilesThe fs.writeFile method is used for writing
    data to files. If the file is already in existence, the existing content is overwritten,
    but the method will create the file and write the data to it if it doesn''t exist.Signature:fs.writeFile(filename,
    data[, options], callback)ParametersThis method has four parameters:


    *   filename : the full path and file name as a string.


    *   Data : this is what gets written into the file.


    *   options : this can be a string or an object and it can include flags and encoding.
    The default flag is ‘r’ and utf8 is the default encoding.


    *   callback : this is a function that has two parameters – fd and err. It is
    called when the operation has finished.


    In the next example you can see a new file named test.txt being created and “hello
    World” written asynchronously into it:var fs = require(''fs'');fs.writeFile(''test.txt'',
    ''Hello World!'', function (err) {if (err)console.log(err);elseconsole.log(''Write
    operation complete.'');});And if you want to append this content to a file that
    already exists, use the method called fs.appendFile():var fs = require(''fs'');fs.appendFile(''test.txt'',
    ''Hello World!'', function (err) {if (err)console.log(err);elseconsole.log(''Append
    operation complete.'');});Open FilesThe fs.open() method can be used for opening
    files to read or write toSignature:fs.open(path, flags[, mode], callback)Parameters
    :


    *   path : the full path and file name as a string.


    *   Flag : this is the flag required for performing the operation.


    *   Mode : this indicates which mode is required – read, write, readwrite. The
    default is readwrite, which is 0666..


    *   callback : this is a function that has two parameters – fd and err. It is
    called when the operation has finished.


    FlagsJust to divert slightly, these are the flags you can use in read/write operations:


    | FLAG | DESCRIPTION |


    | r | Opens a file so it can be read. If the file doesn’t exist, an exception
    happens |


    | rs | Opens a file to be read in synchronous mode |


    | rs+ | Opens a file for reading from and writing to. The OS is told to open the
    file synchronously |


    | w | Opens a file to be written to. If it doesn’t exist, the file is created
    and if it does exist, it will be truncated |


    | wx | Similar to the ‘w’ flag but, if the path exists, it will fail |


    | w+ | Opens a file to be written to. If it doesn’t exist, the file is created
    and if it does exist, it will be truncated |


    | wx+ | Similar to the ‘w+’ flag but, if the path exists, it fails |


    | a | Opens a file to be appended to. If the file does not exist, it is created
    |


    | ax | Similar to the ‘a’ flag but, if the path exists, it fails |


    | a+ | Opens a file to be appended to. If it doesn’t exist, the file is created
    |


    | ax+ | Similar to the ‘a’ flag but, if the path exists, it fails. |


    In the example below, you can see an existing file being opened and its contents
    read:var fs = require(''fs'');fs.open(''TestFile.txt'', ''r'', function (err,
    fd) {if (err) {return console.error(err);}var buffr = new Buffer(1024);fs.read(fd,
    buffr, 0, buffr.length, 0, function (err, bytes) {if (err) throw err;// Print
    read bytes only, avoiding the junk.if (bytes > 0) {console.log(buffr.slice(0,
    bytes).toString());}// Close the opened file.fs.close(fd, function (err) {if (err)
    throw err;});});});Delete FilesIf you want to delete a file, use the fs.unlink()
    methodSignature :fs.unlink(path, callback);Parameters:There are two parameters:


    *   path : the full path and file name as a string.


    *   callback : this is a function that has two parameters – fd and err. It is
    called when the operation has finished.


    In the example below, you can see an existing file being deleted:var fs = require(''fs'');fs.unlink(''test.txt'',
    function () {console.log(''write operation complete.'');});Important fs.module
    MethodsThis is a list of the most important methods in the FS module:


    | METHOD | DESCRIPTION |


    | fs.access() | Looks to see if the file exists and it can be accessed by Node.js
    with its permissions |


    | fs.appendFile() | Appends data to files – it will create a file if the specified
    one doesn’t exist |


    | fs.chmod() | Change a specified file’s permissions. Related to fs.lchmod() and
    fs.fchmod(). |


    | fs.chown() | Change a specified file’s owner and/or group. Related to fs.chown()
    and fs.lchown() |


    | fs.close() | Close a file descriptor |


    | fs.copyFile() | Copy a specified file |


    | fs.createReadStream() | Create readable file streams |


    | fs.createWriteStream() | Create writable file streams |


    | fs.link() | Create hard links to specified files |


    | fs.mkdir() | Create new folders |


    | fs.mkdtemp() | Create temporary directories |


    | fs.open() | Set the required file mode |


    | fs.readdir() | Read a specified directory’s contents |


    | fs.readFile() | Read a specified file’s contents. Related to fs.read() |


    | fs.readlink() | Read a symbolic link’s specified value |


    | fs.realpath() | Resolve relative file path pointers to the full path |


    | fs.rename() | Rename specified files or folders |


    | fs.rmdir() | Remove a specified folder |


    | fs.stat() | Return the status of the specified filename. Related to fs.fstat()
    and fs.lstat() |


    | fs.symlink() | Create new symbolic links to specified files |


    | fs.truncate() | Truncate a specified file to the specified length. Related to
    fs.ftruncate() |'
