    \ EventEmitter = require('events');\nconst util = require('util');\nfunction MyEmitter()\
    \ {\n  EventEmitter.call(this);\n  this.emit('event');\n}\nutil.inherits(MyEmitter,\
    \ EventEmitter);\nconst myEmitter = new MyEmitter();\nmyEmitter.on('event', ()\
    \ => {\n  console.log('an event occurred!');\n});\n```\n\n事件不能从构造函数中立即发射，因为脚本处理得还不够后，用户无法为该事件分配回调。在构造函数中，可以使用\
    \ `process.nextTick()` 来设置回调。一旦构造函数完成，就会通过回调发射事件，这提供了用户预期的结果：\n\n```javascript\n\
    const EventEmitter = require('events');\nconst util = require('util');\nfunction\
    \ MyEmitter() {\n  EventEmitter.call(this);\n  // 使用 nextTick 在分配处理程序时发射事件\n \
    \ process.nextTick(() => {\n    this.emit('event');\n  });\n}\nutil.inherits(MyEmitter,\
    \ EventEmitter);\nconst myEmitter = new MyEmitter();\nmyEmitter.on('event', ()\
    \ => {\n  console.log('an event occurred!');\n});\n```\n\n# 第七章：Node.js Buffers\n\
    \n虽然纯 JavaScript 擅长处理使用 Unicode 编码的字符串，但在处理原始二进制数据时并不理想。在浏览器中，大多数数据都是字符串格式的，所以这没问题；但对于\
    \ Node.js 服务器来说，情况不同。它们还需要处理 TCP 流，并且需要读取和写入文件系统。这两者意味着我们还需要处理二进制数据流。\n\n 处理这种问题的方法一种是使用字符串，Node.js\
    \ 过去就是这样做。然而，这是一个棘手的方法——不仅速度慢，而且意味着你操作的是字符串的 API 而不是二进制数据。而且它们似乎非常容易以非常奇怪的方式崩溃。\n\
    \n那么，你用什么来代替二进制字符串呢？一个 buffer。\n\n## 什么是 Buffers？\n\n在 Node.js 中，`Buffer` 类用于处理原始二进制数据。每个\
    \ buffer 都对应于在 V8 外部分配的原始内存。Buffer 的作用方式与整数数组非常相似，但它们不能调整大小，并且包含了许多专门为处理二进制数据而设计的方法。在\
    \ buffer 中，整数表示字节，每个 buffer 对应一个字节，这意味着它们的值限制在 0 到 255 之间（包含边界）。当你使用 `console.log()`\
    \ 打印 `Buffer` 实例时，结果是一个充满十六进制值的链。\n\n通常，看到 buffer 的上下文是来自流的二进制数据，例如 `fs.createReadStream`。\n\
    \n## 创建 Buffers\n\n有几种种方法可以创建 buffer：\n\n```javascript\nvar buffer = Buffer.alloc(8);\n\
    // 这将打印 8 字节零\n// <Buffer 00 00 00 00 00 00 00 00>\n```\n\n通过这种方式，buffer 被初始化并包含八个零字节。\n\
    \n```javascript\nvar buffer = Buffer.from([ 8, 6, 7, 5, 3, 0, 9]);\n// 这将打印 8\
    \ 字节特定值\n// <Buffer 08 06 07 05 03 00 09>\n```\n\n通过这种方式，buffer 初始化为数组内容。请记住数组内容是表示字节的整数。\n\
    \n```javascript\nvar buffer = Buffer.from(\"I'm a string!\", \"utf-8\");\n// 这将打印一个\
    \ utf-8 的值链\n// <Buffer 49 27 6d 20 61 20 73 74 72 69 6e 67 21>\n```\n\n在第三种方法中，buffer\
    \ 被初始化为二进制编码。这是第二个参数指定的第一个字符串——`utf-8`。这是 Node.js 中常见的编码方法之一。\n\n## 写入 Buffers\n\
    \n假定我们已经创建了一个 buffer：\n\n```javascript\nvar buffer = Buffer.alloc(16)\n```\n\n\
    可以将字符串写入其中：\n\n```javascript\nbuffer.write(\"Hello\", \"utf-8\")\n```\n\n`Buffer.write()`\
    \ 的第一个参数是需要写入 buffer 的字符串，而第二个参数是字符串编码。因为默认是 `utf-8`，所以该参数是无关的。\n\n我们从 `buffer.write()`\
    \ 得到了结果 `5`，这意味着前五个字节已写入 buffer。字符串“Hello,” 恰好也是五个字符这纯属巧合，因为每个字符恰好是 8 位。当你想要完成消息的写入时，这是一个有用信息：\n\
    \n```javascript\nbuffer.write(\" world!\", 5, \"utf-8\")\n```\n\n当 `buffer.write()`\
    \ 有三个参数时，第二个参数指示偏移量，即从 buffer 索引开始写入。\n\n## 从 Buffers 读取：toString:\n\n读取 buffer\
    \ 的常用方法是使用 `toString()` 方法，因为绝大多数 buffer 都包含文本：\n\n```javascript\nbuffer.toString('utf-8')\n\
    'Hello world!\\u0000k\\t'\n```\n\n再次，初始参数是编码，在这里我们可以看到并非 buffer 都被使用了。然而，由于我们恰好知道数量。\n\
    \n"
- fmt: "\n## Efficiency\n\n1. **Memory efficiency**: There is no need for large amounts\
    \ of data to be loaded in memory before it is processed.\n2. **Time efficiency**:\
    \ When you can process data the minute you have it, rather than waiting for it\
    \ to be transferred, it is significantly quicker.\n\nNode.js has four types of\
    \ streams:\n\n1. `Writable`: these are streams we can write data to. For example,\
    \ we can use streams to write data to files using `fs.createWriteStream()`.\n\
    2. `Readable`: these are streams we can read data from. For example, we can read\
    \ a file’s contents using `fs.createReadStream()`.\n3. `Duplex`: these are streams\
    \ we can both read from and write to. A good example of this is `net.Socket`.\n\
    4. `Transform`: these are streams that can transform or modify data at the time\
    \ we read and write it. For example, compressed data can be written with `file-compression`,\
    \ and decompressed data can be read to and from files.\n\nIf you have experience\
    \ with `Node.js`, no doubt you have already stumbled over streams. In an HTTP\
    \ server based on `Node.js`, for example, `response` is a `writable` stream while\
    \ `request` is a `readable` one. If you have used the `fs` module, you’ve worked\
    \ with readable and writable streams. When you use `Express`, you are interacting\
    \ with a client using streams. And, because of `TLS` stacks, `TCP` stocks and\
    \ other `Node.js`-based connections, you are also working with streams in every\
    \ database connection driver you use.\n\n## Practical Example\n\nTo create a readable\
    \ stream, we require `Readable` stream and it needs to be initialized.\n\n```javascript\n\
    const Stream = require('stream')\nconst readableStream = new Stream.Readable()\n\
    ```\n\nOnce the stream is initialized, data can be sent to it:\n\n```javascript\n\
    readableStream.push('ping!')\nreadableStream.push('pong!')\n```\n\n### Async Iterator\n\
    \nThe `async iterator` should be used when you are working with streams. Asynchronous\
    \ iteration is a protocol used to asynchronously retrieve what is in a data container\
    \ – this means the current task can be stopped before the item is retrieved. It\
    \ is also important to keep in mind that when you implement the stream `async\
    \ iterator`, it uses its internal readable event.\n\nThe async iterator can be\
    \ used to read from a readable stream:\n\n```javascript\nimport * as fs from 'fs';\n\
    async function logChunks(readable) {\n  for await (const chunk of readable) {\n\
    \    console.log(chunk);\n  }\n}\nconst readable = fs.createReadStream('tmp/test.txt',\
    \ {encoding: 'utf8'});\nlogChunks(readable);\n// Output:\n// 'This is a test!\\\
    n'\n```\n\nThe contents of a readable string can also be collected in a string:\n\
    \n```javascript\nimport {Readable} from 'stream';\nasync function readableToString2(readable)\
    \ {\n  let result = '' ;\n  for await (const chunk of readable) {\n    result\
    \ += chunk;\n  }\n  return result;\n}\nconst readable = Readable.from('Good morning!',\
    \ {encoding: 'utf8'});\nassert.equal(await readableToString2(readable), 'Good\
    \ morning!');\n```\n\nIn this case, we used an `async` function because we wanted\
    \ a `promise` returned. You should also remember that `async` functions must not\
    \ be mixed with `EventEmitter`. There isn’t any way for rejections to be caught\
    \ when emitted in event handlers, which means memory leaks and bugs are hard to\
    \ track. Currently, the best practice is to wrap an `async` function’s content\
    \ in a `try…catch` block and handle the errors.\n\n### Readable.from(): How to\
    \ Create a Readable Stream from Iterables\n\n`stream.Readable.from(iterable, [options])`\
    \ is a utility method used to create readable streams from iterators, where `iterable`\
    \ is used to hold the data. `Options` is an optional parameter, and you can use\
    \ it to specify text encoding, among other things:\n\n```javascript\nconst { Readable\
    \ } = require('stream');\nasync function * generate() {\n  yield 'hello';\n  yield\
    \ 'streams';\n}\nconst readable = Readable.from(generate());\nreadable.on('data',\
    \ (chunk) => {\n  console.log(chunk);\n});\n```\n\n## Two Reading Modes\n\nThe\
    \ `Streams` API tells us that readable streams can operate in two different modes\
    \ – paused and flowing. And `Readable` streams can be in or out of object mode,\
    \ whether it is in paused or flowing mode.\n\n- **Flowing mode** – data gets read\
    \ automatically from the underlying system. It is given to an application quickly,\
    \ and this is one with events and the `EventEmitter` interface.\n- **Paused mode**\
    \ – for data chunks to be read off the stream, the `stream.read()` method needs\
    \ to be explicitly called.\n\nWe can listen to data events and attach callbacks\
    \ in flowing mode if we want data read from a stream. When data becomes available,\
    \ a `data` event is emitted by the readable stream, and the callback is executed.\
    \ Here’s an example:\n\n```javascript\nvar fs = require(\"fs\");\nvar data = '';\n\
    var readerStream = fs.createReadStream('file.txt'); //Create a readable stream\n\
    readerStream.setEncoding('UTF8'); // Set the encoding to utf8\n// Handle stream\
    \ events --> data, end, and error\nreaderStream.on('data', function(chunk) {\n\
    \  data += chunk;\n});\nreaderStream.on('end',function() {\n  console.log(data);\n\
    });\nreaderStream.on('error', function(err) {\n  console.log(err.stack);\n});\n\
    console.log(\"Program Ended\");\n```\n\n`fs.createReadStream()` is a function\
    \ call that provides a readable stream. To start with, the stream will be in a\
    \ static state, but it starts flowing when a `data` event is listened to and a\
    \ callback attached. Once that happens, data chunks get read and then passed into\
    \ the callback. It is down to the stream implementer to determine how often data\
    \ events get emitted. For example, `HTTP` requests might emit the `data` event\
    \ when a few KBs of data of been read. If your data is coming from files, you\
    \ could opt to have the `data` event emit after each line is read.\n\nWhen all\
    \ the data is read, an `end` event is emitted by the stream. In the code above,\
    \ the event was listened to so we know when the end was reached. And, if an error\
    \ is detected, it is emitted and notified by the stream.\n\nIn paused mode, `read()`\
    \ must be repeatedly called on the stream instance until all the data chunks are\
    \ read. Here’s an example:\n\n```javascript\nvar fs = require('fs');\nvar readableStream\
    \ = fs.createReadStream('file.txt');\nvar data = '';\nvar chunk;\nreadableStream.on('readable',\
    \ function() {\n  while ((chunk=readableStream.read()) != null) {\n    data +=\
    \ chunk;\n  }\n});\nreadableStream.on('end', function() {\n  console.log(data);\n\
    });\n```\n\nThe internal buffer is where the `read()` function reads its data\
    \ from and returns it. If there isn’t anything to read, `null` is returned. We\
    \ check the while loop for `null`, and then the loop is terminated. Readable events\
    \ are only emitted when data chunks can be read from the stream. Every `Readable`\
    \ stream starts in paused mode but can be changed to flowing in one of these ways:\n\
    \n- Add a `data` event handler\n- Call the method, `stream.resume()`\n- Call the\
    \ method, `stream.pipe()`, which sends data into a `Writable`\n\nAnd `Readables`\
    \ can change from flowing to paused in one of these ways:\n\n- The `stream.pause()`\
    \ method can be called if no pipe destinations exist\n- All existing pipe destinations\
    \ can be removed if there are several, the `stream.unpipe()` method can be called.\n"
