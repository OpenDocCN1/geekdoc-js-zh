    callbacks for system operations like TCP error types. For example, if ECONNREFUSED
    is received by a TCP socket during an attempt to connect, the error may not be
    reported immediately by some *nix systems. Instead, it gets queued in the pending
    callbacks phase, waiting for execution.This phase executes callbacks for some
    system operations, such as types of TCP errors. For example, if a TCP socket receives ECONNREFUSED
     when attempting to connect, some *nix systems want to wait to report the error.
    This will be queued to execute in the pending callbacks  phase.PollThere are two
    main functions to the poll phase:


    *   To calculate the length of time to block and poll for I/O


    *   Process poll queue events


    When the event loop goes into the poll phase, if no timers have been scheduled,
    one of the two things below can happen:


    1.  If the queue isn’t empty, the loop iterates through the callback queue, asynchronously
    executing them until the hard limit is reached, or the queue is empty


    2.  If the queue is empty, one of two things can happen:'
