    # insert the build tool you want> zip -r ../RandomQuotes.1.0.zip .# ../RandomQuotes.1.0.zip
    created (5.2 MB)The zip file that gets generated could then be extracted onto
    your production servers and the application would be ready to run as it is.  However,
    here we have zipped the entire application directory and most of this is the libraries
    needed to compile and debug the application. The typescript compilers are not
    really needed, neither are the testing frameworks or webpack libraries, once the
    application has been fully built and is ready to put into production. The big
    question is, how do we keep the production and dev-time dependencies separate?Running
    the following npm removes all the packages specified in the package.json devDependencies
    section from node_modules:npm prune --productionIt is recommended that you run
    this before your entire application is zipped into  an archive file, no matter
    whether you use a manual process or a deployment tool such as VSTS, Octopus Deploy,
    or Chef.We can make the entire process simpler by using octojs. This is Node.js
    cli tool released by Octopus Deploy and helps us create the zip or tar.gz files
    without needing to do that prune step first. By default, the package name gets
    generated with the same name and same version as you have in the package.json
    file for your project. However, all of those values can be overridden. You can
    use octojs in two ways – imported and then used as part of your application’s
    build process or through the console.Package Using the Command-LineThe easiest
    way is globally installing the tool:> npm install -g @octopusdeploy/octojsNow,
    you can invoke octojs from inside any project and get it to package your application.
    Let’s assume that we built our project and tested it; we can now package it in
    this simple way:> octojs pack -O C:\Bin --gitignore --dependencies prodCreated
    package C:\Bin\RandomQuotes.1.0.0.zip (1.66 MB)The generated package size is significantly
    smaller and the ID and version for the package come from the project. Now the
    package is generated, it can be pushed straight to the built-in Octopus Deploy
    feed so it can be deployed:> octojs push --package C:\Bin\ramdomquotes.1.0.0.zip
    --server http://octopusserver.acme.com --apiKey API-F2K29BA08AA123Push response
    201 - CreatedPackage Using the CodeAn alternative way is to package your project
    and push it through your code by one step, using the same library:var octo = require("@octopusdeploy/octojs");octo.pack({dependencies:
    ''prod'', bypassDisk: true, root: "."},(err, data) => {console.log("Uploading
    package: "+ data.name);octo.push(data.stream, {apiKey: ''API-F2K29BA08AA123 '',server:
    ''http://octopusserver.acme.com'',name: data.name}, () => console.log("Uploaded"));}}).append(''hello.txt'',
    new Buffer(''This Is An Additional File'')).finalize(true);You can find the [octojs
    library on GitHub](https://github.com/OctopusDeploy/octojs) as an open source
    package, along with both [grunt](https://github.com/OctopusDeploy/grunt-octo)
    and [gulp](https://github.com/OctopusDeploy/gulp-octo) versions to help your get
    your project packaged during the building process.Node is a Serious LanguageAnd
    it’s time we started treating it as such in our CD pipelines. What this means
    is that dependencies can be downloaded and built or transpiled on the build server
    once and the result packaged with its dependencies into one self-contained package
    for deployment.You can use the Octopus JS libraries to help you with this but,
    at the end of the day, it really doesn’t matter how the application is built and
    packaged, what tool you use to do it with; all that really matters is that it
    is only built once and then deployed across each environment.Chapter Seventeen:
    MongoDB + Mongoose with Node.js – Best Practices for Back End DevelopersMongoDB
    has to be one of the most popular of all NOSQL databases and it is backed up with
    a fantastic ecosystem and a great community. This chapter will cover some of the
    best practices to follow when you use MongoDB and Mongoose with your Node.js applications:Why
    You Need MongooseUnderstanding Mongoose requires that we understand the way MongoDB
    and databases work at an architectural level.Let’s say you have:


    1.  A database server, i.e. a MongoDB community server


    2.  A running Node.js script as a process'
