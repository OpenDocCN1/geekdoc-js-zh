    # Net Module

    The `net` module provides clients and serves as streams and also provides an asynchronous
    wrapper to go around the network. The following syntax is used to import it:


    ```javascript

    var net = require("net")

    ```


    ## Net Module Methods

    These are the methods in the `net` module:


    | METHODS | DESCRIPTION |

    | :--- | :--- |

    | `net.createServer([options][, connectionListener])` | Creates a TCP server and
    the argument (`connectionListener`) is set automatically as the connection event
    listener |

    | `net.connect(options[, connectionListener])` | This is a factory method, returning
    a `net.Socket` and connecting to the address and port supplied |

    | `net.createConnection(options[, connectionListener])` | Same as above |

    | `net.connect(port[, host][, connectListener])` | Creates a TCP connection to
    the port on the host. If there is no host, it defaults to localhost. The argument,
    `connectListener`, is added as the connect event listener and, like the previous
    two methods, it also returns a `net.Socket`. |

    | `net.connect(path[, connectListener])` | Creates a Unix socket connection to
    the path. The argument, `connectListener`, is added as the connect event listener
    and, like the previous methods, it also returns a `net.Socket`. |

    | `net.createConnection(path[, connectListener])` | As above |

    | `net.isIP(input)` | Tests to see if the `input` is an IP address and returns
    0 if the string is invalid, 4 if it is an IP v4 address and 6 if it is an IP v6
    address |

    | `net.isIPv4(input)` | Will return true if the `input` is an IP v4 address, false
    if otherwise |

    | `net.isIPv6(input)` | Will return true if the `input` is an IP v6 address, false
    if otherwise |


    ## Class - net.Server

    The `net.Server` class is used for creating local or TCP servers.


    ### net.Server Methods

    These are the methods that go with this class:


    | METHODS | DESCRIPTION |

    | :--- | :--- |

    | `server.listen(port[, host][, backlog][, callback])` | Allows you to start accepting
    connections on a given port and host. If there is no host specified, connections
    will be accepted by the server if they are directed to IPv4 addresses (INADDR_ANY).
    If the port number is missing, a random port is assigned. |

    | `server.listen(path[, callback])` | Starts a local socket server that listens
    on a given path for connections |

    | `server.listen(handle[, callback])` | You can set the handle object as a socket
    or server so long as it has an `{fd: <n>}` object or an underlying `_handle` member.
    The server is forced to accept connections on the given handle but it is assumed
    that the handle or file descriptor is bound to a domain socket or port. Windows
    does not support listening on file descriptors. |

    | `server.listen(options[, callback])` | In this method, the host, port, option
    properties backlog and callback function (optional) behave in the same way as
    they do on a `server.listen(port, [host], [backlog], [callback])` call. You can
    also use the `path` option to specify UNIX sockets. |

    | `server.close([callback])` | This is closed when there are no more open connections
    and a close event is emitted by the server |

    | `server.address()` | This method will return the bound address, the server port
    and the address family name that the operating system reports |

    | `server.unref()` | When you call `unref` on the server, the program can exit
    if the event system has no other active server. Calling `unref` will have no effect
    if the server is unrefd. |

    | `server.ref()` | The opposite of above – if you call `ref` on a server that
    was previously unrefd, the program cannot exit if it is the sole remaining server.
    Where the server is refd, it will have no effect if you call ref again. |

    | `server.getConnections(callback)` | Obtain the number of concurrent connections
    asynchronously. This works with sockets that are sent to forks and callback needs
    two parameters – err and count |


    ### Events

    These events go with the above method:


    | EVENT | DESCRIPTION |

    | :--- | :--- |

    | `listening` | This event is emitted once the server is bound when `server.listen`
    is called |

    | `connection` | Emitted once a new connection has been made. The connection object,
    socket object, can be accessed by the event handler and socket is a `net.Socket`
    instance. |

    | `close` | Emitted once the server is closed. If there are existing connections,
    this cannot be emitted until they are all closed |

    | `error` | Emitted when an error has occurred. Immediately after this event,
    the close event is called. |


    ## Class - net.Socket

    This is a local or TCP socket abstraction and instances of `net.Socket` are used
    for implementing duplex Stream interfaces. The user can create them and they can
    be used with `connect()`.


    ### net.Socket Events

    These are the events emitted by `net.Socket`:


    | EVENT | DESCRIPTION |

    | :--- | :--- |

    | `lookup` | This event is emitted once the hostname is resolved but before the
    connection. This does not apply to UNIX sockets |

    | `connect` | Emitted after a socket connection has been established |

    | `data` | Emitted any time data gets received. String or Buffer are used for
    the argument data and `socket.setEncoding()` is used to set the data encoding
    |

    | `end` | Emitted when an FIN packet is sent by the other end |

    | `timeout` | Emitted when inactivity causes the socket to timeout. It is purely
    to tell you that the socket is idle and the connection must be manually closed
    |

    | `drain` | Emitted after the write buffer empties and can be used for throttling
    uploads |

    | `error` | Emitted after an error has occurred and is followed immediately by
    the `close` event |

    | `close` | Emitted only when the socket has closed. It takes an argument of `had_error`,
    a Boolean that tells you if a transmission error causes the socket to close. |


    ### net.Socket Properties

    These are the properties `net.Socket` uses to control the socket interactions:


    | PROPERTIES | DESCRIPTION |

    | :--- | :--- |

    | `socket.bufferSize` | Indicates how many buffered characters are waiting to
    be written |

    | `socket.remoteAddress` | Remote IP address in a string representation. |

    | `socket.remoteFamily` | Remote IP family in string representation, either IPv4
    or IPv6 |

    | `socket.remotePort` | Numerically represents the remote port |

    | `socket.localAddress` | Represents the local IP address being connected to by
    the remote client and is a string representation. I.e. if you listen on 0.0.0.0
    and a remote client uses 192.168.1.1 to connect on, 192.168.1.1 is the value |

    | `socket.localPort` | Numerically represents the local port |

    | `socket.bytesRead` | Indicates how many bytes were received |

    | `socket.bytesWritten` | Indicates the how many bytes were sent |


    ### net.Socket Methods

    And these are the `net.Socket` methods:


    | METHODS | DESCRIPTION |

    | :--- | :--- |

    | `new net.Socket([options])` | This method is used to construct new socket objects
    |

    | `socket.connect(port[, host][, connectListener])` | Used to open a connection
    for a specified socket. If the host and port are provided, the socket opens as
    TCP but, if host is not provided, it will be assumed as localhost. If the path
    is provided, the socket opens to the path as a UNIX socket |

