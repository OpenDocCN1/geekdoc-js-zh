  trans: "\n\n# Socket 方法\n\n| `socket.connect(path[, connectListener])` | 用于为指定的\
    \ socket 打开连接。如果提供了主机和端口，则 socket 将以 TCP 方式打开；但如果没有提供主机，则默认为 localhost。如果提供了路径，则\
    \ socket 将作为 UNIX socket 打开到该路径 |\n| `socket.setEncoding([encoding])` | 用于将 socket\
    \ 编码设置为可读流（Readable Stream） |\n| `socket.write(data[, encoding][, callback])`\
    \ | 用于在 socket 上发送数据。如果它是字符串，则第二个参数用于指定编码——默认为 UTF8 |\n| `socket.end([data][,\
    \ encoding])` | 用于发送一个 FIN 包，这会半关闭 socket。服务器可能仍然能够发送数据。 |\n| `socket.destroy()`\
    \ | 用于确保 socket 上不会发生 I/O 活动。这仅在发生错误时（例如解析错误等）才是必要的。 |\n| `socket.pause()` | 用于暂停数据读取，这意味着数据事件将停止触发。这在你想要限制上传速度时非常有用。\
    \ |\n| `socket.resume()` | 在调用 `pause` 方法后恢复数据读取 |\n| `socket.setTimeout(timeout[,\
    \ callback])` | 用于设置 socket，使其在 socket 上空闲指定的毫秒数时间后超时。默认情况下，`net.socket` 没有超时设置。\
    \ |\n| `socket.setNoDelay([noDelay])` | 用于禁用 Nagle 算法。TCP 连接默认使用该算法，在发送数据之前会对其进行缓存。如果\
    \ `noDelay` 设置为 true，则在调用 `socket.write()` 时会立即发送数据。默认情况下，`noDelay` 设置为 true。\
    \ |\n| `socket.setKeepAlive([enable][, initialDelay])` | 有助于启用或禁用心跳检测（keep-alive）功能。可选，它还可以设置空闲\
    \ socket 发送初始心跳探针之前的延迟。默认情况下，`enable` 设置为 false。 |\n| `socket.address()` | 返回操作系统报告的地址族名称、绑定的地址和\
    \ socket 端口。返回一个包含三个属性的对象，即 `{port 23467, family: ‘IPv6’, address: ‘128.0.1.1’}`\
    \ |\n| `socket.unref()` | 当你在 socket 上调用 `unref` 时，如果事件系统没有其他活动 socket，程序可以退出。如果\
    \ socket 已经是 unref 状态，调用 `unref` 将没有影响。 |\n| `socket.ref()` | 与上述相反——如果你对之前是 unrefd\
    \ 的 socket 调用 `ref`，且由于它是唯一剩余的 socket，则程序无法退出。如果 socket 已经是 refd 状态，再次调用 `ref`\
    \ 将没有影响。 |\n\n这里是这些方法的使用示例。首先，创建一个新文件并命名为 `server.js`。然后输入以下内容：\n\n```javascript\n\
    var net = require('net');\nvar server = net.createServer(function(connection)\
    \ {\n  console.log('client connected');\n  connection.on('end', function() {\n\
    \    console.log('client disconnected');\n  });\n  connection.write('Hello World!\\\
    r\\n');\n  connection.pipe(connection);\n});\nserver.listen(8080, function() {\n\
    \  console.log('server is listening');\n});\n```\n\n现在运行它并查看输出：\n`$ node server.js`\n\
    \n验证输出。\n`server is listening`\n\n接下来，创建另一个名为 `client.js` 的新文件并输入此代码：\n\n文件：`client.js`\n\
    ```javascript\nvar net = require('net');\nvar client = net.connect({port: 8080},\
    \ function() {\n  console.log('connected to server!');\n});\nclient.on('data',\
    \ function(data) {\n  console.log(data.toString());\n  client.end();\n});\nclient.on('end',\
    \ function() {\n  console.log('disconnected from server');\n});\n```\n\n现在尝试从不同的终端运行此文件并查看输出：\n\
    `$ node client.js`\n\n验证输出。\n`connected to server!`\n`Hello World!`\n`disconnected\
    \ from server`\n\n最后，在运行 `server.js` 文件的终端上验证输出：\n`server is listening`\n`client\
    \ connected`\n`client disconnected`\n\n# DNS 模块\n\nDNS 模块包含了允许我们进行 DNS 查询并使用操作系统底层的名称解析功能的函数。它为网络提供了一个异步封装器，导入它需要以下语法：\n\
    \n```javascript\nvar dns = require(\"dns\")\n```\n\n## DNS 模块方法\n\n这些是来自 DNS 模块的方法：\n\
    \n| 方法 | 描述 |\n| `dns.lookup(hostname[, options], callback)` | 此方法用于将主机名解析为第一个\
    \ IPv4 (A) 或 IPv6 (AAAA) 记录。options 参数可以是整数或对象，但如果没有提供，则 IPv4 和 IPv6 地址都是有效的。如果它设置为整数，则为\
    \ 4 或 6。 |\n| `dns.lookupService(address, port, callback)` | 使用 `getnameinfo`\
    \ 将指定的端口和地址解析为服务和主机名。 |\n| `dns.resolve(hostname[, rrtype], callback)` | 用于将主机名解析为包含\
    \ `rrtype` 指定记录类型的数组。 |\n| `dns.resolve4(hostname, callback)` | 与上述相同，但仅针对 IPv4\
    \ A 记录查询。 |\n| `dns.resolve6(hostname, callback)` | 与上述相同，但针对 IPv6 AAAA 记录查询。\
    \ |\n| `dns.resolveMx(hostname, callback)` | 与上述相同，但针对 MX 记录或邮件交换查询。 |\n| `dns.resolveTxt(hostname,\
    \ callback)` | 与上述相同，但针对 TXT 记录或文本查询。 |\n| `dns.resolveSrv(hostname, callback)`\
    \ | 与上述相同，但针对 SRV 记录或服务查询。 |\n| `dns.resolveSoa(hostname, callback)` | 与上述相同，但针对\
    \ SOA 记录或区域起始查询。 |\n| `dns.resolveNs(hostname, callback)` | 与上述相同，但仅针对 NS 记录或名称服务器查询。\
    \ |\n| `dns.resolveCname(hostname, callback)` | 与上述相同，但仅针对 CNAME 记录或别名。 |\n| `dns.reverse(ip,\
    \ callback)` | 反向解析 IP 地址为主机名数组。 |\n| `dns.getServers()` | 用于返回当前用于解析的 IP 地址数组。\
    \ |\n| `dns.setServers(servers)` | 用于将给定的字符串格式 IP 地址数组设置为解析所需的服务器。 |\n\n## DNS\
    \ 模块 rrtypes\n\n这些是 `dns.resolve()` 方法使用的有效 rrtypes：\n\n*   `A` - 默认值，IPv4 地址\n\
    *   `AAAA` – IPv6 地址\n*   `MX` – 这些是邮件交换记录\n*   `SRV` – 这些是 SRV 记录\n*   `TXT`\
    \ – 这些是文本记录\n*   `PTR` – 这用于进行反向 IP 查询\n*   `CNAME` – 这些是别名记录\n*   `NS` – 这些是名称服务器记录\n\
    *   `SOA` – 这些是区域起始记录\n\n"
- fmt: "\n# DNS Module Error Codes\n\nAll of the DNS queries may return one of these\
    \ codes:\n\n- `dns.NODATA` – no data was returned with the DNS server answer\n\
    - `dns.FORMERR` – according to the DNS server, the query has been misformatted.\n\
    - `dns.SERVFAIL` – a general failure was returned by the DNS server\n- `dns.NOTFOUND`\
    \ – Domain name was not found.\n- `dns.NOTIMP` – DNS server hasn’t implemented\
    \ the requested operation.\n- `dns.REFUSED` – DNS server has refused the query.\n\
    - `dns.BADQUERY` – the DNS query is misformatted\n- `dns.BADNAME` – the hostname\
    \ is misformatted\n- `dns.BADFAMILY` – the address family is unsupported\n- `dns.BADRESP`\
    \ – the DNS reply is misformatted\n- `dns.CONNREFUSED` – the DNS servers could\
    \ not be contacted\n- `dns.TIMEOUT` – DNS server contact timed out\n- `dns.EOF`\
    \ – End of file.\n- `dns.FILE` – there was an error reading the file.\n- `dns.NOMEM`\
    \ – Out of memory.\n- `dns.DESTRUCTION` – The channel is being destroyed.\n- `dns.BADSTR`\
    \ – the string is misformatted.\n- `dns.BADFLAGS` – the specified flags are illegal.\n\
    - `dns.NONAME` – the specified hostname is not numeric.\n- `dns.BADHINTS` – the\
    \ illegal hints flags was specified.\n- `dns.NOTINITIALIZED` – c-ares library\
    \ initialization has not yet been performed.\n- `dns.LOADIPHLPAPI` – error loading\
    \ the `iphlpapi.dll`.\n- `dns.ADDRGETNETWORKPARAMS` – the `GetNetworkParams` function\
    \ was not found.\n- `dns.CANCELLED` – DNS query was cancelled.\n\n# Domain Module\n\
    \nThe `Domain` module is a utility used to help handle several I/O operations\
    \ as one group. If these were not handled, the Node application would just crash.\n\
    \n### Internal Binding\nThe error emitter executes the code in the `domain`’s\
    \ context. The syntax below creates it:\n\n```javascript\nvar domain = require(\"\
    domain\");\nvar child = domain.create();\ndomain.on('error', function (err) {\n\
    \    if (err) {\n        console.log('reverse for ' + address + ': ' + JSON.stringify(hostnames));\n\
    \    }\n});\ndns.lookup('www.com', function onLookup(err, address) {\n    console.log('address:',\
    \ address);\n});\n```\n\nRun the file to see what the output is:\n```bash\n$ node\
    \ main.js\n```\nAnd finally, verify the output:\nlistener handled this error (To\
    \ be handled by listener)\ndomain1 handled this error (To be handled by domain1)\n\
    domain2 handled this error (To be handled by domain2)\nevents.js:72 throw er;\
    \ // Unhandled 'error' event\nError: Converted to exception. System will crash!\n\
    at Object. (/web/com/142772220_30772/main.js:40:24)\nat Module._compile (module.js:456:26)\n\
    at Object.Module._extensions..js (module.js:474:10)\nat Module.load (module.js:356:32)\n\
    at Function.Module._load (module.js:312:12)\nat Function.Module.runMain (module.js:497:10)\n\
    at startup (node.js:119:16)\nat node.js:906:3\n\n### External Binding\nThe error\
    \ emitter uses its own method to be explicitly added to the domain. The following\
    \ syntax is used to import the module:\n\n```javascript\nvar EventEmitter = require(\"\
    events\").EventEmitter;\nvar domain = require(\"domain\");\nvar emitter1 = new\
    \ EventEmitter();\n// Create a domain\nvar domain1 = domain.create();\ndomain1.on('error',\
    \ function(err) {\n    console.log(\"domain1 handled this error (\"+err.message+\"\
    )\");\n});\n// Explicit binding\ndomain1.add(emitter1);\nemitter1.on('error',function(err)\
    \ {\n    console.log(\"listener handled this error (\"+err.message+\")\");\n});\n\
    emitter1.emit('error',new Error('To be handled by listener'));\nemitter1.removeAllListeners('error');\n\
    emitter1.emit('error',new Error('To be handled by domain1'));\n\nvar domain2 =\
    \ domain.create();\ndomain2.on('error', function(err) {\n    console.log(\"domain2\
    \ handled this error (\"+err.message+\")\");\n});\n// Implicit binding\ndomain2.run(function()\
    \ {\n    var emitter2 = new EventEmitter();\n    emitter2.emit('error',new Error('To\
    \ be handled by domain2'));\n});\ndomain1.remove(emitter1);\nemitter1.emit('error',\
    \ new Error('Converted to exception. System will crash!'));\n```\n\n### Domain\
    \ Methods\n\n| METHODS | DESCRIPTION |\n| :--- | :--- |\n| `domain.run(function)`\
    \ | This method runs the specified function in the `domain` context. It binds\
    \ all timers, low level requests implicitly. This is the basic way domains are\
    \ used. |\n| `domain.add(emitter)` | Adds emitters to the domain explicitly. If\
    \ any of the event handlers throws an error or an error is emitted by the emitter,\
    \ it gets sent to the error event for the domain. |\n| `domain.remove(emitter)`\
    \ | The opposite of above, the domain is removed from the given emitter. |\n|\
    \ `domain.bind(callback)` | The function that gets returned is a wrapper around\
    \ the `callback` function. When function is called, thrown errors get sent to\
    \ the error event in the `domain`. |\n| `domain.intercept(callback)` | Almost\
    \ the same as `domain.bind(callback)` but as well it intercepts any error message\
    \ that gets sent to the function as the first argument. |\n| `domain.enter()`\
    \ | Used by `bind`, `run` and `intercept` methods and helps set `process.domain`\
    \ and `active` to the domain and pushes that domain implicitly onto the domain\
    \ stack. The call to this method delimits the start of the call chain and I/O\
    \ operations bound to specific domains. |\n| `domain.exit()` | This method will\
    \ pop the current domain off the stack and exit it. When execution is switched\
    \ to the context of another asynchronous call, the current domain must be exited.\
    \ The call to exit will delimit an interruption to or the end of the call chain.\
    \ |\n| `domain.dispose()` | When this method is called, the `domain` cannot be\
    \ used by any callback that is bound into the domain using `intercept`, `bind`\
    \ or `run` and a `dispose` event gets emitted. |\n\n### Domain Properties\n\n\
    There is one primary domain property called `domain.members`. It is an array containing\
    \ event emitters and timers added to the domain explicitly.\n\n# Chapter Twelve:\
    \ Node.js Web Module\n\nWeb servers are software applications; it’s as simple\
    \ as that. They handle HTTP requests that the HTTP client sends them – that could\
    \ be a web browser – and they respond by returning a web page. Typically, web\
    \ servers will deliver HTML documents with style sheets, images and scripts.\n\
    \nMost web servers have support for server-side scripts, and they do this using\
    \ a scripting language or sending the task elsewhere, usually to application servers\
    \ that retrieve data out of databases and perform some complex logic. Then, the\
    \ result is sent through the webserver to the HTTP client. One of the most common\
    \ is an open-source project called Apache webserver.\n\n## Web Application Architecture\n\
    \nUsually, web applications are split into four separate layers, as you can see\
    \ in the diagram below:\n\n![Web Architecture](Image00016.jpg)\n\nLet’s break\
    \ this diagram down:\n\n- **Client** – The client layer is made up of applications,\
    \ mobile browsers, or web browsers that can make and send the web server HTTP\
    \ requests.\n"
  raw: 'DNS Module Error CodesAll of the DNS queries may return one of these codes:•                    
    dns.NODATA – no data was returned with the DNS server answer•                    
    dns.FORMERR – according to the DNS server, the query has been misformatted.•                    
    dns.SERVFAIL – a general failure was returned by the DNS server•                    
    dns.NOTFOUND − Domain name was not found.•                     dns.NOTIMP − DNS
    server hasn’t implemented the requested operation.•                     dns.REFUSED
    − DNS server has refused the query.•                     dns.BADQUERY – the DNS
    query is misformatted•                     dns.BADNAME – the hostname is misformatted•                    
    dns.BADFAMILY – the address family is unsupported•                     dns.BADRESP
    – the DNS reply is misformatted•                     dns.CONNREFUSED – the DNS
    servers could not be contacted•                     dns.TIMEOUT – DNS server contact
    timed out•                     dns.EOF − End of file.•                     dns.FILE
    – there was an error reading the file.•                     dns.NOMEM − Out of
    memory.•                     dns.DESTRUCTION – The channel is being destroyed.•                    
    dns.BADSTR – the string is misformatted.•                     dns.BADFLAGS – the
    specified flags are illegal.•                     dns.NONAME – the specified hostname
    is not numeric.•                     dns.BADHINTS – the illegal hints flags was
    specified.•                     dns.NOTINITIALIZED − c-ares library initialization
    has not yet been performed.•                     dns.LOADIPHLPAPI − error loading
    the iphlpapi.dll.•                     dns.ADDRGETNETWORKPARAMS − the GetNetworkParams
    function was not found.•                     dns.CANCELLED − DNS query was cancelled.Here’s
    a live example for you. Find your main.js file and clear the contents. Then add
    the following:var dns = require(''dns'');dns.lookup(''www.google.com'', function
    onLookup(err, address, family) {console.log(''address:'', address);dns.reverse(address,
    function (err, hostnames) {if (err) {console.log(err.stack);}console.log(''reverse
    for '' + address + '': '' + JSON.stringify(hostnames));});});Run the file to see
    what the output is:$ node main.jsNow verify that output:address: 173.194.46.83reverse
    for 173.194.46.83: ["ord08s11-in-f19.1e100.net"]Domain ModuleOur last utility
    module is the Domain module, used to help us handle several I/O operations as
    one group. It intercepts unhandled errors using external or internal binding.
    If these were not handled, the Node application would just crash.•       Internal
    Binding – the error emitter executes the code in the domain’s run method•      
    External Binding – the error emitter uses its own add method to be explicitly
    added to the domain.The following syntax is used to import the module:var domain
    = require("domain")The domain module’s domain class provides the functionality
    to route uncaught exceptions and errors to the active Domain object. It is the
    EventEmitter’s child class, and its error event needs to be listened to for handling
    any caught errors. The syntax below creates it:var domain = require("domain");var
    child = domain.create();Domain Module MethodsThese are the Domain Module methods:


    | METHODS | DESCRIPTION |


    | domain.run(function) | This method runs the specified function in the domain
    context. It binds all timers, event emitter and low level requests implicitly.
    This is the basic way domains are used |


    | domain.add(emitter) | Adds emitters to the domain explicitly. If any of the
    event handlers the emitter calls throws an error or an error event is emitted
    by the emitter, it gets sent to the error event for the domain, just as it is
    with implicit binding. |


    | domain.remove(emitter) | The opposite of above, the domain handling is removed
    from the given emitter |


    | domain.bind(callback) | The function that gets returned is a wrapper around
    the callback function supplied. When that function is called, thrown errors get
    sent to the error event in the domain |


    | domain.intercept(callback) | Almost the same as domain.bind(callback) but as
    well catching errors, it intercepts any error message that gets sent to the function
    as the first argument |


    | domain.enter() | Used by the bind, run and intercept methods and helps set the
    domain. It sets process.domain and domain.active to the domain and pushes that
    domain implicitly onto the domain stack the domain module managers. The call to
    this method delimits the start of the asynchronous call chain and I/O operations
    that are bound to specific domains. |


    | domain.exit() | This method will pop the current domain off the stack and exit
    it. When execution is switched to the context of another asynchronous call chain,
    the current domain must be exited. The call to exit will delimit an interruption
    to or the end of the call chain and any I/O bound to a specific domain. |


    | domain.dispose() | When this method is called, the domain cannot be used by
    any callback that is bound into the domain using intercept, bind or run and a
    dispose event gets emitted |


    Domain Module PropertiesThere is one primary domain module property called domain.members.
    It is an array containing event emitters and timers added to the domain explicitly.Now
    for an example showing all this working. Clear your main.js file and add the following
    code:var EventEmitter = require("events").EventEmitter;var domain = require("domain");var
    emitter1 = new EventEmitter();// Create a domainvar domain1 = domain.create();domain1.on(''error'',
    function(err) {console.log("domain1 handled this error ("+err.message+")");});//
    Explicit bindingdomain1.add(emitter1);emitter1.on(''error'',function(err) {console.log("listener
    handled this error ("+err.message+")");});emitter1.emit(''error'',new Error(''To
    be handled by listener''));emitter1.removeAllListeners(''error'');emitter1.emit(''error'',new
    Error(''To be handled by domain1''));var domain2 = domain.create();domain2.on(''error'',
    function(err) {console.log("domain2 handled this error ("+err.message+")");});//
    Implicit bindingdomain2.run(function() {var emitter2 = new EventEmitter();emitter2.emit(''error'',new
    Error(''To be handled by domain2''));  });domain1.remove(emitter1);emitter1.emit(''error'',
    new Error(''Converted to exception. System will crash!''));Run the file to see
    the output:$ node main.jsAnd finally, verify the output:listener handled this
    error (To be handled by listener)domain1 handled this error (To be handled by
    domain1)domain2 handled this error (To be handled by domain2)events.js:72 throw
    er; // Unhandled ''error'' event^Error: Converted to exception. System will crash!at
    Object. (/web/com/1427722220_30772/main.js:40:24)at Module._compile (module.js:456:26)at
    Object.Module._extensions..js (module.js:474:10)at Module.load (module.js:356:32)at
    Function.Module._load (module.js:312:12)at Function.Module.runMain (module.js:497:10)at
    startup (node.js:119:16)at node.js:906:3Chapter Twelve: Node.js Web ModuleWeb
    servers are software applications; it’s as simple as that. They handle HTTP requests
    that the HTTP client sends them – that could be a web browser – and they respond
    by returning a web page. Typically, web servers will deliver HTML documents with
    style sheets. Images and scripts.Most web servers have support for server-side
    scripts, and they do this using a scripting language or sending the task elsewhere,
    usually to application servers that retrieve data out of databases and perform
    some complex logic. Then, the result is sent through the webserver to the HTTP
    client.One of the most common is an open-source project called Apache webserver.Web
    Application ArchitectureUsually, web applicationS are split into four separate
    layers, as you can see in the diagram below:![Web Architecture](Image00016.jpg)Let’s
    break this diagram down:


    *   Client  – The client layer is made up of applications, mobile browsers, or
    web browsers that can make and send the web server HTTP requests.'
