    - [参考文献](#\n\n# 简介\n\n后端开发描述了你在 Web 应用程序上进行操作时幕后发生的一切。它主要指的是应用程序的服务器端，以及前端（浏览器）与数据库之间的通信。\n\
    \nNode.js 由 Ryan Dahl 于 2009 年开发，基于 Chrome JavaScript 引擎构建。根据官方文档，Node.js 旨在使用轻量级、高效的非阻塞和事件驱动\
    \ I/O 模型来轻松构建可扩展、快速的网络应用程序。这使其非常适合运行在分布式设备上的实时、数据密集型应用程序。它是开源的。它跨平台工作，使用 JavaScript\
    \ 编写可以在 Linux、Windows 和 OSX 的 Node.js 环境中运行的应用。它提供了一个包含 JS 模块的优秀库，使开发变得简单。\n\n\
    ## Node.js 特性\n\n*   **事件驱动和异步**：所有的 Node.js API 都是异步的，即非阻塞的。这意味着 Node.js 服务器永远不会等待数据从\
    \ API 返回；它将移动到下一个调用，而事件通知机制将帮助获取之前调用的响应。\n*   **极快速**：由于它构建在 Google Chrome V8\
    \ JavaScript 引擎之上，它是代码执行最快的库之一。\n*   **单线程，可扩展**：通过使用包含事件循环的单线程模型，服务器可以以非阻塞的方式做出响应，从而具有可扩展性。单线程程序可以比\
    \ Apache HTTP 等传统服务器处理更多的请求。\n*   **无缓冲**：数据在 Node.js 应用中从不进行缓冲处理；而是以大块的形式输出。\n\
    \n## 先决条件\n你必须对 JavaScript 有基础的了解，并对其他技术（如 CSS、HTML、AJAX 等）有一定的概念。\n\n"
- fmt: '

    If you really want to get to grips with back-end JavaScript programming, you need
    to start with Node.js. so settle in and let''s dive in.


    # Chapter One: Setting Up Your Node.js Environment


    In this first chapter, it makes sense to start by setting up your Node.js environment.
    Here, I will show you the tools you need and how to do it. You can set up the
    Node.js development environment in Linux, Mac, Windows, and Solaris and, regardless
    of platform, you will need the following:


    * `Node.js`

    * `NPM` – Node Package Manager

    * `IDE` – Integrated Development Environment or you can use any compatible Text
    Editor.

    '
