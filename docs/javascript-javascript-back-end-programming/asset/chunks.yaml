  trans: "\n\n## 依赖版本控制\n\n当你的 `packages.json` 文件包含语义化版本范围（semver）时，可能会导致配置提示你某个包依赖需要匹配特定版本，例如\
    \ `4.17.2`。你的生产环境会拉取 `4.17.3`，然后使用 `4.17.4` 来运行测试。当你准备部署生产环境时，库的作者又更新了一次，导致你的软件最终运行在\
    \ `4.17.9` 版本——而这已经在生产环境中。很多时候，库作者在更新库时包含了可能会破坏生产环境的重大更改，无论他们是无意，还是没有意识到这些更改产生的影响。他们的更新提升了版本号，这可能会导致广泛的版本冲突，从而引发严重的代码崩溃。`node_modules`\
    \ 中极其复杂的依赖链进一步加剧了这种问题。\n\n假设你有一个 `Module A`，它是一个显式依赖的模块，依赖于 `Module B` 的某个版本范围。反之，`Module\
    \ B` 又依赖于另外几个模块的版本范围。不要忘记——运行 `npm install` 时，你不仅是在动态确定和解析你的模块——依赖链中的其他所有部分也是如此。只要将文件提交到源码控制，使用最近添加的\
    \ `package-lock` 功能可以在某种程度上缓解这个问题。\n\n## 部署成功并不由你控制\n\n每当你的应用被部署时，你都会下载可能未经测试的新依赖项。而且这还是在一切都按计划进行的情况下。`npm`\
    \ 不再支持向旧版本推送新文件的功能，这并不是什么新闻，但我们已经多次看到生产发布因为包没有下载成功而失败——通常是因为 `npm` 宕机或网络出现问题。通常，这种安装失败会伴随着旧版本被覆盖。其结果是，在\
    \ `npm` 恢复访问之前，服务器将一文不值。\n\n我可以告诉你一个案例：有一个开发者每当想要从他们的 `AWS Elastic Beanstalk`\
    \ 获取一个新服务器时，都会进行全新的安装，因为他们已有的服务器集群已经满载了。由于 `npm` 服务器无法用，新服务器无法上线，由于并不是所有的流量都能被处理，原本运行良好的网站突然也崩溃了——而在这之前的很多天，原始安装是成功的，且所有新服务器都\
    \ get 部署了相同的产品版本。\n\n幸运的是，有一个解决办法。\n\n## 打包你的 Node.js 应用\n\n我们应该能达成共识——所有的 JS\
    \ 应用都应该像我们对待其他任何编译语言一样——在构建阶段，应用程序应该被打包成一个可以部署的产物（artifact）。\n\n就本章而言，假设我们将开发一个名为\
    \ `RandomQuote-JS` 的虚拟应用。我们可以通过一个非常简单的构建步骤来实现：\n\n```bash\nnpm install\ngulp build\
    \    # 插入你想要的构建工具\nzip -r ../RandomQuotes.1.0.zip .\n# 创建了 ../RandomQuotes.1.0.zip\
    \ (5.2 MB)\n```\n\n生成的 `zip` 文件可以解压到你的生产服务器上，应用程序即可按原样运行。然而，在这里我们压缩了整个应用程序目录，而大部分是编译和调试应用程序所需的库。一旦应用程序已完全构建并准备投入生产环境，`typescript`\
    \ 编译器不再需要，测试框架或 `webpack` 库也是如此。现在大问题是，我们如何将生产环境依赖和开发环境依赖分开呢？\n\n运行以下 `npm` 命令可以从\
    \ `node_modules` 中移除 `package.json` 中 `devDependencies` 部分指定的所有包：\n\n```bash\n\
    npm prune --production\n```\n\n建议在整个应用程序被压缩成存档文件之前运行此命令，无论你是使用手动流程还是如 `VSTS`、`Octopus\
    \ Deploy` 或 `Chef` 等部署工具。\n\n我们可以通过 `octojs` 让整个过程变得更。这是由 `Octopus Deploy` 发布的\
    \ Node.js `cli` 工具，帮助我们创建 `zip` 或 `tar.gz` 文件，而无需预先执行 prune 步骤。默认情况下，包名将根据你项目中\
    \ `package.json` 文件中的名称和版本生成。然而，所有这些值都可以被重写。你可以通过两种方式使用 `octojs`——导入并作为应用程序构建过程的一部分，或者通过控制台。\n\
    \n### 使用命令行打包\n\n最简单的方法是全局安装工具：\n\n```bash\nnpm install -g @octopusdeploy/octojs\n\
    ```\n\n现在，你可以在任何项目内部调用 `octojs` 并让它打包你的应用程序。假设我们已经构建并测试了项目；我们现在可以用这种简单的方式进行打包：\n\
    \n```bash\noctojs pack -O C:\\Bin --gitignore --dependencies prod\n创建了包 C:\\Bin\\\
    RandomQuotes.1.0.0.zip (1.66 MB)\n```\n\n生成的包尺寸显著缩小，且包的 ID 和版本来自项目。现在包已经生成，可以直接推送到内置的\
    \ `Octopus Deploy` 馈以进行部署：\n\n```bash\noctojs push --package C:\\Bin\\ramdomquotes.1.0.0.zip\
    \ --server http://octopusserver.acme.com --apiKey API-F2K29BA08AA123\n推送响应 201\
    \ - 已创建\n```\n\n### 使用代码打包\n\n另一种方法是通过代码一步完成项目打包并推送到外部，使用同一个库：\n\n```javascript\n\
    var octo = require(\"@octopusdeploy/octojs\");\nocto.pack({dependencies: 'prod',\
    \ bypassDisk: true, root: \".\"},(err, data) => {\n  console.log(\"正在上传包:\"+ data.name);\n\
    \  octo.push(data.stream, {apiKey: 'API-F2K29BA08AA123',server: 'http://octopusserver.acme.com',name:\
    \ data.name}, () => {\n    console.log(\"上传完成\");\n  });\n});\n```\n\nNode 是一门严肃的语言\n\
    \n我们是时候在 CD 流水线中开始这样对待它了。这意味着依赖项可以在构建服务器上下载并构建或编译，然后将结果与其依赖打包成一个自包含包进行部署。\n\n\
    ## MongoDB + Mongoose\n\nMongoDB 可能是所有 NoSQL 数据库中最受欢迎的之一，并且得到了极生态系统和优秀社区的支持。本章将涵盖在\
    \ Node.js 应用中使用 MongoDB 和 Mongoose 时应遵循的一些最佳实践：\n\n### 为什么你需要 Mongoose\n\n理解 Mongoose\
    \ 需要我们从架构层面理解 MongoDB 和数据库的工作原理。\n\n假设你有：\n\n1.  数据库服务器，即 MongoDB 社区服务器\n2.  一个运行中的\
    \ Node.js 脚本进程\n\n"
- fmt: "\nThe server will typically listen on a TCP socket while the Node.js process\
    \ connects to the server with a TCP connection. However, MongoDB also has a protocol\
    \ of its own to help it understand what the process, which is the client, needs\
    \ from the database. Rather than learning all the messages needed to be sent on\
    \ the TCP layer, we can use driver software to help us abstract it all away. In\
    \ this case we use the MongoDB driver, which you can find [here as an npm package](https://www.npmjs.com/package/mongodb).\n\
    \nNow, what you need to remember is that, while this driver can connect and abstract\
    \ the low-level communication requests and responses from us, it will only take\
    \ us, as developers, so far along the path. MongoDB is what is known as a schema\
    \ less database, and that means you have far more power than you really need when\
    \ you are just starting out. The more power you have, the more surface area there\
    \ is for things to go wrong. Cut down your surface area of bugs and wrong-turns\
    \ and you are well on the way, but that requires something a little bit more.\n\
    \nThat’s where Mongoose comes in – an abstraction over the driver we mentioned\
    \ above. Generally, with abstractions, each one reduces your low-level operational\
    \ power. But that isn’t always a bad thing because, on occasion, it can even boost\
    \ your productivity 1000 times or more over because, at the end of the day, there\
    \ is never really a need for you to fully access the underlying API. One way you\
    \ can think about this is that, technically, a real-time chat application could\
    \ be created in both Python and C. As a developer, Python helps you implement\
    \ it much faster with better productivity. C is the more efficient option but\
    \ it will cost you big-time in development productivity and speed, not to mention\
    \ in crashes and bugs. And, mostly, implementing websockets doesn’t require the\
    \ power you get from C. In much the same way, Mongoose lets you reduce your lower-level\
    \ API access surface area but it comes with a great DX and many potential gains.\n\
    \n## Connecting Mongoose + MongoDB\n\nFirst, we want to see how MongoDB databases\
    \ should be connected with Mongoose:\n\n```javascript\nmongoose.connect(DB_CONNECTION_STRING,\
    \ { useNewUrlParser: true, useUnifiedTopology: true, useCreateIndex: true, useFindAndModify:\
    \ false})\n```\n\nUsing this format for the connection ensures that you are using\
    \ the Mongoose URL Parser and are not using any practices that are now deprecated.\n\
    \n## Performing Mongoose Operations\n\nNow we can look at the Mongoose operations\
    \ and how they should be performed. Mongoose provides two options:\n\n1. Cursor-based\
    \ querying\n2. Full fetching query\n\n### Cursor-Based Querying\n\nCursor-based\
    \ querying is all about working with just one record at any one time, while fetching\
    \ single or batches of documents off the database. This is one of the more efficient\
    \ methods to use when you have large amounts of data and an environment limited\
    \ in memory. Let’s say that you have documents totaling about 10GB and they need\
    \ to be parsed on a 1-core 1 GB cloud server. The whole thing cannot be fetched\
    \ at once as it simply wouldn’t fit in your environment so the only decent option\
    \ is to use cursor-based querying.\n\n### Full Fetching Querying\n\nThis query\
    \ type allows you to get the entire query response at once, and this is mostly\
    \ what you will use – that is what we will focus on here.\n\n## Using Mongoose\
    \ Models\n\nModels are Mongoose’s superpower, helping you to enforce the schema\
    \ rules and seamlessly integrate Node code into the database cells. So, first,\
    \ we need a good model defined:\n\n```javascript\nimport mongoose from 'mongoose'\n\
    const CompletedSchema = new mongoose.Schema({\n  type: { type: String, enum: ['course',\
    \ 'classroom'], required: true },\n  parentslug: { type: String, required: true\
    \ },\n  slug: { type: String, required: true },\n  userid: { type: String, required:\
    \ true }\n}, { collection: 'completed' })\n\nCompletedSchema.index({ slug: 1,\
    \ userid: 1 }, { unique: true })\nconst model = mongoose.model('Completed', CompletedSchema)\n\
    export default model\n```\n\nSome of the more interesting things you need to note\
    \ from this is:\n\n1. **Required**: should be kept true on all required fields\
    \ as far as possible. This can save you so much pain, especially when you are\
    \ not using TypeScript, or other static type-checking systems to help you get\
    \ the property names right on your created objects.\n2. **Indexes and unique fields**\
    \ should be defined and you can also add unique properties in a schema. I won’t\
    \ go into depth on indexes here as it is quite a broad subject but they can help\
    \ speed your queries up significantly, especially on a large scale.\n3. **Collection\
    \ names** should be explicitly defined. While Mongoose is able to provide a collection\
    \ name automatically, based on the model’s name, this is quite a bit of abstraction,\
    \ too much for what we want. At the very least, you should know the collection\
    \ and database names in your codebase.\n4. Use **enums** to restrict values if\
    \ possible.\n\n## Performing CRUD Operations\n\nCRUD stands for Create, Read,\
    \ Update, Delete – the fundamental options for manipulating data in a database.\
    \ Let’s finish off by looking at a few examples.\n\n### The Create Operation\n\
    \nThis is simply for creating new database records. We’ll use the model we defined\
    \ earlier to create the record:\n\n```javascript\ntry {\n  const res = await CompletedSchema.create(record)\n\
    } catch(error) {\n  console.error(error)// handle the error\n}\n```\n\nAgain,\
    \ there are a couple of things to note:\n\n1. Don’t use callbacks, use `async-wait`\
    \ instead.\n2. You should use `try-catch` blocks with queries because queries\
    \ can fail for several reasons, including incorrect values, duplicate records,\
    \ etc.\n\n### The Read Operation\n\nThis operation reads values from the database\
    \ but, while it sounds simple, there are a couple of things to be aware of with\
    \ Mongoose:\n\n```javascript\nconst res = await CompletedSchema.find(info).lean()\n\
    ```\n\n1. Did you spot the `lean()` function? This is one of the best functions\
    \ for performance and, by default, Mongoose takes the documents returned from\
    \ the database, processes them and adds magic methods to them, such as `.save()`.\n\
    2. When `.lean()` is used, plain JSON objects are returned and not the documents\
    \ heavy on resources and memory. This makes your queries much faster and it doesn’t\
    \ cost so much in terms of your CPU, either.\n3. That said, `.lean()` can be left\
    \ out if you are thinking about updating the data.\n"
