  trans: "\n\n*   **同步方法** – 这些是阻塞函数。它们会等待每个操作完成，然后执行下一个操作。这就是为什么它们被称为阻塞的——因为它们会阻止后续命令的执行。简单来说，除非并且直到当前命令完成，否则无法执行命令。\n\
    *   **异步方法** – 这些是非阻塞函数。它们不会在等待一个命令完成之前就执行下一个命令。相反，所有操作都会在第一轮循环中全部执行。每个操作的结果会在结果返回后进行处理，即每个命令都会在上一个命令执行后尽快执行，而上一个命令将保持在后台，处理数据并产生结果。\n\
    \n## 用例场景\n\n*   当你的操作不需要从数据库查询大量数据或没有进行任何其他重型任务时，你可以使用同步方法；否则，你应该使用异步方法。\n* \
    \  当你使用异步方法时，可以在继续在后台执行重型任务的同时向用户显示进度指示器——这对于 GUI 应用程序非常有用。\n\n## 使用 `fs` 模块的一些常用\
    \ I/O 操作包括：\n\n### 读取文件\n要异步读取一个物理文件，请使用：`fs.readFile()`\n\n其工作原理示例：\n```javascript\n\
    fs.readFile(fileName [,options], callback)\n```\n\n#### 参数\n这里有三个参数或参数：\n\n* \
    \  `filename` : 字符串格式的完整路径和文件名。\n*   `options` : 这可以是字符串或对象，可以包含标志（flags）和编码。默认标志为‘r’，`utf8`\
    \ 是默认编码。\n*   `callback` : 这是一个具有两个参数 `fd` 和 `err` 的函数。它在操作完成后被调用。\n\n在下一个示例中，你可以看到如何异步读取名为\
    \ `TestFile.txt` 的文件：\n```javascript\nvar fs = require('fs');\nfs.readFile('TestFile.txt',\
    \ function (err, data) {\n  if (err) throw err;\n  console.log(data);\n});\n```\n\
    这段代码在 Windows 操作系统上异步读取 `TestFile.txt`。当读取操作完成后将执行回调函数。操作将成功完成，或者会抛出一个错误。如果抛出错误，`err`\
    \ 参数将包含所有的错误信息。在 `data` 参数中，你将找到指定文件的内容。\n\n这是一个名为 `TextFile.txt` 的示例文件，内容如下：\n\
    ```\nThis test file tests the fs module of Node.js\n```\n运行它将得到以下结果：\n```\nC:\\\
    > node server.js\nThis test file tests the fs module of Node.js\n```\n如果你想同步读取文件，请使用名为\
    \ `fs.readFileSync()` 的方法：\n```javascript\nvar fs = require('fs');\nvar data =\
    \ fs.readFileSync('dummyfile.txt', 'utf8');\nconsole.log(data);\n```\n\n### 写入文件\n\
    `fs.writeFile` 方法用于数据写入文件。如果文件已经存在，则覆盖现有内容，但如果文件不存在，该方法将创建文件并将数据写入其中。\n\n签名：\n\
    `fs.writeFile(filename, data[, options], callback)`\n\n#### 参数\n该方法有四个参数：\n\n\
    *   `filename` : 字符串格式的完整路径和文件名。\n*   `Data` : 这是写入文件的内容。\n*   `options` : 这可以是字符串或对象，可以包含标志和编码。默认标志为‘r’，`utf8`\
    \ 是默认编码。\n*   `callback` : 这是一个具有两个参数 `fd` 和 `err` 的函数。它在操作完成后被调用。\n\n在下一个示例中，你可以看到创建了一个名为\
    \ `test.txt` 的新文件，并将“hello World”异步地写入其中：\n```javascript\nvar fs = require('fs');\n\
    fs.writeFile('test.txt', 'Hello World!', function (err) {\n  if (err) console.log(err);\n\
    \  else console.log('Write operation complete.');\n});\n```\n如果你想将此内容追加到已存在的文件，请使用名为\
    \ `fs.appendFile()` 的方法：\n```javascript\nvar fs = require('fs');\nfs.appendFile('test.txt',\
    \ 'Hello World!', function (err) {\n  if (err) console.log(err);\n  else console.log('Append\
    \ operation complete.');\n});\n```\n\n### 打开文件\n`fs.open()` 方法可打开文件进行读写\n签名：\n\
    `fs.open(path, flags[, mode], callback)`\n\n#### 参数：\n*   `path` : 字符串格式的完整路径和文件名。\n\
    *   `Flag` : 这是执行操作所需的标志。\n*   `Mode` : 这指示需要哪种模式——读、写、读写。默认是读写，为 0666。\n*   `callback`\
    \ : 这是一个具有两个参数 `fd` 和 `err` 的函数。它在操作完成后被调用。\n\n#### 标志 (Flags)\n稍微偏离一下，这些是在读/写操作中可以使用标志：\n\
    \n| 标志 | 描述 |\n| :--- | :--- |\n| r | 打开文件以便读取。如果文件不存在，则抛出异常 |\n| rs | 以同步模式打开文件进行读取\
    \ |\n| rs+ | 打开文件进行读取和写入。告诉操作系统同步打开该文件 |\n| w | 打开文件进行写入。如果文件不存在，则创建文件 |\n\n###\
    \ 删除文件\n如果你想删除文件，请使用 `fs.unlink()` 方法\n签名：\n`fs.unlink(path)`\n\n在下一个示例中，你可以看到一个文件被删除：\n\
    ```javascript\nvar fs = require('fs');\nfs.unlink('test.txt', function (err) {\n\
    \  if (err) throw err;\n  console.log('Delete operation complete.');\n});\n```\n\
    \n## 重要的 fs 方法\n以下是 fs 模块中最重要的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `fs.access()`\
    \ | 检查文件是否存在以及是否可以被 Node.js 访问 |\n| `fs.appendFile()` | 向文件追加数据——如果文件不存在将创建 |\n\
    | `fs.chmod()` | 更改指定文件的权限。相关 `fs.lchmod()` 和 `fs.fchmod()` |\n| `fs.chown()`\
    \ | 更改指定文件的所有者和/或组。相关 `fs.chown()` 和 `fs.lchown()` |\n| `fs.close()` | 关闭文件描述符\
    \ |\n| `fs.copyFile()` | 复制指定文件 |\n| `fs.createReadStream()` | 创建可读流 |\n| `fs.createWriteStream()`\
    \ | 创建可写流 |\n| `fs.link()` | 创建文件的硬链接 |\n| `fs.mkdir()` | 创建新文件夹 |\n| `fs.mkdtemp()`\
    \ | 创建临时目录 |\n| `fs.open()` | 设置所需的文件模式 |\n| `fs.readdir()` | 读取指定目录的内容 |\n| `fs.readFile()`\
    \ | 读取指定文件的内容。相关 `fs.read()` |\n| `fs.readlink()` | 读取符号链接的指定值 |\n| `fs.realpath()`\
    \ | 将相对文件路径解析为完整路径 |\n| `fs.rename()` | 重命名指定的文件或文件夹 |\n| `fs.rmdir()` | 指定的文件夹\
    \ |\n| `fs.stat()` | 返回指定文件名的状态。相关 `fs.fstat()` 和 `fs.lstat()` |\n| `fs.symlink()`\
    \ | 创建指向指定文件的符号链接 |\n| `fs.truncate()` | 将指定文件截断到指定的长度。相关 `fs.ftruncate()` |\n\
    \n"
- fmt: "\n| `fs.unlink()` | Remove specified files or symbolic links |\n| :--- | :---\
    \ |\n| `fs.unwatchFile()` | Stop watching a file for changes |\n| `fs.utimes()`\
    \ | Change a specified file’s timestamp. Related to `fs.futimes()` |\n| `fs.watchFile()`\
    \ | Start watching a specified file for changes. Related to `fs.watch()` |\n|\
    \ `fs.writeFile()` | Write data to a specified file. RE |\n\nThere is one peculiarity\
    \ you should know about the `fs` module – by default, all its methods are asynchronous\
    \ but, by appending `sync()` you can get them to work synchronously: For example,\
    \ `fs.rename()` becomes `fs.renameSync()` and `fs.write()` becomes `fs.writeSync()`.\
    \ This can make a significant difference in how your application flows. Let’s\
    \ look at the `fs.rename()` method, where a callback is used with the asynchronous\
    \ API:\n\n```javascript\nconst fs = require('fs')\nfs.rename('before.json', 'after.json',\
    \ err => {\n  if (err) {\n    return console.error(err)\n  }\n  //done\n})\n```\n\
    \nYou can use asynchronous APIs like, handling errors with a try/catch block:\n\
    \n```javascript\nconst fs = require('fs')\ntry {\n  fs.renameSync('before.json',\
    \ 'after.json')\n  //done\n} catch (err) {\n  console.error(err)\n}\n```\n\nThe\
    \ difference is, in the second example, your script blocks until the file operation\
    \ has completed successfully.\n\n# Chapter Ten: Node.js Global Objects\n\nThis\
    \ chapter is split into two – the first part discusses the Node.js global object,\
    \ while the second part looks at the node.js global objects. These are different,\
    \ as you will see.\n\n## Global Object\n\nThe global object is the top-level object,\
    \ and we can access it from everywhere. In fact, you’ve probably been using its\
    \ modules and functions without even realizing it. Let’s say that we want to see\
    \ whether a variable is an array:\n\n```javascript\nlet x = [1, 2, 3];\nlet result\
    \ = Array.isArray(x) // true\n```\n\nSo, how is `Array` used without needing to\
    \ use it as a module? The global object. To see what is in the global object,\
    \ all you need to do is get into the REPL using the `node` command. Open the command-line\
    \ interface and run the `node` command with no options. Then press the tab key\
    \ twice, and you will see all the modules and functions available in the global\
    \ object – these can be used without requiring modules.\n\n![How we can see what\
    \ is in the global object?](Image00010.jpg)\n\n## Global Modules and Functions\n\
    \nI have no doubt that, along the way, you have used quite a few of these, such\
    \ as `NaN`, `isNaN`, `Infinity`, `Promise`, `String`, and so on. When you want\
    \ to add something o the global object, you must first mutate the global object:\n\
    \n`global.myName = “marypoppins\"`\n\nNow, `myName` can be called from anywhere\
    \ in your project. Here’s an easy example for you:\n\nFirstFile.js\n```javascript\n\
    global.myName = \"marypoppins\";\n```\n\nSecondFile.js\n```javascript\nrequire('FirstFile.js');\n\
    console.log(myName); // It will log \"marypoppins\"\n```\n\nThat was just for\
    \ the purpose of demonstration – best practice for Node.js dictates that the global\
    \ object should not be modified for any reason. Let’s move on to two very important\
    \ modules in the global object – `process` and `buffer`.\n\n### Process\n\nThis\
    \ object contains a lot of useful information about the process:\n\n*   `Process.versions`\
    \ – this tells us what version each of the node core modules is, such as `openssl`,\
    \ `zlib`, `v8`, and more.\n\n![Result of process module in global object](Image00011.jpg)\n\
    \n*   `Process.env` – tells us some important stuff about the environment where\
    \ node runs. Here are some good examples:\n\n```\nprocess.env.shell‘/usr/bin/fish’\n\
    process.env.LANG‘en_US.UTF-8’\nprocess.env.USER‘marypoppins’\n```We can also use\
    \ `process.stdin`, `process.stdout`, and `process.stderr`, all of which are streams,\
    \ to interact with the environment. The process object is an `EventEmitter` instance,\
    \ and this means the object can be used to register event listeners:\n\n![Easy\
    \ code to show how process works as an event listener](Image00012.jpg)\n\nAnd\
    \ the result of this code is: ![Image for post](Image00013.jpg) You can also use\
    \ `process.exit(exitCode)` to end your code with the exit code you want to use.\n\
    \n### Buffer\n\nA buffer is a memory chunk that is external to the `v8` heap and\
    \ is used to help us put data into the memory. In simple terms, it is a low-level\
    \ data structure representing a binary data sequence; once allocated, there is\
    \ no way to resize it. Reading from the buffer requires the encoding is specified.\
    \ Some of the ways a buffer can be created are:\n\n*   `Buffer.from()` - this\
    \ uses anything, such as an image, file, or string, to create a buffer\n*   `Buffer.alloc()`\
    \ – this creates filled buffers with specified sizes\n*   `Buffer.allocUnsafe()`\
    \ - this creates buffers with specified sizes that may contain old data but offer\
    \ advantages in terms of performance. This can also be filled using `.fill()`.\n\
    \nThe image below shows the difference between `Buffer.alloc()` and `Buffer.allocUnsafe()`.\
    \ ![Differences of Buffer.alloc and Buffer.allocUnsafe](Image00014.jpg) As you\
    \ can see, the alloc-created buffer has no data but the unsafe buffer has some\
    \ old data in it. Here’s another example: ![Simple buffer creation](Image00015.jpg)\
    \ Before you see what the console outputs, have a guess at the results: `<Buffer\
    \ 48 65 6c 6c 6f 20 47 75>`\n\n## Global Objects\n\nAs you have gathered by now,\
    \ Node.js is modular in its approach which means when a function, variable, or\
    \ object is defined inside a file, it is local to the file. When you want to use\
    \ a variable defined in one file in a different one, you need to use `module.exports`\
    \ syntax to export and then use `require(path_of_file)` to import into the other.\
    \ In Node.js, global objects work a little differently. Because they are global\
    \ and can be accessed in all modules, there is no need to import or export them\
    \ – they can be directly in your application, anywhere you want.\n\n### Prerequisites\n\
    \nYou will need Node.js installed, and you need a basic knowledge of the command\
    \ line or terminal. We’re going to look at some of the more important and common\
    \ Node.js global objects:\n\n*   `process`\n*   `__dirname`\n*   `__filename`\n\
    *   `require()`\n*   `module`\n*   `URL`\n\nTo start with, create a new folder\
    \ in the home directory and call it `nodejs`: `mkdir nodejs`. Now get into that\
    \ folder: `cd nodejs`. Once you are in the nodejs directory, create a new file\
    \ and call it `main.js`: `touch main.js`. NOTE If you are using Windows, `touch`\
    \ will not work. The only way around it is to use a text editor to create your\
    \ file and then save it in your nodejs directory.\n\nLet’s look at these objects.\n\
    \n### Process\n\nThis global object gives you lots of useful information about\
    \ your program execution environment. Some information it provides includes the\
    \ architecture, the platform, process ID, uptime, environmental variables, current\
    \ working directory, and more. Here are some of the more common functions and\
    \ properties in the object:\n\n*   `process.arch` – the CPU architecture of the\
    \ operating system is returned, Some values include `x32`, `x64`, and `ia32`.\n\
    *   `process.platform` – this returns the OS or platform where the program is\
    \ being executed on. Some examples of returned strings include `openbsd`, `linux`,\
    \ `freebsd`, and `win32`.\n*   `process.id` – this returns the PID, or process\
    \ id of the node’s process\n*   `process.cwd()` – this is a method that returns\
    \ the current working directory of the executing program\n*   `process.chdir(directory)`\
    \ -  this method is used for changing the current working directory\n"
