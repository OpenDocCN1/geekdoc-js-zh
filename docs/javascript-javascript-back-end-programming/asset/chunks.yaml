    \ callback(xhr.response);\n    };\n    xhr.send();\n}\n\nfunction displayImage(blob)\
    \ {\n    let objectURL = URL.createObjectURL(blob);\n    let image = document.createElement('img');\n\
    \    image.src = objectURL;\n    document.body.appendChild(image);\n}\n\nloadAsset('coffee.jpg',\
    \ 'blob', displayImage);\n```\n\n创建了一个 `displayImage()` 函数来表示一个 blob。这个 blob 作为对象\
    \ URL 被传递给函数；创建了一个图像来显示该 URL，并将其附加到文档的 `<body>` 中。创建了一个 `loadAsset()` 函数，它接收一个回调和内容类型的参数以及一个要获取的\
    \ URL。`XMLHttpRequest`（通常称为 `XHR`）被用于从指定的 URL 获取资源，并将响应传递给回调以便对其进行处理。在我们的案例中，回调等待\
    \ `XHR` 使用 `onload` 事件处理器下载资源，然后该资源会被传回回调。\n\n回调是非常多功能的，因为它们允许你控制函数运行的顺序，并确定它们之间传递的数据，但它们也允许你根据当前情况将数据传递给其他函数。通过这种方式，可以在下载的响应上运行不同的操作，例如\
    \ `displayText()`、`processJSON()` 等。\n\n请注意并不是每个回调都是异步的；有些是同步的，其中一个例子是使用 `Array.prototype.forEach()`\
    \ 循环遍历项数组：\n\n```javascript\nconst gods = ['Apollo', ‘Demeter', 'Ares', 'Hades'];\n\
    gods.forEach(function (eachName, index) {\n    console.log(index + '. ' + eachName);\n\
    });\n```\n\n在这里，循环遍历了一个包含神名字的数组，但索引号和相关值被打印到了控制台上。\n\n## Promise (Promises)\n\
    Promise 是当今 Web API 中常用的最新异步样式。其中最好的例子之一是名为 `fetch()` 的 API，它是 `XMLHttpRequest`\
    \ 的现代版本且高效得多。这里有一个示例：\n\n```javascript\nfetch('products.json').then(function(response)\
    \ {\n    return response.json();\n}).then(function(json) {\n    products = json;\n\
    \    initialize();\n}).catch(function(err) {\n    console.log('Fetch 问题: ' + err.message);\n\
    });\n```\n\n在这些代码中，`fetch()` 只接受一个参数：你想要获取的网络资源的 URL，并返回一个 promise。Promise 是代表异步操作失败或完成的对象，是某种中间状态的表示。它只是浏览器向你承诺会尽快给出答案——这就是名字的由来。这可能需要一点时间来适应，感觉有点像薛定谔的猫\n\
    \n- 有两个 `then()` 块，它们都有一个回调函数。该函数只有在之前的操作成功时才会运行，并且每个回调都会接收该操作的结果作为输入。通过这种方式，你可以继续执行其他操作。`.then()`\
    \ 块返回 promise，多个 `.then()` 块可以链联，允许异步操作按顺序一个一个运行。\n- 最后还有一个 `catch()` 块，它只在一个或两个\
    \ `.then()` 块失败时才会运行。类似于同步 JavaScript 中的 `try...catch` 块，`catch()` 块包含一个错误对象，用于报告任何发生的错误。值得注意的是，同步的\
    \ `try...catch` 不适用于 promise。\n\n## Promise 与 回调 (Promises vs. Callbacks)\nPromise\
    \ 与回调有些相似，本质上是带有一个回调函数的返回对象，而不是传递给函数的回调。但 promise 是专为异步操作设计的，比回调有几个优势：\n\n- 多个异步操作可以通过尽可能多的\
    \ `.then()` 操作进行链联。结果从上一个操作作为输入传递给下一个，这在回调中是很难做到的——试试看你会得到一团乱麻。\n"
- fmt: "\n- Promises are always called in the exact order they go into the event queue.\n\
    - It is easier to handle errors as they are all taken care of with one `.catch()`\
    \ block, placed at the end, instead of being handled individually at each level.\n\
    - Promises also get away inversion of control, whereas the old callbacks lose\
    \ control of function execution when a callback is passed to a third-party library.\n\
    \n### Asynchronous Code Nature\n\nLet’s look at another example showing the real\
    \ nature of asynchronous code. It shows what could happen when we don’t fully\
    \ know what order the code will execute in and the consequences of treating asynchronous\
    \ and synchronous code the same. This is a similar example to what we have already\
    \ looked at but, this time, several `console.log()` statements are included to\
    \ show the order that you might assume the code will execute in:\n\n```javascript\n\
    console.log ('Starting');\nlet image;\nfetch('coffee.jpg').then((response) =>\
    \ {\n    console.log('It worked :)')\n    return response.blob();\n}).then((myBlob)\
    \ => {\n    let objectURL = URL.createObjectURL(myBlob);\n    image = document.createElement('img');\n\
    \    image.src = objectURL;\n    document.body.appendChild(image);\n}).catch((error)\
    \ => {\n    console.log('There is a problem with your fetch operation: ' + error.message);\n\
    });\nconsole.log ('All done!');\n```\n\nThe browser starts to execute the code.\
    \ It sees the initial `console.log()` statement and executes it, followed by the\
    \ `image` variable being created. Then it goes to the following line and starts\
    \ to execute the `fetch()` block. However, the `fetch()` asynchronously executes\
    \ without blocking and, after the code related to the promise is executed, the\
    \ rest of the code continues. Thus, the last `console.log()` is reached, and the\
    \ result is output on the console.\n\nOnly when `fetch()` is finished, and the\
    \ result is delivered via the `.then()` blocks will the second of the `console.log()`\
    \ messages appear on the console. As you see, the messages appear in an order\
    \ that doesn’t relate to what you would expect:\n\n- Starting\n- All done!\n-\
    \ It worked :)\n"
