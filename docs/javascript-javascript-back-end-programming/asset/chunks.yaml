  trans: "\n\n自 0.6.0 版本起，Node.js 下载包已包含了包管理器，因此你不需要对其进行单独安装。\n\n## Windows\n要在 Windows\
    \ 上安装 Node.js，请访问 [`nodejs.org`](https://nodejs.org)。系统将自动识别你的操作系统，并显示正确的下载链接。点击\
    \ `LTS` 或 `Current` 按钮下载 Node MSI – `Current` 按钮最佳，因为它提供了最新版本。\n\n一旦下载了 MSI 文件，双击它，你将看到如下所示的安装界面：\n\
    ![![](img/Image00002.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/nodejs-installation.png)\n\
    \n点击 `Next` 按钮，将出现许可协议；阅读并接受它，然后点击 `Install`。Node.js 将快速安装到你的电脑上；点击 `Finish` 按钮完成安装。\n\
    \n### 验证安装\n现在 Node.js 已安装，你可以通过启动命令提示符来验证安装。点击开始栏，输入 `Command Prompt` 并点击结果。现在输入以下命令：\n\
    \n```\nnode -v\n```\n\n如果安装成功，你将看到一个显示 Node 版本的屏幕；如果没有看到，则说明你需要尝试重新安装。\n\n## Mac\
    \ 和 Linux\n首先，访问 Node.js 官方网站 – [`nodejs.org/en/download`](https://nodejs.org/en/download)。点击适用于你系统的右侧安装程序，如下所示：\n\
    ![![](img/Image00003.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/download-nodejs-mac.png)\n\
    \n当正确的包下载完成后，点击安装程序，Node.js 安装向导将加载。点击 `Continue` 按钮并按照屏幕步骤操作。成功后，你将看到一个安装摘要，告知\
    \ `NPM` 和 `Node.js` 的安装位置。\n![![](img/Image00004.jpg)](https://www.tutorialsteacher.com/Content/images/nodejs/nodejs-installation-mac2.png)\n\
    \n### 验证下载\n打开你的终端窗口并输入以下命令验证安装（注意，`$` 符号是命令提示符）：\n\n```\nnode -v\n```\n\n你应该能在屏幕上看到显示的版本号。\n\
    \nMac 或 Linux 用户还有另一种安装 Node.js 的方法。这涉及使用 Homebrew (Mac) 或 Linuxbrew (Linux) 包管理器直接从命令行安装\
    \ Node.js。如果你使用 Linux，在安装 Node.js 之前需要安装额外的依赖项，例如 `Ruby v 1.8.6` 或更高版本以及 `GCC\
    \ v4.2` 或更高版本。\n\n准备好安装时，在提示符输入以下命令：\n\n```bash\n$ brew install node\n```\n\n\
    ## IDE 安装\nNode.js 开发应用时使用 JavaScript，因此只要支持 JavaScript，任何文本编辑器或 IDE 都可以。尽管如此，我建议你使用支持\
    \ Node.js API 自动补全功能的 IDE，例如 Sublime Text、Aptana、Eclipse、Visual Studio 等。\n\n\
    ### IDE – Visual Studio Code\nNode.js 应用使用 JavaScript 开发。因此，你可以使用任何支持 JavaScript\
    \ 语法的 IDE 或文本编辑器。然而，建议使用支持 Node.js API 自动补全功能的 IDE，例如 Visual Studio、Sublime Text、Eclipse、Aptana\
    \ 等。\n\nVisual Studio Code 从一开始就支持 TypeScript 和 JavaScript 语言，并且支持调试。不过，你需要在机器上拥有\
    \ Node.js 运行时才能运行 Node.js 。\n\n一旦在系统上安装了 Node.js（包括 Node 包管理器），我们就可以安装 VSC：\n\n\
    #### Windows\n打开 [`code.visualstudio.com/download`](https://code.visualstudio.com/download)\
    \ 并下载适用于你系统的 VSC。完成后，打开文件夹并运行安装程序 – 它的名为 `VSCodeUserSetup (version).exe`。当许可协议界面加载时，接受它并点击\
    \ `Next`。在下一页，点击“创建桌面图标”选项 – 这允许你从桌面轻松访问。点击 `Next`！\n![next screen](img/Image00005.jpg)\n\
    \n最后，点击 `Install` 按钮。安装完成后，点击 `Finish`，Visual Studio Code 将打开。\n\n#### Mac\n首先，访问\
    \ [`code.visualstudio.com/download`](https://code.visualstudio.com/download) 并下载\
    \ Mac 版 Visual Studio Code。文件以 `.zip` 格式下载；找到它并双击查看文件内容。找到名为 `Visual Studio Code.app`\
    \ 文件并将其拖到 Applications（应用程序）文件夹。双击该文件打开它。\n\n## Hello World\n让我们从在 VSC 中创建 Hello\
    \ World 应用开始。创建一个名为 `hello` 的文件夹，然后打开命令提示符。进入该文件夹并进入 VS Code。以下是你需要的命令：\n\n```bash\n\
    mkdir hello\ncd hello\ncode\n```\n\n现在转到文件管理器工具栏并点击“New File”（新建文件）按钮；将其命名为 `app.js`。当你使用\
    \ `.js` 文件后缀时，VSC 可以将其解释为 JavaScript 文件并使用 JS 语言服务评估文件内容。\n\n在 `app.js` 文件中创建一个字符串变量并将其内容发送到控制台，如下：\n\
    \n```javascript\nvar msg = 'Hello World';\nconsole.log(msg);\n```\n\n你可能注意到，当你输入\
    \ `console.` 时，会自动呈现 `msg` 字符串。使用 `CTRL+S` 保存文件，现在我们可以运行应用。在终端中输入：\n\n```bash\n\
    node app.js\n```\n\n输出应该是 \"Hello World\"。\n\n### 集成终端\nVS Code 拥有一个集成终端，你可以在其中运行\
    \ shell 命令，而无需离开 VS Code。要打开集成终端，转到 `View>Terminal`（视图>终端），终端打开后你可以直接运行 Node.js。\n\
    \n### 调试 Hello World\nVS Code 还内置了调试器，可以帮助调试 Node.js 应用。首先，我们在 `app.js` 的第 1 行设置一个断点并按下\
    \ `F9`。要开始调试代码，转到活动栏并点击 `Run`（运行）。点击工具栏上的绿色箭头或按下 `F5`。你的应用现在将被调试，当到达断点时，VS Code\
    \ 会显示一个不同颜色的状态栏，你将看到控制台。\n![hello world debugging](img/Image0006.jpg)\n\n这是一个简单的示例，展示了\
    \ VS Code 如何工作。让我们更进一步，使用它在 Node.js 构建一个全栈 Web 应用。如果你不再需要 Hello World 文件夹，可以删除它。\n\
    \n## Express 应用\nExpress 是构建 Node.js 应用最流行的框架之一 – 现在我们将详细介绍。Express 提供了许多工具，其中\
    \ Express Generator 可以帮助你创建脚架应用。Express Generator 是一个 `npm` 模块，你可以使用 `npm` 命令行安装它。首先，打开终端并输入\
    \ `npm --help` 检查是否已正确安装。现在使用以下命令安装 Express Generator：\n\n```bash\nnpm install\
    \ -g express-generator\n```\n\n注意 `-g` 的包含；这会在你的计算机上全局安装 Express Generator，允许你在任何地方运行它。\n\
    \n接下来，使用以下命令创建一个名为 `myApp` 的新应用：\n\n```bash\nexpress myApp --view pug\n```\n\n\
    将创建一个名为 `myApp` 的文件夹，它将包含你的应用。命令末尾的参数 `--view pug` 告知生成器使用 pug 模板引擎。你还需要安装应用依赖，这些都是\
    \ `npm` 模块；进入文件夹并执行：\n\n```bash\ncd myApp\nnpm install\n```\n\n现在我们需要确保应用可以运行。在生成的\
    \ Express 应用中有一个名为 `package.json` 的文件，其中有一个运行 `node./bin/www` 的启动脚本 – 这会让 Node.js\
    \ 应用运行。在 `myApp` 文件夹内的终端输入以下内容：\n\n```bash\nnpm start\n```\n\nNode.js Web 服务器启动；导航到\
    \ `http://localhost:3000`，你可以看到应用正在运行。关闭浏览器并在 `myApp` 文件夹中打开终端；按下 `CTRL+C` 停止服务器。现在打开\
    \ VS Code：\n\n```bash\ncode .\n```\n\n如果你使用集成终端安装生成器并创建应用，你只需要使用 `File>Folder`（文件>文件夹）从\
    \ VS Code 实例打开应用。\n\n### Excellent 的代码编辑\n打开 `app.js` 文件并找到 Node.js 全局对象 `__dirname`。将光标悬停上面，你会发现\
    \ VS Code 将 `__dirname` 视为字符串。你可以获得框架的智能补全。例如，在 VS Code 中输入代码所需的某些内容（如 `HTTP`），可以获得智能补全。\n\
    \nVS Code 使用 `TypeScript` 类型的声明文件为 VS Code 提供应用所消耗 JS 框架的元数据。类型声明使用 TypeScript\
    \ 让 Express 能够感知函数和参数类型。这让 VS Code 提供了最好的智能补全体验，你无需担心下载这些文件 – 得于自动类型获取功能，VS Code\
    \ 会自动安装它们。\n\n你也可以在代码的不同文件中引用其他模块。例如，我们在 `app.js` 中需要 `./routes/index` 模块，它导出了\
    \ `Express.Router` 类。\n\n### 调试 Express 应用\n首先，你的 Express 应用需要创建一个名为 `launch.json`\
    \ 的调试配置文件。转到活动栏并点击 `Run` 图标。然后在运行视图中点击配置图标（看起来像一个齿轮）来创建默认的 `launch.json` 文件。在\
    \ Configurations 中，确保 `type` 属性设置为 `node` – 这将确保选择了 Node.js 环境。当文件创建后，VS Code\
    \ 会在 `package.json` 中查找启动脚本，并将该值作为 `Launch Program` 配置的 `program` – 在我们的情况下，它是\
    \ `${workspaceFolder}\\bin\\www`。\n\n```json\n{\n  \"version\": \"0.2.0\",\n \
    \ \"configurations\": [\n    {\n      \"type\": \"node\",\n      \"request\":\
    \ \"launch\",\n      \"name\": \"Launch Program\",\n      \"program\": \"${workspaceFolder}\\\
    \\bin\\\\www\"\n    }\n  ]\n}\n```\n\n"
