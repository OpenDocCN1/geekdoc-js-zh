    isn’t much more to the RESTful APIs  - all you need to know is how to define the
    APIs and use the HTTP Methods.Chapter Fifteen: Node.js Scalable ApplicationsNode.js
    scalability is not something that was stuffed in later; it is a core part of the
    Node runtime. The reason Node is named as it emphasizes how a Node application
    should be built – of distributed, small nodes that talk to each other.Let me ask
    you a few questions:


    1.  Do your Node applications have multiple nodes?


    2.  Do you have a Node process running on all the CPU cores on your production
    machines, and are all the requests between them load-balanced?


    3.  Did you know that there is a built-in module in Node to help you with all
    of this?


    It’s called Cluster, and it provides a solution to help you utilize the CPU power
    your machine offers. More than that, it also ensures your Node processes have
    better availability and gives an option for restarting the entire application
    without any downtime.Putting that aside, let’s dive into scalability strategies.Strategies
    of ScalabilityOne of the best reasons why we scale our Node applications is because
    of the workload, but it isn’t the only reason – two others include increasing
    availability and increasing the tolerance to failure.There are three primary ways
    an application can be scaled:


    1.  Cloning


    The easiest way of scaling applications, especially large ones, is cloning it
    several times and having each clone handle a certain part of the workload, for
    example, with a load balancer. This costs little in development time and is one
    of the most effective ways of doing it. This is the absolute minimum strategy
    that you should be doing, and you can use the Cluster module built into Node to
    make implementing the strategy simple on a single server.


    2.  Decomposing


    An application can also be scaled by decomposing it. This is done based on services
    and functionalities, which means having several applications with their own codebases
    and, on occasion, their own User Interface and dedicated database.We typically
    associate the decomposition strategy with a term called Microservice. Micro indicates
    that the services should be small, but the reality is that the service size isn’t
    important; what is important is how high cohesion and loose coupling are enforced
    between the services.  Implementing this strategy is not always easy and has the
    potential to cause long-term issues; done right, it offers huge advantages.


    3.  Splitting'
