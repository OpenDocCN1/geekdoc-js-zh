    has been initialized and has eight zero bytes.var buffer = Buffer.from([ 8, 6,
    7, 5, 3, 0, 9]);// This prints 8 bytes of certain values:// <Buffer 08 06 07 05
    03 00 09>This way, the buffer is initialized to the array contents. Bear in mind
