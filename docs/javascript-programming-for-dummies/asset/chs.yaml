  \ 区域的任何代码。\n\n# 20 逻辑运算符\n\n## Key Points\n\n- 在对条件条件的讨论中，我们看到了如何通过比较运算符来检查单个结果的真值：\n\
  ```javascript\nif ( x > some_value )\n{\n  …表达式…\n}\n```\n- 我们也看到了这种方法的局限性。假设我们想发现\
  \ `x` 是否位于两个值（例如 `val_1` 和 `val_2`）之间。我们有多种方法可以实现这一点。在关于学生成绩的示例中，我们学习了可以使用 `if…else`\
  \ 组合来实现这种效果：\n```javascript\nif ( x > val_1 )\n{\n  …执行某些操作…\n}\nelse\nif ( x >\
  \ val_2 )\n{\n  …执行其他操作…\n}\n```\n- 上述代码实现了我们的目标——对于第二个分支，`x` 必须位于 `val_2` 和 `val_1`\
  \ 之间（当然，假设 `val_1` 大于 `val_2`）。然而，它是相当臃肿的，并且无法优雅地扩展到检查三个条件（假设我们还想检查 `x` 是否为偶数），或者实际上扩展到十个条件。\n\
  - 现在引入逻辑运算符。这些运算符用于连接条件检查，并根据所有或任何检查是否真来返回 true 或 false。\n- 在英语中，我们使用“AND”（与）和“OR”（或）来称呼这些运算符。\n\
  - 例如，假设我们想在每周二晚上 8 点做某些事情。我们需要检查当前日期是否是周二，以及时间是否是晚上 8 点。\n- 另一个例子：假设我们想在每月第一个周二做某些事情，以及每月的\
  \ 3 号。我们必须检查当前日期是否是该月的第一个周二，或者是否是该月的 3 号。\n- 注意上一个例子中，如果两个条件都真，那么我们就在 3 号周二，并执行该操作。换句话说，`or`\
  \ 条件允许其中一个、另一个或两个条件都真。\n- 在 JavaScript 中，我们使用以下语法来检查多个条件：\n`( 100 > 10 && 5 < 8\
  \ )`\n翻译为“如果 100 大于 10 且 5 小于 8”。在这种情况下，结果为 true。\n`( 100 > 200 && 4 < 9 )`\n在这种情况下，结果为\
  \ false。注意这里只有第一个条件被实际检查了。因为 `and` 要求两次比较都为真，一旦它发现一个为假的，它就会停止检查。这可能是很有用的。\n`( 100\
  \ > 10 || 9 < 8 )`\n翻译为“如果 100 大于 10 或者 9 小于 8”。在这种情况下，结果为 true，因为至少有一个条件满足了。\n\
  `( 100 > 200 || 9 < 8 )`\n在这种情况下，结果为 false，因为两个条件都没有满足。\n`( 100 > 10 || 9 < 8 )`\n\
  在这种情况下，结果为 true，因为至少有一个条件满足了。\n- 在 JavaScript 中，我们使用 `&&` 表示逻辑与（AND），使用 `||` 表示逻辑或（OR）。\n\
