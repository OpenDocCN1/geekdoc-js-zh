  \n## Key points\n\n- 在很多情况下，变量完全满足我们在 JavaScript 中的数据存储需求。然而，在许多情况下，我们可能希望将变量“分组”到一个相关项目的集合中。\n\
  - 以星期几为例。每天我们都执行多项任务，所以我们可能希望将每个任务记录为单独的项目，存储在一个名为“周一任务”的组下。\n- 在 JavaScript 中，为了实现这一点，我们将每个任务存储在单独的变量中然后将这些任务分组为一个数组。\n\
  - 数组是 JavaScript 的一种特殊类型，它可以存储多个值——与只存储一个值的变量不同。\n- 将数组想象成一行可能会有所帮助。数组中的框是编号的，从\
  \ 0 开始计数。\n- 为了使用数组，你必须先创建它。在 JavaScript 中创建数组有多种方法。最简单的方法如下：\n\n```javascript\n\
  arrDays = new Array();\n```\n这条语句创建了一个带有空框的数组。然而，需要指定大小的情况很少见。\n- 然而，更有用的是需要时“填充”数组的能力。例如：\n\
  \n```javascript\narrDays = new Array(\"Monday\",\"Tuesday\");\n```\n我们现在有了一个两个元素的数组。第一个\
  \ (0) 的值为“Monday”，第二个 (1) 的值为“Tuesday”。\n- 创建数组最常用的方法是使用“方括号”符号。方括号在数组的使用中起着很大作用，因此通常是最简单的方法：\n\
  \n```javascript\narrDays = [\"Monday\",\"Tuesday\"];\n```\n- 要访问数组元素，我们首先调用数组名称，然后在方括号中指定数字，如下：\n\
  \n```javascript\nalert(arrDays[0]);\n```\n注意 0 周围没有引号。这行代码等同于 `alert(\"Monday\"\
  )`。\n- 我们不仅可以使用这种符号访问数组的值，还可以赋值：\n\n```javascript\narrDays[2] = “Wednesday”; arrDays[3]\
  \ = “Thursday”;\n```\n- 如果你想在不知道最后一个元素索引的情况下向数组添加元素，可以使用：\n\n```javascript\narrDays[]\
  \ = “some day”;\n```\n- 正如我们将看到的，数组实际上是特殊的 JavaScript 对象，并拥有相关的属性和方法。每个数组拥最重要的属性是它的长度（length）：\n\
  \n```javascript\nhow_many_days = arrDays.length;\n```\n- 除了属性，数组还有非常有用的方法。如果你想对数组进行字母排序，可以使用数组的\
  \ sort 方法：\n\n```javascript\narrDays.sort();\n```\n- 注意，sort 方法作用于数组本身，覆盖当前值。因此，如果你有一个每个每天作为一个元素的数组，调用它的\
  \ sort 方法意味着 `arrDays[0]` 现在等于“Friday”，而不是“Monday”。\n\n## Project\n\n- 打开你之前的项目文件，并将其保存为\
  \ `chapter_15.html`。\n- 清除 `script` 标签中所有的 JavaScript 代码。\n- 编写几个 JavaScript 语句，按字母顺序在页面上显示全年月份。你应该使用以下技术来实现这一点：\n\
  - 将全年的月份存储在一个数组中。\n- 使用数组方法对数组元素进行字母排序。\n- 使用 for 循环遍历每个数组元素，并将元素的值打印到屏幕上（提示，考虑使用\
  \ `array[i]`，其中 `i` 是 for 循环的计数器）。\n\n\n\n\n\n- 上述方法（使用 `for` 循环遍历一系列数组元素）是我们在本课程中讨论的第一批常用编程技术之一。它的用处不言而喻，因为它允许我们对一系列相关元素执行重复任务，而无需务必在编写代码时就知道这些元素具体是什么。它可以应用于表单元素、cookie、页面元素、页面、窗口，以及你可能想要用\
  \ JavaScript 操作的任何其他对象集合。\n- 为了加强这种通用性，如果你在循环中没有使用 `array.length` 值，请考虑现在使用它。为了证明你创建了一个更具通用性的循环，请尝试用日期数组代替月份数组来运行代码，看看你是否需要更改任何循环代码。\n\
  \n# 16 关联数组与对象数组\n\n## 核心要点\n\n- 我们已经看到，可以通过索引来访问数组元素：\n\n```javascript\narrDays\
  \ = [\"Monday”, “Tuesday”];\n// 在页面文档中打印 “Monday”。\ndocument.write(arrDays[0]);\n\
  ```\n\n- 然而，如果能够为我们的数组元素命名可能会更有用。默认情况下，数组被创建为数值数组。我们也可以创建关联数组：\n\n```javascript\n\
  arrDays = new Array();\narrDays[\"Monday”] = “去看牙医”; arrDays[\"Tuesday”] = “参加 JavaScript\
  \ 班”;\narrDays[\"Wednesday”] = “JavaScript 作业”;\n// 提醒你周三的任务\nalert(arrDays[\"Wednesday”]);\n\
  ```\n\n- 这看起来与我们之前讨论的对象和属性非常相似。事实上，由于数组实际上是一个对象，我们可以像访问属性一样访问它的元素：\n\n```javascript\n\
  // 提醒你周三的任务\nalert(arrDays.Wedensday);\n```\n\n- 注意这里有一个细微的区别——在我们之前的数值数组示例中，星期几的名称是数组元素的值。在这里，星期几的名称是元素的索引。请避免以下常见错误：\n\
  \n```javascript\narrDays = [\"Monday”,“Tuesday”]; arrDays[\"Monday”] = “去上班”;\n\
  // 这实际上等于 arrDays = new Array();\narrDays[0] = “Monday”; arrDays[1] = “Tuesday”;\n\
  arrDays[\"Monday”] = “去上班”;\n```\n\n## 项目\n\n- 此时 `arrDays.length` 是 3，而不是 2。\n\
