  \ 文件（你的导师将演示这一点），并使用记事本的 `文件 > 打开` 打开它。\n- 将 `available_plugins.js` 的全部内容复制并粘贴到\
  \ head 区域的 `script` 元素中。注意它定义了一个大数组。数组包含 Web 浏览器中可能各种组件（如 Flash 或 Quicktime）。\n\
  - 在 head 区域脚本元素中添加一个名为 `flash_exists()` 的函数。该函数应该使用 for 循环检查 `available_plugins`\
  \ 数组的每一项，并确定 Flash 是否存在。\n- 在 head 区域脚本元素中进一步添加一个名为 `quicktime_exists()`。该函数也应该使用\
  \ for 循环检查数组的每个元素，这次如果 Quicktime 存在则返回 true。\n- 最后，在 head 区域脚本元素中添加一个名为 `both_quicktime_and_flash_exist()`\
  \ 的函数。该函数应该调用之前的两个函数，将它们的结果存储在变量中，并产生一个包含消息的消息框：\n- 如果两个函数都返回 true，显示“Both Quicktime\
  \ and Flash”；\n- 如果任一函数返回 false，则显示“One of Quicktime or Flash is missing”。\n- 从\
  \ body 区域脚本元素调用最终的函数。\n- 在浏览器中检查你的结果。\n\n# 21 使用事件处理器\n\n## Key Points\n\n- 到目前为止，我们的脚本在浏览器页面加载后就会立即运行。即使我们使用了函数来“封装”代码，这些函数也会在页面中被调用时立即运行，或者在如果没有调用时完全不运行。换句话说，到目前为止我们的脚本响应的唯一事件就是页面加载到浏览器窗口的事件。\n\
  - 然而，在大多数情况下，你会希望你的代码对特定的用户活动做出响应。你会希望定义函数，并让它们在用户执行某些操作时才活跃起来。\n\n\n\n\n\n- 每当用户与页面进行交互时，浏览器都会通知\
  \ JavaScript 正在发生某个“事件”（event）。该事件可以是鼠标点击、鼠标指针移动到或移出给定元素（如图像或段落）、用户使用 Tab 键切换到 HTML\
  \ 表单的新部分、用户离开页面、用户提交表单等 ᴄh ᴄ等 等。\n- 事件处理器（event handler）是一段 JavaScript 代码，它允许我们能够在每个事件发生时捕获它，并通过运行某些\
  \ JavaScript 代码来对其做出响应。\n- 通用情况下，我们将事件处理器绑定到特定的 HTML 标签上，因此，页面上某一个元素的鼠标点击可能会被事件处理器捕获，但点击页面其他地方可能会执行完全不同的操作，或者实际上什么都不做。\n\
  - 下面表格列出了一些常见的事件处理器：\n\n| 事件处理器 | 发生时机… |\n| :--- | :--- |\n| `onload` | 元素在页面上加载\
  \ |\n| `onunload` | 元素未加载，例如当用户离开页面时 |\n| `onmouseover` | 当鼠标指针进入 HTML 元素定义的区域时\
  \ |\n| `onmouseout` | 当鼠标指针离开 HTML 元素定义的区域时 |\n| `onclick` | 当在 HTML 元素定义的区域内点击左鼠标键时\
  \ |\n| `onmousedown` | 当在 HTML 元素定义的区域内按下左鼠标键时 |\n| `onmouseup` | 当在 HTML 元素定义的区域内释放左鼠标键时\
  \ |\n\n- 最后三者是相关的，但存在细微的差异——`onclick` 被定义为在给定元素的区域内同时发生 `mousedown` 和 `mouseup`\
  \ 事件时。例如，如果你点击页面的某个区域，它会注册该区域的 `mousedown` 事件。如果你在释放之前一直按住鼠标并移动到另一个区域，它将会注册另一个区域的\
  \ `mouseup` 事件。然而，浏览器的 `click` 事件将保持未注册状态。\n- 从理论上讲，我们可以将这些大多数事件处理器添加到我们希望的几乎任何\
  \ HTML 标签上。在实践中，许多浏览器限制了我们可以交互的元素。\n- 我们将主要把事件处理器绑定到 `<img>`、`<a>` 和 `<body>` 标签上。\n\
  - 要给一个标签绑定事件处理器，我们使用以下方法：\n\n```html\n<a href=”…” onclick=”a_function();”>link</a>\n\
  ```\n- 我们可以使用这种方法将上述列出的任何事件处理器绑定到页面的元素上。除了调用函数（当然，可以带有任何可选参数），我们还可以直接在事件处理器中编写 JavaScript：\n\
  \n```html\n<a href=”…” onclick=”alert(‘hello’);”>link</a>\n```\n- 注意这里引号的潜在问题——如果你在事件处理器周围使用双引号，则需要在内部使用单引号，反之亦然。\n\
  \n## 项目\n\n- 打开你之前的项目文件，并将其另存为 `chapter_21.html`。\n- 清除你 `script` 标签中的所有 JavaScript\
  \ 代码。\n- 确保你在文档的 `head` 区域有一个 `script` 元素，且 `body` 区域没有。\n- 在 `head` 区域的 `script`\
  \ 元素中，定义以下函数：\n\n```javascript\nfunction set_status( msg )\n{\n  window.status =\
  \ msg;\n}\n```\n- 调用此函数时，它会将浏览器状态栏（窗口页面内容下方的部分）显示的文本设置为传递给参数的任何内容。例如，要设置状态栏显示“Welcome”，我们将调用：\n\
  \n`set_status(“Welcome”);`\n- 现在紧接在上一个函数下方定义以下函数：\n\n```javascript\nfunction clear_status(\
  \ )\n{\n  set_status(“”);\n}\n```\n- 调用此函数时，它将清除状态栏。注意我们在新函数内部使用了之前的函数。这是一个常用的编程技术，允许我们使用更通用的函数来定义特定要求的函数。\n\
  - 现在，将以下 HTML 添加到页面的 `body` 区域。记住，我们在这里添加 HTML 而不是 JavaScript，所以不要试图在项目的这部分使用 `script`\
  \ 标签：\n\n```html\n<a href=”#”  onmouseover=”set_status(‘hello’);”  onmouseout=”clear_status();”>testing</a>\n\
  ```\n- 在浏览器中加载页面，并观察鼠标移动到链接上时发生了什么。\n- 链接 `href` 属性的 `#` 值允许我们在页面上定义一个“死”链接。点击该链接将带你不去任何地方——试一下。\n\
  - 现在，修改代码，使链接指向你已知的真实网站。\n- 现在点击链接将带你离开页面。假设我们想要抑制这种行为。\n- 当事件处理器拦截事件时，它会暂停事件的正常动作。例如，如果你在链接上使用\
  \ `onclick` 处理器来弹出一个警告框，那么只有在警告框关闭后链接才会被触发。我们可以通过使用处理器的返回值，在需要时取消动作。\n- 在 `head`\
  \ 区域的 `script` 元素中添加一个新函数：\n\n```javascript\nfunction confirm_link( )\n{\n  check\
  \ = confirm：“This will take you  away from our site. Are you sure?”); return check;\n\
  }\n```\n- `check` 的值将为 `true` 或 `false`。\n- 现在修改你的链接以包含以下事件处理器：\n\n`onclick=”return\
  \ confirm_link();”`\n- 通过在事件处理器中使用 `return` 单词，函数的响应将用于决定是否执行剩余的正常动作。在这种情况下，如果 `confirm_link()`\
  \ 返回 `false`，我们的链接动作将被取消。\n- 在浏览器中加载你的页面并查看结果。\n\n# 22 处理图像\n\n## 关键点\n\n- 在 HTML\
  \ 中，我们使用 `id` 属性来标识页面上的元素。例如，为了标记图像，我们可以使用以下代码：\n\n```html\n<img src=”logo.gif”\
  \ alt=\"\" id=”theLogo” />\n```\n- 在 JavaScript 中引用此元素，现在可以通过它的 `id` 获取：\n\n`document.getElementById(“theLogo”)`\n\
  - 该方法将返回一个指向该元素的对象。如果找不到此类元素，它将返回 `false`。\n- 为了方便使用，我们将找到的对象赋值给变量。例如，在脚本中创建一个名为\
  \ `our_logo` 的对象，我们可以使用以下代码：\n\n`our_logo = document.getElementById(“theLogo”);`\n\
  - 结果对象有很多属性。由于在这种情况下它代表一个图像元素，它的属性包括：\n\n`our_logo.height`, `our_logo.width`, `our_logo.src`\n\
  - 我们可以使用 JavaScript 更改这些任何属性，所以如果我们想更改显示的图像，可以这样操作：\n\n`our_logo.src = “new_logo.gif”;`\n\
  \n## 项目\n\n- 打开你之前的项目文件，并将其另存为 `chapter_21.html`。\n- 清除你 `script` 标签中的所有 JavaScript\
  \ 代码。\n- 确保你在 `head` 区域有一个 `script` 元素，且 `body` 区域没有。\n- 在页面的 `body` 区域，创建一个从 `images`\
  \ 文件夹加载图像的图像元素。给元素一个适当的 `id` 属性。\n- 在 `head` 区域的 `script` 元素中，定义一个名为 `describe_image()`\
  \ 的函数，将弹出一个警告框，包含关于你的图像的以下信息：\n\n使用的图像文件 图像宽度 高\n- 要让每段文本单独行显示，你可以在警告文本中添加以下字符：\n\
  \n`\\n`\n\n例如\n\n`alert(“line one\\nLine two”);`\n\n- 在浏览器中加载页面并查看结果。\n\n# 23 简单的图像悬停\n\
  \n## 关键点\n\n- 简单的图像悬停是当鼠标出现在页面上的图像（通常是链接按钮）上时发生的一种效果。原始图像被另一个大小相同的图像替换，通常产生按钮以某种方式高亮的效果。\n\
  - 通过到目前为止学到的知识，我们已经有了创建简单图像悬停效果的能力。剩下的只是澄清过程的细节：\n- 页面加载，原始图像按照 `<img>` 标签的 `srᴄ`\
  \ 属性出现。\n- 鼠标移动到图像上，替代图像被加载到位置。\n\n\n\n\n\n- 鼠标离开图片后，原始图片将重新加载。\n- 正如你可能已经意识到的，我们将使用\
  \ JavaScript 来更改 `<img>` 标签的 `src` 属性。理解此点的方式是将 `<img>` 标签想象成页面上的一个简单空间，图像文件可以加载到其中。`src`\
  \ 属性告诉浏览器要在该空间内加载哪张图片，因此如果我们更改了该值，图片就会发生变化。\n- 换句话说，`<img>` 标签的 `id` 属性是在命名这个“空间”，而不是图片本身。\n\
  - 现在，为了用 JavaScript 修改 `src` 属性，我们需要告诉 JavaScript 我们想要修改哪一个“空间”。我们使用上一章中的 `id` 属性结合\
  \ `getElementById()` 方法来实现这一点：\n\n```\nbutton_img = document.getElementById(\"button\"\
  ); button_img.src = “new_image.jpg”;\n```\n\n- 我们可以直接将这段代码插入到图片的事件处理程序中：\n\n```html\n\
  <img src=”old.jpg” id=”button” onmouseover=”document.getElementById('button').src\
  \ = ’new.jpg’;\">\n```\n\n- 注意，这段代码突然变得非常复杂。这里有两个即时的潜在解决方案。第一种是定义一个函数：\n\n```javascript\n\
  function swap_image( id, new_image )\n{\n  img = document.getElementById(id); img.src\
  \ = new_image;\n}\n```\n\n…\n\n```html\n<img src=”old.jpg” id=”button” onmouseover=”swap_image('button’,\
  \ ‘new.jpg’);\">\n```\n\n- 这是一个干净得多的解决方案，更重要的是，我们可以通过简单更改函数调用的参数，将此应用于页面上的任何图片。我们还可以使用该函数来实现“换回”的功能：\n\
  \n```html\n…\n<img src=”old.jpg” id=”button” onmouseover=”swap_image('button’, ‘new.jpg’);”\
  \ onmouseout=”swap_image('button’, ‘old.jpg’);\">\n```\n\n- 尽管如此，我们还可以进一步“清理”代码。由于事件处理程序被用于修改正在触发事件的对象（即鼠标正移动到我们试图更改的图片标签上），我们可以使用具有“自动魔法”的\
  \ JavaScript 对象 `this` 来执行操作：\n\n```javascript\nfunction swap_image( img, new_image\
  \ )\n{\n  img.src = new_image;\n}\n```\n\n…\n\n```html\n<img src=”old.jpg” id=”button”\
  \ onmouseover=”swap_image(this, ‘new.jpg’);\">\n```\n\n- 注意几点。首先，`this` 周围没有引号——我们像使用变量名一样使用它。其次，我们的函数现在直接使用第一个参数，而不是使用它从页面中获取相关对象。我们可以这样做是因为\
  \ `this` 实际上是一个对象——它会获得调用它时所属的任何对象的属性和方法，在本例中，它等同于 `document.getElementById('button’`，尽管显然要短得多！\n\
  \n- 使用 `this` 有一些局限性。例如，如果我们想在鼠标移动到“button”上时更改页面上任何其他图片的 `src` 属性，我们将无法使用 `this`，因此必须定义另一个接受\
  \ `id` 作为参数的函数，并以这种方式获取相关对象。\n\n## 项目\n\n- 从网络驱动器复制名为 `buttons` 的文件夹到你的项目文件夹。\n\
  - 打开你之前的项目文件，并将其保存为 `chapter_23.html`。\n- 清除你脚本标签中的所有 JavaScript 代码。\n- 确保你在文档的\
  \ head 区域有一个 script 元素，且 body 区域没有。\n- 在页面的 body 区域内，创建一个包含六个 `<img>` 元素的段落。设置图片的\
  \ `src` 属性以加载你复制的 `buttons` 文件夹中的以下文件，并给每个图片一个合理的 `id`：\n    - `contacts.jpg`\n\
  \    - `home.jpg`\n    - `people.jpg`\n    - `produckts.jpg`\n    - `quotes.jpg`\n\
  \    - `whatsnew.jpg`\n- 在 head 区域的 script 元素中创建一个 JavaScript 函数，接收两个参数——一个 `id`\
  \ 和一个文件名。它应该将相应图片对象的 `src` 属性更改为给的文件。\n- 使用此函数在鼠标移动到图片上时，将 `contacts` 按钮的 `src`\
  \ 切换到 `contactsover.jpg`。\n- 一旦运行正常，更新其余五张图片，添加事件处理程序以将它们的 `src` 属性切换到相应的“悬停”图片。\n\
  - 为所有六张图片添加事件处理程序，以确保当鼠标移开时，它们能恢复原始状态。在浏览器中检查你的工作。\n- 在前一个段落上方新建一个段落，并在添加一个 `<img>`\
  \ 标签，包含图片文件夹中的 `rocollogo.jpg` 文件。\n- 在两个段落之间的新段落中添加一个文本链接。该链接应该是“虚拟”链接（即使用 `#`\
  \ 作为其 `href` 属性值），但当鼠标移动到它上时，上方的图片应该更改为显示 `rocollogo.gif`。\n- 鼠标离开文本链接应该让 logo 回到之前的状态。\n\
  - 在浏览器中检查你的工作。\n\n# 24 对象实例化与更好的悬停效果\n\n## 关键点\n\n- 到此为止，我们看到了一个非常简单的图片悬停示例。它是功能性的并且按预期工作，但缺乏一些细节处理。\n\
  - 具体来说，当我们使用 JavaScript 更改 `<img>` 标签的 `src` 属性时，浏览器必须从头加载这张图片。在我们的本地机器上，这不会引起明显的延迟，但在处理远程服务器时（我们将在互联网上操作），这种延迟会导致明显的“卡顿”，从而破坏动态界面的感。。\n\
  - 理想情况下，我们希望指示浏览器在加载页面时加载任何备用图片。这将让我们确保新图片已经在用户的计算机上，准备好随时切换。\n- 为了实现这一点，我们需要查看对象变量和对象实例化（或创建）。特别是，我们需要查看\
  \ `Image` 对象。\n- 页面上的每个 `<img>` 标签在 JavaScript 中都有一个对应的对象。我们已经看过了直接操作它们的方法，并对 Image\
  \ 对象可能具有的一些属性有了了解。\n- 然而，我们可以直接在 JavaScript 中创建 Image 对象，而不需要在页面上有相应的 `<img>` 标签。当我们创建一个这样的对象并设置其\
  \ `src` 属性时，浏览器会将适当的文件加载到内存，但不会在页面上显示图片。\n- 换句话说，我们可以创建存在 JavaScript 内部的“虚拟”图片，并使用这些对象来存储我们“真实”图片的备用图片。\n\
  - 要创建一个 Image 对象（实际上是创建任何对象），我们需要使用以下代码：\n\n```javascript\nvirtual_image = new Image();\n\
  ```\n\n- 我们以前见过这种语法——使用 `new` 关键字告诉 JavaScript 我们正在创建一个新对象。赋值中的 `virtual_image`\
  \ 部分只是一个变量名。在这种情况下，该变量是一个对象变量，因为它包含一个对象。\n- 使用此变量来预加载我们的图片，我们利用了它与其他任何图片具有相同属性和方法的特性：\n\
  \n```javascript\nvirtual_image.src = “contactsover.jpg”;\n```\n\n- 浏览器现在将预加载我们的图片，准备在稍后切换。\n\
  \n## 项目\n\n- 打开你之前的项目文件，并将其保存为 `chapter_24.html`。\n- 从你之前的代码开始，在页面的 head 区域 script\
  \ 元素中创建一个名为 `preload_images` 的新函数。\n- 使用此函数创建七个新对象，并使用每个对象对应的对象变量预加载你的“悬停”变体。\n\
  - 在浏览器中检查你的工作，确保图片切换仍然按预期工作。\n- 将你的 `preload_images` 函数添加到页面的 body 标签中，以确保它在页面完成后运行。使用以下语法：\n\
  \n```html\n<body onload=”preload_images();\">\n```\n\n\n\n\n\n-   一旦你验证了图像切换仍按预期工作，请扩展你的\
  \ `preload_images` 函数以定义一个要加载的图像数组，然后使用 `for` 循环遍历该数组，并将每个图像赋值给对象变量的 `sr` 属性。提示：对象变量可以是任何可以存储信息的内容——例如一个数组元素。\n\
  -   在浏览器中检查你的工作。\n\n# 25 浏览器窗口的操作\n\n## 关键点\n\n-   使用标准的 HTML 链接，我们可以打开新的浏览器窗口：\n\
  \n```html\n<a href=\"#\" target=\"_new\">link</a>\n```\n\n-   然而，这种方法对结果图像的控制力为零。我们无法通过这种方法控制窗口的大小、形状、在屏幕上的位置或其他任何属性。\n\
  -   正如我们预期的，JavaScript 允许我们进行更精细的控制：\n\n```javascript\nwindow.open( page_url, name,\
  \ parameters );\n```\n\n-   从上面的原型可以看出该方法只能接受三个参数。然而，`parameters` 参数实际上比我们想象的要复杂：\n\
  \n`\"param1,param2,param3,param4…\"`\n\n因为我们可以用它为该方法添加许多参数。注意参数列表中没有空格。\n-   `name`\
  \ 用于为窗口指定 HTML 名称——这样我们就可以使用该名称通过上面的 `target` 方法将链接打开到新窗口中。\n-   `open` 方法的返回值是一个指向新打开窗口的对象变量。换句话说，如果我们这样打开一个新窗口：\n\
  \n```javascript\nwin = window.open(\"page.html\", \"\", \"\");\n```\n\n我们可以使用对象变量\
  \ `win` 通过 JavaScript 修改该新窗口。\n-   一个实际示例——假设我们想打开一个高 300 像素、宽 400 像素的新窗口，并在其中显示\
  \ BBC 新闻页面。以下代码即可：\n\n```javascript\nwindow.open(\"http://news.bbc.co.uk/\", \"\
  bbc\", \"width=300,height=300\");\n```\n\n-   下表列出了一些可用参数：\n\n| 参数 | 值 | 功能 |\n\
  | :--- | :--- | :--- |\n| location | Yes/no | 决定是否显示位置栏（地址栏） |\n| menubar | Yes/no\
  \ | 决定是否显示菜单栏 |\n| status | Yes/no | 决定是否显示状态栏 |\n| width | Pixels | 指定新窗口的宽度 |\n\
  | height | Pixels | 指定新窗口的高度 |\n| resizable | Yes/no | 允许或不允许调整窗口大小 |\n| scrollbars\
  \ | Yes/no | 允许或不允许窗口滚动条 |\n\n-   如果没有设置任何参数，则每个参数的值在适当的情况下将被设置为“yes”。例如：\n\n```javascript\n\
  window.open(\"http://www.bbc.co.uk/\", \"bbc\", \"\");\n```\n\n等同于：\n\n```html\n\
  <a href=\"http://www.bbc.co.uk/\" target=\"bbc\">\n```\n\n-   但是，如果设置了任何参数，所有其他参数都将默认为“no”。所以，如果你想要滚动条而不要其他任何功能，使用以下代码即可：\n\
  \n## 项目\n\n```javascript\nwindow.open(\"http://www.bbc.co.uk/\", \"bbc\", \"scrollbars=yes\"\
  );\n```\n\n-   打开你之前的项目文件，并将其保存为 `chapter_25.html`。\n-   移除你之前文件中所有的函数和 HTML，只保留\
  \ logo 图像和链接。\n-   在 head 区域 script 元素中创建一个 `view_new_logo` 的函数。该函数应该：\n    -  \
  \ 打开一个 200 像素的正方形窗口。\n    -   从 images 文件夹加载图像 `rocollogo.jpg`。\n    -   名为 `RocolLogo`。\n\
  \    -   存储在名为 `objNewLogo` 的对象变量。\n    -   无滚动条，固定大小，并且尽可能没有其他功能。\n-   移除链接上所有的事件处理器，并添加一个新的处理器，以便在点击链接时运行上述函数。\n\
  -   一旦你验证了点击链接时按需弹出窗口，请在函数中测试上表中的每个参数。\n\n# 26 浏览器窗口的定位\n\n## 关键点\n\n-   `screen`\
  \ 对象允许你在 JavaScript 应用中访问用户计算机显示屏的属性。\n-   一些可用属性是：\n\n| 属性 |  |\n| :--- | :---\
  \ |\n| availHeight | 用户屏幕的像素高度减去工具栏和任何其他永久对象（例如 Windows 任务栏） |\n| availWidth | 与\
  \ availHeight 类似，但处理的是水平空间 |\n| colorDepth | 用户屏幕可以显示的最大颜色数（位格式，例如 24 位、16 位等） |\n\
  | height | 用户显示器的真实像素高度 |\n| width | 用户显示器的真实像素宽度 |\n\n-   `open()` 方法的 `left` 和\
  \ `top` 参数允许你通过指定距离屏幕左侧和顶部的像素数，来指定窗口在屏幕上的位置。\n-   如果你需要使用变量来指定 `open()` 方法中的参数值，操作方法如下：\n\
  \n```javascript\nwindow.open(\"index.html\", \"window_name\", \"width=200,height=200,left=\"\
  +var_left+\"top=\"+var_top);\n```\n\n其中 `var_left` 和 `var_top` 是相应的变量。\n-   注意使用\
  \ `+` 运算符，以确保在添加变量时，`open()` 方法的第三个参数保持为一个字符串。\n-   为了让窗口在用户屏幕上居中，需要简单的几何计算。屏幕的中心显然是屏幕宽度除以二和屏幕高度除以二得到的点。然而，如果我们将窗口的\
  \ top 和 left 值设置为这些坐标，那么窗口的左上角将居中，而不是窗口本身。\n-   为了让窗口居中，我们需要从 top 值中减去窗口高度的一半，从\
  \ left 值中减去窗口宽度的一半。实现此点的脚本如下：\n\n```javascript\nwin_width = 200;\nwin_height = 200;\n\
  win_left = (screen.availWidth/2) - (win_width/2);\nwin_top = (screen.availHeight/2)\
  \ - (win_height/2);\n```\n\n-   通过使用此脚本，`win_left` 和 `win_top` 的值将正确设置，适用于任何适当使用\
  \ `win_width` 和 `win_height` 在屏幕居中的窗口。\n\n## 项目\n\n-   打开你之前的项目文件，并将其保存为 `chapter_26.html`。\n\
  -   修改现有的代码以确保 logo 在用户屏幕上居中显示。如果可能，不要修改你的原始函数，只需添加两个新函数——`get_win_left(width)`\
  \ 和 `get_win_top(height)`。\n\n# 27 聚焦与失焦\n\n## 关键点\n\n-   `window` 对象的 `focus()`\
  \ 方法为特定窗口赋予焦点。换句话说，它确保窗口置于任何其他窗口之上，并由计算机激活。例如，如果我们创建了一个新窗口并将结果存储在名为 `new_window`\
  \ 的对象变量中，我们可以在窗口打开后的任何时候使用以下代码确保该窗口被带到最前面：\n\n```javascript\nnew_window.focus();\n\
  ```\n-   相反，我们可以使用 `blur()` 方法移除指定窗口的焦点——在需要时将焦点返回给之前选中的窗口。它的用法与 `focus()` 方法类似。\n\
  -   这两个事件都有关联的事件处理器：`onblur` 和 `onfocus`。然而，由于它们没有关联的 HTML 标签，我们如何将事件处理器附加到对象上？\n\
  -   事实证明，在 JavaScript 中，每个对象对于它可以应用的每个事件处理器都有一个独立的属性。例如，如果我们想为页面上的 img 标签添加事件处理器，可以使用以下方法之一来实现：\n\
  \n```html\n<img src=\"...\" id=\"test_img\" onclick=\"do_something(); />\n```\n\n\
  ```javascript\ndocument.getElementById(\"test_img\").onclick=do_something();\n```\n\
  \n-   因此，要为窗口的 `onfocus` 事件附加函数，我们可以使用：\n\n## 项目\n\n```javascript\nnew_window.onfocus\
  \ = some_function();\n```\n\n-   打开你之前的项目文件，并将其保存为 `chapter_27.html`。\n-   修改你的函数，在打开原始窗口的同时也打开另一个窗口，并具备以下功能：\n\
  \n\n\n\n\n*   第二个窗口应命名为 `oldRocolLogo`，赋值给对象变量 `objOldLogo`，并显示文件 `images/rocollogo.gif`\
  \ 中的旧 logo。\n\n*   打开时，窗口的位置应该合理，使得两个窗口都能被清晰看到。\n\n    *   在此处测试你的修改。\n    *   观察窗口打开时函数的动作，然后将原始窗口置于它们前面并再次调用该函数。\n\
  \    *   在函数中添加一条新语句，使用 `focus()` 方法来确保在调用该函数时，两个新窗口都移动到窗口“栈”的最顶端。\n    *   观察当函数被调用时，哪个\
  \ logo 显示在“上方”。再次使用 `focus()` 方法改变这种状态。\n\n# 28 动态创建内容\n\n## 关键点\n\n*   使用 JavaScript\
  \ 按需需创建一个新页面其实非常简单。在这种背景下，我们讨论的是在不向该窗口加载任何文件的情况下，在窗口中创建一个全新的页面。要做到这一点，调用 `window`\
  \ 对象的 `open()` 方法，并将位置参数留空：\n\n```javascript\nnew_win = window.open(\"\", “newWin”,\
  \ “params…”);\n```\n\n*   接下来，请记住你可以使用窗口的 `document.write()` 方法向页面写入 HTML 代码。到目前为止，我们只使用了当前窗口的\
  \ `document` 对象。然而，我们可以按照如下方式指定想要操作哪个窗口的 `document`：\n\n```javascript\ndocument.write();//\
  \ 写入当前窗口\nnew_win.document.write(); // 或写入新窗口\n```\n\n例如：\n\n## 项目\n\n```javascript\n\
  new_win.document.write(“<html><head>”); new_win.document.write(“<title>demo</title>”):\
  \ new_win.document.write(“</head><body>””); new_win.document.write(“<h1>Hello!</h1>”);\
  \ new_win.document.write(“</body></html>”);\n```\n\n*   打开你之前的项目文件，并将其将其保存为 `chapter_28.html`。\n\
  \n*   修改现有的脚本以创建一个具有以下属性的第三窗口：\n    *   窗口应命名为 `newHTML`，并赋值给对象变量 `objNewHTML`。\n\
  \    *   它的大小应为 400 像素正方形。\n    *   创建时不应加载任何页面。它应该以 `H1` 标题的形式显示单词“Welcome”。\n\
  \    *   它应该包含一个文本为“Please decide which logo you would like to choose.”的段落。\n  \
  \  *   第三窗口标题为“Rocol Art”。\n    *   当所有窗口都打开后，第三个窗口应被赋予焦点。\n\n*   在浏览器中检查你的工作结果。\n\
  \n# 29 多个窗口的操作\n\n## 关键点\n\n*   `window` 对象的 `close()` 方法允许你关闭窗口。如果你在当前窗口中有一个指向你想要关闭的窗口的对象变量，你可以直接使用：\n\
  \n```javascript\nnew_window.close();\n```\n\n*   当你想要从打开新窗口的另一个窗口关闭该窗口时，情况会变得复杂一点。为了解决这个问题，我们需要考虑窗口作用域（scope）。\n\
  \n*   当我们在代码中编写 JavaScript 时，该脚本中的所有函数和变量供我们在该窗口内使用。例如，如果我们在主窗口中有一个名为 `say_hello()`\
  \ 的函数，我们可以很容易地调用该函数。然而，如果我们想从一个新打开的窗口调用该函数，就无法从新窗口中直接调用它，因为我们的函数和变量“绑定”在它们最初被定义的窗口中的。\n\
  \n*   这就是为什么当我们想要向包含 JavaScript 代码的窗口之外的任何窗口写入内容时，我们必须访问该窗口的 `document` 对象以便将内容放在正确的位置。\n\
  \n*   但反过来又呢？假设我们在主窗口（称为窗口 1）中使用一个函数来打开一个新窗口（窗口 2）。如果我们将窗口 2 存储为对象变量，就可以通过该对象从窗口\
  \ 1 访问窗口 2 的所有属性。问题是，我们如何从窗口 2 访问窗口 1 的任何属性呢？\n\n*   关键在于窗口 2 和窗口 1 之间存在特殊的关系——“父/子”关系。我们可以通过名为\
  \ `opener` 的特殊对象从窗口 2 访问窗口 1 的任何属性。这是在任何由 JavaScript 打开的窗口内创建的对象，它始终引用打开新窗口的窗口。\n\
  \n*   为了说明这一点，让我们考虑之前的项目。我们有三个新窗口和一个“父”窗口。如果我们想在其中一个新窗口上使用事件处理器来关闭另一个新窗口，我们需要首先访问父窗口，然后访问父窗口内指向我们想要关闭的窗口的对象变量。\n\
  \n*   假设我们想从窗口 1 中的一个链接关闭 `window_2`。我们必须在链接中创建一个带有以下代码的事件处理器：\n\n## 项目\n\n```html\n\
  onclick=”opener.window_2.close();”\n```\n\n*   打开你之前的项目文件，并将其保存为 `chapter_29.html`。\n\
  \n*   修改现有的脚本以实现以下功能：\n    *   在第三窗口的内容中添加两个新段落，包含以下文本：\n      Old Logo The New\
  \ Logo\n    *   每行都应该包含在一个超链接中，其事件处理器访问父窗口中指向相应新窗口的对象变量。然后应调用其 `close()` 方法。\n\n\
  *   在浏览器中检查你的工作结果。\n\n# 30 使用外部脚本文件\n\n## 关键点\n\n*   JavaScript 可以轻松让我们避免手动输入大量的\
  \ HTML。正如我们所看到的，我们可以使用少量的代码通过 JavaScript 生成大型表单元素和表格。这对我们来说是个好消息，因为它让我们的工作变得更容易。这对我们的访问者来说也是一个好消息，因为他们只需要下载少量的代码就可以获得相对大量的内容。\n\
  \n*   然而，我们可以做得更好。在目前，如果我们有一个函数用于为表单出生日期部分生成年份下拉菜单，我们需要在每个需要它的页面中都包含该函数。这意味着我们的访问者多次下载相同的内容。此外，如果我们更改或改进了函数，就必须在包含该函数的每个页面中更新它。\n\
  \n*   HTML 允许我们通过提供一种将外部文件加载到页面并将其内容视为 JavaScript 的机制来解决这个问题。由于它是一个独立的文件，一旦它被下载，如果另一个页面请求它，浏览器将不再下载额外的副本。换句话说，我们可以将所有的\
  \ JavaScript 加载到一个文件中，那里的任何更改将立即反映在整个网站上。\n\n*   要使用外部文件中的代码，我们仍然使用 `<script>` 标签，但要使用一个新属性\
  \ `src`。这与将图像文件加载到页面非常相似：\n\n```html\n<script language=\"JavaScript\" type=\"text/JavaScript\"\
  \ src=\"script.js\"></script>\n```\n\n*   注意以下三点：\n\n## 项目\n\n*   `language` 和 `type`\
  \ 属性在这里是关重要的。\n*   `script` 标签仍然有一个闭合标签 `</script>`。\n*   当我们使用标签加载外部文件时，不能在标签之间添加任何额外的\
  \ JavaScript。若要仅向当前页面添加 JavaScript，我们必须使用第二组 `<script>` 标签。\n\n*   打开你之前的项目文件，并将其保存为\
  \ `chapter_30.html`。\n\n*   将你所有的 JavaScript 函数定义以及 head 部分 script 元素中的任何其他代码移动到一个名为\
  \ `script.js` 的新文件中。\n\n*   修改你的 head 部分 script 元素，以从新文件加载代码。\n\n*   检查你的页面仍然按预期工作。\n\
  \n*   注意：`.js` 文件扩展名只是一个命名约定。\n\n# 31 JavaScript 与表单\n\n## 关键点\n\n\n\n\n\n# 简介\n\
  \n*   如果没有 JavaScript，服务器将处理所有通过表单提交的信息的验证和处理。在客户端使用 JavaScript 可以为用户节省时间，并创建一个更高效的流程。\n\
  *   部分处理可以由 JavaScript 完成（例如，数学计算），并且 JavaScript 可以确保只有正确的数据被发送到服务器进行处理。\n*   JavaScript\
  \ 与服务器端处理结合使用——它不是后者的替代品。\n*   要访问表单中的信息，我们使用 `document` 对象的 `getElementById()`\
  \ 方法，就像我们之前访问页面上的其他对象一样。例如，如果我们在页面上有像这样的一个表单：\n\n```html\n<form id=”testForm” …\
  \ >\n</form>\n```\n\n我们将在 JavaScript 中通过以下方式访问它：\n\n```javascript\ndocument.getElementById('testForm');\n\
  ```\n\n*   生成的对象实际上是一个多维数组。它的每一个元素本身都是一个数组，其中包含了有关表单元素（文本框、按钮等）的信息。通过在适当的 `<INPUT>`\
  \ 标签中为表单的每个元素正确命名，你可以访问与表单的每个元素相关的信息。\n*   要访问存储在 id 为 `Enquiry` 的表单中名为 `Name` 的文本框中的数据，你使用如下的\
  \ `value` 属性：\n\n```javascript\nobjForm = document.getElementById('Enquiry');\n\
  strValue = objForm.Name.value\n```\n\n*   向服务器发送表单数据有两种方法。使用 `method` 属性，你可以指定 `GET`\
  \ 或 `POST` 方法：\n\n```html\n<form id =”enquiryform” method=”GET”…\n```\n```html\n\
  <form id =”enquiryform” method=”POST”…\n```\n\n*   通常情况下，如果你想从表单发送大量数据（例如文件、大量文本），应该使用\
  \ `POST` 方法。如果你想处理搜索表单等，应该使用 `GET`，因为 `GET` 表单将像 URL 一样被传输，因此可以作为书签或链接被“保存”。\n*\
  \   通常，你会将表单发送到服务器端脚本，该脚本由表单的 `action` 属性指定：\n\n```html\n<form id=”enquiryform”\
  \ method=”GET”\n→ action=”process.php”…\n```\n\n*   当用户点击表单的提交（Submit）按钮时，在没有 JavaScript\
  \ 干预的情况下，表单数据将直接发送到服务器进行处理。但通过在 `<form>` 标签中包含 `onsubmit` 事件处理器，你可以在发送之前拦截数据（这样就可以用\
  \ JavaScript 对其进行处理）。这允许你在发送数据之前运行 JavaScript 函数：\n\n```html\n<form id=”enquiryform”\
  \ method=”GET”\n→ action=”process.php”\n→ onsubmit=”functionName()”>\n```\n\n* \
  \  在上面的示例中，当用户点击提交按钮时，首先运行函数 `functionName()`，然后将数据发送到服务器。\n*   当表单提交触发 submit 事件时，浏览器会等待发现事件处理器返回了什么。默认情况下，事件处理器将返回\
  \ `true`。然而，如果事件处理器返回 `false` 值，表单的提交将被中止，页面将不会提交到服务器。\n*   通过从你的函数中返回 `true` 或\
  \ `false` 值（在上面的示例中 `functionName()`），并确保该值也是 `onsubmit` 事件处理器的返回值，你可以决定表单数据是否真的被发送到服务器。\n\
  *   你通过以下方式指定函数的返回值也是 `onsubmit` 事件处理器的返回值：\n\n```javascript\nonsubmit=\"return\
  \ functionName();\n```\n\n## 项目\n\n*   打开你之前的项目文件，并将其另存为 `chapter_31.html`。\n* \
  \  清除页面 body 元素中的任何内容，并确保 head 区域的脚本 (script) 元素中没有代码。\n*   将此页面另存为 `processing_31.html`，并在\
  \ body 区域放置一个显示“success!”的 <h1> 元素。\n*   现在，关闭你的 `processing_31.html` 页面，并在原始的 `chapter_31.html`\
  \ 页面上使用 HTML 创建表单——如果你在在这方面有困难，导师将提供一个示例供复制。你的表单应该：\n    *   拥有 `id` 为 `jsCourseForm`。\n\
  \    *   有一个 `name` 值为 `name` 的单个输入框。\n    *   有一个提交按钮。\n    *   使用 `GET` 方法提交。\n\
  \    *   其 `action` 属性为 `processing_31.html`。\n    *   有一个 `onsubmit` 事件处理器，返回（尚不存在的）`check_form()`\
  \ 函数的值。\n*   现在，在 head 区域的脚本元素创建一个名为 `check_form()` 的函数。该函数应该：\n    *   使用 `document`\
  \ 的 `getElementById()` 方法将表单对象的引用存储在一个对象变量中。\n    *   将表单的 name 元素的值存储在另一个变量中。\n\
  \    *   如果 name 元素的值不是“Bugs Bunny”，应该弹出一个警告框显示：\n      抱歉，朋友！你拼错了名字……或者你还没实力……再试一次。\n\
  \    *   此外，应该阻止表单提交。\n*   然而，如果用户输入了正确的名称，表单应该无中断地提交。\n*   在浏览器中检查你的工作。\n\n# 32\
  \ 表单方法与事件处理器\n\n## 关键点\n\n*   每个表单元素（例如文本框、按钮等）都有一组相关的属性。这些属性对于不同的元素不同。`value` 属性是大多数表单元素通用的。\n\
  *   你可以将存储在 id 为 `Enquiry` 的表单中名为 `Name` 的文本框中的数据赋值给变量，如下所示：\n\n```javascript\n\
  variable = document.getElementById('Enquiry');\n→ variable.value\n```\n\n*   表单对象也有与之关联的方法。这些方法对于每个表单对象不同。\n\
  *   以下是文本对象的常用方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `blur()` | 移除文本框焦点 |\n| `focus()`\
  \ | 文本框焦点 |\n| `select()` | 选中文本框 |\n\n*   以下是按钮对象的常用方法：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `blur()` | 移除按钮焦点 |\n| `focus()` | 按钮焦点 |\n| `click()` | 调用按钮的 `onclick`\
  \ 事件处理器 |\n\n*   表单对象也有与之关联的事件处理器。这些处理器对于每个表单对象不同。\n*   以下是文本对象的常用事件处理器：\n\n| 事件处理器\
  \ | 在运行时运行 JavaScript |\n| :--- | :--- |\n| `onblur` | 文本框失去焦点时。 |\n| `onfocus`\
  \ | 文本框获得焦点时。 |\n| `onselect` | 用户选中文本框中的某些文本时 |\n| `onchange` | 文本框失去焦点且内容被修改过时\
  \ |\n\n*   以下是按钮对象的常用事件处理器：\n\n| 事件处理器 | 在运行时运行 JavaScript |\n| :--- | :--- |\n\
  | `onBlur` | 按钮失去焦点时 |\n| `onFocus` | 按钮获得焦点时 |\n| `onClick` | 用户点击按钮时 |\n\n*  \
  \ 最后，如果你要向服务器发送数据，提交按钮不是唯一的方法。你可以在事件处理器调用的函数中使用 `submit()` 方法。这种操作就像点击了提交按钮一样：\n\
  \n```javascript\ndocument.getElementById('Enquiry').submit();\n```\n\n## 项目\n\n\
