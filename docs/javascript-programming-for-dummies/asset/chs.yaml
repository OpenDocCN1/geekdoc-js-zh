  \ `for` 循环在页面上显示日历，如下所示：\n\n```\nMonday: task\nTuesday: task 等…\n```\n\n- 修改你的代码，使用提示框（prompt）让访问者选择一天，并在页面上显示给那一天的任务。\n\
  \n# 17 二维数组\n\n## 核心要点\n\n- 回到我们之前的邮箱箱类比，我们的数组可以被想象成一排邮箱箱，每个邮箱都有自己的内容和标签，那么二维数组可以被看作这些邮箱箱排堆叠在一起的一系列排。\n\
  - 实际上，二维数组仅仅是一个其每个元素本身也是数组的数组。二维数组的每个“子数组”可以是不同的长度——换句话说，二维数组不必是“正方形”的。\n- 你可以使用两对方括号而不是仅仅一对来访问每个子数组的内容。一个示例将最好说明这一点：\n\
  \n```javascript\narray_1 = [\"element”, “element 2”];\narray_2 = [\"another element”,\
  \ 2, 98, true]; array_3 = [array_1, array_2]; alert(array_3[1][3]); // 显示 “98”\n\
  ```\n\n- 虽然你不能在单个数组中混合数值和字符串索引系统（即数组不能既是数值的又是关联的），但你可以在二维数组中同时拥有关联数组数值数组。例如，将上述内容重构如下：\n\
  \n```javascript\narray_3 = new Array(); array_3[\"firstArray\"] = array_1; array_3[\"\
  secondArray\"] = array_2;\nalert(array_3[\"secondArray”][3]);\n// 再次显示 “98”\n```\n\
  \n- 同样，我们可以愉快地对关联数组使用我们的“对象”表示法：\n\n## 项目\n\n```javascript\nalert(array_3.secondArray[3]);\n\
  // 再次显示 “98”\n```\n\n- 打开你之前的项目文件，并将其保存为 `chapter_17.html`。\n- 在你之前项目的基础上，创建若干个新的七元素关联数组来表示\
  \ 4 个独立的周。\n- 将这 4 周合并成一个四元素数组来表示一个月。\n- 修改你之前的代码，接收一个周数并将该周的所有活动打印到页面上。\n- 修改其中一个周数组，使其不再由单个元素组成，而是由从早上\
  \ 8 点到下午 5 点的小时数组组成。这就代表了一个三维数组。我们可以将数组扩展为 n 维，其中 n 基本上是任意的。\n- 最后，修改你的代码以提示用户输入三个值——周、一天和一小时。将这些值存储在三个独立的变量中，并使用这些变量显示请求的任务，否则显示错误信息。\n\
  \n# 18 字符串处理\n\n## 核心要点\n\n- 在使用 JavaScript 的过程中，你经常会使用字符串来处理字符串，并根据发现的结果进行操作。\n\
  - 我们已经看到过通过相等性来检查字符串。然而，这种全有或无的方法并不够细致。\n- 考虑我们需要根据已知列表来检查用户名称的情况。如果用户输入的是“Karen”，例如，这种方法取决于大小写是否匹配。\n\
  - 在这种情况下，我们想查看“Karen”是否出现在字符串中。\n- 最简单的字符串搜索之一是使用 `indexOf` 方法。每个字符串类型的变量都关联此方法。考虑以下代码：\n\
  \n```javascript\nvar_1 = “Karen Aaronofsky”; var_2 = var_1.indexOf(“Karen”);\n```\n\
  \n在这种情况下，`var_2` 的值为 0——记住 JavaScript 从 0 开始计数！\n\n- 如果我们在这里搜索姓氏：\n\n```javascript\n\
  var_1 = “Karen Aaronofsky”;\nvar_2 = var_1.indexOf(“Aaronofsky”);\n```\n\n`var_2`\
  \ 的值为 6。\n\n- 最后，如果搜索“失败”，假设我们作为子字符串搜索名称 “Anisa”，那么 `var_2` 的值将是 -1。\n- 注意这种方法更灵活，但如果用户忘记大写我们要搜索的任何子字符串，仍然存在问题——在\
  \ JavaScript 中，“Karen”不等于“karen”。\n为了解决这个问题，我们可能希望确保不考虑大小写。实现此点的的一种简单方法是在执行检查之前将字符串强制转换为小写：\n\
  \n```javascript\nreal_name = “Karen”;\nname = prompt(“你的名字是,””);\nreal_name = real_name.toLowerCase();\
  \ try_name = name.toLowerCase();\n\nif ( try_name.indexOf(real_name) > -1 )\n{\n\
  alert(“Hello Karen!”);\n}\nelse\n{\n// 注意这里我们使用了原始的、\n// 未转换为小写的名称 alert(“欢迎 ” +\
  \ name);\n}\n```\n\n- 我们有许多字符串方法可以对字符串执行“值检查”。其中一些方法打印在在下表中：\n\n| 方法 | 行为 |\n| :---\
  \ | :--- |\n| `String.indexOf(“str”)` | 返回子字符串 “str”在字符串中第一个字符的数值位置 |\n| `String.charAt(x)`\
  \ | 返回字符串中位置 x 的字符——`indexOf` 的相反操作 |\n| `String.toLowerCase()` | 返回字符串的副本，并将所有大写字母替换为小写字母\
  \ |\n| `String.toUpperCase()` | 返回字符串的副本，并将所有小写字母替换为大写字母 |\n\n\n\n\n\n| `String.match(/exp/)`\
  \ | 根据对字符串的正则表达式搜索结果返回 true 或 false |\n\n- 这里的最后一个方法值得我们说明一下。正则表达式是什么？\n\n### 什么是正则表达式？\n\
  \n 正 正则表达式是一种编写易于识别的字符“模式”的标准方法。例如，考虑一个典型的电子邮件地址：`[jonathan@relativesanity.com]`。\n\
  - 电子邮件地址遵循一种特定的“模式”，这使得人类能够一眼识别出它是一个电子邮件地址。如果我们能在 JavaScript 中定义这种模式并供浏览器使用，那不是很有用吗？正则表达式允许我们恰好做到。\n\
  - 让我们再次看那个电子邮件地址。我们可以将其拆解为如下的“原型”电子邮件地址：`[一些字母]@[更多字母].[少数几个字母]`\n- 显然，它比这要稍微复杂一些——某些字符是不允许出现在电子邮件地址的特定部分的（例如，不能有空格），但这能让你理解将此字符串拆分为所需的“分块”的思路。\n\
  - 现在，将其转换为正则表达式。就像我们在 JavaScript 中使用引号来表示（或“定界”）字符串值一样，为了表示正则表达式，我们使用正斜杠：`/`。我们的电子邮件地址正则表达式可能像这样：`/^.+@.+\\\
  ..$/`\n- 这值得一些讨论。让我们逐个字符来看：\n    - `/` 表示正则表达式的开始。\n    - `^` 表示我们希望这个正则表达式出现在我们搜索的字符串的最开头。\n\
  \    - `.+` 点符号 `.` 用于代表任何字符。加号 `+` 表示我们想要找到至少一个这样的字符。所以这等同于我们的纯英语短语 `[一些字母]`。\n\
  \    - `@` 这仅仅是一个字符——除了表示我们想在从字符串开始的至少一个字符之后找到一个 `@` 字符外，它没有其他特殊含义。\n    - `.+`\
  \ 与之前相同——在 `@` 之后至少再多于一个字符。\n    - `\\.` 这很有趣。我们知道点符号在正则表达式中有特殊含义——它意味着“匹配任何字符”。然而在这里，我们想要找到一个真正的点。与没有特殊含义的\
  \ `@` 不同，我们必须告诉 JavaScript 忽略点的特殊含义。我们通过在它前面加一个反斜杠 `\\` 来做到，这告诉 JavaScript 将紧随其后的字符视为没有特殊含义。这是你在编程过程中会遇到的很多约定。\n\
  这里的最终结果是，我们想在一系列字符之后匹配一个点。\n    - `.+` 再次，在点之后至少再多一个字符。\n    - `$` 它是开头 `^` 的镜像——这匹配测试字符串的结尾。\n\
  \    - `/` 告诉 JavaScript 我们已经到了正则表达式的结束。\n呼！这里有很多需要考虑的内容。正则表达式最好的情况下也是一门深奥的艺术，所以如果上面的代码无法理解，也不要太担心。现在重要的是意识到，我们可以在\
  \ JavaScript 中执行一些相当复杂的模式识别，而不需要多次检查字符串的每个单独字符。\n- 下面代码检查一个变量看它看起来像电子邮件地址：\n```javascript\n\
  var_1 = prompt(\"Your email?\", \"\"); \nif ( var_1.match(/^.+@.+\\..+$/) ) {\n\
  \    alert(\"valid email address\");\n}\nelse {\n    alert(\"are you sure?\");\n\
  }\n```\n- 这段代码目前存在几个问题——例如，它会顺利地通过字符串 `[-@-.-]`，这显然是错误的。我们将在课程后面的部分讨论解决方法。\n\n##\
  \ 项目\n\n- 打开你之前的项目文件，并将其保存为 `chapter_18.html`。\n- 清空 `script` 标签中所有的 JavaScript\
  \ 代码。\n- 使用提示框（prompt box）获取用户输入并赋值给名为 `check_string` 的变量。\n- 使用 `document.write`\
  \ 语句输出当应用于用户输入时，各种字符串方法的结果。\n- 检查用户输入是否为电子邮件地址，并相应地更改你的输出为“That’s an email address”（这是一个电子邮件地址）或“That\
  \ doesn’t look like an email address to me!”（在我看来这不像电子邮件地址！）。\n- 在后一种情况下，也输出失败的字符串，以便用户可以看到他们的输入并在下次适当进行修改。\n\
  \n# 19 使用函数\n\n## 关键点\n\n- 函数是一组命名的 JavaScript 语句，用于执行特定任务并出现在标准的 `<script>` 标签内部。任务可以简单也可以复杂，函数的名称由你决定，且与变量命名的限制相似。\n\
  - JavaScript 函数在使用之前会声明。声明如下：\n```javascript\nfunction name_of_function()\n{\n \
  \   …在此处编写你的代码…\n}\n```\n- 与我们目前学过的所有 JavaScript 指令不同，函数内部的代码在没有被明确请求之前不会运行。这种请求被称为函数调用。\n\
  - 函数可以从页面上 JavaScript 可以存在的任何地方调用，但必须在函数声明之后调用。例如，如果你在 `document` 的主体中声明了一个函数，然后在\
  \ `document` 的头部（head）中调用它，你可能会发现浏览器返回了错误信息。由于由于原因，大多数 JavaScript 程序员会将他们要使用的任何函数定义在页面头部部分的\
  \ `<script>` 标签之间，以确保它们在在使用之前都已定义。\n- 函数之于对象方法，就像变量之于对象属性——它们的调用方式也相似。要运行上述 `name_of_function`\
  \ 函数中的代码，我们将使用以下行代码：\n```javascript\nname_of_function();\n```\n- 注意函数名后的括号。这让 JavaScript\
  \ 知道我们正在处理的是一个函数而不是变量。括号还允许我们向函数“传递”额外信息，这可以改变它的行为。考虑以下函数：\n```javascript\nfunction\
  \ greet_user( username )\n{\n    message = \"Hello \" + username; alert(message);\n\
  }\n```\n- 每当函数被调用时，它都会问候指定的用户名。我们如何如何传递这个信息呢？考虑：\n```javascript\ngreet_user(\"Anisa\"\
  );\n```\n或者\n```javascript\nvar_1 = prompt(\"Name?\", \"\"); greet_user(var_1);\n\
  ```\n- 我们应该在代码中尽可能使用函数。每当我们执行一个无法通过使用方法或赋值运算符完成的操作时，我们应该尝试构建一个可以完成该任务的函数。\n- 例如，我们可以构建一个检查电子邮件地址的函数：\n\
  ```javascript\nfunction check_email( address )\n{\n    var_1 = false;\n    if (\
  \ address.match(/^.+@.+\\..+$/) ) {\n        var_1 = true;\n    }\n}\n```\n- 上述函数将接收一个字符串（通常称为函数的参数），并根据它的发现更改\
  \ `var_1` 的值。然而，该函数缺少一项重要的能力——将其发现的结果返回给脚本其他部分的能力。\n- 我们在笔记中提到过返回值。现在我们看到了一个需要函数将其结果返回给代码其他部分的情况。理想情况下，我们希望能够像这样使用上面的函数：\n\
  ```javascript\nif ( check_email(address) ) {\n    …执行一些邮件相关操作…\n}\n```\n- 为了让此起作用，`check_email`\
  \ 的返回值必须是一个布尔值。我们可以非常简单地安排：\n```javascript\nfunction check_email( address )\n{\n\
  \    var_1 = false;\n    if ( address.match(/^.+@.+\\..+$/) ) {\n        var_1 =\
  \ true;\n    }\n    return var_1;\n}\n```\n- 由于 `var_` 要么是 true 要么是 false，返回值将是布尔值。我们在这里甚至可以跳过变量的使用变得更加直接：\n\
  ```javascript\nfunction check_email( address )\n{\n    if ( address.match(/^.+@.+\\\
  ..+$/) ) {\n        return true;\n    }\n    return false;\n}\n```\n- 或者更好，因为 `address.match()`\
  \ 本身就会返回一个布尔值：\n```javascript\nfunction check_email( address )\n{\n    return address.match(/^.+@.+\\\
  ..+$);\n}\n```\n\n\n\n\n\n- 上述函数看起来可能并不是多么大的节省。毕竟，我们使用了四行代码来定义一个只执行一行代码的函数。对比一下：\n\
  \n```javascript\nfunction check_email( address )\n{\n  return address.match(/^.+@.+\\\
  ..+$);\n}\n\nif ( check_email(address) )\n{\n  …执行某些邮件相关操作…\n}\n```\n\n与此：\n\n```javascript\n\
  if ( address.match(/^.+@.+\\..+$/) )\n{\n  …执行某些邮件相关操作…\n}\n```\n\n- 虽然这里的处显而易见，但请考虑一种情况：在未来的某个时刻，你发现了一种更好的检查电子邮件地址的方法。在上述第二种情况下，你必须在代码中搜索该方法的每一个实例，并将其替换为你的新方法，而这个新方法可能并不有一行代码。在第一种情况下，你只需要更改底层的函数定义，这种“升级”就会在你的整个代码中生效，而无需更新每个出现的地方。\n\
