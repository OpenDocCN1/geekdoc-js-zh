  - 39 创建时钟\n- 关键点\n- 项目\n\n# 1 什么是编程语言？\n\n## 关键点\n\n- 编程语言是一组我们用来给计算机下遵循指令的代码。\n\
  - 流行且为人知的语言包括 Java、C++、OBOL、LISP 等。\n- 大多数流行的语言由与英语相似的单词和短语组成。\n- 编写良好的程序无论是否有该语言的直接经验，任何有少量编程经验的人都能读懂。这是因为现代语言共享许多概念。特别是它们都有变量、循环、条件判断和函数的概念。\n\
  \n# 2 服务端 vs. 客户端\n\n## 关键点\n\n- 世界网构建在许多不同的技术之上。\n- 对于大多数用户来说，网页的开始和结束于他们选择的浏览器。浏览器被定义为\
  \ Web 的客户端，浏览器、运行浏览器的计算机以及浏览网页的用户统称为客户端。\n- 考虑一个访问 www.google.com 的客户端，首先发生的情况是客户端向\
  \ Google 的 Web 服务器请求该网站的默认页面。\n\n\n\n\n\n-   Web 服务器是运行在 Google 拥有的计算机上的应用程序。与客户端一样，服务器应用程序以及运行它的计算机共同定义了\
  \ Web 的服务端，并被统称为服务器。\n-   当服务器接收到客户端对特定页面的请求时，它的工作是从计算机的文件系统中检索该页面并将其返回给客户端。在很多情况下，这种操作是一个非常简单的程序，服务器端的工作很少或完全没有。\n\
  -   然而，通过使用 `PHP`、`Perl` 或 `Java` 等编程语言，我们可以让服务器在将找到页面返回给客户端之前对其进行修改，甚至可以完全从零生成该页面。这被称为服务端应用程序。返回给客户端的页面（对客户端而言）看起来与任何未经过修改的页面完全相同。\n\
  -   服务端应用程序的一个示例可能是在页面中插入当前的日期和时时。这意味着每当页面被请求时（例如，使用浏览器的刷新按钮），页面上都会添加一个全新的时间值。\n\
  -   一旦客户端从服务器接收到该页面，它就会显示该页面并等待用户请求另一个页面。一旦页面进入这种状态，它就超出了服务器的控制。现在，任何服务端应用程序都无法在客户端再次返回服务器获取新的（可能已更新的）页面副本的情况下更改页面的内容。\n\
  -   然而，所有现代浏览器都允许运行客户端应用程序。这些是嵌入在页面本身 HTML 代码中的小型应用程序。\n-   服务端应用程序在修改页面发送给客户端时，会忽略其发现的任何客户端应用程序，因此通常情况下，这两类应用程序无法相互“对话”。\n\
  -   然而，一旦客户端接收到客户端应用程序，它就可以开始动态地修改页面，而无需返回服务器。\n-   客户端应用程序的一个示例可能是网页上每秒更新一次的时钟。\n\
  -   客户端应用程序的一个遗憾副作用是，所有代码都必须发送到客户端进行运行，这意味着应用程序的内部运作对任何人可见。这使得检查密码或执行任何可能导致机密信息泄露的操作变得不切实际。\n\
  -   此外，所有现代 Web 浏览器都为用户提供了完全关闭客户端应用程序的机会。在此基础上，同一个客户端应用程序的运行方式也会根据浏览器类型而异。\n-  \
  \ 尽管有这些缺点，在开发 Web 应用程序时，客户端应用程序（由于其通常很简洁，更常被称为脚本）仍然是为 Web 用户提供丰富环境的最佳方式。\n-   简而言之，这两种技术各有优劣：\n\
  -   客户端脚本允许开发者动态地更改页面，并立即响应用户操作，而无需等待服务器创建新版本的页面。然而，需要注意安全和跨浏览器兼容性问题，而且这些问题往往是非同常的。\n\
  -   服务端应用程序允许开发者保持其代码的安全和保密，从而能够创建更强大的应用程序。此外，由于运行代码的服务器始终是一个已知实体，在一个浏览器中成功运行的应用程序在所有浏览器中都能成功运行。然而，尽管有这些强大功能，服务端应用程序并没有直接的方法在不强制客户端加载另一个页面的情况下更改页面。这使得诸如下拉菜单、提交前的表单检查、定时器、警告警报等功能变得完全不切实际。\n\
  \n# 3 关于 JavaScript\n\n## 核心要点\n\n-   JavaScript 是一种解释型的、客户端的、基于事件的、面向对象的脚本语言，你可以用它为你的网页添加动态交互功能。\n\
  -   JavaScript 脚本是用纯文本编写的，类似于 `HTML`、`XML`、`Java`、`PHP` 以及几乎任何其他现代计算机代码。在代码中，我们将使用\
  \ `NotePad` 来创建和编辑我们的 JavaScript 代码，但也有许多替代方案。选择 `NotePad` 是为了演示 JavaScript 的即时性和简单。\n\
  -   你可以使用 JavaScript 实现以下任何功能：\n    -   使用图像创建特殊效果，当鼠标指针悬停在按钮上时，产生按钮被高亮或按下的错觉。\n\
  \    -   验证用户输入到你的 Web 表单中的信息。\n    -   在新窗口中打开页面，并自定义这些新窗口的外观。\n    -   检测用户浏览器的功能并相应更改你的页面内容。\n\
  \    -   “动态地”创建自定义页面，而无需像 `PHP` 这样的服务端语言。\n    -   以及更多……\n-   JavaScript 不是 `Java`，尽管如果你有\
  \ `Java` 背景，你会发现这两种语言在编写时看起来很相似。`Java` 是一种功能全且全面的编程语言，类似于 `c` 或 `c++`，尽管 JavaScript\
  \ 可以与它们交互，但不应将两者混淆。\n-   然而，不同的 Web 浏览器会以不同的、有时是不兼容的方式运行你的 JavaScript。为了解决这个问题，通常需要使用\
  \ JavaScript 来检测浏览器的功能并根据结果更改其操作。\n-   重新回顾本章的原始定义，请注意以下几点：\n    -   解释型指的是 JavaScript\
  \ 代码在加载到浏览器时即（在浏览器中）执行。这与 `Java` 等编译型语言不同，后者在运行单行代码之前会彻底检查你的程序程序，如果你来自非解释型背景，这可能会产生许多影响。\n\
  \    -   客户端的已经定义过了。\n    -   基于事件指的是 JavaScript 能够仅在指定事件发生时运行某些代码段。事件可以是页面加载、表单被提交、链接被点击或图像被鼠标指针指向。\n\
  \    -   面向对象标志着 JavaScript 控制 HTML 页面的能力是基于操作该页面内的对象的。如果你熟悉面向对象编程，你将意识到这种方式为编码环境带来的某些力量。\n\
  -   最后一点说明：虽然 JavaScript 是一种编程语言，但 `HTML`（万维网语言）不是。`HTML` 是一种标记语言，这意味着它可以用于标记文档的某些区域具有特殊属性，如标题、段落、图像、表单等，但它本身无法执行任何逻辑处理。因此，尽管\
  \ JavaScript 经常与 `HTML` 一起编写，但一者的规则并不对对方产生任何影响。\n\n# 4 JavaScript 概览\n\n## 核心要点\n\
  \n-   让我们先快速概览 JavaScript 的主要功能。本章旨在展示 JavaScript 能做什么，而不是对深层概念进行深入研究，所以如果你迷路了或不理解你输入的代码，不要担心！\n\
  \n## 项目\n\n-   我们所有的 JavaScript 都将使用 `NotePad` 编写。打开 `NotePad` 并生成的空文档保存到你的用户驱动器中为\
  \ `chapter_4.html`。\n-   首先在你的空白文档中创建一个基础的 HTML 页面。它不需要任何花哨——以下内容完全足够：\n\n```html\n\
  <html>\n\n<head>\n<title>第 4 章：JavaScript 概览</title>\n</head>\n\n<body>\n\n<h1>JavaScript\
  \ 概览</h1>\n\n</body>\n\n</html>\n```\n\n\n\n\n\n-   按照惯例，当笔记希望你将所有代码输入在同一行时，它们会使用像上面的箭头\
  \  那样表示你不应该在该处换行。对于 HTML 来说，这并不重要，但对于 JavaScript 来说，错误位置的换行会导致你的代码无法运行。\n\n-  \
  \ 保存你的新网页，并在网络浏览器中查看它。目前，请使用 Internet Explorer 查看此页面。要这样做，请在你的用户驱动器上找到保存的文件，并双击它。这将默认用\
  \ Internet Explorer 打开该文件，让你看到你刚刚创建的标题。\n\n-   到为止，我们还没有做任何 HTML 范围之外的事情。让我们在页面上添加一些\
  \ JavaScript 吧。\n\n-   （一般来说）网页上有三个地方可以添加 JavaScript 的地方。其中第一个是在一组新的 HTML 标签之间。这些\
  \ `script` 标签采用以下形式：\n\n```html\n<script language=”JavaScript”  type=”text/JavaScript\"\
  >\n… code …\n</script>\n```\n\n-   上面的 `script` 元素几乎可以放置在 HTML 页面中任何可以放置元素的地方——也就是说，可以放置在\
  \ `head` 元素或 `body` 元素中。它最常见的是放在前者，尽管通常是为了让你所有的代码都能在页面上被找到。\n\n-   同时请注意，HTML 页面中包含的\
  \ `script` 元素数量没有限制。除非出于谨慎考虑，否则没有什么能阻止你在页面上散布上百个这样的标签。\n\n-   让我们把起始和结束的 `script`\
  \ 标签添加到页面的 `head` 元素中，如下所示：\n\n```html\n<html>\n<head>\n<title> … </title>\n<script\
  \ language=”JavaScript”  type=”text/JavaScript\">\n</script>\n</head>\n…\n```\n\
  \n-   保存文件，然后尝试在浏览器窗口中刷新页面。注意，什么都没有发生。这是我们预期的——到为止我们所做的只是在页面设置一个区域来存放我们的 JavaScript。\n\
  \n-   回到记事本，在起始和结束的 `script` 标签之间输入以下文本：\n\n```javascript\nwindow.alert(“Hello world!”);\n\
  ```\n\n-   保存更改，再次在浏览器窗口中刷新页面。欢迎来到 JavaScript 世界！\n\n-   回到记事本，删除你刚刚添加的 `window.alert`\
  \ 行。现在添加以下稍复杂一点的代码：\n\n```javascript\nif( confirm(“Go to Google?”)){ document.location\
  \ =  “http://www.google.com/”; }\n```\n\n-   再次保存更改并刷新页面。对于关注后续章节的人来说，这是一个条件语句的示例，我们要求\
  \ JavaScript 检查某事的条件（在本情况下，即我们对问题的回答），然后根据它的发现来改变它的行为。\n\n-   现在，当页面加载到浏览器时，这两段\
  \ JavaScript 代码都不受控制地运行了。在大多数情况下，我们希望能够更精确地控制 JavaScript 何时执行我们要求的操作。\n\n-   这种控制是事件（events）的领域。在浏览器中，HTML\
  \ 文档的每个元素都关联了若干可能在其发生的事件。链接可以被点击，表单可以提交，页面可以加载等等。\n\n-   修改你 `script` 元素中之前的 JavaScript\
  \ 代码以匹配以下内容：\n\n```javascript\nfunction go_to_google() {\n  if( confirm(“Go to Google?”)){\
  \ document.location =  “http://www.google.com/”; }\n}\n```\n\n-   小心这里的括号！\n\n\
  -   保存并刷新，注意这次什么都没有发生。这是因为我们把之前的操作（弹出问题并根据响应采取行动）封装在一个函数（function）中。函数是一个被赋予名称的代码块——在本例中，名称是\
  \ `go_to_google()`——并且只有当该名称被“调用”时才会运行。将函数想象成魔法咒可能很有用，念出它们的名字时就可以被召唤。\n\n-   要调用这个魔咒，我们需要在页面上选择一个元素来触发它。一个自然的候选者是链接元素，因此在你的页面的\
  \ `body` 部分添加以下 HTML：\n\n```html\n<p>A quick <a href=\"#”>test</a>.</p>\n```\n\n\
  -   `#` 链接是一个通 HTML HTML 技巧，允许我们创建一个“通往无何处的链接”。\n\n-   保存并刷新，检查链接是否出现在页面上，以及点击它时是否没有去任何地方。\n\
  \n-   现在，我们希望在点击该链接时，让页面询问我们是否要“去 Google？”。方法如下：\n\n-   获取链接元素并对其进行如下修改：\n\n```html\n\
  <a href=\"#” onclick=”go_to_google();”>test</a>\n```\n\n-   保存并刷新，然后点击链接。这是一个事件处理程序（event\
  \ handler）的示例。当链接被点击时（`onclick`），我们的浏览器说出“魔咒” `go_to_google()`，我们的函数就被调用了。\n\n-\
  \   最后一个技巧，在页面的 `body` 部分、包含链接的段落之后添加以下代码：\n\n```html\n<body>\n…\n<script language=”JavaScript”\
  \  type=”text/JavaScript\">\ndocument.write(“<h2>Here’s another  header!</h2>”);\n\
  </script>\n</body>\n```\n\n-   注意该行代码应该在同一行！\n\n-   保存页面并刷新浏览器。注意现在页面上出现了一行新文本——另一个标题！我们使用了\
  \ JavaScript 创建 HTML 并告诉浏览器恰当地显示它。在这里，我们使用了 JavaScript 创建了 HTML 并告诉浏览器适当显示它。\n\n\
  # 5 对象、属性与方法\n\n## 关键点\n\n*   一般来说，对象是“事物”。例如，钢琴是一个对象。\n\n*   属性是描述和定义对象的术语。我们的钢琴，例如，有颜色、重量、高度、踏板和盖子。\n\
  \n*   注意上面，盖子是一个属性，其状态为打开或关闭。\n\n*   如果说对象是编程语言中的名词，属性是形容词，那么方法就是动词。方法是在对象上或对其执行的操作。为了继续我们的钢琴示例，你可以弹钢琴、打开盖子或按下踏板。\n\
  \n*   许多编程语言都有类似的方式来引用对象和方法。通常，它们是层级的，对象与其属性、方法以及与其他对象之间的关系通常可以通过表示法一眼看出。\n\n* \
  \  在 JavaScript 中，我们使用“点符号法”来表示对象及其属性和方法。例如，我们以以下方式引用钢琴的颜色：\n\n*   如果我们想指示 JavaScript\
  \ 弹钢琴，可以写简单的：\n\n\n\n\n\n- 括号还允许我们向对象的方法传递某些额外信息。在上面的示例中，为了向网页文档中写入“Hello world!”文本，我们将编写以下\
  \ JavaScript：\n\n```javascript\ndocument.write(“Hello World”);\n```\n\n- 每个方法可以根据括号中放入的内容（或者用技术术语说，即“作为参数传递给方法的内容”）执行不同的操作。事实上，许多方法可以接受多个“参数”来修改其行为。多个参数之间用英文逗号（`,`）分隔。\n\
  \n- 像这里显示的 JavaScript 指令被称为 JavaScript 语句。所有语句都应该以单个分号（`;`）结束。JavaScript 经常会忽略行尾缺失的分号，并自动为你插入分号。然而，这可能会导致某些意想不到的结果。考虑以下情况：\n\
  \n```javascript\ndocument.write(“<<h1>>\n\nHello World!\n\n</<h1>>”);\n```\n\n-\
  \ 在许多其他语言中，这是可以接受的。然而，JavaScript 经常会将此类内容解释为如下形式：\n\n```javascript\ndocument.write(“<<h1>>;\
  \ Hello World!;\n\n</</h1>>”);\n```\n\n- 这种解释将产生错误，因为如果你在结束语句时没有确保引号内的任何术语都有匹配的引号，JavaScript\
  \ 就会报错。在这个示例中，第一行的“语句”被截断了，JavaScript 将会崩溃。\n\n- 出此，建议你所有的语句都以分号结束。\n\n# 6 给属性赋值\n\
  \n## 核心要点\n\n- 虽然对象和方法允许我们在页面上执行操作（例如更改内容或弹出对话框与用户进行交互），但在许多情况下，我们可能希望直接修改对象属性之一的值。这些情况类似于我们把钢琴钢琴漆成绿色。\n\
  \n- 考虑到我们目前对方法的讨论，我们可能认为能够通过方法来更改对象的属性——例如，以下代码似乎是逻辑的：\n\n```javascript\npiano.paint(“green”);\n\
  ```\n\n- 在许多情况下，这确实是我们要做的。然而，这里有两个缺点。第一个是，在本课程中，我们发现的大多数对象是由浏览器内置并定义的。如果我们依赖使用方法来更改对象的属性，那么我们也就依赖于该方法本身存在这一事实。\n\
  \n- 解决这个问题的更直接的方法是直接访问对象的属性。例如：\n\n```javascript\npiano.colour=“green”;\n```\n\n\
  - 在这里，我们不再使用方法来执行操作，而是使用所谓的**运算符**。在这种情况下，该运算符的符号是 `=`，并被称为**赋值运算符**。\n\n- 在 JavaScript\
  \ 中，我们可以非常有效地使用这种运算符。例如，我们可以动态地更改文档的标题元素（显示在浏览器窗口顶部栏的文本）。这可以在用户使用事件处理器点击页面某部分（这一点稍后会详细介绍）时完成，也可以设置为每分钟自动更新，以在页面标题中显示当前时间。我们为此任务使用的代码非常简单：\n\
  \n```javascript\ndocument.title=“a new title”;\n```\n\n- JavaScript 中有很多赋值运算符。下表显示了其中一些常用的运算符：\n\
  \n| 赋值 | 功能 |\n| :--- | :--- |\n| `x = y` | 将 x 的值设置为 y |\n| `x += y` | 将 x 的值设置为\
  \ x+y |\n| `x -= y` | 将 x 的值设置为 x-y |\n| `x *=y` | 将 x 的值设置为 x 乘以 y |\n| `x /=y`\
  \ | 将 x 的值为 x 除以 y |\n\n- 并不是所有的赋值运算符都适用于所有类型的值。但加赋值运算符对数字和文本都有效。在处理数字时，结果将是两个数字的和。在处理文本（技术上称为字符串）时，结果将是两个字符串的拼接：\n\
  \n## 项目\n\n```javascript\ndocument.title += “!”;\n```\n\n将导致符号 `!` 添加到当前文档标题的末尾。\n\
  \n- 打开你之前的项目文件，并将其保存为 `chapter_6.html`。\n\n- 移除脚本标签（`<script>`）中任何现有的 JavaScript，但保留标签以备编写新的\
  \ JavaScript 做准备。\n\n- 使用你的文本编辑器如下所示更改页面标题元素的值，然后在浏览器中加载页面并查看结果：\n\n```html\n<title>With\
  \ a little help from</title>\n```\n\n- 现在，在我们的 `script` 元素中添加一条语句，在当前标题末尾添加以下文本：\n\
  \n```javascript\n”JavaScript for Beginners!”;\n```\n\n- 在浏览器中重新加载页面并注意窗口的标题栏。\n\n\
  - 如果显示看起来奇怪，请考虑你对空格的使用……\n\n- 到目前为止，我们拥有的只是一个 HTML 无法做到更多事的例子。让我们引入窗口对象的一个新方法，帮助我们为脚本增加一些动态性和交互性。如下更改标题标签的值：\n\
  \n```html\n<title>Chapter 6: Assigning Values to Properties</title>\n```\n\n- 现在，移除你之前的\
  \ JavaScript 语句并插入以下内容：\n\n```javascript\ndocument.title =  window.prompt(“Your\
  \ title?”, “”);\n```\n\n- 重新加载页面并考虑结果。\n\n- 我们之前遇到过 `window` 对象。我们在第 4 章中对 `alert`\
  \ 方法的演示可以写得更规范：\n\n```javascript\nwindow.alert(“message”);\n```\n\n在许多情况下，我们在编写代码时可以省略对象/属性/方法层次结构的某些部分。我们稍后会再次讨论这一点。\n\
  \n- 为了理解 `prompt` 方法是如何工作的，我们可以写下一个方法原型（method prototype）。这是一种描述方法参数的方法，使得它们对方法的影响更加直观易懂。`window`\
  \ 对象的 `prompt` 方法的原型可能如下：\n\n```javascript\nwindow.prompt( message, default_response\
  \ );\n```\n\n- 所以，我们可以看到第一个参数定义了出现在 prompt 对话框中作为问题的文本。第二个参数稍微那么重要。尝试用不同的值运行你的代码，看看你的更改带来了什么不同。\n\
  \n- 最后，我们注意到这个 `prompt` 方法以某种方式获取输入框中的信息并将其传递给我们的 JavaScript 赋值。假设有人在框中输入了“Hello\
  \ World”。就像我们的赋值实际上是：\n\n```javascript\ndocument.title = “Hello World”;\n```\n\n\
  - 当发生这种值的传递时，被称为该方法返回了传递的值。在这种情况下，我们会说“prompt 方法返回了值 `Hello World`”，或者说“prompt 方法的返回\
  \ `Hello World`”。\n\n- 当我们以后处理事件处理器时，返回值将变得非常重要。\n\n# 7 关于注释\n\n## 核心要点\n\n- 跟着我重复：注释很重要。注释很重要。注释很重要。\n\
  \n- 在代码中添加注释始终是良好的做法。随着脚本复杂性的增加，注释可以帮助你（以及他人）在日后查看代码时理解其结构。\n\n- 许多快速创建的代码被称为“只写不读”的代码，因为它天生缺乏结构或注释。调试此类代码或在几个月后重新使用它将变得极其难以实现，因为你试图记住某行代码本该做什么，或者为什么使用某些值似乎会导致你的代码无法运行。\n\
  \n- 注释会被 JavaScript 完全忽略，只要格式正确，它们就不会影响脚本的运行速度。\n\n- 然而，注释可能会减慢页面的加载速度——许多编码人员会保留代码的一个带有完整注释的“开发”副本以便编辑，并在最终发布时移除代码中的所有注释。\n\
  \n- JavaScript 中有两种类型的注释——单行注释和多行注释。\n\n- 单行注释以两个正斜杠字符（`//`）开始，并换行结束：\n\n```javascript\n\
  // this is a comment alert(“hello”); // so is this\n```\n\n- JavaScript 中的单行注释也可以使用你熟悉的\
  \ HTML 注释格式：\n\n```html\n<!-- this is a comment alert (“hello”);\n```\n\n\n\n\n\n\
  - 注意两点：首先，这种 HTML 注释格式不需要闭合标签 `-->`。其次，这只是单行注释，与它在 HTML 中的用法不同（HTML 中的注释会注释掉直到结束标签之前的所有行）。\n\
  - 你可以通过将注释块封装在 `/*` 和 `*/` 之间来添加多行注释。例如：\n\n```javascript\n/* 所有的文本都将被 JavaScript\
  \ 忽略。这允许我们\n编写更长的注释，而无必担心需要逐行“注释掉”每一行 */\nalert(“Hello World”);\n\n/* 一个单行的“多行”注释\
  \ */\n```\n\n- 除了为脚本添加叙述性外，你还可以使用注释从页面中移除代码，而无需删除这些代码。例如：\n\n```javascript\n// 这是这是旧的消息\n\
  // alert(“Hello World”);\n// 这是新消息 alert(“Hello everyone!”);\n```\n\n- 如果你正在尝试追踪代码中的错误，这非常有用——你可以逐行“注释掉”每一行可疑代码，直到你的代码恢复正常运行。\n\
  \n## Project\n- 打开你之前的项目文件，并将其另存为 `chapter_7.html`。\n- 在脚本开头添加单行注释 `This is my first\
  \ comment`。\n- 在你的脚本中添加一个多行注释，替换你之前的单行注释。该多行注释应该描述你的脚本目前的功能。\n\n# 8 向旧版浏览器隐藏脚本\n\
  \n## Key Points\n- 非常老旧的浏览器不支持 JavaScript。虽然现在使用这类浏览器的寥寥几个，但有两个因素迫使我们继续考虑可能无法处理我们\
  \ JavaScript 代码的环境。\n- 首先，所有现代浏览器都允许用户控制是否运行 JavaScript 代码。在许多情况下，用户对自己的公司政策没有发言权，甚至可能不知道他们的工作机器已经禁用了\
  \ JavaScript。\n- 其次，并不是所有的访问者都会使用可以利用任何 JavaScript 的浏览器。盲文显示器、屏幕阅读器和其他非视觉浏览器对许多\
  \ JavaScript 技巧几乎无用武处。此外，像 Google 这样的搜索引擎会忽略你在页面上使用的使用的任何 JavaScript，这可能会隐藏重要内容并导致你的页面无法被索引。\n\
  - 不支持 JavaScript 的浏览器应该忽略起始和结束 script 标签之间的任何内容。然而，许多浏览器违反了这一规则，并尝试将你的代码渲染为 HTML，这可能会导致尴尬的后果。\n\
  - 然而，我们可以利用这一特性：`<!--` 在 JavaScript 中表示单行注释，但在 HTML 中表示多行注释，以确保我们的代码能被懂 JavaScript\
  \ 的浏览器看到，而被其他任何设备视为注释掉的 HTML 而忽略：\n\n```html\n<script>\n<!-- 向旧版浏览器隐藏\n… 你的代码\n\
  // 停止隐藏代码 -->\n</script>\n```\n\n- 这防止了旧版浏览器显示代码，但如果我们想将其替换为某些注释呢？例如，假设有一段代码用于显示当天的时间并按名称问候用户。如果没有\
  \ JavaScript 并使用上述方法，页面上本该显示问候的地方将只是一片空白。\n- 我们可以使用 `<noscript>` 标签让代码在 JavaScript\
  \ 被禁用或不可用时“优雅地失败”。该元素的内容在 JavaScript 被理解的地方会被忽略，在其他任何地方都会显示。例如：\n\n```html\n<noscript>\n\
  \  <h1>欢迎来到我们的网站！</h1>\n</noscript>\n\n<script>\n<!-- 向旧版浏览器隐藏\n… 用于自定义页眉的代码\n//\
  \ 停止隐藏代码 -->\n</script>\n```\n\n- 打开你之前的项目文件，并将其另存为 `chapter_8.html`。\n- 在代码中添加两行以确保它不会混淆旧版浏览器或用户禁用了\
  \ JavaScript 的浏览器。\n- 添加一个 `noscript` 元素来解释你的 JavaScript 功能。通常情况下，指示用户“升级到更好的浏览器”被认为是“不礼貌的”，因为这可能会冒犯许多使用辅助设备的人——将这种形式的建议看作告诉盲人“去配几副眼镜”。\n\
  - 相地，在可能的情况下，你应该使用 `noscript` 元素提供内容，用适当的替代方案充分地替换脚本内容。例如，如果你使用 JavaScript 在页面上构建一个导航面板，那么\
  \ `noscript` 元素应该包含一个执行相同任务的纯 HTML 列表。\n\n# 9 自动重定向用户\n\n## Key Points\n- 我们在第 4\
  \ 节中已经简要看到过浏览器重定向的使用。\n- 为了更完整地阐述这一想法，为了将用户重定向到不同的页面，你需要设置 `document` 对象的 `location`\
  \ 属性。\n- 正如我们在第 6 节中所看到的，这里可以使用赋值运算符。例如：\n\n## Project\n```javascript\ndocument.location\
  \ = “http://www.bbc.co.uk/\";\ndocument.location = “chapter_4.html”;\n```\n\n- 打开你之前的项目文件，并将其另存为\
  \ `chapter_9_redirect.html`。\n- 保存该文件的另一个副本，这次命名为 `chapter_9.html`。\n- 确保两个文件都保存在同一个文件夹中，并且你在编辑器中打开了\
  \ `chapter_9.html`。\n- 移除 `script` 标签之间所有的脚本，除了你隐藏浏览器的行。确保 `script` 标签仍然位于页面的 `head`\
  \ 部分。\n- 现在，在此脚本中添加一条语句，以便页面一加载到浏览器中就会自动重定向用户到 `chapter_9_redirect.html` 页面。\n-\
  \ 最后，在页面的 `body` 部分添加一个 header 标签，包含文本“你看不见我！”\n- 关闭此页面，先不要在浏览器中检查，在编辑器中打开页面 `chapter_9_redirect.html`。\n\
  - 移除此页面上的所有 JavaScript（包括你的 script 标签），确保页面只剩下 HTML。\n- 在页面的 `body` 部分添加一个 header\
  \ 标签，包含文本“但你可以看到我！”\n- 保存此页面，并在浏览器中加载页面 `chapter_9.html`。\n- 尝试 `chapter_9.html`\
  \ 中 `script` 标签的不同位置，看看是否能让 header 在重定向之前出现。\n\n# 10 Alert, Prompt and Confirm\n\
  \n## Key Points\n- 到此为止，我们已经看到了 alert、prompt 和 confirm 框的简要示例，它们用于请求用户响应，并在后台暂停所有代码直到请求得到满足。\n\
  - 所有这些框都是 `window` 对象方法的结果。该对象是 JavaScript 在浏览器中可以处理的最高层对象。因此，页面上的所有其他对象（除少数例外外）实际上都是\
  \ `window` 对象的属性。\n- 由于它的无处不在，即使省略它，它的存在也会被假设。因此，在技术上我们应该写 `window.document.write(“…”)`，但写\
  \ `document.write(“…”)` 同样有效，正如我们一直所做的。\n- 同样，与其写 `window.alert(“…”)`，我们可以轻松地写 `alert(“…”)`。\n\
  - 这三个方法的原型为：\n\n```javascript\nwindow.alert(message);\nwindow.confirm(message);\n\
  window.prompt(message, default_response);\n```\n\n- Alert 在点击“确定”清除时将始终返回 `true`\
  \ 值。\n- Confirm 根据清除对话框选择的响应返回 `true` 或 `false`。\n- Prompt 将返回输入的值，如果没有输入任何内容则返回\
  \ `null`，如果取消了对话框则返回 `false`。\n\n## Project\n- 打开你之前的项目文件，并将其另存为 `chapter_10.html`。\n\
  - 清除之前的重定向代码，并确保 `script` 标签已返回文档的 `head` 部分。\n- 在页面脚本中添加一条新语句，在显示页面其余部分之前显示以下消息：欢迎来到我的网站！点击确定继续。\n\
  - 在浏览器中检查你的页面。\n\n\n\n\n\n- 在本课程中，我们将一直使用 `alert`、`confirm` 和 `prompt`。请花时间在本页面上依次尝试这三个方法，每次都停下来检查你的更改。\n\
  - 使用 `document` 对象的 `write` 方法来检查每个方法的返回值。例如：\n\n```\ndocument.write(alert(“hello\
  \ world”));\n```\n\n确保你将此特定的代码段放在页面 body 区域的 `script` 标签中，因为我们正在生成要由浏览器渲染的文本输出。此外，注意这里使用（或未使用）引号。下节见！\n\
  \n# 11 变量与运算符\n\n## 核心要点\n\n- 我们已经介绍了对象及其各种属性和方法的概念。这些相互关联的概念允许任何网页被拆分为许多微小的信息或数据片段，然后可以通过\
  \ JavaScript 访问这些片段，并在许多情况下进行修改。\n- 但是，如果我们想为某些不一定对应页面对应项的信息创建自己的存储空间呢？例如，如果我们想在更改\
  \ `document` 的 `title` 属性之前，存储它的旧值，以便以后检索；或者我们想存储页面加载到浏览器的时间，以便在页面上的多处显示，而又不想每次都重新计算时间该怎么办？\n\
  - 变量是 JavaScript 中用于存储值的命名容器。它们在许多方面与对象属性相似，但有一点重要的区别：\n- 从实际意义上说，变量没有与之关联的“父”对象。\n\
  - 变量可以由你开发者创建（“声明”），并可以赋予任何任意名称（在某些规则范围内）——然而，对象的属性受父对象定义的限制。例如，让我们之前章节中的钢琴对象拥有一个\
  \ `propeller`（螺旋桨）属性是没有意义的！\n- 变量命名规则非常简单——不能有空格，名称必须以字母开头。有效变量名的示例有：`BrowserName`、`page_name`、`Message1`、`MESSAGE1`。\n\
  - 在许多浏览器中，JavaScript 是区分大小写的，这意味着上面最后两个变量是不同的变量。为你的变量选择一种命名风格并在项目中坚持下去是一个好主意。\n\
  - 在最简单的层面，变量可以存储三种类型的值：\n\n### 数字 (Numbers)\n- 例如 `1.3324`、`3.14159`、`100000`、`-8`\
  \ 等。\n\n### 字符串 (Strings)\n- 例如 “JavaScript for Beginners, week 3”、“Hello World”\
  \ 等。\n\n### 布尔值 (Boolean Values)\n- 例如 `true`、`false`\n\n- 注意，字符串可以包含数字，但以下变量值是不等价：`1.234`\
  \ 和 `“1.234”`。后者是一个字符串值。这变得很重要。考虑：`1+2 = 3`、`“a” + “b” = “ab”`、`“1” + “2” = “12”`。\n\
  - 一些开发者在变量名中使用自己的约定来表示预期包含的值的类型。这通常很有帮助，但 JavaScript 并不强制要求（参见 JavaScript 注释）。\n\
  - 例如，`strMessage` 可能表示字符串变量，而 `numPageHits` 可能表示变量中的数值。\n- 变量赋值的实现方式与对象属性赋值相同。当变量第一次被赋值时，它会被自动创建。这与其他编程语言不同，在那些语言中，必须在加载值之前先显式地创建变量。\n\
  - 以下是变量赋值的一些示例：\n\n```\nnumBrowserVersion = 5.5;\nnumTotal += 33;\nMessage = “Hello!”;\n\
  Message = “Goodbye”; \nMessage = 3;\n```\n- 注意，最后三个示例显示变量值可以在初始赋值后更改，同样，存储在变量中的值类型也可以以类似的方式更改。\n\
  - 一旦创建了变量并在其中存储了值，我们想要访问它并对其进行操作。与对象属性类似，我们只需通过调用它们来访问变量：\n\n```\nMessage = “Hello\
  \ World!”;\nalert(Message);\n```\n- 注意，我们不在变量名周围使用引号。上面的代码与此不同：\n\n```\nalert(“Message”);\n\
  ```\n原因显而易见。\n- 除了使用变量进行存储和访问，我们还可以使用运算符对它们进行组合操作。例如：\n\n```\na = 12;\nb = 13;\n\
  c = a + b; // c 现在是 25\nc += a; // c 现在是 37\nc = b + “ Hello!”; // c 现在是 “13 Hello!”\n\
  ```\n- 最后一个示例可能出乎意料——我们向一个字符串添加了一个数字，结果得到了一个字符串。JavaScript 足够智能，能够意识到数字不能在数值上“相加”到字符串，因此它将数字临时转换为字符串，并执行两个字符串的拼接。注意\
  \ `b` 仍然是 `13`，而不是 “13”。\n- 运算符表：\n\n| 运算符 | 功能 |\n| :--- | :--- |\n| `x + y` |\
  \ 如果两者都是数字，则将 x 加 y；否则执行拼接 |\n| `x – y` | 如果两者都是数字，则从 y 中减去 x |\n| `x * y` | x 乘以\
  \ y |\n| `x / y` | 将 x 除以 y |\n| `x % y` | 将 x 除以 y，并返回余数 |\n| `-x` | 反转 x 的符号 |\n\
  | `x++` | 在置后将 x 加 1 |\n| `++x` | 在置前将 x 加 1 |\n| `x--` | 在置后将 x 减 1 |\n| `--x`\
  \ | 在置前将 x 减 1 |\n\n## 项目\n- 打开你之前的文件，并将其保存为 `chapter_1.html`。\n- 清除之前的 `script`\
  \ 标签，并确保 `script` 标签包含在 body 中。\n- 将消息“Welcome to”赋值给 `var_1`，将“my site”赋值给 `var_2`。\n\
  - 创建第三个变量 `var_3`，并将其赋值为 `var_1 + var_2` 的值。使用 alert 框检查 `var_3` 的值。\n- 在浏览器中测试此页面。\n\
  - 如果 alert 框中的文本未按预期显示，考虑变量赋值中的空格并修正错误。\n- 现在，修改你的代码以在不需要第三个变量的情况下相同的结果。\n- 清除 script\
  \ 中的所有语句。\n- 在 script 中添加两条语句，分别将数字 100 和 5.5 赋予两个变量。\n- 使用 document.write 显示表中每个运算符对这两个数值的效果。\n\
  - 将其中一个数值替换为字符串并重复此过程。注意差异。\n\n12 比较\n\n## 核心要点\n\n- 比较运算符比较彼此的值。最常用的是比较两个变量的内容——例如，我们可能想检查\
  \ `var_1` 的值是否大于 `var_2` 的值。\n- 当你使用比较运算符时，比较返回的值无例外是 true 或 false 的布尔值。例如，考虑以下语句：\n\
  \n```\nvar_1 = 4;\nvar_2 = 10;\nvar_3 = var_1 > var_2;\n```\n在这种情况下，`var_3` 的值为\
  \ false。注意，布尔值 false 不等于文本字符串 “false”：\n\n```\nvar_4 = false; // 布尔值\nvar_5 = “false”;\
  \ // 字符串\n```\n- 下是常见的比较运算符：\n\n| 比较 | 功能 |\n| :--- | :--- |\n| `X == y` | 如果 x\
  \ 和 y 等，返回 true，否则返回 false |\n| `X != y` | 如果 x 和 y 不等，返回 true，否则返回 false |\n| `X\
  \ > y` | 如果 x 在数值上大于 y，返回 true，否则返回 false |\n| `X >= y` | 如果 x 在数值上大于或等于 y，返回 true，否则返回\
  \ false |\n| `X < y` | 如果 y 在数值上大于 x，返回 true，否则返回 false |\n\n\n\n\n\n| `X <= y`\
  \ | 如果 `y` 在数值上大于或等于 `x`，返回 true；否则返回 false |\n\n- 要反转比较的返回值，我们通常会在比较运算符前加上一个 `!`（称为“bang”感叹号）。请注意，在很多情况下这并不是必要的，但可以有助于理解：\n\
  \n```javascript\nvar_1 !> var_2; var_1 <= var_2;\n```\n\n## 项目\n\n- 这两个者都是等价的，但在特定的语文中，其中一个可能比另一个更符合语义。\n\
  - 打开你之前的项目文件，并将其保存为 `chapter_12.html`。\n- 确保你的两个变量中都包含数值值，而不是字符串。\n- 使用 `alert`\
  \ 框根据上述列出的每个比较运算符，显示你的两个变量之间比较的结果。\n- 将其中其中一个数值值替换为一段文本字符串，并重复该过程。注意它们之间的区别。\n\n\
  # 13 条件语句\n\n## 要点\n\n- 直到为止，我们的 JavaScript 项目还无法自发地改变它们的行为。当页面加载了嵌入其中的 JavaScript\
  \ 代码时，它一次又一次地执行除了我们预期的操作之外的任何事情。\n- 我们看到的唯一区别是使用提示框来更改页面上显示的内容。然而，无论输入了什么文本，页面本质上都是对提供的文本执行相同的操作。\n\
  - 如果能给 JavaScript 提供一种做出决策的机制将是非常方便的。例如，如果我们提供提示框向访问者询问姓名，如果有一个“已知姓名”列表，并对对网站其他访问者进行不同的问候，那就太好了。\n\
  - 条件语句赋予了我们这种能力，并且是 JavaScript 的关键。\n- 条件语句由三部分组成：\n    - 一个测试（通常带有比较运算符或比较器），用于判断给定条件是真是假。\n\
  \    - 一个当且仅当条件为真时才执行的代码块。\n    - 一个可选的、块，当且仅当条件为假时才执行。\n- 这三部分在 JavaScript 中的表示如下：\n\
  \n```javascript\nif ( conditional_test )\n{\n    JavaScript statement; JavaScript\
  \ statement; JavaScript statement;\n    …\n}\nelse\n{\n    JavaScript statement;\
  \ JavaScript statement; JavaScript statement;\n    …\n}\n```\n\n- 从第一个闭合大括号（或花括号）开始的所有内容都是可选的，因此以下也是一个有效的条件原型：\n\
  \n```javascript\nif ( conditional_test )\n{\n    JavaScript statement; JavaScript\
  \ statement; JavaScript statement;\n    …\n}\n```\n\n- 在这种情况下，如果 `conditional_test`\
  \ 不返回真，则什么都不会发生。\n- 一个完整的条件语句示例所示：\n\n```javascript\nif ( var_1 > var_2 )\n{\n \
  \   alert(\"Variable 1 is greater\");\n}\nelse\n{\n    alert(\"Variable 2 is greater\"\
  );\n}\n```\n\n- 注意，上面的条件并不总是正确的。考虑 `var_1` 等于 `var_2` 的情况。在这种情况下，上面的代码将产生“Variable\
  \ 2 is greater”的消息，因为 `var_1 > var_2` 返回假。在这种情况下，我们希望在 `else` 分支代码中添加一个额外的条件：\n\n\
  ```javascript\nif ( var_1 > var_2 )\n{\n    alert(\"Variable 1 is greater\");\n\
  }\nelse\nif ( var_1 < var_2 )\n{\n    alert(\"Variable 2 is greater\");\n}\n```\n\
  \n- 在这种情况下，相等将不会产生任何输出，因为两个条件都不会返回真。为了完整性，我们可以为该语句添加一个最终的 `else` 分支：\n\n```javascript\n\
  if ( var_1 > var_2 )\n{\n    alert(\"Variable 1 is greater\");\n}\nelse\nif ( var_1\
  \ < var_2 )\n{\n    alert(\"Variable 2 is greater\");\n}\nelse\n{\n    alert(\"\
  The variables are equal\");\n}\n```\n\n- 注意，在这种情况下，我们不需要在最后一个分支中检查相等性，因为如果 `var_1`\
  \ 既不大于 `var_2` 也小于 `var_2`，那么——至少在数值上——它们必须相等的。\n- 我们可以根据需要向此栈继续添加任意 `else-if` 语句。\n\
  - 如果你的条件测试后只有一条语句，可以省略大括号：\n\n```javascript\nif ( var_1 > var_2 ) alert(\"Variable\
  \ 2 is greater\");\n```\n\n- 然而，如果你以后想在这个条件分支中添加更多语句，你必须在这个代码块周围添加大括号，这可能会导致混淆。建议使用大括号来封装所有的条件代码块。\n\
  - 考虑以下代码块：\n\n```javascript\nif ( var_1 > 4 )\n{\n    var_2 = var_1;\n}\nelse\n\
  {\n    var_2 = 4;\n}\n```\n\n- 这段代码相当长，但实现的较少——`var_2` 等于 `var_1` 或 `4`，取决于较大的那个。\n\
  - 更更简洁的写法可以是：\n\n```javascript\nvar_2 = 4;\nif ( var_1 > var_2 )\n{\n    var_2 =\
  \ var_1;\n}\n```\n\n- 然而，另一种更简洁的写法可能是使用三元运算符：\n\n```javascript\nvar_2 = (var_1 >\
  \ 4) ? var_1 : 4;\n```\n\n- 在上面的语句中，条件会被求值，如果真，则为 `var_1`；否则为 `4`。\n\n\n\n\n\n|\
  \ 3 | (4) |\n| 4 | (5) |\n| 5 | (6) |\n| 6 | (7) |\n| 7 | (8) |\n| 8 | (9) |\n|\
  \ 10 | (11!) |\n\n- 如果你想向某人下指令执行某个重复性动作，你可能会说想让他们继续执行该动作达到指定的次数。例如，如果某人要执行一个动作 300\
  \ 次，他们可能会采取以下操作来确保计数准确：\n- 在小纸条上写下数字 1。\n- 每次执行动作后，擦掉纸条上的数字并将其加 1。\n- 在每次执行动作前，检查纸条上的数字。如果数字小于或等于\
  \ 300，则执行该动作。\n- 或者，他们可能决定从 0 开始计数。在这种情况下，步骤是相同的，但每次执行动作前的检查将是确保数字严格小于 300。\n- 在\
  \ JavaScript 中，我们说的是几乎相同的话。以下代码将在页面上显示数字 1 到 100：\n\n```javascript\nfor( i = 1;\
  \ i <= 100; i++ )\n{\ndocument.write(“<p>” + i “ </p”);\n}\n```\n- `for` 语句告诉浏览器我们将执行一个循环。这里的布局与条件语句非常相似，但在这种情况下，我们在括号中拥有更多信息。我们的条件语句只有一个\
  \ JavaScript 语句来描述其动作，而 for 循环有三个：\n- 初始化器（initializer）——它设置了初始计数条件，在本情况下为 `i =\
  \ 1`。\n- 条件（conditional）——这与我们之前的条件语句相同，并且必须返回真或假。如果返回真，则循环继续，否则退出。\n- 递增器（incrementer）——这定义了在每次循环结束时执行的动作。在本情况下，`i`\
  \ 增加了一个值 1。\n- 条件和 for 循环之间的关键区别在于，条件在不断地被改变和重新评估。通过让条件不依赖于计数值可以创建一个无限循环——例如：\n\n\
  ```javascript\nfor( i=0; 5 > 4; i++ )\n```\n这将始终执行大括号中的脚本，并可能导致浏览器报错。\n- 同样注意，在\
  \ JavaScript 中，从零开始计数是非常常见的。其原因是我们通常希望计算某个操作执行了多少次。考虑以下：\n\n```javascript\nfor(\
  \ i=1; 1 < 2; i++ )\n```\n- 在这种情况下，循环将运行一次，但 `i` 的值将是 2，因为在第一次运行之后，`i` 将增加到 2，然后测试失败，因此循环退出。如果我们使用以下代码：\n\
  \n## Project\n\n```javascript\nfor( i=0; 1 < 1; i++ )\n```\n那么循环将运行一次，之后 `i` 的值将是\
  \ 1，正如我们所希望的那样。\n\n- 打开你之前的项目文件，并将其保存为 `chapter_14.html`。\n- 清除 `script` 标签中所有的\
