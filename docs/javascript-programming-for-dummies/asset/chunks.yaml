    # 1What is a Programming Language?


    ## Key Points


    - A programming language is a set of codes that we can use to give a computer
    instructions to follow.

    - Popular and well-known languages include Java, C++, OBOL, LISP and more.

    - Most popular languages consist of words and phrases that are similar to the
    English language.

    - A well-written program will be easily readable by anyone with a little programming
    experience, regardless of whether they have direct experience of the language.
    This is because modern languages share a large number of concepts. In particular,
    they all have a notion of variables, loops, conditionals, and functions.


    # 2Server-side vs. Client-side


    ## Key Points


    - The World Wide Web is built on a number of different technologies.

    - For most users, the web starts and ends with their choice of web browser. The
    browser is said to define the client-side of the web, with the browser, the computer
    it is running on, and the user surfing the web being collectively referred to
    as the client.

    - Consider a client who has decided to visit the web site at www.google.com. The
    first thing that happens is that the client will make a request to Google’s web
    server for the default page of that web site.

