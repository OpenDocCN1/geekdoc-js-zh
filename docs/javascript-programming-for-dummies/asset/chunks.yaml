    - 上述方法（使用 `for` 循环遍历一系列数组元素）是我们在本课程中讨论的第一批常用编程技术之一。它的用处不言而喻，因为它允许我们对一系列相关元素执行重复任务，而无需务必在编写代码时就知道这些元素具体是什么。它可以应用于表单元素、cookie、页面元素、页面、窗口，以及你可能想要用
    JavaScript 操作的任何其他对象集合。

    - 为了加强这种通用性，如果你在循环中没有使用 `array.length` 值，请考虑现在使用它。为了证明你创建了一个更具通用性的循环，请尝试用日期数组代替月份数组来运行代码，看看你是否需要更改任何循环代码。


    # 16 关联数组与对象数组


    ## 核心要点


    - 我们已经看到，可以通过索引来访问数组元素：


    ```javascript

    arrDays = ["Monday”, “Tuesday”];

    // 在页面文档中打印 “Monday”。

    document.write(arrDays[0]);

    ```


    - 然而，如果能够为我们的数组元素命名可能会更有用。默认情况下，数组被创建为数值数组。我们也可以创建关联数组：


    ```javascript

    arrDays = new Array();

    arrDays["Monday”] = “去看牙医”; arrDays["Tuesday”] = “参加 JavaScript 班”;

    arrDays["Wednesday”] = “JavaScript 作业”;

    // 提醒你周三的任务

    alert(arrDays["Wednesday”]);

    ```


    - 这看起来与我们之前讨论的对象和属性非常相似。事实上，由于数组实际上是一个对象，我们可以像访问属性一样访问它的元素：


    ```javascript

    // 提醒你周三的任务

    alert(arrDays.Wedensday);

    ```


    - 注意这里有一个细微的区别——在我们之前的数值数组示例中，星期几的名称是数组元素的值。在这里，星期几的名称是元素的索引。请避免以下常见错误：


    ```javascript

    arrDays = ["Monday”,“Tuesday”]; arrDays["Monday”] = “去上班”;

    // 这实际上等于 arrDays = new Array();

    arrDays[0] = “Monday”; arrDays[1] = “Tuesday”;

    arrDays["Monday”] = “去上班”;

    ```


    ## 项目


    - 此时 `arrDays.length` 是 3，而不是 2。

    - 打开你之前的项目文件，并将其保存为 `chapter_16.html`。

    - 清除 `script` 标签中的所有 JavaScript 代码。

    - 编写一个新脚本，创建一个名为 `Week` 的包含七元素的新关联数组：

    - 使用星期几作为作为数组中每个元素的索引。

    - 在创建每个关联元素时，为每周的每一天分配一个任务。

    - 使用 `for` 循环在页面上显示日历，如下所示：


    ```

    Monday: task

    Tuesday: task 等…

    ```


    - 修改你的代码，使用提示框（prompt）让访问者选择一天，并在页面上显示给那一天的任务。


    # 17 二维数组


    ## 核心要点


    - 回到我们之前的邮箱箱类比，我们的数组可以被想象成一排邮箱箱，每个邮箱都有自己的内容和标签，那么二维数组可以被看作这些邮箱箱排堆叠在一起的一系列排。

    - 实际上，二维数组仅仅是一个其每个元素本身也是数组的数组。二维数组的每个“子数组”可以是不同的长度——换句话说，二维数组不必是“正方形”的。

    - 你可以使用两对方括号而不是仅仅一对来访问每个子数组的内容。一个示例将最好说明这一点：


    ```javascript

    array_1 = ["element”, “element 2”];

    array_2 = ["another element”, 2, 98, true]; array_3 = [array_1, array_2]; alert(array_3[1][3]);
    // 显示 “98”

    ```


    - 虽然你不能在单个数组中混合数值和字符串索引系统（即数组不能既是数值的又是关联的），但你可以在二维数组中同时拥有关联数组数值数组。例如，将上述内容重构如下：


    ```javascript

    array_3 = new Array(); array_3["firstArray"] = array_1; array_3["secondArray"]
    = array_2;

    alert(array_3["secondArray”][3]);

    // 再次显示 “98”

    ```


    - 同样，我们可以愉快地对关联数组使用我们的“对象”表示法：


    ## 项目


    ```javascript

    alert(array_3.secondArray[3]);

    // 再次显示 “98”

    ```


    - 打开你之前的项目文件，并将其保存为 `chapter_17.html`。

    - 在你之前项目的基础上，创建若干个新的七元素关联数组来表示 4 个独立的周。

    - 将这 4 周合并成一个四元素数组来表示一个月。

    - 修改你之前的代码，接收一个周数并将该周的所有活动打印到页面上。

    - 修改其中一个周数组，使其不再由单个元素组成，而是由从早上 8 点到下午 5 点的小时数组组成。这就代表了一个三维数组。我们可以将数组扩展为 n 维，其中
    n 基本上是任意的。

    - 最后，修改你的代码以提示用户输入三个值——周、一天和一小时。将这些值存储在三个独立的变量中，并使用这些变量显示请求的任务，否则显示错误信息。


    # 18 字符串处理


    ## 核心要点


    - 在使用 JavaScript 的过程中，你经常会使用字符串来处理字符串，并根据发现的结果进行操作。

    - 我们已经看到过通过相等性来检查字符串。然而，这种全有或无的方法并不够细致。

    - 考虑我们需要根据已知列表来检查用户名称的情况。如果用户输入的是“Karen”，例如，这种方法取决于大小写是否匹配。

    - 在这种情况下，我们想查看“Karen”是否出现在字符串中。

    - 最简单的字符串搜索之一是使用 `indexOf` 方法。每个字符串类型的变量都关联此方法。考虑以下代码：


    ```javascript

    var_1 = “Karen Aaronofsky”; var_2 = var_1.indexOf(“Karen”);

    ```


    在这种情况下，`var_2` 的值为 0——记住 JavaScript 从 0 开始计数！


    - 如果我们在这里搜索姓氏：


    ```javascript

    var_1 = “Karen Aaronofsky”;

    var_2 = var_1.indexOf(“Aaronofsky”);

    ```


    `var_2` 的值为 6。


    - 最后，如果搜索“失败”，假设我们作为子字符串搜索名称 “Anisa”，那么 `var_2` 的值将是 -1。

    - 注意这种方法更灵活，但如果用户忘记大写我们要搜索的任何子字符串，仍然存在问题——在 JavaScript 中，“Karen”不等于“karen”。

    为了解决这个问题，我们可能希望确保不考虑大小写。实现此点的的一种简单方法是在执行检查之前将字符串强制转换为小写：


    ```javascript

    real_name = “Karen”;

    name = prompt(“你的名字是,””);

    real_name = real_name.toLowerCase(); try_name = name.toLowerCase();


    if ( try_name.indexOf(real_name) > -1 )

    {

    alert(“Hello Karen!”);

    }

    else

    {

    // 注意这里我们使用了原始的、

    // 未转换为小写的名称 alert(“欢迎 ” + name);

    }

    ```


    - 我们有许多字符串方法可以对字符串执行“值检查”。其中一些方法打印在在下表中：


    | 方法 | 行为 |

    | :--- | :--- |

    | `String.indexOf(“str”)` | 返回子字符串 “str”在字符串中第一个字符的数值位置 |

    | `String.charAt(x)` | 返回字符串中位置 x 的字符——`indexOf` 的相反操作 |

    | `String.toLowerCase()` | 返回字符串的副本，并将所有大写字母替换为小写字母 |

    | `String.toUpperCase()` | 返回字符串的副本，并将所有小写字母替换为大写字母 |


