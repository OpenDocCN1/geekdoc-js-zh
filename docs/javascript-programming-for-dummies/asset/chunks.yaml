    \  观察窗口打开时函数的动作，然后将原始窗口置于它们前面并再次调用该函数。\n    *   在函数中添加一条新语句，使用 `focus()` 方法来确保在调用该函数时，两个新窗口都移动到窗口“栈”的最顶端。\n\
    \    *   观察当函数被调用时，哪个 logo 显示在“上方”。再次使用 `focus()` 方法改变这种状态。\n\n# 28 动态创建内容\n\n\
    ## 关键点\n\n*   使用 JavaScript 按需需创建一个新页面其实非常简单。在这种背景下，我们讨论的是在不向该窗口加载任何文件的情况下，在窗口中创建一个全新的页面。要做到这一点，调用\
    \ `window` 对象的 `open()` 方法，并将位置参数留空：\n\n```javascript\nnew_win = window.open(\"\
    \", “newWin”, “params…”);\n```\n\n*   接下来，请记住你可以使用窗口的 `document.write()` 方法向页面写入\
    \ HTML 代码。到目前为止，我们只使用了当前窗口的 `document` 对象。然而，我们可以按照如下方式指定想要操作哪个窗口的 `document`：\n\
    \n```javascript\ndocument.write();// 写入当前窗口\nnew_win.document.write(); // 或写入新窗口\n\
    ```\n\n例如：\n\n## 项目\n\n```javascript\nnew_win.document.write(“<html><head>”);\
    \ new_win.document.write(“<title>demo</title>”): new_win.document.write(“</head><body>””);\
    \ new_win.document.write(“<h1>Hello!</h1>”); new_win.document.write(“</body></html>”);\n\
    ```\n\n*   打开你之前的项目文件，并将其将其保存为 `chapter_28.html`。\n\n*   修改现有的脚本以创建一个具有以下属性的第三窗口：\n\
    \    *   窗口应命名为 `newHTML`，并赋值给对象变量 `objNewHTML`。\n    *   它的大小应为 400 像素正方形。\n\
    \    *   创建时不应加载任何页面。它应该以 `H1` 标题的形式显示单词“Welcome”。\n    *   它应该包含一个文本为“Please\
    \ decide which logo you would like to choose.”的段落。\n    *   第三窗口标题为“Rocol Art”。\n\
    \    *   当所有窗口都打开后，第三个窗口应被赋予焦点。\n\n*   在浏览器中检查你的工作结果。\n\n# 29 多个窗口的操作\n\n## 关键点\n\
    \n*   `window` 对象的 `close()` 方法允许你关闭窗口。如果你在当前窗口中有一个指向你想要关闭的窗口的对象变量，你可以直接使用：\n\n\
    ```javascript\nnew_window.close();\n```\n\n*   当你想要从打开新窗口的另一个窗口关闭该窗口时，情况会变得复杂一点。为了解决这个问题，我们需要考虑窗口作用域（scope）。\n\
    \n*   当我们在代码中编写 JavaScript 时，该脚本中的所有函数和变量供我们在该窗口内使用。例如，如果我们在主窗口中有一个名为 `say_hello()`\
    \ 的函数，我们可以很容易地调用该函数。然而，如果我们想从一个新打开的窗口调用该函数，就无法从新窗口中直接调用它，因为我们的函数和变量“绑定”在它们最初被定义的窗口中的。\n\
    \n*   这就是为什么当我们想要向包含 JavaScript 代码的窗口之外的任何窗口写入内容时，我们必须访问该窗口的 `document` 对象以便将内容放在正确的位置。\n\
    \n*   但反过来又呢？假设我们在主窗口（称为窗口 1）中使用一个函数来打开一个新窗口（窗口 2）。如果我们将窗口 2 存储为对象变量，就可以通过该对象从窗口\
    \ 1 访问窗口 2 的所有属性。问题是，我们如何从窗口 2 访问窗口 1 的任何属性呢？\n\n*   关键在于窗口 2 和窗口 1 之间存在特殊的关系——“父/子”关系。我们可以通过名为\
    \ `opener` 的特殊对象从窗口 2 访问窗口 1 的任何属性。这是在任何由 JavaScript 打开的窗口内创建的对象，它始终引用打开新窗口的窗口。\n\
    \n*   为了说明这一点，让我们考虑之前的项目。我们有三个新窗口和一个“父”窗口。如果我们想在其中一个新窗口上使用事件处理器来关闭另一个新窗口，我们需要首先访问父窗口，然后访问父窗口内指向我们想要关闭的窗口的对象变量。\n\
    \n*   假设我们想从窗口 1 中的一个链接关闭 `window_2`。我们必须在链接中创建一个带有以下代码的事件处理器：\n\n## 项目\n\n```html\n\
    onclick=”opener.window_2.close();”\n```\n\n*   打开你之前的项目文件，并将其保存为 `chapter_29.html`。\n\
    \n*   修改现有的脚本以实现以下功能：\n    *   在第三窗口的内容中添加两个新段落，包含以下文本：\n      Old Logo The New\
    \ Logo\n    *   每行都应该包含在一个超链接中，其事件处理器访问父窗口中指向相应新窗口的对象变量。然后应调用其 `close()` 方法。\n\
    \n*   在浏览器中检查你的工作结果。\n\n# 30 使用外部脚本文件\n\n## 关键点\n\n*   JavaScript 可以轻松让我们避免手动输入大量的\
    \ HTML。正如我们所看到的，我们可以使用少量的代码通过 JavaScript 生成大型表单元素和表格。这对我们来说是个好消息，因为它让我们的工作变得更容易。这对我们的访问者来说也是一个好消息，因为他们只需要下载少量的代码就可以获得相对大量的内容。\n\
    \n*   然而，我们可以做得更好。在目前，如果我们有一个函数用于为表单出生日期部分生成年份下拉菜单，我们需要在每个需要它的页面中都包含该函数。这意味着我们的访问者多次下载相同的内容。此外，如果我们更改或改进了函数，就必须在包含该函数的每个页面中更新它。\n\
    \n*   HTML 允许我们通过提供一种将外部文件加载到页面并将其内容视为 JavaScript 的机制来解决这个问题。由于它是一个独立的文件，一旦它被下载，如果另一个页面请求它，浏览器将不再下载额外的副本。换句话说，我们可以将所有的\
    \ JavaScript 加载到一个文件中，那里的任何更改将立即反映在整个网站上。\n\n*   要使用外部文件中的代码，我们仍然使用 `<script>`\
    \ 标签，但要使用一个新属性 `src`。这与将图像文件加载到页面非常相似：\n\n```html\n<script language=\"JavaScript\"\
    \ type=\"text/JavaScript\" src=\"script.js\"></script>\n```\n\n*   注意以下三点：\n\n\
    ## 项目\n\n*   `language` 和 `type` 属性在这里是关重要的。\n*   `script` 标签仍然有一个闭合标签 `</script>`。\n\
    *   当我们使用标签加载外部文件时，不能在标签之间添加任何额外的 JavaScript。若要仅向当前页面添加 JavaScript，我们必须使用第二组 `<script>`\
    \ 标签。\n\n*   打开你之前的项目文件，并将其保存为 `chapter_30.html`。\n\n*   将你所有的 JavaScript 函数定义以及\
    \ head 部分 script 元素中的任何其他代码移动到一个名为 `script.js` 的新文件中。\n\n*   修改你的 head 部分 script\
    \ 元素，以从新文件加载代码。\n\n*   检查你的页面仍然按预期工作。\n\n*   注意：`.js` 文件扩展名只是一个命名约定。\n\n# 31 JavaScript\
    \ 与表单\n\n## 关键点\n\n"
- fmt: "\n# Introduction\n\n* Without JavaScript, the server handles all validating\
    \ and processing of information submitted via a form. Using JavaScript on the\
    \ client side of the equation saves time for the user and creates a more efficient\
    \ process.\n* Some processing can be handled by JavaScript (for example, mathematical\
    \ computations) and JavaScript can ensure that only correct data is sent to the\
    \ server for processing.\n* JavaScript is used in conjunction with server-side\
    \ processing – it is not a substitute for it.\n* To access information in a form\
    \ we use the `document` object’s `getElementById()` method, as we have previously\
    \ to access other objects on the page. For example, if we have a form on the page\
    \ like so:\n\n```html\n<form id=”testForm” … >\n</form>\n```\n\nwe would access\
    \ it in JavaScript by using:\n\n```javascript\ndocument.getElementById('testForm');\n\
    ```\n\n* The resultant object is actually a multi-dimensional array. Each of its\
    \ elements is itself an array containing information about the elements of the\
    \ form (text boxes, buttons etmc). By properly naming each of the form’s elements\
    \ in the appropriate `<INPUT>` tags, you can access information relating to each\
    \ of the form’s elements.\n* To access the data stored in a text box called `Name`\
    \ which is included in the form with the id `Enquiry` you use the `value` property\
    \ like so:\n\n```javascript\nobjForm = document.getElementById('Enquiry');\nstrValue\
    \ = objForm.Name.value\n```\n\n* There are two ways of sending form data to the\
    \ server. Using the `method` attribute, you can specify either the `GET` or the\
    \ `POST` methods:\n\n```html\n<form id =”enquiryform” method=”GET”…\n```\n```html\n\
    <form id =”enquiryform” method=”POST”…\n```\n\n* In general, you should use the\
    \ `POST` method if you want to send a lot of data (eg files, large amounts of\
    \ text) from your form. You should use `GET` if you want to process search forms\
    \ etmc, as a `GET` form will be transmitted just like a URL, and is hence “savable”\
    \ as a bookmark or link.\n* In general, you will send your form to a server side\
    \ script, specified by the form’s `action` attribute:\n\n```html\n<form id=”enquiryform”\
    \ method=”GET”\n→ action=”process.php”…\n```\n\n* When the user clicks on a form’s\
    \ Submit button, without JavaScript intervention, the form’s data is sent straight\
    \ to the server for processing. But you can intercept the data (so you can process\
    \ it with JavaScript) before it is sent, by including the `onsubmit` event handler\
    \ in the `<form>` tag. This enables you to run a JavaScript function before the\
    \ data is sent:\n\n```html\n<form id=”enquiryform” method=”GET”\n→ action=”process.php”\n\
    → onsubmit=”functionName()”>\n```\n\n* In the above example, when the user clicks\
    \ on the Submit button, the function `functionName()` is run first, then the data\
    \ is sent to the server.\n* When the submit event is triggered by the form’s submission,\
    \ the browser waits to discover what is returned from the event handler. By default,\
    \ the event handler will return `true`. However, if the event handler returns\
    \ a `false` value, the form’s submission will be aborted, and the page will not\
    \ be submitted to the server.\n* By returning a value of either `true` or `false`\
    \ from your function (`functionName()` in the above example), and ensuring that\
    \ this is also the return value of the `onsubmit` event handler, you can decide\
    \ whether or not the form’s data is actually sent to the server.\n* You specify\
    \ that the return value of the function is also the return value of the `onsubmit`\
    \ event handler in the following way:\n\n```javascript\nonsubmit=\"return functionName();\n\
    ```\n\n## Project\n\n* Open your previous project file, and save it under the\
    \ name `chapter_31.html`.\n* Clear any content from the body element of the page,\
    \ and ensure that the head area script element has no code in it.\n* Save a copy\
    \ of this page as `processing_31.html`, and put an `<h1>` element in the body\
    \ area saying “success!”.\n* Now, close your `processing_31.html` page and create\
    \ a form on your original `chapter_31.html` page using HTML – if you have difficulty\
    \ with this, the tutor will provide an example to duplicate. Your form should:\n\
    \    * have an `id` of `jsCourseForm`.\n    * have a single input box with a `name`\
    \ value of `name`.\n    * have a submit button.\n    * use the `GET` method of\
    \ submission.\n    * have `processing_31.html` as its `action` attribute.\n  \
    \  * have an `onsubmit` event handler that returns the value of the (as yet non-existent)\
    \ `check_form()` function.\n* Now, create a function in the head area script element\
    \ called `check_form()`. This function should:\n    * use the `document`’s `getElementById()`\
    \ method to store a reference to the form’s object in an object variable.\n  \
    \  * store the value of the form’s `name` element in another variable.\n    *\
    \ if the value of the name element is not “Bugs Bunny”, an alert box should appear\
    \ stating:\n      Sorry chum! Either you misspelled your name… Or you haven’t\
    \ got what it takes… Try again.\n    * in addition, the form should be prevented\
    \ from submitting.\n* If the user enters the correct name, however, the form should\
    \ submit without interruption.\n* check your work in your browser.\n\n# 32 Form\
    \ Methods and Event Handlers\n\n## Key Points\n\n* Each form object (e.g. text,\
    \ button etmc) has a set of properties associated with it. This is different for\
    \ each form element. The `value` property is common to most form elements and\
    \ is one of the most useful properties.\n* You can assign the data stored in a\
    \ text box called `Name` which is included in the form with `id` `Enquiry`, to\
    \ a variable like so:\n\n```javascript\nvariable = document.getElementById('Enquiry');\n\
    → Name.value\n```\n\n* Form objects also have methods associated with them. The\
    \ set of available methods is different for each form object.\n* Below is a list\
    \ of commonly used methods for the text object:\n\n| Method | Description |\n\
    | :--- | :--- |\n| `blur()` | Removes the focus from the text box |\n| `focus()`\
    \ | Gives the focus to the text box |\n| `select()` | Selects the text box |\n\
    \n* Below is a list of commonly used methods for the button object:\n\n| Method\
    \ | Description |\n| :--- | :--- |\n| `blur()` | Removes the focus from the button\
    \ |\n| `focus()` | Gives the focus to the button |\n| `click()` | Call’s button’s\
    \ `onclick` event handler |\n\n* Form objects also have event handlers associated\
    \ with them. The set of event handlers is different for each form object.\n* Below\
    \ is a list of commonly used event handlers for the text object:\n\n| Event handler\
    \ | Runs JavaScript when… |\n| :--- | :--- |\n| `onblur` | The text box loses\
    \ the focus. |\n| `onfocus` | The text box receives the focus. |\n| `onselect`\
    \ | The user selects some of the text with the text box |\n| `onchange` | The\
    \ text box loses the focus and had its text modified. |\n\n* Below is a list of\
    \ commonly used event handlers for the button object:\n\n| Event handler | Runs\
    \ JavaScript when… |\n| :--- | :--- |\n| `onBlur` | The button loses the focus\
    \ |\n| `onFocus` | The button receives the focus |\n| `onClick` | The user clicks\
    \ the button |\n\n* Finally if you are sending data to the server, a submit button\
    \ is not the only way. You could use the `submit()` method in a function which\
    \ is invoked by an event handler. This operates as if the Submit button was clicked:\n\
    \n```javascript\ndocument.getElementById('Enquiry').submit();\n```\n\n## Project\n\
    \n* Open your previous project file, and save it under the name `chapter_32.html`.\n\
    * Modify your form in the following way:\n    * Remove the submit button.\n  \
    \  * Replace the submit button with a standard form button.\n    * Add an event\
    \ handler to this button to invoke the function in the head area script element.\n\
    \    * Remove the `onsubmit` event handler from the form.\n* Now, modify the `check_form()`\
    \ function in the following way:\n    * If the user types in the name “Bugs Bunny”,\
    \ the function submits the form using the form’s `submit()` method.\n    * If\
    \ the user types anything else, the previous alert box warning is displayed and\
    \ the form is not submitted, but also:\n        * The words “please try again”\
    \ are displayed in the text box.\n        * The text box is given focus.\n   \
    \     * The text in the text box is selected.\n* check your work in your browser.\n"
