  trans: "\n\n# 33 JavaScript 与数学\n\n## 核心要点\n\n- `Math` 对象是一个预定义的 JavaScript 对象，包含了你可以用于进行数学计算的属性和方法。\n\
    - 以下是一些实用的 `Math` 方法选择：\n\n| 方法 | 返回值 |\n| :--- | :--- |\n| `Math.ceil()` | 大于或等于数字的最小整数。也就是说，它将任何数字向上取整到下一个整数。`Math.ceil(2.6)`\
    \ 返回 3，`Math.ceil(2.2)` 也是 3。 |\n| `Math.floor()` | 大于或等于数字的最大整数。也就是说，它将任何数字向下取整到下一个整数。`Math.floor(2.2)`\
    \ 返回 2，`Math.floor(2.6)` 也是 2。 |\n| `Math.max(n1,n2)` | 两个参数中的较大者。 |\n| `Math.min(n1,n2)`\
    \ | 两个参数中的较小者。 |\n| `Math.random()` | 0 到 1 之间的随机数。 |\n| `Math.round()` | 舍入到最近整数的数字。\
    \ |\n| `Math.sqrt()` | 数字的平方根。 |\n\n- 你不需要在表单中包含提交（Submit）按钮，也不需要将表单数据发送服务器。你可以使用事件处理程序来调用\
    \ JavaScript 代码，仅处理表单上的数据（例如，你可以对某些用户数据执行一些数学计算）。\n- 如果你不将数据发送到服务器，则不需要在 `<FORM>`\
    \ 标签中包含 `Action` 或 `Method` 属性，尽管默认情况下 `Action` 通常会提交到当前页面，而 `Method` 将设置为“get”。\n\
    \n## 项目\n\n- 打开之前的项目文件，并将其保存为 `chapter_33.html`。\n- 移除页面 `body` 部分的所有内容。\n- 从网络中复制\
    \ `max_wins.html` 文件，并使用记事本的 `File > Open` 命令打开它。将 `max_wins.html` 的全部内容复制并粘贴到你当前项目文件的\
    \ `body` 元素中。\n- 移除页面 `head` 部分中 `script` 元素中的所有 JavaScript 代码。\n- 花些时间在浏览器中打开你的项目文件并研究代码。该项目将使页面能够：\n\
    \    - 点击按钮时生成两个随机数。\n    - 在标记为 `player 1` 和 `player 2` 的文本框中显示随机数。\n    - 比较两个随机数，并在标记为\
    \ `winner` 的文本框中显示数字较大的玩家名称。\n- 在研究代码时，请注意表单没有有效的 `action` 或 `method` 属性。它也没有“提交”（submit）按钮。我们完全不会允许表单提交到服务器，而是将使用\
    \ JavaScript 对表单进行所有处理。\n- 现在，修改页面上的 HTML 代码，以添加一个事件处理程序来调用定义在 `head` 区域 `script`\
    \ 元素中的新函数。该函数在点击表单按钮时应执行以下操作：\n    - 在每个 Player 文本框中放置两个 0 到 100 之间的独立随机整数。\n\
    \    - 找到一种使用 `Math` 方法比较两个输入整数的方法。比较完成后，函数应该在 `Winner` 文本框中放置 Player 1、Player\
    \ 2 或平局（Draw）的相应值。\n- 在浏览器中检查你的工作。\n\n# 34 对象变量——复习\n\n## 核心要点\n\n- 引用对象可能是一个漫长的过程。考虑上一个例子中的\
    \ Player 1 文本框。你完整引用它的如下：\n  `document.getElementById(\"MaxWins\").Player1`\n\
    - 这种表示法虽然精确，但很冗长、耗时且容易出错。幸运的是，有一些快捷方式可以节省时间并减少输入错误。\n- 当我们需要反复引用某些特定对象时，可以使用对象变量来简化工作。要使用对象变量，你只需简单地给它赋值一个特定的对象：\n\
    \  `Player1 = document.getElementById(\"MaxWins\").Player1`\n- 一旦赋值，你就可以任何可以使用特定对象本身的地方使用该对象变量。使用上一段中的对象变量：\n\
    \  `Player1.value`\n  等同于：\n  `document.getElementById(\"MaxWins\").Player1.value`\n\
    - 请记住，你是在将对象赋值给对象变量。你会将文本框、按钮或图像等赋值给对象变量，然后如上所示引用该对象的属性（`Player1.value`）。你不会将文本或字符串值赋值给对象变量。因此：\n\
    \  `Player1 = document.getElementById(\"MaxWins\").Player1.value`\n  仅仅是将存储在 `Player1`\
    \ 中的值赋值给变量 `Player1`。\n- 显而易见，你不需要在对象变量名的开头加上“o”。这只是为了区分不同类型变量的惯例。\n\n## 项目\n\n\
    - 打开之前的项目文件，并将其保存为 `chapter_34.html`。\n- 以如下方式修改 `head` 区域 `script` 元素中的函数：\n\
    \    - 在函数开始处为每个被引用多次的特定对象分配它们自己的对象变量。\n    - 将代码中特定对象的引用替换为相应的对象变量。\n- 在浏览器中测试你的工作，确保其功能与以前一样。\n\
    \n# 35 从菜单项执行操作\n\n## 核心要点\n\n- HTML `<select>` 表单标签允许你创建一个包含选项的菜单（选择框），用户可以从中进行选择：\n\
    ```html\n<form id=\"menu\">\n<select name=\"Product\">\n<option value=\"one\"\
    >Image one</option>\n<option value=\"two\">Image two</option>\n<option Value=\"\
    three\">Image three</option>\n</select>\n</form>\n```\n- 通常，从选择框中选择一个选项仅仅指定了选择框的值。这被用于进一步处理——要么通过\
    \ JavaScript 或通过服务器。\n- 你可以使用 JavaScript 根据选择框的当前值（选中的选项）来调用操作。这些操作可能直接加载另一个页面或执行某些其他类型的处理。\n\
    - 这种操作的另一种名称是“跳转菜单”（jump menu）。\n- 为了实现这一点，你需要知道表单上的每个选择框都关联有一个 `select` 对象。使用上面的示例，因此你可以通过以下方式访问位于\
    \ Product 表单上的选择框的当前值（即其当前选项的值）：\n  `document.getElementById(\"menu\").Product.value`\n\
    - 正如你所预期的，select 选项具有与其关联的方法和事件处理程序：\n    - `focus()` 方法赋予选择框焦点。\n    - `blur()`\
    \ 方法从选择框中移除焦点。\n- select 对象可用的事件处理程序如下所示：\n\n| 事件处理程序 | 何时运行 JavaScript |\n| :---\
    \ | :--- |\n| `onblur` | 选择框失去焦点 |\n| `onfocus` | 选择框接收焦点 |\n| `onchange` | 选择框的值被修改\
    \ |\n- 当用户从选择框中选择选项时调用操作的方法是准备一个 JavaScript 函数，该函数将通过 select 对象的 `onchange` 处理程序调用：\n\
    ```html\n<select name=\"name\" onchange=\"functionname()\">\n```\n\n## 项目\n\n\
    - 打开之前的项目文件，并将其保存为 `chapter_35.html`。\n- 清除 `head` 区域的 JavaScript，并移除页面 `body`\
    \ 区域的所有内容。\n- 在页面 `body` 区域创建一个表单。赋予表单 id `jumpMenu`。\n- 在表单中放置一个 `select` 元素。给该\
    \ `select` 元素赋予以下值和标签，例如：\n```html\n<select name=\"menu\">\n<option value=\"value\"\
    >label</option>\n…\n</select>\n```\n| 值 (Value) | 标签 (Label) |\n| :--- | :---\
    \ |\n| `[`www.bbc.co.uk/`](https://www.bbc.co.uk/)` | The BBC |\n| `[`www.google.com/`](https://www.google.com/)`\
    \ | Google |\n| `[`www.hotmail.com/`](https://www.hotmail.com/)` | Hotmail |\n\
    | `[`www.ed.ac.uk/`](https://www.ed.ac.uk/)` | The University of Edinburgh |\n\
    | `[`www.apple.com/`](https://www.apple.com/)` | Apple Computer |\n| `[`www.microsoft.com/`](https://www.microsoft.com/)`\
    \ | Microsoft Corporation |\n- 最后，在你的菜单开头添加一个 `option` 元素，如下：\n\n"
- fmt: "\n<option value=\"\">Select a destination</option>\n\n** We are now going\
    \ to use the menu’s `onchange` event handler to invoke a function we are about\
    \ to define. The function is to be called `jump_to_page()`.\n* Define such a function\
    \ in the head area `script` element. The function should:\n    * create an object\
    \ variable referencing the form element that represents the menu.\n    * Get the\
    \ value of the menu at that moment.\n    * If the value is not equal to `\"\"\
    ` (ie, if a valid selection has been made), the function should use the use JavaScript\
    \ to load the selected page into the browser.\n* check your work in your browser.\n\
    \n# 36 Requiring Form Values or Selections\n\n## Key Points\n\n* Form data may\
    \ be invalid if it is sent to the server without certain information – for example,\
    \ if the user has omitted to select an item from a menu. Better not to bother\
    \ processing, than to waste the time of the user and server by trying to process\
    \ the invalid information.\n* In the case of a selection box, one way of validating\
    \ is to include a null value for the default option. In the previous project,\
    \ the default value of the selection box (always the first option unless specified\
    \ otherwise) was `\"\"`. If the user doesn’t actively make another selection,\
    \ then you can check the value of the selection box before sending it to the server.\n\
    * Another example is the case of a set of radio buttons. Imagine that for an imaginary\
    \ company, an order form contained two form elements – a selection box to specify\
    \ which product was being ordered and two radio buttons to specify whether it\
    \ was being ordered as a photographic print or as a slide.\n* Let’s say the `id`\
    \ of the order form is `OrderForm` and the `name` of each radio button is `Format`.\
    \ (Remember that in HTML, radio buttons in a set are related to each other by\
    \ their name that must be the same for each related radio button).\n* The radio\
    \ object is an array where each element of the array stores information relating\
    \ to each of the radio button objects (remember, counting starts at `0`).\n* As\
    \ the name is identical for each radio button in the set, you can’t access an\
    \ individual radio button by using its name. But you can access it using the standard\
    \ array notation:\n```\nOrderForm.Format[i]\n```\nwhere in this case, `i` is an\
    \ integer between `0` and `1`, and `OrderForm` is an object variable pointing\
    \ to the form element.\n* Radio buttons in a set each have a `checked` property\
    \ that stores a Boolean value specifying whether or not a radio button is checked.\
    \ Obviously, you can access this value in the following way:\n```\nOrderForm.Format[i].checked\n\
    ```\n* So, to verify that in a set of radio buttons, at least one of them is checked,\
    \ all you have to do is loop through each of the radio buttons using the array’s\
    \ `length` property to specify the number of iterations of the loop:\n```\nFormatSelected\
    \ = false; oOrderForm = document.getElementById(\"OrderForm\");\nfor ( i=0; i\
    \ < oOrderForm.Format.length; i++ )\n{\n    if ( oOrderForm.Format[i].checked\
    \ )\n    {\n        FormatSelected = true;\n    }\n}\n```\n* In our order form\
    \ example, one of the products might only be available as a slide. You could use\
    \ the `onchange` event handler of the `select` object to invoke a function which\
    \ automatically sets the value of the relevant radio object’s `checked` property:\n\
    ```\nfunction SetFormat ()\n{\n    oOrderForm = document.getElementById(\"OrderForm\"\
    );\n    if ( oOrderForm.Product.value == \"Greek Boat\" )\n    {\n        oOrderForm.Format[0].checked\
    \ = true;\n    }\n}\n```\nwhere `Product` is the name of the select box, `Format`\
    \ is the name of the group of radio buttons and the value of the first ratio button\
    \ is Slide.\n* Finally, to reset all form objects to their initial state, use\
    \ the `reset()` method:\n```\nFormObject.reset()\n```\n\n## Project\n\n* Open\
    \ your previous project file, and save it under the name `chapter_36.html`.\n\
    * Remove all content from the `body` section of the page.\n* copy the file `order_form.html`\
    \ from the network, and open it using NotePad’s File > Open command.\n* copy and\
    \ paste the entire contents of `order_form.html` into your current project file,\
    \ into the `body` element of the page.\n* Remove all JavaScript code from the\
    \ `script` element in the head section of the page.\n* Take some time to open\
    \ your project file in a browser, and study the code.\n* Add an event handler\
    \ to the form element on your page that will invoke a function called `check_form()`\
    \ when the form is submitted. This function will return `true` or `false` depending\
    \ on whether the form passes a number of tests as described below. Remember to\
    \ precede the event handler’s function call with `return` to ensure that the form\
    \ awaits confirmation from the function before proceeding.\n* create the `check_form()`\
    \ function in the head area `script` element. The function should perform the\
    \ following steps:\n    * If the current value of the selection menu is `\"\"\
    `:\n        * Display an alert with the message \"please select a product\"\n\
    \        * Give focus to the menu\n        * Return `false`\n    * If no radio\
    \ buttons are selected:\n        * Display an alter with the message \"please\
    \ specify a format\"\n        * Return `false`\n    * Otherwise, return `true`\n\
    * check your work in your browser.\n* The Greek Fishing Boat is only available\
    \ in Slide format. Add an event handler to the `select` element which will run\
    \ a function called `set_format()` when its value is changed.\n* create the function\
    \ `set_format()` in the head area `script` element. The function should check\
    \ first what the value of the menu is. If it is the Greek Fishing Boat, it should\
    \ then check to see if the Slide radio button is checked. If it is not, then the\
    \ function should correct this.\n* check your work in your browser.\n* Modify\
    \ your `check_form()` function to check that, if the value of the menu is Greek\
    \ Fishing Boat, then the Slide radio button is checked. If not, it should report\
    \ the error as before.\n* Finally, note that your `check_form()` function is currently\
    \ not very efficient, in that it will only report one error at a time. This can\
    \ be tedious for an error prone user, and it is much better practice to observe\
    \ a form for all errors simultaneously.\n* create a variable at the beginning\
    \ of the function called `error`. Set the value of this variable to `\"\"`.\n\
    * Instead of using an alert box each time an error is found, add the error message\
    \ to the end of the variable, eg `error += \"error message\\n\";` (note the new\
    \ line code at the end of each message).\n* After all checks have been made, if\
    \ we have caught any errors, the value of `error` will no longer be `\"\"`. Thus,\
    \ we can use the following code to report all errors at once:\n```\nif ( error\
    \ != \"\" )\n{\n    alert(\"The following errors were found: \\n\\n\" + error);\
    \ \n    return false;\n}\nelse\n{\n    return true;\n}\n```\n* Modify your function\
    \ to be more efficient.\n\n# 37 Working with Dates\n\n## Key Points\n\n* The date\
    \ object stores all aspects of a date and time from year to milliseconds.\n* To\
    \ use a new date object, you must create it and assign it to an object variable\
    \ simultaneously. The following code creates a new date object which stores the\
    \ current date and time and assigns it to the variable `dtNow`:\n```\ndtNow =\
    \ new Date();\n```\n* You can specify your own parameters for the date object\
    \ when you create it:\n```\ntheDate = new Date(year, month, day, hours, minutes,\
    \ seconds, mseconds);\n```\n* Note that months are represented by the numbers\
    \ 0 to 11 (January to December). Days are represented by 1 to 31, hours by 0 to\
    \ 23, minutes and seconds by 0 to 59 and milliseconds by 0 to 999.\n* The following\
    \ code stores 17th July 2004 at 9:15:30pm in the variable `theDate`:\n```\ntheDate\
    \ = new Date(2004,6,17,21,15,30,0);\n```\n* The first three parameters are mandatory,\
    \ while the rest are optional:\n```\ntheDate = new Date(2004,6,17);\n```\ngives\
    \ you midnight of the date above.\n* You can assign a date to a variable using\
    \ a string in the following way:\n```\ntheDate = new Date(\"Sun, 10 Oct 2000 21:15:00\
    \ – 0500\");\n```\n"
