  trans: "\n\n- 注意两点：首先，这种 HTML 注释格式不需要闭合标签 `-->`。其次，这只是单行注释，与它在 HTML 中的用法不同（HTML\
    \ 中的注释会注释掉直到结束标签之前的所有行）。\n- 你可以通过将注释块封装在 `/*` 和 `*/` 之间来添加多行注释。例如：\n\n```javascript\n\
    /* 所有的文本都将被 JavaScript 忽略。这允许我们\n编写更长的注释，而无必担心需要逐行“注释掉”每一行 */\nalert(“Hello World”);\n\
    \n/* 一个单行的“多行”注释 */\n```\n\n- 除了为脚本添加叙述性外，你还可以使用注释从页面中移除代码，而无需删除这些代码。例如：\n\n```javascript\n\
    // 这是这是旧的消息\n// alert(“Hello World”);\n// 这是新消息 alert(“Hello everyone!”);\n```\n\
    \n- 如果你正在尝试追踪代码中的错误，这非常有用——你可以逐行“注释掉”每一行可疑代码，直到你的代码恢复正常运行。\n\n## Project\n- 打开你之前的项目文件，并将其另存为\
    \ `chapter_7.html`。\n- 在脚本开头添加单行注释 `This is my first comment`。\n- 在你的脚本中添加一个多行注释，替换你之前的单行注释。该多行注释应该描述你的脚本目前的功能。\n\
    \n# 8 向旧版浏览器隐藏脚本\n\n## Key Points\n- 非常老旧的浏览器不支持 JavaScript。虽然现在使用这类浏览器的寥寥几个，但有两个因素迫使我们继续考虑可能无法处理我们\
    \ JavaScript 代码的环境。\n- 首先，所有现代浏览器都允许用户控制是否运行 JavaScript 代码。在许多情况下，用户对自己的公司政策没有发言权，甚至可能不知道他们的工作机器已经禁用了\
    \ JavaScript。\n- 其次，并不是所有的访问者都会使用可以利用任何 JavaScript 的浏览器。盲文显示器、屏幕阅读器和其他非视觉浏览器对许多\
    \ JavaScript 技巧几乎无用武处。此外，像 Google 这样的搜索引擎会忽略你在页面上使用的使用的任何 JavaScript，这可能会隐藏重要内容并导致你的页面无法被索引。\n\
    - 不支持 JavaScript 的浏览器应该忽略起始和结束 script 标签之间的任何内容。然而，许多浏览器违反了这一规则，并尝试将你的代码渲染为 HTML，这可能会导致尴尬的后果。\n\
    - 然而，我们可以利用这一特性：`<!--` 在 JavaScript 中表示单行注释，但在 HTML 中表示多行注释，以确保我们的代码能被懂 JavaScript\
    \ 的浏览器看到，而被其他任何设备视为注释掉的 HTML 而忽略：\n\n```html\n<script>\n<!-- 向旧版浏览器隐藏\n… 你的代码\n\
    // 停止隐藏代码 -->\n</script>\n```\n\n- 这防止了旧版浏览器显示代码，但如果我们想将其替换为某些注释呢？例如，假设有一段代码用于显示当天的时间并按名称问候用户。如果没有\
    \ JavaScript 并使用上述方法，页面上本该显示问候的地方将只是一片空白。\n- 我们可以使用 `<noscript>` 标签让代码在 JavaScript\
    \ 被禁用或不可用时“优雅地失败”。该元素的内容在 JavaScript 被理解的地方会被忽略，在其他任何地方都会显示。例如：\n\n```html\n<noscript>\n\
    \  <h1>欢迎来到我们的网站！</h1>\n</noscript>\n\n<script>\n<!-- 向旧版浏览器隐藏\n… 用于自定义页眉的代码\n\
    // 停止隐藏代码 -->\n</script>\n```\n\n- 打开你之前的项目文件，并将其另存为 `chapter_8.html`。\n- 在代码中添加两行以确保它不会混淆旧版浏览器或用户禁用了\
    \ JavaScript 的浏览器。\n- 添加一个 `noscript` 元素来解释你的 JavaScript 功能。通常情况下，指示用户“升级到更好的浏览器”被认为是“不礼貌的”，因为这可能会冒犯许多使用辅助设备的人——将这种形式的建议看作告诉盲人“去配几副眼镜”。\n\
    - 相地，在可能的情况下，你应该使用 `noscript` 元素提供内容，用适当的替代方案充分地替换脚本内容。例如，如果你使用 JavaScript 在页面上构建一个导航面板，那么\
    \ `noscript` 元素应该包含一个执行相同任务的纯 HTML 列表。\n\n# 9 自动重定向用户\n\n## Key Points\n- 我们在第\
    \ 4 节中已经简要看到过浏览器重定向的使用。\n- 为了更完整地阐述这一想法，为了将用户重定向到不同的页面，你需要设置 `document` 对象的 `location`\
    \ 属性。\n- 正如我们在第 6 节中所看到的，这里可以使用赋值运算符。例如：\n\n## Project\n```javascript\ndocument.location\
    \ = “http://www.bbc.co.uk/\";\ndocument.location = “chapter_4.html”;\n```\n\n\
    - 打开你之前的项目文件，并将其另存为 `chapter_9_redirect.html`。\n- 保存该文件的另一个副本，这次命名为 `chapter_9.html`。\n\
    - 确保两个文件都保存在同一个文件夹中，并且你在编辑器中打开了 `chapter_9.html`。\n- 移除 `script` 标签之间所有的脚本，除了你隐藏浏览器的行。确保\
    \ `script` 标签仍然位于页面的 `head` 部分。\n- 现在，在此脚本中添加一条语句，以便页面一加载到浏览器中就会自动重定向用户到 `chapter_9_redirect.html`\
    \ 页面。\n- 最后，在页面的 `body` 部分添加一个 header 标签，包含文本“你看不见我！”\n- 关闭此页面，先不要在浏览器中检查，在编辑器中打开页面\
    \ `chapter_9_redirect.html`。\n- 移除此页面上的所有 JavaScript（包括你的 script 标签），确保页面只剩下 HTML。\n\
    - 在页面的 `body` 部分添加一个 header 标签，包含文本“但你可以看到我！”\n- 保存此页面，并在浏览器中加载页面 `chapter_9.html`。\n\
    - 尝试 `chapter_9.html` 中 `script` 标签的不同位置，看看是否能让 header 在重定向之前出现。\n\n# 10 Alert,\
    \ Prompt and Confirm\n\n## Key Points\n- 到此为止，我们已经看到了 alert、prompt 和 confirm 框的简要示例，它们用于请求用户响应，并在后台暂停所有代码直到请求得到满足。\n\
    - 所有这些框都是 `window` 对象方法的结果。该对象是 JavaScript 在浏览器中可以处理的最高层对象。因此，页面上的所有其他对象（除少数例外外）实际上都是\
    \ `window` 对象的属性。\n- 由于它的无处不在，即使省略它，它的存在也会被假设。因此，在技术上我们应该写 `window.document.write(“…”)`，但写\
    \ `document.write(“…”)` 同样有效，正如我们一直所做的。\n- 同样，与其写 `window.alert(“…”)`，我们可以轻松地写\
    \ `alert(“…”)`。\n- 这三个方法的原型为：\n\n```javascript\nwindow.alert(message);\nwindow.confirm(message);\n\
    window.prompt(message, default_response);\n```\n\n- Alert 在点击“确定”清除时将始终返回 `true`\
    \ 值。\n- Confirm 根据清除对话框选择的响应返回 `true` 或 `false`。\n- Prompt 将返回输入的值，如果没有输入任何内容则返回\
    \ `null`，如果取消了对话框则返回 `false`。\n\n## Project\n- 打开你之前的项目文件，并将其另存为 `chapter_10.html`。\n\
    - 清除之前的重定向代码，并确保 `script` 标签已返回文档的 `head` 部分。\n- 在页面脚本中添加一条新语句，在显示页面其余部分之前显示以下消息：欢迎来到我的网站！点击确定继续。\n\
    - 在浏览器中检查你的页面。\n\n"
- fmt: "\n- We will use `alert`, `confirm`, and `prompt` throughout this course. Take\
    \ a moment to try each of them in turn on this page, each time stopping to review\
    \ your changes.\n- Use the `write` method of the `document` object to check the\
    \ return values of each method. For example:\n\n```\ndocument.write(alert(“hello\
    \ world”));\n```\n\nMake sure that you place this particular snippet of code in\
    \ `script` tags within the body area of the page, as we are generating text output\
    \ to be rendered by the browser. Also, note the use (or not) of quotes here. More\
    \ next chapter!\n\n# 11 Variables and Operators\n\n## Key Points\n\n- We have\
    \ been introduced to the concepts of objects and their various properties and\
    \ methods. These inter-related concepts allow any web page to be broken down into\
    \ little snippets of information or data, which can then be accessed by JavaScript\
    \ and, in many cases, changed.\n- However, what if we want to create our own storage\
    \ space for information that doesn’t necessarily have a page-based counterpart?\
    \ For example, what if we wanted to store the previous value of a `document`’s\
    \ `title` property before changing it, so it could be retrieved later, or if we\
    \ wished to store the date time that the page was loaded into the browser for\
    \ reproduction in several places on the page, and didn’t want to have to recalculate\
    \ the time on each occasion?\n- Variables are named containers for values within\
    \ JavaScript. They are similar to object properties in many ways, but differ importantly:\n\
    - In a practical sense, variables have no “parent” object with which they are\
    \ associated.\n- Variables can be created (“declared”) by you as a developer,\
    \ and can be given any arbitrary name (within certain rules) – object properties,\
    \ however, are restricted by the definition of the parent object. It would make\
    \ no sense, for example, for our piano object in the previous chapters to have\
    \ a `propeller` property!\n- Variable name rules are straightforward – no spaces,\
    \ names must start with a letter. Examples of valid variable names are: `BrowserName`,\
    \ `page_name`, `Message1`, `MESSAGE1`.\n- In many browsers, JavaScript is case-sensitive,\
    \ which means that the last two variables in the example above are distinct variables.\
    \ It is a good idea to pick a particular naming style for your variables, and\
    \ to stick to it within your projects.\n- At the simplest level, variables can\
    \ store three different types of value:\n\n### Numbers\n- e.g. `1.3324`, `3.14159`,\
    \ `100000`, `-8` etc.\n\n### Strings\n- e.g. “JavaScript for Beginners, week 3”,\
    \ “Hello World” etcc.\n\n### Boolean Values\n- e.g. `true`, `false`\n\n- Note\
    \ that strings can contain numbers, but the following variable values are not\
    \ equivalent: `1.234` and `“1.234”`. The latter is a string value. This becomes\
    \ important. consider: `1+2 = 3`, `“a” + “b” = “ab”`, `“1” + “2” = “12”`.\n- Some\
    \ developers use their own naming convention with variable names to denote the\
    \ type of value expected to be contained in a given variable. This can often be\
    \ helpful, but is in no way required by JavaScript (c.f. JavaScript comments).\n\
    - For example, `strMessage` might indicate a string variable, where `numPageHits`\
    \ might indicate a numerical value in the variable.\n- Variable assignment is\
    \ accomplished in the same way as object property assignment. When a variable\
    \ is assigned a value for the first time, it is automatically created. This is\
    \ different from other programming languages, where a variable must be created\
    \ explicitly first, before it can be loaded with a value.\n- Some examples of\
    \ variable assignment follow:\n\n```\nnumBrowserVersion = 5.5;\nnumTotal += 33;\n\
    Message = “Hello!”;\nMessage = “Goodbye”; \nMessage = 3;\n```\n- Note that the\
    \ last three examples show that variable values can be altered after their initial\
    \ assignment, and also that the type of value stored in a variable can be altered\
    \ in a similar manner.\n- Once a variable has been created and a value stored\
    \ within, we will want to be able to access it and perhaps manipulate it. In a\
    \ similar manner to object properties, we access our variables simply by calling\
    \ them:\n\n```\nMessage = “Hello World!”;\nalert(Message);\n```\n- Note that we\
    \ do not use quote marks around our variable names. The above code is different\
    \ from:\n\n```\nalert(“Message”);\n```\nfor hopefully obvious reasons.\n- As well\
    \ as using variables for storage and access, we can combine and manipulate them\
    \ using operators. For example:\n\n```\na = 12;\nb = 13;\nc = a + b; // c is now\
    \ 25\nc += a; // c is now 37\nc = b + “ Hello!”; // c is now “13 Hello!”\n```\n\
    - Our last example may have been unexpected – we added a number to a string and\
    \ got a string as a result. JavaScript is smart enough to realise that a number\
    \ cannot be “added” to a string in a numerical sense, so it converts the number\
    \ temporarily to a string and performs a concatenation of the two strings. Note\
    \ that `b` remains `13`, not “13”.\n- A table of operators:\n\n| Operator | Function\
    \ |\n| :--- | :--- |\n| `x + y` | Adds x to y if both are numerical – otherwise\
    \ performs concatenation |\n| `x – y` | Subtracts x from y if both are numerical\
    \ |\n| `x * y` | Multiplies x and y |\n| `x / y` | Divides x by y |\n| `x % y`\
    \ | Divides x by y, and returns the remainder |\n| `-x` | Reverses the sign of\
    \ x |\n| `x++` | Adds 1 to x AFTER |\n| `++x` | Adds 1 to x BEFORE |\n| `x--`\
    \ | Subtracts 1 from x AFTER |\n| `--x` | Subtracts 1 from x BEFORE |\n\n## Project\n\
    - Open your previous file, and save it under the name `chapter_1.html`.\n- Clear\
    \ the previous `script` tags and ensure the `script` tags are contained in the\
    \ body.\n- Assign the message “Welcome to” to `var_1`, and “my site” to `var_2`.\n\
    - Create a third variable `var_3`, and assign to it the value of `var_1 + var_2`.\
    \ Use an alert box to check the value of `var_3`.\n- Test this page in your browser.\n\
    - If the text in the alert box does not appear as expected, consider the use of\
    \ spaces in the variable assignments, and correct the error.\n- Now, modify your\
    \ code to produce the same result without requiring a third variable.\n- Clear\
    \ all statements from the `script` tags.\n- Add two statements to the `script`\
    \ which assign the numbers `100` to one variable and `5.5` to another.\n- Use\
    \ `document.write` to show the effects of each of the operators given in the table\
    \ on the two numerical values.\n- Substitute one of the numerical values for a\
    \ text string and repeat the procedure. Note the differences.\n\n12 Comparisons\n\
    \n## Key Points\n\n- Comparison operators compare values with each other. Most\
    \ commonly, they are used to compare the contents of two variables – for example\
    \ we might want to check if the value of `var_1` was greater than that of `var_2`.\n\
    - When you use a comparison operator, the value that is returned from the comparison\
    \ is invariably a Boolean value of either `true` or `false`. For example, consider\
    \ the following statements:\n\n```\nvar_1 = 4;\nvar_2 = 10;\nvar_3 = var_1 > var_2;\n\
    ```\nIn this case, the value of `var_3` is false. Note that the Boolean value\
    \ of false is not the same as the text string “false”:\n\n```\nvar_4 = false;\
    \ // Boolean value\nvar_5 = “false”; // Text string\n```\n- Common comparison\
    \ operators are given below:\n\n| Comparison | Function |\n| :--- | :--- |\n|\
    \ `X == y` | Returns true if x and y are equivalent, false otherwise |\n| `X !=\
    \ y` | Returns true if x and y are not equivalent, false otherwise |\n| `X > y`\
    \ | Returns true if x is numerically greater than y, false otherwise |\n| `X >=\
    \ y` | Returns true if x is numerically greater than or equal to y, false otherwise\
    \ |\n| `X < y` | Returns true if y is numerically greater than x, false otherwise\
    \ |\n"
