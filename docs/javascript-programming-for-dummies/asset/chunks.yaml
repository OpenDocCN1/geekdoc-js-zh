    o We will use these variables to traᴄk the ᴄloᴄ’s status.


    o Now, add statements to the `start_clock()` funcition that will:


    *   Get the ᴄurrent time.

    *   Format the ᴄurrent time as hh:mm:ss am/pm (as appropriate).

