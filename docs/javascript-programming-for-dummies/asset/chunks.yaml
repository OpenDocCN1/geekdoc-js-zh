  trans: "\n\n| `String.match(/exp/)` | 根据对字符串的正则表达式搜索结果返回 true 或 false |\n\n- 这里的最后一个方法值得我们说明一下。正则表达式是什么？\n\
    \n### 什么是正则表达式？\n\n 正 正则表达式是一种编写易于识别的字符“模式”的标准方法。例如，考虑一个典型的电子邮件地址：`[jonathan@relativesanity.com]`。\n\
    - 电子邮件地址遵循一种特定的“模式”，这使得人类能够一眼识别出它是一个电子邮件地址。如果我们能在 JavaScript 中定义这种模式并供浏览器使用，那不是很有用吗？正则表达式允许我们恰好做到。\n\
    - 让我们再次看那个电子邮件地址。我们可以将其拆解为如下的“原型”电子邮件地址：`[一些字母]@[更多字母].[少数几个字母]`\n- 显然，它比这要稍微复杂一些——某些字符是不允许出现在电子邮件地址的特定部分的（例如，不能有空格），但这能让你理解将此字符串拆分为所需的“分块”的思路。\n\
    - 现在，将其转换为正则表达式。就像我们在 JavaScript 中使用引号来表示（或“定界”）字符串值一样，为了表示正则表达式，我们使用正斜杠：`/`。我们的电子邮件地址正则表达式可能像这样：`/^.+@.+\\\
    ..$/`\n- 这值得一些讨论。让我们逐个字符来看：\n    - `/` 表示正则表达式的开始。\n    - `^` 表示我们希望这个正则表达式出现在我们搜索的字符串的最开头。\n\
    \    - `.+` 点符号 `.` 用于代表任何字符。加号 `+` 表示我们想要找到至少一个这样的字符。所以这等同于我们的纯英语短语 `[一些字母]`。\n\
    \    - `@` 这仅仅是一个字符——除了表示我们想在从字符串开始的至少一个字符之后找到一个 `@` 字符外，它没有其他特殊含义。\n    - `.+`\
    \ 与之前相同——在 `@` 之后至少再多于一个字符。\n    - `\\.` 这很有趣。我们知道点符号在正则表达式中有特殊含义——它意味着“匹配任何字符”。然而在这里，我们想要找到一个真正的点。与没有特殊含义的\
    \ `@` 不同，我们必须告诉 JavaScript 忽略点的特殊含义。我们通过在它前面加一个反斜杠 `\\` 来做到，这告诉 JavaScript 将紧随其后的字符视为没有特殊含义。这是你在编程过程中会遇到的很多约定。\n\
    这里的最终结果是，我们想在一系列字符之后匹配一个点。\n    - `.+` 再次，在点之后至少再多一个字符。\n    - `$` 它是开头 `^` 的镜像——这匹配测试字符串的结尾。\n\
    \    - `/` 告诉 JavaScript 我们已经到了正则表达式的结束。\n呼！这里有很多需要考虑的内容。正则表达式最好的情况下也是一门深奥的艺术，所以如果上面的代码无法理解，也不要太担心。现在重要的是意识到，我们可以在\
    \ JavaScript 中执行一些相当复杂的模式识别，而不需要多次检查字符串的每个单独字符。\n- 下面代码检查一个变量看它看起来像电子邮件地址：\n```javascript\n\
    var_1 = prompt(\"Your email?\", \"\"); \nif ( var_1.match(/^.+@.+\\..+$/) ) {\n\
    \    alert(\"valid email address\");\n}\nelse {\n    alert(\"are you sure?\");\n\
    }\n```\n- 这段代码目前存在几个问题——例如，它会顺利地通过字符串 `[-@-.-]`，这显然是错误的。我们将在课程后面的部分讨论解决方法。\n\n\
    ## 项目\n\n- 打开你之前的项目文件，并将其保存为 `chapter_18.html`。\n- 清空 `script` 标签中所有的 JavaScript\
    \ 代码。\n- 使用提示框（prompt box）获取用户输入并赋值给名为 `check_string` 的变量。\n- 使用 `document.write`\
    \ 语句输出当应用于用户输入时，各种字符串方法的结果。\n- 检查用户输入是否为电子邮件地址，并相应地更改你的输出为“That’s an email address”（这是一个电子邮件地址）或“That\
    \ doesn’t look like an email address to me!”（在我看来这不像电子邮件地址！）。\n- 在后一种情况下，也输出失败的字符串，以便用户可以看到他们的输入并在下次适当进行修改。\n\
    \n# 19 使用函数\n\n## 关键点\n\n- 函数是一组命名的 JavaScript 语句，用于执行特定任务并出现在标准的 `<script>` 标签内部。任务可以简单也可以复杂，函数的名称由你决定，且与变量命名的限制相似。\n\
    - JavaScript 函数在使用之前会声明。声明如下：\n```javascript\nfunction name_of_function()\n{\n\
    \    …在此处编写你的代码…\n}\n```\n- 与我们目前学过的所有 JavaScript 指令不同，函数内部的代码在没有被明确请求之前不会运行。这种请求被称为函数调用。\n\
    - 函数可以从页面上 JavaScript 可以存在的任何地方调用，但必须在函数声明之后调用。例如，如果你在 `document` 的主体中声明了一个函数，然后在\
    \ `document` 的头部（head）中调用它，你可能会发现浏览器返回了错误信息。由于由于原因，大多数 JavaScript 程序员会将他们要使用的任何函数定义在页面头部部分的\
    \ `<script>` 标签之间，以确保它们在在使用之前都已定义。\n- 函数之于对象方法，就像变量之于对象属性——它们的调用方式也相似。要运行上述 `name_of_function`\
    \ 函数中的代码，我们将使用以下行代码：\n```javascript\nname_of_function();\n```\n- 注意函数名后的括号。这让\
    \ JavaScript 知道我们正在处理的是一个函数而不是变量。括号还允许我们向函数“传递”额外信息，这可以改变它的行为。考虑以下函数：\n```javascript\n\
    function greet_user( username )\n{\n    message = \"Hello \" + username; alert(message);\n\
    }\n```\n- 每当函数被调用时，它都会问候指定的用户名。我们如何如何传递这个信息呢？考虑：\n```javascript\ngreet_user(\"\
    Anisa\");\n```\n或者\n```javascript\nvar_1 = prompt(\"Name?\", \"\"); greet_user(var_1);\n\
    ```\n- 我们应该在代码中尽可能使用函数。每当我们执行一个无法通过使用方法或赋值运算符完成的操作时，我们应该尝试构建一个可以完成该任务的函数。\n- 例如，我们可以构建一个检查电子邮件地址的函数：\n\
    ```javascript\nfunction check_email( address )\n{\n    var_1 = false;\n    if\
    \ ( address.match(/^.+@.+\\..+$/) ) {\n        var_1 = true;\n    }\n}\n```\n\
    - 上述函数将接收一个字符串（通常称为函数的参数），并根据它的发现更改 `var_1` 的值。然而，该函数缺少一项重要的能力——将其发现的结果返回给脚本其他部分的能力。\n\
    - 我们在笔记中提到过返回值。现在我们看到了一个需要函数将其结果返回给代码其他部分的情况。理想情况下，我们希望能够像这样使用上面的函数：\n```javascript\n\
    if ( check_email(address) ) {\n    …执行一些邮件相关操作…\n}\n```\n- 为了让此起作用，`check_email`\
    \ 的返回值必须是一个布尔值。我们可以非常简单地安排：\n```javascript\nfunction check_email( address )\n\
    {\n    var_1 = false;\n    if ( address.match(/^.+@.+\\..+$/) ) {\n        var_1\
    \ = true;\n    }\n    return var_1;\n}\n```\n- 由于 `var_` 要么是 true 要么是 false，返回值将是布尔值。我们在这里甚至可以跳过变量的使用变得更加直接：\n\
    ```javascript\nfunction check_email( address )\n{\n    if ( address.match(/^.+@.+\\\
    ..+$/) ) {\n        return true;\n    }\n    return false;\n}\n```\n- 或者更好，因为\
    \ `address.match()` 本身就会返回一个布尔值：\n```javascript\nfunction check_email( address\
    \ )\n{\n    return address.match(/^.+@.+\\..+$);\n}\n```\n\n"
- fmt: "\n- The above function may not seem like a great saving. After all, we are\
    \ using four lines of code to define a function that performs only one line of\
    \ code. compare:\n\n```javascript\nfunction check_email( address )\n{\n  return\
    \ address.match(/^.+@.+\\..+$);\n}\n\nif ( check_email(address) )\n{\n  …do some\
    \ email things…\n}\n```\n\nwith:\n\n```javascript\nif ( address.match(/^.+@.+\\\
    ..+$/) )\n{\n  …do some email things…\n}\n```\n\n- While the benefits here are\
    \ not obvious, consider the case where, at some point in the future, you discover\
    \ a better method of checking for email addresses. In the second case above, you\
    \ will have to search your code for each and every instance of that method, and\
    \ replace it with your new method, which may not be one line of code. In the first\
    \ case, you will just have to change the underlying function definition, and the\
    \ “upgrade” will be effective throughout your code without you having to update\
    \ each occurrence.\n\n## Project\n\n- Open your previous project file, and save\
    \ it under the name `chapter_19.html`.\n- Clear all JavaScript code from your\
    \ `script` tags.\n- Ensure that you have a `script` element in the head area of\
    \ your document, and one in the body area.\n- In the head area, define a function\
    \ called `show_message`. This function should take one argument, called `message`,\
    \ and should use an alert box to display the contents of the argument.\n- In the\
    \ body area, call the function with various messages as arguments.\n- Now use\
    \ a variable in the body area to store the return value of a prompt asking the\
    \ user for a message. Use this variable as the argument to a single instance of\
    \ `show_message`.\n- Define a new function in the head area called `get_message`.\
    \ It should take no argument, but should replicate the function of your prompt\
    \ in the body area and ask the user for a message via a prompt box.\n- Make sure\
    \ that `get_message` returns a sensible value. We are aiming to replace our prompt\
    \ statement in the body area with the following code:\n```javascript\nmessage\
    \ = get_message();\n```\nso consider what you will have to return to enable this\
    \ to work.\n- Once you are happy with your `get_message` definition, try replacing\
    \ your prompt code in the body area with the statement above.\n- To demonstrate\
    \ the power of functions, change the action of `show_message` to write the message\
    \ to the page without changing any code in the body area of the page.\n\n# 20\
    \ Logical Operators\n\n## Key Points\n\n- In our discussion of conditionals, we\
    \ saw how to check the veracity of a single condition via a comparator:\n```javascript\n\
    if ( x > some_value )\n{\n  …expressions…\n}\n```\n- We have also seen the limitations\
    \ of such an approach. Let us say we wanted to discover if `x` lay between two\
    \ values, say `val_1` and `val_2`. There are a number of ways we could achieve\
    \ this. In our example on student grades, we learned that we could use an `if…else`\
    \ pair to achieve this effect:\n```javascript\nif ( x > val_1 )\n{\n  …do something…\n\
    }\nelse\nif ( x > val_2 )\n{\n  …do something else…\n}\n```\n- The above code\
    \ achieves what we want – for the second branch, `x` must lie between `val_2`\
    \ and `val_1` (assuming `val_1` is greater than `val_2`, of course). However,\
    \ it’s rather unwieldy, and does not scale elegantly to checking three conditions\
    \ (say we wanted to check if `x` was an even number as well), or in fact to ten\
    \ conditions.\n- Enter Logical Operators. These operators are used to join together\
    \ conditional checks and return true or false depending on whether all or any\
    \ of the checks are true.\n- In English, we refer to these operators by using\
    \ the words “AND” and “OR”.\n- For example, say we wanted to do something each\
    \ Tuesday at 8pm. We would want to check whether the current day was Tuesday,\
    \ and whether the time was 8pm.\n- Another example: Let’s say we wanted to do\
    \ something on the first Tuesday of each month, and also on the 3rd of the month\
    \ as well. We would have to check whether the current day was the first Tuesday\
    \ of the month, or whether it was the 3rd day of the month.\n- Note in the last\
    \ example, if both conditions were true, then we would be on Tuesday the 3rd and\
    \ would perform the action. In other words, an `or` condition allows for either\
    \ one, or the other, or both conditions to be true.\n- In JavaScript, we use the\
    \ following syntax to check multiple conditions:\n`( 100 > 10 && 5 < 8 )`\ntranslates\
    \ as “if 100 is greater than 10 and 5 is less than 8”. In this case, the result\
    \ is true.\n`( 100 > 200 && 4 < 9 )`\nin this case, the result is false. Note\
    \ here that only the first condition is actually checked. Since `and` requires\
    \ both comparisons to be true, as soon as it finds a false one it stops checking.\
    \ This can be useful.\n`( 100 > 10 || 9 < 8 )`\ntranslates as “if 100 is greater\
    \ than 10 or 9 is less than 8”. In this case, the result is true, since at least\
    \ one of the conditions is met.\n`( 100 > 200 || 9 < 8 )`\nin this case, the result\
    \ is false, since neither of the conditions is met.\n`( 100 > 10 || 9 < 8 )`\n\
    in this case, the result is true, since at least one of the conditions is met.\n\
    - In JavaScript, we use `&&` for logical AND and `||` for logical OR.\n\n## Project\n\
    \n- Open your previous project file, and save it under the name `chapter_20.html`.\n\
    - Clear all JavaScript code from your `script` tags.\n- Ensure that you have a\
    \ `script` element in the head area of your document, and one in the body area.\n\
    - Copy the file `available_plugins.js` from the network (your tutor will demonstrate\
    \ this), and open it using Notepad’s `File > Open`.\n- Copy and paste the entire\
    \ contents of `available_plugins.js` into your `script` element in the head area.\
    \ Note that it defines a large array. The array has various components that can\
    \ be present in web browsers (such as Flash or Quicktime).\n- Add a function to\
    \ the head area script element called `flash_exists()`. This function should use\
    \ a for loop to check each of the `available_plugins` array and establish if Flash\
    \ is present.\n- Add a further function to the head area script element called\
    \ `quicktime_exists()`. This function should also use a for loop to check each\
    \ element of the array, this time returning true if Quicktime is present.\n- Finally,\
    \ add a function to the head area script element called `both_quicktime_and_flash_exist()`.\
    \ This function should call both of the previous functions, store their results\
    \ in a variable, and produce an alert box containing the message:\n- “Both Quicktime\
    \ and Flash” if both functions returned true;\n- or “One of Quicktime or Flash\
    \ is missing” if either of the functions return false.\n- Call the final function\
    \ from the body area script element.\n- Check your results in your browser.\n\n\
    # 21 Using Event Handlers\n\n## Key Points\n\n- So far, our scripts have run as\
    \ soon as the browser page has loaded. Even when we have used functions to “package”\
    \ our code, those functions have run as soon as they have been called in the page,\
    \ or not at all if no call was made. In other words, the only event our scripts\
    \ have so far responded to has been the event of our page loading into the browser\
    \ window.\n- Most of the time, however, you will want your code to respond specifically\
    \ to user activities. You will want to define functions, and have them spring\
    \ into action only when the user does something.\n"
