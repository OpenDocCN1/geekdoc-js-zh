- fmt: "\n| `String.match(/exp/)` | Returns true or false based on a regular expression\
    \ search of the string |\n\n- The final method here deserves some comment. What\
    \ is a regular expression?\n\n### What is a regular?\n\n- A regular expression\
    \ is a standard way of writing down a “pattern” of characters that is easily recognisable.\
    \ For example, consider a typical email address: `[jonathan@relativesanity.com]`\n\
    - An email address follows a “pattern” which makes it instantly recognisable as\
    \ an email address to a human. Wouldn’t it be handy if we could define that pattern\
    \ in JavaScript for a browser to use? Regular expressions allow us to do just\
    \ that.\n- Let’s look at our email address again. We can break it down to a “prototype”\
    \ email address as follows: `[some letters]@[some more letters].[a few more letters]`\n\
    - Of course, it’s slightly more complex than that – there are some characters\
    \ which aren’t allowed to be in certain parts of the email address (no spaces,\
    \ for example), but this lets you see the idea of breaking this string up into\
    \ required “chunks”.\n- Now, to convert this to a regular expression. Just as\
    \ we use quote marks to denote (or “delimit”) string values in JavaScript, to\
    \ signify a regular expression, we use forward slashes: `/`. Our email address\
    \ regular expression might look like this: `/^.+@.+\\..$/`\n- This warrants some\
    \ discussion. Let’s look at this a character at a time:\n    - `/` denotes the\
    \ start of the regular expression.\n    - `^` denotes that we want this regular\
    \ expression to be found at the very beginning of the string we are searching.\n\
    \    - `.+` the dot symbol is used to stand in for any character. The plus signifies\
    \ we want to find at least one of those. So this is equivalent to our plain-English\
    \ phrase `[some letters]`.\n    - `@` this is simply a character – it has no special\
    \ meaning other than to say we want to find an `@` character after at least one\
    \ character from the beginning of the string.\n    - `.+` the same as before –\
    \ at least one more character after the `@`.\n    - `\\.` This is interesting.\
    \ We know that the dot symbol has a special meaning in a regular expression –\
    \ it means “match any character”. However, here we want to find an actual dot.\
    \ Unlike `@`, which has no special meaning, we have to tell JavaScript to ignore\
    \ the dots' special meaning. We do this by preceding it with a backslash `\\`,\
    \ which tells JavaScript to treat the character immediately following it as though\
    \ it has no special meaning. This is a convention you will come across many times\
    \ while programming. The net result here is that we want to match a dot after\
    \ a series of characters.\n    - `.+` and again, at least one more character after\
    \ the dot.\n    - `$` this is the mirror of the `^` at the beginning – this matches\
    \ the end of the tested string.\n    - `/` tells JavaScript we are at the end\
    \ of the regular expression.\nPhew! Lots to consider here. Regular expressions\
    \ are an arcane art at the best of times, so don’t worry too much if the above\
    \ code is indecipherable. The important thing to realise at the moment is that\
    \ we can perform some quite sophisticated pattern recognition in JavaScript without\
    \ having to resort to checking each individual character of a string multiple\
    \ times.\n- The following code checks a variable to see if it looks like an email\
    \ address:\n```javascript\nvar_1 = prompt(\"Your email?\", \"\"); \nif ( var_1.match(/^.+@.+\\\
    ..+$/) ) {\n    alert(\"valid email address\");\n}\nelse {\n    alert(\"are you\
    \ sure?\");\n}\n```\n- There are a few problems with this code at the moment –\
    \ for example, it will pass the string `[-@-.-]` quite happily, which is clearly\
    \ wrong. We will look at ways around this later on in the course.\n\n## Project\n\
    \n- Open your previous project file, and save it under the name `chapter_18.html`.\n\
    - Clear all JavaScript code from your `script` tags.\n- Use a prompt box to capture\
    \ some user input to a variable called `check_string`.\n- Use a `document.write`\
    \ statement to output the results of each of the various string methods when applied\
    \ to the user input.\n- Check the user input to see if it’s an email address,\
    \ and alter your output accordingly to either “That’s an email address” or “That\
    \ doesn’t look like an email address to me!”.\n- In the latter case, output the\
    \ failed string as well so that the user can see their input and modify it next\
    \ time, if appropriate.\n\n# 19 Using Functions\n\n## Key Points\n\n- A function\
    \ is a named set of JavaScript statements that perform a task and appear inside\
    \ the standard `<script>` tags. The task can be simple or complex, and the name\
    \ of the function is up to you, within similar constraints to the naming of variables.\n\
    - JavaScript functions are declared before they are used. The declaration looks\
    \ like this:\n```javascript\nfunction name_of_function()\n{\n    …your code here…\n\
    }\n```\n- Unlike all the JavaScript instructions we have looked at so far, the\
    \ code inside a function will not be run until specifically requested. Such a\
    \ request is called a function call.\n- Functions can be called from anywhere\
    \ on the page that JavaScript can live, but must be called after the function\
    \ has been declared. For example, if you declare a function in the body of a `document`\
    \ and then call it from the head of the `document`, you may find that the browser\
    \ returns an error message. For this reason, most JavaScript programmers define\
    \ any functions they are going to use between `<script>` tags in the head section\
    \ of their pages to ensure that they are all defined before they are used.\n-\
    \ Functions are to object methods as variables are to object properties – they\
    \ are also called in a similar manner. To run the code contained in the `name_of_function`\
    \ function above, we would use the following line of code:\n```javascript\nname_of_function();\n\
    ```\n- Note the parentheses after the function name. This lets JavaScript know\
    \ that we are dealing with a function and not a variable. The parentheses also\
    \ allow us to “pass” extra information to the function, which can alter its behaviour.\
    \ consider the following function:\n```javascript\nfunction greet_user( username\
    \ )\n{\n    message = \"Hello \" + username; alert(message);\n}\n```\n- Whenever\
    \ the function is called, it will greet the user named. How can we pass this information\
    \ through? consider:\n```javascript\ngreet_user(\"Anisa\");\n```\nor\n```javascript\n\
    var_1 = prompt(\"Name?\", \"\"); greet_user(var_1);\n```\n- We should use functions\
    \ in our code as often as possible. Whenever we perform an action that isn’t accomplished\
    \ by the use of a method or an assignment operator, we should try to build a function\
    \ that can accomplish the task.\n- For example, we can build a function to check\
    \ email addresses:\n```javascript\nfunction check_email( address )\n{\n    var_1\
    \ = false;\n    if ( address.match(/^.+@.+\\..+$/) ) {\n        var_1 = true;\n\
    \    }\n}\n```\n- The above function will take a string that is passed to it (often\
    \ called the function’s argument), and will alter the value of `var_1` depending\
    \ on what it finds. However, the function is lacking an important ability – the\
    \ ability to communicate its findings back out to the rest of the script.\n- We\
    \ have mentioned return values a few times in the notes. Now we see a situation\
    \ that requires a function to return its findings to the rest of the code. Ideally,\
    \ we’d like to be able to use the above function as follows:\n```javascript\n\
    if ( check_email(address) ) {\n    …do some email things…\n}\n```\n- In order\
    \ for this to work, the return value from `check_email` would have to be a Boolean\
    \ value. We can arrange this quite simply:\n```javascript\nfunction check_email(\
    \ address )\n{\n    var_1 = false;\n    if ( address.match(/^.+@.+\\..+$/) ) {\n\
    \        var_1 = true;\n    }\n    return var_1;\n}\n```\n- Since `var_` is either\
    \ true or false, the returned value will be Boolean. We can even skip the use\
    \ of the variable here and be more direct:\n```javascript\nfunction check_email(\
    \ address )\n{\n    if ( address.match(/^.+@.+\\..+$/) ) {\n        return true;\n\
    \    }\n    return false;\n}\n```\n- or even better, since `address.match()` will\
    \ return a Boolean value of its own:\n```javascript\nfunction check_email( address\
    \ )\n{\n    return address.match(/^.+@.+\\..+$);\n}\n```\n"
