- fmt: "\n- Note two things: firstly, this use of the HTML comment format does not\
    \ require a closing `-->` tag. Secondly, this is only a one line comment, unlike\
    \ its use in HTML, which comments all lines until the closing comment tag.\n-\
    \ You can add multiple-line comments by enclosing the comment block between `/*`\
    \ and `*/`. For example:\n\n```javascript\n/* all of this text is going to be\
    \ ignored by JavaScript. This allows us to\nwrite larger comments without worrying\
    \ about having to individually “comment out” each line */\nalert(“Hello World”);\n\
    \n/* a one line, “mult-line” comment */\n```\n\n- As well as adding narrative\
    \ to your script, you can use comments to remove code from your pages without\
    \ having to delete the code. For example:\n\n```javascript\n// this was the old\
    \ message\n// alert(“Hello World”);\n// and this is the new message alert(“Hello\
    \ everyone!”);\n```\n\n- This can be very useful if you are trying to track down\
    \ an error in your code – you can “comment out” each suspect line in turn until\
    \ you manage to get your code working again.\n\n## Project\n- Open your previous\
    \ project file, and save it under the name `chapter_7.html`.\n- Add the single\
    \ line comment `This is my first comment` to the beginning of your script.\n-\
    \ Add a multi-line comment to your script, replacing your previous single line\
    \ comment. The multi-line comment should describe what your script does at present.\n\
    \n# 8 Hiding Scripts from Older Browsers\n\n## Key Points\n- Very old browsers\
    \ don’t understand JavaScript. There are very few such browsers in use today,\
    \ but two factors force us to continue to consider environments that may not be\
    \ able to cope with our JavaScript code.\n- Firstly, all modern browsers allow\
    \ users to control whether JavaScript code will be run. In many cases, users will\
    \ not have any say over their company policy, and may not even know that their\
    \ work machine has had JavaScript disabled.\n- Secondly, not all of your visitors\
    \ will be using browsers that can make any use of JavaScript. Braille displays,\
    \ screen readers and other non-visual browsers have little use for many JavaScript\
    \ tricks. In addition, search engines like Google will ignore any JavaScript you\
    \ use on your pages, potentially hiding important content and causing your pages\
    \ to remain un-indexed.\n- Browsers that don’t support JavaScript are supposed\
    \ to ignore anything between the opening and closing script tags. However, many\
    \ break this rule and will attempt to render your code as HTML, with potentially\
    \ embarrassing consequences.\n- However, we can use the fact that `<!--` denotes\
    \ a single line comment in JavaScript but a multi-line comment in HTML to ensure\
    \ that our code is seen by a JavaScript-savvy browser, but ignored as commented-out\
    \ HTML by anything else:\n\n```html\n<script>\n<!-- hidefrom older older browsers\n\
    … your code\n// stop hiding code -->\n</script>\n```\n\n- This prevents older\
    \ browsers from displaying the code, but what if we want to replace this with\
    \ some comment. For example, let’s say we had a bit of code that displayed the\
    \ time of day and greeted our user by name. Without JavaScript and using the method\
    \ above, there would simply be a blank on the page where the greeting should have\
    \ been.\n- We can use the `<noscript>` tag to cause our code to “fail gracefully”\
    \ where JavaScript has been disabled or is unavailable. The contents of this element\
    \ will be ignored where JavaScript is understood, and displayed anywhere else.\
    \ For example:\n\n```html\n<noscript>\n  <h1>Welcome to our site!</h1>\n</noscript>\n\
    \n<script>\n<!-- hidefrom older browsers\n… code to customise header\n// stop\
    \ hiding code -->\n</script>\n```\n\n- Open your previous project file, and save\
    \ it under the name `chapter_8.html`.\n- Add two lines to your code to ensure\
    \ that it will not confuseuse older browsers or browsers where the user has disabled\
    \ JavaScript.\n- Add a `noscript` element to explain what your JavaScript does.\
    \ It is generally considered “bad form” to instruct your user to “upgrade to a\
    \ better browser”, as this can insult many people who use assistive devices –\
    \ consider this form of advice to be similar to the advice that tells a blind\
    \ person “to get some glasses”.\n- Instead where possible you should use the `noscript`\
    \ element to provide content that adequately replaces the scripted content with\
    \ a suitable replacement. For example, if you use your JavaScript to build a navigation\
    \ panel on your page, the `noscript` element should contain a plain HTML list\
    \ that does the same job.\n\n# 9 Automatically Redirecting the User\n\n## Key\
    \ Points\n- We have already briefly seen the use of browser redirection in chapter\
    \ 4.\n- To formulate the idea more completely, in order to redirect the user to\
    \ a different page, you set the `location` property of the `document` objects.\n\
    - As we saw in chapter 6, we can use the assignment operator here. For example:\n\
    \n## Project\n```javascript\ndocument.location = “http://www.bbc.co.uk/\";\ndocument.location\
    \ = “chapter_4.html”;\n```\n\n- Open your previous project file, and save it under\
    \ the name `chapter_9_redirect.html`.\n- Save another copy of the file, this time\
    \ called `chapter_9.html`.\n- Make sure both files are saved in the same folder,\
    \ and that you have `chapter_9.html` open in your editor.\n- Remove all script\
    \ from between the `script` tags, except for your browser hiding lines. Make sure\
    \ that the script tags are still in the head section of the page.\n- Now, add\
    \ a single statement to this script that will automatically redirect the user\
    \ to the page `chapter_9_redirect.html` as soon as the page is loaded into a browser.\n\
    - Finally, add a header tag to the body section of the page containing the text\
    \ “You can’t see me!”.\n- Close this page, don’t check it in a browser yet, and\
    \ open the page `chapter_9_redirect.html` in your editor.\n- Remove all JavaScript\
    \ from this page (including your script tags) and ensure that only HTML remains\
    \ on the page.\n- Add a header tag to the body section of the page containing\
    \ the text “But you can see ME!”.\n- Save this page, and load the page `chapter_9.html`\
    \ into your browser.\n- Experiment with various positions for the script tags\
    \ on `chapter_9.html` to see if you can make the header appear before the redirection.\n\
    \n# 10 Alert, Prompt and Confirm\n\n## Key Points\n- So far, we have seen brief\
    \ examples of alert, prompt and confirm boxes to request a response from the user,\
    \ and to pause all code in the background until the request is satisfied.\n- All\
    \ of these boxes are the result of methods of the `window` object. This object\
    \ is the highest level object that JavaScript can deal with in a browser. As such,\
    \ all other objects on a page (with a few exceptions) are actually properties\
    \ of the `window` object.\n- Because of this ubiquity, its presence is assumed\
    \ even if it is omitted. Thus, where we technically should write `window.document.write(“…”)`,\
    \ it is equally valid to write `document.write(“…”)`, as we have been doing.\n\
    - Similarly, instead of writing `window.alert(“…”)`, we can happily write `alert(“…”)`.\n\
    - The prototypes of the three methods are:\n\n```javascript\nwindow.alert(message);\n\
    window.confirm(message);\nwindow.prompt(message, default_response);\n```\n\n-\
    \ Alert will always return a value of `true` when it is cleared by clicking “ok”.\n\
    - Confirm will return either `true` or `false` depending on the response chosen\
    \ to clear the box.\n- Prompt will return either the value typed in, `null` if\
    \ nothing is typed in, and `false` if the box is cancelled.\n\n## Project\n- Open\
    \ your previous project file, and save it under the name `chapter_10.html`.\n\
    - Clear the previous redirection code, and ensure that the script tags have been\
    \ returned to the head section of the document.\n- Add a new statement to the\
    \ script on the page that will display the following message before the rest of\
    \ the page is shown: Welcome to my website! Click OK to continue.\n- Check your\
    \ page in your browser.\n"
