  trans: "\n* 在页面上的文本字段中显示格式化后的时间。\n* 创建一个定时器，它将在半秒后再次运行 `start_clock()` 函数，并将该定时器的返回对象赋值给对象变量\
    \ `timer`。\n* 将变量 `timer_running` 设置为 `true`。\n* 在 `stop_clock()` 函数中添加语句，以执行以下操作：\n\
    \    * 检查时钟是否正在运行。\n    * 如果正在运行，则清除定时器并将 `timer_running` 设置为 `false`。\n* 最后，为两个表单按钮添加事件处理器，以确保标记为\
    \ Stop 的按钮在点击时调用 `stop_clock()` 函数，标记为 Start 的按钮在点击时调用 `start_clock()` 函数。\n*\
    \ 虽然这样做可以正常工作（请测试你的代码！），但你会发现输出结果有点丑。在文本字段中显示时间并不是在页面上显示时钟最不自然的方式。\n* 幸运的是，我们可以稍微修改代码来实现专业得的效果。\n\
    * 将你的输入字段替换为以下内容：\n\n```html\n<span id=\"clockBox\"></span>\n```\n* `<span>` 是一个\
    \ HTML 标签，允许你标记没有语义含义的内容区域——例如，时钟既不是段落也不是标题，所以我们不想将其标记为这些标签。\n* 通过 JavaScript，我们可以控制页面上几乎任何元素的内容。在之前的示例中，我们使用了\
    \ `getElementById`（希望如此！）来获取输入字段的引用，然后更改了它的 `value` 属性来显示我们的时钟。\n* 由于我们在这里使用了相同的\
    \ id 值，因此不需要对函数进行太大的修改。然而，`getElementById` 方法现在返回的是不同类型的对象——该对象没有 `value` 属性。\n\
    * 然而，HTML 中的所有内容标签（如 `<p>`、`<h1>`、`<div>` 等）在被作为 JavaScript 对象返回时，都有一个特殊的属性指向它们的文本内容——该属性是\
    \ `innerHTML`。\n* 我们可以利用这一点来更改标签的内容。例如，如果我们之前的输入字段解决方案有以下代码：\n\n```javascript\n\
    clk = document.getElementById(\"clockBox\"); clk.value = formatted_time;\n```\n\
    \n其中 `formatted_time` 是一个包含所需格式化时间的变量，那么将其替换为以下代码：\n\n```javascript\nclk = document.getElementById(\"\
    clockBox\"); clk.innerHTML = formatted_time;\n```\n\n将允许我们使用修改后的 `<span>` 元素来代替\
    \ `<input>` 元素。\n* 尝试调整你的代码，使用这种方法在页面上显示内容。\n"
