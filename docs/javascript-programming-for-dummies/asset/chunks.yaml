  trans: "\n\n- 鼠标离开图片后，原始图片将重新加载。\n- 正如你可能已经意识到的，我们将使用 JavaScript 来更改 `<img>` 标签的\
    \ `src` 属性。理解此点的方式是将 `<img>` 标签想象成页面上的一个简单空间，图像文件可以加载到其中。`src` 属性告诉浏览器要在该空间内加载哪张图片，因此如果我们更改了该值，图片就会发生变化。\n\
    - 换句话说，`<img>` 标签的 `id` 属性是在命名这个“空间”，而不是图片本身。\n- 现在，为了用 JavaScript 修改 `src` 属性，我们需要告诉\
    \ JavaScript 我们想要修改哪一个“空间”。我们使用上一章中的 `id` 属性结合 `getElementById()` 方法来实现这一点：\n\n\
    ```\nbutton_img = document.getElementById(\"button\"); button_img.src = “new_image.jpg”;\n\
    ```\n\n- 我们可以直接将这段代码插入到图片的事件处理程序中：\n\n```html\n<img src=”old.jpg” id=”button”\
    \ onmouseover=”document.getElementById('button').src = ’new.jpg’;\">\n```\n\n\
    - 注意，这段代码突然变得非常复杂。这里有两个即时的潜在解决方案。第一种是定义一个函数：\n\n```javascript\nfunction swap_image(\
    \ id, new_image )\n{\n  img = document.getElementById(id); img.src = new_image;\n\
    }\n```\n\n…\n\n```html\n<img src=”old.jpg” id=”button” onmouseover=”swap_image('button’,\
    \ ‘new.jpg’);\">\n```\n\n- 这是一个干净得多的解决方案，更重要的是，我们可以通过简单更改函数调用的参数，将此应用于页面上的任何图片。我们还可以使用该函数来实现“换回”的功能：\n\
    \n```html\n…\n<img src=”old.jpg” id=”button” onmouseover=”swap_image('button’,\
    \ ‘new.jpg’);” onmouseout=”swap_image('button’, ‘old.jpg’);\">\n```\n\n- 尽管如此，我们还可以进一步“清理”代码。由于事件处理程序被用于修改正在触发事件的对象（即鼠标正移动到我们试图更改的图片标签上），我们可以使用具有“自动魔法”的\
    \ JavaScript 对象 `this` 来执行操作：\n\n```javascript\nfunction swap_image( img, new_image\
    \ )\n{\n  img.src = new_image;\n}\n```\n\n…\n\n```html\n<img src=”old.jpg” id=”button”\
    \ onmouseover=”swap_image(this, ‘new.jpg’);\">\n```\n\n- 注意几点。首先，`this` 周围没有引号——我们像使用变量名一样使用它。其次，我们的函数现在直接使用第一个参数，而不是使用它从页面中获取相关对象。我们可以这样做是因为\
    \ `this` 实际上是一个对象——它会获得调用它时所属的任何对象的属性和方法，在本例中，它等同于 `document.getElementById('button’`，尽管显然要短得多！\n\
    \n- 使用 `this` 有一些局限性。例如，如果我们想在鼠标移动到“button”上时更改页面上任何其他图片的 `src` 属性，我们将无法使用 `this`，因此必须定义另一个接受\
    \ `id` 作为参数的函数，并以这种方式获取相关对象。\n\n# 项目\n\n- 从网络驱动器复制名为 `buttons` 的文件夹到你的项目文件夹。\n\
    - 打开你之前的项目文件，并将其保存为 `chapter_23.html`。\n- 清除你脚本标签中的所有 JavaScript 代码。\n- 确保你在文档的\
    \ head 区域有一个 script 元素，且 body 区域没有。\n- 在页面的 body 区域内，创建一个包含六个 `<img>` 元素的段落。设置图片的\
    \ `src` 属性以加载你复制的 `buttons` 文件夹中的以下文件，并给每个图片一个合理的 `id`：\n    - `contacts.jpg`\n\
    \    - `home.jpg`\n    - `people.jpg`\n    - `produckts.jpg`\n    - `quotes.jpg`\n\
    \    - `whatsnew.jpg`\n- 在 head 区域的 script 元素中创建一个 JavaScript 函数，接收两个参数——一个 `id`\
    \ 和一个文件名。它应该将相应图片对象的 `src` 属性更改为给的文件。\n- 使用此函数在鼠标移动到图片上时，将 `contacts` 按钮的 `src`\
    \ 切换到 `contactsover.jpg`。\n- 一旦运行正常，更新其余五张图片，添加事件处理程序以将它们的 `src` 属性切换到相应的“悬停”图片。\n\
    - 为所有六张图片添加事件处理程序，以确保当鼠标移开时，它们能恢复原始状态。在浏览器中检查你的工作。\n- 在前一个段落上方新建一个段落，并在添加一个 `<img>`\
    \ 标签，包含图片文件夹中的 `rocollogo.jpg` 文件。\n- 在两个段落之间的新段落中添加一个文本链接。该链接应该是“虚拟”链接（即使用 `#`\
    \ 作为其 `href` 属性值），但当鼠标移动到它上时，上方的图片应该更改为显示 `rocollogo.gif`。\n- 鼠标离开文本链接应该让 logo\
    \ 回到之前的状态。\n- 在浏览器中检查你的工作。\n\n# 24 对象实例化与更好的悬停效果\n\n## 关键点\n\n- 到此为止，我们看到了一个非常简单的图片悬停示例。它是功能性的并且按预期工作，但缺乏一些细节处理。\n\
    - 具体来说，当我们使用 JavaScript 更改 `<img>` 标签的 `src` 属性时，浏览器必须从头加载这张图片。在我们的本地机器上，这不会引起明显的延迟，但在处理远程服务器时（我们将在互联网上操作），这种延迟会导致明显的“卡顿”，从而破坏动态界面的感。。\n\
    - 理想情况下，我们希望指示浏览器在加载页面时加载任何备用图片。这将让我们确保新图片已经在用户的计算机上，准备好随时切换。\n- 为了实现这一点，我们需要查看对象变量和对象实例化（或创建）。特别是，我们需要查看\
    \ `Image` 对象。\n- 页面上的每个 `<img>` 标签在 JavaScript 中都有一个对应的对象。我们已经看过了直接操作它们的方法，并对\
    \ Image 对象可能具有的一些属性有了了解。\n- 然而，我们可以直接在 JavaScript 中创建 Image 对象，而不需要在页面上有相应的 `<img>`\
    \ 标签。当我们创建一个这样的对象并设置其 `src` 属性时，浏览器会将适当的文件加载到内存，但不会在页面上显示图片。\n- 换句话说，我们可以创建存在\
    \ JavaScript 内部的“虚拟”图片，并使用这些对象来存储我们“真实”图片的备用图片。\n- 要创建一个 Image 对象（实际上是创建任何对象），我们需要使用以下代码：\n\
    \n```javascript\nvirtual_image = new Image();\n```\n\n- 我们以前见过这种语法——使用 `new` 关键字告诉\
    \ JavaScript 我们正在创建一个新对象。赋值中的 `virtual_image` 部分只是一个变量名。在这种情况下，该变量是一个对象变量，因为它包含一个对象。\n\
    - 使用此变量来预加载我们的图片，我们利用了它与其他任何图片具有相同属性和方法的特性：\n\n```javascript\nvirtual_image.src\
    \ = “contactsover.jpg”;\n```\n\n- 浏览器现在将预加载我们的图片，准备在稍后切换。\n\n## 项目\n\n- 打开你之前的项目文件，并将其保存为\
    \ `chapter_24.html`。\n- 从你之前的代码开始，在页面的 head 区域 script 元素中创建一个名为 `preload_images`\
    \ 的新函数。\n- 使用此函数创建七个新对象，并使用每个对象对应的对象变量预加载你的“悬停”变体。\n- 在浏览器中检查你的工作，确保图片切换仍然按预期工作。\n\
    - 将你的 `preload_images` 函数添加到页面的 body 标签中，以确保它在页面完成后运行。使用以下语法：\n\n```html\n<body\
    \ onload=”preload_images();\">\n```\n\n"
- fmt: "\n- Once you have verified that the image swapping still works as expected,\
    \ expand your `preload_images` function to define an array of images to preload,\
    \ and then use a `for` loop to move through the array and assign each image to\
    \ the `sr` property of an object variable. Hint: an object variable can be anything\
    \ that can store information – for example an array element.\n- Check your work\
    \ in your browser.\n\n# 25 Working with Browser Windows\n\n## Key Points\n\n-\
    \ Using standard HTML links, we can open new browser windows:\n\n```html\n<a href=\"\
    #\" target=\"_new\">link</a>\n```\n\n- The amount of control this method affords\
    \ us over the resultant image, however, is nil. We cannot control the size, shape,\
    \ location on the screen or anything else about that window with this method.\n\
    - JavaSript allows us much finer control, as we may expect:\n\n```javascript\n\
    window.open( page_url, name, parameters );\n```\n\n- As we can see from the above\
    \ prototype, there are only three arguments that this method can take. However,\
    \ the `parameters` argument is actually more complex than we might assume:\n\n\
    `\"param1,param2,param3,param4…\"`\n\nsince we can use it to add many parameters\
    \ to the method. Note there are no spaces in the parameter list.\n- `name` is\
    \ used to give the window an HTML name – so we can use that name to open links\
    \ into the new window using the `target` method above.\n- The return value from\
    \ the `open` method is an object variable referring to the newly opened window.\
    \ In other words, if we open a new window like so:\n\n```javascript\nwin = window.open(\"\
    page.html\", \"\", \"\");\n```\n\nwe can use the object variable `win` to alter\
    \ the new window through JavaSᴄript.\n- A practical example – let’s say we want\
    \ to open a new window 300 pixels high by 400 pixels wide, and display the BBC\
    \ news page in it. The following code would suffice:\n\n```javascript\nwindow.open(\"\
    http://news.bbc.co.uk/\", \"bbc\", \"width=300,height=300\");\n```\n\n- Some available\
    \ parameters are given in the table below:\n\n| Parameter | Value | Function |\n\
    | :--- | :--- | :--- |\n| location | Yes/no | Specifies whether or not the location\
    \ (address) bar is displayed |\n| menubar | Yes/no | Specifies whether the menu\
    \ bar is displayed |\n| status | Yes/no | Specifies whether the status bar is\
    \ displayed |\n| width | Pixels | Specifies the width of the new window |\n| height\
    \ | Pixels | Specifies the height of the new window |\n| resizable | Yes/no |\
    \ Allow or disallow window resizing |\n| scrollbars | Yes/no | Allow or disallow\
    \ window scrolling |\n\n- If no parameters are set, then the value of each parameter\
    \ is set to “yes” where appropriate. For example:\n\n```javascript\nwindow.open(\"\
    http://www.bbc.co.uk/\", \"bbc\", \"\");\n```\n\nis equivalent to:\n\n```html\n\
    <a href=\"http://www.bbc.co.uk/\" target=\"bbc\">\n```\n\n- However, if any parameter\
    \ is set, all others default to “no”. So if you wanted to have a scrollbar but\
    \ nothing else, the following would suffice:\n\n## Project\n\n```javascript\n\
    window.open(\"http://www.bbc.co.uk/\", \"bbc\", \"scrollbars=yes\");\n```\n\n\
    - Open your previous project file, and save it under the name `chapter_25.html`.\n\
    - Remove all functions and HTML from your previous file, leaving only the logo\
    \ image and the link.\n- Create a function in the head area script element called\
    \ `view_new_logo`. This function should:\n    - Open a new window 200 pixels square.\n\
    \    - Load the image `rocollogo.jpg` from the images folder.\n    - Be called\
    \ `RocolLogo`.\n    - Be stored in an object variable called `objNewLogo`.\n \
    \   - Have no scrollbars, be of a fixed size, and have no other features where\
    \ possible.\n- Remove all event handlers from the link, and add a new one to run\
    \ the function above when the link is clicked.\n- Once you have verified that\
    \ a window pops up as required when the link is clicked, test each parameter from\
    \ the table above in the function.\n\n# 26 Positioning Browser Windows\n\n## Key\
    \ Points\n\n- The `screen` object provides you with access to properties of the\
    \ user’s computer display screen within your JavaSript applications.\n- Some of\
    \ the available properties are:\n\n| Property | Description |\n| :--- | :--- |\n\
    | availHeight | The pixel height of the user’s screen minus the toolbar and any\
    \ other permanent objects (eg the Windows Taskbar) |\n| availWidth | As availHeight,\
    \ but dealing with horizontal space |\n| colorDepth | The maximum number of colours\
    \ the user’s screen can display (in bit format, eg 24 bit, 16 bit etc) |\n| height\
    \ | The true pixel height of the user’s display |\n| width | The true pixel width\
    \ of the user’s display |\n\n- The `left` and `top` parameters of the `open()`\
    \ method enable you to specify the position of a window on screen by specifying\
    \ the number of pixels from the left and top of the screen respectively.\n- If\
    \ you need to use a variable to specify the value of a parameter in the `open()`\
    \ method, you would do so as follows:\n\n```javascript\nwindow.open(\"index.html\"\
    , \"window_name\", \"width=200,height=200,left=\"+var_left+\"top=\"+var_top);\n\
    ```\n\nWhere `var_left` and `var_top` are the appropriate variables.\n- Note the\
    \ use of the `+` operator to ensure that the third parameter in the `open()` method\
    \ remains as one string when variables are added.\n- In order to centre the window\
    \ on the user’s screen, a little simple geometry is required. The centre of the\
    \ screen is obviously the point found when we take the width of the screen divided\
    \ by two, and take the height of the screen divided by two. However, if we set\
    \ the window’s top and left values to these coordinates, the top left corner of\
    \ the window will be centred, not the window itself.\n- In order to centre the\
    \ window, we need to subtract half of the window’s height from our top value,\
    \ and half of the window’s width from our left value. A simple script to accomplish\
    \ this is as follows:\n\n```javascript\nwin_width = 200;\nwin_height = 200;\n\
    win_left = (screen.availWidth/2) - (win_width/2);\nwin_top = (screen.availHeight/2)\
    \ - (win_height/2);\n```\n\n- By using this script, the values of `win_left` and\
    \ `win_top` will be set correctly for any window using `win_width` and `win_height`\
    \ appropriately to be centred on the screen.\n\n## Project\n\n- Open your previous\
    \ project file, and save it under the name `chapter_26.html`.\n- Modify your existing\
    \ code to ensure that the logo appears centred on the user’s screen. If possible,\
    \ do not modify your original function by doing anything more than two new functions\
    \ – `get_win_left(width)` and `get_win_top(height)`.\n\n# 27 Focus and Blur\n\n\
    ## Key Points\n\n- The `focus()` method of the `window` object gives focus to\
    \ a particular window. In other words, it ensures that the window is placed on\
    \ top of any other windows, and is made active by the computer. For example, if\
    \ we have created a new window and stored the result in an object variable called\
    \ `new_window`, we could ensure that the window was brought back to the front\
    \ at any point after it had been opened using the following code:\n\n```javascript\n\
    new_window.focus();\n```\n- Conversely, we can use the `blur()` method to remove\
    \ focus from the specified window – returning focus to the previously selected\
    \ one as appropriate. Its use is similar to the `focus()` method.\n- Both these\
    \ events have associated event handlers: `onblur` and `onfocus`. However, since\
    \ they do not have associated HTML tags, how can we attach event handlers to the\
    \ object?\n- It turns out that, within JavaSript, each object has an individual\
    \ property for each event handler it can have applied to it. For example, if we\
    \ wanted to add an event handler to an image tag on the page, we could apply either\
    \ of the following methods to do that:\n\n```html\n<img src=\"...\" id=\"test_img\"\
    \ onclick=\"do_something(); />\n```\n\n```javascript\ndocument.getElementById(\"\
    test_img\").onclick=do_something();\n```\n\n- So, to attach a function to a window’s\
    \ `onfocus` event, we could use:\n\n## Project\n\n```javascript\nnew_window.onfocus\
    \ = some_function();\n```\n\n- Open your previous project file, and save it under\
    \ the name `chapter_27.html`.\n- Modify your functtion to open another window\
    \ as well as the original one, with the following features:\n"
