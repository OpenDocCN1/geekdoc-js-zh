    - Brackets also allow us to pass certain extra information to an object’s method.
    In the above example, to write the text “Hello world!” to a web page document,
    we would write the following JavaScript:


    ```javascript

    document.write(“Hello World”);

    ```


    - Each method can do different things depending on what is put in the brackets
    (or “passed to the method as an argument”, to use the technical term). Indeed,
    many methods can take multiple “arguments” to modify its behaviour. Multiple arguments
    are separated by a comma (`,`).


    - A JavaScript instruction like those shown here is referred to as a JavaScript
    statement. All statements should end in a single semi-colon (`;`). JavaScript
    will often ignore missed semi-colons at the end of lines, and insert the semi-colon
    for you. However, this can cause some unexpected results. consider the following:


    ```javascript

    document.write(“<<h1>>


    Hello World!


    </<h1>>”);

    ```


    - In many other languages, this would be acceptable. However, JavaScript will
    often interpret something like this as the following:


    ```javascript

    document.write(“<<h1>>; Hello World!;


    </</h1>>”);

    ```


    - This interpretation will generate an error, as JavaScript will complain if you
    end a statement without ensuring that any terms between quotes have matching pairs
    of quotes. In this example, the first line’s “statement” is cut short, and JavaScript
    will fall over.


    - For this reason, it is recommended that all your statements should end with
    semi-colons.


    # 6 Assigning Values to Properties


    ## Key Points


    - While objects and methods allow us to do things on a page, such as alter the
    content or pop up dialogue boxes to interact with the user, in many cases we will
    want to alter the value of one of an object’s properties directly. These cases
    are akin to painting our piano green.


    - Given our discussion on methods so far, we might expect to be able to alter
    our object’s properties by using a method – for example, the following would seem
    logical:


    ```javascript

    piano.paint(“green”);

    ```


    - In many cases, that is exactly what we will do. However, there are two drawbacks
    here. The first is that, within this course, the majority of objects that we discover
    are built into and defined by our browser. If we rely on using a method to alter
    an object’s property, we are also relying on the fact that the method exists in
    the first place.


    - A much more direct way to solve this problem is to access the object’s properties
    directly. For example:


    ```javascript

    piano.colour=“green”;

    ```


    - Here we are no longer using a method to perform an action, we are using what
    is known as an operator. In this case, the operator has the symbol `=`, and is
    known as the assignment operator.


    - Within JavaScript, we can use this operator to great effectiveness. For example,
    we could alter the title element of a document (the text that is is displayed
    in the top bar of the browser’s window) dynamically. This could be done when a
    user clicked on a part of the page using an event handler (more later on this),
    or could be set to automatically update each minute to show the current time in
    the page title. The code we would use for this task is simple:


    ```javascript

    document.title=“a new title”;

    ```


    - There are many assignment operators in JavaScript. Some of the more common are
    shown in the table below:


    | Assignment | Function |

    | :--- | :--- |

    | `x = y` | Sets the value of x to y |

    | `x += y` | Sets the value of x to x+y |

    | `x -= y` | Sets the value of x to x-y |

    | `x *=y` | Sets the value of x to x times y |

    | `x /=y` | Sets the value of x x divided by y |


    - Not all assignment operators work with all types of values. But the addition
    assignment operator works with both numbers and text. When dealing with numbers,
    the result will be the sum of the two numbers. When dealing with text (technically
    called strings), the result will be the concatenation of the two strings:


    ## Project


    ```javascript

    document.title += “!”;

    ```


    will cause the symbol `!` to be appended to the end of the current document title.


    - Open your previous project file, and save it under the name `chapter_6.html`.


    - Remove any existing JavaScript from your script tags, but leave the tags in
    place ready for some new JavaScript.


    - Use your text editor to change the value of the title element of the page as
    follows, then load your page into a browser and view the result:


    ```html

    <title>With a little help from</title>

    ```


    - Now, add a statement to our script element to add the following text to the
    end of the current title:


    ```javascript

    ”JavaScript for Beginners!”;

    ```


    - Reload the page in your browser and note the title bar of the window.


    - If the display looks odd, consider your use of spaces…


    - All we have so far is an example that does nothing more than HTML could manage.
    Let’s introduce a new method of the window object to help us to add a little more
    dynamism and interaction to the script. change the value of the title tag as follows:


    ```html

    <title>Chapter 6: Assigning Values to Properties</title>

    ```


    - Now, remove your previous JavaScript statement and insert the following:


    ```javascript

    document.title =  window.prompt(“Your title?”, “”);

    ```


    - Reload your page and consider the result.


    - We have come across the window object before. Our demonstration of the `alert`
    method in chapter 4 could have been more properly written as:


    ```javascript

    window.alert(“message”);

    ```


    In many cases, we can omit certain parts of our object/property/method hierarchy
    when writing our code. We will discuss this again later.


    - To understand what is going on with our prompt method, we can write down a method
    prototype. This is a way of describing a method’s arguments in such a way that
    their effect on the method is more self explanatory. A prototype for the `prompt`
    method of the `window` object might look like the following:


    ```javascript

    window.prompt( message, default_response );

    ```


    - So, we can see that the first argument defines the text that appears as the
    question in the prompt dialogue box. The second argument is a little less. Try
    your code with different values and see what difference your changes make.


    - Finally, we note that this prompt method somehow takes the information typed
    into the box and passes it to our JavaScript assignment. Say someone typed “Hello
    World” into the box. It would have been as if our assignment had actually been:


    ```javascript

    document.title = “Hello World”;

    ```


    - When this sort of passing of values occurs, it is said that the method has returned
    the value passed. In this case, we would say that “the prompt method has returned
    the value `Hello World`”, or that “the return value of the prompt method was `Hello
    World`”.


    - Return values will become very important when we deal with event handlers later.


    # 7 About Comments


    ## Key Points


    - Repeat after me : comments are important. Comments are important. Comments are
    important.


    - Adding comments to your code is always good practice. As the complexity of your
    scripts grows, comments help you (and others) understand their structure when
    you come to view the code at a later date.


    - A lot of code created quickly is said to be “write only” code, as it suffers
    from an inherent lack of structure or commenting. Debugging such code, or reusing
    it months later, becomes maddening impossible as you try to remember what a certain
    line was supposed to do, or why using certain values seems to stop your code from
    working.


    - Comments are completely ignored by JavaScript and have no effect on the speed
    at which your scripts run, provided they are properly formed.


    - Comments can slow the loading of your page, however – many coders keep a “development”
    copy of their code fully commented for editing, and remove all comments from their
    code when they finally publish it.


    - There are two types of comment in JavaScript – single line comments, and multi-line
    comments.


    - Single line comments begin with two forward-slash characters (`//`), and end
    with a new line:


    ```javascript

    // this is a comment alert(“hello”); // so is this

    ```


    - Single line comments in JavaScript can also use the HTML comment format that
    you may be familiar with:


    ```html

    <!-- this is a comment alert(“hello”);

    ```

