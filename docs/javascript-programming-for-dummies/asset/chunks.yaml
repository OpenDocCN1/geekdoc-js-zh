    \n# 13 Conditionals\n\n## Key Points\n\n- Up until now, our JavaScript projects\
    \ have been unable to alter their behaviour spontaneously. When a page loads with\
    \ our JavaScript embedded within, it is unable to do anything other than what\
    \ we expect, time and again.\n- The only difference we have seen is in the use\
    \ of a prompt box to alter what is shown on a page. However, the page essentially\
    \ does the same thing with the text provided, regardless of what text is typed\
    \ in.\n- What would be really handy would be to give JavaScript a mechanism to\
    \ make decisions. For example, if we provided a prompt box asking the visitor\
    \ for their name, it might be nice to have a list of “known names” that could\
    \ be greeted differently from any other visitors to the site.\n- Conditional statements\
    \ give us that ability, and are key to working with JavaScript.\n- A conditional\
    \ statement consists of three parts:\n    - A test (often with a comparison operator,\
    \ or a comparator) to see if a given condition is true or false.\n    - A block\
    \ of code that is performed if and only if the condition is true.\n    - An optional\
    \ block of code that is performed if and only if the condition is false.\n- These\
    \ three parts are represented in JavaScript as follows:\n\n```javascript\nif (\
    \ conditional_test )\n{\n    JavaScript statement; JavaScript statement; JavaScript\
    \ statement;\n    …\n}\nelse\n{\n    JavaScript statement; JavaScript statement;\
    \ JavaScript statement;\n    …\n}\n```\n\n- Everything from the first closing\
    \ curly bracket (or brace) is optional, so the following is also a valid conditional\
    \ prototype:\n\n```javascript\nif ( conditional_test )\n{\n    JavaScript statement;\
    \ JavaScript statement; JavaScript statement;\n    …\n}\n```\n\n- In this case,\
    \ if the `conditional_test` does not return true, nothing happens.\n- An example\
    \ of complete conditional statement is as follows:\n\n```javascript\nif ( var_1\
    \ > var_2 )\n{\n    alert(\"Variable 1 is greater\");\n}\nelse\n{\n    alert(\"\
    Variable 2 is greater\");\n}\n```\n\n- Note that the above condition is not necessarily\
    \ always correct. Consider the case where `var_1` is equal to `var_2`. In that\
    \ case, the above code will produce the message that “Variable 2 is greater”,\
    \ since `var_1 > var_2` returns false. In this case, we want to add an additional\
    \ condition to the `else` branch of code:\n\n```javascript\nif ( var_1 > var_2\
    \ )\n{\n    alert(\"Variable 1 is greater\");\n}\nelse\nif ( var_1 < var_2 )\n\
    {\n    alert(\"Variable 2 is greater\");\n}\n```\n\n- In this case, equality will\
    \ produce no output, as neither of the conditions will return true. For completeness,\
    \ we could add a final `else` branch to the statement:\n\n```javascript\nif (\
    \ var_1 > var_2 )\n{\n    alert(\"Variable 1 is greater\");\n}\nelse\nif ( var_1\
    \ < var_2 )\n{\n    alert(\"Variable 2 is greater\");\n}\nelse\n{\n    alert(\"\
    The variables are equal\");\n}\n```\n\n- Note that in this case, we don’t have\
    \ to check for equality in the final branch, as if `var_1` is neither greater\
    \ than nor less than `var_2`, then – numerically at least – the two must be equal.\n\
    - We can continue adding as many else-if statements as required to this stack.\n\
    - If you only have one statement following your conditional test, the braces may\
    \ be omitted:\n\n```javascript\nif ( var_1 > var_2 ) alert(\"Variable 2 is greater\"\
    );\n```\n\n- However, if you later want to add further statements to this conditional\
    \ branch, you will have to add braces around the block, and this can lead to confusion.\
    \ It is recommended that you use braces to enclose all blocks of conditional code.\n\
    - Consider the following block of code:\n\n```javascript\nif ( var_1 > 4 )\n{\n\
    \    var_2 = var_1;\n}\nelse\n{\n    var_2 = 4;\n}\n```\n\n- This code is rather\
    \ long, but achieves comparatively little – `var_2` is equal to `var_1` or `4`,\
    \ whichever is greater.\n- A more compact way of writing this could be:\n\n```javascript\n\
    var_2 = 4;\nif ( var_1 > var_2 )\n{\n    var_2 = var_1;\n}\n```\n\n- However,\
    \ an even more compact way of writing this could be to use the ternary operator:\n\
    \n```javascript\nvar_2 = (var_1 > 4) ? var_1 : 4;\n```\n\n- In the above statement,\
    \ the conditional is evaluated and, if true, the value returned is the value between\
    \ `?` and `:` symbols, or if false, it is the value between the `:` and `;` symbols.\n\
    \n## Project\n\n- Open your previous project file, and save it under the name\
    \ `chapter_13.html`.\n- Clear all JavaScript code from your `script` tags.\n-\
    \ Create two variables and assign numerical values to them.\n- Use a conditional\
    \ statement to show alert boxes declaring which variable is the greater of the\
    \ two.\n- Consider the following code:\n\n```javascript\nvar_3 = (var_1 > var_2);\n\
    ```\n\n- Use this code in your script to simplify your conditional checking code.\n\
    - Now, use a prompt box to ask your visitor their name. Assign this name to `var_3`.\n\
    - Check to see if the name typed in is your own name. If it is, use `document.write`\
    \ to display a personalised greeting on the page. Otherwise, display a generic\
    \ greeting.\n- Use multiple else-if branches to check the typed name against the\
    \ names of some of your friends. Create personalised messages for all of them.\n\
    - There may be a way to simplify your conditional greeting code to use only one\
    \ `document.write` statement. See if you can figure out how. Hint – how might\
    \ you use a variable called `greeting`?\n\n## Project 2\n\n- In many cases, the\
    \ brevity of your conditional statements will rely on your ability to formulate\
    \ the right “questions” to consider when performing your tests. Try to make your\
    \ solution to the following problem as concise as possible.\n- Clear all of your\
    \ current code from the `script` tags.\n- Ensure that your `script` tags are currently\
    \ situated in the `body` section of the page.\n- Create a variable called `exam_result`\
    \ and store a numerical value of between `0` and `100` in it.\n- Use an `if` statement\
    \ and multiple `else-if` statements to check the value of this variable against\
    \ the following exam scheme, and print out the appropriate message to the page:\n\
    \n| Exam Result | Result Message |\n| :--- | :--- |\n| 90 or more | Excellent.\
    \ Pass with Distinction. |\n| Between 70 and 89 | Well Done. Pass with Honours\
    \ |\n| Between 55 and 69 | Just passed. |\n| 54 or below | Failed. Do better next\
    \ time. |\n\n- Test your result in your browser. Vary the value of `exam_result`\
    \ and check the value shown in the browser. For extra practice, try to use a prompt\
    \ box to make changes to your `exam_result` variable as easy as possible.\n\n\
    # 14 Looping\n\n## Key Points\n\n- The letters `i`, `j` and `k` are traditionally\
    \ used by programmers to name variables that are used as counters. For example,\
    \ at different stages of the program, `i` may contain the numbers 1, 2, 3 etc.\n\
    - In order to achieve a counting effect, you will need to increment or decrement\
    \ the value of your counting variable by a set value. Here are some examples:\n\
    \n```javascript\ni = i + 1; i = i - 1; i = i + 35; incr = 10 i = i + incr;\n```\n\
    \n- To keep things concise, we can use the following shortcuts:\n\n```javascript\n\
    i++; // equivalent to i = i + 1\ni--; // equivalent to i = i - 1\n```\n\n- Counting\
    \ in JavaScript, like many other programming languages, often begins at zero.\n\
    - In many cases, this makes a lot of sense, as we will see. However, it can often\
    \ cause confusion. Consider starting at 0 and counting up to 10. In that case,\
    \ we may have actually counted 11 items:\n\n| | |\n| :--- | :--- |\n| 0 | (1)\
    \ |\n| 1 | (2) |\n| 2 | (3) |\n"
