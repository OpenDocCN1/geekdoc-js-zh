  trans: "\n\n-   按照惯例，当笔记希望你将所有代码输入在同一行时，它们会使用像上面的箭头  那样表示你不应该在该处换行。对于 HTML 来说，这并不重要，但对于\
    \ JavaScript 来说，错误位置的换行会导致你的代码无法运行。\n\n-   保存你的新网页，并在网络浏览器中查看它。目前，请使用 Internet\
    \ Explorer 查看此页面。要这样做，请在你的用户驱动器上找到保存的文件，并双击它。这将默认用 Internet Explorer 打开该文件，让你看到你刚刚创建的标题。\n\
    \n-   到为止，我们还没有做任何 HTML 范围之外的事情。让我们在页面上添加一些 JavaScript 吧。\n\n-   （一般来说）网页上有三个地方可以添加\
    \ JavaScript 的地方。其中第一个是在一组新的 HTML 标签之间。这些 `script` 标签采用以下形式：\n\n```html\n<script\
    \ language=”JavaScript”  type=”text/JavaScript\">\n… code …\n</script>\n```\n\
    \n-   上面的 `script` 元素几乎可以放置在 HTML 页面中任何可以放置元素的地方——也就是说，可以放置在 `head` 元素或 `body`\
    \ 元素中。它最常见的是放在前者，尽管通常是为了让你所有的代码都能在页面上被找到。\n\n-   同时请注意，HTML 页面中包含的 `script` 元素数量没有限制。除非出于谨慎考虑，否则没有什么能阻止你在页面上散布上百个这样的标签。\n\
    \n-   让我们把起始和结束的 `script` 标签添加到页面的 `head` 元素中，如下所示：\n\n```html\n<html>\n<head>\n\
    <title> … </title>\n<script language=”JavaScript”  type=”text/JavaScript\">\n\
    </script>\n</head>\n…\n```\n\n-   保存文件，然后尝试在浏览器窗口中刷新页面。注意，什么都没有发生。这是我们预期的——到为止我们所做的只是在页面设置一个区域来存放我们的\
    \ JavaScript。\n\n-   回到记事本，在起始和结束的 `script` 标签之间输入以下文本：\n\n```javascript\nwindow.alert(“Hello\
    \ world!”);\n```\n\n-   保存更改，再次在浏览器窗口中刷新页面。欢迎来到 JavaScript 世界！\n\n-   回到记事本，删除你刚刚添加的\
    \ `window.alert` 行。现在添加以下稍复杂一点的代码：\n\n```javascript\nif( confirm(“Go to Google?”)){\
    \ document.location =  “http://www.google.com/”; }\n```\n\n-   再次保存更改并刷新页面。对于关注后续章节的人来说，这是一个条件语句的示例，我们要求\
    \ JavaScript 检查某事的条件（在本情况下，即我们对问题的回答），然后根据它的发现来改变它的行为。\n\n-   现在，当页面加载到浏览器时，这两段\
    \ JavaScript 代码都不受控制地运行了。在大多数情况下，我们希望能够更精确地控制 JavaScript 何时执行我们要求的操作。\n\n-   这种控制是事件（events）的领域。在浏览器中，HTML\
    \ 文档的每个元素都关联了若干可能在其发生的事件。链接可以被点击，表单可以提交，页面可以加载等等。\n\n-   修改你 `script` 元素中之前的 JavaScript\
    \ 代码以匹配以下内容：\n\n```javascript\nfunction go_to_google() {\n  if( confirm(“Go to\
    \ Google?”)){ document.location =  “http://www.google.com/”; }\n}\n```\n\n- \
    \  小心这里的括号！\n\n-   保存并刷新，注意这次什么都没有发生。这是因为我们把之前的操作（弹出问题并根据响应采取行动）封装在一个函数（function）中。函数是一个被赋予名称的代码块——在本例中，名称是\
    \ `go_to_google()`——并且只有当该名称被“调用”时才会运行。将函数想象成魔法咒可能很有用，念出它们的名字时就可以被召唤。\n\n-   要调用这个魔咒，我们需要在页面上选择一个元素来触发它。一个自然的候选者是链接元素，因此在你的页面的\
    \ `body` 部分添加以下 HTML：\n\n```html\n<p>A quick <a href=\"#”>test</a>.</p>\n```\n\
    \n-   `#` 链接是一个通 HTML HTML 技巧，允许我们创建一个“通往无何处的链接”。\n\n-   保存并刷新，检查链接是否出现在页面上，以及点击它时是否没有去任何地方。\n\
