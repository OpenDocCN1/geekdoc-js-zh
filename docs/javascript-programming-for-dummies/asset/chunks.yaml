    `Week`:

    - Use the days of the week as indexes for each element of the array.

    - Assign a task to each day of the week as each associative element is created.

    - Use a `for` loop to display a calendar on the page, as follows:


    ```

    Monday: task

    Tuesday: task etc…

    ```


    - Modify your code to use a prompt box to ask the visitor to choose a day, and
    display on the page the task allotted to that day.


    # 17 Two Dimensional Arrays


    ## Key Points


    - Referring back to our mailbox analogy, where our array could be pictured as
    a row of mailboxes, each with its own contents and label, a two dimensional array
    can be thought of as a series of these rows of mailboxes, stacked on top of each
    other.

    - In reality, a two dimensional array is simply an array in which each element
    is itself an array. Each “sub array” of a two dimensional array can be of a different
    length – in other words, the two dimensional array doesn’t have to be “square”.

    - You can access the contents of each sub array by using two pairs of square brackets
    instead of just one. An example will illustrate this best:


    ```javascript

    array_1 = ["element”, “element 2”];

    array_2 = ["another element”, 2, 98, true]; array_3 = [array_1, array_2]; alert(array_3[1][3]);
    // displays “98”

    ```


    - While you can’t mix numerical and string indexing systems in a single array
    (i.e. an array cannot be both numerical and associative), you can have both associative
    and numeric arrays in two dimensional arrays. For example, consider the above
    recast as follows:


    ```javascript

    array_3 = new Array(); array_3["firstArray"] = array_1; array_3["secondArray"]
    = array_2;

    alert(array_3["secondArray”][3]);

    //displays “98” again

    ```


    - Similarly, we can happily use our “objective” notation for associative arrays:


    ## Project


    ```javascript

    alert(array_3.secondArray[3]);

    //displays “98” yet again

    ```


