    - The above method (the use of a `for` loop to iterate through a series of array
    elements) is one of the first common programming techniques we have discussed
    in this course. Its usefulness cannot be overstated, as it allows us to perform
    repetitive tasks on a series of related elements without necessarily knowing what
    those elements might be when we wrote the code. It can be applied to form elements,
    cookies, page elements, pages, windows, and just about any other collection of
    object that you might wish to manipulate with JavaScript.

    - To reinforce this generalism, if you have not used the `array.length` value
    in your loop, consider its use now. To prove that you created a more generic loop,
    try the code with an array of days instead of an array of months, and see if you
    have to change any of the looping code.


    # 16 Associative & Objective Arrays


    ## Key Points


    - We have already seen that we can access array elements by their index:


    ```javascript

    arrDays = ["Monday”, “Tuesday”];

    // print “Monday” to the page document.

    document.write(arrDays[0]);

    ```


    - However, it might be more useful to be able to name our array elements. By default,
    an array will be created as a numeric array. We can also create an associative
    array:


    ```javascript

    arrDays = new Array();

    arrDays["Monday”] = “Go to the dentist”; arrDays["Tuesday”] = “Attend JavaScript
    class”;

    arrDays["Wednesday”] = “JavaScript homework”;

    // remind you of Wednesday’s task

    alert(arrDays["Wednesday”]);

    ```


    - This looks a lot like our previous discussion of objects and properties. In
    fact, since an array is actually an object, we can access its elements as though
    they were properties:


    ```javascript

    // remind you of Wednesday’s task

    alert(arrDays.Wedensday);

    ```


    - Note a subtle difference here – in our previous, numeric array examples, the
    names of the week days were the values of our array elements. Here, the names
    of the week days are the indexes of our elements. Avoid the following common error:


    ```javascript

    arrDays = ["Monday”,“Tuesday”]; arrDays["Monday”] = “Go to work”;

    // this is actually equivalent to arrDays = new Array();

    arrDays[0] = “Monday”; arrDays[1] = “Tuesday”;

    arrDays["Monday”] = “Go to work”;

    ```


    ## Project


    - and `arrDays.length` is now 3, not 2

