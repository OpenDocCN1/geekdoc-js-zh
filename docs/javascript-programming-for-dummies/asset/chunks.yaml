  trans: "\n\n# 简介\n\n*   如果没有 JavaScript，服务器将处理所有通过表单提交的信息的验证和处理。在客户端使用 JavaScript\
    \ 可以为用户节省时间，并创建一个更高效的流程。\n*   部分处理可以由 JavaScript 完成（例如，数学计算），并且 JavaScript 可以确保只有正确的数据被发送到服务器进行处理。\n\
    *   JavaScript 与服务器端处理结合使用——它不是后者的替代品。\n*   要访问表单中的信息，我们使用 `document` 对象的 `getElementById()`\
    \ 方法，就像我们之前访问页面上的其他对象一样。例如，如果我们在页面上有像这样的一个表单：\n\n```html\n<form id=”testForm”\
    \ … >\n</form>\n```\n\n我们将在 JavaScript 中通过以下方式访问它：\n\n```javascript\ndocument.getElementById('testForm');\n\
    ```\n\n*   生成的对象实际上是一个多维数组。它的每一个元素本身都是一个数组，其中包含了有关表单元素（文本框、按钮等）的信息。通过在适当的 `<INPUT>`\
    \ 标签中为表单的每个元素正确命名，你可以访问与表单的每个元素相关的信息。\n*   要访问存储在 id 为 `Enquiry` 的表单中名为 `Name`\
    \ 的文本框中的数据，你使用如下的 `value` 属性：\n\n```javascript\nobjForm = document.getElementById('Enquiry');\n\
    strValue = objForm.Name.value\n```\n\n*   向服务器发送表单数据有两种方法。使用 `method` 属性，你可以指定\
    \ `GET` 或 `POST` 方法：\n\n```html\n<form id =”enquiryform” method=”GET”…\n```\n\
    ```html\n<form id =”enquiryform” method=”POST”…\n```\n\n*   通常情况下，如果你想从表单发送大量数据（例如文件、大量文本），应该使用\
    \ `POST` 方法。如果你想处理搜索表单等，应该使用 `GET`，因为 `GET` 表单将像 URL 一样被传输，因此可以作为书签或链接被“保存”。\n\
    *   通常，你会将表单发送到服务器端脚本，该脚本由表单的 `action` 属性指定：\n\n```html\n<form id=”enquiryform”\
    \ method=”GET”\n→ action=”process.php”…\n```\n\n*   当用户点击表单的提交（Submit）按钮时，在没有\
    \ JavaScript 干预的情况下，表单数据将直接发送到服务器进行处理。但通过在 `<form>` 标签中包含 `onsubmit` 事件处理器，你可以在发送之前拦截数据（这样就可以用\
    \ JavaScript 对其进行处理）。这允许你在发送数据之前运行 JavaScript 函数：\n\n```html\n<form id=”enquiryform”\
    \ method=”GET”\n→ action=”process.php”\n→ onsubmit=”functionName()”>\n```\n\n\
    *   在上面的示例中，当用户点击提交按钮时，首先运行函数 `functionName()`，然后将数据发送到服务器。\n*   当表单提交触发 submit\
    \ 事件时，浏览器会等待发现事件处理器返回了什么。默认情况下，事件处理器将返回 `true`。然而，如果事件处理器返回 `false` 值，表单的提交将被中止，页面将不会提交到服务器。\n\
    *   通过从你的函数中返回 `true` 或 `false` 值（在上面的示例中 `functionName()`），并确保该值也是 `onsubmit`\
    \ 事件处理器的返回值，你可以决定表单数据是否真的被发送到服务器。\n*   你通过以下方式指定函数的返回值也是 `onsubmit` 事件处理器的返回值：\n\
    \n```javascript\nonsubmit=\"return functionName();\n```\n\n## 项目\n\n*   打开你之前的项目文件，并将其另存为\
    \ `chapter_31.html`。\n*   清除页面 body 元素中的任何内容，并确保 head 区域的脚本 (script) 元素中没有代码。\n\
    *   将此页面另存为 `processing_31.html`，并在 body 区域放置一个显示“success!”的 <h1> 元素。\n*   现在，关闭你的\
    \ `processing_31.html` 页面，并在原始的 `chapter_31.html` 页面上使用 HTML 创建表单——如果你在在这方面有困难，导师将提供一个示例供复制。你的表单应该：\n\
    \    *   拥有 `id` 为 `jsCourseForm`。\n    *   有一个 `name` 值为 `name` 的单个输入框。\n   \
    \ *   有一个提交按钮。\n    *   使用 `GET` 方法提交。\n    *   其 `action` 属性为 `processing_31.html`。\n\
    \    *   有一个 `onsubmit` 事件处理器，返回（尚不存在的）`check_form()` 函数的值。\n*   现在，在 head 区域的脚本元素创建一个名为\
    \ `check_form()` 的函数。该函数应该：\n    *   使用 `document` 的 `getElementById()` 方法将表单对象的引用存储在一个对象变量中。\n\
    \    *   将表单的 name 元素的值存储在另一个变量中。\n    *   如果 name 元素的值不是“Bugs Bunny”，应该弹出一个警告框显示：\n\
    \      抱歉，朋友！你拼错了名字……或者你还没实力……再试一次。\n    *   此外，应该阻止表单提交。\n*   然而，如果用户输入了正确的名称，表单应该无中断地提交。\n\
    *   在浏览器中检查你的工作。\n\n# 32 表单方法与事件处理器\n\n## 关键点\n\n*   每个表单元素（例如文本框、按钮等）都有一组相关的属性。这些属性对于不同的元素不同。`value`\
    \ 属性是大多数表单元素通用的。\n*   你可以将存储在 id 为 `Enquiry` 的表单中名为 `Name` 的文本框中的数据赋值给变量，如下所示：\n\
    \n```javascript\nvariable = document.getElementById('Enquiry');\n→ variable.value\n\
    ```\n\n*   表单对象也有与之关联的方法。这些方法对于每个表单对象不同。\n*   以下是文本对象的常用方法：\n\n| 方法 | 描述 |\n|\
    \ :--- | :--- |\n| `blur()` | 移除文本框焦点 |\n| `focus()` | 文本框焦点 |\n| `select()` |\
    \ 选中文本框 |\n\n*   以下是按钮对象的常用方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `blur()` | 移除按钮焦点\
    \ |\n| `focus()` | 按钮焦点 |\n| `click()` | 调用按钮的 `onclick` 事件处理器 |\n\n*   表单对象也有与之关联的事件处理器。这些处理器对于每个表单对象不同。\n\
    *   以下是文本对象的常用事件处理器：\n\n| 事件处理器 | 在运行时运行 JavaScript |\n| :--- | :--- |\n| `onblur`\
    \ | 文本框失去焦点时。 |\n| `onfocus` | 文本框获得焦点时。 |\n| `onselect` | 用户选中文本框中的某些文本时 |\n\
    | `onchange` | 文本框失去焦点且内容被修改过时 |\n\n*   以下是按钮对象的常用事件处理器：\n\n| 事件处理器 | 在运行时运行 JavaScript\
    \ |\n| :--- | :--- |\n| `onBlur` | 按钮失去焦点时 |\n| `onFocus` | 按钮获得焦点时 |\n| `onClick`\
    \ | 用户点击按钮时 |\n\n*   最后，如果你要向服务器发送数据，提交按钮不是唯一的方法。你可以在事件处理器调用的函数中使用 `submit()`\
    \ 方法。这种操作就像点击了提交按钮一样：\n\n```javascript\ndocument.getElementById('Enquiry').submit();\n\
    ```\n\n## 项目\n\n*   打开你之前的项目文件，并将其另存为 `chapter_32.html`。\n*   按照以下方式修改你的表单：\n\
    \    *   移除提交按钮。\n    *   使用标准的表单按钮替换提交按钮。\n    *   为该按钮添加事件处理器以调用 head 区域脚本元素中的函数。\n\
    \    *   移除表单上的 `onsubmit` 事件处理器。\n*   现在，按照以下方式修改 `check_form()` 函数：\n    * \
    \  如果用户输入的名称是“Bugs Bunny”，该函数使用表单的 `submit()` 方法提交表单。\n    *   如果用户输入其他任何内容，则显示之前的警告框且表单不提交，但同时：\n\
    \        * 文本框中显示“please try again”字样。\n        * 文本框获得焦点。\n        * 文本框中的文本被选中。\n\
    *   在浏览器中检查你的工作。\n\n"
- fmt: "\n# 33 JavaScript and Maths\n\n## Key Points\n\n- The `Math` object is a pre-defined\
    \ JavaScript object containing properties and methods which you can use for mathematical\
    \ computation.\n- Below is a selection of some useful `Math` methods:\n\n| Method\
    \ | Returns |\n| :--- | :--- |\n| `Math.cell()` | The smallest integer greater\
    \ than or equal to a number. That is, it rounds up any number to the next integer.\
    \ `Math.cell(2.6)` returns 3 and so does `Math.cell(2.2)`. |\n| `Math.floor()`\
    \ | The largest integer greater than or equal to a number. That is, it rounds\
    \ down any number to the next integer. `Math.floor(2.2)` returns 2 and so does\
    \ `Math.floor(2.6)`. |\n| `Math.max(n1,n2)` | The larger of the two arguments.\
    \ |\n| `Math.min(n1,n2)` | The smaller of the two arguments. |\n| `Math.random()`\
    \ | A random number between 0 and 1. |\n| `Math.round()` | The number rounded\
    \ to its nearest integer. |\n| `Math.sqrt()` | The square root of a number. |\n\
    \n- You don’t need to include a Submit button in a form and you don’t need to\
    \ send form data to the server. You could use event handlers to invoke JavaScript\
    \ code which merely processes the data on the form (e.g. you may just perform\
    \ some mathematical computations on some user data).\n- If you are not sending\
    \ the data to the server, there is no need to include either the `Action` or `Method`\
    \ attributes in the `<FORM>` tag, though by default the `Action` will usually\
    \ submit to the current page, and the `Method` will be set to “get”.\n\n## Project\n\
    \n- Open your previous project file, and save it under the name `chapter_33.html`.\n\
    - Remove all content from the body section of the page.\n- Copy the file `max_wins.html`\
    \ from the network, and open it using Notepad’s `File > Open` command.\n Copy\
    \ and paste the entire contents of `max_wins.html` into your current project file,\
    \ into the body element of the page.\n- Remove all JavaScript code from the script\
    \ element in the head section of the page.\n- Take some time to open your project\
    \ file in a browser, and study the code. This project will enable the page to:\n\
    \    - Generate two random numbers when the button is pressed.\n    - Display\
    \ the random numbers in the text boxes marked `player 1` and `player 2`.\n   \
    \ - Compare the two random numbers and display the name of the player whose number\
    \ is higher in the text box marked winner.\n- When studying the code, note that\
    \ the form has no valid action or method attributes. It also has no “submit” button.\
    \ We are not going to allow the form to submit to the server at all, but are going\
    \ to use JavaScript to do all our processing on the form.\n- Now, modify the HTML\
    \ code on the page to add an event handler to invoke a new function defined in\
    \ the head area script element. The function should perform the following operations\
    \ when the form button is clicked:\n    - Place two separate random integers between\
    \ 0 and 100 in each of the Player text boxes.\n    - Find a way to use a `Math`\
    \ method to compare the two entered integers. Once compared, the function should\
    \ then place the appropriate value of Player 1, Player 2, or Draw in the Winner\
    \ text box.\n- Check your work in your browser.\n\n# 34 Object Variables – A Refresher\n\
    \n## Key Points\n\n- Referring to objects can be a lengthy process. Consider the\
    \ Player 1 text box in the previous example. You refer to it in full as follows:\n\
    \  `document.getElementById(\"MaxWins\").Player1`\n- This notation although precise,\
    \ is tedious, time consuming and can be prone to error. Luckily, there are some\
    \ shortcuts which can save time and reduce typing errors.\n- We can use an object\
    \ variable to simplify our work whenever we are in situations where certain objects\
    \ need to be referred to repetitively. To use an object variable, you begin by\
    \ simply assigning it a specific object:\n  `Player1 = document.getElementById(\"\
    MaxWins\").Player1`\n- Once assigned, you can use the object variable in any situation\
    \ where you would use the specific object itself. Using the object variables from\
    \ the previous paragraph:\n  `Player1.value`\n  is the same as:\n  `document.getElementById(\"\
    MaxWins\").Player1.value`\n- Bear in mind that you assign objects to object variables.\
    \ You would assign a text box or a button or an image et to an object variable\
    \ and then refer to that object’s properties as shown above (`Player1.value`).\
    \ You don’t assign text or string values to object variables. So:\n  `Player1\
    \ = document.getElementById(\"MaxWins\").Player1.value`\n  would merely assign\
    \ the value stored in `Player1` to the variable `Player1`.\n- Hopefully it is\
    \ obvious that you don’t need to include the ‘o’ at the beginning of the object\
    \ variable’s name. It’s just a convention to help distinguish between the different\
    \ types of variables.\n\n## Project\n\n- Open your previous project file, and\
    \ save it under the name `chapter_34.html`.\n- Modify the function in the head\
    \ area script element in the following way:\n    - All specific object which are\
    \ referred to more than once are each assigned their own object variable at the\
    \ start of the function.\n    - References to specific objects in the code are\
    \ replaced by the appropriate object variables.\n- Test your work in your browser\
    \ to ensure that it functions as before.\n\n# 35 Actions From Menu Items\n\n##\
    \ Key Points\n\n- The HTML `<select>` form tag enables you to create a menu (select\
    \ box) of options from which the user can choose:\n```html\n<form id=\"menu\"\
    >\n<select name=\"Product\">\n<option value=\"one\">Image one</option>\n<option\
    \ value=\"two\">Image two</option>\n<option Value=\"three\">Image three</option>\n\
    </select>\n</form>\n```\n- Ordinarily, selecting an option from a select box merely\
    \ specifies the value of the select box. This is then used for further processing\
    \ – either by JavaScript or by the server.\n- You can use JavaScript to invoke\
    \ actions based on the current value of a select box (the selected option). These\
    \ actions might be directly loading another page or performing some other type\
    \ of processing.\n- Another name for this type of action is a “jump menu”.\n-\
    \ In order to do this, you need to know that each select box on a form has a select\
    \ object associated with it. Using the above example, you can therefore access\
    \ the current value of the select box (ie the value of its currently option) which\
    \ is located on the Product form, in the following way:\n  `document.getElementById(\"\
    menu\").Product.value`\n- As you would expect, the select option has methods and\
    \ event handlers associated with it:\n    - The `focus()` method gives the focus\
    \ to a select box.\n    - The `blur()` method removes the focus from the select\
    \ box.\n- The available event handlers for the select object are given below:\n\
    \n| Event handler | Runs JavaScript when |\n| :--- | :--- |\n| `onblur` | The\
    \ select box loses the focus |\n| `onfocus` | The select box receives the focus\
    \ |\n| `onchange` | The select box has its value modified |\n- The way to invoke\
    \ action(s) when the user selects an option from a select box is to prepare a\
    \ JavaScript function which will be invoked using the select object’s `onchange`\
    \ handler:\n```html\n<select name=\"name\" onchange=\"functionname()\">\n```\n\
    \n## Project\n\n- Open your previous project file, and save it under the name\
    \ `chapter_35.html`.\n- Clear the head section script of JavaScript, and remove\
    \ all content from the body area of the page.\n- Create a form in the body area\
    \ of the page. Give the form an id of `jumpMenu`.\n- In the form, place a select\
    \ element. Give the select element the following values and labels eg:\n```html\n\
    <select name=\"menu\">\n<option value=\"value\">label</option>\n…\n</select>\n\
    ```\n| Value | Label |\n| :--- | :--- |\n| `[http://www.bbc.co.uk/](http://www.bbc.co.uk/)`\
    \ | The BBC |\n| `[http://www.google.com/](http://www.google.com/)` | Google |\n\
    | `[http://www.hotmail.com/](http://www.hotmail.com/)` | Hotmail |\n| `[http://www.ed.ac.uk/](http://www.ed.ac.uk/)`\
    \ | The University of Edinburgh |\n| `[http://www.apple.com/](http://www.apple.com/)`\
    \ | Apple Computer |\n| `[http://www.microsoft.com/](http://www.microsoft.com/)`\
    \ | Microsoft Corporation |\n- Finally, add an option element to the beginning\
    \ of your menu like so:\n"
