  trans: "\n\n<option value=\"\">选择一个目的地</option>\n\n** 我们现在将使用菜单的 `onchange` 事件处理程序来调用我们即将要定义的函数。该函数将命名为\
    \ `jump_to_page()`。\n* 在 `head` 区域的 `script` 元素中定义该函数。该函数应该：\n    * 创建一个对象变量，引用代表菜单的表单元素。\n\
    \    * 获取此时菜单的值。\n    * 如果值不等于 `\"\"`（即如果选择了有效选项），则该函数应使用 JavaScript 将选中的页面加载到浏览器中。\n\
    * 在浏览器中检查你的工作结果。\n\n# 36 要求表单值或选择\n\n## 关键点\n\n* 如果将表单数据在缺少某些信息的情况下发送到服务器，则该数据可能是无效的——例如，如果用户省略了从菜单中选择一个项目。与其尝试处理无效信息而浪费用户和服务器的时间，不如不去处理它更好。\n\
    * 对于选择框，验证的方法之一是为默认选项包含一个空值。在之前的项目中，选择框的默认值（除非另有说明，否则总是第一个选项）是 `\"\"`。如果用户没有主动做出其他选择，那么你可以在将其发送服务器之前检查选择框的值。\n\
    * 另一个例子是单选按钮组的情况。假设对于一家虚拟公司，订单表单包含两个表单元素——一个用于指定订购什么产品的选择框，以及两个用于指定是作为照片打印还是幻灯片订单的单选按钮。\n\
    * 假设订单表单的 `id` 为 `OrderForm`，每个单选按钮的 `name` 为 `Format`。（记住，在 HTML 中，一组单选按钮通过它们的名称相互关联，且每个相关的单选按钮的名称必须相同）。\n\
    * 单选对象是一个数组，数组中的每个元素都存储与每个单选按钮对象相关的信息（记住，计数从 `0` 开始）。\n* 由于组中每个单选按钮的名称相同，你无法通过其名称访问单独的单选按钮。但你可以使用标准的数组符号来访问它：\n\
    ```\nOrderForm.Format[i]\n```\n在这种情况下，`i` 是一个 `0` 到 `1` 之间的整数，而 `OrderForm` 是指向表单元素的对象变量。\n\
    * 一组单选按钮中的每个按钮都有一个 `checked` 属性，存储一个指定单选按钮是否被选中的布尔值。显然，你可以通过以下方式访问此值：\n```\nOrderForm.Format[i].checked\n\
    ```\n* 因此，要验证一组单选按钮中至少有一个被选中，你只需要使用数组的 `length` 属性遍历每个单选按钮，以指定循环的迭代次数：\n```\n\
    FormatSelected = false; oOrderForm = document.getElementById(\"OrderForm\");\n\
    for ( i=0; i < oOrderForm.Format.length; i++ )\n{\n    if ( oOrderForm.Format[i].checked\
    \ )\n    {\n        FormatSelected = true;\n    }\n}\n```\n* 在我们的订单表单示例中，某个产品可能仅以幻片形式提供。你可以使用\
    \ `select` 对象的 `onchange` 事件处理程序来调用函数，该函数会自动设置相关单选对象 `checked` 属性的值：\n```\nfunction\
    \ SetFormat ()\n{\n    oOrderForm = document.getElementById(\"OrderForm\");\n\
    \    if ( oOrderForm.Product.value == \"Greek Boat\" )\n    {\n        oOrderForm.Format[0].checked\
    \ = true;\n    }\n}\n```\n其中 `Product` 是选择框的名称，`Format` 是单选按钮组的名称，第一个单选按钮的值是 Slide。\n\
    * 最后，要将所有表单对象重置为初始状态，请使用 `reset()` 方法：\n```\nFormObject.reset()\n```\n\n## 项目\n\
    \n* 打开你之前的项目文件，并将其保存为 `chapter_36.html`。\n* 移除页面中 `body` 部分的所有内容。\n* 从网络复制 `order_form.html`\
    \ 文件，并使用记事本的“文件 > 打开”命令打开它。\n* 将 `order_form.html` 的全部内容复制并粘贴到你当前项目文件中，到页面的 `body`\
    \ 元素中。\n* 移除页面 `head` 部分中 `script` 元素中的所有 JavaScript 代码。\n* 花些时间在浏览器中打开你的项目文件，并研究代码。\n\
    * 在你页面上的表单元素上添加一个事件处理程序，在表单提交时调用名为 `check_form()` 的函数。该函数将根据表单是否通过下述描述的若干测试来返回\
    \ `true` 或 `false`。记住在事件处理程序的函数调用之前加上 `return`，以确保表单在继续之前等待函数的确认。\n* 在 `head`\
    \ 区域的 `script` 元素中创建 `check_form()` 函数。该函数应该执行以下步骤：\n    * 如果选择菜单当前值为 `\"\"`：\n\
    \        * 显示消息为“please select a product”的警框\n        * 给菜单焦点\n        * 返回 `false`\n\
    \    * 如果没有选中单选按钮：\n        * 显示消息为“please specify a format”的警框\n        * 返回\
    \ `false`\n    * 否则，返回 `true`\n* 在浏览器中检查你的工作结果。\n* 希腊渔船仅提供 Slide 格式。。为 `select`\
    \ 元素添加一个事件处理程序，当它的值改变时运行名为 `set_format()` 的函数。\n* 在 `head` 区域的 `script` 元素中创建\
    \ `set_format()` 函数。该函数应首先检查菜单的值。如果是 Greek Fishing Boat，它应该应该检查 Slide 单选按钮是否被选中。如果没有选中，则该函数应纠正这一点。\n\
    * 在浏览器中检查你的工作结果。\n* 修改你的 `check_form()` 函数，以检查如果菜单值为 Greek Fishing Boat，则 Slide\
    \ 单选按钮是否被选中。如果没有，它应该像以前一样报告错误。\n* 最后，请注意你的 `check_form()` 函数目前并不高效，因为它每次只报告一个错误。这对于容易出错的用户来说可能是很麻烦的，更好的做法是同时观察表单的所有错误。\n\
    * 在函数开头创建一个名为 `error` 的变量。将此变量的值设置为 `\"\"`。\n* 不要在每次发现错误时都使用警框，而是将错误消息添加到变量的末尾，例如\
    \ `error += \"error message\\n\";`（注意每个消息末尾的换行代码）。\n* 在完成所有检查后，如果我们捕到了任何错误，`error`\
    \ 的值将不再是 `\"\"`。因此，我们可以使用以下代码一次性报告所有错误：\n```\nif ( error != \"\" )\n{\n    alert(\"\
    The following errors were found: \\n\\n\" + error); \n    return false;\n}\nelse\n\
    {\n    return true;\n}\n```\n* 修改你的函数使其更高效。\n\n# 37 处理日期\n\n## 关键点\n\n* 日期对象存储了从年份到毫秒的所有日期和时间信息。\n\
    * 要使用新的日期对象，必须同时创建它并将其赋值给对象变量。以下代码创建一个新的日期对象，存储当前日期和时间并将其赋值给变量 `dtNow`：\n```\n\
    dtNow = new Date();\n```\n* 在创建日期对象时，你可以指定自己的参数：\n```\ntheDate = new Date(year,\
    \ month, day, hours, minutes, seconds, mseconds);\n```\n* 注意，月份用数字 0 到 11 表示（1\
    \ 月到 12 月）。天用 1 到 31 表示，小时用 0 到 23 表示，分钟和秒用 0 到 59 表示，毫秒用 0 到 999 表示。\n* 以下代码将\
    \ 2004 年 7 月 17 日晚上 9:15:30 存储在变量 `theDate` 中：\n```\ntheDate = new Date(2004,6,17,21,15,30,0);\n\
    ```\n* 前三个参数是强制性的，而其余的是可选的：\n```\ntheDate = new Date(2004,6,17);\n```\n将给你上述日期的午夜。\n\
    * 你可以使用以下方式使用字符串将日期赋值给变量：\n```\ntheDate = new Date(\"Sun, 10 Oct 2000 21:15:00\
    \ – 0500\");\n```\n\n"
