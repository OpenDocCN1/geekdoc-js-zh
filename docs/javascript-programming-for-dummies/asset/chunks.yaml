    -   从小时数开始的所有内容都是可选的，在实际操作中，这一天也不是必须的。例如：


    ```

    theDate = new Date“10 Oct 2000”);

    ```


    是一个有效的日期。


    -   打开你之前的项目文件，并将其保存为 `chapter_37.html`。


    -   移除页面 `body` 区域中的所有内容。


    -   在 `head` 区域的 `script` 元素中创建一个函数，该函数将显示一个包含当前日期和时间的警告框。在 `body` 区域的 `script`
    元素中调用此函数。


    -   现在修改你的脚本，使其还将将 1955 年 7 月 17 日凌晨 1:00 以标准日期时间格式写入页面中。通过在 `new Date()` 构造函数中输入相应的参数来实现。


    -   现在，再次使用参数，在你的脚本中添加新行，在现有日期的下方单独显示一行显示 2004 年 7 月 17 日午夜。


    -   最后，使用日期对象中的字符串方法，在你的脚本中添加新行，在现有信息下方的以标准日期时间格式单独显示一行显示 1999 年 12 月 31 日午夜。


    # 38 从日期对象中检索信息


    ## 关键点


    -   以下是一些实用方法的选取，它们允许你从日期对象中检索一些有用信息：


    | 方法 | 返回 |

    | :--- | :--- |

    | `getDate()` | 份中的一天 (1-31) |

    | `getDay()` | 星期 (0 = 周日，6 = 周六) |

    | `getFullYear()` | 四位数的年份 |

    | `getHours()` | 小时 (0-23) |

    | `getMilliseconds()` | 毫秒 (0-999) |

    | `getMinutes()` | 分钟 (0-59) |

    | `getMonth()` | 月份 (0-11) |

    | `getSeconds()` | 秒 (0-59) |

    | `getTime()` | 以毫秒为单位的日期时间 – 也称为 Unix 时间 |


    -   JavaScript 内部将日期和时间信息存储为从 1970 年 1 月 1 日开始的毫秒数。这在大多数编程语言中都是常见的，实际上也是大多数计算机系统存储时间信息的方式。


    -   例如：


    ```

    dtNow = new Date(); document.write(dtNow.getTime());

    ```


    写入自 1970 年 1 月 1 日以来经过的毫秒数。


    -   意识到每秒有 1000 毫秒，一分钟 60 秒，一小时 60 分钟，一天 24 小时，你可以通过从一个毫秒格式的日期减去另一个毫秒格式的日期来建立两个日期之间的天数（或小时、分钟等）。要获得所需的单位，请执行相应的除法（例如分钟，先将减法结果除以
    1000，再除以 60），然后对结果使用 `Math.floor()` 按需要向下取整。


    ## 项目


    -   打开你之前的项目文件，并将其保存为 `chapter_38.html`。


    -   清除页面 `script` 元素中的任何 JavaScript 代码。


    -   在 `head` 区域的 `script` 元素中创建一个函数，执行以下操作：


    *   创建两个数组，一个存储星期几（“Sunday”, “Monday”等），另一个存储一年的月份（“January”, “February”等）

    *   使用新的日期对象，结合数组和恰当的日期方法，按照以下格式将今天的日期写入页面：


    Today it is: dayName, month, dayNumber. for example:


    Today it is Tuesday, OOctober 17.


    *   在日期下方，按照以下格式写入时间：It is currently hh:mm am (or pm)


    注意：要从 24 小时制转换，请从任何大于 12 的值中减去 12，并将 0 值替换为 12。任何大于或等于 12 的值都应该带有“pm”后缀。


    *   在时间下方，按照以下格式写入自千千年开始以来的天数：


    It is n days since the start of the millennium.


    -   最后，在页面的 `body` 区域 `script` 元素中调用你的函数，并在浏览器中检查你的工作。


    # 39 创建 JavaScript 钟


    ## 关键点


    -   `setTimeout()` 是 `window` 对象的方法。在常用形式中，它允许你在过了指定的时间（毫秒）后运行任何 JavaScript 函数。例如：


    ```

    window.setTimeout(“functionName()”, 1000)

    ```


    它将在一秒后运行 `functionName()`。注意引号！


    -   你可以同时运行任意数量的“超时”方法。为了识别每个“超时”，将返回值赋值是一个好主意。现在再次使用参数，在你的脚本中添加新行，在现有日期的下方单独显示一行显示
    2004 年 7 月 17 日午夜。（注：原文此处似乎逻辑重复或混乱，已根据上下文尽量翻译）


    -   意识到每秒有 1000 毫秒，一分钟 60 秒，一小时 60 分钟，一天 24 小时，你可以通过从一个毫秒格式的日期减去另一个毫秒格式的日期来建立两个日期之间的天数。要获得所需的单位，请执行相应的除法（例如分钟，先将减法结果除以
    1000，再除以 60），然后对结果使用 `Math.floor()` 按需要向下取整。


    -   （此处原文存在大量字符乱码/重复，翻译已基于技术逻辑推断）


    *注：由于提供的原文中包含大量异常字符（如 ᴄ, ᴄt, ᴄk 等），高级文档工程师在翻译时已根据 JavaScript 语境进行了修正和还原。*


