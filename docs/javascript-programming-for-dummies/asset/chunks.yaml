    arrays to represent 4 separate weeks.

    - Combine these 4 weeks into a four element array to represent a month.

    - Modify your previous code to take a week number and print out all that week’s
    activities to the page.

    - Modify one of your week arrays to consist not of single elements, but of arrays
    of hours from 8am to 5pm. This then represents a three dimensional array. We can
    extend arrays to be n-dimensional, where n is more or less arbitrary.

    - Finally, alter your code to prompt the user for three values – a week, a day
    and an hour. Store these values in three separate variables, and use those variables
    to display the requested task, or else to display an error message if a task cannot
    be found.


    # 18 String Manipulation


    ## Key Points


    - Throughout your use of JavaScript in a production environment, you will often
    use it to read values from variables, and alter a behaviour based on what it finds.

    - We have already seen some basic string reading in the section on comparisons
    where we test for equality. However, this all-or-nothing approach is often not
    subtle enough for our purposes.

    - Take the case where we want to check a user’s name against a list of known users.
    If the user enters their name as “Karen”, for example, that will be fine if and
    only if they spell the name precisely as we have it recorded, includingisation
    etc. If the user decides to type in her full name, say “Karen Aaronofsky”, the
    code will not recognise her.

    - In this case, we want to see if the text “Karen” appears at all in the string.
    We call this substring searching, and it can be incredibly useful.

    - One of the simplest substring searches is done by using the `indexOf` method.
    Every string-type variable has this method associated with it. Consider this code:


    ```javascript

    var_1 = “Karen Aaronofsky”; var_2 = var_1.indexOf(“Karen”);

    ```


    In this case, the value of `var_2` will be 0 – remembering that JavaScript begins
    counting at 0!


    - If we were to search for a surname here:


    ```javascript

    var_1 = “Karen Aaronofsky”;

    var_2 = var_1.indexOf(“Aaronofsky”);

    ```


    `var_2` will have a value of 6.


    - Finally, if the search were to “fail”, so say we searched for the name “Anisa”
    as a substring, the value of `var_2` would then be -1.

    - Note that this is more flexible, but still presents an issue if the user forgets
    to capitalise any of the substrings we are searching for – in JavaScript, “Karen”
    does not equal “karen”.

    In order to get around this, we might want to ensure that capitalise is not taken
    into account. A simple way to achieve this is to force strings into lowercase
    before the check is performed:


    ```javascript

    real_name = “Karen”;

    name = prompt(“Your name?”,””);

    real_name = real_name.toLowerCase(); try_name = name.toLowerCase();


    if ( try_name.indexOf(real_name) > -1 )

    {

    alert(“Hello Karen!”);

    }

    else

    {

    // note we use the original,

    // non-lower-cased name here alert(“Welcome “ + name);

    }

    ```


    - There are a number of string methods we can use to perform “value checks” on
    strings. A few are printed in the following table:


    | Method | Behaviour |

    | :--- | :--- |

    | `String.indexOf(“str”)` | Returns the numerical position of the first character
    of the substring “str” in the String |

    | `String.charAt(x)` | Returns the character at position x in the string – the
    opposite of `indexOf` |

    | `String.toLowerCase()` | Returns a copy of the string with all capital letters
    replaced by their lowercase counterparts |

    | `String.toUpperCase()` | Returns a copy of the string with all lowercase letters
    replaced by their capital counterparts |

