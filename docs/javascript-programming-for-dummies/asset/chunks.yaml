- fmt: "\n* Display the formatted time in the text field on the page.\n* Create a\
    \ timeout which will run the `start_clock()` function again in half a second,\
    \ and assign that timeout’s return object to the `timer` object variable.\n* Set\
    \ the `timer_running` variable to `true`.\n* Add statements to the `stop_clock()`\
    \ function that will:\n    * Check to see if the clock is running.\n    * If it\
    \ is, clear the timer timeout and set `timer_running` to `false`.\n* Finally,\
    \ add event handlers to the two form buttons to ensure that the one labelled Stop\
    \ calls the function `stop_clock()` when clicked, and the one labelled Start calls\
    \ the function `start_clock()` when clicked.\n* While this should work (test your\
    \ code!), you’ll notice that the output is a little ugly. Displaying the time\
    \ in a text field is not the most unobtrusive way to show a clock on a page.\n\
    * Luckily, we can modify our code very slightly to achieve something much more\
    \ professional.\n* Replace your input field with the following:\n\n```html\n<span\
    \ id=\"clockBox\"></span>\n```\n* `<span>` is an HTML tag that allows you to mark\
    \ areas of content without any semantic meaning – eg, the clock is not a paragraph\
    \ or a header, so we don’t want to label it as such.\n* With JavaScript, we can\
    \ control the content of just about any element on the page. In our previous example,\
    \ we used `getElementById` (hopefully!) to obtain a reference to the input field,\
    \ and then altered its `value` property to show our clock.\n* Since we are using\
    \ the same id value here, we do not have to alter our function too much. However,\
    \ the `getElementById` method now returns a different type of object – one that\
    \ has no `value` property.\n* However, all content tags in HTML (like `<p>`, `<h1>`,\
    \ `<div>` etc) have a special property when they are returned as JavaScript objects\
    \ which refers to their text content – the property is `innerHTML`.\n* We can\
    \ use this to alter the content of the tags. For example, if our previous input-field\
    \ solution had the following code:\n\n```javascript\nclk = document.getElementById(\"\
    clockBox\"); clk.value = formatted_time;\n```\n\nwhere `formatted_time` is a variable\
    \ containing the formatted time as required, then replacing it with this code:\n\
    \n```javascript\nclk = document.getElementById(\"clockBox\"); clk.innerHTML =\
    \ formatted_time;\n```\n\nwill allow us to use the modified `<span>` element in\
    \ place of the `<input>` element.\n* Try adapting your code to use this method\
    \ of displaying content on the page.\n"
