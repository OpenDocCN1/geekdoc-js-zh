    - 如果你想向某人下指令执行某个重复性动作，你可能会说想让他们继续执行该动作达到指定的次数。例如，如果某人要执行一个动作 300 次，他们可能会采取以下操作来确保计数准确：

    - 在小纸条上写下数字 1。

    - 每次执行动作后，擦掉纸条上的数字并将其加 1。

    - 在每次执行动作前，检查纸条上的数字。如果数字小于或等于 300，则执行该动作。

    - 或者，他们可能决定从 0 开始计数。在这种情况下，步骤是相同的，但每次执行动作前的检查将是确保数字严格小于 300。

    - 在 JavaScript 中，我们说的是几乎相同的话。以下代码将在页面上显示数字 1 到 100：


    ```javascript

    for( i = 1; i <= 100; i++ )

    {

    document.write(“<p>” + i “ </p”);

    }

    ```

    - `for` 语句告诉浏览器我们将执行一个循环。这里的布局与条件语句非常相似，但在这种情况下，我们在括号中拥有更多信息。我们的条件语句只有一个 JavaScript
    语句来描述其动作，而 for 循环有三个：

    - 初始化器（initializer）——它设置了初始计数条件，在本情况下为 `i = 1`。

    - 条件（conditional）——这与我们之前的条件语句相同，并且必须返回真或假。如果返回真，则循环继续，否则退出。

    - 递增器（incrementer）——这定义了在每次循环结束时执行的动作。在本情况下，`i` 增加了一个值 1。

    - 条件和 for 循环之间的关键区别在于，条件在不断地被改变和重新评估。通过让条件不依赖于计数值可以创建一个无限循环——例如：


    ```javascript

    for( i=0; 5 > 4; i++ )

    ```

    这将始终执行大括号中的脚本，并可能导致浏览器报错。

    - 同样注意，在 JavaScript 中，从零开始计数是非常常见的。其原因是我们通常希望计算某个操作执行了多少次。考虑以下：


    ```javascript

    for( i=1; 1 < 2; i++ )

    ```

    - 在这种情况下，循环将运行一次，但 `i` 的值将是 2，因为在第一次运行之后，`i` 将增加到 2，然后测试失败，因此循环退出。如果我们使用以下代码：


    ## Project


    ```javascript

    for( i=0; 1 < 1; i++ )

    ```

    那么循环将运行一次，之后 `i` 的值将是 1，正如我们所希望的那样。


