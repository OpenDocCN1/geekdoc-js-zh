    \ This means that simply just marking up a normal form tag and associated \n\n\
    controls will give your form the default Bootstrap look and feel. \n\nTake the\
    \ following example: \n\n*Code Sample 18: Basic BS3 Form Example with no Classes\
    \ *\n\nIf we render this example in a browser, we'll see that we get a reasonably\
    \ good output without \n\nadding any extra classes, as you can see in the following\
    \ image: \n\n \n\nOutput generated by code sample 18 \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_33_0.png)\n\
    \n`<form> `\n\n` <div> `\n\n` <label for=\"exampleInputEmail1\">Email address</label>\
    \ `\n\n` <input type=\"email\" id=\"exampleInputEmail1\" placeholder=\"Enter email\"\
    > `\n\n` </div> `\n\n` <div> `\n\n` <label for=\"exampleInputPassword1\">Password</label>\
    \ `\n\n` <input type=\"password\" id=\"exampleInputPassword1\" placeholder=\"\
    Password\"> `\n\n` </div> `\n\n` <div> `\n\n` <label for=\"exampleInputFile\"\
    >File input</label> `\n\n` <input type=\"file\" id=\"exampleInputFile\"> `\n\n\
    ` <p>Example block-level help text here.</p> `\n\n` </div> `\n\n` <div> `\n\n\
    ` <label> `\n\n` <input type=\"checkbox\"> Check me out `\n\n` </label> `\n\n\
    ` </div> `\n\n` <button type=\"submit\">Submit</button> `\n\n`</form> `\n\n` `"
