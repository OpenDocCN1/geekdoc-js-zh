  md: " \n\n \n\n \n\n \n\n27 \n\n**Chapter 3 Changed CSS Features **\n\nSo far you've\
    \ already seen a number of the new CSS features that are available in version\
    \ 3 of \n\nBootstrap. In this chapter we'll go into a little more detail about\
    \ just what is considered new and \n\nwhat's not. \n\nIn many cases these new\
    \ classes are just renames of the old ones, but we treat them as new \n\nhere\
    \ so that you can easily make the distinction. \n\n**Typography Changes **\n\n\
    The various classes that make up BS3's typography section haven't changed as much\
    \ as some \n\nof the other elements. Tags `**H1**` through `**H6**` are still\
    \ treated the same way as they were in v2, \n\nwith the addition that you can\
    \ now use `**<small>**` in line with any header element without it first \n\n\
    having to be wrapped in a `**div**` using the `**page-header**` class. This means\
    \ no extra markup now, \n\nunless you want your block heading to be underlined\
    \ with a different paragraph margin. \n\n*Code Sample 10: BS V2 Page Header *\n\
    \nIn v2 you had no choice but to wrap your `**H1**` in a page-header div, as this\
    \ was the only way the \n\nsmall tags output would be neatly lined up. This has\
    \ now been rectified and also applied to all \n\nlevels of header, rather than\
    \ just the first three. \n\n*Code Sample 11: BS V3 Page Header *\n\nContinuing\
    \ on, the standard body copy class has no changes, and remains at a default size\
    \ of \n\n14 pixels with a line height of about 1.4. \n\nBody copy is applied to\
    \ all text inside a paragraph tag automatically, so no classes are needed \n\n\
    unless you want to use some of the special features (as we'll see soon). \n\n\
    Lead body copy (paragraphs with the class name of `**lead**`) also have no changes\
    \ to their names \n\nor styling, and as with v2, are designed to give your opening\
    \ paragraph a bit more emphasis \n\nthan the other regular body copy. Combining\
    \ these three CSS rules, you might have something \n\nlike the following: \n\n\
    `<div class=\"page-header\"> `\n\n` <h1>This is my super web page <small>It's\
    \ the best there is</small></h1> `\n\n`</div> `\n\n` `\n\n`<h1>This is my super\
    \ web page <small>it's the best there is</small></h1> `\n\n` `"
  merge: -1
  pgno: 26
