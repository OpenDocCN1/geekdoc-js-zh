  md: " \n\n \n\n \n\n \n\n45 \n\nWhen rendered in the browser, this code sample should\
    \ give you the following output: \n\n \n\n*Figure 16: The output produced by code\
    \ sample 26 *\n\nWhen you add the class `**btn-block**` to a button or anchor\
    \ element styled using any of the \n\nprevious button classes, that button will\
    \ stretch to fill 100 percent of the available space. This is \n\nuseful when\
    \ producing dialog boxes and sizing controls with BS3 grid system, as it allows\
    \ you to \n\nspecifically size buttons (and other elements) to maintain a good\
    \ balance in your form designs. \n\nIn most cases, you won't need to set a button’s\
    \ active state yourself, but if you do, you can \n\neasily add the `**active**`\
    \ class to any element marked up using the button classes. `**Active**` in \n\n\
    general (on the `**<button>**` element at least) usually uses the `**:active**`\
    \ pseudo-selector to \n\nchange the button’s style. Adding the `**active**` class,\
    \ however, will force the button to display its \n\nactive state. \n\n \n\n***Note:\
    \ If you‘re thinking of using the ***`***active***`*** state to create sticky\
    \ buttons, be aware that in ***\n\n***the following chapters, we will be discussing\
    \ button states using the component and ***\n\n***JavaScript facilities available.\
    \ BS3 provides just such a sticky button using the additional ***\n\n***features\
    \ available in these facilities, so you won’t need to****** create your own sticky\
    \ buttons ***\n\n***using ***`***active***`*** in most circumstances. ***\n\n\
    You can also disable your buttons and mark them as inactive using the same “disabled”\
    \ classes \n\nand attributes that we discussed previously with the changes in\
    \ form elements. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_44_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_44_1.png)\n\
    \n` <button type=\"button\" class=\"btn btn-link btn-sm\">Small link button</button>\
    \ `\n\n` <button type=\"button\" class=\"btn btn-link btn-xs\">Extra small link\
    \ button</button> `\n\n`</p> `\n\n` `"
