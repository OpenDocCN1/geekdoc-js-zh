  md: " \n\n \n\n \n\n \n\n79 \n\n \n\n*Figure 55: Output produced by code sample\
    \ 52 *\n\nOne nice feature the badge component does still have, however, is its\
    \ use of the `**empty:**` \n\npseudo-selector, allowing it to automatically vanish\
    \ from display if its inner text is empty. This \n\nhelps with the internal changes\
    \ designed to work on List groups and Pill lists, because it now \n\nmeans that\
    \ it's immensely easy to create things like inbox notification lists, where the\
    \ values \n\ndisappear when the `**<span>**` contents are removed. Here’s an example:\
    \ \n\n*Code Sample 53: BS3 List Styling for Badges *\n\n \n\n*Figure 56: Output\
    \ produced by code sample 53 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_78_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_78_1.png)\n\
    \n`<span class=\"badge alert-info\">Info</span> `\n\n`<span class=\"badge alert-warning\"\
    >Warning</span> `\n\n`<span class=\"badge alert-danger\">Danger</span>`` `\n\n\
    `<div class=\"col-md-4\"> `\n\n` <ul class=\"nav nav-pills nav-stacked\"> `\n\n\
    ` <li class=\"active\"> `\n\n` <a href=\"#\"> `\n\n` <span class=\"badge pull-right\"\
    >42</span> `\n\n` Inbox `\n\n` </a> `\n\n` </li> `\n\n` <li class=\"active\">\
    \ `\n\n` <a href=\"#\"> `\n\n` <span class=\"badge pull-right\">10000</span> `\n\
    \n` Spam `\n\n` </a> `\n\n` </li> `\n\n` <li class=\"active\"> `\n\n` <a href=\"\
    #\"> `\n\n` <span class=\"badge pull-right\"></span> `\n\n` Lottery Wins `\n\n\
    ` </a> `\n\n` </li> `\n\n` </ul> `\n\n`</div> `\n\n` `"
