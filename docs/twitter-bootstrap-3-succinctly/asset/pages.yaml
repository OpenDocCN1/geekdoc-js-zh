  md: " \n\n \n\n \n\n36 \n\nExternally, if you render this code, you'll see no difference\
    \ to the output generated for sample \n\n18\\. Internally, however, Bootstrap\
    \ can now find and work with individual elements much more \n\neasily than it\
    \ could previously. \n\nIn BS2 there was no requirement to group controls unless\
    \ you wanted to work with the \n\nautomatic validation classes. There’s still\
    \ no absolute requirement to use them, but doing so \n\nallows BS to resize and\
    \ reposition things correctly when using its grid (among many other \n\nthings).\
    \ You'll also note that each control now has just a single `**form-control**`\
    \ class assigned to \n\nit, rather than many different ones targeting different\
    \ aspects. \n\nAlso note that the form tag itself now has a `**role**` assigned\
    \ to it. This, apart from being good \n\npractice all around, is now enforced\
    \ by BS3 to help with aria roles and standards guiding the \n\nuse of web apps\
    \ by people with disabilities. \n\nLastly, if you look at the `**<p>**` tag with\
    \ a `**help-block**`, you'll notice that that is also now used for \n\ninline\
    \ form text in all cases, whereas in BS2 we had a number of different classes,\
    \ such as \n\n`**form-info**`. \n\nUnfortunately there is still one area in the\
    \ support for forms that's missing—the file upload \n\ncontrol. Like BS2, this\
    \ is due to the fact that security in all the current crop of browsers restricts\
    \ \n\nthe ability to style file input controls to match the rest of the input\
    \ controls available. \n\nAs I mentioned in the previous book, however, there\
    \ are still third-party additions out there that \n\nhave this area covered, and\
    \ because you can now manufacture your own upload system using \n\nthe HTML5 classes,\
    \ strictly speaking you don't need the file upload control—you can \n\nmanufacture\
    \ your own. \n\nIn BS2 there were a number of specific form types such as the\
    \ `**search-form**`; under BS3 all of \n\nthese have been rolled up into three\
    \ main types of form. First, you have the standard form; as \n\nwe've seen, this\
    \ is a normal form with no extra classes added to the form tag. The two other\
    \ \n\nform types are `**form-inline**` and `**form-horizontal**`. \n\nThe `**form-inline**`\
    \ class is designed for forms in small, limited height places such as menu and\
    \ \n\nnavigation bars. A word of warning though: all input elements in this class\
    \ and the other form \n\ntypes are sized 100 percent by default, so if you need\
    \ the form to only take up a small amount \n\nof room (particularly in `**nav\
    \ bar**` forms), you will need to put manual sizes on the individual \n\ncontrols.\
    \ \n\nIn the example from code sample 19, adding `**form-inline**` or `**form-horizontal**`\
    \ in turn should \n\nchange your basic form layout to look like the following:\
    \ \n\n \n\n*Figure 8: Form produced by code sample 19 with the *`***form-inline***`*\
    \ class added to the form tag. *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_35_0.png)"
