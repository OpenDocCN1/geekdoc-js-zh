  md: " \n\n \n\n \n\n \n\n49 \n\nJust like the `**caret**`, this was present in BS2,\
    \ but was not available to use separate from its \n\nintended use in modal dialogs\
    \ and alert bars. However, from BS3 onwards, you can use it just \n\nfine on its\
    \ own. \n\nThe following code sample shows an example of both the `**caret **`class\
    \ and close cross in \n\ngeneric mark-up: \n\n*Code Sample 29: Using the BS3 Caret\
    \ and Close Cross Helpers *\n\n \n\n*Figure 19: Output from code sample 29 *\n\
    \nJust as in BS2, the quick float utility classes `**pull-left**` and `**pull-right**`\
    \ still exist, but they are \n\nnow joined by `**center-block**`, which simply\
    \ makes both margins automatic and centers the \n\nelement in its parent, and\
    \ `**clearfix**`, which clears out any floats that you may be using, thus \n\n\
    restoring normal document flow. \n\nOther new classes include the `**show**`,\
    \ `**hidden**`, and `**invisible**` classes. `**Show**` pretty much speaks \n\n\
    for itself, but what's the difference between the latter two? `**Hidden**` physically\
    \ collapses the \n\nspace used by the element, so if you have it in a full height\
    \ div for example, that div will collapse \n\ndown to its smallest height. However\
    \ if you use `**invisible**`, the element retains its space (and \n\nalso still\
    \ occupies its place in the element flow), but it vanishes from view. \n\nWe've\
    \ already seen that a new class called `**sr-only**` has been introduced to mark\
    \ a block as \n\nbeing visible to screen readers and nothing else. There is now\
    \ another class like this that is \n\nused for graphical headings. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_48_0.png)\n\
    \n`<div class=\"bg-primary\" style=\"width: 200px; height: 200px; padding: 4px;\"\
    > `\n\n` <button type=\"button\" class=\"close\" aria-hidden=\"true\">&times;</button>\
    \ `\n\n` <p>This text appears in a div that has its own close icon attached to\
    \ it.</p> `\n\n` <div class=\"bg-success text-primary\"><div class=\"caret\" /></div>\
    \ `\n\n`</div> `\n\n` `"
  merge: -1
