  md: " \n\n \n\n \n\n \n\n77 \n\n \n\n*Figure 50: Navigation bar with information\
    \ display produced by code sample 49 *\n\nThe navigation bar itself also has a\
    \ few clever tricks, you can place your navigation bar inside a \n\n`**container**`\
    \ or other alignment class, then add `**navbar-fixed-top**` to it, your navigation\
    \ bar will \n\nstick to the top of its container, and align itself perfectly with\
    \ it as in the following image: \n\n \n\n*Figure 51: Navigation bar from sample\
    \ 49 with the *`***navbar-fixed-top***`* class applied to it *\n\nYou can also\
    \ add `**navbar-fixed-bottom**` class, which will stick your navigation bar to\
    \ the \n\nbottom of the page, and the `**navbar-static-top**` class, which will\
    \ stick the bar to the top of the \n\ncontainer, but will allow it to scroll with\
    \ the page content. \n\nFinally, if you want a darkened navigation bar, then you\
    \ can use the `**navbar-inverse**` class, \n\nwhich will invert the color set\
    \ used by the entire component: \n\n \n\n*Figure 52: Navbar from sample 49 with\
    \ the*`*** inverse***`* class set *\n\n**Label and Badge Changes **\n\nThis is\
    \ going to be a very short section, because there have only been two changes to\
    \ the \n\nlabels, and one big one to the badges. \n\nTo make a label in BS2, we\
    \ simply gave it a `**label-xxxx **`class name, where `**xxxx**` represents \n\
    \nthe state the label was to portray. Under BS3, we now have a two-part class\
    \ definition, and a \n\nrename from `**error**` to `**danger**` for the red color\
    \ class, so that the naming now matches \n\neverything else, and that's pretty\
    \ much it. \n\nThere are also no sizing classes/options for these in BS3, as labels\
    \ take on the size of the \n\nsurrounding container. So, if you create a `**<span>**`\
    \ with an appropriate label class, and then wrap \n\nit in a `**<H1>**`, the size\
    \ of that label will be much larger than the rest. \n\nThe following code sample\
    \ demonstrates this: \n\n*Code Sample 50: BS3 Label Example with Different Sizes\
    \ *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_76_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_76_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_76_2.png)\n\
    \n` </div> `\n\n` </div> `\n\n` </div> `\n\n`</nav> `\n\n` `\n\n`<h1><span class=\"\
    label label-default\">Default</span></h1> `"
