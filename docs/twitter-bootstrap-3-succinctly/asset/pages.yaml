  md: " \n\n \n\n \n\n46 \n\nThe following code shows buttons marked up to look active\
    \ and in the disabled states: \n\n*Code Sample 27: BS3 Active and Disabled Buttons\
    \ *\n\n \n\n*Figure 17: Output produced by code sample 27 *\n\nBe aware, however,\
    \ that in the case of anchor buttons, the `**disabled**` element/class does NOT\
    \ \n\ndisable the link; to make sure that a disabled state anchor link does not\
    \ fire, you will need to use \n\ncustom JavaScript. \n\nFor this reason, the BS3\
    \ team recommends that you use the `**<button>**` element where possible \n\n\
    to mark buttons, and only use anchor tags in specific circumstances. \n\nLet’s\
    \ also not forget the subject of “idempotence” and the importance of using buttons\
    \ over \n\nanchors. In general, an anchor link is appropriate if the destination\
    \ is a get request and making \n\nthe link several times will not cause any issues\
    \ by repeat activation; otherwise, use a button. \n\n**Image Changes **\n\nCSS\
    \ changes, where the humble image tag is concerned, have not been as far-reaching\
    \ as in \n\nother places in BS3. Previously, images were not responsive by default,\
    \ and as with many \n\nthings in BS2, you had to add the optional responsive classes\
    \ to get anywhere near being \n\nresponsive with them. \n\nUnfortunately, even\
    \ after you added the optional responsive classes, things still were not \n\n\
    perfect; many people cited problems with pages where Google Maps were used, among\
    \ other \n\nthings. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_45_0.png)\n\n\
    `<p> `\n\n` <button type=\"button\" class=\"btn btn-primary active\">Active primary\
    \ button</button> `\n\n` <button type=\"button\" class=\"btn btn-default active\"\
    >Active default button</button> `\n\n`</p> `\n\n`<p> `\n\n` <button type=\"button\"\
    \ class=\"btn btn-primary\" disabled=\"disabled\">Disabled primary `\n\n`button</button>\
    \ `\n\n` <button type=\"button\" class=\"btn btn-default\" disabled=\"disabled\"\
    >Disabled default `\n\n`button</button> `\n\n`</p> `\n\n` `"
  merge: -1
  pgno: 45
- img_proc: true
  md: " \n\n \n\n \n\n \n\n47 \n\nBS3 changes all of this. Now, by default, images\
    \ are fully responsive with the use of an `**<img>**` \n\ntag. To extend and make\
    \ that responsiveness even better and more fluid, you can add the `**img-**`\n\
    \n`**responsive**` to any `**<img>**` tag to ensure that even while scaling correctly,\
    \ the height and width \n\nof the image also stay in proportion to each other.\
    \ \n\nOther than that, the only other change made to the images section is the\
    \ name of the `**img-**`\n\n`**polaroid**` class (used for generating thumbnails)\
    \ to `**img-thumbnail**`, so that it falls in line with \n\nother similar renaming\
    \ throughout the library. \n\nThe BS2 classes `**img-rounded**` and `**img-circle**`\
    \ still work as they did previously, giving a \n\ncircular and rounded-rectangle\
    \ thumbnail effect. \n\n**Helper and Visibility Changes **\n\nFinally, we come\
    \ to the changes that cover those things that don't really fit into any specific\
    \ \n\ncategories. \n\nUnder the typography classes in BS2, you were originally\
    \ introduced to a set of color classes \n\nused for setting the color of a text\
    \ element to the same branding colors used in other elements \n\nin the framework.\
    \ \n\nBS3 takes this one step further and introduces the concept of having the\
    \ same colors used for \n\ncontextual backgrounds too. \n\nIn this case, the backgrounds\
    \ are a lighter variation, as used in panels and alert boxes \n\nelsewhere. There's\
    \ an added bonus: if you use these contextual color classes on anchor tags \n\n\
    and anything else that has a hover-over set by default, the colors will automatically\
    \ dim slightly \n\nto show they've been hovered over. \n\nAs with the naming in\
    \ other color-based classes, the classes available here are `**text-muted**`,\
    \ \n\n`**text-primary**`, `**text-success**`, `**text-info**`, `**text-warning**`,\
    \ and `**text-danger**` for paragraph, \n\nspan, and other inline or block-based\
    \ text elements. \n\nFor background colors, the class names are `**bg-primary**`,\
    \ `**bg-success**`, `**bg-info**`, `**bg-warning**`, \n\nand `**bg-danger**`.\
    \ \n\nThe following code shows an example of using them: \n\n*Code Sample 28:\
    \ BS3 Contextual Color Classes *\n\n`<p class=\"text-muted\">This paragraph is\
    \ using the muted text class, <strong>typically `\n\n`reserved for something not\
    \ really important or less prominent.</strong></p> `\n\n`<p class=\"text-primary\"\
    >This paragraph is using the primary text class, `\n\n`<strong>typically reserved\
    \ for something important or default and `\n\n`visible.</strong></p> `\n\n`<p\
    \ class=\"text-success\">This paragraph is using the success text class, `\n\n\
    `<strong>typically reserved for an action that just succeeded or something good\
    \ and `\n\n`congratulatory.</strong></p> `"
