  md: " \n\n \n\n \n\n92 \n\n \n\n*Figure 69: Output produced by code sample 66 *\n\
    \nIf you remove the `**<div>**` containing the panel body from your markup, the\
    \ whole thing will \n\ncollapse down, leaving just the panel header and border,\
    \ and leading straight into the table— \n\ngreat for just providing tables with\
    \ headers, if that’s what you need. \n\nAdding a list group into your panel is\
    \ also just as easy, and performed in exactly the same way. \n\nI'll leave that\
    \ as an exercise to the reader to play with, however. \n\n**Other changes **\n\
    \nBefore we finally leave the chapter on components behind, there are a few more\
    \ things to cover: \n\nthe jumbotron, alert boxes, progress bars, and wells. \n\
    \nThe jumbotron is not a new element, but its use in BS2 was slightly more messy\
    \ than it now is in \n\nBS3. Creating a jumbotron is very simple; you simply use\
    \ a `**<div>**` with the class `**jumbotron**` \n\napplied, and then add some\
    \ optional markup inside. What markup you use is entirely up to you, \n\nbut to\
    \ get the intended effect, the recommended markup is: \n\n*Code Sample 67: BS3\
    \ Jumbotron Example *\n\n \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_91_0.png)\n\
    \n`<div class=\"jumbotron\"> `\n\n` <h1>Bootstrap 3</h1> `\n\n` <p>Don't you just\
    \ love this framework? It's elegant, simple to use, and frees you `\n\n`from so\
    \ much boilerplate code.</p> `\n\n` <p><a class=\"btn btn-primary btn-lg\" role=\"\
    button\">Heck yes I do</a></p> `\n\n`</div> `\n\n` `"
  merge: -1
