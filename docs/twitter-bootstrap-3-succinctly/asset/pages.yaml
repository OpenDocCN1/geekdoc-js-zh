  md: " \n\n \n\n \n\n50 \n\nIf you define a page title using an image banner, a typical\
    \ screen reader will be unable to tell \n\nwhat the text in the image says. For\
    \ a long time, many authors have used a hack called image \n\nreplacement to get\
    \ around this. Image replacement works by wrapping the image banner in an \n\n\
    `**H1**` or some other standard-type tag, putting the name in it as clear text\
    \ alongside the image \n\nbanner, then using CSS to move the text off screen.\
    \ \n\nWhat then happens is that display-wise, the image banner is seen by those\
    \ with good sight, but \n\nthose using a screen reader hear the reader say the\
    \ actual text in the image banner. \n\nBS3 now provides a class called `**text-hide**`\
    \ in order to facilitate this. A simple example follows: \n\n*Code Sample 30:\
    \ Using the BS Text-Hide Class to Make Screen Reader Friendly Headers *\n\n \n\
    \n*Figure 20: Output generated by code sample 30 in a regular PC browser *\n\n\
    Finally, we come to the last of the last in the CSS changes section. \n\nWhat\
    \ good would a responsive web design framework be without utility classes to help\
    \ you \n\nmanage your responsive layouts? \n\n\"But hold on, we've covered that\
    \ with grids,\" I hear you say, and yes, we have. But BS3 has one \n\nmore trick\
    \ up its sleeve, which in all fairness WAS present in BS2 but, didn't really work\
    \ all that \n\nwell. \n\nSo what's this extra magic? Let me introduce you to the\
    \ responsive visibility classes. \n\nEssentially, what these little gems do is\
    \ allow you to swap and change parts of your UI \n\ndepending on your grid and\
    \ display size. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_49_0.png)\n\n`<header>\
    \ `\n\n` <img src=\"title.png\" /> `\n\n` <h1 class=\"text-hide\">A graphical\
    \ image based title</h1> `\n\n`</header> `\n\n` `"
  merge: -1
  pgno: 49
- img_proc: true
  md: " \n\n \n\n \n\n \n\n51 \n\nLet's imagine, for example, that you have a list\
    \ of email inbox items, and when it’s viewed on a \n\ndesktop PC, each item has\
    \ a preview next to it, much like in a classic email reading application. \n\n\
    Something perhaps like the following: \n\nEmail 1 (1/1/11) \n\nEmail 2 : Received\
    \ (1/1/11) \n\nTo : A person \n\n \n\nDear A Person, \n\nBlah blah blah blah blah\
    \ blah blah \n\n \n\nEmail 2 (1/1/11) \n\nEmail 3 (1/1/11) \n\nEmail 4 (1/1/11)\
    \ \n\nEmail 5 (1/1/11) \n\nEmail 6 (1/1/11) \n\n*Figure 21: Email application\
    \ layout example *\n\nNow this is great until you try to fit it on a mobile device,\
    \ where you absolutely want to hide the \n\npreview pane and leave just the email\
    \ list. Normally a task like this is performed using a little bit \n\nof JavaScript\
    \ to change the visibility of the element by changing the element’s visible settings.\
    \ \n\nBS3 has a built-in solution using CSS classes that helps you handle situations\
    \ like this with \n\ngreat ease. Take the following bit of code: \n\n*Code Sample\
    \ 31: Email Application Mockup *\n\n`<div class=\"col-md-12\" style=\"border:\
    \ 1px solid black\"> `\n\n` <div class=\"col-md-3\"> `\n\n` <table class=\"table\"\
    > `\n\n` <tr> `\n\n` <td>Email 1 (1/1/11)</td> `\n\n` </tr> `\n\n` <tr> `\n\n\
    ` <td class=\"info\">Email 2 (1/1/11)</td> `\n\n` </tr> `\n\n` <tr> `\n\n` <td>Email\
    \ 3 (1/1/11)</td> `\n\n` </tr> `\n\n` <tr> `\n\n` <td>Email 4 (1/1/11)</td> `\n\
    \n` </tr> `\n\n` <tr> `\n\n` <td>Email 5 (1/1/11)</td> `\n\n` </tr> `"
