  md: " \n\n \n\n \n\n40 \n\nWhen rendered in the browser, this produces a regular\
    \ form layout, with the static control clearly \n\nmarked as not being editable\
    \ or looking like an input control, as the following image shows: \n\n \n\n*Figure\
    \ 11: The form with a static field produced by code sample 22 *\n\nThe disabled\
    \ style of form controls is still marked up and used in the same way as in BS2,\
    \ \n\nsimply by adding the “disabled” attribute to the input element as the following\
    \ shows: \n\nThis will produce the classic disabled and shaded control look, something\
    \ like the following: \n\n \n\n*Figure 12: Classic disabled control look in both\
    \ BS2 and BS3 *\n\nIf you add the `**disabled**` attribute to a field-set surrounding\
    \ a form, all of the controls in that \n\ngroup will be disabled at the same time,\
    \ using the same styling. This is something that didn't \n\nhappen in BS2—you\
    \ instead had to mark up each individual control. \n\nThe final thing I want to\
    \ mention while on the subject of forms is the validation and focus \n\nclasses.\
    \ As I previously noted, adding the correct input types in HTML5 elements really\
    \ helps \n\nyou when it comes to using the validation classes. Why is that? \n\
    \nIn addition to having dedicated class names and styles for you to use, the validation\
    \ classes \n\nalso hook the new HTML5 pseudo-elements such as `**focus:**`, `**error:**`,\
    \ and others. \n\nThis means that if you mark a text box as `**type=\"email\"\
    **`, and then don't put an email address \n\ninto it when submitting, the browser\
    \ should automatically highlight the field red for you. \n\nIf it does not, or\
    \ you have some other way of making your validation work, then you can simply\
    \ \n\nuse the `**has-success**`, `**has-warning**`, and `**has-error**` classes\
    \ on your form groups as the \n\nfollowing code shows: \n\n*Code Sample 23: Marking\
    \ Up a Form in BS3 to Use the Validation Classes *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_39_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_39_1.png)\n\
    \n` </div> `\n\n` </div> `\n\n`</form> `\n\n` `\n\n`<input class=\"form-control\"\
    \ id=\"disabledInput\" type=\"text\" placeholder=\"Disabled input here...\" disabled>\
    \ `\n\n` `\n\n`<form role=\"form\"> `\n\n` <div class=\"form-group has-success\"\
    > `"
