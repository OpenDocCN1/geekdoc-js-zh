  md: " \n\n \n\n \n\n \n\n71 \n\nYou'll see that in many wiki- or blog-style sites,\
    \ there is usually an Older/Newer, or \n\nPrevious/Next button pair at the foot\
    \ of a page. \n\nTo make the default version of this, simply create a `**<ul>**`\
    \ as we have throughout this entire \n\nsection, and add a class of `**pager**`\
    \ to it like so: \n\n*Code Sample 44: Simple BS3 Pager *\n\n \n\n*Figure 43: Output\
    \ from code sample 44 *\n\nA pager will automatically place its buttons in the\
    \ center of the available space, as seen in \n\nFigure 44, but you can also justify\
    \ them left and right by adding the `**previous**` and `**next**` classes \n\n\
    to the inner `**<li>**` elements. \n\nIf you change code sample 44 so that the\
    \ `**<li>**` holding the previous button has a class of \n\n`**previous**` assigned,\
    \ and the `**<li> **`holding the next button has a class of `**next**`, and then\
    \ re-\n\nrender the output, you should see your browser change to the following:\
    \ \n\n \n\n*Figure 44: Code sample 44 with optional *`***previous***`* and *`***next***`*\
    \ classes applied *\n\nYou'll see that, again, the output expands responsively\
    \ to fill all of the available space, and as \n\nbefore, you can easily control\
    \ this using grids, spans, and other containers as needed. \n\n**Navbar Navigation\
    \ **\n\nIf there's one thing that BS3 does way better than any of the other frameworks\
    \ I've seen out \n\nthere, it's navigation bars. Whether it's a drop-down menu,\
    \ a title with sign-in/out controls, or just \n\na decoration, there's no denying\
    \ that navigation bars in Bootstrap are powerful. \n\nUnfortunately, in BS2 there\
    \ was quite a bit lacking. There were many hacks published to allow \n\nthings\
    \ to be lined up, but some of the CSS used was a little rough around the edges.\
    \ BS3 \n\nchanges all of this. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_70_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_70_1.png)\n\
    \n`<ul class=\"pager\"> `\n\n` <li><a href=\"#\">Previous</a></li> `\n\n` <li><a\
    \ href=\"#\">Next</a></li> `\n\n`</ul> `\n\n` `"
  merge: -1
  pgno: 70
- img_proc: true
  md: " \n\n \n\n \n\n72 \n\nThe basic navigation bar now starts its life as a collapsed\
    \ item in your pages display. This \n\nmeans that if the first display is on a\
    \ mobile device, your design will start out with a nicely \n\ncollapsed menu bar,\
    \ ready to be expanded exactly as a mobile user would expect. In BS2, the \n\n\
    opposite was the case, and you had to take extra steps to collapse the display\
    \ before making it \n\nvisible. \n\nThe navigation bar will progressively become\
    \ visible as the display width increases, until the \n\nentire unit in full has\
    \ enough space to render horizontally across the page. \n\nBe careful though—even\
    \ with a non-fluid column width of 1024px, and a fluid width of your \n\nentire\
    \ display, it’s still possible to run out of space. When this happens, you could\
    \ end up with \n\nsome major content-overflow scenarios. For example, it's not\
    \ difficult to push your navigation \n\nbar two or more rows in height. \n\nThe\
    \ recommended way to ensure this doesn't happen is to use custom styling to control\
    \ the \n\nwidth of your elements, and/or to use the responsive visibility classes\
    \ to control what is and is \n\nnot shown for different screen sizes. \n\nIf you’re\
    \ using Less, you can now also customize the `**@grid-float-breakpoint**` variable\
    \ to \n\ncontrol the trigger point where your navigation bar collapses, or you\
    \ can just customize the \n\nappropriate media queries in the base CSS. \n\nNavigation\
    \ bars require JavaScript to be enabled to work correctly; if it's not enabled,\
    \ the bar \n\nshould still display, but the collapsing won’t work correctly. You\
    \ also need to ensure that if \n\nyou've done a custom build, you've also included\
    \ the collapse JavaScript plug-in. \n\nThe following code sample shows how to\
    \ create a basic empty, collapsible navigation bar: \n\n*Code Sample 45: Simple\
    \ Empty BS3 Collapsible Navigation Bar *\n\n \n\n*Figure 45: Blank nav bar produced\
    \ by code sample 45 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_71_0.png)\n\n\
    `<nav class=\"navbar navbar-default\" role=\"navigation\"> `\n\n` <div class=\"\
    container-fluid\"> `\n\n` <div class=\"navbar-header\"> `\n\n` <button type=\"\
    button\" class=\"navbar-toggle\" data-toggle=\"collapse\" data-`\n\n`target=\"\
    #bs-example-navbar-collapse-1\"> `\n\n` <span class=\"sr-only\">Toggle navigation</span>\
    \ `\n\n` <span class=\"icon-bar\"></span> `\n\n` <span class=\"icon-bar\"></span>\
    \ `\n\n` <span class=\"icon-bar\"></span> `\n\n` </button> `\n\n` </div> `\n\n\
    ` <div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    > `\n\n` </div><!-- /.navbar-collapse --> `\n\n` </div><!-- /.container-fluid\
    \ --> `\n\n`</nav> `\n\n` `"
  merge: -1
  pgno: 71
- img_proc: true
  md: " \n\n \n\n \n\n \n\n73 \n\nIt may not look like much, but this bar will collapse\
    \ and expand as needed for different sizes, \n\nand all we need to do now is to\
    \ add some content to it. Let's start with branding. \n\nIf you're going to brand\
    \ your navigation using the `**navbar-brand**` class on an `**<a>**` link, then\
    \ the \n\nBS3 best practice is to group this element with the `**navbar-toggle**`\
    \ element that builds the \n\nthree-line collapse icon. This ensures that, when\
    \ collapsing, the text shrinks down as far as it \n\ncan before becoming invisible\
    \ and stacking vertically. \n\nTo make this change, in code sample 45, simply\
    \ add: \n\nImmediately after the closing button tag that holds the three `**<span>**`\
    \ elements with a class of \n\n`**icon-bar**`, and then refresh your browser.\
    \ The result should now look like this: \n\n \n\n*Figure 46: Blank nav bar with\
    \ a brand added *\n\nIf you hover over the brand text, you'll see that it's also\
    \ an active link, generally used to return to \n\na site’s home page. You can\
    \ also put an image in here too, but there are no specific classes \n\nhere to\
    \ help you. I've done this in some designs, but unfortunately, it still takes\
    \ a bit of manual \n\nwork. If you make the image about the same height as the\
    \ `**<H1>**` element, things stay lined up \n\nnicely. Otherwise, the best way\
    \ I've found to make it work is to put some padding in front of the \n\nelement\
    \ holding the band name, then absolute-position your logo with suitable bottom\
    \ \n\nmargins/padding so that it does not hide any content below. \n\nMoving on\
    \ from the brand class, we also have specific classes for forms, buttons, and\
    \ text, as \n\nfollows: \n\n`**navbar-nav**`: for creating a main `**<ul>**` of\
    \ navigation links and dropdowns \n\n`**navbar-form**`: for creating inline miniature\
    \ forms \n\n`**navbar-btn**`: for marking button components up to be navbar friendly\
    \ \n\n`**navbar-text**`: for including independent lines of text in your bar \n\
    \n`**navbar-link**`: for adding independent links that are not part of the regular\
    \ navigation items \n\nYou can use them all together, on their own as needed,\
    \ or combine them with the new emerging \n\nweb components specification and create\
    \ a single bar that takes a configuration and draws what \n\nit needs, as it needs.\
    \ \n\nThe following code sample expands sample 45 to include some navigation links:\
    \ \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_72_0.png)\n\n`<a class=\"navbar-brand\"\
    \ href=\"#\">BS3</a> `\n\n` `"
