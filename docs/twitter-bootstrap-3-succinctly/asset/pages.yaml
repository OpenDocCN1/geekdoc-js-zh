  md: " \n\n \n\n \n\n108 \n\nWhen added and linked in correctly, it should look something\
    \ like this: \n\n \n\n*Figure 83: Output from code sample 80, when used with the\
    \ customization in sample 79 *\n\nWhen used with a normal button tag in the following\
    \ manner: \n\nThe hardest part of using this method is going through the base\
    \ CSS style sheets to find the \n\nnames you wish to override; it's not exactly\
    \ difficult, just long-winded. \n\nOnce you have one such as the button above,\
    \ or you've found and copied out an alert, panel, \n\nlist, or other class, then\
    \ you can easily make a template that can be reused whenever you want \n\nto add\
    \ a custom class of that type. \n\nHeavy customizations are not very different\
    \ from light customizations; the major difference is \n\nthat you override the\
    \ entire class. \n\nSo, for example, you find all the classes related to `**btn**`,\
    \ copy them, modify them, and include \n\nthem separately. \n\nThe new architecture\
    \ inside the BS3 framework now means that once you know the target \n\nselectors,\
    \ and their siblings, creating an override is easy. As I’ve already pointed out,\
    \ the \n\nbootstrap-theme file already contains much of what you might want to\
    \ modify anyway, and if \n\nthat's not an option, then try sites such as Bootswatch.com:\
    \ \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_107_0.png)\n\n` text-shadow: 0\
