  md: " \n\n \n\n \n\n \n\n11 \n\nThe hover classes no longer have nice graduated\
    \ effects in them, and the progress bars and \n\nbuttons no longer look semi-3D\
    \ as they did in v2. Instead, what the maintainers of Twitter \n\nBootstrap have\
    \ decided to do is to make it easier to customize the look and feel of the elements\
    \ \n\nthat are in the CSS. \n\nThe maintainers have even made available a “Bootstrap”\
    \ theme that makes v3 look like the \n\noriginal v2 design to get you started.\
    \ In the last chapter of this book, I'll show you how simple it \n\nnow is to\
    \ override the various classes, and show you how to overhaul the flat theme to\
    \ take on \n\nyour own look and feel. \n\nFor now though, if you want the v2 experience,\
    \ you'll need to make sure that you also include \n\nthe appropriate CSS file\
    \ as required. If you want to stick with the v3 default, you don't need \n\nanything\
    \ extra. \n\n**New Installation Methods **\n\nWhen BS2 was first released, the\
    \ only way of getting it was via a download from the project \n\nwebsite. This\
    \ was covered extensively in the first book with an in-depth discussion of exactly\
    \ \n\nwhich files were in the zip file and why. \n\nBecause so many people were\
    \ using Bootstrap, it didn't take long before it was made available \n\nfor free\
    \ on a CDN by the folks who run MaxCDN. This tradition has continued into the\
    \ v3 code \n\nbase, and you can now simply get your chosen standard v3 installation\
    \ by using the following \n\nHTML script tags: \n\nIf you use the CDN versions,\
    \ please remember that you will also need to make sure you include \n\na recent\
    \ copy of JQuery; none of the BS3 JS functionality will work unless you do. \n\
    \nAs well as the CDN link, there is now also a direct download on the getbootstrap.com\
    \ site, not \n\nonly for the standard JavaScript & CSS bundle as described in\
    \ the previous book, but also a \n\ndirect link to a zip file of the original\
    \ “Less” sources and a conversion to “Sass” for those folks \n\nwho would like\
    \ to be able to include a fully variable-based, customizable version of the kit\
    \ in \n\nyour own build system using tools like Grunt to automate things. \n\n\
    In addition to the new sources, you can now also use Bower to install everything\
    \ you need using \n\nthe following from your project folders command line: \n\n\
    `bower install bootstrap `\n\n` `\n\n`<link rel=\"stylesheet\" `\n\n`href=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    > `\n\n` `\n\n`<link rel=\"stylesheet\" href=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap-`\n\
    \n`theme.min.css\"> `\n\n` `\n\n`<script src=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js\"\
    ></script> `\n\n` `"
