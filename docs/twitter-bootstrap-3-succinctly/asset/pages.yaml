  md: " \n\n \n\n \n\n6 \n\n** The Story behind the *****Succinctly *****Series **\n\
    \n** of Books **\n\nDaniel Jebaraj, Vice President \n\nSyncfusion, Inc. \n\n**taying\
    \ on the cutting edge **\n\nAs many of you may know, Syncfusion is a provider\
    \ of software components for the \n\nMicrosoft platform. This puts us in the exciting\
    \ but challenging position of always \n\nbeing on the cutting edge. \n\nWhenever\
    \ platforms or tools are shipping out of Microsoft, which seems to be about every\
    \ other \n\nweek these days, we have to educate ourselves, quickly. \n\n**Information\
    \ is plentiful but harder to digest **\n\nIn reality, this translates into a lot\
    \ of book orders, blog searches, and Twitter scans. \n\nWhile more information\
    \ is becoming available on the Internet and more and more books are \n\nbeing\
    \ published, even on topics that are relatively new, one aspect that continues\
    \ to inhibit us is \n\nthe inability to find concise technology overview books.\
    \ \n\nWe are usually faced with two options: read several 500+ page books or scour\
    \ the web for \n\nrelevant blog posts and other articles. Just as everyone else\
    \ who has a job to do and customers \n\nto serve, we find this quite frustrating.\
    \ \n\n**The *****Succinctly***** series **\n\nThis frustration translated into\
    \ a deep desire to produce a series of concise technical books that \n\nwould\
    \ be targeted at developers working on the Microsoft platform. \n\nWe firmly believe,\
    \ given the background knowledge such developers have, that most topics can \n\
    \nbe translated into books that are between 50 and 100 pages. \n\nThis is exactly\
    \ what we resolved to accomplish with the *Succinctly* series. Isn’t everything\
    \ \n\nwonderful born out of a deep desire to change things for the better? \n\n\
    **S**"
  merge: -1
