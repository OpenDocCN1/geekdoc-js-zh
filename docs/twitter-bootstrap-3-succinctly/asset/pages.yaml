  md: " \n\n \n\n \n\n20 \n\nOk, so you might end up with the class list from hell\
    \ on your elements, but one set of markup \n\nwill adapt to all display sizes,\
    \ and resize itself where needed. \n\nThis also works with the various offset,\
    \ order, and nesting classes. \n\n**Other Migrations **\n\nIn addition to those\
    \ we've already discussed, the following class names also need to be \n\nchanged\
    \ if you’re migrating from a V2 layout to a V3 layout (Note: the following table\
    \ has been \n\ntaken directly from the Bootstrap 3 docs and was correct at the\
    \ time of writing. As Bootstrap \n\nmatures, however, this may not remain so).\
    \ \n\n*Table 2: V3 class name changes *\n\n**Bootstrap version 2 class name **\n\
    \n**Bootstrap version 3 class name **\n\n.row-fluid \n\n.row \n\n.span\\* \n\n\
    .col-md-\\* \n\n.offset\\* \n\n.col-md-offset-\\* \n\n.brand \n\n.navbar-brand\
    \ \n\n.nav-collapse \n\n.navbar-collapse \n\n.nav-toggle \n\n.navbar-toggle \n\
    \n.btn-navbar \n\n.navbar-btn \n\n.hero-unit \n\n.jumbotron \n\n.icon-\\* \n\n\
    .glyphicon .glyphicon-\\* \n\n.btn \n\n.btn .btn-default \n\n.btn-mini \n\n.btn-xs\
    \ \n\n.btn-small \n\n.btn-sm \n\n.btn-large \n\n.btn-lg \n\n.alert-error \n\n\
    .alert-danger \n\n.visible-phone \n\n.visible-xs \n\n.visible-tablet \n\n.visible-sm\
    \ \n\n.visible-desktop \n\n***Split into*** .visible-md .visible-lg \n\n.hidden-phone\
    \ \n\n.hidden-xs \n\n.hidden-tablet \n\n.hidden-sm \n\n.hidden-desktop \n\n***Split\
    \ into*** .hidden-md .hidden-lg \n\n.input-block-level \n\n.form-control \n\n\
    .control-group \n\n.form-group"
