  md: " \n\n \n\n \n\n \n\n7 \n\n**The best authors, the best content **\n\nEach author\
    \ was carefully chosen from a pool of talented experts who shared our vision.\
    \ The \n\nbook you now hold in your hands, and the others available in this series,\
    \ are a result of the \n\nauthors’ tireless work. You will find original content\
    \ that is guaranteed to get you up and running \n\nin about the time it takes\
    \ to drink a few cups of coffee. \n\n**Free forever **\n\nSyncfusion will be working\
    \ to produce books on several topics. The books will always be free. \n\nAny updates\
    \ we publish will also be free. \n\n**Free? What is the catch? **\n\nThere is\
    \ no catch here. Syncfusion has a vested interest in this effort. \n\nAs a component\
    \ vendor, our unique claim has always been that we offer deeper and broader \n\
    \nframeworks than anyone else on the market. Developer education greatly helps\
    \ us market and \n\nsell against competing vendors who promise to “enable AJAX\
    \ support with one click” or “turn the \n\nmoon to cheese!” \n\n**Let us know\
    \ what you think **\n\nIf you have any topics of interest, thoughts or feedback,\
    \ please feel free to send them to us at \n\nsuccinctly-series@syncfusion.com.\
    \ \n\nWe sincerely hope you enjoy reading this book and that it helps you better\
    \ understand the topic \n\nof study. Thank you for reading. \n\n \n\n \n\n \n\n\
    \ \n\n \n\n Please follow us on Twitter and “Like” us on Facebook to help us spread\
    \ the  \n\nword about the *Succinctly *series! \n\n \n\n \n\n \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_6_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_6_1.png)"
