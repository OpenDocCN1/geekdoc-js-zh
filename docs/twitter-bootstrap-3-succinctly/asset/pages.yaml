  md: " \n\n \n\n \n\n \n\n37 \n\nThe `**form-horizontal**` class is used to create\
    \ regular top-down forms with input controls that \n\nhave their associated labels\
    \ to the left of them, rather than above them as the default form does. \n\nBe\
    \ aware, however, that in order for form horizontal to work correctly, you need\
    \ to add a little \n\nextra markup to the form in general, as shown in the following\
    \ code sample. \n\n \n\n***Note: In today‘s brave new world of HTML 5******, it's\
    \ more important than ever to mark input ***\n\n***elements up correctly with\
    \ an associated label. Because disadvantaged users may be using ***\n\n***aids\
    \ to assist them, not providing the required pieces to allow these aids to work\
    \ correctly ***\n\n***will, going forward, be seen as a bad thing, and companies\
    \ leaving them up could be ***\n\n***shunned for doing so. Not to worry though******—******BS3\
    \ has you covered. If you decide you don't ***\n\n***want labels in your forms,\
    \ you can mark them with an optional class, sr-only. Adding this ***\n\n***class\
    \ will visually prevent the label or associated help text from appearing in your\
    \ ***\n\n***document, but will ensure that it is marked up in such a way as to\
    \ be visible by screen ***\n\n***readers and other similar devices or software.\
    \ ***\n\n*Code Sample 20: The Code from Sample 19 Marked Up with Extra Classes\
    \ to Support Form-Horizontal *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_36_0.png)\n\
