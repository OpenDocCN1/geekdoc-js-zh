  md: " \n\n \n\n \n\n \n\n15 \n\n*Code Sample 1: Version 2 Flexible Container *\n\
    \nIn version 3 the `**container**` and `**row-fluid**` classes no longer exist.\
    \ \n\nSo how do you get a fluid container? Simple: you don't. \n\nRather than\
    \ wrap your contents in a `**container**` and then a `**row**`, you simply don’t\
    \ wrap them in \n\nanything. \n\nYou can still use the grid system to provide\
    \ enclosing containers for your content, so that things \n\nline up nicely with\
    \ Bootstrap’s grid, but you no longer need to put a container around those \n\n\
    collections of `**<div>**` elements before you use them. \n\nIn fact, if you use\
    \ `**container**` and `**row**` (the non-fluid versions still exist) then you'll\
    \ end up with \n\nall your content being in the 1024-pixel, central column automatically,\
    \ and be able to use the \n\nentire page width if you do not. \n\n**Migrating\
    \ the Grid System **\n\nThen next biggest class change is the grid system itself.\
    \ \n\nIn version 2 you typically created grids in the following manner: \n\n*Code\
    \ Sample 2: Version 2 Grid Classes *\n\nThis code would give you two containers\
