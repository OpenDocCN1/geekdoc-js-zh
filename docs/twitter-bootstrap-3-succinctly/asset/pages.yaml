  md: " \n\n \n\n \n\n \n\n103 \n\n \n\n*Figure 80: Accordion replacement produced\
    \ by sample 77 *\n\nAs mentioned, panels don't need to be grouped; they can be\
    \ used in a singular fashion with just \n\na single element as the trigger for\
    \ the folding to happen. For example, if you want to collapse a \n\npanel using\
    \ a simple button, just ensure that your button has a data attribute of `**toggle**`\
    \ with the \n\nvalue `**collapse**`, and a data attribute called `**target**`\
    \ with the selector for the target panel as its \n\nvalue. \n\n**Carousel **\n\
    \nTo round this chapter off, the last JavaScript plug-in I'm going to introduce\
    \ is the newly designed \n\ncarousel. BS2 had a carousel, but like the accordion,\
    \ it’s now been removed and greatly \n\nsimplified to make it easier to use. \n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_102_0.png)\n\n` The planet is radiating\
    \ four-dimensional superstructures `\n\n` </a> `\n\n` </h4> `\n\n` </div> `\n\n\
    ` <div id=\"panelTwo\" class=\"panel-collapse collapse\"> `\n\n` <div class=\"\
    panel-body\"> `\n\n` It is time to take chi to the next level ... `\n\n` </div>\
    \ `\n\n` </div> `\n\n` </div> `\n\n` <div class=\"panel panel-default\"> `\n\n\
    ` <div class=\"panel-heading\"> `\n\n` <h4 class=\"panel-title\"> `\n\n` <a data-toggle=\"\
    collapse\" data-parent=\"#newAccordion\" href=\"#panelThree\"> `\n\n` Reality\
    \ has always been radiating messengers whose souls are opened by `\n\n`stardust\
    \ `\n\n` </a> `\n\n` </h4> `\n\n` </div> `\n\n` <div id=\"panelThree\" class=\"\
    panel-collapse collapse\"> `\n\n` <div class=\"panel-body\"> `\n\n` Self-actualization\
    \ requires exploration ... `\n\n` </div> `\n\n` </div> `\n\n` </div> `\n\n`</div>\
    \ `\n\n` `"
