  md: " \n\n \n\n \n\n16 \n\n \n\nHowever, whereas version 2 had only one level of\
    \ grid size, version 3 now has four levels. Each \n\nlevel is tailored for the\
    \ expected main target device that you anticipate your end product will be \n\n\
    running on. \n\nThese grid units are now named as follows: \n\nExtra small devices:\
    \ `**col-xs-\\***` \n\nSmall devices: `**col-sm-\\***` \n\nMedium devices: `**col-md-\\\
    ***` \n\nLarge devices: `**col-lg-\\***` \n\nMedia queries are used internally\
    \ for BS3 to decide just which of the aforementioned grid \n\nclasses to use,\
    \ and the different sizes are defined as follows: \n\nExtra small: display width\
    \ less than 768 pixels \n\nSmall: display width greater than or equal to 768 pixels,\
    \ or less than 992 pixels \n\nMedium: display width greater than or equal to 992\
    \ pixels, or less than 1,200 pixels \n\nLarge: display width greater than or equal\
    \ to 1,200 pixels \n\nYou can code up multiple versions of your grid for BS3 to\
    \ decide which type to use when \n\ntargeting multiple displays. For example if\
    \ you did the following: \n\n*Code Sample 4: Multiple Grid Size Declarations *\n\
    \n` <div class=\"col-md-10\">Content here</div> `\n\n`</div> `\n\n` `\n\n`<div\
    \ class=\"container\"> `\n\n` <div class=\"col-xs-2\">Content here</div> `\n\n\
    ` <div class=\"col-xs-10\">Content here</div> `\n\n` <div class=\"col-sm-2\">Content\
