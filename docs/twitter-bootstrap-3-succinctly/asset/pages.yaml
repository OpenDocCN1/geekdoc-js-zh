  md: " \n\n \n\n \n\n8 \n\n**About the Author **\n\nAs an early adopter of IT back\
    \ in the late 1970s and early 1980s, I started out with a humble \n\nlittle 1k\
    \ Sinclair ZX81 home computer. \n\nIn time this small, 1k machine became a 16k\
    \ Tandy TRS-80, followed by an Acorn Electron, and \n\neventually, a 4mb arm powered\
    \ Acorn A5000. \n\nAfter leaving school and getting involved with DOS-based PCs,\
    \ I went on to train in many \n\ndifferent disciplines in the computer networking\
    \ and communications industries. \n\nAfter returning to university in the mid-1990s\
    \ and gaining a BSc in Computing for Industry, I now \n\nrun my own consulting\
    \ business, Digital Solutions Computer Software Ltd, in England. I advise \n\n\
    clients at both hardware and software levels in many different IT disciplines,\
    \ covering a wide \n\nrange of domain-specific knowledge from mobile communications\
    \ and networks right through to \n\ngeographic information systems, banking and\
    \ finance, and web design. \n\nWith over 30 years of experience in the IT industry\
    \ within varied platforms and operating \n\nsystems, I have a lot of knowledge\
    \ to share. \n\nYou can often find me hanging around in the Lidnug.NET users group\
    \ on LinkedIn that I help \n\nrun, and you can easily find me in the usual places\
    \ such as Stack-Overflow (and its GIS-specific \n\nboard) and in twitter (@shawty\\\
    _ds), and now also on Pluralsight, where my various videos are \n\navailable.\
    \ \n\nI hope you enjoy the book, and gain something from it. \n\nPlease remember\
    \ to thank Syncfusion (@Syncfusion) for making this book possible, and \n\nallowing\
    \ people like me to share our knowledge with the .NET community. The *Succinctly*\
    \ series \n\nis a brilliant idea for busy programmers."
  merge: -1
