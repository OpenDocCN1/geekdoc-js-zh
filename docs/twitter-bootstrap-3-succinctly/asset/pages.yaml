- img_proc: true
  md: " \n\n \n\n \n\n \n\n93 \n\n \n\n*Figure 70: Jumbotron produced by code sample\
    \ 67 *\n\nAnd that’s it. You can remove the rounded corners and make it full-width\
    \ by swapping the order \n\nand moving it outside its container, but there are\
    \ no special classes or optional colors for this— \n\nit's designed to be big\
    \ and bold, and catch your attention. \n\nSpeaking of catching attention, we also\
    \ have a number of alert classes, and the only real \n\nchange between the BS2\
    \ version and BS3 is the renaming of the class name `**alert-error**` to \n\n\
    `**alert-danger**`. Other than that, the markup to produce alerts is still as\
    \ simple as using a \n\nstandard `**<div>**` with the appropriate contextual classes\
    \ added: \n\n*Code Sample 68: Contextual Alert Classes *\n\n \n\n*Figure 71: Alert\
    \ boxes produced by code sample 68 *\n\nIf you want to add links in your alerts\
    \ using a standard `**<a>**` tag, make sure you apply the class \n\n`**alert-link**`\
    \ to the anchor tag; this will ensure that the link coloring remains consistent\
    \ with the \n\ncontextual color class being used. \n\nYou can also add a cross/dismiss\
    \ icon to the alert, allowing the user to close it and make it \n\nvanish from\
    \ the display. To do this, we need to add a `**<button>**` element marked up with\
    \ a \n\nsprinkle of data attributes and extra classes as follows: \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_92_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_92_1.png)\n\
    \n`<div class=\"alert alert-success\">You did something ...</div> `\n\n`<div class=\"\
    alert alert-info\">Something happened you ...</div> `\n\n`<div class=\"alert alert-warning\"\
    >Something happened that wasn't ...</div> `\n\n`<div class=\"alert alert-danger\"\
    >You did something that was not liked ...</div> `\n\n` `"
  merge: -1
  pgno: 92
- img_proc: true
  md: " \n\n \n\n \n\n94 \n\n*Code Sample 69: A Dismissable Alert Box *\n\n \n\n*Figure\
    \ 72: Dismissible alert produced by code sample 69 *\n\nWe added the extra class\
    \ `**alert-dismissable**` to the outer `**<div>**`, and then used a `**dismiss**`\
    \ \n\ndata attribute to connect the JavaScript action to the alert’s `**dismiss**`\
    \ method, using a simple \n\nbutton. \n\nIf alerts provide operational feedback,\
    \ then there's one other feedback-related component that's \n\na must-have—the\
    \ progress bar. \n\nNo feedback element has produced so much hatred or salutation\
    \ as this humble, little colored \n\nbar. From BS2 to BS3, the only changes made\
    \ here, like with the alert classes, are the \n\nrenaming of the contextual colors\
    \ to match the overall scheme renames elsewhere in the \n\nframework. \n\nThe\
    \ base HTML markup to produce them remains exactly the same: \n\n*Code Sample\
    \ 70: Basic Progress Bar *\n\n \n\n*Figure 73: Progress bar produced by sample\
    \ 70 *\n\nOne thing you really should pay attention to, however (and something\
    \ that I have reiterated at \n\nvarious points in this book), is the group of\
    \ attributes and extras used to make this element \n\nfriendly to screen readers\
    \ and similar equipment. \n\nSince a progress bar often tends to be purely graphical\
    \ in nature, it means nothing to someone \n\nwho's unable to read the screen.\
    \ Most other elements have at least enough text to give the \n\nreader an idea\
    \ of what's there; progress bars need all the help they can get. You'll see from\
    \ the \n\nprevious example that we've added extra aria values to report on what\
    \ percentage the value is \n\nat, and we've also marked up a span that's for screen\
    \ readers only, specifically to give an \n\naudible report. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_93_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_93_1.png)\n\
    \n`<div class=\"alert alert-danger alert-dismissable\"> `\n\n` <button type=\"\
    button\" class=\"close\" data-dismiss=\"alert\" aria-`\n\n`hidden=\"true\">&times;</button>\
    \ `\n\n` <strong>YO!</strong> You got that operation very, very wrong indeed.\
    \ `\n\n`</div> `\n\n` `\n\n`<div class=\"progress\"> `\n\n` <div class=\"progress-bar\"\
    \ role=\"progressbar\" aria-valuenow=\"60\" aria-valuemin=\"0\" `\n\n`aria-valuemax=\"\
    100\" style=\"width: 60%;\"> `\n\n` <span class=\"sr-only\">60% Complete</span>\
    \ `\n\n` </div> `\n\n`</div> `\n\n` `"
  merge: -1
