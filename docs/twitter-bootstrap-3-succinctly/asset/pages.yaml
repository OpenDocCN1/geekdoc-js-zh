  md: " \n\n \n\n \n\n \n\n25 \n\nI can't take credit for this fix however—it's clearly\
    \ detailed in the BS3 documentation online. \n\nThere is also more information\
    \ on the subject in the Windows 8 developer guidelines. \n\n**Safari Percent Rounding\
    \ **\n\nIn some versions of Safari, the rendering engine struggles with the number\
    \ of decimal places in \n\npercentage values. \n\nThese percentages are used often\
    \ in the `**col-\\*-1**` grid classes, and as a result, you'll see errors \n\n\
    in the rendering of 12-column layouts when this is encountered. \n\nThere is a\
    \ bug open in the BS3 bug report system, but there's little they can do to resolve\
    \ it. The \n\nBS3 docs do suggest trying to add a `**pull-right**` to your last\
    \ column, but the best course of \n\nresolution seems to be manual tweaking of\
    \ your percentage-based values until a balance is \n\nfound. \n\n**Android Stock\
    \ Browser **\n\nAt this time, Android versions 4.1 and above ship with the “Browser”\
    \ app as the default web \n\nbrowser. BS3 (and many others) fail to render correctly\
    \ in the Browser app due to the large \n\nnumber of problems in the browser’s\
    \ code base, and more so in the CSS engine where there \n\nare a large number\
    \ of known problems. \n\nThere is a JavaScript-based solution to patch your layouts\
    \ in the BS3 docs, but the best \n\nresolution is for the user to use the Chrome\
    \ app instead, which is by far a better and more \n\nstable browser for Android\
    \ in general. \n\n**And the Rest? **\n\nThere are quite a few more things to be\
    \ aware of, and again, most of these are documented in \n\nthe BS3 docs and cover\
    \ things like pinch-based zooming, virtual keyboards, and how different \n\ntypes\
    \ of view ports react where media queries are concerned. \n\nIn fact, a quick\
    \ scan of the most common issues on www.stackoverflow.com tells us that a great\
    \ \n\nmany of the problems revolve around scrolling, resizing, zooming, and general\
    \ touch screen-\n\nbased issues that seem to stem from either things being too\
    \ small, or not being sensitive \n\nenough for average finger sizes. \n\nMany\
    \ of these size issues can be resolved by downloading the BS3 source distribution\
    \ and \n\neither altering the `**Less**` variables and mixins available, or by\
    \ customizing things using the \n\ncustomization tools available; it's now no\
    \ longer a good idea to just download and use BS3 \n\nunless you’re only targeting\
    \ desktop apps."
