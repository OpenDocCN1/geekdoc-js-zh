  md: " \n\n \n\n \n\n80 \n\nIf you examine the code, you'll see that the last option\
    \ in the list has no value inside its span tag, \n\nwhich, because of the `**empty:**`\
    \ pseudo-selector, causes the browser not to render it. However, \n\nthe second\
    \ you put anything in there using JavaScript or any method that can manipulate\
    \ the \n\nDOM, that badge will pop right back into existence without missing a\
    \ beat. Notice also the use \n\nof the `**pull-right**` alignment class to make\
    \ sure the label sits on the right side of the element, \n\nmaking everything\
    \ look nice and aligned. \n\n**List Group Changes **\n\nList groups are a new\
    \ thing added in BS3, designed to replace the BS2 navigation lists, and \n\nhave\
    \ far more capabilities than their BS2 counterpart. \n\nOnce you start to use\
    \ them, you'll realize that list groups are more like fully styleable list-item\
    \ \n\nboxes, and to be honest, all it would take to create a fully styleable list\
    \ box would in fact be to \n\nwrap them in their own `**div**` and set the overflow\
    \ to scroll appropriately. \n\nA basic list group component can be created with\
    \ markup similar to the following: \n\n*Code Sample 54: Basic BS3 List Group *\n\
    \n \n\n*Figure 57: Output produced by code sample 54 *\n\nAs you saw previously\
    \ in the badges section, you can add badges to lists and other objects, and \n\
    \nif you add them to a list group, they line up perfectly: \n\n*Code Sample 55:\
    \ List Group with Badges Attached *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_79_0.png)\n\
    \n`<ul class=\"list-group\"> `\n\n` <li class=\"list-group-item\">Cheese</li>\
    \ `\n\n` <li class=\"list-group-item\">Burger</li> `\n\n` <li class=\"list-group-item\"\
    >Bun</li> `\n\n` <li class=\"list-group-item\">Pickles</li> `\n\n` <li class=\"\
    list-group-item\">Tomato</li> `\n\n`</ul> `\n\n` `\n\n`<ul class=\"list-group\"\
    > `\n\n` <li class=\"list-group-item\"><span class=\"badge pull-right\">4</span>Cheese</li>\
    \ `\n\n` <li class=\"list-group-item\"><span class=\"badge pull-right\">2</span>Burger</li>\
    \ `\n\n` <li class=\"list-group-item\"><span class=\"badge pull-right\">1</span>Bun</li>\
    \ `\n\n` <li class=\"list-group-item\"><span class=\"badge pull-right\"></span>Pickles</li>\
    \ `"
