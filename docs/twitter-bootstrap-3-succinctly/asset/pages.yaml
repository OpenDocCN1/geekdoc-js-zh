  md: " \n\n \n\n \n\n \n\n21 \n\n**Bootstrap version 2 class name **\n\n**Bootstrap\
    \ version 3 class name **\n\n.control-group.warning .control-group.error \n\n\
    .control-group.success \n\n.form-group.has-\\* \n\n.checkbox.inline .radio.inline\
    \ \n\n.checkbox-inline .radio-inline \n\n.input-prepend .input-append \n\n.input-group\
    \ \n\n.add-on \n\n.input-group-addon \n\n.img-polaroid \n\n.img-thumbnail \n\n\
    ul.unstyled \n\n.list-unstyled \n\nul.inline \n\n.list-inline \n\n.muted \n\n\
    .text-muted \n\n.label \n\n.label .label-default \n\n.label-important \n\n.label-danger\
    \ \n\n.text-error \n\n.text-danger \n\n.table .error \n\n.table .danger \n\n.bar\
    \ \n\n.progress-bar \n\n.bar-\\* \n\n.progress-bar-\\* \n\n.accordion \n\n.panel-group\
    \ \n\n.accordion-group \n\n.panel .panel-default \n\n.accordion-heading \n\n.panel-heading\
    \ \n\n.accordion-body \n\n.panel-collapse \n\n.accordion-inner \n\n.panel-body\
    \ \n\nAs previously mentioned, most of the changes have been made to bring conformity\
    \ to the \n\nnaming scheme used by the various classes. But many of them have\
    \ also been renamed \n\nbecause their overall purpose has changed. \n\nWe’ll go\
    \ into in more detail in upcoming chapters in this book, but for now, if you're\
    \ doing a \n\nconversion, then Table 2 will tell you everything you need in order\
    \ to retarget a v2 layout to v3. \n\nYou might want to consider using a custom\
    \ job in something like a `**Grunt.js**` ¹ task, so that \n\nwhen you run your\
    \ build system, these changes are performed automatically. This will allow \n\n\
    your developers to remain productive using v2 while gradually making the move\
    \ to v3. \n\nSo what exactly has been added to Bootstrap that's new, and what\
    \ exactly has been removed? \n\nWe'll start with what's been removed, and we'll\
    \ cover what's been added in more detail in \n\nChapter 3, “Changed CSS features.”\
    \ It's more important that you know what's been removed in \n\nthis chapter, since\
    \ this is the chapter you’re likely to be referring to when migrating your layouts.\
    \ \n\n \n\n1 http://gruntjs.com"
