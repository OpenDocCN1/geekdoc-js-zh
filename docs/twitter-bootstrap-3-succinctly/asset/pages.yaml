  md: " \n\n \n\n \n\n \n\n87 \n\n \n\n*Figure 63: Output produced by code sample\
    \ 60 *\n\nCreating vertical lists is just as easy, but instead of using the `**thumbnail**`\
    \ classes, we now need \n\nto use the `**media**` object classes. These classes\
    \ and the associated markup create a layout \n\nsimilar to the previous example,\
    \ but instead of appearing underneath the thumbnail, the text is \n\nlined up\
    \ to the right. \n\nThe primary design motive here is in comment and message lists\
    \ with an avatar image, but they \n\ncan be used for news items, product lists,\
    \ and many other things. \n\nTo mark up a media object, simply use an outer `**div**`\
    \ with a class of `**media**`. Then, inside of that, \n\nuse the `**media-object**`,\
    \ `**media-body**`, and `**media-heading**` classes to mark up the individual\
    \ \n\nbits, as the following example shows: \n\n*Code Sample 61: Mark Up for a\
    \ Single BS3 Media Object *\n\n \n\n*Figure 64: Media object produced by code\
    \ sample 61 *\n\nAs you can probably already imagine, it wouldn't take much to\
    \ add these into a List group, or \n\nsome other structure built up using the\
    \ BS3 grid system. BS3 actually makes it much easier \n\nthan that by providing\
    \ a dedicated media object list class and supported markup. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_86_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_86_1.png)\n\
    \n`<div class=\"media\"> `\n\n` <a class=\"pull-left\" href=\"#\"> `\n\n` <img\
    \ class=\"media-object\" data-src=\"holder.js/64x64\" /> `\n\n` </a> `\n\n` <div\
    \ class=\"media-body\"> `\n\n` <h4 class=\"media-heading\">To follow the journey\
    \ is to become one with it</h4> `\n\n` <p>The goal of ultrasonic energy is to\
    \ plant the seeds of awareness rather than `\n\n`stagnation. You and I are beings\
    \ of the quantum matrix. Purpose is a constant.</p> `\n\n` </div> `\n\n`</div>\
    \ `\n\n` `"
