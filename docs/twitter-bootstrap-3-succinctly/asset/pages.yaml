  md: " \n\n \n\n \n\n96 \n\n**Chapter 5 Changed JavaScript Features **\n\nWhen it\
    \ comes to JavaScript in BS3, not much has changed; the vast majority of the changes\
    \ \n\nwe've seen so far have revolved around the CSS and components sections.\
    \ There’s a reason \n\nfor this. \n\nMost of BS2's (and for that matter, BS3's)\
    \ JavaScript functionality comes in the form of data \n\nattributes. In most of\
    \ the cases, we've already seen how to use these in the various sections on \n\
    \ncomponents, which really leaves very little that's specific to JavaScript only.\
    \ \n\nIn this chapter, therefore, I’ll just briefly run through most of what's\
    \ available, and where there is \n\nno other description elsewhere in the book,\
    \ show a brief example on how to use the API \n\navailable. \n\nThe JS facilities\
    \ available in BS2 and BS3 are very extensible, and even a full book probably\
    \ \n\ncouldn't cover everything that's possible. I therefore strongly encourage\
    \ you to go to \n\nwww.getbootstrap.com and read through the section on JavaScript.\
    \ \n\n**Modals **\n\nThe first thing that anyone mentions when the subject of\
    \ JavaScript comes up in Bootstrap is \n\nthe modal dialog boxes—and it's little\
    \ surprise. \n\nBS3's modal boxes are one of the easiest implementations (and\
    \ one of the richest) seen in any \n\nof the modern browser HTML5 frameworks.\
    \ \n\nUsing them is easy, but unfortunately, does require quite a lot of markup.\
    \ \n\nThe following code gives you a very basic example: \n\n*Code Sample 72:\
    \ Basic Modal Example *\n\n`<button class=\"btn btn-primary btn-lg\" data-toggle=\"\
    modal\" data-target=\"#myModal\"> `\n\n` Show Modal Dialog `\n\n`</button> `\n\
    \n` `\n\n`<div class=\"modal fade\" id=\"myModal\" tabindex=\"-1\" role=\"dialog\"\
    \ aria-labelledby=\"myModalLabel\" aria-`\n\n`hidden=\"true\"> `\n\n` <div class=\"\
    modal-dialog\"> `\n\n` <div class=\"modal-content\"> `\n\n` <div class=\"modal-header\"\
    > `\n\n` <button type=\"button\" class=\"close\" data-dismiss=\"modal\" aria-hidden=\"\
    true\">&times;</button> `\n\n` <h4 class=\"modal-title\" id=\"myModalLabel\">Modal\
    \ title</h4> `\n\n` </div> `\n\n` <div class=\"modal-body\">Modal Body</div> `\n\
    \n` <div class=\"modal-footer\"> `\n\n` <button type=\"button\" class=\"btn btn-default\"\
    \ data-dismiss=\"modal\">Close</button> `\n\n` <button type=\"button\" class=\"\
    btn btn-primary\">Some Action</button> `\n\n` </div> `"
  merge: -1
  pgno: 95
- img_proc: true
  md: " \n\n \n\n \n\n \n\n97 \n\n \n\n*Figure 76: Modal example produced by sample\
    \ 72 *\n\nIn order to show a modal, you first need to have a trigger target. In\
    \ sample 72, this is the button \n\nmarked `**Show Modal Dialog**`. For a trigger\
    \ action to work it must have a toggle and target data \n\nattribute assigned\
    \ to it, and the toggle must have the value \"`**modal**`\" to show that it targets\
    \ a \n\nmodal dialog. The target must have the ID selector of the outermost `**<div>**`\
    \ assigned to it. \n\nIn sample 72, the outermost `**<div>**` has an **ID=\"myModal\"\
    ** on it, which means the data attribute \n\nfor `**target**` should have `**#myModal**`\
    \ as its value. \n\nYour trigger doesn't have to be a button; it can be anything\
    \ that can accept (or is set up to \n\naccept) a mouse click, as long as the toggle\
    \ and target data attributes are provided. \n\nOnce we get into the modal itself,\
    \ you'll see the structure consists of a number of quite deeply \n\nnested `**<div>**`s.\
    \ Because of this nesting, it's recommended that you create and place your \n\n\
    dialog/modal definitions as close to the body root as possible; if you do not,\
    \ then there is a \n\nchance that other components and HTML structures could cause\
    \ layout problems that you did \n\nnot anticipate. \n\nYou'll also notice that\
    \ again, there is a common theme of marking things up to make them \n\nfriendly\
    \ to screen readers, and again, I can't stress this enough: you should make every\
    \ effort to \n\nmake sure your markup is as friendly to accessibility tools as\
    \ possible. \n\nA modal starts with an outer `**<div>**` and the class `**modal**`\
    \ applied to it. Optionally, you can also \n\nadd `**fade**`, which will give\
    \ the modal a nice smooth transition when showing and hiding. This \n\nouter `**<div>**`\
    \ should be the one on which you set your `**Z-Order**` and anything else in the\
    \ way of \n\nglobal modal customizations you wish to make. \n\nThe next `**<div>**`\
    \ in should have a class of `**modal-dialog**` added to it. That `**<div>**` should\
    \ then be \n\nfollowed immediately by a third `**<div>**` with the class of `**modal-content**`\
    \ assigned to it. It's inside \n\nthis third `**<div>**` where you actually place\
    \ your modal content definition. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_96_0.png)\n\
    \n` </div> `\n\n` </div> `\n\n`</div> `\n\n` `"
  merge: -1
  pgno: 96
- img_proc: true
  md: " \n\n \n\n \n\n98 \n\nOnce you have the modal content shell defined, you can\
    \ then place in three further `**<div>**` \n\nelements with the following classes:\
    \ `**modal-header**`, `**modal-body**`, and `**modal-footer**`. These \n\nthree\
    \ inner sections should NOT be nested, but rather added to the markup as siblings\
    \ of each \n\nother, and are used to define the content for the three main sections\
    \ of the dialog. \n\nYou can see from the code in sample 72 that we include a\
    \ closing cross, as we did for alert \n\nboxes. The only difference between this\
    \ closing cross and the one we saw previously is that the \n\n`**dismiss**` data\
    \ attribute has a value of `**modal**` and not `**alert**`. Any clickable element\
    \ placed within \n\nthe inner modal markup that has this data attribute, with\
    \ this value, will close the dialog when \n\nclicked. \n\nApart from the close\
    \ icon, the rest of the modal’s inner content is just normal BS3 markup and \n\
    \nCSS. Anything you can use elsewhere you can use inside a modal, and if it's\
    \ too tall for the \n\nscreen, you'll get an inner container that automatically\
    \ switches to a scrollable element. \n\nThere are also two optional width sizes;\
    \ these are added to the inner `**modal-dialog**` `**<div>**` and \n\nare `**modal-lg**`\
    \ and `**modal-sm**`. The large size class expands the width of the modal to half\
    \ the \n\nscreen width (ideal for tables and lists), whereas the small size shrinks\
    \ the default width to \n\napproximately half of its original size (ideal for\
    \ things like yes/no prompts). \n\nYou can also initialize the modal using the\
    \ JavaScript API in a standard jQuery fashion; if you \n\nwant to alter the default\
    \ option’s behavior, then using the JQ constructor is the only way to do it. \n\
    \n*Code Sample 73: Setting the Default Options on a Modal Using JavaScript *\n\
    \nThe options that can be changed are as follows: \n\n**backdrop:** Boolean true\
    \ or false to include or not include the shaded background on the page \n\nwhen\
    \ the modal is shown; if the value `**static**` is specified, then the background\
    \ is shown but \n\ndoes NOT close the modal when clicked on, as it does if `**true**`\
    \ is used. \n\n**keyboard:** Boolean true or false; allows or does not allow the\
    \ escape key to close the modal. \n\n**show:** Boolean true or false, automatically\
    \ shows or does not show the dialog as soon as it’s \n\ninitialized. \n\n**remote:**\
    \ String containing a url to get the inner content for the dialog body; if this\
    \ is supplied, \n\nthen the dialog will ask the url to supply a chunk of HTML\
    \ to be used in the body of the modal. \n\nThere are also a number of events that\
    \ are raised for certain actions, but they are beyond the \n\nscope of this chapter.\
    \ \n\n`$('#myModal').modal({ `\n\n` backdrop: true/false, `\n\n` keyboard: true/false,\
    \ `\n\n` show: true/false, `\n\n` remote: 'path to url that returns content' `\n\
    \n`}); `\n\n` `"
  merge: -1
  pgno: 97
- img_proc: true
  md: " \n\n \n\n \n\n \n\n99 \n\n**Tabs **\n\nIf you recall, back in the section\
    \ on basic navigation, I mentioned that the tab component can be \n\nwired up\
    \ with extra markup to actually handle the swapping of content panes for you.\
    \ \n\nTo mark-up a set of tabs that change automatically using JavaScript, you\
    \ first need to create a \n\n`**<ul>**` in the same manner as shown in the navigation\
    \ components section. This `**<ul>**` must have \n\n`**<a>**` elements embedded\
    \ inside each of its `**<li>**` elements, with the `**href**` of each anchor \n\
    \npointing to the `**id**` of each associated `**<div>**` set up to hold a tab\
    \ panel. You also need to make \n\nsure that each anchor has a toggle data attribute\
    \ assigned to it and that its value is set to `**tab**`. \n\nOnce you've created\
    \ the navigation set, you then need to create an outer `**<div>**` and assign\
    \ the \n\nclass `**tab-content**` to it. Inside of this `**<div>**`, you then\
    \ need to create several separate sibling \n\n`**<div>**`s, each with a class\
    \ of `**tab-pane**` and an `**id**` attribute matching the associated tab in the\
    \ \n\nnavigation set. Optionally, you can also add `**fade in**` to fade tabs\
    \ when they change, and \n\n`**active**` to mark which of the tabs is currently\
    \ been shown. \n\nThe following code shows an example of this: \n\n*Code Sample\
    \ 74: Automatic Tabs Example *\n\n \n\n*Figure 77: Tab set produced by code sample\
    \ 74 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_98_0.png)\n\n`<ul class=\"\
    nav nav-tabs\"> `\n\n` <li class=\"active\"><a href=\"#tab1\" data-toggle=\"tab\"\
    >Tab 1</a></li> `\n\n` <li><a href=\"#tab2\" data-toggle=\"tab\">Tab 2</a></li>\
    \ `\n\n` <li><a href=\"#tab3\" data-toggle=\"tab\">Tab 3</a></li> `\n\n`</ul>\
    \ `\n\n`<div class=\"tab-content\"> `\n\n` <div class=\"tab-pane active\" id=\"\
    tab1\"> `\n\n` <h1>We self-actualize, we believe, we are reborn</h1> `\n\n` <p>By\
    \ refining, we live ...</p> `\n\n` </div> `\n\n` <div class=\"tab-pane\" id=\"\
    tab2\"> `\n\n` <h1>We exist as four-dimensional superstructures</h1> `\n\n` <p>Today,\
    \ science tells us that the ...</p> `\n\n` </div> `\n\n` <div class=\"tab-pane\"\
    \ id=\"tab3\"> `\n\n` <h1>The goal of morphogenetic fields is to plant ...</h1>\
    \ `\n\n` <p>You and I are life forms of the quantum soup ...</p> `\n\n` </div>\
    \ `\n\n`</div> `\n\n` `"
  merge: -1
  pgno: 98
- img_proc: true
  md: " \n\n \n\n \n\n100 \n\nThe tab control doesn't have a constructor that takes\
    \ options the way modal does, but it does \n\nhave an API call so that you can\
    \ tell which tab to show programmatically. To do this, you just \n\nneed use jQuery\
    \ to select the appropriate selector, and then call `**tab('show')**` on it. When\
    \ this \n\nis done, your tabs will automatically make the referenced tab the selected\
    \ one. As with modals \n\n(and others), there are events available to tell you\
    \ when things change; the details and \n\nparameters of each call can be found\
    \ in the BS3 docs. \n\n**Tooltips and Popovers **\n\nEveryone loves tooltips—simple\
    \ little pop-up tags that can be used for help and many other \n\nsimple, descriptive\
    \ tasks. \n\nUsing a tooltip in BS3 is incredibly easy. Simply assign a data attribute\
    \ of `**toggle**` with the value \n\n`**tooltip**` to any standard HTML element\
    \ that you wish the tooltip to display for. To define the \n\ntext for the tooltip,\
    \ add a title attribute containing the desired text, and optionally, add a data\
    \ \n\nattribute called `**placement**` containing the value `**left**`, `**top**`,\
    \ `**bottom**`, or `**right**` as required, \n\ndepending on which direction you\
    \ would like the tooltip to show. \n\nThe following code will create a simple\
    \ button with a tooltip attached to its top: \n\n*Code Sample 75: BS3 Button with\
    \ a Tool Tip *\n\nThere is one small caveat that applies to tooltips, but does\
    \ not apply to any other element: you \n\nneed to initialize tooltips yourself.\
    \ You can pass various options into them at the same time (just \n\nas with modals),\
    \ but you MUST initialize them, or your tooltips will not appear. \n\nTo initialize\
    \ the button shown in the previous example, place the following line of JavaScript\
    \ \n\nsomewhere in your page so that it's run once the DOM is ready and the button\
    \ is created: \n\nIt's entirely up to you how you select each of your buttons.\
    \ You could, for example, select them \n\nall via their element type, but you\
    \ must call `**tooltip()**` on every element that has a tooltip \n\nattached.\
    \ \n\nIf everything works as expected, you should see something like this: \n\n\
    \ \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_99_0.png)\n\n`<button id=\"mybutton\"\
    \ type=\"button\" class=\"btn btn-default\" data-toggle=\"tooltip\" `\n\n`data-placement=\"\
    top\" title=\"I am a tooltip!!\">The button with a tooltip</button> `\n\n` `\n\
    \n`$('#mybutton').tooltip(); `\n\n` `"
  merge: -1
  pgno: 99
