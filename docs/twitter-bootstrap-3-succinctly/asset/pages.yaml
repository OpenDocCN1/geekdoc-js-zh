  md: " \n\n \n\n \n\n \n\n63 \n\n \n\n*Figure 31: Output generated by code sample\
    \ 37 after it's been amended *\n\n*to produce a split drop-down menu *\n\nThe\
    \ final thing to mention before moving on are the sizing and drop-up variations.\
    \ \n\nThe sizing is simple; the sizing classes mentioned in the CSS chapter work\
    \ just as expected \n\nwith drop-down buttons, in exactly the same manner as they\
    \ do on normal buttons (`**lg**` for large, \n\nno `**md**` since medium is the\
    \ default, `**sm**` for small, and `**xs**` for extra small). \n\n`**Drop-up**`\
    \ is a class name that you apply to the outer element with the `**btn-group**`\
    \ class when \n\nconstructing a drop-down or split drop-down button, which, as\
    \ its name implies, causes the \n\nmenu to pop upwards rather than downwards.\
    \ \n\n**A final note on drop-down menus **\n\nDrop-down menus aren’t only attached\
    \ to buttons—ANY element that can be wrapped in an \n\nouter parent can be used.\
    \ \n\nYou can apply a class of `**dropdown**` to the wrapped element with a `**data**`\
    \ attribute of `**toggle**`, and \n\nthe value of `**dropdown**`, which will cause\
    \ that element to become the trigger for the drop-down \n\nmenu to display. \n\
    \n**Input Group Changes **\n\nIn short, there have been no changes to the input\
    \ group functionality between BS2 and BS3. \n\nInput groups are still marked up\
    \ exactly as before, with the same caveats, namely: \n\nYou cannot add multiple\
    \ additions on one side, only one on each end. \n\nMultiple elements in one input\
    \ group are not supported. \n\nYou cannot mix input groups with other components;\
    \ you must nest them. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_62_0.png)"
  merge: -1
  pgno: 62
- img_proc: true
  md: " \n\n \n\n \n\n64 \n\nIf you’re attaching tooltips and popovers, you must add\
    \ a container option, as previously \n\nmentioned under button changes \n\nWhere\
    \ possible, avoid using input groups with select lists, especially when targeting\
    \ WebKit-\n\nbased browsers \n\nTo create an input group, simply wrap your input\
    \ control and its \\[pre|suf\\]fix (which will generally \n\nbe a `**<span>**`)\
    \ in a `**<div>**` or other block-level element with a class type of `**input-group**`\
    \ applied \n\nto it. Next, make sure that the additional `**<span>**` has a class\
    \ of `**input-group-addon**` applied to \n\nit. \n\nFor example, the following\
    \ code will create an input box for a Twitter handle, and an input box \n\nfor\
    \ money where you’re not entering a decimal part. \n\n*Code Sample 38: BS3 Input\
    \ Addons Using Input Groups *\n\n \n\n*Figure 32: The output produced by code\
    \ sample 38 *\n\nThe normal sizing classes also apply to these, just as they apply\
    \ to other form inputs, so adding \n\n`**input-group-lg**` and `**input-group-sm**`\
    \ (again, there is no `**md**`) to the outer input group will size \n\nthe entire\
    \ control set accordingly. \n\nOne thing that’s not new in BS3, but has been made\
    \ easier to do, is adding checkboxes, radio \n\nbuttons, regular buttons, and\
    \ drop-down menus to input groups. \n\nEach of these options require a bit more\
    \ markup than when you’re using a regular `**<span>**`, but \n\nthe resulting\
    \ effect is that you can add interactivity to your fields. For example, you might\
    \ use \n\nthese inputs to create your own file upload control, or a button that\
    \ creates a random password. \n\nThe following code shows how to achieve this:\
    \ \n\n*Code Sample 39: Input Groups Using Buttons and Radios *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_63_0.png)\n\
    \n`<div class=\"input-group\"> `\n\n` <span class=\"input-group-addon\">@</span>\
    \ `\n\n` <input type=\"text\" class=\"form-control\" placeholder=\"Username\"\
    > `\n\n`</div> `\n\n`<br/> `\n\n`<div class=\"input-group\"> `\n\n` <input type=\"\
    text\" class=\"form-control\"> `\n\n` <span class=\"input-group-addon\">.00</span>\
    \ `\n\n`</div> `\n\n` `\n\n`<div class=\"input-group\"> `\n\n` <span class=\"\
    input-group-addon\"> `"
