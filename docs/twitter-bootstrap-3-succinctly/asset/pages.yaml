    \ class=\"input-group-btn\"> `\n\n` <button class=\"btn btn-default\" type=\"\
    button\">Check User Name</button> `\n\n` </span> `\n\n` <input type=\"text\" class=\"\
    form-control\" placeholder=\"Please enter a user name `\n\n`here\"> `\n\n`</div>\
    \ `\n\n`<br/> `\n\n`<div class=\"input-group\"> `\n\n` <input type=\"text\" class=\"\
    form-control\" placeholder=\"Enter the password you would `\n\n`like to use\"\
    > `\n\n` <span class=\"input-group-btn\"> `\n\n` <button class=\"btn btn-success\"\
