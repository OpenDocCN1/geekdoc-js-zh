  md: " \n\n \n\n \n\n \n\n75 \n\n \n\n*Figure 48: Drop-down menu produced by code\
    \ sample 47 *\n\nYou can combine each of these, so it's simple to have drop-down\
    \ and non-dropdown links in \n\none `**navbar-nav**` `**<ul>**` just by marking\
    \ up each `**<li>**` element as needed. \n\nAnother common requirement in navigation\
