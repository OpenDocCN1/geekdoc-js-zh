- img_proc: true
  md: " \n\n \n\n \n\n \n\n91 \n\nOne thing to be careful of, though—if you're using\
    \ `**panel-footer**` and contextual colors, the \n\nfooter will NOT adopt the\
    \ panel’s color scheme. This is deliberate, as the BS3 developers felt \n\nthat\
    \ contextually, only the contents of the panel were important. Any buttons, controls,\
    \ or footer \n\ninformation to respond to that information did not need to be\
    \ highlighted in the same way, thus \n\nallowing the developer freedom to add\
    \ different contextual colors for different controls as \n\nrequired. \n\nPanels\
    \ can also work fluidly with list groups and tables. If you join a table with\
    \ a panel inside of \n\nthe parent `**div**`, you get a panel as shown previously,\
    \ and a seamless join to the table below it, \n\nas the following shows: \n\n\
    *Code Sample 66: Panel from Sample 65 Colored as Primary and with a Table Applied\
    \ *\n\n`<div class=\"panel panel-primary\"> `\n\n` <div class=\"panel-heading\"\
    > `\n\n` <h1 class=\"panel-title\">Panel Header</h1> `\n\n` <p>Panel sub header</p>\
    \ `\n\n` </div> `\n\n` <div class=\"panel-body\"> `\n\n` <p>Panel content goes\
    \ here</p> `\n\n` <p>Panel content goes here</p> `\n\n` <p>Panel content goes\
    \ here</p> `\n\n` </div> `\n\n` <table class=\"table\"> `\n\n` <thead> `\n\n`\
    \ <tr> `\n\n` <th>#ID</th> `\n\n` <th>Name</th> `\n\n` <th>Twitter Handle</th>\
    \ `\n\n` </tr> `\n\n` </thead> `\n\n` <tbody> `\n\n` <tr> `\n\n` <td>1</td> `\n\
    \n` <td>Peter Shaw</td> `\n\n` <td>@shawty\\_ds</td> `\n\n` </tr> `\n\n` <tr>\
    \ `\n\n` <td>2</td> `\n\n` <td>Digital Solutions UK</td> `\n\n` <td>@digitalsolut\\\
    _uk</td> `\n\n` </tr> `\n\n` </tbody> `\n\n` </table> `\n\n`</div> `\n\n` `"
