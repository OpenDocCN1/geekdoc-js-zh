  md: " \n\n \n\n \n\n48 \n\n \n\n*Figure 18: Output produced by code sample 28 *\n\
    \nOne thing that was noted as being needed in BS3, and not present in BS2, is\
    \ a dedicated `**caret**` \n\nclass for drop-down indicators on buttons and other\
    \ screen furniture. \n\nYou can now utilize this on your own elements by adding\
    \ a class name of `**caret**` to your outer \n\ncontainer—a `**<span>**` or `**<div>**`\
    \ that wraps your inner content. \n\nAnother new addition in BS3, while it's not\
    \ actually a class, still deserves a mention: the dialog \n\nclose cross. \n\n\
    ![](img/3ef3f89d48533001235bf8b5b1e48737_47_0.png)\n\n`<p class=\"text-info\"\
    >This paragraph is using the info text class, <strong>typically `\n\n`reserved\
    \ for informal messages, such as a background job just finishing or a new file\
    \ `\n\n`available.</strong></p> `\n\n`<p class=\"text-warning\">This paragraph\
    \ is using the warning text class, `\n\n`<strong>typically reserved for something\
    \ that might be dangerous or that needs `\n\n`attention but can wait a while.</strong></p>\
    \ `\n\n`<p class=\"text-danger\">This paragraph is using the danger text class,\
    \ `\n\n`<strong>typically reserved for something very important, or something\
    \ that really `\n\n`needs attention drawing to it.</strong></p> `\n\n` `\n\n`<br/><br/>\
    \ `\n\n` `\n\n` `\n\n`<p class=\"bg-primary\">This paragraph is using normal text\
    \ but with a primary `\n\n`background color to tell you that what you're seeing\
    \ is the default status.</p> `\n\n`<p class=\"bg-success\">This paragraph is using\
    \ normal text but with a success `\n\n`background color to tell you that what\
    \ you're seeing is all good.</p> `\n\n`<p class=\"bg-info\">This paragraph is\
    \ using normal text but with an info background `\n\n`color to tell you that what\
    \ you're seeing is informative and should be read, but not `\n\n`always acted\
    \ upon.</p> `\n\n`<p class=\"bg-warning\">This paragraph is using normal text\
    \ but with a warning `\n\n`background color to tell you that what you're seeing\
    \ could cause problems that you `\n\n`should be aware of.</p> `\n\n`<p class=\"\
    bg-danger\">This paragraph is using normal text but with a danger background `\n\
    \n`color to tell you that what you're seeing needs you to pay attention to it\
    \ now.</p> `\n\n` `"
