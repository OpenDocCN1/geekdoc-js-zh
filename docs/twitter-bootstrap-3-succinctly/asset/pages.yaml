  md: " \n\n \n\n \n\n \n\n67 \n\nThe markup needed now consists of nothing more than\
    \ a handful of `**<li>**` elements; the only \n\nplace the classes need to be\
    \ applied is on the outer `**<ul>**` itself. You'll also see that we have an \n\
    \n`**active**` class on the first `**<li>**` in the list, to show us which tag\
    \ is the active tag. \n\nIf you want BS3 to provide the entire tab's experience\
    \ (that is, to actually change the content as \n\nrequired), then there's more\
    \ work you need to do. For that, as we'll see in the JavaScript \n\nsection, you\
    \ need to use one of the JavaScript add-ons. If, however, you want to handle the\
    \ tab \n\nswitching and content yourself, all you need to do to switch tabs is\
    \ move the active class from \n\none `**<li>**` to the next. \n\nThings are no\
    \ more complicated with pills: just exchange the `**nav-tabs**` in code sample\
    \ 40 for \n\n`**nav-pills**` and you should see your output change to this: \n\
    \n \n\n*Figure 35: Output from code sample 40 when changed to **“**pill**”** mode\
    \ *\n\nand if we add `**nav-stacked**` to either of them, our navigation will\
    \ stack neatly one on top of each \n\nother: \n\n \n\n*Figure 36: Code sample\
    \ 40, changed to **“**pill**”** mode, and with nav-stacked added *\n\nAs with\
    \ most other components and changes in the framework, the output now renders as\
    \ a \n\nblock element occupying all of the available space. Again, you just need\
    \ to use the grid system \n\nand other available classes to make sure it takes\
    \ up only the space you need. Now, any parent \n\ncontainer that changes size\
    \ because of differing screen resolutions will now cause its child \n\nelements\
    \ to responsively resize as needed. \n\nBy the way, this also works with tabbed\
    \ navigation, but the output is most likely not what you \n\nwould expect: \n\n\
    \ \n\n*Figure 37: Code sample 40, rendered as stacked tabs *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_66_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_2.png)"
  merge: -1
