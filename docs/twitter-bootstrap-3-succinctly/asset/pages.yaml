  md: " \n\n \n\n \n\n24 \n\nIf you notice in the `**meta**` tag just inside the `**head**`\
    \ element, you'll see that we have compatibility \n\nkeys in there to allow the\
    \ modern IE rendering engine to know what is and is not supported \n\nwhen trying\
    \ to render things in a backward compatible way. \n\nIn BS3, none of this works\
    \ correctly. Instead, the recommended method is to remove all your \n\ncontent\
    \ type keys, leaving ONLY `**IE=EDGE**`, and no others. \n\nThe best way to do\
    \ this is to create a layout that works perfectly in an HTML5-standard way, \n\
    \ninclude the various versions, then either force the IE debugger to adopt a specific\
    \ version, or do \n\nsomething to the document source that will force IE to attempt\
    \ to render the content in a way \n\nthat it would under IE9 or earlier. \n\n\
    Over and over again, I looked at the `**meta**` tag, not realizing that it was\
    \ the cause of my \n\nproblems. So if you get any weird rendering errors in IE11,\
    \ have a look in the debugger and see \n\njust what mode IE believes it should\
    \ be displaying your page in. \n\n**Internet Explorer 10 Device Viewport **\n\n\
    Yes folks, another IE-related problem. IE10 can't tell the difference between\
    \ `**device width**` and \n\n`**viewport width**`; the result of this is that\
    \ IE10 gets its CSS media queries wrong a lot of the \n\ntime (not just in Bootstrap,\
    \ but other frameworks too). The fix is simple enough: add a dummy \n\nCSS rule\
    \ to your site-wide CSS styles that looks like this: \n\nThat generally fixes\
    \ things, except in one case. With Windows Phone versions earlier than \n\nUpdate\
    \ 3, the device will not interpret things correctly and put the page into desktop\
    \ view. To fix \n\nthis, the following CSS rules and JavaScript code are needed:\
    \ \n\n*Code Sample 9: Windows Phone 8 IE Fix *\n\n`@-ms-viewport { width: device-width;\
    \ } `\n\n` `\n\n`@-webkit-viewport { width: device-width; } `\n\n`@-moz-viewport\
    \ { width: device-width; } `\n\n`@-ms-viewport { width: device-width; } `\n\n\
