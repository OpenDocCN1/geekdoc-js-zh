  md: " \n\n \n\n \n\n84 \n\n \n\n*Figure 61: Output produced by code sample 58 *\n\
    \nAs you can see, what use is a burger without cheese and a bun? Tomatoes I can\
    \ take or leave, \n\nbut please hold the pickle! \n\n**Media Objects and Custom\
    \ Thumbnail Changes **\n\nWe covered the basic thumbnail changes for the styling\
    \ back in the chapter on CSS, but what \n\nwe didn’t get into are the changes\
    \ in the surrounding components. \n\nThe amalgamation that now exists in BS3 allows\
    \ us to combine the thumbnail classes with the \n\ngrid classes to create easy-to-use\
    \ image lists. The most basic way we can use them is to use \n\nthe `**row**`\
    \ class and grid spans, along with the basic thumbnail classes, to make perfectly\
    \ lined-up \n\nthumbnails, as the following shows: \n\n*Code Sample 59: Basic\
    \ Thumbnails with Grid Classes *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_83_0.png)\n\
    \n`<div class=\"row\"> `\n\n` <div class=\"col-md-3\"> `\n\n` <a href=\"#\" class=\"\
    thumbnail\"> `\n\n` <img data-src=\"holder.js/100%x180\" /> `\n\n` </a> `"
