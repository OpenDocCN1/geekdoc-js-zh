  md: " \n\n \n\n \n\n \n\n101 \n\n*Figure 78: Button with accompanying tooltip *\n\
    \nClose behind the humble tooltip comes the popover, and like the tooltip, it\
    \ must be initialized \n\nmanually with a call to `**popover()**`. The main difference\
    \ between a popover and a tooltip is that \n\npopovers can hold more contents\
    \ than a tooltip. \n\nA tooltip typically only has a simple, single line of text,\
    \ whereas a popover is larger and can \n\ncontain multiple HTML elements, ranging\
    \ from paragraphs to buttons and images. \n\nThe second difference is that the\
    \ element has to be clicked before a popover will display, \n\nwhereas a tooltip\
    \ is automatic upon hover. \n\nYou create a popover in much the same way as a\
    \ tooltip, except that the popup content is \n\ndefined inside a data attribute\
    \ called `**content**`, and the `**title**` attribute is used to give the \n\n\
    popover a mini title area (similar to the way the header area is used on a panel\
    \ component). \n\nThe following code shows how to define a simple popover: \n\n\
    *Code Sample 76: BS3 Button with a Popover *\n\nAs with the tooltip, somewhere\
    \ in your document start-up, you also need to ensure you initialize \n\nthe component\
    \ using something like: \n\nAlso as with the tooltip, you can pass an object containing\
    \ options in here. There are many \n\navailable, so again, I'd encourage you to\
    \ read the BS3 docs to learn them all. \n\nIf everything worked, you should be\
    \ able to render your page and see this: \n\n \n\n*Figure 79: BS3 button with\
    \ a popover attached *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_100_0.png)\n\
    \n`<button id=\"mybutton\" type=\"button\" class=\"btn btn-default\" data-container=\"\
    body\" `\n\n`data-toggle=\"popover\" data-placement=\"bottom\" data-content=\"\
    I am the pop over `\n\n`contents, and I'm awesome.\" title=\"Popover Title\">\
    \ `\n\n` I am a button with a pop over `\n\n`</button> `\n\n` `\n\n`$('#mybutton').popover();``\
    \ `"
