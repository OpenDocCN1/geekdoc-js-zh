  md: " \n\n \n\n \n\n \n\n43 \n\n \n\n*Figure 14: The output generated by code sample\
    \ 24 *\n\n**Button Changes **\n\nThe most prominent change in the classes used\
    \ to style buttons in BS3 is the default style. \n\nUnder BS2, simply adding the\
    \ `**btn**` class to an input element of type button, or to an anchor tag, \n\n\
    would give the control the default button look and feel. \n\nFrom BS3 onwards,\
    \ you now explicitly have to add `**btn-default**`; just adding `**btn**` on its\
    \ own will \n\nnow no longer have any effect. \n\nThe second main change is in\
    \ the renaming of some of the base classes. Specifically, `**btn-**`\n\n`**error**`\
    \ has been renamed to `**btn-danger**` so that the naming scheme matches the other\
    \ \n\nsimilarly named class changes and brings uniformity to the Bootstrap base\
    \ library. \n\nOther than that, the base button classes remain unchanged, as the\
    \ following code sample \n\nshows: \n\n*Code Sample 25: BS3 Button Classes *\n\
    \nWhen rendered in the browser, you'll see the normal flat button look the BS3\
    \ now has for \n\ncontrols: \n\n \n\n*Figure 15: Bootstrap buttons as produced\
    \ by code sample 25 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_42_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_42_1.png)\n\
    \n`<button type=\"button\" class=\"btn btn-default\">Default</button> `\n\n`<button\
    \ type=\"button\" class=\"btn btn-primary\">Primary</button> `\n\n`<button type=\"\
    button\" class=\"btn btn-success\">Success</button> `\n\n`<button type=\"button\"\
    \ class=\"btn btn-info\">Info</button> `\n\n`<button type=\"button\" class=\"\
    btn btn-warning\">Warning</button> `\n\n`<button type=\"button\" class=\"btn btn-danger\"\
    >Danger</button> `\n\n`<button type=\"button\" class=\"btn btn-link\">Link</button>\
    \ `\n\n` `"
