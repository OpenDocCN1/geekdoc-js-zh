  md: " \n\n \n\n \n\n \n\n81 \n\n \n\n*Figure 58: Output from code sample 55 *\n\n\
    The most observant of you may be thinking, “Ok, so list groups look good, but\
    \ there just still \n\n`**<ul>**`s underneath the surface, there's really nothing\
    \ that special about them.” \n\nWell, maybe you’re right about that…or maybe we\
    \ need to experiment a bit more. \n\nList groups, unlike the classes we saw in\
    \ the navigation sections, cannot just be applied to an \n\nunordered list. A\
    \ list group can be applied to any parent container, and when done so, the \n\n\
    styling will cause all of the children of that container to become linked. Take\
    \ a look at the \n\nfollowing example: \n\n*Code Sample 56: List Group Created\
    \ Using <a> Tags *\n\n \n\n*Figure 59: Output produced by code sample 56 *\n\n\
    As code sample 56 shows, we can create a list of links using nothing more than\
    \ a `**<div>**` \n\nsurrounding the list, and that list then instantly becomes\
    \ a list-style menu with a light grey hover \n\neffect. However, because the inner\
    \ tags are `**<a>**` tags, we can now go even further: \n\n*Code Sample 57: List\
    \ Group Expanded to Use More than Just Simple Lists *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_80_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_80_1.png)\n\
    \n` <li class=\"list-group-item\"><span class=\"badge pull-right\">2</span>Tomato</li>\
    \ `\n\n`</ul> `\n\n` `\n\n`<div class=\"list-group\"> `\n\n` <a class=\"list-group-item\"\
    >Cheese</a> `\n\n` <a class=\"list-group-item\">Burger</a> `\n\n` <a class=\"\
    list-group-item\">Bun</a> `\n\n` <a class=\"list-group-item\">Pickles</a> `\n\n\
    ` <a class=\"list-group-item\">Tomato</a> `\n\n`</div> `\n\n` `\n\n`<div class=\"\
    list-group\"> `\n\n` <a class=\"list-group-item active\"> `"
