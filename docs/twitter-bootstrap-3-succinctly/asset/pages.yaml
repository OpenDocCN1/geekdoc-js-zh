  md: " \n\n \n\n \n\n \n\n17 \n\nBS3 will hide and unhide the containers as required,\
    \ depending on the width of the device \n\ndisplay and the operation of the media\
    \ queries. \n\nAs with previous versions of the grid system, there are 12 columns\
    \ horizontally across all the \n\ndifferent sizes, so whichever grid size is displayed,\
    \ you will always still get 12 grids on every \n\ndevice. \n\nThe column width\
    \ itself does change, however, so you may need to plan the content in those \n\
    \ngrids to take advantage of the differing sizes. The sizes for each of them are\
    \ as follows: \n\n`**col-xs-\\***` = Auto sizing, no fixed dimensions \n\n`**col-sm-\\\
    ***` = 60 pixels \n\n`**col-md-\\***` = 78 pixels \n\n`**col-lg-\\***` = 95 pixels\
    \ \n\nThe gutter margin in all cases will remain at 15 pixels on each side of\
    \ the grid container, giving \n\nan overall gutter of 30 pixels. This size will\
    \ be consistent no matter which grid size level you’re \n\nusing. \n\nNesting\
    \ and offsets work as they did previously, but as with the grids themselves, by\
    \ way of a \n\nslight renaming of the actual classes used. \n\nTo apply an offset,\
    \ simply use `**col-md-offset-\\***`, remembering to replace the `**md**` with\
    \ `**xs**`, `**sm**`, or \n\n`**lg**` as needed, depending on your grid size.\
    \ \n\nNesting is done simply by nesting containers under control of the `**col-xx-\\\
    ***` classes inside each \n\nother, where they will resize and behave as they\
    \ did in previous BS versions. \n\nThe following examples show the correct way\
