    \nBy making a simple modification to code sample 37, you can easily turn the button\
    \ into a split \n\ndrop-down menu, where the action of the button remains a single\
    \ action in its own right, but still \n\nallowing the menu to appear when the\
    \ caret is clicked. \n\nTo do this, simply add another button element just before\
    \ the button element, then move the \n\ntext (but NOT the caret) from the (now)\
    \ second button into the first, so the new button tag looks \n\nlike this: \n\n\
    If you then re-render the output in your browser, you should see the following:\
    \ \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_61_0.png)\n\n`<button type=\"button\"\
    \ class=\"btn btn-success\">A dropdown button `\n\n` <button type=\"button\" class=\"\
    btn btn-success dropdown-toggle\" data-toggle=\"dropdown\"> `\n\n` <span class=\"\
    caret\"></span> `\n\n` </button> `\n\n` <ul class=\"dropdown-menu\" role=\"menu\"\
    > `\n\n` <li><a href=\"#\">1st Link</a></li> `\n\n` <li><a href=\"#\">2nd Link</a></li>\
    \ `\n\n` <li><a href=\"#\">3rd Link</a></li> `\n\n` <li class=\"divider\"></li>\
    \ `\n\n` <li><a href=\"#\">1st Link after divider</a></li> `\n\n` </ul> `\n\n\
    `</button> `\n\n` `"
