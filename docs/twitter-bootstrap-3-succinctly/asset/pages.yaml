  md: " \n\n \n\n \n\n58 \n\n \n\n*Figure 27: Output generated by code sample 34 *\n\
    \nNotice in the last code sample that I altered the button color of the drop-down\
    \ button; all you \n\nneed to do in order to achieve this is add individual button\
    \ colors on the classes for individual \n\nbuttons. This works across all button\
    \ groups and toolbars—not just when nesting them—\n\nmeaning that you can vary\
    \ the colors of the buttons in your group depending on your usage. \n\nTwo new\
    \ classes used for button layouts are the `**btn-group-vertical**` and the `**btn-group-**`\n\
    \n`**justified**` classes. \n\nIn BS2, it was very difficult to stack your buttons\
    \ vertically, or to make them take up the full width \n\nof the available space\
    \ while maintaining a balanced size. These two new classes in BS3 solve \n\nboth\
    \ of these tricky situations. Be aware, though, that to make the justified groups\
    \ work \n\ncorrectly, you need to mark your button groups with a little more markup\
    \ than you might expect. \n\nThe next code sample shows how to use vertical groups:\
