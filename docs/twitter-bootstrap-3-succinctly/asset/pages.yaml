  md: " \n\n \n\n \n\n \n\n89 \n\nIf you nest the `**<li>**`s and `**<ul>**`s inside\
    \ the media list, BS3 will automatically indent them to give \n\nthe effect of\
    \ a parent/child hierarchy. You can also use different combinations of `**pull-right**`\
    \ \n\nand `**pull-left**` where needed to position the image on the opposite side,\
    \ for example. Or, to \n\nline things up slightly differently, you can combine\
    \ them with panels (which we'll see shortly) and \n\nother similar structures\
    \ to put borders and other contextual hints around the entire list and wrap \n\
    \nthem inline to produce composite components. \n\n**Panel Changes **\n\nLike\
    \ list groups, panels are a new addition to BS3—and what an addition they are!\
    \ \n\nWe’re all familiar with things like forms, for example, being in group boxes,\
    \ or sections of a \n\nwebsite being logically divided up from each other. BS3\
    \ panels allow you to easily control this \n\nlogical separation. \n\nYou can\
    \ have plain old panels, panels with headers, panels with titles in headers, panels\
    \ with \n\nfooters, and panels with their own set of contextual colors. \n\nA\
    \ basic panel is constructed using just two `**<div>**` elements and three CSS\
    \ classes: \n\n*Code Sample 63: Basic Panel Object *\n\nHowever, it's not much\
    \ good without a title, and really as it stands in code sample 63, it's \n\nnothing\
    \ more than a `**div**` with padding and a border around it. \n\nIf we add a third\
    \ `**<div>**` element, however, and give that `**<div>**` a class of `**panel-heading**`,\
    \ then \n\nwe start to get something a bit more interesting: \n\n*Code Sample\
    \ 64: Basic Panel Object with a Panel Header *\n\n \n\n \n\n`<div class=\"panel\
    \ panel-default\"> `\n\n` <div class=\"panel-body\"> `\n\n` Panel content goes\
    \ here `\n\n` </div> `\n\n`</div> `\n\n` `\n\n`<div class=\"panel panel-default\"\
    > `\n\n` <div class=\"panel-heading\">Panel Header</div> `\n\n` <div class=\"\
    panel-body\"> `\n\n` Panel content goes here `\n\n` </div> `\n\n`</div> `\n\n\
    ` `"
  merge: -1
  pgno: 88
- img_proc: true
  md: " \n\n \n\n \n\n90 \n\n \n\n*Figure 66: Panel produced by code sample 64 *\n\
    \nYour panel header doesn't have to be just a simple `**<div>**`, either; you\
    \ can include `**<hx>**` tags \n\nalong with any other regular tag, such as an\
    \ `**<img>**`, and things will resize as required: \n\n*Code Sample 65: Panel\
    \ with an H1 Tag as a Panel Title *\n\n \n\n*Figure 67: Output produced by code\
    \ sample 65 *\n\nYou can also apply a panel footer by adding a `**<div>**` element\
    \ after your panel body and \n\napplying the class `**panel-footer**`. If you\
    \ want to give your panels meaning, you can also use \n\nthe contextual colors\
    \ that are used for everything else. You do this simply by replacing the \n\n\
    `**panel-default**` class in the previous code samples with `**panel-primary**`,\
    \ `**panel-success**`, \n\n`**panel-info**`, `**panel-warning**`, or `**panel-danger**`.\
    \ \n\n \n\n*Figure 68: Output produced by code sample 65, with the type set to\
    \ *`*panel-primary*`\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_89_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_89_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_89_2.png)\n\
    \n`<div class=\"panel panel-default\"> `\n\n` <div class=\"panel-heading\"> `\n\
    \n` <h1 class=\"panel-title\">Panel Header</h1> `\n\n` <p>Panel sub header</p>\
    \ `\n\n` </div> `\n\n` <div class=\"panel-body\"> `\n\n` <p>Panel content goes\
    \ here</p> `\n\n` <p>Panel content goes here</p> `\n\n` <p>Panel content goes\
    \ here</p> `\n\n` </div> `\n\n`</div> `\n\n` `"
  merge: -1
