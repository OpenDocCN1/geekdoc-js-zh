  md: " \n\n \n\n \n\n \n\n105 \n\n \n\n*Figure 81: Carousel produced by code sample\
    \ 78 *\n\nThere are a few more low-key JavaScript objects, but most of them are\
    \ not directly usable from \n\nnormal user code, and are generally only used in\
    \ special circumstances. The BS3 docs cover \n\neverything I've missed, and if\
    \ you're going to dig deeply into the JavaScript facilities available, a \n\n\
    long read and an understanding of how everything is hooked together is definitely\
    \ a \n\nrequirement. \n\nOne final note: BS3 JavaScript plug-ins are nothing more\
    \ than regular jQuery plug-ins (BS uses \n\njQuery under the hood). This means\
    \ that it should be very easy to take your favorite jQuery \n\nplug-in from places\
    \ like unheap.com and adapt them to work with BS3 quite easily. Don’t forget \n\
    \nthere is still a huge number of add-ons available out there already, especially\
    \ to be used with \n\nthe framework, most of which are only a Google search away.\
    \ \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_104_0.png)"
