  md: " \n\n \n\n \n\n \n\n61 \n\n \n\n***Note: One of the new features that the HTML\
    \ 5 specification brings to the table is something ***\n\n***called data attributes.\
    \ BS3 (and for that matter BS2) uses these attributes in many different ***\n\n\
    ***places to allow elements and JavaScript functions to be joined together without\
    \ the ***\n\n***developer ever having to write a single line of JavaScript. Data\
    \ attributes always take the ***\n\n***form of ***`***data-name***`***, where\
    \ ******name****** is the name the developer wishes to assign to that ***\n\n\
    ***attribute. Using ***`***data-***`*** ensures that the attributes you define\
    \ will never interfere with ***\n\n***anything the WHATWG standards body adds\
    \ to the spec, giving developers utmost ***\n\n***flexibility in what they wish\
    \ to use them for. ***\n\n***In most cases, these data attributes are used the\
    \ way BS3 uses them: in order to pass ***\n\n***information from the element into\
    \ the JavaScript routines working on it. They can be used ***\n\n***to pass in\
    \ ID names, options, parameters for sizes, and many other things, meaning that\
    \ ***\n\n***you often don't actually have to write any boilerplate code in your\
    \ app. Throughout this ***\n\n***chapter, you'll be introduced to many more of\
    \ these data attributes. ***\n\nIn order for the drop-down buttons to work, you\
    \ MUST have the drop-down JavaScript plug-in \n\nadded to your BS3 build. If you've\
    \ just downloaded the default set, then this won't be a problem, \n\nas `**dropdown.js**`\
    \ is already part of the main `**bootstrap.js**` file. If you've done a custom\
    \ build, or \n\neven compiled from the Less sources yourself, you'll need to make\
    \ sure it's present. \n\nThe following code shows a basic drop-down button example:\
    \ \n\n*Code Sample 37: Dropdown Button Example *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_60_0.png)\n\
    \n`<div class=\"btn-group\"> `\n\n` <button type=\"button\" class=\"btn btn-success\
    \ dropdown-toggle\" data-`\n\n`toggle=\"dropdown\"> `\n\n` A dropdown button <span\
    \ class=\"caret\"></span> `\n\n` </button> `\n\n` <ul class=\"dropdown-menu\"\
    \ role=\"menu\"> `\n\n` <li><a href=\"#\">1st Link</a></li> `\n\n` <li><a href=\"\
    #\">2nd Link</a></li> `\n\n` <li><a href=\"#\">3rd Link</a></li> `\n\n` <li class=\"\
    divider\"></li> `\n\n` <li><a href=\"#\">1st Link after divider</a></li> `\n\n\
    ` </ul> `\n\n`</div> `\n\n` `"
