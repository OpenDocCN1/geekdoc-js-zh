  md: " \n\n \n\n \n\n \n\n9 \n\n**Introduction **\n\nWelcome to the second book in\
    \ the *Succinctly* series that covers the Twitter Bootstrap (BS) UI \n\nand CSS\
    \ framework. \n\nIn my first book, I laid down the initial groundwork and got\
    \ you started with Bootstrap 2. \n\nSince that book was released, however, Bootstrap\
    \ 3 has become the mainstream version. \n\nIn this book we're going to continue\
    \ to build on that groundwork and move forward into using BS \n\nv3. We'll look\
    \ to see where things are different, and as we explore the new features, we'll\
    \ see \n\nthat a big chunk of what was present in v2 is still applicable to v3.\
    \ \n\nIf you've not yet read the first book on Bootstrap 2, then I encourage you\
    \ to do so, as I will be \n\nreferring to it at various points throughout this\
    \ book. \n\nThe style and layout in this book will also be slightly different\
    \ from the first one, in that it will be \n\nmore of an extension to the first\
    \ book rather than an independent book in its own right. \n\nWhy? I believe that\
    \ in order to understand the entire Bootstrap landscape, you need to examine \n\
    \nit from the beginning. You need to be able to understand what it set out to\
    \ achieve and how. \n\nYou will be able to pick up just this book and learn the\
    \ basics of BS v3, but you'll get a much \n\ndeeper, better understanding if you\
    \ read the v2 book first. \n\n**What's Changed **\n\nSo what's changed from v2\
    \ to v3? \n\nQuite a lot. \n\nThe major change between the two versions is that\
    \ v3 is now \"Mobile First.\" Bootstrap v2 was a \n\nresponsive layout CSS kit,\
    \ but its mobile and responsive features were always second place to \n\nits rich\
    \ UI features. In fact, in order to make the responsive stuff work correctly,\
    \ you had to \n\ninclude a second CSS file whose sole purpose was to enable the\
    \ responsive, mobile features \n\nand nothing else. \n\nIn v3 this whole situation\
    \ has been completely reversed. The entire framework is now mobile-\n\nfriendly\
    \ and responsive out of the box, and it now takes extra work to adapt your layouts\
    \ for \n\nlarger screen formats. Don't get me wrong—it's by no means a huge amount\
    \ of work. Most of \n\nwhat you need to change is still just simply swapping classes\
    \ about and structuring your HTML \n\nmark-up correctly. \n\nThe other major change\
    \ is in the naming of classes and API calls. Many of the class names that \n\n\
    were introduced in v2 are now either deprecated or have been renamed to something\
    \ more \n\nsuitable to their intended purpose."
  merge: -1
  pgno: 8
- img_proc: true
  md: " \n\n \n\n \n\n10 \n\nThere has also been a major effort to rename classes\
    \ to be more consistent. For example, in \n\nv2, for items that targeted the RED\
    \ error color, we had the following classes: \n\n \n\nButtons - `**btn-danger**`\
    \ \n\n \n\nText - `**text-error**` \n\n \n\nTable Rows - `**tr.error**` \n\n\
     \n\nLabels - `**.important**` \n\n \n\nBadges - `**.important **`\n\n \n\n\
    Alerts - `**.error**` \n\n \n\nProgress Bars - `**progress-danger**` \n\nNow,\
    \ in v3, these have be consolidated so that naming is similar across all components\
    \ as \n\nfollows: \n\n \n\nButtons - `**btn-danger**` \n\n \n\nText - `**text-danger**`\
    \ \n\n \n\nTable Rows - `**.danger**` \n\n \n\nLabel, Badge, Alert - `**.danger**`\
    \ \n\n \n\nProgress Bars - `**progress-bar-danger**` \n\nAs you can see, consistency\
    \ is now a major player in the v3 classes, and many other similar \n\nchanges\
    \ have been made across the entire framework. \n\nThere have been quite a few\
    \ minor changes too. For example, the box-model used by Bootstrap \n\nhas now\
    \ been improved considerably, with all elements now using `**border-box**` as\
    \ the default \n\nCSS box sizing model. \n\nThe grid system has been extended\
    \ and improved too, and instead of being one monolithic grid \n\nsystem with optional\
    \ classes, it’s now comprised of four tiers of grid sizes specifically aimed at\
    \ \n\nphones, tablets, desktops, and large desktops. \n\nAll the JavaScript stuff\
    \ has also now been name-spaced to reduce conflict with other JavaScript \n\n\
    code; the available events are now better named to reflect their purpose and are\
    \ much more \n\nclearly documented. \n\n`**Modals**` and `**Navbars**` have been\
    \ vastly improved in terms of responsiveness, and along with the \n\nclass-naming\
    \ changes, the sizing classes for all of the components (Inc Nav Modals) have\
    \ now \n\nbeen aligned. \n\nComponent-wise, some of the older, less frequently\
    \ used components have been deprecated \n\nand removed, the most notable of which\
    \ is the `**Accordion**` component. But don’t despair—the \n\naccordion has been\
    \ replaced with a brand new `**collapsible-panel**` component that's much \n\n\
    more flexible than its predecessor. \n\nWe also have a new, narrow `**jumbotron**`,\
    \ new `**panel**` types, list groups, and much more. \n\nFinally, the one change\
    \ that EVERYONE will notice is the look and feel: **TWB V3 is flat**. It has a\
    \ \n\nsingle colored, new interface, but with rounded corners flat."
  merge: -1
