  md: " \n\n \n\n \n\n12 \n\nBower is an HTML scaffolding and package system designed\
    \ to automate much of the \n\napplication boiler plate. You don’t need to understand\
    \ it to understand BS v3, but a quick \n\nGoogle search for “Bower” will turn\
    \ up many references to deepen your understanding. \n\nOn a similar note, BS v3\
    \ can also be installed using the NuGet package manager if you’re \n\nworking\
    \ in Visual Studio. Like Bower, this will automate much of the process for installing\
    \ and \n\nsetting up the required files. Be careful though—there are many Bootstrap\
    \ packages available \n\nin NuGet, some of which will cause you more work than\
    \ they save you. \n\nFinally, the TWB customizer is still available at http://getbootstrap.com/customize/.\
    \ It’s been \n\ngreatly restructured and rebuilt to provide more options and an\
    \ easier, more intuitive look at \n\nwhat you’re changing and why. \n\nIn fact,\
    \ it's now so easy to change things using the customizer that your designer or\
    \ design \n\nteam can do 90 percent of the work needed to set the colors and branding\
    \ of your download \n\nbefore the files required are even downloaded. This enables\
    \ your design department to start \n\nmaking color and layout choices immediately,\
    \ while you work on the page layouts and additional \n\ncode for the required\
    \ interactivity. Then, all that’s required is for you to simply replace your \n\
    \ndefault files with the files provided to you by your designers, and an instant\
    \ theme change \n\nshould occur. \n\n**Device Support **\n\nOfficially, BS v3\
    \ only supports the latest round of HTML 5-compliant browsers and Internet \n\n\
    Explorer 10 and above. \n\nIn reality, the framework also supports IE8 and IE9;\
    \ however, there are some features of CSS3 \n\nand HTML5 that don't quite work\
    \ as expected. In particular, if you want the responsive elements \n\nto work\
    \ correctly, you'll need to use `**respond.js**`, which you can download from\
    \ the following \n\nGitHub repository: https://github.com/scottjehl/Respond. \n\
    \nOnce you add `**respond**` to your project, it's basically just a general expectation\
    \ to what was and \n\nwas not added to the various browsers, at various times.\
    \ \n\nThe parts that will be most noticed as missing are as follows: \n\nFor IE8:\
    \ \n\n`**border-radius**` is NOT supported \n\n`**box-shadow**` is NOT supported\
    \ \n\n`**transform**` is NOT supported \n\n`**transition**` is NOT supported \n\
    \n`**placeholder**` text is NOT supported"
  merge: -1
  pgno: 11
- img_proc: true
  md: " \n\n \n\n \n\n \n\n13 \n\nThis essentially means that placeholder text in\
    \ input elements won't show, and anything that \n\nuses rounded corners or drop\
    \ shadows, or has any kind of transition or transformation on the \n\nelement,\
    \ won't display correctly. \n\nFor IE9: \n\n`**border-radius**` IS supported \n\
    \n`**box-shadow**` IS supported \n\n`**transform**` IS supported (but only with\
    \ `**\\-ms**` prefix) \n\n`**transition**` is NOT supported \n\n`**placeholder**`\
    \ text is NOT supported \n\nThings are slightly improved where IE9 is concerned—rounded\
    \ corners and drop shadows are \n\nnow fine, and transformations will also work,\
    \ as long as they also have a -`**ms**` prefix version. \n\nTransitions and placeholders\
    \ on the input elements, however, are still sadly missing. \n\nThe official support\
    \ matrix for the current version of BS3 in current browsers looks like this: \n\
    \n***Table 1: Official support matrix ***\n\n \n\n**Chrome **\n\n**Firefox **\n\
    \n**IE **\n\n**Opera **\n\n**Safari **\n\n**Android **Yes \n\nNo \n\n \n\nNo \n\
    \n \n\n**iOS **Yes \n\n \n\n \n\nNo \n\nYes \n\n**Mac OS X **Yes \n\nYes \n\n\
    \ \n\nYes \n\nYes \n\n**Windows **Yes \n\nYes \n\nYes \n\nYes \n\nNo \n\nIf you\
    \ are targeting IE9 and IE8, and are using `**respond.js**` to support those efforts,\
    \ then please \n\nbe aware of the following points: \n\nYou will need to refer\
    \ to the `**respond.js**` docs if you’re hosting CSS, etc. on a different domain\
    \ \n\n(for example a CDN) to mitigate cross-domain problems. \n\nBrowser security\
    \ will cause you problems with `**file://**` and `**@import**` based resource\
    \ \n\nreferences. \n\nSpecific to `**@import**` is that `**respond.js**` cannot\
    \ read the rules properly, which is important to \n\nDrupal users, as Drupal uses\
    \ `**@import**` quite heavily. \n\nOlder IE compatibility modes will stop Bootstrap\
    \ from working completely, not just with \n\n`**respond.js**`, so be careful if\
    \ you’re testing for backwards compatibility using a modern IE in \n\nemulation\
    \ mode—the results will most likely NOT be what you expect."
