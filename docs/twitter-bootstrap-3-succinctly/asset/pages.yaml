  md: " \n\n \n\n \n\n78 \n\n \n\n*Figure 53: Output produced by code sample 50 *\n\
    \nBadges, on the other hand, have undergone a bigger change. \n\nIn BS3, badges\
    \ no longer have contextual color classes. That is, there is no longer a `**label-**`\n\
    \n`**success**` or `**label-warning**`, as there is with the previous labels and\
    \ with other elements. \n\nThis means you can't color badges in the same way you\
    \ could in BS2, and any label you create \n\ncan only be rendered using the standard\
    \ grey color. Well, at least officially you can't. \n\nIf you apply an `**alert-xxxxx**`\
    \ alongside a `**label**` class on the `**<span>**` being used for your label,\
    \ \n\nthen the label will take on the coloring of that alert class, and while\
    \ this is not a supported way of \n\ndoing things, it does work, and allows you\
    \ to use the labels as you did in BS2. \n\nTo mark up a standard label, all you\
    \ need to do is add a `**label and 'label-default'**` class to \n\na `**<span>**`,\
    \ and you’re ready to go: \n\n*Code Sample 51: Standard Label Example *\n\n \n\
    \n*Figure 54: Label produced by code sample 51 *\n\nIf you want to hack your labels\
    \ to use the different colors, then you can do so as follows: \n\n*Code Sample\
    \ 52: Label Example Hacked to Use Non-Standard Coloring *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_77_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_77_1.png)\n\
    \n`<h2><span class=\"label label-primary\">Primary</span></h2> `\n\n`<h3><span\
    \ class=\"label label-success\">Success</span></h3> `\n\n`<h4><span class=\"label\
    \ label-info\">Info</span></h4> `\n\n`<h5><span class=\"label label-warning\"\
    >Warning</span></h5> `\n\n`<h6><span class=\"label label-danger\">Danger</span></h6>``\
    \ `\n\n`<span class=\"label label-default\">This is a label</span> `\n\n` `\n\n\
    `<span class=\"badge\">Normal</span> `\n\n`<span class=\"badge alert-success\"\
    >Success</span> `"
