  md: " \n\n \n\n \n\n38 \n\nIf you render the code from this example in your browser,\
    \ it should look like the following: \n\n \n\n*Figure 9: Output displayed from\
    \ code sample 20 showing our form marked up as horizontal. *\n\nAs you can see\
    \ from the code in sample 20, the extra markup is not really that much more, and\
    \ \n\nmost of it exists just to line up the columns correctly so that everything\
    \ sits nicely. \n\nThe main points to be aware of in sample 20 are: \n\n1\\. All\
    \ label controls now have a class of `**control-label**` added. This is not required\
    \ for the \n\nother form types, and BS2 will simply ignore it. \n\n2\\. Any input\
    \ control that will likely render as a block-level element is now wrapped in a\
    \ parent \n\n`**<div>**` in order to control its width using the grid system.\
    \ \n\n3\\. The extra class for `**form-horizontal**` is applied to the outer-most\
    \ form tag. \n\nFor the rest of the classes and associated parts in the forms\
    \ section of BS3, nothing else \n\nbeyond the classes mentioned so far has changed.\
    \ However, from an actual application point of \n\nview, input controls now MUST\
    \ have a correct type on them to be styled. This means at a \n\nminimum you must\
    \ have at least `**type=\"text\" **`for BS3 to do its magic. \n\nIt’s highly recommended\
    \ that you do use the correct types, however. As you'll see soon when \n\nwe get\
    \ to validation groups, having the correct type will allow most of the validation\
    \ stuff to \n\nactually work correctly without making any changes to your markup.\
    \ \n\nCheck boxes and radio buttons, as in BS2, are stacked by default. If you\
    \ wish to have them \n\nrender vertically across the screen, you need to use the\
    \ `**checkbox-inline**` and `**radio-inline**` \n\nclasses as follows: \n\n*Code\
    \ Sample 21: Inline Check Box and Radio Buttons in BS3 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_37_0.png)\n\
    \n` <button type=\"submit\" class=\"btn btn-default\">Sign in</button> `\n\n`\
    \ </div> `\n\n` </div> `\n\n`</form> `\n\n` `\n\n`<div class=\"row\"> `\n\n` `\n\
    \n` <label class=\"checkbox-inline\"> `\n\n` <input type=\"checkbox\" id=\"inlineCheckbox1\"\
    \ value=\"option1\"> 1 `\n\n` </label> `"
