  md: " \n\n \n\n \n\n104 \n\nTypically, the carousel plug-in is used at the top of\
    \ a page to provide a rotating banner of \n\nimages, and in BS2, this was the\
    \ only thing that the carousel could be used for. In BS3, \n\nhowever, any content\
    \ that can be placed inside the carousel’s panels will be rotated, including \n\
    \nimages, text, svg, and much more. \n\nThe following code shows a basic example\
    \ of how to construct a carousel: \n\n*Code Sample 78: BS3 Carousel *\n\n`<div\
    \ id=\"carousel-example-generic\" class=\"carousel slide\" data-ride=\"carousel\"\
    > `\n\n` <ol class=\"carousel-indicators\"> `\n\n` <li data-target=\"#carousel-example-generic\"\
    \ data-slide-to=\"0\" `\n\n`class=\"active\"></li> `\n\n` <li data-target=\"#carousel-example-generic\"\
    \ data-slide-to=\"1\"></li> `\n\n` <li data-target=\"#carousel-example-generic\"\
    \ data-slide-to=\"2\"></li> `\n\n` </ol> `\n\n` <div class=\"carousel-inner\"\
    > `\n\n` <div class=\"item active\"> `\n\n` <img data-src=\"holder.js/1140x500/sky\"\
    \ /> `\n\n` <div class=\"carousel-caption\"> `\n\n` <h3>You and I are beings of\
    \ the planet</h3> `\n\n` <p>Spacetime is a constant. Will requires exploration</p>\
    \ `\n\n` </div> `\n\n` </div> `\n\n` <div class=\"item\"> `\n\n` <img data-src=\"\
    holder.js/1140x500/vine\" /> `\n\n` <div class=\"carousel-caption\"> `\n\n` <h3>Nothing\
    \ is impossible</h3> `\n\n` <p>Stardust requires exploration. You and I are storytellers\
    \ of the `\n\n`cosmos</p> `\n\n` </div> `\n\n` </div> `\n\n` <div class=\"item\"\
    > `\n\n` <img data-src=\"holder.js/1140x500/lava\" /> `\n\n` <div class=\"carousel-caption\"\
    > `\n\n` <h3>You and I are beings of the planet</h3> `\n\n` <p>Spacetime is a\
    \ constant. Will requires exploration</p> `\n\n` </div> `\n\n` </div> `\n\n` </div>\
    \ `\n\n` <a class=\"left carousel-control\" href=\"#carousel-example-generic\"\
    \ data-`\n\n`slide=\"prev\"> `\n\n` <span class=\"glyphicon glyphicon-chevron-left\"\
    ></span> `\n\n` </a> `\n\n` <a class=\"right carousel-control\" href=\"#carousel-example-generic\"\
    \ data-`\n\n`slide=\"next\"> `\n\n` <span class=\"glyphicon glyphicon-chevron-right\"\
    ></span> `\n\n` </a> `\n\n`</div> `\n\n` `"
