  md: " \n\n \n\n \n\n28 \n\n*Code Sample 12: Header and Body Text Example *\n\nWhen\
    \ rendered in your browser, it should look like the following: \n\n \n\n*Figure\
    \ 1: The output from code sample 12 *\n\nThe `**<small>**` tag can now also be\
    \ used on its own too, as its styling is now correctly handled \n\nand applied\
    \ in the context in which it's used, so its styling will follow its position in\
    \ the document \n\nno matter what the parent tag. \n\nSimilarly, bold text is\
    \ still created using the `**<strong>**` tag and italics using the `**<em>**`\
    \ tag; as with \n\nmany of the typography classes, this is no different to the\
    \ v2 framework. \n\nThe alignment classes also maintain their same class names\
    \ of `**text-left**`, `**text-center**`, \n\n`**text-right**`, and `**text-justify**`,\
    \ and still perform the same functions as described in the BS2 \n\nbook that precedes\
    \ this one. \n\nLikewise, abbreviations are still created using the `**<abbr>**`\
    \ tag with the `**title**` attribute acting as \n\nthe full description of the\
    \ abbreviation. There is one new class, `**initialism**`, that can be added \n\
    \nto an abbreviation tag and gives the rendered output a slightly smaller look\
    \ and feel than the \n\nsurrounding text. \n\nAddresses (using the `**<address>**`\
    \ tag) and block-quotes (using the `**<blockquote>**` tag) also \n\nhave no changes\
    \ in the CSS or base rules between v2 and v3 of the framework. \n\nThe final few\
    \ tags that remain in the typographic category include `**<code>**`, used to create\
    \ an \n\ninline code sample. Again, this has not changed in any way, with its\
    \ intended use still being for \n\ncode samples that sit in line with regular\
    \ body text. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_27_0.png)\n\n`<div class=\"\
    container\"> `\n\n` <div class=\"page-header\"> `\n\n` <h1>This is my super webpage\
    \ <small>It's the best there is</small></h1> `\n\n` </div> `\n\n` `\n\n` `\n\n\
    ` <p class=\"lead\">Welcome to my super-duper webpage, there's no other webpage\
    \ like it `\n\n`in the whole world, my page is the best thing on the Internet\
    \ that you should `\n\n`visit</p> `\n\n` <p>On this fantastic page I have text\
    \ and some more text, and there's even some `\n\n`text for you to read, as well\
    \ as a nice looking page title</p> `\n\n`</div> `\n\n` `"
