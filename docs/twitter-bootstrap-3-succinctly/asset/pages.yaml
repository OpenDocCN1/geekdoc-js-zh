- img_proc: true
  md: " \n\n \n\n \n\n68 \n\nIn fairness, though it wasn't really designed to work\
    \ that way: tabs generally run left to right, and \n\nwhile BS2 did have some\
    \ classes for putting tabs on the side and along the bottom of elements, \n\n\
    these have been removed in BS3. The JavaScript plug-in for making full, tab-based\
    \ outputs still \n\nhas the ability to position the tabs, but the general navigation\
    \ no longer does. \n\nAs with the changes made in the button components, the navigation\
    \ aids also now have a new \n\njustified class added to them, called `**nav-justified**`,\
    \ and just as with the button version, it will \n\ncause a navigation class to\
    \ span the full width of a container, giving each sibling an equal size. \n\n\
    If we take the code in sample 40 and add `**nav-justified**` to the two classes\
    \ already there, we \n\nget the following result: \n\n \n\n*Figure 38: Navigation\
    \ tabs from code sample 40 with full-width justification applied *\n\nThe navigation\
    \ aids have another thing in common with the button classes and components: the\
    \ \n\nstate-based changes, which are used to show a given state, as well as the\
    \ ability to take drop-\n\ndown menus and sub navigation. \n\nSimply adding a\
    \ class of `**disabled**` to the `**<li>**` inside a navigation set will disable\
    \ and dim that \n\nlink with the `**muted-text**` look. Remember though, it does\
    \ not actually disable the link—the link \n\nwill still be clickable, and it’s\
    \ up to you to code things so the link does not react. \n\nTo add a drop-down\
    \ menu to any pill- or tab-based navigation item, just use the same layout \n\n\
    and classes as shown in the section on buttons. Nest an `**<a>**` inside an `**<li>**`,\
    \ followed by \n\nanother `**<ul>**`, with the appropriate classes and data attributes\
    \ to make it all work. \n\nIn a bit of a cross-over between the basic navigation\
    \ and navigation bars, we also have \n\nbreadcrumbs and page/pagination navigation\
    \ aids. \n\nBreadcrumbs are typically used to mark your position in a site’s hierarchy,\
    \ and as we've seen \n\nabove, using them is simply a case of adding them to an\
    \ unordered list, as the following code \n\nshows: \n\n*Code Sample 41: BS3 Breadcrumb\
    \ Navigation Example *\n\n \n\n*Figure 39: Output produced by code sample 41 *\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_67_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_67_1.png)\n\
    \n`<ul class=\"breadcrumb\"> `\n\n` <li><a href=\"#\">Home</a></li> `\n\n` <li><a\
    \ href=\"#\">Library</a></li> `\n\n` <li class=\"active\">Data</li> `\n\n`</ul>\
    \ `\n\n` `"
  merge: -1
  pgno: 67
- img_proc: true
  md: " \n\n \n\n \n\n \n\n69 \n\nThe final controls, before we move onto full navigation\
    \ bars, are the pagination controls. These \n\ncontrols take a huge amount of\
    \ the grunt work out of lining up a bar with previous/next and \n\nbefore/after,\
    \ and a sequence of numbers in the middle. \n\nTypically used where you have a\
    \ data-heavy site and want to display records one page at a \n\ntime, rather than\
    \ all at once, pagination bars are both simple to use and easy to line up with\
    \ the \n\nrest of your output. \n\nJust as with the other basic elements, creating\
    \ pagination bars is as simple as adding the \n\nappropriate classes to an unordered\
    \ list, as the following code shows: \n\n*Code Sample 42: BS3 Pagination Bar *\n\
    \n \n\n*Figure 40: Output produced by code sample 42 *\n\nJust as with the other\
    \ basic navigation aids, applying `**active**` and `**disabled**` classes where\
    \ \n\nneeded to individual `**<li>**` elements within the list enables you to\
    \ mark links as disabled and \n\nselected. \n\n \n\n*Figure 41: Output produced\
    \ by code sample 42 with active and disabled classes added *\n\nPagination controls\
    \ can be sized just as easily as the other controls using the new sizing \n\n\
    options, and like the others, they now all follow the same naming scheme: `**pagination-lg**`\
    \ and \n\n`**pagination-sm**`. As with some of the others, there is no `**pagination-xs**`,\
    \ and no hint that there \n\nshould be one; likewise there's no `**\\-md**` size\
    \ either, since medium is the default. \n\nTo use the pagination controls, just\
    \ add the appropriate sizing class alongside the pagination \n\nclass on the parent\
    \ `**<ul>**` holding the list, as the following code shows: \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_68_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_68_1.png)\n\
    \n`<ul class=\"pagination\"> `\n\n` <li><a href=\"#\">&laquo;</a></li> `\n\n`\
    \ <li><a href=\"#\">1</a></li> `\n\n` <li><a href=\"#\">2</a></li> `\n\n` <li><a\
    \ href=\"#\">3</a></li> `\n\n` <li><a href=\"#\">4</a></li> `\n\n` <li><a href=\"\
    #\">5</a></li> `\n\n` <li><a href=\"#\">&raquo;</a></li> `\n\n`</ul> `\n\n` `"
