  md: " \n\n \n\n \n\n \n\n29 \n\nFor code samples (or anything that is plain text)\
    \ that must remain formatted as per indentation \n\nand carriage returns, you\
    \ should still use the `**<pre>**` tag; again the styling here has not changed\
    \ \n\nfrom v2, and layout using this tag should still behave as expected. \n\n\
    The final typographic element is the addition of a new element called `**<kbd>**`.\
    \ \n\nThe purpose of this new tag is to display text in a way that indicates the\
    \ user should enter the \n\ninformation into the computer in some way, generally\
    \ by typing it. \n\nFor example: \n\n*Code Sample 13: '<kbd>' Tag Example *\n\n\
    Which when rendered in an HTML document, should look something like the following:\
    \ \n\n \n\n*Figure 2: Output produced by code sample 13 *\n\n**List Changes **\n\
    \nIn general, the normal list elements made up of `**<ul>,**` `**<ol>**`, and\
    \ `**<dl>**` elements have not \n\nchanged; the layout is still as it was in BS2,\
    \ with no extra classes being needed. Note also that \n\nthe `**list-unstyled**`,\
    \ `**list-inline**` along with the `**dl-horizontal**` classes for definition\
    \ lists \n\nalso remain unchanged in BS3, and have the same behavior as in BS2.\
    \ \n\nThere are some changes in the list elements however, but since these occur\
    \ with the specialist \n\nclasses used to create menus and navigation lists, we'll\
    \ be covering those when we address the \n\nchanges to the navigation elements\
    \ in the next chapter. \n\n**Table Changes **\n\nTables are still styled just\
    \ as they were in BS2 by creating a standard `**<table>**` arrangement, \n\nthen\
    \ adding a `**table**` class to the markup. As in BS2, tables should always be\
    \ constructed using \n\nthe full range of `**<table>**`, `**<thead>**`, and `**<tbody>**`\
    \ HTML elements as the following example \n\nshows: \n\n*Code Sample 14: Marking\
    \ Up a Table to Be Used by Bootstrap *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_28_0.png)\n\
    \n`<p>Open up a command prompt by typing <kbd>cmd</kbd> into the box and clicking\
    \ on the `\n\n`button market 'Run', when it opens type in <kbd>myprogram</kbd>\
    \ and press enter, at `\n\n`which point the app should run</p> `\n\n` `\n\n`<table\
    \ class=\"table\"> `\n\n` <thead> `"
