  md: " \n\n \n\n \n\n110 \n\n**Closing Notes **\n\nWell that’s it folks, that’s all\
    \ I have for this book. I knew when I started writing the BS2 guide that \n\n\
    it wouldn't be too long before BS3 went mainstream. It took a little longer than\
    \ expected to get it \n\nout into the wild, but when it was released, it was met\
    \ with so much enthusiasm that I knew I \n\nsimply had to start a follow-up covering\
    \ BS3 straightaway. \n\nAfter a brief discussion with the marketing team at Syncfusion\
    \ (Hi guys!), we decided that the \n\nway forward was to try and get this written\
    \ in about a month, and by and large I did it. What you \n\nyou’re seeing now\
    \ did not exist at the beginning of May 2014, and was nothing more than a few\
    \ \n\nscribbled down ideas on the notepad on my desk. \n\nIf you'd like to reach\
    \ out and ask me any questions about the book, I can generally be found \n\nhanging\
    \ about on twitter as @shawty\\_ds. You can also generally find me on LinkedIn,\
    \ or in the \n\nLinked.NET (Lidnug) users group that I help run there. \n\nI hope\
    \ you enjoy this book and that it helps you become a better developer using Bootstrap\
    \ 3. In \n\nthis new world of responsive web design, BS3 is a framework that shouldn't\
    \ be taken lightly—it \n\nrepresents a lot of research by one of the biggest social\
    \ media companies in existence, and is \n\nused to power most of their public-facing\
    \ sites. \n\nUntil next time, keep calm and carry on bootstrapping."
