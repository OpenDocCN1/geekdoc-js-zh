  md: " \n\n \n\n \n\n \n\n39 \n\nRendering sample 21 in your browser should look\
    \ something like the following: \n\n \n\n*Figure 10: Output produced by sample\
    \ 21 *\n\nSelect and multi-select boxes are marked up with standard styles just\
    \ by using the elements as \n\nthey stand; this is no change from BS2, where the\
    \ markup and style of these elements is \n\nidentical. \n\nOne new style that\
    \ has been introduced in BS3 is the static control style. In BS2, you often had\
    \ \n\nto use a disabled form control to represent static form data that could\
    \ not be changed. BS3 \n\nchanges this by providing a `**form-control-static**`\
    \ class that can be applied to individual \n\ncontrols in place of the regular\
    \ `**form-control**`, as the following code shows: \n\n*Code Sample 22: How to\
    \ Create a Static Input Component in BS3 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_38_0.png)\n\
    \n` <label class=\"checkbox-inline\"> `\n\n` <input type=\"checkbox\" id=\"inlineCheckbox2\"\
    \ value=\"option2\"> 2 `\n\n` </label> `\n\n` <label class=\"checkbox-inline\"\
    > `\n\n` <input type=\"checkbox\" id=\"inlineCheckbox3\" value=\"option3\"> 3\
    \ `\n\n` </label> `\n\n`</div> `\n\n`<div class=\"row\"> `\n\n` <label class=\"\
    radio-inline\"> `\n\n` <input type=\"radio\" id=\"inlineRadio\" value=\"option1\"\
    > 1 `\n\n` </label> `\n\n` <label class=\"radio-inline\"> `\n\n` <input type=\"\
    radio\" id=\"inlineRadio\" value=\"option2\"> 2 `\n\n` </label> `\n\n` <label\
    \ class=\"radio-inline\"> `\n\n` <input type=\"radio\" id=\"inlineRadio\" value=\"\
    option3\"> 3 `\n\n` </label> `\n\n`</div> `\n\n` `\n\n`<form class=\"form-horizontal\"\
    \ role=\"form\"> `\n\n` <div class=\"form-group\"> `\n\n` <label class=\"col-sm-2\
    \ control-label\">Email</label> `\n\n` <div class=\"col-sm-10\"> `\n\n` <p class=\"\
    form-control-static\">email@example.com</p> `\n\n` </div> `\n\n` </div> `\n\n\
    ` <div class=\"form-group\"> `\n\n` <label for=\"inputPassword\" class=\"col-sm-2\
    \ control-label\">Password</label> `\n\n` <div class=\"col-sm-10\"> `\n\n` <input\
    \ type=\"password\" class=\"form-control\" id=\"inputPassword\" `\n\n`placeholder=\"\
    Password\"> `"
