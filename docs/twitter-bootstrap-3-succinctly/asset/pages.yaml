  md: " \n\n \n\n \n\n14 \n\n**Chapter 1 Migrating from Version 2 to **\n\n**Version\
    \ 3 **\n\nSo what's involved in migrating from Bootstrap 2 to Bootstrap 3? In\
    \ truth, not a great deal. \n\nDespite the many changes, there's still not a huge\
    \ amount for you to actually change, and the \n\nchanges you do need to make are\
    \ generally just class renames where applicable. \n\nOne of the things you might\
    \ want to do, especially if you've been using BS only for general web \n\napp\
    \ development and not mobile or any kind of responsive design, is to disable the\
    \ responsive \n\nfeatures in BS3. \n\nThis is easy enough to do, but not at all\
    \ recommended. \n\nYou can achieve this as follows: \n\n \n\nDo not add the `**meta**`\
    \ tag containing the device width and other initial sizing info to the \n\nhead\
    \ of your document. \n\n \n\nDo override the `**width**` on your elements that\
    \ are marked up with a class of `**container**`, \n\nand make sure you use `**style='width:\
    \ xxx !important'**` when you do so. \n\n \n\nDo make sure that any width overrides\
    \ are processed AFTER the main Bootstrap CSS \n\nrules have been loaded. \n\n\
     \n\nDo remove ALL collapsing and expanding behaviors and rules from ALL `**navbar**`\
    \ \n\nconstructs within your document. \n\n \n\nDo change all grid layout classes\
    \ to use ONLY `**col-xs-\\***` classes and none of the other \n\nfour levels.\
    \ \n\nIf you’re targeting IE8 and IE9, you will still need to make sure you use\
    \ `**respond.js**`, even if you \n\ndo disable responsiveness as outlined. \n\n\
    **Class Changes **\n\nAs I mentioned earlier, there have been many class name\
    \ changes between the two versions, \n\nand many classes have been deprecated\
    \ and withdrawn. \n\nOne thing that will (and already has if you look at Stack\
    \ Overflow) come as a surprise to many is \n\nthe withdrawal of the fluid width\
    \ classes. \n\nIn version 2, if you wanted a full-width elastic container, then\
    \ you had to do something like the \n\nfollowing:"
