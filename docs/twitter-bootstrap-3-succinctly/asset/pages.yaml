  md: " \n\n \n\n \n\n22 \n\nFirst we'll start with what's been removed where forms\
    \ are concerned, and unfortunately, that's \n\nquite a lot. We no longer have\
    \ a specific type for a search form `**form-search**`, and the shaded \n\nbar\
    \ typically found at the foot of a form `**form-actions**` has also been deprecated\
    \ in v3. \n\nAlso gone is the class typically used to display validation errors,\
    \ `**control-group-info**`, and its \n\nhelp counterpart, `**help-inline**`. None\
    \ of these four classes have any recommended \n\nreplacement in the v3 code base,\
    \ meaning that to construct equivalents of them, you will need \n\nto use other\
    \ elements and classes where applicable. \n\nContinuing with forms, the main `**controls**`\
    \ class used to wrap entire control sets is gone, along \n\nwith `**controls-row**`.\
    \ Instead, you are advised to use `**row**` or the new `**form-group**` class.\
    \ Forms \n\nhave also lost most of the sizing classes; the fixed-size classes\
    \ such as `**input-mini**`, `**input-**`\n\n`**small**`, `**input-medium**`, `**input-large**`,\
    \ `**input-xlarge**`, and `**input-xxlarge**` have now all gone \n\naway, along\
    \ with the block level control class `**input-block-level**`. Instead, you are\
    \ now \n\nadvised to control your form element sizes using `**form-control**`\
    \ in combination with the new \n\nsizes and layouts available in the grid system.\
    \ \n\nFrom an individual control point of view, the `**inverse**` classes have\
    \ been removed from buttons \n\nand other similar controls, and we've also lost\
    \ the `**dropdown-submenu**` class in favor of just \n\nusing split drop-down\
    \ buttons to create the same functionality. \n\nFor tabs, the `**tabs-left**`,\
    \ `**tabs-right**`, and `**tabs-below**` classes no longer exist, which means\
    \ \n\nwe now only have the ability to put tabs at the top of the content, left-aligned.\
    \ \n\nStaying with tabs, the class to work with content in a pill-based tab setup\
    \ has also been \n\nremoved, meaning that `**pill-pane**` & `**pill-content**`\
    \ should now use the general `**tab-content**` \n\n& `**tab-pane**` classes. \n\
    \nFinally, the various `**navbar**` classes are not without casualties: `**navbar-inner**`,\
    \ `**navbar **`\n\n`**divider-vertical**`. `**nav-list**`, and `**nav-header**`\
    \ are no longer part of the framework. \n\nIn most cases, there are no direct\
    \ equivalents in v3 for these classes, although there are some \n\nsimilarities\
    \ in other classes that may prove useful. For example, `**nav-list**` and `**nav-header**`\
    \ can \n\nbe recreated using `**List**` groups. \n\nThere's a quick reference\
    \ chart to all of these in the migration guide on the Bootstrap 3 website, \n\n\
    which can be found at: http://getbootstrap.com/migration"
