  md: " \n\n \n\n \n\n \n\n53 \n\nTake the main preview `**<div>**` and add a new\
    \ class to it, `**hidden-sm**`, as follows: \n\nThen, if you refresh your browser\
    \ and try resizing it, you should see that the preview `**<div>**` now \n\ngets\
    \ hidden beyond certain widths, rather than getting stacked. \n\n \n\n*Figure\
    \ 24: Email application mock-up, resized, but with hiding classes added *\n\n\
    Just as with the grid system, there are four different sizes, and there are classes\
    \ to hide and \n\nmake visible. The visible classes will make the element in question\
    \ visible ONLY at the specified \n\nscreen size, and the hidden classes make the\
    \ element in question hidden ONLY at the specified \n\nscreen size. The class\
    \ names are as follows: \n\n`**visible-xs **`\\- Make visible on extra-small screens\
    \ \n\n`**visible-sm**` - Make visible on small screens \n\n`**visible-md **`\\\
    - Make visible on medium screens \n\n`**visible-lg**` - Make visible on extra\
    \ large screens \n\n \n\n`**hidden-xs**` - Hide on extra-small screens \n\n`**hidden-sm**`\
    \ - Hide on small screens \n\n`**hidden-md**` - Hide on medium screens \n\n`**hidden-lg**`\
    \ - Hide on large screens \n\nThe widths of the devices and the associated trigger\
    \ points are the same as those used in the \n\ngrid system in general, with `**\\\
    -xs**` covering palm-sized tablet phones and smaller, `**\\-sm**` covering \n\n\
    average-to-large tablets, -`**md**` covering most desktop computers, and `**\\\
    -lg**` covering wide-screen \n\ndesktops. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_52_0.png)\n\
    \n`<div class=\"col-md-9 hidden-sm\" style=\"border-left: 1px solid black\"> `\n\
    \n` `"
