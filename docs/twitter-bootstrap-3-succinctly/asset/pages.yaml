  md: " \n\n \n\n \n\n \n\n55 \n\n**Chapter 4 Changed Components Features **\n\n**Glyphicon\
    \ Changes **\n\nThe biggest news with the components provided by BS3 is the Glyphicons\
    \ icon set. \n\nWhen V3.0 beta was first released, the Glyphicons font that forms\
    \ the core of the icon set in \n\nBS3 was removed. The community was up in arms\
    \ about this, especially when the icon set was \n\nsplit into its own repository.\
    \ \n\nThe split was short-lived, however, and from the production release onwards,\
    \ the Glyphicons \n\nfont was reinstated into the main branch, but with one new\
    \ bonus. \n\nNo longer is the icon set made up of a set of bitmapped `**png**`s\
    \ in white and black—it's now a full-\n\nscale, vector-based font set, with `**ttf**`,\
    \ `**svg**`, `**wot**` and other formats. Because it's a vector now, it \n\ncan\
    \ easily be colored using standard CSS-based color techniques, and can now be\
    \ scaled to \n\nany size required. \n\nIn the current build of BS3, there are\
    \ 200 or more icons to choose from, covering lots of different \n\nuse cases.\
    \ To use an icon, you simply add the class `**glyphicon**` and a `**glyphicon-xxxxx**`\
    \ to \n\nselect the actual icon you want to use. Then, you add this to a span\
    \ class that's nested inside of \n\nthe element you wish to display the icon in.\
    \ \n\nOne rule you must obey with glyphicons is that you cannot mix the icon content\
    \ with any other \n\nelement. You must make sure that the icon class is applied\
    \ only to its own element, and with \n\nenough padding around it to ensure sufficient\
    \ space between it and any other content next to it. \n\nThe following code gives\
    \ you a simple overview on how to use the glyphicon classes: \n\n*Code Sample\
    \ 32: BS3 Glyphicons Sample *\n\n`<h1>This is header text `\n\n` <small>with some\
    \ small text and an icon <span class=\"glyphicon glyphicon-home\"></span></small>\
    \ `\n\n`</h1> `\n\n`<p>This is a normal paragraph, which again like the header\
    \ has an icon inline with it `\n\n` <span class=\"glyphicon glyphicon-headphones\"\
    ></span> `\n\n`</p> `\n\n`<div style=\"background-color: beige; width: 200px;\
    \ height: 200px; padding: 4px;\"> `\n\n` <p>This is an absolute size div with\
    \ a scaled up icon in it</p> `\n\n` <span class=\"glyphicon glyphicon-road\" style=\"\
    font-size: 150px;\"></span> `\n\n`</div> `\n\n`<p class=\"text-success\">This\
    \ is a normal paragraph, with a different color applied to it `\n\n` <span class=\"\
    glyphicon glyphicon-cog\"></span> `\n\n`</p> `\n\n` `"
  merge: -1
  pgno: 54
- img_proc: true
  md: " \n\n \n\n \n\n56 \n\n \n\n*Figure 25: Output produced by code sample 32 *\n\
    \nThere are far too many available icons to list them all here, but if you go\
    \ to \n\nhttp://getbootstrap.com/components/#glyphicons-how-to-use, you’ll find\
    \ a grid complete with all \n\nthe class names required to get the icon you need.\
    \ \n\nThe icons work correctly in any container you add them to, and they respect\
    \ the sizing classes \n\ntoo. So, for example, if you add one inside a `**<button>**`\
    \ element that has a `**btn-lg**` class \n\nattached to it, the icon will scale\
    \ as required to match the button size. \n\n**Button Changes **\n\nChanges to\
    \ buttons in BS3 are very minimal from a component point of view. There are a\
    \ few \n\nnew classes and recommendations, and some changes to their look and\
    \ feel as mentioned, but \n\notherwise, everything you did in BS2 should still\
    \ work as expected. \n\nFrom a component point of view, the `**btn-group**` and\
    \ `**btn-toolbar**` classes are still the same, \n\nbut it is now recommended\
    \ that where possible, you try to ensure that you group buttons using \n\n`**btn-group**`.\
    \ Also, when marking up toolbars, you should try to make sure you have a role\
    \ of \n\n`**toolbar**` applied to them to assist screen readers and other equipment.\
    \ \n\nThere is one thing you need to be aware of: due to changes in how BS3 handles\
    \ button groups, \n\nand if you are using tooltips or popovers on your buttons,\
    \ you will now have to add the option \n\n`**container:body**` to the tooltip\
    \ or popover when you create it. The container doesn't have to be \n\n`**body**`,\
    \ however; it can be any container in which the popover/tooltip/button arrangement\
    \ is \n\nnested. The container needs to be there though; this, unfortunately,\
    \ means that you now have \n\nno option but to create popovers and tooltips using\
    \ JavaScript. \n\nIn line with the rest of the new sizing classes comes the new\
    \ `**btn-group-lg**`, `**btn-group-sm**`, \n\nand `**btn-group-xs**`. As with\
    \ the other size classes, there is NO `**btn-group-md**`, since medium is \n\n\
    the default size with no extra styling added. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_55_0.png)"
