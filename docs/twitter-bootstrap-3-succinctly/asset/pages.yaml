    \ own share of changes, but much like the other \n\ngroups, this is mostly to\
    \ tie common class names together and basically tidy things up so they \n\nare\
    \ more meaningful. \n\nThere are two main sections when it comes to the navigation\
    \ components: basic navigation and \n\nnav-bars. Of these two components, nav-bars\
    \ have changed the most. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_64_0.png)\n\
