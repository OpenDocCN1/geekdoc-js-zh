- img_proc: true
  md: " \n\n \n\n \n\n \n\n95 \n\nIf we remove the `**sr-only**` class, however, it\
    \ makes our bar look a bit better to those who can \n\nsee it too: \n\n \n\n*Figure\
    \ 74: Progress bar with the *`*sr-only*`* class removed from the inner span *\n\
    \nIt goes without saying that you can also add `**progress-bar-success**`, `**progress-bar-info**`,\
    \ \n\n`**progress-bar-warning**`, and `**progress-bar-danger**` to the inner `**<div>**`\
    \ with the `**progress-**`\n\n`**bar**` class, in order to take advantage of the\
    \ contextual colors available. \n\nYou can also add `**progress-striped**` and/or\
    \ `**active**` to the outer `**<div>**` alongside the \n\n`**progress**` class\
    \ in order to get striped and animated effects on your progress bars. A stacked\
    \ \n\nprogress bar effect can be obtained by placing multiple `**progress-bar**`\
    \ `**<div>**`s inside of the \n\nouter `**progress**` container and setting their\
    \ values appropriately. \n\nThe final element that's left, is the humble `**well**`.\
    \ No changes have been made to this since BS3, \n\nbut it does now have an extra\
    \ class called `**well-sm**`. There's no magic involved here— if you \n\nwant\
    \ a simple, boxed-off area with a shaded background, simply create a `**<div>**`\
    \ element, add \n\nthe `**well**` class to it, and then add your content inside.\
    \ Wells are useful for sidebars and/or \n\nfooters, or anything too simple to\
    \ warrant being put in a full panel or other fenced off area. There \n\nare no\
    \ contextual colors or special actions, either; it’s simple, effective, and easy\
    \ to use: \n\n*Code Sample 71: Simple Well Example *\n\n \n\n*Figure 75: Well\
    \ example produced by sample 71 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_94_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_94_1.png)\n\
    \n`<div class=\"well\">Hello World!</div> `\n\n` `"
