  md: " \n\n \n\n \n\n \n\n83 \n\nNotice that we still get the full, cell-hover effect\
    \ when your mouse hovers over a link, and by \n\nsimply adding the `**active**`\
    \ class, as we have in other examples, we can mark an item as being \n\nthe active\
    \ one, and all while maintaining a single set of borders and the appearance of\
    \ each \n\nitem behaving just like a regular `**<ul>**` element. \n\nBut why stop\
    \ there? \n\nJust as with any other element in BS3, list groups also have their\
    \ own contextual classes to give \n\nthem meaning in the standard color set: \n\
    \n*Code Sample 58: BS3 List Group with Contextual Color Classes *\n\n`<div class=\"\
    list-group\"> `\n\n` <a class=\"list-group-item list-group-item-success\"> `\n\
