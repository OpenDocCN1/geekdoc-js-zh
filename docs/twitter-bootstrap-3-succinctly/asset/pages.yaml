  md: " \n\n \n\n \n\n \n\n19 \n\nIf you render those in your document, as expected,\
    \ you'll get the following: \n\n8 columns of content \n\n4 columns of content\
    \ \n\nIf, however, you modify the above code to add push and pull modifiers as\
    \ follows: \n\nWhen you render your document, you should see your layout change\
    \ as follows: \n\n4 columns of content \n\n8 columns of content \n\nFinally, if\
    \ you’re using the *Less* CSS source versions of Bootstrap, you have complete\
    \ control \n\nover the grid sizes by changing the following variables: \n\n`**@grid-columns**`:\
    \ controls the number of grids horizontally (default 12) \n\n`**@grid-gutter-width**`:\
    \ the total margin around each grid (default 30 pixels) \n\n`**@grid-float-breakpoint**`:\
    \ the minimum size below which we have “extra small” devices \n\n(default 768\
    \ pixels) \n\nSo now that we have the new grid system under control, is there\
    \ anything else you need to \n\nknow? \n\nThe more astute of you may be thinking,\
    \ “But that's crazy—with all those multiple sets of `**<div>**` \n\nelements and\
    \ offsets with `**col-xx-xx**` classes, all for different size displays, I might\
    \ as well just \n\ncreate four different sites, with four different resolutions\
    \ in mind!” To be honest, I wouldn't blame \n\nyou, except for one thing: each\
    \ of these new layout size levels are designed to work on the \n\nsame markup,\
    \ at the same time, and occupy the same space. \n\nLet's take the code in the\
    \ previous code sample 4, and rewrite it to do this the recommended \n\nway: \n\
    \n*Code Sample 7: The Recommended Way of Providing Multi-Resolution Layouts *\n\
    \n`<div class=\"col-md-4\">4 columns of content</div> `\n\n` `\n\n`<div class=\"\
    col-md-8 ``***col-md-push-4***``\">8 columns of content</div> `\n\n`<div class=\"\
    col-md-4 ``***col-md-pull-8***``\">4 columns of content</div> `\n\n` `\n\n`<div\
    \ class=\"container\"> `\n\n` <div class=\"col-xs-2 col-sm-2 col-md-2 col-lg-2\"\
    >Content here</div> `\n\n` <div class=\"col-xs-10 col-sm-10 col-md-10 col-lg-10\"\
