  md: " \n\n \n\n \n\n66 \n\nTo begin with, in BS2, all you really had were nav-bars;\
    \ there were no button classes or text \n\nclasses—only the brand-label. This\
    \ lead to much confusion among developers and many \n\nquestions, such as \"How\
    \ do I centrally line text up in a nav-bar?\" and \"How do I stop my buttons \n\
    \nfrom increasing the height of my nav-bar?\" \n\nBS3 has now introduced many\
    \ new classes designed especially for these kinds of scenarios, \n\nwhich we'll\
    \ introduce soon. But first, let's look at what's different in the basic navigation\
    \ \n\ncomponents. \n\n**Basic Navigation **\n\nFirst things first: the navigation\
    \ list component that was in BS2 is gone. Not just deprecated, but \n\ntaken away\
    \ never to be seen again—and this is a good thing. \n\nWhile it was easy to work\
    \ with (you created an unordered list, added a sprinkle of bootstrap \n\nmagic,\
    \ and were good-to-go), it was messy, didn't work consistently in all browsers,\
    \ and had a \n\nfew rendering problems. \n\nWhat do we have in its place? \n\n\
    We have *List groups*, which we’ll cover in detail later on. For now, let’s talk\
    \ about what remains, \n\nas it will set the groundwork for using List groups\
    \ a little later on. \n\nSo what is the base class then? It may surprise you to\
    \ learn that it's simply a class called `**nav**`, \n\nwhich along with `**nav-tabs**`,\
    \ `**nav-pills**`, and `**nav-stacked**`, can be used to make tab, pill, and \n\
    \nsidebar-based navigation structures in the same way you used to make `**nav**`\
    \ lists in BS2. \n\nThe markup is now much simpler. You don't need to worry about\
    \ any extra padding or browser \n\nquirks, and you certainly don't need any custom\
    \ stuff to get things done. \n\nTo use tabs, simply take an unordered list, and\
    \ add a `**nav**` and `**nav-tabs**` class, as the following \n\ncode shows: \n\
    \n*Code Sample 40: Tab Based Navigation *\n\n \n\n*Figure 34: Output produced\
    \ by code sample 40 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_65_0.png)\n\n\
    `<ul class=\"nav nav-tabs\"> `\n\n` <li class=\"active\"><a href=\"#\">Home</a></li>\
    \ `\n\n` <li><a href=\"#\">Profile</a></li> `\n\n` <li><a href=\"#\">Messages</a></li>\
    \ `\n\n`</ul> `\n\n` `"
