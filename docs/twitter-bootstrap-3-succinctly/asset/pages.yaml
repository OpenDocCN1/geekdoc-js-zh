  md: " \n\n \n\n \n\n \n\n23 \n\n**Chapter 2 Common Pitfalls **\n\nWhile researching\
    \ for this book, I've come across a number of potential problems, all of which\
    \ \n\nare going to cause you some grief—either with the transition from v2 to\
    \ v3, or even just when \n\njumping straight in to v3. \n\nA few of these are\
    \ applicable to v2 as well, but in general I'm including them here because they\
    \ \n\nbit me and left me scratching my head in a lot of cases. \n\n**Internet\
    \ Explorer Backwards Compatibility Modes **\n\nThis one hurt, really hurt. For\
    \ about a week and a half, I was going around in circles, trying to \n\nfigure\
    \ out why my nicely crafted layout was not displaying as expected in the latest\
    \ version of \n\nIE11. \n\nIt turned out that I had a malformed `**meta**` device\
    \ tag. \n\nAs you may recall from the BS2 book, there's a basic template that's\
    \ recommended as the \n\nstarting point for all sites based on the bootstrap framework.\
    \ It looks something like this: \n\n*Code Sample 8: Bootstrap HTML Basic Template\
    \ *\n\n`<!DOCTYPE html> `\n\n`<html> `\n\n` `\n\n` <head> `\n\n` <meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=9; IE=8; IE=7; IE=EDGE\" /> `\n\n` <meta charset=\"\
    utf-8\" /> `\n\n` <title>My Site</title> `\n\n` <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\"> `\n\n` <link href=\"css/bootstrap.css\"\
    \ rel=\"stylesheet\" type=\"text/css\" /> `\n\n` </head> `\n\n` `\n\n` <body>\
    \ `\n\n` `\n\n` <!-- document code goes here --> `\n\n` `\n\n` <script src=\"\
    js/jquery-2.0.2.js\" type=\"text/javascript\"></script> `\n\n` <script src=\"\
    js/bootstrap.js\" type=\"text/javascript\"></script> `\n\n` `\n\n` </body> `\n\
    \n`</html> `\n\n` `"
