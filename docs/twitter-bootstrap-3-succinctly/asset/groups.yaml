  - "[PAGE 42]\n\n \n\n \n\n \n\n \n\n43 \n\n \n\n*Figure 14: The output generated\
    \ by code sample 24 *\n\n**Button Changes **\n\nThe most prominent change in the\
    \ classes used to style buttons in BS3 is the default style. \n\nUnder BS2, simply\
    \ adding the `**btn**` class to an input element of type button, or to an anchor\
    \ tag, \n\nwould give the control the default button look and feel. \n\nFrom BS3\
    \ onwards, you now explicitly have to add `**btn-default**`; just adding `**btn**`\
    \ on its own will \n\nnow no longer have any effect. \n\nThe second main change\
    \ is in the renaming of some of the base classes. Specifically, `**btn-**`\n\n\
    `**error**` has been renamed to `**btn-danger**` so that the naming scheme matches\
    \ the other \n\nsimilarly named class changes and brings uniformity to the Bootstrap\
    \ base library. \n\nOther than that, the base button classes remain unchanged,\
    \ as the following code sample \n\nshows: \n\n*Code Sample 25: BS3 Button Classes\
    \ *\n\nWhen rendered in the browser, you'll see the normal flat button look the\
    \ BS3 now has for \n\ncontrols: \n\n \n\n*Figure 15: Bootstrap buttons as produced\
    \ by code sample 25 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_42_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_42_1.png)\n\
    \n`<button type=\"button\" class=\"btn btn-default\">Default</button> `\n\n`<button\
    \ type=\"button\" class=\"btn btn-primary\">Primary</button> `\n\n`<button type=\"\
    button\" class=\"btn btn-success\">Success</button> `\n\n`<button type=\"button\"\
    \ class=\"btn btn-info\">Info</button> `\n\n`<button type=\"button\" class=\"\
    btn btn-warning\">Warning</button> `\n\n`<button type=\"button\" class=\"btn btn-danger\"\
    >Danger</button> `\n\n`<button type=\"button\" class=\"btn btn-link\">Link</button>\
    \ `\n\n` `"
- md: "\nThere are a few new classes for the button element, added to bring uniformity\
    \ to the grid-sizing classes. These classes are `btn-lg`, `btn-sm`, and `btn-xs`;\
    \ there is no `btn-md`, as the medium-sized button is the standard size used when\
    \ no class is specified.\n\nThe following code sample demonstrates all the button\
    \ styles at different sizes:\n\n*Code Sample 26: All the BS3 Buttons Styles at\
    \ Each of the Different Sizes*\n\n`<p>\n  <button type=\"button\" class=\"btn\
    \ btn-default btn-lg\">Large default button</button>\n  <button type=\"button\"\
    \ class=\"btn btn-default\">Medium default button</button>\n  <button type=\"\
    button\" class=\"btn btn-default btn-sm\">Small default button</button>\n  <button\
    \ type=\"button\" class=\"btn btn-default btn-xs\">Extra small default button</button>\n\
    </p>\n\n`<p>\n  <button type=\"button\" class=\"btn btn-primary btn-lg\">Large\
    \ primary button</button>\n  <button type=\"button\" class=\"btn btn-primary\"\
    >Medium primary button</button>\n  <button type=\"button\" class=\"btn btn-primary\
    \ btn-sm\">Small primary button</button>\n  <button type=\"button\" class=\"btn\
    \ btn-primary btn-xs\">Extra small primary button</button>\n</p>\n\n`<p>\n  <button\
    \ type=\"button\" class=\"btn btn-success btn-lg\">Large success button</button>\n\
    \  <button type=\"button\" class=\"btn btn-success\">Medium success button</button>\n\
    \  <button type=\"button\" class=\"btn btn-success btn-sm\">Small success button</button>\n\
    \  <button type=\"button\" class=\"btn btn-success btn-xs\">Extra small success\
    \ button</button>\n</p>\n\n`<p>\n  <button type=\"button\" class=\"btn btn-info\
    \ btn-lg\">Large info button</button>\n  <button type=\"button\" class=\"btn btn-info\"\
    >Medium info button</button>\n  <button type=\"button\" class=\"btn btn-info btn-sm\"\
    >Small info button</button>\n  <button type=\"button\" class=\"btn btn-info btn-xs\"\
    >Extra small info button</button>\n</p>\n\n`<p>\n  <button type=\"button\" class=\"\
    btn btn-warning btn-lg\">Large warning button</button>\n  <button type=\"button\"\
    \ class=\"btn btn-warning\">Medium warning button</button>\n  <button type=\"\
    button\" class=\"btn btn-warning btn-sm\">Small warning button</button>\n  <button\
    \ type=\"button\" class=\"btn btn-warning btn-xs\">Extra small warning button</button>\n\
    </p>\n\n`<p>\n  <button type=\"button\" class=\"btn btn-danger btn-lg\">Large\
    \ danger button</button>\n  <button type=\"button\" class=\"btn btn-danger\">Medium\
    \ danger button</button>\n  <button type=\"button\" class=\"btn btn-danger btn-sm\"\
    >Small danger button</button>\n  <button type=\"button\" class=\"btn btn-danger\
    \ btn-xs\">Extra small danger button</button>\n</p>\n\n`<p>\n  <button type=\"\
    button\" class=\"btn btn-link btn-lg\">Large link button</button>\n  <button type=\"\
    button\" class=\"btn btn-link\">Medium link button</button>\n</p>`\n\nWhen rendered\
    \ in the browser, this code sample should give you the following output:\n\n*Figure\
    \ 16: The output produced by code sample 26*\n\nWhen you add the class `btn-block`\
    \ to a button or anchor element styled using any of the previous button classes,\
    \ that button will stretch to fill 100 percent of the available space. This is\
    \ useful when producing dialog boxes and sizing controls with BS3 grid system,\
    \ as it allows you to specifically size buttons (and other elements) to maintain\
    \ a good balance in your form designs.\n\nIn most cases, you won't need to set\
    \ a button’s active state yourself, but if you do, you can easily add the `active`\
    \ class to any element marked up using the button classes. `Active` in general\
    \ (on the `<button>` element at least) usually uses the `:active` pseudo-selector\
    \ to change the button’s style. Adding the `active` class, however, will force\
    \ the button to display its active state.\n\nNote: If you’re thinking of using\
    \ the `active` state to create sticky buttons, be aware that in the following\
    \ chapters, we will be discussing button states using the component and JavaScript\
    \ facilities available. BS3 provides just such a sticky button using the additional\
    \ features available in these facilities, so you won’t need to create your own\
    \ sticky buttons using `active` in most circumstances.\n\nYou can also disable\
    \ your buttons and mark them as inactive using the same “disabled” classes and\
    \ attributes that we discussed previously with the changes in form elements.\n\
    \n![](img/3ef3f89d4853001235bf8b5b1e48737_44_0.png)(img/3ef3f89d4853001235bf8b5b1e48737_44_1.png)\n\
    \n`<p>\n  <button type=\"button\" class=\"btn btn-link btn-sm\">Small link button</button>\n\
    \  <button type=\"button\" class=\"btn btn-link btn-xs\">Extra small link button</button>\n\
    </p>`\n\nThe following code shows buttons marked up to look active and disabled:\n\
    \n*Code Sample 27: BS3 Active and Disabled Buttons*\n\n*Figure 17: Output produced\
    \ by code sample 27*\n\nBe aware, however, that in the case of anchor buttons,\
    \ the `disabled` element/class does NOT disable the link; to make sure that a\
    \ disabled anchor does not fire, you will need to use JavaScript. For this reason,\
    \ the BS3 team recommends that you use the `<button>` element where possible,\
    \ and only use anchor tags in specific circumstances. Let’s also not forget the\
    \ subject of “idempotence” and the importance of using buttons over anchors. In\
    \ general, an anchor is appropriate if the destination is a request and making\
    \ the link several times will not cause any issues; otherwise, use a button.\n\
    \n## Image Changes\n\nCSS changes, where the image tag is concerned, have not\
    \ been as far-reaching as in BS3. Previously, images were not responsive by default,\
    \ and with many things in BS2, you had to add the responsive classes to get anywhere\
    \ being responsive with them. Unfortunately, even after you added the responsive\
    \ classes, things were not perfect; many people cited problems with pages where\
    \ images were used, among other things.\n\n![](img/3ef3f89d4853001235bf8b5b1e48737_45_0.png)\n\
    \n`<p>\n  <button type=\"button\" class=\"btn btn-primary active\">Active primary\
    \ button</button>\n  <button type=\"button\" class=\"btn btn-default active\"\
    >Active default button</button>\n</p>\n\n`<p>\n  <button type=\"button\" class=\"\
    btn btn-primary\" disabled=\"disabled\">Disabled primary button</button>\n  <button\
    \ type=\"button\" class=\"btn btn-default\" disabled=\"disabled\">Disabled default\
    \ button</button>\n</p>`\n\nBS3 changes all of this. Now, by default, images are\
    \ fully responsive with the use of an `<img>` tag. To extend and make that responsiveness\
    \ even better and more fluid, you can add the `img-responsive` to any `<img>`\
    \ tag to ensure that even while scaling correctly, the height and width of the\
    \ image also stay in proportion to each other. Other than that, the only other\
    \ change made to the images section is the name of the `img-polaroid` class (used\
    \ for generating thumbnails) to `img-thumbnail`, so that it falls in line with\
    \ other renaming throughout the library.\n\nThe BS2 classes `img-rounded` and\
    \ `img-circle` still work as they did previously, giving a circular and rounded-rectangle\
    \ thumbnail effect.\n\n## Helper and Visibility Changes\n\nFinally, we come to\
    \ the changes that cover those things that don't really fit into any specific\
    \ categories.\n\nUnder the typography classes in BS2, you were originally introduced\
    \ to a set of color classes used for setting the color of a text element to the\
    \ same branding colors used in other elements in the framework. BS3 takes this\
    \ one step further and introduces the concept of having the same colors used for\
    \ contextual backgrounds too. In this case, the backgrounds are a lighter variation,\
    \ as used in panels and alert boxes elsewhere. There's an added bonus: if you\
    \ use these contextual color classes on anchor tags and anything else that has\
    \ a hover-over set by default, the colors will automatically dim slightly to show\
    \ they've been hovered over.\n\nAs with the naming in other color-based classes,\
    \ the classes available here are `text-muted`, `text-primary`, `text-success`,\
    \ `text-info`, `text-warning`, and `text-danger` for paragraph, span, and other\
    \ inline or block-based text elements. For background colors, the class names\
    \ are `bg-primary`, `bg-success`, `bg-info`, `bg-warning`, and `bg-danger`.\n\n\
    The following code shows an example of using them:\n\n*Code Sample 28: BS3 Contextual\
    \ Color Classes*\n\n`<p class=\"text-muted\">This paragraph is using the muted\
    \ text class, <strong>typically reserved for something not really important or\
    \ less prominent.</strong></p>`\n`<p class=\"text-primary\">This paragraph is\
    \ using the primary text class, <strong>typically reserved for something important\
    \ or default and visible.</strong></p>`\n`<p class=\"text-success\">This paragraph\
    \ is using the success text class, <strong>typically reserved for an action that\
    \ just succeeded or something good and congratulatory.</strong></p>`\n"
  mdcn: "\n\n为按钮元素新增了几个新类，旨在使网格尺寸类保持一致性。这些类是 `btn-lg`、`btn-sm` 和 `btn-xs`；没有 `btn-md`，因为中等尺寸按钮是未指定类名时使用的标准尺寸。\n\
    \n以下代码示例演示了不同尺寸下所有的按钮样式：\n\n*代码示例 26：不同尺寸下的所有 BS3 按钮样式*\n\n`<p>\n  <button type=\"\
    button\" class=\"btn btn-default btn-lg\">大默认按钮</button>\n  <button type=\"button\"\
    \ class=\"btn btn-default\">中等默认按钮</button>\n  <button type=\"button\" class=\"\
    btn btn-default btn-sm\">小型默认按钮</button>\n  <button type=\"button\" class=\"btn\
    \ btn-default btn-xs\">极小默认按钮</button>\n</p>\n\n`<p>\n  <button type=\"button\"\
    \ class=\"btn btn-primary btn-lg\">大主按钮</button>\n  <button type=\"button\" class=\"\
