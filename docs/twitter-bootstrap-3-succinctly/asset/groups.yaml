    *Figure 18: Output produced by code sample 28*


    One thing that was noted as being needed in BS3, and not present in BS2, is a
    dedicated `caret` class for drop-down indicators on buttons and other screen furniture.


    You can now utilize this on your own elements by adding a class name of `caret`
    to your outer container—a `<span>` or a `<div>` that wraps your inner content.


    Another new addition in BS3, while it''s not actually a class, still deserves
    a mention: the dialog close cross.


    ![](img/3ef3f89d48533001235bf8b5b1e48737_47_0.png)


    `<p class="text-info">This paragraph is using the info text class, <strong>typically
    `reserved for informal messages, such as a background job just finishing or a
    new file available.</strong></p>`


    `<p class="text-warning">This paragraph is using the warning text class, <strong>typically
    reserved for something that might be dangerous or that needs attention but can
    wait a while.</strong></p>`


    `<p class="text-danger">This paragraph is using the danger text class, <strong>typically
    reserved for something very important, or something that really needs attention
    drawing to it.</strong></p>`


    `<br/><br/>`


    `<p class="bg-primary">This paragraph is using normal text but with a primary
    background color to tell you that what you''re seeing is the default status.</p>`


    `<p class="bg-success">This paragraph is using normal text but with a success
    background color to tell you that what you''re seeing is all good.</p>`


    `<p class="bg-info">This paragraph is using normal text but with an info background
    color to tell you that what you''re seeing is informative and should be read,
    but not always acted upon.</p>`


    `<p class="bg-warning">This paragraph is using normal text but with a warning
    background color to tell you that what you''re seeing could cause problems that
    you should be aware of.</p>`


    `<p class="bg-danger">This paragraph is using normal text but with a danger background
    color to tell you that what you''re seeing needs you to pay attention to it now.</p>`


    Just like the `caret`, this was present in BS2, but was not available to use separate
    from its intended use in modal dialogs and alert bars. However, from BS3 onwards,
    you can use it just fine on its own.


    The following code sample shows an example of both the `caret` class and close
    cross in generic mark-up:


    *Code Sample 29: Using the BS3 Caret and Close Cross Helpers*


    *Figure 19: Output from code sample 29*


    Just as in BS2, the quick float classes `pull-left` and `pull-right` still exist,
    but they are now joined by `center-block`, which simply makes both margins automatic
    and centers the element in its parent, and `clearfix`, which clears out any floats
    thus restoring normal flow.


    Other new classes include the `show`, `hidden`, and `invisible`. `Show` pretty
    much speaks itself, but what''s the difference between the latter two? `Hidden`
    physically collapses the space used by the element so if you have it in a full
    height div it will collapse to its smallest height. However if you use `invisible`,
    the element retains its space (and still occupies its place in the flow), but
    it vanishes from view.


    We''ve already seen that a new class called `sr-only` has been introduced to mark
    a block as visible to screen readers and nothing else. There is now another class
    like this that is used for graphical headings.


    ![](img/3ef3f89d48533001235bf8b5b1e48737_48_0.png)


    `<div class="bg-primary" style="width: 200px; height: 200px; padding: 4px;">`

    `<button class="close" aria-hidden="true">&times;</button>`

    `<p>This text appears in a div that has its own icon attached to it.</p>`

    `<div class="bg-success text-primary"></div>`

    `</div>`


    If you define a page title using an image banner, a typical screen reader will
    be unable to tell what the text in the image says. For a long time many authors
    have used a hack called image replacement to get around this. Image replacement
    works by wrapping the image banner in an `<h1>` or some other standard-type tag,
    putting the name in it as clear text alongside the banner, then using CSS to move
    the text off screen.


    What then happens is that display-wise, the image banner is seen by those with
    good sight but those using a screen reader hear the actual text in the image banner.
    BS3 now provides a class called `text-hide` in order to facilitate this. A simple
    example follows:


    *Code Sample 30: Using the Text-Hide Class to Make Reader Friendly Headers*


    *Figure 20: Output generated by code sample 30 in a regular browser*


    Finally, we come to the last of the last in the CSS section. What good would a
    responsive design framework be without utility classes to help you manage your
    responsive layouts?


    "But hold on, we''ve covered that with grids," I hear you say, and yes we have.
    But BS3 has one more trick up its sleeve which in all fairness was present in
    BS2 but didn''t really work that well.


    So what''s this extra magic? Let me introduce you to the responsive visibility
    classes. Essentially, what these little gems do is allow you to swap and change
    parts of your UI depending on your grid and display size.


    ![](img/3ef3f89d48533001235bf8b5b1e48737_49_0.png)


    `<header>`

    `<img src="title.png" />`

    `<h1 class="text-hide">A graphical image based title</h1>`

    `</header>`


    Let''s imagine, for example, that you have a list of email inbox items and when
    it’s viewed on a desktop PC, each item has a preview next to it much like in a
    classic email reading application. Something perhaps like the following:


    Email 1 (1/1/11)

    Email 2 : Received (1/1/11)

    To : A person


    Dear A Person,

    Blah blah blah blah blah blah blah


    Email 2 (1/1/11)

    Email 3 (1/1/11)

    Email 4 (1/1/11)

    Email 5 (1/1/11)

    Email 6 (1/1/11)


    *Figure 21: Email application layout example*


    Now this is great until you try to fit it on a mobile device, where you absolutely
    want to hide the preview pane and leave just the email list. Normally a task like
    this is performed using a little bit of JavaScript to change the visibility of
    the element by changing the element’s visible settings. BS3 has a built-in solution
    using CSS classes that helps you handle situations like this with great ease.
    Take the following bit of code:


    *Code Sample 31: Email Application Mockup*


    `<div class="col-md-12" style="border: 1px solid black">`

    `<div class="col-md-3">`

    `<table class="table">`

    `<tr>`

    `<td>Email 1 (1/1/11)</td>`

    `</tr>`

    `<tr>`

    `<td class="info">Email 2 (1/1/11)</td>`

    `</tr>`

    `<tr>`

    `<td>Email 3 (1/1/11)</td>`

    `</tr>`

    `<tr>`

    `<td>Email 4 (1/1/11)</td>`

    `</tr>`

    `<tr>`

    `<td>Email 5 (1/1/11)</td>`

    `</tr>`


    If you render this in your browser you should get something that looks like the
    following:


    *Figure 22: Email application mock-up produced by code sample 31*


    If, however, you resize your browser to mobile-screen size, things start to look
    a bit strange:


    *Figure 23: Email application mock-up on a resized view*


    This may work for some, but in general, it’s a bad idea. What happens when you
    have 100 unread emails, and have to scroll to the bottom of the view each time
    to read the preview?


    ![](img/3ef3f89d48533001235bf8b5b1e48737_51_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_51_1.png)

