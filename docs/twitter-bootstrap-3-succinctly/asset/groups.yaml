    \ getting stacked.\n\n*Figure 24: Email application mock-up, resized, but with\
    \ hiding classes added*\n\nJust as with the grid system, there are four different\
    \ sizes, and there are classes to hide and make visible. The visible classes will\
    \ make the element in question visible ONLY at the specified screen size, and\
    \ the hidden classes make the element in question hidden ONLY at the specified\
