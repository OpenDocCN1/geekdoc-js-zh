  - "[PAGE 105]\n\n \n\n \n\n \n\n106 \n\n**Chapter 6 Customizing Bootstrap 3 **\n\
    \nAnd so finally we get to the last chapter in the book, which will show you how\
    \ to create custom \n\ncolor sets. \n\nIf you recall back at the beginning, when\
    \ we were going through the major changes, I mentioned \n\nthat the BS authors\
    \ had provided an additional file to make BS3 look just like BS2, rather than\
    \ \n\nusing its flat look. \n\nThroughout this book, we've used the default BS3\
    \ flat look, but if you download the prebuilt \n\nJavaScript version of BS3 from\
    \ the get bootstrap site (www.getbootstrap.com) you'll find a new \n\nfile inside\
    \ the archive you download called **bootstrap-theme.css**. \n\nIf you link this\
    \ file into your project immediately after your inclusion of the core bootstrap.css\
    \ file, \n\nyou'll find that even though you’re now using the new BS3, the look\
    \ and feel of your application \n\nstill resembles BS2. \n\nThe authors realized\
    \ that one of the main barriers to the adoption of BS3 in new applications \n\n\
    was the inability to style it in a custom manner, but with ease. \n\nIf you were\
    \ a user of Less, or even SaSS (as BS3 now has SaSS bindings), then this wasn't\
    \ an \n\nissue. You simply opened up the Less sources, tweaked the variables and\
    \ Mixins you needed, \n\nand ran things through the Less compiler to get your\
    \ new CSS script. \n\nUnfortunately, not everyone used Less; in fact, many developers\
    \ and designers only had the \n\nability to download and include the plain old\
    \ pre-compiled CSS and JavaScript files, so a better \n\nway had to be found.\
    \ \n\nThe first change was opening up the entire Less sources to an in-page customization\
    \ tool \n\ndirectly on the Bootstrap main site, but this isn't a new thing; you\
    \ were able to use this page \n\nbefore in a limited way. With BS3, however, the\
    \ Less customization tool has had a complete \n\noverhaul, and you can now redefine\
    \ EVERYTHING that BS3 uses, from font sizes and \n\ntypefaces, right through to\
    \ grid sizes, trigger points, and basic contextual color sets. \n\nIn fact, there\
    \ is now nothing that cannot be changed before you decide to download your new\
    \ \n\ncustomized CSS, as the following image shows:"
  - "[PAGE 106]\n\n \n\n \n\n \n\n \n\n107 \n\n \n\n*Figure 82: Screenshot of the\
    \ top half of the new customization tool *\n\nBecause of the sheer size of the\
    \ tool, it's impossible to show the entire thing in this book, but it's \n\neasy\
    \ enough to access. Simply go to www.getbootstrap.com and click **Customize**\
    \ in the top \n\nmenu bar. You'll also see that you have many other options, such\
    \ as which JavaScript plug-ins \n\nand tool-kits to include, which components\
    \ to include, and base style that you may not want. \n\nFor example, if all you\
    \ want to use is the grid system, and nothing else, then you can simply \n\nselect\
    \ only the grid system, and unselect all the other components. \n\nThe BS3 site\
    \ will then generate just the required code to include, and no more. This is a\
    \ boon \n\nfor those people who complain that all Bootstrap sites look the same,\
    \ because it means that \n\nyour site absolutely does not have to look the same\
    \ as the rest—you can just use the bits you \n\nneed, and use your own stuff for\
    \ everything else. \n\nThere are two other ways you can customize your build.\
    \ The first is to take the additional \n\n'bootstrap-theme' CSS style sheet, make\
    \ a copy, and then change the styles as you see fit. This \n\nis not as easy as\
    \ using the customization tools, but it's also not as difficult as the alternative.\
    \ \n\nMost of the class names and settings that you'll want to change to stamp\
    \ your personal mark in \n\nBS3 are already separated out in the BS2 theme, so\
    \ the quickest way to experiment is simply to \n\nput together a prototyping page\
    \ with the main controls and elements on you want to change, \n\nand then link\
    \ in your copy of the BS2 theme. \n\nIf you’re using Node and something like Bower,\
    \ it gets even easier, because you can use live \n\nreload, then just watch your\
    \ sample page change in near real-time as you tweak your custom \n\nversion of\
    \ the theme sheet. \n\nThe second way is slightly more involved, and as described\
    \ in the BS3 docs, comes in two \n\nflavors: light customizations and heavy customizations.\
    \ \n\nAn example of a light customization is adding a contextual color class to\
    \ the button element. For \n\nexample, if you wanted to add `**btn-sky**` alongside\
    \ the `**btn-info**`, `**btn-primary**`, etc. classes, \n\nyou might define a\
    \ single style sheet to hold the following rules: \n\n*Code Sample 79: Light Customization,\
    \ Adding a New Contextual Class to the BS3 Button Classes *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_106_0.png)\n\
    \n`.btn-sky, .btn-sky:hover, .btn-sky:active `\n\n`{ `\n\n` color: #000000; `"
