    \ `div` 上添加 `btn-group-justified` 类，并在内部放入普通按钮即可。\n\n带有菜单的下拉按钮的创建方式与 BS2 中完全相同。首先，你创建一个应用了\
    \ `btn-group` 类的外部 `div`。紧接着在内部，你创建一个应用了普通按钮样式的按钮，带有 `dropdown-toggle` 类以及名为 `toggle`\
    \ 属性值为 `dropdown`。在按钮之后、关闭组 `div` 之前，你再使用应用了 `dropdown-menu` 类和 `role` 属性的标准无序列表（unordered\
