    \n`<div class=\"col-md-4\">4 columns of content</div> `\n\n` `\n\n`<div class=\"\
    col-md-8 ``***col-md-push-4***``\">8 columns of content</div> `\n\n`<div class=\"\
    col-md-4 ``***col-md-pull-8***``\">4 columns of content</div> `\n\n` `\n\n`<div\
    \ class=\"container\"> `\n\n` <div class=\"col-xs-2 col-sm-2 col-md-2 col-lg-2\"\
    >Content here</div> `\n\n` <div class=\"col-xs-10 col-sm-10 col-md-10 col-lg-10\"\
    >Content here</div> `\n\n`</div> `\n\n` `"
- md: "\nOk, so you might end up with the class list from hell on your elements, but\
    \ one set of markup will adapt to all display sizes, and resize itself where needed.\n\
    \nThis also works with the various offset, order, and nesting classes.\n\n## Other\
    \ Migrations\n\nIn addition to those we've already discussed, the following class\
    \ names also need to be changed if you’re migrating from a V2 layout to a V3 layout\
    \ (Note: the following table has been taken directly from the Bootstrap 3 docs\
    \ and was correct at the time of writing. As Bootstrap matures, however, this\
    \ may not remain so).\n\n*Table 2: V3 class name changes*\n\n| Bootstrap version\
    \ 2 class name | Bootstrap version 3 class name | \n| :--- | :--- |\n| .row-fluid\
    \ | .row |\n| .span\\* | .col-md-\\* |\n| .offset\\* | .col-md-offset-\\* |\n\
    | .brand | .navbar-brand |\n| .nav-collapse | .navbar-collapse |\n| .nav-toggle\
    \ | .navbar-toggle |\n| .btn-navbar | .navbar-btn |\n| .hero-unit | .jumbotron\
    \ |\n| .icon-\\* | .glyphicon .glyphicon-\\* |\n| .btn | .btn .btn-default |\n\
    | .btn-mini | .btn-xs |\n| .btn-small | .btn-sm |\n| .btn-large | .btn-lg |\n\
    | .alert-error | .alert-danger |\n| .visible-phone | .visible-xs |\n| .visible-tablet\
    \ | .visible-sm |\n| .visible-desktop | ***Split into*** .visible-md .visible-lg\
    \ |\n| .hidden-phone | .hidden-xs |\n| .hidden-tablet | .hidden-sm |\n| .hidden-desktop\
    \ | ***Split into*** .hidden-md .hidden-lg |\n| .input-block-level | .form-control\
    \ |\n| .control-group | .form-group |\n\n| Bootstrap version 2 class name | Bootstrap\
    \ version 3 class name | \n| :--- | :--- |\n| .control-group.warning | .control-group.error\
    \ |\n| .control-group.success | .form-group.has-\\* |\n| .checkbox.inline | .radio.inline\
    \ |\n| .input-group.prepend | .input-append |\n| .input-group.add-on | .input-group-addon\
    \ |\n| .img-polaroid | .img-thumbnail |\n| .ul.unstyled | .list-unstyled |\n|\
    \ .ul.inline | .list-inline |\n| .ul.muted | .text-muted |\n| .label | .label-default\
    \ |\n| .label.important | .label-danger |\n| .label.danger | .text-danger |\n\
    | .table.error | .text-error |\n| .table.bar | .progress-bar |\n| .bar-\\* | .progress-bar-\\\
    * |\n| .accordion | .accordion-group |\n| .panel.default | .panel-heading |\n\
    | .panel-heading | .accordion-body |\n| .panel-collapse | .accordion-inner | .panel-body\
    \ |\n\nAs previously mentioned, most of the changes have been made to bring conformity\
    \ to the naming scheme used by the various classes. But many of them have also\
    \ been renamed because their overall purpose has changed. We’ll go into more detail\
    \ in upcoming chapters in this book, but for now, if you're doing a conversion,\
    \ then Table 2 will tell you everything you need in order to target a v2 layout\
    \ to v3. You might want to consider using a custom task in something like Grunt.js\
    \ so that when you run your build system, these changes are performed automatically.\
    \ This will allow your developers to remain productive using v2 while gradually\
    \ making the move to v3.\n\nSo what exactly has been added to Bootstrap that's\
    \ new, and what exactly has been removed? It's more important that you know what's\
    \ been removed in Chapter 3, \"Changed CSS features,\" since this is the chapter\
    \ you’re likely to be referring to when migrating your layouts. First we'll start\
    \ with what's been removed where forms are concerned, and unfortunately, that's\
    \ quite a lot. We no longer have a specific type for a search form, and the form-actions\
    \ bar typically found at the foot of a form has also been deprecated in v3. Also\
    \ gone is the class typically used to display validation errors, control-group-info,\
    \ and its help counterpart, help-inline. None of these classes have any recommended\
    \ replacement in the v3 code base, meaning that to construct equivalents of them\
    \ you will need to use other elements and classes where applicable.\n\nContinuing\
    \ with forms, the main controls class used to wrap entire control sets is gone\
    \ with controls-row. Instead, you are advised to use row or the new form-group\
    \ class. Forms have also lost most of the sizing classes; the fixed-size classes\
    \ such as input-mini, input-small, input-medium, input-large, input-xlarge, and\
    \ input-xxlarge have now all gone away, along with the block level control input-block-level.\
    \ Instead, you are now advised to control your form element sizes using form-control\
    \ in combination with the new sizes and layouts available in the grid system.\n\
    \nFrom an individual control point of view, the inverse classes have been removed\
    \ from buttons and other similar controls, and we've also lost the dropdown-submenu\
    \ class in favor of just using split-down buttons to create the same functionality.\n\
    \nFor tabs, the tabs-left, tabs-right, and tabs-below classes no longer exist,\
    \ which means we now only have the ability to put tabs at the top of the content,\
    \ left-aligned. Staying with tabs, the class to work with content in a pill-based\
    \ tab setup has also been removed, meaning that pill-pane & pill-content should\
    \ now use the general tab-content & tab-pane classes.\n\nFinally, the various\
    \ navbar classes are not without casualties: navbar-inner, navbar-divider-vertical,\
    \ nav-list, and nav-header are no longer part of the framework. In most cases,\
    \ there are no direct equivalents in v3 for these classes, although there are\
    \ some similarities in other classes that may prove useful. For example, nav-list\
    \ and nav-header can be recreated using List groups.\n\nThere's a quick reference\
    \ chart to all of these in the migration guide on the Bootstrap 3 website, which\
    \ can be found at: http://getbootstrap.com/migration\n\n## Chapter 2 Common Pitfalls\n\
    \nWhile researching for this book, I've come across a number of potential problems,\
    \ all of which are going to cause you some grief. Over and over again, I looked\
    \ at the meta tag, not realizing it was the cause of my problems. So if you get\
    \ any weird errors in IE11, have a look in the debugger and see what mode IE believes\
    \ it should be displaying your page in. As previously mentioned, most of the changes\
    \ have been made to bring conformity to the naming scheme used by the various\
    \ classes. But many of them have also been renamed because their overall purpose\
    \ has changed. We’ll go into more detail in upcoming chapters in this book, but\
    \ for now, if you're doing a conversion, then Table 2 will tell you everything\
    \ you need in order to target a v2 layout to v3. You might want to consider using\
    \ a custom task in something like Grunt.js so that when you run your build system,\
    \ these changes are performed automatically. This will allow your developers to\
    \ remain productive using v2 while gradually making the move to v3.\n\nSo what\
    \ exactly has been added to Bootstrap that's new, and what exactly has been removed?\
    \ It's more important that you know what's been removed in Chapter 3, \"Changed\
    \ CSS features,\" since this is the chapter you’re likely to be referring to when\
    \ migrating your layouts. First we'll start with what's been removed where forms\
    \ are concerned, and unfortunately, that's quite a lot. We no longer have a specific\
    \ type for a search form, and the form-actions bar typically found at the foot\
    \ of a form has also been deprecated in v3. Also gone is the class typically used\
    \ to display validation errors, control-group-info, and its help counterpart,\
    \ help-inline. None of these classes have any recommended replacement in the v3\
    \ code base, meaning that to construct equivalents of them you will need to use\
    \ other elements and classes where applicable.\n\nContinuing with forms, the main\
    \ controls class used to wrap entire control sets is gone with controls-row. Instead,\
    \ you are advised to use row or the new form-group class. Forms have also lost\
    \ most of the sizing classes; the fixed-size classes such as input-mini, input-small,\
    \ input-medium, input-large, input-xlarge, and input-xxlarge have now all gone\
    \ away, along with the block level control input-block-level. Instead, you are\
    \ now advised to control your form element sizes using form-control in combination\
    \ with the new sizes and layouts available in the grid system.\n\nFrom an individual\
    \ control point of view, the inverse classes have been removed from buttons and\
    \ other similar controls, and we've also lost the dropdown-submenu class in favor\
    \ of just using split-down buttons to create the same functionality.\n\nFor tabs,\
    \ the tabs-left, tabs-right, and tabs-below classes no longer exist, which means\
    \ now only have the ability to put tabs at the top of the content, left-aligned.\
    \ Staying with tabs, the class to work with content in a pill-based tab setup\
    \ has also been removed, meaning that pill-pane & pill-content should now use\
    \ the general tab-content & tab-pane classes.\n\nFinally, the various navbar classes\
    \ are not without casualties: navbar-inner, navbar-divider-vertical, nav-list,\
    \ and nav-header are no longer part of the framework. In most cases, there are\
    \ no direct equivalents in v3 for these classes, although there are some similarities\
    \ in other classes that may prove useful. For example, nav-list and nav-header\
    \ can be recreated using List groups.\n\n### Internet Explorer 10 Device Viewport\n\
    \nYes folks, another IE-related problem. IE10 can't tell the difference between\
    \ device width and viewport width; the result of this is that IE10 gets its media\
    \ queries wrong a lot of the time (not just in Bootstrap, but other frameworks\
    \ too). The fix is simple enough: add a dummy CSS rule to your site-wide CSS styles\
    \ that looks like this:\n\n*Code Sample 8: Bootstrap Template*\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>My Site</title>\n<meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<link\
    \ href=\"css/bootstrap.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n\
    <body>\n<!-- code goes here -->\n<script src=\"js/jquery-2.0.js\" type=\"javascript\"\
    ></script>\n<script src=\"js/bootstrap.js\" type=\"javascript\"></script>\n</body>\n\
    </html>\n```\n\n### Internet Explorer 8 IE Fix\n\nWith Windows Phone versions\
    \ earlier than Update 3, the device will not interpret things correctly and put\
    \ the page into desktop view. To fix this, the following CSS rules and JavaScript\
    \ code are needed:\n\n*Code Sample 9: Windows Phone 8 IE Fix*\n\n```css\n@-ms-viewport\
    \ { width: device-width; }\n@-webkit-viewport { width: device-width; }\n@-moz-viewport\
    \ { width: device-width; }\n@-ms-viewport { width: device-width; }\n@-o-viewport\
    \ { width: device-width; }\n@viewport { width: device-width; }\n```\n\n```javascript\n\
    if (navigator.userAgent.match(/IEMobile\\/10\\.0/))\n{\n  var msViewportStyle\
    \ = document.createElement('style')\n  msViewportStyle.appendChild(\n    document.createTextNode('@-ms-viewport{width:auto!important}')\n\
    \  )\n  document.querySelector('head').appendChild(msViewportStyle)\n}\n```\n"
