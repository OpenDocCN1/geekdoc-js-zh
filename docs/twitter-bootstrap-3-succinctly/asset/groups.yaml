    \ btn-sm\">小型主按钮</button>\n  <button type=\"button\" class=\"btn btn-primary btn-xs\"\
    >极小主按钮</button>\n</p>`\n\n`<p>\n  <button type=\"button\" class=\"btn btn-success\
    \ btn-lg\">大成功按钮</button>\n  <button type=\"button\" class=\"btn btn-success\"\
    >中等成功按钮</button>\n  <button type=\"button\" class=\"btn btn-success btn-sm\">小型成功按钮</button>\n\
    \  <button type=\"button\" class=\"btn btn-success btn-xs\">极小成功按钮</button>\n\
    </p>\n\n`<p>\n  <button type=\"button\" class=\"btn btn-info btn-lg\">大信息按钮</button>\n\
    \  <button type=\"button\" class=\"btn btn-info\">中等信息按钮</button>\n  <button type=\"\
    button\" class=\"btn btn-info btn-sm\">小型信息按钮</button>\n  <button type=\"button\"\
    \ class=\"btn btn-info btn-xs\">极小信息按钮</button>\n</p>`\n\n`<p>\n  <button type=\"\
    button\" class=\"btn btn-warning btn-lg\">大警告按钮</button>\n  <button type=\"button\"\
    \ class=\"btn btn-warning\">中等警告按钮</button>\n  <button type=\"button\" class=\"\
    btn btn-warning btn-sm\">小型警告按钮</button>\n  <button type=\"button\" class=\"btn\
    \ btn-warning btn-xs\">极小警告按钮</button>\n</p>\n\n`<p>\n  <button type=\"button\"\
    \ class=\"btn btn-danger btn-lg\">大危险按钮</button>\n  <button type=\"button\" class=\"\
    btn btn-danger\">中等危险按钮</button>\n  <button type=\"button\" class=\"btn btn-danger\
    \ btn-sm\">小型危险按钮</button>\n  <button type=\"button\" class=\"btn btn-danger btn-xs\"\
    >极小危险按钮</button>\n</p>`\n\n`<p>\n  <button type=\"button\" class=\"btn btn-link\
    \ btn-lg\">大链接按钮</button>\n  <button type=\"button\" class=\"btn btn-link\">中等链接按钮</button>\n\
    </p>`\n\n当在浏览器中渲染时，此代码示例应产生如下输出：\n\n*图 16：代码示例 26 生成的输出*\n\n当你对使用之前任何按钮类样式的按钮或锚点元素添加\
    \ `btn-block` 类时，该按钮将扩展以填充 100% 的可用空间。这在用 BS3 网格系统制作对话框和尺寸控制控件时非常有用，因为它允许你专门调整按钮（和其他元素）的尺寸，以在表单设计中保持良好的平衡。\n\
    \n在大多数情况下，你不需要手动设置按钮的激活（active）状态，但如果需要，你可以轻松地为任何使用按钮类标记的元素添加 `active` 类。通常情况下，“激活”（至少在\
    \ `<button>` 元素上）使用 `:active` 伪选择器来更改按钮样式。然而，添加 `active` 类将强制按钮显示其激活状态。\n\n注意：如果你正在考虑使用\
    \ `active` 状态来创建粘性按钮，请注意在接下来的章节中，我们将使用可用的组件和 JavaScript 功能来讨论按钮状态。BS3 通过这些功能提供的额外特性已经提供了这样的粘性按钮，因此在大多数情况下，你不需要使用\
    \ `active` 创建自己的粘性按钮。\n\n你也可以使用我们之前讨论过的表单元素更改中相同的“disabled”类和属性来禁用按钮并将其标记为非活动状态。\n\
    \n![](img/3ef3f89d4853001235bf8b5b1e48737_44_0.png)(img/3ef3f89d4853001235bf8b5b1e48737_44_1.png)\n\
    \n`<p>\n  <button type=\"button\" class=\"btn btn-link btn-sm\">小型链接按钮</button>\n\
    \  <button type=\"button\" class=\"btn btn-link btn-xs\">极小链接按钮</button>\n</p>`\n\
    \n以下代码显示了被标记为激活和禁用的按钮：\n\n*代码示例 27：BS3 激活和禁用按钮*\n\n*图 17：代码示例 27 生成的输出*\n\n但请注意，对于锚点按钮，`disabled`\
    \ 元素/类**不会**禁用链接；要确保禁用的锚点不会触发，你需要使用 JavaScript。出于此原因，BS3 团队建议尽可能使用 `<button>`\
    \ 元素，仅在特定情况下使用锚点标签。我们也不要忘记“幂等性”主题以及使用按钮而非锚点的重要性。通常情况下，如果目标是一个请求且多次点击链接不会引起任何问题，则锚点是合适的；否则，请使用按钮。\n\
    \n## 图片更改\n\n在图像标签方面，CSS 的变化没有像 BS3 中那样深远。以前，图像默认不是响应式的，在 BS2 的许多功能中，你必须添加响应式类才能使其具有响应效果。遗憾的是，即使添加了响应式类，情况也并不完美；许多人提到了使用图像的页面存在问题。\n\
    \n![](img/3ef3f89d4853001235bf8b5b1e48737_45_0.png\n\n`<p>\n  <button type=\"\
    button\" class=\"btn btn-primary active\">激活的主按钮</button>\n  <button type=\"button\"\
    \ class=\"btn btn-default active\">激活的中等按钮</button>\n</p>\n\n`<p>\n  <button type=\"\
    button\" class=\"btn btn-primary\" disabled=\"disabled\">禁用的主按钮</button>\n  <button\
    \ type=\"button\" class=\"btn btn-default\" disabled=\"disabled\">禁用的中等按钮</button>\n\
    </p>`\n\nBS3 改变了这一切。现在，默认情况下，使用 `<img>` 标签就是完全响应式的。为了扩展这种响应性并使其更流畅，你可以对任何 `<img>`\
    \ 标签添加 `img-responsive`，以确保在缩放时图像的高宽也保持比例。除此之外，对图像部分的唯一更改是将 `img-polaroid` 类（用于生成缩略图）重命名为\
    \ `img-thumbnail`，以便与库的其他命名保持一致。\n\nBS2 的 `img-rounded` 和 `img-circle` 类仍然像以前一样工作，提供圆形和圆矩形形效果。\n\
    \n## 辅助与可见性更改\n\n最后，我们来看涵盖不属于特定类别的更改。\n\n在 BS2 的排版类中，最初引入了一组颜色类，用于将文本元素的颜色设置为框架中其他元素使用的相同品牌颜色。BS3\
    \ 更进了一步，引入了将相同颜色也用于上下文背景的概念。在这种情况下，背景是较浅的版本，正如在其他地方面板和警报框中使用那样。还有一个额外的奖励：如果你在锚点标签以及任何设置了默认悬停效果的对象上这些上下文颜色类，颜色会自动变暗，以显示它们被悬停。\n\
    \n与其他颜色类的命名方式一样，这里可用的类有 `text-muted`、`text-primary`、`text-success`、`text-info`、`text-warning`\
    \ 和 `text-danger`，用于段落、span 以及其他行内或块文本元素。对于背景颜色，类名分别为 `bg-primary`、`bg-success`、`bg-info`、`bg-warning`\
    \ 和 `bg-danger`。\n\n以下代码显示了使用它们的示例：\n\n*代码示例 28：BS3 上下颜色类*\n\n`<p class=\"text-muted\"\
    >此段落使用了淡文本类，**通常用于不真正重要或不那么显目的内容。**</p>`\n`<p class=\"text-primary\">此段落使用了主文本类，**通常用于重要或默认可见的内容。**</p>`\n\
    `<p class=\"text-success\">此段落使用了成功文本类，**通常用于刚刚成功的操作或令人愉快且祝贺的内容。**</p>`\n\n"
