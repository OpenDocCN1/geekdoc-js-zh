    \n***Table 1: Official support matrix ***\n\n \n\n**Chrome **\n\n**Firefox **\n\
    \n**IE **\n\n**Opera **\n\n**Safari **\n\n**Android **Yes \n\nNo \n\n \n\nNo \n\
    \n \n\n**iOS **Yes \n\n \n\n \n\nNo \n\nYes \n\n**Mac OS X **Yes \n\nYes \n\n\
    \ \n\nYes \n\nYes \n\n**Windows **Yes \n\nYes \n\nYes \n\nYes \n\nNo \n\nIf you\
    \ are targeting IE9 and IE8, and are using `**respond.js**` to support those efforts,\
    \ then please \n\nbe aware of the following points: \n\nYou will need to refer\
