    [content]

    The markup needed now consists of nothing more than a handful of `<li>` elements;
    the only place the classes need to be applied is on the outer `<ul>` itself. You''ll
    also see that we have an `active` class on the first `<li>` in the list, to show
    us which tag is the active tag.


    If you want BS3 to provide the entire tab''s experience (that is, to actually
    change the content as required), then there''s more work you need to do. For that,
    as we''ll see in the JavaScript section, you need to use one of the JavaScript
    add-ons. If, however, you want to handle the tab switching and content yourself,
    all you need to do to switch tabs is move the active class from one `<li>` to
    the next.


    Things are no more complicated with pills: just exchange the `nav-tabs` in code
    sample 40 for `nav-pills` and you should see your output change to this:


    *Figure 35: Output from code sample 40 when changed to “pill” mode*


    and if we add `nav-stacked` to either of them, our navigation will stack neatly
    one on top of each other:


    *Figure 36: Code sample 40, changed to “pill” mode, and with nav-stacked added*


    As with most other components and changes in the framework, the output now renders
    as a block element occupying all of the available space. Again, you just need
    to use the grid system and other available classes to make sure it takes up only
    the space you need. Now, any parent container that changes size because of differing
    screen resolutions will now cause its child elements to responsively resize as
    needed.


    By the way, this also works with tabbed navigation, but the output is most likely
    not what you would expect:


    *Figure 37: Code sample 40, rendered as stacked tabs*


    ![](img/3ef3f89d48533001235bf8b5b1e48737_66_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_2.png)


    In fairness, though it wasn''t really designed to work that way-: tabs generally
    run left to right, and while BS2 did have some classes for putting tabs on the
    side and along the bottom of elements, these have been removed in BS3. The JavaScript
    plug-in for making full, tab-based outputs still has the ability to position the
    tabs, but the general navigation no longer does.


    As with the changes made in the button components, the navigation aids also now
    have a new justified class added to them, called `nav-justified`, and just as
    with the button version, it will cause a navigation class to span the full width
    of a container, giving each sibling an equal size.


    If we take the code in sample 40 and add `nav-justified` to the two classes already
    there, we get the following result:


    *Figure 38: Navigation tabs from code sample 40 with full-width justification
    applied*


    The navigation aids have another thing in common with the button classes and components:
    the state-based changes, which are used to show a given state, as well as the
    ability to take drop-down menus and sub navigation.


    Simply adding a class of `disabled` to the `<li>` inside a navigation set will
    disable and dim that link with the `muted-text` look. Remember though, it does
    not actually disable the link—the link will still be clickable, and it’s up to
    you to code things so the link does not react.


    To add a drop-down menu to any pill- or tab-based navigation item, just use the
    same layout and classes as shown in the section on buttons. Nest an `<a>` inside
    an `<li>`, followed by another `<ul>`, with the appropriate classes and data attributes
    to make it all work.


    In a bit of a cross over between the basic navigation and navigation bars, we
    also have breadcrumbs and page/pagination navigation aids.


    Breadcrumbs are typically used to mark your position in a site’s hierarchy, and
    as we''ve seen above, using them is simply a case of adding them to an unordered
    list, as the following code shows:


    *Code Sample 41: BS3 Breadcrumb Navigation Example*


    *Figure 39: Output produced by code sample 41*


    ![](img/3ef3f89d48533001235bf8b5b1e48737_67_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_67_1.png)


    `<ul class="breadcrumb"> `

    ` <li><a href="#">Home</a></li> `

    ` <li><a href="#">Library</a></li> `

    ` <li class="active">Data</li> `

    `</ul>`


    The final controls before we move onto full navigation bars, are the pagination
    controls. These take a huge amount of grunt work of lining up a bar with previous/next
    before/after, and a sequence of numbers in the middle. Typically used where you
    have data-heavy site and want to display one page at time, rather than all at
    once, pagination bars are both simple to use and easy to line up with rest of
    your output.


    As with the other basic elements, creating pagination bars is as simple as adding
    the appropriate classes to an unordered list, as the following code shows:


    *Code Sample 42: BS3 Pagination Bar*


    *Figure 40: Output produced by code 42*


    As with the other navigation aids, applying `active` and `disabled` classes where
    needed to individual `<li>` elements within the list enables you to mark links
    as disabled and selected. Pagination controls can be sized just as easily as the
    other controls using the new sizing options, and like others, they now follow
    the same naming scheme: `pagination-lg` and `pagination-sm`. As with some of others,
    there is no `pagination-xs`, and likewise there no `pagination-md` size either,
    since medium is the default. To use the pagination controls, just add the appropriate
    sizing class on the parent `<ul>` holding the list, as the following code shows:


    ![](img/3ef3f89d48533001235bf8b5b1e48737_68_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_68_1.png)


    `<ul class="pagination"> `

    ` <li><a href="#">»</a></li> `

    ` <li><a href="#">1</a></li> `

    ` <li><a href="#">2</a></li> `

    ` <li><a href="#">3</a></li> `

    ` <li><a href="#">4</a></li> `

    ` <li class="active"><a href="#">5</a></li> `

    ` <li class="disabled"><a href="#">»</a></li> `

    `</ul>`


    *Code Sample 43: Using Different Sizes for the Pagination Component*


    *Figure 42: Output produced by code sample 43*


    The pagination classes have one final trick up their sleeve—the generation of
    Previous and Next page buttons.


    ![](img/3ef3f89d48533001235bf8b5b1e48737_69_0.png)


    `<ul class="pagination pagination-lg"> `

    ` <li><a href="#">»</a></li> `

    ` <li><a href="#">1</a></li> `

    ` <li><a href="#">2</a></li> `

    ` <li><a href="#">3</a></li> `

    ` <li><a href="#">4</a></li> `

    ` <li class="active"><a href="#">5</a></li> `

    ` <li class="disabled"><a href="#">»</a></li> `

    `</ul>`


    `<br/>`


    `<ul class="pagination"> `

    ` <li><a href="#">»</a></li> `

    ` <li><a href="#">1</a></li> `

    ` <li><a href="#">2</a></li> `

    ` <li><a href="#">3</a></li> `

    ` <li><a href="#">4</a></li> `

    ` <li class="active"><a href="#">5</a></li> `

    ` <li class="disabled"><a href="#">»</a></li> `

    `</ul>`


    `<br/>`


    `<ul class="pagination pagination-sm"> `

    ` <li><a href="#">»</a></li> `

    ` <li><a href="#">1</a></li> `

    ` <li><a href="#">2</a></li> `

    ` <li><a href="#">3</a></li> `

    ` <li><a href="#">4</a></li> `

    ` <li class="active"><a href="#">5</a></li> `

    ` <li class="disabled"><a href="#">»</a></li> `

    `</ul>`


    You''ll see that in many wiki- or blog-style sites, there is usually an Older/Newer,
    or Previous/Next button pair at the foot of a page.


    To make the default version of this, simply create a `<ul>` as we have throughout
    this entire section, and add a class of `pager` to it like:


    *Code Sample 44: Simple BS3 Pager*


    *Figure 43: Output from code sample 44*


    A pager will automatically place its buttons in the center of the available space,
    as seen in Figure 44, but you can also justify them left and right by adding the
    `previous` and `next` classes to the inner `<li>` elements.


    If you change code sample 44 so that the `<li>` holding the previous button has
    a class of `previous`, and the `<li>holding the next button has a class of `next`,
    and then render the output, you should see your browser change to the following:


    `<ul class="pager"> `

    ` <li><a href="#">Previous</a></li> `

    ` <li><a href="#">Next</a></li> `

    `</ul>`


    **Navbar Navigation**


    [/content]

