    \n`<button id=\"mybutton\" type=\"button\" class=\"btn btn-default\" data-toggle=\"\
    tooltip\" `\n\n`data-placement=\"top\" title=\"I am a tooltip!!\">The button with\
    \ a tooltip</button> `\n\n` `\n\n`$('#mybutton').tooltip(); `\n\n` `"
- md: "\n101\n\n*Figure 78: Button with accompanying tooltip*\n\nClose behind the\
    \ humble tooltip comes the popover, and like the tooltip, it must be initialized\
    \ \nmanually with a call to `popover()`. The main difference between a popover\
    \ and a tooltip is that \npopovers can hold more contents than a tooltip. \n\n\
    A tooltip typically only has a simple, single line of text, whereas a popover\
    \ is larger and can \ncontain multiple HTML elements, ranging from paragraphs\
    \ to buttons and images. \n\nThe second difference is that the element has to\
    \ be clicked before a popover will display, \nwhereas a tooltip is automatic upon\
    \ hover. \n\nYou create a popover in much the same way as a tooltip, except that\
    \ the popup content is \ndefined inside a data attribute called `content`, and\
    \ the `title` attribute is used to give the \npopover a mini title area (similar\
    \ to the way the header area is used on a panel component). \n\nThe following\
    \ code shows how to define a simple popover: \n\n*Code Sample 76: BS3 Button with\
    \ a Popover*\n\nAs with the tooltip, somewhere in your document start-up, you\
    \ also need to ensure you initialize \nthe component using something like: \n\n\
    Also as with the tooltip, you can pass an object containing options in here. There\
    \ are many \navailable, so again, I'd encourage you to read the BS3 docs to learn\
    \ them all. \n\nIf everything worked, you should be able to render your page and\
    \ see this: \n\n*Figure 79: BS3 button with a popover attached*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_100_0.png)\n\
    \n`<button id=\"mybutton\" type=\"button\" class=\"btn btn-default\" data-container=\"\
    body\" \ndata-toggle=\"popover\" data-placement=\"bottom\" data-content=\"I am\
    \ the pop over \ncontents, and I'm awesome.\" title=\"Popover Title\"> \n I am\
    \ a button with a pop over \n</button> \n\n`$('#mybutton').popover();`\n\n102\n\
    \n## Collapsible Panels\n\nOne of the things removed in BS3, sadly, was the readymade\
    \ accordion component. In its \nplace, however, is something better: the collapsible\
    \ panel. \n\nUsing these panels, it's still just as easy to create a standard\
    \ accordion, but they are now also \nseparately usable, standalone components,\
    \ allowing you to do things like create folding \ninformation areas, toolbars,\
    \ and much more. \n\nOne thing to note, however: if you're doing a custom build,\
    \ you must also make sure that you \ninclude the transition helper JavaScript\
    \ plug-in. The BS3 docs have more information that you’ll \nneed if you are doing\
    \ a custom build. \n\nTo create an accordion from collapsible panels, you simply\
    \ have to create an outer `<div>` with \na class of `panel-group` and give it\
    \ an `id`. Then, inside of that, you need a series of `<div>` tags \nmarked up\
    \ as shown previously in the section on panel components, with each panel `div`\
    \ being \na single self-contained panel. \n\nOnce you have your panels laid out,\
    \ you just need to add a `panel-title` inside a `panel-header`. This header should\
    \ contain an `<a>` tag with two data attributes assigned: one called \n`data-toggle`,\
    \ and one called `data-parent`. \n\nThe toggle attribute should have a value of\
    \ `collapse`, and the parent attribute should hold the \n`id` of the outer `<div>`\
    \ holding the panel group, and an `href` with the `id` of the target panel body\
    \ \nthat should be the object of the collapsing behavior. Each of the target panels\
    \ should have the \nclasses `panel-collapse` and `collapse` assigned to them.\
    \ \n\nThe following code shows how to achieve this: \n\n*Code Sample 77: How to\
    \ Create an Accordion Replacement Using Collapsible Panels*\n\n`<div class=\"\
    panel-group\" id=\"newAccordion\"> \n <div class=\"panel panel-default\"> \n <div\
    \ class=\"panel-heading\"> \n <h4 class=\"panel-title\"> \n <a data-toggle=\"\
    collapse\" data-parent=\"#newAccordion\" href=\"#panelOne\"> \n Consciousness\
    \ is the richness of truth, and of us \n </a> \n </h4> \n </div> \n <div id=\"\
    panelOne\" class=\"panel-collapse collapse in\"> \n <div class=\"panel-body\"\
    > \n Aromatherapy may be the solution to what's ... \n </div> \n </div> \n </div>\
    \ \n <div class=\"panel panel-default\"> \n <div class=\"panel-heading\"> \n <h4\
    \ class=\"panel-title\"> \n <a data-toggle=\"collapse\" data-parent=\"#newAccordion\"\
    \ href=\"#panelTwo\">`\n\n103\n\n*Figure 80: Accordion replacement produced by\
    \ sample 77*\n\nAs mentioned, panels don't need to be grouped; they can be used\
    \ in a singular fashion with just \na single element as the trigger for the folding\
    \ to happen. For example, if you want to collapse a \npanel using a simple button,\
    \ just ensure that your button has a data attribute of `toggle` with the \nvalue\
    \ `collapse`, and a data attribute called `target` with the selector for the target\
    \ panel as its \nvalue.\n\n## Carousel\n\nTo round this chapter off, the last\
    \ JavaScript plug-in I'm going to introduce is the newly designed \ncarousel.\
    \ BS2 had a carousel, but like the accordion, it’s now been removed and greatly\
    \ \nsimplified to make it easier to use. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_102_0.png)\n\
    \n` The planet is radiating four-dimensional superstructures \n </a> \n </h4>\
    \ \n </div> \n <div id=\"panelTwo\" class=\"panel-collapse collapse\"> \n <div\
    \ class=\"panel-body\"> \n It is time to take chi to the next level ... \n </div>\
    \ \n </div> \n </div> \n <div class=\"panel panel-default\"> \n <div class=\"\
    panel-heading\"> \n <h4 class=\"panel-title\"> \n <a data-toggle=\"collapse\"\
    \ data-parent=\"#newAccordion\" href=\"#panelThree\"> \n Reality has always been\
    \ radiating messengers whose souls are opened by \nstardust \n </a> \n </h4> \n\
    \ </div> \n <div id=\"panelThree\" class=\"panel-collapse collapse\"> \n <div\
    \ class=\"panel-body\"> \n Self-actualization requires exploration ... \n </div>\
    \ \n </div> \n </div> \n</</div>> \n\n104\n\nTypically, the carousel plug-in is\
    \ used at the top of a page to provide a rotating banner of \nimages, and in BS2,\
    \ this was the only thing that the carousel could be used for. In BS3,\nhowever,\
    \ any content that can be placed inside the carousel will be rotated, including\n\
    images, text, and much more. \n\nThe following code shows a basic example of how\
    \ to construct a carousel:\n\n*Code Sample 78: BS3 Carousel*\n\n`<div id=\"carousel-generic\"\
    \ class=\"carousel slide\" data-ride=\"carousel\"> \n <ol class=\"carousel-indicators\"\
    > \n <li data-target=\"#carousel-generic\" data-to=\"0\" class=\"active\"></li>\
    \ \n <li data-target=\"#carousel-generic\" data-to=\"1\"></li> \n <li data-target=\"\
    #carousel-generic\" data-to=\"2\"></li> \n</ol> \n <div class=\"carousel-inner\"\
    > \n <div class=\"item active\"> \n <img data-src=\"holder.js/1140x500/sky\" />\
    \ \n <div class=\"carousel-caption\"> \n <h3>You and I are beings of the planet</h3>\
    \ \n <p>Spacetime is a constant. Will requires exploration</p> \n </div> \n </div>\
    \ \n <div class=\"item\"> \n <img data-src=\"holder.js/1140x500/vine\" /> \n <div\
    \ class=\"carousel-caption\"> \n <h3>Nothing is impossible</h3> \n <p>Stardust\
    \ requires exploration. You and I are storytellers of cosmos</p> \n </div> \n\
    \ </div> \n <div class=\"item\"> \n <img data-src=\"holder.js/1140x500/lava\"\
    \ /> \n <div class=\"carousel-caption\"> \n <h3>You and I are beings of the planet</h3>\
    \ \n <p>Spacetime is a constant. Will requires exploration</p> \n </div> \n </div>\
    \ \n</div> \n <a class=\"left carousel-control\" href=\"#carousel-generic\" data-slide=\"\
    prev\"> \n <span class=\"glyphicon glyphicon-left\"></span> \n </a> \n <a class=\"\
    right carousel-control\" href=\"#carousel-generic\" data-slide=\"next\"> \n <span\
    \ class=\"glyphicon glyphicon-right\"></span> \n </a> \n</div>`\n\n105\n\n*Figure\
    \ 81: Carousel produced by code sample 78*\n\nThere are a few more low-key JavaScript\
    \ objects, but most of them are not directly usable from \nnormal code, and are\
    \ generally only used in special circumstances. The BS3 docs cover \neverything\
    \ I've missed, and if you're going to dig deeply into the JavaScript facilities\
    \ available, a \nlong read and an understanding of how everything is hooked together\
    \ is definitely a \nrequirement. \n\nOne final note: BS3 JavaScript plug-ins are\
    \ nothing more than regular jQuery plug-ins (BS uses \njQuery under the hood).\
    \ This means that it should be very easy to take your favorite jQuery \nplug-in\
    \ from places like unheap.com and adapt them to work with BS3 quite easily. Don’t\
    \ forget \nthere is still a huge number of add-ons available out there, especially\
    \ to be used with \nthe framework, most of which are only a Google search away.\n"
  mdcn: "\n\n101\n\n*图 78：带有辅助提示的按钮*\n\n紧随在简单的工具提示（tooltip）之后的是弹出框（popover），它和工具提示一样，必须通过调用\
    \ `popover()` 手动进行初始化。弹出框和工具提示之间的主要区别在于，弹出框可以包含比工具提示更多的内容。\n\n工具提示通常只有一行简单的单行文本，而弹出框的尺寸更大，可以包含多个\
    \ HTML 元素，从段落到按钮和图像无有之。\n\n第二个区别是，在弹出框显示之前必须点击该元素，而工具提示在悬停时是自动显示的。\n\n你创建弹出框的方式与工具提示几乎相同，但弹出的内容被定义在一个名为\
    \ `content` 的数据属性中，而 `title` 属性用于为弹出框提供一个微型标题区域（类似于面板组件中页头区域用法）。\n\n以下代码展示了如何定义一个简单的弹出框：\n\
    \n*代码示例 76：带有弹出框的 BS3 按钮*\n\n与工具提示一样，在文档启动的某个地方，你还需要确保使用以下内容来初始化组件：\n\n同样与工具提示一样，你可以在这里传递一个包含选项的对象。这里有很多可用选项，所以我再次鼓励你阅读\
    \ BS3 文档来学习所有它们。\n\n如果一切运行正常，你应该能够渲染页面并看到这个：\n\n*图 79：附带弹出框的 BS3 按钮*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_100_0.png)\n\
    \n`<button id=\"mybutton\" type=\"button\" class=\"btn btn-default\" data-container=\"\
    body\" \ndata-toggle=\"popover\" data-placement=\"bottom\" data-content=\"I am\
    \ the pop over \ncontents, and I'm awesome.\" title=\"Popover Title\"> \n I am\
    \ a button with a pop over \n</button> \n\n`$('#mybutton').popover();`\n\n102\n\
    \n## 折叠面板 (Collapsible Panels)\n\n遗憾的是，BS3 中移除的一个组件是现成的手风琴（accordion）组件。然而，取而代之的是一个更好的东西：折叠面板。\n\
    \n使用这些面板创建标准的手风琴依然同样而容易，但它们现在也是可以独立使用的组件，允许你执行诸如创建折叠信息区域、工具栏等操作。\n\n然而，需要注意的一点是：如果你正在进行自定义构建，还必须确保包含了过渡辅助的\
    \ JavaScript 插件。如果你在进行自定义构建，BS3 文档提供了你需要的更多信息。\n\n要从折叠面板创建手风琴，你只需要创建一个类为 `panel-group`\
    \ 的外层 `<div>` 并给它分配一个 `id`。然后，在内部，你需要一组如之前在“面板组件”节节所示标记的 `<div>` 标签，每个面板 `div`\
    \ 都是一个单一自包含的面板。\n\n一旦你布局好了面板，你只需要在 `panel-header` 内部添加一个 `panel-title`。此页头应该包含一个\
    \ `<a>` 标签，并分配了两个数据属性：一个称为 `data-toggle`，另一个称为 `data-parent`。\n\n`toggle` 属性的值应为\
    \ `collapse`，`parent` 属性应持有存放面板组的外层 `<div>` 的 `id`，以及一个带有目标面板主体 `id` 的 `href`，该主体应该是折叠行为的对象。每个目标面板都应该分配\
    \ `panel-collapse` 和 `collapse` 类。\n\n以下代码展示了如何实现这一点：\n\n*代码示例 77：如何使用折叠面板创建手风琴替代品*\n\
    \n`<div class=\"panel-group\" id=\"newAccordion\"> \n <div class=\"panel panel-default\"\
    > \n <div class=\"panel-heading\"> \n <h4 class=\"panel-title\"> \n <a data-toggle=\"\
    collapse\" data-parent=\"#newAccordion\" href=\"#panelOne\"> \n Consciousness\
    \ is the richness of truth, and of us \n </a> \n </h4> \n </div> \n <div id=\"\
    panelOne\" class=\"panel-collapse collapse in\"> \n <div class=\"panel-body\"\
    > \n Aromatherapy may be the solution to what's ... \n </div> \n </div> \n </div>\
    \ \n <div class=\"panel panel-default\"> \n <div class=\"panel-heading\"> \n <h4\
    \ class=\"panel-title\"> \n <a data-toggle=\"collapse\" data-parent=\"#newAccordion\"\
    \ href=\"#panelTwo\">`\n\n103\n\n*图 80：由示例 77 生成的手风琴替代品*\n\n正如提到的，面板不需要分组；它们可以单独立地使用，仅需一个单一元素作为折叠发生的触发器。例如，如果你想使用一个简单的按钮来折叠面板，只需确保你的按钮有一个值为\
    \ `collapse` 的 `toggle` 数据属性，以及一个名为 `target` 的数据属性，其值为目标面板的选择器。\n\n## 轮播图 (Carousel)\n\
    \n为了给本章画上句号，我将介绍的最后一个 JavaScript 插件是新设计的轮播图。BS2 有轮播图，但像手风琴一样，它已经被移除并极大地简化了以以便使用。![](img/3ef3f89d48533001235bf8b5b1e48737_100_0.png)\n\
    \n Consciousness is the richness of truth, and of us \n </a> \n </h4> \n </div>\
    \ \n <div id=\"panelOne\" class=\"panel-collapse collapse in\"> \n <div class=\"\
    panel-body\"> \n Aromatherapy may be the solution to what's ... \n </div> \n </div>\
    \ \n </div> \n <div class=\"panel panel-default\"> \n <div class=\"panel-heading\"\
    > \n <h4 class=\"panel-title\"> \n <a data-toggle=\"collapse\" data-parent=\"\
    #newAccordion\" href=\"#panelTwo\"> Reality is four-dimensional \n </a> \n </h4>\
    \ \n </div> \n <div id=\"panelTwo\" class=\"panel-collapse\"> \n <div class=\"\
    panel-heading\"> \n <h4 class=\"panel-title\"> \n <a data-toggle=\"collapse\"\
    \ data-parent=\"#newAccordion\" href=\"#panelThree\"> Reality has always been\
    \ messengers \n </a> \n </h4> \n </div> \n <div id=\"panelThree\" class=\"panel-collapse\
    \ collapse in\"> \n <div class=\"panel-body\"> \n Self-actualization requires\
    \ \n </div> \n </div> \n </div> \n >\n\n同样与工具提示一样，你可以在这里传递一个包含选项的对象。这里有很多可用选项，所以我再次鼓励你阅读\
    \ BS3 文档来学习所有它们。\n\n如果一切运行正常，你应该能够渲染页面并看到这个：\n\n*图 79：附带弹出框的 BS3 按钮*\n\n104\n\n\
    通常，轮播图插件用于页面顶部以提供旋转横，在 BS2 中这是轮播的唯一用途。在 BS3 中，任何放置在轮播图中的内容都可以旋转，包括图像、文本等更多。\n\n\
    以下代码展示了如何构建轮播图的基本示例：\n\n*代码示例 78：BS3 轮播图*\n\n`<div id=\"carousel-generic\" class=\"\
    carousel slide\" data-ride=\"carousel\"> \n <ol class=\"carousel-indicators\"\
    > \n <li data-target=\"#carousel-generic\" data-to=\"0\" class=\"active\"></li>\
    \ \n <li data-target=\"#carousel-generic\" data-to=\"1\"></li> \n <li data-target=\"\
    #carousel-generic\" data-to=\"2\"></li> \n</ol> \n <div class=\"carousel-inner\"\
    > \n <div class=\"item active\"> \n <img data-src=\"holder.js/140x500/sky\" />\
    \ \n <div class=\"carousel-caption\"> \n <h3>You and I are beings of the planet</h3>\
    \ \n <p>Spacetime is a constant. Will requires exploration</p> \n </div> \n </div></div>\
    \ \n <div class=\"item\"> \n <img data-src=\"holder.js/140x500/vine\" /> \n <div\
    \ class=\"carousel-caption\"> \n <h3>Nothing is impossible</h3> \n <p>Stardust\
    \ requires exploration. You and I are storytellers of cosmos</p> \n </div> \n\
    \ </div></div> \n <div class=\"item\"> \n <img data-src=\"holder.js/140x500/lava\"\
    \ /> \n <div class=\"carousel-caption\"> \n <h3>You and I are beings of the planet</h3>\
    \ \n <p>Spacetime is a constant. Will requires exploration</p> \n </div> \n </div></div>\
    \ \n</div></div> \n <a class=\"left carousel-control\" href=\"#carousel-generic\"\
    \ data-slide=\"prev\"> \n <span class=\"glyphicon glyphicon-left\"></span> \n\
    \ </a> \n <a class=\"right carousel-control\" href=\"#carousel-generic\" data-slide=\"\
    next\"> \n <span class=\"glyphicon glyphicon-right\"></span> \n </a> \n</div>>`\n\
    \n105\n\n*图 81：由代码 78 生成的轮播图*\n\n还有几个低调的 JavaScript 对象，但它们大多数无法从普通代码直接使用，且通常只在特殊情况下使用。BS3\
    \ 文档涵盖了我遗漏的所有内容，如果你打算深入研究可用的 JavaScript 功能，仔细阅读并理解所有内容是如何连接在一起的绝对是一个要求。\n\n最后说明一点：BS3\
    \ JavaScript 插件无非是普通的 jQuery 插件（BS 在底层使用 jQuery）。这意味着你应该可以很容易地从 unheap.com 等地方获取你喜爱的\
    \ jQuery 插件，并轻松地适配它们以与 BS3 工作。不要忘记那里仍然有大量的插件可用，特别是与该框架一起使用的，大多数插件只需通过 Google 搜索就能找到。\n\
    \n"
