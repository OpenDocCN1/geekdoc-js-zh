    \ to put borders and other contextual hints around the entire list and wrap \n\
    \nthem inline to produce composite components. \n\n**Panel Changes **\n\nLike\
    \ list groups, panels are a new addition to BS3—and what an addition they are!\
    \ \n\nWe’re all familiar with things like forms, for example, being in group boxes,\
    \ or sections of a \n\nwebsite being logically divided up from each other. BS3\
    \ panels allow you to easily control this \n\nlogical separation. \n\nYou can\
    \ have plain old panels, panels with headers, panels with titles in headers, panels\
    \ with \n\nfooters, and panels with their own set of contextual colors. \n\nA\
    \ basic panel is constructed using just two `**<div>**` elements and three CSS\
    \ classes: \n\n*Code Sample 63: Basic Panel Object *\n\nHowever, it's not much\
