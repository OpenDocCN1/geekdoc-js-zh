  - "[PAGE 13]\n\n \n\n \n\n \n\n14 \n\n**Chapter 1 Migrating from Version 2 to **\n\
    \n**Version 3 **\n\nSo what's involved in migrating from Bootstrap 2 to Bootstrap\
    \ 3? In truth, not a great deal. \n\nDespite the many changes, there's still not\
    \ a huge amount for you to actually change, and the \n\nchanges you do need to\
    \ make are generally just class renames where applicable. \n\nOne of the things\
    \ you might want to do, especially if you've been using BS only for general web\
    \ \n\napp development and not mobile or any kind of responsive design, is to disable\
    \ the responsive \n\nfeatures in BS3. \n\nThis is easy enough to do, but not at\
    \ all recommended. \n\nYou can achieve this as follows: \n\n \n\nDo not add the\
    \ `**meta**` tag containing the device width and other initial sizing info to\
    \ the \n\nhead of your document. \n\n \n\nDo override the `**width**` on your\
    \ elements that are marked up with a class of `**container**`, \n\nand make sure\
    \ you use `**style='width: xxx !important'**` when you do so. \n\n \n\nDo make\
    \ sure that any width overrides are processed AFTER the main Bootstrap CSS \n\n\
    rules have been loaded. \n\n \n\nDo remove ALL collapsing and expanding behaviors\
    \ and rules from ALL `**navbar**` \n\nconstructs within your document. \n\n \n\
    \nDo change all grid layout classes to use ONLY `**col-xs-\\***` classes and none\
    \ of the other \n\nfour levels. \n\nIf you’re targeting IE8 and IE9, you will\
    \ still need to make sure you use `**respond.js**`, even if you \n\ndo disable\
    \ responsiveness as outlined. \n\n**Class Changes **\n\nAs I mentioned earlier,\
    \ there have been many class name changes between the two versions, \n\nand many\
    \ classes have been deprecated and withdrawn. \n\nOne thing that will (and already\
    \ has if you look at Stack Overflow) come as a surprise to many is \n\nthe withdrawal\
    \ of the fluid width classes. \n\nIn version 2, if you wanted a full-width elastic\
    \ container, then you had to do something like the \n\nfollowing:"
- md: "\n*Code Sample 1: Version 2 Flexible Container*\n\nIn version 3 the `**container**`\
    \ and `**row-fluid` classes no longer exist.\n\nSo how do you get a fluid container?\
    \ Simple: you don't.\n\nRather than wrap your contents in a `**container**` and\
    \ then a `**row`, you simply don’t wrap them in anything.\n\nYou can still use\
    \ the grid system to provide enclosing containers for your content, so that things\
    \ line up nicely with Bootstrap’s grid, but you no longer need to put a container\
    \ around those collections of `**<div>` elements before you use them.\n\nIn fact,\
    \ if you use `**container**` and `**row` (the non-fluid versions still exist)\
    \ then you'll end up with all your content being in the 1024-pixel, central column\
    \ automatically, and be able to use the entire page width if you do not.\n\n##\
    \ Migrating the Grid System\n\nThen next biggest class change is the grid system\
    \ itself.\n\nIn version 2 you typically created grids in the following manner:\n\
    \n*Code Sample 2: Version 2 Grid Classes*\n\nThis code would give you two containers\
    \ that neatly filled the 12 grid squares horizontally that all layouts had (typically\
    \ a side bar).\n\nIn version 3, the “medium level” grid is now the equivalent\
    \ of the v2 `**span**` classes, so to rewrite the previous code for V3 you simply\
    \ do the following:\n\n*Code Sample 3: Version 3 Grid Classes Equivalent to 'Span'*\n\
    \n`<div class=\"container-fluid\" id=\"myParentContainer\"> `\n` <div class=\"\
    row-fluid\" id=\"mycontentrow\"> `\n` <h1>A headline</h1> `\n` <p>Some paragraph\
    \ text</p> `\n` </div> `\n`</div> ` \n` `\n`<div class=\"container\"> `\n` <div\
    \ class=\"span2\">Content here</div> `\n` <div class=\"span10\">Content here</div>\
    \ `\n`</div> ` \n` `\n`<div class=\"container\"> `\n` <div class=\"col-md-2\"\
    >Content here</div>` \n\nHowever, whereas version 2 had only one level of grid\
    \ size, version 3 now has four levels. Each level is tailored for the expected\
    \ main target device that you anticipate your end product will be running on.\n\
    \nThese grid units are now named as follows:\n\n- Extra small devices: `**col-xs-*`\n\
    - Small devices: `**col-sm-*`\n- Medium devices: `**col-md-*`\n- Large devices:\
    \ `**col-lg-*`\n\nMedia queries are used internally for BS3 to decide just which\
    \ of the aforementioned grid classes to use, and the different sizes are defined\
    \ as follows:\n\n- Extra small: display width less than 768 pixels\n- Small: display\
    \ width greater than or equal to 768 pixels, or less than 992 pixels\n- Medium:\
    \ display width greater than or equal to 992 pixels, or less than 1,200 pixels\n\
    - Large: display width greater than or equal to 1,200 pixels\n\nYou can code up\
    \ multiple versions of your grid for BS3 to decide which type to use when targeting\
    \ multiple displays. For example if you did the following:\n\n*Code Sample 4:\
    \ Multiple Grid Size Declarations*\n\n`<div class=\"col-md-10\">Content here</div>`\n\
    `</div>` \n` `\n`<div class=\"container\"> `\n` <div class=\"col-xs-2\">Content\
    \ here</div>`\n` <div class=\"col-xs-10\">Content here</div>`\n` <div class=\"\
    col-sm-2\">Content here</div>`\n` <div class=\"col-sm-10\">Content here</div>`\n\
    ` <div class=\"col-md-2\">Content here</div>`\n` <div class=\"col-md-10\">Content\
    \ here</div>`\n` <div class=\"col-lg-2\">Content here</div>`\n` <div class=\"\
    col-lg-10\">Content here</div>`\n`</div>` \n` `\n\nBS3 will hide and unhide the\
    \ containers as required, depending on the width of the device display and the\
    \ operation of the media queries.\n\nAs with previous versions of the grid system,\
    \ there are 12 columns horizontally across all the different sizes, so whichever\
    \ grid size is displayed, you will always still get 12 grids on every device.\n\
    \nThe column width itself does change, however, so you may need to plan the content\
    \ in those grids to take advantage of the differing sizes. The sizes for each\
    \ of them are as follows:\n\n- `**col-xs-*` = Auto sizing, no fixed dimensions\n\
    - `**col-sm-*` = 60 pixels\n- `**col-md-*` = 78 pixels\n- `**col-lg-*` = 95 pixels\n\
    \nThe gutter margin in all cases will remain at 15 pixels on each side of the\
    \ grid container, giving an overall gutter of 30 pixels. This size will be consistent\
    \ no matter which grid size you’re using.\n\nNesting and offsets work as they\
    \ did previously, but with the grids themselves, by slight renaming of the actual\
    \ classes used. To apply an offset, simply use `**col-md-offset-*`, remembering\
    \ to replace the `md` with `xs`, `sm`, or `lg` as needed, depending on your grid\
    \ size.\n\nNesting is done simply by nesting containers under control of the `**col-xx-*`\
    \ classes inside each other, where they will resize and behave as they did in\
    \ previous versions. The following examples show the correct way to achieve both\
    \ of these techniques:\n\n*Code Sample 5: Nested Grids in Version 3*\n\nThis example\
    \ will give you a grid that looks like the following:\n\n`<div class=\"col-md-9\"\
    >`\n` Level 1: .col-md-9 `\n` <br/>`\n`<div class=\"col-md-6\">`\n` Level 2: .col-md-6\
    \ `\n` </div>`\n` <div class=\"col-md-6\">`\n` Level 2: .col-md-6 `\n` </div>`\n\
    `</div>`\n\n*Code Sample 6: Offset Grids in Version 3*\n\nThis example will give\
    \ you a layout as follows:\n\nCol-md-4\nCol-md-4 col-offset-4\nCol-md-3 col-offset-3\n\
    Col-md-3 col-offset-3\nCol-md-6 col-offset-3\n\nBS3 also brings something new\
    \ to the table when it comes to offsetting and nesting, and that's something called\
    \ column ordering. If you want your columns to be presented in a different order\
    \ to how you define them in your HTML document, then you can use the new `**col-xx-pull-*`\
    \ and `**col-xx-push-*` classes to push or pull your grid layouts into the order\
    \ you want. For example:\n\n`<div class=\"col-md-4\">`\n` .col-md-4 `\n`</div>`\n\
    `<div class=\"col-md-4 col-offset-4\">`\n` .col-md-4 col-offset-4 `\n`</div>`\n\
    `<div class=\"col-md-3 col-offset-3\">`\n` .col-md-3 col-offset-3 `\n`</div>`\n\
    `<div class=\"col-md-3 col-offset-3\">`\n` .col-md-3 col-offset-3 `\n`</div>`\n\
    `<div class=\"col-md-6 col-offset-3\">`\n` .col-md-6 col-offset-3 `\n`</div>`\n\
    `<div class=\"col-md-8\">8 columns of content</div>`\n\nIf you render those in\
    \ your document, as expected, you'll get the following:\n\n8 columns of content\n\
    4 columns of content\n\nIf, however, you modify the above code to add push and\
    \ pull modifiers as follows: When you render your document, you should see your\
    \ layout change as follows:\n\n4 columns of content\n8 columns of content\n\n\
    Finally, if you’re using the Less CSS source versions of Bootstrap, you have complete\
    \ control over the grid sizes by changing the following variables:\n\n- `@grid-columns`:\
    \ controls the number of grids horizontally (default 12)\n- `@grid-gutter-width`:\
    \ the total margin around each grid (default 30 pixels)\n- `@grid-float-breakpoint`:\
    \ the minimum size below which we have “extra small” devices (default 768 pixels)\n\
    \nSo now that we have the new grid system under control, is there anything else\
    \ you need to know?\n\nThe more astute of you may be thinking, “But that's crazy—with\
    \ all those multiple sets of `<div>` elements and offsets with `**col-xx-xx` classes,\
    \ all for different size displays, I might as well just create four different\
    \ sites, with four different resolutions in mind!” To be honest, I wouldn't blame\
    \ you, except for one thing: each of these new layout size levels are designed\
    \ to work on the same markup, at the same time, and occupy the same space.\n\n\
    Let's take the code in the previous code sample 4, and rewrite it to do this the\
    \ recommended way:\n\n*Code Sample 7: The Recommended Way of Providing Multi-Resolution\
    \ Layouts*\n\n`<div class=\"col-md-4\">4 columns of content</div>`\n`<div class=\"\
    col-md-8 col-md-push-4\">8 columns of content</div>`\n`<div class=\"col-md-4 col-md-pull-8\"\
    >4 columns of content</div>`\n\n`<div class=\"container\"> `\n` <div class=\"\
    col-xs-2 col-sm-2 col-md-2 col-lg-2\">Content here</div>`\n` <div class=\"col-xs-10\
    \ col-sm-10 col-md-10 col-lg-10\">Content here</div>`\n`</div>`\n"
  mdcn: "\n\n*代码示例 1：版本 2 灵活容器*\n\n在版本 3 中，`**container**` 和 `**row-fluid` 类已不再存在。\n\
    \n那么，如何获取流式容器呢？简单：你不需要了。\n\n与其将内容包裹在 `**container**` 然后是 `**row` 中，你只需简单地将它们包裹在任何元素中。\n\
    \n你仍然可以使用网格系统为你的内容提供包含容器，以便内容能够与 Bootstrap 的网格良好对齐，但你不再需要在使用这些 `**<div>` 元素集合之前在它们外面套一个容器了。\n\
    \n事实上，如果你使用 `**container**` 和 `**row`（非流式版本仍然存在），你最终将导致所有内容都自动放置在 1024 像素的中央列中，而如果不使用它们，则可以使用整个页面的宽度。\n\
    \n## 迁移网格系统\n\n接下来的主要类变化是网格系统本身。\n\n在版本 2 中，你通常以以下方式创建网格：\n\n*代码示例 2：版本 2 网格类*\n\
    \n这段代码将为你提供两个容器，它们在水平方向上整齐地填充了所有布局拥有的 12 个网格（通常是一个侧边栏）。\n\n在版本 3 中，“中级”网格现在等同于\
    \ v2 的 `**span**` 类，因此要重写之前的代码以适配 V3，你只需执行以下操作：\n\n*代码示例 3：等同于 'Span' 的版本 3 网格类*\n\
    \n`<div class=\"container-fluid\" id=\"myParentContainer\"> `\n` <div class=\"\
    row-fluid\" id=\"mycontentrow\"> `\n` <h1>A headline</h1> `\n` <p>Some paragraph\
    \ text</p> `\n` </div> `\n`</div> ` \n` `\n`<div class=\"container\"> `\n` <div\
    \ class=\"span2\">Content here</div>` \n` <div class=\"span10\">Content here</div>`\
    \ \n`</div> ` \n` `\n`<div class=\"container\"> `\n` <div class=\"col-md-2\">Content\
    \ here</div>` \n\n然而，与版本 2 不同的是，版本 2 只有一个级别的网格大小，而版本 3 现在有四个级别。每个级别都是为你预期终端产品运行的预期目标设备量身定制的。\n\
    \n这些网格单元现在的命名如下：\n\n- 极小设备：`**col-xs-*`\n- 小设备：`**col-sm-*`\n- 中等设备：`**col-md-*`\n\
    - 大设备：`**col-lg-*`\n\nBS3 内部使用媒体查询来决定使用上述的哪类网格类，不同尺寸定义如下：\n\n- 极小：显示宽度小于 768 像素\n\
    - 小：显示宽度大于或等于 768 像素，或小于 992 像素\n- 中等：显示宽度大于或等于 992 像素，或小于 1,200 像素\n- 大：显示宽度大于或等于\
    \ 1,200 像素\n\n你可以为 BS3 编写多个版本的网格，以便在针对多个显示器时决定使用哪类型。例如，如果你执行了以下操作：\n\n*代码示例 4：多个网格大小声明*\n\
    \n`<div class=\"col-md-10\">Content here</div>`\n`</div>` \n` `\n`<div class=\"\
    container\"> `\n` <div class=\"col-xs-2\">Content here</div>`\n` <div class=\"\
    col-xs-10\">Content here</div>`\n` <div class=\"col-sm-2\">Content here</div>`\n\
    ` <div class=\"col-sm-10\">Content here</div>`\n` <div class=\"col-md-2\">Content\
    \ here</div>`\n` <div class=\"col-md-10\">Content here</div>`\n` <div class=\"\
    col-lg-2\">Content here</div>`\n` <div class=\"col-lg-10\">Content here</div>`\n\
    `</div>` \n` `\n\nBS3 将根据设备显示宽度和媒体查询的操作，按需要隐藏和显示容器。\n\n与之前的网格系统相同，在所有不同尺寸中，水平方向上都有\
    \ 12 列，因此无论显示的是哪种网格大小，你在每个设备上始终始终会获得 12 个网格。\n\n然而，列的宽度本身发生了变化，因此你可能需要规划这些网格中的内容，以利用不同尺寸的优势。它们的尺寸如下：\n\
    \n- `**col-xs-*` = 自动调整大小，无固定尺寸\n- `**col-sm-*` = 60 像素\n- `**col-md-*` = 78 像素\n\
    - `**col-lg-*` = 95 像素\n\n在所有情况下，间隙边缘（gutter）将保持在网格容器两侧的 15 像素，总间隙为 30 像素。无论你使用哪种网格大小，此尺寸将保持一致。\n\
    \n嵌套和偏移的工作方式与之前相同，但网格本身通过对实际使用的类进行细微重命名来实现。应用偏移，只需使用 `**col-md-offset-*`，记得根据你的网格大小按需要将\
    \ `md` 替换为 `xs`、`sm` 或 `lg`。\n\n嵌套只需通过将容器嵌套在每个内部的 `**col-xx-*` 类控制下来实现，其中它们将调整大小并表现得与之前的版本相同。以下示例展示了实现这两种技术的正确方法：\n\
    \n*代码示例 5：嵌套网格*\n\n这将导致所有内容都自动放置在 1024 像素的中央列中，而如果不使用它们，则可以使用整个页面的宽度。\n\n*代码示例\
    \ 6：版本 3 中的偏移网格*\n\n这将导致所有内容都自动放置在 1024 像素的中央列中，而如果不使用它们，则可以使用整个页面的宽度。\n\n*代码示例\
    \ 7：提供多分辨率布局的推荐方法*\n\n"
