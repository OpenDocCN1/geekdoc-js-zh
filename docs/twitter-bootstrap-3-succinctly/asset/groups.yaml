  - "[PAGE 8]\n\n \n\n \n\n \n\n \n\n9 \n\n**Introduction **\n\nWelcome to the second\
    \ book in the *Succinctly* series that covers the Twitter Bootstrap (BS) UI \n\
    \nand CSS framework. \n\nIn my first book, I laid down the initial groundwork\
    \ and got you started with Bootstrap 2. \n\nSince that book was released, however,\
    \ Bootstrap 3 has become the mainstream version. \n\nIn this book we're going\
    \ to continue to build on that groundwork and move forward into using BS \n\n\
    v3. We'll look to see where things are different, and as we explore the new features,\
    \ we'll see \n\nthat a big chunk of what was present in v2 is still applicable\
    \ to v3. \n\nIf you've not yet read the first book on Bootstrap 2, then I encourage\
    \ you to do so, as I will be \n\nreferring to it at various points throughout\
    \ this book. \n\nThe style and layout in this book will also be slightly different\
    \ from the first one, in that it will be \n\nmore of an extension to the first\
    \ book rather than an independent book in its own right. \n\nWhy? I believe that\
    \ in order to understand the entire Bootstrap landscape, you need to examine \n\
    \nit from the beginning. You need to be able to understand what it set out to\
    \ achieve and how. \n\nYou will be able to pick up just this book and learn the\
    \ basics of BS v3, but you'll get a much \n\ndeeper, better understanding if you\
    \ read the v2 book first. \n\n**What's Changed **\n\nSo what's changed from v2\
    \ to v3? \n\nQuite a lot. \n\nThe major change between the two versions is that\
    \ v3 is now \"Mobile First.\" Bootstrap v2 was a \n\nresponsive layout CSS kit,\
    \ but its mobile and responsive features were always second place to \n\nits rich\
    \ UI features. In fact, in order to make the responsive stuff work correctly,\
    \ you had to \n\ninclude a second CSS file whose sole purpose was to enable the\
    \ responsive, mobile features \n\nand nothing else. \n\nIn v3 this whole situation\
    \ has been completely reversed. The entire framework is now mobile-\n\nfriendly\
    \ and responsive out of the box, and it now takes extra work to adapt your layouts\
    \ for \n\nlarger screen formats. Don't get me wrong—it's by no means a huge amount\
    \ of work. Most of \n\nwhat you need to change is still just simply swapping classes\
    \ about and structuring your HTML \n\nmark-up correctly. \n\nThe other major change\
    \ is in the naming of classes and API calls. Many of the class names that \n\n\
    were introduced in v2 are now either deprecated or have been renamed to something\
    \ more \n\nsuitable to their intended purpose."
  - "[PAGE 9]\n\n \n\n \n\n \n\n10 \n\nThere has also been a major effort to rename\
    \ classes to be more consistent. For example, in \n\nv2, for items that targeted\
    \ the RED error color, we had the following classes: \n\n \n\nButtons - `**btn-danger**`\
    \ \n\n \n\nText - `**text-error**` \n\n \n\nTable Rows - `**tr.error**` \n\n\
     \n\nLabels - `**.important**` \n\n \n\nBadges - `**.important **`\n\n \n\n\
    Alerts - `**.error**` \n\n \n\nProgress Bars - `**progress-danger**` \n\nNow,\
    \ in v3, these have be consolidated so that naming is similar across all components\
    \ as \n\nfollows: \n\n \n\nButtons - `**btn-danger**` \n\n \n\nText - `**text-danger**`\
    \ \n\n \n\nTable Rows - `**.danger**` \n\n \n\nLabel, Badge, Alert - `**.danger**`\
    \ \n\n \n\nProgress Bars - `**progress-bar-danger**` \n\nAs you can see, consistency\
    \ is now a major player in the v3 classes, and many other similar \n\nchanges\
    \ have been made across the entire framework. \n\nThere have been quite a few\
    \ minor changes too. For example, the box-model used by Bootstrap \n\nhas now\
    \ been improved considerably, with all elements now using `**border-box**` as\
    \ the default \n\nCSS box sizing model. \n\nThe grid system has been extended\
    \ and improved too, and instead of being one monolithic grid \n\nsystem with optional\
    \ classes, it’s now comprised of four tiers of grid sizes specifically aimed at\
    \ \n\nphones, tablets, desktops, and large desktops. \n\nAll the JavaScript stuff\
    \ has also now been name-spaced to reduce conflict with other JavaScript \n\n\
    code; the available events are now better named to reflect their purpose and are\
    \ much more \n\nclearly documented. \n\n`**Modals**` and `**Navbars**` have been\
    \ vastly improved in terms of responsiveness, and along with the \n\nclass-naming\
    \ changes, the sizing classes for all of the components (Inc Nav Modals) have\
    \ now \n\nbeen aligned. \n\nComponent-wise, some of the older, less frequently\
    \ used components have been deprecated \n\nand removed, the most notable of which\
    \ is the `**Accordion**` component. But don’t despair—the \n\naccordion has been\
    \ replaced with a brand new `**collapsible-panel**` component that's much \n\n\
    more flexible than its predecessor. \n\nWe also have a new, narrow `**jumbotron**`,\
    \ new `**panel**` types, list groups, and much more. \n\nFinally, the one change\
    \ that EVERYONE will notice is the look and feel: **TWB V3 is flat**. It has a\
    \ \n\nsingle colored, new interface, but with rounded corners flat."
- md: "\nThe hover classes no longer have nice graduated effects in them, and the\
    \ progress bars and \nbuttons no longer look semi-3D as they did in v2. Instead,\
    \ what the maintainers of Twitter \nBootstrap have decided to do is to make it\
    \ easier to customize the look and feel of the elements \nthat are in the CSS.\
    \ \n\nThe maintainers have even made available a “Bootstrap” theme that makes\
    \ v3 look like the \noriginal v2 design to get you started. In the last chapter\
    \ of this book, I'll show you how simple it \nnow is to override the various classes,\
    \ and show you how to overhaul the flat theme to take on \nyour own look and feel.\
    \ \n\nFor now though, if you want the v2 experience, you'll need to make sure\
    \ that you also include \nthe appropriate CSS file as required. If you want to\
    \ stick with the v3 default, you don't need \nanything extra. \n\n## New Installation\
    \ Methods\n\nWhen BS2 was first released, the only way of getting it was via a\
    \ download from the project \nwebsite. This was covered extensively in the first\
    \ book with an in-depth discussion of exactly \nwhich files were in the zip file\
    \ and why. \n\nBecause so many people were using Bootstrap, it didn't take long\
    \ before it was made available \nfor free on a CDN by the folks who run MaxCDN.\
    \ This tradition has continued into the v3 code \nbase, and you can now simply\
    \ get your chosen standard v3 installation by using the following \nHTML script\
    \ tags: \n\nIf you use the CDN versions, please remember that you will also need\
    \ to make sure you include \na recent copy of JQuery; none of the BS3 JS functionality\
    \ will work unless you do. \n\nAs well as the CDN link, there is now also a direct\
    \ download on the getbootstrap.com site, not \nonly for the standard JavaScript\
    \ & CSS bundle as described in the previous book, but also a \ndirect link to\
    \ a zip file of the original “Less” sources and a conversion to “Sass” for those\
    \ folks \nwho would like to be able to include a fully variable-based, customizable\
    \ version of the kit in \nyour own build system using tools like Grunt to automate\
    \ things. \n\nIn addition to the new sources, you can now also use Bower to install\
    \ everything you need using \nthe following from your project folders command\
    \ line: \n\n`bower install bootstrap `\n\n`<link rel=\"stylesheet\" href=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css\"\
    >` \n\n`<link rel=\"stylesheet\" href=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap-theme.min.css\"\
    >` \n\n`<script src=\"//netdna.bootstrapcdn.com/bootstrap/3.1.1/js/bootstrap.min.js\"\
    ></script>` \n\nBower is an HTML scaffolding and package system designed to automate\
    \ much of the \napplication boiler plate. You don’t need to understand it to understand\
    \ BS v3, but a quick \nGoogle search for “Bower” will turn up many references\
    \ to deepen your understanding. \n\nOn a similar note, BS v3 can also be installed\
    \ using the NuGet package manager if you’re \nworking in Visual Studio. Like Bower,\
    \ this will automate much of the process for installing and \nsetting up the required\
    \ files. Be careful though—there are many Bootstrap packages available \nin NuGet,\
    \ some of which will cause you more work than they save you. \n\nFinally, the\
    \ TWB customizer is still available at http://getbootstrap.com/customize/. It’s\
    \ been \ngreatly restructured and rebuilt to provide more options and an easier,\
    \ more intuitive look at \nwhat you’re changing and why. \n\nIn fact, it's now\
    \ so easy to change things using the customizer that your designer or design \n\
    team can do 90 percent of the work needed to set the colors and branding of your\
    \ download \nbefore the files required are even downloaded. This enables your\
    \ design department to start \nmaking color and layout choices immediately, while\
    \ you work on the page layouts and additional \ncode for the required interactivity.\
    \ Then, all that’s required is for you to simply replace your \ndefault files\
    \ with the files provided to you by your designers, and an instant theme change\
    \ \nshould occur. \n\n## Device Support\n\nOfficially, BS v3 only supports the\
    \ latest round of HTML 5-compliant browsers and Internet \nExplorer 10 and above.\
    \ \n\nIn reality, the framework also supports IE8 and IE9; however, there are\
    \ some features of CSS3 \nand HTML5 that don't quite work as expected. In particular,\
    \ if you want the responsive elements \nto work correctly, you'll need to use\
    \ `respond.js`, which you can download from the following \nGitHub repository:\
    \ https://github.com/scottjehl/Respond. \n\nOnce you add `respond.js` to your\
    \ project, it's basically just a general expectation to what was and \nwas not\
    \ added to the various browsers, at various times. \n\nThe parts that will be\
    \ most noticed as missing are as follows: \n\nFor IE8:\n- `border-radius` is NOT\
    \ supported\n- `box-shadow` is NOT supported\n- `transform` is NOT supported\n\
    - `transition` is NOT supported\n- `placeholder` text is NOT supported\n\nThis\
    \ essentially means that placeholder text in input elements won't show, and anything\
    \ that \nuses rounded corners or drop shadows, or has any kind of transition or\
    \ transformation on the \nelement, won't display correctly. \n\nFor IE9:\n- `border-radius`\
    \ IS supported\n- `box-shadow` IS supported\n- `transform` IS supported (but only\
    \ with `-ms-` prefix)\n- `transition` is NOT supported\n- `placeholder` text is\
    \ NOT supported\n\nThings are slightly improved where IE9 is concerned—rounded\
    \ corners and drop shadows are \nnow fine, and transformations will also work,\
    \ as long as they also have a -ms- prefix version. \nTransitions and placeholders\
    \ on the input elements, however, are still sadly missing. \n\nThe official support\
    \ matrix for the current version of BS3 in current browsers looks like this: \n\
    \n***Table 1: Official support matrix***\n\n| | Chrome | Firefox | IE | Opera\
    \ | Safari | Android | iOS |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| | Yes | Yes | Yes | Yes | Yes | Yes | Yes |\n| | No | No | No |\
    \ No | No | No | No |\n| | No | No | No | No | No | No | No |\n| | Yes | Yes |\
    \ Yes | Yes | Yes | Yes | Yes |\n| | No | No | No | No | No | No | No |\n| | Yes\
    \ | Yes | Yes | Yes | Yes | Yes | Yes |\n| | Yes | Yes | Yes | Yes | Yes | No\
    \ | No |\n| | Yes | Yes | Yes | Yes | Yes | Yes | Yes |\n\nIf you're targeting\
    \ IE8 and IE9, you will still need to make sure you use `respond.js`, even if\
    \ you \ndo disable responsiveness as outlined. \n\n## Migrating from Version 2\
    \ to Version 3\n\nSo what's involved in migrating from Bootstrap 2 to 3? In truth,\
    \ not a great deal. \nDespite the many changes, there's still not a huge amount\
    \ for you to actually change, and the \nchanges you need to make are generally\
    \ just class names. \n\nOne thing that you might want to do, especially if you've\
    \ been using BS only for general web \ndevelopment and not mobile or any kind\
    \ of responsive design, is to disable the responsive features in BS3.\n\nThis\
    \ is easy enough to do, but not at all recommended. \n\nYou can achieve this as\
    \ follows:\n\n- Do not add the tag containing containing device width and other\
    \ sizing info to the head of your document.\n- Do override the `width` on your\
    \ elements that are marked up with a class of `container`, and make sure you use\
    \ `style='width: xxx !important'` when you do.\n- Make sure that any width overrides\
    \ are processed AFTER the main Bootstrap CSS have been loaded.\n- Remove ALL collapsing\
    \ and expanding behaviors and rules from ALL `navbar` constructs within your document.\n\
    - Change all grid layout classes to use ONLY `col-xs-*` classes and none of the\
    \ other four levels.\n\nOlder IE compatibility modes will stop Bootstrap from\
    \ working completely, so be careful if you’re testing in emulation mode—the results\
    \ will most likely NOT be what you expect.\n\n## Class Changes\n\nAs I mentioned\
    \ earlier, there have been many class name changes between the two versions, \n\
    and many classes have been deprecated and withdrawn. \n\nOne thing that will (and\
    \ already has if you look at Stack Overflow) come as a surprise to many is the\
    \ \nwithdrawal of the fluid width classes. \n\nIn version 2, if you wanted a full-width\
    \ elastic container, then you had to do something like the \nfollowing:\n"
  mdcn: "\n悬停类（hover classes）不再具有精美的渐变效果，进度条和按钮也不再像 v2 版本中\n那样具有半 3D 效果。相反，Twitter\
