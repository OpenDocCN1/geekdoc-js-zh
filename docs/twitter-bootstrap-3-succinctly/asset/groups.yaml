- md: "\nThis markup should give you the following:\n\n*Figure 3: Output produced\
    \ by code sample 14*\n\nAs with BS2, the classes to add the optional styles to\
    \ a table, `table-striped`, `table-bordered`, `table-hover`, and `table-condensed`\
    \ work exactly the same as in BS2; these extra classes are added as secondary\
    \ classes to the main table class on the table element itself.\n\nThis code, for\
    \ example, will give you a table that has an outer border and alternating colors\
    \ on each table row.\n\nOne thing to note however, is that table striping now\
    \ uses the `:nth-child` pseudo selector, which means that it will no longer work\
    \ in IE8 or earlier without a poly-fill or other fix to help. The remainder of\
    \ the table classes for coloring your table rows have changed slightly. Firstly\
    \ there is a new class called `active`. Before BS3, the `active` class was not\
    \ available on all elements, but mainly just on navigation and button elements.\
    \ From BS3 onwards it can now be applied to a `<tr>` element to show that row\
    \ as a highlighted row, which by default is a light grey.\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_29_0.png)\n\
    \n```html\n<table class=\"table table-striped table-bordered\">\n  <thead>\n \
    \   <tr>\n      <th>Col A</th>\n      <th>Col B</th>\n      <th>Col C</th>\n \
    \   </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Val A</td>\n      <td>Val\
    \ B</td>\n      <td>Val C</td>\n    </tr>\n    <tr>\n      <td>Val A</td>\n  \
    \    <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n  </tbody>\n</table>\n```\n\
    \nThe remaining contextual classes, as with BS2, are designed to highlight the\
    \ table rows to show different conditions, and are the same, except for one small\
    \ change.\n\nThe class name representing a dangerous or negative action has been\
    \ renamed to `danger`. In BS2 the red class was named `error`. Other than that,\
    \ the classes are applied the same way to the `<tr>` element as the following\
    \ code shows:\n\n*Code Sample 15: Optional Row Colorings*\n\nWhen rendered, it\
    \ should look something like this:\n\n```html\n<table class=\"table\">\n  <thead>\n\
    \    <tr>\n      <th>Class</th>\n      <th>Col B</th>\n      <th>Col C</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr class=\"active\">\n      <td>Active</td>\n\
    \      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n    <tr class=\"success\"\
    >\n      <td>Success</td>\n      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n\
    \    <tr class=\"info\">\n      <td>Info</td>\n      <td>Val B</td>\n      <td>Val\
    \ C</td>\n    </tr>\n    <tr class=\"warning\">\n      <td>Warning</td>\n    \
    \  <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n    <tr class=\"danger\">\n\
    \      <td>Danger</td>\n      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n\
    \  </tbody>\n</table>\n```\n\n*Figure 4: Output produced by code sample 15*\n\n\
    There are two new additions to the classes used to support tables. First, there\
    \ is a new responsive class that takes into account the size of your grid system\
    \ and provides either vertical scroll bars or a realigned table to fit differing\
    \ size displays. Secondly, there’s the ability to use the aforementioned colored\
    \ row classes on individual cells, rather than just entire rows, as was the case\
    \ in BS2.\n\nTo use the coloring classes on a cell level, you just need to add\
    \ the classes to individual `<td>` or `<th>` elements as follows:\n\n*Code Sample\
    \ 16: Applying the Option Row Classes to Individual Cells*\n\nThis code should\
    \ result in the following:\n\n*Figure 5: Output generated by code sample 16*\n\
    \nThe final table-related addition is a class called `table-responsive`, which\
    \ you can use by applying it to a `<div>` element that wraps the entire `<table>`\
    \ as follows:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_31_0.png)\n\n```html\n\
    <div class=\"table-responsive\">\n  <table class=\"table\">\n    <thead>\n   \
    \   <tr>\n        <th class=\"active\">Class</th>\n        <th class=\"success\"\
    >Col B</th>\n        <th class=\"info\">Col C</th>\n      </tr>\n    </thead>\n\
    \    <tbody>\n      <tr>\n        <td class=\"warning\">Val A</td>\n        <td\
    \ class=\"danger\">Val B</td>\n        <td>Val C</td>\n      </tr>\n    </tbody>\n\
    \  </table>\n</div>\n```\n\n*Code Sample 17: New BS3 Responsive Table*\n\nWhen\
    \ this new class is used on a display greater than 768 pixels (that is, any display\
    \ sizing other than `-xs`), the table display will behave like a normal table.\
    \ However, if the table is displayed on a device that targets `-xs` and is less\
    \ than 768 pixels, the container will be altered so that a vertical scroll is\
    \ available, allowing the entire table to be moved left and right without affecting\
    \ the rest of the page\n\n*Figure 6: Output from code sample 17 on a device greater\
    \ than 768 pixels in width*\n\n*Figure 7: Output from code sample 17 on a device\
    \ less than 768 pixels in width*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_32_0.png)\n\
    \n```html\n<div class=\"table-responsive\">\n  <table class=\"table table-bordered\"\
    >\n    <thead>\n      <tr>\n        <th>Col A</th>\n        <th>Col B</th>\n \
    \       <th>Col C</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n \
    \       <td>Val A</td>\n        <td>Val B</td>\n        <td>Val C</td>\n     \
    \ </tr>\n    </tbody>\n  </table>\n</div>\n```\n\n## Form Changes\n\nAs with BS2,\
    \ all normal form elements by default have a minimum level of markup that gives\
    \ them a base style. This means that simply marking up a normal form tag and associated\
    \ controls will give your form the default look and feel.\n\nTake the following\
    \ example:\n\n*Code Sample 18: Basic BS3 Form with no Classes*\n\nIf we render\
    \ this example in a browser, we'll see that we get a reasonably good output without\
    \ adding any extra classes, as you can see in the following image:\n\nOutput generated\
    \ by code sample 18\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_33_0.png)\n\n\
    ```html\n<form>\n  <div>\n    <label for=\"exampleInputEmail1\">Email address</label>\n\
    \    <input type=\"email\" id=\"exampleInputEmail1\" placeholder=\"Enter email\"\
    >\n  </div>\n  <div>\n    <label for=\"exampleInputPassword1\">Password</label>\n\
    \    <input type=\"password\" id=\"exampleInputPassword1\" placeholder=\"Password\"\
    >\n  </div>\n  <div>\n    <label for=\"exampleInputFile\">File input</label>\n\
    \    <input type=\"file\" id=\"exampleInputFile\">\n    <p>Example block-level\
    \ help text here.</p>\n  </div>\n  <div>\n    <label>\n      <input type=\"checkbox\"\
    > Check me out\n    </label>\n  </div>\n  <button type=\"submit\">Submit</button>\n\
    </form>\n```\n\nNote: Since the previous example was written, there has been a\
    \ minor update to the BS3 code. If you try the example as it is written here,\
    \ the output will likely not look as expected. The change that has been made in\
    \ BS3 seems to now mean that just marking up a form without any BS3 classes will\
    \ not have the effect of giving the form a consistent look and feel. I’ve left\
    \ the example in this book, as it agrees with the information that is still present\
    \ on the documentation site, and as such still appears to be the official advice\
    \ by the framework authors.\n\nAs I mentioned in the migration section, the classes\
    \ and components around HTML forms have been some of the biggest casualties when\
    \ it comes to class name changes, but this is for a good reason. Before BS3, many\
    \ of the classes used for forms were narrow in scope—there were individual classes\
    \ for many purposes, rather than a single class that covered bases. For example,\
    \ there were separate classes to handle the alignments of check boxes and radio\
    \ buttons, and there where separate classes to handle input boxes and text areas\
    \ with respect to their row alignment. In BS3 many of these classes have been\
    \ deleted and are now all rolled up under a smaller number of classes and elements.\n\
    \nTaking our previous example and adding in the recommended markup as shown in\
    \ the BS3 documentation gives us the following:\n\n*Code Sample 19: Basic BS3\
    \ Form from Sample 18 with Recommended Classes Added*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_34_0.png)\n\
    \n```html\n<form role=\"form\">\n  <div class=\"form-group\">\n    <label for=\"\
    exampleInputEmail1\">Email address</label>\n    <input type=\"email\" class=\"\
    form-control\" id=\"exampleInputEmail1\" placeholder=\"Enter email\">\n  </div>\n\
    \  <div class=\"form-group\">\n    <label for=\"exampleInputPassword1\">Password</label>\n\
    \    <input type=\"password\" class=\"form-control\" id=\"exampleInputPassword1\"\
    \ placeholder=\"Password\">\n  </div>\n  <div class=\"form-group\">\n    <label\
    \ for=\"exampleInputFile\">File input</label>\n    <input type=\"file\" id=\"\
    exampleInputFile\">\n    <p class=\"help-block\">Example block-level help text\
    \ here.</p>\n  </div>\n  <div class=\"checkbox\">\n    <label>\n      <input type=\"\
    checkbox\"> Check me out\n    </label>\n  </div>\n  <button type=\"submit\" class=\"\
    btn btn-default\">Submit</button>\n</form>\n```\n"
  mdcn: "\n\n此标记将为您呈现以下内容：\n\n*图 3：代码示例 14 的输出*\n\n与 BS2 一样，为表格添加可选样式的类 `table-striped`、`table-bordered`、`table-hover`\
    \ 和 `table-condensed` 的工作方式与 BS2 完全相同；这些额外的类作为次要类添加到表格元素本身的主表格类中。\n\n例如，这段代码将为您生成一个具有外边框且每行交替颜色的表格。\n\
    \n然而，需要注意的是，表格条纹现在使用 `:nth-child` 伪选择器，这意味着在没有补丁（poly-fill）或其他修复帮助的情况下，它将无法在 IE8\
