    \ on extra-small screens\n- `visible-sm` - Make visible on small screens\n- `visible-md`\
    \ - Make visible on medium screens\n- `visible-lg` - Make visible on extra large\
    \ screens\n- `hidden-xs` - Hide on extra-small screens\n- `hidden-sm` - Hide on\
    \ small screens\n- `hidden-md` - Hide on medium screens\n- `hidden-lg` - Hide\
    \ on large screens\n\nThe widths of the devices and the associated trigger points\
    \ are the same as those used in the grid system in general, with `-xs` covering\
    \ palm-sized tablet phones and smaller, `-sm` covering average-to-large tablets,\
    \ `-md` covering most desktop computers, and `-lg` covering wide-screen desktops.\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_52_0.png)\n\n`<div class=\"col-md-9\
    \ hidden-sm\" style=\"border-left: 1px solid black\">`\n\nThere are two final\
    \ classes used in this category to assist you with handling display vs. print-based\
    \ layouts.\n\nYou can use `visible-print` and `hidden-print` in exactly the same\
    \ manner as the size-based classes above, but this time making an element visible\
    \ and invisible when a page is sent to the printer.\n\n## Chapter 4 Changed Components\
    \ Features\n\n## Glyphicon Changes\n\nThe biggest news with the components provided\
    \ by BS3 is the Glyphicons icon set. When V3.0 beta was first released, the Glyphicons\
    \ font that forms the core of the icon set in BS3 was removed. The community was\
    \ up in arms about this, especially when the icon set was split into its own repository.\n\
    \nThe split was short-lived, however, and from the production release onwards,\
    \ the Glyphicons font was reinstated into the main branch, but with one new bonus.\n\
    \nNo longer is the icon set made up of a set of bitmapped `png`s in white and\
    \ black—it's now a fullscale, vector-based font set, with `ttf`, `svg`, `woff`\
    \ and other formats. Because it's a vector now, it can easily be colored using\
    \ standard CSS-based color techniques, and can now be scaled to any size required.\n\
    \nIn the current build of BS3, there are 200 or more icons to choose from, covering\
    \ lots of different use cases. To use an icon, you simply add the class `glyphicon`\
    \ and a `glyphicon-xxxxx` to select the actual icon you want to use. Then, you\
    \ add this to a span class that's nested inside of the element you wish to display\
    \ the icon in.\n\nOne rule you must obey with glyphicons is that you cannot mix\
    \ the icon content with any other element. You must make sure that the icon class\
    \ is applied only to its own element, and with enough padding around it to ensure\
    \ sufficient space between it and any other content next to it.\n\nThe following\
    \ code gives you a simple overview on how to use the glyphicon classes:\n\n*Code\
    \ Sample 32: BS3 Glyphicons Sample*\n\n`<h1>This is header text <small>with some\
    \ small text and an icon <span class=\"glyphicon glyphicon-home\"></span></small></h1>`\n\
    \n`<p>This is a normal paragraph, which again like the header has an icon inline\
    \ with it <span class=\"glyphicon glyphicon-headphones\"></span></p>`\n\n`<div\
    \ style=\"background-color: beige; width: 200px; height: 200px; padding: 4px;\"\
    >`\n`<p>This is an absolute size div with a scaled up icon in it</p>`\n`<span\
    \ class=\"glyphicon glyphicon-road\" style=\"font-size: 150px;\"></span>`\n`</div>`\n\
    \n`<p class=\"text-success\">This is a normal paragraph, with a different color\
    \ applied to it <span class=\"glyphicon glyphicon-cog\"></span></p>`\n\n*Figure\
    \ 25: Output produced by code sample 32*\n\nThere are far too many available icons\
    \ to list them all here, but if you go to http://getbootstrap.com/components/#glyphicons-how-to-use,\
    \ you’ll find a grid complete with all the class names required to get the icon\
    \ you need.\n\nThe icons work correctly in any container you add them to, and\
    \ they respect the sizing classes too. So, for example, if you add one inside\
    \ a `<button>` element that has a `btn-lg` class attached to it, the icon will\
    \ scale as required to match the button size.\n\n## Button Changes\n\nChanges\
    \ to buttons in BS3 are very minimal from a component point of view. There are\
    \ a few new classes and recommendations, and some changes to their look and feel\
    \ as mentioned, but otherwise, everything you did in BS2 should still work as\
    \ expected.\n\nFrom a component point of view, the `btn-group` and `btn-toolbar`\
    \ classes are still the same, but it is now recommended that where possible, you\
    \ try to ensure that you group buttons using `btn-group`. Also, when marking up\
    \ toolbars, you should try to make sure you have `btn-toolbar` applied to them.\n\
    \nFrom a component point of view, the `btn-group` and `btn-toolbar` classes are\
