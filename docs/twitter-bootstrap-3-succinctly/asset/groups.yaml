    *图 76：由示例 72 生成的模态示例*


    为了显示模态框（modal），你首先需要一个触发目标。在示例 72 中，目标是标记为 `**Show Modal Dialog**` 的按钮。要使触发动作生效，必须为它分配一个
    `toggle` 和 `target` 数据属性，并且 `toggle` 的值必须设为 `**modal**`，以表示它指向的是一个模态对话框。目标必须将最外层
    `<div>` 的 ID 选择器分配给它。在示例 72 中，最外层的 `<div>` 具有 `ID="myModal"`，这意味着 `target` 数据属性的值应该是
    `#myModal**`。


    你的触发器并不非得是一个按钮；它可以是任何可以接收（或已设置好接收）鼠标点击事件的元素，只要提供了 `toggle` 和 `target` 数据属性即可。


    一旦进入模态框本身，你会看到其结构由许多深层嵌套的 `<div>` 组成。由于这种嵌套，建议你将对话框/模态的定义创建并放置在尽可能靠近根节点（body root）的地方；如果不这样做，其他组件和
    HTML 结构可能会导致你未预料到的布局问题。


    你还会注意到，这里有一个共同的主题，即通过标记来使其对屏幕阅读器友好。再次，我必须强调这一点：你应该尽一切努力确保你的标记尽可能对无障碍工具（accessibility
    tools）友好。


    模态框从一个外层 `<div>` 开始，并对其应用 `modal` 类。可选的是，你还可以添加 `fade` 类，这会在模态框显示和隐藏时提供一个平滑的过渡效果。这个外层
    `<div>` 应该是你设置 `Z-Order` 以及任何你希望进行的全局模态自定义的元素。


    下一个的 `<div>` 应该添加 `modal-dialog` 类。在那个 `<div>` 之后，紧接着应该是分配了 `modal-content` 类的第三个
    `<div>`。你实际放置模态内容定义的地方就是这第三个 `<div>` 内部。


    ![](img/3ef3f89d48533001235bf8b5b1e48737_96_0.png)


    </div>

    </div>

    </div>




    一旦定义了模态内容的外壳，你就可以在其中放置带有以下类的三个 `<div>` 元素：`modal-header`、`modal-body` 和 `modal-footer`。这三个内部部分**不应该**嵌套，而是应该作为彼此的兄弟元素添加到标记中，它们被用于定义对话框的三个主要部分的内容。


    你可以从示例 72 的代码中看到，我们包含了一个关闭叉，就像我们之前处理警告框（alert boxes）一样。这个关闭叉与我们之前看到的唯一区别是，`dismiss`
    数据属性的值是 `modal` 而不是 `alert`。在内层模态标记中放置的任何具有此数据属性及其值的可点击元素，在点击时都会关闭对话框。


    除了关闭图标外，模态的其余内部内容只是普通的 BS3 标记和 CSS。你可以在其他地方使用的任何内容都可以在模态框内使用，如果它对于屏幕来说太高，你将获得一个会自动切换为滚动元素的内部容器。还有两个可选的宽度尺寸；它们被添加到内部的
    `modal-dialog` `<div>` 中，别为 `modal-lg` 和 `modal-sm`。大尺寸类会将模态框的宽度扩展到屏幕宽度的一半（适用于表格和列表），而小尺寸类会将默认宽度缩小到原始尺寸的大约一半（适用于如“是/否”提示等内容）。


    你也可以以标准的 jQuery 方式使用 JavaScript API 初始化模态框；如果你想更改默认选项的行为，那么使用 JQ 构造函数是唯一的方法。


