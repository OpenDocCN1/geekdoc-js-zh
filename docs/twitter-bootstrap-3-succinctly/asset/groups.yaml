  - "[PAGE 33]\n\n \n\n \n\n \n\n34 \n\n**Form Changes **\n\nAs with BS2, all normal\
    \ form elements by default have a minimum level of markup that gives \n\nthem\
    \ a base style. This means that simply just marking up a normal form tag and associated\
    \ \n\ncontrols will give your form the default Bootstrap look and feel. \n\nTake\
    \ the following example: \n\n*Code Sample 18: Basic BS3 Form Example with no Classes\
    \ *\n\nIf we render this example in a browser, we'll see that we get a reasonably\
    \ good output without \n\nadding any extra classes, as you can see in the following\
    \ image: \n\n \n\nOutput generated by code sample 18 \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_33_0.png)\n\
    \n`<form> `\n\n` <div> `\n\n` <label for=\"exampleInputEmail1\">Email address</label>\
    \ `\n\n` <input type=\"email\" id=\"exampleInputEmail1\" placeholder=\"Enter email\"\
    > `\n\n` </div> `\n\n` <div> `\n\n` <label for=\"exampleInputPassword1\">Password</label>\
    \ `\n\n` <input type=\"password\" id=\"exampleInputPassword1\" placeholder=\"\
    Password\"> `\n\n` </div> `\n\n` <div> `\n\n` <label for=\"exampleInputFile\"\
    >File input</label> `\n\n` <input type=\"file\" id=\"exampleInputFile\"> `\n\n\
    ` <p>Example block-level help text here.</p> `\n\n` </div> `\n\n` <div> `\n\n\
    ` <label> `\n\n` <input type=\"checkbox\"> Check me out `\n\n` </label> `\n\n\
    ` </div> `\n\n` <button type=\"submit\">Submit</button> `\n\n`</form> `\n\n` `"
  - "[PAGE 34]\n\n \n\n \n\n \n\n \n\n35 \n\n \n\n***Note: Since the previous example\
    \ was written, there has been a minor update to the BS3 ***\n\n***code. If you\
    \ try the example as it is written here, the output will likely not look as expected.\
    \ ***\n\n***The change that has been made in BS3 seems to now mean that just marking\
    \ up a form ***\n\n***without any BS3 classes will not have the effect of giving\
    \ the form a consistent look and ***\n\n***feel. I‘ve left the example in this\
    \ book, as it agrees with the information that is still present ***\n\n***on the\
    \ documentation site, and as such still appears to be the official advice by the\
    \ ***\n\n***framework authors. ***\n\nAs I mentioned in the migration section,\
    \ the classes and components around HTML forms have \n\nbeen some of the biggest\
    \ casualties when it comes to class name changes, but this is for a \n\ngood reason.\
    \ \n\nBefore BS3, many of the classes used for forms were very narrow in scope—there\
    \ were \n\nindividual classes for many individual purposes, rather than a single\
    \ class that covered many \n\nbases. For example, there were separate classes\
    \ to handle the alignments of check boxes and \n\nradio buttons, and there where\
    \ separate classes to handle input boxes and text areas with \n\nrespect to their\
    \ row alignment. \n\nIn BS3 many of these classes have been deleted and are now\
    \ all rolled up under a smaller \n\nnumber of classes and elements. \n\nTaking\
    \ our previous example and adding in the recommended markup as is shown in the\
    \ BS3 \n\ndocumentation gives us the following: \n\n*Code Sample 19: Basic BS3\
    \ Form from Sample 18 with Recommended Classes Added *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_34_0.png)\n\
    \n`<form role=\"form\"> `\n\n` <div class=\"form-group\"> `\n\n` <label for=\"\
    exampleInputEmail1\">Email address</label> `\n\n` <input type=\"email\" class=\"\
    form-control\" id=\"exampleInputEmail1\" `\n\n`placeholder=\"Enter email\"> `\n\
    \n` </div> `\n\n` <div class=\"form-group\"> `\n\n` <label for=\"exampleInputPassword1\"\
    >Password</label> `\n\n` <input type=\"password\" class=\"form-control\" id=\"\
    exampleInputPassword1\" `\n\n`placeholder=\"Password\"> `\n\n` </div> `\n\n` <div\
    \ class=\"form-group\"> `\n\n` <label for=\"exampleInputFile\">File input</label>\
    \ `\n\n` <input type=\"file\" id=\"exampleInputFile\"> `\n\n` <p class=\"help-block\"\
    >Example block-level help text here.</p> `\n\n` </div> `\n\n` <div class=\"checkbox\"\
    > `\n\n` <label> `\n\n` <input type=\"checkbox\"> Check me out `\n\n` </label>\
    \ `\n\n` </div> `\n\n` <button type=\"submit\" class=\"btn btn-default\">Submit</button>\
    \ `\n\n`</form> `\n\n` `"
- md: "\nExternally, if you render this code, you'll see no difference to the output\
    \ generated for sample 18. Internally, however, Bootstrap can now find and work\
    \ with individual elements much more easily than it could previously.\n\nIn BS2\
    \ there was no requirement to group controls unless you wanted to work with the\
    \ automatic validation classes. There’s still no absolute requirement to use them,\
    \ but doing so allows BS to resize and reposition things correctly when using\
    \ its grid (among many other things). You'll also note that each control now has\
    \ just a single `form-control` class assigned to it, rather than many different\
    \ ones targeting different aspects.\n\nAlso note that the form tag itself now\
    \ has a `role` assigned to it. This, apart from being good practice all around,\
    \ is now enforced by BS3 to help with aria roles and standards guiding the use\
    \ of web apps by people with disabilities.\n\nLastly, if you look at the `<p>`\
    \ tag with a `help-block`, you'll notice that that is also now used for inline\
    \ form text in all cases, whereas in BS2 we had a number of different classes,\
    \ such as `form-info`.\n\nUnfortunately there is still one area in the support\
    \ for forms that's missing—the file upload control. Like BS2, this is due to the\
    \ fact that security in all the current crop of browsers restricts the ability\
    \ to style file input controls to match the rest of the input controls available.\n\
    \nAs I mentioned in the previous book, however, there are still third-party additions\
    \ out there that have this area covered, and because you can now manufacture your\
    \ own upload system using the HTML5 classes, strictly speaking you don't need\
    \ the file upload control—you can manufacture your own.\n\nIn BS2 there were a\
    \ number of specific form types such as the `search-form`; under BS3 all of these\
    \ have been rolled up into three main types of form. First, you have the standard\
    \ form; as we've seen, this is a normal form with no extra classes added to the\
    \ form tag. The two other form types are `form-inline` and `form-horizontal`.\n\
    \nThe `form-inline` class is designed for forms in small, limited height places\
    \ such as menu and navigation bars. A word of warning though: all input elements\
    \ in this class and the other form types are sized 100 percent by default, so\
    \ if you need the form to only take up a small amount of room (particularly in\
    \ nav bar forms), you will need to put manual sizes on the individual controls.\n\
    \nIn the example from code sample 19, adding `form-inline` or `form-horizontal`\
    \ in turn should change your basic form layout to look like the following:\n\n\
    *Figure 8: Form produced by code sample 19 with the `form-inline` class added\
    \ to the form tag.*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_35_0.png)\n\n\
    The `form-horizontal` class is used to create regular top-down forms with input\
    \ controls that have their associated labels to the left of them, rather than\
    \ above them as the default form does. Be aware, however, that in order for form\
    \ horizontal to work correctly, you need to add a little extra markup to the form\
    \ in general, as shown in the following code sample.\n\n*Note: In today's brave\
    \ new world of HTML 5, it's more important than ever to mark input elements up\
    \ correctly with an associated label. Because disadvantaged users may be using\
    \ aids to assist them, not providing the required pieces to allow these aids to\
    \ work correctly will, going forward, be seen as a bad thing, and companies leaving\
    \ them up could be shunned for doing so. Not to worry though—BS3 has you covered.\
    \ If you decide you don't want labels in your forms, you can mark them with an\
    \ optional class, sr-only. Adding this class will visually prevent the label or\
    \ associated help text from appearing in your document, but will ensure that it\
    \ is marked up in such a way as to be visible by screen readers and other similar\
    \ devices or software.*\n\n*Code Sample 20: The Code from Sample 19 Marked Up\
    \ with Extra Classes to Support Form-Horizontal*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_36_0.png)\n\
    \n```html\n<form role=\"form\" class=\"form-horizontal\">\n  <div class=\"form-group\"\
    >\n    <label for=\"exampleInputEmail1\" class=\"col-sm-2 control-label\">Email\
    \ address</label>\n    <div class=\"col-sm-10\">\n      <input type=\"email\"\
    \ class=\"form-control\" id=\"exampleInputEmail1\" placeholder=\"Enter email\"\
    >\n    </div>\n  </div>\n  <div class=\"form-group\">\n    <label for=\"exampleInputPassword1\"\
    \ class=\"col-sm-2 control-label\">Password</label>\n    <div class=\"col-sm-10\"\
    >\n      <input type=\"password\" class=\"form-control\" id=\"exampleInputPassword1\"\
    \ placeholder=\"Password\">\n    </div>\n  </div>\n  <div class=\"form-group\"\
    >\n    <label for=\"exampleInputFile\" class=\"col-sm-2 control-label\">File input</label>\n\
    \    <div class=\"col-sm-10\">\n      <input type=\"file\" id=\"exampleInputFile\"\
    >\n      <p class=\"help-block\">Example block-level help text here.</p>\n   \
    \ </div>\n  </div>\n  <div class=\"form-group\">\n    <div class=\"col-sm-offset-2\
    \ col-sm-10\">\n      <div class=\"checkbox\">\n        <label>\n          <input\
    \ type=\"checkbox\"> Remember me\n        </label>\n      </div>\n    </div>\n\
    \  </div>\n  <div class=\"form-group\">\n    <div class=\"col-sm-offset-2 col-sm-10\"\
    >\n```\n\nIf you render the code from this example in your browser, it should\
    \ look like the following:\n\n*Figure 9: Output displayed from code sample 20\
    \ showing our form marked up as horizontal.*\n\nAs you can see from the code in\
    \ sample 20, the extra markup is not really that much more, and most of it exists\
    \ just to line up the columns correctly so that everything sits nicely.\n\nThe\
    \ main points to be aware of in sample 20 are:\n\n1. All label controls now have\
    \ a class of `control-label` added. This is not required for the other form types,\
    \ and BS2 will simply ignore it.\n2. Any input control that will likely render\
    \ as a block-level element is now wrapped in a parent `<div>` in order to control\
    \ its width using the grid system.\n3. The extra class for `form-horizontal` is\
    \ applied to the outer-most form tag.\n\nFor the rest of the classes and associated\
    \ parts in the section, nothing else has changed. However, from an actual point\
    \ of view, input controls, as in BS2, are stacked by default. If you wish to have\
    \ them vertically, you need to use `checkbox-inline` and `radio-inline` classes\
    \ as follows:\n\n*Code Sample 21: Inline Box and Radio Buttons in BS3*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_37_0.png)\n\
    \n```html\n<form>\n  <div class=\"row\">\n    <label class=\"checkbox-inline\"\
    ><input type=\"checkbox\" id=\"inlineCheckbox1\" value=\"option1\"> 1</label>\n\
    \    <label class=\"checkbox-inline\"><input type=\"checkbox\" id=\"inlineCheckbox2\"\
    \ value=\"option2\"> 2</label>\n    <label class=\"checkbox-inline\"><input type=\"\
    checkbox\" id=\"inlineCheckbox3\" value=\"option3\"> 3</label>\n  </div>\n  <div\
    \ class=\"row\">\n    <label class=\"radio-inline\"><input type=\"radio\" id=\"\
    inlineRadio\" value=\"option1\"> 1</label>\n    <label class=\"radio-inline\"\
    ><input type=\"radio\" id=\"inlineRadio\" value=\"option2\"> 2</label>\n    <label\
    \ class=\"radio-inline\"><input type=\"radio\" id=\"inlineRadio\" value=\"option3\"\
    > 3</label>\n  </div>\n</form>\n```\n\nRendering sample 21 in your browser should\
    \ look something like the:\n\n*Figure 10: Output produced by sample 21*\n\nSelect\
    \ and multi-select boxes are marked up with standard styles just by using elements;\
    \ this is no change from BS2, where the markup and style is identical.\n\nOne\
    \ new style that has been introduced in BS3 is the static control. In BS2, you\
    \ often had to use a disabled form control to represent static data that could\
    \ not be changed. BS3 changes this by providing a `form-control-static` class\
    \ that can be applied to individual controls in place of the `form-control`, as\
    \ the following code shows:\n\n*Code Sample 22: How to Create Static Input Component\
    \ in BS3*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_38_0.png)\n\n```html\n<form\
    \ class=\"form-horizontal\" role=\"form\">\n  <div class=\"form-group\">\n   \
    \ <label class=\"col-sm-2 control-label\">Email</label>\n    <div class=\"col-sm-10\"\
    >\n      <p class=\"form-control-static\">email@example.com</p>\n    </div>\n\
    \  </div>\n  <div class=\"form-group\">\n    <label for=\"inputPassword\" class=\"\
    col-sm-2 control-label\">Password</label>\n    <div class=\"col-sm-10\">\n   \
    \   <input type=\"password\" class=\"form-control\" id=\"inputPassword\" placeholder=\"\
    Password\">\n    </div>\n  </div>\n</form>\n```\n"
  mdcn: "\n从外部来看，如果你渲染这段代码，你会发现它的输出与示例 18 生成的输出没有区别。从内部来看，Bootstrap 现在可以比以前更轻松地找到并处理单个元素。\n\
    \n在 BS2 中，除非你想使用自动验证类，否则并不要求对控件进行分组。虽然现在仍然没有绝对要求使用这些类，但这样做可以允许 BS 在使用网格系统（以及许多其他功能）时，能够正确地调整这些项的大小并对其进行重新定位。你还会注意到，每个控件现在都只被分配了一个单一\
    \ `form-control` 类，而不是针对不同方面的许多不同类。\n\n另外请注意，`form` 标签本身现在也被分配了一个 `role` 属性。这不仅是一项良好的通用实践，现在还受到了\
    \ BS3 的强制执行，以辅助 aria 角色以及引导残障人士使用 Web 应用的标准。\n\n最后，如果你查看带有 `help-block` 的 `<p>`\
    \ 标签，你会发现它现在在所有情况下都被用于内联表单文本，而在 BS2 中，我们有许多种不同的类，例如 `form-info`。\n\n遗憾的是，表单支持方面仍然缺失一个领域——文件上传控件。与\
    \ BS2 类似，这是由于当前所有浏览器的安全性限制了对文件输入控件进行样式设置以与其他可用输入控件匹配的能力。\n\n然而，正如我在前一书中提到的，仍然有一些第三方插件涵盖了这一领域，而且由于你现在可以使用\
    \ HTML5 类构建自己的上传系统，从严格来说说，你不需要文件上传控件——你可以自己制作一个。\n\n在 BS2 中，有很多特定的表单类型，例如 `search-form`；在\
    \ BS3 中，所有这些类型都合并成了三种主要的表单类型。首先，你有标准表单；正如我们所看到的，这是一个普通的表单，没有在 `form` 标签上添加额外的类。另外两种表单类型是\
    \ `form-inline`（内联表单）和 `form-horizontal`（水平表单）。\n\n`form-inline` 类设计用于小型、高度限制区域的表单，例如菜单和导航栏。但需要警告的是：此类类以及其他表单类型中的所有输入元素默认大小均为\
    \ 100%，因此如果你需要表单只占用一小部分空间（特别是在导航栏表单中），你将对单个控件设置手动尺寸。\n\n在代码示例 19 的示例中，添加 `form-inline`\
    \ 或 `form-horizontal` 分别将改变你的基础表单布局，如下所示：\n\n*图 8：代码示例 19 在 form 标签上添加 `form-inline`\
    \ 类后生成的表单。*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_35_0.png)\n\n`form-horizontal`\
