  - "[PAGE 74]\n\n \n\n \n\n \n\n \n\n75 \n\n \n\n*Figure 48: Drop-down menu produced\
    \ by code sample 47 *\n\nYou can combine each of these, so it's simple to have\
    \ drop-down and non-dropdown links in \n\none `**navbar-nav**` `**<ul>**` just\
    \ by marking up each `**<li>**` element as needed. \n\nAnother common requirement\
    \ in navigation bars is the obligatory sign-in form, generally used to \n\nsign\
    \ in to a protected area on a site. \n\nBS3 makes these forms even easier to construct\
    \ using the `**navbar-form**` class. So far, we've \n\nseen that all our elements\
    \ are left-aligned in the navigation bar’s inner-content area. Since sign-\n\n\
    in forms are usually right-aligned, the BS3 team has provided the `**navbar-right**`\
