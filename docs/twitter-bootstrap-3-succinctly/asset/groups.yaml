    不过，这个修复不能归功于我——因为它在在线的 BS3 文档中有详细的说明。


    在 Windows 8 开发指南中也有关于该主题的更多信息。


    ## Safari 百分比舍入


    在某些版本的 Safari 中，渲染引擎在处理百分比值的小位数时表现挣扎。


    这些百分比经常被用于 `col-*-1` 网格类，因此当遇到这种情况时，12 列布局的渲染中会出现错误。


    BS3 错误报告系统中有一个已开启的 Bug，但他们对解决该问题也无能为力。BS3 文档确实建议尝试在最后一列上添加 `pull-right`，但最好的解决方法似乎是手动调整你的基于百分比的值，直到找到平衡点。


    ## Android 原生浏览器


    目前，Android 4.1 及以上版本自带“浏览器”应用作为默认 Web 浏览器。由于浏览器代码库中存在大量问题，BS3（以及许多其他框架）在浏览器应用中无法正确渲染，在
    CSS 引擎更是如此，那里有大量已知问题。


    BS3 文档中提供了一个基于 JavaScript 的解决方案来修复你的布局，但最好的解决方法是让用户改用 Chrome 应用，对于 Android 来说，Chrome
    显然是更好、更稳定的浏览器。


    ## 其他还有呢？


    还有很多需要注意的地方，再次强调，这些大部分内容在 BS3 文档中都有记录，涵盖了如指缝缩放、虚拟键盘以及不同类型的视口（viewport）在涉及媒体查询时的反应等内容。


    事实上，快速扫描 www.stackoverflow.com 上最常见的问题可以告诉我们，很多问题都围绕着滚动、调整大小、缩放以及通用的触摸屏问题，这些问题似乎源于元素太小，或者对平均手指尺寸不够敏感。


    这些尺寸问题中的许多项可以通过下载 BS3 源码分发包，并修改可用的 `Less` 变量和混入（mixins），或者使用现有的自定义工具进行定制来解决；现在，除非你只针对桌面应用，否则仅仅下载并使用
    BS3 不再是一个好主意了。


    如果你针对多个平台并期望完全的响应式，那么你真的需要在框架作者提供的钩子（hooks）中进行大量的自定义。


    ## 第3 章 变化的 CSS 特性


    到目前为止，你已经看到了 Bootstrap 版本 3 中提供的许多新 CSS 特性。在本章中，我们将更详细地介绍哪些是新的，哪些不是。


    在很多情况下，这些新类仅仅是旧类的重命名，但我们在这里将它们视为新的，以便你可以轻松地区分。


    ## 字体排学变化


    构成 BS3 字体学部分的各种类没有像其他元素变化得那么大。`H1` 到 `H6` 标签的处理方式与 v2 相同，不同之处在于你现在可以在任何标题元素中内联使用
    `<small>`，而不需要先将其封装在使用 `page-header` 类的 `div` 中。这意味着现在不再需要额外的标记，除非你想让你的块级标题带有不同段落边距的下划线。


    *代码示例 10: BS V2 头部*


    在 v2 中，你不得不将 `H1` 包裹在 `page-header` `div` 中，因为这是让 `small` 标签输出保持整齐的唯一方法。


    *代码示例 11: BS V3 头部*


    继续下去，标准正文没有变化，保持 14 像素的默认大小和 1.4 的行高。正文应用到段落标签内的所有文本，因此除非你想使用某些特殊功能（我们很快就会看到），否则不需要类。导读正文（带有类名
    `lead` 的段落）的名称或样式也没有变化，并且像 v2 一样，它们旨在为你的开头段落提供比其他正文更多的强调。


    <div class="page-header">

    <h1>这是我的超级页面 <small>它是最好的</small></h1>

    </div>

    <h1>这是我的超级页面 <small>它是最好的</small></h1></h1> <!-- 注意：原文此处有多余的闭合标签已保留 -->


    *代码示例 12: 头部和正文*


    在你的浏览器中渲染时，它看起来应该像下面：`<small>` 标签也可以单独使用，因为它的样式现在在其使用的上下文中被正确处理和应用了，所以无论父标签是什么，它的样式都会遵循它在文档中的位置。


    同样，粗体文本仍然使用 `strong` 标签创建，斜体使用 `em` 标签创建；与许多字体排学类一样，这与 v2 无二致。对齐类也保留了 `text-left`、`text-center`、`text-right`
    和 `text-justify` 的名称，并且仍然执行与之前相同的功能。


    同样，缩写仍然使用 `<abbr>` 标签创建，`title` 属性作为缩写的完整描述。这里有一个新类 `initialism`，可以添加到缩写中，并使渲染输出看起来比周围文本略小。地址（使用
    `<address>` 标签）和块引用（使用 `<blockquote>` 标签）在 v2 和 v3 之间的基础规则没有变化。该类别中保留的最终标签包括 `<code>`，用于创建内联代码。再次，这没有发生任何变化，其预期的用途仍是用于与普通文本对齐的代码示例。


    <div class="container">

    <div class="page-header">

    <h1>这是我的超级页面 <small>它是最好的</small></h1>

    </div>

    <p class="lead">欢迎来到超级网页，世界上没有像它这样的网页了</p>

    <p>在这个页面上我有一些文本供你阅读，还有一个漂亮的标题</p>

    </div>


    对于必须保持缩进和换行格式的代码（或任何纯文本），你仍然应该使用 `<pre>` 标签；再次，这里的样式没有从 v2 变化，使用该标签的布局应该仍然符合预期。


    最后的字体排学元素是增加了一个名为 `<kbd>` 的元素。这个新标签的目的是以某种方式显示用户应该向计算机输入信息，通常是通过输入。


    例如：


    *代码示例 13: ''<kbd>'' 标签示例*


    在 HTML 文档中渲染时，它应该像下面：


    *图 2: 代码示例 13 的输出*


    ## 列表变化


    通常，由 `<ul>`、`<ol>` 和 `<dl>` 元素组成的普通列表没有变化；布局仍然与 v2 相同，不需要额外的类。请注意，`list-unstyled`、`list-inline`
    以及定义列表的 `dl-horizontal` 类在 v3 中也保持不变，行为与 v2 相同。


    然而，列表元素有一些变化，但由于这些变化出现在用于菜单和导航列表的特殊类中，我们将在下一章讨论导航元素时涵盖这些内容。


