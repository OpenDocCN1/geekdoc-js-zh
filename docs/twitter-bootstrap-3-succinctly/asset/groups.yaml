- md: "\n*Figure 69: Output produced by code sample 66*\n\nIf you remove the `<div>`\
    \ containing the panel body from your markup, the whole thing will collapse down,\
    \ leaving just the panel header and border, and leading straight into the table—great\
    \ for just providing tables with headers, if that’s what you need.\n\nAdding a\
    \ list group into your panel is also just as easy, and performed in exactly the\
    \ same way. I'll leave that as an exercise to the reader to play with, however.\n\
    \n## Other changes\n\nBefore we finally leave the chapter on components behind,\
    \ there are a few more things to cover: the jumbotron, alert boxes, progress bars,\
    \ and wells.\n\nThe jumbotron is not a new element, but its use in BS2 was slightly\
    \ more messy than it now is in BS3. Creating a jumbotron is very simple; you simply\
    \ use a `<div>` with the class `jumbotron` applied, and then add some optional\
    \ markup inside. What markup you use is entirely up to you, but to get the intended\
    \ effect, the recommended markup is:\n\n*Code Sample 67: BS3 Jumbotron Example*\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_91_0.png)\n\n```html\n<div class=\"\
    jumbotron\">\n  <h1>Bootstrap 3</h1>\n  <p>Don't you just love this framework?\
    \ It's elegant, simple to use, and frees you from so much boilerplate code.</p>\n\
    \  <p><a class=\"btn btn-primary btn-lg\" role=\"button\">Heck yes I do</a></p>\n\
    </div>\n```\n\n*Figure 70: Jumbotron produced by code sample 67*\n\nAnd that’s\
    \ it. You can remove the rounded corners and make it full-width by swapping the\
    \ order and moving it outside its container, but there are no special classes\
    \ or optional colors for this—it's designed to be big and bold, and catch your\
    \ attention.\n\nSpeaking of catching attention, we also have a number of alert\
    \ classes, and the only real change between the BS2 version and BS3 is the renaming\
    \ of the class name `alert-error` to `alert-danger`. Other than that, the markup\
    \ to produce alerts is still as simple as using a standard `<div>` with the appropriate\
    \ contextual classes added:\n\n*Code Sample 68: Contextual Alert Classes*\n\n\
    *Figure 71: Alert boxes produced by code sample 68*\n\nIf you want to add links\
    \ in your alerts using a standard `<a>` tag, make sure you apply the class `alert-link`\
    \ to the anchor tag; this will ensure that the link coloring remains consistent\
    \ with the contextual color class being used.\n\nYou can also add a cross/dismiss\
    \ icon to the alert, allowing the user to close it and make it vanish from the\
    \ display. To do this, we need to add a `<button>` element marked up with a sprinkle\
    \ of data attributes and extra classes as follows:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_92_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_92_1.png)\n\
    \n```html\n<div class=\"alert alert-success\">You did something ...</div>\n<div\
    \ class=\"alert alert-info\">Something happened you ...</div>\n<div class=\"alert\
    \ alert-warning\">Something happened that wasn't ...</div>\n<div class=\"alert\
    \ alert-danger\">You did something that was not liked ...</div>\n```\n\n*Code\
    \ Sample 69: A Dismissable Alert Box*\n\n*Figure 72: Dismissible alert produced\
    \ by code sample 69*\n\nWe added the extra class `alert-dismissable` to the outer\
    \ `<div>`, and then used a `dismiss` data attribute to connect the JavaScript\
    \ action to the alert’s `dismiss` method, using a simple button.\n\nIf alerts\
    \ provide operational feedback, then there's one other feedback-related component\
    \ that's a must-have—the progress bar.\n\nNo feedback element has produced so\
    \ much hatred or salutation as this humble, little colored bar. From BS2 to BS3,\
    \ the only changes made here, like with the alert classes, are the renaming of\
    \ the contextual colors to match the overall scheme renames elsewhere in the framework.\n\
    \nThe base HTML markup to produce them remains exactly the same:\n\n*Code Sample\
    \ 70: Basic Progress Bar*\n\n*Figure 73: Progress bar produced by sample 70*\n\
    \nOne thing you really should pay attention to, however (and something that I\
    \ have reiterated at various points in this book), is the group of attributes\
    \ and extras used to make this element friendly to screen readers and similar\
    \ equipment.\n\nSince a progress bar often tends to be purely graphical in nature,\
    \ it means nothing to someone who's unable to read the screen. Most other elements\
    \ have at least text to give the reader an idea of what's there; progress bars\
    \ need all the help they can get. You'll see from the previous example that we've\
    \ added extra values to report on what the value is at, and we've also marked\
    \ up a span that's for screen readers specifically to give an audible report.\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_93_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_93_1.png)\n\
    \n```html\n<div class=\"alert alert-danger alert-dismissable\">\n  <button type=\"\
    button\" class=\"close\" data-dismiss=\"alert\" aria-hidden=\"true\">&times;</button>\n\
    \  <strong>YO!</strong> got that operation, very wrong.\n</div>\n<div class=\"\
    progress\">\n  <div class=\"progress-bar\" role=\"progressbar\" aria-valuenow=\"\
    60\" aria-valuemin=\"0\" aria-valuemax=\"100\" style=\"width: 60%;\">\n    <span\
    \ class=\"sr-only\">60% Complete</span>\n  </div>\n</div>\n```\n\nIf we remove\
    \ the `sr-only` class, however, it makes our bar a bit better to those who can\
    \ see it too:\n\n*Figure 74: Progress bar with the sr-only class removed from\
    \ the inner span*\n\nIt goes without saying that you can also add `progress-bar-success`,\
    \ `progress-bar-info`, `progress-bar-warning`, and `progress-bar-danger` to the\
    \ inner `<div>` with the `progress` class, in order to take advantage of the contextual\
    \ colors. You can also add `progress-striped` and/or `active` to the outer `<div>`\
    \ alongside the `progress` class in order to get striped and animated effects\
    \ on your progress bars. A stacked progress bar effect can be obtained by placing\
    \ multiple `progress-bar` `<div>`s inside the outer `progress` container and setting\
    \ their values appropriately.\n\nThe final element that's left is the humble `well`.\
    \ No changes have been made to this since BS3, but it does now have an extra class\
    \ `well-sm`. There's no magic involved here—if you want a simple, boxed-off area\
    \ with a shaded background, simply create a `<div>` element, add the `well` class\
    \ to it, and then add your content inside. Wells are useful for sidebars and/or\
    \ footers, or anything too simple to warrant being put in a full panel or other\
    \ fenced off area. There are no contextual colors or special actions, either;\
    \ it’s simple, effective, and easy to use:\n\n*Code Sample 71: Simple Well Example*\n\
    \n*Figure 75: Well example produced by sample 71*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_94_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_94_1.png)\n\
    \n```html\n<div class=\"well\">Hello World!</div>\n```\n\n## Chapter 5 Changed\
    \ JavaScript Features\n\nWhen it comes to JavaScript in BS3, not much has changed;\
    \ the vast majority of the changes we've seen so far have revolved around the\
    \ CSS and components sections. There’s a reason for this.\n\nMost of BS2's (and\
    \ for that matter, BS3's) JavaScript functionality comes in the form of data attributes.\
    \ In most of the cases, we've already seen how to use these in the various sections\
    \ on components, which really leaves very little that's specific to JavaScript\
    \ only.\n\nIn this chapter, therefore, I’ll just briefly run through most of what's\
    \ available, and where there is no other description elsewhere in the book, show\
    \ a brief example on how to use the API available.\n\nThe JS facilities available\
    \ in BS2 and BS3 are very extensible, and even a full book probably couldn't cover\
    \ everything that's possible. I therefore strongly encourage you to go to www.getbootstrap.com\
    \ and read through the section on JavaScript.\n\n## Modals\n\nThe first thing\
    \ that anyone mentions when the subject of JavaScript comes up in Bootstrap is\
    \ the modal dialog boxes—and it's little surprise.\n\nBS3's modal boxes are one\
    \ of the easiest implementations (and one of the richest) seen in any of the modern\
    \ browser HTML5 frameworks.\n\nUsing them is easy, but unfortunately, does require\
    \ quite a lot of markup. The following code gives you a very basic example:\n\n\
    *Code Sample 72: Basic Modal Example*\n\n```html\n<button class=\"btn btn-primary\
    \ btn-lg\" data-toggle=\"modal\" data-target=\"#myModal\">\n  Show Modal Dialog\n\
    </button>\n\n<div class=\"modal fade\" id=\"myModal\" tabindex=\"-1\" role=\"\
    dialog\" aria-labelledby=\"myModalLabel\" aria-hidden=\"true\">\n  <div class=\"\
    modal-dialog\">\n    <div class=\"modal-content\">\n      <div class=\"modal-header\"\
    >\n        <button type=\"button\" class=\"close\" data-dismiss=\"modal\" aria-hidden=\"\
    true\">&times;</button>\n        <h4 class=\"modal-title\" id=\"myModalLabel\"\
    >Modal title\n\n</h4>\n      </div>\n      <div class=\"modal-body\">Modal Body</div>\n\
    \      <div class=\"modal-footer\">\n        <button type=\"button\" class=\"\
    btn btn-default\" data-dismiss=\"modal\">Close</button>\n        <button type=\"\
    button\" class=\"btn btn-primary\">Some Action</button>\n      </div>\n    </div>\n\
    \  </div>\n</div>\n```\n"
  mdcn: "\n\n*图 69：代码示例 66 的输出*\n\n如果你从标记语言中移除包含面板主体（panel body）的 `<<div>>`，整个部分将会折叠，只留下面板头部和边框，并直接进入表格——如果你只需要提供带表头的表格，这种方法非常有用。\n\
    \n在面板中添加列表组（list group）也同样简单，操作方法完全相同。不过，我将这留给读者作为练习题，让他们自行尝试。\n\n## 其他更改\n\n\
    在我们最终离开组件章节之前，还有几点需要介绍：jumbotron（巨幅幅）、警报框（alert boxes）、进度条（progress bars）和井（wells）。\n\
    \njumbotron 并不是一个新元素，但它在 BS2 中的用法比现在在 BS3 中要杂乱一点。创建一个 jumbotron 非常简单；你只需要使用一个应用了\
    \ `jumbotron` 类的 `<div>`，然后在内部添加一些可选的标记即可。你使用什么标记完全取决于你，但为了达到预期效果，推荐的标记是：\n\n\
    *代码示例 67：BS3 Jumbotron 示例*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_91_0.png)\n\
    \n```html\n<div class=\"jumbotron\">\n  <h1>Bootstrap 3</h1>\n  <p>你不喜欢这个框架吗？它优雅、易用，并且让你从大量的模板代码中解放出来。</p>\n\
    \  <p><a class=\"btn btn-primary btn-lg\" role=\"button\">是的，我太喜欢了</a></p>\n</div>\n\
    ```\n\n*图 70：代码示例 67 生成的 Jumbotron*\n\n就是这样。你可以通过交换顺序将其移动到容器外部来移除圆角并使其全宽显示，但为此没有特殊的类或可选的颜色——它的设计初衷就是为了硕大且醒目，并吸引你的注意力。\n\
    \n提到吸引注意力，我们还有许多警报类（alert classes），BS2 版本和 BS3 版本之间唯一的真实变化是将类名 `alert-error` 重命名为\
    \ `alert-danger`。除此之外，用于生成警报的标记语言仍然像使用带有适当语境类的标准 `<div>` 一样简单：\n\n*代码示例 68：语境警报类*\n\
    \n*图 71：代码示例 68 生成的警报框*\n\n如果你想使用标准的 `<a>` 标签在警报中添加链接，请确保对锚点标签应用 `alert-link`\
    \ 类；这将确保链接的颜色与所使用的语境颜色类保持一致。\n\n你还可以向警报添加一个关闭/忽略图标，允许用户关闭它并从显示中消失。为了这一点，我们需要添加一个带有少量数据属性和额外类的\
    \ `<button>` 元素，如下：\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_92_0.png)[](img/3ef3f89d48533001235bf8b5b1e48737_92_1.png)\n\
    \n```html\n<div class=\"alert-success\">你做了一些...</div>\n<div class=\"alert-info\"\
    >发生了某些...</div>\n<div class=\"alert-warning\">发生了某些...</div>\n<div class=\"alert-danger\"\
    >你做了一些不对的...</div>\n```\n\n*代码示例 69：可忽略警报框*\n\n*图 72：代码示例 69 生成的可忽略警报*\n\n我们在外部\
    \ `<div>` 添加了额外类 `alert-dismissable`，然后使用 `dismiss` 数据属性通过简单的按钮连接到警报的 `dismiss`\
    \ 方法。\n\n如果说警报提供反馈，那么另一个必不可少的反馈组件就是进度条。除了这个小小的彩色条，没有其他元素产生如此多的反馈或致意。从 BS2 到 BS3，这里的唯一更改与警报类一样，是语境颜色的重命名。生成它们的\
    \ HTML 标记保持不变：\n\n*代码示例 70：基础进度条*\n\n*图 73：示例 70 生成的进度条*\n\n然而，你真正应该注意的一点（我在书中多次提到的）是用于使该元素对屏幕阅读器友好的属性和额外类。\n\
    \n由于进度条通常是纯图形性的，对于无法阅读屏幕的人来说没有任何意义。大多数其他元素至少有文字告诉读者情况；从上一个示例中看到，我们添加了额外值来报告当前数值，并且专门标记了一个供屏幕阅读器使用的\
    \ `<span>`。\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_93_0.png)[](img/3ef3f89d48533001235bf8b5b1e48737_93_1.png)\n\
    \n```html\n<div class=\"alert alert-danger alert-dismissable\">\n  <button type=\"\
    button\" class=\"close\" data-dismiss=\"alert\" aria-hidden=\"true\">&times;</button>\n\
    \  <strong>哟！</strong>操作完全错误。\n</div>\n<div class=\"progress\">\n  <div class=\"\
    progress-bar\" role=\"progressbar\" aria-valuenow=\"60\" aria-valuemin=\"0\" aria-valuemax=\"\
    100\" style=\"width: 60%;\">\n    <span class=\"sr-only\">完成 60%</span>\n  </div>\n\
    </div>\n```\n\n然而，如果我们移除 `sr-only` 类，对于那些也能看到它的人来说，我们的条也会更好：\n\n*图 74：移除了内部 span\
    \ sr-only 类的进度条*\n\n不言而喻，你也可以在带有 `progress` 类的内部 `<div>` 中添加 `progress-bar-success`、`progress-bar-info`、`progress-bar-warning`\
    \ 和 `progress-bar-danger`，以利用语境颜色。你还可以在外部 `<div>` 旁并添加 `progress-striped` 和/或\
    \ `active`，以便为进度条获得条纹和动画效果。可以通过在外部 `progress` 容器内放置多个 `progress-bar` `<div>` 并适当设置它们的值来获得堆叠进度条效果。\n\
    \n剩下的最后一个元素是简单的 `well`。自 BS3 以来它没有变化，但它现在有一个额外类 `well-sm`。这里没有魔法——如果你想要带有阴影背景的简单区域，只需创建一个\
    \ `<div>` 元素，添加 `well` 类，然后在内部添加内容。井适用于侧边栏和/或页脚，或者任何简单到不需要放在完整面板或其他围栏区域的内容。它也没有语境颜色或特殊操作；它简单、有效且易用：\n\
    \n*代码示例 71：简单井示例*\n\n*图 75：示例 71 生成的井示例*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_94_0.png)[](img/3ef3f89d48533001235bf8b5b1e48737_94_1.png)\n\
    \n```html\n<div class=\"well\">Hello World!</div>\n```\n\n## 第5章更改的 JavaScript\
    \ 特性\n\n当涉及到 BS3 中的 JavaScript 时，变化不大；我们到为止看到的绝大多数变化都围绕着 CSS 展开。这是有原因的。\n\nBS2\
    \ 的（同样，BS3 的）JavaScript 功能是以数据属性的形式提供的。在大多数情况下，我们已经在组件章节中学习了如何使用它们，因此留下了很少的特定\
    \ JavaScript 内容。因此，在本章中，我将简要介绍大部分可用功能，并在书中其他地方没有描述的地方展示 API 的使用示例。\n\nBS2 和 BS3\
    \ 可用的 JS 工具非常有扩展性，即使是一本本书可能无法涵盖所有可能性。因此，我强烈建议你访问 www.getbootstrap.com 并阅读 JavaScript\
    \ 章节。\n\n## 模态框（Modals）\n\n当提到 JavaScript 时，任何人提到的第一个东西就是模态对话框——这并不意外。BS3 的模态框是任何现代浏览器\
    \ HTML5 框架中最易于实现之一（也是最丰富的之一）。\n\n使用它们很容易，但遗憾的是需要大量的标记语言。以下代码为你提供了一个非常基础的示例：\n\n\
    *代码示例 72：基础模态示例*\n\n```html\n<button class=\"btn btn-primary btn-lg\" data-toggle=\"\
    modal\" data-target=\"#myModal\">\n  显示模态框\n</button>\n\n<div class=\"modal fade\"\
