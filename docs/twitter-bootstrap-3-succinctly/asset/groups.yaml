    When rendered in the browser, this produces a regular form layout, with the static
    control clearly marked as not being editable or looking like an input control,
    as the following image shows:


    *Figure 11: The form with a static field produced by code sample 22*


    The disabled style of form controls is still marked up and used in the same way
    as in BS2, simply by adding the “disabled” attribute to the input element as the
    following shows:


    This will produce the classic disabled and shaded control look, something like
    the following:


    *Figure 12: Classic disabled control look in both BS2 and BS3*


    If you add the `disabled` attribute to a field-set surrounding a form, all of
    the controls in that group will be disabled at the same time, using the same styling.
    This is something that didn''t happen in BS2—you instead had to mark up each individual
    control.


    The final thing I want to mention while on the subject of forms is the validation
    and focus classes. As I previously noted, adding the correct input types in HTML5
    elements really helps you when it comes to using the validation classes. Why is
    that?


    In addition to having dedicated class names and styles for you to use, the validation
    classes also hook the new HTML5 pseudo-elements such as `focus:`, `error:`, and
    others.


    This means that if you mark a text box as `type="email"`, and then don''t put
    an email address into it when submitting, the browser should automatically highlight
    the field red for you.


    If it does not, or you have some other way of making your validation work, then
    you can simply use the `has-success`, `has-warning`, and `has-error` classes on
    your form groups as the following code shows:


    *Code Sample 23: Marking Up a Form in BS3 to Use the Validation Classes*


    ![](img/3ef3f89d48533001235bf8b5b1e48737_39_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_39_1.png)


    `</div>`

