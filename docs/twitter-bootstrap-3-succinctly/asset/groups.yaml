    \ more than a handful of `**<li>**` elements; the only \n\nplace the classes need\
    \ to be applied is on the outer `**<ul>**` itself. You'll also see that we have\
    \ an \n\n`**active**` class on the first `**<li>**` in the list, to show us which\
    \ tag is the active tag. \n\nIf you want BS3 to provide the entire tab's experience\
    \ (that is, to actually change the content as \n\nrequired), then there's more\
    \ work you need to do. For that, as we'll see in the JavaScript \n\nsection, you\
    \ need to use one of the JavaScript add-ons. If, however, you want to handle the\
    \ tab \n\nswitching and content yourself, all you need to do to switch tabs is\
    \ move the active class from \n\none `**<li>**` to the next. \n\nThings are no\
    \ more complicated with pills: just exchange the `**nav-tabs**` in code sample\
    \ 40 for \n\n`**nav-pills**` and you should see your output change to this: \n\
    \n \n\n*Figure 35: Output from code sample 40 when changed to **“**pill**”** mode\
    \ *\n\nand if we add `**nav-stacked**` to either of them, our navigation will\
    \ stack neatly one on top of each \n\nother: \n\n \n\n*Figure 36: Code sample\
    \ 40, changed to **“**pill**”** mode, and with nav-stacked added *\n\nAs with\
    \ most other components and changes in the framework, the output now renders as\
    \ a \n\nblock element occupying all of the available space. Again, you just need\
    \ to use the grid system \n\nand other available classes to make sure it takes\
    \ up only the space you need. Now, any parent \n\ncontainer that changes size\
    \ because of differing screen resolutions will now cause its child \n\nelements\
    \ to responsively resize as needed. \n\nBy the way, this also works with tabbed\
    \ navigation, but the output is most likely not what you \n\nwould expect: \n\n\
    \ \n\n*Figure 37: Code sample 40, rendered as stacked tabs *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_66_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_66_2.png)"
  - "[PAGE 67]\n\n \n\n \n\n \n\n68 \n\nIn fairness, though it wasn't really designed\
    \ to work that way: tabs generally run left to right, and \n\nwhile BS2 did have\
    \ some classes for putting tabs on the side and along the bottom of elements,\
    \ \n\nthese have been removed in BS3. The JavaScript plug-in for making full,\
    \ tab-based outputs still \n\nhas the ability to position the tabs, but the general\
    \ navigation no longer does. \n\nAs with the changes made in the button components,\
    \ the navigation aids also now have a new \n\njustified class added to them, called\
    \ `**nav-justified**`, and just as with the button version, it will \n\ncause\
    \ a navigation class to span the full width of a container, giving each sibling\
    \ an equal size. \n\nIf we take the code in sample 40 and add `**nav-justified**`\
    \ to the two classes already there, we \n\nget the following result: \n\n \n\n\
    *Figure 38: Navigation tabs from code sample 40 with full-width justification\
    \ applied *\n\nThe navigation aids have another thing in common with the button\
    \ classes and components: the \n\nstate-based changes, which are used to show\
    \ a given state, as well as the ability to take drop-\n\ndown menus and sub navigation.\
    \ \n\nSimply adding a class of `**disabled**` to the `**<li>**` inside a navigation\
    \ set will disable and dim that \n\nlink with the `**muted-text**` look. Remember\
    \ though, it does not actually disable the link—the link \n\nwill still be clickable,\
    \ and it’s up to you to code things so the link does not react. \n\nTo add a drop-down\
    \ menu to any pill- or tab-based navigation item, just use the same layout \n\n\
    and classes as shown in the section on buttons. Nest an `**<a>**` inside an `**<li>**`,\
    \ followed by \n\nanother `**<ul>**`, with the appropriate classes and data attributes\
    \ to make it all work. \n\nIn a bit of a cross-over between the basic navigation\
    \ and navigation bars, we also have \n\nbreadcrumbs and page/pagination navigation\
    \ aids. \n\nBreadcrumbs are typically used to mark your position in a site’s hierarchy,\
    \ and as we've seen \n\nabove, using them is simply a case of adding them to an\
    \ unordered list, as the following code \n\nshows: \n\n*Code Sample 41: BS3 Breadcrumb\
    \ Navigation Example *\n\n \n\n*Figure 39: Output produced by code sample 41 *\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_67_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_67_1.png)\n\
    \n`<ul class=\"breadcrumb\"> `\n\n` <li><a href=\"#\">Home</a></li> `\n\n` <li><a\
    \ href=\"#\">Library</a></li> `\n\n` <li class=\"active\">Data</li> `\n\n`</ul>\
    \ `\n\n` `"
  - "[PAGE 68]\n\n \n\n \n\n \n\n \n\n69 \n\nThe final controls, before we move onto\
    \ full navigation bars, are the pagination controls. These \n\ncontrols take a\
    \ huge amount of the grunt work out of lining up a bar with previous/next and\
    \ \n\nbefore/after, and a sequence of numbers in the middle. \n\nTypically used\
    \ where you have a data-heavy site and want to display records one page at a \n\
    \ntime, rather than all at once, pagination bars are both simple to use and easy\
    \ to line up with the \n\nrest of your output. \n\nJust as with the other basic\
    \ elements, creating pagination bars is as simple as adding the \n\nappropriate\
    \ classes to an unordered list, as the following code shows: \n\n*Code Sample\
    \ 42: BS3 Pagination Bar *\n\n \n\n*Figure 40: Output produced by code sample\
    \ 42 *\n\nJust as with the other basic navigation aids, applying `**active**`\
    \ and `**disabled**` classes where \n\nneeded to individual `**<li>**` elements\
    \ within the list enables you to mark links as disabled and \n\nselected. \n\n\
    \ \n\n*Figure 41: Output produced by code sample 42 with active and disabled classes\
    \ added *\n\nPagination controls can be sized just as easily as the other controls\
    \ using the new sizing \n\noptions, and like the others, they now all follow the\
    \ same naming scheme: `**pagination-lg**` and \n\n`**pagination-sm**`. As with\
    \ some of the others, there is no `**pagination-xs**`, and no hint that there\
    \ \n\nshould be one; likewise there's no `**\\-md**` size either, since medium\
    \ is the default. \n\nTo use the pagination controls, just add the appropriate\
    \ sizing class alongside the pagination \n\nclass on the parent `**<ul>**` holding\
    \ the list, as the following code shows: \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_68_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_68_1.png)\n\
    \n`<ul class=\"pagination\"> `\n\n` <li><a href=\"#\">&laquo;</a></li> `\n\n`\
    \ <li><a href=\"#\">1</a></li> `\n\n` <li><a href=\"#\">2</a></li> `\n\n` <li><a\
    \ href=\"#\">3</a></li> `\n\n` <li><a href=\"#\">4</a></li> `\n\n` <li><a href=\"\
    #\">5</a></li> `\n\n` <li><a href=\"#\">&raquo;</a></li> `\n\n`</ul> `\n\n` `"
  - "[PAGE 69]\n\n \n\n \n\n \n\n70 \n\n*Code Sample 43: Using Different Sizes for\
    \ the Pagination Component *\n\n \n\n*Figure 42: Output produced by code sample\
    \ 43 *\n\nThe pagination classes have one final trick up their sleeve—the generation\
