    </div>\n<div class=\"btn-group\">\n  <button type=\"button\" class=\"btn btn-success\"\
    >Middle 1</button>\n</div>\n<div class=\"btn-group\">\n  <button type=\"button\"\
    \ class=\"btn btn-success\">Middle 2</button>\n</div>\n<div class=\"btn-group\"\
    >\n  <button type=\"button\" class=\"btn btn-success\">Middle 3</button>\n</div>\n\
    <div class=\"btn-group\">\n  <button type=\"button\" class=\"btn btn-success\"\
    >Middle 4</button>\n</div>\n<div class=\"btn-group\">\n  <button type=\"button\"\
    \ class=\"btn btn-success\">Right</button>\n</div>\n</div>\n```\n\n**注意：** HTML\
    \ 5 带来的新功能之一是数据属性（data attributes）。BS3（确切地说包括 BS2）在许多不同的地方使用这些属性，允许元素和 JavaScript\
    \ 函数连接在一起，而无需开发者编写任何单行 JavaScript。数据属性始终以 `data-*` 的形式存在，其中 `name` 是开发者想要分配给该属性的名称。使用\
    \ `data-*` 可以确保你定义的属性永远不会与 WHATWG 标准向规范中添加的任何内容冲突，为开发者在使用这些属性的方面提供了最大的灵活性。\n\n\
    在大多数情况下，这些数据属性的使用方式正如 BS3 使用所示：将信息从元素传递到处理该元素的 JavaScript 程序中。它们可以用于传递 ID 名称、选项、尺寸参数以及许多其他内容，这意味着你通常不需要在应用程序中实际编写任何样板代码。在本章中，你将接触更多此类数据属性。\n\
    \n为了让下拉按钮工作，你**必须**将下拉 JavaScript 插件添加到你的 BS3 构建中。如果你只是下载了默认set，那么这将不是问题，因为 `dropdown.js`\
    \ 已经是主 `bootstrap.js` 文件的一部分。如果你执行了自定义构建，甚至是你自己从 Less 源码编译的，你需要确保它的存在。\n\n以下代码展示了一个基础的下拉按钮示例：\n\
    \n*代码示例 37：下拉按钮示例*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_60_0.png)\n\n```html\n\
    <div class=\"btn-group\">\n  <button type=\"button\" class=\"btn btn-success dropdown-toggle\"\
    \ data-toggle=\"dropdown\">\n    A dropdown button <span class=\"caret\"></span>\n\
    \  </button>\n  <ul class=\"dropdown-menu\" role=\"menu\">\n    <li><a href=\"\
    #\">1st Link</a></li>\n    <li><a href=\"#\">2nd Link</a></li>\n    <li><a href=\"\
    #\">3rd Link</a></li>\n    <li class=\"divider\"></li>\n    <li><a href=\"#\"\
    >1st Link after divider</a></li>\n  </ul>\n</div>\n```\n\n"
