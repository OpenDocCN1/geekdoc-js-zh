    input here..." disabled>`


    `<form role="form">`

    `<div class="form-group has-success">`


    If you render this code in your browser, you should see something like the following:


    *Figure 13: The output produced by code sample 23*


    Points to note are that I''ve added the classes to the form groups in order to
    produce a static display; however, you should also try just marking up the form
    with the correct input types. I''ve found browser support on the pseudo-classes
    is still a little patchy, even though there''s no mention of it in the BS3 docs,
    so I do recommend that you also make use of the class names when manipulating
    your elements using JavaScript.


    Also note that the label and block-level help text takes on the correct color
    of the group too, so you have no need of adding colors or styles to these separately
    to the form control group.


    Remember that the `form-group` sections can also use everything else we''ve mentioned
    so far to disable, shade, and resize form elements as required on a grouped basis.


    The last thing to mention for validation groups is that you can also provide optional
