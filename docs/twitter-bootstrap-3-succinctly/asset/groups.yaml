    ## Button Changes


    The most prominent change in the classes used to style buttons in BS3 is the default
    style. Under BS2, simply adding the btn class to an input element of button, or
    to an anchor tag, would give the control the default button look and feel. From
    BS3 onwards, you now explicitly have to add `btn-default`; just adding `btn` on
    its own will no longer have any effect.


    The second main change is in the renaming of some of the base classes. Specifically,
    `btn-error` has been renamed to `btn-danger` so that the naming scheme matches
    other similarly named class changes and brings uniformity to the Bootstrap base
    library.


    Other than that, the base button classes remain unchanged, as the following code
    sample shows:


    *Code Sample 25: BS3 Button Classes*


