  - "[PAGE 104]\n\n \n\n \n\n \n\n \n\n105 \n\n \n\n*Figure 81: Carousel produced\
    \ by code sample 78 *\n\nThere are a few more low-key JavaScript objects, but\
    \ most of them are not directly usable from \n\nnormal user code, and are generally\
    \ only used in special circumstances. The BS3 docs cover \n\neverything I've missed,\
    \ and if you're going to dig deeply into the JavaScript facilities available,\
    \ a \n\nlong read and an understanding of how everything is hooked together is\
    \ definitely a \n\nrequirement. \n\nOne final note: BS3 JavaScript plug-ins are\
    \ nothing more than regular jQuery plug-ins (BS uses \n\njQuery under the hood).\
    \ This means that it should be very easy to take your favorite jQuery \n\nplug-in\
    \ from places like unheap.com and adapt them to work with BS3 quite easily. Don’t\
    \ forget \n\nthere is still a huge number of add-ons available out there already,\
    \ especially to be used with \n\nthe framework, most of which are only a Google\
    \ search away. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_104_0.png)"
- md: "\n## Chapter 6 Customizing Bootstrap 3\n\nAnd so finally we get to the last\
    \ chapter in the book, which will show you how to create custom \n\ncolor sets.\n\
    \nIf you recall back at the beginning, when we were going through the major changes,\
    \ I mentioned \n\nthat the BS authors had provided an additional file to make\
    \ BS3 look just like BS2, rather than \n\nusing its flat look.\n\nThroughout this\
    \ book, we've used the default BS3 flat look, but if you download the prebuilt\
    \ \n\nJavaScript version of BS3 from the get bootstrap site (www.getbootstrap.com)\
    \ you'll find a new \n\nfile inside the archive you download called **bootstrap-theme.css**.\n\
    \nIf you link this file into your project immediately after your inclusion of\
    \ the core bootstrap.css file, \n\nyou'll find that even though you’re now using\
    \ the new BS3, the look and feel of your application \n\nstill resembles BS2.\n\
    \nThe authors realized that one of the main barriers to the adoption of BS3 in\
    \ new applications \n\nwas the inability to style it in a custom manner, but with\
    \ ease.\n\nIf you were a user of Less, or even SaSS (as BS3 now has SaSS bindings),\
    \ then this wasn't an \n\nissue. You simply opened up the Less sources, tweaked\
    \ the variables and Mixins you needed, \n\nand ran things through the Less compiler\
    \ to get your new CSS script.\n\nUnfortunately, not everyone used Less; in fact,\
    \ many developers and designers only had the \n\nability to download and include\
    \ the plain old pre-compiled CSS and JavaScript files, so a better \n\nway had\
    \ to be found.\n\nThe first change was opening up the entire Less sources to an\
    \ in-page customization tool \n\ndirectly on the Bootstrap main site, but this\
    \ isn't a new thing; you were able to use this page \n\nbefore in a limited way.\
    \ With BS3, however, the Less customization tool has had a complete \n\noverhaul,\
    \ and you can now redefine EVERYTHING that BS3 uses, from font sizes and \n\n\
    typefaces, right through to grid sizes, trigger points, and basic contextual color\
    \ sets.\n\nIn fact, there is now nothing that cannot be changed before you decide\
    \ to download your new \n\ncustomized CSS, as the following image shows:\n\n*Figure\
    \ 82: Screenshot of the top half of the new customization tool*\n\nBecause of\
    \ the sheer size of the tool, it's impossible to show the entire thing in this\
    \ book, but it's \n\neasy enough to access. Simply go to www.getbootstrap.com\
    \ and click **Customize** in the top \n\nmenu bar. You'll also see that you have\
    \ many other options, such as which JavaScript plug-ins \n\nand tool-kits to include,\
    \ which components to include, and base style that you may not want.\n\nFor example,\
    \ if all you want to use is the grid system, and nothing else, then you can simply\
    \ \n\nselect only the grid system, and unselect all the other components.\n\n\
    The BS3 site will then generate just the required code to include, and no more.\
    \ This is a boon \n\nfor those people who complain that all Bootstrap sites look\
    \ the same, because it means that \n\nyour site absolutely does not have to look\
    \ the same as the rest—you can just use the bits you \n\nneed, and use your own\
    \ stuff for everything else.\n\nThere are two other ways you can customize your\
    \ build. The first is to take the additional \n\n'bootstrap-theme' CSS style sheet,\
    \ make a copy, and then change the styles as you see fit. This \n\nis not as easy\
    \ as using the customization tools, but it's also not as difficult as the alternative.\
    \ \n\nMost of the class names and settings that you'll want to change to stamp\
    \ your personal mark in \n\nBS3 are already separated out in the BS2 theme, so\
    \ the quickest way to experiment is simply to \n\nput together a prototyping page\
    \ with the main controls and elements on you want to change, \n\nand then link\
    \ in your copy of the BS2 theme.\n\nIf you’re using Node and something like Bower,\
    \ it gets even easier, because you can use live \n\nreload, then just watch your\
    \ sample page change in near real-time as you tweak your custom \n\nversion of\
    \ the theme sheet.\n\nThe second way is slightly more involved, and as described\
    \ in the BS3 docs, comes in two \n\nflavors: light customizations and heavy customizations.\n\
    \nAn example of a light customization is adding a contextual color class to the\
    \ button element. For \n\nexample, if you wanted to add `**btn-sky**` alongside\
    \ the `**btn-info**`, `**btn-primary**`, etc. classes, \n\nyou might define a\
    \ single style sheet to hold the following rules:\n\n*Code Sample 79: Light Customization,\
    \ Adding a New Contextual Class to the BS3 Button Classes*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_106_0.png)\n\
    \n```css\n.btn-sky, .btn-sky:hover, .btn-sky:active {\n  color: #000000;\n}\n\
    ```\n\nWhen added and linked in correctly, it should look something like this:\n\
    \n*Figure 83: Output from code sample 80, when used with the customization in\
    \ sample 79*\n\nWhen used with a normal button tag in the following manner:\n\n\
    The hardest part of using this method is going through the base CSS style sheets\
    \ to find the \n\nnames you wish to override; it's not exactly difficult, just\
    \ long-winded.\n\nOnce you have one such as the button above, or you've found\
    \ and copied out an alert, panel, \n\nlist, or other class, then you can easily\
    \ make a template that can be reused whenever you want \n\nto add a custom class\
    \ of that type.\n\nHeavy customizations are not very different from light customizations;\
    \ the major difference is that \n\nyou override the entire class.\n\nSo, for example,\
    \ you find all the classes related to `**btn**`, copy them, modify them, and include\
    \ \n\nthem separately.\n\nThe new architecture inside the BS3 framework now means\
    \ that once you know the target \n\nselectors, and their siblings, creating an\
    \ override is easy. As I’ve already pointed out, the \n\nbootstrap-theme file\
    \ already contains much of what you might want to modify anyway, and if \n\nthat's\
    \ not an option, then try sites such as Bootswatch.com:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_107_0.png)\n\
    \n```css\ntext-shadow: 0 -1px 0 rgba(0, 0, 0, 2);\nbackground-color: #AAD4FF;\n\
    border: 1px solid black;\n}\n\n.btn-sky {\n  background-repeat: repeat-x;\n  background-image:\
    \ linear-gradient(top, #00FFFF 0%, #FFFF00 100%);\n}\n\n.btn-sky:hover {\n  background-position:\
    \ 0 -10px;\n}\n\n<button class=\"btn btn-sky\">My Sky Button</button>\n```\n\n\
    *Figure 84: Screen shot of the sweet and cherry theme from Bootswatch.com*\n\n\
    Many others have thousands of themes to choose from, both free and paid for, so\
    \ there's no \n\nexcuse for your Bootstrap site to look the same as everyone's.\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_108_0.png)\n\n## Closing Notes\n\n\
    Well that’s it folks, that’s all I have for this book. I knew when I started the\
    \ BS2 guide that\n\nit wouldn't be too long before BS3 went mainstream. It took\
    \ a little longer than expected to get it out\n\ninto the wild, but when it was\
    \ released, it was met with so much enthusiasm that I knew I simply\n\nhad to\
    \ start a follow-up covering BS3 straightaway.\n\nAfter a brief discussion with\
    \ the marketing team at Syncfusion (Hi guys!), we decided that the\n\nway forward\
    \ was to try and get this written in about a month, and by and large I did it.\
    \ What you\n\nare seeing now did not exist at the beginning of May 2014, and was\
    \ nothing more than a few\n\nscribbled down ideas on the notepad on my desk.\n\
    \nIf you'd like to reach out and ask me any questions about the book, I can generally\
    \ be found\n\nhanging about on twitter as @shawty_ds. You can also generally find\
    \ me on LinkedIn, or in the\n\nLinked.NET (Lidnug) users group that I help run\
    \ there.\n\nI hope you enjoy this book and that it helps you become a better developer\
    \ using Bootstrap 3. In\n\nthis new world of responsive web design, BS3 is a framework\
    \ that shouldn't be taken lightly—it\n\nrepresents a lot of research by one of\
    \ the biggest social media companies in existence, and is used to power most of\
    \ their public-facing sites.\n\nUntil next time, keep calm and carry on bootstrapping.\n"
  mdcn: "\n\n## 第 6 章 自定义 Bootstrap 3\n\n最后，我们来到了书的最后一章，它将向你展示如何创建自定义的\n\n颜色集合。\n\n\
    如果你还记得在开头，当我们回顾那些重大变化时，我提到过 BS 的作者提供了一个\n\n额外的文件，以让 BS3 看起来就像 BS2 一样，而不是使用它的扁平化外观。\n\
    \n在整本书中，我们一直默认的 BS3 扁平化外观，但如果你从 Bootstrap 官网\n\n(www.getbootstrap.com) 下载了 BS3\
    \ 的预编译 JavaScript 版本，你会在下载的压缩包中找到一个名为 **bootstrap-theme.css** 的新文件。\n\n如果你在包含核心\
    \ bootstrap.css 文件之后立即将此文件链接到你的项目中，你\n\n会发现，尽管你现在正在使用新的 BS3，但你的应用程序的视觉和感受\n\n\
    仍然类似于 BS2。\n\n作者们意识到，在新应用中采用 BS3 的主要障碍之一是无法以方便的方式进行自定义样式。\n\n如果你是 Less 的用户，甚至是\
    \ SaSS（因为 BS3 现在有了 SaSS 绑定），那么这并不是一个\n\n问题。你只需要打开 Less 源代码，调整你需要的变量和 Mixins，然后通过\
    \ Less 编译器\n\n运行以获取新的 CSS 脚本。\n\n遗憾的是，并不是每个人都使用 Less；事实上，许多开发者和设计师只有下载和\n\n包含旧的预编译\
    \ CSS 和 JavaScript 文件的能力，因此必须找到一种更好的方法。\n\n第一个变化是直接在 Bootstrap 主站上通过一个页面内自定义工具开放了整个\
    \ Less \n\n源代码，但这并不是什么新鲜事；你以前就可以以有限的方式使用这个页面。但是，\n\n对于 BS3，Less 自定义工具经过了完全的重构，你现在可以重新定义\
    \ BS3 使用的**所有内容**，从字体大小和字体，一直到网格大小、触发点和基础上下文颜色集合。\n\n事实上，在你决定下载新的自定义 CSS 之前，现在已经没有任何东西是不能改变的，\n\
    \n如下图像所示：\n\n*图 82：新自定义工具上半部分的截图*\n\n由于该工具规模庞大，在书中无法显示全部内容，但访问它非常简单。只需\n\n访问 www.getbootstrap.com\
    \ 并点击顶部菜单栏中的 **Customize**（自定义）。你还会看到\n\n你拥有许多其他选项，例如要包含哪些 JavaScript 插件和工具包，包含哪些\n\
    \n组件，以及你可能不需要的基础样式。\n\n例如，如果你只想使用网格系统，其他什么都不用，那么你只需要选择网格系统，\n\n并取消所有其他组件。\n\n\
    BS3 网站将只会生成包含所需的代码，不再多余。对于那些抱怨所有 Bootstrap \n\n网站看起来都一样的人来说，这是一个福音，因为这意味着你的网站完全不需要\n\
    \n和其他网站长得一样——你只需要使用需要的部分，并对其他一切使用你自己的东西。\n\n还有另外两种方法可以自定义你的构建。第一种是获取额外的\n\n'bootstrap-theme'\
    \ CSS 样式表，复制一份，然后根据你的喜好更改样式。这\n\n不像使用自定义工具那么简单，但也没有另一种方法那么困难。你想要在\n\nBS3 中留下个人印记而想要更改的类名和设置在\
    \ BS2 主题中已经分离出来，\n\n所以实验最快的方法实际上是组合一个包含你想要更改的主控制控件和元素的\n\n原型页面，然后链接你复制的 BS2 主题副本。\n\
    \n如果你正在使用 Node 和像 Bower 这样的工具，事情会变得更简单，因为你可以使用\n\n热重载（live reload），只需在你调整自定义主题表版本时，观察你的示例页面近乎实时的变化即可。\n\
    \n第二种方法稍微复杂一些，正如 BS3 文档所述，它分为两种\n\n类型：轻量级自定义和重度自定义。\n\n轻量级自定义的示例是为按钮元素添加上下文颜色类。例如，如果你想在\n\
    \n`**btn-info**`、`**btn-primary**` 等类旁边添加 `**btn-sky**`，你可能会定义一个样式表来包含以下规则：\n\n\
    *代码示例 79：轻量级自定义，为 BS3 按钮类添加一个新的上下文类*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_106_0.png)\n\
    \n```css\n.btn-sky, .btn-sky:hover, .btn-sky:active {\n  color: #000000;\n}\n\
    ```\n\n当正确添加并链接后，它看起来应该像这样：\n\n*图 83：代码示例 80 的输出，当与示例 79 中的自定义配合使用时*\n\n当以如下方式与普通按钮标签配合时：\n\
    \n使用这种方法最困难的部分是遍历基础 CSS 样式表以找到你想要覆盖的\n\n名称；这并不算困难，只是很繁琐。\n\n一旦你有了像上面按钮那样的，或者你找到并复制了警报（alert）、面板（panel）、\n\
    \n列表或其他类，那么你就可以轻松地创建一个模板，每当你想要添加该类型的\n\n自定义类时都可以重复使用。\n\n重度自定义与轻量级自定义没有太大区别；主要的区别在于你覆盖了整个类。\n\
    \n所以，例如，你找到所有与 `**btn**` 相关的类，复制它们，修改它们，并\n\n\n\n单独包含它们。\n\nBS3 框架内部的新架构意味着，一旦你知道了目标选择器及其兄弟元素，\n\
    \n创建覆盖是很容易的。正如我已经指出的，\n\nbootstrap-theme 文件已经包含了你可能想要修改的大部分内容，如果那不是选项，那么可以尝试像\
    \ Bootswatch.com 这样的网站：\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_107_0.png)\n\
    \n```css\ntext-shadow: 0 -1px 0 rgba(0, 0, 0, 2);\nbackground-color: #AAD4FF;\n\
    border: 1px solid black;\n}\n\n.btn-sky {\n  background-repeat: repeat-x;\n  background-image:\
    \ linear-gradient(top, #00FFFF 0%, #FFFF00 100%);\n}\n\n.btn-sky:hover {\n  background-position:\
    \ 0 -10px;\n}\n\n<button class=\"btn btn-sky\">My Button</button>\n```\n\n*图 84：来自\
    \ Bootswatch 的甜主题截图*\n\n## 结语\n\n好了各位，这就是这本书的全部内容了。当我开始 BS2 指南时，我就知道\n\n多久之后 BS3\
    \ 就会主流。发布它比预想的要晚，但当它发布时，收到的\n\n热情如此，我知道我必须立即开始关于 BS3 的后续。\n\n在与 Syncfusion 营销团队简短讨论后（大家好！），我们决定前进的方法是\n\
    \n尝试在一个月内完成编写，在很大程度上，我做到了。你现在看到的内容\n\n在 2014 年 5 月初还并不存在，只是我桌子上笔记本上随手写下的一些想法。\n\
    \n如果你想联系我并问我关于这本书的任何问题，我通常可以在 twitter 上的\n\n@shawty_ds 找到我。你也可以在 LinkedIn 上找到我，或者在我帮助运行的\n\
    \nLinked.NET (Lidnug) 用户群里。\n\n我希望你喜欢这本书，并且它能帮助你成为更好的 Bootstrap 3 开发者。在\n\n在这个响应式网页设计的新世界中，BS3\
    \ 是一个不容轻视的框架——它代表了\n\n全球最大的社交媒体公司之一的大量研究，并用于驱动他们大多数面向公众的网站。\n\n下次见，保持冷静并继续引导引导（bootstrapping）。\n\
    \n"
