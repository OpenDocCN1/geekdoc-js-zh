  - "[PAGE 59]\n\n \n\n \n\n \n\n60 \n\n \n\n*Figure 29: Output produced by sample\
    \ 36 *\n\nThe golden rule with the markup is that each individual button has to\
    \ be wrapped in its own \n\n`**<div>**` with a `**btn-group**` class applied to\
    \ it. Each of these single groups then need to be \n\nwrapped in an outer `**div**`,\
    \ which has both `**btn-group**` and `**btn-group-justified**` applied to it.\
    \ \n\nThere’s one thing to note if you're using justified groups: because the\
    \ buttons are rendered out \n\nas a block element, the button group-sizing classes\
    \ won't work as expected. This shouldn't \n\nreally come as a surprise, because\
    \ they won't work on single buttons that have the `**btn-block-**`\n\n`**level**`\
    \ class added either, just as inline elements marked and styled using block can't\
    \ be fluidly \n\ncontrolled in general. \n\nIf your buttons are made up of `**<a>**`\
    \ tags, then you don't need all this extra mark up—you just \n\nneed the outer\
    \ `**div**` with the `**btn-group-justified**` class added to it, and regular\
    \ buttons inside \n\nof it. \n\nA drop-down button with a menu attached is still\
    \ created in the exact same manner as it is in \n\nBS2. First, you create an outer\
