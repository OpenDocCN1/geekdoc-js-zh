  - "[PAGE 60]\n\n \n\n \n\n \n\n \n\n61 \n\n \n\n***Note: One of the new features\
    \ that the HTML 5 specification brings to the table is something ***\n\n***called\
    \ data attributes. BS3 (and for that matter BS2) uses these attributes in many\
    \ different ***\n\n***places to allow elements and JavaScript functions to be\
    \ joined together without the ***\n\n***developer ever having to write a single\
    \ line of JavaScript. Data attributes always take the ***\n\n***form of ***`***data-name***`***,\
    \ where ******name****** is the name the developer wishes to assign to that ***\n\
    \n***attribute. Using ***`***data-***`*** ensures that the attributes you define\
    \ will never interfere with ***\n\n***anything the WHATWG standards body adds\
    \ to the spec, giving developers utmost ***\n\n***flexibility in what they wish\
    \ to use them for. ***\n\n***In most cases, these data attributes are used the\
    \ way BS3 uses them: in order to pass ***\n\n***information from the element into\
    \ the JavaScript routines working on it. They can be used ***\n\n***to pass in\
    \ ID names, options, parameters for sizes, and many other things, meaning that\
    \ ***\n\n***you often don't actually have to write any boilerplate code in your\
    \ app. Throughout this ***\n\n***chapter, you'll be introduced to many more of\
    \ these data attributes. ***\n\nIn order for the drop-down buttons to work, you\
    \ MUST have the drop-down JavaScript plug-in \n\nadded to your BS3 build. If you've\
    \ just downloaded the default set, then this won't be a problem, \n\nas `**dropdown.js**`\
    \ is already part of the main `**bootstrap.js**` file. If you've done a custom\
    \ build, or \n\neven compiled from the Less sources yourself, you'll need to make\
    \ sure it's present. \n\nThe following code shows a basic drop-down button example:\
    \ \n\n*Code Sample 37: Dropdown Button Example *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_60_0.png)\n\
    \n`<div class=\"btn-group\"> `\n\n` <button type=\"button\" class=\"btn btn-success\
    \ dropdown-toggle\" data-`\n\n`toggle=\"dropdown\"> `\n\n` A dropdown button <span\
    \ class=\"caret\"></span> `\n\n` </button> `\n\n` <ul class=\"dropdown-menu\"\
    \ role=\"menu\"> `\n\n` <li><a href=\"#\">1st Link</a></li> `\n\n` <li><a href=\"\
    #\">2nd Link</a></li> `\n\n` <li><a href=\"#\">3rd Link</a></li> `\n\n` <li class=\"\
    divider\"></li> `\n\n` <li><a href=\"#\">1st Link after divider</a></li> `\n\n\
    ` </ul> `\n\n`</div> `\n\n` `"
- md: "\n*Figure 30: Output generated by code sample 37 *\n\nBy making a simple modification\
    \ to code sample 37, you can easily turn the button into a split drop-down menu,\
    \ where the action of the button remains a single action in its own right, but\
    \ still allowing the menu to appear when the caret is clicked.\n\nTo do this,\
    \ simply add another button element just before the button element, then move\
    \ the text (but NOT the caret) from the (now) second button into the first, so\
    \ the new button tag looks like this:\n\nIf you then re-render the output in your\
    \ browser, you should see the following:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_61_0.png)\n\
    \n```html\n<button type=\"button\" class=\"btn btn-success\">A dropdown button</button>\n\
    <button type=\"button\" class=\"btn btn-success dropdown-toggle\" data-toggle=\"\
    dropdown\">\n  <span class=\"caret\"></span>\n</button>\n<ul class=\"dropdown-menu\"\
    \ role=\"menu\">\n  <li><a href=\"#\">1st Link</a></li>\n  <li><a href=\"#\">2nd\
    \ Link</a></li>\n  <li><a href=\"#\">3rd Link</a></li>\n  <li class=\"divider\"\
    ></li>\n  <li><a href=\"#\">1st Link divider</a></li>\n</ul>\n```\n\n*Figure 31:\
    \ Output generated by code sample 37 after it's been amended *\n\nThe final thing\
    \ to mention before moving on are the sizing and drop-up variations. The sizing\
    \ is simple; the sizing classes mentioned in the chapter work as expected with\
    \ drop-down buttons, in the same manner as they do on normal buttons (`lg` for\
    \ large, `md` since medium is the default, `sm` for small, and `xs` for extra\
    \ small). `Drop-up` is a class name that you apply to the outer element with the\
    \ `btn-group` class when constructing a drop-down or split drop-down button, which,\
    \ as its name implies, causes the menu to pop upwards rather than downwards.\n\
    \n## A final note on drop-down menus\n\nDrop-down menus aren’t only attached to\
    \ buttons—ANY element that can be wrapped in an outer parent can be used. You\
    \ can apply a class of `dropdown` to the wrapped element with a `data` attribute\
    \ of `toggle`, and the value of `dropdown`, which will cause that element to become\
    \ the trigger for the drop-down menu to display.\n\n## Input Group Changes\n\n\
    In short, have been no changes to the input group functionality between BS2 and\
    \ BS3. Input groups are still marked up exactly as before with the same caveats,\
    \ namely:\n\n- You cannot add multiple additions on one side, only one on each\
    \ end.\n- Multiple elements in one input group are not supported.\n- You cannot\
    \ mix input groups with other components; you must nest them.\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_62_0.png)\n\
    \nIf you’re attaching tooltips and popovers, you must add a container as previously\
    \ mentioned under button changes. Where possible, avoid using input groups with\
    \ select lists, especially when targeting WebKit-based browsers. To create an\
    \ input group, simply wrap your input control and its prefix (which will generally\
    \ be a `<span>`) in a `<div>` or other block-level element with a class type of\
    \ `input-group` applied to it. Next, make sure that the additional `<span>` has\
    \ a class of `input-group-addon` applied to it.\n\nFor example, the following\
    \ code will create an input box for a Twitter handle, and an input box for money\
    \ where you’re not entering a decimal part.\n\n*Code Sample 38: BS3 Input Addons\
    \ Using Input Groups *\n\n*Figure 32: The output produced by code sample 38 *\n\
    \nThe normal sizing classes also apply to these, just as they apply to other form\
    \ inputs, so adding `input-group-lg` and `input-group-sm` (again, there is no\
    \ `md`) to the outer input group will size the entire control set accordingly.\n\
    \nOne thing that’s not new in BS3, but has been made easier to do, is adding checkboxes,\
    \ radio buttons, regular buttons, and drop-down menus to input groups. Each of\
    \ these options require a bit more markup than when you’re using a regular `<span>`,\
    \ but the resulting effect is that you can add interactivity to your fields. For\
    \ example, you might use these inputs to create your own file upload control,\
    \ or a button that creates a random password. The following code shows how to\
    \ achieve this:\n\n*Code Sample 39: Input Groups Using Buttons and Radios *\n\n\
    ```html\n<div class=\"input-group\">\n  <span class=\"input-group-addon\">@</span>\n\
    \  <input type=\"text\" class=\"form-control\" placeholder=\"Username\">\n</div>\n\
    <br/>\n<div class=\"input-group\">\n  <input type=\"text\" class=\"form-control\"\
    >\n  <span class=\"input-group-addon\">.00</span>\n</div>\n<div class=\"input-group\"\
    >\n  <span class=\"input-group-addon\"></span>\n</div>\n```\n\n*Figure 33: Output\
    \ produced by code sample 39 *\n\n## Navigation Changes\n\nThe navigation components\
    \ have had their own share of changes, but much like the other groups, this is\
    \ mostly to tie things up be more meaningful. There are two main sections when\
    \ it comes to navigation: basic navigation and nav-bars. Of these two, nav-bars\
    \ have changed the most.\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_63_0.png)\n\
    \nTo begin with, in BS2, all you really had were nav-bars; there were no button\
    \ classes or text classes—only the brand. This lead to much confusion among developers\
    \ and many questions, such as \"How do I centrally line up text in nav-bar?\"\
    \ and \"How do I stop my buttons from increasing the height of my nav-bar?\" BS3\
    \ has now introduced many new classes designed especially for these scenarios,\
    \ which we’ll introduce soon.\n\nFirst things first: the navigation component\
    \ that was in BS2 is gone. Not just deprecated, but taken away. While it was easy\
    \ to work with (you created an unordered list, added a sprinkle of bootstrap magic,\
    \ and were good to go), it was messy, didn't work consistently in all browsers,\
    \ and had a few rendering problems. What do we have in its place? We have List\
    \ groups, which we’ll cover in detail later on. For now, let’s talk about what\
    \ remains, as it will set the groundwork for using List groups a later on. So\
    \ what is the base class then? It may surprise you to learn that it's simply a\
    \ class called `nav`, which along with `nav-tabs`, `nav-pills`, and `nav-stacked`,\
    \ can be used to make tab, pill, and sidebar-based navigation structures in the\
    \ same way you used to make `nav` lists in BS2. The markup is now much simpler.\
    \ You don't need to worry about any extra padding or browser quirks, and you certainly\
    \ don't need any custom stuff to get done.\n\nTo use tabs, simply take an unordered\
    \ list, and add a `nav` and `nav-tabs` class, as the following code shows:\n\n\
    *Code Sample 40: Tab Based Navigation *\n\n*Figure 34: Output produced by code\
    \ sample 40 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_65_0.png)\n\n```html\n\
    <ul class=\"nav nav-tabs\">\n  <li class=\"active\"><a href=\"#\">Home</a></li>\n\
    \  <li><a href=\"#\">Profile</a></li>\n  <li><a href=\"#\">Messages</a></li>\n\
    </ul>\n```\n"
  mdcn: "\n\n*图 30：代码示例 37 生成的输出*\n\n通过对代码示例 37 进行简单的修改，你可以轻松将按钮转换为拆分下拉菜单（split drop-down\
    \ menu），其中按钮的操作本身保持为一个独立动作，但点击 Caret（箭头）时仍允许菜单出现。\n\n要实现这一点，只需在按钮元素之前直接添加另一个按钮元素，然后将文本（但**不是**\
    \ Caret）从（现有的）第二个按钮移动到第一个按钮中，使得新的按钮标签看起来如下所示：\n\n如果你随后在浏览器中重新渲染输出，你应该看到以下内容：\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_61_0.png)\n\n```html\n<button type=\"\
    button\" class=\"btn btn-success\">A dropdown button</button>\n<button type=\"\
    button\" class=\"btn btn-success dropdown-toggle\" data-toggle=\"dropdown\">\n\
    \  <span class=\"caret\"></span>\n</button>\n<ul class=\"dropdown-menu\" role=\"\
    menu\">\n  <li><a href=\"#\">1st Link</a></li>\n  <li><a href=\"#\">2nd Link</a></li>\n\
    \  <li><a href=\"#\">3rd Link</a></li>\n  <li><li class=\"divider\"></li>\n  <li><a\
    \ href=\"#\">1st Link divider</a></li>\n</ul>\n```\n\n*图 31：代码示例 37 修改后生成的输出*\n\
    \n在继续下文之前，最后要提到的一点是尺寸调整（sizing）和向上弹出（drop-up）变体。尺寸调整非常简单；章节中提到的尺寸类在下拉按钮上的工作符合预期，其方式与它们在普通按钮上的方式相同（`lg`\
    \ 表示大号，`md` 是默认值，`sm` 表示小号，`xs` 表示超小）。`Drop-up` 是一个类名，当你在构建下拉菜单或拆分下拉按钮时，将其应用到带有\
    \ `btn-group` 类的外部元素上，正如其名称所示，它会导致菜单向上弹出而不是向下弹出。\n\n## 关于下拉菜单的最后说明\n\n下拉菜单不仅可以附加在按钮上——**任何**可以包裹在外部父级元素中的元素都可以使用。你可以对被包裹的元素应用\
    \ `dropdown` 类，并带有 `toggle` 属性，其属性值为 `dropdown`，这将导致该元素成为下拉菜单显示的触发器。\n\n## 输入组的变化\n\
    \n简而言之，在 BS2 和 BS3 之间输入组（input group）的功能没有变化。输入组的标记方式仍然与之前完全相同，并具有相同的的注意事项，即：\n\
    \n- 你不能在同一侧添加多个添加项，每端各只能添加一个。\n- 不支持在一个输入组中使用多个元素。\n- 你不能将输入组与其他组件混合；你必须对它们嵌套。\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_62_0.png)\n\n如果你正在附加工具提示（tooltips）和弹出框（popovers），你必须像之前在按钮更改部分提到的那样添加一个容器。尽可能避免在带有选择列表（select\
    \ lists）在使用输入组，特别是针对基于 WebKit 的浏览器时。要创建一个输入组，只需将你的输入控件及其前缀（通常是 `<span>`）包裹在 `<div>`\
    \ 或其他块级元素中，并对其应用 `input-group` 类。接下来，确保额外的 `<span>` 应用了 `input-group-addon` 类。\n\
    \n例如，以下代码将为 Twitter 句柄创建一个输入框，并为不需要输入小数部分的金额创建一个输入框。\n\n*代码示例 38：使用输入组的 BS3 输入附加框*\
    \ \n\n*图 32：代码示例 38 生成的输出*\n\n标准的尺寸类也适用于这些内容，就像它们适用于其他表单输入一样，因此在外部输入组上添加 `input-group-lg`\
    \ 和 `input-group-sm`（再次，没有 `md`）将对整个控制set进行相应的尺寸调整。\n\n在 BS3 中不是新功能、但变得更容易实现的一点是在输入组中添加复选框、单选按钮、普通按钮和下拉菜单。这些选项中的每一个都比使用普通\
    \ `<span>` 时需要更多的标记，但结果是你可以为你的字段添加交互性。例如，你可能使用这些输入来创建自己的文件上传控件，或者一个创建随机密码的按钮。以下代码显示了如何实现这一点：\n\
    \n*代码示例 39：使用按钮和单选框的输入组*\n\n```html\n<div class=\"input-group\">\n  <span class=\"\
    input-group-addon\">@</span>\n  <input type=\"text\" class=\"form-control\" placeholder=\"\
    Username\">\n</div>\n<br/>\n<div class=\"input-group\">\n  <input type=\"text\"\
    \ class=\"form-control\">\n  <span class=\"input-group-addon\">.00</span>\n</div>\n\
    <div class=\"input-group\">\n  <span class=\"input-group-addon\"></span>\n</div>\n\
    ```\n\n*图 33：代码示例 39 生成的输出*\n\n## 导航的变化\n\n导航组件也有自己的变化，但与其他组类似，这主要是为了整理工作以使其更有意义。在涉及导航时，有两个主要部分：基础导航（basic\
    \ navigation）和导航栏（nav-bars）。在这两者中，导航栏的变化最大。\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_63_0.png)\n\
    \n最初，在 BS2 中，你真正拥有的导航栏；没有按钮类或文本类——只有品牌（brand）。这导致了开发者之间的许多困惑和许多问题，例如“如何让导航栏中的文本居中？”以及“如何防止我的按钮增加导航栏的高度？”BS3\
    \ 现在引入了许多专门为这些场景设计的类，我们将很快介绍。\n\n首先：BS2 中的导航组件消失了。不仅仅是过时了，而是被移除了。虽然它很容易使用（你创建一个无序列表，添加一点\
    \ Bootstrap 魔法就可以搞定），但它很杂乱，在所有浏览器中工作都不一致，并且存在一些渲染问题。我们现在有了什么？我们有了列表组（List groups），稍后我们将详细介绍。现在，让我们讨论剩余的部分，因为它为稍后使用列表组奠定了基础。那么基础类是什么呢？可能会让你惊讶的是，它简单是一个名为\
    \ `nav` 的类，结合 `nav-tabs`、`nav-pills` 和 `nav-stacked`，可以像你以前在 BS2 中制作 `nav` 列表一样制作标签、药丸和侧边栏导航结构。现在的标记要简单得多。你不需要担心任何额外的内边距或浏览器异常，你绝对不需要自定义内容来完成任务。\n\
    \n要使用标签，只需取无序列表，并添加 `nav` 和 `nav-tabs` 类，如以下代码所示：\n\n*代码示例 40：基于标签的导航*\n\n*图 34：代码示例\
    \ 40 生成的输出*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_65_0.png)\n\n```html\n\
    <ul class=\"nav nav-tabs\">\n  <li class=\"active\"><a href=\"#\">Home</a></li>\n\
    \  <li><a href=\"#\">Profile</a></li>\n  <li><a href=\"#\">Messages</a></li>\n\
    </ul>\n```\n\n"
