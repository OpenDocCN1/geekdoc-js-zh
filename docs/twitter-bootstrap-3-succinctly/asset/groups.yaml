  - "[PAGE 14]\n\n \n\n \n\n \n\n \n\n15 \n\n*Code Sample 1: Version 2 Flexible Container\
    \ *\n\nIn version 3 the `**container**` and `**row-fluid**` classes no longer\
    \ exist. \n\nSo how do you get a fluid container? Simple: you don't. \n\nRather\
    \ than wrap your contents in a `**container**` and then a `**row**`, you simply\
    \ don’t wrap them in \n\nanything. \n\nYou can still use the grid system to provide\
    \ enclosing containers for your content, so that things \n\nline up nicely with\
    \ Bootstrap’s grid, but you no longer need to put a container around those \n\n\
    collections of `**<div>**` elements before you use them. \n\nIn fact, if you use\
    \ `**container**` and `**row**` (the non-fluid versions still exist) then you'll\
    \ end up with \n\nall your content being in the 1024-pixel, central column automatically,\
    \ and be able to use the \n\nentire page width if you do not. \n\n**Migrating\
    \ the Grid System **\n\nThen next biggest class change is the grid system itself.\
    \ \n\nIn version 2 you typically created grids in the following manner: \n\n*Code\
    \ Sample 2: Version 2 Grid Classes *\n\nThis code would give you two containers\
    \ that neatly filled the 12 grid squares horizontally that \n\nall layouts had\
    \ (typically a side bar). \n\nIn version 3, the “medium level” grid is now the\
    \ equivalent of the v2 `**span**` classes, so to rewrite \n\nthe previous code\
    \ for V3 you simply do the following: \n\n*Code Sample 3: Version 3 Grid Classes\
    \ Equivalent to 'Span' *\n\n`<div class=\"container-fluid\" id=\"myParentContainer\"\
    > `\n\n` <div class=\"row-fluid\" id=\"mycontentrow\"> `\n\n` <h1>A headline</h1>\
    \ `\n\n` <p>Some paragraph text</p> `\n\n` </div> `\n\n`</div> `\n\n` `\n\n`<div\
    \ class=\"container\"> `\n\n` <div class=\"span2\">Content here</div> `\n\n` <div\
    \ class=\"span10\">Content here</div> `\n\n`</div> `\n\n` `\n\n`<div class=\"\
    container\"> `\n\n` <div class=\"col-md-2\">Content here</div> `"
  - "[PAGE 15]\n\n \n\n \n\n \n\n16 \n\n \n\nHowever, whereas version 2 had only one\
    \ level of grid size, version 3 now has four levels. Each \n\nlevel is tailored\
    \ for the expected main target device that you anticipate your end product will\
    \ be \n\nrunning on. \n\nThese grid units are now named as follows: \n\nExtra\
    \ small devices: `**col-xs-\\***` \n\nSmall devices: `**col-sm-\\***` \n\nMedium\
    \ devices: `**col-md-\\***` \n\nLarge devices: `**col-lg-\\***` \n\nMedia queries\
    \ are used internally for BS3 to decide just which of the aforementioned grid\
    \ \n\nclasses to use, and the different sizes are defined as follows: \n\nExtra\
    \ small: display width less than 768 pixels \n\nSmall: display width greater than\
    \ or equal to 768 pixels, or less than 992 pixels \n\nMedium: display width greater\
    \ than or equal to 992 pixels, or less than 1,200 pixels \n\nLarge: display width\
    \ greater than or equal to 1,200 pixels \n\nYou can code up multiple versions\
    \ of your grid for BS3 to decide which type to use when \n\ntargeting multiple\
    \ displays. For example if you did the following: \n\n*Code Sample 4: Multiple\
    \ Grid Size Declarations *\n\n` <div class=\"col-md-10\">Content here</div> `\n\
    \n`</div> `\n\n` `\n\n`<div class=\"container\"> `\n\n` <div class=\"col-xs-2\"\
    >Content here</div> `\n\n` <div class=\"col-xs-10\">Content here</div> `\n\n`\
    \ <div class=\"col-sm-2\">Content here</div> `\n\n` <div class=\"col-sm-10\">Content\
    \ here</div> `\n\n` <div class=\"col-md-2\">Content here</div> `\n\n` <div class=\"\
    col-md-10\">Content here</div> `\n\n` <div class=\"col-lg-2\">Content here</div>\
    \ `\n\n` <div class=\"col-lg-10\">Content here</div> `\n\n`</div> `\n\n` `"
  - "[PAGE 16]\n\n \n\n \n\n \n\n \n\n17 \n\nBS3 will hide and unhide the containers\
    \ as required, depending on the width of the device \n\ndisplay and the operation\
    \ of the media queries. \n\nAs with previous versions of the grid system, there\
    \ are 12 columns horizontally across all the \n\ndifferent sizes, so whichever\
    \ grid size is displayed, you will always still get 12 grids on every \n\ndevice.\
    \ \n\nThe column width itself does change, however, so you may need to plan the\
    \ content in those \n\ngrids to take advantage of the differing sizes. The sizes\
    \ for each of them are as follows: \n\n`**col-xs-\\***` = Auto sizing, no fixed\
    \ dimensions \n\n`**col-sm-\\***` = 60 pixels \n\n`**col-md-\\***` = 78 pixels\
    \ \n\n`**col-lg-\\***` = 95 pixels \n\nThe gutter margin in all cases will remain\
    \ at 15 pixels on each side of the grid container, giving \n\nan overall gutter\
    \ of 30 pixels. This size will be consistent no matter which grid size level you’re\
    \ \n\nusing. \n\nNesting and offsets work as they did previously, but as with\
    \ the grids themselves, by way of a \n\nslight renaming of the actual classes\
    \ used. \n\nTo apply an offset, simply use `**col-md-offset-\\***`, remembering\
    \ to replace the `**md**` with `**xs**`, `**sm**`, or \n\n`**lg**` as needed,\
    \ depending on your grid size. \n\nNesting is done simply by nesting containers\
    \ under control of the `**col-xx-\\***` classes inside each \n\nother, where they\
    \ will resize and behave as they did in previous BS versions. \n\nThe following\
    \ examples show the correct way to achieve both of these techniques: \n\n*Code\
    \ Sample 5: Nested Grids in Version 3 *\n\nThis example will give you a grid that\
    \ looks like the following: \n\n`<div class=\"col-md-9\"> `\n\n` Level 1: .col-md-9\
    \ `\n\n` <br/> `\n\n` <div class=\"col-md-6\"> `\n\n` Level 2: .col-md-6 `\n\n\
    ` </div> `\n\n` <div class=\"col-md-6\"> `\n\n` Level 2: .col-md-6 `\n\n` </div>\
    \ `\n\n`</div> `\n\n` `"
  - "[PAGE 17]\n\n \n\n \n\n \n\n18 \n\nLevel 1: col-md-9 \n\nLevel 2: col-md-6 \n\
