    #\">&raquo;</a></li> `\n\n`</ul> `\n\n` `"
  - "[PAGE 70]\n\n \n\n \n\n \n\n \n\n71 \n\nYou'll see that in many wiki- or blog-style\
    \ sites, there is usually an Older/Newer, or \n\nPrevious/Next button pair at\
    \ the foot of a page. \n\nTo make the default version of this, simply create a\
    \ `**<ul>**` as we have throughout this entire \n\nsection, and add a class of\
    \ `**pager**` to it like so: \n\n*Code Sample 44: Simple BS3 Pager *\n\n \n\n\
    *Figure 43: Output from code sample 44 *\n\nA pager will automatically place its\
    \ buttons in the center of the available space, as seen in \n\nFigure 44, but\
    \ you can also justify them left and right by adding the `**previous**` and `**next**`\
    \ classes \n\nto the inner `**<li>**` elements. \n\nIf you change code sample\
    \ 44 so that the `**<li>**` holding the previous button has a class of \n\n`**previous**`\
    \ assigned, and the `**<li> **`holding the next button has a class of `**next**`,\
    \ and then re-\n\nrender the output, you should see your browser change to the\
    \ following: \n\n \n\n*Figure 44: Code sample 44 with optional *`***previous***`*\
    \ and *`***next***`* classes applied *\n\nYou'll see that, again, the output expands\
    \ responsively to fill all of the available space, and as \n\nbefore, you can\
    \ easily control this using grids, spans, and other containers as needed. \n\n\
    **Navbar Navigation **\n\nIf there's one thing that BS3 does way better than any\
    \ of the other frameworks I've seen out \n\nthere, it's navigation bars. Whether\
    \ it's a drop-down menu, a title with sign-in/out controls, or just \n\na decoration,\
    \ there's no denying that navigation bars in Bootstrap are powerful. \n\nUnfortunately,\
    \ in BS2 there was quite a bit lacking. There were many hacks published to allow\
    \ \n\nthings to be lined up, but some of the CSS used was a little rough around\
    \ the edges. BS3 \n\nchanges all of this. \n\n![](img/3ef3f89d48533001235bf8b5b1e48737_70_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_70_1.png)\n\
    \n`<ul class=\"pager\"> `\n\n` <li><a href=\"#\">Previous</a></li> `\n\n` <li><a\
    \ href=\"#\">Next</a></li> `\n\n`</ul> `\n\n` `"
- md: "\nThe basic navigation bar now starts its life as a collapsed item in your\
    \ pages display. This means that if the first display is on a mobile device, your\
    \ design will start out with a nicely collapsed menu bar, ready to be expanded\
    \ exactly as a mobile user would expect. In BS2, the opposite was the case, and\
    \ you had to take extra steps to collapse the display before making it visible.\n\
    \nThe navigation bar will progressively become visible as the display width increases,\
    \ until the entire unit in full has enough space to render horizontally across\
    \ the page.\n\nBe careful though—even with a non-fluid column width of 1024px,\
    \ and a fluid width of your entire display, it’s still possible to run out of\
    \ space. When this happens, you could end up with some major content-overflow\
    \ scenarios. For example, it's not difficult to push your navigation bar two or\
    \ more rows in height.\n\nThe recommended way to ensure this doesn't happen is\
    \ to use custom styling to control the width of your elements, and/or to use the\
    \ responsive visibility classes to control what is and is not shown for different\
    \ screen sizes.\n\nIf you’re using Less, you can now also customize the `@grid-float-breakpoint`\
    \ variable to control the trigger point where your navigation bar collapses, or\
    \ you can just customize the appropriate media queries in the base CSS.\n\nNavigation\
    \ bars require JavaScript to be enabled to work correctly; if it's not enabled,\
    \ the bar should still display, but the collapsing won’t work correctly. You also\
    \ need to ensure that if you've done a custom build, you've also included the\
    \ collapse JavaScript plug-in.\n\nThe following code sample shows how to create\
    \ a basic empty, collapsible navigation bar:\n\n*Code Sample 45: Simple Empty\
    \ BS3 Collapsible Navigation Bar*\n\n*Figure 45: Blank nav bar produced by code\
    \ sample 45*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_71_0.png)\n\n```html\n\
    <nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"container-fluid\"\
    >\n    <div class=\"navbar-header\">\n      <button type=\"button\" class=\"navbar-toggle\"\
    \ data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\">\n  \
    \      <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n    </div>\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"bs-example-navbar-collapse-1\">\n    </div>\n    <!-- /.navbar-collapse\
    \ -->\n  </div>\n  <!-- /.container-fluid -->\n</nav>\n```\n\nIt may not look\
    \ like much, but this bar will collapse and expand as needed for different sizes,\
    \ and all we need to do now is to add some content to it. Let's start with branding.\n\
    \nIf you're going to brand your navigation using the `navbar-brand` class on an\
    \ `<a>` link, then the BS3 best practice is to group this element with the `navbar-toggle`\
    \ element that builds the three-line collapse icon. This ensures that, when collapsing,\
    \ the text shrinks down as far as it can before becoming invisible and stacking\
    \ vertically.\n\nTo make this change, in code sample 45, simply add:\n\nImmediately\
    \ after the closing button tag that holds the three `<span>` elements with a class\
    \ of `icon-bar`, and then refresh your browser. The result should now look like\
    \ this:\n\n*Figure 46: Blank nav bar with a brand added*\n\nIf you hover over\
    \ the brand text, you'll see that it's also an active link, generally used to\
    \ return to a site’s home page. You can also put an image in here too, but there\
    \ are no specific classes here to help you. I've done this in some designs, but\
    \ unfortunately, it still takes a bit of manual work. If you make the image about\
    \ the same height as the `<h1>` element, things stay lined up nicely. Otherwise,\
    \ the best way I've found to make it work is to put some padding in front of the\
    \ element holding the band name, then absolute-position your logo with suitable\
    \ bottom margins/padding so that it does not hide any content below.\n\nMoving\
    \ on from the brand class, we also have specific classes for forms, buttons, and\
    \ text, as follows:\n\n- `navbar-nav`: for creating a main `<ul>` of navigation\
    \ links and dropdowns\n- `navbar-form`: for creating inline miniature forms\n\
    - `navbar-btn`: for marking button components up to be navbar friendly\n- `navbar-text`:\
    \ for including independent lines of text in your bar\n- `navbar-link`: for adding\
    \ independent links that are not part of the regular navigation items\n\nYou can\
    \ use them all together, on their own as needed, or combine them with the new\
    \ emerging web components specification and create a single bar that takes a configuration\
    \ and draws what it needs, as it needs.\n\nThe following code sample expands 45\
    \ to include some navigation links:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_72_0.png)\n\
    \n```html\n<a class=\"navbar-brand\" href=\"#\">BS3</a>\n```\n\n*Code Sample 46:\
    \ Example Expanded to Include Links*\n\nAs with all other navigation link, and\
    \ elements, you'll see we've employed the `active` class to mark the first link\
    \ as active, and like the others, you can apply the `disabled` and similar classes\
    \ to mark up items as needed. It’s just as easy to create a menu that expands\
    \ down from any of the buttons. All you have to do is use the same pattern of\
    \ markup as you do when creating drop-down menus on buttons except you wrap it\
    \ in a `navbar-nav` parent element like:\n\n*Code Sample 47: Navigation Bar Expanded\
    \ to Hold a Drop-Down Button*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_73_0.png)\n\
    \n```html\n<nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"\
    container-fluid\">\n    <div class=\"navbar-header\">\n      <button type=\"button\"\
    \ class=\"navbar-toggle\" data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\"\
    >\n        <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
    >BS3</a>\n    </div>\n    <div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n      <ul class=\"nav-nav\">\n        <li class=\"active\"><a href=\"#\">Menu\
    \ 1</a></li>\n        <li><a href=\"#\">Menu 2</a></li>\n      </ul>\n    </div>\n\
    \    <!-- /.navbar-collapse -->\n  </div>\n  <!-- /.container-fluid -->\n</nav>\n\
    \n<nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"container-fluid\"\
    >\n    <div class=\"navbar-header\">\n      <button type=\"button\" class=\"navbar-toggle\"\
    \ data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\">\n  \
    \      <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
    >BS3</a>\n    </div>\n  </div>\n```\n\n*Figure 48: Drop-down menu produced by\
    \ code sample 47*\n\nYou can combine each of these, so it's simple to have drop-down\
    \ and non-dropdown links in one `navbar-nav` `<ul>` just by marking up each `<li>`\
    \ element as needed.\n\nAnother common requirement in navigation bars is the obligatory\
    \ sign-in form, generally used to sign in to a protected area on a site.\n\nBS3\
    \ makes these forms even easier to construct using the `navbar-form` class. So\
    \ far, we've seen that all our elements are left-aligned in the navigation bar’s\
    \ inner-content area. Since signin forms are usually right-aligned, the BS3 team\
    \ has provided the `navbar-right` class to allow you to do just such a thing.\
    \ The following code illustrates an example:\n\n*Code Sample 48: BS3 Navigation\
    \ Bar with a Sign-In Form Right Aligned*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_74_0.png)\n\
    \n```html\n<div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n  <ul class=\"nav navbar-nav\">\n    <li class=\"dropdown\">\n      <a href=\"\
    #\" class=\"dropdown-toggle\" data-toggle=\"dropdown\">Menu 1 <b class=\"caret\"\
    ></b></a>\n      <ul class=\"dropdown-menu\">\n        <li><a href=\"#\">Sub Menu\
    \ 1</a></li>\n        <li><a href=\"#\">Sub Menu 2</a></li>\n        <li><a href=\"\
    #\">Sub Menu 3</a></li>\n        <li class=\"divider\"></li>\n        <li><a href=\"\
    #\">Sub Menu 4</a></li>\n        <li class=\"divider\"></li>\n        <li><a href=\"\
    #\">Sub Menu 5</a></li>\n      </ul>\n    </li>\n  </ul>\n</div>\n```\n"
  mdcn: "\n基础导航栏现在在你的页面显示中以折叠项的形式开始运行。这意味着，如果第一个显示是在移动设备上，你的设计将从一个精致的折叠菜单栏开始，并准备好完全按照移动用户的预期进行展开。在\
    \ BS2 中，情况恰相反，你必须在显示它之前采取额外的步骤来对其进行折叠。\n\n导航栏将随着显示宽度的增加逐渐变得可见，直到整个单元在全尺寸下有足够的空间跨页面进行水平渲染。\n\
    \n但请注意——即使列宽为非流式的 1024px，且整个显示宽度是流式的，仍然可能空间不足。当这种情况发生时，你可能会面临严重的内容溢出场景。例如，将你的导航栏推到两或更多行高并不困难。\n\
    \n确保这种情况发生的推荐方法是使用自定义样式来控制元素的宽度，和/或使用响应式可见性类来控制不同屏幕尺寸下显示和不显示的内容。\n\n如果你使用 Less，现在还可以自定义\
    \ `@grid-float-breakpoint` 变量来控制导航栏折叠的触发点，或者你可以直接在基础 CSS 中自定义相应的媒体查询。\n\n导航栏需要启用\
    \ JavaScript 才能正常工作；如果没有启用，导航栏仍然会显示，但折叠功能将无法正常运行。你还需要确保如果你进行了自定义构建，也已经包含了折叠 JavaScript\
    \ 插件。\n\n下面的代码示例显示了如何创建一个基础的、可折叠的导航栏：\n\n*代码示例 45: 简单的空 BS3 折叠导航栏*\n\n*图 45: 由代码示例\
    \ 45 生成空白空白栏*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_71_0.png)\n\n```html\n\
    <nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"container-fluid\"\
    >\n    <div class=\"navbar-header\">\n      <button type=\"button\" class=\"navbar-toggle\"\
    \ data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\">\n  \
    \      <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n    </div\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"bs-example-navbar-collapse-1\">\n    </</div>\n    <!-- /.navbar-collapse\
    \ -->\n  </div>\n  <!-- /.container-fluid -->\n</nav>\n```\n\n它看起来可能没什么什么，但这个栏会根据不同尺寸的需求进行折叠和展开，我们现在需要做的只是向它添加一些内容。让我们从品牌化开始。\n\
    \n如果你打算在 `<a>` 链接上使用 `navbar-brand` 类为你的导航栏进行品牌化，那么 BS3 的最佳实践是将此元素与构建三线折叠图标的 `navbar-toggle`\
    \ 元素组合在一起。这确保了在折叠时，文本在变得不可见并垂直堆叠之前会尽可能地缩小。\n\n要进行此项更改，在代码示例 45 中，只需在包含三个类为 `icon-bar`\
    \ 的 `<span>` 元素的闭合按钮标签之后添加：\n\n然后刷新你的浏览器。结果现在应该像这样：\n\n*图 46: 添加了品牌的空白导航栏*\n\n\
    *当你将鼠标悬停在品牌文本上时，你会发现它也是一个活动链接，通常用于返回网站主页。你也可以在这里放一张图像，但这里没有专门的类来帮助你。我在某些设计中这样做过，但遗憾的是，这仍然需要一些手动工作。如果你让图像的高度与\
    \ `<h1>` 元素相近，事物就会保持良好的对齐。否则，我发现的让其生效的最佳方法是在持有品牌名称的元素前面添加一些内边距，然后使用合适的底部边距/内边距对你的标志进行绝对定位，以便它不会隐藏下方的任何内容。*\n\
    \n在品牌类之后，我们还为表单、按钮和文本提供了特定的类，如下：\n\n- `navbar-nav`: 用于创建导航链接和下拉菜单的主 `<ul>`\n-\
    \ `navbar-form`: 用于创建内联微型表单\n- `navbar-btn`: 用于标记按钮组件以适应导航栏（navbar-friendly）\n\
    - `navbar-text`: 用于在你的栏目中包含独立的文本行\n- `navbar-link`: 用于添加不属于常规导航项的独立链接\n\n你可以根据需要将它们放在一起使用，或者单独使用，或者将它们与新颖的\
    \ Web 组件规范相结合，创建一个接收配置并按需要绘制所需内容的单栏。\n\n下面的代码示例扩展了 45 以包含一些导航链接：\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_72_0.png)\n\
    \n```html\n<a class=\"navbar-brand\" href=\"#\">BS3</a>\n```\n\n*代码示例 46: 扩展包含链接的示例*\n\
    \n与所有其他导航链接和元素一样，你会看到我们采用了 `active` 类来将第一个链接标记为活动状态，与其他项目一样，你可以应用 `disabled` 类似的类来根据需要标记项目。创建一个从按钮展开的菜单同样简单。你所做的是使用与创建下拉菜单时相同的标记，只需将其封装在\
    \ `navbar-nav` 元素中，如：\n\n*代码示例47: 带有下拉按钮的导航栏*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_73_0.png)\n\
    \n```html\n<nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"\
    container-fluid\">\n    <div class=\"navbar-header\">\n      <button type=\"button\"\
    \ class=\"navbar-toggle\" data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\"\
    >\n        <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
    >BS3</a>\n    </div\n    <div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n      <ul class=\"nav navbar-nav\">\n        <li class=\"active\"><a href=\"\
    #\">Menu 1</a></li>\n        <li><a href=\"#\">Menu 2</a></li>\n      </ul>\n\
    \    </</div>\n    <!-- /.navbar-collapse -->\n  </div>\n  <!-- /.container-fluid\
    \ -->\n</nav>\n```\n\n*图 48: 由代码示例 47 生成的下拉菜单*\n\n你可以组合这些中的每一项，只需根据需要标记每个 `<li>`\
    \ 元素，即可在一个 `navbar-nav` `<ul>` 中拥有下拉和非下拉链接。\n\n导航栏的另一个常见需求是强制登录表单，通常用于登录网站的受保护区域。\n\
    \nBS3 使用 `navbar-form` 类使这些表单更容易构造。到目前为止，我们看到所有元素在导航栏的内部区域都是左对齐的。由于登录表单通常是右对齐，BS3\
    \ 团队提供了 `navbar-right` 类来执行此类操作。以下代码说明了一个示例：\n\n*代码示例 48: 右对齐登录表单的 BS3 导航栏*\n\n\
    ![](img/3ef3f89d48533001235bf8b5b1e48737_74_0.png)\n\n```html\n<div class=\"collapse\
    \ navbar-collapse\" id=\"bs-example-navbar-collapse-1\">\n  <ul class=\"nav navbar-nav\"\
    >\n    <li class=\"dropdown\">\n      <a href=\"#\" class=\"dropdown-toggle\"\
    \ data-toggle=\"dropdown\">Menu 1 <b class=\"caret\"></b></a>\n      <ul class=\"\
    dropdown-menu\">\n        <li><a href=\"#\">Sub Menu 1</a></li>\n        <li><a\
    \ href=\"#\">Sub Menu 2</a></li>\n        <li><a href=\"#\">Sub Menu 3</a></li>\n\
    \        <li class=\"divider\"></li>\n        <li><a href=\"#\">Sub Menu 4</a></li>\n\
    \        <li class=\"divider\"></li>\n        <li><a href=\"#\">Sub Menu 5</a></li>\n\
    \      </ul>\n    </li>\n  </ul>\n</div>\n```\n"
