  - "[PAGE 101]\n\n \n\n \n\n \n\n102 \n\n**Collapsible Panels **\n\nOne of the things\
    \ removed in BS3, sadly, was the readymade accordion component. In its \n\nplace,\
    \ however, is something better: the collapsible panel. \n\nUsing these panels,\
    \ it's still just as easy to create a standard accordion, but they are now also\
    \ \n\nseparately useable, standalone components, allowing you to do things like\
    \ create folding \n\ninformation areas, toolbars, and much more. \n\nOne thing\
    \ to note, however: if you're doing a custom build, you must also make sure that\
    \ you \n\ninclude the transition helper JavaScript plug-in. The BS3 docs have\
    \ more information that you’ll \n\nneed if you are doing a custom build. \n\n\
    To create an accordion from collapsible panels, you simply have to create an outer\
    \ `**<div>**` with a \n\nclass of `**panel-group**` and give it an `**id**`. Then,\
    \ inside of that, you need a series of `**<div>**` tags \n\nmarked up as shown\
    \ previously in the section on panel components, with each panel `**div**` being\
    \ \n\na single self-contained panel. \n\nOnce you have your panels laid out, you\
    \ just need to add a `**panel-title**` inside a `**panel-**`\n\n`**header**`.\
    \ This header should contain an `**<a>**` tag with two data attributes assigned:\
    \ one called \n\n`**data-toggle**`, and one called `**data-parent**`. \n\nThe\
    \ toggle attribute should have a value of `**collapse**`, and the parent attribute\
    \ should hold the \n\n`**id**` of the outer `**<div>**` holding the panel group,\
    \ and an `**href**` with the `**id**` of the target panel body \n\nthat should\
    \ be the object of the collapsing behavior. Each of the target panels should have\
    \ the \n\nclasses `**panel-collapse**` and `**collapse**` assigned to them. \n\
    \nThe following code shows how to achieve this: \n\n*Code Sample 77: How to Create\
    \ an Accordion Replacement Using Collapsible Panels *\n\n`<div class=\"panel-group\"\
    \ id=\"newAccordion\"> `\n\n` <div class=\"panel panel-default\"> `\n\n` <div\
    \ class=\"panel-heading\"> `\n\n` <h4 class=\"panel-title\"> `\n\n` <a data-toggle=\"\
    collapse\" data-parent=\"#newAccordion\" href=\"#panelOne\"> `\n\n` Consciousness\
    \ is the richness of truth, and of us `\n\n` </a> `\n\n` </h4> `\n\n` </div> `\n\
    \n` <div id=\"panelOne\" class=\"panel-collapse collapse in\"> `\n\n` <div class=\"\
    panel-body\"> `\n\n` Aromatherapy may be the solution to what's ... `\n\n` </div>\
    \ `\n\n` </div> `\n\n` </div> `\n\n` <div class=\"panel panel-default\"> `\n\n\
    ` <div class=\"panel-heading\"> `\n\n` <h4 class=\"panel-title\"> `\n\n` <a data-toggle=\"\
    collapse\" data-parent=\"#newAccordion\" href=\"#panelTwo\"> `"
