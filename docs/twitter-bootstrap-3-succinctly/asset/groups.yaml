    \ `navbar` 结构中的折叠和展开行为及规则。\n- 将所有网格布局类改为仅使用 `col-xs-*` 类，而不使用其他四个级别。\n\n## 类变化\n\
    \n正如我之前提到的，两个版本之间有很多类名变化，许多类已被 \n废弃和撤回。\n\n一个让很多人（如果你在 Stack Overflow 上看的话）感到惊讶的事情是\n\
