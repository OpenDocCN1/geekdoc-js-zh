- md: "\n*Figure 49: Navigation bar with sign-in form, produced by code sample 48*\n\
    \nAlong the same lines, it's often also required that when a person is signed\
    \ in to your application, that they have their name shown instead of the form,\
    \ and optionally, a link and/or button to sign out, or change options. \n\nThe\
    \ button, text, and link classes have all of this covered, as shown in the following\
    \ code:\n\n*Code Sample 49: Swapping the Sign-In Form for an Information Display*\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_75_0.png)\n\n```html\n<span class=\"\
    icon-bar\"></span>\n</button>\n<a class=\"navbar-brand\" href=\"#\">BS3</a>\n\
    </div>\n<div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n  <form class=\"navbar-form navbar-right\">\n    <div class=\"form-group\"\
    >\n      <input type=\"text\" class=\"form-control\" placeholder=\"Sign-in name\"\
    >\n    </div>\n    <div class=\"form-group\">\n      <input type=\"password\"\
    \ class=\"form-control\" placeholder=\"Password\">\n    </div>\n    <button type=\"\
    submit\" class=\"btn btn-default\">Sign In</button>\n  </form>\n</div>\n</nav>\n\
    <nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"container-fluid\"\
    >\n    <div class=\"navbar-header\">\n      <button type=\"button\" class=\"navbar-toggle\"\
    \ data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\">\n  \
    \      <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
    >BS3</a>\n    </div>\n    <div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n      <div class=\"navbar-right\">\n        <p class=\"navbar-text\">Signed\
    \ in as <strong>Peter Shaw</strong></p>\n        <a href='#' class=\"navbar-link\"\
    >Options</a>&nbsp;&nbsp;\n        <button class=\"btn btn-primary navbar-btn\"\
    >Sign Out</button>\n```\n\n*Figure 50: Navigation bar with information display\
    \ produced by code sample 49*\n\nThe navigation bar itself also has a few clever\
    \ tricks, you can place your navigation bar inside a `container` or other alignment\
    \ class, then add `navbar-fixed-top` to it, your navigation bar will stick to\
    \ the top of its container, and align itself perfectly with it in the following\
    \ image:\n\n*Figure 51: Navigation bar from sample 49 with the `navbar-fixed-top`\
    \ class applied to it*\n\nYou can also add `navbar-fixed-bottom` class, which\
    \ will stick your navigation bar to the bottom of the page, and the `navbar-static-top`\
    \ class, which will stick the bar to the top of container but will allow it to\
    \ scroll with the page content.\n\nFinally, if you want a darkened navigation\
    \ bar, then you can use the `navbar-inverse` class which will invert the color\
    \ set used by the entire component:\n\n*Figure 52: Navbar from sample 49 with\
    \ `inverse` class set*\n\n## Label and Badge Changes\n\nThis is going to be a\
    \ very short section because there have only two changes to the labels, and one\
    \ big one to the badges. To make a label in BS2 we simply gave it a `label-xxxx`\
    \ name where `xxxx` represents the state the label was to portray. Under BS3,\
    \ we now have a two-part class definition, and rename `error` to `danger` for\
    \ the color class so that the naming now matches everything else, and that's pretty\
    \ much it.\n\nThere are also no sizing classes for these in BS3 as labels take\
    \ the size of surrounding container. So, if you create a `<span>` with an appropriate\
    \ label class and then wrap it in `<h1>`, the size of that label will be much\
    \ larger than the rest. The following code sample demonstrates this:\n\n*Code\
    \ Sample 50: BS3 Label with Different Sizes*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_76_0.png)(img/3ef3f89d48533001235bf8b5b1e48737_76_1.png)(img/3ef3f89d48533001235bf8b5b1e48737_76_2.png)\n\
    \n```html\n</div>\n</div>\n</div>\n</nav>\n<h1><span class=\"label-default\">Default</span></h1>\n\
    ```\n\n*Figure 53: Output produced by code sample 50*\n\nBadges, on the other\
    \ hand, have undergone a bigger change. In BS3, badges no longer have contextual\
    \ classes. That is, there is no longer a `label-success` or `label-warning` as\
    \ with previous labels and other elements. This means you can't color badges in\
    \ the same way you could in BS2, and any label you create can only be rendered\
    \ using the standard color. Well, at least officially you can't.\n\nIf you apply\
    \ an `alert-xxxxx` alongside a `label` class being used for label, then the label\
    \ will take the coloring of that alert class, and while this is not a supported\
    \ way of doing things, it does work and allows you to use the labels as you did\
    \ in BS2. To mark up a standard label, all you need to do is add a `label-default`\
    \ class to a `<span>`, and you’re ready to go:\n\n*Code Sample 51: Standard Label\
    \ Example*\n\n*Figure 54: Label produced by code sample 51*\n\nIf you want to\
    \ hack your labels to use different colors, then you can do so as follows:\n\n\
    *Code Sample 52: Label Example Hacked to Use Non-Standard Coloring*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_77_0.png)(img/3ef3f89d48533001235bf8b5b1e48737_77_1.png)\n\
    \n```html\n<h2><span class=\"label-primary\">Primary</span></h2>\n<h3><span class=\"\
    label-success\">Success</span></h3>\n<h4><span class=\"label-info\">Info</span></h4>\n\
    <h5><span class=\"label-warning\">Warning</span></h5>\n<h6><span class=\"label-danger\"\
    >Danger</span></h6>\n<span class=\"label-default\">This is a label</span>\n<span\
    \ class=\"badge\">Normal</span>\n<span class=\"badge alert-success\">Success</span>\n\
    ```\n\n*Figure 55: Output produced by code sample 52*\n\nOne nice feature the\
    \ badge component does still have, however, is its use of the `:empty` pseudo-selector,\
    \ allowing it to automatically vanish from display if its inner text is empty.\
    \ This helps with the internal changes designed to work on List groups and Pill\
    \ lists, because it now means that it's immensely easy to create things like inbox\
    \ notification lists, where the values disappear when the `<span>` contents are\
    \ removed. Here’s an example:\n\n*Code Sample 53: BS3 List Styling for Badges*\n\
    \n*Figure 56: Output produced by code sample 53*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_78_0.png)(img/3ef3f89d48533001235bf8b5b1e48737_78_1.png)\n\
    \n```html\n<span class=\"badge alert-info\">Info</span>\n<span class=\"badge alert-warning\"\
    >Warning</span>\n<span class=\"badge alert-danger\">Danger</span>\n<div class=\"\
    col-md-4\">\n  <ul class=\"nav nav-pills nav-stacked\">\n    <li class=\"active\"\
    >\n      <a href=\"#\"><span class=\"badge pull-right\">42</span>Inbox</a>\n \
    \   </li>\n    <li class=\"active\">\n      <a href=\"#\"><span class=\"badge\
    \ pull-right\">10000</span>Spam</a>\n    </li>\n    <li class=\"active\">\n  \
    \    <a href=\"#\"><span class=\"badge pull-right\"></span>Lottery</a>\n    </li>\n\
    \  </ul>\n</div>\n```\n\nIf you examine the code, you'll see that the last option\
    \ in the list has no value inside its span tag, because of the `:empty` pseudo-selector,\
    \ the browser does not render it. However, the second you put anything there using\
    \ JavaScript, that badge will pop right into existence. Notice also the use of\
    \ the `pull-right` alignment class to make sure the label sits on the right side\
    \ of element.\n\n## List Group Changes\n\nList groups are a new thing added in\
    \ BS3, designed to replace the BS2 navigation lists, and have far more capabilities\
    \ than their BS2 counterpart. Once you start to use them, you'll realize that\
    \ list groups are more like fully styleable list-item boxes, and to be honest,\
    \ all it would take to create a fully styleable list box in fact be to wrap them\
    \ in their own `<div>` and set the overflow to scroll. A basic list group component\
    \ can be created with markup similar to the following:\n\n*Code Sample 54: Basic\
    \ BS3 List Group*\n\n*Figure 57: Output produced by code sample 54*\n\nAs you\
    \ saw previously in the badges section, you can add badges to lists and other\
    \ objects, and if you add them to a list group, they line up perfectly:\n\n*Code\
    \ Sample 55: List Group with Badges Attached*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_79_0.png)\n"
  mdcn: "\n\n*图 49：带有登录表单的导航栏，由代码示例 48 生成*\n\n同样地，通常还要求当用户登录您的应用程序时，显示他们的姓名而不是表单，并可选地提供一个注销或更改选项的链接和/或按钮。\n\
    \n按钮、文本和链接类都涵盖了这些功能，如下面的代码所示：\n\n*代码示例 49：将登录表单替换为信息显示*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_75_0.png)\n\
    \n```html\n<span class=\"icon-bar\"></span>\n</button>\n<a class=\"navbar-brand\"\
    \ href=\"#\">BS3</a>\n</div>\n<div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n  <form class=\"navbar-form navbar-right\">\n    <div class=\"form-group\"\
    >\n      <input type=\"text\" class=\"form-control\" placeholder=\"Sign-in name\"\
    >\n    </div>\n    <div class=\"form-group\">\n      <input type=\"password\"\
    \ class=\"form-control\" placeholder=\"Password\">\n    </div>\n    <button type=\"\
    submit\" class=\"btn btn-default\">Sign In</button>\n  </form>\n</div>\n</nav>\n\
    <nav class=\"navbar navbar-default\" role=\"navigation\">\n  <div class=\"container-fluid\"\
    >\n    <div class=\"navbar-header\">\n      <button type=\"button\" class=\"navbar-toggle\"\
    \ data-toggle=\"collapse\" data-target=\"#bs-example-navbar-collapse-1\">\n  \
    \      <span class=\"sr-only\">Toggle navigation</span>\n        <span class=\"\
    icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
    icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
    >BS3</a>\n    </div>\n    <div class=\"collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"\
    >\n      <div class=\"navbar-right\">\n        <p class=\"navbar-text\">Signed\
    \ in as <strong>Peter Shaw</strong></p>\n        <a href='#' class=\"navbar-link\"\
    >Options</a>&nbsp;&nbsp;\n        <button class=\"btn btn-primary navbar-btn\"\
    >Sign Out</button>\n```\n\n*图 50：由代码示例 49 生成带有信息显示的导航栏*\n\n导航栏本身还有一些巧妙的技巧，你可以将导航栏放置在\
    \ `container` 或其他对齐类中，然后给它添加 `navbar-fixed-top`，这样你的导航栏将固定在其容器的顶部，并如图所示与它完美对齐：\n\
    \n*图 51：来自示例 49 并应用了 `navbar-fixed-top` 类的导航栏*\n\n你也可以添加 `navbar-fixed-bottom`\
    \ 类，它会将你的导航栏固定在页面底部；以及 `navbar-static-top` 类，它会将导航栏固定在容器的顶部，但允许它随页面内容一起滚动。\n\n\
    最后，如果你想要一个深色的导航栏，可以使用 `navbar-inverse` 类，它将反转整个组件所使用的颜色设置：\n\n*图 52：设置了 `inverse`\
    \ 类的来自示例 49 的导航栏*\n\n## 标签和徽章的变化\n\n这部分将非常短小，因为标签只有两处变化，而徽章（badge）有一处重大变化。在 BS2\
    \ 中，我们只需为标签提供一个 `label-xxxx` 名称，其中 `xxxx` 代表标签要描绘的状态。在 BS3 下，我们现在有了双部分类定义，并将颜色类中的\
    \ `error` 重命名为 `danger`，以便命名方式现在与所有其他内容保持一致，基本上就这些了。\n\n在 BS3 中，这些标签也没有了尺寸类，因为标签的大小取决于其周围容器的大小。因此，如果你创建一个带有适当标签类的\
    \ `<span>`，然后将其封装在 `<h1>` 中，该标签的尺寸将比其他部分大得多。接下来的代码示例演示了这一点：\n\n*代码示例 50：不同尺寸的\
    \ BS3 标签*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_76_0.png)(img/3ef3f89d48533001235bf8b5b1e48737_76_1.png)(img/3ef3f89d48533001235bf8b5b1e48737_76_2.png)\n\
    \n```html\n</div>\n</div>\n</div>\n</nav>\n<h1><span class=\"label-default\">Default</span>span></h1>\n\
    ```\n\n*图 53：由代码示例 50 生成的输出*\n\n另一方面，徽章经历了更大的变化。在 BS3 中，徽章不再具有上下文类（contextual\
    \ classes）。也就是说，像之前的标签和其他元素那样，不再有 `label-success` 或 `label-warning` 了。这意味着你不能像在\
    \ BS2 中那样为徽章着色，而且你创建的任何标签只能使用标准颜色渲染。嗯，至少从官方上来说你做不到。\n\n如果你在标签旁边应用 `alert-xxxxx`\
    \ 配合 `label` 类，那么标签将采用 alert 的颜色，虽然这并不是支持的方法，但它确实像你在 BS2 中那样使用标签。为了标记标准标签，你只需要：\n\
    \n*代码示例 51：标准标签示例*\n\n*图 54：示例 51 生成的标签*\n\n如果你想让标签使用不同的颜色，可以这样做：\n\n*代码示例 52：使用\
    \ hack 技巧的标签*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_77_0.png)\n\n```html\n\
    <span class=\"label-primary\">Primary</span></h2>\n<span class=\"label-success\"\
    >Success</span><h3>\n<span class=\"label-info\">Info</span><h4>\n<span class=\"\
    label-warning\">Warning</span></h5>\n<span class=\"label-danger\">Danger</span></h6>\n\
    <span class=\"label-default\">This is a label</span>\n<span class=\"badge\">Normal</span>\n\
    <span class=\"badge alert-success\">\n```\n\n*图 55：示例示例的输出*\n\n然而，徽章组件仍然有一个非常实用的功能，就是使用\
    \ `:empty` 伪类，这使得它在内容为空时自动消失。这有助于创建像收箱列表这样的功能，因为当 `<span>` 内容被移除时，它们会消失。这是一个示例：\n\
    \n*代码示例 53：徽章的列表样式*\n\n*图 56：由代码示例 53 生成的输出*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_78_0.png)(img/3ef3f89d48533001235bf8b5b1e48737_78_1.png)\n\
    \n```html\n<span class=\"badge alert-info\">Info</span>\n<span class=\"badge alert-warning\"\
    >Warning</span>\n<span class=\"badge alert-danger\">Danger</span>\n<div class=\"\
    col-md-4\">\n  <ul class=\"nav nav-pills nav-stacked\">\n    <li class=\"active\"\
    >\n      <a href=\"#\"><span class=\"badge pull-right\">42</span>Inbox</a>\n \
    \   </li>\n    <li class=\"active\">\n      <a href=\"#\"><span class=\"badge\
    \ pull-right\">10000</span>Spam</a>\n    </li>\n    <li class=\"active\">\n  \
    \    <a href=\"#\"><span class=\"badge pull-right\"></span>Lottery</a>\n    </li>\n\
    \  </ul>\n</div>\n```\n\n## 列表组（List Group）的变化\n\n列表组是 BS3 中添加的新内容，旨在取代 BS2 的导航列表，并且比其\
    \ BS2 版本具有更多的功能。一旦你开始使用它们，你会发现列表组更像是完全样式化的列表项框，坦率地说，创建一个完全样式化的列表框实际上只需要将它们封装在自己的\
    \ `<div>` 中并设置溢出为滚动即可。基础列表组组件可以使用类似下面的标记创建：\n\n*代码示例 54：基础 BS3 列表组*\n\n*图 57：由代码示例\
    \ 54 生成的输出*\n\n"
