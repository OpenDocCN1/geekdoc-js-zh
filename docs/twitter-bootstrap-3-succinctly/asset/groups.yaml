    \ then \n\nwe start to get something a bit more interesting: \n\n*Code Sample\
    \ 64: Basic Panel Object with a Panel Header *\n\n \n\n \n\n`<div class=\"panel\
    \ panel-default\"> `\n\n` <div class=\"panel-body\"> `\n\n` Panel content goes\
    \ here `\n\n` </div> `\n\n`</div> `\n\n` `\n\n`<div class=\"panel panel-default\"\
    > `\n\n` <div class=\"panel-heading\">Panel Header</div> `\n\n` <div class=\"\
    panel-body\"> `\n\n` Panel content goes here `\n\n` </div> `\n\n`</div> `\n\n\
    ` `"
