    \ Aligned *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_74_0.png)\n\n` <div class=\"\
    collapse navbar-collapse\" id=\"bs-example-navbar-collapse-1\"> `\n\n` <ul class=\"\
