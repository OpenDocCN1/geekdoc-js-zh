- md: "\n*Figure 63: Output produced by code sample 60*\n\nCreating vertical lists\
    \ is just as easy, but instead of using the `thumbnail` classes, we now need to\
    \ use the `media` object classes. These classes and the associated markup create\
    \ a layout similar to the previous example, but instead of appearing underneath\
    \ the thumbnail, the text is lined up to the right.\n\nThe primary design motive\
    \ here is in comment and message lists with an avatar image, but they can be used\
    \ for news items, product lists, and many other things.\n\nTo mark up a media\
    \ object, simply use an outer `div` with a class of `media`. Then, inside of that,\
    \ use the `media-object`, `media-body`, and `media-heading` classes to mark up\
    \ the individual bits, as the following example shows:\n\n*Code Sample 61: Mark\
    \ Up for a Single BS3 Media Object*\n\n*Figure 64: Media object produced by code\
    \ sample 61*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_86_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_86_1.png)\n\
    \n```html\n<div class=\"media\">\n  <a class=\"pull-left\" href=\"#\">\n    <img\
    \ class=\"media-object\" data-src=\"holder.js/64x64\" />\n  </a>\n  <div class=\"\
    media-body\">\n    <h4 class=\"media-heading\">To follow the journey is to become\
    \ one with it</h4>\n    <p>The goal of ultrasonic energy is to plant the seeds\
    \ of awareness rather than stagnation. You and I are beings of the quantum matrix.\
    \ Purpose is a constant.</p>\n  </div>\n</div>\n```\n\nBy changing your markup\
    \ just a little, you can generate full lists of media objects, as follows:\n\n\
    *Code Sample 62: Full Media Object List*\n\n*Figure 65: Full media object list\
    \ generated by code sample 62*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_87_0.png)\n\
    \n```html\n<ul class=\"media-list\">\n  <li class=\"media\">\n    <a class=\"\
    pull-left\" href=\"#\">\n      <img class=\"media-object\" src=\"holder.js/64x64\"\
    \ />\n    </a>\n    <div class=\"media-body\">\n      <h4 class=\"media-heading\"\
    >Humankind has nothing to lose</h4>\n      <p>Awareness is the growth of synchronicity,\
    \ and of us. This life is nothing short of an unfolding explosion of infinite\
    \ truth. We exist as sonar energy.</p>\n    </div>\n  </li>\n  <li class=\"media\"\
    >\n    <a class=\"pull-left\" href=\"#\">\n      <img class=\"media-object\" src=\"\
    holder.js/64x64\" >\n    </a>\n    <div class=\"media-body\">\n      <h4 class=\"\
    media-heading\">It is a sign of things to come</h4>\n      <p>Humankind has nothing\
    \ to lose. We are at a crossroads of rebirth and discontinuity. We are in the\
    \ midst of a consciousness-expanding maturing of guidance that will clear a path\
    \ toward the quantum soup itself.</p>\n    </div>\n  </li>\n  <li class=\"media\"\
    >\n    <a class=\"pull-left\" href=\"#\">\n      <img class=\"media-object\" src=\"\
    holder.js/64x64\" >\n    </a>\n    <div class=\"media-body\">\n      <h4 class=\"\
    media-heading\">Only a traveller of the galaxy may generate this canopy of life</h4>\n\
    \      <p>We must learn how to lead unified lives in the face of delusion. Eons\
    \ from now, we warriors will reflect like never before as we are reborn by the\
    \ quantum soup. We must beckon ourselves and fulfill others.</p>\n    </div>\n\
    \  </li>\n</ul>\n```\n\nIf you nest the `<li>`s and `<ul>`s inside the media list,\
    \ BS3 will automatically indent them to give the effect of a parent/child hierarchy.\
    \ You can also use different combinations of `pull-right` and `pull-left` where\
    \ needed to position the image on the opposite side, for example. Or, to line\
    \ things up slightly differently, you can combine them with panels (which we'll\
    \ see shortly) and other structures to put borders and other hints around the\
    \ entire list and wrap them to produce composite components.\n\n## Panels\n\n\
    Like list groups, panels are a new addition to BS3—and what an addition they are!\
    \ We’re all familiar with things like forms, for example, being in boxes, or sections\
    \ of a website logically divided up from each other. BS3 panels allow you to easily\
    \ control this separation. You can have plain panels, panels with headers, panels\
    \ with titles in headers, panels with footers, and panels with their own set of\
    \ colors. A basic panel is constructed using just two `<div>` elements and three\
    \ classes:\n\n*Code Sample 63: Basic Panel Object*\n\nHowever, it's not much good\
    \ without a title, and really as it stands in sample 63, it's nothing than a `div`\
    \ with padding and a border around it. If we add a third `div` element, however,\
    \ and give that `div` a class of `panel-heading`, then we start to get something\
    \ a bit interesting:\n\n*Code Sample 64: Basic Panel Object with a Header*\n\n\
    ```html\n<div class=\"panel panel-default\">\n  <div class=\"panel-body\">Panel\
    \ content goes here</div>\n</div>\n<div class=\"panel panel-default\">\n  <div\
    \ class=\"panel-heading\">Panel Header</div>\n  <div class=\"panel-body\">Panel\
    \ content goes here</div>\n</div>\n```\n\n*Figure 66: Panel produced by code sample\
    \ 64*\n\nYour panel header doesn't have to be just a simple `<div>`, either; you\
    \ can include `<h1>` tags along with any regular tag, such as an `<img>`, and\
    \ things will resize as required:\n\n*Code Sample 65: Panel with an H1 Tag as\
    \ a Title*\n\n*Figure 67: Output produced by code sample 65*\n\nYou can also apply\
    \ a panel footer by adding a `<div>` element after your panel body and applying\
    \ the class `panel-footer`. If you want to give your panels meaning, you can also\
    \ the contextual colors that are used for everything else. You do this simply\
    \ by replacing the `panel-default` class in the previous code samples with `panel-primary`,\
    \ `panel-success`, `panel-info`, `panel-warning`, or `panel-danger`.\n\n*Figure\
    \ 68: Output produced by code sample 65, with the type set to panel-primary*\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_89_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_89_1.png)![](img/3ef3f89d48533001235bf8b5b1e48737_89_2.png)\n\
    \n```html\n<div class=\"panel panel-default\">\n  <div class=\"panel-heading\"\
    >\n    <h1 class=\"panel-title\">Panel Header</h1>\n    <p>Panel sub header</p>\n\
    \  </div>\n  <div class=\"panel-body\">\n    <p>Panel content goes here</p>\n\
    \    <p>Panel content goes here</p>\n    <p>Panel content goes here</p>\n  </div>\n\
    </div>\n```\n\nOne thing to be careful of, though—if you're using `panel-footer`\
    \ and contextual colors, the footer will NOT adopt the panel’s color scheme. This\
    \ is deliberate, as the BS3 developers felt that contextually, only the contents\
    \ of the panel were important. Any buttons, controls, or footer information to\
    \ respond to that information did not need to be highlighted in the same way,\
    \ thus allowing the developer freedom to add different contextual colors for different\
    \ controls as required.\n\nPanels can also work fluidly with list groups and tables.\
    \ If you join a table with a panel inside of the parent `div`, you get a panel\
    \ as shown previously, and a seamless join to the table below it, as the following\
    \ shows:\n\n*Code Sample 66: Panel from Sample 65 Colored as Primary and with\
    \ a Table Applied*\n\n```html\n<div class=\"panel panel-primary\">\n  <div class=\"\
    panel-heading\">\n    <h1 class=\"panel-title\">Panel Header</h1>\n    <p>Panel\
    \ sub header</p>\n  </div>\n  <div class=\"panel-body\">\n    <p>Panel content\
    \ goes here</p>\n    <p>Panel content goes here</p>\n    <p>Panel content goes\
    \ here</p>\n    <table class=\"table\">\n      <thead>\n        <tr>\n       \
    \   <th>#ID</th>\n          <th>Name</th>\n          <th>Twitter Handle</th>\n\
    \        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>1</td>\n\
    \          <td>Peter Shaw</td>\n          <td>@shawty_ds</td>\n        </tr>\n\
    \        <tr>\n          <td>2</td>\n          <td>Digital Solutions UK</td>\n\
    \          <td>@digitalsolut_uk</td>\n        </tr>\n      </tbody>\n    </table>\n\
    \  </div>\n</div>\n```\n"
  mdcn: "\n\n*图 63：代码示例 60 生成的输出*\n\n创建垂直列表同样简单，但我们现在不再使用 `thumbnail` 类，而是需要使用 `media`\
    \ 对象类。这些类以及相关的标记创建了与上一个示例相似的布局，但文本不再出现在缩略图下方，而是对齐在右侧。\n\n这里的主要的设计意图是带有头像图像的评论和消息列表，但它们也可以用于新闻项目、产品列表以及许多其他地方。\n\
    \n要标记一个媒体对象（media object），只需使用一个类为 `media` 的外部 `div` 即可。然后，在其内部使用 `media-object`、`media-body`\
    \ 和 `media-heading` 类来标记各个部分，如下例所示：\n\n*代码示例 61：单个 BS3 媒体对象的标记*\n\n*图 64：代码示例\
    \ 61 生成的媒体对象*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_86_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_86_1.png)\n\
    \n```html\n<div class=\"media\">\n  <a class=\"pull-left\" href=\"#\">\n    <img\
    \ class=\"media-object\" data-src=\"holder.js/64x64\" />\n  </a>\n  <div class=\"\
    media-body\">\n    <h4 class=\"media-heading\">追随旅程就是与它合一</h4>\n    <p>超声能量的目标是播下意识的种子，而不是停滞。你和我都是量子矩阵中的生物。目标是永恒。</p>\n\
    \  </div>\n</div>\n```\n\n通过稍作修改你的标记，你可以生成完整的媒体对象列表，如下：\n\n*代码示例 62：完整的媒体对象列表*\n\
    \n*图 65：代码示例 62 生成的完整媒体对象列表*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_87_0.png)\n\
    \n```html\n<ul class=\"media-list\">\n  <li class=\"media\">\n    <a class=\"\
    pull-left\" href=\"#\">\n      <img class=\"media-object\" src=\"holder.js/64x64\"\
    \ />\n    </a>\n    <div class=\"media-body\">\n      <h4 class=\"media-heading\"\
    >人类无所失去</h4>\n      <p>意识是同步性的增长，也是我们的成长。这种生命无非是无限真理的展开式爆发。我们以声纳能量的形式存在。</p>\n\
    \    </div>\n  </li>\n  <li class=\"media\">\n    <a class=\"pull-left\" href=\"\
    #\">\n      <img class=\"media-object\" src=\"holder.js/64x64\" >\n    </a>\n\
    \    <div class=\"media-body\">\n      <h4 class=\"media-heading\">这是未来的征兆</h4>\n\
    \      <p>人类无所失去。我们处于重生与不连续的十字路口。我们正处于一种意识扩张的指导成熟之中，这为开辟一条通往量子汤本身的道路。</p>\n  \
    \  </div>\n  </li>\n  <li class=\"media\">\n    <a class=\"pull-left\" href=\"\
    #\">\n      <img class=\"media-object\" src=\"holder.js/64x64\" >\n    </a>\n\
    \    <div class=\"media-body\">\n      <h4 class=\"media-heading\">只有星系的旅行者才能产生这片生命的华篷</h4>\n\
    \      <p>我们必须学习在幻象面前如何过统一的生活。万年后，我们这些战士将像以前所未有的那样进行反思，因为我们通过量子汤重生了。我们必须召唤自己并成就他人。</p>\n\
    \    </div>\n  </li>\n</ul>\n```\n\n如果你将 `<li>` 和 `<ul>` 嵌套在媒体列表中，BS3 将自动缩进它们，以产生父/子层级结构的效果。你也可以在需要的地方使用\
    \ `pull-right` 和 `pull-left` 的不同组合，将图像放置在相反侧。或者，为了以略有不同的方式对齐，你可以将它们与面板（我们很快就会看到）和其他结构结合，在整个列表周围添加边框和其他提示，并将其封装以产生复合组件。\n\
    \n## 面板 (Panels)\n\n与列表组一样，面板是 BS3 的一个新增——而且这是一个非常大的补充！我们对很多内容都很熟悉，例如在框中的表单，或者网站中逻辑上相互划分的部分。BS3\
    \ 面板允许你轻松控制这种分离。你可以拥有普通面板、带有页头的面板、页头带有标题的面板、带有页脚的面板以及带有自己颜色集的面板。基础面板仅使用两个 `<div>`\
    \ 元素和三个类构建：\n\n*代码示例 63：基础面板对象*\n\n然而，如果没有标题，它就没什么用处，而且正如示例 63 所示，它只是一个带有内边距和边框的\
    \ `div`。但是如果我们添加第三个 `div` 元素，并给该 `div` 分配 `panel-heading` 类，我们就开始得到一些有趣的东西了：\n\
    \n*代码示例 64：带有页头的的基础面板*\n\n```html\n<div class=\"panel-default\">\n  <div class=\"\
    panel-body\">面板内容</div>\n  </div>\n<div class=\"panel-default\">\n  <div class=\"\
    panel-heading\">页头</div>\n  <div class=\"panel-body\">面板内容</div>\n  </div>\n```\n\
    \n*图 66：代码示例 64 生成的输出*\n\n你的页头也不必只是简单的 `<div>`；你也可以包含 `<h1>` 标签以及任何标签，如 `<img>`，并且效果如下：\n\
    \n*代码示例 65：带有 H1 标签的面板*\n\n你也可以通过在面板主体后添加一个 `<div>` 元素并应用 `panel-footer` 类来应用页脚。如果你想给面板意义，你可以通过将之前的代码中的\
    \ `panel-default` 替换为 `panel-primary`、`panel-success`、`panel-info`、`panel-warning`\
    \ 或 `panel-danger` 来使用上下文颜色。\n\n*图 67：代码示例 65 生成的输出*\n\n*图 68：设置类型为 panel-primary\
    \ 的输出*\n\n![](![](img/3ef3f89d48533001235bf8b5b1e48737_89_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_89_1.png)[](img/3ef3f89d48533001235bf8b5b1e48737_89_2.png)\n\
    \n但需要一点注意的是——如果你使用 `panel-footer` 和上下文颜色，页脚不会采用面板的配色方案。这是故意的，因为 BS3 开发者认为从上下文来看，只有面板的内容是重要的。响应这些信息的按钮、控件或页脚信息不需要相同的方式突出，从而允许开发者根据需要添加不同的上下文颜色。\n\
    \n面板也可以与列表组和表格流畅协作。如果你将表格连接在父 `div` 中，你将获得如之前所示的面板，以及与下方表格的无缝衔接，如下：\n\n*代码示例 66：颜色为\
    \ primary 并应用了表格的面板*\n\n```html\n<div class=\"panel panel-primary\">\n  <div class=\"\
    panel-heading\">\n    <h1 class=\"panel-title\">页头</h1>\n    <p>面板副标题</p>\n  </div>\n\
    \  <div class=\"panel-body\">\n    <p>面板内容</p>\n    <p>面板内容</p>\n    <p>面板内容</p>\n\
    \    <table class=\"table\">\n      <thead>\n        <tr>\n          <th>#ID</th>\n\
    \          <th>名称</th>\n          <th>Twitter 账号</th>\n        </tr>\n      </thead>\n\
    \      <tbody>\n        <tr>\n          <td>1</td>\n          <td>Peter Shaw</td>\n\
    \          <td>@shawty_ds</td>\n        </tr>\n        <tr>\n          <td>2</td>\n\
    \          <td>Digital Solutions UK</td>\n          <td>@digitalsolut_uk</td>\n\
    \        </tr>\n      </tbody>\n    </table>\n  </div>\n</div>\n```\n\n"
