    \ Components Features\n\n## Glyphicon Changes\n\nThe biggest news with the components\
    \ provided by BS3 is the Glyphicons icon set. When V3.0 beta was first released,\
    \ the Glyphicons font that forms the core of the icon set in BS3 was removed.\
    \ The community was up in arms about this, especially when the icon set was split\
    \ into its own repository.\n\nThe split was short-lived, however, and from the\
    \ production release onwards, the Glyphicons font was reinstated into the main\
    \ branch, but with one new bonus.\n\nNo longer is the icon set made up of a set\
    \ of bitmapped `png`s in white and black—it's now a full-scale, vector-based font\
    \ set, with `ttf`, `svg`, `woff` and other formats. Because it's a vector now,\
    \ it can easily be colored using standard CSS-based color techniques, and can\
    \ now be scaled to any size required.\n\nIn the current build of BS3, there are\
    \ 200 or more icons to choose from, covering lots of different use cases. To use\
    \ an icon, you simply add the class `glyphicon` and a `glyphicon-xxxxx` to select\
    \ the actual icon you want to use. Then, you add this to a span class that's nested\
    \ inside of the element you wish to display the icon in.\n\nOne rule you must\
    \ obey with glyphicons is that you cannot mix the icon content with any other\
    \ element. You must make sure that the icon class is applied only to its own element,\
    \ and with enough padding around it to ensure sufficient space between it and\
    \ any other content next to it.\n\nThe following code gives you a simple overview\
    \ on how to use the glyphicon classes:\n\n*Code Sample 32: BS3 Glyphicons Sample*\n\
    \n`<h1>This is header text <small>with some small text and an icon <span class=\"\
