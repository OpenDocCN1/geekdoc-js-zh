    \ bar from sample 49 with the *`***navbar-fixed-top***`* class applied to it *\n\
    \nYou can also add `**navbar-fixed-bottom**` class, which will stick your navigation\
    \ bar to the \n\nbottom of the page, and the `**navbar-static-top**` class, which\
    \ will stick the bar to the top of the \n\ncontainer, but will allow it to scroll\
    \ with the page content. \n\nFinally, if you want a darkened navigation bar, then\
    \ you can use the `**navbar-inverse**` class, \n\nwhich will invert the color\
    \ set used by the entire component: \n\n \n\n*Figure 52: Navbar from sample 49\
