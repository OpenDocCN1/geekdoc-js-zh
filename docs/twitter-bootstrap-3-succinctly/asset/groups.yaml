    \ btn-success\">Left</button>\n  </div>\n```\n\n*图 29：示例 36 生成的输出*\n\n标记的黄金法是，每个单独的按钮必须封装在一个应用了\
    \ `btn-group` 类的 `div` 中。然后，这些单组中的每一个组都需要封装在一个外部 `div` 中，该外部 `div` 同时应用了 `btn-group`\
    \ 和 `btn-group-justified` 类。\n\n如果你在使用等齐组，有一点需要注意：由于按钮被渲染为块级元素（block elements），组尺寸类将无法按预期工作。这其实并不令人意外，因为它们无法作用于添加了\
