- md: "\n*Figure 27: Output generated by code sample 34*\n\nNotice in the last code\
    \ sample that I altered the button color of the drop-down button; all you need\
    \ to do in order to achieve this is add individual button colors on the classes\
    \ for individual buttons. This works across all button groups and toolbars—not\
    \ just when nesting them—meaning that you can vary the colors of the buttons in\
    \ your group depending on your usage. \n\nTwo new classes used for button layouts\
    \ are the `btn-group-vertical` and the `btn-group-justified` classes. \n\nIn BS2,\
    \ it was very difficult to stack your buttons vertically, or to make them take\
    \ up the full width of the available space while maintaining a balanced size.\
    \ These two new classes in BS3 solve both of these tricky situations. Be aware,\
    \ though, that to make the justified groups work correctly, you need to mark your\
    \ button groups with a little more markup than you might expect.\n\nThe next code\
    \ sample shows how to use vertical groups:\n\n*Code Sample 35: Vertical Button\
    \ Groups*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_57_0.png)\n\n```html\n<li><a\
    \ href=\"#\">Menu Link 1</a></li>\n<li><a href=\"#\">Menu Link 2</a></li>\n</ul>\n\
    </div>\n\n<div class=\"btn-group-vertical btn-group-lg\">\n  <button type=\"button\"\
    \ class=\"btn btn-default\">Top</button>\n  <button type=\"button\" class=\"btn\
    \ btn-default\">Middle</button>\n  <button type=\"button\" class=\"btn btn-default\"\
    >Bottom</button>\n</div>\n<div class=\"btn-group-vertical\">\n  <button type=\"\
    button\" class=\"btn btn-primary\">Top</button>\n  <button type=\"button\" class=\"\
    btn btn-primary\">Middle</button>\n  <button type=\"button\" class=\"btn btn-primary\"\
    >Bottom</button>\n</div>\n<div class=\"btn-group-vertical btn-group-sm\">\n  <button\
    \ type=\"button\" class=\"btn btn-success\">Top</button>\n  <button type=\"button\"\
    \ class=\"btn btn-success\">Middle</button>\n  <button type=\"button\" class=\"\
    btn btn-success\">Bottom</button>\n</div>\n<div class=\"btn-group-vertical btn-group-xs\"\
    >\n```\n\n*Figure 28: Output produced by code sample 35*\n\nAs I just pointed\
    \ out, marking up the justification classes is a little more involved, but is\
    \ necessary to smooth out some of the few browser inconsistencies that, unfortunately,\
    \ still exist. If you use the pattern shown in the following code to mark up your\
    \ justified groups, then you should find that none of these inconsistencies present\
    \ a problem for you:\n\n*Code Sample 36: BS3 Justified Button Sample*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_58_0.png)\n\
    \n```html\n<button type=\"button\" class=\"btn btn-warning\">Top</button>\n<button\
    \ type=\"button\" class=\"btn btn-warning\">Middle</button>\n<button type=\"button\"\
    \ class=\"btn btn-warning\">Bottom</button>\n</div>\n\n<div class=\"btn-group\
    \ btn-group-justified\" style=\"padding-top: 4px;\">\n  <div class=\"btn-group\"\
    >\n    <button type=\"button\" class=\"btn btn-default\">Left</button>\n  </div>\n\
    \  <div class=\"btn-group\">\n    <button type=\"button\" class=\"btn btn-default\"\
    >Middle</button>\n  </div>\n  <div class=\"btn-group\">\n    <button type=\"button\"\
    \ class=\"btn btn-default\">Right</button>\n  </div>\n</div>\n<div class=\"btn-group\
    \ btn-group-justified\" style=\"padding-top: 4px;\">\n  <div class=\"btn-group\"\
    >\n    <button type=\"button\" class=\"btn btn-primary\">Left</button>\n  </div>\n\
    \  <div class=\"btn-group\">\n    <button type=\"button\" class=\"btn btn-primary\"\
    >Middle 1</button>\n  </div>\n  <div class=\"btn-group\">\n    <button type=\"\
    button\" class=\"btn btn-primary\">Middle 2</button>\n  </div>\n  <div class=\"\
    btn-group\">\n    <button type=\"button\" class=\"btn btn-primary\">Right</button>\n\
    \  </div>\n</div>\n<div class=\"btn-group btn-group-justified\" style=\"padding-top:\
    \ 4px;\">\n  <div class=\"btn-group\">\n    <button type=\"button\" class=\"btn\
    \ btn-success\">Left</button>\n  </div>\n```\n\n*Figure 29: Output produced by\
    \ sample 36*\n\nThe golden rule with the markup is that each individual button\
    \ has to be wrapped in its own `div` with a `btn-group` class applied to it. Each\
    \ of these single groups then need to be wrapped in an outer `div`, which has\
    \ both `btn-group` and `btn-group-justified` applied to it.\n\nThere’s one thing\
    \ to note if you’re using justified groups: because the buttons are rendered as\
    \ block elements, the group sizing classes won't work as expected. This shouldn't\
    \ really come as a surprise because they won't work on single buttons that have\
    \ the `btn-block` class added, just as inline elements can't be fluidly controlled\
    \ in general.\n\nIf your buttons are made up of `<a>` tags, then you don't need\
    \ all this extra markup—you just need the outer `div` with the `btn-group-justified`\
    \ class added to it, and regular buttons inside it.\n\nA drop-down button with\
    \ a menu is still created in the exact manner as it is in BS2. First, you create\
    \ an outer `div` with a `btn-group` class applied to it. Immediately inside this,\
    \ you create a regular set of button styling applied to it, with a class of `dropdown-toggle`\
    \ and a `data` attribute called `toggle` with the value of `dropdown` applied\
    \ to it. Immediately after the button, but before you close the group `div`, you\
    \ then define the actual menu using a standard, unordered list with a class of\
    \ `dropdown-menu` and role applied to it.\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_59_0.png)\n\
    \n```html\n</div>\n<div class=\"btn-group\">\n  <button type=\"button\" class=\"\
    btn btn-success\">Middle 1</button>\n</div>\n<div class=\"btn-group\">\n  <button\
    \ type=\"button\" class=\"btn btn-success\">Middle 2</button>\n</div>\n<div class=\"\
    btn-group\">\n  <button type=\"button\" class=\"btn btn-success\">Middle 3</button>\n\
    </div>\n<div class=\"btn-group\">\n  <button type=\"button\" class=\"btn btn-success\"\
    >Middle 4</button>\n</div>\n<div class=\"btn-group\">\n  <button type=\"button\"\
    \ class=\"btn btn-success\">Right</button>\n</div>\n</div>\n```\n\n**Note:** One\
    \ of the new features that the HTML 5 brings to the table is something called\
    \ data attributes. BS3 (and for that matter BS2) uses these attributes in many\
    \ different places to allow elements and JavaScript functions to be joined together\
    \ without developer ever having to write a single line of JavaScript. Data attributes\
    \ always take the form of `data-*`, where `name` is the name the developer wishes\
    \ to assign to that attribute. Using `data-*` ensures that the attributes you\
    \ define will never interfere with anything the WHATWG standards adds to the spec,\
    \ giving developers utmost flexibility in what they wish to use them for.\n\n\
    In most cases, these data attributes are used the way BS3 uses them: in order\
    \ to pass information from the element into the JavaScript routines working on\
    \ it. They can be used to pass in ID names, options, parameters for sizes, and\
    \ many other things, meaning that you often don't actually have to write any boilerplate\
    \ code in your app. Throughout this chapter, you'll be introduced to many more\
    \ of these data attributes.\n\nIn order for the drop-down buttons to work, you\
    \ MUST have the drop-down JavaScript plug-in added to your BS3 build. If you've\
    \ just downloaded the default set, then this won't be a problem, as `dropdown.js`\
    \ is already part of the main `bootstrap.js` file. If you've done a custom build,\
    \ or even compiled from the Less sources yourself, you'll need to make sure it's\
    \ present.\n\nThe following code shows a basic drop-down button example:\n\n*Code\
    \ Sample 37: Dropdown Button Example*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_60_0.png)\n\
    \n```html\n<div class=\"btn-group\">\n  <button type=\"button\" class=\"btn btn-success\
    \ dropdown-toggle\" data-toggle=\"dropdown\">\n    A dropdown button <span class=\"\
    caret\"></span>\n  </button>\n  <ul class=\"dropdown-menu\" role=\"menu\">\n \
    \   <li><a href=\"#\">1st Link</a></li>\n    <li><a href=\"#\">2nd Link</a></li>\n\
    \    <li><a href=\"#\">3rd Link</a></li>\n    <li class=\"divider\"></li>\n  \
    \  <li><a href=\"#\">1st Link after divider</a></li>\n  </ul>\n</div>\n```\n"
  mdcn: "\n\n*图 27：代码示例 34 生成的输出*\n\n注意上一个代码示例，我更改了下拉按钮的颜色；要实现这一效果，你只需要在各个按钮的类上添加单独的按钮颜色即可。这适用于所有按钮组和工具栏——而不是在嵌套它们时——这意味着你可以根据使用情况更改组内按钮的颜色。\n\
    \n用于按钮布局的两个新类是 `btn-group-vertical` 类和 `btn-group-justified` 类。\n\n在 BS2 中，很难将按钮垂直堆叠，或者在保持尺寸平衡的同时让它们占据可用区域的全部宽度。BS3\
