- md: "\n## 6\n\n## The Story behind the Succinctly Series of Books\n\nDaniel Jebaraj,\
    \ Vice President\nSyncfusion, Inc.\n\n### Staying on the cutting edge \n\nAs many\
    \ of you may know, Syncfusion is a provider of software components for the\nMicrosoft\
    \ platform. This puts us in the exciting but challenging position of always\n\
    being on the cutting edge.\n\nWhenever platforms or tools are shipping out of\
    \ Microsoft, which seems to be about every other\nweek these days, we have to\
    \ educate ourselves, quickly.\n\n### Information is plentiful but harder to digest\
    \ \n\nIn reality, this translates into a lot of book orders, blog searches, and\
    \ Twitter scans.\nWhile more information is becoming available on the Internet\
    \ and more and more books are\nbeing published, even on topics that are relatively\
    \ new, one aspect that continues to inhibit us is the\ninability to find concise\
    \ technology overview books.\n\nWe are usually faced with two options: read several\
    \ 500+ page books or scour the web for\nrelevant blog posts and other articles.\
    \ Just as everyone else who has a job to do and customers\nto serve, we find this\
    \ quite frustrating.\n\n### The Succinctly series \n\nThis frustration translated\
    \ into a deep desire to produce a series of concise technical books that\nwould\
    \ be targeted at developers working on the Microsoft platform.\n\nWe firmly believe,\
    \ given the background knowledge such developers have, that most topics can\n\
    be translated into books that are between 50 and 100 pages.\n\nThis is exactly\
    \ what we resolved to accomplish with the *Succinctly* series. Isn’t everything\n\
    wonderful born out of a deep desire to change things for the better?\n\n### 7\n\
    \n### The best authors, the best content \n\nEach author was carefully chosen\
    \ from a pool of talented experts who shared our vision. The\nbook you now hold\
    \ in your hands, and the others available in this series, are a result of the\n\
    authors’ tireless work. You will find original content that is guaranteed to get\
    \ you up and running\nin about the time it takes to drink a few cups of coffee.\n\
    \n### Free forever \n\nSyncfusion will be working to produce books on several\
    \ topics. The books will always be free.\nAny updates we publish will also be\
    \ free.\n\n### Free? What is the catch? \n\nThere is no catch here. Syncfusion\
    \ has a vested interest in this effort.\n\nAs a component vendor, our unique claim\
    \ has always been that we offer deeper and broader\nframeworks than anyone else\
    \ on the market. Developer education greatly helps us market and\nsell against\
    \ competing vendors who promise to “enable AJAX support with one click” or “turn\
    \ the\nmoon to cheese!”\n\n### Let us know what you think \n\nIf you have any\
    \ topics of interest, thoughts or feedback, please feel free to send them to us\
    \ at\nsuccinctly-series@syncfusion.com.\n\nWe sincerely hope you enjoy reading\
    \ this book and that it helps you better understand the topic\nof study. Thank\
    \ you for reading.\n\nPlease follow us on Twitter and “Like” us on Facebook to\
    \ help us spread the\nword about the *Succinctly* series!\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_6_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_6_1.png)\n\
    \n### 8\n\n### About the Author \n\nAs an early adopter of IT back in the late\
    \ 1970s and early 1980s, I started out with a humble\nlittle 1k Sinclair ZX81\
    \ home computer.\n\nIn time this small, 1k machine became a 16k Tandy TRS-80,\
    \ followed by an Acorn Electron, and\neventually, a 4mb arm powered Acorn A5000.\n\
    \nAfter leaving school and getting involved with DOS-based PCs, I went on to train\
    \ in many\ndifferent disciplines in the computer networking and communications\
    \ industries.\n\nAfter returning to university in the mid-1990s and gaining a\
    \ BSc in Computing for Industry, I now\nrun my own consulting business, Digital\
    \ Solutions Computer Software Ltd, in England. I advise\nclients at both hardware\
    \ and software levels in many different IT disciplines, covering a wide\nrange\
    \ of domain-specific knowledge from mobile communications and networks right through\
    \ to\ngeographic information systems, banking and finance, and web design.\n\n\
    With over 30 years of experience in the IT industry within varied platforms and\
    \ operating\nsystems, I have a lot of knowledge to share.\n\nYou can often find\
    \ me hanging around in the Lidnug.NET users group on LinkedIn that I help\nrun,\
    \ and you can easily find me in the usual places such as Stack-Overflow (and its\
    \ GIS-specific\nboard) and in twitter (@shawty_ds), and now also on Pluralsight,\
    \ where my various videos are\navailable.\n\nI hope you enjoy the book, and gain\
    \ something from it.\n\nPlease remember to thank Syncfusion (@Syncfusion) for\
    \ making this book possible, and\nallowing people like me to share our knowledge\
    \ with the .NET community. The *Succinctly* series\nis a brilliant idea for busy\
    \ programmers.\n\n### 9\n\n### Introduction \n\nWelcome to the second book in\
    \ the *Succinctly* series that covers the Twitter Bootstrap (BS) UI\nand CSS framework.\n\
    \nIn my first book, I laid down the initial groundwork and got you started with\
    \ Bootstrap 2.\nSince that book was released, however, Bootstrap 3 has become\
    \ the mainstream version.\nIn this book we're going to continue to build on that\
    \ groundwork and move forward into using BS\nv3. We'll look to see where things\
    \ are different, and as we explore the new features, we'll see\nthat a big chunk\
    \ of what was present in v2 is still applicable to v3.\n\nIf you've not yet read\
    \ the first book on Bootstrap 2, then I encourage you to do so, as I will be\n\
    referring to it at various points throughout this book.\n\nThe style and layout\
    \ in this book will also be slightly different from the first one, in that it\
    \ will be\nmore of an extension to the first book rather than an independent book\
    \ in its own right.\n\nWhy? I believe that in order to understand the entire Bootstrap\
    \ landscape, you need to examine\nit from the beginning.\n\n### What's Changed\
    \ \n\nThe style and layout in this book will also be slightly different from the\
    \ first one, in that it will be\nmore of an extension to the first book rather\
    \ than an independent book in its own right.\n\nWhy? I believe that in order to\
    \ understand the entire Bootstrap landscape, you need to examine\nit from the\
    \ beginning.\n\n### 10\n\n- Buttons\n- Text\n- Table Rows\n- Labels\n- Badges\n\
    - Alerts\n- Progress Bars\n\n- Buttons\n- Text\n- Table Rows\n- Labels, Badge,\
    \ Alert\n- Progress Bars\n"
