    > `\n\n` .col-md-3 .col-md-offset-3 `\n\n`</div> `\n\n`<div class=\"col-md-3 col-md-offset-3\"\
    > `\n\n` .col-md-3 .col-md-offset-3 `\n\n`</div> `\n\n`<div class=\"col-md-6 col-md-offset-3\"\
    > `\n\n` .col-md-6 .col-md-offset-3 `\n\n`</div> `\n\n` `\n\n`<div class=\"col-md-8\"\
    >8 columns of content</div> `"
  - "[PAGE 18]\n\n \n\n \n\n \n\n \n\n19 \n\nIf you render those in your document,\
    \ as expected, you'll get the following: \n\n8 columns of content \n\n4 columns\
    \ of content \n\nIf, however, you modify the above code to add push and pull modifiers\
    \ as follows: \n\nWhen you render your document, you should see your layout change\
    \ as follows: \n\n4 columns of content \n\n8 columns of content \n\nFinally, if\
    \ you’re using the *Less* CSS source versions of Bootstrap, you have complete\
