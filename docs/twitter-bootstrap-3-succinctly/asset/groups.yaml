- md: "\n*Figure 76: Modal example produced by sample 72 *\n\nIn order to show a modal,\
    \ you first need to have a trigger target. In sample 72, this is the button marked\
    \ `**Show Modal Dialog**`. For a trigger action to work it must have a toggle\
    \ and target data attribute assigned to it, and the toggle must have the value\
    \ `**modal**` to show that it targets a modal dialog. The target must have the\
    \ ID selector of the outermost `<div>` assigned to it. In sample 72, the outermost\
    \ `<div>` has an `ID=\"myModal\"` on it, which means the data attribute for `target`\
    \ should have `#myModal**` as its value.\n\nYour trigger doesn't have to be a\
    \ button; it can be anything that can accept (or is set up to accept) a mouse\
    \ click, as long as the toggle and target data attributes are provided.\n\nOnce\
    \ we get into the modal itself, you'll see the structure consists of a number\
    \ of quite deeply nested `<div>`s. Because of this nesting, it's recommended that\
    \ you create and place your dialog/modal definitions as close to the body root\
    \ as possible; if you do not, then there is a chance that other components and\
    \ HTML structures could cause layout problems that you did not anticipate.\n\n\
    You'll also notice that again, there is a common theme of marking things up to\
    \ make them friendly to screen readers, and again, I can't stress this enough:\
    \ you should make every effort to make sure your markup is as friendly to accessibility\
    \ tools as possible.\n\nA modal starts with an outer `<div>` and the class `modal`\
    \ applied to it. Optionally, you can also add `fade`, which will give the modal\
    \ a nice smooth transition when showing and hiding. This outer `<div>` should\
    \ be the one on which you set your `Z-Order` and anything else in the way of global\
    \ modal customizations you wish to make.\n\nThe next `<div>` in should have a\
    \ class of `modal-dialog` added to it. That `<div>` should then be followed immediately\
    \ by a third `<div>` with the class of `modal-content` assigned to it. It's inside\
    \ this third `<div>` where you actually place your modal content definition.\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_96_0.png)\n\n</div>\n</div>\n</div>\n\
    \nOnce you have the modal content shell defined, you can then place in three further\
    \ `<div>` elements with the following classes: `modal-header`, `modal-body`, and\
    \ `modal-footer`. These three inner sections should NOT be nested, but rather\
    \ added to the markup as siblings of each other, and are used to define the content\
    \ for the three main sections of the dialog.\n\nYou can see from the code in sample\
    \ 72 that we include a closing cross, as we did for alert boxes. The only difference\
    \ between this closing cross and the one we saw previously is that the `dismiss`\
    \ data attribute has a value of `modal` and not `alert`. Any clickable element\
    \ placed within the inner modal markup that has this data attribute, with this\
    \ value, will close the dialog when clicked.\n\nApart from the close icon, the\
    \ rest of the modal’s inner content is just normal BS3 markup and CSS. Anything\
    \ you can use elsewhere you can use inside a modal, and if it's too tall for the\
    \ screen, you'll get an inner container that automatically switches to a scrollable\
    \ element. There are also two optional width sizes; these are added to the inner\
    \ `modal-dialog` `<div>` and are `modal-lg` and `modal-sm`. The large size class\
    \ expands the width of the modal to half the screen width (ideal for tables and\
    \ lists), whereas the small size shrinks the default width to approximately half\
    \ of its original size (ideal for things like yes/no prompts).\n\nYou can also\
    \ initialize the modal using the JavaScript API in a standard jQuery fashion;\
    \ if you want to alter the default option’s behavior, then using the JQ constructor\
    \ is the only way to do it.\n\n*Code Sample 73: Setting the Default Options on\
    \ a Modal Using JavaScript*\n\nThe options that can be changed are as follows:\n\
    \n- **backdrop:** Boolean true or false to include or not include the shaded background\
    \ on the page when the modal is shown; if the value `static` is specified, then\
    \ the background is shown but does NOT close the modal when clicked on, as it\
    \ does if `true` is used.\n- **keyboard:** Boolean true or false; allows or does\
    \ not allow the escape key to close the modal.\n- **show:** Boolean true or false,\
    \ automatically shows or does not show the dialog as soon as it’s initialized.\n\
    - **remote:** String containing a url to get the inner content for the dialog\
    \ body; if this is supplied, then the dialog will ask the url to supply a chunk\
    \ of HTML to be used in the body of the modal.\n\nThere are also a number of events\
    \ that are raised for certain actions, but they are beyond the scope of this chapter.\n\
    \n```javascript\n$('#myModal').modal({\n  backdrop: true/false,\n  keyboard: true/false,\n\
    \  show: true/false,\n  remote: 'path to url that returns content'\n});\n```\n\
    \n## Tabs\n\nIf you recall, back in the section on basic navigation, I mentioned\
    \ that the tab component can be wired up with extra markup to actually handle\
    \ the swapping of content panes for you.\n\nTo mark-up a set of tabs that change\
    \ automatically using JavaScript, you first need to create a `<ul>` in the same\
    \ manner as shown in the navigation components section. This `<ul>` must have\
    \ `<a>` elements embedded inside each `<li>` element, with the `href` pointing\
    \ to the `id` of each `<div>` set. You also need to add a data-toggle attribute\
    \ to each `<a>` and its value is set to `tab`. Once you've created the navigation\
    \ set, you then need to create an outer `<div>` and assign class `tab-content`\
    \ to it. Inside this `<div>`, you need to create several sibling `<div>`s, each\
    \ with a class of `tab-pane` and an `id` matching the anchor. Optionally, you\
    \ can add `fade` to tabs when they change.\n\nThe following code shows an example\
    \ of tabs produced automatically using JavaScript:\n\n*Code Sample 74: Automatic\
    \ Tabs*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_98_0.png)\n\n```html\n<ul\
    \ class=\"nav nav-tabs\">\n  <li class=\"active\"><a href=\"#tab1\" data-toggle=\"\
    tab\">Tab 1</a></li>\n  <li><a href=\"#tab2\" data-toggle=\"tab\">Tab 2</a></li>\n\
    \  <li><a href=\"#tab3\" data-toggle=\"tab\">Tab 3</a></li>\n</ul>\n<div class=\"\
    tab-content\">\n  <div class=\"tab-pane active\" id=\"tab1\">\n    <h1>Tab 1</h1>\n\
    \    <p>Content for tab 1.</p>\n  </div>\n  <div class=\"tab-pane\" id=\"tab2\"\
    >\n    <h1>Tab 2</h1>\n    <p>Content for tab 2.</p>\n  </div>\n  <div class=\"\
    tab-pane\" id=\"tab3\">\n    <h1>Tab 3</h1>\n    <p>Content for tab 3.</p>\n \
    \ </div>\n</div>\n```\n\nThe tab control doesn't have a constructor that takes\
    \ options the way modal does, but it does have an API call so you can tell which\
    \ tab to show programmatically. To do this, you just need jQuery to select the\
    \ appropriate selector, and then call `tab('show')` on it. As with modals, there\
    \ are events available to tell you when change.\n\n## Tooltips and Popovers\n\n\
    Everyone loves tooltips—simple pop-up tags that can be used for help and many\
    \ other simple, descriptive tasks.\n\nUsing a tooltip in BS3 is incredibly easy.\
    \ Simply assign a data attribute of `toggle` with the value `tooltip` to any HTML\
    \ element that you wish the tooltip to display for. To define the text for the\
    \ tooltip, add a title attribute containing the desired text, and optionally,\
    \ add a data attribute called `placement` containing the value `left`, `top`,\
    \ `bottom`, or `right` as required, depending on which direction you would like\
    \ the tooltip to show.\n\nThe following code will create a simple button with\
    \ a tooltip attached to its top:\n\n*Code Sample 75: BS3 Button with a Tool Tip*\n\
    \n```html\n<button id=\"mybutton\" type=\"button\" class=\"btn btn-default\" data-toggle=\"\
    tooltip\"\ndata-placement=\"top\" title=\"I am a tooltip!!\">The button with a\
    \ tooltip</button>\n```\n\nThere is one small caveat that applies to tooltips,\
    \ but does not apply to any other element: you need to initialize tooltips yourself.\
    \ You can pass various options into them at the same time (just as with modals),\
    \ but you MUST initialize them, or your tooltips will not appear.\n\nTo initialize\
    \ the button shown in the previous example, place the following line of JavaScript\
    \ somewhere in your page so that it's run once the DOM is ready and the button\
    \ is created:\n\nIt's entirely up to you how you select each of your buttons.\
    \ You could, for example, select them all via their element type, but you must\
    \ call `tooltip()` on every element that has a tooltip attached.\n\n```javascript\n\
    $('#mybutton').tooltip();\n```\n"
