    \ BS3 开始，它现在可以应用于 `<tr>` 元素，以将该行显示为高亮行（默认为浅灰色）。\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_29_0.png)\n\
    \n```html\n<table class=\"table table-striped table-bordered\">\n  <thead>\n \
    \   <tr>\n      <th>Col A</th>\n      <th>Col B</th>\n      <th>Col C</th>\n \
    \   </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>Val A</td>\n      <td>Val\
    \ B</td>\n      <td>Val C</td>\n    </tr>\n    <tr>\n      <td>Val A</td>\n  \
    \    <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n  </tbody>\n</table>\n```\n\
    （注：此处原文代码块中 table 闭合标签缺少斜杠，已按要求保持原样，代码不翻译）\n\n剩余的上下文类与 BS2 一样，设计用于高亮表格行以显示不同的条件，除了一个微小变化外，它们是相同的。\n\
    \n代表危险或负面操作的类名已重命名为 `danger`。在 BS2 中，红色类名为 `error`。除此之外，这些类的应用方式如下代码所示，均应用于 `<tr>`\
    \ 元素：\n\n*代码示例 15：可选行颜色*\n\n渲染时，它看起来应该像这样：\n\n```html\n<table class=\"table\"\
    >\n  <thead>\n    <tr>\n      <th>Class</th>\n      <th>Col B</th>\n      <th>Col\
    \ C</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr class=\"active\">\n      <td>Active</td>\n\
    \      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n    <tr class=\"success\"\
    >\n      <td>Success</td>\n      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n\
    \    <tr class=\"info\">\n      <td>Info</td>\n      <td>Val B</td>\n      <td>Val\
    \ C</td>\n    </tr>\n    <tr class=\"warning\">\n      <td>Warning</td>\n    \
    \  <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n    <tr class=\"danger\">\n\
    \      <td>Danger</td>\n      <td>Val B</td>\n      <td>Val C</td>\n    </tr>\n\
    \  </tbody>\n</table>\n```\n\n*图 4：代码示例 15 的输出*\n\n在支持表格的类中有两个新增内容。首先，有一个新的响应式类，它考虑了您的网格系统尺寸，并提供垂直滚动条或适应不同显示的重新排列表格。其次，现在可以在单个单元格上使用上述颜色类，而不再像\
    \ BS2 那样仅限于行。\n\n要在单元格级别使用颜色类，您只需要如下对单个 `<td>` 或 `<th>` 元素添加类：\n\n*代码示例 16：将行类应用于单个单元格*\n\
    \n这段代码应产生如下：\n\n*图 5：代码示例 16 的输出*\n\n最后一个表格添加是一个名为 `table-responsive` 的类，您可以通过将其应用于包裹\
    \ `<table>` 的 `<div>` 元素来使用：\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_31_0.png)\n\
    \n```html\n<div class=\"table-responsive\">\n  <table class=\"table\">\n    <thead>\n\
    \      <tr>\n        <th class=\"active\">Class</th>\n        <th class=\"success\"\
    >Col B</th>\n        <th class=\"info\">Col C</th>\n      </tr>\n    </thead>\n\
    \    <tbody>\n      <tr>\n        <td class=\"warning\">Val A</td>\n        <td\
    \ class=\"danger\">Val B</td>\n        <td>Val C</td>\n      </tr>\n    </tbody>\n\
    </table>\n</div>\n```\n\n*代码示例 17：新的 BS3 响应式表格*\n\n当此新类用于大于 768 像素的显示（即除 `-xs`\
    \ 外的任何尺寸）时，表格显示将像正常表格。但是，如果表格在针对 `-xs` 且宽度小于 768 像素的设备上显示，容器将进行调整，允许整个表格左右移动而不影响页面其他部分。\n\
    \n*图 6：宽度大于 768 像素的设备上代码示例 17 的输出*\n\n*图 7：宽度小于 768 像素的设备上代码示例 17 的输出*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_32_0.png)\n\
    \n```html\n<div class=\"table-responsive\">\n  <table class=\"table table-bordered\"\
    >\n    <thead>\n      <tr>\n        <th>Col A</th>\n        <th>Col B</th>\n \
    \       <th>Col C</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n \
    \       <td>Val A</td>\n        <td>Val B</td>\n        <td>Val C</td>\n     \
    \ </tr>\n    </tbody>\n  </table>\n</div>\n```\n\n## 表单更改\n\n与 BS2 一样，所有普通表单元素默认都有最小级别的标记来提供基础样式。这意味着，只需标记普通的\
    \ `<form>` 标签和关联控件即可为您的表单提供默认外观。\n\n参考以下示例：\n\n*代码示例 18：无类的基础 BS3 表单*\n\n如果我们在浏览器中渲染此示例，将发现即使不添加任何额外类，也能获得较好的输出，如下图所示：\n\
    \n代码示例 18 的输出\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_33_0.png)\n\n```html\n\
    <form>\n  <div>\n    <label for=\"exampleInputEmail1\">Email address</label>\n\
    \    <input type=\"email\" id=\"exampleInputEmail1\" placeholder=\"Enter email\"\
    >\n  </div>\n  <div>\n    <label for=\"exampleInputPassword1\">Password</label>\n\
    \    <input type=\"password\" id=\"exampleInputPassword1\" placeholder=\"Password\"\
    >\n  </div>\n  <div>\n    <label for=\"exampleInputFile\">File input</label>\n\
    \    <input type=\"file\" id=\"exampleInputFile\">\n    <p>Example block-level\
    \ help text here.</p>\n  </div>\n  <div>\n    <label>\n      <input type=\"checkbox\"\
    > Check me out\n    </label>\n  </div>\n  <button type=\"submit\">Submit</button>\n\
    </form>\n```\n\n注意：自之前的示例编写以来，BS3 代码进行了细微更新。如果您按照此处编写的方式尝试该示例，输出可能不符合预期。BS3 中所做的更改似乎意味着，现在在不添加任何\
    \ BS3 类的情况下仅标记表单，将无法为表单提供一致的外观和感受。我在本书中保留了该示例，因为它与文档网站上仍然存在的信息保持一致，因此这似乎仍然是框架作者的官方建议。\n\
    \n正如我在迁移章节中提到的，在 HTML 表单周围的类和组件在涉及类名更改时是受影响最大的受害者之一，但这是有原因的。在 BS3 之前，许多用于表单的类范围很窄——许多用途都有单独的类，而不是一个涵盖所有情况的类。例如，有单独的类来处理复选框和单选按钮的对齐，也有单独的类来处理输入框和文本区域的行。在\
    \ BS3 中，这些许多类已被删除，现在都合并到了更少数的类和元素下。\n\n在我们之前的示例基础上添加 BS3 文档所示的推荐标记，将得到如下内容：\n\n\
    *代码示例 19：添加推荐类的示例 18 基础 BS3 表单*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_34_0.png)\n\
    \n```html\n<form role=\"form\">\n  <div class=\"form-group\">\n    <label for=\"\
