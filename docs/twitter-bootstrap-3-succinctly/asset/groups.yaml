  - "[PAGE 11]\n\n \n\n \n\n \n\n12 \n\nBower is an HTML scaffolding and package system\
    \ designed to automate much of the \n\napplication boiler plate. You don’t need\
    \ to understand it to understand BS v3, but a quick \n\nGoogle search for “Bower”\
    \ will turn up many references to deepen your understanding. \n\nOn a similar\
    \ note, BS v3 can also be installed using the NuGet package manager if you’re\
    \ \n\nworking in Visual Studio. Like Bower, this will automate much of the process\
    \ for installing and \n\nsetting up the required files. Be careful though—there\
    \ are many Bootstrap packages available \n\nin NuGet, some of which will cause\
    \ you more work than they save you. \n\nFinally, the TWB customizer is still available\
    \ at http://getbootstrap.com/customize/. It’s been \n\ngreatly restructured and\
    \ rebuilt to provide more options and an easier, more intuitive look at \n\nwhat\
    \ you’re changing and why. \n\nIn fact, it's now so easy to change things using\
    \ the customizer that your designer or design \n\nteam can do 90 percent of the\
    \ work needed to set the colors and branding of your download \n\nbefore the files\
    \ required are even downloaded. This enables your design department to start \n\
    \nmaking color and layout choices immediately, while you work on the page layouts\
    \ and additional \n\ncode for the required interactivity. Then, all that’s required\
    \ is for you to simply replace your \n\ndefault files with the files provided\
    \ to you by your designers, and an instant theme change \n\nshould occur. \n\n\
    **Device Support **\n\nOfficially, BS v3 only supports the latest round of HTML\
    \ 5-compliant browsers and Internet \n\nExplorer 10 and above. \n\nIn reality,\
    \ the framework also supports IE8 and IE9; however, there are some features of\
    \ CSS3 \n\nand HTML5 that don't quite work as expected. In particular, if you\
    \ want the responsive elements \n\nto work correctly, you'll need to use `**respond.js**`,\
    \ which you can download from the following \n\nGitHub repository: https://github.com/scottjehl/Respond.\
    \ \n\nOnce you add `**respond**` to your project, it's basically just a general\
    \ expectation to what was and \n\nwas not added to the various browsers, at various\
    \ times. \n\nThe parts that will be most noticed as missing are as follows: \n\
    \nFor IE8: \n\n`**border-radius**` is NOT supported \n\n`**box-shadow**` is NOT\
    \ supported \n\n`**transform**` is NOT supported \n\n`**transition**` is NOT supported\
    \ \n\n`**placeholder**` text is NOT supported"
