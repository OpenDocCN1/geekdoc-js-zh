    I can''t take credit for this fix however—it''s clearly detailed in the BS3 documentation
    online.


    There is also more information on the subject in the Windows 8 developer guidelines.


    ## Safari Percent Rounding


    In some versions of Safari, the rendering engine struggles with the number of
    decimal places in percentage values.


    These percentages are used often in the `col-*-1` grid classes, and as a result,
    you''ll see errors in the rendering of 12-column layouts when this is encountered.


    There is a bug open in the BS3 bug report system, but there''s little they can
    do to resolve it. The BS3 docs do suggest trying to add a `pull-right` to your
    last column, but the best course of resolution seems to be manual tweaking of
    your percentage-based values until a balance is found.


    ## Android Stock Browser


    At this time, Android versions 4.1 and above ship with the “Browser” app as the
    default web browser. BS3 (and many others) fail to render correctly in the Browser
    app due to the large number of problems in the browser’s code base, and more so
    in the CSS engine where there are a large number of known problems.


    There is a JavaScript-based solution to patch your layouts in the BS3 docs, but
    the best resolution is for the user to use the Chrome app instead, which is by
    far a better and more stable browser for Android in general.


    ## And the Rest?


    There are quite a few more things to be aware of, and again, most of these are
    documented in the BS3 docs and cover things like pinch-based zooming, virtual
    keyboards, and how different types of view ports react where media queries are
    concerned.


    In fact, a quick scan of the most common issues on www.stackoverflow.com tells
    us that a great many of the problems revolve around scrolling, resizing, zooming,
    and general touch screen-based issues that seem to stem from either things being
    too small, or not being sensitive enough for average finger sizes.


    Many of these size issues can be resolved by downloading the BS3 source distribution
    and either altering the `Less` variables and mixins available, or by customizing
    things using the customization tools available; it''s now no longer a good idea
    to just download and use BS3 unless you’re only targeting desktop apps.


    If you’re targeting multiple platforms and expecting full responsiveness, then
    you really need to be doing a lot of customization in the hooks provided by the
    framework authors.


    ## Chapter 3 Changed CSS Features


    So far you''ve already seen a number of the new CSS features that are available
    in version 3 of Bootstrap. In this chapter we''ll go into a little more detail
    about just what is considered new and what''s not.


    In many cases these new classes are just renames of the old ones, but we treat
    them as new here so that you can easily make the distinction.


    ## Typography Changes


    The various classes that make up BS3''s typography section haven''t changed as
    much as some of the other elements. Tags `H1` through `H6` are still treated the
    same way as they were in v2, with the addition that you can now use `<small>`
    in line with any header element without it first having to be wrapped in a `div`
    using the `page-header` class. This means no extra markup now, unless you want
    your block heading to be underlined with a different paragraph margin.


    *Code Sample 10: BS V2 Page Header*


    In v2 you had no choice but to wrap your `H1` in a page-header div, as this was
    the only way the small tags output would be neatly up.


    *Code Sample 11: BS V3 Page Header*


    Continuing on, the standard body copy has no changes, and remains at a default
    size of 14 pixels with a line height of 1.4. Body copy is applied to all text
    inside a paragraph tag, so no classes are needed unless you want to use some of
    the special features (as we''ll see soon). Lead body copy (paragraphs with the
    class name `lead`) also have no changes to their names or styling, and as with
    v2, are designed to give your opening paragraph a bit more emphasis than the other
    regular copy.


    <div class="page-header">

    <h1>This is my super page <small>It''s the best</small></h1>

    </div>

    <h1>This is my super page <small>it''s the best</small></h1></h1>


    *Code Sample 12: Header and Body Text*


    When rendered in your browser, it should look like the following: The `<small>`
    tag can also be used on its own, as its styling is now correctly handled and applied
    in the context in which it''s used, so its styling will follow its position in
    the document no matter what parent tag.


    Similarly, bold text is still created using `strong` tag and italics using `em`
    tag; as with many of the typography classes, this is no different to v2. The alignment
    classes also maintain their names of `text-left`, `text-center`, `text-right`,
    and `text-justify`, and still perform the same functions as precedes this one.


    Likewise, abbreviations are still created using `<abbr>` tag with the `title`
    attribute acting as the full description of abbreviation. There is one new class,
    `initialism`, that can be added to abbreviation and gives the rendered output
    a slightly smaller look than surrounding text. Addresses (using `<address>` tag)
    and blockquotes (using `<blockquote>` tag) also have no changes in base rules
    between v2 and v3. The final tags that remain in category include `<code>`, used
    to create inline code. Again, this has not changed in any way, with intended use
    still being for code samples that sit in line with regular text.


    <div class="container">

    <div class="page-header">

    <h1>This is my super page <small>It''s the best</small></h1>

    </div>

    <p class="lead">Welcome to my super-duper webpage, there''s no other webpage like
    it in the whole world, my page is the best thing on the Internet that you should
    visit</p>

    <p>On this page I have text and some more text, and there''s even some text for
    you to read, as well as a nice looking title</p>

    </div>


    For code samples (or anything that is plain text) that must remain formatted as
    indentation and carriage returns, you should still use the `<pre>` tag; again
    the styling here has not changed from v2, and layout using this tag should still
    behave as expected.


    The final typographic element is the addition of a new element called `<kbd>`.
    The purpose of this new tag is to display text in a way that indicates the user
    should enter information into the computer in some way, generally by typing it.


    For example:


    *Code Sample 13: ''<kbd>'' Tag Example*


    Which when rendered in an HTML document, should look something like the following:


    *Figure 2: Output produced by code sample 13*


    ## List Changes


    In general, the normal list elements made up of `<ul>`, `<ol>`, and `<dl>` elements
    have not changed; the layout is still as it was in BS2, with no extra classes
    being needed. Note also that `list-unstyled`, `list-inline` along with the `dl-horizontal`
    classes for definition lists also remain unchanged in v3, and have the same behavior
    as in BS2.


    There are some changes in the list elements however, but since these occur with
    the specialist classes used to create menus and navigation lists, we''ll be covering
    those when we address the changes to the navigation elements in the next chapter.


    ## Table Changes


    Tables are still styled just as they were in v2 by creating a standard `<table>`
    arrangement, then adding a `table` class to the markup. As in BS2, tables should
    always be constructed using the full range of `<table>`, `<thead>`, and `<tbody>`
    HTML elements as the following example shows:


    *Code Sample 14: Marking Up a Table to Be Used by Bootstrap*


    <table class="table">

    <p>Open up a command prompt by typing <kbd>cmd</kbd> into the box and clicking
    on the button market ''Run'', when it opens type in <kbd>myprogram</kbd> and press
    enter, at which point the app should run</p>

    <thead>

