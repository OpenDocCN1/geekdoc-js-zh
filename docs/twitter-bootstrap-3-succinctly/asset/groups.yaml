- md: "\n*Figure 58: Output from code sample 55 *\n\nThe most observant of you may\
    \ be thinking, “Ok, so list groups look good, but there just still `<ul>` underneath\
    \ the surface, there's really nothing that special about them.”\n\nWell, maybe\
    \ you’re right about that… or maybe we need to experiment a bit more.\n\nList\
    \ groups, unlike the classes we saw in the navigation sections, cannot just be\
    \ applied to an unordered list. A list group can be applied to any parent container,\
    \ and when done so, the styling will cause all of the children of that container\
    \ to become linked. Take a look at the following example:\n\n*Code Sample 56:\
    \ List Group Created Using <a> Tags *\n\n*Figure 59: Output produced by code sample\
    \ 56 *\n\nAs code sample 56 shows, we can create a list of links using nothing\
    \ more than a `<div>` surrounding the list, and that list then instantly becomes\
    \ a list-style menu with a light grey hover effect. However, because the inner\
    \ tags are `<a>` tags, we can now go even further:\n\n*Code Sample 57: List Group\
    \ Expanded to Use More than Just Simple Lists *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_80_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_80_1.png)\n\
    \n```html\n<li class=\"list-group-item\"><span class=\"badge pull-right\">2</span>Tomato</li>\n\
    </ul>\n\n<div class=\"list-group\">\n  <a class=\"list-group-item\">Cheese</a>\n\
    \  <a class=\"list-group-item\">Burger</a>\n  <a class=\"list-group-item\">Bun</a>\n\
    \  <a class=\"list-group-item\">Pickles</a>\n  <a class=\"list-group-item\">Tomato</a>\n\
    </div>\n\n<div class=\"list-group\">\n  <a class=\"list-group-item active\">\n\
    ```\n\n*Figure 60: Output produced by code sample 57 *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_81_0.png)\n\
    \n```html\n  <strong>Cheese</strong>\n  <p>A delicious slice of ...</p>\n  <img\
    \ src=\"images/cheese.jpg\" />\n</a>\n<a class=\"list-group-item\">\n  <strong>Burger</strong>\n\
    \  <p>Prime Aberdeen angus beef ...</p>\n  <img src=\"images/burger.jpg\" />\n\
    </a>\n<a class=\"list-group-item\">\n  <strong>Bun</strong>\n  <p>A freshly baked\
    \ soft sesame seed bun ...</p>\n  <img src=\"images/bun.jpg\" />\n</a>\n<a class=\"\
    list-group-item\">\n  <strong>Pickles</strong>\n  <p>The finest pickles from the\
    \ finest purveyors ...</p>\n  <img src=\"images/pickle.jpg\" />\n</a>\n<a class=\"\
    list-group-item\">\n  <strong>Tomato</strong>\n  <p>Fresh organic tomatoes picked\
    \ directly from the vine ...</p>\n  <img src=\"images/tomato.jpg\" />\n</a>\n\
    </div>\n```\n\nNotice that we still get the full, cell-hover effect when your\
    \ mouse hovers over a link, and by simply adding the `active` class, as we have\
    \ in other examples, we can mark an item as being the active one, and all while\
    \ maintaining a single set of borders and the appearance of each item behaving\
    \ just like a regular `<ul>` element.\n\nBut why stop there?\n\nJust as with any\
    \ other element in BS3, list groups also have their own contextual classes to\
    \ give them meaning in the standard color set:\n\n*Code Sample 58: BS3 List Group\
    \ with Contextual Color Classes *\n\n```html\n<div class=\"list-group\">\n  <a\
    \ class=\"list-group-item list-group-item-success\">\n    <strong>Cheese</strong>\n\
    \    <p>...</p>\n    <img src=\"images/cheese.jpg\" />\n  </a>\n  <a class=\"\
    list-group-item list-group-item-success\">\n    <strong>Burger</strong>\n    <p>...</p>\n\
    \    <img src=\"images/burger.jpg\" />\n  </a>\n  <a class=\"list-group-item list-group-item-success\"\
    >\n    <strong>Bun</strong>\n    <p>...</p>\n    <img src=\"images/bun.jpg\" />\n\
    \  </a>\n  <a class=\"list-group-item list-group-item-danger\">\n    <strong>Pickles</strong>\n\
    \    <p>...</p>\n    <img src=\"images/pickles.jpg\" />\n  </a>\n  <a class=\"\
    list-group-item list-group-item-warning\">\n    <strong>Tomato</strong>\n    <p>...</p>\n\
    \    <img src=\"images/tomato.jpg\" />\n  </a>\n</div>\n```\n\n*Figure 61: Output\
    \ produced by code sample 58 *\n\nAs you can see, what use is a burger without\
    \ cheese and a bun? Tomatoes I can take or leave, but please hold the pickle!\n\
    \n## Media Objects and Custom Thumbnail Changes\n\nWe covered the basic thumbnail\
    \ changes for the styling back in the chapter on CSS, but what we didn’t get into\
    \ are the changes in the surrounding components.\n\nThe amalgamation that now\
    \ exists in BS3 allows us to combine the thumbnail classes with the grid classes\
    \ to create easy-to-use image lists. The most basic way we can use them is to\
    \ use the `row` class and grid spans, along with the basic thumbnail classes,\
    \ to make perfectly lined-up thumbnails, as the following shows:\n\n*Code Sample\
    \ 59: Basic Thumbnails with Grid Classes *\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_83_0.png)\n\
    \n```html\n<div class=\"row\">\n  <div class=\"col-md-3\">\n    <a href=\"#\"\
    \ class=\"thumbnail\">\n      <img data-src=\"holder.js/100%x180\" />\n    </a>\n\
    ```\n\n*Figure 62: Thumbnails produced by code sample 59 *\n\nFor those who are\
    \ wondering, I'm using **holder.js** to produce the image place holders. For those\
    \ who are wondering, I'm using holder.js to produce the image place holders. For\
    \ those who are wondering, I'm using holder.js to produce the image place holders.\
    \ (Note: The OCR text contains repetitive loops here).\n\nIf we add a little more\
    \ work, we can easily produce something like the following:\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_84_0.png)\n\
    \n```html\n<div class=\"row\">\n  <div class=\"col-md-3\">\n    <a href=\"#\"\
    \ class=\"thumbnail\">\n      <img data-src=\"holder.js/100%x180\" />\n    </a>\n\
    \  </div>\n  <div class=\"col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n\
    \      <img data-src=\"holder.js/100%x180\" />\n    </a>\n  </div>\n  <div class=\"\
    col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n      <img data-src=\"holder.js/100%x180\"\
    \ />\n    </a>\n  </div>\n  <div class=\"col-md-3\">\n    <a href=\"#\" class=\"\
    thumbnail\">\n      <img data-src=\"holder.js/100%x180\" />\n    </a>\n  </div>\n\
    </div>\n```\n"
  mdcn: "\n\n*图 58：代码示例 55 的输出*\n\n你们中最敏锐的可能在想：“好吧，所以列表组看起来很不错，但底层仍然只是 <ul> 标签，它们其实并没有什么特别的。”\n\
    \n嗯，也许你在这方面是对的……又也许我们还需要再多做一些实验。\n\n列表组（List groups）与我们在导航章节看到的类不同，它们不能简单地应用于无序列表。列表组可以应用于任何父容器，一旦这样做，其样式将导致该容器的所有子元素都相互链接。请看下面的示例：\n\
    \n*代码示例 56：使用 <a> 标签创建的列表组*\n\n*图 59：代码示例 56 生成的输出*\n\n如代码示例 56 所示，我们只需要在列表周围包围一个\
    \ `<div>` 就可以创建一个链接列表，然后该列表会立即变成一个带有浅灰色悬停效果的列表样式菜单。然而，由于内部标签是 `<a>` 标签，我们现在可以更进一步：\n\
    \n*代码示例 57：扩展列表组，以使用不仅仅是简单列表*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_80_0.png)![](img/3ef3f89d48533001235bf8b5b1e48737_80_1.png)\n\
    \n```html\n<li class=\"list-group-item\"><span class=\"badge pull-right\">2</span>Tomato</li>\n\
    </ul>\n\n<div class=\"list-group\">\n  <a class=\"list-group-item\">Cheese</a>\n\
    \  <a class=\"list-group-item\">Burger</a>\n  <a class=\"list-group-item\">Bun</a>\n\
    \  <a class=\"list-group-item\">Pickles</a>\n  <a class=\"list-group-item\">Tomato</a>\n\
    </div>\n\n<div class=\"list-group\">\n  <a class=\"list-group-item active\">\n\
    ```\n\n*图 60：代码示例 57 生成的输出*\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_81_0.png)\n\
    \n```html\n  <strong>Cheese</strong>\n  <p>A delicious slice of ...</p>\n  <img\
    \ src=\"images/cheese.jpg\" />\n</a>\n<a class=\"list-group-item\">\n  <strong>Burger</strong>\n\
    \  <p>Prime Aberdeen angus beef ...</p>\n  <img src=\"images/burger.jpg\" />\n\
    </a>\n<a class=\"list-group-item\">\n  <strong>Bun</strong>\n  <p>A freshly baked\
    \ soft sesame seed bun ...</p>\n  <img src=\"images/bun.jpg\" />\n</a>\n<a class=\"\
    list-group-item\">\n  <strong>Pickles</strong>\n  <p>The finest pickles from the\
    \ finest purveyors ...</p>\n  <img src=\"images/pickle.jpg\" />\n</a>\n<a class=\"\
    list-group-item\">\n  <strong>Tomato</strong>\n  <p>Fresh organic tomatoes picked\
    \ directly from the vine ...</p>\n  <img src=\"images/tomato.jpg\" />\n</a>\n\
    </div>\n```\n\n注意，当你的鼠标悬停在链接上时，我们仍然获得完整的单元格悬停效果，通过像我们在其他示例中那样简单地添加 `active` 类，我们可以将某个项目标记为激活状态，而这一切保持了单组边框以及每个项目的行为看起来就像普通的\
    \ `<ul>` 元素。\n\n但为什么停于此呢？\n\n正如 BS3 中的任何其他元素一样，列表组也有自己的上下文类来赋予它们意义：*代码示例 58：带有上下文颜色的列表组*\n\
    \n```html\n<div class=\"list-group\">\n  <a class=\"list-group-item-success\"\
    >\n    <strong>Cheese</strong>\n    <p>...</p>\n    <img src=\"images/cheese.jpg\"\
    \ />\n  </a>\n  <a class=\"list-group-item-success\">\n    <strong>Burger</strong>\n\
    \    <p>...</p>\n    <img src=\"images/burger.jpg\" />\n  </a>\n  <a class=\"\
    list-group-item-success\">\n    <strong>Bun</strong>\n    <p>...</p>\n    <img\
    \ src=\"images/bun.jpg\" />\n  </a>\n  <a class=\"list-group-item-danger\">\n\
    \    <strong>Pickles</strong>\n    <p>...</p>\n    <img src=\"images/pickle.jpg\"\
    \ />\n  </a>\n  <a class=\"list-group-item-warning\">\n    <strong>Tomato</strong>\n\
    \    <p>...</p>\n    <img src=\"images/tomato.jpg\" />\n  </a>\n</div\n```\n\n\
    *图 61：代码示例 58 的输出*\n\n你可以看到，如果没有奶酪和面包，还有什么？\n\n## 媒体对象与自定义缩略图\n\n我们在 CSS 章节中涵盖了缩略图的变化，但我们还没有进入周围组件的变化。BS3\
    \ 允许我们将缩略图类与网格类相结合以创建易于使用的列表。最基本的方法是使用 `row` 类和网格类制作完美对齐的缩略图，如下所示：\n\n*代码示例 59：带有网格的基础缩略图*\n\
    \n![](img/3ef3f89d48533001235bf8b5b1e48737_83_0.png)\n\n```html\n<div class=\"\
    row\">\n  <div class=\"col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n \
    \     <img src=\"https://placehold.com/150x150\" />\n    </a>\n  </div>\n  <div\
    \ class=\"col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n      <img src=\"\
    https://placehold.com/150x150\" />\n    </a>\n  </div>\n  <div class=\"col-md-3\"\
    >\n    <a href=\"#\" class=\"thumbnail\">\n      <img src=\"https://placehold.com/150x150\"\
    \ />\n    </a>\n  </div>\n  <div class=\"col-md-3\">\n    <a href=\"#\" class=\"\
    thumbnail\">\n      <img src=\"https://placehold.com/150x150\" />\n    </a>\n\
    \  </div>\n</div>\n```\n\n*图 62：代码示例 59 的输出*\n\n对于那些感到好奇的人，我使用 **placeholder.js**\
    \ 来生成占位图。如果我们再增加一点工作，就可以轻松产生如下的内容：\n\n![](img/3ef3f89d48533001235bf8b5b1e48737_84_0.png)\n\
    \n```html\n<div class=\"row\">\n  <div class=\"col-md-3\">\n    <a href=\"#\"\
    \ class=\"thumbnail\">\n      <img src=\"https://placehold.com/150x150\" />\n\
    \    </a>\n  </div>\n  <div class=\"col-md-3\">\n    <a href=\"#\" class=\"thumbnail\"\
    >\n      <img src=\"https://placehold.com/150x150\" />\n    </a>\n  </div>\n \
    \ <div class=\"col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n      <img\
    \ src=\"https://placehold.com/150x150\" />\n    </a>\n  </div>\n  <div class=\"\
    col-md-3\">\n    <a href=\"#\" class=\"thumbnail\">\n      <img src=\"https://placehold.com/150x150\"\
    \ />\n    </a>\n  </div>\n</div>\n</div>\n```\n\n"
