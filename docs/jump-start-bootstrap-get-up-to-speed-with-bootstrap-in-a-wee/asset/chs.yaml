  \n## 想进一步学习吗？\n\n感谢购买本书。我们感谢你的支持。你想继续学习吗？现在你可以在 Learnable 上以低的价格无限访问课程和**所有** SitePoint\
  \ 书籍。立即注册并从今天开始学习！加入 Learnable，你将处于最新趋势的前沿：[`www.learnable.com`](http://www.learnable.com)。\n\
  \n# 第 1 章\n\n深入浅出地接触 Bootstrap\n\n\n\n\n\n在本章中，我们将学习 Bootstrap 的基础知识，并理解它如何加速 Web\
  \ 开发流程。我们将首先简要回顾 CSS 框架的历史，然后解释“响应式网页设计”（`Responsive Web Design`，简称 `RWD`）这一术语。最后，我们将学习如何设置一个新的\
  \ Bootstrap 项目，并使用它创建我们的第一个基础网页项目。\n\n## 什么是 Bootstrap？\n\nBootstrap 是一个前端框架，帮助开发者快速启动\
  \ Web 开发流程。对于从 `Java` 或 `PHP` 等硬核服务器端编程语言转向前端开发的开发者来说，可能会发现掌握 CSS 和 JavaScript 非常困难；然而，通过\
  \ Bootstrap，他们只需要专注于编写正确的 HTML，将复杂的 CSS 和 JavaScript 留给 Bootstrap 即可。\n\nBootstrap\
  \ 不仅对新手 Web 开发者有用。随着本书的进行，你会发现 Bootstrap 也能为专家级程序员带来益处。\n\n## 它为什么存在？\n\n想象一下，你必须设计一个具有吸引人的导航栏、时尚的按钮、精美的排版、文本和图像占位符、大尺寸图片轮播器等的网站——但你并不是前端开发专家。但是，如果这些功能已经为你写好了代码，你只需要写一点\
  \ HTML 就可以使用它们呢？这就是 Bootstrap。\n\n所有需要的 CSS 类和 JavaScript 代码已经包含在 Bootstrap 安装包中了。例如，使用类\
  \ `btn` 配合链接（`<a></a>`）元素将使它们看起来像如图 1.1 所示的按钮。此外，在链接上使用 `btn-primary` 类将使其变成一个深蓝色按钮：\n\
  \n```html\n<a href=\"http://www.google.com\" class=\"btn btn-primary\">\nVisit Google\n\
  </a>\n```\n\n![使用 Bootstrap 创建按钮](img/ch1Image1.png)\n\n图 1.1. 使用 Bootstrap 创建按钮\n\
  \n然而，Bootstrap 不仅仅是装饰链接、图像和排版。它最重要的功能之一是`网格系统`。没有网格系统，你就无法创建一个移动端友好且响应式的网站。我们将在本章后面讨论响应式网页设计和网格系统。\n\
  \n## 它能如何帮助我？\n\n正如我提到的，Bootstrap 是新手设计师的加分项，但并不限于新手。专家也可以将 Bootstrap 的代码作为基础来创建新东西。Bootstrap\
  \ 允许你通过使用 [Less](http://lesscss.org/) 和 [Sass](http://sass-lang.com/) 来自定义其样式。熟悉这些技术的开发者可以完全修改\
  \ Bootstrap 的默认外观和感受。自定义 Bootstrap 有多种方法，我们将在后面的章节 中介绍这些方法。\n\n## CSS 框架的历史\n\n\
  这一切始于 2006-07 年左右如 [YUI](http://yuilibrary.com/)（雅虎用户界面库）和 [Blueprint](http://www.blueprintcss.org/)\
  \ 等 CSS 框架的流行。它们带来了许多基础资源，如 CSS 重置（CSS reset）、字体、网格、动画效果、按钮等。开发者开始意识到，这些框架对于处理开发网站时所需的许多繁燥重复任务非常有用，而且它们的使用可以极大地缩短开发周周期。\n\
  \n在这些基础 CSS 框架之后，是一代“全功能”前端框架，例如 Bootstrap，它将 JavaScript 也引入其中。Bootstrap 将常用的 CSS\
  \ 和 JavaScript 组件组合在一起，满足了许多基本的开发需求，例如创建轮播图、制作弹出效果和下拉菜单。\n\nBootstrap 封装了许多可以轻松用于网站项目的实用组件。它为每个组件都使用标准的\
  \ HTML 标记。通过 Bootstrap，开发者只需专注于编写框架可以理解并相应渲染的正确 HTML 标记即可。\n\n### CSS 原型的需求\n\n\
  拥有一个良好的 CSS 框架的主要原因是简化开发流程。每位 Web 设计师在开发网站时都会执行许多常见任务。诸如清除浏览器重置、为网站布局创建正确的网格系统以及分配排版规则等任务，如果在每个项目中重复执行，可能会变得令人沮丧且耗费时间。一个良好的\
  \ CSS 框架提供了一套强大的工具，可以简化这些任务。\n\n良好的 CSS 框架的一些主要亮点包括：\n\n* 更快的开发\n* 组织良好且易于维护的代码\n\
  * 让你把时间花在创新上，而不是重复造轮。\n\n## Bootstrap 的起源\n\nBootstrap 由 Mark Otto 和 Jacob Thornton\
  \ 在 2011 年开发，他们 Twitter 的两位 Web 开发者。他们的主要关注点是保持代码的一性和可维护性。\n\n以下是来自 [Mark Otto 博客](http://markdotto.com/)\
  \ 关于 Bootstrap 诞生的引言：\n\n> ... 我和一极少数的开发者聚在一起设计并构建了一个新的内部工具，并看到了一个做更多事情的机会。在这个过程中，我们看到自己构建了比另一个内部工具实质得多的东西。几个月后，我们得到了\
  \ Bootstrap 的早期版本，作为在公司内部记录和共享常用设计模式和资产的方式。\n\nBootstrap 1.0.0 于 2011 年发布，仅包含 CSS\
  \ 和 HTML 组件。直到 Bootstrap 1.3.0 版本之前，它都没有包含任何 JavaScript 插件，该版本也兼容 IE7 和 IE8。\n\n\
  2012 年迎来了 Bootstrap 2.0.0 的另一个重大更新。它是 Bootstrap 库的完全重写，同时也成为了一个响应式框架。它的组件兼容各种设备——手机、平板电脑和桌面电脑——并且安装包中包含了许多新的\
  \ CSS 和 JavaScript 插件。\n\n2013 年的 Bootstrap 3 在另一个重大更新后是另一个重大发布，成为一个“移动优先且始终响应”的框架。在框架早期版本中，制作响应式网站是可选的。在\
  \ 2013 年的版本中，类名和项目结构发生了变化。但请注意，`Bootstrap 3 不向下兼容`。你无法通过替换核心 CSS 和 JavaScript 文件直接迁移到此版本。\n\
  \n如果你想查看 Bootstrap 的完整历程，[查看 GitHub 上的历史发布](https://github.com/twbs/bootstrap/releases)。它还显示了每个版本所做的更改。\n\
  \n今天，Bootstrap 有庞大的全球开发者社区在 GitHub 上为其代码库做出贡献。在 Stack Overflow 社区也有活跃讨论，标签如 [bootstrap](http://stackoverflow.com/tagged/bootstrap)、[twitter-bootstrap](http://stackoverflow.com/tagged/twitter-bootstrap)\
  \ 和 [twitter-bootstrap-3](http://stackoverflow.com/tagged/twitter-bootstrap-3)。\n\
  \nBootstrap 已成为今天最受青的技术之一。如果你是一名全栈开发者，它是必不可少的，正如来自 Indeed.com 的图 1.2 截图所示。\n\n![Bootstrap\
  \ 技能趋势](img/ch1Image13.png)\n\n图 1.2. Bootstrap 技能趋势\n\n在编写时，Bootstrap 3.1.1 是最新版本。因此，本书的内容和代码将兼容\
  \ Bootstrap 3.1.1 及以上版本。\n\n## Bootstrap 的竞争对手\n\n在前端框架领域，还有许多其他与 Bootstrap 竞争的流行框架。包括：\n\
  \n* [Zurb 的 Foundation 框架](http://foundation.zurb.com/)\n* [Semantic UI](http://semantic-ui.com/)\n\
  * [Gumby 框架](http://gumbyframework.com/)\n* [Yahoo 的 Pure](http://purecss.io/)\n\
  \n## 谁在使用 Bootstrap？\n\n\n\n\n\n在采用某项技术之前，查看基于该技术的真实项目是非常值得的。这有助于我们清楚地了解使用该特定技术可以实现什么。以下是一些借助\
  \ Bootstrap 创建的真实网站项目示例：\n\n*   [OpenDesk](https://www.opendesk.cc/)\n*   [Riot\
  \ Designs](http://riotdesign.eu/en/)\n*   [20Jeans](https://www.20jeans.com/)\n\
  *   [Red Antler](http://redantler.com/)\n*   Uberflip\n\n## 响应式网页设计概述\n\n`Responsive\
  \ web design` 允许开发者创建一个能够随时更改布局的网站。开发者可以创建一个适用于任何类型设备的单一设计：包括手机、平板电脑、智能电视和电脑。\n\n\
  采用响应式设计的网站通常是流式设计。它们会根据查看时时的屏幕大小调整自己，并兼容移动设备的触摸接口。通过使用响应式网页设计，开发者可以创建强大的 Web 应用，取代\
  \ iOS 和 Android 等平台上的原生应用。\n\n### 根据屏幕尺寸调整布局\n\n让我们来看一个示例以更好地理解这个概念。假设我们有一个针对桌面屏幕的布局，如图\
  \ 1.3 所示。\n\n![Our layout for a desktop screen](img/ch1Image8.png)\n\n图 1.3 我们的桌面屏幕布局\n\
  \n我们的桌面布局有三个主要部分：页眉（header）、内容区域和页脚（footer）。页眉部分包含一个 Logo 和矩形广告。内容区域包含四个水平排列的较小文章。然后，我们在较小文章下方放置了两个较大的文章。最后，我们有一个页脚部分，其中有简单的版权文本。\n\
  \n显而易见，我们无法在平板电脑和手机上轻松查看此页面，因为它无法正确适应屏幕。该设计需要为那些用户进行定制。\n\n假设我们已经使用 Bootstrap 创建了桌面布局。我们使用了它的网格系统创建了响应式设计，以便布局会自动调整以适应平板电脑和移动设备。\n\
  \n在平板设备上，布局将将如图 1.4 所示。广告已从页眉部分隐藏，Logo 居中显示。布局完美适配。\n\n![Our layout adjusted for\
  \ tablet screens](img/ch1Image9.png)\n\n图 1.4 我们的平板屏幕调整布局\n\n在智能手机视图中（如图 1.5 所示），我们可以看到页眉部分继续遵循平板电脑视图，但内容部分发生了巨大变化。文章重新流向底部，形成两行，每行包含两篇文章。较大的文章现在堆叠在一起——每行一篇文章（第二个较大的文章超出了屏幕底部）。\n\
  \n![Our layout adjusted for smartphones](img/ch1Image10.png)\n\n图 1.5 我们的智能手机调整布局\n\
  \n这是对响应式设计行为如何的一个非常基础的概述。显然，我们可以做的比上述示例展示的要得多。我们将在第 2 章学习网格系统时学习更多关于响应式网页设计的知识。\n\
  \n## 准备好 Bootstrap\n\n最后，我们来到了本章最重要的的话题：开始上手使用 Bootstrap！\n\n首先，我们需要 Bootstrap 软件包，因此让我们访问\
  \ Bootstrap 官网 [`getbootstrap.com`](http://getbootstrap.com) 下载最新的 3.x.x 版本。提取压缩包并复制以下文件夹：\n\
  \n```\n- /css\n- /fonts\n- /js\n```\n\n创建一个任何你喜欢的名称的项目文件夹。我给它命名为 `Bootstrap_demos`。将上述文件夹粘贴到此项目文件夹中。\n\
  \n现在打开你最喜欢的 HTML 编辑器（我个人推荐 [Sublime Text](http://www.sublimetext.com/)），创建一个名为 `index.html`\
  \ 的新文件，并将以下代码段输入其中：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
  \    <title>My First Bootstrap Application</title>\n  </head>\n  <body>\n\n  </body>\n\
  </html>\n```\n\n这是我们第一个 Bootstrap 应用的简单 HTML 结构。\n\n我们的项目目录现在应该像图 1.6 所示。\n\n![Our\
  \ initial project folder structure](img/ch1Image11.png)\n\n图 1.6 我们的初始项目文件夹结构\n\n\
  现在让我们在我们的 HTML 文件中引入 Bootstrap。首先，我们需要引入 Bootstrap 的 CSS 文件。打开 `/css` 文件夹，你应该能看到一个名为\
  \ `bootstrap.css` 的文件。这是 Bootstrap 主 CSS 文件。\n\n### 注意：什么是 bootstrap.min.css？\n\n\
  还有另一个名为 `bootstrap.min.css` 的文件，它是 `bootstrap.css` 的 `minified`（压缩）版本。它之所以被称为压缩版是因为它没有空格和注释，这减少了文件的大小。它将在你的项目完成并准备上线时使用。\n\
  \n将我们的 CSS 文件链接到 `index.html` 中。在 `<head>` 标签内 `<title>` 标签下方放置以下内容：\n\n```html\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n```\n\n\
  Bootstrap 需要 jQuery 才能使其 JavaScript 组件工作。访问 [jquery.com](http://jquery.com/) 下载\
  \ jQuery 1.11.0 版本。Bootstrap 支持 Internet Explorer 8 及以上版本。如果你下载 jQuery 2 版本，IE8+\
  \ 将无法正常运行，因为 jQuery 在 2 及以上版本中已正式放弃了对 IE8 的支持。因此，需要 jQuery 1.11.0，即 jQuery 1 的最新版本。\n\
  \n下载 `jquery.js` 文件后，将其粘贴到项目目录的 `/js` 文件夹中。接下来，我们将使用以下代码将其链接到 `index.html`：\n\n\
  ```html\n<script src=\"js/jquery.js\"></script>\n```\n\n建议将 jQuery 插入到 `<body>`\
  \ 标签内部而不是 `<head>` 标签。这样 jQuery 会在所有 HTML 内容加载后加载，从而缩短页面加载时间。\n\n现在我们必须引入 Bootstrap\
  \ 的 JavaScript 文件：\n\n```html\n<script src=\"js/bootstrap.js\"></script>\n```\n\n\
  `index.html` 现在应该像这样：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
  \    <title>My First Bootstrap Application</title>\n    <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"css/bootstrap.css\">\n  </head>\n  <body>\n\n       \
  \ <script src=\"js/jquery.js\"></script>\n        <script src=\"js/bootstrap.js\"\
  ></script>\n  </body>\n</html>\n```\n\n为了让 Bootstrap 完全兼容每种设备，我们需要包含一些必要的 meta 标签。\n\
  \n首先，我们应该告诉浏览器我们的网站包含 Unicode 字符集中的字符，它是 ASCII 字符集的超集。这是通过以下 meta 标签实现的：\n\n```html\n\
  <meta charset=\"utf-8\">\n```\n\n有时，Internet Explorer 可能在 `compatibility 模式` 下运行。使用以下代码段将强制\
  \ IE 使用最新的渲染引擎来渲染我们的网站。这将防止我们的网站崩溃，因为旧的渲染引擎不支持 CSS 的所有属性：\n\n```html\n<meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n```\n\n接下来，我们将网站占据浏览器窗口内的所有可用空间，无论是平板、手机还是桌面屏幕。我们告诉浏览器将我们的应用程序缩放到可用窗口空间的大小：\n\
  \n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n```\n\n代码中的 `initial-scale=1` 意味着将其缩放为 100%。\n\n现在我们的 `index.html` 应该像这样：\n\n\
  \n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, \n↵initial-scale=1\">\n\n    <title>My\
  \ First Bootstrap Application</title>\n    <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"css/bootstrap.css\">\n  </head>\n  <body>\n\n        <script src=\"js/jquery.js\"\
  ></script>\n        <script src=\"js/bootstrap.js\"></script>\n  </body>\n</html>\n\
  ```\n\n在上面的代码中，我们还需要处理最后一步步骤。Bootstrap 3 使用了许多 HTML5 元素和 CSS3 属性，这些属性在 Internet\
  \ Explorer 8 中无法工作。我们现在必须添加一些脚本，这些脚本只有在 IE8 中打开网站时才会被调用，从而为其提供 HTML5 和 CSS3 支持。这些脚本是\
  \ `html5shiv.js` 和 `respond.js`：\n\n```html\n<!--[if lt IE 9]>\n      <script src=\"\
  https://oss.maxcdn.com/libs/html5shiv/\n↵3.7.0/html5shiv.js\"></script>\n      <script\
  \ src=\"https://oss.maxcdn.com/libs/respond.js/\n↵1.4.2/respond.min.js\"></script>\n\
  \    <![endif]-->\n```\n\n### 注意：使用这些脚本\n\n你不需要下载 `html5shiv.js` 和 `respond.js`。你可以直接链接到它们的\
  \ CDN，如上所示。\n\n现在，我们的 `index.html` 页面已经完成了。它看起来应该是这样：\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ \n↵initial-scale=1\">\n\n    <title>My First Bootstrap Application</title>\n \
  \   <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n \
  \   <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
  ↵3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/\n\
  ↵respond.js/1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n\
  \        <h1>Hello World!</h1>\n\n        <script src=\"js/jquery.js\"></script>\n\
  \        <script src=\"js/bootstrap.js\"></script>\n  </body>\n</html>\n```\n\n\
  我包含了一个带有“Hello World!”的 `h1` 元素。现在请继续在你的浏览器中加载该页面。你应该能看到看到用漂亮字体显示的“Hello World!”。\n\
  \n如果你正在使用 Google Chrome，你有一个简单的方法可以检查所有的 JavaScript 和 CSS 文件是否正确加载。在页面上点击右键并选择“检查元素”。点击\
  \ `Console`（控制台）标签页，如果没有显示任何错误，说明所有 JavaScript 文件已正确加载。接下来，进入 `Network`（网络）标签页；如果没有\
  \ 404 错误，说明所有 CSS 文件已正确链接。\n\n![在 Chrome 中检查文件是否正确加载](img/ch1Image12.png)\n\n图 1.7.\
  \ 在 Chrome 中检查文件是否正确加载\n\n最后，我们完成了 Bootstrap 项目的设置。在本书的其余部分我们将使用类似的设置。\n\n# 第 2\
  \ 章\n\n## Bootstrap 网格系统\n\n在本章中，我们将发现 Bootstrap 最重要的功能之一：`grid system`（网格系统）。我们将学习网格系统是如何工作的，以及我们如何在我们的中使用中使用它。我们还将创建一些示例网站布局以便更好地理解它。\n\
  \n### 什么是网格系统？\n\n`grid system` 允许我们妥妥地安置网站内容。它将屏幕分为多个行和列，这些列可以创建各种类型的布局。一旦定义了行和列，我们就可以决定将\
  \ HTML 元素放置在什么位置。\n\nBootstrap 的网格系统将屏幕分为列——每行最多 12 列。列的宽度根据其显示的屏幕尺寸而变化。因此，Bootstrap\
  \ 的网格系统是 `responsive`（响应式的），当浏览器窗口大小变化时，列会动态调整自身的大小。你可以根据设计需求创建无限数量的行。这些行和列的交叉点形成了一个矩形网格，用于包含网站内容。\n\
  \n例如，在图 2.1 中，我创建了一行，然后使用网格系统将其划分为 12 列。我更改了每一列的背景颜色以使它们区分开。这里的每一列都由一个数字表示。\n\n\
  ![显示 12 列网格的示例页面](img/ch2Image1.png)\n\n图 2.1. 显示 12 列网格的示例页面\n\n### 构建基础网格\n\n\
  在这一节中，我们将使用 Bootstrap 的网格系统创建第一个网站布局。我们将使用在上一章中创建的相同 Bootstrap 设置 `Bootstrap_demos`。复制\
  \ `Bootstrap_demos` 文件夹内的所有文件。然后创建一个名为 `chapter_2` 的新文件夹并将这些文件粘贴到里面。\n\n现在打开 `index.html`，将页面标题改为“Bootstrap\
  \ Grid System”，并从 `body` 中移除 `h1` 标签。我们现在应该有一个像这样的基础 HTML 页面：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ \n↵initial-scale=1\">\n\n    <title>Bootstrap Grid System</title>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if lt IE\
  \ 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n↵3.7.0/html5shiv.js\"\
  ></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n↵1.4.2/respond.min.js\"\
  ></script>\n    <![endif]-->\n\n  </head>\n  <body>\n        <!-- Body 内容放在这里 -->\n\
  \n        <script src=\"js/jquery.js\"></script>\n        <script src=\"js/bootstrap.js\"\
  ></script>\n  </body>\n</html>\n```\n\nBootstrap 建议我们将所有的行和列放在一个容器（container）中，以确保正确的对齐和内边距。Bootstrap\
  \ 中有两种类型的容器类：`container` 和 `container-fluid`。前者在浏览器窗口中创建一个固定宽的容器，而后者创建一个全宽的流体容器。固定宽度容器被设计为显示在屏幕中央，忽略掉两侧的多余空间。因此，将所有内容封装在容器内是一个良好的做法。\n\
  \n我们将在演示中使用固定宽的 `container`。让我们在 HTML 页面中创建一个容器：\n\n```html\n<div class=\"container\"\
  >\n</div>\n```\n\n接下来，我们将在容器内部创建一个行。一旦定义了行，我们就可以开始创建列。Bootstrap 有一个用于创建行的类 `row`：\n\
  \n```html\n<div class=\"container\">\n    <div class=\"row\">\n    </div>\n</div>\n\
  ```\n\n你 你可以创建无限数量的行，但它们必须放置在容器内。为了更好的效果，建议使用一个包含所有行的单个容器。\n\n在 Bootstrap 中，列的创建是通过指定你希望跨越\
  \ 12 个可用列中的多少列来实现的。假设我们想要单列。它应该跨越所有 12 个可用列。为此，我们将使用类 `col-xs-12`，其中数字 `12` 指定了跨越的列数（现在你可以忽略类名中的\
  \ `xs` 词；我们稍后会讨论）。\n\n同样，为了在行中创建两个等宽的列，我们将为每一列使用 `col-xs-6` 类。这告诉 Bootstrap 我们想要两个跨越\
  \ 6 个 Bootstrap 列的列，如下：\n\n```html\n<div class=\"container\">\n    <div class=\"\
  row\">\n        <div class=\"col-xs-6\">\n            <h4>Column 1</h4>\n      \
  \  </div>\n        <div class=\"col-xs-6\">\n            <h4>Column 2</h4>\n   \
  \     </div>\n    </div>\n</div>\n```\n\n结果可以见图 2.2。\n\n![我们的两个等宽的列](img/ch2Image2-1.png)\n\
  \n图 2.2. 我们的两个等宽的列\n\n为了让列更加清晰，让我们为每一列分配一个背景颜色。我们将在项目的 CSS 文件夹创建一个名为 `styles.css`\
  \ 的新 CSS 文件。这不是一个标准文件名，你可以随意命名。接下来，我们将在 `index.html` 中通过 `head` 元素内的 `link` 元素链接此文件：\n\
  \n\n\n\n\n```\n<link href=\"css/styles.css\" rel=\"stylesheet\">\n```\n\n让我们在这个文件中加入一些\
  \ CSS，让每列都具有不同的背景颜色：\n\n```\n.col1{\n    background: #5C7080;\n}\n\n.col2{\n   \
  \ background: #6BC0FF;\n}\n```\n\n我们还必须在标记中添加 `col1` 和 `col2` 类，以便列能够选取它们各自对应的 CSS\
  \ 样式。更新后的标记如下：\n\n```\n<div class=\"container\">\n    <div class=\"row\">\n    \
  \    <div class=\"col-xs-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n\
  \        <div class=\"col-xs-6 col2\">\n            <h4>Column 2</h4>\n        </div>\n\
  \    </div>\n</div>\n```\n\n![一个具有背景颜色样式的双列布局图-2](img/ch2Image2-2.png)\n\n图 2.3.\
  \ 具有背景颜色样式的双列布局\n\n但是类 `col-xs-6` 中的 `xs` 代表什么？Bootstrap 有四种类前缀用于为不同尺寸的显示创建列：\n\n\
  1. `col-xs` 用于超小显示（屏幕宽度 < 768px）\n2. `col-sm` 用于较小显示（屏幕宽度 ≥ 768px）\n3. `col-md`\
  \ 用于中等显示（屏幕宽度 ≥ 992px）\n4. `col-lg` 用于大显示（屏幕宽度 ≥ 1200px）\n\n当我们指定类 `col-xs-12` 时，意味着该元素在超小屏幕上应该跨越所有\
  \ 12 个可用的 Bootstrap 列。但更大的显示器呢？在上面的代码中，我们没有指定 `div` 在较大屏幕类型上的行为。幸运的是，Bootstrap 将自动遵循为最小屏幕尺寸指定的布局。因此，在这段代码中，我们的\
  \ `div` 在所有类型的显示中都会跨越 12 列。\n\n让我们检查以下标记：\n\n```\n<div class=\"container\">\n  \
  \  <div class=\"row\">\n        <div class=\"col-xs-12 col-sm-6 col1\">\n      \
  \      <h4>Column 1</h4>\n        </div>\n        <div class=\"col-xs-12 col-sm-6\
  \ col2\">\n            <h4>Column 2</h4>\n        </div>\n    </div>\n</div>\n```\n\
  \n在这段代码中，我们使用 `col-xs-12` 类用于超小显示，使用 `col-sm-6` 类用于小尺寸显示。因此，在超小尺寸显示中，每一列将占据所有 12\
  \ 个可用的 Bootstrap 列，表现为列的堆叠。然而在较小的显示器上，它们将各占据六个 Bootstrap 列，以实现如图 2.4 所示的双列布局。\n\n\
  ![较小屏幕上的布局图-3](img/ch2Image3-1.png)\n\n图 2.4. 较小屏幕上的布局\n\n让我们在之前的代码中再添加一行列。我们将复制用于代码中创建行时使用的相同标记。我们布局中两行四列的最终标记如下：\n\
  \n```\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
  col-xs-12 col-sm-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n    \
  \    <div class=\"col-xs-12 col-sm-6 col2\">\n            <h4>Column 2</h4>\n  \
  \      </div>\n    </div>\n    <div class=\"row\">\n        <div class=\"col-xs-12\
  \ col-sm-6 col3\">\n            <h4>Column 3</h4>\n        </div>\n        <div\
  \ class=\"col-xs-12 col-sm-6 col4\">\n            <h4>Column 4</h4>\n        </div>\n\
  \    </div>\n</div>\n```\n\n我添加了两个新类 `col3` 和 `col4`，给我们的列提供不同的背景颜色：\n\n```\n.col3{\n\
  \    background: #E8AA4C;\n}\n\n.col4{\n    background: #FF384E;\n}\n```\n\n这里是结果，如图\
  \ 2.5 所示。\n\n![两行四列布局图-4](img/ch2Image4-1.png)\n\n图 2.5. 两行四列布局\n\n## 案例研究：创建动态布局\n\
  \n让我们看看如何将网格系统付诸实践，创建一个根据查看设备尺寸进行调整的动态布局。\n\n假设我们必须使用 Bootstrap 框架创建一个博客布局。我们得到了如图\
  \ 2.6 所示的桌面端显示线框。\n\n![桌面端显示时网站的线框图](img/ch2wireframe-desktop.png)\n\n图 2.6. 桌面端显示时网站的线框图\n\
  \n在线框图中，我们有一个跨越整个网站宽度的页眉。然后，我们有一个包含博客文章的三列布局。如果在平板电脑（竖屏模式）上查看相同的布局，它看起来会非常笨拙。因此，我们为平板模式重新设计了线框图，如图\
  \ 2.7 所示。\n\n![平板端显示时网站的线框图](img/ch2wireframe-tablet.png)\n\n图 2.7. 平板端显示时网站的线框图\n\
  \n在这个设计中，我们看到页眉看起来与桌面模式相同。下方的文章现在包含在双列布局中而不是三列。接下来，我们需要在移动设备上查看同一个网站。移动端显示的线框图如图\
  \ 2.8 所示。\n\n![移动端显示时网站的线框图](img/ch2wireframe-mobile.png)\n\n\n\n\n\n```html\n<div\
  \ class=\"container\">\n    <div class=\"row\">\n        <div class=\"col-md-12\
  \ text-center\">\n            <h1>My First Bootstrap Blog</h1>\n        </div>\n\
  \    </div>\n\n    <hr>\n\n    <div class=\"row\">\n        <div class=\"col-md-4\"\
  >\n\n        </div>\n        <div class=\"col-md-4\">\n\n        </div>\n      \
  \  <div class=\"col-md-4\">\n\n        </div>\n    </div>\n</div>\n```\n\n我还在两行之间使用了一个\
  \ `<hr>` 标签，在页眉之后画了一条水平线。\n\n现在是时候为列填充一些占位内容了。为了这个目的，我们将使用 `<h3>` 标签和`<p>` 标签配合\
  \ `lorem ipsum` 文本：\n\n```html\n<div class=\"container\">\n    <div class=\"row\"\
  >\n        <div class=\"col-md-12 text-center\">\n            <h1>My First Bootstrap\
  \ Blog</h1>\n        </div>\n    </div>\n\n    <hr>\n\n    <div class=\"row\">\n\
  \        <div class=\"col-md-4\">\n            <h3>Post Title 1</h3>\n         \
  \   <p>Lorem ipsum dolor sit amet, consectetur adipisicing \nelit, sed do eiusmod\
  \ tempor incididunt ut labore et dolore magna \naliqua. </p>\n        </div>>\n\
  \        <div class=\"col-md-4\">\n            <h3>Post Title 2</h3>\n         \
  \   <p>Lorem ipsum dolor sit amet, consectetur adipisicing \nelit, sed do eiusmod\
  \ tempor incididunt ut labore et dolore magna \naliqua. </p>\n        </div>>\n\
  \        <div class=\"col-md-4\">\n            <h3>Post Title 3</h3>\n         \
  \   <p>Lorem ipsum dolor sit amet, consectetur adipisicing \nelit, sed do eiusmod\
  \ tempor incididunt ut labore et dolore magna \naliqua. </p>\n        </div>>\n\
  \    </div>\n</div>\n```\n\n`blog.html` 页面看起来就像 图 2.9 所示。\n\n![Our incomplete blog\
  \ layout on desktop displays](img/ch2Image5-1.png)\n\n图 2.9. 我们在桌面显示上的不完整博客布局\n\n\
  根据桌面显示的线框图，我们还剩下三列博客文章。这次，我们不会为接下来的三列创建一个单独的 `row`。相反，我们将直接将这些列追加到之前代码中现有的 `row`\
  \ 中。你可能会奇怪，我们如何在一个单行中拥有 24 列（六列，每列跨越 4 个 Bootstrap 列）？嗯，Bootstrap 在单行中只允许 12 个 Bootstrap\
  \ 列。如果我们尝试超过这个限制，剩余的列将调整到下一行。这一新行将再次具有 12 个 Bootstrap 列的容量。通过这样，我们可以将所有的博客文章列合并到一个\
  \ `row` 中。\n\n让我们继续更新标记标记，添加三个新列：\n\n```html\n<div class=\"container\">\n    <div\
  \ class=\"row\">\n        <div class=\"col-md-12 text-center\">\n            <h1>My\
  \ First Bootstrap Blog</h1>\n        </div>\n    </div>\n\n    <hr>\n\n    <div\
  \ class=\"row\">\n        <div class=\"col-md-4\">\n            <h3>Post Title 1</h3>\n\
  \            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div\
  \ class=\"col-md-4\">\n            <h3>Post Title 2</h3>\n            <p>Lorem ipsum\
  \ dolor sit amet ... </p>\n        </div>>\n        <div class=\"col-md-4\">\n \
  \           <h3>Post Title 3</h3>\n            <p>Lorem ipsum dolor sit amet ...\
  \ </p>\n        </div>>\n        <div class=\"col-md-4\">\n            <h3>Post\
  \ Title 4</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n\
  \        <div class=\"col-md-4\">\n            <h3>Post Title 5</h3>\n         \
  \   <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div class=\"\
  col-md-4\">\n            <h3>Post Title 6</h3>\n            <p>Lorem ipsum dolor\
  \ sit amet ... </p>\n        </div>>\n    </div>\n</div>\n```\n\n最后，我们将桌面线框图转换成了\
  \ HTML 页面，如 图 2.10 所示。\n\n![Our complete blog layout on desktop displays](img/ch2Image5-2.png)\n\
  \n图 2.10. 我们在桌面显示上的完整博客布局\n\n### 为平板电脑设计\n\n现在让我们修改代码以实现平板的线框布局。与桌面显示不同，平板可以用两种格式查看：**竖屏（Portrait）**和**横屏（Landscape）**。平板的横屏视图被认为是中等尺寸显示器（**屏幕宽度\
  \ ≥ 992px**），我们已经使用 `col-md-*` 类处理了这个问题。现在我们只剩下竖屏视图，这是一种小尺寸显示器。这可以使用 `col-sm-*`\
  \ 类来实现。\n\n由于我们必须在较小的显示上实现双列布局，我们必须强制每列跨越 6 个 Bootstrap 列。这样我们在每行中只得到两列（两列 × 6 个\
  \ Bootstrap 列 = 12 个 Bootstrap 列）。但这里只有一行。因此，一旦所有 12 个 Bootstrap 列都被占据，剩余的列将出现在下一行，每次创建一个新行。\n\
  \n让我们继续，向我们的桌面布局代码中添加额外的类 `col-sm-6`：\n\n```html\n<div class=\"container\">\n  \
  \  <div class=\"row\">\n        <div class=\"col-md-12 text-center\">\n        \
  \    <h1>My First Bootstrap Blog</h1>\n        </div>\n    </div>\n\n    <hr>\n\n\
  \    <div class=\"row\">\n        <div class=\"col-md-4 col-sm-6\">\n          \
  \  <h3>Post Title 1</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n \
  \       </div>>\n        <div class=\"col-md-4 col-sm-6\">\n            <h3>Post\
  \ Title 2</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n\
  \        <div class=\"col-md-4 col-sm-6\">\n            <h3>Post Title 3</h3>\n\
  \            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div\
  \ class=\"col-md-4 col-sm-6\">\n            <h3>Post Title 4</h3>\n            <p>Lorem\
  \ ipsum dolor sit amet ... </p>\n        </div>>\n        <div class=\"col-md-4\
  \ col-sm-6\">\n            <h3>Post Title 5</h3>\n            <p>Lorem ipsum dolor\
  \ sit amet ... </p>\n        </div>>\n        <div class=\"col-md-4 col-sm-6\">\n\
  \            <h3>Post Title 6</h3>\n            <p>Lorem ipsum dolor sit amet ...\
  \ </p>\n        </div>>\n    </div>\n</div>\n```\n\n因此，如 图 2.11 所示，我们为平板提供了两种布局：横屏模式下的三列布局和竖屏模式下的双列布局。\n\
  \n![A two-column layout for tablets](img/ch2Image5-3.png)\n\n图 2.11. 平板电脑的双列布局\n\
  \n### 为手机设计\n\n与平板一样，手机也可以横屏和平竖屏模式查看。移动设备的横屏视图利用小尺寸显示器（**屏幕宽度 ≥ 768px**），我们已经使用\
  \ `col-sm-*` 类处理过了。移动设备的竖屏视图采用超小尺寸显示器（**屏幕宽度 < 768px**）。\n\n根据移动设备的线框图，我们必须创建一个单列布局。我希望你已经知道如何在上述代码中实现它。对于超小屏幕，我们必须使用带有\
  \ `col-xs` 前缀的类。在这里，我们希望每个博客文章列占据所有的 12 个 Bootstrap 列，这样每行只有一个博客文章。我们的类将是 `col-xs-12`，让我们继续将此类添加到我们的代码中：\n\
  \n\n\n\n\n```html\n<div class=\"container\">\n    <div class=\"row\">\n        <div\
  \ class=\"col-md-12 text-center\">\n            <h1>My First Bootstrap Blog</h1>\n\
  \        </div>\n    </div>\n    <hr>\n    <div class=\"row\">\n        <div class=\"\
  col-md-4 col-sm-6 col-xs-12\">\n            <h3>Post Title 1</h3>\n            <p>Lorem\
  \ ipsum dolor sit amet ... </p>\n        </div>\n        <div class=\"col-md-4 col-sm-6\
  \ col-xs-12\">\n            <h3>Post Title 2</h3>\n            <p>Lorem ipsum dolor\
  \ sit amet ... </p>\n        </div>\n        <div class=\"col-md-4 col-sm-6 col-xs-12\"\
  >\n            <h3>Post Title 3</h3>\n            <p>Lorem ipsum dolor sit amet\
  \ ... </p>\n        </div>\n        <div class=\"col-md-4 col-sm-6 col-xs-12\">\n\
  \            <h3>Post Title 4</h3>\n            <p>Lorem ipsum dolor sit amet ...\
  \ </p>\n        </div>\n        <div class=\"col-md-4 col-sm-6 col-xs-12\">\n  \
  \          <h3>Post Title 5</h3>\n            <p>Lorem ipsum dolor sit amet ...\
  \ </p>\n        </div>\n        <div class=\"col-md-4 col-sm-6 col-xs-12\">\n  \
  \          <h3>Post Title 6</h3>\n            <p>Lorem ipsum dolor sit amet ...\
  \ </p>\n        </div>\n    </div>\n</div>\n```\n\n![小屏幕上的单列布局](img/ch2Image5-4.png)\n\
  \n图 2.12. 小屏幕上的单列布局\n\n最后，我们得到了了一个完整的响应式 HTML 页面，它可以在任何显示设备上运行——单列布局如图 2.12 所示。你甚至可以使用如[Google\
  \ Drive 硬盘](https://drive.google.com/)等免费云端服务托管此项目，然后在实际平板电脑或移动设备上进行测试；或者手动调整浏览器宽度并观察布局的动态变化。我希望这个案例研究对你理解\
  \ Bootstrap 的网格系统有所帮助。\n\n## 嵌套列\n\n你始终可以在布局中的任何列中创建一组新的 12 列 Bootstrap 列。这可以通过在现有的列中构建一个新的\
  \ `row` 元素，然后用自定义列填充该行来实现。由于我们在这里开始了一个新的 `row`，其内部任何一列都可以跨越 12 个 Bootstrap 列，但该行的宽度将限制在其父级元素的宽度内。\n\
  \n让我们通过一个示例来说说明这一点。在项目中创建一个名为 `nested.html` 的新 HTML 文件。按照最后一章的内容，构建设置好 Bootstrap\
  \ 的 HTML 标记。此外，链接我们在本节之前创建的 CSS 文件 `styles.css`。此新 HTML 文件的标记应该如下：\n\n```html\n\
  <!DOCTYPE html>\n    <html lang=\"en\">\n      <head>\n        <meta charset=\"\
  utf-8\">\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  \
  \      <meta name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\"\
  >\n\n        <title>My First Bootstrap Website</title>\n        <link rel=\"stylesheet\"\
  \ type=\"text/css\" \nhref=\"css/bootstrap.css\">\n\n        <!--[if lt IE 9]>\n\
  \          <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
  ></script>\n          <script src=\"https://oss.maxcdn.com/libs/respond.js/\n1.4.2/respond.min.js\"\
  ></script>\n        <![endif]-->\n\n      </head>\n      <body>\n\n            <script\
  \ src=\"js/jquery.js\"></script>\n            <script src=\"js/bootstrap.js\"></script>\n\
  \      </body>\n    </html>\n```\n\n让我们在其内部创建一个 `container` 和一个 `row`：\n\n```html\n\
  <div class=\"container\">\n    <div class=\"row\">\n\n    </div>\n</div>\n```\n\n\
  针对中等显示器，我们将构建一个双列布局。到目前，我们知道要创建一个双列布局，我们应该让列跨越 6 个 Bootstrap 列。因此，生成此类列的类将是 `col-md-6`。让我们在之前的标记中添加两列：\n\
  \n```html\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
  col-md-6 col1\">\n            <h3>Column 1</h3>\n        </div>\n        <div class=\"\
  col-md-6 col2\">\n            <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n\
  ```\n\n在此代码中，我们还从 `styles.css` 文件引入了两个类：`col1` 和 `col2`。这两个类将帮助我们为列提供一些背景颜色。现在，HTML\
  \ 页面应该像图 2.13 中的截图所示。\n\n![简单的双列布局](img/ch2Image6-1.png)\n\n图 2.13. 简单的双列布局\n\n\
  现在让我们嵌套第一列“Column 1”并在其内部开始一个新行：\n\n```html\n<div class=\"container\">\n    <div\
  \ class=\"row\">\n        <div class=\"col-md-6 col1\">\n            <h3>Column\
  \ 1</h3>\n            <!-- 嵌套开始 -->\n            <div class=\"row\">\n\n       \
  \     </div>\n        </div>\n        <div class=\"col-md-6 col2\">\n          \
  \  <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n```\n\n既然我们有一个新的 `row`，让我们再次在其形成两列：\n\
  \n```html\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
  col-md-6 col1\">\n            <h3>Column 1</h3>\n            <!-- 嵌套开始 -->\n   \
  \         <div class=\"row\">\n                <div class=\"col-md-6 col3\">\n \
  \                   <h3>Column 4</h3>\n                </div>\n                <div\
  \ class=\"col-md-6 col4\">\n                    <h3>Column 5</h3>\n            \
  \    </div>\n            </div>\n        </div>\n        <div class=\"col-md-6 col2\"\
  >\n            <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n```\n\n正如图\
  \ 2.14 所示，两个新列现在被放置在第一列中。在这里我使用了 `styles.css` 中的 `col3` 和 `col4` 类来应用背景颜色。\n\n![嵌套的双列布局](img/ch2Image6-2.png)\n\
  \n图 2.14. 嵌套的双列布局\n\n嵌套列的能力在创建复杂布局时非常有用。你也可以在其内部嵌套行并生成一组新的列。\n\n## 列偏移\n\n偏移（Offsetting）是\
  \ Bootstrap 网格系统的另一个强大功能。它通常用于增加列的左边距。例如，如果你有一列应该在三个 Bootstrap 列之后出现，你可以使用偏移功能。\n\
  \n可用的偏移类有：\n\n* `col-xs-offset-*`\n* `col-sm-offset-*`\n* `col-md-offset-*`\n* `col-lg-offset-*`\n\
  \n假设我们要在小屏幕显示上将一列右移三个 Bootstrap 列，我们可以使用 `\"col-xs-offset-3\"`，例如：\n\n```html\n\
  <div class=\"row\">\n    <div class=\"col-xs-6 col-xs-offset-3 col1\">\n       \
  \ <h1>Hello Learnable!</h1>\n    </div>\n</div>\n```\n\n此代码将产生一个跨越六列的列，向右偏移三列，如图\
  \ 2.15 所示。\n\n![偏移列](img/ch2Image7.png)\n\n图 2.15. 偏移列\n\n### 提示：居中你的列\n\n注意，该列的左右都有三列的间隙。这是屏幕中央居中\
  \ 50% 宽度列的最佳方法之一。\n\n## 手动重排网格\n\n我们还可以无视代码中编写的顺序来重新排列列。如果我们先写一个 `col-md-9` 列，然后是\
  \ `col-md-3` 列，我们可以在 HTML 页面渲染时轻松地交换它们的位置。这是通过 Bootstrap 的 `pull` 和 `push` 类实现的。\n\
  \n如 `col-xs-pull-*` 和 `col-xs-push-*` 之类的类分别向左或向右移动特定数量的列。例如：\n\n```html\n<div class=\"\
  row\">\n    <div class=\"col-xs-9 col-xs-push-3\">\n        <h1>Pushed Column</h1>\n\
  \    </div>\n    <div class=\"col-xs-3 col-xs-pull-9\">\n        <h1>Pulled Column</h1>\n\
  \    </div>\n</div>\n```\n\n\n\n\n\n在代码中，`col-xs-9` 列被向右推了三列，因此它向右移动了。`col-xs-3`\
  \ 列也被向左拉了九列。因此，在浏览器中查看时，它们似乎交换了原始位置。\n\n根据屏幕尺寸，`push` 和 `pull` 类有几种变体：\n\n* `col-xs-pull-*`\
  \ 和 `col-xs-push-*` 用于超小尺寸屏屏\n* `col-sm-pull-*` 和 `col-sm-push-*` 用于较小屏幕\n* `col-md-pull-*`\
  \ 和 `col-md-push-*` 用于中等屏幕\n* `col-lg-pull-*` 和 `col-lg-push-*` 用于大屏幕\n\n你可以根据想要\
  \ `pull` 或 `push` 的列数，将 `*` 替换为 1 到 12 之间的整数。\n\n## 总结\n你可以使用 Bootstrap 的网格系统创建几乎任何种类型的网站布局。如果使用得当，你就可以设计出一个可以在几乎任何设备上运行的精美且响应式的网站。嵌套、偏移和重新排序等功能也使其更加强大。有关\
  \ Bootstrap 网格系统的更多文档，请参考 `http://getbootstrap.com/#grid`。\n\n# 第 3 章：探索组件本身\n在本章中，我们将开始使用\
  \ Bootstrap 中最实用的 HTML 组件。按钮、页眉、导航菜单和评论系统等组件在网站上非常常见。通过这些组件，Bootstrap 帮助我们快速轻松地为网站添加此类功能。\n\
  \n## 页面组件\n页面组件构成了页面的基本结构。页面组件的示例包括页眉、显示重要信息的突出面板（panels）、嵌套评论、图像缩略图和堆叠链接列表。这些都是流行的组件，从零开始开发需要很长时间。在本节中，我们将重点关注使用\
  \ Bootstrap 推荐的标记和类来创建可重用的 HTML 组件。\n\n### 页头\n给页面一个标题或题目并不是难事。任何人都可以使用 `<h1>` 标签在网页上显示标题；然而，要用默认样式整齐地显示标题、在周围留出适当间距并在旁边带一个小副标题可能会花费意想不到的时间。幸运的是，Bootstrap\
  \ 创建了一个作为页头的 HTML 组件，为我们处理了所有这些任务。在查看页头标记之前，我们先设置整个过程中将使用的项目。\n\n首先，复制 Bootstrap\
  \ 文件夹的内容并将其粘贴到名为 `Chapter_3` 的新文件夹中。打开 `index.html` 文件并移除 `<body>` 标签内部存在的 `<h1>`\
  \ 标签。现在，让我们添加页头的标记：\n\n```\n<div class=\"page-header\">\n      <h1>Chapter 3</h1>\n\
  </div>\n```\n\n每当你想使用 `<h1>` 标签作为页面标题时，都可以将其封装在具有 `page-header` 类的 `<div>` 元素中，以创建一个页头。现在，让我们在浏览器中查看\
  \ `index.html`。它看起来应该像图 3.1 (#ch03.html_header \"Figure 3.1. 一个基础页头\")。\n\n![一个页头](img/ch3Image1.png)\n\
  图 3.1. 一个基础页头\n\n如你所见，页头组件除了为 `<h1>` 添加了一个细灰框外，没有添加任何额外的样式。它只带有添加副标题的样式，我们很快就会看到。在这里看到的一个小问题是页头贴住了浏览器的左边框。这是因为我们还没有为页面的所有内容定义一个容器（container）。所以，让我们创建一个全局容器：\n\
  \n```\n<div class=\"container\">\n\n</div>\n```\n\n现在将页头标记放在容器 `<div>` 内部。我们的最终标记应该看起来像这样：\n\
  \n```\n<div class=\"container\">\n    <div class=\"page-header\">\n          <h1>Chapter\
  \ 3</h1>\n    </div>\n</div>\n```\n\n结果可以在图 3.2 中看到 (#ch03.html_header \"Figure\
  \ 3.2. 容器中的页头\")。![容器中的页头](img/ch3Image2.png)\n图 3.2. 容器中的页头\n\n如果你想在页面标题旁边添加副标题，可以将其放在我们之前使用的同一个\
  \ `<h1>` 标签内。确保将副标题封装在 `<small>` 标签中，如下所示：\n\n```\n<div class=\"container\">\n \
  \   <div class=\"page-header\">\n          <h1>Chapter 3 <small>Exploring Components</small></h1>\n\
  \    </div>\n</div>\n```\n\n效果可以在图 3.3 中看到 (#ch03.html_header \"Figure 3.3. 带有副标题的页头\"\
  )。![带有副标题的页头](img/ch3Image3.png)\n图 3.3. 带有副标题的页头\n\n### 面板 (Panels)\n面板用于在带有圆角的框框内显示文本或图像。以下是创建面板的方法以及它在图\
  \ 3.4 中的样子 (#ch03.html_panelbasic \"Figure 3.4. 一个面板\")：\n\n```\n<div class=\"panel\
  \ panel-default\">\n      <div class=\"panel-heading\">\n        ATTENTION\n   \
  \   </div>\n      <div class=\"panel-body\">\n        Lorem ipsum dolor sit ametnim\
  \ ... \n      </div>\n      <div class=\"panel-footer\">\n        <a href=\"#\"\
  \ class=\"btn-danger btn-sm\">Agree</a> \n        <a href=\"#\" class=\"btn-default\
  \ btn-sm\">Decline</a>\n      </div>\n</div>\n```\n\n![一个面板](img/ch3Image4.png)\n\
  图 3.4. 一个面板\n\n如你所示，面板 `<div>` 被分为三个部分：`panel-heading`、`panel-body` 和 `panel-footer`。这些面板部分每一个都是可选的。面板带有多种颜色选项。在之前的代码中，我通过\
  \ `panel-default` 类使用了默认颜色。你也可以使用其他类来表示不同的颜色：\n\n* `panel-primary` 用于深蓝色\n* `panel-success`\
  \ 用于绿色\n* `panel-info` 用于天蓝色\n* `panel-warning` 用于黄色\n* `panel-danger` 用于红色\n\n\
  ### 媒体对象 (Media Object)\n媒体对象用于创建应包含左对齐或右对齐媒体（图像、视频或音频）以及某些文本内容的组件。它最适合创建诸如评论区、显示推文或显示带有产品详情的功能。\n\
  \n为你的网站设计评论区可能是一项棘的任务。你需要仔细设计一些支持嵌套评论的可重用 HTML 标记。Bootstrap 的媒体对象非常有用，因为你可以非常轻松地创建多层嵌套评论。\n\
  \n创建媒体对象的标记为：\n\n```\n<div class=\"media\">\n    <a class=\"pull-left\" href=\"\
  #\">\n        <img class=\"media-object\" src=\"path/to/image\" alt=\"Syed Faz Rahman\"\
  >\n    </a>\n    <div class=\"media-body\">\n        <h4 class=\"media-heading\"\
  >Awesome piece of work!</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur\
  \ ...</p>\n    </div>\n</div>\n```\n\n\n\n\n\n```\n<div class=\"media\">\n    <a\
  \ class=\"pull-left\" href=\"#\">\n        <img class=\"media-object\" src=\"path/to/image\"\
  \ \nalt=\"Syed Fazle Rahman\">\n    </a>\n    <div class=\"media-body\">\n     \
  \   <h4 class=\"media-heading\">Awesome piece of work!</h4>\n        <p>Lorem ipsum\
  \ dolor sit amet, consectetur ...</p>\n\n        <!-- Second Media Object -->\n\
  \        <div class=\"media\">\n            <a class=\"pull-left\" href=\"#\">\n\
  \                <img class=\"media-object\" src=\"path/to/image\" \nalt=\"Syed\
  \ Fazle Rahman\">\n            </a>\n            <div class=\"media-body\">\n  \
  \              <h4 class=\"media-heading\">Awesome piece of \nwork!</h4>\n     \
  \           <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n            </div>\n\
  \        </div>\n\n    </div>\n</div>\n```\n\n图 3.6 展示了我们的嵌套媒体对象。\n\n![嵌套媒体对象](img/ch3Image6.png)\n\
  \n图 3.6. 嵌套媒体对象\n\n你可以根据需要使用任意层数的嵌套。\n\n### 缩略图 (Thumbnails)\n\n使用 Bootstrap 的 `thumbnails`\
  \ 组件显示图像和视频缩略图轻而易举。它通过应用形成方框的边框，用于展示具有点击吸引力的图像和视频。它还带有一个整洁的悬停效果，通过将边框颜色变为蓝色来突出显示选中的缩略图。\n\
  \n以下是创建缩略图的标记代码：\n\n```\n<a href=\"#\" class=\"thumbnail\">\n    <img src=\"path/to/image\"\
  >\n</a\n```\n\n让我们使用 Bootstrap 的网格系统创建一个四列布局。我们将在每列中放置一张图像，然后对每张图像应用缩略图标记。\n\n正如在上一一章\
  \ 所示，我们将使用 `col-xs-3` 类来创建一个四列布局：\n\n```\n<div class=\"row\">\n    <div class=\"\
  col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\">\n            <img src=\"\
  path/to/image\">\n        </a>\n    </</div>\n    <div class=\"col-xs-3\">\n   \
  \     <a href=\"#\" class=\"thumbnail\">\n            <img src=\"path/to/image\"\
  >\n        </a>\n    </</div>\n    <div class=\"col-xs-3\">\n        <a href=\"\
  #\" class=\"thumbnail\">\n            <img src=\"path/to/image\">\n        </a>\n\
  \    </</div>\n    <div class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\"\
  >\n            <img src=\"path/to/image\">\n        </a>\n    </</div>\n</</div>\n\
  ```\n\n这产生了图 3.7 所示的结果。\n\n![缩略图](img/ch3Image7.png)\n\n图 3.7. 缩略图\n\n尝试将鼠标图标悬停在每张图像上，你会得到一个漂亮的高亮效果。在上述代码中，你可以看到我已锚点标签\
  \ `<a>` 应用了 `thumbnail` 类。你也可以使用 `<div>` 标签代替锚点标签来表示缩略图。\n\n让我们为每个缩略图添加标题。我们只需要在\
  \ `<img>` 标签正下方添加一个类为 `caption` 的额外 `<div>`。我们带有标题的缩略图代码段应该是：\n\n```\n<a href=\"\
  #\" class=\"thumbnail\">\n    <img src=\"path/to/image\">\n    <div class=\"caption\"\
  >\n        <h3>标题在此处输入！</h3>\n    </div>\n</a\n```\n```\n\n如果你为页面上的每个缩略图都应用标题，它将产生与图\
  \ 3.8 相似的结果。\n\n![带标题的缩略图](img/ch3Image8.png)\n\n图 3.8. 带标题的缩略图\n\n你还可以为每个缩略图添加一些摘要和一个“阅读更多”按钮，以链接到网站中的不同页面。为此，我们首先需要将带有\
  \ `thumbnail` 类的链接元素替换为 `<div>` 元素。然后我们在 `caption` `<div>` 内部使用 `<p>` 添加摘要，并在同一个\
  \ `caption` `<div>` 内部添加一个带有“阅读更多”锚点以及 `btn` 和 `btn-primary` 类的链接。在进行这些更改后，我们文章缩略图的最终标记如下：\n\
  \n```\n<div class=\"thumbnail\">\n    <img src=\"images/microsoft.png\">\n    <div\
  \ class=\"caption\">\n        <h3>Microsoft</h3>\n        <p>Lorem ipsum dolor sit\
  \ amet, consectetur ...</p>\n        <p><a href=\"#\" class=\"btn btn-primary\"\
  >阅读更多</a></p>\n    </div>\n</div>\n```\n\n上述代码将产生与图 3.9 相似的结果。\n\n![带有“阅读更多”链接的标题](img/ch3Image9.png)\n\
  \n图 3.9. 带有“阅读更多”链接的标题\n\n### 列表组 (List Group)\n\n尽管如此，列表组可以做的事情不仅仅是构建简单的列表。如果你想创建一个每个项目都包含某些文本内容以及标题的列表，可以使用以下代码：\n\
  \n```\n<a href=\"#\" class=\"list-group-item\">\n    <h4 class=\"list-group-item-heading\"\
  >项目标题</h4>\n    <p class=\"list-group-item-text\">Lorem ipsum dolor sit ...</p>\n\
  </a\n```\n\n我们还可以通过在 `list-group-item` 基础上添加 `list-group-item-*` 类为每个项目应用不同的颜色。它们如下：\n\
  \n- success（成功）\n- info（信息）\n- warning（警告）\n- danger（危险）\n\n例如，在下面的列表的 `list-group-item`\
  \ 类中添加 `list-group-item-success` 将使其它变为浅绿色：\n\n```\n<li class=\"list-group-item\
  \ list-group-item-success\">收件箱</li\n```\n\n### 列表组 (List Group)\n\n当你想要显示链接列表时，根据你的父级\
  \ `<ul>` 或 `<div>`，你应该使用锚点 `<a>` 而不是列表 `<li>`。\n\n我们还可以使用徽章（badge）组件在每个项目旁边显示一个数字。我们稍后会学习更多关于徽章的知识，但现在你可以添加以下代码段：\n\
  \n```\n<span class=\"badge\">14</span>\n```\n\n所以我们更新后的列表现在看起来像图 3.11。\n\n![更新后的列表](img/ch3Image11.png)\n\
  \n图 3.11. 更新后的列表\n\n### 提示 (Tip)：列表\n\n当你想要显示链接列表时，根据你的父级 `<ul>` 或 `<div>`，你应该使用锚点\
  \ `<a>` 而不是列表 `<li>`。\n\n我们还可以使用徽章（badge）组件在每个项目旁边显示一个数字。我们稍后会学习更多关于徽章的知识，但现在你可以添加以下代码段：\n\
  \n```\n<span class=\"badge\">14</span>\n```\n\n\n\n\n\n`Navs`（导航）是一组内联排列的链接，用于导航。我们有选项可以让这组链接以标签页（tabs）或小按钮的形式出现，后者在\
  \ Bootstrap 中被称为 `pills`（药丸状）。我们将首先学习如何创建类似标签的链接，然后继续创建类似药丸的链接。\n\n我们如下创建类似标签的导航链接：\n\
  \n```\n<ul class=\"nav nav-tabs\">\n    <li class=\"active\"><a href=\"#\">About</a></li>\n\
  \    <li><a href=\"#\">Activity</a></li>\n    <li><a href=\"#\">Liked Pages</a></li>\n\
  </ul\n```\n\n这是它们外观的截图（图 3.13）。\n\n![标签式导航](img/ch3Image13.png)\n\n图 3.13. 标签式导航\n\
  \n`nav` 类是标签和药丸共有的。我们添加了 `nav-tabs` 类使我们的导航栏看起来像标签页。\n\n我们通过这种方式创建类似药丸的导航链接（并在 图\
  \ 3.14 中如所示）：\n\n```\n<ul class=\"nav nav-pills\">\n    <li class=\"active\"><a\
  \ href=\"#\">About</a></li>\n    <li><a href=\"#\">Activity</a></li>\n    <li><a\
  \ href=\"#\">Liked Pages</a></li>\n</ul\n```\n\n![药丸式导航](img/ch3Image14-1.png)\n\
  \n图 3.14. 药丸式导航\n\n在这里，我们将 `nav-tabs` 类替换为 `nav-pills` 类，这使得相同的列表看起来像药丸状。\n\n我们还可以通过给它附加额外的类\
  \ `nav-stacked` 来将这些药丸垂直堆叠：\n\n```\n<ul class=\"nav nav-pills nav-stacked\">\n \
  \   <li class=\"active\"><a href=\"#\">About</a></li>\n    <li><a href=\"#\">Activity</a></li>\n\
  \    <li><a href=\"#\">Liked Pages</a></li>\n</ul\n```\n\n图 3.15 显示了一些垂直堆叠的药丸导航。\n\
  \n![堆叠式药丸式导航](img/ch3Image14-2.png)\n\n图 3.15. 堆叠式药丸式导航\n\n## 导航栏 (Navbar)\n\n`Navbar`\
  \ 是 Bootstrap 最有趣的组件之一。初级开发者经常认为构建导航栏是网站开发中最令人畏畏的任务之一。它带来了许多挑战，例如确保与页眉（header）以及正文部分的正确对齐。在导航栏内正确对齐链接、搜索栏和下拉菜单会使工作变得更加。\n\
  \nBootstrap 让创建导航栏变得非常简单。它提供了各种选项来构建所有类型的响应式导航栏，这些导航栏在屏幕尺寸较小时会自动折叠。\n\n我们将首先介绍如何使用\
  \ Bootstrap 创建一个简单的导航栏，然后转向构建更复杂的导航栏。\n\n首先，我们将构建一个 `div` 元素，带有两个类：`navbar` 和 `navbar-default`。这些类对\
  \ Bootstrap 来说非常重要，因为它们标识了在何处应用导航栏的样式和效果：\n\n```\n<div class=\"navbar navbar-default\"\
  >\n</div\n```\n\n接下来，我们在这个 `navbar` 元素内部使用带有类 `container-fluid` 的 `div`。这将包裹导航栏的所有内容并在内部创建一个全宽容器：\n\
  \n```\n<div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\"\
  >\n\n    </div>\n</div\n```\n\n现在，让我们开始在导航栏内部插入其他元素。首先，我们将放置一个带有类 `navbar-header`\
  \ 的 `div`。这将用于网站品牌，例如显示网站名称或 Logo。我们还会在 `navbar-header` 元素内部放置一个隐藏按钮，该按钮仅在导航栏折叠的较小屏幕上可见。此隐藏按钮稍后用于在小屏幕上展开折叠的菜单：\n\
  \n```\n<div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\"\
  >\n        <div class=\"navbar-header\">\n          <button type=\"button\" class=\"\
  navbar-toggle\" \ndata-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n\
  \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
  ></span>\n            <span class=\"icon-bar\"></span>\n          </button>\n  \
  \        <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n  \
  \  </>\n</div\n```\n\n在代码中，我们放置了一个带有类 `navbar-toggle` 的按钮，Bootstrap 用它来激活导航栏的切换行为。它应该有两个自定义数据属性：`data-toggle`\
  \ 和 `data-target`。`data-toggle` 告诉脚本在点击按钮时做什么，而 `data-target` 告诉在点击时切换哪部分内容。在这里，`data-target`\
  \ 属性持有的是我们尚未定义的部分的 id。当点击按钮时，该部分将被切换。按钮内部的 `span` 元素用于显示图标。\n\n我们还定义了一个带有类 `navbar-brand`\
  \ 的 `a` 元素，它承载了我们网站的名称。此时，让我们看看代码在浏览器中渲染的结果，如 图 3.16 所示。\n\n![导航栏](img/ch3Image15.png)\n\
  \n图 3.16. 导航栏\n\n尝试缩小浏览器窗口。你应该看到在导航栏折叠的较小屏幕上显示隐藏按钮，如 图 3.17 所示。\n\n![导航栏显示](img/ch3Image16.png)\n\
  \n图 3.17. 导航栏显示\n\n接下来，我们将创建 `navbar-header` 的兄弟 `div`，它包含我们要放在导航栏内部的内容。我们将给这个元素两个类：`collapse`\
  \ 和 `navbar-collapse`。正如按钮的 `data-toggle` 属性所示，代码现在看起来如下：\n\n```\n<div class=\"\
  navbar navbar-default\">\n    <div class=\"container-fluid\">\n        <div class=\"\
  navbar-header\">\n          <button type=\"button\" class=\"navbar-toggle\" \ndata-toggle=\"\
  collapse\" data-target=\"#mynavbar-content\">\n            <span class=\"icon-bar\"\
  ></span>\n            <span class=\"icon-bar\"></span>\n            <span class=\"\
  icon-bar\"></span>\n          </button>\n          <a class=\"navbar-brand\" href=\"\
  #\">SitePoint</a>\n        </div>\n\n        <div class=\"collapse navbar-collapse\"\
  \ id=\"mynavbar-content\">\n\n        </div>\n    </div>\n</div\n```\n\n现在让我们开始向\
  \ `navbar-collapse` 元素填充我们要放入导航栏的链接组。我们在这里使用带有 `nav` 和 `navbar-nav`  `ul` 元素。这些类用于将链接与导航栏正确对齐：\n\
  \n```\n<div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\"\
  >\n        <div class=\"navbar-header\">\n          <button type=\"button\" class=\"\
  navbar-toggle\" \ndata-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n\
  \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
  ></span>\n            <span class=\"icon-bar\"></span>\n          </button>\n  \
  \        <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n\n\
  \        <div class=\"collapse navbar-collapse\" id=\"mynavbar-content\">\n    \
  \        <ul class=\"nav navbar-nav\">\n                <li class=\"active\"><a\
  \ href=\"#\">Home</a></li>\n                <li><a href=\"#\">About</a></li>\n \
  \               <li><a href=\"#\">Pricing</a></li>\n                <li><a href=\"\
  #\">Contact</a></li>\n                <li><a href=\"#\">Feedback</a></li>\n    \
  \        </ul>\n        </div>\n    </div>\n</div\n```\n\n我们最终带有链接的导航栏应该像 图 3.18\
  \ 所示。\n\n![最终导航栏](img/ch3Image17.png)\n\n图 3.18. 最终导航栏\n\n\n\n\n在本章的后后部分，我们将看到如何在\
  \ Bootstrap 中设计表单。你可以直接将该表单放在 `navbar-collapse` 元素中，以便显示在导航栏内部。\n\n下拉菜单是我们今天看到的任何导航栏的另一个重要组件。你可以按照如下方法将\
  \ `navbar-nav` 列表中的一个 `li` 元素转换为下拉菜单：\n\n```\n<li class=\"dropdown\">\n    <a href=\"\
  #\" class=\"dropdown-toggle\" data-toggle=\"dropdown\">\n↵关于 <b class=\"caret\"\
  ></b></a>\n    <ul class=\"dropdown-menu\">\n        <li><a href=\"#\">董事会成员</a></li>\n\
  \        <li><a href=\"#\">开发团队</a></li>\n        <li><a href=\"#\">设计团队</a></li>\n\
  \        <li><li class=\"divider\"></li>\n        <li><a href=\"#\">投资者</a></li>\n\
  \        <li><a href=\"#\">股东</a></li>\n    </ul>\n</li>\n```\n\n为你想要转换为下拉菜单的 `li`\
  \ 元素添加 `dropdown` 类名。然后，插入一个具有 `dropdown-menu` 类的额外 `ul` 列表来表示子链接。图 3.20 显示了输出结果。\n\
  \n![下拉菜单](img/ch3Image18-2.png)\n\n图 3.20. 下拉菜单\n\n### 面包屑导航\n\n`Breadcrumbs`（面包屑）用于显示当前页面在网站层次结构中的位置。Bootstrap\
  \ 的面包屑组件标记非常简单，可以放在网站的任何地方：\n\n```\n<ol class=\"breadcrumb\">\n  <li><a href=\"\
  #\">首页</a></li>\n  <li><a href=\"#\">关于</a></li>\n  <li class=\"active\">作者</li>\n\
  </ol>\n```\n\n这应该产生如图 3.21 所示的效果。\n\n![面包屑导航](img/ch3Image19.png)\n\n图 3.21. 面包屑导航\n\
  \n## 脱颖而出\n\n有时，我们需要设计一些组件，当它们与其他 HTML 元素一起使用时能够立即吸引访问者的注意力。它们可以是标签、通知图标，或者是巨大的按钮，例如“立即购买”、“立即抢购”等。Bootstrap\
  \ 自带了许多此类组件。让我们来看看一些重要的组件。\n\n### 标签\n\n`Labels`（标签）是在其他组件旁边显示简短文本的最佳方式。有时，我们可能需要在某些其他\
  \ HTML 元素旁边显示如“新”或“立即下载”之类的文本。标签在这些地方非常有用。\n\n要显示标签，你需要向 `span` 和 `i` 等内联 HTML 元素添加\
  \ `label` 类。在这里，我们将使用一个 `span` 在 `h3` 元素旁边显示标签：\n\n```\n<h3>快速上手 Bootstrap <span\
  \ class=\"label label-default\">新\n↵</span></h3>\n```\n\n图 3.22 显示了它的样子。\n\n![标签](img/ch3Image20.png)\n\
  \n图 3.22. 标签\n\n还有一个额外的类 `label-default`，它是必需的，用于告诉 Bootstrap 我们想要使用哪种变体的标签。可用的标签变体包括：\n\
  \n* `label-default`：灰色\n* `label-primary`：深蓝色\n* `label-success`：绿色\n* `label-info`：浅蓝色\n\
  * `label-warning`：橙色\n* `label-danger`：红色\n\n### 按钮\n\n你可以轻松地在 Bootstrap 中创建按钮。你只需要向\
  \ `a`、`button` 或 `input` 元素添加 `btn` 类，即可将其转换为 Bootstrap 中精美的加粗按钮：\n\n```\n<a href=\"\
  #\" class=\"btn btn-primary\">点击这里</a>\n```\n\n图 3.23 显示了它将后的样子。\n\n![Bootstrap\
  \ 按钮](img/ch3Image21.png)\n\n图 3.23. Bootstrap 按钮\n\n按钮有多种颜色选择：\n\n* `btn-default`：白色\n\
  * `btn-primary`：深蓝色\n* `btn-success`：绿色\n* `btn-info`：浅蓝色\n* `btn-warning`：橙色\n\
  * `btn-danger`：红色\n\n还有多种尺寸：\n\n* `btn-lg`：大按钮\n* `btn-sm`：小按钮\n* `btn-xs`：极小按钮\n\
  \n以下是它们的一些用法示例：\n\n```\n<button type=\"button\" class=\"btn btn-primary btn-lg\"\
  >大按钮\n↵</button>\n\n<button type=\"button\" class=\"btn btn-primary\">默认按钮\n↵</button>\n\
  \n<button type=\"button\" class=\"btn btn-primary btn-sm\">小 \n↵按钮</button>\n\n\
  <button type=\"button\" class=\"btn btn-primary btn-xs\">极小 \n↵按钮</button>\n```\n\
  \n还有一些可用的按钮辅助类：\n\n* `btn-block` 将使按钮跨越整个网格\n* `active` 将让按钮看起来像正被点击状态\n* `disabled`\
  \ 将让按钮无法点击并显示为淡化。在使用此类时也应该小心，因为它会阻止 `input` 和 `button` 元素的点击操作，但不会禁用 `a` 元素的点击操作。\n\
  \n### 图标字体\n\n`Glyphicons` 用于显示小图标。它们是轻量级的字体图标，而不是图像。使用 glyphicon 代替小图像有许多优势，包括：\n\
  \n* 减少了对小图像或精灵图（sprites）的多次请求\n* 因为它们是字体图标，可以使用 CSS 属性随时更改它们的颜色和大小\n* 它们在各种显示器上看起来都清晰锐\n\
  \n要使用 glyphicons，你需要使用如下标记：\n\n```\n<span class=\"glyphicon glyphicon-heart\"> </span>\n\
  ```\n\n这段代码显示一个心形图标。glyphicons 集合中的每个图标都有一个唯一的类名。你需要将 `glyphicon-heart` 替换为你想要显示的图标的类名。glyphicon\
  \ 图标列表及其类名可以在 [Bootstrap 官网](http://getbootstrap.com/components/#glyphicons) 找到。\n\
  \nGlyphicon 图标是由名为 Jan Kovařík 的自由开发者设计的，而不是由 Bootstrap 开发人员。尽管大多数图标不是免费的，但 Kovařík\
  \ 向 Bootstrap 团队捐赠了一组图标。你可以在他的网站上找到更多字体图标，[glyphicons.com.](http://glyphicons.com)\n\
  \n### 容器 (Wells)\n\nWells 是一种实用的组件，它将内容封装在一个灰色背景的圆角框内，为内容提供内凹效果。它们可以用于在长文本内容中突出重要事实，例如，博客应用程序中的作者简介框：\n\
  \n```\n<div class=\"well\">\n    <p>Lorem ipsum dolor sit amet, consectetur ...\
  \ </p>\n</div>\n```\n\n这是在图 3.24 中的效果。\n\n![Wells](img/ch3Image24.png)\n\n图 3.24.\
  \ Wells\n\n你可能对内容周围的间距不满意。幸运的是，Bootstrap 有此解决方案！Wells 有三种变体：\n\n1. 默认：仅使用 `well`。\n\
  2. 大间距：同时使用 `well` 和 `well-lg` 类。\n3. 小间距：同时使用 `well` 和 `well-sm` 类。\n\n### 徽章 (Badges)\n\
  \nBadges 与我们已经讨论过的标签类似，但有一个主要区别：标签是矩形的，而徽章更圆。徽章主要用于显示诸如未读项目、通知等数字，而不是文本。\n\nBadges\
  \ 是自折叠组件，这意味着当 badge 内部没有内容时，它在网站上是不可见的。\n\nbadge 组件的标记如下：\n\n```\n<span class=\"\
  badge\">23</span>\n```\n\n更自定义的 badge 用法是：\n\n```\n<a href=\"#\" class=\"btn btn-primary\
  \ btn-lg\">收件箱 \n↵<span class=\"badge\">23</span></a>\n```\n\n你可以在图 3.25 中看到输出。\n\
  \n![徽章](img/ch3Image25.png)\n\n图 3.25. 徽章\n\n## 表单趣玩\n\n表单是我们网站非常重要的一部分。它们用于注册和登录页面、联系和反馈页面、搜索框以及许多地方。\n\
  \nBootstrap 允许你在几分钟内创建各种类型的表单。你还可以使用许多 Bootstrap 良好的 HTML5 表单验证属性。所以，让我们来构建第一个基础表单。\n\
  \n### 基础表单\n\n\n\n\n\n要构建一个表单，我们需要一个带有 `form` 类的 `form` 元素：\n\n```\n<form class=\"\
  form\">\n</form>\n```\n\n对于每个标签（label）和输入字段，我们需要一个带有 `form-group` 类的 `div` 元素。让我们创建一个询问访问者姓名的输入字段：\n\
  \n```\n<form class=\"form\">\n    <div class=\"form-group\">\n        <label for=\"\
  nameField\">Name</label>\n        <input type=\"text\" class=\"form-control\" id=\"\
  nameField\" \n        placeholder=\"Your Name\" />\n    </div>\n</form>\n```\n\n\
  在 `input` 元素上附加 `form-control` 类将使其成为一个全宽元素，如图 3.26 所示。\n\n![A basic form](img/ch3Image26.png)\n\
  \n图 3.26. 基础表单\n\n让我们在表单中填充电子邮件、电话和文本区域（textarea）字段，最后添加一个提交按钮。完整的标记和截图如图 3.27 所示：\n\
  \n```\n<form class=\"form\">\n    <div class=\"form-group\">\n        <label for=\"\
  nameField\">Name</label>\n        <input type=\"text\" class=\"form-control\" id=\"\
  nameField\" \n        placeholder=\"Your Name\" />\n    </div>\n\n    <div class=\"\
  form-group\">\n        <label for=\"emailField\">Email</label>\n        <input type=\"\
  email\" class=\"form-control\" id=\"emailField\" \n        placeholder=\"Your Email\"\
  \ />\n    </div>\n\n    <div class=\"form-group\">\n        <label for=\"phoneField\"\
  >Phone</label>\n        <input type=\"text\" class=\"form-control\" id=\"phoneField\"\
  \ \n        placeholder=\"Your Phone Number\" />\n    </div>\n\n    <div class=\"\
  form-group\">\n        <label for=\"descField\">Description</label>\n        <textarea\
  \ class=\"form-control\" id=\"descField\" placeholder=\"\n        Your Comments\"\
  ></textarea>\n    </div>\n\n    <button type=\"submit\" class=\"btn btn-primary\"\
  >Submit</button> \n    <button type=\"reset\" class=\"btn btn-default\">Reset</button>\n\
  </form>\n```\n\n![Form with added fields](img/ch3Image27.png)\n\n图 3.27. 添加了字段的表单\n\
  \n### 水平表单 (Horizontal Forms)\n\n在之前的表单中，我们将标签显示在上方，然后是输入字段。假设我们想将标签显示在输入字段的侧边。那么我们可以在表单元素内部使用\
  \ Bootstrap 的网格系统，如下：\n\n```\n<form class=\"form-horizontal\">\n    <div class=\"\
  form-group\">\n        <label for=\"nameField\" class=\"col-xs-2\">Name</label>\n\
  \        <div class=\"col-xs-10\">\n            <input type=\"text\" class=\"form-control\"\
  \ id=\"nameField\" \n            placeholder=\"Your Name\" />\n        </div>\n\
  \    </div>\n\n    <div class=\"form-group\">\n        <label for=\"emailField\"\
  \ class=\"col-xs-2\">Email</label>\n        <div class=\"col-xs-10\">\n        \
  \    <input type=\"email\" class=\"form-control\" id=\"emailField\" \n         \
  \   placeholder=\"Your Email\" />\n        </div>\n    </div>\n\n    <div class=\"\
  form-group\">\n        <label for=\"phoneField\" class=\"col-xs-2\">Phone</label>\n\
  \        <div class=\"col-xs-10\">\n            <input type=\"text\" class=\"form-control\"\
  \ id=\"phoneField\" \n            placeholder=\"Your Phone Number\" />\n       \
  \ </div>\n    </div>\n\n    <div class=\"form-group\">\n        <label for=\"descField\"\
  \ class=\"col-xs-2\">Description</label>\n        <div class=\"col-xs-10\">\n  \
  \          <textarea class=\"form-control\" id=\"descField\" \n            placeholder=\"\
  Your Comments\"></textarea>\n        </div>\n    </div>\n\n    <div class=\"col-xs-10\
  \ col-xs-offset-2\">\n        <button type=\"submit\" class=\"btn btn-primary\"\
  >Submit</button> <button type=\"reset\" class=\"btn btn-default\">Reset</button>\n\
  \    </div>\n\n</form>\n```\n\n这应该产生如图 3.28 所示的水平表单。\n\n![A horizontal form](img/ch3Image28.png)\n\
  \n图 3.28. 水平表单\n\n在代码中，根据 Bootstrap 的规则，我们将表单的类从 `form` 更改为 `form-horizontal`。然后给\
  \ `label` 元素添加了 `col-xs-2` 类，使其跨越两个 Bootstrap 列。接下来，我们通过 `col-xs-10` 类将输入字段封装在一个\
  \ `div` 中，该 `div` 跨越十个 Bootstrap 列。\n\n### 内联表单 (Inline Form)\n\n我们还可以创建元素位于单行内的表单。例如是登录表单，其中用户名和密码字段并列放置。内联表单的标记如下：\n\
  \n```\n<form class=\"form-inline\">\n    <div class=\"form-group\">\n        <label\
  \ for=\"email\">Email</label>\n        <input type=\"text\" class=\"form-control\"\
  \ id=\"email\" placeholder=\"Email\">\n    </div>\n\n    <div class=\"form-group\"\
  >\n        <label for=\"password\">Password</label>\n        <input type=\"password\"\
  \ class=\"form-control\" id=\"password\" placeholder=\"Password\">\n    </div>\n\
  \n    <div class=\"form-group\">\n        <button type=\"submit\" class=\"btn btn-primary\"\
  >Sign in</button>\n    </div>\n</form>\n```\n\n这应该产生如图 3.29 所示的内联表单。\n\n![Inline\
  \ form](img/ch3Image28.png)\n\n图 3.29. 内联表单\n\n### 表单中的辅助类 (Helper Classes in Forms)\n\
  \nBootstrap 提供了几个额外的“辅助”（helper）类来帮助显示表单。如果你使用 `disabled` 属性来禁用输入，Bootstrap 已经为其定义了样式。例如，这段代码：\n\
  \n```\n<input class=\"form-control\" type=\"text\" \nplaceholder=\"Disabled input...\"\
  \ disabled>\n```\n\n看起来看起来像图 3.30。\n\n![Disabled form inputs](img/ch3Image29.png)\n\
  \n图 3.30. 禁用的表单输入\n\nBootstrap 还为输入元素提供了三种验证状态：\n\n1.  `has-success`\n\n2.  `has-error`\n\
  \n3.  `has-warning`\n\n这里是验证状态用法的示例：\n\n```\n<div class=\"form-group has-success\"\
  >\n    <label class=\"control-label\" for=\"inputField\">\n    Input with success</label>\n\
  \    <input type=\"text\" class=\"form-control\" id=\"inputField\">\n</div>\n```\n\
  \n应用 `has-success` 将标签文本和边框变为绿色。同样，`has-warning` 将使用暗褐色，而 `has-danger` 将使用深红色。这些\
  \ `has-` 类型的类只会应用于带有 `form-control`、`control-label` 和 `help-block` 类的元素。如果你想在用户向输入字段输入无效值时显示某些自定义文本，请使用带有\
  \ `help-block` 类的 `span` 元素。`help-block` 将出现在相应的输入字段下方。\n\n### 控件尺寸 (Control Sizing)\n\
  \n你可以使用 Bootstrap 的**控件尺寸**（control sizing）类来改变输入元素的高度：\n\n*   `input-lg` 用于制作比默认尺寸更大的输入元素。\n\
  \n*   `input-sm` 用于比默认尺寸更小的输入元素。\n\n这里是它们的一些使用示例：\n\n```\n<input class=\"form-control\
  \ input-lg\" type=\"text\" \nplaceholder=\"Larger Input Field\">\n<input class=\"\
  form-control\" type=\"text\" \nplaceholder=\"Default Input Field\">\n<input class=\"\
  form-control input-sm\" type=\"text\" \nplaceholder=\"Smaller Input Field\">\n```\n\
  \n\n\n这将导致如图 3.31 所示的输出。\n\n![控件大小](img/ch3Image31.png)\n\n图 3.31. 控件大小\n\n## 总结\n\
  \n在本章中，我们学习了一系列开箱即用的可复 Bootstrap 组件。正如你所看到的，Bootstrap 提供了许多不同的组件，起初你可能会发现很难记住这么多不同类型的类；但是，当你遇到困难时，可以随时参考[文档来获取帮助](http://getbootstrap.com/components)。\n\
  \n# 第 4 章## 趣玩与获益的 Bootstrap 插件\n\nJavaScript 是 Web 端*事实上的*脚本语言。精美的图片幻灯片、下拉菜单和弹出框（popovers）只是通过\
  \ JavaScript 结合 CSS 创建的流行网站功能的几个例子。在本章中，我们将查看 Bootstrap 3 为我们提供的一些开箱即用的 JavaScript\
  \ 插件，使我们能够轻松创建此类高级网站功能。\n\n使用 Bootstrap 的 JavaScript 插件有两种不同的方法。第一种方法完全不需要 JavaScript。你只需要遵循推荐的\
  \ HTML 标记即可使用它们。另一种方法则需要一些 JavaScript 知识来初始化和自定义插件。我们将讨论使用插件的两种方法，你可以决定哪种最适合你。\n\
  \n我们在本章中使用的所有插件都包含在 `bootstrap.js` 或 `bootstrap.min.js` 中。如果你遵循了第 1 章，中下载 Bootstrap\
  \ 的说明，你应该会在项目的 `/js` 文件夹中找到 `bootstrap.js`。\n\n在继续之前，让我们为本章设置一个新项目。我们将使用在第 1 章，中创建的相同文件夹\
  \ `Bootstrap_demos`。复制此文件夹中的所有文件并粘贴到名为 `Chapter 4` 的新文件夹中。使用文本编辑器打开 `index.html`。将\
  \ `<title>` 标签内的文本改为“Bootstrap Plugins”。接下来，从 `<body>` 中移除 `<h1>` 标签。最后，`index.html`\
  \ 文件应该如下所示：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
  utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta\
  \ name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\">\n\n    <title>Bootstrap\
  \ Plugins</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\"\
  >\n\n    <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
  3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
  1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n\n  \
  \    <script src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"\
  ></script>\n  </body>\n</</html>\n```\n\n## 扩展功能\n\n想象一下，没有一个没有任何下拉功能的菜单栏。感觉很无聊，对吧？导航栏仅由简单的链接列表组成的日子已经过去了。在本节中，我们将使用一些\
  \ Bootstrap 的 JavaScript 插件，来帮助扩展我们网站现有组件的功能。我们将看到如何向导航栏中添加下拉菜单、点击时切换按钮状态的能力、在显示一段时间后消失的精美警报消息等。\n\
  \n### 下拉菜单\n\n创建下拉菜单的标记如下：\n\n```\n<div class=\"dropdown\">\n    <a data-toggle=\"\
  dropdown\" data-target=\"#\" \nhref=\"http://www.google.com\">\n        Dropdown\
  \ <span class=\"caret\"></span>\n    </a>\n    <ul class=\"dropdown-menu\">\n  \
  \      <li><a href=\"#\">Link 1</a></li>\n        <li><a href=\"#\">Link 2</a></li>\n\
  \        <li><a href=\"#\">Link 3</a></li>\n        <li><a href=\"#\">Link 4</a></li>\n\
  \    </ul>\n<//div>\n```\n\n每个下拉菜单都应该包含两个重要的元素：一个 `<a>` 元素和一个 `<ul>` 元素。在这里，`<ul>`\
  \ 元素默认是隐藏的，`<a>` 元素用于切换下拉菜单。`<a>` 元素有两个必要的 `data-*` 属性：`data-toggle` 和 `data-target`。`data-toggle`\
  \ 属性告诉 Bootstrap 在每次点击链接元素时激活该链接的下拉效果。另一方面，`data-target` 属性用于防止点击链接时页面重定向。在这里提供\
  \ `href` 属性是没有必要的，因为它会被忽略。此链接元素应该包含一些锚点文本，例如“Dropdown”，以及一个向下箭头图标，该图标是使用 `caret`\
  \ 类生成的。\n\n### 注意：Caret 是字体图标（Glyphicon）吗？\n\n`caret` 类不是一个 glyphicon 类。Bootstrap\
  \ 为 `caret` 类编写了特殊的 CSS 样式，以生成这个向下箭头图标。如果你想学习他们是如何做到的，打开 `bootstrap.css` 文件并搜索 `.caret`。你也可以使用\
  \ glyphicon 代替这个箭头：\n\n```\n<span class=\"glyphicon-chevron-down\"></span>\n```\n\
  \n一旦标记放置得当，`<ul>` 应该具有 `dropdown-menu` 类。现在，我们有了一个简单的下拉菜单，它显示的菜单如图 4.1 所示。\n\n![简单的下拉菜单](img/ch4Image1.png)\n\
  \n图 4.1. 简单的下拉菜单\n\n让我们在上一章中创建的标签和菜单上使用下拉插件。这里是胶囊菜单（pills menu）的标记：\n\n```\n<ul\
  \ class=\"nav-pills\">\n  <li class=\"active\"><a href=\"#\">Home</a></a></li>\n\
  \  <li class=\"dropdown\">\n        <a data-toggle=\"dropdown\" data-target=\"#\"\
  \ \nhref=\"http://www.google.com\">\n            Profile <span class=\"caret\"></span>\n\
  \        </a>\n        <ul class=\"dropdown-menu\">\n            <li><a href=\"\
  #\">Link 1</a></li>\n            <li><a href=\"#\">Link 2</a></li>\n           \
  \ <li><a href=\"#\">Link 3</a></li>\n            <li><a href=\"#\">Link 4</a></li>\n\
  \        </ul>\n  </li>\n  <li><a href=\"#\">Messages</a></li>\n</ul>\n```\n\n我们将下拉插件的整个标记放置在第二个\
  \ `<li>` 元素中，并为它分配了 `dropdown` 类。因此，上述带有下拉插件的胶囊菜单看起来应该像图 4.2。\n\n![带有下拉菜单的胶囊菜单](img/ch4Image2.png)\n\
  \n图 4.2. 带有下拉菜单的胶囊菜单\n\n你可以像前面的代码那样，通过注入此下拉插件来配合任何组件。\n\n### 使用 JavaScript 的下拉菜单\n\
  \nBootstrap 的下拉插件也可以使用 JavaScript 使用。与其提供 `data-*` 等自定义属性，你可以使用 JavaScript 对象来传递此类信息。Bootstrap\
  \ 使用 jQuery 库处理所有与 JavaScript 相关的操作。因此，导入 `jquery.js` 对于在 Bootstrap 中使用 JavaScript\
  \ 自定义至关重要。通过 jQuery 触发下拉插件，你需要使用 `dropdown()` 方法：\n\n```\n$().dropdown('toggle');\n\
  ```\n\n我们可以使用此方法在每次页面加载时，将下拉菜单的状态从关闭切换到打开。例如，如果我们创建下拉菜单的代码段如下：\n\n\n\n\n\n```\n\
  <div class=\"dropdown\" id=\"myDropdown\">\n    <a class=\"myDropdownHandle\" data-toggle=\"\
  dropdown\" \n↵data-target=\"#\" href=\"#\">\n        Dropdown <span class=\"caret\"\
  ></span>\n    </a>\n    <ul class=\"dropdown-menu\">\n        <li><a href=\"#\"\
  >Link 1</a></li>\n        <li><a href=\"#\">Link 2</a></li>\n        <li><a href=\"\
  #\">Link 3</a></li>\n        <li><a href=\"#\">Link 4</a></li>\n    </ul>\n</div>\n\
  ```\n\n你需要在 jQuery 的 `ready()` 方法中调用 `dropdown()` 方法：\n\n```\n<script type=\"text/javascript\"\
  >\n    $(document).ready(function(){\n        $('.myDropdownHandle').dropdown('toggle');\n\
  \    });\n</script>\n```\n\n你可以看到我在选择 `.myDropdownHandle` 之后使用了 `dropdown()` 方法。默认情况下，下拉菜单的状态是关闭的；每当你刷新页面时，它都会切换状态并使菜单可见。\n\
  \nBootstrap 提供了绑定到下拉插件上的各种事件。它们是：\n\n- `show.bs.dropdown`: 该事件在句柄被点击时立即触发；下拉句柄收到了打开隐藏菜单的请求\n\
  - `shown.bs.dropdown`: 该事件在菜单显示后触发\n- `hide.bs.dropdown`: 该事件在关闭菜单之前立即触发\n- `hidden.bs.dropdown`:\
  \ 该事件在菜单关闭时触发\n\n`show` 和 `hide` 事件发生在完成请求正之前，而 `shown` 和 `hidden` 事件则在请求完成后发生。在这里，请求是打开和关闭下拉菜单。\n\
  \n让我向你展示一个演示，解释如何使用这些事件。我写了以下 jQuery 代码段，目标是针对下拉插件的所有状态，并在每个事件触发时打印一条语句：\n\n```\n\
  $('#myDropdown').on('show.bs.dropdown', function () {\n   console.log(\"Opening\
  \ dropdown..\");\n});\n\n$('#myDropdown').on('shown.bs.dropdown', function () {\n\
  \   console.log(\"Dropdown opened..\");\n});\n\n$('#myDropdown').on('hide.bs.dropdown',\
  \ function () {\n   console.log(\"Hiding dropdown..\");\n});\n\n$('#myDropdown').on('hidden.bs.dropdown',\
  \ function () {\n   console.log(\"Dropdown hidden..\");\n});\n```\n\n点击链接句柄时，控制台中将填充前两条消息：“Opening\
  \ dropdown”和“Dropdown opened”，如图 4.3 所示。\n\n![初始点击](img/ch4Image3.png)\n\n图 4.3\
  \ 初始点击\n\n再次点击句柄将显示最后两条消息，如图 4.4 所示。\n\n![再次点击句柄](img/ch4Image4.png)\n\n图 4.4 再次点击句柄\n\
  \n最后，带有上述事件的 `index.html` 应该如下：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"\
  IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
  >\n\n    <title>Bootstrap Plugins</title>\n    <link rel=\"stylesheet\" type=\"\
  text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if lt IE 9]>\n      <script src=\"\
  https://oss.maxcdn.com/libs/html5shiv/3.7.0/\n↵html5shiv.js\"></script>\n      <script\
  \ src=\"https://oss.maxcdn.com/libs/respond.js/1.4.2/\n↵respond.min.js\"></script>\n\
  \    <![endif]-->\n\n  </head>\n  <body>\n        <div class=\"container\">\n  \
  \          <div class=\"dropdown\" id=\"myDropdown\">\n                <a class=\"\
  myDropdownHandle\" data-toggle=\"dropdown\" \n↵data-target=\"#\" href=\"#\">\n \
  \                   Dropdown <span class=\"caret\"></span>\n                </a>\n\
  \                <ul class=\"dropdown-menu\">\n                    <li><a href=\"\
  #\">Link 1</a></li>\n                    <li><a href=\"#\">Link 2</a></li>\n   \
  \                 <li><a href=\"#\">Link 3</a></li>\n                    <li><a\
  \ href=\"#\">Link 4</a></li>\n                </ul>\n            </div\n       \
  \ </div>\n\n    <script src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"\
  ></script>\n    <script type=\"text/javascript\">\n        $(document).ready(function(){\n\
  \n            $('#myDropdown').on('show.bs.dropdown', function () {\n          \
  \     console.log(\"Opening dropdown..\");\n            });\n\n            $('#myDropdown').on('shown.bs.dropdown',\
  \ function () {\n               console.log(\"Dropdown opened..\");\n          \
  \  });\n\n            $('#myDropdown').on('hide.bs.dropdown', function () {\n  \
  \             console.log(\"Hiding dropdown..\");\n            });\n\n         \
  \   $('#myDropdown').on('hidden.bs.dropdown', function () {\n               console.log(\"\
  Dropdown hidden..\");\n            });\n\n        });\n    </script>\n  </</body>>\n\
  </html>\n```\n\n当下拉菜单中的链接根据来自的数据动态填充数据时，你会发现这些事件极其有用。在这些情况下，你可以在 `show.bs.dropdown`\
  \ 事件上向服务器发送 Ajax 请求，并在下拉菜单显示之前填充它。\n\n### 警报消息 (Alert Messages)\n\nBootstrap 自带了一个非常有用的组件，用于在我们网站的不同部分显示警报消息；你可以使用它们来显示成功消息、警告消息、失败消息或信息消息。这些消息可能会让访客感到困扰，因此它们应该添加关闭功能，让访客能够隐藏它们。\n\
  \n在本节中，我们将使用 Bootstrap 创建一个警报消息，并查看我们如何为其添加关闭功能。\n\n以下是“成功”警报消息的标记：\n\n```\n<div\
  \ class=\"alert alert-success\">\n    Amount has been transferred successfully.\n\
  </div>\n```\n\n每个警报都应该带有 `alert` 类。它还应该有一个额外的上下文类，例如 `alert-success`。对于警报消息，有四个目自见明的上下文类：\n\
  \n1. `alert-success`\n2. `alert-info`\n3. `alert-danger`\n4. `alert-warning`\n\n\
  上述代码中显示的警报没有关闭功能，因此它在网页上始终可见的，如图 4.5 所示。\n\n![没有关闭功能的普通警报消息](img/ch4Image5.png)\n\
  \n图 4.5 没有关闭功能的普通警报消息\n\n可关闭的警报框的标记以及它在图 4.6 在屏幕上的显示如下：\n\n```\n<div class=\"alert\
  \ alert-success alert-dismissable\">\n    <button type=\"button\" class=\"close\"\
  \ data-dismiss=\"alert\">\n&times;</button>\n    Amount has been transferred successfully.\n\
  </div>\n```\n\n![可关闭的警报框](img/ch4Image6.png)\n\n图 4.6 可关闭的警报框\n\n要创建一个可关闭的警报消息，我们需要向警报框添加类\
  \ `alert-dismissable`。接下来，我们需要一个在点击时关闭警报消息的按钮。该按钮应该具有 `data-dismiss` 属性，它告诉 Bootstrap\
  \ 在点击时关闭组件。Bootstrap 通过 `close` 类的帮助将此按钮定位在警报框的右上角。关闭按钮上的关闭操作是 Bootstrap 使用 JavaScript\
  \ 添加的，并通过 `data-dismiss` 属性进行捕获。\n\n### 提示：在警报中使用链接\n\n如果你想在警报中放置链接，你需要为 `a` 元素添加类\
  \ `alert-link`。这提供了一个与警报框颜色匹配的链接颜色：\n\n```\n<div class=\"alert alert-success alert-dismissable\"\
  >\n    <button type=\"button\" class=\"close\" data-dismiss=\n\"alert\">&times;</button>\n\
  \    Amount has been transferred successfully. Go to <a \nhref=\"#\" class=\"alert-link\"\
  >account page</a>.\n</div>\n```\n\n### JavaScript 处理警报消息\n\n你也可以使用 jQuery 中的 Bootstrap\
  \ `alert()` 方法来关闭警报消息：\n\n```\n$(\".alert\").alert('close');\n```\n\n警报消息有两个与之关联的事件：\n\
  \n1. `close.bs.alert`: 在关闭警报框之前立即触发\n2. `closed.bs.alert`: 在警报框关闭后触发\n\n以下是使用上述事件的示例：\n\
  \n\n\n\n\n```\n$('.alert').on('close.bs.alert', function () {\n   console.log(\"\
  Closing alert..\");\n});\n\n$('.alert').on('closed.bs.alert', function () {\n  \
  \ console.log(\"Alert closed!\");\n});\n```\n\n### 按钮\n\n我们在上一节中学习了如何创建各种类型的按钮。在这里，我们将看到如何在不同场景下使用它们，并使用\
  \ Bootstrap 的 JavaScript 插件更改它们的状态。\n\nBootstrap 按钮有两个状态：`active`（激活）和 `inactive`（未激活）。激活状态有一个名为\
  \ `active` 的类，但未激活状态没有对应的类。相反，你可以使用以下标记创建一个简单的按钮，并在在这两个状态之间切换：\n\n```\n<button type=\"\
  button\" class=\"btn btn-lg btn-default\" \n↵data-toggle=\"button\">切换我！</button>\n\
  ```\n\n在代码中，我使用 `btn`、`btn-lg` 和 `btn-default` 类创建了一个大灰色按钮。它目前处于未激活状态。当用户点击它时，Bootstrap\
  \ 会为按钮添加一个额外的 `active` 类。\n\n当你点击按钮时，你会看到它被应用了类似内嵌的样式。再次点击时，它会恢复到原始样式，如图 4.7 所示。值为\
  \ `button` 的属性 `data-toggle` 有助于实现这种切换功能。\n\n![按钮的两种状态](img/ch4Image7.png)\n\n图\
  \ 4.7. 我们按钮的两种状态\n\n使用 CSS 设置复选框和单选按钮可能是复杂的。Bootstrap 有重新设计它们的方法；它将一组复选框或单选按钮转换为一组并排的\
  \ Bootstrap 按钮。让我们示例标记，结果如图 4.8 所示：\n\n```\n<div class=\"btn-group\" data-toggle=\"\
  buttons\">\n\n    <label class=\"btn btn-default\"\n        <input type=\"checkbox\"\
  > 选项 1\n    </label>\n\n    <label class=\"btn btn-default\">\n        <input type=\"\
  checkbox\"> 选项 2\n    </label>\n\n    <label class=\"btn btn-default\">\n      \
  \  <input type=\"checkbox\"> 选项 3\n    </label>\n\n</div>\n```\n\n![Bootstrap 复选框](img/ch4Image8.png)\n\
  \n图 4.8. Bootstrap 复选框\n\n你可以在图 4.8 中看到 Bootstrap 彻底改变了复选框的显示。它们现在以一组 Bootstrap\
  \ 按钮的形式出现。由于是复选框，我能够勾选选项 1 和选项 3。要创建这组复选框，你需要一个类为 `btn-group` 的父 `div`。它还应该有一个值为\
  \ `buttons` 的 `data-toggle` 属性。所有 `checkbox` 的 `input` 元素都应该封装在 `label` 元素内部。这些标签必须具有\
  \ Bootstrap 的按钮类。在这种情况下，我选择了灰色的按钮。\n\n### 提示：多颜色复选框\n\n你可以通过混合 Bootstrap 的按钮类（例如\
  \ `btn-primary`、`btn-info` 等）在按钮组中创建多种颜色的按钮。\n\n你还可以创建一个单选按钮组，其中只有一个按钮可以被选中。这里是标记，结果如图\
  \ 4.9 所示：\n\n```\n<div class=\"btn-group\" data-toggle=\"buttons\">\n\n    <label\
  \ class=\"btn btn-info\">\n        <input type=\"radio\" name=\"options\"> 选项 1\n\
  \    </label>\n\n    <label class=\"btn btn-info\">\n        <input type=\"radio\"\
  \ name=\"options\"> 选项 2\n    </label>\n\n    <label class=\"btn btn-info\">\n \
  \       <input type=\"radio\" name=\"options\"> 选项 3\n    </label>\n\n</div>\n```\n\
  \n![Bootstrap 单选按钮](img/ch4Image9.png)\n\n图 4.9. Bootstrap 单选按钮\n\n标记中唯一的变化是将 `input`\
  \ 元素的 `type` 属性从 `checkbox` 修改为 `radio`。此外，你必须通过为所有单选按钮应用相同的 `name` 属性值来在逻辑上对它们进行分组。在这种情况下，我还将将\
  \ `btn-default` 替换为 `btn-info`，以将按钮颜色从灰色更改为浅蓝色。\n\n### 使用 JavaScript 的按钮\n\nBootstrap\
  \ 带有 `button()` 方法，可以通过 jQuery 切换按钮的状态。你可以如下如下使用它：\n\n```\n$(\"mybutton\").button('toggle');\n\
  ```\n\n你还可以将按钮更改为 `loading`（加载）状态。在此状态下，按钮将保持禁用，但你需要使用按钮元素中的 `data-loading-text`\
  \ 属性定义额外的加载文本：\n\n```\n<button id=\"myLoadingButton\" type=\"button\" class=\"btn\
  \ btn-primary\" \n↵data-loading-text=\"加载中...\">加载数据</button>\n```\n\n让我们在点击按钮时使用\
  \ jQuery 将按钮状态更改为 `loading`：\n\n```\n$('#myLoadingButton').click(function () {\n\
  \    $(this).button('loading');\n});\n```\n\n### 内容管理\n\n妥善管理内容对于任何网站都极其重要。Bootstrap\
  \ 提供了许多可以帮助我们组织和显示插件。\n\n基本上，这是一个双组件插件；它由导航栏和内容区域组成。内容区域分为若干部分，每个部分都有 ID。让我们先构建一个导航栏。这里是标记：\n\
  \n```\n<nav id=\"navbarExample\" class=\"navbar navbar-default\" \n↵role=\"navigation\"\
  >\n  <div class=\"container-fluid\">\n    <div class=\"navbar-header\">\n      <button\
  \ class=\"navbar-toggle\" type=\"button\" \n↵data-toggle=\"collapse\" data-target=\"\
  .navbarLinks\">\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
  icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n      </button>\n\
  \      <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n    </div>\n    <div\
  \ class=\"collapse navbar-collapse navbarLinks\">\n      <ul class=\"nav navbar-nav\"\
  >\n        <li class=\"active\"><a href=\"#home\">首页</a></li>\n        <li class=\"\
  \"><a href=\"#about\">关于</a></li>\n        <li class=\"\"><a href=\"#contact\">联系我们</a></li>\n\
  \        <li class=\"\"><a href=\"#map\">地图</a></li>\n      </ul>\n    </div>\n\
  \  </div>\n</nav>\n```\n\n导航栏标记中的链接都是指向内容中特定区域的内部链接。\n\n内容部分的标记如下：\n\n```\n<div\
  \ data-spy=\"scroll\" data-target=\"#navbarExample\" data-offset=\"0\" \n↵class=\"\
  scrollspy-example\">\n\n    <h4 id=\"home\">首页</h4>\n    <p>Lorem ipsum dolor sit\
  \ amet, consectetur  ... </p>\n\n    <h4 id=\"about\">关于</h4>\n    <p>Lorem ipsum\
  \ dolor sit amet, consectetur  ... </p>\n\n    <h4 id=\"contact\">联系我们</h4>\n  \
  \  <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\n    <h4 id=\"map\">地图</h4>\n\
  \    <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\n</div>\n```\n\n###\
  \ ScrollSpy\n\nScrollSpy 是现代最流行的插件之一。它根据当前显示的区域高亮导航栏中的菜单项。当用户开始滚动页面时，导航栏中相应的链接将根据视图中的区域进行高亮。\n\
  \n\n\n\n\n内容部分由四对 `<h4>` 和 `<p>` 标签组成。每个 `<h4>` 元素都有一个唯一的 ID，与上述导航栏的内部链接相匹配。为了使\
  \ `ScrollSpy` 正常工作，你应该为内容部分添加两个自定义数据属性：`data-spy` 和 `data-target`。\n\n`data-spy`\
  \ 属性告诉 Bootstrap 哪个区域是 `ScrollSpy` 插件的内容区域。它的值应该是 `scroll`，以便开始监听该区域的滚动事件。`data-target`\
  \ 属性告诉插件需要高亮哪些链接。它应该包含 `nav` 元素父元素的 ID。\n\n`data-offset` 属性告诉 Bootstrap 在激活 `ScrollSpy`\
  \ 插件之前，距离顶部留出多少像素。有时在我们在我们滚动到目标元素之前，导航栏元素可能已经更新了。如果我们在 `ScrollSpy` 区域上方放置了一些额外的\
  \ HTML 标记，就会发生这种情况。这会干扰插件内部对区域高度的计算。我们可以使用 `data-offset` 属性并将值设置为干扰元素的高度。这样一来，插件只有在干扰元素被滚动过之后，才会开始监听用户的滚动操作。\n\
  \n以下是带有 `ScrollSpy` 的 `index.html` 完整标记：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\"\
  \ content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ \ninitial-scale=1\">\n\n    <title>Bootstrap Plugins</title>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if lt IE\
  \ 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
  ></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n1.4.2/respond.min.js\"\
  ></script>\n    <![endif]-->\n\n    <style type=\"text/css\">\n        .scrollspy-example{\n\
  \          position:relative;\n          height:200px;\n          margin-top:10px;\n\
  \          overflow:auto}\n    </style>\n\n  </head>\n  <body><body>\n  <div class=\"\
  container\">\n    <nav id=\"navbarExample\" class=\"navbar navbar-default\" \nrole=\"\
  navigation\">\n      <div class=\"container-fluid\">\n        <div class=\"navbar-header\"\
  >\n          <button class=\"navbar-toggle\" type=\"button\" \ndata-toggle=\"collapse\"\
  \ data-target=\".navbarLinks\">\n            <span class=\"icon-bar\"></span>\n\
  \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
  ></span>\n          </button>\n          <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n\
  \        </div>\n        <div class=\"collapse navbar-collapse navbarLinks\">\n\
  \          <ul class=\"nav navbar-nav\">\n            <li class=\"active\"><a href=\"\
  #home\">Home</a></li>\n            <li class=\"\"><a href=\"#about\">About</a></li>\n\
  \            <li class=\"\"><a href=\"#contact\">Contact Us</a></li>\n         \
  \   <li class=\"\"><a href=\"#map\">Map</a></li>\n          </ul>\n        </div>\n\
  \      </div>\n    </nav>\n    <div data-spy=\"scroll\" data-target=\"#navbarExample\"\
  \ \ndata-offset=\"0\" class=\"scrollspy-example\">\n\n        <h4 id=\"Home\">Home</h4>\n\
  \        <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\n        <h4 id=\"\
  about\">About</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\
  \n        <h4 id=\"contact\">Contact Us</h4>\n        <p>Lorem ipsum dolor sit amet,\
  \ consectetur ... </p>\n\n        <h4 id=\"map\">Map</h4>\n        <p>Lorem ipsum\
  \ dolor sit amet, consectetur ... </p>\n\n    </div>\n  </</div>\n\n    <script\
  \ src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"></script>\n\
  \  </body>\n</html>\n```\n\n在 图 4.10 中，你可以看到我已经滚动到了“About”部分，导航栏中的“About”链接被高亮显示。\n\
  \n![Using ScrollSpy](img/ch4Image10.png)\n\n图 4.10. 使用 ScrollSpy\n\n### 使用 JavaScript\
  \ 使用 ScrollSpy\n\nBootstrap 提供了 `scrollspy()` 方法，可以通过可选参数自定义 `ScrollSpy` 插件。你可以通过\
  \ JavaScript 传递相应的配置对象来设置目标导航栏的父类：\n\n```javascript\n$('.scrollspy-example').scrollspy({\
  \ target: '#navbarExample' });\n```\n\n如果你通过 JavaScript 传递选项，可以忽略元素标记内部的 `data-*`\
  \ 属性。\n\n另一个重要的参数是 `refresh` 字符串。如果你对 DOM 进行了操作（例如从 ScrollSpy 区域添加或删除元素），你需要调用 `scrollspy(\"\
  refresh\")` 方法。这将帮助 ScrollSpy 重新计算滚动区域的高度，该高度可能因为 DOM 的添加和删除而发生变化。\n\n\n\n\n\n```javascript\n\
  $('.nav-tabs li a').on('show.bs.tab', function () {\n   console.log(\"Opening tab\"\
  );\n});\n\n$('.nav-tabs li a').on('shown.bs.tab', function () {\n   console.log(\"\
  Tab opened!\");\n});\n```\n\n### 折叠面板 (Collapse)\n\n`collapse` 插件在 Web 上通常被称为“手风琴”（accordion）插件。它包含多个垂直堆叠的标签页，但一次只能打开一个标签页。图\
  \ 4.12 显示了折叠插件的截图。\n\n![折叠插件](img/ch4Image12-1.png)\n\n图 4.12. 折叠插件\n\n在 Bootstrap\
  \ 中，`collapse` 是通过在单个容器中包含多个面板组件来创建的。我们在上一章中学习了如何创建一个面板。我们也知道面板有两个组件：`panel-heading`（面板头部）和\
  \ `panel-body`（面板主体）。\n\n要创建一个折叠面板，我们需要一组放在容器内的面板。该容器是使用带有 `panel-group` 类的 `div`\
  \ 元素创建的。它还应该有一个关联的 ID。\n\n```html\n<div class=\"panel-group\" id=\"accordion\">\n\
  </div>\n```\n\n我们需要用不同的面板组件填充这个容器，并将作为标签页。让我们在这个 `panel-group` 内部创建一个面板组件：\n\n```html\n\
  <div class=\"panel-group\" id=\"accordion\">\n\n    <div class=\"panel panel-default\"\
  >\n\n        <div class=\"panel-heading\">\n            <h4 class=\"panel-title\"\
  >\n                <a data-toggle=\"collapse\" data-parent=\"#accordion\" \n   \
  \             href=\"#collapseOne\">\n                可折叠组项目 #1\n              \
  \  </a>\n            </h4>\n        </</div>\n\n        <div id=\"collapseOne\"\
  \ class=\"panel-collapse collapse in\">\n            <div class=\"panel-body\">\n\
  \            Lorem ipsum dolor sit ...\n            </div>\n        </div>\n\n \
  \   </div\n\n</div>\n```\n\n在这里，我在面板组容器内部插入了单个面板组件的标记语言。每个面板都分为两部分：`panel-heading`\
  \ 元素和 `panel-body` 元素。\n\n`panel-heading` 元素包含一个嵌套了 `a` 元素的 `h4` 元素。这种 `<h4>` 和\
  \ `<a>` 标签的组合形成了折叠插件中的标签页。`h4` 元素应该具有类 `panel-title`。`a` 元素应该有三个重要的属性：`data-toggle`、`data-parent`\
  \ 和 `href`。`data-toggle` 代表插件的类型。`data-parent` 元素包含 `panel-group` 元素的 ID。最后，此类链接的\
  \ `href` 应该包含 `panel-body` 父元素的 ID。\n\n与 `panel-body` 未封装在任何 `div` 的普通面板不同，在这里为了实现折叠效果，这是强制性的。这个包装元素应该具有\
  \ `panel-collapse`、`collapse` 和 `in` 类。`collapse` 类用于隐藏内容，而 `collapse` 和 `in` 的组合则显示内容。因此，第一个包装器同时具有\
  \ `collapse` 和 `in` 类，其余所有包装器应只有 `collapse` 类。`panel-collapse` 类用于 Bootstrap 的 JavaScript\
  \ 识别该包装器。\n\n重复相同的标记语言以创建多个标签页。以下标记显示了一个具有三个垂直堆叠标签页的折叠插件，结果如图图 4.13 所示：\n\n```html\n\
  <div class=\"panel-group\" id=\"accordion\">\n\n      <!-- 面板 1 -->\n      <div\
  \ class=\"panel panel-default\">\n        <div class=\"panel-heading\">\n      \
  \    <h4 class=\"panel-title\">\n            <a data-toggle=\"collapse\" data-parent=\"\
  #accordion\" \n            href=\"#collapseOne\">\n              可折叠组项目 #1\n   \
  \         </a>\n          </h4>\n        </div>\n        <div id=\"collapseOne\"\
  \ class=\"panel-collapse collapse in\">\n            <div class=\"panel-body\">\n\
  \                Lorem ipsum dolor sit amet, consectetur ...\n            </div>\n\
  \      </div>\n\n      <!-- 面板 2 -->\n      <div class=\"panel panel-default\">\n\
  \        <div class=\"panel-heading\">\n          <h4 class=\"panel-title\">\n \
  \           <a data-toggle=\"collapse\" data-parent=\"#accordion\" \n          \
  \  href=\"#collapseTwo\">\n              可折叠组项目 #2\n            </a>\n         \
  \ </h4>\n        </div>\n        <div id=\"collapseTwo\" class=\"panel-collapse\
  \ collapse\">\n            <div class=\"panel-body\">\n                Lorem ipsum\
  \ dolor sit amet, consectetur ...\n            </div>\n        </div>\n      </div>\n\
  \n      <!-- 面板 3 -->\n      <div class=\"panel panel-default\">\n        <div class=\"\
  panel-heading\">\n          <h4 class=\"panel-title\">\n            <a data-toggle=\"\
  collapse\" data-parent=\"#accordion\" \n            href=\"#collapseThree\">\n \
  \             可折叠组项目 #3\n            </a>\n          </h4>\n        </div>\n   \
  \     <div id=\"collapseThree\" class=\"panel-collapse collapse\">\n           \
  \ <div class=\"panel-body\">\n                Lorem ipsum dolor sit amet, consectetur\
  \ ...\n            </div>\n        </div>\n      </div>\n    </div>\n</div>\n```\n\
  \n![最终的折叠插件](img/ch4Image12.png)\n\n图 4.13. 最终的折叠插件\n\n### 使用 JavaScript 控制折叠\n\n\
  Bootstrap 提供了 `collapse()` 方法来更改折叠插件的默认行为。默认情况下，一次只能打开一个标签。我们可以通过向上述方法传递自定义的 `options`\
  \ 对象来覆盖此行为。让我们尝试一下。\n\n在之前的折叠插件标记语言中，我们为所有 `panel-body` 包装器添加了 `collapse` 类。让我们选择这个类并在其上调用\
  \ `collapse()` 方法：\n\n```javascript\n$('.collapse').collapse({\n        toggle:\
  \ false\n});\n```\n\n在代码段中，我传递了一个具有 `toggle` 属性且值为 `false` 的匿名对象。这将强制所有标签页在其他标签页打开时保持打开状态。请亲自尝试一下。\n\
  \n如图图 4.14 所示，你可以看到所有标签同时打开了。\n\n![我们的折叠面板中所有标签都打开](img/ch4Image15.png)\n\n图 4.14.\
  \ 我们的折叠面板中所有标签都打开\n\n你还可以向 `collapse()` 方法传递各种预定义的字符串：\n\n1. `collapse('toggle')`：切换标签页从一种状态到另一种状态\n\
  2. `collapse('show')`：打开标签页\n3. `collapse('hide')`：关闭标签页\n\nBootstrap 还带了四个绑定到折叠插件的自定义事件：\n\
  \n1. `show.bs.collapse`：在打开标签页之前触发。\n2. `shown.bs.collapse`：在标签打开后触发。\n3. `hide.bs.collapse`：在关闭标签页之前触发。\n\
  4. `hidden.bs.collapse`：在标签关闭后触发。\n\n以下是它们的用法：\n\n```javascript\n$('.collapse').on('show.bs.collapse',\
  \ function () {\n    console.log('Opening tab..');\n});\n\n$('.collapse').on('shown.bs.collapse',\
  \ function () {\n    console.log('Tab opened.');\n});\n\n$('.collapse').on('hide.bs.collapse',\
  \ function () {\n    console.log('Hiding tab..');\n});\n\n$('.collapse').on('hidden.bs.collapse',\
  \ function () {\n    console.log('Tab hidden');\n});\n```\n\n### 提示框 (Tooltip)\n\
  \nBootstrap 的 `tooltip` 是一种当鼠标悬停在网站组件上时出现的小浮动消息。它通常用于显示特定组件的帮助文本。\n\nBootstrap 的提示框使用\
  \ CSS 创建并通过 JavaScript 触发。与今天提供的许多其他提示框插件相比，它非常轻量。它提供了易于自定义的选项，可以相对于其父组件定位提示框（上、下、右、左）。要使用提示框，我们需要定义一些自定义的\
  \ `data-*` 属性。\n\n让我们按钮组件上构建一个演示提示框：\n\n```html\n<button type=\"button\" class=\"\
  btn btn-default\" data-toggle=\"tooltip\" \ndata-placement=\"bottom\" title=\"I\
  \ am a Bootstrap button\">Who am I?\n</button>\n```\n\n\n\n\n你需要添加一个值为 `tooltip`\
  \ 的 `data-toggle` 属性，一个包含你想显示在提示中的文本的 `title` 属性，以及一个 `data-placement` 属性。`data-placement`\
  \ 属性接受以下四个值之一：`top`、`bottom`、`left` 和 `right`。顾其名，`data-placement` 属性定义了提示相对于父组件的位置。\n\
  \n让我们在浏览器中查看这个按钮吧。你会发现它无法工作；当鼠标悬停在按钮上时，没有提示出现。由于性能考虑，Bootstrap 中的提示框需要通过 jQuery\
  \ 手动初始化。因此，让我们在 body 中所有的 `<script>` 标签之后添加以下脚本：\n\n```\n<script type=\"text/javascript\"\
  >\n  $(document).ready(function(){\n    $('.tooltipButton').tooltip();\n  });\n\
  </script>\n```\n\n在这段代码中，我们使用了 `tooltipButton` 类作为选择器。因此，我们需要为按钮添加这个类，提示框才能正常工作。\n\
  \n我们还需要修改按钮的 HTML 代码并为它添加 `tooltipButton` 类：\n\n```\n<button type=\"button\" class=\"\
  btn btn-default tooltipButton\" \ndata-toggle=\"tooltip\" data-placement=\"bottom\"\
  \ \ntitle=\"I am a Bootstrap button\">Who am I?</button>\n```\n\n刷新网页，提示框应该就会出现，如图\
  \ 4.15 所示。\n\n![A tooltip](img/ch4Image16.png)\n\n图 4.15. 一个 tooltip\n\n### 使用 JavaScript\
  \ 的提示框\n\n我们刚刚看到需要调用 `tooltip()` 方法来让提示框生效。在这里，我们将看到如何通过此函数传递各种选项来自定义提示框插件。\n\n\
  该方法接受一个包含各种可选属性的对象，用于更改提示框的通用行为：\n\n```\nvar options = {\n    animation : true;\n\
  };\n\n$(\".tooltipButton\").tooltip(options);\n```\n\n在代码中，我定义了一个名为 `options` 的\
  \ JavaScript 对象。我将 `animation` 属性设置为 `true`，这样提示框在每次显示时都会获得淡入效果。最后，我将此对象传递给 `tooltip()`\
  \ 方法。\n\n其他可以传递的属性包括：\n\n- `html`: 此属性接收一个布尔值。如果将其设置为 `true`，则 `title` 属性中的内容将被解析为\
  \ HTML。否则，它将原样显示。\n- `placement`: 此属性接收五个字符串值：`top`、`bottom`、`left`、`right` 和 `auto`。它定义了提示相对于组件的位置。如果设置为\
  \ `auto`，提示框将自动定位。\n- `selector`: 这是 Bootstrap 提供的特殊选项。如果你在父容器上调用了 `tooltip()` 方法，你可能想过滤掉提示框应该作用的子元素，可以通过此选项来实现。你可以提供如\
  \ `a`、`a[href='hello.html']` 或 `button[class='tooltipbuttons']` 等值。\n- `title`:\
  \ 如果你在 HTML 标记中未使用自定义属性 `data-title`，则可以通过此选项传递提示标题。它接收一个字符串值，例如 `title: \"This\
  \ is a button\".`。\n- `trigger`: 所有提示都通过悬停在组件上显示。使用此选项可以覆盖默认行为。该选项可以的值有：`click`、`focus`、`hover`\
  \ 和 `manual`。你也可以用空格组合这些值；例如 `click hover`、`hover focus` 等。\n- `delay`: 如果你不希望提示框立即出现，请使用此属性设置延迟时间（毫秒为单位）。\n\
  - `container`: 使用此属性将提示框附加到特定元素（如 `body`）。这可以防止提示框在窗口缩放时偏离触发元素。\n\n除了接受选项对象外，`tooltip()`\
  \ 方法还接受几个预定义的字符串值。这些字符串映射到提示框的自定义行为；例如：\n\n```\n$('.tooltipButton').tooltip('show');\n\
  ```\n\n传递字符串 `show` 将使提示框出现。可能的字符串值有：\n\n1. `show`: 显示提示框\n2. `hide`: 隐藏提示框\n3.\
  \ `toggle`: 切换提示框状态（如果提示框当前隐藏的，则会显示它，反之亦然）\n4. `destroy`: 此字符串隐藏并销毁特定元素的提示框；一旦销毁，关联的提示框无法再次使用\n\
  \n与其他 Bootstrap 插件一样，提示框还带有自定义事件，可以捕获这些事件以执行额外任务。这些事件是：\n\n1. `show.bs.tooltip`:\
  \ 该事件在提示框可见之前触发\n2. `shown.bs.tooltip`: 该事件在提示框可见之后触发\n3. `hide.bs.tooltip`: 在提示框隐藏之前触发\n\
  4. `hidden.bs.tooltip`: 在提示框隐藏之后触发\n\n以下是它们的使用方法：\n\n```\n$('.tooltipButton').on('show.bs.tooltip',\
  \ function () {\n  console.log(\"Showing tooltip..\");\n});\n\n$('.tooltipButton').on('shown.bs.tooltip',\
  \ function () {\n  console.log(\"Tooltip shown.\");\n});\n\n$('.tooltipButton').on('hide.bs.tooltip',\
  \ function () {\n  console.log(\"Hiding tooltip..\");\n});\n\n$('.tooltipButton').on('hidden.bs.tooltip',\
  \ function () {\n  console.log(\"Tooltip hidden.\");\n});\n```\n\n### 弹出框 (Popovers)\n\
  \n弹出框是另一个实用的插件，与提示框可以相拟。不同之处在于，弹出框比提示框更大、更漂亮，如图 4.16 所示。它们看起来与 Apple iBooks 字典功能中的弹出框非常相似。\n\
  \n![Popovers versus tooltips](img/ch4Image17-1.png)\n\n图 4.16. 弹出框与提示框\n\n你在弹出框中放置的内容比提示框多。当你有更多\
  \ HTML 内容或文本需要显示时，建议使用弹出框而不是提示框。\n\n让我们在按钮的点击事件上触发弹出框。实现此目的标记为：\n\n```\n<button\
  \ type=\"button\" class=\"btn btn-danger\" data-toggle=\"popover\" \ndata-placement=\"\
  bottom\" data-content=\"Lorem Ipsum.\" \ntitle=\"This is a demo popover\">Click\
  \ Me!</button>\n```\n\n弹出框插件运行需要几个 `data-*` 属性。这些与提示框使用的自定义属性类似。`data-toggle` 属性指示在按钮上执行操作时触发什么。`data-placement`\
  \ 属性指定弹出框的位置。`data-content` 属性包含你想在弹出框中传递的内容。最后，设置 `title` 属性为插件添加标题。\n\n与提示框一样，弹出框也需要手动初始化。你可以使用以下脚本：\n\
  \n```\n<script type=\"text/javascript\"\n  $(document).ready(function(){\n     $('.popoverButton').popover();\n\
  \  });\n</script>\n```\n\n由于代码中的选择器是一个类，我们需要为按钮添加 `popoverButton` 类。结果如图 4.17 所示。\n\
  \n![Popover](img/ch4Image17.png)\n\n图 4.17. 弹出框\n\n### 使用 JavaScript 的弹出框\n\nBootstrap\
  \ 提供了 `popover()` 方法来自定义弹出框插件的默认行为。它接受一个选项对象，就像提示框插件之前之前之前提示框插件的所有选项属性也适用于弹出框插件。\n\
  \n例如：\n\n```\nvar options = {\n    animation: true,\n    placement: \"right\"\n\
  };\n\n$('.popoverButton').popover(options);\n```\n\n弹出框插件还接受一组预定义的字符串，这些字符串映射到弹出框的某些行为；例如：\n\
  \n```\n$('.popoverButton').popover(\"show\");\n```\n\n就像提示框插件一样，我们有一组相同的预定义字符串来更改弹出框的状态。传递\
  \ `show` 字符串时，弹出框将变为可见。其他可用的字符串有：`hide`、`toggle` 和 `destroy`。\n\n\n\n\n弹出窗（Popovers）还带有与工具提示（tooltip）插件非常类似的自定义事件。与弹出窗相关的事件有：\n\
  \n1. `show.bs.popover`：在显示弹出窗之前触发\n2. `shown.bs.popover`：在弹出窗显示后触发\n3. `hide.bs.popover`：在隐藏弹出窗之前触发\n\
  4. `hidden.bs.popover`：在隐藏弹出窗后触发\n\n用法与工具提示插件类似：\n\n```javascript\n$('.popoverButton').on('show.bs.popover',\
  \ function () {\n    console.log(\"Opening popover..\");\n});\n\n$('.popoverButton').on('shown.bs.popover',\
  \ function () {\n    console.log(\"Popover opened.\");\n});\n\n$('.popoverButton').on('hide.bs.popover',\
  \ function () {\n    console.log(\"Hiding popover..\");\n});\n\n$('.popoverButton').on('hidden.bs.popover',\
  \ function () {\n    console.log(\"Popover hidden.\");\n});\n```\n\n## 更加华丽 (Getting\
  \ Fancy)\n\n在本节中，我们将讨论两个非常重要的插件：`carousel` 和 `modal`。\n\nCarousel 是一个响应式幻灯片插件，而\
  \ modal 是一个类似于灯箱的插件。每一个插件都能让你以华丽的方式展示你的内容。\n\n### 轮播图 (Carousel)\n\n幻灯片非常流行，可以用于新闻、电子商务和视频分享网站等。这种功能用于以组织良好、具有吸引力的幻灯片展示网站上最热门的项目。然而，构建此类幻灯片可能非常耗时，而且这些功能也容易出现\
  \ Bug。在本节中，我们将学习如何使用 Bootstrap 的 `carousel` 插件来构建漂亮的响应式幻灯片。\n\n创建轮播图的标记如下：\n\n```html\n\
  <div id=\"bestCarsCarousel\" class=\"carousel slide\" data-ride=\"carousel\">\n\
  \    <!-- 指器 -->\n    <ol class=\"carousel-indicators\">\n        <li data-target=\"\
  #bestCarsCarousel\" data-slide-to=\"0\" class=\"active\"></li>\n        <li data-target=\"\
  #bestCarsCarousel\" data-slide-to=\"1\"></li>\n        <li data-target=\"#bestCarsCarousel\"\
  \ data-slide-to=\"2\"></li>\n    </ol>\n    <!-- 幻片容器 -->\n    <div class=\"carousel-inner\"\
  >\n        <div class=\"item active\">\n            <img src=\"images/car1.jpg\"\
  >\n            <div class=\"carousel-caption\">\n                <h3>Car 1</h3>\n\
  \                <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n          \
  \  </div>\n        </div>\n        <div class=\"item\">\n            <img src=\"\
  images/car2.jpg\">\n            <div class=\"carousel-caption\">\n             \
  \   <h3>Car 2</h3>\n                <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n\
  \            </div>\n        </div>\n        <div class=\"item\">\n            <img\
  \ src=\"images/car3.jpg\">\n            <div class=\"carousel-caption\">\n     \
  \           <h3>Car 3</h3>\n                <p>Lorem ipsum dolor sit amet, consectetur\
  \ ...</p>\n            </div>\n        </div>\n    </div>\n    <!-- 控制器 -->\n  \
  \  <a class=\"left carousel-control\" href=\"#bestCarsCarousel\" data-slide=\"prev\"\
  >\n        <span class=\"glyphicon glyphicon-chevron-left\"></span>\n    </a>\n\
  \    <a class=\"right carousel-control\" href=\"#bestCarsCarousel\" data-slide=\"\
  next\">\n        <span class=\"glyphicon glyphicon-chevron-right\"></span>\n   \
  \ </a>\n</div>\n```\n\n如代码所示，我们轮播图的主包装容器应该具有 `carousel` 和 `slide` 类。`slide` 类用于为轮播图中的每张幻片提供滑动效果。它还应该有一个自定义属性\
  \ `data-ride`，该属性告诉 Bootstrap 在页面加载时立即开始滑动效果。如果没有此属性，在您手动进行第一次切换之前，幻片将不会自动更改。\n\n\
  每个轮播图插件包含三个子部分：指示器（indicators）、主体（body）和控制器（controls）。\n\n要创建一个轮播图指示器（Indicator），你必须定义一个类为\
  \ `carousel-indicators` 的有序列表。`li` 元素的数量取决于你想拥有的幻片数量。每个 `li` 元素都应该有一个 `data-target`\
  \ 属性，其中包含轮播图容器的 ID。它还应该有一个 `data-slide-to` 属性，其中包含它指向的特定幻片的序列号。\n\n接下来，我们构建轮播图的核心——幻片（slides）。首先，我们为所有幻片创建一个包装元素。这将一个类为\
  \ `carousel-inner` 的 `div`。每张幻片由一个类为 `item` 的 `div` 元素定义。每个项目都必须有一张性图片和可选的文本数据。此图片将作为该特定幻片项目的背景。对于每张图片，我们可以添加相关的说明和一些额外的文本数据。这些说明被一个类为\
  \ `carousel-caption` 的 `div` 元素封装。可以使用任何 HTML 标题标签来插入说明：`<h1>`、`<h2>`、`<h3>` 等。对于相关文本，你可以使用\
  \ `<p>` 标签。\n\n对每张幻片重复相同的 `item` 标记。在您完成所有幻片的创建后，我们将构建一个用于导航轮播图内容的控制器部分（controls）。\n\
  \n轮播图控制器使用具有 `carousel-control` 类的 `<a>` 标签构建，其中 `href` 包含轮播图的 ID。`data-slide` 属性可以是\
  \ `prev` 或 `next`。符号由 glyphicons 提供。\n\n### 使用 JavaScript 使用轮播图\n\nBootstrap 提供了\
  \ `carousel()` 方法来通过 JavaScript 调用轮播图。你可以使用此方法传递自定义选项以更改默认行为。\n\n轮播图只有三个可用选项：`interval`、`pause`\
  \ 和 `wrap`。它们在代码中：\n\n```javascript\nvar options = {\n    interval: 7000,\n    pause:\
  \ 'hover',\n    wrap: true\n};\n\n$('#bestCarsCarousel').carousel(options);\n```\n\
  \n`interval` 属性用于指定每张幻片之间的持续时间。`pause` 选项仅接受一个值 `hover`，它告诉 Bootstrap 在鼠标悬停时停止轮播图滑动。`wrap`\
  \ 选项接受布尔值来设置轮播图循环的开启或关闭。如果设置为 `true`，轮播图在显示最后后将开始滑动到第一张幻片。\n\n也可以传递给 `carousel()`\
  \ 方法的其他参数包括：\n\n1. `cycle`：启用轮播图的循环功能\n2. `pause`：通过 JavaScript 暂停幻灯片\n3. `number`：指定两张幻片之间的持续时间\n\
  4. `prev`：切换到上一张幻片\n5. `next`：切换到下一张幻片\n\n轮播图插件带有两个自定义事件：\n\n1. `slide.bs.carousel`：在幻片更改之前触发\n\
  2. `slid.bs.carousel`：在幻片更改后触发\n\n用法如下：\n\n```javascript\n$('#bestCarsCarousel').on('slide.bs.carousel',\
  \ function () {\n    console.log(\"Changing slide..\");\n});\n\n$('#bestCarsCarousel').on('slid.bs.carousel',\
  \ function () {\n    console.log(\"Slide changed.\");\n});\n```\n\n### 模态框 (Modals)\n\
  \n**模态框 (Modals)** 是网页中隐藏的 HTML 元素，在触发时从屏幕顶部向下滑动。它是用于显示对话提示（如警告和确认框）的最佳插件之一。你还可以使用它来展示更大版本的图片、显示长长的条款和条件列表，或者显示注册/登录表单。\n\
  \n\n\n\n使用 Bootstrap 3，模态框（modals）已经变得响应式。这意味着即使在较小的屏幕上，它们也有良好的显示和运行效果。让我们创建一个模态框：\n\
  \n```html\n<div class=\"modal fade\" id=\"myModal\">\n    <div class=\"modal-dialog\"\
  >\n        <div class=\"modal-content\">\n            <!-- Modal Header -->\n  \
  \          <div class=\"modal-header\">\n                <button type=\"button\"\
  \ class=\"close\" data-dismiss=\"modal\">&times;</button>\n                <h4 class=\"\
  modal-title\">Welcome Back!</h4>\n            </div>\n            <!-- Modal Body\
  \ -->\n            <div class=\"modal-body\">\n                <h1>Hello Readers!</h1>\n\
  \            </div>\n            <!-- Modal Footer -->\n            <div class=\"\
  modal-footer\">\n                <button type=\"button\" class=\"btn btn-default\"\
  \ data-dismiss=\"modal\">Close</button>\n                <button type=\"button\"\
  \ class=\"btn btn-primary\">Save changes</button>\n            </div>\n        </div>\n\
  \    </div>\n</div>\n```\n\n每个模态框都应该有一个一个类名为 `modal` 的容器。为了给模态框添加淡入效果，我们需要在同一个容器上添加\
  \ `fade` 类。接下来，我们定义一个类名为 `modal-dialog` 的 `div` 元素。它负责控制模态框的大小。默认情况下，它会根据屏幕的大小调整尺寸。稍后我们将看到如何通过向\
  \ `modal-dialog` 添加额外的类来更改模态框的大小。在模态对话框内部，我们将创建一个包装元素，用于封装模态框的各个子部分。该包装元素应该有一个名为\
  \ `modal-content` 的类。\n\n模态框的子部分包括头部（header）、主体（body）和页脚（footer）。头部和页脚是可选的。要创建一个模态框头部，你需要一个类名为\
  \ `modal-header` 的 `div` 元素。在里面你可以模态标题和模态关闭图标。模态标题使用类名为 `modal-title` 的 `h4` 元素给出。这里的关闭图标是一个封装在\
  \ `button` 元素周围的乘法（x）符号。此按钮应该具有 `close` 类，以便它对齐到模态框头部的左上角。添加 `data-dismiss` 属性可以允许按钮在点击时关闭模态框。\n\
  \n对于主体，我们需要一个类名为 `modal-body` 的 `div`。你可以在此元素放入放入任何内容。你甚至可以使用 Bootstrap 的网格系统在内部合理组织内容。\n\
  \n最后，为了创建模态框页脚，我们定义一个类名为 `modal-footer` 的 `div` 元素。模态框页脚内部的内容默认右对齐。\n\n如果你在浏览器中检查之前的模态框代码段，你会发现什么；模态框本质上是隐藏的。你必须创建一个句柄来触发它：\n\
  \n```html\n<button class=\"btn btn-primary btn-lg\" data-toggle=\"modal\" data-target=\"\
  #myModal\">\n    Launch modal\n</button>\n```\n\n在代码代码中，我使用按钮组件来触发模态框。它应该有一个 `data-target`\
  \ 属性，告诉 Bootstrap 应该触发哪个模态框，因为网站中可能有多个模态框。我们还需要定义 `data-toggle` 属性来确定点击时触发什么操作。\n\
  \n现在我们已经准备好使用我们的模态框了。去点击按钮，查看浏览器中淡入的模态框，如图 4.19 所示。\n\n![Our modal](img/ch4Image19.png)\n\
  \n图 4.19 我们的模态框\n\n### 注意：模态框的位置\n\n模态框的标记必须放置在文档的顶层位置，以防止与其他组件冲突。然而，放置模态框句柄时没有限制。它可以放在文档的任何地方。\n\
  \n模态框有三种宽度：大、默认和小。这些对于将内容恰当地放入模态对话框中非常有帮助。\n\n如果未为 `modal-dialog` 提供额外的类，它将以 600px\
  \ 的默认宽度出现。要使模态框变大或变小，你需要向 `modal-dialog` 元素添加这些类之一：\n\n* `modal-lg`: 用于宽度为 900px\
  \ 的大模态框\n* `modal-sm`: 用于宽度为 300px 的小模态框\n\n### 使用 JavaScript 的模态框\n\nBootstrap\
  \ 提供了 `modal()` 方法通过 JavaScript 触发模态框。该方法还接受一个选项对象，其中包含用于自定义模态框默认行为的各种属性：\n\n```javascript\n\
  var options = {\n    backdrop: true,\n    keyboard: false,\n    show: true,\n  \
  \  remote: false\n}\n\n$(\"#myModal\").modal(options);\n```\n\n`backdrop` 接受布尔值或字符串值\
  \ `static`。当模态框启动时，模态框主体后面默认会出现一个深色的透明背景。将此属性设置为 `true` 会使背景可见。将其设置为 `false`，则背景会消失。当设置为\
  \ `static` 时，点击模态框主体外部任何地方，模态框都不会关闭。\n\n`keyboard` 属性用于启用或禁用键盘的 escape 键功能。当设置为\
  \ `false` 时，`Esc` 键不会关闭模态框。\n\n`show` 属性用于通过 JavaScript 切换模态框的可见性。当设置为 `true` 时，模态框将自动出现，无需点击任何句柄元素。\n\
  \n`a` 元素可以作为模态句柄元素，它可以包含一个带有链接的 `href` 属性。Bootstrap 模态框有一个选项在点击句柄时将此链接加载到其 `modal-body`\
  \ 元素中。此功能默认关闭的。如果你想使用此功能并将链接加载到 `modal-body` 中，请将 `remote` 属性设置为 `true`。\n\n与 Bootstrap\
  \ 模态框相关的事件包括：\n\n1. `show.bs.modal`: 在打开模态框之前触发\n2. `shown.bs.modal`: 在模态框打开后触发\n\
  3. `hide.bs.modal`: 在隐藏模态框之前触发\n4. `hidden.bs.modal`: 在模态框隐藏后触发\n5. `loaded.bs.modal`:\
  \ 在远程内容加载后触发\n\n以下是它们的用法：\n\n```javascript\n$('#myModal').on('show.bs.modal', function\
  \ () {\n    console.log(\"Opening Modal..\");\n});\n\n$('#myModal').on('shown.bs.modal',\
  \ function () {\n    console.log(\"Modal opened.\");\n});\n\n$('#myModal').on('hide.bs.modal',\
  \ function () {\n    console.log(\"Hiding Modal..\");\n});\n\n$('#myModal').on('hidden.bs.modal',\
  \ function () {\n    console.log(\"Modal hidden.\");\n});\n```\n\n## 总结\n\n在本章中，我们学习了如何使用许多流行的\
  \ Bootstrap JavaScript 插件。我们还学习了如何通过设置自定义 `data-*` 属性和通过 JavaScript 来自定义它们。在使用 Bootstrap\
  \ 时，你应该尽可能利用内置插件，并避免编写自定义插件。\n\n# 第 5 章：深入探讨：自定义 Bootstrap\n\n想象一个 Web 世界，所有用 Bootstrap\
  \ 构建的网站看起来和感觉都一样。很无聊，对吧？幸运的是，我们有能力改变所处理的任何框架的默认样式。\n\nBootstrap 的许多组件和插件都有自己的默认样式。为了给它们注入个性化色彩，你需要替换它们的\
  \ CSS 规则并定义你自己的。\n\n在第一章， 中，我与你分享了一些基于 Bootstrap 构建的流行网站。它们都自定义了 Bootstrap 的 CSS，使它们的模板看起来独特且美丽。\n\
  \n在本章中，我们将讨论可以用来完全自定义 Bootstrap 默认样式的各种方法，并分析哪种方法更优以及为什么。最后，我们将尝试理解 Bootstrap 的\
  \ CSS 是如何编写的，使其成为高度响应式的框架。\n\n## 自定义 Bootstrap 样式表\n\n你可以通过多种方式自定义 Bootstrap。在本节中，我们将看到通过静态\
  \ CSS 文件和 Less 文件进行自定义。\n\n### 注意：什么是 Less？\n\n\n\n\n\n[Less](http://lesscss.org)\
  \ 是一种 CSS 处理器，它扩展了 CSS 的功能，添加了变量、混合宏（mixins）、函数等编程特性。它使 CSS 保持模块化、可维护和可扩展。Less 文件会被编译并生成\
  \ CSS 文件，然后你可以在项目中使用这些文件。\n\n如果你使用 Ruby 工作，[Sass](http://sass-lang.com) 是 Less 的替代方案。它也是\
  \ Bootstrap 支持的一种 CSS 处理器；然而，我们不会在书中介绍 Sass 的自定义。\n\nBootstrap 默认包附带的样式表是普通的 CSS\
  \ 文件。如果你使用文本编辑器打开静态 CSS 文件，你会发现许多选择器及其相关的 CSS 属性。你可能想直接在这些文件中修改 CSS 属性及其取值以节省时间，但我强烈建议不要这样做。\n\
  \n直接修改 CSS 文件有很多缺点。其中一些重要的缺点包括：\n\n*   更改是不可逆的。你将不再记得原始的 CSS 属性及其值，因此你无法恢复到原始的 Bootstrap\
  \ 样式。\n*   你对任何选择器所做的更改都可能破坏 Bootstrap 的响应式布局。\n*   调试变得非常困难；你需要理解 CSS 继承链才能找到父级选择器。\n\
  \n在我们开始自定义之前，让我们先设置本章将要使用的项目。一如既常，我们将使用在第 1 章 中创建的 `Bootstrap_demos` 项目。将所有内容复制到名为\
  \ `Chapter_5` 的新文件夹中。打开 `index.html`并将页面标题更改为“Customizing Bootstrap”。现在从 body 中移除\
  \ `<h1>` 标签。\n\n### 使用 CSS 自定义 Bootstrap\n\n这种类型的自定义通常被称为`覆盖默认 CSS`。我们实际上是用自己的不同值来重写\
  \ Bootstrap 的某些 CSS 属性。\n\n首先，我们在 `/css` 文件夹内创建一个名为 `app.css`（或你喜欢的名称）的新文件。然后我们打开\
  \ `index.html` 并链接到这个新的 CSS 文件。该新 CSS 文件的链接应该包含在 Bootstrap CSS 文件的链接下方：\n\n```\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"css/app.css\">\n```\n\n让我们添加一个 Bootstrap 按钮，如图\
  \ 5.1 所示。我们将用它来展示如何对其默认设计进行更改：\n\n```\n<div class=\"container\">\n    <a href=\"\
  #\" class=\"btn btn-primary btn-lg\">Big Fat Button</a>\n</div>\n```\n\n![我们的默认按钮](img/ch5Image1.png)\n\
  \n图 5.1. 我们的默认按钮\n\n现在我们将执行以下操作来自定义此按钮：\n\n*   移除按钮的圆角\n*   修改内边距（padding）大小\n*\
  \   调整字体大小\n*   更改背景颜色\n\n让我们开发者工具检查按钮。我们将使用 Chrome，如图 5.2 所示，但你也可以使用任何类似的工具，例如\
  \ Firefox 中的 Firebug。`padding`、`font-size` 和 `border-radius` 等属性来自 `btn` 类，而 `background`\
  \ 属性通过 `btn-primary` 类应用。要修改它们，我们需要在 CSS 文件 `app.css` 中使用相同的选择器来覆盖这些属性。\n\n![在 Chrome\
  \ 开发者工具中检查我们的按钮](img/ch5Image2.png)\n\n图 5.2. 在 Chrome 开发者工具中检查我们的按钮\n\n打开 app.css\
  \ 并添加以下 CSS：\n\n```\n.btn{\n    border-radius: 0; \n    padding: 5px 10px;\n   \
  \ font-size: 16px;\n}\n\n.btn-primary{\n    background: #63AEF0;\n}\n```\n\n如果我们刷新页面，我们的按钮现在看起来应该像图\
  \ 5.3 所示。\n\n![一个自定义的按钮](img/ch5Image3.png)\n\n图 5.3. 自定义的按钮\n\n请注意，我们使用了 Bootstrap\
  \ 类 `btn` 和 `btn-primary` 来覆盖 CSS 样式。从今以后，每当你使用 Bootstrap 按钮组件时，它将具有看起来像图 5.3 的更改样式。要恢复到原始样式，我们只需从\
  \ `app.css` 文件中删除 CSS 样式。\n\n如果你只想更改网页中特定按钮的样式，而不是针对 Bootstrap 的选择器，请使用 ID 来应用 CSS\
  \ 更改。\n\n### 使用 Less 自定义 Bootstrap\n\n如果你是 Less 开发者，你会喜欢这一节，因为有许多选项可以使用 Less 来自定义\
  \ Bootstrap。每个 Bootstrap 组件都有一个 Less 文件，以便方便地更改它们的属性。要访问所有 Less 文件，你需要下载特定版本的 Bootstrap。访问\
  \ [`getbootstrap.com/getting-started/`](http://getbootstrap.com/getting-started/)\
  \ 并选择 Download Source（下载源码）。该源码包包含了编译后的和原始的 .less 文件。\n\nLess 文件位于名为 `less` 的文件夹中。在这里，你会发现许多根据\
  \ Bootstrap 组件命名的 .less 文件。与特定组件相关的所有 CSS 属性和值都存在相应的 .less 文件中。你还会发现一个名为 `bootstrap.less`\
  \ 的文件，这是主 .less 文件。它导入了文件夹内存在的所有 .less 文件。你只需要编译这个文件即可生成自定义的 Bootstrap 样式表。让我们对文件夹中的所有文件进行分类。\n\
  \n#### Bootstrap 的变量和混合宏\n\nBootstrap 中使用的所有变量和混合宏都存在两个不同的文件中：\n\n1.  `variables.less`\
  \ 包含了 Bootstrap 中使用的所有标准颜色、默认响应式宽度值、默认内边距和边距值。如果你想进行任何此类更改，需要处理此文件。\n2.  `mixins.less`\
  \ 包含了用于生成厂商前缀以及动态计算网格宽度、占位符、按钮大小等的混合宏。\n\n#### 重置文件\n\n有两个重置文件用于清除浏览器的默认设置：\n\n\
  1.  `normalize.less` 清除了许多浏览器的默认设置，如字体族、字体大小、内边距和外边距、标题标签默认值、表单元素样式等。\n2.  `print.less`\
  \ 包含了用于打印支持的媒体查询。\n\n#### 核心文件\n\n有七个核心 .less 文件：\n\n*   `scaffolding.less` 包含了所有图片的辅助类（如\
  \ `.img-responsive` 和 `.img-circle`）、链接元素各种状态的样式、水平线、用于屏幕阅读器的样式等。\n*   `type.less`\
  \ 是一个排版文件，包含了标题标签、段落标签以及其他内容相关的辅助类（如 `.lead`、`.text-muted` 等）的各种样式。\n*   `code.less`\
  \ 包含了用于设置网页上显示的任何代码样式的 CSS 属性。\n*   `grid.less` 涉及应用于 Bootstrap 网格系统的所有 CSS 值。\n\
  *   `tables.less` 具有装饰 `<table>` 元素的样式。它还定义了表格的各种辅助类，如 `.table-condensed`、`.table-bordered`\
  \ 等。\n*   `forms.less` 美化表单元素，如文本字段、图例、复选框、单选按钮等。\n*   `buttons.less` 包含了各种类型 Bootstrap\
  \ 按钮的样式。所有与按钮相关的类都定义在这里。\n\n#### 组件文件\n\nBootstrap 中有 21 个组件文件。在前章中介绍的每个组件都有它们自己的\
  \ .less 文件。与组件相关的所有 CSS 定义都可以在其 .less 文件找到。\n\n*   `component-animations.less`\n\
  *   `glyphicons.less`\n*   `dropdowns.less`\n*   `button-groups.less`\n*   `input-groups.less`\n\
  *   `navs.less`\n*   `navbar.less`\n*   `breadcrumbs.less`\n*   `pagination.less`\n\
  *   `pager.less`\n*   `labels.less`\n*   `badges.less`\n*   `jumbotron.less`\n*\
  \   `thumbnails.less`\n*   `alerts.less`\n*   `progress-bars.less`\n*   `media.less`\n\
  *   `list-group.less`\n*   `panels.less`\n*   `wells.less`\n*   `close.less`\n\n\
  \n\n\n\n列表中还有一个文件，它本身并不是一个组件，即 `close.less`。它包含了用于模态框（modals）、警报（alerts）和其他元素关闭此特定组件的按钮\
  \ CSS 规则。\n\n### 插件文件\n\n四个 `.less` 文件定义了使用 Bootstrap 标记触发或创建的 JavaScript 插件的 CSS\
  \ 样式：\n\n* `modals.less`\n* `tooltip.less`\n* `popovers.less`\n* `carousel.less`\n\
  \n### 工具文件\n\n最后，我们在 Bootstrap 中有两个工具文件：\n\n* `utilities.less`\n* `responsive-utilities.less`\n\
  \n这些文件定义了有助于我们更好地组织 Bootstrap 组件的类。它们包含了一些非常有用的类，例如 `.clearfix` 用于清除组件周围所有元素的浮动，以及\
  \ `.hide` 和 `.show` 用于切换组件的可见性。`responsive-utilities.less` 包含了可见性工具，如 `.visible-lg`\
  \ 和 `.hidden-sm`。\n\n### 使用 Less 覆盖样式\n\n让我们使用 Less 来覆盖模态框的样式。我们将自定义 `modals.less`\
  \ 以应用扁平化（Metro 风格）设计，移除圆角并减少应用在上面的阴影。我们还将更改模态框的背景颜色和文本颜色。打开 `modals.less` 并进行这些更改。\n\
  \n模态框的圆角是通过 `modal-content` 类应用的。让我们在 `modals.less` 中找到这个选择器。它看起来应该是这样的：\n\n```\n\
  // Actual modal\n.modal-content {\n  position: relative;\n  background-color: @modal-content-bg;\n\
  \  border: 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback\
  \ (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius:\
  \ @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip:\
  \ padding-box;\n  // Remove focus outline from opened modal\n  outline: 0;\n}\n\
  ```\n\n从代码中，我们可以看到圆角来自 `border-radius` 属性，其值是在 `variables.less` 中初始化的 Less 变量。让我们注释掉这一行来移除圆角：\n\
  \n```\n// Actual modal\n.modal-content {\n  position: relative;\n  background-color:\
  \ @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
  \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
  //  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
  \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
  \  outline: 0;\n}\n```\n\n现在，我们必须减少阴影量。分析代码，我们可以看到 `.box-shdow()` mixin 负责生成 CSS\
  \ 中的阴影属性。该 mixin 定义在 `mixins.less` 文件中，阴影值作为值传递给该 mixin。让我们根据需求更改此值。阴影量由值中的第三个数字定义，它作为参数传递——目前是\
  \ 9px。让我们将这个数字减少到 2px。因此，我们的选择器现在看起来应该是这样：\n\n```\n// Actual modal\n.modal-content\
  \ {\n  position: relative;\n  background-color: @modal-content-bg;\n  border: 1px\
  \ solid @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8 etc)\n\
  \  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
  \  .box-shadow(0 3px 2px rgba(0,0,0,.5));\n  background-clip: padding-box;\n  //\
  \ Remove focus outline from opened modal\n  outline: 0;\n}\n```\n\n我们还需要更改其中一个媒体查询中的\
  \ `box-shadow` 值，这会覆盖之前的更改。我们很快就会学习媒体查询。但现在，你需要理解 Bootstrap 对不同尺寸的设备有不同的 CSS 规则。所以，让我们在\
  \ `modals.less` 中找到以下媒体查询：\n\n```\n// Scale up the modal\n@media (min-width: @screen-sm-min)\
  \ {\n  // 为更大的视口自动设置模态框宽度\n  .modal-dialog {\n    width: @modal-md;\n    margin:\
  \ 30px auto;\n  }\n  .modal-content {\n    .box-shadow(0 5px 15px rgba(0,0,0,.5));\n\
  \  }\n\n  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\n让我们将新的 `box-shadow`\
  \ 值传递给此媒体查询中的 `.box-shadow()` mixin：\n\n```less\n// Scale up the modal\n@media (min-width:\
  \ @screen-sm-min) {\n  // 为更大的视口自动设置模态框宽度\n  .modal-dialog {\n    width: @modal-md;\n\
  \    margin: 30px auto;\n  }\n  .modal-content {\n    .box-shadow(0 5px 2px rgba(0,0,0,.5));\n\
  \  }\n\n  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\n现在我们来更改模态框的背景颜色。我们将使用\
  \ `variables.less` 中预定义的变量 `@brand-info` 作为模态框的背景颜色。该变量初始化为 `#5bc0de`，这是一种浅蓝色。对于文本颜色，让我们使用变量\
  \ `@body-bg`，它在同一个文件中被设置为 `#fff`。修改后的 `modal-content` 选择器现在看起来像：\n\n```\n// Actual\
  \ modal\n.modal-content {\n  position: relative;\n  background-color: @modal-content-bg;\n\
  \  border: 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback\
  \ (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius:\
  \ @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip:\
  \ padding-box;\n  // Remove focus outline from opened modal\n  outline: 0;\n\n \
  \ background: @brand-info;\n  color: @body-bg;\n\n}\n```\n\n我们已经完成了所有计划的自定义，但让我们对\
  \ `modal-backdrop` 选择器进行最后的更改。`modal-backdrop` 是一个透明层，每当模态框组件被触发时，它就会出现在 `modal-content`\
  \ 之后。\n\n我们将此 `modal-background` 的背景颜色从黑色改为白色：\n\n```\n// Modal background\n.modal-backdrop\
  \ {\n  position: fixed;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index:\
  \ @zindex-modal-background;\n  background-color: @body-bg;\n  // Fade for backdrop\n\
  \  &.fade { .opacity(0); }\n  &.in { .opacity(@modal-backdrop-opacity); }\n}\n```\n\
  \n最后，我们完成了所有的自定义。现在是时候编译导入 `modals.less` 的 `bootstrap.less` 文件了。一旦 `.less` 文件编译生成\
  \ `bootstrap.css`，你就可以通过替换旧的 `bootstrap.css` 将其用于项目中（我们下一节讨论如何编译 Less 文件）。从此，每当你使用模态框组件时，它将使用自定义的样式。图\
  \ 5.4 显示了自定义的模态框截图。\n\n![Modal with Less](img/ch5less-demo-8.png)\n\n图 5.4. Modal\
  \ with Less\n\n### 编译 Less\n\n编译 Less 相对简单。在这里，我将向你展示一些标准的方法。\n\n#### 使用 Node\n\n\
  如果你安装了 Node，可以使用 Node 的包管理器安装 `less` 编译器：\n\n```\n$ npm install -g less\n```\n\n\
  一旦安装了 `less`，使用以下命令将 `bootstrap.less` 编译为 `bootstrap.css`。你必须在命令行中导航到 `/less` 文件夹，然后输入此命令：\n\
  \n```\n$ lessc bootstrap.less > bootstrap.css\n```\n\n### 使用第三方软件\n\n有很多用于编写和编译\
  \ Less 代码的 GUI 应用程序。一些流行的选项包括 [Crunch!](http://crunchapp.net/)、[SimpLESS,](http://wearekiss.com/simpless)\
  \ 和 [Mixture.](http://mixture.io/)。\n\n\n\n\n取消某个特定组件可能会同时取消依赖于它的其他组件。例如，在自定义页面中取消\
  \ `Forms`（表单）将自动取消 `Input groups`（输入组）和 `Navbar`（导航栏）。因此，在进行选择时需要小心！\n\n## 媒体查询与\
  \ Bootstrap\n\n`Media queries`（媒体查询）作为 CSS3 的一部分引入用于根据屏幕分辨率动态控制网站内容。它是今天每个可用响应式框架的核心技术之一。Bootstrap\
  \ 使用媒体查询来正确定义许多 CSS 规则，使其成为响应式框架。\n\n如果你想自定义 Bootstrap 的响应式网格系统，理解媒体查询非常重要。让我们来看一个简单的媒体查询：\n\
  \n```\n@media all and (min-width: 699px){\n    h1{\n        display: none;\n   \
  \ }\n}\n```\n\n每个媒体查询都应该包含一个媒体类型（media type）和一个表达式（expression）。`media type` 指定了链接文档将在何种类型的设备上显示。在这里，媒体类型是\
  \ `all`。`expression` 则使用 `media features`（媒体特性）进一步限制样式表的范围，例如宽度、高度和颜色。在这里，表达式是 `min-width:\
  \ 699px`。如果浏览器宽度大于 699px，此媒体查询将应用其中包含的 CSS 属性。因此，`h1` 元素将在宽 `699px` 的屏幕上隐藏。\n\n\
  我们有很多可用的媒体类型和媒体特性。媒体类型的示例包括 `all`、`print`、`screen` 和 `projection`。媒体特性的示例包括 `height`、`max-height`\
  \ 和 `max-width`。\n\nBootstrap 为各种设备尺寸定义了许多媒体查询以创建一个高度响应的框架。这里是 Bootstrap CSS 文件中的片段：\n\
  \n```\n@media (min-width: 768px) {\n  .container {\n    width: 750px;\n  }\n}\n\
  ```\n\n要了解更多关于媒体查询的信息，请参考 [Mozilla 开发者网络文档](https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Media_queries)。\n\
  \n## 总结\n\n在本章中，我们讨论了自定义 Bootstrap 的各种方法，并了解如何通过 CSS 和 Less 来自定义 Bootstrap。正如我们所看到的，Bootstrap\
  \ 为更改默认样式提供了许多选项，让你能够创建自己独特且美丽的设计。\n\n# 第 6 章：优化 Bootstrap\n\n我们已经到达了书的最后一章。我们真的走过了很远的一路，现在已经了使用\
  \ Bootstrap 构建专业响应式网站的能力。但拼图的最后一块是发现如何优化我们的作品，使它们不仅看起来良好，而且运行良好。\n\n在本章中，你将学习优化使用\
  \ Bootstrap 构建的网站（或者说，任何其他前端框架）的技术。我们将处理 CSS 和 JavaScript 的压缩化，并精简 Bootstrap 默认包。我们将尝试理解\
  \ Bootstrap 的局限性，并讨论使用它时常见的陷阱。\n\n## 优化技术\n\n网站需要既好看又好。网络用户已经变得不耐烦了，无论设计得多么漂亮，加载缓慢的网站都会被抛弃。\n\
  \n为了构建正确的模板，我们需要优化 CSS 文件、JavaScript 文件和图像。所有这些文件都通过单独的请求发送到浏览器，因此它们越轻，网站的整体性能就越好。\n\
  \n### 优化 CSS\n\n在处理 Bootstrap 框架时，我们通常会创建多个 CSS 文件。默认情况下，每个 Bootstrap 项目都包含一个包含在网站模板中的\
  \ `bootstrap.css` 文件。此外，我们通常会有自定义 CSS 文件来让网站看起来更有吸引力。这里是我们可以执行的任务，以减小网站模板中 CSS 文件的大小。\n\
  \n#### 使用压缩后的 Bootstrap CSS 文件\n\n正如上一章 所述，Bootstrap 允许开发者在开发模板时仅选择实际需要的组件。这减少了主\
  \ Bootstrap CSS 文件（`bootstrap.css`）的总体。一旦网站准备好，我们可以通过其压缩版本（`bootstrap.min.css`）进一步缩小此\
  \ CSS 文件的大小。\n\n#### 使用 Less 移除未使用的 Bootstrap 组件\n\n如果你喜欢通过 Less 编写 CSS，你可以通过其主\
  \ Less 文件（`bootstrap.less`）自定义 Bootstrap。如果你打开此文件，你会看到许多导入语句将各种 Bootstrap 组件聚合在一起。你可以注释掉与你的模板无关的导入语句。\n\
  \n例如，为了避免使用 Bootstrap 的标签（labels）、徽章（badges）和进度条（progress bars），你可以注释 `bootstrap.less`\
  \ 文件中的以下行：\n\n```\n@import \"labels.less\";\n@import \"badges.less\";\n@import \"\
  progress-bars.less\";\n```\n\n假设你不想使用任何 Bootstrap 的 JavaScript 插件。通过注释掉 `bootstrap.less`\
  \ 中的以下行来移除与它们相关的所有 CSS 规则以完全排除它们：\n\n```\n// Components w/ JavaScript\n@import \"\
  modals.less\";\n@import \"tooltip.less\";\n@import \"popovers.less\";\n@import \"\
  carousel.less\";\n```\n\n你还可以移除内置 Bootstrap 包的默认字体图标（glyphicons）。首先，你需要删除 fonts\
  \ 文件夹中所有的 `glyphicon-*` 字体文件。然后注释 `bootstrap.less` 文件中的以下导入语句：\n\n```\n@import \"\
  glyphicons.less\";\n```\n\n在你完成注释掉那些不需要的组件后，编译主 `bootstrap.less` 文件以生成 `bootstrap.css`。\n\
  \n#### 将 CSS 文件合并为一个文件\n\n在开发完网站模板后，你可能会留下一个版本的 Bootstrap CSS 和多个 CSS 文件。你可以将所有这些文件合并为一个\
  \ CSS 文件，这将有助于减少 HTTP 请求的数量以及所有文件的合并大小。\n\n有几种工具可以帮助你完成压缩过程。我最喜欢的之一是 [Twitter 的\
  \ Recess](http://twitter.github.io/recess/)，这是一个用于 CSS 的开源代码质量工具。你可以在 SitePoint\
  \ 上阅读[如何安装和使用 Recess](http://www.sitepoint.com/optimizing-css-stylesheets-recess/)。\n\
  \n让我们首先将所有 CSS 文件合并为一个名为 `application.css` 的主文件。可以使用 CSS 的 `@import` 语句如下所示：\n\n\
  ```\n@import url(\"bootstrap.min.css\");\n@import url(\"myCSSFile1.css\");\n@import\
  \ url(\"myCSSFile2.css\");\n@import url(\"myCSSFile3.css\");\n@import url(\"myCSSFile4.css\"\
  );\n```\n\n你需要确保在导入语句中提供相对于 `application.css` 的相对路径。\n\n接下来，在终端中运行 `recess` 命令：\n\
  \n```\nrecess path/to/application.css --compress > \n↵path/to/application.min.css\n\
  ```\n\n这将在相同文件夹创建一个名为 `application.min.css` 的新 CSS 文件。这个新 CSS 文件的大小比原始分离的文件小得多。\n\
  \n### 优化 JavaScript\n\n优化 JavaScript 文件与优化 CSS 文件同样重要。Bootstrap 提供了灵活的选项，可以移除我们在项目中不需要的任何\
  \ JavaScript 插件。这极极有助于减少主 JavaScript 文件 `bootstrap.js` 的大小。\n\n#### 使用压缩后的 Bootstrap\
  \ JavaScript 文件\n\n如果你希望能够使用所有的 Bootstrap JavaScript 插件，在项目项目生产环境时，应该包含压缩文件 `bootstrap.min.js`\
  \ 而不是 `bootstrap.js`。\n\n\n\n\n就像我们处理 CSS 组件一样，你可以前往 Bootstrap 的自定义页面，在下载之前取消勾选任何你不需要\
  \ JavaScript 插件。这是从 Bootstrap 中移除不需要的 JavaScript 插件最简单的方法。\n\nBootstrap 还为它的每个 JavaScript\
  \ 插件都提供了单独的 `.js` 文件。例如，它有用于模态框的 `modal.js` 和用于轮播图的 `carousel.js`。只有在你下载了 Bootstrap\
  \ 的源码包时，你才能访问这些单独的文件。\n\n### 注意：获取源码包\n\n你可以通过在[Bootstrap 下载页面](http://getbootstrap.com/getting-started/#download)\
  \ 选择“Download Source”（下载源码）来获取 Bootstrap 的源码包。\n\n下载完成后，你可以进入 `js` 文件夹找到与每个 Bootstrap\
  \ JavaScript 插件相关的所有 `.js` 文件。然后，你只需要将你需要的那些文件包含在项目中即可。\n\n### 将所有 JavaScript 文件合并为一个\n\
  \n就像处理 CSS 一样，将所有的 JavaScript 文件压缩成单个 `.js` 文件也是一个好主意。我最喜欢的 JavaScript 压缩工具之一是 `CompressJS`，你可以在它的[GitHub\
  \ 下载页面找到该包](https://github.com/dfsq/compressJS.sh)。使用 `CompressJS`，你需要提供所有 `.js`\
  \ 文件的路径，并用空格分隔。\n\n这是一个示例：\n\n```\n$ ./compressjs.sh jquery.min.js bootstrap.min.js\
  \ \n↵myCustomJavaScript.js\n```\n\n此命令将编译所有的 JavaScript 文件并在单个 `.js` 文件中输出。它会给压缩后的文件一个随机名称并告诉你文件名。如果你有许多\
  \ JavaScript 文件，可以将它们放在同一个文件夹中，并按如下方式一起编译：\n\n```\n$ ./compressjs.sh scripts/*.js\n\
  ```\n\n终端输出应该与图 6.1 类似。\n\n![Running CompressJS](img/ch6Image1.png)\n\n图 6.1 运行\
  \ CompressJS\n\n### 优化图片\n\n通常是图片导致网页加载缓慢缓慢。想象一种情况：我们需要显示一张分辨率为 500px x 500px 的图像，但我们拥有一张分辨率为\
  \ 2000px x 2000px 的图像。我们可以使用 Bootstrap 的辅助类 `img-responsive` 将较大的图像适应到 500px x 500px\
  \ 的 div 中；然而，虽然辅助类帮助正确显示了图像，但它并没有实际上缩小图片的文件大小。遗憾的是，Bootstrap 缺乏修复此问题的工具。\n\n有几种服务器端工具可以识别特定图片的请求类型，并在提供之前调整图片大小。我一直在使用的一些工具包括\
  \ [Adaptive Images](http://adaptive-images.com/) 和 [TimThumb，](http://www.binarymoon.co.uk/projects/timthumb/)，但我不会在书中介绍它们，因为它们是服务器端工具。可以在它们的官方网上找到安装和使用说明。\n\
  \n## 避免常见陷阱\n\n到这里，你已经理解 Bootstrap 是构建响应式网站最好的框架之一。有了 Bootstrap，无需为你的网站开发单独的移动版本。单一的响应式版本可以在任何设备上查看。\n\
  \n然而，Bootstrap 开发者在开发响应式网站时经常会陷入一些常见的陷阱。这些问题会导致你的网站在较小设备上运行缓慢且无响应，因此请注意：\n\n*  \
  \ **为特定设备使用不同的 HTML 标记**：新开发者经常利用 Bootstrap 的响应式实用程序功能（如 `hidden-sm` 和 `visible-sm`）来切换网站上各种组件的显示。他们在一个文档中编写不同版本的\
  \ HTML 标记，然后使用这些辅助类根据浏览器窗口的大小来切换组件的显示。通过这样做，他们忘记了 HTML 页面的总尺寸在增加，这会减慢渲染过程。因此，建议使用\
  \ Bootstrap 的网格系统在所有尺寸的浏览器中动态调整相同 HTML 标记的大小。\n\n*   **在目标为 IE8 及以下版本的应用程序中使用 Bootstrap**：我见过一些大型组织仍然兼容\
  \ Internet Explorer 8 及以下版本。虽然 Bootstrap 确实为 IE8 提供了支持，但有一些 CSS3 属性在其中无法工作，例如 `border-radius`\
  \ 和 `box-shadows`。因此，如果你的目标用户是 IE8 及更低版本，建议避免使用 Bootstrap。事实上，你绝对不应该在目标群体为 IE7 及以下版本的应用程序中使用\
  \ Bootstrap 3。\n\n*   **使用 Bootstrap 构建混合移动应用**：你应该避免使用 Bootstrap 创建使用 Web 技术开发并转移植到移动平台的混合应用。Bootstrap\
  \ 对于此类应用来说可能太重了。你反而可以使用 [Ratchet 框架，](http://goratchet.com)，它是专门为创建移动应用而开发的。Ratchet\
  \ 出自同一个 Bootstrap 团队，你可以在 SitePoint 上了解更多信息。](http://www.sitepoint.com/prototype-mobile-apps-easily-ratchet/)\n\
  \nBootstrap 团队通过修复已知问题和添加新功能来不断发布新版本。你也可以查看 Bootstrap 的官方 issues 页面，以跟踪[Bootstrap\
  \ 3 当前的已知问题](https://github.com/twbs/bootstrap/issues)。\n\n## 接下来该做什么\n\n俗话说，“熟熟能生巧。”你对\
  \ Bootstrap 练习得越多，对设计的控制力就越强。练习的一种方法是尝试使用 Bootstrap 重现流行响应式网站的设计。以下是一个你可以从中获取灵感的网站列表：\n\
  \n*   [Hudson's Bay Company](http://www3.hbc.com/)\n*   [Dribbble](http://dribbble.com/)\n\
  *   [Google+](http://plus.google.com)\n*   [Pinterest](http://www.pinterest.com)\n\
  *   [Zurb](http://www.zurb.com)\n*   [Sony](http://www.sony.com)\n*   [Microsoft](http://www.microsoft.com)\n\
  *   [Bootstrap](http://getbootstrap.com)\n\n我们在书中已经查看了一些内置的 Bootstrap 插件，但研究一些可提供的第三方\
  \ Bootstrap 插件也是值得的，因为它们可以为你的网站添加强大的功能。以下是一些最流行的选择：\n\n*   [FuelUX](https://github.com/ExactTarget/fuelux/tree/3.0.0-wip)\
  \ 添加了各种流行功能，如日期选择器、复选框、组合框、加载器、药丸框和树形。\n\n*   [Jasny Bootstrap](http://jasny.github.io/bootstrap/)\
  \ 引入了一些 Bootstrap 3 中未涵盖的重要功能。例如，off canvas（从屏幕侧面滑出的菜单，类似于移动设备应用）、行链接（将表格行转换为可点击链接）、输入掩码（强制用户按特定格式输入数据）以及文件输入（一种时尚的文件输入字段）。\n\
  \n*   [Bootstrap Lightbox](http://www.jasonbutz.info/bootstrap-lightbox/) 为 Bootstrap\
  \ 添加了灯箱功能。\n\n*   [Bootstrap Image Gallery](http://blueimp.github.io/Bootstrap-Image-Gallery/))\
  \ 为 Bootstrap 提供了一个功能齐全、即插用的图库。\n\n*   [Bootstrap Notifications](http://goodybag.github.io/bootstrap-notify/)\
  \ 赋予在屏幕任何地方显示漂亮通知的能力。\n\n*   [Bootstrap Markdown](http://toopay.github.io/bootstrap-markdown/)\
  \ 在 Bootstrap 中提供了 Markdown 编辑工具。\n\n*   [Bootstrap Colorpicker](http://www.eyecon.ro/bootstrap-colorpicker/)\
  \ 添加了颜色选择器组件。\n\n*   [Bootstrap Star Rating](http://plugins.krajee.com/star-rating)\
  \ 提供星级评分工具。\n\n你应该在未来的项目中尝试 Bootstrap，以感受它所承诺的快速开发环境。你也可以关注 SitePoint 上的 Bootstrap\
  \ 教程来探索更多。加油，Bootstrap 吧！\n\n"
