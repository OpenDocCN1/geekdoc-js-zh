    \ colors:\n\n*   `panel-primary` for dark blue\n\n*   `panel-success` for green\n\
    \n*   `panel-info` for sky blue\n\n*   `panel-warning` for yellow\n\n*   `panel-danger`\
    \ for red\n\n### Media Object\n\n**Media object** is used for creating components\
    \ that should contain left- or right-aligned media (image, video, or audio) alongside\
