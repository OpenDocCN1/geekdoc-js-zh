    \ 2.12. A 1-column layout on small screens\n\nFinally, we have a complete HTML\
    \ page that is responsive and works on any kind of display―the one-column layout\
    \ is shown in [Figure 2.12](#ch02.html_onecolumn \"Figure 2.12. A 1-column layout\
    \ on small screens\"). You can even host this project using a free cloud-based\
    \ service such as [Google Drive](https://drive.google.com/) and then test it on\
    \ an actual tablet or mobile device; alternatively, manually resize the browser\
    \ width and watch the layout change dynamically. I hope you found this case study\
    \ useful in understanding Bootstrap's grid system.\n\n## Nesting Columns\n\nYou\
    \ can always create a new set of 12 Bootstrap columns within any column in your\
    \ layout. This can be done by building a new `row` element within an existing\
    \ column and then filling this row with custom columns. Since we are starting\
    \ a new `row` here, any column within it can also span across 12 Bootstrap columns,\
    \ but the width of this row will be restricted to its parent's width.\n\nLet's\
    \ illustrate this with an example. Make a new HTML file in the project called\
    \ `nested.html`. Form the HTML markup with Bootstrap set up in it as discussed\
    \ in the [last chapter](#ch01.html \"Chapter 1Up, Close, and Personal with Bootstrap\"\
    ). In addition, link the CSS file `styles.css` that we created earlier in this\
    \ chapter. The markup of this new HTML file should look this:\n\n```html\n<!DOCTYPE\
    \ html>\n    <html lang=\"en\">\n      <head>\n        <meta charset=\"utf-8\"\
    >\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n       \
    \ <meta name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\">\n\
    \n        <title>My First Bootstrap Website</title>\n        <link rel=\"stylesheet\"\
    \ type=\"text/css\" \nhref=\"css/bootstrap.css\">\n\n        <!--[if lt IE 9]>\n\
    \          <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
    ></script>\n          <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    1.4.2/respond.min.js\"></script>\n        <![endif]-->\n\n      </head>\n    \
    \  <body>\n\n            <script src=\"js/jquery.js\"></script>\n            <script\
    \ src=\"js/bootstrap.js\"></script>\n      </body>\n    </html>\n```\n\nLet's\
    \ create a `container` and a `row` within it:\n\n```html\n<div class=\"container\"\
    >\n    <div class=\"row\">\n\n    </div>\n</div>\n```\n\nTargeting medium-sized\
    \ displays, we'll construct a two-column layout. By now, we know that to create\
    \ a two-column layout, we should span our columns to six Bootstrap columns. Hence,\
    \ the class for generating such columns will be `col-md-6`. Let's add two columns\
    \ to the previous markup:\n\n```html\n<div class=\"container\">\n    <div class=\"\
    row\">\n        <div class=\"col-md-6 col1\">\n            <h3>Column 1</h3>\n\
    \        </div>\n        <div class=\"col-md-6 col2\">\n            <h3>Column\
    \ 2</h3>\n        </div>\n    </div>\n</div>\n```\n\nIn this code, we have also\
    \ pulled two classes from our `styles.css` file: `col1` and `col2`. These two\
    \ classes will help us provide some background color to our columns. Now the HTML\
    \ page should look like the screenshot in [Figure 2.13](#ch02.html_basictwocols\
    \ \"Figure 2.13. A simple two-column layout\").\n\n![A simple two-column layout](figures/ch2Image6-1.png)\n\
    \nFigure 2.13. A simple two-column layout\n\nLet's now nest the first column “Column\
    \ 1” and start a new row within it:\n\n```html\n<div class=\"container\">\n  \
    \  <div class=\"row\">\n        <div class=\"col-md-6 col1\">\n            <h3>Column\
    \ 1</h3>\n            <!-- Nesting Starts -->\n            <div class=\"row\"\
    >\n\n            </div>\n        </div>\n        <div class=\"col-md-6 col2\"\
    >\n            <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n```\n\n\
    As we have a new `row`, let's form two columns again within it:\n\n```html\n<div\
    \ class=\"container\">\n    <div class=\"row\">\n        <div class=\"col-md-6\
    \ col1\">\n            <h3>Column 1</h3>\n            <!-- Nesting Starts -->\n\
    \            <div class=\"row\">\n                <div class=\"col-md-6 col3\"\
    >\n                    <h3>Column 4</h3>\n                </div>\n           \
    \     <div class=\"col-md-6 col4\">\n                    <h3>Column 5</h3>\n \
    \               </div>\n            </div>\n        </div>\n        <div class=\"\
    col-md-6 col2\">\n            <h3>Column 2</h3>\n        </div>\n    </div>\n\
    </div>\n```\n\nAs you can see in [Figure 2.14](#ch02.html_nestedtwocols \"Figure\
    \ 2.14. Nested two-column layout\"), the two new columns are now placed within\
    \ the first column. Here I have used the classes `col3` and `col4` from `styles.css`\
    \ to apply the background color.\n\n![Nested two-column layout](figures/ch2Image6-2.png)\n\
    \nFigure 2.14. Nested two-column layout\n\nThe ability to nest columns comes in\
    \ handy when creating complex layouts. You can also further nest the innermost\
    \ row and generate a new set of columns within it. This process can continue until\
    \ you achieve the desired layout.\n\n## Offsetting Columns\n\nOffsetting is another\
    \ great feature of Bootstrap's grid system. It is generally used to increase the\
    \ left margin of a column. For example, if you have a column that should appear\
    \ after a gap of three Bootstrap columns, you can use the offsetting feature.\n\
    \nClasses that are available for offsetting are:\n\n* `col-xs-offset-*`\n* `col-sm-offset-*`\n\
    * `col-md-offset-*`\n* `col-lg-offset-*`\n\nSuppose we want to move a column three\
    \ Bootstrap columns towards the right in extra-small displays, we can use the\
    \ class `\"col-xs-offset-3\"`, for example:\n\n```html\n<div class=\"row\">\n\
    \    <div class=\"col-xs-6 col-xs-offset-3 col1\">\n        <h1>Hello Learnable!</h1>\n\
    \    </div>\n</div>\n```\n\nThis code will result in a column that spans to six\
    \ columns, offset three columns towards the right as shown in [Figure 2.15](#ch02.html_offsetcols\
    \ \"Figure 2.15. An offset column\").\n\n![An offset column](figures/ch2Image7.png)\n\
    \nFigure 2.15. An offset column\n\n### Tip: Centering Your Column\n\nNote that\
    \ there's a three-column gap on both the left and right side of this column. This\
    \ is one of the best ways of centering a 50% width column in the middle of the\
    \ screen.\n\n## Reordering Grids Manually\n\nWe can also reorder the columns irrespective\
    \ of the order in which they're written in the code. If we have written a `col-md-9`\
    \ column first and then a `col-md-3` column, we can easily swap their position\
    \ when the HTML page is rendered by a browser. This is done using Bootstrap's\
    \ `pull` and `push` classes.\n\nClasses such as `col-xs-pull-*` and `col-xs-push-*`\
    \ are used to move a column towards the left and right respectively by a certain\
    \ number of columns. For example:\n\n```html\n<div class=\"row\">\n    <div class=\"\
    col-xs-9 col-xs-push-3\">\n        <h1>Pushed Column</h1>\n    </div>\n    <div\
    \ class=\"col-xs-3 col-xs-pull-9\">\n        <h1>Pulled Column</h1>\n    </div>\n\
    </div>\n```\n"
