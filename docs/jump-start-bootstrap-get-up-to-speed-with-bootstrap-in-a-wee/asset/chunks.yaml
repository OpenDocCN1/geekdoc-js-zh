  trans: "\n\n![](img/cover.png)\n\n# 目录\n\n- 序言\n- 1. 深入浅出地接触 Bootstrap\n- 2. Bootstrap\
    \ 网格系统\n- 3. 探索 Bootstrap 组件\n- 4. 趣味与实用的 Bootstrap 插件\n- 5. 深度定制：自定义 Bootstrap\n\
    - 6. 优化 Bootstrap\n\n![SitePoint®](img/sitepoint-logo.png)\n\n# 快速上手 Bootstrap\
    \ (JUMP START BOOTSTRAP)\n\n# 作者 ED FAZLE RAHMAN\n\n# 快速上手 Bootstrap\n\n作者 Syed\
    \ Fazle Rahman\n\nCopyright © 2014 SitePoint Pty. Ltd.\n\n产品经理：Simon Mackie\n\
    技术编辑：Ivaylo Gerchev\n英文编辑：Kelly Steele\n封面设计：Alex Walker\n\n## 权利声明\n\n所有权利保留。未经出版者书面许可，不得以任何形式或通过任何手段重本书的任何部分、存储在检索系统中或传输，但批判性文章或评论中的简短引文除外。\n\
    \n## 免责声明\n\n作者和出版者已尽一切确保书中信息的准确性。然而，本书中所包含的信息按原样出售，不提供任何明示或暗示的保证。作者和 SitePoint\
