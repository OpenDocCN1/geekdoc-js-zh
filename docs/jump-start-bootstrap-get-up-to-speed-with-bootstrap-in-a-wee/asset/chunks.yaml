    \ is a login form in the top navigation bar where both the username and password\
    \ fields are placed side-by-side.\n\nThe markup for an inline form is as follows:\n\
    \n```\n<div class=\"well well-sm\">\n    <form class=\"form-inline\">\n      \
    \  <div class=\"form-group\">\n            <input type=\"email\" class=\"form-control\"\
    \ id=\"emailField\" \n↵placeholder=\"Enter email\">\n        </div>\n\n      \
    \  <div class=\"form-group\">\n            <input type=\"password\" class=\"form-control\"\
    \ \n↵id=\"passwordField\" placeholder=\"Password\">\n        </div>\n\n      \
    \  <div class=\"checkbox\">\n            <label>\n              <input type=\"\
    checkbox\"> Remember me\n            </label>\n        </div>\n\n        <button\
    \ type=\"submit\" class=\"btn btn-primary\">Sign in\n↵</button>\n    </form>\n\
    </div>\n```\n\nThis should produce the inline form shown in [Figure 3.29](#ch03.html_inlineform\
    \ \"Figure 3.29. Inline form\").\n\n![Inline form](figures/ch3Image28-1.png)\n\
    \nFigure 3.29. Inline form\n\nThe only major difference between an inline form\
    \ and the previous forms is the name of the class. We have replaced the class\
    \ `form` with `form-inline` to make the form elements inline. In the previous\
    \ code, we have also wrapped the whole form content within a well component to\
    \ make it look even better.\n\nIf you look carefully in the above code, you'll\
    \ see that I have not used `form-group` for displaying a checkbox element. For\
    \ proper alignment of a checkbox and the text beside it, you should wrap both\
    \ of them inside a div classed as `checkbox`. In such cases, you should also place\
    \ the `input` elements inside the `label` elements so that the click-on text is\
    \ properly mapped to the corresponding `input` element.\n\nIn case you need a\
    \ radio button instead of a checkbox, replace the class `checkbox` with `radio`:\n\
    \n```\n<div class=\"radio\">\n  <label>\n    <input type=\"radio\" value=\"Male\"\
    >\n    Male\n  </label>\n</div>\n```\n\n### Helper Classes in Forms\n\nThere are\
    \ several additional “helper”classes available from Bootstrap that help in displaying\
    \ forms properly.\n\nIf you have used the `disabled` attribute to disable an input\
    \ element, Bootstrap has a style defined for it. For example, this code:\n\n```\n\
    <input class=\"form-control\" type=\"text\" \n↵placeholder=\"Disabled input here...\"\
    \ disabled>\n```\n\nwill look like [Figure 3.30](#ch03.html_disabledform \"Figure 3.30. Disabled\
    \ form inputs\").\n\n![Disabled form inputs](figures/ch3Image29.png)\n\nFigure 3.30. Disabled\
    \ form inputs\n\nBootstrap also has three validation states for input elements:\n\
    \n1.  `has-success`\n\n2.  `has-error`\n\n3.  `has-warning`\n\nHere's an example\
    \ of how validation state can be used:\n\n```\n<div class=\"form-group has-success\"\
    >\n    <label class=\"control-label\" for=\"inputField\">\n↵Input with success</label>\n\
    \    <input type=\"text\" class=\"form-control\" id=\"inputField\">\n</div>\n\
    ```\n\nApplying `has-success` will make the label text and border field green\
    \ in color. Similarly, `has-warning` will employ a dull brown color and `has-danger`\
    \ will use dark red. These **`has`-*** type classes will only apply colors to\
    \ `form-control`, `control-label`, and `help-block` classed elements. If you want\
    \ to show some custom text when a user enters invalid values in the input field,\
    \ use a `span` element with class `help-block`. The `help-block` will appear below\
    \ its corresponding input field when invalid values are entered.\n\n### Control\
    \ Sizing\n\nYou can vary the height of input elements using the **control sizing**\
    \ classes of Bootstrap:\n\n*   `input-lg` for bigger input elements than the default\
    \ size.\n\n*   `input-sm` for smaller input elements than the default size.\n\n\
    Here's some examples of them in use:\n\n```\n<input class=\"form-control input-lg\"\
    \ type=\"text\" \n↵placeholder=\"Larger Input Field\">\n<input class=\"form-control\"\
    \ type=\"text\" \n↵placeholder=\"Default Input Field\">\n<input class=\"form-control\
    \ input-sm\" type=\"text\" \n↵placeholder=\"Smaller Input Field\">\n```"
