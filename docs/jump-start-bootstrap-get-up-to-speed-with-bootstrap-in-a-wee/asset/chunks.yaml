  trans: "\n取消某个特定组件可能会同时取消依赖于它的其他组件。例如，在自定义页面中取消 `Forms`（表单）将自动取消 `Input groups`（输入组）和\
    \ `Navbar`（导航栏）。因此，在进行选择时需要小心！\n\n## 媒体查询与 Bootstrap\n\n`Media queries`（媒体查询）作为\
    \ CSS3 的一部分引入用于根据屏幕分辨率动态控制网站内容。它是今天每个可用响应式框架的核心技术之一。Bootstrap 使用媒体查询来正确定义许多 CSS\
    \ 规则，使其成为响应式框架。\n\n如果你想自定义 Bootstrap 的响应式网格系统，理解媒体查询非常重要。让我们来看一个简单的媒体查询：\n\n```\n\
    @media all and (min-width: 699px){\n    h1{\n        display: none;\n    }\n}\n\
    ```\n\n每个媒体查询都应该包含一个媒体类型（media type）和一个表达式（expression）。`media type` 指定了链接文档将在何种类型的设备上显示。在这里，媒体类型是\
    \ `all`。`expression` 则使用 `media features`（媒体特性）进一步限制样式表的范围，例如宽度、高度和颜色。在这里，表达式是\
    \ `min-width: 699px`。如果浏览器宽度大于 699px，此媒体查询将应用其中包含的 CSS 属性。因此，`h1` 元素将在宽 `699px`\
    \ 的屏幕上隐藏。\n\n我们有很多可用的媒体类型和媒体特性。媒体类型的示例包括 `all`、`print`、`screen` 和 `projection`。媒体特性的示例包括\
    \ `height`、`max-height` 和 `max-width`。\n\nBootstrap 为各种设备尺寸定义了许多媒体查询以创建一个高度响应的框架。这里是\
    \ Bootstrap CSS 文件中的片段：\n\n```\n@media (min-width: 768px) {\n  .container {\n\
    \    width: 750px;\n  }\n}\n```\n\n要了解更多关于媒体查询的信息，请参考 [Mozilla 开发者网络文档](https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Media_queries)。\n\
    \n## 总结\n\n在本章中，我们讨论了自定义 Bootstrap 的各种方法，并了解如何通过 CSS 和 Less 来自定义 Bootstrap。正如我们所看到的，Bootstrap\
    \ 为更改默认样式提供了许多选项，让你能够创建自己独特且美丽的设计。\n\n# 第 6 章：优化 Bootstrap\n\n我们已经到达了书的最后一章。我们真的走过了很远的一路，现在已经了使用\
    \ Bootstrap 构建专业响应式网站的能力。但拼图的最后一块是发现如何优化我们的作品，使它们不仅看起来良好，而且运行良好。\n\n在本章中，你将学习优化使用\
    \ Bootstrap 构建的网站（或者说，任何其他前端框架）的技术。我们将处理 CSS 和 JavaScript 的压缩化，并精简 Bootstrap 默认包。我们将尝试理解\
    \ Bootstrap 的局限性，并讨论使用它时常见的陷阱。\n\n## 优化技术\n\n网站需要既好看又好。网络用户已经变得不耐烦了，无论设计得多么漂亮，加载缓慢的网站都会被抛弃。\n\
    \n为了构建正确的模板，我们需要优化 CSS 文件、JavaScript 文件和图像。所有这些文件都通过单独的请求发送到浏览器，因此它们越轻，网站的整体性能就越好。\n\
    \n### 优化 CSS\n\n在处理 Bootstrap 框架时，我们通常会创建多个 CSS 文件。默认情况下，每个 Bootstrap 项目都包含一个包含在网站模板中的\
    \ `bootstrap.css` 文件。此外，我们通常会有自定义 CSS 文件来让网站看起来更有吸引力。这里是我们可以执行的任务，以减小网站模板中 CSS\
    \ 文件的大小。\n\n#### 使用压缩后的 Bootstrap CSS 文件\n\n正如上一章 所述，Bootstrap 允许开发者在开发模板时仅选择实际需要的组件。这减少了主\
    \ Bootstrap CSS 文件（`bootstrap.css`）的总体。一旦网站准备好，我们可以通过其压缩版本（`bootstrap.min.css`）进一步缩小此\
    \ CSS 文件的大小。\n\n#### 使用 Less 移除未使用的 Bootstrap 组件\n\n如果你喜欢通过 Less 编写 CSS，你可以通过其主\
    \ Less 文件（`bootstrap.less`）自定义 Bootstrap。如果你打开此文件，你会看到许多导入语句将各种 Bootstrap 组件聚合在一起。你可以注释掉与你的模板无关的导入语句。\n\
    \n例如，为了避免使用 Bootstrap 的标签（labels）、徽章（badges）和进度条（progress bars），你可以注释 `bootstrap.less`\
    \ 文件中的以下行：\n\n```\n@import \"labels.less\";\n@import \"badges.less\";\n@import\
    \ \"progress-bars.less\";\n```\n\n假设你不想使用任何 Bootstrap 的 JavaScript 插件。通过注释掉 `bootstrap.less`\
    \ 中的以下行来移除与它们相关的所有 CSS 规则以完全排除它们：\n\n```\n// Components w/ JavaScript\n@import\
    \ \"modals.less\";\n@import \"tooltip.less\";\n@import \"popovers.less\";\n@import\
    \ \"carousel.less\";\n```\n\n你还可以移除内置 Bootstrap 包的默认字体图标（glyphicons）。首先，你需要删除\
    \ fonts 文件夹中所有的 `glyphicon-*` 字体文件。然后注释 `bootstrap.less` 文件中的以下导入语句：\n\n```\n\
    @import \"glyphicons.less\";\n```\n\n在你完成注释掉那些不需要的组件后，编译主 `bootstrap.less` 文件以生成\
    \ `bootstrap.css`。\n\n#### 将 CSS 文件合并为一个文件\n\n在开发完网站模板后，你可能会留下一个版本的 Bootstrap\
    \ CSS 和多个 CSS 文件。你可以将所有这些文件合并为一个 CSS 文件，这将有助于减少 HTTP 请求的数量以及所有文件的合并大小。\n\n有几种工具可以帮助你完成压缩过程。我最喜欢的之一是\
    \ [Twitter 的 Recess](http://twitter.github.io/recess/)，这是一个用于 CSS 的开源代码质量工具。你可以在\
    \ SitePoint 上阅读[如何安装和使用 Recess](http://www.sitepoint.com/optimizing-css-stylesheets-recess/)。\n\
    \n让我们首先将所有 CSS 文件合并为一个名为 `application.css` 的主文件。可以使用 CSS 的 `@import` 语句如下所示：\n\
    \n```\n@import url(\"bootstrap.min.css\");\n@import url(\"myCSSFile1.css\");\n\
    @import url(\"myCSSFile2.css\");\n@import url(\"myCSSFile3.css\");\n@import url(\"\
    myCSSFile4.css\");\n```\n\n你需要确保在导入语句中提供相对于 `application.css` 的相对路径。\n\n接下来，在终端中运行\
    \ `recess` 命令：\n\n```\nrecess path/to/application.css --compress > \n↵path/to/application.min.css\n\
    ```\n\n这将在相同文件夹创建一个名为 `application.min.css` 的新 CSS 文件。这个新 CSS 文件的大小比原始分离的文件小得多。\n\
    \n### 优化 JavaScript\n\n优化 JavaScript 文件与优化 CSS 文件同样重要。Bootstrap 提供了灵活的选项，可以移除我们在项目中不需要的任何\
    \ JavaScript 插件。这极极有助于减少主 JavaScript 文件 `bootstrap.js` 的大小。\n\n#### 使用压缩后的 Bootstrap\
    \ JavaScript 文件\n\n如果你希望能够使用所有的 Bootstrap JavaScript 插件，在项目项目生产环境时，应该包含压缩文件 `bootstrap.min.js`\
    \ 而不是 `bootstrap.js`。\n"
- fmt: "\nJust like we did for CSS components, you can head over to Bootstrap's customization\
    \ page and deselect any JavaScript plugins you don't need before downloading.\
    \ This can be the easiest way of removing unwanted JavaScript plugins from Bootstrap.\n\
    \nBootstrap also comes with a separate `.js` file for each of its JavaScript plugins.\
    \ For example, it has `modal.js` for modals and `carousel.js` for carousels. You\
    \ can access these individual files only if you have downloaded Bootstrap's source\
    \ package.\n\n### Note: Going to the Source Package\n\nBootstrap's source package\
    \ can be obtained by selecting the Download Source option at the [Bootstrap download\
    \ page.](http://getbootstrap.com/getting-started/#download)\n\nOnce downloaded,\
    \ you can head over to the `js` folder to find all the `.js` files related to\
    \ each of Bootstrap's JavaScript plugins. You can then include just those files\
    \ in your project that you want to use.\n\n### Compress All the JavaScript Files\
    \ into One\n\nJust as with CSS, it is a good idea to have all your JavaScript\
    \ files compressed into a single `.js` file. One of my favorite JavaScript compression\
    \ tools is `CompressJS`, which is found on its [GitHub page to download the package.](https://github.com/dfsq/compressJS.sh)\
    \ With `CompressJS`, you have to provide the paths to all the `.js` files with\
    \ a space between them.\n\nHere's an example:\n\n```\n$ ./compressjs.sh jquery.min.js\
    \ bootstrap.min.js \n↵myCustomJavaScript.js\n```\n\nThis command will compile\
    \ all the JavaScript files and produce the output in a single `.js` file. It gives\
    \ a random name to the compressed file and tells you the filename. If you have\
    \ many JavaScript files, you can place them all in a single folder and compile\
    \ them together as follows:\n\n```\n$ ./compressjs.sh scripts/*.js\n```\n\nThe\
    \ terminal output should be similar to [Figure 6.1](#ch06.html_compressjs \"Figure\
    \ 6.1. Running CompressJS\").\n\n![Running CompressJS](figures/ch6Image1.png)\n\
    \nFigure 6.1. Running CompressJS\n\n### Optimizing Images\n\nIt is often the images\
    \ that cause the slow loading of web pages. Imagine a situation where we need\
    \ to display an image of resolution 500px by 500px but instead we have an image\
    \ of resolution 2000px by 2000px. We can use Bootstrap's helper class `img-responsive`\
    \ to fit that bigger image into a 500px by 500px div; however, while the helper\
    \ class has assisted in displaying the image properly, it hasn't actually reduced\
    \ the file size of the image. Unfortunately, Bootstrap lacks the tools to fix\
    \ this issue.\n\nThere are several server-side tools that can identify the request\
    \ type of a particular image and then resize the image before serving it. Some\
    \ of the tools I've been using are [Adaptive Images](http://adaptive-images.com/)\
    \ and [TimThumb,](http://www.binarymoon.co.uk/projects/timthumb/) but I won't\
    \ be covering them in this book as they are server-side tools. Installation and\
    \ usage instructions are available on their official websites.\n\n## Avoiding\
    \ Common Pitfalls\n\nBy now, you'll understand that Bootstrap is one of the best\
    \ frameworks for building responsive websites. With Bootstrap, there's no need\
    \ to develop a separate mobile version of your site. A single responsive version\
    \ can be viewed on any kind of device.\n\nYet there are a few common pitfalls\
    \ that Bootstrap developers often fall into while developing responsive websites.\
    \ These issues can make your websites slow and non-responsive in smaller devices,\
    \ so be aware of them:\n\n*   **Using different HTML markup for specific devices**:\
    \ New developers often take advantage of Bootstrap's responsive utility features\
    \ such as `hidden-sm` and `visible-sm` to toggle the display of various components\
    \ on a website. They write different versions of the HTML markup in one document\
    \ and then use these helper classes to toggle the component display as per the\
    \ browser window size. By doing this they forget that the overall size of the\
    \ HTML page is increasing, which will slow down the rendering process. Hence,\
    \ it is advisable to use Bootstrap's grid system to dynamically resize the same\
    \ HTML markup in browsers of all sizes.\n\n*   **Using Bootstrap in applications\
    \ that target IE8 and below**: I have seen larger organizations that still target\
    \ compatibility with Internet Explorer version 8 and below. Though Bootstrap does\
    \ provide support for IE8, there are some CSS3 properties that will fail to work\
    \ in it such as `border-radius` and `box-shadows`. Therefore it is advisable to\
    \ avoid using Bootstrap if your target audience is IE8 and lower. In fact, you\
    \ definitely should not use Bootstrap 3 in applications that target audiences\
    \ with IE7 and below.\n\n*   **Using Bootstrap to make hybrid mobile applications**:\
    \ You should avoid using Bootstrap to create hybrid applications that are developed\
    \ using web-based technologies and then ported into mobile platforms. Bootstrap\
    \ can be too heavy for such applications. You can instead use the [Ratchet framework,](http://goratchet.com)\
    \ which is developed especially for creating mobile applications. Ratchet comes\
    \ from the same Bootstrap team, and you can [learn more about it on SitePoint.](http://www.sitepoint.com/prototype-mobile-apps-easily-ratchet/)\n\
    \nThe Bootstrap team keeps on releasing newer versions by fixing known problems\
    \ and adding new features. You can also check out Bootstrap's official issues\
    \ page to keep track of [current known issues with Bootstrap 3.](https://github.com/twbs/bootstrap/issues)\n\
    \n## Where to Go From Here\n\nAs the saying goes, “practice makes perfect.” The\
    \ more you practice with Bootstrap, the better control you have on your designs.\
    \ One way to practice is to try to recreate the designs of popular responsive\
    \ websites using Bootstrap. Here's a list of websites you can take inspiration\
    \ from:\n\n*   [Hudson's Bay Company](http://www3.hbc.com/)\n*   [Dribbble](http://dribbble.com/)\n\
    *   [Google+](http://plus.google.com)\n*   [Pinterest](http://www.pinterest.com)\n\
    *   [Zurb](http://www.zurb.com)\n*   [Sony](http://www.sony.com)\n*   [Microsoft](http://www.microsoft.com)\n\
    *   [Bootstrap](http://getbootstrap.com)\n\nWe've taken a look at some built-in\
    \ Bootstrap plugins in this book, but it's also worth investigating some of the\
    \ third-party Bootstrap plugins that are available as they can add powerful features\
    \ to your sites. Here's a selection of the most popular:\n\n*   [FuelUX](https://github.com/ExactTarget/fuelux/tree/3.0.0-wip)\
    \ adds various popular features such as datepicker, checkbox, combobox, loader,\
    \ pill box, and tree.\n\n*   [Jasny Bootstrap](http://jasny.github.io/bootstrap/)\
    \ brings in some important features that were not available in Bootstrap 3\\.\
    \ For example, off canvas (a slide-out menu from either side of the screen like\
    \ in apps for mobile devices), row link (converting table rows into clickable\
    \ links), input mask (forcing user to enter data in a specific format), and file\
    \ input (a stylish file input field).\n\n*   [Bootstrap Lightbox](http://www.jasonbutz.info/bootstrap-lightbox/)\
    \ adds an image lightbox feature to Bootstrap.\n\n*   [Bootstrap Image Gallery](http://blueimp.github.io/Bootstrap-Image-Gallery/))\
    \ comes with a fully functional, ready-to-use image gallery for Bootstrap.\n\n\
    *   [Bootstrap Notifications](http://goodybag.github.io/bootstrap-notify/) gives\
    \ the capability to display fancy notifications anywhere on the screen.\n\n* \
    \  [Bootstrap Markdown](http://toopay.github.io/bootstrap-markdown/) provides\
    \ markdown editing tools in Bootstrap.\n\n*   [Bootstrap Colorpicker](http://www.eyecon.ro/bootstrap-colorpicker/)\
    \ adds a color-picker widget.\n\n*   [Bootstrap Star Rating](http://plugins.krajee.com/star-rating)\
    \ provides star rating tools.\n\nYou should try out Bootstrap in your upcoming\
    \ projects to get a feel for the rapid development environment that it promises.\
    \ You can also follow the Bootstrap tutorials on SitePoint to explore more. Keep\
    \ Bootstrapping!\n"
