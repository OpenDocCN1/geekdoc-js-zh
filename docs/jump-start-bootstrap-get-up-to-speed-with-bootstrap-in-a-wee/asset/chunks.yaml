    \  </a>\n            <div class=\"media-body\">\n                <h4 class=\"\
    media-heading\">Awesome piece of \nwork!</h4>\n                <p>Lorem ipsum\
    \ dolor sit amet, consectetur ...</p>\n            </div>\n        </div>\n\n\
    \    </div>\n</div>\n```\n\n图 3.6 展示了我们的嵌套媒体对象。\n\n![嵌套媒体对象](img/ch3Image6.png)\n\
    \n图 3.6. 嵌套媒体对象\n\n你可以根据需要使用任意层数的嵌套。\n\n### 缩略图 (Thumbnails)\n\n使用 Bootstrap 的\
    \ `thumbnails` 组件显示图像和视频缩略图轻而易举。它通过应用形成方框的边框，用于展示具有点击吸引力的图像和视频。它还带有一个整洁的悬停效果，通过将边框颜色变为蓝色来突出显示选中的缩略图。\n\
    \n以下是创建缩略图的标记代码：\n\n```\n<a href=\"#\" class=\"thumbnail\">\n    <img src=\"path/to/image\"\
    >\n</a\n```\n\n让我们使用 Bootstrap 的网格系统创建一个四列布局。我们将在每列中放置一张图像，然后对每张图像应用缩略图标记。\n\n\
    正如在上一一章 所示，我们将使用 `col-xs-3` 类来创建一个四列布局：\n\n```\n<div class=\"row\">\n    <div\
    \ class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\">\n          \
    \  <img src=\"path/to/image\">\n        </a>\n    </</div>\n    <div class=\"\
    col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\">\n            <img src=\"\
    path/to/image\">\n        </a>\n    </</div>\n    <div class=\"col-xs-3\">\n \
    \       <a href=\"#\" class=\"thumbnail\">\n            <img src=\"path/to/image\"\
    >\n        </a>\n    </</div>\n    <div class=\"col-xs-3\">\n        <a href=\"\
    #\" class=\"thumbnail\">\n            <img src=\"path/to/image\">\n        </a>\n\
    \    </</div>\n</</div>\n```\n\n这产生了图 3.7 所示的结果。\n\n![缩略图](img/ch3Image7.png)\n\
    \n图 3.7. 缩略图\n\n尝试将鼠标图标悬停在每张图像上，你会得到一个漂亮的高亮效果。在上述代码中，你可以看到我已锚点标签 `<a>` 应用了 `thumbnail`\
    \ 类。你也可以使用 `<div>` 标签代替锚点标签来表示缩略图。\n\n让我们为每个缩略图添加标题。我们只需要在 `<img>` 标签正下方添加一个类为\
    \ `caption` 的额外 `<div>`。我们带有标题的缩略图代码段应该是：\n\n```\n<a href=\"#\" class=\"thumbnail\"\
    >\n    <img src=\"path/to/image\">\n    <div class=\"caption\">\n        <h3>标题在此处输入！</h3>\n\
    \    </div>\n</a\n```\n```\n\n如果你为页面上的每个缩略图都应用标题，它将产生与图 3.8 相似的结果。\n\n![带标题的缩略图](img/ch3Image8.png)\n\
    \n图 3.8. 带标题的缩略图\n\n你还可以为每个缩略图添加一些摘要和一个“阅读更多”按钮，以链接到网站中的不同页面。为此，我们首先需要将带有 `thumbnail`\
    \ 类的链接元素替换为 `<div>` 元素。然后我们在 `caption` `<div>` 内部使用 `<p>` 添加摘要，并在同一个 `caption`\
    \ `<div>` 内部添加一个带有“阅读更多”锚点以及 `btn` 和 `btn-primary` 类的链接。在进行这些更改后，我们文章缩略图的最终标记如下：\n\
    \n```\n<div class=\"thumbnail\">\n    <img src=\"images/microsoft.png\">\n   \
    \ <div class=\"caption\">\n        <h3>Microsoft</h3>\n        <p>Lorem ipsum\
    \ dolor sit amet, consectetur ...</p>\n        <p><a href=\"#\" class=\"btn btn-primary\"\
    >阅读更多</a></p>\n    </div>\n</div>\n```\n\n上述代码将产生与图 3.9 相似的结果。\n\n![带有“阅读更多”链接的标题](img/ch3Image9.png)\n\
    \n图 3.9. 带有“阅读更多”链接的标题\n\n### 列表组 (List Group)\n\n尽管如此，列表组可以做的事情不仅仅是构建简单的列表。如果你想创建一个每个项目都包含某些文本内容以及标题的列表，可以使用以下代码：\n\
    \n```\n<a href=\"#\" class=\"list-group-item\">\n    <h4 class=\"list-group-item-heading\"\
    >项目标题</h4>\n    <p class=\"list-group-item-text\">Lorem ipsum dolor sit ...</p>\n\
    </a\n```\n\n我们还可以通过在 `list-group-item` 基础上添加 `list-group-item-*` 类为每个项目应用不同的颜色。它们如下：\n\
    \n- success（成功）\n- info（信息）\n- warning（警告）\n- danger（危险）\n\n例如，在下面的列表的 `list-group-item`\
    \ 类中添加 `list-group-item-success` 将使其它变为浅绿色：\n\n```\n<li class=\"list-group-item\
    \ list-group-item-success\">收件箱</li\n```\n\n### 列表组 (List Group)\n\n当你想要显示链接列表时，根据你的父级\
    \ `<ul>` 或 `<div>`，你应该使用锚点 `<a>` 而不是列表 `<li>`。\n\n我们还可以使用徽章（badge）组件在每个项目旁边显示一个数字。我们稍后会学习更多关于徽章的知识，但现在你可以添加以下代码段：\n\
    \n```\n<span class=\"badge\">14</span>\n```\n\n所以我们更新后的列表现在看起来像图 3.11。\n\n![更新后的列表](img/ch3Image11.png)\n\
    \n图 3.11. 更新后的列表\n\n### 提示 (Tip)：列表\n\n当你想要显示链接列表时，根据你的父级 `<ul>` 或 `<div>`，你应该使用锚点\
    \ `<a>` 而不是列表 `<li>`。\n\n我们还可以使用徽章（badge）组件在每个项目旁边显示一个数字。我们稍后会学习更多关于徽章的知识，但现在你可以添加以下代码段：\n\
    \n```\n<span class=\"badge\">14</span>\n```\n\n"
- fmt: "\n`Navs` are a group of links that are placed inline with each other to be\
    \ used for navigation. We have options to make this group of links appear either\
    \ as tabs or small buttons, the latter known as `pills` in Bootstrap. We will\
    \ first learn how to create tab-like links and then proceed to create pill-like\
    \ links.\n\nWe create tab-like navigation links like so:\n\n```\n<ul class=\"\
    nav nav-tabs\">\n    <li class=\"active\"><a href=\"#\">About</a></li>\n    <li><a\
    \ href=\"#\">Activity</a></li>\n    <li><a href=\"#\">Liked Pages</a></li>\n</ul>\n\
    ```\n\nHere's a screenshot of what they look like([Figure 3.13](#ch03.html_tablikenav\
    \ \"Figure 3.13. Tab-like navigation\")).\n\n![Tab-like navigation](figures/ch3Image13.png)\n\
    \nFigure 3.13. Tab-like navigation\n\nThe class `nav` is common to both tabs and\
    \ pills. We've added the `nav-tabs` class to make our navigation bar look like\
    \ tabs.\n\nWe create pill-like navigation links this way (and seen following in\
    \ [Figure 3.14](#ch03.html_pillikenav \"Figure 3.14. Pill-like navigation\")):\n\
    \n```\n<ul class=\"nav nav-pills\">\n    <li class=\"active\"><a href=\"#\">About</a></li>\n\
    \    <li><a href=\"#\">Activity</a></li>\n    <li><a href=\"#\">Liked Pages</a></li>\n\
    </ul>\n```\n\n![Pill-like navigation](figures/ch3Image14-1.png)\n\nFigure 3.14.\
    \ Pill-like navigation\n\nHere, we have replaced the class `nav-tabs` with class\
    \ `nav-pills`, which make the same list look like pills.\n\nWe can also vertically\
    \ stack these pills by attaching an additional class `nav-stacked` to it:\n\n\
    ```\n<ul class=\"nav nav-pills nav-stacked\">\n    <li class=\"active\"><a href=\"\
    #\">About</a></li>\n    <li><a href=\"#\">Activity</a></li>\n    <li><a href=\"\
    #\">Liked Pages</a></li>\n</ul>\n```\n\n[Figure 3.15](#ch03.html_stackedpills\
    \ \"Figure 3.15. Stacked pill-like nav\") shows some vertically stacked pill navigation.\n\
    \n![Stacked pill-like nav](figures/ch3Image14-2.png)\n\nFigure 3.15. Stacked pill-like\
    \ nav\n\n## Navbar\n\nThe `Navbar` is one of the most interesting Bootstrap components.\
    \ Novice developers often find constructing navigation bars as one of the most\
    \ daunting aspects of website development. It brings many challenges, such as\
    \ ensuring proper alignment with the header as well as the rest of the body. Properly\
    \ aligning links, the search bar, and drop-down menus inside a navigation bar\
    \ can make the job even harder.\n\nBootstrap makes creating navigation bars very\
    \ easy. It comes with various options to build all types of navigation bars that\
    \ are responsive, automatically collapsing when the screen's size is small.\n\n\
    We'll first cover how to create a simple navbar with Bootstrap, and then move\
    \ on to form more complex ones.\n\nFirst, we'll build a `div` element, with two\
    \ classes `navbar` and `navbar-default`. These classes are important to Bootstrap\
    \ as they identify where to apply the navigation bar styles and effects:\n\n```\n\
    <div class=\"navbar navbar-default\">\n</div>\n```\n\nNext, we'll use a div with\
    \ class `container-fluid` inside this `navbar` element. This will wrap all the\
    \ contents of the navbar and create a full-width container inside it:\n\n```\n\
    <div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\">\n\n\
    \    </div>\n</div>\n```\n\nNow, let's start inserting other elements inside the\
    \ navbar. First, we'll place a div with class `navbar-header`. This will be used\
    \ for website branding purposes, such as displaying the name of the website or\
    \ its logo. We'll also place a hidden button inside the `navbar-header` element\
    \ that will be visible only in smaller screens where the navbar collapses. This\
    \ hidden button will be later used to expand the collapsed menu in smaller screens:\n\
    \n```\n<div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\"\
    >\n        <div class=\"navbar-header\">\n          <button type=\"button\" class=\"\
    navbar-toggle\" \ndata-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n\
    \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
    ></span>\n            <span class=\"icon-bar\"></span>\n          </button>\n\
    \          <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n\
    \    </div>\n</div>\n```\n\nIn the code, we have placed a button with a class\
    \ `navbar-toggle` that is used by Bootstrap to activate the navbar's toggling\
    \ behavior. It should have two custom data- type attributes: `data-toggle` and\
    \ `data-target`. `data-toggle` tells the script what to do when the button is\
    \ clicked, whereas `data-target` tells which section to toggle when clicked. Here,\
    \ the `data-target` attribute is holding an id of a section that we're yet to\
    \ define. That section will be toggled when the button is clicked. The `span`\
    \ elements inside the button are used for displaying the icon.\n\nWe have also\
    \ defined an `a` element with class `navbar-brand` that holds the name of our\
    \ website. At this point, you should check what the code renders to in your browser.\
    \ It should display as shown in [Figure 3.16](#ch03.html_navbar \"Figure 3.16.\
    \ A navbar\").\n\n![A navbar](figures/ch3Image15.png)\n\nFigure 3.16. A navbar\n\
    \nTry resizing the browser window to a smaller size. You should see the navbar\
    \ displaying the hidden button on smaller windows, as shown in [Figure 3.17](#ch03.html_navbarsmall\
    \ \"Figure 3.17. Our navbar on smaller displays\").\n\n![Our navbar on smaller\
    \ displays](figures/ch3Image16.png)\n\nFigure 3.17. Our navbar on smaller displays\n\
    \nNext, we'll create another div that will be the sibling of `navbar-header`;\
    \ that is, it is present at the same level in the markup hierarchy. We will give\
    \ two classes to this element: `collapse` and `navbar-collapse`. As this div will\
    \ contain the navbar content, we'll give the id `mynavbar-content` to it, the\
    \ same id that is mentioned inside the `data-toggle` attribute of the hidden button.\
    \ The code should now look like:\n\n```\n<div class=\"navbar navbar-default\"\
    >\n    <div class=\"container-fluid\">\n        <div class=\"navbar-header\">\n\
    \          <button type=\"button\" class=\"navbar-toggle\" \ndata-toggle=\"collapse\"\
    \ data-target=\"#mynavbar-content\">\n            <span class=\"icon-bar\"></span>\n\
    \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
    ></span>\n          </button>\n          <a class=\"navbar-brand\" href=\"#\"\
    >SitePoint</a>\n        </div>\n\n        <div class=\"collapse navbar-collapse\"\
    \ id=\"mynavbar-content\">\n\n        </div>\n    </div>\n</div>\n```\n\nNow let's\
    \ start filling up the `navbar-collapse` element with the set of links we want\
    \ to place inside the navigation bar. We'll use the `ul` element with classes\
    \ `nav` and `navbar-nav` here. These classes are used to align the links properly\
    \ with the navigation bar:\n\n```\n<div class=\"navbar navbar-default\">\n   \
    \ <div class=\"container-fluid\">\n        <div class=\"navbar-header\">\n   \
    \       <button type=\"button\" class=\"navbar-toggle\" \ndata-toggle=\"collapse\"\
    \ data-target=\"#mynavbar-content\">\n            <span class=\"icon-bar\"></span>\n\
    \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
    ></span>\n          </button>\n          <a class=\"navbar-brand\" href=\"#\"\
    >SitePoint</a>\n        </div>\n\n        <div class=\"collapse navbar-collapse\"\
    \ id=\"mynavbar-content\">\n            <ul class=\"nav navbar-nav\">\n      \
    \          <li class=\"active\"><a href=\"#\">Home</a></li>\n                <li><a\
    \ href=\"#\">About</a></li>\n                <li><a href=\"#\">Pricing</a></li>\n\
    \                <li><a href=\"#\">Contact</a></li>\n                <li><a href=\"\
    #\">Feedback</a></li>\n            </ul>\n        </div>>\n    </div>\n</div>\n\
    ```\n\nOur final navbar with links should look like [Figure 3.18](#ch03.html_finalnavbar\
    \ \"Figure 3.18. Final navbar\").\n\n![Final navbar](figures/ch3Image17.png)\n\
    \nFigure 3.18. Final navbar\n\nYou can also try resizing the browser and use the\
    \ hidden button to show the menu in a smaller screen. You should have something\
    \ similar to [Figure 3.19](#ch03.html_resizenavbar \"Figure 3.19. Resized navbar\"\
    ).\n\n![Resized navbar](figures/ch3Image18-1.png)\n\nFigure 3.19. Resized navbar\n\
    \nAmazing, no? You have created a highly responsive navigation bar without writing\
    \ a single line of CSS or JavaScript code.\n"
