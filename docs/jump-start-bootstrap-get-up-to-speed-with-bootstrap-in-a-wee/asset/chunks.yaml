    ↵respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n       \
    \ <div class=\"container\">\n            <div class=\"dropdown\" id=\"myDropdown\"\
    >\n                <a class=\"myDropdownHandle\" data-toggle=\"dropdown\" \n↵data-target=\"\
    #\" href=\"#\">\n                    Dropdown <span class=\"caret\"></span>\n\
    \                </a>\n                <ul class=\"dropdown-menu\">\n        \
    \            <li><a href=\"#\">Link 1</a></li>\n                    <li><a href=\"\
    #\">Link 2</a></li>\n                    <li><a href=\"#\">Link 3</a></li>\n \
    \                   <li><a href=\"#\">Link 4</a></li>\n                </ul>\n\
    \            </div>\n        </div>\n\n    <script src=\"js/jquery.js\"></script>\n\
    \    <script src=\"js/bootstrap.js\"></script>\n    <script type=\"text/javascript\"\
    >\n        $(document).ready(function(){\n\n            $('#myDropdown').on('show.bs.dropdown',\
    \ function () {\n               console.log(\"Opening dropdown..\");\n       \
    \     });\n\n            $('#myDropdown').on('shown.bs.dropdown', function ()\
    \ {\n               console.log(\"Dropdown opened..\");\n            });\n\n \
    \           $('#myDropdown').on('hide.bs.dropdown', function () {\n          \
    \     console.log(\"Hiding dropdown..\");\n            });\n\n            $('#myDropdown').on('hidden.bs.dropdown',\
    \ function () {\n               console.log(\"Dropdown hidden..\");\n        \
    \    });\n\n        });\n    </script>\n  </body>\n</html>\n```\n\nYou will find\
    \ these events extremely useful in situations where the links in the dropdown\
    \ menu are dynamically populated with data from the server. In such cases, you\
    \ can fire an Ajax request to the server on the `show.bs.dropdown` event and populate\
    \ the dropdown menu before it is shown.\n\n### Alert Messages\n\nBootstrap comes\
    \ with a very useful component for displaying alert messages in various sections\
    \ of our website; you can use them for displaying a success message, a warning\
    \ message, a failure message, or an information message. These messages can be\
    \ annoying to visitors, hence they should have dismiss functionality added to\
    \ give visitors the ability to hide them.\n\nIn this section, we'll create an\
    \ alert message using Bootstrap and see how we can add dismiss functionality to\
    \ it.\n\nHere's the markup for a “success” alert message:\n\n```\n<div class=\"\
    alert alert-success\">\n    Amount has been transferred successfully.\n</div>\n\
    ```\n\nEvery alert should have the `alert` class attached to it. It should also\
    \ have an additional contextual class, such as `alert-success`. There are four\
    \ self-explanatory contextual classes for alert messages:\n\n1.  `alert-success`\n\
    \n2.  `alert-info`\n\n3.  `alert-danger`\n\n4.  `alert-warning`\n\nThe alert shown\
    \ in the above code doesn't have a dismiss functionality, so it is always visible\
    \ in the web page, as shown in [Figure 4.5](#ch04.html_alertnoddismiss \"Figure 4.5. A\
    \ regular alert message without dismiss functionality\").\n\n![A regular alert\
    \ message without dismiss functionality](figures/ch4Image5.png)\n\nFigure 4.5. A\
    \ regular alert message without dismiss functionality\n\nThe markup for a dismissable\
    \ alert box, and what it looks like onscreen in [Figure 4.6](#ch04.html_dismissable\
    \ \"Figure 4.6. A dismissable alert box\"), is as follows:\n\n```\n<div class=\"\
    alert alert-success alert-dismissable\">\n    <button type=\"button\" class=\"\
    close\" data-dismiss=\"alert\">\n↵&times;</button>\n    Amount has been transferred\
    \ successfully.\n</div>\n```\n\n![A dismissable alert box](figures/ch4Image6.png)\n\
    \nFigure 4.6. A dismissable alert box\n\nTo create a dismissable alert message,\
    \ we need to add class `alert-dismissable` to the alert box. Next, we require\
    \ a button that will close the alert message when clicked. The button should have\
    \ `data-dismiss` attribute, which tells Bootstrap the component to dismiss when\
    \ clicked. Bootstrap positions this button to the top-right position of the alert\
    \ box with the help of the `close` class. This dismiss action on the close button\
    \ is added by Bootstrap using JavaScript and captured using the `data-dismiss`\
    \ attribute.\n\n### Tip: Using Links Within an Alert\n\nIf you want to place a\
    \ link within an alert, you need to add a class `alert-link` to the `a` element.\
    \ This provides a matching color to link with respect to the alert box color:\n\
    \n```\n<div class=\"alert alert-success alert-dismissable\">\n    <button type=\"\
    button\" class=\"close\" data-dismiss=\n↵\"alert\">&times;</button>\n    Amount\
    \ has been transferred successfully. Go to <a \n↵href=\"#\" class=\"alert-link\"\
    >account page</a>.\n</div>\n```\n\n### Alert Messages with JavaScript\n\nYou can\
    \ also dismiss an alert message using Bootstrap's `alert()` method in jQuery:\n\
    \n```\n$(\".alert\").alert('close');\n```\n\nAlert messages have two events associated\
    \ with them:\n\n1.  `close.bs.alert`: triggered just before closing the alert\
    \ box\n\n2.  `closed.bs.alert`: triggered after the alert box is closed\n\nHere's\
    \ an example using the above events:"
