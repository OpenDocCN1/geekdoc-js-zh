    \n![SitePoint®](img/sitepoint-logo.png)\n\n由 SitePoint Pty. Ltd. 出版\n\n48 Cambridge\
    \ Street Collingwood VIC Australia 3066\n\n网站：www.sitepoint.com\n邮箱：business@sitepoint.com\n\
    \n***\n\n## 关于 Syed Fazle Rahman\n\nSyed Fazle Rahman 是一位 Web 开发人员和博客作者，拥有四多年的自由职业经验。他的专长包括\
    \ HTML5、CSS3、Less、JavaScript、jQuery 和 Ember.js。他目前正致力于智能手机和智能电视的混合应用程序。\n\n##\
    \ 关于 SitePoint\n\nSitePoint 专注于为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 访问我们的博客、书籍、时通讯、文章和社区论坛。你可以在那里找到关于 JavaScript、PHP、Ruby、移动开发、设计等大量信息。\n\n## 关于\
    \ Jump Start（快速上手）\n\nJump Start 系列书籍为您提供对 Web 开发语言和技术的快速且实用的介绍。这些书通常长度在 150 页左右，可以在周末内读完，让对该主题有坚实的基础，并有独立实验的信心。\n\
    \n***\n\n献给我亲爱的父母、麻烦的哥哥、可爱的姐姐以及我最好的伙伴 Sandeep。\n\n# 序言\n\n从零开始构建现代、专业的网站需要花费大量的时间和精力。今天的网站需要是响应式的、移动优先的、设计精美的且快速的。Bootstrap\
    \ 通过提供大量的 HTML 组件和网格系统帮助设计师和开发人员，让创建专业的响应式模板变得轻而易举，并可以大幅缩短开发时间。\n\nBootstrap 对所有人都有用，但对于初学者开发者来说，它是一个福音。创建复杂的\
    \ Web 组件所需的复杂 CSS 和 JavaScript 已经预写好了。只需要一些 HTML 标记即可让它们运行。经验丰富的开发者可以利用 Bootstrap\
    \ 提供的许多自定义选项，包括对 Less 和 Sass 的支持。\n\n在本书中，我试图提供一份 Bootstrap 框架的完整指南。我们将涵盖如何在不需要掌握高级\
    \ Web 开发技术的情况下构建美的响应式网站。我们将讨论 Bootstrap 开箱提供的各种实用 CSS 组件和 JavaScript 插件。我们涵盖自定义\
    \ Bootstrap 外观和感的各种方法，以生成完全独特的设计。\n\n希望现在你已经准备好使用 Bootstrap 框架构建你的第一个网站了。在本书结束时，我有信心你将拥有快速创建漂亮的响应式网站模板的能力。我希望这本书以及\
    \ Bootstrap 框架都能满足你的 Web 设计需求。\n\n## 谁应该读这本书\n\n本书适合初级到中级的 Web 设计师和开发人员。假设读者已具有\
    \ HTML 和 CSS 经验，具备一些 JavaScript 知识会有帮助。\n\n## 使用的约定\n\n你会注意到，我们在整本书中使用某些排版和布局样式来表示不同类型的信息。请关注以下项目。\n\
    \n### 代码示例\n\n书中的代码将使用等宽字体显示，如下所示：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It\
    \ was a lovely day for a walk in the park. The birds \nwere singing and the kids\
    \ were all back at school.</p>\n```\n\n如果代码位于书籍存档中，文件名将出现在程序列表顶部，如下：\n\n`example.css`\n\
    \n```\n.footer {\n  background-color: #CCC;\n  border-top: 1px solid #333;\n}\n\
    ```\n\n如果只显示文件的部分内容，将用单词 `excerpt`（摘录）标出：\n\n`example.css (excerpt)`\n\n```\n\
    \ border-top: 1px solid #333;\n```\n\n如果需要向现有示例插入额外的代码，新代码将以**粗体**显示：\n\n```\n\
    function animate() {\n  new_variable = \"Hello\";\n}\n```\n\n此外，当需要现有代码作为上下文而不是重复所有内容时，将显示\
    \ `…`：\n\n```\nfunction animate() {\n  …\n  return new_variable;\n}\n```\n\n某些代码行打算在一行内输入，但由于页面限制，我们对它们进行了换行。`↵`\
    \ 表示仅出于格式目的而存在的换行，应该忽略。\n\n```\nURL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-\n\
    ↵testing/?responsive1\");\n```\n\n### 提示、注释和警告\n\n### 提示：嘿，你！\n\n提示将给你提供有用的小技巧。\n\
    \n### 注释：咳，抱歉……\n\n注释是与主题相关但并非至关重要的有用补充。将它们看作额外的信息片段。\n\n### 重要：确保你始终……\n\n……注意这些重要要点。\n\
    \n### 警告：小心！\n\n警告将突出显示在过程中可能会让你绊脚的任何陷阱。\n\n## 补充材料\n\n[`www.sitepoint.com/store/jump-start-bootstrap/`](http://www.sitepoint.com/store/jump-start-bootstrap/)\n\
    \n书籍网站，包含链接、更新、资源等。\n\n[`github.com/spbooks/jsbootstrap1`](https://github.com/spbooks/jsbootstrap1)\n\
    \n本书的可下载代码存档。\n\n[`www.sitepoint.com/forums/forumdisplay.php?53-CSS-amp-Page-Layout`](http://www.sitepoint.com/forums/forumdisplay.php?53-CSS-amp-Page-Layout)\n\
    \nSitePoint 论坛，用于寻求任何棘手 Web 问题的帮助。\n\n`books@sitepoint.com`\n\n我们的电子邮件地址，如果你需要联系我们寻求支持、报告问题或出于任何其他原因。\n\
