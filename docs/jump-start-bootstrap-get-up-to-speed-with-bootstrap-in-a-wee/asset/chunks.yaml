    \ using a class of `caret`.\n\n### Note: Is the Caret a Glyphicon?\n\nThe `caret`\
    \ class is not a glyphicon class. Bootstrap has written special CSS styles for\
    \ the class `caret` that will produce this down arrow icon. If you want to learn\
    \ how they did it, open the `bootstrap.css` file and search for `“.caret`” You\
    \ will find a set of CSS properties associated with it.\n\nYou can also use a\
    \ glyphicon instead of this down arrow. For that you need to replace the markup\
    \ of the caret with the markup of a glyphicon:\n\n```\n<span class=\" glyphicon\
    \ glyphicon-chevron-down\"></span>\n```\n\nOnce the link and icons are placed\
    \ properly, you can then create a `ul` list for representing the list of links\
    \ in the dropdown menu. This `ul` element should have the class `dropdown-menu`.\
    \ Now, we have a simple dropdown that displays a menu when the link is clicked.\
    \ We can view it in the browser as shown in [Figure 4.1](#ch04.html_simpledropdown\
    \ \"Figure 4.1. A simple dropdown menu\").\n\n![A simple dropdown menu](figures/ch4Image1.png)\n\
    \nFigure 4.1. A simple dropdown menu\n\nLet's use the dropdown plugin with the\
    \ tabs and pills menus that we created in the previous chapter.\n\nHere's the\
    \ markup for the pills menu:\n\n```\n<ul class=\"nav nav-pills\">\n  <li class=\"\
    active\"><a href=\"#\">Home</a></li>\n  <li><a href=\"#\">Profile</a></li>\n \
    \ <li><a href=\"#\">Messages</a></li>\n</ul>\n```\n\nLet's create a dropdown plugin\
    \ in the second item of the previous list:\n\n```\n<ul class=\"nav nav-pills\"\
    >\n  <li class=\"active\"><a href=\"#\">Home</a></li>\n  <li class=\"dropdown\"\
    >\n        <a data-toggle=\"dropdown\" data-target=\"#\" \n↵href=\"http://www.google.com\"\
    >\n            Profile <span class=\"caret\"></span>\n        </a>\n        <ul\
    \ class=\"dropdown-menu\">\n            <li><a href=\"#\">Link 1</a></li>\n  \
    \          <li><a href=\"#\">Link 2</a></li>\n            <li><a href=\"#\">Link\
    \ 3</a></li>\n            <li><a href=\"#\">Link 4</a></li>\n        </ul>\n \
    \ </li>\n  <li><a href=\"#\">Messages</a></li>\n</ul>\n```\n\nWe have placed the\
    \ whole markup of the dropdown plugin inside the second `li` element and assigned\
    \ it a class `dropdown`. Hence, the above pills menu with a dropdown plugin should\
    \ look like [Figure 4.2](#ch04.html_pillsdropdown \"Figure 4.2. A pills menu with\
    \ dropdown\").\n\n![A pills menu with dropdown](figures/ch4Image2.png)\n\nFigure 4.2. A\
    \ pills menu with dropdown\n\nYou can use this dropdown plugin with any component\
    \ by injecting it as shown in the previous code.\n\n### Dropdowns with JavaScript\n\
    \nThe dropdown plugin from Bootstrap can also be used using JavaScript. Instead\
    \ of providing the custom attributes such as `data-*`, you can use JavaScript\
    \ objects to pass such information. Bootstrap uses the jQuery library for all\
    \ JavaScript-related operations. Hence, importing `jquery.js` is crucial for using\
    \ JavaScript-related customization in Bootstrap.\n\nTo trigger the dropdown plugin\
    \ through jQuery, you need to use the method `dropdown()`:\n\n```\n$().dropdown('toggle');\n\
    ```\n\nWe can use this method to toggle the state of the dropdown from closed\
    \ to opened whenever the page loads. For example, if our code snippet for creating\
    \ a dropdown is as follows:"
