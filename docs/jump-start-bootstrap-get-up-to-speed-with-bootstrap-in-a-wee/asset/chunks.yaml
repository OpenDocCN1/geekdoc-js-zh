    \ function () {\n               console.log(\"Dropdown hidden..\");\n        \
    \    });\n\n        });\n    </script>\n  </</body>>\n</html>\n```\n\n当下拉菜单中的链接根据来自的数据动态填充数据时，你会发现这些事件极其有用。在这些情况下，你可以在\
    \ `show.bs.dropdown` 事件上向服务器发送 Ajax 请求，并在下拉菜单显示之前填充它。\n\n### 警报消息 (Alert Messages)\n\
    \nBootstrap 自带了一个非常有用的组件，用于在我们网站的不同部分显示警报消息；你可以使用它们来显示成功消息、警告消息、失败消息或信息消息。这些消息可能会让访客感到困扰，因此它们应该添加关闭功能，让访客能够隐藏它们。\n\
    \n在本节中，我们将使用 Bootstrap 创建一个警报消息，并查看我们如何为其添加关闭功能。\n\n以下是“成功”警报消息的标记：\n\n```\n<div\
    \ class=\"alert alert-success\">\n    Amount has been transferred successfully.\n\
    </div>\n```\n\n每个警报都应该带有 `alert` 类。它还应该有一个额外的上下文类，例如 `alert-success`。对于警报消息，有四个目自见明的上下文类：\n\
    \n1. `alert-success`\n2. `alert-info`\n3. `alert-danger`\n4. `alert-warning`\n\
    \n上述代码中显示的警报没有关闭功能，因此它在网页上始终可见的，如图 4.5 所示。\n\n![没有关闭功能的普通警报消息](img/ch4Image5.png)\n\
    \n图 4.5 没有关闭功能的普通警报消息\n\n可关闭的警报框的标记以及它在图 4.6 在屏幕上的显示如下：\n\n```\n<div class=\"\
    alert alert-success alert-dismissable\">\n    <button type=\"button\" class=\"\
    close\" data-dismiss=\"alert\">\n&times;</button>\n    Amount has been transferred\
    \ successfully.\n</div>\n```\n\n![可关闭的警报框](img/ch4Image6.png)\n\n图 4.6 可关闭的警报框\n\
    \n要创建一个可关闭的警报消息，我们需要向警报框添加类 `alert-dismissable`。接下来，我们需要一个在点击时关闭警报消息的按钮。该按钮应该具有\
    \ `data-dismiss` 属性，它告诉 Bootstrap 在点击时关闭组件。Bootstrap 通过 `close` 类的帮助将此按钮定位在警报框的右上角。关闭按钮上的关闭操作是\
    \ Bootstrap 使用 JavaScript 添加的，并通过 `data-dismiss` 属性进行捕获。\n\n### 提示：在警报中使用链接\n\n\
    如果你想在警报中放置链接，你需要为 `a` 元素添加类 `alert-link`。这提供了一个与警报框颜色匹配的链接颜色：\n\n```\n<div class=\"\
    alert alert-success alert-dismissable\">\n    <button type=\"button\" class=\"\
    close\" data-dismiss=\n\"alert\">&times;</button>\n    Amount has been transferred\
    \ successfully. Go to <a \nhref=\"#\" class=\"alert-link\">account page</a>.\n\
    </div>\n```\n\n### JavaScript 处理警报消息\n\n你也可以使用 jQuery 中的 Bootstrap `alert()` 方法来关闭警报消息：\n\
    \n```\n$(\".alert\").alert('close');\n```\n\n警报消息有两个与之关联的事件：\n\n1. `close.bs.alert`:\
    \ 在关闭警报框之前立即触发\n2. `closed.bs.alert`: 在警报框关闭后触发\n\n以下是使用上述事件的示例：\n\n"
- fmt: "\n```\n$('.alert').on('close.bs.alert', function () {\n   console.log(\"Closing\
    \ alert..\");\n});\n\n$('.alert').on('closed.bs.alert', function () {\n   console.log(\"\
    Alert closed!\");\n});\n```\n\n### Buttons\n\nWe saw how to create various types\
    \ of buttons in the previous chapter. Here we'll see how we can use them in different\
    \ situations and change their states using Bootstrap's JavaScript plugins.\n\n\
    Bootstrap buttons have two states: `active` and `inactive`. The active state has\
    \ a class called `active`, but there's no class for the inactive state. Instead,\
    \ you can create a simple button that toggles between these two states using the\
    \ following markup:\n\n```\n<button type=\"button\" class=\"btn btn-lg btn-default\"\
    \ \n↵data-toggle=\"button\">Toggle Me!</button>\n```\n\nIn the code, I have created\
    \ a large gray button using `btn`, `btn-lg`, and `btn-default` classes. It is\
    \ currently in the inactive state. When the user clicks on it, Bootstrap will\
    \ add an extra `active` class to the button.\n\nWhen you click on the button,\
    \ you'll see an inset-like style applied to it. On clicking again it reverts back\
    \ to the original style, as shown in [Figure 4.7](#ch04.html_toggle \"Figure 4.7.\
    \ The two states of our button\"). The attribute `data-toggle` with a value `button`\
    \ helps in achieving this toggling functionality.\n\n![The two states of our button](figures/ch4Image7.png)\n\
    \nFigure 4.7. The two states of our button\n\nStyling checkboxes and radio buttons\
    \ with CSS can be tricky. Bootstrap has a way to redesign them; it makes a set\
    \ of checkboxes or radio buttons into a set of Bootstrap buttons that are placed\
    \ alongside each other. Let's go ahead and check out some sample markup, with\
    \ the result shown in [Figure 4.8](#ch04.html_checkboxes \"Figure 4.8. Bootstrap\
    \ Checkboxes\"):\n\n```\n<div class=\"btn-group\" data-toggle=\"buttons\">\n\n\
    \    <label class=\"btn btn-default\"\n        <input type=\"checkbox\"> Option\
    \ 1\n    </label>\n\n    <label class=\"btn btn-default\">\n        <input type=\"\
    checkbox\"> Option 2\n    </label>\n\n    <label class=\"btn btn-default\">\n\
    \        <input type=\"checkbox\"> Option 3\n    </label>\n\n</div>\n```\n\n![Bootstrap\
    \ Checkboxes](figures/ch4Image8.png)\n\nFigure 4.8. Bootstrap Checkboxes\n\nYou\
    \ can see in [Figure 4.8](#ch04.html_checkboxes \"Figure 4.8. Bootstrap Checkboxes\"\
    ) that Bootstrap has completely revamped the display of the checkboxes. They are\
    \ now appearing as a group of Bootstrap buttons. Since they are checkboxes, I\
    \ was able to check both Option 1 and Option 3. To create this group of checkboxes,\
    \ you need a parent `div` with a class `btn-group`. It should also have an attribute\
    \ `data-toggle` with a value of `buttons`. All the `checkbox`-type `input` elements\
    \ should be wrapped inside `label` elements. These labels must have Bootstrap's\
    \ button classes. In this case, I have opted for gray-colored buttons.\n\n###\
    \ Tip: Multi-colored Checkboxes\n\nYou can create multi-colored buttons in the\
    \ button group by mixing Bootstrap's button classes, such as `btn-primary`, `btn-info`,\
    \ and so on.\n\nYou can also create a group of radio buttons in which only one\
    \ button is selectable. Here's the markup with the result shown in [Figure 4.9](#ch04.html_radio\
    \ \"Figure 4.9. Bootstrap radio button\"):\n\n```\n<div class=\"btn-group\" data-toggle=\"\
    buttons\">\n\n    <label class=\"btn btn-info\">\n        <input type=\"radio\"\
    \ name=\"options\"> Option 1\n    </label>\n\n    <label class=\"btn btn-info\"\
    >\n        <input type=\"radio\" name=\"options\"> Option 2\n    </label>\n\n\
    \    <label class=\"btn btn-info\">\n        <input type=\"radio\" name=\"options\"\
    > Option 3\n    </label>\n\n</div>\n```\n\n![Bootstrap radio button](figures/ch4Image9.png)\n\
    \nFigure 4.9. Bootstrap radio button\n\nThe only change in the markup is to modify\
    \ the `type` attribute of the `input` element from `checkbox` to `radio`. Additionally,\
    \ you have to logically group the radio buttons by applying a common `name` attribute\
    \ value to all of them. In this case, I've also replaced `btn-default` to `btn-info`\
    \ to change the color of the buttons from gray to light blue.\n\n### Buttons with\
    \ JavaScript\n\nBootstrap comes with the `button()` method to toggle the state\
    \ of the button through jQuery. You can use it in the following way:\n\n```\n\
    $(\"mybutton\").button('toggle');\n```\n\nYou can also change the button to its\
    \ `loading` state. In this state the button will remain disabled, but you need\
    \ to define additional loading text using the `data-loading-text` attribute in\
    \ the button element:\n\n```\n<button id=\"myLoadingButton\" type=\"button\" class=\"\
    btn btn-primary\" \n↵data-loading-text=\"loading stuff...\">Load data</button>\n\
    ```\n\nLet's change the state of the button to `loading` using jQuery when it's\
    \ clicked:\n\n```\n$('#myLoadingButton').click(function () {\n    $(this).button('loading');\n\
    });\n```\n\n### Managing Content\n\nManaging content properly is extremely important\
    \ for any website. Bootstrap provides many plugins that can help us organize and\
    \ display content.\n\nBasically, it is a two-component plugin; it consists of\
    \ a navbar and contents area. The contents area is divided into sections, with\
    \ each section having an ID. Let's build a navbar first. Here's the markup:\n\n\
    ```\n<nav id=\"navbarExample\" class=\"navbar navbar-default\" \n↵role=\"navigation\"\
    >\n  <div class=\"container-fluid\">\n    <div class=\"navbar-header\">\n    \
    \  <button class=\"navbar-toggle\" type=\"button\" \n↵data-toggle=\"collapse\"\
    \ data-target=\".navbarLinks\">\n        <span class=\"icon-bar\"></span>\n  \
    \      <span class=\"icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n\
    \      </button>\n      <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n \
    \   </div>\n    <div class=\"collapse navbar-collapse navbarLinks\">\n      <ul\
    \ class=\"nav navbar-nav\">\n        <li class=\"active\"><a href=\"#home\">Home</a></li>\n\
    \        <li class=\"\"><a href=\"#about\">About</a></li>\n        <li class=\"\
    \"><a href=\"#contact\">Contact Us</a></li>\n        <li class=\"\"><a href=\"\
    #map\">Map</a></li>\n      </ul>\n    </div>\n  </div>\n</nav>\n```\n\nThe links\
    \ in the navbar markup are all internal links to particular sections in the content.\n\
    \nThe markup for the contents section is as follows:\n\n```\n<div data-spy=\"\
    scroll\" data-target=\"#navbarExample\" data-offset=\"0\" \n↵class=\"scrollspy-example\"\
    >\n\n    <h4 id=\"home\">Home</h4>\n    <p>Lorem ipsum dolor sit amet, consectetur\
    \  ... </p>\n\n    <h4 id=\"about\">About</h4>\n    <p>Lorem ipsum dolor sit amet,\
    \ consectetur  ... </p>\n\n    <h4 id=\"contact\">Contact Us</h4>\n    <p>Lorem\
    \ ipsum dolor sit amet, consectetur  ... </p>\n\n    <h4 id=\"map\">Map</h4>\n\
    \    <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\n</div>\n```\n\n###\
    \ ScrollSpy\n\nScrollSpy is one of the most popular modern-day plugins. It highlights\
    \ a menu item in the navigation based upon the section that is currently on display.\
    \ When the user starts scrolling, the corresponding link in the navbar is highlighted\
    \ as per the section that is in view.\n\n"
