    \ CompressJS\").\n\n![Running CompressJS](figures/ch6Image1.png)\n\nFigure 6.1. Running\
    \ CompressJS\n\n### Optimizing Images\n\nIt is often the images that cause the\
    \ slow loading of web pages. Imagine a situation where we need to display an image\
