    \ \"Figure 3.31. Control sizing\").\n\n![Control sizing](figures/ch3Image31.png)\n\
    \nFigure 3.31. Control sizing\n\n## Summary\n\nIn this chapter, we have seen a\
    \ collection of reusable Bootstrap components that are ready to use. As you've\
    \ seen, there are a large number of different components available in Bootstrap,\
    \ and initially, you may find it difficult to remember so many different types\
    \ of classes; however, you can always refer to [the documentation for reference\
    \ whenever you land in trouble.](http://getbootstrap.com/components)\n\n# Chapter\
    \ 4## Bootstrap Plugins for Fun and Profit\n\nJavaScript is the *de facto* scripting\
    \ language of the Web. Beautiful image slideshows, drop-down menus, and popovers\
    \ are just some examples of popular website features that can be created by combining\
    \ JavaScript with CSS. In this chapter, we'll check out some of the ready-to-use\
    \ JavaScript plugins that Bootstrap 3 provides for us, making it easy to create\
    \ such advanced website features.\n\nThere are two different ways of using Bootstrap's\
    \ JavaScript plugins. The first method requires no JavaScript at all. You just\
    \ have to follow some recommended HTML markup to use them. The other method needs\
    \ some JavaScript knowledge for initializing and customizing the plugins. We'll\
    \ discuss both methods of using plugins, and you can decide which one suits you\
    \ best.\n\nAll the plugins that we're going to use in this chapter are included\
    \ in the `bootstrap.js` or `bootstrap.min.js`. If you have followed the instructions\
    \ for downloading Bootstrap in [Chapter 1,](#ch01.html \"Chapter 1Up, Close, and\
    \ Personal with Bootstrap\") you should find `bootstrap.js` inside the `/js` folder\
    \ of the project.\n\nBefore proceeding, let's set up a new project for this chapter.\
    \ We'll be using the same folder that we created in [Chapter 1,](#ch01.html \"\
    Chapter 1Up, Close, and Personal with Bootstrap\") `Bootstrap_demos`. Copy all\
    \ the files in this folder and paste them inside a new folder named `Chapter 4`.\
    \ Open `index.html` using text editor. Change the text inside the `<title>` tag\
    \ to read “Bootstrap Plugins”. Next, remove the `<h1>` tag from the `<body>`.\
    \ Finally, the `index.html` file should look like this:\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, \ninitial-scale=1\">\n\n    <title>Bootstrap Plugins</title>\n\
    \    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n\
    \    <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
    3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n\n\
    \      <script src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"\
    ></script>\n  </body>\n</html>\n```\n\n## Extending Functionality\n\nImagine a\
    \ menu bar without any drop-down functionality. Kind of boring, right? Gone are\
    \ the days when a navigation bar used to consist of just a simple list of links.\
    \ In this section, we are going to use some of Bootstrap's JavaScript plugins\
    \ that will help in extending the functionality of the existing components of\
    \ our website. We will see how to add drop-down menus to navigation bars, the\
    \ ability to toggle the states of buttons when clicked, beautiful alert messages\
    \ that vanish after being displayed for some time, and more.\n\n### Dropdowns\n\
    \nThe markup for creating a dropdown is as follows:\n\n```\n<div class=\"dropdown\"\
    >\n    <a data-toggle=\"dropdown\" data-target=\"#\" \nhref=\"http://www.google.com\"\
    >\n        Dropdown <span class=\"caret\"></span>\n    </a>\n    <ul class=\"\
    dropdown-menu\">\n        <li><a href=\"#\">Link 1</a></li>\n        <li><a href=\"\
    #\">Link 2</a></li>\n        <li><a href=\"#\">Link 3</a></li>\n        <li><a\
    \ href=\"#\">Link 4</a></li>\n    </ul>\n</div>\n```\n\nEvery dropdown should\
    \ have two important elements: an `<a>` element and a `<ul>` element. Here the\
    \ `<ul>` element is hidden by default and the `<a>` element is used to toggle\
    \ the dropdown menu. The `<a>` element has two necessary `data-*` attributes:\
    \ `data-toggle` and `data-target`. The `data-toggle` attribute tells Bootstrap\
    \ to activate the dropdown effect on the link element whenever clicked. On the\
    \ other hand, the `data-target` attribute is used to prevent the page redirection\
    \ when a link is clicked. It's unnecessary to provide an `href` attribute here,\
    \ as it will be ignored. This link element should contain some anchor text, such\
    \ as “Dropdown”, and a down arrow icon, which is produced using a class of `caret`.\n\
    \n### Note: Is the Caret a Glyphicon?\n\nThe `caret` class is not a glyphicon\
    \ class. Bootstrap has written special CSS styles for the class `caret` that will\
    \ produce this down arrow icon. If you want to learn how they did it, open the\
    \ `bootstrap.css` file and search for `.caret`. You can also use a glyphicon instead\
    \ of this arrow:\n\n```\n<span class=\"glyphicon-chevron-down\"></span>\n```\n\
    \nOnce the markup is placed properly, the `<ul>` should have the class `dropdown-menu`.\
    \ Now, we have a simple dropdown that displays a menu as shown in [Figure 4.1](#ch04.html_simpledropdown\
    \ \"Figure 4.1. A simple dropdown\").\n\n![A simple dropdown](figures/ch4Image1.png)\n\
    \nFigure 4.1. A simple dropdown\n\nLet's use the dropdown plugin with the tabs\
    \ and menus that we created in the previous chapter. Here's the markup for the\
    \ pills menu:\n\n```\n<ul class=\"nav-pills\">\n  <li class=\"active\"><a href=\"\
    #\">Home</a></li>\n  <li class=\"dropdown\">\n        <a data-toggle=\"dropdown\"\
    \ data-target=\"#\" \nhref=\"http://www.google.com\">\n            Profile <span\
    \ class=\"caret\"></span>\n        </a>\n        <ul class=\"dropdown-menu\">\n\
    \            <li><a href=\"#\">Link 1</a></li>\n            <li><a href=\"#\"\
    >Link 2</a></li>\n            <li><a href=\"#\">Link 3</a></li>\n            <li><a\
    \ href=\"#\">Link 4</a></li>\n        </ul>\n  </li>\n  <li><a href=\"#\">Messages</a></li>\n\
    </ul>\n```\n\nWe have placed the whole markup of the dropdown plugin inside the\
    \ second `<li>` element and assigned it a class `dropdown`. Hence, the above pills\
    \ menu with a dropdown plugin should look like [Figure 4.2](#ch04.html_pillsdropdown\
    \ \"Figure 4.2. A pills menu with dropdown\").\n\n![A pills menu with dropdown](figures/ch4Image2.png)\n\
    \nFigure 4.2. A pills menu with dropdown\n\nYou can use this dropdown plugin with\
    \ any component by injecting it as shown in the previous code.\n\n### Dropdowns\
    \ with JavaScript\n\nThe dropdown plugin from Bootstrap can also be used using\
    \ JavaScript. Instead of providing the custom attributes such as `data-*`, you\
    \ can use JavaScript objects to pass such information. Bootstrap uses the jQuery\
    \ library for all JavaScript-related operations. Hence, importing `jquery.js`\
    \ is crucial for using JavaScript-related customization in Bootstrap.\n\nTo trigger\
    \ the dropdown plugin through jQuery, you need to use the method `dropdown()`:\n\
    \n```\n$().dropdown('toggle');\n```\n\nWe can use this method to toggle the state\
    \ of the dropdown from closed to opened whenever the page loads. For example,\
    \ if our code snippet for creating a dropdown is as follows:\n"
