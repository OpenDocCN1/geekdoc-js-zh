    >\n        ATTENTION\n      </div>\n      <div class=\"panel-body\">\n       \
    \ Lorem ipsum dolor sit ametnim ... \n      </div>\n      <div class=\"panel-footer\"\
    >\n        <a href=\"#\" class=\"btn btn-danger btn-sm\">Agree</a> \n↵<a href=\"\
    #\" class=\"btn btn-default btn-sm\">Decline</a>\n      </div>\n</div>\n```\n\n\
    ![A panel](figures/ch3Image4.png)\n\nFigure 3.4. A panel\n\nAs you can see, the\
    \ panel `div` has been divided into three parts: the `panel-head`, `panel-body`,\
    \ and `panel-footer`. Each of these panel parts is optional.\n\nPanels come with\
    \ various color options. In the previous code, I've used the default color with\
