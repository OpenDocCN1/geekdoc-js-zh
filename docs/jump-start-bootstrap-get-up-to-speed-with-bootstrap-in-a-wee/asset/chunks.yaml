    \nFigure 4.10. Using ScrollSpy\n\n### ScrollSpy with JavaScript\n\nBootstrap has\
    \ the `scrollspy()` method that takes optional parameters to customize the ScrollSpy\
    \ plugin. You can set the target navbar's parent class through JavaScript by passing\
    \ the appropriate options object as follows:\n\n```\n$('.scrollspy-example').scrollspy({\
    \ target: '#navbarExample' });\n```\n\nIf you are passing options through JavaScript,\
    \ you can ignore setting `data-*` attributes inside the element's markup.\n\n\
    Another important parameter that can be passed is the `refresh` string. If you've\
    \ done DOM manipulations such as adding or deleting elements from the ScrollSpy\
    \ area, you'll need to call the `scrollspy(\"refresh\")` method. This will help\
    \ ScrollSpy to recalculate the height of the scrollable area, which might have\
    \ changed due to the addition and deletion of DOM elements:\n\n```\n$('.scrollspy-example').scrollspy(\"\
    refresh\");\n```\n\nScrollSpy comes with only one custom event attached to it:\
    \ `activate.bs.scrollspy`. It is fired whenever a new element is highlighted in\
    \ the navbar. You can capture this event to do additional tasks, such as making\
    \ Ajax requests to the server, performing extra calculations, and so on. Here's\
    \ how we could use it:\n\n```\n$('#navbarExample').on('activate.bs.scrollspy',\
    \ function () {\n  console.log(\"New link highlighted!\");  \n});\n```\n\n###\
    \ Tabs\n\nIn the previous chapter, we saw how to make a set of links look like\
    \ tabs―but they weren't actually tabs! In this section, we are going to make some\
    \ tab panes, put some dummy data into them, and make those tab panes respond to\
    \ the corresponding tab links.\n\nFor tabs to work, we need Bootstrap's `nav-tabs`\
    \ component and `tab-content` component. Let's create some `nav-tabs`:\n\n```\n\
    <!-- Nav tabs -->\n<ul class=\"nav nav-tabs\">\n  <li class=\"active\"><a href=\"\
    #home\" data-toggle=\"tab\">Home</a></li>\n  <li><a href=\"#profile\" data-toggle=\"\
    tab\">Profile</a></li>\n  <li><a href=\"#messages\" data-toggle=\"tab\">Messages</a></li>\n\
    \  <li><a href=\"#settings\" data-toggle=\"tab\">Settings</a></li>\n</ul>\n```\n\
    \nEach link in the `nav-tabs` component should have a `data-toggle` attribute\
    \ with the value `tab`. This allows Bootstrap to map the click events to the corresponding\
    \ tab pane. The `href` attribute in these links should contain the IDs of the\
    \ corresponding tab panes.\n\nHere's the markup for the tab panes:\n\n```\n<!--\
    \ Tab panes -->\n<div class=\"tab-content\">\n    <div class=\"tab-pane active\"\
    \ id=\"home\">\n          <h3>The home</h3>\n    </div>\n    <div class=\"tab-pane\"\
    \ id=\"profile\">\n          <h3>The profile</h3>\n    </div>\n    <div class=\"\
    tab-pane\" id=\"messages\">\n          <h3>Messages central</h3>\n    </div>\n\
    \    <div class=\"tab-pane\" id=\"settings\">\n          <h3>Setting panel</h3>\n\
    \    </div>\n</div>\n```\n\nTo create tab panes, we need to first define a container\
    \ for them. This container should have a class `tab-content`. For a tab pane,\
    \ we need to create a new `div` element with the class `tab-pane`. These `tab-pane`s\
    \ should also have unique IDs, as these will be referenced to in the links of\
    \ the `nav-tabs`. The number of `tab-pane`s should be equal to the number of links\
    \ present in `nav-tabs`. Adding the class `active` to a `li` element in `nav-tabs`\
    \ and the corresponding `tab-pane` makes it the default tab.\n\nThat's it! You\
    \ have a working tabs plugin. Go ahead and view it in the browser. The results\
    \ are shown in [Figure 4.11](#ch04.html_workingtabs \"Figure 4.11. A working tab\
    \ interface\").\n\n![A working tab interface](figures/ch4Image11.png)\n\nFigure 4.11. A\
    \ working tab interface\n\n### Tip: Adding a Fade Effect\n\nAdd the class `fade`\
    \ to each `tab-pane` to apply a fading effect while switching between tabs. The\
    \ first tab pane should also have a class `in` to properly apply a fading effect\
    \ to the initial content:\n\n```\n <div class=\"tab-pane fade in active\" id=\"\
    home\">\n          <h3>The home</h3>\n    </div>\n    <div class=\"tab-pane fade\"\
    \ id=\"profile\">\n          <h3>The profile</h3>\n    </div>\n```\n\n### Tabs\
    \ with JavaScript\n\nThere are two JavaScript events associated with the tab plugin.\
    \ These are:\n\n1.  `show.bs.tab`: this event is triggered on tab show, but before\
    \ the new tab is opened\n\n2.  `shown.bs.tab`: the event is triggered after a\
    \ tab is opened\n\nHere's an example of how it's used:"
