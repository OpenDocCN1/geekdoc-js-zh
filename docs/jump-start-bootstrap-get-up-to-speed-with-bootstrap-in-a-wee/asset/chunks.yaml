  trans: "\n\n内容部分由四对 `<h4>` 和 `<p>` 标签组成。每个 `<h4>` 元素都有一个唯一的 ID，与上述导航栏的内部链接相匹配。为了使\
    \ `ScrollSpy` 正常工作，你应该为内容部分添加两个自定义数据属性：`data-spy` 和 `data-target`。\n\n`data-spy`\
    \ 属性告诉 Bootstrap 哪个区域是 `ScrollSpy` 插件的内容区域。它的值应该是 `scroll`，以便开始监听该区域的滚动事件。`data-target`\
    \ 属性告诉插件需要高亮哪些链接。它应该包含 `nav` 元素父元素的 ID。\n\n`data-offset` 属性告诉 Bootstrap 在激活 `ScrollSpy`\
    \ 插件之前，距离顶部留出多少像素。有时在我们在我们滚动到目标元素之前，导航栏元素可能已经更新了。如果我们在 `ScrollSpy` 区域上方放置了一些额外的\
    \ HTML 标记，就会发生这种情况。这会干扰插件内部对区域高度的计算。我们可以使用 `data-offset` 属性并将值设置为干扰元素的高度。这样一来，插件只有在干扰元素被滚动过之后，才会开始监听用户的滚动操作。\n\
