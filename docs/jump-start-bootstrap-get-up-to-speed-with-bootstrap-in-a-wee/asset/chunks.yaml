  trans: "\n\n```\n$('.alert').on('close.bs.alert', function () {\n   console.log(\"\
    Closing alert..\");\n});\n\n$('.alert').on('closed.bs.alert', function () {\n\
    \   console.log(\"Alert closed!\");\n});\n```\n\n### 按钮\n\n我们在上一节中学习了如何创建各种类型的按钮。在这里，我们将看到如何在不同场景下使用它们，并使用\
    \ Bootstrap 的 JavaScript 插件更改它们的状态。\n\nBootstrap 按钮有两个状态：`active`（激活）和 `inactive`（未激活）。激活状态有一个名为\
    \ `active` 的类，但未激活状态没有对应的类。相反，你可以使用以下标记创建一个简单的按钮，并在在这两个状态之间切换：\n\n```\n<button\
    \ type=\"button\" class=\"btn btn-lg btn-default\" \n↵data-toggle=\"button\">切换我！</button>\n\
    ```\n\n在代码中，我使用 `btn`、`btn-lg` 和 `btn-default` 类创建了一个大灰色按钮。它目前处于未激活状态。当用户点击它时，Bootstrap\
    \ 会为按钮添加一个额外的 `active` 类。\n\n当你点击按钮时，你会看到它被应用了类似内嵌的样式。再次点击时，它会恢复到原始样式，如图 4.7 所示。值为\
    \ `button` 的属性 `data-toggle` 有助于实现这种切换功能。\n\n![按钮的两种状态](img/ch4Image7.png)\n\n\
    图 4.7. 我们按钮的两种状态\n\n使用 CSS 设置复选框和单选按钮可能是复杂的。Bootstrap 有重新设计它们的方法；它将一组复选框或单选按钮转换为一组并排的\
    \ Bootstrap 按钮。让我们示例标记，结果如图 4.8 所示：\n\n```\n<div class=\"btn-group\" data-toggle=\"\
    buttons\">\n\n    <label class=\"btn btn-default\"\n        <input type=\"checkbox\"\
    > 选项 1\n    </label>\n\n    <label class=\"btn btn-default\">\n        <input\
    \ type=\"checkbox\"> 选项 2\n    </label>\n\n    <label class=\"btn btn-default\"\
    >\n        <input type=\"checkbox\"> 选项 3\n    </label>\n\n</div>\n```\n\n![Bootstrap\
    \ 复选框](img/ch4Image8.png)\n\n图 4.8. Bootstrap 复选框\n\n你可以在图 4.8 中看到 Bootstrap 彻底改变了复选框的显示。它们现在以一组\
    \ Bootstrap 按钮的形式出现。由于是复选框，我能够勾选选项 1 和选项 3。要创建这组复选框，你需要一个类为 `btn-group` 的父 `div`。它还应该有一个值为\
    \ `buttons` 的 `data-toggle` 属性。所有 `checkbox` 的 `input` 元素都应该封装在 `label` 元素内部。这些标签必须具有\
    \ Bootstrap 的按钮类。在这种情况下，我选择了灰色的按钮。\n\n### 提示：多颜色复选框\n\n你可以通过混合 Bootstrap 的按钮类（例如\
    \ `btn-primary`、`btn-info` 等）在按钮组中创建多种颜色的按钮。\n\n你还可以创建一个单选按钮组，其中只有一个按钮可以被选中。这里是标记，结果如图\
    \ 4.9 所示：\n\n```\n<div class=\"btn-group\" data-toggle=\"buttons\">\n\n    <label\
    \ class=\"btn btn-info\">\n        <input type=\"radio\" name=\"options\"> 选项\
    \ 1\n    </label>\n\n    <label class=\"btn btn-info\">\n        <input type=\"\
    radio\" name=\"options\"> 选项 2\n    </label>\n\n    <label class=\"btn btn-info\"\
    >\n        <input type=\"radio\" name=\"options\"> 选项 3\n    </label>\n\n</div>\n\
    ```\n\n![Bootstrap 单选按钮](img/ch4Image9.png)\n\n图 4.9. Bootstrap 单选按钮\n\n标记中唯一的变化是将\
    \ `input` 元素的 `type` 属性从 `checkbox` 修改为 `radio`。此外，你必须通过为所有单选按钮应用相同的 `name` 属性值来在逻辑上对它们进行分组。在这种情况下，我还将将\
    \ `btn-default` 替换为 `btn-info`，以将按钮颜色从灰色更改为浅蓝色。\n\n### 使用 JavaScript 的按钮\n\nBootstrap\
    \ 带有 `button()` 方法，可以通过 jQuery 切换按钮的状态。你可以如下如下使用它：\n\n```\n$(\"mybutton\").button('toggle');\n\
    ```\n\n你还可以将按钮更改为 `loading`（加载）状态。在此状态下，按钮将保持禁用，但你需要使用按钮元素中的 `data-loading-text`\
    \ 属性定义额外的加载文本：\n\n```\n<button id=\"myLoadingButton\" type=\"button\" class=\"\
    btn btn-primary\" \n↵data-loading-text=\"加载中...\">加载数据</button>\n```\n\n让我们在点击按钮时使用\
    \ jQuery 将按钮状态更改为 `loading`：\n\n```\n$('#myLoadingButton').click(function () {\n\
    \    $(this).button('loading');\n});\n```\n\n### 内容管理\n\n妥善管理内容对于任何网站都极其重要。Bootstrap\
    \ 提供了许多可以帮助我们组织和显示插件。\n\n基本上，这是一个双组件插件；它由导航栏和内容区域组成。内容区域分为若干部分，每个部分都有 ID。让我们先构建一个导航栏。这里是标记：\n\
    \n```\n<nav id=\"navbarExample\" class=\"navbar navbar-default\" \n↵role=\"navigation\"\
    >\n  <div class=\"container-fluid\">\n    <div class=\"navbar-header\">\n    \
    \  <button class=\"navbar-toggle\" type=\"button\" \n↵data-toggle=\"collapse\"\
    \ data-target=\".navbarLinks\">\n        <span class=\"icon-bar\"></span>\n  \
    \      <span class=\"icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n\
    \      </button>\n      <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n \
    \   </div>\n    <div class=\"collapse navbar-collapse navbarLinks\">\n      <ul\
    \ class=\"nav navbar-nav\">\n        <li class=\"active\"><a href=\"#home\">首页</a></li>\n\
    \        <li class=\"\"><a href=\"#about\">关于</a></li>\n        <li class=\"\"\
    ><a href=\"#contact\">联系我们</a></li>\n        <li class=\"\"><a href=\"#map\">地图</a></li>\n\
    \      </ul>\n    </div>\n  </div>\n</nav>\n```\n\n导航栏标记中的链接都是指向内容中特定区域的内部链接。\n\
    \n内容部分的标记如下：\n\n```\n<div data-spy=\"scroll\" data-target=\"#navbarExample\" data-offset=\"\
    0\" \n↵class=\"scrollspy-example\">\n\n    <h4 id=\"home\">首页</h4>\n    <p>Lorem\
    \ ipsum dolor sit amet, consectetur  ... </p>\n\n    <h4 id=\"about\">关于</h4>\n\
    \    <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\n    <h4 id=\"contact\"\
    >联系我们</h4>\n    <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\n    <h4\
    \ id=\"map\">地图</h4>\n    <p>Lorem ipsum dolor sit amet, consectetur  ... </p>\n\
    \n</div>\n```\n\n### ScrollSpy\n\nScrollSpy 是现代最流行的插件之一。它根据当前显示的区域高亮导航栏中的菜单项。当用户开始滚动页面时，导航栏中相应的链接将根据视图中的区域进行高亮。\n\
    \n"
- fmt: "\nThe contents section is composed of four pairs of `<h4>` and `<p>` tags.\
    \ Each `<h4>` element has a unique ID that matches with the internal links of\
    \ the aforementioned navbar. To make the `ScrollSpy` work, you should add two\
    \ custom data attributes to the content sections: `data-spy` and `data-target`.\
    \ \n\nThe `data-spy` attribute tells Bootstrap what the contents area is for the\
    \ `ScrollSpy` plugin. It should have a value `scroll` to start listening to scrolling\
    \ in this area. The `data-target` attribute tells which links it has to highlight.\
    \ It should contains the ID of the parent of the `nav` element.\n\nThe `data-offset`\
    \ attribute tells Bootstrap how many pixels to leave from the top before activating\
    \ the `ScrollSpy` plugin. Sometimes, the navigation bar elements may be updated\
    \ before we actually scroll to the actual element. This might happen if we've\
    \ placed some additional HTML markup above the `ScrollSpy` area. This interferes\
    \ with the area height calculation that is done internally by the plugin. We can\
    \ use `data-offset` attribute and set the value as the height of the interfering\
    \ element. Henceforth, the plugin will only start listening to the user's scrolling\
    \ once the interfering element has been scrolled past.\n\nHere's the full markup\
    \ of `index.html` with `ScrollSpy`:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ \ninitial-scale=1\">\n\n    <title>Bootstrap Plugins</title>\n    <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if lt IE\
    \ 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
    ></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n1.4.2/respond.min.js\"\
    ></script>\n    <![endif]-->\n\n    <style type=\"text/css\">\n        .scrollspy-example{\n\
    \          position:relative;\n          height:200px;\n          margin-top:10px;\n\
    \          overflow:auto}\n    </style>\n\n  </head>\n  <body><body>\n  <div class=\"\
    container\">\n    <nav id=\"navbarExample\" class=\"navbar navbar-default\" \n\
    role=\"navigation\">\n      <div class=\"container-fluid\">\n        <div class=\"\
    navbar-header\">\n          <button class=\"navbar-toggle\" type=\"button\" \n\
    data-toggle=\"collapse\" data-target=\".navbarLinks\">\n            <span class=\"\
    icon-bar\"></span>\n            <span class=\"icon-bar\"></span>\n           \
    \ <span class=\"icon-bar\"></span>\n          </button>\n          <a class=\"\
    navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n        <div class=\"\
    collapse navbar-collapse navbarLinks\">\n          <ul class=\"nav navbar-nav\"\
    >\n            <li class=\"active\"><a href=\"#home\">Home</a></li>\n        \
    \    <li class=\"\"><a href=\"#about\">About</a></li>\n            <li class=\"\
    \"><a href=\"#contact\">Contact Us</a></li>\n            <li class=\"\"><a href=\"\
    #map\">Map</a></li>\n          </ul>\n        </div>\n      </div>\n    </nav>\n\
    \    <div data-spy=\"scroll\" data-target=\"#navbarExample\" \ndata-offset=\"\
    0\" class=\"scrollspy-example\">\n\n        <h4 id=\"Home\">Home</h4>\n      \
    \  <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\n        <h4 id=\"about\"\
    >About</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\n \
    \       <h4 id=\"contact\">Contact Us</h4>\n        <p>Lorem ipsum dolor sit amet,\
    \ consectetur ... </p>\n\n        <h4 id=\"map\">Map</h4>\n        <p>Lorem ipsum\
    \ dolor sit amet, consectetur ... </p>\n\n    </div>\n  </div>\n\n    <script\
    \ src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"></script>\n\
    \  </body>\n</html>\n```\n\nIn [Figure 4.10](#ch04.html_scrollspy \"Figure 4.10.\
    \ Using ScrollSpy\"), you can see that I've scrolled down to the “About” section,\
    \ and the “About” link is highlighted in the navbar.\n\n![Using ScrollSpy](figures/ch4Image10.png)\n\
    \nFigure 4.10. Using ScrollSpy\n\n### ScrollSpy with JavaScript\n\nBootstrap has\
    \ the `scrollspy()` method that takes optional parameters to customize the `ScrollSpy`\
    \ plugin. You can set the target navbar's parent class through JavaScript by passing\
    \ the appropriate options object as follows:\n\n```javascript\n$('.scrollspy-example').scrollspy({\
    \ target: '#navbarExample' });\n```\n\nIf you are passing options through JavaScript,\
    \ you can ignore setting `data-*` attributes inside the element's markup.\n\n\
    Another important parameter that can be passed is the `refresh` string. If you've\
    \ done DOM manipulations such as adding or deleting elements from the ScrollSpy\
    \ area, you'll need to call the `scrollspy(\"refresh\")` method. This will help\
    \ ScrollSpy to recalculate the height of the scrollable area, which might have\
    \ changed due to the addition and deletion of DOM.\n"
