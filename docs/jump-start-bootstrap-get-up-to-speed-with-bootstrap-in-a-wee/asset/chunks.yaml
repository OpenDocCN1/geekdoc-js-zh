  trans: "\n\n在采用某项技术之前，查看基于该技术的真实项目是非常值得的。这有助于我们清楚地了解使用该特定技术可以实现什么。以下是一些借助 Bootstrap\
    \ 创建的真实网站项目示例：\n\n*   [OpenDesk](https://www.opendesk.cc/)\n*   [Riot Designs](http://riotdesign.eu/en/)\n\
    *   [20Jeans](https://www.20jeans.com/)\n*   [Red Antler](http://redantler.com/)\n\
    *   Uberflip\n\n## 响应式网页设计概述\n\n`Responsive web design` 允许开发者创建一个能够随时更改布局的网站。开发者可以创建一个适用于任何类型设备的单一设计：包括手机、平板电脑、智能电视和电脑。\n\
    \n采用响应式设计的网站通常是流式设计。它们会根据查看时时的屏幕大小调整自己，并兼容移动设备的触摸接口。通过使用响应式网页设计，开发者可以创建强大的 Web\
    \ 应用，取代 iOS 和 Android 等平台上的原生应用。\n\n### 根据屏幕尺寸调整布局\n\n让我们来看一个示例以更好地理解这个概念。假设我们有一个针对桌面屏幕的布局，如图\
    \ 1.3 所示。\n\n![Our layout for a desktop screen](img/ch1Image8.png)\n\n图 1.3 我们的桌面屏幕布局\n\
    \n我们的桌面布局有三个主要部分：页眉（header）、内容区域和页脚（footer）。页眉部分包含一个 Logo 和矩形广告。内容区域包含四个水平排列的较小文章。然后，我们在较小文章下方放置了两个较大的文章。最后，我们有一个页脚部分，其中有简单的版权文本。\n\
    \n显而易见，我们无法在平板电脑和手机上轻松查看此页面，因为它无法正确适应屏幕。该设计需要为那些用户进行定制。\n\n假设我们已经使用 Bootstrap\
    \ 创建了桌面布局。我们使用了它的网格系统创建了响应式设计，以便布局会自动调整以适应平板电脑和移动设备。\n\n在平板设备上，布局将将如图 1.4 所示。广告已从页眉部分隐藏，Logo\
    \ 居中显示。布局完美适配。\n\n![Our layout adjusted for tablet screens](img/ch1Image9.png)\n\
    \n图 1.4 我们的平板屏幕调整布局\n\n在智能手机视图中（如图 1.5 所示），我们可以看到页眉部分继续遵循平板电脑视图，但内容部分发生了巨大变化。文章重新流向底部，形成两行，每行包含两篇文章。较大的文章现在堆叠在一起——每行一篇文章（第二个较大的文章超出了屏幕底部）。\n\
    \n![Our layout adjusted for smartphones](img/ch1Image10.png)\n\n图 1.5 我们的智能手机调整布局\n\
    \n这是对响应式设计行为如何的一个非常基础的概述。显然，我们可以做的比上述示例展示的要得多。我们将在第 2 章学习网格系统时学习更多关于响应式网页设计的知识。\n\
    \n## 准备好 Bootstrap\n\n最后，我们来到了本章最重要的的话题：开始上手使用 Bootstrap！\n\n首先，我们需要 Bootstrap\
    \ 软件包，因此让我们访问 Bootstrap 官网 [`getbootstrap.com`](http://getbootstrap.com) 下载最新的\
    \ 3.x.x 版本。提取压缩包并复制以下文件夹：\n\n```\n- /css\n- /fonts\n- /js\n```\n\n创建一个任何你喜欢的名称的项目文件夹。我给它命名为\
    \ `Bootstrap_demos`。将上述文件夹粘贴到此项目文件夹中。\n\n现在打开你最喜欢的 HTML 编辑器（我个人推荐 [Sublime Text](http://www.sublimetext.com/)），创建一个名为\
    \ `index.html` 的新文件，并将以下代码段输入其中：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n  <head>\n    <title>My First Bootstrap Application</title>\n  </head>\n  <body>\n\
    \n  </body>\n</html>\n```\n\n这是我们第一个 Bootstrap 应用的简单 HTML 结构。\n\n我们的项目目录现在应该像图\
    \ 1.6 所示。\n\n![Our initial project folder structure](img/ch1Image11.png)\n\n图\
    \ 1.6 我们的初始项目文件夹结构\n\n现在让我们在我们的 HTML 文件中引入 Bootstrap。首先，我们需要引入 Bootstrap 的 CSS\
    \ 文件。打开 `/css` 文件夹，你应该能看到一个名为 `bootstrap.css` 的文件。这是 Bootstrap 主 CSS 文件。\n\n###\
    \ 注意：什么是 bootstrap.min.css？\n\n还有另一个名为 `bootstrap.min.css` 的文件，它是 `bootstrap.css`\
    \ 的 `minified`（压缩）版本。它之所以被称为压缩版是因为它没有空格和注释，这减少了文件的大小。它将在你的项目完成并准备上线时使用。\n\n将我们的\
    \ CSS 文件链接到 `index.html` 中。在 `<head>` 标签内 `<title>` 标签下方放置以下内容：\n\n```html\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n```\n\nBootstrap\
    \ 需要 jQuery 才能使其 JavaScript 组件工作。访问 [jquery.com](http://jquery.com/) 下载 jQuery\
    \ 1.11.0 版本。Bootstrap 支持 Internet Explorer 8 及以上版本。如果你下载 jQuery 2 版本，IE8+ 将无法正常运行，因为\
    \ jQuery 在 2 及以上版本中已正式放弃了对 IE8 的支持。因此，需要 jQuery 1.11.0，即 jQuery 1 的最新版本。\n\n下载\
    \ `jquery.js` 文件后，将其粘贴到项目目录的 `/js` 文件夹中。接下来，我们将使用以下代码将其链接到 `index.html`：\n\n```html\n\
    <script src=\"js/jquery.js\"></script>\n```\n\n建议将 jQuery 插入到 `<body>` 标签内部而不是\
    \ `<head>` 标签。这样 jQuery 会在所有 HTML 内容加载后加载，从而缩短页面加载时间。\n\n现在我们必须引入 Bootstrap 的\
    \ JavaScript 文件：\n\n```html\n<script src=\"js/bootstrap.js\"></script>\n```\n\n\
    `index.html` 现在应该像这样：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n\
    \    <title>My First Bootstrap Application</title>\n    <link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"css/bootstrap.css\">\n  </head>\n  <body>\n\n     \
    \   <script src=\"js/jquery.js\"></script>\n        <script src=\"js/bootstrap.js\"\
    ></script>\n  </body>\n</html>\n```\n\n为了让 Bootstrap 完全兼容每种设备，我们需要包含一些必要的 meta\
    \ 标签。\n\n首先，我们应该告诉浏览器我们的网站包含 Unicode 字符集中的字符，它是 ASCII 字符集的超集。这是通过以下 meta 标签实现的：\n\
    \n```html\n<meta charset=\"utf-8\">\n```\n\n有时，Internet Explorer 可能在 `compatibility\
    \ 模式` 下运行。使用以下代码段将强制 IE 使用最新的渲染引擎来渲染我们的网站。这将防止我们的网站崩溃，因为旧的渲染引擎不支持 CSS 的所有属性：\n\
    \n```html\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n```\n\n\
    接下来，我们将网站占据浏览器窗口内的所有可用空间，无论是平板、手机还是桌面屏幕。我们告诉浏览器将我们的应用程序缩放到可用窗口空间的大小：\n\n```html\n\
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n```\n\
    \n代码中的 `initial-scale=1` 意味着将其缩放为 100%。\n\n现在我们的 `index.html` 应该像这样：\n"
- fmt: "\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta\
