  trans: "\n你需要添加一个值为 `tooltip` 的 `data-toggle` 属性，一个包含你想显示在提示中的文本的 `title` 属性，以及一个\
    \ `data-placement` 属性。`data-placement` 属性接受以下四个值之一：`top`、`bottom`、`left` 和 `right`。顾其名，`data-placement`\
    \ 属性定义了提示相对于父组件的位置。\n\n让我们在浏览器中查看这个按钮吧。你会发现它无法工作；当鼠标悬停在按钮上时，没有提示出现。由于性能考虑，Bootstrap\
    \ 中的提示框需要通过 jQuery 手动初始化。因此，让我们在 body 中所有的 `<script>` 标签之后添加以下脚本：\n\n```\n<script\
    \ type=\"text/javascript\">\n  $(document).ready(function(){\n    $('.tooltipButton').tooltip();\n\
    \  });\n</script>\n```\n\n在这段代码中，我们使用了 `tooltipButton` 类作为选择器。因此，我们需要为按钮添加这个类，提示框才能正常工作。\n\
    \n我们还需要修改按钮的 HTML 代码并为它添加 `tooltipButton` 类：\n\n```\n<button type=\"button\" class=\"\
    btn btn-default tooltipButton\" \ndata-toggle=\"tooltip\" data-placement=\"bottom\"\
    \ \ntitle=\"I am a Bootstrap button\">Who am I?</button>\n```\n\n刷新网页，提示框应该就会出现，如图\
    \ 4.15 所示。\n\n![A tooltip](img/ch4Image16.png)\n\n图 4.15. 一个 tooltip\n\n### 使用\
    \ JavaScript 的提示框\n\n我们刚刚看到需要调用 `tooltip()` 方法来让提示框生效。在这里，我们将看到如何通过此函数传递各种选项来自定义提示框插件。\n\
    \n该方法接受一个包含各种可选属性的对象，用于更改提示框的通用行为：\n\n```\nvar options = {\n    animation : true;\n\
    };\n\n$(\".tooltipButton\").tooltip(options);\n```\n\n在代码中，我定义了一个名为 `options`\
    \ 的 JavaScript 对象。我将 `animation` 属性设置为 `true`，这样提示框在每次显示时都会获得淡入效果。最后，我将此对象传递给\
    \ `tooltip()` 方法。\n\n其他可以传递的属性包括：\n\n- `html`: 此属性接收一个布尔值。如果将其设置为 `true`，则 `title`\
    \ 属性中的内容将被解析为 HTML。否则，它将原样显示。\n- `placement`: 此属性接收五个字符串值：`top`、`bottom`、`left`、`right`\
    \ 和 `auto`。它定义了提示相对于组件的位置。如果设置为 `auto`，提示框将自动定位。\n- `selector`: 这是 Bootstrap 提供的特殊选项。如果你在父容器上调用了\
    \ `tooltip()` 方法，你可能想过滤掉提示框应该作用的子元素，可以通过此选项来实现。你可以提供如 `a`、`a[href='hello.html']`\
    \ 或 `button[class='tooltipbuttons']` 等值。\n- `title`: 如果你在 HTML 标记中未使用自定义属性 `data-title`，则可以通过此选项传递提示标题。它接收一个字符串值，例如\
    \ `title: \"This is a button\".`。\n- `trigger`: 所有提示都通过悬停在组件上显示。使用此选项可以覆盖默认行为。该选项可以的值有：`click`、`focus`、`hover`\
    \ 和 `manual`。你也可以用空格组合这些值；例如 `click hover`、`hover focus` 等。\n- `delay`: 如果你不希望提示框立即出现，请使用此属性设置延迟时间（毫秒为单位）。\n\
    - `container`: 使用此属性将提示框附加到特定元素（如 `body`）。这可以防止提示框在窗口缩放时偏离触发元素。\n\n除了接受选项对象外，`tooltip()`\
    \ 方法还接受几个预定义的字符串值。这些字符串映射到提示框的自定义行为；例如：\n\n```\n$('.tooltipButton').tooltip('show');\n\
    ```\n\n传递字符串 `show` 将使提示框出现。可能的字符串值有：\n\n1. `show`: 显示提示框\n2. `hide`: 隐藏提示框\n\
    3. `toggle`: 切换提示框状态（如果提示框当前隐藏的，则会显示它，反之亦然）\n4. `destroy`: 此字符串隐藏并销毁特定元素的提示框；一旦销毁，关联的提示框无法再次使用\n\
    \n与其他 Bootstrap 插件一样，提示框还带有自定义事件，可以捕获这些事件以执行额外任务。这些事件是：\n\n1. `show.bs.tooltip`:\
    \ 该事件在提示框可见之前触发\n2. `shown.bs.tooltip`: 该事件在提示框可见之后触发\n3. `hide.bs.tooltip`: 在提示框隐藏之前触发\n\
    4. `hidden.bs.tooltip`: 在提示框隐藏之后触发\n\n以下是它们的使用方法：\n\n```\n$('.tooltipButton').on('show.bs.tooltip',\
    \ function () {\n  console.log(\"Showing tooltip..\");\n});\n\n$('.tooltipButton').on('shown.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip shown.\");\n});\n\n$('.tooltipButton').on('hide.bs.tooltip',\
    \ function () {\n  console.log(\"Hiding tooltip..\");\n});\n\n$('.tooltipButton').on('hidden.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip hidden.\");\n});\n```\n\n### 弹出框 (Popovers)\n\
    \n弹出框是另一个实用的插件，与提示框可以相拟。不同之处在于，弹出框比提示框更大、更漂亮，如图 4.16 所示。它们看起来与 Apple iBooks 字典功能中的弹出框非常相似。\n\
    \n![Popovers versus tooltips](img/ch4Image17-1.png)\n\n图 4.16. 弹出框与提示框\n\n你在弹出框中放置的内容比提示框多。当你有更多\
    \ HTML 内容或文本需要显示时，建议使用弹出框而不是提示框。\n\n让我们在按钮的点击事件上触发弹出框。实现此目的标记为：\n\n```\n<button\
    \ type=\"button\" class=\"btn btn-danger\" data-toggle=\"popover\" \ndata-placement=\"\
    bottom\" data-content=\"Lorem Ipsum.\" \ntitle=\"This is a demo popover\">Click\
    \ Me!</button>\n```\n\n弹出框插件运行需要几个 `data-*` 属性。这些与提示框使用的自定义属性类似。`data-toggle`\
    \ 属性指示在按钮上执行操作时触发什么。`data-placement` 属性指定弹出框的位置。`data-content` 属性包含你想在弹出框中传递的内容。最后，设置\
    \ `title` 属性为插件添加标题。\n\n与提示框一样，弹出框也需要手动初始化。你可以使用以下脚本：\n\n```\n<script type=\"\
    text/javascript\"\n  $(document).ready(function(){\n     $('.popoverButton').popover();\n\
    \  });\n</script>\n```\n\n由于代码中的选择器是一个类，我们需要为按钮添加 `popoverButton` 类。结果如图 4.17\
    \ 所示。\n\n![Popover](img/ch4Image17.png)\n\n图 4.17. 弹出框\n\n### 使用 JavaScript 的弹出框\n\
    \nBootstrap 提供了 `popover()` 方法来自定义弹出框插件的默认行为。它接受一个选项对象，就像提示框插件之前之前之前提示框插件的所有选项属性也适用于弹出框插件。\n\
    \n例如：\n\n```\nvar options = {\n    animation: true,\n    placement: \"right\"\n\
    };\n\n$('.popoverButton').popover(options);\n```\n\n弹出框插件还接受一组预定义的字符串，这些字符串映射到弹出框的某些行为；例如：\n\
    \n```\n$('.popoverButton').popover(\"show\");\n```\n\n就像提示框插件一样，我们有一组相同的预定义字符串来更改弹出框的状态。传递\
    \ `show` 字符串时，弹出框将变为可见。其他可用的字符串有：`hide`、`toggle` 和 `destroy`。\n"
- fmt: "\nPopovers also come with custom events very similar to the events of the\
    \ tooltip plugin. The events associated with popovers are:\n\n1. `show.bs.popover`:\
    \ fired just before showing the popover\n2. `shown.bs.popover`: fired after the\
    \ popover is shown\n3. `hide.bs.popover`: fired just before hiding the popover\n\
    4. `hidden.bs.popover`: fired after hiding the popover\n\nUsage is similar to\
    \ the tooltip plugin:\n\n```javascript\n$('.popoverButton').on('show.bs.popover',\
    \ function () {\n    console.log(\"Opening popover..\");\n});\n\n$('.popoverButton').on('shown.bs.popover',\
    \ function () {\n    console.log(\"Popover opened.\");\n});\n\n$('.popoverButton').on('hide.bs.popover',\
    \ function () {\n    console.log(\"Hiding popover..\");\n});\n\n$('.popoverButton').on('hidden.bs.popover',\
    \ function () {\n    console.log(\"Popover hidden.\");\n});\n```\n\n## Getting\
    \ Fancy\n\nIn this section, we will be discussing two very important plugins:\
    \ `carousel` and `modal`.\n\nCarousel is a responsive slideshow plugin and modal\
    \ is a lightbox-like plugin. Each one lets you showcase your content in a fancy\
    \ way.\n\n### Carousel\n\nSlideshows are very popular, and can be used for news,\
    \ ecommerce, and video sharing sites, for instance. This type of feature is used\
    \ to showcase the most popular items on the website in a well-organized, attractive\
    \ slideshow. Building such slideshows can be time-consuming, however, and these\
    \ features can also be prone to bugs. In this section, we'll see how to use Bootstrap's\
    \ `carousel` plugin to build beautiful responsive slideshows.\n\nThe markup for\
    \ creating a carousel is as follows:\n\n```html\n<div id=\"bestCarsCarousel\"\
    \ class=\"carousel slide\" data-ride=\"carousel\">\n    <!-- Indicators -->\n\
    \    <ol class=\"carousel-indicators\">\n        <li data-target=\"#bestCarsCarousel\"\
    \ data-slide-to=\"0\" class=\"active\"></li>\n        <li data-target=\"#bestCarsCarousel\"\
    \ data-slide-to=\"1\"></li>\n        <li data-target=\"#bestCarsCarousel\" data-slide-to=\"\
    2\"></li>\n    </ol>\n    <!-- Wrapper for slides -->\n    <div class=\"carousel-inner\"\
    >\n        <div class=\"item active\">\n            <img src=\"images/car1.jpg\"\
    >\n            <div class=\"carousel-caption\">\n                <h3>Car 1</h3>\n\
    \                <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n        \
    \    </div>\n        </div>\n        <div class=\"item\">\n            <img src=\"\
    images/car2.jpg\">\n            <div class=\"carousel-caption\">\n           \
    \     <h3>Car 2</h3>\n                <p>Lorem ipsum dolor sit amet, consectetur\
    \ ...</p>\n            </div>\n        </div>\n        <div class=\"item\">\n\
    \            <img src=\"images/car3.jpg\">\n            <div class=\"carousel-caption\"\
    >\n                <h3>Car 3</h3>\n                <p>Lorem ipsum dolor sit amet,\
    \ consectetur ...</p>\n            </div>\n        </div>\n    </div>\n    <!--\
    \ Controls -->\n    <a class=\"left carousel-control\" href=\"#bestCarsCarousel\"\
    \ data-slide=\"prev\">\n        <span class=\"glyphicon glyphicon-chevron-left\"\
    ></span>\n    </a>\n    <a class=\"right carousel-control\" href=\"#bestCarsCarousel\"\
    \ data-slide=\"next\">\n        <span class=\"glyphicon glyphicon-chevron-right\"\
    ></span>\n    </a>\n</div>\n```\n\nAs seen in the code, the main wrapper container\
    \ for our carousel should have the classes `carousel` and `slide`. The class `slide`\
    \ is used to give a sliding effect to each slide in the carousel. It should also\
    \ have a custom attribute `data-ride`, which tells Bootstrap to start the sliding\
    \ effect as soon as the page loads. Without this attribute the slides will fail\
    \ to change automatically until you've done so manually the first time.\n\nEvery\
    \ carousel plugin has three subsections in it: indicators, body, and controls.\n\
    \nTo create a carousel Indicator, you have to define an ordered list with a class\
    \ of `carousel-indicators`. The number of `li` elements in it depends on the number\
    \ of slides you want to have. Each `li` element should have a `data-target` attribute\
    \ containing the ID of the carousel container. It should also have a `data-slide-to`\
    \ attribute containing the sequence number of the particular slide it will point\
    \ to.\n\nNext, we build the heart of the carousel, the slides. First, we create\
    \ a wrapper element for all the slides. This will be a `div` with the class `carousel-inner`.\
    \ Each slide is defined by a `div` element that has a class `item`. Every item\
    \ must have a representing image and optional textual data. This image will be\
    \ used as a background for that particular slide item. For each image we can add\
    \ related captions and some additional textual data. These captions are wrapped\
    \ by a `div` element that has a class `carousel-caption`. The caption can be inserted\
    \ using any one of the HTML heading tags: `<h1>`, `<h2>`, `<h3>`, and so on. For\
    \ related text you can use `<p>` tags.\n\nRepeat the same `item` markup for each\
    \ slide. After you're done with creating all the slides, we'll build a controls\
    \ section for navigating carousel content.\n\nThe carousel controls are constructed\
    \ using `<a>` tags with a class `carousel-control` and `href` containing the ID\
    \ of the carousel. The `data-slide` attribute can be `prev` or `next`. The symbols\
    \ are provided by glyphicons.\n\n### Carousel with JavaScript\n\nBootstrap has\
    \ the `carousel()` method for calling carousels through JavaScript. You can use\
    \ this method to pass customized options to change the default behavior.\n\nThere\
    \ are only three options available for carousel: `interval`, `pause`, and `wrap`.\
    \ Here they are in the code:\n\n```javascript\nvar options = {\n    interval:\
    \ 7000,\n    pause: 'hover',\n    wrap: true\n};\n\n$('#bestCarsCarousel').carousel(options);\n\
    ```\n\nThe `interval` property is used to specify the time duration between each\
    \ slide. The `pause` option takes only one value `hover`, which tells Bootstrap\
    \ to stop carousel sliding on mouse hover. The `wrap` option takes Boolean values\
    \ to set the cycling of carousel to or off. If set to `true`, the carousel will\
    \ start sliding to the first slide after displaying the last.\n\nOther parameters\
    \ that can also be passed to the `carousel()` method include:\n\n1. `cycle`: to\
    \ enable cycling functionality of a carousel\n2. `pause`: to pause the slideshow\
    \ from JavaScript\n3. `number`: to specify the time duration between two slides\n\
    4. `prev`: to change the slide to the previous slide\n5. `next`: to change the\
    \ slide to the next slide\n\nThe carousel plugin comes with two custom events:\n\
    \n1. `slide.bs.carousel`: fired before the slide is changed\n2. `slid.bs.carousel`:\
    \ fired after the slide has changed\n\nHere's how to use them:\n\n```javascript\n\
    $('#bestCarsCarousel').on('slide.bs.carousel', function () {\n    console.log(\"\
    Changing slide..\");\n});\n\n$('#bestCarsCarousel').on('slid.bs.carousel', function\
    \ () {\n    console.log(\"Slide changed.\");\n});\n```\n\n### Modals\n\n**Modals**\
    \ are HTML elements that are hidden in a web page, sliding down from the top of\
    \ the screen when triggered. It is one of the best plugins to use to display dialog\
    \ prompts, such as alert and confirm dialogs. You can also use it to showcase\
    \ a larger version of an image, display a long list of terms and conditions, or\
    \ to display sign-up/login forms.\n"
