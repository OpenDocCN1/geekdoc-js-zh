    ## 总结\n\n在本章中，我们学习了一系列开箱即用的可复 Bootstrap 组件。正如你所看到的，Bootstrap 提供了许多不同的组件，起初你可能会发现很难记住这么多不同类型的类；但是，当你遇到困难时，可以随时参考[文档来获取帮助](http://getbootstrap.com/components)。\n\
    \n# 第 4 章## 趣玩与获益的 Bootstrap 插件\n\nJavaScript 是 Web 端*事实上的*脚本语言。精美的图片幻灯片、下拉菜单和弹出框（popovers）只是通过\
    \ JavaScript 结合 CSS 创建的流行网站功能的几个例子。在本章中，我们将查看 Bootstrap 3 为我们提供的一些开箱即用的 JavaScript\
    \ 插件，使我们能够轻松创建此类高级网站功能。\n\n使用 Bootstrap 的 JavaScript 插件有两种不同的方法。第一种方法完全不需要 JavaScript。你只需要遵循推荐的\
    \ HTML 标记即可使用它们。另一种方法则需要一些 JavaScript 知识来初始化和自定义插件。我们将讨论使用插件的两种方法，你可以决定哪种最适合你。\n\
    \n我们在本章中使用的所有插件都包含在 `bootstrap.js` 或 `bootstrap.min.js` 中。如果你遵循了第 1 章，中下载 Bootstrap\
    \ 的说明，你应该会在项目的 `/js` 文件夹中找到 `bootstrap.js`。\n\n在继续之前，让我们为本章设置一个新项目。我们将使用在第 1 章，中创建的相同文件夹\
    \ `Bootstrap_demos`。复制此文件夹中的所有文件并粘贴到名为 `Chapter 4` 的新文件夹中。使用文本编辑器打开 `index.html`。将\
    \ `<title>` 标签内的文本改为“Bootstrap Plugins”。接下来，从 `<body>` 中移除 `<h1>` 标签。最后，`index.html`\
    \ 文件应该如下所示：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"\
    utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\">\n\n   \
    \ <title>Bootstrap Plugins</title>\n    <link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"css/bootstrap.css\">\n\n    <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
    3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n\n\
    \      <script src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"\
    ></script>\n  </body>\n</</html>\n```\n\n## 扩展功能\n\n想象一下，没有一个没有任何下拉功能的菜单栏。感觉很无聊，对吧？导航栏仅由简单的链接列表组成的日子已经过去了。在本节中，我们将使用一些\
    \ Bootstrap 的 JavaScript 插件，来帮助扩展我们网站现有组件的功能。我们将看到如何向导航栏中添加下拉菜单、点击时切换按钮状态的能力、在显示一段时间后消失的精美警报消息等。\n\
    \n### 下拉菜单\n\n创建下拉菜单的标记如下：\n\n```\n<div class=\"dropdown\">\n    <a data-toggle=\"\
    dropdown\" data-target=\"#\" \nhref=\"http://www.google.com\">\n        Dropdown\
    \ <span class=\"caret\"></span>\n    </a>\n    <ul class=\"dropdown-menu\">\n\
    \        <li><a href=\"#\">Link 1</a></li>\n        <li><a href=\"#\">Link 2</a></li>\n\
    \        <li><a href=\"#\">Link 3</a></li>\n        <li><a href=\"#\">Link 4</a></li>\n\
    \    </ul>\n<//div>\n```\n\n每个下拉菜单都应该包含两个重要的元素：一个 `<a>` 元素和一个 `<ul>` 元素。在这里，`<ul>`\
    \ 元素默认是隐藏的，`<a>` 元素用于切换下拉菜单。`<a>` 元素有两个必要的 `data-*` 属性：`data-toggle` 和 `data-target`。`data-toggle`\
    \ 属性告诉 Bootstrap 在每次点击链接元素时激活该链接的下拉效果。另一方面，`data-target` 属性用于防止点击链接时页面重定向。在这里提供\
    \ `href` 属性是没有必要的，因为它会被忽略。此链接元素应该包含一些锚点文本，例如“Dropdown”，以及一个向下箭头图标，该图标是使用 `caret`\
    \ 类生成的。\n\n### 注意：Caret 是字体图标（Glyphicon）吗？\n\n`caret` 类不是一个 glyphicon 类。Bootstrap\
    \ 为 `caret` 类编写了特殊的 CSS 样式，以生成这个向下箭头图标。如果你想学习他们是如何做到的，打开 `bootstrap.css` 文件并搜索\
    \ `.caret`。你也可以使用 glyphicon 代替这个箭头：\n\n```\n<span class=\"glyphicon-chevron-down\"\
    ></span>\n```\n\n一旦标记放置得当，`<ul>` 应该具有 `dropdown-menu` 类。现在，我们有了一个简单的下拉菜单，它显示的菜单如图\
    \ 4.1 所示。\n\n![简单的下拉菜单](img/ch4Image1.png)\n\n图 4.1. 简单的下拉菜单\n\n让我们在上一章中创建的标签和菜单上使用下拉插件。这里是胶囊菜单（pills\
    \ menu）的标记：\n\n```\n<ul class=\"nav-pills\">\n  <li class=\"active\"><a href=\"\
    #\">Home</a></a></li>\n  <li class=\"dropdown\">\n        <a data-toggle=\"dropdown\"\
    \ data-target=\"#\" \nhref=\"http://www.google.com\">\n            Profile <span\
    \ class=\"caret\"></span>\n        </a>\n        <ul class=\"dropdown-menu\">\n\
    \            <li><a href=\"#\">Link 1</a></li>\n            <li><a href=\"#\"\
    >Link 2</a></li>\n            <li><a href=\"#\">Link 3</a></li>\n            <li><a\
    \ href=\"#\">Link 4</a></li>\n        </ul>\n  </li>\n  <li><a href=\"#\">Messages</a></li>\n\
    </ul>\n```\n\n我们将下拉插件的整个标记放置在第二个 `<li>` 元素中，并为它分配了 `dropdown` 类。因此，上述带有下拉插件的胶囊菜单看起来应该像图\
    \ 4.2。\n\n![带有下拉菜单的胶囊菜单](img/ch4Image2.png)\n\n图 4.2. 带有下拉菜单的胶囊菜单\n\n你可以像前面的代码那样，通过注入此下拉插件来配合任何组件。\n\
    \n### 使用 JavaScript 的下拉菜单\n\nBootstrap 的下拉插件也可以使用 JavaScript 使用。与其提供 `data-*`\
    \ 等自定义属性，你可以使用 JavaScript 对象来传递此类信息。Bootstrap 使用 jQuery 库处理所有与 JavaScript 相关的操作。因此，导入\
    \ `jquery.js` 对于在 Bootstrap 中使用 JavaScript 自定义至关重要。通过 jQuery 触发下拉插件，你需要使用 `dropdown()`\
    \ 方法：\n\n```\n$().dropdown('toggle');\n```\n\n我们可以使用此方法在每次页面加载时，将下拉菜单的状态从关闭切换到打开。例如，如果我们创建下拉菜单的代码段如下：\n\
    \n"
- fmt: "\n```\n<div class=\"dropdown\" id=\"myDropdown\">\n    <a class=\"myDropdownHandle\"\
    \ data-toggle=\"dropdown\" \n↵data-target=\"#\" href=\"#\">\n        Dropdown\
    \ <span class=\"caret\"></span>\n    </a>\n    <ul class=\"dropdown-menu\">\n\
    \        <li><a href=\"#\">Link 1</a></li>\n        <li><a href=\"#\">Link 2</a></li>\n\
    \        <li><a href=\"#\">Link 3</a></li>\n        <li><a href=\"#\">Link 4</a></li>\n\
    \    </ul>\n</div>\n```\n\nYou need to call the `dropdown()` method on the `ready()`\
    \ method of jQuery:\n\n```\n<script type=\"text/javascript\">\n    $(document).ready(function(){\n\
    \        $('.myDropdownHandle').dropdown('toggle');\n    });\n</script>\n```\n\
    \nYou can see I have used the `dropdown()` method after selecting `.myDropdownHandle`.\
    \ By default, the state of a dropdown is closed; whenever you refresh the page\
    \ it will toggle the state and make the menu visible.\n\nBootstrap provides various\
    \ events attached to the dropdown plugin. They are:\n\n- `show.bs.dropdown`: this\
    \ event is triggered when the handle is just clicked; the dropdown handle has\
    \ received the request to open the hidden menu\n- `shown.bs.dropdown`: this event\
    \ is triggered after the menu is shown\n- `hide.bs.dropdown`: this event is triggered\
    \ just before closing the menu\n- `hidden.bs.dropdown`: this event is triggered\
    \ when the menu is closed\n\nThe `show` and `hide` events happen just before completing\
    \ the request whereas `shown` and `hidden` events happen as the request is complete.\
    \ Here, the request was to open and close the dropdown menu.\n\nLet me show you\
    \ a demo explaining how to use these events. I have written the following jQuery\
    \ snippet to target all the states of a dropdown plugin that prints a statement\
    \ as each event is triggered:\n\n```\n$('#myDropdown').on('show.bs.dropdown',\
    \ function () {\n   console.log(\"Opening dropdown..\");\n});\n\n$('#myDropdown').on('shown.bs.dropdown',\
    \ function () {\n   console.log(\"Dropdown opened..\");\n});\n\n$('#myDropdown').on('hide.bs.dropdown',\
    \ function () {\n   console.log(\"Hiding dropdown..\");\n});\n\n$('#myDropdown').on('hidden.bs.dropdown',\
    \ function () {\n   console.log(\"Dropdown hidden..\");\n});\n```\n\nOn clicking\
    \ the link handle, the console is populated with the first two messages: “Opening\
    \ dropdown” and “Dropdown opened”, as seen in [Figure 4.3](#ch04.html_initialclick\
    \ \"Figure 4.3. The initial click\").\n\n![The initial click](figures/ch4Image3.png)\n\
    \nFigure 4.3. The initial click\n\nClicking the handle again will display the\
    \ last two messages, as shown in [Figure 4.4](#ch04.html_clickagain \"Figure 4.4.\
    \ Clicking the handle again\").\n\n![Clicking the handle again](figures/ch4Image4.png)\n\
    \nFigure 4.4. Clicking the handle again\n\nFinally, `index.html` with the above\
    \ events should look like this:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    \  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n    <title>Bootstrap Plugins</title>\n    <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if lt IE\
    \ 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/3.7.0/\n↵html5shiv.js\"\
    ></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/1.4.2/\n\
    ↵respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n       \
    \ <div class=\"container\">\n            <div class=\"dropdown\" id=\"myDropdown\"\
    >\n                <a class=\"myDropdownHandle\" data-toggle=\"dropdown\" \n↵data-target=\"\
    #\" href=\"#\">\n                    Dropdown <span class=\"caret\"></span>\n\
    \                </a>\n                <ul class=\"dropdown-menu\">\n        \
    \            <li><a href=\"#\">Link 1</a></li>\n                    <li><a href=\"\
    #\">Link 2</a></li>\n                    <li><a href=\"#\">Link 3</a></li>\n \
    \                   <li><a href=\"#\">Link 4</a></li>\n                </ul>\n\
    \            </div\n        </div>\n\n    <script src=\"js/jquery.js\"></script>\n\
    \    <script src=\"js/bootstrap.js\"></script>\n    <script type=\"text/javascript\"\
    >\n        $(document).ready(function(){\n\n            $('#myDropdown').on('show.bs.dropdown',\
    \ function () {\n               console.log(\"Opening dropdown..\");\n       \
    \     });\n\n            $('#myDropdown').on('shown.bs.dropdown', function ()\
    \ {\n               console.log(\"Dropdown opened..\");\n            });\n\n \
    \           $('#myDropdown').on('hide.bs.dropdown', function () {\n          \
    \     console.log(\"Hiding dropdown..\");\n            });\n\n            $('#myDropdown').on('hidden.bs.dropdown',\
    \ function () {\n               console.log(\"Dropdown hidden..\");\n        \
    \    });\n\n        });\n    </script>\n  </body>\n</html>\n```\n\nYou will find\
    \ these events extremely useful in situations where the links in the dropdown\
    \ menu are dynamically populated with data from the server. In such cases, you\
    \ can fire an Ajax request to the server on the `show.bs.dropdown` event and populate\
    \ the dropdown menu before it is shown.\n\n### Alert Messages\n\nBootstrap comes\
    \ with a very useful component for displaying alert messages in various sections\
    \ of our website; you can use them for displaying a success message, a warning\
    \ message, a failure message, or an information message. These messages can be\
    \ annoying to visitors, hence they should have dismiss functionality added to\
    \ give visitors the ability to hide them.\n\nIn this section, we'll create an\
    \ alert message using Bootstrap and see how we can add dismiss functionality to\
    \ it.\n\nHere's the markup for a “success” alert message:\n\n```\n<div class=\"\
    alert alert-success\">\n    Amount has been transferred successfully.\n</div>\n\
    ```\n\nEvery alert should have the `alert` class attached to it. It should also\
    \ have an additional contextual class, such as `alert-success`. There are four\
    \ self-explanatory contextual classes for alert messages:\n\n1. `alert-success`\n\
    2. `alert-info`\n3. `alert-danger`\n4. `alert-warning`\n\nThe alert shown in the\
    \ above code doesn't have a dismiss functionality, so it is always visible in\
    \ the web page, as shown in [Figure 4.5](#ch04.html_alertnoddismiss \"Figure 4.5.\
    \ A regular alert message without dismiss functionality\").\n\n![A regular alert\
    \ message without dismiss functionality](figures/ch4Image5.png)\n\nFigure 4.5.\
    \ A regular alert message without dismiss functionality\n\nThe markup for a dismissable\
    \ alert box, and what it looks like onscreen in [Figure 4.6](#ch04.html_dismissable\
    \ \"Figure 4.6. A dismissable alert box\"), is as follows:\n\n```\n<div class=\"\
    alert alert-success alert-dismissable\">\n    <button type=\"button\" class=\"\
    close\" data-dismiss=\"alert\">\n&times;</button>\n    Amount has been transferred\
    \ successfully.\n</div>\n```\n\n![A dismissable alert box](figures/ch4Image6.png)\n\
    \nFigure 4.6. A dismissable alert box\n\nTo create a dismissable alert message,\
    \ we need to add class `alert-dismissable` to the alert box. Next, we require\
    \ a button that will close the alert message when clicked. The button should have\
    \ `data-dismiss` attribute, which tells Bootstrap the component to dismiss when\
    \ clicked. Bootstrap positions this button to the top-right position of the alert\
    \ box with the help of the `close` class. This dismiss action on the close button\
    \ is added by Bootstrap using JavaScript and captured using the `data-dismiss`\
    \ attribute.\n\n### Tip: Using Links Within an Alert\n\nIf you want to place a\
    \ link within an alert, you need to add a class `alert-link` to the `a` element.\
    \ This provides a matching color to link with respect to the alert box color:\n\
    \n```\n<div class=\"alert alert-success alert-dismissable\">\n    <button type=\"\
    button\" class=\"close\" data-dismiss=\n\"alert\">&times;</button>\n    Amount\
    \ has been transferred successfully. Go to <a \nhref=\"#\" class=\"alert-link\"\
    >account page</a>.\n</div>\n```\n\n### Alert Messages with JavaScript\n\nYou can\
    \ also dismiss an alert message using Bootstrap's `alert()` method in jQuery:\n\
    \n```\n$(\".alert\").alert('close');\n```\n\nAlert messages have two events associated\
    \ with them:\n\n1. `close.bs.alert`: triggered just before closing the alert box\n\
    2. `closed.bs.alert`: triggered after the alert box is closed\n\nHere's an example\
    \ using the above events:\n"
