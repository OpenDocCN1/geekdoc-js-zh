    ↵1.4.2/respond.min.js\"></script>\n    <![endif]-->\n```\n\n### Note: Using These\
    \ Scripts\n\nYou don’t have to download `html5shiv.js` and `respond.js`. You can\
    \ simply directly link to their CDN, as shown above.\n\nNow our `index.html` page\
