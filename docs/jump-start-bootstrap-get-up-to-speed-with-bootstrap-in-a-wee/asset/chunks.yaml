  trans: "\n\n要构建一个表单，我们需要一个带有 `form` 类的 `form` 元素：\n\n```\n<form class=\"form\">\n\
    </form>\n```\n\n对于每个标签（label）和输入字段，我们需要一个带有 `form-group` 类的 `div` 元素。让我们创建一个询问访问者姓名的输入字段：\n\
    \n```\n<form class=\"form\">\n    <div class=\"form-group\">\n        <label for=\"\
    nameField\">Name</label>\n        <input type=\"text\" class=\"form-control\"\
    \ id=\"nameField\" \n        placeholder=\"Your Name\" />\n    </div>\n</form>\n\
    ```\n\n在 `input` 元素上附加 `form-control` 类将使其成为一个全宽元素，如图 3.26 所示。\n\n![A basic form](img/ch3Image26.png)\n\
    \n图 3.26. 基础表单\n\n让我们在表单中填充电子邮件、电话和文本区域（textarea）字段，最后添加一个提交按钮。完整的标记和截图如图 3.27\
    \ 所示：\n\n```\n<form class=\"form\">\n    <div class=\"form-group\">\n        <label\
    \ for=\"nameField\">Name</label>\n        <input type=\"text\" class=\"form-control\"\
    \ id=\"nameField\" \n        placeholder=\"Your Name\" />\n    </div>\n\n    <div\
    \ class=\"form-group\">\n        <label for=\"emailField\">Email</label>\n   \
    \     <input type=\"email\" class=\"form-control\" id=\"emailField\" \n      \
    \  placeholder=\"Your Email\" />\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <label for=\"phoneField\">Phone</label>\n        <input type=\"text\"\
    \ class=\"form-control\" id=\"phoneField\" \n        placeholder=\"Your Phone\
    \ Number\" />\n    </div>\n\n    <div class=\"form-group\">\n        <label for=\"\
    descField\">Description</label>\n        <textarea class=\"form-control\" id=\"\
    descField\" placeholder=\"\n        Your Comments\"></textarea>\n    </div>\n\n\
    \    <button type=\"submit\" class=\"btn btn-primary\">Submit</button> \n    <button\
    \ type=\"reset\" class=\"btn btn-default\">Reset</button>\n</form>\n```\n\n![Form\
    \ with added fields](img/ch3Image27.png)\n\n图 3.27. 添加了字段的表单\n\n### 水平表单 (Horizontal\
    \ Forms)\n\n在之前的表单中，我们将标签显示在上方，然后是输入字段。假设我们想将标签显示在输入字段的侧边。那么我们可以在表单元素内部使用 Bootstrap\
    \ 的网格系统，如下：\n\n```\n<form class=\"form-horizontal\">\n    <div class=\"form-group\"\
    >\n        <label for=\"nameField\" class=\"col-xs-2\">Name</label>\n        <div\
    \ class=\"col-xs-10\">\n            <input type=\"text\" class=\"form-control\"\
    \ id=\"nameField\" \n            placeholder=\"Your Name\" />\n        </div>\n\
    \    </div>\n\n    <div class=\"form-group\">\n        <label for=\"emailField\"\
    \ class=\"col-xs-2\">Email</label>\n        <div class=\"col-xs-10\">\n      \
    \      <input type=\"email\" class=\"form-control\" id=\"emailField\" \n     \
    \       placeholder=\"Your Email\" />\n        </div>\n    </div>\n\n    <div\
    \ class=\"form-group\">\n        <label for=\"phoneField\" class=\"col-xs-2\"\
    >Phone</label>\n        <div class=\"col-xs-10\">\n            <input type=\"\
    text\" class=\"form-control\" id=\"phoneField\" \n            placeholder=\"Your\
    \ Phone Number\" />\n        </div>\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <label for=\"descField\" class=\"col-xs-2\">Description</label>\n \
    \       <div class=\"col-xs-10\">\n            <textarea class=\"form-control\"\
    \ id=\"descField\" \n            placeholder=\"Your Comments\"></textarea>\n \
    \       </div>\n    </div>\n\n    <div class=\"col-xs-10 col-xs-offset-2\">\n\
    \        <button type=\"submit\" class=\"btn btn-primary\">Submit</button> <button\
    \ type=\"reset\" class=\"btn btn-default\">Reset</button>\n    </div>\n\n</form>\n\
    ```\n\n这应该产生如图 3.28 所示的水平表单。\n\n![A horizontal form](img/ch3Image28.png)\n\n图\
    \ 3.28. 水平表单\n\n在代码中，根据 Bootstrap 的规则，我们将表单的类从 `form` 更改为 `form-horizontal`。然后给\
    \ `label` 元素添加了 `col-xs-2` 类，使其跨越两个 Bootstrap 列。接下来，我们通过 `col-xs-10` 类将输入字段封装在一个\
    \ `div` 中，该 `div` 跨越十个 Bootstrap 列。\n\n### 内联表单 (Inline Form)\n\n我们还可以创建元素位于单行内的表单。例如是登录表单，其中用户名和密码字段并列放置。内联表单的标记如下：\n\
    \n```\n<form class=\"form-inline\">\n    <div class=\"form-group\">\n        <label\
    \ for=\"email\">Email</label>\n        <input type=\"text\" class=\"form-control\"\
    \ id=\"email\" placeholder=\"Email\">\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <label for=\"password\">Password</label>\n        <input type=\"password\"\
    \ class=\"form-control\" id=\"password\" placeholder=\"Password\">\n    </div>\n\
    \n    <div class=\"form-group\">\n        <button type=\"submit\" class=\"btn\
    \ btn-primary\">Sign in</button>\n    </div>\n</form>\n```\n\n这应该产生如图 3.29 所示的内联表单。\n\
    \n![Inline form](img/ch3Image28.png)\n\n图 3.29. 内联表单\n\n### 表单中的辅助类 (Helper Classes\
    \ in Forms)\n\nBootstrap 提供了几个额外的“辅助”（helper）类来帮助显示表单。如果你使用 `disabled` 属性来禁用输入，Bootstrap\
    \ 已经为其定义了样式。例如，这段代码：\n\n```\n<input class=\"form-control\" type=\"text\" \nplaceholder=\"\
    Disabled input...\" disabled>\n```\n\n看起来看起来像图 3.30。\n\n![Disabled form inputs](img/ch3Image29.png)\n\
    \n图 3.30. 禁用的表单输入\n\nBootstrap 还为输入元素提供了三种验证状态：\n\n1.  `has-success`\n\n2.  `has-error`\n\
    \n3.  `has-warning`\n\n这里是验证状态用法的示例：\n\n```\n<div class=\"form-group has-success\"\
    >\n    <label class=\"control-label\" for=\"inputField\">\n    Input with success</label>\n\
    \    <input type=\"text\" class=\"form-control\" id=\"inputField\">\n</div>\n\
    ```\n\n应用 `has-success` 将标签文本和边框变为绿色。同样，`has-warning` 将使用暗褐色，而 `has-danger` 将使用深红色。这些\
    \ `has-` 类型的类只会应用于带有 `form-control`、`control-label` 和 `help-block` 类的元素。如果你想在用户向输入字段输入无效值时显示某些自定义文本，请使用带有\
    \ `help-block` 类的 `span` 元素。`help-block` 将出现在相应的输入字段下方。\n\n### 控件尺寸 (Control Sizing)\n\
    \n你可以使用 Bootstrap 的**控件尺寸**（control sizing）类来改变输入元素的高度：\n\n*   `input-lg` 用于制作比默认尺寸更大的输入元素。\n\
    \n*   `input-sm` 用于比默认尺寸更小的输入元素。\n\n这里是它们的一些使用示例：\n\n```\n<input class=\"form-control\
    \ input-lg\" type=\"text\" \nplaceholder=\"Larger Input Field\">\n<input class=\"\
    form-control\" type=\"text\" \nplaceholder=\"Default Input Field\">\n<input class=\"\
    form-control input-sm\" type=\"text\" \nplaceholder=\"Smaller Input Field\">\n\
    ```\n"
