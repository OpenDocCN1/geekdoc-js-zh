    \    <h3>Post Title 2</h3>\n            <p>Lorem ipsum dolor sit amet, consectetur\
    \ adipisicing \nelit, sed do eiusmod tempor incididunt ut labore et dolore magna\
    \ \naliqua. </p>\n        </div>>\n        <div class=\"col-md-4\">\n        \
    \    <h3>Post Title 3</h3>\n            <p>Lorem ipsum dolor sit amet, consectetur\
    \ adipisicing \nelit, sed do eiusmod tempor incididunt ut labore et dolore magna\
    \ \naliqua. </p>\n        </div>>\n    </div>\n</div>\n```\n\n`blog.html` 页面看起来就像\
    \ 图 2.9 所示。\n\n![Our incomplete blog layout on desktop displays](img/ch2Image5-1.png)\n\
    \n图 2.9. 我们在桌面显示上的不完整博客布局\n\n根据桌面显示的线框图，我们还剩下三列博客文章。这次，我们不会为接下来的三列创建一个单独的 `row`。相反，我们将直接将这些列追加到之前代码中现有的\
    \ `row` 中。你可能会奇怪，我们如何在一个单行中拥有 24 列（六列，每列跨越 4 个 Bootstrap 列）？嗯，Bootstrap 在单行中只允许\
    \ 12 个 Bootstrap 列。如果我们尝试超过这个限制，剩余的列将调整到下一行。这一新行将再次具有 12 个 Bootstrap 列的容量。通过这样，我们可以将所有的博客文章列合并到一个\
    \ `row` 中。\n\n让我们继续更新标记标记，添加三个新列：\n\n```html\n<div class=\"container\">\n    <div\
    \ class=\"row\">\n        <div class=\"col-md-12 text-center\">\n            <h1>My\
    \ First Bootstrap Blog</h1>\n        </div>\n    </div>\n\n    <hr>\n\n    <div\
    \ class=\"row\">\n        <div class=\"col-md-4\">\n            <h3>Post Title\
    \ 1</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n\
    \        <div class=\"col-md-4\">\n            <h3>Post Title 2</h3>\n       \
    \     <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div class=\"\
    col-md-4\">\n            <h3>Post Title 3</h3>\n            <p>Lorem ipsum dolor\
    \ sit amet ... </p>\n        </div>>\n        <div class=\"col-md-4\">\n     \
    \       <h3>Post Title 4</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n\
    \        </div>>\n        <div class=\"col-md-4\">\n            <h3>Post Title\
    \ 5</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n\
    \        <div class=\"col-md-4\">\n            <h3>Post Title 6</h3>\n       \
    \     <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n    </div>\n</div>\n\
    ```\n\n最后，我们将桌面线框图转换成了 HTML 页面，如 图 2.10 所示。\n\n![Our complete blog layout on desktop\
    \ displays](img/ch2Image5-2.png)\n\n图 2.10. 我们在桌面显示上的完整博客布局\n\n### 为平板电脑设计\n\n\
    现在让我们修改代码以实现平板的线框布局。与桌面显示不同，平板可以用两种格式查看：**竖屏（Portrait）**和**横屏（Landscape）**。平板的横屏视图被认为是中等尺寸显示器（**屏幕宽度\
    \ ≥ 992px**），我们已经使用 `col-md-*` 类处理了这个问题。现在我们只剩下竖屏视图，这是一种小尺寸显示器。这可以使用 `col-sm-*`\
    \ 类来实现。\n\n由于我们必须在较小的显示上实现双列布局，我们必须强制每列跨越 6 个 Bootstrap 列。这样我们在每行中只得到两列（两列 × 6\
    \ 个 Bootstrap 列 = 12 个 Bootstrap 列）。但这里只有一行。因此，一旦所有 12 个 Bootstrap 列都被占据，剩余的列将出现在下一行，每次创建一个新行。\n\
    \n让我们继续，向我们的桌面布局代码中添加额外的类 `col-sm-6`：\n\n```html\n<div class=\"container\">\n\
    \    <div class=\"row\">\n        <div class=\"col-md-12 text-center\">\n    \
    \        <h1>My First Bootstrap Blog</h1>\n        </div>\n    </div>\n\n    <hr>\n\
    \n    <div class=\"row\">\n        <div class=\"col-md-4 col-sm-6\">\n       \
    \     <h3>Post Title 1</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n\
    \        </div>>\n        <div class=\"col-md-4 col-sm-6\">\n            <h3>Post\
    \ Title 2</h3>\n            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n\
    \        <div class=\"col-md-4 col-sm-6\">\n            <h3>Post Title 3</h3>\n\
    \            <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n       \
    \ <div class=\"col-md-4 col-sm-6\">\n            <h3>Post Title 4</h3>\n     \
    \       <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div\
    \ class=\"col-md-4 col-sm-6\">\n            <h3>Post Title 5</h3>\n          \
    \  <p>Lorem ipsum dolor sit amet ... </p>\n        </div>>\n        <div class=\"\
    col-md-4 col-sm-6\">\n            <h3>Post Title 6</h3>\n            <p>Lorem\
    \ ipsum dolor sit amet ... </p>\n        </div>>\n    </div>\n</div>\n```\n\n\
    因此，如 图 2.11 所示，我们为平板提供了两种布局：横屏模式下的三列布局和竖屏模式下的双列布局。\n\n![A two-column layout for\
    \ tablets](img/ch2Image5-3.png)\n\n图 2.11. 平板电脑的双列布局\n\n### 为手机设计\n\n与平板一样，手机也可以横屏和平竖屏模式查看。移动设备的横屏视图利用小尺寸显示器（**屏幕宽度\
    \ ≥ 768px**），我们已经使用 `col-sm-*` 类处理过了。移动设备的竖屏视图采用超小尺寸显示器（**屏幕宽度 < 768px**）。\n\n\
    根据移动设备的线框图，我们必须创建一个单列布局。我希望你已经知道如何在上述代码中实现它。对于超小屏幕，我们必须使用带有 `col-xs` 前缀的类。在这里，我们希望每个博客文章列占据所有的\
    \ 12 个 Bootstrap 列，这样每行只有一个博客文章。我们的类将是 `col-xs-12`，让我们继续将此类添加到我们的代码中：\n\n"
