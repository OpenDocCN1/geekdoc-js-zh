  trans: "\n\n```javascript\n$('.nav-tabs li a').on('show.bs.tab', function () {\n\
    \   console.log(\"Opening tab\");\n});\n\n$('.nav-tabs li a').on('shown.bs.tab',\
    \ function () {\n   console.log(\"Tab opened!\");\n});\n```\n\n### 折叠面板 (Collapse)\n\
    \n`collapse` 插件在 Web 上通常被称为“手风琴”（accordion）插件。它包含多个垂直堆叠的标签页，但一次只能打开一个标签页。图 4.12\
    \ 显示了折叠插件的截图。\n\n![折叠插件](img/ch4Image12-1.png)\n\n图 4.12. 折叠插件\n\n在 Bootstrap\
    \ 中，`collapse` 是通过在单个容器中包含多个面板组件来创建的。我们在上一章中学习了如何创建一个面板。我们也知道面板有两个组件：`panel-heading`（面板头部）和\
    \ `panel-body`（面板主体）。\n\n要创建一个折叠面板，我们需要一组放在容器内的面板。该容器是使用带有 `panel-group` 类的 `div`\
    \ 元素创建的。它还应该有一个关联的 ID。\n\n```html\n<div class=\"panel-group\" id=\"accordion\"\
    >\n</div>\n```\n\n我们需要用不同的面板组件填充这个容器，并将作为标签页。让我们在这个 `panel-group` 内部创建一个面板组件：\n\
    \n```html\n<div class=\"panel-group\" id=\"accordion\">\n\n    <div class=\"panel\
    \ panel-default\">\n\n        <div class=\"panel-heading\">\n            <h4 class=\"\
    panel-title\">\n                <a data-toggle=\"collapse\" data-parent=\"#accordion\"\
    \ \n                href=\"#collapseOne\">\n                可折叠组项目 #1\n      \
    \          </a>\n            </h4>\n        </</div>\n\n        <div id=\"collapseOne\"\
    \ class=\"panel-collapse collapse in\">\n            <div class=\"panel-body\"\
    >\n            Lorem ipsum dolor sit ...\n            </div>\n        </div>\n\
    \n    </div\n\n</div>\n```\n\n在这里，我在面板组容器内部插入了单个面板组件的标记语言。每个面板都分为两部分：`panel-heading`\
    \ 元素和 `panel-body` 元素。\n\n`panel-heading` 元素包含一个嵌套了 `a` 元素的 `h4` 元素。这种 `<h4>`\
    \ 和 `<a>` 标签的组合形成了折叠插件中的标签页。`h4` 元素应该具有类 `panel-title`。`a` 元素应该有三个重要的属性：`data-toggle`、`data-parent`\
    \ 和 `href`。`data-toggle` 代表插件的类型。`data-parent` 元素包含 `panel-group` 元素的 ID。最后，此类链接的\
    \ `href` 应该包含 `panel-body` 父元素的 ID。\n\n与 `panel-body` 未封装在任何 `div` 的普通面板不同，在这里为了实现折叠效果，这是强制性的。这个包装元素应该具有\
    \ `panel-collapse`、`collapse` 和 `in` 类。`collapse` 类用于隐藏内容，而 `collapse` 和 `in`\
    \ 的组合则显示内容。因此，第一个包装器同时具有 `collapse` 和 `in` 类，其余所有包装器应只有 `collapse` 类。`panel-collapse`\
    \ 类用于 Bootstrap 的 JavaScript 识别该包装器。\n\n重复相同的标记语言以创建多个标签页。以下标记显示了一个具有三个垂直堆叠标签页的折叠插件，结果如图图\
    \ 4.13 所示：\n\n```html\n<div class=\"panel-group\" id=\"accordion\">\n\n      <!--\
    \ 面板 1 -->\n      <div class=\"panel panel-default\">\n        <div class=\"panel-heading\"\
    >\n          <h4 class=\"panel-title\">\n            <a data-toggle=\"collapse\"\
    \ data-parent=\"#accordion\" \n            href=\"#collapseOne\">\n          \
    \    可折叠组项目 #1\n            </a>\n          </h4>\n        </div>\n        <div\
    \ id=\"collapseOne\" class=\"panel-collapse collapse in\">\n            <div class=\"\
    panel-body\">\n                Lorem ipsum dolor sit amet, consectetur ...\n \
    \           </div>\n      </div>\n\n      <!-- 面板 2 -->\n      <div class=\"panel\
    \ panel-default\">\n        <div class=\"panel-heading\">\n          <h4 class=\"\
    panel-title\">\n            <a data-toggle=\"collapse\" data-parent=\"#accordion\"\
    \ \n            href=\"#collapseTwo\">\n              可折叠组项目 #2\n            </a>\n\
    \          </h4>\n        </div>\n        <div id=\"collapseTwo\" class=\"panel-collapse\
    \ collapse\">\n            <div class=\"panel-body\">\n                Lorem ipsum\
    \ dolor sit amet, consectetur ...\n            </div>\n        </div>\n      </div>\n\
    \n      <!-- 面板 3 -->\n      <div class=\"panel panel-default\">\n        <div\
    \ class=\"panel-heading\">\n          <h4 class=\"panel-title\">\n           \
    \ <a data-toggle=\"collapse\" data-parent=\"#accordion\" \n            href=\"\
    #collapseThree\">\n              可折叠组项目 #3\n            </a>\n          </h4>\n\
    \        </div>\n        <div id=\"collapseThree\" class=\"panel-collapse collapse\"\
    >\n            <div class=\"panel-body\">\n                Lorem ipsum dolor sit\
    \ amet, consectetur ...\n            </div>\n        </div>\n      </div>\n  \
    \  </div>\n</div>\n```\n\n![最终的折叠插件](img/ch4Image12.png)\n\n图 4.13. 最终的折叠插件\n\n\
    ### 使用 JavaScript 控制折叠\n\nBootstrap 提供了 `collapse()` 方法来更改折叠插件的默认行为。默认情况下，一次只能打开一个标签。我们可以通过向上述方法传递自定义的\
    \ `options` 对象来覆盖此行为。让我们尝试一下。\n\n在之前的折叠插件标记语言中，我们为所有 `panel-body` 包装器添加了 `collapse`\
    \ 类。让我们选择这个类并在其上调用 `collapse()` 方法：\n\n```javascript\n$('.collapse').collapse({\n\
    \        toggle: false\n});\n```\n\n在代码段中，我传递了一个具有 `toggle` 属性且值为 `false` 的匿名对象。这将强制所有标签页在其他标签页打开时保持打开状态。请亲自尝试一下。\n\
    \n如图图 4.14 所示，你可以看到所有标签同时打开了。\n\n![我们的折叠面板中所有标签都打开](img/ch4Image15.png)\n\n图 4.14.\
    \ 我们的折叠面板中所有标签都打开\n\n你还可以向 `collapse()` 方法传递各种预定义的字符串：\n\n1. `collapse('toggle')`：切换标签页从一种状态到另一种状态\n\
    2. `collapse('show')`：打开标签页\n3. `collapse('hide')`：关闭标签页\n\nBootstrap 还带了四个绑定到折叠插件的自定义事件：\n\
    \n1. `show.bs.collapse`：在打开标签页之前触发。\n2. `shown.bs.collapse`：在标签打开后触发。\n3. `hide.bs.collapse`：在关闭标签页之前触发。\n\
    4. `hidden.bs.collapse`：在标签关闭后触发。\n\n以下是它们的用法：\n\n```javascript\n$('.collapse').on('show.bs.collapse',\
    \ function () {\n    console.log('Opening tab..');\n});\n\n$('.collapse').on('shown.bs.collapse',\
    \ function () {\n    console.log('Tab opened.');\n});\n\n$('.collapse').on('hide.bs.collapse',\
    \ function () {\n    console.log('Hiding tab..');\n});\n\n$('.collapse').on('hidden.bs.collapse',\
    \ function () {\n    console.log('Tab hidden');\n});\n```\n\n### 提示框 (Tooltip)\n\
    \nBootstrap 的 `tooltip` 是一种当鼠标悬停在网站组件上时出现的小浮动消息。它通常用于显示特定组件的帮助文本。\n\nBootstrap\
    \ 的提示框使用 CSS 创建并通过 JavaScript 触发。与今天提供的许多其他提示框插件相比，它非常轻量。它提供了易于自定义的选项，可以相对于其父组件定位提示框（上、下、右、左）。要使用提示框，我们需要定义一些自定义的\
    \ `data-*` 属性。\n\n让我们按钮组件上构建一个演示提示框：\n\n```html\n<button type=\"button\" class=\"\
    btn btn-default\" data-toggle=\"tooltip\" \ndata-placement=\"bottom\" title=\"\
    I am a Bootstrap button\">Who am I?\n</button>\n```\n\n"
- fmt: "\nYou need to add a `data-toggle` attribute with the value `tooltip`, a `title`\
    \ attribute containing the text that you want to display in the tooltip, and a\
    \ `data-placement` attribute. The `data-placement` attribute accepts one of the\
    \ following four values: `top`, `bottom`, `left`, and `right`. As its name suggests,\
    \ the `data-placement` attribute defines the position of the tooltip with respect\
    \ to its parent component.\n\nLet's go ahead and view this button in a browser.\
    \ You'll see that it fails to work; there's no tooltip when the mouse is hovered\
    \ on the button. For performance reasons, in Bootstrap tooltips need to be initialized\
    \ manually through jQuery. So let's go ahead and add the following script, after\
    \ all the `<script>` tags in the body:\n\n```\n<script type=\"text/javascript\"\
    >\n  $(document).ready(function(){\n    $('.tooltipButton').tooltip();\n  });\n\
    </script>\n```\n\nIn this code we have used the `tooltipButton` class as the selector.\
    \ Hence, we need to add this class to the button for the tooltip to work.\n\n\
    We also need to modify the HTML code of the button and add the class `tooltipButton`\
    \ to it:\n\n```\n<button type=\"button\" class=\"btn btn-default tooltipButton\"\
    \ \ndata-toggle=\"tooltip\" data-placement=\"bottom\" \ntitle=\"I am a Bootstrap\
    \ button\">Who am I?</button>\n```\n\nRefresh the web page and a tooltip should\
    \ appear, as shown in [Figure 4.15](#ch04.html_tooltip \"Figure 4.15. A tooltip\"\
    ).\n\n![A tooltip](figures/ch4Image16.png)\n\nFigure 4.15. A tooltip\n\n### Tooltip\
    \ with JavaScript\n\nWe have just seen that we need to call the `tooltip()` method\
    \ to make the tooltip function. Here, we'll see how we can customize the tooltip\
    \ plugin by passing various options through this function.\n\nThe method takes\
    \ an object containing various optional properties for changing the general behavior\
    \ of atooltip:\n\n```\nvar options = {\n    animation : true;\n};\n\n$(\".tooltipButton\"\
    ).tooltip(options);\n```\n\nIn the code, I have defined a JavaScript object called\
    \ `options`. I've set the property `animation` to `true` so that the tooltip gets\
    \ a fading effect whenever its displayed. Finally, I have passed this object to\
    \ the `tooltip()` method.\n\nOther properties that can be passed are:\n\n- `html`:\
    \ This property takes a Boolean value. If it is set to `true` then the content\
    \ that is present inside the `title` attribute will be parsed as HTML. Otherwise,\
    \ it will be displayed as-is.\n- `placement`: This property takes five string\
    \ values: `top`, `bottom`, `left`, `right`, and `auto`. It defines the position\
    \ of thetooltip with respect to the component. If set to `auto`, the tooltip will\
    \ be oriented automatically.\n- `selector`: This is a special option available\
    \ from Bootstrap. If you have called the `tooltip()` method on a parent container,\
    \ you might like to filter the child elements on which this tooltip should work,\
    \ and you can do that with this option. You can provide values such as `a`, `a[href='hello.html']`\
    \ or `button[class='tooltipbuttons']`.\n- `title`: If you didn't use the custom\
    \ attribute `data-title` in the HTML markup, you can pass the tooltip title through\
    \ this option. This takes a string value, such as `title: \"This is a button\"\
    .`.\n- `trigger`: All the tooltips are shown by hovering over the component. Use\
    \ this option to override the default behavior. Values that this option can take\
    \ are: `click`, `focus`, `hover`, and `manual`. You can also combine these values\
    \ separated by a space; for example `click hover`, `hover focus`, and so on.\n\
    - `delay`: If you want to avoid having the tooltip appear immediately, use this\
    \ property to set a delay amount (in milliseconds).\n- `container`: Use this property\
    \ to append a tooltip to specific elements such as `body`. This will prevent the\
    \ tooltip from floating away from the triggering element during a window resize.\n\
    \nApart from accepting an options object, the `tooltip()` method also accepts\
    \ several predefined string values. These strings are mapped to the custom behavior\
    \ of the tooltip; for example:\n\n```\n$('.tooltipButton').tooltip('show');\n\
    ```\n\nPassing the string `show` will make the tooltip appear. Possible string\
    \ values are:\n\n1. `show`: shows the tooltip\n2. `hide`: hides the tooltip\n\
    3. `toggle`: toggles the state of the tooltip (if a tooltip is currently hidden\
    \ this will show it, and vice versa)\n4. `destroy`: this string hides and destroys\
    \ the tooltip related to a particular element; once destroyed, the associated\
    \ tooltip cannot be used again\n\nJust like other Bootstrap plugins, tooltip also\
    \ comes with custom events that can be captured to perform extra tasks. These\
    \ events are:\n\n1. `show.bs.tooltip`: this event is fired before the tooltip\
    \ is visible\n2. `shown.bs.tooltip`: this event is fired after the tooltip is\
    \ visible\n3. `hide.bs.tooltip`: fired before the tooltip is hidden\n4. `hidden.bs.tooltip`:\
    \ fired after the tooltip is hidden\n\nHere's how you'd use them:\n\n```\n$('.tooltipButton').on('show.bs.tooltip',\
    \ function () {\n  console.log(\"Showing tooltip..\");\n});\n\n$('.tooltipButton').on('shown.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip shown.\");\n});\n\n$('.tooltipButton').on('hide.bs.tooltip',\
    \ function () {\n  console.log(\"Hiding tooltip..\");\n});\n\n$('.tooltipButton').on('hidden.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip hidden.\");\n});\n```\n\n### Popovers\n\
    \nPopovers are another useful plugin that are comparable to tooltips. The difference\
    \ is that popovers are larger and more stylish than tooltips, as shown in [Figure\
    \ 4.16](#ch04.html_poptool \"Figure 4.16. Popovers versus tooltips\"). They look\
    \ very similar to the popovers in Apple iBooks' dictionary feature.\n\n![Popovers\
    \ versus tooltips](figures/ch4Image17-1.png)\n\nFigure 4.16. Popovers versus tooltips\n\
    \nYou can place more content in a popover than a tooltip. It is recommended to\
    \ use popovers instead of tooltips when you have more HTML content or textual\
    \ content to display.\n\nLet's trigger a popover to activate on the click event\
    \ of a button. The markup to do this is:\n\n```\n<button type=\"button\" class=\"\
    btn btn-danger\" data-toggle=\"popover\" \ndata-placement=\"bottom\" data-content=\"\
    Lorem Ipsum.\" \ntitle=\"This is a demo popover\">Click Me!</button>\n```\n\n\
    There are a few `data-*` attributes that are necessary for the popover plugin\
    \ to function. These are similar to the custom attributes used in tooltips. The\
    \ `data-toggle` attribute directs what to trigger when an action is performed\
    \ on this button. The `data-placement` attribute specifies the position of the\
    \ popover. The `data-content` attribute should contain the content you want to\
    \ convey in the popover. Finally, set the `title` attribute to append a header\
    \ to the plugin.\n\nJust like tooltips, popovers should also be manually initiated.\
    \ You can use the following script:\n\n```\n<script type=\"text/javascript\"\n\
    \  $(document).ready(function(){\n     $('.popoverButton').popover(); \n  });\n\
    </script>\n```\n\nAs the selector in this code is a class, we need to add the\
    \ `popoverButton` class to the button. The results are shown in [Figure 4.17](#ch04.html_popover\
    \ \"Figure 4.17. Popover\").\n\n![Popover](figures/ch4Image17.png)\n\nFigure 4.17.\
    \ Popover\n\n### Popovers with JavaScript\n\nBootstrap provides the `popover()`\
    \ method for customizing the default behavior of the popover plugin. It accepts\
    \ an options object, just like the tooltip plugin. All the options properties\
    \ available to the tooltip plugin discussed earlier also apply to the popover\
    \ plugin.\n\nFor example:\n\n```\nvar options = {\n    animation: true,\n    placement:\
    \ \"right\"\n};\n\n$('.popoverButton').popover(options);\n```\n\nThe popover plugin\
    \ also accepts a set of predefined strings that are mapped to certain behaviors\
    \ of a popover; for instance:\n\n```\n$('.popoverButton').popover(\"show\");\n\
    ```\n\nJust like a tooltip plugin, we have the same set of predefined strings\
    \ to change the state of a popover plugin. When passing the `show` string, the\
    \ popover will be visible. Other available strings are: `hide`, `toggle` and `destroy`.\n"
