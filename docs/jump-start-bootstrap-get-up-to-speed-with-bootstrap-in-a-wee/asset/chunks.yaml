    \nTo create a carousel Indicator, you have to define an ordered list with a class\
    \ of `carousel-indicators`. The number of `li` elements in it depends on the number\
    \ of slides you want to have. Each `li` element should have a `data-target` attribute\
    \ containing the ID of the carousel container. It should also have a `data-slide-to`\
    \ attribute containing the sequence number of the particular slide it will point\
    \ to.\n\nNext, we build the heart of the carousel, the slides. First, we create\
    \ a wrapper element for all the slides. This will be a `div` with the class `carousel-inner`.\
    \ Each slide is defined by a `div` element that has a class `item`. Every item\
    \ must have a representing image and optional textual data. This image will be\
    \ used as a background for that particular slide item. For each image we can add\
    \ related captions and some additional textual data. These captions are wrapped\
    \ by a `div` element that has a class `carousel-caption`. The caption can be inserted\
    \ using any one of the HTML heading tags: `<h1>`, `<h2>`, `<h3>`, and so on. For\
    \ related text you can use `<p`> tags.\n\nRepeat the same `item` markup for each\
    \ slide. After you're done with creating all the slides, we'll build a controls\
    \ section for navigating carousel content.\n\nThe carousel controls are constructed\
    \ using `<a>` tags with a class `carousel-control` and one of the directional\
    \ classes such as `left` or `right`. The `href` attribute of these links should\
    \ contain the ID of the carousel wrapper. Once the controls are formed, we insert\
    \ left and right symbols in them. These symbols are glyphicons.\n\nIt's time to\
    \ check the carousel in the browser, shown in [Figure 4.18](#ch04.html_carousel\
    \ \"Figure 4.18. A carousel of cars\").\n\n![A carousel of cars](figures/ch4Image18.png)\n\
    \nFigure 4.18. A carousel of cars\n\nAmazing, no? We have created a powerful responsive\
    \ slideshow without writing a single piece of JavaScript or CSS.\n\n### Note:\
    \ Carousels and Older Versions of IE\n\nThough Bootstrap may be compatible with\
    \ IE8 and above, the carousel is not fully compatible. The sliding effect will\
    \ fail to work in CSS3-incompatible browsers such as IE8 and I9\\. The carousel\
    \ indicators will appear as squares in these browsers, rather than being circular.\n\
    \n### Carousel with JavaScript\n\nBootstrap has the `carousel()` method for calling\
    \ carousels through JavaScript. You can use this method to pass customized options\
    \ to change the default behavior of a carousel.\n\nThere are only three JavaScript\
    \ options available for carousel: `interval`, `pause`, and `wrap`. Here they are\
    \ in the code:\n\n```\nvar options = {\n    interval: 7000,\n    pause: 'hover',\n\
    \    wrap: true\n};\n\n$('#bestCarsCarousel').carousel(options); \n```\n\nThe\
    \ `interval` property is used to specify the time duration between each slide.\
    \ The `pause` option takes only one value `hover`, which tells Bootstrap to stop\
    \ carousel sliding on mouse hover. The `wrap` option takes Boolean values to set\
    \ the cycling of carousel to on or off. If set to `true`, the carousel will start\
    \ sliding to the first slide after displaying the last slide and this will continue.\n\
    \nOther parameters that can also be passed to the `carousel()` method include:\n\
    \n1.  `cycle`: to enable cycling functionality of a carousel\n\n2.  `pause`: to\
    \ pause the slideshow from JavaScript\n\n3.  `number`: to specify the time duration\
    \ between two slides\n\n4.  `prev`: to change the slide to the previous slide\n\
    \n5.  `next`: to change the slide to the next slide\n\nThe carousel plugin comes\
    \ with two custom events:\n\n1.  `slide.bs.carousel`: fired before the slide is\
    \ changed\n\n2.  `slid.bs.carousel`: fired after the slide has changed\n\nHere's\
    \ how to use them:\n\n```\n$('#bestCarsCarousel').on('slide.bs.carousel', function\
    \ () {\n    console.log(\"Changing slide..\");\n});\n\n$('#bestCarsCarousel').on('slid.bs.carousel',\
    \ function () {\n    console.log(\"Slide changed.\");\n});\n```\n\n### Modals\n\
    \n**Modals** are HTML elements that are hidden in a web page, sliding down from\
    \ the top of the screen when triggered. It is one of the best plugins to use to\
    \ display dialog prompts, such as alert and confirm dialogs. You can also use\
    \ it to showcase a larger version of an image, display a long list of terms and\
    \ conditions, or to display sign-up/login forms."
