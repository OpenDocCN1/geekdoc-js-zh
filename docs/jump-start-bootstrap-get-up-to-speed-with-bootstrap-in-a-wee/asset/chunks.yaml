    \n![SitePoint®](images/sitepoint-logo.png)\n\nPublished by SitePoint Pty. Ltd.\n\
    \n48 Cambridge Street Collingwood VIC Australia 3066\n\nWeb: www.sitepoint.com\n\
    Email: business@sitepoint.com\n\n***\n\n## About Syed Fazle Rahman\n\nSyed Fazle\
    \ Rahman is a web developer and a blogger, with over four years of freelancing\
    \ experience. His expertise includes HTML5, CSS3, Less, JavaScript, jQuery, and\
    \ Ember.js. He’s currently working on hybrid applications for smartphones and\
    \ smart TVs.\n\n## About SitePoint\n\nSitePoint specializes in publishing fun,\
    \ practical, and easy-to-understand content for web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)\
    \ to access our blogs, books, newsletters, articles, and community forums. You’ll\
    \ find a stack of information on JavaScript, PHP, Ruby, mobile development, design,\
    \ and more.\n\n## About Jump Start\n\nJump Start books provide you with a rapid\
    \ and practical introduction to web development languages and technologies. Typically\
    \ around 150 pages in length, they can be read in a weekend, giving you a solid\
    \ grounding in the topic and the confidence to experiment on your own.\n\n***\n\
    \nTo my lovely parents, troublesome brother, cute sister, and my best buddy, Sandeep.\n\
    \n# Preface\n\nCrafting a modern, professional website from scratch takes a lot\
    \ of time and effort. Sites today need to be responsive, mobile first, slickly\
    \ designed, and fast. Bootstrap helps designers and developers by providing a\
    \ vast array of HTML components and a grid system that make creating professional,\
    \ responsive templates a snap, and can greatly cut down development time.\n\n\
    Bootstrap is useful for everyone, but it's a blessing for novice developers. All\
    \ the intricate CSS and JavaScript required to create complex web components are\
    \ pre-written. Only some HTML markup is needed to make them work. More experienced\
    \ developers can take advantage of the number of customization options that Bootstrap\
    \ offers, including Less and Sass support.\n\nThroughout this book, I have tried\
    \ to provide a complete guide to the Bootstrap framework. We'll cover how we can\
    \ build beautiful responsive websites without needing to gain expertise in advanced\
    \ web development techniques. We'll discuss the various useful CSS components\
    \ and JavaScript plugins that Bootstrap provides out of the box. We'll also cover\
    \ various ways of customizing the look and feel of Bootstrap to generate completely\
    \ unique designs.\n\nHopefully by now that you're excited to start building your\
    \ first websites using the Bootstrap framework. By the end of this book, I am\
    \ confident that you will have the skills to quickly create a beautiful responsive\
    \ website template. I hope both this book, and the Bootstrap framework, satisfy\
    \ your web designing needs.\n\n## Who Should Read This Book\n\nThis book is suitable\
    \ for beginner to intermediate level web designers and developers. Experience\
    \ of HTML and CSS is assumed, and some knowledge of JavaScript is helpful.\n\n\
    ## Conventions Used\n\nYou’ll notice that we’ve used certain typographic and layout\
    \ styles throughout this book to signify different types of information. Look\
    \ out for the following items.\n\n### Code Samples\n\nCode in this book will be\
    \ displayed using a fixed-width font, like so:\n\n```\n<h1>A Perfect Summer's\
    \ Day</h1>\n<p>It was a lovely day for a walk in the park. The birds \nwere singing\
    \ and the kids were all back at school.</p>\n```\n\nIf the code is to be found\
    \ in the book’s code archive, the name of the file will appear at the top of the\
    \ program listing, like this:\n\n`example.css`\n\n```\n.footer {\n  background-color:\
    \ #CCC;\n  border-top: 1px solid #333;\n}\n```\n\nIf only part of the file is\
    \ displayed, this is indicated by the word `excerpt`:\n\n`example.css (excerpt)`\n\
    \n```\n border-top: 1px solid #333;\n```\n\nIf additional code is to be inserted\
    \ into an existing example, the new code will be displayed in bold:\n\n```\nfunction\
    \ animate() {\n  new_variable = \"Hello\";\n}\n```\n\nAlso, where existing code\
    \ is required for context, rather than repeat all it, a `…` will be displayed:\n\
    \n```\nfunction animate() {\n  …\n  return new_variable;\n}\n```\n\nSome lines\
    \ of code are intended to be entered on one line, but we’ve had to wrap them because\
    \ of page constraints. A `↵` indicates a line break that exists for formatting\
    \ purposes only, and that should be ignored.\n\n```\nURL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-\n\
    ↵testing/?responsive1\");\n```\n\n### Tips, Notes, and Warnings\n\n### Tip: Hey,\
    \ You!\n\nTips will give you helpful little pointers.\n\n### Note: Ahem, Excuse\
    \ Me …\n\nNotes are useful asides that are related—but not critical—to the topic\
    \ at hand. Think of them as extra tidbits of information.\n\n### Important: Make\
    \ Sure You Always …\n\n… pay attention to these important points.\n\n### Warning:\
    \ Watch Out!\n\nWarnings will highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n## Supplementary Materials\n\n[http://www.sitepoint.com/store/jump-start-bootstrap/](http://www.sitepoint.com/store/jump-start-bootstrap/)\n\
    \nThe book’s website, containing links, updates, resources, and more.\n\n[https://github.com/spbooks/jsbootstrap1](https://github.com/spbooks/jsbootstrap1)\n\
    \nThe downloadable code archive for this book.\n\n[http://www.sitepoint.com/forums/forumdisplay.php?53-CSS-amp-Page-Layout](http://www.sitepoint.com/forums/forumdisplay.php?53-CSS-amp-Page-Layout)\n\
    \nSitePoint’s forums, for help on any tricky web problems.\n\n[`books@sitepoint.com`](mailto:books@sitepoint.com)\n\
    \nOur email address, should you need to contact us for support, to report a problem,\
    \ or for any other reason.\n\n## Want to Take Your Learning Further?\n\nThanks\
    \ for buying this book. We appreciate your support. Do you want to continue learning?\
