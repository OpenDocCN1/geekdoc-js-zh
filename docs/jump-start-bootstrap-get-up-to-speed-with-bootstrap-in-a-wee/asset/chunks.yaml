    \ HTML 页面，它可以在任何显示设备上运行——单列布局如图 2.12 所示。你甚至可以使用如[Google Drive 硬盘](https://drive.google.com/)等免费云端服务托管此项目，然后在实际平板电脑或移动设备上进行测试；或者手动调整浏览器宽度并观察布局的动态变化。我希望这个案例研究对你理解\
    \ Bootstrap 的网格系统有所帮助。\n\n## 嵌套列\n\n你始终可以在布局中的任何列中创建一组新的 12 列 Bootstrap 列。这可以通过在现有的列中构建一个新的\
    \ `row` 元素，然后用自定义列填充该行来实现。由于我们在这里开始了一个新的 `row`，其内部任何一列都可以跨越 12 个 Bootstrap 列，但该行的宽度将限制在其父级元素的宽度内。\n\
    \n让我们通过一个示例来说说明这一点。在项目中创建一个名为 `nested.html` 的新 HTML 文件。按照最后一章的内容，构建设置好 Bootstrap\
    \ 的 HTML 标记。此外，链接我们在本节之前创建的 CSS 文件 `styles.css`。此新 HTML 文件的标记应该如下：\n\n```html\n\
    <!DOCTYPE html>\n    <html lang=\"en\">\n      <head>\n        <meta charset=\"\
    utf-8\">\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n\
    \        <meta name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\"\
    >\n\n        <title>My First Bootstrap Website</title>\n        <link rel=\"stylesheet\"\
    \ type=\"text/css\" \nhref=\"css/bootstrap.css\">\n\n        <!--[if lt IE 9]>\n\
    \          <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
    ></script>\n          <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    1.4.2/respond.min.js\"></script>\n        <![endif]-->\n\n      </head>\n    \
    \  <body>\n\n            <script src=\"js/jquery.js\"></script>\n            <script\
    \ src=\"js/bootstrap.js\"></script>\n      </body>\n    </html>\n```\n\n让我们在其内部创建一个\
    \ `container` 和一个 `row`：\n\n```html\n<div class=\"container\">\n    <div class=\"\
    row\">\n\n    </div>\n</div>\n```\n\n针对中等显示器，我们将构建一个双列布局。到目前，我们知道要创建一个双列布局，我们应该让列跨越\
    \ 6 个 Bootstrap 列。因此，生成此类列的类将是 `col-md-6`。让我们在之前的标记中添加两列：\n\n```html\n<div class=\"\
    container\">\n    <div class=\"row\">\n        <div class=\"col-md-6 col1\">\n\
    \            <h3>Column 1</h3>\n        </div>\n        <div class=\"col-md-6\
    \ col2\">\n            <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n\
    ```\n\n在此代码中，我们还从 `styles.css` 文件引入了两个类：`col1` 和 `col2`。这两个类将帮助我们为列提供一些背景颜色。现在，HTML\
    \ 页面应该像图 2.13 中的截图所示。\n\n![简单的双列布局](img/ch2Image6-1.png)\n\n图 2.13. 简单的双列布局\n\n\
    现在让我们嵌套第一列“Column 1”并在其内部开始一个新行：\n\n```html\n<div class=\"container\">\n    <div\
    \ class=\"row\">\n        <div class=\"col-md-6 col1\">\n            <h3>Column\
    \ 1</h3>\n            <!-- 嵌套开始 -->\n            <div class=\"row\">\n\n     \
    \       </div>\n        </div>\n        <div class=\"col-md-6 col2\">\n      \
    \      <h3>Column 2</h3>\n        </div>\n    </div>\n</div>\n```\n\n既然我们有一个新的\
    \ `row`，让我们再次在其形成两列：\n\n```html\n<div class=\"container\">\n    <div class=\"\
    row\">\n        <div class=\"col-md-6 col1\">\n            <h3>Column 1</h3>\n\
    \            <!-- 嵌套开始 -->\n            <div class=\"row\">\n                <div\
    \ class=\"col-md-6 col3\">\n                    <h3>Column 4</h3>\n          \
    \      </div>\n                <div class=\"col-md-6 col4\">\n               \
    \     <h3>Column 5</h3>\n                </div>\n            </div>\n        </div>\n\
    \        <div class=\"col-md-6 col2\">\n            <h3>Column 2</h3>\n      \
    \  </div>\n    </div>\n</div>\n```\n\n正如图 2.14 所示，两个新列现在被放置在第一列中。在这里我使用了 `styles.css`\
    \ 中的 `col3` 和 `col4` 类来应用背景颜色。\n\n![嵌套的双列布局](img/ch2Image6-2.png)\n\n图 2.14. 嵌套的双列布局\n\
    \n嵌套列的能力在创建复杂布局时非常有用。你也可以在其内部嵌套行并生成一组新的列。\n\n## 列偏移\n\n偏移（Offsetting）是 Bootstrap\
    \ 网格系统的另一个强大功能。它通常用于增加列的左边距。例如，如果你有一列应该在三个 Bootstrap 列之后出现，你可以使用偏移功能。\n\n可用的偏移类有：\n\
    \n* `col-xs-offset-*`\n* `col-sm-offset-*`\n* `col-md-offset-*`\n* `col-lg-offset-*`\n\
    \n假设我们要在小屏幕显示上将一列右移三个 Bootstrap 列，我们可以使用 `\"col-xs-offset-3\"`，例如：\n\n```html\n\
    <div class=\"row\">\n    <div class=\"col-xs-6 col-xs-offset-3 col1\">\n     \
    \   <h1>Hello Learnable!</h1>\n    </div>\n</div>\n```\n\n此代码将产生一个跨越六列的列，向右偏移三列，如图\
    \ 2.15 所示。\n\n![偏移列](img/ch2Image7.png)\n\n图 2.15. 偏移列\n\n### 提示：居中你的列\n\n注意，该列的左右都有三列的间隙。这是屏幕中央居中\
    \ 50% 宽度列的最佳方法之一。\n\n## 手动重排网格\n\n我们还可以无视代码中编写的顺序来重新排列列。如果我们先写一个 `col-md-9` 列，然后是\
    \ `col-md-3` 列，我们可以在 HTML 页面渲染时轻松地交换它们的位置。这是通过 Bootstrap 的 `pull` 和 `push` 类实现的。\n\
    \n如 `col-xs-pull-*` 和 `col-xs-push-*` 之类的类分别向左或向右移动特定数量的列。例如：\n\n```html\n<div\
    \ class=\"row\">\n    <div class=\"col-xs-9 col-xs-push-3\">\n        <h1>Pushed\
    \ Column</h1>\n    </div>\n    <div class=\"col-xs-3 col-xs-pull-9\">\n      \
    \  <h1>Pulled Column</h1>\n    </div>\n</div>\n```\n\n"
- fmt: "\nIn the code, `col-xs-9` column is pushed by three columns so it has moved\
    \ towards the right. The `col-xs-3` column is also pulled by nine columns towards\
    \ the left. Hence, they appear as if they have swapped their original position\
    \ when viewed on a browser.\n\nThere are several variants of `push` and `pull`\
    \ classes as per the screen size:\n\n* `col-xs-pull-*` and `col-xs-push-*` for\
    \ extra smaller screens\n* `col-sm-pull-*` and `col-sm-push-*` for smaller screens\n\
    * `col-md-pull-*` and `col-md-push-*` for medium screens\n* `col-lg-pull-*` and\
    \ `col-lg-push-*` for larger screens\n\nYou can replace `*` with an integer between\
    \ one and 12 depending the number of columns you want to `pull` or `push`.\n\n\
    ## Summary\nYou can produce almost any kind of website layout using Bootstrap's\
    \ grid system. If used properly you can design a beautiful and responsive website\
    \ that works in almost any kind device. Features like nesting, offsetting and\
    \ reordering also make it more powerful. For more documentation on Bootstrap's\
    \ grid system, refer to `http://getbootstrap.com/#grid`.\n\n# Chapter 3: Exploring\
    \ Components ownIn this chapter, we'll start using some of Bootstrap's most useful\
    \ HTML components. Components such as buttons, headers, navigation menus, and\
    \ comments system are commonly found on websites. Through its components, Bootstrap\
    \ helps us add such features to our sites quickly and easily.\n\n## Page Components\n\
    Page components form the basic structure of a web page. Examples of page components\
    \ include page headers, standout panels for displaying important information,\
    \ nested comments, image thumbnails, and stacked lists of links. These are popular\
    \ components can take quite while to develop from scratch. In this section, we'll\
    \ focus on creating reusable HTML components using Bootstrap recommended markup\
    \ and classes.\n\n### Page Headers\nGiving a page a heading or title is not a\
    \ big deal. Anyone can use an `<h1>` tag to display a heading on a web page; however,\
    \ to neatly display a title with default styles, the proper amount of spacing\
    \ around it, and a small subtitle beside it can consume surprising amount of time.\
    \ Fortunately, Bootstrap has created an HTML component to be used as a page header\
    \ that takes care of all these tasks for us. Before we check out the markup for\
    \ the page header, we'll first set up the project we'll be using throughout.\n\
    \nFirst, copy the contents of the Bootstrap folder and paste them into a new folder\
    \ called `Chapter_3`. Open the `index.html` file and remove the `<h1>` tag that\
    \ is present inside the `<body>` tag. Now, let's add the markup for a page header:\n\
    \n```\n<div class=\"page-header\">\n      <h1>Chapter 3</h1>\n</div>\n```\n\n\
    Whenever you want to use the `<h1>` tag for a page title, you can wrap it in a\
    \ `<div>` element that has the class `page-header` to create a page header. Now\
    \ let's view `index.html` in our browser. It should look like Figure 3.1 (#ch03.html_header\
    \ \"Figure 3.1. A basic page header\").\n\n![A page header](figures/ch3Image1.png)\n\
    Figure 3.1. A basic page header\n\nAs you can see, the page header component doesn't\
    \ add any additional styles for the `<h1>` other than a thin gray border. It only\
    \ comes with styles for adding subtitles, which we'll see soon. A small issue\
    \ that we see here is that the page header has stuck to the browser's left border.\
    \ That's because we haven't defined a container for all the contents of our web\
    \ page. So let's create a global container:\n\n```\n<div class=\"container\">\n\
    \n</div>\n```\n\nNow place the page header markup inside the container `<div>`.\
    \ Our final markup should look like:\n\n```\n<div class=\"container\">\n    <div\
    \ class=\"page-header\">\n          <h1>Chapter 3</h1>\n    </div>\n</div>\n```\n\
    \nAnd the result can be seen in Figure 3.2 (#ch03.html_header \"Figure 3.2. Our\
    \ header in a container\").\n\n![Our header in a container](figures/ch3Image2.png)\n\
    Figure 3.2. Our header in a container\n\nIf you want to add a subtitle beside\
    \ the title of the page, you can put it inside the same `<h1>` tag that we used\
    \ before. Make sure you wrap the subtitle inside a `<small>` tag, like so:\n\n\
    ```\n<div class=\"container\">\n    <div class=\"page-header\">\n          <h1>Chapter\
    \ 3 <small>Exploring Components</small></h1>\n    </div>\n</div>\n```\n\nThe effect\
    \ can be seen in Figure 3.3 (#ch03.html_header \"Figure 3.3. Header with subtitle\"\
    ).\n\n![Header with subtitle](figures/ch3Image3.png)\nFigure 3.3. Header with\
    \ subtitle\n\n### Panels\nPanels are used to display text or images within a box\
    \ with rounded corners. Here's how to create a panel, and what it looks like in\
    \ Figure 3.4 (#ch03.html_panelbasic \"Figure 3.4. A panel\"):\n\n```\n<div class=\"\
    panel panel-default\">\n      <div class=\"panel-heading\">\n        ATTENTION\n\
    \      </div>\n      <div class=\"panel-body\">\n        Lorem ipsum dolor sit\
    \ ametnim ... \n      </div>\n      <div class=\"panel-footer\">\n        <a href=\"\
    #\" class=\"btn-danger btn-sm\">Agree</a> \n        <a href=\"#\" class=\"btn-default\
    \ btn-sm\">Decline</a>\n      </div>\n</div>\n```\n\n![A panel](figures/ch3Image4.png)\n\
    Figure 3.4. A panel\n\nAs you can see, the panel `<div>` has been divided into\
    \ three parts: `panel-heading`, `panel-body`, and `panel-footer`. Each of these\
    \ panel parts is optional. Panels come with various color options. In the previous\
    \ code, I've used the default color with the help of the `panel-default` class.\
    \ You can also use other classes for different colors:\n\n* `panel-primary` for\
    \ dark blue\n* `panel-success` for green\n* `panel-info` for sky blue\n* `panel-warning`\
    \ for yellow\n* `panel-danger` for red\n\n### Media Object\nMedia object is used\
    \ for creating components that should contain left- or right-aligned media (image,\
    \ video, or audio) alongside some textual content. It is best suited for creating\
    \ features such as a comments section, displaying tweets, or showing product details\
    \ where a product image is present.\n\nDesigning a comments section for your website\
    \ can be a tricky task. You need to carefully design some reusable HTML markup\
    \ that supports nested commenting. Bootstrap's media object comes in handy, as\
    \ you can quite easily create multiple levels of nested comments.\n\nThe markup\
    \ for creating a media object is:\n\n```\n<div class=\"media\">\n    <a class=\"\
    pull-left\" href=\"#\">\n        <img class=\"media-object\" src=\"path/to/image\"\
    \ alt=\"Syed Faz Rahman\">\n    </a>\n    <div class=\"media-body\">\n       \
    \ <h4 class=\"media-heading\">Awesome piece of work!</h4>\n        <p>Lorem ipsum\
    \ dolor sit amet, consectetur ...</p>\n    </div>\n</div>\n```\n"
