    \ grid\n\nTo make our columns clearer, let's give each one a background color.\
    \ We'll create a new CSS file called `styles.css` inside the CSS folder of our\
    \ project. It's not a standard filename, you can name it anything you wish. Next,\
    \ we'll link this file in our `index.html` using a `link` element inside the `head`\
    \ element:\n"
