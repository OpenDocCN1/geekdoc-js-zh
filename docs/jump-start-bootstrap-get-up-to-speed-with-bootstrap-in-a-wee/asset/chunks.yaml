  trans: "\n\n就像我们处理 CSS 组件一样，你可以前往 Bootstrap 的自定义页面，在下载之前取消勾选任何你不需要 JavaScript 插件。这是从\
    \ Bootstrap 中移除不需要的 JavaScript 插件最简单的方法。\n\nBootstrap 还为它的每个 JavaScript 插件都提供了单独的\
    \ `.js` 文件。例如，它有用于模态框的 `modal.js` 和用于轮播图的 `carousel.js`。只有在你下载了 Bootstrap 的源码包时，你才能访问这些单独的文件。\n\
    \n### 注意：获取源码包\n\n你可以通过在[Bootstrap 下载页面](http://getbootstrap.com/getting-started/#download)\
    \ 选择“Download Source”（下载源码）来获取 Bootstrap 的源码包。\n\n下载完成后，你可以进入 `js` 文件夹找到与每个 Bootstrap\
    \ JavaScript 插件相关的所有 `.js` 文件。然后，你只需要将你需要的那些文件包含在项目中即可。\n\n### 将所有 JavaScript\
    \ 文件合并为一个\n\n就像处理 CSS 一样，将所有的 JavaScript 文件压缩成单个 `.js` 文件也是一个好主意。我最喜欢的 JavaScript\
    \ 压缩工具之一是 `CompressJS`，你可以在它的[GitHub 下载页面找到该包](https://github.com/dfsq/compressJS.sh)。使用\
    \ `CompressJS`，你需要提供所有 `.js` 文件的路径，并用空格分隔。\n\n这是一个示例：\n\n```\n$ ./compressjs.sh\
    \ jquery.min.js bootstrap.min.js \n↵myCustomJavaScript.js\n```\n\n此命令将编译所有的 JavaScript\
    \ 文件并在单个 `.js` 文件中输出。它会给压缩后的文件一个随机名称并告诉你文件名。如果你有许多 JavaScript 文件，可以将它们放在同一个文件夹中，并按如下方式一起编译：\n\
    \n```\n$ ./compressjs.sh scripts/*.js\n```\n\n终端输出应该与图 6.1 类似。\n\n![Running CompressJS](img/ch6Image1.png)\n\
    \n图 6.1 运行 CompressJS\n\n### 优化图片\n\n通常是图片导致网页加载缓慢缓慢。想象一种情况：我们需要显示一张分辨率为 500px\
    \ x 500px 的图像，但我们拥有一张分辨率为 2000px x 2000px 的图像。我们可以使用 Bootstrap 的辅助类 `img-responsive`\
    \ 将较大的图像适应到 500px x 500px 的 div 中；然而，虽然辅助类帮助正确显示了图像，但它并没有实际上缩小图片的文件大小。遗憾的是，Bootstrap\
    \ 缺乏修复此问题的工具。\n\n有几种服务器端工具可以识别特定图片的请求类型，并在提供之前调整图片大小。我一直在使用的一些工具包括 [Adaptive Images](http://adaptive-images.com/)\
    \ 和 [TimThumb，](http://www.binarymoon.co.uk/projects/timthumb/)，但我不会在书中介绍它们，因为它们是服务器端工具。可以在它们的官方网上找到安装和使用说明。\n\
    \n## 避免常见陷阱\n\n到这里，你已经理解 Bootstrap 是构建响应式网站最好的框架之一。有了 Bootstrap，无需为你的网站开发单独的移动版本。单一的响应式版本可以在任何设备上查看。\n\
    \n然而，Bootstrap 开发者在开发响应式网站时经常会陷入一些常见的陷阱。这些问题会导致你的网站在较小设备上运行缓慢且无响应，因此请注意：\n\n*\
    \   **为特定设备使用不同的 HTML 标记**：新开发者经常利用 Bootstrap 的响应式实用程序功能（如 `hidden-sm` 和 `visible-sm`）来切换网站上各种组件的显示。他们在一个文档中编写不同版本的\
    \ HTML 标记，然后使用这些辅助类根据浏览器窗口的大小来切换组件的显示。通过这样做，他们忘记了 HTML 页面的总尺寸在增加，这会减慢渲染过程。因此，建议使用\
    \ Bootstrap 的网格系统在所有尺寸的浏览器中动态调整相同 HTML 标记的大小。\n\n*   **在目标为 IE8 及以下版本的应用程序中使用\
    \ Bootstrap**：我见过一些大型组织仍然兼容 Internet Explorer 8 及以下版本。虽然 Bootstrap 确实为 IE8 提供了支持，但有一些\
    \ CSS3 属性在其中无法工作，例如 `border-radius` 和 `box-shadows`。因此，如果你的目标用户是 IE8 及更低版本，建议避免使用\
    \ Bootstrap。事实上，你绝对不应该在目标群体为 IE7 及以下版本的应用程序中使用 Bootstrap 3。\n\n*   **使用 Bootstrap\
    \ 构建混合移动应用**：你应该避免使用 Bootstrap 创建使用 Web 技术开发并转移植到移动平台的混合应用。Bootstrap 对于此类应用来说可能太重了。你反而可以使用\
    \ [Ratchet 框架，](http://goratchet.com)，它是专门为创建移动应用而开发的。Ratchet 出自同一个 Bootstrap\
    \ 团队，你可以在 SitePoint 上了解更多信息。](http://www.sitepoint.com/prototype-mobile-apps-easily-ratchet/)\n\
    \nBootstrap 团队通过修复已知问题和添加新功能来不断发布新版本。你也可以查看 Bootstrap 的官方 issues 页面，以跟踪[Bootstrap\
    \ 3 当前的已知问题](https://github.com/twbs/bootstrap/issues)。\n\n## 接下来该做什么\n\n俗话说，“熟熟能生巧。”你对\
    \ Bootstrap 练习得越多，对设计的控制力就越强。练习的一种方法是尝试使用 Bootstrap 重现流行响应式网站的设计。以下是一个你可以从中获取灵感的网站列表：\n\
    \n*   [Hudson's Bay Company](http://www3.hbc.com/)\n*   [Dribbble](http://dribbble.com/)\n\
    *   [Google+](http://plus.google.com)\n*   [Pinterest](http://www.pinterest.com)\n\
    *   [Zurb](http://www.zurb.com)\n*   [Sony](http://www.sony.com)\n*   [Microsoft](http://www.microsoft.com)\n\
    *   [Bootstrap](http://getbootstrap.com)\n\n我们在书中已经查看了一些内置的 Bootstrap 插件，但研究一些可提供的第三方\
    \ Bootstrap 插件也是值得的，因为它们可以为你的网站添加强大的功能。以下是一些最流行的选择：\n\n*   [FuelUX](https://github.com/ExactTarget/fuelux/tree/3.0.0-wip)\
    \ 添加了各种流行功能，如日期选择器、复选框、组合框、加载器、药丸框和树形。\n\n*   [Jasny Bootstrap](http://jasny.github.io/bootstrap/)\
    \ 引入了一些 Bootstrap 3 中未涵盖的重要功能。例如，off canvas（从屏幕侧面滑出的菜单，类似于移动设备应用）、行链接（将表格行转换为可点击链接）、输入掩码（强制用户按特定格式输入数据）以及文件输入（一种时尚的文件输入字段）。\n\
    \n*   [Bootstrap Lightbox](http://www.jasonbutz.info/bootstrap-lightbox/) 为 Bootstrap\
    \ 添加了灯箱功能。\n\n*   [Bootstrap Image Gallery](http://blueimp.github.io/Bootstrap-Image-Gallery/))\
    \ 为 Bootstrap 提供了一个功能齐全、即插用的图库。\n\n*   [Bootstrap Notifications](http://goodybag.github.io/bootstrap-notify/)\
    \ 赋予在屏幕任何地方显示漂亮通知的能力。\n\n*   [Bootstrap Markdown](http://toopay.github.io/bootstrap-markdown/)\
    \ 在 Bootstrap 中提供了 Markdown 编辑工具。\n\n*   [Bootstrap Colorpicker](http://www.eyecon.ro/bootstrap-colorpicker/)\
    \ 添加了颜色选择器组件。\n\n*   [Bootstrap Star Rating](http://plugins.krajee.com/star-rating)\
    \ 提供星级评分工具。\n\n你应该在未来的项目中尝试 Bootstrap，以感受它所承诺的快速开发环境。你也可以关注 SitePoint 上的 Bootstrap\
    \ 教程来探索更多。加油，Bootstrap 吧！\n\n"
