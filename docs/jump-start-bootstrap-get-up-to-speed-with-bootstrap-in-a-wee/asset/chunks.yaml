  trans: "\n\n列表中还有一个文件，它本身并不是一个组件，即 `close.less`。它包含了用于模态框（modals）、警报（alerts）和其他元素关闭此特定组件的按钮\
    \ CSS 规则。\n\n### 插件文件\n\n四个 `.less` 文件定义了使用 Bootstrap 标记触发或创建的 JavaScript 插件的\
    \ CSS 样式：\n\n* `modals.less`\n* `tooltip.less`\n* `popovers.less`\n* `carousel.less`\n\
    \n### 工具文件\n\n最后，我们在 Bootstrap 中有两个工具文件：\n\n* `utilities.less`\n* `responsive-utilities.less`\n\
    \n这些文件定义了有助于我们更好地组织 Bootstrap 组件的类。它们包含了一些非常有用的类，例如 `.clearfix` 用于清除组件周围所有元素的浮动，以及\
    \ `.hide` 和 `.show` 用于切换组件的可见性。`responsive-utilities.less` 包含了可见性工具，如 `.visible-lg`\
    \ 和 `.hidden-sm`。\n\n### 使用 Less 覆盖样式\n\n让我们使用 Less 来覆盖模态框的样式。我们将自定义 `modals.less`\
    \ 以应用扁平化（Metro 风格）设计，移除圆角并减少应用在上面的阴影。我们还将更改模态框的背景颜色和文本颜色。打开 `modals.less` 并进行这些更改。\n\
    \n模态框的圆角是通过 `modal-content` 类应用的。让我们在 `modals.less` 中找到这个选择器。它看起来应该是这样的：\n\n```\n\
    // Actual modal\n.modal-content {\n  position: relative;\n  background-color:\
    \ @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    \  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\n从代码中，我们可以看到圆角来自 `border-radius` 属性，其值是在 `variables.less`\
    \ 中初始化的 Less 变量。让我们注释掉这一行来移除圆角：\n\n```\n// Actual modal\n.modal-content {\n  position:\
    \ relative;\n  background-color: @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    //  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\n现在，我们必须减少阴影量。分析代码，我们可以看到 `.box-shdow()` mixin 负责生成 CSS\
    \ 中的阴影属性。该 mixin 定义在 `mixins.less` 文件中，阴影值作为值传递给该 mixin。让我们根据需求更改此值。阴影量由值中的第三个数字定义，它作为参数传递——目前是\
    \ 9px。让我们将这个数字减少到 2px。因此，我们的选择器现在看起来应该是这样：\n\n```\n// Actual modal\n.modal-content\
    \ {\n  position: relative;\n  background-color: @modal-content-bg;\n  border:\
    \ 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8\
    \ etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
    \  .box-shadow(0 3px 2px rgba(0,0,0,.5));\n  background-clip: padding-box;\n \
    \ // Remove focus outline from opened modal\n  outline: 0;\n}\n```\n\n我们还需要更改其中一个媒体查询中的\
    \ `box-shadow` 值，这会覆盖之前的更改。我们很快就会学习媒体查询。但现在，你需要理解 Bootstrap 对不同尺寸的设备有不同的 CSS 规则。所以，让我们在\
    \ `modals.less` 中找到以下媒体查询：\n\n```\n// Scale up the modal\n@media (min-width: @screen-sm-min)\
    \ {\n  // 为更大的视口自动设置模态框宽度\n  .modal-dialog {\n    width: @modal-md;\n    margin:\
    \ 30px auto;\n  }\n  .modal-content {\n    .box-shadow(0 5px 15px rgba(0,0,0,.5));\n\
    \  }\n\n  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\n让我们将新的\
    \ `box-shadow` 值传递给此媒体查询中的 `.box-shadow()` mixin：\n\n```less\n// Scale up the\
    \ modal\n@media (min-width: @screen-sm-min) {\n  // 为更大的视口自动设置模态框宽度\n  .modal-dialog\
    \ {\n    width: @modal-md;\n    margin: 30px auto;\n  }\n  .modal-content {\n\
    \    .box-shadow(0 5px 2px rgba(0,0,0,.5));\n  }\n\n  // Modal sizes\n  .modal-sm\
    \ { width: @modal-sm; }\n}\n```\n\n现在我们来更改模态框的背景颜色。我们将使用 `variables.less` 中预定义的变量\
    \ `@brand-info` 作为模态框的背景颜色。该变量初始化为 `#5bc0de`，这是一种浅蓝色。对于文本颜色，让我们使用变量 `@body-bg`，它在同一个文件中被设置为\
    \ `#fff`。修改后的 `modal-content` 选择器现在看起来像：\n\n```\n// Actual modal\n.modal-content\
    \ {\n  position: relative;\n  background-color: @modal-content-bg;\n  border:\
    \ 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8\
    \ etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
    \  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip: padding-box;\n \
    \ // Remove focus outline from opened modal\n  outline: 0;\n\n  background: @brand-info;\n\
    \  color: @body-bg;\n\n}\n```\n\n我们已经完成了所有计划的自定义，但让我们对 `modal-backdrop` 选择器进行最后的更改。`modal-backdrop`\
    \ 是一个透明层，每当模态框组件被触发时，它就会出现在 `modal-content` 之后。\n\n我们将此 `modal-background` 的背景颜色从黑色改为白色：\n\
    \n```\n// Modal background\n.modal-backdrop {\n  position: fixed;\n  top: 0;\n\
    \  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index: @zindex-modal-background;\n\
    \  background-color: @body-bg;\n  // Fade for backdrop\n  &.fade { .opacity(0);\
    \ }\n  &.in { .opacity(@modal-backdrop-opacity); }\n}\n```\n\n最后，我们完成了所有的自定义。现在是时候编译导入\
    \ `modals.less` 的 `bootstrap.less` 文件了。一旦 `.less` 文件编译生成 `bootstrap.css`，你就可以通过替换旧的\
    \ `bootstrap.css` 将其用于项目中（我们下一节讨论如何编译 Less 文件）。从此，每当你使用模态框组件时，它将使用自定义的样式。图 5.4\
    \ 显示了自定义的模态框截图。\n\n![Modal with Less](img/ch5less-demo-8.png)\n\n图 5.4. Modal\
    \ with Less\n\n### 编译 Less\n\n编译 Less 相对简单。在这里，我将向你展示一些标准的方法。\n\n#### 使用 Node\n\
    \n如果你安装了 Node，可以使用 Node 的包管理器安装 `less` 编译器：\n\n```\n$ npm install -g less\n```\n\
    \n一旦安装了 `less`，使用以下命令将 `bootstrap.less` 编译为 `bootstrap.css`。你必须在命令行中导航到 `/less`\
    \ 文件夹，然后输入此命令：\n\n```\n$ lessc bootstrap.less > bootstrap.css\n```\n\n### 使用第三方软件\n\
    \n有很多用于编写和编译 Less 代码的 GUI 应用程序。一些流行的选项包括 [Crunch!](http://crunchapp.net/)、[SimpLESS,](http://wearekiss.com/simpless)\
    \ 和 [Mixture.](http://mixture.io/)。\n\n"
- fmt: "\nUnchecking a particular component may also uncheck other components that\
    \ are dependent on it. For example, unchecking `Forms` from the customize page\
    \ will also uncheck `Input groups` and `Navbar` automatically. Hence, you need\
    \ to be careful when making selections!\n\n## Media Queries and Bootstrap\n\n\
    `Media queries` were introduced as a part of CSS3 to dynamically control website\
    \ content depending on screen resolution. It's one of the key technologies beneath\
    \ every responsive framework available today. Bootstrap uses media queries to\
    \ properly define many CSS rules to make it a responsive framework.\n\nUnderstanding\
    \ media queries is important if you want to customize Bootstrap's responsive grid\
    \ system. Let's take a look at a simple media query:\n\n```\n@media all and (min-width:\
    \ 699px){\n    h1{\n        display: none;\n    }\n}\n```\n\nEvery media query\
    \ should have a media type and an expression. The `media type` specifies on what\
    \ type of devices the linked document will be displayed Here, the media type is\
    \ `all`. The `expression` further limits the stylesheet's scope using `media features`,\
    \ such as width, height, and color. Here, the expression is `min-width: 699px`.\
    \ This media query will apply the CSS properties contained in it if the browser\
    \ width is greater than 699px. Hence, the `h1` element will be hidden on screens\
    \ wider than `699px`.\n\nThere are many media types and media features available\
    \ to us. Examples of media types include `all`, `print`, `screen`, and `projection`.\
    \ Examples of media features include `height`, `max-height`, and `max-width`.\n\
    \nBootstrap has defined many media queries for various device sizes to create\
    \ a highly responsive framework. One of the snippets from Bootstrap's CSS file\
    \ is shown here:\n\n```\n@media (min-width: 768px) {\n  .container {\n    width:\
    \ 750px;\n  }\n}\n```\n\nTo read more about media queries, refer to the [Mozilla\
    \ Developer Network documentation.](https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Media_queries)\n\
    \n## Summary\n\nIn this chapter, we've discussed the various ways of customizing\
    \ Bootstrap and seen how to customize Bootstrap via CSS and Less. As we've seen,\
    \ Bootstrap offers many options for altering the default styles, giving you the\
    \ power to create your own unique and beautiful designs.\n\n# Chapter 6: Optimizing\
    \ Bootstrap\n\nSo we have reached the final chapter of the book. We've really\
    \ come a long way, now having the capability to build a professional, responsive\
    \ website using Bootstrap. But the final piece of the puzzle is discovering how\
    \ to optimize our creations so that they not only look good but also perform well.\n\
    \nIn this chapter, you will be learning techniques to optimize a website built\
    \ with Bootstrap (or, indeed, any other front-end framework). We will be working\
    \ with CSS and JavaScript minification and also streamlining the Bootstrap default\
    \ package. We will try to understand the limitations of Bootstrap and discuss\
    \ some of the common pitfalls of using it.\n\n## Optimization Techniques\n\nA\
    \ website needs to look good and perform well. Web users have become impatient,\
    \ and a slow-loading website will be dismissed, irrespective of how beautifully\
    \ designed it is.\n\nIn order to build the right template, we need to optimize\
    \ our CSS files, JavaScript files, and images. All these files are served to the\
    \ browser via separate request calls, so the lighter they are, the better the\
    \ overall performance of the website.\n\n### Optimizing CSS\n\nWhen dealing with\
    \ the Bootstrap framework, we generally end up creating more than one CSS file.\
    \ By default, every Bootstrap project comes with the `bootstrap.css` file included\
    \ in the website's template. On top of that, we will normally have custom CSS\
    \ files to make our website look more attractive. Here are a few tasks we can\
    \ do to reduce the size of the CSS files in our website's template.\n\n#### Use\
    \ the Minified Bootstrap CSS File\n\nAs stated in the [previous chapter](#ch05.html\
    \ \"Chapter 5Diving Deep: Customizing Bootstrap\"), Bootstrap allows developers\
    \ to select only those components that are actually needed while developing the\
    \ template. This reduces the overall size of the main Bootstrap CSS file (`bootstrap.css`).\
    \ Once the website is ready for production, we can further reduce the size of\
    \ this CSS file by using its minified version (`bootstrap.min.css`).\n\n#### Remove\
    \ Unused Bootstrap Components Using Less\n\nIf you prefer writing CSS through\
    \ Less, you have the additional option of customizing Bootstrap through its main\
    \ Less file (`bootstrap.less`). If you open this file, you'll see lots of import\
    \ statements aggregating various Bootstrap components together. You can comment\
    \ out those import statements that are irrelevant to your template.\n\nFor example,\
    \ to avoid using Bootstrap's labels, badges, and progress bars, you can comment\
    \ out the following lines from `bootstrap.less` file:\n\n```\n@import \"labels.less\"\
    ;\n@import \"badges.less\";\n@import \"progress-bars.less\";\n```\n\nSuppose that\
    \ you don't want to use any of Bootstrap's JavaScript plugins. Remove all the\
    \ CSS rules associated with them by commenting out the following lines from `bootstrap.less`\
    \ to exclude them completely:\n\n```\n// Components w/ JavaScript\n@import \"\
    modals.less\";\n@import \"tooltip.less\";\n@import \"popovers.less\";\n@import\
    \ \"carousel.less\";\n```\n\nYou can also remove the default font icons (glyphicons)\
    \ that are built into the Bootstrap package. First you need to delete all the\
    \ `glyphicon-*` font files from the fonts folder. Then comment out the following\
    \ import statement from `bootstrap.less` file:\n\n```\n@import \"glyphicons.less\"\
    ;\n```\n\nAfter you're done commenting out those components that you won't be\
    \ using, compile the main `bootstrap.less` file to form `bootstrap.css`.\n\n####\
    \ Compress the CSS Files into One File\n\nAfter developing your website's template,\
    \ you will likely be left with a version of Bootstrap's CSS and multiple CSS files.\
    \ You can combine all these files into one CSS file, which will help in reducing\
    \ the number of HTTP requests, as well as the combined size of all the files.\n\
    \nThere are several tools to help you with the compression process. One of my\
    \ favorites is [Recess from Twitter,](http://twitter.github.io/recess/) an open-source\
    \ code quality tool for CSS. You can read [how to install and use Recess at SitePoint.](http://www.sitepoint.com/optimizing-css-stylesheets-recess/)\n\
    \nLet's first combine all the CSS files into a main one called `application.css`.\
    \ This can done using CSS's `@import` statement as follows:\n\n```\n@import url(\"\
    bootstrap.min.css\");\n@import url(\"myCSSFile1.css\");\n@import url(\"myCSSFile2.css\"\
    );\n@import url(\"myCSSFile3.css\");\n@import url(\"myCSSFile4.css\");\n```\n\n\
    You need to ensure that you are providing relative paths in the import statements\
    \ with respect to `application.css`.\n\nNext, run the `recess` command in the\
    \ terminal:\n\n```\nrecess path/to/application.css --compress > \n↵path/to/application.min.css\n\
    ```\n\nThis will create a new CSS file called `application.min.css` in the same\
    \ folder. This new CSS file will be much smaller in size than the original separate\
    \ files.\n\n### Optimizing JavaScript\n\nOptimizing the JavaScript files is equally\
    \ as important as optimizing the CSS files. Bootstrap comes with flexible options\
    \ to remove any unwanted JavaScript plugins that we won't be using in our projects.\
    \ This can greatly help in reducing the size of the main JavaScript file `bootstrap.js`.\n\
    \n#### Use a Minified Bootstrap JavaScript file\n\nIf you want to be able to use\
    \ all of Bootstrap's JavaScript plugins, you should include the minified file\
    \ `bootstrap.min.js` rather than `bootstrap.js` when sending the project for production.\n"
