    \ the tooltip is visible\n\n2.  `shown.bs.tooltip`: this event is fired after\
    \ the tooltip is visible\n\n3.  `hide.bs.tooltip`: fired before the tooltip is\
    \ hidden\n\n4.  `hidden.bs.tooltip`: fired after the tooltip is hidden\n\nHere's\
    \ how you'd use them:\n\n```\n$('.tooltipButton').on('show.bs.tooltip', function\
    \ () {\n  console.log(\"Showing tooltip..\");\n});\n\n$('.tooltipButton').on('shown.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip shown.\");\n});\n\n$('.tooltipButton').on('hide.bs.tooltip',\
    \ function () {\n  console.log(\"Hiding tooltip..\");\n});\n\n$('.tooltipButton').on('hidden.bs.tooltip',\
    \ function () {\n  console.log(\"Tooltip hidden.\");\n});\n```\n\n### Popovers\n\
    \n**Popovers** are another useful plugin that are comparable to tooltips. The\
    \ difference is that popovers are larger and more stylish than tooltips, as shown\
    \ in [Figure 4.16](#ch04.html_poptool \"Figure 4.16. Popovers versus tooltips\"\
    ). They look very similar to the popovers in Apple iBooks' dictionary feature.\n\
    \n![Popovers versus tooltips](figures/ch4Image17-1.png)\n\nFigure 4.16. Popovers\
    \ versus tooltips\n\nYou can place more content in a popover than a tooltip. It\
    \ is recommended to use popovers instead of tooltips when you have more HTML content\
    \ or textual content to display.\n\nLet's trigger a popover to activate on the\
    \ click event of a button. The markup to do this is:\n\n```\n<button type=\"button\"\
    \ class=\"btn btn-danger\" data-toggle=\"popover\" \n↵data-placement=\"bottom\"\
    \ data-content=\"Lorem Ipsum Donor.\" \n↵title=\"This is a demo popover\">\n \
    \ Click Me!\n</button>\n```\n\nThere are a few custom `data-*` attributes that\
    \ are necessary for the popover plugin to function. These are similar to the custom\
    \ attributes used in tooltips. The `data-toggle` attribute directs what to trigger\
    \ when an action is performed on this button. The `data-placement` attribute specifies\
    \ the position of the popover. The `data-content` attribute should contain the\
    \ content you want to convey in the popover. Finally, set the `title` attribute\
    \ to append a header to the plugin.\n\nJust like tooltips, popovers should also\
    \ be manually initiated. You can use the following script:\n\n```\n<script type=\"\
    text/javascript\"\n  $(document).ready(function(){\n     $('.popoverButton').popover();\
    \ \n  });\n</script>\n```\n\nAs the selector in this code is a class, we need\
    \ to add the `popoverButton` class to the button. The results are shown in [Figure 4.17](#ch04.html_popover\
    \ \"Figure 4.17. Popover\").\n\n![Popover](figures/ch4Image17.png)\n\nFigure 4.17. Popover\n\
    \n### Popovers with JavaScript\n\nBootstrap provides the `popover()` method for\
    \ customizing the default behavior of the popover plugin. It accepts an options\
    \ object, just like the tooltip plugin. All the options properties available to\
    \ the tooltip plugin discussed earlier also apply to the popover plugin.\n\nFor\
    \ example:\n\n```\nvar options = {\n    animation: true,\n    placement: \"right\"\
    \n};\n\n$('.popoverButton').popover(options);\n```\n\nThe popover plugin also\
    \ accepts a set of predefined strings that are mapped to certain behaviors of\
    \ a popover; for instance:\n\n```\n$('.popoverButton').popover(\"show\");\n```\n\
    \nJust like a tooltip plugin, we have the same set of predefined strings to change\
    \ the state of a popover plugin. When passing the “`show`” string, the popover\
    \ will be visible. Other available strings are: “`hide`”, “`toggle`” and “`destroy`”."
