  trans: "\n\n```\n<link href=\"css/styles.css\" rel=\"stylesheet\">\n```\n\n让我们在这个文件中加入一些\
    \ CSS，让每列都具有不同的背景颜色：\n\n```\n.col1{\n    background: #5C7080;\n}\n\n.col2{\n \
    \   background: #6BC0FF;\n}\n```\n\n我们还必须在标记中添加 `col1` 和 `col2` 类，以便列能够选取它们各自对应的\
    \ CSS 样式。更新后的标记如下：\n\n```\n<div class=\"container\">\n    <div class=\"row\">\n\
    \        <div class=\"col-xs-6 col1\">\n            <h4>Column 1</h4>\n      \
    \  </div>\n        <div class=\"col-xs-6 col2\">\n            <h4>Column 2</h4>\n\
    \        </div>\n    </div>\n</div>\n```\n\n![一个具有背景颜色样式的双列布局图-2](img/ch2Image2-2.png)\n\
    \n图 2.3. 具有背景颜色样式的双列布局\n\n但是类 `col-xs-6` 中的 `xs` 代表什么？Bootstrap 有四种类前缀用于为不同尺寸的显示创建列：\n\
    \n1. `col-xs` 用于超小显示（屏幕宽度 < 768px）\n2. `col-sm` 用于较小显示（屏幕宽度 ≥ 768px）\n3. `col-md`\
    \ 用于中等显示（屏幕宽度 ≥ 992px）\n4. `col-lg` 用于大显示（屏幕宽度 ≥ 1200px）\n\n当我们指定类 `col-xs-12`\
    \ 时，意味着该元素在超小屏幕上应该跨越所有 12 个可用的 Bootstrap 列。但更大的显示器呢？在上面的代码中，我们没有指定 `div` 在较大屏幕类型上的行为。幸运的是，Bootstrap\
    \ 将自动遵循为最小屏幕尺寸指定的布局。因此，在这段代码中，我们的 `div` 在所有类型的显示中都会跨越 12 列。\n\n让我们检查以下标记：\n\n\
    ```\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
    col-xs-12 col-sm-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n  \
    \      <div class=\"col-xs-12 col-sm-6 col2\">\n            <h4>Column 2</h4>\n\
    \        </div>\n    </div>\n</div>\n```\n\n在这段代码中，我们使用 `col-xs-12` 类用于超小显示，使用\
    \ `col-sm-6` 类用于小尺寸显示。因此，在超小尺寸显示中，每一列将占据所有 12 个可用的 Bootstrap 列，表现为列的堆叠。然而在较小的显示器上，它们将各占据六个\
    \ Bootstrap 列，以实现如图 2.4 所示的双列布局。\n\n![较小屏幕上的布局图-3](img/ch2Image3-1.png)\n\n图 2.4.\
    \ 较小屏幕上的布局\n\n让我们在之前的代码中再添加一行列。我们将复制用于代码中创建行时使用的相同标记。我们布局中两行四列的最终标记如下：\n\n```\n\
    <div class=\"container\">\n    <div class=\"row\">\n        <div class=\"col-xs-12\
    \ col-sm-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n        <div\
    \ class=\"col-xs-12 col-sm-6 col2\">\n            <h4>Column 2</h4>\n        </div>\n\
    \    </div>\n    <div class=\"row\">\n        <div class=\"col-xs-12 col-sm-6\
    \ col3\">\n            <h4>Column 3</h4>\n        </div>\n        <div class=\"\
    col-xs-12 col-sm-6 col4\">\n            <h4>Column 4</h4>\n        </div>\n  \
    \  </div>\n</div>\n```\n\n我添加了两个新类 `col3` 和 `col4`，给我们的列提供不同的背景颜色：\n\n```\n.col3{\n\
    \    background: #E8AA4C;\n}\n\n.col4{\n    background: #FF384E;\n}\n```\n\n这里是结果，如图\
    \ 2.5 所示。\n\n![两行四列布局图-4](img/ch2Image4-1.png)\n\n图 2.5. 两行四列布局\n\n## 案例研究：创建动态布局\n\
    \n让我们看看如何将网格系统付诸实践，创建一个根据查看设备尺寸进行调整的动态布局。\n\n假设我们必须使用 Bootstrap 框架创建一个博客布局。我们得到了如图\
    \ 2.6 所示的桌面端显示线框。\n\n![桌面端显示时网站的线框图](img/ch2wireframe-desktop.png)\n\n图 2.6. 桌面端显示时网站的线框图\n\
    \n在线框图中，我们有一个跨越整个网站宽度的页眉。然后，我们有一个包含博客文章的三列布局。如果在平板电脑（竖屏模式）上查看相同的布局，它看起来会非常笨拙。因此，我们为平板模式重新设计了线框图，如图\
    \ 2.7 所示。\n\n![平板端显示时网站的线框图](img/ch2wireframe-tablet.png)\n\n图 2.7. 平板端显示时网站的线框图\n\
