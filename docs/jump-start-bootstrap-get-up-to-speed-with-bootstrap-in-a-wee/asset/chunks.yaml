  trans: "\n使用 Bootstrap 3，模态框（modals）已经变得响应式。这意味着即使在较小的屏幕上，它们也有良好的显示和运行效果。让我们创建一个模态框：\n\
    \n```html\n<div class=\"modal fade\" id=\"myModal\">\n    <div class=\"modal-dialog\"\
    >\n        <div class=\"modal-content\">\n            <!-- Modal Header -->\n\
    \            <div class=\"modal-header\">\n                <button type=\"button\"\
    \ class=\"close\" data-dismiss=\"modal\">&times;</button>\n                <h4\
    \ class=\"modal-title\">Welcome Back!</h4>\n            </div>\n            <!--\
    \ Modal Body -->\n            <div class=\"modal-body\">\n                <h1>Hello\
    \ Readers!</h1>\n            </div>\n            <!-- Modal Footer -->\n     \
    \       <div class=\"modal-footer\">\n                <button type=\"button\"\
    \ class=\"btn btn-default\" data-dismiss=\"modal\">Close</button>\n          \
    \      <button type=\"button\" class=\"btn btn-primary\">Save changes</button>\n\
    \            </div>\n        </div>\n    </div>\n</div>\n```\n\n每个模态框都应该有一个一个类名为\
    \ `modal` 的容器。为了给模态框添加淡入效果，我们需要在同一个容器上添加 `fade` 类。接下来，我们定义一个类名为 `modal-dialog`\
    \ 的 `div` 元素。它负责控制模态框的大小。默认情况下，它会根据屏幕的大小调整尺寸。稍后我们将看到如何通过向 `modal-dialog` 添加额外的类来更改模态框的大小。在模态对话框内部，我们将创建一个包装元素，用于封装模态框的各个子部分。该包装元素应该有一个名为\
    \ `modal-content` 的类。\n\n模态框的子部分包括头部（header）、主体（body）和页脚（footer）。头部和页脚是可选的。要创建一个模态框头部，你需要一个类名为\
    \ `modal-header` 的 `div` 元素。在里面你可以模态标题和模态关闭图标。模态标题使用类名为 `modal-title` 的 `h4` 元素给出。这里的关闭图标是一个封装在\
    \ `button` 元素周围的乘法（x）符号。此按钮应该具有 `close` 类，以便它对齐到模态框头部的左上角。添加 `data-dismiss` 属性可以允许按钮在点击时关闭模态框。\n\
    \n对于主体，我们需要一个类名为 `modal-body` 的 `div`。你可以在此元素放入放入任何内容。你甚至可以使用 Bootstrap 的网格系统在内部合理组织内容。\n\
    \n最后，为了创建模态框页脚，我们定义一个类名为 `modal-footer` 的 `div` 元素。模态框页脚内部的内容默认右对齐。\n\n如果你在浏览器中检查之前的模态框代码段，你会发现什么；模态框本质上是隐藏的。你必须创建一个句柄来触发它：\n\
    \n```html\n<button class=\"btn btn-primary btn-lg\" data-toggle=\"modal\" data-target=\"\
    #myModal\">\n    Launch modal\n</button>\n```\n\n在代码代码中，我使用按钮组件来触发模态框。它应该有一个 `data-target`\
    \ 属性，告诉 Bootstrap 应该触发哪个模态框，因为网站中可能有多个模态框。我们还需要定义 `data-toggle` 属性来确定点击时触发什么操作。\n\
    \n现在我们已经准备好使用我们的模态框了。去点击按钮，查看浏览器中淡入的模态框，如图 4.19 所示。\n\n![Our modal](img/ch4Image19.png)\n\
    \n图 4.19 我们的模态框\n\n### 注意：模态框的位置\n\n模态框的标记必须放置在文档的顶层位置，以防止与其他组件冲突。然而，放置模态框句柄时没有限制。它可以放在文档的任何地方。\n\
    \n模态框有三种宽度：大、默认和小。这些对于将内容恰当地放入模态对话框中非常有帮助。\n\n如果未为 `modal-dialog` 提供额外的类，它将以 600px\
    \ 的默认宽度出现。要使模态框变大或变小，你需要向 `modal-dialog` 元素添加这些类之一：\n\n* `modal-lg`: 用于宽度为 900px\
    \ 的大模态框\n* `modal-sm`: 用于宽度为 300px 的小模态框\n\n### 使用 JavaScript 的模态框\n\nBootstrap\
    \ 提供了 `modal()` 方法通过 JavaScript 触发模态框。该方法还接受一个选项对象，其中包含用于自定义模态框默认行为的各种属性：\n\n\
    ```javascript\nvar options = {\n    backdrop: true,\n    keyboard: false,\n  \
    \  show: true,\n    remote: false\n}\n\n$(\"#myModal\").modal(options);\n```\n\
    \n`backdrop` 接受布尔值或字符串值 `static`。当模态框启动时，模态框主体后面默认会出现一个深色的透明背景。将此属性设置为 `true`\
    \ 会使背景可见。将其设置为 `false`，则背景会消失。当设置为 `static` 时，点击模态框主体外部任何地方，模态框都不会关闭。\n\n`keyboard`\
    \ 属性用于启用或禁用键盘的 escape 键功能。当设置为 `false` 时，`Esc` 键不会关闭模态框。\n\n`show` 属性用于通过 JavaScript\
    \ 切换模态框的可见性。当设置为 `true` 时，模态框将自动出现，无需点击任何句柄元素。\n\n`a` 元素可以作为模态句柄元素，它可以包含一个带有链接的\
    \ `href` 属性。Bootstrap 模态框有一个选项在点击句柄时将此链接加载到其 `modal-body` 元素中。此功能默认关闭的。如果你想使用此功能并将链接加载到\
    \ `modal-body` 中，请将 `remote` 属性设置为 `true`。\n\n与 Bootstrap 模态框相关的事件包括：\n\n1. `show.bs.modal`:\
    \ 在打开模态框之前触发\n2. `shown.bs.modal`: 在模态框打开后触发\n3. `hide.bs.modal`: 在隐藏模态框之前触发\n\
    4. `hidden.bs.modal`: 在模态框隐藏后触发\n5. `loaded.bs.modal`: 在远程内容加载后触发\n\n以下是它们的用法：\n\
    \n```javascript\n$('#myModal').on('show.bs.modal', function () {\n    console.log(\"\
    Opening Modal..\");\n});\n\n$('#myModal').on('shown.bs.modal', function () {\n\
    \    console.log(\"Modal opened.\");\n});\n\n$('#myModal').on('hide.bs.modal',\
    \ function () {\n    console.log(\"Hiding Modal..\");\n});\n\n$('#myModal').on('hidden.bs.modal',\
    \ function () {\n    console.log(\"Modal hidden.\");\n});\n```\n\n## 总结\n\n在本章中，我们学习了如何使用许多流行的\
    \ Bootstrap JavaScript 插件。我们还学习了如何通过设置自定义 `data-*` 属性和通过 JavaScript 来自定义它们。在使用\
    \ Bootstrap 时，你应该尽可能利用内置插件，并避免编写自定义插件。\n\n# 第 5 章：深入探讨：自定义 Bootstrap\n\n想象一个 Web\
    \ 世界，所有用 Bootstrap 构建的网站看起来和感觉都一样。很无聊，对吧？幸运的是，我们有能力改变所处理的任何框架的默认样式。\n\nBootstrap\
    \ 的许多组件和插件都有自己的默认样式。为了给它们注入个性化色彩，你需要替换它们的 CSS 规则并定义你自己的。\n\n在第一章， 中，我与你分享了一些基于\
    \ Bootstrap 构建的流行网站。它们都自定义了 Bootstrap 的 CSS，使它们的模板看起来独特且美丽。\n\n在本章中，我们将讨论可以用来完全自定义\
    \ Bootstrap 默认样式的各种方法，并分析哪种方法更优以及为什么。最后，我们将尝试理解 Bootstrap 的 CSS 是如何编写的，使其成为高度响应式的框架。\n\
    \n## 自定义 Bootstrap 样式表\n\n你可以通过多种方式自定义 Bootstrap。在本节中，我们将看到通过静态 CSS 文件和 Less 文件进行自定义。\n\
    \n### 注意：什么是 Less？\n\n"
- fmt: "\n[Less](http://lesscss.org) is a CSS preprocessor that extends CSS capabilities,\
    \ adding programming features such as variables, mixins, functions, and so on.\
    \ It keeps CSS modular, maintainable, and extendible. Less files are compiled\
    \ to generate CSS files that you can then use in your projects.\n\nIf you work\
    \ with Ruby, [Sass](http://sass-lang.com) is an alternative to Less. It is also\
    \ a CSS preprocessor that Bootstrap supports; however, we won't be covering Sass\
    \ customizations in this book.\n\nThe stylesheets that come with Bootstrap's default\
    \ package are normal CSS files. If you open the static CSS files using a text\
    \ editor, you'll find lots of selectors and their associated CSS properties. You\
    \ may be tempted to directly change CSS properties and their values in these files\
    \ to save time, but I would strongly advise against it.\n\nThere are many disadvantages\
    \ of directly modifying the CSS files. Some of the important ones are:\n\n*  \
    \ The changes are irreversible. You won't remember the CSS properties and their\
    \ values that were present originally, so you'll be unable to revert back to the\
    \ original Bootstrap style.\n*   Any changes made by you to one selector may break\
    \ down the responsiveness of Bootstrap.\n*   Debugging becomes very difficult;\
    \ you need to understand the CSS inheritance chain to reach the parent selector.\n\
    \nBefore we jump into customization, let's first set up the project that will\
    \ be used in this chapter. As always, we'll be using the project created in [Chapter\
    \ 1,](#ch01.html \"Chapter 1Up, Close, and Personal with Bootstrap\") `Bootstrap_demos`.\
    \ Copy all the contents into a new folder named `Chapter_5`. Open `index.html`\
    \ and change the title of the page to “Customizing Bootstrap”. Now remove the\
    \ `<h1>` tag from the body.\n\n### Customizing Bootstrap Using CSS\n\nThis type\
    \ of customization is generally known as `overriding the default CSS`. We effectively\
    \ overwrite some of Bootstrap's CSS properties with different values of our own.\n\
    \nFirst, we create a new file called `app.css` (or whatever you wish) inside the\
    \ `/css` folder. Then we open `index.html` and link to the new CSS file. The link\
    \ to this new CSS file should be included just below the link to Bootstrap's CSS\
    \ file:\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\"\
    >\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/app.css\">\n```\n\nLet's\
    \ add a Bootstrap button, shown in [Figure 5.1](#ch05.html_plainbutton \"Figure\
    \ 5.1. Our default button\"). We'll use that to show how to make some changes\
    \ to its default design:\n\n```\n<div class=\"container\">\n    <a href=\"#\"\
    \ class=\"btn btn-primary btn-lg\">Big Fat Button</a>\n</div>\n```\n\n![Our default\
    \ button](figures/ch5Image1.png)\n\nFigure 5.1. Our default button\n\nHere's what\
    \ we'll now do to customize this button:\n\n*   remove the rounded corners from\
    \ this button\n*   alter the padding amount\n*   tweak the font size\n*   change\
    \ the background color\n\nLet's inspect the button using a developer tool. We'll\
    \ use Chrome, as shown in [Figure 5.2](#ch05.html_buttoninspect \"Figure 5.2.\
    \ Inspecting our button in Chrome's developer tool\"), but you can use any similar\
    \ tool of your choice, such as Firebug in Firefox. The properties such as `padding`,\
    \ `font-size`, and `border-radius` come from the class `btn`, whereas the property\
    \ `background` is applied through the class `btn-primary`. To modify them, we'll\
    \ need to override the properties using the same selectors in our CSS file, `app.css`.\n\
    \n![Inspecting our button in Chrome's developer tool](figures/ch5Image2.png)\n\
    \nFigure 5.2. Inspecting our button in Chrome's developer tool\n\nOpen app.css\
    \ and add the following CSS:\n\n```\n.btn{\n    border-radius: 0; \n    padding:\
    \ 5px 10px;\n    font-size: 16px;\n}\n\n.btn-primary{\n    background: #63AEF0;\n\
    }\n```\n\nIf we refresh our page, our button should now look like [Figure 5.3](#ch05.html_custombutton\
    \ \"Figure 5.3. A customized button\").\n\n![A customized button](figures/ch5Image3.png)\n\
    \nFigure 5.3. A customized button\n\nNote that we have used the Bootstrap classes\
    \ `btn` and `btn-primary` to override the CSS styles. Henceforth, whenever you\
    \ use Bootstrap's button component it will have a changed style that looks like\
    \ [Figure 5.3](#ch05.html_custombutton \"Figure 5.3. A customized button\"). To\
    \ revert back to the original style, we simply remove the CSS styles from the\
    \ `app.css` file.\n\nIf you want to change the style of only a particular button\
    \ in your web page, instead of targeting Bootstrap's selectors, use IDs to apply\
    \ a CSS change.\n\n### Customizing Bootstrap Using Less\n\nIf you are a Less developer\
    \ you will love this section, as there are plenty of options for working with\
    \ Less to customize Bootstrap. There's a Less file for every Bootstrap component\
    \ to change their properties easily. To access all the Less files, you need to\
    \ download a particular version of Bootstrap. Go to [http://getbootstrap.com/getting-started/](http://getbootstrap.com/getting-started/)\
    \ and select Download Source. This source package contains both compiled and raw\
    \ .less files.\n\nThe Less files are located inside the folder called `less`.\
    \ Here, you will find many `.less` files named as per Bootstrap's components.\
    \ All the CSS properties and values related to a particular component are present\
    \ inside the corresponding `.less` file. You will also find a file named `bootstrap.less`,\
    \ which is the main `.less` file. It imports all the `.less` files present inside\
    \ that folder. You need to compile only this file to generate a customized Bootstrap\
    \ stylesheet. Let's categorize all the files inside this folder.\n\n#### Bootstrap's\
    \ Variables and the Mixins\n\nAll variables and mixins used in Bootstrap are present\
    \ inside two distinct files:\n\n1.  `variables.less` contains all standard colors\
    \ used in Bootstrap, default responsive width values, default padding values,\
    \ and margin values. If you want to make any such changes you need to deal with\
    \ this file.\n2.  `mixins.less` contains mixins to generate vendor prefixes and\
    \ dynamically calculate widths of grids, placeholders, button sizes, and so on.\n\
    \n#### Reset Files\n\nThere are two reset files to clear browser defaults:\n\n\
    1.  `normalize.less` clears many browser defaults like font family, font sizes,\
    \ paddings and margins, heading tags defaults, styles of form elements, and so\
    \ on.\n2.  `print.less` contains media queries for print support.\n\n#### Core\
    \ Files\n\nThere are seven core .less files:\n\n*   `scaffolding.less` contains\
    \ all the helper classes for images (such as `.img-responsive` and `.img-circle`),\
    \ styles for various states of link elements, horizontal rules, styles for screen\
    \ readers, and so on.\n*   `type.less` is a typography file that contains various\
    \ styling for heading tags, paragraph tags, and other content-related helper classes\
    \ such as `.lead`, `.text-muted`, and so forth.\n*   `code.less` contains CSS\
    \ properties for styling any code presented on the web page.\n*   `grid.less`\
    \ is concerned with all the CSS values applied on the Bootstrap grid system.\n\
    *   `tables.less` has styles for decorating the `<table>` element. It also defines\
    \ various helper classes for tables as `.table-condensed`, `.table-bordered`,\
    \ and so on.\n*   `forms.less` beautifies form elements such as text fields, legends,\
    \ checkboxes, radio buttons, and so forth.\n*   `buttons.less` contains styles\
    \ for styling various types of Bootstrap buttons. All the button-related classes\
    \ are defined here.\n\n#### Component Files\n\nThere are 21 component files in\
    \ Bootstrap. Each component covered in the previous chapter has its own .less\
    \ file. All the CSS definitions related to a component can be found in its .less\
    \ file.\n\n*   `component-animations.less`\n*   `glyphicons.less`\n*   `dropdowns.less`\n\
    *   `button-groups.less`\n*   `input-groups.less`\n*   `navs.less`\n*   `navbar.less`\n\
    *   `breadcrumbs.less`\n*   `pagination.less`\n*   `pager.less`\n*   `labels.less`\n\
    *   `badges.less`\n*   `jumbotron.less`\n*   `thumbnails.less`\n*   `alerts.less`\n\
    *   `progress-bars.less`\n*   `media.less`\n*   `list-group.less`\n*   `panels.less`\n\
    *   `wells.less`\n*   `close.less`\n"
