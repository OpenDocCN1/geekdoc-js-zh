- fmt: "\nIt’s worthwhile checking out real-life projects based on a technology before\
    \ adopting it. It can help to give a clear understanding of what can be achieved\
    \ using that particular technology. Here are some examples of real-life website\
    \ projects that have been created with the help of Bootstrap:\n\n* [OpenDesk](https://www.opendesk.cc/)\n\
    * [Riot Designs](http://riotdesign.eu/en/)\n* [20Jeans](https://www.20jeans.com/)\n\
    * [Red Antler](http://redantler.com/)\n* [Uberflip](www.uberflip.com)\n\n## Overview\
    \ of Responsive Web Design\n\n`Responsive web design` allows developers to create\
    \ a website that can change its layout on the go. Developers can then create a\
    \ single design that works on any kind of device: mobiles, tablets, smart TVs,\
    \ and PCs.\n\nSites designed responsively are generally fluid designs. They readjust\
    \ themselves according to the size of the screen they are viewed in and are also\
    \ compatible with the touch interfaces of mobile devices. Using responsive web\
    \ design, developers can create powerful web apps that replace native apps on\
    \ platforms such as iOS and Android.\n\n### Adjusting a Layout Based on Screen\
    \ Size\n\nLet’s check out an example to better understand this concept. Suppose\
    \ we have the layout shown in [Figure 1.3](#ch01.html_mywebsite \"Figure 1.3.\
    \ Our layout for a desktop screen\") for a desktop screen.\n\n![Our layout for\
    \ a desktop screen](figures/ch1Image8.png)\n\nFigure 1.3. Our layout for a desktop\
    \ screen\n\nWe have three main sections in our desktop layout: the header, the\
    \ content section, and the footer area. The header section contains a logo and\
    \ a rectangular ad. The content section contains four smaller posts placed side\
    \ by side horizontally. We then have two bigger posts placed underneath the smaller\
    \ posts. Finally, we have a footer section in which there is simple copyright\
    \ text.\n\nIt is obvious that weʼre unable to easily view this page on our tablets\
    \ and cell phones as it will fail to fit the screen properly. The design needs\
    \ to be customized for those users.\n\nLet’s suppose we have used Bootstrap to\
    \ create the desktop layout. We have used its grid system to create a responsive\
    \ design so that the layout will automatically adjust to suit tablets and mobile\
    \ devices.\n\nOn tablet devices, the layout will appear as shown in [Figure 1.4](#ch01.html_mywebsitetablet\
    \ \"Figure 1.4. Our layout adjusted for tablet screens\"). The ad has been hidden\
    \ from the header section and the logo has been centered. The layout fits perfectly.\n\
    \n![Our layout adjusted for tablet screens](figures/ch1Image9.png)\n\nFigure 1.4.\
    \ Our layout adjusted for tablet screens\n\nIn the smartphone view, shown in [Figure\
    \ 1.5](#ch01.html_mywebsitesmartphone \"Figure 1.5. Our layout adjusted for smartphones\"\
    ), we can see that the header section continues to follow the tablet view but\
    \ there’s a major change in the content section. The posts reflow themselves to\
    \ the bottom forming two rows, each containing two posts. The bigger posts are\
    \ now placed on top of each other—one post in one row (the second big post is\
    \ off the bottom of the screen).\n\n![Our layout adjusted for smartphones](figures/ch1Image10.png)\n\
    \nFigure 1.5. Our layout adjusted for smartphones\n\nThatʼs a very basic overview\
    \ of how a responsive design behaves. We can obviously do a lot more than what\
    \ is shown in the aforementioned example. We’ll learn more about responsive web\
    \ design while studying grid systems in [Chapter 2.](#ch02.html \"Chapter 2Bootstrap\
    \ Grid System\")\n\n## Getting Bootstrap Ready\n\nFinally we have arrived at the\
    \ most important topic in this chapter: getting our hands dirty with Bootstrap!\n\
    \nFirst we need the Bootstrap package, so let’s go to the official Bootstrap website\
    \ at [http://getbootstrap.com](http://getbootstrap.com) and download the latest\
    \ 3.x.x version. Extract the archive file and copy the following folders:\n\n\
    ```\n- /css\n- /fonts\n- /js\n```\n\nCreate a project folder with any name you\
    \ wish. I have named mine `Bootstrap_demos`. Paste the above folders into this\
    \ project folder.\n\nNow open up your favorite HTML editor (I personally recommend\
    \ [Sublime Text](http://www.sublimetext.com/)), create a new file called `index.html`,\
    \ and enter the following code snippet into it:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n  <head>\n    <title>My First Bootstrap Application</title>\n\
    \  </head>\n  <body>\n\n  </body>\n</html>\n```\n\nThis is a simple HTML structure\
    \ for our first Bootstrap app.\n\nOur project directory should now look like [Figure\
    \ 1.6](#ch01.html_beginningstructure \"Figure 1.6. Our initial project folder\
    \ structure\").\n\n![Our initial project folder structure](figures/ch1Image11.png)\n\
    \nFigure 1.6. Our initial project folder structure\n\nNow letʼs include Bootstrap\
    \ inside our HTML file. First, we need to include Bootstrap’s CSS file. Open up\
    \ the `/css` folder and you should see a file named `bootstrap.css`. This is Bootstrap’s\
    \ main CSS file.\n\n### Note: What's bootstrap.min.css?\n\nThere’s also another\
    \ file named `bootstrap.min.css`, which is the `minified` version of `bootstrap.css`.\
    \ It is called minified because it has no spaces and no comments, which reduces\
    \ the size of the file. It will be used when your project is completed and is\
    \ ready for production.\n\nLet’s link our CSS file into `index.html`. Place the\
    \ following inside the `<head>` tag and below the `<title>` tag:\n\n```html\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n```\n\n\
    Bootstrap requires jQuery for its JavaScript components to work. Go to [jquery.com](http://jquery.com/)\
    \ and download jQuery version 1.11.0. Bootstrap supports Internet Explorer 8 and\
    \ above. If you download jQuery version 2, IE8+ will fail to function properly\
    \ because jQuery has officially opted out of support for IE8 in versions 2 and\
    \ above. Hence, jQuery 1.11.0 is needed, the latest version of jQuery 1.\n\nAfter\
    \ you have downloaded the `jquery.js` file, paste it into the `/js` folder of\
    \ your project directory. Next, we’ll link it into our `index.html` using the\
    \ following code:\n\n```html\n<script src=\"js/jquery.js\"></script>\n```\n\n\
    It is recommended that you insert jQuery just inside the `<body>` tag instead\
    \ of the `<head>` tag. This is so that jQuery is loaded after all the HTML contents\
    \ are loaded, reducing the page’s loading time.\n\nNow we have to include Bootstrap’s\
    \ JavaScript file:\n\n```html\n<script src=\"js/bootstrap.js\"></script>\n```\n\
    \n`index.html` should now look like this:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n  <head>\n    <title>My First Bootstrap Application</title>\n    <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n  </head>\n\
    \  <body>\n\n        <script src=\"js/jquery.js\"></script>\n        <script src=\"\
    js/bootstrap.js\"></script>\n  </body>\n</html>\n```\n\nIn order to make Bootstrap\
    \ completely compatible with every kind of device, we need to include some necessary\
    \ meta tags.\n\nFirst, we should tell browsers that our website contains characters\
    \ from the Unicode character set, a superset of the ASCII character set. This\
    \ is done using the following meta tag:\n\n```html\n<meta charset=\"utf-8\">\n\
    ```\n\nSometimes, Internet Explorer may run in `compatibility mode`. Using the\
    \ following code snippet would force IE to use the latest rendering engine to\
    \ render our website. This will prevent our website from breaking as older rendering\
    \ engines do not support all properties of CSS:\n\n```html\n<meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n```\n\nNext, we’ll make our site consume\
    \ all the space available inside the browser window, whether it’s a tablet or\
    \ a mobile or even a desktop screen. We tell the browser to scale our application\
    \ to the size of window space available:\n\n```html\n<meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1\">\n```\n\n`initial-scale=1` in the code means\
    \ scale it to 100%.\n\nNow our `index.html` should look like this:\n"
