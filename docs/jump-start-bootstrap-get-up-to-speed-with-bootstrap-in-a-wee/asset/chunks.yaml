    \n# JUMP START BOOTSTRAP\n\n### BY SYED FAZLE RAHMAN\n\n# Jump Start Bootstrap\n\
    \nby Syed Fazle Rahman\n\nCopyright © 2014 SitePoint Pty. Ltd.\n\nProduct Manager:\
    \ Simon Mackie\nTechnical Editor: Ivaylo Gerchev\nEnglish Editor: Kelly Steele\n\
