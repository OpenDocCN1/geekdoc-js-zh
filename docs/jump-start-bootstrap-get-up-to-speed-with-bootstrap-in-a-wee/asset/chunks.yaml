    ```\n\nLet's create a four-column design using Bootstrap's grid system. We'll\
    \ place an image in each column and then apply thumbnail markup to each one.\n\
    \nAs seen in the [previous chapter](#ch01.html \"Chapter 1Up, Close, and Personal\
    \ with Bootstrap\"), we'll use the class `col-xs-3` to create a four- column design:\n\
    \n```\n<div class=\"row\">\n    <div class=\"col-xs-3\">\n        <a href=\"#\"\
    \ class=\"thumbnail\">\n            <img src=\"path/to/image\">\n        </a>\n\
    \    </div>\n    <div class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\"\
    >\n            <img src=\"path/to/image\">\n        </a>\n    </div>\n    <div\
    \ class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\">\n          \
    \  <img src=\"path/to/image\">\n        </a>\n    </div>\n    <div class=\"col-xs-3\"\
    >\n        <a href=\"#\" class=\"thumbnail\">\n            <img src=\"path/to/image\"\
    >\n        </a>\n    </div>\n</div>\n```\n\nThis produces the result shown in\
    \ [Figure 3.7](#ch03.html_thumbs \"Figure 3.7. Thumbnails\").\n\n![Thumbnails](figures/ch3Image7.png)\n\
    \nFigure 3.7. Thumbnails\n\nTry hovering your mouse icon over each image and you\
    \ should get a nice highlighted effect. In the aforementioned code, you can see\
    \ that I have applied the class `thumbnail` to an anchor tag `<a>`. You can also\
    \ use a `<div>` tag instead of an anchor to represent a thumbnail.\n\nLet's give\
    \ a caption to each thumbnail. We just need to add an extra div with class `caption`\
    \  just below the `<img>` tag. Our snippet for a thumbnail with a caption should\
    \ be:\n\n```\n<a href=\"#\" class=\"thumbnail\">\n    <img src=\"path/to/image\"\
    >\n    <div class=\"caption\">\n        <h3>Caption Goes Here!</h3>\n    </div>\n\
    </a>\n```\n\nIf you apply a caption to each thumbnail on the page, it will produce\
    \ a similar result to [Figure 3.8](#ch03.html_thumbscaptions \"Figure 3.8. Thumbnails\
    \ with captions\").\n\n![Thumbnails with captions](figures/ch3Image8.png)\n\n\
    Figure 3.8. Thumbnails with captions\n\nYou can also add some excerpts to each\
    \ thumbnail and a Read More button for linking to different pages in your website.\
    \ For this we need to first replace the link element with the class `thumbnail`\
    \ with a `div` element. Then we add an excerpt using `<p>` inside the “`caption`”\
    \ `div` and a link with a `“Read More`” anchor and classes `btn` and `btn-primary`\
    \ inside the same `“caption`” `div`. After making these changes, our final markup\
    \ for a post thumbnail will be as follows:\n\n```\n<div class=\"thumbnail\">\n\
    \    <img src=\"images/microsoft.png\">\n    <div class=\"caption\">\n       \
    \ <h3>Microsoft</h3>\n        <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n\
    \        <p><a href=\"#\" class=\"btn btn-primary\">Read More</a></p>\n    </div>\n\
    </div>\n```\n\nThe above code will produce a result similar to [Figure 3.9](#ch03.html_readmore\
    \ \"Figure 3.9. Captions with \"Read More\" links\").\n\n![Captions with \"Read\
    \ More\" links](figures/ch3Image9.png)\n\nFigure 3.9. Captions with \"Read More\"\
    \ links\n\n### List Group\n\n**List group** is a useful component for creating\
    \ lists, such as a list of useful resources or a list of recent activities. You\
    \ can also use it for a complex list of large amounts of textual content.\n\n\
    The markup for creating a list group is as follows, with the result shown directly\
    \ below in [Figure 3.10](#ch03.html_listgroup \"Figure 3.10. A list group\"):\n\
    \n```\n<ul class=\"list-group\">\n    <li class=\"list-group-item\">Inbox</li>\n\
    \    <li class=\"list-group-item\">Sent</li>\n    <li class=\"list-group-item\"\
    >Drafts</li>\n    <li class=\"list-group-item\">Deleted</li>\n    <li class=\"\
    list-group-item\">Spam</li>\n</ul>\n```\n\n![A list group](figures/ch3Image10.png)\n\
    \nFigure 3.10. A list group\n\nYou need to add the class `list-group` to a `ul`\
    \ element or a `div` element to make its children appear as a list. The children\
    \ can be `li` elements or `a` elements, depending on your parent element choice.\
    \ The child should always have the class `list-group-item`.\n\n### Tip: Lists\
    \ of Links\n\nWhen you want to display a list of links, you should use the anchor\
    \ element `a` instead of list elements `li` (that also means using a parent `div`,\
    \ instead of a `ul`).\n\nWe can also display a number (such as those used to indicate\
    \ pending notifications) beside each list item using the badge component. We'll\
    \ learn more about badges later in this chapter, but for now you can add the following\
    \ snippet inside each `“list-group-item`” to display a number beside each one:\n\
    \n```\n<span class=\"badge\">14</span>\n```\n\nSo our updated list group will\
    \ now look like [Figure 3.11](#ch03.html_updatedlist \"Figure 3.11. Updated list\
    \ group\").\n\n![Updated list group](figures/ch3Image11.png)\n\nFigure 3.11. Updated\
    \ list group\n\nAs you can see, the badges beautifully align themselves to the\
    \ right of each list item.\n\nWe can also apply various colors to each list item\
    \ by adding `list-group-item-*` classes along with `list-group-item`. They are\
    \ as follows:\n\n*   `list-group-item-success` for green\n\n*   `list-group-item-info`\
    \ for sky blue\n\n*   `list-group-item-warning` for pale yellow\n\n*   `list-group-item-danger`\
    \ for light red\n\nFor example, adding `list-group-item-success` to the `list-group-item`\
    \ class in the following list will give it a light green background color:\n\n\
    ```\n<li class=\"list-group-item list-group-item-success\">Inbox</li>\n```\n\n\
    We can do more with list groups than just construct straightforward lists, though.\
    \ If you want to create a list in which each list item contains some textual content\
    \ along with a heading, you could use the following markup:\n\n```\n<a href=\"\
    #\" class=\"list-group-item\">\n    <h4 class=\"list-group-item-heading\">Item\
    \ heading</h4>\n    <p class=\"list-group-item-text\">Lorem ipsum dolor sit ...</p>\n\
    </a>\n```\n\nInstead of just text, we are now placing a set of `h4` and `p` elements\
    \ in each `list-group-item` element. We're using the classes l`ist-group-item-heading`\
    \ and `list-group-item-text` for `h4` and `p` elements respectively to display\
    \ them appropriately, seen in [Figure 3.12](#ch03.html_listgrouptext \"Figure 3.12. A\
    \ list group with text\").\n\n![A list group with text](figures/ch3Image12.png)\n\
    \nFigure 3.12. A list group with text\n\nYou can also highlight any element in\
    \ the list using an additional class `active`. Here, I have highlighted the first\
    \ element.\n\n## Navigation Components\n\nFeatures such as navigation bars and\
    \ breadcrumbs have become an essential part of many websites. Bootstrap comes\
    \ with many components built in to help build such features. Let's proceed and\
    \ create our first navigation component.\n\n### Navs"
