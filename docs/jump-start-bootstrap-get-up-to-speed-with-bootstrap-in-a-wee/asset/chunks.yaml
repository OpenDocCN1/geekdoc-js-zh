    \ assisted in displaying the image properly, it hasn't actually reduced the file\
    \ size of the image. Unfortunately, Bootstrap lacks the tools to fix this issue.\n\
    \nThere are several server-side tools that can identify the request type of a\
    \ particular image and then resize the image before serving it. Some of the tools\
    \ I've been using are [Adaptive Images](http://adaptive-images.com/) and [TimThumb,](http://www.binarymoon.co.uk/projects/timthumb/)\
    \ but I won't be covering them in this book as they are server-side tools. Installation\
    \ and usage instructions are available on their official websites.\n\n## Avoiding\
    \ Common Pitfalls\n\nBy now, you'll understand that Bootstrap is one of the best\
    \ frameworks for building responsive websites. With Bootstrap, there's no need\
    \ to develop a separate mobile version of your site. A single responsive version\
    \ can be viewed on any kind of device.\n\nYet there are a few common pitfalls\
    \ that Bootstrap developers often fall into while developing responsive websites.\
    \ These issues can make your websites slow and non-responsive in smaller devices,\
    \ so be aware of them:\n\n*   **Using different HTML markup for specific devices**:\
    \ New developers often take advantage of Bootstrap's responsive utility features\
    \ such as `hidden-sm` and `visible-sm` to toggle the display of various components\
    \ on a website. They write different versions of the HTML markup in one document\
    \ and then use these helper classes to toggle the component display as per the\
    \ browser window size. By doing this they forget that the overall size of the\
    \ HTML page is increasing, which will slow down the rendering process. Hence,\
    \ it is advisable to use Bootstrap's grid system to dynamically resize the same\
    \ HTML markup in browsers of all sizes.\n\n*   **Using Bootstrap in applications\
    \ that target IE8 and below:** I have seen larger organizations that still target\
    \ compatibility with Internet Explorer version 8 and below. Though Bootstrap does\
    \ provide support for IE8, there are some CSS3 properties that will fail to work\
    \ in it such as `border-radius` and `box-shadows`. Therefore it is advisable to\
    \ avoid using Bootstrap if your target audience is IE8 and lower. In fact, you\
    \ definitely should not use Bootstrap 3 in applications that target audiences\
    \ with IE7 and below.\n\n*   **Using Bootstrap to make hybrid mobile applications**:\
    \ You should avoid using Bootstrap to create hybrid applications that are developed\
    \ using web-based technologies and then ported into mobile platforms. Bootstrap\
    \ can be too heavy for such applications. You can instead use the [Ratchet framework,](http://goratchet.com)\
    \ which is developed especially for creating mobile applications. Ratchet comes\
    \ from the same Bootstrap team, and you can [learn more about it on SitePoint.](http://www.sitepoint.com/prototype-mobile-apps-easily-ratchet/)\n\
    \nThe Bootstrap team keeps on releasing newer versions by fixing known problems\
    \ and adding new features. You can also check out Bootstrap's official issues\
    \ page to keep track of [current known issues with Bootstrap 3.](https://github.com/twbs/bootstrap/issues)\n\
    \n## Where to Go From Here\n\nAs the saying goes, “practice makes perfect.” The\
    \ more you practice with Bootstrap, the better control you have on your designs.\
    \ One way to practice is to try to recreate the designs of popular responsive\
    \ websites using Bootstrap. Here's a list of websites you can take inspiration\
    \ from:\n\n*   [Hudson's Bay Company](http://www3.hbc.com/)\n\n*   [Dribbble](http://dribbble.com/)\n\
    \n*   [Google+](http://plus.google.com)\n\n*   [Pinterest](http://www.pinterest.com)\n\
    \n*   [Zurb](http://www.zurb.com)\n\n*   [Sony](http://www.sony.com)\n\n*   [Microsoft](http://www.microsoft.com)\n\
    \n*   [Bootstrap](http://getbootstrap.com)\n\nWe've taken a look at some built-in\
    \ Bootstrap plugins in this book, but it's also worth investigating some of the\
    \ third-party Bootstrap plugins that are available as they can add powerful features\
    \ to your sites. Here's a selection of the most popular:\n\n*   [FuelUX](https://github.com/ExactTarget/fuelux/tree/3.0.0-wip)\
    \ adds various popular features such as datepicker, checkbox, combobox, loader,\
    \ pill box, and tree.\n\n*   [Jasny Bootstrap](http://jasny.github.io/bootstrap/)\
    \ brings in some important features that were not available in Bootstrap 3\\.\
    \ For example, off canvas (a slide-out menu from either side of the screen like\
    \ in apps for mobile devices), row link (converting table rows into clickable\
    \ links), input mask (forcing user to enter data in a specific format), and file\
    \ input (a stylish file input field).\n\n*   [Bootstrap Lightbox](http://www.jasonbutz.info/bootstrap-lightbox/)\
    \ adds an image lightbox feature to Bootstrap.\n\n*   [Bootstrap Image Gallery](http://blueimp.github.io/Bootstrap-Image-Gallery/))\
    \ comes with a fully functional, ready-to-use image gallery for Bootstrap.\n\n\
    *   [Bootstrap Notifications](http://goodybag.github.io/bootstrap-notify/) gives\
    \ the capability to display fancy notifications anywhere on the screen.\n\n* \
    \  [Bootstrap Markdown](http://toopay.github.io/bootstrap-markdown/) provides\
    \ markdown editing tools in Bootstrap.\n\n*   [Bootstrap Colorpicker](http://www.eyecon.ro/bootstrap-colorpicker/)\
    \ adds a color-picker widget.\n\n*   [Bootstrap Star Rating](http://plugins.krajee.com/star-rating)\
    \ provides star rating tools.\n\nYou should try out Bootstrap in your upcoming\
    \ projects to get a feel for the rapid development environment that it promises.\
    \ You can also follow the Bootstrap tutorials on SitePoint to explore more. Keep\
    \ Bootstrapping!"
