    \ the `media-body` div should have two further components: the title and the textual\
    \ content. The title can be given using an `h4` element with a `media-heading`\
    \ class and the textual content is represented using a `p` element.\n\nThat's\
    \ it! Go ahead and view it in the browser; it should look like [Figure 3.5](#ch03.html_mediaobject\
    \ \"Figure 3.5. A media object\").\n\n![A media object](figures/ch3Image5.png)\n\
    \nFigure 3.5. A media object\n\nTo create a nested comments design, we can place\
