    \ are rectangular in shape, whereas badges are more rounded. Badges are mostly\
    \ used to display numbers such as unread items, notifications, and so on, rather\
    \ than text.\n\nBadges are **self-collapsing** components, which means when there's\
    \ no content inside the badge it will not be visible on the website.\n\nThe markup\
    \ for a badge component looks like this:\n\n```\n<span class=\"badge\">23</span>\n\
    ```\n\nA more custom usage of a badge is:\n\n```\n<a href=\"#\" class=\"btn btn-primary\
    \ btn-lg\">Inbox \n↵<span class=\"badge\">23</span></a>\n```\n\nAnd you can see\
    \ the output in [Figure 3.25](#ch03.html_basebadges \"Figure 3.25. Badges\").\n\
    \n![Badges](figures/ch3Image25.png)\n\nFigure 3.25. Badges\n\nThat ends our discussion\
    \ on the stand out components of Bootstrap. Though these components are not essential\
    \ to create great responsive websites, they definitely provide additional value\
    \ for your visitors. Let's now check out how creating forms has become even easier\
    \ in Bootstrap.\n\n## Fun with Forms\n\nForms are a very important part of our\
    \ websites. They are used in the registration and login pages, contact and feedback\
    \ pages, search boxes, and many other places.\n\nBootstrap allows you to create\
    \ various types of forms within minutes. You can also use many of HTML5's form\
    \ validation attributes that are well supported by Bootstrap. So let's build our\
    \ first basic form.\n\n### Basic Form"
