    \ itself, `close.less`. It contains the CSS rules for the dismiss button used\
    \ in modals, alerts, and other elements to close this particular component.\n\n\
    #### Plugin Files\n\nThere are four .less files that define the CSS styles of\
    \ JavaScript plugins triggered or created using Bootstrap's markup:\n\n*   modals.less\n\
    \n*   tooltip.less\n\n*   popovers.less\n\n*   carousel.less\n\n#### Utility Files\n\
    \nFinally, we have two utility files in Bootstrap:\n\n*   utilities.less\n\n*\
    \   responsive-utilities.less\n\nThese files define classes that help us to better\
    \ organize the Bootstrap components. They have helpful classes such as `.clearfix`\
    \ to clear a component from all the elements present around it, and `.hide` and\
    \ `.show` to toggle visibility of components, for example. responsive-utilities.less\
    \ contains visibility utilities such as `.visible-lg` and `.hidden-sm`.\n\n###\
    \ Overriding Styles Using Less\n\nLet's use Less to override the style of a modal.\
    \ We will customize `modals.less` to apply a flat (metro-style) design, remove\
    \ the rounded corners, and reduce the shadow applied to it. We will also change\
    \ the background color and text color of the modal. Let's open modals.less and\
    \ make these changes.\n\nThe rounded corners to the modal are applied through\
    \ the class `modal-content`. Let's find this selector in modals.less. It should\
    \ look like this:\n\n```\n// Actual modal\n.modal-content {\n  position: relative;\n\
    \  background-color: @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    \  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\nFrom the code, we can see the rounded corners come from\
    \ the property `border-radius` whose value is a Less variable initialized in variables.less.\
    \ Let's comment out this line to remove rounded corners:\n\n```\n// Actual modal\n\
    .modal-content {\n  position: relative;\n  background-color: @modal-content-bg;\n\
    \  border: 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback\
    \ (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n//  border-radius:\
    \ @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip:\
    \ padding-box;\n  // Remove focus outline from opened modal\n  outline: 0;\n}\n\
    ```\n\nNow, we have to reduce the amount of shadow. Analyzing the code, we can\
    \ see that the `.box-shdow()` mixin is responsible for producing the shadow property\
    \ in CSS. This mixin is defined in the mixins.less file, and the shadow values\
    \ are passed as a value to this mixin. Let's change this value as per our requirement.\
    \ The amount of shadow is defined by the third number in the value, which is passed\
    \ as the argument―it's 9px currently. Let's reduce this number to 2px. Hence,\
    \ our selector should now look like this:\n\n```\n// Actual modal\n.modal-content\
    \ {\n  position: relative;\n  background-color: @modal-content-bg;\n  border:\
    \ 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8\
    \ etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
    \  .box-shadow(0 3px 2px rgba(0,0,0,.5));\n  background-clip: padding-box;\n \
    \ // Remove focus outline from opened modal\n  outline: 0;\n}\n```\n\nWe also\
    \ need to change the `box-shadow` value in one of the media queries, which overrides\
    \ the previous changes. We'll learn about media queries soon. But for now, you\
    \ need to understand that Bootstrap has different CSS rules for devices of unique\
    \ sizes. So let's go ahead and find the following media query in modals.less:\n\
    \n```\n// Scale up the modal\n@media (min-width: @screen-sm-min) {\n  // Automatically\
    \ set modal's width for larger viewports\n  .modal-dialog {\n    width: @modal-md;\n\
    \    margin: 30px auto;\n  }\n  .modal-content {\n    .box-shadow(0 5px 15px rgba(0,0,0,.5));\n\
    \  }\n\n  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\nLet's pass\
    \ the new `box-shadow` value to the `.box-shadow()` mixin in this media query:\n\
    \n```\n// Scale up the modal\n@media (min-width: @screen-sm-min) {\n  // Automatically\
    \ set modal's width for larger viewports\n  .modal-dialog {\n    width: @modal-md;\n\
    \    margin: 30px auto;\n  }\n  .modal-content {\n    .box-shadow(0 5px 2px rgba(0,0,0,.5));\n\
    \  }\n\n  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\nLet's now\
    \ change the modal's background color. We'll use a predefined variable `@brand-info`\
    \ from variables.less as the background color of the modal. This variable is initialized\
    \ to `#5bc0de`, which is a light blue color. For the text color, let's use the\
    \ variable `@body-bg`, which is set to `#fff` in the same file. The modified `modal-content`\
    \ selector should now look like:\n\n```\n// Actual modal\n.modal-content {\n \
    \ position: relative;\n  background-color: @modal-content-bg;\n  border: 1px solid\
    \ @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8 etc)\n\
    \  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
    \  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip: padding-box;\n \
    \ // Remove focus outline from opened modal\n  outline: 0;\n\n  background: @brand-info;\n\
    \  color: @body-bg;\n\n}\n```\n\nWe have made all the customizations planned,\
    \ but let's make one final change to the `modal-backdrop` selector. `modal-backdrop`\
    \ is a transparent layer that appears behind the `modal-content` whenever the\
    \ modal component is triggered.\n\nLet's change the background color of this `modal-background`\
    \ from black to white:\n\n```\n// Modal background\n.modal-backdrop {\n  position:\
    \ fixed;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index: @zindex-modal-background;\n\
    \  background-color: @body-bg;\n  // Fade for backdrop\n  &.fade { .opacity(0);\
    \ }\n  &.in { .opacity(@modal-backdrop-opacity); }\n}\n```\n\nFinally, we are\
    \ done with all the customization. It's time to compile the bootstrap.less file\
    \ that imports modals.less. Once the .less file is compiled to generate bootstrap.css,\
    \ you can use this file in your project by replacing the old bootstrap.css (we\
    \ will discuss how to compile a Less file in the following section). Henceforth,\
    \ whenever you use the modal component it will use the customized style. In [Figure 5.4](#ch05.html_custommodal\
    \ \"Figure 5.4. Modal customized with Less\") is a screenshot showing the customized\
    \ modal component.\n\n![Modal customized with Less](figures/ch5less-demo-8.png)\n\
    \nFigure 5.4. Modal customized with Less\n\n### Compiling Less\n\nCompiling Less\
    \ is relatively straightforward. Here, I am going to show you some of the standard\
    \ ways of doing it.\n\n#### Using Node\n\nIf you have Node installed, you can\
    \ use Node's package manager to install the `less` compiler:\n\n```\n$ npm install\
    \ -g less\n```\n\nOnce `less` is installed, use the following command to compile\
    \ bootstrap.less into bootstrap.css. You have to navigate to the /less folder\
    \ using the command prompt and then type this command:\n\n```\n$ lessc bootstrap.less\
    \ > bootstrap.css\n```\n\n#### Using Third-party Software\n\nThere are plenty\
    \ of GUI applications for writing and compiling Less code. Some of the popular\
    \ options include [Crunch!](http://crunchapp.net/), [SimpLESS,](http://wearekiss.com/simpless)\
    \ and [Mixture.](http://mixture.io/)\n\n## Customizing Bootstrap before Downloading\n\
    \nYes, you heard right. Bootstrap allows you to edit and select the features you\
    \ want that should be present inside your own [custom Bootstrap package.](http://getbootstrap.com/customize)\n\
    \nIt has a field beside each Less variable, so if you don't know how to use Less\
    \ you can use this form to edit the default values. It also has a checkbox alongside\
    \ each Bootstrap component and plugin. You can uncheck any that you don't want\
    \ to use, as shown in [Figure 5.5](#ch05.html_customdownload \"Figure 5.5. Customizing\
    \ the Bootstrap package\").\n\n![Customizing the Bootstrap package](figures/ch5Image4.png)\n\
    \nFigure 5.5. Customizing the Bootstrap package"
