  trans: "\n\n弹出窗（Popovers）还带有与工具提示（tooltip）插件非常类似的自定义事件。与弹出窗相关的事件有：\n\n1. `show.bs.popover`：在显示弹出窗之前触发\n\
    2. `shown.bs.popover`：在弹出窗显示后触发\n3. `hide.bs.popover`：在隐藏弹出窗之前触发\n4. `hidden.bs.popover`：在隐藏弹出窗后触发\n\
    \n用法与工具提示插件类似：\n\n```javascript\n$('.popoverButton').on('show.bs.popover', function\
    \ () {\n    console.log(\"Opening popover..\");\n});\n\n$('.popoverButton').on('shown.bs.popover',\
    \ function () {\n    console.log(\"Popover opened.\");\n});\n\n$('.popoverButton').on('hide.bs.popover',\
    \ function () {\n    console.log(\"Hiding popover..\");\n});\n\n$('.popoverButton').on('hidden.bs.popover',\
    \ function () {\n    console.log(\"Popover hidden.\");\n});\n```\n\n## 更加华丽 (Getting\
    \ Fancy)\n\n在本节中，我们将讨论两个非常重要的插件：`carousel` 和 `modal`。\n\nCarousel 是一个响应式幻灯片插件，而\
    \ modal 是一个类似于灯箱的插件。每一个插件都能让你以华丽的方式展示你的内容。\n\n### 轮播图 (Carousel)\n\n幻灯片非常流行，可以用于新闻、电子商务和视频分享网站等。这种功能用于以组织良好、具有吸引力的幻灯片展示网站上最热门的项目。然而，构建此类幻灯片可能非常耗时，而且这些功能也容易出现\
    \ Bug。在本节中，我们将学习如何使用 Bootstrap 的 `carousel` 插件来构建漂亮的响应式幻灯片。\n\n创建轮播图的标记如下：\n\n\
    ```html\n<div id=\"bestCarsCarousel\" class=\"carousel slide\" data-ride=\"carousel\"\
    >\n    <!-- 指器 -->\n    <ol class=\"carousel-indicators\">\n        <li data-target=\"\
    #bestCarsCarousel\" data-slide-to=\"0\" class=\"active\"></li>\n        <li data-target=\"\
    #bestCarsCarousel\" data-slide-to=\"1\"></li>\n        <li data-target=\"#bestCarsCarousel\"\
    \ data-slide-to=\"2\"></li>\n    </ol>\n    <!-- 幻片容器 -->\n    <div class=\"carousel-inner\"\
    >\n        <div class=\"item active\">\n            <img src=\"images/car1.jpg\"\
    >\n            <div class=\"carousel-caption\">\n                <h3>Car 1</h3>\n\
    \                <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n        \
    \    </div>\n        </div>\n        <div class=\"item\">\n            <img src=\"\
    images/car2.jpg\">\n            <div class=\"carousel-caption\">\n           \
    \     <h3>Car 2</h3>\n                <p>Lorem ipsum dolor sit amet, consectetur\
    \ ...</p>\n            </div>\n        </div>\n        <div class=\"item\">\n\
    \            <img src=\"images/car3.jpg\">\n            <div class=\"carousel-caption\"\
    >\n                <h3>Car 3</h3>\n                <p>Lorem ipsum dolor sit amet,\
    \ consectetur ...</p>\n            </div>\n        </div>\n    </div>\n    <!--\
    \ 控制器 -->\n    <a class=\"left carousel-control\" href=\"#bestCarsCarousel\" data-slide=\"\
    prev\">\n        <span class=\"glyphicon glyphicon-chevron-left\"></span>\n  \
    \  </a>\n    <a class=\"right carousel-control\" href=\"#bestCarsCarousel\" data-slide=\"\
    next\">\n        <span class=\"glyphicon glyphicon-chevron-right\"></span>\n \
    \   </a>\n</div>\n```\n\n如代码所示，我们轮播图的主包装容器应该具有 `carousel` 和 `slide` 类。`slide`\
    \ 类用于为轮播图中的每张幻片提供滑动效果。它还应该有一个自定义属性 `data-ride`，该属性告诉 Bootstrap 在页面加载时立即开始滑动效果。如果没有此属性，在您手动进行第一次切换之前，幻片将不会自动更改。\n\
    \n每个轮播图插件包含三个子部分：指示器（indicators）、主体（body）和控制器（controls）。\n\n要创建一个轮播图指示器（Indicator），你必须定义一个类为\
    \ `carousel-indicators` 的有序列表。`li` 元素的数量取决于你想拥有的幻片数量。每个 `li` 元素都应该有一个 `data-target`\
    \ 属性，其中包含轮播图容器的 ID。它还应该有一个 `data-slide-to` 属性，其中包含它指向的特定幻片的序列号。\n\n接下来，我们构建轮播图的核心——幻片（slides）。首先，我们为所有幻片创建一个包装元素。这将一个类为\
    \ `carousel-inner` 的 `div`。每张幻片由一个类为 `item` 的 `div` 元素定义。每个项目都必须有一张性图片和可选的文本数据。此图片将作为该特定幻片项目的背景。对于每张图片，我们可以添加相关的说明和一些额外的文本数据。这些说明被一个类为\
    \ `carousel-caption` 的 `div` 元素封装。可以使用任何 HTML 标题标签来插入说明：`<h1>`、`<h2>`、`<h3>` 等。对于相关文本，你可以使用\
    \ `<p>` 标签。\n\n对每张幻片重复相同的 `item` 标记。在您完成所有幻片的创建后，我们将构建一个用于导航轮播图内容的控制器部分（controls）。\n\
    \n轮播图控制器使用具有 `carousel-control` 类的 `<a>` 标签构建，其中 `href` 包含轮播图的 ID。`data-slide`\
    \ 属性可以是 `prev` 或 `next`。符号由 glyphicons 提供。\n\n### 使用 JavaScript 使用轮播图\n\nBootstrap\
    \ 提供了 `carousel()` 方法来通过 JavaScript 调用轮播图。你可以使用此方法传递自定义选项以更改默认行为。\n\n轮播图只有三个可用选项：`interval`、`pause`\
    \ 和 `wrap`。它们在代码中：\n\n```javascript\nvar options = {\n    interval: 7000,\n  \
    \  pause: 'hover',\n    wrap: true\n};\n\n$('#bestCarsCarousel').carousel(options);\n\
    ```\n\n`interval` 属性用于指定每张幻片之间的持续时间。`pause` 选项仅接受一个值 `hover`，它告诉 Bootstrap 在鼠标悬停时停止轮播图滑动。`wrap`\
    \ 选项接受布尔值来设置轮播图循环的开启或关闭。如果设置为 `true`，轮播图在显示最后后将开始滑动到第一张幻片。\n\n也可以传递给 `carousel()`\
    \ 方法的其他参数包括：\n\n1. `cycle`：启用轮播图的循环功能\n2. `pause`：通过 JavaScript 暂停幻灯片\n3. `number`：指定两张幻片之间的持续时间\n\
    4. `prev`：切换到上一张幻片\n5. `next`：切换到下一张幻片\n\n轮播图插件带有两个自定义事件：\n\n1. `slide.bs.carousel`：在幻片更改之前触发\n\
    2. `slid.bs.carousel`：在幻片更改后触发\n\n用法如下：\n\n```javascript\n$('#bestCarsCarousel').on('slide.bs.carousel',\
    \ function () {\n    console.log(\"Changing slide..\");\n});\n\n$('#bestCarsCarousel').on('slid.bs.carousel',\
    \ function () {\n    console.log(\"Slide changed.\");\n});\n```\n\n### 模态框 (Modals)\n\
    \n**模态框 (Modals)** 是网页中隐藏的 HTML 元素，在触发时从屏幕顶部向下滑动。它是用于显示对话提示（如警告和确认框）的最佳插件之一。你还可以使用它来展示更大版本的图片、显示长长的条款和条件列表，或者显示注册/登录表单。\n\
    \n"
- fmt: "\nWith Bootstrap 3, modals have become responsive. This means that they look\
    \ good and operate well even on smaller screens. Let's go ahead and create a modal:\n\
    \n```html\n<div class=\"modal fade\" id=\"myModal\">\n    <div class=\"modal-dialog\"\
    >\n        <div class=\"modal-content\">\n            <!-- Modal Header -->\n\
    \            <div class=\"modal-header\">\n                <button type=\"button\"\
    \ class=\"close\" data-dismiss=\"modal\">&times;</button>\n                <h4\
    \ class=\"modal-title\">Welcome Back!</h4>\n            </div>\n            <!--\
    \ Modal Body -->\n            <div class=\"modal-body\">\n                <h1>Hello\
    \ Readers!</h1>\n            </div>\n            <!-- Modal Footer -->\n     \
    \       <div class=\"modal-footer\">\n                <button type=\"button\"\
    \ class=\"btn btn-default\" data-dismiss=\"modal\">Close</button>\n          \
    \      <button type=\"button\" class=\"btn btn-primary\">Save changes</button>\n\
    \            </div>\n        </div>\n    </div>\n</div>\n```\n\nEvery modal should\
    \ have a container with the class `modal`. To give a fading effect to the modal\
    \ we need to add the class `fade` as well to the same container. Next, we define\
    \ a `div` element that has a class `modal-dialog`. This is responsible for controlling\
    \ the size of the modal. By default, it's resized as per the size of the screen.\
    \ Shortly we'll see how to change the size of the modal by adding some additional\
    \ classes to `modal-dialog`. Inside the modal dialog, we'll create a wrapper element\
    \ that wraps various subsections of a modal. This wrapper element should have\
    \ a class called `modal-content`.\n\nThe subsections to the modal are the header,\
    \ body and footer. The header and footer part are optional. To create a modal\
    \ header, you need a `div` element with class `modal-header`. Inside it you can\
    \ put a modal title and a modal dismiss icon. The modal title is given using an\
    \ `h4` element with class `modal-title`. The dismiss icon here is a multiplication\
    \ (x) symbol that is wrapped around a `button` element. This button should have\
    \ the class `close` so that it is aligned to the top-left corner of the modal\
    \ header. Adding a `data-dismiss` attribute enables the button to close the modal\
    \ when clicked.\n\nFor the body, we need a `div` with the class `modal-body`.\
    \ You can put almost any content inside this element. You can even use Bootstrap's\
    \ grid system to organize content properly inside it.\n\nFinally, for creating\
    \ a modal footer, we define a `div` element that has a class `modal-footer`. The\
    \ content inside a modal footer are right-aligned by default.\n\nIf you check\
    \ the previous modal code snippet inside a browser, you will find nothing; modals\
    \ are hidden in nature. You have to create a handle to trigger it:\n\n```html\n\
    <button class=\"btn btn-primary btn-lg\" data-toggle=\"modal\" data-target=\"\
    #myModal\">\n    Launch modal\n</button>\n```\n\nIn this code, I've used a button\
    \ component to trigger the modal. It should have a `data-target` attribute to\
    \ tell Bootstrap which modal to trigger as there can be multiple modals in a website.\
    \ We also need the `data-toggle` attribute defined to determine what to trigger\
    \ when clicked.\n\nNow we are all set to use our modal. Go ahead and click on\
    \ the button to see a modal fading within the browser, as depicted in [Figure\
    \ 4.19](#ch04.html_basemodal \"Figure 4.19. Our modal\").\n\n![Our modal](figures/ch4Image19.png)\n\
    \nFigure 4.19. Our modal\n\n### Note: Modal Placement\n\nThe modal markup has\
    \ to be placed in the top-level position in the document to prevent conflict with\
    \ other components. Yet there's no restriction when placing the modal handle.\
    \ It can be placed anywhere in the document.\n\nModals come in three widths: large,\
    \ default, and small. These can be really helpful for fitting the content properly\
    \ in the modal dialog.\n\nIf no additional class is provided to `modal-dialog`,\
    \ it will appear in the default width of 600p. To make the modal large or small,\
    \ you need to add one of these classes to the `modal-dialog` element:\n\n* `modal-lg`:\
    \ for a large modal of width 900px\n* `modal-sm`: for a small modal of width 300px\n\
    \n### Modals with JavaScript\n\nBootstrap provides the `modal()` method to trigger\
    \ a modal through JavaScript. This method also accepts an options object containing\
    \ various properties for customizing the default behavior of a modal:\n\n```javascript\n\
    var options = {\n    backdrop: true,\n    keyboard: false,\n    show: true,\n\
    \    remote: false\n}\n\n$(\"#myModal\").modal(options);\n```\n\nThe `backdrop`\
    \ propertiy accepts Boolean values or the string value `static`. When a modal\
    \ is launched, a dark transparent backdrop appears by default behind the modal\
    \ body. Setting this property to `true` makes the backdrop visible. Set it to\
    \ `false` and the backdrop disappears. When set to `static`, the modal won't close\
    \ when there's a click anywhere outside the modal body.\n\nThe `keyboard` property\
    \ is used to enable or disable escape key functionality from the keyboard. When\
    \ set to false, the `Esc` key won't close the modal.\n\nThe `show` property is\
    \ used to toggle the visibility of the modal through JavaScript. When set to `true`,\
    \ the modal will appear automatically without requiring a click on any handle\
    \ element.\n\nThe `a` element, which may be used as a modal handle element, can\
    \ comprise an attribute `href` containing a link. The Bootstrap modal has an option\
    \ to load this link inside its `modal-body` element when clicked on the handle.\
    \ This feature is turned off by default. If you want to use this feature and load\
    \ the link inside the `modal-body`, set the `remote` property to `true`.\n\nEvents\
    \ associated with Bootstrap modal include:\n\n1. `show.bs.modal`: fired just before\
    \ opening the modal\n2. `shown.bs.modal`: fired after the modal is open\n3. `hide.bs.modal`:\
    \ fired just before hiding the modal\n4. `hidden.bs.modal`: fired after the modal\
    \ is hidden\n5. `loaded.bs.modal`: fired after the remote content is loaded\n\n\
    Here's how they are used:\n\n```javascript\n$('#myModal').on('show.bs.modal',\
    \ function () {\n    console.log(\"Opening Modal..\");\n});\n\n$('#myModal').on('shown.bs.modal',\
    \ function () {\n    console.log(\"Modal opened.\");\n});\n\n$('#myModal').on('hide.bs.modal',\
    \ function () {\n    console.log(\"Hiding Modal..\");\n});\n\n$('#myModal').on('hidden.bs.modal',\
    \ function () {\n    console.log(\"Modal hidden.\");\n});\n```\n\n## Summary\n\
    \nThrough this chapter, we have learned how to use many of the popular Bootstrap\
    \ JavaScript plugins. We have also learned how to customize them by setting custom\
    \ `data-*` attributes and through JavaScript. When working with Bootstrap, you\
    \ should always make use of the built-in plugins whenever possible and avoid writing\
    \ custom plugins.\n\n# Chapter 5: Diving Deep: Customizing Bootstrap\n\nImagine\
    \ a Web where all the websites built with Bootstrap look and feel the same. Boring,\
    \ right? Fortunately, we have the power to change the default styles of any framework\
    \ we work with.\n\nMany of Bootstrap's components and plugins have their own default\
    \ styles. In order to give them a personal touch, you need to replace their CSS\
    \ rules and define your own.\n\nIn the [first chapter,](#ch01.html \"Chapter 1Up,\
    \ Close, and Personal with Bootstrap\") I shared with you some of the popular\
    \ websites built on Bootstrap. They have all customized Bootstrap's CSS to make\
    \ their templates look unique and beautiful.\n\nIn this chapter, we'll discuss\
    \ the various methods we can use to completely customize Bootstrap's default styles,\
    \ and analyze which method is more preferable and why. Finally, we will try to\
    \ understand how Bootstrap's CSS was written to make it a highly responsive framework.\n\
    \n## Customizing Bootstrap Stylesheets\n\nYou can customize Bootstrap in various\
    \ ways. In this section, we'll see customization through static CSS files and\
    \ through Less files.\n\n### Note: What's Less?\n"
