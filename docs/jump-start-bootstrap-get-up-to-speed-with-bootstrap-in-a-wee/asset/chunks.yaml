  trans: "\n\n`Navs`（导航）是一组内联排列的链接，用于导航。我们有选项可以让这组链接以标签页（tabs）或小按钮的形式出现，后者在 Bootstrap\
    \ 中被称为 `pills`（药丸状）。我们将首先学习如何创建类似标签的链接，然后继续创建类似药丸的链接。\n\n我们如下创建类似标签的导航链接：\n\n\
    ```\n<ul class=\"nav nav-tabs\">\n    <li class=\"active\"><a href=\"#\">About</a></li>\n\
    \    <li><a href=\"#\">Activity</a></li>\n    <li><a href=\"#\">Liked Pages</a></li>\n\
    </ul\n```\n\n这是它们外观的截图（图 3.13）。\n\n![标签式导航](img/ch3Image13.png)\n\n图 3.13. 标签式导航\n\
    \n`nav` 类是标签和药丸共有的。我们添加了 `nav-tabs` 类使我们的导航栏看起来像标签页。\n\n我们通过这种方式创建类似药丸的导航链接（并在\
    \ 图 3.14 中如所示）：\n\n```\n<ul class=\"nav nav-pills\">\n    <li class=\"active\"\
    ><a href=\"#\">About</a></li>\n    <li><a href=\"#\">Activity</a></li>\n    <li><a\
    \ href=\"#\">Liked Pages</a></li>\n</ul\n```\n\n![药丸式导航](img/ch3Image14-1.png)\n\
    \n图 3.14. 药丸式导航\n\n在这里，我们将 `nav-tabs` 类替换为 `nav-pills` 类，这使得相同的列表看起来像药丸状。\n\n\
    我们还可以通过给它附加额外的类 `nav-stacked` 来将这些药丸垂直堆叠：\n\n```\n<ul class=\"nav nav-pills nav-stacked\"\
    >\n    <li class=\"active\"><a href=\"#\">About</a></li>\n    <li><a href=\"#\"\
    >Activity</a></li>\n    <li><a href=\"#\">Liked Pages</a></li>\n</ul\n```\n\n\
    图 3.15 显示了一些垂直堆叠的药丸导航。\n\n![堆叠式药丸式导航](img/ch3Image14-2.png)\n\n图 3.15. 堆叠式药丸式导航\n\
    \n## 导航栏 (Navbar)\n\n`Navbar` 是 Bootstrap 最有趣的组件之一。初级开发者经常认为构建导航栏是网站开发中最令人畏畏的任务之一。它带来了许多挑战，例如确保与页眉（header）以及正文部分的正确对齐。在导航栏内正确对齐链接、搜索栏和下拉菜单会使工作变得更加。\n\
    \nBootstrap 让创建导航栏变得非常简单。它提供了各种选项来构建所有类型的响应式导航栏，这些导航栏在屏幕尺寸较小时会自动折叠。\n\n我们将首先介绍如何使用\
    \ Bootstrap 创建一个简单的导航栏，然后转向构建更复杂的导航栏。\n\n首先，我们将构建一个 `div` 元素，带有两个类：`navbar` 和\
    \ `navbar-default`。这些类对 Bootstrap 来说非常重要，因为它们标识了在何处应用导航栏的样式和效果：\n\n```\n<div class=\"\
    navbar navbar-default\">\n</div\n```\n\n接下来，我们在这个 `navbar` 元素内部使用带有类 `container-fluid`\
    \ 的 `div`。这将包裹导航栏的所有内容并在内部创建一个全宽容器：\n\n```\n<div class=\"navbar navbar-default\"\
    >\n    <div class=\"container-fluid\">\n\n    </div>\n</div\n```\n\n现在，让我们开始在导航栏内部插入其他元素。首先，我们将放置一个带有类\
    \ `navbar-header` 的 `div`。这将用于网站品牌，例如显示网站名称或 Logo。我们还会在 `navbar-header` 元素内部放置一个隐藏按钮，该按钮仅在导航栏折叠的较小屏幕上可见。此隐藏按钮稍后用于在小屏幕上展开折叠的菜单：\n\
    \n```\n<div class=\"navbar navbar-default\">\n    <div class=\"container-fluid\"\
    >\n        <div class=\"navbar-header\">\n          <button type=\"button\" class=\"\
    navbar-toggle\" \ndata-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n\
    \            <span class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"\
    ></span>\n            <span class=\"icon-bar\"></span>\n          </button>\n\
    \          <a class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n\
    \    </>\n</div\n```\n\n在代码中，我们放置了一个带有类 `navbar-toggle` 的按钮，Bootstrap 用它来激活导航栏的切换行为。它应该有两个自定义数据属性：`data-toggle`\
    \ 和 `data-target`。`data-toggle` 告诉脚本在点击按钮时做什么，而 `data-target` 告诉在点击时切换哪部分内容。在这里，`data-target`\
    \ 属性持有的是我们尚未定义的部分的 id。当点击按钮时，该部分将被切换。按钮内部的 `span` 元素用于显示图标。\n\n我们还定义了一个带有类 `navbar-brand`\
    \ 的 `a` 元素，它承载了我们网站的名称。此时，让我们看看代码在浏览器中渲染的结果，如 图 3.16 所示。\n\n![导航栏](img/ch3Image15.png)\n\
    \n图 3.16. 导航栏\n\n尝试缩小浏览器窗口。你应该看到在导航栏折叠的较小屏幕上显示隐藏按钮，如 图 3.17 所示。\n\n![导航栏显示](img/ch3Image16.png)\n\
    \n图 3.17. 导航栏显示\n\n接下来，我们将创建 `navbar-header` 的兄弟 `div`，它包含我们要放在导航栏内部的内容。我们将给这个元素两个类：`collapse`\
    \ 和 `navbar-collapse`。正如按钮的 `data-toggle` 属性所示，代码现在看起来如下：\n\n```\n<div class=\"\
    navbar navbar-default\">\n    <div class=\"container-fluid\">\n        <div class=\"\
    navbar-header\">\n          <button type=\"button\" class=\"navbar-toggle\" \n\
    data-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n            <span\
    \ class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"></span>\n \
    \           <span class=\"icon-bar\"></span>\n          </button>\n          <a\
    \ class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n\n        <div\
    \ class=\"collapse navbar-collapse\" id=\"mynavbar-content\">\n\n        </div>\n\
    \    </div>\n</div\n```\n\n现在让我们开始向 `navbar-collapse` 元素填充我们要放入导航栏的链接组。我们在这里使用带有\
    \ `nav` 和 `navbar-nav`  `ul` 元素。这些类用于将链接与导航栏正确对齐：\n\n```\n<div class=\"navbar\
    \ navbar-default\">\n    <div class=\"container-fluid\">\n        <div class=\"\
    navbar-header\">\n          <button type=\"button\" class=\"navbar-toggle\" \n\
    data-toggle=\"collapse\" data-target=\"#mynavbar-content\">\n            <span\
    \ class=\"icon-bar\"></span>\n            <span class=\"icon-bar\"></span>\n \
    \           <span class=\"icon-bar\"></span>\n          </button>\n          <a\
    \ class=\"navbar-brand\" href=\"#\">SitePoint</a>\n        </div>\n\n        <div\
    \ class=\"collapse navbar-collapse\" id=\"mynavbar-content\">\n            <ul\
    \ class=\"nav navbar-nav\">\n                <li class=\"active\"><a href=\"#\"\
    >Home</a></li>\n                <li><a href=\"#\">About</a></li>\n           \
    \     <li><a href=\"#\">Pricing</a></li>\n                <li><a href=\"#\">Contact</a></li>\n\
    \                <li><a href=\"#\">Feedback</a></li>\n            </ul>\n    \
    \    </div>\n    </div>\n</div\n```\n\n我们最终带有链接的导航栏应该像 图 3.18 所示。\n\n![最终导航栏](img/ch3Image17.png)\n\
    \n图 3.18. 最终导航栏\n\n"
- fmt: "\nLater in this chapter, we'll see how to design a form in Bootstrap. You\
    \ can directly place that form within the `navbar-collapse` element to show it\
    \ inside the navigation bar.\n\nDrop-down menus are another important component\
    \ of any navigation bar we see today. You can easily convert one of the `li` elements\
    \ of the `navbar-nav` list to a drop-down menu as follows:\n\n```\n<li class=\"\
    dropdown\">\n    <a href=\"#\" class=\"dropdown-toggle\" data-toggle=\"dropdown\"\
    >\n↵About <b class=\"caret\"></b></a>\n    <ul class=\"dropdown-menu\">\n    \
    \    <li><a href=\"#\">Board of Members</a></li>\n        <li><a href=\"#\">Developers\
    \ Team</a></li>\n        <li><a href=\"#\">Designing Team</a></li>\n        <li\
    \ class=\"divider\"></li>\n        <li><a href=\"#\">Investors</a></li>\n    \
    \    <li><a href=\"#\">Share holders</a></li>\n    </ul>\n</li>\n```\n\nAdd a\
    \ class `dropdown` to the `li` that you want to make a drop-down. Then insert\
    \ an additional `ul` list with class `dropdown-menu` to represent child links.\
    \ [Figure 3.20](#ch03.html_basedropdown \"Figure 3.20. A drop-down menu\") shows\
    \ the outcome.\n\n![A drop-down menu](figures/ch3Image18-2.png)\n\nFigure 3.20.\
    \ A drop-down menu\n\n### Breadcrumb\n\n`Breadcrumbs` are used to show the current\
    \ page's location in the site hierarchy. Bootstrap's breadcrumb component has\
    \ a very simple markup and can be placed anywhere in your website:\n\n```\n<ol\
    \ class=\"breadcrumb\">\n  <li><a href=\"#\">Home</a></li>\n  <li><a href=\"#\"\
    >About</a></li>\n  <li class=\"active\">Author</li>\n</ol>\n```\n\nThis should\
    \ result in [Figure 3.21](#ch03.html_breadcrumb \"Figure 3.21. Breadcrumb\").\n\
    \n![Breadcrumb](figures/ch3Image19.png)\n\nFigure 3.21. Breadcrumb\n\n## Standing\
    \ Out\n\nSometimes we need to design components that when used with other HTML\
    \ elements grab visitors' attention immediately. They can be labels, notification\
    \ icons, or huge buttons such as “Buy now”, “Grab it”, and so on. Bootstrap ships\
    \ with many such components out of the box. Let's check out some of the important\
    \ ones.\n\n### Label\n\n`Labels` are the best way to display short text beside\
    \ other components. Sometimes we may need to display text such as “New” or “Download\
    \ now”, for example, beside some other HTML elements. Labels come in handy in\
    \ such places.\n\nTo display a label, you need to add a `label` class to inline\
    \ HTML elements such as `span` and `i`. Here, we'll use a `span` to show a label\
    \ beside an `h3` element:\n\n```\n<h3>Jump Start Bootstrap <span class=\"label\
    \ label-default\">New\n↵</span></h3>\n```\n\n[Figure 3.22](#ch03.html_baselabels\
    \ \"Figure 3.22. Labels\") shows what this looks like.\n\n![Labels](figures/ch3Image20.png)\n\
    \nFigure 3.22. Labels\n\nThere's an additional class, `label-default`, that is\
    \ necessary to tell Bootstrap which variant of label we want to use. The available\
    \ label variants are:\n\n* `label-default` for gray\n* `label-primary` for dark\
    \ blue\n* `label-success` for green\n* `label-info` for light blue\n* `label-warning`\
    \ for orange\n* `label-danger` for red\n\n### Buttons\n\nYou can easily create\
    \ a button in Bootstrap. You just have to add the `btn` class to convert an `a`,\
    \ `button`, or `input` element into a fancy bold button in Bootstrap:\n\n```\n\
    <a href=\"#\" class=\"btn btn-primary\">Click Here</a>\n```\n\n[Figure 3.23](#ch03.html_basebutton\
    \ \"Figure 3.23. Bootstrap buttons\") shows what it will look like.\n\n![Bootstrap\
    \ buttons](figures/ch3Image21.png)\n\nFigure 3.23. Bootstrap buttons\n\nButtons\
    \ come in various color options:\n\n* `btn-default` for white\n* `btn-primary`\
    \ for dark blue\n* `btn-success` for green\n* `btn-info` for light blue\n* `btn-warning`\
    \ for orange\n* `btn-danger` for red\n\nAnd in various sizes:\n\n* `btn-lg` for\
    \ large buttons\n* `btn-sm` for small buttons\n* `btn-xs` for extra small buttons\n\
    \nHere are some examples of how they can be used:\n\n```\n<button type=\"button\"\
    \ class=\"btn btn-primary btn-lg\">Large button\n↵</button>\n\n<button type=\"\
    button\" class=\"btn btn-primary\">Default button\n↵</button>\n\n<button type=\"\
    button\" class=\"btn btn-primary btn-sm\">Small \n↵button</button>\n\n<button\
    \ type=\"button\" class=\"btn btn-primary btn-xs\">Extra \n↵small button</button>\n\
    ```\n\nThere are some more helper classes for buttons available:\n\n* `btn-block`\
    \ will make the button span across the whole grid\n* `active` will make the button\
    \ look like it's currently clicked\n* `disabled` will make the button unable to\
    \ be clicked and appear faded. You should also be careful while using this class,\
    \ as it will prevent click action on `input` and `button` elements but won't disable\
    \ the click action on `a` elements.\n\n### Glyphicons\n\n`Glyphicons` are used\
    \ to display small icons. They are lightweight font icons and not images. There\
    \ are many advantages of using a glyphicon instead of small images, including:\n\
    \n* saving multiple requests for small images or sprites\n* as they are font icons,\
    \ their colors and sizes can be varied on the go using CSS properties\n* that\
    \ they look crisp and sharp in all kind of displays.\n\nTo use glyphicons, you\
    \ need to use markup like this:\n\n```\n<span class=\"glyphicon glyphicon-heart\"\
    ></</span>\n```\n\nThis code displays a heart icon. Every icon in the glyphicons\
    \ set comes with a unique class. You need to replace `“glyphicon-heart` with the\
    \ name of the class of the icon you want to display. A list of glyphicon icons\
    \ and their classes can be found at [the Bootstrap website.](http://getbootstrap.com/components/#glyphicons)\n\
    \nGlyphicon icons are designed by a freelance developer named Jan Kovařík and\
    \ not by the Bootstrap developers. Most of the icons aren't free, though Kovařík\
    \ has donated a set of icons to the Bootstrap team. You can find more font icons\
    \ on his website, [glyphicons.com.](http://glyphicons.com)\n\n### Wells\n\nWells\
    \ are a useful component that wrap the content within a rounded cornered box with\
    \ a gray background, giving an inset effect to the content. They can be used to\
    \ highlight important facts amongst long textual content, for example, or an author's\
    \ bio box in a blogging application:\n\n```\n<div class=\"well\">\n    <p>Lorem\
    \ ipsum dolor sit amet, consectetur ... </p>\n</div>\n```\n\nHere's the effect\
    \ in [Figure 3.24](#ch03.html_basewells \"Figure 3.24. Wells\").\n\n![Wells](figures/ch3Image24.png)\n\
    \nFigure 3.24. Wells\n\nYou may be unsatisfied with the amount of spacing around\
    \ the content. Fortunately, Bootstrap has a solution for that! Wells comes in\
    \ three variants:\n\n1. Default: use only `well`.\n2. Large spacing: use `well`\
    \ and `well-lg` classes together.\n3. Small spacing: use `well` and `well-sm`\
    \ classes together.\n\n### Badges\n\nBadges are similar to the labels that we\
    \ have already discussed, but there's a major difference: labels are rectangular\
    \ in shape, whereas badges are more rounded. Badges are mostly used to display\
    \ numbers such as unread items, notifications, and so on, rather than text.\n\n\
    Badges are self-collapsing components, which means when there's no content inside\
    \ the badge it will not be visible on the website.\n\nThe markup for a badge component\
    \ looks like this:\n\n```\n<span class=\"badge\">23</span>\n```\n\nA more custom\
    \ usage of a badge is:\n\n```\n<a href=\"#\" class=\"btn btn-primary btn-lg\"\
    >Inbox \n↵<span class=\"badge\">23</span></a>\n```\n\nAnd you can see the output\
    \ in [Figure 3.25](#ch03.html_basebadges \"Figure 3.25. Badges\").\n\n![Badges](figures/ch3Image25.png)\n\
    \nFigure 3.25. Badges\n\n## Fun with Forms\n\nForms are a very important part\
    \ of our websites. They are used in the registration and login pages, contact\
    \ and feedback pages, search boxes, and many other places.\n\nBootstrap allows\
    \ you to create various types of forms within minutes. You can also use many of\
    \ HTML5's form validation attributes that are well supported by Bootstrap. So\
    \ let's build our first basic form.\n\n### Basic Form\n"
