    \ markup for a page header:\n\n```\n<div class=\"page-header\">\n      <h1>Chapter\
    \ 3</h1>\n</div>\n```\n\nWhenever you want to use the `<h1>` tag for a page title,\
    \ you can wrap it in a `<div>` element that has a class of `page-header` to create\
    \ a page header component.\n\nNow let's view index.html in our browser. It should\
    \ look like [Figure 3.1](#ch03.html_baseheader \"Figure 3.1. A basic page header\"\
    ).\n\n![A basic page header](figures/ch3Image1.png)\n\nFigure 3.1. A basic page\
    \ header\n\nAs you can see, the page header component doesn't add any additional\
    \ styles for the `h1` other than a thin gray bottom border. It only comes with\
    \ styles for adding subtitles, which we'll see soon.\n\nA small issue that we\
    \ see here is that the page header has stuck to the browser's left border. That's\
    \ because we haven't defined a container for all the contents of our web page.\
    \ So let's create a global container:\n\n```\n<div class=\"container\">\n\n</div>\n\
    ```\n\nNow place the page header markup inside the container `div`. Our final\
    \ markup should look like this:\n\n```\n<div class=\"container\">\n    <div class=\"\
