    \n根据屏幕尺寸，`push` 和 `pull` 类有几种变体：\n\n* `col-xs-pull-*` 和 `col-xs-push-*` 用于超小尺寸屏屏\n\
    * `col-sm-pull-*` 和 `col-sm-push-*` 用于较小屏幕\n* `col-md-pull-*` 和 `col-md-push-*`\
    \ 用于中等屏幕\n* `col-lg-pull-*` 和 `col-lg-push-*` 用于大屏幕\n\n你可以根据想要 `pull` 或 `push`\
    \ 的列数，将 `*` 替换为 1 到 12 之间的整数。\n\n## 总结\n你可以使用 Bootstrap 的网格系统创建几乎任何种类型的网站布局。如果使用得当，你就可以设计出一个可以在几乎任何设备上运行的精美且响应式的网站。嵌套、偏移和重新排序等功能也使其更加强大。有关\
    \ Bootstrap 网格系统的更多文档，请参考 `http://getbootstrap.com/#grid`。\n\n# 第 3 章：探索组件本身\n\
    在本章中，我们将开始使用 Bootstrap 中最实用的 HTML 组件。按钮、页眉、导航菜单和评论系统等组件在网站上非常常见。通过这些组件，Bootstrap\
    \ 帮助我们快速轻松地为网站添加此类功能。\n\n## 页面组件\n页面组件构成了页面的基本结构。页面组件的示例包括页眉、显示重要信息的突出面板（panels）、嵌套评论、图像缩略图和堆叠链接列表。这些都是流行的组件，从零开始开发需要很长时间。在本节中，我们将重点关注使用\
    \ Bootstrap 推荐的标记和类来创建可重用的 HTML 组件。\n\n### 页头\n给页面一个标题或题目并不是难事。任何人都可以使用 `<h1>`\
    \ 标签在网页上显示标题；然而，要用默认样式整齐地显示标题、在周围留出适当间距并在旁边带一个小副标题可能会花费意想不到的时间。幸运的是，Bootstrap\
    \ 创建了一个作为页头的 HTML 组件，为我们处理了所有这些任务。在查看页头标记之前，我们先设置整个过程中将使用的项目。\n\n首先，复制 Bootstrap\
    \ 文件夹的内容并将其粘贴到名为 `Chapter_3` 的新文件夹中。打开 `index.html` 文件并移除 `<body>` 标签内部存在的 `<h1>`\
    \ 标签。现在，让我们添加页头的标记：\n\n```\n<div class=\"page-header\">\n      <h1>Chapter 3</h1>\n\
    </div>\n```\n\n每当你想使用 `<h1>` 标签作为页面标题时，都可以将其封装在具有 `page-header` 类的 `<div>` 元素中，以创建一个页头。现在，让我们在浏览器中查看\
    \ `index.html`。它看起来应该像图 3.1 (#ch03.html_header \"Figure 3.1. 一个基础页头\")。\n\n![一个页头](img/ch3Image1.png)\n\
    图 3.1. 一个基础页头\n\n如你所见，页头组件除了为 `<h1>` 添加了一个细灰框外，没有添加任何额外的样式。它只带有添加副标题的样式，我们很快就会看到。在这里看到的一个小问题是页头贴住了浏览器的左边框。这是因为我们还没有为页面的所有内容定义一个容器（container）。所以，让我们创建一个全局容器：\n\
    \n```\n<div class=\"container\">\n\n</div>\n```\n\n现在将页头标记放在容器 `<div>` 内部。我们的最终标记应该看起来像这样：\n\
    \n```\n<div class=\"container\">\n    <div class=\"page-header\">\n          <h1>Chapter\
    \ 3</h1>\n    </div>\n</div>\n```\n\n结果可以在图 3.2 中看到 (#ch03.html_header \"Figure\
    \ 3.2. 容器中的页头\")。![容器中的页头](img/ch3Image2.png)\n图 3.2. 容器中的页头\n\n如果你想在页面标题旁边添加副标题，可以将其放在我们之前使用的同一个\
    \ `<h1>` 标签内。确保将副标题封装在 `<small>` 标签中，如下所示：\n\n```\n<div class=\"container\">\n\
    \    <div class=\"page-header\">\n          <h1>Chapter 3 <small>Exploring Components</small></h1>\n\
    \    </div>\n</div>\n```\n\n效果可以在图 3.3 中看到 (#ch03.html_header \"Figure 3.3. 带有副标题的页头\"\
    )。![带有副标题的页头](img/ch3Image3.png)\n图 3.3. 带有副标题的页头\n\n### 面板 (Panels)\n面板用于在带有圆角的框框内显示文本或图像。以下是创建面板的方法以及它在图\
    \ 3.4 中的样子 (#ch03.html_panelbasic \"Figure 3.4. 一个面板\")：\n\n```\n<div class=\"\
    panel panel-default\">\n      <div class=\"panel-heading\">\n        ATTENTION\n\
    \      </div>\n      <div class=\"panel-body\">\n        Lorem ipsum dolor sit\
    \ ametnim ... \n      </div>\n      <div class=\"panel-footer\">\n        <a href=\"\
    #\" class=\"btn-danger btn-sm\">Agree</a> \n        <a href=\"#\" class=\"btn-default\
    \ btn-sm\">Decline</a>\n      </div>\n</div>\n```\n\n![一个面板](img/ch3Image4.png)\n\
    图 3.4. 一个面板\n\n如你所示，面板 `<div>` 被分为三个部分：`panel-heading`、`panel-body` 和 `panel-footer`。这些面板部分每一个都是可选的。面板带有多种颜色选项。在之前的代码中，我通过\
    \ `panel-default` 类使用了默认颜色。你也可以使用其他类来表示不同的颜色：\n\n* `panel-primary` 用于深蓝色\n* `panel-success`\
    \ 用于绿色\n* `panel-info` 用于天蓝色\n* `panel-warning` 用于黄色\n* `panel-danger` 用于红色\n\n\
    ### 媒体对象 (Media Object)\n媒体对象用于创建应包含左对齐或右对齐媒体（图像、视频或音频）以及某些文本内容的组件。它最适合创建诸如评论区、显示推文或显示带有产品详情的功能。\n\
    \n为你的网站设计评论区可能是一项棘的任务。你需要仔细设计一些支持嵌套评论的可重用 HTML 标记。Bootstrap 的媒体对象非常有用，因为你可以非常轻松地创建多层嵌套评论。\n\
    \n创建媒体对象的标记为：\n\n```\n<div class=\"media\">\n    <a class=\"pull-left\" href=\"\
    #\">\n        <img class=\"media-object\" src=\"path/to/image\" alt=\"Syed Faz\
    \ Rahman\">\n    </a>\n    <div class=\"media-body\">\n        <h4 class=\"media-heading\"\
    >Awesome piece of work!</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur\
    \ ...</p>\n    </div>\n</div>\n```\n\n"
- fmt: "\n```\n<div class=\"media\">\n    <a class=\"pull-left\" href=\"#\">\n   \
    \     <img class=\"media-object\" src=\"path/to/image\" \nalt=\"Syed Fazle Rahman\"\
    >\n    </a>\n    <div class=\"media-body\">\n        <h4 class=\"media-heading\"\
    >Awesome piece of work!</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur\
    \ ...</p>\n\n        <!-- Second Media Object -->\n        <div class=\"media\"\
    >\n            <a class=\"pull-left\" href=\"#\">\n                <img class=\"\
    media-object\" src=\"path/to/image\" \nalt=\"Syed Fazle Rahman\">\n          \
    \  </a>\n            <div class=\"media-body\">\n                <h4 class=\"\
    media-heading\">Awesome piece of \nwork!</h4>\n                <p>Lorem ipsum\
    \ dolor sit amet, consectetur ...</p>\n            </div>\n        </div>\n\n\
    \    </div>\n</div>\n```\n\n[Figure 3.6](#ch03.html_nestedmedia \"Figure 3.6.\
    \ Nested media object\") shows our nested media object.\n\n![Nested media object](figures/ch3Image6.png)\n\
    \nFigure 3.6. Nested media object\n\nYou can use as many nesting levels as you\
    \ wish.\n\n### Thumbnails\n\nDisplaying images and video thumbnails is a snap\
    \ with Bootstrap's `thumbnails` component. It is used for displaying images and\
    \ videos with clickable appeal by applying a border that forms a box around them.\
    \ It also comes with a neat hover effect that highlights the focused thumbnail\
    \ by changing its border color to blue.\n\nHere's the markup for creating a thumbnail:\n\
    \n```\n<a href=\"#\" class=\"thumbnail\">\n    <img src=\"path/to/image\">\n</a\n\
    ```\n\nLet's create a four-column design using Bootstrap's grid system. We'll\
    \ place an image in each column and then apply thumbnail markup to each one.\n\
    \nAs seen in the [previous chapter](#ch01.html \"Chapter 1Up, Close, and Personal\
    \ with Bootstrap\"), we'll use the class `col-xs-3` to create a four-column design:\n\
    \n```\n<div class=\"row\">\n    <div class=\"col-xs-3\">\n        <a href=\"#\"\
    \ class=\"thumbnail\">\n            <img src=\"path/to/image\">\n        </a>\n\
    \    </div>\n    <div class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\"\
    >\n            <img src=\"path/to/image\">\n        </a>\n    </div>\n    <div\
    \ class=\"col-xs-3\">\n        <a href=\"#\" class=\"thumbnail\">\n          \
    \  <img src=\"path/to/image\">\n        </a>\n    </div>\n    <div class=\"col-xs-3\"\
    >\n        <a href=\"#\" class=\"thumbnail\">\n            <img src=\"path/to/image\"\
    >\n        </a>\n    </div>\n</div>\n```\n\nThis produces the result shown in\
    \ [Figure 3.7](#ch03.html_thumbs \"Figure 3.7. Thumbnails\").\n\n![Thumbnails](figures/ch3Image7.png)\n\
    \nFigure 3.7. Thumbnails\n\nTry hovering your mouse icon over each image and you\
    \ should get a nice highlighted effect. In the aforementioned code, you can see\
    \ that I have applied the class `thumbnail` to an anchor tag `<a>`. You can also\
    \ use a `<div>` tag instead of an anchor to represent a thumbnail.\n\nLet's give\
    \ a caption to each thumbnail. We just need to add an extra div with class `caption`\
    \ just below the `<img>` tag. Our snippet for a thumbnail with a caption should\
    \ be:\n\n```\n<a href=\"#\" class=\"thumbnail\">\n    <img src=\"path/to/image\"\
    >\n    <div class=\"caption\">\n        <h3>Caption Goes Here!</h3>\n    </div>\n\
    </a\n```\n\nIf you apply a caption to each thumbnail on the page, it will produce\
    \ a similar result to [Figure 3.8](#ch03.html_thumbscaptions \"Figure 3.8. Thumbnails\
    \ with captions\").\n\n![Thumbnails with captions](figures/ch3Image8.png)\n\n\
    Figure 3.8. Thumbnails with captions\n\nYou can also add some excerpts to each\
    \ thumbnail and a Read More button for linking to different pages in your website.\
    \ For this we need to first replace the link element with the class `thumbnail`\
    \ with a `<div>` element. Then we add an excerpt using `<p>` inside the `caption`\
    \ `<div>` and a link with a `Read More` anchor and classes `btn` and `btn-primary`\
    \ inside the same `caption` `<div>`. After making these changes, our final markup\
    \ for a post thumbnail will be as follows:\n\n```\n<div class=\"thumbnail\">\n\
    \    <img src=\"images/microsoft.png\">\n    <div class=\"caption\">\n       \
    \ <h3>Microsoft</h3>\n        <p>Lorem ipsum dolor sit amet, consectetur ...</p>\n\
    \        <p><a href=\"#\" class=\"btn btn-primary\">Read More</a></p>\n    </div>\n\
    </div>\n```\n\nThe above code will produce a result similar to [Figure 3.9](#ch03.html_readmore\
    \ \"Figure 3.9. Captions with \"Read More\" links\").\n\n![Captions with \"Read\
    \ More\" links](figures/ch3Image9.png)\n\nFigure 3.9. Captions with \"Read More\"\
    \ links\n\n### List Group\n\nWe can do more with list groups than just construct\
    \ straightforward lists, though. If you want to create a list in which each item\
    \ contains some textual content along with a heading, you could use the following:\n\
    \n```\n<a href=\"#\" class=\"list-group-item\">\n    <h4 class=\"list-group-item-heading\"\
    >Item heading</h4>\n    <p class=\"list-group-item-text\">Lorem ipsum dolor sit\
    \ ...</p>\n</a>\n```\n\nWe can also apply various colors to each item by adding\
    \ `list-group-item-*` classes along with `list-group-item`. They are as follows:\n\
    \n- success\n- info\n- warning\n- danger\n\nFor example, adding `list-group-item-success`\
    \ to the `list-group-item` class in the following list will give it a light green\
    \ color:\n\n```\n<li class=\"list-group-item list-group-item-success\">Inbox</li>\n\
    ```\n\n### List Group\n\nWhen you want to display a list of links, you should\
    \ use the anchor `<a>` instead of list `<li>`, depending on your parent `<ul>`\
    \ or `<div>`.\n\nWe can also display a number beside each item using the badge\
    \ component. We'll learn more about badges later, but for now you can add the\
    \ following snippet:\n\n```\n<span class=\"badge\">14</span>\n```\n\nSo our updated\
    \ list will now look like [Figure 3.11](#ch03.html_updatedlist \"Figure 3.11.\
    \ Updated list\").\n\n![Updated list](figures/ch3Image11.png)\n\nFigure 3.11.\
    \ Updated list\n\n### Tip: Lists\n\nWhen you want to display a list of links,\
    \ you should use the anchor `<a>` instead of list `<li>`, depending on your parent\
    \ `<ul>` or `<div>`.\n\nWe can also display a number beside each item using the\
    \ badge component. We'll learn more about badges later, but for now you can add\
    \ the following snippet:\n\n```\n<span class=\"badge\">14</span>\n```\n"
