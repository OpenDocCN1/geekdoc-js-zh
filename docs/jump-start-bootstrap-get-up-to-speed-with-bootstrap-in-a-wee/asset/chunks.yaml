  trans: "\n在本章的后后部分，我们将看到如何在 Bootstrap 中设计表单。你可以直接将该表单放在 `navbar-collapse` 元素中，以便显示在导航栏内部。\n\
    \n下拉菜单是我们今天看到的任何导航栏的另一个重要组件。你可以按照如下方法将 `navbar-nav` 列表中的一个 `li` 元素转换为下拉菜单：\n\n\
    ```\n<li class=\"dropdown\">\n    <a href=\"#\" class=\"dropdown-toggle\" data-toggle=\"\
    dropdown\">\n↵关于 <b class=\"caret\"></b></a>\n    <ul class=\"dropdown-menu\"\
    >\n        <li><a href=\"#\">董事会成员</a></li>\n        <li><a href=\"#\">开发团队</a></li>\n\
    \        <li><a href=\"#\">设计团队</a></li>\n        <li><li class=\"divider\"></li>\n\
    \        <li><a href=\"#\">投资者</a></li>\n        <li><a href=\"#\">股东</a></li>\n\
    \    </ul>\n</li>\n```\n\n为你想要转换为下拉菜单的 `li` 元素添加 `dropdown` 类名。然后，插入一个具有 `dropdown-menu`\
    \ 类的额外 `ul` 列表来表示子链接。图 3.20 显示了输出结果。\n\n![下拉菜单](img/ch3Image18-2.png)\n\n图 3.20.\
    \ 下拉菜单\n\n### 面包屑导航\n\n`Breadcrumbs`（面包屑）用于显示当前页面在网站层次结构中的位置。Bootstrap 的面包屑组件标记非常简单，可以放在网站的任何地方：\n\
    \n```\n<ol class=\"breadcrumb\">\n  <li><a href=\"#\">首页</a></li>\n  <li><a href=\"\
    #\">关于</a></li>\n  <li class=\"active\">作者</li>\n</ol>\n```\n\n这应该产生如图 3.21 所示的效果。\n\
    \n![面包屑导航](img/ch3Image19.png)\n\n图 3.21. 面包屑导航\n\n## 脱颖而出\n\n有时，我们需要设计一些组件，当它们与其他\
    \ HTML 元素一起使用时能够立即吸引访问者的注意力。它们可以是标签、通知图标，或者是巨大的按钮，例如“立即购买”、“立即抢购”等。Bootstrap 自带了许多此类组件。让我们来看看一些重要的组件。\n\
    \n### 标签\n\n`Labels`（标签）是在其他组件旁边显示简短文本的最佳方式。有时，我们可能需要在某些其他 HTML 元素旁边显示如“新”或“立即下载”之类的文本。标签在这些地方非常有用。\n\
    \n要显示标签，你需要向 `span` 和 `i` 等内联 HTML 元素添加 `label` 类。在这里，我们将使用一个 `span` 在 `h3` 元素旁边显示标签：\n\
    \n```\n<h3>快速上手 Bootstrap <span class=\"label label-default\">新\n↵</span></h3>\n\
    ```\n\n图 3.22 显示了它的样子。\n\n![标签](img/ch3Image20.png)\n\n图 3.22. 标签\n\n还有一个额外的类\
    \ `label-default`，它是必需的，用于告诉 Bootstrap 我们想要使用哪种变体的标签。可用的标签变体包括：\n\n* `label-default`：灰色\n\
    * `label-primary`：深蓝色\n* `label-success`：绿色\n* `label-info`：浅蓝色\n* `label-warning`：橙色\n\
    * `label-danger`：红色\n\n### 按钮\n\n你可以轻松地在 Bootstrap 中创建按钮。你只需要向 `a`、`button` 或\
    \ `input` 元素添加 `btn` 类，即可将其转换为 Bootstrap 中精美的加粗按钮：\n\n```\n<a href=\"#\" class=\"\
    btn btn-primary\">点击这里</a>\n```\n\n图 3.23 显示了它将后的样子。\n\n![Bootstrap 按钮](img/ch3Image21.png)\n\
    \n图 3.23. Bootstrap 按钮\n\n按钮有多种颜色选择：\n\n* `btn-default`：白色\n* `btn-primary`：深蓝色\n\
    * `btn-success`：绿色\n* `btn-info`：浅蓝色\n* `btn-warning`：橙色\n* `btn-danger`：红色\n\n\
    还有多种尺寸：\n\n* `btn-lg`：大按钮\n* `btn-sm`：小按钮\n* `btn-xs`：极小按钮\n\n以下是它们的一些用法示例：\n\n\
    ```\n<button type=\"button\" class=\"btn btn-primary btn-lg\">大按钮\n↵</button>\n\
    \n<button type=\"button\" class=\"btn btn-primary\">默认按钮\n↵</button>\n\n<button\
    \ type=\"button\" class=\"btn btn-primary btn-sm\">小 \n↵按钮</button>\n\n<button\
    \ type=\"button\" class=\"btn btn-primary btn-xs\">极小 \n↵按钮</button>\n```\n\n\
    还有一些可用的按钮辅助类：\n\n* `btn-block` 将使按钮跨越整个网格\n* `active` 将让按钮看起来像正被点击状态\n* `disabled`\
    \ 将让按钮无法点击并显示为淡化。在使用此类时也应该小心，因为它会阻止 `input` 和 `button` 元素的点击操作，但不会禁用 `a` 元素的点击操作。\n\
    \n### 图标字体\n\n`Glyphicons` 用于显示小图标。它们是轻量级的字体图标，而不是图像。使用 glyphicon 代替小图像有许多优势，包括：\n\
    \n* 减少了对小图像或精灵图（sprites）的多次请求\n* 因为它们是字体图标，可以使用 CSS 属性随时更改它们的颜色和大小\n* 它们在各种显示器上看起来都清晰锐\n\
    \n要使用 glyphicons，你需要使用如下标记：\n\n```\n<span class=\"glyphicon glyphicon-heart\"\
    > </span>\n```\n\n这段代码显示一个心形图标。glyphicons 集合中的每个图标都有一个唯一的类名。你需要将 `glyphicon-heart`\
    \ 替换为你想要显示的图标的类名。glyphicon 图标列表及其类名可以在 [Bootstrap 官网](http://getbootstrap.com/components/#glyphicons)\
    \ 找到。\n\nGlyphicon 图标是由名为 Jan Kovařík 的自由开发者设计的，而不是由 Bootstrap 开发人员。尽管大多数图标不是免费的，但\
    \ Kovařík 向 Bootstrap 团队捐赠了一组图标。你可以在他的网站上找到更多字体图标，[glyphicons.com.](http://glyphicons.com)\n\
    \n### 容器 (Wells)\n\nWells 是一种实用的组件，它将内容封装在一个灰色背景的圆角框内，为内容提供内凹效果。它们可以用于在长文本内容中突出重要事实，例如，博客应用程序中的作者简介框：\n\
    \n```\n<div class=\"well\">\n    <p>Lorem ipsum dolor sit amet, consectetur ...\
    \ </p>\n</div>\n```\n\n这是在图 3.24 中的效果。\n\n![Wells](img/ch3Image24.png)\n\n图 3.24.\
    \ Wells\n\n你可能对内容周围的间距不满意。幸运的是，Bootstrap 有此解决方案！Wells 有三种变体：\n\n1. 默认：仅使用 `well`。\n\
    2. 大间距：同时使用 `well` 和 `well-lg` 类。\n3. 小间距：同时使用 `well` 和 `well-sm` 类。\n\n### 徽章\
    \ (Badges)\n\nBadges 与我们已经讨论过的标签类似，但有一个主要区别：标签是矩形的，而徽章更圆。徽章主要用于显示诸如未读项目、通知等数字，而不是文本。\n\
    \nBadges 是自折叠组件，这意味着当 badge 内部没有内容时，它在网站上是不可见的。\n\nbadge 组件的标记如下：\n\n```\n<span\
    \ class=\"badge\">23</span>\n```\n\n更自定义的 badge 用法是：\n\n```\n<a href=\"#\" class=\"\
    btn btn-primary btn-lg\">收件箱 \n↵<span class=\"badge\">23</span></a>\n```\n\n你可以在图\
    \ 3.25 中看到输出。\n\n![徽章](img/ch3Image25.png)\n\n图 3.25. 徽章\n\n## 表单趣玩\n\n表单是我们网站非常重要的一部分。它们用于注册和登录页面、联系和反馈页面、搜索框以及许多地方。\n\
    \nBootstrap 允许你在几分钟内创建各种类型的表单。你还可以使用许多 Bootstrap 良好的 HTML5 表单验证属性。所以，让我们来构建第一个基础表单。\n\
    \n### 基础表单\n\n"
- fmt: "\nTo construct a form, we need a `form` element with the `form` class added\
    \ to it:\n\n```\n<form class=\"form\">\n</form>\n```\n\nFor each label and input\
    \ field, we require a `form-group` classed `div` element. Let's create an input\
    \ field that will ask our visitors their name:\n\n```\n<form class=\"form\">\n\
    \    <div class=\"form-group\">\n        <label for=\"nameField\">Name</label>\n\
    \        <input type=\"text\" class=\"form-control\" id=\"nameField\" \n     \
    \   placeholder=\"Your Name\" />\n    </div>\n</form>\n```\n\nAttaching the class\
    \ `form-control` to an `input` element will make it a full-width element, seen\
    \ in [Figure 3.26](#ch03.html_baseform \"Figure 3.26. A basic form\").\n\n![A\
    \ basic form](figures/ch3Image26.png)\n\nFigure 3.26. A basic form\n\nLet's fill\
    \ the form with email, phone number, and textarea fields and, finally, a submit\
    \ button. The complete markup and screenshot in [Figure 3.27](#ch03.html_formfields\
    \ \"Figure 3.27. Form with added fields\") follows:\n\n```\n<form class=\"form\"\
    >\n    <div class=\"form-group\">\n        <label for=\"nameField\">Name</label>\n\
    \        <input type=\"text\" class=\"form-control\" id=\"nameField\" \n     \
    \   placeholder=\"Your Name\" />\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <label for=\"emailField\">Email</label>\n        <input type=\"email\"\
    \ class=\"form-control\" id=\"emailField\" \n        placeholder=\"Your Email\"\
    \ />\n    </div>\n\n    <div class=\"form-group\">\n        <label for=\"phoneField\"\
    >Phone</label>\n        <input type=\"text\" class=\"form-control\" id=\"phoneField\"\
    \ \n        placeholder=\"Your Phone Number\" />\n    </div>\n\n    <div class=\"\
    form-group\">\n        <label for=\"descField\">Description</label>\n        <textarea\
    \ class=\"form-control\" id=\"descField\" placeholder=\"\n        Your Comments\"\
    ></textarea>\n    </div>\n\n    <button type=\"submit\" class=\"btn btn-primary\"\
    >Submit</button> \n    <button type=\"reset\" class=\"btn btn-default\">Reset</button>\n\
    </form>\n```\n\n![Form with added fields](figures/ch3Image27.png)\n\nFigure 3.27.\
    \ Form with added fields\n\n### Horizontal Forms\n\nIn the previous form, we have\
    \ displayed a label on top and then the input field. Suppose we want to display\
    \ the labels to the side of the input fields instead. Then we can use Bootstrap's\
    \ grid system inside the form element, like so:\n\n```\n<form class=\"form-horizontal\"\
    >\n    <div class=\"form-group\">\n        <label for=\"nameField\" class=\"col-xs-2\"\
    >Name</label>\n        <div class=\"col-xs-10\">\n            <input type=\"text\"\
    \ class=\"form-control\" id=\"nameField\" \n            placeholder=\"Your Name\"\
    \ />\n        </div>\n    </div>\n\n    <div class=\"form-group\">\n        <label\
    \ for=\"emailField\" class=\"col-xs-2\">Email</label>\n        <div class=\"col-xs-10\"\
    >\n            <input type=\"email\" class=\"form-control\" id=\"emailField\"\
    \ \n            placeholder=\"Your Email\" />\n        </div>\n    </div>\n\n\
    \    <div class=\"form-group\">\n        <label for=\"phoneField\" class=\"col-xs-2\"\
    >Phone</label>\n        <div class=\"col-xs-10\">\n            <input type=\"\
    text\" class=\"form-control\" id=\"phoneField\" \n            placeholder=\"Your\
    \ Phone Number\" />\n        </div>\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <label for=\"descField\" class=\"col-xs-2\">Description</label>\n \
    \       <div class=\"col-xs-10\">\n            <textarea class=\"form-control\"\
    \ id=\"descField\" \n            placeholder=\"Your Comments\"></textarea>\n \
    \       </div>\n    </div>\n\n    <div class=\"col-xs-10 col-xs-offset-2\">\n\
    \        <button type=\"submit\" class=\"btn btn-primary\">Submit</button> <button\
    \ type=\"reset\" class=\"btn btn-default\">Reset</button>\n    </div>\n\n</form>\n\
    ```\n\nThis should produce the horizontal form shown in [Figure 3.28](#ch03.html_horizontalform\
    \ \"Figure 3.28. A horizontal form\").\n\n![A horizontal form](figures/ch3Image28.png)\n\
    \nFigure 3.28. A horizontal form\n\nIn the code, we have replaced the form's class\
    \ from `form` to `form-horizontal` as per Bootstrap's rules. Then we have added\
    \ a class `col-xs-2` to the `label` element so that it spans across two Bootstrap\
    \ columns. Next, we have wrapped the input field inside a `div` that spans across\
    \ ten Bootstrap columns with the help of class `col-xs-10`.\n\n### Inline Form\n\
    \nWe can also create forms whose elements are present in a single line. An example\
    \ is a login form where the username and password fields are placed side-by-side.\
    \ The markup for an inline form as follows:\n\n```\n<form class=\"form-inline\"\
    >\n    <div class=\"form-group\">\n        <label for=\"email\">Email</label>\n\
    \        <input type=\"text\" class=\"form-control\" id=\"email\" placeholder=\"\
    Email\">\n    </div>\n\n    <div class=\"form-group\">\n        <label for=\"\
    password\">Password</label>\n        <input type=\"password\" class=\"form-control\"\
    \ id=\"password\" placeholder=\"Password\">\n    </div>\n\n    <div class=\"form-group\"\
    >\n        <button type=\"submit\" class=\"btn btn-primary\">Sign in</button>\n\
    \    </div>\n</form>\n```\n\nThis should produce the inline form shown in [Figure\
    \ 3.29](#ch03.html_inlineform \"Figure 3.29. Inline form\").\n\n![Inline form](figures/ch3Image28.png)\n\
    \nFigure 3.29. Inline form\n\n### Helper Classes in Forms\n\nThere are several\
    \ additional “helper” classes available from Bootstrap that help in displaying\
    \ forms. If you have used the `disabled` attribute to disable an input, Bootstrap\
    \ has a style defined for it. For example, this code:\n\n```\n<input class=\"\
    form-control\" type=\"text\" \nplaceholder=\"Disabled input...\" disabled>\n```\n\
    \nwill look like [Figure 3.30](#ch03.html_disabledform \"Figure 3.30. Disabled\
    \ form inputs\").\n\n![Disabled form inputs](figures/ch3Image29.png)\n\nFigure\
    \ 3.30. Disabled form inputs\n\nBootstrap also has three validation states for\
    \ input elements:\n\n1.  `has-success`\n\n2.  `has-error`\n\n3.  `has-warning`\n\
    \nHere's an example of how validation state can be used:\n\n```\n<div class=\"\
    form-group has-success\">\n    <label class=\"control-label\" for=\"inputField\"\
    >\n    Input with success</label>\n    <input type=\"text\" class=\"form-control\"\
    \ id=\"inputField\">\n</div>\n```\n\nApplying `has-success` will make the label\
    \ text and border field green in color. Similarly, `has-warning` will employ a\
    \ dull brown color and `has-danger` will use dark red. These `has-` type classes\
    \ will only apply colors to `form-control`, `control-label`, and `help-block`\
    \ classed elements. If you want to show some custom text when a user enters invalid\
    \ values in the input field, use a `span` element with class `help-block`. The\
    \ `help-block` will appear below its corresponding input field.\n\n### Control\
    \ Sizing\n\nYou can vary the height of input elements using the **control sizing**\
    \ classes of Bootstrap:\n\n*   `input-lg` for bigger input elements than the default\
    \ size.\n\n*   `input-sm` for smaller input elements than the default size.\n\n\
    Here's some examples of them in use:\n\n```\n<input class=\"form-control input-lg\"\
    \ type=\"text\" \nplaceholder=\"Larger Input Field\">\n<input class=\"form-control\"\
    \ type=\"text\" \nplaceholder=\"Default Input Field\">\n<input class=\"form-control\
    \ input-sm\" type=\"text\" \nplaceholder=\"Smaller Input Field\">\n```\n"
