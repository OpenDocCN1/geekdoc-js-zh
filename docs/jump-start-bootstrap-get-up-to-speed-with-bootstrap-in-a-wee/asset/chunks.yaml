    \nIf no additional class is provided to `modal-dialog`, it will appear in the\
    \ default width of 600p. To make the modal large or small, you need to add one\
    \ of these classes to the `modal-dialog` element:\n\n*   `modal-lg`: for a large\
    \ modal of width 900px\n\n*   `modal-sm`: for a small modal of width 300px\n\n\
    ### Modals with JavaScript\n\nBootstrap provides the `modal()` method to trigger\
    \ a modal through JavaScript. This method also accepts an options object containing\
    \ various properties for customizing the default behavior of a modal:\n\n```\n\
    var options = {\n    backdrop: true,\n    keyboard: false,\n    show: true,\n\
    \    remote: false\n}\n\n$(\"#myModal\").modal(options);\n```\n\nThe `backdrop`\
    \ propertiy accepts Boolean values or the string value “`static”`. When a modal\
    \ is launched, a dark transparent backdrop appears by default behind the modal\
    \ body. Setting this property to `true` makes the backdrop visible. Set it to\
    \ `false` and the backdrop disappears. When set to “`static”` , the modal won't\
    \ close when there's a click anywhere outside the modal body.\n\nThe `keyboard`\
    \ property is used to enable or disable escape key functionality from the keyboard.\
    \ When set to false, the **Esc** key won't close the modal.\n\nThe `show` property\
    \ is used to toggle the visibility of the modal through JavaScript. When set to\
    \ `true`, the modal will appear automatically without requiring a click on any\
    \ handle element.\n\nThe `a` element, which may be used as a modal handle element,\
    \ can comprise an attribute `href` containing a link. The Bootstrap modal has\
    \ an option to load this link inside its `modal-body` element when clicked on\
    \ the handle. This feature is turned off by default. If you want to use this feature\
    \ and load the link inside the `modal-body`, set the `remote` property to `true`.\n\
    \nEvents associated with Bootstrap modal include:\n\n1.  `show.bs.modal`: fired\
    \ just before opening the modal\n\n2.  `shown.bs.modal`: fired after the modal\
    \ is open\n\n3.  `hide.bs.modal`: fired just before hiding the modal\n\n4.  `hidden.bs.modal`:\
    \ fired after the modal is hidden\n\n5.  `loaded.bs.modal`: fired after the remote\
    \ content is loaded\n\nHere's how they are used:\n\n```\n$('#myModal').on('show.bs.modal',\
    \ function () {\n    console.log(\"Opening Modal..\");\n});\n\n$('#myModal').on('shown.bs.modal',\
    \ function () {\n    console.log(\"Modal opened.\");\n});\n\n$('#myModal').on('hide.bs.modal',\
    \ function () {\n    console.log(\"Hiding Modal..\");\n});\n\n$('#myModal').on('hidden.bs.modal',\
    \ function () {\n    console.log(\"Modal hidden.\");\n});\n```\n\n## Summary\n\
    \nThrough this chapter, we have learned how to use many of the popular Bootstrap\
    \ JavaScript plugins. We have also learned how to customize them by setting custom\
    \ `data-*` attributes and through JavaScript. When working with Bootstrap, you\
    \ should always make use of the built-in plugins whenever possible and avoid writing\
    \ custom plugins.\n\n# Chapter 5\n\nDiving Deep: Customizing Bootstrap\n\nImagine\
    \ a Web where all the websites built with Bootstrap look and feel the same. Boring,\
    \ right? Fortunately, we have the power to change the default styles of any framework\
    \ we work with.\n\nMany of Bootstrap's components and plugins have their own default\
    \ styles. In order to give them a personal touch, you need to replace their CSS\
    \ rules and define your own.\n\nIn the [first chapter,](#ch01.html \"Chapter 1Up,\
    \ Close, and Personal with Bootstrap\") I shared with you some of the popular\
    \ websites built on Bootstrap. They have all customized Bootstrap's CSS to make\
    \ their templates look unique and beautiful.\n\nIn this chapter, we'll discuss\
    \ the various methods we can use to completely customize Bootstrap's default styles,\
    \ and analyze which method is more preferable and why. Finally, we will try to\
    \ understand how Bootstrap's CSS was written to make it a highly responsive framework.\n\
    \n## Customizing Bootstrap Stylesheets\n\nYou can customize Bootstrap in various\
    \ ways. In this section, we'll see customization through static CSS files and\
    \ through Less files.\n\n### Note: What's Less?"
