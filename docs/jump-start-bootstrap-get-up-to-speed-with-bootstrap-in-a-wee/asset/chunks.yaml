    \        toggle: false\n});\n```\n\nIn the snippet, I have passed an anonymous\
    \ object that has a property `toggle` with a value set to `false`. This will force\
    \ all the tabs to stay open when other tabs are opening. Go ahead and try it yourself.\n\
    \nAs shown in [Figure 4.14](#ch04.html_collapseallopen \"Figure 4.14. All tabs\
    \ open in our collapse\"), you can see all the tabs are opened simultaneously.\n\
    \n![All tabs open in our collapse](figures/ch4Image15.png)\n\nFigure 4.14. All\
    \ tabs open in our collapse\n\nYou also have option to pass various predefined\
    \ strings to the `collapse()` method:\n\n1.  `collapse('toggle')`: toggles the\
    \ tab from one state to another\n\n2.  `collapse('show')`: opens a tab\n\n3. \
    \ `collapse('hide')`: closes a tab\n\nBootstrap also comes with four custom events\
    \ attached to the collapse plugin:\n\n1.  `show.bs.collapse`: fired just before\
    \ opening the tab\n\n2.  `shown.bs.collapse`: fired after the tab is opened\n\n\
    3.  `hide.bs.collapse`: fired just before closing the tab\n\n4.  `hidden.bs.collapse`:\
    \ fired after the tab is closed\n\nHere's how they're used:\n\n```\n$('.collapse').on('show.bs.collapse',\
    \ function () {\n    console.log('Opening tab..');\n});\n\n$('.collapse').on('shown.bs.collapse',\
    \ function () {\n    console.log('Tab opened.');\n});\n\n$('.collapse').on('hide.bs.collapse',\
    \ function () {\n    console.log('Hiding tab..');\n});\n\n$('.collapse').on('hidden.bs.collapse',\
    \ function () {\n    console.log('Tab hidden');\n});\n```\n\n### Tooltip\n\nA\
    \ Bootstrap **tooltip** is a small floating message that appears when the mouse\
    \ is hovered over a component in a website. It is generally used to display help\
    \ text for a particular component.\n\nBootstrap's tooltip is made using CSS and\
    \ triggered through JavaScript. It's extremely lightweight compared to many other\
    \ tooltip plugins available today. There are also easy customization options to\
    \ position the tooltip with respect to its parent component (top, bottom, right,\
    \ and left). To use a tooltip, we have to define some custom `data-*` attributes.\n\
    \nLet's build a demo tooltip on a button component:\n\n```\n<button type=\"button\"\
    \ class=\"btn btn-default\" data-toggle=\"tooltip\" \n↵data-placement=\"bottom\"\
    \ title=\"I am a Bootstrap button\">Who am I?\n↵</button>\n```"
