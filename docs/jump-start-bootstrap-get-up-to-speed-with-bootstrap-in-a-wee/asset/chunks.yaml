    \    </div>\n</div>\n```\n\nThe effect can be seen in [Figure 3.3](#ch03.html_headersub\
    \ \"Figure 3.3. Header with subtitle\").\n\n![Header with subtitle](figures/ch3Image3.png)\n\
    \nFigure 3.3. Header with subtitle\n\n### Panels\n\n**Panels** are used to display\
    \ text or images within a box with rounded corners. Here's how to create a panel,\
