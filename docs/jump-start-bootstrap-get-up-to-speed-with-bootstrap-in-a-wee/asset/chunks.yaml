    \    <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
    ↵3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/\n\
    ↵respond.js/1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n\
    \  <body>\n        <h1>Hello World!</h1>\n\n        <script src=\"js/jquery.js\"\
    ></script>\n        <script src=\"js/bootstrap.js\"></script>\n  </body>\n</html>\n\
    ```\n\nI have included an `h1` element containing “Hello World!”. Go ahead and\
    \ load the page in your browser. You should see “Hello World!” written in a nice\
    \ font.\n\nIf you are using Google Chrome, you have an easy option to check that\
    \ all the JavaScript and CSS files are loaded properly. Right-click on the page\
    \ and go to Inspect Element. Click on the `Console` tab and if no errors are displayed,\
    \ all the JavaScript files have loaded properly. Next, go to the `Network` tab;\
    \ if there are no 404 errors, all the CSS files are linked properly.\n\n![Checking\
    \ that files have loaded correctly in Chrome](figures/ch1Image12.png)\n\nFigure\
    \ 1.7. Checking that files have loaded correctly in Chrome\n\nFinally, we are\
    \ done with setting up our Bootstrap project. We’ll be using a similar set up\
    \ in the rest of this book.\n\n# Chapter 2\n\n## Bootstrap Grid System\n\nIn this\
    \ chapter, we'll discover one of the most important features of Bootstrap: the\
    \ `grid system`. We'll learn how the grid system works and how we can use it in\
    \ our applications. We'll also create some sample website layouts in order to\
    \ understand it better.\n\n### What Is a Grid System?\n\nA `grid system` allows\
    \ us to properly house our website's content. It divides the screen into multiple\
    \ rows and columns that can be used to create various types of layouts. Once we\
    \ have the rows and columns defined, we can decide which HTML element will be\
    \ placed where.\n\nBootstrap's grid system divides the screen into columns―up\
    \ to 12 in each row. The column widths vary according to the size of screen they're\
    \ displayed in. Hence, Bootstrap's grid system is `responsive`, as the columns\
    \ resize themselves dynamically when the size of browser window changes. You can\
    \ create an infinite number of rows depending on your design's requirements. The\
    \ intersection of these rows and columns forms a rectangular grid to contain the\
    \ website's content.\n\nAs an example, in [Figure 2.1](#ch02.html_twelve \"Figure\
    \ 2.1. A sample page showing a 12-column grid\") I have created a row and then\
    \ used the grid system to divide it into 12 columns. I have changed each column's\
    \ background color to make them distinct. Each column here is represented by a\
    \ number.\n\n![A sample page showing a 12-column grid](figures/ch2Image1.png)\n\
    \nFigure 2.1. A sample page showing a 12-column grid\n\n### Building a Basic Grid\n\
    \nIn this section, we're going to create our first website layout using Bootstrap's\
    \ grid system. We will be using the same Bootstrap setup, `Bootstrap_demos`, that\
    \ we created in the last chapter. Copy all the files that are present inside the\
    \ `Bootstrap_demos` folder. Then create a new folder called `chapter_2` and paste\
    \ those files inside it.\n\nNow open `index.html`, change the page title to “Bootstrap\
    \ Grid System” and remove the `h1` tag from the body. We should now have a basic\
    \ HTML page that looks like this:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n  <head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ \n↵initial-scale=1\">\n\n    <title>Bootstrap Grid System</title>\n    <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n\n    <!--[if\
    \ lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n↵3.7.0/html5shiv.js\"\
    ></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n↵1.4.2/respond.min.js\"\
    ></script>\n    <![endif]-->\n\n  </head>\n  <body>\n        <!-- Body content\
    \ goes here -->\n\n        <script src=\"js/jquery.js\"></script>\n        <script\
    \ src=\"js/bootstrap.js\"></script>\n  </body>\n</html>\n```\n\nBootstrap recommends\
    \ that we should place all the rows and columns inside a container to ensure proper\
    \ alignment and padding. There are two types of container classes in Bootstrap:\
    \ `container` and `container-fluid`. The former creates a fixed-width container\
    \ in the browser window, while the latter creates a full-width fluid container.\
    \ The fixed-width container is styled to appear at the center of the screen, omitting\
    \ extra space on both sides. Hence, it is a good practice to wrap all the contents\
    \ within a container.\n\nWe will use the fixed-width `container` in our demo.\
    \ Let's go ahead and create a container in our HTML page:\n\n```html\n<div class=\"\
    container\">\n</div>\n```\n\nNext, we'll create a row inside a container. Once\
    \ the row is defined, we can start creating the columns. Bootstrap has a class\
    \ `row` for creating rows:\n\n```html\n<div class=\"container\">\n    <div class=\"\
    row\">\n    </div>\n</div>\n```\n\nYou can create an infinite number of rows but\
    \ they must be placed within a container. For better results, it is recommended\
    \ to have a single container with all the rows inside.\n\nIn Bootstrap, columns\
    \ are created by specifying how many of the 12 available columns you wish to span.\
    \ Suppose we want to have a single column. It should span across all twelve available\
    \ columns. For this we'll use the class `col-xs-12`, with the number `12` specifying\
    \ the amount of columns to span. (You can ignore the `xs` term in the class name\
    \ for now; we'll discuss that later).\n\nSimilarly, to create two equal-width\
    \ columns in a row, we'd use the class `col-xs-6` for each one. This tells Bootstrap\
    \ that we want two columns that span across six of Bootstrap's columns, as follows:\n\
    \n```html\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
    col-xs-6\">\n            <h4>Column 1</h4>\n        </div>\n        <div class=\"\
    col-xs-6\">\n            <h4>Column 2</h4>\n        </div>\n    </div>\n</div>\n\
    ```\n\nThe result can be seen in [Figure 2.2](#ch02.html_twols \"Figure 2.2. Two\
    \ equally sized columns on our grid\").\n\n![Two equally sized columns on our\
