    \ also uncheck `Input groups` and `Navbar` automatically. Hence, you need to be\
    \ careful when making selections!\n\n## Media Queries and Bootstrap\n\n**Media\
    \ queries** were introduced as a part of CSS3 to dynamically control website content\
    \ depending on screen resolution. It's one of the key technologies beneath every\
