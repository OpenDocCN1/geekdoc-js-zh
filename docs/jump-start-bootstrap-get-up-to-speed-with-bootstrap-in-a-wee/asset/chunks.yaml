    #map\">Map</a></li>\n          </ul>\n        </div>\n      </div>\n    </nav>\n\
    \    <div data-spy=\"scroll\" data-target=\"#navbarExample\" \ndata-offset=\"\
    0\" class=\"scrollspy-example\">\n\n        <h4 id=\"Home\">Home</h4>\n      \
    \  <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\n        <h4 id=\"about\"\
    >About</h4>\n        <p>Lorem ipsum dolor sit amet, consectetur ... </p>\n\n \
    \       <h4 id=\"contact\">Contact Us</h4>\n        <p>Lorem ipsum dolor sit amet,\
    \ consectetur ... </p>\n\n        <h4 id=\"map\">Map</h4>\n        <p>Lorem ipsum\
    \ dolor sit amet, consectetur ... </p>\n\n    </div>\n  </</div>\n\n    <script\
    \ src=\"js/jquery.js\"></script>\n    <script src=\"js/bootstrap.js\"></script>\n\
    \  </body>\n</html>\n```\n\n在 图 4.10 中，你可以看到我已经滚动到了“About”部分，导航栏中的“About”链接被高亮显示。\n\
    \n![Using ScrollSpy](img/ch4Image10.png)\n\n图 4.10. 使用 ScrollSpy\n\n### 使用 JavaScript\
    \ 使用 ScrollSpy\n\nBootstrap 提供了 `scrollspy()` 方法，可以通过可选参数自定义 `ScrollSpy` 插件。你可以通过\
    \ JavaScript 传递相应的配置对象来设置目标导航栏的父类：\n\n```javascript\n$('.scrollspy-example').scrollspy({\
    \ target: '#navbarExample' });\n```\n\n如果你通过 JavaScript 传递选项，可以忽略元素标记内部的 `data-*`\
    \ 属性。\n\n另一个重要的参数是 `refresh` 字符串。如果你对 DOM 进行了操作（例如从 ScrollSpy 区域添加或删除元素），你需要调用\
    \ `scrollspy(\"refresh\")` 方法。这将帮助 ScrollSpy 重新计算滚动区域的高度，该高度可能因为 DOM 的添加和删除而发生变化。\n\
    \n"
- fmt: "\n```javascript\n$('.nav-tabs li a').on('show.bs.tab', function () {\n   console.log(\"\
    Opening tab\");\n});\n\n$('.nav-tabs li a').on('shown.bs.tab', function () {\n\
    \   console.log(\"Tab opened!\");\n});\n```\n\n### Collapse\n\nThe `collapse`\
    \ plugin is popularly known as an “accordion” plugin on the Web. It is a plugin\
    \ that houses multiple vertically stacked tabs, but can open only one tab at a\
    \ time. [Figure 4.12](#ch04.html_collapse \"Figure 4.12. The collapse plugin\"\
    ) shows a screenshot of the collapse plugin.\n\n![The collapse plugin](figures/ch4Image12-1.png)\n\
    \nFigure 4.12. The collapse plugin\n\nIn Bootstrap, a `collapse` is created by\
    \ housing multiple panel components together in a single container. We saw how\
    \ to create a panel in the last chapter. We also know that a panel has two components:\
    \ the `panel-heading` and `panel-body`.\n\nTo create a collapse, we need a group\
    \ of panels housed inside a container. This container is created using a `div`\
    \ element with the class `panel-group`. It should also have an ID associated with\
    \ it.\n\n```html\n<div class=\"panel-group\" id=\"accordion\">\n</div>\n```\n\n\
    We need to fill this container with different panels components that will serve\
    \ as tabs. Let's create a single panel component inside this `panel-group`:\n\n\
    ```html\n<div class=\"panel-group\" id=\"accordion\">\n\n    <div class=\"panel\
    \ panel-default\">\n\n        <div class=\"panel-heading\">\n            <h4 class=\"\
    panel-title\">\n                <a data-toggle=\"collapse\" data-parent=\"#accordion\"\
    \ \n                href=\"#collapseOne\">\n                Collapsible Group\
    \ Item #1\n                </a>\n            </h4>\n        </div>\n\n       \
    \ <div id=\"collapseOne\" class=\"panel-collapse collapse in\">\n            <div\
    \ class=\"panel-body\">\n            Lorem ipsum dolor sit ...\n            </div>\n\
    \        </div>\n\n    </div>\n\n</div>\n```\n\nHere, I have inserted the markup\
    \ for a single panel component inside the panel group container. Every panel is\
    \ divided into two parts: a `panel-heading` element and a `panel-body` element.\n\
    \nThe `panel-heading` element contains an `h4` element with an `a` element wraped\
    \ within it. This combination of `<h4>` and `<a>` tags makes a tab in the collapse\
    \ plugin. The `h4` element should have a class `panel-title`. The `a` element\
    \ should have three very important attributes: `data-toggle`, `data-parent`, and\
    \ `href`. The `data-toggle` should represent what type of plugin it is. The `data-parent`\
    \ element should contain the ID of the `panel-group` element. Finally, the `href`\
    \ of such links should contain the ID of the parent element of `panel-body`.\n\
    \nUnlike normal panels where `panel-body` isn't wrapped inside any div, it is\
    \ mandatory here to achieve the collapse effect. This wrapper element should have\
    \ the classes `panel-collapse`, `collapse`, and `in`. The class `collapse` is\
    \ used to hide the content whereas the combination of `collapse` and `in` displays\
    \ the content. Hence, the first wrapper has both `collapse` and `in` classes and\
    \ remaining all the wrappers should only have the `collapse` class. The class\
    \ `panel-collapse` is used by Bootstrap's JavaScript to identify the wrapper.\n\
    \nRepeat the same markup for multiple tabs. The following markup shows a collapse\
    \ plugin with three vertically stacked tabs, with the result shown in [Figure\
    \ 4.13](#ch04.html_finalcollapse \"Figure 4.13. Final collapse plugin\"):\n\n\
    ```html\n<div class=\"panel-group\" id=\"accordion\">\n\n      <!-- Panel 1 -->\n\
    \      <div class=\"panel panel-default\">\n        <div class=\"panel-heading\"\
    >\n          <h4 class=\"panel-title\">\n            <a data-toggle=\"collapse\"\
    \ data-parent=\"#accordion\" \n            href=\"#collapseOne\">\n          \
    \    Collapsible Group Item #1\n            </a>\n          </h4>\n        </div>\n\
    \        <div id=\"collapseOne\" class=\"panel-collapse collapse in\">\n     \
    \       <div class=\"panel-body\">\n                Lorem ipsum dolor sit amet,\
    \ consectetur ...\n            </div>\n      </div>\n\n      <!-- Panel 2 -->\n\
    \      <div class=\"panel panel-default\">\n        <div class=\"panel-heading\"\
    >\n          <h4 class=\"panel-title\">\n            <a data-toggle=\"collapse\"\
    \ data-parent=\"#accordion\" \n            href=\"#collapseTwo\">\n          \
    \    Collapsible Group Item #2\n            </a>\n          </h4>\n        </div>\n\
    \        <div id=\"collapseTwo\" class=\"panel-collapse collapse\">\n        \
    \    <div class=\"panel-body\">\n                Lorem ipsum dolor sit amet, consectetur\
    \ ...\n            </div>\n        </div>\n      </div>\n\n      <!-- Panel 3\
    \ -->\n      <div class=\"panel panel-default\">\n        <div class=\"panel-heading\"\
    >\n          <h4 class=\"panel-title\">\n            <a data-toggle=\"collapse\"\
    \ data-parent=\"#accordion\" \n            href=\"#collapseThree\">\n        \
    \      Collapsible Group Item #3\n            </a>\n          </h4>\n        </div>\n\
    \        <div id=\"collapseThree\" class=\"panel-collapse collapse\">\n      \
    \      <div class=\"panel-body\">\n                Lorem ipsum dolor sit amet,\
    \ consectetur ...\n            </div>\n        </div>\n      </div>\n    </div>\n\
    </div>\n```\n\n![Final collapse plugin](figures/ch4Image12.png)\n\nFigure 4.13.\
    \ Final collapse plugin\n\n### Collapse with JavaScript\n\nBootstrap provides\
    \ the `collapse()` method for changing the default behavior of the collapse plugin.\
    \ By default, only one tab can be opened at a time. We can override this behavior\
    \ by passing the custom `options` object to the above method. Let's do that.\n\
    \nIn the previous collapse plugin's markup we had added a class `collapse` to\
    \ all the `panel-body` wrappers. Let's select this class and call the `collapse()`\
    \ method on it:\n\n```javascript\n$('.collapse').collapse({\n        toggle: false\n\
    });\n```\n\nIn the snippet, I have passed an anonymous object that has a property\
    \ `toggle` with a value set to `false`. This will force all the tabs to stay open\
    \ when other tabs are opening. Go ahead and try it yourself.\n\nAs shown in [Figure\
    \ 4.14](#ch04.html_collapseallopen \"Figure 4.14. All tabs open in our collapse\"\
    ), you can see all the tabs are opened simultaneously.\n\n![All tabs open in our\
    \ collapse](figures/ch4Image15.png)\n\nFigure 4.14. All tabs open in our collapse\n\
    \nYou also have option to pass various predefined strings to the `collapse()`\
    \ method:\n\n1. `collapse('toggle')`: toggles the tab from one state to another\n\
    2. `collapse('show')`: opens a tab\n3. `collapse('hide')`: closes a tab\n\nBootstrap\
    \ also comes with four custom events attached to the collapse plugin:\n\n1. `show.bs.collapse`:\
    \ fired just before opening the tab\n2. `shown.bs.collapse`: fired after the tab\
    \ is opened\n3. `hide.bs.collapse`: fired just before closing the tab\n4. `hidden.bs.collapse`:\
    \ fired after the tab is closed\n\nHere's how they're used:\n\n```javascript\n\
    $('.collapse').on('show.bs.collapse', function () {\n    console.log('Opening\
    \ tab..');\n});\n\n$('.collapse').on('shown.bs.collapse', function () {\n    console.log('Tab\
    \ opened.');\n});\n\n$('.collapse').on('hide.bs.collapse', function () {\n   \
    \ console.log('Hiding tab..');\n});\n\n$('.collapse').on('hidden.bs.collapse',\
    \ function () {\n    console.log('Tab hidden');\n});\n```\n\n### Tooltip\n\nA\
    \ Bootstrap `tooltip` is a small floating message that appears when the mouse\
    \ is hovered over a component in a website. It is generally used to display help\
    \ text for a particular component.\n\nBootstrap's tooltip is made using CSS and\
    \ triggered through JavaScript. It's extremely lightweight compared to many other\
    \ tooltip plugins available today. There are also easy customization options to\
    \ position the tooltip with respect to its parent component (top, bottom, right,\
    \ and left). To use a tooltip, we have to define some custom `data-*` attributes.\n\
    \nLet's build a demo tooltip on a button component:\n\n```html\n<button type=\"\
    button\" class=\"btn btn-default\" data-toggle=\"tooltip\" \ndata-placement=\"\
    bottom\" title=\"I am a Bootstrap button\">Who am I?\n</button>\n```\n"
