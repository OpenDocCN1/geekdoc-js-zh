  trans: "\n\n[Less](http://lesscss.org) 是一种 CSS 处理器，它扩展了 CSS 的功能，添加了变量、混合宏（mixins）、函数等编程特性。它使\
    \ CSS 保持模块化、可维护和可扩展。Less 文件会被编译并生成 CSS 文件，然后你可以在项目中使用这些文件。\n\n如果你使用 Ruby 工作，[Sass](http://sass-lang.com)\
    \ 是 Less 的替代方案。它也是 Bootstrap 支持的一种 CSS 处理器；然而，我们不会在书中介绍 Sass 的自定义。\n\nBootstrap\
    \ 默认包附带的样式表是普通的 CSS 文件。如果你使用文本编辑器打开静态 CSS 文件，你会发现许多选择器及其相关的 CSS 属性。你可能想直接在这些文件中修改\
    \ CSS 属性及其取值以节省时间，但我强烈建议不要这样做。\n\n直接修改 CSS 文件有很多缺点。其中一些重要的缺点包括：\n\n*   更改是不可逆的。你将不再记得原始的\
    \ CSS 属性及其值，因此你无法恢复到原始的 Bootstrap 样式。\n*   你对任何选择器所做的更改都可能破坏 Bootstrap 的响应式布局。\n\
    *   调试变得非常困难；你需要理解 CSS 继承链才能找到父级选择器。\n\n在我们开始自定义之前，让我们先设置本章将要使用的项目。一如既常，我们将使用在第\
    \ 1 章 中创建的 `Bootstrap_demos` 项目。将所有内容复制到名为 `Chapter_5` 的新文件夹中。打开 `index.html`并将页面标题更改为“Customizing\
    \ Bootstrap”。现在从 body 中移除 `<h1>` 标签。\n\n### 使用 CSS 自定义 Bootstrap\n\n这种类型的自定义通常被称为`覆盖默认\
    \ CSS`。我们实际上是用自己的不同值来重写 Bootstrap 的某些 CSS 属性。\n\n首先，我们在 `/css` 文件夹内创建一个名为 `app.css`（或你喜欢的名称）的新文件。然后我们打开\
    \ `index.html` 并链接到这个新的 CSS 文件。该新 CSS 文件的链接应该包含在 Bootstrap CSS 文件的链接下方：\n\n```\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/bootstrap.css\">\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/app.css\">\n```\n\n让我们添加一个 Bootstrap\
    \ 按钮，如图 5.1 所示。我们将用它来展示如何对其默认设计进行更改：\n\n```\n<div class=\"container\">\n    <a\
    \ href=\"#\" class=\"btn btn-primary btn-lg\">Big Fat Button</a>\n</div>\n```\n\
    \n![我们的默认按钮](img/ch5Image1.png)\n\n图 5.1. 我们的默认按钮\n\n现在我们将执行以下操作来自定义此按钮：\n\n*\
    \   移除按钮的圆角\n*   修改内边距（padding）大小\n*   调整字体大小\n*   更改背景颜色\n\n让我们开发者工具检查按钮。我们将使用\
    \ Chrome，如图 5.2 所示，但你也可以使用任何类似的工具，例如 Firefox 中的 Firebug。`padding`、`font-size`\
    \ 和 `border-radius` 等属性来自 `btn` 类，而 `background` 属性通过 `btn-primary` 类应用。要修改它们，我们需要在\
    \ CSS 文件 `app.css` 中使用相同的选择器来覆盖这些属性。\n\n![在 Chrome 开发者工具中检查我们的按钮](img/ch5Image2.png)\n\
    \n图 5.2. 在 Chrome 开发者工具中检查我们的按钮\n\n打开 app.css 并添加以下 CSS：\n\n```\n.btn{\n    border-radius:\
    \ 0; \n    padding: 5px 10px;\n    font-size: 16px;\n}\n\n.btn-primary{\n    background:\
    \ #63AEF0;\n}\n```\n\n如果我们刷新页面，我们的按钮现在看起来应该像图 5.3 所示。\n\n![一个自定义的按钮](img/ch5Image3.png)\n\
    \n图 5.3. 自定义的按钮\n\n请注意，我们使用了 Bootstrap 类 `btn` 和 `btn-primary` 来覆盖 CSS 样式。从今以后，每当你使用\
    \ Bootstrap 按钮组件时，它将具有看起来像图 5.3 的更改样式。要恢复到原始样式，我们只需从 `app.css` 文件中删除 CSS 样式。\n\
    \n如果你只想更改网页中特定按钮的样式，而不是针对 Bootstrap 的选择器，请使用 ID 来应用 CSS 更改。\n\n### 使用 Less 自定义\
    \ Bootstrap\n\n如果你是 Less 开发者，你会喜欢这一节，因为有许多选项可以使用 Less 来自定义 Bootstrap。每个 Bootstrap\
    \ 组件都有一个 Less 文件，以便方便地更改它们的属性。要访问所有 Less 文件，你需要下载特定版本的 Bootstrap。访问 [`getbootstrap.com/getting-started/`](http://getbootstrap.com/getting-started/)\
    \ 并选择 Download Source（下载源码）。该源码包包含了编译后的和原始的 .less 文件。\n\nLess 文件位于名为 `less` 的文件夹中。在这里，你会发现许多根据\
    \ Bootstrap 组件命名的 .less 文件。与特定组件相关的所有 CSS 属性和值都存在相应的 .less 文件中。你还会发现一个名为 `bootstrap.less`\
    \ 的文件，这是主 .less 文件。它导入了文件夹内存在的所有 .less 文件。你只需要编译这个文件即可生成自定义的 Bootstrap 样式表。让我们对文件夹中的所有文件进行分类。\n\
    \n#### Bootstrap 的变量和混合宏\n\nBootstrap 中使用的所有变量和混合宏都存在两个不同的文件中：\n\n1.  `variables.less`\
    \ 包含了 Bootstrap 中使用的所有标准颜色、默认响应式宽度值、默认内边距和边距值。如果你想进行任何此类更改，需要处理此文件。\n2.  `mixins.less`\
    \ 包含了用于生成厂商前缀以及动态计算网格宽度、占位符、按钮大小等的混合宏。\n\n#### 重置文件\n\n有两个重置文件用于清除浏览器的默认设置：\n\n\
    1.  `normalize.less` 清除了许多浏览器的默认设置，如字体族、字体大小、内边距和外边距、标题标签默认值、表单元素样式等。\n2.  `print.less`\
    \ 包含了用于打印支持的媒体查询。\n\n#### 核心文件\n\n有七个核心 .less 文件：\n\n*   `scaffolding.less` 包含了所有图片的辅助类（如\
    \ `.img-responsive` 和 `.img-circle`）、链接元素各种状态的样式、水平线、用于屏幕阅读器的样式等。\n*   `type.less`\
    \ 是一个排版文件，包含了标题标签、段落标签以及其他内容相关的辅助类（如 `.lead`、`.text-muted` 等）的各种样式。\n*   `code.less`\
    \ 包含了用于设置网页上显示的任何代码样式的 CSS 属性。\n*   `grid.less` 涉及应用于 Bootstrap 网格系统的所有 CSS 值。\n\
    *   `tables.less` 具有装饰 `<table>` 元素的样式。它还定义了表格的各种辅助类，如 `.table-condensed`、`.table-bordered`\
    \ 等。\n*   `forms.less` 美化表单元素，如文本字段、图例、复选框、单选按钮等。\n*   `buttons.less` 包含了各种类型\
    \ Bootstrap 按钮的样式。所有与按钮相关的类都定义在这里。\n\n#### 组件文件\n\nBootstrap 中有 21 个组件文件。在前章中介绍的每个组件都有它们自己的\
    \ .less 文件。与组件相关的所有 CSS 定义都可以在其 .less 文件找到。\n\n*   `component-animations.less`\n\
    *   `glyphicons.less`\n*   `dropdowns.less`\n*   `button-groups.less`\n*   `input-groups.less`\n\
    *   `navs.less`\n*   `navbar.less`\n*   `breadcrumbs.less`\n*   `pagination.less`\n\
    *   `pager.less`\n*   `labels.less`\n*   `badges.less`\n*   `jumbotron.less`\n\
    *   `thumbnails.less`\n*   `alerts.less`\n*   `progress-bars.less`\n*   `media.less`\n\
    *   `list-group.less`\n*   `panels.less`\n*   `wells.less`\n*   `close.less`\n\
    \n"
- fmt: "\nThere's an additional file in this list that is not actually a component\
    \ in itself, `close.less`. It contains the CSS rules for the dismiss button used\
    \ in modals, alerts, and other elements to close this particular component.\n\n\
    ### Plugin Files\n\nThere are four `.less` files that define the CSS styles of\
    \ JavaScript plugins triggered or created using Bootstrap's markup:\n\n* `modals.less`\n\
    * `tooltip.less`\n* `popovers.less`\n* `carousel.less`\n\n### Utility Files\n\n\
    Finally, we have two utility files in Bootstrap:\n\n* `utilities.less`\n* `responsive-utilities.less`\n\
    \nThese files define classes that help us to better organize the Bootstrap components.\
    \ They have helpful classes such as `.clearfix` to clear a component from all\
    \ the elements present around it, and `.hide` and `.show` to toggle visibility\
    \ of components, for example. `responsive-utilities.less` contains visibility\
    \ utilities such as `.visible-lg` and `.hidden-sm`.\n\n### Overriding Styles Using\
    \ Less\n\nLet's use Less to override the style of a modal. We will customize `modals.less`\
    \ to apply a flat (metro-style) design, remove the rounded corners, and reduce\
    \ the shadow applied to it. We will also change the background color and text\
    \ color of the modal. Let's open `modals.less` and make these changes.\n\nThe\
    \ rounded corners to the modal are applied through the class `modal-content`.\
    \ Let's find this selector in `modals.less`. It should look like this:\n\n```\n\
    // Actual modal\n.modal-content {\n  position: relative;\n  background-color:\
    \ @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    \  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\nFrom the code, we can see that the rounded corners come\
    \ from the property `border-radius` whose value is a Less variable initialized\
    \ in `variables.less`. Let's comment out this line to remove rounded corners:\n\
    \n```\n// Actual modal\n.modal-content {\n  position: relative;\n  background-color:\
    \ @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    //  border-radius: @border-radius-large;\n  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\nNow, we have to reduce the amount of shadow. Analyzing\
    \ the code, we can see that the `.box-shdow()` mixin is responsible for producing\
    \ the shadow property in CSS. This mixin is defined in the `mixins.less` file,\
    \ and the shadow values are passed as a value to this mixin. Let's change this\
    \ value as per our requirement. The amount of shadow is defined by the third number\
    \ in the value, which is passed as the argument—it's 9px currently. Let's reduce\
    \ this number to 2px. Hence, our selector should now look like this:\n\n```\n\
    // Actual modal\n.modal-content {\n  position: relative;\n  background-color:\
    \ @modal-content-bg;\n  border: 1px solid @modal-content-fallback-border-color;\
    \ \n↵//old browsers fallback (ie8 etc)\n  border: 1px solid @modal-content-border-color;\n\
    \  border-radius: @border-radius-large;\n  .box-shadow(0 3px 2px rgba(0,0,0,.5));\n\
    \  background-clip: padding-box;\n  // Remove focus outline from opened modal\n\
    \  outline: 0;\n}\n```\n\nWe also need to change the `box-shadow` value in one\
    \ of the media queries, which overrides the previous changes. We'll learn about\
    \ media queries soon. But for now, you need to understand that Bootstrap has different\
    \ CSS rules for devices of unique sizes. So let's go ahead and find the following\
    \ media query in `modals.less`:\n\n```\n// Scale up the modal\n@media (min-width:\
    \ @screen-sm-min) {\n  // Automatically set modal's width for larger viewports\n\
    \  .modal-dialog {\n    width: @modal-md;\n    margin: 30px auto;\n  }\n  .modal-content\
    \ {\n    .box-shadow(0 5px 15px rgba(0,0,0,.5));\n  }\n\n  // Modal sizes\n  .modal-sm\
    \ { width: @modal-sm; }\n}\n```\n\nLet's pass the new `box-shadow` value to the\
    \ `.box-shadow()` mixin in this media query:\n\n```\n// Scale up the modal\n@media\
    \ (min-width: @screen-sm-min) {\n  // Automatically set modal's width for larger\
    \ viewports\n  .modal-dialog {\n    width: @modal-md;\n    margin: 30px auto;\n\
    \  }\n  .modal-content {\n    .box-shadow(0 5px 2px rgba(0,0,0,.5));\n  }\n\n\
    \  // Modal sizes\n  .modal-sm { width: @modal-sm; }\n}\n```\n\nLet's now change\
    \ the modal's background color. We'll use a predefined variable `@brand-info`\
    \ from `variables.less` as the background color of the modal. This variable is\
    \ initialized to `#5bc0de`, which is a light blue color. For the text color, let's\
    \ use the variable `@body-bg`, which is set to `#fff` in the same file. The modified\
    \ `modal-content` selector should now look:\n\n```\n// Actual modal\n.modal-content\
    \ {\n  position: relative;\n  background-color: @modal-content-bg;\n  border:\
    \ 1px solid @modal-content-fallback-border-color; \n↵//old browsers fallback (ie8\
    \ etc)\n  border: 1px solid @modal-content-border-color;\n  border-radius: @border-radius-large;\n\
    \  .box-shadow(0 3px 9px rgba(0,0,0,.5));\n  background-clip: padding-box;\n \
    \ // Remove focus outline from opened modal\n  outline: 0;\n\n  background: @brand-info;\n\
    \  color: @body-bg;\n\n}\n```\n\nWe have made all the customizations planned,\
    \ but let's make one final change to the `modal-backdrop` selector. `modal-backdrop`\
    \ is a transparent layer that appears behind the `modal-content` whenever the\
    \ modal component is triggered.\n\nLet's change the background color of this `modal-background`\
    \ from black to white:\n\n```\n// Modal background\n.modal-backdrop {\n  position:\
    \ fixed;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;\n  z-index: @zindex-modal-background;\n\
    \  background-color: @body-bg;\n  // Fade for backdrop\n  &.fade { .opacity(0);\
    \ }\n  &.in { .opacity(@modal-backdrop-opacity); }\n}\n```\n\nFinally, we are\
    \ done with all the customization. It's time to compile the `bootstrap.less` file\
    \ that imports `modals.less`. Once the `.less` file is compiled to generate `bootstrap.css`,\
    \ you can use this file in your project by replacing the old `bootstrap.css` (we\
    \ will discuss how to compile a Less file in the following section). Henceforth,\
    \ whenever you use the modal component it will use the customized style. In [Figure\
    \ 5.4](#ch05.html_custommodal \"Figure 5.4. Modal customized with Less\") is a\
    \ screenshot showing the customized modal component.\n\n![Modal customized with\
    \ Less](figures/ch5less-demo-8.png)\n\nFigure 5.4. Modal customized with Less\n\
    \n### Compiling Less\n\nCompiling Less is relatively straightforward. Here, I\
    \ am going to show you some of the standard ways of doing it.\n\n#### Using Node\n\
    \nIf you have Node installed, you can use Node's package manager to install the\
    \ `less` compiler:\n\n```\n$ npm install -g less\n```\n\nOnce `less` is installed,\
    \ use the following command to compile `bootstrap.less` into `bootstrap.css`.\
    \ You have to navigate to the `/less` folder using the command prompt and then\
    \ type this command:\n\n```\n$ lessc bootstrap.less > bootstrap.css\n```\n\n###\
    \ Using Third-party Software\n\nThere are plenty of GUI applications for writing\
    \ and compiling Less code. Some of the popular options include [Crunch!](http://crunchapp.net/),\
    \ [SimpLESS,](http://wearekiss.com/simpless) and [Mixture.](http://mixture.io/)\n"
