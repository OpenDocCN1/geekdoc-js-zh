    在本章中，我们将学习 Bootstrap 的基础知识，并理解它如何加速 Web 开发流程。我们将首先简要回顾 CSS 框架的历史，然后解释“响应式网页设计”（`Responsive
    Web Design`，简称 `RWD`）这一术语。最后，我们将学习如何设置一个新的 Bootstrap 项目，并使用它创建我们的第一个基础网页项目。


    ## 什么是 Bootstrap？


    Bootstrap 是一个前端框架，帮助开发者快速启动 Web 开发流程。对于从 `Java` 或 `PHP` 等硬核服务器端编程语言转向前端开发的开发者来说，可能会发现掌握
    CSS 和 JavaScript 非常困难；然而，通过 Bootstrap，他们只需要专注于编写正确的 HTML，将复杂的 CSS 和 JavaScript
    留给 Bootstrap 即可。


    Bootstrap 不仅对新手 Web 开发者有用。随着本书的进行，你会发现 Bootstrap 也能为专家级程序员带来益处。


    ## 它为什么存在？


    想象一下，你必须设计一个具有吸引人的导航栏、时尚的按钮、精美的排版、文本和图像占位符、大尺寸图片轮播器等的网站——但你并不是前端开发专家。但是，如果这些功能已经为你写好了代码，你只需要写一点
    HTML 就可以使用它们呢？这就是 Bootstrap。


    所有需要的 CSS 类和 JavaScript 代码已经包含在 Bootstrap 安装包中了。例如，使用类 `btn` 配合链接（`<a></a>`）元素将使它们看起来像如图
    1.1 所示的按钮。此外，在链接上使用 `btn-primary` 类将使其变成一个深蓝色按钮：


    ```html

    <a href="http://www.google.com" class="btn btn-primary">

    Visit Google

    </a>

    ```


    ![使用 Bootstrap 创建按钮](img/ch1Image1.png)


    图 1.1. 使用 Bootstrap 创建按钮


    然而，Bootstrap 不仅仅是装饰链接、图像和排版。它最重要的功能之一是`网格系统`。没有网格系统，你就无法创建一个移动端友好且响应式的网站。我们将在本章后面讨论响应式网页设计和网格系统。


    ## 它能如何帮助我？


    正如我提到的，Bootstrap 是新手设计师的加分项，但并不限于新手。专家也可以将 Bootstrap 的代码作为基础来创建新东西。Bootstrap 允许你通过使用
    [Less](http://lesscss.org/) 和 [Sass](http://sass-lang.com/) 来自定义其样式。熟悉这些技术的开发者可以完全修改
    Bootstrap 的默认外观和感受。自定义 Bootstrap 有多种方法，我们将在后面的章节 中介绍这些方法。


    ## CSS 框架的历史


    这一切始于 2006-07 年左右如 [YUI](http://yuilibrary.com/)（雅虎用户界面库）和 [Blueprint](http://www.blueprintcss.org/)
    等 CSS 框架的流行。它们带来了许多基础资源，如 CSS 重置（CSS reset）、字体、网格、动画效果、按钮等。开发者开始意识到，这些框架对于处理开发网站时所需的许多繁燥重复任务非常有用，而且它们的使用可以极大地缩短开发周周期。


    在这些基础 CSS 框架之后，是一代“全功能”前端框架，例如 Bootstrap，它将 JavaScript 也引入其中。Bootstrap 将常用的 CSS
    和 JavaScript 组件组合在一起，满足了许多基本的开发需求，例如创建轮播图、制作弹出效果和下拉菜单。


    Bootstrap 封装了许多可以轻松用于网站项目的实用组件。它为每个组件都使用标准的 HTML 标记。通过 Bootstrap，开发者只需专注于编写框架可以理解并相应渲染的正确
    HTML 标记即可。


    ### CSS 原型的需求


    拥有一个良好的 CSS 框架的主要原因是简化开发流程。每位 Web 设计师在开发网站时都会执行许多常见任务。诸如清除浏览器重置、为网站布局创建正确的网格系统以及分配排版规则等任务，如果在每个项目中重复执行，可能会变得令人沮丧且耗费时间。一个良好的
    CSS 框架提供了一套强大的工具，可以简化这些任务。


    良好的 CSS 框架的一些主要亮点包括：


    * 更快的开发

    * 组织良好且易于维护的代码

    * 让你把时间花在创新上，而不是重复造轮。


    ## Bootstrap 的起源


    Bootstrap 由 Mark Otto 和 Jacob Thornton 在 2011 年开发，他们 Twitter 的两位 Web 开发者。他们的主要关注点是保持代码的一性和可维护性。


    以下是来自 [Mark Otto 博客](http://markdotto.com/) 关于 Bootstrap 诞生的引言：


    > ... 我和一极少数的开发者聚在一起设计并构建了一个新的内部工具，并看到了一个做更多事情的机会。在这个过程中，我们看到自己构建了比另一个内部工具实质得多的东西。几个月后，我们得到了
    Bootstrap 的早期版本，作为在公司内部记录和共享常用设计模式和资产的方式。


    Bootstrap 1.0.0 于 2011 年发布，仅包含 CSS 和 HTML 组件。直到 Bootstrap 1.3.0 版本之前，它都没有包含任何
    JavaScript 插件，该版本也兼容 IE7 和 IE8。


    2012 年迎来了 Bootstrap 2.0.0 的另一个重大更新。它是 Bootstrap 库的完全重写，同时也成为了一个响应式框架。它的组件兼容各种设备——手机、平板电脑和桌面电脑——并且安装包中包含了许多新的
    CSS 和 JavaScript 插件。


    2013 年的 Bootstrap 3 在另一个重大更新后是另一个重大发布，成为一个“移动优先且始终响应”的框架。在框架早期版本中，制作响应式网站是可选的。在
    2013 年的版本中，类名和项目结构发生了变化。但请注意，`Bootstrap 3 不向下兼容`。你无法通过替换核心 CSS 和 JavaScript 文件直接迁移到此版本。


    如果你想查看 Bootstrap 的完整历程，[查看 GitHub 上的历史发布](https://github.com/twbs/bootstrap/releases)。它还显示了每个版本所做的更改。


    今天，Bootstrap 有庞大的全球开发者社区在 GitHub 上为其代码库做出贡献。在 Stack Overflow 社区也有活跃讨论，标签如 [bootstrap](http://stackoverflow.com/tagged/bootstrap)、[twitter-bootstrap](http://stackoverflow.com/tagged/twitter-bootstrap)
    和 [twitter-bootstrap-3](http://stackoverflow.com/tagged/twitter-bootstrap-3)。


    Bootstrap 已成为今天最受青的技术之一。如果你是一名全栈开发者，它是必不可少的，正如来自 Indeed.com 的图 1.2 截图所示。


    ![Bootstrap 技能趋势](img/ch1Image13.png)


    图 1.2. Bootstrap 技能趋势


    在编写时，Bootstrap 3.1.1 是最新版本。因此，本书的内容和代码将兼容 Bootstrap 3.1.1 及以上版本。


    ## Bootstrap 的竞争对手


    在前端框架领域，还有许多其他与 Bootstrap 竞争的流行框架。包括：


    * [Zurb 的 Foundation 框架](http://foundation.zurb.com/)

    * [Semantic UI](http://semantic-ui.com/)

    * [Gumby 框架](http://gumbyframework.com/)

    * [Yahoo 的 Pure](http://purecss.io/)


    ## 谁在使用 Bootstrap？


