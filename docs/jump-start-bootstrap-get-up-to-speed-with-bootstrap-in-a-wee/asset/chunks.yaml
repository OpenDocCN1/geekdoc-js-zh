    # 第 2 章\n\n## Bootstrap 网格系统\n\n在本章中，我们将发现 Bootstrap 最重要的功能之一：`grid system`（网格系统）。我们将学习网格系统是如何工作的，以及我们如何在我们的中使用中使用它。我们还将创建一些示例网站布局以便更好地理解它。\n\
    \n### 什么是网格系统？\n\n`grid system` 允许我们妥妥地安置网站内容。它将屏幕分为多个行和列，这些列可以创建各种类型的布局。一旦定义了行和列，我们就可以决定将\
    \ HTML 元素放置在什么位置。\n\nBootstrap 的网格系统将屏幕分为列——每行最多 12 列。列的宽度根据其显示的屏幕尺寸而变化。因此，Bootstrap\
    \ 的网格系统是 `responsive`（响应式的），当浏览器窗口大小变化时，列会动态调整自身的大小。你可以根据设计需求创建无限数量的行。这些行和列的交叉点形成了一个矩形网格，用于包含网站内容。\n\
    \n例如，在图 2.1 中，我创建了一行，然后使用网格系统将其划分为 12 列。我更改了每一列的背景颜色以使它们区分开。这里的每一列都由一个数字表示。\n\n\
    ![显示 12 列网格的示例页面](img/ch2Image1.png)\n\n图 2.1. 显示 12 列网格的示例页面\n\n### 构建基础网格\n\n\
    在这一节中，我们将使用 Bootstrap 的网格系统创建第一个网站布局。我们将使用在上一章中创建的相同 Bootstrap 设置 `Bootstrap_demos`。复制\
    \ `Bootstrap_demos` 文件夹内的所有文件。然后创建一个名为 `chapter_2` 的新文件夹并将这些文件粘贴到里面。\n\n现在打开 `index.html`，将页面标题改为“Bootstrap\
    \ Grid System”，并从 `body` 中移除 `h1` 标签。我们现在应该有一个像这样的基础 HTML 页面：\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, \n↵initial-scale=1\">\n\n    <title>Bootstrap\
    \ Grid System</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    css/bootstrap.css\">\n\n    <!--[if lt IE 9]>\n      <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n\
    ↵3.7.0/html5shiv.js\"></script>\n      <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    ↵1.4.2/respond.min.js\"></script>\n    <![endif]-->\n\n  </head>\n  <body>\n \
    \       <!-- Body 内容放在这里 -->\n\n        <script src=\"js/jquery.js\"></script>\n\
    \        <script src=\"js/bootstrap.js\"></script>\n  </body>\n</html>\n```\n\n\
    Bootstrap 建议我们将所有的行和列放在一个容器（container）中，以确保正确的对齐和内边距。Bootstrap 中有两种类型的容器类：`container`\
    \ 和 `container-fluid`。前者在浏览器窗口中创建一个固定宽的容器，而后者创建一个全宽的流体容器。固定宽度容器被设计为显示在屏幕中央，忽略掉两侧的多余空间。因此，将所有内容封装在容器内是一个良好的做法。\n\
    \n我们将在演示中使用固定宽的 `container`。让我们在 HTML 页面中创建一个容器：\n\n```html\n<div class=\"container\"\
    >\n</div>\n```\n\n接下来，我们将在容器内部创建一个行。一旦定义了行，我们就可以开始创建列。Bootstrap 有一个用于创建行的类 `row`：\n\
    \n```html\n<div class=\"container\">\n    <div class=\"row\">\n    </div>\n</div>\n\
    ```\n\n你 你可以创建无限数量的行，但它们必须放置在容器内。为了更好的效果，建议使用一个包含所有行的单个容器。\n\n在 Bootstrap 中，列的创建是通过指定你希望跨越\
    \ 12 个可用列中的多少列来实现的。假设我们想要单列。它应该跨越所有 12 个可用列。为此，我们将使用类 `col-xs-12`，其中数字 `12` 指定了跨越的列数（现在你可以忽略类名中的\
    \ `xs` 词；我们稍后会讨论）。\n\n同样，为了在行中创建两个等宽的列，我们将为每一列使用 `col-xs-6` 类。这告诉 Bootstrap 我们想要两个跨越\
    \ 6 个 Bootstrap 列的列，如下：\n\n```html\n<div class=\"container\">\n    <div class=\"\
    row\">\n        <div class=\"col-xs-6\">\n            <h4>Column 1</h4>\n    \
    \    </div>\n        <div class=\"col-xs-6\">\n            <h4>Column 2</h4>\n\
    \        </div>\n    </div>\n</div>\n```\n\n结果可以见图 2.2。\n\n![我们的两个等宽的列](img/ch2Image2-1.png)\n\
    \n图 2.2. 我们的两个等宽的列\n\n为了让列更加清晰，让我们为每一列分配一个背景颜色。我们将在项目的 CSS 文件夹创建一个名为 `styles.css`\
    \ 的新 CSS 文件。这不是一个标准文件名，你可以随意命名。接下来，我们将在 `index.html` 中通过 `head` 元素内的 `link` 元素链接此文件：\n\
    \n"
- fmt: "\n```\n<link href=\"css/styles.css\" rel=\"stylesheet\">\n```\n\nLet's drop\
    \ some CSS into this file to make each column have a different background color:\n\
    \n```\n.col1{\n    background: #5C7080;\n}\n\n.col2{\n    background: #6BC0FF;\n\
    }\n```\n\nWe also have to add the classes `col1` and `col2` in our markup so that\
    \ the columns pick their respective CSS styling. The updated markup is as follows:\n\
    \n```\n<div class=\"container\">\n    <div class=\"row\">\n        <div class=\"\
    col-xs-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n        <div\
    \ class=\"col-xs-6 col2\">\n            <h4>Column 2</h4>\n        </div>\n  \
    \  </div>\n</div>\n```\n\n![A two-column layout with background color styling](figures/ch2Image2-2.png)\n\
    \nFigure 2.3. A two-column layout with background color styling\n\nBut what does\
    \ the `xs` stand for in the class `col-xs-6`? Bootstrap has four types of class\
    \ prefixes for creating columns for different size displays:\n\n1. `col-xs` for\
    \ extra small displays (screen width < 768px)\n2. `col-sm` for smaller displays\
    \ (screen width ≥ 768px)\n3. `col-md` for medium displays (screen width ≥ 992px)\n\
    4. `col-lg` for larger displays (screen width ≥ 1200px)\n\nWhen we specify the\
    \ class `col-xs-12`, it means the element should span all 12 of the available\
    \ Bootstrap columns on extra small screens. But what about larger displays? In\
    \ the above code, we haven't specified how the div should behave on larger screen\
    \ types. Fortunately, Bootstrap will automatically follow the layout specified\
    \ for the smallest screen size. Hence, our div will span 12 columns in all types\
    \ of displays in this code.\n\nLet's examine the following markup:\n\n```\n<div\
    \ class=\"container\">\n    <div class=\"row\">\n        <div class=\"col-xs-12\
    \ col-sm-6 col1\">\n            <h4>Column 1</h4>\n        </div>\n        <div\
    \ class=\"col-xs-12 col-sm-6 col2\">\n            <h4>Column 2</h4>\n        </div>\n\
    \    </div>\n</div>\n```\n\nIn this code we have used the class `col-xs-12` for\
    \ an extra small display and class `col-sm-6` for a smaller sized display. Hence,\
    \ each column in an extra small-sized display will occupy all the 12 available\
    \ Bootstrap columns, which will appear as a stack of columns. Yet on a smaller\
    \ display, they will occupy only six Bootstrap columns each to achieve a two-column\
    \ layout as shown in [Figure 2.4](#ch02.html_smallscreenlayout \"Figure 2.4. The\
    \ layout on smaller screens\").\n\n![The layout on smaller screens](figures/ch2Image3-1.png)\n\
    \nFigure 2.4. The layout on smaller screens\n\nLet's add another row of columns\
    \ in the previous code. We'll replicate the same markup that was used to create\
    \ a row in the code. The final markup for two rows and four columns in our layout\
    \ is as follows:\n\n```\n<div class=\"container\">\n    <div class=\"row\">\n\
    \        <div class=\"col-xs-12 col-sm-6 col1\">\n            <h4>Column 1</h4>\n\
    \        </div>\n        <div class=\"col-xs-12 col-sm-6 col2\">\n           \
    \ <h4>Column 2</h4>\n        </div>\n    </div>\n    <div class=\"row\">\n   \
    \     <div class=\"col-xs-12 col-sm-6 col3\">\n            <h4>Column 3</h4>\n\
    \        </div>\n        <div class=\"col-xs-12 col-sm-6 col4\">\n           \
    \ <h4>Column 4</h4>\n        </div>\n    </div>\n</div>\n```\n\nI have added two\
    \ new classes, `col3` and `col4`, to give our columns different background colors:\n\
    \n```\n.col3{\n    background: #E8AA4C;\n}\n\n.col4{\n    background: #FF384E;\n\
    }\n```\n\nAnd here's the result, shown in [Figure 2.5](#ch02.html_fourcols \"\
    Figure 2.5. A two-row, four-column layout\").\n\n![A two-row, four-column layout](figures/ch2Image4-1.png)\n\
    \nFigure 2.5. A two-row, four-column layout\n\n## Case Study: Creating a Dynamic\
    \ Layout\n\nLet's see how to put the grid system into practice, creating a dynamic\
    \ layout that adjusts to the size of device it is viewed in.\n\nSuppose we have\
    \ to create a blog layout using the Bootstrap framework. We're given the wireframe\
    \ shown in [Figure 2.6](#ch02.html_wireframedesktop \"Figure 2.6. A wireframe\
    \ of the site as it should appear on desktop displays\") for the desktop display.\n\
    \n![A wireframe of the site as it should appear on desktop displays](figures/ch2wireframe-desktop.png)\n\
    \nFigure 2.6. A wireframe of the site as it should appear on desktop displays\n\
    \nIn the wireframe, we have a header that spans across the width of the whole\
    \ website. Then we have a three-column layout containing blog posts. If we view\
    \ the same layout in a tablet (portrait mode), it will look very clumsy. Hence,\
    \ we have a redesigned the wireframe for tablet mode, as shown in [Figure 2.7](#ch02.html_wireframetablet\
    \ \"Figure 2.7. A wireframe of the site as it should appear on tablet displays\"\
    ).\n\n![A wireframe of the site as it should appear on tablet displays](figures/ch2wireframe-tablet.png)\n\
    \nFigure 2.7. A wireframe of the site as it should appear on tablet displays\n\
    \nIn this design, we see that the header looks the same as in desktop mode. The\
    \ posts underneath are now contained in a two-column layout instead of three.\
    \ Next, we'll need to view the same website on mobile devices. The wireframe for\
    \ a mobile display is shown in [Figure 2.8](#ch02.html_wireframemobile \"Figure\
    \ 2.8. A wireframe of the site as it should appear on mobile displays\").\n\n\
    ![A wireframe of the site as it should appear on mobile displays](figures/ch2wireframe-mobile.png)\n\
    \nFigure 2.8. A wireframe of the site as it should appear on mobile displays\n\
    \nWe have just converted the two columns into one column in a mobile design.\n\
    \nLet's discuss how to achieve this design in our markup.\n\n### Designing for\
    \ Desktops\n\nAs stated, medium-sized displays are considered larger than 992px.\
    \ Desktop displays are mostly larger than this size. Thus, we will be using the\
    \ class with prefix `col-md` to lay out the columns in desktop displays. This\
    \ layout will also be followed in larger displays that are larger than 1200px,\
    \ so for this design we can ignore adding classes with prefix `col-lg` as they'd\
    \ have no additional effect on the layout.\n\nCreate a new HTML file called `blog.html`.\
    \ Paste the basic HTML structure with Bootstrap set up, as stated in the [previous\
    \ chapter](#ch01.html \"Chapter 1Up, Close, and Personal with Bootstrap\"). Change\
    \ the content of the `<title>` tag to “My First Bootstrap Website” and remove\
    \ the `<h1` tag from the body. The markup for `blog.html` should look like this:\n\
    \n```\n<!DOCTYPE html>\n    <html lang=\"en\">\n      <head>\n        <meta charset=\"\
    utf-8\">\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n\
    \        <meta name=\"viewport\" content=\"width=device-width, \ninitial-scale=1\"\
    >\n\n        <title>My First Bootstrap Website</title>\n        <link rel=\"stylesheet\"\
    \ type=\"text/css\" \nhref=\"css/bootstrap.css\">\n\n        <!--[if lt IE 9]>\n\
    \          <script src=\"https://oss.maxcdn.com/libs/html5shiv/\n3.7.0/html5shiv.js\"\
    ></script>\n          <script src=\"https://oss.maxcdn.com/libs/respond.js/\n\
    1.4.2/respond.min.js\"></script>\n        <![endif]-->\n\n      </head>\n    \
    \  <body>\n            <!-- Body content goes here -->\n\n            <script\
    \ src=\"js/jquery.js\"></script>\n            <script src=\"js/bootstrap.js\"\
    ></script>\n      </body>\n    </html>\n```\n\nWe need to first make a container\
    \ to hold all the blog's content. Let's go with a fixed-width container using\
    \ the class `container`:\n\n```\n<div class=\"container\">\n</div>\n```\n\nNext,\
    \ we have a header as per the desktop wireframe. Let's create a row with a single\
    \ column that spans across all 12 Bootstrap columns.\n\n```\n<div class=\"container\"\
    >\n    <div class=\"row\">\n        <div class=\"col-md-12 text-center\">\n  \
    \          <h1>My First Bootstrap Blog</h1>\n        </div>\n    </div>\n</div>\n\
    ```\n\nIn the above code, I've used Bootstrap's helper class `text-center` to\
    \ align the text inside the column. We're now done with the header.\n\nNow to\
    \ create a three-column layout that will hold the blog posts. Since we have a\
    \ total of 12 Bootstrap columns to use, we'll let our columns span across four\
    \ Bootstrap columns each. This way we'll have three equally sized columns. Let's\
    \ devise a new `row` and start building columns with the class `col-md-4`:\n"
