- fmt: '

    In this chapter, we’ll learn the basics of Bootstrap and understand how it can
    speed up the web development process. We’ll start with a brief overview of the
    history of CSS frameworks and then move on to explain the term `Responsive Web
    Design`, or `RWD`. Finally, we’ll see how to set up a new Bootstrap project and
    use it to create our first basic web page.


    ## What is Bootstrap?


    Bootstrap is a front-end framework that helps developers to jump start the web
    development process. Developers who are moving to front-end development from hardcore
    server-side programming languages such as `Java` or `PHP` can find it very difficult
    to come to grips with CSS and JavaScript; however, with Bootstrap they only have
    to concentrate on writing proper HTML, leaving the tricky CSS and JavaScript to
    Bootstrap.


    Bootstrap is not only useful for novice web developers. As we proceed throughout
    the book, you will come to see how Bootstrap can be a boon for expert coders too.


    ## Why Does It Exist?


    Imagine you have to design a website with an attractive navigation bar, stylish
    buttons, nice typography, placeholders for texts and images, a big image slider,
    and more—yet you aren’t a front end development expert. But what if these features
    were already coded for you, and you just had to write a little HTML to use them?
    This is Bootstrap.


    All the CSS classes and JavaScript code needed are already included in the Bootstrap
    package. For example, using the class `btn` with link (`<a></a>`) elements will
    make them appear like a button as seen in [Figure 1.1](#ch01.html_makeabutton
    "Figure 1.1. Creating a button with Bootstrap"). Additionally, using the `btn-primary`
    class with a link will make it a dark blue button:


    ```html

    <a href="http://www.google.com" class="btn btn-primary">

    Visit Google

    </a>

    ```


    ![Creating a button with Bootstrap](figures/ch1Image1.png)


    Figure 1.1. Creating a button with Bootstrap


    Yet Bootstrap is more than just decorating links, images and typography. One of
    its most important features is the `grid system`. You cannot create a mobile-friendly
    and responsive website without the grid system. Weʼll discuss responsive web design
    and the grid system later in this chapter.


    ## How Can It Help Me?


    As I’ve mentioned, Bootstrap is a plus for a novice designer, but it’s not restricted
    to novices. Experts can also use Bootstrap’s code as a base to create something
    new. Bootstrap allows you to customize its styles through the use of [Less](http://lesscss.org/)
    and [Sass](http://sass-lang.com/). Developers acquainted with these technologies
    can completely modify Bootstrap’s default look and feel. There are multiple ways
    of customizing Bootstrap, and we’ll look at these in a [later chapter](#ch05.html
    "Chapter 5Diving Deep: Customizing Bootstrap").


    ## History of CSS Frameworks


    It all started when CSS frameworks like [YUI](http://yuilibrary.com/) (Yahoo User
    Interface Library) and [Blueprint](http://www.blueprintcss.org/) became popular
    around 2006-07. They brought with them many fundamental resources like CSS reset,
    fonts, grids, animation effects, buttons, and so on. Developers began to realize
    that these frameworks were useful for dealing with many of the tedious repetitive
    tasks required to develop a website, and that their use could greatly improve
    development turnaround time.


    These basic CSS frameworks were followed by a generation of “full fledged” front-end
    frameworks, such as Bootstrap, which added JavaScript to the mix. Bootstrap combined
    commonly used CSS and JavaScript components together, catering to many basic development
    requirements, such as creating sliders, making pop-up effects, and drop-down menus.


    Bootstrap encapsulates many useful components that can be easily employed in website
    projects. It uses standard HTML markup for each component. With Bootstrap, developers
    have only to focus on writing proper HTML markup that the framework can understand
    and render accordingly.


    ### The Need for CSS Prototyping


    The main reason for having a good CSS framework is to ease the development process.
    There are many common tasks that every web designer carries out while developing
    a website. Tasks such as clearing browser resets, creating a proper grid system
    for website layout, and assigning typography rules can become frustrating and
    time-consuming if done repeatedly for every project. A good CSS framework provides
    a powerful set of tools that streamline these tasks.


    Some of the main highlights of a good CSS framework include:


    * faster development

    * organized and maintainable code

    * allowing you to spend time on innovation rather than reinventing the wheel.


    ## The Origins of Bootstrap


    Bootstrap was developed in 2011 by Mark Otto and Jacob Thornton, a pair of web
    developers at Twitter. Their main focus was to bring consistency and maintainability
    in their code.


    Here’s a quote from [Mark Otto’s blog](http://markdotto.com/) about the genesis
    of Bootstrap:


    > ... [A] super small group of developers and I got together to design and build
    a new internal tool and saw an opportunity to do something more. Through that
    process, we saw ourselves build something much more substantial than another internal
    tool. Months later, we ended up with an early version of Bootstrap as a way to
    document and share common design patterns and assets within the company.


    Bootstrap 1.0.0 was launched in 2011 with only CSS and HTML components. There
    were no JavaScript plugins included in it until Bootstrap 1.3.0, a version that
    was also compatible with IE7 and IE8.


    2012 saw another major update with Bootstrap 2.0.0. It was a complete rewrite
    of the Bootstrap library, as well as becoming a responsive framework. Its components
    were compatible with all kinds of devices—mobiles, tablets and desktops—and lots
    of new CSS and JavaScript plugins were included in the package.


    After 15 major updates, Bootstrap 3 in 2013 was another significant release, becoming
    a “Mobile First and always responsive” framework. In the earlier versions of the
    framework, making a responsive website was optional. In the 2013 release, there
    were changes in the names of the classes and also in the folder structure of the
    project. Be aware, though, that `Bootstrap 3 is not backward compatible`. You
    cannot directly migrate to this version by replacing the core CSS and JavaScript
    files.


    If you want to have a look at the complete journey of Bootstrap, [check out historical
    releases on GitHub.](https://github.com/twbs/bootstrap/releases) It also shows
    the changes that were made to each version.


    Today, Bootstrap has a huge global community of developers who regularly contribute
    to its code base at GitHub. It also has an active discussion at the Stack Overflow
    community with tags such as [bootstrap](http://stackoverflow.com/questions/tagged/bootstrap),
    [twitter-bootstrap](http://stackoverflow.com/questions/tagged/twitter-bootstrap)
    and [twitter-bootstrap-3](http://stackoverflow.com/questions/tagged/twitter-bootstrap-3).


    Bootstrap has become one of the most sought after technologies today. It is a
    must-have if you are a full-stack developer, as show by the screenshot in [Figure
    1.2](#ch01.html_indeedjobtrends "Figure 1.2. Bootstrap skills in demand") from
    Indeed.com’s Bootstrap job trends.


    ![Bootstrap skills in demand](figures/ch1Image13.png)


    Figure 1.2. Bootstrap skills in demand


    At the time of writing, Bootstrap 3.1.1 is the latest version. Hence, the book’s
    content and code will be compatible with Bootstrap 3.1.1 and above.


    ## Bootstrap’s Competition


    There are many other popular frameworks that are competing with Bootstrap in the
    front-end framework arena. Some of them are:


    * [Foundation framework by Zurb](http://foundation.zurb.com/)

    * [Semantic UI](http://semantic-ui.com/)

    * [Gumby framework](http://gumbyframework.com/)

    * [Pure by Yahoo](http://purecss.io/)


    ## Who Uses Bootstrap?

