    \n## Overview of Responsive Web Design\n\n**Responsive web design** allows developers\
    \ to create a website that can change its layout on the go. Developers can then\
    \ create a single design that works on any kind of device: mobiles, tablets, smart\
    \ TVs, and PCs.\n\nSites designed responsively are generally fluid designs. They\
    \ readjust themselves according to the size of the screen they are viewed in and\
    \ are also compatible with the touch interfaces of mobile devices. Using responsive\
    \ web design, developers can create powerful web apps that replace native apps\
    \ on platforms such as iOS and Android.\n\n### Adjusting a Layout Based on Screen\
    \ Size\n\nLetʼs check out an example to better understand this concept. Suppose\
    \ we have the layout shown in [Figure 1.3](#ch01.html_mywebsite \"Figure 1.3. Our\
    \ layout for a desktop screen\") for a desktop screen.\n\n![Our layout for a desktop\
    \ screen](figures/ch1Image8.png)\n\nFigure 1.3. Our layout for a desktop screen\n\
    \nWe have three main sections in our desktop layout: the header, the content section,\
    \ and the footer area. The header section contains a logo and a rectangular ad.\
    \ The content section contains four smaller posts placed side by side horizontally.\
    \ We then have two bigger posts placed underneath the smaller posts. Finally,\
    \ we have a footer section in which there is simple copyright text.\n\nIt is obvious\
    \ that weʼre unable to easily view this page on our tablets and cell phones as\
    \ it will fail to fit the screen properly. The design needs to be customized for\
    \ those users.\n\nLetʼs suppose we have used Bootstrap to create the desktop layout.\
    \ We have used its grid system to create a responsive design so that the layout\
    \ will automatically adjust to suit tablets and mobile devices.\n\nOn tablet devices,\
    \ the layout will appear as shown in [Figure 1.4](#ch01.html_mywebsitetablet \"\
    Figure 1.4. Our layout adjusted for tablet screens\"). The ad has been hidden\
    \ from the header section and the logo has been centered. The layout fits perfectly.\n\
    \n![Our layout adjusted for tablet screens](figures/ch1Image9.png)\n\nFigure 1.4. Our\
    \ layout adjusted for tablet screens\n\nIn the smartphone view, shown in [Figure 1.5](#ch01.html_mywebsitesmartphone\
    \ \"Figure 1.5. Our layout adjusted for smartphones\"), we can see that the header\
    \ section continues to follow the tablet view but thereʼs a major change in the\
    \ content section. The posts reflow themselves to the bottom forming two rows,\
