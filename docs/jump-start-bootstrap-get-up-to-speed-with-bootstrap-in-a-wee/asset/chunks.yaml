    \ result can be seen in [Figure 3.2](#ch03.html_headercontainer \"Figure 3.2. Our\
    \ header in a container\").\n\n![Our header in a container](figures/ch3Image2.png)\n\
    \nFigure 3.2. Our header in a container\n\nIf you want to add a subtitle beside\
