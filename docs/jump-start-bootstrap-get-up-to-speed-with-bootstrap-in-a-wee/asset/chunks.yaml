    \ create multiple levels of nested comments using it.\n\nThe markup for creating\
    \ a media object is:\n\n```\n<div class=\"media\">\n    <a class=\"pull-left\"\
    \ href=\"#\">\n        <img class=\"media-object\" src=\"path/to/image\" \n↵alt=\"\
    Syed Fazle Rahman\">\n    </a>\n    <div class=\"media-body\">\n        <h4 class=\"\
    media-heading\">Awesome piece of work!</h4>\n        <p>Lorem ipsum dolor sit\
    \ amet, consectetur ...</p>\n    </div>\n</div>\n```\n\nTo produce a media object\
    \ you need to create a div with a class of `media`. Then you put two necessary\
    \ components within it: the **media** itself (here it's an image) and the `media-body`.\
    \ As seen from the code snippet, the media should have the class `media-object`\
    \ and be wrapped within an `<a></a>` tag. You can then align the media to either\
