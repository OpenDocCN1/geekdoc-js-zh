    # A Lazy Range Function


    ![](img/522b962b8325a030575a3d72d330a848_64_0.png)


    Ranges are a functional pattern that is often used in purely functional languages.
    When you have no variables to declare, you still need a way to iterate for a specific
    amount of times. Ranges fill this gap by providing a way to create a sequence
    of numbers that can be iterated over. A lazy range now takes this one step further
    and only emits numbers when one is needed. This means that at any point in time,
    only one number is in memory, while old numbers can be thrown away as soon as
    they are consumed.

    In JavaScript, a simple for loop with a loop variable does basically the same,
    only that it increments its loop variable each time. Sometimes, however, you want
    to eliminate imperative constructs like for-loops with a large header, and rely
    on functional concepts as much as possible. In this case, a range function is
    a valid alternative, and when the “Iterator Helpers” proposal finally enters stage
    3, you will also be able to use map, flatMap, filter, etc. on iterators, as well,
    which would also include this lazy range.


    66'
