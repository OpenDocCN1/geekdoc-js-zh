  md: '# # Sorting Numbers Correctly


    ![](img/522b962b8325a030575a3d72d330a848_45_0.png)


    JavaScript''s behavior is pretty unique when it comes to sorting, but there is
    a relatively simple reason for it. If you ever tried to call sort() on an array
    of numbers, you might have been surprised to see that the numbers are not sorted
    like you would expect them to be. This is because JavaScript is dynamically typed.
    An array can contain elements of many different types, and there is only one universal
    type that covers all other possible types, a string. This is why sort(), when
    called without a callback, converts the elements to strings and then compares
    them lexically. [1, 2, 11, 21] thus becomes [1, 11, 2, 21] when sorted. You can
    fix this by passing a callback to sort(), and the logic it expects is as follows:
    If a > b, return a positive number. If a < b, return a negative number. If a ===
    b, return 0. a - b does exactly this. When you pass this callback, you''ll easily
    sort your array of numbers in ascending order. If you want a descending order,
    b - a is your way to go.


    47'
