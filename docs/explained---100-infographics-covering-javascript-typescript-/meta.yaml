    flat is an interesting array method. Its primary use case is to take a multi-dimensional
    array and flat it by one or multiple dimensions. The levels are defined by the
    number you pass in as its argument. A three-dimensional array, flattened with
    .flat(1), would thus become a two-dimensional array, etc.


    Where is that useful? First, when you deal with multi-dimensional arrays, you
    need to flat. But another use case is the one shown above. When a function accepts
    many parameters that might also contain arrays, and you all want them in one,
    long one-dimensional array, you can use a utility function like above to flat
    them all. Infinity is the unique argument here, as it''s greater than any other
    number in JavaScript. This leads to flat working for so long until it finds no
    more nested arrays within the original one.'
- md: "## Array Destructuring\n\n![](img/522b962b8325a030575a3d72d330a848_9_0.png)\n\
    \nES6 introduced not only the destructuring assignment for objects but also the\
    \ same for arrays. It nearly works the same way as for objects but uses square\
    \ brackets instead of curly braces. The use case is the same as for objects. When\
    \ you want to extract multiple values from an array, you usually need multiple\
    \ lines for that. One line, one element extracted. A destructuring statement lets\
    \ you do this in one line and even allows you to skip elements in-between. You\
    \ use it by first placing a let or const in the front, then use an opening square\
    \ bracket and define the values you want to extract. The first variable is assigned\
    \ the element at index 0 of the array, the second variable the element at index\
    \ 1, and so on. Then you close the left side with a square bracket, followed by\
    \ an equal sign, and the path to the array to destructure.\n\nAs you probably\
    \ noticed above, you can even leave out a value and only place another comma there.\
    \ The element at this index is then ignored and not extracted.\n\n## Swap Elements\
    \ Within An Array With Destructuring\n\n![](img/522b962b8325a030575a3d72d330a848_10_0.png)\n\
    \nHave you ever written code like this?\n\n```\nconst array = [1, 2, 3];\nconst\
    \ tmp = array[0];\narray[0] = array[2];\narray[2] = tmp;\n```\n\nThat's a classical\
    \ swap. It takes three lines to perform and a temporary variable. But since ES6\
    \ introduced array destructuring, there is an alternative to this multi-line swap.\n\
    \nWhat happens here is nothing else than an array destructuring statement. You\
    \ can read it as follows:\n\nCreate an array containing array[2] at index 0, and\
    \ array[0] at index 1. Not destructure this array by putting the value at index\
    \ 0 into array[0] and the value at index 1 into array[2].\n\nSee? Not much different\
    \ from the swap with the temporary variable, but written more concisely, in only\
    \ one line instead of three.\n\n## Use Array Spreading To Keep Your Arrays Immutable\n\
    \n![](img/522b962b8325a030575a3d72d330a848_11_0.png)\n\nArrays are mutable by\
    \ nature. Although JavaScript's array is no native array, it is still a mutable\
    \ data structure. You can always append elements or remove them. All of its functional\
    \ methods, however, create new arrays, and this has a good reason. Immutability\
    \ makes things easier for developers. One common place of issues with mutability\
    \ is React. Have you ever tried to append an element to an array that is referenced\
    \ within your JSX? If so, you have probably noticed that nothing happens. This\
    \ is because React expects immutable data. If a reference changes, you need to\
    \ update the reference (with setState for example). Keeping your arrays immutable\
    \ by using the spread operator and creating new arrays is one pattern you can\
    \ use to ensure immutability. You create a new array, copy the old contents over,\
    \ and then append what you want to append.\n\n## Spreading Sparse Arrays As Arguments\n\
    \n![](img/522b962b8325a030575a3d72d330a848_12_0.png)\n\nWe don't always deal with\
    \ optimal functionality as developers, and sometimes, even library developers\
    \ make mistakes. One of those is putting optional arguments in the middle of a\
    \ function's parameter list. You can't skip them, but you also don't need them.\n\
    \nYou could now go ahead and just pass in an explicit undefined there, in the\
    \ middle of the call, but that doesn't look great.\n\nAnother way to do it is\
    \ to use a little workaround, although you need to be careful because readability\
    \ can sometimes suffer.\n\nThe idea is to spread a sparse array into the function.\
    \ Sparse means that there are elements left out. This works for arrays, and the\
    \ runtime assumes that the value is implicitly undefined. All you see is an empty\
    \ spot in the list of array elements. If you now spread such a sparse array as\
    \ a function's argument, each array element is assigned to a corresponding argument\
    \ in the list. The first element becomes the first argument, etc.\n\nSometimes,\
    \ this can save you a few headaches, but it's also nothing you should do too often.\n\
    \n## Merging Multiple Objects\n\n![](img/522b962b8325a030575a3d72d330a848_13_0.png)\n\
    \nMerging multiple objects into one has always been an operation you often need\
    \ to do. Whenever you want to work with options objects and default values, for\
    \ example, merging is the way to go. You first take the default options, and then\
    \ you merge the object that a user filled with data, and in the end, you get something\
    \ your function or API can work with.\n\nFor a long time, you would have done\
    \ it like this:\n\n```\nconst myFunc = (options) => {\n  const mergedOptions =\
    \ Object.assign({}, defaults,\n    options);\n};\n```\n\nThanks to spreading,\
    \ however, this operation is easier than ever nowadays. Create your new object\
    \ and then spread all other objects into it in order. It also works the same way\
    \ as Object.assign():\n\nProperties of objects spread later in the chain override\
    \ ones already present.\n\n## Make Objects Immutable With Freeze\n\n![](img/522b962b8325a030575a3d72d330a848_14_0.png)\n\
    \nImmutability is a core concept of functional programming. JavaScript, however,\
    \ has a pretty rough history. Initially created in a few days, and envisioned\
    \ as a language with prototypal inheritance, it mixed many different concepts.\
    \ What we ended up with was a language that, only recently, introduced private\
    \ properties on classes, for example. There is also no keyword to make properties\
    \ immutable on objects.\n\nGladly, Object has some pretty useful helper methods\
    \ to deal with all sorts of objects, and one of those is freeze(). What freeze()\
    \ does is make any object fully immutable. Any property of a frozen object cannot\
    \ be modified, and it is set in stone from then on. However, this is only a shallow\
    \ operation. Any nested property that is an object itself is still unfrozen and\
    \ could be modified.\n\nIf you want to freeze an object deeply, you need to either\
    \ use a library like lodash or write your own recursive deep freeze.\n\n## Make\
    \ Arrays Immutable With Freeze\n\n![](img/522b962b8325a030575a3d72d330a848_15_0.png)\n\
    \nArrays are nothing else than objects with some unique functionality, which means\
    \ that freeze() also works on them. If you freeze an array, it becomes as immutable\
    \ as any other object. No matter what you try afterward, all operations throw\
    \ a TypeError. The only drawback is that the operation is as shallow for arrays\
    \ as for objects. If you also want to freeze all probably nested arrays or objects,\
    \ you need to use a deep freeze function.\n\nIf you want to work only with immutable\
    \ data, freeze your arrays. The only drawback is that all operations throw at\
    \ runtime, making it pretty difficult for your users to reason about.\n\nIf you\
    \ want something bullet-proof, the only alternative is to use an immutable array\
    \ implementation from a library, like Immutables, that doesn't even offer mutating\
    \ methods. This is the only way to make it safe for your users to work with your\
    \ arrays or collections without unpleasant surprises.\n\n## Use Array.findIndex\
    \ When Dealing With Objects\n\n![](img/522b962b8325a030575a3d72d330a848_16_0.png)\n\
    \nArray's indexOf() method is lacking. Under the hood, it compares elements and\
    \ the value you search for with the strict equality comparison operator (===).\
    \ If you ever tried to compare two separate objects with the same contents in\
    \ JavaScript, you know that it doesn't work. === only tests for identity on objects.\
    \ You can never use indexOf reliably to find the index of an object within an\
    \ array.\n\nGladly, array got the findIndex() method that takes a callback instead\
    \ of only a value. With this method, you can pass in an (arrow-) function and\
    \ implement the test for equality yourself. This allows you to also reliably identify\
    \ objects by testing the presence and equality of their properties.\n\nWhenever\
    \ you know that you deal with objects, better use findIndex() right away. It saves\
    \ you a lot of headaches, for sure.\n\n## Destructure Function Parameters To Increase\
    \ Readability For Users\n\n![](img/522b962b8325a030575a3d72d330a848_17_0.png)\n\
    \nLong parameter lists on functions are difficult to read and reason about. Many\
    \ IDEs and editors at least show a tooltip identifying each parameter and its\
    \ meaning, but you still struggle a lot regularly. JavaScript is dynamic, which\
    \ means that you can basically pass anything anywhere, so you don't even have\
    \ some type hints at hand.\n\nPassing an object is a great way to make the use\
    \ of your functions easier. And on the implementing side, you can directly destructure\
    \ the object inside the parameter list. This allows you to work with individual\
    \ variables within the function's body, while your users can pass in a plain old\
    \ object with named properties.\n\nA good rule of thumb is to switch individual\
    \ parameters to an object after exceeding three parameters. Remember that this\
    \ is a breaking change for existing functions, so better plan thoroughly beforehand."
  mdcn: "\n## 数组解构\n\n![](img/522b962b8325a030575a3d72d330a848_9_0.png)\n\nES6 不仅引入了对对象的解构赋值，也为数组引入了同样的特性。它的工作方式与对象几乎相同，但使用的是方括号而不是花括号。使用场景也与对象相同。当你想从数组中提取多个值时，通常需要多行代码。一行提取一个元素。而解构语句让你可以在一行中完成，甚至允许跳过中间的元素。具体用法是：先在前面放置\
    \ let 或 const，然后使用左方括号，并定义你想要提取的值。第一个变量被赋值为数组索引 0 处的元素，第二个变量为索引 1 处的元素，依此类推。接着用右方括号关闭左侧，后跟一个等号，再跟上要解构的数组路径。\n\
    \n正如你可能已经注意到的，你甚至可以在某个位置留空，只放另一个逗号。该索引处的元素将被忽略，不会被提取。\n\n## 使用解构在数组内交换元素\n\n![](img/522b962b8325a030575a3d72d330a848_10_0.png)\n\
    \n你是否曾经写过这样的代码？\n\n```\nconst array = [1, 2, 3];\nconst tmp = array[0];\narray[0]\
    \ = array[2];\narray[2] = tmp;\n```\n\n这是经典的交换操作。它需要三行代码并借助一个临时变量。但自从 ES6 引入数组解构以来，就有了这种多行交换的替代方案。\n\
    \n这里发生的不过是一个数组解构语句。你可以这样理解：\n\n创建一个数组，将 array[2] 放在索引 0 处，将 array[0] 放在索引 1 处。然后通过解构将这个数组的值分别赋给\
    \ array[0] 和 array[2]，即将索引 0 处的值放入 array[0]，索引 1 处的值放入 array[2]。\n\n看到了吗？与使用临时变量的交换没有太大区别，但写得更简洁，只需一行而不是三行。\n\
    \n## 使用数组展开保持数组不可变\n\n![](img/522b962b8325a030575a3d72d330a848_11_0.png)\n\n数组本质上是可变的。尽管\
    \ JavaScript 的数组并非原生数组，但它仍然是可变的数据结构。你随时可以追加元素或删除它们。不过，所有的函数式方法都会创建新数组，这是有充分理由的。不可变性让开发者的工作更加轻松。可变性的一个常见问题出现在\
    \ React 中。你是否曾经尝试向一个在 JSX 中引用的数组追加元素？如果是，你可能已经注意到什么都没有发生。这是因为 React 期望不可变的数据。如果引用发生变化，你需要更新引用（例如使用\
    \ setState）。使用展开运算符创建新数组来保持数组不可变，是确保不可变性的一种模式。你创建一个新数组，复制旧数组的内容，然后追加你想要追加的元素。\n\
    \n## 将稀疏数组作为参数展开\n\n![](img/522b962b8325a030575a3d72d330a848_12_0.png)\n\n作为开发者，我们并不总是面对最优的功能，有时即使是库开发者也会犯错。其中之一就是将可选参数放在函数参数列表的中间。你不能跳过它们，但你也不需要它们。\n\
    \n你现在可以直接在那里传入一个显式的 undefined，放在调用中间，但这看起来不太好。\n\n另一种方法是使用一个小技巧，尽管你需要小心，因为可读性有时会受到影响。\n\
    \n其核心思想是将稀疏数组展开到函数中。稀疏意味着有元素被省略。这对数组是有效的，运行时会假设该值隐式为 undefined。你在数组元素列表中看到的只是一个空位。如果你现在将这样的稀疏数组作为函数的参数展开，每个数组元素都会被分配给参数列表中对应的参数。第一个元素成为第一个参数，以此类推。\n\
    \n有时，这可以省去一些麻烦，但也不应该过于频繁地使用。\n\n## 合并多个对象\n\n![](img/522b962b8325a030575a3d72d330a848_13_0.png)\n\
    \n将多个对象合并成一个一直是一项常见的操作。每当你想处理选项对象和默认值时，合并就是方法。你先取默认选项，然后合并用户填写了数据的对象，最终得到你的函数或\
    \ API 可以使用的结果。\n\n很长一段时间里，你会这样做：\n\n```\nconst myFunc = (options) => {\n  const\
    \ mergedOptions = Object.assign({}, defaults,\n    options);\n};\n```\n\n然而， thanks\
    \ to 展开语法，如今这个操作变得前所未有的简单。创建你的新对象，然后按顺序将所有其他对象展开到其中。它的工作方式也与 `Object.assign()`\
    \ 相同：\n\n在链中后面展开的对象的属性会覆盖已经存在的属性。\n\n## 使用 Freeze 使对象不可变\n\n![](img/522b962b8325a030575a3d72d330a848_14_0.png)\n\
    \n不可变性是函数式编程的核心概念。然而，JavaScript 有着相当坎坷的历史。它最初在几天内创建，被设想为一种具有原型继承的语言，却混杂了许多不同的概念。我们最终得到的结果是，例如，直到最近才在类上引入了私有属性。也没有任何关键字可以使对象上的属性不可变。\n\
    \n幸运的是，Object 有一些相当有用的辅助方法来处理各种对象，其中之一就是 `freeze()`。`freeze()` 的作用是使任何对象完全不可变。被冻结对象的任何属性都无法再修改，从此固定不变。然而，这只是一个浅层操作。任何本身是对象的嵌套属性仍然未冻结，可以被修改。\n\
    \n如果你想深度冻结一个对象，你需要么使用像 lodash 这样的库，要么编写自己的递归深度冻结函数。\n\n## 使用 Freeze 使数组不可变\n\n\
    ![](img/522b962b8325a030575a3d72d330a848_15_0.png)\n\n数组不过是具有一些独特功能的对象，这意味着 `freeze()`\
    \ 对数组也同样有效。如果你冻结一个数组，它会变得和其他任何对象一样不可变。无论之后你尝试什么操作，都会抛出 TypeError。唯一的缺点是，这个操作对数组和对对象一样都是浅层的。如果你还想冻结所有可能嵌套的数组或对象，你需要使用深度冻结函数。\n\
    \n如果你只想处理不可变数据，请冻结你的数组。唯一的缺点是查询所有操作都会在运行时抛出异常，这使得你的用户很难进行推理。\n\n如果你想要一个万无一失的方案，唯一的替代方案是使用库中的不可变数组实现，比如\
    \ Immutables，它们甚至不提供可变方法。这是确保你的用户在使用你的数组或集合时不会遇到意外情况的唯一方法。\n\n## 处理对象时使用 Array.findIndex\n\
    \n![](img/522b962b8325a030575a3d72d330a848_16_0.png)\n\n数组的 `indexOf()` 方法有所欠缺。在底层，它使用严格相等比较运算符（`===`）来比较元素和你搜索的值。如果你曾经尝试在\
    \ JavaScript 中比较两个内容相同的不同对象，你就知道这行不通。`===` 对对象只测试同一性。你永远无法可靠地使用 `indexOf` 来查找数组中某个对象的索引。\n\
    \n幸运的是，数组有了 `findIndex()` 方法，它接受一个回调而不是仅仅一个值。使用这个方法，你可以传入一个（箭头）函数并实现你自己的相等性测试。这允许你通过测试属性的存在性和相等性来可靠地识别对象。\n\
    \n每当你知道自己在处理对象时，最好直接使用 `findIndex()`。它肯定能为你省去很多麻烦。\n\n## 解构函数参数以提高用户可读性\n\n![](img/522b962b8325a030575a3d72d330a848_17_0.png)\n\
    \n函数的冗长参数列表难以阅读和理解。许多 IDE 和编辑器至少会显示工具提示来标识每个参数及其含义，但你仍然会经常感到困扰。JavaScript 是动态的，这意味着你可以在任何地方传递任何东西，所以你甚至手头没有类型提示。\n\
    \n传递一个对象是让你的函数更易于使用的好方法。而在实现端，你可以直接在参数列表中解构这个对象。这允许你在函数体内使用单独的变量，而你的用户可以传入一个带有命名属性的普通对象。\n\
    \n一个好的经验法则是，在超过三个参数后，将单独参数切换为对象。请记住，这对现有函数来说是一个破坏性变更，所以最好事先周密计划。\n"
