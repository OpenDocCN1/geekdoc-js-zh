- md: ' ## Signing And Verifying Messages With ethers


    Blockchain technology is based on public/private key cryptography. As you might
    know, we also use this technique to encrypt and decrypt messages and requests
    (SSL/TLS, for example). Using your public and private key to sign messages is
    thus also an obvious use case for a blockchain client, and this process is even
    helpful. Encrypting, decrypting, and verifying messages is one of the best ways
    to use the web wallets of your users to sign them in. It allows you to perform
    an identity verification without explicitly having to know any of their personal
    details.


    ## Subscribing To And Filtering Events With ethers


    Blockchains regularly emit events. To be precise, they emit a lot of them. Every
    transfer of a chain''s native currency leads to an event, and many smart contracts
    also emit them on certain occasions. Those events are what websites like Etherscan
    subscribe to fill their databases with. They index those events, process them,
    and then provide them to the public (and paying users).


    Subscribing to an event is, of course, also some of the base functionality ethers
    provides. All you need is a filter object that describes which events you want
    to listen to. This filter is then passed to a provider''s on() method. A callback
    then allows you to define how you want to process those events.


    ## API Providers In ethers


    ethers is not only a blockchain client library but also comes with many advanced
    API providers that allow you to do different things. Some of those providers give
    you access to advanced databases with index data from the blockchain, and others
    allow you to interact with your blockchain infrastructure deployed through platform
    providers like Alchemy and Infura.


    The great thing about those providers is that you don''t need to integrate another
    client library if you work with some of the platforms behind those providers.
    In the end, it''s a great utility.


    ## ENS Lookup With ethers


    ENS (The Ethereum Name Service) is the DNS of the Ethereum world. Anyone can buy
    an NFT with a specific address attached to it. And this address can from then
    on act as a replacement to your address (the public key representation beginning
    with 0x).


    ethers comes with support for ENS resolving, which means that you can resolve
    any ENS address to a blockchain address and versa. Additionally, this logic also
    allows ethers to let you send transactions to ENS addresses without having to
    look up the address prior to that.


    ## Estimating The Gas Cost Of Smart Contract Calls With ethers


    If you have ever worked with a blockchain as a user, you might already know gas
    costs. Gas is what miners/validators are paid for their service, which is basically
    executing smart contract logic and processing transactions. While the gas consumption
    of a call is deterministic (means: if you look at the code executed, you know
    how much gas it takes), the gas price is always moving. The more people interact
    with the blockchain, the more expensive gas becomes. The fewer people do so, the
    cheaper gas becomes. There is a market behind gas. ethers has utility methods
    that allow you to make a rough estimation of how much a call would cost you at
    the moment. This can come in helpful if you have logic running automatically in
    the back regularly. In this case, it can make sense to wait for the gas price
    to hit a certain low before the call is executed. This can lead to savings ranging
    from a few cents to thousands of dollars a year.


    ## Waiting For Transactions To Finish With ethers


    As you might have already learned, sending off a transaction only returns an object
    presenting a pending transaction. Depending on the blockchain, transactions can
    take a longer time to settle. This time can range from a few seconds to minutes.


    dApps usually try to not wait for transactions to settle and instead show an intermediate
    state until a transaction finally goes through.


    But sometimes, you might really want to wait until a transaction is settled before
    you let users continue with whatever they do.


    In this case, the pending transaction object offers a wait() method, that returns
    a Promise that only resolves when the transaction is appended to the next block.


    This is a potentially very long-running operation. You should only use it if really
    necessary.


    ## Reacting To Network Changes With ethers


    Any user can change the network their web wallet is connected to at any time.
    This often leads to interesting problems with dApps. You might still be listening
    for events or wait for a transaction to return. In such cases, it''s best to react
    to the network change and at least reload the whole app, so all stale state is
    reset. Often, you might also want to display to the user that they are connected
    to the wrong network because your dApp only works on Ethereum or Polygon, for
    example.


    When this happens, you can use the ''network'' hook ethers provides. Within the
    callback, you can perform any actions necessary, like reloading your site or setting
    some state so you can display a message to the user.


    The hook is also called when connecting to the app the first time. This is why
    you should always include a guard statement that checks whether the second parameter
    of the callback (oldNetwork in this case) is set. If not, it''s a first-time connection,
    and you don''t need to do anything.


    ## Connecting To A Node Without MetaMask With ethers


    ethers is not only a library for frontend applications. You can use it in the
    backend, as well. When you use it this way, however, there is no MetaMask or other
    wallet that handles the connection to a hosted blockchain node for you.


    In this case, you need to connect to a node yourself, and this is why ethers also
    provides a JsonRpcProvider that connects to the API of any node and, from then
    on, behaves it usually would in the frontend.


    The only thing you need to instantiate your signer, however, is either your private
    key or your mnemonic phrase. Handle them with care. If you accidentally expose
    them to the world (like accidentally pushing them to GitHub), you can be sure
    that all your funds will be gone in seconds.


    It''s thus a good idea to only import them as environment variables, provided
    by a secure store when the application starts.


    # Web 3 - Solidity


    ## A Simple Smart Contract


    A smart contract is nothing else than an object, at least conceptually. The great
    thing about that object is that it is remotely accessible. You can call any function
    on that contract/object that is marked as publicly available with a blockchain
    client.


    And this is already the basic magic of a smart contract. If you ever created a
    class in another language, you can also create a smart contract; just with some
    different keywords.


    A smart contract can even call other contracts, and it can contain state that
    is persisted to the blockchain. You don''t need a database on the blockchain because
    your code already runs within one.


    ## Visibilities


    If you ever worked with private properties in JavaScript or TypeScript, or if
    you ever worked with another programming language like C# or Java, you already
    know that there are different visibilities for functions and properties.


    Visibilities help developers to encapsulate logic in different tiers. Sometimes,
    not all functions or properties should be accessible from the outside because
    they don''t belong to the public API of a contract. And sometimes, you only want
    to provide base logic that you can use in inheriting contracts.


    In Solidity, visibilities can even affect the gas consumption of contract calls.
    Due to the nature of the underlying EVM (Ethereum Virtual Machine), changing the
    visibility of a function can lead to less gas consumption because the calls can
    be optimized under the hood.'
  mdcn: '

    ## 使用 ethers 进行消息签名与验证


    区块链技术基于公钥/私钥密码学。正如你可能了解的那样，我们也使用这种技术来加密和解密消息及请求（例如 SSL/TLS）。因此，使用公钥和私钥对消息进行签名也是区块链客户端的一个显而易见的用例，而且这一过程甚至很有帮助。加密、解密和验证消息是使用用户网页钱包为其提供签名的最佳方式之一。这使您能够在不必明确知道任何用户个人详细信息的情况下执行身份验证。


    ## 使用 ethers 订阅和过滤事件


    区块链会定期发出事件。确切地说，它们会发出大量事件。每一次链上原生货币的转账都会产生一个事件，许多智能合约在特定场合下也会发出事件。这些事件正是 Etherscan
    等网站订阅用来填充其数据库的内容。它们为这些事件建立索引，进行处理，然后提供给公众（以及付费用户）。


    订阅事件当然也是 ethers 提供的一些基础功能。您只需要一个描述您想要监听哪些事件的筛选对象。然后，这个筛选对象会被传递给提供者的 on() 方法。通过回调函数，您可以定义如何处理这些事件。


    ## ethers 中的 API 提供者


    ethers 不仅是区块链客户端库，还附带许多高级 API 提供者，让您能够执行不同的操作。其中一些提供者让您能够访问包含区块链索引数据的高级数据库，另一些则允许您与通过
    Alchemy 和 Infura 等平台提供者部署的区块链基础设施进行交互。


    这些提供者的妙处在于，如果您使用某些提供者背后的平台，就无需集成另一个客户端库。归根结底，这是一个很棒的实用工具。


    ## 使用 ethers 进行 ENS 查询


    ENS（以太坊域名服务）是以太坊世界的 DNS。任何人都可以购买一个附加了特定地址的 NFT。从那时起，这个地址就可以作为您地址（以 0x 开头的公钥表示）的替代。


    ethers 支持 ENS 解析，这意味着您可以将任何 ENS 地址解析为区块链地址，反之亦然。此外，该逻辑还允许 ethers 让您直接向 ENS 地址发送交易，而无需事先查询地址。


    ## 使用 ethers 估算智能合约调用的 Gas 成本


    如果您曾经作为用户与区块链打过交道，您可能已经了解 gas 成本。Gas 是支付给矿工/验证者的服务费，本质上是执行智能合约逻辑和处理交易。虽然调用的 gas
    消耗是确定性的（意思是：如果您查看执行的代码，就知道需要多少 gas），但 gas 价格始终在波动。与区块链交互的人越多，gas 就越贵。这样的人越少，gas
    就越便宜。gas 背后存在一个市场。ethers 提供了一些实用方法，让您能够对当前调用的大致成本进行估算。如果您的后台有定期自动运行的逻辑，这会很有帮助。在这种情况下，等待
    gas 价格降至某个低点再执行调用是合理的。这可以带来从几分钱到每年数千美元不等的节省。


    ## 使用 ethers 等待交易完成


    正如您可能已经了解的那样，发送交易只会返回一个表示待处理交易的对象。根据不同的区块链，交易可能需要更长的时间才能结算。这个时间可能从几秒到几分钟不等。


    去中心化应用通常不会等待交易结算，而是显示一个中间状态，直到交易最终完成。


    但有时，您可能确实希望等到交易结算完成后再让用户继续他们的操作。


    在这种情况下，待处理交易对象提供了一个 wait() 方法，它返回一个 Promise，只有当交易被追加到下一个区块时才会解决。


    这是一个可能非常耗时的操作。您应该只在真正必要时才使用它。


    ## 使用 ethers 响应网络变更


    任何用户都可以随时更改其网页钱包连接的网络。这经常导致去中心化应用出现一些有趣的问题。您可能仍在监听事件或等待交易返回。在这种情况下，最好响应网络变更，至少重新加载整个应用，以便重置所有陈旧状态。通常，您可能还想向用户显示他们连接到了错误的网络，因为您的去中心化应用只在以太坊或
    Polygon 等网络上运行。


    当这种情况发生时，您可以使用 ethers 提供的 ''network'' 钩子。在回调函数中，您可以执行任何必要的操作，比如重新加载您的网站或设置一些状态，以便向用户显示消息。


    该钩子在首次连接到应用时也会被调用。这就是为什么您应该始终包含一个守护语句来检查回调的第二个参数（在此案例中为 oldNetwork）是否已设置。如果没有设置，那就是首次连接，您不需要做任何事情。


    ## 使用 ethers 在不使用 MetaMask 的情况下连接节点


    ethers 不仅仅是用于前端应用的库。您也可以在后台使用它。然而，以这种方式使用时，没有 MetaMask 或其他钱包来为您处理与托管区块链节点的连接。


    在这种情况下，您需要自己连接到一个节点，这就是为什么 ethers 还提供了 JsonRpcProvider，它可以连接到任何节点的 API，从那时起，它的行为就与在前端时通常一样。


    然而，要实例化您的签名者，您只需要您的私钥或助记词。请谨慎处理它们。如果您不小心将它们暴露给外界（比如不小心推送到 GitHub），您可以肯定您的所有资金将在几秒钟内消失。


    因此，只将它们作为环境变量导入是个好主意，这些环境变量由应用启动时的安全存储提供。


    # Web 3 - Solidity


    ## 一个简单的智能合约


    智能合约无非就是一个对象，至少从概念上讲是这样。这个对象的伟大之处在于它可以远程访问。您可以使用区块链客户端调用该合约/对象上标记为公开可用的任何函数。


    这已经是智能合约的基本魔力所在。如果您曾经在另一种语言中创建过类，您也可以创建智能合约；只是需要用到一些不同的关键字。


    智能合约甚至可以调用其他合约，而且可以包含持久化到区块链的状态。您在区块链上不需要数据库，因为您的代码已经在其中运行了。


    ## 可见性


    如果您曾经在 JavaScript 或 TypeScript 中处理过私有属性，或者如果您曾经在另一种编程语言如 C# 或 Java 中工作过，您已经知道函数和属性有不同的可见性。


    可见性帮助开发者在不同层级封装逻辑。有时，并非所有函数或属性都应该从外部访问，因为它们不属于合约的公共 API。而有时，您只想提供可以在继承合约中使用的基础逻辑。


    在 Solidity 中，可见性甚至会影响合约调用的 gas 消耗。由于底层 EVM（以太坊虚拟机）的特性，更改函数的可见性可以减少 gas 消耗，因为调用可以在底层进行优化。

    '
