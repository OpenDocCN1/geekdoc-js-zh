  md: '# The Nullish Coalescing Operator


    ![](img/522b962b8325a030575a3d72d330a848_4_0.png)


    The nullish coalescing operator was introduced with ES2020 and brought an alternative
    to the long-used logical OR (||).


    This operator checks whether the left-hand side is null or undefined. The operator
    takes the right-hand side as a default replacement whenever that''s true.


    This is more concise than the logical OR that reacts to all falsy values. If a
    is null, undefined, 0, '''', false, or NaN, b would be taken as a replacement
    in the example above.


    The nullish coalescing operator is a suitable replacement for the logical OR whenever
    at least one falsy value except null and undefined (especially 0, '''', and false)
    is a perfectly valid value for the operations you want to perform next.'
  merge: -1
  pgno: 4
