  md: '# Short Circuit Evaluation With The Logical AND


    ![](img/522b962b8325a030575a3d72d330a848_48_0.png)


    Short circuit evaluation is actually a feature related to boolean algebra. Boolean
    expressions can be optimized by only doing the work that is really necessary.
    If you can already safely state that a condition is true before you went through
    the whole expression, you don''t need to evaluate the rest of it.


    The logical AND is true if and only if both conditions related to it are true.
    That''s its definition. Only true && true is true. Everything else is false. You
    only need to look at the right side when the left side is already true.


    In JavaScript, you can place any statement in a boolean expression and JavaScript
    takes care of conversion for you. You can, for example, combine a boolean condition
    and the logical AND with a function call. The call will only get executed when
    the condition is true. That is the same behavior as an if-statement has. Only
    if the condition is true, the block of code gets executed. If the condition yields
    false, the block is skipped.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Short Circuit Evaluation With The Logical OR


    ![](img/522b962b8325a030575a3d72d330a848_49_0.png)


    The same trick that works for the logical AND does also work with the logical
    OR. The only difference between OR and AND is that OR stands for a negated condition
    in the statement.


    A logical OR is true if at least one side of the expression is true. If the left
    side is already true, you don''t need to evaluate the right side. But if the left
    side is false, you still need to check the right side. If you now combine a boolean
    condition with the logical OR and a functional call, you get exactly the behavior
    of an if-statement that checks for a negated condition. Only if the negated check
    yields true (which means the actual condition is false), the block of code gets
    executed. Ond word of advice that is valid for both tricks, though: It is difficult
    to read. Many JavaScript developers think they are clever when using it, but they
    aren''t. This is usually a trick minimizers use to reduce your code size, but
    an if-statement is still way more readable than this shortcut.'
