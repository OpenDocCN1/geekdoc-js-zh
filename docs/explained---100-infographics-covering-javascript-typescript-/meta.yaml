  md: '# # Sieve Of Eratosthenes


    ![](img/522b962b8325a030575a3d72d330a848_72_0.png)


    The sieve of Eratosthenes is a mathematical algorithm that finds and precalculates
    prime numbers. It does more rely on logical facts than on complex-looking formulas.

    Eratosthenes, back in the days, found out that you don''t need to do many calculations
    to find prime numbers. Overall, we know that numbers 0 and 1 are no prime numbers,
    and we can “mark” those numbers. The next unmarked number is the number 2; it
    is a prime number. But all its multiples can''t be one anymore, so we can already
    rule them out. The number 3 is also a prime number because it simply wasn''t market
    yet. And once again, we can mark all its multiples as not being prime. And now
    the algorithm just goes on and on until it hits a specified max. In the end, you
    get a list of prime numbers that you can continue to work with.'
