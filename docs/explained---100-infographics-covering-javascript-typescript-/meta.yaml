  md: '# Immutable State Variables


    ![](img/522b962b8325a030575a3d72d330a848_126_0.png)


    Contract state variables can be marked as immutable. In this case, you can set
    them exactly once, either on declaration or in the constructor of the contract.


    An immutable state variable cannot be changed after it has been set once. Additionally,
    it costs less gas to access such a variable because when an instance of your contract
    is created, all occurrences of that immutable variable are replaced with their
    respective value.


    It makes a lot of sense to set contract variables to immutable when you are absolutely
    sure that you''ll never need to change a variable after it has been set once.
    This way, you can save a lot of gas, especially when your contracts are created
    and called pretty often.'
