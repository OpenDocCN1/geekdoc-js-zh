  md: '# ## Require


    ![](img/522b962b8325a030575a3d72d330a848_121_0.png)


    The utility function require() is actually one of the most important functions
    in Solidity. It''s the native way of Solidity to implement guard statements.


    You don''t need to implement checks yourself and then revert your contract manually
    if that check fails. require() does all that for you, in the most gas-efficient
    way possible.


    The function takes a boolean as its first parameter. This parameter can also be
    any boolean expression. If that boolean or expression yields false, require()
    automatically raises an error.


    The second, optional, parameter is a string. This is the message that is assigned
    to the error when it is raised. That is a way for a developer to give the caller
    of their function a hint at what exactly failed.


    You usually see relatively short strings as error messages and it has a good reason.
    While require() itself is gas-efficient, a string takes up a lot of space in the
    byte code of your deployed contract, and this can massively pump the deployment
    cost of your contract.'
  merge: -1
  pgno: 121
