- md: "# **Explained**\n\n100++ Infographics Covering JavaScript, TypeScript, And\
    \ Solidity\n\n```solidity\n// SPDX-License-Identifier: MIT\n\npragma solidity\
    \ >=0.7.0 <0.9.0;\n\ncontract MyContract {\n    OtherContract otherContract;\n\
    \    \n    function doSomething() public {\n        try otherContract.doSomething()\
    \ {\n            return true;\n        }\n        catch Error(string memory) {\n\
    \            return false;\n        }\n    }\n}\n```\n\n```javascript\nconst flatMap\
    \ = (array, callback) =>\n  array.reduce((accumulator, currentElement, index,\
    \ originalArray) =>\n    accumulator.concat(callback(currentElement, index, originalArray)),\n\
    \  [], []);\n```\n\n```javascript\nconst objOne = {\n  propOne: 1\n};\n\nconst\
    \ objTwo = {\n  propTwo: 2\n};\n\nconst merged = {\n  ...objOne,\n  ...objTwo\n\
    };\n// => {\n//   propOne: 1,\n//   propTwo: 2\n// }\n```\n\n```typescript\ninterface\
    \ Article {\n  author: string;\n  text: string;\n  title: string;\n}\n\ntype InputArticle\
    \ = Pick<Article, 'author' | 'text'>;\n\nconst createArticle = (author: string,\n\
    \  text: string): InputArticle => {\n  // processing...\n  return {\n    author,\n\
    \    text\n  };\n};\n```\n\n```javascript\nimport { ethers } from 'ethers';\n\n\
    const provider = new ethers.providers.JsonRpcProvider('http://localhost:8545');\n\
    \nconst signer = new ethers.Wallet(privateKey, provider);\n\nasync function main()\
    \ {\n  const contract = new ethers.Contract(address, abi, signer);\n  \n  // Send\
    \ a transaction to the contract\n  const tx = await contract.someFunction(args,\
    \ {\n    gasLimit: 1000000,\n    value: ethers.utils.parseEther('0.1')\n  });\n\
    \  \n  await tx.wait();\n  \n  console.log('Transaction confirmed!');\n}\n\nmain().catch(console.error);\n\
    ```\n\nOliver Jumpertz\n\n## # JavaScript\n\n### The Pipeline Operator\n\n![](img/522b962b8325a030575a3d72d330a848_1_0.png)\n\
    \nIt may not look like much, and the pipeline operator is a controversial proposal,\
    \ but it has its worth. You can, of course, argue that formatting the left side\
    \ to span multiple lines makes the code more readable. Still, the pipeline operator\
    \ transforms the code into something that looks like an object with a fluid, functional\
    \ API while it actually isn't. Whenever you can avoid creating a class, you definitely\
    \ should. Functional programming is more about primitives and functional composition\
    \ than objects and state. A class is heavy, and it carries methods and state.\
    \ Especially object-functional classes require a lot of state transition logic\
    \ that quickly becomes difficult to maintain. Syntactic sugar that emulates this\
    \ behavior without all the work necessary is thus a very welcomed addition to\
    \ JavaScript, in my opinion.\n\n### The Exponentiation Operator\n\n![](img/522b962b8325a030575a3d72d330a848_2_0.png)\n\
    \nThe exponentiation operator is a great addition to JavaScript that was introduced\
    \ with ES7. An operator usually has one massive advantage over any method. It\
    \ is native, and it is easier to read. Although Math.pow() is well-known, it is\
    \ still a method. It takes more characters to write, and if you use it within\
    \ other expressions, it can quickly become difficult to identify within all that\
    \ other code.\n\nOn the other hand, the exponentiation operator is only two characters\
    \ long. If you know how to multiply numbers, you'll also quickly understand how\
    \ to exponentiate them.\n\nEspecially with a lot of crowded code, operators are\
    \ usually easier to spot and identify, and readability should always be your first\
    \ priority. This is why you can finally retire Math.pow() and use the exponentiation\
    \ operator instead.\n\n### Better Use The Strict Equality Comparison Operator\
    \ ===\n\n![](img/522b962b8325a030575a3d72d330a848_3_0.png)\n\nLet's be honest;\
    \ JavaScript carries many historical burdens on its shoulders. One of those is\
    \ the == operator that only loosely checks value equality by converting types\
    \ as often as necessary until it can say whether two values are equal. There is,\
    \ however, only one actual use case where you should ever use ==, and this is\
    \ the following check:\n\n```javascript\nif (variable == null) {}\n```\n\nThis\
    \ check will only trigger if variable is null or undefined. Those are the two\
    \ major \"non-existent\" types in JavaScript. null is meant as an explicit \"\
    there is nothing\" signal, and undefined is the jack of all trades for \"there\
    \ is no value/property/definition.\" Everywhere else, always use ===. You will\
    \ prevent many bugs and unexpected behaviors this way.\n\n### The Nullish Coalescing\
    \ Operator\n\n![](img/522b962b8325a030575a3d72d330a848_4_0.png)\n\nThe nullish\
    \ coalescing operator was introduced with ES2020 and brought an alternative to\
    \ the long-used logical OR (||).\n\nThis operator checks whether the left-hand\
    \ side is null or undefined. The operator takes the right-hand side as a default\
    \ replacement whenever that's true.\n\nThis is more concise than the logical OR\
    \ that reacts to all falsy values. If a is null, undefined, 0, '', false, or NaN,\
    \ b would be taken as a replacement in the example above.\n\nThe nullish coalescing\
    \ operator is a suitable replacement for the logical OR whenever at least one\
    \ falsy value except null and undefined (especially 0, '', and false) is a perfectly\
    \ valid value for the operations you want to perform next.\n\n### The Destructuring\
    \ Assignment\n\n![](img/522b962b8325a030575a3d72d330a848_5_0.png)\n\nES6, released\
    \ in 2015, added many new and important features for the first time in JavaScript's\
    \ history. Next to let, const and arrow functions, ES6 also added the destructuring\
    \ assignment. Whenever you need to extract one or multiple properties from an\
    \ object, you can save yourself the hassle of accessing the property in dot notation\
    \ from now on. Use let or const, surround the properties you want to extract with\
    \ curly braces, and put commas between them, and you get a more readable statement\
    \ that does multiple things in only one line. A neat little side effect is that\
    \ you only have one place to change the object's path to extract from instead\
    \ of multiple.\n\n### Destructuring From A Possibly Undefined Property\n\n![](img/522b962b8325a030575a3d72d330a848_6_0.png)\n\
    \nDestructuring itself is pretty awesome, but it has its limits. You can quickly\
    \ run into TypeErrors at runtime when you try to destructure from an object that\
    \ is null or undefined. Optional chaining (appending ? to a property) does not\
    \ work on the very last property of a call chain.\n\nThe nullish coalescing operator\
    \ provides a fallback if a value is null or undefined. Providing an empty object\
    \ as a fallback if the last property of the chain is not present makes your statement\
    \ valid at runtime and prevents TypeErrors. All extracted properties will be undefined,\
    \ but that's something you can handle. It's sometimes better to do additional\
    \ checks for null/undefined than to enclose a destructuring statement with a try-catch\
    \ block.\n\n### Destructure An Object Into Existing Variables\n\n![](img/522b962b8325a030575a3d72d330a848_7_0.png)\n\
    \nWhile object destructuring is pretty straightforward, destructuring into already\
    \ existing variables isn't. If you don't, like usually, place a let or const in\
    \ front of the curly braces, you'll get an unpleasant SyntaxError. This is because\
    \ the runtime treats the curly brace as a block, and it finds one or more identifiers\
    \ within that block, separated by a comma. This is nothing the JavaScript syntax\
    \ usually offers within a code block, and because of this, a SyntaxError is thrown.\
    \ However, if you enclose the whole statement with parentheses, the syntax becomes\
    \ correct again, and your statement works. And if you now ask yourself where you\
    \ would possibly ever need this, especially module-level variables that are lazily\
    \ initialized can be initialized like this.\n\n### Infinitely Flatten Any Array\n\
    \n![](img/522b962b8325a030575a3d72d330a848_8_0.png)\n\nflat is an interesting\
    \ array method. Its primary use case is to take a multi-dimensional array and\
    \ flat it by one or multiple dimensions. The levels are defined by the number\
    \ you pass in as its argument. A three-dimensional array, flattened with .flat(1),\
    \ would thus become a two-dimensional array, etc.\n\nWhere is that useful? First,\
    \ when you deal with multi-dimensional arrays, you need to flat. But another use\
    \ case is the one shown above. When a function accepts many parameters that might\
    \ also contain arrays, and you all want them in one, long one-dimensional array,\
    \ you can use a utility function like above to flat them all. Infinity is the\
    \ unique argument here, as it's greater than any other number in JavaScript. This\
    \ leads to flat working for so long until it finds no more nested arrays within\
    \ the original one."
  mdcn: "\n# **图解**\n\n100+ 张信息图涵盖 JavaScript、TypeScript 和 Solidity\n\n```solidity\n\
    // SPDX-License-Identifier: MIT\n\npragma solidity >=0.7.0 <0.9.0;\n\ncontract\
    \ MyContract {\n    OtherContract otherContract;\n    \n    function doSomething()\
    \ public {\n        try otherContract.doSomething() {\n            return true;\n\
    \        }\n        catch Error(string memory) {\n            return false;\n\
    \        }\n    }\n}\n```\n\n```javascript\nconst flatMap = (array, callback)\
    \ =>\n  array.reduce((accumulator, currentElement, index, originalArray) =>\n\
    \    accumulator.concat(callback(currentElement, index, originalArray)),\n  [],\
    \ []);\n```\n\n```javascript\nconst objOne = {\n  propOne: 1\n};\n\nconst objTwo\
    \ = {\n  propTwo: 2\n};\n\nconst merged = {\n  ...objOne,\n  ...objTwo\n};\n//\
    \ => {\n//   propOne: 1,\n//   propTwo: 2\n// }\n```\n\n```typescript\ninterface\
    \ Article {\n  author: string;\n  text: string;\n  title: string;\n}\n\ntype InputArticle\
    \ = Pick<Article, 'author' | 'text'>;\n\nconst createArticle = (author: string,\n\
    \  text: string): InputArticle => {\n  // processing...\n  return {\n    author,\n\
    \    text\n  };\n};\n```\n\n```javascript\nimport { ethers } from 'ethers';\n\n\
    const provider = new ethers.providers.JsonRpcProvider('http://localhost:8545');\n\
    \nconst signer = new ethers.Wallet(privateKey, provider);\n\nasync function main()\
    \ {\n  const contract = new ethers.Contract(address, abi, signer);\n  \n  // Send\
    \ a transaction to the contract\n  const tx = await contract.someFunction(args,\
    \ {\n    gasLimit: 1000000,\n    value: ethers.utils.parseEther('0.1')\n  });\n\
    \  \n  await tx.wait();\n  \n  console.log('Transaction confirmed!');\n}\n\nmain().catch(console.error);\n\
    ```\n\nOliver Jumpertz\n\n## # JavaScript\n\n### 管道运算符\n\n![](img/522b962b8325a030575a3d72d330a848_1_0.png)\n\
    \n管道运算符看起来也许没什么特别的，而且它是一个有争议的提案，但它有其价值。当然，你可以争辩说将左侧格式化为跨多行可以让代码更具可读性。尽管如此，管道运算符将代码转换为看起来像具有流畅函数式\
    \ API 的对象的形式，但实际上并非如此。只要能避免创建类，你就应该这样做。函数式编程更多地关注原语和函数组合，而非对象和状态。类是沉重的，它携带方法和状态。尤其是面向对象-函数式类需要大量的状态转换逻辑，这些逻辑很快就会变得难以维护。因此，在我看来，这种模拟该行为而无需所有必要工作的语法糖，是\
    \ JavaScript 一个非常受欢迎的补充。\n\n### 指数运算符\n\n![](img/522b962b8325a030575a3d72d330a848_2_0.png)\n\
    \n指数运算符是 JavaScript 的一个很棒的补充，它随 ES7 引入。运算符通常比任何方法都有一个巨大的优势：它是原生的，而且更易读。虽然 `Math.pow()`\
    \ 众所周知，但它仍然是一个方法。它需要更多的字符来编写，而且如果在其他表达式中使用它，很快就会在所有其他代码中变得难以识别。\n\n另一方面，指数运算符只有两个字符长。如果你知道如何做乘法，你也会很快理解如何做幂运算。\n\
    \n特别是在大量拥挤的代码中，运算符通常更容易被发现和识别，可读性应该始终是你的第一优先级。这就是为什么你终于可以弃用 `Math.pow()` 而改用指数运算符的原因。\n\
    \n### 最好使用严格相等比较运算符 ===\n\n![](img/522b962b8325a030575a3d72d330a848_3_0.png)\n\
    \n说实话，JavaScript 肩负着许多历史包袱。其中之一就是 `==` 运算符，它只是通过在必要时不断转换类型来松散地检查值的相等性，直到它能判断两个值是否相等为止。然而，只有一个实际的使用场景应该使用\
    \ `==`，那就是以下检查：\n\n```javascript\nif (variable == null) {}\n```\n\n这个检查仅在 `variable`\
    \ 为 `null` 或 `undefined` 时触发。它们是 JavaScript 中两个主要的\"不存在\"类型。`null` 用作明确的\"什么都没有\"\
    信号，而 `undefined` 则是\"没有值/属性/定义\"的万金油。在其他所有地方，始终使用 `===`。你将以此避免许多 bug 和意外行为。\n\n\
    ### 空值合并运算符\n\n![](img/522b962b8325a030575a3d72d330a848_4_0.png)\n\n空值合并运算符随 ES2020\
    \ 引入，为长期使用的逻辑或（`||`）提供了一种替代方案。\n\n此运算符检查左侧是否为 `null` 或 `undefined`。当该条件为真时，运算符取右侧值作为默认替代值。\n\
    \n这比对所有假值都有反应的逻辑或更加简洁。如果 `a` 是 `null`、`undefined`、`0`、`''`、`false` 或 `NaN`，在上面的例子中\
    \ `b` 将被取为替代值。\n\n空值合并运算符是逻辑或的合适替代品——当除了 `null` 和 `undefined` 之外的至少一个假值（尤其是 `0`、`''`\
    \ 和 `false`）是你接下来要执行的操作的完全有效值时。\n\n### 解构赋值\n\n![](img/522b962b8325a030575a3d72d330a848_5_0.png)\n\
    \n2015 年发布的 ES6 首次在 JavaScript 的历史中添加了许多新的重要功能。除了 `let`、`const` 和箭头函数之外，ES6 还添加了解构赋值。每当你需要从对象中提取一个或多个属性时，从现在开始你可以省去用点表示法访问属性的麻烦。使用\
    \ `let` 或 `const`，用花括号括住你想要提取的属性，并在它们之间加上逗号，你就得到了一个更具可读性的语句，它仅用一行就完成了多项操作。一个巧妙的副作用是你只需在一个地方更改要提取的对象路径，而不是多个地方。\n\
    \n### 从可能未定义的属性中解构\n\n![](img/522b962b8325a030575a3d72d330a848_6_0.png)\n\n解构本身非常棒，但它有其局限性。当你尝试从一个为\
    \ `null` 或 `undefined` 的对象中解构时，可能会在运行时迅速遇到 `TypeError`。可选链（在属性后追加 `?`）在调用链的最后一个属性上不起作用。\n\
    \n空值合并运算符在值为 `null` 或 `undefined` 时提供回退。如果链的最后一个属性不存在，提供一个空对象作为回退可以使你的语句在运行时有效并防止\
    \ `TypeError`。所有提取的属性都将是 `undefined`，但这是你可以处理的。有时对 `null`/`undefined` 做额外检查比用\
    \ `try-catch` 块包裹解构语句更好。\n\n### 将对象解构到已有变量中\n\n![](img/522b962b8325a030575a3d72d330a848_7_0.png)\n\
    \n虽然对象解构非常直观，但解构到已有变量中则不然。如果你不在花括号前放置 `let` 或 `const`（如通常所做的那样），你会遇到令人不快的 `SyntaxError`。这是因为运行时将花括号视为一个代码块，并在该代码块中发现一个或多个由逗号分隔的标识符。这不是\
    \ JavaScript 语法通常在代码块中提供的内容，因此会抛出 `SyntaxError`。然而，如果你用括号将整个语句括起来，语法就会再次正确，你的语句也能工作。如果你现在问自己可能在哪里需要这样做，特别是模块级别的延迟初始化变量，就可以用这种方式初始化。\n\
    \n### 无限展平任意数组\n\n![](img/522b962b8325a030575a3d72d330a848_8_0.png)\n\n`flat`\
    \ 是一个有趣的数组方法。它的主要用例是接受一个多维数组，并将其展平一个或多个维度。层级由你作为参数传入的数字定义。一个三维数组，通过 `.flat(1)`\
    \ 展平后，将变成二维数组，依此类推。\n\n这在哪里有用？首先，当你处理多维数组时，你需要展平。但另一个用例就是上面所示的。当一个函数接受许多可能也包含数组的参数，而你希望将它们全部放入一个长的一维数组中时，你可以使用像上面那样的工具函数将它们全部展平。`Infinity`\
    \ 是这里唯一的参数，因为它比 JavaScript 中任何其他数字都大。这使得 `flat` 会一直工作，直到它在原始数组中找不到更多嵌套数组。\n"
