    In this case, you can make use of a trait of binary numbers. A number that is
    a power of two will always look like this:

    10 (2)

    100 (4)

    Let''s now see what happens if we subtract one:

    01 (1)

    011 (3)

    You can continue this forever, and you will see that it always follows the same
    pattern. If you use the binary AND on those pairs of numbers now, you will always
    get 0 as the result. That makes it super straightforward to implement the algorithm
    you see above.


