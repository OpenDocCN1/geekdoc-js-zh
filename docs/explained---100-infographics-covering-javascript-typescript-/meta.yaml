  md: '# # Events


    ![](img/522b962b8325a030575a3d72d330a848_111_0.png)


    Events are the log messages of Solidity and Ethereum. Any contract can define
    one or multiple events and then emit them at any time. They are like objects without
    functions. They can only contain data, and some of that data can be marked as
    indexed. An indexed property is something that you can filter and search events
    for. Other smart contracts can’t subscribe to those events. They are solely aimed
    at client libraries.


    Events help to make sense of what happens on the blockchain because transactions
    can sometimes be very difficult to read. They state which contract and function
    were called, but you often don’t find out easily what exactly happened. This is
    where events come in. They explicitly state, through their own type, and their
    data, what the action was that led to this particular event.'
