  md: '# Utility Type Record


    ![](img/522b962b8325a030575a3d72d330a848_84_0.png)


    Record is a great utility type when you want to use objects as map types. Although
    JavaScript and thus TypeScript have a dedicated Map data structure these days,
    objects still come with a specific kind of flexibility. You can access elements
    with bracket notation, and you can set them this way. For some developers, especially
    those that use JavaScript for way longer already, that''s the way you did it before
    Map came around.


    TypeScript, however, is a little picky regarding objects. If you don''t explicitly
    type something, the compiler always narrows down that type as far as possible.
    This means: An object with two properties a, and b, both containing a number leads
    to a type with two properties a and b, both a number.


    If you now want to put and access arbitrary data, you can use the utility type
    Record. It creates a type that accepts any string key, and a uniform value type
    defined in Record''s generic declaration.'
