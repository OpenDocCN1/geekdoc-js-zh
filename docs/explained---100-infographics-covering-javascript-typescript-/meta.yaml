  md: '# Infinitely Flatten Any Array


    ![](img/522b962b8325a030575a3d72d330a848_8_0.png)


    flat is an interesting array method. Its primary use case is to take a multi-dimensional
    array and flat it by one or multiple dimensions. The levels are defined by the
    number you pass in as its argument. A three-dimensional array, flattened with
    .flat(1), would thus become a two-dimensional array, etc.


    Where is that useful? First, when you deal with multi-dimensional arrays, you
    need to flat. But another use case is the one shown above. When a function accepts
    many parameters that might also contain arrays, and you all want them in one,
    long one-dimensional array, you can use a utility function like above to flat
    them all. Infinity is the unique argument here, as it''s greater than any other
    number in JavaScript. This leads to flat working for so long until it finds no
    more nested arrays within the original one.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# # Array Destructuring


    ![](img/522b962b8325a030575a3d72d330a848_9_0.png)


    ES6 introduced not only the destructuring assignment for objects but also the
    same for arrays. It nearly works the same way as for objects but uses square brackets
    instead of curly braces. The use case is the same as for objects. When you want
    to extract multiple values from an array, you usually need multiple lines for
    that. One line, one element extracted. A destructuring statement lets you do this
    in one line and even allows you to skip elements in-between. You use it by first
    placing a let or const in the front, then use an opening square bracket and define
    the values you want to extract. The first variable is assigned the element at
    index 0 of the array, the second variable the element at index 1, and so on. Then
    you close the left side with a square bracket, followed by an equal sign, and
    the path to the array to destructure.

    As you probably noticed above, you can even leave out a value and only place another
    comma there. The element at this index is then ignored and not extracted.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Swap Elements Within An Array With Destructuring


    ![](img/522b962b8325a030575a3d72d330a848_10_0.png)


    Have you ever written code like this?


    ```

    const array = [1, 2, 3];

    const tmp = array[0];

    array[0] = array[2];

    array[2] = tmp;

    ```


    That''s a classical swap. It takes three lines to perform and a temporary variable.
    But since ES6 introduced array destructuring, there is an alternative to this
    multi-line swap.

    What happens here is nothing else than an array destructuring statement. You can
    read it as follows:

    Create an array containing array[2] at index 0, and array[0] at index 1. Not destructure
    this array by putting the value at index 0 into array[0] and the value at index
    1 into array[2].

    See? Not much different from the swap with the temporary variable, but written
