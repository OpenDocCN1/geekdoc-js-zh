  md: '# # Assert


    ![](img/522b962b8325a030575a3d72d330a848_122_0.png)


    While require() is your go-to function for guard statements, assert() is a last
    resort statement. When an assert() call fails, something has gone so horribly
    wrong that you can''t rescue anything.

    A general rule of thumb is to use assert() to test for invariants or internal
    problems. You sometimes even place those statements at obvious places, like checking
    whether subtracting from a user''s balance really leads to the correct result.

    assert() also has another great utility that you can use to your advantage: tools
    can analyze your code for you and show whether an assert() would throw, even before
    deploying your contract.

    When assert() throws, all remaining gas is consumed. This is another difference
    between assert() and require() because require() refunds the remaining gas when
    it fails.'
  merge: -1
