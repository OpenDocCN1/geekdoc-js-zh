  md: '# The Exponentiation Operator


    ![](img/522b962b8325a030575a3d72d330a848_2_0.png)


    The exponentiation operator is a great addition to JavaScript that was introduced
    with ES7. An operator usually has one massive advantage over any method. It is
    native, and it is easier to read. Although Math.pow() is well-known, it is still
    a method. It takes more characters to write, and if you use it within other expressions,
    it can quickly become difficult to identify within all that other code.


    On the other hand, the exponentiation operator is only two characters long. If
    you know how to multiply numbers, you''ll also quickly understand how to exponentiate
    them.


    Especially with a lot of crowded code, operators are usually easier to spot and
    identify, and readability should always be your first priority. This is why you
    can finally retire Math.pow() and use the exponentiation operator instead.'
  merge: -1
  pgno: 2
- img_proc: true
  md: '# Better Use The Strict Equality Comparison Operator ===


    ![](img/522b962b8325a030575a3d72d330a848_3_0.png)


    Let’s be honest; JavaScript carries many historical burdens on its shoulders.
    One of those is the == operator that only loosely checks value equality by converting
    types as often as necessary until it can say whether two values are equal. There
    is, however, only one actual use case where you should ever use ==, and this is
    the following check:


    ```

    if (variable == null) {}

    ```


    This check will only trigger if variable is null or undefined. Those are the two
    major “non-existent” types in JavaScript. null is meant as an explicit “there
    is nothing” signal, and undefined is the jack of all trades for “there is no value/property/definition.”

    Everywhere else, always use ===. You will prevent many bugs and unexpected behaviors
    this way.'
  merge: -1
