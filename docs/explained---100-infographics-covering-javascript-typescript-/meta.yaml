  md: '# Make Objects Immutable With Freeze


    ![](img/522b962b8325a030575a3d72d330a848_14_0.png)


    Immutability is a core concept of functional programming.

    JavaScript, however, has a pretty rough history. Initially created in a few days,
    and envisioned as a language with prototypal inheritance, it mixed many different
    concepts. What we ended up with was a language that, only recently, introduced
    private properties on classes, for example. There is also no keyword to make properties
    immutable on objects.


    Gladly, Object has some pretty useful helper methods to deal with all sorts of
    objects, and one of those is freeze().

    What freeze() does is make any object fully immutable. Any property of a frozen
    object cannot be modified, and it is set in stone from then on. However, this
    is only a shallow operation. Any nested property that is an object itself is still
    unfrozen and could be modified.


    If you want to freeze an object deeply, you need to either use a library like
    lodash or write your own recursive deep freeze.'
