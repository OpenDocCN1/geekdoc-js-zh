    Promise.any also takes multiple Promises and waits for the first Promise to settle
    successfully. Even if 9 out of 10 Promises are rejected, and only the last one
    settles successfully, you''ll get the result of the successful one. Only if all
    Promises reject, Promise.any() throws an AggregateError.'
  - '[PAGE 25]


    # # How To Create A Cancelable Promise Delay


    ![](img/522b962b8325a030575a3d72d330a848_25_0.png)


    Asynchronous operations usually follow the same pattern: You start them, you wait
    for them to finish, and in the meantime, you can do something else. This is how
    a Promise works. The execution of a particular piece of code is halted until the
    Promise resolves. In the meantime, the event loop can continue to work and execute
    other code that doesn''t need to wait for anything at that moment. When the Promise
    settles, the event loop picks it up again and runs it as soon as possible, no
    matter whether the Promise failed or rejected. Sometimes, however, you want to
    wait for a little before sending off the action. In this case, you can use setTimeout()
    and combine it with a Promise. After the specified timeout, setTimeout() successfully
    settles the Promise, and based on this, you can chain any operation you like with
    its then() method. If you don''t need the Promise to settle anymore, you can easily
    abort it through the cancel() method. If the timeout is canceled, the Promise
    rejects, which you can handle either with a try-catch block or a catch().'
  - '[PAGE 26]


    # # Beware Of Automatic Semicolon Insertion


    ![](img/522b962b8325a030575a3d72d330a848_26_0.png)


    JavaScript has a concept called automatic semicolon insertion (ASI). There are
    certain places in your code where the runtime expects a semicolon at the end of
    a line. Otherwise, it “inserts” one for you (it only assumes there is one, it
    does not alter your code). The example above is one of the more “popular” occasions
    where ASI can surprise you. Both snippets look nearly identical, but they differ
    in one subtle detail. The curly brace is placed on a new line on the left side,
    and the return statement stands alone. On the right side, the return statement
    is directly followed by a curly brace on the same line.


    The code on the left side will trigger an automatic semicolon insertion. The return
    statement is not kept open by anything and thus closed by the runtime. An empty
    return statement is the same as returning undefined, and the object you wanted
    to return becomes unreachable dead code. This is why linters are so crucial, and
    they can warn you of such subtle mistakes or even automatically fix those issues
    for you.


    28'
- md: '# Use The Performance API To Measure Execution Times


    ![](img/522b962b8325a030575a3d72d330a848_27_0.png)


    Sometimes, you see people using `Date` or `console.time()` to measure execution
    times. There is, however, one drawback to those measurement methods, their precision.
    It doesn’t sound like much, but both methods only work with millisecond precision.
    The performance API, though, works with microsecond precision. Just to give you
    an idea: 1000 microseconds equal 1 millisecond. You now might ask the question
    if this much precision is really relevant, but here is some math for you: A change
    adds 500 microseconds to the execution of a function. This function is called
    a billion times each month. This is an additional computing overhead of 138.89
    hours! With millisecond precision, you don’t catch these types of performance
    regressions easily. Nevertheless, the API has one huge drawback itself. Its precision
    is reduced in browsers, so it only works reliably in Node.


    # Handle Return Values That Can Either Be Values Or Promises


    ![](img/522b962b8325a030575a3d72d330a848_28_0.png)


    JavaScript is dynamically typed. You often only know what you get from calling
    a function when you look at the docs, know what it returns, or try it out. There
    is also no reliable way to tell whether a function is an asynchronous function.
    Many forms of testing break as soon as you change a function to an arrow function.
    What you can do, however, is to use two features of JavaScript to your advantage.
    First, you don''t need to await any promise directly. Second, await only needs
    a method `.then()` to work, and it doesn''t test for a native Promise. Your workaround
    to reliably work with functions that might either return a value directly or a
    Promise is to test the result of that function call. If it is a Promise, its type
    is object, it has a property `then`, and that property is a function. In this
    case, you can await the result afterward and handle both cases as straightforwardly
    as possible.


    # Sum Up Array Values With Reduce


    ![](img/522b962b8325a030575a3d72d330a848_29_0.png)


    Summing up array values is one of the most straightforward use cases for `reduce()`.
    It''s a great first, straightforward algorithm to get to know one of the most
    important array methods out there.


    `reduce`''s method name already tells a lot about its original intention. This
    intention is to take an array and reduce it to a single value. Summing up array
    values is precisely such a case of reducing. You take an array of numbers, and
    then you return a single number representing the sum of all the numbers within
    that array.


    You will, however, later learn that `reduce()` also has more advanced use cases
    and can be used to reimplement many of the other array methods, which shows how
    important this method is.


    # Your Automatic React Copyright Footer


    ![](img/522b962b8325a030575a3d72d330a848_30_0.png)


    This tip/explanation was initially meant as a joke at the end of the year, but
    there is still a lot of truth behind it.


    Many developers simply put a static copyright in their footer and then forget
    about it.


    However, JavaScript makes it easy to automate even such a simple task. It doesn''t
    cost much time to create a `Date` quickly, get its full year and let that dynamically
    be rendered in the footer of your page.


    It only takes a few minutes to do and saves you manual work for years to come.


    # Anatomy Of A For Loop


    ![](img/522b962b8325a030575a3d72d330a848_31_0.png)


    A for-loop is one of the basic loops nearly all programming languages know. Knowing
    this loop is a core competency of any software developer.


    Of course, JavaScript also has a for loop that works the same way as in many other
    languages.


    The header of a for loop contains three blocks. The left one is the initialization
    block. You can put multiple statements here, separated by a comma, executed exactly
    once, before the loop starts. The middle block is the condition. It should always
    return a boolean and state whether the loop shall continue. Lastly, the right
    block is executed once after each step of the iteration. It is here that you typically
    increment a loop counter. You can also place multiple statements here, separated
    by a comma.


    Within the loop block, you put all statements that should be executed for each
    step of the iteration. It can be as small or large as you like. A good rule of
    thumb is to keep it as short as possible, though, and better abstract too much
    logic away into dedicated functions.


    # Anatomy Of A While Loop


    ![](img/522b962b8325a030575a3d72d330a848_32_0.png)


    A while loop is another basic loop any software developer needs to know.


    Of course, JavaScript also has a while loop, and it does also, of course, work
    the same way as in many other languages.


    After the `while` keyword, you place a condition that needs to be satisfied for
    the loop to continue. This condition is checked before each step of an iteration.
    This means that if the condition never yields true, the loop never runs. After
    the condition, you can place a code block with as many statements as you like.
    All statements are executed once, in order, for each step of the iteration.


    One thing that is a little different in JavaScript is that the condition is tested
    for truthiness. That means that instead of only `true`, it also accepts strings
    (not the empty one), numbers (not 0), objects, arrays, etc. For clarity, however,
    you should usually stick to booleans. There are a few exceptions where you can
    use falsyness to your advantage, but they are scarce. In most cases, it is better
    to use a boolean or write a utility method that does a check and returns a boolean
    on that outcome so that it has a good name.


    # Anatomy Of A Do-While Loop


    ![](img/522b962b8325a030575a3d72d330a848_33_0.png)


    There are quite a few loop types out there, and the do-while loop is another one
    of them. You can view a do-while loop as an alternative version of a while loop
    that does one particular thing differently. Instead of checking the condition
    before each step of an iteration, it does the opposite and checks it afterward.
    This is also signaled by how it is written.


    First comes a `do` statement, after which you can open a code block. Within that
    block, you can place any amount of statements you like. After that block, a `while`
    statement opens a conditional block where you put a boolean expression to evaluate.
    This order of statements is exactly the order of how the loop is evaluated. The
    `do` block is evaluated first, and only then the condition is checked.


    This also leads to one very specific behavior of the do-while loop. No matter
    whether the condition is true or false right at the beginning, the `do` block
    is executed at least once.


    The do-while loop is thus always a great choice when the condition is based on
    something you need to evaluate first.


    # Anatomy Of A For-Of Loop


    ![](img/522b962b8325a030575a3d72d330a848_34_0.png)


    Yet another loop, but this time it is a little more special than the other ones.
    The for-of loop is JavaScript''s variant of a for each loop in other languages.
    Instead of dealing with arrays and indices, etc., it only requires knowing the
    object you want to iterate over.


    Every object can have a method that is placed under `Symbol.iterator`. That''s
    a method that returns an object containing one dedicated method `next()`. This
    method returns an object with two properties: `value`, which is the value for
    the particular step of the iteration, and `done`, which signals whether the loop
    is finished.


    As soon as an object provides this, you can create a for-of loop for it. The head
    of the loop contains the keyword `for` and a block within parentheses. You declare
    a variable (which is redeclared for each step) with either `const` or `let`, and
    after the keyword `of`, you place the so-called iterable. That''s the object that
    has a method under `Symbol.iterator` implemented.


    This kind of loop is a prime example of not leaking implementation details. It
    doesn''t matter whether the object has indices or something else.'
  mdcn: '

    # 使用 Performance API 测量执行时间


    ![](img/522b962b8325a030575a3d72d330a848_27_0.png)


    有时你会看到有人使用 `Date` 或 `console.time()` 来测量执行时间。然而，这些测量方法有一个缺点，那就是精度。听起来可能不算什么，但这两种方法都只能达到毫秒级精度。而
    Performance API 则可以达到微秒级精度。给你一个直观的概念：1000 微秒等于 1 毫秒。你可能会问，这么高的精度真的有意义吗？但这里有一些数据供你参考：一次代码变更使某个函数的执行时间增加了
    500 微秒。该函数每月被调用十亿次。这意味着额外增加了 138.89 小时的计算开销！使用毫秒级精度，你很难捕获这类性能回归。不过，这个 API 本身也有一个很大的缺点。它在浏览器中的精度会被降低，因此只能在
    Node 中可靠使用。


    # 处理可能返回值或 Promise 的返回值


    ![](img/522b962b8325a030575a3d72d330a848_28_0.png)


    JavaScript 是动态类型语言。通常你只有查阅文档、了解返回值或者亲自尝试之后，才能知道调用一个函数会得到什么。而且也没有可靠的方法来判断一个函数是否是异步函数。很多测试形式在你把函数改成箭头函数后就会失效。不过，你可以利用
    JavaScript 的两个特性来应对。首先，你不需要直接 `await` 一个 promise。其次，`await` 只需要一个 `.then()` 方法就能工作，它并不检查是否是原生
    Promise。你的解决方案是：对于那些可能直接返回值也可能返回 Promise 的函数，对函数调用的结果进行检测。如果它是一个 Promise，它的类型是
    object，且它有一个 `then` 属性，该属性是一个函数。在这种情况下，你可以随后对该结果使用 `await`，从而尽可能简洁地处理两种情况。


    # 使用 Reduce 对数组值求和


    ![](img/522b962b8325a030575a3d72d330a848_29_0.png)


    对数组值求和是 `reduce()` 最直接的用例之一。这是一个很好的入门示例，能帮你了解最重要的数组方法之一。


    `reduce` 的方法名已经很好地说明了它的初衷——接受一个数组并将其缩减为单个值。对数组值求和正是这种缩减的典型场景。你接收一个数字数组，然后返回一个数字，表示该数组中所有数字的总和。


    不过，你稍后会了解到 `reduce()` 还有更高级的用例，可以用来重新实现许多其他数组方法，这也体现了这个方法的重要性。


    # 你的自动 React 版权页脚


    ![](img/522b962b8325a030575a3d72d330a848_30_0.png)


    这个技巧/说明最初只是年末的一个玩笑，但它背后确实很有道理。


    很多开发者只是在页脚放一个静态的版权信息，然后就再也不管了。


    然而，JavaScript 使得即使是这样简单的任务也可以轻松自动化。快速创建一个 `Date` 对象、获取完整的年份，然后将其动态渲染到页面页脚中，这并不需要花多少时间。


    只需几分钟就能完成，却能为你省去多年的重复劳动。


    # for 循环详解


    ![](img/522b962b8325a030575a3d72d330a848_31_0.png)


    for 循环是几乎所有编程语言都有的基本循环。掌握这种循环是每个软件开发者的必备技能。


    当然，JavaScript 也有 for 循环，其工作方式与许多其他语言相同。


    for 循环的头部包含三个部分。左边的是初始化部分。你可以在这里放置多条语句，用逗号分隔，它们只在循环开始前执行一次。中间的部分是条件判断。它应始终返回一个布尔值，表示循环是否应继续执行。最右边的部分在每次迭代步骤之后执行一次。通常在这里递增循环计数器。你也可以在这里放置多条语句，用逗号分隔。


    在循环体中，你放置每次迭代需要执行的所有语句。它可大可小，随你决定。不过一个好的经验法则是尽量保持简短，最好将过多的逻辑抽象到专门的函数中。


    # while 循环详解


    ![](img/522b962b8325a030575a3d72d330a848_32_0.png)


    while 循环是每个软件开发者都需要了解的另一种基本循环。


    当然，JavaScript 也有 while 循环，而且它的工作方式同样与许多其他语言相同。


    在 `while` 关键字之后，你放置一个条件，只有满足该条件循环才会继续。该条件在每次迭代步骤之前被检查。这意味着如果条件始终不为 `true`，循环将永远不会执行。条件之后，你可以放置一个包含任意数量语句的代码块。所有语句在每次迭代中按顺序执行一次。


    JavaScript 中有一点略有不同，那就是条件会被检测真值性（truthiness）。也就是说，除了 `true` 之外，它还接受字符串（空字符串除外）、数字（0
    除外）、对象、数组等。但为了清晰起见，你通常应该坚持使用布尔值。也有一些例外情况可以利用假值性（falsy），但非常少见。在大多数情况下，最好使用布尔值，或者编写一个工具方法来进行检查并返回相应的布尔值，这样便于命名和理解。


    # do-while 循环详解


    ![](img/522b962b8325a030575a3d72d330a848_33_0.png)


    循环类型有很多，do-while 循环就是其中之一。你可以把 do-while 循环看作 while 循环的替代版本，它有一个特别的不同之处。它不是在每次迭代步骤之前检查条件，而是在之后检查。它的写法也体现了这一点。


    首先是 `do` 语句，之后你可以打开一个代码块。在该代码块中，你可以放置任意数量的语句。代码块之后，一个 `while` 语句打开一个条件块，你在其中放置一个布尔表达式进行求值。这个语句顺序正是循环的执行顺序。`do`
    块首先被执行，然后才检查条件。


    这也导致了 do-while 循环的一个非常特定的行为：无论条件在开始时是 `true` 还是 `false`，`do` 块至少会执行一次。


    因此，当条件依赖于某些需要先求值的东西时，do-while 循环始终是一个很好的选择。


    # for-of 循环详解


    ![](img/522b962b8325a030575a3d72d330a848_34_0.png)


    又一种循环，但这次它比其他的更特殊一些。for-of 循环是 JavaScript 中其他语言里 for-each 循环的变体。它不需要处理数组和索引等，只需要知道你要迭代的对象即可。


    每个对象都可以有一个放在 `Symbol.iterator` 下的方法。该方法返回一个包含一个专用方法 `next()` 的对象。这个方法返回一个包含两个属性的对象：`value`，即当前迭代步骤的值；以及
    `done`，表示循环是否已完成。


    一旦一个对象提供了这个接口，你就可以为它创建一个 for-of 循环。循环头部包含关键字 `for` 和括号内的一个代码块。你用 `const` 或 `let`
    声明一个变量（每一步都会重新声明），在 `of` 关键字之后放置所谓的可迭代对象（iterable）。那就是在 `Symbol.iterator` 下实现了方法的对象。


    这种循环是不泄露实现细节的一个典型示例。无论对象有索引还是其他什么，都不重要。

    '
