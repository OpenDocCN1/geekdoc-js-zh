  md: '# Handling Errors


    ![](img/522b962b8325a030575a3d72d330a848_113_0.png)


    As you might remember, contracts can call other contracts in Solidity. This is
    why the language also has a concept of handling errors. If a call a contract makes
    gets reverted, you need a chance to react to this circumstance.

    Solidity uses the same try-catch mechanic as many other programming languages,
    only with a few minor differences. The try-statement is always followed by the
    call that can potentially throw. Within the try block, you can add more statements
    that are executed if the call is successful.

    The catch-statement is followed by the type of error to catch like in other languages.
    Within the following block, you can place as many statements as you want or need
    to process the error or even additionally revert your own contract.'
