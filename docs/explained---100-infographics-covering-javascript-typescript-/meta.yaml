  md: '# # Fisher-Yates Shuffle


    ![](img/522b962b8325a030575a3d72d330a848_68_0.png)


    The Fisher-Yates Shuffle is a fair shuffling algorithm. The algorithm itself does
    not look that complex at all, but its outcome is incredible. But let''s go into
    some theory quickly before we continue. A permutation of an array is just a different
    representation of that array with the same content. [1, 2] and [2, 1] are different
    permutations of each other, for example. The content remains the same, but the
    order changes. That is exactly what a shuffle does. It creates another permutation
    of an array.

    The Fisher-Yates Shuffle takes this to the next level by producing permutations
    where each possible permutation is equally likely to happen. This is what makes
    it so fair. There is no bias at all.'
