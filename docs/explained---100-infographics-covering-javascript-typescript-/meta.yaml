- md: '## The Simple Moving Average


    ![The Simple Moving Average](img/522b962b8325a030575a3d72d330a848_80_0.png)


    The moving average is an algorithm you often see applied in trading charts. It
    is a technique to reduce noise in charts and make trends transparent.


    The thought process behind the moving average is relatively simple: Take X numbers
    from a range of numbers (like stock prices), calculate an average over them, and
    create a new series of values with less entries overall. This resulting series
    has less movement within its chart when you plot it, and better represents the
    overall trends of the numbers you built the moving average on.


    Implementing this algorithm is as straightforward as its definition. You need
    to iterate over a list of numbers, calculate an average over X of them, and push
    the resulting value to a new list. That’s it already. The name of this technique
    is fancier than its actual implementation.


    ## TypeScript

    ### Utility Type Partial


    ![Utility Type Partial](img/522b962b8325a030575a3d72d330a848_81_0.png)


    TypeScript has a complete type system. TypeScript distinguishes between null/undefined
    and references. That''s something not many other languages do.


    Take Java or Go for example. A type can always be of its own type, or null/nil.
    In TypeScript, that is not the case. If you don''t explicitly declare a type as
    optional, it is always required. If you don''t mark properties of object types
    as optional with a question mark, the compiler expects them to hold a valid reference.


    Sometimes, however, you want the exact same object, but with all its properties
    as optional. Options objects are such a use case. You may want a specific set
    of properties but additionally supply a set of default values. In this case, instead
    of creating a completely new type, you can simply wrap your type with Partial.
    That saves a lot of code, and ties your inline type directly to the original one.


    ### Utility Type Required


    ![Utility Type Required](img/522b962b8325a030575a3d72d330a848_82_0.png)


    Required is the opposite of Partial. While Partial marks all properties of a type
    as optional, Required makes them, well, required. The same principles apply that
    also apply to Partial. You get the ability to quickly define a type inline, without
    having to define a new type or interface and manually copy all properties from
    the original type. One important concept you need to understand, though, is that
    Required, like all utility types, only apply at compile-time. Using Required will
    never lead to runtime errors, and the TypeScript compiler does not emit any additional
    code that could do runtime checks in any way. As soon as you leave the TypeScript
    world, Required is gone. This utility type doesn''t restrict JavaScript users
    of your code in any way.


    ### Utility Type Readonly


    ![Utility Type Readonly](img/522b962b8325a030575a3d72d330a848_83_0.png)


    Readonly is a utility type that makes all properties of a type readonly. This
    means that, at least within TypeScript code, you can''t modify those properties
    in any way. Doing so results in compile-time errors.


    This type is especially useful when you want to return specific objects from functions
    that can be used as input for other functions. When a user, during such a chain
    of operations, alters the properties of an object you created for them, you could
    get problems with logic depending on the state of those objects. Whenever such
    a case arises, using Readonly to create a compile-time immutable object can be
    a good choice.


    ### Utility Type Record


    ![Utility Type Record](img/522b962b8325a030575a3d72d330a848_84_0.png)


    Record is a great utility type when you want to use objects as map types. Although
    JavaScript and thus TypeScript have a dedicated Map data structure these days,
    objects still come with a specific kind of flexibility. You can access elements
    with bracket notation, and you can set them this way. For some developers, especially
    those that use JavaScript for way longer already, that''s the way you did it before
    Map came around.


    TypeScript, however, is a little picky regarding objects. If you don''t explicitly
    type something, the compiler always narrows down that type as far as possible.
    This means: An object with two properties a, and b, both containing a number leads
    to a type with two properties a and b, both a number.


    If you now want to put and access arbitrary data, you can use the utility type
    Record. It creates a type that accepts any string key, and a uniform value type
    defined in Record''s generic declaration.


    ### Utility Type Pick


    ![Utility Type Pick](img/522b962b8325a030575a3d72d330a848_85_0.png)


    Pick is one of those utility types that you probably use more often when working
    with TypeScript. It allows you to create a new type by extracting specific properties
    from an existing one.


    This approach has some beauty. Especially when you need incomplete variants of
    existing types, you can quickly extract those properties you need and use that
    new, incomplete type as parameter or return value.


    Let''s say, for example, that you have a type specifying all configuration settings
    of your app. You read those settings in and then pass them around. Individual
    functions process only parts of your whole config and set up parts of your app.


    You can tie the input of those functions directly to your config by picking only
    those properties from your config that you really need. Whenever your config changes
    and those properties disappear, you''ll get a direct hint by the TypeScript compiler
    that one of your processors now misses its required input.


    ### Utility Type Omit


    ![Utility Type Omit](img/522b962b8325a030575a3d72d330a848_86_0.png)


    Omit is the counterpart to Pick. While Pick extracts specific properties, Omit
    removes them and only picks all properties not specified.


    You can apply it in nearly the same use cases as Pick, only in a reversed way.
    You take a type, and remove specific properties from it to get a new type.


    Let''s get back to the config object example. Now imagine you have some functions
    that need nearly all config values, but not all. In this case, you omit a few
    of those properties and accept a lighter object as input parameter. By tying your
    types so closely together, you get notified way earlier when something breaks.


    If the config object changes, the type created by Omit changes as well. Even if
    you remove properties not omitted, you''ll still see that your function''s do
    now miss a few mandatory parameters.


    ### Utility Type ReturnType


    ![Utility Type ReturnType](img/522b962b8325a030575a3d72d330a848_87_0.png)


    ReturnType is not the most used utility type in TypeScript''s history, but it
    has its place. It extracts the return type of a function and creates a new type
    from it. This means that the resulting type is directly tied to the function.
    If that function changes its return type (either explicitly or implicitly), you''ll
    notice and can react to that by making the necessary adjustments (or rolling back
    the unwanted breaking change).


    ### Tie The Return Type Of A Function To Its Arguments


    ![Tie The Return Type Of A Function To Its Arguments](img/522b962b8325a030575a3d72d330a848_88_0.png)


    There are some occasions where you can make the life of anyone using a specific
    function really easy. One of those occasions is narrowing types automatically
    when usually a union would be returned. A union is a type that can either be type
    A or B or C (you get the idea). document.getElementsByTagName is such a function
    that makes good use of narrowing types automatically. The API actually returns
    only a collection of generic HTML elements. As soon as you pass in a valid tag
    name, however, you''ll notice that the type narrows immediately. The following
    code returns a collection of HTMLInputElement.


    ```

    const elements =

    document.getElementsByTagName(''input'');

    ```


    This is way more usable. And it''s all triggered by the input string. If you have
    such a function, make use of this. It improves developer experience massively.


    ## Interfaces


    ![Interfaces](img/522b962b8325a030575a3d72d330a848_89_0.png)


    Interfaces are one of two ways to define types in TypeScript. They allow you to
    define the specific structure of objects and their properties. But contrary to
    many other languages, classes and objects don''t need to explicitly implement
    interfaces to be considered valid. Any object that satisfies the interface is
    automatically considered fitting.


    This whole approach has one huge advantage; it allows full decoupling of modules.
    You don''t need to import an interface from another module or even library to
    use a function. As long as your object has the same structure as the type required,
    it just magically works. You could even recreate the same interface to type your
    object yourself and it would still work. That''s something that doesn''t work
    in other languages.'
