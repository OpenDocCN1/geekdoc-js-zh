    # # The Simple Moving Average


    ![](img/522b962b8325a030575a3d72d330a848_80_0.png)


    The moving average is an algorithm you often see applied in trading charts. It
    is a technique to reduce noise in charts and make trends transparent.


    The thought process behind the moving average is relatively simple:

    Take X numbers from a range of numbers (like stock prices),

    calculate an average over them, and create a new series of values

    with less entries overall. This resulting series has less movement

    within its chart when you plot it, and better represents the overall

    trends of the numbers you built the moving average on.


    Implementing this algorithm is as straightforward as its definition.

    You need to iterate over a list of numbers, calculate an average over

    X of them, and push the resulting value to a new list. That’s it

    already. The name of this technique is fancier than its actual

    implementation.'
  - '[PAGE 81]


    # # TypeScript

    ## Utility Type Partial


    ![](img/522b962b8325a030575a3d72d330a848_81_0.png)


    TypeScript has a complete type system. TypeScript distinguishes between null/undefined
    and references. That''s something not many other languages do.


    Take Java or Go for example. A type can always be of its own type, or null/nil.
    In TypeScript, that is not the case. If you don''t explicitly declare a type as
    optional, it is always required. If you don''t mark properties of object types
    as optional with a question mark, the compiler expects them to hold a valid reference.


    Sometimes, however, you want the exact same object, but with all its properties
    as optional. Options objects are such a use case. You may want a specific set
    of properties but additionally supply a set of default values. In this case, instead
    of creating a completely new type, you can simply wrap your type with Partial.
    That saves a lot of code, and ties your inline type directly to the original one.'
  - '[PAGE 82]


    # Utility Type Required


    ![](img/522b962b8325a030575a3d72d330a848_82_0.png)


    Required is the opposite of Partial. While Partial marks all properties of a type
    as optional, Required makes them, well, required. The same principles apply that
    also apply to Partial. You get the ability to quickly define a type inline, without
    having to define a new type or interface and manually copy all properties from
    the original type. One important concept you need to understand, though, is that
    Required, like all utility types, only apply at compile-time. Using Required will
    never lead to runtime errors, and the TypeScript compiler does not emit any additional
    code that could do runtime checks in any way. As soon as you leave the TypeScript
    world, Required is gone. This utility type doesn''t restrict JavaScript users
    of your code in any way.'
  - '[PAGE 83]


    # Utility Type Readonly


    ![](img/522b962b8325a030575a3d72d330a848_83_0.png)


    Readonly is a utility type that makes all properties of a type readonly. This
    means that, at least within TypeScript code, you can''t modify those properties
    in any way. Doing so results in compile-time errors.

    This type is especially useful when you want to return specific objects from functions
    that can be used as input for other functions. When a user, during such a chain
    of operations, alters the properties of an object you created for them, you could
    get problems with logic depending on the state of those objects. Whenever such
    a case arises, using Readonly to create a compile-time immutable object can be
    a good choice.'
  - '[PAGE 84]


    # Utility Type Record


    ![](img/522b962b8325a030575a3d72d330a848_84_0.png)


    Record is a great utility type when you want to use objects as map types. Although
    JavaScript and thus TypeScript have a dedicated Map data structure these days,
    objects still come with a specific kind of flexibility. You can access elements
    with bracket notation, and you can set them this way. For some developers, especially
    those that use JavaScript for way longer already, that''s the way you did it before
    Map came around.


    TypeScript, however, is a little picky regarding objects. If you don''t explicitly
    type something, the compiler always narrows down that type as far as possible.
    This means: An object with two properties a, and b, both containing a number leads
    to a type with two properties a and b, both a number.


    If you now want to put and access arbitrary data, you can use the utility type
    Record. It creates a type that accepts any string key, and a uniform value type
    defined in Record''s generic declaration.'
  - '[PAGE 85]


    # Utility Type Pick


    ![](img/522b962b8325a030575a3d72d330a848_85_0.png)


    Pick is one of those utility types that you probably use more often when working
    with TypeScript. It allows you to create a new type by extracting specific properties
    from an existing one.


    This approach has some beauty. Especially when you need incomplete variants of
    existing types, you can quickly extract those properties you need and use that
    new, incomplete type as parameter or return value.


    Let''s say, for example, that you have a type specifying all configuration settings
    of your app. You read those settings in and then pass them around. Individual
    functions process only parts of your whole config and set up parts of your app.


    You can tie the input of those functions directly to your config by picking only
    those properties from your config that you really need. Whenever your config changes
    and those properties disappear, you''ll get a direct hint by the TypeScript compiler
    that one of your processors now misses its required input.'
  - '[PAGE 86]


    # # Utility Type Omit


    ![](img/522b962b8325a030575a3d72d330a848_86_0.png)


    Omit is the counterpart to Pick. While Pick extracts specific properties, Omit
    removes them and only picks all properties not specified.


    You can apply it in nearly the same use cases as Pick, only in a reversed way.
    You take a type, and remove specific properties from it to get a new type.


    Let''s get back to the config object example. Now imagine you have some functions
    that need nearly all config values, but not all. In this case, you omit a few
    of those properties and accept a lighter object as input parameter. By tying your
    types so closely together, you get notified way earlier when something breaks.


    If the config object changes, the type created by Omit changes as well. Even if
    you remove properties not omitted, you''ll still see that your function''s do
    now miss a few mandatory parameters.'
  - '[PAGE 87]


    # Utility Type ReturnType


    ![](img/522b962b8325a030575a3d72d330a848_87_0.png)


    ReturnType is not the most used utility type in TypeScript''s history, but it
    has its place. It extracts the return type of a function and creates a new type
    from it. This means that the resulting type is directly tied to the function.
    If that function changes its return type (either explicitly or implicitly), you''ll
    notice and can react to that by making the necessary adjustments (or rolling back
    the unwanted breaking change).'
  - '[PAGE 88]


    # Tie The Return Type Of A Function To Its Arguments


    ![](img/522b962b8325a030575a3d72d330a848_88_0.png)


    There are some occasions where you can make the life of anyone using a specific
    function really easy. One of those occasions is narrowing types automatically
    when usually a union would be returned. A union is a type that can either be type
    A or B or C (you get the idea). document.getElementsByTagName is such a function
    that makes good use of narrowing types automatically. The API actually returns
    only a collection of generic HTML elements. As soon as you pass in a valid tag
    name, however, you''ll notice that the type narrows immediately. The following
    code returns a collection of HTMLInputElement.


    ```

    const elements =

    document.getElementsByTagName(''input'');

    ```


    This is way more usable. And it''s all triggered by the input string. If you have
    such a function, make use of this. It improves developer experience massively.


    90'
  - '[PAGE 89]


    # Interfaces


    ![](img/522b962b8325a030575a3d72d330a848_89_0.png)


    Interfaces are one of two ways to define types in TypeScript. They allow you to
    define the specific structure of objects and their properties. But contrary to
    many other languages, classes and objects don''t need to explicitly implement
    interfaces to be considered valid. Any object that satisfies the interface is
    automatically considered fitting.


    This whole approach has one huge advantage; it allows full decoupling of modules.
    You don''t need to import an interface from another module or even library to
    use a function. As long as your object has the same structure as the type required,
    it just magically works. You could even recreate the same interface to type your
    object yourself and it would still work. That''s something that doesn''t work
    in other languages.'
- md: ' ## Type Aliases


    Type aliases are the second way you can create types in TypeScript. They are not
    the same as interfaces and allow for even more flexibility with advanced features
    of composing existing types. With type aliases, you can intersect existing types
    (that is basically throwing two types together and making a new type from all
    their properties), create unions (that is type A OR type B OR type C, and even
    value A OR value B, etc.), and explicitly type functions. One good rule of thumb
    is to always go with interfaces until you need the flexibility of type aliases.
    If that need arises, you go with a type alias.


    ## Type Inference


    If you ever worked with Java prior to version 10, you might still have nightmares
    from explicit typing variable declarations. Always having to explicitly type the
    left side of an assignment, although the right side obviously states the type,
    seems unnecessary.


    Gladly, the TypeScript team took care of that by allowing the compiler to infer
    types wherever necessary. You almost never have to explicitly declare the type
    of a variable if you don''t want to. The compiler infers the type from the right
    side of an assignment and narrows it down as far as possible. Only if you think
    that it narrows the type down too far, you can explicitly declare a less narrow
    type to help the compiler out.


    Type inference does, however, not work for function parameters. You still need
    to type them explicitly (understandably). Function return types can also be inferred
    but you should better always explicitly type your functions. If you accidentally
    change a function''s return value from string to number, you''ll see the error
    in the function, and not somewhere else where a string was expected.


    ## Narrowing


    Narrowing is a concept in TypeScript that allows the compiler to get more specific
    with a type that it is unsure about otherwise. Unions are such a case where the
    TypeScript compiler is unsure and cannot reliably predict what type it actually
    deals with. You, as a developer, can help the compiler to create some safety around
    such types. With typeof checks, for example, you can give the compiler the absolute
    security that if that check yields true, you deal with that exact type. Within
    any code path that follows the true case of such a check, you can treat that variable
    as the type you checked for. And the compiler is even intelligent enough to know
    that an else case for a union with two possible types can only yield the type
    not checked for previously.


    ## Type Predicates


    Type predicates are functions with a special signature that only return a boolean
    in the end. This boolean, however, has a special meaning. It states: "This variable
    is of type X". And all this helps the TypeScript compiler to narrow down types
    where only you can help it out.


    Type predicates are an advanced form and utility for type narrowing. They cover
    those cases where a simple typeof check simply isn''t suitable enough anymore.
    If you use these special functions in an if-statement, or a switch, the compiler
    can narrow the type of any variable down to the specific type a predicate tested
    for. In all code paths that follow a true case of such a predicate test, the variable
    is considered to be of that specific type. This allows you to access all its properties
    without errors. But as soon as you leave that true case, the type goes back to
    what it was before.


    Predicates are especially useful when you work with inheritance and union types.
    And they don''t take much to implement.


    ## Generics


    Declaring types is a good thing. It creates security and helps developers to catch
    errors at compile-time; before their code crashes at runtime. Sometimes, however,
    types can become a burden. Especially if you want to make functions or classes
    more broadly applicable. Instead of duplicating your code over and over again
    to make it work with different types, you can use generics. As their name already
    suggests, they make code more generic and come with powerful functionality.


    The easiest use case is the one you see in the graphic above. assertPresent ties
    the return type of the function to the type it gets. If that is a string, it returns
    a string, etc. Within the function''s body, you can only access generic types
    at the level of their most common base type. In the case above that is unknown
    because that is what all types have in common.


    Sometimes, going with a generic type is way better than going with any because
    the latter can still lead to runtime errors if you access properties that don''t
    exist.


    ## Web 3 - Ethers


    ### Querying A Token''s Balance With ethers


    Overall, all blockchains provide some form of HTTP JSON RPC API. It''s not REST,
    not SOAP, or anything else. It''s something relatively special, but it works well.


    Conceptually, every smart contract is an API endpoint identified by its contract
    address. All methods publicly accessible are basically API endpoints of that contract.


    This is why JavaScript is a pretty great language (besides its dominance of the
    browser) to dynamically interface with smart contracts.


    ethers allows you to pass in the ABI of any contract together with its address.
    That ABI is nothing else than the function prototypes of the smart contract''s
    Solidity code. And with this, ethers can dynamically create a fully working API
    that allows you to call any function on that contract. Querying a balance of a
    token is only one example of that.


    ### Sending Ether With ethers


    Every blockchain has its native cryptocurrency. It is usually used to pay gas
    fees and miners/validators for their service.


    Ethereum is not different. And one of the most basic interactions you can have
    with a blockchain is to send currency from your account to another account.


    With ethers, the process is straightforward. All you need is a provider and a
    signer. The first one is the Read-API object. The latter is a Write-API object
    that holds your private keys you need to sign your transactions with.


    sendTransaction() returns an object for a pending transaction that you can wait
    for if you really need to wait for the transaction to settle.


    ### Getting The Balance Of An Address With ethers


    Another basic interaction with a blockchain is to query your own balance of the
    chain''s native currency. Unlike sending a transaction, you only need a provider
    for this. This is because all data on the blockchain is transparent for everyone,
    and the balance of your address is no different. You thus don''t need your private
    keys and no signed message to query the balance of any contract.


    Ethereum and chains that derive from it are a little special, though. They don''t
    support floating point numbers (at least not fully) right now. Instead, they offer
    support for 256-bit integer numbers. This is why the balance you get is actually
    in Wei, Ethereum''s smallest unit. One Ether consists of 1e18 Wei, and in order
    to get your balance in Ether, you need to convert it first.


    ### Getting The History Of An Address With ethers


    You could believe that it''s easy to query everything on a blockchain, but you
    would be wrong. Although a blockchain contains all that data, it is actually incredibly
    difficult to access more complex data. Even getting the history of an address
    on-chain is not straightforward with the API a blockchain node provides. This
    is one of the major reasons websites like Etherscan, PolygonScan, BscScan, etc.
    exist.


    Gladly, ethers has a special provider that you can use to access Etherscan, a
    website, and platform that indexes blockchain data. With the help of an EtherscanProvider,
    you can query the full history of any blockchain address with ease.


    There is one drawback to this provider and approach, though: Not passing in an
    API key (that costs money) uses a publicly available budget. You share this budget
    with everyone else, so to say.'
  mdcn: "\n ## 类型别名\n\n类型别名是你在 TypeScript 中创建类型的第二种方式。它们与接口不同，并且借助组合现有类型的高级特性提供了更大的灵活性。通过类型别名，你可以**交叉**现有类型（也就是说将两个类型合并，从它们的所有属性中创建一个新类型）、创建**联合**（即类型\
    \ A *或* 类型 B *或* 类型 C，甚至值 A *或* 值 B 等），以及显式地为函数添加类型。一个好的经验法则是：在需要类型别名的灵活性之前，始终优先使用接口。如果那种需求出现了，你再使用类型别名。\n\
    \n## 类型推断\n\n如果你曾在 Java 10 之前的版本上工作过，你可能仍然会对显式类型变量声明心有余悸。总是不得不在赋值左侧显式地声明类型，尽管右侧显然已经说明了类型，这看起来是不必要的。\n\
    \n值得庆幸的是，TypeScript 团队通过允许编译器在必要时推断类型解决了这个问题。如果你不愿意，几乎永远不必显式声明变量的类型。编译器会从赋值的右侧推断类型，并尽可能将其收窄。只有当你认为它把类型收窄得太过分时，你可以显式声明一个不那么窄的类型来帮助编译器。\n\
    \n然而，类型推断**不**适用于函数参数。你仍然需要显式地为它们添加类型（这是可以理解的）。函数返回类型也可以被推断，但你最好始终显式地为函数添加类型。如果你不小心将函数的返回值从\
    \ `string` 改成了 `number`，你会在函数内部看到这个错误，而不是在别处预期返回 `string` 的地方。\n\n## 类型收窄\n\n\
    类型收窄是 TypeScript 中的一个概念，它允许编译器对一个它本来不确定的类型变得更加具体。**联合类型**就是这样一种情况，TypeScript 编译器不确定且无法可靠地预测它实际处理的是什么类型。作为开发者，你可以帮助编译器围绕这类类型建立一些安全性。例如，通过\
    \ `typeof` 检查，你可以给编译器绝对的保证：如果该检查返回 `true`，你处理的就是那个确切的类型。在该检查 `true` 情况的任何后续代码路径中，你可以将该变量视为你检查过的类型。而且编译器甚至足够智能，知道对于有两个可能类型的联合类型，其\
    \ `else` 情况只能是之前未被检查过的类型。\n\n## 类型谓词\n\n类型谓词是具有特殊签名的函数，最终只返回一个布尔值。然而，这个布尔值有着特殊的含义。它表示：\"\
    这个变量是 X 类型\"。所有这些都有助于 TypeScript 编译器在那些只有你能帮上忙的地方收窄类型。\n\n类型谓词是类型收窄的一种高级形式和实用工具。它们涵盖那些简单的\
    \ `typeof` 检查已经不再足够的场景。如果你在 `if` 语句或 `switch` 中使用这些特殊函数，编译器可以将任何变量的类型收窄到谓词测试的具体类型。在该谓词测试\
    \ `true` 情况的所有后续代码路径中，该变量被视为属于该特定类型。这允许你访问它的所有属性而不会出错。但一旦离开该 `true` 情况，类型就会恢复到之前的状态。\n\
    \n谓词在你处理**继承**和**联合类型**时特别有用。而且它们的实现并不复杂。\n\n## 泛型\n\n声明类型是件好事。它创造安全性，帮助开发者在编译时捕获错误——在代码运行时崩溃之前。然而，有时类型可能成为一种负担。特别是如果你想让函数或类具有更广泛的适用性。与其为了让它适用于不同类型而一遍又一遍地重复你的代码，你可以使用**泛型**。正如它们的名字所暗示的，它们使代码更加通用，并拥有强大的功能。\n\
    \n最简单的用例就是上面图表中所示。`assertPresent` 将函数的返回类型与它接收的类型绑定。如果传入的是 `string`，它就返回 `string`，等等。在函数体内部，你只能在最通用基类型的层次上访问泛型类型。在上面的例子中，就是\
    \ `unknown`，因为那是所有类型共有的。\n\n有时，使用泛型类型比使用 `any` 要好得多，因为后者仍然可能导致运行时错误——如果你访问了不存在的属性。\n\
    \n## Web 3 - Ethers\n\n### 使用 ethers 查询代币余额\n\n总体而言，所有区块链都提供某种形式的 HTTP JSON RPC\
    \ API。它不是 REST，不是 SOAP，也不是其他什么。它是相对特殊的一种，但工作得很好。\n\n从概念上讲，每个智能合约都是一个由其合约地址标识的\
    \ API 端点。所有公开可访问的方法基本上都是该合约的 API 端点。\n\n这就是 JavaScript 作为一门相当出色的语言（除了它在浏览器中的主导地位之外）来动态地与智能合约交互的原因。\n\
    \nethers 允许你传入任何合约的 ABI 及其地址。该 ABI 不过是智能合约 Solidity 代码的函数原型。有了这个，ethers 可以动态创建一个完整可用的\
    \ API，允许你调用该合约上的任何函数。查询代币余额只是其中一个例子。\n\n### 使用 ethers 发送以太币\n\n每个区块链都有自己的原生加密货币。它通常用于支付\
    \ gas 费用和矿工/验证者的服务费用。\n\n以太坊也不例外。你可以与区块链进行的最基本交互之一就是将自己的账户中的货币发送到另一个账户。\n\n使用\
    \ ethers，这个过程很简单。你所需要的只是一个 **provider**（提供者）和一个 **signer**（签名者）。第一个是读取 API 对象。后者是一个写入\
    \ API 对象，保存着你签署交易所需的私钥。\n\n`sendTransaction()` 返回一个待处理交易的对象，如果确实需要等待交易完成，你可以等待它。\n\
    \n### 使用 ethers 获取地址余额\n\n与区块链的另一个基本交互是查询你自己在链上原生货币的余额。与发送交易不同，你只需要一个 provider\
    \ 即可。这是因为区块链上的所有数据对所有人都是透明的，你的地址余额也不例外。因此，你不需要私钥，也不需要签名消息来查询任何合约的余额。\n\n不过，以太坊及其衍生链有点特殊。它们目前**不**支持浮点数（至少不完全支持）。相反，它们提供对\
    \ 256 位整数的支持。这就是为什么你获取到的余额实际上是 **Wei**，以太坊的最小单位。一个 Ether 等于 1e18 Wei，要得到以 Ether\
    \ 为单位的余额，你需要先进行转换。\n\n### 使用 ethers 获取地址历史记录\n\n你可能认为在区块链上查询一切都很简单，但你错了。虽然区块链包含所有数据，但访问更复杂的数据实际上极其困难。即使是获取链上地址的历史记录，通过区块链节点提供的\
    \ API 也不是直接的。这是 Etherscan、PolygonScan、BscScan 等网站存在的主要原因之一。\n\n值得庆幸的是，ethers 有一个特殊的\
    \ provider，你可以用它来访问 Etherscan——一个索引区块链数据的网站和平台。借助 `EtherscanProvider`，你可以轻松查询任何区块链地址的完整历史记录。\n\
    \n不过，这个 provider 和这种方法有一个缺点：如果不传入 API 密钥（这需要付费），则会使用一个公开可用的配额。可以这么说，你与其他所有人共享这个配额。\n"
