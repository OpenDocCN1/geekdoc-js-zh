    that Set and Map have the same method. With arrays, sets, and maps, you have all
    built-in data structures of JavaScript covered. And this means that all data structures
    we have can be iterated in a common way.

    By using entries(), you can write generic logic that can process any data structure
    in JavaScript by its “key” and its “value.”

    For an Array, entries() returns an iterator returning tuples of [index, value].
    For a Set, it returns tuples of [value, value]. And for a Map, entries() returns
    tuples of [key, value].

    Thanks to array destructuring, you can get “key” and “value” as individual variables
    and process them to your liking. This makes entries() the only interface for data
    structure iteration that works uniformly across them all.'
