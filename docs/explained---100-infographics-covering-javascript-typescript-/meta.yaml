    a variable (which is redeclared for each step) with either const or let, and after
    the keyword of, you place the so-called iterable. That''s the object that has
    a method under Symbol.iterator implemented.


    This kind of loop is a prime example of not leaking implementation details. It
    doesn''t matter whether the object has indices or something else.'
- md: " ## Anatomy Of An Object Destructuring Assignment\n\nObject destructuring assignments\
    \ are a great way to extract one or multiple properties from an object. They are\
    \ real life- and time-savers if you want to make your code more readable. They\
    \ are relatively straightforward to use, although you need to first get used to\
    \ the syntax. After that, however, they'll be way better than always accessing\
    \ objects through long property-chains. The syntax itself is good to remember.\
    \ You begin with let or const, then put curly braces and put the names of all\
    \ properties you want to extract within there. Within those braces, you can rename\
    \ each variable and assign a default value. After that follows a usual assignment,\
    \ only that in this case, it signals which object to extract the properties from.\n\
    \n## Anatomy Of Array.map\n\nmap() is a functional array method and its purpose\
    \ is to transform values of one kind into values of another kind.\n\nThe function\
    \ is a member of a family of functions that abstract the way of 'how' it is done\
    \ away from the developer. Instead it focuses on the 'what'. A developer doesn't\
    \ need to care about iterating over the array, map() does that. The only thing\
    \ a developer needs to care about is what they want to get done. This is namely\
    \ the transformation of a value.\n\nLet's look at this example:\n\n```\nconst\
    \ numbers = [1, 2, 3];\nconst multipliedByTwo = numbers.map((num) => num * 2);\n\
    ```\n\nThe only thing you need to specify is how the value is transformed. In\
    \ this case you want to multiply each value by two. For you, it's irrelevant whether\
    \ map() uses a for loop, a for-of loop, or something else. You know that when\
    \ map() is done, you have a new array with values, multiplied by 2.\n\n38\n\n\
    ## Anatomy Of Array.flatMap\n\nflatMap() is another functional array method. It\
    \ works similar to map() but with one difference. Instead of transforming one\
    \ value into another value, it transforms one value into an array of values. And\
    \ those values then get appended to a new array. Let's take a look at a quick\
    \ example. Imagine you have an authors object that holds each book those authors\
    \ have published. And now, you want to get all books from a specific set of authors.\n\
    \n```\nconst authors = [{books: [...]}, {books: [...]}];\nconst allBooks = authors.flatMap((author)\
    \ =>\n  author.books);\n// allBooks is now a flat array of all books\n```\n\n\
    With map(), you would have gotten a 2-dimensional array now. flatMap(), however,\
    \ took care of giving you a single array with books ordered in the following way:\
    \ First, all books of the first author, then all books of the second author, and\
    \ so on.\n\n## Anatomy Of Array.forEach\n\nforEach() is a functional array method\
    \ that exists to allow you to perform side effects. Unlike map() or flatMap(),\
    \ forEach() doesn't expect you to return anything from the callback. Its sole\
    \ purpose is to let you consume the values of your array. When you use forEach(),\
    \ you don't get a new array as a result. This means you can't continue to chain\
    \ other functional methods. There are two popular use cases for forEach(). One\
    \ is to log the elements of your array, and the other is as a replacement for\
    \ a for loop, using closures, like below, for example.\n\n```\nconst books = ...;\n\
    books.forEach((book) => {\n  if (book.author === 'Steven King') {\n    stevenKing.push(book);\n\
    \  }\n});\n```\n\nYou only need to state what you want. forEach() takes care of\
    \ the rest for you.\n\n## Anatomy Of Array.every\n\nevery() is yet another functional\
    \ array method. Its purpose is to test whether all elements of an array satisfy\
    \ a condition specified within the callback passed to it.\n\nOne example use case\
    \ for every() is when you want to test that one array is a subset of another array,\
    \ like this:\n\n```\nconst array = [1, 2, 3];\nconst containsTwo = array.some((element)\
    \ => element\n=== 2);\n// => true\n```\n\nYou will also find another good use\
    \ case for some() a few pages further down this book.\n\n41\n\n## How To Format\
    \ The Output Of JSON.stringify\n\nIt doesn't seem to be known too well, but JSON.stringify()\
    \ has three parameters. The first one is the object to be serialized. The second\
    \ one is a replacer, which you can use to transform values. The third one is the\
    \ indentation. If you ever want to format your JSON in a human-readable way, without\
    \ it all being crammed into one line, you can use exactly this one to either add\
    \ a number or a string. Adding a number indicates the number of whitespace characters\
    \ to use for indentation (capped at 10). If you use a string, the first ten characters\
    \ of that string are used to indent the output of the serialized JSON.\n\n## Array.entries\n\
    \nWith all the ways of iterating over arrays, entries() does not seem like much.\
    \ But, in fact, entries is a very useful array method when you take into account\
    \ that Set and Map have the same method. With arrays, sets, and maps, you have\
    \ all built-in data structures of JavaScript covered. And this means that all\
    \ data structures we have can be iterated in a common way.\n\nBy using entries(),\
    \ you can write generic logic that can process any data structure in JavaScript\
    \ by its \"key\" and its \"value.\"\n\nFor an Array, entries() returns an iterator\
    \ returning tuples of [index, value]. For a Set, it returns tuples of [value,\
    \ value]. And for a Map, entries() returns tuples of [key, value].\n\nThanks to\
    \ array destructuring, you can get \"key\" and \"value\" as individual variables\
    \ and process them to your liking. This makes entries() the only interface for\
    \ data structure iteration that works uniformly across them all.\n\n## How To\
    \ Test Whether An Array Contains A Specific Object\n\nJavaScript has its quirks.\
    \ One of those is that you can't reliably compare two objects without the help\
    \ of a deepEquals function from a library. This also affects built-in array methods\
    \ like includes(), indexOf(), etc.\n\nYou can't use includes() to test whether\
    \ an object is contained within an array. Even if your object exactly matches\
    \ what you put into includes, it doesn't work because they have different identities.\
    \ Gladly, array's some() method allows you to pass in a callback. And with this\
    \ callback, you can implement an equal check yourself. If you test all properties\
    \ that are usually primitives, you can give an accurate hint of what it needs\
    \ to look for.\n\nAnd even better, some() returns true as soon as at least one\
    \ element of the array satisfies the check. This is all you need; one hit verifying\
    \ that the object is contained within the array.\n\n## Template Literals\n\nTemplate\
    \ strings were introduced with ES6 to make string interpolation easier for developers.\
    \ They also provide a simple way to create multi-line strings.\n\nA template string\
    \ works as follows:\n\n```\n`You can add any ${variable} inside the backticks\
    \ and ${theJavaScriptRuntime} takes care of ${creatingOneString} for you. Even\
    \ better, inside the blocks, you can even call methods or do calculations like\
    \ ${1 + 2 * 10}.`\n```\n\nThis type of building a string is way more readable\
    \ than appending strings with the +-operator. Especially syntax highlighting makes\
    \ template strings super straightforward to use.\n\nNowadays, there is nearly\
    \ no reason to append strings with the +-operator, except when appending variables\
    \ in a loop. The latter is, of course, still a very valid use case.\n\n## Array.length\
    \ Is No Ordinary Property\n\nArray's length property is an exception in many regards.\
    \ One of its most interesting behaviors is that you can truncate the array by\
    \ setting length to 0. Yes, you read that right. You can set the length property\
    \ and empty your array with it.\n\nThis is because length is implemented as a\
    \ getter and setter method. By doing this, you can perform actions whenever someone\
    \ accesses or assigns a property.\n\nThis behavior is surprising, so I wouldn't\
    \ recommend anyone to do the same. There is a reason we differentiate between\
    \ properties and functions. If I call length() or length(arg), I expect something\
    \ else to happen because the parentheses mark a function.\n\nI personally don't\
    \ know why this behavior was initially implemented. Still, it seems as if even\
    \ the language creators regret their choice because this technique does not see\
    \ widespread use within JavaScript's standard library."
  mdcn: "\n## 对象解构赋值的剖析\n\n对象解构赋值是从对象中提取一个或多个属性的好方法。如果你想让代码更易读，它们确实是省时省力的好帮手。使用起来相对简单，不过你需要先熟悉一下语法。但一旦习惯了，这种写法会比通过长属性链访问对象好得多。语法本身值得记住：以\
    \ `let` 或 `const` 开头，然后放上花括号，里面列出所有要提取的属性名。在花括号内，你可以重命名每个变量并设置默认值。之后是一个普通的赋值语句，只是在这个场景下，它指明了要从哪个对象中提取属性。\n\
    \n## Array.map 的剖析\n\n`map()` 是一个函数式数组方法，其作用是将一种类型的值转换为另一种类型的值。\n\n这个函数属于一系列将“如何做”抽象掉、让开发者专注于“做什么”的函数之一。开发者无需关心数组的迭代过程，`map()`\
    \ 会处理。开发者唯一需要关心的是想实现什么。这里具体指的就是值的转换。\n\n来看这个例子：\n\n```\nconst numbers = [1, 2,\
    \ 3];\nconst multipliedByTwo = numbers.map((num) => num * 2);\n```\n\n你只需要指定值如何转换即可。在这个例子中，你想将每个值乘以二。对你而言，`map()`\
    \ 使用 `for` 循环、`for...of` 循环还是其他方式并不重要。你知道当 `map()` 执行完毕时，你会得到一个新数组，其元素是原数组值乘以\
    \ 2 的结果。\n\n38\n\n## Array.flatMap 的剖析\n\n`flatMap()` 是另一个函数式数组方法。它的工作方式类似于 `map()`，但有一个区别。它不是将一个值转换为另一个值，而是将一个值转换为一个值的数组。然后这些值会被追加到一个新数组中。来看一个简单的例子。假设你有一个\
    \ `authors` 对象，其中包含了每位作者出版的所有书籍。现在，你想获取一组特定作者的所有书籍。\n\n```\nconst authors = [{books:\
    \ [...]}, {books: [...]}];\nconst allBooks = authors.flatMap((author) =>\n  author.books);\n\
    // allBooks 现在是一个包含所有书籍的扁平化数组\n```\n\n如果使用 `map()`，你现在得到的将是一个二维数组。而 `flatMap()`\
    \ 为你提供了一个单一数组，其中的书籍按以下顺序排列：首先是第一位作者的所有书籍，然后是第二位作者的所有书籍，依此类推。\n\n## Array.forEach\
    \ 的剖析\n\n`forEach()` 是一个函数式数组方法，其存在是为了让你执行副作用操作。与 `map()` 或 `flatMap()` 不同，`forEach()`\
    \ 不期望从回调函数返回任何值。它的唯一目的是让你消费数组的值。当你使用 `forEach()` 时，不会得到一个新数组作为结果。这意味着你无法继续链式调用其他函数式方法。`forEach()`\
    \ 有两个常见的使用场景：一个是打印数组的元素，另一个是作为 `for` 循环的替代品，利用闭包实现，例如下面这样：\n\n```\nconst books\
    \ = ...;\nbooks.forEach((book) => {\n  if (book.author === 'Steven King') {\n\
    \    stevenKing.push(book);\n  }\n});\n```\n\n你只需声明你想要做什么。`forEach()` 会为你处理剩下的事情。\n\
    \n## Array.every 的剖析\n\n`every()` 是又一个函数式数组方法。其作用是测试数组中的所有元素是否都满足传递给它的回调函数中指定的条件。\n\
    \n`every()` 的一个用例是当你想测试一个数组是否是另一个数组的子集时，就像这样：\n\n```\nconst array = [1, 2, 3];\n\
    const containsTwo = array.some((element) => element\n=== 2);\n// => true\n```\n\
    \n你还会在本书后面的几页中发现 `some()` 的另一个好用例。\n\n41\n\n## 如何格式化 JSON.stringify 的输出\n\n可能不太为人所知，但\
    \ `JSON.stringify()` 有三个参数。第一个是要序列化的对象。第二个是替换器，你可以用来转换值。第三个是缩进。如果你曾想以人类可读的方式格式化\
    \ JSON，而不是全部挤在一行，你可以使用这个参数，传入一个数字或字符串。传入数字表示用于缩进的空白字符数（最大为 10）。如果使用字符串，则该字符串的前十个字符将用于缩进序列化后的\
    \ JSON 输出。\n\n## Array.entries\n\n尽管有多种遍历数组的方式，`entries()` 似乎并不起眼。但事实上，考虑到 `Set`\
    \ 和 `Map` 也有相同的方法，`entries()` 是一个非常有用的数组方法。对于数组、集合和映射，你涵盖了 JavaScript 所有内置的数据结构。这意味着我们拥有的所有数据结构都可以通过一种通用的方式来遍历。\n\
    \n通过使用 `entries()`，你可以编写通用的逻辑，通过“键”和“值”来处理 JavaScript 中的任何数据结构。\n\n对于数组，`entries()`\
    \ 返回一个迭代器，产生 `[index, value]` 元组。对于集合，它返回 `[value, value]` 元组。对于映射，`entries()`\
    \ 返回 `[key, value]` 元组。\n\n得益于数组解构，你可以将“键”和“值”作为单独的变量获取，并按你的意愿处理它们。这使得 `entries()`\
    \ 成为唯一能在所有数据结构上统一工作的迭代接口。\n\n## 如何测试数组是否包含特定对象\n\nJavaScript 有其奇特之处。其中之一就是，如果没有库中的\
    \ `deepEquals` 函数帮助，你无法可靠地比较两个对象。这也影响了内置的数组方法，如 `includes()`、`indexOf()` 等。\n\n\
    你不能使用 `includes()` 来测试数组中是否包含一个对象。即使你的对象与传入 `includes()` 的对象完全匹配，它也不起作用，因为它们具有不同的标识。幸运的是，数组的\
    \ `some()` 方法允许你传入一个回调函数。通过这个回调函数，你可以自己实现相等性检查。如果你测试通常是原始类型的所有属性，你可以准确地提示需要查找什么。\n\
    \n更妙的是，`some()` 在数组中至少有一个元素满足检查时就返回 `true`。这正是你需要的；一次命中就足以验证该对象包含在数组中。\n\n## 模板字面量\n\
    \n模板字符串是在 ES6 中引入的，旨在让开发者更容易地进行字符串插值。它们还提供了一种创建多行字符串的简单方式。\n\n模板字符串的工作方式如下：\n\n\
    ```\n`You can add any ${variable} inside the backticks and ${theJavaScriptRuntime}\
    \ takes care of ${creatingOneString} for you. Even better, inside the blocks,\
    \ you can even call methods or do calculations like ${1 + 2 * 10}.`\n```\n\n这种构建字符串的方式比使用\
    \ `+` 运算符拼接字符串更具可读性。尤其是语法高亮功能，使得模板字符串的使用非常直观。\n\n如今，几乎没有理由再使用 `+` 运算符拼接字符串，除非是在循环中追加变量。后者当然仍然是一个非常有效的用例。\n\
    \n## Array.length 并非普通属性\n\n数组的 `length` 属性在很多方面都是个例外。它最有趣的行为之一是，你可以通过将 `length`\
    \ 设置为 0 来截断数组。是的，你没看错。你可以设置 `length` 属性并用它来清空数组。\n\n这是因为 `length` 被实现为一个 getter\
    \ 和 setter 方法。这样，每当有人访问或赋值给这个属性时，你都可以执行操作。\n\n这种行为令人惊讶，所以我并不推荐任何人这样做。我们区分属性和函数是有原因的。如果我调用\
    \ `length()` 或 `length(arg)`，我期望会有不同的事情发生，因为括号表示这是一个函数。\n\n我个人不知道最初为什么会实现这种行为。尽管如此，似乎连语言的创建者也后悔了这个选择，因为这种技术在\
    \ JavaScript 标准库中并未广泛使用。\n"
