    # Array.length Is No Ordinary Property


    ![](img/522b962b8325a030575a3d72d330a848_44_0.png)


    Array''s length property is an exception in many regards. One of its most interesting
    behaviors is that you can truncate the array by setting length to 0. Yes, you
    read that right. You can set the length property and empty your array with it.


    This is because length is implemented as a getter and setter method. By doing
    this, you can perform actions whenever someone accesses or assigns a property.


    This behavior is surprising, so I wouldn''t recommend anyone to do the same. There
    is a reason we differentiate between properties and functions. If I call length()
    or length(arg), I expect something else to happen because the parentheses mark
    a function.


    I personally don''t know why this behavior was initially implemented. Still, it
    seems as if even the language creators regret their choice because this technique
    does not see widespread use within JavaScript''s standard library.'
- md: '## Sorting Numbers Correctly


    ![](img/522b962b8325a030575a3d72d330a848_45_0.png)


    JavaScript''s behavior is pretty unique when it comes to sorting, but there is
    a relatively simple reason for it. If you ever tried to call sort() on an array
    of numbers, you might have been surprised to see that the numbers are not sorted
    like you would expect them to be. This is because JavaScript is dynamically typed.
    An array can contain elements of many different types, and there is only one universal
    type that covers all other possible types, a string. This is why sort(), when
    called without a callback, converts the elements to strings and then compares
    them lexically. [1, 2, 11, 21] thus becomes [1, 11, 2, 21] when sorted. You can
    fix this by passing a callback to sort(), and the logic it expects is as follows:
    If a > b, return a positive number. If a < b, return a negative number. If a ===
    b, return 0. a - b does exactly this. When you pass this callback, you''ll easily
    sort your array of numbers in ascending order. If you want a descending order,
    b - a is your way to go.


    ## Use Array.includes Instead Of indexOf


    ![](img/522b962b8325a030575a3d72d330a848_46_0.png)


    If you worked with JavaScript a little longer ago, you''ll probably still remember
    using indexOf() to test whether an array contained a specific element. This was
    because there was no contains/includes method for arrays.


    Gladly, nowadays, we have an includes() method, and you can finally throw all
    the workarounds away that check whether indexOf returns 0 or any positive number.


    Code readability is one of the most important things you always need to monitor
    closely. We, as software developers, read code more often than we write it. Every
    time we encounter a bug, we''ll probably read code to understand what''s happening.
    Sometimes, we refactor code to make it faster or to improve it. That''s also a
    lot of reading. Using revealing method names already improves the situation a
    lot. You can argue that other developers know that indexOf(whatever) > -1 checks
    whether the array includes a specific element, but reading includes(whatever)
    does not even take you a second thought. It is clear at first sight what happens.


    ## Prevent An Object Key From Being Enumerable


    ![](img/522b962b8325a030575a3d72d330a848_47_0.png)


    Enumerable properties are properties that either Object.keys() or a for-in loop
    would pick up. It’s pretty helpful when you want to make deep clones of objects
    for example. Iterate over an object’s keys, and copy everything over you can catch.
    Sometimes, however, you don’t want a property to be enumerable.


    undefined is ambiguous. It either means “there is no key” or it means “there is
    no value”. If you create an object and explicitly set one of its keys to undefined,
    the key exists, but there is no property. This makes the key enumerable.


    There’s no issue for one property, just leave it out. But what if you have multiple
    properties? That’s a lot of if-statements, believe me. If you look for a simpler
    solution, then simply spread each property conditionally as you see above. If
    the value is not there, the key does also not appear on the object.


    ## Short Circuit Evaluation With The Logical AND


    ![](img/522b962b8325a030575a3d72d330a848_48_0.png)


    Short circuit evaluation is actually a feature related to boolean algebra. Boolean
    expressions can be optimized by only doing the work that is really necessary.
    If you can already safely state that a condition is true before you went through
    the whole expression, you don''t need to evaluate the rest of it.


    The logical AND is true if and only if both conditions related to it are true.
    That''s its definition. Only true && true is true. Everything else is false. You
    only need to look at the right side when the left side is already true.


    In JavaScript, you can place any statement in a boolean expression and JavaScript
    takes care of conversion for you. You can, for example, combine a boolean condition
    and the logical AND with a function call. The call will only get executed when
    the condition is true. That is the same behavior as an if-statement has. Only
    if the condition is true, the block of code gets executed. If the condition yields
    false, the block is skipped.


    ## Short Circuit Evaluation With The Logical OR


    ![](img/522b962b8325a030575a3d72d330a848_49_0.png)


    The same trick that works for the logical AND does also work with the logical
    OR. The only difference between OR and AND is that OR stands for a negated condition
    in the statement.


    A logical OR is true if at least one side of the expression is true. If the left
    side is already true, you don''t need to evaluate the right side. But if the left
    side is false, you still need to check the right side. If you now combine a boolean
    condition with the logical OR and a functional call, you get exactly the behavior
    of an if-statement that checks for a negated condition. Only if the negated check
    yields true (which means the actual condition is false), the block of code gets
    executed. One word of advice that is valid for both tricks, though: It is difficult
    to read. Many JavaScript developers think they are clever when using it, but they
    aren''t. This is usually a trick minimizers use to reduce your code size, but
    an if-statement is still way more readable than this shortcut.


    ## Array.copyWithin


    ![](img/522b962b8325a030575a3d72d330a848_50_0.png)


    copyWithin() is a high-performance method on arrays. It was specifically designed
    for typed arrays and is meant to perform copy operations within arrays as fast
    as possible.


    There are some circumstances, like when dealing with graphics (2D, 3D) or matrix
    math, where it makes sense to work with mutable data and copy data around quickly.


    In such cases, using copyWithin() is a way better option than copying data around
    yourself.


    ## Proxies


    ![](img/522b962b8325a030575a3d72d330a848_51_0.png)


    A Proxy is a wrapper object. A Proxy behaves like the object it wraps, it smells
    like it, it looks like it. Under the hood, however, a Proxy allows a developer
    to inject arbitrary logic. The injection works with so-called traps. A trap is
    a special function that reacts to certain events. The get trap is fired whenever
    any property on that object is accessed, for example. A set trap is fired whenever
    you assign to a property. And there are many other traps a developer can implement
    for a Proxy. All this allows developers to inject advanced logic into objects
    without those objects needing to know that they are being enhanced. You could,
    for example, generate proxies that sync the state of objects to a database whenever
    that state changes. That''s basic functionality of an ORM.


    ## The Void Operator


    ![](img/522b962b8325a030575a3d72d330a848_52_0.png)


    There was actually a time when undefined could be redefined. Yes, that’s true.
    Nowadays, however, undefined is and stays undefined.


    But back then, there was only one way to get undefined once it was redefined:
    With the void operator.


    The operator turns anything into undefined, no matter what it is.


    These days, there are only a few use cases left for the void operator:


    - 1. Ensuring that no matter whether a function changes its return type, you keep
    undefined

    - 2. Preventing the browser from following a link with an href that is made up
    of JavaScript


    The second case is still very valid. If you place JavaScript code within a link’s
    href tag and want to handle the actual navigation with an onclick handler, you
    should void before that code. Otherwise, most browsers load a new page showing
    the plain JavaScript code.


    ## How To Check If A Number Is A Power Of Two


    ![](img/522b962b8325a030575a3d72d330a848_53_0.png)


    There might not be many scenarios in which you really need to check whether a
    number is a power of two. But there is one thing that makes this trick pretty
    valuable: It shows that knowing how things work can be an immense benefit.


    In this case, you can make use of a trait of binary numbers. A number that is
    a power of two will always look like this:

    10 (2)

    100 (4)


    Let''s now see what happens if we subtract one:

    01 (1)

    011 (3)


    You can continue this forever, and you will see that it always follows the same
    pattern. If you use the binary AND on those pairs of numbers now, you will always
    get 0 as the result. That makes it super straightforward to implement the algorithm
    you see above.'
