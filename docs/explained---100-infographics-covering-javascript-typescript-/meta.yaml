    balance of the contract itself can be accessed by using address(this).balance;


    It is perfectly fine to leave the receive() function empty. That''s usually even
    a good idea because send() and transfer() don''t have a lot of gas to work with.
    If receive() does too much, the call runs out of gas and aborts.'
