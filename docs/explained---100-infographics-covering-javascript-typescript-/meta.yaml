  md: '# # JavaScript


    # ## The Pipeline Operator


    ![](img/522b962b8325a030575a3d72d330a848_1_0.png)


    It may not look like much, and the pipeline operator is a controversial proposal,
    but it has its worth.

    You can, of course, argue that formatting the left side to span multiple lines
    makes the code more readable. Still, the pipeline operator transforms the code
    into something that looks like an object with a fluid, functional API while it
    actually isn''t.

    Whenever you can avoid creating a class, you definitely should. Functional programming
    is more about primitives and functional composition than objects and state.

    A class is heavy, and it carries methods and state. Especially object-functional
    classes require a lot of state transition logic that quickly becomes difficult
    to maintain. Syntactic sugar that emulates this behavior without all the work
    necessary is thus a very welcomed addition to JavaScript, in my opinion.'
  merge: -1
