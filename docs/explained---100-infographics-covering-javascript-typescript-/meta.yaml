  md: '# # Anatomy Of A For Loop


    ![](img/522b962b8325a030575a3d72d330a848_31_0.png)


    A for-loop is one of the basic loops nearly all programming languages know. Knowing
    this loop is a core competency of any software developer.


    Of course, JavaScript also has a for loop that works the same way as in many other
    languages.


    The header of a for loop contains three blocks. The left one is the initialization
    block. You can put multiple statements here, separated by a comma, executed exactly
    once, before the loop starts. The middle block is the condition. It should always
    return a boolean and state whether the loop shall continue. Lastly, the right
    block is executed once after each step of the iteration. It is here that you typically
    increment a loop counter. You can also place multiple statements here, separated
    by a comma.


    Within the loop block, you put all statements that should be executed for each
    step of the iteration. It can be as small or large as you like. A good rule of
    thumb is to keep it as short as possible, though, and better abstract too much
    logic away into dedicated functions.'
