  md: '# # The Simple Moving Average


    ![](img/522b962b8325a030575a3d72d330a848_80_0.png)


    The moving average is an algorithm you often see applied in trading charts. It
    is a technique to reduce noise in charts and make trends transparent.


    The thought process behind the moving average is relatively simple:

    Take X numbers from a range of numbers (like stock prices),

    calculate an average over them, and create a new series of values

    with less entries overall. This resulting series has less movement

    within its chart when you plot it, and better represents the overall

    trends of the numbers you built the moving average on.


    Implementing this algorithm is as straightforward as its definition.

    You need to iterate over a list of numbers, calculate an average over

    X of them, and push the resulting value to a new list. That’s it

    already. The name of this technique is fancier than its actual

    implementation.'
