  md: '# ## Type Inference


    ![](img/522b962b8325a030575a3d72d330a848_91_0.png)


    If you ever worked with Java prior to version 10, you might still have nightmares
    from explicit typing variable declarations. Always having to explicitly type the
    left side of an assignment, although the right side obviously statesucheseems
    unnecessary.


    Gladly, the TypeScript team took care of that by allowing the compiler to infer
    types wherever necessary. You almost never have to explicitly declare the type
    of a variable if you don''t want to. The compiler infers the type from the right
    side of an assignment and narrows it down as far as possible. Only if you think
    that it narrows the type down too far, you can explicitly declare a less narrow
    type to help the compiler out.


    Type inference does, however, not work for function parameters. You still need
    to type them explicitly (understandably). Function return types can also be inferred
    but you should better always explicitly type your functions. If you accidentally
    change a function''s return value from string to number, you''ll see the error
    in the function, and not somewhere else where a string was expected.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# # Narrowing


    ![](img/522b962b8325a030575a3d72d330a848_92_0.png)


    Narrowing is a concept in TypeScript that allows the compiler to get more specific
    with a type that it is unsure about otherwise. Unions are such a case where the
    TypeScript compiler is unsure and cannot reliably predict what type it actually
    deals with. You, as a developer, can help the compiler to create some safety around
    such types. With typeof checks, for example, you can give the compiler the absolute
    security that if that check yields true, you deal with that exact type. Within
    any code path that follows the true case of such a check, you can treat that variable
    as the type you checked for. And the compiler is even intelligent enough to know
    that an else case for a union with two possible types can only yield the type
    not checked for previously.'
  merge: -1
