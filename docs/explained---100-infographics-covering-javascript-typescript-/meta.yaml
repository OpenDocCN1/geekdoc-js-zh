  md: '# The Destructuring Assignment


    ![](img/522b962b8325a030575a3d72d330a848_5_0.png)


    ES6, released in 2015, added many new and important features for the first time
    in JavaScript''s history. Next to let, const and arrow functions, ES6 also added
    the destructuring assignment.

    Whenever you need to extract one or multiple properties from an object, you can
    save yourself the hassle of accessing the property in dot notation from now on.
    Use let or const, surround the properties you want to extract with curly braces,
    and put commas between them, and you get a more readable statement that does multiple
    things in only one line. A neat little side effect is that you only have one place
    to change the object''s path to extract from instead of multiple.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# Destructuring From A Possibly Undefined Property


    ![](img/522b962b8325a030575a3d72d330a848_6_0.png)


    Destructuring itself is pretty awesome, but it has its limits. You can quickly
    run into TypeErrors at runtime when you try to destructure from an object that
    is null or undefined. Optional chaining (appending ? to a property) does not work
    on the very last property of a call chain.


    The nullish coalescing operator provides a fallback if a value is null or undefined.
    Providing an empty object as a fallback if the last property of the chain is not
    present makes your statement valid at runtime and prevents TypeErrors. All extracted
    properties will be undefined, but that''s something you can handle. It''s sometimes
    better to do additional checks for null/undefined than to enclose a destructuring
    statement with a try-catch block.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# # Destructure An Object Into Existing Variables


    ![](img/522b962b8325a030575a3d72d330a848_7_0.png)


    While object destructuring is pretty straightforward, destructuring into already
    existing variables isn''t. If you don''t, like usually, place a let or const in
    front of the curly braces, you''ll get an unpleasant SyntaxError.

    This is because the runtime treats the curly brace as a block, and it finds one
    or more identifiers within that block, separated by a comma. This is nothing the
    JavaScript syntax usually offers within a code block, and because of this, a SyntaxError
    is thrown.

    However, if you enclose the whole statement with parentheses, the syntax becomes
    correct again, and your statement works.

    And if you now ask yourself where you would possibly ever need this, especially
    module-level variables that are lazily initialized can be initialized like this.


    9'
