- md: ' ## Sieve Of Eratosthenes


    The sieve of Eratosthenes is a mathematical algorithm that finds and precalculates
    prime numbers. It does more rely on logical facts than on complex-looking formulas.


    Eratosthenes, back in the days, found out that you don''t need to do many calculations
    to find prime numbers. Overall, we know that numbers 0 and 1 are no prime numbers,
    and we can "mark" those numbers. The next unmarked number is the number 2; it
    is a prime number. But all its multiples can''t be one anymore, so we can already
    rule them out. The number 3 is also a prime number because it simply wasn''t marked
    yet. And once again, we can mark all its multiples as not being prime. And now
    the algorithm just goes on and on until it hits a specified max. In the end, you
    get a list of prime numbers that you can continue to work with.


    ## The Primality Test


    While the Sieve of Eratosthenes is a good way to precalculate and find prime numbers
    between 0 and a given maximum, it is not a good choice when you want to find out
    whether one specific number is a prime number.


    This is a use case for the primality test. It is another pretty basic algorithm
    that uses calculations to determine whether a number is a prime number. But let''s
    do a quick recap of what a prime number is:


    A prime number is any positive number that is only divisible by the number 1 and
    itself; 0 and 1 are no prime numbers.


    As soon as you memorize this definition, a potential algorithm becomes straightforward
    to implement. For every number, test whether it is divisible by something else
    than itself and number 1. To optimize the algorithm a little, you can already
    rule out all even numbers (divisible by 2). Additionally, you only need to test
    divisors up to the square root of the number you test. It is proven that if there
    is no divisor up to the square root of a number, there is no other divisor at
    all.


    ## Power Set


    You probably won''t need to calculate the power set of a set pretty often, but
    all algorithmic training is good training, so here is another algorithm for your
    training.


    The power set of a set is another set that contains all possible subsets of a
    set, including the empty set. And it sees a lot of applications in probability
    theory. It is there used to find all potential outcomes of an operation or action.


    There are many ways to implement the power set as an algorithm but one that is
    definitely pretty concise and to-the-point is the use of reduce. Overall, the
    algorithm looks more difficult than it actually is. In the end, it begins with
    a two-dimensional array. For each step of its iteration, it goes through all subsets
    it already found, and appends the current element to it. If you take a piece of
    paper and just try it out with a simple set like {0, 1, 2}, you will soon realize
    how clever this implementation is because doing so automatically leads to all
    possible subsets of a set.


    ## Basic Fast Deep Clone


    Cloning is an essential operation. Especially when working with immutable data.
    When you don''t modify existing data, you need to copy an object before you return
    it in a modified state. But a real deep clone can be very complex to implement.
    It needs recursion, complex object detection, and more.


    For very basic objects, however, which are those that do not contain more than
    primitive types and other nested objects, JSON.stringify() and JSON.parse() are
    valid alternatives. Serializing and deserializing an object does implicitly create
    a deep clone, and this is enough to create your own version of a deep clone.


    As already mentioned, this method starts to lack as soon as you have more complex
    types in your objects, like Date or custom classes. Without a reviver, JSON.parse()
    will only rehydrate basic objects and not instances of your custom class.


    ## Calculating The Square Root With Newton''s Method


    Will you ever need to implement a function to calculate the root or square root
    of a number? As long as you don''t get the chance to work on a language''s standard
    library, probably not. But, knowing how things work is always a good thing.


    In case of roots, and more specifically square roots, Sir Isaac Newton found a
    fitting algorithm for this problem a long time ago. It is the method your calculator
    uses, and also the one computers have implemented in some way or another.


    The interesting thing with this algorithm is that it is only an approximation
    of the real result because square numbers often tend to be infinite in their decimal
    places. It is also a pretty repetitive method but gladly repetition is what computers
    are really good at.


    ## Fast Power


    Will there ever be any circumstance that you have to implement your own power
    function? Probably not, but knowing how the creators of the standard library of
    a programming language do it probably also doesn''t hurt. Gladly, an optimized
    power algorithm is additionally an incredible showcase for optimization techniques.
    But let''s quickly look at the definition of x to the power of y again. It is
    nothing else than multiplying x by x y times. That''s a loop multiplying x by
    itself in a loop that counts y times; an algorithm with a time-complexity of O(n).
    Not too bad, but also nothing special. Clever mathematicians, however, have found
    out that there is a way to calculate the power of a number more efficiently by
    splitting the calculation up (you see the formula above). When you implement it
    this way, and use recursion, you end up with less iterations and logarithmic runtime.
    That''s the same implementation your favorite language''s standard library probably
    also uses.


    ## The Tower Of Hanoi


    The Tower of Hanoi is a relatively simple game. You have a number of plates with
    different sizes (from smaller to larger) placed on a rod. Your job, as the player,
    is to move the whole tower to the last rod. There are a few rules however. First,
    only smaller plates are allowed to be placed on top of larger plates. Second,
    the tower must be assembled in the correct order.


    Implementing an algorithm for this game is a great example of implementations
    that use no calculations, and no other techniques, other than remodelling reality.
    There is only one way to play this game, a well-defined sequence of game moves
    that lead up to a reassembled tower on the third rod. There are no nuances, and
    this is exactly what this algorithm does. It implements the sequence of moves
    necessary to move the tower. The only thing that makes it look a little more difficult
    is the use of recursion because there is no need to hardcode all movements when
    they are repetitive nevertheless.


    ## The Euclidean Algorithm


    Another mathematical algorithm that uses some interesting facts is the Euclidean
    algorithm. It is named after the Greek mathematician who found out that the greatest
    common divisor of two numbers doesn''t change when you replace the larger number
    with its difference with the smaller number. If you do this repeatedly, you end
    up with the greatest common divisor of both numbers. An even more optimized version
    of this algorithm uses the fact that next to the difference between the larger
    and smaller number, the remainder of a division of both leads to a result even
    faster. Putting this into an algorithm is a great application for recursion, as
    it makes the implementation very readable. And that implementation does only need
    to do two things:


    - Check whether the smaller number reached zero (you then found the result in
    the larger number)

    - Switch the position of the smaller and larger number by doing a division with
    remainder and calling the function itself again.'
  mdcn: "\n ## 埃拉托斯特尼筛法\n\n埃拉托斯特尼筛法是一种用于查找和预先计算质数的数学算法。它更多地依赖于逻辑事实，而非复杂的公式。\n\n早在古代，埃拉托斯特尼就发现，要找到质数并不需要做大量计算。总的来说，我们知道0和1不是质数，可以\"\
    标记\"这两个数。接下来未被标记的数是2，它是一个质数。但2的所有倍数都不可能是质数，所以我们可以直接排除它们。3也是一个质数，因为它尚未被标记。同样地，我们可以将3的所有倍数标记为非质数。然后算法就这样不断进行，直到达到指定的上限。最终，你会得到一个质数列表，可以继续使用。\n\
    \n## 素性测试\n\n虽然埃拉托斯特尼筛法是在0和给定上限之间预先计算和查找质数的好方法，但当你想判断某个特定数字是否为质数时，它并不是一个好的选择。\n\
    \n这正是素性测试的用武之地。这是另一种非常基础的算法，通过计算来判断一个数是否为质数。但我们先快速回顾一下什么是质数：\n\n质数是指只能被1和它本身整除的正整数；0和1不是质数。\n\
    \n一旦记住这个定义，潜在的算法就变得很容易实现。对于每个数，测试它是否能被除自身和1以外的数整除。为了稍微优化算法，你可以先排除所有偶数（能被2整除的数）。此外，你只需要测试到该数平方根为止的除数。现已证明，如果在某个数的平方根以内没有除数，那么该数就没有其他除数。\n\
    \n## 幂集\n\n你可能不太需要经常计算一个集合的幂集，但所有的算法训练都是好训练，所以这里再介绍一个算法供你练习。\n\n一个集合的幂集是另一个集合，它包含原集合的所有可能子集，包括空集。它在概率论中有大量应用，用于查找一个操作或行为的所有潜在结果。\n\
    \n实现幂集算法的方法有很多，但 Definitely 简洁明了的一种是使用 `reduce`。总的来说，这个算法看起来比实际更难。归根结底，它从一个二维数组开始。在每次迭代步骤中，它遍历所有已找到的子集，并将当前元素附加到这些子集上。如果你拿张纸，用简单的集合如\
    \ {0, 1, 2} 来尝试一下，你很快就会意识到这个实现有多巧妙，因为这样做会自动生成一个集合的所有可能子集。\n\n## 基础快速深克隆\n\n克隆是一项基本操作。特别是在处理不可变数据时。当你不修改现有数据时，需要在返回修改后的状态之前复制一个对象。但真正的深克隆可能非常复杂。它需要递归、复杂的对象检测等等。\n\
    \n然而，对于非常基础的对象——即那些只包含基本类型和其他嵌套对象的对象——`JSON.stringify()` 和 `JSON.parse()` 是有效的替代方案。序列化和反序列化一个对象隐式地创建了一个深克隆，这足以创建你自己版本的深克隆。\n\
    \n如前所述，一旦你的对象中包含更复杂的类型，如 `Date` 或自定义类，这种方法就开始不够用了。如果没有复原函数（reviver），`JSON.parse()`\
    \ 只会重新水合基本对象，而不会恢复你的自定义类的实例。\n\n## 用牛顿法计算平方根\n\n你会需要实现一个计算根或平方根的函数吗？除非你有机会参与语言标准库的开发，否则大概不会。但了解事物的运作原理总是好的。\n\
    \n就根而言，更具体地说是平方根，艾萨克·牛顿爵士很久以前就发现了适合这个问题的算法。这是你的计算器使用的方法，也是计算机以某种方式实现的方法。\n\n这个算法的有趣之处在于，它只是真实结果的近似值，因为平方数的小数位数往往是无限的。这也是一种相当重复的方法，但好在重复正是计算机非常擅长的。\n\
    \n## 快速幂\n\n有什么情况会让你必须实现自己的幂函数吗？大概没有，但了解编程语言标准库的创建者是如何实现的，大概也没有坏处。此外，一个优化的幂算法还是优化技术的绝佳展示。但我们快速回顾一下\
    \ x 的 y 次方的定义。它无非就是 y 个 x 相乘。那就是在循环中将 x 与自身相乘，循环计数 y 次；一个时间复杂度为 O(n) 的算法。不算太糟，但也并不特别。然而，聪明的数学家们发现，可以通过分割计算来更高效地计算幂（你上面的公式）。当你以这种方式实现，并使用递归时，你会得到更少的迭代次数和对数级的时间复杂度。这大概也是你最喜欢的语言的标准库所使用的实现。\n\
    \n## 汉诺塔\n\n汉诺塔是一个相对简单的游戏。你有一组不同大小（从小到大）的盘子放在一根杆上。作为玩家，你的任务是将整个塔移到最后一根杆上。然而有几条规则。首先，只允许将较小的盘子放在较大的盘子上面。其次，塔必须按正确的顺序组装。\n\
    \n为这个实现游戏算法是绝佳的例子，它不使用计算，也不使用其他技术，而只是对现实进行建模。玩这个游戏只有一种方式，一系列明确定义的移动步骤，最终将塔重新组装到第三根杆上。没有任何细微差别，这正是这个算法所做的。它实现了移动塔所需的步骤序列。唯一让它看起来稍微复杂一点的是递归的使用，因为当移动是重复的时候，没有必要硬编码所有移动。\n\
    \n## 欧几里得算法\n\n另一个利用一些有趣事实的数学算法是欧几里得算法。它以希腊数学家的名字命名，他发现两个数的最大公约数在将较大数替换为它与较小数的差时不会改变。如果你反复这样做，最终会得到两个数的最大公约数。这个算法的一个更优化版本利用了这样一个事实：除了较大数与较小数的差之外，两者相除的余数能更快地得到结果。将其转化为算法是递归的绝佳应用，因为它使实现非常易读。而这个实现只需要做两件事：\n\
    \n- 检查较小数是否已达到零（此时你已在较大数中找到了结果）\n- 通过带余数除法交换较小数和较大数的位置，然后再次调用函数本身。\n"
