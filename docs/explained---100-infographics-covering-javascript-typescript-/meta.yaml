- md: ' # Checking For A Palindrome


    A palindrome is a word, number, phrase, or another sequence of characters that
    reads the same backward as forward. Two examples are: "madam" or "racecar."


    Implementing an algorithm for it is an excellent practice problem for beginners.
    The solution doesn''t need any advanced techniques, and a simple solution only
    requires a loop.


    A mistake many beginners make is to ignore that special characters like punctuation
    marks do not influence a palindrome. This means that even "racecar" is a valid
    palindrome.


    The implementation above uses a regular expression to rule out special characters
    like whitespace and punctuation marks. After that, the string is compared from
    both sides.


    Let''s take "racecar," for example. The first step of the loop compares indices
    0 and 6, then 1 and 5, and then 2 and 4. This means: "r" === "r", "a" === "a",
    "c" === "c". The algorithm does not need to compare the same character with itself.


    As you see, all comparisons of the characters are successful, and thus the algorithm
    verifies that "racecar" is indeed a palindrome.


    ## A Lazy Range Function


    Ranges are a functional pattern that is often used in purely functional languages.
    When you have no variables to declare, you still need a way to iterate for a specific
    amount of times. Ranges fill this gap by providing a way to create a sequence
    of numbers that can be iterated over. A lazy range now takes this one step further
    and only emits numbers when one is needed. This means that at any point in time,
    only one number is in memory, while old numbers can be thrown away as soon as
    they are consumed.


    In JavaScript, a simple for loop with a loop variable does basically the same,
    only that it increments its loop variable each time. Sometimes, however, you want
    to eliminate imperative constructs like for-loops with a large header, and rely
    on functional concepts as much as possible. In this case, a range function is
    a valid alternative, and when the "Iterator Helpers" proposal finally enters stage
    3, you will also be able to use map, flatMap, filter, etc. on iterators, as well,
    which would also include this lazy range.


    ## A Python-Like Range Function


    You probably know how you can create a lazy range function with a generator by
    now, but currently, we still don''t have our beloved functional monad methods
    map, flatMap, filter, etc. available for iterables. This means that you still
    have to work with an imperative for-of loop.


    Sometimes, you want to get rid of all imperative constructs, though, and that
    is fine. In this particular case, you can eagerly create an array with Array.from
    and pre fill that with all numbers you want in your range. This array can then
    be used like any other array. You can map the values, you can flatMap them, you
    can filter as much as you want.


    Just keep in mind that this approach uses a lot of memory. Arrays live on the
    heap, and thus all elements stay in memory for as long as the array exists. Especially
    huge sequences could potentially lead to problems.


    ## How To Reverse A String


    Reversing a string is not the most advanced algorithm you will ever implement
    in your career, but it''s at least a task that even JavaScript''s string has no
    built-in method for.


    For this algorithm, you can make use of three specific traits of strings and arrays
    in JavaScript:


    - strings can be converted to an array of characters

    - arrays can be reversed

    - arrays can be converted to a string


    The only thing besides that is a guard statement that checks whether the string
    is present or too short and returns in that case.


    After that, everything else is chaining built-in methods.


    That''s it already. You have now successfully reversed a string.


    ## Reverse An Integer


    There are multiple ways to reverse an integer. One way is to simply convert your
    integer to a string, reverse that string, and then create a number again. That
    itself is aSPARENT

    ！😩some companies like to test your algorithm and math skills when interviewing,
    and this is where using the string approach won''t be enough anymore. The same
    is also true for when you need to do the reversal a few thousand to a few million
    times.


    The algorithm you see above uses math to solve the task. What''s happening is
    nothing else than the mathematical way of extracting digits one by one and "putting"
    them into a new number.


    As you see, you only need to loop once, and even save many string allocations.


    ## Fisher-Yates Shuffle


    The Fisher-Yates Shuffle is a fair shuffling algorithm. The algorithm itself does
    not look that complex at all, but its outcome is incredible. But let''s go into
    some theory quickly before we continue. A permutation of an array is just a different
    representation of that array with the same content. [1, 2] and [2, 1] are different
    permutations of each other, for example. The content remains the same, but the
    order changes. That is exactly what a shuffle does. It creates another permutation
    of an array.


    The Fisher-Yates Shuffle takes this to the next level by producing permutations
    where each possible permutation is equally likely to happen. This is what makes
    it so fair. There is no bias at all.


    ## Counting Occurrences Of Elements Within An Array


    A task you see over and over again when visiting sites for competitive programming
    is counting the occurrences of elements within an array.


    This task is something reduce() and a map object are a perfect fit for. You reduce
    the initial array into a single object, and the object acts as your map.


    In the end, the algorithm revolves around adding the elements of the array as
    a key to your map, and then incrementing a counter each time you encounter an
    element. That''s everything. But it''s another good algorithm for beginners. It
    might take some time until you get it, but after that you learned a valuable lesson.
    And that lesson is one you can apply to the next algorithm you write. And so on,
    and so on.


    ## The Hamming Distance


    The Hamming Distance might have a fancy name, but in the end it does nothing else
    than to count the number of characters two strings of equal length differ in.


    It''s a pretty simple algorithm that is good for beginners. As both strings have
    to be of equal length, it is enough to loop over one string and then compare characters
    at the same index.


    If you now think that this algorithm is nothing you would ever need, you are wrong.
    The hamming distance is, for example, often used in network protocols. It is there
    used as an indicator of the quality of the transfer. In more advanced scenarios,
    the algorithm is used to identify faulty transferred bytes that should be corrected.


    ## Linear Search


    A linear search is the most simple search algorithm you can implement. It works
    for all linear data structures and doesn''t contain any advanced logic. As the
    name already implies, it looks through a list (an array in this case) linearly,
    from start to end. And that''s all the magic behind it. You loop over the array
    and test each element. The index of the first element that satisfies the test
    is returned as the result. A linear search works in most circumstances. It works
    when your array is not sorted, and even when it has holes in it (undefined elements).
    That differentiates it from other search algorithms that have specific prerequisites.
    This makes it one of the slowest search algorithms because you can''t optimize
    it but at least it is the broadest applicable of all.'
