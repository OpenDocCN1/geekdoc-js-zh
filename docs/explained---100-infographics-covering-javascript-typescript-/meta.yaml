  md: '# # How To Create A Cancelable Promise Delay


    ![](img/522b962b8325a030575a3d72d330a848_25_0.png)


    Asynchronous operations usually follow the same pattern: You start them, you wait
    for them to finish, and in the meantime, you can do something else. This is how
    a Promise works. The execution of a particular piece of code is halted until the
    Promise resolves. In the meantime, the event loop can continue to work and execute
    other code that doesn''t need to wait for anything at that moment. When the Promise
    settles, the event loop picks it up again and runs it as soon as possible, no
    matter whether the Promise failed or rejected. Sometimes, however, you want to
    wait for a little before sending off the action. In this case, you can use setTimeout()
    and combine it with a Promise. After the specified timeout, setTimeout() successfully
    settles the Promise, and based on this, you can chain any operation you like with
    its then() method. If you don''t need the Promise to settle anymore, you can easily
    abort it through the cancel() method. If the timeout is canceled, the Promise
    rejects, which you can handle either with a try-catch block or a catch().'
