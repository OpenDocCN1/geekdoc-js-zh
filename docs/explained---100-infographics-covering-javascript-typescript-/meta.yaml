  - '[PAGE 102]


    # ENS Lookup With ethers


    ![](img/522b962b8325a030575a3d72d330a848_102_0.png)


    ENS (The Ethereum Name Service) is the DNS of the Ethereum world. Anyone can buy
    an NFT with a specific address attached to it. And this address can from then
    on act as a replacement to your address (the public key representation beginning
    with 0x).


    ethers comes with support for ENS resolving, which means that you can resolve
    any ENS address to a blockchain address and versa. Additionally, this logic also
    allows ethers to let you send transactions to ENS addresses without having to
    look up the address prior to that.'
  - '[PAGE 103]


    # Estimating The Gas Cost Of Smart Contract Calls With ethers


    ![](img/522b962b8325a030575a3d72d330a848_103_0.png)


    If you have ever worked with a blockchain as a user, you might already know gas
    costs. Gas is what miners/validators are paid for their service, which is basically
    executing smart contract logic and processing transactions. While the gas consumption
    of a call is deterministic (means: if you look at the code executed, you know
    how much gas it takes), the gas price is always moving. The more people interact
    with the blockchain, the more expensive gas becomes. The fewer people do so, the
    cheaper gas becomes. There is a market behind gas. ethers has utility methods
    that allow you to make a rough estimation of how much a call would cost you at
    the moment. This can come in helpful if you have logic running automatically in
    the back regularly. In this case, it can make sense to wait for the gas price
    to hit a certain low before the call is executed. This can lead to savings ranging
    from a few cents to thousands of dollars a year.


    105'
  - '[PAGE 104]


    # Waiting For Transactions To Finish With ethers


    ![](img/522b962b8325a030575a3d72d330a848_104_0.png)


    As you might have already learned, sending off a transaction only returns an object
    presenting a pending transaction. Depending on the blockchain, transactions can
    take a longer time to settle. This time can range from a few seconds to minutes.

    dApps usually try to not wait for transactions to settle and instead show an intermediate
    state until a transaction finally goes through.

    But sometimes, you might really want to wait until a transaction is settled before
    you let users continue with whatever they do.

    In this case, the pending transaction object offers a wait() method, that returns
    a Promise that only resolves when the transaction is appended to the next block.

    This is a potentially very long-running operation. You should only use it if really
    necessary.'
  - '[PAGE 105]


    # Reacting To Network Changes With ethers


    ![](img/522b962b8325a030575a3d72d330a848_105_0.png)


    Any user can change the network their web wallet is connected to at any time.
    This often leads to interesting problems with dApps. You might still be listening
    for events or wait for a transaction to return. In such cases, it''s best to react
    to the network change and at least reload the whole app, so all stale state is
    reset. Often, you might also want to display to the user that they are connected
    to the wrong network because your dApp only works on Ethereum or Polygon, for
    example.

    When this happens, you can use the ''network'' hook ethers provides. Within the
    callback, you can perform any actions necessary, like reloading your site or setting
    some state so you can display a message to the user.

    The hook is also called when connecting to the app the first time. This is why
    you should always include a guard statement that checks whether the second parameter
    of the callback (oldNetwork in this case) is set. If not, it''s a first-time connection,
    and you don''t need to do anything.'
  - '[PAGE 106]


    # Connecting To A Node Without MetaMask With ethers


    ![](img/522b962b8325a030575a3d72d330a848_106_0.png)


    ethers is not only a library for frontend applications. You can use it in the
    backend, as well. When you use it this way, however, there is no MetaMask or other
    wallet that handles the connection to a hosted blockchain node for you.

    In this case, you need to connect to a node yourself, and this is why ethers also
