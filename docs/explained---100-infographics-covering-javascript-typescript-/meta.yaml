  md: '# # The Fallback Function


    ![](img/522b962b8325a030575a3d72d330a848_119_0.png)


    The fallback() function is a special function. Every contract can have exactly
    one.


    As you might know by now, clients can basically call anything on a smart contract.
    In the end, a client only uses the HTTP JSON RPC API of an Ethereum node. This
    means that nothing is type-safe. And this, in return, means that a client could
    basically just call a function that is non-existent. Interestingly, this does
    affect not only clients but also other smart contracts.


    But what happens if someone calls a function that doesn''t exist? Well, if that
    contract has a fallback() function, the call is delegated to exactly this function.
    This allows you to catch those otherwise wrong calls and still make something
    of the calldata.


    A common use case for fallback functions is that of a Proxy contract. Such a proxy
    catches all calls through its fallback() function and delegates the calls to another
    contract it wraps. This allows you to upgrade smart contracts at runtime; something
    that is otherwise impossible.'
  merge: -1
