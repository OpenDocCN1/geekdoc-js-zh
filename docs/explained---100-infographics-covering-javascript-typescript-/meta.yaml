    utility functions that are applicable to it. This way, you can finally add that
    concat() function to string or attach unit conversion methods to any uint.


    If you now ask yourself what "applicable" means: When a library function takes
    a uint as its first argument, it is applicable to all uints. The same is true
    for all other types—strings to strings, bytes to bytes, etc.'
  - '[PAGE 119]


    # # The Fallback Function


    ![](img/522b962b8325a030575a3d72d330a848_119_0.png)


    The fallback() function is a special function. Every contract can have exactly
    one.


    As you might know by now, clients can basically call anything on a smart contract.
    In the end, a client only uses the HTTP JSON RPC API of an Ethereum node. This
    means that nothing is type-safe. And this, in return, means that a client could
    basically just call a function that is non-existent. Interestingly, this does
    affect not only clients but also other smart contracts.


    But what happens if someone calls a function that doesn''t exist? Well, if that
    contract has a fallback() function, the call is delegated to exactly this function.
    This allows you to catch those otherwise wrong calls and still make something
    of the calldata.


    A common use case for fallback functions is that of a Proxy contract. Such a proxy
    catches all calls through its fallback() function and delegates the calls to another
    contract it wraps. This allows you to upgrade smart contracts at runtime; something
    that is otherwise impossible.'
  - '[PAGE 120]


    # The Receive Function


    ![](img/522b962b8325a030575a3d72d330a848_120_0.png)


    The receive() function is another special function. Any smart contract that has
    a receive() function can receive Ether. If a contract has no receive() function,
    it cannot receive Ether. Interestingly, only the function needs to be present.
    It doesn''t need any special logic. The pure presence of the function allows the
    contract to receive Ether through transfer() or send(), for example. The Ether
    balance of the contract itself can be accessed by using address(this).balance;


    It is perfectly fine to leave the receive() function empty. That''s usually even
    a good idea because send() and transfer() don''t have a lot of gas to work with.
    If receive() does too much, the call runs out of gas and aborts.'
  - '[PAGE 121]


    # ## Require


    ![](img/522b962b8325a030575a3d72d330a848_121_0.png)


    The utility function require() is actually one of the most important functions
    in Solidity. It''s the native way of Solidity to implement guard statements.


    You don''t need to implement checks yourself and then revert your contract manually
    if that check fails. require() does all that for you, in the most gas-efficient
    way possible.


    The function takes a boolean as its first parameter. This parameter can also be
    any boolean expression. If that boolean or expression yields false, require()
    automatically raises an error.


    The second, optional, parameter is a string. This is the message that is assigned
    to the error when it is raised. That is a way for a developer to give the caller
    of their function a hint at what exactly failed.


    You usually see relatively short strings as error messages and it has a good reason.
    While require() itself is gas-efficient, a string takes up a lot of space in the
    byte code of your deployed contract, and this can massively pump the deployment
    cost of your contract.'
  - '[PAGE 122]


    # # Assert


    ![](img/522b962b8325a030575a3d72d330a848_122_0.png)


    While require() is your go-to function for guard statements, assert() is a last
    resort statement. When an assert() call fails, something has gone so horribly
    wrong that you can''t rescue anything.

    A general rule of thumb is to use assert() to test for invariants or internal
    problems. You sometimes even place those statements at obvious places, like checking
    whether subtracting from a user''s balance really leads to the correct result.

    assert() also has another great utility that you can use to your advantage: tools
    can analyze your code for you and show whether an assert() would throw, even before
    deploying your contract.

    When assert() throws, all remaining gas is consumed. This is another difference
    between assert() and require() because require() refunds the remaining gas when
    it fails.'
  - '[PAGE 123]


    # Persistent Data Storage


    ![](img/522b962b8325a030575a3d72d330a848_123_0.png)


    One concept that many aspiring smart contract developers need to get used to is
    the fact that all contract properties (those that model its state) are persistent.

    You don''t need a database when developing smart contracts. No reading, no updating,
    no creating, no deleting. Whenever you modify a property of your smart contract,
    you need a transaction. And after that transaction is through, your contract''s
    state is persisted, and the change is visible to everyone else.

    That''s the incredible thing about smart contracts. Developing them is easier
    in some aspects, but it''s not as easy as you might think. You should not persist
    everything on the blockchain now. A blog post, for example, takes up a lot of
    space, and the size of the data a block can contain is limited.

    As a smart contract developer, you have alternatives to storing data on the blockchain.
    Decentralized databases, for example, are good alternatives because they were
    made for exactly that data that you cannot easily persist on-chain.'
  - '[PAGE 124]


    # # Interfaces


    ![](img/522b962b8325a030575a3d72d330a848_124_0.png)


    Interfaces are a way to define a common set of logic for smart contracts, and
    they work like in most other languages.


    An interface defines the functions a smart contract implementing it must provide.
    A smart contract implementing an interface must implement all functions the interface
    defines. Next to that, an interface can also provide structs and events that any
    implementing contract can use.


    On the user side, another smart contract only needs to know the interface to work
    with any implementation.


    You will usually use interfaces especially in scenarios where you want to implement
    standards. ERC20, ERC777, ERC721, ERC1155, etc., can all well be described and
    defined by interfaces, for example.'
  - '[PAGE 125]


    # # Abstract Contracts


    ![](img/522b962b8325a030575a3d72d330a848_125_0.png)


    While interfaces only allow to define functions, structs, and events, abstract
    contracts can also contain logic. To be precise, an abstract contract can decide
    to implement functions or only leave them as declarations.


    An abstract contract itself cannot be instantiated, but other smart contracts
    can derive from it and inherit all the base logic accessible to them by the respective
    visibility modifiers.


    Let''s take an Ownable, for example. That is usually an abstract contract that
    implements all logic necessary for basic contract access control. Although an
    Ownable usually has no unimplemented functions, it is still abstract because it
    doesn''t make sense to instantiate an Ownable itself. Other contracts derive from
    it to gain all its functionalities.'
  - '[PAGE 126]


    # Immutable State Variables


    ![](img/522b962b8325a030575a3d72d330a848_126_0.png)


    Contract state variables can be marked as immutable. In this case, you can set
    them exactly once, either on declaration or in the constructor of the contract.


    An immutable state variable cannot be changed after it has been set once. Additionally,
    it costs less gas to access such a variable because when an instance of your contract
    is created, all occurrences of that immutable variable are replaced with their
    respective value.


    It makes a lot of sense to set contract variables to immutable when you are absolutely
    sure that you''ll never need to change a variable after it has been set once.
    This way, you can save a lot of gas, especially when your contracts are created
    and called pretty often.'
- md: '## Constant State Variables


    A constant state variable is like an immutable one, but you can only set its value
    on declaration. These types of variables are exactly what their name suggests,
    constants. Pi is such an example. It''s a constant of mathematics and never changes.


    Constants are a good way to circumvent so-called magic numbers or strings without
    context. Why not call it Pi before you throw around 3.14 everywhere?


    All occurrences of a constant state variable are replaced with their respective
    value at compile-time. This means that the constant state variable doesn''t even
    exist when the contract gets deployed. It''s a sole utility for developers to
    increase readability and reasoning about values.


    ## Tuples


    Tuples are actually a construct originating in mathematics. A tuple is a finite
    ordered list of elements, but that probably sounds more complex than it actually
    is.


    View it like this: An array can contain a list of elements of the same type. Conceptually,
    an array models a list, and the order of the elements isn''t important in a list.


    A tuple, however, can contain elements of different types, and their order is
    important.


    In Solidity, tuples are a built-in type. You can declare and initialize them,
    and you can also return tuples from functions. Whenever a function should return
    more than one value (yep, that''s possible like in Python), it returns a tuple.
    And tuples can even be deconstructed into individual values.


    This gives a lot of flexibility to Solidity developers and smart contracts. And
    sometimes, returning a tuple is more gas-efficient than calling two different
    functions.


    Additionally, tuples are an anonymous alternative to a struct.


    ## Named Return Variables


    Named return variables are a neat feature in Solidity. They allow developers to
    already declare the variable''s name that makes up the return value in the head
    of the function.


    A named return variable automatically gets declared and is immediately available
    in the function body. Additionally, named return variables are automatically returned
    from the function, and it doesn''t even matter whether the assignment to the return
    variable was the last assignment or the first one.


    ## That''s It


    You''ve made it to the end of this book, yay! I hope you enjoyed going through
