  - '[PAGE 109]


    # # Function Types


    ![](img/522b962b8325a030575a3d72d330a848_109_0.png)


    Solidity knows different function types that all serve their own purpose. Like
    visibilities, those types can also affect the gas consumption of functions.


    Overall, as explained above, there are three types of functions, and they are
    a great way for a developer to state their intent and get some basic checks by
    the compiler that can help identify errors. A pure function, for example, can
    never access the state of a contract. If you now, even by accident, happen to
    change some state, the compiler will notify you of that and help you to identify
    a bug before it hits production.


    Next to that, marking functions as view or pure also has a neat side effect: It
    doesn''t cost gas to call those functions. Although that only affects the call
    itself. If you do extensive computations within one of those functions, you''ll
    still have to pay a fee for that.'
  - '[PAGE 110]


    # # Function Modifiers


    ![](img/522b962b8325a030575a3d72d330a848_110_0.png)


    Function modifiers are a great feature of Solidity. If you ever worked with decorators
    in Python and TypeScript, or even with annotations in Java, you probably already
    know what a function modifier basically is.

    A function modifier, well, modifies a function. It is a special function itself
    that cannot be called directly. Instead, it is added to another function explicitly
    and then wraps that function. Whenever such a modified function is called, the
    modifier function is called first, and only then, according to its implementation,
    the actual modified function.

    Two of the most common use cases for modifier functions are guard statements and
    reentrant lock.

    A guard statement is a check, usually at the top of a function, verifying the
    input itself or against some contract state. Only if that check succeeds the function
    can run. If it fails, the guard statement throws, and the function execution stops.

    A reentrant lock is a way to ensure that a function can only be called once at
    a time.'
  - '[PAGE 111]


    # # Events


    ![](img/522b962b8325a030575a3d72d330a848_111_0.png)


    Events are the log messages of Solidity and Ethereum. Any contract can define
    one or multiple events and then emit them at any time. They are like objects without
    functions. They can only contain data, and some of that data can be marked as
    indexed. An indexed property is something that you can filter and search events
    for. Other smart contracts can’t subscribe to those events. They are solely aimed
    at client libraries.


    Events help to make sense of what happens on the blockchain because transactions
    can sometimes be very difficult to read. They state which contract and function
    were called, but you often don’t find out easily what exactly happened. This is
    where events come in. They explicitly state, through their own type, and their
    data, what the action was that led to this particular event.'
  - '[PAGE 112]


    # # Raising Errors


    ![](img/522b962b8325a030575a3d72d330a848_112_0.png)


    Like many other programming languages, Solidity does, of course, also have a concept
    of errors/exceptions.

    Errors state that an operation like a function call wasn''t successful, and they
    are defined nearly identical to events. Every error has a name, and it can contain
    data.

    Contrary to other languages that usually “throw” errors, Solidity uses the concept
    of reverting. When an error occurs, the contract and all its state are reverted
    back to the state before the function call. No matter how much state a function
    changes before using the “revert” statement with an error, all previous actions
    get reverted.

    Additionally, reverting a contract usually refunds all gas remaining.

    This means that if your function had 10000 gas available and already used up 5000,
    5000 are refunded when the revert statement gets called.'
  - '[PAGE 113]


    # Handling Errors


    ![](img/522b962b8325a030575a3d72d330a848_113_0.png)


    As you might remember, contracts can call other contracts in Solidity. This is
    why the language also has a concept of handling errors. If a call a contract makes
    gets reverted, you need a chance to react to this circumstance.

    Solidity uses the same try-catch mechanic as many other programming languages,
    only with a few minor differences. The try-statement is always followed by the
    call that can potentially throw. Within the try block, you can add more statements
    that are executed if the call is successful.

    The catch-statement is followed by the type of error to catch like in other languages.
    Within the following block, you can place as many statements as you want or need
    to process the error or even additionally revert your own contract.'
  - '[PAGE 114]


    # # Structs


    ![](img/522b962b8325a030575a3d72d330a848_114_0.png)


    Structs are another type of object in Solidity. You can view them as the little
    brothers of contracts. While contracts are the API layer that can contain properties
    and functions, structs are only data containers. Like events and errors, they
    can not contain functions and only properties.


    Their purpose is to help developers group multiple properties in a more meaningful
    way. Additionally, they also help to save gas in some circumstances.


    Structs can be used as parameters and return values, and you can handle them like
    any other variable. Using a struct usually begins to make sense as soon as you
    have a group of at least two properties that you regularly need in multiple places.'
  - '[PAGE 115]


    # # Mappings


    ![](img/522b962b8325a030575a3d72d330a848_115_0.png)


    Mappings are the maps or dictionaries of Solidity. They are actually one of the
    most important data structures for any smart contract. Whenever you need a key-value
    relation, a mapping is the native type to use.


    Mappings form the base of many important standards. ERC20 tokens, for example,
    track your balance in a mapping, and even your favorite NFT tracks your CryptoPunk
    or APE in a mapping.


    Mappings themselves only offer a basic public API. It mostly consists of the square
    bracket access that allows you to read values and set them. That''s actually the
    same way you can use dynamic property access on objects in JavaScript.'
  - '[PAGE 116]


    # # Enums


    ![](img/522b962b8325a030575a3d72d330a848_116_0.png)


    Enums, or longer enumerated values, are a finite set of constant values. While
    a string can take any form you can imagine, enums can only take the values you
    define for them. They are a great way when you only need a specific set of values
    that you can base logic on. Enums can even be used as parameters of public functions.
    In this case, however, the client needs to pass in the numeric value of the enum.
    That''s a small drawback because it is far less usable than passing in the string
    value of the enum. Each enum value is assigned a uint8 value. The order of the
    numbers works like for arrays. The first value has a value of 0, the second one
    a value of 1, and so on. If we apply this to the example above, Active is 0, and
    Locked is 1. When enums are parameters, the runtime automatically adds a guard
    statement checking for invalid inputs. This means that you don''t need a require()
    to check the validity of the value. That has already been executed automatically
    when inside the function''s body.


    118'
  - '[PAGE 117]


    # # Concatenating Strings


    ![](img/522b962b8325a030575a3d72d330a848_117_0.png)


    A thing that is pretty straightforward in other languages can quickly become an
    issue in Solidity. In this case, it''s concatenating strings. There is no built-in
    method attached to strings that makes this possible in any way. There are different
    reaons why this is the case, but actually, the most important one is how the underlying
    Ethereum Virtual Machine handles strings. They are just a sequence of bytes, interpreted
    based on their encoding. That''s notNeighbors much different from how it actually
    is in other languages, but the EVM is special. It is a very limited virtual machine
    that makes some tradeoffs to work as best as possible in a blockchain context.


    There are multiple ways to concatenate strings in Solidity but, actually, there
    is only one way you need to know because it''s the most gas-efficient one. abi.encodePacked()
    takes multiple input parameters, extracts their bytes, and concatenates them.
    The result of the call is one byte array containing the concatenated result. If
    you create a string from that byte array, you have your concatenated string.'
- md: ' ## Libraries


    Libraries are special contracts. They can''t be instantiated themselves but instead
    contain utility functions. If you know static methods in Java or functions attached
    to objects in JavaScript, you already understand the concept.


    Libraries can be imported into any contract and attached to specific types. That''s
    basically the concept of extension methods. You can extend any type from the outside,
    and when you import such a library and attach it to a type, this type gains all
    utility functions that are applicable to it. This way, you can finally add that
    concat() function to string or attach unit conversion methods to any uint.


    If you now ask yourself what "applicable" means: When a library function takes
    a uint as its first argument, it is applicable to all uints. The same is true
    for all other types—strings to strings, bytes to bytes, etc.


    ## The Fallback Function


    The fallback() function is a special function. Every contract can have exactly
    one.


    As you might know by now, clients can basically call anything on a smart contract.
    In the end, a client only uses the HTTP JSON RPC API of an Ethereum node. This
    means that nothing is type-safe. And this, in return, means that a client could
    basically just call a function that is non-existent. Interestingly, this does
    affect not only clients but also other smart contracts.


    But what happens if someone calls a function that doesn''t exist? Well, if that
    contract has a fallback() function, the call is delegated to exactly this function.
    This allows you to catch those otherwise wrong calls and still make something
    of the calldata.


    A common use case for fallback functions is that of a Proxy contract. Such a proxy
    catches all calls through its fallback() function and delegates the calls to another
    contract it wraps. This allows you to upgrade smart contracts at runtime; something
    that is otherwise impossible.


    ## The Receive Function


    The receive() function is another special function. Any smart contract that has
    a receive() function can receive Ether. If a contract has no receive() function,
    it cannot receive Ether. Interestingly, only the function needs to be present.
    It doesn''t need any special logic. The pure presence of the function allows the
    contract to receive Ether through transfer() or send(), for example. The Ether
    balance of the contract itself can be accessed by using address(this).balance;


    It is perfectly fine to leave the receive() function empty. That''s usually even
    a good idea because send() and transfer() don''t have a lot of gas to work with.
    If receive() does too much, the call runs out of gas and aborts.


    ## Require


    The utility function require() is actually one of the most important functions
    in Solidity. It''s the native way of Solidity to implement guard statements.


    You don''t need to implement checks yourself and then revert your contract manually
    if that check fails. require() does all that for you, in the most gas-efficient
    way possible.


    The function takes a boolean as its first parameter. This parameter can also be
    any boolean expression. If that boolean or expression yields false, require()
    automatically raises an error.


    The second, optional, parameter is a string. This is the message that is assigned
    to the error when it is raised. That is a way for a developer to give the caller
    of their function a hint at what exactly failed.


    You usually see relatively short strings as error messages and it has a good reason.
    While require() itself is gas-efficient, a string takes up a lot of space in the
    byte code of your deployed contract, and this can massively pump the deployment
    cost of your contract.


    ## Assert


    While require() is your go-to function for guard statements, assert() is a last
    resort statement. When an assert() call fails, something has gone so horribly
    wrong that you can''t rescue anything.


    A general rule of thumb is to use assert() to test for invariants or internal
    problems. You sometimes even place those statements at obvious places, like checking
    whether subtracting from a user''s balance really leads to the correct result.


    assert() also has another great utility that you can use to your advantage: tools
    can analyze your code for you and show whether an assert() would throw, even before
    deploying your contract.


    When assert() throws, all remaining gas is consumed. This is another difference
    between assert() and require() because require() refunds the remaining gas when
    it fails.


    ## Persistent Data Storage


    One concept that many aspiring smart contract developers need to get used to is
    the fact that all contract properties (those that model its state) are persistent.


    You don''t need a database when developing smart contracts. No reading, no updating,
    no creating, no deleting. Whenever you modify a property of your smart contract,
    you need a transaction. And after that transaction is through, your contract''s
    state is persisted, and the change is visible to everyone else.


    That''s the incredible thing about smart contracts. Developing them is easier
    in some aspects, but it''s not as easy as you might think. You should not persist
    everything on the blockchain now. A blog post, for example, takes up a lot of
    space, and the size of the data a block can contain is limited.


    As a smart contract developer, you have alternatives to storing data on the blockchain.
    Decentralized databases, for example, are good alternatives because they were
    made for exactly that data that you cannot easily persist on-chain.


    ## Interfaces


    Interfaces are a way to define a common set of logic for smart contracts, and
    they work like in most other languages.


    An interface defines the functions a smart contract implementing it must provide.
    A smart contract implementing an interface must implement all functions the interface
    defines. Next to that, an interface can also provide structs and events that any
    implementing contract can use.


    On the user side, another smart contract only needs to know the interface to work
    with any implementation.


    You will usually use interfaces especially in scenarios where you want to implement
    standards. ERC20, ERC777, ERC721, ERC1155, etc., can all well be described and
    defined by interfaces, for example.


    ## Abstract Contracts


    While interfaces only allow to define functions, structs, and events, abstract
    contracts can also contain logic. To be precise, an abstract contract can decide
    to implement functions or only leave them as declarations.


    An abstract contract itself cannot be instantiated, but other smart contracts
    can derive from it and inherit all the base logic accessible to them by the respective
    visibility modifiers.


    Let''s take an Ownable, for example. That is usually an abstract contract that
    implements all logic necessary for basic contract access control. Although an
    Ownable usually has no unimplemented functions, it is still abstract because it
    doesn''t make sense to instantiate an Ownable itself. Other contracts derive from
    it to gain all its functionalities.


    ## Immutable State Variables


    Contract state variables can be marked as immutable. In this case, you can set
    them exactly once, either on declaration or in the constructor of the contract.


    An immutable state variable cannot be changed after it has been set once. Additionally,
    it costs less gas to access such a variable because when an instance of your contract
    is created, all occurrences of that immutable variable are replaced with their
    respective value.


    It makes a lot of sense to set contract variables to immutable when you are absolutely
    sure that you''ll never need to change a variable after it has been set once.
    This way, you can save a lot of gas, especially when your contracts are created
    and called pretty often.'
  mdcn: '

    ## 库


    库是特殊的合约。它们不能被实例化，而是包含实用函数。如果你了解 Java 中的静态方法或 JavaScript 中附加到对象的函数，那么你已经理解了这个概念。


    库可以被导入到任何合约中，并附加到特定类型。这基本上就是扩展方法的概念。你可以从外部扩展任何类型，当你导入这样一个库并将其附加到某个类型时，该类型就获得了所有适用于它的实用函数。这样，你终于可以为字符串添加那个
    `concat()` 函数，或者将单位转换方法附加到任何 `uint` 上。


    如果你现在问自己“适用”是什么意思：当一个库函数以 `uint` 作为其第一个参数时，它适用于所有的 `uint`。所有其他类型也是如此——字符串对应字符串，字节对应字节，等等。


    ## 回退函数


    `fallback()` 函数是一个特殊函数。每个合约只能有一个。


    正如你现在可能知道的，客户端基本上可以调用智能合约上的任何东西。最终，客户端只使用以太坊节点的 HTTP JSON RPC API。这意味着没有任何东西是类型安全的。而这反过来又意味着客户端基本上可以调用一个不存在的函数。有趣的是，这不仅影响客户端，还影响其他智能合约。


    但是，如果有人调用一个不存在的函数会发生什么？嗯，如果那个合约有 `fallback()` 函数，调用就会被委派给这个函数。这允许你捕获那些原本错误的调用，并仍然对调用数据做一些处理。


    回退函数的一个常见用例是代理合约。这样的代理通过其 `fallback()` 函数捕获所有调用，并将调用委派给它包装的另一个合约。这允许你在运行时升级智能合约；否则这是不可能的。


    ## Receive 函数


    `receive()` 函数是另一个特殊函数。任何具有 `receive()` 函数的智能合约都可以接收以太币。如果合约没有 `receive()` 函数，它就不能接收以太币。有趣的是，只需要该函数存在即可。它不需要任何特殊的逻辑。函数的存在本身就允许合约通过
    `transfer()` 或 `send()` 接收以太币。合约本身的以太币余额可以通过使用 `address(this).balance` 来访问。


    将 `receive()` 函数留空是完全没问题的。这通常甚至是个好主意，因为 `send()` 和 `transfer()` 没有多少 gas 可用。如果
    `receive()` 做的事情太多，调用会耗尽 gas 并中止。


    ## Require


    实用函数 `require()` 实际上是 Solidity 中最重要的函数之一。它是 Solidity 实现守卫语句的原生方式。


    你不需要自己实现检查，然后在检查失败时手动回退你的合约。`require()` 会以最节省 gas 的方式为你完成所有这些工作。


    该函数接受一个布尔值作为第一个参数。该参数也可以是任何布尔表达式。如果该布尔值或表达式产生 `false`，`require()` 会自动抛出一个错误。


    第二个可选参数是一个字符串。这是在错误被抛出时分配给该错误的消息。这是开发者向其函数调用者提示具体哪里失败的一种方式。


    你通常会看到相对较短的字符串作为错误消息，这是有充分理由的。虽然 `require()` 本身是节省 gas 的，但字符串在你已部署合约的字节码中占用大量空间，这可能会大幅增加你合约的部署成本。


    ## Assert


    虽然 `require()` 是你进行守卫语句的首选函数，但 `assert()` 是一个最后的手段语句。当 `assert()` 调用失败时，意味着发生了极其严重的错误，以至于无法挽救任何东西。


    一个通用的经验法则是使用 `assert()` 来测试不变量或内部问题。你有时甚至将这些语句放在明显的位置，例如检查从用户余额中减去是否确实导致了正确的结果。


    `assert()` 还有另一个你可以利用的强大功能：工具可以在部署你的合约之前分析你的代码，并显示 `assert()` 是否会抛出错误。


    当 `assert()` 抛出错误时，所有剩余的 gas 都会被消耗。这是 `assert()` 和 `require()` 之间的另一个区别，因为 `require()`
    在失败时会退还剩余的 gas。


    ## 持久化数据存储


    许多有抱负的智能_contract 开发者需要适应的一个概念是，所有合约属性（那些建模其状态的属性）都是持久化的。


    开发智能合约时，你不需要数据库。无需读取、更新、创建或删除。每当你修改智能合约的一个属性时，你都需要一笔交易。在那笔交易完成后，你的合约状态就被持久化了，并且更改对所有其他人都是可见的。


    这就是智能合约不可思议的地方。在某些方面，开发它们更容易，但它并不像你想象的那么容易。你不应该现在就把所有东西都持久化到区块链上。例如，一篇博客文章占用大量空间，而区块可以包含的数据大小是有限的。


    作为智能合约开发者，你有替代方案来存储数据。例如，去中心化数据库是很好的替代方案，因为它们正是为那些你无法轻易在链上持久化的数据而设计的。


    ## 接口


    接口是为智能合约定义一组通用逻辑的方式，它们的工作方式与大多数其他语言相同。


    接口定义了一个实现该接口的智能合约必须提供的函数。实现接口的智能合约必须实现接口定义的所有函数。除此之外，接口还可以提供结构体和事件，任何实现合约都可以使用。


    在用户端，另一个智能合约只需要知道接口就可以与任何实现交互。


    你通常会在想要实现标准的场景中特别使用接口。例如，ERC20、ERC777、ERC721、ERC1155 等都可以通过接口很好地描述和定义。


    ## 抽象合约


    虽然接口只允许定义函数、结构体和事件，但抽象合约也可以包含逻辑。更准确地说，抽象合约可以决定实现函数，或者只将它们保留为声明。


    抽象合约本身不能被实例化，但其他智能合约可以从它派生，并继承所有通过相应可见性修饰符可访问的基础逻辑。


    让我们以 `Ownable` 为例。那通常是一个抽象合约，实现了基本合约访问控制所需的所有逻辑。尽管 `Ownable` 通常没有未实现的函数，但它仍然是抽象的，因为实例化
    `Ownable` 本身没有意义。其他合约从它派生以获得其所有功能。


    ## 不可变状态变量


    合约状态变量可以被标记为不可变。在这种情况下，你只能设置它们一次，可以在声明时或在合约的构造函数中。


    一旦设置，不可变状态变量就不能被更改。此外，访问这样的变量成本更低，因为当你的合约实例被创建时，所有出现的不可变变量都会被替换为它们各自的值。


    当你绝对确定一旦设置变量后就永远不需要更改它时，将合约变量设置为不可变是非常有意义的。这样，你可以节省大量的 gas，特别是当你的合约被频繁创建和调用时。

    '
