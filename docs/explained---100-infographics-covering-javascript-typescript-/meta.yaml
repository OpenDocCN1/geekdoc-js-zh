- md: ' ## Use Reduce To Build Your Own Pipe Function


    Piping is a functional concept. You take a value and put into a function. The
    result of this function is then used as input for the next function, and so on.
    You usually see an object-functional application of it when using map(), filter(),
    and so on on arrays. Let''s look at another example, so you better understand  what
    piping is:


    ```

    const result = multiplyBy5(flatMap(filter(value)));

    ```


    The more functions you use, the less readable this line becomes. You could now,
    of course, also format the code in a more readable way, but here is the same version
    with pipe():


    ```

    const piped = pipe(filter, flatMap, multiplyBy5);

    const result = piped(value);

    ```


    As you might see, this pipe() function is pretty neat, isn''t it?


    ## Implement map With reduce


    reduce() is one of the most important functional methods. You can use it to reimplement
    any other array method. Although you could argue that in this case, reduce() is
    only misused for looping the array, it is actually the base function used in many
    functional languages to really implement all the other functions. Composition
    is an important concept in this case.


    map() does nothing else than to take each element from an array, apply a function
    to it, and then push the resulting value into a new array. In the end, you get
    a new array with equally as many elements as the previous array, only that those
    elements were transformed.


    ## Implement flatMap With reduce


    You can apply the same principles to flatMap() as you already could to map().
    flatMap() has only one important difference to map(): It expects each callback
    to return an array instead of a new value. All those individual arrays then get
    appended to one resulting array. This usually results in a one-dimensional array
    instead of a two-dimensional one.


    flatMap() itself is not used that often, but it has its place. Whenever a function
    takes one input (that''s the element of the original array), and returns multiple
    values (an array), flatMap() is a great way to extract those values into a single-dimension
    array. This saves you from having to deal with nested arrays afterward. Instead
    of pushing the result of calling the callback, you use concat on the new array.
    This ensures that all results are appended in the correct order, and are incorporated
    into the array, and not placed as an element which itself is an array.


    ## Implement filter With reduce


    filter() is another candidate that can be reimplemented with reduce(). At the
    very base, the same principles apply as to all other array methods.


    filter() takes each element of an array and tests it with a callback. As long
    as the callback returns a truthy value (true, a number !== 0, a non-empty string,
    etc) that element is taken over into a new array. All elements the callback returns
    a falsy value for are filtered out, thus the name of the method.


    Implementing this logic is pretty straightforward. All you need is an if-statement
    to test the callback. And only if that callback returns a truthy value, you push
    the element to the new array. That''s it already.


    ## Implement forEach With reduce


    forEach() is the functional replacement for a loop. While map(), flatMap(), and
    filter() do of course represent special cases of looping over the elements of
    an array, forEach() is the purest form of it.


    Its purpose is to consume the elements of an array. The method itself does not
    return a new array, which makes it a so-called terminal operation. That''s an
    operation that closes a chain. In this particular case, we still return a new
    array so users could potentially continue chaining operations.


    Overall, the implementation of forEach() is nearly the same as for all other reimplementations.
    Instead of pushing or appending elements to the new array, the callback only consumes
    the element, and that''s it. No element is transformed or filtered.


    ## Implement flat With reduce


    flat() is a method that, well, flattens an array. What this means is the following:
    Depending on what number you pass to flat(), it flattens the array by the same
    number of dimensions.


    If you call flat(1) on a two-dimensional array, you get a one-dimensional array.
    It unpacks nested arrays exactly as many times as you ask it to do.


    One special case is calling flat() with Infinity. In this case, all nested arrays
    are unpacked until only a one-dimensional array is left. And this is exactly what
    this implementation does. It recursively calls itself again whenever it encounters
    a nested array and concatenates the result of the recursive call to the resulting
    array. If the element is no array, it is just appended.


    ## Implement groupBy With reduce


    Grouping values by keys can be a pretty common operation, depending on what you
    work with. And despite that, it''s a great algorithm to implement.


    If you boil it down to the basics, you only need 2 things:


    - A way to derive a key from a value

    - A way to store the values for each key


    In this case, number one is solved best by using a function that takes each element
    of an array as input and derives a key from it. Number two is solved by using
    a simple object as a map because objects are very straightforward to use as maps
    with their bracket access.


    Assigning an array to each key and pushing to that array when you encounter a
    key is everything that makes up the main logic of this algorithm, and reduce is
    a good base to use for that operation.


    You can, of course, also solve this task with a traditional loop, but as reduce
    is so flexible, why not use the functional way?


    ## JavaScript Algorithms


    ### Implementation Of The Factorial


    A factorial is a number that is written as n!. It means nothing else as "multiply
    all positive integers, from 1, up to the number specified by n".


    2! is thus 1 * 2 = 2. 3! is 1 * 2 * 3 = 6. 4! is 1 * 2 * 3 * 4 = 24. etc.


    Writing an algorithm for this is a good task for beginners because it does not
    require advanced techniques. The iterative solution is nothing else than a loop,
    doing the multiplication. And the factorial is a prime example of a recursive
    solution. It looks a little cramped, but in the end, you do nothing else than
    to repeatedly multiply n with another function call of the same function, decrementing
    n by 1, until you reach the number 1.


    What happens is that 3! is calculated as 3 * 2 * 1. And that''s the magic behind
    this recursive approach.


    ## A Memoized Fibonacci Function


    Fibonacci numbers are a special sequence in math. Each number is the result of
    summing up all previous values, beginning with 0. The first few fibonacci numbers
    are 0, 1, 1, 2, 3, 5, 8, etc. Implementing the calculation of fibonacci numbers
    is a straightforward task; you only need to sum numbers. Interestingly, fibonacci
    numbers are a great application of a recursive function, and with this comes a
    chance of using memoization.


    Memoization is a technique where you store results you already calculated, so
    you don''t need to calculate them again. Whenever you need a result, you first
    determine whether you have already calculated it. If so, you can use the stored
    result instead of computing it again.


    This implementation does precisely that. Whenever it computes a result, it stores
    it within an object that it uses as a map-like type. Each number is the result
    of recursively calculating two smaller numbers. The whole calculation is thus
    performed in reverse order because the numbers become smaller each time.'
  mdcn: '

    ## 使用 Reduce 构建自定义管道函数


    管道（Piping）是一个函数式概念。它接收一个值，将其输入到一个函数中。该函数的结果随后作为下一个函数的输入，如此依次执行。当你在数组上使用 `map()`、`filter()`
    等方法时，通常会看到其面向对象与函数式的结合应用。我们来看另一个例子，以便你更好地理解管道是什么：


    ```

    const result = multiplyBy5(flatMap(filter(value)));

    ```


    使用的函数越多，这行代码的可读性就越差。当然，你也可以用更具可读性的方式来格式化代码，但这里使用 `pipe()` 的版本是这样的：


    ```

    const piped = pipe(filter, flatMap, multiplyBy5);

    const result = piped(value);

    ```


    正如你所见，这个 `pipe()` 函数非常简洁，不是吗？


    ## 使用 reduce 实现 map


    `reduce()` 是最重要的函数式方法之一。你可以用它来重新实现任何其他数组方法。尽管你可能会争辩说，在这种情况下，`reduce()` 只是被滥用来遍历数组，但它实际上是许多函数式语言中用于实现所有其他函数的基础函数。组合（Composition）在这里是一个重要的概念。


    `map()` 所做的无非是从数组中取出每个元素，对其应用一个函数，然后将结果值推入一个新数组。最终，你会得到一个与之前数组元素数量相同的新数组，只不过这些元素被转换了。


    ## 使用 reduce 实现 flatMap


    你可以将实现 `map()` 时已经应用的相同原则，同样应用于 `flatMap()`。`flatMap()` 与 `map()` 只有一个重要区别：它期望每个回调返回一个数组而不是一个新值。所有这些单独的数组随后被追加到一个结果数组中。这通常会产生一个一维数组，而不是二维数组。


    `flatMap()` 本身并不常用，但它有其用武之地。每当一个函数接收一个输入（即原始数组的元素），并返回多个值（一个数组）时，`flatMap()` 就是将这些值提取到单维数组的好方法。这可以省去你后续处理嵌套数组的麻烦。你不再推送调用回调的结果，而是在新数组上使用
    `concat`。这确保了所有结果以正确的顺序被追加，并融入数组中，而不是作为一个数组元素被放置。


    ## 使用 reduce 实现 filter


    `filter()` 是另一个可以用 `reduce()` 重新实现的候选者。从根本上说，它与其他所有数组方法应用相同的原则。


    `filter()` 获取数组的每个元素，并用回调函数对其进行测试。只要回调返回一个真值（truthy value）（true、非零数字、非空字符串等），该元素就会被放入新数组中。回调返回假值（falsy
    value）的所有元素都会被过滤掉，因此得名。


    实现这个逻辑非常简单。你只需要一个 `if` 语句来测试回调。并且只有当回调返回真值时，你才将元素推送到新数组。仅此而已。


    ## 使用 reduce 实现 forEach


    `forEach()` 是循环的函数式替代方案。虽然 `map()`、`flatMap()` 和 `filter()` 当然也代表了遍历数组元素的特殊情况，但
    `forEach()` 是其最纯粹的形式。


    它的目的是消费数组的元素。该方法本身不返回新数组，这使其成为一个所谓的终端操作（terminal operation）。这是一个会终结链式调用的操作。在这个特定案例中，我们仍然返回一个新数组，以便用户可能继续链式调用其他操作。


    总的来说，`forEach()` 的实现与其他所有重新实现的实现几乎相同。回调不再推送或追加元素到新数组，它只是消费该元素，仅此而已。没有元素被转换或过滤。


    ## 使用 reduce 实现 flat


    `flat()` 方法，嗯，是用于扁平化数组的。这意味着：取决于你传递给 `flat()` 的数字，它会按相同的维度数扁平化数组。


    如果你在二维数组上调用 `flat(1)`，你会得到一个一维数组。它按照你要求的次数解包嵌套数组。


    一个特殊情况是使用 `Infinity` 调用 `flat()`。在这种情况下，所有嵌套数组都会被解包，直到只剩下一个一维数组。而这正是这个实现所做的。当它遇到嵌套数组时，它会递归地调用自身，并将递归调用的结果连接到结果数组中。如果元素不是数组，则直接追加。


    ## 使用 reduce 实现 groupBy


    按键分组值可以是一个非常常见的操作，具体取决于你处理的数据。尽管如此，它仍然是一个值得实现的优秀算法。


    如果你将其归纳到基础，你只需要两件事：


    - 一种从值派生键的方法

    - 一种为每个键存储值的方法


    在本例中，第一点最好通过使用一个函数来解决，该函数将数组的每个元素作为输入，并从中派生出一个键。第二点则是通过使用一个简单的对象作为映射（map）来解决，因为对象通过其方括号访问方式，非常易于用作映射。


    为每个键分配一个数组，并在遇到该键时向该数组推送值，这构成了该算法主逻辑的全部内容，而 `reduce` 是用于此操作的一个良好基础。


    当然，你也可以用传统的循环来解决这个任务，但既然 `reduce` 如此灵活，何不使用函数式的方式呢？


    ## JavaScript 算法


    ### 阶乘的实现


    阶乘是一个写作 n! 的数字。它的意思无非是“将从 1 到 n 指定的所有正整数相乘”。


    因此，2! 是 1 * 2 = 2。3! 是 1 * 2 * 3 = 6。4! 是 1 * 2 * 3 * 4 = 24。依此类推。


    为这个编写算法对初学者来说是一个好任务，因为它不需要高级技术。迭代解决方案不过是一个执行乘法的循环。而阶乘是递归解决方案的一个典型例子。它看起来有点紧凑，但最终你所做的不过是反复将
    n 与同一个函数的另一次调用相乘，每次将 n 递减 1，直到达到数字 1。


    发生的情况是，3! 被计算为 3 * 2 * 1。而这正是这种递归方法背后的魔力所在。


    ## 一个带记忆化的斐波那契函数


    斐波那契数是数学中的一个特殊数列。每个数都是从 0 开始，将之前所有值相加的结果。前几个斐波那契数是 0, 1, 1, 2, 3, 5, 8 等等。实现斐波那契数的计算是一项简单的任务；你只需要将数字相加。有趣的是，斐波那契数是递归函数的一个绝佳应用，这也带来了使用记忆化（Memoization）的机会。


    记忆化是一种存储已计算结果的技术，这样你就不需要重新计算它们。每当你需要一个结果时，你首先确定是否已经计算过它。如果是，你可以使用存储的结果，而不是再次计算。


    这个实现正是这样做的。每当它计算出一个结果，它就将其存储在一个用作类似映射类型的对象中。每个数都是递归计算两个较小数字的结果。因此，整个计算是逆序执行的，因为数字每次都在变小。

    '
