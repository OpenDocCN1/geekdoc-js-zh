  md: '# Persistent Data Storage


    ![](img/522b962b8325a030575a3d72d330a848_123_0.png)


    One concept that many aspiring smart contract developers need to get used to is
    the fact that all contract properties (those that model its state) are persistent.

    You don''t need a database when developing smart contracts. No reading, no updating,
    no creating, no deleting. Whenever you modify a property of your smart contract,
    you need a transaction. And after that transaction is through, your contract''s
    state is persisted, and the change is visible to everyone else.

    That''s the incredible thing about smart contracts. Developing them is easier
    in some aspects, but it''s not as easy as you might think. You should not persist
    everything on the blockchain now. A blog post, for example, takes up a lot of
    space, and the size of the data a block can contain is limited.

    As a smart contract developer, you have alternatives to storing data on the blockchain.
    Decentralized databases, for example, are good alternatives because they were
    made for exactly that data that you cannot easily persist on-chain.'
