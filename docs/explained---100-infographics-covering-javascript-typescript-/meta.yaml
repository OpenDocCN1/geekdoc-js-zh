  md: '# Waiting For Transactions To Finish With ethers


    ![](img/522b962b8325a030575a3d72d330a848_104_0.png)


    As you might have already learned, sending off a transaction only returns an object
    presenting a pending transaction. Depending on the blockchain, transactions can
    take a longer time to settle. This time can range from a few seconds to minutes.

    dApps usually try to not wait for transactions to settle and instead show an intermediate
    state until a transaction finally goes through.

    But sometimes, you might really want to wait until a transaction is settled before
    you let users continue with whatever they do.

    In this case, the pending transaction object offers a wait() method, that returns
    a Promise that only resolves when the transaction is appended to the next block.

    This is a potentially very long-running operation. You should only use it if really
    necessary.'
