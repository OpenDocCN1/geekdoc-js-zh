  - '[PAGE 90]


    # Type Aliases


    ![](img/522b962b8325a030575a3d72d330a848_90_0.png)


    Type aliases are the second way you can create types in TypeScript. They are not
    the same as interfaces and allow for even more flexibility with advanced features
    of composing existing types. With type aliases, you can intersect existing types
    (that is basically throwing two types together and making a new type from all
    their properties), create unions (that is type A OR type B OR type C, and even
    value A OR value B, etc.), and explicitly type functions. One good rule of thumb
    is to always go with interfaces until you need the flexibility of type aliases.
    If that need arises, you go with a type alias.'
  - '[PAGE 91]


    # ## Type Inference


    ![](img/522b962b8325a030575a3d72d330a848_91_0.png)


    If you ever worked with Java prior to version 10, you might still have nightmares
    from explicit typing variable declarations. Always having to explicitly type the
    left side of an assignment, although the right side obviously statesucheseems
    unnecessary.


    Gladly, the TypeScript team took care of that by allowing the compiler to infer
    types wherever necessary. You almost never have to explicitly declare the type
    of a variable if you don''t want to. The compiler infers the type from the right
    side of an assignment and narrows it down as far as possible. Only if you think
    that it narrows the type down too far, you can explicitly declare a less narrow
    type to help the compiler out.


    Type inference does, however, not work for function parameters. You still need
    to type them explicitly (understandably). Function return types can also be inferred
    but you should better always explicitly type your functions. If you accidentally
    change a function''s return value from string to number, you''ll see the error
    in the function, and not somewhere else where a string was expected.'
  - '[PAGE 92]


    # # Narrowing


    ![](img/522b962b8325a030575a3d72d330a848_92_0.png)


    Narrowing is a concept in TypeScript that allows the compiler to get more specific
    with a type that it is unsure about otherwise. Unions are such a case where the
    TypeScript compiler is unsure and cannot reliably predict what type it actually
    deals with. You, as a developer, can help the compiler to create some safety around
    such types. With typeof checks, for example, you can give the compiler the absolute
    security that if that check yields true, you deal with that exact type. Within
    any code path that follows the true case of such a check, you can treat that variable
    as the type you checked for. And the compiler is even intelligent enough to know
    that an else case for a union with two possible types can only yield the type
    not checked for previously.'
  - '[PAGE 93]


    # Type Predicates


    ![](img/522b962b8325a030575a3d72d330a848_93_0.png)


    Type predicates are functions with a special signature that only return a boolean
    in the end. This boolean, however, has a special meaning. It states: "This variable
    is of type X". And all this helps the TypeScript compiler to narrow down types
    where only you can help it out.


    Type predicates are an advanced form and utility for type narrowing. They cover
    those cases where a simple typeof check simply isn''t suitable enough anymore.
    If you use these special functions in an if-statement, or a switch, the compiler
    can narrow the type of any variable down to the specific type a predicate tested
    for. In all code paths that follow a true case of such a predicate test, the variable
    is considered to be of that specific type. This allows you to access all its properties
    without errors. But as soon as you leave that true case, the type goes back to
    what it was before.


    Predicates are especially useful when you work with inheritance and union types.
    And they don''t take much to implement.'
  - '[PAGE 94]


    # # Generics


    ![](img/522b962b8325a030575a3d72d330a848_94_0.png)


    Declaring types is a good thing. It creates security and helps developers to catch
    errors at compile-time; before their code crashes at runtime. Sometimes, however,
    types can become a burden. Especially if you want to make functions or classes
    more broadly applicable. Instead of duplicating your code over and over again
    to make it work with different types, you can use generics. As their name already
    suggests, they make code more generic and come with powerful functionality.


    The easiest use case is the one you see in the graphic above. assertPresent ties
    the return type of the function to the type it gets. If that is a string, it returns
    a string, etc. Within the function''s body, you can only access generic types
    at the level of their most common base type. In the case above that is unknown
    because that is what all types have in common.


    Sometimes, going with a generic type is way better than going with any because
    the latter can still lead to runtime errors if you access properties that don''t
    exist.'
  - '[PAGE 95]


    # # Web 3 - Ethers


    # ## Querying A Token’s Balance With ethers


    ![](img/522b962b8325a030575a3d72d330a848_95_0.png)


    Overall, all blockchains provide some form of HTTP JSON RPC API. It’s not REST,
    not SOAP, or anything else. It’s something relatively special, but it works well.

    Conceptually, every smart contract is an API endpoint identified by its contract
    address. All methods publicly accessible are basically API endpoints of that contract.

    This is why JavaScript is a pretty great language (besides its dominance of the
    browser) to dynamically interface with smart contracts.

    ethers allows you to pass in the ABI of any contract together with its address.
    That ABI is nothing else than the function prototypes of the smart contract’s
    Solidity code. And with this, ethers can dynamically create a fully working API
    that allows you to call any function on that contract. Querying a balance of a
    token is only one example of that.'
  - '[PAGE 96]


    # # Sending Ether With ethers


    ![](img/522b962b8325a030575a3d72d330a848_96_0.png)


    Every blockchain has its native cryptocurrency. It is usually used to pay gas
    fees and miners/validators for their service.


    Ethereum is not different. And one of the most basic interactions you can have
    with a blockchain is to send currency from your account to another account.


    With ethers, the process is straightforward. All you need is a provider and a
    signer. The first one is the Read-API object. The latter is a Write-API object
    that holds your private keys you need to sign your transactions with.


    sendTransaction() returns an object for a pending transaction that you can wait
    for if you really need to wait for the transaction to settle.'
  - '[PAGE 97]


    # Getting The Balance Of An Address With ethers


    ![](img/522b962b8325a030575a3d72d330a848_97_0.png)


    Another basic interaction with a blockchain is to query your own balance of the
    chain''s native currency. Unlike sending a transaction, you only need a provider
    for this. This is because all data on the blockchain is transparent for everyone,
    and the balance of your address is no different. You thus don''t need your private
    keys and no signed message to query the balance of any contract.


    Ethereum and chains that derive from it are a little special, though. They don''t
    support floating point numbers (at least not fully) right now. Instead, they offer
    support for 256-bit integer numbers. This is why the balance you get is actually
    in Wei, Ethereum''s smallest unit. One Ether consists of 1e18 Wei, and in order
    to get your balance in Ether, you need to convert it first.'
  - '[PAGE 98]


    # Getting The History Of An Address With ethers


    ![](img/522b962b8325a030575a3d72d330a848_98_0.png)


    You could believe that it''s easy to query everything on a blockchain, but you
    would be wrong. Although a blockchain contains all that data, it is actually incredibly
    difficult to access more complex data. Even getting the history of an address
    on-chain is not straightforward with the API a blockchain node provides. This
    is one of the major reasons websites like Etherscan, PolygonScan, BscScan, etc.
    exist.

    Gladly, ethers has a special provider that you can use to access Etherscan, a
    website, and platform that indexes blockchain data. With the help of an EtherscanProvider,
    you can query the full history of any blockchain address with ease.

    There is one drawback to this provider and approach, though: Not passing in an
    API key (that costs money) uses a publicly available budget. You share this budget
    with everyone else, so to say.


