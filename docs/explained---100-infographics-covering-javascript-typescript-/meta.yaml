  md: '# # Utility Type Omit


    ![](img/522b962b8325a030575a3d72d330a848_86_0.png)


    Omit is the counterpart to Pick. While Pick extracts specific properties, Omit
    removes them and only picks all properties not specified.


    You can apply it in nearly the same use cases as Pick, only in a reversed way.
    You take a type, and remove specific properties from it to get a new type.


    Let''s get back to the config object example. Now imagine you have some functions
    that need nearly all config values, but not all. In this case, you omit a few
    of those properties and accept a lighter object as input parameter. By tying your
    types so closely together, you get notified way earlier when something breaks.


    If the config object changes, the type created by Omit changes as well. Even if
    you remove properties not omitted, you''ll still see that your function''s do
    now miss a few mandatory parameters.'
