  - '[PAGE 108]


    # Visibilities


    ![](img/522b962b8325a030575a3d72d330a848_108_0.png)


    If you ever worked with private properties in JavaScript or TypeScript, or if
    you ever worked with another programming language like C# or Java, you already
    know that there are different visibilities for functions and properties.

    Visibilities help developers to encapsulate logic in different tiers. Sometimes,
    not all functions or properties should be accessible from the outside because
    they don''t belong to the public API of a contract. And sometimes, you only want
    to provide base logic that you can use in inheriting contracts.

    In Solidity, visibilities can even affect the gas consumption of contract calls.
    Due to the nature of the underlying EVM (Ethereum Virtual Machine), changing the
    visibility of a function can lead to less gas consumption because the calls can
    be optimized under the hood.'
- md: ' ## Function Types


    Solidity knows different function types that all serve their own purpose. Like
    visibilities, those types can also affect the gas consumption of functions.


    Overall, as explained above, there are three types of functions, and they are
    a great way for a developer to state their intent and get some basic checks by
    the compiler that can help identify errors. A pure function, for example, can
    never access the state of a contract. If you now, even by accident, happen to
    change some state, the compiler will notify you of that and help you to identify
    a bug before it hits production.


    Next to that, marking functions as view or pure also has a neat side effect: It
    doesn''t cost gas to call those functions. Although that only affects the call
    itself. If you do extensive computations within one of those functions, you''ll
    still have to pay a fee for that.


    ## Function Modifiers


    Function modifiers are a great feature of Solidity. If you ever worked with decorators
    in Python and TypeScript, or even with annotations in Java, you probably already
    know what a function modifier basically is.


    A function modifier, well, modifies a function. It is a special function itself
    that cannot be called directly. Instead, it is added to another function explicitly
    and then wraps that function. Whenever such a modified function is called, the
    modifier function is called first, and only then, according to its implementation,
    the actual modified function.


    Two of the most common use cases for modifier functions are guard statements and
    reentrant lock.


    A guard statement is a check, usually at the top of a function, verifying the
    input itself or against some contract state. Only if that check succeeds the function
    can run. If it fails, the guard statement throws, and the function execution stops.


    A reentrant lock is a way to ensure that a function can only be called once at
    a time.


    ## Events


    Events are the log messages of Solidity and Ethereum. Any contract can define
    one or multiple events and then emit them at any time. They are like objects without
    functions. They can only contain data, and some of that data can be marked as
    indexed. An indexed property is something that you can filter and search events
    for. Other smart contracts can''t subscribe to those events. They are solely aimed
    at client libraries.


    Events help to make sense of what happens on the blockchain because transactions
    can sometimes be very difficult to read. They state which contract and function
    were called, but you often don''t find out easily what exactly happened. This
    is where events come in. They explicitly state, through their own type, and their
    data, what the action was that led to this particular event.


    ## Raising Errors


    Like many other programming languages, Solidity does, of course, also have a concept
    of errors/exceptions.


    Errors state that an operation like a function call wasn''t successful, and they
    are defined nearly identical to events. Every error has a name, and it can contain
    data.


    Contrary to other languages that usually "throw" errors, Solidity uses the concept
    of reverting. When an error occurs, the contract and all its state are reverted
    back to the state before the function call. No matter how much state a function
    changes before using the "revert" statement with an error, all previous actions
    get reverted.


    Additionally, reverting a contract usually refunds all gas remaining.


    This means that if your function had 10000 gas available and already used up 5000,
    5000 are refunded when the revert statement gets called.


    ## Handling Errors


    As you might remember, contracts can call other contracts in Solidity. This is
    why the language also has a concept of handling errors. If a call a contract makes
    gets reverted, you need a chance to react to this circumstance.


    Solidity uses the same try-catch mechanic as many other programming languages,
    only with a few minor differences. The try-statement is always followed by the
    call that can potentially throw. Within the try block, you can add more statements
    that are executed if the call is successful.


    The catch-statement is followed by the type of error to catch like in other languages.
    Within the following block, you can place as many statements as you want or need
    to process the error or even additionally revert your own contract.


    ## Structs


    Structs are another type of object in Solidity. You can view them as the little
    brothers of contracts. While contracts are the API layer that can contain properties
    and functions, structs are only data containers. Like events and errors, they
    can not contain functions and only properties.


    Their purpose is to help developers group multiple properties in a more meaningful
    way. Additionally, they also help to save gas in some circumstances.


    Structs can be used as parameters and return values, and you can handle them like
    any other variable. Using a struct usually begins to make sense as soon as you
    have a group of at least two properties that you regularly need in multiple places.


    ## Mappings


    Mappings are the maps or dictionaries of Solidity. They are actually one of the
    most important data structures for any smart contract. Whenever you need a key-value
    relation, a mapping is the native type to use.


    Mappings form the base of many important standards. ERC20 tokens, for example,
    track your balance in a mapping, and even your favorite NFT tracks your CryptoPunk
    or APE in a mapping.


    Mappings themselves only offer a basic public API. It mostly consists of the square
    bracket access that allows you to read values and set them. That''s actually the
    same way you can use dynamic property access on objects in JavaScript.


    ## Enums


    Enums, or longer enumerated values, are a finite set of constant values. While
    a string can take any form you can imagine, enums can only take the values you
    define for them. They are a great way when you only need a specific set of values
    that you can base logic on. Enums can even be used as parameters of public functions.
    In this case, however, the client needs to pass in the numeric value of the enum.
    That''s a small drawback because it is far less usable than passing in the string
    value of the enum. Each enum value is assigned a uint8 value. The order of the
    numbers works like for arrays. The first value has a value of 0, the second one
    a value of 1, and so on. If we apply this to the example above, Active is 0, and
    Locked is 1. When enums are parameters, the runtime automatically adds a guard
    statement checking for invalid inputs. This means that you don''t need a require()
    to check the validity of the value. That has already been executed automatically
    when inside the function''s body.


    ## Concatenating Strings


    A thing that is pretty straightforward in other languages can quickly become an
    issue in Solidity. In this case, it''s concatenating strings. There is no built-in
    method attached to strings that makes this possible in any way. There are different
    reasons why this is the case, but actually, the most important one is how the
    underlying Ethereum Virtual Machine handles strings. They are just a sequence
    of bytes, interpreted based on their encoding. That''s not much different from
    how it actually is in other languages, but the EVM is special. It is a very limited
    virtual machine that makes some tradeoffs to work as best as possible in a blockchain
    context.


    There are multiple ways to concatenate strings in Solidity but, actually, there
    is only one way you need to know because it''s the most gas-efficient one. abi.encodePacked()
    takes multiple input parameters, extracts their bytes, and concatenates them.
    The result of the call is one byte array containing the concatenated result. If
    you create a string from that byte array, you have your concatenated string.'
  mdcn: '

    ## 函数类型


    Solidity 了解不同的函数类型，它们各有其用途。与可见性类似，这些类型也会影响函数的气体消耗。


    总的来说，如上所述，有三种函数类型，它们是开发者表达意图并让编译器进行一些基本检查以帮助识别错误的好方法。例如，纯函数永远无法访问合约的状态。如果你现在，即使是意外地，改变了某些状态，编译器会通知你，并帮助你在投入生产前识别出
    bug。


    除此之外，将函数标记为 view 或 pure 还有一个很好的副作用：调用这些函数不需要消耗 gas。尽管这只影响调用本身。如果你在其中一个函数内进行大量计算，你仍然需要为此付费。


    ## 函数修饰符


    函数修饰符是 Solidity 的一个很棒的特性。如果你曾经使用过 Python 和 TypeScript 中的装饰器，或者甚至使用过 Java 中的注解，你可能已经知道函数修饰符基本上是什么了。


    函数修饰符，顾名思义，修饰一个函数。它本身是一个特殊函数，不能直接调用。相反，它被显式地添加到另一个函数中，然后包装该函数。每当调用这样一个被修饰的函数时，修饰符函数会首先被调用，然后，根据其实现，实际的修饰函数才会被执行。


    修饰符函数的两个最常见的用例是守卫语句和可重入锁。


    守卫语句是一个检查，通常位于函数顶部，用于验证输入本身或某些合约状态。只有当该检查成功时，函数才能运行。如果失败，守卫语句将抛出错误，函数执行停止。


    可重入锁是一种确保函数一次只能被调用一次的方法。


    ## 事件


    事件是 Solidity 和 Ethereum 的日志消息。任何合约都可以定义一个或多个事件，然后在任何时候发出它们。它们就像没有函数的对象。它们只能包含数据，其中一些数据可以标记为索引。索引属性是你可以用来过滤和搜索事件的东西。其他智能合约无法订阅这些事件。它们仅面向客户端库。


    事件有助于理解区块链上发生的事情，因为交易有时可能非常难以阅读。它们说明了哪个合约和函数被调用了，但你通常不容易弄清楚到底发生了什么。这就是事件的用武之地。它们通过自己的类型和数据，明确说明了导致这个特定事件的操作是什么。


    ## 抛出错误


    像许多其他编程语言一样，Solidity 当然也有错误/异常的概念。


    错误表明像函数调用这样的操作没有成功，它们的定义与事件几乎相同。每个错误都有一个名称，并且可以包含数据。


    与其他通常“抛出”错误的语言相反，Solidity 使用回滚的概念。当发生错误时，合约及其所有状态都会回滚到函数调用之前的状态。无论一个函数在使用错误语句“revert”之前改变了多少状态，所有之前的操作都会被回滚。


    此外，回滚合约通常会退还所有剩余的气体。


    这意味着如果你的函数有 10000 gas 可用，并且已经用掉了 5000，那么当 revert 语句被调用时，会退还 5000。


    ## 处理错误


    你可能还记得，在 Solidity 中，合约可以调用其他合约。这就是为什么该语言也有处理错误的概念。如果一个合约发出的调用被回滚，你需要有机会对这种情况做出反应。


    Solidity 使用与许多其他编程语言相同的 try-catch 机制，只是有一些微小的差异。try 语句后面总是跟着可能抛出错误的调用。在 try 块中，你可以添加更多语句，如果调用成功则执行。


    catch 语句后面跟着要捕获的错误类型，就像在其他语言中一样。在随后的块中，你可以放置任意多的语句来处理错误，或者甚至进一步回滚你自己的合约。


    ## 结构体


    结构体是 Solidity 中另一种类型的对象。你可以将它们视为合约的小兄弟。虽然合约是包含属性和函数的 API 层，但结构体只是数据容器。像事件和错误一样，它们不能包含函数，只能包含属性。


    它们的目的是帮助开发者以更有意义的方式将多个属性组合在一起。此外，在某些情况下，它们还有助于节省 gas。


    结构体可以用作参数和返回值，你可以像处理任何其他变量一样处理它们。当有一组至少两个属性需要在多个地方定期使用时，使用结构体通常开始变得有意义。


    ## 映射


    映射是 Solidity 中的映射或字典。它们实际上是任何智能合约最重要的数据结构之一。每当你需要键值关系时，映射就是要使用的原生类型。


    映射构成了许多重要标准的基础。例如，ERC20 代币在映射中跟踪你的余额，甚至你最喜欢的 NFT 也在映射中跟踪你的 CryptoPunk 或 APE。


    映射本身只提供基本的公共 API。它主要由方括号访问组成，允许你读取和设置值。这实际上与你可以在 JavaScript 中对对象使用动态属性访问的方式相同。


    ## 枚举


    枚举，或更长的枚举值，是有限的一组常量值。虽然字符串可以采用你能想象到的任何形式，但枚举只能采用你为它们定义的值。当你只需要一个可以基于其构建逻辑的特定值集合时，它们是一个好方法。枚举甚至可以用作公共函数的参数。然而，在这种情况下，客户端需要传入枚举的数值值。这是一个小缺点，因为它比传入枚举的字符串值实用性差得多。每个枚举值都被分配一个
    uint8 值。数字的顺序与数组的工作方式相同。第一个值的值为 0，第二个值的值为 1，依此类推。如果我们将其应用于上面的例子，Active 是 0，Locked
    是 1。当枚举是参数时，运行时会自动添加一个守卫语句来检查无效输入。这意味着你不需要一个 require() 来检查值的有效性。当在函数体内部时，这已经自动执行了。


    ## 连接字符串


    在其他语言中非常直接的事情在 Solidity 中可能很快成为一个问题。在这种情况下，就是连接字符串。没有内置的方法附加到字符串上以使其以任何方式成为可能。有多种不同的原因导致这种情况，但实际上，最重要的是底层以太坊虚拟机处理字符串的方式。它们只是字节序列，根据其编码进行解释。这与实际上在其他语言中的方式没有太大不同，但
    EVM 是特殊的。它是一个非常有限的虚拟机，为了在区块链环境中尽可能好地工作而做出了一些权衡。


    在 Solidity 中有多种连接字符串的方法，但实际上，只有一种方法你需要知道，因为它是气体效率最高的。abi.encodePacked() 接受多个输入参数，提取它们的字节，并连接它们。调用的结果是一个包含连接结果的字节数组。如果你从该字节数组创建一个字符串，你就得到了你的连接字符串。

    '
