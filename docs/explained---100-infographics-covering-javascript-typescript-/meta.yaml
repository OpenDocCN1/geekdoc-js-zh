    \ you merge the object that a user filled with data, and in the end, you get something\
    \ your function or API can work with.\n\nFor a long time, you would have done\
    \ it like this:\n\n```\nconst myFunc = (options) => {\n  const mergedOptions =\
    \ Object.assign({}, defaults,\n    options);\n};\n```\n\nThanks to spreading,\
    \ however, this operation is easier than ever nowadays. Create your new object\
    \ and then spread all other objects into it in order. It also works the same way\
    \ as Object.assign():\n\nProperties of objects spread later in the chain override\
    \ ones already present."
  - '[PAGE 14]


    # Make Objects Immutable With Freeze


    ![](img/522b962b8325a030575a3d72d330a848_14_0.png)


    Immutability is a core concept of functional programming.

    JavaScript, however, has a pretty rough history. Initially created in a few days,
    and envisioned as a language with prototypal inheritance, it mixed many different
    concepts. What we ended up with was a language that, only recently, introduced
    private properties on classes, for example. There is also no keyword to make properties
    immutable on objects.


    Gladly, Object has some pretty useful helper methods to deal with all sorts of
    objects, and one of those is freeze().

    What freeze() does is make any object fully immutable. Any property of a frozen
    object cannot be modified, and it is set in stone from then on. However, this
    is only a shallow operation. Any nested property that is an object itself is still
    unfrozen and could be modified.


    If you want to freeze an object deeply, you need to either use a library like
    lodash or write your own recursive deep freeze.'
  - '[PAGE 15]


    # Make Arrays Immutable With Freeze


    ![](img/522b962b8325a030575a3d72d330a848_15_0.png)


    Arrays are nothing else than objects with some unique functionality, which means
    that freeze() also works on them. If you freeze an array, it becomes as immutable
    as any other object. No matter what you try afterward, all operations throw a
    TypeError. The only drawback is that the operation is as shallow for arrays as
    for objects. If you also want to freeze all probably nested arrays or objects,
    you need to use a deep freeze function.


    If you want to work only with immutable data, freeze your arrays. The only drawback
    is that all operations throw at runtime, making it pretty difficult for your users
    to reason about.


    If you want something bullet-proof, the only alternative is to use an immutable
    array implementation from a library, like Immutables, that doesn''t even offer
    mutating methods. This is the only way to make it safe for your users to work
    with your arrays or collections without unpleasant surprises.'
  - '[PAGE 16]


    # # Use Array.findIndex When Dealing With Objects


    ![](img/522b962b8325a030575a3d72d330a848_16_0.png)


    Array''s indexOf() method is lacking. Under the hood, it compares elements and
    the value you search for with the strict equality comparison operator (===). If
    you ever tried to compare two separate objects with the same contents in JavaScript,
    you know that it doesn''t work. === only tests for identity on objects. You can
    never use indexOf reliably to find the index of an object within an array.


    Gladly, array got the findIndex() method that takes a callback instead of only
    a value. With this method, you can pass in an (arrow-) function and implement
    the test for equality yourself. This allows you to also reliably identify objects
    by testing the presence and equality of their properties.


    Whenever you know that you deal with objects, better use findIndex() right away.
    It saves you a lot of headaches, for sure.'
  - '[PAGE 17]


    # Destructure Function Parameters To Increase Readability For Users


    ![](img/522b962b8325a030575a3d72d330a848_17_0.png)


    Long parameter lists on functions are difficult to read and reason about. Many
    IDEs and editors at least show a tooltip identifying each parameter and its meaning,
    but you still struggle a lot regularly. JavaScript is dynamic, which means that
    you can basically pass anything anywhere, so you don''t even have some type hints
    at hand.

    Passing an object is a great way to make the use of your functions easier. And
    on the implementing side, you can directly destructure the object inside the parameter
    list. This allows you to work with individual variables within the function''s
    body, while your users can pass in a plain old object with named properties.

    A good rule of thumb is to switch individual parameters to an object after exceeding
    three parameters. Remember that this is a breaking change for existing functions,
    so better plan thoroughly beforehand.'
- md: " ## Get The Last Items Of An Array\n\nJavaScript doesn't have as much flexibility\
    \ for arrays as Python has for its lists, but it's not entirely defenseless, so\
    \ to say. Python has its slice syntax, while JavaScript has the slice() method\
    \ to get a specific slice of an array. The method is flexible enough to get the\
    \ last n items of an array by passing in a negative number.\n\nWhat you get in\
    \ return is a new array containing the n last elements of the original array,\
    \ in the same order they were initially placed in. That's more than enough for\
    \ most use cases, which are already pretty rare. You simply don't need it that\
    \ often, but when you do, you know that you have a tool at hand to get the task\
    \ done.\n\n## Use Array.at To Access Elements From The End\n\nWhile calling slice()\
    \ on an array with a negative number returns the last n elements of that array\
    \ as a new array, Array.at() will specifically be introduced with ES2022 to give\
    \ developers a way to access single elements anywhere within the array easily.\n\
    \nWhen called with positive numbers, the method itself is not interesting at all.\
    \ This way, it doesn't offer much more utility than the square bracket notation.\
    \ However, negative numbers allow you to access elements from the end of an array.\
    \ And passing -1 is usually more readable than array.length - 1.\n\n## Make An\
    \ Argument Required By Using Default Parameters\n\nJavaScript is a dynamically\
    \ typed language. Without types, there is no way to easily state that a variable\
    \ or an argument can be undefined or not.\n\nYou usually solve this in JavaScript\
    \ by making runtime checks and documenting the required parameters of your functions.\
    \ The more arguments a function has, the less readable your function's body becomes,\
    \ though.\n\nBut gladly, you can use default parameters to free your function\
    \ body from all that boiler-plate code. Default parameters are triggered whenever\
    \ an argument is undefined. In this case, a pre-made function is called that throws\
    \ an Error. Putting those checks into the parameter list of your function leaves\
    \ the function's body to the actual implementation. If you now format the parameter\
    \ list of your function so that each parameter takes one line, you get pretty\
    \ readable code.\n\n## Numeric Separators\n\nNumeric separators don't look like\
    \ much, but they are a fantastic addition to JavaScript. Introduced with ES2021,\
    \ you might still need to use Babel to apply them in production apps reliably.\n\
    \nLarge readable numbers can be crucial to understanding code quickly. If you\
    \ ever had to guess what a number with more than six digits represented, you know\
    \ the pain associated with it.\n\nFrom now on, you can build logical groups within\
    \ your numbers and make it way easier to get the correct value quickly.\n\nNumeric\
    \ separators work for all types of numbers, including binary, octal, hexadecimal,\
    \ and scientific notation:\n\n```\nconst bytes = 0b111_001_101;\nconst octal =\
    \ 0o123_476;\nconst hex = 0xFAB_F01;\nconst scientificNotation = 1.123_312_32e-16;\n\
    ```\n\n## Quickly Filter Out All Falsy Values From An Array\n\nFirst-class functions\
    \ are great, and you can use existing ones as arguments, like any other variable.\
    \ Under the hood, the function gets called with all arguments the caller provides.\n\
    \nThe Boolean constructor function is the master of truthy and falsy in JavaScript.\
    \ Whenever you make a comparison and something is casted to a boolean implicitly,\
    \ this function is called under the hood. This makes it a prime candidate to pass\
    \ to filter, to rule out all falsy values quickly. Under the hood, the call looks\
    \ like this:\n\n```\nconst result = array.filter(\n  (element, index, array) =>\n\
    \    Boolean(element, index, array)\n);\n```\n\nindex and array are ignored because\
    \ Boolean() only accepts one argument, the element in this case.\n\n## Get All\
    \ Unique Values From An Array\n\nThis way to retrieve all unique values from an\
    \ array combines techniques a little newer to JavaScript. First of all, it uses\
    \ a Set. That's a data structure that only contains unique values (it's the same\
    \ principle as a mathematical set). A Set is a so-called iterable, and Iterables\
    \ are collections of elements that all can be, well, iterated. When used on iterables,\
    \ the spread operator extracts all values from those iterables and places them\
    \ wherever the spread operator is used. In this case, all the unique values from\
    \ that Set are put into a new array, thus creating a collection of unique values.\
    \ This technique has one drawback, though. It does not work with objects because\
    \ the Set constructor uses === under the hood to check for identical elements.\
    \ As you probably remember from earlier in this book, even two objects, completely\
    \ equal in their contents, can never be deemed equivalent for === because the\
    \ operator checks for identity on objects.\n\n## Promise.race vs Promise.any\n\
    \nYou have probably already used Promise.all() to collect multiple Promises and\
    \ wait until they all finish. The Promise object itself holds more static utility\
    \ methods, though.\n\nPromise.race() is a method that takes multiple Promises\
    \ and waits exactly until one Promise settles. It doesn't care whether that Promise\
    \ rejects or fulfills. If the Promise succeeds, you get the value. If it rejects,\
    \ an error is thrown that you can catch.\n\nPromise.any also takes multiple Promises\
    \ and waits for the first Promise to settle successfully. Even if 9 out of 10\
    \ Promises are rejected, and only the last one settles successfully, you'll get\
    \ the result of the successful one. Only if all Promises reject, Promise.any()\
    \ throws an AggregateError.\n\n## How To Create A Cancelable Promise Delay\n\n\
    Asynchronous operations usually follow the same pattern: You start them, you wait\
    \ for them to finish, and in the meantime, you can do something else. This is\
    \ how a Promise works. The execution of a particular piece of code is halted until\
    \ the Promise resolves. In the meantime, the event loop can continue to work and\
    \ execute other code that doesn't need to wait for anything at that moment. When\
    \ the Promise settles, the event loop picks it up again and runs it as soon as\
    \ possible, no matter whether the Promise failed or rejected. Sometimes, however,\
    \ you want to wait for a little before sending off the action. In this case, you\
    \ can use setTimeout() and combine it with a Promise. After the specified timeout,\
    \ setTimeout() successfully settles the Promise, and based on this, you can chain\
    \ any operation you like with its then() method. If you don't need the Promise\
    \ to settle anymore, you can easily abort it through the cancel() method. If the\
    \ timeout is canceled, the Promise rejects, which you can handle either with a\
    \ try-catch block or a catch().\n\n## Beware Of Automatic Semicolon Insertion\n\
    \nJavaScript has a concept called automatic semicolon insertion (ASI). There are\
    \ certain places in your code where the runtime expects a semicolon at the end\
    \ of a line. Otherwise, it \"inserts\" one for you (it only assumes there is one,\
    \ it does not alter your code). The example above is one of the more \"popular\"\
    \ occasions where ASI can surprise you. Both snippets look nearly identical, but\
    \ they differ in one subtle detail. The curly brace is placed on a new line on\
    \ the left side, and the return statement stands alone. On the right side, the\
    \ return statement is directly followed by a curly brace on the same line.\n\n\
    The code on the left side will trigger an automatic semicolon insertion. The return\
    \ statement is not kept open by anything and thus closed by the runtime. An empty\
    \ return statement is the same as returning undefined, and the object you wanted\
    \ to return becomes unreachable dead code. This is why linters are so crucial,\
    \ and they can warn you of such subtle mistakes or even automatically fix those\
    \ issues for you."
  mdcn: "\n## 获取数组的最后几项\n\nJavaScript 对数组的灵活性不如 Python 对其列表那么强，但也并非完全无能为力。Python 有切片语法，而\
    \ JavaScript 有 `slice()` 方法来获取数组的特定切片。该方法足够灵活，可以通过传入负数来获取数组的最后 n 个元素。\n\n你得到的是一个新数组，包含原始数组的最后\
    \ n 个元素，顺序保持不变。这对于大多数用例来说已经绰绰有余，而这些用例本身也相当少见。你通常并不需要频繁使用它，但当你确实需要时，你知道手头有工具可以完成任务。\n\
    \n## 使用 Array.at 从末尾访问元素\n\n虽然在数组上调用 `slice()` 并传入负数会返回该数组的最后 n 个元素作为新数组，但 `Array.at()`\
    \ 是在 ES2022 中专门引入的，为开发者提供了一种轻松访问数组中任意位置单个元素的方法。\n\n当使用正数调用时，该方法本身并没有太大意义。在这种情况下，它并不比方括号表示法提供更多实用功能。然而，负数允许你从数组末尾访问元素。传递\
    \ `-1` 通常比 `array.length - 1` 更具可读性。\n\n## 使用默认参数使参数变为必需\n\nJavaScript 是一种动态类型语言。没有类型，就无法轻松声明一个变量或参数是否可以是\
    \ `undefined`。\n\n在 JavaScript 中，你通常通过运行时检查和文档记录函数的必需参数来解决这个问题。函数的参数越多，函数体的可读性就越差。\n\
    \n但好消息是，你可以使用默认参数来使函数体摆脱所有样板代码。每当参数为 `undefined` 时，就会触发默认参数。在这种情况下，会调用一个预制函数，该函数抛出一个错误。将这些检查放在函数的参数列表中，可以让函数体专注于实际实现。如果你现在将函数的参数列表格式化为每个参数占一行，你就能得到相当可读的代码。\n\
    \n## 数字分隔符\n\n数字分隔符看起来不起眼，但它们是 JavaScript 的一个绝佳补充。在 ES2021 中引入，你可能仍需要使用 Babel\
    \ 才能在生产应用中可靠地使用它们。\n\n易于阅读的大型数字对于快速理解代码至关重要。如果你曾不得不猜测一个超过六位数的数字代表什么，你就会明白与之相关的痛苦。\n\
    \n从现在开始，你可以在数字中构建逻辑分组，从而更轻松地快速获取正确的值。\n\n数字分隔符适用于所有类型的数字，包括二进制、八进制、十六进制和科学计数法：\n\
    \n```\nconst bytes = 0b111_001_101;\nconst octal = 0o123_476;\nconst hex = 0xFAB_F01;\n\
    const scientificNotation = 1.123_312_32e-16;\n```\n\n## 快速过滤掉数组中的所有假值\n\n一等函数很棒，你可以像使用任何其他变量一样，将它们作为参数使用。在底层，函数是使用调用者提供的所有参数来调用的。\n\
    \n`Boolean` 构造函数是 JavaScript 中处理真值和假值的专家。当你进行比较并且某些内容被隐式转换为布尔值时，底层就会调用此函数。这使得它成为传递给\
    \ `filter` 以快速排除所有假值的首选。底层的调用如下所示：\n\n```\nconst result = array.filter(\n  (element,\
    \ index, array) =>\n    Boolean(element, index, array)\n);\n```\n\n`index` 和 `array`\
    \ 被忽略了，因为 `Boolean()` 只接受一个参数，这里就是 `element`。\n\n## 从数组中获取所有唯一值\n\n这种从数组中获取所有唯一值的方法结合了一些对\
    \ JavaScript 来说较新的技术。首先，它使用 `Set`。这是一种只包含唯一值的数据结构（与数学集合原理相同）。`Set` 是所谓的可迭代对象，可迭代对象是元素的集合，这些元素都可以被迭代。当用于可迭代对象时，扩展运算符从这些可迭代对象中提取所有值，并将其放置在扩展运算符使用的位置。在这个例子中，该\
    \ `Set` 中的所有唯一值都被放入一个新数组中，从而创建了一个唯一值的集合。然而，这种方法有一个缺点。它不适用于对象，因为 `Set` 构造函数在底层使用\
    \ `===` 来检查相同的元素。正如你可能在本书前面记得的，即使两个对象在内容上完全相等，对于 `===` 来说也永远不能被视为等价，因为该操作符检查的是对象的身份。\n\
    \n## Promise.race vs Promise.any\n\n你可能已经使用过 `Promise.all()` 来收集多个 Promise 并等待它们全部完成。不过，Promise\
    \ 对象本身包含更多静态实用方法。\n\n`Promise.race()` 是一个方法，它接受多个 Promise，并恰好等到其中一个 Promise 决定（settled）。它并不关心该\
    \ Promise 是拒绝（rejected）还是 fulfilled（已实现）。如果 Promise 成功，你会得到其值。如果被拒绝，则会抛出一个错误，你可以捕获该错误。\n\
    \n`Promise.any` 也接受多个 Promise，并等待第一个 Promise 成功决定。即使 10 个 Promise 中有 9 个被拒绝，只有最后一个成功决定，你也会得到成功那个的结果。只有当所有\
    \ Promise 都被拒绝时，`Promise.any()` 才会抛出一个 `AggregateError`。\n\n## 如何创建一个可取消的 Promise\
    \ 延迟\n\n异步操作通常遵循相同的模式：你启动它们，等待它们完成，在此期间你可以做其他事情。这就是 Promise 的工作原理。特定代码的执行会暂停，直到\
    \ Promise 解析（resolve）。与此同时，事件循环可以继续工作，并执行其他在此时刻不需要等待的代码。当 Promise 决定（settled）时，事件循环会再次获取它，并尽快运行它，无论\
    \ Promise 是失败还是被拒绝。然而，有时你希望在触发操作之前稍作等待。在这种情况下，你可以使用 `setTimeout()` 并将其与 Promise\
    \ 结合使用。在指定的超时时间后，`setTimeout()` 成功决定 Promise，基于此，你可以使用 `then()` 方法链接任何你想要的操作。如果你不再需要\
    \ Promise 决定，你可以通过 `cancel()` 方法轻松中止它。如果超时被取消，Promise 会拒绝，你可以使用 try-catch 块或 `catch()`\
    \ 来处理。\n\n## 注意自动分号插入\n\nJavaScript 有一个称为自动分号插入（ASI）的概念。在代码中的某些地方，运行时会在行尾期望一个分号。否则，它会为你“插入”一个（它只是假定有一个，并不会改变你的代码）。上面的例子是\
    \ ASI 可能会让你惊讶的更“常见”的情况之一。两个代码片段看起来几乎相同，但它们在一个微妙的细节上有所不同。左边的花括号放在新行上，return 语句单独成行。在右边，return\
    \ 语句后面直接跟着同一行上的花括号。\n\n左边的代码将触发自动分号插入。return 语句没有任何内容保持其开启状态，因此会被运行时关闭。一个空的 return\
    \ 语句等同于返回 `undefined`，而你想要返回的对象则变成了无法访问的死代码。这就是为什么 linter 如此重要，它们可以警告你这种微妙的错误，甚至自动为你修复这些问题。\n"
