    ## 正确对数字进行排序


    ![](img/522b962b8325a030575a3d72d330a848_45_0.png)


    JavaScript 在排序方面的行为相当独特，但原因相对简单。如果你曾尝试对数字数组调用 sort()，你可能会惊讶地发现数字并没有按你期望的方式排序。这是因为
    JavaScript 是动态类型的。一个数组可以包含多种不同类型的元素，而只有一种通用类型能涵盖所有其他可能的类型，那就是字符串。因此，sort() 在没有回调函数时，会将元素转换为字符串，然后进行字典序比较。[1,
    2, 11, 21] 排序后 thus 变成 [1, 11, 2, 21]。你可以通过向 sort() 传递一个回调函数来解决这个问题，其预期逻辑如下：如果
    a > b，返回正数；如果 a < b，返回负数；如果 a === b，返回 0。a - b 正好实现了这一点。当你传递这个回调函数时，就能轻松地将数字数组按升序排列。如果你想要降序排列，b
    - a 就是你的方法。


    ## 使用 Array.includes 代替 indexOf


    ![](img/522b962b8325a030575a3d72d330a848_46_0.png)


    如果你在较早的时候使用 JavaScript，你可能还记得用 indexOf() 来测试数组是否包含某个特定元素。这是因为当时数组没有 contains/includes
    方法。


    值得庆幸的是，现在我们有了 includes() 方法，你终于可以抛弃所有检查 indexOf 是否返回 0 或任何正数的变通方案了。


    代码可读性是你始终需要密切关注的最重要因素之一。作为软件开发人员，我们读代码的时间比写代码的时间更多。每次遇到 bug 时，我们很可能需要阅读代码来理解发生了什么。有时，我们会对代码进行重构以提升性能或改进代码。那也需要大量阅读。使用具有描述性的方法名已经能极大地改善这种情况。你可以争辩说其他开发者知道
    indexOf(whatever) > -1 是在检查数组是否包含某个特定元素，但阅读 includes(whatever) 时你甚至不需要思考一秒钟。一眼就能看明白发生了什么。


    ## 防止对象键成为可枚举属性


    ![](img/522b962b8325a030575a3d72d330a848_47_0.png)


    可枚举属性是指 Object.keys() 或 for-in 循环会捕获到的属性。当你想要深度克隆对象时，这非常有帮助。遍历对象的键，把所有能捕获到的属性都复制过去。然而，有时你不想让某个属性成为可枚举的。


    undefined 是模糊的。它要么意味着"没有键"，要么意味着"没有值"。如果你创建一个对象并显式地将它的某个键设置为 undefined，该键存在，但没有属性值。这使得该键成为可枚举的。


    对于单个属性没有问题，直接省略它即可。但如果有多个属性呢？相信我，那会产生大量的 if 语句。如果你想寻找更简单的解决方案，那么只需像上面那样有条件地展开每个属性即可。如果值不存在，键也不会出现在对象上。


    ## 使用逻辑 AND 进行短路求值


    ![](img/522b962b8325a030575a3d72d330a848_48_0.png)


    短路求值实际上是布尔代数相关的特性。布尔表达式可以通过只执行真正必要的工作来优化。如果你在整个表达式求值完成之前就能安全地断定条件为真，就不需要再对剩余部分求值了。


    逻辑 AND 仅当与其相关的两个条件都为真时才为真。这就是它的定义。只有 true && true 为真，其他情况都为假。只有当左侧已经为真时，你才需要查看右侧。


    在 JavaScript 中，你可以在布尔表达式中放置任何语句，JavaScript 会帮你进行转换。例如，你可以将布尔条件与逻辑 AND 以及函数调用组合在一起。只有当条件为真时，函数调用才会被执行。这与
    if 语句的行为相同。只有当条件为真时，代码块才会被执行。如果条件为假，代码块被跳过。


    ## 使用逻辑 OR 进行短路求值


    ![](img/522b962b8325a030575a3d72d330a848_49_0.png)


    对逻辑 AND 有效的技巧同样适用于逻辑 OR。OR 和 AND 之间的唯一区别是 OR 代表语句中的否定条件。


    逻辑 OR 只要表达式至少有一侧为真即为真。如果左侧已经为真，就不需要评估右侧。但如果左侧为假，仍然需要检查右侧。如果你现在将布尔条件与逻辑 OR 以及函数调用组合在一起，你得到的行为正好与检查否定条件的
    if 语句相同。只有当否定检查为真时（即实际条件为假），代码块才会被执行。不过，对这两个技巧有一句忠告：它难以阅读。许多 JavaScript 开发者使用它时自以为很聪明，但实际上并非如此。这通常是代码压缩工具用来减小代码体积的技巧，但
    if 语句远比这种捷径更具可读性。


    ## Array.copyWithin


    ![](img/522b962b8325a030575a3d72d330a848_50_0.png)


    copyWithin() 是数组上的高性能方法。它是专门为类型化数组设计的，旨在尽可能快地在数组内部执行复制操作。


    在某些情况下，比如处理图形（2D、3D）或矩阵数学时，使用可变数据并快速复制数据是有意义的。


    在这种情况下，使用 copyWithin() 比自己手动复制数据要好得多。


    ## 代理（Proxies）


    ![](img/522b962b8325a030575a3d72d330a848_51_0.png)


    代理是一种包装对象。代理的行为、气味、外观都像它包装的对象。然而，在底层，代理允许开发者注入任意逻辑。这种注入通过所谓的"陷阱"（trap）来工作。陷阱是一种特殊的函数，对特定事件作出反应。例如，get
    陷阱在对象上的任何属性被访问时触发，set 陷阱在给属性赋值时触发。开发者还可以为代理实现许多其他陷阱。所有这些使得开发者能够向对象注入高级逻辑，而这些对象甚至不需要知道它们正在被增强。例如，你可以生成代理，在对象状态改变时自动将状态同步到数据库。这是
    ORM 的基本功能。


    ## Void 运算符


    ![](img/522b962b8325a030575a3d72d330a848_52_0.png)


    曾经有一段时间，undefined 是可以被重新定义的。是的，这是真的。然而，如今 undefined 就是 undefined，保持不变。


    但在当时，一旦 undefined 被重新定义，只有一种方法可以获取它：使用 void 运算符。


    该运算符将任何东西都转换为 undefined，无论它是什么。


    如今，void 运算符只剩下少数几个使用场景：


    - 1. 确保无论函数如何更改其返回类型，你都能得到 undefined

    - 2. 阻止浏览器跟踪由 JavaScript 组成的 href 的链接


    第二种情况仍然非常合理。如果你在链接的 href 标签中放置 JavaScript 代码，并想用 onclick 处理程序来处理实际的导航，你应该在该代码前使用
    void。否则，大多数浏览器会加载一个新页面，显示纯 JavaScript 代码。


    ## 如何检查一个数字是否为 2 的幂


    ![](img/522b962b8325a030575a3d72d330a848_53_0.png)


    可能没有多少场景真的需要检查一个数字是否为 2 的幂。但有一件事让这个技巧非常有价值：它展示了了解事物的工作原理可以带来巨大收益。


    在这种情况下，你可以利用二进制数字的一个特性。一个 2 的幂的数字总是这样的：

    10 (2)

    100 (4)


    现在我们来看看减 1 会发生什么：

    01 (1)

    011 (3)


    你可以永远继续这个规律，你会发现它始终遵循相同的模式。如果你现在对这些数字对使用二进制 AND，结果将始终为 0。这使得实现你上面看到的算法变得超级简单。

    '
