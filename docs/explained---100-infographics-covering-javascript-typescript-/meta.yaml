  md: '# Promise.race vs Promise.any


    ![](img/522b962b8325a030575a3d72d330a848_24_0.png)


    You have probably already used Promise.all() to collect multiple Promises and
    wait until they all finish. The Promise object itself holds more static utility
    methods, though.


    Promise.race() is a method that takes multiple Promises and waits exactly until
    one Promise settles. It doesn''t care whether that Promise rejects or fulfills.
    If the Promise succeeds, you get the value. If it rejects, an error is thrown
    that you can catch.


    Promise.any also takes multiple Promises and waits for the first Promise to settle
    successfully. Even if 9 out of 10 Promises are rejected, and only the last one
    settles successfully, you''ll get the result of the successful one. Only if all
    Promises reject, Promise.any() throws an AggregateError.'
