    *   学校根据特定情况决定是否停课。如果道路结冰但没有盐，则停课。如果有盐，则不停课。无论是否有盐，只要积雪超过 2 英寸，就停课。


    *   一个计算机芯片控制儿童是否可以观看特定的电视节目。如果时间在下午 5 点之前，电视总是可以播放。但如果时间在下午 5 点之后，则根据节目分级决定。如果分级为“普通观众”，则电视可以播放；如果分级为“成人观众”，则电视无法打开。


    # 循环


    循环是一组重复执行一定次数的指令。大多数情况下，会执行某个过程，并且有一个计数器每次增加 1。在过程结束时，我们检查计数器是否超过了需要执行的次数。如果达到了所需次数，则停止循环。


    例如，假设你想在屏幕上打印数字 1 到 10。那么使用一个从 1 计数到 10 的循环，每次将计数打印到屏幕上。


    在 JavaScript 中，我们使用一个名为 `FOR` 的函数来实现这个循环。


    下面我们来看一个简单的例子。


    ## 示例 #1


    ![Image](img/image55.png)


    在这个函数中，我们创建了一个函数 `printotwenty`，用于打印从 1 到 20 的数字。标题为“Print To 20”的按钮会激活该函数。


    函数中有一个 `for` 循环：


    ```

    For (i=1;i<=20; i++)

    ```


    上面这行代码表示循环从 1 运行到 20，每次增加 1。


    `Document.write` 每次打印 `i` 的值。


    下面是结果：


    ![Image](img/image56.png)


    点击按钮后，我们得到：


    ![Image](img/image57.png)


    按计划打印了 1 到 20。接下来，我们将对同一个程序做一个不同的版本。不再只是打印 1 到 20，而是让你选择要打印多少个数字。只需在文本框中输入循环的长度，它就会打印出来。


    ## 示例 #2


    ![Image](img/image58.png)


    现在，运行程序后，我们得到：


    ![Image](img/image59.png)


    现在点击 **“Print Loop Length”**


    ![Image](img/image60.png)


    它打印了从 1 到 50。如果你想打印 1 到 100，则在文本框中输入 100 并点击同一个按钮。


    上面的程序多了一个文本框和一个按钮。文本框用于接收循环的长度，按钮链接到一个名为 `printlooplength()` 的函数，该函数打印星形循环。变量
    `looplength` 存储你在文本框中输入的值。`FOR` 循环从 1 运行到 `looplength`。在上面的例子中，`looplength` 是
    50，所以它从 1 运行到 50。每次运行时，它使用 `document.write` 函数打印计数器。


    ## 示例 #3


    现在，我们要用循环做一些更酷的事情。我们将根据循环长度打印一个星形图案。


    ![Image](img/image61.png)


    ![Image](img/image62.png)


    输出如下：


    ![Image](img/image63.png)


    输入 20 并点击“Print Star Loop”后，我们得到：


    ![Image](img/image64.png)


    上面的程序多了一个文本框和一个按钮。文本框用于接收星形循环的长度，按钮链接到一个名为 `looplengthstar()` 的函数，该函数打印星形循环。


    `looplengthstar()` 是一个嵌套的 `FOR` 循环，意味着它内部还有一个循环。变量 `looplength` 存储你输入的星形循环长度。第一个
    `FOR` 循环从 1 运行到 `looplength`。因此，在上面的例子中，第一个循环从 1 到 20。在这个循环内部，还有另一个 `FOR` 循环。第二个循环基本上在一行中打印
    `*`。它打印 `*` 的次数取决于第一个循环中的计数器。


    例如，如果第一个循环的计数器是 5（`i=5`），那么第二个循环打印星号 5 次，像这样——`*****`。


    因此，每次第一个循环递增并换行时，第二个循环都会执行这个操作。


