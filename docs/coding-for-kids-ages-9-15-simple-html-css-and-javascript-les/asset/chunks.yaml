    <form id="form1">


    输入姓名： <input name="Enter Name" type="text" id="name" size="20"><br>


    输入最喜欢的爱好： <input type="text" id="hobby" size="20"><br>


    输入年龄： <input type="number" id="age" size="20"><br>


    </form>

    ```


    HTML 代码创建了一个包含三个表单元素的表单，分别用于姓名、爱好和年龄。它们的长度均为 20 像素。它们通过 id 引用，id 分别为 name、hobby
    和 age。


