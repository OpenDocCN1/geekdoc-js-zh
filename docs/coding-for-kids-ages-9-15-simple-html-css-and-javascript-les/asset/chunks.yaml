    \n```\nIF (George==\"Hungry\")\n{\nIF (George==\"Has Money\")\n{\nDocument.write('Buy\
    \ George a Snack');\n}\nELSE\n{\nDocument.write('Make George a Snack');\n}\n}\n\
    ELSE\n{\nDocument.write('No snack for George');\n}\n```\n\nIn the above example,\
    \ the code checks if George is hungry first. If George is hungry then it performs\
    \ a 2^(nd) check. It checks if George has money. If George has money, it prints\
    \ ‘Buy George a snack’. If he’s hungry but doesn’t have money, then print ‘Make\
    \ George a snack’.  \nIf he’s not hungry, then print ‘No snack for George’.  \n\
    This is a simple example of a nested IF ELSE statement in JavaScript.\n\n## NESTED\
    \ IF ELSE LOOP EXAMPLE\n\nIn this example, we are going to take a 4 digit year\
    \ as an input and check if it is a leap year. Now, this is a little more complicated\
