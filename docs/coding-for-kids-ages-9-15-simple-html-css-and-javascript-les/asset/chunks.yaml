    \ is divisible by 2. It prints out that the number is divisible by 2.\n\n```\n\
    else\n{\ndocument.write(number+\" is not divisible by 2\");\n}\n```\n\nAbove section\
    \ of code is activated if number is not divisible by 2. It prints out that the\
    \ number is not divisible by 2.\n\n## Exercises to Practice\n\nYou can copy the\
    \ code above and play around with it. Once you understand the code, you can create\
    \ your own JavaScript HTML functions. Here’s a couple you can try.\n\n*   Write\
    \ a program that takes in school marks in 6 subjects using 6 textboxes. Write\
    \ a JavaScript function that checks the average and then checking if the student\
    \ passes or fails. If the score is less than 60, then the student fails.\n*  \
    \ Write a program that takes in a year and checks if it is a leap year.\n\n# Nested\
    \ Conditional Statements\n\nThese are basically conditional statements within\
    \ conditional statements. These are also called nested loops.  \nLet’s say that\
