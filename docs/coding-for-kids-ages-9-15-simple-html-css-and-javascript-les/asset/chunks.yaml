    # Loops


    A loop is a set of instructions that is repeated a certain amount of times. In
    most cases, a certain process is done and there is a count of the process that
    increases by 1. At the end of the process, we check if the count is over the number
    of times we need the process done. If it has reached the number of times we need,
    then we stop the loop.


    For example, let’s say you want to print the numbers 1 to 10 on the screen. Then
    use a loop which counts from 1 to 10. It prints the count on the screen each time.


    In JavaScript, we use a function called `FOR` to implement this loop.


    We’ll go through a simple example below.


    ## Example #1


    ![Image](images/image55.png)


    In this function we create a function `printotwenty` that prints the numbers from
    1 to 20. The button titled ‘Print To 20’ activates the function.


    In the function there is a `for` loop:


    ```

    For (i=1;i<=20; i++)

    ```


    The line above means that the loop runs from 1 to 20; and it increases by a value
    of 1 each time.


    The `Document.write` prints the value of `i` each time.


    Here’s a look at the results below:


    ![Image](images/image56.png)


    After clicking the button, we get:


    ![Image](images/image57.png)


    Prints 1 to 20 as planned. So, next, we’re going to do a different version of
    the same program. Instead of printing just 1 to 20; we’re going to let you choose
    how many numbers you want to print. Just put the length of the loop in the textbox
    and it will print it out.


    ## Example #2


    ![Image](images/image58.png)


    Now, after running the program, we get:


    ![Image](images/image59.png)


    So, now click **‘Print Loop Length’**


    ![Image](images/image60.png)


    So, it prints from 1 to 50. If you want to print 1 to 100, then enter 100 in the
    textbox and click the same button.


    The program above has an extra textbox and extra button. The textbox is for accepting
    the length of the loop and the button links to a function called `printlooplength()`
    that prints the star loop. The variable `looplength` stores the value that you
    put in the textbox. The `FOR` loop runs from 1 to `looplength`. In the above example,
    `looplength` is 50; so it runs from 1 to 50. Each time it runs, it prints the
    counter using `document.write` function.


    ## Example #3


    Now, we’re going to do something even cooler with loops. We’re going to print
    a star pattern based on the loop length.


    ![Image](images/image61.png)


    ![Image](images/image62.png)


    The output below:


    ![Image](images/image63.png)


    After entering 20, and clicking ‘Print Star Loop’ we get:


    ![Image](images/image64.png)


    The program above has an extra textbox and extra button. The textbox is for accepting
    the length of the starloop and the button links to a function called `looplengthstar()`
    that prints the star loop.


    `looplengthstar()` is a nested `FOR` loop, which means that it has 1 loop within
    the other. The variable `looplength` stores the value of the star loop length
    that you entered. The first `FOR` loop goes from 1 to `looplength`. So, in the
    example above, the first loop is from 1 to 20. So, within that, there is another
    `FOR` loop. The second loop basically prints ‘*’ in one line. The number of times
    it prints `*` depends on the counter in the first loop.


    For example, if the first loop counter is 5 (`i=5`); then the second loop prints
    star 5 times. Something like this –‘*****’.


    So, the second loop does this each time the first loop is increased and moves
    to the next line.


