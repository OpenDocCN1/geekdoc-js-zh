    # 引言


    那是一个阳光明媚的亚特兰大夏日午后；我拿起笔记本电脑，坐在外面的门廊上，准备观看最新一集的《权力的游戏》。当我坐在那把三条腿的椅子上时，感觉后腿有些摇晃。椅腿突然从凳子上脱落，我仰面摔倒在地。听到门廊上传来一声巨响，我的妻子伊莎贝尔和儿子阿纳德都跑了出来。“你没事吧？”伊莎贝尔倒吸一口气问道。我虽然受了惊吓，但并无大碍，伊莎贝尔扶我起来。我走进屋里，喝了杯水让自己清醒过来。令我惊讶的是，透过窗户，我看到
    9 岁的儿子阿纳德正试图弄清楚如何把椅子重新组装起来。他把椅腿装回去，发现椅子仍然摇晃。然后他把螺丝换到另一条完好的腿上，椅子还是摇晃。最后，他用胶水固定住了固定螺丝的滑动装置，椅子竟然神奇地修好了。哇！


    接下来，我们来谈谈贝蒂。我们邻居的女儿贝蒂在社会科学这门课上挣扎了很长时间。她的父母已经习惯了她在这一科目上不及格；每次她拿到“D”时，他们反而松了一口气。所以，可以想象当贝蒂有一天拿回一张显示社会科学得了“A”的成绩单时，他们有多么震惊。是的，贝蒂是个勤奋的女孩，她有些科目确实学得不错；但这样的转变还是出乎意料。然后，贝蒂向父母展示了她过去三个月的社会科学提升计划。她列出了每周要攻克的主题清单，以及如何通过纪录片和小组学习来简化一些较难的主题。她系统地一个主题接一个主题地推进，直到全部解决。


    最后，我们来说说卡尔。卡尔在高中开始时是一名网球运动员。他比对手矮小得多，也弱得多。结果，他在第一次锦标赛中输得很惨，甚至很难拿到几分。虽然他很沮丧，但他意识到自己的失败并非因为缺乏技巧，而是由客观条件造成的。他分析了情况，意识到自己需要提高球技和场上的位置感。他分析了对手在场上的移动，并调整自己的击球，始终让他们失去平衡。他做了大量的瑜伽和其他拉伸练习，以提高灵活性、平衡性和速度。他开始月复一月地进步。每个月，他练习一种不同的击球方式。几年后，他长高了，变得更强壮、更魁梧。由于他的努力，他比对手技术更娴熟。在高中三年级时，他几乎毫无悬念地赢得了年度锦标赛。


    所有这些情况都是假设的，可能源于某些孩子天生的特质。此外，编程并不能保证你一定能学到这些技能。但是，所有这些情况都展示了可以在编程过程中学到的技能。阿纳德系统地检查了椅子和它的不同部件，并逐一排查每个部件以找到问题。这与编程中称为“调试”的过程相同。调试是指程序无法正常运行时发生的事情。它需要对代码进行系统分析，以找到问题并使其正常工作。


    贝蒂审视了一个问题，并将其分解为达成结果所需的不同部分。这与编程中的问题解决类似。这就是理解解决编程问题需要什么，并将代码结构化为不同部分以使程序工作。


    卡尔在做和贝蒂同样的事情；他将一个问题分解成不同部分，以便用简单的方式解决。但除此之外，他还在网球场上对不同技能进行了优先级排序。他花时间弄清楚哪些技能对击败对手更重要，并优先练习这些技能。在代码被正确结构化之后，优先级排序是编程中的一项重要技能。程序员希望优先处理代码中更关键的任务，以便先进行测试。


    所有这些技能对编程都至关重要；如果你的孩子学会了如何很好地编程，他们就应该掌握这些技能。他们是否成为程序员并不重要。这些技能将使你的孩子终生受益。编程还有助于提高孩子的基础数学和阅读能力，同时增强逻辑和解决问题的能力。


    这些技能，加上他们在高中学到的沟通技巧，正是软件工程师在美国（截至 2018 年）年薪中位数达到 112,000 美元的原因。这比美国平均工资的两倍还多。


