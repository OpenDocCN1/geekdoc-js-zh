    尽管如此，世界各地的中学，甚至是在富裕地区，都缺乏处理这项任务的人员和技术资源。根据 Tech Republic 在 2000 年对 K-12 教师进行的一项调查，只有
    8% 的教师有足够的信心教孩子编程。美国有 50% 的孩子在家无法上网。对于美国的女孩和有色人种儿童来说，统计数据更糟；他们拥有的资源和可仰慕的榜样更少。


    因此，你需要亲自着手处理这件事。


    ## 不要做什么


    你可能想知道需要做什么才能开始。有几件事我建议你不要做。我建议不要聘请没有教孩子经验的程序员。他们是该领域的专家；但他们开始编程已经几十年了；因此，他们无法理解一个从未学过编程、还在学习基础数学的孩子。接下来要避免的是寻找最新的
    JavaScript 教科书，然后读给你的孩子听。这些书对于学习编程来说，就像字典对于学习语言一样有用。它们价格昂贵，更适合作为现有程序员的参考工具。我还建议不要参加编程训练营。这些可能对少数学生有效；但大多数学生会在学习的大群体中迷失方向。一对一的关注才是入门的最佳方式。


    ## 入门的第一步


    这本书是最好的入门方式。我将编程分解为一系列基础章节，并将其与现实世界联系起来。第一章将帮助你设置 JavaScript 和 HTML 文件，以便你开始学习。


    我还为每一章提供了代码，你可以复制粘贴并运行。代码的每个方面都得到了很好的解释；并且我有一些练习，你可以利用本章中的概念自己完成。


    在书的末尾，我还推荐了一位一对一的导师，以及一些你可以用来扩展知识的额外书籍。


    # 设置工作区


    ## 你需要什么


    一台笔记本电脑/台式电脑


    网络连接


    已安装的网页浏览器（Firefox、Chrome 或 Internet Explorer）


    ## 下载并安装 Notepad++


    下载最新版本的文本编辑软件。我推荐 Notepad++。你可以从以下链接下载最新版本：


    [`notepad-plus-plus.org/downloads/`](https://notepad-plus-plus.org/downloads/)


    ## 如何开始使用 Notepad++


    从桌面或开始菜单打开 Notepad++


    ![Image](img/image1.png)


    打开 Notepad++ 后，转到 **文件>新建** 以打开一个新文件。


    ![Image](img/image2.png)


    ![Image](img/image3.png)


    现在，点击 **文件>另存为**，然后选择 **.html** 作为文件类型


    ![Image](img/image4.png)


    ![Image](img/image5.png)


    这样可以确保你可以在像 Firefox 或 Chrome 这样的 HTML 浏览器中运行你的程序。


    ## 测试程序


    有一个简单的方法来测试程序，看看它是否连接到你的浏览器。


    只需在你的文件中输入随机文本。在我的文件中，我输入了 **“Testing 1,2,3……”**


    然后点击 **文件>保存**。


    之后，点击 **运行>在 Firefox/Chrome/IE 中启动**，具体取决于你使用的浏览器。


    如果一切正常，你输入的文本应该会显示在浏览器窗口中。


    ![Image](img/image6.png)


    ![Image](img/image7.png)


    ![Image](img/image8.png)


    ## 结果：


    ![Image](img/image9.png)


    我知道这对某些人来说可能是一个简单的测试；但在我们开始实际编程之前，确保一切正常是很重要的。


    注意


    在某些电脑上，**文件>运行** 不起作用。


    如果是这种情况，请执行以下操作：


    *   将 Notepad++ 文件保存为 .html 文件，然后关闭 Notepad++。

    *   转到文件所在的文件夹。

    *   双击文件以打开它。


    # HTML 简介


    ## 什么是 HTML？


    HTML 代表超文本标记语言


    HTML 是人类用来与 Chrome、Internet Explorer、Firefox 等网页浏览器进行连接的语言。


    有时，它会得到 CSS 和 JavaScript 的辅助；但网页的基本结构是由 HTML 定义的。


    它非常简单易懂，即使是编程初学者和年幼的孩子也能掌握。


    HTML 使用看起来像箭头两端的简单标签来完成。


    ## HTML 标签示例


    以下是 HTML 标签的样子：


    `<p>` - 标签示例


    每个 HTML 标签都有一个额外的标签来表示该标签的结束。结束标签除了有两个标签端之外，还包含一个斜杠。请参见下面的简单示例。


    `<p>` - 标签开始


    `</p>` - 标签结束


    ## 基本 HTML 标签及其用途


    `<html>`


    这是开始每段 HTML 代码的标签。


    `<head>`


    这是在其他任何内容之前首先执行的代码。


    `<title>`


    这是写在浏览器顶部标签栏中的代码。


    `<body>`


    包含页面上显示的信息。


    `<p>`


    用于正文中出现的段落文本。


    `<h1>`、`<h2>`、`<h3>`、`<h4>`、`<h5>`、`<h6>`


    这些用于文本的标题，按大小降序排列。`<h1>` 是最大的标题，`<h6>` 是最小的。


    `<strong>`


    用于加粗文本


    `<ul>`


    用于无序列表，例如项目符号列表


    `<li>`


    用于在一行文本前添加项目符号图标


    `<ol>`


    用于有序列表，例如从 1、2、3…… 编号的项目


    `<div>`


    这些是较大的内容区块；通常包含多个段落、标题等。


    `<a>`


    用于创建超链接文本。超链接是指当你点击一段带下划线的文本时，它会链接到另一个页面。


    `<img>`


    用于向网页添加图像。


    现在，你可能会觉得要学的东西很多。别担心。你现在不需要记住任何内容。


    只需在编码时将其作为参考即可。


    我们将通过一些示例来更好地解释一切。


    ## HTML 示例：


    ![Image](img/image10.png)


    以下是相同的代码：（你可以复制粘贴）


    ```

    <html>

    <head>

    <title>向 HTML 问好......</title>

    </head>

    <body>

    <h1>欢迎来到你的第一个 HTML 网站</h1>

    <h2>是时候开始了....</h2>

    <p>嗨。我叫鲍勃。我很兴奋能学习如何编程一个网站。以下是我们将要学习的一些内容。</p>

    <ul>

    <li>HTML 基础</li>

    <li>CSS</li>

    <li>JavaScript</li>

    </ul>

    </body>

    </html>

    ```


    ## 我们得到的输出如下


    ![Image](img/image11.png)


    让我们将输出与代码中的标签联系起来。


    ![Image](img/image12.png)


    ![Image](img/image13.png)


    ## 练习实践


    1.  创建一个介绍你自己的 HTML 网站。创建一个标题标签，内容为“介绍”。使用 h1 和 h2 标签为自己创建一个标题。然后创建一个段落，在其中介绍你自己、你的年龄、学校和家乡。最后，创建一个关于你爱好的项目符号列表。


    2.  创建一个介绍你最喜欢的运动队或电视节目的 HTML 网站。创建一个标题标签，内容为该节目/运动队的名称。使用 h1 和 h2 标签创建一个标题。然后创建一个段落，在其中谈论你为什么喜欢这个队伍/电视节目以及它们为什么如此出色。最后，创建一个关于你最喜欢的球员/节目中人物的项目符号列表。


    # 灯泡示例 - HTML


    ## 这个项目做什么


    这是一个简单的 HTML 项目，它创建了一个按钮，可以打开/关闭页面上的灯泡。我们将使用两张灯泡图片来实现这一点。按钮将在两张图片之间切换。


    ## 本章需要理解的概念


    对于这个示例，我们需要理解按钮标签和图像标签。


    按钮标签


    `<button onclick=动作 >按钮文本</button>`


