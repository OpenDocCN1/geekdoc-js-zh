    ## 表单 HTML 标签格式


    下面是一个表单 HTML 标签的示例，用于输入姓名、职业和性别。


    ![Image](img/image19.png)


    运行程序后，输出如下所示。你可以在输出中的空白框内输入任何内容。这些空白框也称为文本框。


    ![Image](img/image20.png)


    ## 表单 HTML 标签的不同部分


    `<form id="form1">`


    表单 id 标签是表单的名称，将在代码的其余部分中用作引用。


    姓名：


    职业：


    年龄：


    这是写在框左侧的文本。用于向用户描述框中应输入的内容。


    `input type="text”`


    这意味着你在框中输入的是文本或字符串类型。例如，姓名和职业使用文本，因为你在框中输入的是字母。


    `input type="number"`


    这意味着你在框中输入的是数字。例如，年龄和电话使用数字，因为输入的全部是数字。


    `id="name"`


    `id="occupation"`


    `id="gender”`


    id 是框在程序其余部分中的名称。我们将在程序其余部分中使用 id 来引用该框。


    `size="20"`


    这意味着框的长度为 20 像素。要更改此设置，请更改 size 的值。例如，如果要将框的长度加倍，请将 size 改为 40。


    # JavaScript 示例


    ## 什么是 JavaScript？


    JavaScript 是一种高级编程语言。它最常用于在 HTML 页面上执行用户操作。


    它还有助于增强用户在网页上的交互。


    ## 如何在 HTML 中使用 JavaScript


    在 HTML 页面上使用 JavaScript 有两种方法：


    第一种方法是将 JavaScript 代码直接包含在 `<script>` 标签内。如下所示：


    ```

    <html>


    <head>


    <title> </title>


    </head>


    <body>


    <script>


    </script>


    </body>


    </html>

    ```


    JavaScript 代码将位于上面红色显示的两个 script 标签之间。


    第二种方法是创建一个 JavaScript 文件，并将其保存为 .js 文件。然后在 HTML 代码中引用该 JavaScript 文件。如下所示：


    ```

    <html>


    <head>


    <title> </title>


    </head>


    <body>


    <script src="newfile.js"></script>


    </body>


    </html>

    ```


    你将把所有 JavaScript 代码包含在 `newfile.js` 文件中。


    ## 你需要了解的 JavaScript 术语


    接下来我们将介绍几个 JavaScript HTML 代码示例。我们需要了解以下术语才能理解代码。


    `function`


    JavaScript 函数是执行任务的任意一组代码行。函数通常用于执行在单击 HTML 按钮时需要发生的任务。每个函数都有一个名称，并在 HTML 代码中被引用。示例如下：


    `function abcd()`


    `abcd` 是执行特定任务的函数的名称。它将在 HTML 代码中被引用为 `abcd`。


    `变量`


    变量用于在 JavaScript 中存储名称或数字。可以将其视为一个可以存储一个值的盒子。每次需要该值时都会引用该盒子。定义如下：


    `var flag=1;`


    `flag` 是变量的名称，它存储值 1。因此，每当在 JavaScript 程序中引用 `flag` 时，它的值都是 1（除非你更改了 `flag` 的值）。`flag`
    的这个值可用于定义其他变量。例如：


    `var king=flag*2;`


    现在 `king` 的值为 1*2=2。因此，变量是处理未知数量的好方法。


    `document.getElementbyID().value`


    这个 JavaScript 术语用于获取 HTML 表单文本框中某个项的值。因此，如果你在表单文本框中填写了姓名并单击按钮，`document.getElementbyID()`
    会获取你在框中输入的值。例如：


    `var yname=document.getElementById("name").value;`


    “name” 是在 HTML 中定义的表单文本框的 id。要了解如何在 HTML 中实现这一点，请查看上一章中关于 HTML 标签的部分。


    在文本框中输入的任何内容都将存储在一个名为 `yname` 的变量中。从现在起，它将在 JavaScript 中被引用为 `yname`。


    `Document.write()`


    此函数用于在 Web 浏览器上打印任何内容。


    例如，


    `document.write(“xyz”);`


    在屏幕上打印 **xyz**


    你还可以使用“+”按钮添加两个不同的术语。


    `document.write(“xyz”+”123”);`


    在屏幕上打印 **xyz123**。


    当你想要将文本添加到变量时，这非常有用。例如：


    `var yname=document.getElementById("name").value;`


    `document.write(“My name is “+yname);`


    如果你在文本框中输入了“Matt”，它会在屏幕上打印 **“My name is Matt”**。


    `parseint()`


    `parseint` 将数字转换为整数，无论它是否是小数。例如，


    `parseint(2.8)` 等于 3。


    `Parseint(2)` 就是 2。


    `parsefloat()`


    `parsefloat()` 与 `parseint()` 相反。它将数字转换为小数。例如，


    `parseint(2)` 等于 2.0


    `Parseint(3.1)` 就是 3.1


    ## JavaScript 示例 1


