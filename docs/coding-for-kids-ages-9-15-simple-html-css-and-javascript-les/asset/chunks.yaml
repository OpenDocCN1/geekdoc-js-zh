    # Linking Multiple Web Pages


    Now, you have a web page set up with CSS linked up. But you may notice that the
    web page switches back to the original design when you click the Find Substring
    button. This is because the JavaScript section is not linked to the webpage yet.


    To refresh your memory, the code we are talking about takes in a string and prints
    a substring based on the preference of the user. The user specifies the start
    and end of the substring. Here’s the code below:


    ![Image](images/image97.png)


    As you can see the code is linked to the style.css sheet to get the current design.


    So, we get an output below:


    ![Image](images/image100.png)


    Now, let’s run the program:


    ![Image](images/image102.png)


    On clicking, Find Substring, we get:


    ![Image](images/image103.png)


    As you can see, it reverts back to the old design. Now, let’s fix this. We just
    add the below code to the Javascript function before document.write.


    Document.write(''<link rel="stylesheet" type="text/css" href="styles.css" />'');


    This code basically writes the stylesheet onto the Javascript function.


    So, the code becomes:


    ![Image](images/image104.png)


    After adding the line and running the same program with the same text, we get:


    ![Image](images/image105.png)


    So, that’s great, we have the JavaScript output with the same css. Now, you might
    want to create another substring. How do we do that? We need a Home button.


    Let’s create that. The code below helps with that.


    ![Image](images/image106.png)document.write("<br>") creates a space after the
    substring and moves to the next line.


    document.write(''<button class = "btn home" onClick="redirect()">Home</button>'');


    The above line creates a button that implements the redirect function on clicking.


    We create a function that redirects the user to our original webpage.


    function redirect()


    {


    window.location.replace("strcomma.html");


    }


    Strcomma.html is the name of the file. So it basically restarts the file.


    Alright, now lets run the program. After doing so and using the same text, we
    get:


    ![Image](images/image107.png)


    After clicking Home, we get:


    ![Image](images/image108.png)


    So, now we know how to get back to the original webpage.


    There is another way to link web pages; which is used when you create two separate
    web pages. Let’s say you want to add a link from Page A on Page B.


    So, in Page B you would add the link using:


    <a href=”PageB.html”>


    We can also link any external web pages using the same html code:


    <a href=[www.google.com](http://www.google.com)>


    ## Exercises to Practice:


    You can copy the above examples and once you are able to run them and understand
    the code; you can try a few of the problems below.


    *   Add a home button and link your best css design to every web page that you’ve
    designed in this book.


    *   Create a program that links to external web pages based on user preference.


    # Math Functions


    This is amazing so far. But what if you want to make a mini calculator? Or teach
    math to kids? Learning how to code Math functions is a great way to also increase
    the pace at which your kids understand Math. You can set up Math tests for your
    kids and verify them with JavaScript functions.


    Let’s get started with some basic Math functions that we can implement in JavaScript.


    Math.Round()


    Math.Round() rounds a decimal number to the nearest whole number. For example,
    Math.Round(1.635) rounds to 2; while Math.Round(1.43) rounds to 1


    Math.ceil()


    Math.ceil() round to the higher number. It basically rounds up to the higher whole
    number. For example, Math.ceil(1.67) returns 2; while Math.ceil(2.01) returns
    3.


    Math.floor()


    Math.floor() rounds to the lower whole number. It basically removes the decimal
    points from a decimal number. So, Math.floor(1.47) returns 1; and Math.floor(2.34)
    also returns 2.


    Math.Sqrt()


    Math.Sqrt() returns the square root of a number. So, Math.sqrt(9) returns 3; while
    Math.sqrt(16) returns 4.


    Math.min()


    Math.min() returns the minimum value of an array. Just put the array inside the
    bracket. So, if


    a=[13,11,34,54,9];


    Math.min(A) returns 9


    Math.max()


    Math.min() returns the maximum value of an array. So for the above example, Math.max(A)
    returns 54.


    Math.Random()


    Math.Random() is a cool function. It returns a random decimal number between 0
    and 1; not including 1.


    So, Math.Random() could include 0.95 the first time and 0.43 the second time.


    So, you could play a guess the number game between 0 and 10\. Just do this below:


    **Math.Round(Math.Random()*10)** gives you a random whole number between 0 and
    10.


    # Conclusion


    Thank you for taking the team to read this book.'
