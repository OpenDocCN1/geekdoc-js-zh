    ```\nelse\n{\ndocument.write('Sum of two numbers is greater than or equal to 15');\n\
    }\n```\n\nThe above loop activates if the sum is greater than 15 and prints out\
    \ ‘Sum of two numbers is greater than or equal to 15.’\n\n## IF ELSE Loop – Example\
