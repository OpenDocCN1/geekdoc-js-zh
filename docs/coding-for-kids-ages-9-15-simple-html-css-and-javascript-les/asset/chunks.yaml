    \ HTML 代码。\n\n`body{}`\n\n定义 HTML 代码主体部分的样式。\n\n`.btn{}`\n\n设置网页中任何按钮的样式。你需要在\
    \ HTML 代码中为按钮定义一个名为 `btn` 的类。具体示例请参见上面的代码。\n\n`.btn:hover{}`\n\n设置当鼠标悬停在网页按钮上时按钮的样式。\n\
    \n`background-color:`\n\n网站的背景颜色。\n\n`text-decoration:`\n\n用于为文本添加装饰，例如波浪线、点线、曲线等。\n\
    \n`text-transform:`\n\n用于将整个单词或单词的一部分转换为大写或小写。\n\n`text-align:`\n\n可以将文本对齐到页面的左侧、右侧或中间。\n\
    \n`color:`\n\n设置页面上文本的颜色。\n\n`padding:`\n\n设置页面边缘与文本/按钮元素之间的间距。\n\n`line-height:`\n\
    \n设置文本的行高。\n\n`font-family:`\n\n设置你想要用于文本的字体类型。\n\n`font-size:`\n\n设置字体的大小。\n\n\
    `font-weight:`\n\n可以在需要时将字体设置为粗体。\n\n这些是我们将在示例中使用的一些 CSS 属性。但是，还有成千上万的 CSS 属性可用于各种不同的目的。如果你想了解更多，可以在这里查看：\n\
    \n[`www.tutorialrepublic.com/css-reference/css3-properties.php`](https://www.tutorialrepublic.com/css-reference/css3-properties.php)\n\
    \n那么，让我们来看一个 CSS 文件的示例：\n\n## CSS 示例\n\n![Image](img/image98.png)\n\n在 CSS 代码的\
    \ html 和 body 部分中，文本被设置为居中对齐并转换为大写。距离顶部 100 像素，颜色为黑色，行高为 1。字体为粗体，字号为 20 像素。页面背景为青色（浅蓝色）。\n\
    \n按钮有单独的 CSS 设置。按钮背景为深红色（红色），文本为黑色。文本距离顶部 10 像素，距离两侧 24 像素。文本居中对齐，字号为 16 像素。\n\
    \n当鼠标悬停在按钮上时，按钮背景变为午夜蓝（蓝色），文本变为白色。\n\n下面我们可以看到它的效果。让我们从两个角度查看我们的网站：一次是在应用 CSS\
    \ 之前；一次是在链接 CSS 文件之后。\n\n输出（无 CSS）：\n\n![Image](img/image99.png)\n\n输出（有 CSS）：\n\
    \n![Image](img/image100.png)\n\n输出（有 CSS 且鼠标悬停在按钮上）：\n\n![Image](img/image101.png)\n\
    \n如你所见，这对网站的视觉吸引力产生了巨大影响。你可以自己自定义所有这些元素，为文本、背景和按钮使用不同的颜色。\n\n## 练习实践：\n\n你可以复制上面的示例，一旦能够运行并理解代码，就可以尝试下面的一些问题。\n\
    \n*   修改样式元素，找到最适合你的元素。尝试 5 种不同的颜色字体、不同的文本大小和不同的文本形式，找到最好看的网站。\n\n*   使用 `style.css`\
    \ 文件为你迄今为止编写的所有程序创建一个样式表。\n\n# 链接多个网页\n\n现在，你已经建立了一个链接了 CSS 的网页。但你可能注意到，当你点击“查找子字符串”按钮时，网页会切换回原始设计。这是因为\
    \ JavaScript 部分尚未链接到网页。\n\n为了唤起你的记忆，我们讨论的代码接收一个字符串，并根据用户的偏好打印一个子字符串。用户指定子字符串的起始和结束位置。代码如下：\n\
    \n![Image](img/image97.png)\n\n如你所见，代码链接到了 `style.css` 样式表以获取当前设计。\n\n因此，我们得到以下输出：\n\
    \n![Image](img/image100.png)\n\n现在，让我们运行程序：\n\n![Image](img/image102.png)\n\n\
    点击“查找子字符串”后，我们得到：\n\n![Image](img/image103.png)\n\n如你所见，它恢复到了旧的设计。现在，让我们修复这个问题。我们只需在\
    \ JavaScript 函数中的 `document.write` 之前添加以下代码。\n\n`Document.write('<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"styles.css\" />');`\n\n这段代码基本上将样式表写入了 JavaScript\
    \ 函数。\n\n因此，代码变为：\n\n![Image](img/image104.png)\n\n添加这一行后，使用相同的文本运行相同的程序，我们得到：\n\
    \n![Image](img/image105.png)\n\n太好了，现在我们得到了带有相同 CSS 的 JavaScript 输出。现在，你可能想要创建另一个子字符串。该怎么做呢？我们需要一个“主页”按钮。\n\
    \n让我们创建它。下面的代码可以帮助实现这一点。\n\n![Image](img/image106.png)\n\n`document.write(\"<br>\"\
    )` 在子字符串之后创建一个空格并换行。\n\n`document.write('<button class = \"btn home\" onClick=\"\
    redirect()\">Home</button>');`\n\n上面的代码创建了一个按钮，点击时执行 `redirect` 函数。\n\n我们创建一个函数，将用户重定向到原始网页。\n\
    \n```\nfunction redirect()\n{\n    window.location.replace(\"strcomma.html\");\n\
    }\n```\n\n`strcomma.html` 是文件名。因此它基本上重新启动了该文件。\n\n好了，现在让我们运行程序。执行后，使用相同的文本，我们得到：\n\
    \n![Image](img/image107.png)\n\n点击“主页”后，我们得到：\n\n![Image](img/image108.png)\n\n\
    现在，我们知道了如何返回原始网页。\n\n还有另一种链接网页的方法；当你创建两个独立的网页时可以使用。假设你想在页面 A 上添加一个指向页面 B 的链接。\n\
    \n那么，在页面 B 中，你可以使用以下方式添加链接：\n\n`<a href=\"PageB.html\">`\n\n我们也可以使用相同的 HTML 代码链接任何外部网页：\n\
    \n`<a href=\"http://www.google.com\">`\n\n## 练习实践：\n\n你可以复制上面的示例，一旦能够运行并理解代码，就可以尝试下面的一些问题。\n\
    \n*   添加一个主页按钮，并将你最好的 CSS 设计链接到本书中设计的每个网页。\n\n*   创建一个程序，根据用户偏好链接到外部网页。\n\n# 数学函数\n\
    \n到目前为止，这一切都很棒。但如果你想制作一个迷你计算器呢？或者教孩子数学？学习如何编写数学函数也是提高孩子理解数学速度的好方法。你可以为孩子设置数学测试，并使用\
    \ JavaScript 函数进行验证。\n\n让我们从一些可以在 JavaScript 中实现的基本数学函数开始。\n\n`Math.Round()`\n\
    \n`Math.Round()` 将十进制数四舍五入到最接近的整数。例如，`Math.Round(1.635)` 四舍五入为 2；而 `Math.Round(1.43)`\
    \ 四舍五入为 1。\n\n`Math.ceil()`\n\n`Math.ceil()` 向上取整。它基本上向上舍入到较大的整数。例如，`Math.ceil(1.67)`\
    \ 返回 2；而 `Math.ceil(2.01)` 返回 3。\n\n`Math.floor()`\n\n`Math.floor()` 向下取整。它基本上去掉十进制数的小数部分。因此，`Math.floor(1.47)`\
    \ 返回 1；`Math.floor(2.34)` 也返回 2。\n\n`Math.Sqrt()`\n\n`Math.Sqrt()` 返回一个数的平方根。因此，`Math.sqrt(9)`\
    \ 返回 3；而 `Math.sqrt(16)` 返回 4。\n\n`Math.min()`\n\n`Math.min()` 返回数组中的最小值。只需将数组放在括号内。例如，如果\n\
    \n`a=[13,11,34,54,9];`\n\n`Math.min(A)` 返回 9。\n\n`Math.max()`\n\n`Math.max()`\
    \ 返回数组中的最大值。因此对于上面的示例，`Math.max(A)` 返回 54。\n\n`Math.Random()`\n\n`Math.Random()`\
    \ 是一个很酷的函数。它返回一个介于 0 和 1 之间的随机十进制数，不包括 1。\n\n因此，`Math.Random()` 第一次可能返回 0.95，第二次返回\
    \ 0.43。\n\n所以，你可以玩一个猜数字游戏，范围在 0 到 10 之间。只需执行以下操作：\n\n`Math.Round(Math.Random()*10)`\
    \ 会给你一个介于 0 和 10 之间的随机整数。\n\n# 结语\n\n感谢你抽出时间阅读本书。\n\n"
