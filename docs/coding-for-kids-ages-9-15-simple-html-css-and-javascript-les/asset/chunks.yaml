    \ JavaScript program that takes in 5 different student names and hobbies and prints\
    \ out names and hobbies of those students.\n\n# Conditional Statement\n\n## What\
    \ is the conditional statement?\n\nIt is a statement that checks if a certain\
    \ condition is true. It can be as simple as checking if a number is less than\
    \ 10 to something as checking medical samples from patients for certain medical\
    \ conditions.  \nIn JavaScript, the conditional statement is done using IF ELSE\
    \ statements.  \nSo, it basically checks that if something is true, then perform\
    \ an action. If it’s not true, then do something else. As an example,\n\n```\n\
    IF (George==\"Hungry\")\n{\nDocument.write('Give George a Snack');\n}\nELSE\n\
    {\nDocument.write('No snack for George');\n}\n```\n\nIn the above example, the\
