    Despite this, high schools all over the world, even in affluent areas, lack the
    staff and technical resources to handle this task. According to a 2000 K-12 teacher
    survey done by Tech Republic, only 8% of teachers felt reasonably confident to
    teach children programming. 50% of kids in America do not have access to the internet
    at home. The statistics are even worse for girls and children of color in America;
    who have less resources and role models to look up to.


    So, you need to take to take this into your own hands.


    ## What Not To Do


    You might be wondering what you need to do to get started. There’s a couple of
    things I advise against doing. I would advise against hiring a programmer who
    has no experience in teaching kids. They are experts in the topic; but it’s been
    decades since they started programming; so, they can’t relate to a kid who hasn’t
    learnt programming before and who’s learning basic Mathematics. The next thing
    to avoid is to search for the latest textbook on JavaScript; and read it out for
    your kid. These are as useful for learning programming; as a dictionary is for
    learning a language. They are expensive, and more useful as a reference tool for
    existing programmers. I also recommend against coding camps. These can work for
    a minority of students; but most students get lost in the large group of kids
    that are learning. One to one attention is the best way to get going.


    ## First Steps to Get Started


    This book is the best way to get started. I’ve broken down programming into a
    series of basic chapters; and relate it to the real world. The first chapter will
    help you set up your JavaScript and html files for you to get started.


    I also have code for every chapter that you can copy and paste to get working.
    Every aspect of the code is well explained; and I have exercises that you can
    complete yourself with the concepts in the chapter.


    I also have a recommended one on one tutor at the end of the book; and additional
    books you can use to build on your knowledge.


    # SET UP WORKSPACE


    ## What You Need


    A Laptop/Desktop Computer


    Internet Connection


    Web browser installed (Firefox, Chrome or Internet Explorer)


    ## Download and Install Notepad++


    Download the latest version of a text editing software. I recommend Notepad++.
    You can download the latest version below:


    [https://notepad-plus-plus.org/downloads/](https://notepad-plus-plus.org/downloads/)


    ## How to Start using NotePad++


    Open Notepad++ from your Desktop or Start Menu


    ![Image](images/image1.png)


    Once NotePad++ is open, go to File>New to open a New File.


    ![Image](images/image2.png)


    ![Image](images/image3.png)


    Now, click **File>Save** As and choose **.html** as the file type


    ![Image](images/image4.png)


    ![Image](images/image5.png)


    This ensures that you can run your program on a html browser like Firefox or Chrome.


    ## Test Program


    There’s a simple way to test the program and see if it connects to your browser.


    Just type in random text in your file. In my file, I’ve typed **“Testing 1,2,3……”**


    Then click **File>Save**.


    After that, click **Run>Launch in Firefox/Chrome/IE** depending on which browser
    you are using.


    If it is working, the text that you typed in should show in the browser window.


    ![Image](images/image6.png)


    ![Image](images/image7.png)


    ![Image](images/image8.png)


    ## Result:


    ![Image](images/image9.png)


    I know that it may be a simple test for some; but it is important to make sure
    that everything is working before we get on to actual programming.


    Note


    In some computers, **File>Run** does not work.


    If this is the case, please do the following:


    *   Save the Notepad++ file as a .html file, and close Notepad++.

    *   Go the folder where the file is located.

    *   Double click the file to open the file.


    # Intro to html


    ## What is html?


    Html stands for Hyper Test Markup Language


    Html is the language that humans use to connect with web browsers like Chrome,
    Internet Explorer, Firefox etc.


    Sometimes, it is assisted by css and JavaScript; but the basic structure of a
    web page is defined by html.


    It is pretty simple and easy to grasp for even beginners to programming and young
    kids.


    Html is done using simple tags that look like the ends of an arrow.


    ## Example of a html tag


    Here’s what a html tag looks like:


    `<p>` - Example of a tag


    Every html tag has an extra tag that signals the end of the tag. The ending of
    a tag has a slash in it in addition to the two ends of a tag. See below for a
    simple example.


    `<p>` - Tag starts


    `</p>` - Tag ends


    ## Basic html tags and What They’re Used For


    `<html>`


    This is the tag that starts every piece of html code.


    `<head>`


    This is the code that is executed first before anything else.


    `<title>`


    This is the code written in the top ribbon of the browser.


    `<body>`


    Includes the information that appears on the page.


    `<p>`


    This is used for a paragraph of text that appears on the body.


    `<h1>`, `<h2>`, `<h3>`, `<h4>`, `<h5>`, `<h6>`


    These are used for headings on text in descending order of size. `<h1>` is the
    largest size heading, and `<h6>` is the smallest.


    `<strong>`


    This is used to bold text


    `<ul>`


    This is used for unordered lists such as bulleted items


    `<li>`


    Used to add a bullet icon before a line of text


    `<ol>`


    This is used for unordered lists such as items number from 1,2,3…


    `<div>`


    These are larger sections of content; that generally contain several paragraphs,
    headings, etc.


    `<a>`


    This is used to hyperlink text. Hyperlink is what happens when you click on a
    piece of underlined text and it links to another page


    `<img>`


    This is used for adding images to a web page.


    Now, you might be wondering that it’s a lot to learn. Don’t worry. You don’t need
    to memorize any of it for now.


    Just use it as a reference for when you code.


    We’re going to go through an examples that will explain everything better.


    ## Html example:


    ![Image](images/image10.png)


    Same code below: (that you can copy and paste)


    ```

    <html>

    <head>

    <title>Greeting to html......</title>

    </head>

    <body>

    <h1>Welcome to your first html website</h1>

    <h2>Time to get started....</h2>

    <p>Hi. My name is Bob. I am excited to learn about programming a website. Here''s
    a few things we will learn.</p>

    <ul>

    <li>Basics of html</li>

    <li>CSS</li>

    <li>JavaScript</li>

    </ul>

    </body>

    </html>

    ```


    ## Here’s What We Get as An Output


    ![Image](images/image11.png)


    And let’s link the output to the tags in the code.


    ![Image](images/image12.png)


    ![Image](images/image13.png)


    ## Exercises to Practice


    1.  Create a html website that introduces yourself. Create a title tag that says
    ‘Introduction’. Create a headline for yourself using a h1 and h2 tag. Then create
    a paragraph where you talk about yourself, your age, school, and hometown. Then
    finally, create a bulleted list of your hobbies.


    2.  Create a html website that talks about your favorite sports team or TV show.
    Create a title tag that says the name of the show/sports team. Create a headline
    using a h1 and h2 tag. Then create a paragraph where you talk about why you like
    the team/TV show and why they are so awesome. Then finally, create a bulleted
    list of your favorite players/people on the show.


    # The Bulb Example - html


    ## What This Project Does


    This is a simple html project that creates a button that can switch a light bulb
    on the page on/off. We are going to use two bulb images to make this happen. The
    button will switch between the two images.


    ## Concepts to Understand for this Chapter


    We’ll need to understand button tags and image tags for this example.


    Button Tag


    `<button onclick=Action >Button text</button>`


    The button element has two elements. An Action and Button Text. The Button Text
    is the text that shows on the button; and the Action is what happens when the
    user clicks on the button


    Image Tag


    `<img id=ImageId src=ImageUrl  style=ImageSize>`


    The Image Tag has three elements.


    The ImageId is the name you assign to the image. This name is used to reference
    the image in the code.

