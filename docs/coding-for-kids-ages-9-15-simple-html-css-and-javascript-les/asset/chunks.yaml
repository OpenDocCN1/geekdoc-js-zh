    那么，既然我们知道如何查找字符串的长度，让我们利用这个知识来反转你的名字。下面的代码实现了这一点。


    ![Image](img/image77.png)


    下面的代码让你通过文本框输入你的名字。当你点击按钮时，它会运行`namereverse()`函数，反转你的名字。


    `Name2`存储你输入的名字值


    `len`存储你名字中的字母数。


    然后我们创建一个循环，从`len-1`运行到 0。我们使用 0 的原因是`name2`是一个字母数组。在 JavaScript 中，数组的第一个索引是 0。所以第一个字符是`name2[0]`。


    在循环中，我们向后遍历，每次计数减 1。并且在循环内部，我们打印由计数索引的字符的值。


    现在，让我们运行程序：


    ![Image](img/image78.png)


    点击**Name Reverse**按钮后，我们得到


    ![Image](img/image79.png)


    现在，如果字符串末尾有很多空格怎么办？让我们通过修剪字符串来解决这个问题。


    ## 分割字符串


    现在，你知道吗，你可以将字符串分割成元素数组。你可以使用`split`函数来实现这一点。现在，让我们尝试一个示例。在下面的代码中，你将一个包含 3 种动物的列表（用逗号分隔）作为输入输入到文本框中。


    `split`函数将其分割成一个包含 3 个元素的数组，你可以使用`document.write`函数打印出每个元素。


    ![Image](img/image80.png)


    现在，让我们看看输出：


    ![Image](img/image81.png)


    点击**Get Animals**按钮后，我们得到：


    ![Image](img/image82.png)


    上面的代码适用于输入 3 种动物的情况。你可能会问，是否有代码可以处理超过 3 种动物的情况？是的，可以。你需要使用`length`函数找到字符串数组的长度，然后在打印动物时使用
    FOR 循环。在 for 循环中，我们使用`aninumber`来跟踪动物数量；使用`aniarray[i]`来跟踪要打印的实际动物。


    注意，`aninumber`总是比`i`大 1，因为在 JavaScript 数组中`i`从 0 开始。


    下面是代码：


    ![Image](img/image83.png)


    下面是输出。![Image](img/image84.png)


    我们输入 5 种动物的名称，然后点击**Get Animals**按钮。


    ![Image](img/image85.png)


    ## 替换字符串


    现在，假设你有一个长段落，想要将某个特定单词替换为另一个单词。你可以使用`.replace`函数。


    在下面的示例中，我们将“Atlanta”替换为“Charleston”。请记住，这仅适用于一个“Atlanta”实例。


    我们使用一个名为`textarea`的 HTML 表单元素。`Textarea`是文本框的更大形式，可以接受用户的多行文本。然后我们在屏幕上写出修改后的句子。


    ![Image](img/image86.png)


    现在，让我们运行程序。


    ![Image](img/image87.png)


    一旦我们点击**Fix Sentence**按钮，我们得到：


    ![Image](img/image88.png)


    ## 子字符串与字符串索引


    在继续之前，我想讨论另外几个字符串操作技巧。它们是字符串索引和子字符串。


    字符串索引给出另一个字符串在某个字符串中出现的位置。例如，字符串“The boy climbed the tree”中“boy”的字符串索引是 4，因为“boy”从整个字符串的第
    4 个字符开始。


    子字符串允许你提取现有字符串的一部分。例如，在同一个字符串“The boy climbed the tree”中；如果我们从 6 到 10 取子字符串，我们会得到“oy
    cl”，因为这些是第 6 到第 10 个字符。


    现在，让我们看下面的示例：


    ![Image](img/image89.png)


    在上面的示例中，`daydesc`是大字符串，`str`是我们需要查找字符串索引的字符串。变量`ind`存储字符串索引的值，然后我们使用`document.write`打印答案。现在，让我们运行程序：


    ![Image](img/image90.png)


    一旦我们点击**Find Index**，我们得到：


    ![Image](img/image91.png)


    好的，现在让我们看一个子字符串的示例：


    ![Image](img/image92.png)


    在上面的代码中，`strnum1`和`strnum2`是存储子字符串第一个和最后一个元素的变量。这些是用户的输入。


    `sstr`是从`strnum1`到`strnum2`的子字符串，并打印在屏幕上。


    ![Image](img/image93.png)


    一旦我们点击**Find SubString**，我们得到答案：


    ![Image](img/image94.png)


    如果包括空格，上面的答案是 10 个字符。


    ## 练习实践：


    你可以复制上面的示例，一旦能够运行并理解代码，就可以尝试下面的一些问题。


    *   编写一个程序，找出在文本框中输入的较大字符串中，某个特定字符串出现了多少次？


    *   编写一个程序，接收一个包含姓名、数学成绩、英语成绩、物理成绩和地理成绩的字符串。使用`split`函数分割字符串，并找出该人的平均分。例如，“Mark,
    90, 34, 56, 65”将找出 Mark 的 90、34、56、65 的平均分。


    *   提示：你可以使用`parseint()`将成绩转换为数字。


    # CSS 简介


    ## 什么是 CSS？


    CSS 代表层叠样式表。CSS 用于设置网站的设计和样式——包括字体、颜色、布局、阴影和配色方案。它们与 HTML 和 JavaScript 配合得很好。


    ## 如何在 HTML 网站中使用 CSS


    使用 CSS 的最佳方式是创建一个单独的 CSS 文件，并在 HTML 头部文件中引用它。


    现在，让我们创建一个 CSS 文件。


    *   打开一个空白的 Notepad++文档。


    *   点击“另存为”，选择文件类型为“CSS”。让我们将此文件命名为`style`


    ![Image](img/image95.png)


    ![Image](img/image96.png)


    *   点击“保存”


    *   转到相关的 HTML 文件，并在头部文件中包含下面这一行。


    *   `<link rel="stylesheet" href="style.css" />`


    *   （可选）如果你想包含任何按钮 CSS 元素，你需要像下面这样定义一个按钮类：


    `<button class ="btn str" onclick="substr()">Find SubString</button>`


