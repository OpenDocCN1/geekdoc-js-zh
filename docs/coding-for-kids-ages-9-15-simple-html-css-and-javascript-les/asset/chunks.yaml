    \ that accepts two numbers, with ids of `num1` and `num2`.\n\n```\n<button onclick=\"\
    sum()\">+</button>\n<button onclick=\"subtract()\">-</button>\n<button onclick=\"\
    multiply()\">*</button>\n<button onclick=\"divide()\">/</button>\n```\n\nThe above\
    \ code creates 4 buttons. Each of the 4 buttons activates the functions `sum()`,\
    \ `subtract()`, `multiply()` and `divide()`.\n\n```\nfunction sum()\n{\nvar number1=parseFloat(document.getElementById('num1').value);\n\
