    **Indexes in SQL**


    If you have to find data quickly in your table, you are going to want to use an
    index. An index is going to save time because you are not going to have to read
    through everything in order to find the one thing that you are looking for. It
    is much like the index you find in books!


    An index is going to be used whenever you try to locate data from a particular
    table. In the event that you have not created an index, then SQL is going to read
    through the entire table before it finds what you are looking for, which is not
    only time-consuming, but it can give you results that you are not looking for.
    The goal with an index is to have it created in such a way that you are able to
    go straight to what you are looking for in a couple of minutes, not hours.


    Here are just several reasons as to why you are going to want to create an index.


    1.It can cover multiple columns


    Sometimes you know what you are looking for is in a general area, and with that,
    you can use an index to cover just those columns.


    2.Indexes and integer data types


    The integer data type is not going to take up as much room as some of the data
    types; therefore, searching integers is faster. In the event that what you are
    looking for does not have an integer on your index, you will want to think about
    putting in a temporary integer so that all the data you are putting in your index
    for that column is mapped.


    3.An index needs to be kept narrow


    The closer you create your index, the less room it will take up, so the less time
    SQL is going to spend trying to search for the information you are wanting. The
    less room that is used, the faster the data base is going to run.


    4.The order of your columns is utterly important


    Sometimes and an index has to cover several columns. When this happens, you have
    to keep your columns in order, or else, you are going to cross data over into
    an area where it does not belong. Try and keep yourself focused as you begin with
    the column that ranks lowest on your scan working your way up to the one that
    holds the highest priority. The level of your column will depend on how many values
    are located in that column.


    5.Ensure your column is not marked as null before you make your index


    Columns that are marked as null does not need to be in your index. So, only put
    the columns that have been marked as not null so that processing takes less time
    and you are able to work with a faster system.


    6.Indexes should only be created when they are needed


    If you can get away without a guide, then do it! Indexes, just like everything
    else, take up space on the SQL disk making it to where commands you use end up
    returning results slower than normal. Being that indexes do not have any rules
    set into place as to how they should be built or when they should be constructed,
    the creation of an index is going to be a process that continues to change until
    a process can be found that works.


    **Constructing an index statement**


    The purpose of an index is meant to make SQL code run faster than before. This
    is done by making it to where queries do not scan the entire table or data base
    unless necessary.


    The syntax for creating an index is as follows:


    CREATE INDEX “index_title” ON “table_title” (column_title);


    The downside of an index is that it can only cover a single table. Many indexes
    are only going to cover a single column however while composite indexes cover
    several columns at once.


    While you create your index, you are going to notice that there are no rules that
    you are going to have to follow as to what the index is titled or what is placed
    in the index. Therefore, your index is going to be completely unique to you and
    the data that you are putting in it. It is a good plan to attempt to add in as
    much information as you can so you do not get confused which table or columns
    you are working with. Keep in mind, however, the bigger the index, the more disk
    space it will take up.


