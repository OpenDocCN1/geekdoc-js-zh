    ### 2. Construct data base connections

    right click on the connection on the left of the screen and click on new connection.
    You will need to title the connection whatever it is that you want. You will need
    to enter the user title and password for it. You should change the color if you
    are going to be working with multiple connections at once. For the role, you are
    going to change the role if you are using a system connection title. You can leave
    the home host alone if you are using your home computer. However, if you are using
    a different location, you will need to input the IP address for where the system
    is going to be running. Leave your part alone, and xe should be left alone unless
    you are not working with an express edition of SQL. You can test the connection,
    and if it is successful, you can close the connection down, and you have created
    your connection. If everything is correct, it is going to open with no errors,
    and you are going to be able to put in SQL code.


    ### 3. Disabling features

    there are a lot of features that SQL offers, and if you do not use them, then
    you should disable them so that they are not slowing down the developer. You will
    go to the tools menu and go down to the features option. Each feature has different
    folders; it is up to you to decide which features you want to keep running and
    which ones you want to disable. You can expand each folder down so that you are
    able to see what each folder contains. All you are going to do is uncheck the
    feature, and it will turn that feature off and cause the system to start to run
    faster. Be sure that you are going to apply the changes so that they are not turning
    themselves back on without you turning them on yourself.


    ### 4. Executing commands and scripts

    use the tool bar that is at the top of the developer and press the play button.
    Make sure that you have added in your semi-colon. You can also use `ctrl` and
    `enter` so that you do not have to pull your hand off the keyboard. To run a script,
    you are going to use the toolbar again, just select run scripts, so you run both
    commands. Or, press the `F5` key if that is easier for you. Should your file be
    external use the `@` sign and the path file to import it and run it.


