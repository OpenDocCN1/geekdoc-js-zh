    ## 第一章：什么是 SQL？


    ![logo](img/00003.jpeg)


    `SQL` 代表结构化查询语言（structured query language）。当你正在进行编程或尝试管理 `RDBMS`（关系型数据库管理系统）内部的数据时，你将会使用这种领域特定语言。


    `SQL` 起源于数学，包括关系元组关系演算代数和关系代数。它将包含大量的数据定义、操作以及控制语言。


