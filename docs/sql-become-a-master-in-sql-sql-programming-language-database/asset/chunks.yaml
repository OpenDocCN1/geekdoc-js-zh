    ### SQL Injections

    At any point in time that you or someone else gets onto a website, data is taken
    from their computer and sent through the site, leaving yourself open to what is
    known as SQL injection, which can end up wiping out all of the work that you have
    put into your code. An injection typically occurs at the point in time that you
    ask a user to place some type of data into a prompt box that turn out to be literals.
    However, you will not necessarily get the information that you are wanting. Instead,
    you could end up getting a statement that is going to run through your data base,
    and you are not going to know that this occurred. Users cannot be trusted to give
    you the data that you are requesting, so you need to make it to where the data
    that they enter is looked at before it is sent through your data base. This is
    going to help secure your data base.


    Your function calls are going to be used when you are trying to pull a particular
    record off of the data base from the table requested when you are working with
    that title for that column. The data is usually going to end up matching what
    you have received from the user making it to where you are able to keep your data
    base safe.


    With `MySQL`, queries are not allowed to be carried or stacked into a single call
    function. This helps in keeping calls from failing due to the queries being stacked.
    Extensions such as `SQLite` however, do allow for your queries to be stacked as
    you do your searches in that one string. This is where safety issues come into
    play with your code and your data base.


