    **Duplicates in Your SQL Code**


    It does not necessarily happen on purpose, but there are times that records end
    up being duplicated on the table you are working with or within the data base.
    When you are searching for duplicate records, rather than waste time trying to
    find all of the duplications, it is going to be simpler for you to go through
    and locate the ones that are unique.


    To deal with duplications, you are going to be working with the select statement,
    and the keyword you have to keep in mind is distinct. This is going to make it
    to where you can remove any records that are duplicated so that only the unique
    ones remain.


    Syntax


    SELECT DISTINCT column 1, column 2 , ….. columnN


    FROM table_title


    WHERE [condition]


    Sometimes these are going to be duplicated in your code because people are going
    to live in the same town, be the same age, so on and so forth. These are things
    that you do not have any control over, but you have to work with regardless.


    By using the distinct keyword, you are going to be getting rid of all of the other
    records that contain this same information, but you are going to be keeping the
    one that has the information that you are looking for. So, when you are using
    this code, you have to be careful not to delete a record that you may be wanting
    to use.


    Also, ensure that you either have the data backed up in another location or that
    you have a recent save point so that you can go back to what the table originally
    was just in case you accidentally mess up.


    The distinct keyword is one of those that you are going to want to use with caution
    because you can end up losing hours of work that you do not need to or not want
    to lose, and therefore, you are not going to be working efficiently. Remember,
    SQL is supposed to make your job more efficient, not more challenging.


    **Chapter 16**


    ![logo](images/00003.jpeg)


    **SQL Injections**


    At any point in time that you or someone else gets onto a website, data is taken
    from their computer and sent through the site. You are going to be able to take
    this same data and place it in the data base for SQL; however, it is going to
    be risky to do this due to the fact that you will be leaving yourself open to
    what is known as SQL injection, which can end up wiping out all of the hard work
    that you have put into your SQL code.


    An injection typically occurs at the point in time that you ask a user to place
    some type of data into a prompt box before they are able to continue. However,
    you will not necessarily get the information that you are wanting. Instead, you
    could end up getting a statement that is going to run through your data base,
    and you are not going to know that this has occurred.


    Users cannot be trusted to give you the data that you are requesting, so you need
    to make it to where the data that they enter is looked at before it is sent through
    your data base for validation. This is going to help secure your data base from
    any injections that may occur. Most of the time you are going to use pattern matching
    to look at the data before sending it to your data base.


    Your function calls are going to be used when you are trying to pull a particular
    record off of the data base from the table requested when you are working with
    that title for that column. The data is usually going to end up matching what
    you have received from the user making it to where you are able to keep your data
    base safe from injections.


    With MySQL, queries are not allowed to be carried or stacked into a single call
    function. This helps in keeping calls from failing due to the queries being stacked.


    Extensions such as SQLite however, do allow for your queries to be stacked as
    you do your searches in that one string. This is where safety issues come into
    play with your code and your data base.


    **Preventing an SQL injection**


    Escaped characters are meant to be handled inside of the programming languages
    such as Perl or PHP. With MySQL, there is an extension however that enables you
    to use PHP so that the proper function is being used with the escaped characters.
    This extension makes these characters unique just to MySQL.


    **Like quandary**


    When dealing with like quandary, you have to have an escape method in order to
    change the characters that the user inserts into your prompt box that turn out
    to be literals. The addslashes function allows for you to make sure that you are
    specifying the range of characters that are needed by the system in order to escape.


    **Chapter 17**


