    ### 2. 构建数据库连接

    右键点击屏幕左侧的连接并点击“新建连接”（new connection）。你需要根据自己的意图为连接命名。你需要输入相应的用户名和密码。如果你打算同时处理多个连接，应该更改其颜色。如果你使用的是系统连接标题，则需要更改角色（role）。如果你使用的是本地电脑，可以保持本地主主机（home
    host）不变。但是，如果你在其他位置使用，你需要输入系统运行的 IP 地址。除非你使用的不是 SQL Express 版（express edition），否则请保持
    part 和 xe 选项不变。你可以测试连接，如果成功，就可以关闭连接窗口，这样你就已经创建了连接。如果一切正常，它将无错误地打开，你就可以输入 SQL 代码了。


    ### 3. 禁用功能

    SQL 提供了许多功能，如果你不使用它们，应该将其禁用，以免减慢开发者的速度。你需要进入“工具”（tools）菜单，然后选择“功能”（features）选项。每个功能都有不同的文件夹；由你决定想要保留哪些功能的运行，以及禁用哪些功能。你可以展开每个文件夹以查看其包含的内容。你只需要取消勾选某个功能，它就会关闭该功能并使系统运行得更快。务必应用更改，以免它们在没有你手动开启的情况下重新开启。


    ### 4. 执行命令和脚本

    使用开发者顶部的工具栏并按下播放按钮。确保你已经添加了分号。你也可以使用 `ctrl` 和 `enter`，这样你的手就无需离开键盘。要运行脚本，请再次使用工具栏，只需选择“运行脚本”（run
    scripts），即可同时运行两个命令。或者，如果你觉得更方便，也可以按 `F5` 键。如果你的文件是外部的，请使用 `@` 符号和文件路径进行导入并运行。


