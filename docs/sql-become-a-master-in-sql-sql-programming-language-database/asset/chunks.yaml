    ### Cloning a Table in SQL

    It may not be often, but there may be times that you encounter a problem where
    you are expected to have a copy of your table. While you can recreate the table
    by making a new table and re-enter all of the data, that is not going to be efficient.
    Instead, to save time, you can just clone the table. This also ensures that you
    are not going to place any data in the wrong place or accidentally leave it out.


    As you clone tables with `MySQL`, you need to keep three things in mind:

    1. When copying an entire table, you are going to use the `insert` and `select`
    statements.

    2. The `create table` command will cause the table to look exactly like the table
    that you are copying looks.

    3. Make sure you change the title of the table that you are cloning so that you
    are not getting tables mixed up when you are working on them.


