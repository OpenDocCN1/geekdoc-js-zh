    ## Select statements


    A select statement will let you search the data base for a very specific piece
    of information that you want to find. You are going to have the option of using
    one of five clauses. However, the one clause that you will most likely stick to
    is the from clause.


    Syntax for a select statement:


    ```sql

    SELECT [ ALL [ DISTINCT] column 1 [, column 2] FROM table 1 [, table 2] [WHERE
    “conditions”] [GROUP BY “column-list”] [HAVING “conditions] [ORDER BY [“column-list”
    [ASC [DESC] ]

    ```


