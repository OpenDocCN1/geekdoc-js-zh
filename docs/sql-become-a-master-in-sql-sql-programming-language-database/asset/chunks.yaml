    **Introduction**


    ![logo](images/00003.jpeg)


    Congratulations on downloading *SQL: Programming Beginner’ Guide*, and thank you
    for doing so.


    The following chapters will discuss various things that you need to know in order
    to use SQL properly and make your job easier. SQL is supposed to make it to where
    you are not working as hard at your job, and if it is used correctly, then it
    will do just that!


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every endeavor was made to ensure it is full of as much useful information
    as possible. Please enjoy!


    **Chapter 1**


    ![logo](images/00003.jpeg)


    **What Is SQL?**


    SQL stands for structured query language. This language is a domain-specific language
    that you are going to use if you are programming or trying to manage data inside
    of an RDBMS (relational database management system).


    SQL was started with math, both tuple relational calculus and relational algebra.
    There is a lot of data definitions and manipulations along with control language
    that is going to be inside of SQL. SQL involves the use of things such as delete,
    update, insert, and query.


    In essence, you are going to be able to update, delete, insert, and search for
    the things that you are going to be putting into the program. It is very common
    for SQL to be described as a declarative language. However, the program also allows
    for procedural elements.


    This is one of the first languages that was able to use the relational model that
    was created by Edgar F. Codd. Although it is not going to work with all of the
    rules that are set forth for this example, it is one of the most widely used languages
    for data bases.


    In 1986, SQL became part of the ANSI. Then, in 1987, it became part of the ISO.
    However, there have been updates since then that have made it to where the language
    can include larger sets. Just keep in mind that the code for SQL is not going
    to be 100 percent portable between data bases unless there are some adjustments
    to the code so that it fits the requirements for that data base.


    Learning SQL can be one of the better decisions that you make about your career
    because you can push yourself forward with it that way that you can rely on using
    your own knowledge rather than having to go to someone else for their knowledge.
    In fact, people are going to be coming to you to learn what it is that you know
    about the program.


    By learning SQL, you are going to be able to do more than you may have been able
    to before. Here are a few points that are going to give you a good reason as to
    why you should learn SQL.


    **Money**


    Learning SQL makes it to where you have the opportunity to earn some extra money.
    Developers that work with SQL make around $92,000 a year! An administrator for
    an SQL data base is going to make about $97,000 a year. So, just learning SQL
    makes it to where you are able to earn around twice as much as what the average
    American household is going to make in a year.


    **Highly sought after**


    Employers want people who know SQL! The more knowledge that you have about SQL,
    the more sought after you are going to by employers. Knowing SQL is not only going
    to benefit you but your employer as well because they are not going to have to
    pay for you to learn the program. The interviewing process is going to be better
    than any other process that you have gone through, and you may find that they
    are going to be willing to give you more money just for knowing SQL over the other
    person. With SQL knowledge, you are going to be opening yourself up for more careers
    than you might have been able to apply for before.


    **Get answers**


    SQL is going to give you the answers that you are looking for to any questions
    that you may have about business or data that is being stored inside of your data
    base. Therefore, you are going to be more self-sufficient and not as dependent
    on others when it comes to business. If you are able to answer questions on your
    own so that you are not stopping someone else from doing their job, then an employer
    is going to be able to save money by hiring you because you are going to be able
    to answer questions on your own rather than having to mess with hiring someone
    else to solve those issues. Knowing SQL is even going to help you if you want
    to start your own business or push your business that you have already started
    to the next step that has just been out of your reach.


    **More stable than Excel**'
