    \n## Introduction\n\n![logo](images/00003.jpeg)\n\nCongratulations on downloading\
    \ `SQL: Programming Beginner’ Guide`, and thank you for doing so.\n\nThe following\
    \ chapters will discuss various things that you need to know in order to use `SQL`\
    \ properly and make your job easier. `SQL` is supposed to make it to where you\
    \ are not working as hard at your job, and if it is used correctly, then it will\
    \ do just that!\n\nThere are plenty of books on this subject on the market, thanks\
    \ again for choosing this one! Every endeavor was made to ensure it is full of\
    \ as much useful information as possible. Please enjoy!\n\n## Chapter 1: What\
