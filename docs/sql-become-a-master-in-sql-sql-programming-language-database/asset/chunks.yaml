    When you are using Excel for significant amounts of data, you may notice that
    it is too much for the program, and therefore, the program tends to crash. A crash
    leads to lost data and extra time that you are going to have to go in and fix
    anything that may be wrong or entering data that was not saved. SQL is going to
    be much more reliable for you to use when you are trying to work with large quantities
    of data, and it is going to save you some time working with it because it is not
    going to require too much for you to work with the processes that SQL offers.


    ## Making reports


    Searching in `SQL` is relatively easy, and you can reuse that search when you
    have to double check to make sure that the data in the data base is accurate.
    Excel does not give you the proper processes that you need to get ahold of the
    data that you want to get ahold of.


    `SQL` coding only has to be written once and saved, and then, it is going to run
    each time that you need it. This is yet another way that `SQL` makes it to where
    your life is easier because you are not having to take up as much time trying
    to get the data that you need.


    Do not think that `SQL` is going to be simple. It is complicated and is going
    to take a lot of time to learn, but the more effort that you put into it, the
    more it is going to pay off for you. You are going to not only be saving money
    by learning `SQL`, but you are going to be increasing what you will be able to
    make with `SQL`.


    ## Chapter 2


    ![logo](images/00003.jpeg)


    ## SQL Basics


    The first thing that you have to learn about `SQL` before you are able to use
    it is to know what the basics of it are. Understanding the `SQL` syntax is going
    to make it to where you are going to have the ability to manage data bases better
    in `SQL` without worrying about if you are messing something up. If you have worked
    with Excel before, then you know a little about `SQL` due to the fact that `SQL`
    has columns and rows just like what you would use in Excel.


    ### Syntax


    * Data base: all of the tables that you have created with `SQL`.

    * CRUD: the four basic operations that you are going to be able to do with `SQL`
    – Creating, Reading, Updating, and Deleting.

    * Query: the search you are going to run when looking for something in `SQL`.

    * Foreign key: this key is going to find any data that is on your table in order
    for you to match it to the primary key that you have put into a different table.

    * Primary key: this is a unique value that all records you create are going to
    use for you to identify them. If you do not set one up, then one will automatically
    be generated.

    * Table: the collection of data in `SQL` and where it is located.

    * DBMS: data base management system.

    * Syntax: words and phrases that you will use to create statements.

    * RDBMS: relational data base management system.


    Now, you may look at `RDBMS` and `DBMS` and wonder what the difference is. The
    difference is going to be how the data that you have put on the table is going
    to be stored. With a `DBMS` table, the data is not on the table, but in a file.
    When you are using `SQL`, you are going to work with `RDBMS` more than you will
    `DBMS`.


    A primary key is going to create a more complex code. Foreign keys are going to
    be specific to a single table and are going to pull data from one record to another
    when you are doing your searches.


    `SQL` works with three programs – `SQL`, `MySQL`, and `Oracle`. Because of this,
    the code that you use in `SQL` is going to have three different choices depending
    on which application you are working with. Some of the code that you use will
    work with just one program, or it can collaborate with all three. Double check
    which commands are going to be able to work with which program so that you are
    working with the program that is easiest for you rather than complicating things
    for yourself.


    ## Chapter 3


    ![logo](images/00003.jpeg)


    ## SQL Syntax


    Even if you have knowledge of other programming languages, `SQL` is going to be
    different. You may find that there are some rules that you know from other languages,
    but do not assume that you are going to be doing the same thing with `SQL` that
    you would with a program such as `Python`.


    Any statement you create with `SQL` is going to begin with a very particular set
    of keywords so that the system knows what you are attempting to do. Do not forget
    that you are going to need to end all of your statements with a semicolon.


    Your keywords are going to be `create`, `show`, `use`, `insert`, `select`, `update`,
    `alter`, `drop`, and `delete`.


    You should remember that `SQL` is case insensitive, so if you use `select` versus
    `SELECT`, it is going to do the same operation. `MySQL`, however, is going to
    require that you are accurate with the table names as they have been created in
    the data base, or else, you could be pulling up a different table than what you
    need to work with.


    All of the following syntax is going to work with `MySQL` and is going to contain
    statements and clauses that you are going to use when working with `SQL`.


    Syntax:


    Select statement:

    ```

    SELECT column1, column2… column

    FROM table_name;

    ```


    Distinct clause

    ```sql

    SELECT DISTINCT column1, column2… column

    FROM table_name;

    ```


    Where clause

    ```sql

    SELECT column 1, column2…column

    From table_name

    WHERE CONDITION;

    ```


    And/Or clause

    ```sql

    SELECT colmn1, column2… column

    FROM table_name

    WHERE CONDITION 1 {AND | OR} CONDITION 2 ;

    ```


    In clause

    ```sql

    SELECT column1, colun2… column

    FROM table_name

    WHERE column_ame IN (val-1, val-2);

    ```


    Between clause

    ```sql

    SELECT column1, column2… column

    FROM table_name

    WHERE column_name BETWEEN val-1 AND val-2;

    ```


    Like clause

    ```sql

    SELECT column1, column2… column

    FROM table_name

    WHERE column_name LIKE PATTERN;

    ```


    Order by clause

    ```sql

    SELECT colun1, column2… column

    FROM table_name

    WHERE CONDITION

    ORDER BY column_name {ASC | DESC};

    ```


    Group by clause

    ```sql

    SELECT SUM (column_name)

    FROM table_name

    WHERE CONDITION

    GROUP BY column_name;

    ```


    Create table statement

    ```sql

    CREATE TABLE table_name (

    Column1 datatype,

    column2 datatype,

    column3 datatype,

    … Column datatype,

    PRIMARY KEY (one or more columns )

    );

    ```


    Drop table statement

    ```sql

    DROP TABLE table_name;

    ```


    Create index

    ```sql

    CREATE UNIQUE index_name

    ON table_name ( column1, column2);

    ```


    ## Chapter 4


    ![logo](images/00003.jpeg)


    ## Statements in SQL


    With `SQL`, there are several statements that you are going to be working with.
    These statements are going to be the foundation for what you do with your table.
    Each statement is going to have the ability to do an action that you request in
    one step instead of having to go through and potentially mess up.


    ### Drop table statement


    With drop table statements, you are going to be getting rid of an entire table
    that you have made. But, a lot of times, getting rid of the table causes problems
    elsewhere. However, `SQL` allows you to use drop table statements to avoid these
    issues.


    Syntax:


    ```DROP TABLE "table_title";

    ```


    There will be moments that you are going to get rid of multiple tables at once,
    and to do this, you will need to type out the name of each table that you need
    to dispose of. You can put it in the same code, just separate the table names
    out with commas.


    Sometimes the table you want to get rid of will not actually be located in the
    data base. If this happens, then you are going to get an error message from the
    system. To stop this error, you are going to want to make sure that the table
    exists before you try and delete it. You will modify your code and make it to
    where the data base is searched. Once the data base has been searched, your table
    will be dropped only if the table exists in the data base.


    ### Truncate table statement


    The table structure can be kept in the event that a deletion has to occur; however,
    how do you get rid of the data that is on that table? You still have the option
    of using the drop table statement, but you can use the truncate table statement
    so that only the data is deleted and you do not have to worry about making a new
    table.


    Syntax:


    ```TRUNCATE TABLE "table_title";

    ```

