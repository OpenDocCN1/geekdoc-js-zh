    然而，某些时候你不需要指定值在表中的位置，因为它们可以放在任何有空间的地方。为了这一点，你将使用一种完全不同的语法。


    ```

    INSERT INTO TABLE_NAME VALUES (value1, value2, value3, … valueN);

    ```


    你还可以使用插入查询（insert）将数据从一张表迁移到另一张表，而无需担心是否会漏掉任何信息。


    ### 语法

    ```

    INSERT INTO first_table_ame [( column1, column2, … column)]

    SELECT column1, column2, … columnN

    FROM second_table_name

    [WHERE codition];

    ```


    ### 查询查询 (Select query)

    通过 `select`，你将在数据库的表中定位数据，以便获取返回给你的结果。这些结果将被称为结果集。


    #### 语法：

    ```

    SELECT column1, column2, column FROM table_name;

    ```

    这些特定列的数据将是你想要返回的内容；因此，数据库会执行操作。


    然而，如果你想返回所有字段，将使用这段代码。


    #### 语法：

    ```

    SELECT * FROM table_name;

    ```


    ### 更新查询 (Update query)

    顾名其实，更新将用于更改你正在操作的表中已存在的记录。


    在使用更新查询时，可以使用 `where` 子句，以便修改特定行，而不是更改表中的所有行。


    #### 语法

    ```

    UPDATE table_name

    SET column1 = value1, column2=value2, … columnN = valueN

    WHERE [ condition ];

    ```

    当使用 `or` 和 `and` 算符时，`N` 可以与任何条件配合。


    ### 删除查询 (Delete query)

    每当需要从表中删除记录时，你将使用删除查询。与更新查询一样，你被允许使用 `where` 子句，以便消除指定数量的行，而不是删除表中的所有内容。


    #### 语法

    ```

    DELETE FROM table_name

    WHERE [condition];

    ```

    当你使用 `and` 运算符或 `or` 运算符时，条件可以组合使用。


    ### 结果排序 (Sorting your results)

    `order by` 条件是用于表中数据排序的语句。你有两个选项——可以按升序排列数据，也可以按降序排列。某些数据库会自动按升序排列你的结果，而无需你指示。因此，如果你必须按降序排列，你需要确保已经告诉系统你希望以不同的方式排序。


    从查询获得的结果进行排序的语法对于升序和降序都是相似的。唯一的区别在于你想要排序的顺序。


    #### 语法：

    ```

    SELECT column – list

    FROM table_name

    [WHERE condition]

    [ORDER BY column1, column2, …columnN] [ASC | DESC ];

    ```

    使用 `order by` 子句时可以选择多个列。但是，请确保你选择进行排序的列包含在列列表中。


    # 第 8 章

    ![logo](img/00003.jpeg)


    ### SQL 中的约束 (Constraints in SQL)

    约束是 SQL 系统在处理表列时将执行的各种规则。本质上，你的表对允许进入数据库的不同数据类型进行了限制。使用约束是为了能够确保数据库中拥有准确且可靠的数据。这在你的数据库被他人使用时特别有帮助。


    约束不仅可以限于列，还可以应用于整个表。在处理表列时，约束是 SQL 系统执行的各种规则。以下是常见的约束类型：


    - `Not NULL`：当你使用它时，列不允许空值。

    - `Index`：当你使用它时，会在列上创建索引。

    - `Default`：当你使用它时，如果没有提供值，将使用指定的默认值。

    - `Check`：当你使用它时，它会确保满足某些条件。

    - `Unique`：当你使用它时，它会确保列中的值是唯一的。

    - `Foreign key`：当你使用它时，它用于建立表之间的关系。

    - `Primary key`：当你使用它时，它作为表中的唯一标识符。


    在创建表时，如果你忘记了设置这些约束，可以使用 `alter` 语句来添加它们。


    ### 删除约束 (Dropping constraints)

    尽管约束已经到位，但你仍然可以使用 `drop` 命令来执行删除操作。这取决于你所使用的应用程序。正如书开头提到的，某些实现允许你禁用约束。这不会从数据库中永久删除约束，而是禁用它，以便以后需要时可以使用。可以使用
    `alter` 语句来恢复。


    ### 完整性约束 (Integrity constraints)

    当你想要确保数据是准确且一致的，将使用完整性约束。数据的完整性是贯穿整个数据库的。虽然可以使用多种完整性约束，但你主要使用的是 `foreign key`、`primary
    key` 以及我们在上面的章节中提到的其他约束。


    # 第 9 章

    ![logo](img/00003.jpeg)


    ### SQL 与数学 (SQL and Math)

    通过 SQL 92，你将可以使用大多数编程语言都能使用的四种数学函数：


    - 相乘 `*`

    - 加法 `+`

    - 取模 `%`

    - 减法 `−`

    - 除法 `/`


    当你使用取模运算符时，你将获得从除法函数得到的余数，无论它是否为整数。

    '
- fmt: '

    `MOD(a, b)`: the modulo function will give you an integer for the remainder that
    you got when `a` was divided by `b`.


    `SQRT(a)`: you are going to be the square root of the value you enter into the
    equation.


    `SIGN(a)`: `a` will either give you a `0`, `-1`, or `1`


    `ROUND(a)`: the value you input is going to be rounded to the nearest whole number.


    `ABS(a)`: you are going to receive the absolute value from the integer that you
    input into the data base.


    `ROUND(a, b)`: the integer for `a` is going to be rounded to the closest whole
    number, and value `b` is going to tell it how many times it should be rounded.


    `CEILING(a)` or `CEIL(a)`: the smallest number will be returned to you of greater
    than or equal value to the value of `a`.


    `POWER(a, b)`: `a` will be raised to the value that is in place for `b`.


    `FLOOR(a)`: the larger number will be returned less than or equal to the value
    of `a`.


    # Chapter 10


    ![logo](images/00003.jpeg)


    ## Transactions That You Can Use in SQL


    Transactions are the units that you are going to use against what it was originally
    created for. Units like this are going to be used so that you can accomplish a
    function to make sense of the data base to you or the data base in question.


    However, transactions will be the propagation for all of the changes that have
    been established on the data base. Therefore, at the point in time that you update
    records, you will have a transaction that has been completed on the data base.
    Ensure that you have total control of your data bases so that you have the ability
    to change what is placed in your table so that the data can still maintain its
    integrity and any errors that are thrown out by the data base can be handled in
    the proper fashion.


    Ultimately, you will be clubbing the SQL searches that you do into a group so
    that they are handled at once rather than individually.


    ### Transaction properties


    The word that you want to remember when you are working with transactions is going
    to be `ACID`. This is because of the letters `ACID` all stand for one of the properties
    that you can use with SQL.


    - **A: Atomicity**: the operations that you place into your equation will give
    you a favorable result. However, if the equation fails, then the process you have
    put into place is going to be terminated and any operation done before this is
    going to be void as everything is going to return to its former state.

    - **C: Consistency**: any changes that are made are going to be watched to ensure
    they are being made correctly in order for that transaction to be considered successful.

    - **I: Isolation**: transactions do not have to run together, they can run seperately
    while remaining transparent from other transactions being made on that data base.

    - **D: Durability**: all your transactions should be successful in order to survive,
    this means that they need to be able to withstand any system failures that may
    occur.


    ### Transaction control


    As you are managing your transactions in order to ensure they are successful,
    you are going to be using four different commands.


    - **Set transaction**: you can title your transaction so it can be located easier.

    - **Commit**: all your changes for your transaction will be saved.

    - **Save point**: you will save your transaction and should it have to be rolled
    back due to some error, it will roll back to the last save point.

    - **Roll back**: any changes that have been made will be undone and will go back
    to the last save point.


    You do not have the ability to use `create` or `drop table` commands with transactions
    being that they are standard data base commands. You can still use `delete`, `update`,
    and `insert`.


    ### Commit command


    A `commit` command is going to be used whenever transaction changes have to be
    saved so that your data base is updated with the most recent changes. Essentially
    you are going to be creating a save point so that if you have to roll your data
    base back, it is going to be rolled back to the latest commit point. Hint: use
    your commit code often! You do not want to lose hours of work!


    Syntax:


    ```

    Commit;

    ```


    ### Roll back command


    You can undo changes that you made at any point in time. This is particularly
    effective when you are writing the out code and discover that what you thought
    would work, does not work. All the work that is undone will depend on when the
    last `commit` command was used.


    Syntax:


    ```

    Rollback;

    ```


    ### Save point


    Just like the commit code, the save point code is going to save all of the work
    that you do. You do not want to use this command unless everything is just the
    way that you want it. Once you roll back to the last save point, you will not
    get what you put into the table unless you manually input it. The title for your
    save point should be clear enough that you know which save point you are at so
    that you do not confuse yourself. Especially when you are working with multiple
    tables at once.


    Syntax:


    ```

    Savepoint savepoint_title;

    ```


    After you have created your save point, you can use the `roll back` command to
    undo everything up to this point in time. Using the roll back code with your save
    point command is going to look like this.


    Syntax:


    ```

    Rollback to savepoint_title;

    ```


    ### Releasing your save point command


    A save point can be released when you remove that particular save point. This
    is done if you do not want to go back to that save point due to code being wrong,
    or if you have a more up-to-date save point.


    Syntax:


    ```

    RELEASE SAVEPOINT SAVEPOINT_TITLE;

    ```


    Once a save point has been released, you are not going to need to use the `roll
    back` code since you have nothing to go back to. So, make sure that you create
    a save point soon after you release a save point just to ensure that you have
    something to go back to if you find that you have made a mistake.


    ### Set transaction command


    The `set transaction` command will show where a transaction has been made on the
    data base. Essentially, it is a record of the changes that were made, the characteristics
    of the changes, and the location of the change in your data base. `Set transaction`
    commands are going to come handy when you want to see all the transactions that
    you made.


    Syntax:


    ```

    SET TRANSACTION [ READ WRITE | READ ONLY];

    ```


