    ## Altering Tables

    After you have made your table, it is possible that the structure of the table
    will need to be changed. Thanks to SQL, you can do this with a simple code!


    ### Syntax

    ```sql

    ALTER TABLE “table_title”

    [alter specifications]

    ```

    The alter specifications will be what it is that has to be changed about the table.


    ### Adding columns

    If you need to attach a column to input more data, you can use the SQL database
    for this. The database will need to be instructed that you need the modified and
    how it is going to be modified. When it comes to the blueprint of your alteration,
    you need to tell the system you are needing to insert a different type of data
    so that you can use it at a later date.


    Syntax

    ```sql

    ALTER TABLE “table_title”

    ADD “column_title” “data type”;

    ```

    You do have the ability to add more than one column to your table at once so that
    you do not have to use your code multiple times, all you need to do is separate
    them by a comma and insert the alteration into a set of parentheses. Ensure you
    are placing the character value so that your table knows how many characters need
    to be in that column.


    ### Column modification

    Sometimes the type of data that is in a column has to be changed to a different
    data type to satisfy what it is that you are working on. When you use the function
    `modify column`, you are going to be still using the `alter table` function; however,
    it is going to be changed to include the column modification.


    Syntax

    MySQL and Oracle

    ```sql

    ALTER TABLE “table_title”

    MODIFY “column_title” “New Data Type”;

    ```

    SQL

    ```sql

    ALTER TABLE “table_title”

    ALTER COLUMN “column_title” “New Data Type”

