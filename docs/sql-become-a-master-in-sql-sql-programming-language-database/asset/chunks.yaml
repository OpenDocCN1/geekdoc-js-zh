    如果由于信息过时或输入错误而需要删除某列，你将执行此操作。你仍然将使用 `alter table` 函数并添加 `drop column` 函数。在执行此函数之前，你必须确保删除的是正确的列，否则你将丢失原本不想丢失的数据，而且除非你重新输入所有内容，否则你无法将其找回。


    ### 语法


    #### MySQL

    ```sql

    ALTER TABLE “table_title”

    DROP “column_title”;

    ```


    #### Oracle and SQL

    ```sql

    ALTER TABLE “table_title”

    DROP COLUMN “column_title”;

    ```


    ### 添加索引

    有了索引，在表格和数据库中搜索将比不使用索引要容易得多。当你使用以下表函数时，你可以毫无问题地添加索引。请注意，在处理 `SQL` 或 `Oracle` 时，将不允许使用此函数，它仅由
    `MySQL` 支持。


    #### 语法

    ```sql

    ALTER TABLE “table_title”

    ADD INDEX “index_title” (column_title);

    ```


    ### 删除索引

    如果你的索引由于某种原因不再相关，你有选择删除它，这样它就不会占用数据库空间。再次强调，你将使用 `alter table` 函数来删除索引。而且由于你只能在
    `MySQL` 中创建索引，因此你只能在 `MySQL` 中删除它。


    #### 语法

    ```sql

    ALTER TABLE “table_title”

    DROP INDEX “index_title”;

    ```


    ### 添加约束

    即使你的表已经存在于数据库中，你仍然可以添加在创建表时可能忘记添加的约束。如果你不记得书中之前讨论过的约束，请回到第 8 章。


    #### 添加约束的语法

    ```sql

    ALTER TABLE “table_title”

    ADD [CONSTRAINT_TITLE] [CONSTRAINT_TYPE] [CONSTRAINT_CONDITION];

    ```


    ### 删除约束

    当约束被删除时，这意味着如果你以后某个时候再次需要它，就必须重新添加它。因此，在执行此命令之前，请确保你真的想删除它。如果你不确定以后还需要它，你应该禁用它而不是删除。然而，如果你确定要删除它，可以完全移除该约束，使其不再用于该列或该表。


    #### 语法

    ```sql

    ALTER TABLE “table_title”

    DROP [CONSTRAINT] [INDEX] “CONSTRAINT_TITLE”;

    ```


    # 第 14 章

    ![logo](img/00003.jpeg)


    ### 在 SQL 中复制表

    这可能并不常见，但有时你可能会遇到需要表格副本的问题。虽然你可以通过创建一个新表并重新输入所有数据来重建表，但这并不高效。相反，为了节省时间，你可以直接克隆表。这还能确保你不会将数据放在错误的位置或无意中遗漏某些数据。


    当你使用 `MySQL` 克隆表时，需要记住三点：

    1. 当复制整个张表时，你将使用 `insert` 和 `select` 语句。

    2. `create table` 命令将使新表看起来与你正在复制的表完全一样。

    3. 确保更改你正在克隆的表标题，以免在处理它们时将表搞混。


    # 第 15 章

    ![logo](img/00003.jpeg)


    ### SQL 代码中的重复项

    这并不一定是有意为之，但有时记录会在你处理的表格或数据库中出现重复。当你搜索重复记录时，与其浪费时间尝试寻找所有的重复项，不如遍历并定位唯一的记录对你来说更简单。


    为了处理重复项，你将使用 `select` 语句，必须记住的关键字是 `distinct`。这将让你能够移除任何重复的记录，只保留唯一的记录。


    #### 语法

    ```sql

    SELECT DISTINCT column 1, column 2 , ….. columnN

    FROM table_title

    WHERE [condition]

    ```


    有时这些内容在你的代码中是重复的，因为人们住在同一个城市，年龄相同，等等。这些是你无法控制的，但你仍然必须处理它们。


    通过使用 `distinct` 关键字，你将清除所有包含相同信息的其他记录，但将保留包含你寻找的信息的那条记录。因此，当你使用此代码时，必须小心不要删除你可能想要使用的记录。


    此外，确保你已经在另一个位置备份了数据，或者你有一个最近的保存点，以便在万一不小心弄错了时可以回到表格的原始状态。`distinct` 关键字是你需要谨慎使用的关键字之一，因为你可能会丢失数小时不需要或不想丢失的工作，因此你的工作将变得不再高效。记住，`SQL`
    应该是让你的工作更高效，而不是更具挑战性。


    # 第 16 章

    ![logo](img/00003.jpeg)


    ### SQL 注入

    当你或其他人进入网站的任何时候，数据都会从他们的计算机获取并通过网站发送，这使你暴露于所谓的 SQL 注入风险之中，这可能会抹掉你在代码中投入的所有工作。注入通常发生在你要求用户在提示框输入某些类型的数据（而这些数据被证明是字面量）时。然而，你并不一定能得到想要的信息。相反，你可能会得到一个在你的数据库中运行的语句，而你并不知道它的发生。不能信任用户会提供你请求的数据，因此你需要在他们输入的数据发送到你的数据库之前进行检查。这将有助于保护你的数据库。


    当你通过处理该列的该标题，尝试从请求的表中提取特定记录时，你的函数调用将被使用。数据通常将与你从用户处接收的内容匹配，从而让你能够保持数据库安全。


    在 `MySQL` 中，不允许将查询携带或堆叠到单个调用函数中。这有助于防止查询因堆叠而失败。然而，`SQLite` 等扩展允许你在在该字符串中进行搜索时堆叠查询。这就是你的代码和数据库出现安全问题的地方。


    ### 防止 SQL 注入

    转义字符应该在 `Perl` 或 `PHP` 等编程语言内部处理。但在 `MySQL` 中，有一个扩展允许你使用 `PHP`，以便在使用转义字符时使用正确的函数。该扩展使得这些字符对于
    `MySQL` 来说是唯一的。


    ### Like 困境

    在处理类似匹配的困境时，你必须有一种转义方法来更改用户插入到你的提示框中并证明是字面量的字符。`addslashes` 函数允许你确保指定系统为了转义所需的字符范围。


