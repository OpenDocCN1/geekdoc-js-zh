    However, there are going to be times that you are not going to have to specify
    where the values are going to go on the table because they can go wherever there
    is room. For that, you are going to use an entirely different syntax.


    ```

    INSERT INTO TABLE_NAME VALUES (value1, value2, value3, … valueN);

    ```


    You can also use the insert query in order to bring data from one table to another
    table without having to worry if you are going to miss copying any of the information.


    ### Syntax

    ```

    INSERT INTO first_table_ame [( column1, column2, … column)]

    SELECT column1, column2, … columnN

    FROM second_table_name

    [WHERE codition];

    ```


    ### Select query

    With `select`, you are going to be locating data in your tables in your database
    so that you can get a result returned to you. These results are going to be known
    as result sets.


    #### Syntax:

    ```

    SELECT column1, column2, column FROM table_name;

    ```

    The data from those particular columns is going to be what you are wanting to
    be returned to you; therefore, the database is going to do so.


    However, should you want all fields returned, you are going to use this code.


    #### Syntax:

    ```

    SELECT * FROM table_name;

    ```


    ### Update query

    As it says, an update is going to be used to change any records that are already
    on the table you are working with.


    The `where` clause can be used as you are using the update query so that you can
    modify specific rows rather than changing all rows in the table.


    #### Syntax

    ```

    UPDATE table_name

    SET column1 = value1, column2=value2, … columnN = valueN

    WHERE [ condition ];

    ```

    The `N` is going to be able to be used with any condition when you are using the
    `or` as well as the `and` operators.


    ### Delete query

    Whenever records need to be removed from your table, you are going to use the
    delete query. Just like with the update query, you are going to be allowed to
    use the `where` clause so that you can eliminate a set number of rows rather than
    delete everything that is on your table.


    #### Syntax:

    ```

    DELETE FROM table_name

    WHERE [condition];

    ```

    Conditions have the ability to be combined when you use the `and` operator as
    well as the `or` operator.


    ### Sorting your results

    The `order by` condition is going to be the clause that is used when you are sorting
    the data in your table. You have two options – you can sort the data in ascending
    order, or you can do it in descending order. There are going to be some data bases
    that are going to automatically sort your results in ascending order without you
    telling it to. So, if you have to have it in descending order, you are going to
    need to ensure that you have told the system that you want it sorted a different
    way.


    The syntax for sorting the results that you get from your queries is going to
    be similar for both ascending and descending orders. The only difference is going
    to be which order you want it to be sorted in.


    #### Syntax:

    ```

    SELECT column – list

    FROM table_name

    [WHERE condition]

    [ORDER BY column1, column2, …columnN] [ASC | DESC ];

    ```

    Multiple columns can be selected when you use the `order by` clause. However,
    make sure that the columns you are selecting to be sorted are in the column-list.


    # Chapter 8

    ![logo](images/00003.jpeg)


    ### Constraints in SQL

    A constraint is going to be the different rules that the SQL system is going to
    enforce when it is dealing with the columns on your table. Essentially, your table
    is going to be limited on the different types of data that are going to be allowed
    to go into the data base. Constraints are used so that you are able to make sure
    the data base has accurate and reliable data in it. This is particularly helpful
    when your data base is being used by other people for a job.


    Constraints are not limited to just the columns, but they can be placed on an
    entire table as well. The restrictions you place on a column are going to be only
    enforced on the column in question. But, when you are putting them on the table,
    they will be implemented on the entire table.


    There are just a few limitations that you are going to use most often when you
    are working with constraints:


    - `Not NULL`: the column is not going to have the ability to have any null values.

    - `Index`: the index constraints will not only create, but they will retrieve
    data that you have in your data base.

    - `Default constraint`: if you do not set a default value, then one will be provided
    for that column.

    - `Check constraint`: this limitation will make sure that any conditions placed
    on the column are met.

    - `Unique constraint`: there are not going to be any values in your column that
    are going to be the same, each value is going to be unique.

    - `Foreign key`: records in other data base tables are going to be identified
    with the key.

    - `Primary key`: in the table that you are currently working in, each record is
    going to be identified.


    When you are creating your table, you will have the opportunity to put your constraints
    into the code so that the constraints are done from the beginning. Or, if you
    forget to do that, you are going to be able to use the `alter table` statement
    so that the constraints can be created even though your table is already in place
    on your data base.


    ### Dropping constraints

    Even though your constraint has been put into place, you have the choice to drop
    the constraint by using the command that you use to alter your table, and from
    there you will select the drop constraint option.


    Depending on the constraint, you are going to be provided with a shortcut that
    you can use to drop that constraint. It will also depend on which application
    you use. As mentioned at the beginning of this book, not every command is going
    to work in the programs that you will use as you create your SQL code.


    Along with shortcuts, some implementations make it to where you can disable constraints.
    This is not going to delete the constraint from the data base permanently, but
    rather, disable it so that it can be used in that data base later when you need
    it.


    ### Integrity constraints

    An integrity constraint will be used when you want to be sure that your data is
    accurate and consistent throughout the entire data base. The integrity of your
    data is going to be dealt with a different data base than what you are using thanks
    to the concept that has been put into SQL for referential integrity. Besides,
    how are you to know if your data has integrity if you do not have something to
    check it against?


    While multiple integrity constraints can be used when using referential integrity,
    you are primarily going to use the `foreign key`, `primary key`, and all the other
    constraints that we talked about in the section above.


    # Chapter 9

    ![logo](images/00003.jpeg)


    ### SQL and Math

    With SQL 92, you are going to be able to do four different math functions that
    most programming languages are going to be able to do:


    - Multiplication `*`

    - Addition `+`

    - Modulo `%`

    - Subtraction `−`

    - Division `/`


    As you use the modulo operator, you will get the remainder that was received from
    the utilization of the division function whether it is an integer or not. You
    are not going to be able to use modulo when you are working with ANSI SQL due
    to the fact that it is not supported; however, many of the other data bases will
    support the modulo function.


    While the above functions are great, they are not going to be used very often.
    Instead, there are other functions that you are probably going to find yourself
    using more. These mathematical operations are not going to be required for you
    to use SQL 92, but that does not imply that you should not make sure that they
    are available on the RDBMS that you have decided to use. If they are not supported
    by the RDBMS that you are using, you are going to end up making yourself mad due
    to the fact you put in all the work for it to not work. If you are using a major
    data base, it is most likely going to work, just be sure you are checking on the
    off chance you have chosen to work with one that it does not operate with.

