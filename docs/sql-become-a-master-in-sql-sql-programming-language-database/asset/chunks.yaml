    When a constraint is dropped, that means that if you need it again at a later
    time, you are going to have to re-add it. So, make sure that you really want to
    drop it before you do this command. If you are not sure if you are going to need
    it again or not, then you are going to to disable it rather than dropping it.
    However, if you are sure about dropping it, you can get rid of the constraint
    all together so that it is no longer being used on that column or table.


