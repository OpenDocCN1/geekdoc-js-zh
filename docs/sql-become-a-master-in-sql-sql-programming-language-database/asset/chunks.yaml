    接下来的行动是将新学到的 SQL 知识应用于你的工作中。如果你目前的工作没有使用 SQL，那么你让自己对这家公司变得更有价值了，因为精通编程语言的人可以做比招聘要求更多的事情！


    祝贺，并祝你好运！


    最后，如果你觉得这本书在任何方面都有帮助，我们非常欢迎你在 Amazon 上给出评价！


