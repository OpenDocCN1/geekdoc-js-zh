    # Your Data Base – How to Tune It


    When you are using `SQL`, you are going to want to become an expert on your data
    base; this, however, is not going to happen overnight. Just like with learning
    how to use the system, it is going to take time and effort to learn what it is
    that you need to know in order to have the proper knowledge of how the data base
    works. You are also going to want to make sure that you have a pretty well-rounded
    education when it comes to dealing with the data base because you never know what
    is going to happen.


    Just to make your education simpler when it comes to learning about the data base,
    here are some things that you are going to find helpful.


    1. When using the data base, you need to work with the `3BNF` design.

    2. Numbers compare to characters differently, and you could end up downgrading
    your data base’s performance, so do not change numbers unless you absolutely have
    to!

    3. With the `select` statement, you will only have the data that you have to have
    displayed on your screen. You are going to want to do what you can to avoid asterisks
    with your `select` statement searches to avoid loading data that you do not need
    to be loading at that time.

    4. Any indexes that you create need to be created carefully and only for the tables
    that require them. If you are not going to utilize the table as much, then it
    does not need to have an index. Essentially, you are going to attempt to save
    space on the disk, and if you are creating an index for each table, you are going
    to run out of room.

    5. A full table scan happens when no index can be found on that table. You can
    avoid this by creating an index specifically for that column rather than the entire
    table.

    6. Equality operators have to be used with caution when it comes to times, dates,
    and real numbers. There is a possibility that there are going to be differences,
    but you are not necessarily going to notice these differences right away. Equality
    operators make it to where getting exact matches in your queries is almost impossible.

    7. Pattern matching can be used, but use it sparingly.

    8. Look at how your search is structured and the code that is being used with
    your table. You can manipulate the code of your table to make it to where there
    is a faster response time as long as you change everything about the table and
    not just part of it.

    9. Searches are going to be done on a regular basis when you are working with
    `SQL`. Stick to the standard procedures that work with a large group of statements
    rather than small ones. The procedures have been put into place by the data base
    before you even get the chance to use it. The data base is not like the search
    engine though; the procedure is not going to be optimized before your command
    is executed.

    10. The `or` operator should not be used unless necessary. This operator causes
    your searches to be slower.

    11. Remove any indexes that you have in place so that you can optimize bigger
    batches of data. It is an excellent idea to think of the history of the table
    in millions of different rows, and you are probably going to require multiple
    indexes to cover the entire table which is going to take up space on the disk.
    While indexes will get you the information you want faster, after the batch has
    been loaded, the index is going to slow the system down due to the fact that it
    is now in the way.

    12. Batch transactions require that you use the `commit` function. You are going
    to have to use this function after you create a new record.

    13. Data bases have to be defragmented at least once at week to ensure everything
    is working properly.


    ## SQL tuning tools


    The Oracle program grants you access to various tools that you are going to use
    when you are having to do anything with your data base when it comes to tuning
    it or the performance of the data base. Two of the most popular tools it offers
    are as follows:


    1. `Tkprof` which makes it to where you can measure how the data base performs
    over a certain period of time-based on every statement you enter into `SQL` to
    be processed.

    2. `Explain plain`; this tool shows you the path that is followed to ensure that
    statements are carried out as they are meant to be.


    Use the `SQL*plus` command to measure the time that passes between each search
    on your SQL data base.


    ## Chapter 18


    ![logo](images/00003.jpeg)


    ## Wild Card Operators


    Wild card operators are going to be operators that are used when you are comparing
    two values that have been created similar thanks to the utilization of a wild
    card operator.


    SQLSQL offers two different wild card operators that are going to be able to be
    used with your life operator.


    - **Percentage sign**: with this operator, you are going to have the ability to
    match multiple characters together so that they are similar. Keep in mind that
    you have to have an asterisks in order to grant MS access rather than using the
    percentage sign in the use of the wild card character.

    - **Underscore**: a single character will be matched. MS access is going to require
    that you use a question mark to do this same operation instead of the underscore.


    A percentage sign will be represented by multiple characters, a one, or a zero.
    Underscores, on the other hand, are going to be represented by single characters
    only. You can use these wild card operators in various combinations.


    ### Syntax:


    ```sql

    SELECT FROM table_title

    WHERE column LIKE ‘XXXX%.’

    ```


    Or


    ```sql

    SELECT FROM table_title

    WHERE column LIKE ‘%XXXX%.’

    ```


    Or


    ```sql

    SELECT FROM table_title

    WHERE column LIKE ‘_XXXX.’

    ```


    Or


    ```sql

    SELECT FROM table_title

    WHERE column LIKE ‘_XXXX_.’

    ```


    Ultimately, there are an undetermined amount of conditions that are going to be
    able to be used when you use the `or` and the `and` operators.


    ## Chapter 19


    ![logo](images/00003.jpeg)


    ## SQL Tips and Tricks


    The purpose behind knowing tips and tricks with SQL is to make it to where you
    are able to use the program in a more efficient way, and you are not having to
    get frustrated because something is not working the way it is supposed to. There
    are opportunities that you are going to have to use a tip or trick that is listed
    in this chapter so that you can create a shortcut and make the data base less
    complicated than it actually is.


    1. **The user interface and the language**: if you want to change the language
    that the user interface is, then you are going to need to close out the entire
    program. After you have completed this step, you will move on to the installation
    folder. Right click on the shortcut that has been created on your desktop and
    proceed to the folder’s location. Now open the developer folder before going to
    the first folder you see listed. After that, you have to click on `SQL developer.conf`.
    Here is where you will use a text editor that is on your computer in order to
    change the language. It does not matter which text developer you are using, as
    long as you are comfortable using it. A new setting is going to be added into
    the text that appears in the text editor. You can place your new setting anywhere
    that you desire to in the file. It is wise to put a comment next to your new setting
    so that if you have to go back in and adjust it again later, you do not have to
    search through all of the code to find it. An `AddVMOption` is going to be added
    to the user language setting. Now you are going to have the option to open your
    SQL developer once more, and now, it is going to be in the language that you changed
    it to. However, be careful in which language you choose to put it in because not
    everything is going to translate the same when it is switched back to English.

