    ### The Creation of Data Bases in SQL


    When you are wanting to generate a new data base in SQL, you are going to use
    the create data base statement. This way, a data base is created so that you can
    begin to create tables and input data into the data base for you to use while
    you are working.


    Syntax:


    ```sql

    CREATE DATABASE Databaseame;

    ```


    All of the data bases that you create are going to have a unique name so that
    they can easily be located when you are searching for them on the RDBMS.


    Example


    ```sql

    SQL > CREATE DATABASE babyname;

    ```


    It is required that you have administration privileges before you can create any
    data bases. But, at the point in time that the data base has been set up, you
    are going to have the option to create tables and input data.


