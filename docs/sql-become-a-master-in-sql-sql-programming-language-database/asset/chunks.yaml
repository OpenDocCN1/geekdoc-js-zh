    ### SQL Data Types


    In an earlier chapter, we touched on data types. However, some data types are
    going to work with very specific data types for the object that you are working
    with. It does not matter what you are working with, all expressions, variables,
    and columns are going to have some sort of data type that works with SQL.


    Data types are used when creating tables. It is required that you pick one data
    type for that column in the table based on what you need that column to do.


    - `Byte`: a set of numbers between 0 and 255. There is only going to be a single
    byte of storage for these figures.

    - `Singles`: a floating point number that will be associated with a decimal. Singles
    are going to contain up to 4 bytes of storage.

    - `Currency`: there can be up to four decimal points for currency, and it can
    go up to 15 places in whole numbers. There are around 8 bytes of storage for currency.

    - `Long`: a long is going to have 4 bytes of storage and fall between −2,147,483
    and 2,147,483,647

    - `Memo`: memos will hold larger amounts and can go up to 65,536\. Memos have
    the ability to be searched but not sorted.

    - `Text`: letters and numbers that are entered into SQL are going to be text,
    and it can handle up to 255 characters.

    - `Date and type`: with 8 bytes of storage, the data and time is going to be obvious.

    - `Double`: just like singles, a double has two floating point numbers and contains
    8 bytes of storage.

    - `Integer`: you are only going to be able to store numbers in this data type.
    It is going to be between the numbers of −32,768 and 32,767\. You have 2 bytes
    of data that can be stored here.

    - `Look up wizard`: this is your options list so that you can choose what it is
    that you are wanting to do. This has 4 bytes of storage.

    - `Auto number`: the fields are going to be given their own record for data with
    its own number. It is going to start out with one unless you state otherwise.
    Four bytes of data are saved for the auto number.

    - `Hyperlink`: you are going to be capable of sending the user to a web page if
    it is necessary.

    - `Yes and no`: the logical fields that require answers like yes or no or even
    true or false. The true and false answers are going to be equal to negative one
    and zero. If no value is allowed, then that field is going to be null. The storage
    is 1 bit.

    - `Ole object`: pictures and other multimedia will be placed in this data type.
    It is known as a blob, which stands for large binary objects. You have the most
    significant storage amount here, and it is 1 gigabyte.


    Data types are going to fall into three main categories – date and time, numbers,
    and characters.


    #### Character:


    - `Varchar(size)`: the length of the string that is stored will be able to hold
    all of the data types that we just talked about. The size is going to be based
    on what the number is that is in the parentheses. Normally, it is going to be
    texts that you convert.

    - `Char(size)`: the character string is a fixed length that can be the data types
    that were previously discussed.

    - `Blob`: there are 65,535 bytes of data that can be held with a blob.

    - `Tiny text`: you are only going to be able to put 255 characters in the small
    text.

    - `Long text`: this is going to hold up the largest number of characters.

    - `Text`: this is the standard character text that holds up to 65,550 characters.

    - `Medium text`: this is going to hold around 16,000,000 characters at most.

    - `Set`: this is going to be similar to an enum type but is only going to hold
    up to 64 items; however, you can store more than one data type in it.

    - `Medium blob`: this holds up to 16,000,000 bytes of data.

    - `Long blob`: this is going to hold the most bytes of data hence why it is called
    a long blob.

    - `Enum(x, y, z…)`: every possible value is going to be listed in an enum. It
    can hold up to 65,535 values. Anything that is not inside of the list will be
    shown as a blank value. The values do not have to be put in order when they are
    entered; they can be sorted at a later date.


    #### Number:


    - `Float(size, d)`: this is considered to be a tiny number that uses a decimal
    that can float. The size of the parameters is going to be the maximum amount of
    values that can be put into the data type. The `d` parameter is going to be the
    largest amount of numbers that can be to the right of that decimal.

    - `Tinyint(size)`: you can have −128 to 127 signed values or 0 to 255 unsigned
    values.

    - `Bigint(size)`: you can have 9,223,372,036,854,775,807 signed values or 18,446,744,073,709,551,615
    unsigned values.

    - `Smallint(size)`: you can hold up to 32,000 signed values or 65,000 unsigned.

    - `Int(size)`: holds a set value of signed and unsigned values.

    - `Medium(size)`: holds up to 16,000,000 unsigned.

    - `Decimal(size,d)`: you are going to be able to store decimals inside of a fixed
    point that are inside of the size parameters. The parameters are going to be set
    by the maximum amount of digits that are right of the decimal.

    - `Double(size, d)`: this is similar to the `decimal(size, d)` but the number
    of digits that are to the right side of the decimal are going to be set by the
    parameter.


    Date and time:


    - `Date()`: dates are going to be entered in the year, month, and day format.

    - `Year()`: the year is going to either be inputted in two digit form or four
    digit form. It is going to be based on what you are doing that will depend on
    how it is entered.

    - `DateTime()`: you are going to be putting in a combination of the date and time.
    It will be recorded as the `date()` is and then the time will be entered hour,
    minute, and seconds.

    - `Time()`: time is entered hour, minute, second.

    - `Timestamp()`: the time stamp is going to match what the current time zone that
    you are in so that you can see exactly when something was done. It will be entered
    like the `DateTime()`.


