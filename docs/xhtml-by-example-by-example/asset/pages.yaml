  md: '# The Semantics of Semantics


    One of the biggest difficulties Web designers can face when moving from HTML into
    the world of XML is getting behind the idea that elements, in and themselves,
    have no semantics. Semantics are the collection of facts that are universally
    understood about a given object, especially those facts that pertain to its appearance.


    For instance, the piece of furniture in your home known as a table is a structure
    with a flat, horizontal surface supported some distance from the floor by several
    supports as legs. A table in the United States is going to be functionally equivalent
    to a table that is found in Kenya, Nepal, or Chile. The *semantics* of the table
    are the same.


    Bringing this concept back into XHTML, everyone knows that a paragraph is a single
    block of text, separated visually from other blocks of text. In this book, the
    paragraphs are presented with a blank line before and after the block of text.


    The paragraph element <p> carries with it the same semantics—the tag acts as a
    container for the text being presented.


    Most elements in XHTML have semantics defined either by the XHTML Recommendation
    or by the earlier HTML Recommendations on which it is based.


    # Organizing Documents with Headings


    One of the most abused elements in HTML is the heading. I believe this is more
    a function of easy desktop publishing methods than any real intent to abuse the
    structure of a document. Many authors simply don''t realize what headings are
    intended to represent!


    Headings are intended to denote structural divisions within a document. These
    divisions coincide with what you''d see on an outline: major headings, subheadings,
    and sub-subheadings, and so on.


    Take a look at the table of contents for this book. It is organized in a rather
    basic outline fashion. Chapter numbers indicate the major headings, with subheadings
    indented for each level that is drilled down. For instance, the entry for Chapter
    1, “XHTML Fundamentals,” looks like this:


    ```

    <confirm Chapter 1 TOC entry, copy here as seen in real TOC, then plug into below>

    ```'
