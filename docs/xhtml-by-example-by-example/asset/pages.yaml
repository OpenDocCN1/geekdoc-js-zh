  md: '# How Modularization Works


    The actual modularization of the DTD relies heavily on parameter entities. Six
    categories of entities are used to represent the abstractions of each module.
    Each category follows a specific naming convention using suffixes, as follows:


    +   - .mod—Parameter entities representing a DTD module use the .mod suffix. Modules
    can be stored in separate file entities, which are then also named using the .mod
    suffix.

    - .module—DTD modules can be switched on or off in a larger DTD using conditional
    sections. The keywords INCLUDE and IGNORE regulate the inclusion of the module,
    represented by the parameter entity with this suffix.

    - .content—The content model of element types is parameterized with entities with
    this suffix.

    - .class—Elements of the same class are represented using .class suffix-parameter
    entities.

    - .mix—As the suffix implies, elements from different classes are represented
    by a single parameter entity using the .mix suffix.

    - .attrib—A group of name tokens that represent one or more attribute specifications
    within an ATTLIST declaration might be represented by this category of parameter
    entities.


    We will use most of these parameter entities later in Chapter 16, “Combining Custom
    Modules with XHTML,” when we define a new module from scratch. As we step through
    one of the predefined modules, the XHTML List Module, you''ll see several of them
    in use.


    # TAKING APART THE LIST MODULE


    The W3C-defined modules will all begin with commented information outlining the
    informal title of the module, the filename, a copyright statement, and revision
    data:


    ```

    <!-- ... -->

    <!-- XML Lists Module -->

    <!-- file: xhtml-list-1.mod -->

    ```


    This is XHTML, a reformulation of HTML as a modular XML application.

    Copyright 1998-2000 W3C (MIT, INRIA, Keio), All Rights Reserved.

    Revision: $Id: xhtml-modularization-20000705.html,v 1.7 2000/07/03 13:46:01

    -Shane Exp $ SMI'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Chapter 14: XHTML Modularization


    Next are the PUBLIC and SYSTEM identifiers used for the module, along with any
    revisions to those identifiers:


    This DTD module is identified by the PUBLIC and SYSTEM identifiers:


    ```

    PUBLIC "//W3C//ELEMENTS XHTML Lists 1.0//EN"

    SYSTEM "xhtml-list-1.mod"

    ```


    Revisions:

    (none)


    A commented prose section briefly describes the purpose of the module:


    ```

    <! Lists


    dl, dt, dd, ol, ul, li

    ```


    This module declares the list-oriented element types and their attributes.


    Next, the qualified names for each element presented in the module are defined
    in a parameter entity after the element name suffixed by .qname, for example,
    dl.qname for the parameter entity representing the element name dl:


    ```

    <ENTITY % dl.qname "dl">

    <!ENTITY % dt.qname "dt">

    <!ENTITY % dd.qname "dd">

    ENTITY % ol.qname "ol">

    <!ENTITY % ul.qname "ul">

    <!ENTITY % li.qname "li"

    ```


    The section reduces the declaration for the dl element to a single-parameter entity:


    ```

    <-- dl: Definition List -->


    <!ENTITY % dl.element "INCLUDE">

    [!dl.element;

    <!ENTITY % dl.content "(%dt.qname; |%dd.qname;)+">

    <!ELEMENT dl.qname %dl.content;>

    <!-- end of dl.element -->>

    ```


    These entities can be read easily if you approach them much like an algebra problem
    and work your way from the inside. First, consider the dl.content parameter entity.
    Its definition holds two .qname parameter entities, for the dt and dd entities.
    The syntax surrounding those entities should be familiar to you. If expanded,
    it reads:


    ```

    <ENTITY % dl.content "(dt|dd)*">

    ```'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# How Modularization Works


    The element declaration immediately below the dl.content entity defines the element
    itself. Expanded, it reads:


    ```

    <!ELEMENT dl (dt|dd)>>

    ```


    Moving back up the section, the parameter entity dl.element is defined to include
    both the dl.content parameter entity declaration and the element declaration,
    reducing this passage to the single entity. When invoked in the module as


    ```

    <!ENTITY % dl.element INCLUDE" >

    ```


    the dl element is included in the module, with the remaining information available
    for expansion by the parser.


    The attribute list for the dl element is handled in the same manner. A parameter
    entity is defined for the entire attlist, and incorporated using the INCLUDE keyword.
    The Common attribute collection, defined elsewhere in the final DTD, is references
    using an .attrib suffixed parameter entity:


    ```

    <!ENTITY % dl.attlist INCLUDE" >

    <![<dl.attlist;

    <!ATTLIST %dl.qname;

    %Common.attrib;>

    <!-- end of dl.attlist->>>

    ```


    The same process of parameterizing the element and attribute declarations is carried
    out for the remaining elements in the module. The entire module can be seen in
    Listing 14.1.


    # Listing 14.1: xhtml-list-1.mod, the XHTML List Module


    ```

    <!--

    <!-- XHTML Lists Module -->

