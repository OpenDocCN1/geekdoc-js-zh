    <![CDATA[document.write("" + document.lastModified + ""); ]]]>

    </script>

    ```


    Unfortunately, if you''re planning on serving your XHTML documents, none of today''s
    HTML browsers know how to handle CDATA sections (remember, most were written before
    the advent of XML). To ensure the best chances of success with scripting, consider
    using an external script file. The external file, which doesn''t need any adjustment
    to the scripting code, is simply referenced with an src attribute on the script
    element:


    ```

    <script type="text/javascript" language="JavaScript" src="myscript.js"></script>

    ```


    # TIP


    A happy byproduct of using an external script file is that you can come to your
    heart without needing to worry about nested or dropped comments. This makes reuse
    of your script code more accessible.


    # White Space in Attribute Values


    XML has strict rules on the processing of white space. All white space characters,
    defined in XML as one or more of a space, tab, newline, or linefeed character,
    are normalized within attribute values. Normalization is the process of condensing
    white space down to a single white space character when found between words, and
    stripping any leading or trailing white space. As an XML application, XHTML also
    follows this process of white space normalization, both within attribute values
    and elsewhere in the document. Authors should take care not to rely on extraneous
    white space within attributes because the value will be modified by the normalization
    process.


    # Using the isindex Element


    The isindex element was designed as a quick way to generate a single line input
    control, which avoided the need to use the form element, an input element, and
    a second input for a submit button. This element has been deprecated in favor
    of the input element. Beyond that deprecation, only one isindex element should
    be included inside head if it is to be used.


    # Identifying the Natural Language of a Document or Element


    It''s possible to identify the natural language of a document or element using
    the lang attribute. simply the original language of the word, phrase, or document.
    The natural language of this book would be English (U.S. English to be specific).
    If I were to insert a foreign language word, the lang attribute allows us to identify
