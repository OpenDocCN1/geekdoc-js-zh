  md: '# Grammar Checking for the Web


    Two of the basic rules governing how XHTML documents are created as defined being
    **well-formed** and **valid**. Well-formed means the document is complete; that
    is, tags that have been opened closed, attribute values are fully quoted, and
    other structural components are complete. Using a grammar analogy, a well-formed
    document could be compared to a complete sentence. It has, at a minimum, a subject
    and a verb.


    Validity takes the analogy one step further. A valid document is not only well-formed,
    but also meets all the additional grammar rules laid out in the DTD. The elements
    used must be defined in the DTD, the attributes must have appropriate values,
    the content of elements must match the model defined, and so on. In essence, the
    validator makes sure you haven''t misplaced your modifiers or used the wrong verb
    tense.


    # Why Validate?


    XHTML requires that documents be both well-formed and valid, and validity itself
    requires well-formedness, one can check that a document conforms to both. Practically,
    validating your documents provides the experienced Web author benefit in finding
    errors that were unintentional, as as typos or a forgotten closing tag.


    # Type Control


    One of the most rudimentary uses of validation is to catch some of the problems,
    such as typographical errors. Any developer who''s not using an authoring tool
    that creates tags for him to make a few typos in any given document. Rather than
    having to painstakingly read each page for problems, a quick pass through the
    validator can point them out in seconds (see Figure 8.1).


    # TIP


    Web authors from outside the United States should be aware that XHTML has adopted
    U.S. English standards of spelling. Terms such as ''colour'' and ''centre'' are
    spelled as ''color'' and ''center.'' Validators will consider the Queen''s English
    versions as erroneous.


    Beyond the spelling of words used as element and attribute names, the validator
    can check the accuracy of your typing when quoting values, entering slashes and
    brackets, and any other characters necessary to make complete.'
  merge: -1
