    # Applets and Objects


    Applets and other embedded content such as QuickTime movies, Flash animations,
    and sound files, can be inserted in a document using either the applet or object
    element.


    The object element is preferred for its generic syntax and the ability to provide
    a text equivalent for the object as the content of the element, as well as a cascade
    of alternative objects to present to the user:


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_146_1.png)


    ```

    <object data="trussing.mpg" type="video/mpeg">

    <object data="trussing.gif" type="image/gif">

    <p>To truss the turkey, pull the legs together and tie around the bones with

    string</p>

    </object>

    </object>

    ```


    If the user agent uses mpeg movies, the content of the outermost element, the
    movie will be played. If it doesn''t, the still image will be offered. If a still
    image cannot be rendered, the text content will be given.


    # Audio and Video


    Audio presentations, the audio track portion of video presentations, should have
    a text-based transcript available or, if the format allows it (as with SMIL, the
    Synchronized Multimedia Integration Language), provide the text-track as a synchronized
    alternative to the native audio track (la closed-captioning services for television).


    # If You Must Frame…


    Chapter 6, “Using Frames,” introduced you to the uses of frames. Still controversial
    to use, they are doubly problematic for non-traditional browsers. I won''t review
    the techniques to provide alternatives again here, but caution you to consider
    all other alternatives before settling on a framed presentation.'
