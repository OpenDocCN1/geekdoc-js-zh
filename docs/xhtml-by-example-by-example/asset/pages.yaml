    # Evaluating the Results


    An interesting exercise is to change the DOCTYPE declaration in orion.html to
    be used for XHTML Strict and then revalidate. Getting a passing mark lets you
    know that XHTML Basic hasn''t included anything that wouldn''t otherwise pass
    validation for XHTML 1.0 Strict. In the same manner, it''s possible to check documents
    developed to XHTML 1.0 Strict or XHTML 1.0 Transitional for compliance with XHTML
    Basic by simply changing the doctype and reviewing the results as we did moving
    from HTML 4.01 to XHTML with Orion''s Domain.


    # What''s Next


    In this chapter, you have learned about the wide variety of computing devices
    that now have access to the Internet. You''ve become familiar with the unique
    requirements that many of these devices present, in terms of the software they
    can run and the type of documents they are able to process.


    You''ve gone through the steps of converting an existing HTML document over to
    XHTML Basic and compared the results to both the original presentation and XHTML
    1.0 Strict.


    Next, in Chapter 18, “XHTML Document Profiling,” we''ll take a look at how XHTML
    documents can be described and managed using document profiling techniques.'
