    # TIP


    Feedback on the Web tends to mimic that of any service industry. You''re far likely
    to have dissatisfied visitors just go away and never return, rather than complain
    and tell you what''s wrong. Therefore, relying on user feedback to know if there''s
    a problem can be a dangerous practice.


    # Interoperability


    One issue that is becoming more and more important as the Web is expanding beyond
    the desktop computer is that of interoperability. What works on'
