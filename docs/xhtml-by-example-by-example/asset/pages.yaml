    To allow a page in the f1 frame to contain a link to a document that should be
    displayed in the f2 frame, the link must be targeted at f2:


    <h1>Frame 1</h1>


    <p>This link will generate <a href="frame2.html" target="f2">new document for
    frame 2</a></a></p>


    After following this link, the results look like Figure 6.5.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_125_0.png)


    Figure 6.5: A new document is loaded into a separate frame using the

    target attribute.


    # A Navigation System Based on Frames


    As you''ve seen previously in this chapter, two of the most popular uses for frames
    are to position banner information in a static space, and to provide a fixed navigation
    system. This next example will combine the two techniques while creating a Web-based
    recipe archive. The general layout of the site is sketched in Figure 6.6.


    The best practice for any frames-based site is to begin by constructing the "shell"
    for the site, which is the frames. In this case, we''ll be using nested frames,
    so we have two documents to create.


    To begin, we''ll divide the screen into the fixed banner frame and the lower portion.
    The banner frame should be 100 pixels in size, should not be resizable, nor should
    have a scrollbar. The second row should assume all remaining available space:'
