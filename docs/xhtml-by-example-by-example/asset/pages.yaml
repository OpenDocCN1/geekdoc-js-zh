    # Text Areas: Accepting Large Blocks of Text


    There will be times when it is desirable to collect more than the few words or
    short sentence that can be entered into a reasonably sized text box. The text
    area control was designed to solve that problem.


    Text areas are formed a little differently from most other controls in that they
    are not empty elements and can accept plain text between the opening and closing
    tags. Additionally, they have two attributes that control the size of the control
    instead of one. The rows attribute manages the number rows are visible in the
    control (the height measurement), and the cols attribute determines how many characters
    are visible horizontally (the width measurement).


    A site that provides technical support needs to collect a detailed description
    of the problem their customer has encountered with the product. The service manager
    wants the space to be at least six lines long, and about as wide as the page allows.
    It should also be clear to the user that they must give as much detail as possible
    when describing the difficult.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_78_1.png)'
