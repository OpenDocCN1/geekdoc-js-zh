  md: '# The Concept of Well-Formedness


    ```

    ...more content...

    <body>

    n</html>

    ```


    But this is not:


    ```

    <body>

    <html>

    ...more content...

    </html>

    </body>

    ```


    But the following is not:


    +   For all elements, if the start tag is within another element, so must the
    end tag be. What this means is that if tags are nested, one must be wholly inside
    the other. You might think of them as a set of graduated-size mixing bowls. You
    begin with the largest bowl, then put the next-smaller size bowl inside the larger
    one, and so on and until you''ve nested each of them inside the larger bowl. Obviously
    the middle-sized bowl can''t be half the large bowl and half inside the smallest
    bowl; it must fit within the bowl one-step larger than. In XHTML this means the
    following is correct:

    <p><strong><em>em>Wow!</em></strong></p>



    But the following is not:


    ```

    <p><strong><em>em>Wow!</em></strong></p></em>

    ```


    # NOTE


    In the formal vocabulary of markup languages, you''ll often hear element elements
    that can be referred to as *child elements*. The element that contains the nested
    element is the *parent element*. This relationship becomes more important when
    you begin working with scripting and the Document Object Model.


    The well-formedness definition in the XML Recommendation stops here, but there
    are several issues that are worthy of attention as it pertains to XML well-formedness:


    +   The root element must declare the XHTML namespace attribute. The XHTML namespace
    identifier is http://www.w3.org/1999/xhtml.


    > To review more about the *xmlns* attribute, refer to “The Root Element,” p.
    16.


    +   All attribute values must be fully contained within quotes. A pretty simple
    requirement, this means that it is no longer allowable to write

    <p align=center>'
