    # HIDDEN FIELDS: PASSING ADDITIONAL INFORMATION TO THE SCRIPT


    In almost any data exchange with your visitors, there is likely to be some

    information that is static, that is, it doesn''t change with each user. Perhaps

    you have different forms on your site, and you want to be able to

    determine at a glance which form generated the response. The hidden form

    control handles this for you nicely.'
