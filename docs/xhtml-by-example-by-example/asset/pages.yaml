  md: 'Casting a basic list in an ordered fashion is as simple as XHTML as it is in
    HTML. If the type attribute is not stated, the default is Arabic numerals. If
    we were to rely mist my family in an ordered list using lowercase Roman numerals,
    I would write:


    ```

    <ol type="i">

    <li>Ann/</li>

    <li>Dave/</li>

    <li>Linda/</li>

    </ol>

    ```


    # SETTING THE LIST START VALUE


    A unique aspect of ordered lists is the starting value used for the list delimiter.
    By default, the delimiter starts at the beginning of the chosen set, that is the
    number 1, the letter A, or a Roman I.


    However, document authors are free to choose a different starting point. This
    is accomplished using the start attribute, placed on the OL element.

    i do of my banking online. I can request a list of recently cleared checks, which
    are presented as an ordered list, starting with the first check I requested. In
    this situation, the list number should be the check number (see Figure 2.3). In
    the source, I might see:


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_41_0.png)


    ```

    <ol start="1653">

    <li>Publix Supermarket - $52.96/</li>

    <li>Florida Power and Light - $102.39/</li>

    <li>Comcast of SW Florida - $59.51/</li>

    </ol>

    ```


    Setting a unique starting point isn''t confined to Arabic numerals. The same approach
    can be taken with any ordered list type. We could recast our list of recent checks
    using Roman numerals, for a little fun (see Figure 2.4):


    ```

    <ol type="i" start="1653">

    <li>Publix Supermarket - $52.96/</li>

    <li>Florida Power and Light - $102.39/</li>

    <li>Comcast of SW Florida - $59.51/</li>

    </ol>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_41_1.png)


    Note that although I chose a non-numeric list value, I manipulated the start value
    using a numerical value. Despite the fact that some list representations use letters,
    they are indeed still a numbering system. Therefore the value of a start attribute
    can, if only for simplicity''s sake, represented in a single system: the Arabic
    numerals.'
