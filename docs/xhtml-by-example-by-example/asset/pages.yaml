  md: '# Techniques for Web Content Authororing Guidelines


    # A List is a List Is a List


    Another frustration for visually oriented designers was the lack of ability to
    control margins and indentation within the Web browser. Someone noticed that basic
    lists were traditionally presented not only with bullets or numbers, but with
    at least a tab-stop-worth of indentation. Soon "indents" were being created by
    placing content within a <ul> or <ol> tag (without including any list items).


    Unfortunately, only is not this is valid code (as you learned in Chapter 2, "Adding
    Semantics to Structure," the content model of both ui and ol allows only li elements
    inside), the intended result was never achieved.


    Although many popular browsers treated lists in indented manner, the HTML and
    XHTML recommendations don''t require them to. A visual user agent might simply
    start the list at the left gutter, a screen reader or tactile browser might directly
    tell the user that an ordered or unordered list is about to be presented. When
    no list items follow, the presentation is likely to be confusing.


    The bottom line here is easy: Use lists for lists. Control indentation and other
    layout treatments using style sheets.


    # Tables: Tabular Data or Layout?


    In Chapter 5, "Working with Tables," you worked through several examples that
    provided both tabular structure for data, and contextual information through the
    use of scoping, headers, IDs, and axis. Captions, summaries, headers, and footers
    also add utility to tabular presentations. Many of these features were added specifically
    to enhance accessibility, as we discussed, and should continue to be practiced.


    +   To review the use of these elements and attributes in your table, see "Data
    Alignment—axis and id," p. 95.


    To create the most accessible pages, tabular content is all that tables should
    be for. But even the evangelistic supporter of accessible, structural design will
    often concede that tables have their uses for layout purposes. One of the most
    frequently cited cases is that the left column of navigation information, with
    the main document presented in the right.


    When using this form of table, you can take several steps to ensure usability
    through alternative clients. The contents of each cell should make sense, read
    cell to cell from left to right, top to bottom, or some other combination. Readability
    can be enhanced by enclosing the content within headings, paragraphs, and other
    structural elements, so that the cellular content can stand on its own. This specifically
    precludes tables to create a newspaper-column effect for text.'
