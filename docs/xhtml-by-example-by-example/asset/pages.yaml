  md: '# Planning for Global Entities and Attributes


    Whereas XHTML makes extensive of parameter entities in its DTDs, doing so is not
    required or even necessarily desired for less complicated undertakings.


    When looking at the finished DTD, the entities are, by necessity, all declared
    at the beginning of the document, because they must be defined before being used
    elsewhere. This doesn''t mean, however, that the author of the DTD sat down and
    began by defining several dozen complex entities before declaring a single element
    or attribute list.


    Instead, as a DTD author finds herself repeating the same expressions time and
    again, she should consider using an an entity to save space and time and improve
    the readability of the document. Once the need for the entity is realized, going
    back to the top of the document and declaring it is easy.


    # What''s Next


    In this chapter you have learned how to read DTDs that use the Extended Backus
    Naur Form notation. You know how to write declarations for both elements and attribute
    lists. Entities are used as a powerful means to organize and shorten element and
    attribute declarations.


    Next, in Chapter 14, “XHTML Modularization,” we''ll take a look at another means
    of expressing a language''s rules: XML schemas.'
