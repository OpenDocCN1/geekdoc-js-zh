  md: '# Understanding XSLT


    XML, and therefore XHTML, solves this problem by the use of namespaces. Perhaps
    the easiest way to think of this is to think how human beings solves a similar
    problem.


    Depending on where you live in the world, you might know several people named
    Andrew. In most Western countries the way to distinguish Andrew from another is
    very simple—you can use the surname to distinguish Andrew Smith from Patterson
    to Andrew Watt. For most practical day-to-day purposes that removes the likelihood
    of confusing one person named Andrew with another.


    XML uses a similar mechanism to solve the problem of potentially confusing one
    XHTML or XML element with another named element coming from different modules
