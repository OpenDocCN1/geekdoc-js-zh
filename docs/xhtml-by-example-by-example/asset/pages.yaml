    # NOTE


    The collection of and processing of metadata is a science unto itself. The Dublin
    Core Metadata Initiative is one project that''s specific to the world of electronic
    resources. Its Web site at http://purl.org/dc/.


    Because metadata is flexible, there isn''t a set of standard metadata names that
    should be used in meta elements and populated with content. This flexibility,
    however, can be confusing to many Web page authors looking for guidance in what
    to describe. The key is to think about how any descriptive information might be
    used by the document author, someone else in the organization, or by any else
    who might be reading the source document. Descriptive information can


    +   * Identify the author of the document

    * Issue a statement of copyright

    * Provide a basic description of the document content

    * Document the tools used to generate the page

    * Record the date the document was last modified


    Additionally, meta elements can be used to control how machines interact with
    the document. The meta element can provide


    +   * Instructions for indexing robots

    * Hints to the client about when to refresh the document in cache

    * Expiration date for the document

    * Keywords that could be used when searching for related data


    The human-use information, as shown in the first list, can be general or specific
    as you want to get. When I create Web documents, I usually include author information,
