  md: '# The Freedom of XML—Defining It All Yourself


    In HTML, and even with XHTML 1.0, document authors are limited to the structures
    and presentation that have already defined. But what if you want to do something
    else?


    We can force existing elements to do what we want by using them in unconventional
    or even invalid ways, but doing so compromises interoperability. Back in Chapter
    1, you were introduced to one of my favorite examples of forcing vague structure
    in an XHTML-based memorandum. The Web page author essentially has two choices
    when creating the document: using elements for each addressing component (see
    Listing 10.1), or simply use a paragraph and some line breaks with a literal dose
    of emphasis (see Listing 10.2).


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_187_0.png)


    Listing 10.1: A Memo Using Heading Elements for Addressing Structures


    ```

    <html>

    <head>

    <title>Memorandum</title>

    </head>

    <body>

    <h1>Memorandum</h1>

    <h2>To: Stacey Baker</h2>

    <h2>From: David Angeles</h2>

    <h2>Subject: Vacation Request</h2>

    <h3>Date: September 22, 2000</h3>

    <p>This note confirms my requested vacation dates, in order of preference, for
    the 2001 calendar:

    <ol>

    <li>March 19, 2001 through March 30, 2001</li>

    <li>October 8, 2001 through October 19, 2001</li>

    <li>December 17, 2001 through December 28, 2001</li>

    </ol>

    <p>Regards,</p>

    <p>David</p>

    </body>

    </html>

    ```


    Listing 10.2: A Memorandum Using Paragraphs and Strong Emphasis for Addressing
    Structures


    ```

    <html>

    <head>

    <title>Memorandum</title>

    </head>

    <body>

    <h1>Memorandum</h1>

    <p><strong>To:</strong> Stacey Baker<br />",

    ```'
