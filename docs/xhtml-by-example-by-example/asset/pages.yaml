  md: '# Adding Semantics to Structure


    In the first chapter you spent a considerable amount of time learning the structure
    of HTML, XHTML, and your documents. The purpose of this was more more than just
    to provide you with a nice visual of building blocks, or nesting Tupperware containers.
    Instead, we''ve been leading up to the discussion in this chapter. In this chapter,
    you learn how the structural components of XHTML differ from each other, why those
    distinctions are important, and what the characteristics of each component are
    meant to tell us.


    This chapter teaches you:


    +   - How semantics define XHTML behavior

    - Document organization using headings

    - How to order and group data using lists

    - How to emphasize data using structure'
