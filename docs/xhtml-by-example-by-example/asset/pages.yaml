  md: '# Chapter 10: XHTML as the Bridge to XML


    From just a human-readability standpoint, the XML approach is a bit cleaner; it''s
    clear from well-chosen element names what each of them is supposed to contain.
    From a machine-processing standpoint, the processor won''t really care. But if
    the intention is to build a document management system or build dynamically generated
    documents out of database systems, customized elements make all the difference
    in the world for ease of use and clarity of purpose.


    # The Concept of Well-Formedness


    Well-formedness sounds very stiff, and perhaps a little mysterious. In practice,
    it''s a very simple concept to implement; you simply have to be complete when
    writing your documents.


    The formal definition of well-formedness, as used by the W3C, can be found in
    the XML 1.0 Recommendation at http://www.w3.org/TR/1998/REC-xml-1998021#sec-well-formed.
    It''s a bit of a circular definition, that a well-formed document must:


    +   * Meet the definition of a document.


    +   * Conform to all well-formedness constraints maintained in the XML Recommendation.


    +   * Any parsed entity referenced in the document also must be well-formed.


    That helps, sort of, but still doesn''t tell us what well-formed means. What comes
    next in this section of the XML Recommendation is what we''re really looking for:


    +   * The document must have a DOCTYPE declaration. XHTML user agents must be
    able to tell what kind of document they are receiving. Validating parsers by definition
    also must have access to the document type to process the document.


    +   * The document must contain one or more elements. This is pretty easy. Any
    XHTML document is going to have at least four elements: html, head with a title
    inside, and the body element.


    +   * There is one root element. All XHTML documents begin with the html element
    as their root element.


    +   * No part of the root element can appear as content in any other element.
    This essentially says that the root element has to be the root element. In other
    words, it''s the first element to open, and the last element to close. This is
    well-formed:


    ```

    <html>

    <body>

    ```'
