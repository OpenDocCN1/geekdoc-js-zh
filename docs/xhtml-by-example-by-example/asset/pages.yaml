  md: "# Chapter 12: XSL—Style the XML Way\n\nBecause in our simplified document all\
    \ children of the <book> element are, in fact, <chapter> elements, if the context\
    \ node was the node corresponding to the <book> element, we could achieve the\
    \ same thing by writing\n\nchild::*\n\nin unabbreviated syntax, or\n\n*\n\nin\
    \ abbreviated syntax. Yes, that's right; a simple asterisk will choose all direct\
    \ children of the context node. Note that the * does not select the children of\
    \ such nodes.\n\nSimilar to the XPath expressions for selecting elements, there\
    \ are corresponding expressions to select attributes, which will not be detailed\
