  md: '# Document Type Definitions—The Syntax Rulebook


    Every markup language has a set of rules that must be followed for a document
    to conform to the language. The XHTML language is defined in a set of three documents
    known as Document Type Definitions, or DTDs. You''ve used DTDs already by incorporating
    the document type declaration in your XHTML pages, and you''ve checked your authoring
    work against the DTD using the validation service.


    As XHTML begins to incorporate advanced features such as Modularization, Web authors
    will hold an advantage if they are comfortable working with DTDs. At a minimum,
    you should be able to read a DTD, if not actually author your own.


    This chapter teaches you:


    +   * The syntax used to write DTDs

    * How to declare an element

    * How to create an attribute-list declaration

    * Using Parameter Entities

    * How to resolve parameter entities to fully understand an element and attribute-list
    declaration'
  merge: -1
