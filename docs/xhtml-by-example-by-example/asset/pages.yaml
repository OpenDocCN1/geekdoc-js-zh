- img_proc: true
  md: 'attribute used in XHTML is the align attribute found in the Transitional version
    of the language.


    Attributes are defined in an attribute-list declaration (sometimes shortened to
    "att-list”), which in this instance appears immediately after the element declaration
    in the DTD.


    Attribute-list declarations can occur anywhere in the DTD. In simple instances,
    declaring them immediately after the element for easier reading of the finished
    DTD. However, in more complex larger DTDs many designers find it advantageous
    to declare unused attribute-lists early on, and re-use them throughout.


    A food-related DTD might have an element "soup". An attribute could be used to
    provide the type (for example, chicken noodle, or split pea), whether it''s served
    hot or cold, and any other desired facets. The element is defined first:


    ```

    <ELEMENT soup EMPTY>

    ```


    Then the attribute-list is declared:


    ```

    <!ATTLIST soup CDATA #REQUIRED

    temp (hot | cold) #REQUIRED>

    ```


    After the declaration begins (with the <ATTLIST string), where the attributes
    will be used is noted, followed by the attribute name, the attribute value type,
    and then any necessary keywords. We will take this piece by piece.


    Attributes, like elements, each have a content model, although in fact they''re
    known as attribute value types. There are four major types used in XHTML, which
    we define next (see Table 13.3).


    Table 13.3: Major Attribute Value Types in XHTML


    | Attribute Value Type | Sample |

    |---|---|

    | String Types | A string of characters |

    | Tokenized Types | NMTOKEN, ID, or IDREF |

    | Enumerated Types | A list of fixed values |

    | Entities | An entity defined elsewhere (for example, a URI) |


    STRING DATA TYPES


    String types are pretty simple; the value can be just any string of characters.
    A word is allowed, such as "dog", or a nonsensical string like "wett123iqwre.\
    The string data type is expressed using the keyword CDATA, which means character
    data, or simply a string.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_241_0.png)'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Building Blocks of a Basic DTD


    # TOKENIZED TYPES


    A token is another name for a label. In XHTML


    # NMTOKEN


    The name attribute is used to identify and bind the value of the input into a
    name=value pair for processing by the CGI script. The value of the name attribute
    is a label, or token. When used in this manner, the attribute value is referred
    to as an NMTOKEN, or name token.


    The strings that make up a name token are restricted by three rules:


    +   1. It must begin with a letter.

    2. Only letters, digits, and the characters - (dash), _ (underscore) : (colon),
    and . (period) can be used.

    3. The first three characters cannot be the series xml, in any case variant for
    an example, not xml, XML, xMI, and so on.


    # ID AND IDREF


    There are two additional tokenized types, which can identify individual elements
    or work in concert with each other: ID and IDREF. Whereas NMTOKEN can provide
    a name for an element, there is no requirement that the name be unique. Uniqueness
    is not desirable when you''re trying to match up a set of check boxes on that
    form.


    When you need a unique identifier, the ID attribute can provide that. The naming
    rules are the same as for NMTOKEN, with the added constraint that the name must
    be unique within the document.


    The ID and IDREF types can be used together to provide a logical connection to
    two portions of a document. In a report, if you were to provide footnotes or bibliographic
    references at the end of the document, on paper''s use a superscript number at
    the point of reference, and then the number again when writing the note. If you
    were to create your own elements for this, you might choose an “info” element
    and corresponding note element. Attributes for each would need to hold the unique
    identifier. The markup looks like this:


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_242_0.png)


    ```

    <p>In this paragraph, we''ll have a reference to further information <info reference="1"/></p>

    ...additional content...

    <note item="1">This is the additional information referenced previously in the
    main text.

    --></note>

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 232 Chapter 13: Document Type Definitions—The Syntax Rulebook


    The DTD segment pertaining to these elements and attributes would be written as
    follows:


    ```

    <!ELEMENT EMPTY>

    <!ATTLIST info reference ID #IMPLIED>

    <!ELEMENT note (#PCDATA)>

    <!ATTLIST note item IDREF #REQUIRED>

    ```


    Although this example I have chosen to use a number for the value of the reference
    attribute, the attribute is defined as type ID, so any legal ID string would be
    possible there.


    # NOTE


    You have noticed that the attributes that hold the ID and IDREF have different
    names; that''s okay! What''s important is the matching of the attribute values
    when the first is the type ID and the second IDREF.


    # ENUMERATED DATA TYPES


    The enumerated data type doesn''t restrict values to numbers, as you might infer
    from the name, but instead provides a specific list of potential values. The align
    attribute, found many places in XHTML, is given an enumerated data type. If this
    attribute were defined for the p element, ATTLIST could look like:


    ```

    <ATTLIST p align (left | center | right)>

    ```


    # ENTITIES


    We''ll talk about entities in more detail later in this chapter (see “Parameter
    Entities” and “Planning for Global Entities and Attributes”). At this point, you
    need to know that general entities represent additional content or objects. For
    instance, a URI is an entity, so the src attribute on the img element is an entity
    type attribute.


    # Reading the XHTML DTDs


    The best way to learn how to write DTDs is to study existing documents. Because
    we''ll be working with the DTDs for XHTML in Chapter 16, “Combining Custom Modules
    with XHTML,” going through them now is a good learning exercise. The XHTML 1.0
    Strict DTD is the smallest of the three and can be found online at http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd.


    The beginning of the DTD has has comments, including copyright information, revision
    dates, and system identifiers. After the revision date, a large set of entities
    are defined. These deal with character mnemonics, imported from various RFCs,
    generic attributes, and entities created to represent groups of element names.
    The element and attribute declarations in the section commented as Document Structure
    (see Figure 13.1).


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_243_0.png)'
