  md: '# Integrating the New Module


    # Integrating the New Module


    You''ll remember that for a language to conform as XHTML Host Language, five specific
    conditions need to be met:


    +   1. The document type must be implemented using W3C defined techniques (currently
    DTDs).


    +   2. It must conform to the stated naming rules when choosing its unique identifier.


    +   3. The language must contain at least the Structure, Hypertext, Basic Text,
    and List modules.


    +   4. None of the W3C-defined modules can be reduced or subsetted. All defined
    elements, attributes, and required minimal content models must be included.


    +   5. Any new elements and attributes are defined in their own spaces.


    To aid language designers, the W3C has provided a DTD template that can be used
    as a guide to creating conform DTDs. It can be found online at http://www.w3.org/TR/xhtml-modularization/DTD/templates/template.dtd
    and is reproduced here in Linking 16.2. We''ll edit each segment along the DTD
    for our new language.


    Listing 16.2: The New DTD Template


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_290_0.png)


    ```

    <---

    <!-- SKELETON DTD -->

    <!-- file: TEMPLATE.dtd -->

    -->

    <!-- SKELETON DTD -->

    This is a skeletal driver file. Modify however you want, paying careful attention
    to the embedded comments about order.


    Please use this formal public identifier to identify it:


    "-//W3C/DTD XHTML MYTD//EN" -->

    <!ENTITY % XHTML.version "-//W3C/DTD XHTML MYTD//EN"> -->

    <!-- Bring in any qualified name modules outside of XHTML -->

    <!ENTITY % qname.mod ""> -->

    <!-- Define any extra prefixed namespaces that this DTD relies upon -->-->

    ```'
