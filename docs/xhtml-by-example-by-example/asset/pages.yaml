- img_proc: true
  md: '# Chapter 13: Document Type Definitions—The Syntax Rule


    # Building Blocks of a Basic DTD


    A DTD can be as simple as a single element declaration, provided, of course, that''re
    satisfied writing a document using just a single element! Before we can begin
    building or reading DTDs, you must understand the notation used.


    # EBNF: The Syntax of DTDs


    DTDs are primarily intended for machine consumption, not human. When working with
    machines, success often depends on being extremely concise. In the early days
    of computing, 1960 to be specific, two computer scientists devised a formal notation
    that described the syntax of the ALGOL60 computer language. The notation was named
    after the pair, and known as *Backus Naur Form*.


    Over the years as the complexity of computer languages increased, the notation
    also became more complex. In its current state, it''s called *Extended Backus
    Naur Form*, or EBNF.


    Each syntax description is presented in the same basic form:


    ```

    symbol ::= expression

    ```


    The characters `::=` should be read *defined as*. A common example used to demonstrate
    this is the set of letters known as vowels:


    ```

    vowels ::= [aeiou]

    ```


    This rule would be read as “The vowels defined as the lowercase letters a, e,
    i, o and u.” If you didn''t care which case was used, both versions are included
    in the expression:


    ```

    vowels ::= [aeiouAEIOU]

    ```


    Expressions aren''t limited to lists as we''ve written here. Ranges of values
    can also be used. For instance, the first ten letters of the alphabet, in lower-case,
    might be described as:


    ```

    FirstTen ::= [a-j]

    ```


    # Grouping Items Within Expressions


    To be useful, descriptions must be able to handle more than sequential characters
    and numbers. To accomplish this, we must be able to give instructions such as
    “and,” “or,” and “one but not the other.” I''ll call these constructions *complex
    expressions.


    The first complex expression we''ll look at is “or.” Consider that the symbol
    “Today” can be defined as “Monday,” “Tuesday,” “Wednesday,” “Thursday,” “Friday,”
    “Saturday,” or “Sunday,” depending on the day of the week. To write that in EBNF,
    we say:


    ```

    Today ::= (Monday | Tuesday | Wednesday | Thursday | Friday | Saturday | Sunday)

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_237_0.png)


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_237_1.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Building Blocks of a Basic DTD


    This would be read as “Today” is defined as Monday, Tuesday, Wednesday, Thursday,
    Friday, Saturday, and Sunday.


    An instance you might be more likely to see in a DTD is the definition of white
    space. White space in XML applications (which includes HTML) is defined as a space,
    a tab, a newline character, or a linefeed. If S was the symbol for white space,
    the notation would be written as follows: S := (#x28 | #x9 | #x0 | #a )


    The values shown are the hexadecimal numbers representing the characters in the
    ASCII charts (hex being a popular machine-read representation). The + character
    outside the parentheses indicates one or more of the enclosed values. You would
    read this notation as follows:


    “White space is defined as one or more space, tab, newline, or linefeed characters.


    There will certainly be times when it’s more succinct to define a symbol by what
    it doesn’t contain than by what it does. For instance, “Weekdays” is defined in
    a less verbose fashion by saying “All days except Saturday and Sunday” instead
    of “Monday, Tuesday, Wednesday, Thursday, Friday.” EBNF provides for these exceptions
    using an exclusion set. The weekdays would be written as follows:


    ```

    weekdays ::= [ Saturday Sunday ] | Week

    ```


    The exclusion set is bound by the bracket characters [ ], and the caret indicates
    the beginning of the set. The entire expression is predicated on the subject (Week)
    having previously defined.


    Finally, we can express constraints such as “one, but not the other” and “either/or.”


    # Defining Elements


    Elements are the basic building blocks of the document. Before an element can
    be used in a markup language, it must be declared (defined) in the DTD. The basic
    syntax for the declaration looks like this:


    ```

    <!ELEMENT name ContentModel>

    ```


    Name, in this expression, is the name of the element being defined. The content
    model is an expression of what the element can contain. With your knowledge of
    HTML, and the XHTML you learned so far, you know that some elements can contain
    other elements, whereas others can just contain text, and can’t contain anything
    at all. These constraints on content are known as content models, and every element
    has one.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Chapter 13: Document Type Definitions—The Syntax Rule


    XML, and therefore XHTML, has four basic content model types, shown here in Table
    13.1.


    Table 13.1: Content Models Found in XHTML


    | Content Model | Allowable Content |

    | --- | --- |

    | Empty | No content is allowed (for example, img, hr, br) |

    | Any | Any type of content is permitted (not found in XHTML 1.0, rarely used)
    |

    | Element | Only other elements are permitted (for example, ul only allows elements)
    |

    | Mixed | Elements and data can be present (for example, p can contain em and
    strong, but also text) |


    The Empty model says that no content is allowed in the element. Probably the most
    familiar example is the img element. It''s also the easiest content model to declare.
    The actual img element declaration in the XHTML 1.0 DTDs looks like:


    ```

    <!ELEMENT EMPTY>

    ```


    This was pretty easy to read, although I will say they can get a little more complex.
    Let''s look at an element that has been given the content model: the unordered
    list element (ul).


    ```

    <!ELEMENT ul (li+)>

    ```


    The content model expression should be familiar to you from our previous discussion
    of EBNF. This declaration says that the element ul must contain one or more instances
    of the li element.


    The + symbol used in the ul element declaration is known as an occurrence indicator.
    There are three indicators commonly used in DTDs, as seen in Table 13.2.


    Table 13.2: Occurrence Indicators Used in DTDs


    | Occurrence Indicator | Definition |

    | --- | --- |

    | ? | Element is optional (zero or one occurrence) |

    | * | Element is optional, and can be repeated (zero or more occurrences) |

    | + | Element is required, and may be repeated (one or more occurrences) |


    More than one element can be found in an Element-type content model. For instance,
    the table row element, tr, can contain one or more of the th and td elements.
    The element declaration for tr, would be written as follows:


    ```

    <!ELEMENT tr (th|td)+>

    ```'
