- img_proc: true
  md: '# Chapter 3: Working Images


    # Image Formats for the Web


    For many years only two image formats were supported by Web browsers: GIF and
    JPEG. Today, a third option, known as PNG, has been added. Each format has its
    own strengths and weaknesses, which we''ll review here, and we''ll take a quick
    tour of popular image-editing tools.


    # GIF Images


    The most common format used for non-photographic images is GIF (Graphics Interchange
    Format). GIF is a bit-map image, meaning that the image is "mapped" pixel by pixel.
    The information in the bit-map can be compressed when neighboring pixels have
    the same color values, using what''s essentially a form of digital shorthand.
    This allows the image file to be considerably smaller when stored, saving space
    on the Web server and bandwidth when the image is delivered to the site visitor.


    GIF images do some limitations, the most notable being the 256 unique colors within
    the image. Frankly, this 256-color palette is not a static set of colors, but
    may be any 256 colors that work best within the image. This limited, though flexible,
    palette makes GIF the ideal candidate for graphics with large blocks of color,
    as often seen in logos, buttons, and banners.


    Controversy over the GIF format arose in the early days of the Web, with the company
    that owned the LZW compression algorithm used in GIF asserted that it owed significant
    licensing rights from any software publisher produced tools could publish GIF
    images. The end creator of an image generally doesn''t owe any licensing fees,
    but in part because of the fury over this issue, the W3C began on an open-source
    (royalty-free) image format known as PNG (Portable Network Graphics). Support
    for this image format is increasing, but PNG isn''t nearly as supported as GIF.


    # NOTE


    To learn more about PNG, visit the W3C Web site at http://www.w3.org/Graphics/PNG/.
    And see the "Images—the Web''s New Format" section later in this chapter.


    # JPEG Images


    The JPEG format, short for Joint Photographic Experts Group, was specifically
    designed for digital storage of photographic images. JPEGs (sometimes referred
    to as JPEGs) can use up to 16.7 million colors instead of GIF''s relatively paltry
    256. The compression algorithm used by JPEG is known as a lossy technique, meaning
    that information is literally thrown away'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'the process of compressing the data. A low compression rate preserves the highest
    quality, while a higher compression rate removes more information. With a photograph,
    this doesn''t have much impact on image quality when using a low to moderate compression
    level, especially when viewed on a computer screen with the monitor''s relatively
    low pixel-per-inch resolution.


    # PNG Images—The Web''s Newest Format


    Out of desire both to supplant the need to use images with proprietary, and at
    times costly, compression schemes as GIF, and demand for enhanced color depth
    and transparency support, the W3C set out to create a new image format. The result
    was PNG (Portable Network Graphics).


    A lossless format, PNG combines the strengths of GIF and JPEG, and provides sufficient
    additional features and it holds the best for high quality, interoperable images
    on the Web. Adoption has been a bit slower than many designers had hoped for,
    primarily due to lack of native support within the many browsers. However, such
    support arrived with the release of Netscape Navigator 4.5 and Internet Explorer
    4, and PNG is rapidly finding its way onto the map.


    # Web Graphics Editors


    Graphics editing tools run the gamut in price from free to well more than $500.
    It''s certainly not necessary to spend that kind of money to produce a good-looking
    site, though using a free or low-end package might require a bit more effort and
    raw artistic talent as they''ll be unlikely to offer many features as the more
    sophisticated programs.


    The availability of quality image editors for the Windows platform has grown rapidly
    over the last two to three years. No longer are PC fans stuck with last-generation
    software while their Mac counterparts have the cutting-edge features in their
    versions:


    +   * Microsoft Paint—This basic editor ships with the Windows operating system.
    It''s limited in file format support (bitmap, GIF, and JPEG only), but is functional
    for those just getting started or the occasional doodler.

    * JASC Paint Shop Pro—PSP had its beginnings as shareware. JASC now releases a
    fully functional 30-day trial that lets users drive the package before purchasing
    the $89 retail version. Many developers favor PSP for its consistent quality and
    expanding features at an affordable price (Windows only).

    * Macromedia Fireworks—Macromedia has made enormous progress in the Web development,
    animation, and graphics generation map.'
