  md: '# Tools That Support XHTML


    polish up XHTML files written by hand or HTML-based authoring tools.

    Three utilities incorporating the same base program are featured here.


    # HTML Tidy


    The W3C has published a tool that helps authors clean up HTML files and format
    them for XHTML (as well as XML). It''s a very powerful utility, one that can be
    somewhat opaque when you''re first learning how to use it. Written by engineers,
    in the command-line format that so many of them love, it''s not the most user
    friendly of programs for those who view DOS as something out of the history books
    and rarely ever encounter a Unix system. In other words, quite a few of!


    # NOTE


    The supporting Web site for HTML Tidy, including links for downloading the various
    ports of the program, can be found at http://www.w3.org/People/Raggett/tidy/


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_178_0.png)


    A fairly standard usage has Tidy modifying the source document in place as necessary,
    and recording the changes and errors present in a separate text file. To initiate
    this operation, the following instruction is given at the command line:


    ```

    tidy -f errors.txt -m file.html

    ```


    Taking this command apart piece by piece, we start by invoking the program itself
    with tidy. The flag -f or switch before errors.txt tells Tidy that it needs to
    create a file named errors.txt, to which the output of the program will be written.
    The second flag -m tells Tidy to modify the input file, represented by file.html.
    A successful run through Tidy will result in the report seen in Figure 9.2.


    To do anything more than tidying of your source files, you will need to create
    a configuration file. This text file consists of a list of properties separated
    by their corresponding value by a colon. Listing 9.1 shows a basic configuration
    file that could be used for converting source documents to XHTML


    Listing 9.1: config.txt, A Configuration File to Be Used with HTML Tidy


    ```

    wrap: 72

    markup: yes

    output-tags: no

    output-attributes: no

    char-encoding: utf8

    error-file: errors.txt

    ```'
