  md: '# Chapter 12: XSL—Style the XML Web


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_229_0.png)


    Figure 12.2: The XHTML output in Internet Explorer following transformation of
    the XML source document.


    Here is the XSL style sheet which produced that output:


    ```

    <?xml version="1.0" ?>

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    version="1.0">

    <xsl:template match="">

    <html>

    <head>

    <title>

    Shakespeare Quotation

    </title>

    </head>

    <body>

    <xsl:apply-templates/>

    </body>

    </html>

    </xsl:template>

    <xsl:template match="famous_quote">

    <h1><xsl:value-of select="."//></h1>

    </xsl:template>

    </xsl:stylesheet>

    ```


    To help you understand the style sheet and how it works, we will go through key
    parts of it line by line.


    ```

    <?xml version="1.0" ?>

    ```


    This is the XML declaration which is advisable in XSL transformation sheets but
    not compulsory.


    ```

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    version="1.0">

    ```'
