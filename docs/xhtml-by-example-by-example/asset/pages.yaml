  md: '# 46 Chapter 3: Working Images


    Fireworks integrates with the entire Macromedia line of products, making it natural
    for those who choose their authoring tools. It is flexible enough, however, to
    play nice with other publishers'' systems, too. Retail price (as this book went
    to print) was $199.00 (Windows/Mac).


    +   * Photoshop—Long the workhorse of the graphic artist world, Adobe Photoshop
    remains the favorite among Web developers coming from an art and design background.
    At a suggested retail price of $609.00, it remains out of reach of many individual
    developers (Windows/Mac).


    # Adding Graphics Using the Image Element


    The element in XHTML is considered an inline element. This means that it can be
    contained within block elements such as paragraphs. It also means that the image
    will literally be rendered "in line," right where the tag is placed within the
    document. The minimal required syntax for the image element has two attributes:
    src for the source URL of the image element, and alt for the alternative text
    to describe the image:

    <img src="myfile.jpg" alt="A photo of the author">


    Practically, at least two additional attributes are needed: height and width.
    These attributes hold the vertical and horizontal measurements of the image, expressed
    in pixels. When present, these values allow the browser to "reserve" the space
    required for the image as it renders the rest of the page, which results in images
    appearing to "fill in" after the text has been displayed. The end result is a
    page that gives the appearance of loading faster, which can result in fewer impatient
    visitors leaving your site before the content can be displayed.


    The following example puts a single image inline within a paragraph, with the
    image reserved using the height and width attributes (see Figure 3.1):


    ```

    <img src="fmb.jpg" height="200" width="300" alt="A view of the beach from the
    10th floor landing of my hotel." /> I recently hosted two days of meetings at
    the DiamondHead Resort in Fort Myers, Florida. This is the view of the beach from
    the 10th floor landing of the hotel.

    Another day in paradise - just the road from my home!</p>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_57_0.png)'
  merge: -1
