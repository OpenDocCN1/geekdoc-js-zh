  md: '# Adding Graphics Using the Image Element


    The initial results, shown in Figure 3.6, have two issues that might need to be
    addressed: There''s a bright blue border around the images, and white-space between
    each of them.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_62_0.png)


    Figure 3.6: A basic set of linked images.


    The bright blue border is the browser indicating each image is a link, just as
    text links are colored blue and underlined by most visual browsers. It does tend
    to interfere with the look of the buttons, though, so it can be removed by adding
    a border attribute to the image element. Setting the value to "0" (zero) tells
    the browser to turn the border off:



    ```

    <img src="opt1.gif" alt="option 1" width="100" height="60" border="0" />

    ```


    Next, to address the spacing between images, we can move each of the anchors onto
    the same line of text in the source HTML document. Browsers properly interpret
    the new line or carriage return/new line characters many Windows- or Mac-based
    text editors produce as white space. Removing those by writing the links on a
    single line will then remove the white space (see Figure 3.7).'
