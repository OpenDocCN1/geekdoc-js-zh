  md: '# Understanding XSLT 201


    the prolog of the XML document, consisting of the XML declaration (where

    present), processing instructions, the DOCTYPE declaration (where present),

    and any comments you might choose to include.


    All the content of an XML document is viewed, from the perspective of XML

    1.0, as being contained within the document entity. The root element is a

    child of the document entity.


    Sometimes the root root is used in an unqualified way to refer to either the

    document entity or the root element. Because, as you will see later in the

    chapter, it is important in navigating through XML documents to know

    exactly where you are, need to be sure where any particular element is

    relative to the document entity and the root element.


    The prolog of an XML document precedes the root element but is contained\within
    the document entity. The prolog might contain an XML declaration,

    processing instructions, comments, and the DOCTYPE declaration. It is in the

    prolog that you can use a processing instruction to attach an XSLT style

    sheet to an XML or XHTML document, as you will see later.


    There is very much to XML 1.0 than has been mentioned, here, but

    this basic information is needed for you to understand the discussion of

    XSLT, XPath, and XSL-FO which follows.


    The full text of the Extensible Markup Language (XML) 1.0

    Recommendation can be viewed at


    ```

    http://www.w3.org/TR/1999/REC-xml-19981210

    ```


    # XSLT and Other Pieces of Jigsaw


    Originally, the concept for displaying XML documents was that the

    Extensible Stylesheet Language (XSL) would perform for XML documents a

    function similar to that which external Cascading Style Sheets performed

    for HTML pages. As the World Web Consortium (W3C) worked

    through the details of possible style sheet languages, as they might apply to

    XML rather than HTML, it became clear that transformation of a source

    XML document was foundational to presentations of XML.

    There were perceived technical advantages at the time to separating work

    on transformations.


    Thus, the W3C focussed on the transformational aspect of Extensible

    Stylesheet Language and was able to complete a solution and release it as

    the XSL Language Transformations (XSLT) Version 1.0 Recommendation on

    November 16, 1999.


    If you want to see the full scope of XSLT, the text of the Recommendation is

    available at


    ```

    http://www.w3.org/TR/1999/REC-xslt-19991116

    ```'
