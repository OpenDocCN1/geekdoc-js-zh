  md: '# Chapter 5: Working Tables


    you be able to match the data with the header? XHTML provides several attributes
    that can be added to TH and TD elements to provide this identify-information.


    To illustrate, let''s build a small table that sorts what my family ordered the
    last time we went to dinner. Each of our choices for entrée, beverage, and dessert
    are listed.


    The table begins as all others do, with the table element and a caption: <table
    border="1" summary="What the Navarro Family had for dinner at Los Amigos >Restaurant"><caption>Dinner
    at Los Amigos</caption>


    The next segment is the first table row, with the header cells. Each TH element
    is given an id attribute with a unique value, as all IDs are required to be:


    ```

    <tr>

    <th id="c1">Name</th>

    <th id="c2">Entrée</th>

    <th id="c3">Beverage</th>

    <th id="c4">Dessert</th>

    </tr>

    ```


    Now in each subsequent row, a headers is added to the TD elements, binding them
    to the appropriate column header:


