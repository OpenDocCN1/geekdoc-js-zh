  md: '# Chapter 3: Working with Images


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_65_0.png)


    Figure 3.9: The CuteMAP user interface.


    We''ll begin with the island of Kauai, in the upper-left corner of the map. There''s
    plenty of room around it, so a rectangle is both easy and practical here. Select
    the Rectangle marking tool from the toolbar (see Figure 3.10). The pointer will
    turn into cross hairs.


    Position the pointer where you want the upper-left corner of the rectangle to
    be. Click and drag down to the lower-right corner of the rectangle, and then release.
    The area covered by the new hot spot is framed by a red crosshatch pattern. In
    the data pane, enter (at a minimum) the URL and alternative text for the link—in
    this case, kauai.html and Island of Kauai, respectively (see Figure 3.11).


    Repeat for each of the remaining islands, choosing the shape that fits best around
    the island, without overlapping with any other shapes. For Oahu, to the right
    of Kauai, a circle works well. Molokai can take a rectangle, as Hawaii has. Maui,
    on the other hand, will work best with a polygon, so we can avoid overlapping
    with the right side of Molokai''s spot.


    To create the polygon, select the Polygon marking tool. Click once where you want
    to begin, and again for each corner of the polygon. Notice that once you''ve placed
    two points, the polygon changes shapes as you move and place additional corners,
    rather like a rubber band being stretched around a set of pegs. When you''re finished,
    right-click to indicate the final corner.'
