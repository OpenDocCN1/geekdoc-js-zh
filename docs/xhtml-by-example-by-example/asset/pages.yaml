  md: '# About the Author


    **Ann Navarro** is chief operating officer for the HTML Writers Guild, the world''s
    largest organization of Web developers and Internet enthusiasts. Active in the
    Web Development community for more than five years, Ann is the author of three
    other books on HTML, XML, and related topics, including HTML by Example (Que,
    December 1999). She is an active member of the W3C''s HTML Working Group, the
    group charged with crafting the XHTML Recommendations. Ann also provides executive
    direction as CEO and founder of WebGeek, Inc., a privately held Web and Internet
    consulting firm. She currently lives in Port Charlotte, Florida, with her husband
    Dave and Dizzy the cat, where they enjoy snorkeling and have spent far too many
    hours crawling around the attic running ethernet cable in the new house.


    # About the Contributor


    **Andrew H. Watt** (chapters 12, 19) is an independent consultant who specializes
    in Web technologies, including XML, XHTML, Domino, and Java. Previously he wrote
    the XML section of Platinum Edition Using XHTML, XML, and Java 2.'
