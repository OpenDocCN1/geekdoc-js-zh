  md: '# 330 Chapter 19: Next Steps for XHTML


    The W3C working group that is working to develop XForms has identified a number
    of key requirements for the next generation of Web forms that include


    +   - Ease of migration

    - Improved interoperability and accessibility

    - Enhanced client/server interaction

    - Advanced forms logic

    - Support for internationalization

    - Greater flexibility in presentation


    In the current draft, the working group expresses the view that it will not be
    possible to maintain full backward compatibility with previous generations of
    Web browsers. Currently, it is not entirely clear to what extent and in what situations
    problems arise because of such lack of backward compatibility.


    In line with the principles of XML, increasingly being implemented in XHTML, it
    is desired that content and presentation within XForms be separated.


    The increasingly global nature of e-commerce and e-business demands that internationalization
    of forms be achieved to a degree that would have been of specialized interest
    only a few years ago.


    It is likely that XForms will include capabilities for advanced forms logic, which
    are absent from the current generation of forms.


    Because XForms will be based on XML and XHTML, the possibility exists of sophisticated
    use with other XML-based technologies such as the Scalable Vector Graphics (SVG)
    specification in “Last Call” Working Draft and the Synchronized Multimedia Integration
    Language (SMIL) Recommendation. Graphics-rich and multimedia-capable forms might
    provide user experiences that are currently difficult to envisage. Because all
    these technologies are XML-based, the possibility will also exist to use Cascading
    Style Sheets and Extensible Style Language (XSLT and XSL-FO) to control aspects
    of presentation.


    The facilities to be provided by XForms on different platforms will, quite differ
    greatly. On a mobile browser with a tiny screen, the priority might be to get
    an XForm to work at all, whereas on a large monitor attached to a computer with
    a high bandwidth connection to the Web very rich graphical and multimedia user
    experience is likely to be possible.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'As well as providing enriched output, at least for some users, it is likely
    that XForms will provide an increased number of options for data input. For example,
    it might be possible to input data using a voice-enabled browser, a facility potentially
    very useful for those with Repetitive Strain Injury or for call centers where
    employers want to avoid staff health problems of that type.


    Currently many HTML and XHTML forms have either no error checking or custom scripting
    provides error checking. XForms aim to provide error checking by standard means
    that will, for example, reduce errors in inputting postal codes and telephone
    numbers. In e-commerce situations checking of credit card numbers for validity
    and so also might be very useful functionality as a prelude to more definitive
    credit checking. The anticipated increased efficiency of forms development using
    XForms compared to using traditional forms custom scripting might produce both
    time and cost benefits.


    The anticipated facility to manipulate XForms using the XML Document Object Model
    opens up new possibilities in data manipulation.


    Another capability that might be highly desirable in certain circumstances would
    be the ability to suspend the filling in of form part through the process. Imagine
    if you were filling your tax return online or a lengthy proposal form to obtain
    life insurance but were unable to complete it because one piece of information
    could not be found. With current forms, you either complete filling out the form
    or lose the work already done. XForms might provide the capability to suspend
    form without losing data already entered.


    XForms borrow a concept from client-server technology and split forms into three
    layers—presentation, logic, and data. This closely mirrors the concepts of n-tier
    server-based applications.


    It is likely that on XForms will result in the sequential production of various
    XForms modules, starting with a Core module. Use of modules in XForms is likely
    to be associated closely with the modularization of XHTML, discussed in Part III,
    "Modularization."


    In this chapter you have been given a taste of what form part of the spectrum
    of future uses for XHTML and XML. Exciting new possibilities arise with such developments.'
  merge: -1
