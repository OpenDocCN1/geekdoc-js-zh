    # Image Maps


    The Web site of one of my favorite public places, the Monterey Bay Aquarium, features
    three separate image maps on its home page; two “navigation bars,” and a third
    based on a composite collage image (see Figure 3.8). Both versions use the same
    techniques; the collage image simply lets the designer break out of the grid-like
    effect that using individual images as links can produce.


    The basic idea behind an image map is that specified regions of the image are
    identified as *hot spots* by mapping their coordinates to a linked URL using the
    `<area>` element. The browser captures the exact coordinates of the spot where
    the mouse-clicks within the image, and activates the corresponding link.


    Hot spots can be drawn in one of four ways:


    +   * **Rect (rectangle)**—Two coordinates are used to draw a rectangle: the upper-left
    corner and the lower-right corner.

    * **Circle**—Three values are used: the x/y coordinates of the circle’s center
    point, and the radius length.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   * Poly (polygon)—At least two sets of x/y coordinates, with the last set
    holding the same values as the first, close the polygon.


    +   * Default—Not a shape so much as the set of all coordinates on the image that
    are not otherwise defined in a hotspot.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_64_0.png)


    Figure 3.8: An image collage used as a navigation map.


    # TIP


    Although it is possible to create your maps by hand, even the most talented Web
    author will need the assistance of a graphics editor to measure the coordinates
    of the shapes they intend to utilize. To that end, for day-to-day work, most of
    us use soft-ware that can produce the XHTML code for the map at the same time.


    # Creating an Image Map with CuteMAP


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_64_1.png)


    By launching the map editor. Start a new map definition by choosing File, New
    Map and locating the image you''ll be working on within the Open dialog box. CuteMAP''s
    interface consists of three panes (see Figure 3.9). The image is displayed in
    the largest pane, with a source beneath it. To the left is a data pane, where
    you''ll enter the URL, alterna-tive text, and other data associated with each
    hot spot within the map.'
