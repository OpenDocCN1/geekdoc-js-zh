  md: "# Creating the Module Using DTD\n\nThe DTD implementation of a module actually\
    \ consists of two smaller modules referred to as sub-modules: a QName module and\
    \ a Declaration module. We'll take a look at both in this section.\n\n# Working\
    \ with QNames\n\nQNames is an XML term for qualified names. Qualified names are\
    \ constructed when XML Namespaces are used to differentiate elements from more\
    \ than one markup language. For instance, XHTML has a title element's used to\
    \ give a title to the document. Some other language might use a title element\
    \ to refer to a person's rank or other salutary title such as Doctor, Reverend,\
    \ or even Her Royal Highness.\n\nXML Namespaces identify which language element\
    \ belongs to through the use of a prefix appended to the element. The XHTML title\
    \ element, when using its fully qualified name would be written as xhtml:title.\n\
    \nThe QName module contains parameter entities (PEs) that are used to store the\
    \ QNames of the elements to be defined in the Declaration module for those times\
    \ in which the elements must be presented in the qualified form.\n\n# NOTE\n\n\
    For more on XML Namespaces see: http://www.w3.org/TR/REC-xml-names/ or XML by\
    \ Example, also published by Que.\n\nThe QName sub-module begins with a commented\
    \ section that details the module name, its filename, the public and system identifiers\
    \ used to refer it, and the namespace declaration. Putting each of these in place,\
    \ our QName sub-module begins like this:\n\n```\n<!--\n  <!-- Recipe QName Module\n\
    \  <!-- file: recipe-qname-1.mod -->\n```\n\n```\n  PUBLIC \"//Webgeek.com//ELEMENTS\
    \ XHTML QNames 1.0//EN\"\n\n  SYSTEM \"http://www.webgeek.com/DTDs/recipe-qname-1.mod\"\
    \n```\n\n```\nxmlns:recipe=\"http://www.webgeek.com/xmlns/recipe\"\n```\n\nSeveral\
    \ conventions have been used in this section. First, the sub-module file is named\
    \ with the suffix .mod, which will correlate to the parameter entity suffix used\
    \ to identify it later when pulling the module components together. Next, the\
    \ Formal Public Identifier (FPI) must take a specific form."
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Creating the Module Using a DTD


    267


    The string will always begin with the // characters. The next portion identifies
    the company or individual who owns the module—in this case, company WebGeek, Inc.
    Another set of // characters, then the word ELEMENTS in capital letters, followed
    by the title and version of the module. A final set of // characters chose the
    string, for a complete FPI of

    "//WebGeek/ELEMENTS XML Qname 1.0//"


    The system identifier is a URI where the file entity for the module might be found.
    It might be expressed in fully qualified form, or as a relative URI when working
    locally. In this case, we''ve chosen the former:

    SYSTEM="http://www.webgeek.com/DTDs/recipe-qname-1.mod"


    Finally, the XML Namespace is always declared in two parts: the prefix followed
    by a short string that will be used throughout as a token representing the full
    URI given in the second part of the declaration,

    xmlns:recipe="http://www.webgeek.com/xmlns/recipe"


    The URI used to represent a namespace doesn''t necessarily anything to be found
    if you attempt to access it as a URL on the Web. It is used only as a name.


    Next we begin defining the entities that will be used by the XHTML Framework to
    help construct the final DTD. The first sets whether or not the elements in the
    new module will use their namespace-qualified names. By default, this option is
    set to "IGNORE"

    <!ENTITY NS.prefixed "IGNORE">


    This entity has a corresponding PE identified for this specific module:

    <!ENTITY Recipe.prefixed "NS.prefixed;"


    This prefixed parameter entity is created to allow an override, forcing a document
    instance to prefix all elements with their namespaces.


    The actual namespace of the module is declared. Namespaces are probably the most
    difficult concept to get your thoughts around working with Modularization. I''ll
    try and explain the purpose of this namespace-qualification work coming up.


    XHTML Modularization goes to great lengths to define an environment where traditional
    XML DTDs can be used with or without support for XML Namespaces. The mechanism
    used for this is officially called the "name-space hack."


    That mechanism defines series of steps, described in this and next chapter, that
    permit the development of document types that adhere to the requirements of XML
    Namespaces if a document author wants to use Namespaces. It also permits the author
    to ignore XML'
