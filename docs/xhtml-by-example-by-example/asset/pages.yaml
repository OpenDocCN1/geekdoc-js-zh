  md: '# Understanding XSLT


    It''s possible to use XHTML 1.0 pretty much as if it were simply HTML. But to
    obtain full benefit from XHTML''s compliance with XML, you will need to begin
    learning aspects of XML which have no direct equivalent in HTML or XHTML 1.0.


    One of the most powerful technologies in the XML family is Extensible Stylesheet
    Language Transformations, usually abbreviated to XSLT.


    # XML 101


    Before diving into XSLT, you will need to understand a few points about XML that
    are relevant to how XSLT works.


    The XML family of technologies is very flexible, which can be very useful because
    there are many ways of achieving the same thing and many solutions that can be
    found. But flexibility, using various ways to achieve the same or similar output,
    can be confusing until you get a clear picture about the advantages and disadvantages
    of different approaches.


    The element is a foundational part of XML. Each element that has content has a
    start tag and an end tag.


    For, if you wanted to use a particular piece of text in an XSL style sheet, you
    might use this element:


    ```

    <xml:text>text</xml:text>

    ```


    The start-tag is <xml:text>. The end-tag is </xml:text>. And, not-surprising the
    content is to be or not to be?


    When a tag is nested within another tag, the outer tag is said to be the parent
    and the contained tag is said to be the child. For example, in this example XML
    document, the <chapter> element is the parent of the <paragraph> element:


    ```

    <xml version=''1.0''?>

    <chapter>

    <paragraph>The paragraph element is a child of the chapter element.</paragraph>

    </chapter>

    ```


    Each XML document is allowed to have only one root element—an element within every
    other element in the document is properly nested. In the example, which you have
    just seen, the root element is the <chapter> element.


    The root element (or element root) is not the root of the whole document. Outside
    of the root element but still within the document, for example,


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_211_0.png)'
