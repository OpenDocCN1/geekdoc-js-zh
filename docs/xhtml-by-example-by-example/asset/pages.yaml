    # The Core Modules


    Each of the four modules defined here are required to be present for the document
    type to be Host Language Conformant.


    Each table lists the elements, corresponding attributes, and minimal content model
    for each element in the module. The minimal content models for each element might
    be expressed using EBNF notation.


    # Structure Module


    The Structure Module defines the major structural components of all XHTML documents.
    The root element, html, is defined here:


    | Element | Attributes | Minimal Content Model |

    | --- | --- | --- |

    | body | Common | (Heading|Block|List)* |

    | head | I18N, profile (URI) | title |

    | html | I18N, version (CDATA), xmlns (I18N) | head, body |

    | title | I18N | PCDATA |'
