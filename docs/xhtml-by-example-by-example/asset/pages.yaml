  md: '# Validating XHTML Documents


    Before making your Web pages accessible to the public, you''ll want to take several
    steps to make sure they''re in the best shape possible. They should be run through
    a spell-checker, a proofreader can help with grammar, a copy editor might be employed
    to help out, and your pages might need to go through several levels of managerial
    approval if you''re working on a company site. All of these tasks are necessary
    in many cases, but one more check should be made before “going live”: validation.


    This chapter teaches you:


    +   - What validation means

