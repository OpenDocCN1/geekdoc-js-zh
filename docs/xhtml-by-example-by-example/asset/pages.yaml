    # # Emphasizing Important Content


    Readers are familiar with conventions used to point out portions of text that
    the author or publisher feels deserve special attention. XHTML provides several
    methods of demarking content both inline within larger blocks, and as a distinct
    block in and of itself.


    # ## Inline Emphasis


    Two of the most means of providing emphasis in traditional print media are the
    use of **boldface** or *italic*. Both of these choices have strict presentational
    semantics attached to them: the change in font weight and style.


    Emphasis in HTML first began with the `<em>` element for emphasis, and the `<strong>`
    element for strong emphasis. By tradition, the major browsers would render `<em>`
    as italic and `<strong>` as boldface. But many developers derived some assurance
    that with these presentations their intentions wouldn''t be tampered with. As
    a result, the `<i>` and `<b>` elements were introduced for italic and boldface,
    respectively.


    However, in XHTML we''re moving away from the presentational aspects of HTML,
    and retaining the structural markup instead. The `<i>` and `<b>` elements are
    available to you, provided you use the XHTML 1.0 Transitional doctype. They remain
    deprecated in favor of the structural'
