  md: '# Chapter 2: Adding Semantics to Structure


    This structure doesn''t require specific ordering, but it does depend on having
    a collection of individual data points that form a group. Data points within groups,
    then, are generally presented in list format, be that delimited by bullet points,
    numbers, letters, commas, spaces, or any other identifiable characteristic presentation.


    It''s important to remember here that a list has both semantics and structure.
    A list is not just about its delimiting characters. Its functionality is defined
    by both the bounding of the data into a group (the structure), and then by the
    presentation of the individual units within the group (the semantics).


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_37_0.png)


    In XHTML, we have the same three major list types as found in HTML 4: unordered
    lists, ordered lists, and definition lists.


    # Unordered Lists


    An unordered list is a representation of a data collection where the individuals
    have no relative order or position. For instance, the coins in my wallet have
    no specific order to them, and they could be described using an unordered list.
    My coins include five quarters, two dimes, a nickel, and seven pennies.


    The basic unordered list syntax remains as


    ```

    <ul>

    <li>five quarters</li>

    <li>two dimes</li>

    <li>a nickel</li>

    <li>seven pennies</li>

    </ul>

    ```


    Notice that in this example, each of the opening list item tags has a corresponding
    closing tag, meeting the well-formedness requirement of XHTML.


    The only rendering action required of the XHTML-compliant browser is that the
    list items be delimited in an unordered manner. The most traditional rendering
    is to use a solid bullet point (disc), as shown in Figure 2.1.


    # CHANGING LIST ITEM DELIMITERS


    When working with the Transitional or Frameset document types, document authors
    have the additional freedom to select presentation instructions for delimiters
    using the type attribute. Table 2.1 shows possible values for type.'
  merge: -1
