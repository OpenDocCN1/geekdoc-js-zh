    example:

    "http://www.mycompany.com/catalog/"


    +   * Title (line 5)—What is the title of the page you just sent your visitors
    to line four? That information goes here. For example:

    "Widgets, Inc. Online Catalog"


    +   * Path to sendmail (line 6)—Enter the information provided by your system
    administrator exactly as you received it, spacing, punctuation, letter case, and
    all. On your system, location is "/usr/sbin/sendmail -t".


    WORKING WITH NON-UNIX SERVERS


    Although it''s most popular on UNIX-based Web servers, Perl isn''t limited to
    that platform. Ports of the language are available in both Windows and Macintosh
    versions. Small variations in syntax might be required when working on one of
    these other platforms, but the root language remains the same.


    Of not all CGI scripts are written in Perl. Many are written in C, C++, various
    forms of BASIC, and a whole host of other programming languages. Consult your
    system administrator to find out which languages are available to you.


    To learn more about Perl, or to download a copy of the Perl interpreter for any
    of these platforms, visit http://www.perl.com.


    # What''s Next


    In this chapter you have learned how to create XHTML pages that allow you to collect
    information from your site visitors through XHTML forms. You''ve been introduced
    to two methods of processing data, mailto: and CGI scripts, and you can edit a
    simple Perl-based script for use on many Web sites. Next up in Chapter 5, "Working
    with Tables," we''ll look at creating XHTML tables, both for tabular content and
    to format content in an easier-to-read manner, such as the Presto Printing format
    just created in this chapter.'
