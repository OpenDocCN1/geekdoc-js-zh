    # Nesting Tables


    An alternative to complicated spanned layouts is available by creating entire
    tables within a table, a technique known as nesting. A common situation where
    you''ll find nested tables is the site layout is one large table, usually with
    a navigation column down the left, and the main content in a large cell on the
    right. Then, any tabular information in the main content area will need to be
    inside a table within that cell.


    I''ve created a page on my personal Web site that details current and upcoming
    appearances at trade shows and other industry events. The page uses this type
    of layout, beginning with a single-row, two-column table:


    ```

    <table border=''0''>

    <tr>

    <td width="200" bgcolor="#FFFF9">

    ```'
