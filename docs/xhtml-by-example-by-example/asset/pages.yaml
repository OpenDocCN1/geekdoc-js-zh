  md: '# Combining Custom Modules with XHTML


    So far in your studies of XHTML Modularization, you''ve seen how the Modularization
    process is designed, how abstract modules are written, and how content models
    are defined. You''ve also stepped through the process of creating a customized
    module to be combined with existing W3C-provided modules to create a new XHTML-based
    markup language.


    The final step in the process of creating such a language is the creation of the
    final DTD. This is where each of the modules defined are brought together in a
    single document, the language''s DTD against which all documents will be authored.


    This chapter teaches you:


    +   * How the Modular Framework Module incorporates necessary basic structures

    * How to plug your custom module into the Modularized DTD template

    * How to edit the template as necessary based on your design decisions

    * How to create a new document based on your completed DTD'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# A Look at the XHTML Modular Framework


    Authors who want to make highly customized XHTML-based markup languages will soon
    become very familiar with the XHTML Modular Framework Module. This module provides
    the structure for the basic components that need to be "plugged in" to make the
    modularized scheme of XHTML work. The module can be found in its entirety in Listing
    16.1, and we''ll step through it piece by piece in this section.


    Listing 16.1: The XHTML Modular Framework Module


    ```

    <<!-- XHTML Modular Framework Module -->

    <!-- file: xhtml-framework-1.mod -->


    This is Xmas, a reformulation of HTML as a modular XML application.

    Copyright 1998-2000 W3C (MIT, INRIA, Keio), All Rights Reserved.

    Revision: dtd_module_defs.html, v 1.7 2000/07/03 13:45:27 share


    Exp $ SMI


    This DTD module is identified by the PUBLIC and SYSTEM identifiers:


    PUBLIC "//W3C//ENTITIES XHTML Modular Framework 1.0//EN"

    SYSTEM "xhtml-framework-1.mod"


    Revisions:

    (none)


    <!-- Modular Framework -->


    This required module instantiates the modules needed to support the XHTML modularization
    model, including:


    + notations

    + datatypes

    + namespace-qualified names

    + common attributes

    + document model

    + character entities


    The Intrinsic Events module is ignored by default but occurs in this module because
    it must be instantiated prior to Attributes but after Datatypes.


    <!ENTITY % html-arch.module "INCLUDE" >

    ```'
