  md: '# Basic Tabular Structure 83


    You''ve used the alignment attributes already in the previous example, but the
    background color attribute, as least as it is new, to is tables. The attribute
    is bgcolor, just as it is with the body element. The value is a color name or
    hexadecimal value. I have chosen a pale yellow, with a hex value of #FFFF9:


    ```

    <table border="1">

    <tr align="center" valign="top" bgcolor="#FFFF9" height="35" width="100">

    <th>Sunday</th>

    <th>Monday</th>

    <th>Tuesday</th>

    <th>Wednesday</th>

    <th>Thursday</th>

    <th>Friday</th>

    <th>Saturday</th>

    </tr></table>

    ```


    In the next, the first row of date cells, the first five cells don''t have any
    data. We could place a non-breaking space in them as we did when creating the
    tic-tac-toe board. However, we want those to mimic calendars, that this leading
    blank area will be a single solid post, five empty boxes. To do that, a single
    cell needs to occupy the first five columns. This is achieved using the colspan
    attribute on the td element.

    You might guess, the value is the number of columns to be spanned by the cell
    in question. The alignment attributes are set to left for horizontal, and for
    vertical, placing the date numbers in the upper-left corner of each cell. There
    is a corresponding rowspan attribute that can be used to span more than one row
    per cell. In this example, we only need to use colspan:


    ```

    <tr align="left" valign="top">

    <td colspan="5" bgcolor="#CCCCCC" width="100" height="100">&nbsp;</td>

    <td width="80" height="80"></td>

    <td width="80" height="80">2</td>

    </tr>

    ```


    > NOTE Though the first cell in this rowspan spans five columns, the height and
    width attributes are set as if the cell occupied a single column. With a colspan
    value of 5, the cell then occupies 500 pixels of space (100 times 5), yet the
    same height width, because the rowspan hasn''t been manipulated.


    Each of the next four rows will look the same, excepting the numeric date content
    of the cell:


    ```

    <tr align="left" valign="top">

    <td width="80" height="80">3</td>

    <td width="80" height="80">4</td>

    <td width="80" height="80">5</td>

    <td width="80" height="80">6</td>

    ```'
  merge: -1
