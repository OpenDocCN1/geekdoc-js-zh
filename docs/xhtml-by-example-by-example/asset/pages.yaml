    <!ATTLIST %Recipe.prep.qname;\n%Common>\n  %Recipe.ns.attrib>\n\n<!-- end of recipe-1.mod\
    \ -->\n```\n\n# What's Next\n\nIn this chapter we completed the process of gathering\
    \ the type of information we need to store in new elements, determining how information\
