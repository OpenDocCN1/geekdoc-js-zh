  md: '# Chapter 7: Universal Accessibility on the Web


    # Defining Languages


    Language definition is one type of meta information most frequently-looked by
    Web designers. Many authors will assume their site visitors will read and speak
    the same language they do (an affliction, I''m glad to say, that is more common
    among Americans than residents of other countries).


    Begin by indicating the base language for the document using the xml:lang and
    attributes on the html element. Screen readers or other oral presentations can
    select the appropriate pronunciation, perhaps even distinguishing between U.S.
    English traditions and British traditions.


    Additionally to name a few adjustments, indexing systems such as search engines
    can provide the additional data of language when cataloging sites, tactile readers
    (for example, Braille devices) can insert the accent characters, or a user can
    automatically run a document through a translation utility if the base language
    is his preferred method.


    Just as setting the base language is bounding the presence of secondary languages
    embedded within the document. Place names, addresses and and are frequent candidates
    for language annotation:


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_143_0.png)


    <p>Our hotel was located on the Avenida Rafael E. Melgar Sur, just off the dazzling
    white beaches of Cozumel. As we stepped off the cab we were met with a friendly
    greeting, "Hola, Amigas!"</p>


    Both the street name and the greeting can be marked as Spanish, using the span
    element and lang:attributes


    <p>Our hotel was located on the <span lang="es">xml:lang="es">Avenida Rafael E.
    Melgar Sur</span> just off the dazzling white beaches of Cozumel. As we stepped
    off the cab we were met with a friendly greeting, <span lang="es">Hola, Amigas!</span></p>


    # Emphasizing Text with Additional Structure


    As presentation markup crept into HTML, visual designers began using visually
    specific tags to emphasize phrases and other line elements.


    Instead of using <strong>This sentence is important.</strong>


    they wrote


    <b>This sentence is important.</b>


    For the visual browser, the intended result generally came through. Sighted readers
    have learned to associate boldface text with something important. But what about
    the user who can''t see the boldface treatment? By using the structural approach
    of strong, screen readers or tactile devices have the opportunity to give strong
    emphasis to the contained text in their own way.'
