    relative to the baseline.


    For smaller images, this might be okay, but with something this large, the placement
    is awkward to say the least.


    What helps in this situation is to align the image relative to the margins using
    align="left" or align="right". Then, the image is solidly docked at the margin,
    and the text will flow around it (see Figure 3.3).


    # Using Images as Links


