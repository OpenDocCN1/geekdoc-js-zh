  md: '# What''s Next


    It doesn''t matter in which order most elements are nested, but once nested, they
    must be closed in descending order. In the previous example, the `<strong>` tag
    came first, then the `<em>` tag. Therefore the `<em>` tag must be the first closing
    tag, as it completes the innermost tag, then the outer `<strong>` tag is closed.
    If they are closed in improper order, the document is not well-formed.


    # What''s Next


    In this chapter, you''ve learned about the basic structure of an XHTML document.
    Each document must follow one of three document types, the choice of which is
    based on the type of content the document will contain.


    Every XHTML document must contain at least four out of five elements before any
    visible content is included. These elements include the doctype declaration, root,
    head, and title elements. Meta tags are optional, though they are contained within
    the head element when present.


    Block-level elements are those that can, at times, contain other block-level elements,
    and can always contain inline elements and data. Block-level elements tend to
    make up the larger structures of the document. They tend to provide the finishing
    touches or minor details in the overall structure of the document.


    In Chapter 2, “Adding Semantics to Structure,” we''ll talk about adding semantics
    to the structure of your document. You''ll learn how to provide meaning in your
    organization by choosing the proper heading levels, organizing data using lists,
    and emphasizing important content.'
