  md: '# Appendix A 341


    in the collection is further noted with its corresponding data type. The last
    collection, Common, is a superset of the other collections:


    | Collection name | Attributes |

    | --- | --- |

    | Core | Class (NMTOKEN), id (ID), title (CDATA) |

    | I18N (Internationalization) | dir ("rti"),"ltr"), xml-lang (NMTOKEN) |

