  md: '# Building a Frameset


    The result can be seen in Figure 6.4.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_124_0.png)


    | Frame 1A | Frame 2 | Frame 3 |

    | --- | --- | --- |

    | Frame 4 | Frame 5 | Frame 6 |


    Figure 6.4: One frame within a larger frameset also defines additional frames.


    TIP


    You can nest frames to nearly unlimited levels. Think twice, however, before doing
    it more than once. The visible space for each frame will become increasingly smaller,
    and managing the hierarchy of frames becomes correspondingly difficult.


    # Linking Between Frames: The target Attribute


    Now that you''re able to create the structure of a framed site, you need to populate
    it with content and provide links between content in the individual frames. To
    that end, a mechanism is needed to target content within a specific frame; that''s
    where the target attribute comes in.


    You''ve noticed that each frame created so far has its own name. As noted previously,
    these names must be unique within a browser instance. This uniqueness is the key
    to success in cross-framing linear. Consider again the initial four-quadrant frameset
    created at the beginning of this chapter:


    ```

    <frames rows="50% cols="50%">

    <frame src="frame1.html" name="f1" />

    <frame src="frame2.html" name="f2" />

    <frame src="frame3.html" name="f3" />

    <frame src="frame4.html" name="f4" />

    </frames>

    ```'
