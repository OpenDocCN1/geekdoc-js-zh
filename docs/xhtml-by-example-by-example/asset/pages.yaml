  md: '# Chapter 16: Combining Custom Modules with XHTML


    Listing 16.2: continued


    ```

    <!-- file: recipe-1_0.dtd

    -->

    ```


    <!-- This is the DTD driver for Recipe 1.0.


    Please use this formal public identifier to identify it:


    ```

    //WebGeek//DTD HTML Recipe 1.0//EN"

    And this namespace for recipe-unique elements:

    xmlns:recipe="http://www.webgeek.com/xmlns/recipe"

    \-->

    ```


    The first entity defined is that of formal public identifier:


    ```

    <!ENTITY % HTML.version "-//WebGeek//DTD XHTML Recipe 1.0//EN"> >

    ```


    We define an entity and bring in the qualified names sub-module defined in Chapter
    15, "Creating a Custom XHTML Module":


    ```

    <!ENTITY % recipe-qname.mod>

    SYSTEM "recipe-qname.mod">

    n%Recipe-qname.mod;

    ```


    No additional namespaces are necessary, so we can leave this next entity as it
    is:


    ```

    <!-- no new namespaces needed -->

    <!ENTITY % NS.prefixed.extras.attr " -->

    <!-- Define the Content Model for the framework to use -->

    <!ENTITY % xhtml-model-1.mod "recipe-model-1.mod">

    ```


    This entity references a content model definition module, which now needs to be
    prepared. The content model defined here for our recipe module is fairly generic.
    It''s the DTD representation of the minimal contents described in the abstract
    module definitions, plus our extensions needed to incorporate the recipe root
    element as its appropriate content type.


    As the recipe element is intended to act as an addition to the block element set,
    its qname needs to be added to the %Block.extra parameter entity definition:


    ```

    <!ENTITY Block.extra

    | %recipe.qname; * >

    ```


    Other than this, the only changes that need to be made in this generic content
    module are the public and system identifiers, the filename, and the namespace,
    as is always in the first section of the .mod file (see Listing 16.3).'
