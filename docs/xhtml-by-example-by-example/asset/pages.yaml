  md: '# Introduction


    # From HTML to XHTML


    If you''ve been on the Web for more than just a few minutes, you''ve probably
    heard about HTML. It''s so pervasive that it is discussed frequently on television,
    and not just as an answer in a quiz show! Story lines in comedies include characters
    having their own Web Sites. You hear "www-dot-something-dot-com" in nearly every
    radio advertisement. HTML is showing up in résum outside the realm of tech workers—it
    has become mainstream. But you know that the Web is continuing to grow: XML, the
    Extensible Markup Language, is the buzzword in the halls of business today. XHTML,
    the Extensible Hypertext Markup Language, bridges the two worlds: HTML to XML.


    # What''s the By Example Advantage?


    There are two distinct advantages in learning XHTML when it''s done By Example.
    First, by completing the examples as you read through each chapter, the concepts
    are reinforced for you immediately; much more than just reading-about a technique.


    Second, with the XHTML examples that will be available for download from the Web,
    XHTML by Example gives you a great position on the cutting edge of Web development,
    all while allowing you to practice your new skills on today''s sites. How As you
    work through the examples, you can edit them to suit your immediate needs, letting
    you have up a working XHTML-based site in minutes!


    # Who Should Use This Book?


    Most readers of this book will have some experience in writing Web pages. The
    root of many concepts presented in Part I, "Learning XHTML," will be familiar
    to you through your work in HTML. You''ll gain a reinforcement of your current
    knowledge, along with the expanded skills that come with the extension into XHTML.


    Even if you''ve only dabbled in HTML, XHTML by Example provides sufficient information
    for you to begin learning your right here.


    For all readers, you''ll tour the exciting new efforts underway at the W3C that
    will enhance interoperability between devices, markup languages, and the custom
    needs of businesses, vertical markets, and public interest groups.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introduction


    # Why Should You Learn XHTML?


    The World Wide Site has continued its record-breaking growth, and has become an
    integral part of modern life. On the job, it''s not just programmers or technical
    staff that are producing Web sites: marketing personnel, administrative assistants,
    teachers, managers—almost any job imaginable—can also be responsible for a segment
    of the company site. Outside the workplace, families and friends stay connected
    through the Web. We store our calendars and address books online, make travel
    arrangements, buy tickets to entertainment venues, and do Christmas shopping online.
    How to create and maintain these pages allows you to keep pace on the job and
    at home—with very little effort!


    By working with XHTML in creating these Web pages, you''ll be fully poised to
    integrate the XML-based documents and data stores that your company is developing
    or that your bank, creditors, or correspondents are to streamline business processes.


    # What Tools Do You Need?


    The only tools you''ll need—besides your computer of course—is your favorite text
    editor and a Web browser. No special software is required to write XHTML. Windows
    users can use Notepad, Macs can use SimpleText, and many Unix users will be familiar
    with Vi or Emacs. You can certainly use a more advanced editor, such as TextPad,
    Programmer''s File Editor (PFE), or even specialized tools such as HomeSite, but
    nothing more than a basic editor is required.


    XHTML is new enough that the visual Web tables haven''t caught up. When they do,
    you might want to experiment with them. By that time, you''ll have a solid grasp
    on creating XHTML by example, and will be able to evaluate the effectiveness of
    these tools.


    As mentioned previously, you will need a Web browser package or two for viewing
    and critiquing your own documents. I strongly recommend having both Microsoft
    Internet Explorer and Netscape Navigator available, as well as an "alternative"
    browser or two such as Opera or Lynx. You will not necessarily need an Internet
    connection working through this book, but having one will allow you to visit the
    sites mentioned throughout the text and to download the sample code that will
    be available on the publisher''s Web site. To get there, browse to http://www.mcp.com/detail.cfm?item=0789723859.


    # How This Book Works


    Each chapter in this book begins by explaining a particular concept, giving examples
    in short sections of XHTML markup as you go along. After you''ve'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    mastered the concept, you''ll be ready to work with a full-fledged example. I
    encourage you to type in each of the examples, as the act of creation will reinforce
    the concepts that you''ve just read. Some of the examples will also suggest that
    you modify the text to make it more suitable for your personal use. When you''re
    done, you can test and view the documents in your Web browser.


    The key to the organization of this book is simple: it''s progressive. You''ll
    start simply, by going over the fundamental concepts of XHTML and creating basic
    pages. From there, you''ll begin working with XML concepts such as DTDs, schemas,
    and XML-based style sheets, and move on to the projects still being discussed
    at the W3C: modularization, document and device profiles, and more.


    # Overview of Chapters


    This book is divided into logical parts and chapters to help you find the lessons
    that are most appropriate to your knowledge level. What follows is a description
    of each part of this book, including a look at each chapter.


    # Part I: Learning XHTML


    Chapter 1, "XHTML Fundamentals," reviews the basic concepts involved in XHTML
    documents. Chapter 2, "Adding Semantics to Structure," discusses the meaning that
    can be attached to structural elements through their use and presentation. Chapter
    3, "Working with Images," walks you through the process of incorporating these
    features in XHTML documents. Chapter 4, "Collecting Data with Forms," takes a
    close look at the process of retrieving input from your users. Chapter 5, "Working
    with Tables," guides you through the ins and outs of table working with framed
    content. Chapter 7, "Universal Accessibility on the Web," discusses the concepts
    of universal design that allows access to those with physical limitations, as
    well as those browsing from devices with limited capabilities. Chapter 8, "Validating
    XHTML Documents," introduces you to the tools available to check the accuracy
    of your work, and finally Chapter 9, "Implementing XHTML Today," takes a look
    at how XHTML might be used in current browsers and on today''s Web with very little
    effort!


    # Part II: XHTML Style and Structure


