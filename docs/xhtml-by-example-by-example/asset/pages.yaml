    <!ENTITY % XML.profile "IGNORE" >

    ```


    Neither will we need to do any pre-framework redeclarations, nor will we support
    events. The pre-framework placeholder information can simply be deleted (the area
    bound by our delete comments), and the events remain IGRED:


