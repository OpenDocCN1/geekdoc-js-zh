  md: '# Subsetting XHTML: XHTML Basic


    When people think about the flexibility that an extensible language like XHTML
    offers, it''s easy to forget that you don''t necessarily have to add to the language,
    that you can instead subract from it, or make it more restrictive.


    XHTML Basic is the first XHTML Family Member vocabulary to be published by the
    W3C that takes this approach. Its intent is to act as a basic platform for further
    development in vocabularies used on small footprint devices.


    This chapter teaches you:


    +   * How small footprint devices are being used to access the Internet

    * What kinds of devices are gaining in popularity

    * How to convert an existing HTML document to XHTML Basic

    * How XHTML Basic compares to other XHTML document types'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Using XHTML on Small-Footprint Devices


    One of the most exciting, and perhaps sometimes frustrating, realities of living
    in an ultra-“wired” society is the realization of accessing digital information
    and the Internet from just anywhere. We''ve seen updates to Web sites from Mt.
    Everest and the middle of the world''s oceans, and we can send email from the
    comfort of our airplane seat while cruising along at 35,000 feet.


    In large part, this “access everywhere” lifestyle has been accomplished through
    desktop and laptop systems. With the advent of wireless connections for small
    devices, as Palms and other PDAs, and even cellular telephones, the capabilities
    of the devices connecting to the Internet are changing at an incredibly rapid
    pace.


    # Miniature Computers


    The form factor of many laptop and portable devices is certainly smaller by the
    year. However, the systems worthy of mention in this section aren’t just smaller
    devices, but those that are small and run operating systems optimized to perform
    under the tight constraints present in these the wildly popular Palm Pilot line
    of PDAs, and Microsoft has joined the fray with the Windows CE operating system.
    Palm-sized devices operate primarily with a stylus, and miniature keyboard-based
    systems known as “hand-helds” can take advantage of WinCE.


    These machines typically have just 2MB–16MB of memory in which to operate. That’s
    not RAM, as in our desktop machines, but the entire storage system!


    Understandably, the software used on these machines must have a smaller footprint
    than those used on traditional computers. Because of the limited space for software
    to operate, the features available within programs can be limited. For instance,
    a Web browser might not have a Java Virtual Machine installed, it might not have
    the capability to process scripts or style sheets. It’s also unlikely that these
    browsers will have plug-ins available to support advanced Web features such as
    video, audio, or animations as Shockwave and SMIL.


    # Nontraditional Appliances


    A nontraditional appliance is one where, at least until very recently, you wouldn’t
    normally think about a computer being present, let alone one access to the Internet!'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Wireless Access


    Wireless access to the Internet is one of the fastest growing user segments. Cellular
    telephones are used by as much as 60%–70% of the population in Sweden and Finland,
    followed quite closely by the Japanese.


    # Limited Use Devices


    A limited use device, as opposed to a nontraditional appliance, is one that generally
    looks and feels like a computer, but is decidedly limited in what applications
    it can run. WebTV falls into this category, as the email-only and email-plus-Web
    appliances now being marketed as a “low barrier to entry” may get online.


    # Exploring the XHTML Basic DTD


    XHTML Basic is, as noted earlier, a host language implementation of XHTML Modularization.
    In Chapter 16, “Combining Custom Modules with XHTML,” we defined a host language
    as a document type using, at a minimum, the four required XHTML modules: the Structure
    Module, Text Module, Hypertext Module, and List Module. Table 17.1 lists the elements
    included in these modules.


    Table 17.1: Required XHTML Modules Included in XHTML Basic


    | Module | Elements |

    | --- | --- |

    | Structure Module | html, head, body |

    | Text Module | abbr, acronym, address, blockquote, br, cite, code, dfn, div,
    em, h1, h2, h3, h4, h5, h6, kbd, p, q, span, span, var |

    | Hypertext Module | a |

    | List Module | ol, ul, li, dl, dd |


    # Developing to XHTML Basic


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_308_0.png)


    Let’s take a look at an existing Web site and see what would need to be done if
    it were to be updated for XHTML Basic. Orion’s Domain is the personal Web site
    of a good friend of mine, and he has graciously allowed me to use his pages in
    this book (see Figure 17.1). Note that his home page is currently a valid XHTML
    4.0 Transitional document. The page source is found in Listing 17.1.


    EXAMPLE'
