  md: '# XHTML Document Profiling


    Up until this point we''ve discussed the technologies behind creating XHTML documents,
    as well as defining and validating their grammars. The next step in managing a
    set of Web documents is to work with them as a collection. To manage, to sort,
    sort, or otherwise document the properties of a collection, you must first know
    what each individual member of that set represents. To that end, methods have
    been developed to describe and categorize documents as a larger part of information
    management systems.


    XHTML has facilities for describing documents that are compatible with these efforts,
    and the future holds promise for several more techniques that will further enhance
    the abilities for XHTML.


    This chapter teaches you:


    +   * What metadata is

    * How metadata is included in XHTML documents

    * How to build descriptive meta elements

    * How to use meta elements to suggest HTTP response headers'
  merge: -1
  pgno: 318
- img_proc: true
  md: "# Meta Information\n\nBefore we can talk too much about meta information provides\
    \ for us, it's essential that you fully understand what metadata, as it has pertained\
    \ to Web documents, actually is. The most simplistic definition of metadata is\
    \ \"about data.\" Practically, that means descriptive information about a document\
    \ or collection of data such as a database or other concentrated store of data.\
    \ In XML, the meta element provides document authors with an opportunity to include\
    \ this descriptive information.\n\n# What Current Techniques Tell Us\n\nThe intent\
    \ of the HTML element is to provide servers and clients a means of retrieving\
    \ information about the document being served to index, as in the case of search\
    \ engines, and identify or catalog it for other applications.\n\nLet's take a\
    \ close look at how the meta element is defined in XHTML 1.0 reviewing the element\
    \ and attribute-list declaration from the XHTML 1.0 Transitional DTD:\n\n```\n\
    <!ELEMENT meta EMPTY>\n<!ATLIST meta\n  i18n;\n  http-equiv NMTOKEN #IMPLIED\n\
    \  name NMTOKEN #IMPLIED\n  content COATA #REQUIRED\n  scheme COATA #IMPLIED>\n\
    ```\n\nThe most interesting parts of the meta element are the attributes, because\
    \ meta is an empty element. The presence of the i18n parameter entity identifies\
    \ that meta can take any of the attributes represented by i18n (to review what\
    \ is provided in the internationalization attribute set, see Chapter 13, \"Document\
    \ Type Definitions—The Syntax Rulebook\")\n\nThe two most common attributes used\
    \ are name and content. The name attribute provides a label for the meta information\
    \ being supplied in the element. The content attribute value holds the actual\
    \ meta data. For example, to identify the author of this book, if it was written\
