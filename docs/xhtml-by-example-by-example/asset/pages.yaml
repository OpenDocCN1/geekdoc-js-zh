  md: '# XHTML as the Bridge to XML


    Back at the beginning of this book, in Chapter 1, “XHTML Fundamentals,” we talked
    about how the W3C recognized it needed some sort of transition between the HTML
    most Web authors were used to working with, and XML, the new language that provided
    a framework for customized language definitions and new markup vocabularies. The
    job of making that transition was given to XHTML. XHTML 1.0 takes on many of the
    traits of XML, while retaining backward compatibility with HTML 4, acting as that
    metamorphic bridge between the two technologies.


    This chapter teaches you:


    +   - How XML provides more freedom for document authors

    - What constitutes well-formedness

    - What languages can be defined using document type definitions

    - How a new XML-based technology, schemas, can also define XML-based vocabularies'
