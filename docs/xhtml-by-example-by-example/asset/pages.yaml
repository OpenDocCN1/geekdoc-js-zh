  md: '# Chapter 4: Collecting Data with Forms


    conjunction with the Web server software. The use of these systems for forms processing
    goes beyond the scope of this text, so I won''t go into them any further.


    # mailto: Form Action


    The processing method that''s probably easiest to implement unfortunately also
    the most unreliable: mailto: function.


    The idea behind it is: the email client that has been associated with clicking
    linked email addresses in your browser captures the form data and sends the message
    to the address specified in the form action. The only problem with this is that
    not all computers will have a browser''s set to intercept email links in this
    manner. To further complicate the issue, the end user can''t easily change this
    behavior. Therefore, when the user submits it, the browser might just "sit there,"
    the email client might engage but perhaps only to bring up a blank email message,
    or any number of other unpredictable results.


    That said, using a mailto: form action can be useful while you''re learning and
    planning your forms. The form tag would take the following:


    ```

    <form method="post" action="mailto:webgeek.com">

    ```


    # CAUTION


    > Avoid the temptation to add additional parameters to the mailto: value. A popular,
    though flawed trend on the Web is to insert subject lines and full text sections
    to email messages generated by forms by adding specific strings to the mailto:
    data. The use of these techniques violates accepted Internet mail protocols. Because
    of this, you''ll likely have further difficulties getting a mailto-based form
    to process the data as desired.


    If you manage to get it to work, you will get the data in what''s known as URL-encoded
    form. This is one long string of characters composed of the name=value pairs from
    each form element, and the spaces, carriage returns, and line feeds between and
    those pairs converted to their equivalent ASCII character codes.


    # A Simple CGI Script in Perl


    One of the most popular options for processing form data is known as the CGI Script.
    CGI stands for Common Gateway Interface. Exactly how this gateway works is beyond
    the scope of this book, but at the most basic level it acts as a doorway from
    the Web server to the computer on which the server resides, allowing additional
    computing to take place between the give and take of files.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Form Processing Options 75


    The instructions are passed through the gateway in the form of scripts, which
    are essentially miniature programs that perform limited functions. CGI scripts
    can be written in quite a few different programming languages, but the most prevalent
    remains Perl.


    Perl is an interpreted language, meaning that a program known as a Perl interpreter
    on the server processes the script. If the script were executable on its own,
    it would be known as a compiled program, or executable program. Perl interpreters
    are available for most computer platforms, including all variations of UNIX/Linux,
    32-bit Windows (NT, 95/98), Solaris, and almost any other popular platform that
    is capable of running a Web server.


    To run CGI scripts, you must have a directory within your Web site is set up with
    the proper permissions. The system administrator normally does this. On a UNIX-
    or Linux-based system, the directory is named cgi-bin, and is often found at just
    below the root directory of the Web site. If you have control over your Web server,
    you can set this up yourself. If you use Web space on an ISP or IPP, you will
    need to ask your provider if they allow CGI scripts, and if so, which directories
    to be using.


    The following script (Listing 4.2) is a generic form handling script written in
    Perl. It''s not important for you to know what of the lines mean, but you will
    need to edit the first line of the script, known as the "path to Perl," and several
    of the variables defined within lines to six. You''ll come back to those in a
    moment.


    Listing 4.2: form.cgi


    ```

    Listing 4.2: form.cgi

    #/usr/bin/perl                                              Line 1

    # Line 1 - enter the email address where you wish the response

    # to be delivered. The @ character must be escaped, as \

    # Line 2 - Edit the subject line between the quote characters.

    # Line 3 - Enter a URL to be displayed after the form has been

    # processed - Users will click this link to continue viewing

    # your site.

    # Line 4 - The title of the page referenced in the URL in Line 3

    # Line 5 - Ask your system administrator for ''the path to sendmail'' on your

    #system.

    # Edit this line as necessary.

    ```


    ```

    #      edit only these variables. Do not remove quotes -


    $email = "you@company.com";                               Line 2

    $subject = "Your Subject Here";                                 Line 3

    $nextpage = "http://www.yoururl.com";                         Line 4

    $title = "Page title for URL in Line 3";                          Line 5

    $SENDMAIL = "/usr/sbin/sendmail -t";                              Line 6

    ```'
