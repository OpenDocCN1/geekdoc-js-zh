  md: '# Attributes That Contain Ampersands


    Any attribute that contains an ampersand character (&) must be written using the
    character entity for the ampersand instead of the character itself. For example,
    a copyright statement for Chandler & Sons, Inc. might be written in a meta element


    ```

    <meta name="copyright" content="Copyright 2000, Chandler &amp; Sons, Inc." />

    ```


    This prescription also includes attribute values that hold URI values. Web authors
    mistakenly believe that ampersands in URIs cannot be written using the &amp; character
    entity because the link or source reference will no longer function. This actually
    isn''t the case. The URI will contain &amp; in the source document, when it''s
    displayed in the browser the character entity is rendered, and the URI will function
    as if it were written using the & character directly.


    # Using CSS with XHTML


    When working with style sheets, authors are encouraged to use the excellent support
    for external style sheets both with HTML Web browsers and XML parsers. Should
    there be a compelling reason to embed the style sheet within any < or & characters.
    Both types of parsers will treat these as the beginning of markup sections; the
    < indicating the start of a new element and & either character essentially appear
    within the style sheet and you can''t move to an external file, you''ll need to
    wrap the CSS in a CDATA section as described earlier in this chapter in the “Working
    with Embedded Scripts” section.


    # Remaining Compatibility Issues


    Not all issues regarding compatibility or backward compatibility can be handled
    by a relatively simplistic set of authoring guidelines. Contradictions and collisions
    between HTML and XML, the technologies being blended in XHTML, are almost inevitable.


    # Internet Media Types for XHTML


    For XHTML to be served on the Web today, authors will use the text/html Internet
    Media Type, with a corresponding .html extension.


