  md: '# Using Frames


    Mention the topic of frames to any gathering of Web developers, no matter small,
    and you''re bound to trigger a lively debate on the merits (and demerits!) of
    this controversial technology.


    Frames, first introduced to the Web world in Netscape Navigator in their simplest
    form back in version 1.1, evolved into what we know as frames today starting with
    version 3.05. Frames were formally adopted into the HTML specifications with HTML
    4.0, and are carried over into XHTML 1.0 with the XHTML 1.0 Frameset DTD.


    This chapter teaches you:


    +   * How to create a basic frameset

    * Three methods of dividing available screen space into frames

    * How to change the look of frames through attributes

    * How to nest frames within frames

    * How to target content into specific frames'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 6: Using Frames


    # The XHTML 1.0 Frameset Doctype


    When working with frames, a fundamental change is made in the content model of
    the XHTML document. To manage this change, XHTML has a special DTD that includes
    the frame element and other associated elements and attributes necessary to create
    this functionality.


    An interesting aspect of the Frameset DTD is that it provides the structure into
    which other documents will be displayed. That is, a frameset document, when viewed
    in a compatible browser, offers no content of its own.


    # NOTE


    The fact that only the structural document, the one that lays out the frameset,
    is quite advantageous. It means that the framed documents are written to the Traditional
    or Strict DTDs, allowing them to function either as framed or standalone documents
    for systems that do not support frames.


    # Building a Frameset


    Frames divide the browser window space into two dimensions: horizontally in rows
    and vertically in columns. Each portion of the window space, is defined by its
    size. Sizes are set in fixed measures of pixels, by a percentage of the available
    space, or by relative sizing.


    One of the simplest framesets to create is to divide the browser window into four
    equal quadrants. The basic syntax looks like this:


    ```

    <frameset rows=''50%, 50%'' cols=''50%, 50%''>

    </frameset>

    ```


    The frameset element, then, provides the spatial relationship between each frame.
    However, you still need to populate each frame with content documents. To do this,
    each defined space will need its own frame element:


    ```

    <frameset rows=''50%, 50%'' cols=''50%, 50%''>

    <frame src=''frame1.html'' name=''f1'' />

    <frame src=''frame2.html'' name=''f2'' />

    <frame src=''frame3.html'' name=''f3'' />

    <frame src=''frame4.html'' name=''f4'' />

    </frameset>

    ```


    Notice that each of the frame has a name attribute. This attribute must be unique
    within the frameset, and must follow two important rules: The name must start
    with an alphabetical character, and cannot be _blank, _self, parent, or _top.
    Those names are reserved for specific behavioral semantics which you will learn
    about later in this chapter in the "Linking Between Frames: The target Attribute"
    section.'
  merge: -1
  pgno: 119
