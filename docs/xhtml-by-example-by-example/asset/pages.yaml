  md: '# Creating an XSL Style Sheet


    The Cascading Style Sheet file is very simple:

    h1 {color: red;

    text-align: right;

    text-decoration: underline;

    }


    All this is to make the color of the output text in <h1> elements, red, to align
    it to the right, and to underline the text.


    As you can see from Figure 12.3, the Cascading Style Sheet was successfully applied.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_232_0.png)


    > The Shakespeare quotation following the XSLT transformation sheet and the CSS
    style sheet shown earlier. Note that the text is now aligned right and is underlined,
    demonstrating the application of the CSS style sheet.


    In examples you have seen straightforward use of the <xsl:stylesheet>, <xsl:template>,
    <xsl:apply-templates>, and <xsl:value-of> elements. These are commonly used in
    XSL sheets.


    There are, of course, many other elements in the XSLT armory, and described in
    the XSLT 1.0 Recommendation.


    The full power of XSLT and XSL-FO will not be demonstrable until the XSL-FO component
    of the Extensible Style Sheet Language is finalized.


    Effective use of these powerful and flexible tools will demand a detailed grasp
    of XPath, XSLT, and XSL-FO individually; and how the XML 1.0 Recommendation applies
    to this context; and how XPath and the two parts of the Extensible Style Sheet
    Language interact.'
