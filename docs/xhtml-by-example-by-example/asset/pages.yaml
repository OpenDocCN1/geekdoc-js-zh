  md: '# Working with Images


    If the average Web user was asked to describe the World Wide Web, he might say
    “pictures and things on the Internet.” Only people introduced to the online world
    before early 1995 were very familiar with the Net as a text-based medium. Desktop
    publishing was a major new activity and found many non-artists manipulating digital
    images for the first time.


    Beyond the graphical skills gained in the DTP environment, digital imaging for
    the Web brings new concerns and constraints. The number of image formats supported
    by Web browsers is significantly smaller than the number you can work with in
    MS Publisher, or Framemaker. Additionally, the resolution and color depth available
    on a computer monitor change the way we see those images compared to the output
    you''d find in print media.


    This chapter teaches you:


    +   * What image formats work online

    * Which format works best with what type of graphic

    * How to incorporate images into your Web page

    * How to create links using images

    * How to draw hot spots on images for an interactive map'
  merge: -1
