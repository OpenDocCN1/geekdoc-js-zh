  md: '# Understanding XSLT 205


    To associate a CSS style sheet with an XML document, you might use a command something
    like


    ```

    <xml-stylesheet href="myfirst.css" type="text/css"?>

    ```


    To associate an XSLT style sheet with an XML file, you would use a command something
    like this:


    ```

    <xml-stylesheet href="myfirst.xsl" type="text/xml"?>

    ```


    # NOTE


    Details of how to use the <xml-stylesheet?> processing instruction are found in
    the W3C Recommendation titled "Associating Style Sheets with XML Documents Version
    1.0," which can be accessed at


    http://www.w3.org/1999/06/rec-stylesheet-19990629


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_216_0.png)


    Other XSLT processors associate a style sheet with an XML file from the command
    line. For example, using Instant Saxon to associate an XSLT style sheet myfirst.xsl
    with an XML document called myfirst.xml and produce an XHTML file called myfirst.html,
    you would issue the following command:


    ```

    saxon myfirst.xml myfirst.xsl > myfirst.html

    ```


    If you are using a different XSLT processor, the syntax might differ.


    To extract and make of the logical structure contained within a wellformed or
    valid XML document, it is necessary for the XSLT processor, which will typically
    include an XML parser, to create a tree-like structure of nodes in memory which
    captures the logical content of the XML document. Remember that the XSLT style
    sheet is itself an XML document so it, too, is transformed into a hierarchical
    tree-structure in memory.


    # CAUTION


    If you are familiar with the Document Object Model, you might notice that the
    XSLT object model is very similar. However, you should be aware that the DOM and
    XML data models are not identical. Detailed consideration of the differences is
    the scope of this chapter.


    Further information on the DOM Level 1 can be viewed at http://www.w3.org/TR/1998/REC-DOM-Level-1-19991101.


    DOM Level 2 is currently being drafted by the W3C. Further details can be found
    at http://www.w3.org/TR/2000/CR-DOM-Level-2-20000510.


    The XML parser creates from the stream of characters in each XML document (the
    source XML document and the XSLT style sheet) a tree-like structure in memory.
    The tree-like branching structure contains a'
