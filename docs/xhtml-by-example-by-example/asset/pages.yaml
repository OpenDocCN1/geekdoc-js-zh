    | ContentType | A media type, as per RFC2045. |

    | ContentTypes | A comma-delimited list of media types, as per RFC2045. |

    | Datetime | Date and time information. |

    | FrameTarget | Frame name used as destination for results of certain actions.
    |

    | LanguageCode | A language code, as per RFC1766. |

    | Length | A value in either pixels or a percentage of the available vertical
    or horizontal space. |

    | LinkTypes | A LinkTypes refers to a space-delimited list of link types. Whitespace
