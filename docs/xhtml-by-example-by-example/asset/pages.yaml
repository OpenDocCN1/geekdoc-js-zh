  md: 'What''s Next


    font sizes set in a Web document. Many of these issues are being addressed in
    work getting underway at the W3C, as well as other standards and research bodies.


    # What''s Next


    In this chapter we''ve talked about systems for describing documents, including
    syntax for providing details for originator such as creation and editing dates.
    The meta element can be used with the name attribute to provide any number of
    descriptive properties, and the http-equiv attribute is used to suggest http response
    headers.


    Next, in Chapter 16, “Combining Custom Modules with XML,” we’ll take a look at
    several exciting “coming attractions” for XHTML. We’ve already touched briefly
    on the capabilities and profiling work to be done by CC/PP, and we’ll take a closer
    look at the developments occurring in that field. Work is also underway in combining
    television and the Web, both from a “broadcast over the Internet” perspective
    as well as an “embedded Web documents in a TV broadcast” viewpoint. Finally, the
    ubiquitous form is in for overhaul with extended capabilities being reviewed by
    the W3C XForms Working Group. We expect to see efforts to provide state management
    between form pages, databinding, and stronger form-field validation tools.'
