  md: '# Collecting Data with Forms


    As witnessed by today’s booming “dot com” economy, nothing has been vital to the
    success of the Web as a commercial medium as the ability to collect data from
    Web site visitors. The sale of information, services, and products of all kinds
    are contributing to the billions of dollars changing hands each year online; and
    each transaction begins with a simple form.


    Forms combine not just XHTML elements and content, but additional scripts and
    programmatic actions in order to collect the data from the user and deliver it
    to the site owner by email, store it on the Web server, or perhaps insert it directly
    into a database.


    This chapter teaches you:


    +   - How to use each of the 10 form controls


    +   - How form content is processed


    +   - How to implement a simple CGI script written in Perl'
  merge: -1
  pgno: 70
- img_proc: true
  md: "# The Components of Every Form\n\nXHTML provides an array of 10 distinct objects\
    \ that are known as controls used in forms. These are the boxes, buttons, and\
    \ menus that the user can use to input text, make selections, and click to initiate\
    \ a programmed action.\n\nEach control has its own unique properties that you'll\
    \ look at in detail in this section.\n\n# The <form> Element\n\nEvery form begins\
    \ with the form element, a block-level element that will contain all form controls,\
    \ any necessary accompanying data such as labels for the controls, and the location\
    \ of the script or program that will process the form data. A minimal form element\
    \ will have two attributes: method and action. A minimal form element might look\
    \ like this:\n\n```\n<form method=\"post\" action=\"http://www.webgeek.com/cgi-bin/script.cgi\"\
    >\n  ..content ..\n</form>\n```\n\nThe method attribute takes one of two values:\
    \ get or post. These values determine how the data collected in your form is sent\
    \ to the server. You'll learn about the options in more detail in the \"Form Processing\
    \ Options\" section later in this chapter. For now, you should know that \"post\"\
    \ is the most commonly used method.\n\nThe script or program used to actually\
    \ process the form data is referenced in the action attribute. This value is the\
    \ full URL for the program or script.\n\n# Form Input Controls\n\nThere are 10\
    \ different types of input controls:\n\n+   * Text boxes\n* Password\n* Checkboxes\n\
    * Radio buttons\n* Select groups\n* Text areas\n* Hidden controls\n* File upload\
    \ controls"
  merge: -1
  pgno: 71
- img_proc: true
  md: '# The Components of Every Form


    +   * Buttons

    * Image controls


    We''ll look at each of these later in the chapter. Each of the 10 input control
    types might use the same collection of attributes. These are defined in Table
    4.1.


    Table 4.1: Attributes Available for the Input Element


    | Attribute | Use |

    | --- | --- |

    | type | Determines which input control will be created. |

    | name | An identifying string that equates to an incoming variable name on the
    server. |

    | value | Holds the content entered by the user (or preset by the author). |

    | checked | A preselected item (used most for radio buttons, checkboxes, or select
    groups). |

    | Disabled | Makes the control visible, yet not for input. The user may not change
    the preselected value. |

    | size | Usually a numeric value, used to determine the visual size of the control.
    |

    | maxLength | Always a numeric value, sets the maximum number of characters allowed
    as input. |

    | src | A URI. |

    | alt | Alternative text information. |

    | usemap | A URI for a related image map. |

    | tabindex | A numeric value, sets the order in which the control receives the
    focus if the user tabs between controls. |

    | accesskey | A single keyboard character that might be used to switch focus to
    the control. |

    | autofocus, onblur, onselect | Used for scripting. |

    | accept | Used with the file control, specifies which media types can be accepted.
    |

    | align | Visual alignment of the control. |


    Typically you''ll use the type and name attributes, and perhaps size and maxLength.
    As I introduce each form control type, you''ll have an opportunity to use the
    attributes commonly associated with that control.


    # TEXT BOXES


    Probably the most used input control is the text box (see Figure 4.1). You see
    these all the time when to enter your name or your email address.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 4: Collecting Data with Forms


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_73_0.png)


    **Figure 4.1:** This figure shows a simple text box input control.


    Of the attributes available to this element, only type and name are required.
    For practical use, however, you''ll also be using the size attribute, especially
    when working with multiple inputs, to provide a uniform appearance while at the
    same time allowing the user to see his or her entry in most instances. The text
    box in Figure 4.1 was created using the following XHTML. Note that input is an
    empty element, using the shorthand slash before the bracket to complete the tag
    set:


    ```

    <p>Please enter your name: <input type="text" name="foo" size="20" /></p>

    ```


    With a size of 20, browsers will make the box as wide as is necessary to fit 20
    characters of the default fixed-width font used. If that''s 8-Point Courier, the
    box will be smaller than 20 characters of the text elsewhere in the document if
    that was in 14-point Arial Bold.


    If you''d like to control the number of characters the user can enter, the maxLength
    attribute can be added.


    # PASSWORD CONTROLS


    The password control is nearly identical to the text box control. The only functional
    difference is that users'' input is hidden behind a masking character (*), as
    they type. Password entry is the most common need for visual security, but you
    can also use passwords for credit card number entry or the collection of other
    sensitive information when the user might not be in a private location, such as
    at a Web kiosk or cyber café.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# The Components of Every Form


    Password controls are created using the type value of "password" instead of "text":

    <input type="password" name="foo" size="20" />


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_74_0.png)


    # CAUTION


    Though the user input into the password control is visually masked, the data doesn''t
    receive additional encoding when it''s sent for processing with the rest of the
    form input. Information that needs to be secure during transmission will need
    more hand-ling (as a connection over SSL) than just a password control.


    # CHECK BOX CONTROLS: Choosing More Than One OPTION


    The check box control is the first of two controls that let you group options
    together to provide the user with a choice. Using check boxes, the user is allowed
    to choose zero, one, or more than one option in that group. The check box name
    comes from the traditional rendering by the browser—a small box that when selected,
    has a checkmark placed within it.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_74_1.png)


    At most basic, a check box control is written as

    <input type="checkbox" name="box" /> option text


    The option text gives the user to check or uncheck the box, as shown in Figure
    4.2. Notice, though, that the option text is not contained within the input element.
    Instead, it is placed after the element it is closed.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_74_2.png)


    Figure 4.2: This is a basic check box control.'
