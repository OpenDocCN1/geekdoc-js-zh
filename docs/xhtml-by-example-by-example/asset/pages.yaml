  md: '# Chapter 7: Universal Accessibility on the Web


    # Links


    Hyperlinks provide dual functionality within a Web page. They create the mechanical
    function of linking one document to another. But when written correctly, they
    also provide contextual information about the link. Where will the link take me?
    Is it something I''m interested in seeing? Sadly, thousands of Web pages online
    only that they tell you to "click here":


    ```

    <p>I live in Port Charlotte, Florida. <a href="http://www.charlottecountyclf.com">Click
    here</a> to view resources for visitors, and potential residents.</p>

    ```


    This type of link makes two assumptions that won''t always hold true. First, it
    assumes that the link is activated by clicking, which makes a mouse or a trackball
    is in. Laptop users tap their fingers on a touch-pad. PDA owners press a stylus
    against the screen. Listeners using a reader might press a single letter or number
    their program has associated with the link, or perhaps they even see a number
    to follow the link. Second, not all users will see "here" is, and if they don''t
    click, what do they do with "here":


    Instead, you can rewrite the hyperlink in the previous example to create a link
    that gives control over the hyperlink:


    ```

    <p>I live in Port Charlotte, Florida. The <a href="http://www.charlottecountyclf.com">Charlotte
    County Web site</a> has dozens of resources for visitors, residents, and potential
    residents.</p>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_145_0.png)


    # Provide Alternative Information for Images


    Dealing with graphical content on a non-graphical user agent, is in my opinion,
    one of the most difficult aspects of Web design. The best advice I''ve given is
    to look at the page and pretend you must read and describe it to someone who is
    blind. What images are important? What do they represent? Should they be described
    literally or for the function they serve?


    After those questions are answered, you have a good start on filling in the required
    ALT attribute for each image.


    # TIP


    Sometimes designers use images that aren''t intended to convey information. One
    design technique takes heavy use of blank graphics to force a particular layout
    (which I don''t recommend, but it is out there). These images, often referred
    to as "spacer images," and other non-essential graphics can validly be given an
    empty ALT value—for example, alt="*"


    # TIP


    An empty ALT attribute is actually preferable to holding an asterisk, space, or
    other "filler" character. Screen readers will speak each asterisk if used that
    way. Far better to leave it empty than have a lot of garbage read to you.'
