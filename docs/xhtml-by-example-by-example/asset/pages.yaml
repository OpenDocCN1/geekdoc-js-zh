    # Data Alignment—axis and id


    With all the design tricks that are sometimes employed using tables, people often
    forget that the reason tables were developed for HTML and XHTML was to deliver
    tabular content. Rows and columns of numbers or data are presented as much as
    you see them in a spreadsheet. To make sense of the information, it must be aligned
    in some manner. After this is done visually by creating headers, as you did previously
    with the calendar page. But what if the table contains hundreds of rows? What
    if you can''t see the table, and instead need to listen to it using a speech synthesizer?
    How will'
