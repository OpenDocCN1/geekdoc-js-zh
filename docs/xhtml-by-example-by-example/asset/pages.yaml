  md: 'Figure 2.2 shows the results.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_39_0.png)


    Figure 2.2: Three different types of unordered lists.


    # MAKING YOUR LIST MORE COMPACT


    The second attribute available for unordered lists is the compact attribute. This
    attribute is a rendering suggestion to the user agent that essentially minimizes
    the line height and space between lines when presenting the list.


    In HTML 4, the compact attribute is a Boolean attribute. Boolean attributes were
    turned on or off simply by their presence or absence. Therefore a UL tag written
    as


    ```

    <ul compact>

    ```


    was functionally equivalent to


    ```

    <ul compact=''compact''>

    ```


    XHTML does not allow attributes to be expressed using the Boolean syntax due to
    the necessity of all attributes having values, which is a part of wellformedness.
    Therefore the second example,


    ```

    <ul compact=''compact''>

    ```


    is required in XHTML.'
