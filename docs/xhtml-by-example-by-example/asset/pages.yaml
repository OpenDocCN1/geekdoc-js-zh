    # # What’s Missing?


    So far we’ve explored ways to describe the contents of a document; to identify
    properties such as the author of the document, copyright statements, and creation
    or modification dates; as well methods used to enhance the machine-processability
    of the page. What’s missing?


    A frequently heard complaint in some Web design circles is the inability to exert
    control over the presentation of their Web sites. These authors might not want
    a browser to render the document if it can’t handle some portions of it, preferring
    to miss out on that visitor rather than change the display of the page content.
    Others might have preferences as to the path of substitution browsers if it can’t
    render the document as first defined.


    Today, XHTML doesn’t provide a mechanism for exerting that much control over the
    delivery of Web content. A request is made from the client, and the server happily
    pushes all that is there back. It’s the client’s responsibility to determine how
    to display content to the user, based on policies or decision trees set by the
    client’s programmers.


    Similarly, it’s not possible for a device to let the server know that it can accept
    GIF but not PNG, or that the browser in use doesn’t understand JavaScript. Capabilities
    and preferences also not necessarily to be device or client related. A user with
    less-than-perfect eyesight might have chosen to increase the default font size
    of his display and would like that preference to carry over when his browsing
    software evaluates any'
  merge: -1
