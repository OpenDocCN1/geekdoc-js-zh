  md: '# Chapter 2: Adding Semantics to Structure


    # MANIPULATING AN INDIVIDUAL LIST Item VALUE


    It is also possible to change the numeric value of a list item to something other
    than the next sequential value. For instance, a list using Arabic numerals could
    begin using 1, 2, and 3, but you could force the fourth item to be 5 rather than
    4.


    When looking at athlete placement in sports score results, you often see individual
    rankings jump from one number down two or when two more people are tied in score.
    To do this, you''d set a specific value on the individual that comes after the
    tie—such as Nancy and Sue tied for third place. Rather than listing a fourth place
    result, the next athlete is listed as finishing in fifth place:


    ```

    <body>

    <p>Top six finishers in the Ladies 100 meter Freestyle</p>

    <ol>

    <li>Janet Davis</li>

    <li>Stephanie Lindstrom</li>

    <li>Nancy Cruz<br>Sue Clayton</li>

    <li>value=''5''Linda Nelson</li>

    <li>Suriya Khan</li>

    </ol>

    ```


    Figure 2.5 shows the result.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_43_0.png)


    Figure 2.5: Changing the value of a single list item.'
