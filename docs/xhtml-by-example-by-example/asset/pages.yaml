  md: 'keywords found in the document. Authors can provide keywords that they want
    the search engines to match by using the keywords element.


    Just how many keywords can be read, or whether you need to use every form of a
    word pertaining to your site, has been a hotly debated topic. The reality is that
    engines never record your keywords and instead index the entire page, whereas
    others read the keywords but limit themselves to the first few. Most sources suggest
    no more than 25 words, or perhaps 250 characters of keyword data, and ordering
    them by relevance. That is, keywords that best describe your site should come
    first in the list.


    Let''s take a look at the keywords on a popular web site. The Lycos Network has
    a site known as Gamesville, where visitors can play games for the opportunity
    to win small, and not so small, cash prizes (see Figure 18.1).


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_322_0.png)


