- img_proc: true
  md: '# Chapter 6: Using Frames


    # SIZING BY PIXELS


    The only method that allows a frame to be given an absolute size is that will
    be the same no matter what type of system or monitor resolution is to size it
    in pixels. The tricky part about working in pixels is that even though it''s an
    absolute size, meaning the size doesn''t change based on the user''s monitor settings
    or other factors, an apparent size does vary.


    Consider this: Many computer systems ship with a default monitor resolution setting
    of 640×480 pixels high. This means that if you create a frame that divides the
    height of the screen into two rows, and use a size of 200 pixels for the first
    frame, you''ve taken nearly half of the vertical space. However, if you''re looking
    at a system with screen resolution set to 1,024×768, a 200-pixel frame will only
    take one-fifth of the available vertical space.


    Accordingly, fixed width frames work best when the size of the contents is known
    in advance. For instance, some sites keep a small frame at the top of the screen
    to hold banner advertising or other images of a known size.


    # SIZE AS A PERCENTAGE OF AVAILABLE SPACE


    Probably the most popular way to frame sizes is to divide the screen by percentages.
    This method allows the designer to specify things like "half the screen," or "one
    quarter of the left-hand column." The only restriction placed on you is that for
    each dimension, horizontal and vertical, the figures must add up to 100%.


    # RELATIVE FRAME SIZING


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_121_0.png)


    The last method of measuring frame space is known as relative sizing. At its most
    basic, relative sizing allows the author to say "make frame X size, and make the
    other assume the remaining space." Continuing with the example of a fixed size
    ad banner frame, the author might reserve 100 pixels in height for the ad, and
    leave the rest available for content. This is done by using the asterisk (*) for
    the second size value. For example


    ```

    <frameset rows=*100, *>

    ```


    This type of design is seen on the Geek Cruises Web site (see Figure 6.2).


    This can be taken even further, expressing values as a ratio. If you wanted three
    rows instead of two, you could write


    ```

    <frameset rows=*100, 1*>

    ```


    which creates the initial 100-pixel high frame, and then divides the remaining
    space into two additional frames, the first having four pixels for every one that
    goes to the last frame.'
