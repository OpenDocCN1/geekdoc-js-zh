    how to bind these modules together and use them as a new document type.


    # Part IV: The Future of XHTML


    Chapter 17, “Subsetting XHTML: XHTML Basic,” reviews an existing usecase for a
    subset of XHTML capabilities: the XHTML Basic DTD. Chapter 18, “XHTML Document
    Profiling,” explores how authors can describe their documents in meaningful ways,
    to be cached, processed, or transformed according to the needs of various devices.
