  md: '# Chapter 4: Collecting Data with Forms


    NOTE

    If you include a file upload option in your form, you''ll need to add an additional
    attribute to the form element: enctype. Enctype controls the encoding type, or
    Internet Media Type of the data that is going to be passed. When a file is included,
    there will be two parts: the form data and the file. Therefore, the enctype value
    must be set to multipart/form-data to transmit both pieces successfully.


    # BUTTONS


    Nearly everyone is familiar with the ubiquitous “Submit” and “Reset” buttons on
    many forms. Both of these input types have special properties. The minimal syntax
    for each is shown here:


    ```

    <input type="submit" />

    <input type="reset" />

    ```


    If no value attribute is present, the browser decides what text to place on the
    button itself. Netscape Navigator and Internet Explorer both use “Submit Query”
    and “Reset,” respectively.


    You can change the text by introducing the value attribute. The text found is
    transferred to the button (see Figure 4.8).


    ```

    <input type="submit" value="Give it to me now" />

    <input type="reset" value="I''ve changed my mind" />

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_81_0.png)


    Figure 4.8: Customized text on submit and reset buttons allows for more intuitive
    instructions.'
