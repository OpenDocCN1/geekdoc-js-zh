- img_proc: true
  md: 'Finally, then, we have a complete opening tag for the root element of our XHTML
    documents:

    <html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">


    # Head, Title, and Meta Tags


    Immediately after the root element is the head element. This will contain the
    title element and any content that will be stored in meta tags.


    The title element is required of all documents. Authors should choose their document
    titles carefully. As with a book title, the document title should convey the contents
    at a glance, without resorting to lengthy sentences or the use of keywords. If
    this book were to be published as an XHTML document,

    <title>XHTML by Example</title>


    Next within the head are any required meta elements. Meta is used to hold descriptive
    information about the document itself. Often you will see author credit, creation
    date, copyright information, and other details that you might normally see in
    the front matter of a book, or in the masthead area of a magazine.


    The meta tag has two primary attributes, name and content:

    <meta name="author" content="Ann Navarro">


    The value of the name attribute can be any string of characters, provided that
    there are no spaces. That name="author-name"


    is valid, whereas

    name="author-name"


    The content attribute, on the other hand, doesn''t have that restriction, so phrases
    like my name, a list of comma-delimited values, and other entries are all possible
    values.


    A full head element for this book, then, might read:

    <head>

    <title>XHTML by Example</title>

    <meta name="author" content="Ann Navarro">

    <meta name="publisher" content="Que">

    <meta name="ISBN" content="0789723859">

    </head>


    Now you''re ready to move into the actual document content.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_29_0.png)'
