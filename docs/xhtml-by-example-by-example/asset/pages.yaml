    <input type="checkbox" name="toppings" value="green pepper" / Green Pepper

    <input type="checkbox" name="toppings" value="extra cheese" / Extra Cheese

    ```


    4.3 illustrates how check boxes are placed one after the other if no additional
    formatting is used between them.


    Based on the user''s selections, the script would return something like toppings=pepperoni&toppings=extra%26cheese&toppings=onions


    # Radio Buttons: CHOOS JUST ONE


    The second method of grouping options limits the user to a single selection, and
    that''s the radio button group. These must have the same name to operate as a
    group, and the value attribute is required to make any sense of the results. For
    example, a selection of shipping options on an ecommerce site might be written
    as


    ```

    <input type="radio" name="shipping" value="Ground" / UPS Ground

    <input type="radio" name="shipping" value="2day" / Day Air

    <input type="radio" name="shipping" value="overnight" / Overnight

    ```


    Whichever button is selected will determine the value paired with shipping.


