    \ to be careful with how you enter them within the script.\n\n+   **Path to Perl\
    \ (line 1)**—Edit this line as necessary, using the information provided by your\
    \ system administrator for the “path to Perl.” This line will **always** begin\
    \ with the # characters.\n\n+   **Email Address (line 2)**—This is the address\
    \ to which all responses will be delivered. It should be an address that someone\
    \ will be checking frequently, and does not have any artificial limit on the number\
    \ of messages that be stored there. Perl can only properly process the email address\
    \ if the @ character *escaped*. Escaping a character means alerting the Perl interpreter\
    \ that the character should simply be passed as text, rather than interpreted\
    \ as a programming instruction (in Perl, the @ indicates the beginning of an array\
    \ name). To escape the character, a backslash must be placed in front of it. Therefore\
