  md: '# Improving on Well-Formedness with Schemata or DTDs


    # # Improving on Well-Formedness with Schemata or DTDs


    As you learned in the previous section, a well-formed document ensures that the
    parser can complete the rendering of document. But wellformedness is only the
    first step. The effective exchange of data only requires a successful parsing
    of a document and data, but assume that the content of the document structures
    conform to any desired constraints.


    For instance, the ordered list element (ol1) used previously in the memo found
    in Listings 10.1–10.3 is designed to contain only one or more list item elements
    (li1). That constraint cannot be checked nor it enforced through the state of
    being well-formed.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_192_0.png)


    What''s needed, then, a second set of rules that a document can be judged against.
    Historically, beginning with SGML and moving through HTML, this rule is provided
    by the document type definition. This document provides a formal description of
    the elements, attributes, and allowed content for each segment of a document that
    may be written in the language being defined.


    Beginning in 1998, the W3C has been working on a second method of describing and
    defining languages. The desire is to end up with a document mechanism that is
    simultaneously more flexible than a document type, but also more expressive. The
    expressiveness comes with the ability to constrain element content not only down
    to the level of simple text data, but to say "the content must be a 10-digit number,"
    or "a string of five lowercase letters." Additional constraints possible with
    schemas are viewed as a significant advancement in Internet commerce and automated
    data exchange. How well these efforts work remains to be seen, the XML Schema
    specifications are solidified and ratified by the W3C.


    # ## Overview of Document Type Definitions


    The DTD, or document type definition, has been the traditional means of constructing
    the formal grammar of a markup language. Every element is defined in terms of
    what other elements might be contained inside, and whether any raw data also is
    allowed.


    For instance, the definition of the root element for all documents, the html element,
    allows just two other elements inside: head and body. If anything else were found
    within the html element, perhaps a sentence, or an image, the document wouldn''t
    conform to the rules of grammar defined in the document type definition and then
    would be declared *invalid*.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'A valid document, then, is one that fully conforms to all the rules in the
    document type definition. You''ve been exposed to this at a basic level already
    in Chapter 8, “Validating XHTML Documents,” when you checked your documents with
    the W3C Validation Service.


    For most documents that Web authors work with, inserting the DOYPE declaration
    at the beginning of your pages and running them through the validator is the closest
    you''ll come to the document type definition. But some of you, at least a small
    portion of the time, will begin working with DTDs to customize portions of the
    language and use XHTML Modularization to create new languages.


    +   ✓ For more information on creating custom components for DTDS, see “Creating
    the Module Using a DTD,” p. 266.


    # Overview of Schemas


    Over the years document authors voiced many complaints about the nature and limitations
    of the document type definition as the basis of a markup language. Many people
    find the notation and formatting used to be overly formal and, primarily, too
    confusing for the non-expert to be easily readable.


    Additionally, document type definitions are limited in the constraints that can
    be placed on data content within elements, and the type of string data that can
    be found in attribute values.


    For instance, documents that contain phone numbers could make use of <telephone>
    element. Nothing other than the number (and its dividing dashes) should be present:


    ```

    <telephone>941-555-1234</telephone>

    ```


    Using a document type definition, the element content can only be restricted to
    CDATA, or parsed character data. This means that I could write the following element,
    and still valid:


    ```

    <telephone>I shouldn''t be writing text here, but the DTD cannot prohibit it.</telephone>

    ```


    Obviously that''s not what we want to see in a telephone element. In other computing
    disciplines, especially in the world of database management, we''ve been able
    to constrain data to specific string types or even patterns.


    In 1998, the W3C began on creating a new way of defining markup languages that
    offered these additional constraints. The effort became known as XML Schemas.
    Experts from a wide range of disciplines brought together: those who helped draft
    the XML Recommendations, data-base experts, SGML experts, and other information
    architects. At the time this book was printed, the XML Schema documents were nearing
    the end of


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_193_0.png)'
  merge: -1
