  md: "# Chapter 16: Combining Custom Modules with XHTML\n\nListing 16.1: continued\n\
    \n```\n<!-- instantiate the Document Model module declared in the DTD driver\n\
    -->\n%xhtml-model.mod;]>\n\n<!ENTITY % xhtml-charent.module \"INCLUDE\" >\n[%xhtml-charent.mod;\n\
    \  <!ENTITY % W3C//ENTITIES XHTML\n    PUBLIC \"-//W3C//ENTITIES XHTML Character\
    \ Entities 1.0//EN\"\n    \"xhtml-charent-1.mod;\\]>\n\n%xhtml-charent-framework-1.mod\
    \ -->\n end of xhtml-framework-1.mod\n```\n\nThe first segment contains the standard\
    \ description filenames, copyright statement, and on which module and system identifiers\
    \ will be used, namely:\nPUBLIC \"-//W3C//ENTITIES XHTML Modular Framework 1.0//EN\"\
    \nSYSTEM \"xhtml-framework-1.mod\";\n\nNext is the description of the module's\
    \ purpose, namely to provide the DTD components that will be required in all XHTML\
    \ compliant languages:\n\n+   - Notations—Conventions used in other languages\
    \ and some defined in XHTML, including CDATA, FPI, and others.\n- Data types—Definitions\
    \ of terms such as length, number, pixels, and so on.\n- Namespace-qualified names—Add\
    \ the ability to use namespaces to qualify names for differentiation between XHTML\
    \ names and names from other markup languages.\n- Common attributes—Define the\
    \ attribute sets referenced by existing and extended XHTML modules.\n- The document\
    \ model—Instantiated by the Document Model module declared by the DTD driver.\n\
    - Character entities—Provide the ability to include the Latin 1, Symbol, and Special\
    \ Character collections in your documents.\n- Support for intrinsic events—Turned\
    \ off by default.\n\nIt's not necessary to edit any of these components, and it's\
    \ not even necessary to understand how they work. Just know that this Framework\
    \ Module provides the basic components required for a complete markup language\
    \ in the XHTML Family.\n\nNow that you know where each piece of the DTD puzzle\
    \ is coming from, it's time to create a DTD for our new language."
