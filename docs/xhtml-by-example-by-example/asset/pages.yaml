  md: '# Chapter 13: Document Type Definitions—The Syntax Rule


    ```

    style         %Stylesheet; #IMPLIED

    title         %Text;      #IMPLIED

    >

    ```


    Added to the existing ATTLIST, we get:


    ```

    <!ATTLIST h1

    id               #IMPLIED

    class          CDATA      #IMPLIED

    style         %Stylesheet; #IMPLIED

    title         %Text;      #IMPLIED

    %i8n;

    %events;

    %TextAlign;

    >

    ```


    Delving deeper into coreatts, we need to expand Stylesheet and Text:


    ```

    <!ENTITY %Stylesheet ''CDATA''>

    <!ENTITY % Text ''CDATA''>

    which allows us to write:

    ```


    ```

    <!ATTLIST h1

    id               #IMPLIED

    class          CDATA      #IMPLIED

    style         CDATA      #IMPLIED

    title         CDATA      #IMPLIED

    %i8n;

    %events;

    %TextAlign;

    >

    ```


    Next we expand i8n:


    ```

    <!ENTITY % i8n

    "lang          %LanguageCode; #IMPLIED

    xml:lang      %LanguageCode; #IMPLIED

    dir           (ltr|rtl) #IMPLIED"

    >

    ```


    Only the single entity LanguageCode needs to be resolved:


    ```

    <!ENTITY LanguageCode "NMTOKEN">

    ```


    > TIP

    Though DTDs do not have the power to constrain NMTOKEN further than its initial
    naming rules, a comment in the DTD indicates that the token should conform to
    the list of language codes, which are defined in RFC1766.


    At this point, the expanded ATTLIST looks like this:


    ```

    <!ATTLIST h1

    id               #IMPLIED

    class          CDATA      #IMPLIED

    ```'
