  md: "# Chapter 13: Document Type Definitions—The Syntax Rulebook\n\n# Parameter\
    \ Entities\n\nParameter entities are entities that are used only within the DTD\
    \ that defines them. Most often, they're used as a form of shorthand. Instead\
    \ of writing attribute definitions repeatedly in the various elements that might\
    \ contain them, a parameter entity is defined and then used for those elements.\n\
    \nFor example, the align attribute is used in many text-containing elements: headings,\
    \ paragraphs, and so on. A parameter entity \"TextAlign\" is defined, acting as\
    \ a replacement for the att-list declaration:\n\n<!ENTITY % TextAlign \"align\
    \ (left|right) #IMPLIED\">\n\n![](img/a046e2e08ea170a8a111d9784d7fba9b_245_0.png)\n\
    \nThen any the align attribute is needed (for text alignment issues), the entity\
    \ is used, preceded by the % symbol, instead of the actual declaration, and is\
    \ done here the ATTLIST for the h1 element:\n\n```\n<!ELEMENT h1 %Inline;\n<!ATLIST\
    \ h1\n  %attrs;\n  %TextAlign;>\n```\n\nAs you can see, there are two other parameter\
    \ entities in this element and att-list declaration: Inline and attrs. Parameter\
    \ entities are used throughout XHTML to improve the readability of the DTD. At\
    \ the same time, however, you need to understand all that the PE represent when\
    \ they're used in this manner. Let's expand each of the entities to see what the\
    \ declarations would look like without them.\n\nThe first entity is Inline, which\
    \ represents the content model for the h1 element. Inline was defined as follows:\n\
    \n<!ENTITY % Inline \"#CDATA | %inline; | %misc;\">\n\nThe Inline entity provides\
    \ a content model, a choice between zero or more of #CDATA, or the models represented\
    \ by the Inline or misc entities. Replacing Inline with its expansion, the declaration\
    \ for h1 becomes\n\n<!ELEMENT h1 (#CDATA | %inline; | %misc;)\">\n\nSo we need\
    \ to look at the Inline entity:\n\n<!ENTITY % inline \"a | %special; | %fontstyle;\
    \ | %phrase; | %inline.forms;\"\n\nThis results in the following element declaration:\n\
    \n<!ELEMENT h1 (#CDATA | a | %special; | %fontstyle; | %phrase; | %inline.forms\
    \ | %misc;)\n\nNext to be expanded is the special entity:\n\n<!ENTITY % special\
    \ \"%br | span | bdo | object | applet | img | map | iframe*\">"
