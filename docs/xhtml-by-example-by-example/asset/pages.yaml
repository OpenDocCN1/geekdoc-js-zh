    Table 2.1: Available Bullet Types for Unordered Lists


    | Attribute Value | Representation |

    |---|---|

    | Default (unstated type) Square | A filled circle |

    | Square | A small filled circle |

    | Circle | An unfilled circle |

    | Disc | A filled circle |


    The following example makes use of the default, circle, and square delimiters
    types:


