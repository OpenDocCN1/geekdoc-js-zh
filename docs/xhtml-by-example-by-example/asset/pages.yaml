    # Design Tips for Frames


    Web users for the most part either love frames or they hate them. There''s very
    little middle ground on the subject. Although some people think they''ve gotten
    a bit of a rap, most of the complaints about frames are firmly grounded in usability
    issues.


    # Interoperability


    Nearly by definition, frames suffer from a lack of interoperability. Support is
    limited to the major browsers designed for desktop computer use. Limitations in
    screen size, processing power, or rendering methods (in the case of screen readers
    and Braille devices) make much of framed content unreachable by a considerable
    portion of the Web audience.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'Additionally, some authors tend to find it cumbersome to maintain alternative
    access methods, or find the noframes syntax confusing or difficult to implement.


    # User Manipulation


    One of the highest compliments a Web page can get is to find itself on a user''s
    bookmark or favorites list. After all, that''s what you''re after, isn''t it,
    visitors who find your information to be a valuable resource?


    But what happens when they try to bookmark a framed site? The bookmark is made
    to the main site, not the individual page the user navigated to. When working
    in a knowledge base or other system where users can find themselves many levels
    into a site, this can be an extremely frustrating experience for them to not be
    able to locate the document again using the bookmark.


    A second problem comes up when users try to print framed material. Most browsers
    do not support the printing of the entire window, instead printing only the frame
    that currently has the system focus. Those browsers that attempt to print the
    entire window (such as Internet Explorer 4 or 5), often generate inconsistent
    results when content in any of the frames is out of view. Sometimes content will
    be clipped to the visible area, and other times users find themselves with page
    after page of partially blank paper as the printer tries to recreate the framed
    look on the screen although it''s only scrolling through a single frame.


    Users can, to some extent, work around this problem by clicking within the frame
    they want to print, and most browsers will acknowledge the change in focus and
    print the desired area. However, without the remaining text provided by the other
    frames, some data might be lost when the printed version is read at a later date.


    # Size with Care


    When working with fixed frame sizes, as you did in the recipe site, be very careful
    to measure your content accurately. If a frame is of a fixed size, and you prevent
    scrolling and resizing in the frame element, users might not be able to view all
    of the content you intended if it requires more than the visible space. Figure
    6.9 shows what happens when you change the banner frame to a size of 60 (versus
    the original 100) on the recipe site. You can see, the banner image is chopped
    off just below its top.'
