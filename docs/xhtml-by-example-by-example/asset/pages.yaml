  md: '# Chapter 12: XSL—Style the XML Way


    hierarchical, branching structure consisting of several types of node, which will
    be discussed in more detail later.


    In fact, when an XSLT processor is processing an XML or XHTML document, there
    are typically three trees in memory at the same time:


    +   - The source tree, which is usually an XML (or XHTML) document

    - The tree representing the XSLT style document (itself an XML document)

    - The root tree, which is the document in a new form ready for display whether
    it be an XML document, an XHTML document, or HTML document or text


    Once the root tree is created, if it is an XHTML document, it can be displayed
    directly in a Web browser or saved to disk. A Cascading Style Sheet can be applied
    to improve or create the presentation of the output tree. Simple examples of both
    will be shown towards the end of this chapter.


    Many XSLT transformations will take place in the setting of complex systems. In
    such circumstances it is quite possible that there might multiple XML source documents
    processed by one style sheet; the stylesheet itself might consist of modules,
    and a result tree might not be played or saved to disk but might act as the source
    XML document for a further transformation. Detailed consideration of such systems
    is beyond the scope of this chapter.


    # CAUTION


    XML documents include white space—space characters, tabs, new lines, and carriage
    returns. There are many subtle issues related to processing and outputting white
    space characters. To avoid frustration you will need to read and understand the
