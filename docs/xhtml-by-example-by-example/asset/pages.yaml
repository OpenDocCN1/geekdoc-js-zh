    XPath will be discussed in more detail later in this chapter.


    # What Is XSL?


    It might seem pretty odd to ask what XSL is in a chapter like this, but different
    people have used and are using the term to refer to different things. If you are
    to avoid the possibility of getting very confused and wasting a bit of time trying
    to work out why you are having problems, you need to be aware of that difference
    in usage of the term XSL. The different types of XSL will work together in some
    circumstances but not in others. Knowing which of XSL applies in a particular
    context therefore help you to avoid problems, either in your thinking or, sometimes,
    when one of XSL will simply not work at all or fail to work as you expect it to.


    There are basically four ways in which the term XSL is used:


    +   * As a combination of XSL and XSL-FO

    * As XSL without XSL

    * As Microsoft proprietary XSL, that is non–W3C-compliant XSL

    * Ambiguously or indiscriminately to refer to any one or combination of the first
    three


    The potential for confusion arises from variations in terminology by the W3C over
    time. For example, a W3C document implies XSL can be used separately from XSL,
    whereas others state that XSL is part of XSL. Part of the problem in unambiguously
    describing this area arises because XSL and XSL-FO will, when XSL-FO is finalized,
    very close together.


    To complicate further, there are several versions of Microsoft XSL available,
    each with varying degrees of compliance with the W3C standards. The Microsoft
    XSL originally supplied with Internet Explorer 5.0 is now obsolete. At the time
    of writing, the July 2000 Release was current and was significantly closer to
    W3C standards than'
