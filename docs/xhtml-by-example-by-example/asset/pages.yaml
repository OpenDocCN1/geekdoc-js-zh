  md: '# Creating an XSL Style Sheet


    The current Working Draft describing XSL-FO is many times larger than, for example,
    the XSLT 1.0 Recommendation, and detailed consideration of its contents is beyond
    the scope of this chapter. I estimate that the current Working Draft is equivalent
    to a printed document of perhaps 500 pages! Thus, you will realize that this section
    is a very compressed account of a topic that would require a substantial book
    simply to describe.


    If you want to explore some of the detail of the current Working Draft, you can
    find it at

    http://www.w3.org/TR/2000/WD-xslt-20000327/


    At the present time Web browsers do not support XSL-FO, and are unlikely to do
    so for some time after the XSL-FO Recommendation is finalized.


    # Creating an XSL Style Sheet


    So, now you have looked at some of the XML technologies relevant to XSL Transformations,
    how does it all work in practice?


    In this section you will see two examples of using XSL style sheets (also known
    as transformation sheets).


    After the XSL-FO part of the Extensible Stylesheet Language is released as a W3C
    Recommendation, you can expect to be able to use XSL style sheets to combine transformation
    (XSLT) and the inclusion of formatting objects (XSL-FO) in the result tree.


    # Basic Style Sheet Concepts


    An XSL style sheet is an XML document. Therefore, although it is not compulsory,
    it is useful to include an XML declaration as the first line of your XSL style
    sheet.


    The simplest form of XML declaration is


    ```

    <xml version="1.0"?>

    ```


    All XSL style sheets must have either an <xsl:transform> or an <xsl:stylesheet>
    element as the root element. The <xsl:transform> and <xsl:stylesheet> elements
    mean exactly the same.


    # CAUTION


    Remember that the element root—either <xsl:transform> or <xsl:stylesheet>—is the
    outermost element within a document. The document entity itself is the root node
    in the XSL tree, and the element root is a child of the document entity. If, for
    example, you mix up the two concepts, you may find that your XPath paths fail
    to select the nodes you want to choose.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Chapter 12: XSL–Style the XML Wave


    The <xsl:stylesheet> element typically will have a namespace declaration and number
    as attributes contained within it, like this:

    ```xml

    <xsl:stylesheet

    xmlns="http://www.w3.org/1999/XSL/Transform"

    version="1.0">

    ```


    CAUTION


    If you find an XSL style sheet that includes the text xmlns:xsl="http://www.w3.org/TR/xml-xsl"
    in the namespace declaration attribute of <xsl:stylesheet> or <xsl:transform>,
    the style sheet is using an outdated-propri form of Microsoft XSL, which deviates
    from the W3C standard. Updates to a more conformant version of MSXML can be downloaded
    from the www.microsoft.com.


    The current form of the namespace declaration is

    ```xml

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    ```


    So, the basic skeleton of an XSL style sheet looks like this:

    ```xml

    <?xml version="1.0" ?>

    <xsl:stylesheet

    xmlns="http://www.w3.org/1999/XSL/Transform"

    version="1.0">

    <!-- The "meat" of the stylesheet will go here ---->

    </xsl:stylesheet>

    ```


    This style sheet is well-formed XML. Unfortunately, it does absolutely nothing.
    But the positive side of that is that it produces no errors either. So, you can
    think about putting useful content into your first style sheet.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_227_0.png)


    # A Simple Example Style Sheet


    It is traditional in many programming languages to include a self-contained program
    as the first example of a "real" program. So, because XSL is in many senses very
    much a programming language, we will produce a short example, using the famous
    quote cited earlier in this chapter.


    The source XML document looks like this:

    ```xml

    <?xml version="1.0" ?>

    <famous_quote>To be or not to be?</</famous_quote>

    ```


    If we try to view that XSL file just as it is in Microsoft Internet Explorer 5.0,
    it doesn''t look very impressive.'
