  md: "# XPath—XML Path Language\n\n# Abbreviated and Unabbreviated Syntax\n\nLike\
    \ many things related to XML, there is more than one way to achieve the same thing.\n\
    \nXPath provides for two types of syntax to describe the location path of an object.\
    \ The abbreviated syntax, not surprisingly, provides a shorter way to express\
    \ XPath expressions.\n\nLet's compare some XPath expressions in the unabbreviated\
    \ and abbreviated syntax for a simple XML document:\n\n![](img/a046e2e08ea170a8a111d9784d7fba9b_222_0.png)\n\
    \n```\n<?xml version=\"1.0\"?>\n<book title=\"XHTML By Example\">\n  <!-- Some\
    \ other chapters would be listed here -->\n\n<chapter title=\"XSL: Style the XML\
    \ Way\">\n  <section title=\"XSLT Transformation\"></section>\n  <section title=\"\
    XPath - XML Path Language\"></section>\n  <section title=\"XSL-FO XSL Formatting\
    \ Objects\"></section>\n  <section title=\"Creating an XSL Stylesheet\"></section>\n\
    </chapter>\n\n  <!-- Some other chapters would be listed here -->\n</book>\n```\n\
    \nIf the current context node was <book> then to find a <chapter> element, which\
    \ is a child of the <book> element, we could use the following XPath expression:\n\
    \nchild::chapter is the unabbreviated syntax, or\n\nwhich is the abbreviated syntax.\n\
    \nIn this example, child:: is the axis. It can be omitted in the abbreviated syntax,\
    \ because child:: is the default axis. The node test is chapter. There is no predicate\
    \ in this XPath location path, either in the unabbreviated or abbreviated syntax.\n\
    \nAn XSLT processor will process the unabbreviated and abbreviated syntax identically\
    \ (assuming each has been written correctly). Which you use is a matter of personal\
    \ preference in some circumstances. The unabbreviated syntax is typically more\
    \ explicit, whereas the abbreviated syntax is typically shorter. For some location\
    \ paths, there is no abbreviated equivalent, so the unabbreviated syntax must\
    \ be used."
