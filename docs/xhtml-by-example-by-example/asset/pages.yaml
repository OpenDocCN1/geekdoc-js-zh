- img_proc: true
  md: '✔ For a complete review of DTD syntax, see “EBNF: The Syntax of the DTDs,”
    p. 226.


    Taking the first element of the List Module, d1, the minimal content model is
    defined as (dt | dd)+ This says that the d1 element is required to contain at
    least a dt element and/or a dd element.


    The occurrence indicator shows that one or more sets of dt and dd elements might
    be contained within d1.


    Minimal content models also might reference collections of elements known as content
    sets, just as the set of allowable attributes is often defined by a collection.
    The minimal dt element in the List Module uses just a collection when it is defined
    as (CDATA|Inline). This model says that the dt element can contain processed character
    data and any elements contained within the Inline content set, either of which
    might be found zero or more times the dt.


    The Inline content set is defined in the prose of the Text Module is found at
    the following elements: abbr, acronym, A, cite, code, defn, em, qbd, q, span,
    and var (see Appendix A at http://www.w3.org/TR/xhtml1/xhtml-modularization-2000075.html#s_textmodule).


    A link to the DTD implementation of each abstract module is found at the end of
    the prose description. We''ll continue to explore the List Module by reviewing
    its implementation DTD.


    # DTDs or Schemas


    The implementation of an abstract module is written as a fragment of a DTD. The
    DTD fragment from each abstract module that will be a part of the new document
    type is assembled into a single definitive DTD for the new XML Family Member document
    type. This resulting document type is as complete as any other document type,
    and can be used to validate documents written to conform to it, either through
    a validating parser or a tool such as the W3C Validation Service.


    ✔ For a review of using the W3 Validation Service, see “Using the W3C Validator,”
    p. 145.


    # NOTE


    It is the intention of the W3C to explore defining modules in XML Schema, but
    until that work has reached Recommendation status, the XHTML Modularization documents
    are written using DTDs.'
