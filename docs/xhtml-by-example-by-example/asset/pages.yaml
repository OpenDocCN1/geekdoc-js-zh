  md: '# Style in the XHTML World


    It is possible, using XHTML 1.0, to create an internal style sheet within a document
    using the style element. XHTML 1.1 also allows that, if you use the stylesheet
    module. XML depends on external style, so you can use internal style sheets at
    this point with XHTML, I''d encourage you to get comfortable using external style
    sheets, especially if you haven''t done so before. Additionally, external style
    sheets can reduce time needed for maintenance. Therefore the examples in this
    chapter, and moving forward in the book, all will use external style.


    Writing the external style sheet itself is as simple as ever. Just open a blank
    document in your text editor and write your style rules. It can be as simple as
    a single rule for text in a paragraph:


    ```

    p {text-decoration:underline};

    ```


    The file is then saved using the .css file extension. The style is then linked
    to the link element inside the head element.


    The XHTML document begins as it normally would:


    ```

    <xml version="1.0" encoding="UTF-8"?>

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.1//EN"

    "http://www.w3.org/TR/html11/DTD/xhtml11.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <title>Meeting Data</title>

    <link rel="stylesheet" href="calendar.css" />

    </head>

    <body>

    <h1>Scheduled Meeting</h1>

    <p><b>With:</b><br /> Shane McCarron<br />

    <p>From:</br /> ApTest<br />

    <p>Time: **10:00 am**</p>

    <h2>Details</h2>

    <p>Discuss parameters of test suite for conformance of Widgets 1.0 to the W3C
    standards.</p>

    </body>

    </html>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_197_0.png)


    Before the head is closed, the link element will be inserted. This element takes
    a minimum of two attributes: rel and href. The rel attribute describes the relationship
    between the current document and the document being linked. The href attribute
    works as it does with an anchor (element); it provides the URI of the linked document.
    Our link element, then, is written as follows:


    ```

    <link rel="stylesheet" href="calendar.css" />

    ```


    The head element can be closed after this, and the remainder of the document is
    put in place:'
