  md: '# XPath—XML Path Language 209


    particular element (or an attribute of a particular element) within the tree of
    nodes to apply the desired transformation to.


    When you get street directions the way they are expressed varies depending on
    where you are starting from. XPath works the same way. For the XSLT processor
    to be able to know where to apply a transformation, it needs to know where you
    are starting from. The XPath term for your location is called the context node.
    This simply refers to the node in the XSLT tree where you can think of the XSLT
    processor as focussing on at.


    Before looking in more detail at what XPath jargon are called location paths,
    you need to know a little about XPath nodes.


    # XPath Nodes


    As mentioned in the discussion earlier in this chapter, an XML document is converted
    when loaded into memory and parsed into a tree-like structure of nodes.


    XPath allows for seven different types of node within a tree:


    +   Root nodes—There is only one of these in an individual document, which corresponds
    to the document entity of the XML 1.0 specification. A root node can have as its
    children element nodes, processing instruction nodes, and comment nodes.


    +   Element nodes—There is an element node for each element in the source XML
    document. One element node, the element root, is a child of the root node in a
    well-formed XML document.


    +   Text nodes—Character data is grouped into text nodes. As character data as
    possible is grouped into each text node.


    +   Attribute nodes—Each element has an associated set of attribute nodes; the
    element is the parent of each of these attribute nodes. However, an attribute
    node is not a child of its parent element.


    +   Namespace nodes—This can be envisaged as a representation of the Namespace
    Declaration. An element node will have a namespace node for each namespace declaration
    which is in scope.


    +   Processing instruction nodes—There is a processing instruction for every processing
    instruction in a source document, except for those processing instructions which
    may be contained in a document declaration.'
