  md: '# Combining Predefined Modules


    The strength of XHTML Modularization lies in the relative ease in which modules
    can be combined into any number of new languages. I say relative ease, in that
    the process isn''t exactly "plug and play." The creation of modules is that the
    designers of XHTML Modularization don''t expect the average Web author to do very
    frequently, if at all. However, you are much more likely to want to take DTDs
    or subtract predefined modules to match the needs of your current client or project.
    Luckily, that portion of the process is one of the easiest if you follow the steps
    outlined here.


    +   For a full walk-through of combining modules to form a new DTD, "Integrating
    the New Module," p. 279.


    # DTD Drivers: The Glue That Holds Modules Together


    The W3C has provided the skeleton for a new DTD based on XHTML Modularization.
    It can be found online at http://www.w3.org/TR/2000/WD-xhtml-building-20000105/template.dtd,
    and is reproduced here in its entirety (see Listing 14.2).


    Listing 14.2: TEMPLATE.dtd


    ```

    <---

    <!-- SKELETAL DTD -->

    <!---- file: TEMPLATE.dtd --

    -->

    <!---- SKELETAL DTD --

    -->

    ```


    This is a skeletal driver file. Modify however you want, paying careful attention
    to the embedded comments about order.


    Please use this formal public identifier to identify it:


    ```

    //W3C//DTD XHTML-MYDTD//EN"

    //-->

    <!ENTITY % XHTML.version "-//W3C//DTD HTML-MYDTD//EN" >

    ```


    Reserved for use with the XLink namespace:


    ```

    <!ENTITY % XLINK.ns "" >

    <!ENTITY % Xlinkns.attr "" >

    ```


    ```

    reserved for future use with document profiles -->

    <!ENTITY % XHTML.profile "" >

    ```'
