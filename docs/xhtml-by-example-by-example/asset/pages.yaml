  md: '# 318 Chapter 19: Next Steps for XHTML


    # ## CC/PP—Composite Capabilities/Preferences Profiles


    The advent of connexion to the World Wide Web from mobile devices brings with
    many possibilities and opportunities. Looking beyond the hype, of which there
    is an enormous amount at present, there are also genuinely exciting possibilities.
    In parallel with those opportunities, there are also significant technical issues
    yet to be solved.


    One of those issues is to ensure that the Web page (or "deck") on mobile browsers)
    sent by a Web server is appropriate to the browser to which it is sent.


    The exchange of information between a browser and server, which will form an important
    mechanism underlying CC/PP, does not arise in a vacuum. Already it is possible
    to exchange information using the header of HTTP message. There are already many
    ways to access HTTP header information. In Figure 19.1, I show some information
    displayed by one of the currently available techniques—a simple JavaScript page—which
    can access information in an HTTP header.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_329_0.png)


    Request Method: GET

    Request URL: /examples/jsp/snoop/snoop.jsp

    Request Protocol: HTTP/1.1

    Server path: null

    Path info: null

    Query string: null

    Content length: -1

    Content type: null

    Server name: localhost

    Server port: 8080

    Remote user: 127.0.0.1

    Remote host: localhost

    Authorization scheme: null


    The browser you are using is Mozilla/4.0 (compatible), MSIE 5.5; Windows 98


    Figure 19.1: This shows a simple JavaServer page, which displays some information
    extracted from an HTTP header. Note the information about the browser in the final
    line of the page.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# CC/PP—Composite Capabilities/Preferences Profiles


    The existing information in an HTTP header provides information about the browser
    that''s being used. CC/PP will provide further information to enable the server
    to serve an appropriately customized page.


    CC/PP provides a composite view of the technical capabilities of a browser (the
    capabilities of CC/PP) and the personal preferences of the person using the browser
    regarding how they want the browser to behave (the preferences of CC/PP).


    Most mobile browsers suffer from significant limitations when compared to a typical
    desktop PC-based browsing experience. The screen might be of the order 100×100
    pixels compared to perhaps 1,024×768 on the desktop. The screen might be monochrome
    compared to full color on the desktop. The keyboard of a mobile device is likely
    to be very limited compared to a standard or enhancedWERTY keyboard. Bandwidth
    on wireless connections, and for some time are likely to remain, significantly
    slower than a wired connection. Most mobile devices will have markedly less memory
    than a typical desktop machine.


    To attempt, to transmit a 500×500—pixel Flash movie to a typical browser is hardly
    likely to be an experience to be enjoyed or be repeated. Worse still, it is likely
    to communicate nothing to the user. A way is needed for users of mobile browsers
    to be able to access relevant content which the limitations of their mobile browser
    do not render incomprehensible, invisible, or a totally slow and frustrating ordeal.


    If using mobile browsers is to be a productive activity, a way has to be found
    to match a browser with the material served to it. One answer is CC/PP. The purpose
    of the CC/PP initiative is to provide a way for browsers particularly, but more
    generally to allow all browsers, to serve Web pages or other content that matches
    the capability of the browser in use at any point in time.


    For this to work the browser, in some way, will be able to communicate directly
    or indirectly an indication of its capabilities. The server will be able to reliably
    identify a browser''s capabilities and provide an appropriate Web page to that
    browser. This approach underlies much of CC/PP.


    Another approach that might be applicable in some settings is to serve modularized
    data. A browser will only handle those parts it understands. This might apply
    on a television-based browser that has no capability to express its preferences
    by sending capability information to the Web server.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Metadata and the Resource Description Framework


    Metadata is data about the information contained within, for example, an XML document.
    It is not the information contained in the document but a description of one or
    more characteristics of it.


    You might well be familiar with early attempts at providing metadata on the World
    Wide Web in the <META> tags of the head of HTML, and later XHTML, documents.


    User agent (browser) profiles are expressed in terms of the Resource Description
    Framework (RDF). RDF is the foundation of much of the W3C''s work on metadata.
    More specifically, RDF is the foundation for CC/PP.


    RDF is a model for representing properties and property values. For example, resources
    might include a Web page or a collection of Web pages.


    A property is an aspect of a resource. A property will define its permitted values,
    the types of resources it can describe, and its relationship with other properties.


    An RDF statement consists of a specific resource together with a named property
    and a value of that property.


    The Resource Description Framework uses XML to exchange descriptions about the
    content of Web resources. Although XML is used within RDF, the content of the
    Web resources being described not be in XML and can be in any format.


    If you want to look at RDF in more detail, the current version is a Candidate
    Recommendation entitled "Resource Description Schema Specification 1.0," which
    is located at http://www.w3.org/TR/2000/CR/rdf-schema-20000327


    RDF is also the foundation of CC/PP, the semantics of which are overlaid on RDF.


    # CC/PP Terminology


    For a Web server to be able to identify the nature and capabilities of the variety
    of browsers that access it, new concepts are raised; not surprisingly, CC/PP involves
    quite a bit of new jargon.


    Some terms might be familiar to you, but others are likely to be unfamiliar at
    least some readers.


    Not all the terminology relating to CC/PP is described here. Further details can
    be obtained by consulting the W3C documents listed later in this section.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# CC/PP—Composite Capabilities/Preferences Profiles


    Here are some of the terms that apply to the browser end of:


    +   User Agent Profile—A description of the capabilities and preferences of a
    client device or user agent—in other words, a browser.

    Attributes—The characteristics or capabilities of a user agent that together constitute
    the user agent profile—for example, screen resolution.

    Hint—The expression of a preference. This will carry weight with the origin server
    (see the following) but is unlikely to be mandatory. For example, the browser
    might indicate that it prefers to be served rather than HTML.


    At the Web server end, these terms are in use:


    +   Origin Server—A Web server that originates or supplies Web content to a user
    agent.

    Authentication—Confirmation of the identity of a user/browser.

    Content Selection—The selection of a document to serve that is appropriate to
    the CC/PP of the user agent.


    Some terms involve both the client and browser:


    +   Capability—The attributes of, usually, the receiver of a message. It can,
    however, also apply to the capabilities of a server with regard to the types of
    messages it is capable of serving.

    Content Negotiation—A process that involves exchange of information between an
    origin server and a user agent allowing a user agent to make a choice about which
    of a range of available content formats is most acceptable.


    A CC/PP profile describes client (or user agent) capabilities in terms of number
    of CC/PP attributes, or *features*. Each of these features is identified by a
    name in the form of a URI (Uniform Resource Indicator). A collection of such names
    used to describe a client is called a *vocabulary*.


    CC/PP describes a small, core set of features that are widely applicable and constitute
    the core vocabulary of CC/PP. In addition, it is anticipated that extension vocabularies
    will also be supported. You might recognize similarities to the extensibility
    enabled by modularization of XHTML, which was described in Chapter 14, “XHTML
    Modularization,” and Chapter 16, “Combining Custom Modules with XHTML.” It is
    anticipated that the extension vocabularies might be standardized for, for example,
    imaging devices, voice messaging devices, and wireless access devices.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter 19: Next Steps for XHTML


    CC/PP vocabulary terms are expected to be constructed from a Namespace URI (see
    the introduction to XML Namespaces in Chapter 12, “XSL—Style the XML Way”) together
    with a local attribute type to yield an attribute URI of the following general
    form:


    ```

    http://w3c.org/cpppp-core-vocabulary/type

    ```


    Please note that, because the current documents are only a draft, the applicable
    URI might change.


    # Flexible, Extensible, and Distributed


    The designers of CC/PP aim to make it flexible, extensible, and distributed.


    It has to be flexible because, in practice, it isn''t possible to predict all
    future user agents that might come into use.


    It has to be extensible for similar reasons. It must be possible to add new types
    of profile.


    It has to be distributed. A centralized register might suffer from system vulnerabilities
    that are contrary to the principles that led to the design of the Internet to
    ensure it was resistant to physical or other problems at one location.


    # Current Scope of CC/PP


    As currently drafted CC/PP does not fully describe the protocols or other means
    by which Preferences Profiles might be transmitted.


    Currently no formal requirements document has been produced by the W3C working
    group, a situation that is a little unusual. Formal requirements documents have
    the potential advantage of sharply focussing thought.


    However, there is a requirements summary that provides an overview of likely requirements.


    The current drafts certainly recognize the need for security but more detailed
    consideration of such issues might be one benefit of developing a formal requirements
    document.


    # CC/PP and XML or XHTML


    There are several ways in which CC/PP might specifically involve the use of XML
    and/or XHTML.


    CC/PP is built on a foundation of the Resource Description Framework that is,
    of course, expressed in XML.


    Use of RDF does not require CC/PP to be expressed in XML but it is possible, perhaps
    likely, that the CC/PP protocol itself (however its final version might look)
    will be available in an XML-compliant form.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# CC/PP—Composite Capabilities/Preferences Profiles 323


    CC/PP identifies the capabilities of the user agent together with how the user
    prefers to use them. XHTML Document Profiles expect the required functionality
    for what the document author perceives as optimal rendering of the document. Hence,
    CC/PP and XHTML document profiles might, in certain settings, be compared when
    an origin server is considering the optimal type of content to be delivered to
    a user agent.


    Background information on XHTML document profiles can be viewed at http://www.w3.org/TR/1999/WD-xhtml-profile-req-19990906


    Both CC/PP and XHTML document profiles can be considered as potential participants
    in the process of content negotiation in the capabilities and preferences applicable
    to the user agent are compared to the capabilities or available document versions
    on the origin server.


    After the preferences profile of a user agent has been identified, XMLXHTML might
    additionally be involved. In some situations a suitable Web page might be created
    dynamically, using XSL transformations and, perhaps, XSL-FO Formatting Objects
    that apply and extend the principles that were described briefly in Chapter 12.


    # The W3C Documentation on CC/PP


    The W3C involvement in the development of Composite Capabilities/Preferences Profiles
    is part of the Mobile Access Activity within W3C, which is developing several
    initiatives relevant to mobile browsers.


    At the time of this writing Working Drafts to CC/PP have been made available to
    the public. If you are interested in coming to grips with this technology, familiarity
    with these documents, and succeeding documents further develop these ideas, will
    be a must.


    These are the currently available documents:


    +   * Composite Capabilities/Preference Profiles: Requirements and Architecture
    http://www.w3.org/TR/2000/WD-CCPP-ra-20000721/


    +   * Composite Capability/Preference Profiles (CC/PP): Structure http://www.w3.org/TR/2000/WD-CCPP-struct-20000721/


