  md: 'The start tag of the &lt;xml:stylesheet&gt; element declares the XSL namespace
    using the official W3C URI match="/" for XSLT.


    ```

    &lt;xsl:template match="/&gt;

    ```


    The &lt;xsl:template&gt; element is key to the operation of many XSLT transformations.
    The / is an XPath expression which matches the document root. Because our XML
    document, in common with all source trees, has a document root this XSLT template
    is applied. Most of what the &lt;xsl:template&gt; does is to output a series of
    lines that form an XHTML file.


    ```

    &lt;html&gt;

    &lt;head&gt;

    &lt;title&gt;

    Shakespeare Quotation

    &lt;/title&gt;

    &lt;/head&gt;

    &lt;body&gt;

    ```


    This completes the initial series of lines of XHTML that are output as literal
    text.


    ```

    &lt;xsl:apply-templates&gt;

    ```


    The &lt;xsl:apply-templates&gt; element is another commonly used and important
    XSLT element. Essentially what it means here is to look for all elements in the
    source XML document and apply any template that matches relevant element nodes
    within the source document.


    ```

    &lt;/body&gt;

    &lt;/html&gt;

    ```


    The closing &lt;/body&gt; and &lt;/html&gt; tags are output “after” the &lt;xsl:apply-templates&gt;
    element is processed.


    # NOTE


    Strictly speaking, many operations carried out by XSLT processors need not be
    in strict order. However, it is useful to grasp how when attempting to grasp an
    XSLT transformation sheet works to which of these processes being sequential.
    Discussion of when it is significant and when it is immaterial order processing
    carried out is beyond the scope of this chapter.


    The literal output stops here, and you see a second &lt;xsl:template&gt; element,
    which will be applied as a result of being called by the &lt;xsl:apply-templates&gt;
    element you saw lit earlier.


    ```

    &lt;/xsl:template&gt;

    &lt;xsl:template match="famous_quote&gt;

    &lt;h1&gt;&lt;xsl:value-of select="/&gt;&lt;/h1&gt;

    ```'
  merge: -1
