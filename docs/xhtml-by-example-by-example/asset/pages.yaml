  md: "# Reading the XHTML DTDs\n\nNo additional entities are contained here, so these\
    \ elements represent the final resolution of the entities down this path. The\
    \ h1 element declaration now looks like this:\n\n```\n<ELEMENT h1 (#CDATA | a\
    \ | br | span | bdo | objects | applet | img | map | \n#iframe |\n%fontstyle;\
    \ | %phrase; | %inline.forms; | %misc;>\n```\n\nNext to be resolved is the fontstyle\
    \ entity, which you will find immediately below the special entity declaration\
    \ in the XHTML DTD:\n\n```\n<ENTITY fontstyle %tt | i | b | big | small | u \n\
    | s | strike | font | basefont>\n```\n\nThe phrase, inline.forms, and misc entities\
    \ also are found in this location:\n\n```\n<ENTITY phrase %em | strong | dfn |\
    \ code | q | sub | sup | \nsamp | kbd | var | cite | abbr | acronym>\n```\n\n\
    The h1 element declaration now holds:\n\n```\n<ELEMENT h1 (#CDATA | a | br | span\
    \ | bdo | objects | applet | img | map | \n#iframe |\ntt | i | b | big | small\
    \ | u | s | strike | font | basefont | em | strong | \nq | sub | samp | sup |\
    \ kbd | var | cite | abbr | acronym | input | select | \n#textarea |\nlabel |\
    \ button | ins | del | script | noscript >\n```\n\nNext we move on to the ATLIST\
    \ declaration for h1:\n\n```\n<ATLIST h1\n%attrs;\n%TextAlign;>\n```\n\nThe attrs\
    \ entity is defined as follows:\n\n```\n<ENTITY attrs %coreattrs; %i18n; %events;\n\
    expanding the attr-list to:\n<!ATLIST h1\n%coreattrs;\n%i18n;\n%events;\n%TextAlign;>\n\
    ```\n\nGoing through the same exercise with the element declaration, we'll expand\
    \ each of these entities, beginning with coreattrs:\n\n```\n<ENTITY coreattrs\n\
    \"id #IMPLIED\nclass CDATA #IMPLIED\">\n```"
