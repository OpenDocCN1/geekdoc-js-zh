  md: '# Chapter 4: Collecting Data with Forms


    Using this configuration, if the check box is selected, the form data would be
    returned as

    checkbox_name=on


    Many times, you''ll want a value more descriptive than "on.\ If you add the value
    attribute to the input element, that predefined text will be sent instead. For
    example:


    ```

    <input type="checkbox" name="manufacturer" value="ford" />

    ```


    pass

    manufacturer=ford


    which gives the data recipient a more context as each of the original question.
    You can group check boxes by giving each of them a name, varying the value.


    Paolo''s Pizza lets local customers order their pizza online. They need to allow
    the user to select multiple toppings to be added to the pizza, yet they need to
    limit the input to the toppings they have on hand. A text box wouldn''t be appropriate
    in this case, because that would allow free-form entry that could ruin the order''s
    fulfillment. Grouping a set of check boxes handles this task nicely:


    ```

    <input type="checkbox" name="toppings" value="pepperoni" / Pepperoni

    <input type="checkbox" name="toppings" value="sausage" / Sausage

    <input type="checkbox" name="toppings" value="mushrooms" / Mushrooms

    <input type="checkbox" name="toppings" value="olives" / Olive

