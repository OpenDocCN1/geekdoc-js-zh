  md: '# XHTML Modularization


    There''s no doubt that HTML has been embraced as powerful means of producing documents
    for the World Wide Web. Its success was fed by the myriad of new features introduced
    over each successive version. Even so, it was still very much limited by the elements
    and attributes defined in the HTML Recommendations. Web authors clearly saw the
    need for more free-dom in defining structures and behaviors for those structures
    beyond the bounds of HTML.


    This chapter teaches you:


    +   - How modularization works

    - How to group elements into abstract modules

    - How to understand the DTD implementation of an abstract module

    - How to combine predefined modules into a new DTD'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# How Modularization Works


    XML provides the flexibility desired by many, but brings its own challenges in
    having to define every piece of the document puzzle on your own. The promise of
    XHTML is retaining the semantics of HTML while adding the extensibility and flexibility
    of XML. To achieve this, Web authors needed a means to add and subtract feature
    sets without having to reinvent the wheel each time. The mechanism for doing so
    is referred to as XHTML Modularization. XHTML Modularization provides a set of
    building blocks that can be combined to produce a host of new languages.


    # Abstract Module Definitions


    The first step when breaking down the XHTML 1.0 Recommendation was to divide elements
    into logical groups. Each of these groups contains elements that are semantically
    similar, and as a group, distinct from all the others. These groups are called
    abstract modules because their definitions do not include the machine processing
    information. Instead, they''re described in basic prose, much as we''re describing
    this process here. Additionally, specific syntactic conventions are followed to
    convey the content model of elements and the presence and requirements of attributes.


    > The expressions used for modeling XHTML modules are not intended as a formal
    grammar for XHTML. However, they are sufficiently similar to the conventions used
    for writing DTDs that XML authors should find them familiar and easy to read.


    # TIP


    > A module is not required to have an abstract definition to conform to the XHTML
    Modularization Recommendation. However, module authors are strongly encouraged
    to provide one to lower the learning curve required to adopt the module and to
    provide a quick reference for document authors who don''t need to delve into the
    DTD or schema definition of the module.


    To understand how an abstract module definition is put together, we''ll look at
    the List Module as it is defined in the XHTML Modularization Recommendation (section
    5.2.4):'
