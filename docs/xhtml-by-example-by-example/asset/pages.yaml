- img_proc: true
  md: '# Working with Tables


    In the early days of HTML, one of the most challenging page design problems dealt
    with the inclusion of tabular content. How could you readily structure data that
    was more than just a simple list? Authors needed to create grids, spreadsheets,
    and other information that rightfully belonged in a table if it were to be printed
    on paper, yet HTML didn''t always have this facility. Frankly, tables were included
    in HTML 3.2, and are again available in enhanced form in XHTML 1.0.


    After their introduction, Web designers quickly realized that tables could be
    used for more than just truly tabular content. By organizing the content of a
    page into columns and rows, enhanced visual designs could be achieved. Some early
    WYSIWY design tools went overboard with this idea, trying to give the designer
    “pixel perfect placement” control over page content, resulting in dozens and dozens
    of tables per page. I won''t go so far as to tell that you can''t use tables for
    visual layout, but when you do, you should understand the ramifications of doing
    so when your pages are viewed by alternative devices.


    This chapter teaches you:


    +   - How to create a basic table

    - How to merge columns and rows

    - How to create tables within tables

    - How to improve the usability of tabular data'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Chapter 5: Working Tables


    # Basic Tabular Structure


    Every table has three essential components: the table element itself, and the
    rows and cells contained within it. A lot can go on in the table element, but
    we''ll start small and build as we work through the chapter.


    Let''s start with a simple three-by-three grid familiar to most of us as a tic-tac-toe
    board (see Figure 5.1).


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_91_0.png)


    **Figure 5.1:** HTML is used to create a three-by-three tic-tac-toe table.


    All contents of a table are contained within the table element. In this example,
    we''ve set just a single attribute: the border attribute defines the width of
    the edging around the table and between each cell, measured in pixels. Many browsers
    have a few been known to default to 0 (zero), which is the value used to indicate
    no border; therefore, it''s good practice to specify exactly what you want:


    ```

    <table border="1">

    ```


    Structurally—that is working with the elements that make up a table—the table
    only has rows and cells, not columns. Of course we see columns in cells that line
    up with cells in the rows above and below. Each row and the cells contained within
    it are defined before the next row begins. Our tic-tac-toe board has three cells
    in the first row, each set at 100 pixels wide by 100 pixels high:'
  merge: -1
  pgno: 91
- img_proc: true
  md: '```

    <tr>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    </tr>

    ```


    # NOTE


    The non-breaking space character is used as ''filler'' in these table cells to
    help you visualize the outcome when viewed in the browser. Completely empty table
    cells are often collapsed by the browser and display as simple blank space.


    The process is repeated for the second and third rows, but the table is closed:


    ```

    <tr>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    </tr>

    <tr>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    <td width="100" height="100"&nbsp;></td>

    </tr>

    </table>

    ```


    The empty shell is seen in Figure 5.2.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_92_0.png)


    **Figure 5.2:** The blank three-by-three grid is shown in the browser.'
  merge: -1
