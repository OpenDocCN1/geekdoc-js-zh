    Just as humans like order surname come prefix first so XML gives the namespace
    prefix first (in this case xsl), follows that by a colon, and then what is called
    the local part (in this case text).


    Returning to the example of surnames, for everyday surnames are name. However,
    if we want to look into family trees then we need to have more detail like date
    and place of birth to identify an individual uniquely.


