  md: '# XHTML Document Well-Formedness and Validity


    The primary requirement of XHTML documents, as with any XML-based document, is
    that they be well-formed. Well-formedness means that all elements are written
    using proper syntax, and they are closed where they should be, attribute values
    are always in quotes, and so on. Validity, which is an optional state for XML
    documents, requires that the syntax used in XHTML documents conform to the document
    type definitions (DTDs). You can''t have elements nested within each other if
    the DTD prohibits it, attribute values must conform to the specified range of
    values, and the document must conform to any other restrictions set out in the
    DTD.


    XHTML has three different DTDs that you might use. Which one is appropriate for
    your needs depend on the answers to several questions you will explore throughout
    the rest of this chapter.


    # Choosing an XHTML Document Type


    Before you can begin creating an XHTML document, or an HTML 4 document for that,
    you must choose which “flavor” of XHTML you will be using. To help you decide,
    consider the following questions:


    +   - Will your document use frames? If so, you must use the XHTML 1.0 Frameset
    DTD.

    - Do you intend to use CSS or another form of style sheet (such as XSL) for your
    presentational information? If so, you can use XHTML 1.0 Strict if you place all
    of your presentational information in the style sheet. Use XHTML 1.0 Transitional
    if you will be mixing presentational elements, attributes, and style sheets.

    - Do you require the ability to use elements that have an intrinsic style component,
    such as <i> tag for italics (versus the <em> tag for emphasis), and you cannot
    use style sheets to provide that instruction? If so, you must use XHTML 1.0 Transitional.


    The answers to these questions can lead you through a decision tree that might
    look like the diagram in Figure 1.1.


    These basic questions can point you in the right direction. Let''s take a closer
    look at each of the three document types, so that your decisions will be the correct
    ones.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/a046e2e08ea170a8a111d9784d7fba9b_22_0.png)


    **Figure 1.1:** You can use this decision tree to determine the proper XHTML document
    type for your needs.


    # XHTML 1.0 Strict


    As with its cousin, the strict version of HTML 4.0, XHTML Strict documents contain
    no fully presentational information. If it has to do with style, look, and display,
    the instructions are instead given to the browser through a style sheet. Presentation
    can be as simple as a color choice for text or headings or the alignment of images.
    Beyond those aspects of font faces, styles, and sizes, and the visual aspects
    of tables—such as the thickness of the border, cell padding, and spacing—are all
    considered “presentational.” All of these features are removed from the language,
    meaning there aren’t elements or attributes that govern these decisions anymore.
    Those instances are instead provided to the browser via the style sheet.


    The following memo has several instances where words and phrases need to be offset
    from the rest of the text. In the headers, the To;, From;, and Re: fields are
    traditionally boldface. Elsewhere, where citing the name of a magazine publication,
    the name is italicized.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_22_1.png)'
