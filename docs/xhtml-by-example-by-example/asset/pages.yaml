  md: '# Creating a Custom XHTML Module


    The power of the Extensible Hypertext Markup Language certainly lies in its extensibility.
    XML offers document authors the ultimate extensibility in allowing them to create
    entirely new markup languages using whichever design principles they find the
    most compelling. For those of us who just need to get some work done, however,
    re-inventing the wheel—even if it meant doing so in a way that liked better than
    how the originators did it—uses an awful lot of time and energy.


    So, we''ll use the power of extensibility and the comfort of HTML to create new
    document types for our own purposes. An online recipe archive presents this just
    sort of challenge. HTML provides the basic text features we''ll want to use, yet
    we need the additional structure of XML for segments of the recipes themselves
    to allow for easy searching, storage, and other data management activities that
    might be performed on a large archive. We will spend this chapter creating a customized
    recipe module that will be combined with a basic set of XHTML features to create
    a new DTD.


    This chapter teaches you:


    +   * How to organize your data storage needs

    * How to write an abstract module definition

    * How to use parameter entities to manage namespaces

    * How to define elements and attributes in a Declaration sub-module'
  merge: -1
