    # Specifying Character Encoding


    In HTML character encoding is set inside the head element using a meta element
    with the http-equiv attribute. For instance, to set the character encoding of
    the document to Japanese, you would write


    ```

    <meta http-equiv="Content-type" content="text/html; charset="EUC-JP">

    ```


    XML, on the other hand, uses the encoding on the XML declaration to store this
    information. Previously in the "XML Processing Instructions" of this chapter,
    we discussed that the XML declaration must be present if the encoding is to be
    anything other than UTF-8 or UTF-16. So in the case here of a Japanese encoding,
    the XML declaration must be present, and would look like


    ```

    <xml version="1.0" encoding="EUC-JP">

    ```


    However, to retain compatibility with HTML-based user agents, the meta element
    should also be used, with the proper handling for empty elements in XHTML. As
    a result, of such a document would appear as


    ```

    <xml version="1.0" encoding="EUC-JP">

    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Strict//EN">

    "http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

    <head>

    <meta http-equiv="Content-type" content="text/html; charset="EUC-JP">

    <title>My Document Title</title>

    </head>

    ```


    As with the natural language declarations, the value of the encoding in the XML
    declaration takes precedence over the value supplied in the meta element.


    # TIP


    You''ve probably realized that the requirement to use the XML declaration for
    character encodings other than UTF-8 and UTF-16 is contradictory when faced with
    an audience for XHTML documents using older HTML browsers. In this scenario, you
    are forced to make a choice here. I believe a proper character encoding is far
    more valuable than avoiding the possibility of the stray text presentation of
    the XML declaration at a beginning of a document.'
