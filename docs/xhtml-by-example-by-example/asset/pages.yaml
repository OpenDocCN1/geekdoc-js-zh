  md: '# Why Validate?


    # 143


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_154_0.png)


    **Figure 8.1:** Validator reports can point out typographical errors.


    # What You See Is What You Intended to See


    Many errors in well-formedness are apparent when you view an XHTML document in
    a Web browser for the first time. If you forget to close a hyperlink <a> tag,
    you''ll quickly notice the entire paragraph (or more!) that''s treated as a link
    rather than the word or small phrase that was intended (see Figure 8.2).


    Some other errors—such as the runaway line or mismatched heading tags—are nearly
    universally obvious to the eye, not all well-formedness errors can be immediately
    spotted. This is because many browsers have been taught to right and interpret
    the document intended to do rather than what the author really did. Some might
    argue this “help” is a good thing, but it can lead into incongruency and cause
    unnecessary frustration for site visitors.


    As a test, trying one of your table exercises from Chapter 5, “Working with Tables,”
    and leaving off the closing <table> tag. View the file in both Netscape Navigator
    and Internet Explorer. What do you see?


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_154_1.png)


