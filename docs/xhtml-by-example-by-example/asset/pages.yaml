  md: '# Chapter 9: Implementing XHTML Today


    # Smoothing the Transition


    Using the XML 1.0 Compatibility Guidelines Steps can be taken to author your XHTML
    documents in a way that is compatible with many HTML user agents as possible.
    These can be as basic as some of the original Web browsers including NCSA Mosaic,
    Cello, and Lynx, or the next generation of browsers that included Netscape 1.1,
    2.0, Microsoft Explorer 1.0, 2.0, and of course, the successive versions of each
    up to Netscape 6 and IE 5.0. We also need to be aware of browsers in use on other
    devices when we talk about authoring guidelines.


    A common statement heard in corners of Web design is “If it works in IE and Netscape,
    then I''m finished.” This might cover a large majority of the desktop Web market,
    but of course doesn''t fully address the issue of backward compatibility. In this
    section we''ll take a look at each of the guidelines suggested in the XHTML 1.0
    Recommendation.


    One key to remember when discussing XHTML, and to extent any XML application,
    will perform in today''s Web browsers that these applications were written based
    on the HTML Recommendations. HTML has presentational and behavioral semantics
    associated with it that can only be rendered if the browser has a built-in knowledge
    of what semantics are. In other words, the programmers who write the browser software
    taught it how to deal with each of the elements and attributes. As a result, any
    markup behavior that deviates from that programmed expectation will have an unpredictable
    outcome from the authoring perspective.


    # XML Processing Instructions


    XHTML documents formally begin with an XML declaration. This declaration is written
    in the form of a processing instruction that might look like this:


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    ```


    The encoding attribute value can be modified when necessary to incorporate extended
    character sets. Most documents will do fine with the UTF-8 and UTF-16 character
    sets, which are accepted defaults on most systems.


    A backward compatibility issue arises when we users deal with markup they don''t
    understand. The recommendation is that the browser should pass through the content
    of the markup as raw data (essentially plain text). Most browsers interpret the
    processing instruction as an empty element, and therefore do not pass anything
    to the browser because by definition, empty elements have no content.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Smoothing the Transition


    Testing has shown few browsers either mistakenly pass through unknown empty elements
    (the processing instruction) to the document, or simply don''t recognize PIs as
    an element at all, and pass it through PCDATA. These browsers include Netscape
    Navigator 3.0 and earlier, HotJava 1.1.5 and 3.0, Opera 3.6, Internet Explorer
    3.3 and 4x/Mac. Luckily, all have newer versions available and the number of visitors
    seeing such a declaration should be negligible. To avoid passing it through completely,
    forgo the XML declaration when serving the documents as text/html.


    # Working with Empty Elements


    HTML element syntax opens a tag, the element name within angle brackets <element>;
    any contained data; and then a closing tag composed of a left bracket, forward
    slash, the element name, and a right bracket, for example, <element>. When there''s
    no data to be contained between the tags, we have an empty element. HTML constructs
    these by using only the opening tag, as is done with this image element:


    ```

    <img src="graphic.gif" alt="My Graphic">

    ```


    The rules in the XML 1.0 Recommendation don''t allow for empty elements so a change
    in syntax is required moving from XML to XHTML. Two options for managing empty
    elements are available to the author. The most straightforward solution is to
    add a closing tag:


    ```

    <img src="graphic.gif" alt="My Graphic"></img>

    ```


    However, the presence of a closing tag on an element where the browser isn''t
    expecting can lead to unpredictable results. To avoid unpredictability, a syntactical
    shorthand developed in XML, sometimes referred to as element minimization, is
    the preferred treatment of empty elements in XHTML. XML allows authors to write


    <br>


    which means the same as


    <br><br>


    The shorthand is nice, but introduces another problem: recognition of the element
    name. We said earlier that HTML syntax defines the opening tag of an element (without
    any attributes) as a left angle bracket, the element name, and a right angle bracket.
    When evaluating elemental content, browsers are likely to interpret the element
    of a tag using this short-hand as br/ than br with a slash to it.


    Because the browser doesn''t have pre-programmed knowledge of the br/ element,
    it''s likely to do nothing with it, as seen in Figure 9.1. The text in the first
    segment should be broken into two lines by the element that'
  merge: -1
