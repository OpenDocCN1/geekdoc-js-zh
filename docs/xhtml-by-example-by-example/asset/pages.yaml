    # Identifying Selectors


    A selector is the element, or group of elements, to which a style will be applied.
    Selectors can be individual elements, lists of like elements, or specific instances
    of elements identified by class or ID attributes. In this next section, we''ll
    look at selectors of each type.


    # Elements as Selectors


    Using an element as a selector is pretty straightforward. The style rule is written
    by giving the element (selector), followed by the property or properties and values
    within braces:


    ```

    selector(property:value)

    ```


    Multiple elements that have the same properties can be grouped to save redundancy
    in the style sheet document. For instance, you might want all headings to be red.
    Instead of writing


    ```

    h1 {color:red}

    h2 {color:red}

    h3 {color:red}

    h4 {color:red}

    h5 {color:red}

    h6 {color:red}

    ```


    the selector can be written as a comma-delimited list of elements with the single
    property definition:'
