- img_proc: true
  md: '# Building Blocks of XHTML Documents


    > TIP

    Many document authors find it useful to practice version control within meta tags.
    Document version numbers, publication dates, and other authoring notes can be
    stored in these elements for reference by future editors.


    # Building Blocks of XHTML Documents


    All XHTML elements fall into two categories: block-level elements and inline elements.
    Both types of elements look the same: They have opening tags, content, and closing
    tags. What''s different is what is allowed to occur within enclosed content.


    # Block-Level Elements


    Think of block-level elements as the large concrete blocks used to build a house
    or other building. They provide the main structure of the document, where the
    inline elements provide the finishing details.


    The definition of what can or can''t be included within an element is known as
    the content model. The content model for each element is defined in the document
    type definition, or DTD. That is the document that is referenced by the URI in
    the doctype declaration. It has, in cryptic notation similar to the notation used
    to describe computer languages as Extended Backus-Naur Form, the required syntax
    of all XHTML elements, attributes, and character entities.


    The declaration for the body element in the XHTML 1.0 Strict DTD is seen here:


    ```

    <ELEMENT body %block>;

    ```


    This says that the body is the name of the element, and it can contain what is
    defined in the parameter entity Block. Looking further to the definition of Block
    we find


    ```

    <ENTITY Block "%block | form | %misc;*">

    ```


    This says that the entity Block is defined as a choice of the elements in the
    block entity (lowercase, differentiating from Block), the form element, and the
    elements defined in the misc entity.


    The block entity is defined as


    ```

    <p | heading; | div | %lists; | %blocktext; | fieldset | table">

    ```


    which is a choice of p, the elements in heading, div, the elements in lists and
    blocktext, the fieldset element, or table.


    You can see that the formal description of content models can become complex.
    For the most part, you won''t need to worry about many'
  merge: -1
