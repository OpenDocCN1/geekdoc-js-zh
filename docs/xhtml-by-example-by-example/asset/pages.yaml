  md: '# How Modularization Works


    As its name suggests, the List Module provides list-oriented elements. Specifically,
    the List Module supports the following elements and attributes:


    | Elements | Attributes | Minimal Content Model |

    |---|---|---|

    | dl | Common | (dtdd)+

    | dt | Common | (PCDATA|inline)* |

    | dd | Common | (PCDATA|inline)* |

    | ol | Common | li+|

    | ul | Common | li+|

    | li | Common | (PCDATA|inline)* |


    This module also defines the content set with the minimal content model (dl|ol|ul)
    and adds this to the Flow content set of the Text Module.


    The prose at the beginning of this abstract is very clear: The module contains
    the elements of XML to create lists, including definition, ordered, and unordered
    lists. The table contains each of the element members of the module, the attributes
    allowed on each, and the minimal content model for the element.


    # Reading the Allowable Attributes List


    Rather listing each potential attribute for an element, XML Modularization relies
    on attribute collections. The collections are defined elsewhere in the XML Modularization
    Recommendation. Before reviewing the attributes contained within each set, you
    need to understand the types of attributes allowed. Eight data types defined in
    the XML 1.0 Recommendation form the basis of the types allowed in XML. These include


    +   - CDATA—Character data. Any arbitrary characters can be found in a CDATA section
    with a single exception: the < character.

    - ID—A unique identifier for a given instance of an element. Only one attribute
    on an element can have the ID data type. The value of this attribute also must
    be unique within the document.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Chapter 14: XHTML Modularization


    +   - IDREF—A reference to an element instance that has an attribute with the
    specified ID.


    +   - IDREFS—A list of ID references, separated only by commas.


    +   - NAME—A name, similar to the ID datatype, without the requirement of uniqueness.


    +   - NMTOKEN—A name token, which is a name composed of alphanumeric characters
    and optionally the characters , . - _ and : (period, comma, hyphen, underscore,
    and colon).


    +   - NMTOKENS—A list of NMTOKEN names separated by white space.


    +   - PCDATA—Processed character data. Character data with any incorporated entities
    having been processed.


    # NOTE


    It should be noted that the requirement in the XML datatype of alphanumeric characters
    does not limit an author''s choices to the English alphabet or any specific language.
    Any glyph that is part of the alphabet in any language around the world is considered
    part of the alphanumeric character set.


    XHTML Modularization defines a host of new datatypes, to be exact, that expand
    on the predefined list provided by XML (see Table 14.1). Many definitions refer
    to RFC documents. An RFC is a document published by the IETF (Internet Engineering
    Task Force) that discusses standard conventions or technical details about the
    Internet. RFC documents can be accessed from a number of sites; a full listing
    of all documents is available via FTP at ftp://ftp.isi.edu/in-notes/rfc-index.txt.


    Table 14.1: Datatypes Defined by XML


    | Datatype | Description |

    |---|--|

    | Character | A single character (from any alphabet). |

    | Charset | A character encoding defined in RFC2045 (for example, US-ASCII, ISO-8859-1).
    |

    | Charsets | A space-delimited list of character encodings as defined by Charset.
    |

    | Color | Any valid hexadecimal color value defined by the hash character (for
    example, #000000), or one of 16 colors (see Appendix A, "XHTML Abstract Module
    Definitions," for the full list). |

    | ContentType | A media type as defined by RFC2045. |

    | ContentTypes | A comma-delimited list of media types defined in ContentType.
    |

    | Datetime | Date and time information. |'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# How Modularization Works


    | Datatype | Description |

    | --- | --- |

    | FrameTarget | A name of an HTML Frame, used as the destination for loading a
    document or other actions to be performed within that frame. |

    | LanguageCode | A code representing a language, as defined in RFC1766 (for example,
    ''en'' for English, ''fr'' for French). |

    | Length | A measure, either in pixels or a percentage of available space. |

    | LinkTypes | One of, or a list of, names from a defined set of link types. See
    Appendix A for the complete list and their meanings. |

    | MediaDesc | A comma-delimited list of descriptors (see Appendix A for the list
    of recognized descriptors). |

    | MultiLength | A length as previously defined, or a relative length. Relative
    lengths are expressed as "i", where "i" is an integer and "*" character allocates
    an amount of space proportional to "i" when evaluated against the other integers.
    for example, 1*, 3* set up to 3 ratio of space. |

    | Number | One or more digits. |

    | Pixels | A numeric value representing a number of pixels. |

    | Script | Data that must be passed on to a script engine and parsed as XML. Any
    text-based data. A Uniform Identifier A space-delimited list of Uniform Resource
    Identifiers defined previously. |


    Looking back at the List Module definition, you''ll notice that each of the allowable
    attribute entries references an attribute: Collection. Common is actually a collection
    of collections, comprised of the Core, Events, I18N, and Style collections. These
    four collections are defined, along with their data types, in Table 14.2.


    Table 14.2: The Attribute Collections That Make Up the Common Collection


    | Collection | Attributes |

    | --- | --- |

    | Core | class (NMTOKEN), id (ID), title (CDATA) |

    | I18N | xml:lang (NMTOKEN) |

    | Events | onclick(Script), onblclick(Script), onmousedown(Script), onmouseup(Script),
    onmouseover(Script), onmousemove(Script), onmouseout(Script), onkeypress(Script),
    onkeydown(Script), onkeyup(Script) |

    | Style | style (CDATA) |


    # THE MINIMAL CONTENT MODEL


    A content model is a definition of what elements or data are allowed to be present
    within another element. This section of an abstract model definition is the one
    that follows XML DTD-like syntax.'
