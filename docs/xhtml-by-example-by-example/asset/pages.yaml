  md: '# Chapter 1: XHTML Fundamentals


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_25_0.png)


    **Figure 1.3:** A conforming XHTML 1.0 Strict document uses emphasis and strong
    emphasis than bold and italic elements.


    Notice in Figures 1.2 and 1.3 that both of these paragraphs look the same in Netscape
    Navigator. The paragraphs would look the same when viewed in Internet Explorer
    as well. This is because the browser programmers have adopted the conventional
    rendering of the emphasis and strong elements as italic and boldface, respectively.


    I say traditional rendering here, in that the XHTML specification doesn''t require
    that elements be presented in italic or boldface. Instead, it only requires that
    they be given some form of emphasis that is distinct from the main body of text
    and from each other. So a user agent—that is, the browser or display software—could
    render emphasis as purple text, or a bigger font size, or a combination of both
    and still be compliant with the specifications.


    # XHTML 1.0 Transitional


    The idea of a "Transitional" doctype first appeared in HTML 4. The idea was to
    alert developers to the fact that the presentational elements and attributes found
    within it were being deprecated. Deprecated means that the usage has fallen officially
    out of favor, and that there is (usually) a preferred method of obtaining the
    same result.


    Though deprecated, these presentational elements and attributes are still fully
    compliant within the Transitional doctype. A presentational attribute'
