  md: '# Chapter 19: Next Steps for XHTML


    If you are not familiar with the typical process through which documents pass
    during their development at W3C, this is the hierarchy, ascending order of importance:


    +   - Working Drafts—These are draft documents that are subject to perhaps radical
    change or redrafting. Concepts or solutions can be added or removed. They are
    a snapshot of steps towards a hoped-for solution. When a Working Draft is nearing
    what is hoped to be its final form, a so-called “Last Call’ Working Draft is issued.
    When a technology is particularly complex or the merits of a proposed solution
    are still highly debated, it can happen that one “Last Call’ draft is succeeded
    by another.

    - Candidate Recommendation—Promotion of a document to Candidate Recommendation
    status is an indication that a document has successfully completed its Last Call.
    Advancement of a document to Candidate Recommendation status is an explicit call
    to those outside of the related Working Groups or the W3C itself for implementation
    and technical feedback.

    - Proposed Recommendation—If the feedback on the Candidate Recommendation is satisfactory,
    promotion to Proposed Recommendation is the next step. It is still possible for
    issues to be raised, which in a worst-case scenario, might result in the document
    being returned to Working Draft status for further development.

    - Recommendation—For all practical purposes, this is a “fixed” standard—at least
    a subsequent version is formally approved and issued. Because W3C is not an inter-governmental
    body, it cannot call its “standards” and therefore use the term Recommendations.
    Recommendations are stable documents that might be cited as source material.


    The W3C Documents of CC/PP are, at the time of writing, at the earliest stage—Working
    Draft.


    # Security


    The use of a browser that may identify you personally and your location raises
    a number of security issues.


    In at some settings, it will be advisable or possible to conceal your identity
    (anonymization).


    One issue that raises specific security concerns is mentioned in relation to position-dependent
    information.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# CC/PP—Composite Capabilities/Preferences Profiles 325


    # Position-Dependent Information


    Let''s take a brief look at the pros and cons of the availability of systems that
    depend on knowing where you are; in the jargon, systems that operate using position-dependent
    information.


    Imagine that you have a voice-enabled browser built into or plugged into your
    car that has capabilities (perhaps in conjunction with the electronic systems
    of the car) to determine your position and give you advice about suitable routes
    to your desired destination, choose a scenic route, the fastest route, a route
    free of traffic, and so. In context the ability of your browser to transmit your
    exact position to others, and receive travel advice in return, has obvious benefits.


    Similar benefits might arise if you are travelling and want to locate a hotel
    or other facility with criteria you want to define.


    In practice, many of these processes, once they are fully developed, are likely
    not to involve direct human participation. However, it is quite possible that
    staff at the Web server company or others might be able to gain access to information
    about your location.


    Because significant costs will be incurred in creating and maintaining such a
    system, it is unlikely to be free and thereby anonymous access. The fact that
    others might be aware of your geographical location might be viewed by you as
    an invasion of your personal privacy.


    At first, others might say that there is no issue here. If you are acting lawfully
    and have nothing to hide, why should you object to others knowing your exact location?


    Thinking beyond the principles of what are or not the boundaries of legitimate
    personal privacy, some very practical issues arise. Suppose you are on a highway
    300 miles from home, you transmit your position—for example, to find out traffic
    flows ahead—and that information is intercepted by an unauthorized person or used
    unscrupulously by a member of staff at a Web server company. Your position is
    300 miles from home. A burglar has, at a minimum, four safe hours in which to
    invade your home and steal from it. The service that depends on knowing your geographical
    location has potentially exposed your property to crime.


    Not surprisingly, issues relating to privacy and security are are under active
    consideration in relation to position-dependent information.


    Technical issues also are receiving consideration. For example, there is a need
    to develop an XML-compliant format for encapsulating position-dependent information.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Chapter 19: Next Steps for XHTML


    Among the possible candidates as solutions are the NaVisitation Markup Language
    (NVML) from Fujifilm submitted to W3C in June 1999:

    http://www.w3.org/Submission/1999/10/


    Another candidate is POIX (Point Of Interest eChange) Language Specification proposed
    to W3C in May 1999:

    http://www.w3.org/Submission/1999/06/


    # CC/PP and Web-Oriented TV


    CC/PP provides a use-case scenario for TV-based Web access that will be described
    in the next section. In that scenario we might broadcast a minimum set of content,
    because the TV-based browser might not be able to transmit its specific profile
    to the origin server.


    # TV and the Web


    A number of initiatives are underway with a view to closer integration of television
    and the Web. These initiatives will spread more widely as more geographical areas
    convert television services from analog to digital standards.


    Discussions on various developments are underway in a number of fora. The W3C
    is in discussion with a number of broadcasting standards bodies, both global and
    regional, with a view to exploring development of applicable standards.


    Essentially, such developments involving TV and the Web seem likely to fall into
    one of two categories:


    +   - Use of television, or associated devices, to browse the Web


    +   - Addition of Web content to television, including making it a more interactive
    experience


    # Use of Television to Browse the Web


    This has been possible for some time. For example Microsoft’s WebTV provides such
    a facility.


    It is unlikely that TVWeb (a generic term for using television-associated devices
    to browse the Web, and not to be confused with the proprietary NameTV) will require
    the full facilities of XHTML. Therefore the needs of TVWeb might lead to the adoption
    of only selected modules from the Modularized XHTML specification.


    If widely applicable standards can be agreed to as which XHTML modules TVWeb will
    use, origin servers might choose to serve TVWeb-compatible documents as a default,
    in some circumstances.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'As mentioned earlier in the chapter, the possible needs of television are one
    item being considered with the scope of establishing a CC/PP standard.


    # Addition of Web Content to Television


    Many possibilities exist for the addition of Web-based content to television programs.


    For example, during a sporting event it might be possible to include a click-area
    of the screen that would call background information about a sportsman or sports
    team. Given the limitations of some television systems, such information might
    be based on a limited range of XHTML modules.


    Alternatively, background information could accompany a television broadcast without
    necessarily requiring viewer intervention, although such a text area might also
    include the possibility of advertisements for products related to the subject
    of the television program.


    One issue that might require examination is to what extent viewers will find the
    presence of text areas of significant size a significant visual intrusion.


    It is likely that televisions will not have computing power in set-top boxes that
    will be comparable to the computing power of a typical desktop PC. A consequence
    of that television usage of the Web is likely to apply to a subset of Web content.
    Specifically, some of the modules of XHTML might be selectively used by television.


    XHTML also was included as a component of the BXML (or BML)—Broadcast Markup Language—proposed
    as a standard by ARIB (Association of Radio Industries and Businesses).


    Until recently, interactivity when watching television has primarily been limited
    to switching television channels using a remote control. However, the ability
    to click selected areas of a television screen to call up relevant information
    might add substantially to the range of entertainment or information, provision
    of which television is capable. With increases in bandwidth in Web-oriented media,
    the distinction between television and the Web become significantly blurred.


    It is by no means clear at the present time which of many standards under discussion
    by disparate broadcasting bodies will achieve critical mass to be considered to
    be a viable standard.


    # XForms


    HTML forms were introduced to the World Wide Web in 1993. They and, more recently,
    XHTML forms, perform a pivotal role on many Web sites in'
