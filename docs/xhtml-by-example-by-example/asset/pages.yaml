    |


    The following link types are recognized, shown with their conventional interpretations:

    Alternate—Designates a substitute version for the document where the link occurs.
    When combined with the xml:lang attribute, a translated document is implied. When
    used with the media attribute, a version designed for a different medium (or media)
    is implied.

    Style sheet—Refers to an external style sheet. User-selectable alternative style
    sheets can be generated by using this together with the Alternative link type.

    Start—Refers to the first document in a collection. It is intended as a pointer
    to search engines.

    Next—Refers to the next document in a linear sequence of documents. Can be used
    to preload the next document to reduce perceived wait times.'
