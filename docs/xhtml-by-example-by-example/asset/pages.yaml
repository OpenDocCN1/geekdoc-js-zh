  md: '# XHTML Modularization Abstract Module Definitions


    This appendix contains the Abstract Module Definitions found in the W3C document
    Modularization of XHTML. It is provided here as a means of quick reference.


    Some preliminary information is needed before the modules can be defined; specifically,
    syntactic conventions, attribute types, and attribute collection names.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Syntactic Conventions


    The first thing that should be noted is that abstract module definitions are not
    written in a formal grammar. However, the W3C has borrowed conventions that should
    be familiar to the authors of DTDs.


    Each module might be viewed as a table with three columns. In each row, you''ll
    find an element, the attributes allowed within the element, and then the minimal
    content model for the element. A minimal content model contains a list of elements,
    a content set (which is of itself a common list of elements), or a datatype such
    as PCDATA for the title element.


    Occurrence indicators and other expressions will be found in the minimal content
    models as follows:


    | Expression | Meaning |

    | --- | --- |

    | Foo ? | Zero or one instances of foo are permitted. |

    | Foo + | One or more instances of foo are required. |

    | Foo * | Zero or more instances of foo are permitted. |

    | A, B | A is required, followed by B. |

    | A | B | Either A or B is required. |

    | A - B | A is permitted, omit elements in B that were otherwise found in A. |


    Parentheses | As in many mathematical operations, when an expression is contained
    within parentheses, evaluation of any subexpressions within the parentheses takes
    before evaluation of expressions outside of parentheses. That is, evaluation starts
    at the deepest level possible.


    Extending predefined elements | At times a module adds attributes to an element.
    When this occurs, the element name is followed by the ampersand (&) character.


    Assigning type to attribute values | The type assigned to an attribute value is
    listed in parentheses after the attribute name.


    Defining specific legal values of | If the module defines an explicit list of
    legal values for an attribute, they are listed, enclosed in quotation marks and
    separated by vertical bars (|), inside parentheses following the attribute name.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# # Attribute Types


    Each attribute listed in the module definitions will have an accompanying type
    definition in parentheses.


    This first table holds attribute types as defined in the XML 1.0 Recommendation:


    | Attribute Type | Definition |

    | --- | --- |

    | CDATA | Character Data |

    | ID | A document-unique identifier |

    | IDREF | A reference to a document-unique identifier |

    | IDREFS | A space-delimited list of references to document-unique identifiers
    |

    | NAME | A name with the same character constraints as ID |

    | NMTOKEN | A name composed of only name tokens defined in XML 1.0 |

    | NMTOKENS | One or more whitespace-separated NMTOKEN values |

    | PCDATA | Processed character data |


    The following table contains data types and their semantics as defined by XML
    Modularization. Links to ISO, RFC, and other references can be found in the Modularization
    of XHTML document on the W3C Web site:


    | Data Type | Description |

    | --- | --- |

    | Character | A single character from ISO10646 |

    | Charset | A character encoding, as per RFC2045 |

    | Charsets | A space-delimited list of character encodings, as per RFC2045 |

    | Color | A color definition specified in SRGB. It might be a hexadecimal number
    prefixed by a hash mark (#), or one of sixteen color names:

    - Black = "#000000"

    - Silver = "#C0C0C0"

    - Gray = "#808080"

    - White = "#FFFFFF"

    - Maroon = "#800000"

    - Red = "#FF0000"

    - Purple = "#800080" |'
  merge: -1
