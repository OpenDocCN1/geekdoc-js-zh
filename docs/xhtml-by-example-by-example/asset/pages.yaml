  md: '# Expanding Boolean Attributes


    A Boolean attribute is an attribute that is active simply by its presence, without
    a stated value. A common example is that used when pre-selecting an option in
    a set of check boxes inside a form, such as:


    ```

    <input type="checkbox" name="box1" value="box1" checked />

    ```


    The rules of well-formedness in XHTML do not allow this sort of attribute presentation.
    The attribute, therefore, must be expanded, taking a value same as the attribute
    name


    ```

    <input type="checkbox" name="box1" value="box1" checked="checked">

    ```


    This technique must be used for all Boolean attributes, including checked, compact,
    declare, defer, disabled, islice, multiple, nosize, noshade, nowrap, readonly,
    and selected.


    Current Web browsers, those written to be aware of and compliant with the HTML
    4 Recommendation, shouldn''t have a problem understanding these expanded attributes.
    Earlier browsers, notably of the era of Netscape Navigator 3 and Internet Explorer
    3, might ignore the attribute as it would other “unknown” markup.


    # Accessing the Document Object Model (DOM)


    The Document Object Model (DOM) is used, among others, for accessing specific
    nodes in the parse tree of an XML document when processing scripts. The DOM used
    with HTML 4, known appropriately as the HTML DOM, returns element and attribute
    names in uppercase. The DOM used with XML specifies that elements and attributes
    are returned in their original case. Both these positions can be in conflict with
    the requirement of XHTML that elements and attributes be written only in lowercase.


    Despite these apparent conflicts, the situation can be managed while retaining
    backward compatibility. XHTML provides for two methods of serving documents. The
    first is as Internet media type text/html. When this is done, applications can
    reliably expect that the document will be processed using the HTML DOM, with elements
    and attributes returned accordingly in uppercase.


    XHTML documents served as XML will likely be set to an Internet media type of
    text/xml, application/xml, or another media type that might soon be developed.
    Applications that parse these documents can use the XML DOM with confidence that
    the lowercase input (in keeping with the requirements of XHTML 1.0) will be returned
    as lowercase.'
