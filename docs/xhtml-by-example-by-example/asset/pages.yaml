  md: '# Chapter 11: Using Cascading Style Sheets with XHTML


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_203_0.png)


    **Figure 11.4:** This shows how a document layout can be visualized as a set of
    nested boxes.


    The large outer box is the html element, containing everything else in the document.
    The biggest box inside is the body element, smaller boxes in that are paragraphs,
    tables, lists, headings, and so on.


    XHTML elements are easily divided into block-level elements and the rest, which
    are known as inline elements. All block elements are rendered beginning on a new
    line in the browser. You''ll have noticed that headings, paragraphs, and div behave
    in this manner. Inline elements, on the other hand, are “in the current line.”
    Tags such as em, strong, span are inline elements.


    # CAUTION


    It is possible to change the display model for elements using the CSS display
    property. However, unless there''s a particularly compelling reason to do so (and
    I''m pressed to think of any), avoiding changing these expected semantics. It''s
    far better to find an element with the correct semantics and use that.


    Block elements have three distinct areas of space surrounding them: the margin,
    the padding, and the border. Each of these areas is shown in the drawing in Figure
    11.5.'
