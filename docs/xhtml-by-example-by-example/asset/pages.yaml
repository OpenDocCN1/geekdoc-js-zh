    If we are to take Chapter 1 in its entirety and publish it as an XML page, we''d
    want to convey the same *structure* to the data as is shown in the table of contents.
    To do that, we''d use XHTML headings, beginning with the level 1 heading, `<h1>`.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_36_0.png)


    ```

    <h1>From HTML to XML</h1>

    _content_

    <h2>C Heading</h2>

    _content_

    ...

    ```


    Many HTML authors are tempted to choose their heading levels by the size or appearance
    of the text when it''s rendered by the browser. As I''ve often repeated in these
    first chapters, avoid the temptation to do so, as it removes the structural information
    from the document and applies presentational semantics to elements that weren''t
    meant to have them.


    # Grouping and Ordering Data with Lists


    At times, semantics are attached to data that has specific structural groupings.
    For instance, my family structure can be represented as


    +   * Dave

    * Ann

    * Linda'
