  md: '# Appendix A


    # Text Module


    As its name implies, the Text Module defines the elements used to stru- text.


    Four new content model sets are defined using the elements found in this module.
    The following table defines the content model sets and corresponding member elements.
    The fourth set is a superset of the previous three.


    | Content Model Set | Elements |

    |---|---|

