  md: '# Chapter 12: XSL—Style the XML Way


    Here we find an <xsl:template> element that matches the <famous_quote> element
    in the source XML document. Therefore, the template is applied to the <famous_quote>
    element. In this case an <h1> tag is created in the output tree. Then, an <xsl:value-of>
    element is applied to the content of the element which matches the XPath expression
    , which means the current context element—the content of the <famous_quote> element.
    The value of that content, the text string To or not to be is applied to the output
    tree at the point indicated by the <xsl:templates> element earlier in the XSL
    code.


    ```

    <xsl:template>

    </xsl:stylesheet>

    ```


    These are simply closing tags for the <xsl:template> element (in this one which
    matches the XPath expression —the <famous_quote> element) and for the <xsl:stylesheet>
    element.


    # Combining a CSS Style with XSL


    It is straightforward to attach a CSS style sheet to your your HTML/XHTML output
    file. You can simply add a <link> tag referring to the appropriate CSS style sheet
    to the output file.


    Here is the XSL document with the Cascading Style Sheet added:


    ```

    <?xml version="1.0" ?>

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    version="1.0">

    <xsl:template match="/">

    <html>

    <head>

    <link rel="stylesheet" href="quotstyle.css" type="text/css">

    <title>

    Shakespere Quotation

    </title>

    </head>

    <body>

    <xsl:apply-templates/>

    </body>

    </html>

    </xsl:template>

    <xsl:template match="famous_quote">

    <h1><xsl:value-of select="."/></h1>

    </xsl:template>

    </xsl:stylesheet>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_231_0.png)'
