  md: '# The Components of Every Form


    The hidden control will always have three attributes: type, name, and value:

    <input type="hidden" name="foo" value="My value here">


    Size or other presentational attributes are not an issue as the form is visible
    to the end user. Although they aren'' displayed, the data do still pass back and
    forth from the server to the user and back to the processor, so use them sparingly
    for important information.


    # FILE INPUT CONTROL


    An exciting aspect of XHTML forms is the ability to accept the content of files
    as input within your form. The input control generates a button with the label
    browse (on most implementations). When this button is clicked, the user can navigate
    through the file system on his computer until the file desired is located. After
    the file is accepted, the input field is populated with the path to the selected
    file. To add such a control, use the following syntax:

    <input type="file" name="foo" />


    Figure 4.7 illustrates what the field might look like when the dialog box is generated
    after the button is activated. The actual implementation vary from browser to
    browser.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_80_0.png)


    Figure 4.7: The browse action of the file control allows users to locate the file
    desired.'
