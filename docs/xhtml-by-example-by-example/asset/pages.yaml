- img_proc: true
  md: '# Adding Graphics Using the Image Element


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_58_0.png)


    **Figure 3.1:** Default inline presentation of an image within a paragraph.


    Notice that the default presentation places the bottom of the image at the baseline
    of the text line in which it appears. This isn''t the most visually pleasing result,
    but it is proper behavior when an alternative alignment isn''t specified.


    # CAUTION


    Avoid the temptation to "resize" an image by setting the height and width values
    lower than the actual measurements. Although most browsers will attempt to compress
    the image into the allotted space, the result is never as clean as an actual resampling
    using a graphics editor—and the user must wait for the full image to download.


    # Image and Text Alignment


    Two adjustments can be made to the placement of an image within your page: how
    the image is aligned with respect to the baseline, and where the image sits relative
    to the entire page. Take another look at Figure 3.1 from the previous example.
    The bottom edge of the image sits on the baseline, which is the default behavior.
    Also note that the image sits on the left margin of the page, which is the alignment
    relative to the page as a whole.'
