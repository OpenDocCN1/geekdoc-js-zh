  md: '# XSLT Processors


    XSLT processor is a piece of software that can transform an XML source document
    into a result or an output document. The result or output document can be another
    XML document (to which formatting objects might be applied, but not be), XHTML
    or HTML document, or a plain text document.


    XSLT processors are routinely combined with an XML parser, but increasingly XSLT
    processors are also combined with other software modules—for example, an XML editor
    in development environments that are more or less integrated.


    In some circumstances the result document might be saved to disk, such as when
    a static XHTML page is created from an XML source file. On other occasions the
    result document will be created dynamically and displayed to a user but never
    exist other than in memory and onscreen.


    Several XSLT processors are freely available for download. If you are using a
    Windows 9x PC, an XSLT processor called Saxon is particularly easy to download
    and install. A full Java-based version of Saxon that can be installed on most
    PC platforms is also available without download


    Instant Saxon can be downloaded from

    http://users.iclway.co.uk/imkay///instant.html


    To understand how an XSLT processor works, you need to understand a little about
    the XSLT Data Model and how an XSLT processor makes use of it.


    All XML files are mostly text files. One character follows another. But the strictly
    defined syntax of an XML document means that within the XML file there is a logical
    structure contained within that sequence of characters.


    Among the character stream of an XML document, in the prolog of the document,
    will be like a command that associates an XSLT transformation with the source
    XML document.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_215_0.png)


    XSLT processors differ in how they associate a style sheet with an XML file. One
    way is to include within the XML document. If you do this using Internet Explorer
    5.0, the style sheet will be associated with the XML document (assuming the style
    sheet is situated in the location indicated by the processing instruction and
    is a legitimate style sheet), the source XML document will be transformed by the
    transformations contained within the style sheet. Early Preview Releases of Netscape
    6 have not con-'
