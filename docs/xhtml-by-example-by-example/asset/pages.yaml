  md: '# What''s Next


    +   * Subject (line 3)—What subject should each response email have?

    Pick something that will immediately alert you as to the email contains, such
    as

    * "Widgets Corp Web Order Form Response"


    +   * Next Page URL (line 4)—This variable holds the URL that you will make available
    to the user after she submits your form. It should lead back to a logical point—your
    site''s home page, the beginning of your online catalog for an ecommerce site,
    or some other major division within the site. The URL must be fully qualified,
