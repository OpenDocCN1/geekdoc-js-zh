  md: '# XSL-F0—Formatting Objects


    To select <section> elements using an absolute location path, we could use the
    following XPath expressions, respectively abbreviated or unabbreviated:

    book/chapter/section


    or


    /child::book::child::chapter::section


    Both the abbreviated and unabbreviated syntax would select all four of the <section>
    elements that are present in just one of the <section> elements, we in our document.


    To make a more precise selection of just one of the <section> elements, we could
    use an XPath expression to make a selection by specifying the title attribute
    of a particular <section> element:

    book/chapter/section[title="XPath - XML Path Language"]


    or


    /child::book::child::child::section[attribute::title="XPath - XML Path Language"]


    Note that selecting an element on the basis of the value of its attributes is
    not the same as selecting the attribute.


    Some straightforward usage of XPath will be illustrated later in the chapter when
    you see some example XSLT sheets.


    # XSL-FO—Formatting Objects


    The Extensible Stylesheet Language Transformations Recommendation issued by W3C
    in November 1999. Currently, W3C is working on an Extensible Stylesheet Working
    Draft, which focuses largely on XSL Formatting Objects (XSL-FO).


    The work on XSL-FO aims to capture all the functionality of Cascading Style Sheets
    for use with XML documents on the Web but also intends to add many layout facilities
    to use of XML documents not only on the Web but also in print. By separating content
    from presentation this becomes possible.


    When an XSL processor is applied, with an appropriate XSL style sheet, to an XML
    document a transformation of the source document occurs, producing an output or
    result tree.


    That process is carried out when using XSL Formatting Objects including such formatting
    objects in the tree output by the XSL Transformation.


    A second step then takes place called formatting which, not surprisingly, is carried
    out by an XSL formatter. In this context XSL refers to a combination of XSLT and
    XSL-FO included in the output tree.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Chapter 12: XSL—Style the XML Way


    The most recent W3C Working Draft summarizes the process as follows:


    > Formatting is enabled by including formatting semantics of the result tree.
    Formatting semantics are expressed in terms of a catalog of classes of formatting
    objects. The nodes of the result tree are formatting objects. The classes of formatting
    objects denote typographic abstractions such as page, paragraph, table, and so
    forth. Finer control over the presentation of these abstractions is provided by
    a set of formatting properties, such as those controlling indents, word-spacing,
    widow, orphan, and hyphenation control. In XSL, the classes of formatting objects
    and formatting properties provide the vocabulary for expressing intent.


    What that means is that a formatter will obtain information from nodes in the
    result tree that formatting objects provide the framework for the presentation
    of the output XML document and that smaller scale, fine control of detail in the
    output document is provided by formatting properties.


    In principle, a formatter will be able to create output for desktop Web browsers,
    mobile browsers, and output on paper.


    Typically, many of the nodes in the result tree will be in the formatting object''s
    namespace.


    Each formatting object represents part of the specification of the output, for
    example, layout and style.


    The Working Draft summarizes the formatting process as follows:


    > Formatting consists of the generation of a tree of geometric areas, called the
    area tree. The geometric areas are positioned on a sequence of one or more pages
    (a browser typically uses a single page). Each geometric area has a position on
    the page, a specification of what to display in that area and may a background,
    padding, and borders. For example, formatting a single character generates an
    area sufficiently enough to hold the glyph that is used to present the character
    visually and the glyph is displayed in this area. These areas may be nested. For
    example, the glyph may be positioned within a line, within a block, within a page.


    If you had difficulty understanding the ideas involved in XSLT output tree of
    nodes, you might find the idea of a tree of geometric areas a little overwhelming.
    Broadly, it is helpful to visualize the geometric areas'' nodes as reserved areas
    on the output page that are set aside for particular parts of the output tree
    to be displayed.'
  merge: -1
  pgno: 225
