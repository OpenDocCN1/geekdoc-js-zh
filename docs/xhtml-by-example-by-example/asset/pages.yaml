  md: '# Chapter 7: Universal Accessibility on the Web


    +   - Develop tools to evaluate and facilitate accessibility.


    +   - Publish materials and conduct events that educate the public and Web-development
    community about accessibility, and perform other outreach tasks.


    +   - Coordinate with research and development, reviewing adoption rates of accessible
    techniques, collaborating with outside research projects, and doing other tasks
    as required.


    We''ll be focusing on several documents published by the WAI throughout the rest
    of this chapter.


    # The Web Content Authoring Guidelines


    One of the first documents produced by the WAG aimed at the Web developer was
    the Web Content Authoring Guidelines (WCAG). Fourteen guidelines describe general
    principles of accessible design. Several checkpoints are provided for each guideline,
    giving practical applications for each design principle. The checkpoints are assigned
    one of three priorities:


    +   - Priority One—This checkpoint must be satisfied, or at least one group will
    be unable to access the information.


    +   - Priority Two—This checkpoint should be satisfied; otherwise, at least one
    group might find it difficult to access the information. Unresolved issues might
    represent significant (though not impossible) barriers.


    +   - Priority Three—This checkpoint might be satisfied, or at least one group
    will find it somewhat difficult to access the information.


    Conformance to the guidelines is rated as Level-A, Double-A, or Triple-A. Level-A
    conformance occurs when a site meets all Priority One checkpoints. Double-A sites
    meet Priority One and Two checkpoints, and Triple-A meets all checkpoints, regardless
    of priority.


    The full WCAG document can be found online at http://www.w3.org/TR/wai-WCAG/


    There has controversy surrounding the WCAG document on several levels. First,
    many designers, even those with significant experience, find the document very
    dense and difficult to understand. The design principles tend to be vaguely (a
    by-product of consensus-in-committee authoring of documents), and the presentation
    of checkpoints and priorities can be overwhelming.


    To ease the learning curve, the WAI program has published several “techniques”
    documents with solid examples for implementing the design'
