  md: '# Chapter 12: XSL—Style the XML Way


    Part of the work on XSL transformations took account of the fact that there was
    a need to navigate around XML documents, and it was also seen that another W3C
    activity (XPointer) had similar navigational needs. Rather produce two standards,
    work on those navigational needs was focussed into an initiative from emerged
