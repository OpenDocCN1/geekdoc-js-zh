- img_proc: true
  md: '# The Scope of Accessibility


    The Web is sometimes described as the most enabling technology to become available
    for disabled users, while at the same time often possessing barriers to access
    than most other media.


    Before discussing ways to make the Web more accessible, we must first understand
    how it can be inaccessible, something that''s not always easy for an-abled person
    to imagine. Disabilities that can impact the Web can be placed in four major groups:


    +   * **Visual Disabilities**—Users might be fully or partially blind, impaired
    color vision, or simply need the use of corrective lenses. Graphics that are not
    labeled or described, a lack of keyboard-based navigation support, or even small
    print and low-contrast colors can result in barriers to information.


    +   * **Hearing Disabilities**—A lack of captioning, transcripts, or other alternative
    distributions of audio-based content can leave hearing-impaired users without
    important information.


    +   * **Physical Disabilities**—Some users have limited skill or dexterity for
    typing, operating a mouse or trackball, or other selection pointer. Devices that
    are available to do amazing things, such as allow a user''s gaze to be tracked
    to “type” on a light-activated keyboard or “sip and puff” tubes that can be used
    by quadriplegic to turn on and off switches for simple binary decisions regarding
    the computer. Less drastic difficulties such as dealing with very users within
    small font sizes might be difficult for some users to accurately over and select,
    preventing full access to the site.


    +   * **Cognitive and Neurological Disabilities**—A lack of clear and consistent
    labeling, navigation systems, and other visual cues can confuse many users. Excessive
    use of jargon on sites that will be accessed by the lay-public, or highly technical
    information presented to such an audience without illustration, can inhibit comprehension.
    Additionally, flashing, flickering, or other high-frequency movements can have
    serious consequences for users dealing with epilepsy or other light- and motion-sensitive
    conditions.


    Estimates have been made that 10 to 20% of the population in most developed countries
    have one of disability or other. Some of them won’t affect Web, whereas other
    conditions that are typical of advancing age will nearly all of us at one stage
    or another in our lives. The combination of users who fit a classical definition
    of disabled and those who have age-related issues constitutes a significant percentage
    of the potential online audience.'
  merge: -1
  pgno: 139
