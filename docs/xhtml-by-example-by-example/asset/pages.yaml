    Content Rating Association, which can be found online at http://www.rsac.org.


    # Using Metadata for Machine Instructions


    The use of metadata instructions falls into two basic camps: information for search
    engines, and directives for the client. The simplest of these meta elements use
    the robots in the meta attribute:


    ```

    <meta name="robots" content="noindex, nofollow />

    ```


    This element tells spiders agents, or robots, that they should not index a document
    when this metadata appears with the noindex instruction. Additionally, nofollow
    tells the spider to look for or follow any links found within the document.


    # TIP


    Not all engine spiders recognize or obey the preferences set in the robots meta
    element. However, many follow the Robots Exclusion Protocol that was developed
    in 1994 as a cooperative project between the programmers of robots and spiders
    and site administrators. Information on using the Robots Exclusion Protocol and
    the resulting robots.txt file can be found at http://info.webcrawler.com/mak/projects/robots-exclusion-admin.html.


    Most search engines determine when they''ll return a given Web page by comparing
    the search term provided by the user with the information it has stored about
    a given site or page. Frequently store of data is a list of'
  merge: -1
