  md: '# Meta Information—The Document Head


    handles things like color, alignment, width, and size. Consider this one line:

    <p align=center>This would render centered in the browser</</p>


    The paragraph element is structural, as we''ve discussed previously. The align
    attribute, however, gives rendering instructions, and is therefore presentational.
    In a Transitional document, this construct is perfectly legal. If this was a Strict
    document, the alignment instructions would be relegated to the style sheet.


    # XHTML 1.0 Frameset


    The Frameset document type is only used when frames are a part of the document
    set structure. Frameset begins with the Transitional document type, and adds the
    frameset, frame, and no elements, and associated attributes such as target.


    > NOTE

    Only the documents that actually have the frame take the Frameset doctype.

    Other target documents can use Transitional or Strict.


    # Meta Information—The Document Head


    Some of the most important information in your XHTML documents will be included
    before you begin to create what we traditionally think of as the “content.” This
    section is made up of at least five components: the DOYPE declaration, and the
    html, title, and meta elements. Each of these tags provides a discrete piece of
    information about your document, and as such, is often referred to as metadata.
    Defined simply, metadata is data (information) about data. So metadata in your
    XHTML documents will be information about your document.


    Of the five tags that provide meta information, four of them are required in all
    XHTML documents. The first required element in any XHTML document is the DOTYPE
    declaration. As we discussed earlier, the doctype declares which version of XHTML
    1.0 your document is based upon.


    # The Doctype Declaration


    One of the following DOTYPE declarations must be used:


    ```

    <DOCTYPE html PUBLIC "-W3C/DTD XHTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml11/DTD/xhtml11-strict.dtd>

    ```


    ```

    <DOCTYPE html PUBLIC "-W3C/DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml11/DTD/xhtml11-transitional.dtd">

    <DOCTYPE html PUBLIC "-W3C/DTD XHTML 1.0 Frameset//EN"

    "http://www.w3.org/TR/xhtml11/DTD/xhtml11-frameset.dtd>

    ```'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1: XHTML Fundamentals


    The DOCTYPE declaration can be broken down thusly—The tag is opened with the string
    <DOCTYPE>. Next is the root element for this document type, in our case, html
    (note that html is in lowercase). PUBLIC declares that the next portion is a public
    identifier for this document type, rather than a local name, which would be noted
    using the SYSTEM keyword. For example, when working with the Transitional DOCTYPE
    declaration, the string //W3C//HTML 1.0 Transitional//EN is known as the formal
    public identifier, or FPI. Each version has its own FPI, as does any XML-based
    language. Finally, the URI provided is the location of the document type file.


    > CAUTION

    The DOCTYPE declaration is unique in XHTML in that it has mixed-case components.
    Dctypes must be written exactly as they are shown here—capitalization, spacing,
    punctuation, and all. The browser or parser''s ability to recognize them (and
    act upon them) depends on it.


    # THE ROOT ELEMENT


    The DOCTYPE declaration will always be the root element of your document—for us,
    the HTML element. This is the element within all other elements are contained.
    You could think of it as fitting the cabinet in which all folders and papers are
    held, or the suitcase in which all of your clothing and other travel necessities
    are stored.


    > NOTE


    You might wonder why the root element for XHTML documents isn''t xhtml, to find
    the answer, consider what the abbreviation XHTML stands for: the Extensible Hypertext
    Markup Language. Although XHTML is extensible, it''s still a hypertext-markup
    language, and for that reason, uses html as its root element.


    XHTML diverges from HTML at this point, adding several attributes to the root
    element that you might not have seen before. These include an XML namespace, the
    XML language attribute, and the language attribute. XML-based attributes are important
    in providing the additional detail required that allows XHTML to act as that bridge
    between HTML and XML I described previously.


    # THE NAMESPACE


    When the W3C Working Group responsible for creating the “Namespaces in XML” recommendation
    did so, they were unaware of the firestorm they were about to unleash on the development
    community. For a concept with a seemingly simple definition, the debates about
    what it truly means have been both staggering and unending.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Meta Information—The Document Head


    Put very simply, an XML namespace is an abstract collection of names that are
    used as element types and attribute names in XML documents.


    To visualize this, you might think of the English alphabet. The English alphabet
    namespace has members each letter (element type). The namespace is not the written
    list, but the collection of those letter names.


    The namespace is identified by a URI (Uniform Resource Identifier). This was probably
    an unfortunate choice on the part of the Working Group, that the use of a URI
    leads many people to believe that a file defining the members of the namespace
    will be found if they follow the URI—not necessarily so. A URI was chosen because
    it''s unique, and universally applicable to the Internet. Nothing else should
    be implied or inferred by the identifier being a URI.


    We''ll look at namespaces in more detail in Part II,"XHTML Style and Structure."
    For our purposes here, it''s important to know that the XHTML namespace is identified
    with the URI


    ```

    http://www.w3.org/1999/xhtml

    ```


    and when expressed as the full XML namespace attribute, it is written as xmlns="http://www.w3.org/1999/xhtml"


    +   * For namespaces and how they impact XHTML documents, see "The Freedom of
    XML—Defining It All Yourself," p. 176.


    ```

    xml:lang AND lang

    ```


    The language attributes hold the same information: an identifier for which language
    is used when writing the document. The first version, the xml:lang attribute,
    is the XML-conforming attribute that identifies the natural language that the
    document is written in. XHTML 1.0 also includes the HTML-based lang attribute
    for backward compatibility. If you include these attributes, you should use both
    for full interoperability—Although the attributes are optional for the same reason—interoperability—that
    you use both either were present, a good argument can be made for leaving them
    out. It''s a small consideration toward broader acceptance and usability of your
    documents.


    The value of the xml:lang and lang attributes are two-letter language codes. The
    code "en" refers to English, "fr" to French, and so on. A list of country codes
    can be found online at http://www.ics.uci.edu/pub/ websoft/wwwstat/country-codes.txt.
    Do note, of course, not that all country codes correspond to a language code for
    purposes of the lang attribute when a country doesn''t have its own unique language.'
  merge: -1
