  md: '# 82 Chapter 5: Working with Tables


    Populate the cells with Xs and Os as you please. Figure 5.1 shows my choices.
    When first entered, the letters are centered vertically in the cell, but are sitting
    at the left border of each, which looks a little funny. To fix this, we''ll need
    to add horizontal alignment for the cell contents.


    Alignment can be added to the cell level, or for an entire row. Horizontal alignment
    is set using the align attribute, whereas vertical alignment is set using valign.


    Because each cell''s alignment within a row is the same, I can place the attributes
    on the table row element. I''ve used "center" for the horizontal alignment, and
    "middle" for vertical alignment:


    ```

    <tr align="center" valign="middle">

    ```


    Put all together, the table looks like Listing 5.1.


    +   Listing 5.1: ttt.html


    ```

    <table border="1">

    <tr align="center" valign="middle">

    <td width="100" height="100">X</td>

    <td width="100" height="100">O</td>

    <td width="100" height="100">&nbsp;</td>

    </tr>

    <tr align="center" valign="middle">

    <td width="100" height="100">O</td>

    <td width="100" height="100">X</td>

    <td width="100" height="100">X</td>

    </tr>

    <tr align="center" valign="middle">

    <td width="100" height="100">O</td>

    <td width="100" height="100">X</td>

    <td width="100" height="100">O</td>

    </tr>

    </table>

    ```


    Much more be done with tables than the simple alignments that we''ve done in this
    first example. Next, we''ll prepare a monthly-view calendar that we will utilize
    background color for cells, headers, caption, and multi-column cells.


    The calendar begins with a seven-column row of cells containing the days of the
    week. These cells act as headings for the rest of the cells in the column, so
    they''re defined using the table head—element. The characteristics of each cell
    will be the same, with the sole exception of the actual content. Therefore the
    attributes can be placed on the TR element, impacting the entire row, instead
    of repeated seven times, per cell.'
