    Figure 17.2: Converting HTML 4.0 Transitional to XHTML 1.0

    itional is a first step toward authoring in XHTML Basic.


    Next, we''ll step through the document and make any necessary changes between
    XHTML 1.0 Transitional and XHTML Basic. Immediately, we need to change the DOCTYPE
    definition from


    ```

    <!DOCTYPE html "-//W3C//DTD XHTML 1.0 Transitional//EN"

    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

    ```


    to


    ```

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML Basic 1.0//EN"

    "http://www.w3.org/TR/2000/WD/xhtml-basic-20000210/xhtml-basic10.dtd">

    ```


    The first trouble we run into is the width, alignment, and cellpadding attributes
    on each of the tables and table cells. As presentational attributes, they''ve
    been removed from the XHTML Basic Doc.


    # TIP


    Remember, although these presentational attributes are not supported in XHTML
    Basic, that doesn''t mean the effect cannot be rendered in the document. CSS provides
    for table manipulation properties, allowing the same effect to be transferred
    from XHTML source to the stylesheet. With the class identifiers already in place
    within the table, there''s already a hook available.


    Horizontal rules aren''t supported, so the divider between the content of this
    page and the address and other information below the rule will need to be removed.
    Also, the JavaScript data needs to be converted to plain text as we see here:


    ```

    <table width="100%">

    <tr>

    ```'
