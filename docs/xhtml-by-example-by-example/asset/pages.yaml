    The final, fully resolved element and ATTLIST declaration for the h1 element become


    ```

    <!ELEMENT h1 (#CDATA | a | br | span | bdo | objects | applet | img | map | iframe
    | tt | i | b | big | small | u | s | strike | font | basefont | em | strong |
    dfn | code | q | sub | | | kbd | var | cite | abbr | acronym | input | select
    | textarea | button | ins | del | script | noscript)>

    <!ATLIST h1

    ID #IMPLIED

    class CDATA #IMPLIED

    style CDATA #IMPLIED

    title CDATA #IMPLIED

    lang TOKEN #IMPLIED

    xml:lang TOKEN #IMPLIED

    dir (ltr|rtl) #IMPLIED

