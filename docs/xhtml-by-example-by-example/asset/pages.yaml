  md: '# Grouping and Ordering Data with Lists


    # NOTE


    At this time, neither Netscape nor Internet Explorer support the compact attribute.
    However, the capability of another browser or XML-based parser to support it should
    not be discounted. Remember, most of the semantics associated with these elements
    and attributes are defined by tradition rather than dictate.


    # Ordered Lists


    Ordered lists, contrasted with unordered lists, attach priority and relative position
    to their members. What that means isn''t directly provided by the semantic of
    order. Instead, the surrounding prose will provide appropriate context.


    For instance, a numbered list could be used to express the members of a family.
    I could choose to order them as


    +   1. Ann

    2. Dave

    3. Linda


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_40_0.png)


    The meaning of the ordering isn''t apparent simply because the list is ordered.
    The reader could assume that I placed myself in the number position just as a
    self-referential starting point. In view of the end result, they could be correct,
    but only coincidentally. In this case they would not be correct. The fact that
    I ordered this list by age would only be apparent if I expressed that in my text
    before or after the list.


    # TIP


    Don''t make your readers guess at the internal semantics of your ordered lists.
    Be sure to identify in the surrounding prose what meaning should be inferred from
    the ordering of your list. If no meaning should be inferred, change to an unordered
    list.


    The rendering options for ordered lists, with unordered lists, are set using the
    type attribute. The potential values for type are shown in Table 2.2.


    Table 2.2: Number Sets Used in Ordered Lists


    | Attribute Value | Representation |

    | --- | --- |

    | 1 | Arabic numerals (1, 2, 3) |

    | a | lowercase Arabic letters (a, b, c) |

    | A | uppercase Arabic letters (A, B, C) |

    | i | lowercase Roman numerals |

    | I | uppercase Roman numerals |'
