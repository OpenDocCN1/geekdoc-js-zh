  md: '# Applying Style


    # NOTE


    The style attribute, to be used for inline styling in documents, is being deprecated.
    Deprecation, you''ll recall, means that the W3C is indicating that the method
    may not appear in future versions of the language, and generally, an alternative
    method will be provided.


    # Applying Style


    Now with the structure of style rules under your belt, let''s take a quick tour
    of popular styles. The full spectrum of style rules and possible values can be
    found in the CSS recommendations on the W3C Web site. CSS Level 1, the first version
    of CSS, is located at http://www.w3.org/TR/REC-CSS1. CSS Level 2, which builds
    upon Level 1, is found at http://www.w3.org/TR/REC-CSS2/. CSS1 covered the basics:
    fonts, list formatting, and properties such as margins and padding. CSS2 continued
    the work by adding control of positioning, the ability to float boxes in a given
    area, and what''s known as the z-index, for a pseudo-three-dimensional presentation.


    At present no browsers fully implement CSS. CSS2 support in browsers is far from
    complete. Internet Explorer 5.5 and the previews of Netscape 6 come to fully implementing
    CSS1.


    # Styles for Text


    Most of use in style documents belongs to one of three types: fonts, colors, and
    alignment. Table 11.1 lists five properties for fonts and the type of values that
    must be assigned to them.


    Table 11.1: Style Properties for Fonts


    | Style Property | Values |

    | --- | --- |

    | font-family | Font names, such as Arial, Times, Courier, or generic font types
    such as sans serif |

    | font-style | normal, italic, oblique (small, medium, large, and so on), relative
    sizes (+2 for twice the size, -1 for half and so on), or percentages (for example,
    50% for half the base size) |

    | font-size | |

    | font-variant | small-caps |

    | font-weight | bold |


    # Block Level Formatting


    One way of describing the layout of HTML documents is called the *box model*.
    In this model, small boxes fit inside larger boxes, which all fit inside a single
    big box (see Figure 12.4).'
