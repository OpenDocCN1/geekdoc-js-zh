    ```

    <?xml version="1.0"?>

    <!-- This is a comment -->

    <chapter>Chapter 12</chapter>

    ```


    When processed in memory, this very simple XML document entity, which would have
    two child nodes: a comment node representing the comment that forms the second
    line of the code and an element representing the <chapter> element. In addition,
    a text node representing the content of the <chapter> element would be present
    as a child of the element node, which represents the <chapter> element.


    # XPath Paths


    The XPath term for the equivalent of street directions is location path. A location
    path can be of one of two forms—an absolute path, which takes its starting point
    as the root node of the tree or a relative location path, which takes the context
    node as its starting point. These will be compared in more detail a little later
    in this chapter.


    A location path consists of one or more location steps separated by a slash (/).
    A location step has three parts:


    +   An axis—Specifies the tree relationship between the nodes selected by the
    location step and the context node. Example axes are parent and child.


    +   A node test—Specifies the node type and expanded-name of the nodes selected
    by the location step.


    +   Zero or more predicates—Use arbitrary expressions to further refine the set
    of nodes selected by the location step.


    A location path returns the node set selected by the location path (a location
    path is a special type of XPath expression). Location paths also can return Boolean
    values, numbers, or strings in some circumstances.


    Detailed consideration of location steps, XPath functions, and so on is beyond
    the scope of this chapter.'
  merge: -1
  pgno: 221
