  md: '# Using the W3C Validator


    your desktop, a computer with a Pentium III processor and 128MB of RAM, is not
    necessarily going to work on your 8MB Palm Vx, or on your phone with an even smaller
    memory allotment. In fact, we can guarantee much of it *won''t* work.


    Now of course I''m not suggesting that a cell-phone should be to visit all Web
    sites. We know that is simply not possible, nor is it even desirable. However,
    making sure that your Web pages are well-formed and valid can increase the likelihood
    that less powerful devices can use the sites you produce.


    Smaller devices simply don''t have the computing power to handle the complex process
    required to anticipate what a document author might have intended to write. Browsers
    that don''t attempt to do this are smaller and can run on less powerful machines,
    which means that your Web pages, when well-formed and valid, have a higher likelihood
    of success on those devices.


    # Using the W3C Validator


    There are several validation services available online, but the most accurate
    service is inevitably found right at the source: the W3C. The W3C service is derived
    from the work of Gerald Oboskino, who first debuted his site as the “Kinder, Gentler
    Validator” in the mid-1990s. Gerald later came to work for the W3C, revamping
    the project to be a formal service offered by the W3C. Now known simply as the
    W3C HTML Validation Service, it can be found at http://validator.w3.org (see Figure
    8.4).


    # NOTE


    Although the service is called the “HTML Validation Service,” it can validate
    XML as well. A link on the site details which DTDs the service has access to and
    can validate against.


    # The Process Works


    The W3C HTML Validation Service provides an SGML-based validation. The ideas that
    we''ve discussed previously in this chapter, specifically validity, are carried
    over into HTML and XHTML from SGML.


    The first step to validating your page is to enter its URL in the form provided
    by the service. The page must be accessible via the Web. If it''s on an intranet
    or behind any system that controls HTTP access, the service can attempt username
    and password authentication based on data you provide when prompted.'
