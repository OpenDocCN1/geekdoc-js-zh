  md: '# Chapter 10: XHTML as the Bridge to XML


    Instead, the attribute value must be quoted


    ```

    <p align="center">

    ```


    In HTML, the quotes were optional if you were working with attribute values other
    than URIs or non-alphanumeric characters, such as the symbol in hex color codes.
    In XHTML (as well as XML), all attribute values must be quoted for the document
    to be considered well-formed.


    +   **Boolean attributes must be expanded.** Stated another way, this says "every
    attribute must have a value." A Boolean attribute is one which is "on" just by
    its presence. In HTML 4 an example could be the checked attribute on the input
    element of type checkbox:


    ```

    <input type="checkbox" name="mybox" checked>

    ```


    In a well-formed XHTML document, every attribute must have a value, the checked
    option on this input would be written as


    ```

    <input type="checkbox" name="mybox" checked="">

    ```


    +   **Non-empty elements must have a closing tag.** This means closing tags that
    were previously optional in HTML 4 now always be present. For example, it is very
    common to see paragraphs written in HTML 4 in the following manner:


    ```

    <p>This is the first paragraph.

    ```


    ```

    <p>This second opening p tag opens the second paragraph, and by default,

    closes the first.

    ```


    In XHTML 1.0, the elements would have to be written as


    ```

    <p>This is the first paragraph.</p>

    ```


    ```

    <p>Since the first paragraph has its own closing tag, nothing additional is

    inferred by the start of the second paragraph element.</p>

    ```


    +   **Empty elements must also be closed.** Empty elements can be closed by either
    including a closing tag, or by using a shorthand notation. Both of the following
    examples would be well-formed:


    ```

    <img src="myphoto.gif" alt="a picture of the author"></img>

    ```


    or


    ```

    <img src="myphoto.gif" alt="a picture of the author" />

    ```


    Both of these options create some backward compatibility

    with HTML-based browsers.


    +   Options to improve backward compatibility in Chapter 9, “Implementing XHTML
    Today,” p. 157.'
