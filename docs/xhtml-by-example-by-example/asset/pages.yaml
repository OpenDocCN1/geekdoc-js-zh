  md: '# Emphasizing Important Content 39


    versions &lt;em&gt; and &lt;&gt;. Specific font weights and styles are then handled
    in CSS or other stylesheet language.


    # Block-Level Emphasis


    At times, document authors will be faced with the need to offset large blocks
    of text, rather than just a word or phrase within a sentence. XHTML continues
    to provide the mechanism to do this that you''re familiar with in HTML 4, namely
    with the &lt;blockquote&gt; element.


    blockquote is intended to function as its name implies, a specific block of data
    offset as a quotation. Because blockquote is also a block-level, you have the
    freedom to include additional styling at the inline level.


    Suppose you were writing a term paper about Shakespeare, and wanted to quote a
    famous passage from Julius Caesar. You could do so using the blockquote element:


    ```

    &lt;blockquote&gt;

    Remember March, the ideas of March remember:

    Did not great Julius bled for justice'' sake?

    What villain touch''d his body, that did stab,

    and for justice? What, shall one of us

    that struck the foremost man of all this was

    but for supporting robbers, shall we now

    contaminate our fingers with base bribes,

    for so trash may be grasped thus?

    Had rather be a dog, and bay the moon,

    than such a Roman.

    &lt;/blockquote&gt;

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_50_0.png)


    The actual presentation of a block quote passage is not decreited in the HTML
    or XML specs. Instead, implementation is left to the browser programmer. Tradition
    has been that the text is indented on both margins (see Figure 2.9). Some browsers
    might go further and italicize the passage, or provide other font and color changes.


    # CAUTION


    Avoid the temptation to use blockquote to produce the double-sided indent look
    for general layout purposes. As we discussed, this rendering is not guaranteed
    by the XHTML specification. The user agent can do anything to offset the text
    and still conform.'
