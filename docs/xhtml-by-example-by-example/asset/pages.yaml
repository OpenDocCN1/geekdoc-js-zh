  md: "Next is another commented section that names the module, lists the elements\
    \ to be declared, and provides a basic description of the module's purpose:\n\n\
    ```\n<!-- WebGeek Recipe Module\nrecipe:recipe\nrecipe:ingredients\nrecipe:prep\n\
    recipe:prep -->\n```\n\nThis module defines structural components of a cooking\
    \ recipe.\n\nThe first declaration invokes and defines a parameter entity that\
    \ is used within the ATTLIST of each element declared. Its purpose is to manage\
    \ the prefixing of the attributes when the module is used to create a standalone\
    \ DTD. When combined with the XHTML Framework, the value of these PEs is overridden\
    \ by the NS attribute:\n\n```\n<![%Recipe.prefixed;\n<!ENTITY % Recipe.xmlns.attrib\n\
    \  \"%NS.prefixed.attr;\"\n>\n<!ENTITY % Recipe.xmlns\n  \"%NS.prefixed.attr;\"\
    \n  xmlns %URI.datatype; #FIXED '%Recipe.xmlns;\"\n>\n```\n\nNow, each element\
    \ is defined using the parameter entities created in the QNames sub-module, along\
    \ with ATTLIST definitions required:\n\n```\n<!ELEMENT %Recipe.recipe.qname;\n\
    \  (%Recipe.ingredients.qname);\n<!ATTLIST %Recipe.recipe.qname;\n  %Common\n\
    \  title CDATA #REQUIRED\n  category CDATA #IMPLIED\n  %Recipe.ns.attr;\n>\n```\n\
