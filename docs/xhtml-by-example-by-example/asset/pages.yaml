- img_proc: true
  md: '# Understanding XSLT


    previous flavors of Microsoft XSL had been. Microsoft have stated that their XSL
    will be made fully compliant with W3C standards, but that has not yet achieved.


    In this chapter, the terms XSLT and XSL-FO are used to refer, respectively, to
    the standards expressed in the W3C Extensible Stylesheet Language Transformations
    Recommendation and the Extensible Stylesheet Language Working Draft. XSLT transforms
    the source XML document into an output document (for example, in XML, XHTML).
    XSL-FO applies the formatting information to the transformed document, controlling
    how it is displayed—whether in a desktop browser, in a mobile browser, or on paper.


    Because of the ambiguity surrounding the term XSLT, it won''t be used (without
    explanation) in the remainder of this chapter.


    # What Does XSLT Do?


    How does XSLT work? Put simply, an XSLT style sheet contains the instructions
    for an XSLT processor about how a new document should be constructed from the
    source XML document and the XSLT style sheet.


    How do you know which XSLT style will be applied to an XML document? Basically,
    there are two techniques. First, within an XML or XHTML document there might be
    a reference associating that document with an XSLT transformation sheet, also
    known as a style sheet. Another technique is to make the association between the
    XML document and the XSLT style sheet being applied to it from the command line.
    Instant Saxon, mentioned later, in the latter way.


    As a result of processing by an XSLT processor, the content of the source XML
    document is manipulated (“transformed”) by the XSLT processor so that the output
    document differs from the source document.


    The transformation of the source document need not be combined with formatting
    for display, but in this chapter it is XSLT transformation as a prelude to display
    that will be explained. The transformation of XML documents into other documents
    is of great importance for ecommerce. XSLT can, for example, transform the XML
    used by one business into the format used by a customer or supplier, thus facilitating
    the electronic exchange of information. However, this will not be considered further
    in this chapter.


    To better understand the process of transformation, it is necessary to take a
    closer look at how an XSLT processor works.'
