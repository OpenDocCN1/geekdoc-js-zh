  md: '# Chapter 1: XHTML Fundamentals


    parsing these formal definitions. There are tools available to you, such as the
    validator discussed in Chapter 8, “Validating XHTML Documents,” that will help
    you check the compliance of your document to the DTD.


    Although not all do, block-level elements are the only elements that might contain
    other block-level elements. In addition, they all might contain inline elements
    and character data.


    # Inline Elements


    Inline elements are those that can only contain other inline elements or character
    data. They can never contain block-level elements. For instance, the emphasis
    element is an inline element. It can contain character data (the text contained
    within the start and end tags) and other elements, such as strong emphasis.


    It’s not uncommon to see text that has been italicized and presented in boldface.
    To accomplish this, two inline elements are nested. You can wrap the magazine
    name in our previous memo within the strong element to increase its emphasis:


    ```

    <p>Attached is a copy of a recent <em>Business Work</em>/</strong><strong>article</strong>
    focusing on the success of e-commerce in our industry, with a mention of our award
    winning Web site! Please circulate among your staff.</p>

    ```


