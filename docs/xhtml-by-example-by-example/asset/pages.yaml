  md: '# Techniques for Web Content Authoring Guidelines


    principles. This has been somewhat helpful, although the result still has a tendency
    to be more academic than practical. Another tool is a "checklist of checkpoints"
    that can be printed and used as an evaluation and keeping tool in the post-design
    phase. The checklist can be accessed at http://www.w3.org/WAI-WEBCONTENT/full-checklist.html.


    Second, the conformance levels provide no leeway in implementation. If a site
    developer cannot meet a single Priority Two checkpoint, the site cannot be labeled
    Double-A conformant, no matter if every Priority Two checkpoint is met. Many feel
    this results in discouraging implementation of the checkpoints sites can meet,
    because the effort will not be "rewarded" with the more desirable conformance
    ranking. The cost of implementation is something every company or individual will
    have to evaluate when planning their design techniques.


    # Techniques for Web Content Authoring Guidelines


    In this section we''ll look at each of the 12 HTML techniques discussed in the
    Techniques for WCAG document published by the W3C. Additional examples and issues
    go beyond what are presented here are included in the document online at http://www.w3.org/WAI-WEBCONTENT-TECHS/


    # Designing Documents Structurally


    The concept of designing documents based on their structure versus visual look
    is something we''ve talked about nearly every chapter so far. Even so, it''s repeating
    here, with a slightly different perspective.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_142_0.png)


    Think for a moment about how this chapter is presented. On the first page, it
    has a chapter number, then on the next a chapter title. There''s a paragraph or
    so of text, and then a bulleted list of things you''ll be reading about. On the
    following page, there''s a heading written in white letters on a black background.
    Each of these represent a specific structural portion of the chapter. In the initial
    manuscript to the publisher, it didn''t just say "write the number 7," and then
    "Universal Accessibility on the Web, leaving the reader to interpret the structural
    significance of those items. Instead, both were clearly labeled as Level-A (the
    topmost) and heading B, respectively.


    If we were to mark up the chapter using XHTML, those structures would be mapped
    to the h1 and h2 elements. By using the elements for their hierarchical structure,
    I can give the content of the elements proper semantic importance. If I were to
    begin with the chapter number in an h2 element, simply because I preferred the
    default size and font weight, I''d lose the structural cue as to its place in
    the document.'
