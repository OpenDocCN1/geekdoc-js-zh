  md: '# Smoothing the Transition


    can provide the additional context and, in some cases, even pronunciation hints
    to certain user agents.


    XML uses the special xml:lang attribute for this language identification task.
    It has been recommended that authors use both versions of the attribute in XHTML
    documents to cover processing by either HTML-based browser or an XML parser. Such
    usage on an element would look like <p>Jack had a strange sense of <span xml:lang="fr">fr</span>
    vu</span> <p>moment he entered the room.</p>


    # TIP


    If there is a discrepancy between the values of the xml:lang and lang attributes,
    the value of the xml:lang attribute takes precedence.


    # Managing Fragment Identifiers


    A fragment identifier is the portion of a URI referenced as #fragment. Typically
    these are used to provide intra-document linking, or a link from one document
    to a specific portion of a second document (other than the page). Such a link
    could look like <a href="newpage.html#spot">Go directly to the spot!</a>


    The corresponding spot is identified using a named element: <a name="spot">This
    is the Spot!</a>


    A problem arises in that XML requires the fragment to be identified using an attribute
    of type ID, which would be found in the id attribute in HTML 4.01. However, existing
    Web browsers operate using the name attribute to make this identification. To
    allow both types of systems to make the appropriate name and id attributes when
    working with fragment identifiers. Accordingly, the markup would look like


    ```

    <a name="spot" id="spot">This is the Spot!</a>

    ```


    Notice that the value of the name and id attributes are identical in this example.


    Some additional restrictions come into play for the value of these attributes.
    The XML requirement of using an attribute type ID is in conflict with the HTML
    name attribute, which allows any CDATA in the value. To help normalize these differences,
    the type of the XHTML name attribute has been changed to NMTOKEN. Essentially,
    this requires the value to be a single string of characters composed of any letters;
    numbers; and the characters, '', _, and.'
