  md: '# Chapter 6: Using Frames


    # Nesting Framesets: Frames Within Frames


    The rows and columns method of instantiating frames works well, provided that
    youre content with dividing the space contained within the entire browser window.
    But what happens when you want to split the space in a single frame? To achieve
    this effect, you need a nested frame.


    Begin with the frameset document that provides the initial divisions. For this
    example, you''ll use the "6 pack" layout of two rows and three columns (see Figure
    6.3).


    ```

    <frameset rows="50%, 50%" cols="1*, 1*, *">

    <frame src="frame1.html" name="f1" />

    <frame src="frame2.html" name="f2" />

    <frame src="frame3.html" name="f3" />

    <frame src="frame4.html" name="f4" />

    <frame src="frame5.html" name="f5" />

    <frame src="frame6.html" name="f6" />

    </frameset>

    ```


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_123_0.png)


    | Frame 1 | Frame 2 | Frame 3 |

    | Frame 4 | Frame 5 | Frame 6 |


    Next you''ll take the document in frame 1 (upper-left corner) and split it into
    two rows:


    ```

    <frameset rows="50%, 50%">

    <frame src="frame1a.html" name="fia" />

    <frame src="frame1b.html" name="fib" />

    </frameset>

    ```'
  merge: -1
