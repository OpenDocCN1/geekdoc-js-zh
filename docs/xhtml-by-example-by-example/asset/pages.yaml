  md: '# The W3C Web Accessibility Initiative


    Advances in technology originally intended to serve a disabled audience frequently
    benefit the general public as much or, as a percentage of use, even more than
    the intended recipient of aid.


    Two of my favorite examples are the sidewalk curbcut and closed-caption television
    broadcasts. Not that many years ago, perhaps 10–15 years in places, finding the
    curbs cut down to street level on corners throughout out a city was rare, as ramps
    were used to bypass outdoor stairways.


    Both curbcuts and ramps were originally incorporated into public projects to assist
    wheelchair-bound citizens in crossing streets and gaining access to buildings
    previously only reachable by stairs. But look around the next time you take a
    walk outside or go for a drive. Who is undoubtedly see several grateful pushing
    baby strollers, a postal worker pushing a delivery cart, even roller-skaters using
    them for a smooth transition between sidewalk and roadway. These concrete features
    are easily used 9 out of 10 times (or even more) for-than-intended, but very convenient,
    purposes.


    Closed-captioning can often be seen in sports bars or airport lounges—places where
    there a television broadcasting the news or a game, but the ambient noise is high
    enough that hearing the audio track is difficult to impossible. These establishments
    turn on the closed-captioning text available on all television broadcast streams,
    and hearing users can sit across the room and still “hear” the information that
    accompanies the pictures, no lip-reading required.


    Now Im intending to suggest that all of the accessibility design techniques you
    will learn be life enhancing or even convenient to the traditional user. Instead,
    I remind you of these situations to encourage you to remember that enhancements
    have a way of finding usefulness in the mainstream world as they serve the needs
    of those with disabilities.


    # The W3C Web Accessibility Initiative


    In 1997 the World Wide Web Consortium began research into what is now termed “universal
    accessibility” on the Web. A program office was established under the auspices
    of the W3C, funded in through grants and cooperative efforts with the United States
    National Science Foundation, the U.S. Department of Education’s National Institute
    on Disability and Rehabilitation Research, the European Commission, and the Canadian
    Government, Industry Canada’s Assistive Devices Industry Office, IBM/Lotus, Microsoft,
    Bell Atlantic, and many more.


    The WAI program has five primary goals:


    +   - Ensure that new technologies support accessibility.


    +   - Develop guidelines for implementing accessibility features.'
