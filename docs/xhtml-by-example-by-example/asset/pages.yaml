    **Listing 1.1:** memo.html


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 1.0//EN">

    <html>

    <head>

    <title>Memo - Business Week</title>

    </head>

    <body>

    <h1>Memorandum</h1>

    <p><b>To:</b></p> Joe Cline<br>

    <p><b>From:</b></p> Marshall Jansen<br>

    <p><b>Re:</b></p><i>Business Week</i> article</p>


    <p>Joe,</p>

    <p>Attached is a copy of a recent <i>Business Week</i> article focusing on the
    success of e-commerce in our industry, with a mention of our award winning site!
    Please circulate amongst your staff.</p>


    <p>Best,<br>

    Marshall</p>

    </body>

    </html>

    ```'
