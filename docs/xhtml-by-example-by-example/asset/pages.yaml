  md: "# Reading the XHTML DTDs\n\n![](img/a046e2e08ea170a8a111d9784d7fba9b_244_0.png)\n\
    \n```\n--- Document Structure ---\n<!-- the namespace URI signifies the document\
    \ profile -->\n<!ATTLIST html (head, body)>\n  i18n      #FIXED 'http://www.w3.org/1999/xhtml'\n\
    \  xmlns    #FIXED\n\n--- Document Head ---\n<!ENTITY head \"[<script|style|meta|link(object|index)>'>\n\
    <!-- the content model of head; combined with a single\ntitle and optional base\
    \ element in order --> -->\n<!ELEMENT head (head.misc,\n  (title, head.misc, (base,\
    \ head.misc)*)*]>\n<!ATTLIST head\n  i18n      #FIXED\n  xmlns    #FIXED\n\n<!--\
    \ The title element is not considered part of the floor of text.\nIt should be\
    \ displayed, for example as the page header or\nwindow title. It is received in\
    \ Document\ndocument Area -->\n```\n\n**Figure 13.1:** The first elements and\
    \ attributes are defined for major structural components.\n\nThe root element\
    \ for XHTML (head, body) is defined thusly:\n\n```\n<ELEMENT html (head, body)>\n\
    <!ATTLIST html\n  i18n      #FIXED 'http://www.w3.org/1999/xhtml'\n  xmlns>\n\
    ```\n\nThe html element must contain a single head element and a body element.\
    \ It can take attributes defined by the i18n entity (i18n stands for \"internationalization,\"\
    ) an i with 18 additional letters before the final n), and the xmlns attribute.\n\
    \nEach additional section is well commented, with dividing comments blocking out\
    \ related sections (as seen in Figure 13.1), and with additional explanation or\
    \ rationale provided to aid the human readability of the DTD document.\n\nEntities,\
    \ as used in the declarations shown here, are an important part of large DTDs.\
    \ They deserve close inspection, and we'll walk through the resolution of an entire\
    \ set of entities used in defining an element and attribute list in this next\
    \ section."
