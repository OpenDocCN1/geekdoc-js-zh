    The property used in CSS is the “text-align” property. The default placement in
    XHTML is aligned to the left margin. Other possibilities are aligned to the center,
    the right margin, or a *justified* alignment, where it appears that the text is
    aligned to both the left and right margins. Justification is actually achieved
    by stretching the spaces within the line to allow the ends to stay docked at the
    margin.


    # INDENTATION


    For many years the ability, or perhaps better put the inability, to indent the
    beginning of paragraphs became a seemingly never-ending quest. Designers would
    try to force spaces using the &nbsp; character entity, only to have a browser
    collapse the white space. They''d use small .gif images, yet to struggle with
    the changes in font size and height.


    When CSS was developed, a new property was defined: text-indent. The value is
    a measure, expressed either in units as pixels or em spaces, as a percentage of
    the available space within the block. Using the standard-three em indent so sought
    after, the rule is expressed like this:


    ```

    p {text-indent:3em}

    ```


    Provided your browser supports this property, the result would look like Figure
    11.7.


    # LINE HEIGHT


    Line height is a measurement from the baseline of one line of text to the baseline
    of the line above or below it. The baseline is invisible one on which the bottom
    of most letters rest (letters like g and q project the baseline with their “tails”).
    Potential values for the line-height property include specific units (pixels,
    centimeters, and so on), and relative values. If a font size is set to 10 pt,
    a line-height value of 1.4 results in the same space allocated to a 14-pt font.


