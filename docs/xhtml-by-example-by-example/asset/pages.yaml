- img_proc: true
  md: 'working draft phase, and were about to move into the final review process.
    You''ll walk through a very basic primer on XML Schemas in Chapter 15.


    # NOTE


    Any material changes in this book dealing with the schema drafts that occurs after
    publication will be updated on the book''s supporting Web site.


    The hope stored in much of this effort is that schemas will be more user-friendly.
    Additionally, they should offer sufficient facets for constraining information
    so that document authors will be able to move easily between a document-based
    information storage system and a data-driven system (and of other scenarios we
    probably haven''t thought of). To address the “user-friendly” aspect, XML Schemas
    are written in an XML-style format instead of the more formal (and cryptic) notation
    used in document type definitions.


    # What''s Next


    In this chapter you have learned how XML can provide document authors with the
    freedom to give meaning to their document structures by giving them names that
    correspond to their purpose or contents. A parser or other user agent won''t know
    what these mean or even data management systems can manage content much more easily
    searching for <footer>, rather than a generic <span> structure that has the text
    string “foo” inside of it.


    We''ve also taken a close look at the definition of well-formedness, both from
    an XML viewpoint and specifically the requirements for XHTML. Conformance to a
    language can go further than well-formedness, by validating against a DTD or a
    schema.


    Next in Chapter 11, “Using Cascading Style Sheets with XHTML,” we''ll take an
    in-depth look at XHTML 1.1, a version that takes a closer step toward XML by removing
    deprecated elements and syntactical conventions.'
