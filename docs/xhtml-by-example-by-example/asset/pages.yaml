  md: '# What''s Next


    Because we haven''t used any modules, elements, or attributes that aren''t defined
    in the XHTML Modularization documents, existing HTML user agents won''t have any
    difficulty processing documents written in this language. If we had included new
    features, we''d need to use a browser with an XML parser built in, such as Internet
    Explorer 5 for the PC, which could render the new elements, provided a style sheet
    was developed for them.


    +   - To learn more about applying style sheets to XHTML, see “Creating XSL Style
    Sheet,” p. 215.


    # What''s Next


    In this chapter you have learned how the features of XHTML were divided into logical
    groups of elements that shared the same semantics. Each atomic group forms an
    abstract module, defined by a brief prose section outlining its use, and a table
    of elements, their allowable attributes, and minimal content models. Each abstract
    module has a corresponding DTD implementation, which is combined with other module
    DTDs to create the final DTD used to represent the new language.


    Next, in Chapter 15, “Creating a Custom HTML Module,” you’ll dive deeper into
    the world of Modularization and create your own abstract module and its corresponding
    DTD implementation. You will plan the content model, define qnames, parameter
    entities, and the element and attribute-list declarations.'
