    # Presentational Attributes for Frames


    Authors can control the look and behavior of frames with several attributes that
    control scrolling, resizing, margins, and more. These attributes and their accepted
    values are detailed in Table 6.1.


    Table 6.1: Attributes Used on the Frame Element


    | Attribute | Values | Effect |

    | --- | --- | --- |

    | noresize | noresize | A boolean attribute in HTML 4.0, this instructs the browser
    not to let the user resize the frame at will. |

    | scrolling | yes, no, auto | auto is the default value and will allow scrolling
    if needed by the contained document. If “no” is chosen, the frame will not scroll,
    regardless of content size. |

    | frameborder | 0, 1 | Using “0” turns the frame border order. “1” explicitly
    requests the border. |

    | marginwidth | pixels | Defines a gutter, or margin, on the left and right sides
    of the frame. |

    | marginheight | pixels | Defines a gutter, or margin, on the top and bottom sides
    of the frame. |'
