  md: '# Chapter 15: Creating a Custom XHTML Module


    # # Planning the Content Model


    Before you begin writing the abstract module definition for your new module, it''s
    always a good idea to sit down with pen and paper and map out the components that
    need to be addressed. When developing new elements it''s not always readily apparent
    what information should be stored in attributes, sub-elements, or even as CDATA.
    Having a visual model of your data can help sort the information into the proper
    structures.


    To create the model, three major questions need to be answered:


    +   1. What data needs to be stored?

    2. How is the data used?

    3. What constraints, if any, need to be placed on the data?


    To illustrate the process we''ll create new abstract module and its corresponding
    DTD implementation for presenting recipes on the Web.


    # ## What Data Needs to Be Stored?


    A recipe has two major sections: a list of ingredients, and then instructions
    for preparation. Within the ingredients list there are, a minimum, three different
    data points to consider: quantity, unit of measure, and the actual ingredient.
    Figure 15.1 shows these pieces arranged in a basic organizational chart.


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_275_0.png)


    **Figure 15.1:** The components of a recipe can be arranged as an organizational
    chart.


    At this stage don''t discount any aspect of the data that might be important.
    In the organizational chart you can see we''ve listed cooking methods (baking,
    frying, sautéing), temperatures, and equipment. This information might end up
    simply being presented in prose within an element''s content (CDATA), but we might
    choose to create another element or attribute to'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Planning the Content Model


    store it. Early assumptions about how you''ll handle data can result in need-
    to rework your content model and/or DTD much later in the game when it''s more
    difficult to do so.


    # How Will the Data Be Used?


    In the basic organization chart, we see a list of ingredients. Each ingredient
    line, however holds multiple pieces of data. Consider the following typical presentation:


    ```

    2 cups all-purpose flour

    ```


    The ingredient can be divided into three parts: quantity (2), a unit of measure
    (cups), and the item itself. All three of these pieces will need to be recorded
    in a potential ingredient element.


    The next major segment of a recipe is the preparation instructions. What kind
    of information might appear there? Certainly you''ll have text, so we need to
    allow for paragraphs, perhaps lists, and other text structures. This suggests
    we''d want to allow Block XHTML elements to appear within a prep element.


    # The Abstract Module Definition


    Now that we''ve thought through the data that needs to be stored in the structures
    belonging to this module, and how they''d be best used, we''re ready to write
    the abstract module definition. Begin as always with a simple description of the
    module''s purpose:


    > The XHTML Recipe Module definition marks markup used when documenting the ingredients
    and methods used when preparing a given recipe. The elements and attributes defined
    in this module are


    Next comes the table of elements, attributes, and minimal content models:


    | Element | Attributes | Minimal Content Model |

    | --- | --- | --- |

    | recipe | Common, (CDATA), title, category | ingredients, prep |

    | ingredients | Common | ingredient+ |

    | ingredient | Common, quantity, unit, item | EMPTY |

    | prep | Common | (PCDATA|Flow)+ |


    When this module is selected, it adds the recipe element to the Block set, and
    it defines the content set Recipe with a minimal content of ingredients, prep,
    and adds it to the Inline content set as these are defined in the Text Module.'
