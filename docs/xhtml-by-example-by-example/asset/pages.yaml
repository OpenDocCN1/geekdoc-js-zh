  md: "# Chapter 15: Creating a Custom XHTML Module\n\nNamespaces and still have confidence\
    \ that his document is valid. The way namespace hack accomplishes these two tasks\
    \ is complicated. A simple explanation of it is\n\n+   - Each element in a module\
    \ has a name that is defined symbolically.\n- If the document type author or the\
    \ document author chooses, the element names can be prefixed with their namespace\
    \ identifier.\n- This namespace identifier can be set to any value. It is mapped\
    \ to the namespace's URI—a world-unique identifier.\n- Whether or not document\
    \ author chooses to use namespaces, if the document has the correct structure,\
    \ it is a valid XHTML family document.\n\nXML Namespaces are a somewhat futuristic\
    \ application within XML—they are not wide in the Web document authoring community.\
    \ However, as more and more collections of elements are developed into XHTML Modules,\
    \ these modules will need to rely upon XML Namespaces to a) help the semantics\
    \ associated with an element or attribute and b) help ensure that there are no\
    \ name collisions.\n\nSo get back to our module, you'll remember that this information\
    \ noted at the beginning of the sub-module file was in comments, meant for human\
    \ consumption, not machine. This entity takes the following format:\n\n```\n<ENTITY\
    \ % Recipe.xmlns \"http://www.webgeek.com/xmlns/recipe\" >\n```\n\nThe prefix\
    \ to be used when the namespace-qualified names are used must declared in its\
    \ own PE, identified by the .prefix suffix in the PE:\n\n```\n<ENTITY % Recipe.prefix\
    \ \"recipe\" >\n<![%Recipe.prefix; \"%Recipe.prefix;\">\\>\n<ENTITY % Recipe.xmlns.extras.attr>\n\
    \ %xmlns:Recipe.prefix; %URI.datatype;> #FIXED '%Recipe.xmlns;' >\n]>\n<ENTITY\
    \ % Recipe.pfx \" \\>\n<ENTITY % Recipe.xmlns.extras.attr \"\">\n```\n\nNow, each\
    \ of the elements that will be defined in the module need to have a parameter\
    \ entity that represents their qualified names. These PEs are always named with\
    \ the .fname suffix. The value of these entities is always %Module.pfx;name—where\
    \ the identifying string for the module is substituted for Module, and name holds\
    \ the place of the element name—for example,%Recipe.pfx;ingredient:\n\n```\n<ENTITY\
    \ % Recipe.qname \"%Recipe.pfx;recipe\" >\n<ENTITY % Recipe.ingredients.qname\
    \ \"%Recipe.pfx;ingredients\" >\n<ENTITY % Recipe.ingredient.qname \"%Recipe.pfx;ingredient\"\
    \ >\n<ENTITY % Recipe.prep.qname \"%Recipe.pfx;prep\" >\n```"
  merge: -1
  pgno: 279
- img_proc: true
  md: "# Creating the Module Using a DTD\n\nThe QNames sub-module is now complete.\
    \ It can be seen in it's entirety\nListing 15.1.\n\n**Listing 15.1:** recipe-qname-1.mod,\
    \ the QNames Sub-module for Our New XHTML Module\n\n![](img/a046e2e08ea170a8a111d9784d7fba9b_280_0.png)\n\
    \n```\n<!-- ............................................................ -->\n\
    <!-- Recipe Qname Module -->\n<!-- file: recipe-qname-1.mod -->\n    PUBLIC \"\
    -//WebGeek//ELEMENTS XHTML Recipe Qnames 1.0//\"\n    SYSTEM \"http://www.webgeek.com/DTs/recipe-qname-1.mod\"\
    \n\nxmlns:recipe=\"http://www.webgeek.com/xmlns/recipe\"\n\n<!ENTITY NS.prefix\
    \ \"IGNORE\" >\n<!ENTITY Recipe.prefix \"%NS.prefixed;\" >\n<!ENTITY Recipe.xmlns\
    \ \"http://www.webgeek.com/xmlns/recipe >\n<!ENTITY %Recipe.prefix \"recipe\"\
    \ >\n[\n%Recipe.prefix;;\n<!ENTITY Recipe.pfx \"%Recipe.pfx;\" >\n<!ENTITY Recipe.xmlns.extra.attr\n\
    \    xmlns:Recipe.prefix;               URI.datatype;       FIXED '%Recipe.xmlns;*'\
    \ >\n]]\n<!ENTITY Recipe.pfx \"* >\n<!ENTITY Recipe.xmlns.extra.attr \"*\">\n\
    <!ENTITY Recipe.qname \"%Recipe.pfx;qname\" >\n<!ENTITY Recipe.ingredients.qname\
    \ \"%Recipe.pfx;ingredients\" >\n<!ENTITY Recipe.ingredient.qname \"%Recipe.pfx;ingredient\"\
    \ >\n<!ENTITY Recipe.prep.qname \"%Recipe.pfx;prep\" >\n```\n\nNow it's time to\
    \ actually declare the elements and attributes that make up\nthis module using\
    \ the Declaration sub-module.\n\nThe sub-module begins with the same type of commented\
    \ section as the\nQname sub-module. Appropriate public and system identifiers\
    \ are\ndeclared, and the same namespace URI is given:\n\n```\n<!-- .................\
    \ -->\n<!-- WebGeek Recipe Module -->\n<!-- file: recipe-elements-1.mod -->\n\
    \    PUBLIC \"-//WEBGEEK//ELEMENTS HTML-WebGeek Recipe 1.0//EN\"\n    SYSTEM \"\
    http://www.webgeek.com/DTs/recipe-1.mod\"\nxmlns:recipe=\"http://www.webgeek.com/xmlns/recipe\"\
    \n```"
