- img_proc: true
  md: '# Building Blocks of a Basic DTD


    The vertical bar character between the two elements indicates that the doc-ment
    author has a choice of which to use, and the + occurrence indicator says that
    at least one of the elements must occur, though you can have more.


    # NOTE


    The occurrence indicator operates on the whole of the expression bound by the
    paren-the. When evaluating (th|td)+, it could be easier to work from the outside
    in. We could read that the tr element contain one or more elements, and those
    elements might be th or td.


    Content models can contain more than one of the indicators found in Table 13.2
    when the mix of elements becomes more complex. Consider the XHTML 1.0 Transitional
    declaration for the table element:


    ```

    <!ELEMENT table

    (caption?, (col|colgroup)*, the, tfoot, (tbody|tr)*)>

    ```


    There''s quite a lot going on, but we can take it piece by piece to fully understand
    the expression.


    First, the comma-delimited list of elements is known as a sequence. Each of the
    elements in the sequence must appear within the element being defined (except
    when modified by an occurrence indicator with a zero option).


    Reading left, the content model for table becomes:


    An optional caption element, one or more of the col or colgroup ele-ments if so
    desired, aad tfoot if desired, and finally at least one tbody element or at least
    one tr element.


    Looking closely, the only required elements are here a single tbody or tr element;
    all are optional.


    # CAUTION


    Before worrying about where the td elements are in this expression, think about
    what we''re defining: the elements that might be or are required to be contained
    within the table. The td element is not contained within the table element itself,
    instead, it''s contained within the tr element (which is the element contained
    within table). Because td is contained in something, it''s not mentioned here.
    Only the first level sub-elements are defined.


    # Creating Attributes


    Elements alone aren''t expressive enough to fill the needs of document authors.
    A secondary data structure, the attribute, is used to provide additional information
    about the individual element instance. A common


    ![](img/a046e2e08ea170a8a111d9784d7fba9b_240_0.png)'
