  md: '# Appendix A 339


    # Data Type Description


    Prev—Refers to the previous document in an ordered series of documents. Synonymous
    with Previous where supported.


    Contents—Refers to a document that serves as a table of contents. Synonymous with
    ToC where supported.


    Index—Refers to a document providing an index for the current document.


    Glossary—Refers to a document providing a glossary of terms used in the current
    document.


    Copyright—Refers to a document containing a copyright statement for the current
    document.


    Chapter—Refers to a document serving as a chapter in a collection of documents.


    Section—Refers to a document serving as a section in a collection of documents.


    Subsection—Refers to a document serving as a subsection in a collection of documents.


    Appendix—Refers to a document serving as an appendix in a collection of documents.


    Help—Refers to a document offering help (more information, links to other sources
    of information, and so on).


    Bookmark—Refers to a bookmark. A bookmark is a link to a key entry point within
    an extended document. The title attribute could be used to label the bookmark.
    Also, more than one bookmark might be defined in each document.


    MediaDesc


    The MediaDesc attribute is a comma-delimited list of media descriptors. The following
    list contains recognized descriptors:


    Screen—Intended for non-paged computer screens


    Ty—Intended for media using a fixed-pitch character grid, such as typesets, terminals,
    or portable devices within limited display capabilities


    TV—Intended for television-type devices (low resolution, color, limited scrolling)


    Projection—Intended for projectors


    Handheld—Intended for handheld devices (small screen, monochrome, bitmapped graphics,
    limited bandwidth)'
