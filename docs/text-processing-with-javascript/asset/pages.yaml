  md: "# Asserting the Start or End of a String with ^ and $\n\n# Task\n\nSuppose\
    \ you have an input field in your app that allows customers to enter their order\
    \ number and track their package. You want to ensure the user input is a number\
    \ before searching in your database. You are a bit familiar with regex, you know\
    \ that to match a digit with regex, you can use \\d. And to match one or more\
    \ digits, you can put a plus sign right after this like:\n\n```\npart_2/caret_and_dollar/cnd_ex1.js\n\
    const input = \"8751409\";\nfunction verifyDigits(input) {\n  const re = /\\d+/;\n\
    \  return re.test(input);\n}\n```\n\nverifyDigits(input); // true\nThis regex\
    \ matches \"8751409\" as you intended. But it also matches a string like \"123abc\"\
    \ or \"abc123abc\":\n\n```\npart_2/caret_and_dollar/cnd_ex2.js\nconst input =\
    \ \"abc123abc\"\nfunction verifyDigits(input) {\n  const re = /\\d+/;\n  return\
    \ re.test(input);\n}\n```\n\nverifyDigits(input); // true\nSo what happened here?\
    \ Your pattern tells the regex engine to match one or more digits, but it doesn't\
    \ tell it where. So, successfully matches the digits in the middle of the string\
    \ and returns true even though there are other non-matching characters in the\
    \ string.\n\nWhat you need is a way to specify the beginning and end of the string\
    \ in your regex so it won't match other characters."
