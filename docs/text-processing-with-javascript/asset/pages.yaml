  md: 'Chapter 2. Part II: Text Processing with Regular Expressions · 128


    # # Solution


    Use a positive lookahead denoted by (?= ...) to match the part of the string that
    you don''t want to include in the result:


    ```

    part_2/positive_lookahead/positive_lookahead_ex1.js

    const str = `The Company posted a September quarter record revenue of $90.3 million,
    up 8 percent per year.`;

    const re = /$(?=90\.3\million)/ig;

    // Replace only s with €

    str.replace(re, "$");

    // -> "The Company posted a September quarter record revenue \n of €98.3 million,
    up 8 percent per year.",

    ```


    With the (?...) syntax, you require a pattern to appear after the regex match
    without including it in the match.


    # # Discussion


    Lookaheads are non-capturing groups that allow us to match a pattern based on
    the substring that follows the pattern. For a positive lookahead to be successful,
    it must match a pattern followed by the pattern by subexpression.


    Notice the output of match() in the following code, which is only "S."


    ```

    part_2/positive_lookahead/positive_lookahead_ex2.js

    const str = "$90.3 million";

    const re = /$(?=90\.3\million)/;

    str.match(re)[0]; // -> "$"

    ```


    When using a lookahead, the subexpression is not included in the result. It also
    can''t be referenced with a backreference.


    There''s a workaround, though. If you place parentheses around the expression
    in the lookahead like (?=(regex)), you can capture the match in lookarounds, too.
    Wrapping the entire lookahead in parentheses won''t work because the capturing
    group wants to store the match, the lookahead will already have discarded it.


    Don''t confuse capturing and matching. The positive lookahead assertion (?= ...)
    and the non-capturing group (?: ...) serve different purposes. While both capture
    the substring they match, the non-capturing group includes the substring in the
    overall match, while the positive lookahead assertion does not.


    For example, if we rewrite the solution in here to substitute a non-capturing
    group for the lookahead assertion, the entire match gets replaced:


