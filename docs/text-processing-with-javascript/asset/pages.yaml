    # Reusing a Backreference


    > A backreference can be reused more than once. For example, (ha)\1\1 matches
    hahaha.


    > JavaScript doesn''t support forward references. A forward reference lets you
    reference a group that appears later in the regex.


    Take advantage of a backreference to refer to the exact text matched by a capturing
    group. You can reuse the content in the form of \1, \2, and so on, when using
    a normal capturing group. If you are using a named capturing group, you can also
    use the \<name> syntax.


