  md: '# Designing Data Governance from the Ground Up


    Businesses own more data than ever before, but it''s no value if you don''t know
    how to use it. Data governance manages the people, processes, and strategy needed
    for deploying data projects to production. But doing it is far from easy: Less
    than one of business leaders say their organizations are data driven. In Designing
    Data Governance from the Ground Up, you''ll build a cross-functional strategy
    to create roadmaps and stewardship for data-focused projects, embed data governance
    into your engineering practice, and put processes to monitor data after deployment.


    ![](img/eeb15adcfef82a304df42444e25add78_236_0.png)


    Lauren Maffeo

    (100 pages) ISBN: 9781680509809. 829.95


    https://pragprog.com/book/lmmiops


    # From Objects to Functions


    Build applications quicker with less effort using functional programming and Kotlin.
    Learn by building a complete application, from gathering requirements to delivering
    a microservice architecture following functional programming principles. Learn
    how to implement CQRS and EventSourcing in a functional way to map the data into
    code better and to keep the cost of change low for the application life cycle.


    If you''re curious about functional programming or you are struggling with how
    to put it into practice, this guide will help you increase your productivity composing
    small functions together instead of creating fat objects.


    ![](img/eeb15adcfef82a304df42444e25add78_236_1.png)


    Uberto Barbini

    (468 pages) ISBN: 9781680508451. 847.95


    https://pragprog.com/book/uboop'
