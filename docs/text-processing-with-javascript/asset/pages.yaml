  md: '# Chapter 2. Part II: Text Processing with Regular Expressions • 96


    but because regex treats $10 as a special replacement pattern, the result is unusable.


    You need a solution to take away the special meaning of $1 in $10, which has a
    corresponding capturing group in the pattern, and use the characters literally.


    # Solution


    Escape the dollar sign with another dollar sign:


    ```

    const str = "In our shops, tire change takes about 15 minutes.";

    const re = /b(tire change)/b;

    str.replace("$1 (which cost $$10 for each tire)");

    // "In our shops, tire change (which cost $10 for each tire)

    // about 15 minutes."

    ```


    Successful outcome! The dollar sign neutralizes the special meaning of $1, so
    the regex recognizes it as literal characters.


    # Discussion


    In this recipe, the regex has a single capturing group. But what happens if you
    try to replace to a group that doesn''t actually exist? If you type $2 in the
    replacement, it won''t correspond to anything. For example:


    ```

    const str = "In our shops, tire change takes about 15 minutes.";

    const re = /b(tire change)/b;

    str.replace("$1 (which cost $$20 for each tire)");

    // "In our shops, tire change (which cost $20 for each tire)

    // about 15 minutes."

    ```


    If you use a two-digit reference in the replacement string, the outcome will depend
    on the number of capturing groups in the pattern. If you have ten capturing groups
    and use $10, it refers to the tenth capturing group. If you have fewer capturing
    groups, $10 uses only the first digit that refers to the first capturing group
    and uses 0 as a literal replacement string. This is what happened in the first
    example in this recipe: "$1" in "cost $10" referenced "tire change" and "0" was
    treated as a literal character.


    The takeaway from this recipe is to use $0 to neutralize the special meaning of
    a replacement pattern.'
