  md: '# Looking For Whole Words Only with the Word Boundary (\b) • 69


    Same thing with the apostrophe: /\bcan|/ matches “I can’t do it” even though “can’t”
    is a contraction and in the English sentence:


    ```

    part_2/word_boundary/word_boundary_ex6.js

    const re = /\bcan|;

    re.test("I can''t do it"); // → true

    ```


    Accented characters are also considered word breaks (for a workaround), see

    Recipe 53, Matching Unicode Word Boundaries with the Unicode Property Escape,
    on page 139):


    ```

    part_2/word_boundary/word_boundary_ex7.js

    const re = /\bfiancé|/; // → true

    re.test("Fiancée");

    re.test("Fianee"); // → false

    ```


    You don''t have to put a pair of \b around words. You can use a single \b to match
    only one boundary:


    ```

    part_2/word_boundary/word_boundary_ex8.js

    const re1 = /\bgreen/;

    const re2 = /\green/;

    re1.test("evergreen"); // → false

    re1.test("greenhouse"); // → true

    re2.test("evergreen"); // → true

    re2.test("greenhouse"); // → false

    ```


    Notice that when you place \b at the start of the search string (\bgreen/) it
    finds words that start with “green” and when placed at the end (/green\b/) it
    finds words that end with “green”.


    # Using \B for Non-word Boundaries


    \B matches any position where \b does not (any non-word boundary) and so we say
    that \B is the negated form of \b. In regex, it''s a normal convention: lowercase
    and uppercase versions of the same letter being the opposite/negated forms of
    each other.


    \B matches a position where a character is followed or preceded by the same type
    of character, such as between two space characters or two letters. It is an example:


    ```

    part_2/word_boundary/word_boundary_ex9.js

    const re = /\green\B/;

    re.test("greenhouse"); // → true

    re.test("green bay"); // → false

    ```'
