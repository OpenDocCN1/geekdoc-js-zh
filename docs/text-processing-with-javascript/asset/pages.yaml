  md: "# Solution\n\nUse the following function:\n\n```\npart/1/generating_html_table_v2/html_table_v2_ex1.js\n\
    const data = [\n{quarter: \"Q1 FY22\", revenue: 45962, netIncome: 20820, eps:\
    \ 2.71},\n{quarter: \"Q2 FY22\", revenue: 44845, netIncome: 20610, eps: 2.71},\n\
    {quarter: \"Q3 FY22\", revenue: 46151, netIncome: 16027, eps: 2.03},\n{quarter:\
    \ \"Q4 FY22\", revenue: 46822, netIncome: 16244, eps: 2.11},\n{quarter: \"Q1 FY23\"\
    , revenue: 45215, netIncome: 20256, eps: 2.64}\n];\nconst headers = [\n\"Quarter\"\
    ,\n\"Revenue (in millions of US dollars)\",\n\"Net Income (in millions of US dollars)\"\
    ,\n\"Earnings per Share (EPS)\"\n];\n```\n\n```\nfunction createTable(data, headers)\
    \ {\n  const table = document.createElement(\"table\");\n  const head = table.createTHead();\n\
    \  const tbody = table.createTBody();\n  const headerRow = head.insertRow();\n\
    \n  // Create table head\n  headers.forEach(header => {\n    const th = document.createElement(\"\
    th\");\n    th.innerText = header;\n    headerRow.appendChild(th);\n  });\n\n\
    \  // Create table body\n  data.forEach(data => {\n    const row = tbody.insertRow();\n\
    \    Object.values(data).forEach(value => {\n      const cell = row.insertCell();\n\
    \      cell.innerText = value;\n    });\n  });\n  document.body.appendChild(table);\n\
    }\n```\n\nWhen we call this function with the data array as the argument, it generates\
    \ an HTML table displaying the company's financial performance data. The output\
    \ will look like the table on page 28 after applying some basic styling."
