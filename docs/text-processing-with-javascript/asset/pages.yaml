  md: '# Implementing Regex in JavaScript


    There are several ways to implement regular expressions in JavaScript. In this
    book, we''ve mostly worked with test(), match(), and replace(). But JavaScript
    also provides methods such as exec(), search(), matchAll(), replaceAll(), and
    split() that you should be aware of.


    While some of these methods belong to RegExp object, others are properties of
    the String object. Knowing the difference between these tools and when to use
    each enables you to write programs that are more compact and more efficient.


    # test()


    The test() method returns a Boolean indicating whether or not a pattern exists
    in the given string. For example, the following pattern checks if the string contains
    the substring "day":


    ```

    appendix/methods/methods_ex8.js

    const str = "12 days";nconst re = /day/;

    console.log(re.test(str)); // → true

    ```


    Some regular expression methods as test() and exec() use the value of lastIndex
    as the starting position to begin searching the string. If the match succeeds,
    test() returns true and updates the lastIndex property of the regular expression
    object. Here''s an example:


    ```

    appendix/methods/methods_ex9.js

    const str = "10, 20, 30";

    const re = /\d/\d/; // Match two consecutive digits

    console.log(re.test(str)); // → true

    console.log(re.lastIndex); // → 2

    ```'
