    \ fraction components:\n\n```\npart_3/matching_floating_points/fp_ex1.js\nfunction\
    \ extractFloatingPoint(str) {\n  const re = /[-+]]?\\d*\\.\\d+;\n  return str.match(re)[0];\n\
    }\n```\n\nextractFloatingPoint(\"It's -4.19 today.\");\n// -> \"-4.19\"\n\nMission\
    \ accomplished!\n\n# Discussion\n\nIn the first pattern, we use square brackets\
    \ to create a character class that matches either a sign (+) or a minus sign (-),\
    \ followed by one or more digits (\\d+), followed by a literal period (.). This\
    \ matches a floating point numbering a question mark after the character class.\
    \ Similarly, replacing the plus sign with an asterisk allows for integer digits\
    \ repetition for zero or more digits instead of one or more.\n\nIn the example,\
    \ we're verifying if a floating-point number exists within a larger body of text.\
    \ But, if you want to verify whether the entire input is a floating-point number,\
    \ you should use the ^ and $ boundaries.\n\nRecipe 69\nMatching Formatted Numbers\
    \ with Thousand Separators\n\n# Task\n\nSuppose you are developing a price comparison\
    \ app to assist users in comparing product or service prices across various online\
    \ retailers. Since prices"
