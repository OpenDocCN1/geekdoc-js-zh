    # Table of Groups


    | Metacharacter | Meaning |

    | :--- | :--- |

    | ( ) | Capturing group |

    | (?: ) | Non-capturing group |

    | (?= ) | Positive lookahead |

    | (! ) | Negative lookahead |

    | (?<= ) | Positive lookbehind |

    | (?<! ) | Negative lookbehind |


