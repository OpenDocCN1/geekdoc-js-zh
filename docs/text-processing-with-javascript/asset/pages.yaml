  md: '# Modifying an Existing Regex Literal


    # Task


    Suppose you want to take your teammate''s regular expression literal and modify
    it for use in another part of the code. You don''t want to alter the original
    regex because it has passed all tests for the job it was intended for.


    You need a solution that enables you to modify a copy of an existing regex literal.


    # Solution


    Use the source and flags to retrieve the original regex parts. And construct a
    new RegExp object with those parts:


    ```

    part_2/modifying_regex/modifying_regex_ex1.js

    // Pattern to match a filename with .png extension

    const origRegex = /\b|\w+\.png\b/;

    // Pattern to match a filename with .png or .PNG extension

    const newRegExp = new RegExp(origRegex.source, origRegex.flags + "i");

    ```


    Horay! You have successfully added the flag to the regex pattern.


    # Discussion


    JavaScript provides the flags property for reading all flags used in a regex:


    ```

    part_2/modifying_regex/modifying_regex_ex2.js

    const rel = /\b|\w+\.png\b/igu;

    const re2 = /\b|\w+\.png\b/;

    console.log(rel.flags); // -> gui

    console.log(re2.flags); // -> ""

    ```


    Notice how the order of flags changes when reading them. always orders the order
    of the original pattern and lists them in a fixed order: "gumy". If the pattern
    has no flags, the return value will be an empty string,


    Similarly, the source property gets the pattern enclosed between the forward slashes:'
