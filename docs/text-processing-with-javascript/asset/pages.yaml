  md: "# Discussion\n\nfilter() method takes a function as an argument and executes\
    \ it for each element of an array—similar to forEach and map(). The function you\
    \ supply should be a predicate (a function that returns true or false). filter()\
    \ will add an element to the resulting array only if the return value of predicate\
    \ is true.\n\nWhen using the filter() method in JavaScript, it's important to\
    \ remember that it skips over missing elements in arrays. For example, if you\
    \ have an array with gaps as [0, 1, ., 4, 6], you can take advantage of filter()\
    \ to get rid of the missing elements like:\n\n```\nconst sparseArr = [0, 1, .,\
    \ 4, 6];\nsparseArr.filter(() => true); // -> [0, 1, 4, 6]\n```\n\nHere we use\
    \ an arrow function that always returns true. Since filter() skips gaps, the new\
    \ array won't be sparse.\n\nIf your array has undefined and null elements, you\
    \ can remove them with filter()\n\n```\nconst sparseArr = [0, 1, ., null, 4, 6];\n\
    sparseArr.filter(x => x != undefined && x != null); // -> [0, 1, 4, 6]\n```\n\n\
    In this code, we use the strict inequality operator (!==) to return only if the\
    \ element is not null or undefined.\n\nWhen it comes to performance optimization,\
    \ you should take into account the size of your objects and the number of times\
    \ you'd need to get their intersection. If your first object has 1000 properties\
    \ and your second object has 50, it will run faster if you get the keys of the\
    \ object with fewer properties and then filter it, not the other way around.\n\
    \nWith this in mind, let's rewrite our intersection function:\n\n```\npart/intersecting_tables/filter.exjs\n\
    function intersection(obj1, obj2) {\n  const k1 = Object.keys(obj1);\n  const\
    \ k2 = Object.keys(obj2);\n  const [first, next] = k1.length > k2.length ? [obj1]\
    \ : [k1, obj2];\n  return first.filter(key => key in next);\n}\n```\n\nNotice\
    \ how we used ternary operator on the right hand of the destructuring assignment\
    \ to compare the length of objects and assign the one with fewer properties to\
    \ first (line 4). Destructuring enables us to extract values and assign them to\
    \ variables using a syntax that is similar to array literals. On"
  merge: -1
  pgno: 35
- img_proc: true
  md: "the right side of the assignment is the data to be destructured. On the left\
