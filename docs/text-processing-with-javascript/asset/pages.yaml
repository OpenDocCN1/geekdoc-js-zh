  md: "Chapter 1. Part I: Text Processing with Built-in JavaScript Methods • 38\n\n\
    In some countries, other symbols or characters are used as the thousand separator.\
    \ For example, the Indian numbering system uses a comma-separator called a \"\
    separator\" to separate groups of digits. While the Chinese and Japanese numerical\
    \ systems use different characters to represent thousands, millions, and other\
    \ large numbers.\n\nGenerally, numbers that are less than 1000 don't need separators.\
    \ Also, numbers in scientific notation, postal codes, and phones do not require\
    \ separators for clarity. As a result, documents and data that consist of numbers\
    \ may not be suitable for automatic comma inclusion.\n\nThe solution in this recipe\
