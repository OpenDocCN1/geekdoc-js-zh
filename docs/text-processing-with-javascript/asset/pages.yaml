  md: '# Two Separate Families


    test() and exec() are properties of the RegEx object, so you should call them
    as a method of a regular expression. Conversely, match(), matchAll(), replace(),
    replaceAll(), split(), and search() are properties of the String object, and you
    should call them on a string.


    # match()


    The match() method returns an array similar to exec(). You may have already noticed
    the similarity between these two methods. Consider this example:


    ```

    appendix/methods/methods_ex4.js

    const str = "About 100ft"

    const re = /(\d+)/ft;


    console.log(str(re));

    // -> ["100ft", "100", index: 6, input: "About 100ft", groups: undefined]

    console.log(exec(str));

    // -> ["100ft", "100", index: 6, input: "About 100ft", groups: undefined]

    ```


    exec() and match() return the same result. The output differs only when you use
    the global flag:


    ```

    appendix/methods/methods_ex5.js

    const str = "9ft, 10ft, 11ft"

    const re = /\(\d\)ft/g;


    console.log(str.match(re));

    // -> ["10ft", "11ft"]

    nconsole.log(exec(str));

    // -> ["10ft", "10ft", index: 5, input: "9ft, 10ft, 11ft", groups: undefined]

    ```


    With the global flag, match() returns an array containing the matched substrings
    and won''t include capturing groups, index, and other properties.


    Keep in mind that, by default, match() ignores the value set for lastIndex. To
    be able to specify the starting position of a search, you have to use the sticky
    flag (see Recipe 44, Searching from a Specific Index with the y Flag, on page
    119).


    # matchAll()


    The matchAll() method is similar to match() except when you set the global flag
    (g), which causes the method to provide additional information about the matches
    as capturing groups and index positions:'
