    }\n```\n\n```\nconsole.log(msg + getFormattedList(\"en\", topPlayers));\n// Congratulations\
    \ to this week's winners: Kraken, Boss99, and Ninja\n```\n\nThis function returns\
    \ a formatted string representation of the array items based on the specified\
    \ language.\n\n# Browser Compatibility\n\n> Support for ListFormat was added in\
    \ Safari 14.1 on macOS and Safari 14.5 on iOS.¹³ So, all other modern browsers\
    \ support ListFormat, users who haven't updated their browsers for a while won't\
    \ be able to run your app. For maximum compatibility, use this API with polyfill.¹⁴\
    \ or on the server side (available since Node 13.0.0).\n\n# Discussion\n\nThe\
    \ ECMAScript Internationalization API enables us to develop applications that\
    \ can adapt to different languages. To access this API, we use the Intl namespace.\
    \ In the example, we used the Intl.ListFormat() constructor of the API, which\
    \ provides a straightforward way to format lists in a way that is culturally appropriate.\n\
    \nWe begin by creating a function getFormattedList() that takes two arguments:\
    \ lang and arr. lang is a BCP 47 language that represents the language\n\n+  \
