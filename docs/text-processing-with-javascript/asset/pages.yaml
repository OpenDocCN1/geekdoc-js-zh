  md: '# Discussion


    Designing web forms has been challenging for programmers. Although coding the
    form itself is straightforward, verifying every input has a logical and acceptable
    value poses a greater difficulty, and communicating issues to the user can be
    a headache. Client-side form validation helps users identify and correct errors
    in their form submissions


    But, it''s important to understand that relying on client-side validation may
    not provide comprehensive security. To ensure maximum security, your applications
    must perform security checks on data from both the server-side and client-side.
    Regex is often the preferred tool for programmers to perform that task.


    In most cases, the regex patterns you come across on the internet are excessively
    limiting for email address verification. Some developers recommend checking the
    input to conform to the RFC 5322 standard. RFC 5322 defines the structure and
    syntax of email messages, which indicates the email addresses.¹


    To do that, you will need a regex like this:


