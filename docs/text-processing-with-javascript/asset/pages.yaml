  md: '# Preface


    Most popular programming languages support regular expressions, and there''s a
    good reason for that: regular expressions are incredibly powerful at text processing.
    With regular expressions, you can greatly reduce the time and effort required
    for complex string parsing tasks that would otherwise take dozens of lines of
    code.


    But, as a JavaScript developer, you may not need to jump into writing regular
    expression patterns whenever you need to process texts. JavaScript already provides
    excellent built-in tools that meet any of your text manipulation needs.


    In this book, you''ll explore when and how to use each tool by working through
    real-world scenarios. You''ll learn the mechanics of JavaScript''s regex in detail
    via cookbook-style recipes for various text manipulation tasks.


    Make sure you actually type and execute the code examples as you follow along
    in the book. Some examples may appear simple, but there''s a big difference between
    reading the code and being able to write it on your own.


    # Who Is This Book For?


    This book is geared towards the needs of both client- and server-side programmers.
    Whether you''re a beginner or an advanced programmer, this guide will save you
    a ton of time when dealing with textual data. We''ll focus squarely on the practical
    aspects of text processing with JavaScript—that is, each technique is designed
    to accomplish and how to use it in your program.


    Readers who have experience with regular expressions will still benefit from this
    book as it contains a wealth of detail on JavaScript''s regular expression flavor
    as well as features recently introduced. By the end of this book, you will be
    able to solve great many complex validation, modification, and search-and-replace
    problems rapidly and efficiently.'
