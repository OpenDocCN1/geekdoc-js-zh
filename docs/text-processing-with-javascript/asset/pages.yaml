  md: '# Searching from a Specific Index with the y Flag


    # Task


    Let''s say your task is to take the transcript of a conference and organize it
    in a way that can be read like an article. Suppose the transcript is like this:


    <p>2:05 pm: We also improved durability, which is another essential aspect of
    our products.</</p>


    <p>2:10 pm: It has our most crack resistant crystal, thanks to a stronger and
    more robust geometry.</</p>


    <p>2:15 pm: It''s also our first product to have IP66 certification, so you don''t
    have to worry wearing it in dusty environments.</</p>


    And you want to remove the timestamps and extra <p></p> tags, and join the sentences
    like this:


    <p>We also improved durability, which is another essential aspect of our products.
    It has our most crack resistant crystal, thanks to a stronger and more robust
    geometry. It''s also our first product to have IP66 certification, so you don''t
    have to worry about wearing it in dusty environments.</</p>


    The data you want to extract has a fixed structure: a string in a pair of HTML
    tags and a timestamp that''s always eight characters long. So, you just need to
    retrieve the characters from index 9 onwards.


    # Solution


    Use the sticky flag (y) to match the target string only from the index you specify
    with the lastIndex:


    ```

    part 2/flag_sticky/sticky.ex1

    const re = /+/ys;

    re.lastIndex = 9;

    const str = ''2:05 pm: We also improved durability, which is another essential
    aspect of our products.'';

    nconsole.log(str.match(re)[0]);

    // We also improved durability, which is another essential aspect of // products.

    ```'
