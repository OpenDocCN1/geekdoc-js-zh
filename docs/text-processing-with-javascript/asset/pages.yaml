  md: "often include thousand separators, you find yourself in need of a regex pattern\n\
    that can accurately detect numbers with thousand separators.\n\nSo, if a website\
    \ lists the product like this:\n\nGreat deal! $7,499 %20 Price drop\n\nYour regex\
    \ should be able to extract 7,499.\n\n# Solution\n\nTo extract numbers with thousand\
    \ separators, you can use this function:\n\n```\npart_3/matching_thousand_separators/matching_thousand_separators_ex1.js\n\
    function extractNumbers(str) {\n  const re = /\\d{1,3}(?:,\\\\d{3})*(?:\\.\\\\\
    d+)?/g;\n  return str.match(re);\n}\n\nextractNumbers(\"Great deal! $7,499 %20\
    \ Price drop\");\n// -> \"7,499\"\n```\n\nThe regex pattern in this code matches\
    \ numbers that use the comma as\nthe thousand separator and the dot as the decimal\
    \ separator. Matching\nfraction part is optional, but if the fraction is not present,\
    \ then\ndecimal point should not be included.\n\n# Discussion\n\nNumbers with\
    \ a large number of digits are often separated into groups using\ndeimiter like\
    \ a comma or a period—to make them easier to read. Typically.\nEnglish-speaking\
    \ countries use commas as the delimiter, such as 20,000,\nwhile European countries\
    \ use periods or spaces, like 20.000 or 20 000.\n\nThe pattern in this recipe\
    \ starts by matching a sequence of 1 to 3 digits,\nsucceeded by a group that matches\
    \ zero or more occurrences of a comma\nfollowed by three digits. The combination\
    \ of these two patterns matches any\nnumber with one or more groups of three digits\
    \ separated by commas. To\nallow the fraction part to be optional, we just add\
    \ a question mark after the\ngroup.\n\nLet's examine the regex pattern step by\
    \ step:\n\n```\n/\\d{1,3}(?:,\\\\d{3})*(?:\\.\\\\d+)?/\n```\n\n+   - \\d matches\
    \ a digit\n  - {1,3} matches the previous token between 1 and 3 times"
