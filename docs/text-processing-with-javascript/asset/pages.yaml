  md: "Chapter 3. Part III: Mastering Text Processing in JavaScript • 178\n\n# Recipe\
    \ 70\n\n# Matching Nearby Words\n\n# Task\n\nSuppose you want to search for the\
    \ term \"client-side\" in a tutorial database because you've been asked to assess\
    \ whether client-side issues are sufficiently covered for new hires. If you write\
    \ a regex that matches only the exact word, it would be unable to retrieve results\
    \ for instances that contain the words \"client\" and \"side\" without being adjacent\
    \ to each other. For example, tutorials with phrases like \"client- and server-side\"\
    \ or \"client and server-side\" would not be included in the search results.\n\
    \nBut if you specify a proximity search for the words, where they appear within\
    \ a certain number of characters of each other, it will help you to find more\
    \ relevant results. So, what you need is to create a pattern that can locate words,\
