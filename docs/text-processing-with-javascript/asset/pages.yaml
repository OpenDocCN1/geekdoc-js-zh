  md: 'You could use several character classes matching a range between 00 to 40,

    42 to 65, 66 to 76, and 78 to 99. But you''d end up with a very long and

    complicated pattern. Fortunately, there''s a more compact way to get the

    result with lookahead assertions.


    # Solution


    Use a negative lookahead assertion denoted by (!? ...):


    ```

    part_2/negative_lookahead/negative_lookahead_ex1.js

    const re = /(!(41|66|77))d{2}/;

    re.test("#60"); // true

    re.test("#39"); // true

    re.test("#41"); // false

    re.test("#66"); // false

    re.test("#77"); // false

    re.test("#98"); // true

    ```


    A negative lookahead matches a pattern not followed by another pattern.

    in this code, the negative lookahead ensures that the string following "#" isn''t

    "41", "66", or "77".


    # Discussion


    Negative lookahead is a type of non-capturing group denoted by the syntax

    (! ...), where the ... represents the pattern that should not be present imme-

    diate after the current position in the string.


    Let''s examine how the engine interprets the regex /#(?!(41|66|77))d{2}/ when

    applied to the string "#39":


    ```

    #39

    |

    # matches a hash sign literally.

    #39

    |

    (!41|66|77)) successfully matches a string that isn''t 41, 66, or 77.

    The pointer remains at #.

    #39

    |

    \d matches a digit.

    #39

    |

    \d matches a digit.

    ```'
