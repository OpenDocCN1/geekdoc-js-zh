    \ group (?<dup>[\\w]+) and references the group with \\<dup>. For more on capturing\
    \ groups, see Recipe 33, Reading Groups with Ease Using Named Capturing Groups,\
    \ on page 89.\n\nOne difference between JavaScript’s regular expression flavor\
    \ and other flavors is how it handles backreference. Unlike most favor, JavaScript\
    \ doesn’t distinguish between a backreference to a capturing group that matched\
    \ nothing, and a backreference to a capturing group that didn't participate in\
    \ the match.\n\nLet me clarify with a simple example: the regex /(?)cat[1]/ matches\
    \ the string \"cat,\" \"-cat,\" or \"-cat-\\. In JavaScript, this pattern is equivalent\
    \ to /(-?)cat[1]/. But that’s different from most other regex flavors.\n\nHere’s\
    \ how the regex engine in JavaScript processes /(?)cat[1]/ when applied to the\
    \ string \"cat\". First, the regex engine matches to a hyphen (literally) and\
    \ successfully matches nothing (recall that ? is a metacharacter that matches\
    \ zero or one occurrence of the preceding character).\n\nThe next character in\
    \ the string is the letter c, and the engine successfully matches it. The engine\
    \ also matches the next characters: a and finally. \\1 successfully matches the\
