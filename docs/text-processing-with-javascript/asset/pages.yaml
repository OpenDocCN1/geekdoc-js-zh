  md: '# Looking For Whole Words Only with the Word Boundary(\b) • 67


    Regex also comes with a syntax for matching whole words: \b. This syntax, along
    with ^ and &, are known as *boundaries*. The next recipe tells you all about the
    word boundary (\b).


    # Recipe 25


    # Looking For Whole Words Only with the Word Boundary (\b)


    # Task


    Say you want to look for the word "green" in a document. You try using includes()
    method, but it matches other words containing "green" too, such as "greenhouse"
    and "evergreen":


    ```

    part_2/word_boundary/word_boundary_ex1.js

    const str1 = "We must reduce the emissions of greenhouse gases;"

    const str2 = "An evergreen plant has leaves for the whole year;";


    str1.includes("green") // true

    str2.includes("green") // true

    ```


    Adding a space around "green" doesn''t cut it because the word might be followed
    by a comma, appear before/after a newline character, or come at the beginning/end
    of a sentence, and so on:


    ```

    part_2/word_boundary/word_boundary_ex2.js

    const str = "Blend together yellow and blue paint to make green.";

    str.includes("green") // false

    ```


    You need a solution that matches "green" only if it''s a separate word.


    # Solution


    Place a \b and after "green" in the regex pattern to exclude other words:


    ```

    part_2/word_boundary/word_boundary_ex3.js

    const re = /\bgreen\b/;

    const str1 = "We must reduce the emissions of greenhouse gases."

    const str2 = "An evergreen plant has leaves for the whole year.";

    const str3 = "Blend together yellow and blue paint to make green.";


    re.test(str1); // false

    re.test(str2); // false

    re.test(str3); // true

    ```'
