  md: "```\nfunction extractQuotes(str) {\n  const re = /\"([^\"]*)\"/g;\n  const\
    \ quotes = [...str.matchAll(re)].map(value => value[1]);\n\n  return quotes;\n\
    }\n\nextractQuotes(str);\n// -> [\"The Rock\", \"Scarjo\", \"Coop\", \"Nitro\"\
    , \"Sticks\", \"Weasel\"]\n```\n\nThis function returns an array of quoted text\
    \ without including the quotes in the result.\n\n# # Discussion\n\nDouble quotes\
    \ don't have a special meaning in regular expressions. Next, we use [^] to match\
    \ anything that is not double quotes, and append a * to repeat the class zero\
    \ or more times. The pattern ends in a * to match the closing double quotes.\n\
    \nTo retrieve the capturing groups of all matches, we use the matchAll() method.\
    \ Because matchAll() returns an iterator, we can use the spread syntax (...) to\
    \ unpack the iterator and generate an array from the outcome. This way we can\
    \ use array methods on it.\n\nSince we have a capturing group in the regex pattern,\
    \ each match result contains an array with two elements: the entire matched substring\
    \ and the content inside the quotes. By using value[1], we access the second element\
    \ of the array, which corresponds to the content inside the quotes. We store them\
    \ in the quotes array.\n\nMatching a string enclosed in single quotes can be slightly\
    \ more challenging as the text within the quotes may contain an apostrophe, such\
    \ as in ‘can't.’ The next recipe provides a solution for extracting text enclosed\
    \ in single quotes."
