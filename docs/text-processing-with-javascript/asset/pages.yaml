  md: 'UTF is the abbreviation of Unicode Transformation Format, and the number following
    it indicates the number of bits used to encode each character. The 8-bit format
    of Unicode is the most common character encoding on the web. It was designed not
    only to represent standard Unicode characters but also to be backward compatible
    with ASCII. The ASCII characters are the first 128 code points in Unicode (UTF-8).


    Therefore, an ASCII text is also considered a Unicode text. It is a superset of
    all characters in use today because it includes characters from various international
    standards, as well as important industry standards. UTF-16 represents characters
    using one or two-bit integers. Most of the characters in major languages can be
    represented using one-16-bit unit.


    These characters, known as Basic Multilingual Plane (BMP), are encoded in the
    first 65,536 code points and 2 bytes per character. Any character beyond BMP is
    called a supplementary character and cannot be represented in just 16 bits. Supplementary
    characters need a pair of 16-bit surrogate code units and are encoded in 4 bytes.
    Unicode allocates 2,048 code points as surrogate code points for UTF-16.


    For UTF-8, 1 byte is used to represent characters in ASCII, 3 bytes for the rest
    of the BMP, and 4 bytes for supplementary characters, UTF-32 is a fixed-width
    encoding using 4 bytes for all characters — unlike UTF-8 and UTF-16, which represent
    each code point by a variable number of values.


    Unicode code points are usually represented in hexadecimal notation and prefixed
    with U+. The range between U+0000 and U+FFFF represents characters, five or six
    digits are used to represent code points, and the range is between U+10000 and
    U+1FFFF.


    The characters you see on computers are actually binary data consisting of a series
