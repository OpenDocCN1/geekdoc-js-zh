  md: '# APPENDIX 1


    # # What Is Unicode?


    Throughout this book, you''ll encounter the word "Unicode" in several recipes.
    So, what exactly is Unicode?


    Unicode is an encoding system that provides a consistent way of encoding, processing,
    and displaying written texts. Put simply, an encoding system assigns numbers to
    characters, which can then be translated into binary language used by computers.


    Unicode is implemented in all modern operation systems and programming languages.
    And it plays an increasingly important role in the JavaScript language. Prior
    to the invention of Unicode, there were hundreds of different character encoding
    systems, most of which were severely limited in size and scope incompatible with
    one another.


    The most widely used character encoding system besides Unicode is ASCII. American
    Standard Code for Information Interchange (ASCII) was published in 1963 as a standard
    for electronic communication. ASCII is based on a seven-bit byte, with each byte
    representing a character, capable of encoding 128 characters, including lowercase
    letters a-z, uppercase letters A-Z, digits 0-9, and punctuation symbols.


    In addition, 33 non-printing control signals are set aside for Teletype machines,
    most of which are now obsolete. Because ASCII is an American standard designed
    for transmitting English characters, it cannot represent characters from other
    languages. As computers became more prevalent in other parts of the world, other
    encoding systems were invented to represent characters in other languages.


    Over time, the need to support new languages led to the creation of hundreds of
    conflicting ways to encode characters. These encoding systems were not only inconsistent
    but also incomplete: two encodings could encode the same'
  merge: -1
