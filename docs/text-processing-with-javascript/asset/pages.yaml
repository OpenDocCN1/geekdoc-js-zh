  md: '# # A Common-Sense Guide to Data Structures and Algorithms in Python, Volume
    1


    If you thought data structures and algorithms were all just theory, you''re missing
    out on what they can do for your Python code. Learn to use Big O notation to make
    your code run faster by orders of magnitude. Choose from data structures such
    as tables, trees, and graphs to increase your code''s efficiency exponentially.
    With simple language and clear diagrams, this book makes this complex topic accessible,
    no matter your background. Every chapter features practices to give you the hands-on
    information you need to master data structures and algorithms for your day-to-day
    work.


    ![](img/eeb15adcfef82a304df42444e25add78_235_0.png)


    (502 pages) ISBN: 9788886650356.857.95

    https://prag.com/book/jwpython


    # # Text Processing with Ruby


    Whatever you want to do with text, Ruby is up to the job. No matter what the source
    - web pages, databases, the contents of files - learn how to acquire the text
    and get it into your program. Explore techniques to process text and then output
    the transformed or extracted text. Cut even the most complex-based tasks down
    to size and learn how to master regular expressions, scrap information from Web
    pages, develop reusable utilities to process text in pipelines, and more.


    ![](img/eeb15adcfef82a304df42444e25add78_235_1.png)


    (272 pages) ISBN: 9781680500770. 836

    https://prag.com/book/rmtruby'
