  md: '# What You Should Know


    To use this book, you should already know basic JavaScript, HTML, and CSS syntax.
    Use of HTML and CSS will be infrequent and fairly basic, and I''ll explain each
    JavaScript example in detail. So if your knowledge is rusty, you''ll understand
    how the code works.


    To run the examples, you''ll need a JavaScript environment that supports the newest
    version of the ECMAScript standard (ECMAScript is the official standard that defines
    the specification of JavaScript). So, whether you''re running the examples in
    your browser''s console or the Node.js environment, make sure you have the latest
    software version installed.


    Certain recipes use APIs that are only available in the browser environment, such
    as fetch().). As a result, you can run those recipes only in a browser. We''ll
    warn you about the lack of browser /environment support whenever necessary.


    # What''s in This Book?


    We''ve organized the book as a cookbook, so you can quickly jump to different
    recipes. But if you read the book to cover it, you''ll become a master chef of
    text processing. There are three primary parts in this book:


    +   - Part 1 contains recipes that solve various text processing problems with
    JavaScript''s built-in methods.

    - Part 2 covers JavaScript''s favor of regex, provides an in-depth discussion
    of the syntax, and gives various examples of them.

    - Part 3 provides solutions to a wide range of retrieval and alteration tasks.
    These recipes will give you the helping hand you need to become a regular expression
    expert.


    # Online Resources


    To download the example code used in the book, please visit the Pragmatic Bookshelf
    website. You can submit feedback and errata entries, get up to date information,
    and join in the discussions on the book''s forum page. If you''re reading the
    book in PDF format, you can view or download a specific example by clicking on
    the little gray box above the code.


    +   1. https://pragprog.com/titles/javascript/text-processing-with-javascript/#resources'
