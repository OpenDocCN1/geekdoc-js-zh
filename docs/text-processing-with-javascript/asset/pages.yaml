  md: '# Syntax


    | Syntax | Description |

    | --- | --- |

    | x* | Matches zero or more occurrences of the preceding character. |

    | x+ | Matches one or more occurrences of the preceding character. |

    | x? | Matches zero or one occurrence of the preceding character. |

    | x(n) | Matches exactly n occurrences of the preceding character. |

    | x{n.} | Matches at least n occurrences of the preceding character. |

    | x[n,m] | Matches between n and m occurrences of the preceding character (inclusive).
    |

    | x*? | Lazy quantifier: matches the shortest possible sequence of characters
    in a string that satisfies a given pattern. |

    | x+? | |

    | x?? | |

    | x(n)? | |

    | x{n.}? | |

    | x[n,m]? | |


    # Boundary Assertions


    | Syntax | Description |

    | --- | --- |

    | ^ | Matches the beginning of a string. |

    | $ | Matches the end of a string. |

    | \b | Matches a word boundary. |

    | \B | Matches a non-word boundary. |


    # Lookaround Assertions


    | Syntax | Lookaround Type | Description |

    | --- | --- | --- |

    | x(?=y) | Positive Lookahead | Matches "x" only if followed by "y". |

    | x(!y) | Negative Lookahead | Matches "x" only if not followed by "y". |

    | (?<=y)x | Positive Lookbehind | Matches "x" only if preceded by "y". |

    | (?<!y)x | Negative Lookbehind | Matches "x" only if not preceded by "y". |'
