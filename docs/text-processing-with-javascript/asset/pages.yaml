    Which one of these matches represents minutes? And which one represents seconds?
    Using a more expressive syntax to group the segments can greatly reduce the chances
    of encountering issues in your code.


    # # Solution


    Use named capturing groups:


    ```

    part_2/named_capturing_group/ncg_ex2.js

    const re = /(?<hour>\d{2}):(?<min>\d{2}):(?<sec>\d{2})s(?<period>\w{2})/;

    const match = "09:30:00 AM".match(re);


    console.log(match.groups.hour);   // -> 09

    console.log(match.groups.min);    // -> 30

    console.log(match.groups.sec);    // -> 00

    console.log(match.groups.period); // -> AM

    ```


    A named capturing group uses a more extended syntax in the form of (?<name>...).
    Patterns with multiple capturing groups can be read and edited with less difficulty.


    # # Discussion


    Named capturing groups is a syntax introduced in ES2018. A valid capturing group
    name must be an alphanumeric sequence starting with a letter. To avoid name collision
    with existing property names, JavaScript assigns all named groups to a separate
    object called groups.


    If a pattern has an optional capturing group that does not participate in the
    match, it will still create a property for that group on the groups object. Let''s
    make the last capturing group in our code optional by placing a question mark
    after it to see what happens:


    ```

    part_2/named_capturing_group/ncg_ex3.js

    const re = /(?<hour>\d{2}):(?<min>\d{2}):(?<sec>\d{2})s?(?<period>\w{2})?;

    n// A timestamp without AM/PM

    const str = "09:30:00";

    const match = str.match(re);

    ```


