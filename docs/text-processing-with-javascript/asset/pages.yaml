  md: "# Determining Letter Case with charAt()\n\n# Task\n\nConsider a scenario where\
    \ you have a form that requests the user to enter their nickname. Some users may\
    \ prefer to enter their nickname in lowercase letters, so your app shouldn't automatically\
    \ capitalize the nickname. But perhaps some users are casual about typing and\
    \ intend for their name to be capitalized.\n\nIn such cases, you want to notify\
    \ the user that their nickname will be stored and displayed exactly as entered.\
    \ Your app needs be capable of identifying the letter case of the first character\
    \ of the nickname.\n\n# Solution\n\nUse the strict inequality operator (!=) to\
    \ compare the first character (index) of the string to its lowercase version.\
    \ If they are not equal, that means the string starts with a capital letter:\n\
    \n```\npart_1/determining_letter_case/charAt_ex1.js\nfunction isCapital(str) {\n\
    \  return str.charAt(0) !== str.charAt(0).toLowerCase();\n}\n```\n\n```\nisCapital(\"\
    Dave\") // true\nisCapital(\"dave\") // false\n```\n\nSuccess! You are now able\
    \ to determine the letter case of the first character of a word.\n\n# Discussion\n\
    \nThe function in this recipe returns true if the first character of the input\
    \ string is in uppercase and false otherwise. To get the first letter of the input\
    \ string, we use the charAt() method. This method takes an index number as an\
    \ argument and returns the character at the given position in a string. For instance,\
    \ \"Hello\".charAt(1) returns the second character of \"Hello\" which is \"e\"\
    .\n\nYou may be wondering why not use the strict equality operator (===) to compare\
    \ the character with its uppercase version.\n\nTo understand why, let's rewrite\
    \ the example with ===:"
