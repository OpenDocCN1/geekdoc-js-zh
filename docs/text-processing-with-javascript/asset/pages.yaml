    # Treating Multiple Characters as a Single Unit with the Capturing Group


    # Task


    Suppose you want to search an archive of documents and retrieve those that mention
    a date in August. The only clue you have is that the date comes in four different
    styles. For example: "August 16," "August 16th," "Aug 16," or "Aug 16th."


    To match with a date with regex, you need a way to make "ust" in "August" and
    "th" in "16th" optional.


    # Solution


    To make certain letters optional, group them them in parentheses and place a question
    mark after the group:


    ```

    part_2/capturing_group p1/capturing_group p1_ex1.js

    const re = /|Aug(ust)?is([12])(st|nd|rd|th)?/b;

    // Grouping allows matching many alternatives

    re.test("August 16")      // true

    re.test("August 16th");   // true

    re.test("Aug 16th");      // true

    re.test("August 16thth"); // true

    ```


    This regex matches dates in the format of "August 1st," "August 15th," "Aug 22nd,"
    "August 31st." Please note that if the date contains typographical errors such
    as "August 16nd" or "Aug 1rd," the pattern will still match them.


