  md: '# Multiple Lookarounds


    > > Several lookarounds of any sort (negative or positive) may appear in succession
    to create a more complex pattern.


    The thing to remember about lookarounds is that although a match is possible,
    they don''t actually consume the characters in the string. Lookbehinds are similar
    to lookaheads except that they work backward. They instruct the regex to briefly
    move backward in the string to see if their subexpression can match.


    # Recipe 50

    Testing a Pattern with the Negative Lookbehind


    Task

    Suppose you''re searching hospital records for a patient named Smith, and most
    of the data you get from search results is about Dr. Smith. You need a regex that
    matches "Smith" but excludes "Dr. Smith."


    Solution

    Use a negative lookbehind assertion by (?<! ... ):

    ```javascript\part_2/negative_lookbehind/negative_lookbehind_ex1.js

    const re = /(?<!Dr\.)Smith;/

    Your regex now finds records containing "Smith" except for "Dr. Smith."

    console.log(re.test("Dr. Smith")); // -> false

    console.log(re.test("Mr. Smith")); // -> true

    console.log(re.test("John Smith")); // -> true

    ```


    Discussion

    The negative version of lookbehind asserts that the pattern within the lookbehind
    does not precede a pattern. In this case, we''re using it to ensure that the word
    "Smith" isn''t preceded by an uppercase D, a lowercase r, a period (.), and a
    whitespace character (\s). You must use a backslash to escape the period.; otherwise,
    the regex engine will interpret it as a metacharacter.'
