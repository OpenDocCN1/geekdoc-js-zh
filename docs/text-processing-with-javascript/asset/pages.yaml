    \ the previous token zero or more times\n* (?:\\.\\d+)? non-capturing group\n\
    ○ \\. matches the period character literally\n○ \\d matches a digit\n  ○ + matches\
    \ the previous token one or more times\n* ? matches the previous token zero or\
