  md: "# Creating Language-Sensitive Lists with Intl.ListFormat() • 41\n\n```\nfunction\
    \ getFormattedList(lang, arr) {\n  const formatter = new Intl.ListFormat(lang,\
    \ {type: \"conjunction\"});\n  return formatter.format(arr);\n}\n\nconsole.log(msg\
    \ + getFormattedList(\"en\", topPlayers));\n\n// logs:\n// Congratulations to\
    \ this week's winners: Kraken and Boss99\n```\n\nThe second argument of the ListFormat\
    \ method is optional and lets us set options such as the style and type of grouping.\
    \ The default value of type is a conjunction, but if we want to do an \"or”-based\
    \ grouping of the list items, we can use disjunction.\n\nFor example, perhaps\
    \ we want to ask players which honorary title they prefer: Legendary, Mighty,\
    \ or Bold. So the app will apply to their name like \"The Far Mighty\":\n\n```\n\
    part 1/creating_lists/ListFormat_ex4.js\nconst titles = [\"Legendary\", \"Mighty\"\
    , \"Bold\\];\nconst formatter = new Intl.ListFormat(\"en\", {type: \"disjunction\"\
    });\n\nconsole.log(\"Which honorary title do you prefer? \" + \nformatter.format(titles));\n\
    ```\n\n```\n// logs:\n// Which honorary title do you prefer? Legendary, Mighty,\
    \ or Bold\n```\n\nThere's also an option that lets us group the list items as\
    \ a unit:\n\n```\npart 1/creating_lists/ListFormat_ex5.js\nconst titles = [\"\
    Legendary\", \"Mighty\", \"Bold\\];\nconst formatter = new Intl.ListFormat(\"\
    en\", {type: \"unit\"});\n\nconsole.log(formatter.format(titles));\n```\n\n```\n\
    // logs:\n// Legendary, Mighty, Bold\n```\n\nThis example sets the value of type\
    \ as unit, so it formats the list with no \"and\" or \"or.\"\n\nWhenever you want\
    \ to list a series of items in a sentence, consider using the ListFormat constructor,\
    \ as it properly takes care of punctuation in English and other languages.\n\n\
    report erratum • discuss"
