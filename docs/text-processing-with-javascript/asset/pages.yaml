  md: "Converting Color Names to Hexadecimal Values with the Canvas Element · 13\n\
    \nYou need a solution for converting colors into their hex representation.\n\n\
    # Solution\n\nCreate a temporary HTML canvas element, obtain its 2D context, and\
    \ use the fillStyleProperty to convert the color:\n\n```\npart_1/converting_color_to_hex/color_to_hex.exjs\n\
    function convertColorToHex(color) {\n  const canvas = document.createElement(\"\
    canvas\");\n  const ctx = canvas.getContext(\"2d\");\n  ctx.fillStyle = color;\n\
    \  return ctx.fillStyle.toUpperCase();\n}\nconvertColorToHex(\"Khaki\"); // ->\
    \ \"#F0E68C\"\n```\n\nThis function accepts a string containing a web color name\
    \ and converts it into its corresponding hex value.\n\n# Discussion\n\nHexadecimal\
    \ notation is commonly used to specify colors in programs and web development\
    \ because it provides a compact and efficient way to represent a range of colors.\n\
    \nIn notation, colors are made of a combination of red, green, and blue (RGB)\
    \ values, each represented by a two-digit number (00 to FF), the first two digits\
    \ representing the intensity of red, the next two digits representing the intensity\
    \ of blue. For example, the color white is represented by the hex code #FFFFFF,\
    \ which has maximum values for all colors.\n\nIn this solution, we define a function\
    \ that takes in a single parameter color, which should be a string representing\
    \ a color. Inside the function, we create a new HTML canvas element by using the\
    \ document.createElement() method. This method creates an HTML element based on\
    \ the tag name provided as the argument. In this case, we use the tag \"canvas\"\
    \ to create a canvas element.\n\nNext, we create a context object for the canvas\
    \ using the getContext() method. We specify that the context object should be\
    \ a two-dimensional canvas by passing \"2d\" as an argument. We then set the fillStyle\
    \ property of the context object to the parameter that was passed to the function.\
    \ This sets the color that will be used to fill any shapes drawn to the canvas.\n\
    \nreport erratum · discuss"
