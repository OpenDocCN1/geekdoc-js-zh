  md: "# Chapter 2. Part II: Text Processing with Regular Expressions • 70\n\nIn \"\
    greenhouse,\" \"green\" is followed by the same type of character: a word character.\
    \ So, the test returns true. In \"green bay,\" however, \"green\" is followed\
    \ by a space (a different type), and so the result is false.\n\n# lb with the\
    \ RegExp Constructor\n\n> When using the RegExp constructor, you must escape the\
    \ \\b metacharacter with a backslash because you're writing the pattern in a normal\
    \ string, not a slash-enclosed literal.\nThe code tag should not be here.\n\n\
    # Using Intl.Segmenter() Instead\n\nRemember Intl.Segmenter() from Recipe 19.\
    \ Counting Words in a String with Intl.Segmenter(), on page 48? If you're looking\
    \ for a pure JavaScript solution, you can achieve the same result with Intl.Segmenter():\n\
    \n```\npart_2/word_boundary/word_boundary.ex10.js\nfunction includesWord(str,\
    \ word) {\n  let s = [...new Intl.Segmenter(\"en\", {granularity: \"word\"}).segment(str)];\n\
    \  return s.some(value => {\n    return value.segment === word;\n  });\n}\n```\n\
    \n```\nincludesWord(\"Her flashing green eyes.\\ \"green\")\n// --> true\n```\n\
    \n```\nincludesWord(\"We reduce the emissions of greenhouse gases.\\ \"green\"\
    )\n// --> false\n```\n\n```\nincludesWord(\"The green-eyed monster,\\ \"green\"\
    )\n// --> true\n```\n\n```\nincludesWord(\"I can't do it,\\ \"can\")\n// --> false\n\
    ```\n\nWhen you set the granularity to word, Intl.Segmenter() splits the string\
    \ at word boundaries. You can then check the elements of the resulting array for\
    \ the word you are looking for some(el), which returns true if at least one element\
    \ in the array matches the word. One difference between this approach and our\
    \ regex solution is how it handles the apostrophe: \\b treats an apostrophe as\
    \ a word break while Intl.Segmenter() does not.\n\nAnother difference is that\
    \ the Intl.Segmenter() approach is slower than regex, especially if you're testing\
    \ a large block of text. Unless you want to avoid matching words that have an\
    \ apostrophe, you should stick with regex."
