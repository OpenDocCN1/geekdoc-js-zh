  md: 'This time you want to allow users to use numerals in their own language to
    create a PIN. But, the problem is that the character class for matching digits
    (d) matches only ASCII digits:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex1.js

    const re = /^\d(4,6)/;


    // digits in the Persian language

    // equivalent to 1234

