  md: "only the day and the month and don't want to include the timestamp or timezone.\
    \ Use, the Intl.DateTimeFormat() constructor to format the date:\n\n```\nfunction\
    \ getFormatted(locale, date) {\n  const formatter = new Intl.DateTimeFormat(locale,\
    \ {dateStyle: \"full\"});\n  return formatter.format(date);\n}\n```\n\n```\nconst\
    \ formattedDate = getFormatted(\"en-US\", dayAfterTomorrow);\nconsole.log(formattedDate);\n\
    // Wednesday, April 12, 2023\n```\n\nIntl.DateTimeFormat() accepts an object as\
    \ its second argument that specifies how the date should be formatted. In this\
    \ case, you want to include the day of the week in the date, so set the dateStyle\
    \ to full.\n\nHere's how the final code should look like:\n\n```\npart_1/formatting_dates/adding_days_ex1.js\n\
    function addDaysToToday(days) {\n  const d = new Date();\n  d.setDate(d.getDate()\
    \ + days);\n  return d;\n}\nfunction getFormatted(locale, date) {\n  const formatter\
    \ = new Intl.DateTimeFormat(locale, {dateStyle: \"full\"});\n  return formatter.format(date);\n\
    }\nconst dayAfterTomorrow = addDaysToToday(2);\nconst msg = \"We'll deliver your\
    \ purchase on \";\nconsole.log(msg + getFormatted(\"en-US\", dayAfterTomorrow));\n\
    // We'll deliver your purchase on Wednesday, April 12, 2023\n```\n\nThis code\
    \ generates a message containing the expected delivery date of a purchase based\
    \ on the current date and a specified locale.\n\n# Discussion\n\nTo ensure the\
    \ date format in your application is suitable for the country where the products\
    \ are being shipped, you should pass an appropriate BCP 47 language tag to Intl.DateTimeFormat().⁹"
