  md: "# Solution\n\nFirst, we'll use the startsWith() method to determine if the\
    \ string begins with ##:\n\n```\npart_1/matching_startsWith_endsWith/startsWith_endsWith_ex1.js\n\
    const str1 = \"## Why is chocolate bad for your dog?\"\nconst str2 = \"# 10 Amazing\
    \ Dog Facts\"\nconst searchStr = \"##\";\n\nstr1.startsWith(searchStr); // ->\
    \ true\nstr2.startsWith(searchStr); // -> false\n```\n\nThen we'll use the endsWith()\
    \ method to check if the string ends with a question mark:\n\n```\npart_1/matching_startsWith_endsWith/startsWith_endsWith_ex2.js\n\
    const str1 = \"## Why is chocolate bad for your dog?\"\nconst str2 = \"## Best\
    \ way to trim your dog's nails\"\nconst searchStr = \"\";\n\nstr1.endsWith(searchStr);\
    \ // -> true\nstr2.endsWith(searchStr); // -> false\n```\n\nNow we know startsWith()\
    \ and endsWith() produce the result we want, let's create a function that performs\
    \ both at the same time:\n\n```\npart_1/matching_startsWith_endsWith/startsWith_endsWith_ex3.js\n\
