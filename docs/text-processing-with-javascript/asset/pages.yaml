  md: '# Discussion


    The sticky flag performs a search only at the position indicated by the lastindex
    property. Consider this code:


    ```

    part_2/flag_sticky/sticky_ex3.js

    const str = "crack resistant";nconst re = /resistant/y;

    re.lastIndex = 0;

    console.log(str.match(re));

    // -> null (no match at index 0)

    re.lastIndex = 2;

    console.log(str.match(re));

    // -> null (no match at index 2)

    re.lastIndex = 6;

    console.log(str.match(re));

    // -> ["resistant", index: 6, input: "crack resistant", groups: undefined]

    console.log(re.lastIndex);

    // -> 15

    ```


    A sticky search won''t match characters from any index other than the one indicated
    by the lastindex property. Also, notice how the flag updates the lastindex property
    when the operation is successful (Line 16).


    # The Order of Flags


    ![](img/eeb15adcfef82a304df42444e25add78_133_0.png)


    The sticky flag is useful when we want to match something with a fixed structure.
    In this recipe, we knew ahead of time about the structure of the input string:
    a timestamp followed by a sentence. We simplified the pattern by telling the engine
    to search only at the position where the data we want located. Without the sticky
    flag, the pattern could become unnecessarily complicated.'
