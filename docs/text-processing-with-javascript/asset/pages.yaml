  md: 'searches for “doughnut”. Since there''s no such a word in the string, the method
    returns false. The second time includes() searches for “donut,” and this time
    it returns true. So, the return value of some() will be true.


    # Discussion


    ECMAScript added includes() to the language in ES2015 to enable developers to
    easily determine whether a string contains another string. The second argument
    of includes() is optional and lets you specify the position at which to begin
    searching. For example:


    ```

    part_1/checking_specific_words/ex2.js

    const quote = "Sachertorte is a torte of Austrian origin.";quote.includes("Sachertorte",
    15); // false

    ```


    This code starts at index 15. Because no matches “Sacher-torte from index 15 onwards,
    the return value is false.


    Remember, includes() is case sensitive. If you search for “Sachertorte” in a string
    containing “Sachertorte”, the result is:


    ```

    part_1/checking_specific_words/includes3.js

    const quote = "I''d like to order a Sacherertorte.";nconst word = "Sachertorte";nquote.includes(word);
    // false

    ```


    Some desserts could have internal capitalization because they are made up of two
    words as Dobostorta/Dobostorta,LeibnizKeks/LeibnizKeks,and Sachertorte/Sachertorte.
    In most cases, you want to perform a case-insensitive search by converting the
    string and the word to lowercase, like this:


    ```

    part_1/checking_specific_words/ex4.js

    const quote = "I''d Like to order a SacherTorte.".toLowerCase();nconst word =
    "Sachertorte".toLowerCase();nquote.includes(word); // true

    ```


    But what if you want to check if a string contains multiple words simultaneously?
    In that case, you should use the every() method. every() is similar to some()
    in that it executes a function for each element of an array. But it returns true
    only if every item in the array passes the test. Here''s an example:'
  merge: -1
  pgno: 16
