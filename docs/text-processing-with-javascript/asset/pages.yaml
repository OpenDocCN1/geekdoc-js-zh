  md: "```\npart_1/checking_specific_words/includes_ex5.js\nconst msg = \"sachertorte,\
    \ 3 pretzels, and 2 donuts please\";\nconst wordsArr1 = [\"sachertorte\", \"donut\"\
    ];\nconst wordsArr2 = [\"sachertorte\", \"sourdough\"];\nfunction hasEveryWord(str,\
    \ arr) {\n  return arr.every(el => str.includes(el));\n}\n\nhasEveryWord(msg,\
    \ wordsArr1); // -> true\nhasEveryWord(msg, wordsArr2); // -> false\n```\n\nHere,\
    \ \"sachertorte\" and \"donut\" do not pass the test because both exist in the\
    \ string, but that's not the case for \"sachertorte\" and \"sourdough.\"\n\nAlthough\
    \ includes() is designed to search for only a single word, with a little effort,\
    \ you can take advantage of it to search for more words. But be careful when looking\
    \ for words that also have a compound form,\" includes() returns\n\nIf you search\
    \ for \"cake\" in \"I'd like to order two pancakes,\" includes() returns true.\
    \ If that would happen to you, you should use a regex token known as a word boundary.\
    \ [Recipe 25. Looking For Whole Words Only with the Word Boundary (\\b), on page\
    \ 67.](#)\n\n# Matching the Beginning or End of a String with startsWith() and\
    \ endsWith()\n\n# Task\n\nLet's assume you have a database of articles about pet\
    \ care and your task is to compile a list of questions that are answered in the\
    \ articles. Suppose the articles are formatted in the Markdown language and the\
    \ questions are all in level 2 heading (preceded by ##).\n\nHow would you write\
    \ a code that distinguishes a heading from a normal sentence? And what method\
    \ would you use if you wanted to filter those that are questions? You need a solution\
    \ that lets you check the characters at the beginning and end of a string."
