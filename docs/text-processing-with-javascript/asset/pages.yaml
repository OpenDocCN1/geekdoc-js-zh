  md: 'Previously, it was logical to restrict the top-level domain to two-letter pairings
    for country codes and to perform a complete enumeration of generic top-level domains,
    like com|net|org|mil|edu. But as new top-level domains are added frequently, patterns
    that once worked quickly become outdated.


    Basically, you can''t be sure if david@somewhere.com can actually get emails unless
    you send one and if it sees through. In this scenario, you''re uncertain whether
    the absence of a reply indicates that the domain where.com is discretely getting
    rid of emails sent to non-existent mail addresses, or if David deleted them, or
    if his spam filter intercepted them.


    A reliable email validation tool will do more than just check the syntax of the
    email address or ping a mail server. This process involves sending a message to
    the email address entered, which includes a confirmation token. Confirmation tokens
    are the only way to verify that the email address is correct.


    That''s why the majority of mailing lists rely on this mechanism to authenticate
    sign-ups. Because anyone can enter ceo@microsoft.com, which could be technically
    valid, yet it''s improbable that the person at the receiving end is the actual
    CEO.


    Because you need to send a confirmation email to verify whether an address exists
    or not, you have the option to choose a less strict expression. It may be better
    to let some invalid addresses pass through than by blocking valid ones. Even though
    the solution in this recipe allows characters %#$ that aren''t typically found
    in email addresses, it''s efficient and uncomplicated. Additionally, it will not
    prevent a legitimate address from being accepted.


    If you want to add complexity to your regex, my suggestion would be to notify
    the user that there could be an issue with the email address rather than making
    it forbidden.'
