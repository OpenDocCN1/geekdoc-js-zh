  md: "use in an article for a finance publication that is published in multiple languages.\n\
    \nThousand separators are used in many different languages and countries to make\
    \ large numbers easy to read. However, the character used as the thousand separator\
    \ can vary across languages and cultures.\n\nFor example, let's say you have the\
    \ following string:\n\n```\n1000000000\n```\n\nAnd you'd like to format it as:\n\
    \n```\n1,000,000,000\n```\n\nYou need to write code to add thousand separators\
    \ programmatically to the number.\n\n# Solution\n\nUse the Intl.NumberFormat()\
    \ constructor:\n\n```\npart_1/adding_thousand_separators/adding_thousand_separators_ex1.js\n\
    function addThousandSeparator(num, locale) {\n  const numFormat = new Intl.NumberFormat(locale);\n\
    \  return numFormat.format(num);\n}\n```\n\n```\naddThousandSeparator(1000000000,\
    \ \"en\");\n// -> \"1,000,000,000\"\n```\n\nIn this code, new Intl.NumberFormat()\
    \ creates a NumberFormat object. Then, the format() method is called on the object,\
    \ passing the \"en\" argument to specify the English language. The function returns\
    \ a formatted string with thousand separated based on the locale.\n\n# Discussion\n\
    \nIncluding thousand separators in numerical values is an easy way to enhance\
    \ the clarity and visual appeal of your data. But, it's crucial to verify the\
    \ type of the content before proceeding.\n\nThe comma (.) is commonly used as\
    \ a thousand separator in English-speaking countries and many other countries.\
    \ For example, 10,000,000 represents ten million. However, in many European countries,\
    \ such as Germany, Greece, and Italy, the period (.) is used as the thousand separator\
    \ and the comma (.) is used as the decimal separator. So, to represent ten million,\
    \ they use 10.000.000."
