  md: "# Chapter 1. Part I: Text Processing with Built-in JavaScript Methods • 46\n\
    \nthe object into its elements. The spread syntax consists of three dots in a\
    \ row, and lets us quickly create an array from the iterator.\n\nFinally, we calculate\
    \ the length of the array to get the number of characters in the string. If you\
    \ find the code to be too cryptic, you can use this version instead:\n\n```\n\
    part_1_counting_characters/char_segmenter_ex3.js\nfunction getLength(str) {\n\
    \  // Create a instance of segmenter\n  const segmenter = new Intl.Segmenter();\n\
    \  // Segment the string\n  const segment = segmenter.segment(str);\n  // Convert\
    \ it into an array\n  const arr = Array.from(segment);\n  // Return the number\
    \ of characters\n  return arr.length;\n}\n```\n\n```\ngetLength(\"\uD83D\\uDE00\"\
    ); // → 1\ngetLength(\"\U0001F600\U0001F60A\"); // → 2\n```\n\nThis version of\
    \ the code does exact same operations as the first. You'll probably come across\
    \ code that uses other techniques to count the number of characters in a string.\
    \ One technique is to convert the string into an array of characters and then\
    \ count the number of elements in the array:\n\n```\nconst str1 = \"\\uD83D\\\
    uDE00\";\nconst str2 = \"\\uD83D\\uDE00\\uD83D\\uDE01\";\nconst str3 = \"\\uD83D\\\
    uDE00\\uD83D\\uDE01abc\";\n\nconsole.log(Array.from(str1).length); // → 1\nconsole.log(Array.from(str2).length);\
    \ // → 2\nconsole.log(Array.from(str3).length); // → 5\n\nconsole.log([...str1].length);\
    \  // → 1\nconsole.log([...str2].length);  // → 2\nconsole.log([...str3].length);\
    \  // → 5\n```\n\nThis trick works since ES2015 have built-in iterators that Unicode-aware\
    \ strings treat a supplementary character as a single value. However, counting\
    \ the number of characters in a string is not always simple. In some cases, this\
    \ technique could give you an inaccurate result. For example:"
