  md: "# Formatting Dates with Intl.DateTimeFormat()\n\n# Task\n\nSuppose you work\
    \ as a programmer for an online shop that delivers products after two days from\
    \ the date of purchase. Your task is to create a JavaScript code that will notify\
    \ the user about the exact day of the week when they can expect to receive their\
    \ ordered goods.\n\nFor instance, if a customer purchases a product on a Saturday,\
    \ your code should inform them that the delivery will take place on the following\
    \ Monday.\n\n# Solution\n\nThis task involves three steps:\n\n+   * Getting the\
    \ current date\n* Adding two days to the current date\n* Converting that date\
    \ to the day of the week\n\nWe can perform the first two steps with a function\
    \ like this:\n\n```\nfunction addDaysToday(days) {\n  const d = new Date();\n\
    \  d.setDate(d.getDate() + days);\n  return d;\n}\n\nconst dayAfterTomorrow =\
    \ addDaysToday(2);\nconsole.log(dayAfterTomorrow);\n// -> Wed Apr 12 2023 11:41:09\
    \ GMT+0400\n```\n\nFirst, use the Date() constructor to get the current date.\
    \ Next, retrieve the day of the month for today by calling the getDate() method\
    \ of the date object. Add two to this value to get the day after tomorrow's date.\
    \ Then, use the setDate() method to update the day of the month, and the date\
    \ object will automatically adjust the month and year if needed.\n\nAfter performing\
    \ the preceding steps, you'll have a string that contains the date after tomorrow,\
    \ along with the timestamp and timezone. But you need"
  merge: -1
