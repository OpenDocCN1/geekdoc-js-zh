- img_proc: true
  md: 'In this code, conversion to NFD or NFC does not affect str1 and str2 because
    the strings are compatible compositions, not canonical compositions. Interestingly,
    conversion to NFKD and NFKC produces the same result because NFKC uses compatibility
    decomposition as the basis for canonical composition. In this case, the character
    has no canonical composition form, so it''s converted to compatibility decomposition.


    The difference between NFC and NFKD becomes more apparent when a glyph is a canonical
    composition of glyphs that are compatible with another glyph. Consider the following
    code:


    ```

    part_1/equalizing_characters/normalize_ex7.js

    const str = "/ // \u1E9B"

    console.log(str.normalize("NFD")); // // \u017F\u0307

    console.log(str.normalize("NFC")); // // \u1E9B

    console.log(str.normalize("NFKD")); // // \u0073\u0307

    console.log(str.normalize("NFKC")); // // \u1E61

    ```


    As we said, NFKC uses compatibility decomposition as the basis for canonical composition.
    The compatibility decomposition of \u1E9B is \u0073\u0307, and the canonical composition
    of \u0073\u0307 is \u1E61.


    Remember, perform text normalization before storing or processing texts to avoid
    possible pitfalls. But be careful when using normalization KD and KC as they discard
    formatting distinctions that may be essential to the semantics of the text. Therefore,
    you shouldn''t blindly apply them to arbitrary text. NFC is usually a better choice
    for general text.


