  md: "# Solution\n\nWrite a function that accepts a hex value and a percentage as\
    \ input parameters. The function should convert the percentage into a hex value\
    \ and then add it to the original hex value:\n\n```\npart_1/adding_transparency_to_hex/adding_transparency_to_hex_ex1.js\n\
    function addAlphaToHex(hex, percent) {\n  const decimal = percent / 100;\n  const\
    \ rgb = Math.round(decimal * 255);\n  const alpha = rgb.toString(16).toUpperCase();\n\
    \n  if (alpha.length === 1) {\n    alpha = \"0\" + alpha;\n  }\n  return hex +\
    \ alpha;\n}\n\naddAlphaToHex(\"#FFFF\", // \"#FFFFFFB\"\n```\n\nThis function\
    \ returns an eight-character hex value that includes the alpha level. in this\
    \ case, the return value is a white hex color (#FFFFFF) with 70 percent opacity\
    \ (#FFFFFFB).\n\n# Discussion\n\nPreviously, developers had to convert a hex color\
    \ to either an RGBA or HSLA color value. This conversion was necessary because\
    \ the alpha channel in the RGBA or HSLA value could be used to determine the level\
    \ of opacity. However, with the introduction of CSS Color Module 4, the problem\
    \ has been solved by adding four (#rrggbaa) character hex notations that include\
    \ the alpha level. So, developers no longer need to convert the hex color to another\
    \ format in set opacity.\n\nThe rr, gg, bb, and aa in the notation represent the\
    \ hexadecimal values for the red, green, blue, and alpha components respectively,\
    \ ranging from 00 to FF. The alpha value determines the opacity of the color,\
    \ with 00 representing a fully transparent and FF representing a fully opaque\
    \ color. For example, the color #FF0000FF is a fully opaque red color, while the\
    \ color #FF000000 is a fully transparent red color.\n\nOur function addAlphaToHex()\
    \ takes two parameters: hex and percent. The function's purpose is to convert\
    \ the percentage value to its corresponding hex representation and append it as\
    \ an alpha value to the given hex. By dividing the function, we first calculate\
    \ the decimal value of the percentage by it"
