  md: '# Chapter 2. Part II: Text Processing with Regular Expressions • 68


    Success! You matched "green" only when it was a separate word and not part of
    another word. You were also able to find "green" in spite of punctuation around
    the word. Let''s see how \b works to find words.


    # Discussion


    The metacharacter \b matches at a position known as the word boundary. Simply
    put, this metacharacter allows you to look for "whole words" only. A position
    qualifies as a word boundary only if a word character is not followed or preceded
    by another word character.


    Therefore, \b matches before the first character or after the last character of
    a word. Word characters include a-z, A-Z, 0-9, and underscore. So things like
    spaces (green beans), quotation marks (''green''), commas (green.), and periods
    (green.) are seen as word boundaries.


    # What Is a Metacharacter?


    > When certain characters are used in regular expressions, they give special meaning
    to the search syntax. These characters are known as metacharacters (or special
    characters) and allow you to perform a more advanced matching than just searching
    for a piece of text. Metacharacters can represent ideas such as locations, quantity,
    or types of characters.


    It''s pretty common to match only whole words (like black, not blacksmith) and
    \b is well-suited to that, but there''s more to word boundaries you might imagine.
    Let''s dig a bit deeper into \b.


    \bg would not match "green" in "green" or "green4," because both underscores and
    digits are word characters, and there is no word boundary between another word
    character:


    ```

    part_2/word_boundary/word_boundary.ex4.js

    const re = /\green\b/;

    re.test("green");   // false

    re.test("green4");  // false

    ```


    Hyphens, do qualify as word boundaries. So, green-eyed would be a match in our
    example. Humans may see green-eyed as a word, but regex does not:


    ```

    part_2/word_boundary/word_boundary.ex5.js

    const re = /\green\b/;

    re.test("green-eyed");  // true

    ```'
