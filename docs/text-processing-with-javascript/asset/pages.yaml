  md: "# Equalizing Incompatible Characters with normalize() · 55\n\n+   * Normalization\
    \ Form KD (NFKD): Compatibility Decomposition\n* Normalization Form KC (NFKC):\
    \ Compatibility Decomposition, followed by Canonical Composition\n\nTwo characters\
    \ are canonically equivalent when they have different code points but are rendered\
    \ in the same way, just like “é” in our example. When we say NFC performs canonical\
    \ composition, that means it merges the code points of the character into a single\
    \ code point, so “é” consisting of U+0065 and U+0301 becomes “é”. Canonical decomposition\
    \ is the opposite process.\n\nNow, if two characters have different appearances\
    \ and code points but have the same meaning, they are classified as compatibly\
    \ equivalent. Take a look at the following table for the two forms of equivalent\
    \ sequences:\n\n| Canonically equivalent é ↔ e + ́\nU+00E9 U+0065 U+0301\nÇ ↔\
    \ C + \nU+00C7 U+0043 U+0327\nñ ↔ n + \nU+00F1 U+0066 U+0303\n◌ ➔ s\nU+017F U+0073\n\
    ℍ ➔ H\nU+210D U+0048\n⑥ ➔ 6\nU+2460 U+0036\nカ ➔ カ\nU+FF76 U+03AB |\n\nWhen we\
    \ normalize a string, we're telling the program to select one of these equivalent\
    \ encodings so that the characters are either all composed or decomposed. Notice\
    \ how the arrow on some cells points only to the right. That means we can convert\
    \ a character to its compatibility decomposition but not the reverse, we should\
    \ be careful when using this type of conversion: if we lose access to the source\
    \ text, the original form of characters is lost forever because there's no function\
    \ to revert your text back to composed form.\n\nConsider the following code:"
