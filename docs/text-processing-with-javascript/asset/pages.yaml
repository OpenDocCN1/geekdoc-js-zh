  md: '# Chapter 2. Part II: Text Processing with Regular Expressions • 74


    This pattern matches "^" in "list," test() returns true. You might have noticed
    the caret (^) is the same as the one that matches the beginning of a string (Recipe
    24, Asserting the Start or End of a String with ^ and S, on page 65). Although
