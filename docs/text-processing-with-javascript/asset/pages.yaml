  md: 'The list you want to extract may also come in different variations. It could
    have a forward slash (/) between items rather than a comma. Or it could have extra
    words such as "and," "or," "etc." that you don''t want to end up in your array.


    In this recipe, we first build a function that extracts simple lists and then
    enhance the function to handle more complex lists.


    # Solution


    This recipe involves two steps: first, finding the sentence containing the list
    of colors, and extracting each color and storing it in an array. You can perform
    the first step using the indexOf() method. The list of colors comes after a colon
    (:). Locate it with indexOf(). Next, locate the period that follows the colon
    and store the index in another constant:


    ```

    const str = `Feel confident in even the most unforeseen weather conditions

    with waterproof trail-running shoes helping you stay dry. Available

    in four new colors: Velvet Brown, Black, Golden Moss, Medium Blue.\`;

    const start = str.indexOf(": \ ");

    const end = str.indexOf(".", start);

    ```


    Now, you have two indices that mark the beginning and end of the list in the string.
    Pass them to the slice() method to extract the list:


    ```

    const list = str.slice(start + 2, end);

    // Velvet Brown, Black, Golden Moss, Medium Blue

    ```


    The arguments you pass to slice() specify the string''s start and end index to
    be returned. Offset the colon and the space at the beginning of the string, increase
    the start index by 2. The end index slice() to extract up but not including the
    character at that index, there''s no need to subtract from it.


    Now comes the second step, where you need to convert the comma-separated list
    into an array. There are a couple of ways to do this in JavaScript. The long approach
    is to look for a loop and add each item to an array. The more straightforward
    approach is to use the split() method. With split(), you can define where each
    split in a string should occur and quickly get an array of items:


    ```

    const colors = list.split(", \ ");

    console.log(colors);

    // -> [ "Velvet Brown", "Black", "Golden Moss", "Medium Blue" ]

    ```'
