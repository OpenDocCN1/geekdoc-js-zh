    Even setting the Unicode flag won''t help:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex2.js

    const re = /^\d{4,6}$/u;


    // digits in the Persian language

    const str = "۱۲۲۳۴";


    re.test(str);

    // false

    ```


    You need a solution that lets you verify digits in any language.


    # Solution


    Use a Unicode property escape in the form of \{Number}:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex3.js

    const re = /^\{Number}{4,6}$/u;


    // digits in Persian

    re.test("۱۲۲۳۴"); // true


    // digits in Thai

    re.test("๑๒๓๔๕"); // true


    // digits in Tamil

    re.test("ஐ-ஐ-ஐ"); // true

    ```


    Success! You''ve matched digits in three different languages.'
