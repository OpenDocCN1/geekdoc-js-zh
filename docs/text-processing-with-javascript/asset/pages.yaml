  md: '# Discussion


    Users tend to select uncomplicated or commonly used passwords that are easy to
    recall. Surprisingly, some people are still using “123456” and “password” as their
    password, which means they are easy to hack. As a result, it''s often necessary
    to safeguard users from choosing easy-to-guess passwords by implementing minimum
    password complexity requirements.


    We structured each validation rule of this recipe into its own lookahead group.
    Without lookahead, you''d need to use multiple regex patterns or iterate over
    the string multiple times to check for all the required conditions, which can
    be less efficient and harder to maintain.


    Lookaheads allow to check for the conditions without actually advancing the position
    of the regex engine in the string, so each test runs from the start of the string.
    Once a lookahead succeeds, the regex engine then moves to the next lookahead from
    the same position. If a lookahead fails to find a match, the entire fails as a
    result.


    To search for a pattern, each lookahead has a “*, which means that the character
    type being sought can appear anywhere in the string, not just at the beginning.
    With the technique illustrated here, you can include multiple password tests in
    a single regex.


    Remember, it''s important to validate form input with both client-side and server-side
