    Although curly brackets are a common type of quantifier used in regex, there are
    other quantifiers available as well. The following section provides information
    about these additional quantifiers.


    # Types of Quantifiers


    Quantifiers specify the number of occurrences of a character, group, or character
    class to match. There are six forms of quantifiers in regex: zero or more (*),
    one or more [+], zero or one (?), exactly n times [n], at least n times [n.],
    and from n to m times (n,m). Let''s look at each and how you might use them.


    # Zero or More (*)


    An asterisk matches zero or more sequences of the preceding item. Let''s say we
    want to match all verb forms of the word "play," including "playing." By using
    a quantifier after the character class (w), we can tell regex to match "play"
    and any character that might come after it as long as it''s a word character:


    ```

    part_2/quantifiers/quantifiers_ex5.js

    const re = /\play\w*/b;

    re.test("He plays for Cleveland"); // true

    re.test("France is playing tomorrow."); // true

    re.test("Evans played well."); // true

    re.test("Let''s play a different game"); // true

    ```


    Note that this pattern also matches words "playful" and "playground." To limit
    the match to a set of specific words, we use a vertical bar (see Recipe 26. Matching
    One of Several Alternatives with the Vertical Bar (|), on page 71).


    # One or More (+)


    A plus sign matches one or more sequences of the preceding item. For example,
    the regular expression Go+/al attempts to match the letter G by one or more instances
    of the o followed by the letters a and l:


    ```

    part_2/quantifiers/quantifiers_ex6.js

    const re = /Go+/!;

    re.test("Goooooooal!"); // true

    re.test("Goal!"); // true

    re.test("Gal!"); // false (expects at least one instance of)

    ```


    # Zero or One (?)


    A question mark matches zero or one occurrence of the preceding item. For example,
    if we wanted to match the word "apple" or its plural form, "apples."'
