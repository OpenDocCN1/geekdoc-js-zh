  md: '# Discussion


    As you learned in Recipe 29. Repeating Part of a Regex with Quantifiers, on page
    80, the + quantifier allows you to match the preceding token one or more times.
    So, the \w+ matches one or more words in a string.


    In a string like "str", should \w+ match "s" or "str"? How does the regex engine
    decide between matching "one" or "more" characters? Quantifiers are greedy by
    default, matching the previous token as many times as possible. A question mark
    forces the quantifier to take the opposite (non-greedy) and match as few times
    as possible. Compare:


    ```

    part 2/lazy_quantifiers/lazy_ex5.js

    const str = "str";nstr.match(/\w+?/)[0]; // "s"

    str.match(/\w+)/)[0]; // "str"

    ```


    The pattern [\D]* matches zero or more occurrences of any character (including
    digits and non-digits) while trying to match as few characters as possible. The
    result is matching the first occurrence of -> rather than the last.


    | Nicknames for Laziness |

    | A lazy quantifier is also known as non-greedy or reluctant. |


    > Possessive Quantifiers

    JavaScript doesn''t support possessive quantifiers. A possessive quantifier is
    similar to a greedy one but offers better performance in certain situations.


    Keep in mind that using a question mark immediately after a quantifier, including
    *, +, ?, or {}, - makes the quantifier lazy.'
