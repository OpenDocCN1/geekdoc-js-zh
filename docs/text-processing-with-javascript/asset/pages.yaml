  md: "# Discussion\n\nIn regex literals, it's possible to specify options by adding\
    \ single-letter flags, also known as modifiers, following the forward slash that\
    \ terminates the pattern. Normally, the replace() method replaces only the first\
    \ occurrence of the specified pattern in a string. But here, we're using the global\
    \ search flag (g), which instructs the engine to continue searching for other\
    \ pattern occurrences.\n\nThe i flag complements the g flag by asking the engine\
    \ to perform the match in a case-insensitive manner. Here's how each token in\
    \ this regex works:\n\n```\n/b(yre)?/bi\n```\n\n+   * \\b asserts the position\
    \ at a word boundary\n* (t) 1st capturing group\n  * t matches the character \"\
    t\" literally\n  * yre matches the characters \"yre\" literally\n* (s)? 2nd capturing\
    \ group\n  * s matches the character \"s\" literally\n  * ? matches the previous\
    \ token between zero or one time (greedy)\n  * \\b asserts the position at a word\
    \ boundary\n* Flags\n  * g global match\n  * i case-insensitive match\n\nPay attention\
    \ to the special characters $ and $2 in the second argument of replace(). These\
    \ characters have special meanings when used in the replacement string. The pattern\
    \ $n includes the value matched by the nth capturing group.\n\nHere, $1 refers\
    \ to the character matched by the first capturing group, and $2 refers to the\
    \ character matched by the second capturing group. So, if the pattern matches\
    \ the word \"Tyre\" with a capital \"T,\" that specific word will be replaced\
    \ with \"Tire.\"\n\nSimilarly, if the pattern matches the optional \"s\" in the\
    \ word \"tyres,\" the word will be replaced with \"tires.\" To learn more about\
    \ special replacement patterns, see [Recipe 34. Using Special Replacement Patterns,\
    \ on page 91].\n\nJavaScript's regular expression flavor supports seven optional\
    \ flags, including d, g, i, m, s, u, and y. Similar to g, these flags are placed\
    \ after the closing delimiter in the literal form, or passed as the second argument\
    \ to RegExp() constructor. We'll look at each of these flags in the recipes that\
