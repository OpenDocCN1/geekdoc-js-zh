    characters. In order to accomplish this, the encoding associates each character
    with a number which is a code point. For example, the character "F" is assigned
    a code point of U+0046.


    A character that''s assigned to a specific code point is called an encoded character.
    In JavaScript, you can use the code point of a character directly by preceding
    the code with \u, as in this example:


    ```

    console.log("u0046");   // F

    ```


