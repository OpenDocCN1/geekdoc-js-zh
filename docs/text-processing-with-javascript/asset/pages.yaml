  md: "# Formatting Currencies with Intl.NumberFormat()\n\n# Task\n\nImagine you run\
    \ an online shop that delivers products to various countries. You want to display\
    \ the prices of the items in the currency of the user's location. So, for example,\
    \ if a visitor from Canada chooses to view a monitor priced at $8499 in U.S. dollars,\
    \ you want to automatically 1) convert the price from USD to CAD and 2) format\
    \ the currency according to CAD.\n\n# Solution\n\nFirst, you need to obtain the\
    \ exchange rate between the U.S. dollar (USD) and the Canadian dollar (CAD). Since\
    \ the rate can vary constantly, you should use an online API that gives you real-time\
    \ data for the currencies you want to convert. These services usually require\
    \ a paid subscription.\n\nIn this recipe, we'll use the free service available\
    \ at exchanger.host, which updates the exchange rates only once a day. You can\
    \ send a fetch request to the API by specifying the currencies you want to convert\
    \ as parameters.\n\nOnce the fetch is successful, read and parse the data using\
    \ the json() method,\n\n```\nasync function getExchangeRate(from, to) {\n  const\
    \ api = `https://api.exchangerate.host/convert?from=${from}&to=${to}`;\n  let\
    \ response = await fetch(api);\n  response = await response.json();\n  return\
    \ response.info.rate;\nn\n```\n\n```\nconst exchangeRate = getExchangeRate(\"\
    USD\", \"CAD\");\n```\n\nNow that you have an exchange rate for your target currency,\
    \ you need a way to format it. Pass the ISO code of the currency you want to convert\
    \ to the Intl.NumberFormat constructor as an option. This will return an object\
    \ that has a format() method you can use to format any amount:\n\n```\nfunction\
    \ getFormattedCurrency(currency, amount) {\n  return new Intl.NumberFormat(\"\
    en-US\",\n    style: \"currency\",\n    currency: \"currency\",\n\n```"
