  md: 'Chapter 1. Part I: Text Processing with Built-in JavaScript Methods • 60


    +   - You can access the clipboard only if the page is the active browser tab

    - The Clipboard API is available only in secure contexts (HTTPSPS)


    Previously, the only way to access the clipboard was through the Web API document.execCommand()
    method. But because this method is synchronous and blocks the browser when reading/writing
    large data, browser vendors have deprecated it in favor of the Clipboard API.


    Use the Clipboard interface for a smoother experience for your users when they
    need to copy code snippets, activation keys, tokens, verification codes, etc.,
    but always be explicit about when and what you store in their clipboard.


