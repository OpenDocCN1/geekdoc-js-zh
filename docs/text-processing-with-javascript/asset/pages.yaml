  md: '# Creating Your First Regular Expression • 63


    We can get the same result with the RegExp() constructor:


    ```

    part_2/first_regex/first_regex_ex3.js

    const re = new RegExp("123");

    const str1 = "123";

    const str2 = "321";

    console.log(re.test(str1)); // -> true

    console.log(re.test(str2)); // -> false

    ```


    Unlike the literal form, the RegExp() constructor allows us to construct a pattern
    dynamically. For example, we can use it to build a pattern of the items of an
    array:


    ```

    part_2/first_regex/first_regex_ex4.js

    const str = "Debuggers don''t remove bugs. They show them in slow motion."

    const arr = ["bug", "flea", "mite", "midge"];

    const re = new RegExp(arr.join("|"));

    console.log(re.test(str)); // -> true

    ```


    A pipe symbol in a regex pattern works like the logical OR (|) operator in JavaScript.
    It matches everything to the left of the symbol or everything to the right. In
    this case, we have four items in the array, and we''re joining them with a pipe,
    so it''s like writing the literal form /[bug|flea|mite|midge]/. The main difference
    is that RegExp lets us build the pattern dynamically.


    # When to Use a Constructor


    > Keep in mind that the literal form is always faster than the constructor form.
    So, use a constructor only when you need to build a pattern dynamically.


    ![](img/eeb15adcfef82a304df42444e25add78_75_0.png)


    Another difference between the two forms is when using the RegExp constructor,
    it''s necessary to use escape characters for backslashes and quotes. Compare:


    ```

    part_2/first_regex/first_regex_ex5.js

    // A RegExp pattern

    const re1 = new RegExp("\\d");

    // The Literal version of the above pattern

    const re2 = /\d/;


    console.log(re1.test(''3'')); // -> true

    console.log(re2.test(''3'')); // -> true

    ```


    To match a quote character in a regex pattern that is already enclosed in quotes,
    we need to use an escape character to indicate that the quote character'
