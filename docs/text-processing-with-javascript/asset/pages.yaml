  md: "# Chapter 2. Part II: Text Processing with Regular Expressions • 66\n\n# Solution\n\
    \nPlace a caret (^) at the beginning and a dollar symbol ($) at the end of the\
    \ pattern, like this:\n\n```\npart_2/caret_and_dollar/cnd_ex3.js\nconst digits\
    \ = \"8754789\";\nconst digits_and_letters = \"875abc\";\nfunction verifyDigits(input)\
    \ {\n  const re = /^\\d+$/;\n  return re.test(input);\n}\n```\n\n```\nconsole.log(verifyDigits(digits));\
    \ // → true\nconsole.log(verifyDigits(digits_and_letters)); // → false\n```\n\n\
    The regex matches the exact phrase you're looking for! The caret (^) asserts the\
    \ position at the start of the string, and a dollar symbol ($) asserts the position\
    \ at the end of the string.\n\n# Discussion\n\nDon't confuse ^ and $ with startsWith()\
    \ and endsWith(). ^ and $ are known as zero-width assertions, which means they\
    \ don't match actual characters, but rather positions in the text. So, the caret\
    \ symbol in /^Hello/ doesn't match \"H\" in the input. Instead, it asserts that\
    \ no other character comes before the literal characters \"Hello.\"\n\nSimilarly,\
    \ the dollar symbol doesn't match any character, it ensures that the position\
    \ is the end of the string. If you want to match specific characters at the beginning\
    \ or end of a string, you should use JavaScript's startsWith() and endsWith()\
    \ methods (Recipe 3, Matching the Beginning or End of a String with startsWith()\
    \ and endsWith(), on page 5).\n\n| The Multiline flag matches the point before\
    \ a line break character, and ^ also matches the point after a line break character.\
    \ If you use the multiline flag in JavaScript, We'll cover the multiline flag\
    \ in Recipe 41, Forcing ^ and $ to Match at the Start and End of a Line with m\
    \ Flag, on page 110 |\n\nUse ^ and $ to assert a position at the beginning or\
    \ end of a string, but be careful when using the multiline flag as it changes\
    \ how these symbols work."
