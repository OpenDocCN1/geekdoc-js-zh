  md: '# Testing Regex with Specialized Tools


    Deciphering complex regular expression patterns can be difficult even for experienced
    developers. As a result, many regular expression tools (both free and commercial)
    have emerged with varying feature sets that make building regex patterns easier.


    While it''s perfectly possible to experiment with regular expressions in a programming
    environment, you''d be missing useful helpers such as syntax checking, debugging,
    and other feedback.


    A good tool provides an interface to test a pattern on sample strings, makes it
    easier to understand complex regular expressions written by other developers,
    and allows you to convert regular expressions between flavors.


    When building complicated regular expressions, using a specialized tool like the
    ones described below will make your code less prone to errors.'
