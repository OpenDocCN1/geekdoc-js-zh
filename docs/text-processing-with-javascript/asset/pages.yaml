  md: "Escaping a String for Use in a Regex · 169\n\n/(?<!\\w)(.+)?/(?\\w)/\n\n+ \
    \  - (?<!\\w) negative lookbehind: asserts that the regex inside does not match\n\
    - w matches any word character\n- ' matches the character ' literally\n- (.*?)\
    \ 1st capturing group\n  - matches any character (except for line terminators)\n\
    \  - *? matches the previous token between one and unlimited times, as few times\
    \ as possible (lazy)\n- ' matches the character ' literally\n- (??!\\w) negative\
    \ lookahead: asserts that the regex inside does not match\n- w matches any word\
    \ character\n\nThe regex begins with a negative lookbehind to match an opening\
    \ single quote that isn't preceded by a word character (a letter, digit, or underscore).\
    \ As a result, it won't match words like “What’s”. Next, (.+?) matches any character\
    \ one or more times. The question mark makes the match **non-greedy**, which means\
    \ the quantifier tries to match its preceding item as few times as possible (see\
    \ Recipe 38, Creating Lazy Quantifiers with the Question Mark, on page 102). Without\
    \ the question mark, the pattern would match the last closing quotation mark in\
    \ the string.\n\nFinally, (??!\\w) matches a single quote that's not followed\
    \ by a word character—thanks to the negative lookahead.\n\n# Recipe 66\n\n# Escaping\
    \ a String for Use in a Regex\n\n# Task\n\nImagine a scenario where you're designing\
    \ a search feature for an online bookstore. Within the app’s search functionality,\
    \ there is a field where users can enter a partial title or author’s name to find\
    \ the specific book they are looking for.\n\nYour code involves using the user-provided\
    \ string as a component of a regex to search a database. In order to safeguard\
    \ your app from potential attacks, you should implement a function that escapes\
    \ all regex metacharacters in the user-provided string before using it as a component\
    \ of your search pattern."
