  md: 'Chapter 1. Part I: Text Processing with Built-in JavaScript Methods • 52


    The countWord() function returns the total number of occurrences of the word in
    the str string.


    # Discussion


    The countWord() function accepts three arguments:


    +   - str: A string containing the text to search for a word

    - word: A string representing the word to count in the word

    - caseSensitivity: A Boolean value indicating whether the search should be case
    insensitive


    Inside the function, we check the value of caseSensitivity. If it has a value
    of false, we convert the string to lowercase with the lower() method. Then we
    split the str input at each occurrence of word and return the number of resulting
    substrings, which is equal to the number of word appears in str.


    Notice the subtraction at the end of the statement. If we pass a string having
    instance of "cougar" to split(), it returns an array with two items. The subtraction
    is necessary to offset one item and get the correct:


    ```

    part_1/counting_a_specific_word/split_ex2.js

    const str = "The word cougar is borrowed from the Portuguese çucuarana.";

    const word = "cougar";

    ```


    ```

    str.split(word);

    // ["The word " is borrowed from the Portuguese çucuarana."]

    ```


    split() is one of those versatile JavaScript tools that come in handy in many
    different situations. In this recipe, we incorporated split() in a function to
    count the occurrences of a specific word. But as you''ve seen in recipes like
    Recipe 3. Matching the Beginning or End of a String with startsWith() and endsWith(),
