  md: '# Discussion


    In this recipe begins with a negative lookahead that prohibits the occurrence
    of D, F, I, O, Q, or U at any position within the string. Because of their resemblance
    to other characters, the letters D, F, I, O, Q, and U are excluded from Canadian
    postal codes. This is because D, I, and O can be confused with 0, 1, and respectively,
    while F, Q, and U can be mistaken for E, 0, and V.


    The pattern * at the beginning of the negative lookahead tells the regex engine
    that the character type sought can appear anywhere in the string, not just at
    the beginning.


    Canadian postal codes cannot start with the letters W or Z. To ensure that the
    first character of the string is not W or Z, we use the character class [A-VXY].
    This tells the regex engine that the character must be any letter from A to V
    or X or Y, but not W or Z.


    With the exception of the two aforementioned cases, Canadian postal codes follow
    a straightforward pattern of six alternating alphanumeric characters, with the
    option of a single space in the middle.


    Let''s dig a bit deeper into the pattern:


    ```

    /^(?![.*DFOUQ][A-VXY])\s?[0-9][A-Z][0-9]$/

    ```


    +   * asserts the position lookahead: asserts the start of the string

    * (?![.*DFOUQ]) negative lookahead: asserts the regex below dont match any character
    (except for line terminators)

    * matches the position between zero and unlimited times, as many times as possible

    * [DFIOQ] matches a single character in the string in the list below

    * [A-VXY] matches a single character in the range between A and V

    * O-V matches a single character in the range between A and Z

    * XY matches a single character in the list XY

    * [0-9] matches a single character in the range between 0 and 9

    * [A-Z] matches a single character in the range between A and Z

    * \ matches any whitespace character

    * [0-9] matches a single character in the range between 0 and 9

    * [A-Z] matches a single character in the range between A and Z

    * [0-9] matches a single character in the range between 0 and 9

    * $ asserts the position at the end of the string


    To locate a Canadian postal code in a string, ^ and S with word boundaries (\b):
    /\b(?![.*DFOUQ][A-VXY])[0-9][A-Z][0-9]\b/.


    By validating postal codes, you can avoid errors in data entry, resulting in more
    efficient and reliable delivery of goods or services to the intended recipient.'
