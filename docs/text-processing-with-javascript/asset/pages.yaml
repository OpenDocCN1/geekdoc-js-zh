  md: '# Creating Your First Regular Expression


    Before using the recipes in Parts 2 and 3, you need to know how to implement regular
    expressions in your code. In JavaScript, you have two options for creating regular
    expressions: you can either use the RegExp() constructor or use the regex literal.
    When using the literal format, you''ll need to enclose the pattern in a pair of
    forward slash (/) characters, like this:


    ```

    part_2/first_regex/first_regex_ex1.js

    const re = /Hello/;

    ```


    This regex pattern is made of five characters that tell the regex engine to find
    a direct match for “Hello” in a string. A pattern can be as simple as a single
    character such as “i”. If there are multiple occurrences of “i” in a string, it
    matches the first one.


    For example, in the string “If opportunity doesn''t knock, build a door,” the
    regex matches the “i” in “opportunity,” not “build.” It also does not match the
    “I” in “If” because word uses a capital letter. As you will learn in this part,
    you can use flags to configure your regular expression to continue searching after
    the first match or ignore the letter case.


    Let''s look at another example:


    ```

    part_2/first_regex/first_regex_ex2.js

    const str1 = "123";

    const str2 = "321";


    console.log(re.test(str1)); // true

    console.log(re.test(str2)); // false

    ```


    When running this code, the regex engine tries to find “1,” immediately followed
    by a “3.” This pattern exists within the first string, so test() returns true,
    although the second string contains the same characters, they''re not counted
    as a match because they''re not in the correct order.


    JavaScript provides several methods to determine whether a pattern exists in a
    string. The test() method is the simplest one. It returns true if a match exists
    in the given string or false otherwise.'
