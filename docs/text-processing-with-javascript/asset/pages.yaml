  md: "# Solution\n\nUse the Intl.Segmenter() constructor:\n\n```\npart_1/counting_characters/char_segmenter_ex2.js\n\
    function getLength(str) {\n  return [....new Intl.Segmenter().segment(str)].length;\n\
    }\n\ngetLength(\"\\uD83D\\uDE00\"); // 1\ngetLength(\"\U0001F60A\"); // 2\n```\n\
    \nThis function returns the number of Unicode segments in the input string. In\
    \ other words, it determines the length of the given string based on the number\
    \ of Unicode characters, rather than the number of code units.\n\nBrowser Compatibility\n\
    Segmenter() is a part of the Internationalization API. While most browsers have\
    \ supported the Internationalization API features for years, Segmenter() is a\
    \ relatively newer feature that remains unsupported in Firefox (at the time of\
    \ this writing).16\nThere are some Unicode-aware libraries like Graphemer let\
    \ you split JavaScript strings into separate letters,17 aren't perfectly consistent\
    \ with those from Segmenter. There's no perfect way to emulate the behavior of\
    \ Segmenter() in browsers, because doing so requires lots of language-specific\
    \ rules.\nUntil browser support is more solid, you can run Intl.Segmenter() on\
    \ the server side (supported since Node 16).\n\n# Discussion\n\nThe Intl.Segmenter()\
    \ constructor allows us to segment a string according to specified locale and\
    \ granularity. In this case, we are using the default implementation, so we can\
    \ call the method with no arguments. Because Intl.Segmenter() is a constructor,\
    \ we need to call it with the new keyword.\n\nThe returned object has a segment()\
    \ method, which accepts a single-string argument. The segment method segments\
    \ the string, as its name suggests, meaning it splits the string into user-perceived\
    \ character boundaries. Because the returned value is an iterator, we can use\
    \ the spread syntax (...) to expand\n\n+   16. https://caniuse.com/mdn-javascript-builtins_intl_segmenter_segment\n\
    17. https://github.com/flmnt/graphemer"
