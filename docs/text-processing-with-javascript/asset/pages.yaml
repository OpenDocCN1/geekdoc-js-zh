    The following table lists all supported flags along with their corresponding properties.
    Note that all these properties are read-only:


    | Flag | Corresponding Property |

    |---|---|n| d | hasIndices |

    | g | global |

    | i | ignoreCase |

    | m | multiline |

    | s | dotAll |

    | u | unicode |

    | y | sticky |


    Use the flags to retrieve the flags of a regex object. And use the source property
    to retrieve the source text of a regex object. Remember, the returned value by
    source is without the two forward slashes on the sides or flags. These properties
    are mainly helpful when you want to construct a new pattern from an existing one.


