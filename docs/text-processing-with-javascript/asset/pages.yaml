    \ re = /word/dg;\n\nconsole.log(re.exec(str).indices[0]); // [0, 4]\nconsole.log(re.exec(str).indices[0]);\
    \ // [6, 10]\n```\n\nWhen we set the d flag in a regex, an index property will\
    \ be available in the result of exec(), match(), and matchAll(). Here, we're using\
    \ the exec() method, which is similar to match() that it provides in the global\
    \ mode too (Appendix 2, Implementing Regex in JavaScript, on page 195).\n\nThe\
    \ regex in this recipe uses the RegExp constructor because we are constructing\
