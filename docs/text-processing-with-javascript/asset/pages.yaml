  md: "# Determining If a Value Is a String with the typeof Operator\n\n# Task\n\n\
    In Javascript, you will often need to validate that a value is a string. For example,\
    \ in the next recipe, we'll build a function that searches for multiple words\
    \ in a string. Before you pass a value to the function, you'd want to check if\
    \ it's a string. Any other data type, like a number or Boolean, would cause your\
    \ function to throw an error.\n\nThroughout this book, you will see functions\
    \ of this sort repeatedly, so it's a good place to start.\n\n# Solution\n\nUse\
    \ the typeof operator:\n\n```\npart_1/determining_valid_strings/typeof_ex1.js\n\
    function isString(value) {\n  return typeof value === \"string\";\n}\n\nisisString(123);\
    \      // -> false\nisisString(\"abc\");    // -> true\n```\n\nThe typeof operator\
    \ returns a string indicating the value's type.\n\n# Discussion\n\nIn JavaScript,\
    \ you can create a string literal with single or double quotes or the backticks:\n\
    \n```\npart_1/determining_valid_strings/typeof_ex2.js\nlet str1 = \"string\";\n\
    let str2 = 'string';\nlet str3 = 'string';\n```\n\nSo, a number enclosed in quotation\
    \ marks or backticks is not a number but a string. You can also create a string\
    \ with the String() constructor if you call it without the new keyword:\n\n```\n\
    part_1/determining_valid_strings/typeof_ex3.js\nString(123);      // -> \"123\"\
    \n```"
  merge: -1
  pgno: 14
- img_proc: true
  md: "In a string, each character occupies a position. Index 0 corresponds to the\
    \ first character, index 1 to the second character, and so on. To get the second\
    \ character in a string, you can get str[1];\n\n```\n```javascript\\part_1/determining_valid_strings/typeof_ex4.js\n\
    let str = \"string\";nconsole.log(str[1]); // t\n```\n```\n\nNext up, we'll begin\
    \ our journey into the realm of JavaScript text processing methods by building\
    \ a function that checks whether a string contains a list of words.\n\n# Checking\
    \ a String for Specific Words with includes()\n\n# Task\n\nSuppose you're building\
    \ an online bakeshop and want to filter messages they can be routed to the correct\
    \ baker. You need to check the strings in incoming emails to account for different\
    \ spells of words like \"doughnut\" versus \"donut\". You can't use the includes()\
    \ method alone because it allows you to look for only a single word.\n\n# Solution\n\
    \nPut the words you want to search for in an array. Create a function that accepts\
    \ two arguments: a string to search and an array of words. Inside the function,\
    \ search for each word in the string and return true if at least one is successful:\n\
    \n```\n```javascript\\part_1/checking_specific_words/includes_ex1.js\nconst msg\
    \ = \"\"I'd like to order two donuts\";\nconst words = [\"doughnut\", \"donut\"\
    ];\n\nfunction hasSomeWords(str, arr) {\n  return arr.some(el => str.includes(el));\n\
    }\n\nhasSomeWords(msg, words); // true\n```\n```\n\nThe some() method returns\
    \ true if at least one element in the array passes the test implemented by the\
    \ includes() first implemented by the given function."
  merge: -1
