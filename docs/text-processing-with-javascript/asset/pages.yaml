    The pattern {n,m} lets us match the preceding item at least n times and at most
    m times (n and m must be positive integers).


    The regex in this code begins with a caret (^) and ends with a dollar sign ($).
    We don''t want to match anything other than a 4-6 digit input, so we delimit the
    pattern with ^ and ($ (for further explanation of caret and dollar, see Recipe
    24, Asserting the Start or End of a String with ^ and S, on page 65).


