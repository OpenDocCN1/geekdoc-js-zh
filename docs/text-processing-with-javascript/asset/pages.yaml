  md: '# Discussion


    Symbols in the Unicode standard have various properties and property values. With
    Unicode property escapes, regex can match characters based on their Unicode properties.


    In this recipe, we are using \p{Number} to match every symbol in the Number category,
    including Roman numerals and numbers classified as compatibly equivalent:


    ```

    part_2_unicode_property_escapes_p1/upe_p1_ex4.js

    const re = /^\p{Number}{4,6}$/u;

    console.log(re.test("XXIVIII")); // -> true

    console.log(re.test("②③④")); // -> true

    ```


    If you want to exclude non-decimal numbers, you can use \p{DecimalNumber} instead:


    ```

    part_2_unicode_property_escapes_p1/upe_p1_ex5.js

    const re = /^\p{DecimalNumber}/u;

    console.log(re.test("XXIVIII")); // -> false

    console.log(re.test("½¾¼½")); // -> false

    console.log(re.test("IIPPF")); // -> true

    ```


    Remember, it’s possible to use Unicode property escapes only when the u flag is
    set. If no u flag is present, the pattern \p is a redundant escape sequence for
    the letter p. This is by design so that existing patterns that might use \p{ ...
    } would not break with the introduction of the Unicode property escapes into the
    language.


    # Negated Unicode Property Escapes


    > Unicode property escapes also have a negated version denoted by \P{...}, which
    matches the opposite of what they normally match. For example, if you wanted to
    match a string that doesn’t have a number, you would write:


    /^\P{Number}$/u


    ![](img/eeb15adcfef82a304df42444e25add78_148_0.png)'
