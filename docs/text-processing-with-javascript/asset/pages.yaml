  md: "# Formatting Dates with Intl.DateTimeFormat() • 33\n\nA language tag is composed\
    \ of one or more subtags, which identify the language, script, region, and other\
    \ language-related information. For example, \"en-GB\" is a language tag that\
    \ represents British English, where \"en\" identifies the language and \"GB\"\
    \ indicates the region. The BCP-47 is widely used in software development to ensure\
    \ consistent language support across different platforms.\n\nIn this solution,\
    \ we've used the \"en-US\" to indicate American English. But, if you're delivering\
    \ a product to France, for example, you should use the \"fr-FR\" tag to identify\
    \ the French:\n\n```\npart_1/formatting_dates/adding_days_ex2.js\nfunction addDaysToToday(days)\
    \ {\n  const d = new Date();\n  d.setDate(d.getDate() + days);\n  return d;\n\
    }\n\nfunction getFormattedDate(locale, date) {\n  const formatter = new Intl.DateTimeFormat(locale,\
    \ {dateStyle: \"full\"});\n  return formatter.format(date);\n}\n\nconst dayAfterTomorrow\
    \ = addDaysToToday(2);\nconst msg = \"Nous livrerons votre achat\"\nconsole.log(msg\
    \ + getFormattedDate(\"fr-FR\", dayAfterTomorrow));\n// Nous livrerons votre achat\
    \ mercredi 12 avril 2023\n```\n\n# Converting a String to a Date Object\n\n![](img/eeb15adcfef82a304df42444e25add78_45_0.png)\n\
    \nConsider using the Intl.DateTimeFormat constructor when working with date and\
    \ time lets you date formatting for different languages, set the style for date\
    \ and time, define a numbering system for languages such as Thai and Arabic. For\
