  md: '# Early Praise for Text Processing with JavaScript


    There''s nothing *regular* about working with regular expressions. Turn the mundane
    yet tedious task of processing textual data into a manageable and even a fun experience
    using the techniques and recipes in this book.


    +   - **Dr. Venkat Subramaniam**nAward-winning author and founder of Agile Developer,
    Inc


    While it would be easy for a book like *Text Processing with JavaScript* to spend
    all of its time on regular expressions, here you''ll also find ample discussion
    and computationally expensive string methods in JavaScript. Whatever your text-processing
    task, this book will point you to the right API for the job. And even readers
    who might not be doing heavy-duty text processing will benefit from the coverage
    here of multi-byte character sets and presentations of various non-Western-Latin
    alphabets, including emoji, which is a tremendously useful resource in its own
    right.


    +   - **Karl Stolley**nWeb developer and author of *Programming WebRTC*


    A wealth of JavaScript tips, tricks, and tools, *Text Processing with JavaScript*
    is loaded with recipes ranging from password validation to internationalization
    to simply working with formatted numbers. Faraz shows you the built-in functions
    you can use to tackle your JS problems, expands to regular expressions for any
    complex situations you may face.


    +   - **Michael Fazio**nEngineering Manager at Albert and author of *Kotlin and
    Android Development_featuring Jetpack*'
