  md: '# Validating Password Strength


    # Task


    Suppose your task is to check whether the passwords entered by users when signing
    up for a user account on your website are resistant to guessing or brute-force
    attacks. Usually, companies establish a password policy that outlines the criteria
    for creating and using passwords, which set requirements such as:


    +   - Having a minimum length of 8 characters or more

    - Containing both uppercase and lowercase letters

    - Containing one or more numerical digits

    - Containing special characters like @, #, S, etc

    - Foridding words listed in the password blocklist

    - Foridding words related to the user''s personal information

    - Foridding the use of the company name or its abbreviation

    - Foridding passwords that match the date of birth, license plate number, phone
    number, or other frequently used numbers


    The specific guidelines for usage can vary significantly depending on the business
    and system. So, this recipe provides a variety of regrets that you can use as
    building blocks to create customized validation rules according to your needs.


    For matching non-English characters/digits, use the Unicode variants represented
    by \p(...) along with the u flag.


    # Solution


    Containing at least one ASCII uppercase letter (recall that (?= ...) is a positive
    lookahead):


    ```

    (?=.*[A-Z])

    ```


    Containing at least one Unicode uppercase letter:


    ```

    (?=.*\p{Uppercase})

    ```'
