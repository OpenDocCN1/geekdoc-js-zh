  md: 'Use the word boundary (|) when looking for ''whole words'' in a string, be
    wary of accented characters, hyphens, and apostrophes since they qualify as word
    breaks. And use the negated version of the word boundary (non-word boundary \B)
    to match a position that \| does not.


    # ## Matching One of Several Alternatives with the Vertical Bar (|)


    # ### Task


    Imagine you want to match specific variations of the word “week,” including “weekend”
    and “weekly,” but not “weekday.” You want the match to be at word boundaries,
    so other words like “Newsweek” wouldn''t count as a match. What you need is a
    way to define alternative patterns in the regex.


    # ### Solution


    Use a bar bar) to form an alternation. The vertical bar character will tell the
    regex to match any one of a series of patterns:


    ```

    part_2/vertical_bar/vertical_bar_ex1.js

    const re = /\bweek|\bweekend|\weekly\b;

    re.test("How do you earn per week?"); // true

    re.test("Employees are paid weekly."); // true

    re.test("The office is closed on the weekend."); // true

    re.test("Your story could be featured on Newsweek!"); // false

    ```


    The regex engines match everything left of the vertical bar or right. The pattern
    in has three alternatives, each enclosed in a pair of word boundaries. So, it
    will only match “week,” “weekend,” or “weekly.”


    # ### Discussion


    If you want to add other symbols to the pattern but don''t want them to be part
    of the alternation, you can use parentheses. Using parentheses will limit the
    scope of the alternation.


    Remember, a bar matches matches everything to the left or everything to the right.
    So, if you wanted to match “this week” or “this weekend,” you could write /\bthis
    (week|weekend)\b/.'
