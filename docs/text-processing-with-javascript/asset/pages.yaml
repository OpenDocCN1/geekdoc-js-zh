  md: "# Solution\n\nCapture the repeated whitespace with a capturing group and reference\
    \ it with $1:\n\n```\npart_3/removing_dup_whitespaces_same_type/removing_dup_whitespaces_ex1.js\n\
    const str = \\\n`My list:\n  1. Item one\n  2. Item two\n  3. Item three`;\n\n\
    function removeExtraWhitespaces(str) {\n  const re = /(\\s)\\1+/g;\n  return str.replace(re,\
    \ \"$1\");\n}\n\nremoveExtraWhitespaces(str);\n// My list:\n// 1. Item one\n//\
    \ 2. Item two\n// 3. Item three`\n```\n\nThis function replaces duplicate whitespaces\
    \ with a single whitespace of the same type.\n\n# Discussion\n\nIn this recipe,\
    \ str holds a list of items where each item is indented with a tab character (\\\
    t). The first item, however, has an extra tab character that we want to remove.\
    \ In the function, we use (s)\\1+ to match any whitespace character followed by\
    \ one or more occurrences of the same whitespace character.\n\nBecause we want\
    \ to replace all these tab characters with a single tab character, we use a backreference\
    \ to match the same character that was matched by the capturing group (s).\n\n\
    Then, we use the special replacement pattern $1 to replace the matched characters\
    \ with the same type of whitespace. The g flag at the end of the regular expression\
    \ indicates global matching, meaning it will search for all occurrences of the\
    \ pattern in the input string."
