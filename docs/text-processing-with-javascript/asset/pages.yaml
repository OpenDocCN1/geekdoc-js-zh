  md: '# Matching Unicode Word Boundaries with the Unicode Property Escape


    # Task


    Suppose you want to search a document for the Portuguese word "vã", which means
    "go" without matching other words that contain "vã," such as "vão". To achieve
    this, you try using word boundaries to isolate the word "vã" from other words
    containing similar characters:


    ```

    part_2/unicode_property_escapes_p3/upe_ex1.js

    const re = /\bvã\b/;

    "vã".match(re);

    // -> ["vã", index: 0, "vã bem", groups: undefined]

    "vã bem".match(re);

    // -> null

    ```


    But, your regex is the opposite of your intended result. The problem is that the
    word boundary (|b) considers accented characters such as "ã" as non-word characters.
    You need an alternative solution that doesn''t share the same limitation.


    # Solution


    Use a combination of Unicode property escapes to match word boundaries in Unicode
    characters:


    ```

    part_2/unicode_property_escapes_p3/upe_ex2.js

    let re = /(?<=\p{L}|\p{M}|\p{Nd}|\p{Pc}))^vã(?=\p{L}|\p{M}|\p{Nd}|\p{Pc})$/;

    "vã".match(re);

    // -> null

    "vã bem".match(re);

    // -> ["vã", index: 0, input: ''vã bem'', groups: undefined]

    ```


    Successful outcome! The regex is now able to correctly match the word boundary
    in Portuguese and other languages.'
