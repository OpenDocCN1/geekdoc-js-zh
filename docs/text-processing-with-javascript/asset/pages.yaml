  md: 'character using different codes, and they were only able to encode a small
    number of characters.


    Unicode aims to solve this problem by unifying all character encoding systems
    and replacing them with a universal character encoding standard supporting every
    character in every writing system and language in the world. By providing a standard
    to encode multilingual text, Unicode creates the foundation for developing global
    software.


    Prior to the introduction of the Unicode standard, most programs supported a small
    set of encodings. They were designed primarily for larger markets due to the cost
    and complexity of developing specific versions of programs for smaller markets.
    Furthermore, converting text between different programs posed a risk of corruption.
    Unicode''s ability to easily exchange text data internationally enables programs
    to function anywhere in the world.


    To achieve this, Unicode uses more bits to encode each character, allowing more
    space for encoding. At this time, the most recent version of the Unicode standard,
    Unicode 15.0, contains a collection of 149,186 characters from many modern and
    historic scripts.


    In addition to including modern and classical forms of many languages from around
    the world, the standard contains important symbol sets, including punctuation
    marks, mathematics symbols, currency symbols, technical symbols, emojis, dingbats,
    and geometric shapes.


    With a capacity of over one million characters, Unicode is more than enough for
    encoding text in most writing systems. But, capacity limitation in fonts means
    no one set supports all Unicode characters. So though Unicode provides a way to
    display the characters, they won''t display if they are not part of the font being
    used.


    The reason behind this is that a font can only have 16 bits of glyph identifiers,
    which corresponds to 65,536 glyphs (note that a glyph is different from a character).
    As a result, it has been technically impossible to represent all +149,186 characters
    of Unicode with a single font.


    Characters in Unicode are represented in three encoding forms:


    +   * 8-bit form (UTF-8)

    * 16-bit form (UTF-16)

    * 32-bit form (UTF-32)


    1. https://help.fontlab.com/fontlab/7/manual/About-Glyphs/'
