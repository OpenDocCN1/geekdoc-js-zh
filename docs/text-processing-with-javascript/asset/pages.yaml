  md: "Matching Formatted Numbers with Thousand Separators * 175\n\nMatching a floating-point\
    \ value with optional sign and integer but mandatory fraction:\n[-+]]?\\d*\\.\\\
    d+\n\n# Example:\n\nLet's extract the first floating-point number that appears\
