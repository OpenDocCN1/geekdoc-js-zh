  md: "This approach is not the same as just repeating a token or group with a quantifier.\
    \ To illustrate, let's compare two simple regular expressions: \\d{2} and (\\\
    d)\\1. The first one uses a quantifier to match any two digits, while the second\
    \ one uses a capturing group and backreference to match the same digit twice.\n\
    \nNow, let's take a look at the regex step by step:\n\n```\n/b([-\\w]+)\\s1\\\
    b/ig\n```\n\n+   * \\b asserts the position at a word boundary\n* ([-\\w]+) 1\
    \ capturing group\n  * [-\\w]+ matches a single character literally\n  * ' matches\
    \ a ' character literally\n  * \\w matches any word character\n  * + matches the\
    \ previous token one or more times\n  * \\s matches any previous whitespace character\n\
    \  * + matches the previous token one or more times\n  * \\1 matches the same\
    \ text matched by the 1st capturing group\n  * \\b asserts the position at a word\
    \ boundary\n* Flags\n  * i: enables case-insensitive matching\n  * g: enables\
    \ global, which returns all matches\n\nThe regex in this recipe starts by matching\
    \ a word boundary (\\b). This ensures that we are only matching whole words. Then,\
    \ we use a capturing group ([-\\w]+) to match one or more occurrences of any combination\
    \ of letters, digits, underscores, and apostrophes. It's important to match hyphens\
    \ and apostrophes because we want to be able to detect repeated words as \"check-in-check\"\
    \ and \"can't.\"\n\nAfter capturing the first word, we use \\s+ to match one or\
    \ more whitespace characters (such as spaces and tabs) between the first and second\
    \ occurrence of the captured group. Next, we use the backreference \\1 to ensure\
    \ the second occurrence is the same as the first. The regex ends with another\
    \ boundary (\\b).\n\nTo execute the regex, we use the replace() method. replace()\
    \ takes the regex as its first argument, attempts to find a match in the given\
    \ string, and replaces it with its second argument. In this case, the replacement\
    \ is $1, which is a special pattern for referring to the first capturing group.\
    \ The result is the matched substring, which is “No,” replaced with “No.\\ For\
    \ more special replacement replacements, see Recipe 34, Using Special Replacement\
    \ Patterns, on page 91."
