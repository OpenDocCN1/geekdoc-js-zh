  md: '# Groups and Backreferences


    | Syntax | Group Type | Description |

    | --- | --- | --- |

    | (x) | Capturing Group | Captures the matched substring and assigns it a group
    number. |

    | (?<Name>) | Named Capturing Group | Captures the matched substring by name and
    assigns it a group number. |

    | (?:x) | Non-Capturing Group | Matches "x" but does not capture it as a group.
    |

    | \n | Backreference | Matches the same text as the nth captured group. |

    | k<Name> | Backreference to a Named Capturing Group | Matches the same text as
    the nth named captured group. |


    # Flags


    | Syntax | Flag Type | Description |

    | --- | --- | --- |

    | g | global | Finds all matches, not just the first. |

    | i | ignoreCase | Matches upper and lowercase characters. |

    | s | dotAll | Allows the dot (.) to match newlines. |

    | u | unicode | Enables various Unicode features. |

    | y | sticky | Matches only at the current position in the target string. |

    | d | hasIndices | Enables the result of a match to contain the start and end
    indices of the substrings. |

    | m | multiline | Matches the beginning or end of each line in a string, not just
    the beginning or end of the string itself. |


    # Unicode Property Escapes


    | Syntax | Type | Description |

    | --- | --- | --- |

    | \p{UnicodePropertyValue} | Positive Unicode Property Escape | Matches characters
    based on their Unicode properties. |

    | \P{UnicodePropertyValue} | Negative Unicode Property Escape | Matches any character
    that does not have the specified Unicode property value. |'
