  md: 'Chapter 2. Part II: Text Processing with Regular Expressions • 90


    ```

    part_2/named_capturing_group/ncg_ex1.js

    const re = /(\d{2}):(\d{2}):(\d{2})\s(\w{2})/;

    const match = "09:30:00 AM".match(re);


    console.log(match[1]);

    console.log(match[2]);

