    # Recipe 18


    # Counting Unicode Characters with Intl.Segmenter()


    # Task


    Let''s say you have an app that requires user registration and includes a text
    input for the user''s bio. The bio may be in any language and include emojis.
    You want to limit the length of the bio to precisely 120 characters. Easy! Use
    the length() method to get the number of the characters:


    ```

    console.log("\ud83d\udf10".length); // → 2

    console.log("\ud83e\uddd1".length); // → 4

    ```


    This is probably not the result you expected. Strings in JavaScript are based
    on UTF-16, which represents characters using one or two 16-bit integers. Some
    characters, such as the Chinese character for kǒu cái (eloquence) and the cat
    emoji, require two 16-bit units (surrogate pairs) to encode. The length() method
    gives you the number of UTF-16 code units in a string, not the number of characters.


    # Supplementary Characters


    > Characters that are made of a pair of 16-bit surrogate code units are known
    as supplementary characters.'
