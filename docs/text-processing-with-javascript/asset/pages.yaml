    # Discussion


    We can match a token repeatedly using a quantifier. {4} is a quantifier that tells
    the regex engine to match its preceding precisely four times. The pattern [0-5]{4}
    is equivalent to [0-5][0-5][0-5][0-5], which is easier to read and write.


    If we use a quantifier to repeat a character, the entire class will be repeated,
    not just the character. For example, the pattern [car]{3} matches three consecutive
    characters of "c","a,"r":


    ```

    part_2/quantifiers/quantifiers.ex3.js

    const re = /[car]{3}/;

    re.test("car"); // -> true

    re.test("arc"); // -> true

    re.test("carbon"); // -> true (matches the first three characters)

    ```


    To repeat the same character matched by a class, we can use a backreference (discussed
    later in Recipe 46, Referencing a Matched String with the Backreference, on page
    123).


    A character class is the only place in regex where quantifiers don''t have a special
    meaning. For example, .[c{3}] matches a single character''s "c","3," or ".". To
    take away the special meaning of a quantifier outside a character class, for instance:


    ```

    part_2/quantifiers/quantifiers.ex4.js

    const re = /\{7\}/;

    re.test("{7}"); // -> true

    re.test("7"); // -> false

    re.test("abc"); // -> false

    ```


    In this pattern, \{ matches the character { literally. Without a backslash, it
