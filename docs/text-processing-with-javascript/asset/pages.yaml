  md: '# Regular Expression Cheat Sheet


    Regular expressions can be complex and difficult to remember. That''s where a
    cheat sheet comes in handy. This quick reference guide provides a summary of the
    regex syntax in JavaScript and its meanings, making it easy to find and use the
    right pattern for your needs.


    # Character Classes


    | Syntax | Description |

    | --- | --- |

    | . | Matches any character except newline. |

    | \w | Matches any word character (letter, digit, or underscore). |

    | \W | Matches any non-word character. |

    | \d | Matches any digit character. |

    | \D | Matches any non-digit character. |

    | \s | Matches any whitespace character. |

    | \S | Matches any non-whitespace character. |

    | [abc] | Matches any of the characters inside the brackets. |

    | [^abc] | Matches any character not inside the brackets. |

    | [a-z] | Matches any character between a and z (inclusive). |'
