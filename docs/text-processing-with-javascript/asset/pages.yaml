  md: '# part_1_equalizing_characters/normalize_ex3.js


    ```

    const str1 = "\u00E9"; // é

    const str2 = "\u0065\u0301"; // é

    console.log(str1 == str2); // -> false

    // normalize str1

    const strnorm = str1.normalize("NFD"); // \u0065\u0301

    console.log(strnorm === str2); // -> true

    ```


    In this code, we are replacing any canonical composition in str1 with decomposed
    forms. If we pass NFC to normalize(), the method does the opposite:


    # part_1_equalizing_characters/normalize_ex4.js


    ```

    const str1 = "\u00E9"; // é

    const str2 = "\u0065\u0301"; // é

    // normalize str2

    const str2norm = str2.normalize("NFC"); // \u00E9

    console.log(str2norm === str1); // -> true

    ```


    > If you pass no argument to normalize(), it will use NFC.


    There are two forms of compatibility normalization: NFKD and NFKC. Conversion
    to NFKD works just like NFC. It replaces canonical composites in the string with
    their decomposed forms. Additionally, it replaces any compatibility composites
    with their decomposition form.


    If the glyph is just a composition of another glyph, normalizing with NFD or NFC
    will not change it. On the other hand, both NFKD and NFKC will replace the glyph
    with their compatibility decomposition:


    # part_1_equalizing_characters/normalize_ex6.js


    ```

    const str1 = ""; // \u2465

    console.log(str1.normalize("NFD")); // -> Ⅵ(\u2465)

    console.log(str1.normalize("NFC")); // -> Ⅵ(\u2465)

    console.log(str1.normalize("NFKD")); // -> 6 (\u0036)

    console.log(str1.normalize("NFKC")); // -> 6 (\u0036)


    const str2 = "ﬁ"; // \u2076

    console.log(str2.normalize("NFD")); // -> 6(\u2076)

    console.log(str2.normalize("NFC")); // -> 6(\u2076)

    console.log(str2.normalize("NFKD")); // -> 6 (\u0036)

    console.log(str2.normalize("NFKC")); // -> 6 (\u0036)

    ```'
