  trans: "\n\n![](img/cover00118.jpeg)\n\n零基础初学者 JavaScript 编程基础\n作者 TAM SEL\n\n#\
    \ JAVASCRIPT\n\n这本 JavaScript 教程让初学者和专家都能轻松学习 JavaScript。\n\n学习 JavaScript，你只需要对计算机有基础的了解。\n\
    \n# JAVASCRIPT 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>欢迎来到 JavaScript</h2>\n\
    \  <script>\n    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n\
    ```\n\n可以通过在代码中添加 JavaScript 语句来实现 JavaScript。\n\n`<script>...</script>`。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n\
    \    document.write(\"Hello World\");\n  </script>\n</body>\n</html>\n```\n\n\
    ### JavaScript 代码可以在 JavaScript 中写在 3 个地方：\n\n1. 在 HTML 的 `<body>`...`</body>`\
    \ 标签之间。\n2. 在 HTML 的 `<head>`...`</head>` 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\
    \n### 示例（在 body 标签之间编写代码）\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n    alert(\"Hello world\");\n  </script>\n</body>\n\
    </html>\n```\n\n### 示例 2（在 head 标签之间编写代码）\n\n我们将在下例中创建一个函数 `msg()`。在 JavaScript\
    \ 中，你必须在函数名后编写函数体来构造函数。要调用一个方法，我们必须先创建一个实例。在这个例中，我们使用点击事件来调用 `msg()` 函数。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\">\n    function\
    \ msg() {\n      alert(\"Hello world\");\n    }\n  </script>\n</head>\n<body>\n\
    \  <p>欢迎来到 Javascript</p>\n  <form>\n    <input type=\"button\" value=\"click\"\
    \ onclick=\"msg()\"/>\n  </form>\n</body>\n</html>\n```\n\n### 外部 JavaScript 文件\n\
    \n我们可以构建一个可以在 HTML 文件中使用的 JavaScript 文件。\n\n由于单个 JavaScript 文件可以在多个 HTML 页面中使用，因此它允许代码的复用。\n\
    \n它提高了网页的效率。\n\n该文件必须具有 `.js` 扩展名。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <script type=\"text/javascript\" src=\"message.js\"></script>\n</head>\n<body>\n\
    \  <p>Hello world</p>\n  <form>\n    <input type=\"button\" value=\"click\" onclick=\"\
    msg()\"/>\n  </form>\n</body>\n</html>\n```\n\n# JavaScript 注释\n\nJavaScript 中的注释用于描述代码。它用于添加代码相关的内容，例如警告或建议，以便最终用户能够理解。\n\
    \n## JavaScript 注释的类型\n\nJavaScript 注释有两种类型：\n\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n\
    \n双正斜杠（`//`）用于表示单行注释。在程序运行时，双正斜杠（`//`）到行尾之间的任何文本都会被忽略。\n\n例如：在语句之前添加注释。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    // 单行注释 //\n    document.write(\"\
    hello world\");\n  </script>\n</body>\n</html>\n```\n\n例如：在语句之后添加注释。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var a=10;\n    var b=20;\n  \
    \  var c=a+b; // 相变量 a 和 b 的值\n    document.write(c); // 打印 10 和 20 的和\n  </script>\n\
    </body>\n</html>\n```\n\n### 输出\n30\n\n## 多行注释\n\n单行和多行注释也可以用于多行注释。跨越多行的注释以 `/*`\
    \ 开始，以 `*/` 结束。JavaScript 将忽略它们之间的文本。\n\n### /* 在此处编写注释 */\n\n#### 示例\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    /* 这是一个多行注释。 \n    它不会被显示 */\n\
    \    document.write (\"Example of JavaScript multi line comment\");\n  </script>\n\
    </body>\n</html>\n```\n\n# JavaScript 变量\n\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。\n\
    \n在使用变量之前，我们必须先声明它。要声明一个变量，我们使用关键字 `var`，如下：\n\n`var name;`\n\n变量有两种类型：\n\n1.\
    \ 局部变量\n2. 全局变量\n\n局部变量——它在函数或块内部声明。\n\n#### 示例\n\n```javascript\nfunctionabc()\
    \ {\n  var x=10; // 局部变量\n}\n```\n\n全局变量——它具有全局作用域，意味着它可以在 JavaScript 代码的任何地方指定。\n\
    \n在函数外部声明变量。\n\n#### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
    \    var data=200; // 全局变量\n    function a() {\n      document.writeln(data);\n\
    \    }\n    function b() {\n      document.writeln(data);\n    }\n    a();\n \
    \   b();\n  </script>\n</body>\n</html>\n```\n\n### 在函数内部声明全局变量\n\n我们需要使用 `window`\
    \ 对象在函数内部声明全局变量。\n\n#### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
    \    function a() {\n      window.value=50; // 使用 window 对象声明全局变量\n    }\n   \
    \ function b() {\n      alert(window.value);// 从另一个函数访问全局变量\n    }\n    a();\n\
    \    b();\n  </script>\n</body>\n</html>\n```\n\n# JavaScript 数据类型\n\n它有多种数据类型来存储各种类型的值。\n\
    \n在 JavaScript 中，有两种数据类型。\n\n1. 基本数据类型（原始）。\n2. 非基本数据类型（引用）。\n\n### 由于 JavaScript\
    \ 是一种动态语言，我们不需要定义变量的类型，因为 JavaScript 引擎动态地使用它。在这种情况下，数据类型使用 `var` 定义。它可以存储任何类型的值，包括数字、字符串和对象。\n\
    \n### 示例\n\n```javascript\nvar a=\"Ram\"; // 字符串\nvar b=20; // 数字\nvar x={FirstName:'Ram',\
    \ lastName:'Doe'}; // 对象\n```\n\n### JavaScript 基本数据类型\n\nJavaScript 中有 5 种基本数据类型。\n\
    \n![](img/image00105.jpeg)\n\n## JavaScript 非基本数据类型\n\n有 3 种非基本数据类型如下：\n\n![](img/image00106.jpeg)\n\
    \n# 运算符\n\n运算符是 JavaScript 中用于对操作数执行操作的符号。通俗来说，3+2 等 5。这里的操作数是 3 和 2，运算符是 +。\n\
    \n以下是 JavaScript 中使用的运算符：\n\n1. 算术运算符。\n2. 比较（关系）运算符。\n3. 位运算符。\n4. 逻辑运算符。\n5.\
    \ 赋值运算符。\n6. 特殊运算符。\n\n## 算术运算符\n\n我们在算术运算符中对操作数进行算术运算。\n\n![](img/image00107.jpeg)\n\
