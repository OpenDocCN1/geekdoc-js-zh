    \n## Assignment operator\n\nThe following assign operators are supported by JavaScript.\n\
    \n![](Images/image00109.jpeg)\n\n### Bitwise Operators\n\nThe following bitwise\
    \ operators are provided by JavaScript:\n\n![](Images/image00110.jpeg)\n\n## Logical\
    \ Operators\n\nBoolean values are commonly used for logical operators.\n\nThe\
    \ logical operators are as follows:\n\n![](Images/image00111.jpeg)\n\n# Javascript\
    \ If Else\n\nA conditional statement in JavaScript is used to perform various\
    \ tasks depending on the conditions.\n\nIn JavaScript, there are three types of\
    \ statements:\n\n1. `if` Statement.\n2. `if else` Statement.\n3. `if else if`\
    \ Statement.\n\n## if statement\n\nIf the condition is true or false, the `if`\
    \ statement is used in JavaScript to execute the code.\n\n```javascript\nif (condition){\
    \   \n    //content to be evaluated\n}\n```\n\n![](Images/image00112.jpeg)\n\n\
    ### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\n\
    if(x>30){\n  document.write(\"value of x is greater than 30\");\n}\n</script>\n\
    </body>\n</html>\n```\n\n#### OUTPUT\nValue of x is greater than 30\n\n## if else\
    \ statement\n\nIf either condition is true or false, the `if else` statement is\
    \ used.\n\n### Syntax\n\n```javascript\nif(condition)\n{\n  // set of statements\n\
    }\nelse\n{\n  // set of statements\n}\n```\n\n![](Images/image00113.jpeg)\n\n\
    ### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=20;\n\
    if(x%2==0){\n  document.write(\"x is even number\");\n}\nelse{\n  document.write(\"\
    a is odd number\")\n}\n</script>\n</body>\n</html>\n```\n\n### OUTPUT\nX is even\
    \ number\n\n## If else if\n\nIt just looks at the material to see if the expression\
    \ is valid through several expressions. `else if` is a more advanced version of\
    \ the `if else` statement.\n\n### Syntax\n\n```javascript\nif (condition1)\n{\n\
    \  // Statement(s) to be executed if condition 1 is true\n}\nelse if (condition\
    \ 2)\n{\n  // Statement(s) to be executed if condition 2 is true\n}\nelse if (condition\
    \ 3)\n{\n  // Statement(s) to be executed if condition 3 is true\n}\nelse\n{\n\
    \  // Statement(s) to be executed if no condition is true\n}\n```\n\n### EXAMPLE\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50;\nif (x==10){\n\
    \  document.write(\"x is equal to 10\");\n}\nelse if(x==50){\n  document.write(\"\
    x is equal to 50\");\n}\nelse if(x==30){\n  document.write(\"x is equal to 30\"\
    );\n}\nelse{\n  document.write(\"a is not equal to 10, 50 or 30\");\n}\n</script>\n\
    </body>\n</html>\n```\n\n#### OUTPUT\nx is equal to 50\n\n# Javascript Switch\
    \ Statement\n\nIn JavaScript, the `switch` statement is used to execute a single\
    \ code under different conditions. It's the same as the `else if` statement.\n\
    \n![](Images/image00114.jpeg)\n\n### SYNTAX\n\n```javascript\nswitch (expression)\n\
    {\n  case 1: statement(s)\n  break;\n  case 2: statement(s)\n  break;\n  ...\n\
    \  case n: statement(s)\n  break;\n  default:statements(s)\n}\n```\n\n### EXAMPLE\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar grade='B';\nvar result;\n\
    switch(grade){\n  case 'A':\n    result=\"A Grade\";\n    break;\n  case 'B':\n\
    \    result=\"B Grade\";\n    break;\n  case 'C':\n    result=\"C Grade\";\n \
    \   break;\n  default:\n    result=\"No Grade\";\n}\ndocument.write(result);\n\
    </script>\n</body>\n</html>\n```\n\n## OUTPUT\nB Grade\n\n# JavaScript Function\n\
    \n## The ability to build new functions inside the `<script>.....</script>` tag\
    \ is an essential feature of JavaScript. The `function` keyword is used to declare\
    \ a function in JavaScript.\n\n## To reuse the file, we call the JavaScript function\
    \ multiple times.\n\n## Advantages - JavaScript functions\n\n1. Code reusability:\
    \ We use the same feature several times to save time and code.\n2. Less coding:\
    \ Our software is compressed as a result. When we perform a routine we don't write\
    \ a lot of code.\n\n### Syntax\n\n```javascript\nfunction Name(parameter)\n{\n\
    }\n```\n\n### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    function msg() {\n  alert(\"Hello!\");\n}\n</script>\n</body>\n</html>\n```\n\n\
    #### OUTPUT\nHello!\n\n## Function with arguments\n\n#### Call function by arguments.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction cube(number) {\n\
    \  alert(number*number);\n}\n</script>\n</body>\n</html>\n```\n\n#### OUTPUT\n\
    27\n\n### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction\
    \ name() {\n  alert(\"Welcome \" + prompt(\"Enter Name\"));\n}\n</script>\n</body>\n\
    </html>\n```\n\n## Function with return value\n\n#### Call function that return\
    \ value and use it in program.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    function getInfo() {\n  return \"How are you?\";\n}\n</script>\n<script>\ndocument.write(getInfo());\n\
    </script>\n</body>\n</html>\n```\n\n#### OUTPUT\nHow are you?\n\n## The Function()\
    \ Constructor\n\nA function statement isn't only for defining functions; it can\
    \ also be used to define functions dynamically using the `Function()` constructor.\n\
    \n### Syntax\n\n```javascript\nvar variename = new Function(Arg1, Arg2..., \"\
    Function Body\");\n```\n\n### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script>\nvar func=new Function(\"a\", \"b\", \"return a+b\");\nfunction secondFunction(){\n\
    \  var result;\n  result=func(50,50);\n  document.write(result); \n}\n</script>\n\
    </head>\n<body>\n<p>Click the function</p>\n<form>\n<input type=\"button\" onclick=\"\
    secondFunction()\" value=\"Call Function\">\n</form>\n<p>Use different parameters\
    \ inside the function and try yourself...</p>\n</body>\n</html>\n```\n\n## Function\
    \ Literals\n\nThe definition of function literals, which is another way to describe\
    \ functions, is introduced in JavaScript 1.2. It's an expression that describes\
    \ a function that doesn't have a name.\n\nThe syntax for a function literal is\
    \ similar to that of a function statement, except that it is used as an expression\
    \ rather than a statement, and there is no need for a function name.\n\n### Syntax\n\
    \n```javascript\nvar variename = function (Argument List){\n  Body\n};\n```\n\n\
    ### EXAMPLE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\nvar func=function(a,b){return\
    \ a+b};\nfunction secondFunction(){\n  var result;\n  result=func(10,20);\n  document.write(result);\
    \ \n}\n</script>\n</head>\n<body>\n<p>Click the button to call the function</p>\n\
    <form>\n<input type=\"button\" onclick=\"secondFunction()\" value=\"Call Function\"\
    >\n</form>\n</body>\n</html>\n```\n"
