    # JavaScript 日期


    Date 对象（期期对象）是 JavaScript 语言中内置的一种数据类型。新的 `Date` 对象用于构建数据对象 `()`。时间中的单个时刻由 JavaScript
    `Date` 实例表示。创建 JavaScript 日对象的唯一方法是使用 JavaScript 作为构造函数。


    ### 语法


    `Date()` 构造函数可以使用以下语法生成 `Date` 对象：


    - `new Date();`

    - `new Date(value);`

    - `new Date(dateString);`

    - `new Date(year, month, day, hours, minutes, seconds, milliseconds);`


    注意：括号内的参数始终是可选的。


    ### 描述


    ### year

    年份由一个整数表示。对于 2000 年到 2099 年，值的映射范围为 0 到 99。


    ### Month

    从 0（1 月）开始到 11（12 月）结束，这个整数代表月份。


    ### Date

    这是一个可选参数。月份的日期由一个整数表示。


    ### Hours

    这是一个可选参数。一天中的小时由一个整数表示。


    ### Minutes

    这是一个可选参数。时间中的分钟部分由一个整数表示。


    ### Seconds

    这是一个可选参数。秒段由一个整数表示。


    ### Milliseconds

    这是一个可选参数。时间的毫秒段由一个整数表示。


    ### Date 示例


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    var date=new Date();

    var day=date.getDate();

    var month=date.getMonth()+1;

    var year=date.getFullYear();

    document.write("<br>Date: "+day+"/"+month+"/"+year);

    </script>

    </body>

    </html>

    ```


