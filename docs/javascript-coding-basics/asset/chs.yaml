- "# JavaScript 编码基础\n\n\n\n![](img/cover00118.jpeg)\n\n\n\n这本 JavaScript 教程让初学者和专家都能轻松学习\
  \ JavaScript。\n\n学习 JavaScript，你只需要对计算机有基础的了解。\n\n# JAVASCRIPT 示例\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n  <h2>欢迎来到 JavaScript</h2>\n  <script>\n    document.write(\"\
  Hello Friends\");\n  </script>\n</body>\n</html>\n```\n\n可以通过在代码中添加 JavaScript 语句来实现\
  \ JavaScript。\n\n`<script>...</script>`。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  \  <script type=\"text/javascript\">\n    document.write(\"Hello World\");\n  </script>\n\
  </body>\n</html>\n```\n\n## JavaScript 代码可以在 JavaScript 中写在 3 个地方：\n\n1. 在 HTML\
  \ 的 `<body>`...`</body>` 标签之间。\n2. 在 HTML 的 `<head>`...`</head>` 标签之间。\n3. 在 `.js`\
  \ 文件中（外部 JavaScript）。\n\n### 示例（在 body 标签之间编写代码）\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n  <script type=\"text/javascript\">\n    alert(\"Hello world\");\n  </script>\n\
  </body>\n</html>\n```\n\n### 示例 2（在 head 标签之间编写代码）\n\n我们将在下例中创建一个函数 `msg()`。在 JavaScript\
  \ 中，你必须在函数名后编写函数体来构造函数。要调用一个方法，我们必须先创建一个实例。在这个例中，我们使用点击事件来调用 `msg()` 函数。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\">\n    function\
  \ msg() {\n      alert(\"Hello world\");\n    }\n  </script>\n</head>\n<body>\n\
  \  <p>欢迎来到 Javascript</p>\n  <form>\n    <input type=\"button\" value=\"click\"\
  \ onclick=\"msg()\"/>\n  </form>\n</body>\n</html>\n```\n\n### 外部 JavaScript 文件\n\
  \n我们可以构建一个可以在 HTML 文件中使用的 JavaScript 文件。\n\n由于单个 JavaScript 文件可以在多个 HTML 页面中使用，因此它允许代码的复用。\n\
  \n它提高了网页的效率。\n\n该文件必须具有 `.js` 扩展名。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <script type=\"text/javascript\" src=\"message.js\"></script>\n</head>\n<body>\n\
  \  <p>Hello world</p>\n  <form>\n    <input type=\"button\" value=\"click\" onclick=\"\
  msg()\"/>\n  </form>\n</body>\n</html>\n```\n\n# JavaScript 注释\n\nJavaScript 中的注释用于描述代码。它用于添加代码相关的内容，例如警告或建议，以便最终用户能够理解。\n\
  \n## JavaScript 注释的类型\n\nJavaScript 注释有两种类型：\n\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n\n\
  双正斜杠（`//`）用于表示单行注释。在程序运行时，双正斜杠（`//`）到行尾之间的任何文本都会被忽略。\n\n例如：在语句之前添加注释。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    // 单行注释 //\n    document.write(\"\
  hello world\");\n  </script>\n</body>\n</html>\n```\n\n例如：在语句之后添加注释。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var a=10;\n    var b=20;\n    var\
  \ c=a+b; // 相变量 a 和 b 的值\n    document.write(c); // 打印 10 和 20 的和\n  </script>\n\
  </body>\n</html>\n```\n\n### 输出\n30\n\n## 多行注释\n\n单行和多行注释也可以用于多行注释。跨越多行的注释以 `/*`\
  \ 开始，以 `*/` 结束。JavaScript 将忽略它们之间的文本。\n\n### /* 在此处编写注释 */\n\n### 示例\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    /* 这是一个多行注释。 \n    它不会被显示 */\n\
  \    document.write (\"Example of JavaScript multi line comment\");\n  </script>\n\
  </body>\n</html>\n```\n\n# JavaScript 变量\n\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。\n\
  \n在使用变量之前，我们必须先声明它。要声明一个变量，我们使用关键字 `var`，如下：\n\n`var name;`\n\n变量有两种类型：\n\n1. 局部变量\n\
  2. 全局变量\n\n局部变量——它在函数或块内部声明。\n\n### 示例\n\n```javascript\nfunctionabc() {\n  var\
  \ x=10; // 局部变量\n}\n```\n\n全局变量——它具有全局作用域，意味着它可以在 JavaScript 代码的任何地方指定。\n\n在函数外部声明变量。\n\
  \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var data=200;\
  \ // 全局变量\n    function a() {\n      document.writeln(data);\n    }\n    function\
  \ b() {\n      document.writeln(data);\n    }\n    a();\n    b();\n  </script>\n\
  </body>\n</html>\n```\n\n### 在函数内部声明全局变量\n\n我们需要使用 `window` 对象在函数内部声明全局变量。\n\n###\
  \ 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    function a() {\n\
  \      window.value=50; // 使用 window 对象声明全局变量\n    }\n    function b() {\n     \
  \ alert(window.value);// 从另一个函数访问全局变量\n    }\n    a();\n    b();\n  </script>\n\
  </body>\n</html>\n```\n\n# JavaScript 数据类型\n\n它有多种数据类型来存储各种类型的值。\n\n在 JavaScript\
  \ 中，有两种数据类型。\n\n1. 基本数据类型（原始）。\n2. 非基本数据类型（引用）。\n\n### 由于 JavaScript 是一种动态语言，我们不需要定义变量的类型，因为\
  \ JavaScript 引擎动态地使用它。在这种情况下，数据类型使用 `var` 定义。它可以存储任何类型的值，包括数字、字符串和对象。\n\n### 示例\n\
  \n```javascript\nvar a=\"Ram\"; // 字符串\nvar b=20; // 数字\nvar x={FirstName:'Ram',\
  \ lastName:'Doe'}; // 对象\n```\n\n### JavaScript 基本数据类型\n\nJavaScript 中有 5 种基本数据类型。\n\
  \n![](img/image00105.jpeg)\n\n## JavaScript 非基本数据类型\n\n有 3 种非基本数据类型如下：\n\n![](img/image00106.jpeg)\n\
  \n# 运算符\n\n运算符是 JavaScript 中用于对操作数执行操作的符号。通俗来说，3+2 等 5。这里的操作数是 3 和 2，运算符是 +。\n\n\
  以下是 JavaScript 中使用的运算符：\n\n1. 算术运算符。\n2. 比较（关系）运算符。\n3. 位运算符。\n4. 逻辑运算符。\n5. 赋值运算符。\n\
  6. 特殊运算符。\n\n## 算术运算符\n\n我们在算术运算符中对操作数进行算术运算。\n\n![](img/image00107.jpeg)\n\n##\
  \ 比较运算符\n\n\n\n\n\n在比较运算符中，会比较两个操作数 `A` 和 `B`。\n\n![](img/image00108.jpeg)\n\n##\
  \ 赋值运算符\n\nJavaScript 支持以下赋值运算符。\n\n![](img/image00109.jpeg)\n\n### 按位运算符\n\nJavaScript\
  \ 提供了以下按位运算符：\n\n![](img/image00110.jpeg)\n\n## 逻辑运算符\n\n布尔值常用于逻辑运算符。\n\n逻辑运算符如下：\n\
  \n![](img/image00111.jpeg)\n\n# Javascript If Else\n\nJavaScript 中的条件语句用于根据条件执行各种任务。\n\
  \n在 JavaScript 中，有三种类型的语句：\n\n1. `if` 语句。\n2. `if else` 语句。\n3. `if else if` 语句。\n\
  \n## if 语句\n\n如果条件为真或假，在 JavaScript 中使用 `if` 语句来执行代码。\n\n```javascript\nif (condition){\
  \   \n    //待评估的内容\n}\n```\n\n![](img/image00112.jpeg)\n\n### 示例\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<<body>\n<script>\nvar x=50;\nif(x>30){\n  document.write(\"value\
  \ of x is greater than 30\");\n}\n</script>\n</body>\n</html>\n```\n\n### 输出\nValue\
  \ of x is greater than 30\n\n## if else 语句\n\n如果其中一个条件为真或假，则使用 `if else` 语句。\n\n\
  ### 语法\n\n```javascript\nif(condition)\n{\n  // 语句组\n}\nelse\n{\n  // 语句组\n}\n```\n\
  \n![](img/image00113.jpeg)\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<<body>\n\
  <script>\nvar x=20;\nif(x%2==0){\n  document.write(\"x is even number\");\n}\nelse{\n\
  \  document.write(\"a is odd number\")\n}\n</script>\n</body>\n</html>\n```\n\n\
  ### 输出\nX is even number\n\n## If else if\n\n它只是通过多个表达式检查材料，以判断表达式是否有效。`else if`\
  \ 是 `if else` 语句的更高级的版本。\n\n### 语法\n\n```javascript\nif (condition1)\n{\n  // 如果\
  \ condition 1 为真，执行的语句\n}\nelse if (condition 2)\n{\n  // 如果 condition 2 为真，执行的语句\n\
  }\nelse if (condition 3)\n{\n  // 如果 condition 3 为真，执行的语句\n}\nelse\n{\n  // 如果没有条件为真，执行的语句\n\
  }\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<<body>\n<script>\nvar x=50;\n\
  if (x==10){\n  document.write(\"x is equal to 10\");\n}\nelse if(x==50){\n  document.write(\"\
  x is equal to 50\");\n}\nelse if(x==30){\n  document.write(\"x is equal to 30\"\
  );\n}\nelse{\n  document.write(\"a is not equal to 10, 50 or 30\");\n}\n</script>\n\
  </body>\n</html>\n```\n\n### 输出\nx is equal to 50\n\n# Javascript Switch 语句\n\n\
  在 JavaScript 中，`switch` 语句用于在不同条件下执行单个代码。它与 `else if` 语句相同。\n\n![](img/image00114.jpeg)\n\
  \n```javascript\nswitch (expression)\n{\n  case 1: statement(s)\n  break;\n  case\
  \ 2: statement(s)\n  break;\n  ...\n  case n: statement(s)\n  break;\n  default:statements(s)\n\
  }\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<<body>\n<script>\nvar grade='B';\n\
  var result;\nswitch(grade){\n  case 'A':\n    result=\"A Grade\";\n    break;\n\
  \  case 'B':\n    result=\"B Grade\";\n    break;\n  case 'C':\n    result=\"C Grade\"\
  ;\n    break;\n  default:\n    result=\"No Grade\";\n}\ndocument.write(result);\n\
  </script>\n</body>\n</html>\n```\n\n### 输出\nB Grade\n\n# JavaScript 函数\n\n## 在 `<script>.....</script>`\
  \ 标签内部构建新函数的能力是 JavaScript 的一项基本功能。`function` 关键字用于在 JavaScript 中声明函数。\n\n## 为了复用文件，我们多次调用\
  \ JavaScript 函数。\n\n## 优点 - JavaScript 函数\n\n1. 代码复用性：我们多次使用相同的功能来节省时间和代码量。\n2.\
  \ 减少代码量：结果是我们的软件被压缩了。当我们执行常规操作时，不需要编写大量的代码。\n\n### 语法\n\n```javascript\nfunction\
  \ Name(parameter)\n{\n}\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<<body>\n\
  <script>\nfunction msg() {\n  alert(\"Hello!\");\n}\n</script>\n</body>\n</html>\n\
  ```\n\n### 输出\nHello!\n\n## 带参数的函数\n\n### 通过参数调用函数。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<<body>\n<script>\nfunction cube(number) {\n  alert(number*number);\n}\n\
  </script>\n</body>\n</html>\n```\n\n### 输出\n27\n\n### 示例\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<<body>\n<script>\nfunction name() {\n  alert(\"Welcome \" + prompt(\"Enter\
  \ Name\"));\n}\n</script>\n</body>\n</html>\n```\n\n## 带返回值的函数\n\n### 调用返回值的函数并在程序中使用它。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<<body>\n<script>\nfunction getInfo() {\n  return\
  \ \"How are you?\";\n}\n</script>\n<script>\ndocument.write(getInfo());\n</script>\n\
  </body>\n</html>\n```\n\n### 输出\nHow are you?\n\n## Function() 构造函数\n\n函数语句不仅用于定义函数，还可以使用\
  \ `Function()` 构造函数动态地定义函数。\n\n### 语法\n\n```javascript\nvar variename = new Function(Arg1,\
  \ Arg2..., \"Function Body\");\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<script>\nvar func=new Function(\"a\", \"b\", \"return a+b\");\nfunction\
  \ secondFunction(){\n  var result;\n  result=func(50,50);\n  document.write(result);\
  \ \n}\n</script>\n</head>\n<body>\n<p>Click the function</p>\n<form>\n<input type=\"\
  button\" onclick=\"secondFunction()\" value=\"Call Function\">\n</form>\n<p>Use\
  \ different parameters inside the function and try yourself...</p>\n</body>\n</html>\n\
  ```\n\n## 函数字面量\n\n函数字面量的定义（这是描述函数的另一种方式）在 JavaScript 1.2 中引入。它是一个描述无名函数的表达式。\n\n\
  函数字面量的语法与函数语句相似，区别在于它用作表达式而不是语句，并且不需要函数名。\n\n### 语法\n\n```javascript\nvar variename\
  \ = function (Argument List){\n  Body\n};\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<script>\nvar func=function(a,b){return a+b};\nfunction secondFunction(){\n\
  \  var result;\n  result=func(10,20);\n  document.write(result); \n}\n</script>\n\
  </head>\n<body>\n<p>Click the button to call the function</p>\n<form>\n<input type=\"\
  button\" onclick=\"secondFunction()\" value=\"Call Function\">\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n\n```html\n<input type=\"button\" onclick=\"secondFunction()\"\
  \ value=\"Call Function\">\n</form>\n<p>在函数内部使用不同的参数并尝试一下吧...</p>\n</</body>\n</html>\n\
  ```\n\n# Javascript 对象\n\n对象是一个包含状态和行为的实体。JavaScript 是一种关注对象的脚本语言。虽然 JavaScript\
  \ 是基于模板的而非基于类的，但它允许我们直接构建对象。\n\n### 语法\n\n```javascript\nobjectName.objectProperty\
  \ = propertyValue;\n```\n\n为了在文本上写入一些内容，我们使用文档属性上的 `write()` 方法。\n\n```javascript\n\
  Document.write(\"Hello world\")\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>用户定义对象</title>\n<script type=\"text/javascript\">\nvar book = new\
  \ Object(); // 创建了对象\nbook.subject = \"5 points someone\"; // 将属性赋值给对象\nbook.author\
  \ = \"ChetanBhagat\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\ndocument.write(\"Book Name is : \" + book.subject + \"<br>\");\ndocument.write(\"\
  Book Author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\
  \n### 输出\n\nBook Name is: 5 points someone\nBook Author is: Chetan Bhagat\n\n##\
  \ 对象的方法\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n\
  <script type=\"text/javascript\">//定义一个将作为方法工作的函数 \nfunction addPrice(amount){\n\
  this.price = amount;\n}\nfunction book(title, author){\nthis.itle = title;\nthis.author\
  \ = author;\nthis.addPrice = addPrice; // 将该方法作为属性赋值。\n}\n</script>\n</head>\n<body>\n\
  <script type=\"text/javascript\">\nvarmyBook = new book(\"5 Points Someone\", \"\
  ChetanBhagat\");\nmyBook.addPrice(150);\ndocument.write(\"Book Title is : \" + myBook.title\
  \ + \"<br>\");\ndocument.write(\"Book Author is : \" + myBook.author + \"<br>\"\
  );\ndocument.write(\"Book Price is : \" + myBook.price + \"<br>\");\n</script>\n\
  </body>\n</html>\n```\n\n### 输出\n\nBook Title is: 5 Points Someone\nBook Author\
  \ is :ChetanBhagat\nBook Price is : 150\n\n# Javascript 数组\n\n数组用于描述单个单元或内存位置中的一组元素。\n\
  \n任何进入数组的元素将以从零开始的唯一索引存储在数组中。我们可以借助索引存储数据。\n\n在 JavaScript 中，我们必须使用 `new` 关键字来声明数组。我们使用\
  \ `new Array` 来生成一个数组 (`n`）。\n\n序列中的槽位数量由 `n` 表示。\n\n### 语法\n\n```javascript\nmyarray\
  \ = new array(n);\n```\n\n注意：如果在 JavaScript 中生成数组时不指定大小，则数组对象的大小将为零。\n\n### 示例\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar i;\nvar emp = new Array();\n\
  emp[0] = \"Ajay\";\nemp[1] = \"Abhay\";\nemp[2] = \"Arun\";\nemp[3] = \"Shipra\"\
  ;\nfor (i=0; i<emp.length; i++)\n{\ndocument.write(emp[i] + \"<br>\");\n}\n</script>\n\
  </body>\n</html>\n```\n\n### 输出\n\nAjay\nAbhay\nArun\nShipra\n\n## 示例 2\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction array()\n\
  {\nnum = new Array(5)\nnum[0] = 10;\nnum[1] = 20;\nnum[2] = 30;\nnum[3] = 40;\n\
  num[4] = 50;\nsum = 0;\nfor (i=0; i<num.length; i++)\n{\nsumsum = sum + num[i];\n\
  }\nalert(sum)\n}\n</script>\n</head>\n<body>\n<input type=\"button\" onclick=\"\
  array()\" value=\"click here\">\n</body>\n</html>\n```\n\n### 数组中的函数\n\n![](img/image00115.jpeg)\n\
  \n# Javascript 字符串\n\n`String` 对象用于与字符字符串交互。它是用于存储和操作文本的工具。在 JavaScript 中，有两种创建字符串的方法：\n\
  \n1. 字符串字面量\n2. 使用 `new` 关键字\n\n### 语法\n\n```javascript\nvar string=\"value\";\n\
  ```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar str=\"\
  Hello\";\ndocument.write(str);\n</script>\n</body>\n</html>\n```\n\n### 输出\n\nString\n\
  \n## 使用 new 关键字\n\n### 语法\n\n```javascript\nvar string=new String(\"Hello\");\n\
  ```\n\n### 输出\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar string=new\
  \ String(\"Hello\");\ndocument.write(string);\n</script>\n</body>\n</html>\n```\n\
  \n### 输出\n\nString\n\n## 属性\n\n有字符串属性列表及其描述：\n\n1. `constructor`: 它返回对对象的引用。\n2.\
  \ `length`: 字符串中字符的数量。\n3. `prototype`: 允许任何对象拥有属性（`Number`、`String` 等）。\n\n###\
  \ 语法\n\n```javascript\nstring.constructor\nstring.length\nstring.prototype\n```\n\
  \n## 方法\n\n![](img/image0016.jpeg)\n\n### charAt()\n\n这是一个从给定索引获取字符的方法。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\nvar str=new String(\"Hello\");\ndocument.write(\"\
  charAt(0) : \" + str.charAt(0));\ndocument.write(\"charAt(1) : \" + str.charAt(1));\n\
  document.write(\"charAt(2) : \" + str.charAt(2));\ndocument.write(\"charAt(3) :\
  \ \" + str.charAt(3));\ndocument.write(\"charAt(4) : \" + str.charAt(4));\n</script>\n\
  </body>\n</html>\n```\n\n### concat()\n\n该方法在添加一个或多个字符串后返回一个新字符串。\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n<script>\nvar x=\"Hello\";\nvar y=\"World\";\nvar z=x+y;\n\
  document.write(z);\n</script>\n</body>\n</html>\n```\n\n### indexOf(str)\n\n`indexOf(str)`\
  \ 过程返回字符串给定字符串的位置。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=\"\
  Tutorialbyexample\";\nvar y=x.indexOf(\"by\");\ndocument.write(y);\n</script>\n\
  </body>\n</html>\n```\n\n### lastIndexOf(str)\n\n`lastIndexOf(str)` 方法返回字符串的最后一个位置。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=\"TutorialbyExamole\"\
  ;\nvar y=x.lastIndexOf(\"by\");\ndocument.write(y);\n</script>\n</body>\n</html>\n\
  ```\n\n### match()\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar str=\"\
  To more detail, see Chapter 2.5.4\";\nvar re=(chapter \\d+(\\.\\d)*)/i;\nvar find=str.match(re);\n\
  document.write(find);\n</script>\n</body>\n</html>\n```\n\n### toLowerCase()\n\n\
  它返回给定字符串的小写版本。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=\"HELLO\
  \ WORLD\";\nvar y=x.toLowerCase();\ndocument.write(y);\n</script>\n</body>\n</html>\n\
  ```\n\n### toUpperCase()\n\n返回提供的字符串的大写字母形式。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<script>\nvar x=\"hello world\";\nvar y=x.toUpperCase();\ndocument.write(y);\n\
  </script>\n</body>\n</html>\n```\n\n\n\n\n\n```html\ndocument.write(y);\n</script>\n\
  </body>\n</html>\n```\n\n## valueOf()\n\n它返回字符串对象的原始值。\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<script>\nvar str = new String(\"Hello world\");\ndocument.write(str.valueOf());\n\
  </script>\n</body>\n</html>\n```\n\n# JavaScript 日期\n\nDate 对象（期期对象）是 JavaScript\
  \ 语言中内置的一种数据类型。新的 `Date` 对象用于构建数据对象 `()`。时间中的单个时刻由 JavaScript `Date` 实例表示。创建 JavaScript\
  \ 日对象的唯一方法是使用 JavaScript 作为构造函数。\n\n### 语法\n\n`Date()` 构造函数可以使用以下语法生成 `Date` 对象：\n\
  \n- `new Date();`\n- `new Date(value);`\n- `new Date(dateString);`\n- `new Date(year,\
  \ month, day, hours, minutes, seconds, milliseconds);`\n\n注意：括号内的参数始终是可选的。\n\n###\
  \ 描述\n\n### year\n年份由一个整数表示。对于 2000 年到 2099 年，值的映射范围为 0 到 99。\n\n### Month\n从 0（1\
  \ 月）开始到 11（12 月）结束，这个整数代表月份。\n\n### Date\n这是一个可选参数。月份的日期由一个整数表示。\n\n### Hours\n\
  这是一个可选参数。一天中的小时由一个整数表示。\n\n### Minutes\n这是一个可选参数。时间中的分钟部分由一个整数表示。\n\n### Seconds\n\
  这是一个可选参数。秒段由一个整数表示。\n\n### Milliseconds\n这是一个可选参数。时间的毫秒段由一个整数表示。\n\n### Date 示例\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar date=new Date();\nvar\
  \ day=date.getDate();\nvar month=date.getMonth()+1;\nvar year=date.getFullYear();\n\
  document.write(\"<br>Date: \"+day+\"/\"+month+\"/\"+year);\n</script>\n</body>\n\
  </html>\n```\n\n### 当前时间 - 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\nCurrent\
  \ Time: <span id=\"txt\"></span>\n<script>\nvar today=new Date();\nvar h=today.getHours();\n\
  var m=today.getMinutes();\nvar s=today.getSeconds();\ndocument.getElementById('txt').innerHTML=h+\"\
  :\"+m+\":\"+s;\n</script>\n</body>\n</html>\n```\n\n# JavaScript 数学\n\nMath 是一个内置对象，具有用于数学函数和常数的属性和方法。它可以对数字执行数学运算。\n\
  \n### 语法\n\n1. `varpi_val = Math.PI;`\n2. `varsin_val = Math.sin(30);`\n\n### 示例\n\
  \n### Math.pow()\n\n`Math.pow(x,y)` 返回 `x` 的 `y` 次方值：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<h2>JavaScript Math.pow()</h2>\n<p>Math.pow(x,y) 返回 x 的 y 次方值：</p>\n\
  <p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = Math.pow(6,2);\n\
  </script>\n</body>\n</html>\n```\n\n### Math.sqrt()\n\n`Math.sqrt(x)` 返回 `x` 的平方根。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>JavaScript Math.sqrt()</h2>\n<p>Math.sqrt(x)\
  \ 返回 x 的平方根：</p>\n<p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\"\
  ).innerHTML = Math.sqrt(81);\n</script>\n</body>\n</html>\n```\n\n### Math.ceil()\n\
  \n`Math.ceil(x)` 返回 `x` 向上五入到最近的整数的值：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <h2>JavaScript Math.ceil()</h2>\n<p>Math.ceil() 将数字向上五入到最近的整数：</p>\n<p id=\"demo\"\
  ></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = Math.ceil(6.8);\n\
  </script>\n</body>\n</html>\n```\n\n# JavaScript 数字\n\n`Number` 对象是一个包装对象，允许你操作数值。`Number()`\
  \ 构造函数用于构建数字对象。它可以是整数也可以是浮点数。\n\n### 语法\n\n- `var n=new Number(value);`\n\n### 示例\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=100;//整数值\nvar y=100.7;//浮点数值\n\
  var z=12e5;//指数值，输出: 1200000\nvar n=new Number(20);//通过数字对象的整数值\ndocument.write(x+\"\
  \ \"+y+\" \"+z+\" \"+n);\n</script>\n</body>\n</html>\n```\n\n### 输出\n100 100.7\
  \ 1200000 20\n\n### 描述\n\n数字对象通常用于以下用途：\n\n1. 如果值无法转换为数字，则返回 `NaN`（不是数字）。\n2. `Number`\
  \ 可用于非构造函数上下文中执行类型转换（即不使用 `new` 运算符）。\n\n### JavaScript 数字常量\n\n![](img/image00117.jpeg)\n\
  \n"
