    \ using JavaScript code. (We’ll seen an example of this soon.)\n\nTo create a\
    \ template, add the following code beneath the closing `body` tags inside the\
    \ HTML file:\n\n```\n<template name=\"leaderboard\">\n Hello world\n</template>\n\
    ```\n\nTemplates have a fairly vanilla structure. We use this `template` tag and\
    \ attach a name to the template with this `name` attribute. I’ve named this template\
    \ “leaderboard” but you can name it whatever you like. Just know that we’ll be\
    \ referencing it shortly so, as per usual, it helps to choose a simple and direct\
