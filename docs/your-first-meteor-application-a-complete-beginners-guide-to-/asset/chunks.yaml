    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n).\n\n[content]\nTo count a precise selection\
    \ of data from the collection, pass something through the brackets of the `find`\
    \ function and attach a `count` function to that, like so:\n\n```\nPlayersList.find({\
    \ name: 'David' }).count();\n```\n\nHere, we’re counting the number of documents\
    \ in the collection where the “name” field is set to “David”. If one of your player’s\
    \ names is set to “David”, this statement will return `1`. If none of your player’s\
    \ names are set to “David”, this statement will return `0`.\n\nAt this point,\
    \ we’ve only scratched the surface of the `find` function but a lot of functionality\
    \ is available through what we’ve learned.\n\n## 5 Templates\n\nWith a collection\
    \ created and some data in place, we can start building the user interface for\
    \ the Leaderboard application.\n\nTo begin, setup the basic HTML structure for\
    \ our application by opening the HTML file and pasting the following code into\
    \ it:\n\n```\n<head>\n <title>Leaderboard</title>\n</head>\n<body>\n <h1>Leaderboard</h1>\n\
    </body>\n```\n\nRight off the bat, there appears to be a few things missing from\
    \ this code:\n\n1. We haven’t included the `html` tags.\n2. We haven’t included\
    \ any JavaScript files.\n3. We haven’t included any CSS files.\n\nBut we haven’t\
    \ included these things because we don’t have to include them. Meteor takes care\
    \ of it for us. It includes the `html` tags automatically and also includes any\
    \ CSS and JavaScript files that our application needs.\n\nOne of Meteor’s core\
    \ principles is developer happiness, so there’s a lot of handy features like this\
    \ that’ll make your development life easier.\n\n![The current interface.](images/00019.jpeg)\n\
    \nThe current interface.\n\n### 5.1 Create a Template\n\nUp next, we want to create\
    \ a `template`, and by placing parts of our user interface inside templates, we’re\
    \ able to interact with them using JavaScript code. (We’ll seen an example of\
    \ this soon.)\n\nTo create a template, add the following code beneath the closing\
    \ `body` tags inside the HTML file:\n\n```\n<template name=\"leaderboard\">\n\
    \ Hello world\n</template>\n```\n\nTemplates have a fairly vanilla structure.\
    \ We use this `template` tag and attach a name to the template with this `name`\
    \ attribute. I’ve named this template “leaderboard” but you can name it whatever\
    \ you like. Just know that we’ll be referencing it shortly so, as per usual, it\
    \ helps to choose a simple and direct name that’s easy to remember.\n\nIf you\
    \ save the file in its current state though, the template doesn’t appear in the\
    \ web browser. It’s in our raw HTML code but nowhere else.\n\nWhat’s wrong?\n\n\
    Well, templates don’t appear by default because, in some cases:\n\n* You might\
    \ want a template appear at specific times.\n* You might want a template to `dis`appear\
    \ at specific times.\n* You might want a template to appear in multiple locations.\n\
    \nAs such, templates need to manually included after they’re created. This might\
    \ feel like just an extra step but it’ll be increasingly useful as we get deeper\
    \ into development.\n\nTo make the “leaderboard” template appear in the browser,\
    \ place this tag between the `body` tags:\n\n```\n{{> leaderboard}}\n```\n\nSo\
    \ obviously, this isn’t a HTML tag. The double-curly braces means it’s part of\
    \ Meteor’s templating engine – Spacebars. Inspired by the Handlebars syntax, this\
    \ is the syntax we use in our HTML when we want something dynamic to occur. We’ll\
    \ use Spacebars a lot in this tutorial but, for now, just know that:\n\n1. All\
    \ Spacebars tags use the double-curly braces to distinguish themselves.\n2. We\
    \ only use the greater-than symbol when we want to include a template.\n\nAt this\
    \ stage, the HTML file should resemble:\n\n```\n<head>\n <title>Leaderboard</title>\n\
    </head>\n<body>\n <h1>Leaderboard</h1>\n {{> leaderboard}}\n</body>\n\n<template\
    \ name=\"leaderboard\">\n Hello World\n</template>\n```\n\nAfter saving the file,\
    \ the “Hello World” text should appear in the browser.\n\n![The template is now\
    \ appearing.](images/00020.jpeg)\n\nThe template is now appearing.\n\n### 5.2\
    \ Create a Helper\n\nIn our HTML file, we have a template, but it’s static. It\
    \ doesn’t do anything aside from display the boring “Hello World” text. To fix\
    \ this, we can create a `helper`, and a helper is a JavaScript function that’s\
    \ attached to a template. This is best understood with code, so let’s write some.\n\
    \nSwitch to the JavaScript file and write the following statement beneath the\
    \ line where we created our collection:\n\n```\nTemplate.leaderboard.player\n\
    ```\n\nThis is the syntax we use to create a helper and it has three parts.\n\n\
    First, we use the `Template` keyword to search through the templates in our Meteor\
    \ application. We only have one at the moment but a complete application may have\
    \ dozens or even hundreds.\n\nSecond, we use the `leaderboard` keyword to reference\
    \ the name of the template we created earlier. Every helper function we create\
    \ needs to be attached to a single template.\n\nThird, we use the `player` keyword\
    \ to name our helper. We’ll reference this name in the HTML file and, again, you\
    \ can name it whatever you like.\n\nTo attach code to this helper, we associate\
