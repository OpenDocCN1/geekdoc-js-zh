  trans: "\n\n```javascript\n'modifyPlayerScore': function(selectedPlayer){\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$inc: {score: 5}}\n    );\n}\n```\n\n\
    在目前的形式下，这个 `modifyPlayerScore` 在被调用时会成功增加玩家的分数，但让我们做一个简单的更改，让它在被调用时既能增加分数也能减少分数。\n\
    \n为了实现这一点，让我们通过 `call` 函数传递一个*第二个*的参数：\n\n```javascript\n'click #increment': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n    Meteor.call('modifyPlayerScore',\
    \ selectedPlayer, 5);\n}\n```\n\n然后允许我们的方法来接受这个参数：\n\n```javascript\n'modifyPlayerScore':\
    \ function(selectedPlayer, scoreValue){\n    PlayersList.update(\n        {_id:\
    \ selectedPlayer},\n        {$inc: {score: 5}}\n    );\n}\n```\n\n在这里，我们创建了这个新的\
    \ `scoreValue` 参数，我们现在可以在方法中引用它。所以，如果我们做最后这次更改：\n\n```javascript\n'modifyPlayerScore':\
    \ function(selectedPlayer, scoreValue){\n    PlayersList.update(\n        {_id:\
    \ selectedPlayer},\n        {$inc: {score: scoreValue}}\n    );\n}\n```\n\n那么我们就可以用两种不同的方式调用\
    \ `modifyPlayerScore` 函数了。\n\n如果我们想增加玩家的分数，可以这样写：\n\n```javascript\nMeteor.call('modifyPlayerScore',\
    \ selectedPlayer, 5);\n```\n\n但如果我们想减少玩家的分数，可以这样写：\n\n```javascript\nMeteor.call('modifyPlayerScore',\
    \ selectedPlayer, -5);\n```\n\n我们对这个 `call` 函数做的唯一更改是将 `-5` 作为第二个参数传递，而不是 `5`，但这在不引入任何额外代码的情况下完全翻转了该方法的用途。非常酷，对吧？\n\
    \n此时，将 `click #decrement` 事件从这个形式改为：\n\n```javascript\n'click #decrement': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$inc: {score: -5}}\n    );\n}\n```\n\
    \n改为这个形式：\n\n```javascript\n'click #decrement': function(){\n    var selectedPlayer\
    \ = Session.get('selectedPlayer');\n    Meteor.call('modifyPlayerScore', selectedPlayer,\
    \ -5);\n}\n```\n\n现在，“增加 5 分”和“扣除 5 分”按钮都应该按预期工作了，只是所有的数据操作代码都运行在服务器的信任环境中。\n\n\
    # 13 结构\n\n考虑到我们在排行榜（Leaderboard）应用上取得了了如此巨大的进展，我们还没有讨论过软件构建中一个看似基本的方面：结构，这很奇怪。但虽然学习如何最好组织你的代码和项目文件很重要，但我认为现在就讨论它并没有意义。在不知道如何构建应用程序之前，你如何真正理解它的结构呢？（答案：你不能。）\n\
    \n我更愿意帮助你尽可能快（且尽可能乱地）制作出东西，然后再讨论如何清理它。这样，你读到的关于结构的所有内容会在没有太大阻力的情况下进入脑海。\n\n在本章中，我将分享关于如何组织\
    \ Meteor 应用程序的快速指南。不过，我不会提供任何硬性规则，因为：\n\n1. **Meteor 本身没有任何硬性规则**。我将解释一些惯例，但没有什么东西是**必须*做到的严格性要求。\n\
    2. **人们仍在探索 Meteor 的最佳实践**。因此，在还有更多东西要学习的情况下，变得太教条是愚蠢的。\n\n你也可以期待未来这一章会发生巨大变化，因为观点和惯例不断演进以更有效地组织\
    \ Meteor 应用程序。\n\n## 13.1 你的项目，你做\n\nMeteor 并不强制严格的文件结构。例如，我们的项目只包含这三个文件也是完全没问题的：\n\
    \n* `leaderboard.html`\n* `leaderboard.js`\n* `leaderboard.css`\n\n我们可以编写一个大得多的应用程序，并且仅在这三个文件内操作。代码最终会变得极其难以管理，但这是可行的。\n\
    \n为了利用这种灵活性，我建议在你熟悉 Meteor 的过程中尽可能让你的项目保持简单。在项目中只保留三个文件，直到它变得不便为止。然后让结构从那个点开始自然演变。这在专业环境中或与客户合作时将没有意义——因为这需要回溯——但如果你是为了自己的娱乐和教育而胡乱搭建项目，那么结构并不是最紧迫的问题。\n\
    \n## 13.2 瘦文件，胖文件\n\n在目前的形式下，我们的项目文件相当得*胖*（fat）。这意味着我们将大量代码挤在一个狭窄的空间里。这并不总是坏事——在某些情况下，胖文件会更容易管理——但很多时候，将其拆分到多个文件中以便更容易管理是合理的。\n\
    \n例如，让我们考虑 `leaderboard.html` 文件。它并不算胖，但它确实包含了我们可能想要拆分到其他文件的模板：\n\n* `leaderboard`\n\
    * `addPlayerForm`\n\n为了进行过渡，从在项目目录下创建几个新的 HTML 文件开始。这是我将使用的文件名：\n\n* `leaderboard.html`\n\
    * `addPlayerForm.html`\n\n"
- fmt: "\n2. Cut all the code between the `isClient` conditional.\n\n3. Paste this\
    \ code into a new file (without the conditional).\n\n4. Save this file into a\
    \ folder named `client`.\n\nYou should have a project that looks a little something\
    \ like this:\n\n![The addition of the `client` folder.](images/00068.jpeg)\n\n\
    The addition of the `client` folder.\n\nBased on this change, nothing will be\
    \ overtly different about our application, but it’s a starting point for splitting\
    \ our application into modular chunks.\n\nFor example, we could split this new\
    \ file we’ve created in a couple of different files, like so:\n\n* `helpers.js`\n\
    * `events.js` \n\nIf these files are both in the `client` folder, then we won’t\
    \ need to use that `isClient` conditional in both (or either) of them.\n\nBut\
    \ another approach would be to create a JavaScript file for each template in our\
    \ applications, like this:\n\n* `leaderboardList.js`\n* `addPlayerForm.js` \n\n\
    Then we could have all of the events and helpers associated with the “leaderboard”\
    \ template inside the `leaderboardList.js` file, and all of the events and helpers\
    \ associated with the “addPlayerForm” template inside the `addPlayerForm.js` file.\n\
    \nIs this the best way to handle things?\n\nAgain, I don’t want to offer a definitive\
    \ answer because it will depend on what you’re building and also on the scope\
    \ of what you’re building. What’s important to know for the time being is that:\n\
    \n1. You can split your files in these ways.\n2. You can avoid an abundance of\
    \ `isClient` conditionals.\n\nWhat you do with this knowledge will inevitably\
    \ involve some experimentation.\n\n### 13.4 isServer\n\nSimilar to the convention\
    \ we just discussed, **any code placed within a folder named `server` will only\
    \ run on the server**. The same rules apply, so I won’t repeat myself too much.\
    \ Just follow the same steps from before:\n\n1. Open the `leaderboard.js` file.\n\
    2. Cut all the code between the `isServer` conditional.\n3. Paste this code into\
    \ a new file (without the conditional).\n4. Save this file into a folder named\
    \ `server`.\n\nYou’ll then have a project that looks a little something like this:\n\
    \n![The addition of the `server` folder.](images/00069.jpeg)\n\nThe addition of\
    \ the `server` folder.\n\nThe application will continue to function as expected,\
    \ but there won’t be a need to place the server-side code within `isServer` conditionals.\n\
    \n### 13.5 Other Conventions\n\nAt this point, the default `leaderboard.js` file\
    \ should only have the following line of code inside of it:\n\n```\nPlayersList\
    \ = new Meteor.Collection('posts');\n```\n\nThis line of code can remain where\
    \ it is but it’s worth mentioning that:\n\n1. You *should’t* put this code inside\
    \ the `client` or `server` folder since we need this collection to run on both\
    \ the client and the server.\n2. It’s common for Meteor developers to create a\
    \ “collections” folder and create a separate file for each of their collections.\
    \ This is not an official convention though and has no special meaning.\n\nThere\
    \ are also other conventions for structuring a Meteor application but, since these\
    \ conventions have no use with our Leaderboard application, I won’t dive into\
    \ detail.\n\nIf you’re particularly curious about structure though:\n\n* [Read\
    \ the “Structuring Your App” section of the official documentation](http://docs.meteor.com/#structuringyourapp).\n\
    * Check out [these](http://tech.exponential.io/meteor/building-large-modular-apps-meteor/)\
    \ [three](http://stackoverflow.com/questions/10122977/what-are-the-best-practices-for-structuring-a-large-meteor-app-with-many-html-te)\
    \ [resources](https://github.com/Differential/docs/blob/master/METEOR-STANDARDS.md)\
    \ for further opinions and insight.\n\nI might discuss structure in more detail\
    \ in a future update but Leaderboard is such a simple application that it’d be\
    \ silly to spread it thinner than we already have. I’ll also continue to argue\
    \ that it’s not the most pressing matter and your time is better spent hacking\
    \ together a few messy projects before worrying about the best practices.\n\n\
    ## 14 Deployment\n\nTo share our creation with the world, we need to *deploy*\
    \ it to the web. This, unfortunately, isn’t so simple as just uploading our project\
    \ to a web host.\n\nIn a future update to this book, I’ll detail a range of deployment\
    \ options – along with advantages, disadvantages, and other things to consider\
    \ – but for the moment, let’s deploy to the official Meteor.com servers. This\
    \ has the advantage of being:\n\n* Free.\n* Quick.\n* Easy.\n\nIt won’t be enough\
    \ for an application with more than a handful of users, but it’ll be enough for\
    \ sharing prototypes with friends, family, and other developers when you’re looking\
    \ for feedback.\n\nTo begin, switch to the command line and write:\n\n```\nmeteor\
    \ deploy APPLICATIONNAME.meteor.com\n```\n\nHere, we’re using this `deploy` command\
    \ and then specifying the name that will be used in the URL for our Meteor application.\n\
    \nAfter tapping the “Return” key, your project will be bundled together into a\
    \ single file and uploaded to the Meteor.com servers.\n\nYou’ll see something\
    \ like the following in the command line:\n\n![Deployed.](images/070.jpeg)\n\n\
    To host your application with a custom domain, use the following:\n\n```\nmeteor\
    \ deploy APPLICATIONNAME.meteor.com\n```\n\nIf you’re looking for a more-term\
    \ deployment solution, I’d suggest:\n\n* [Digital Ocean](https://www.digitalocean.com/)\
    \ to host the application.\n* [Meteor Up](https://github.com/arunoda/meteor-up)\
    \ to deploy to Digital Ocean.\n\nIf you’re unsure of how to set, here are a few\
    \ popular domain registrars:\n\n* [NameCheap](https://www.namecheap.com/)\n* [GoDaddy](http://www.godaddy.com/)\n\
    * [Hover](https://hover.com/)\n\n## 15 Conclusion\n\nIt feels strange to write\
    \ a conclusion because, honestly, I’m just getting started. You’ve now read the\
    \ first draft of *Your First Application*, but it’s the first of many drafts I\
    \ plan to publish in the coming years.\n\nFor future editions, the scope of the\
    \ book will remain similar, but:\n\n* Every chapter will be heavily revised (from\
    \ scratch).\n* Explanations will be more detailed (but still without bloat).\n\
    * Errors will be aggressively obliterated.\n\nThere’ll also be new features added\
    \ to the book, including:\n\n* A “Summary” section at the end of each chapter\
    \ to reiterate the main points from within that chapter.\n* An “Exercises” section\
    \ at the end of each chapter to give readers something extra to do when they’ve\
    \ finished the chapter (or the book).\n* Source code files so you’re able to more\
    \ easily see exactly the project’s code should look at each stage of development.\n\
    \nAnd, as always, I’m curious to hear what *you* want to see from the book, so\
    \ feel free to send an email to [hello@meteortips.com](mailto:hello@meteortips.com)\
    \ and I’ll get back to you shortly.\n\nThat’s basically it for now though. There’s\
    \ a lot of work ahead, so I guess I should go back to writing.\n\nTalk soon,<br\
    \ /> David Turnbull\n\nP.S. If you’re wondering where to go from here, checking\
    \ out [the tutorials section on the blog](http://meteortips.com/tutorials) is\
    \ a good place to begin.\n"
  raw: '2.  Cut all the code between the `isClient` conditional.


    3.  Paste this code into a new file (without the conditional).


    4.  Save this file into a folder named `client`.


    You should have a project that looks a little something like this:


    ![The addition of the `client` folder.](images/00068.jpeg)


    The addition of the `client` folder.


    Based on this change, nothing will be overtly different about our application,
    but it’s a starting point for splitting our application into modular chunks.


    For example, we could split this new file we’ve created in a couple of different
    files, like so:


    *   helpers.js


    *   events.js


    If these files are both in the `client` folder, then we won’t need to use that
    `isClient` conditional in both (or either) of them.


    But another approach would be to create a JavaScript file for each template in
    our applications, like this:


    *   leaderboardList.js


    *   addPlayerForm.js


    Then we could have all of the events and helpers associated with the “leaderboard”
    template inside the `leaderboardList.js` file, and all of the events and helpers
    associated with the “addPlayerForm” template inside the `addPlayerForm.js` file.


    Is this the best way to handle things?


    Again, I don’t want to offer a definitive answer because it will depend on what
    you’re building and also on the scope of what you’re building. What’s important
    to know for the time being is that:


    1.  You can split your files in these ways.


    2.  You can avoid an abundance of `isClient` conditionals.


    What you do with this knowledge will inevitably involve some experimentation.


    ### 13.4 isServer


    Similar to the convention we just discussed, **any code placed within a folder
    named `server` will only run on the server**. The same rules apply, so I won’t
    repeat myself too much. Just follow the same steps from before:


    1.  Open the `leaderboard.js` file.


    2.  Cut all the code between the `isServer` conditional.


    3.  Paste this code into a new file (without the conditional).


    4.  Save this file into a folder named `server`.


    You’ll then have a project that looks a little something like this:


    ![The addition of the `server` folder.](images/00069.jpeg)


    The addition of the `server` folder.


    The application will continue to function as expected, but there won’t be a need
    to place the server-side code within `isServer` conditionals.


    ### 13.5 Other Conventions


    At this point, the default `leaderboard.js` file should only have the following
    line of code inside of it:


    ```

    PlayersList = new Meteor.Collection(''posts'');

    ```


    This line of code can remain where it is but it’s worth mentioning that:


    1.  You *shouldn’t* put this code inside the `client` or `server` folder since
    we need this collection to run on both the client and the server.


    2.  It’s common for Meteor developers to create a “collections” folder and create
    a separate file for each of their collections. This is not an official convention
    though and has no special meaning.


    There are also other conventions for structuring a Meteor application but, since
    these conventions have no use with our Leaderboard application, I won’t dive into
    detail.


    If you’re particularly curious about structure though:


    *   [Read the “Structuring Your App” section of the official documentation](http://docs.meteor.com/#structuringyourapp).


    *   Check out [these](http://tech.exponential.io/meteor/building-large-modular-apps-meteor/)
    [three](http://stackoverflow.com/questions/10122977/what-are-the-best-practices-for-structuring-a-large-meteor-app-with-many-html-te)
    [resources](https://github.com/Differential/docs/blob/master/METEOR-STANDARDS.md)
    for further opinions and insight.


    I might discuss structure in more detail in a future update but Leaderboard is
    such a simple application that it’d be silly to spread it thinner than we already
    have. I’ll also continue to argue that it’s not the most pressing matter and your
    time is better spent hacking together a few messy projects before worrying about
    the best practices.


    ## 14 Deployment


    To share our creation with the world, we need to *deploy* it to the web. This,
    unfortunately, isn’t so simple as just uploading our project to a web host.


    In a future update to this book, I’ll detail a range of deployment options – along
    with advantages, disadvantages, and other things to consider – but for the moment,
    let’s deploy to the official Meteor.com servers. This has the advantage of being:


    *   Free.


    *   Quick.


    *   Easy.


    It won’t be enough for an application with more than a handful of users, but it’ll
    be enough for sharing prototypes with friends, family, and other developers when
    you’re looking for feedback.


    To begin, switch to the command line and write:


    ```

    meteor deploy APPLICATIONNAME.meteor.com

    ```


    Here, we’re using this `deploy` command and then specifying the name that will
    be used in the URL for our Meteor application.


    After tapping the “Return” key, your project will be bundled together into a single
    file and uploaded to the Meteor.com servers.


    You’ll see something like the following in the command line:


    ![Deployed.](images/00070.jpeg)


    Deployed.


    This is all it takes to get a Meteor application deployed to the web (for the
    purpose of sharing prototypes, at least).


    To host your Meteor application with a custom domain name, use the following command
    during deployment:


    ```

    meteor deploy YOURDOMAINNAME.com

    ```


    Then, afterward, set the CNAME of that domain name to `origin.meteor.com`. If
    you’re unsure of how to set the CNAME of a domain name, here are guides from a
    few popular domain name registrars:


    *   [NameCheap](https://www.namecheap.com/support/knowledgebase/article.aspx/1031/2/demo-how-to-set-up-a-cname-record)


    *   [GoDaddy](http://support.godaddy.com/help/article/680/managing-dns-for-your-domain-names)


    *   [Hover](https://help.hover.com/entries/21204757-How-to-Edit-DNS-records-A-CNAME-MX-TXT-and-SRV)


    If you’re looking for a more long-term deployment solution, I’d suggest a using:


    *   [Digital Ocean](https://www.digitalocean.com/?refcode=125faab8c8c8) to host
    the application.


    *   [Meteor Up](https://github.com/arunoda/meteor-up) to deploy to Digital Ocean.


    As this is just the start of your Meteor journey though, it’s a good idea to not
    to “jump the gun” and by rushing something to release. You don’t have to immediately
    launch something for all the world to see. Give yourself some time to enjoy Meteor
    for the sake of creation. Then you can have all of the fun and (basically) none
    of the stress.


    ## 15 Conclusion


    It feels strange to write a conclusion because, honestly, I’m just getting started.
    You’ve now read the first draft of *Your First Meteor Application*, but it’s the
    first of many drafts that I plan to publish in the coming years.


    For future editions, the scope of the book will remain similar, but:


    *   Every chapter will be heavily revised (from scratch).


    *   Explanations will be more detailed (but still without bloat).


    *   Errors will be aggressively obliterated.


    There’ll also be new features added to the book, including:


    *   A “Summary” section at the end of each chapter to reiterate the main points
    from within that chapter.


    *   An “Exercises” section at the end of each chapter to give readers something
    extra to do when they’ve finished reading the chapter (or the book).


    *   Source code files so you’re able to more easily see how exactly the project’s
    code should look at each stage of development.


    And, as always, I’m curious to hear what *you* want to see from the book, so feel
    free to send an email to [hello@meteortips.com](mailto:hello@meteortips.com) and
    I’ll get back to you shortly.


    That’s basically it for now though. There’s a lot of work ahead, so I guess I
    should go back to writing.


    Talk soon,<br /> David Turnbull


    P.S. If you’re wondering where to go from here, checking out [the tutorials section
    on the blog](http://meteortips.com/tutorials) is a good place to begin.'
