  trans: "\n最后一行非常重要，因为：\n\n1. 它意味着本地服务器已经启动。\n2. 它为本地服务器提供了一个 URL。\n\n此时，打开 Google\
    \ Chrome 浏览器并导航到 [`localhost:3000`](http://localhost:3000)。你应该能看到类似下面的内容：\n\n\
    ![在 Google Chrome 中运行的默认 Meteor 应用。](img/00007.jpeg)\n\n在 Google Chrome 中运行的默认\
    \ Meteor 应用。\n\n这是每个新 Meteor 项目包含的默认代码的结果。如果它出现在浏览器中，说明一切运行都符合预期。从现在起，保持本地服务器运行，以便持续查看你代码的结果。\n\
    \n### 3.4 默认应用程序\n\n默认的 Meteor 应用并没有那么有趣，我不会费精力解释幕后发生了什么，因为无论如何在编写排行榜（Leaderboard）时，我们会涵盖所有相同的内容。不过，我会要求你点击我们这个单调界面中那个孤零的按钮。\n\
    \n点击那个按钮会发生什么？\n\n如果你说“什么都没有发生”，我是可以原谅你的。\n\n事实上，确实有某些事情在发生——只是这些事情没有通过界面传达，所以并不显而易见。\n\
    \n为了证明这一点，在 Google Chrome 中打开 JavaScript 控制台：\n\n1. 点击 `View`（查看）菜单。\n2. 悬停在 `Developer`（开发者）选项上。\n\
    3. 选择 `JavaScript Console`（JavaScript 控制台）选项。\n\n浏览器底部打开一个面板。再次点击应用程序界面内的按钮，你会注意到面板内部出现了一条消息，写着“You\
    \ pressed the button”（你点击了按钮）。\n\n![发送到 JavaScript 控制台的语句。](img/00008.jpeg)\n\n\
    发送到 JavaScript 控制台的语句。\n\n在我们项目中，有一个 `console.log` 语句，每次点击按钮时都会触发。该语句看起来如下：\n\n\
    ```\nconsole.log(\"You pressed the button.\");\n```\n\n我们并不特别关心这个按钮，但是：\n\n1.\
    \ 在接下来的章节中，我们将使用 `console.log` 语句来显示数据，而不是立即创建用户界面。\n2. 可以在 JavaScript 控制台中输入一系列命令，允许我们轻松地操作\
    \ Meteor 应用的数据库。\n3. 错误将显示在 JavaScript 控制台中，使其成为修复我们代码问题的方便工具。\n\n出于这些原因，从现在起请离开\
    \ JavaScript 控制台。\n\n### 3.5 客户端与服务器\n\n要开始编写我们的 Meteor 应用，请打开项目中的 HTML 和 JavaScript\
    \ 文件并删除其内容。甚至不需要看代码。只需全选并点击“Delete”按钮。你不需要碰 CSS 文件，因为默认它是空的。\n\n保存 HTML 和 JavaScript\
    \ 文件后，你可能会发现网页浏览器会自动刷新。这是因为 Meteor 自带了“LiveReload”功能，当我们做出更改时它会自动为我们刷新浏览器。\n\n\
    在 JavaScript 文件中，编写以下行代码：\n\n```\nconsole.log(\"Hello world\");\n```\n\n这就是我们之前遇到的\
    \ `console.log` 语句，如果你切换回 Google Chrome，你会在 JavaScript 控制台中看到“Hello world”字符串。\n\
    \n![\"JavaScript 控制台中的“Hello World”。](img/00009.jpeg)\n\nJavaScript 控制台中的“Hello\
    \ World”。\n\n尽管没有写任何其他代码，但请切换到命令行。你看到了什么？你应该能看到一模一样的“Hello world”字符串。\n\n![\"\
    命令行中的“Hello World”。](img/00010.jpeg)\n\n命令行中的“Hello World”。\n\n这意义重大，因为**我们写了一行在两个地方执行的代码**。代码既运行在客户端（用户浏览器内），也运行在服务器上（应用程序托管的地方）。\n\
    \n我之所以在这里提到这个细节是因为两个原因：\n\n1. 它是 Meteor 的核心功能之一，允许一些非常酷的事情发生。（我们将在整本书中介绍这些“非常酷的事情”。）\n\
    2. 在接下来的章节中，有很多代码是我们*不希望*在两个地方运行的，我们需要知道如何控制这种行为。\n\n关于第二点，在上一行代码下方编写以下条件语句：\n\
    \n```\nif(Meteor.isClient){\n    console.log(\"Hello client\");\n}\n```\n\n保存文件，你会看到“Hello\
    \ client”字符串出现在 JavaScript 控制台中——在客户端，在用户的浏览器内——但没有出现在命令行中。\n\n![\"命令行中的“Hello\
    \ Client”。](img/00011.jpeg)\n\n命令行中的“Hello Client”。\n\n我们也可以相反操作：\n\n```\nif(Meteor.isServer){\n\
    \    console.log(\"Hello server\");\n}\n```\n\n这个“Hello server”字符串将出现在命令行中——在服务器，应用程序托管的地方——但不会出现在\
    \ JavaScript 控制台中。\n\n**但如果让一行代码在两个地方执行的能力是 Meteor 的核心功能之一，为什么我们又想要某些代码*不*在两个地方运行呢？**\n\
    \n想象一下我们写了一些影响用户界面的 JavaScript 代码。也许我们写了一些显示从数据库获取数据的代码。那种代码不需要运行在服务器上。这在逻辑上甚至不通。我们如何能在服务器上“显示”数据呢？那是后台处理的地方。反之亦然。用户界面在服务器上是不可见的。\n\
    \n目前你只需要知道：\n\n1. 一行代码可以在两个地方运行。\n2. 有时我们并不希望代码在两个地方运行。\n\n在本书结束之前，这些信息的适用场景将变得显而易见。之所以现在提到，是因为我们会反复回来。\n\
    \n在本章结束前，删除 `console.log` 语句。\n\n然后我们开始制作排行榜。\n"
- fmt: "\nFirst, there’s no other type of database available for Meteor. If you want\
    \ to use an SQL database, it’s just not possible as of writing these words. Other\
    \ options will be available in the future but, in either case, MongoDB is a good\
    \ default option because:\n\n1. It’s fast.\n2. It’s scalable.\n3. It’s easy to\
    \ earn.\n\nSo even if you’ve never come across it before, any database experience\
    \ should be enough to quickly get a good handle on the basics.\n\nSecond, MongoDB\
    \ uses different words to describe familiar concepts. We won’t, for instance,\
    \ use words like tables, rows, or columns, but the concepts are basically the\
    \ same.\n\nYou can see the differences in this table:\n\n![SQL vs. MongoDB](images/00012.jpeg)\n\
    \n**SQL vs. MongoDB**\n\nIt is, of course, tricky to think of familiar concepts\
    \ with different words, but I’ll remind you what the words mean along the way\
    \ so they should stick by the time you reach the end.\n\n### 4.2 Collections\n\
    \nThe core feature of the Leaderboard application is the list of players. Without\
    \ the list of players, we can’t build anything else of value. This makes the list\
    \ a good place to begin our development journey – from the “middle” of our application\
    \ and moving outward, toward the finer details.\n\nBut where do we store a player’s\
    \ data?\n\nThe generic answer is, “In a database.”\n\nThe more precise and useful\
    \ answer is, “In a collection*,” and as shown in the table before, a collection\
    \ is equivalent to an SQL table.\n\nIf we were to recreate WordPress in Meteor,\
    \ we’d create a collection for the posts, a collection for the users, and a collection\
    \ for the comments. There would be a collection for each type of data. Since we’re\
    \ a creating this Leaderboard application though, we’ll want to create a collection\
    \ for the players.\n\nTo do this, open the JavaScript file and write the following\
    \ statement at the top (outside of the `isClient` and `isServer` conditionals):\n\
    \n```\nnew Meteor.Collection('players');\n```\n\nHere, we’ve created a collection\
    \ named “players” but you can call it whatever you want. Just make sure the name\
    \ is unique. There is, however, a problem: we have no way of referencing this\
    \ collection and, therefore, no way of manipulating it.\n\nTo fix this, we need\
    \ to associate a variable with our collection:\n\n```\nPlayersList = new Meteor.Collection('players');\n\
    ```\n\nNotice that we didn’t use the `var` keyword to define this variable. That’s\
    \ because we want a global variable, since that will allow us to reference the\
    \ variable throughout all of our files rather than just in one of them.\n\nTo\
    \ confirm that the collection exists, switch back to Google Chrome and enter the\
    \ name of the collection into the JavaScript Console:\n\n```\nPlayersList\n```\n\
    \nYou should see the following:\n\n![The \"PlayersList\" collection.](images/00013.jpeg)\n\
    \n**The “PlayersList” collection.**\n\nIf an error is returned, it’s probably\
    \ because you’ve mistyped the name of the variable or made a mistake with the\
    \ syntax in the JavaScript file.\n\nIf an error is not returned, we can continue.\n\
    \n### 4.3 Inserting Data\n\nOur collection exists but it’s empty. To fix this,\
    \ we need to insert some data into the collection and, to achieve this, we can\
    \ insert data:\n\n1. Through the JavaScript Console.\n2. Through the JavaScript\
    \ file.\n3. Through a form in the interface.\n\nI’ll explain these approaches\
    \ during this book but, as you’ll see, manipulating the database through the JavaScript\
    \ Console is the most convenient option.\n\nTo begin, enter the following statement\
    \ into the JavaScript Console:\n\n```\nPlayersList.insert();\n```\n\nThis is the\
    \ syntax we use to manipulate our database. We start with the variable of our\
    \ collection. Then we attach a function to it. But while this is a valid MongoDB\
    \ statement, we haven’t passed any data through the brackets so the statement\
    \ doesn’t do anything. The function is executed but the collection remains unchanged.\n\
    \nTo actually insert data into the collection, we use the following syntax:\n\n\
    ```\nPlayersList.insert({\n    name: 'David',\n    score: 0\n});\n```\n\nHere,\
    \ we’ve done a few things.\n\nFirst, we’ve added a pair of curly braces between\
    \ the brackets. Within these braces, our data is structured in the JSON format.\
    \ If you’re not familiar with the JSON format, you’ll pick it up along the way.\
    \ (It’s not difficult.)\n\nSecond, we’ve defined the name of the *fields* in our\
    \ collection:\n\n* `name`\n* `score`\n\nYou can name these fields whatever you\
    \ like but, since we’ll be referencing them in our code, it’s best to make them\
    \ simple and direct.\n\nThird, we’re setting the values of the fields we’ve created.\
    \ As shown in this table, we’ve given the `name` field a value of “David” and\
    \ the `score` field a value of “0”:\n\n![The structure of our collection.](images/00014.jpeg)\n\
    \n**The structure of our collection.**\n\nFourth, we’ve used a comma to separate\
    \ the different fields. This is something that’s easy to overlook but, without\
    \ a comma, we’d get an error. (If you do come across an error, check the commas!)\n\
    \nUltimately, what we’ve done here is create a MongoDB *document* – the equivalent\
    \ to a *row* in SQL terminology – and our plan is to create one document per player\
    \ in our list. If you want six players in the list, you need to create six.\n\n\
    ```\nPlayersList.insert({\n    name: 'David',\n    score: 0\n});\n```\n\n### 4.4\
    \ Finding Data\n\nWe have a collection that contains our players and their scores\
    \ but we need a way of pulling that data from the collection. This can be achieved\
    \ with the `find` function.\n\nIn the JavaScript Console, enter the following:\n\
    \n```\nPlayersList.find();\n```\n\nThis statement will return the data from the\
    \ collection but it won’t be in its most readable form. That’s why it’s best to\
    \ pair it with the `fetch` function:\n\n```\nPlayersList.find().fetch();\n```\n\
    \nWhen working in the JavaScript Console, the `fetch` function will convert the\
    \ data returned by the `find` function into an array. Simply click on the down-facing\
    \ arrows to see the data contained within each document.\n\n![Using the `fetch`\
    \ function.](images/00016.jpeg)\n\n**Using the `fetch` function.**\n\nTo retrieve\
    \ a precise selection of data from the collection, rather than all of the data,\
    \ we can write something like:\n\n```\nPlayersList.find({ name: 'David' }).fetch();\n\
    ```\n\nHere, we’re passing a field and a value through the `find` function and,\
    \ as a result, we’re able to just retrieve the documents in the collection where\
    \ the player’s name is equal to “David”. If you don’t have any players in your\
    \ collection with the name of “David”, an empty array will be returned.\n\n![Retrieving\
    \ precise data.](images/00017.jpeg)\n\n**Retrieving precise data.**\n\nWhat’s\
    \ also useful is the ability to count the number of documents in a collection\
    \ by attaching the `count` function to the `find` function:\n\n```\nPlayersList.find().count();\n\
    ```\n\nIf you have six players (documents) in your collection, this pair of chained\
    \ functions will return `6`.\n\n![Using the `count` function.](images/00018.jpeg)\n\
    \n**Using the `count` function.**\n"
