  trans: "\n\n首先，Meteor 目前没有提供其他类型的数据库。如果你想使用 SQL 数据库，在撰写这些文字时是不可能的。虽然未来可能会提供其他选项，但无论何种，MongoDB\
    \ 都是一个很好的默认选项，原因如下：\n\n1. 它很快。\n2. 它具有可扩展性。\n3. 它很容易上手。\n\n所以，即使你从未遇到过它，任何数据库经验都足以让你快速掌握基础知识。\n\
    \n其次，MongoDB 使用不同的词来描述熟悉的概念。例如，我们不会使用表（tables）、行（rows）或列（columns）等词，但这些概念基本上是相同的。\n\
    \n你可以通过下表看到差异：\n\n![SQL vs. MongoDB](img/00012.jpeg)\n\n**SQL vs MongoDB**\n\n\
    当然，用不同的词思考熟悉的概念是很困难的，但我会在过程中提醒你这些词的含义，这样当你读到最后时，它们应该已经记住了。\n\n### 4.2 集合 (Collections)\n\
    \n排行榜应用程序的核心功能是玩家列表。没有玩家列表，我们就无法构建任何其他有价值的内容。这使得列表成为我们开发之旅的良好起点——从应用程序的“中间”开始，向外移动，直到更细的细节。\n\
    \n但是，我们在哪里存储玩家数据呢？\n\n通用的答案是“在数据库中”。\n\n更精确且实用的答案是“在*集合*（collection）中”，如之前的表格所示，集合等同于\
    \ SQL 表。\n\n如果我们在 Meteor 中重新创建 WordPress，我们会为文章创建一个集合，为用户创建一个集合，并为评论创建一个集合。每种类型的数据都会有一个集合。但由于我们正在创建这个排行榜应用程序，我们将想要为玩家创建一个集合。\n\
    \n要做到这一点，请打开 JavaScript 文件，并在顶部编写以下语句（在 `isClient` 和 `isServer` 条件判断之外）：\n\n```\n\
    new Meteor.Collection('players');\n```\n\n在这里，我们创建了一个名为“players”的集合，但你可以为它起任何名字。只需确保名称是唯一的即可。然而，有一个问题：我们无法引用这个集合，因此也无法操作它。\n\
    \n为了修复这个问题，我们需要将变量与集合关联联：\n\n```\nPlayersList = new Meteor.Collection('players');\n\
    ```\n\n注意，我们没有使用 `var` 关键字来定义这个变量。这是因为我们想要一个全局变量，因为这将允许我们在所有文件中引用该变量，而不仅仅是在其中一个文件中。\n\
    \n为了确认集合是否存在，切换回 Google Chrome 并在 JavaScript 控制台中输入集合的名称：\n\n```\nPlayersList\n\
    ```\n\n你应该看到以下内容：\n\n![The“PlayersList”集合.](img/00013.jpeg)\n\n**“PlayersList”集合。**\n\
    \n如果返回了错误，可能是因为你写错了变量名，或者在 JavaScript 文件中犯了语法错误。\n\n如果没有返回错误，我们就可以继续。\n\n### 4.3\
    \ 插入数据 (Inserting Data)\n\n我们的集合已经存在，但它是空的。为了修复这个问题，我们需要向集合中插入一些数据，为了实现这一点，可以通过以下方式插入数据：\n\
    \n1. 通过 JavaScript 控制台。\n2. 通过 JavaScript 文件。\n3. 通过界面中的表单。\n\n我将在本书中解释这些方法，但正如你所见的，通过\
    \ JavaScript 控制台操作数据库是最方便的选择。\n\n开始之前，在 JavaScript 控制台中输入以下语句：\n\n```\nPlayersList.insert();\n\
    ```\n\n这是我们用来操作数据库的语法。我们从集合的变量开始，然后给它挂载一个函数。虽然这是一个有效的 MongoDB 语句，但我们没有通过括号传递任何数据，所以该语句没有执行任何操作。函数执行了，但集合保持不变。\n\
    \n要实际向集合中插入数据，我们使用以下语法：\n\n```\nPlayersList.insert({\n    name: 'David',\n   \
    \ score: 0\n});\n```\n\n在这里，我们做了几件事。\n\n首先，我们在括号之间添加了一对大括号。在这些括号内部，我们的数据以 JSON\
    \ 格式结构化。如果你不熟悉 JSON 格式，你会在过程中学到它。（这并不难。）\n\n其次，我们定义了集合中*字段*（fields）的名称：\n\n* `name`\n\
    * `score`\n\n你可以根据喜好为这些字段命名，但由于我们将在代码中引用它们，最好让它们保持简单直观。\n\n第三，我们正在设置创建的字段的值。如表所示，我们给\
    \ `name` 字段赋予了值“David”，给 `score` 字段赋予了值“0”：\n\n![我们集合的结构.](img/00014.jpeg)\n\n\
    **我们集合的结构。**\n\n第四，我们使用逗号来分隔不同的字段。这是一个很容易被忽略的点，但如果没有逗号，我们就会得到错误。（如果你遇到错误，请检查逗号！）\n\
    \n最终，我们在这里做的是创建了一个 MongoDB *文档*（document）——等同于 SQL 术语中的*行*（row）——我们的计划是为列表每个玩家创建一个文档。如果你想列表中有六个玩家，你需要创建六个。\n\
    \n```\nPlayersList.insert({\n    name: 'David',\n    score: 0\n});\n```\n\n###\
    \ 4.4 查找数据 (Finding Data)\n\n我们有一个包含玩家及其得分的集合，但我们需要一种方法从集合中提取这些数据。这可以通过 `find`\
    \ 函数实现。\n\n在 JavaScript 控制台中，输入以下内容：\n\n```\nPlayersList.find();\n```\n\n该语句将返回集合的数据，但它不会以最易读的形式呈现。这就是为什么最好与\
    \ `fetch` 函数配合使用：\n\n```\nPlayersList.find().fetch();\n```\n\n在 JavaScript 控制台中工作时，`fetch`\
    \ 函数将 `find` 函数返回的数据转换为数组。只需点击向下的箭头即可查看每个文档中包含的数据。\n\n![使用 fetch 函数.](img/00016.jpeg)\n\
    \n**使用 fetch 函数。**\n\n为了从集合中检索精确的数据，而不是所有数据，我们可以编写类似代码：\n\n```\nPlayersList.find({\
    \ name: 'David' }).fetch();\n```\n\n在这里，我们通过 `find` 函数传递了一个字段和一个值，结果是，我们能够仅检索集合中玩家名字等于“David”的文档。如果你的集合中没有名为“David”的玩家，将返回一个空数组。\n\
    \n![检索精确数据.](img/00017.jpeg)\n\n**检索精确数据。**\n\n同样实用的还有通过在 `find` 函数上挂载 `count`\
    \ 函数来统计集合中文档的数量：\n\n```\nPlayersList.find().count();\n```\n\n如果你在集合中有六个玩家（文档），这对链式函数将返回\
    \ `6`。\n\n![使用 count 函数.](img/00018.jpeg)\n\n**使用 count 函数。**\n\n"
- fmt: "To count a precise selection of data from the collection, pass something through\
    \ the brackets of the `find` function and attach a `count` function to that, like\
    \ so:\n\n```\nPlayersList.find({ name: 'David' }).count();\n```\n\nHere, we’re\
    \ counting the number of documents in the collection where the “name” field is\
    \ set to “David”. If one of your player’s names is set to “David”, this statement\
    \ will return `1`. If none of your player’s names are set to “David”, this statement\
    \ will return `0`.\n\nAt this point, we’ve only scratched the surface of the `find`\
    \ function but a lot of functionality is available through what we’ve learned.\n\
    \n## 5 Templates\n\nWith a collection created and some data in place, we can start\
    \ building the user interface for the Leaderboard application.\n\nTo begin, setup\
    \ the basic HTML structure for our application by opening the HTML file and pasting\
    \ the following code into it:\n\n```\n<head>\n <title>Leaderboard</title>\n</head>\n\
    <body>\n <h1>Leaderboard</h1>\n</body>\n```\n\nRight off the bat, there appears\
    \ to be a few things missing from this code:\n\n1. We haven’t included the `html`\
    \ tags.\n2. We haven’t included any JavaScript files.\n3. We haven’t included\
    \ any CSS files.\n\nBut we haven’t included these things because we don’t have\
    \ to include them. Meteor takes care of it for us. It includes the `html` tags\
    \ automatically and also includes any CSS and JavaScript files that our application\
    \ needs.\n\nOne of Meteor’s core principles is developer happiness, so there’s\
    \ a lot of handy features like this that’ll make your development life easier.\n\
    \n![The current interface.](images/00019.jpeg)\n\nThe current interface.\n\n###\
    \ 5.1 Create a Template\n\nUp next, we want to create a `template`, and by placing\
    \ parts of our user interface inside templates, we’re able to interact with them\
    \ using JavaScript code. (We’ll seen an example of this soon.)\n\nTo create a\
    \ template, add the following code beneath the closing `body` tags inside the\
    \ HTML file:\n\n```\n<template name=\"leaderboard\">\n Hello world\n</template>\n\
    ```\n\nTemplates have a fairly vanilla structure. We use this `template` tag and\
    \ attach a name to the template with this `name` attribute. I’ve named this template\
    \ “leaderboard” but you can name it whatever you like. Just know that we’ll be\
    \ referencing it shortly so, as per usual, it helps to choose a simple and direct\
    \ name that’s easy to remember.\n\nIf you save the file in its current state though,\
    \ the template doesn’t appear in the web browser. It’s in our raw HTML code but\
    \ nowhere else.\n\nWhat’s wrong?\n\nWell, templates don’t appear by default because,\
    \ in some cases:\n\n* You might want a template appear at specific times.\n* You\
    \ might want a template to `dis` at specific times.\n* You might want a template\
    \ to appear in multiple locations.\n\nAs such, templates need to manually included\
    \ after they’re created. This might feel like just an extra step but it’ll be\
    \ increasingly useful as we get deeper into development.\n\nTo make the “leaderboard”\
    \ template appear in the browser, place this tag between the `body` tags:\n\n\
    ```\n{{> leaderboard}}\n```\n\nSo obviously, this isn’t a HTML tag. The double-curly\
    \ braces means it’s part of Meteor’s templating engine – Spacebars. Inspired by\
    \ the Handlebars syntax, this is the syntax we use in our HTML when we want something\
    \ dynamic to occur. We’ll use Spacebars a lot in this tutorial but, for now, just\
    \ know that:\n\n1. All Spacebars tags use the double-curly braces to distinguish\
    \ themselves.\n2. We only use the greater-than symbol when we want to include\
    \ a template.\n\nAt this stage, the HTML file should resemble:\n\n```\n<head>\n\
    \ <title>Leaderboard</title>\n</head>\n<body>\n <h1>Leaderboard</h1>\n {{> leaderboard}}\n\
    </body>\n\n<template name=\"leaderboard\">\n Hello World\n</template>\n```\n\n\
    After saving the file, the “Hello World” text should appear in the browser.\n\n\
    ![The template is now appearing.](images/00020.jpeg)\n\nThe template is now appearing.\n\
    \n### 5.2 Create a Helper\n\nIn our HTML file, we have a template, but it’s static.\
    \ It doesn’t do anything aside from display the boring “Hello World” text. To\
    \ fix this, we can create a `helper`, and a helper is a JavaScript function that’s\
    \ attached to a template. This is best understood with code, so let’s write some.\n\
    \nSwitch to the JavaScript file and write the following statement beneath the\
    \ line where we created our collection:\n\n```\nTemplate.leaderboard.player\n\
    ```\n\nThis is the syntax we use to create a helper and it has three parts.\n\n\
    First, we use the `Template` keyword to search through the templates in our Meteor\
    \ application. We only have one at the moment but a complete application may have\
    \ dozens or even hundreds.\n\nSecond, we use the `leaderboard` keyword to reference\
    \ the name of the template we created earlier. Every helper function we create\
    \ needs to be attached to a single template.\n\nThird, we use the `player` keyword\
    \ to name our helper. We’ll reference this name in the HTML file and, again, you\
    \ can name it whatever you like.\n\nTo attach code to this helper, we associate\
    \ it with a function, like so:\n\n```\nTemplate.leaderboard.player\n```\nWait,\
    \ the text says \"associate it with a function\", let's re-examine the logic.\
    \ The example shows `Template.leaderboard.player`.\n\nActually, the provided text\
