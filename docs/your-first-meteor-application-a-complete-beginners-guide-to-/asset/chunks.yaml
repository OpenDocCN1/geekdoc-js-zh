    \ the `score` field to a value of “5”.\n\nBut still, the `$set` operator only\
    \ *sets* the value of the `score` field to “5”. We could click the “Give 5 Points”\
    \ button a thousand times but, in its current form, a player’s score would change\
    \ to “5” on the first click and then simply remain at that same, static value.\
    \ We’ve taken this slight detour for a couple of reasons though:\n\n*   You’ll\
    \ come across the `$set` operator before too long, so it’s helpful to know about\
    \ it sooner rather than later.\n\n*   There’s a similar operator we can use to\
    \ increment a number.\n\nThat similar operator is the `$inc` operator and it’s\
    \ format is the same:\n\n```\n{$inc: {score: 5}}\n```\n\nThis operator, however,\
    \ will:\n\n1.  Find the current value of the `score` field.\n\n2.  Add the specified\
    \ number on top of the current value.\n\n3.  Save the new value to the document.\n\
    \nIn the end, the code for the event should resemble:\n\n```\n'click #increment':\
    \ function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$inc: {score: 5}}\n    );\n}\n```\n\n\
    To see this new functionality in action:\n\n1.  Switch back to Google Chrome.\n\
    \n2.  Select one of the players in the list.\n\n3.  Click the “Give 5 Points”\
    \ button.\n\nThe score of the selected player will increment in real time features,\
    \ the list will automatically update when teh form is submitted..\n\n![Incrementing\
    \ the `score` field with a value of \"5\".](images/00033.jpeg)\n\nIncrementing\
    \ the `score` field with a value of “5”.\n\n### 8.3 Sorting Documents\n\nOne of\
    \ the most noticeable problems with our application is that the players in our\
    \ list are ranked by the time they were inserted into the collection, rather than\
    \ by their score. This is easy enough to fix though.\n\nIn the JavaScript file,\
    \ take a look at the “player” helper:\n\n```\nTemplate.leaderboard.player = function(){\n\
    \    return PlayersList.find();\n}\n```\n\nThen change the `return` statement\
    \ to this:\n\n```\nreturn PlayersList.find({});\n```\n\nHere, we’re passing empty\
    \ curly braces into the `find` function to explicitly state that we want to retrieve\
    \ all of the documents – all of the players – from the “PlayersList” collection.\n\
    \nSo what we had before:\n\n```\nreturn PlayersList.find();\n```\n\n…is technically\
    \ the same as what we have now:\n\n```\nreturn PlayersList.find({});\n```\n\n\
    The difference is, by using these curly braces, we’re able to pass a second argument\
    \ through the `find` function, and that second argument is where w can start setting\
    \ options that will be applied to the `find` function. We need a first argument\
    \ – even an empty one – before we define a second one though.\n\nFor this second\
    \ argument, we’ll use the `sort` operator:\n\n```\n{sort: {score: -1}}\n```\n\n\
    There’s no `$` this time around but this is a similar structure to the `$set`\
    \ and `$inc` operators that we covered before.\n\nFirst, we start with the field\
    \ we want to affect. In this case, we want to sort based on the `score` field,\
    \ so we write:\n\n```\n{score: -1}\n```\n\nThen we place the operator before it\
    \ and wrap it all in curly braces:\n\n```\n{sort: {score: -1}}\n```\n\nAs for\
    \ the `-1` value, this allows us to sort in descending order – meaning from the\
    \ highest number to the lowest number. If the `score` field contained text, it\
    \ would sort from Z to A. To sort the `score` field in ascending order – from\
    \ lowest to highest – we could set this value to `1` rather than `-1`.\n\nAt this\
    \ point, the `return` statement should resemble:\n\n```\nreturn PlayersList.find({},\
    \ {sort: {score: -1}});\n```\n\n…and the players in the list should be ranked\
    \ by their scores, with the highest scoring player at the top.\n\n![Sorting the\
    \ players.](images/00034.jpeg)\n\nSorting the players.\n\nBut what happens if\
    \ two players have the same score? At the moment, our code doesn’t account for\
    \ this. Ideally though, two players with the same score will be ranked by their\
    \ names. So if Bob and Bill hve the same score, Bill would be ranked above Bob.\n\
    \nTo achieve this, we make the following change to the `sort` operator:\n\n```\n\
    {sort: {score: -1, name: 1}}\n```\n\nHere, we’re sorting by the `score` field\
    \ first in descending order, and then by the `name` field second in ascending\
    \ order.\n\nThe final `return` statement should resemble:\n\n```\nreturn PlayersList.find({},\
    \ {sort: {score: -1, name: 1}});\n```\n\nBecause of Meteor’s real time features,\
    \ the list will automatically update when teh form is submitted. features, the\
    \ player’s ranks will automatically update as their scores change.\n\n![Sorting\
    \ the players with more precision.](images/00035.jpeg)\n\nSorting the players\
    \ with more precision.\n\n### 8.4 Retrieving Data"
