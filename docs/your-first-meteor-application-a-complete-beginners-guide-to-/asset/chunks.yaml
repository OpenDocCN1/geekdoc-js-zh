    \ HTML file and add the following tag between the `body` tags:\n\n```\n{{> loginButtons}}\n\
    ```\n\nHere, we’re including a “loginButtons” template. But where does this template\
    \ come from? It’s from inside the `accounts-ui` package we added to the project.\n\
    \nSwitch to the web browser and notice that we now have a “Sign In” button and,\
