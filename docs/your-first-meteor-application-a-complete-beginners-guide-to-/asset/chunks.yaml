  trans: "\n如果用户已登录，第一个条件将返回 `true`。如果用户未登录，则会触发 `else` 条件。\n\n但我们现在需要使用这个 `Meteor.user()`\
    \ 函数吗？\n\n不需要，现在不需要。它不会在这个排行榜（Leaderboard）应用中发挥作用。然而，它将在你未来的许多 Meteor 应用中发挥作用，正因如此，提一下它是一下它是有价值的。\n\
    \n### 10.5 检查登录状态，部分 2\n\n我们不需要在 JavaScript 文件中检查用户是否已登录，但我们确实需要在模板（template）内部检查用户是否登录。\n\
    \n为什么呢？\n\n因为，如果我们不这样做，即使是未登录的用户也会看到“添加玩家”表单。我们可以在用户未登录时禁用此表单的功能，但如果能让表单从一开始就不出现会更简单。\n\
    \n要实现这一点，请在我们的“addPlayerForm”模板内部编写以下条件判断：\n\n```\n{{#if currentUser}}\n    <p>你已经登录了。</p>\n\
    {{/if}}\n```\n\n在这里发生了两件事。\n\n首先，我们正在使用 Spacebars 语法来创建 `if` 语句本身。就像 `each` 块一样，我们在\
    \ `if` 关键字之前使用了 `#` 符号。\n\n其次，我们引用了此 `currentUser` 对象，这和引用 `Meteor.user()` 函数一样，只不过它是专为在我们的模板中使用而设计的。因此，如果当前用户已登录，`currentUser`\
    \ 将返回当前用户的详细信息——或者在条件判断中返回 `true`——如果当前用户未登录，`currentUser` 将返回 `null`。\n\n最终结果是，这条“你已经登录了”的消息只会在当前用户登录时才会显示。\n\
    \n![检查当前用户是否登录。](img/00054.jpeg)\n\n检查当前用户是否登录。\n\n要在我们的应用中使用此功能，请用 `currentUser`\
    \ 条件将“addPlayerForm”模板中的表单包裹起来，如下所示：\n\n```\n{{#if currentUser}}\n    <form>\n\
    \        <input type=\"text\" id=\"playerName\" />\n        <input type=\"submit\"\
    \ value=\"Add Player\" />\n    </form>\n{{/if}}\n```\n\n结果是，未登录的用户将不再看到表单。\n\n\
    ![未登录。](img/00055.jpeg)\n\n未登录。\n\n### 10.6 每个用户一个排行榜\n\n我们应用的一个关键补充是让每一位用户都拥有他们自己的、唯一的排行榜。这需要几个步骤。\n\
    \n首先，打开 JavaScript 文件并找到附加到“addPlayerForm”模板的 `submit form` 事件。它看起来像这样：\n\n```\n\
    'submit form': function(event, template) {\n    event.preventDefault();\n    var\
    \ playerName = template.find('#playerName').value;\n    PlayersList.insert({\n\
    \        name: playerName,\n        score: 0\n    });\n}\n```\n\n在设置 `playerName`\
    \ 变量的语句下方，创建另一个如下的变量：\n\n```\nvar currentUserId = Meteor.userId();\n```\n\n在这里，我们使用了一个之前没有提到过的函数——`Meteor.userId()`，该函数返回当前登录用户的\
    \ ID。（我们不需要将此值存储在变量中。这仅仅是我的个人偏好。）\n\n接下来，在此事件的 `insert` 函数中添加一个字段，并将该字段的值设置为当前登录用户的\
    \ ID：\n\n```\nPlayersList.insert({\n    name: playerName,\n    score: 0,\n   \
    \ createdBy: currentUserId\n});\n```\n\n（别忘记在 `score` 字段的值之后加上逗号。）\n\n在这里，我们添加了\
    \ `createdBy` 字段，由于我们将已登录用户的 ID 附加到此字段，这意味着现在添加到集合中的每个玩家都将与一个注册用户相关联。\n\n要查看其运行效果：\n\
    \n1. 使用表单向集合中添加一个玩家。\n2. 在 JavaScript 控制台中中使用 `find` 和 `fetch` 函数。\n3. 点击最新文档侧的向下箭头。\n\
    \n你应该能看到如下的内容：\n\n![添加了 `createdBy` 字段。](img/00056.jpeg)\n\n添加了 `createdBy` 字段。\n\
    \n第一步已经完成。\n\n第二步，找到附加到“leaderboard”模板的“player”辅助函数（helper）。它看起来应该如下：\n\n```\n\
    Template.leaderboard.player = function(){\n    return PlayersList.find({}, {sort:\
    \ {score: -1, name: 1}});\n}\n```\n\n然后，在 `return` 语句上方，创建另一个 `currentUserId`\
    \ 变量：\n\n```\nvar currentUserId = Meteor.userId();\n```\n\n再次，我们正在获取当前登录用户的 ID。\n\
    \n我们现在将更改 `return` 语句，使其只从“PlayersList”集合中检索 `createdBy` 字段的值等于当前登录用户 ID 的玩家。\n\
    \n我们是这样做：\n\n```\nTemplate.leaderboard.player = function(){\n    var currentUserId\
    \ = Meteor.userId();\n    return PlayersList.find(\n        {createdBy: currentUserId},\n\
    \        {sort: {score: -1, name: 1}});\n    );\n}\n```\n\n在这里，我们添加了 `createdBy`\
    \ 字段，由于我们将已登录用户的 ID 附加到此字段，这意味着现在添加到集合中的每个玩家都将与一个注册用户相关联。\n"
- fmt: "\nIt might seem like our application is basically finished – it still looks\
    \ ugly but it has a fair few features now – but there’s something pretty major\
    \ we haven’t talked about yet: *security*.\n\nThis book won’t provide everything\
    \ there is to know about security, but over the next couple of chapters, you’ll\
    \ get a good handle on the basics.\n\n## 11.1 Thinking Securely\n\nFor this demonstration,\
    \ create two accounts within your application and, for each account, add three\
    \ players to the leaderboard.\n\nAs an example, here are my two users and their\
    \ players:\n\n![My users and their players.](images/00059.jpeg)\n\nMy users and\
    \ their players.\n\nNext, logout of either account and enter the following statement\
    \ into the JavaScript Console:\n\n```\nPlayersList.find().fetch();\n```\n\nThis\
    \ is nothing new. We’re just retrieving all of the documents from the “PlayersList”\
    \ collection and converting the results into an array.\n\n![Retrieving the data.](images/00060.jpeg)\n\
    \nRetrieving the data.\n\nThere is, however, a problem you may not have considered:\n\
    \n**What happens when the application is deployed to the web?**\n\nWhat happens\
    \ if the average user has this same level of access available to them by opening\
    \ the JavaScript Console and typing commands? Maybe not *every* user has that\
    \ knowledge but isn’t this still a huge security risk? Users can freely navigate\
    \ all of the data in the “PlayersList” collection, including:\n\n* Player IDs.\n\
    * Player names.\n* Player scores.\n* User ID in the `createdBy` field.\n\nIs this\
    \ the most sensitive data in the world? Maybe not. But imagine if we built an\
    \ application for sharing private messages. It’d be unforgivable if someone could\
    \ open the JavaScript Console and browse through all of those messages with complete\
    \ freedom.\n\nBut no matter what you’re building, it’s never a good idea to let\
    \ users have access to more data than they need to have access to. It’s both:\n\
    \n* A security risk.\n* A performance hazard.\n\nBecause while we’ll focus on\
    \ the more important issue of security, you will greatly improve the performance\
    \ of your application if users aren’t granted access to each and every piece of\
    \ data inside your collections.\n\nYou might be wondering though: **why does our\
    \ Meteor application include such a huge security risk by default?** But the answer’s\
    \ quite simple:\n\nConvenience.\n\nBecause of this security risk, we’re able to\
    \ easily navigate through all of the data inside our database through the JavaScript\
    \ Console. We’ve used the `find` and `fetch` functions on numerous occassions\
    \ and these have been very useful because we’re not limited by what data we can\
    \ access.\n\nIt’s just that, before our application is made available to the world,\
    \ we have to make sure that we precisely define what data is available to each\
    \ and every user. Users should be able to access the data they need, but no more\
    \ than that.\n\nTo achieve this, we’ll discuss *publications* and *subscriptions*.\
    \ They’re some of the more abstract concepts for beginners to learn, but for that\
    \ exact reason, we’ll take this nice and slow (and keep it plenty practical).\n\
    \n## 11.2 autopublish\n\nBy default, this security risk is contained within a\
    \ package that’s included with every Meteor project. This package, known as the\
    \ `autopublish` package, allows access to all of the data in our database through\
    \ the JavaScript Console. If we remove this package, our application will become\
    \ more secure, but:\n\n1. All of the data in the “PlayersList” collection will\
    \ become inaccessible.\n2. We’ll have to precisely define what data should be\
    \ accessible.\n\n(You might be wondering what will happen with the `Meteor.users`\
    \ collection, but push aside that thought for a moment.)\n\nTo remove the `autopublish`\
    \ package, enter the following command into the command line:\n\n```\nmeteor remove\
    \ autopublish\n```\n\nIf you’re logged out, you might not notice an immediate\
    \ change, but if you use the `find` and `fetch` functions in the JavaScript Console,\
    \ it’ll appear as if we’ve deleted all of the data from the “PlayersList” collection:\n\
    \n```\nPlayersList.find().fetch();\n```\n\nYou can also login to an account and\
    \ see that the leaderboard is also empty, once again making it appear as if we’ve\
    \ deleted all of the data.\n\n![After removing the `autopublish` package.](images/00061.jpeg)\n\
    \nAfter removing the `autopublish` package.\n\nBut fear not. Our data still exists.\
    \ We just have to take an extra step before that data is made available to the\
    \ client (to the user’s browser) and it’s that extra step which gives us a lot\
    \ more control in terms of security.\n\n## 11.3 isServer\n\nSo far, almost all\
    \ of our code has been written within the `isClient` conditional. This is because\
    \ we’ve been creating helpers and events, and neither of these things should occur\
    \ outside of the user’s browser. It’s time to embark into new territory though\
    \ as we use the `isServer` conditional.\n\nIf the `isServer` conditional is not\
    \ already within the JavaScript file, write the following:\n\n```javascript\n\
    if(Meteor.isServer){\n    // code goes here\n}\n```\n\nAny code within this block\
    \ will only execute on the server, which means two important things:\n\n1. The\
    \ code we write here won’t (directly) affect the user interface.\n2. The code\
    \ we write here will be inherently trusted.\n\nThat second point is the important\
    \ point at the moment, since even though we’ve removed the `autopublish` package,\
    \ we can still retrieve whatever we want as long as we’re retrieving it on the\
    \ server.\n\nFor example, write the following inside the `isServer`:\n\n```javascript\n\
    console.log(PlayersList.find().fetch());\n```\n\nThis wouldn’t be the most useful\
    \ code in the world but, if you save the file and check the command line (*not*\
    \ the JavaScript Console), you’ll notice that our data is retrieved.\n\n![Retrieving\
    \ data on the server.](images/00062.jpeg)\n\nRetrieving data on the server.\n\n\
    ## 11.4 Publications\n\nWhat we want to do now is *publish* the data from within\
    \ our “PlayersList” collection. You can think of this as transmitting our data\
    \ from the server and into the ether. We’re basically saying, “This is the data\
    \ we want to be available to users…” But we don’t specify anything more than that.\n\
    \nWithin the `isServer` conditional, write the following:\n\n```javascript\nMeteor.publish('thePlayers');\n\
    ```\n\nHere, we’re initiating the `publish` function and passing through a name\
    \ as the first argument. This name is simply used as a reference.\n\nNext up,\
    \ pass a function through the second argument:\n\n```javascript\nMeteor.publish('thePlayers',\
    \ function(){\n    // this is where we retrieve the data\n});\n```\n\nWithin this\
    \ function, we specify the data that we want to make available to users. For the\
    \ moment, let’s return all of the data from our collection:\n\n```javascript\n\
    Meteor.publish('thePlayers', function(){\n    return PlayersList.find();\n});\n\
    ```\n\nTo be clear, this function will make *all* of the data from our collection\
    \ available to users, which means it’ll duplicate the functionality of the `autopublish`\
    \ package. Ultimately, this is not what we want, but it’ll do for the time being.\n\
    \n## 11.5 Subscriptions\n\nNow that the data from the “PlayersList” collection\
    \ is being transmitted from the server and into the ether, we need a way of grabbing\
    \ this data from within the client. This process is referred to as *subscribing*.\n\
    \nWithin the `isClient` conditional, write the following:\n\n```javascript\nMeteor.subscribe('thePlayers');\n\
    ```\n\nHere, we’re initiating the `subscribe` function and passing through the\
    \ name that we defined in our `publish` function as the first (and only) argument.\n\
    \nSave the file, switch back to the browser, and notice that the `find` and `fetch`\
    \ functions are once again working in the JavaScript Console:\n\n```javascript\n\
    PlayersList.find().fetch();\n```\n"
