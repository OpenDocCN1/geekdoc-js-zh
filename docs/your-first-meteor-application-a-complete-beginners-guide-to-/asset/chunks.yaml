  trans: "\n\n如果你重新登录其中一个用户账户，你还会发现我们的排行榜再次恢复了功能。但正如我所说，我们正通过 `publish` 函数将所有数据发送到客户端，因此我们的应用程序尚未安全。它只是准备好进行安全加固。\n\
    \n![复制 `autopublish` 程序包。](img/00063.jpeg)\n\n复制 `autopublish` 程序包。\n\n## 11.6\
    \ 精确发布\n\n在 `isServer` 条件判断内部，我们的 `publish` 函数看起来是像这样的：\n\n```\nMeteor.publish('thePlayers',\
    \ function(){\n    return PlayersList.find();\n});\n```\n\n但是，我们不想让 `publish`\
    \ 函数从“PlayersList”函数中检索所有数据，而是想让该函数只检索属于当前登录用户的数据。\n\n这将产生两个显著效果：\n\n1. 登录的用户将只能访问他们的数据。\n\
    2. 未登录的用户将无法访问任何数据。\n\n要进行此更改，请在 `publish` 函数的 `return` 语句上方创建一个 `currentUserId`\
    \ 变量：\n\n```\nvar currentUserId = this.userId;\n```\n\n在 `publish` 函数内部，我们无法使用之前使用的\
    \ `Meteor.userId()` 函数。然而，我们可以在 `publish` 函数中引用 `this.userId` 并实现相同的结果。\n\n我们对\
    \ `this.userId` 的引用将：\n\n1. 返回登录用户的唯一 ID。\n2. 如果用户未登录，则返回 `null`。\n\n这个变量并不是必须的，但它让代码更具可读性。\n\
    \n接下来，将 `return` 语句更改为如下：\n\n```\nreturn PlayersList.find({ createdBy: currentUserId\
    \ });\n```\n\n最终的 `publish` 函数应该类似于：\n\n```\nMeteor.publish('thePlayers', function(){\n\
    \    var currentUserId = this.userId;\n    return PlayersList.find({ createdBy:\
    \ currentUserId });\n});\n```\n\n保存文件后，应用程序将变得安全得多。\n\n为了证明这一点，切换到 Google Chrome，打开\
    \ JavaScript 控制台，并输入以下语句：\n\n```\nPlayersList.find().fetch();\n```\n\n该语句将返回一个空数组，因为“PlayersList”集合中的没有任何数据被发送到客户端。为什么呢？因为我们\
    \ `publish` 函数中的 `return` 语句只返回 `createdBy` 值等于当前用户 ID 的数据。如果当前用户未登录，他们就没有 ID，因此不会返回任何内容。这意味着应用程序的随机访问者无法浏览我们数据库中的任何数据。\n\
    \n![发布的数据。](img/00064.jpeg)\n\n发布的数据。\n\n接下来，登录其中一个账户。你会发现“属于”该用户的玩家出现在排行榜中。你甚至可以在\
    \ JavaScript 控制台中重复上一个的语句，来查看这些玩家的数据：\n\n```\nPlayersList.find().fetch();\n```\n\
    \n但 JavaScript 控制台*仅*返回了属于登录用户的数据。这意味着：\n\n1. 用户只能访问他们自己的数据。\n2. 数据只有在需要传递时才会被传递。\n\
    \n下一章将涵盖安全的另一个重要方面，但我们在这里取得了良好的进展，所以请为自己拍拍手，在继续之前也许可以休息一下。你（以及你的大脑）值得得到一点休息。\n\
    \n## 12 方法 (Methods)\n\n默认情况下，每个 Meteor 项目都有*两个*主要的安全问题：\n\n* 第一个问题是我们在上章节介绍过的——任何用户都能访问数据库中所有数据的能力。\n\
    * 第二个问题是用户仍然可以在极少限制的情况下从数据库中插入、修改和删除数据。\n\n第二个问题正是我们将在下一章节中学习修复的。\n\n### 12.1\
    \ 不安全 (insecure)\n\n在 JavaScript 控制台中，输入以下命令：\n\n```\nPlayersList.insert({name:\
    \ 'Cheater', score: 1000});\n```\n\n看到问题了吗？\n\n如果我们按现状将应用程序部署到网上，任何人都可以打开 JavaScript\
    \ 控制台并自由地向“PlayersList”集合插入任何他们想要的数据。他们还可以修改和删除数据。\n\n再次，这种功能对于开发者来说非常方便——在整本书中我们一直在利用对数据库的直接操作——但这不是我们可以一直留着的。\n\
    \n正如 `autopublish` 程序包的情况一样，此功能包含在一个名为 `insecure` 的程序包中。\n\n要移除 `insecure` 程序包，请在命令行（不是\
    \ JavaScript 控制台）中输入以下命令：\n\n```\nmeteor remove insecure\n```\n\n移除此包后，我们的账户系统仍然可以工作，但应用程序的其他部分将完全崩溃：\n\
    \n1. 我们无法向任何列表添加玩家。\n2. 我们无法从任何列表中移除玩家。\n3. 我们无法修改玩家的分数。\n\n你将继续看到来自数据库的所有当前数据——这仍然由发布和订阅（publications\
    \ and subscriptions）处理——但我们将无法更改或操作这些数据。然而，这是一件好事。\n\n![插入数据失败。](img/00065.jpeg)\n\
    \n插入数据失败。\n\n到为止，`insert`、`update` 和 `remove` 函数一直在客户端上运行。它们都在 `isClient` 条件判断内。虽然这很方便，但只要用户能够从客户端修改数据，我们的数据库将一直面临风险，因为我们永远无法合理地信任用户。我们必须假设客户端上的任何代码都面临被意外操作的风险。\n\
    \n另一种方法——也是移除 `insecure` 包迫使我们采取的方法——是将所有的 `insert`、`update` 和 `remove` 函数移动到服务器端。这是因为服务器上的任何代码本质上都是受信任的。毕竟，是*我们*运行服务器。我们拥有控制权。这使得我们的代码运行在了一个更安全的地方，因为用户无法直接访问它。\n\
    \n因此，在接下来的页面中，我们的目标是将任何数据库操作从 `isClient` 条件判断移动到 `isServer` 条件判断。\n\n这将要求我们创建第一个*方法\
    \ (methods)*。\n\n### 12.2 创建方法\n\n在 JavaScript 文件中，在 `isServer` 条件判断内部编写以下内容：\n\
    \n```\nMeteor.methods({\n    // 方法写在这里\n});\n```\n\n在此块中，我们可以定义想要在服务器上运行但可以从客户端触发的代码。\n\
    \n为了演示这是如何工作的，让我们让提交“添加玩家”表单触发服务器上的一个 `console.log`。\n\n首先，为我们的方法选择一个名称：\n\n```\n\
    Meteor.methods({\n    'executeLogStatement'\n});\n```\n\n你可以随喜为方法命名，但我通常倾向于使用较长的名称，因为描述性有助于提高代码的可读性。\n\
    \n接下来，我们将一个函数与此名称关联：\n\n```\nMeteor.methods({\n    'executeLogStatement': function(){\n\
    \        console.log(\"You submitted the form\");\n    }\n});\n```\n\n（注意，这种语法与\
    \ `events` 块相似，所以我们在这里没有做任何激进。）\n\n此时，我们可以从代码的其他地方*调用*此方法。为了在提交“添加玩家”表单时触发该方法，请将此调用放在\
    \ `submit form` 事件中，如下所示：\n\n```\n'submit form': function(theEvent, theTemplate){\n\
    \    theEvent.preventDefault();\n    var playerNameVar = theTemplate.find('#playerName').value;\n\
    \    PlayersList.insert({\n        name: playerNameVar,\n        score:0\n   \
    \ });\n    Meteor.call('executeLogStatement');\n}\n```\n\n所以这是我们添加的唯一代码：\n\n```\n\
    Meteor.call('executeLogStatement');\n```\n\n我们运行这个 `call` 函数，并传递我们在 `isServer`\
    \ 条件判断内定义的方法名称。\n\n现在，每当你提交表单时，“You submitted the form”字符串就会出现在命令行中（*不是* JavaScript\
    \ 控制台）。希望这能展示我们如何在服务器上执行代码，但从客户端触发它。\n\n"
- fmt: "\nAt this point, it’s time to move the `insert` function from the `submit\
    \ form` event to a method within the `isServer` conditional.\n\nFirst, change\
    \ the name of our current method:\n\n```javascript\nMeteor.methods({\n    'insertPlayerData':\
    \ function(){\n        console.log(\"You submitted the form\");\n    }\n});\n\
    ```\n\nThen add a simple `insert` function into the method:\n\n```javascript\n\
    Meteor.methods({\n    'insertPlayerData': function(){\n        var currentUserId\
    \ = Meteor.userId();\n        PlayersList.insert({\n            name: 'David',\n\
    \            score: 0,\n            createdBy: currentUserId\n        });\n  \
    \  }\n});\n```\n\nHere, we’ve also created another `currentUserId` variable and\
    \ this code works exactly as expected by retrieving the ID of the current user.\n\
    \nYou’ll notice that our `insert` function uses the hard-coded value of “David”\
    \ for the player’s name, which isn’t exactly what we want, but we’ll solve that\
    \ problem in a moment.\n\nFor now, remove the `insert` function from the `submit\
    \ form` event and change the name passed through the `call` function.\n\nThe code\
    \ within the event should then resemble:\n\n```javascript\n'submit form': function(theEvent,\
    \ theTemplate){\n    theEvent.preventDefault();\n    var playerNameVar = theTemplate.find('#playerName').value;\n\
    \    Meteor.call('insertPlayerData');\n}\n```\n\nIf you login to an account and\
    \ try adding a player to the leaderboard, you’ll notice that it kind of works.\
    \ With the current code, the player’s name will always be “David” no matter what\
    \ you enter into the form, but that’s still a step in the right direction.\n\n\
    ![We can only insert players named \"David\".](images/00067.jpeg)\n\nWe can only\
    \ insert players named “David”.\n\nBefore we continue, there’s three important\
    \ things to note:\n\n* The user is unable to insert, update, or remove data through\
    \ the JavaScript Console, so our application has remained secure.\n* When the\
    \ form is submitted, the `insertPlayerData` method is called and the code within\
    \ that method is executed.\n* Because our method executes on the server, the `insert`\
    \ function can execute without trouble since code on the server is inherently\
    \ trusted.\n\nWe do, however, need to allow users to once again choose the name\
    \ of the player they want to insert into the database.\n\n### 12.4 Passing Arguments\n\
    \nIt’s possible to pass arguments into our method calls to make them a lot more\
    \ useful. For example, change the `Meteor.call` function to the following:\n\n\
    ```javascript\nMeteor.call('insertPlayerData', playerNameVar);\n```\n\nHere, we’re\
    \ attaching the `playerNameVar` variable (which contains the value from within\
    \ our text field) to our method call. This means we can now access this data from\
    \ within our method *if* we allow our method to access it.\n\nTo do this, change\
    \ the `insertPlayerData` method to the following:\n\n```javascript\n'insertPlayerData':\
    \ function(playerNameVar){\n    var currentUserId = Meteor.userId();\n    PlayersList.insert({\n\
    \        name: 'David',\n        score: 0,\n        createdBy: currentUserId\n\
    \    });\n}\n```\n\nHere, we’ve added the `playerNameVar` parameter between the\
    \ brackets of our function. We can then reference this parameter within the function,\
    \ like so:\n\n```javascript\n'insertPlayerData': function(playerNameVar){\n  \
    \  var currentUserId = Meteor.userId();\n    PlayersList.insert({\n        name:\
    \ playerNameVar,\n        score: 0,\n        createdBy: currentUserId\n    });\n\
    }\n```\n\nHere, we’ve replaced the hard-coded value of “David” with the `playerNameVar`\
    \ variable.\n\nThis is the basic flow of what’s happening:\n\n1. When the form\
    \ is submitted, the `insertPlayerData` method is called and the value from the\
    \ text field is attached to this call.\n2. The method is executed and accepts\
    \ `playerNameVar` as its first and only argument. We can then reference `playerNameVar`\
    \ within the method.\n3. Inside the method, the `insert` function is executed,\
    \ using the value stored within `playerNameVar` as the value for the `name` field.\n\
    \nThe end result is that our “Add Player” form works as expected. The user types\
    \ a name into the text field, submits the form, and that name is added to that\
    \ user’s leaderboard. The only difference is, the `insert` function is executing\
    \ within the trusted environment of the server and users are still unable to use\
    \ the `insert`, `update`, or `remove` functions from the JavaScript Console. As\
    \ a result, our application is a lot more secure.\n\nThis was just one method\
    \ though. We still need to move some code from the `isClient` conditional to the\
    \ `isServer` conditional to make everything once again functional.\n\n### 12.5\
    \ Removing Players\n\nWithin the same `methods` block we created before, create\
    \ a new method to handle the removal of players from the collection:\n\n```javascript\n\
    'removePlayer': function(){\n    // code goes here\n}\n```\n\nMake sure the methods\
    \ within this block are separated with commas, meaning the entire block should\
    \ resemble the following:\n\n```javascript\nMeteor.methods({\n    'insertPlayerData':\
    \ function(playerNameVar){\n        var currentUserId = Meteor.userId();\n   \
    \     PlayersList.insert({\n            name: playerNameVar,\n            score:\
    \ 0,\n            createdBy: currentUserId\n        });\n    },\n    'removePlayer':\
    \ function(){\n        // code goes here\n    }\n});\n```\n\nInside the `isClient`\
    \ conditional, change the `click #remove` event from:\n\n```javascript\n'click\
    \ #remove': function(){\n      var selectedPlayer = Session.get('selectedPlayer');\n\
    \      PlayersList.remove(selectedPlayer);\n}\n```\n\nTo:\n\n```javascript\n'click\
    \ #remove': function(){\n      var selectedPlayer = Session.get('selectedPlayer');\n\
    \      Meteor.call('removePlayer');\n}\n```\n\nSo when a user clicks the “Remove\
    \ Player” button, the `removePlayer` method will now execute. We need to make\
    \ sure the ID of the player is passed through though, so attach the `selectedPlayer`\
    \ variable to the `call` function:\n\n```javascript\n'click #remove': function(){\n\
    \      var selectedPlayer = Session.get('selectedPlayer');\n      Meteor.call('removePlayer',\
    \ selectedPlayer);\n}\n```\n\nWe can then change the `removePlayer` method to\
    \ accept this argument:\n\n```javascript\n'removePlayer': function(selectedPlayer){\n\
    \    // code goes here\n}\n```\n\n…and use it to remove the selected player from\
    \ the collection:\n\n```javascript\n'removePlayer': function(selectedPlayer){\n\
    \    PlayersList.remove(selectedPlayer);\n}\n```\n\n### 12.6 Modifying Scores\n\
    \nI haven’t called this section “Incrementing Scores” or “Decrementing Scores”\
    \ because we’re going to do something special by merging the `click #increment`\
    \ and `click #decrement` events. This means, not only will our code be more secure\
    \ because of methods, there’ll also be less code for us to manage.\n\nAs a reference,\
    \ this is what the `click #increment` event looks like:\n\n```javascript\n'click\
    \ #increment': function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n\
    \    PlayersList.update(\n        {_id: selectedPlayer},\n        {$inc: {score:\
    \ 5}}\n    );\n}\n```\n\nThe only difference between this event and the `click\
    \ #decrement` event though is that the `click #decrement` event has the value\
    \ of the `score` field set to `-5` rather than `5`. It’s a minute difference and\
    \ a lot of duplicate code.\n\nTo continue fixing our application’s functionality,\
    \ create another method inside the same block as before:\n\n```javascript\n'modifyPlayerScore':\
    \ function(){\n    // code goes here\n}\n```\n\nThen cut and paste the `update`\
    \ function from the `click #increment` event and into this new method:\n\n```javascript\n\
    'modifyPlayerScore': function(){\n    PlayersList.update(\n        {_id: selectedPlayer},\n\
    \        {$inc: {score: 5}}\n    );\n}\n```\n\nFrom there, add the `call` function\
    \ to the `click #increment` event:\n\n```javascript\n'click #increment': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n    Meteor.call('modifyPlayerScore');\n\
    }\n```\n\nAs we did with in the previous section, we’ll need to pass the `selectedPlayer`\
    \ variable through our `call` function:\n\n```javascript\n'click #increment':\
    \ function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n    Meteor.call('modifyPlayerScore',\
    \ selectedPlayer);\n}\n```\n\n…and then make sure our method accepts this argument:\n\
    \n```javascript\n'modifyPlayerScore': function(selectedPlayer){\n    // code goes\
    \ here\n}\n```\n"
