    \nHere, I’ve clicked on Bob.\n\n## 8 Databases, Part 2\n\nYes, we’re talking about\
    \ databases again. You’ll be happy to hear though that we won’t dwell on any theory.\n\
    \nIn the coming pages, we’ll:\n\n*   Create a button that, when clicked, increments\
    \ the score of the selected player.\n\n*   Rank the players based on their score\
    \ (from highest to lowest).\n\n*   Display the selected player’s name beneath\
    \ the list.\n\nThis might sound like a fair few features for a single chapter\
    \ but, as you’ll see, it doesn’t require a lot of code.\n\n### 8.1 Another Event\n\
    \nTo create the “Give 5 Points” button, place the following code in the “leaderboard”\
    \ template:\n\n```\n<input type=\"button\" id=\"increment\" value=\"Give 5 Points\"\
    \ />\n```\n\nMake sure this button:\n\n*   Is outside of the `each` block.\n\n\
    *   Has an ID that we can reference.\n\nI also chose to wrap my button in `li`\
    \ tags so I could align it nicely at the bottom of my list.\n\n![My design skills.](images/00031.jpeg)\n\
    \nMy design skills.\n\nNext, we need to attach an event to this button, so switch\
    \ back to the JavaScript file and take a look at the current events block:\n\n\
    ```\nTemplate.leaderboard.events({\n    'click li.player': function(){\n     \
    \   var playerId = this._id;\n        Session.set('selectedPlayer', playerId);\n\
    \        var selectedPlayer = Session.get('selectedPlayer');\n        console.log(selectedPlayer);\n\
    \    }\n});\n```\n\nBecause the event we want to create will also be attached\
    \ to the “leaderboard” template, we don’t have to create a new events block. We\
    \ can place both events inside this block by separating them with commas:\n\n\
    ```\nTemplate.leaderboard.events({\n    'click li.player': function(){\n     \
    \   var playerId = this._id;\n        Session.set('selectedPlayer', playerId);\n\
    \        var selectedPlayer = Session.get('selectedPlayer');\n        console.log(selectedPlayer);\n\
    \    },\n    'click #increment': function(){\n        // code goes here\n    }\n\
    });\n```\n\n**Don’t forget the comma**. It’s one of the simplest mistakes you\
    \ can make and will only result in an abundance of unnecessary hair-pulling.\n\
    \nWithin the `click #increment` event that we’ve created, we’ll need to access\
    \ the ID of the player that the user has clicked because we’ll use that ID to:\n\
    \n1.  Find the player with that ID in our collection.\n\n2.  Increment the `score`\
    \ field of that player by 5.\n\n3.  Save the result to the database.\n\nThe ID\
    \ will still be stored in our session so let’s create a variable and use `Session.get`\
    \ to access this session inside our event:\n\n```\nvar selectedPlayer = Session.get('selectedPlayer');\n\
    ```\n\nAt this point, our event should resemble:\n\n```\n'click #increment': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n}\n```\n\nSo when a\
    \ user clicks on the `#increment` button, the ID of the selected player will be\
    \ pulled from the session and stored in the `selectedPlayer` variable. We’ll reference\
    \ this variable in the next step.\n\n### 8.2 Advanced Operators\n\nInside the\
    \ `click #increment` event, add the following line beneath our previous statement:\n\
    \n```\nPlayersList.update();\n```\n\nThis is the function we use to update an\
    \ individual player – specifically, an individual player’s document – within our\
    \ collection. It doesn’t work exactly as you might first expect though."
