    ### 2.1 Command Line


    Once upon a time, computers didn’t have graphical interfaces. Instead, `command
    line` are used by:


    1.  People who forgot to update their systems.

    2.  Developers.


    Because while graphical interfaces are convenient and simple to use, they’re also
    time-consuming. (You might think clicking is faster than typing but being able
    to use a computer without lifting your fingers from the keyboard is one of those
    abilities that will make you feel superhuman.)


    For these reasons, we don’t use a graphical interface when working with Meteor.
    It’d waste the time of developers.


    All computers should have access to a command line and they’ll generally work
