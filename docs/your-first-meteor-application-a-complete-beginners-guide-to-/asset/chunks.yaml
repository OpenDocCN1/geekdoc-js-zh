  trans: "\n要从集合中精确计数数据，请将内容传递到 `find` 函数的括号中，并对其挂载一个 `count` 函数，如下所示：\n\n```\nPlayersList.find({\
    \ name: 'David' }).count();\n```\n\n在这里，我们正在统计集合中“name”字段被设置为“David”的文档数量。如果你的某个玩家的名字被设置为“David”，该语句将返回\
    \ `1`。如果没有任何玩家的名字被设置为“David”，该语句将返回 `0`。\n\n此时，我们仅触及 `find` 函数的冰一角，但通过我们学到的知识已经可以使用很多功能了。\n\
    \n## 5 模板\n\n在创建了集合并准备好数据后，我们可以开始为排行榜（Leaderboard）应用构建用户界面。\n\n首先，通过打开 HTML 文件并将以下代码粘贴其中，为我们的应用程序设置基础的\
    \ HTML 结构：\n\n```\n<head>\n <title>Leaderboard</title>\n</head>\n<body>\n <h1>Leaderboard</h1>\n\
    </body>\n```\n\n**一眼望去，这段代码中似乎缺少了一些东西：\n\n1. 我们没有包含 `html` 标签。\n2. 我们没有包含任何 JavaScript\
    \ 文件。\n3. 我们没有包含任何 CSS 文件。\n\n但我们没有包含这些东西是因为我们不需要包含它们。Meteor 会替我们处理。它会自动包含 `html`\
    \ 标签，还会包含我们应用程序所需的任何 CSS 和 JavaScript 文件。\n\nMeteor 的核心原则之一是开发者快乐（developer happiness），因此有很多像这样方便的功能会让你的开发生活变得更简单。\n\
    \n![当前界面。](img/00019.jpeg)\n\n当前界面。\n\n### 5.1 创建模板\n\n接下来，我们要创建一个 `template`（模板），通过将用户界面的部分放置在模板中，我们能够使用\
    \ JavaScript 代码与它们交互。（我们很快就会看到一个示例。）\n\n要创建一个模板，请在 HTML 文件中 `</body>` 结束标签下方添加以下代码：\n\
    \n```\n<template name=\"leaderboard\">\n Hello world\n</template>\n```\n\n模板具有非常原始的结构。我们使用这个\
    \ `template` 标签，并通过这个 `name` 属性为模板指定一个名称。我将这个模板命名为“leaderboard”，但你可以随心喜欢命名。只需记住我们很快就会引用它，所以按照惯例，选择一个简单直接且易记忆的名称会有帮助。\n\
    \n但如果你按当前状态保存文件，模板并没有出现在浏览器中。它只存在于我们的原始 HTML 代码中，其他地方都没有。\n\n出了什么问题？\n\n嗯，模板默认不会出现，因为在某些情况下：\n\
    \n* 你可能希望模板在特定时间出现。\n* 你可能希望模板在特定时间消失。\n* 你可能希望模板在多个位置出现。\n\n因此，模板在创建后需要手动包含。这可能感觉像是多了一个步骤，但随着我们不断深入开发，它将变得越来越有用。\n\
    \n要让“leaderboard”模板出现在浏览器中，请在 `<body>` 标签之间放置此标签：\n\n```\n{{> leaderboard}}\n\
    ```\n\n显然，这不是一个 HTML 标签。双大括号意味着它是 Meteor 模板引擎——Spacebars 的一部分。它受到 Handlebars 语法的启发，这是我们在\
    \ HTML 中当想要发生动态变化时所使用的语法。我们将在本教程中多次使用 Spacebars，但目前只需知道：\n\n1. 所有 Spacebars 标签都使用双大括号来区分自己。\n\
    2. 我们只有在想要包含一个模板时才使用大于符号 `>`。\n\n在此阶段，HTML 文件应该类似于：\n\n```\n<head>\n <title>Leaderboard</title>\n\
    </head>\n<body>\n <h1>Leaderboard</h1>\n {{> leaderboard}}\n</body>\n\n<template\
    \ name=\"leaderboard\">\n Hello World\n</template>\n```\n\n保存文件后，“Hello World”文本应该出现在浏览器中。\n\
    \n![模板现在显示了。](img/00020.jpeg)\n\n模板现在显示了。\n\n### 5.2 创建助手函数 (Helper)\n\n在我们的 HTML\
    \ 文件中，有一个模板，但它是静态的。除了显示无聊的“Hello World”文本外，它什么都不做。为了修复这个问题，我们可以创建一个 `helper`（助手函数），是一个挂载到模板上的\
    \ JavaScript 函数。通过代码来理解它是最好的，所以让我们写一些吧。\n\n切换到 JavaScript 文件，在我们创建集合行下方编写以下语句：\n\
    \n```\nTemplate.leaderboard.player\n```\n\n这是我们用于创建助手函数的语法，它包含三个部分。\n\n首先，我们使用\
    \ `Template` 关键字搜索 Meteor 应用程序中的模板。我们目前只有一个，但一个完整的应用程序可能有几十甚至数百个。\n\n其次，我们使用 `leaderboard`\
    \ 关键字引用我们之前创建的模板。我们创建的每个助手函数都需要挂载到单个模板上。\n\n第三，我们使用 `player` 关键字为我们的助手函数命名。我们会在\
    \ HTML 文件中引用此名称，再次你可以随心喜欢命名。\n\n要将代码挂载到此助手函数，我们将其与函数关联，如下所示：\n\n```\nTemplate.leaderboard.player\n\
    ```\n"
- fmt: "\nThis tag does reference our helper but not in the way we want. Instead,\
    \ we want to write the following in our “leaderboard” template:\n\n```\n{{#each\
    \ player}}\ntest\n{{/each}}\n```\n\nHere, a few things are going on.\n\nFirst,\
    \ the players are being retrieved by referencing the `player` function.\n\nSecond,\
    \ we’re looping through these players with an `each` block (again, using the Spacebars\
    \ syntax).\n\nThird, we’re outputting the word “test” for each player that’s in\
    \ the list.\n\nConceptually, it’s like we have an array:\n\n```\nvar player =\
    \ ['David', 'Bob', 'Bill', 'Mary', 'Warren', 'Tim'];\n```\n\n…and it’s like we’re\
    \ using a `forEach` loop to loop through the values within this array:\n\n```\n\
    player.forEach(function(){\n    document.write('test');\n});\n```\n\nAs a result,\
    \ the amount of times the word “test” appears in the interface will be equal to\
    \ the amount of players in the collection. If there’s six players in the collection,\
    \ the word “test” will appear six times.\n\nWithin this `each` block that we’ve\
    \ created, we can also retrieve the fields associated with the data that we’re\
    \ retrieving. We’re retrieving data from the `PlayersList` collection, so we can\
    \ display the values from both the `name` and `score` fields.\n\nTo to make our\
    \ list show a list of player’s names, for instance, we can write:\n\n```\n{{#each\
    \ player}}\n    {{name}}\n{{/each}}\n```\n\n(When referencing fields, we surround\
    \ the field name with double-curly braces and nothing else.)\n\n![A list of the\
    \ player's names.](images/00023.jpeg)\n\nA list of the player’s names.\n\nWe could\
    \ also display the player’s scores beside their names:\n\n```\n{{#each player}}\n\
    \    {{name}} {{score}}\n{{/each}}\n```\n\nBut while I’m not too concerned with\
    \ making the user interface pretty – I’ve always found that focusing on design\
    \ in a technical book is a waste of time – it is helpful if the interface has\
    \ slightly better structure:\n\n```html\n<ul\n    {{#each player}}\n        <li>{{name}}:\
    \ {{score}}</li>\n    {{/each}}\n</ul>\n```\n\nThe names of the players will now\
    \ appear in a list with their scores beside their names. By default, the players\
    \ will be sorted by the date they were inserted into the collection in ascending\
    \ order (from oldest to youngest).\n\n![A list of players and their scores.](images/00024.jpeg)\n\
    \nA list of players and their scores.\n\nIf you’ve come to Meteor from any other\
    \ framework or language, you can probably see that we’re getting a lot of functionality\
    \ from a small amount of code, and it only gets better from here.\n\n## 6 Events\n\
    \nAt the moment, we have a list of players but no way to interact with this list\
    \ of players. We’re retrieving data from a collection but, as far as the user\
    \ is concerned, the web application is static. It’ll take a few steps to fix this\
    \ but, first, we’ll create the effect of selecting players. Specifically, when\
    \ a user clicks on an `li` element that contains a player’s name, the background\
    \ of that `li` element will change colour.\n\nTo achieve this, we’ll use two components\
    \ of Meteor:\n\n*   Events, to detect that the user has clicked something.\n*\
    \   Sessions, to store the data of what they’ve clicked.\n\nIn this chapter, we’ll\
    \ focus on `events`.\n\n### 6.1 Create an Event\n\nBy creating events within Meteor,\
    \ we’re able to trigger the execution of code when the user clicks a button, submits\
    \ a form, taps a key on their keyboard, or does one of the many things that we’re\
    \ able to track and respond to. Meteor can detect a range of different events\
    \ and we’re able to make something happen when those events occur.\n\nTo see this\
    \ in action, write the following line within the `isClient` conditional:\n\n```\n\
    Template.leaderboard.events();\n```\n\nHere, a few things are happening.\n\nFirst,\
    \ the `Template` keyword searches through the available templates in our application.\
    \ (This is exactly what we did when creating the helper function.)\n\nSecond,\
    \ the `leaderboard` keyword is the name of the template we want to associate with\
    \ our events. As with helpers, events must be attached to a template.\n\nThird,\
    \ we use the `events` keyword to specify that, within the coming block of code,\
    \ we want to create one or more events.\n\nInside the brackets at the end of this\
    \ statement, we’ll define our events in the JSON format, meaning we’ll use a pair\
    \ of curly braces:\n\n```\nTemplate.leaderboard.events({\n    // events go here\n\
    });\n```\n\nWe’ll then use the following syntax between the curly braces to create\
    \ our first event:\n\n```\n'click': function(){\n    // code goes here\n}\n```\n\
    \nThis syntax might look a little weird but I’ll explain what’s going on.\n\n\
    First, we’ve defined the event `type`. That’s the `click` part within the inverted\
    \ commas. This means the code within the associated function will execute when\
    \ a user clicks something. We haven’t specific what the user has to click so the\
    \ code will execute when the user clicks anything within the bounds of the “leaderboard”\
