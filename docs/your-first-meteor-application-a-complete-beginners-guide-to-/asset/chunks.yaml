- fmt: "\nAt this point, your computer will connect to `install.meteor.com` and retrieve\
    \ the latest version of Meteor. It’ll then download the latest version of Meteor\
    \ and install it.\n\n![Downloading the latest version of Meteor.](images/00002.jpeg)\n\
    \nDownloading the latest version of Meteor.\n\nIf the command doesn’t work – if\
    \ an error appears – try the following command:\n\n```\nsudo curl https://install.meteor.com\
    \ | /bin/sh\n```\n\nHere, the addition of this `sudo` keyword allows us to run\
    \ the command as the administrator of the computer. You’ll be prompted for your\
    \ password, so simply enter that and once again tap the “Return” key.\n\nWe’ll\
    \ talk about some other commands in the next chapter but, honestly, it doesn’t\
    \ get more difficult than what we’ve done here. You might want to read [The Command\
    \ Line Crash Course](http://cli.learncodethehardway.org/book/) by Zed Shaw at\
    \ some point, but you won’t need any special knowledge during this book. It’s\
    \ just that, the more you know about the command line, the more productive you\
    \ can be as a developer. You can also find some peace in the fact that, while\
    \ graphical interfaces change based on trends and whims, the command line remains\
    \ beautifully steadfast, so there’s no need to worry about your mastery of it\
    \ suddenly becoming redundant overnight.\n\n## 3 Projects\n\nOn the official website\
    \ for Meteor, there’s an “[Examples](http://meteor.com/examples/)” section that\
    \ shows off four different example applications:\n\n*   Leaderboard\n*   Parties\n\
    *   Todos\n*   Wordplay\n\nThese applications are designed to show off the features\
    \ of Meteor and, since the source code of each application can be downloaded and\
    \ explored, they also act as great learning tools for developers.\n\nIn this chapter,\
    \ we’ll take a look at Leaderboard – the simplest of these four applications –\
    \ and then start rebuilding it from scratch.\n\nThroughout the rest of the book,\
    \ we’ll continue to work on Leaderboard but add some extra features to our creation\
    \ so we can learn more about Meteor.\n\n### 3.1 What is Leaderboard?\n\nA common\
    \ mistake that beginners make is attempting to write code before they have a clear\
    \ idea of what they’re trying to build, but this is like driving to a destination\
    \ without ever looking at a map. You might make a little progress in the right\
    \ direction but you probably won’t get where you need to go.\n\nIn the future,\
    \ once you have some more development experience, it’ll be easier to throw together\
    \ a prototype application without a lot of preparation, but at least for now:\
    \ **think about what you’re trying to build before you try to build it**. If this\
    \ sounds obvious, wonderful. If not, then know that a mix of planning and patience\
    \ is one of your greatest assets as a developer.\n\nIt’s for this reason that\
    \ I like to use the Leaderboard application as the core of this tutorial. It’s\
    \ not the most exciting thing to build but:\n\n1. **It’s conceptually simple**.\
    \ You won’t struggle to grasp the end result and that’ll make it easier to take\
    \ steps toward the end result.\n2. **It already exists**. You can see it and play\
    \ with it, so when I explain what we’re going to build, you’ll know what I’m talking\
    \ about.\n\nOther technical books provide example applications that are more ambitious\
    \ and interesting, which can be a little more motivating in the short term, but\
    \ it also forces readers to think too much about what they’re building rather\
    \ than how to build it. My belief is, it’s best to scale back on the ambition,\
    \ make sure you don’t have to think too hard about what we’re building, and then\
    \ you can derive motivation from making real progress.\n\nTo see the Leaderboard\
    \ application in action, [watch this video](http://meteor.com/examples/leaderboard),\
    \ or to play with it yourself, [check out this demo](http://leaderboard.meteor.com).\
    \ It won’t take long to grasp the core features that we’ll soon recreate:\n\n\
    *   There’s a list of players.\n*   Each player has a score.\n*   A player’s score\
    \ determines their rank.\n*   You can select a player by clicking on them.\n*\
    \   You can increment a selected player’s score.\n\nIt’s not a long list but there’s\
    \ still a lot we can learn from working on this small amount of functionality.\n\
    \n### 3.2 Create a Project\n\nWhen we’re ready to create our first Meteor application,\
    \ we’ll need to start by creating a *project*, and a project is the self-contained\
    \ set of files that forms the foundation of an application.\n\nEvery project is\
    \ different but will generally contain:\n\n*   HTML files, to define templates.\n\
    *   CSS files, to define styles.\n*   JavaScript files, to define logic.\n*  \
    \ Folders, to keep things organised.\n\nIn a moment, we’ll create a project for\
    \ the Leaderboard application but, before we do that, enter the following command\
    \ into the command line:\n\n```\nmkdir Meteor\n```\n\nThis `mkdir` command stands\
    \ for “make directory” and as the name implies, it’s used to create a directory.\
    \ Here, we’ve named the directory “Meteor” but you can name it whatever you want.\
    \ The point of this directory is to store our Meteor projects so we’re able to\
    \ keep them organised in one place. The exact location where this directory is\
    \ created will depend on the operating system but, at least on Mac OS X, it will\
    \ appear inside the “Home” directory. (This is where searching might come in handy.)\n\
    \n![The directory we just made.](images/00003.jpeg)\n\nThe directory we just made.\n\
    \nThe directory we just made Once this directory is created, we can change (navigate)\
    \ into it with this command:\n\n```\ncd Meteor\n```\n\nThe `cd` command stands\
    \ for “change directory” and is the command line equivalent to double-clicking\
    \ on a directory.\n\n![Entering commands into the command line.](images/0004.jpeg)\n\
    \nEntering commands into the command line.\n\nBecause of the `cd` command, we’re\
    \ now inside the “Meteor” directory, which means it’s time to create our project\
    \ with the following command:\n\n```\nmeteor create leaderboard\n```\n\nThis command\
    \ has three parts:\n\n*   The `meteor` part defines this as a command related\
    \ to Meteor.\n*   The `create` part clarifies that we want to create a project.\n\
    *   The `leaderboard` part is the name we’re assigning to the project.\n\nIn place\
    \ of the `create` keyword, we can use a range of other keywords to achieve different\
    \ tasks. I’ll explain these other keywords when they’re relevant.\n\n![Creating\
    \ a Meteor project.](images/00005.jpeg)\n\nCreating a Meteor project.\n\nAfter\
    \ running the previous command, a “leaderboard” directory will appear insde the\
    \ “Meteor” directory that we created. This directory is our Meteor project and,\
    \ by default, will contain three files and a hidden directory:\n\n*   `.meteor`\n\
    *   `leaderboard.html`\n*   `leaderboard.css`\n*   `leaderboard.js`\n\nThe `.meteor`\
    \ directory contains important code that’s required for our application to function,\
    \ so it’s best just to leave it alone. The remainder of the files contain default\
    \ code that we’ll delete a few steps from now.\n\n![Inside our \"Meteor\" folder.](images/00006.jpeg)\n\
    \nInside our “Meteor” folder. Note: If the names of your files are different,\
    \ that’s because, by default, the names of the files are based on the name of\
    \ the project. The names of your files are ultimately irrelevant though they don’t\
    \ have to match the name of the project.\n\n### 3.3 Launch the Local Server\n\n\
    Web applications are not like static websites made of HTML and CSS. You can’t\
    \ simply load the files into a web browser to see them in action. First, we need\
    \ to launch what’s known as a *local server*.\n\nFrom the command line, change\
    \ into the “leaderboard” directory:\n\n```\ncd leaderboard\n```\n\nThen enter\
    \ this command:\n\n```\nmeteor run\n```\n\nAgain, the `meteor` part defines this\
    \ as a command related to Meteor, and then we have the `run` part to clarify the\
    \ precise action we want to take.\n\nIn response to this command, and after a\
    \ few seconds of loading, the following will appear within the command line:\n\
    \n```\n=> Started proxy.\n=> Started MongoDB.     \n=> Started your app.\n=> App\
    \ running at: http://localhost:3000/\n```\n"
  raw: "At this point, your computer will connect to `install.meteor.com` and retrieve\
    \ the latest version of Meteor. It’ll then download the latest version of Meteor\
    \ and install it.\n\n![Downloading the latest version of Meteor.](images/00002.jpeg)\n\
    \nDownloading the latest version of Meteor.\n\nIf the command *doesn’t* work –\
    \ if an error appears – try the following command:\n\n```\nsudo curl https://install.meteor.com\
    \ | /bin/sh\n```\n\nHere, the addition of this `sudo` keyword allows us to run\
    \ the command as the administrator of the computer. You’ll be prompted for your\
    \ password, so simply enter that and once again tap the “Return” key.\n\nWe’ll\
    \ talk about some other commands in the next chapter but, honestly, it doesn’t\
    \ get more difficult than what we’ve done here. You might want to read [The Command\
    \ Line Crash Course](http://cli.learncodethehardway.org/book/) by Zed Shaw at\
    \ some point, but you won’t need any special knowledge during this book. It’s\
    \ just that, the more you know about the command line, the more productive you\
    \ can be as a developer. You can also find some peace in the fact that, while\
    \ graphical interfaces change based on trends and whims, the command line remains\
    \ beautifully steadfast, so there’s no need to worry about your mastery of it\
    \ suddenly becoming redundant overnight.\n\n## 3 Projects\n\nOn the official website\
    \ for Meteor, there’s an “[Examples](http://meteor.com/examples/)” section that\
    \ shows off four different example applications:\n\n*   Leaderboard\n\n*   Parties\n\
    \n*   Todos\n\n*   Wordplay\n\nThese applications are designed to show off the\
    \ features of Meteor and, since the source code of each application can be downloaded\
    \ and explored, they also act as great learning tools for developers.\n\nIn this\
    \ chapter, we’ll take a look at Leaderboard – the simplest of these four applications\
    \ – and then start rebuilding it from scratch.\n\nThroughout the rest of the book,\
    \ we’ll continue to work on Leaderboard but add some extra features to our creation\
    \ so we can learn more about Meteor.\n\n### 3.1 What is Leaderboard?\n\nA common\
    \ mistake that beginners make is attempting to write code before they have a clear\
    \ idea of what they’re trying to build, but this is like driving to a destination\
    \ without ever looking at a map. You might make a little progress in the right\
    \ direction but you probably won’t get where you need to go.\n\nIn the future,\
    \ once you have some more development experience, it’ll be easier to throw together\
    \ a prototype application without a lot of preparation, but at least for now:\
    \ **think about what you’re trying to build before you try to build it**. If this\
    \ sounds obvious, wonderful. If not, then know that a mix of planning and patience\
    \ is one of your greatest assets as a developer.\n\nIt’s for this reason that\
    \ I like to use the Leaderboard application as the core of this tutorial. It’s\
    \ not the most exciting thing to build but:\n\n1.  **It’s conceptually simple**.\
    \ You won’t struggle to grasp the end result and that’ll make it easier to take\
    \ steps toward the end result.\n\n2.  **It already exists**. You can see it and\
    \ play with it, so when I explain what we’re going to build, you’ll know what\
    \ I’m talking about.\n\nOther technical books provide example applications that\
    \ are more ambitious and interesting, which can be a little more motivating in\
    \ the short term, but it also forces readers to think too much about what they’re\
    \ building rather than how to build it. My belief is, it’s best to scale back\
    \ on the ambition, make sure you don’t have to think too hard about what we’re\
    \ building, and then you can derive motivation from making real progress.\n\n\
    To see the Leaderboard application in action, [watch this video](http://meteor.com/examples/leaderboard),\
    \ or to play with it yourself, [check out this demo](http://leaderboard.meteor.com).\
    \ It won’t take long to grasp the core features that we’ll soon recreate:\n\n\
    *   There’s a list of players.\n\n*   Each player has a score.\n\n*   A player’s\
    \ score determines their rank.\n\n*   You can select a player by clicking on them.\n\
    \n*   You can increment a selected player’s score.\n\nIt’s not a long list but\
    \ there’s still a lot we can learn from working on this small amount of functionality.\n\
    \n### 3.2 Create a Project\n\nWhen we’re ready to create our first Meteor application,\
    \ we’ll need to start by creating a *project*, and a project is the self-contained\
    \ set of files that forms the foundation of an application.\n\nEvery project is\
    \ different but will generally contain:\n\n*   HTML files, to define templates.\n\
    \n*   CSS files, to define styles.\n\n*   JavaScript files, to define logic.\n\
    \n*   Folders, to keep things organised.\n\nIn a moment, we’ll create a project\
    \ for the Leaderboard application but, before we do that, enter the following\
    \ command into the command line:\n\n```\nmkdir Meteor\n```\n\nThis `mkdir` command\
    \ stands for “make directory” and as the name implies, it’s used to create a directory.\
    \ Here, we’ve named the directory “Meteor” but you can name it whatever you want.\
    \ The point of this directory is to store our Meteor projects so we’re able to\
    \ keep them organised in one place. The exact location where this directory is\
    \ created will depend on the operating system but, at least on Mac OS X, it will\
    \ appear inside the “Home” directory. (This is where searching might come in handy.)\n\
    \n![The directory we just made.](images/00003.jpeg)\n\nThe directory we just made.\n\
    \nOnce this directory is created, we can *change* (navigate) into it with this\
    \ command:\n\n```\ncd Meteor\n```\n\nThe `cd` command stands for “change directory”\
    \ and is the command line equivalent to double-clicking on a directory inside\
    \ the Finder.\n\n![Entering commands into the command line.](images/00004.jpeg)\n\
    \nEntering commands into the command line.\n\nBecause of the `cd` command, we’re\
    \ now inside the “Meteor” directory, which means it’s time to create our first\
    \ Meteor project with the following command:\n\n```\nmeteor create leaderboard\n\
    ```\n\nThis command has three parts:\n\n*   The `meteor` part defines this as\
    \ a command related to Meteor.\n\n*   The `create` part clarifies that we want\
    \ to create a Meteor project.\n\n*   The `leaderboard` part is the name we’re\
    \ assigning to our project.\n\nIn place of the `create` keyword, we can use a\
    \ range of other keywords to achieve different tasks. I’ll explain these other\
    \ keywords when they’re relevant.\n\n![Creating a Meteor project.](images/00005.jpeg)\n\
    \nCreating a Meteor project.\n\nAfter running the previous command, a “leaderboard”\
    \ directory will appear insde the “Meteor” directory that we created earlier.\
    \ This directory is our Meteor project and, by default, will contain three files\
    \ and a hidden directory :\n\n*   .meteor\n\n*   leaderboard.html\n\n*   leaderboard.css\n\
    \n*   leaderboard.js\n\nThe `.meteor` directory contains important code that’s\
    \ required for our application to function, so it’s best just to leave it alone.\
    \ The remainder of the files contain default code that we’ll delete a few steps\
    \ from now.\n\n![Inside our \"Meteor\" folder.](images/00006.jpeg)\n\nInside our\
    \ “Meteor” folder.\n\n**Note:** If the names of your files are different, that’s\
    \ because, by default, the names of the files are based on the name of the project.\
    \ The names of your files are ultimately irrelevant though so they don’t have\
    \ to match the name of the project.\n\n### 3.3 Launch the Local Server\n\nWeb\
    \ applications are not like static websites made of HTML and CSS. You can’t simply\
    \ load the files into a web browser to see them in action. First, we need to launch\
    \ what’s known as a *local server*.\n\nFrom the command line, change into the\
    \ “leaderboard” directory:\n\n```\ncd leaderboard\n```\n\nThen enter this command:\n\
    \n```\nmeteor run\n```\n\nAgain, the `meteor` part defines this as a command related\
    \ to Meteor, and then we have the `run` part to clarify the precise action we\
    \ want to take.\n\nIn response to this command, and after a few seconds of loading,\
    \ the following will appear within the command line:\n\n```\n=> Started proxy.\n\
    => Started MongoDB.     \n=> Started your app.\n=> App running at: http://localhost:3000/\n\
    ```"
