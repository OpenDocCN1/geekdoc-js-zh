    \ tags:\n\n```\n{{> leaderboard}}\n```\n\nSo obviously, this isn’t a HTML tag.\
    \ The double-curly braces means it’s part of Meteor’s templating engine – Spacebars.\
    \ Inspired by the Handlebars syntax, this is the syntax we use in our HTML when\
    \ we want something dynamic to occur. We’ll use Spacebars a lot in this tutorial\
    \ but, for now, just know that:\n\n1. All Spacebars tags use the double-curly\
    \ braces to distinguish themselves.\n2. We only use the greater-than symbol when\
    \ we want to include a template.\n\nAt this stage, the HTML file should resemble:\n\
    \n```\n<head>\n <title>Leaderboard</title>\n</head>\n<body>\n <h1>Leaderboard</h1>\n\
