  trans: "\n\n此时，你的电脑将连接到 `install.meteor.com` 并获取最新版本的 Meteor。随后它将下载最新版本的 Meteor\
    \ 并进行安装。\n\n![正在下载最新版本的 Meteor。](img/00002.jpeg)\n\n正在下载最新版本的 Meteor。\n\n如果该命令不起作用——如果出现错误——请尝试以下命令：\n\
    \n```\nsudo curl https://install.meteor.com | /bin/sh\n```\n\n在这里，添加 `sudo` 关键字允许我们以计算机管理员的身份运行命令。系统会提示你输入密码，只需输入密码并再次按下“回车”（Return）键即可。\n\
    \n我们将在下一章讨论其他命令，但坦率地说，它们不会比我们在这里所做的更难。你可能想在某时候阅读 Zed Shaw 写的[命令行速成](http://cli.learncodethehardway.org/book/)，但在本书期间你不需要任何特殊知识。只是，你对命令行了解得越多，作为开发者的生产力就越高。你也可以从这样一个事实中获得安心：虽然图形界面会随着趋势和喜好而变化，但命令行始终保持着优美的坚定，因此无需担心你对它的精通会在一夜之间突然变得多余。\n\
    \n## 3 项目\n\n在 Meteor 的官方网站上，有一个“[示例](http://meteor.com/examples/)”部分，展示了四个不同的示例应用程序：\n\
    \n*   排行榜 (Leaderboard)\n*   派对 (Parties)\n*   待事项 (Todos)\n*   文字游戏 (Wordplay)\n\
    \n这些应用程序旨在展示 Meteor 的特性，由于每个应用程序的源代码都可以下载和探索，它们也是开发者很好的学习工具。\n\n在本章中，我们将查看排行榜——这四个应用程序中最简单的一个——然后从头开始构建它。\n\
    \n在书的剩余部分，我们将继续开发排行榜，但为我们的作品添加一些额外功能，以便学习更多 Meteor 知识。\n\n### 3.1 什么是排行榜？\n\n\
    初学者的一个常见错误是在清楚自己想要构建什么之前就尝试编写代码，但这就像在不看地图的情况下开车前往目的地。你可能在正确的方向上取得一点进展，但可能无法到达你想去的地方。\n\
    \n将来，一旦你有了更多的开发经验，不需要大量准备就能凑出一个原型应用将变得更容易，但至少目前：**在尝试构建之前，先想清楚你想构建什么**。如果这听起来很显而易见，太好了。如果不是，请记住规划与耐心的结合是你作为开发者最大的资产之一。\n\
    \n正因如此，我喜欢用排行榜应用程序作为本教程的核心。构建它并不是最令人兴奋的但不：\n\n1. **它在概念上很简单**。你不需要费力去理解最终结果，这将使得朝着目标迈进变得更容易。\n\
    2. **它已经存在了**。你可以看到并玩它，所以当我解释我们要构建什么时，你会知道我在说什么。\n\n其他技术书籍提供的示例应用程序可能更雄心勃勃、更有趣，这在短期内可能更有动力，但它也迫使读者过分思考“正在构建什么”，而不是“如何构建”。我的观点是，最好的方法是收敛野心，确保我们不需要花费太多精力去思考我们在构建什么，然后你就可以从取得实际进展中获得动力。\n\
    \n要查看排行榜应用程序的运行情况，请[观看此视频](http://meteor.com/examples/leaderboard)，或者想亲自玩玩，请[查看此演示](http://leaderboard.meteor.com)。掌握我们很快就要重建的核心功能并不需要长时间：\n\
    \n*   有一份玩家列表。\n*   每个玩家都有一个分数。\n*   玩家的分数决定了他们的排名。\n*   你可以通过点击来选取玩家。\n*   你可以增加被选中玩家的分数。\n\
    \n这不是一个很长的列表，但通过处理这些少量的功能，我们仍然可以学到很多东西。\n\n### 3.2 创建项目\n\n当我们准备好创建第一个 Meteor\
    \ 应用程序时，我们需要从创建一个*项目*开始，项目是构成应用程序基础的自包含文件集。\n\n每个项目都是不同的，但通常会包含：\n\n*   HTML 文件，用于定义模板。\n\
    *   CSS 文件，用于定义样式。\n*   JavaScript 文件，用于定义逻辑。\n*   文件夹，用于保持组织。\n\n稍后，我们将为排行榜应用程序创建一个项目，但在那之前，在命令行中输入以下命令：\n\
    \n```\nmkdir Meteor\n```\n\n此 `mkdir` 命令代表“make directory”（创建目录），正如其名所示，它用于创建目录。在这里，我们将目录命名为“Meteor”，但你可以任由你命名。这个目录的作用是存储我们的\
    \ Meteor 项目，以便我们将它们整齐地放在一个地方。创建此目录的确切位置取决于操作系统，至少在 Mac OS X 上，它会出现在“用户”（Home）目录内部。（在这里搜索可能会派上用场。）\n\
    \n![我们刚刚创建的目录。](img/00003.jpeg)\n\n我们刚刚创建的目录。\n\n我们刚刚创建的目录 一旦创建了这个目录，我们就可以此命令进入（导航）它：\n\
    \n```\ncd Meteor\n```\n\n`cd` 命令代表“change directory”（切换目录），在命令行中等于双击目录。\n\n![在命令行中输入命令。](img/0004.jpeg)\n\
    \n在命令行中输入命令。\n\n由于 `cd` 命令，我们现在进入了“Meteor”目录内部，这意味着是时候使用以下命令创建我们的项目了：\n\n```\n\
    meteor create leaderboard\n```\n\n此命令有三个部分：\n\n*   `meteor` 部分定义了这是一个与 Meteor\
    \ 相关的命令。\n*   `create` 部分明确了我们想要创建一个项目。\n*   `leaderboard` 部分是我们分配给项目的名称。\n\n\
    在 `create` 关键字处，我们可以使用一系列其他关键字来完成不同的任务。我会在相关时解释这些其他关键字。\n\n![创建一个 Meteor 项目。](img/00005.jpeg)\n\
    \n创建一个 Meteor 项目。\n\n运行之前的命令后，“Meteor”目录内部会出现一个“leaderboard”目录。这个目录就是我们的 Meteor\
    \ 项目，默认情况下将包含三个文件和一个隐藏目录：\n\n*   `.meteor`\n*   `leaderboard.html`\n*   `leaderboard.css`\n\
    *   `leaderboard.js`\n\n`.meteor` 目录包含了应用程序所需的重要代码，所以最好不要动它。其余的文件包含了我们几步之后将删除的默认代码。\n\
    \n![“Meteor”文件夹内部。](img/00006.jpeg)\n\n在我们“Meteor”文件夹内部。注意：如果你的文件名不同，那是因为默认情况下文件名是基于项目名称的。尽管如此，文件名并不要求匹配项目名称。\n\
    \n### 3.3 启动本地服务器\n\nWeb 应用程序不像由 HTML 和 CSS 的静态网站。你不能简单地将文件加载到浏览器中查看运行情况。首先，我们需要启动所谓的*本地服务器*。\n\
    \n从命令行进入“leaderboard”目录：\n\n```\ncd leaderboard\n```\n\n然后输入此命令：\n\n```\nmeteor\
    \ run\n```\n\n同样，`meteor` 部分定义了这是一个与 Meteor 相关的命令，然后我们有 `run` 部分来明确我们想要采取的精确操作。\n\
    \n作为此命令的响应，在加载几秒后，命令行中将出现内容：\n\n```\n=> Started proxy.\n=> Started MongoDB.  \
    \   \n=> Started your app.\n=> App running at: http://localhost:3000/\n```\n\n"
- fmt: "\nThat last line is the important part because:\n\n1. It means the local server\
    \ has launched.\n2. It provides a URL for the local server.\n\nAt this point,\
    \ open Google Chrome and navigate to [http://localhost:3000](http://localhost:3000).\
    \ You should see something like the following:\n\n![The default Meteor application,\
    \ running in Google Chrome.](images/00007.jpeg)\n\nThe default Meteor application,\
    \ running in Google Chrome.\n\nThis is the result of the default code that’s included\
    \ with every new Meteor project. If it appears in the browser, then everything’s\
    \ working as expected. Leave the local server running from this point onward to\
    \ continually see the results of your code.\n\n### 3.4 Default Application\n\n\
    The default Meteor application isn’t that exciting and I won’t bother explaining\
    \ what’s going on behind the scenes since we’ll cover all of the same content\
    \ when working on Leaderboard anyway. I will, however, ask you to click on that\
    \ lonesome button sitting within our bleary interface.\n\nWhat happens when you\
    \ click that button?\n\nYou’ll be forgiven for saying, “Nothing.”\n\nIn truth,\
    \ something *is* happening – that something is just not communicated through the\
    \ interface, so it’s not immediately obvious.\n\nFor proof of this, open the JavaScript\
    \ Console within Google Chrome:\n\n1. Click on the `View` menu.\n2. Hover over\
    \ the `Developer` option.\n3. Select the `JavaScript Console` option.\n\nA pane\
    \ will open at the bottom of the browser. Click the button within the application’s\
    \ interface for a second time and notice that a message appears inside this pane\
    \ that says, “You pressed the button.”\n\n![A statement sent to the JavaScript\
    \ Console.](images/00008.jpeg)\n\nA statement sent to the JavaScript Console.\n\
    \nWithin our project’s files, there’s a `console.log` statement that’s been written\
    \ to trigger whenever the button is pressed. That statement looks like this:\n\
    \n```\nconsole.log(\"You pressed the button.\");\n```\n\nWe don’t particularly\
    \ care about this button, but:\n\n1. We’ll be using `console.log` statements in\
    \ the coming chapters to display data instead of immediately creating a user interface.\n\
    2. A range of commands can be entered into the JavaScript Console which allow\
    \ us to easily manipulate our Meteor application’s database.\n3. Errors will appear\
    \ inside the JavaScript Console, making it a handy tool for fixing problems with\
    \ our code.\n\nFor these reasons, leave the JavaScript Console from this point\
    \ onward.\n\n### 3.5 Client vs. Server\n\nTo begin the coding of our Meteor application,\
    \ open the HTML and JavaScript files inside our project and delete their contents.\
    \ Don’t even look at the code. Just select it all and tap the “Delete” button.\
    \ You won’t need to touch the CSS file since it’s empty by default.\n\nAfter saving\
    \ the HTML and JavaScript files, you might notice that the web browser automatically\
    \ refreshes. This is because Meteor comes with a “LiveReload” feature that refreshes\
    \ the browser for us when we make changes.\n\nInside the JavaScript file, write\
    \ the following line of code:\n\n```\nconsole.log(\"Hello world\");\n```\n\nThis\
    \ is the `console.log` statement we came across before and, if you switch back\
    \ to Google Chrome, you’ll see the “Hello world” string in the JavaScript Console.\n\
    \n![\"Hello World\" in the JavaScript Console.](images/00009.jpeg)\n\n“Hello World”\
    \ in the JavaScript Console.\n\nWithout writing any other code though, switch\
    \ to the command line. What do you see? You should see the exact same “Hello world”\
    \ string.\n\n![\"Hello World\" in the command line.](images/00010.jpeg)\n\n“Hello\
    \ World” in the command line.\n\nThis is significant because **we’ve written a\
    \ single line of code that’s executed in two places**. The code has run on both\
    \ the client (within the user’s browser) and on the server (where the application\
    \ is hosted).\n\nI mention this detail now for two reasons:\n\n1. It’s one of\
    \ Meteor’s core features that allows for some very cool things to happen. (We’ll\
    \ cover these “very cool things” throughout the book.)\n2. In the coming chapters,\
    \ there’s a lot of code that we *don’t* want running in both places and we need\
    \ to know how to control this behaviour.\n\nOn that second point, write the following\
    \ conditional beneath the previous line:\n\n```\nif(Meteor.isClient){\n    console.log(\"\
    Hello client\");\n}\n```\n\nSave the file and see that the “Hello client” string\
    \ appears in the JavaScript Console – on the client, within the user’s web browser\
    \ – but does not appear on the command line.\n\n![\"Hello Client\" in the command\
    \ line.](images/00011.jpeg)\n\n“Hello Client” in the command line.\n\nWe can also\
    \ do the reverse:\n\n```\nif(Meteor.isServer){\n    console.log(\"Hello server\"\
    );\n}\n```\n\nThis “Hello server” string will appear on the command line – on\
    \ the server, where the application is hosted – but not in the JavaScript Console.\n\
    \n**But if the ability to have one line of code execute in two places is one of\
    \ Meteor’s core features, why do we want some code to *not* run in both places?**\n\
    \nImagine we write some JavaScript code that affects our user interface. Maybe\
    \ we write some code that displays some data from a database. That sort of code\
    \ would have no need to run on the server. It wouldn’t even make logical sense.\
    \ How could we “display” data on the server? That’s where background processing\
    \ occurs. The same is true in reverse. A user interface can’t be seen on the server.\n\
    \nFor the moment, know that:\n\n1. One line of code can run on both the client\
    \ and the server.\n2. Sometimes, we don’t want our code to run in both places.\n\
    \nBefore the end of this book, the scenarios where this information is relevant\
    \ will become obvious. It’s just important that I mention this early since we’ll\
    \ continually come back to it.\n\nTo end this chapter:\n\n1. Delete the `console.log`\
    \ statements.\n2. Leave the conditionals where they are.\n\nThen let’s start making\
    \ Leaderboard.\n\n## 4 Databases, Part 1\n\nOne of the difficult parts of writing\
    \ a technical book is deciding when to introduce ideas. The usual approach is\
    \ to talk about creating the interface, which has two main benefits:\n\n1. You\
    \ can immediately see something in your browser.\n2. You feel like you’re making\
    \ quick progress.\n\nBut it also introduces a couple of problems that will short-change\
    \ readers as they continue through the pages:\n\n1. It’s harder to truly grasp\
    \ anything concerning the front-end (the interface) when you’re not familiar with\
    \ what’s happening on the back-end (the database, etc).\n2. If we talk about the\
    \ front-end first, we’ll have to back-track in the next chapter anyway, and that\
    \ just makes it like progress has come to a sudden halt.\n\nFor these reasons,\
    \ we won’t start by talking about interfaces. Instead, we’ll start by talking\
    \ about *databases*. If that word alone sends you to sleep, fair enough, but if\
    \ we spend a few minutes talking about what’s going on behind the scenes, you’ll\
    \ have a stronger foundation for the rest of the book.\n\n### 4.1 MongoDB vs.\
    \ SQL\n\nIf you’ve ever installed WordPress, used phpMyAdmin, or built a web application\
    \ in PHP, you’ve come into contact with an SQL database.\n\nBy default, every\
    \ Meteor project comes with its own database. There’s no setup or configuration\
    \ required. It’s just ready to got the moment your project exists. This database,\
    \ however, is *not* an SQL database. Instead, it’s a MongoDB database.\n\nIf you’ve\
    \ never come across MongoDB before, you might be a little worried, but there’s\
    \ no need to be. A MongoDB database is different from an SQL database but, to\
    \ a beginner, these differences are small.\n\nFor the moment, you need to know\
    \ two things:\n"
  raw: "That last line is the important part because:\n\n1.  It means the local server\
    \ has launched.\n\n2.  It provides a URL for the local server.\n\nAt this point,\
    \ open Google Chrome and navigate to [http://localhost:3000](http://localhost:3000).\
    \ You should see something like the following:\n\n![The default Meteor application,\
    \ running in Google Chrome.](images/00007.jpeg)\n\nThe default Meteor application,\
    \ running in Google Chrome.\n\nThis is the result of the default code that’s included\
    \ with every new Meteor project. If it appears in the browser, then everything’s\
    \ working as expected. Leave the local server running from this point onward to\
    \ continually see the results of your code.\n\n### 3.4 Default Application\n\n\
    The default Meteor application isn’t that exciting and I won’t bother explaining\
    \ what’s going on behind the scenes since we’ll cover all of the same content\
    \ when working on Leaderboard anyway. I will, however, ask you to click on that\
    \ lonesome button sitting within our bleary interface.\n\nWhat happens when you\
    \ click that button?\n\nYou’ll be forgiven for saying, “Nothing.”\n\nIn truth,\
    \ something *is* happening – that something is just not communicated through the\
    \ interface, so it’s not immediately obvious.\n\nFor proof of this, open the JavaScript\
    \ Console within Google Chrome:\n\n1.  Click on the `View` menu.\n\n2.  Hover\
    \ over the `Developer` option.\n\n3.  Select the `JavaScript Console` option.\n\
    \nA pane will open at the bottom of the browser. Click the button within the application’s\
    \ interface for a second time and notice that a message appears inside this pane\
    \ that says, “You pressed the button.”\n\n![A statement sent to the JavaScript\
    \ Console.](images/00008.jpeg)\n\nA statement sent to the JavaScript Console.\n\
    \nWithin our project’s files, there’s a `console.log` statement that’s been written\
    \ to trigger whenever the button is pressed. That statement looks like this:\n\
    \n```\nconsole.log(\"You pressed the button.\");\n```\n\nWe don’t particularly\
    \ care about this button, but:\n\n1.  We’ll be using `console.log` statements\
    \ in the coming chapters to display data instead of immediately creating a user\
    \ interface.\n\n2.  A range of commands can be entered into the JavaScript Console\
    \ which allow us to easily manipulate our Meteor application’s database.\n\n3.\
    \  Errors will appear inside the JavaScript Console, making it a handy tool for\
    \ fixing problems with our code.\n\nFor these reasons, leave the JavaScript Console\
    \ from this point onward.\n\n### 3.5 Client vs. Server\n\nTo begin the coding\
    \ of our Meteor application, open the HTML and JavaScript files inside our project\
    \ and delete their contents. Don’t even look at the code. Just select it all and\
    \ tap the “Delete” button. You won’t need to touch the CSS file since it’s empty\
    \ by default.\n\nAfter saving the HTML and JavaScript files, you might notice\
    \ that the web browser automatically refreshes. This is because Meteor comes with\
    \ a “LiveReload” feature that refreshes the browser for us when we make changes.\n\
    \nInside the JavaScript file, write the following line of code:\n\n```\nconsole.log(\"\
    Hello world\");\n```\n\nThis is the `console.log` statement we came across before\
    \ and, if you switch back to Google Chrome, you’ll see the “Hello world” string\
    \ in the JavaScript Console.\n\n![\"Hello World\" in the JavaScript Console.](images/00009.jpeg)\n\
    \n“Hello World” in the JavaScript Console.\n\nWithout writing any other code though,\
    \ switch to the command line. What do you see? You should see the exact same “Hello\
    \ world” string.\n\n![\"Hello World\" in the command line.](images/00010.jpeg)\n\
    \n“Hello World” in the command line.\n\nThis is significant because **we’ve written\
    \ a single line of code that’s executed in two places**. The code has run on both\
    \ the client (within the user’s browser) and on the server (where the application\
    \ is hosted).\n\nI mention this detail now for two reasons:\n\n1.  It’s one of\
    \ Meteor’s core features that allows for some very cool things to happen. (We’ll\
    \ cover these “very cool things” throughout the book.)\n\n2.  In the coming chapters,\
    \ there’s a lot of code that we *don’t* want running in both places and we need\
    \ to know how to control this behaviour.\n\nOn that second point, write the following\
    \ conditional beneath the previous line:\n\n```\nif(Meteor.isClient){\n    console.log(\"\
    Hello client\");\n}\n```\n\nSave the file and see that the “Hello client” string\
    \ appears in the JavaScript Console – on the client, within the user’s web browser\
    \ – but does not appear on the command line.\n\n![\"Hello Client\" in the command\
    \ line.](images/00011.jpeg)\n\n“Hello Client” in the command line.\n\nWe can also\
    \ do the reverse:\n\n```\nif(Meteor.isServer){\n    console.log(\"Hello server\"\
    );\n}\n```\n\nThis “Hello server” string will appear on the command line – on\
    \ the server, where the application is hosted – but not in the JavaScript Console.\n\
    \n**But if the ability to have one line of code execute in two places is one of\
    \ Meteor’s core features, why do we want some code to *not* run in both places?**\n\
    \nImagine we write some JavaScript code that affects our user interface. Maybe\
    \ we write some code that displays some data from a database. That sort of code\
    \ would have no need to run on the server. It wouldn’t even make logical sense.\
    \ How could we “display” data on the server? That’s where background processing\
    \ occurs. A user interface can’t be seen on a server.\n\nThe same is true in reverse.\
    \ In some cases, it makes no logical sense for code to run on the client (within\
    \ the user’s browser), and if you try to run code where it can’t logically run,\
    \ Meteor will spit back an error. I’ll demonstrate one of these errors in a later\
    \ chapter to illustrate this point.\n\nFor the moment, know that:\n\n1.  One line\
    \ of code can run on both the client and the server.\n\n2.  Sometimes, we don’t\
    \ want our code to run in both places.\n\nBefore the end of this book, the scenarios\
    \ where this information is relevant will become obvious. It’s just important\
    \ that I mention this early since we’ll continually come back to it while making\
    \ our application.\n\nTo end this chapter:\n\n1.  Delete the `console.log` statements.\n\
    \n2.  Leave the conditionals where they are.\n\nThen let’s start making Leaderboard.\n\
    \n## 4 Databases, Part 1\n\nOne of the difficult parts of writing a technical\
