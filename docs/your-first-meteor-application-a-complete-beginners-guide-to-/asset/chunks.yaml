    \nBut it also introduces a couple of problems that will only short-change readers\
    \ as they continue through the pages:\n\n1.  It’s harder to truly grasp anything\
    \ concerning the front-end (the interface) when you’re not familiar with what’s\
    \ happening on the back-end (the database, etc).\n\n2.  If we talk about the front-end\
