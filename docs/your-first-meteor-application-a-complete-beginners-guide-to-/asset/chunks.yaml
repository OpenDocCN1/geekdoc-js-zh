  trans: "\n\n考虑以下代码：\n\n```javascript\n'submit form': function(theEvent){\n    console.log(theEvent.type);\n\
    }\n```\n\n在这里，我们能够通过 `theEvent` 关键字在事件内部引用我们的事件，并在 JavaScript 控制台中显示事件的 `type`\
    \ 参数。在这个例中，由于“submit”一词将出现在 JavaScript 控制台中，因为该事件的类型是 `submit`。（但由于页面仍然会刷新，所以该字符串只会短暂出现。）\n\
    \n不过，我们将为了另一个目的来引用我们的事件。\n\n将 `submit form` 事件更改为以下内容：\n\n```javascript\n'submit\
    \ form': function(theEvent){\n    theEvent.preventDefault();\n    console.log('Form\
    \ submitted');\n}\n```\n\n在这里，我们使用 `theEvent` 关键字在事件内部引用事件本身，然后使用此 `preventDefault()`\
    \ 函数来阻止表单的默认行为。结果是，我们的表单将没有任何任何固有的行为，我们将能够从头开始对其进行操作。\n\n在现阶段，当提交表单时，`console.log`\
    \ 语句将触发，且页面不会刷新。\n\n![成功提交表单。](img/00039.jpeg)\n\n成功提交表单。\n\n### 9.3 获取数据\n\n\
    将数据插入到“PlayersList”集合中。我们可以将 JavaScript 控制台中使用过的语法添加到 `submit form` 事件中：\n\n```javascript\n\
    PlayersList.insert({\n    name: 'David',\n    score: 0\n});\n```\n\n但这条精确的语句会为\
    \ `name` 字段插入硬编码的值“David”，而我们希望代码执行的操作是：\n\n1. 从我们的文本字段中获取值。\n2. 将该值用于 `name`\
    \ 字段。\n\n将分数设置为硬编码的值“0”是可以的，因为每个玩家都应该从相同的起点开始，而 `name` 字段的值需要根据用户的输入动态设置。\n\n\
    为了实现这一点，让我们通过事件的函数传递第二个参数：\n\n```javascript\n'submit form': function(theEvent,\
    \ theTemplate){\n    theEvent.preventDefault();\n    console.log('Form submitted');\n\
    }\n```\n\n在这里，我们向函数中添加了 `theTemplate` 关键字，该关键字指向的是我们的事件所绑定的模板。我们的事件绑定在“addPlayerForm”模板上，因此我们可以使用\
    \ `theTemplate` 关键字来：\n\n1. 搜索“addPlayerForm”模板。\n2. 获取带有“playerName” ID 的文本字段的值。\n\
    3. 创建一个使用该值作为 `name` 字段的文档。\n\n考虑以下代码：\n\n```javascript\ntheTemplate.find('#playerName');\n\
    ```\n\n在这里，我们通过 `theTemplate` 关键字引用了“addPlayerForm”，然后使用 `find()` 函数搜索该模板。我们通过此\
    \ `find()` 函数传递的值是一个 CSS 选择器。在此之前，我们在表单的文本字段中添加了“playerName” ID，所以现在我们就可以使用 `#playerName`\
    \ 语法来引用该 ID。\n\n我们写的语句基本上的意思是：“在我们的事件模板中搜索这个特定元素……”\n\n为了方便起见，为这句语句添加一个变量：\n\n\
    ```javascript\nvar playerNameVar = theTemplate.find('#playerName');\n```\n\n然后在\
    \ `console.log` 语句中引用该变量：\n\n```javascript\nconsole.log(playerNameVar);\n```\n\
    \n此时，代码应该类似于：\n\n```javascript\n'submit form': function(theEvent, theTemplate){\n\
    \    theEvent.preventDefault();\n    var playerNameVar = theTemplate.find('#playerName');\n\
    \    console.log(playerNameVar);\n}\n```\n\n但这里有一个问题。我们使用的这个 `find()` 函数只获取 HTML\
    \ 元素本身——也就是说文本字段。但我们想要的不仅仅是文本字段。我们想要文本字段内部的值。\n\n![获取 HTML 元素本身。](img/00040.jpeg)\n\
    \n获取 HTML 元素本身。\n\n要访问文本字段内部的值，请使用 `value` 属性：\n\n```javascript\nvar playerNameVar\
    \ = theTemplate.find('#playerName').value;\n```\n\n现在，用户在文本字段中输入的任何内容在提交表单时都会出现在\
    \ JavaScript 控制台中。\n\n![获取 HTML 元素的值。](img/00041.jpeg)\n\n获取 HTML 元素的值。\n\n为了让表单能够正常工作，将\
    \ `insert()` 函数添加到事件底部，如下所示：\n\n```javascript\n'submit form': function(theEvent,\
    \ theTemplate){\n    theEvent.preventDefault();\n    var playerNameVar = theTemplate.find('#playerName').value;\n\
    \    PlayersList.insert({\n        name: playerNameVar,\n        score:0\n   \
    \ });\n}\n```\n\n保存文件后，在文本字段中输入名称并提交表单，将在“PlayersList”集合中创建一个文档，该文档将提交的值作为该文档中\
    \ `name` 字段的值。\n\n![向列表中添加第七个玩家。](img/00042.jpeg)\n\n向列表中添加第七个玩家。\n\n### 9.4 移除玩家\n\
    \n为了考虑另一个方面面——删除玩家的能力，让我们在界面上添加一个按钮，允许用户从“PlayersList”集合中移除选中的玩家。\n\n在“leaderboard”模板的某处，创建一个新按钮：\n\
    \n```html\n<input type=\"button\" id=\"remove\" value=\"Remove Player\" />\n```\n\
    \n![移除玩家按钮。](img/0043.jpeg)\n\n移除玩家按钮。\n\n在 JavaScript 文件中，为“leaderboard”模板绑定一个事件：\n\
    \n```javascript\n'click #remove': function(){\n    // 代码在此\n}\n```\n\n此事件响应 `click`\
    \ 类型并绑定到带有 `remove` ID 的元素上。在这个事件内部，我们需要：\n\n1. 获取当前玩家的 ID。\n2. 从集合中移除该玩家。\n\n\
    第一步是我们已经使用 session 做过几次的事情。在事件内部编写以下语句：\n\n```javascript\nvar selectedPlayer =\
    \ Session.get('selectedPlayer');\n```\n\n然后，在该行下方，我们使用 `remove()` 函数：\n\n```javascript\n\
    PlayersList.remove(selectedPlayer);\n```\n\n我们还没有讨论过这个函数，但没什么说的。我们将 ID 作为唯一参数传递给函数，如果在集合发现了该\
    \ ID，关联文档将被移除。\n\n该事件的最终代码应该是：\n\n```javascript\n'click #remove': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.remove(selectedPlayer);\n\
    }\n```\n\n在浏览器中，用户现在可以选择一个玩家并点击“移除玩家”按钮来从集合中删除该玩家的文档。\n\n![删除了 Jerry](img/0044.jpeg)\n\
    \n删除了 Jerry。\n\n### 9.5 减少分数\n\n假设用户意外增加了错误玩家的分数。他们该怎么办？在我们目前的应用程序中，除了删除玩家、将玩家重新添加到集合并点击“增加\
    \ 5 分”直到分数达到相应水平外，他们没什么可做的。这不是最优雅的方法。\n\n为了防止人为错误，我们将在“增加 5 分”按钮旁边放置一个“减少 5 分”按钮。这样，用户就可以既增加也可以减少分数。\n\
    \n首先，查看 HTML 文件中的“增加 5 分”按钮：\n\n```html\n<input type=\"button\" id=\"increment\"\
    \ value=\"Give 5 Points\" />\n```\n\n……并在旁边放置一个“减少 5 分”按钮：\n\n```html\n<input\
    \ type=\"button\" id=\"increment\" value=\"Give 5 Points\" />\n<input type=\"\
    button\" id=\"decrement\" value=\"Take 5 Points\" />\n```\n\n注意我将按钮的 ID 从“increment”更改为“decrement”，因为我们需要单独的引用来为此按钮绑定事件。\n\
    \n![添加减少 5 分的按钮。](img/00045.jpeg)\n\n添加“减少 5 分”按钮。\n\n"
- fmt: "\nNext, switch back to the JavaScript file and, inside the events block that’s\
    \ attached to the “leaderboard” template, insert the following code:\n\n```javascript\n\
    'click #decrement': function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n\
    \    PlayersList.update(\n        {_id: selectedPlayer},\n        {$inc: {score:\
    \ -5}}\n    );\n}\n```\n\n(As always, don’t forget the commas to separate the\
    \ events.)\n\nUsually, I don’t like pasting chunks of code in front of you, but\
    \ this code is almost identical to the `click #increment` event that we created\
    \ before.\n\nWe’ve made just two changes:\n\n1. When defining the event, it’s\
    \ now `click #decrement` rather than `click #increment`.\n2. The value in the\
    \ `$inc` operator is now `-5` rather than `5`. This reverses the effect of the\
    \ operator and *decreases* the value of the `score` field by “5”.\n\nOtherwise,\
    \ the code works in the same way:\n\nThe function is triggered when the user clicks\
    \ on the element we’ve specified – in this case, the element with the ID of “decrement”\
    \ – and the ID the selected player is pulled from the “selectedPlayer” session.\
    \ That ID is used inside the `update` function to find the selected player’s document,\
    \ and the `$inc` operator is used to modify the value of the `score` field.\n\n\
    After saving the file, the new “Take 5 Points” button will allow users to decrement\
    \ the scores of whatever player they select.\n\n![Took some points from David.](images/00046.jpeg)\n\
    \nTook some points from David.\n\n## 10 Accounts\n\nIf we deployed our Leaderboard\
    \ application to the web in its current state, there’d be a lot of problems, but\
    \ perhaps the most obvious problem is that it wouldn’t support multiple users.\n\
    \nAt this point, we have a single leaderboard and a single list of players. If\
    \ one user adds players to the list and another user adds players to the list,\
    \ all of these players will be on the same list, which isn’t so useful. It also\
    \ won’t take long for chaos to erupt considering that all of the users can freely\
    \ remove players from the list and modify their scores. Users could never trust\
    \ that they’re in control of the leaderboard.\n\nTo fix this, we’ll create a user\
    \ accounts system, but while that might sound like a long, boring, possibly confusing\
    \ process, it’s nothing of the sort when working with Meteor. Creating a user\
    \ accounts system is actually one of the simplest things we can do.\n\nIn this\
    \ chapter, we’ll make it so:\n\n* Users can register and login to the application.\n\
    * Logged out users won’t be able to see the “Add Player” form.\n* Every user will\
    \ have their own, unique leaderboard.\n\nWe’ll cover a lot of ground and it won’t\
    \ take a lot of code.\n\n### 10.1 Login Providers\n\nIncluded with every installation\
    \ of Meteor is a series of “login provider” packages. These are plugins, created\
    \ by Meteor’s developers, that allow us to easily add the back-end of an account\
    \ system to our application.\n\nThis back-end includes:\n\n* A collection to store\
    \ our user’s data.\n* A number of useful functions we’ll soon cover.\n\nTo add\
    \ one of these packages into our project, enter the following command into the\
    \ command line:\n\n```bash\nmeteor add accounts-password\n```\n\n(If the local\
    \ server is currenty running, you’ll need to open a new command line window or\
    \ tab to enter this command.)\n\n![Adding the `accounts-password` package.](images/00047.jpeg)\n\
    \nAdding the `accounts-password` package.\n\nThis `accounts-password` package\
    \ creates the back-end for an accounts system that, by default, uses an email\
    \ and a password for registration and logging in. There’s an option available\
    \ that allows users to choose a username if they want but I prefer to leave that\
    \ option disabled. Other login provider packages are available which allow users\
    \ to login via services like Twitter and Facebook, and we’ll talk about those\
    \ briefly in a later section.\n\n### 10.2 Meteor.users\n\nAfter adding the `accounts-password`\
    \ package to our project, Meteor creates a collection in our project’s database\
    \ that will store the data of our users. This collection is referenced as `Meteor.users`\
    \ and, although it may look a little different with that dot in the middle of\
    \ the name, it function exactly the same as any other collection in our project.\n\
    \nFor proof of this, enter the following into the JavaScript Console:\n\n```javascript\n\
    Meteor.users\n```\n\nIf everything’s working as expected, the JavaScript Console\
    \ should spit back some data that confirms that, yes, this is a collection no\
    \ different from any collection that we could create ourselves.\n\n![Looking at\
    \ the `Meteor.users` collection.](images/00048.jpeg)\n\nLooking at the `Meteor.users`\
    \ collection.\n\nWith this in mind, we can use familiar functions on this collection,\
    \ like the `fetch` function:\n\n```javascript\nMeteor.users.find().fetch();\n\
    ```\n\nOr the `count` function:\n\n```javascript\nMeteor.users.find().count();\n\
    ```\n\nBut since no one had registered for our application yet, our collection\
    \ is empty, so the first statement returns an empty array and the second statement\
    \ returns `0`. Therefore, let’s allow users to register.\n\n![Counting the users\
    \ in our collection.](images/00049.jpeg)\n\nCounting the users in our collection.\n\
    \n### 10.3 Login Interface\n\nThe `accounts-password` package added the back-end\
    \ for our accounts system but we still need a front-end. We need a form for users\
    \ to register and login, and an interface users can change settings, recover passwords,\
    \ etc.\n\nThis might sound like a lot to add but Meteor includes this in another\
    \ package known as `accounts-ui`. To add this package to our project, enter the\
    \ following command into the command line:\n\n```bash\nmeteor add accounts-ui\n\
    ```\n\nOnce the package is installed, open the HTML file and add the following\
    \ between the `body` tags:\n\n```html\n{{> loginButtons}}\n```\n\nHere, we’re\
    \ including the “loginButtons” template. Switch to the web browser and notice\
    \ that we now have a “Sign In” button and, when clicked, there’ll also be “Create\
    \ Account” link.\n\n![The interface for our accounts system.](images/00050.jpeg)\n\
    \nThe interface for our accounts system.\n\nThis is not just a dummy interface\
    \ though. It connects to the `accounts-password` package we added earlier, meaning\
    \ our accounts system is now fully functional. Users can:\n\n* Register.\n* Login.\n\
    * Logout.\n* Change their settings.\n* Recover a lost password.\n\nTo test this,\
    \ click on the “Create Account” link and register with an email and password.\
    \ You won’t be asked to confirm your email address but this option could be enabled.\n\
    \n![Registering.](images/00051.jpeg)\n\nRegistering.\n\nAfter registering, also\
    \ notice that a document has been added to the `Meteor.users` collection. You\
    \ can see this by entering the following command into the JavaScript Console:\n\
    \n```javascript\nMeteor.users.find().fetch();\n```\n\nOr use the `count` function\
    \ to see that it no longer returns `0`:\n\n```javascript\nMeteor.users.find().count();\n\
    ```\n\nIf you’re the only registered user, this statement should return `1`.\n\
    \n![Counting the users in our collection (again).](images/00052.jpeg)\n\nCounting\
    \ the users in our collection (again).\n\n### 10.4 Check Logged in Status, Part\
    \ 1\n\nIn the JavaScript Console, enter the following statement:\n\n```javascript\n\
    Meteor.user();\n```\n\nThis function, provided to us by the `accounts-password`\
    \ package, allows us to retrieve the MongoDB document of the currently logged\
    \ in user. Therefore, if you’re logged in at the moment, it should return the\
    \ data associated with your specific account. If you’re *not* logged in, this\
    \ function will return `null`.\n\n![The data associated with my account.](images/00053.jpeg)\n\
    \nThe data associated with my account.\n\nThis function is useful for creating\
    \ conditionals that test whether or not the current user is logged, like the following:\n\
    \n```javascript\nif(Meteor.user()){\n    console.log(\"You're logged in!\");\n\
    } else {\n    console.log(\"You're not logged in.\");\n}\n```\n"
