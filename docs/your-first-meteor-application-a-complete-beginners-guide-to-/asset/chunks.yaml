    \ the “leaderboard” template that weren’t part of the player’s list? You’d be\
    \ right to assume that this would cause a problem. Our event would trigger when\
    \ we didn’t want it to trigger.\n\nTo fix this, we can add a `player` class to\
    \ our `li` elements:\n\n```\n<li class=\"player\">{{name}}: {{score}}</li>\n```\n\
    \nThen reference this class when creating the event:\n\n```\n'click li.player':\
    \ function(){\n    console.log(\"You clicked a player's list item\");\n}\n```\n\
    \nHere, we made similar changes to before:\n\n1.  Attached the `player` class\
    \ to the `li` element.\n\n2.  Changed the output of the `console.log` statement.\n\
    \nWe have a lot of flexibility when defining events. As long as we state the event\
    \ type first, we can use any selector as we normally would in a CSS file. To keep\
    \ things simple though, let’s stick with the event that we’ve created.\n\n![Clicking\
    \ an `li.player` element.](images/00026.jpeg)\n\nClicking an `li.player` element.\n\
    \n### 6.3 Event Types"
