    will come in handy, but in either case, I won’t expect readers to be JavaScript
    ninjas or database pros. The plan is to move slow and steady to guarantee consistent
    progress for almost anyone.


    We’re not in a rush.


    ### 1.2 What You’ll Need


    You don’t need much stuff to begin developing Meteor applications. Certain tools
    will make life easier but, for the moment, we’ll keep it simple.


    As of writing these words, Meteor is officially supported on:


    *   Mac: OS X 10.6 and above


    *   Linux: x86 and x86_64 systems


    There is, however, official support coming for Windows in the future and, as I’ll
    cover later, unofficial options are available for Windows so any major (and relatively
    current) operating system will work fine.


    To write code, you’ll need a text editor. You probably have a preference and,
    if that’s the case, stick with it. We won’t be doing any power-user tricks. Personally,
    I use [Sublime Text](http://sublimetext).


    For viewing Meteor applications on your local computer, Google Chrome is the browser
    of choice. It comes with handy development tools we’ll use later on and that you’ll
    be using throughout your life as a Meteor developers.


    Once these basics are in order, you’re good to go.


    ### 1.3 This Book


    Growing up, I read a lot of technical books, and honestly, many of them just weren’t
    that good. Writing at [Meteor Tips](http://meteortips.com) has shown me how difficult
    technical writing can be but it still seems silly that many books make the same,
    frustrating mistakes, like:


    *   Explaining difficult concepts before they need to be explained.


    *   Bloating pages with useless information to make the book longer.


    *   Assuming that a single explanation is enough to explain an idea.


    *   Trying to appeal to everyone – amateurs, pros, and everyone inbetween.


    *   Drowning readers in theory while skimping on the practical stuff.


    As such, I’d like to blatantly state that I’ve been careful to avoid these same
    mistakes that I’ve encountered over the years.


    Have I done a perfect job?


    Probably not, no.


    I am, however, committed to doing the best job possible, so the plan is to never
    be “done” with this book. Instead, I’ll continue to rework the chapters when:


    *   There’s updates to Meteor.


    *   Reader feedback needs addressing.


    *   My teaching philosophy changes.


    But I don’t want to make it seem like you’ll read my words and all of a sudden
    “get” the intricacies of Meteor. It’s a great framework for beginners but it’s
    still programming. You do have to use your brain and certain ideas may not stick
    right away. You can do it, but it will take effort.


    As the teacher, I’m treating your education as my responsibility, but as the student,
    there’s a few strategies that will significantly help your ability to learn and
    retain information:


    1.  **Read through everything once**. Do this without writing any code. Get a
    sense of what you’ll be doing. Maybe write down any points that you struggle to
    grasp.


    2.  **Read through everything again, slowly**. This time, write code, but don’t
    rush to the end. Take your time. It’s not a race. Give your brain time to absorb
    everything.


    3.  **Tweak example code in simple ways**. Use different variable names. Output
    different strings in the JavaScript Console. Make the code “yours” to make sure
    that you’re properly engaged (rather than just going through the motions).


    4.  **Commit to a set duration of study every day**. Do this instead of trying
    to reach a new milestone every day. Set a short duration – 20 minutes or so –
    and don’t break the chain.


    5.  **Treat this like a marathon, not a sprint**. You can’t learn Meteor in a
    week. You can learn it though. Just be in this for the long haul. Being in a rush
    will only make it more difficult.


    6.  **When you get stuck, stop**. Take a break. Go for a walk. Maybe shut the
    computer off for the day. Let your mind rest, then return to the problem at a
    later time.


    7.  **Persist**. Don’t give up. Just keep going. Persistence is the greatest equaliser.
    It sounds cheesy but, if you don’t give up, you can’t fail. Sing it to the heavens:
    “I will not quit!”


    Also know that **struggling is learning**. You don’t have to grasp new concepts
    for study sessions to be useful. Every time you sit down to code, you’re moving
    forward, even if you don’t feel like it. In the words of *Adventure Time*, “Suckin’
    at something is the first step to being sorta good at something.”


    ## 2 Getting Started


    Since we’re not in the same room, I can’t be sure of what you do and don’t know
    about building web applications. As such, I’ll make a couple of assumptions:


    *   You have never used the command line.


    *   You have not installed Meteor.


    If these assumptions are wrong, feel free to skip over (or skim) this chapter.
    If these assumptions are not wrong, then you’re lucky that I’m so thoughtful since
    I’m about to explain everything you’ll need to know.


    ### 2.1 Command Line


    Once upon a time, computers didn’t have graphical user interfaces with buttons,
    windows, or menus. Instead, for a user to be able to do anything on a computer,
    they would have to type out commands, tap the “Return” key on their keyboard,
    and in response to those commands, the computer would do something.


    These days, *command line interfaces* are used by:


    1.  People who forgot to update their operating systems.


    2.  Developers.


    Because while graphical interfaces are convenient and simple to use, they’re also
    time-consuming to create and ultimately slower to use. (You might think clicking
    is faster than typing a command but being able to use a computer without lifting
    your fingers from the keyboard is one of those abilities that will make you both
    look and feel superhuman.)


    For these reasons, we don’t use a graphical interface when working with Meteor.
    It’d waste the time of Meteor’s developers to create it and any developer with
    a bit of command line experience prefers that approach anyway.


    All computers should have access to a command line application and they’ll generally
    work in the same way, so don’t worry about whether or not you use Mac or Windows
    or Linux. The precise name of the command line application, however, will vary
    based on the operating system:


    *   On Mac OS X, the command line is the *Terminal* application.


    *   On Windows, the command line is the *Command Prompt* application.


    *   On Linux, the name will depend on the distribution, but if you’re using Linux,
    you probably know what you’re doing anyway.


    Whatever operating system you’re using, find the command line application with
    the search functionality so we can start writing our first commands.


    ![This is Terminal on Mac OS X 10.10](images/00001.jpeg)


    This is Terminal on Mac OS X 10.10


    ### 2.2 Installing Meteor


    At the moment, Meteor is officially supported on:


    *   Mac: OS X 10.6 and above


    *   Linux: x86 and x86_64 systems


    Windows is missing from this list but Windows users can still install Meteor using
    unofficial options available at [win.meteor.com](http://win.meteor.com). The steps
    will be a little different from what I’m about to explain but Meteor will work
    as expected. Official support for Windows is planned for the future but there’s
    no reason to not get started today.


    For the rest of us, the installation process couldn’t be simpler.


    First, copy the following command to your clipboard:


    ```

    curl https://install.meteor.com | /bin/sh

    ```


    You don’t have to understand what this command actually means. Just make sure
    it’s on your clipboard and ready to be pasted.


    Then:


    1.  Open your command line application.


    2.  Paste the command into the command line application.


    3.  Tap the “Return” key.'
