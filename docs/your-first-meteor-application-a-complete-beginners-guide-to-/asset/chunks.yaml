    \ is *not* selected, the “showSelectedPlayer” helper function will return `null`\
    \ and our template won’t try to render the non-existent data.\n\n![Displaying\
    \ the selected player.](images/00037.jpeg)\n\nDisplaying the selected player.\n\
    \n## 9 Forms\n\nIf a user stumbled across our Leaderboard application, there wouldn’t\
    \ be a lot they could do with it. They can increment scores, but only for a list\
    \ of players that we’ve defined, and that’s not particularly useful.\n\nIn the\
    \ coming chapter, then, we’ll make it possible for users to both add and remove\
    \ players from the list. Maybe then it’ll be kind of useful.\n\n### 9.1 Create\
    \ a Form\n\nSwitch to the HTML file and create a new template by placing the following\
    \ code beneath the previous template:\n\n```\n<template name=\"addPlayerForm\"\
    >\n</template>\n```\n\nWe don’t *have* to create a new template but, the bigger\
    \ an application becomes, the easier it is to manage if it’s separated into smaller\
    \ chunks. In this case, I’ve named the template “addPlayerForm”, but you can call\
    \ it whatever you want.\n\nInside this template, create the following form:\n\n\
    ```\n<form>\n    <input type=\"text\" id=\"playerName\">\n    <input type=\"submit\"\
    \ value=\"Add Player\">\n</form>\n```\n\nThere’s nothing special about this form.\
    \ The only thing worth mentioning is that we’ve assigned the “playerName” ID to\
    \ the text field and we’ll reference that ID in a coming step.\n\nTo include this\
    \ form within our interface, we use the Spacebars syntax:\n\n```\n{{> addPlayerForm}}\n\
    ```\n\nI’ve placed this tag just before the closing `body` tag but you could place\
    \ it inside the “leaderboard” template if you wanted to.\n\n![Our beautiful form.](images/00038.jpeg)\n\
    \nOur beautiful form.\n\n### 9.2 The ‘submit’ Event\n\nEarlier, we talked about\
    \ different event types like `click` and `dblclick`. Another useful event type\
    \ is the `submit` event. This type allows us to trigger the execution of code\
    \ when a form is submitted. We’ll use the `submit` event to insert data into the\
    \ “PlayersList” collection when the form is submitted.\n\nTo begin, create a second\
    \ events block inside the JavaScript file:\n\n```\nTemplate.addPlayerForm.events({\n\
    \    // events go here\n});\n```\n\nNote othat we need to create this new events\
    \ block because each block must be associated with a specific template. A new\
    \ template, therefore, means a new events block. We also need to make sure this\
    \ code is still within the `isClient` conditional.\n\nTo create a new event, we\
    \ then use a familiar syntax inside this block:\n\n```\n'submit form': function(){\n\
    \    // code goes here\n}\n```\n\nHere, we’re using the `submit` keyword as the\
    \ event type. This is different from attaching a `click` event to our form’s submit\
    \ button because a form submission can also occur by tapping the Return key on\
    \ a keyboard. Using the `submit` keyword accounts for every possible way a form\
    \ might be submitted.\n\nThe `form` keyword is in reference in reference to the\
    \ `form` element that we created earlier. If we had multiple forms in a single\
    \ template, we could associate an ID with each form and create events with the\
    \ following syntax:\n\n```\n'submit form#idGoesHere': function(){\n    // code\
    \ goes here\n}\n```\n\nBut since we only have the one form in our template, we\
    \ don’t need to be so specific.\n\nTo make sure our event is working, place a\
    \ `console.log` statement inside of it:\n\n```\n'submit form': function(){\n \
    \   console.log(\"Form submitted\");\n}\n```\n\nWith this code in place, clicking\
    \ on the “Add Player” button – or submitting the form with the Return key – will\
    \ make the “Form submitted” message appear in the JavaScript Console.\n\nThere\
    \ is, however, a problem, since submitting the form also makes the page refresh\
    \ instantly. This happens because, usually, forms work like this:\n\n1.  The user\
    \ fills out some form fields.\n\n2.  The user submits the form.\n\n3.  The data\
    \ is sent somewhere.\n\nBut when building a Meteor application, the process is\
    \ a little different:\n\n1.  The user fills out some form fields.\n\n2.  The user\
    \ submits the form.\n\n3.  The data is extracted from the form fields.\n\nSo the\
    \ form isn’t submitted in the traditional sense since the data isn’t being sent\
    \ anywhere. It’s just immediately extracted.\n\nThe problem, then, is that the\
    \ web browser expects the data to be sent somewhere and, when it’s not, it’s not\
    \ smart enough to figure out what’s going on – hence, the page simply refreshes.\n\
    \nTo fix this problem, we need to disable the default behaviour of the form so\
    \ we have complete control over how it works.\n\nFirst, let’s take a look at our\
    \ event:\n\n```\n'submit form': function(){\n    console.log('Form submitted');\n\
    }\n```\n\nThen make this change:\n\n```\n'submit form': function(theEvent){\n\
    \    console.log('Form submitted');\n}\n```\n\nHere, we’ve added the `theEvent`\
    \ keyword as the first argument within our event’s function. The placement of\
    \ this keyword means we can now use it to refer to the event from within the event\
    \ itself.\n\nSound a little weird?"
