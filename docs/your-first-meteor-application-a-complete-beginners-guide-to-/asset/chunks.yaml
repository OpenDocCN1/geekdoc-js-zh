  trans: "\n此标签确实引用了我们的辅助函数，但并不是以我们想要的方式。相反，我们希望在“排行榜”（leaderboard）模板中编写以下内容：\n\n\
    ```\n{{#each player}}\ntest\n{{/each}}\n```\n\n这里正在发生几件事。\n\n首先，通过引用 `player`\
    \ 函数来获取玩家。\n\n其次，我们正在使用 `each` 块循环遍历这些玩家（再次使用了 Spacebars 语法）。\n\n第三，我们为列表中的每个玩家输出“test”一词。\n\
    \n从概念上说，这就像比我们有一个数组：\n\n```\nvar player = ['David', 'Bob', 'Bill', 'Mary', 'Warren',\
    \ 'Tim'];\n```\n\n……这就像比我们正在使用 `forEach` 循环来遍历此数组中的值：\n\n```\nplayer.forEach(function(){\n\
    \    document.write('test');\n});\n```\n\n结果是，“test”一词在界面上出现的次数将等于集合中玩家的数量。如果集合中有六个玩家，“test”一词将出现六次。\n\
    \n在我们创建的这个 `each` 块中，我们还可以获取与正在检索的数据相关的字段。我们正在从 `PlayersList` 集合中检索数据，因此我们可以显示\
    \ `name` 和 `score` 字段的值。\n\n例如，为了让列表显示玩家名称列表，我们可以写：\n\n```\n{{#each player}}\n\
    \    {{name}}\n{{/each}}\n```\n\n（引用字段时，我们用双大括号包围字段名，不再加其他的。）\n\n![玩家名称列表。](img/00023.jpeg)\n\
    \n玩家名称列表。\n\n我们还可以在玩家名字旁边显示他们的分数：\n\n```\n{{#each player}}\n    {{name}} {{score}}\n\
    {{/each}}\n```\n\n虽然我不太关心用户界面是否美观——我一直觉得在技术书中关注设计是浪费时间——但如果界面的结构稍微更好将是有帮助的：\n\n\
    ```html\n<ul\n    {{#each player}}\n        <li>{{name}}: {{score}}</li>\n   \
    \ {{/each}}\n</ul>\n```\n\n玩家的名字现在将出现在列表中，旁边是他们的分数。默认情况下，玩家将根据他们插入集合的日期升序排列（从旧到新）。\n\
    \n![玩家及其分数列表。](img/00024.jpeg)\n\n玩家及其分数列表。\n\n如果你是从任何其他框架或语言来到 Meteor 的，你可能看出我们通过少量的代码获得了大量功能，而且以后只会更好。\n\
    \n## 6 事件\n\n目前，我们有一个玩家列表，但没有办法与该列表进行交互。我们正在从集合中检索数据，但对于用户来说，Web 应用程序是静态的。修复这个问题需要几个步骤，首先，我们将创建选择玩家的效果。具体来说，当用户点击包含玩家名称的\
    \ `li` 元素时，该 `li` 元素的背景颜色将改变。\n\n为了实现这一点，我们将使用 Meteor 的两个组件：\n\n*   Events，用于检测用户点击了某些内容。\n\
    *   Sessions，用于存储他们点击的数据。\n\n在本章中，我们将关注 `events`。\n\n### 6.1 创建事件\n\n通过在 Meteor\
    \ 中创建事件，我们能够在用户点击按钮、提交表单、按下键盘按键或执行我们能够跟踪并响应的许多操作之一时触发代码执行。Meteor 可以检测一系列不同的事件，我们可以在这些事件发生时让某些事情发生。\n\
    \n要查看效果，请在 `isClient` 条件判断内编写以下行：\n\n```\nTemplate.leaderboard.events();\n```\n\
    \n这里正在发生几件事。\n\n首先，`Template` 关键字搜索我们应用程序中可用的模板。（这正是我们在创建辅助函数时所做的。）\n\n其次，`leaderboard`\
    \ 关键字是我们想要与事件关联的模板名称。与辅助函数一样，事件必须附加到模板上。\n\n第三，我们使用 `events` 关键字来指定在接下来的代码块中，我们想要创建一个或多个事件。\n\
    \n在该语句末尾的括号内，我们将以 JSON 格式定义事件，这意味着我们将使用一对双大括号：\n\n```\nTemplate.leaderboard.events({\n\
    \    // 事件写在这里\n});\n```\n\n然后我们将在双大括号之间使用以下语法来创建我们的第一个事件：\n\n```\n'click': function(){\n\
    \    // 代码写在这里\n}\n```\n\n这种语法看起来可能有点奇怪，但我将解释一下正在发生什么。\n\n首先，我们定义了事件 `type`（类型）。那就是引号内的\
    \ `click` 部分。这意味着当用户点击某些内容时，关联函数中的代码将执行。我们没有指定用户必须点击什么，所以当用户点击“leaderboard” 模板范围内的任何内容时，代码都会执行。\n\
    \n其次，我们向此事件附加了一个函数，并在函数内部，我们可以编写任何想要在事件触发（即点击发生）时执行的代码。\n\n### 6.2 事件选择器\n\n通过使用事件选择器，我们可以将事件附加到特定的\
    \ HTML 元素。如果你以前用过 jQuery，这会很熟悉。如果没有，这也不会太复杂。早些，我们在 HTML 中放置了 `li` 标签：\n\n```html\n\
    <li>{{name}}: {{score}}</li>\n```\n\n现在的计划是更改我们的事件，使其在点击这些 `li` 元素时响应，而不是在点击任何地方时响应。做法如下：\n\
    \n```\n'click li': function(){\n    console.log(\"You clicked a list item\");\n\
    }\n```\n\n在这里我们做了两件事：\n\n1. 在 `click` 关键字之后添加了 `li` 部分。\n2. 修改了 `console.log`\
    \ 语句的输出。\n\n正由于这一点，我们的事件只会在点击 `li` 元素时触发——我们事件中的代码也只在该时执行。\n\n但如果“leaderboard”模板中有其他不是玩家列表部分的\
    \ `li` 元素呢？你认为这会导致问题是正确的。我们的事件会在我们不想让它触发时触发。\n\n为了修复这个问题，我们可以为 `li` 元素添加 `player`\
    \ 类：\n\n```html\n<li class=\"player\">{{name}}: {{score}}</li>\n```\n\n然后在创建事件时引用此类：\n\
    \n```\n'click li.player': function(){\n    console.log(\"You clicked a player's\
    \ list item\");\n```\n\n在这里，我们做了与之前类似的更改：\n\n1. 为 `li` 元素附加了 `player` 类。\n2. 修改了\
    \ `console.log` 语句的输出。\n\n定义事件时我们很有活性。只要我们先说明事件类型，就可以像在 CSS 文件中通常那样使用任何选择器。不过，为了保持简单，让我们坚持我们创建的事件吧。\n\
    \n![点击 `li.player` 元素。](img/00026.jpeg)\n\n点击 `li.player` 元素。\n"
- fmt: "\nAs much as possible, I’m trying to avoid taking detours as we talk about\
    \ Meteor. I’d rather get from Point A to Poing B as quickly as possible, then\
    \ help fill in the blanks once you’ve had the chance to make something. But since\
    \ it’s fun to mess around with the different event types in Meteor, I think it’s\
    \ worth taking a slight detour.\n\nWithin Meteor, we have a range of event types\
    \ available to us:\n\n* `click`\n* `dblclick`\n* `focus`\n* `blur`\n* `change`\n\
    * `mouseenter`\n* `mouseleave`\n* `mousedown`\n* `mouseup`\n* `keydown`\n* `keypress`\n\
    * `keyup`\n* `submit`\n\nWe’ve covered `click` and `dblclick` already, and we’ll\
    \ talk about the `submit` event a little later on, but here’s my suggestion:\n\
    \n1. Create another Meteor project.\n2. Play with the other event types.\n\nYou\
    \ may not understand what each event type does by looking at their names but that’s\
    \ where some Googling will come in handy. (Research is a huge part of the software\
    \ development process, so get into the habit of assuming someone has had the same\
    \ questions that you might have.)\n\nFor a taste, here is what you can expect\
    \ from some of the event types:\n\n* The `focus` event fires when an element on\
    \ the page is said to have focus – a user’s cursor is inside an input field, for\
    \ instance.\n* The `blur` event fires when an element on the page loses focus,\
    \ like when a user removes their cursor from an input field.\n* The `mouseenter`\
    \ event fires when the user’s cursor hovers within the bounds of the associated\
    \ element.\n* The `mouseleave` event fires when the user’s cursor stops hovering\
    \ within the bounds of the associated element.\n* The `change` event fires when\
    \ the value of certain elements change, like when a checkbox is either checked\
    \ or unchecked.\n\nAside from being fun, the benefit of experimenting with event\
    \ types is that you’ll intuitively know when to use them in real-world development.\
    \ That said, it’s far from necessary at this point, so feel free to just skip\
    \ ahead.\n\n## 7 Sessions\n\nAt this stage, a function executes whenever the user\
    \ clicks one of the `li` elements in our list. Using this function, we want to\
    \ create the effect of players being selected when we click them. Specifically,\
    \ the `click` event will change the background colour of an `li` element when\
    \ it’s clicked. To achieve this, we’ll need to use `sessions`.\n\nSessions are\
    \ used to store small pieces of data that:\n\n* Isn’t saved to the database.\n\
    * Won’t be remembered on return visits.\n\nThis sort of temporary data might not\
    \ sound immediately useful but it’s handy when creating interface, and as stated\
    \ in Meteor’s own documentation, sessions can be used to “store things like the\
    \ currently selected item in a list.”\n\n### 7.1 Thinking Ahead\n\nAs I mentioned\
    \ in the “Projects” chapter:\n\n> …a common mistake that beginners make is attempting\
    \ to write code before they have a clear idea of what they’re trying to build.\n\
    \nThis doesn’t just apply to projects as a whole though. Even if you have a clear\
    \ idea of the project you’re trying to build, it’s all too easy to rush ahead\
    \ and try to build features before you have any sort of plan.\n\nFor small features,\
    \ this isn’t a big deal since you can still make a decent amount of progress with\
    \ trial and error, but since it’ll take a few steps to create the effect of selecting\
    \ players on our list, it helps to explain what we’re doing rather than just jumping\
    \ into the deep end.\n\nIn a moment we’ll create a session that contains:\n\n\
    * A name (referred to as a `key`).\n* A value.\n\nThe name will be `selectedPlayer`\
    \ and we’ll use this name at a later time to retrieve the value of our session.\
    \ The value of the session will be set to the unique ID of the player that the\
    \ user clicks.\n\nIf you’ve forgotten where “the unique ID of the player” comes\
    \ from, think back to the “Inserting Data” chapter. Each time we used the `insert`\
    \ function in the JavaScript Console, a jumble of numbers and letters appeared.\
    \ This jumble was the unique ID – the primary key, if you recall – of the player\
    \ we’d just created. This is also the ID we wish to store inside a session.\n\n\
    Having access to the unique ID of each player means the following is possible:\n\
    \n1. A user clicks on a player.\n2. The `click` event is triggered.\n3. As a result,\
    \ the `selectedPlayer` session is created. This session stores the unique ID of\
    \ the player that was just clicked.\n4. Using a conditional, the ID stored in\
    \ our session is matched against the IDs of the players in our list.\n5. When\
    \ a match returns `true`, a CSS class is applied to that player’s `li` element.\
    \ This class will alter the background colour of the `li` element.\n\nWhat I’ve\
    \ shared here is more conceptual than I would usually care to share, but ideally,\
    \ you’ll understand what we’re trying to do before we try to do it. If not though,\
    \ then no big deal. You may have to run through the coming chapter a couple of\
    \ times (which I’d always recommend anyways) but there’ll be plenty of practicality\
    \ from here on out, and that’ll help the details sink in.\n\n### 7.2 Create a\
    \ Session\n\nInside our `click li.player` event, delete the `console.log` statement\
    \ and insert the following line:\n\n```\nSession.set('selectedPlayer', 'session\
    \ value test')\n```\n\nThe code for the events block should now resemble:\n\n\
    ```\nTemplate.leaderboard.events({\n    'click li.player': function(){\n     \
    \   Session.set('selectedPlayer', 'session value test');\n    }\n});\n```\n\n\
    To prove that our session is doing something, let’s retrieve the value of the\
    \ session with the following syntax:\n\n```\nSession.get('selectedPlayer')\n```\n\
    \nTo output the value of this session to the JavaScript Console, let’s store it\
    \ inside a variable:\n\n```\nvar selectedPlayer = Session.get('selectedPlayer');\n\
    ```\n\nThen add a `console.log` statement beneath this line:\n\n```\nconsole.log(selectedPlayer);\n\
    ```\n\nThe final code for the events block should resemble:\n\n```\nTemplate.leaderboard.events({\n\
    \    'click li.player': function(){\n        Session.set('selectedPlayer', 'session\
    \ value test');\n        var selectedPlayer = Session.get('selectedPlayer');\n\
    \        console.log(selectedPlayer);\n    }\n});\n```\n\nWith this code in place,\
    \ the “session value test” string will be stored in a session when a user clicks\
    \ on a player’s `li` element, and that same string will then be immediately output\
    \ to the JavaScript Console\n\n![Outputting our session.](images/0027.jpeg)\n\n\
    Outputting our session.\n\nThis isn’t very useful code but it does demonstrate\
    \ how we’re able to store a small piece of data inside a session and then retrieve\
    \ it.\n\n### 7.3 The Player’s ID\n\nTo make our session useful, we need our session\
    \ to store the unique ID of the player that the user clicks. To prepare for this,\
    \ let’s create a `playerId` variable *above* the `Session.set` statement:\n\n\
    ```\nvar playerId = 'session value test';\n```\n\nThen change the `Session.set`\
    \ statement to use this variable as the source of its value, rather than using\
    \ a hard-coded string:\n\n```\nSession.set('selectedPlayer', playerId);\n```\n\
    \nThe code within the event’s function should now resemble:\n\n```\nvar playerId\
    \ = 'session value test';\nSession.set('selectedPlayer', playerId);\nvar selectedPlayer\
    \ = Session.get('selectedPlayer');\nconsole.log(selectedPlayer);\n```\n\nBut how\
    \ do we make it so the value of the `playerId` variable is set the unique ID of\
    \ the player that the user clicks? The code itself is extremely concise but also\
    \ a little weird and abstract:\n\n```\nvar playerId = this._id;\n```\n\n"
