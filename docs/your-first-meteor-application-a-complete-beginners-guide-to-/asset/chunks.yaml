  trans: "\n\n当我第一次遇到 MongoDB 时，我以为如果我想更改一个字段的值，可以写出类似下面的代码：\n\n```\nPlayersList.update(\n\
    \    {_id: selectedPlayer},\n    {score: 5}\n);\n```\n\n在没有查看 MongoDB 文档的情况下，我的理论是：\n\
    \n*   系统将根据传递给 `_id` 字段的 ID 检索文档。\n*   第二组大括号之间指定的任何字段都将被更新。\n\n虽然这个理论几乎正确，但它存在一个巨大的缺陷，即`任何在第二组大括号之间未指定的字段都会被删除`。\n\
    \n因此，上述代码会将 `score` 字段的值改为“5”，但也会删除该文档中的 `name` 字段。该文档将保留相同的主键——即相同的唯一 ID——但如果你不小心，`update`\
    \ 函数很容易删除你不想让它删除的字段。这是因为在当前的形式下，`update` 函数：\n\n1.  删除文档原始版本。\n2.  使用指定的字段重新创建文档。\n\
    \n如果你需要对所发生的情况进行进一步的说明，可以将之前的代码块添加到 `click #increment` 事件中，如下所示：\n\n```\n'click\
    \ #increment': function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n\
    \    PlayersList.update(\n        {_id: selectedPlayer},\n        {score: 5}\n\
    \    );\n}\n```\n\n然后你自己测试一下。在列表中选择一个玩家，点击“Give 5 Points”按钮，你会发现你选择的玩家姓名消失了。然后使用\
    \ JavaScript 控制台中的 `find` 函数查看该玩家文档的结构发生了变化：\n\n```\nPlayersList.find().fetch();\n\
    ```\n\n被删除的不仅仅是 `name` 字段的值，而是整个 `name` 字段都从该文档中被删除了。\n\n为了让 `update` 函数按照我最初预期的方式运行——即更新\
    \ `score` 字段的值而不触及文档的其他部分——我们必须编写以下代码：\n\n```\nPlayersList.update(\n    {_id:\
    \ selectedPlayer},\n    {$set: {score: 5}}\n);\n```\n\n在这里，我们使用了 `$set` 操作符。这允许我们更改特定字段的值，而不影响文档的其他部分。不过这里有几个额外的大括号，让我们来拆解一下。\n\
    \n首先，我们有 `score` 字段以及我们想要为该字段设置的值：\n\n```\nscore: 5\n```\n\n其次，将其封装在大括号中：\n\n\
    ```\n{score: 5}\n```\n（这就是我们之前拥有的全部。）\n\n第三，我们将 `$set` 操作符放在大括号前面：\n\n```\n$set:\
    \ {score: 5}\n```\n\nMongoDB 拥有一系列这类特殊的操作符，它们的名称前面都有 `$` 符号，我们很快会讨论另一种。\n\n第四，我们将这行代码封装在另一对大括号中：\n\
    \n```\n{$set: {score: 5}}\n```\n\n写好这些代码后，事件应该像这样：\n\n```\n'click #increment':\
    \ function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$set: {score: 5}}\n    );\n}\n```\n\n\
    现在你将能够从列表中选择一个玩家，点击“Give 5 Points”按钮，所选玩家的得分将变为“5”，而不会删除 `name` 字段的值或以其他方式影响文档。\n\
    \n![将 `score` 字段设置为值为 \"5\"。](img/00032.jpeg)\n将 `score` 字段设置为值为“5”。\n\n尽管如此，`$set`\
    \ 操作符只是*设置*了 `score` 字段的值为 5”。我们可以点击“Give 5 Points”按钮一千次，但在当前的形式下，玩家的得分在第一次点击时就会变为“5”，然后一直保持在那个静态值上。不过，我们走这段小路是因为以下几个原因：\n\
    \n*   你很快就会遇到 `$set` 操作符，所以尽早知道它比以后知道要好。\n*   我们有一个相似的操作符可以用来增加数字。\n\n那个相似的操作符是\
    \ `$inc` 操作符，它的格式相同：\n\n```\n{$inc: {score: 5}}\n```\n\n然而，这个操作符将：\n\n1.  找到 `score`\
    \ 字段的当前值。\n2.  在当前值加上指定的数字。\n3.  将新值保存到文档中。\n\n最后，事件的代码应该像这样：\n\n```\n'click #increment':\
    \ function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$inc: {score: 5}}\n    );\n}\n```\n\n\
    为了看到这个新功能：\n\n1.  切换回 Google Chrome。\n2.  在列表中选择一个玩家。\n3.  点击“Give 5 Points”按钮。\n\
    \n所选玩家的得分将在实时功能中递增，当表单提交时列表会自动更新。\n\n![将 `score` 字段设置为值为 \"5\"。](img/00032.jpeg)\n\
    \n### 文档排序\n\n我们的应用程序中一个明显的问题是，列表中的玩家是根据插入数据库的时间排序的。我们希望根据它们的得分进行排序。\n\n为了实现这一点，我们需要向\
    \ `find` 函数传递选项：\n\n```\nPlayersList.find({}, {score: -1})\n```\n\n在这里，`-1`  MongoDB\
    \ 降序排序 `score` 字段。如果 `score` 字段包含文本，它将从 Z 到 A 排序。要对 `score` 字段进行升序排序——从低到高——我们可以此值设置为\
    \ `1`。\n\n但如果两个玩家的得分相同怎么办？目前，我们的代码没有考虑到这一点。但理想情况下，得分相同的玩家将按他们的姓名排序。所以如果 Bob 和\
    \ Bill 的得分相同，Bill 将排在 Bob 之前。\n\n为了实现这一点，我们对 `sort` 操作符进行了如下更改：\n\n```\nPlayersList.find({},\
    \ {score: -1, name: 1})\n```\n\n在这里，我们首先按 `score` 字段降序排序，然后按 `name` 字段升序排序。\n\n\
    最后的 `return` 语句应该像：\n\n```\nreturn PlayersList.find({}, {score: -1, name: 1});\n\
    ```\n\n"
- fmt: "\nWithin the original `Leaderboard` application, there’s a feature that outputs\
    \ the name of the selected player beneath the player’s list. I don’t think this\
    \ feature is particularly useful but:\n\n1. It allows us to cover a few useful\
    \ points.\n2. It’s the final feature of the original `Leaderboard` application,\
    \ so we may as well get it done before continuing with the new stuff.\n\nTo begin,\
    \ create the following helper function inside the JavaScript file:\n\n```\nTemplate.leaderboard.showSelectedPlayer\
    \ = function(){\n    // code goes here\n}\n```\n\nAs always, make sure it sits\
    \ within the `isClient` conditional. The syntax we’re using should also be familiar\
    \ at this point. We’re searching through our templates with the `Template` keyword,\
    \ using the `leaderboard` keyword to specify that this helper function is for\
    \ the “leaderboard” template, and then giving the helper function a name of “showSelectedPlayer”.\n\
    \nWithin this helper, we’ll retrieve the `ID` of the selected player. We’ve done\
    \ this a couple of times and, since the `ID` of the selected player will be in\
    \ the session, there’s nothing new here either:\n\n```\nvar selectedPlayer = Session.get('selectedPlayer');\n\
    ```\n\nNext, we’ll retrieve the selected player’s document from the “PlayersList”\
    \ collection using their `ID`. To do this though, we’ll use the `findOne` function,\
    \ which we haven’t discussed yet:\n\n```\nreturn PlayersList.findOne(selectedPlayer);\n\
    ```\n\nThe benefit of the `findOne` function is that it will only ever retrieve\
    \ a single document from a collection, so if you ever only need to retrieve a\
    \ single document from a collection, this will be the most efficient approach.\n\
    \nAs for how we’re using the `findOne` function, we’re passing through the `ID`\
    \ of the selected player as the only parameter and, as a result, the document\
    \ of that player is returned to us.\n\nThe code for our helper should resemble:\n\
    \n```\nTemplate.leaderboard.showSelectedPlayer = function(){\n    var selectedPlayer\
    \ = Session.get('selectedPlayer');\n    return PlayersList.findOne(selectedPlayer);\n\
    }\n```\n\nWe can now reference this helper in the “leaderboard” template by wrapping\
    \ its name in a pair of double curly braces:\n\n```\n{{showSelectedPlayer}}\n\
    ```\n\nBut as you’ll see, the output’s not quite right, and that’s because the\
    \ `findOne` function is returning the entire document from the collection, but\
    \ we just want to specifically display the `name` field.\n\n![We're retrieving\
    \ the whole document at the moment.](images/00036.jpeg)\n\nWe’re retrieving the\
    \ whole document at the moment.\n\nTo only display the `name` field, we can use\
    \ this dot syntax:\n\n```\n{{showSelectedPlayer.name}}\n```\n\nWe could also retrieve\
    \ the `score` field of the selected player if we wanted:\n\n```\n{{showSelectedPlayer.score}}\n\
    ```\n\nOr even the `_id` field:\n\n```\n{{showSelectedPlayer._id}}\n```\n\nOne\
    \ last detail worth adding is a conditional that will only try to display the\
    \ data of the selected player if a player is actually selected. Spacebars supports\
    \ conditionals, so the following code will do:\n\n```\n{{#if showSelectedPlayer}}\n\
    \    Selected Player: {{showSelectedPlayer.name}}\n{{/if}}\n```\n\nIf a player\
    \ is not selected, the “showSelectedPlayer” helper function will return `null`\
    \ and our template won’t try to render the non-existent data.\n\n![Displaying\
    \ the selected player.](images/00037.jpeg)\n\nDisplaying the selected player.\n\
    \n## 9 Forms\n\nIf a user stumbled across our `Leaderboard` application, there\
    \ wouldn’t be a lot they could do with it. They can increment scores, but only\
    \ for a list of players that we’ve defined, and that’s not particularly useful.\n\
    \nIn the coming chapter, then, we’ll make it possible for users to both add and\
    \ remove players from the list. Maybe then it’ll be kind of useful.\n\n### 9.1\
    \ Create a Form\n\nSwitch to the HTML file and create a new template by placing\
    \ the following code beneath the previous template:\n\n```\n<template name=\"\
    addPlayerForm\">\n</template>\n```\n\nWe don’t have to create a new template but,\
    \ the bigger an application becomes, the easier it is to manage if it’s separated\
    \ into smaller chunks. In this case, I’ve named the template “addPlayerForm”,\
    \ but you can call it whatever you want.\n\nInside this template, create the following\
    \ form:\n\n```\n<form>\n    <input type=\"text\" id=\"playerName\">\n    <input\
    \ type=\"submit\" value=\"Add Player\">\n</form>\n```\n\nThere’s nothing special\
    \ about this form. The only thing worth mentioning is that we’ve assigned the\
    \ “playerName” ID to the text field and we’ll reference that ID in a coming step.\n\
    \nTo include this form within our interface, we use the Spacebars syntax:\n\n\
    ```\n{{> addPlayerForm}}\n```\n\nI’ve placed this tag just before the closing\
    \ `body` tag but you could place it inside the “leaderboard” template if you wanted.\n\
    \n![Our beautiful form.](images/00038.jpeg)\n\nOur beautiful form.\n\n### 9.2\
    \ The ‘submit’ Event\n\nEarlier, we talked about different event types like `click`\
    \ and `dblclick`. Another useful event type is the `submit` event. This type allows\
    \ us to trigger the execution of code when a form is submitted. We’ll use the\
    \ `submit` event to insert data into the “PlayersList” collection when the form\
    \ is submitted.\n\nTo begin, create a new block inside the JavaScript file:\n\n\
    ```\nTemplate.addPlayerForm.events({\n    'submit form': function(){\n       \
    \ // events go here\n    }\n});\n```\n\nNote that we need to make sure this code\
    \ is within the `isClient` conditional. To create a new event, we use the following\
    \ syntax:\n\n```\n'submit form': function(){\n    // code goes here\n}\n```\n\n\
    Here, we’re using the `submit` keyword as the event type. If we had multiple forms\
    \ in a single template, we could associate an ID with each form and create events\
    \ with the following:\n\n```\n'submit form#idGoesHere': function(){\n    // code\
    \ goes here\n}\n```\n\nBut since we only have one form, we don’t need to be so\
    \ specific. To make sure our event is working, place a `console.log` statement\
    \ inside it:\n\n```\n'submit form': function(){\n    console.log(\"Form submitted\"\
    );\n}\n```\n\nWith this code in place, clicking on the “Add Player” button – or\
    \ submitting the form with the Return key – will make the “Form submitted” message\
    \ appear in the Console.\n\nThere is, however, a problem, since submitting the\
    \ form also makes the page refresh. This happens because, usually, forms work\
    \ like this:\n\n1. The user fills out some form fields.\n2. The user submits the\
    \ form.\n3. The data is sent somewhere.\n\nBut when building a Meteor application,\
    \ the process is a little different:\n\n1. The user fills out some form fields.\n\
    2. The user submits the form.\n3. The data is extracted from the form fields.\n\
    \nSo the form isn’t submitted in the traditional sense since the data isn’t being\
    \ sent anywhere. It’s just extracted.\n\nThe problem, then, is that the web browser\
    \ expects the data to be sent somewhere and, when it’s not, it’s not smart enough\
    \ to figure out what’s going on – hence, the page simply refreshes.\n\nTo fix\
    \ this problem, we need to disable the default behaviour of the form so we have\
    \ complete control over how it works.\n\nFirst, let’s look at our event:\n\n```\n\
    'submit form': function(){\n    console.log('Form submitted');\n}\n```\n\nThen\
    \ make this change:\n\n```\n'submit form': function(theEvent){\n    theEvent.preventDefault();\n\
    \    console.log('Form submitted');\n}\n```\n\nHere, we’ve added the `theEvent`\
    \ keyword as the first argument within our event’s function. The placement of\
    \ this keyword means we can now use it to refer to the event from within the event\
    \ itself.\n"
