  trans: "\n首先，我们引用了 `this`，但像往常一样，`this` 的值将取决于上下文。在当前上下文中，`this` 指向用户点击的那个玩家。\n\n\
    其次，`_id` 部分是存储玩家唯一 ID 的字段名称。就像我们创建 `name` 和 `score` 字段一样，MongoDB 会自动创建 `_id` 字段。\n\
    \n（该字段命名为 `_id` 而不是“id”，仅仅是因为 MongoDB 是这样命名该字段的。下划线区分了我们创建的字段和 MongoDB 为我们创建的字段。它背后没有特殊含义。）\n\
    \n通过将 `_id` 字段附加到 `this` 上，我们是在说：“给我用户刚刚点击的那个玩家的唯一 ID。”因此，当用户点击其中一个玩家时，变量 `playerId`将存储该玩家的\
    \ ID。\n\n至于我们的代码，它现在看起来应该是像这样：\n\n```\nTemplate.leaderboard.events({\n    'click\
    \ li.player': function(){\n        var playerId = this._id;\n        Session.set('selectedPlayer',\
    \ playerId);\n        var selectedPlayer = Session.get('selectedPlayer');\n  \
    \      console.log(selectedPlayer);\n    }\n});\n```\n\n值得提到的是，单个会（session）只能包含一条数据。因此，如果用户点击了另一个玩家，该玩家的唯一\
    \ ID 将覆盖之前存储在会中的值。\n\n![通过点击玩家获取玩家的唯一 ID。](img/00028.jpeg)\n\n通过点击玩家获取玩家的唯一 ID。\n\
    \n### 7.4 选中效果 (Selected Effect)\n\n当用户点击玩家之一时——具体来说，点击包含玩家的 `li` 元素之一——我们希望给该\
    \ `li` 元素附加一个 CSS 类。这个类将改变该 `li` 元素的背景颜色。\n\n要创建此功能，首先在 CSS 文件中添加以下类：\n\n```\n\
    .selected{\n    background-color:#ccc;\n}\n```\n\n然后，在 JavaScript 文件中创建一个新的辅助函数（helper\
    \ function）：\n\n```javascript\nTemplate.leaderboard.selectedClass = function(){\n\
    \    // 代码写在这里\n}\n```\n\n我们将此辅助函数附加到了“leaderboard”模板上，并为其分配了名称“selectedClass”。\n\
    \n接下来，为此函数添加一个返回语句（return statement）：\n\n```javascript\nTemplate.leaderboard.selectedClass\
    \ = function(){\n    return 'selected';\n}\n```\n\n然后切换到 HTML 文件并修改此部分：\n\n```html\n\
    <li class=\"player\">{{name}}: {{score}}</li>\n```\n\n……修改为：\n\n```html\n<li class=\"\
    player {{selectedClass}}\">{{name}}: {{score}}</li>\n```\n\n“leaderboard”模板现在应该像这样：\n\
    \n```html\n<template name=\"leaderboard\">\n<ul>\n    {{#each player}}\n     \
    \   <li class=\"player {{selectedClass}}\">{{name}}: {{score}}</li>\n    {{/each}}\n\
    </ul>\n</template>\n```\n\n然而，你可能会很失望地发现 `li` 元素现在有一个丑陋的灰色背景。如果你检查源代码，你会发现这是因为我们将“selected”类附加到了\
    \ `li` 元素上。这并不是我们想要的精确结果，但这是朝着正确方向迈的一步。\n\n![`li` 元素丑陋的背景。](img/00029.jpeg)\n\n\
    `li` 元素丑陋的背景。\n\n下一步是在我们的“selectedClass”辅助函数内部创建一个变量，用于保存“selectedPlayer”会话的值：\n\
    \n```javascript\nvar selectedPlayer = Session.get('selectedPlayer');\n```\n\n\
    然后在这一行之后，编写以下语句：\n\n```javascript\nvar playerId = this._id;\n```\n\n所以，这就是我们在\
    \ `click li.player` 事件中添加的相同语句，而且再次，我们正在使用它来获取玩家的唯一 ID。我们可以访问此 ID，因为 `{{selectedClass}}`\
    \ 标签位于 `each` 块内部。因此，`this` 指向当前在该 `each` 循环中正在迭代的玩家，使我们能够访问玩家的 `_id` 字段。\n\n\
    这允许我们在辅助函数内部编写以下条件判断：\n\n```javascript\nif(selectedPlayer === playerId){\n   \
    \ return 'selected';\n}\n```\n\n在这里，我们正存储在“selectedPlayer”会话中的 ID 与当前在 `each`\
    \ 块中迭代的玩家的唯一 ID 进行比较。如果匹配，则返回“selected”字符串并附加到相应的 `li` 元素上。否则，什么都不会发生。\n\n这就是最终的辅助函数应该的样子：\n\
    \n```javascript\nTemplate.leaderboard.selectedClass = function(){\n    var selectedPlayer\
    \ = Session.get('selectedPlayer');\n    var playerId = this._id;\n    if(selectedPlayer\
    \ === playerId){\n        return 'selected';\n    }\n}\n```\n\n有了这段代码，用户将能够点击任何包含玩家名称的\
    \ `li` 元素，并将该 `li` 元素的背景颜色更改为 CSS 文件中定义的颜色。这实现了用户点击玩家时玩家被选中的效果。\n\n![在这里，我点击了\
    \ Bob。](img/00030.jpeg)\n\n在这里，我点击了 Bob。\n\n## 8 数据库，部分 2\n\n是的，我们再次在讨论数据库。不过你会听到好消息的。在接下来的页面中，我们将：\n\
    \n*   创建一个增加得分的按钮。\n*   根据分数对玩家进行排名。\n*   将结果保存到数据库。\n\n### 8.1 另一个事件 (Another\
    \ Event)\n\n为了创建“5 Points”按钮，请在“leaderboard”模板中放置以下代码：\n\n```html\n<input type=\"\
    button\" id=\"increment\" value=\"5 Points\" />\n```\n\n确保此按钮：\n\n*   位于 `each`\
    \ 块之外。\n*   有一个我们可以引用的 ID。\n\n![我的设计。](img/0031.jpeg)\n\n我的设计。\n\n接下来，我们需要为此按钮附加事件，因此切换回\
    \ JavaScript 文件并查看当前的事件：\n\n```javascript\nTemplate.leaderboard.events({\n   \
    \ 'click li.player': function(){\n        var playerId = this._id;\n        Session.set('selectedPlayer',\
    \ playerId);\n        var selectedPlayer = Session.get('selectedPlayer');\n  \
    \      console.log(selectedPlayer);\n    }\n});\n```\n\n由于我们要创建的事件也将附加到“leaderboard”模板上，我们不需要创建一个新的\
    \ events 块。我们可以通过逗号将两个事件都放在此块中：\n\n```javascript\nTemplate.leaderboard.events({\n\
    \    'click li.player': function(){\n        var playerId = this._id;\n      \
    \  Session.set('selectedPlayer', playerId);\n        var selectedPlayer = Session.get('selectedPlayer');\n\
    \        console.log(selectedPlayer);\n    },\n    'click #increment': function(){\n\
    \        // 代码写在这里\n    }\n});\n```\n\n**不要忘记逗号**。这是你可能犯的最简单错误之一，只会导致不必要的抓狂。\n\
    \n在我们创建的 `click #increment` 事件内部，我们需要访问用户点击的玩家 ID。该 ID 仍然存储在我们的会中，所以让我们创建一个变量并使用\
    \ `Session.get` 在事件内部访问该会话：\n\n```javascript\nvar selectedPlayer = Session.get('selectedPlayer');\n\
    ```\n\n此时，我们的事件应该像这样：\n\n```javascript\n'click #increment': function(){\n    var\
    \ selectedPlayer = Session.get('selectedPlayer');\n}\n```\n\n### 8.2 高级运算符 (Advanced\
    \ Operators)\n\n在 `click #increment` 事件内部，在我们之前的语句之后添加以下行：\n\n```javascript\n\
    PlayersList.update();\n```\n\n这是我们用于更新单个玩家——具体来说是更新集合中的单个玩家文档的函数。不过，它的工作方式并不像你最初预想的那样完全。\n"
- fmt: "\nWhen I first encountered MongoDB, I thought that, if I wanted to change\
    \ the value of a field, then I could write something like the following:\n\n```\n\
    PlayersList.update(\n    {_id: selectedPlayer},\n    {score: 5}\n);\n```\n\nWithout\
    \ checking the MongoDB documentation, my theory was:\n\n* A document would be\
    \ retrieved based on the ID being passed to the `_id` field.\n* Any field specified\
    \ between the second set of curly braces would be updated.\n\nBut while this theory\
    \ was almost correct, there was a big flaw in that `any field not specified between\
    \ the second set of curly braces is deleted`.\n\nAs such, the above code would\
    \ change the value of the `score` field to “5” but it would also delete the `name`\
    \ field from that document. The document will retain the same primary key – the\
    \ same unique ID – but if you’re not careful, the `update` function can easily\
    \ delete a field you don’t want it to delete. This is because, in its current\
    \ form, the `update` function:\n\n1. Deletes the original version of the document.\n\
    2. Recreates the document with the specified fields.\n\nIf you need further clarification\
    \ of what’s happening, add that previous block of code inside the `click #increment`\
    \ event, like so:\n\n```\n'click #increment': function(){\n    var selectedPlayer\
    \ = Session.get('selectedPlayer');\n    PlayersList.update(\n        {_id: selectedPlayer},\n\
    \        {score: 5}\n    );\n}\n```\n\nThen test it for yourself. Select one of\
    \ the players in the list, click on the “Give 5 Points” button, and notice that\
    \ the name of the player you selected disappears. Then use the `find` function\
    \ in the JavaScript Console to see how the structure of that player’s document\
    \ has changed:\n\n```\nPlayersList.find().fetch();\n```\n\nIt’s not just the value\
    \ of the `name` field is being deleted. It’s that the entire `name` field is being\
    \ deleted from that document.\n\nTo get the `update` function working in the way\
    \ that I originally expected it to work – updating the value of the `score` field\
    \ without touching the rest of the document – we have to write the following:\n\
    \n```\nPlayersList.update(\n    {_id: selectedPlayer},\n    {$set: {score: 5}}\n\
    );\n```\n\nHere, we’re using the `$set` operator. This allows us to change the\
    \ value of a specific field without affecting the rest of the document. There’s\
    \ a few extra curly braces though, so let’s break it down.\n\nFirst, we have the\
    \ `score` field an the value we want to set for that field:\n\n```\nscore: 5\n\
    ```\n\nSecond, we wrap this in curly braces:\n\n```\n{score: 5}\n```\n(This is\
    \ all that we had before.)\n\nThird, we place the `$set` operator in front of\
    \ the curly braces:\n\n```\n$set: {score: 5}\n```\n\nMongoDB has a range of these\
    \ special operators that have the `$` symbol in front of their name and we’ll\
    \ talk about another one shortly.\n\nFourth, we wrap this line in another pair\
    \ of curly braces:\n\n```\n{$set: {score: 5}}\n```\n\nWith this code in place,\
    \ the event should resemble:\n\n```\n'click #increment': function(){\n    var\
    \ selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n \
    \       {_id: selectedPlayer},\n        {$set: {score: 5}}\n    );\n}\n```\n\n\
    You will also now be able to select a player from the list, click on the “Give\
    \ 5 Points” button, and the selected player’s score will change to “5” without\
    \ deleting the value of the `name` field or otherwise affecting the document.\n\
    \n![Setting the `score` field to a value of \"5\".](images/00032.jpeg)\nSetting\
    \ the `score` field to a value of “5”.\n\nBut still, the `$set` operator only\
    \ *sets* the value of the `score` field to “5”. We could click the “Give 5 Points”\
    \ button a thousand times but, in its current form, a player’s score would change\
    \ to “5” on the first click and then simply remain at that same, static value.\
    \ We’ve taken this slight detour for a couple of reasons though:\n\n* You’ll come\
    \ across the `$set` operator before too long, so it’s helpful to know about it\
    \ sooner rather than later.\n* There’s a similar operator we can use to increment\
    \ a number.\n\nThat similar operator is the `$inc` operator and it’s format is\
    \ the same:\n\n```\n{$inc: {score: 5}}\n```\n\nThis operator, however, will:\n\
    \n1. Find the current value of the `score` field.\n2. Add the specified number\
    \ on top of the current value.\n3. Save the new value to the document.\n\nIn the\
    \ end, the code for the event should resemble:\n\n```\n'click #increment': function(){\n\
    \    var selectedPlayer = Session.get('selectedPlayer');\n    PlayersList.update(\n\
    \        {_id: selectedPlayer},\n        {$inc: {score: 5}}\n    );\n}\n```\n\n\
    To see this new functionality in action:\n\n1. Switch back to Google Chrome.\n\
    2. Select one of the players in the list.\n3. Click the “Give 5 Points” button.\n\
    \nThe score of the selected player will increment in real time features, the list\
    \ will automatically update when teh form is submitted..\n\n![Setting the `score`\
    \ field to a value of \"5\".](images/00032.jpeg)\n\n### Sorting Documents\n\n\
    One of the most noticeable problems with our application is that the players in\
    \ the list are sorted by the time they were inserted into the database. We want\
    \ to sort them by their score instead.\n\nTo do this, we need to pass options\
    \ to the `find` function:\n\n```\nPlayersList.find({}, {score: -1})\n```\n\nHere,\
    \ the `-1` tells MongoDB to sort the `score` field in descending order. If the\
    \ `score` field contained text, it would sort from Z to A. To sort the `score`\
    \ field in ascending order – from lowest to highest – we could set this value\
    \ to `1`.\n\nBut what happens if two players have the same score? At the moment,\
    \ our code doesn’t account for this. Ideally though, two players with the same\
    \ score will be ranked by their names. So if Bob and Bill have the same score,\
    \ Bill would be ranked above Bob.\n\nTo achieve this, we make the following change\
    \ to the `sort` operator:\n\n```\nPlayersList.find({}, {score: -1, name: 1})\n\
    ```\n\nHere, we’re sorting by the `score` field first in descending order, and\
    \ then by the `name` field second in ascending order.\n\nThe final `return` statement\
    \ should resemble:\n\n```\nreturn PlayersList.find({}, {score: -1, name: 1});\n\
    ```\n\nBecause of Meteor’s real time features, the list will automatically update\
    \ when the form is submitted. features, the player’s ranks will automatically\
    \ update as their scores change.\n\n![Setting the `score` field to a value of\
    \ \"5\".](images/00032.jpeg)\n"
