  trans: "\n接下来，切换回 JavaScript 文件，在附加到“leaderboard”模板的事件块内部，插入以下代码：\n\n```javascript\n\
    'click #decrement': function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n\
    \    PlayersList.update(\n        {_id: selectedPlayer},\n        {$inc: {score:\
    \ -5}}\n    );\n}\n```\n\n（一如既往，不要忘记用逗号来分隔不同的事件。）\n\n通常情况下，我不喜欢向你展示大段的代码，但这段代码与我们之前创建的\
    \ `click #increment` 事件几乎完全相同。\n\n我们只做了两处改动：\n\n1. 在定义事件时，它现在是 `click #decrement`\
    \ 而不是 `click #increment`。\n2. `$inc` 操作符中的值现在是 `-5` 而不是 `5`。这反转了该操作符的作用，并*减少*了\
    \ `score` 字段的值为“5”。\n\n其他情况下，代码的工作方式是相同的：\n\n当用户点击我们指定的元素时——在这种情况下是 ID 为“decrement”的元素——该函数会被触发，并从“selectedPlayer”会话中获取所选玩家的\
    \ ID。该 ID 被用于 `update` 函数内部查找所选玩家的文档，并使用 `$inc` 操作符来修改 `score` 字段的值。\n\n保存文件后，新的“减\
    \ 5 分”按钮将允许用户减少他们选择的任何玩家的得分。\n\n![从 David 那里扣了一些分。](img/00046.jpeg)\n\n从 David\
    \ 那里扣了一些分。\n\n## 10 账户系统\n\n如果我们按照目前的状态将排行榜应用程序部署到网上，将会有很多问题，但可能最明显的问题是它将不支持多个用户。\n\
    \n到目前，我们只有一个排行榜和一个单一玩家列表。如果一个用户向列表中添加玩家，另一个用户也向列表中添加玩家，所有这些玩家将出现在同一个列表中，这并没什么大用。考虑到所有用户都可以自由地从列表中删除玩家并修改他们的分数，很快就会出现混乱。用户永远无法相信自己控制着排行榜。\n\
    \n为了解决这个问题，我们将创建一个用户账户系统，虽然这听起来是一个漫长、无聊且可能令人困惑的过程，但在 Meteor 中操作时并非如此。创建一个用户账户系统实际上是我们能做的最简单的事情之一。\n\
    \n在本章中，我们将实现以下功能：\n\n* 用户可以注册并登录应用程序。\n* 未登录的用户将无法看到“添加玩家”表单。\n* 每个用户都将拥有他们自己的、唯一的排行榜。\n\
    \n我们将涵盖很多内容，但不需要大量的代码。\n\n### 10.1 登录提供者\n\n每个 Meteor 的安装程序中都包含了一系列“登录提供者”（login\
    \ provider）包。这些是由 Meteor 开发者创建的插件，允许我们轻松地为应用程序添加账户系统的后端功能。\n\n该后端包括：\n\n* 一个存储我们用户数据的集合（collection）。\n\
    * 许多很快就会涵盖的实用函数。\n\n要将其中一个包添加到我们的项目中，请在命令行中输入以下命令：\n\n```bash\nmeteor add accounts-password\n\
    ```\n\n（如果本地服务器正在运行，你需要打开一个新的命令行窗口或标签页来输入此命令。）\n\n![添加 `accounts-password` 包。](img/00047.jpeg)\n\
    \n添加 `accounts-password` 包。\n\n这个 `accounts-password` 包为账户系统创建了后端，该系统默认使用电子邮件和密码进行注册和登录。有一个可用选项允许用户在需要时选择用户名，但我更倾向于保持该选项禁用。其他登录提供者包可用，允许用户通过\
    \ Twitter 和 Facebook 等服务登录，我们将在稍后的章节中简要讨论它们。\n\n### 10.2 Meteor.users\n\n在向项目添加\
    \ `accounts-password` 包后，Meteor 会在我们的项目数据库中创建一个集合，用于存储我们用户的数据。该集合被引用为 `Meteor.users`，尽管它由于名称中间有一个点而看起来可能有点不同，但它的功能与项目中的任何其他集合完全一样。\n\
    \n为了证明这一点，请在 JavaScript 控制台中输入以下内容：\n\n```javascript\nMeteor.users\n```\n\n如果一切运行符合预期，JavaScript\
    \ 控制台应该返回一些数据，以证实：是的，这个集合与我们自己创建的任何集合都没有区别。\n\n![查看 `Meteor.users` 集合。](img/00048.jpeg)\n\
    \n查看 `Meteor.users` 集合。\n\n考虑到这一点，我们可以在此集合上使用熟悉的函数，例如 `fetch` 函数：\n\n```javascript\n\
    Meteor.users.find().fetch();\n```\n\n或者使用 `count` 函数：\n\n```javascript\nMeteor.users.find().count();\n\
    ```\n\n但由于还没有人为我们的应用程序注册，我们的集合是空的，因此第一条语句返回空数组，第二个语句返回 `0`。因此，让我们允许用户注册吧。\n\n\
    ![统计我们集合中的用户。](img/00049.jpeg)\n\n统计我们集合中的用户。\n\n### 10.3 登录界面\n\n`accounts-password`\
    \ 包为我们的账户系统添加了后端，但我们仍然需要前端。我们需要一个让用户注册和登录的表单，以及一个用户可以设置、找回密码的界面。\n\n这听起来可能有很多工作要做，但\
    \ Meteor 提供了一个名为 `accounts-ui` 的包。要向项目添加此包，请在命令行输入以下命令：\n\n```bash\nmeteor add\
    \ accounts-ui\n```\n\n包安装后，打开 HTML 文件并在 `body` 标签之间添加以下内容：\n\n```html\n{{> loginButtons}}\n\
    ```\n\n在这里包含了“loginButtons”模板。切换到 浏览器，注意我们现在有一个“登录”按钮，点击后还有“创建账户”链接。\n\n![账户系统的界面。](img/00050.jpeg)\n\
    \n账户系统的界面。\n\n这不仅仅是一个虚拟界面。它连接到我们之前添加的 `accounts-password` 包，这意味着我们的账户系统现在完全可用了。用户可以：\n\
    \n* 注册。\n* 登录。\n* 注销。\n* 修改设置。\n* 回密码。\n\n要测试这一点，点击“创建账户”链接并使用电子邮件和密码注册。系统不会要求你确认电子邮件地址，但该选项可以开启。\n\
    \n![注册。](img/00051.jpeg)\n\n注册。\n\n注册后，注意 `Meteor.users` 集合中添加了一个文档。你可以通过在 JavaScript\
    \ 控制台中输入以下命令看到这一点：\n\n```javascript\nMeteor.users.find().fetch();\n```\n\n或者使用\
    \ `count` 函数查看它不再返回 `0`：\n\n```javascript\nMeteor.users.find().count();\n```\n\
    \n如果你是唯一的注册用户，此语句应该返回 `1`。\n\n![再次统计我们集合中的用户。](img/00052.jpeg)\n\n再次统计我们集合中的用户。\n\
    \n### 10.4 检查登录状态，第一部分\n\n在 JavaScript 控制台中，输入以下语句：\n\n```javascript\nMeteor.user();\n\
    ```\n\n该函数由 `accounts-password` 包提供，允许我们检索当前登录用户的 MongoDB 文档。因此，如果你处于登录状态，它应该返回与你的特定账户相关的数据。如果你*没有*登录，该函数将返回\
    \ `null`。\n\n![与我的账户相关的数据。](img/00053.jpeg)\n\n与我的账户相关的数据。\n\n该函数对于创建测试当前用户是否登录的条件判断，例如：\n\
    \n```javascript\nif(Meteor.user()){\n    console.log(\"你已登录！\");\n} else {\n \
    \   console.log(\"你还没有登录。\");\n}\n```\n"
- fmt: "\nIf the user is logged in, that first condition will return `true`. If the\
    \ user is not logged in, then the `else` condition will trigger.\n\nBut do we\
    \ need to use this `Meteor.user()` function right now?\n\nNo, not right now. It\
    \ won’t play a part in the Leaderboard application. It will, however, play a part\
    \ in many of your Meteor applications in the future, and for that reason, it was\
    \ worth mentioning.\n\n### 10.5 Check Logged in Status, Part 2\n\nWe don’t need\
    \ to check whether or not the user is logged in using our JavaScript file but\
    \ we do need to check whether or not the user is logged in from inside our template.\n\
    \nWhy?\n\nBecause, if we don’t, even logged out users will see the “Add Player”\
    \ form. We could disable the functionality of this form if users are not logged\
    \ in but it’s easier if we make it so the form doesn’t appear in the first place.\n\
    \nTo do this, write the following conditional inside our “addPlayerForm” template:\n\
    \n```\n{{#if currentUser}}\n    <p>You're logged in.</p>\n{{/if}}\n```\n\nHere,\
    \ there’s two things going on.\n\nFirst, we’re using the Spacebars syntax to create\
    \ the `if` statement itself. As was the case with the `each` block, we use the\
    \ `#` symbol before the `if` keyword.\n\nSecond, we’re referring to this `currentUser`\
    \ object, and this is just like referring to the `Meteor.user()` function, only\
    \ that it’s designed for use in our templates. So, if the current user is logged\
    \ in, `currentUser` will return the current user’s details – or `true` if used\
    \ in a conditional – and if the current is not logged in, `currentUser` will return\
    \ `null`.\n\nThe end result is that this “You’re logged in” message will only\
    \ appear when the current user is logged in.\n\n![Checking if the current user\
    \ is logged in.](images/00054.jpeg)\n\nChecking if the current user is logged\
    \ in.\n\nTo use this in our application, wrap the form in the “addPlayerForm”\
    \ template with a `currentUser` conditional, like so:\n\n```\n{{#if currentUser}}\n\
    \    <form>\n        <input type=\"text\" id=\"playerName\" />\n        <input\
    \ type=\"submit\" value=\"Add Player\" />\n    </form>\n{{/if}}\n```\n\nAs a result,\
    \ the form will no longer appear for logged out users.\n\n![Logged out.](images/00055.jpeg)\n\
    \nLogged out.\n\n### 10.6 One Leaderboard Per User\n\nA critical addition to our\
    \ application is for each and every user to have their own, unique leaderboard.\
    \ This requires a couple of steps.\n\nFirst, open the JavaScript file and find\
    \ the `submit form` event that’s attached to the “addPlayerForm” template. This\
    \ is what it looks like:\n\n```\n'submit form': function(event, template) {\n\
    \    event.preventDefault();\n    var playerName = template.find('#playerName').value;\n\
    \    PlayersList.insert({\n        name: playerName,\n        score: 0\n    });\n\
    }\n```\n\nBeneath the statement where we set the `playerName` variable, create\
    \ another variable like the following:\n\n```\nvar currentUserId = Meteor.userId();\n\
    ```\n\nHere, we’re using a function I haven’t mentioned before – `Meteor.userId()`\
    \ – and this function returns the ID of the currently logged in user. (We don’t\
    \ have to store this value in a variable. It’s just my personal preference.)\n\
    \nNext, add a field to the `insert` function within this event and set the value\
    \ of that field to the ID of the currently logged in user:\n\n```\nPlayersList.insert({\n\
    \    name: playerName,\n    score: 0,\n    createdBy: currentUserId\n});\n```\n\
    \n(Don’t forget the comma after the value of the `score` field.)\n\nHere, we’ve\
    \ added this `createdBy` field, and since we’re attaching the logged in user’s\
    \ ID to this field, it means that every player that’s now added to the collection\
    \ will be associated with one of the registered users.\n\nTo see this in action:\n\
    \n1.  Add a player to the collection using the form.\n2.  Use the `find` and `fetch`\
    \ function in the JavaScript Console.\n3.  Click on the downward facing arrow\
    \ for the latest document.\n\nYou should see something like the following:\n\n\
    ![The addition of the `createdBy` field.](images/00056.jpeg)\n\nThe addition of\
    \ the `createdBy` field.\n\nThat’s the first step done.\n\nFor, the second step\
    \ find the “player” helper that’s attached to the “leaderboard” template. It should\
    \ look something like the following:\n\n```\nTemplate.leaderboard.player = function(){\n\
    \    return PlayersList.find({}, {sort: {score: -1, name: 1}});\n}\n```\n\nThen,\
    \ above the `return` statement, create another `currentUserId` variable:\n\n```\n\
    var currentUserId = Meteor.userId();\n```\n\nOnce again, we’re retrieving the\
    \ ID of the currently logged in user.\n\nWe’re now going to change the `return`\
    \ statement so it only retrieves players from the “PlayersList” collection where\
    \ the value of the `createdBy` field is equal to the ID of the currently logged\
    \ in user.\n\nThis is how we do that:\n\n```\nTemplate.leaderboard.player = function(){\n\
    \    var currentUserId = Meteor.userId();\n    return PlayersList.find(\n    \
    \    {createdBy: currentUserId},\n        {sort: {score: -1, name: 1}});\n   \
    \ );\n}\n```\n\nHere, we’ve added this `createdBy` field, and since we’re attaching\
    \ the logged in user’s ID to this field, it means that every player that’s now\
    \ added to the collection will be associated with one of the registered users.\n\
    \n![Meteor is the only player attached to account.](images/00057.jpeg)\n\nMeteor\
    \ is the only player attached to account.\n\n### 10.7 Project Reset\n\nA slight\
    \ issue is that we have players in our collection. To get rid of:\n\n1.  Stop\
    \ the local server. You can do this by switching to the command line and pressing\
    \ `CTRL` + `C`.\n2.  Enter the following command into the command line:\n\n```\n\
    meteor reset\n```\n\nThis command wipes the database, giving us a fresh start\
    \ and making sure none of the players attached to user. You will, however, need\
    \ to register for a second time since you account also be deleted.\n\n![Resetting\
    \ the project.](images/00058.jpeg)\n\nResetting the project.\n\n### 10.8 Other\
    \ Login Providers\n\nEarlier, we talked about the `accounts-password` package.\
    \ This is what provided us with an entire accounts system that allows users to\
    \ register and login with an email and password. This is not the only login provider\
    \ package available.\n\nAs of writing these words, the following packages are\
    \ also available:\n\n*   accounts-facebook\n*   accounts-github\n*   accounts-google\n\
    *   accounts-twitter\n*   accounts-weibo\n\nThese additional packages make it\
    \ possible to easily add functionality like “Login with Twitter” and “Login with\
    \ Facebook” to our applications. It’s not something I’ll detail in this book but\
    \ I’m mentioning it because:\n\n1.  It’s something you can play around with yourself.\n\
    2.  It’s cool.\n\nBecause while there’s a few extra steps involved, these other\
    \ packages work in the same way as the `accounts-password` package. This means\
    \ the user data is still stored in a `Meteor.users` collection and the objects\
    \ we’ve referenced in the past chapters like `Meteor.user()` and `currentUser`\
    \ work without us changing anything.\n\nTo use any of these packages, just add\
    \ them to your project:\n\n```\nmeteor add accounts-twitter\n```\n\nThen add the\
    \ `accounts-ui` package if it’s not already installed:\n\n```\nmeteor add accounts-ui\n\
    ```\n\nAfter including the `{{> loginButtons}}` tag within the HTML file, you’ll\
    \ be shown further instructions for connecting your application with each of these\
    \ third-party services.\n\nIt’s also worth mentioning that you can add multiple\
    \ login provider packages to a single application. This means you can allow users\
    \ to choose how they want to register. To use multiple login provider packages,\
    \ just add them as you normally would with the `meteor` add command.\n"
