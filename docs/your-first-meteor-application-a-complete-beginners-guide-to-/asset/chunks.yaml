    \ statement so it only retrieves players from the “PlayersList” collection where\
    \ the value of the `createdBy` field is equal to the ID of the currently logged\
    \ in user.\n\nThis is how we do that:\n\n```\nTemplate.leaderboard.player = function(){\n\
    \    var currentUserId = Meteor.userId();\n    return PlayersList.find(\n    \
    \    {createdBy: currentUserId},\n        {sort: {score: -1, name: 1}}\n     \
    \   );\n}\n```\n\nHere, we added the `createdBy: currentUserId` part between the\
    \ first set of curly braces. As we covered in an earlier chapter, this allows\
    \ us to retrieve a selection of data rather than all of the data from the collection.\
    \ In this case, we’re only retrieving documents from the “PlayersList” collection\
    \ where the `createdBy` field is equal to the ID of the currently logged in user.\n\
    \nWith these steps complete, users will only see players they create.\n\n![Monica\
    \ is the only player attached to my account.](images/00057.jpeg)\n\nMonica is\
    \ the only player attached to my account.\n\n### 10.7 Project Reset\n\nA slight\
    \ issue is that we have players in our collection who are not attached to a user.\
    \ These are players who were added to the collection before we setup the `createdBy`\
    \ field. To get rid of them:\n\n1.  Stop the local server. You can do this by\
    \ switching to the command line and pressing `CTRL` + `C` on your keyboard.\n\n\
    2.  Enter the following command into the command line:\n\n```\nmeteor reset\n\
    ```\n\nThis command wipes the database clean, giving us a fresh start and making\
    \ sure none of the players are not attached to a user. You will, however, need\
    \ to register for a second time since you account will also be deleted.\n\n![Resetting\
    \ the project.](images/00058.jpeg)\n\nResetting the project.\n\n### 10.8 Other\
    \ Login Providers\n\nEarlier, we talked about the `accounts-password` package.\
    \ This is what provided us with an entire back-end for an accounts system that\
    \ allows users to register and login with an email and password. This is not the\
    \ only login provider package available to us though.\n\nAs of writing these words,\
    \ the following packages are also available:\n\n*   accounts-facebook\n\n*   accounts-github\n\
    \n*   accounts-google\n\n*   accounts-twitter\n\n*   accounts-weibo\n\nThese additional\
    \ packages make it possible to easily add functionality like “Login with Twitter”\
    \ and “Login with Facebook” to our applications. It’s not something I’ll detail\
    \ in this book but I’m mentioning it because:\n\n1.  It’s something you can play\
    \ around with yourself.\n\n2.  It’s cool.\n\nBecause while there’s a few extra\
    \ steps involved, these other packages work in the same way as the `accounts-password`\
    \ package. This means the user data is still stored in a `Meteor.users` collection\
    \ and the objects we’ve referenced in the past few chapters like `Meteor.user()`\
    \ and `currentUser` work without us changing anything.\n\nTo use any of these\
    \ packages, just add them to your project:\n\n```\nmeteor add accounts-twitter\n\
    ```\n\nThen add the `accounts-ui` package if it’s not already installed:\n\n```\n\
    meteor add accounts-ui\n```\n\nAfter including the `{{> loginButtons}}` tag within\
    \ the HTML file, you’ll be shown further instructions for connecting your application\
    \ with each of these third-party services.\n\nIt’s also worth mentioning that\
    \ you can add multiple login provider packages to a single application. This means\
    \ you can allow users to choose how they want to register. To use multiple login\
    \ provider packages, just add them as you normally would with the `meteor` add\
    \ command.\n\n## 11 Publish & Subscribe"
