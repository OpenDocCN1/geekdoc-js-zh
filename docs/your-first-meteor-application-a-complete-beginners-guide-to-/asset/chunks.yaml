    \ list of players. Without the list of players, we can’t build anything else of\
    \ value. This makes the list a good place to begin our development journey – from\
    \ the “middle” of our application and moving outward, toward the finer details.\n\
    \nBut where do we store a player’s data?\n\nThe generic answer is, “In a database.”\n\
    \nThe more precise and useful answer is, “In a *collection*,” and as shown in\
    \ the table before, a collection is equivalent to an SQL table.\n\nIf we were\
    \ to recreate WordPress in Meteor, we’d create a collection for the posts, a collection\
    \ for the users, and a collection for the comments. There would be a collection\
    \ for each type of data. Since we’re a creating this Leaderboard application though,\
    \ we’ll want to create a collection for the players.\n\nTo do this, open the JavaScript\
    \ file and write the following statement at the top (outside of the `isClient`\
    \ and `isServer` conditionals):\n\n```\nnew Meteor.Collection('players');\n```\n\
    \nHere, we’ve created a collection named “players” but you can call it whatever\
    \ you want. Just make sure the name is unique. There is, however, a problem: we\
    \ have no way of referencing this collection and, therefore, no way of manipulating\
    \ it.\n\nTo fix this, we need to associate a variable with our collection:\n\n\
    ```\nPlayersList = new Meteor.Collection('players');\n```\n\nNotice that we didn’t\
    \ use the `var` keyword to define this variable. That’s because we want a global\
    \ variable, since that will allow us to reference the variable throughout all\
    \ of our files rather than just in one of them.\n\nTo confirm that the collection\
    \ exists, switch back to Google Chrome and enter the name of the collection into\
    \ the JavaScript Console:\n\n```\nPlayersList\n```\n\nYou should see the following:\n\
    \n![The \"PlayersList\" collection.](images/00013.jpeg)\n\nThe “PlayersList” collection.\n\
    \nIf an error is returned, it’s probably because you’ve mistyped the name of the\
    \ variable or made a mistake with the syntax in the JavaScript file.\n\nIf an\
    \ error is not returned, we can continue.\n\n### 4.3 Inserting Data\n\nOur collection\
    \ exists but it’s empty. To fix this, we need to insert some data into the collection\
    \ and, to achieve this, we can insert data:\n\n1.  Through the JavaScript Console.\n\
    \n2.  Through the JavaScript file.\n\n3.  Through a form in the interface.\n\n\
    I’ll explain these approaches during this book but, as you’ll see, manipulating\
    \ the database through the JavaScript Console is the most convenient option.\n\
    \nTo begin, enter the following statement into the JavaScript Console:\n\n```\n\
    PlayersList.insert();\n```\n\nThis is the syntax we use to manipulate our database.\
    \ We start with the variable of our collection. Then we attach a function to it.\
    \ But while this is a valid MongoDB statement, we haven’t passed any data through\
    \ the brackets so the statement doesn’t do anything. The function is executed\
    \ but the collection remains unchanged.\n\nTo actually insert data into the collection,\
    \ we use the following syntax:\n\n```\nPlayersList.insert({\n    name: 'David',\n\
    \    score: 0\n});\n```\n\nHere, we’ve done a few things.\n\nFirst, we’ve added\
    \ a pair of curly braces between the brackets. Within these braces, our data is\
    \ structured in the JSON format. If you’re not familiar with the JSON format,\
    \ you’ll pick it up along the way. (It’s not difficult.)\n\nSecond, we’ve defined\
    \ the name of the *fields* in our collection:\n\n*   name\n\n*   score\n\nYou\
    \ can name these fields whatever you like but, since we’ll be referencing them\
    \ in our code, it’s best to make them simple and direct.\n\nThird, we’re setting\
    \ the values of the fields we’ve created. As shown in this table, we’ve given\
    \ the `name` field a value of “David” and the `score` field a value of “0”:\n\n\
    ![The structure of our collection.](images/00014.jpeg)\n\nThe structure of our\
    \ collection.\n\nFourth, we’ve used a comma to separate the different fields.\
    \ This is something that’s easy to overlook but, without a comma, we’d get an\
    \ error. (If you do come across an error, check the commas!)\n\nUltimately, what\
    \ we’ve done here is create a MongoDB *document* – the equivalent to a *row* in\
    \ SQL terminology – and our plan is to create one document per player in our list.\
    \ If you want six players in the list, you’ll need to create six different documents.\n\
    \nTo achieve this, the same syntax will be the same. You just need to enter each\
    \ statement into the JavaScript Console individually:\n\n```\nPlayersList.insert({\n\
    \    name: 'Bob',\n    score: 0\n});\n```\n\nThe white space is unnecessary though,\
    \ so it’s fine to write:\n\n```\nPlayersList.insert({ name: 'Mary', score: 0 });\n\
    ```\n\nAlso notice that, after each insert, a jumble of numbers and letters appears\
    \ in the JavaScript Console. This jumble is a unique ID that MongoDB associates\
    \ with each document. This ID is the *primary key* and it’ll be important later\
    \ in the tutorial.\n\n![Each document has a primary key.](images/00015.jpeg)\n\
    \nEach document has a primary key.\n\nBefore continuing, insert as many players\
    \ into your collection as you like. The example applications has six players and\
    \ that should be enough.\n\nThe players in my list are:\n\n*   David\n\n*   Bob\n\
    \n*   Mary\n\n*   Bill\n\n*   Warren\n\n*   Tim\n\nThey all have a score of “0”\
    \ but it doesn’t precisely matter if the players start with different scores.\n\
    \n### 4.4 Finding Data\n\nWe have a collection that contains our players and their\
    \ scores but we need a way of pulling that data from the collection whenever want\
    \ it. This can be achieved with the `find` function.\n\nIn the JavaScript Console,\
    \ enter the following:\n\n```\nPlayersList.find();\n```\n\nThis statement will\
    \ return the data from the collection but it won’t be in its most readable form.\
    \ That’s why it’s best to pair it with the `fetch` function:\n\n```\nPlayersList.find().fetch();\n\
    ```\n\nWhen working in the JavaScript Console, the `fetch` function will convert\
    \ the data returned by the `find` function into an array. Simply click on the\
    \ down-facing arrows to see the data contained within each docment.\n\n![Using\
    \ the `fetch` function.](images/00016.jpeg)\n\nUsing the `fetch` function.\n\n\
    To retrieve a precise selection of data from the collection, rather than all of\
    \ the data, we can write something like:\n\n```\nPlayersList.find({ name: 'David'\
    \ }).fetch();\n```\n\nHere, we’re passing a field and a value through the `find`\
    \ function and, as a result, we’re able to just retrieve the documents in the\
    \ collection where the player’s name is equal to “David”. If you don’t have any\
    \ players in your collection with the name of “David”, an empty array will be\
    \ returned.\n\n![Retrieving precise data.](images/00017.jpeg)\n\nRetrieving precise\
    \ data.\n\nWhat’s also useful is the ability to count the number of documents\
    \ in a collection by attaching the `count` function to the `find` function:\n\n\
    ```\nPlayersList.find().count();\n```\n\nIf you have six players (documents) in\
    \ your collection, this pair of chained functions will return `6`.\n\n![Using\
    \ the `count` function.](images/00018.jpeg)\n\nUsing the `count` function."
