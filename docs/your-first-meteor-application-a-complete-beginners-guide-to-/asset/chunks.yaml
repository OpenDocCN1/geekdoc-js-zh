    \ within the trusted environment of the server.\n\n# 13 Structure\n\nConsidering\
    \ how much progress we’ve made with the Leaderboard application, it’s strange\
    \ that we haven’t talked about a seemingly fundamental aspect of building software:\
    \ structure. But while learning about how to best structure your code and project\
    \ files is important, I don’t think it makes a lot of sense to talk about it right\
    \ away. How can you truly understand the structure of an application before you\
    \ know how to build one? (Answer: You can’t.)\n\nI’d rather help you make something\
    \ as quickly (and as messily) as possible, and then talk about how to clean it\
    \ up. That way, everything you read about structure will sink in without much\
    \ resistance.\n\nIn this chapter, then, I’ll share a quick tour of how to structure\
    \ your Meteor application. I’m not going to provide any hard and fast rules though,\
    \ since:\n\n1. **Meteor itself doesn’t have any hard and fast rules**. There are\
    \ some conventions that I’ll explain but nothing strict that you *must* do.\n\
    2. **People are still figuring out the best practices for Meteor**. As such, it’d\
    \ be silly to become too dogmatic when there’s so much more to learn.\n\nYou can\
    \ also expect big changes to this chapter in the future as opinions and conventions\
    \ evolve to structure Meteor applications more effectively.\n\n## 13.1 Your Project,\
    \ Your Choice\n\nMeteor doesn’t enforce a strict file structure. It’s perfectly\
    \ fine, for instance, that our project consists of just these three files:\n\n\
    * `leaderboard.html`\n* `leaderboard.js`\n* `leaderboard.css`\n\nWe could write\
