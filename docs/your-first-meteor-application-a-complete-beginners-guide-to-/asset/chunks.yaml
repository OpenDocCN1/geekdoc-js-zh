  trans: "\n\n在原始的 `Leaderboard` 应用中，有一个功能可以在玩家列表下方输出所选玩家的名字。我不认为这个功能特别有用，但是：\n\n\
    1. 它能让我们涵盖几个实实用的知识点。\n2. 它是原始 `Leaderboard` 应用的最后一个功能，所以我们最好在继续开发新功能之前把它完成。\n\n\
    首先，在 JavaScript 文件中创建以下辅助函数：\n\n```\nTemplate.leaderboard.showSelectedPlayer =\
    \ function(){\n    // code goes here\n}\n```\n\n一如既往，请确保它位于 `isClient` 条件判断内。此时此刻，你对我们正在使用的语法应该已经熟悉了。我们正在使用\
    \ `Template` 关键字搜索模板，使用 `leaderboard` 关键字来指定该辅助函数是用于“leaderboard”模板的，然后给该辅助函数命名为“showSelectedPlayer”。\n\
    \n在这个辅助函数内部，我们将获取所选玩家的 `ID`。我们已经做过几次了，由于所选玩家的 `ID` 会存在于 Session 中，这里也没有什么新内容：\n\
    \n```\nvar selectedPlayer = Session.get('selectedPlayer');\n```\n\n接下来，我们将根据 `ID`\
    \ 从“PlayersList”集合中检索所选玩家的文档。但为了实现这一点，我们将使用尚未讨论过的 `findOne` 函数：\n\n```\nreturn\
    \ PlayersList.findOne(selectedPlayer);\n```\n\n`findOne` 函数的优势在于，它永远只会从集合中检索单个文档，因此如果你以后需要从集合中检索单个文档，这将是最高效的方法。\n\
    \n至于我们如何使用 `findOne` 函数，我们将所选玩家的 `ID` 作为唯一参数传递，结果是该玩家的文档被返回给了我们。\n\n我们的辅助函数的代码应该如下：\n\
    \n```\nTemplate.leaderboard.showSelectedPlayer = function(){\n    var selectedPlayer\
    \ = Session.get('selectedPlayer');\n    return PlayersList.findOne(selectedPlayer);\n\
    }\n```\n\n我们现在可以通过将它的名称包裹在双层大括号中，在“leaderboard”模板中引用这个辅助函数：\n\n```\n{{showSelectedPlayer}}\n\
    ```\n\n但正如你所看到的，输出并不完全正确，因为 `findOne` 函数返回了集合中的整个文档，而我们只想特定显示 `name` 字段。\n\n![我们目前正在检索整个文档。](img/00036.jpeg)\n\
    \n我们目前正在检索整个文档。\n\n为了只显示 `name` 字段，我们可以使用这种点语法：\n\n```\n{{showSelectedPlayer.name}}\n\
    ```\n\n如果我们需要，我们也可以检索所选玩家的 `score` 字段：\n\n```\n{{showSelectedPlayer.score}}\n\
    ```\n\n甚至可以是 `_id` 字段：\n\n```\n{{showSelectedPlayer._id}}\n```\n\n最后一个值得添加的细节是一个条件判断，只有在确实选择了玩家时，才会尝试显示所选玩家的数据。Spacebars\
    \ 支持条件判断，所以以下代码可以：\n\n```\n{{#if showSelectedPlayer}}\n    Selected Player: {{showSelectedPlayer.name}}\n\
    {{/if}}\n```\n\n如果没有选择玩家，“showSelectedPlayer” 辅助函数将返回 `null`，我们的模板将不会尝试渲染不存在的数据。\n\
    \n![显示所选玩家。](img/00037.jpeg)\n\n显示所选玩家。\n\n## 9 个表单\n\n如果用户偶然发现了我们的 `Leaderboard`\
    \ 应用，他们能做的做不了什么。他们可以增加分数，但仅针对我们定义的玩家列表，这并不特别有用。\n\n那么，在接下来的章节中，我们将使用户能够从列表中添加和删除玩家。也许那时它就变得有点好用了。\n\
    \n### 9.1 创建一个表单\n\n切换到 HTML 文件，通过在上一个模板下方放置以下代码创建一个新模板：\n\n```\n<template name=\"\
    addPlayerForm\">\n</template>\n```\n\n我们不必非创建一个新模板，但应用程序越大，如果将它拆分成更小的块，就越容易管理。在这种情况下，我将模板命名为“addPlayerForm”，但你可以随心意欲地命名。\n\
    \n在这个模板内部，创建以下表单：\n\n```\n<form>\n    <input type=\"text\" id=\"playerName\">\n\
    \    <input type=\"submit\" value=\"Add Player\">\n</form>\n```\n\n这个表单并没有特别的。唯一值得提到的是，我们为文本字段分配了“playerName”\
    \ ID，我们将在后的步骤中引用该 ID。\n\n为了将此表单包含在我们的界面中，我们使用 Spacebars 语法：\n\n```\n{{> addPlayerForm}}\n\
    ```\n\n我将这个标签放在了 `body` 结束标签之前，但如果你愿意，也可以把它放在“leaderboard”模板内部。\n\n![我们漂亮的表单。](img/00038.jpeg)\n\
    \n我们漂亮的表单。\n\n### 9.2 ‘submit’ 事件\n\n之前，我们讨论了不同的事件类型，如 `click` 和 `dblclick`。另一种实用的事件类型是\
    \ `submit` 事件。这种类型允许我们在提交表单时触发代码的执行。我们将使用 `submit` 事件在提交表单时将数据插入“PlayersList”集合中。\n\
    \n首先，在 JavaScript 文件中创建一个新块：\n\n```\nTemplate.addPlayerForm.events({\n    'submit\
    \ form': function(){\n        // events go here\n    }\n});\n```\n\n注意，我们需要确保这段代码位于\
    \ `isClient` 条件判断内。要创建一个新事件，我们使用以下语法：\n\n```\n'submit form': function(){\n   \
    \ // code goes here\n}\n```\n\n在这里，我们正在使用 `submit` 关键字作为事件类型。如果我们在单个模板中有多个表单，我们可以为每个表单关联一个\
    \ ID，并使用以下方式创建事件：\n\n```\n'submit form#idGoesHere': function(){\n    // code goes\
    \ here\n}\n```\n\n但由于我们只有一个表单，所以我们不需要那么具体。为了确保我们的事件正在工作，在它内部放置一个 `console.log`\
    \ 语句：\n\n```\n'submit form': function(){\n    console.log(\"Form submitted\");\n\
    }\n```\n\n放置好代码后，点击“Add Player”按钮——或使用回车键提交表单——就会在控制台中出现“Form submitted”消息。\n\n\
    然而，这里存在一个问题，因为提交表单会导致页面刷新。这种现象发生是因为通常表单是这样工作的：\n\n1. 用户填写某些表单字段。\n2. 用户提交表单。\n\
    3. 数据被送到某处。\n\n但在构建 Meteor 应用时，过程略有不同：\n\n1. 用户填写某些表单字段。\n2. 用户提交表单。\n3. 数据从表单字段中被提取。\n\
    \n所以表单并没有传统意义上的提交，因为数据并没有被发送到任何地方。它只是被提取了。\n\n问题在于，网络浏览器期望数据被发送到某处，而如果没有发送，它并不聪明足以理解发生了什么——因此，页面直接刷新了。\n\
    \n为了解决这个问题，我们需要禁用表单的默认行为，以便我们完全控制它的工作方式。\n\n首先，让我们看看我们的事件：\n\n```\n'submit form':\
    \ function(){\n    console.log('Form submitted');\n}\n```\n\n然后进行此更改：\n\n```\n\
    'submit form': function(theEvent){\n    theEvent.preventDefault();\n    console.log('Form\
    \ submitted');\n}\n```\n\n在这里，我们将 `theEvent` 关键字作为第一个参数添加到我们的事件函数中。关键字的放置意味着我们现在可以在事件内部使用它引用事件本身。\n\
    \n"
- fmt: "\nConsider this code:\n\n```javascript\n'submit form': function(theEvent){\n\
    \    console.log(theEvent.type);\n}\n```\n\nHere, we’re able to reference our\
    \ event from within the event using the `theEvent` keyword, and display the `type`\
    \ parameter of our event in the JavaScript Console. In this instance, the word\
    \ “submit” will appear in the JavaScript Console because the event is of the `submit`\
    \ type. (But the page which still refresh, so the string will only appear briefly.)\n\
    \nWe’ll reference our event for a different purpose though.\n\nChange the `submit\
    \ form` event to the following:\n\n```javascript\n'submit form': function(theEvent){\n\
    \    theEvent.preventDefault();\n    console.log('Form submitted');\n}\n```\n\n\
    Here, we’re referencing the event from within the event itself using the `theEvent`\
    \ keyword, and then using this `preventDefault()` function to prevent our form’s\
    \ default behaviour. As a result, our form won’t have any inherent behaviour and\
    \ we’ll be able to manipulate it from scratch.\n\nAt this stage, the `console.log`\
    \ statement will trigger when the form is submitted and the page won’t refresh.\n\
    \n![Submitting the form, successfully.](images/00039.jpeg)\n\nSubmitting the form,\
    \ successfully.\n\n### 9.3 Grabbing Data\n\nInserting data into the “PlayersList”\
    \ collection. We can add the syntax we’ve used in the JavaScript Console into\
    \ the `submit form` event:\n\n```javascript\nPlayersList.insert({\n    name: 'David',\n\
    \    score: 0\n});\n```\n\nBut this precise statement would insert the hard-coded\
    \ value of “David” for the `name` field, when what we want to happen is for our\
    \ code to:\n\n1. Grab the value from our text field.\n2. Use that value for the\
    \ `name` field.\n\nSetting the score to the hard-coded value of “0” is fine, since\
    \ every player should start from the same footing, the value of the `name` field\
    \ needs to be set dynamically based on the user’s input.\n\nTo do this, let’s\
    \ pass a second argument through our event’s function:\n\n```javascript\n'submit\
    \ form': function(theEvent, theTemplate){\n    theEvent.preventDefault();\n  \
    \  console.log('Form submitted');\n}\n```\n\nHere, we’ve added the `theTemplate`\
    \ keyword to the function and this keyword refers to the template that our event\
    \ is attached to. Our event is attached to the “addPlayerForm” template, so we\
    \ can use the `theTemplate` keyword to:\n\n1. Search through the “addPlayerForm”\
    \ template.\n2. Retrieve the value of the text field with the “playerName” ID.\n\
    3. Create a document that uses this value for the `name` field.\n\nConsider the\
    \ following code:\n\n```javascript\ntheTemplate.find('#playerName');\n```\n\n\
    Here, we’re referencing the “addPlayerForm” by using the `theTemplate` keyword,\
    \ then using a `find()` function to search through this template. The value we’re\
    \ passing through this `find()` function is a CSS selector. Earlier, added the\
    \ “playerName” ID to our form’s text field, so now we can use the `#playerName`\
    \ syntax to reference that ID.\n\nThe statement we’ve written basically says,\
    \ “Search through our event’s template for this particular element…”\n\nFor the\
    \ sake of convenience, add a variable to this statement:\n\n```javascript\nvar\
    \ playerNameVar = theTemplate.find('#playerName');\n```\n\nThen reference this\
    \ variable in a `console.log` statement:\n\n```javascript\nconsole.log(playerNameVar);\n\
    ```\n\nAt this point, the code should resemble:\n\n```javascript\n'submit form':\
    \ function(theEvent, theTemplate){\n    theEvent.preventDefault();\n    var playerNameVar\
    \ = theTemplate.find('#playerName');\n    console.log(playerNameVar);\n}\n```\n\
    \nBut there’s a problem. This `find()` function that we’re using only retrieves\
    \ the HTML element itself – meaning, the text field. We don’t just want the text\
    \ field though. We want the value inside of the text field.\n\n![Retrieving the\
    \ HTML element itself.](images/00040.jpeg)\n\nRetrieving the HTML element itself.\n\
    \nTo access the value inside of the text field, use the `value` property:\n\n\
    ```javascript\nvar playerNameVar = theTemplate.find('#playerName').value;\n```\n\
    \nNow, whatever the user types into the text field will appear in the JavaScript\
    \ Console when the form is submitted.\n\n![Retrieving the value of the HTML element.](images/00041.jpeg)\n\
    \nRetrieving the value of the HTML element.\n\nTo make the form properly functional,\
    \ add the `insert()` function to the bottom of the event, like so:\n\n```javascript\n\
    'submit form': function(theEvent, theTemplate){\n    theEvent.preventDefault();\n\
    \    var playerNameVar = theTemplate.find('#playerName').value;\n    PlayersList.insert({\n\
    \        name: playerNameVar,\n        score:0\n    });\n}\n```\n\nAfter saving\
    \ the file, typing a name into the text field and submitting the form will create\
    \ a document in the “PlayersList” collection that uses the submitted value as\
    \ the value of the `name` field within that document.\n\n![Adding a seventh player\
    \ to the list.](images/00042.jpeg)\n\nAdding a seventh player to the list.\n\n\
    ### 9.4 Removing Players\n\nTo account for the other end of the spectrum – the\
    \ ability to delete players – let’s add a button to the interface that will allow\
    \ a user to remove the selected player from the “PlayersList” collection.\n\n\
    Somewhere in the “leaderboard” template, create a new button:\n\n```html\n<input\
    \ type=\"button\" id=\"remove\" value=\"Remove Player\" />\n```\n\n![The addition\
    \ of a Remove Player button.](images/00043.jpeg)\n\nThe addition of a remove button.\n\
    \nIn the JavaScript file, attach an event to the “leaderboard” template:\n\n```javascript\n\
    'click #remove': function(){\n    // code goes here\n}\n```\n\nThis event responds\
    \ to the `click` type and is attached to the element with the `remove` ID. Inside\
    \ this event, we need to:\n\n1. Retrieve the ID of the currently selected player.\n\
    2. Remove that player from the collection.\n\nThe first step is something we’ve\
    \ done a couple of times using our session. Write the following statement inside\
    \ the event:\n\n```javascript\nvar selectedPlayer = Session.get('selectedPlayer');\n\
    ```\n\nThen, beneath this line, we’ll use the `remove()` function:\n\n```javascript\n\
    PlayersList.remove(selectedPlayer);\n```\n\nWe haven’t talked about this function\
    \ yet but there’s not much to say. We pass an ID through the function as the only\
    \ parameter and, if that ID is found in the collection, the associated document\
    \ will be removed.\n\nThe final code for this event should resemble:\n\n```javascript\n\
    'click #remove': function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n\
    \    PlayersList.remove(selectedPlayer);\n}\n```\n\nIn the web browser, users\
    \ will now be able to select a player and click the “Remove Player” button to\
    \ delete that player’s document from the collection.\n\n![I removed Jerry from\
    \ the list.](images/00044.jpeg)\n\nI removed Jerry from the list.\n\n### 9.5 Decreasing\
    \ Scores\n\nImagine that a user accidentally increments the score of the wrong\
    \ player. What are they to do? With our application in its current form, there’s\
    \ nothing much they can do aside from delete the player, add the player back into\
    \ the collection, and click the “Give 5 Points” until their score reaches the\
    \ appropriate level. But that’s not the most elegant approach.\n\nTo account for\
    \ human error, we’ll place a “Take 5 Points” beside the “Give 5 Points” button.\
    \ That way, users can both increment and decrement scores.\n\nFirst, let’s look\
    \ at the “Give 5 Points” button in the HTML file:\n\n```html\n<input type=\"button\"\
    \ id=\"increment\" value=\"Give 5 Points\" />\n```\n\n…and place a “Take 5 Points”\
    \ button beside it:\n\n```html\n<input type=\"button\" id=\"increment\" value=\"\
    Give 5 Points\" />\n<input type=\"button\" id=\"decrement\" value=\"Take 5 Points\"\
    \ />\n```\n\nNotice that I’ve changed the ID of the button form “increment” to\
    \ “decrement”, since we’ll need a separate reference to attach an event to this\
    \ button.\n\n![The addition of a Take 5 Points button.](images/00045.jpeg)\n\n\
    The addition of a “Take 5 Points” button.\n"
