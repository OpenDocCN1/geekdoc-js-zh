    \ talking about what’s going on behind the scenes, you’ll have have a stronger\
    \ foundation for the rest of the book.\n\n### 4.1 MongoDB vs. SQL\n\nIf you’ve\
    \ ever installed WordPress, used phpMyAdmin, or built a web application in PHP,\
    \ you’ve come into contact with an SQL database.\n\nBy default, every Meteor project\
    \ comes with its own database. There’s no setup or configuration required. It’s\
