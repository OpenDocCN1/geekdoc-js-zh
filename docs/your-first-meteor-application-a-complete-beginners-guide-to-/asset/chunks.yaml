  trans: "\n\n我们的应用程序似乎已经基本完成了——尽管看起来看起来很丑，但现在已经有了相当多的功能——但有一件非常重要的事情我们还没有谈过：*安全性*。\n\
    \n本书不会提供关于安全性的全部知识，但在接下来的几个章节中，你将很好地掌握基础知识。\n\n## 11.1 安全思考\n\n为了进行演示，请在你的应用程序中创建两个账户，并为每个账户向排行榜中添加三个玩家。\n\
    \n例如，这里是我的两个用户以及他们的玩家：\n\n![我的用户和他们的玩家。](img/00059.jpeg)\n\n我的用户和他们的玩家。\n\n接下来，注销任意一个账户，并在\
    \ JavaScript 控制台中输入以下语句：\n\n```\nPlayersList.find().fetch();\n```\n\n这并不是新奇。我们只是在从“PlayersList”集合中检索所有文档，并将结果转换为数组。\n\
    \n![正在检索数据。](img/00060.jpeg)\n\n正在检索数据。\n\n然而，有一个你可能没有考虑到的问题：\n\n**当应用程序部署到网络上时会发生什么？**\n\
    \n如果普通用户通过打开 JavaScript 控制台并输入命令就能获得这种级别的访问权限，会发生什么？也许不是*每个*用户都拥有这种知识，但这仍然是一个巨大的安全风险吗？用户可以自由地浏览“PlayersList”集合中的所有数据，包括：\n\
    \n* 玩家 ID。\n* 玩家名称。\n* 玩家得分。\n* `createdBy` 字段中的用户 ID。\n\n这是世界上最敏感的数据吗？也许不是。但想象一下，如果我们构建了一个用于分享私密信息的应用程序。如果有人可以打开\
    \ JavaScript 控制台并完全自由地浏览所有信息，那将是不可原谅的。\n\n但无论你在构建什么，让用户访问比他们需要的更多的数据都永远不是一个好主意。这既是：\n\
    \n* 一个安全风险。\n* 一个性能隐患。\n\n因为虽然我们将关注更重要的安全性问题，但如果用户没有被授予访问集合中每一条数据的权限，你将极大提高应用程序的性能。\n\
    \n不过你可能会想：**为什么我们的 Meteor 应用程序默认会包含如此巨大的安全风险？** 但答案非常简单：\n\n为了方便。\n\n正因为这个安全风险，我们能够通过\
    \ JavaScript 控制台轻松地浏览数据库中的所有数据。我们多次使用了 `find` 和 `fetch` 函数，这些函数非常有用，因为我们不受限于可以访问的数据的限制。\n\
    \n只是，在我们的应用程序推向世界之前，我们必须精确地定义每个用户可以访问哪些数据。用户应该能够访问他们需要的数据，但仅限于此。\n\n为了实现这一点，我们将讨论*发布（publications）*和*订阅（subscriptions）*。它们对于初学者来说是一些比较抽象的概念，但正因为如此，我们将进展得非常仔细（并保持充分的实用性）。\n\
    \n## 11.2 autopublish\n\n默认情况下，这种安全风险包含在每个 Meteor 项目都包含的包中。这个包被称为 `autopublish`\
    \ 包，它允许通过 JavaScript 控制台访问数据库中的所有数据。如果我们移除这个包，我们的应用程序将变得更安全，但是：\n\n1. “PlayersList”集合中的所有数据将变得不可访问。\n\
    2. 我们必须精确地定义哪些数据是可以访问的。\n\n（你可能在 `Meteor.users` 集合会发生什么，但先放下这个念头。）\n\n要移除 `autopublish`\
    \ 包，请在命令行输入以下命令：\n\n```\nmeteor remove autopublish\n```\n\n如果你已经注销，可能不会立即注意到变化，但如果你在\
    \ JavaScript 控制台中使用 `find` 和 `fetch` 函数，看起来就像我们删除了“PlayersList”集合中的所有数据：\n\n```\n\
    PlayersList.find().fetch();\n```\n\n你也可以登录一个账户并发现排行榜也是空的，这再次让它看起来我们删除了所有数据。\n\n\
    ![移除 `autopublish` 包后。](img/00061.jpeg)\n\n移除 `autopublish` 包后。\n\n但不要担心。我们的数据仍然存在。我们只需要在这些数据提供给客户端（用户的浏览器）之前多此一个步骤，而这个额外的步骤让我们在安全性方面获得了更多的控制。\n\
    \n## 11.3 isServer\n\n到目前为止，我们几乎所有的代码都写在 `isClient` 条件判断中。这是因为我们一直在创建辅助函数和事件，而这两者都不应该发生在用户的浏览器之外。不过，现在是时候使用\
    \ `isServer` 条件判断进入新领域了。\n\n如果 JavaScript 文件中尚未包含 `isServer` 条件判断，请编写以下内容：\n\n\
    ```javascript\nif(Meteor.isServer){\n    // 代码写在这里\n}\n```\n\n此块中的任何代码都只会在服务器上执行，这意味着两点很重要：\n\
    \n1. 我们写在这里的代码不会（直接）影响用户界面。\n2. 我们写在这里的代码将天生受信任的。\n\n第二点是目前的重点，因为即使我们移除了 `autopublish`\
    \ 包，只要我们在服务器上进行检索，就可以获取任何我们想要的内容。例如，在 `isServer` 内部编写以下内容：\n\n```javascript\n\
    console.log(PlayersList.find().fetch());\n```\n\n这并不是世界上最有用的代码，但如果你保存文件并检查命令行（*而不是*\
    \ JavaScript 控制台），你会发现我们的数据被检索了。\n\n![在服务器上检索数据。](img/00062.jpeg)\n\n在服务器上检索数据。\n\
    \n## 11.4 Publications\n\n我们现在想要做的是从我们的“PlayersList”集合内部*发布（publish）*数据。你可以认为这是将我们的数据从服务器传输到太空中。我们基本上是在说：“这些是我们想要让用户获取的数据……”但我们没有指定其他任何内容。\n\
    \n在 `isServer` 条件判断内，编写以下内容：\n\n```javascript\nMeteor.publish('thePlayers');\n\
    ```\n\n在这里，我们正在启动 `publish` 函数并将名称作为第一个参数传递。这个名称仅用作引用。\n\n接下来，通过第二个参数传递一个函数：\n\
    \n```javascript\nMeteor.publish('thePlayers', function(){\n    // 在这里检索数据\n});\n\
    ```\n\n在这个函数内部，我们指定我们想要让用户获取的数据。目前，让我们返回集合中的所有数据：\n\n```javascript\nMeteor.publish('thePlayers',\
    \ function(){\n    return PlayersList.find();\n});\n```\n\n说明一下，此函数会将我们集合中的*所有*数据都提供给用户，这意味着它复制了\
    \ `autopublish` 包的功能。最终，这并不是我们想要的，但目前可以这样用。\n\n## 11.5 Subscriptions\n\n现在，“PlayersList”集合的数据正在从服务器传输到太空中，我们需要一种从客户端内部获取这些数据的方法。这个过程被称为*订阅（subscribe）*。\n\
    \n在 `isClient` 条件判断内，编写以下内容：\n\n```javascript\nMeteor.subscribe('thePlayers');\n\
    ```\n\n在这里，我们正在启动 `subscribe` 函数并将我们在 `publish` 函数中定义的名称作为第一个（也是唯一的）参数传递。\n\n\
    保存文件，切换回浏览器，你会发现 `find` 和 `fetch` 函数再次可以在 JavaScript 控制台中工作了：\n\n```javascript\n\
    PlayersList.find().fetch();\n```\n\n"
- fmt: "\nIf you log back into either of the user accounts, you’ll also see that our\
    \ leaderboards are once again functional. But like I said, we’re sending all of\
    \ the data to the client with our `publish` function, so our application isn’t\
    \ secure yet. It’s simply ready to be secured.\n\n![Duplicating the `autopublish`\
    \ package.](images/00063.jpeg)\n\nDuplicating the `autopublish` package.\n\n##\
    \ 11.6 Precise Publications\n\nInside the `isServer` conditional, this is what\
    \ our `publish` functions looks like:\n\n```\nMeteor.publish('thePlayers', function(){\n\
    \    return PlayersList.find();\n});\n```\n\nBut instead of the `publish` function\
    \ retrieving all of the data from the “PlayersList” function, we want to make\
    \ it so the function only retrieves the data that belongs to the currently logged\
    \ in user.\n\nThis will have two notable effects:\n\n1. Logged in users will only\
    \ have access to their data.\n2. Logged out users won’t have access to any data.\n\
    \nTo make this change, create a `currentUserId` variable above the `return` statement\
    \ within the `publish` function:\n\n```\nvar currentUserId = this.userId;\n```\n\
    \nWithin a `publish` function, we’re unable to use the `Meteor.userId()` function\
    \ that we used earlier. We can, however, refer to `this.userId` within the `publish`\
    \ function and achieve the same result.\n\nOur reference to `this.userId` will:\n\
    \n1. Return the unique ID of the logged in user.\n2. Return `null` if the user\
    \ is not logged in.\n\nThe variable isn’t necessary but it makes the code more\
    \ readable.\n\nNext, change the `return` statement to the following:\n\n```\n\
    return PlayersList.find({ createdBy: currentUserId });\n```\n\nThe final `publish`\
    \ function should resemble:\n\n```\nMeteor.publish('thePlayers', function(){\n\
    \    var currentUserId = this.userId;\n    return PlayersList.find({ createdBy:\
    \ currentUserId });\n});\n```\n\nAfter saving the file, the application will be\
    \ considerably more secure.\n\nFor proof of this, switch to Google Chrome, open\
    \ the JavaScript Console, and enter the following statement:\n\n```\nPlayersList.find().fetch();\n\
    ```\n\nThis statement will return an empty array because none of the data from\
    \ the “PlayersList” collection is being sent to the client. Why? Because the `return`\
    \ statement in our `publish` function only returns data where the value of the\
    \ `createdBy` is equal to the current user’s ID. If the current user is not logged\
    \ in, they have no ID and therefore nothing is returned. This means random visitors\
    \ to the application have no way of navigating through any data within our database.\n\
    \n![The published data.](images/00064.jpeg)\n\nThe published data.\n\nNext, login\
    \ to one of the accounts. You’ll see that the players that “belong” to that user\
    \ appear within the leaderboard. You can even see the data of these players by\
    \ repeating the previous statement within the JavaScript Console:\n\n```\nPlayersList.find().fetch();\n\
    ```\n\nBut the JavaScript Console *only* returns the data that belongs to the\
    \ logged in user. This means:\n\n1. Users can only ever access their own data.\n\
    2. Data is only passed around when it needs to be passed around.\n\nThe next chapter\
    \ will cover another important aspect of security but we’ve made good progress\
    \ here, so pat yourself on the back and maybe take a break before we continue.\
    \ You (and your brain) deserve a little rest.\n\n## 12 Methods\n\nBy default,\
    \ every Meteor project has *two* major security issues:\n\n* The first issue is\
    \ what we covered in the previous chapter – the ability for any user to access\
    \ all of the data in the database.\n* The second issue is that users are still\
    \ able to insert, modify, and remove data from our database with very few restrictions.\n\
    \nThis second issue is what we’ll learn to fix in the coming chapter.\n\n### 12.1\
    \ insecure\n\nIn the JavaScript Console, enter the following command:\n\n```\n\
    PlayersList.insert({name: 'Cheater', score: 1000});\n```\n\nSee the problem?\n\
    \nIf we deployed our application to the web in its current state, anyone could\
    \ open the JavaScript Console and freely insert whatever data they want into the\
    \ “PlayersList” collection. They could also modify and remove data.\n\nAgain,\
    \ this functionality is convenient for developers – we’ve been taking advantange\
    \ of this direct manipulation of our database throughout this book – but it’s\
    \ not something we can leave lingering.\n\nAs was the case with the `autopublish`\
    \ package, this functionality is contained within a package known as the `insecure`\
    \ package.\n\nTo remove the `insecure` package, enter the following command into\
    \ the command line (not the JavaScript Console):\n\n```\nmeteor remove insecure\n\
    ```\n\nAfter removing this package, our accounts system will still work, but the\
    \ rest of our application will be completely broken:\n\n1. We can’t add players\
    \ to any list.\n2. We can’t remove players from any list.\n3. We can’t modify\
    \ player’s scores.\n\nYou’ll continue to see all of the current data from the\
    \ database – that’s still handled by publications and subscriptions – but we’ll\
    \ have no way of changing or manipulating this data. This is, however, a good\
    \ thing.\n\n![Failing to insert data.](images/00065.jpeg)\n\nFailing to insert\
    \ data.\n\nSo far, the `insert`, `update`, and `remove` functions have been running\
    \ on the client. All of them are within the `isClient` conditional. But while\
    \ this is convenient, our database will remain at risk for as long as users are\
    \ able to modify data from the client since we can never reasonably trust a user.\
    \ We have to assume that any code on the client is at risk of unwanted manipulation.\n\
    \nThe alternative approach – and what removing the `insecure` package forces upon\
    \ us – is to move all of the `insert`, `update`, and `remove` functions to the\
    \ server. This is because any code on the server is inherently trusted. *We* run\
    \ the server, after all. We’re in control. This makes it a safer place for our\
    \ code to run because users don’t have direct access to it.\n\nIn the coming pages,\
    \ then, our aim is to move any database manipulations from the `isClient` conditional\
    \ to the `isServer` conditional.\n\nThis will require us to create our first *methods*.\n\
    \n### 12.2 Create a Method\n\nIn the JavaScript file, write the following inside\
    \ the `isServer` conditional:\n\n```\nMeteor.methods({\n    // methods go here\n\
    });\n```\n\nWithin this block, we can define code that we want to run on the server\
    \ but that can be triggered from the client.\n\nTo demonstrate how this works,\
    \ let’s make it so submitting the “Add Player” form will trigger a `console.log`\
    \ on the server.\n\nFirst, choose a name for our method:\n\n```\nMeteor.methods({\n\
    \    'executeLogStatement'\n});\n```\n\nYou can name methods whatever you like\
    \ but I usually prefer using longer names since being descriptive will help make\
    \ the code more readable.\n\nNext, we associate a function with this name:\n\n\
    ```\nMeteor.methods({\n    'executeLogStatement': function(){\n        console.log(\"\
    You submitted the form\");\n    }\n});\n```\n\n(Notice that this is as similar\
    \ syntax to an `events` block, so we’re not doing anything radical here.)\n\n\
    At this point, we can *call* this method from elsewhere in our code. To trigger\
    \ the method when the “Add Player” form is submitted, place this call within the\
    \ `submit form` event, like so:\n\n```\n'submit form': function(theEvent, theTemplate){\n\
    \    theEvent.preventDefault();\n    var playerNameVar = theTemplate.find('#playerName').value;\n\
    \    PlayersList.insert({\n        name: playerNameVar,\n        score:0\n   \
    \ });\n    Meteor.call('executeLogStatement');\n}\n```\n\nSo this is the only\
    \ code we added:\n\n```\nMeteor.call('executeLogStatement');\n```\n\nWe run this\
    \ `call` function and pass through the name of the method that we defined within\
    \ the `isServer` conditional.\n\nNow, whenever you submit the form, the “You submitted\
    \ the form” string will appear within the command line (*not* the JavaScript Console).\
    \ Hopefully, this shows how we can execute code on the server but trigger it from\
    \ the client.\n"
