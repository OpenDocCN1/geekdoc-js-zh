    \ [13.5 Other Conventions]\n* [14 Deployment]\n* [15 Conclusion]\n\n## 1 Introduction\n\
    \nThere’s a lot to love about the Meteor JavaScript framework:\n\n* You can build\
    \ entire web applications with nothing but JavaScript.\n* Your applications are\
    \ real-time by default, similar to desktop applications.\n* There’s a large and\
    \ helpful community to help you along the way.\n\nMeteor is also relatively easy\
    \ to learn, making it a great for web development beginners who might have never\
    \ built a web application before but still want to make software on the cutting\
    \ edge of what’s possible on the web (and hopefully you fit somewhere on that\
    \ spectrum).\n\nIt’s these reasons that, quite quickly, led me to becoming a Meteor\
    \ fanboy. I’ve drunk the Kool-aid and I am loving the taste. It’s so enjoyable,\
    \ in fact, that:\n\n* I’ve read almost every tutorial and watched every screencast\
    \ out there.\n* I started [a blog about Meteor](http://meteortips.com) to share\
    \ what I’m learning along the way.\n* I started writing this book.\n\nBecause\
    \ while there are some great resources for learning Meteor, and while many of\
    \ these resources are meant for beginners, I still found myself bouncing between\
    \ multiple resources before certain Meteor concepts were able to “stick” in my\
    \ mind. I couldn’t find a single resource that taught everything in the way I\
    \ thought it should be taught. But that got me thinking — why not just write the\
    \ book that I wanted to read?\n\nSo here we are.\n\n*Your First Meteor Application*.\n\
    \nA detailed beginner’s guide for the Meteor JavaScript framework.\n\nLet’s begin.\n\
    \n### 1.1 Prerequisites\n\nIn the coming pages, I’ve made a particular effort\
    \ to write with beginning developers in mind. Specifically, this means:\n\n* You\
    \ won’t need any prior experience with Meteor.\n* You won’t need to have made\
    \ a web application before.\n* You won’t need to consult other sources along the\
    \ way.\n\nYou will, however, need:\n\n* A basic understanding of JavaScript.\n\
    * A basic understanding of databases.\n\nFor JavaScript, this means familiarity\
    \ with variables, loops, conditionals, and functions, and for databases, this\
    \ means familiarity with tables, rows, columns, and primary keys.\n"
