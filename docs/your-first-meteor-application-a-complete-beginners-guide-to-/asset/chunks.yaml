    \n*   methods.js\n\nThen split our helpers, events, and methods across them so\
    \ our code is easier to manage. Once again, the file names are irrelevant, but\
    \ let’s talk about a few of the conventions to keep in mind.\n\n### 13.3 isClient\n\
    \nInside our `leaderboard.js` file, there’s a lot of code within the `isClient`\
    \ conditional, and if we start splitting our code across multiple files, placing\
    \ all of it inside `isClient` conditionals is not the most elegant approach.\n\
    \nTo avoid such a horrible fate, Meteor has provided a simple convention: **any\
    \ code placed within a folder named `client` will only run on the client**.\n\n\
    To illustrate this:\n\n1.  Open the `leaderboard.js` file."
