    \ a hard-coded string:\n\n```\nSession.set('selectedPlayer', playerId);\n```\n\
    \nThe code within the event’s function should now resemble:\n\n```\nvar playerId\
    \ = 'session value test';\nSession.set('selectedPlayer', playerId);\nvar selectedPlayer\
    \ = Session.get('selectedPlayer');\nconsole.log(selectedPlayer);\n```\n\nBut how\
    \ do we make it so the value of the `playerId` variable is set the unique ID of\
    \ the player that the user clicks? The code itself is extremely concise but also\
    \ a little weird and abstract:\n\n```\nvar playerId = this._id;\n```\n\nConfused?\n\
    \nLet’s break it down."
  toc: []
  trans: "\n\n在讨论 Meteor 时，我正尽量避免绕弯路。我更倾向于尽可能快从 A 点到达 B 点，然后等你有机会制作出一些东西后，我再帮助你填补空白。但由于在\
    \ Meteor 中尝试不同的事件类型很有趣，我认为稍微绕一下弯路是值得的。\n\n在 Meteor 内部，我们有一系列可用的事件类型：\n\n* `click`\n\
    * `dblclick`\n* `focus`\n* `blur`\n* `change`\n* `mouseenter`\n* `mouseleave`\n\
    * `mousedown`\n* `mouseup`\n* `keydown`\n* `keypress`\n* `keyup`\n* `submit`\n\
    \n我们已经涵盖了 `click` 和 `dblclick`，稍后我们还会讨论 `submit` 事件，但这里是我的建议：\n\n1. 创建另一个 Meteor\
    \ 项目。\n2. 尝试一下其他的事件类型。\n\n你可能无法通过这些名称理解每个事件类型的作用，但这时 Google 搜索一下就会派上用场。（研究是软件开发过程中的非常重要的一部分，所以请养成这种习惯：假设别人也产生过和你可能相同的问题。）\n\
    \n为了让你体验一下，以下是某些事件类型预期的效果：\n\n* `focus` 事件在页面上的某个元素获得焦点时触发——例如，用户的光标在输入框内时。\n\
    * `blur` 事件在页面上的某个元素失去焦点时触发，例如用户将光标移出输入框时。\n* `mouseenter` 事件在用户的光标悬停在关联元素边界内时触发。\n\
    * `mouseleave` 事件在用户的光标停止悬停在关联元素边界内时触发。\n* `change` 事件在某些元素的值发生变化时触发，例如复选框被勾选或取消勾选时。\n\
    \n除了有趣之外，实验事件类型的好处在于你将直观地知道在实际开发中何时该使用它们。尽管如此，在目前阶段这并非必须，所以你可以直接跳过。\n\n## 第 7\
    \ 节 (7 Sessions)\n\n在此阶段，每当用户点击列表中的一个 `li` 元素时，函数就会执行一次。通过这个函数，我们希望在点击玩家时创建被选的效果。具体来说，`click`\
    \ 事件将在 `li` 元素被点击时改变其背景颜色。为了实现这一点，我们需要使用 `sessions`。\n\n`sessions` 用于存储小段数据，这些数据：\n\
    \n* 不保存到数据库中。\n* 在再次访问时不会被记住。\n\n这种临时数据一听起来可能并不立即有用，但在创建界面时非常方便，正如 Meteor 官方文档所述，`sessions`\
    \ 可用于“存储诸如列表中当前选中项目等内容”。\n\n### 7.1 瞻性思考 (Thinking Ahead)\n\n正如我在“项目”章节中提到的：\n\
    \n> ……初学者会犯的一个常见错误是在还没有清楚自己想要构建什么之前，就尝试编写代码。\n\n不过这不仅适用于整个项目。即使你对想要构建的项目有一个清晰的想法，也很很容易急于前进，在还没有任何计划之前就尝试构建功能。\n\
    \n对于小功能来说，这并不是大问题，因为你仍然可以通过试错取得相当的进展，但由于创建列表选择玩家的效果需要几个步骤，所以解释一下我们在做什么比直接跳入深水区要有帮助。\n\
    \n稍后，我们将创建一个包含以下内容的 `session`：\n\n* 一个名称（称为 `key`）。\n* 一个值。\n\n名称将是 `selectedPlayer`，我们稍后将使用这个名称来获取\
    \ `session` 的值。该 `session` 的值将设置为用户点击的玩家的唯一 ID。\n\n如果你忘记了“玩家的唯一 ID”从哪里来，请回想“插入数据”章节。每次我们在\
    \ JavaScript 控制台中中使用 `insert` 函数时，都会出现一串数字和字母。这串字符就是我们刚刚创建的玩家的唯一 ID——如果你还记得的话，就是主键。这也是我们希望存储在\
    \ `session` 内部的 ID。\n\n能够访问每个玩家的唯一 ID 意味着以下操作可行：\n\n1. 用户点击一个玩家。\n2. 触发 `click`\
    \ 事件。\n3. 结果是创建了 `selectedPlayer` `session`。该 `session` 存储了刚刚点击的玩家的唯一 ID。\n4.\
    \ 使用条件判断，将 `session` 中存储的 ID 与列表中玩家的 ID 进行匹配。\n5. 当匹配返回 `true` 时，为该玩家的 `li` 元素应用一个\
    \ CSS 类。该类将改变 `li` 元素的背景颜色。\n\n我在这里分享的内容比我通常愿意分享的更具概念性，但理想情况下，你会在尝试之前理解我们正试图做什么。如果没有，也没关系。你可能需要运行几遍接下来的章节（尽管我一直建议这样做），但从现在开始会有很多实用的内容，这将有助于细节进入脑海。\n\
    \n### 7.2 创建 Session (Create a Session)\n\n在我们的 `click li.player` 事件内部，删除 `console.log`\
    \ 语句并插入下行：\n\n```\nSession.set('selectedPlayer', 'session value test')\n```\n\n\
    事件块的代码现在应该类似于：\n\n```\nTemplate.leaderboard.events({\n    'click li.player': function(){\n\
    \        Session.set('selectedPlayer', 'session value test');\n    }\n});\n```\n\
    \n为了证明 `session` 正在生效，让我们使用以下语法获取 `session` 的值：\n\n```\nSession.get('selectedPlayer')\n\
    ```\n\n为了将 `session` 的值输出到 JavaScript 控制台，让我们将其存储在变量中：\n\n```\nvar selectedPlayer\
    \ = Session.get('selectedPlayer');\n```\n\n在该行下方添加 `console.log` 语句：\n\n```\n\
    console.log(selectedPlayer);\n```\n\n事件块最终的代码应该是：\n\n```\nTemplate.leaderboard.events({\n\
    \    'click li.player': function(){\n        Session.set('selectedPlayer', 'session\
    \ value test');\n        var selectedPlayer = Session.get('selectedPlayer');\n\
    \        console.log(selectedPlayer);\n    }\n});\n```\n\n有了这些代码，当用户点击玩家的 `li`\
    \ 元素时，“session value test”字符串将存储在 `session` 中，然后该字符串将立即输出到 JavaScript 控制台\n\n\
    ![输出我们的 session。(images/0027.jpeg)\n\n输出我们的 session。\n\n这段代码并不有用，但它演示了我们如何在 `session`\
    \ 中存储一小段数据并获取它。\n\n### 7.3 玩家 ID (The Player’s ID)\n\n为了让我们的 `session` 用，我们需要\
    \ `session` 存储用户点击的玩家的唯一 ID。为了为此做准备，我们在 `Session.set` 语句上方创建一个 `playerId` 变量：\n\
    \n```\nvar playerId = 'session value test';\n```\n\n然后修改 `Session.set` 语句，使用该变量作为值的来源，而不是使用硬编码字符串：\n\
    \n```\nSession.set('selectedPlayer', playerId);\n```\n\n事件函数内部的代码现在应该是：\n\n```\n\
    var playerId = 'session value test';\nSession.set('selectedPlayer', playerId);\n\
    var selectedPlayer = Session.get('selectedPlayer');\nconsole.log(selectedPlayer);\n\
    ```\n\n但我们如何让 `playerId` 变量的值设置为用户点击的玩家的唯一 ID 呢？代码本身极其简洁，但也显得有些奇怪和抽象：\n\n```\n\
    var playerId = this._id;\n```\n"
- fmt: "\nFirst, we refer to `this`, but as always, the value of `this` will depend\
    \ on the context. In this context, `this` refers to the player that the user has\
    \ clicked.\n\nSecond, the `_id` part is the name of the field that stores the\
    \ player’s unique ID. In the same way that we created `name` and `score` field,\
    \ MongoDB creates the `_id` field.\n\n(The field is named `_id` rather than “id”\
    \ simply because that’s how MongoDB names the field. The underscore differentiates\
    \ between fields that we’ve created and fields that MongoDb creates for us. There’s\
    \ no special meaning behind it.)\n\nBy attaching the `_id` field to `this`, we’re\
    \ saying, “Give me the unique ID of the player that the user has just clicked.”\
    \ Therefore, when the user clicks one of the players, the `playerId` variable\
    \ will store the ID of that player.\n\nAs for our code, this is what it should\
    \ now resemble:\n\n```\nTemplate.leaderboard.events({\n    'click li.player':\
    \ function(){\n        var playerId = this._id;\n        Session.set('selectedPlayer',\
    \ playerId);\n        var selectedPlayer = Session.get('selectedPlayer');\n  \
    \      console.log(selectedPlayer);\n    }\n});\n```\n\nIt’s also worth mentioning\
    \ that a single session can only hold a single piece of data. Therefore, if a\
    \ user clicks on another player, the unique ID of that player will overwrite the\
    \ value previously stored in the session.\n\n![Retrieving the player's unique\
    \ IDs by clicking on them.](images/00028.jpeg)\n\nRetrieving the player’s unique\
    \ IDs by clicking on them.\n\n### 7.4 Selected Effect\n\nWhen a user clicks on\
    \ one of the players – specifically, on one of the `li` elements that contains\
    \ a player – we want to attach a CSS class to that `li` element. This class will\
    \ alter the background colour of that `li` element.\n\nTo create this feature,\
    \ start by adding the following class to the CSS file:\n\n```\n.selected{\n  \
    \  background-color:#ccc;\n}\n```\n\nThen create a new helper function in the\
    \ JavaScript file:\n\n```javascript\nTemplate.leaderboard.selectedClass = function(){\n\
    \    // code goes here\n}\n```\n\nWe’ve attached this helper to the “leaderboard”\
    \ template and assigned it a name of “selectedClass”.\n\nNext, add a return statement\
    \ to this function:\n\n```javascript\nTemplate.leaderboard.selectedClass = function(){\n\
    \    return 'selected';\n}\n```\n\nThen switch to the HTML file and change this\
    \ part:\n\n```html\n<li class=\"player\">{{name}}: {{score}}</li>\n```\n\n…to\
    \ this:\n\n```html\n<li class=\"player {{selectedClass}}\">{{name}}: {{score}}</li>\n\
    ```\n\nThe “leaderboard” template should now resemble:\n\n```html\n<template name=\"\
    leaderboard\">\n<ul>\n    {{#each player}}\n        <li class=\"player {{selectedClass}}\"\
    >{{name}}: {{score}}</li>\n    {{/each}}\n</ul>\n</template>\n```\n\nYou might,\
    \ however, be disappointed to discover that the `li` elements now have an ugly\
    \ grey background. If you check the source code, you’ll see that this is because\
    \ we’ve attached the “selected” class to the `li` elements. This is not the exact\
    \ result we want but it’s a step in the right direction.\n\n![An ugly background\
    \ for the `li` elements.](images/00029.jpeg)\n\nAn ugly background for the `li`\
    \ elements.\n\nThe next step is to create a variable inside our “selectedClass”\
    \ helper function that holds the value of the “selectedPlayer” session:\n\n```javascript\n\
    var selectedPlayer = Session.get('selectedPlayer');\n```\n\nThen after this line,\
    \ write the following statement:\n\n```javascript\nvar playerId = this._id;\n\
    ```\n\nSo this is the same statement we added to the `click li.player` event and,\
    \ again, we’re using it to retrieve the unique ID of a player. We can access this\
    \ ID because the `{{selectedClass}}` tag is inside the `each` block. As a result,\
    \ `this` refers to the player that is currently being iterated through within\
    \ that `each` loop, allowing us to access the `_id` field of the players.\n\n\
    This allows us to write the following conditional inside the helper function:\n\
    \n```javascript\nif(selectedPlayer === playerId){\n    return 'selected';\n}\n\
    ```\n\nHere, we’re comparing the ID stored in the “selectedPlayer” session with\
    \ the unique ID of the player that’s currently being iterated through in the `each`\
    \ block. If there’s a match, the “selected” string is returned and attached to\
    \ the appropriate `li` element. Otherwise, nothing happens.\n\nThis is what the\
    \ final helper function should look like:\n\n```javascript\nTemplate.leaderboard.selectedClass\
    \ = function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n   \
    \ var playerId = this._id;\n    if(selectedPlayer === playerId){\n        return\
    \ 'selected';\n    }\n}\n```\n\nWith this code in place, users will be able to\
    \ click on any `li` element that contains a player’s name and have the background\
    \ colour of that `li` element change to the colour defined in our CSS file. This\
    \ creates the effect of a player being selected when a user clicks on them.\n\n\
    ![Here, I've clicked on Bob.](images/00030.jpeg)\n\nHere, I’ve clicked on Bob.\n\
    \n## 8 Databases, Part 2\n\nYes, we’re talking about databases again. You’ll be\
    \ happy to hear though. In the coming pages, we’ll:\n\n*   Create a button that\
    \ increments the score of the selected player.\n*   Rank the players based on\
    \ their score.\n*   Save the result to the database.\n\n### 8.1 Another Event\n\
    \nTo create the “5 Points” button, place the following code in the “leaderboard”\
    \ template:\n\n```html\n<input type=\"button\" id=\"increment\" value=\"5 Points\"\
    \ />\n```\n\nMake sure this button:\n\n*   Is outside of the `each` block.\n*\
    \   Has an ID that we can reference.\n\n![My design skills.](images/00031.jpeg)\n\
    \nMy design skills.\n\nNext, we need to attach an event to this button, so switch\
    \ back to the JavaScript file and take a look at the current events:\n\n```javascript\n\
    Template.leaderboard.events({\n    'click li.player': function(){\n        var\
    \ playerId = this._id;\n        Session.set('selectedPlayer', playerId);\n   \
    \     var selectedPlayer = Session.get('selectedPlayer');\n        console.log(selectedPlayer);\n\
    \    }\n});\n```\n\nBecause the event we want to create will also be attached\
    \ to the “leaderboard” template, we don’t have to create a new events block. We\
    \ can place both events inside this block by separating them with commas:\n\n\
    ```javascript\nTemplate.leaderboard.events({\n    'click li.player': function(){\n\
    \        var playerId = this._id;\n        Session.set('selectedPlayer', playerId);\n\
    \        var selectedPlayer = Session.get('selectedPlayer');\n        console.log(selectedPlayer);\n\
    \    },\n    'click #increment': function(){\n        // code goes here\n    }\n\
    });\n```\n\n**Don’t forget the comma**. It’s one of the simplest mistakes you\
    \ can make and will only result in unnecessary hair-pulling.\n\nWithin the `click\
    \ #increment` event that we’ve created, we’ll need to access the ID of the player\
    \ that the user has clicked. The ID will still be stored in our session so let’s\
    \ create a variable and use `Session.get` to access this session inside our event:\n\
    \n```javascript\nvar selectedPlayer = Session.get('selectedPlayer');\n```\n\n\
    At this point, our event should resemble:\n\n```javascript\n'click #increment':\
    \ function(){\n    var selectedPlayer = Session.get('selectedPlayer');\n}\n```\n\
    \n### 8.2 Advanced Operators\n\nInside the `click #increment` event, add the following\
    \ line beneath our previous statement:\n\n```javascript\nPlayersList.update();\n\
    ```\n\nThis is the function we use to update an individual player – specifically,\
    \ an individual player’s document – within our collection. It doesn’t work exactly\
    \ as you might first expect though.\n"
