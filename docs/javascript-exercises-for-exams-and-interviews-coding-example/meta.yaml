- md: "# JAVASCRIPT EXERCISES FOR EXAMS AND INTERVIEWS\n\n![](img/9e93faabf29d7f96ad3dab9b04710783_0_0.png)\n\
    \nCODING EXAMPLES FOR BEGINNERS\n\nJAKE BOND\n\n# JAVASCRIPT EXERCISES FOR EXAMS\
    \ AND INTERVIEWS\n\n# ## CODING EXAMPLES FOR BEGINNERS\nJAKE BOND\n\n- CAPITALIZE\
    \ THE FIRST LETTER\n- CONVERT NUMBER TO HOURS AND MINUTES\n- COUNT VOWELS IN A\
    \ GIVEN STRING\n- CREATE A NEW STRING\n- CONCATENATE TWO STRINGS\n- JAVASCRIPT:\
    \ FIND THE FIRST NOT REPEATED CHARACTER\n- JAVASCRIPT: FIND THE LONGEST WORD WITHIN\
    \ A STRING\n- JAVASCRIPT: COUNTS THE NUMBER OF VOWELS WITHIN A STRING\n- JAVASCRIPT:\
    \ CHECK A NUMBER IS PRIME OR NOT\n- JAVASCRIPT: GET THE DATA TYPE\n- JAVASCRIPT:\
    \ FIND THE SECOND LOWEST AND SECOND GREATEST\n- ADD TWO DIGITS\n- CHECK WHETHER\
    \ A GIVEN YEAR IS A LEAP\n- CHECK GIVEN POSITIVE NUMBER\n- CHECK A STRING STARTS\
    \ WITH 'JAVA'\n- CHECK TWO GIVEN INTEGER VALUES\n- FIND A VALUE WHICH IS NEAREST\
    \ TO 100\n- CHECK GIVEN POSITIVE NUMBER\n- CHECK A STRING STARTS WITH 'JAVA'\n\
    - CALCULATE MULTIPLICATION AND DIVISION\n- CONVERT TEMPERATURES\n\n# # Capitalize\
    \ The First Letter of Each Word Of A Given String\n\n# ## HTML CODE\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"\
    viewport\" content=\"width=device-width\">\n    <title>JavaScript program to capitalize\
    \ the first letter of each word of a given string.</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# ## JAVASCRIPT CODE\n\n```javascript\nfunction capital_letter(str)\
    \ {\n  str = str.split(\" \");\n  for (var i = 0, x = str.length; i < x; i++)\
    \ {\n    str[i] = str[i][0].toUpperCase() + str[i].substr(1);\n  }\n  return str.join(\"\
    \ \");\n}\n\nconsole.log(capital_letter(\"Write a JavaScript program to capitalize\
    \ the first letter of each word of a given string.\"));\n```\n\n# OUTPUT\n\nOutput:\n\
    Write A JavaScript Program To Capitalize The First Letter Of Each Word Of A Given\
    \ String.\n\n# Hours and minutes\n\n# HTML CODE\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
    width=device-width\">\n  <title>JavaScript program to convert a given number to\
    \ hours and minutes.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT\
    \ CODE\n\n```javascript\nfunction time_convert(num) {\n  var hours = Math.floor(num\
    \ / 60);\n  var minutes = num % 60;\n  return hours + \":\" + minutes;\n}\n\n\
    console.log(time_convert(71));\nconsole.log(time_convert(450));\nconsole.log(time_convert(1441));\n\
    ```\n\n# OUTPUT\n\n1:11\n7:30\n24:1\n\n# Count vowels\n\n# HTML CODE\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"\
    viewport\" content=\"width=device-width\">\n    <title>JavaScript program to count\
    \ the number of vowels in a given string.</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\nfunction vowel_Count(str)\
    \ {\n    return str.replace(/[^aeiou]/gi, \"\").length;\n}\n\nconsole.log(vowel_Count(\"\
    Python\"));\nconsole.log(vowel_Count(\"htmlresource.com\"));\n```\n\n# Output:\n\
    \n1\n5\n\n# Create a new string\n\n# HTML CODE\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width\"\
    >\n    <title>JavaScript program to create a new string without the first and\
    \ last character.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT\
    \ CODE\n\n```javascript\nfunction without_first_last(str) {\n    return str.substring(1,\
    \ str.length - 1);\n}\n\nconsole.log(without_first_last(\"JavaScript\"));\nconsole.log(without_first_last(\"\
    abc\"));\nconsole.log(without_first_last(\"abcde\"));\n```\n\n# Output:\nava\n\
    \n# Concatenate two strings except their first character\n\n# HTML CODE\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n  <title>JavaScript program to concatenate\
    \ two strings except their first character.</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\nfunction concatenate(str1,\
    \ str2) {\n  str1 = str1.substring(1, str1.length);\n  str2 = str2.substring(1,\
    \ str2.length);\n  return str1 + str2;\n}\n\nconsole.log(concatenate(\"ABC\",\
    \ \"DEF\"));\nconsole.log(concatenate(\"HELLO\", \"WORLD\"));\n```\n\n# Output:\n\
    BCDEF\nelloorld\n\n# First not repeated character\n\nSample arguments: 'abac'\n\
    Expected output: 'e'\n\n# HTML CODE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>find the first repeated character.</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\n\
    function findFirstRepeatedChar(str) {\n  var arr1 = str.split(\"\");\n  var result\
    \ = \"\";\n  for (var x = 0; x < arr1.length; x++) {\n    var ctr = 0;\n    for\
    \ (var y = 0; y < arr1.length; y++) {\n      if (arr1[x] === arr1[y]) {\n    \
    \    ctr++;\n      }\n    }\n    if (ctr < 2) {\n      result = arr1[x];\n   \
    \   break;\n    }\n  }\n  return result;\n}\nconsole.log(findFirstRepeatedChar(\"\
    abac\"));\n```\n\n# OUTPUT\ne\n\n# Find the longest word within a string\n\nExample\
    \ string: \"Web Development Tutorial\"\nExpected Output: 'Development'\n\n# HTML\
    \ CODE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    \ />\n  <title>Find the longest word within a string</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\nfunction find_longest_word(str)\
    \ {\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n  var result = array1[0];\n\n\
    \  for (var x = 1; x < array1.length; x++) {\n    if (result.length < array1[x].length)\
    \ {\n      result = array1[x];\n    }\n  }\n  return result;\n}\nconsole.log(find_longest_word(\"\
    Web Development Tutorial\"));\n```\n\n# OUTPUT\nDevelopment\n\n# Counts the number\
    \ of vowels within a string\n\nExample string: 'The quick brown fox'\nExpected\
    \ Output: 5\n\n# HTML CODE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\" />\n  <title>Counts the number of vowels within a string</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\n\
    function vowel_count(str1) {\n  var vowel_list = 'aeiouAEIOU';\n  var vcount =\
    \ 0;\n\n  for (var x = 0; x < str1.length; x++) {\n    if (vowel_list.indexOf(str1[x])\
    \ !== -1) {\n      vcount += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"\
    The quick brown fox\"));\n```\n\n# OUTPUT\n5\n\n# # Check a number is prime\n\n\
    A prime number is a positive integer with only two factors: itself and one\n\n\
    # ## HTML CODE\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
    \ />\n  <title>Check a number is prime or not</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JAVASCRIPT CODE\n\n```javascript\nfunction test_prime(n) {\n\
    \  if (n === 1) {\n    return false;\n  } else if (n === 2) {\n    return true;\n\
    \  } else {\n    for (var x = 2; x < n; x++) {\n      if (n % x === 0) {\n   \
    \     return false;\n      }\n    }\n    return true;\n  }\n}\nconsole.log(test_prime(37));\n\
    ```\n\n# OUTPUT\nTrue\n\n# JavaScript: Get the data type\n\n# HTML CODE\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\" />\n  <title>Detect Data\
    \ Types</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\
    \n```javascript\nfunction detect_data_type(value) {\n  var dtypes = [Function,\
    \ RegExp, Number, String, Boolean, Object], x, len;\n\n  if (typeof value ===\
    \ \"object\" || typeof value === \"function\") {\n    for (x = 0, len = dtypes.length;\
    \ x < len; x++) {\n      if (value instanceof dtypes[x]) {\n        return dtypes[x];\n\
    \      }\n    }\n  }\n  return typeof value;\n}\nconsole.log(detect_data_type(12));\n\
    console.log(detect_data_type(\"w3resource\"));\nconsole.log(detect_data_type(false));\n\
    ```\n\n# OUTPUT\nnumber\nstring\nBoolean\n\n# Find the second lowest and second\
    \ greatest numbers from an array\n\n# HTML CODE\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\" />\n  <title>Find the second lowest and\
    \ second greatest numbers from an array</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n# JAVASCRIPT CODE\n\n```javascript\nfunction Second_Greatest_Lowest(arr_num)\
    \ {\n  arr_num.sort(function(x,y) {\n    return x-y;\n  });\n  var uniqua = [arr_num[0]];\n\
    \  var result = [];\n\n  for (var j=1; j < arr_num.length; j++) {\n    if (arr_num[j-1]\
    \ !== arr_num[j]) {\n      uniqua.push(arr_num[j]);\n    }\n  }\n  result.push(uniqua[1],\
    \ uniqua[uniqua.length-2]);\n  return result.join(',');\n}\n\nconsole.log(Second_Greatest_Lowest([1,2,3,4]));\n\
    ```"
  mdcn: "\n# 考试与面试 JavaScript 练习题\n\n![](img/9e93faabf29d7f96ad3dab9b04710783_0_0.png)\n\
    \n初学者编码示例\n\nJAKE BOND\n\n# 考试与面试 JavaScript 练习题\n\n# ## 初学者编码示例\nJAKE BOND\n\n\
    - 首字母大写转换\n- 将数字转换为小时和分钟\n- 统计给定字符串中的元音数量\n- 创建新字符串\n- 拼接两个字符串\n- JavaScript：找到第一个未重复的字符\n\
    - JavaScript：找到字符串中最长的单词\n- JavaScript：统计字符串中的元音数量\n- JavaScript：检查一个数字是否为质数\n\
    - JavaScript：获取数据类型\n- JavaScript：找到第二小和第二大\n- 两个数字相加\n- 检查给定年份是否为闰年\n- 检查给定正数\n\
    - 检查字符串是否以 'JAVA' 开头\n- 检查两个给整数\n- 寻找接近 100 的值\n- 检查给定正数\n- 检查字符串是否以 'JAVA' 开头\n\
    - 计算乘法和除法\n- 转换温度\n\n# 将给定字符串的每个单词首字母大写\n\n# ## HTML 代码\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n    <title>将给定字符串的每个单词首字母大写的 JavaScript 程序</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# ## JAVASCRIPT 代码\n\n```javascript\n\
    function capital_letter(str) {\n  str = str.split(\" \");\n  for (var i = 0, x\
    \ = str.length; i < x; i++) {\n    str[i] = str[i][0].toUpperCase() + str[i].substr(1);\n\
    \  }\n  return str.join(\" \");\n}\n\nconsole.log(capital_letter(\"Write a JavaScript\
    \ program to capitalize the first letter of each word of a given string.\"));\n\
    ```\n\n# 输出\n\n输出：\nWrite A JavaScript Program To Capitalize The First Letter\
    \ Of Each Word Of A Given String.\n\n# 小时和分钟\n\n# HTML 代码\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n  <title>将给定数字转换为小时和分钟的 JavaScript 程序</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction\
    \ time_convert(num) {\n  var hours = Math.floor(num / 60);\n  var minutes = num\
    \ % 60;\n  return hours + \":\" + minutes;\n}\n\nconsole.log(time_convert(71));\n\
    console.log(time_convert(450));\nconsole.log(time_convert(1441));\n```\n\n# 输出\n\
    \n1:11\n7:30\n24:1\n\n# 统计元音\n\n# HTML 代码\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width\"\
    >\n    <title>统计给定字符串中元音数量的 JavaScript 程序</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction vowel_Count(str) {\n\
    \    return str.replace(/[^aeiou]/gi, \"\").length;\n}\n\nconsole.log(vowel_Count(\"\
    Python\"));\nconsole.log(vowel_Count(\"htmlresource.com\"));\n```\n\n# 输出：\n\n\
    1\n5\n\n# 创建新字符串\n\n# HTML 代码\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  \
    \  <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width\"\
    >\n    <title>创建一个不包含第一个和最后一个字符的字符串的 JavaScript 程序</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction without_first_last(str)\
    \ {\n    return str.substring(1, str.length - 1);\n}\n\nconsole.log(without_first_last(\"\
    JavaScript\"));\nconsole.log(without_first_last(\"abc\"));\nconsole.log(without_first_last(\"\
    abcde\"));\n```\n\n# 输出：\nava\n\n# 拼接除第一个字符外的两个字符串\n\n# HTML 代码\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n  <title>拼接除第一个字符外的两个字符串的 JavaScript 程序</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction\
    \ concatenate(str1, str2) {\n  str1 = str1.substring(1, str1.length);\n  str2\
    \ = str2.substring(1, str2.length);\n  return str1 + str2;\n}\n\nconsole.log(concatenate(\"\
    ABC\", \"DEF\"));\nconsole.log(concatenate(\"HELLO\", \"WORLD\"));\n```\n\n# 输出：\n\
    BCDEF\nelloorld\n\n# 第一个未重复的字符\n\n示例参数：'abac'\n预期输出：'e'\n\n# HTML 代码\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>找到第一个重复的字符</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction\
    \ findFirstRepeatedChar(str) {\n  var arr1 = str.split(\"\");\n  var result =\
    \ \"\";\n  for (var x = 0; x < arr1.length; x++) {\n    var ctr = 0;\n    for\
    \ (var y = 0; y < arr1.length; y++) {\n      if (arr1[x] === arr1[y]) {\n    \
    \    ctr++;\n      }\n    }\n    if (ctr < 2) {\n      result = arr1[x];\n   \
    \   break;\n    }\n  }\n}\nconsole.log(findFirstRepeatedChar(\"abac\"));\n```\n\
    \n# 输出\ne\n\n# 字符串中的长单词\n\n示例字符串：\"Web Development\"\n预期输出：'Development'\n\n#\
    \ HTML 代码\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width\">\n  <title>找到字符串中的长单词</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction\
    \ longest_word(str) {\n  var arr1 = str.split(/\\s/);\n  var result = \"\";\n\
    \  for (var x = 0; x < arr1.length; x++) {\n    if (arr1[x].length > result.length)\
    \ {\n      result = arr1[x];\n    }\n  }\n  return result;\n}\nconsole.log(longest_word(\"\
    Web Development\"));\n```\n\n# 输出\nDevelopment\n\n# 统计字符串中的元音数量\n\n示例字符串：'quick\
    \ fox'\n预期输出：4\n\n# HTML 代码\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>统计字符串中元音数量的 JavaScript 程序</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction vowel_count(str) {\n  var v_list\
    \ = \"aeiouIOU\";\n  var vcount = 0;\n\n  for (var x = 0; x < str.length; x++)\
    \ {\n    if (v_list.indexOf(str[x]) !== -1) {\n      vcount++;\n    }\n  }\n \
    \ return vcount;\n}\nconsole.log(vowel_count(\"quick fox\"));\n```\n\n# 输出\n4\n\
    \n# 检查一个数字是否为质数\n\n质数是一个只有1和自身两个因数的正整数\n\n# HTML 代码\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"\
    width=device-width\">\n  <title>检查一个数字是否为质数的 JavaScript 程序</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction is_prime(n)\
    \ {\n  if (n <= 1) {\n    return false;\n  } else if (n === 2) {\n    return true;\n\
    \  } else {\n    for (var x = 2; x < n; x++) {\n      if (n % x === 0) {\n   \
    \     return false;\n      }\n    }\n    return true;\n  }\n}\nconsole.log(is_prime(37));\n\
    ```\n\n# 输出\ntrue\n\n# 获取数据类型\n\n# HTML 代码\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>获取数据类型的 JavaScript 程序</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction get_data_type(value) {\n  var\
    \ dtypes = [Function, RegExp, Number, String, Boolean], x, len;\n\n  if (typeof\
    \ value === \"object\" || typeof value === \"function\") {\n    for (x = 0, len\
    \ = dtypes.length; x < len; x++) {\n      if (value instanceof dtypes[x]) {\n\
    \        return dtypes[x];\n      }\n    }\n  }\n  return typeof value;\n}\nconsole.log(get_data_type(12));\n\
    console.log(get_data_type(\"w3resource\"));\nconsole.log(get_data_type(false));\n\
    ```\n\n# 输出\nnumber\nstring\nBoolean\n\n# 找到第二小和第二大\n\n# HTML 代码\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width\">\n  <title>找到数组中第二小和第二大的数</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n# JAVASCRIPT 代码\n\n```javascript\nfunction find_second_lowest_second_largest(arr_num)\
    \ {\n  arr_num.sort(function(x,y) {\n    return x-y;\n  });\n  var uniqua = [arr_num[0]];\n\
    \  var result = [];\n\n  for (var j=1; j < arr_num.length; j++) {\n    if (arr_num[j-1]\
    \ !== arr_num[j]) {\n      uniqua.push(arr_num[j]);\n    }\n  }\n  result.push(uniqua[1],\
    \ uniqua[uniqua.length-2]);\n  return result.join(',');\n}\n\nconsole.log(find_second_lowest_second_largest([1,2,3,4]));\n\
    ```\n\n# 输出\n2,3\n"
