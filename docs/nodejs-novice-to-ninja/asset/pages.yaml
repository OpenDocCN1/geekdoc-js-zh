  md: '# It’s Real-time


    Web platform features such as WebSockets and server-sent events permit real-time
    functionality—such as instant updates, live chat, multiplayer games, and more.
    These can be difficult to implement in traditional server-side languages, where
    they often require third-party services. Real-time functionality in Node.js is
    significantly easier.


    # It’s Lightweight


    The Node.js runtime is small and cross-platform. As well as catering for Linux,
    macOS, and Windows, you find editions for embedded systems, the Raspberry Pi,
    and even SpaceX rockets.


    # It’s Modular


    Node offers a minimal standard library with good documentation. It contains basic
    functions for error handling, file system access, network operations, and logging.


    For everything else ...


    # It’s Extendible


    Node.js has the largest package registry in the world, with more than one million
    modules. You’ll find pre-written code for task runners, loggers, database connectors,
    image processors, code compilers, web servers, API managers, and even client-side
    libraries.


    The npm command-line tool is provided with Node.js and makes it easy to install,
    update, and remove modules. You can also use it to install global modules so Node.js
    scripts can run as commands from anywhere on your system.


    # It’s Open Source


    Node.js is an open-source project. The runtime is free to use without any'
