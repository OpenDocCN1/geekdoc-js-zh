  md: 'You could therefore choose to write a monolithic web application as a series
    of small stateless functions. These are started on demand, but they usually remain
    active on busy servers and can scale according to rises in traffic. If a serverless
    function fails, it’s restarted on the next request and won’t usually affect or
    conflict with other functions.


    Most cloud hosts offer Node.js serverless functions including AWS, Azure, Google,
    Cloudflare, Heroku, Vercel, and Netlify.


    # AWS Everywhere


    Many serverless hosts, including Netlify and Vercel, deploy serverless functions
    to AWS Lambda but offer a simpler or improved developer experience.


    Serverless functions can be ideal for many applications. They can simplify DevOps
    and reduce costs on smaller services, but there are downsides:


    +   * Usage limitations: not all npm packages can be used, especially if they
    depend on other OS utilities.

    * Start-up delay: the first request can take some time as the function is initialized.

    * Shut-down timeout: functions may have processing limits, long-running activities
    as WebSocket servers may not be possible.

    * Vendor lock-in: you must adhere to the host’s APIs, rules, and updates. It may
    be difficult to switch to another service.

    * Incalculable costs: serverless functions are often priced according to compute
    time. You may have heard anecdotes from developers who deployed a non-terminating
    recursive function that led to an eye-watering bill.


    # Container Hosting


    You may require more robust hosting as your Node.js service increases in'
