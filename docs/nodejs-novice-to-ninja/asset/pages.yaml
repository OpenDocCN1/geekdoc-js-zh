  md: 'A NoSQL database such as MongoDB could be ideal for projects where organic
    data flexibility is important—such as content management, social networks, web
    analytics, and so on.


    In general:


    +   - A NoSQL database can be easier to use at the start of a project, but may
    become more difficult as you identify data relationships.

    - An SQL database requires more careful planning up front, but this can return
    dividends toward the end of a project—(unless requirements change radically!)


    Complex projects could benefit from using two or more databases. For example,
    a blog stored in MySQL could use Elasticsearch for Google-like search queries.
    However, maintaining data integrity between two or more databases is complex and
    cumbersome. It may also be unnecessary, because the distinction between SQL and
    NoSQL has blurred:


    +   - some SQL databases have adopted NoSQL features, such as JSON and XML fields

    - some NoSQL databases have adopted SQL features, such as JOINS and transactions


    Research the options, browse usage reports, and consult others to make sure a
    database has the features and support you need. Try to abstract your data manipulation
    code so it becomes easier to switch to another system if that becomes necessary.


    # Native vs ORM Drivers


    Think of an ORM as an abstract database framework. The benefits include:


    +   - They can be easier to learn than specific SQL or NoSQL dialects.

    - Development time is reduced, because a good ORM will manage security and data
    integrity.

    - You can create data models in the application code. There''s no need to directly
    create or alter tables.

    - ORMs track changes and can migrate schemas as necessary.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '+   • ORMs support multiple databases, which could be important if you’re distributing
    web software for others to install.


    The downsides of an ORM:


    +   • They can still be difficult to learn. The Sequelize manual is daunting,
    and that knowledge won''t be applicable elsewhere.

    • An ORM won''t save you from poor data decisions.

    • More complex queries can be difficult to express.

    • ORMs are slower, and queries won''t necessarily be optimized.

    • You’ll be unable to use advanced options provided in a specific database.

    • Database-related bugs may be more difficult to debug.


    An ORM can be ideal for prototypes and smaller projects. Native drivers by optimized,
    hand-crafted queries are better for larger projects where data requirements are
    more critical.


    If I could offer one piece of advice: learn SQL.


    Unlike most development technologies, SQL has persisted for half a century, and
    the skills are transferable to other databases. You''ll become more adept at modeling
    data and creating efficient applications that require less code. You''ll have
    fewer reasons to consider an ORM.


