    Processing each chunk independently results in the following invalid minified
    script:


    <script type="module">script console.log(''loaded'');</script>


    The solution is to pre-parse each chunk and split it into whole sections that
    can be processed. In some cases, chunks (or parts of chunks) will be added to
    the start of the next chunk.


    Minification is best applied to whole lines, an extra complication occurs because
    <!-- --> and /* * comments can span more than one line. Here''s a possible algorithm
    for each incoming chunk:


    +   1. Append any data saved from the previous chunk to the start of the new chunk.


    +   2. Remove any whole <!-- --> to --> and /* */ sections from the chunk.


    +   3. Split the remaining chunk into two parts, where part2 starts with the first
    <!-- or / * found. If either exists, remove further content from part2 except
    for that symbol.


    If neither is found, split at the last carriage return character. If none is found,
    set part1 to an empty string and part2 to the whole chunk.


    If part2 becomes significantly large—perhaps more than 100,000 characters because
    there are no carriage returns—append part2 to part1 and set part2 to an empty
    string. This will ensure saved parts can''t grow indefinitely.


    +   4. Minify and output part1.'
