  md: '# Chapter 8: Using ES2015 and CommonJS Modules


    The previous chapter explained how npm can be used to find and install packages
    containing multiple JavaScript files, or modules. In this chapter, we''ll examine
    how modules are used in Node.js.


    # Skip Ahead?


    The information in this chapter is important, since you''ll encounter issues with
    older Node.js packages. However, all the packages referenced in this course have
    been tested for compatibility, so you can skip ahead and return when you run into
    a problem!


    Modules provide a way to define functionality in one file and use it in another.
    Developers often create encapsulated code libraries responsible for handling related
    tasks. The benefits include:


    +   * code can be split into smaller files with self-contained functionality

    * the same modules can be shared and reused across any number of applications

    * modules need never be examined or updated by others they''ve proven to work

    * code referencing a module understands it''s a required dependency

    * modules preventing naming conflicts: function x() in module1.js can''t clash
    with function x() in module2.js


    Bizarrely, there was no concept of modules in JavaScript during its first twenty
    years. You couldn''t directly reference or include one JavaScript file in another.
    Client-side developers would:


    +   * add multiple <script> tags to an HTML page

    * concatenate scripts into a single file, perhaps using a bundler as webpack or
    task runners such as Grunt and Gulp'
