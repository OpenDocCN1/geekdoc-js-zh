    # Installing and Configuring Database Software


    You can download, install, and configure MySQL, MongoDB, or any other database
    on Linux, macOS, and Windows. That’s beyond the scope of this course, prepare
    yourself for several hours of effort.


    An easier option is Docker. This is shrouded in mystery, but Docker provides a
    way to download, install, and configure pre-built applications in minutes. Install
    Docker on your system, then follow the steps to run MySQL, MongoDB, and the Admin
    database client. The page hit service as a Node.js application on your device
    that connects to this database.


    # MongoDB


    MongoDB is a popular NoSQL database that became associated with Node.js in the
    same way MySQL is paired with PHP. MongoDB groups JSONlike documents into one
    or more collections (analogous to tables) and implements querying with JavaScript-like
    objects.


    NoSQL has become a catch-all for any database that doesn’t follow SQL conventions
    (the “MySQL” section below). In, NoSQL databases implement fewer rules. Repeated
    (denormalized) data is encouraged, and there’s no need to define data structures,
    defaults, constraints, or relationships.


    NoSQL software and storage mechanisms vary. Some offer basic key–value pairs.
    Some use JSON documents. Others are use-case specific, such as Redis for in-memory
    caching, and Elasticsearch for search-engine indexing.'
