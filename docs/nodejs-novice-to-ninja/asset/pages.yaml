    that are absolutely necessary.* It makes sense to leverage the years of development
    and real-world testing received frameworks, database drivers, image optimizers,
    and so on. You can write smaller modules yourself—such as string or date manipulation
    functions. It may take longer initially, but should save you time over the long
    term, because there''s no need to search for appropriate packages, manage updates,
    assess security issues, or switch to alternatives.


