  md: '# Chapter 10: Using Database Storage


    The previous chapters explain programming practices that affect all Node.js applications.
    This chapter applies these fundamentals to the specific challenge of data storage
    using database solutions such as MongoDB and MySQL.


    Web applications often require data that persists between page loads and application
    restarts. Consider a content management system such as WordPress: it stores articles,
    metadata, media, user profiles, comments, settings, plugin configurations, and
    more. Multiple users can log in at any time to view and update content.


    The most common solution to data persistence is a database such as MongoDB, MySQL,
    or PostgreSQL. All database systems have the same purpose: to provide the ability
    to store and query data fast and frequently. They differ in how they achieve those
    goals.


    # Skip Ahead?


    Databases may not be the most exciting topic, but it''s one of the most significant
    differences between frontend and backend engineering. You can skip sections about
    specific systems, but the following chapters will be more difficult to understand
    without some database knowledge.


    # A Database-driven Web Application Example


