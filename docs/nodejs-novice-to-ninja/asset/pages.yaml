  md: "+   • It initializes a new formidable object with the upload directory and\
    \ a setting to keep the file extension.\n\n+   • The .parse() method is called\
    \ with the Express Request object (req) and a callback function that runs once\
    \ the upload has completed. The callback is passed an error message (err), the\
    \ (non-file) data fields, and a files object.\n\n+   • If a single, non-empty\
    \ image property exists in files, the data object is supplemented with information\
    \ about the image. Formidable places it in the uploads directory with a unique\
    \ GUID filename to ensure it can't clash with previous uploads.\n\n+   • The data.imageurl\
    \ is defined by extracting the filename from the file path and appending a / to\
    \ define a URL that resolves to the static directory.\n\n```\n// render form\n\
    // all to handle initial GET and POST\napp.all('/', (req, res, next) => {\n  if\
    \ (req.method === 'GET' || req.method === 'POST') {\n    // parse uploaded file\
    \ data\n    const form = formidable({\n    uploadDir: cfg.dir.uploads,\n    keepExtensions:\
    \ true\n  });\n\n  form.parse(req, (err, data, files) => {\n    if (err) {\n \
    \     next(err);\n      return;\n    }\n\n    if (files && files.image && files.image.size\
