    # Configuring npm Global Permissions on Linux


    The Node Package Manager command-line tool is provided with Node.js and makes
    it easy to install, update, and run modules. Where practical, Node.js apps can
    be installed globally and run from anywhere—such as the Rollup bundler for optimizing
    client-side JavaScript:


    ```

