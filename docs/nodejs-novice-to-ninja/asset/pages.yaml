    # Worker Threads


    Chapter 9 discussed how Node.js applications run on a single thread. Assume a
    user could trigger a complex, ten-second JavaScript calculation in your Express
    application. The calculation would become a bottleneck that halted processing
    for all users. Your application can''t handle any requests or run other functions
    until it completes.


    # Asynchronous Calculations


    Complex calculations that process data from a file or database may be less problematic,
    because each stage runs asynchronously as it waits for data to arrive. Processing
    occurs on separate iterations of the event loop.


    However, long-running calculations written in JavaScript alone—such as image processing
    or machine-learning algorithms—will hog the current iteration of the event loop.


    One solution is worker threads. These are similar to browser web workers and launch
    a JavaScript process on a separate thread. The main and worker thread can exchange
    messages to trigger or terminate processing.


    # Workers and Event Loops


    Workers are useful for CPU-intensive JavaScript operations, although the main
    Node.js event loop should still be used for asynchronous I/O activities.


