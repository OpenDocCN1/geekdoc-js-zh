    To quote C++ designer Bjarne Stroustrup: “There are only two kinds of languages:
    the ones people complain about and the ones nobody uses."


    # Is Deno Better?


    Ryan Dahl released Deno in 2020 and it addresses many of his Node.js regrets.
    Deno offers:


    +   Better security. An application must be granted specific rights when it needs
    access to environment variables, the file system, the network, and other resources.'
