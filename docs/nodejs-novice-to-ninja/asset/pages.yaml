  md: '# Summary


    The Node.js ecosystem is enormous and growing exponentially. Third-party packages
    are generally designed to handle a single, specific task, so you’ll find a range
    of appropriate options for every situation. The downsides:


    +   - It’s easy to become overwhelmed and suffer choice paralysis as you expend
    time and energy evaluating packages.


    +   - You can become increasingly dependent on third-party solutions. Your development
    career may descend into writing tedious code to glue packages together.


    +   - The more third-party packages you use, the more time you require to maintain
    and update that software. You’ll often need to update your code as APIs evolve.


    There’s no such thing as a perfect Node.js package, and I make no apology for
    repeating my mantra: *only use third-party modules that are absolutely necessary.*
    Spend most of your time writing code, not choosing tools and resources!


