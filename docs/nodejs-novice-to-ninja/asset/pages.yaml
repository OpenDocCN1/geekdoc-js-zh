  md: '# Searching for Packages


    You’ll need to install and use a third-party dependency for your application at
    some point. Always consider whether you **really need it**. npm is often criticized
    for reasons such as:


    +   * There be dozens of packages that perform a similar function. How long will
    it take to evaluate the best option?

    * Installation can cause an avalanche of further installations, as each package
    requires others that have further dependencies. You can even end up with multiple
    versions of the same package in the same project.

    * Every third-party package and subpackage raises security implications. npm has
    a registry of known vulnerabilities, but information won’t be available for new
    or less popular packages.


    Is it more practical to write the code yourself?


    A small module specific to your application is a good candidate. You’ll learn
    more and be able to write fully customizable code that is fast and lean. Over
    the long term, it may even take less time and effort than maintaining a regularly
    updated third-party package.


    Larger or more generic modules such as frameworks (Express), database drivers,
    or image compressors are full projects in their own right. It makes sense to leverage
    the many hours of development and real-world testing.


    There’s an infinite array of situations between these extremes. Only you can make
    a judgement, but you may find yourself using fewer packages as your Node.js and
    JavaScript knowledge increases.


    # Development Dependency Limits?


    Development tools (in dev) have no direct effect on your application. That said,
    using a large number will increase installation times, require ongoing maintenance,
    and may confuse new team members.'
