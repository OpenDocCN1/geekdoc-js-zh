  md: '# # Restarting Node.js Applications with Nodemon


    You must restart a running Node.js application every time you make a change. Pressing
    Ctrl | Cmd + c and launching again will quickly become tiresome.


    Nodemon is a utility that monitors your source files for changes and automatically
    restarts the application. Install it globally with npm:


    ```

    npm install -g nodemon

    ```


    You can now use nodemon in place of node to launch any Node.js application. For
    example:


    ```

    nodemon webhello.js

    ```


    (You can pass any arguments as before.)


    When you save a code change, Nodemon restarts the application and you’ll see a
    log entry in the terminal:


    ```

    [nodemon] restarting due to changes...

    [nodemon] starting `node webhello.js`

    ```


    If it doesn''t work, try running nodemon with the --legacy-watch / -L argument:


    ```

    nodemon -L webhello.js

    ```


    Refer to the Nodemon documentation for more options.


    # Executing Scripts from Windows Powershell


    By default, Windows PowerShell won’t let you execute third-party scripts as nodemon.
    Enter this command in a PowerShell window to permit script execution:


    ```

    Set-ExecutionPolicy RemoteSigned -Scope CurrentUser

    ```'
  merge: -1
