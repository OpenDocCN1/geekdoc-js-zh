  md: '# Chapter 4: How to Debug Node.js Scripts


    Tutorials often describe debugging in the final chapters. This can be frustrating
    if you encounter a problem at the start of your coding journey—which you will.
    Software development is complex.


    If you''re lucky, your code will crash with an obvious error message. If you''re
    unlucky, your application will carry on regardless but not generate the results
    you expect. If you''re really unlucky, everything will work fine until the first
    user to arrive discovers a catastrophic, disk-wiping bug.


    # Skip Ahead?


    > This is a long chapter that describes several debugging options. You can skip
    ahead to the “Exercise: Debugging webhello.js” section (near the end of the chapter)
    if you''d like to get going. That said, a little learning now could save hours
    of effort later!


    # What is Debugging?


    Debugging is the black art of fixing software defects. Fixing a bug is often easy;
    a corrected character or additional line of code solves the problem. Finding that
    bug is another matter, and developers can spend many frustrating hours locating
    the source of an issue. Fortunately, Node.js has some great tools to help trace
    problems.


    # How to Avoid Bugs


    You can often prevent bugs before you test your application. Let’s look at some
    ways.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Use a Good Code Editor


    A good code editor offers features such as:


    +   * line numbering to locate where an error occurred

    * type checking—for example, to ensure a number variable can''t have a string
    assigned

    * color-coding to catch syntax issues, such as invalid statements or missing quotes

    * auto-completion of variable names, function names, properties, etc.

    * bracket matching to highlight problems in nested structures

    * auto-indentation that uses the correct tab or space characters

    * variable naming across files and projects

    * snippet saving and reuse

    * parameter prompts for functions, properties, and methods

    * function navigation to jump to a declaration

    * unreachable code detection

    * refactoring tools to rearrange messy code


    Node.js developers are spoiled for choice, with editors such as VS Code, Atom,
    and Sublime Text.


    # Use a Code Linter


    A linter reports faults such as syntax errors, poor indentation, undeclared variables,
    mismatched brackets, and your own preferences (semicolons; quote usage, etc.)
    before you save and test your code. Popular options for JavaScript and Node.js
    include ESLint, JSLint, and JSHint.


    These can be installed as global Node.js modules. For example, here''s how to
    install ESLint globally using npm:


    ```

    npm install eslint -g

    ```


    You can then check files from the command line:


    ```

    eslint myscript.js

    ```'
