    # Creating a Route Handler


    Defining all route handlers in the entry index.js script becomes impractical as
    your application grows in complexity. A better option is to create route handling
    middleware in separate files with related functionality.


    The following example updates the Express code so that requests to any URL starting
    /hello/ are handled in a single router file. Two GET requests are implemented:


    +   * /hello/:name returns a page saying hello by name. For example, /hello/craig
    displays “Hello Craig!”

    * /hello/:lang/ returns a page saying hello to someone by name in a specific language.
    For example, /hello/fr/craig switches to French and displays “Bonjour Craig!”


