  md: "The Watch pane shows:\n\nreq.url: `/favicon.ico`\\nnameArg: `Favicon.ico`\n\
    \n(If this doesn't happen, try a hard refresh in your browser—usually Ctrl + F5\
    \ on Windows and Linux or Cmd + R on macOS).\n\nWhen a browser makes its first\
    \ request for a web page, it also requests a favicon.ico image. This is the icon\
    \ shown to the left of the browser's title tab.\n\nA web server would normally\
    \ send an appropriate image or return an HTTP 404 Not found error. However, your\
    \ Node.js application treats it like any other request and returns the HTML text\
    \ \"Hello Favicon.ico\", which the browser can't use.\n\nIt's not a catastrophic\
    \ bug, but both the browser and server are doing unnecessary work. Fix it by adding\
    \ a check at the top of the createServer callback function, which returns a 404\
    \ error:\n\n```\nhttp.createServer((req, res) => {\n  // abort favicon.ico request\n\
    \  if (req.url.includes('favicon.ico')) {\n    res.statusCode = 404;\n    res.end('Not\
    \ found');\n    return;\n  }\n}\n```\n\nSave webhello.js, and nodemon will restart\
