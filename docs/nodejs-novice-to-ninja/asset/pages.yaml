  md: '# Chapter 2: Install Node.js


    You won''t get far on your Node.js journey without installing the runtime first!
    You have three primary options:


    +   - Install Node.js on your local development machine running Linux, macOS,
    or Windows.


    This is the easiest choice, and the best way to get started—and it''s the option
    we''ll be taking here.


    +   - Install Node.js via a virtual machine (typically Linux) running on Hypervisor
    software such as VMware, VirtualBox, Parallels, or Hyper-V.


    This won''t affect your main OS, so you can experiment without risk.


    Windows users should also consider the Windows Subsystem for Linux 2 (WSL2), which
    offers a highly integrated Linux environment. Follow the Linux instructions accordingly
    (Found below in the “How to Install Node.js on Linux (or Windows WSL2”) section).


    +   - Containerization software such as Docker.


    Docker provides a wrapper around applications known as a container. You''ll use
    Docker in later chapters to install software such as databases, but you can also
    develop, debug, and deploy Node.js apps in a similar way.


    A configured container runs identically on every OS, so it''s ideal when working
    in teams where members have different devices.


    Node.js apps will work cross-platform, but there are differences in file systems
    and supported software. Web applications are typically deployed to a Linux server,
    so developing on a Linux OS, virtual machine, or Docker container can help to
    avoid compatibility issues.'
  merge: -1
