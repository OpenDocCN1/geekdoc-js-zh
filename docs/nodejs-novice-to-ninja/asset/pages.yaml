    scripts. I''d rather not run my own code that way, let alone someone else''s!


    A better option is to change the default npm directory to one owned by you. Create
    a new directory for global modules, then configure npm, like so:


    ```

    mkdir ~/.npm-global

    npm config set prefix ~/.npm-global

    ```


