    # A Function Must be 100% Synchronous or 100% Asynchronous


    No path through an asynchronous function should ever lead to a callback being
    run immediately.


    A simple way to solve this is the setImmediate() timer. This calls a function
    during the next iteration of the event loop:


    ```

    // wait for ms milliseconds

    function wait(ms, callback) {


    ms = parseFloat(ms);


    // invalid ms value?

    if (!ms || ms < 1 || ms > 3000) {


    const err = new RangeError(''Invalid ms value'');

    setImmediate( callback, err, ms );

    return;

    }


    // wait ms before callback

    setTimeout( callback, ms, null, ms );

    }

    ```


