    An object-relational mapping (ORM) module can make development easier by providing
    an abstract layer between your code and the database. Rather than running SQL/NoSQL
    commands directly, your code manipulates data objects that are saved and restored
    from a representation in a database.


    sequelize is a popular Node.js ORM that supports MySQL, MariaDB, PostgreSQL, SQLite,
