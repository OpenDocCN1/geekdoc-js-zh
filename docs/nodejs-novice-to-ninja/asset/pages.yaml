  md: '# Node Version Manager


    Node Version Manager (nvm) is a tool that allows multiple editions of Node.js
    to be installed on the same Linux, macOS, or Windows WSL system. This can be practical
    if you''re working on two or more projects using different versions of Node.js.


    # Choosing a Node.js Version


    Install a recent release of Node.js unless you''re supporting a legacy application
    with specific requirements.


    Even-numbered Node.js versions—such as 16, 18, and 20—focus on stability and security
    with long-term support (LTS). Updates are provided for at least two years, so
    I recommend them for live production servers. You should install an identical
    version of your development machine


    Odd-numbered versions—such as 15, 17, 19—are under active development and may
    have experimental features. They''re fine for development if you''re learning,
    experimenting, or upgrading frequently.


    Node.js 16 was used to develop the example code in this course. However, Node.js
    generally has good backward compatibility, and applications written in earlier
    editions of the framework *usually* in later versions.


    # How to Install Node.js on Linux (or Windows WSL2)


    Open the nodejs.org home page in your browser and you''ll be directed to download
    an installation package appropriate for your OS. However, it''s most practical
    to use the package manager built into your OS. Ubuntu and Debian binaries are
    available from NodeSource and, using version 16.x as an example, you can install
    Node.js from an Ubuntu bash terminal like:


    ```

    curl -fsSL https://deb.nodesource.com/setup_16.x | sudo bash - sudo apt-get install
    -y nodejs

    ```'
