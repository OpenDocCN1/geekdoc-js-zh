    # Summary


    Asynchronous programming takes some time to understand and will catch you out.
    The following tips will help you write more robust Node.js applications.


    +   * Ensure JavaScript functions run quickly and don’t block the event loop.

    * Pass callback functions to an asynchronous function so they can be called when
    an operation is complete.

    * The first argument of the callback function must be an error object or string
    message.

    * Always ensure a function return occurs after a callback runs.

    * An asynchronous function must be 100% asynchronous: no path should lead to an
    immediate callback. Pass a callback to setTimeout() to run during the next iteration
    of the event loop if necessary.

    * Learn how to create your promise functions or create them from a callback-based
    function using util.promisify().

    * You can await a promise to complete inside an async function.

    * Where possible, run promises in parallel using options such as Promise.all()
    or Promise.allSettled().


