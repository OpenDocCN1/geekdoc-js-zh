  md: 'You should note that the worker-based calculation runs slightly faster because
    the thread is fully dedicated to that process. Consider using workers if you encounter
    performance bottlenecks in your application.


    View the demonstration video to see the code in action.


    # Child Processes


    It''s sometimes necessary to call applications that are either not written in
    Node.js or have a risk of failure.


    A Real-world Example

    I worked on an Express application that generated a fuzzy image hash used to identify
    similar graphics. It ran asynchronously and worked well—until someone uploaded
    a malformed GIF containing a circular reference (animation frameA referenced frameB
    which referenced frameA).


    The hash calculation never ended. The user gave up and tried uploading again.
    Again. Again. Again. The whole application eventually crashed with memory errors.


    The problem was fixed by running the hashing algorithm in a child process. The
    Express application remained stable because it launched, monitored, and terminated
    the calculation when it took too long.


    The child process API allows you to run sub-processes that you can monitor and
    terminate as necessary. There are three options:


    +   - spawn: spawns a child process.

    - fork: a special type of spawn that launches a new Node.js process.

    - exec: spawns a shell and runs a command. The result is buffered and returned
    to a callback function when the process ends.


    Unlike worker threads, child processes are independent from the main Node.js script
    and can''t access the same memory.'
  merge: -1
