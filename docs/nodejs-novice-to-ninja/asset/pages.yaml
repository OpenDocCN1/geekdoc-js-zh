    # #!/What?


    The first line in hello.js—#!/usr/bin/env node—is known as a **shebang or hashbang**.
    It''s entirely optional and ignored when you run node-hello.js, because you''re
    passing the script to the Node.js runtime which executes the code.


    However, the shebang can be useful in Linux and macOS because it specifies which
    runtime to use—in this case, node. You can run the script using ./hello.js alone
    but, before you can do that, you must permit direct execution by entering the
    following OS command in your terminal:


    chmod +x .hello.js


