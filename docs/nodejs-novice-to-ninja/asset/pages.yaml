    # Semantic Constraints


    package.json uses special codes to indicate which version of a package be installed
    on a clean machine using MAJOR.MINOR.PATCH semantic versioning (see the “Semantic
    Versioning” section above):


    +   - 1.2.33: install an exact version

    - >1.2.33: install a version greater than 1.2.33 (2.0.0 is permitted)

    - >=1.2.33: install a version greater than or equal to 1.2.33

    - <1.2.33: install a version less than 1.2.33

    - <=1.2.33: install a version less than or equal to 1.2.33

    - ^1.2.33: install any greater or equal compatible version with the same MAJOR
    number—such as 1.3.0 but not 2.0.0 (this is the default)

    - -1.2.33: similar to ^ but won''t go beyond the next MINOR number—that is, a
    maximum of 1.3.0

    - * (or an empty string): install any version


    Versions can be combined—for example, <2.0.0 || >=3.0.0, to skip version 2.x.x.'
