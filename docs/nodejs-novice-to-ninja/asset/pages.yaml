  md: "# Node.js Application Preparation\n\nYour development and deployment environments\
    \ will differ. As a bare minimum, live servers should set the NODE_ENV environment\
    \ variable to production:\n\nNODE_ENV=production\n\nWhen set, the Express framework\
    \ disables verbose logging and enables template caching to improve performance.\
    \ Other modules may offer similar optimizations, but check their README files\
    \ and documentation.\n\nInternally, your application can detect the NODE_ENV value\
    \ and disable terminal debugging messages, or make other changes such as logging\
    \ to a file. For example:\n\n```\n// running in development mode?\nconst DEVMODE\
    \ = (process.env.NODE_ENV !== 'production');\n\nif (DEVMODE) {\n    console.log('application\
    \ started in development mode');\n} else {\n    writeToLog('application started\
    \ in production mode');\n}\n```\n\nOther environment variables may be required\
    \ to define application configurations or database connections.\n\nFinally, production\
    \ servers should normally launch the application with the node runtime command\
    \ rather than nodemon or similar. Command-line options such as --inspect and --enable-source-maps\
    \ shouldn't be used.\n\n# Dedicated Server Hosting\n\nIn Node's early days, there\
    \ was little choice to spin up a real or virtual Linux server. It probably remains\
