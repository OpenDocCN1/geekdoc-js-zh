  md: 'error the program works but doesn''t act as intended


    priority where a bug is allocated on a list of planned updates


    race condition hard-to-trace bugs dependent the sequence or timing of uncontrollable
    events


    refactoring rewriting code to help readability and maintenance


    regression re-emergence of a previously fixed bug perhaps owing to other on updates


    related a bug that''s similar or related to another


    reproduction the steps required to cause the error


    RTFM error user incompetence disguised as a bug report, typically followed by
    a developer’s response that they should “Read The Friendly Manual”


    step into when running line by line in a debugger, step into the function being
    called


    step out when running line by line, complete execution of the current function
    and return to the calling code


    step when running line by line, complete execution of a command without stepping
    into a function calls


    over the impact of a bug on system. For example, data loss would happen


    severity normally be considered more problematic than a one-pixel UI alignment
    issue unless the frequency of occurrence is very low


    stack trace the historical list of all functions called before the error occurred


    syntax error typographical errors, such as console.log()


    user an error caused by a user rather than the application. This may still incur
    an update, depending on the seniority of the person who caused it!


    watch a variable or expression output during debugger execution'
