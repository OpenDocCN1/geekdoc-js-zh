  md: 'You can find a video demonstration of the web application in action here.


    # Web Application Considerations


    # Complexity Ahead


    This section covers some advanced response topics. Don’t worry if it doesn’t make
    sense now. We’ll revisit the information later.


    It’s astonishing that this lightweight script implements a functional web server.
    The app is permanently on, and it can retain its own state regardless of the number
    of users. For example, it could establish a database connection once at start-up,
    then reuse that connection on every request. Apache/PHP applications are usually
    stateless, so every page request must load configuration parameters and connect
    to a database before running a query.


    However, Node.js applications run on a single processing thread:


    +   - If your app fails, it fails for everyone and won’t restart unless you have
    appropriate monitoring in place. Options including PM2 and forever can help.

    - If a single user triggers a long-running JavaScript function that takes ten
    seconds to complete, every user accessing at that time will be waiting at least
    ten seconds for a response. Asynchronous code solves the problem, but it takes
    time to understand the concepts.

    - Scaling an application can be difficult. Throwing more RAM or CPUs onto an Apache/PHP
    server will improve response times. Node.js still runs on a single CPU core even
    when CPU has 15 or more at its disposal. Solutions such as clustering, PM2, and
    Docker containers can help by launching multiple instances of the same application.


    In addition, Node.js web servers are not efficient at serving static files as
    images, stylesheets, and client-side JavaScript. Production sites often use a
    front-end NGINX web server to serve static files or direct the request to the
    Node.js application when appropriate. This is known as a reverse proxy and it
    has benefits, such as:'
  merge: -1
  pgno: 33
- img_proc: true
  md: '+   - Static assets are served without any Node.js interaction. This avoids
    unnecessary processing and improves performance.


    +   - Settings such as HTTPS certificates can be handled by NGINX rather than
    Node.js. This is especially practical when you have more than one instance of
    the same Node.js application running.


    +   - A Node.js app can run on a port above 1000, so it doesn’t need elevated
    superuser permissions.


    # Write Stateless Applications


    Suppose your single Node.js app kept count of the number of logged-in users in
    single global variable userCount.


    What would happen if you wanted to improve performance by launching two or more
    instances of the same app—perhaps on other servers? Any instance could handle
    a user login. The userCount value would be different—and wrong—on each instance
    of the app.


    During development, you’ll often work on a single running instance. However, I
    recommend you make it stateless to ensure it can scale and be more resilient.
    Always prescribe:


    +   - multiple instances could be running anywhere, possibly on different ports
    or servers


    +   - an instance can be started or stopped at any time


    +   - a frontend web server will direct a single user’s request to any instance—regardless
    of which instance handled a previous request


    In evidence, storing application or user state in variables or local files that
    could differ across instances. Use a database to retain state so every instance
    of the application can be synchronized.


    # Summary


    In this chapter, you’ve learned how to write simple console and web server applications
    using Node.js libraries. You’ve also seen how nodemon can automatically restart
    your app after updating code.'
