  md: '# # MySQL


    MySQL is a popular SQL database. SQL (Structured Query Language) is a standard
    for managing data in a relational database management system (RDBMS). Data is
    stored in tables and should ideally be defined in one place without duplication
    (known as normalization).


    Consider a book inventory. Each book has an ID, title, author, and publisher,
    and is added as a new row (record) to a book table:


    | id | title | author | publisher |

    | 1 Introduction to Node.js | Craig Buckler SitePoint |

    | 2 Jump Start Web Performance | Craig Buckler SitePoint |

    | 3 DevTool Secrets | Craig Buckler SitePoint |

    | 4 Learn to Code with JavaScript | Darren Jones SitePoint |


    An author and publisher can have more than one book. Rather repeat the same values,
    it’s more practical to create author and publisher tables where each record has
    a unique ID.


    Here’s the author table:


    | id | name | country |

    | 2 Craig Buckler | UK |

    | 3 Darren Jones | UK |


    Here’s the publisher table:


    | id | name | country |

    | 1 SitePoint | AU |


    You can reference those IDs in the book table:


    | id | title | author_id | publisher_id |'
