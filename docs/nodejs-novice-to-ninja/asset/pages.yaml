    # Process Management


    Node.js applications run on a single processing thread. In other words, 63 cores
    in your 64-core server CPU are sitting idle.


    You can implement your own clustering code to run an application on all available
    CPU cores, but this can be difficult (see Chapter 12, as [Node.js documentation](https://nodejs.org/en/docs/api)).
    A better solution is to use a **process manager**, which makes your live application
    more efficient by:


    +   - running multiple instances across different CPU cores

    - restarting an instance if (when) it crashes


    For this to work, **your application must be stateless**. Avoid storing application
    or user state in variables or local files that could differ across instances.


    ![](img/d4731c5479f6bfd1ada49d65047b9e4c_327_0.png)'
