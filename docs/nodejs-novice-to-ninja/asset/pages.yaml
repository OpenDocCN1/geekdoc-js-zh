    # What Is a Database Index?


    An index is the list of the data in one or more fields in a specific order—much
    like the index in a book. For example, you could have a number of user records
    created as each person registers. When someone logs in, you must locate a user''s
    record by their email address:


    +   * Without an index, the database must search through every user record one
    by one until the correct email is found.

    * With an index on the email field in ascending alphabetical order, the database
    can locate a matching record far faster.


    Indexes are used on fields that you frequently query. It''s tempting to create
    indexes on every field, but the more you add, the longer it takes to write new
    records and update all indexes.


