  md: '# # Chapter 5: Getting Started with Express


    In this chapter, you''ll create a web server application that constructs and returns
    simple web pages. It will help you become more familiar with:


    +   * npm (Node Package Manager)

    * ES6 modules

    * the Express framework

    * URL routing

    * HTML template engines


    #  Why use Express?


    You created a small web server application in Chapter 3. It''s fast, and it works
    well, but a complex web application requires features such as URL routing, query
    string parsing, posted data decoding, HTML templates, serving, and more. You could
    write this yourself, but much of effort is already implemented in Express.


