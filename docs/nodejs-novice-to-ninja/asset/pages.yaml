  md: '# Use Test-driven Development


    **Test-driven development** (TDD) is a development process that encourages developers
    to write code to test the operation of a function *before* that function is written—as
    in X *returned when function Y is passed input Z*?


    Tests are run as you develop code to prove the resulting function works as expected.
    The same test can be rerun to fix issues after further changes are made. *Of course,
    your tests could have bugs too!*


    Further resources:


    +   - TDD overview at Wikipedia

    - "What is Test Driven Development"

    - "Master Test-driven Development in Node.js"


    # Node.js Debugging Environment Variables


    Environment variables set within the host operating system control Node.js application
    settings. The most common is NODE_ENV, which is typically set to development when
    debugging or production on a live server.


    Environment variables can be set on Linux/macOS:


    ```

    NODE_ENV=development

    ```


    This is the Windows Command Prompt:


    ```

    set NODE_ENV=development

    ```


    This is for Windows Powershell:


    ```

    $env:NODE_ENV="development"

    ```


    Internally, your own application can detect the setting and enable debugging messages
    when necessary. For example:


    ```

    // running in development mode?

    const DEVMODE = (process.env.NODE_ENV !== ''production'');

    ```'
