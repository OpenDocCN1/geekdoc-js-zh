  md: "```\nserver {\n  listen 80;\n  listen 443 ssl;\n  # live domain\n  server_name\
    \ myapp.com;\n  # HTTPS certificates\n  ssl_certificate /etc/nginx/ssl/server.crt;\n\
    \  ssl_certificate_key /etc/nginx/ssl/server.key;\n  # static file?\n  location\
    \ / {\n    root /home/node/myapp/static;\n    index.html;\n    try_files $uri\
    \ $uri/ @nodejs;\n  }\n  # Node.js reverse proxy\n  location @nodejs {\n    proxy_pass\
    \ http://localhost:3000;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade\
    \ $http_upgrade;\n    proxy_set_header Connection 'upgrade';\n    proxy_set_header\
    \ Host $host;\n    proxy_cache_bypass $http_upgrade;\n  }\n}\n```\n\nNGINXConfig\
    \ configuration tool can create a setup suitable for your requirements.\n\n# Static\
