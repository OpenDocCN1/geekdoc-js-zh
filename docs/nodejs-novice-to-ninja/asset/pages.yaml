    # Advanced Routing


    URL routing is at the heart of Express processing. You’ve developed simple routes
    that run functions for specific matching URLs, but there are more options:


    +   * path expressions: handling many routes with one function

    * path parameters: parsing routes to extract values

    * HTTP methods: using GET, POST, DELETE, PUT and so on

    * route handlers: grouping related route handlers into one file


    # Routing Path Expressions


    Simple URL routes are defined in the above. For example:


    ```

    // another route

    app.get(''/hello/'', (req, res) => {

    res.send(''Hello again!'');

    });

    ```


    The route handles HTTP GET requests to /hello/, although Express will do the following:


    +   * Ignoring case. The paths /Hello/ and /HELLO/ will match the /hello/ route
    unless you add app.set(''case sensitive routing'', true) to index.js.

    * Ignore closing slashes. The paths /hello/ and /hello match the same route unless
    you add app.set(''strict routing'', true) to index.js.


    As well as exact routes, you can define regular expression patterns to match a
    range of URLs. For example:


    +   * denotes that the preceding character is optional. A route of /ab?cd/ matches
    the URL paths /abcd/ and /acd/.'
