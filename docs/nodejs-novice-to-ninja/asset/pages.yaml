    +   1. Asynchronous programming is a challenge.


    You won''t necessarily encounter asynchronous programming in other languages,
    and it''s easy to make mistakes that lead to application instability. I devoted
    the whole of Chapter 9 to this topic, because it''s so important in Node.js programs.


    Understanding callbacks can be tricky for novice JavaScript coders but it''s impossible
