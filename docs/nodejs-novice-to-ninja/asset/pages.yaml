  md: '# Clusters


    Is your 64-core server CPU under-utilized when your Node.js application runs on
    a single core? Clusters allow you to fork any number of identical processes to
    handle the load more efficiently.


    The initial primary process can fork itself—perhaps once for each CPU returned
    by os.cpus(). It can also handle restarts when a process fails, and broker communication
    messages between for processes.


    Clusters work amazingly well, but your code can become complex. Simple and more
    robust options include:


    +   - process managers such as PM2, which offer an Cluster Mode

    - a container management system such as Docker or Kubernetes


    Both can start, monitor, and restart isolated instances of the Node.js application.
    The application will remain active even when one fails.


    | Write Stateless Applications |

    | This was mentioned in Chapter 3, but it''s worth reiterating: make your application
    stateless to ensure it can scale and be more resilient. It should be possible
    to start any number of instances and share the processing load. |


