    When receiving a message from a player, the WebSocket server may perform some
    actions immediately. However, most messages are forwarded to all WebSocket servers
    where users are connected to the same game. Each WebSocket server (including the
    one that originally received the message) then processes the message and, in most
    cases, transmits it back to its connected clients where DOM and game state updates
    occur.


