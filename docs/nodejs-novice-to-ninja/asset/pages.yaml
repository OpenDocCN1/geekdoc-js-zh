  md: '# Processing HTTP Post Body Data


    An HTTP POST sent via an HTML <form> with its method set to "post" places all
    data in the body of the request. Express doesn''t parse this data by default and
    requires an express.urlencoded() middleware function to populate a Request .body
    property with an object containing name/value pairs.


    # The body-parser Module


    Older editions of Express didn''t include a body parsing function, so you may
    see references to a body-parser module in other tutorials.


    The code in code/ch06/express-post provides a simple example. The template views/form.ejs
    is identical to that in the GET example above (in the "Processing HTTP GET Query
    Strings" section), except the <form> method is set to "post".


    The index.js entry script sets the EJS template engine and then defines the body
    parsing middleware like so:


    ```

    // body parsing

    app.use(express.urlencoded({ extended: true }));

    ```


    The extended syntax option uses the qs module to create a richer Request object
    with nested properties and arrays if you''ve defined form fields appropriately.


    The initial page load for the root / URL is an HTTP GET request, while the form
    submission is an HTTP POST request. Rather than define these separate routes,
    the index.js entry script uses app.all() so a single function processes all HTTP
    methods. It renders the form template and passes an object where the data property
    is set to req.body.


    ```

    // Express application

    import express from ''express'';

    n// configuration

    const cfg = { port: process.env.PORT || 3000

    ```'
