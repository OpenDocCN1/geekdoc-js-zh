  md: '# Chapter 18: Node.js Application Deployment


    You’ll eventually want to release your Node.js web app to the world. Deployment
    options have grown exponentially since the runtime was released in 2009. This
    chapter describes general types of production hosting, with links to appropriate
    companies, but the range of services and prices changes daily.


    # Pages vs Applications


    Many readers of this book will be familiar with PHP—the world’s most-used web
    programming language. WordPress alone runs almost half of all websites. A PHP
    application consists of .php files that are interpreted by the PHP runtime when
    they’re accessed via a server such as Apache. HTML or data is then returned to
    the user’s browser.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '![](img/d4731c5479f6bfd1ada49d65047b9e4c_322_0.png)


    The following points are important to note:


    +   - Each page load is stateless. It knows nothing about the application’s state,
    so if a user is logged in, their state must be retrieved from a token or database
    record during every page request.

    - Changing a .php file instantly updates the application, because the code is
    executed when a user requests that resource.

    - A .php file that causes an error is less likely to cause problems on other pages.
    Of course, that .php file may provide functions shared across multiple pages,
    but the server and other parts of the application will usually remain active.


    A Node.js web project is a full application that handles web requests. It doesn’t
    (necessarily) require a server such as Apache and runs continuously after the
    code is loaded from .js files.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '![](img/d4731c5479f6bfd1ada49d65047b9e4c_323_0.png)


    Therefore:


    +   - State can be retained. If necessary, a server application could store a
    JavaScript object for every logged-in user. (I recommend you write stateless apps,
    but it''s not enforced!)

    - Changing a .js file has no impact on the running application. It will only be
    loaded after the node process has been stopped and restarted.

    - If any part of your application causes a crash, it goes down for everyone forever!
    No user will be able to access any part of the system and it will lose any state
    retained in memory.


    The Node.js model has advantages and disadvantages over PHP, but deploying an
    application to a production server is more challenging.


    Most budget shared server hosts support PHP because it can be run by uploading
    a .php file to a server directory. Far fewer offer Node.js, because you require
    OS-level access to launch an application, which could hog'
