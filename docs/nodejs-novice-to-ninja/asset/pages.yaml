    As a web developer, you’ll almost certainly encounter Node.js, even if it’s not
    a core part of your technology stack. Knowing a little Node.js could help your
    projects and career. You’ll have a better insight into the possibilities available
    to modern web applications.


    # What About Deno?


    Node.js is a cross-platform, V8-based JavaScript runtime released by Ryan Dahl
    in 2009.


    Deno is a cross-platform, V8-based JavaScript runtime released by Ryan Dahl in
    2020.


    Deno smooths over some cracks and inconsistencies of Node.js, with the benefit
    of a decade’s worth of history. It directly supports TypeScript without a compiler,
    uses ES modules rather than CommonJS, replicates many browser APIs (window, addEventListener,
    Fetch, Web Workers, etc.), and provides built-in tools for linting, testing, and
    bundling.


    Deno is great—but it’s new, and yet to achieve a fraction of Node’s popularity.
    The frameworks are similar: if you know one, it’s easy to switch to the other.


