- img_proc: true
  md: 'PM2 is the primary contender for Node.js process management. After installing
    globally, you can start a Node.js application in cluster mode across all available
    CPU cores:


    ```

    pm2 start app.js -i max

    ```


    # PM2 Port Clashes


    PM2 magically manages ports. If sixteen instances of your Express application
    all listen on port 3000, PM2 ensures they won''t clash. A single request sent
    to port 3000 gets forwarded to one application instance. The next request may
    go to another.


    Note that PM2 port management can fail if you launch your application using an
    npm script.


    Running processes can be monitored with pm2 status.


    # Use a Reverse Proxy


    A reverse proxy passes an incoming request to your Node.js web application. Most
    web servers can be configured as reverse proxies—including NGINX.


    This has several advantages:


    +   * Any number of domains and applications can be configured on the same server.

    * Your Node.js application can be clustered and launched without using sudo.

    * SSL certificates for HTTPS can be managed by the web server.

    * The web server can be configured to serve static assets—such as client-side
    images, CSS, and JavaScript. This is more efficient than passing the request to
    Express, because most web servers are multi-threaded.


    An NGINX configuration file at /etc/nginx/sites-available/default can define the
    incoming ports, set the SSL certificates, and resolve requests to the Node.js
    application when a static file isn’t found:'
  merge: -1
