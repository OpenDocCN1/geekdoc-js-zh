    involved in the cooking process. You''re passing instructions to chefs and receiving
    an alert when they''ve completed their job. You''re free to take customer orders
    whenever they arrive.


    Both JavaScript and Node.js are **single-threaded**: the runtime can only do one
    thing at a time. It would be like a restaurant with a single chef, except JavaScript
    offloads input and output operations to the operating system kernel (other “chefs”)
    who operate in parallel). A Node.js app may start a file write, database read,
    or HTTP request, but it won''t wait for that operation to finish. Instead, it
    asks for a callback function to be run when it''s complete and success or error
    data is available.'
