  md: '# Game Logic


    This section provides an overview of the game logic as it progresses from joining,
    to starting, playing, and finishing a quiz. Note the following:


    +   * The client-side JavaScript at web/static/js/main.js sends messages from
    a client to the WebSocket server when an event occurs—such as answering a question.

    * The WebSocket server-side JavaScript at ws/index.js receives a message from
    a client and executes appropriate functionality. In most cases, messages are broadcast
    to all WebSocket servers running the same game. They receive the data and transmit
    it back to all connected clients on that game.

    * The client-side JavaScript at web/static/js/main.js receives incoming messages
    and updates the DOM or game state accordingly.


    The HTML <body> class is set to the incoming message type. This can trigger CSS
    to show or hide specific elements according to the game state.


    In some cases, an action occurring on a client does nothing until it has received
    back from the server after it has been transmitted to all WebSocket servers and
    their connected clients!


