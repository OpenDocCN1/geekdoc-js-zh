  md: '# # Chapter 13: Example Real-time Multiplayer Quiz: Overview


    This chapter demonstrates a real-time multiplayer quiz written in Node.js. The
    application is a step up from the simpler, self-contained examples shown in previous
    chapters. It has a more complex architecture, but it isn''t using any modules
    or techniques you haven''t seen before. I recommend that you progress through
    the explanations at your own pace and examine the code in an editor so you can
    follow what''s happening.


    The game allows any player to start a new quiz using their own configuration—such
    as the number of questions, scoring, time limits, and so on. Any number of other
    players can join that quiz using a unique code.


    Any number of quiz games can be running concurrently. Players may be connected
    to different HTTP and WebSocket servers, which must keep themselves synchronized
    as events occur.


    This chapter describes how to run and play the game. The following chapters will
    cover these topics:


    +   - the application''s architecture (Chapter 14)

