- img_proc: true
  md: '+   * Native TypeScript support. You can write applications in JavaScript or
    TypeScript without an additional third-party compiler.


    +   * ES6 modules only. Modules are loaded from a URL: there''s no npm equivalent,
    and packages can be cached so there''s one instance on your system across all
    projects.


    +   * Built-in tools. Linting, formatting, testing, benchmarking, bundling, documentation
    generation, task running, and more are available from the deno runtime.


    +   * Replicated browser APIs. Features such as window, addEventListener, Fetch,
    and web workers work all in Deno.


    +   * Replicated Node.js APIs. Deno supports features such as fs, events, http,
    os, process, stream, util, and CommonJS when running in Node.js compatibility
    mode.


    Deno is a great option, but it''s not new and fast as, popular, or well supported
    as Node.js. Perhaps we''ll all be using Deno in a decade''s time, Node.js will
    be consigned to the history books. There''s no harm writing a few utilities or
    example apps in Deno ... but should you adopt it for a long-term, mission-critical
    application when it''s difficult to find programmers with more than a couple of
    months'' experience?


    Deno is similar enough to Node.js that it''s easy to switch between the runtimes.
    Learn Node.js today, consider Deno tomorrow.


