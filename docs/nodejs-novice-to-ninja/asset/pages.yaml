  md: '# Chapter 7: How to Use the npm Node Package Manager


    You can attribute much to Node’s success—frustration—to npm. Node Package Manager
    provides ways to find, install, update, manage, publish, and remove Node.js packages.
    A package could be anything from a simple, one-line JavaScript module to a full
    application.


    npm is the world''s largest software registry. Almost 1.5 million packages have
    been published at registry.npmjs.org and the majority are free to include in your
    projects. You can publish your own package with a single command, and almost 1,000
    developers do that every day.


    Earlier chapters in this course introduced some npm concepts, but the following
    sections explain options you’ll use daily (plus a few you’ll use less frequently).
    The information is important, although you can skip it and use this chapter for
    reference later.


    # npm Alternatives


    > npm isn’t the only Node.js package manager, and you can try alternatives such
    as Yarn and pnpm. However, npm is installed with Node.js and it’s good enough
    for most developers.


    # Global vs Local Packages


    By default, npm installs packages in the local project directory so it can be
    used in an application.


    You can also install packages globally so that they’re available across your whole
    system. This is most practical for command-line applications and utilities that
    could be used at any time from any directory.'
  merge: -1
