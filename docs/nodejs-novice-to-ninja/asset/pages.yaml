    # sudo-not


    Avoid using sudo to run your Node.js application with administrator privileges.
    The application or any of its modules would have rights to do anything—such as
    wiping OS files.


    # HTTP and HTTPS Considerations


    Chapter 5 showed how to configure SSL certificates in Express. This isn’t recommended
    on production servers, because the application must be launched using sudo to
    permit use of HTTP ports below 1,000 (port 80 for HTTP or port 443 for HTTPS).


    A better option is to launch the application on a non-standard port—such as 3000—then
    use a reverse proxy (see the “Use a Reverse Proxy” section below) to forward incoming
