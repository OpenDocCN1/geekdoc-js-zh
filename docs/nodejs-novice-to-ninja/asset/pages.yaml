  md: '# # Chapter 11: Using WebSockets


    This chapter demonstrates how to use WebSockets—a technology that makes it possible
    to open a two-way, interactive communication channel between a browser and a server.
    In the past, this was difficult to achieve on most platforms, and often required
    a third-party service. Node.js makes it easy, although we''ll delve into some
    deeper challenges.


    # ## Skip Ahead?


    It''s possible to become a respected senior developer without touching WebSockets!
    You can skip this chapter, but the technology opens a world of opportunities you
    may not have considered before.


    # ## What Are WebSockets?


    The web is a request–response communication platform. Your browser requests a
    web page and receives HTML as the response from a web server. The page may reference
    assets such as images, fonts, CSS, and JavaScript; the browser makes an additional
    request for each.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '![](img/d4731c5479f6bfd1ada49d65047b9e4c_204_0.png)


    The browser initiates every request. A web server can’t arbitrarily push data
    to a user. It must be requested first.


    Ajax techniques can be used to make web apps look as though they update in real
    time by initiating polling request every few seconds. This can check for new data
    from a web server and update the DOM as necessary.


    Few apps need go beyond this request–response model, because data changes infrequently
    in a typical web application. However, it’s not ideal for true real-time applications
    such as stock price dashboards, chat apps, and multiplayer games. Polling every
    second would be ineffic at certain times, and too slow at others. It’s also difficult
    for a server to determine what changed between two polling intervals: every browser
    could be asking for different data.


    WebSockets provide a solution for real-time apps. The browser makes an initial
    WebSocket request, which opens a communication channel. At that point, either
    the browser or server can send a message that raises an event on the other device.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '![](img/d4731c5479f6bfd1ada49d65047b9e4c_205_0.png)


    Two things to be aware of:


    +   - A browser can only send a message to the WebSocket server.

    - The WebSocket server can send a message to any of its connected clients.


    One browser can’t directly message another. It can only send a message to the
    central WebSocket server and hope it gets forwarded as necessary.


