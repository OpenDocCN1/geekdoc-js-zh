- img_proc: true
  md: 'there’s less context switching, and you’ll avoid simple errors such as using
    the wrong quote character, forgetting a semicolon, or making the wrong method
    call.


    Of course, Node.js isn''t without its criticisms:


    +   1. Some programmers detest JavaScript.


    No language is perfect, but JavaScript was developed in ten days, and it’s unlikely
    Brendan Eich, its inventor, ever considered it might be used for full-scale enterprise
    level applications. Some issues have been addressed with ES6 and types in JavaScript
    compilers such as TypeScript.


    Personally, I love JavaScript—warts and all. Those who complain loudest are usually
    comparing it to their favorite language and have been bitten by JavaScript’s oddities,
    such as prototypal inheritance. If it’s not to your taste, either persevere or
    consider one of the many server-side alternatives.


    +   2. npm is cumsome.


    npm is partly responsible for the success of Node.js. It’s easy to install, update,
    and remove any of the 1.5 million packages. Understandably, not every package
    is *good*, and some have been downright dangerous—laced with malware and crypto-mining
    code. npm has addressed many issues, but others will occur.


    Your node_modules directory will also grow to many megabytes and, despite recent
    optimizations, npm can still download the same packages across different projects.
    Package maintenance can become increasingly laborious over the long term.


    Remember, npm is just a tool. Only install the packages you need and you’ll minimize
    the impact of third-party code.


    +   3. CommonJS vs ES6 module mess.'
