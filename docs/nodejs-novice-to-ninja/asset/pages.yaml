  md: '# # Chapter 1: What is Node.js


    Node.js is a JavaScript runtime, which means it runs programs written in JavaScript.
    Most developers use it to create command-line tools or web server applications.


    # ## Skip Ahead?


    That''s everything you need to know about Node.js. If you''re eager to start programming,
    skip ahead to Chapter 2. That said, it''s worth revisiting this chapter later
    to learn about Node.js''s advantages and core features.


    # ## JavaScript, JavaScript, ECMAScript, ES6, ES2015?


    To make learning more confusing for beginners, JavaScript has many names. It started
    life as “Live Script” in 1994. Netscape rebranded it as “JavaScript” following
    a hasty deal with Sun Microsystems, despite bearing little resemblance to Java
    or lightweight scripting. Microsoft couldn''t use that name, so it became “JavaScript”
    in Internet Explorer.


    In 2005, Mozilla (which grew out of Netscape) joined ECMA International and standardized
    the language as “ECMAScript”. Versions 1 to 3 documented the evolution of JavaScript
    until 1999. Version 4 was abandoned, but ECMAScript 5 became the standard supported
    by most browsers in 2009.


    Work started then ECMAScript 6—“ES6”. The final specification was approved in
    2015, which led to yet another name: “ES2015”. New specifications now arrive every
    year.


    Rightly or wrong, this refers to “JavaScript” throughout. References to specific
    versions (such as ES9/ES2018) are only made if they affect the version of Node.js
    you need to use.


    Node.js was initially developed by Ryan Dahl. He took the V8 JavaScript'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'engine from Google’s Chrome browser, added some APIs, wrapped it in an event
    loop, and launched it as an open-source product on Linux and macOS in 2009. The
    Windows edition arrived in 2011.


    The Node Package Manager (npm) was introduced in 2010. It allowed developers to
    use code modules published by others in their own projects. There was no official
    ECMAScript module standard at the time, so Node.js and npm adopted CommonJS.


    The first (non-beta) release of Node.js arrived in 2015, with updates promised
    six months.


    Node.js wasn’t the first JavaScript runtime, but unlike other options—such as
    Rhino and SpiderMonkey—its popularity grew exponentially. Even those writing PHP,
    Python, Ruby or other languages often use Node.js tools to supplement their development
    processes.


    # Why Learn Node.js?


    JavaScript is the most-used language on GitHub, and it’s ranked highly by developers.
    Companies including Netflix, Uber, Trello, PayPal, LinkedIn, eBay, NASA and Medium
    have adopted Node.js, and most professional developers will have encountered Node.js
    tools.


    Below, we’ll look at some of the reasons you should consider using Node.js.


    # It''s JavaScript


    JavaScript is used on trillions of web pages, where it has a browser monopoly.
    Every professional developer requires JavaScript knowledge to program client-side
    applications.


    Server-side languages are more diverse. Historically, developers could opt for
    PHP, Ruby, Python, C# (ASP.NET), Perl, or Java, but these have different syntaxes
    and concepts. It can be difficult to switch contexts, so larger project teams
    often split into frontend and backend developers.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Node.js allows a developer with frontend JavaScript knowledge to leverage their
    skills on the backend. It won’t make you a full-stack developer overnight, but
    the concepts are similar, and there’s less rigmarole when formatting JSON, handling
    character sets, using WebSockets, and so on.


    # JavaScript Alternatives


    Some developers prefer languages such as TypeScript, PureScript, CoffeeScript,
    Reason, and Dart, which can transpile to JavaScript and run in a browser or Node.js.
    Ultimately, it still results in JavaScript code.


    # It''s Fast


    Most server-side languages are fast enough, but few match the speed of Node.js.
    The V8 engine is quick, and it evolves rapidly, the weight of Google and Chrome
    behind its development. Node.js also has a non-blocking, event-driven I/O.


    Let’s go through that again with less jargon. Most languages use synchronous blocking
    execution. When you issue a command—such as fetching information from a database—that
    will halt further processing and complete before the runtime progresses to the
    next statement. To ensure that multiple users can have access at the same time,
    web servers such as Apache create a new processing thread for every request. This
    is an expensive operation, and Apache has a default limit of 150 concurrent connections.
    Busy servers can become overloaded.


    Node.js code (and browser JavaScript) runs on a single processing thread. Long-running
    tasks such as a database query are processed asynchronously, which doesn’t halt
    execution. The task runs in the background, and Node.js continues to the next
    command. When the task is complete, the returned data is passed to a callback
    function. A Node.js program can have many hundreds of ongoing operations that
    are completed whenever they’re finished, meaning that the processor is free to
    tackle other tasks.


    Asynchronous programming has challenges, but it’s possible to create fast Node.js
    applications that scale well.'
  merge: -1
