  md: "A NoSQL database can be practical when data is more organic and relationships\
    \ are looser. Consider an address book storing telephone numbers for individual\
    \ contacts:\n\n+   - You could allocate a single telephone field in an SQL database,\
    \ but it's too restrictive: contacts may have home, work, and mobile numbers.\
    \ Allocating three telephone fields would be wasteful for some contacts, but not\
    \ enough for others. A separate telephone table is the most flexible option, but\
    \ this increases complexity.\n\n+   - In a NoSQL database, telephone numbers can\
    \ be defined as an unlimited array of objects associated with a contact. For example:\n\
