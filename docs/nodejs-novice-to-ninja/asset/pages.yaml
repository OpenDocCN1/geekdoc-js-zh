    # # Debugging Terminology


    Debugging has its own selection of obscure jargon. We''ve covered most aspects
    throughout this chapter, but you could encounter terms like the ones shown below.


    | Term | Explanation |

    | --- | --- |

    | breakpo | a line at which a debugger halts a program so its state can be int
    inspected |

    | breakpoint | a breakpoint triggered by a certain condition, such as a value
    line reaching 100. Also known as a watchpoint |

    | debug | a tool that offers debugging facilities such as running code line by
    r to inspect internal variable states |

    | duplicate | a reported bug that has already been reported—perhaps in a ion different
    way |

    | feature | as in the claim: “it''s not a bug, it''s a feature”. You''ll find
    yourself saying this at some point |

    | frequency | how often a bug occurs |

    | doesn''t | the most-often made but least useful bug report work |

    | logpoint | a debugger instruction that shows the value of an expression during
    execution |

    | logging | output of runtime information to the console or a file |

    | logic | |'
