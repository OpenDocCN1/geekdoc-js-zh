  md: '# Using ES2015 Modules in Browsers


    This section isn''t specific to Node.js, but it may be useful if you''re developing
    a cross-platform JavaScript library that works both client-side and server-side
    (it''s isomorphic).


    Browsers load ES modules asynchronously and defer execution until the DOM is ready.
    They run in the order specified by each <script> tag:


    ```

    <script type="module" src="./runsfirst.js"></script>

    <script type="module" src="./runssecond.js"></script>

    ```


    Or as specified by an inline import:


    ```

    <script type="module">

    import { something } from ''./somewhere.js'';

    // ...

    </script>

    ```


    Browsers without ESM support don''t load scripts with a type="module" attribute.
    Browsers with ESM support don''t load scripts with a nomodule attribute:


    ```

    <script type="module" src="runs-when-ESM-supported.js"></script>

    <script nododule src="runs-when-ESM-is-not-supported.js"></script>

    ```


    Modules must be served with the MIME type application/javascript or text/javascript.
    A CORS header such as Access-Control-Allow-Origin: must also be set if a module
    can be imported from another domain.


    # Summary


    The module situation in Node.js can be confusing. It has reached a point where:


    +   * some libraries are CommonJS

    * some libraries are ESM

    * some libraries provide builds for both CommonJS and ESM'
