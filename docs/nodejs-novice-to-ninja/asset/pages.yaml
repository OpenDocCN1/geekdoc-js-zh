  md: '# Full-stack Frameworks


    The following frameworks can be used to create full web applications and typically
    allow rendering on the server, the client, or a mixture, as appropriate. They
    may offer hydration techniques where initial content is generated on the server
    in HTML before client-side components take over for full interactivity.


    +   * Next.js: based on React components

    * Nuxt.js: based on Vue components

    * SvelteKit: based on Svelte components

    * Sails: the Node.js equivalent to Ruby on Rails


    # Server-side Frameworks


    If you''d rather have full control over client and server development, the following
    frameworks primarily handle server-rendering of HTML content and/ Ajax responses
    in JSON or any other format:


    +   * Express: one of the first and most popular frameworks

    * Koa: a modern framework designed by the Express team

    * Fastify: claims to be one of the fastest options

    * Hapi: focuses on simplicity, security, and scalability

    * NestJS: offers concepts similar to the Angular client-side framework

    * Adonis: the Node.js equivalent to PHP Laravel

    * Feathers: a lightweight framework for real-time applications and REST APIs

    * restify: optimized for REST web services


    # Node.js in Client-side Frameworks


    Client-side JavaScript (and CSS) frameworks that run in the browser don''t generally
    require Node.js. However, they often use the runtime to provide tools to scaffold
    project folders, bundle modules, implement testing, run development servers, or
    optimize assets at build time.'
