  md: '# Chapter 6: Processing Data with Express


    Unless you’re creating a static website, processing user data posted from an HTML
    form is at the heart of all web applications. In this chapter, you’ll learn how
    Express can:


    +   - parse query string data typically sent in an HTTP GET request (see the “Processing
    HTTP GET Query Strings” section)

    - parse posted body data sent in an HTTP POST request (see the “Processing HTTP
    Post Body Data” section)

    - receive uploaded files typically sent in a multipart/form-data HTTP POST (see
    the “Processing Uploaded Files” section)


    # Code Examples


    The Express examples provided below purposely omit some of the options recommended
    in the previous chapter. Dropping features such as compression, router middleware,
    and 404 pages makes for more concise code—but be sure not to forget them in your
    projects!


    # Sanitize User Input


    The rules of data processing club:


    +   - Never trust user data.

    - See #1.


    User data must always be sanitized on the server. You may have robust HTML and
    JavaScript validation, but there’s no guarantee the request came from a browser
    or worked as expected. Always check data before it’s used elsewhere—especially
    if it’s output to an HTML page. (Note that the EJS <%= escapes HTML.)'
