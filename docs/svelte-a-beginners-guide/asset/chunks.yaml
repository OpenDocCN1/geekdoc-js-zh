    \ the colon depends on the control flow block, and the slash marks the end of\
    \ a block.\n\n`#if` and `#each` are probably what you’ll reach out for the most,\
    \ but there are two more control flow blocks that also come in handy from time\
    \ to time.\n\nThe first one is the `#await` block, which lets you use promises\
    \ inside the markup:\n\n```\n{#await somePromise}\n  Loading..\n{:then result}\n\
