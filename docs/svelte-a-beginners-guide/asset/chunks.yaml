    \ }\n</script>\n\n<label>\n    New To-Do\n    <input type=\"text\" bind:value={newTodo}\
    \ on:keyup={handleKeyup} />\n</label>\n\n<!-- ... -->\n```\n\nNotice the `bind:`\
    \ that we prepended to the `value` attribute. This establishes a two-way-binding\
    \ between the `value` of the input and the variable `newTodo`. We can change it\
    \ from the outside, but it’s also automatically updated whenever the user types\
    \ something into the input. Similar to the shorthand for attribute inputs, there’s\
    \ a shorthand if the name of the variable we bind and the attribute we bind it\
    \ to are the same. So in this case, if the variable name was `value`, we could\
    \ just write `bind:value`. Svelte allows a limited set of these bindings on DOM\
    \ elements, mostly around input elements. This makes interacting with forms really\
    \ easy. It’s also possible to bind to properties of components (you’ll learn more\
    \ about component interaction in Part 5 of this series). If you were to write\
    \ `<Component bind:property />`, this would mean that `Component` would rerender\
    \ every time you changed `property` from the outside, and it would also propagate\
    \ back changes to `property` it made on the inside. But beware: too many two-way\
    \ bindings might get confusing to reason about, so use them with caution.\n\n\
    You may have noticed by now that code inside control blocks or curly braces is\
    \ regular JavaScript—and indeed, you can use all the JavaScript features you like\
    \ inside them. This relieves you from learning any extra template syntax aside\
    \ from what we’ve seen above.\n\n#### It’s Just JavaScript!\n\nEverything inside\
    \ curly braces and control flow blocks in markup is just JavaScript.\n\n## Wrapping\
    \ Up\n\nIn this second Svelte tutorial, we learned the Svelte template syntax.\
    \ We learned how to output dynamic content by putting variables in `{brackets}`.\
    \ We got to know the four control flow blocks, of which `#if` and `#each` are\
    \ probably what you’ll reach for most of the time. We learned how to read and\
    \ write attributes and how to listen to events. Finally, we learned that we can\
    \ use two-way bindings in some situations to make our lives easier.\n\nThe final\
    \ code—after adding all the syntax elements we learned about above—looks like\
    \ this:\n\n```\n<script>\n    let todos = ['Learn Svelte', 'Create great things'];\n\
    \    let newTodo = '';\n    function handleKeyup(evt) {\n        if (evt.key ===\
    \ 'Enter') {\n            todos = [...todos, newTodo];\n            newTodo =\
    \ '';\n        }\n    }\n</script>\n\n<label>\n    New To-Do\n    <input type=\"\
    text\" bind:value={newTodo} on:keyup={handleKeyup} />\n</label>\n\n{#if todos.length\
    \ === 0}\n    <p>What do you want to work on?</p>\n{:else}\n    <ul>\n       \
    \ {#each todos as todo}\n            <li>{todo}</li>\n        {/each}\n    </ul>\n\
    {/if}\n```\n\nNotice how close we are to vanilla JavaScript and simple HTML. Svelte\
    \ doesn’t distort but enhances existing code. The following colorization visualizes\
    \ this. Everything that’s blue is regular JavaScript, everything that’s green\
    \ is regular HTML, and everything that’s orange is Svelte syntax.\n\n![Syntax\
    \ colorization](Images/syntax-colorization.png)"
