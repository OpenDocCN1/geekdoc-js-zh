  trans: "\n我们在 `AuthOnly.svelte` 中执行了同样的操作，在那里调用了 `login` 函数：\n\n```svelte\n<script>\n\
    \    import { user, login } from './user';\n    let authenticated = user.loggedIn;\n\
    </script>\n\n{#if authenticated}\n    <p>\n        超级秘密内容！\n    </p>\n{:else}\n\
    \    <button on:click={() => login()}>登录</button>\n{/if}\n```\n\n这在开始时会正确显示未登录状态，但我们不知为何无法让登录状态回传到组件中。为什么呢？根结底，这在\
    \ Svelte 文件内部的工作原理不是一样的吗？原因是 Svelte 编译器只查看 Svelte 文件来执行转换。JavaScript 文件则保持原样。此外，\
    \ JavaScript 文件内部的语义是不同的；它与视图层没有直接连接。因此，我们某种程度上需要显式地将状态表达为一个随时间变化的的对象，Svelte 组件可以对其做出响应。这就是\
    \ Svelte store（存储）大显身手的地方。\n\n## 介绍 Writable Stores\n\nSvelte 提供了一个非常简单的 API 来初始化和更新\
    \ store。`store` 是一个存储（故名如此）值（也称为状态）的东西，其他人可以对其进行订阅，并在该 store 的值更新时接收通知。\n\nSvelte\
    \ store API 的核心是 `writable` 函数，它提供了这种功能。调用 `writable` 函数时传入初始状态，它会返回一个包含 `set`、`update`\
    \ 和 `subscribe` 方法的对象。`set` 被调用时传入新的期望状态。`update` 调用时传入一个函数，该函数获取当前状态并预期返回下一个状态。`subscribe`\
    \ 调用时传入一个回调函数，该函数每当状态改变时就会被调用，并返回一个可以用来取消订阅的函数：\n\n```javascript\nimport { writable\
    \ } from \"svelte/store\";\n\nconst store = writable(\"initial value\");\n\nconst\
    \ unsubscribe = store.subscribe((value) =>\n  console.log(\"the current value\
    \ is \" + value)\n);\n\nstore.set(\"new value\");\n\nstore.update((value) => value\
    \ + \" 2\");\n\nunsubscribe();\n\nstore.set(\"another value\");\n```\n\n在上面的代码段中，值首先是\
    \ `\"initial value\"`，然后是 `\"new value\"`，最后是 `\"new value 2\"`。所有这些字符串都被记录了，因为\
    \ `subscribe` 回调函数每次被调用并将其记录下来。`subscribe` 函数返回一个 `unsubscribe` 函数。在调用它之后，对 store\
    \ 的更新——在本例中为 `\"another value\"`——将不再被记录。如果你熟悉 RxJS，这个 API 可能会看起来很熟悉，事实上，该 API\
    \ 紧遵循观察者（observables）原则。\n\n让我们把 `writable` 应用到我们的用例：\n\n```javascript\nimport\
    \ { writable } from \"svelte/store\";\nexport let user = writable({ loggedIn:\
    \ false });\nexport function login() {\n  user.set({ loggedIn: true, name: \"\
    Dr. Svelte\" });\n}\n```\n\n我们更改了 JavaScript 文件中的代码，并用 `writable` 包裹了状态。这意味着我们需要调整\
    \ Svelte 组件来订阅该状态。这是在 `Topbar.svelte` 中的第一次尝试：\n\n```svelte\n<script>\n  import\
    \ { user } from './user';\n  import { onDestroy } from 'svelte';\n  let _user;\n\
    \  const unsubscribe = user.subscribe(u => _user = u);\n  onDestroy(unsubscribe);\n\
    </script>\n\n<div>\n    {_user.name || '未登录'}\n</div>\n\n<!-- style... -->\n```\n\
    \n这起作用了！如果在 `AuthOnly.svelte` 内部按下 `login`，我们将在顶部栏看到“Dr. Svelte”的名字。不过，这个解决方案有点模板化：我们必须订阅\
    \ store，将其赋值给本地变量，并记住在组件销毁时取消订阅。我们能做得更好吗？这又是 Svelte 的大优势大用武之地：它是一个编译器。既然编译器无论会将\
    \ Svelte 文件转换为 JavaScript 文件，它也可以进行转换以消除这些订阅的模板代码。我们只需要在 store 前面加一个美元符号 `$`，Svelte\
    \ 就会处理其余工作：\n\n```svelte\n<script>\n  import { user } from './user';\n</script>\n\
    \n<div>\n    {$user.name || '未登录'}\n</div>\n\n<!-- style... -->\n```\n\n就像响应式语句（我们在第\
    \ 3 部分中介绍过）一样，美元符号被用于某些响应式的 Svelte 魔法。在 Svelte 文件中，禁止在变量名前前声明（但不使用）美元符号。相反，它们是给编译器的信号，用于为我们生成之前手动编写的所有订阅模板代码。这在更新\
    \ store 时也有效。如果我们在 Svelte 组件内部编写 `$user.name = \"Dr. Dollarsign` 或 `$user = {\
    \ loggedIn: false }`，这会被 Svelte 编译器转换为 store 更新。很酷！但请注意，无法使用 `$` 语法订阅未在顶层创建的 store（导入是顶层的，所以那没问题）。我们也无法订阅嵌套在对象内部的\
    \ store：我们首先需要将其提取到顶层变量中。这些局限性值得记在心里，但你可能很少会遇到它们。\n\n![Store 编译输出](img/svelte4-store-compilation.png)\n\
    \n通过美元符号语法订阅 store 不仅适用于 Svelte stores。每个满足 store 契约的对象（换句话说，提供了 `subscribe` 方法）都可以以这种方式使用。例如，如果你倾向于使用\
    \ RxJS，你可以使用完全相同的 `$user` 语法来订阅观察者。我们可以利用这一点来创建自己的封装好的用户 API。现在，每个人都能直接更新用户状态，因为我们暴露了整个\
    \ `writable`。为了确保每个使用用户状态的人都通过 API 来更新状态，我们可以这样创建自己的 store：\n\n```javascript\n\
    import { writable } from \"svelte/store\";\n\nlet _user = writable({ loggedIn:\
    \ false });\n\nfunction login() {\n  _user.set({ loggedIn: true, name: \"Dr. Svelte\"\
    \ });\n}\n\nexport const user = {\n  subscribe: _user.subscribe,\n  login,\n};\n\
    ```\n\n然后我们像这样调整 `AuthOnly.svelte` 组件：\n\n```svelte\n<script>\n  import { user\
    \ } from './user';\n  $: authenticated = $user.loggedIn;\n</script>\n\n{#if authenticated}\n\
    \    <p>\n        超级秘密内容！\n    </p>\n{:else}\n    <button on:click={() => user.login()}>登录</button>\n\
    {/if}\n```\n\n我们可以继续使用 `$user` 语法，并通过该对象的方法来更新状态。像 `$user.loggedIn = true` 或 `user.set({\
    \ loggedIn: true })` 这样的操作不再可行，因为 `writable` 的 `set` 方法不再暴露。还要注意我们可以在 `<script>`\
    \ 标签和响应式语句中使用 `$user`。它是可以在组件中任何地方使用的变量。\n\n下面的截图可视化了我们示例应用的状态流。\n\n![Store 流程](img/svelte4-store-flow.png)\n\
    \n## Readable Stores\n\n有时我们可能想要创建一个无法从外部更新的 store。一个用例是确保没有人（不包括文件内部）从外部更新 store，因为它们应该是自包含的——例如一个每秒更新一次且无法从外部重置或调整的时钟。在这种情况下，可以使用\
    \ `readable`：\n\n```javascript\nimport { readable } from \"svelte/store\";\n\n\
    const time = readable(null, (set) => {\n  set(new Date());\n\n  const interval\
    \ = setInterval(() => {\n    set(new Date());\n  }, 1000);\n\n  return () => clearInterval(interval);\n\
    });\n```\n\n上面的代码创建一个没有 `set` 或 `update` 方法只有 `subscribe` 方法的 store。我们无法从外部设置。`readable`\
    \ 的初始状态通过第一个参数设置；第二个参数是一个在订阅计数从 0 变为 1 时调用的函数。它被传递一个 `set` 函数，我们可以用它从内部更新状态——在本例中，每秒更新当前时间。我们可以返回一个在订阅计数从\
    \ 1 变为 0 时调用的函数。在这种情况下，我们清理了定时器。\n\n"
- fmt: "\nOnce we start using stores, we may also want to combine some of them or\
    \ just derive a different value from a store. In this case, we can reach for `derived`.\
    \ Let’s suppose our username is split into surname and lastname, but we want to\
    \ show the combined name in various places of the app. In order not to repeat\
    \ ourselves, we use a `derived` store to put them together:\n\n```svelte\nimport\
    \ { derived } from \"svelte/store\";\nimport { user } from \"./user\";\n\nexport\
    \ const username = derived(\n  user,\n  (_user) => _user.surname + \" \" + _user.lastname\n\
    );\n```\n\nIn its simplest form, `derived` accepts a store or an array of stores\
    \ as the first argument and a function that gets the current value of this or\
    \ these stores as the second argument. For more complex use cases, the function\
    \ also provides a second parameter—`set`—which we can use to update the `derived`\
    \ state when appropriate. In this case, the return value can be a function that’s\
    \ called when the subscriber count goes from one to zero. We can also pass a third\
    \ argument to `derived` in this case, which marks the initial value.\n\nHere’s\
    \ an example:\n\n```svelte\nimport { derived } from \"svelte/store\";\n// ...\n\
    \nexport const itemDetails = derived(\n  itemId,\n  (_itemId, set) => {\n    getItemDetails(_itemId).then((details)\
    \ => set(details));\n  },\n  \"Loading...\"\n);\n```\n\nThe code above creates\
    \ a `derived` store that retrieves details about an item from its ID every time\
    \ that ID changes, and shows `\"Loading...\"` initially.\n\n## Wrapping Up\n\n\
    That’s it! In this fourth tutorial of the series, we took a deep dive into Svelte\
    \ stores. We learned that we can use `writable` to make our state available for\
    \ use across Svelte components, which then can react to updates by just appending\
    \ a dollar sign to the variable name.\n\nWe saw that it doesn’t have to be a Svelte\
    \ store. Instead, every object that implements the `subscribe` contract can be\
    \ used like that in a Svelte component. This allows us to use other libraries\
    \ like `RxJS` or create custom objects. Svelte stores help us manage state, providing\
    \ the primitives for a robust state management solution.\n\nWe also took a look\
    \ at `readable` stores, which help us to create state that’s not changeable from\
    \ the outside, and `derived` stores, which provide options for creating a derived\
    \ state from incoming stores. The core of the Svelte store API is dead simple\
    \ to understand, but scales for more complex use cases.\n\nYou’re now ready to\
    \ create stores to handle state that’s shared across different components! In\
    \ the next chapter, we’ll look at more component interactions apart from using\
    \ stores to create robust applications.\n\n# Chapter 5: Component Interaction\
    \ Concepts\n\nComponents are at the core of frontend frameworks like `Svelte`.\
    \ They are the primary unit for organizing and implementing your view layer. Components\
    \ encapsulate a specific UI and/or behavior—such as the look of a button, a list\
    \ containing arbitrary elements, or a specific section of a page.\n\nIn the first\
    \ half of this book, we focused on the ins and outs of one component. We looked\
    \ at template syntax in Chapter 2, and at reactive statements in Chapter 3. In\
    \ Chapter 4, we looked at Svelte stores, which provide a handy API for implementing\
    \ state management and which do cross-component updates. There are, of course,\
    \ more ways to integrate components with each other—and we’ll look into them in\
    \ this tutorial. After reading through this chapter, you’ll be able to use the\
    \ right component API for the right job.\n\n## Using Other Components\n\nThe key\
    \ part to organizing your code is to put each part in the most appropriate location.\
    \ This means writing and reusing components. We can use another component by importing\
    \ it as a default import and then use it like a regular element tag inside the\
    \ template:\n\n```svelte\n<script>\n  import SomeOtherComponent from \"../somewhere/else/SomeOtherComponent.svelte\"\
    ;\n</script>\n\n<SomeOtherComponent></SomeOtherComponent>\n<!-- if the component\
    \ has no children, you can also selfclose it: -->\n<SomeOtherComponent />\n```\n\
    \n### Naming Imports\n\nSince you import the component through its default export,\
    \ you can name the import any way you want. It doesn’t have to the same as the\
    \ file name, but it’s best practice to do so.\n\n## Passing Stuff to Components\
    \ through Properties\n\nMany components receive some kind of input that they need\
    \ in order to function. Consider a list that should show text entries below each\
    \ other and which you want to use in various places. The list then would be a\
    \ component property, or in other words, an input. In Svelte, these properties\
    \ are defined through `export let <propertyName>`, as seen here:\n\n```svelte\n\
    <script>\n  export let items;\n</script>\n\n<ul>\n  {#each items as item}\n  \
    \  <li>{item}</li>\n  {/each}\n</ul>\n```\n\nAt first, this may take some getting\
    \ used to, since `export` is normally used to make something importable somewhere\
    \ else, but it will soon feel like second nature.\n\nProperties without an initializer\
    \ are treated as mandatory. Optional properties have an initializer. Let’s say\
    \ we want to optionally add support for reloading the list through the click of\
    \ a button, but only if the component user explicitly turns it on. With an optional\
    \ property, it would look like this:\n\n```svelte\n<script>\n  export let items;\n\
    \  export let showReload = false;\n</script>\n\n{#if showReload}\n  <button>Reload\
    \ list</button>\n{/if}\n<ul>\n  {#each items as item}\n    <li>{item}</li>\n \
    \ {/each}\n</ul>\n```\n\n## Reacting to Events\n\nWe now have a list with an optional\
    \ `reload`. The first option would be to use callback props like you’d in React—passing\
    \ a function as input:\n\n```svelte\n<script>\n  export let items;\n  export let\
    \ showReload = false;\n  export let reload;\n</script>\n\n{#if showReload}\n \
    \ <button on:click={reload}>Reload list</button>\n{/if}\n<ul>\n  {#each items\
    \ as item}\n    <li>{item}</li>\n  {/each}\n</ul>\n```\n\nThe usage would look\
    \ like this:\n\n```svelte\n<script>\n  import List from \"./List.svelte\";\n \
    \ let list = ['Learn Svelte', 'Create great things'];\n  function reloadList()\
    \ {\n      // ...\n  }\n</script>\n\n<List items={list} showReload={true} reload={reloadList}\
    \ />\n```\n\nThe second option is to create an event dispatcher and dispatch a\
    \ custom event from it. For this, we import `createDispatcher` from `svelte` and\
    \ call the resulting function where appropriate:\n\n```svelte\n<script>\n  import\
    \ { createDispatcher } from \"svelte\";\n\n  export let items;\n  export let showReload\
    \ = false;\n\n  const dispatch = createDispatcher();\n</script>\n\n{#if showReload}\n\
    \  <button on:click={() => dispatch(\"reload\")}>Reload list</button>\n{/if}\n\
    <ul>\n  {#each items as item}\n    <li>{item}</li>\n  {/each}\n</ul>\n```\n\n\
    The first argument to the `dispatch` function is the event name. The second (optional)\
    \ argument is the payload. Listening to this event is similar to listening to\
    \ DOM events; we add `on:` in front of the event name:\n\n```svelte\n<script>\n\
    \  import List from \"./List.svelte\";\n  let list = ['Learn Svelte', 'Create\
    \ great things'];\n  function reloadList() {\n      // ...\n  }\n</script>\n\n\
    <List items={list} showReload={true} on:reload={reloadList} />\n```\n\nThe last\
    \ option—in this case—is to just bubble the `click` event of the button. An event\
    \ is bubbled if you write `on:<eventName>` without handling the event:\n\n```svelte\n\
    <script>\n  export let items;\n  export let showReload = false;\n  export let\
    \ reload;\n</script>\n\n{#if showReload}\n  <button on:click>Reload list</button>\n\
    {/if}\n<ul>\n  {#each items as item}\n    <li>{item}</li>\n  {/each}\n</ul>\n\
    ```\n\nYou then would listen to `on:click` on the `List` component in the parent.\
    \ While this works, in this case it’s better to use one of the first two options,\
    \ as an event name like `reload` better communicates what was clicked and what\
    \ should happen in response to it. Whether you use callback props or custom events\
    \ comes down to personal preference.\n\n![Properties in, events out](Images/svelte5-input-events.png)\n\
    \n## Composing the UI with Slots\n"
