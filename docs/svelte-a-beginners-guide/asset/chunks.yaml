  trans: "\n\n![](img/svelte1.jpg)\n\n# Svelte：初学者指南\n\nCopyright © 2022 SitePoint\
    \ Pty. Ltd.\n\n电子书 ISBN: 978-1-925836-48-6\n\n* **作者：** Simon Holthausen-Kircher\n\
    * **系列编辑：** Oliver Lindberg\n* **产品经理：** Simon Mackie\n* **Ignatius Bagus：** Tim\
    \ Boronczyk\n* **英语编辑：** Ralph Mason\n* **封面设计：** Alex Walker\n\n## 权利声明\n\n保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段复制、存储在检索系统中或传输本书的任何部分，但批判性文章或评述中的简短引用除外。\n\
    \n## 免责声明\n\n作者和出版者已尽一切确保书中信息的准确性。然而，本书包含的信息按现状出售，不提供任何明示或暗示的保证。作者、SitePoint Pty.\
