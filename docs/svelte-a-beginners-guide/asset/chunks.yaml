    In `svelte.config.js`, add this:\n\n```\nconst sveltePreprocess = require(\"svelte-preprocess\"\
    );\n\nmodule.exports = {\n  preprocess: sveltePreprocess(),\n};\n```\n\nIn `jest.config.js`,\
    \ add this:\n\n```\nmodule.exports = {\n  testEnvironment: \"jsdom\",\n  transform:\
