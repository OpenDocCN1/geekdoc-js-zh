  trans: "\n有了这些工具，你现在准备好为你的 HTML 丰富动态内容和行为了！在下一章中，我们将介绍响应式语句（reactive statements）以及它们如何帮助我们推导出计算变量或响应变量的变化，以及\
    \ Svelte 如何再次利用其独特优势——作为编译器——来让编写这些代码的开发者体验尽可能良好。\n\n# 第 3 章：响应式语句\n\n到目前为止，我们已经了解到\
    \ `Svelte` 能够将组件内部普通的变量赋值编译为能够自动更新视图的内容。每当你给一个变量赋值时，`Svelte` 都会注意到这一点，并为下一次浏览器绘制调度一次重新渲染（rerender）。随后我们仔细查看了组件语法，了解了如何向\
    \ HTML 代码中添加动态行为。在本章中，我们将关注 `<script>` 标签的内容，并查看我们如何响应变量的变化来运行其他代码。\n\n你是否曾经需要对变量的变化做出响应？可能每天都以某种形式需要过。`Svelte`\
    \ 已经通过重新渲染视图来很好地响应变量的变化了。但如果我们我们需要在 `<script>` 标签内部显式地对变量变化做出响应呢？例如：计数翻倍、在 ID\
    \ 变化时从后端获取新对象——这里有很多用例。这就是响应式语句大显身场的地方。它们看起来像：\n\n```javascript\n<script>\n  //\
    \ 响应式声明\n  $: foo = bar;\n  // 响应式语句\n  $: {\n      something = somethingElse;\n\
    \  }\n</script>\n```\n\n在语法上，响应式语句通过美元符号加冒号——`$:` 来表示。这实际上是有效的 JavaScript 语法。最初，它表示一个标签语句（labelled\
    \ statement）——`labelname : statement`——你可以通过 `continue` 或 `break` 告诉 JavaScript\
    \ 跳到该标签。但由于没有人使用它，`Svelte` 填补了这个空白，用来在语法上表示它的响应式语句。这意味着你不能在 `Svelte` 文件中使用名为 `$`\
    \ 的标签语句，但由于你很可能也不会使用任何类型的标签语句，这不会产生任何影响。\n\n解决了语法问题，让我们来看看响应式语句的语义含义，它们有两种形式：响应式声明（reactive\
    \ declarations）和响应式语句（reactive statements）。\n\n## 响应式声明\n\n`响应式声明` 定义了一个值依赖于其他变量的变量。一个简单的响应式声明可能像这样：\n\
    \n```javascript\n<script>\n  let count = 0;\n  $: doubled = count * 2;\n</script>\n\
    \n<p>Count: {count}</p>\n<p>Doubled: {doubled}</p>\n<button on:click={() => count\
    \ += 1}>Increase count</button>\n```\n\n这个响应式声明定义了变量 `doubled`，它表示为变量 `count`\
    \ 的两倍。每当 `count` 变化时，`Svelte` 都会计算 `doubled` 的新值。将响应式声明想象成 Excel 单元格的公式：你声明式地定义结果，`Svelte`\
    \ 处理剩下的部分——但请注意稍后我们将提到的注意事项。响应式声明也可以依赖其他响应式声明，所以你可以写 `$: quadrupled = doubled\
    \ * 2`。\n\n## 响应式语句\n\n`响应式语句`并不定义计算变量。相反，它定义了一个当依赖项变化时应该重新运行的块。在响应式语句块内部为了计算结果而被读取（*而不是*写入）的每一个变量都是依赖项。响应式语句看起来像这样：\n\
    \n```javascript\n<script>\n  let count = 0;\n  let prevCount = 0;\n  let countWentUp\
    \ = false;\n  // 语句\n  $: console.log('Count is' + count);\n  // 块语句\n  $: {\n\
    \      countWentUp = prevCount < count;\n      prevCount = count;\n  }\n</script>\n\
    \n<p>Count: {count}</p>\n<p>Count went {countWentUp ? 'up' : 'down'}</p>\n<button\
    \ on:click={() => count += 1}>Increase count</button>\n<button on:click={() =>\
    \ count -= 1}>Decrease count</button>\n```\n\n如你所示，响应式语句本质上是在特定时间重新运行的任意代码。在上面的示例中，`console.log`\
    \ 语句每当 `count` 变化时都会重新运行。在块语句内部，我们响应 `count` 的变化来更新两个变量。首先，我们将之前的计数与当前计数进行比较，以确定计数增加还是减少，然后我们将当前计数存储为下一次运行的新之前的计数。你可以使用响应式语句来表达副作用，或者运行那些不适合简单的声明语句的、或涉及多个变量的计算。本质上，响应式语句是响应式声明的超集：你可以将每个响应式声明重写为响应式语句。以下代码在语义角度上是完全相同的：\n\
    \n```javascript\n<script>\n  let something = 'something';\n  // 这 ...\n  $: declaration\
    \ = something;\n  // 等于这个\n  let statement;\n  $: {\n    statement = something;\n\
    \  }\n</script>\n```\n\n## 执行顺序\n\n你现在可能会问，这些响应式语句按什么顺序运行。直觉上，它们与它们使用的内容之间存在某种顺序是合理的，但具体是怎样的呢？答案很简单：在编译时，`Svelte`\
    \ 会查看响应式语句的*直接*代码并检查每个被*读取*的变量。这些是我们在上一节中简要提到过的依赖项。根据这些依赖项，`Svelte` 决定执行顺序。\n\n\
    从数学上来说，这被称为变量的**拓扑排序**（topological ordering）。如果 `Svelte` 无法通过这种方式确定顺序——例如，因为语句没有依赖项——它们将按照你写的顺序执行：\n\
    \n```javascript\n<script>\n  let count = 0;\n  $: quadrupled = doubled * 2; //\
    \ 第 2 次运行\n  $: doubled = count * 2; // 第 1 次运行\n  $: console.log(quadrupled);\
    \ // 第 3 次运行\n  $: console.log(count); // 最后运行\n</script>\n```\n\n可能会出现某些情况，我们需要从依赖项中隐藏一个变量。在下面的任意（但简单）的示例中，我们希望\
    \ `multiplied` 只在我们增加 `count` 时更新，而在改变 `multiplyBy` 时不更新。我们通过将变量 `multiplyBy`\
    \ 移动到函数中从直接依赖项中隐藏它来实现：\n\n```javascript\n<script>\n  let count = 0;\n  let multiplyBy\
    \ = 2;\n\n  $: multiplied = multiply(count);\n\n  function multiply(value) {\n\
    \      return value * multiplyBy;\n  }\n</script>\n```\n\n现在，`multiplied` 只在 `count`\
    \ 变化时改变，而当 `multiplyBy` 变化时不会改变。这之所以有效，是因为 `Svelte` 只查看响应式语句的*直接*代码；它不会追踪函数调用。\n\
    \n反之也可能成立：我们可能希望即使在一个不直接导致结果的变量发生变化时也重新触发响应式语句。在这种情况下，我们可以通过让该变量出现在响应式语句中来添加该变量：\n\
    \n```javascript\n<script>\n  // ...\n  $: variableWhichShouldTriggerRecalculation,\
    \ retriggerCalculation();\n  // ...\n</script>\n```\n\n由于响应式语句是普通的 JavaScript，你还可以使用\
    \ `if`-块来对语句的重新运行时进行更多控制，仅在满足特定条件时才执行其主体。\n\n"
- fmt: "\n```html\n<script>\n  // ...\n  $: if (someVariable < 100) {\n    // ...\n\
    \  }\n  // ...\n</script>\n```\n\nThe above code executes whenever `someVariable`\
    \ or anything inside the reactive statement is updated, but will only go into\
    \ the body of the statement when the `if` condition is met. You can use this as\
    \ an alternative to hiding variables from the statement, and also use it to rerun\
    \ the statement when a variable not used in the body changes by placing it as\
    \ a dummy condition in the `if` statement.\n\nMost of the time, you don’t need\
    \ to care about the dependencies. This is a relief in comparison to `React`, where\
    \ you need to be very explicit about the dependencies in the context of hooks.\
    \ In Svelte, most of the time it “just works” like you expect it to, and if you\
    \ need to fine-tune execution behavior, you can easily adapt your code by using\
    \ one of the techniques shown above.\n\nLet’s summarize these findings by looking\
    \ at one more example. The screenshot below shows in which order the reactive\
    \ statements are run. The arrows show the dependency on other reactive statements.\
    \ `multiplied` runs first because it depends on `count`. `doubleMultiplied` runs\
    \ second because it depends on `multiplied`. `refreshDetails()` runs third because\
    \ it depends on `doubleMultiplied`. `console.log(count)` runs last because it’s\
    \ written after all other reactive statements and none of the other statements\
    \ needs it to run first. None of the statements rerun when `multiplyBy` changes\
    \ because none of them has a direct dependency on it.\n\n![Reactive Statements\
    \ Ordering](Images/execution-order.png)\n\n## Reactive Statements Are Run Once\n\
    \nOne thing that didn’t become clear from the previous sections but which might\
    \ become important is the execution timing of reactive statements. If a regular\
    \ variable is reassigned, Svelte will schedule an update for the next browser\
    \ paint. Between this scheduling and the paint is the time where reactive statements\
    \ are executed—but they’re only executed once. This means that, if a reactive\
    \ statement writes to a variable which a previously run reactive statement is\
    \ reading, that reactive statement will not be rerun. This prevents endless loops,\
    \ performance issues, and also makes certain reactive statements possible to write.\
    \ Let’s have a look at the reactive statement from above again:\n\n```html\n<script>\n\
    \  let count = 0;\n  let prevCount = 0;\n  let countWentUp = false;\n  $: {\n\
    \      countWentUp = prevCount < count;\n      prevCount = count;\n  }\n</script>\n\
    ```\n\nThis reactive statement reads `prevCount`, but it also writes to `prevCount`.\
    \ If the statement were to run more than once, this would mean it would get invalidated\
    \ immediately again, resulting in an infinite loop, and would also always assign\
    \ `false` to `countWentUp` in the end, which defeats its purpose. Just like with\
    \ the dependencies, most of the time this is nothing to care about, because reactive\
    \ statements feel very natural to write. But it’s good to keep in mind once you\
    \ get into more complex use cases.\n\n![No Rerun](Images/no-rerun.png)\n\n## Wrapping\
    \ Up\n\nThis tutorial introduced reactive statements. We can use them to react\
    \ to assignments of other variables to execute side effects or create computed\
    \ variables. Reactive statements are ordered in Svelte by looking at direct dependencies,\
    \ and then scheduled to run after a variable assignment. If an order can’t be\
    \ determined, they’re run in the order they’re declared. We can use this to our\
    \ advantage to hide variables from the dependencies by moving them into functions\
    \ or by adding additional variables to the statement to retrigger the execution\
    \ of that statement. Reactive statements won’t be rerun if a reactive statement\
    \ executed later during the same run updates a variable they depend on. With that\
    \ in mind, you’re now prepared to react to all the things!\n\nThis marks the end\
    \ of us solely focusing on the insides of one component. In the first chapter,\
    \ we learned that Svelte is a compiler offering some unique advantages, which\
    \ we also saw in this chapter, too. In the second chapter, we had a closer look\
    \ at the component syntax to see how to add dynamic behavior to our HTML code.\
    \ The next chapters will look at what we can do to integrate components with each\
    \ other. We’ll start by looking at Svelte stores, which provide us with a simple\
    \ yet powerful API for handling cross-component state in our application.\n\n\
    # Chapter 4: Stores\n\nSvelte’s reactivity inside Svelte components is intuitive\
    \ and easy. Because Svelte is a compiler, it can transform regular variable assignments\
    \ into something the UI will rerender when it changes (as we saw in Chapter 2).\
    \ Reactive assignments make derived or computed variables very easy (as we saw\
    \ in Chapter 3).\n\nOutside of Svelte components, we have a different mental model,\
    \ there’s no inherently connected UI layer to our code, and the Svelte compiler\
    \ won’t touch code outside of Svelte files. But what if we also want the goodies\
    \ of reactivity outside of Svelte components? What if we have global state that\
    \ lives inside a JavaScript file that many components should react to when it\
    \ changes? This is where Svelte stores come in. In this chapter, we’ll have a\
    \ close look at the store API, how to use it to build neatly encapsulated modules,\
    \ and how to easily use them inside Svelte components.\n\nAs a practical example\
    \ throughout this tutorial, let’s pick something that’s probably globally available\
    \ in almost all applications: user state. In this example, this state will consist\
    \ of whether or not the user is logged in, and, if they are logged in, their username.\
    \ There’s an area of the page that’s only visible to authenticated users, and\
    \ if they’re logged in, their username is visible in the top bar at all times.\n\
    \n![User App](Images/svelte4-app.png)\n\nThe app surely won’t win us any design\
    \ awards, but it helps us showcase the problem we have with global state in this\
    \ application. The root of the application looks like this:\n\n```html\n<script>\n\
    \    import Topbar from './Topbar.svelte';\n    import AuthOnly from './AuthOnly.svelte';\n\
    </script>\n\n<Topbar />\n<div>\n    <p>\n        This part of the page is always\
    \ visible\n    </p>\n</div>\n<<div>\n    <p>\n        This part is only visible\
    \ to logged in users\n    </p>\n    <AuthOnly />\n</div>\n\n<style>\n    div {\n\
    \        border: 1px solid blue;\n        padding: 5px 10px\n    }\n</style>\n\
    ```\n\nThat component uses other components. To do so, we import them as a default\
    \ import in the `<script>` tag. We can then use them by the same name as the default\
    \ import in the template. (We’ll look into component interaction more deeply in\
    \ Part 5 of this series.)\n\n`Topbar.svelte` looks like this:\n\n```html\n<div>\n\
    \    How to get the username in here?\n</div>\n\n<style>\n    div {\n        background:\
    \ lightgrey;\n        padding: 5px;\n        text-align: right;\n    }\n</style>\n\
    ```\n\nAnd `AuthOnly.svelte` looks like this:\n\n```html\n<script>\n    let authenticated\
    \ = false;\n</script>\n\n{#if authenticated}\n    <p>\n        Super secret stuff!\n\
    \    </p>\n{:else}\n    <button on:click={() => authenticated = true}>Log In</button>\n\
    {/if}\n```\n\nThe components `Topbar` and `AuthOnly` both need access to the user\
    \ state; passing it via properties is not an option. In this simple example, we\
    \ only need to pass the user state down one component, but in reality this will\
    \ almost never be the case. So we need some other place to share the state. Additionally,\
    \ `AuthOnly` needs to update the state to log in the user. Where do we put the\
    \ state now? It’s probably best to put it inside a JavaScript file that exports\
    \ the state so everyone can access it. Let’s try that!\n\n## A First Attempt\n\
    \nWe create a `user.js` with the following content:\n\n```javascript\nexport let\
    \ user = { loggedIn: false };\nexport function login() {\n  user = { loggedIn:\
    \ true, name: \"Dr. Svelte\" };\n}\n```\n\nWe also import the `user` state in\
    \ `Topbar.svelte`:\n\n```html\n<script>\n  import { user } from './user';\n</script>\n\
    \n<div>\n    {user.name || 'Not logged in'}\n</div>\n\n<!-- style... -->\n```\n"
