    \ statements and how they can help us derive computed variables or react to variable\
    \ changes, and how Svelte again uses its unique advantage—being a compiler—to\
    \ make the developer experience of writing these as good as possible.\n\n# Chapter\
    \ 3: Reactive Statements\n\nSo far, we've learned that Svelte is able to compile\
