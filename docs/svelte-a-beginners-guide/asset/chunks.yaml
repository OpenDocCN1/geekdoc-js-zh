    \ get to later. Reactive declarations can also depend on other reactive declarations,\
    \ so you could write `$: quadrupled = doubled * 2`.\n\n## Reactive Statements\n\
    \nA **reactive statement** doesn’t define a computed variable. Instead, defines\
    \ a block that should be rerun whenever its dependencies change. Every variable\
    \ that appears inside the block of a reactive statement and is read (*not* written\
    \ to)—in order to compute the outcome—is a dependency. A reactive statement looks\
    \ like this:\n\n```\n<script>\n  let count = 0;\n  let prevCount = 0;\n  let countWentUp\
    \ = false;\n  // Simple statement\n  $: console.log('Count is' + count);\n  //\
    \ Block statement\n  $: {\n      countWentUp = prevCount < count;\n      prevCount\
    \ = count;\n  }\n</script>\n\n<p>Count: {count}</p>\n<p>Count went {countWentUp\
    \ ? 'up' : 'down'}</p>\n<button on:click={() => count += 1}>Increase count</button>\n\
    <button on:click={() => count -= 1}>Decrease count</button>\n```\n\nAs you can\
    \ see, a reactive statement is essentially an arbitrary bit of code that should\
    \ be rerun at certain times. In the above example, the `console.log` statement\
    \ is rerun every time the `count` changes. Inside the block statement, we update\
    \ two variables in reaction to a `count` change. First, we compare the previous\
    \ count with the current count to determine whether the count went up or down,\
    \ and then we store the current count as the new previous count for the next run.\
