  trans: "\n列表现在已经显示了，我们可以重新加载它，但列表项的样式是固定的；我们无法从外部更改它。为了改变这一点，我们使用了插槽（slots）。`slot`\
    \ 就像一个占位符，其内容由父组件决定。让我们先在列表组件中定义插槽：\n\n```\n<script>\n  // ...\n</script>\n\n\
    {#if showReload}\n  <button on:click>Reload list</button>\n{/if}\n<ul>\n  {#each\
    \ items as item}\n    <li>\n      <slot {item}>\n        {item}\n      </slot>\n\
    \    </li>\n  {/each}\n</ul>\n```\n\n`<slot>` 标签标记该区域为父组件内容的放置位置。`{item}` 属性意味着父组件在提供\
    \ UI 时可以使用 `item` 属性。否则，我们没有办法在父组件中输出项的文本。`<slot>` 内部的内容是它的回退内容（fallback content），以防父组件没有提供它自己的\
    \ UI。回退内容是可选的，你并不需要提供它。\n\n让我们在父组件中使用组件插槽：\n\n```svelte\n<script>\n  import List\
    \ from \"./List.svelte\";\n  // ...\n</script>\n\n<List items={list} showReload={true}\
    \ on:reload={reloadList} let:item>\n  <b>{item}</b>\n</List>\n```\n\n我们选择简单地将项的文本放入\
    \ `<b>` 标签中，使其加粗。插槽的 UI 位于组件的标签内部。我们可以通过编写 `let:item` 来使用传递给插槽的 `item` 属性。如果想重命名该属性，可以写\
    \ `let:item={anotherVariableName}`。\n\n上面的插槽是默认插槽。我们还可以使用具名插槽（named slots）来提供多个插槽，它们可以出现在不同的区域。给插槽命名只需要写\
    \ `<slot name=\"desiredName\" />`，而使用它同样一样，只需在父组件的元素上添加 `slot=\"desiredName\"\
    ` 属性，该元素就会进入特定的插槽。如果有一个“空列表占位符”插槽，它看起来会像这样：\n\n```html\n<!-- ... -->\n<List items={list}\
    \ showReload={true} on:reload={reloadList} let:item>\n  <b>{item}</b>\n  <!--\
    \ 如果组件传递了插槽属性，你也可以在具名插槽上使用 let:xx -->\n  <p slot=\"empty\">列表为空</p>\n</List>\n\
    ```\n\n下面的截图可视化了插槽功能。\n\n![可视化的插槽示例](img/svelte5-slots.png)\n\n## 使用 Module 脚本管理相同组件的实例\n\
    \n列表的重新加载功能非常成功——确实很大，以至于老板现在要求在页面顶部某处添加一个“全部刷新”按钮。对于这种情况——即我们需要管理和/或协调多个相同类型的组件实例，或者在组件生命周期之外运行代码但将其与组件放在一起——我们可以使用\
    \ `module` 脚本标签。这是另一个带有额外 `context=\"module\"` 属性的脚本标签。该脚本标签内部的代码只运行一次且立即执行。可以将其看作一个独立的\
    \ JavaScript 文件，但它与 Svelte 组件位于同一处。让我们用它来实现“全部刷新”的行为：\n\n```svelte\n<script context=\"\
    module\">\n  let reloads = new Set();\n  export function reloadAll() {\n    reloads.forEach((reload)\
    \ => reload());\n  }\n</script>\n\n<script>\n  import { createEventDispatcher,\
    \ onMount } from \"svelte\";\n\n  export let items;\n  export let showReload =\
    \ false;\n\n  const dispatch = createEventDispatcher();\n\n  onMount(() => {\n\
    \    const reload = () => dispatch(\"reload\");\n    reloads.add(reload);\n  \
    \  return () => reloads.delete(reload);\n  });\n</script>\n\n<!-- ... -->\n```\n\
    \n我们创建了一个包含所有“刷新” `dispatch` 函数的 `Set`。每当创建一个列表实例时，我们就封装 `dispatch` 函数并将其添加到 `Set`\
    \ 中。当组件实例销毁时，我们将其移除。现在剩下的工作是在实现“全部刷新”按钮的地方使用导出的 `reloadAll` 函数：\n\n```svelte\n\
    <script>\n  import { reloadAll } from \"../somewhere/List.svelte\";\n</script>\n\
    \n<button on:click={reloadAll}>全部刷新</button>\n```\n\nSvelte 组件的默认导入是组件构造函数本身。具名导入是从模块脚本导出的内容。这样，我们就可以轻松地导入\
    \ `reloadAll` 并在适当调用它。\n\n![模块脚本与实例脚本的关系](img/svelte5-module-script.png)\n\n你可能偶尔需要模块脚本，但当你需要时，它们将非常有用，允许与你的组件进行命令式交互，或者用于管理和协调多个相同类型的实例。另一个例子——来自\
    \ Svelte 官方教程——涉及到多次渲染音频播放器组件，但只允许其中一个同时播放。这也可以通过模块脚本轻松实现。\n\n## 使用 Context 为组件树提供状态\n\
    \n在“全部刷新”功能上线一天后，老板意识到实际上刷新所有列表可能不是个好主意，而是应该刷新特定的列表。判断页面上某个列表区域是否支持刷新的计算是在这些列表的根部完成的。这被称为属性钻取（property\
    \ drilling）。对于这种情况，向子组件提供上下文会非常有用。看起来如下：\n\n```svelte\n<!-- 在某个父组件中 -->\n<script>\n\
    \  import { setContext } from 'svelte';\n  setContext('partOfAll', someCalculationThatReturnsBoolean());\n\
    \  // ...\n</script>\n\n<!-- 在 List.svelte 中 -->\n<script>\n  import { getContext,\
    \ onMount } from 'svelte';\n  // ...\n  const isPartOfAll = getContext('partOfAll');\n\
    \  onMount(() => {\n    if (!isPartOfAll) {\n      return;\n    }\n    const reload\
    \ = () => dispatch(\"reload\");\n    reloads.add(reload);\n    return () => reloads.delete(reload);\n\
    \  });\n</script>\n```\n\n这两个函数——`setContext` 和 `getContext`——允许我们为提供组件的所有子组件提供特定内容。这类似于\
    \ React 中的 `useContext`、Vue 中的 `provide`/`inject` 或 Angular 中的服务。注意需要在组件初始化期间调用这些函数。你不能在生命周期后期或异步调用它们。\n\
    \n![上下文可视化](img/svelte5-context.png)\n\n在上面的示例中，我们使用字符串作为键，但也可以使用 `Symbol` 或其他保证唯一的类型。值可以是任何内容。在这个例中，它是一个简单的布尔值，但也可以是一个函数或\
    \ store。上下文和 store 是提供随时间变化且子组件能够做出响应的值良好方法。这是一个例子：\n\n```svelte\n<!-- 在某个父组件中\
    \ -->\n<script>\n  import { setContext } from 'svelte';\n  import { writable }\
    \ from 'svelte/store';\n  const count = writable(1);\n  setContext('count', count);\n\
    \  // ...\n</script>\n\n<!-- 在某个子组件中 -->\n<script>\n  import { getContext } from\
    \ 'svelte';\n  const count = getContext('count');\n</script>\n<p>计数是 {$count}</p>\n\
    ```\n\n如果你有全局可用的状态，你当然可以跳过使用上下文，直接从中心位置导入该状态。这就是我们在应用程序的上一个部分中使用 store 完成的工作。\n\
    \n## 总结\n\n这是一个很长的篇章！在本教程中，我们学习了许多组件交互概念。总结一下：\n\n*   使用组件属性和事件来实现基础组件交互。\n\n\
    *   当你需要从父组件在子组件的特定位置提供自定义 UI 时，请使用插槽。\n"
- fmt: "\n*   Use the `<script context=\"module\">` tag when you need to manage or\
    \ coordinate multiple instances of the same component or export imperative logic\
    \ related to them.\n*   Use `setContext` and `getContext` when you need to provide\
    \ certain values for a certain sub part of the app and you want to avoid property\
    \ drilling.\n\nWith all these tools at your disposal, you’re now ready to structure\
    \ and organize your components in the best way possible.\n\nYou’re now ready to\
    \ write full-blown applications in Svelte. In the last chapter, we’ll look into\
    \ testing these applications. We’ll look into the different levels at which we\
    \ can test, as well as what it means to make your apps testable.\n\n# Chapter\
    \ 6: Testing Applications\n\nWe’ve come quite a long way. We started by looking\
    \ at Svelte’s history, as well as the first steps of writing an application with\
    \ it. The tools for building such an application were then introduced in more\
    \ detail. We took a deep dive into the template syntax of Svelte, which is an\
    \ extension of HTML. We saw how to use reactive statements to react to variable\
    \ changes—for example, in order to create computed variables. We then looked at\
    \ Svelte stores, which can be used to share state across multiple components,\
    \ and we learned about various ways to integrate components with each other.\n\
    \nAll this empowers us to create Svelte applications that scale. But how do we\
    \ test those applications? This is what we’ll look at in this final chapter.\n\
    \n## The Testing Pyramid\n\nBefore we jump into the technical details, let’s first\
    \ take a step back and think about the ways we can test an application. As it\
    \ turns out, there’s not one true way to do this. Rather, there are different\
    \ layers of testing. There’s actually a name for this, which you may have come\
    \ across already: “the testing pyramid”.\n\n![Testing Pyramid](Images/testing-pyramid.png)\n\
    \nThe `testing pyramid` helps us classify our various ways of testing.\n\nAt the\
    \ bottom, there are `unit tests`, which look only at a tiny part of our application\
    \ at a time—such as testing a specific function in isolation.\n\nAbove these are\
    \ `integration tests`, which test a small to medium part of our application in\
    \ combination. While unit tests are great for testing things like whether or not\
    \ a function returns the right thing, they don’t tell you whether that function\
    \ is actually used in the right way. All your unit tests could pass, but the interaction\
    \ of the parts with each other you tested might be wrong. Integration tests help\
    \ surface these bugs.\n\nThe top-most layer in the pyramid are `end-to-end tests`\
    \ (abbreviated with E2E), which take the integration tests one step further by\
    \ not only running parts of the application, but also running the whole application\
    \ and testing through the eyes of the end user. The challenge is to get the whole\
    \ application running under test conditions. The advantage is that you need to\
    \ mock less: only the backend, or if you want, even that can run as part of an\
    \ E2E test.\n\nIt’s named the “testing pyramid” and not just “testing levels”\
    \ because the idea is that there should be more tests at the lower level than\
    \ the higher level. Some people say you should strive for 60% unit tests, 30%\
    \ integration tests and 10% E2E tests. There’s no single right way to do this,\
    \ however, and for testing the frontend especially there are people who even challenge\
    \ the pyramid completely, saying that E2E tests are the easiest and most robust\
    \ way—especially with respect to implementation changes—to test web apps, so you\
    \ should focus on these the most.\n\nIn the end, how to organize your tests is\
    \ up to you, and we’ll focus on giving an example for each layer in the rest of\
    \ this tutorial.\n\n## Test Setup\n\nWe’ll be using [Jest](https://jestjs.io/)\
    \ for unit and integration tests. Jest is currently the most popular testing library\
    \ for frontend code. If you’re using SvelteKit, you can set up and install all\
    \ the required dependencies for testing with Jest via [svelte-add-jest](https://github.com/rossyman/svelte-add-jest),\
    \ by running the following in the root of your SvelteKit project:\n\n```\nnpx\
    \ apply rossyman/svelte-add-jest\nnpm install @testing-library/svelte -D\n```\n\
    \nThe first command does all the installation of the minimum required dependencies\
    \ for you, as well as creating the required config. We only need to install one\
    \ more package to use after that.\n\nIf you aren’t using SvelteKit, there are\
    \ some more manual steps to take. First, install all the required dependencies.\
    \ If you’re using JavaScript, these are as follows:\n\n```\n\n install jest svelte-jester\
    \ @babel/core @babel/preset-env babel-jest @testing-library/svelte -D\n```\n\n\
    `jest` is the core testing framework and `svelte-jester` is the corresponding\
    \ plugin in order to support Svelte. Babel is needed in order to transform newer\
    \ ES module code. The `testing-library` package will help us write more robust\
    \ tests, as we’ll see later on. Then create a `jest.config.js` with the following\
    \ contents in order to tell Jest to handle Svelte files correctly:\n\n```\nmodule.exports\
    \ = {\n  testEnvironment: \"jsdom\",\n  transform: {\n    \"^.+\\\\.svelte$\"\
    : \"svelte-jester\",\n  },\n  moduleFileExtensions: [\"js\", \"svelte\"],\n};\n\
