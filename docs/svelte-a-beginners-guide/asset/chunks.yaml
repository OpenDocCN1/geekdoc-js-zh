  trans: "\n我们添加了一个 `script` 标签，并在其中放入了与组件相关的 JavaScript 逻辑。该逻辑会在组件每次挂载时执行。我们还使用特殊的\
    \ Svelte 语法增强了 HTML，创建一个循环并打印每本书的标题。如你所见，Svelte 的控制流块有独特的语法，与 Vue 或 Angular 不同，后者通过特殊属性的形式添加此类功能。这使得代码更具读性，因为你可以更容易发现它。它意味着如果你想在控制流块中包含多个顶层级项，就不需要创建包装元素了。\n\
    \n书的标题通过用大括号包裹变量来输出。通常情况下，每当你在模板中遇到大括号时，你就知道自己正在进入与 Svelte 相关的内容。我们将在本系列教程的第 2\
    \ 部分更详细介绍模板语法。\n\n## 响应用户输入\n\n我们现在可以渲染由 `books` 变量定义的任意书名列表。那么添加新书呢？要做到这一点，我们需要增强\
    \ `<script>` 标签中的逻辑，并将其与 `<input>` 元素连接：\n\n```\n<script>\n  let books = ['Learning\
    \ Svelte', 'The Zen of Cooking Tea'];\n  let newBook = '';\n\n  function addBook(evt)\
    \ {\n    if (evt.key === 'Enter') {\n      books = [...books, newBook];\n    \
    \  newBook = '';\n    }\n  }\n</script>\n\n<label>\n  <h4>Add Book</h4>\n  <input\
    \ type=\"text\" bind:value={newBook} on:keydown={addBook} />\n</label>\n<h4>My\
    \ Books</h4>\n<ul>\n  {#each books as book}\n    <li>{book}</li>\n  {/each}\n\
    </ul>\n```\n\n我们添加了一个名为 `newBook` 的新变量，它应该镜像输入值。为了做到这一点，我们通过编写 `bind:value={newBook}`\
    \ 将其绑定到 `<input>`。这建立了双向绑定，因此每当用户向 `<input>` 输入文本时，`newBook` 就会更新；如果 `newBook`\
    \ 在 `<script>` 标签中更新，`<input>` 的显示值就会改变。我们可以使用简单的动态属性实现同样的功能，但这种方法节省了一些代码——你会在\
    \ Svelte 中经常遇到这种思维模式。\n\n当用户按下 `enter` 键时，我们想要将新标题添加到列表中。为了做到这一点，我们添加了一个 DOM 事件监听器。要告诉\
    \ Svelte 挂钩该事件，我们只需要在 `on` 和事件名称部分之间添加一个冒号——在这种情况下是 `on:keydown`。之后，我们使用大括号并将函数名放在其中。每次事件触发时都会调用该函数。关于此模板语法的更多信息可以在本系列教程的第\
    \ 2 部分找到。\n\n这种情况下调用的函数是 `addBook`，在其中我们检查键盘事件，如果用户确实按了 `enter`，我们就更新 `books`\
    \ 变量。注意，这里没有 Angular 或 Vue 2 中那样的 `this` 上下文，没有 Vue 3 那样的特殊值对象，也没有 React 中的 `setState`。在在这种情况下，Svelte\
    \ 不需要额外的语法来感知变量已更新。这听起来可能像魔法，但同时也像“纯粹且简单的 JavaScript”。\n\n要理解 Svelte 是如何实现这一点的，我们需要查看其内部机制。Svelte\
    \ 实际上对 `.svelte` 文件做了什么，以及在什么时候处理它？答案是：Svelte 实际上是一个编译器！在你的代码加载到浏览器之前，它已经完成了大部分工作。Svelte\
    \ 解析代码并将其转换为普通的 JavaScript。在解析过程中，它能够看到如 `newBook` 之类的变量被用于模板中，因此对它的赋值将导致重新渲染。因此，编译输出会将这些赋值封装在\
    \ `$$invalidate` 函数的调用中，该函数将为下一次浏览器绘制调度该组件的重新渲染。这就是 Svelte 卓越性能的秘密：它预先知道哪些部分可能会触发重新渲染，只需要在这些精确的位置执行工作，手术式地更新\
    \ DOM。这也是 Svelte 应用包大小如此之小的原因：所有不需要的内容都不会包含在输出中，因此 Svelte 可以舍弃其微小运行时中每个不需要的部分。一个\
    \ Svelte Hello World! 应用的包大小仅为 2.5KB！\n\n唯一注意的是，Svelte 只查找赋值操作。这就是为什么我们需要执行 `books\
    \ = [...books, newBook];` 或 `books.push(newBook); books = books;`。否则，Svelte 将不知道\
    \ `books` 已经更新。\n\n![编译输出](img/svelte1-compilation-output.png)\n\n## 最后的完善\n\n\
    我们做到了！我们现在可以查看并向列表添加书籍了！不过看起来没那么漂亮，所以让我们给 UI 做一些最后的修饰。首先，我们将添加一些 CSS 来美化元素：\n\n\
    ```\n<!-- script and html code... -->\n\n<style>\n  input {\n    padding: 5px\
    \ 10px;\n  }\n  li {\n    list-style: none;\n  }\n  ul {\n    padding: 5px 0;\n\
    \  }\n</style>\n```\n\n如你所见，我们只需要在 `.svelte` 文件中添加 `<style>` 标签并继续编写普通的 CSS。（注：原文中存在大量重复内容，此处已清理）。\n"
- fmt: "\nAs you can see, Svelte has solutions to all of our requirements, and we’ll\
    \ look at them over the course of this series.\n\n## Ready, Set … Svelte?\n\n\
    So, is it safe to use Svelte for your next project? Your manager might ask if\
    \ Svelte will be around in the years to come or burn out like previous frontend\
    \ framework stars. There isn’t one big company backing Svelte’s entire development\
    \ as there is for Angular and React, but Vue has already shown that this isn’t\
    \ a problem. Moreover, as stated at the beginning, Rich Harris, the creator of\
    \ Svelte, is now working on it full-time. With Svelte’s continuous rise in popularity,\
    \ there’s no sign of it going anywhere in the years to come.\n\nAnother aspect\
    \ of choosing a framework is the ecosystem and its tooling. The ecosystem is still\
    \ small compared to React, but new libraries are coming out every day, and there\
    \ are already a handful of very good component libraries. At the same time, since\
    \ Svelte is so close to vanilla HTML and JavaScript, it’s very easy to integrate\
    \ any existing regular HTML/JavaScript library into your codebase, with no need\
    \ for wrapper libraries.\n\nRegarding tooling, Svelte is looking pretty good.\
    \ There’s an official VS Code extension that’s actively maintained, as well as\
    \ an underlying language server that can be used by many other IDEs to integrate\
    \ Intellisense. IntelliJ also has a plugin for Svelte and recently hired the creator\
    \ behind it to work at JetBrains. There are also various tools for integrating\
    \ Svelte with various bundlers. And yes, you can also use TypeScript with Svelte.\n\
    \nIf you’re looking to build a full-blown website or web app, you might also be\
    \ interested in checking out [SvelteKit](https://kit.svelte.dev/). It provides\
    \ a stellar development experience and comes with a flexible filesystem-based\
    \ router. It also enables you to deploy to many different platforms like Vercel,\
    \ Netlify, your own Node server, or just a good old static file server, depending\
    \ on the features and needs of your application.\n\n### Svelte Summary\n\nIn brief,\
    \ here are the important points to remember about Svelte:\n\n* it has a full-time\
    \ maintainer\n* it has good tooling\n* its features are stable\n* its ecosystem\
    \ is growing\n* SvelteKit is available for building apps fast\n\nTo summarize:\
    \ Svelte is definitely ready to use for your next project! If you want to give\
    \ it a try and you want to learn more, this tutorial series has you covered. In\
    \ Chapter 2, we’ll take a close look at the template syntax. In Chapter 3, we’ll\
    \ look at reactive statements and how they help us react to variable changes or\
    \ derive computed variables. In Chapter 4, we’ll look at stores, which will help\
    \ us with logic outside and across Svelte files, and which we can also use for\
    \ state management. In Chapter 5, we’ll look at various component interaction\
    \ concepts. Finally, in Chapter 6, we’ll look into testing Svelte apps.\n\nWe\
    \ hope to have sparked your interest in Svelte!\n\n## Chapter 2: Template Syntax\n\
    \nIn the first chapter, we got introduced to the history of Svelte and made our\
    \ first little steps at writing a simple component. In this and the following\
    \ chapters, we’ll have a closer look at specific aspects of writing Svelte code.\
    \ In the end, you’ll be able to create applications in Svelte that scale. We’ll\
    \ start with taking a deep dive into Svelte’s template syntax.\n\nSimilar to Angular\
    \ or Vue, Svelte enhances the HTML syntax with several features for expressing\
    \ dynamic properties, loops, and more. We’ll take a look at each of them and see\
    \ how they help you write readable code. One of the nice things about Svelte is\
    \ that you can start with “just HTML” and gradually enhance your markup with dynamic\
    \ features. You do so by using special syntax—called HTMLx in Svelte—that acts\
    \ as an enhancement of HTML. We’ll use this syntax to gradually enhance the following\
    \ code, which represents the initial draft of a to-do app:\n\n```html\n<label>\n\
    \    New To-Do\n    <!-- To implement: make this update the list -->\n    <input\
    \ type=\"text\" />\n</label>\n\n<!-- To implement: only show this if we don't\
    \ have a to-do yet -->\n<p>What do you want to work on?</p>\n\n<ul>\n    <!--\
    \ To implement: make this a dynamic list -->\n    <li>An item</li>\n</ul>\n```\n\
    \nThe snippet above shows what we want to accomplish with our little app: to be\
    \ able to enter new to-do items and show them in a list. Other things like marking\
    \ them as done is out of scope for now, but you are of course free to add them\
    \ yourself after having finished reading this tutorial.\n\nThe final app will\
    \ look something like the image below.\n\n![To-do App](Images/svelte2-app.png)\n\
    \n### Control Flow Syntax\n\nTo start, we want to make the list dynamic and render\
    \ an array of text entries as our to-do list. To achieve that, we’ll need to add\
    \ a `<script>` block to be able to put our list of to-dos in a variable. We’ve\
    \ seen in the first chapter that we’re able to write regular JavaScript code into\
    \ the contents of a `<script>` tag, and its variables and functions are then available\
    \ in the template. We then reach for the `#each` block—one of currently four control\
    \ flow blocks in Svelte—to loop over the list of to-dos in the template:\n\n```html\n\
    <script>\n    let todos = ['Learn Svelte', 'Create great things'];\n</script>\n\
    \n<!-- ... -->\n\n<ul>\n    <!-- syntax: {#each <arrayname> as <entry>} -->\n\
    \    {#each todos as todo}\n        <li>{todo}</li>\n    {/each}\n</ul>\n```\n\
    \nAs you can see, Svelte chooses a different approach to its template syntax compared\
    \ to Vue or Angular. While the latter two add control flow syntax such as loops,\
    \ Svelte creates distinct syntax for it. This makes the code more readable, as\
    \ you can more easily spot it. It also makes it unnecessary to create wrapper\
    \ elements if you want to contain more than one top-level item within the control\
    \ flow block. The text of one to-do item is outputted by surrounding the variable\
    \ with curly braces.\n\nIn general, whenever you encounter a curly brace, you\
    \ know you’re entering something Svelte-related.\n\n#### Look for Braces!\n\n\
    Let’s use another control flow block to solve the second task of showing a message\
    \ if we have no todos yet. We’ll use an `#if` block for that:\n\n```html\n<script>\n\
    \    let todos = ['Learn Svelte', 'Create great things'];\n</script>\n\n<!-- ...\
    \ -->\n\n{#if todos.length === 0}\n    <p>What do you want to work on?</p>\n{:else}\n\
    \    <ul>\n        {#each todos as todo}\n            <li>{todo}</li>\n      \
    \  {/each}\n    </ul>\n{/if}\n```\n\n### More Control Flow\n\nThe `if` block reads\
    \ very much like a regular JavaScript `if` block. The block starts with `{#if\
    \ ..}`, and can have multiple `{:else if ..}` branches as well as one final `{:else}`\
    \ branch. Just as with regular if blocks, the latter two are optional. The block\
    \ is closed by writing `{/if}`. In general, the control flow syntax is `{#<name>\
    \ ..} .. {:<possibly something>} .. {/<name>}`. The hash marks the start of a\
    \ block, the colon marks optional other branches where the text behind the colon\
    \ depends on the control flow block, and the slash marks the end of a block.\n\
    \n`#if` and `#each` are probably what you’ll reach out for the most, but there\
    \ are two more control flow blocks that also come in handy from time to time.\n\
    \nThe first one is the `#await` block, which lets you use promises inside the\
    \ markup:\n\n```html\n{#await somePromise}\n  Loading..\n{:then result}\n  The\
    \ result is {result}\n{:catch error}\n  Oh no! An error occurred: {error}\n{/await}\n\
    ```\n"
