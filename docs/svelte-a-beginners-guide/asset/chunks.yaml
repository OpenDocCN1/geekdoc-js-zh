    \ a variable from the dependencies. In the following somewhat arbitrary (but simple)\
    \ example, we want `multiplied` to only update when we increase `count`, but not\
    \ when we change `multiplyBy`. We do this by hiding the variable `multiplyBy`\
    \ from the direct dependencies, by moving it into a function:\n\n```\n<script>\n\
    \  let count = 0;\n  let multiplyBy = 2;\n\n  $: multiplied = multiply(count);\n\
    \n  function multiply(value) {\n      return value * multiplyBy;\n  }\n</script>\n\
    ```\n\nNow `multiplied` will only change if `count` changes, but not when `multiplyBy`\
    \ changes. This works because Svelte only looks at the *direct* code of the reactive\
    \ statement; it doesn’t follow function calls.\n\nThe inverse might be true, too:\
    \ we may want to retrigger a reactive statement even if a variable changes that\
    \ doesn’t directly contribute to the result. In this case, we can just add the\
    \ variable in question by making it appear within the reactive statement:\n\n\
    ```\n<script>\n  // ...\n  $: variableWhichShouldTriggerRecalculation, retriggerCalculation();\n\
    \  // ...\n</script>\n```\n\nThe above shows one possible way to do this by using\
    \ the comma operator. Another way would be to make it part of the function parameters\
    \ but never use it in the function itself. How exactly you make the variable appear\
    \ is up to you. Anything that’s valid JavaScript is allowed.\n\nSince reactive\
    \ statements are regular JavaScript, you can also use `if`-blocks to have more\
    \ control over when a statement is rerun by only executing its body when a certain\
    \ condition is met:"
