    本书未将每个商标名称的出现标记为商标，而是仅以编辑的方式使用这些名称，旨在维护所有者的利益，无侵犯商标之意。\n\n![SitePoint logo](img/sitepoint-logo-2012.png)\n\
    \nSitePoint Pty. Ltd 出版\n\n10-12 Gwynne St, Richmond, VIC, 3121\nAustralia\n\n\
    网站：www.sitepoint.com\n邮箱：books@sitepoint.com\n\n## 关于 SitePoint\n\nSitePoint 专门为\
    \ Web 专业人士编写有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
    \ 访问我们的博客、书籍、时通讯、文章和社区论坛。你可以在这里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 关于作者\n\nSimon\
    \ 对 Web 前充满热情。他在 `Angular` 和 `Svelte` 方面拥有专家知识，并精通其他框架，曾领导多个项目取得成功。他还是 Svelte\
    \ 维护团队的一员，他最重要的贡献是了 `VS Code` 扩展。\n\n# 前言\n\n## 谁应该读这本书？\n\n本书面向具有 `JavaScript`\
    \ 经验的开发者。如果你已经使用过如 `React` 等 JavaScript 框架，你会发现这本书很容易读，但它也适合没有此类框架经验的读者。\n\n##\
    \ 使用的约定\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\n```\n <h1>A Perfect Summer's Day</h1>\n\
    <p>这是一个公园散步的美好日子。\n鸟儿在歌唱，孩子们都回学校了。</p> \n```\n\n你会发现，我们在整本书中使用特定的布局样式来表示不同类型的信息。请关注以下项目。\n\
    \n#### 提示、注释和警告\n\n#### 嘿，你！\n\n提示（Tips）提供有用的小建议。\n\n#### 咳，不好意思……\n\n注释（Notes）与当前主题相关但并非关键的补充说明。将它们视为额外的信息片段。\n\
    \n#### 确保你始终……\n\n…… 注意这些重要要点。\n\n#### 注意！\n\n警告（Warnings）强调了在过程中可能会让你绊倒的任何陷阱。\n\
    \n## 补充材料\n\n* [`www.sitepoint.com/community/`](https://www.sitepoint.com/community/)\
    \ 是 SitePoint 的论坛，用于解决任何棘手问题提供帮助。\n* **books@sitepoint.com** 是我们的邮箱地址，如果你需要联系我们报告问题或出于其他原因。\n\
    \n# 第 1 章：开始使用 Svelte\n\nSvelte 是一个用于开发网站和 Web 应用的较新的 JavaScript 前框架。\n\nSvelte\
    \ 在过去两年收到的赞誉证明了它不仅仅是“另一个前端框架”。它在 2019 年的 State of JS 调查中获得了“年度突破”，并在 2020 年的满意度排名中位首。它在\
    \ Stack Overflow 2021 调查中被选为最受欢迎的 Web 框架。\n\nSvelte 以其较小的包体积、卓越的性能和易用性吸引了开发者。同时，它还包含了许多优秀特性。它已经提供了一个用于构建的简单状态管理解决方案，以及开箱即用的过渡和动画。本入门教程将阐明\
    \ Svelte 是如何实现这些点的。系列中的后续教程将详细介绍如何利用 Svelte 提供的各种可能性使用 Svelte 实现应用程序。\n\n## Svelte\
    \ 背景\n\n首先，简单介绍一下 Svelte 的背景。虽然它直到 2020 年初才进入主流视野，但 Svelte 已经存在了很久。\n\n第一次提交到\
    \ GitHub 是 2016 年底。它的创建者是 Rich Harris，一位开源魔法师，他最著名的其他发明是现代打包器 `Rollup`。当时，Rich\
    \ Harris 在新闻杂志《英国卫报报》（*The Guardian*）担任图形编辑。他的日常工作是为网站创建交互式可视化图形，他希望有一种工具，可以在不牺牲包体积或速度的情况下轻松编写这些内容。同时，他希望它是易于上手的，以便其他技术不太精通的同事能够快速创建可视化。\n\
    \n由于这些需求，Svelte 诞生了。从新闻室开始，Svelte 迅速在开源社区中聚集了一小群粉丝。但直到 2019 年 4 月，Svelte 才真正为人所知。该日期标志着版本\
    \ 3 的发布，这是一个完全重写的版本，专注于开发者体验和易用性。从那时起，Svelte 的人气增加了，维护者加入了，Rich Harris 甚至加入了 Vercel\
    \ 全职开发 Svelte。\n\n## 构建简单的书籍列表\n\n让我们进入 Svelte 的世界！我们将构建一个允许我们添加和删除书籍的小型书籍列表。最终结果看起来像这样。\n\
    \n![Final App](img/svelte1-app.png)\n\n我们将从项目模板脚手搭建项目。我们将使用官方的 [Svelte 模板](https://github.com/sveltejs/template/)。其他替代方案是使用\
    \ [基于 Vite 的模板](https://github.com/vitejs/vite/tree/main/packages/create-vite/template-svelte)\
    \ 或使用 [SvelteKit](https://kit.svelte.dev/)（构建在 Svelte 之上的框架，但在本教程中我们将保持最简单）。\n\
    \n下载模板后，进入其文件夹并运行 `npm install`，下载我们需要的所有包。然后切换到 `App.svelte`，我们将内容替换为纯 HTML 版本，以布局我们想要的视觉效果：\n\
    \n```html\n<h4>添加书籍</h4>\n<input type=\"text\" />\n<h4>我的书籍</h4>\n<ul>\n  <li>一本书</li>\n\
    </ul>\n```\n\n```html\n> 我们可以直接在 Svelte 文件的顶层编写上述代码；不需要添加任何包装元素。Svelte 的语法是 HTML\
    \ 的超集，因此任何在 HTML 文件中有效的代码在 Svelte 文件中都是有效的。\n\n现在的问题是如何将动态部分加入其中。我们首先在脚本中添加一个静态列表，并通过循环进行渲染：\n\
    \n```html\n<script>\n  let books = ['学习 Svelte', '泡茶之道'];\n</script>\n\n<label>\n\
    \  <h4>添加书籍</h4>\n  <input type=\"text\" />\n</label>\n<h4>我的书籍</h4>\n<ul>\n \
    \ {#each books as book}\n    <li>{book}</li>\n  {/each}\n</ul>\n```\n\n"
- fmt: "\nWe added a `script` tag in which we put our JavaScript logic related to\
    \ the component. That logic is executed each time the component mounts. We also\
    \ enhance the HTML with special Svelte syntax to create a loop and print the title\
    \ of each book. As you can see, Svelte has distinct syntax for control flow blocks,\
    \ unlike Vue or Angular, which add such functionality in the form of special attributes.\
    \ This makes the code more readable, as you can more easily spot it. It also makes\
    \ it unnecessary to create wrapper elements if you want to contain more than one\
    \ top-level item within the control flow block.\n\nThe title of a book is outputted\
    \ by surrounding the variable with curly braces. In general, whenever you encounter\
    \ a curly brace within the template, you know you are entering something Svelte-related.\
    \ We’ll look into the template syntax in more detail in Part 2 of this tutorial\
    \ series.\n\n## Reacting to User Input\n\nWe can now render an arbitrary list\
    \ of book titles, defined by our `books` variable. What about adding a new book?\
    \ To do this, we need to enhance our logic in the `<script>` tag and connect it\
    \ to the `<input>` element:\n\n```\n<script>\n  let books = ['Learning Svelte',\
    \ 'The Zen of Cooking Tea'];\n  let newBook = '';\n\n  function addBook(evt) {\n\
    \    if (evt.key === 'Enter') {\n      books = [...books, newBook];\n      newBook\
    \ = '';\n    }\n  }\n</script>\n\n<label>\n  <h4>Add Book</h4>\n  <input type=\"\
    text\" bind:value={newBook} on:keydown={addBook} />\n</label>\n<h4>My Books</h4>\n\
    <ul>\n  {#each books as book}\n    <li>{book}</li>\n  {/each}\n</ul>\n```\n\n\
    We added a new variable called `newBook`, which should mirror the input value.\
    \ To do that, we bind it to the `<input>` by writing `bind:value={newBook}`. This\
    \ establishes a two-way binding, so every time the user enters text into the `<input>`,\
    \ `newBook` updates, and if `newBook` is updated in the `<script>` tag, the display\
    \ value of `<input>` changes. We could have done the same with simple dynamic\
    \ attributes, but this way saves us some code—a thought pattern you’ll come across\
    \ often in Svelte.\n\nWhen the user presses `enter`, we want to add the new book\
    \ title to the list. To do this, we add a DOM event listener. To tell Svelte to\
    \ hook into the event, we just add a colon between `on` and the rest of the event\
    \ name—so in this case it’s `on:keydown`. After that, we use the curly braces\
    \ and place the name of the function inside. The function is called each time\
    \ the event fires off. More on this template syntax can be found in Part 2 of\
    \ this tutorial series.\n\nThe function to call in this case is `addBook`, in\
    \ which we check the keyboard event, and if the user indeed pressed `enter`, we\
    \ update the `books` variable. Notice the lack of a `this` context like we find\
    \ in Angular or Vue 2, or the lack of special value objects like in Vue 3, or\
    \ the lack of `setState` in React. Svelte doesn’t need extra syntax in this case\
    \ to know that the variable has updated. This might feel like magic, but also\
    \ like “just plain simple JavaScript” at the same time.\n\nTo understand how Svelte\
    \ achieves this, we need to look under the hood. What does Svelte actually do\
    \ with a `.svelte` file, and when does it process it? The answer: Svelte is actually\
    \ a compiler! It does most of the work before your code is even loaded in the\
    \ browser. Svelte parses the code and transforms it into regular JavaScript. During\
    \ parsing, it’s able to see that variables like `newBook` are used in the template,\
    \ so assignments to it will cause rerenders. The compilation output will therefore\
    \ wrap these assignments with calls to a `$$invalidate` function, which will schedule\
    \ a rerender of this exact component for the next browser paint. This is the secret\
    \ to Svelte’s great performance: it knows in advance which parts could trigger\
    \ rerenders and then only needs to do work in these exact places, surgically updating\
    \ the DOM. It’s also the reason why the bundle sizes of Svelte applications are\
    \ so small: everything that’s not needed just won’t be part of the output, so\
    \ Svelte can leave out every part of its tiny runtime that isn’t needed. A Svelte\
    \ Hello World! app has a bundle size of just 2.5KB!\n\nThe only thing to watch\
    \ out for is that Svelte does only look for assignments. That’s why we need to\
    \ do `books = [...books, newBook];` or `books.push(newBook); books = books;`.\
    \ Otherwise, Svelte wouldn’t know that `books` has updated.\n\n![Compilation Output](Images/svelte1-compilation-output.png)\n\
    \n## Finishing Touches\n\nWe did it! We can now view and add books to our list!\
    \ It doesn’t look that pretty, though, so let’s put some finishing touches to\
    \ our UI. First, we’ll add some CSS to style our elements:\n\n```\n<!-- script\
    \ and html code... -->\n\n<style>\n  input {\n    padding: 5px 10px;\n  }\n  li\
    \ {\n    list-style: none;\n  }\n  ul {\n    padding: 5px 0;\n  }\n</style>\n\
    ```\n\nAs you can see, we just add a `<style>` tag to our `.svelte` file and continue\
