  trans: "\n\n```svelte\n<script>\n  import { fade } from 'svelte/transition';\n\n\
    \  let books = ['Learning Svelte', 'The Zen of cooking Tea'];\n  let newBook =\
    \ '';\n\n  function addBook(evt) {\n    if (evt.key === 'Enter') {\n      books\
    \ = [...books, newBook];\n      newBook = '';\n    }\n  }\n</script>\n\n<h2>\n\
    \    我的小书签应用\n</h2>\n<div>\n    <label>\n        <h4>添加书籍</h4>\n        <input\
    \ type=\"text\" bind:value={newBook} on:keydown={addBook} />\n    </label>\n\n\
    \    <h4>我的书籍</h4>\n    <ul>\n        {#each books as book}\n            <li transition:fade>{book}</li>\n\
    \        {/each}\n    </ul>\n</div>\n\n<style>\n    div {\n        display: inline-block;\n\
    \        margin-left: auto;\n        margin-right: auto;\n    }\n    h2 {\n  \
    \      background: rgb(9,111,121);\n        padding: 5px 10px;\n        text-align:\
    \ center;\n        color:white;\n        font-weight: bold;\n        margin:0;\n\
    \    }\n  input {\n    padding: 5px 10px;\n  }\n  li {\n    list-style: none;\n\
    \  }\n  ul {\n    padding: 5px 0;\n  }\n    :global(body){\n        background:\
    \ rgb(9,111,121);\n        background: linear-gradient(180deg, rgba(9,111,121,1)\
    \ 0%, rgba(255,241,242,1) 60%, rgba(255,241,242,1) 100%);\n        display:flex;\n\
    \        flex-direction: column;\n    }\n</style>\n```\n\n我们想要测试添加书籍的功能是否正常工作。这意味着要确保输入的文本作为列表中的一项出现，并且在添加书籍后输入框会被清空。\n\
    \n如何处理？第一个想法可能是以某种方式访问组件的编译版本，然后更新并调用所需的变量和函数。然而，由于我们与组件的实现细节紧密绑定，这种方法非常脆弱。如果我们可以通过渲染后的\
    \ HTML 在高一个抽象层上进行测试，效果会更好。这意味着我们模拟与 HTML 的交互，然后检查它是否已正确更新。\n\n在我们的情况下，这意味着我们要模拟在输入框中打字、按下\
    \ `enter`，然后检查更新后的 HTML 是否有新的书籍条目。`@testing-library/svelte` 将帮助我们完成。它是 `Testing\
    \ Library` API 的封装，该 API 提供了一套用于与 HTML 交互的实用程序。如果你已经使用围绕该库的其他封装器编写了测试（例如使用 React\
    \ 或 Vue），下面的代码片段对你来说非常熟悉：\n\n```javascript\nimport { render, fireEvent } from\
    \ \"@testing-library/svelte\";\nimport App from \"./App.svelte\";\n\ndescribe(\"\
    Book App\", () => {\n  test(\"can add book\", async () => {\n    // 实例化并渲染组件\n\
    \    const app = render(App);\n    // 检查最初没有列表项\n    expect(() => app.getAllByRole(\"\
    listitem\")).toThrow();\n    // 模拟用户输入\n    const input = await app.findByLabelText(\"\
    Add Book\");\n    await fireEvent.input(input, {\n      target: { value: \"Writing\
    \ Svelte Tests\" },\n    });\n    await fireEvent.keyDown(input, { key: \"Enter\"\
    \ });\n    // 检查现在有一个列表项\n    expect(app.getAllByRole(\"listitem\").length).toBe(1);\n\
    \    expect(app.getByText(\"Writing Svelte Tests\")).toBeDefined();\n  });\n});\n\
    ```\n\n我们首先使用提供的名为 `render` 的实用函数实例化组件。在检查列表最初是否为空后，我们模拟了用户输入，然后测试在按下 `enter`\
    \ 键后新书籍是否已添加。这些方法返回 promise，并在 Svelte 编译器重新渲染时立即解析完成，而重新渲染是异步执行的。正如你所看到的，我们并没有通过查找特定的\
    \ HTML 标签或类来这样做（尽管如果需要我们可以回退到那种方法）。相反，我们选择了一种更具语义的方法，通过查找（例如）特定的文本或特定的角色（role）来访问\
    \ HTML。这使得我们的测试对 Svelte 模板的变化更具健壮性。上面的示例是对一个相当简单的组件进行的测试。当涉及的组件连接到上下文或全局状态，或者其下方有许多组件时，测试可能会变得更加复杂。如果你只想测试特定组件，你需要\
    \ mock（模拟）掉所有不需要的依赖，这取决于需要 mock 什么，可能很简单，也可能很难。\n\n如果很难 mock 掉某些内容或通常难以进行测试，这暗示你的代码可能与所有依赖项耦合过于紧密。你可能需要拆分、模块化或重新组织部分代码。例如，如果你为了测试特定的业务逻辑而需要创建一个复杂的测试设置，那么将计算提取到独立于组件的单独\
    \ JavaScript 文件中的函数可能会有利，这使得测试该函数变得简单得多。\n\n为提高可测试性而准备代码通常会导致整体代码更加整洁，因此测试时的愉快心情通常会随之而来。\n\
    \n## 编写你的 E2E 测试\n\n[Cypress](https://www.cypress.io/) 是一种用于任何 Web 应用程序的 JavaScript\
    \ 端测试工具。它可以让你轻松地为浏览器编写快速可靠的测试。\n\n无论你决定如何进行，都可以看到编写 E2E 测试时的抽象层级更高。你不需要在应用程序内部\
    \ mock 任何东西。事实上，你可以像平时开发时一样运行它。如果你计划重写应用的部分并希望确保行为不变，这将非常有帮助。\n\n[Selenium](https://www.selenium.org/)\
    \ 是一个用于自动化浏览器的开源框架。它允许使用各种编程语言编写测试并在不同的浏览器中运行。[Playwright](https://playwright.dev/)\
    \ 是微软推出的用于现代应用端到端测试的框架。它快速、可靠并支持多种浏览器。\n\n如果你想使用相同的样式获取 HTML 元素，Testing Library\
    \ 可以提供。只需安装 `@testing-library/cypress`，你就可以可以使用熟悉的查询方法。\n\nCypress 运行在特定的，因此我们在\
    \ `cypress/integration` 中创建一个新的 `.spec.js` 文件，并继续编写之前的相同测试，这次使用 Cypress：\n\n```javascript\n\
    /// <reference types=\"cypress\" />\n\ndescribe(\"Books App\", () => {\n  beforeEach(()\
    \ => {\n    // 打开应用\n    cy.visit(\"http://localhost:3000\");\n  });\n\n  it(\"\
    can add book\", () => {\n    // 检查最初没有项\n    cy.get(\"li\").should(\"have.length\"\
    , 0);\n    // 模拟用户输入\n    cy.get(\"input\").type(\"Writing Svelte Tests{enter}\"\
    );\n    // 检查现在有一个列表项\n    cy.get(\"li\")\n      .should(\"have.length\", 1)\n\
    \      .last()\n      .should(\"contain.text\", \"Writing Svelte Tests\");\n \
    \ });\n});\n```\n\n![Cypress startup](img/cypress-start.png)\n\n正如你看到的，测试读起来与我们之前编写的\
    \ Jest 测试非常相似。我们首先打开应用，检查列表是否为空，然后通过用户输入添加一项，最后检查是否存在预期的项目。\n\n## 结语\n\n"
