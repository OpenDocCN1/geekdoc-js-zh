  trans: "\n\n*   当你需要管理或协调同一组件的多个实例，或者导出与其相关的命令式逻辑时，使用 `<script context=\"module\"\
    >` 标签。\n*   当你需要为应用的某个子部分提供某些值并希望避免属性层传递（property drilling）时，请使用 `setContext`\
    \ 和 `getContext`。\n\n有了这些工具，你现在准备好以最好的方式来构建和组织你的组件了。\n\n你现在准备好在 Svelte 中编写完整的应用程序了。在最后一章中，我们将测试这些应用程序。我们将探讨可以测试的不同层次，以及让你的应用程序具有测试性意味着什么。\n\
    \n# 第 6 章：测试应用程序\n\n我们已经走了很长的一路了。我们从查看 Svelte 的历史以及使用它编写应用程序的第一步开始。随后，我们详细地介绍了构建此类应用程序的工具。我们深入研究了\
    \ Svelte 的模板语法（它是 HTML 的扩展）。我们看到了如何使用响应式语句来响应变量的变化——例如，为了创建计算变量。然后，我们查看了 Svelte\
    \ 存储（stores），它们可以用于在多个组件之间共享状态，并且学习了组件之间相互集成的各种方法。\n\n这一切赋予了我们创建可扩展 Svelte 应用程序的能力。但我们如何测试这些应用程序呢？这就是我们在最后一章中将看到的。\n\
    \n## 测试金字塔\n\n在进入技术细节之前，让我们先后退一步，思考我们测试应用程序的方法。事实证明，并没有一种真正的方法。相反，测试有不同的层级。这实际上有一个专门的名字，你可能已经遇到过：“测试金字塔”。\n\
    \n![测试金字塔](img/testing-pyramid.png)\n\n`testing pyramid` 帮助我们分类各种测试方式。\n\n在底部是`单元测试`（unit\
    \ tests），它们一次只查看应用程序的一小部分——例如隔离测试某个特定的函数。\n\n在其之上是`集成测试`（integration tests），它们组合测试应用程序的小中等部分。虽然单元测试对于测试诸如函数是否返回了正确结果等事情非常好，但它们无法告诉你该函数是否以正确的方式使用。你所有的单元测试都通过了，但你所测试的各个之间的交互可能是错误的。集成测试有助于发现这些错误。\n\
    \n金字塔的最顶层是`端到端测试`（end-to-end tests，缩写 E2E），它们比集成测试更进一步一步，不仅运行应用程序的一部分，还运行整个应用程序并从终端用户的视角进行测试。挑战在于让整个应用程序在测试条件下运行。优势是它们需要的模拟（mock）更少：只需要后端，或者如果你愿意，甚至后端也可以作为\
    \ E2E 测试的一部分运行。\n\n它之所以被称为“测试金字塔”而不是简单的“测试层级”，是因为其理念是低层级的测试应该比高层级更多。有些人说，你应该追求\
    \ 60% 的单元测试、30% 的集成测试和 10% 的 E2E 测试。然而，这没有单一的正确方法，特别是对于前端测试，甚至有人完全挑战金字塔理论，认为 E2E\
    \ 测试是测试 Web 应用最简单、最稳健的方法——特别是在实现变化方面——所以你应该最关注这些。\n\n最后，如何组织你的测试取决于你，我们将在本教程的剩余部分中专注于为每个层级提供一个示例。\n\
    \n## 测试设置\n\n我们将使用 [Jest](https://jestjs.io/) 进行单元测试和集成测试。Jest 是目前前端代码最流行的测试库。如果你在使用\
    \ SvelteKit，可以通过 [svelte-add-jest](https://github.com/rossyman/svelte-add-jest)\
    \ 在 SvelteKit 项目根目录下运行以下命令来设置并安装 Jest 测试所需的所有依赖：\n\n```\nnpx apply rossyman/svelte-add-jest\n\
    npm install @testing-library/svelte -D\n```\n\n第一条命令为你完成了所有最小所需依赖的安装，并创建了所需的配置。之后我们只需要再安装一个包即可使用。\n\
    \n如果你没有使用 SvelteKit，还有一些手动步骤需要执行。首先，安装所有所需的依赖。如果你使用 JavaScript，依赖如下：\n\n```\n\
    npm install jest svelte-jester @babel/core @babel/preset-env babel-jest @testing-library/svelte\
    \ -D\n```\n\n`jest` 是核心测试框架，`svelte-jester` 是为了支持 Svelte 而对应的插件。需要 Babel 来转换较新的\
    \ ES 模块代码。正如我们稍后看到的，`testing-library` 包将帮助我们编写更健壮的测试。然后，创建一个包含以下内容的 `jest.config.js`，以告诉\
    \ Jest 正确处理 Svelte 文件：\n\n```\nmodule.exports = {\n  testEnvironment: \"jsdom\"\
    ,\n  transform: {\n    \"^.+\\\\.svelte$\": \"svelte-jester\",\n  },\n  moduleFileExtensions:\
    \ [\"js\", \"svelte\"],\n};\n```\n\n然后创建一个 `.babelrc` 并添加以下代码，这是为了将较新的 JavaScript\
    \ 语法编译为 Jest 能理解的内容：\n\n```\n{\n  \"presets\": [[\"@babel/preset-env\", { \"targets\"\
    : { \"node\": \"current\" } }]]\n}\n```\n\n这些是使用 JavaScript 时创建测试的步骤。如果你使用的是 TypeScript，设置看起来会有所不同。首先，你需要安装以下包：\n\
    \n```\nnpm install typescript svelte-preprocess jest ts-jest svelte-jester @testing-library/svelte\
    \ -D\n```\n\n你可能已经有了 `typescript` 和 `svelte-preprocess`，因为开发 Svelte 应用程序需要它们。B\
    \ 依赖被 `ts-jest` 取代，它负责正确转换代码。之后，在项目根目录下添加以下配置文件：\n\n在 `svelte.config.js` 中，添加内容：\n\
    \n```js\nconst sveltePreprocess = require(\"svelte-preprocess\");\n\nmodule.exports\
    \ = {\n  preprocess: sveltePreprocess(),\n};\n```\n\n在 `jest.config.js` 中，添加内容：\n\
    \n```js\nmodule.exports = {\n  testEnvironment: \"jsdom\",\n  transform: {\n \
    \   \"^.+\\\\.svelte$\": [\n      \"svelte-jester\",\n      {\n        preprocess:\
    \ true,\n      },\n    ],\n    \"^.+\\\\.ts$\": \"ts-jest\",\n  },\n  moduleFileExtensions:\
    \ [\"js\", \"ts\", \"svelte\"],\n};\n```\n\n这些文件确保 Jest 在运行测试之前知道如何预处理 TypeScript\
    \ 和 Svelte 文件。`svelte.config.js` 告诉工具在交给编译器之前如何预处理 Svelte 文件，而 Jest 配置告诉 Jest\
    \ 如何转换 Svelte 和 TypeScript 文件。\n\n## 编写你的第一个测试\n\n完成所有设置后，让我们开始编写第一个测试吧！我们将测试的应用程序是你在第\
    \ 1 章中熟悉的非常简单的书籍列表。作为提醒，下面的图片显示了它的样子。\n\n![书籍列表应用](img/book-list-app.png)\n\n\
    这是它背后的代码：\n\n"
- fmt: "\n```svelte\n<script>\n  import { fade } from 'svelte/transition';\n\n  let\
    \ books = ['Learning Svelte', 'The Zen of cooking Tea'];\n  let newBook = '';\n\
    \n  function addBook(evt) {\n    if (evt.key === 'Enter') {\n      books = [...books,\
    \ newBook];\n      newBook = '';\n    }\n  }\n</script>\n\n<h2>\n    My Little\
    \ Book App\n</h2>\n<div>\n    <label>\n        <h4>Add Book</h4>\n        <input\
    \ type=\"text\" bind:value={newBook} on:keydown={addBook} />\n    </label>\n\n\
    \    <h4>My Books</h4>\n    <ul>\n        {#each books as book}\n            <li\
    \ transition:fade>{book}</li>\n        {/each}\n    </ul>\n</div>\n\n<style>\n\
    \    div {\n        display: inline-block;\n        margin-left: auto;\n     \
    \   margin-right: auto;\n    }\n    h2 {\n        background: rgb(9,111,121);\n\
    \        padding: 5px 10px;\n        text-align: center;\n        color:white;\n\
    \        font-weight: bold;\n        margin:0;\n    }\n  input {\n    padding:\
    \ 5px 10px;\n  }\n  li {\n    list-style: none;\n  }\n  ul {\n    padding: 5px\
    \ 0;\n  }\n    :global(body){\n        background: rgb(9,111,121);\n        background:\
    \ linear-gradient(180deg, rgba(9,111,121,1) 0%, rgba(255,241,242,1) 60%, rgba(255,241,242,1)\
    \ 100%);\n        display:flex;\n        flex-direction: column;\n    }\n</style>\n\
    ```\n\nWe want to test that adding a book works correctly. This means ensuring\
    \ that the typed text appears as an item in the list, and that the input is cleared\
    \ after adding the book.\n\nHow to approach this? The first idea might be to somehow\
    \ access the compiled version of the component and then update and invoke the\
    \ needed variables and functions. This is very brittle, however, since we’re closely\
    \ tied to the implementation details of our component. It would be better if we\
    \ could test this one abstraction level higher, through the rendered HTML. This\
    \ means that we simulate interactions with the HTML and then check if it was updated\
    \ correctly.\n\nIn our case, this means we want to simulate typing into the input,\
    \ press `enter`, and then check the updated HTML for a new book entry. `@testing-library/svelte`\
    \ will help us with this. It’s a wrapper around the `Testing Library` API, which\
    \ provides an opinionated set of utilities for interacting with the HTML. If you\
    \ already have written tests with other wrappers around this library—for example,\
    \ using React or Vue—the following code snippet will look familiar to you:\n\n\
    ```javascript\nimport { render, fireEvent } from \"@testing-library/svelte\";\n\
    import App from \"./App.svelte\";\n\ndescribe(\"Book App\", () => {\n  test(\"\
    can add book\", async () => {\n    // Instantiate and render component\n    const\
    \ app = render(App);\n    // Check that there are no list items at first\n   \
    \ expect(() => app.getAllByRole(\"listitem\")).toThrow();\n    // Simulate user\
    \ input\n    const input = await app.findByLabelText(\"Add Book\");\n    await\
    \ fireEvent.input(input, {\n      target: { value: \"Writing Svelte Tests\" },\n\
    \    });\n    await fireEvent.keyDown(input, { key: \"Enter\" });\n    // Check\
    \ that there is one list item now\n    expect(app.getAllByRole(\"listitem\").length).toBe(1);\n\
    \    expect(app.getByText(\"Writing Svelte Tests\")).toBeDefined();\n  });\n});\n\
    ```\n\nWe first instantiate the component using the provided utility function\
    \ named `render`. After checking that the list is empty initially, we simulate\
    \ user input, and then test that the new book was added after pressing the `enter`\
    \ key. These methods return promises that resolve as soon as the Svelte compiler\
    \ has rerendered, which happens asynchronously. As you can see, we don’t do that\
    \ by looking up specific HTML tags or classes (though we could fall back to that\
    \ if needed). Instead, we’ve chosen a more semantic approach and access the HTML\
    \ by looking up (for example) specific text or a specific role. This makes our\
    \ tests more robust to changes in the Svelte template.\n\nThe example above is\
    \ a test for a rather simple component. Testing can get more complex when the\
    \ component in question is connected to context or global state or has many components\
    \ below it. If you only want to test that specific component, you need to mock\
    \ away all unwanted dependencies, which can be easy to hard depending on what\
    \ needs to be mocked.\n\nIf it’s very hard to mock things away or to test in general,\
    \ this hints at your code maybe being too wired with all its dependencies. You\
    \ may need to split up and modularize or reorganize some of the code. For example,\
    \ if you need to create a complex test setup because you want to test specific\
    \ business logic, it may be beneficial to split the computation out into a function\
    \ in a separate JavaScript file that’s independent of components, which makes\
    \ testing that function much easier.\n\nPreparing your code for better testability\
    \ will often lead to cleaner code overall, so a feel-good vibe when testing will\
    \ mostly go hand.\n\n## Writing your E2E Test\n\n[Cypress](https://www.cypress.io/)\
    \ is a JavaScript front-to-end testing tool for any web application. It makes\
    \ it easy to write fast and reliable tests for anything your browser can do.\n\
    \nRegardless of how you decide to proceed, you can see that the abstraction level\
    \ is much higher when writing E2E tests. You don’t mock anything within your app.\
    \ In fact, you run it like you normally would during development. If you want,\
    \ you can mock backend calls. Cypress has handy utilities for making this possible—or\
    \ you just set up your own mock server. Because this frees you from many mocking\
    \ headaches, some people prefer to write more tests this way. This is especially\
    \ helpful if you plan on rewriting parts of your app and want to ensure the behavior\
    \ stays the same.\n\n[Selenium](https://www.selenium.org/) is an open-source framework\
    \ for automating web browsers. It allows you to write tests in various programming\
    \ languages and run them across different browsers. [Playwright](https://playwright.dev/)\
    \ is a framework for end-to-end testing of modern web apps by Microsoft. It is\
    \ fast, reliable, and supports multiple browsers.\n\nIf you want to use the same\
    \ style of retrieving the HTML elements, the Testing Library has you covered.\
    \ Just install `@testing-library/cypress` and you’ll be able to use the queries\
    \ you already know.\n\nCypress, expects the application to run at specific, so\
    \ we’ll create new `.spec.js` file within `cypress/integration` and proceed to\
    \ write the same test we just wrote, this time Cypress:\n\n```javascript\n///\
    \ <reference types=\"cypress\" />\n\ndescribe(\"Books App\", () => {\n  beforeEach(()\
    \ => {\n    // Open app\n    cy.visit(\"http://localhost:3000\");\n  });\n\n \
    \ it(\"can add book\", () => {\n    // Check that there are no items at first\n\
    \    cy.get(\"li\").should(\"have.length\", 0);\n    // Simulate user input\n\
    \    cy.get(\"input\").type(\"Writing Svelte Tests{enter}\");\n    // Check that\
    \ there is one list item now\n    cy.get(\"li\")\n      .should(\"have.length\"\
    , 1)\n      .last()\n      .should(\"contain.text\", \"Writing Svelte Tests\"\
    );\n  });\n});\n```\n\n![Cypress startup](Images/cypress-start.png)\n\nAs you\
    \ can see, the test reads quite similarly to the Jest test we wrote earlier. We\
    \ open the app first, check if there are no items in the list, then add one through\
    \ user input, and then check that there’s the expected item.\n\n## Wrapping Up\n"
