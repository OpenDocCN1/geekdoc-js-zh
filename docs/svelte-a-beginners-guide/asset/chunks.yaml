    \ that don’t fit into a simple declaration statement, or which touch more than\
    \ one variable. Essentially, reactive statements are a superset of reactive declarations:\
    \ you could rewrite every reactive declaration as a reactive statement. The following\
    \ code is identical from a semantic point of view:\n\n```\n<script>\n  let something\
    \ = 'something';\n  // This ...\n  $: declaration = something;\n  // Is the same\
    \ as this\n  let statement;\n  $: {\n    statement = something;\n  }\n</script>\n\
    ```\n\n## Order of Execution\n\nYou might ask now in which order these reactive\
    \ statements are run. Intuitively, it makes sense that it’s somehow ordered in\
    \ relation to the things they use, but how exactly? The answer is simple: at compile\
    \ time, Svelte looks at the *direct* code of the reactive statements and checks\
    \ each variable that’s *read*. These are the dependencies we already touched on\
