  trans: "\n一旦我们开始使用 store（存储器），我们可能还想要将一些 store 组合，或者从某个 store 派出一个不同的值。在这种情况下，我们可以使用\
    \ `derived`。假设我们的用户名被分为姓（surname）和名（lastname），但我们希望在应用的不同地方显示组合后的名称。为了避免重复代码，我们使用一个\
    \ `derived` store 将它们合并在一起：\n\n```svelte\nimport { derived } from \"svelte/store\"\
    ;\nimport { user } from \"./user\";\n\nexport const username = derived(\n  user,\n\
    \  (_user) => _user.surname + \" \" + _user.lastname\n);\n```\n\n在最简单的形式下，`derived`\
    \ 接受一个 store 或 store 数组作为第一个参数，并将一个获取该 store 或这些 store 当前值的函数作为第二个参数。对于更复杂的用例，该函数还提供了第二个参数——`set`——我们可以用它在适当的时候更新\
    \ `derived` 状态。在这种情况下，返回值可以是一个函数，该函数会在订阅者数量从 1 变为 0 时被调用。此时我们还可以给 `derived` 传递第三个参数，用于标记初始值。\n\
    \n这是一个示例：\n\n```svelte\nimport { derived } from \"svelte/store\";\n// ...\n\n\
    export const itemDetails = derived(\n  itemId,\n  (_itemId, set) => {\n    getItemDetails(_itemId).then((details)\
    \ => set(details));\n  },\n  \"Loading...\"\n);\n```\n\n上面的代码创建了一个 `derived` store，每当\
    \ ID 变化时，它都会根据 ID 获取项目的详情，并初始显示 `\"Loading...\"`。\n\n## 总结\n\n就是这些！在本系列教程第四个教程中，我们深入研究了\
    \ Svelte stores。我们学习了可以使用 `writable` 让状态在多个 Svelte 组件间可用，而这些组件只需在变量名后添加一个美元符号\
    \ `$` 即可响应更新。\n\n我们看到，它并不非得是一个 Svelte store。相反，任何实现了 `subscribe` 契约的对象都可以在 Svelte\
    \ 组件中那样使用。这允许我们使用诸如 `RxJS` 的其他库，或者创建自定义对象。Svelte stores 帮助我们管理状态，为健壮的状态管理解决方案提供了原语。\n\
    \n我们还查看了 `readable` store，它帮助我们创建从外部无法更改的状态；以及 `derived` store，它为从传入的 store 创建派生状态提供了选项。Svelte\
    \ store API 的核心非常易理解，但也能扩展到更复杂的用例。\n\n你现在准备好创建 store 来处理跨不同组件共享的状态了！在下一章中，我们将查看除使用\
    \ store 之外的组件交互，以构建健壮的应用。\n\n# 第 5 章：组件交互概念\n\n组件是 `Svelte` 等前端框架的核心。它们是组织和实现视图层的主要单元。组件封装了特定的\
    \ UI 和/或行为——例如按钮的外观、包含任意元素的列表，或页面的特定部分。\n\n在书的前半部分，我们关注的是单个组件的内部细节。我们在第 2 章中查看了模板语法，在第\
    \ 3 章中查看了响应式语句。在第 4 章中，我们查看了 Svelte stores，它为实现状态管理提供了一个方便的 API，并且可以跨组件更新。当然，还有更多方法可以将组件进行相互集成——我们将在本教程中介绍它们。读完本章后，你将能够为正确的工作使用正确的组件\
    \ API。\n\n## 使用其他组件\n\n组织代码的关键部分是将每个部分放在最合适的位置。这意味着编写和复用组件。我们可以通过作为默认导入来引入另一个组件，然后在模板内部像使用普通元素标签一样使用它：\n\
    \n```svelte\n<script>\n  import SomeOtherComponent from \"../somewhere/else/SomeOtherComponent.svelte\"\
    ;\n</script>\n\n<SomeOtherComponent />\n```\n"
- fmt: "\nThe list is now displayed and we can reload it, but the look of a list entry\
    \ is fixed; we can’t change it from the outside. To change that, we use slots.\
    \ A `slot` is like a placeholder where its content is determined by the parent.\
    \ Let’s first define our slot in our list component:\n\n```\n<script>\n  // ...\n\
    </script>\n\n{#if showReload}\n  <button on:click>Reload list</button>\n{/if}\n\
    <ul>\n  {#each items as item}\n    <li>\n      <slot {item}>\n        {item}\n\
    \      </slot>\n    </li>\n  {/each}\n</ul>\n```\n\nThe `<slot>` tag marks the\
    \ section as the destination for the parent’s content. The `{item}` property means\
    \ that the parent is able to use the `item` when providing the UI. Otherwise,\
    \ we would have no way to output the item’s text in the parent. The content inside\
    \ the `<slot>` is its fallback content, in case the parent component doesn’t provide\
    \ its own UI. The fallback content is optional; you don’t need to provide it.\n\
    \nLet’s use the component slot in the parent component:\n\n```\n<script>\n  import\
    \ List from \"./List.svelte\";\n  // ...\n</script>\n\n<List items={list} showReload={true}\
    \ on:reload={reloadList} let:item>\n  <b>{item}</b>\n</List>\n```\n\nWe chose\
    \ to simply put the item’s text into a `<b>` tag, making it bold. The UI for the\
    \ slot is inside the component’s tag. We can use the `item` property passed into\
    \ the slot by writing `let:item`. If we wanted to rename the property, we would\
    \ write `let:item={anotherVariableName}`.\n\nThe slot above is the default slot.\
    \ We can also use named slots to provide more than one of them, which can appear\
    \ in different areas. Giving the slot a name is as easy as writing `<slot name=\"\
    desiredName\" />`, and using it is just as easy by adding a `slot=\"desiredName\"\
    ` attribute to the parent’s element, which should go into a specific slot. If\
    \ there was an “empty list placeholder” slot, it could look like this:\n\n```\n\
    <!-- ... -->\n<List items={list} showReload={true} on:reload={reloadList} let:item>\n\
    \  <b>{item}</b>\n  <!-- you can use let:xx on the named slot as well if the component\
    \ passes slot properties -->\n  <p slot=\"empty\">List is empty</p>\n</List>\n\
    ```\n\nThe following screenshot visualizes the slot feature.\n\n![Visualized slots\
    \ example](Images/svelte5-slots.png)\n\n## Using the Module Script to Manage Instances\
    \ of the Same Component\n\nThe reload feature of the list is a big success—so\
    \ big, indeed, that the boss now asks for a “Reload all” button somewhere at the\
    \ top of the page. For situations like this—where we need to manage and/or coordinate\
    \ multiple component instances of the same type, or just run code outside of the\
    \ component lifecycle but colocate it with the component—we can use the `module`\
    \ script tag. This is another script tag with an additional `context=\"module\"\
    ` attribute on it. The code inside this script tag runs only once and right away.\
    \ Think of it as a separate JavaScript file, but colocated with the Svelte component.\
    \ Let’s use this to implement the “Reload all” behavior:\n\n```\n<script context=\"\
    module\">\n  let reloads = new Set();\n  export function reloadAll() {\n    reloads.forEach((reload)\
    \ => reload());\n  }\n</script>\n\n<script>\n  import { createEventDispatcher,\
    \ onMount } from \"svelte\";\n\n  export let items;\n  export let showReload =\
    \ false;\n\n  const dispatch = createEventDispatcher();\n\n  onMount(() => {\n\
    \    const reload = () => dispatch(\"reload\");\n    reloads.add(reload);\n  \
    \  return () => reloads.delete(reload);\n  });\n</script>\n\n<!-- ... -->\n```\n\
    \nWe create a `Set` that contains all “reload” `dispatch` functions. Every time\
    \ a list instance is created, we encapsulate our `dispatch` function and add it\
    \ to the `Set`. When the component instance is destroyed, we remove it. What’s\
    \ left to do now is to use the exported `reloadAll` function where the “Reload\
    \ all” button is implemented:\n\n```\n<script>\n  import { reloadAll } from \"\
    ../somewhere/List.svelte\";\n</script>\n\n<button on:click={reloadAll}>Reload\
    \ all</button>\n```\n\nThe default import of a Svelte component is the component\
    \ constructor itself. Named imports are those that are exported from the module\
    \ script. That way, we can easily import `reloadAll` and call it when appropriate.\n\
    \n![Module script in relation to instance scripts](Images/svelte5-module-script.png)\n\
    \nYou’ll need module scripts only occasionally, but when you do, they’ll come\
    \ in very handy to allow imperative interaction with your component(s) or for\
    \ managing and coordinating multiple instances of the same type. Another example—from\
    \ Svelte’s own tutorial—deals with having an audio player component rendered multiple\
    \ times, but only allowing one of them to play at the same time. This is also\
    \ easily done with module scripts.\n\n## Using Context to Provide State to Component\
    \ Trees\n\nOne day after the “Reload all” feature goes live, the boss comes to\
    \ realize that it’s probably not a good idea to actually reload all lists, but\
    \ rather just specific ones. The calculation whether or not a certain area of\
    \ the page with lists in it should support reloading is done near the root of\
    \ these. This is called property drilling. For situations like this, providing\
    \ context to child comes in handy. This is what it looks like:\n\n```\n<!-- somewhere\
    \ in a parent component -->\n<script>\n  import { setContext } from 'svelte';\n\
    \  setContext('partOfAll', someComputationThatReturnsABolean());\n  // ...\n</script>\n\
    \n<!-- in List.svelte -->\n<script>\n  import { getContext, onMount } from 'svelte';\n\
    \  // ...\n  const isPartOfAll = getContext('partOfAll');\n  onMount(() => {\n\
    \    if (!isPartOfAll) {\n      return;\n    }\n    const reload = () => dispatch(\"\
    reload\");\n    reloads.add(reload);\n    return () => reloads.delete(reload);\n\
    \  });\n```\n\nThese two functions—`setContext` and `getContext`—allow us to provide\
    \ specific things to all children of the component where thing is provided. This\
    \ is similar to `useContext` in React, `provide`/`inject` in Vue, or a service\
    \ provided on Angular. Note that you need to call these functions during component\
    \ initialization. You can’t call them later in the life cycle or asynchronously.\n\
    \n![Context visualization](Images/svelte5-context.png)\n\nIn the example above,\
    \ we passed a string as the key, but you could also use a `Symbol` or something\
    \ else that’s guaranteed to be unique. The value can be anything you want. In\
    \ this case, it’s a simple Boolean, but it could also be a function or store.\
    \ The combination of context and stores is a nice way of providing a value that\
    \ can change over time and to which the children should be able to react. Here’s\
    \ an example:\n\n```\n<!-- somewhere in a parent component -->\n<script>\n  import\
    \ { setContext } from 'svelte';\n  import { writable } from 'svelte/store';\n\
    \  const count = writable(1);\n  setContext('count', count);\n  // ...\n</script>\n\
    \n<!-- somewhere in a child component -->\n<script>\n  import { getContext } from\
    \ 'svelte';\n  const count = getContext('count');\n</script>\n<p>The count is\
    \ {$count}</p>\n```\n\nIf you have state that’s available globally, you can of\
    \ course skip using context and instead just import that state from a central\
    \ location. This is what we did in the previous part of the application using\
    \ stores.\n\n## Wrapping Up\n\nThis was a long one! We’ve seen quite a few component\
    \ interaction concepts in this tutorial. To summarize:\n\n*   Use component properties\
    \ and events to implement basic component interaction.\n\n*   Use slots when you\
    \ need to provide a custom UI from the parent at a certain place in the child.\n"
