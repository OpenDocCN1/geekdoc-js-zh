    \ because Svelte sees the dependency between them. The `console.log` statement\
    \ at the end stays untouched and runs last, because it has no dependency to `doubled`\
    \ or `quadrupled` or something that needs to run before they run:\n\n```\n<script>\n\
    \  let count = 0;\n  $: quadrupled = doubled * 2; // runs 2nd\n  $: doubled =\
    \ count * 2; // runs 1st\n  $: console.log(quadrupled); // runs 3rd\n  $: console.log(count);\
