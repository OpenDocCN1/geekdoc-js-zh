  trans: "\n\n```html\n<script>\n  // ...\n  $: if (someVariable < 100) {\n    //\
    \ ...\n  }\n  // ...\n</script>\n```\n\n上述代码会在 `someVariable` 或响应式语句中的任何内容发生更新时执行，但只有在满足\
    \ `if` 条件时才会进入语句体。你可以将其用作替代方案，用于从语句中隐藏变量；同时，还可以通过将其作为 `if` 语句中的一个占位条件（dummy condition），在正体中未使用的变量发生变化时重新运行该语句。\n\
    \n大多数情况下，你不需要关心依赖关系。与 `React` 相比，这让人轻松很多，因为在 hooks 的上下文中，你需要非常显式地声明依赖项。在 Svelte\
    \ 中，大多数情况下它都会像你预期的那样“自动运行”，如果你需要微调执行行为，可以通过使用上面显示的技术之一轻松地调整代码。\n\n让我们通过看另一个例子来总结这些发现。下面的截图显示了响应式语句运行的顺序。箭头表示对其他响应式语句的依赖。`multiplied`\
    \ 先运行，因为它依赖于 `count`。`doubleMultiplied` 第二个运行，因为它依赖于 `multiplied`。`refreshDetails()`\
    \ 第三个运行，因为它依赖于 `doubleMultiplied`。`console.log(count)` 最后运行，因为它写在所有其他响应式语句之后，且没有其他语句需要它先运行。当\
    \ `multiplyBy` 发生变化时，没有任何语句会重新运行，因为它们没有一个对它有直接依赖。\n\n![响应式语句排序](img/execution-order.png)\n\
    \n## 响应式语句只运行一次\n\n在之前的章节中不清楚但可能重要的有一点是响应式语句的执行时机。如果一个普通变量被重新赋值，Svelte 会在下一次浏览器绘制（paint）时调度更新。在调度和绘制之间就是响应式语句执行的时间——但它们只执行一次。这意味着，如果一个响应式语句写入之前运行过的响应式语句正在读取的变量，那么该响应式语句将不会重新运行。这防止了无限循环、性能问题，并且使得某些响应式语句编写可行。让我们再次看看上面的响应式语句：\n\
    \n```html\n<script>\n  let count = 0;\n  let prevCount = 0;\n  let countWentUp\
    \ = false;\n  $: {\n      countWentUp = prevCount < count;\n      prevCount =\
    \ count;\n  }\n</script>\n```\n\n这个响应式语句读取 `prevCount`，但也写入了 `prevCount`。如果该语句运行多次，将意味着它会立即再次失效，导致无限循环，并且最终始终给\
    \ `countWentUp` 赋值为 `false`，这违背了它的初衷。就像依赖关系一样，大多数情况下这不需要担心，因为编写响应式语句感觉非常自然。但一旦你进入更复杂的用例，记住这一点是有好处的。\n\
    \n![不重新运行](img/no-rerun.png)\n\n## 总结\n\n本教程介绍了响应式语句。我们可以使用它们来响应其他变量的赋值，以执行副作用或创建计算变量。在\
    \ Svelte 中，响应式语句是通过查看直接依赖关系进行排序的，并被调度在变量赋值后运行。如果无法确定顺序，它们将按照声明的顺序运行。我们可以利用这一点，通过将变量移动到函数中从依赖项中隐藏它们，或者向语句中添加额外的变量来重新触发该语句的执行。如果在同一次运行期间，后执行的响应式语句更新了它们依赖的变量，则之前的响应式语句不会重新运行。考虑到这些，你现在已经准备好响应所有事情了！\n\
    \n这标志着我们专门关注单个组件内部结束。在第一章中，我们了解到 Svelte 是一个编译器，提供一些独特的优势，我们在本章中也看到了。在第二章中，我们仔细查看了组件语法，了解了如何向\
    \ HTML 代码添加动态行为。接下来的章节将涉及如何将组件相互整合。我们将首先查看 Svelte stores（存储），它们为我们提供了一个简单而强大的\
    \ API 来处理应用程序中的跨组件状态。\n\n# 第 4 章：Stores\n\nSvelte 在 Svelte 组件内部的响应式是直观且容易的。因为\
    \ Svelte 是一个编译器，它可以将普通的变量赋值转换为 UI 在变化时会重新渲染的内容（正如我们在第 2 章中看到的）。响应式赋值使得衍生或计算变量变得非常简单（正如我们在第\
    \ 3 章中看到的）。\n\n在 Svelte 组件之外，我们有不同的思维模型，代码没有固有的连接的 UI 层，且 Svelte 编译器不会触碰 Svelte\
    \ 文件之外的代码。但如果我们也想在 Svelte 组件之外获得响应性的妙处呢？如果我们有一个位于 JavaScript 文件中的全局状态，当它变化时，许多组件应该对其做出响应怎么办？这就是\
    \ Svelte stores 用用场场。在本章中，我们将仔细查看 store API、如何使用它来构建封装良好的模块，以及如何在 Svelte 组件内部轻松地使用它们。\n\
    \n作为整个教程的实际示例，让我们选择一个可能在几乎所有应用程序中全局可用的东西：用户状态。在这个例子中，该状态将包含用户是否登录，以及如果他们登录了，他们的用户名。页面上有一个区域仅对身份验证的用户可见，如果他们登录了，他们的用户名始终在顶栏可见。\n\
    \n![用户应用](img/svelte4-app.png)\n\n这个应用肯定不会为我们赢得任何设计奖，但它帮助我们展示了在这个应用程序中处理全局状态的问题。应用程序的根部如下：\n\
    \n```html\n<script>\n    import Topbar from './Topbar.svelte';\n    import AuthOnly\
    \ from './AuthOnly.svelte';\n</script>\n\n<Topbar />\n<div>\n    <p>\n       \
    \ 页面的这部分始终可见\n    </p>\n</div>\n<div>\n    <p>\n        这部分仅对登录用户可见\n    </p>\n\
    \    <AuthOnly />\n</div>\n\n<style>\n    div {\n        border: 1px solid blue;\n\
    \        padding: 5px 10px\n    }\n</style>\n```\n\n该组件使用了其他组件。为了做到这一点，我们在 `<script>`\
    \ 标签中将它们作为默认导入导入。然后我们可以在模板中使用与默认导入相同的名称来使用它们。（我们将在系列的第 5 部分更深入地研究组件交互。）\n\n`Topbar.svelte`\
    \ 看起来如下：\n\n```html\n<div>\n    如何在这里获取用户名？\n</div>\n\n<style>\n    div {\n  \
    \      background: lightgrey;\n        padding: 5px;\n        text-align: right;\n\
    \    }\n</style>\n```\n\n而 `AuthOnly.svelte` 看起来如下：\n\n```html\n<script>\n   \
    \ let authenticated = false;\n</script>\n\n{#if authenticated}\n    <p>\n    \
    \    超级秘密的内容！\n    </p>\n{:else}\n    <button on:click={() => authenticated =\
    \ true}>登录</button>\n{/if}\n```\n\n`Topbar` 和 `AuthOnly` 组件都需要访问用户状态；通过属性传递并不是一个选项。在这个简单的示例中，我们只需要将用户状态传递给一个组件，但在现实中这几乎不会发生。所以我们需要另一个地方来共享状态。此外，`AuthOnly`\
    \ 需要更新状态以登录用户。现在我们把状态放在哪里呢？最好将其放在一个导出状态的 JavaScript 文件中，这样所有人都可以访问。让我们试试吧！\n\n\
    ## 第一次尝试\n\n创建一个包含如下内容的 `user.js`：\n\n```javascript\nexport let user = { loggedIn:\
    \ false };\nexport function login() {\n  user = { loggedIn: true, name: \"Dr.\
    \ Svelte\" };\n}\n```\n\n我们还在 `Topbar.svelte` 中导入了 `user` 状态：\n\n```html\n<script>\n\
    \  import { user } from './user';\n</script>\n\n<div>\n    {user.name || '未登录'}\n\
    </div>\n\n<!-- style... -->\n```\n\n"
- fmt: "\nWe do the same in `AuthOnly.svelte`, where we also call the `login` function:\n\
    \n```svelte\n<script>\n    import { user, login } from './user';\n    let authenticated\
    \ = user.loggedIn;\n</script>\n\n{#if authenticated}\n    <p>\n        Super secret\
    \ stuff!\n    </p>\n{:else}\n    <button on:click={() => login()}>Log In</button>\n\
    {/if}\n```\n\nThis will correctly show a logged-out state in the beginning, but\
    \ we somehow can’t get the login to propagate back to the components. Why? After\
    \ all, doesn’t this work the same inside Svelte files? The reason is that the\
    \ Svelte compiler only looks at Svelte files to do its transformation. JavaScript\
    \ files are left as they are. Furthermore, the semantics inside a JavaScript file\
    \ are different; there’s no direct connection to a view layer. Therefore, we somehow\
    \ need to explicitly express the state as an object that can change over time,\
    \ which Svelte components can react to. This is where Svelte stores come in.\n\
    \n## Introducing Writable Stores\n\nSvelte provides a very simple API for initializing\
    \ and updating a store. A `store` is something that stores (hence the name) a\
    \ value (also called state) to which others can subscribe, and get notified about\
    \ updates to the value of that store.\n\nAt the heart of Svelte’s store API is\
    \ the `writable` function, which provides this functionality. The `writable` function\
    \ is called with the initial state and returns and an object with `set`, `update`\
    \ and `subscribe` methods. `set` is called with the new desired state. `update`\
    \ is called with a function that gets the current state and is expected to return\
    \ the next state. `subscribe` is called with a callback function that’s invoked\
    \ every time the state changes, and returns a function that can be called to unsubscribe:\n\
    \n```javascript\nimport { writable } from \"svelte/store\";\n\nconst store = writable(\"\
    initial value\");\n\nconst unsubscribe = store.subscribe((value) =>\n  console.log(\"\
    the current value is \" + value)\n);\n\nstore.set(\"new value\");\n\nstore.update((value)\
    \ => value + \" 2\");\n\nunsubscribe();\n\nstore.set(\"another value\");\n```\n\
    \nIn the code snippet above, the value is `\"initial value\"` first, then `\"\
    new value\"`, then `\"new value 2`. All these strings are logged, because the\
    \ `subscribe` callback function is called each time and logs them out. The `subscribe`\
    \ function returns an `unsubscribe` function. After it’s called, updates to the\
    \ store—in this case, `\"another value\"`—are no longer logged. If you know RxJS,\
    \ this API may look familiar to you, and indeed, the API closely follows the principle\
    \ of observables.\n\nLet’s apply the `writable` to our use case:\n\n```javascript\n\
    import { writable } from \"svelte/store\";\nexport let user = writable({ loggedIn:\
    \ false });\nexport function login() {\n  user.set({ loggedIn: true, name: \"\
    Dr. Svelte\" });\n}\n```\n\nWe change the code in our JavaScript file and wrap\
    \ the state with the `writable`. This means we need to adjust our Svelte components\
    \ to subscribe to the state. Here’s a first attempt in `Topbar.svelte`:\n\n```svelte\n\
    <script>\n  import { user } from './user';\n  import { onDestroy } from 'svelte';\n\
    \  let _user;\n  const unsubscribe = user.subscribe(u => _user = u);\n  onDestroy(unsubscribe);\n\
    </script>\n\n<div>\n    {_user.name || 'Not logged in'}\n</div>\n\n<!-- style...\
    \ -->\n```\n\nThis works! If we press `login` inside `AuthOnly.svelte`, we’ll\
    \ see the name “Dr. Svelte” appear in the top bar. The solution is a little boilerplate-y,\
    \ though: we have to subscribe to the store, assign it to a local variable, and\
    \ remember to unsubscribe when the component is destroyed. Can we do better? This\
    \ is where Svelte’s big advantage comes in again: the fact that it’s a compiler.\
    \ Since the compiler will transform Svelte files to JavaScript files anyway, it\
    \ also can do transformations to get rid of the subscription boilerplate. All\
    \ we have to do is to put a dollar sign in front of the store and Svelte will\
    \ take care of the rest:\n\n```svelte\n<script>\n  import { user } from './user';\n\
    </script>\n\n<div>\n    {$user.name || 'Not logged in'}\n</div>\n\n<!-- style...\
    \ -->\n```\n\nJust like with reactive statements (which we covered in Part 3),\
    \ the dollar sign is used for some reactive Svelte magic. Declaring (not using)\
    \ variable names with a dollar sign in front is prohibited in Svelte files. Instead,\
    \ they’re a sign to the compiler to generate all the subscription boilerplate\
    \ for us that we previously wrote by hand. This even works for updating the store.\
    \ If we were to write `$user.name = \"Dr. Dollarsign` or `$user = { loggedIn:\
    \ false }` inside a Svelte component, this would be transformed to a store update\
    \ by the Svelte compiler. Neat! But note that it’s not possible to use the `$`\
    \ syntax to subscribe to stores that aren’t created at the top level (imports\
    \ are top level, so that works). We also can’t subscribe to a store that’s nested\
    \ inside an object: we first need to extract it into a top-level variable. These\
    \ limitations are worth keeping in mind, but you’ll probably only rarely encounter\
    \ them.\n\n![Store compilation output](Images/svelte4-store-compilation.png)\n\
    \nSubscribing to a store through the dollar sign syntax doesn’t only work for\
    \ Svelte stores. Every object that satisfies the store contract (in other words,\
    \ providing a `subscribe` method) can be used that way. If you prefer to use RxJS,\
    \ for example, you could use the exact same `$user` syntax to subscribe to the\
    \ observable. We can use this to our advantage to create our own encapsulated\
    \ user API. Right now, everyone is able to update the user state directly, because\
    \ we expose the whole `writable`. To ensure everyone using the user state has\
    \ to go through the API to update the state, we can create our own store like\
    \ this:\n\n```javascript\nimport { writable } from \"svelte/store\";\n\nlet _user\
    \ = writable({ loggedIn: false });\n\nfunction login() {\n  _user.set({ loggedIn:\
    \ true, name: \"Dr. Svelte\" });\n}\n\nexport const user = {\n  subscribe: _user.subscribe,\n\
    \  login,\n};\n```\n\nWe then need to adjust our `AuthOnly.svelte` component like\
    \ this:\n\n```svelte\n<script>\n  import { user } from './user';\n  $: authenticated\
    \ = $user.loggedIn;\n</script>\n\n{#if authenticated}\n    <p>\n        Super\
    \ secret stuff!\n    </p>\n{:else}\n    <button on:click={() => user.login()}>Log\
    \ In</button>\n{/if}\n```\n\nWe can keep using the `$user` syntax, and update\
    \ the state through a method on that object. Doing something like `$user.loggedIn\
    \ = true` or `user.set({ loggedIn: true })` is no longer possible, because the\
    \ `set` method of the `writable` is no longer exposed. Also note how we can use\
    \ `$user` inside the `script` tag and within reactive statements. It’s just a\
    \ variable we can use anywhere in the component.\n\nThe following screenshot visualizes\
    \ the state flow of our example app.\n\n![Store Flow](Images/svelte4-store-flow.png)\n\
    \n## Readable Stores\n\nSometimes we may want to create a store that’s not updatable\
    \ from the outside at all. One use case is to make sure that no one (not within\
    \ within the file) updates the store from the outside, because it should be self\
    \ contained—for example, a clock that updates every second and that can’t be reset\
    \ or adjusted from the outside. In this case, we can reach for `readable`:\n\n\
    ```javascript\nimport { readable } from \"svelte/store\";\n\nconst time = readable(null,\
    \ (set) => {\n  set(new Date());\n\n  const interval = setInterval(() => {\n \
    \   set(new Date());\n  }, 1000);\n\n  return () => clearInterval(interval);\n\
    });\n```\n\nThe code above creates a store that doesn’t have a `set` or `update`\
    \ method, but only a `subscribe` method. We can’t set the state from the outside.\
    \ The initial state of the `readable` is set through the first parameter; the\
    \ second parameter is a function that’s called every time the subscriber count\
    \ goes from zero to one. It’s handed a `set` function that we can use to update\
    \ the state from the inside—in this case, the current time each second. We can\
    \ return a function that’s called when the subscriber count goes from one to zero.\
    \ In this case, we clean up our interval.\n"
