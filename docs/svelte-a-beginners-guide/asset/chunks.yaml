    \ In the end, you’ll be able to create applications in Svelte that scale. We’ll\
    \ start with taking a deep dive into Svelte’s template syntax.\n\nSimilar to Angular\
    \ or Vue, Svelte enhances the HTML syntax with several features for expressing\
    \ dynamic properties, loops, and more. We’ll take a look at each of them and see\
    \ how they help you write readable code. One of the nice things about Svelte is\
    \ that you can start with “just HTML” and gradually enhance your markup with dynamic\
    \ features. You do so by using special syntax—called HTMLx in Svelte—that acts\
    \ as an enhancement of HTML. We’ll use this syntax to gradually enhance the following\
    \ code, which represents the initial draft of a to-do app:\n\n```\n<label>\n \
    \   New To-Do\n    <!-- To implement: make this update the list -->\n    <input\
    \ type=\"text\" />\n</label>\n\n<!-- To implement: only show this if we don't\
    \ have a to-do yet -->\n<p>What do you want to work on?</p>\n\n<ul>\n    <!--\
    \ To implement: make this a dynamic list -->\n    <li>An item</li>\n</ul>\n```\n\
    \nThe snippet above shows what we want to accomplish with our little app: to be\
    \ able to enter new to-do items and show them in a list. Other things like marking\
    \ them as done is out of scope for now, but you are of course free to add them\
    \ yourself after having finished reading this tutorial.\n\nThe final app will\
    \ look something like the image below.\n\n![To-do App](Images/svelte2-app.png)\n\
    \n## Control Flow Syntax\n\nTo start, we want to make the list dynamic and render\
    \ an array of text entries as our to-do list. To achieve that, we’ll need to add\
    \ a `<script>` block to be able to put our list of to-dos in a variable. We’ve\
    \ seen in the first chapter that we’re able to write regular JavaScript code into\
    \ the contents of a `<script>` tag, and its variables and functions are then available\
    \ in the template. We then reach for the `#each` block—one of currently four control\
    \ flow blocks in Svelte—to loop over the list of to-dos in the template:\n\n```\n\
    <script>\n    let todos = ['Learn Svelte', 'Create great things'];\n</script>\n\
    \n<!-- ... -->\n\n<ul>\n    <!-- syntax: {#each <arrayname> as <entry>} loop content\
    \ {/each} -->\n    {#each todos as todo}\n        <li>{todo}</li>\n    {/each}\n\
    </ul>\n```\n\nAs you can see, Svelte chooses a different approach to its template\
    \ syntax compared to Vue or Angular. While the latter two add control flow syntax\
    \ such as loops in the form of special attributes, Svelte creates distinct syntax\
    \ for it. This makes the code more readable, as you can more easily spot it. It\
    \ also makes it unnecessary to create wrapper elements if you want to contain\
    \ more than one top-level item within the control flow block.\n\nThe text of one\
    \ to-do item is outputted by surrounding the variable with curly braces. In general,\
