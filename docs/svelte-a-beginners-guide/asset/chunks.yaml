  trans: "\n正如你所见，Svelte 为我们所有的需求提供了解决方案，我们将在本系列中介绍这些方案。\n\n## 准备好了吗，准备好……Svelte？\n\
    \n那么，在你的下一个项目中使用 Svelte 安全吗？你的经理可能会问 Svelte 在未来几年内是否还会存在，还是会像之前的前端框架明星一样销毁。虽然没有像\
    \ Angular 和 React 那样有一家大公司支持 Svelte 的整个开发，但 Vue 已经证明这并不是问题。此外，正如开头提到的，Svelte 的创建者\
    \ Rich Harris 现在正在全职投入其中。随着 Svelte 气气的持续上升，没有迹象表明它在未来几年会消失。\n\n选择框架的另一个方面是生态系统及其工具。与\
    \ React 相比，它的生态系统仍然较小，但每天都有新库出现，并且已经有很多非常优秀的组件库。同时，由于 Svelte 非常接近原生 HTML 和 JavaScript，你可以非常轻松地将任何现有的\
    \ HTML/JavaScript 库集成到你的代码库中，而无需封装库。\n\n在工具方面，Svelte 的表现看起来不错。有一个活跃维护的官方 VS Code\
    \ 扩展，还有一个底层的语言服务器可以供许多其他 IDE 使用以集成智能补全。IntelliJ 也有 Svelte 的插件，并且最近聘请了其创建者在 JetBrains\
    \ 工作。还有各种工具可以将 Svelte 与各种打包器集成。而且是的，你也可以在 Svelte 中使用 TypeScript。\n\n如果你正在构建一个完整的网站或\
    \ Web 应用，你可能还会感兴趣查看 [SvelteKit](https://kit.svelte.dev/)。它提供了极佳的开发体验，并带有灵活的基于文件的路由。它还允许你部署到许多不同的平台，如\
    \ Vercel、Netlify、你自己的 Node 服务器，或简单的静态文件服务器，取决于你的应用程序的功能和需求。\n\n### Svelte 总结\n\
    \n简而言之，这里是 Svelte 需要记住的重要点：\n\n* 它有全职维护者\n* 它有良好的工具\n* 它的功能是稳定的\n* 它的生态系统正在增长\n\
    * 可以使用 SvelteKit 快速构建应用\n\n总结一下：Svelte 绝对准备好用于你的下一个项目了！如果你想尝试并了解更多信息，本教程系列将为你解答。在第\
    \ 2 章中，我们将仔细查看模板语法。在第 3 章中，我们将查看响应式语句以及它们如何帮助我们响应变量变化或派生计算变量。在第 4 章中，我们将查看 store，它们将帮助我们在\
    \ Svelte 文件外部和之间处理逻辑，我们也可以将其用于状态管理。在第 5 章中，我们将查看各种组件交互概念。最后，在第 6 章中，我们将研究测试 Svelte\
    \ 应用。\n\n我们希望这引起你对 Svelte 的兴趣！\n\n## 第 2 章：模板语法\n\n在第一章中，我们介绍了 Svelte 的历史，并在编写简单组件方面迈出了第一小步。在本及后续章节中，我们将更仔细地观察编写\
    \ Svelte 代码的特定方面。最后，你将能够在 Svelte 中创建可的应用程序。我们将从深入研究 Svelte 的模板语法开始。\n\n与 Angular\
    \ 或 Vue 类似，Svelte 通过几个功能增强了 HTML 语法，用于表示动态属性、循环等。我们将查看每一个功能，并看看它们如何帮助你编写可读性代码。Svelte\
    \ 的优点之一是，你可以从“纯 HTML”开始，逐渐用动态功能增强你的标记。你通过使用特殊语法来实现——在 Svelte 中称为 HTMLx——它作为 HTML\
    \ 的增强。我们将使用这种语法逐渐增强以下代码，该代码代表待办事项应用的初始草稿：\n\n```html\n<label>\n    New To-Do\n\
    \    <!-- 实现：让这里更新列表 -->\n    <input type=\"text\" />\n</label>\n\n<!-- 实现：只有当还没有待办事项时才显示此内容\
    \ -->\n<p>你想处理些什么？</p>\n\n<ul>\n    <!-- 实现：使其成为动态列表 -->\n    <li>一个项目</li>\n\
    </ul>\n```\n\n上面的代码片段展示了我们想通过这个小应用实现的目标：能够输入新的待办事项并在列表列表中显示它们。其他事宜（如将待办事项标记为已完成）目前不在考虑范围内，但当然，你完全可以在读完本教程后自己添加这些功能。\n\
    \n最终的应用程序看起来会像下面的图片一样。\n\n![待办事项应用](img/svelte2-app.png)\n\n### 控制流语法\n\n首先，我们想让列表动态化，并将文本条数组渲染为我们的待办事项列表。为了实现这一点，我们需要添加一个`<script>`\
    \ 块，以便将待办事项列表放入变量中。我们在第一章中看到，我们可以在 `<script>` 标签的内容中编写普通的 JavaScript 代码，其变量和函数随后可以在模板中可用。然后我们使用\
    \ `#each` 块——目前 Svelte 中四种控制流块之一——来在模板中遍历待办事项列表：\n\n```html\n<script>\n    let\
    \ todos = ['Learn Svelte', 'Create great things'];\n</script>\n\n<!-- ... -->\n\
    \n<ul>\n    <!-- 语法：{#each <arrayname> as <entry>} -->\n    {#each todos as todo}\n\
    \        <li>{todo}</li>\n    {/each}\n</ul>\n```\n\n正如你所见，Svelte 在模板语法上与 Vue\
    \ 或 Angular 采取了不同的方法。虽然后两者增加了循环等控制流语法，但 Svelte 为此创建了独特的语法。这使得代码更具可读性，因为你可以更容易发现它。它还让如果你想在控制流块中包含多个顶层项目时，就不需要创建封装元素。一个待办事项项的文本通过用大括号包裹变量来输出。\n\
    \n通常情况下，每当你遇到大括号，你就知道自己正在进入与 Svelte 相关的内容。\n\n#### 寻找大括号！\n\n让我们使用另一个控制流块来解决第二个任务：即当我们还没有待办事项时显示消息。我们将使用\
    \ `#if` 块：\n\n```html\n<script>\n    let todos = ['Learn Svelte', 'Create great\
    \ things'];\n</script>\n\n<!-- ... -->\n\n{#if todos.length === 0}\n    <p>你想处理些什么？</p>\n\
    {:else}\n    <ul>\n        {#each todos as todo}\n            <li>{todo}</li>\n\
    \        {/each}\n    </ul>\n{/if}\n```\n\n### 更多控制流\n\n`if` 块读起来非常像普通的 JavaScript\
    \ `if` 块。块以 `{#if ..}` 开始，并可以有多个 `{:else ..}` 分支以及一个最终的 `{:else}` 分支。和普通的 if 块一样，后两者是可选的。通过编写\
    \ `{/if}` 关闭块。通常，控制流语法是 `{#<name> ..} .. {:<possibly something>} .. {/<name>}`。井号标记块的开始，冒号标记可选分支（冒号后面的文本取决于控制流块），斜杠标记块的结束。\n\
    \n`#if` 和 `#each` 可能是你最常使用的，但还有两个控制流块在某些也会派上用场。\n\n第一个是 `#await` 块，它允许你在标记中使用\
    \ Promise：\n\n```html\n{#await somePromise}\n  Loading..\n{:then result}\n  结果是\
    \ {result}\n{:catch error}\n  噢不！发生了错误：{error}\n{/await}\n```\n"
- fmt: "\nAs shown above, it’s possible to handle all states of a promise, from loading\
    \ the result to catching errors. Just like we’ve seen with `#if`, the syntax and\
    \ semantics closely match that of using promises in regular JavaScript: you `#await`\
    \ the promise, `{:then ...}` is very similar to the `.then(..)` function of a\
    \ promise object, and `{:catch ...}` is very similar to the corresponding `.catch(..)`\
    \ function of a promise object. The branches are all optional, and you can also\
    \ skip showing the loading branch by doing `{#await somePromise then result}..{/await}`.\n\
    \n![Syntax similarities between Svelte and JavaScript control flow blocks](Images/syntax-similarities.png)\n\
    \nThe last control flow block is `#key`, which was added more recently. It destroys\
    \ and recreates everything inside it if the value passed to it changes:\n\n```\n\
    {#key someValue}\n  I get destroyed and recreated every time someValue changes\n\
    {/key}\n```\n\nThis is useful mainly in two scenarios. The first scenario is when\
    \ you have component where it’s easier to recreate its state and contents from\
    \ scratch rather than updating it—for example, when you wrap a third-party library\
    \ inside that doesn’t provide a good update mechanism. The second scenario is\
    \ when you want to replay a transition. A transition is a kind of animation that’s\
    \ only triggered when an element is created or destroyed.\n\nLet’s get back to\
    \ our example, which now looks like this:\n\n```\n<script>\n    let todos = ['Learn\
    \ Svelte', 'Create great things'];\n</script>\n\n<label>\n    New To-Do\n    <!--\
    \ To implement: make this update the list -->\n    <input type=\"text\" />\n</label>\n\
    \n{#if todos.length === 0}\n    <p>What do you want to work on?</p>\n{:else}\n\
    \    <ul>\n        {#each todos as todo}\n            <li>{todo}</li>\n      \
    \  {/each}\n    </ul>\n{/if}\n```\n\nWe’re now able to differentiate between having\
    \ an empty list and having to-dos, and we can render each of them into a list.\
    \ Awesome!\n\n## Adding New To-dos Using Events and Bindings\n\nWhat’s left is\
    \ to be able to add new to-do items to the list. When we type into the text box\
    \ and press `enter`, we want to add that text as a new item to the list. A first\
    \ version looks like this:\n\n```\n<script>\n    let todos = ['Learn Svelte',\
    \ 'Create great things'];\n    let newTodo = '';\n    function handleKeyup(evt)\
    \ {\n        if (evt.key === 'Enter') {\n            todos = [...todos, newTodo];\n\
    \            newTodo = '';\n        }\n        newTodo = evt.target.value;\n \
    \   }\n</script>\n\n<label>\n    New To-Do\n    <input type=\"text\" value={newTodo}\
    \ on:keyup={handleKeyup} />\n</label>\n\n<!-- ... -->\n```\n\nThere are a few\
    \ things going on here, let’s go through them one by one.\n\nFirst, we set the\
    \ `value` attribute of the input by assigning it to the value of `newTodo`. Whenever\
    \ `newTodo` is updated, the input text will also be updated. If we had given the\
    \ variable the same name as the attribute, we could have written `{value}`, which\
    \ is the shorthand of `value={value}`. These shorthands can be used whenever the\
    \ variable and attribute name are the same.\n\nNext, we listen to the `keyup`\
    \ event of the input. There are numerous DOM events, all starting with `on`—in\
    \ this case `onkeyup`. To tell Svelte to hook into the event, we just add a colon\
    \ between `on` and the rest of the event name—so in this case it’s `on:keyup`.\
    \ After that, we use the curly braces and place the name of the function inside.\
    \ The function is called each time the event fires off. You could also place an\
    \ anonymous function in there, if you like.\n\nInside `handleKeyup`, we then listen\
    \ to the keyup event and act accordingly. We update `newTodo` whenever we enter\
    \ a character, and when we press `enter`, we add the text to the list of to-dos\
    \ and then reset the input value. Notice how we didn’t need any extra function\
    \ like `setState` to tell Svelte to rerender in reaction to a variable change.\
    \ Svelte knows when to rerender by looking for assignment operators, so it knows\
    \ which variable is dirty. When compiling a Svelte component, it will wrap these\
    \ assignments with a function call that tells the runtime to rerender on the next\
    \ browser paint. Be careful, though, as this means that only doing `todos.push(newTodo)`\
    \ won’t work: Svelte will only mark variables dirty that were updated through\
    \ assignments. Writing `todos.push(newTodo); todos = todos;` would therefore be\
    \ okay.\n\nThe code above works, but we can do a little better. Instead of manually\
    \ keeping `newTodo` in sync with the input value by listening to the `keyup` event,\
    \ we can also use a binding. The result looks like this:\n\n```\n<script>\n  \
    \  let todos = ['Learn Svelte', 'Create great things'];\n    let newTodo = '';\n\
    \    function handleKeyup(evt) {\n        if (evt.key === 'Enter') {\n       \
    \     todos = [...todos, newTodo];\n            newTodo = '';\n        }\n   \
    \ }\n</script>\n\n<label>\n    New To-Do\n    <input type=\"text\" bind:value={newTodo}\
    \ on:keyup={handleKeyup} />\n</label>\n\n<!-- ... -->\n```\n"
