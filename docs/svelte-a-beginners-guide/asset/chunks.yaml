    \nAnd that’s it! Just by importing one of the built-in transitions and applying\
    \ it by adding `transition:fade` to the element, we get that smooth fade-in transition.\
    \ Our mini app is now finished. This doesn’t contain the topbar and the background\
    \ gradient yet, but it should be easy now for you to add this as well. This is\
    \ the end result:\n\n```\n<script>\n  import { fade } from 'svelte/transition';\n\
