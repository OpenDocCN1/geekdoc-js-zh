    \n## Architectural Considerations\n\nWe’ve seen how to write a little app in Svelte\
    \ with just 32 lines of code. We’ve only scratched the surface, of course. A full-blown\
    \ app needs some kind of state management, multiple components, and ways to integrate\
    \ these components with each other.\n\nFor example, it would make sense to split\
    \ out the display of one to-do item into a separate component, as we’ll add features\
    \ like editing the name in-place or marking it as done. Having this all in one\
    \ component would become hard to maintain over time. Luckily, using other components\
    \ is as easy as importing it as a default import from another Svelte file and\
    \ interacting with it in a similar way to what we’ve already seen with regular\
    \ DOM elements. We’ll look into component interaction in more detail in Part 5\
    \ of this series.\n\nAnother example would be the management of to-dos. Right\
    \ now, they’re handled inside the component and there’s no connection to a backend.\
    \ If we were to add API calls, we would mix UI logic with backend interaction,\
    \ which is generally better handled outside of components for better separation\
    \ of concerns. We can use Svelte stores for this, which we’ll look at in Part\
    \ 4."
