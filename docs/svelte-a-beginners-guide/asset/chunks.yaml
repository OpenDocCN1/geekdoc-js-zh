    \ come in. They look something like this:\n\n```\n<script>\n  // reactive declaration\n\
    \  $: foo = bar;\n  // reactive statement\n  $: {\n      something = somethingElse;\n\
    \  }\n</script>\n```\n\nSyntactically, the reactive statement is expressed by\
    \ using the dollar sign followed by a colon—`$:`. This is actually valid JavaScript\
    \ syntax. Originally, it expresses a labelled statement—`labelname : statement`—to\
    \ which you can tell JavaScript to jump when using `continue` or `break`. But\
    \ since no one uses that, Svelte has filled the void to syntactically express\
    \ its reactive statement. This means you can’t use labelled statements of the\
    \ name `$` inside Svelte files, but as you’re most likely not using labelled statements\
    \ of any kind anyway, this won’t make a difference.\n\nWith the syntax out of\
    \ the way, let’s look at the semantic meaning of reactive statements, which come\
    \ in two forms: reactive declarations and reactive statements.\n\n## Reactive\
    \ Declarations\n\nA **reactive declaration** defines a variable whose value is\
    \ dependent on other variables. A simple reactive declaration may look like this:\n\
    \n```\n<script>\n  let count = 0;\n  $: doubled = count * 2;\n</script>\n\n<p>Count:\
    \ {count}</p>\n<p>Doubled: {doubled}</p>\n<button on:click={() => count += 1}>Increase\
    \ count</button>\n```\n\nThis reactive declaration declares the variable `doubled`,\
    \ which is expressed as being the double of the variable `count`. Whenever `count`\
    \ changes, Svelte knows to also compute the new value of `doubled`. Think of reactive\
