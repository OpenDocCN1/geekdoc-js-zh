  trans: "\n如上所示，我们可以处理 promise 的所有状态，从加载结果到捕获错误。就像我们在 `#if` 中看到的那样，其语法和语义与在普通 JavaScript\
    \ 中使用 promise 高密对应：你对 promise 进行 `#await`，`{:then ...}` 非常类似于 promise 对象的 `.then(..)`\
    \ 函数，而 `{:catch ...}` 非常类似于 promise 对象对应的 `.catch(..)` 函数。这些分支都是可选的，你也可以通过 `{#await\
    \ somePromise then result}..{/await}` 来跳过显示加载分支。\n\n![Svelte 与 JavaScript 控制流块之间的语法相似性](img/syntax-similarities.png)\n\
    \n最后一个控制流块是 `#key`，它是最近添加的。如果传递给它的值发生变化，它将销毁并重建其内部的所有内容：\n\n```\n{#key someValue}\n\
    \  每当 someValue 变化时，我会被销毁并重建\n{/key}\n```\n\n这主要在两种场景下非常有用。第一种场景是你有一个组件，从头开始创建它的状态和内容比更新它更简单——例如，当你封装了一个没有提供良好更新机制的第三方库时。第二种场景是你想要重新播放过渡动画（transition）。过渡是一种在元素创建或销毁时才会触发的动画。\n\
    \n让我们回到示例，它现在看起来如下：\n\n```\n<script>\n    let todos = ['Learn Svelte', 'Create\
    \ great things'];\n</script>\n\n<label>\n    新待办事项\n    <!-- 实现：让此操作更新列表 -->\n\
    \    <input type=\"text\" />\n</label>\n\n{#if todos.length === 0}\n    <p>你想做点什么？</p>\n\
    {:else}\n    <ul>\n        {#each todos as todo}\n            <li>{todo}</li>\n\
    \        {/each}\n    </ul>\n{/if}\n```\n\n我们现在能够区分空列表和有待办事项的情况，并且可以将它们中的每一项渲染到列表中。太棒了！\n\
    \n## 使用事件和绑定添加新的待办事项\n\n剩下的工作是能够向列表添加新的待办事项。当我们在文本框中输入内容并按下 `enter` 键时，我们希望将该文本作为新项目添加到列表中。第一个版本看起来如下：\n\
    \n```\n<script>\n    let todos = ['Learn Svelte', 'Create great things'];\n  \
    \  let newTodo = '';\n    function handleKeyup(evt) {\n        if (evt.key ===\
    \ 'Enter') {\n            todos = [...todos, newTodo];\n            newTodo =\
    \ '';\n        }\n        newTodo = evt.target.value;\n    }\n</script>\n\n<label>\n\
    \    新待办事项\n    <input type=\"text\" value={newTodo} on:keyup={handleKeyup} />\n\
    </label>\n\n<!-- ... -->\n```\n\n这里发生了几点事情，让我们逐一来看。\n\n首先，我们通过将 `newTodo` 的值赋值来设置\
    \ input 的 `value` 属性。每当 `newTodo` 更新时，输入框也会随之更新。如果我们给变量起一个与属性相同的名称，我们可以写成 `{value}`，这是\
    \ `value={value}` 的简写。当变量名和属性名相同时，就可以使用这些简写。\n\n接下来，我们监听 input 的 `keyup` 事件。有许多\
    \ DOM 事件，都以 `on` 开头——在这种情况下是 `onkeyup`。要告诉 Svelte 挂钩该事件，我们只需要在 `on` 和事件名的其余部分之间添加冒号——因此在这里是\
    \ `on:keyup`。之后，我们使用大括号并将函数名放在里面。每当事件触发时都会调用该函数。如果你喜欢，也可以在里面放置一个匿名函数。\n\n在 `handleKeyup`\
    \ 内部，我们随后监听 `keyup` 事件并采取相应的行动。每当我们输入一个字符时，都会更新 `newTodo`，当我们按下 `enter` 时，我们将文本添加到待办事项列表中，然后重置输入值。注意，我们不需要任何像\
    \ `setState` 这样的额外函数来告诉 Svelte 变量变化进行重新渲染。Svelte 通过查找赋值运算符来判断何时需要重新渲染，因此它知道哪个变量是“脏”（dirty）。在编译\
    \ Svelte 组件时，它会将这些赋值封装在一个函数调用中，告诉运行时在下一次浏览器绘制时重新渲染。但要小心，这意味着仅执行 `todos.push(newTodo)`\
    \ 是不起作用的：Svelte 只会将通过赋值更新的变量标记为脏。因此，编写 `todos.push(newTodo); todos = todos;` 就可以。\n\
    \n上面的代码可以工作，但我们可以做得更好。我们与其通过监听 `keyup` 事件来手动保持 `newTodo` 与输入值的同步，还可以使用绑定。结果如下：\n\
    \n```\n<script>\n    let todos = ['Learn Svelte', 'Create great things'];\n  \
    \  let newTodo = '';\n    function handleKeyup(evt) {\n        if (evt.key ===\
    \ 'Enter') {\n            todos = [...todos, newTodo];\n            newTodo =\
    \ '';\n        }\n    }\n</script>\n\n<label>\n    新待办事项\n    <input type=\"text\"\
    \ bind:value={newTodo} on:keyup={handleKeyup} />\n</label>\n\n<!-- ... -->\n```\n"
- fmt: "\nWith these tools at your disposal, you’re now ready to enrich your HTML\
    \ with dynamic content and behavior! In the next chapter, we’ll look into reactive\
    \ statements and how they can help us derive computed variables or react to variable\
    \ changes, and how Svelte again uses its unique advantage—being a compiler—to\
    \ make the developer experience of writing these as good as possible.\n\n# Chapter\
    \ 3: Reactive Statements\n\nSo far, we've learned that `Svelte` is able to compile\
    \ regular variable assignments inside components into something that will automatically\
    \ update the view. Whenever you assign something to a variable, `Svelte` will\
    \ notice that and schedule a rerender for the next browser paint. We then had\
    \ a closer look at the component syntax to see how to add dynamic behavior to\
    \ our HTML code. In this chapter, we’ll focus on the contents of the `<script>`\
    \ tag and take a look at how we can run other code in reaction to a variable change.\n\
    \nHave you ever needed to react to a variable change? Probably every day, in some\
    \ form or the other. `Svelte` already reacts nicely to changes of variables by\
    \ rerendering the view. But what if we need to explicitly react to a variable\
    \ change inside our `<script>` tag? Doubling a count, fetching a new object from\
    \ the backend when an ID changes—there are many use cases. This is where reactive\
    \ statements come in. They look something like this:\n\n```javascript\n<script>\n\
    \  // reactive declaration\n  $: foo = bar;\n  // reactive statement\n  $: {\n\
    \      something = somethingElse;\n  }\n</script>\n```\n\nSyntactically, the reactive\
    \ statement is expressed by using the dollar sign followed by a colon—`$:`. This\
    \ is actually valid JavaScript syntax. Originally, it expresses a labelled statement—`labelname\
    \ : statement`—to which you can tell JavaScript to jump when using `continue`\
    \ or `break`. But since no one uses that, `Svelte` has filled the void to syntactically\
    \ express its reactive statement. This means you can’t use labelled statements\
    \ of the name `$` inside `Svelte` files, but as you’re most likely not using labelled\
    \ statements of any kind anyway, this won’t make a difference.\n\nWith the syntax\
    \ out of the way, let’s look at the semantic meaning of reactive statements, which\
    \ come in two forms: reactive declarations and reactive statements.\n\n## Reactive\
    \ Declarations\n\nA `reactive declaration` defines a variable whose value is dependent\
    \ on other variables. A simple reactive declaration may look like this:\n\n```javascript\n\
    <script>\n  let count = 0;\n  $: doubled = count * 2;\n</script>\n\n<p>Count:\
    \ {count}</p>\n<p>Doubled: {doubled}</p>\n<button on:click={() => count += 1}>Increase\
    \ count</button>\n```\n\nThis reactive declaration declares the variable `doubled`,\
    \ which is expressed as being the double of the variable `count`. Whenever `count`\
    \ changes, `Svelte` knows to also compute the new value of `doubled`. Think of\
    \ reactive declarations like a formula of an Excel cell: you declaratively define\
    \ what the result is, and `Svelte` takes care of the rest—but note the caveats\
    \ that we’ll get to later. Reactive declarations can also depend on other reactive\
    \ declarations, so you could write `$: quadrupled = doubled * 2`.\n\n## Reactive\
    \ Statements\n\nA `reactive statement` doesn’t define a computed variable. Instead,\
    \ defines a block that should be rerun whenever its dependencies change. Every\
    \ variable that appears inside the block of a reactive statement and is read (*not*\
    \ written to)—in order to compute the outcome—is a dependency. A reactive statement\
    \ looks like this:\n\n```javascript\n<script>\n  let count = 0;\n  let prevCount\
    \ = 0;\n  let countWentUp = false;\n  // Simple statement\n  $: console.log('Count\
    \ is' + count);\n  // Block statement\n  $: {\n      countWentUp = prevCount <\
    \ count;\n      prevCount = count;\n  }\n</script>\n\n<p>Count: {count}</p>\n\
    <p>Count went {countWentUp ? 'up' : 'down'}</p>\n<button on:click={() => count\
    \ += 1}>Increase count</button>\n<button on:click={() => count -= 1}>Decrease\
    \ count</button>\n```\n\nAs you can see, a reactive statement is essentially an\
    \ arbitrary bit of code that should be rerun at certain times. In the above example,\
    \ the `console.log` statement is rerun every time the `count` changes. Inside\
    \ the block statement, we update two variables in reaction to a `count` change.\
    \ First, we compare the previous count with the current count to determine whether\
    \ the count went up or down, and then we store the current count as the new previous\
    \ count for the next run. You can use reactive statements to express side effects\
    \ or run computations that don’t fit into a simple declaration statement, or which\
    \ touch more than one variable. Essentially, reactive statements are a superset\
    \ of reactive declarations: you could rewrite every reactive declaration as a\
    \ reactive statement. The following code is identical from a semantic point of\
    \ view:\n\n```javascript\n<script>\n  let something = 'something';\n  // This\
    \ ...\n  $: declaration = something;\n  // Is the same as this\n  let statement;\n\
    \  $: {\n    statement = something;\n  }\n</script>\n```\n\n## Order of Execution\n\
    \nYou might ask now in which order these reactive statements are run. Intuitively,\
    \ it makes sense that it’s somehow ordered in relation to the things they use,\
    \ but how exactly? The answer is simple: at compile time, `Svelte` looks at the\
    \ *direct* code of the reactive statements and checks each variable that’s *read*.\
    \ These are the dependencies we already touched on briefly in the previous section.\
    \ From these dependencies, `Svelte` determines the order.\n\nMathematically speaking,\
    \ this is called **topological ordering** with respect to the variables. If `Svelte`\
    \ isn’t able to determine an ordering that way—for example, because the statements\
    \ have no dependencies—they’re executed in the order you’ve written down:\n\n\
    ```javascript\n<script>\n  let count = 0;\n  $: quadrupled = doubled * 2; // runs\
    \ 2nd\n  $: doubled = count * 2; // runs 1st\n  $: console.log(quadrupled); //\
    \ runs 3rd\n  $: console.log(count); // runs last\n</script>\n```\n\nThere may\
    \ be situations where we want to hide a variable from the dependencies. In the\
    \ following arbitrary (but simple) example, we want `multiplied` to only update\
    \ when we increase `count`, but not when we change `multiplyBy`. We do this by\
    \ hiding the variable `multiplyBy` from the direct dependencies, by moving it\
    \ into a function:\n\n```javascript\n<script>\n  let count = 0;\n  let multiplyBy\
    \ = 2;\n\n  $: multiplied = multiply(count);\n\n  function multiply(value) {\n\
    \      return value * multiplyBy;\n  }\n</script>\n```\n\nNow `multiplied` will\
    \ only change if `count` changes, but not when `multiplyBy` changes. This works\
    \ because `Svelte` only looks at the *direct* code of the reactive statement;\
    \ it doesn’t follow function calls.\n\nThe inverse might be true, too: we may\
    \ want to retrigger a reactive statement even if a variable changes that doesn’t\
    \ directly contribute to the result. In this case, we can just add the variable\
    \ in question by making it appear within the reactive statement:\n\n```javascript\n\
    <script>\n  // ...\n  $: variableWhichShouldTriggerRecalculation, retriggerCalculation();\n\
    \  // ...\n</script>\n```\n\nSince reactive statements are regular JavaScript,\
    \ you can also use `if`-blocks to have more control over when a statement is rerun\
    \ by only executing its body when a certain condition is met.\n"
