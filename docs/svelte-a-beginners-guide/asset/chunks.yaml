    current\" } }]]\n}\n```\n\nThese are the steps for creating the test setup when\
    \ using JavaScript. If you’re using TypeScript, the setup looks a little different.\
    \ First, you need to install the following packages:\n\n```\nnpm install typescript\
    \ svelte-preprocess jest ts-jest svelte-jester @testing-library/svelte -D\n```\n\
    \nYou probably already have `typescript` and `svelte-preprocess`, as these are\
    \ needed for developing Svelte applications in TypeScript. The Babel dependencies\
