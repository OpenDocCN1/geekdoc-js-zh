  \ {\n150       return null;\n151     }\n```\n\n`02-linked-list/LinkedList.js`\n\n\
  接下来，我们创建一个变量 `currentNode` 来跟踪我们在 `LinkedList` 中的位置，并将其设置为 `this.head` 以从 `LinkedList`\
  \ 的开始。\n\n```\n152 \n```\n\n`02-linked-list/LinkedList.js`\n\n然后我们创建一个 `while` 循环来遍历\
  \ `LinkedList` 中的所有节点，并调用作为参数传递的 `callback` 函数，或者检查当前节点的值看是否匹配我们正在寻找的值。如果有匹配，我们就返回该节点。\n\
