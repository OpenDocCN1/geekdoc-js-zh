  \n## 素数测试\n\n*   **难度：简单**\n\n**质数**（或称为**素数**）是一个大于 `1` 的自然数，它不能通过两个较小的自然数相积得到。\n\
  \n> 自然数是任何大于等于 0 且不是分数或小数的数字\n\n大于 1 的非质数自然数称为合数。例如，`5` 是质数，因为将其写为乘积的唯一方式（`1 — 5`\
  \ 或 `5 — 1`）涉及 `5` 本身。然而，`6` 是合数，因为它是两个数字 `(2 — 3)` 的乘积。\n\n### 素数测试\n\n**素数测试**是一种用于判断给定整数是否为质数的算法。\n\
  \n### 应用\n\n素数测试用于密码学等许多领域。\n\n### 代码\n\n要判断一个数字是否为质数，我们首先确保该数字不能被 2 整除。如果能被 2 整除，则它不是质数。\n\
  \n```javascript\nfunction isPrime(number) {\n  if (number <= 1) return false;\n\
  \  if (number === 2) return true;\n  if (number % 2 === 0) return false;\n```\n\n\
  接下来，我们检查该数字是否被其平方根范围任何奇数整除。如果任何数字的余数为 0，我们就知道它不是质数。\n\n```javascript\n  const limit\
  \ = Math.sqrt(number);\n  for (let i = 3; i <= limit; i += 2) {\n    if (number\
  \ % i === 0) return false;\n  }\n  return true;\n}\n```\n\n最后，如果我们一直运行到这里，就可以得出该数字是质数的结论。\n\
  \n### 为什么我们要使用数字的平方根？\n\n我们使用数字的平方根，是因为任何大于数字平方根的数字都会有一个对应的小于平方根的数字被使用。例如，36 的平方根是\
  \ 6。\n\n1 * 36 = 36\n2 * 18 = 36\n3 * 12 = 36\n4 * 9 = 36\n5 * 7.2 = 36\n6 * 6 =\
  \ 36 – 第二个操作数小于 36 的平方根；我们不需要检查高于平方根的数字。\n\n\n\n\n\n素性测试示例及用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test)\n\
  \n# 是否为 2 的幂\n\n* *难度：简单*\n\n### 任务\n\n给定一个正整数，编写一个函数来判断它是否为 2 的幂。\n\n### 朴素解（暴力解）\n\
  \n在素解中，我们首先检查该数字是否大于 1，如果小于 1，则它不是 2 的幂。\n\n```\n5 export default function isPowerOfTwo(number)\
  \ {\n6   // 1 (2⁰) 是最小的 2 的幂。\n7   if (number < 1) {\n8     return false;\n9   }\n\
  ```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\n然后，我们将数字除以 2 并检查余数是否为 0。如果余数不是 0，则该数字不是\
  \ 2 的幂。如果我们继续除法并达到 1，我们就知道该数字是 2 的幂。\n\n```\n11   // 让我们看看是否可以多次将数字除以二\n12   //\
  \ 而没有余数。\n13   let dividedNumber = number;\n14   while (dividedNumber !== 1) {\n\
  15     if (dividedNumber % 2 !== 0) {\n16       // 对于任何余数不为 0 的情况，我们可以说这个数字\n17\
  \       // 不可能是 2 的幂的结果。\n18       return false;\n19     }\n20 \n21     dividedNumber\
  \ /= 2;\n22   }\n23 \n24   return true;\n25 }\n```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\
  \n### 位运算解\n\n二进制形式的 2 的幂始终只有一个位。唯一的例外是符号整数（例如，值为 -128 的 8 位符号整数看起来像：`10000000`）\n\
  \n```\n1 1: 0001\n2 2: 0010\n3 4: 0100\n4 8: 1000\n```\n\n要检查一个数字是否为 2 的幂，我们首先从该数字减去\
  \ 1。\n\n例如，数字 8 在二进制中看起来如下：\n\n```\n1 1000\n```\n\n8 - 1 在二进制中看起来如下：\n\n```\n1 0111\n\
  ```\n\n任何 2 的幂减 1 都除了最高位外全为 1。在从数字减去 1 后，我们将其与该数字进行与（AND）运算。如果与运算的结果为 0，我们就知道它是\
  \ 2 的幂。如果与运算的结果为 1，那么它不是 2 的幂。\n\n```\n1   1000\n2 & 0111\n3   ----\n4   0000 \n\
  ```\n\n```\n 5 export default function isPowerOfTwoBitwise(number) {\n 6   // 1\
  \ (2⁰) 是最小的 2 的幂。\n 7   if (number < 1) {\n 8     return false;\n 9   }\n10 \n11\
  \   /*\n12    * 二进制形式的 2 的幂看起来如下：\n13    * 1: 0001\n14    * 2: 0010\n15    * 4:\
  \ 0100\n16    * 8: 1000\n17    *\n18    * 注意始终有一个 1 位被设置。唯一的例外是符号\n19    * 整数。\n\
  20    * 例如，值为 -128 的 8 位符号整数看起来像：\n21    * 10000000\n22    *\n23    * 所以在检查数字大于\
  \ 0 后，我们可以使用一种巧妙的位\n24    * 技巧来测试是否只有一个位\n25    * 位被设置。\n26    */\n27   return (number\
  \ & (number - 1)) === 0;\n```\n\n`14-is-power-of-two/isPowerOfTwoBitwise.js`\n\n\
  ### 题目示例\n\n以下是一些在面试中可能会遇到的的相关问题：\n\n* [4 的幂](https://leetcode.com/problems/power-of-four/)\n\
  * [重排后的 2 的幂](https://leetcode.com/problems/reordered-power-of-2/)\n\n### 测验\n\n\
  *Q1: 32 是 2 的幂吗？使用朴素解找出答案*\n\n*Q2: 31 是 2 的幂吗？使用位运算解找出答案*\n\n### 参考文献\n\nGeeksForGeeks\
  \ 上的位运算解 [`www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/`](https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/)\n\
  \nStanford 上的位运算解 [`www.graphics.stanford.edu/~seander/bithwise-operations/`](http://www.graphics.stanford.edu/~seander/bithwise-operations/)\
  \ （注：原文 URL 不完整，已根据上下文修正）\n\n\n\n\n\n```javascript\n  /**\n   * @param {function(a:\
  \ *, b: *)} [compareFunction] - 这可能是一个自定义的比较函数，让我们\n   * 比如可能会比较自定义对象。\n   */\n\
  \  constructor(compareFunction) {\n    this.compare = compareFunction || Comparator.defaultCompareFunction;\n\
  \  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `defaultCompareFunction()`\n\
  \n这是默认的备用比较函数，它将两个参数 `a` 和 `b` 视为字符串或数字，并对它们应用常用的比较运算符如 `===`、`<` 和 `>`。\n\n```javascript\n\
  \  /**\n   * 默认比较函数。它假设 \"a\" 和 \"b\" 是字符串或数字。\n   * @param {(string|number)} a\n\
  \   * @param {(string|number)} b\n   * @returns {number}\n   */\n  static defaultCompareFunction(a,\
  \ b) {\n    if (a === b) {\n      return 0;\n    }\n\n    return a < b ? -1 : 1;\n\
  \  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `equal()`\n\n此函数检查两个变量是否相等。\n\
  \n```javascript\n  /**\n   * 检查两个变量是否相等。\n   * @param {*} a\n   * @param {*} b\n\
  \   * @return {boolean}\n   */\n  equal(a, b) {\n    return this.compare(a, b) ===\
  \ 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `lessThan()`\n\n此函数检查变量\
  \ `a` 是否小于 `b`。\n\n```javascript\n  /**\n   * 检查变量 \"a\" 是否小于 \"b\"。\n   * @param\
  \ {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n  lessThan(a, b) {\n\
  \    return this.compare(a, b) < 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
  \n### `greaterThan()`\n\n此函数检查变量 `a` 是否大于 `b`。\n\n```javascript\n  /**\n   * 检查变量\
  \ \"a\" 是否大于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n\
  \   */\n  greaterThan(a, b) {\n    return this.compare(a, b) > 0;\n  }\n```\n\n\
  `utils/comparator/Comparator.js`\n\n### `lessThanOrEqual()`\n\n此函数检查变量 `a` 是否小于或等于\
  \ `b`。\n\n```javascript\n  /**\n   * 检查变量 \"a\" 是否小于或等于 \"b\"。\n   * @param {*}\
  \ a\n   * @param {*} b\n   * @return {boolean}\n   */\n  lessThanOrEqual(a, b) {\n\
  \    return this.lessThan(a, b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
  \n### `greaterThanOrEqual()`\n\n此函数检查变量 `a` 是否大于或等于 `b`。\n\n```javascript\n  /**\n\
  \   * 检查变量 \"a\" 是否大于或等于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return\
  \ {boolean}\n   */\n  greaterThanOrEqual(a, b) {\n    return this.greaterThan(a,\
  \ b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `linearSearch()`\n\
  \n既然我们已经实现了 `Comparator` 工具类，现在让我们来实现 `linearSearch()` 函数吧。\n\n`linearSearch()`\
  \ 函数将数组中的每个元素与我们尝试查找的元素进行比较。比较是通过 `Comparator` 类完成的。一旦找到元素，其位置就会记录在 `foundIndices`\
  \ 数组中。\n\n```javascript\nexport default function linearSearch(array, seekElement,\
  \ comparatorCallback) {\n  const comparator = new Comparator(comparatorCallback);\n\
  \  const foundIndices = [];\n\n  array.forEach((element, index) => {\n    if (comparator.equal(element,\
  \ seekElement)) {\n      foundIndices.push(index);\n    }\n  });\n\n  return foundIndices;\n\
  }\n```\n\n\n\n\n$2^x = n \\implies x = \\log(n)$\n\n这里的 `x` 是我们的时间复杂度。\n\n> 为了理解\
  \ `O(log(n))` 时间复杂度对于二分查找是有多高效，让我们将其与线性查找的 `O(n)` 时间复杂度进行比较。Tycho-2 星表包含了关于我们银系中最明亮的\
  \ `2,539,913` 颗恒星的信息。假设我们想在该星表中通过名称查找某颗恒星。在线性查找的最坏情况下，我们需要进行 `2,539,913` 次迭代。在二分查找的最坏情况下，如果所有恒星都按名称排序，只需要\
  \ `22` 次迭代（`log_2(2539913) = 21.27`）。\n\n## 空间复杂度\n\n该算法可以通过不同的方式实现，使用迭代方法或递归方法（为每个递归调用分配额外的内存）。取决于实现方式，空间复杂度可能会不同。在本章中，我们将使用简单的迭代方法，而不创建数组副本。因此，在这种情况下，空间复杂度将是\
  \ `O(1)`。\n\n### 应用\n\n*   二分查找用于在有序数组中进行`快速搜索操作`。\n\n*   二分查找法用于 `二分搜索树` 的实现。\n\
  \n*   二分查找法可以用于在提交历史中快速`找到 bug commit`。只需将提交历史一分为两半。如果 bug 已经存在于“中间”提交，则向左移动到更早的提交并再次平分左半。否则，如果\
  \ bug 不存在则向右移动到较后的提交。\n\n*   二分查找法可以用于在程序中快速`找到错误的代码行`。只需注释掉一半的代码并查看 bug 是否仍然存在。如果存在，则向上移动，否则向下移动。\n\
  \n## 使用示例\n\n在本章较早之前，我们讨论了如果 Tycho-2 星表按名称排序，通过名称在星表中查找恒星会有有多快。与其线性 `2,539,913`\
  \ 次迭代相比，它只需为我们提供 `22` 次迭代（`22` 次）就能找到那颗恒星。\n\n假设我们已经在脚本中有了这个排好序的恒星星表，看看我们将如何对其应用二分查找。\n\
  \n```\n 1 导入依赖。\n 2 import binarySearch from './binarySearch';\n 3 \n 4 // 让我们为我们的有序恒星表创建一个非常简单且小的演示版本。\n\
  \ 5 const sortedArrayOfStars = [\n 6   { name: 'Alpha Centauri A', position: {}\
  \ },\n 7   { name: 'Alpha Centauri B', position: {} },\n 8   { name: 'Betelgeuse',\
  \ position: {} },\n 9   { name: 'Polaris', position: {} },\n10   { name: 'Rigel',\
  \ position: {} },\n11   { name: 'Sirius', position: {} },\n12   // 这里还有额外的 250 万条记录\
  \ :)\n13 ];\n14 \n15 // 我们用于二分查找函数的自定义对象比较器。\n16 // 我们在这里使用字符串比较。例如，'Polaris' 比\
  \ 'Rigel' 小。\n17 const comparator = (star1, star2) => {\n18   if (star1.name ===\
  \ star2.name) return 0;\n19   return star1.name < star2.name ? -1 : 1;\n20 };\n\
  21 \n22 // 现在让我们搜索恒星。\n23 binarySearch(sortedArrayOfStars, { name: 'Not Existing\
  \ Name' }, comparator); // -> -1\n24 binarySearch(sortedArrayOfStars, { name: 'Alpha\
  \ Centauri A' }, comparator); // -> 0\n25 binarySearch(sortedArrayOfStars, { name:\
  \ 'Alpha Centauri B' }, comparator); // -> 1\n26 binarySearch(sortedArrayOfStars,\
  \ { name: 'Polaris' }, comparator); // -> 3\n```\n\n`15-binary-search/example.js`\n\
  \n# 实现\n\n在上面的示例中，我们使用了一个自定义比较函数来对恒星对象进行相互比较。为了实现这一点，我们将重用一个在恒星对象之间进行比较的自定义比较函数。为了使其可行，我们将重用在“线性查找”章节实现的\
  \ `Comparator` 类。请查看 `Comparator` 类的实现细节。\n\n```\n// 导入依赖。\nimport Comparator from\
  \ '../utils/Comparator';\n```\n\n`16-binary-search/binarySearch.js`\n\n现在让我们看看如何实现二分查找。\n\
  \n```\n/**\n * 二分查找。\n * @param {Array} sortedArray 有序数组\n * @param {Object} target\
  \ 要查找的目标对象\n * @param {Function} comparator 比较函数\n * @returns {number} 找到的索引或 -1\n\
  \ */\nexport default function binarySearch(sortedArray, target, comparator) {\n\
  \  // 使用 Comparator\n  const comp = new Comparator(comparator);\n  let left = 0;\n\
  \  let right = sortedArray.length - 1;\n\n  while (left <= right) {\n    // 计算中间索引\n\
  \    const mid = Math.floor((left + right) / 2);\n\n    // 如果找到目标\n    if (comp.equal(sortedArray[mid],\
  \ target) === 0) {\n      return mid;\n    }\n    // 如果目标更小，在左半部分查找\n    if (comp.lessThan(sortedArray[mid],\
  \ target)) {\n      right = mid - 1;\n    } \n    // 如果目标更大，在右半部分查找\n    else {\n\
  \      left = mid + 1;\n    }\n  }\n\n  return -1;\n}\n```\n\n\n\n\n![](img/17-cartesian-product----cartesian-product.png)\n\
  \n两个集合 `A` 和 `B` 的积集 `A×B` 中的元素数量可以计算为集合 `A` 和 `B` 长度的乘积 `|A|×|B|`。在上面的示例中，我们有两个长度为\
  \ 3 的集合。这两个集合的乘积包含 `3 * 3 = 9` 个元素。\n\n也可以创建两个集合的笛卡尔积。例如，我们有一个毛衣颜色集合 `COLORS = {blue,\
  \ red, yellow}`、领口形状集合 `NECK_FORMS = {round-neck, V−neck, polo−neck}` 以及一个尺寸集合 `SIZE\
  \ = {XS, S, M, L, XL, XXL}`，那么这三个集合的笛卡尔积看起来就像 `{(blue,round-neck,XS), (blue,round-neck,S),\
  \ (blue,round-neck,M), ..., (yellow,polo−neck,XXL)}`。\n\n### 应用\n\n扑克牌是笛卡尔积应用于花牌等级集合\
  \ `{A, K, Q, J, 10, 9, 8, 7, 6, 5, 4, 3, 2}` 和花色集合 `{♠︎, ♣, ︎♥, ︎♦︎}` 的示例。这两个集合的乘积形成了标准的\
  \ 52 张牌牌 `{(A,♠), (A,♣), (A,♥), ..., (2,♦)}`。\n\n二维坐标系也是两个集合 `R×R` 的积集，其中 `R` 表示实数集。\n\
  \n通常，笛卡尔积可用于生成不同实体之间所有可能的配对（子集）。我们可以认为为汽车价格表生成 `(model, color)` 属性对，或者为毛衣目录生成 `(neck_form,\
  \ size, color)` 属性子集等等。\n\n## 使用示例\n\n让我们使用我们的 `cartesianProduct()` 函数来生成一副扑牌。\n\
  \n```\n 1 // 导入依赖。\n 2 import cartesianProduct from './cartesianProduct';\n 3 \n\
  \ 4 // 初始化牌等级和花色的集合。\n 5 const cardRanks = ['A', 'K', 'Q', 'J', '10', '9', '8',\
  \ '7', '6', '5', '4', '3', '2'];\n 6 const cardSuits = ['♠', '♣', '♥', '♦'];\n 7\
  \ \n 8 // 生成一副扑牌。\n 9 const cardDeck = cartesianProduct(cardRanks, cardSuits);\n\
  10 \n 11 // 检查牌组。\n 12 // eslint-disable-next-line no-console\n 13 console.log(cardDeck);\
  \ // -> [['A', '♠'], ['A', '♣'], ..., ['2', '♦']]\n```\n\n17-cartesian-product/example.js\n\
  \n# 实现\n\n为了实现 `cartesianProduct()` 函数，我们首先需要检查输入。如果输入错误且某些输入集合为空，函数将返回 `null`。然后，我们使用两个嵌套的\
  \ `for` 循环从两个输入集合 `setA` 和 `setB` 生成所有元素配对。\n\n```\n 1 /**\n 2  * 生成两个集合的笛卡尔积。\n\
  \ 3  * @param {*[]} setA\n 4  * @param {*[]} setB\n 5  * @return {*[]}\n 6  */\n\
  \ 7 export default function cartesianProduct(setA, setB) {\n 8   // 检查输入集合是否为空。\n\
  \ 9   // 否则返回 null，因为我们无法从它们生成笛卡尔积。\n10   if (!setA || !setB || !setA.length ||\
  \ !setB.length) {\n 11     return null;\n 12   }\n 13 \n 14   // 初始化积集。\n 15   const\
  \ product = [];\n 16 \n 17   // 现在，遍历第一个和第二个集合的所有元素并形成所有可能\\\n18 ble pairs。\n19\
  \   for (let indexA = 0; indexA < setA.length; indexA += 1) {\n20     for (let indexB\
  \ = 0; indexB < setB.length; indexB += 1) {\n21       // 将当前积配对添加到积集。\n22      \
  \ product.push([setA[indexA], setB[indexB]]);\n23     }\n24   }\n 25 \n 26   //\
  \ 返回笛卡尔积集。\n 27   return product;\n 28 }\n```\n\n17-cartesian-product/cartesianProduct.js\n\
  \n### 复杂度\n\n如果我们生成两个集合 `A` 和 `B` 的积集，那么两个嵌套的 `for` 循环将产生 `|A| * |B|` 次循环，其中 `|A|`\
  \ 是集合 `A` 中的元素数量，`|B|` 是集合 `|B|` 中的元素数量。因此时间复杂度为 O(|A| * |B|)。\n\n额外的空间复杂度也是 O(|A|\
  \ * |B|)，因为我们分配了一个新数组来存放所有的笛卡尔积元素。\n\n### 问题示例\n\n这里是一些你可能感兴趣的相关问题：\n\n\n\n\n\n\
  我们将使用两种方法来实现幂集生成器：一种是我们在上面讨论过的位运算方法，另一种是将在下一节中描述的回溯方法。\n\n### 位运算方法 (Bitwise Approach)\n\
  \n在位运算方法中，我们将利用这样一个事实：直到 `2^n`（其中 `n` 是集合的大小）的数字的二进制表示将作为原始集合的位掩码，从而产生子集。\n\n查看下面的实现代码：\n\
  \n```javascript\n 1 /**\n 2  * 使用位运算方法查找集合的幂集。\n 3  *\n 4  * @param {*[]} originalSet\n\
  \ 5  * @return {*[][]}\n 6  */\n 7 export default function bwPowerSet(originalSet)\
  \ {\n 8   const subSets = [];\n 9 \n10   // 我们会有 2^n 种可能的组合（n 是原始集合的长度）。\n11 //\
  \ 对于原始集合中的每个元素，我们都要决定是否包含\\\n12 de\n13   // 它或不包含（每个集合元素有 2 种选择）。\n14   const numberOfCombinations\
  \ = 2 ** originalSet.length;\n15 \n16   // 0 到 2^n 范围内每个二进制表示的数字都完全符合我们的需求:\\\n\
  17  we: 它通过其位（0 或 1）显示是否包含集合中的相关元素 o\\\n19 r 不是。\n20   // 例如，对于集合 {1, 2, 3}，二进制数\
  \ 0b010 意味着 w\\\n21 e 需要\n22   // 只将 \"2\" 加入当前集合中。\n23   for (let combinationIndex\
  \ = 0; combinationIndex < numberOfCombinations; combinatio\\\n24 nIndex += 1) {\n\
  25     const subSet = [];\n26 \n27     for (let setElementIndex = 0; setElementIndex\
  \ < originalSet.length; setElementIn\\\n28 dex += 1) {\n29       // 决定我们是否需要将当前元素包含在子集中。\n\
  30       if (combinationIndex & (1 << setElementIndex)) {\n31         subSet.push(originalSet[setElementIndex]);\n\
  32       }\n33     }\n34 \n35     // 将当前子集添加到所有子集的列表中。\n36     subSets.push(subSet);\n\
  37   }\n38 \n39   return subSets;\n40 }\n```\n\n`18-power-set/bwPowerSet.js`\n\n\
  我们的函数只接受一个参数：`originalSet`，它是一个数组。然后它创建一个 `subSets` 数组，用于存放所有生成的幂集子集。\n\n接下来的行计算组合数。这个数字也是我们用位掩码的数字范围内的最大值。为了对数字求幂，我们使用\
  \ `**` 运算符。\n\n```javascript\nconst numberOfCombinations = 2 ** originalSet.length;\n\
  ```\n\n第一个 `for` 循环遍历我们范围 `[0, numberOfCombinations]` 内的每一个数字。在每次迭代中，它都会创建一个新的幂集数组\
  \ `subSet`，该将将与当前 `combinationIndex` 对应的当前子集的所有元素。\n\n在内部 `for` 循环中，我们遍历原始集合元素，以查看是否需要包含每个特定元素。这是通过检查\
  \ `combinationIndex` 中的相应位来决定的。如果 `setElementIndex` 位置的位被设置了，则我们需要将索引为 `setElementIndex`\
  \ 的元素添加到 `subSet` 中。否则，我们忽略它。\n\n位检查是通过以下结构完成的：\n\n```javascript\nif (combinationIndex\
  \ & (1 << setElementIndex)) {\n  // 将元素添加到子集中。\n}\n```\n\n在这里，我们将 `1` 向左移动 `setElementIndex`\
  \ 位（例如，如果 `setElementIndex` 是 4，那么 `0b1 << 4` 将给我们得到 `0b1000`）。然后我们执行逻辑*与*（and）操作，以检查\
  \ `combinationIndex` 中的相应位是否被设置（例如，如果 `combinationIndex` 是 `0b0100` 且我们正在执行 `0b0100\
  \ & 0b1000`，这将得到 `0`，表示 `combinationIndex` 的第 4 位未被设置）。\n\n### 回溯方法 (Backtracking\
  \ Approach)\n\n在回溯方法中，我们尝试生成所有可能的解决方案，但每当我们生成下一个解决方案时，都会测试它是否满足所有条件（或尝试让它满足我们的所有条件），然后才继续生成后续解决方案。否则，回溯并进入寻找解决方案的另一路径。\n\
  \n在我们的示例的每次迭代中，我们都会多添加一个有效元素。在我们案例中，有效性由规则定义：我们不希望子集中有重复项。因此，在每次迭代中，我们可以添加原始集合中的任何元素，已经添加过的元素除外。\n\
  \n这种方法可以使用以下决策树进行插说明。\n\n![](img/18-power-set----power-set-backtracking.png)\n\n\
  这个决策树帮助我们决定在此时此刻可能包含哪些元素。如果没有选项了，让我们后退一步（回溯）并尝试另一个有效选项。\n\n所以，例如，让我们以深度优先的方式溯溯决策树：\n\
  \n1. 在顶端，我们只有一个选择，就是添加空集合。记录 `{}`。\n2. 下一个可以添加的元素是 `a`。记录 `{a}`。\n3. 我们可以添加 `b`。记录\
  \ `{a, b}`。\n4. 我们可以添加 `c`。记录 `{a, b, c}`。\n5. 此时没有其他元素可以添加了。回溯！\n6. 当前子集是 `{a}`。\n\
  7. 但我们可以添加 `c`。记录 `{a, c}`。\n8. 等等\n\n现在让我们尝试用代码实现这种方法：\n\n```javascript\n 1 /**\n\
  \  * 使用回溯方法查找集合的幂集。\n 2  *\n 3  * @param {*[]} originalSet - 正在形成的原始集合。\n 4  * @param\
  \ {*[][]} allSubsets - 目前为止形成的所有子集（默认包含\n 5  * 空集）。\n 6  * @param {*[]} currentSubSet\
  \ - 正在形成的当前子集。\n 7  * @param {number} startAt - 原始集合中开始形成\n 8  * 当前子集的位置。\n 9  *\
  \ @return {*[][]} - 所有子集。\n10 */\n11 export default function btPowerSet(\n12   originalSet,\n\
  13   allSubsets = [[]],\n14   currentSubSet = [],\n15   startAt = 0,\n16 ) {\n17\
  \   // 遍历原始集合中可以添加到子集且\n188 不产生重复的元素。startAt 的值防止添加重复。\n19   for (let position =\
  \ startAt; position < originalSet.length; position += 1) {\n20     // 将当前元素推入子集\n\
  21     currentSubSet.push(originalSet[position]);\n22 \n23     // 当前子集已经是有效的，所以记录它。\n\
  24     // 我们在这里使用解构来保存 currentSubSet 的克隆。\n25     // 我们需要保存克隆，因为原始 currentSubSet\
  \ 将在进一步的递归\n26      调用中被修改。\n27     allSubsets.push([...currentSubSet]);\n28 \n\
  29     // 尝试为当前子集生成所有其他子集。\n30     // 我们增加位置一以避免子集中的重复。\n31       递归调用中。\n32 \n\
  33     // 回溯。从子集中排除最后一个元素并尝试下一个有效元素。\n34     currentSubSet.pop();\n35   }\n36 \n\
  37   // 返回集合的所有子集。\n38   return allSubsets;\n39 }\n```\n\n### 复杂度\n\n\n\n\n\n在位运算方法中，我们遍历\
  \ `2<sup>n</sup>` 个数字，对于每个数字，我们都会遍历大小为 `n` 的原始集合，以决定将哪些元素包含在子集中。因此，这种方法的**时间复杂度**为\
  \ `O(n * 2<sup>n</sup>)`，其中 `n` 是原始集合中元素的数量。\n\n### 回溯法\n\n在回溯法中，我们正在遍历一个拥有 `2<sup>n</sup>`\
  \ 个节点的决策树。因此，这种方法的**时间复杂度**为 `O(2<sup>n</sup>)`，其中 `n` 是原始集合中元素的数量。\n\n### 题目示例\n\
