  \n## 阶乘\n\n难度：简单\n\n### 介绍\n\n在数学中，非负整数 `n` 的阶乘表示为 `n!`，是所有小于或等于 `n` 的正整数的乘积。例如：\n\
  \n```\n1 5! = 5 * 4 * 3 * 2 * 1 = 120\n```\n\n| n | n! |\n\n| --- | --- |\n| 0 |\
  \ 1 |\n| 1 | 1 |\n| 2 | 2 |\n| 3 | 6 |\n| 4 | 24 |\n| 5 | 120 |\n| 6 | 720 |\n|\
  \ 7 | 5 040 |\n| 8 | 40 320 |\n| 9 | 362 880 |\n| 10 | 3 628 800 |\n| 11 | 39 916\
  \ 800 |\n| 12 | 479 001 600 |\n| 13 | 6 227 020 800 |\n| 14 | 87 178 291 200 |\n\
  | 15 | 1 307 674 368 000 |\n\n### 应用\n\n阶乘函数用于计算不同对象的集合，例如，假设我们组里有三个人——Sally、Susan\
  \ 和 Sarah——我们想确定这些人排成一排的唯一数量。\n\n你可以这样写出来：\n\nSally, Susan, Sarah Sally, Sarah,\
  \ Susan Susan, Sarah, Sally Susan, Sally, Sarah Sarah, Sally, Susan Sarah, Susan,\
  \ Sally\n\n写下这个列表需要很短的时间，但如果我们有 10 个人或 20 个人呢？我们将花很长时间写出所有可能的组合。通过计算组中人数的阶乘，我们不需要写出每种组合。\n\
  \n### 递归\n\n使用编程解决数字的阶乘是一个常用的演示递归概念的问题。在下面的代码中，你将看到我们有两种不同的解决此问题的方法——使用递归和非递归方法。\n\
  \n在本书的许多章节中，我们将使用递归来解决问题。递归在计算机科学中被频繁使用，是一个重要（尽管有些令人困惑）的概念。其基本思想是我们有一个函数，在函数定义内部，我们再次调用该函数。我们还必须在函数中包含一个基准情况（base\
  \ case），强制使我们的函数停止调用自己。如果没有基准情况，我们的函数将无限运行，直到我们的系统耗尽内存。\n\n### 代码\n\n#### 递归实现\n\
  \n计算数字阶乘的递归实现在我们的函数中只有一行，但该函数中有很多内容需要解析，所以让我们逐步进行。\n\n为了实现阶乘，我们使用三元运算符来确定是否继续调用我们的函数。\n\
  \n```\n1 /**\n2  * @param {number} number\n3  * @return {number}\n4  */\n5 export\
  \ default function factorialRecursive(number) {\n6   return number > 1 ? number\
  \ * factorialRecursive(number - 1) : 1;\n7 }\n```\n10-factorial/factorialRecursive.js\n\
  \n##### 关于三元运算符的提示\n\nJavaScript 中的三元运算符简化编写行数的方法。而不是 if/else 语句：\n\n```javascript\n\
  if(someTrue){\n\treturn someValue;\n}else{\n\treturn aDifferentValue;\n}\n```\n\n\
  我们可以将此逻辑合并为一行：\n\n```javascript\nreturn someTrue ? someValue : aDifferentValue;\n\
  ```\n\n三元运算符的第一部分是一个真/假表达式，第二部分（`?` 和 `:` 之间）是表达式为真时返回的值，最后部分是表达式为假时返回的内容。对于我们的\
  \ `factorial` 函数，三元运算符的第一部分（真/假表达式）决定我们正在使用的数字是否大于 1。\n\n```javascript\nnumber >\
  \ 1\n```\n\n如果我们正在计算的数字大于 1，则获取三元运算符的第二部分。这就是我们的函数用小于当前数字的数字再次调用自己。我们将该函数的结果与当前数字相乘。\n\
  \n```javascript\n? number * factorialRecursive(number - 1)\n```\n\n最后，我们到达三元运算符的最后部分，即我们的基准情况。当我们到达\
  \ 1 时，我们返回 1。如果我们想在数字为 1 时返回 1。当我们用 5 调用我们的函数时，底层看起来像什么？\n\n```javascript\nfactorialRecursive(5);\n\
  ```\n\n5 大于 1？是，返回 5 * factorial(4)\n4 大于 1？是，返回 4 * factorial(3)\n3 大于 1？是，返回 3\
  \ * factorial(2)\n2 大于 1？是，返回 2 * factorial(1)\n1 大于 1？否，返回 1 —— 这是我们的基准情况。我们完成了调用函数并返回了每次调用的值：\n\
  \n最终结果：120\n\n#### 非递归实现\n\n对于非递归实现，我们首先创建一个存储结果的变量并将其初始化为 1：\n\n```javascript\n\
  export default function factorial(number) {\n  let result = 1;\n```\n10-factorial/factorial.js\n\
  \n接下来，我们创建一个从 2 开始的 `for` 循环，直到达到我们要计算的数字。\n\n```javascript\nfor (let i = 2; i <=\
  \ number; i++) {\n```\n10-factorial/factorial.js\n\n在 `for` 循环内部，我们将 `i` 乘以 `result`：\n\
  \n```javascript\nfor (let i = 2; i <= number; i++) {\n  result *= i;\n}\n```\n10-factorial/factorial.js\n\
  \n最后，当我们退出 `for` 循环时，我们返回结果。\n\n```javascript\nreturn result;\n```\n10-factorial/factorial.js\n\
  \n### 问题示例\n\n以下是你在面试中可能会遇到的相关问题：\n\n* [笨拙阶乘](https://leetcode.com/problems/clumsy-factorial/)\n\
  * [阶乘末尾零](https://leetcode.com/problems/factorial-zeroes/)\n\n### 测验\n\nQ1：在 6!\
  \ 的递归实现中，`factorialRecursive` 函数会被调用几次？\n\n### 参考文献\n\n维基百科上的阶乘 [`en.wikipedia.org/wiki/Factorial`](https://en.wikipedia.org/wiki/Factorial)\n\
