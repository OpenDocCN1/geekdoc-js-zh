  \n## 排序：快速排序 (Quicksort)\n\n难度：中等\n\n### 任务\n\n将一个无序数值数组按升序排序。例如，一个无序数组 `[10, 3,\
  \ 0, 15, 10, 18, 2, 7, 11]` 升序排序后将变为：`[0, 2, 3, 7, 10, 10, 11, 15, 18]`。\n\n除了排序数字，我们还希望能够对对象数组进行排序。为了实现这一点，我们将在算法中实现一个比较回调函数。例如，应该能够按年龄对数组\
  \ `[{name: \"Bill\", age: 23}, {name: \"Jane\", age: 18}]` 进行升序排序，得到数组 `[{name:\
  \ \"Jane\", age: 18}, {name: \"Bill\", age: 23}]`。\n\n在任务描述中，我们只提到了按升序排序。不过一旦你理解了快速排序算法的原理，你就能修改算法来支持升序排序。\n\
  \n### 算法\n\n`Quicksort` 是一种效率为 `O(n * log(n))` 且常用的排序算法。快速排序是一种**比较排序**，这意味着它可以对任何定义了“小于”关系的类型项目进行排序。快速排序是一种**分治**算法。这意味着它将原始问题拆分成更小的子问题并尝试先解决这些子问题。然后合并较小问题的解决方案以得出最终解决方案。在我们例中，我们将数组分为两个部分，先排序较小的数组，然后再将它们合并成一个最终的排序数组。\n\
  \n该算法由三个递归（在子问题上重复）步骤组成：\n\n- **基准选择 (Pivot selection)**：从数组中选择一个元素，称为 `pivot`（通常取第一个、中间或最后一个）。\n\
  - **分区 (Partitioning)**：将数组分成三个子数组：`left`（包含所有小于基准元素的元素）、`center`（包含所有等于基准元素的元素）和\
  \ `right`（包含所有大于基准元素的元素）。\n- **递归 (Recurse)**：为它们选择新的基准元素并进一步分区，对较小的数组 `left` 和\
  \ `right` 应用之前的两个步骤。我们不需要对 `center` 数组应用这些步骤，因为它已经是排序的并且包含了所有的相等元素。\n\n该算法的基准情况是排序仅有一个元素的数组。当数组中只有一个元素时，不需要进行排序，因此我们返回该值。\n\
  \n快速排序算法的递归步骤如图所示：\n\n![](img/21-quicksort----quicksort.png)\n\n## 使用示例\n\n在实现 `quickSort()`\
  \ 函数之前，让我们假设我们已经实现了一个，并用它来在 `O(n * log(n))` 时间内排序用户名列表。这将帮助我们理解函数需要哪些参数，以及算法完成后结果将是什么。在这个示例中，我们将使用一个比较函数来排序数组。这允许我们在排序对象数组时使用自定义的比较逻辑。\n\
  \n```javascript\n 1 // 导入依赖项。\n 2 import quickSort from './quickSort';\n 3 \n 4\
  \ // 让我们用 O(n * log(n)) 时间按年龄排序用户列表。\n 5 \n 6 // 初始化用户列表。\n 7 const notSortedUserList\
  \ = [\n 8   { age: 18, name: 'Bill' },\n 9   { age: 20, name: 'Kate' },\n10   {\
  \ age: 20, name: 'Tom' },\n11   { age: 24, name: 'Cary' },\n12   { age: 37, name:\
  \ 'Mike' },\n13   { age: 42, name: 'Ben' },\n14   { age: 50, name: 'Jane' },\n15\
  \   { age: 60, name: 'Julia' },\n16 ];\n 17 \n18 // 创建一个比较两个用户对象的比较函数。\n19 const\
  \ userComparator = (user1, user2) => {\n20   if (user1.age === user2.age) {\n21\
  \     return 0;\n22   }\n 23 \n24   return user1.age > user2.age ? 1 : -1;\n25 };\n\
  26 \n27 // 排序用户列表。\n28 const sortedUserList = quickSort(notSortedUserList, userComparator);\n\
  29 \n30 // eslint-disable-next-line no-console\n31 console.log(sortedUserList);\n\
  32 /*\n33   输出将为：\n34   [\n35       { age: 18, name: 'Bill' },\n36       { age:\
  \ 20, name: 'Kate' },\n37       { age: 20, name: 'Tom' },\n38       { age: 24, name:\
  \ 'Cary' },\n39       { age: 37, name: 'Mike' },\n40       { age: 42, name: 'Ben'\
  \ },\n41       { age: 50, name: 'Jane' },\n42       { age: 60, name: 'Julia' },\n\
  43   ]\n44  */\n```\n\n21-quicksort/example.js\n\n# 实现\n\n实现快速排序算法有多种方法。它们在两个方面有所不同：基准点的选择方式（第一个元素、中间元素、最后一个元素）以及分区的方式（就地、非原地）。你可以在\
  \ [JavaScript Algorithms 仓库](https://github.com/trekhleb/javascript-algorithms)\
  \ 中找到不同的实现。\n\n在本章中，我们将通过选择第一个元素作为基准点来实现快速排序，并采用“非原地”分区，以使算法的实现更加清晰易读。\n\n由于我们希望\
  \ `quickSort()` 函数不仅对数字排序，还能对对象排序，因此我们将重用已经在“二分查找”章节中实现的 `Comparator` 工具类。请参考“二分查找”章节以获取\
  \ `Comparator` 类的实现细节。这是一个简单的类，通过 `equal()`、`lessThan()` 和 `greaterThan()` 方法为对象比较提供通用的接口。\n\
  \n\n\n\n\n```javascript\n/**\n * @param {*[]} originalArray - 需要排序的数组。\n * @param\
  \ {function} comparatorCallback - 比较两个元素的函数\n * @return {*[]} - 排序后的数组\n */\nexport\
  \ default function quickSort(originalArray, comparatorCallback = null) {\n  // 根据\
  \ comparatorCallback 函数创建一个比较器。\n  // Comparator 对象将为我们提供常用的比较方法，如 equal() 和 lessThan()。\n\
  \  const comparator = new Comparator(comparatorCallback);\n\n  // 克隆原始数组以防止修改。\n\
  \  // 在此示例中我们不进行原地排序，因此不希望产生副作用。\n  const array = [...originalArray];\n\n  // 如果数组元素少于或等于一个，说明它已经是有序的。\n\
  \  // 这是我们递归的边界情况。\n  if (array.length <= 1) {\n    return array;\n  }\n\n  // 初始化左右两个数组。\n\
  \  const leftArray = [];\n  const rightArray = [];\n\n  // 取数组的第一个元素作为基准（pivot），并初始化中间数组。\n\
  \  const pivotElement = array.shift();\n  const centerArray = [pivotElement];\n\n\
  \  // 将所有数组元素分到左、中、右数组中。\n  // 由于我们是从数组中提取元素，只需检查数组长度来停止循环。\n  while (array.length)\
  \ {\n    // 从未排序数组中提取第一个元素。\n    const currentElement = array.shift();\n\n    //\
  \ 将提取的元素与基准比较，以决定它属于哪个子数组\n    //（左、中或右）。\n    if (comparator.equal(currentElement,\
  \ pivotElement)) {\n      centerArray.push(currentElement);\n    } else if (comparator.lessThan(currentElement,\
  \ pivotElement)) {\n      leftArray.push(currentElement);\n    } else {\n      rightArray.push(currentElement);\n\
  \    }\n  }\n\n  // 递归地排序左右数组。\n  const leftArraySorted = quickSort(leftArray, comparatorCallback);\n\
  \  const rightArraySorted = quickSort(rightArray, comparatorCallback);\n\n  // 现在将排序后的左数组与中间数组以及排序后的右数组合并。\n\
  \  return leftArraySorted.concat(centerArray, rightArraySorted);\n}\n```\n\n`quicksort/quickSort.js`\n\
  \n### 复杂度\n\n| 最优 | 平均 | 最差 |\n| --- | --- | --- |\n| O(n * log(n)) | O(n * log(n))\
  \ | O(n<sup>) |\n\n时间复杂度为 `O(n²)` 的**最坏情况**可能会发生在：如果我们的数组已经按升序排列好，并且我们总是选择数组的第一个元素作为基准点。在这种情况下，经过分区步骤后，所有元素将位于\
  \ `right` 数组中，导致 `left` 数组为空。这种情况将在后续的所有递归分区中持续，我们最终会有 `(n - 1)` 个递归步骤，在这些步骤中会对子数组进行完整遍历，导致\
  \ `O(n²)` 的时间复杂度。\n\n时间复杂度为 `O(n * log(n))` 的**最佳情况**发生在：当基准点将数组划分为两个几乎相等的 `left`\
  \ 和 `right` 部分。在这种情况下，快速排序图中会有 `log(n)` 层（见上方的插图），配合完整的子数组遍历，为我们提供了 `O(n * log(n))`\
  \ 的时间复杂度。\n\n### 题目示例\n\n这里是你在面试过程中可能会遇到的一些相关问题：\n\n* [排序列表](https://leetcode.com/problems/sort-list/)\n\
  * [数组中的第 K 大元素](https://leetcode.com/problems/kth-largest-element-in-an-array/)\n\
  \n### 测验\n\n*Q1: 平均而言，快速排序算法的时间复杂度是多少？\n\n*Q2: 我们如何修改修改 `quickSort()` 函数来让它按降序排列元素？\n\
