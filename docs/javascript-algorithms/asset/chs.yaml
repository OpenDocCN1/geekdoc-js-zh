  \n### `append`\n\n`append` 方法将一个 `LinkedListNode` 对象添加到我们的 `LinkedList` 的末尾。首先，我们创建一个新的\
  \ `LinkedListNode` 对象。\n\n```javascript\nappend(value) {\n  const newNode = new\
  \ LinkedListNode(value);\n```\n\n`02-linked-list/LinkedList.js`\n\n如果我们的 `LinkedList`\
  \ 中没有其他项，那么我们需要将 `this.head` 指向我们的新节点。\n\n```javascript\n// 如果还没有头部，让新节点成为头部。\n\
