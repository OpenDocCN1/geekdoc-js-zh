  }\n```\n\n`02-linked-list/LinkedList.js`\n\n然后，我们获取 `this.tail` 的值，并将该对象的 `next`\
  \ 属性设置为我们新创建的 `LinkedListNode` 对象。\n\n```javascript\nconst currentTail = this.tail;\n\
  currentTail.next = newNode;\n// 将新节点附加到链表的末尾。\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n最后，我们将 `this.tail` 设置为新的 `LinkedListNode` 对象。\n\n```javascript\nthis.tail = newNode;\n\
  \nreturn this;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\n### `delete`\n\n我们的\
  \ `delete` 方法在 `LinkedList` 中找到一个项并将其。首先，我们通过检查 `this.head` 是否为 `null` 来检查我们的 `LinkedList`\
  \ 是否为空。如果是，我们返回 `null`。\n\n```javascript\ndelete(value) {\n  if (!this.head) {\n\
  \    return null;\n  }\n```\n\n`02-linked-list/LinkedList.js`\n\n如果我们的 `LinkedList`\
  \ 包含项，我们会创建一个 `deletedNode` 变量，它将作为占位符，用于最终作为 `delete` 方法的结果返回节点。\n\n```javascript\n\
  let deletedNode = null;\n```\n\n`02-linked-list/LinkedList.js`\n\n在遍历 `LinkedList`\
  \ 之前，我们首先检查 `this.head` 的值是否与我们要删除的值匹配。如果是，我们将 `deletedNode` 变量设置为 `this.head`，然后将\
  \ `this.head` 移动到 `LinkedList` 中的下一个项。\n\n```javascript\n// 如果必须删除头部，则让与头部不同的\n\
  // 下一个节点成为新的头部。\nwhile (this.head && this.head.value === value) {\n  deletedNode\
  \ = this.head;\n  this.head = this.head.next;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n为了遍历 `LinkedList`，我们需要创建一个占位符变量 `currentNode` 来跟踪我们在 `LinkedList` 中的位置。我们将 `currentNode`\
