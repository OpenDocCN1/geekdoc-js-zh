  194     while (currentNode) {\n195       result += currentNode.value + \" -> \"\
  ;\n196       currentNode = currentNode.next;\n197     }\n198     return result +\
  \ \"null\";\n199   }\n```\n\n`02-linked-list/LinkedList.js`\n\n\n\n\n\n让我们来实现一个简单的消息系统，将所有需要处理的消息存储在队列中。在下面的代码中，我们实例化一个新的\
  \ `Queue` 对象，并使用与对象相关的方法对队列进行 `enqueue`（入队）和 `dequeue`（出队），同时使用 `peek` 查看下一个将是哪个消息。我们还使用\
  \ `toString` 和 `isEmpty` 方法来查看队列中当前的内容，并检查队列是否为空。\n\n```\n 1 // 首先，我们需要导入 Queue\
  \ 类。\n 2 import { Queue } from './Queue';\n 3 \n 4 // 然后，我们需要实例化队列。\n 5 const messageQueue\
  \ = new Queue();\n 6 \n 7 // 现在队列是空的，没有消息需要处理。\n 8 messageQueue.isEmpty(); // =>\
  \ true\n 9 messageQueue.toString(); // => ''\n10 \n11 // 向队列添加一条新消息。\n12 messageQueue.enqueue('message_1');\n\
  13 messageQueue.isEmpty(); // => false\n14 messageQueue.toString(); // => 'message_1'\n\
  15 messageQueue.peek(); // => 'message_1'\n16 \n17 // 再添加一条消息。\n18 messageQueue.enqueue('message_2');\n\
  19 messageQueue.isEmpty(); // => false\n20 messageQueue.toString(); // => 'message_1,message_2'\n\
  21 messageQueue.peek(); // => 'message_2'\n22 \n23 // 现在来处理这些消息。\n24 messageQueue.dequeue();\
  \ // => 'message_1'\n25 messageQueue.dequeue(); // => 'message_2'\n26 \n27 messageQueue.isEmpty();\
  \ // => true\n```\n\n`03-queue/example.js`\n\n### Implementation\n\n队列可以用链表（Linked\
  \ List）来实现。链表的结构和操作与队列相似。我们的 `LinkedList` 类拥有一个 `append` 方法和一个 `delete head` 方法，这两个方法对于实现队列都是非常有用的。我们将使用这些方法来构建\
  \ `Queue` 类中的 `enqueue` 和 `de-queue` 方法。\n\n首先，让我们导入 `LinkedList` 类：\n\n```\n1 import\
  \ LinkedList from '../02-linked-list/LinkedList';\n```\n\n`03-queue/Queue.js`\n\n\
  ### `constructor`\n\n在 `Queue` 类的构造函数中，我们创建了一个新的 `LinkedList` 对象用于存储数据：\n\n```\n\
  4   constructor() {\n5     // 我们将基于 LinkedList 实现 Queue。\n6     this.linkedList\
  \ = new LinkedList();\n7   }\n```\n\n`03-queue/Queue.js`\n\n### `enqueue`\n\n现在让我们来实现\
  \ `enqueue()` 操作。该方法将一个新元素添加到队列的末尾。我们将调用 `LinkedList` 对象的 `append` 方法将项目添加到队列末尾：\n\
  \n```\n30   /**\n31    * @param {*} value\n32    */\n33   enqueue(value) {\n34 \
  \    // 入队意味着排队。因此，我们只需要在链表的开头\n35     // 添加新值即可。它需要等待\n36     // 直到所有之前的节点被处理完毕。\n\
  37     this.linkedList.append(value);\n38   }\n```\n\n`03-queue/Queue.js`\n\n###\
  \ `dequeue`\n\n当我们想要 `dequeue()` 元素时，我们从链表中取出第一个元素（链表的 `head`）并将其返回。我们调用 `LinkedList`\
  \ 对象的 `removeHead` 方法，如果该方法返回的节点为 `null`，则返回 `null`。否则，返回节点的值。\n\n```\n40   /**\n\
  41    * @return {*}\n42    */\n43   dequeue() {\n44     // 尝试从链表中删除删除第一个节点（头部）。\n\
  45     // 如果链表中没有头部（为空），则直接返回 null。\n46     const removedHead = this.linkedList.deleteHead();\n\
