  \nYouTube 上的快速排序 [`www.youtube.com/watch?v=SLauY6PpjW4`](https://www.youtube.com/watch?v=SLauY6PpjW4)\n\
  \n快速排序示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort)\n\
  \n## 树。深度优先搜索（Depth-First Search）。\n\n*难度：中等*\n\n### 任务\n\n假设我们有一个节点树，并且想要：\n\n\
  * 检查特定节点是否存在于树中\n* 检查两个节点是否相连\n* 访问树中的所有节点\n\n### 算法\n\n解决上述任务的方法之一是深度优先搜索。\n\n\
  **深度优先搜索 (DFS)** 是一种用于遍历树或图结构的算法。该算法的思想是从某个特定节点（通常是根节点）开始，沿着每个分支尽可能深地进行探索，然后回溯。\n\
  \n*回溯*（backtracking）一词意味着，当我们沿着分支深入移动且没有更多节点可以探索时，我们将沿树向上移动以寻找下一个未探索的分支。\n\n下方的插图展示了二叉树遍历的序列。\n\
  \nimages/22-tree-depth-search.png)\n\n将这个算法想象成你正在穿过迷宫。当你行走时，会遇到迷宫中的交叉路口——这些就像我们树的节点。每个路口有三个选择：向*右*转、向*左*转或*返回*上一个交叉路口（回溯）。假设我们想了一种策略，优先尝试右转。因此我们选择向右转，并用画笔将右转标记为“已访问”，以避免以后再次进入。如果我们遇到迷宫的死胡同（叶子节点），我们会回溯，直到到达一个曾向右过的交叉路口。然后我们向左转，并用画笔将左转标记为“已访问”。当我们到达交叉路口的两个方向都被标记为“已访问”时，我们需要回溯到上一个交叉路口并寻找第一个未访问的转弯。\n\
  \n该算法可以通过递归使用**栈**来实现（关于此数据结构的深入解释，请参见栈章节）。使用栈进行深度优先搜索的思想如下：\n\n1. 选择起始节点并将其所有子节点放入栈中。\n\
  2. 从栈中弹出节点以选择下一个访问节点，将其所有子节点放入栈中。\n3. 返回第 2 步（重复此过程直到栈为空）。\n\n## 使用示例\n\n\n\n\n\n\
  在开始实现深度优先搜索算法之前，让我们先假设我们已经实现了一个 `depthFirstSearch()` 函数。该函数允许我们遍历使用简单 `BinaryTreeNode`\
  \ 类实现的二叉树节点。通过这种方式，我们将更好地理解想要传递给 `depthFirstSearch()` 函数的参数应该什么，以及我们期望从它得到的输出是什么。\n\
  \n在这个用例示例中，我们将使用一个回调函数作为 `depthFirstSearch()` 函数的第二个参数。每当该函数访问树中的一个节点时，该回调函数就会被调用一次。这允许我们在访问每个节点时添加自定义逻辑。\n\
  \n```javascript\n 1 // 导入依赖。\n 2 import { depthFirstSearch } from './depthFirstSearch';\n\
  \ 3 import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
  \ 4 \n 5 // 创建树节点。\n 6 const nodeA = new BinaryTreeNode('A');\n 7 const nodeB =\
  \ new BinaryTreeNode('B');\n 8 const nodeC = new BinaryTreeNode('C');\n 9 const\
  \ nodeD = new BinaryTreeNode('D');\n10 const nodeE = new BinaryTreeNode('E');\n\
  \ 1 \n12 // 使用创建的节点形成二叉树。\n13 nodeA\n14   .setLeft(nodeB)\n15   .setRight(nodeC);\n\
  16 \n17 nodeB\n18   .setLeft(nodeD)\n19   .setRight(nodeE);\n20 \n21 // 初始化包含树中所有遍历节点的数组。\n\
  22 const traversedNodes = [];\n23 \n24 // 创建访问节点回调函数。\n25 const visitNodeCallback\
  \ = (visitedNode) => {\n26   // 一旦访问该节点，将其添加到遍历节点列表中。\n27   traversedNodes.push(visitedNode);\n\
  28 };\n29 \n30 // 执行深度优先树遍历。\n31 depthFirstSearch(nodeA, visitNodeCallback);\n32\
  \ \n33 // eslint-disable-next-line no-console\n34 console.log(traversedNodes);\n\
  35 /*\n36   输出将是：\n37   [nodeA, nodeB, nodeD, nodeE, nodeC]\n38 */\n```\n\n`22-tree-depth-first-search/example.js`\n\
  \n# 实现\n\n为了遍历我们的树，我们必须首先创建一个 `BinaryTreeNode` 类，用于表示二叉树的节点。在类构造函数中，我们将为节点分配值。我们的\
  \ `setLeft()` 和 `setRight()` 方法允许我们向其附加左、右节点。为了易用性，我们将从 `setLeft()` 和 `setRight()`\
  \ 方法返回 `this`，以便能够像 `nodeA.setLeft(nodeB).setRight(nodeC)` 这样进行链式调用。\n\n```javascript\n\
  \ 1 export class BinaryTreeNode {\n 2   /**\n 3    * @param {*} [value]\n 4    */\n\
  \ 5   constructor(value = null) {\n 6     this.left = null;\n 7     this.right =\
  \ null;\n 8     this.value = value;\n 9   }\n10 \n11   /**\n12    * @param {BinaryTreeNode}\
  \ node\n13    */\n14   setLeft(node) {\n15     this.left = node;\n16     return\
  \ this;\n17   }\n18 \n19   /**\n20    * @param {BinaryTreeNode} node\n21    */\n\
  22   setRight(node) {\n23     this.right = node;\n24     return this;\n25   }\n\
  26 }\n```\n\n`06-binary-search-tree/BinaryTreeNode.js`\n\n一旦我们实现了 `BinaryTreeNode`\
  \ 类，就可以实现 `depthFirstSearch()` 函数，用于遍历 `BinaryTreeNode` 实例。该函数接受起始 `node` 作为第一个参数，并将\
  \ `visitNodeCallback()` 作为第二个参数。每当我们在 DFS 路径上遇到新节点时，`visitNodeCallback()` 就会被调用。\n\
  \n我们将使用递归来实现 `depthFirstSearch()` 函数。这意味着，如果当前 `node` 的左、右节点存在，我们将对它们调用 `depthFirstSearch()`\
  \ 函数。\n\n```javascript\n 1 /**\n 2  * 对 rootNode 执行深度优先搜索 (DFS) 遍历。\n 3  *\n 4 \
  \ * @param {BinaryTreeNode} node - 要遍历的起始节点。\n 5  * @param {callback} [visitNodeCallback]\
  \ - 访问节点回调。\n 6  */\n 7 export function depthFirstSearch(node, visitNodeCallback\
  \ = () => {}) {\n 8   // 调用访问节点回调。\n 9   visitNodeCallback(node);\n10 \n11   //\
  \ 遍历左分支。\n12   if (node.left) {\n13     depthFirstSearch(node.left, visitNodeCallback);\n\
  14   }\n15 \n16   // 遍历右分支。\n17   if (node.right) {\n18     depthFirstSearch(node.right,\
  \ visitNodeCallback);\n19   }\n20 }\n```\n\n`22-tree-depth-first-search/depthFirstSearch.js`\n\
  \n之前提到过深度优先搜索算法可以使用 `stack`（栈）数据结构来实现。但观察 `depthFirstSearch()` 函数的代码，你可能会疑惑为什么我们没有使用栈。\n\
  \n### 复杂度\n\n#### 时间复杂度\n\n深度优先搜索算法访问每个节点一次。因此，我们可以说时间复杂度为 `O(N)`。\n\n#### 辅助空间\n\
  \n在最坏的情况下，递归调用栈需要 `O(N)`。\n\n### 题目示例\n\n这里是一些你在面试中可能会遇到的相关问题：\n\n*   [相同树](https://leetcode.com/problems/same-tree/)\n\
  *   [二叉树的最大深度](https://leetcode.com/problems/maximum-depth-of-binary-tree/)\n* \
  \  [验证二叉搜索树](https://leetcode.com/problems/validate-binary-search-tree/)\n\n###\
  \ 测试\n\n*Q1 深度优先搜索的时间复杂度是多少？*\n\n*Q2 实现 depthFirstSearch 时可以避免递归吗？*\n\n### 参考文献\n\
  \n维基百科上的深度优先搜索 [`en.wikipedia.org/wiki/Depth-first_search`](https://en.wikipedia.org/wiki/Depth-first_search)\n\
  \n树的 DFS 示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search)\n\
  \n\n\n\n\n`广度优先搜索 (BFS)` 和 `深度优先搜索 (DFS)` 算法在某些方面非常相似，它们都是在遍历树，但实现方式不同。`BFS 这种方式是宽广`，它通过探索树中某一层上的所有节点，然后才向深一层并探索下一层的节点。`DFS\
  \ 这种方式是深入`，它通过一直向下树的叶子节点来探索树的所有节点，然后回溯并尝试另一个分支，直到到达叶子节点。\n\n下面的图展示了使用广度优先搜索算法遍历二叉树的序列。\n\
  \n![](img/23-tree-breadth-first-search----tree-breadth-first-search.png)\n\n该算法可以使用\
  \ `queue` 实现（参见此书之前关于 `Queue` 数据结构的其中一个章节）。使用队列实现广度优先搜索算法的思路如下：\n\n1. 选取起始节点并将其放入节点队列。\n\
  2. 从队列中弹出下一个节点，将其所有子节点添加到队列中以便稍后访问。\n3. 回到第 2 步（重复此过程直到队列为空）。\n\n## 使用示例\n\n在继续实现广度优先搜索算法之前，让我们假设我们已经实现了一个\
  \ `breadthFirstSearch()` 函数。该函数允许我们遍历使用简单 `BinaryTreeNode` 类实现的二叉树节点。通过这种方式，我们将更好地理解想要传递给\
  \ `breadthFirstSearch()` 函数的参数，以及我们期望它返回的输出。\n\n在这个用用示例中，我们将使用一个回调函数作为 `breadtFirstSearch()`\
  \ 函数的第二个参数。每当函数访问树中的一个节点时，该回调就会被调用一次。这允许我们在访问每个节点时添加自定义逻辑。\n\n```\n 1 // 导入依赖项。\n\
  \ 2 import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
  \ 3 import { breadthFirstSearch } from './breadthFirstSearch';\n 4 \n 5 // 创建树节点。\n\
  \ 6 const nodeA = new BinaryTreeNode('A');\n 7 const nodeB = new BinaryTreeNode('B');\n\
  \ 8 const nodeC = new BinaryTreeNode('C');\n 9 const nodeD = new BinaryTreeNode('D');\n\
  10 const nodeE = new BinaryTreeNode('E');\n 11 \n 12 // 由创建的节点构建一个二叉树。\n 13 nodeA\n\
  \ 14   .setLeft(nodeB)\n 15   .setRight(nodeC);\n 16 \n 17 nodeB\n 18   .setLeft(nodeD)\n\
  \ 19   .setRight(nodeE);\n 20 \n 21 // 初始化包含树中所有遍历节点的数组。\n 22 const traversedNodes\
  \ = [];\n 23 \n 24 // 创建访问节点回调。\n 25 const visitNodeCallback = (visitedNode) =>\
  \ {\n 26   // 一旦访问该节点，我们就将其添加到节点列表中。\n 27   traversedNodes.push(visitedNode);\n\
  \ 28 };\n 29 \n 30 // 执行广度优先遍历。\n 31 breadthFirstSearch(nodeA, visitNodeCallback);\n\
  \ 32 \n 33 // 检查遍历是否按顺序发生。\n 34 expect(traversedNodes).toEqual([\n 35   nodeA, nodeB,\
  \ nodeC, nodeD, nodeE,\n 36 ]);\n 37 \n 38 // eslint-disable-next-line\n 39 console.log(traversedNodes);\n\
  \ 40 /*\n 41   输出将是：\n 42   [nodeA, nodeB, nodeC, nodeD, nodeE]\n 43 */\n```\n`23-tree-breadth-first-search/example.js`\n\
  \n# 实现\n\n由于我们要遍历二叉树，让我们创建一个简单的 `BinaryTreeNode` 类来表示二叉树的节点。使用 `constructor` 我们将值赋值给节点。此外，通过\
  \ `setLeft()` 和 `setRight()` 方法，我们能够附加左节点和右节点。为了方便使用，我们将从 `setLeft()` 和 `setRight()`\
  \ 方法返回 `this`，以便能够像 `nodeA.setLeft(nodeB).setRight(nodeC)` 这样的链式调用。\n\n```\n 1 export\
  \ BinaryTreeNode {\n 2   /**\n 3    @param {*} [value]\n 4    */\n 5   constructor(value\
  \ = null) {\n 6     this.left = null;\n 7     this.right = null;\n 8     this.value\
  \ = value;\n 9   }\n 10 \n 11   /**\n 12    @param {BinaryTreeNode} node\n 13  \
  \  */\n 14   setLeft(node) {\n 15     this.left = node;\n 16     return this;\n\
  \ 17   }\n 18 \n 19   /**\n 20    @param {BinaryTreeNode} node\n 21    */\n 22 \
  \  setRight(node) {\n 23     this.right = node;\n 24     return this;\n 25   }\n\
  \ 26 }\n```\n`06-binary-search-tree/BinaryTreeNode.js`\n\n由于广度优先遍历使用队列来存储所有应该访问的节点，让我们先导入\
  \ `Queue` 类。\n\n```\n// 导入依赖项。\nimport { Queue } from '../03-queue';\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
  \n由于我们要遍历二叉树，广度优先遍历使用队列来存储所有应该访问的节点，让我们先导入 `Queue` 类。\n\n一旦我们实现了 `BinaryTreeNode`\
  \ 类并导入了 `Queue`，我们就可以开始 `breadthFirstSearch()` 函数的实现，该函数将接收 `rootNode` 作为第一个参数，`visitNodeCallback`\
  \ 作为第二个参数。在 `breadthFirstSearch()` 函数内部我们需要：\n\n1. 创建一个空队列实例 `nodeQueue`，\n2. 将\
  \ `rootNode` 放入队列以开始遍历，\n3. 从队列中弹出下一个节点并赋值给 `currentNode` 变量，\n4. 调用 `visitNodeCallback()`\
  \ 回调以通知订阅者节点，\n5. 直到 `nodeQueue` 为空。\n\n以下是该函数的实现：\n\n```\n 4 /**\n5  * 执行广度优先搜索\
  \ (BFS) 遍历。\n6  *\n7  * @param {BinaryTreeNode} rootNode - 起始节点。\n8  * @param {callback}\
  \ [visitNodeCallback] - 访问回调。\n9  */\n10 export function breadthFirstSearch(rootNode,\
  \ visitNodeCallback = () {}) {\n11   // 队列设置。\n12   const nodeQueue = new Queue();\n\
  13   // 将起始节点放入队列。\n14   nodeQueue.enqueue(rootNode);\n15 \n16   // 直到队列为空访问队列的所有节点。\n\
  17   while (!nodeQueue.isEmpty()) {\n18     // 获取下一个访问的节点。\n19     const currentNode\
  \ = nodeQueue.dequeue();\n20 \n21     // 调用访问回调。\n22     visitNodeCallback(currentNode);\n\
  23 \n24     // 将左节点加入遍历队列。\n25     if (currentNode.left) {\n26       nodeQueue.enqueue(currentNode.left);\n\
  27     }\n28 \n29     // 将右节点加入遍历队列。\n30     if (currentNode.right) {\n31      \
  \ nodeQueue.enqueue(currentNode.right);\n32     }\n33   }\n34 }\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
  \n### 复杂度\n\n#### 时间复杂度\n\n上述实现的广度优先搜索算法恰好访问树中的每个节点一次。这是通过使用 `Queue` 实例实现的。由于树不能有循环连接（即两个节点共享同一个子节点），我们可以说每个节点只放入队列一次。然后通过访问它从队列中提取每个节点一次。因此，我们可以说使用广度方法遍历树的时间复杂度为\
  \ `O(|N|)`，其中 `|N|` 是树中的节点总数。\n\n#### 辅助空间复杂度\n\n在最坏情况下，我们将有一个类似于链表的非平衡树（如果树的每个节点只有一个左孩子或右孩子）。由于我们使用队列来存储将被访问的节点列表，队列在最坏情况下可能包含树的所有节点。因此，在最坏情况下，我们的队列实例需要\
  \ `O(|N|)` 的辅助内存空间。\n\n\n\n\n\nQ2: 如何调整函数 `depthFirstSearch()` 以支持树节点拥有两个及以上的子节点？\n\
  \n### 参考文献\n\n- Wikipedia 上的度优先搜索 (BFS) [`en.wikipedia.org/wiki/Breadth-first_search`](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
  - 树的 BFS 示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search)\n\
  \n## 图形。深度优先搜索。\n\n*难度中等*\n\n### 任务\n\n假设我们有一个图，并且想要：\n\n- 检查特定顶点是否存在于图中（即对顶点“John”执行\
  \ `search` 操作），\n- 检查两个节点是否连通（即：在顶点“Bill”和“Tom”之间 `find connection path`），\n- 通过访问图中的所有顶点来对顶点进行盘点（即将图转换为数组），\n\
  - 等等（更多用例请参见下文的应用程序部分）。\n\n![](img/24-graph-depth-first-search----graph.png)\n\n\
  为了完成所有这些任务，我们需要利用`graph traversal algorithm`。换句话说，我们需要编写一种算法，能够访问从特定顶点可以到达图的所有顶点。\n\
  \n### 算法\n\n解决上述任务的方法之一是深度优先搜索算法。\n\n**深度优先搜索 (DFS)** 是一种用于遍历或搜索树或图数据结构的算法。该算法的核心思想是从某个特定节点（或顶点）开始，沿着每个分支尽可能深地探索，然后进行回溯。\n\
  \n在这里，`backtracking`（回溯）一词意味着当我们沿着图的分支深入移动并且当前路径上没有更多节点可以探索时，我们将向后移动，寻找另一个最近的未探索子分支（顶点），然后对其探索。\n\
  \n下面的插图展示了使用深度优先搜索算法进行图遍历的序列。\n\n![](img/24-graph-depth-first-search----graph-depth-first-search.png)\n\
  \n为了更好地理解深度优先搜索算法，你可以将其想象成穿过迷宫的过程。图是迷宫，图的边是路径，图的顶点是迷宫路径的交叉口。当你到达一个交叉口时，标记你打算走的路径，以避免将来再次走同一条路。当你到达一个所有路径都被标记为“已访问”的交叉口时，你会回到上一个交叉口（回溯），并选择另一条尚未过的路径。这个过程不断重复，直到你到达迷宫的出口。\n\
  \n该算法可以使用 `stack` 递归实现（参见本书中关于 `Stack` 数据结构的之前的章节）。使用栈进行深度优先搜索的想法如下：\n\n1. 选择起始顶点并将其添加到栈中。\n\
  2. 从栈中弹出下一个顶点并“访问”它（即：调用回调函数或对该顶点执行某些操作）。\n3. 将当前顶点的所有 `unvisited`（未访问）邻居推入栈中。\n\
  4. 回到第 2 步（重复此过程直到栈为空）。\n\n也可以使用 **Hash map**（哈希表）数据结构来高效检查顶点是否已经过访问。顶点必须具有一个唯一的\
  \ `key` 值，用作哈希表的键。\n\n### 应用\n\n深度优先搜索算法是与其他图相关算法的构建模块，例如：\n\n- 寻找连通分量，\n- 拓排序，\n\
  - 寻找图的桥，\n- 检测图中的环，\n- 路径查找，\n- 解决只有一个解的谜题（如迷宫），\n- 迷宫生成可能会使用随机深度优先搜索\n- 等等。\n\n\
  ## 使用示例\n\n在实现 `depthFirstSearch()` 函数之前，让我们看看将如何使用它以及我们将向它传递哪些参数。`depthFirstSearch()`\
  \ 函数需要知道要遍历哪个图，以及从哪个起始顶点开始遍历过程。此外，我们还想向函数传递一个回调函数，该函数将在每次访问一个新顶点时被调用。考虑到这些点，让我们使用书书中“图形（Graphs）”章节中的\
  \ `Graph` 类创建一个非常基础的社交网络，然后遍历它。\n\n这是我们要实现的网络结构。\n\n![](img/24-graph-depth-first-search----network.png)\n\
  \n让我们从 `Bill` 开始，遍历所有直接连接或通过其他用户连接到 `Bill` 的用户。首先我们将创建一个图（类比社交网络）。接下来，我们将创建图顶点（类比在网络中注册用户）。然后，将在图节点之间创建图边（类比将用户添加到好友列表）。然后，我们将从\
  \ `Bill` 开始遍历所有用户。\n\n```\n 1 // 导入依赖项。\n 2 import Graph from '../08-graph/Graph';\n\
  \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
  \ '../08-graph/GraphEdge';\n 5 import { depthFirstSearch } from './depthFirstSearch';\n\
  \ 6 \n 7 // 创建我们过度简化的社交网络的演示版本。\n 8 const socialNetwork = new Graph();\n 9\n10 //\
  \ 让在我们的网络中注册几个用户。\n11 const bill = new GraphVertex('Bill');\n12 const alice = new\
  \ GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const kate\
  \ = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n16 const tom\
  \ = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n18\n19 // 现在在用户之间建立友谊关系。\n\
  20 socialNetwork\n21   .addEdge(new GraphEdge(bill, alice))\n22   .addEdge(new GraphEdge(bill,\
  \ john))\n23   .addEdge(new GraphEdge(bill, kate))\n24   .addEdge(new GraphEdge(alice,\
  \ ann))\n25   .addEdge(new GraphEdge(ann, sam))\n26   .addEdge(new GraphEdge(john,\
  \ ann))\n27   .addEdge(new GraphEdge(kate, tom));\n28\n29 // 现在让我们以深度优先的方式遍历网络\n\
  30 // 并我们将遇到的所有用户添加到 userVisits。\n31 const userVisits = [];\n32 depthFirstSearch(socialNetwork,\
  \ bill, (user) => {\n33   userVisits.push(user);\n34 });\n35\n36 // 现在让我们看看用户是以什么顺序遍历的。\n\
  37 // eslint-disable-line no-console\n38 console.log(userVisits);\n39 /*\n40   输出将是\n\
  41   [bill, alice, ann, sam, john, kate]\n42 */\n```\n\n24-graph-depth-first-search/example.js\n\
  \n# 实现\n\n**函数参数**\n\n如上所述，`depthFirstSearch()` 函数接受三个参数：\n\n- `graph` - 要遍历的图（`Graph`\
  \ 类的实例），\n- `startVertex` - 我们将作为起始点的顶点（`GraphVertex` 类的实例），\n- `enterVertexCallback`\
  \ - 在每次访问顶点时调用的回调函数。\n\n**访问顶点记忆化**\n\n当我们为树实现深度优先搜索算法时，我们并不担心同一个节点在不同父节点处被访问两次的情况。这是因为树节点根据定义不能有两个或多个父节点，否则它就会变成图。因此，在树中我们只有一种进入节点的方式。但当我们处理图时，我们需要记住同一个图顶点可能会从许多邻居顶点被访问多次。这样同一个顶点可能会被多次添加到我们的遍历栈中。这使得整个遍历过程效率低下，甚至可能导致无限循环。这就是为什么我们在遍历图时需要标记所有访问过的顶点，以避免重复访问同一个顶点。我们将使用\
  \ `visitedVertices` 对象来实现。已访问图顶点的 `key` 值将是 `visitedVertices` 对象的键。这将帮助我们以 `O(1)`\
  \ 时间高效地检查节点是否已经过访问。\n\n**递归闭包**\n\n\n\n\n\n在我们的 `depthFirstSearch()` 函数内部，让我们实现一个递归的\
  \ `depthFirstSearchRecursive()` 函数。该函数将包含主要的遍历逻辑。`depthFirstSearchRecursive()` 函数是一个闭包，这意味着它可以访问\
  \ `depthFirstSearch()` 函数的所有变量和参数。因此，我们只需要向它传递一个参数，该参数是当前正准备遍历的顶点（`currentVertex`\
  \ 参数）。\n\n`depthFirstSearchRecursive()` 的作用仅仅是调用 `enterVertexCallback()` 函数，获取 `currentVertex`\
  \ 的所有 `unvisited` 邻居，将它们标记为已访问，并对 `currentVertex` 的每个未访问的邻居再次调用自身。\n\n### 实现示例\n\
  \n```\n 1 /**\n 2  * 以深度优先的方式遍历图。\n 3  *\n 4  * @param {Graph} graph - 准备被遍历的图。\n\
  \ 5  * @param {GraphVertex} startVertex - 我们将用作起始点的顶点。\n 6  * @param {function}\
  \ enterVertexCallback - 在每次访问顶点时调用的回调函数。\\\n 7 tex visit.\n 8  */\n 9 export function\
  \ depthFirstSearch(graph, startVertex, enterVertexCallback) {\n10   // 为了防止重复访问同一个顶点\n\
  11   // 我们需要记住所有已访问的顶点。\n12   const visitedVertices = {};\n13 \n14   // 因为我们要先访问\
  \ startVertex，所以先将其添加到访问列表。\n15   visitedVertices[startVertex.getKey()] = true;\n\
  16 \n17   /**\n 18    * 深度优先搜索的递归实现。\n 19    *\n 20    * @param {GraphVertex} currentVertex\
  \ - 当前正在遍历的图顶点\\\n 21  rsed.\n 22    */\n 23   const depthFirstSearchRecursive =\
  \ (currentVertex) => {\n 24     // 调用回调通知订阅者进入了新顶点。\n 25     enterVertexCallback(currentVertex);\n\
  \ 26 \n 27     // 遍历当前访问顶点的每个邻居。\n 28     currentVertex\n 29       .getNeighbors()\n\
  \ 30       .forEach((nextVertex) => {\n 31         // 如果邻居顶点之前未被访问，则访问它。\n 32  \
  \       if (!visitedVertices[nextVertex.getKey()]) {\n 33           // 记住当前邻居，以避免以后再次访问。\n\
  \ 34           visitedVertices[nextVertex.getKey()] = true;\n 35           // 访问下一个邻居顶点。\n\
  \ 36           depthFirstSearchRecursive(nextVertex);\n 37         }\n 38      \
  \ });\n 39   };\n 40 \n 41   // 通过调用递归函数开始图遍历。\n 42   depthFirstSearchRecursive(startVertex);\n\
  \ 43 }\n```\n\n`24-graph-depth-first-search/depthFirstSearch.js`\n\n###栈（Stack）的使用\n\
  \n上面提到过深度优先搜索算法可以使用 `Stack` 数据结构来实现。我们可以使用 `Stack` `显式地`（explicitly）或 `隐式地`（implicitly）实现\
  \ DFS 算法。\n\n对于`显式栈的使用`，我们需要从书中的“Stack”章节导入一个 `Stack` 类实现（或任何其他栈的实现，包括普通的 JavaScript\
  \ 数组），并使用栈实例来存储我们要遍历的所有顶点。只要栈不空，我们就从它中 `pop()` 最后添加的顶点，获取该顶点的所有未访问邻居，将它们 `push()`\
  \ 到栈中并重复此过程。显式栈的使用不需要递归，`while` 循环可能是更好的选择。\n\n但在上面的 `depthFirstSearch()` 函数中，我们通过递归`隐式地`使用了栈。虽然我们没有显式地导入\
  \ `Stack` 类，但我们仍然以递归`函数调用栈`的形式在处理栈。每当 `depthFirstSearchRecursive()` 函数调用自身时，JavaScript\
  \ 引擎就会将当前函数的变量（状态）推入内存栈中。\n\n![](img/24-graph-depth-first-search----graph-depth-first-search-stack.png)\n\
  \n### 复杂度\n\n#### 时间复杂度\n\n`depthFirstSearch()` 函数的时间复杂度主要由其内部递归函数 `depthFirstSearchRecursive()`\
  \ 的时间复杂度决定。因为 `depthFirstSearchRecursive()` 之外的所有操作都是常数操作。在 `depthFirstSearchRecursive()`\
  \ 函数内部，我们执行了以下操作：\n\n* 获取当前顶点的所有邻居。为了做到这一点，我们需要遍历连接到当前顶点的所有边。因此，边的数量将影响这一步骤的性能。\n\
  \n* 遍历当前顶点的所有未访问邻居。顶点越多，此步骤需要的迭代就越多。\n\n考虑到所有因素，我们可以得出图的深度优先搜索算法的时间复杂度为 `O(|V| +\
  \ |E|)`，其中 `|V|` 是图中顶点的总数，`|E|` 是图中边的总数。\n\n#### 辅助空间复杂度\n\n在 `depthFirstSearch()`\
  \ 函数的当前实现中，我们使用了递归。每次递归调用都会增加函数调用栈。在最坏的情况下（即图类似于链表），函数 `depthFirstSearchRecursive()`\
  \ 的调用栈将与图中顶点数量 `|V|` 成正比。此外，我们使用 `visitedVertices` map 来跟踪已访问的顶点。该 map 需要存储所有 `|V|`\
  \ 个顶点的空间。\n\n考虑到所有因素，我们可以得出辅助空间复杂度为 `O(|V|)`。\n\n### 结论\n\n图的深度优先搜索算法的时间复杂度为 `O(|V|\
  \ + |E|)`，其中 `|V|` 是图中顶点的总数，`|E|` 是图中边的总数。辅助空间复杂度为 `O(|V|)`。\n\n\n\n\n\n该算法可以使用\
  \ `queue` 实现（参见本书之前章节关于 `Queue` 数据结构的章节之一）。`Queue` 数据结构将为我们提供期望的 FIFO（先进先出）图顶点访问顺序，这样我们就会向宽度方向而非深度方向进行扩展。FIFO\
  \ 顺序基本上意味着，一旦我们将当前顶点的所有邻居添加到 `Queue` 中，我们将首先在邻居之间进行移动，先访问第一个邻居，然后是第二个邻居，依此类推，最后移动到下一层邻居的子节点。这与我们实现深度优先遍历时使用的\
  \ `Stack` 的 LIFO（后进先出）方法相反，在深度优先遍历中，我们每次访问的是栈中添加的最后一个节点。通过这种方式，我们移动的不是从邻居到邻居，而是先从父节点到孩子。\n\
  \n使用队列进行广度优先搜索的想法如下：\n\n1. 选择起始顶点并将其放入访问队列。\n2. 从队列中获取下一个顶点并“访问”它（即调用回调函数或对顶点执行某些操作）。\n\
  3. 将当前顶点的所有 `unvisited` 邻居添加到队列中以便稍后访问。\n4. 回到步骤 2（重复此过程直到队列为空）。\n\n可以使用 `Hash map`\
  \ 数据结构来高效地检查顶点是否已经被访问。顶点必须有一个唯一的 `key` 值，该值用作哈希映射的键。\n\n### 应用\n\n广度优先搜索算法用于寻找图中两个节点之间的最短路径。由于图可以表示现实世界的数据，如道路网络、社交网络、计算机网络，因此找到许多\
  \ BFS 算法的应用：\n\n* **GPS 导航** - 寻找从你的位置（图中的顶点）到特定城市（图中的另一个顶点）的最短路径（地图图中边的组合）。\n*\
  \ **计算机网络** - 通过 P2P 客户端（即 Torrent 客户端）遍历点对点（P2P）网络，以找到所需文件的“最近”主机。\n* **社交网络**\
  \ - 寻找与他人具有给定距离的人。\n* **网络爬虫** - 通过遵循从首页以及从内部页的链接来遍历网站内容。使用 BFS 可以设置网站爬取所需的特定深度。\n\
  \n广度优先搜索算法还是其他图相关算法的构建模块，例如 Cheney 算法（复制垃圾收集）、Cuthill–McKee 网格编号、用于计算流网络最大流的 Ford–Fulkerson\
  \ 方法等。\n\n## 使用示例\n\n在实现 `breadthFirstSearch()` 函数之前，让我们看看将如何使用它以及将向它传递哪些参数。`breadthFirstSearch()`\
  \ 函数需要知道遍历哪一个图以及从哪个起始顶点开始遍历过程。此外，我们还想向函数传递一个回调，该回调将在每次访问新顶点时被调用。考虑到所有这些，让我们使用本书“图”（Graphs）章节中的\
  \ `Graph` 类创建一个非常简单的社交网络，然后遍历它。\n\n这是我们要实现的网络结构。\n\n![](img/25-graph-breadth-first-search----network.png)\n\
  \n让我们从 `Bill` 开始，遍历所有直接或通过其他用户连接到 `Bill` 的用户。首先我们将创建一个图（社交网络的类比）。接下来，我们将创建图顶点（类比在网络中注册用户）。然后，将在图节点之间创建图边（类比将用户添加到好友列表）。最后，我们将从\
  \ `Bill` 开始遍历所有用户。\n\n```javascript\n 1 // 依赖。\n 2 import Graph from '../08-graph/Graph';\n\
  \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
  \ '../08-graph/GraphEdge';\n 5 import { breadthFirstSearch } from './breadthFirstSearch';\n\
  \ 6 \n 7 // 创建我们过度简化的社交网络的演示版本。\n 8 const socialNetwork = new Graph();\n 9 \n10\
  \ // 在我们的网络中注册几个用户。\n11 const bill = new GraphVertex('Bill');\n12 const alice =\
  \ new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const\
  \ kate = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n16 const\
  \ tom = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n 18 \n\
  19 // 现在让我们网络中的用户之间建立友谊连接。\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill,\
  \ alice))\n 22   .addEdge(new GraphEdge(bill, john))\n 23   .addEdge(new GraphEdge(bill,\
  \ kate))\n 24   .addEdge(new GraphEdge(alice, ann))\n 25   .addEdge(new GraphEdge(ann,\
  \ sam))\n 26   .addEdge(new GraphEdge(john, ann))\n 27   .addEdge(new GraphEdge(kate,\
  \ tom));\n 28 \n29 // 现在让我们从 Bill 开始以广度优先的方式遍历网络\n30 // 并我们将遇到的所有用户添加到 userVisits\
  \ 数组中。\n31 const userVisits = [];\n32 breadthFirstSearch(socialNetwork, bill, (user)\
  \ => {\n33   userVisits.push(user);\n34 });\n35 \n36 // 现在看看用户是以什么顺序被遍历的。\n37 console.log(userVisits);\n\
  38 // 输出将是：\n39 [bill, alice, john, kate, ann, tom, sam]\n```\n\n\n\n\n```javascript\n\
  /**\n *  以广度优先的方式遍历图。\n *\n * @param {Graph} graph - 将要遍历的图。\n * @param {GraphVertex}\
  \ startVertex - 我们将用作起始点的顶点。\n * @param {function} enterVertexCallback - 每次访问顶点时都会调用的回调函数。\n\
  \ */\nexport function breadthFirstSearch(graph, startVertex, enterVertexCallback)\
  \ {\n  // 初始化顶点队列。每当我们遇到一个新顶点时，它会被\n  // 添加到队列中以便进一步探索。\n  const vertexQueue = new\
  \ Queue();\n\n  // 将 startVertex 加入队列，因为我们将首先访问它。\n  vertexQueue.enqueue(startVertex);\n\
  \n  // 为了防止重复访问同一个顶点，\n  // 我们需要记住所有访问过的顶点。\n  const visitedVertices = {};\n\n \
  \ // 既然我们要首先访问 startVertex，就把它添加到已访问列表中。\n  visitedVertices[startVertex.getKey()]\
  \ = true;\n\n  // 只要队列不为空就遍历队列中的所有顶点。\n  while (!vertexQueue.isEmpty()) {\n    //\
  \ 从队列中获取下一个顶点。\n    const currentVertex = vertexQueue.dequeue();\n\n    // 调用回调函数通知订阅者进入了新顶点。\n\
  \    enterVertexCallback(currentVertex);\n\n    // 将所有邻居加入队列以供后续遍历。\n    currentVertex.getNeighbors().forEach((nextVertex)\
  \ => {\n      if (!visitedVertices[nextVertex.getKey()]) {\n        // 记住当前邻居以避免未来再次访问它。\n\
  \        visitedVertices[nextVertex.getKey()] = true;\n\n        // 将 nextVertex\
  \ 加入队列以便后续访问。\n        vertexQueue.enqueue(nextVertex);\n      }\n    });\n  }\n\
  }\n```\n\n`graph-breadth-first-search/breadthFirstSearch.js`\n\n### 复杂度\n\n####\
  \ 时间复杂度\n\n`breadthFirstSearch()` 函数的时间复杂度主要由 `while` 循环决定，因为 `while` 循环之外的所有行执行时间均为\
  \ `O(1)`。记住，通过使用 `visitedVertices` 哈希表，我们防止了同一个顶点被多次添加到 `vertexQueue` 中。因此我们可以假设进入\
  \ `while` 循环恰好 `|V|` 次，其中 `|V|` 是我们正在遍历的图中连通顶点的数量。我们还需要考虑到，我们遍历了每一个顶点边并通过调用 `currentVertex.getNeighbors()`\
  \ 来获取顶点的邻居。因此，我们的函数也会访问所有的 `|E|` 条图边。最后需要说明的是，在 `while` 循环内部我们有与队列相关的 `enqueue()`\
  \ 和 `dequeue()` 操作，这些操作的执行时间为 `O(1)`，因为我们处理的是基于链表的 `Queue` 实现（更多细节请参阅关于队列数据结构的章节）。\n\
  \n考虑到以上因素，我们可以得出结论：breadthFirstSearch()` 函数的时间复杂度为 `O(|V| + |E|`，其中 `|E|` 是图边的数量，`|V|`\
  \ 是图中顶点的数量。\n\n#### 辅助空间复杂度\n\n在 `breadthFirstSearch()` 函数当前的实现中，我们使用了以下额外变量：\n\n\
  * `vertexQueue` 队列 - 保存所有的 `|V|` 个图顶点，\n* `visitedVertices` 哈希表 - 保存所有的 `|V|` 个图顶点键，\n\
  * `currentVertex` 变量 - 仅保留一个当前顶点实例。\n\n由于 `vertexQueue` 和 `visitedVertices` 变量最消耗空间，我们可以得出：breadthFirstSearch()`\
  \ 函数的辅助空间复杂度为 `O(|V|)`，其中 `|V|` 是图中顶点的数量。\n\n### 题目示例\n\n这里是你在面试过程中可能会遇到的一些相关问题：\n\
  \n* [克隆图](https://leetcode.com/problems/clone-graph/)\n* [图是二分图吗？](https://leetcode.com/problems/is-graph-bipartite/)\n\
  * [被围绕的区域](https://leetcode.com/problems/surrounded-regions/)\n\n### 测验\n\n* *Q1:\
  \ 图广度优先搜索算法的时间复杂度是多少？*\n* *Q2: 哪种数据结构最适合实现图广度优先搜索算法：栈（Stack）还是队列（Queue）？*\n\n###\
  \ 参考文献\n\nWikipedia 广度优先搜索 (BFS) [`en.wikipedia.org/wiki/Breadth-first_search`](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
  \n广度优先搜索可视化 [`www.cs.usfca.edu/~galles/visualization/BFS.html`](https://www.cs.usfca.edu/~galles/visualization/BFS.html)\n\
  \n图 BFS 示例和测试案例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search)\n\
  \n## Dijkstra 算法\n\n* *难度：困难 (hard)*\n\n### 任务\n\n*给定一个图和一个源顶点，找到从源点的最短路径。*\n\n\
  **示例**\n\n图的一个良好例子是包含城市（顶点）和连接它们的道路（边）的地图。如果图是有向的，意味着道路是单程的。如果图是无向的，则道路是双向的。此外，图可以是加权的。\n\
  \n### 算法\n\n#### 算法定义\n\n**Dijkstra 算法**是一种寻找图中节点间最短路径的算法，图中可以代表路网。它由计算机科学家 Edsger\
  \ W. Dijkstra 于 1956 年提出。\n\nDijkstra 的原始变体寻找两个节点之间的最短路径，但更常见的变体是寻找从源点到所有节点的最短路径。\n\
  \n#### 算法步骤\n\n该算法包含以下步骤：\n\n1. 为所有顶点分配一个**临时距离**值：将起始顶点设置为 `0`（因为我们已经到达了），并将所有其他顶点设置为无穷大\
  \ `Infinity`（此时它们看起来是不可及的）。\n2. 创建**已访问顶点集合**。我们将用它来避免遍历顶点时出现死循环。\n3. 创建一个**顶点访问队列**并将起始顶点放入队列。我们将使用以顶点距离作为优先因子的优先级队列（优先级在之前的章节中解释过）。到起始点的距离越短，优先级越高。\n\
  4. **从队列中弹出最近的顶点**（距离源点最近的顶点）。优先级队列允许我们实现这一点。\n5. **遍历当前顶点的每个未访问邻居**。对于每个邻居，计算`到当前顶点的距离\
  \ + 当前顶点到邻居的距离`。如果此距离小于邻居的临时距离，则将其替换为新值。\n6. 当考虑完当前顶点的所有邻居后，**将当前顶点标记为已访问**。\n7.\
  \ **返回步骤 4** 并重复，直到顶点访问队列为空。\n\n#### 算法中优先级队列的使用\n\n在 Dijkstra 算法中，每当我们弹出要访问的顶点时（步骤\
  \ 4），它必须是一个之前未访问过且*距离起始点距离最短*的节点。\n\n但我们如何实现这种基于距离的弹出操作呢？\n\n\n\n\n如果我们使用之前一个章节中实现的\
  \ `Queue` 类，那么 `Queue` 将遵循 FIFO（先入先出）顺序，但它不会考虑距离。例如，如果我们向队列中添加一个距离为 `20` 的顶点，然后向队列中添加一个距离为\
  \ `10` 的顶点，那么 `poll()` 操作将返回我们距离为 `20` 的顶点，因为它是先放入队列的——而不是距离较短的 `10` 顶点。因此，使用 `Queue`\
  \ 是行不通的。\n\n另一种方法是将顶点访问队列存储为数组，每当我们我们需要从中获取下一个顶点时，可以遍历整个数组，并找到/返回具有最短距离的下一个顶点。这种方法可行，但时间复杂度为\
  \ `O(n)`。\n\n## 我们能让获取（polling）更快吗？\n\n是的，通过使用优先级队列（priority queue）可以。在这种情况下，获取操作的时间复杂度将为\
  \ `O(log(n))`，这使得算法运行得更快。\n\n你可以在本书的“优先级队列”章节中找到 `PriorityQueue` 类的完整描述以及实现示例。\n\
  \n## 逐步示例\n\n让我们采用上面的图，尝试应用 Dijkstra 算法寻找从 `Home` 顶点到所有顶点的最短路径。\n\n### 第 1 步\n\n\
  初始化所有顶点的临时距离。`startingVertex`（在我们案例中是 `Home` 顶点）的临时距离将为 `0`，这意味着到达 `Home` 不需要努力，因为我们已经在那里了。所有其他顶点的临时距离都被设置为\
  \ `Infinity`，因为我们不知道它们距离 `Home` 有多远，甚至不知道它们是否可达。\n\n我们将 `Home` 顶点添加到顶点优先级队列中，以便从它开始遍历图。\n\
  \n![](img/26-dijkstra----dijkstra-steps-step-1.png)\n\n### 第 2 步\n\n从优先级队列中获取下一个顶点。记住，每当我们从优先级队列中获取顶点时，它都会返回距离\
  \ `startingVertex` 最近的顶点。在我们的案例中，优先级队列中只有一个节点，就是 `Home` 顶点。因此当前顶点是 `Home`。\n\n获取\
  \ `Home` 的所有邻居，并使用公式 `distanceToHome + distanceFromHomeToNeighbor` 设置它们的距离。在我们案例中，对于顶点\
  \ `A`，我们将距离设置为 `0 + 5 = 5`；对于顶点 `D`，我们将距离设置为 `0 + 8 = 8`。这意味着目前到 `A` 的最短距离是 `5`，到\
  \ `D` 的最短距离是 `8`。\n\n将顶点 `A` 和 `D` 推入优先级队列。\n\n一旦我们遍历了 `Home` 顶点的所有邻居，就可以将其标记为 `visited`（已访问）（你会看到下一个插图中\
  \ `Home` 节点被标记为黑色，这意味着它已被访问）。\n\n![](img/26-dijkstra----dijkstra-steps-step-2.png)\n\
  \n### 第 3 步\n\n从我们的顶点优先级队列中获取下一个离 `Home` 最近的未访问顶点。在我们案例中，队列中只有两个顶点，分别是 `A` 和 `D`。由于\
  \ `A` 顶点更离 `Home` 顶点（距离为 `5`），我们先访问它。\n\n获取 `A` 的所有未访问的邻居。邻居是顶点 `B` 和顶点 `C`。让我们使用公式\
  \ `distanceToA + distanceFromAtoNeighbor` 计算到邻居的最短路径。对于顶点 `B`，距离计算为 `5 + 9 = 14`。对于顶点\
  \ `C`，距离计算为 `5 + 3 = 8`。\n\n将新邻居 `B` 和 `C` 添加到顶点优先级队列。\n\n由于 `A` 的所有邻居已被访问，我们将 `A`\
  \ 标记为已访问（它将在下一个插图中变为黑色）。\n\n![](img/26-dijkstra----dijkstra-steps-step-3.png)\n\n\
  ### 第 4 步\n\n从我们的顶点优先级队列中获取下一个离 `Home` 最近的未访问顶点。在我们案例中，队列中只有三个顶点，分别是 `D`、`C` 和 `B`。由于\
  \ `D` 和 `C` 顶点离 `Home` 最近（距离为 `8`），让我们查看它们中先添加到队列的顶点。它将是顶点 `D`。\n\n获取 `D` 的所有邻居（顶点\
  \ `C` 和 `E`），并计算到它们的最短距离。对于 `C`，我们将得到 `8 + 4 = 12`，对于 `8 + 6 = 14`。注意，顶点 `C` 已经有一个计算出的距离了。如果我们从顶点\
  \ `A` 去顶点 `C`，那么从 `Home` 到顶点 `C` 的距离将是 `8`。由于通过顶点 `D` 从 `Home` 到顶点 `C` 的总距离比我们之前发现的长（`12\
  \ > 8`），因此我们放弃刚刚发现的距离（通过顶点 `D`），而采用最短路径方案（通过顶点 `A`）。因此此时顶点 `C` 的距离保持不变。\n\n将新邻居\
  \ `E` 添加到顶点优先级队列。没有需要将 `C` 加入队列，因为它已经在那里了。\n\n将顶点 `D` 标记为已访问。\n\n![](img/26-dijkstra----dijkstra-steps-step-4.png)\n\
  \n### 第 5 步\n\n从顶点优先级队列中获取离 `Home` 最近的下一个顶点。在我们案例中是顶点 `C`。\n\n获取 `C` 的所有未访问邻居（在我们案例中是\
  \ `B` 和 `E`）。计算从 `C` 到它们的最短距离。对于 `B`，我们将得到 `8 + 5 = 13`，对于 `E`，我们将得到 `8 + 2 = 10`。注意，我们刚刚发现了到\
  \ `B` 的更短路径。之前通过 `A` 到 `B` 的距离是 `14`，但现在我们发现通过 `C` 到 `B` 的距离更短，等于 `13`。这意味着我们需要更新优先级队列中\
  \ `B` 的距离为 `13`。\n\n将 `C` 的所有未访问邻居添加到优先级队列。\n\n将顶点 `C` 标记为已访问。\n\n![](img/26-dijkstra----dijkstra-steps-step-5.png)\n\
  \n### 第 6 步\n\n从顶点优先级队列中获取离 `Home` 最近的下一个顶点。在我们案例中是顶点 `E`。\n\n获取 `E` 的所有未访问邻居（在我们案例中是\
  \ `D` 和 `Office`）。计算从 `E` 到 `D` 和 `Office` 的最短距离。对于 `D`，我们将得到 `10 + 2 = 12`，对于 `Office`，我们将得到\
  \ `10 + 4 = 14`。注意，顶点 `D` 已经有一个计算出的距离了。\n\n将 `Office` 添加到队列。\n\n将顶点 `E` 标记为已访问。\n\
  \n![](img/26-dijkstra----dijkstra-steps-step-6.png)\n\n### 第 7 步\n\n从顶点优先级队列中获取离\
  \ `Home` 最近的下一个顶点。在我们案例中是顶点 `B`。\n\n获取 `B` 的所有未访问邻居并更新它们的距离。在我们案例中只有一个未访问邻居 `Office`，其距离为\
  \ `13 + 7 = 20`。由于它比之前发现的 `Office` 距离大（`20 > 14`），我们忽略它。\n\n将顶点 `B` 标记为已访问。\n\n\
  ![](img/26-dijkstra----dijkstra-steps-step-7.png)\n\n### 第 8 步\n\n最后我们到达队列中的最后一个节点，该节点没有未访问的邻居。这意味着我们可以停止，并且刚刚找到了从\
  \ `Home` 顶点到所有顶点的最短路径。\n\n![](img/26-dijkstra----dijkstra-steps-step-8.png)\n\n\
  ### 应用\n\nDijkstra 算法可以应用于以下领域：\n\n*   在 **GIS（地理信息系统）** 中，寻找地图上地理位置之间的最短路径（交通和距离可以表示为图权重）。\n\
  *   在 **计算机网络** 中（例如，点对点应用），寻找机器 A 和 B 之间的最短路径。\n\n## 使用示例\n\n在我们开始实现 `dijkstra()`\
  \ 函数之前，让我们假设已经实现了它，并看看我们希望它如何工作以及它应该什么样的接口（输入参数和返回值）。\n\n让我们采用上面“任务”部分的图，尝试寻找从 `Home`\
  \ 顶点到所有顶点的最短路径，特别是从 `Home` 到 `Office` 的最短路径。\n\n![](img/26-dijkstra----graph.png)\n\
  \n在在调用 `dijkstra()` 函数时，我们希望传递我们要遍历的 `graph` 以及起始顶点 `startVertex`。\n\n该函数应该返回我们一个\
  \ `distances` 对象，其中包含从 `startVertex` 到所有顶点的最短路径。该对象可以是一个以顶点为键、最短距离为值的 map。例如：\n\n\
  ```\n{\n  Home: 0,\n  A: 4,\n  Office: 10,\n  ...\n}\n```\n\n\n\n这意味着从 `startVertex`\
  \ 到键为 `Office` 的节点的最短距离为 `10`。从 `startVertex` 到键为 `A` 的节点的最短距离为 `4`。在这种情况下，到 `Home`\
  \ 的最短距离为零，因为我们的 `startVertex` 键就是 `Home`，我们不需要做任何操作即可到达，因为我们已经在那里了。\n\n但 `distances`\
  \ 映射无法让我们了解到 `Office` 的最短路径是什么。我们知道到达那里需要 `10` 个距离单位（假设是英里），但不知道应该走哪条路。因此，我们需要 `dijkstra()`\
  \ 函数也返回另一个对象，我们称之为 `previousVertices`。这个对象的思路是也是一个映射，其键与图顶点键匹配，但它包含的不是距离，而是形成最短路径的前一个顶点链接。例如：\n\
  \n```\n{\n  Office: spotE,\n  E: spotC,\n  C: spotA,\n  A: spotHome,\n  Home: null,\n\
  } \n```\n\n在上面的示例中，`spotE`、`spotC`、`spotA`、`spotHome` 是 `GraphVertex` 类的实例，而 `Office`、`E`、`C`、`A`、`Home`只是图中每个顶点的字符串键。\n\
  \n```\n 1 // 导入依赖。\n 2 import GraphVertex from '../08-graph/GraphVertex';\n 3 import\
  \ GraphEdge from '../08-graph/GraphEdge';\n 4 import Graph from '../08-graph/Graph';\n\
  \ 5 import dijkstra from './dijkstra';\n 6 \n 7 // 让我们在虚拟地图上创建这些点。\n 8 const spotHome\
  \ = new GraphVertex('Home');\n 9 const spotA = new GraphVertex('A');\n10 const spotB\
  \ = new GraphVertex('B');\n11 const spotC = new GraphVertex('C');\n12 const spotD\
  \ = new GraphVertex('D');\n13 const spotE = new GraphVertex('E');\n14 const spotOffice\
  \ = new GraphVertex('Office');\n15 \n16 // 现在用特定长度的道路连接这些点。\n17 const roadHomeA\
  \ = new GraphEdge(spotHome, spotA, 5);\n18 const roadHomeD = new GraphEdge(spotHome,\
  \ spotD, 8);\n19 const roadAB = new GraphEdge(spotA, spotB, 9);\n20 const roadAC\
  \ = new GraphEdge(spotA, spotC, 3);\n21 const roadCB = new GraphEdge(spotC, spotB,\
  \ 5);\n22 const roadDC = new GraphEdge(spotD, spotC, 4);\n23 const roadCE = new\
  \ GraphEdge(spotC, spotE, 2);\n24 const roadDE = new GraphEdge(spotD, spotE, 6);\n\
  25 const roadOfficeB = new GraphEdge(spotOffice, spotB, 7);\n26 const roadOfficeE\
  \ = new GraphEdge(spotOffice, spotE, 4);\n27 \n28 // 我们创建双向道路，这意味着我们的图是无向的。\n29\
  \ const isDirected = false;\n30 const graph = new Graph(isDirected);\n31 \n32 //\
  \ 现在我们将刚刚创建的点和道路添加到图中。\n33 // 这就像是把地图上所有关于点和道路的信息放上去。\n34 // 记住，我们不需要同时添加它们之间的顶点和边。\n\
  35 // 我们只需要添加边，顶点将自动添加到图中\n36 // (关于 Graph 实现的更多细节，请参阅图的章节)。\n37 graph\n38   .addEdge(roadHomeA)\n\
  39   .addEdge(roadHomeD)\n40   .addEdge(roadAB)\n41   .addEdge(roadAC)\n42   .addEdge(roadCB)\n\
  43   .addEdge(roadDC)\n44   .addEdge(roadCE)\n45   .addEdge(roadDE)\n46   .addEdge(roadOfficeB)\n\
  47   .addEdge(roadOfficeE);\n48 \n49 // 现在我们准备好运行 Dijkstra 算法，并找出从家到所有其他节点\n50 以及到办公室的最短路径。\n\
  51 const { distances, previousVertices } = dijkstra(graph, spotHome);\n52 \n53 /*\
  \ eslint-disable no-console */\n54 \n55 // 现在让我们打印并查看地图上每个点的最短距离。\n56 console.log(distances);\n\
  57 /*\n58  输出将是：\n59 \n60  {\n61    Home: 0,\n62    A: 5,\n63    B: 13,\n64    C:\
  \ 8,\n65    D: 8,\n66    E: 10,\n67    Office: 14,\n68  }\n69 \n70  这意味着从 Home 到\
  \ Office 的最短距离是 14。\n71  */\n72 \n73 // 现在既然我们知道了从 Home 到 Office 的最短距离\n74 // 让我们找出最短距离的最短路径。\n\
  75 // ...（剩余文本）\n```\n\n\n\n\n4. 回到步骤 1 且顶点访问队列为空。队列是否为空通过使用 `PriorityQueue` 实例的\
  \ `isEmpty()` 方法进行检查。\n\n以下是 `dijstra()` 函数的一种实现示例。\n\n```\n10 /**\n11  * Dijkstra\
  \ 算法实现，用于寻找到图节点的最短路径。\n12  * @param {Graph} graph - 我们要遍历的图。\n13  * @param {GraphVertex}\
  \ startVertex - 遍历起始顶点。\n14  * @return {ShortestPaths}\n15  */\n16 export default\
  \ function dijkstra(graph, startVertex) {\n17   // 初始化 Dijkstra 算法所需的辅助变量。\n18 \
  \  const distances = {};\n19   const visitedVertices = {};\n20   const previousVertices\
  \ = {};\n21   const queue = new PriorityQueue();\n22 \n23   // 初始化所有距离为无穷大，假设目前我们无法到达\n\
  24   // 除起始顶点外的任何顶点。\n25   graph.getAllVertices().forEach((vertex) => {\n26    \
  \ distances[vertex.getKey()] = Infinity;\n27     previousVertices[vertex.getKey()]\
  \ = null;\n28   });\n29 \n30   // 我们已经在起始顶点，所以到它的距离为零。\n31   distances[startVertex.getKey()]\
  \ = 0;\n32 \n33   // 初始化顶点队列。\n34   queue.add(startVertex, distances[startVertex.getKey()]);\n\
  35 \n36   // 遍历顶点优先级队列直到它为空。\n37   while (!queue.isEmpty()) {\n38     // 获取下一个最近的顶点。\n\
  39     const currentVertex = queue.poll();\n40 \n41     // 遍历当前顶每个未访问的邻居。\n42  \
  \   currentVertex.getNeighbors().forEach((neighbor) => {\n43       if (!visitedVertices[neighbor.getKey()])\
  \ {\n44         const edgeWight = neighbor.edge.weight;\n45         const existingDistanceToNeighbor\
  \ = distances[neighbor.getKey()];\n46         const distanceToNeighborFromCurrent\
  \ = distances[currentVertex.getKey()] + ed\\\n47 geWight;\n48 \n49         // 如果找到了到邻居的更短路径\
  \ - 更新它。\n50         if (distanceToNeighborFromCurrent < existingDistanceToNeighbor)\
  \ {\n51           distances[neighbor.getKey()] = distanceToNeighborFromCurrent;\n\
  52 \n53           // 修改邻居在队列中的优先级，因为它可能已经变成了 c\\\n54           loser.\n55      \
  \     if (queue.has(neighbor)) {\n56             queue.changePriority(neighbor,\
  \ distances[neighbor.getKey()]);\n57           }\n58 \n59           // 记录上一个最近的顶点。\n\
  60           previousVertices[neighbor.getKey()] = currentVertex;\n61         }\n\
  62 \n63         // 将邻居加入队列以便后续访问。\n64         if (!queue.has(neighbor)) {\n65  \
  \         queue.add(neighbor, distances[neighbor.getKey()]);\n66         }\n67 \
  \      }\n68     });\n69 \n70     // 将当前顶点加入已列表，以避免以后再次访问。\n71     visitedVertices[currentVertex.getKey()]\
  \ = true;\n72   }\n73 \n74   // 返回所有顶点的最短距离和路径的集合。\n75   return { distances, previousVertices\
  \ };\n76 }\n```\n\n26-dijkstra/dijkstra.js\n\n### 复杂度\n\n假设我们要遍历的图有 `|V|` 个顶点和 `|E|`\
  \ 条边。\n\n#### 时间复杂度\n\n在我们的 `dijkstra()` 函数中，首先进行初始设置，然后遍历队列。让我们分析这两个步骤。\n\n**初始设置**（创建\
  \ `queue`、填充 `distances` 和 `previousVertices`）。这些步骤的复杂度为 `O(|V|)`，因为我们遍历了图中的所有顶点。\n\
  \n**遍历队列**。`while` 循环内部的代码会被调用 `|V|` 次，因为通过在 `visitedVertices` map 中跟踪已访问的顶点，我们恰好访问每个图顶点一次。因此，我们将使用\
  \ `while` 循环内部代码时间复杂度的 `|V|` 倍数。\n\n让我们分析在 `while` 循环内部执行的步骤：\n\n*   **从队列中弹出下一个顶点**。此操作使用了\
  \ `MinHeap` 类的 `poll()` 方法，该方法的时间复杂度为 `O(log(|V|))`（请参见“堆”章节，了解有关如何计算 `poll()` 方法复杂度的细节）。\n\
  \n*   **遍历当前顶点未访问的邻居**。在图全连接且每个顶点都有 `|V| - 1` 条边的最情况下，此步骤将需要 `O(|E|)` 时间。\n\n  \
  \  *   **更新顶点距离**。此步骤涉及对 `distances` map 的操作，因此它们的时间复杂度为 `O(1)`。\n\n    *   **根据需要更改顶点优先级**。这是与\
  \ `MinHeap` 类相关的操作，在 `O(log(|V|))` 时间内完成，因为我们需要从堆树中移除并添加元素，并在过程中调用了 `heapifyUp()`\
  \ 和 `heapifyDown()` 方法。\n\n    *   **检查顶点优先级**。\n\n#### 辅助复杂度\n\n返回所有顶点的最短距离和路径集合。\n\
  \n### 问题\n\n这里是一些相关问题：\n\n*   [网络延迟时间](https://leetcode.com/problems/network-delay-time/)\n\
  *   [K 站内最廉价机票](https://leetcode.com/problems/cheapest-flights-within-stops/)\n\n\
