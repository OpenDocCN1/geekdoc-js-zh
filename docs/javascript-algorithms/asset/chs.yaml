  \ `this.head` 指向我们新创建的 `LinkedListNode` 对象。如果这是我们 `LinkedList` 中的第一个项，我们还必须将 `this.tail`\
  \ 指向该新对象，因为它也是我们 `LinkedList` 中的最后一个项。\n\n```javascript\nthis.head = newNode;\n\n\
  // 如果还没有尾节点，让新节点成为尾节点。\nif (!this.tail) {\n  this.tail = newNode;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
