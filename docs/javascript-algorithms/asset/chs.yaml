  \n我们也来实现 `toString()` 方法来让队列的使用更加方便。它将接受一个可选的 `callback`。\n\n```\n50   /**\n51 \
  \   * @param {*} callback\n52    * @return {string}\n53    */\n54   toString(callback)\
