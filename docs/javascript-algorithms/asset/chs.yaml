  }\n```\n\n`02-linked-list/LinkedListNode.js`\n\n### `LinkedList`\n\n`LinkedList`\
  \ 类包含了一些重要的方法，用于操作我们的 `LinkedListNode` 对象的集合。让我们来看看每个方法的作用：\n\n#### `constructor`\n\
  \n我们的 `LinkedList` 类包含两个属性：`this.head` 和 `this.tail`。这两个属性都指向一个 `LinkedListNode`\
  \ 对象。它们是我们 `LinkedListNodes` 集合的开始和结束。\n\n```javascript\nconstructor() {\n  /**\
