  \n## 附录 A：测试答案\n\n**算法及其复杂度**\n\n*   Q1: 不是，时间复杂度显示函数时间与函数输入的速率（比例）。\n*   Q2: `O(log(n))`\
  \ 更快。例如 `O(1000) = 1000`，但 `O(log(1000)) = 9`。\n*   Q3: 不，这不是真的。有时这是一种权衡，你通过消耗更多内存来让算法运行更快。\n\
  \n**链表**\n\n*   Q1: 它是链表中下一个对象的引用。\n*   Q2: `deleteTail` 移除链表中的最后一个项，`deleteHead`\
  \ 移除第一个。\n\n**队列**\n\n*   Q1: 队列是先进先出的。\n*   Q2: 队列的基本操作是 `peek()`、`enqueue()` 和\
  \ `dequeue()`。\n*   Q3: 时间复杂度是 `O(1)`。\n\n**栈**\n\n*   Q1: 栈是后进先出的。\n*   Q2: 栈的基本操作是\
  \ `peek()`、`push()` 和 `pop()`。\n*   Q3: 时间复杂度是 `O(1)`。\n\n**哈希表**\n\n*   Q1: 哈希表的主要优势是查找速度快。\n\
  *   Q2: 时间复杂度为 `O(1)`（在良好的哈希函数和足够的桶数量的情况下）。\n*   Q3: 冲突是我们尝试将具有不同键的值保存到同一个桶时，可能是因为哈希函数不理想，也因为可用桶不足。\n\
  *   Q4: 处理冲突的方法之一是链地址法，即我们使用链表在每个桶中存储信息。\n\n**二叉搜索树 (BST)**\n\n\n\n\n\n* **Q1:**\
  \ 不是。根据定义，根节点是树中没有父节点的节点。\n* **Q2:** 是的，这是允许的。二叉树中的节点可能有零到两个子节点。\n* **Q3:** 平衡二叉搜索树将具有更快的\
  \ `O(log(n))` 查询。如果树是不平衡的，在最坏情况下（病态树），它的表现会像链表，查找时间为 `O(n)`。\n\n## 二叉堆\n\n* **Q1:**\
  \ “形状属性”和“堆属性”\n* **Q2:** 我们需要将堆的最后一个元素（树的最左下角元素）移动到头部，然后执行下堆化操作\n* **Q3:** `O(log(n))`\n\
  \n## 优先队列\n\n* **Q1:** 我们需要使用 `MaxHeap` 而不是 `MinHeap`。\n* **Q2:** `O(log(n))`\n\n\
  ## 图\n\n* **Q1:** 是的。树是有有向连通无环图的一种特例。\n* **Q2:** 是的。在这种情况下，我们将得到一个仅包含两个顶点（vertices）的非连通图。\n\
  * **Q3:** 表示图的两种常用方法：邻接表和邻接矩阵。\n\n## 位操作\n\n* **Q1:** `111011`\n* **Q2:** `000101\
  \ & 111110 = 000100`\n\n## 阶\n\n* **Q1:** `7`\n\n## 质性测试\n\n* **Q1:** 不是，`32/2`\
  \ 的余数为 `0`\n* **Q2:** 是的，`31/2` 的余数为 `1`。`31` 的平方根是 `5.56776436283` – `31/3 = 10.3`,\
  \ `31/4 = 7.75`, `31/5 = 6.2`\n\n## 是否是 2 的幂\n\n* **Q1:** 是的，`32/2 = 16`，`16/2 =\
  \ 8`，`8/2 = 4`，`4/2 = 2`，`2/2 = 1`\n* **Q2:** 不的，`01111 & 11110 = 01110`\n\n## 搜索。线性搜索。\n\
  \n* **Q1:** 最坏和平均情况下的时间复杂度为 `O(n)`。\n* **Q2:** 不。由于 `O(n)` 的时间复杂度，通常做法是将该算法应用于小型列表。\n\
  \n## 搜索。二分搜索。\n\n* **Q1:** 不是。从本质上说，二分搜索只适用于有序数组。否则我们无法每一步都放弃数组的一半。\n* **Q2:** 时间复杂度为\
  \ `O(log(n))`。这是因为我们在每次迭代中都会放弃数组的一半。\n\n## 集合。笛卡尔积。\n\n* **Q1:** 它有 4 个元素：`['ac',\
  \ 'ad', 'bc', 'bd']`。公式为 `|A| * |B|`。\n* **Q2:** 是的，可能的。如果有四个集合 `A`、`B`、`C` 和 `D`，那么笛卡尔积集的每个元素将由四个元素\
  \ `(a, b, c, d)` 组成。\n* **Q3:** 时间复杂度为 `O(|A|*|B|)`。\n\n## 集合。幂集。\n\n* **Q1:** 是的，空集是幂集的一部分。\n\
  * **Q2:** 它有 2<sup>4</sup>=16 个元素，其中 4 是原始集合 `{a, b, c, d}` 的大小。\n\n## 集合。排列。\n\n\
  * **Q1:** 是的，顺序很重要。这是排列与组合的区别性特征。\n* **Q2:** 我们将有 `4! / (4 - 2)! = 4! / 2! = 24\
  \ / 2 = 12` 种排列。\n\n## 集合。组合。\n\n* **Q1:** 不是，顺序不重要。这是组合与排列的区别。\n* **Q2:** 我们将有\
  \ `4! / (2! * (4 - 2)!) = 4! / (2! * 2!) = 24 / 4 = 6` 种组合。\n\n## 排序：快速排序\n\n* **Q1:**\
  \ 快速排序的平均时间复杂度为 `O(n * log(n))`。\n* **Q2:** 我们只需要将大于基准元素的元素添加到左侧数组（而不是右侧），将小于基准元素的元素添加到右侧数组（而不是左侧）。\n\
  \n## 树。深度优先搜索。\n\n* **Q1:** DFS 的时间复杂度为 `O(|N|)`，其中 `|N|` 是树中的节点总数。*\n* **Q2:**\
  \ 是的，我们可以通过使用之前实现的 `Stack` 类来避免递归。在这种情况下，每当我们访问一个节点时，我们需要将其所有的子节点（而不只是两个）都放入栈中。然后从栈顶获取下一个节点进行遍历。\n\
  \n## 树。广度优先搜索。\n\n* **Q1:** BFS 的时间复杂度为 `O(|N|)`，其中 `|N|` 是树中的节点总数。\n* **Q2:** 我们不需要在\
  \ `while` 循环中仅添加“左”和“右”子节点，我们需要获取节点的所有子节点并将它们添加到队列。\n\n## 图。深度优先搜索。\n\n* **Q1:**\
  \ 图的 DFS 时间复杂度为 `O(|V| + |E|)`（注：原文此处为|V|，通常指顶点），其中 `|V|` 是顶点总数，`|E|` 是边总数。\n* **Q2:**\
  \ `Stack` 适合实现 DFS。\n\n## 图。广度优先搜索。\n\n* **Q1:** 图的 BFS 时间复杂度为 `O(|V| + |E|)`，其中\
  \ `|V|` 是顶点总数，`|E|` 是边总数。\n* **Q2:** `Queue` 适合实现 BFS。\n\n##附录 B：Big O 时间\n\n下包含了分析中常用的函数，显示了相对于输入元素的操作次数。images/28-big-o.png\n\
