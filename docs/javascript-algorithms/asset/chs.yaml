  ```\n\n`02-linked-list/LinkedList.js`\n\n然后我们检查 `currentNode` 不为 `null`。如果不是，我们就启动循环。当我们到达一个\
  \ `next` 为 `null` 的节点时，我们将跳出循环。\n\n```javascript\nif ( null)\nwhile (currentNode.next)\
  \ {\n  if (currentNode.next.value === value) {\n    deletedNode = currentNode.next;\n\
  \    this.tail = currentNode;\n    currentNode.next = null;\n    return deletedNode;\n\
  \  } else {\n    currentNode = currentNode.next;\n  }\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n### `deleteTail`\n\n对于我们的 `deleteTail` 方法，我们首先创建一个变量 `deletedTail` 并设置为 `this.tail`，以便在从方法返回时可以返回被删除的对象。\n\
  \n```javascript\ndeleteTail() {\n  const deletedTail = this.tail;\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n我们有两种情况需要编写代码：\n\n1. 我们的 `LinkedList` 中只有一个项\n2.  `LinkedList` 中有多个项\n\n对于情况 1，`this.head.value`\
  \ 和 `this.tail.value` 相同，因此我们将 `this.head` 和 `this.tail` 都设置为 `null` 并返回 `deletedTail`。\n\
  \n```javascript\nif (this.head === this.tail) {\n  // 链表中只有一个节点。\n  this.head =\
  \ null;\n  this.tail = null;\n  return deletedTail;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n对于情况 2，我们需要遍历整个列表以获取倒数第二个 `LinkedListNode`。我们将通过检查 `currentNode.next.next` 值是否为\
  \ `null`，将倒数第二个 `LinkedListNode` 设置为 `this.tail`。如果 `currentNode.next.next` 为 `null`，我们就知道\
  \ `currentNode.next` 是我们要设置为 `this.tail` 的对象。\n\n```javascript\n  // 如果链表中有很多节点...\n\
  \  // 回到最后一个节点，并删除倒数节点前一个节点的 \"next\" 链接\n  let currentNode = this.head;\n  while\
  \ (currentNode.next) {\n    if (!currentNode.next.next) {\n      currentNode.next\
  \ = null;\n    } else {\n      currentNode = currentNode.next;\n    }\n  }\n\n \
  \ this.tail = currentNode;\n\n  return deletedTail;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n### `deleteHead`\n\n我们的 `deleteHead` 方法删除列表中的第一个项。与我们的 `deleteTail` 方法类似，我们有几种情况需要编写代码来删除\
  \ `LinkedList` 的头部：\n\n1. 列表中没有项\n2. 列表中只有 1 个项\n3. 列表中有多个项\n\n\n\n\n\n对于场景 1，我们检查\
  \ `this.head` 是否为 `null`，如果是 `null`，我们从方法中返回 `null`。\n\n```\n125   deleteHead()\
  \ {\n126     if (!this.head) {\n127       return null;\n128     }\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n对于场景 2 和 3，我们必须先创建一个变量：`deletedHead` 并将其设置为 `this.head`，这样当我们从此方法返回时，就可以返回被删除掉的对象。\n\
  \n```\n130     const deletedHead = this.head;\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n同样对于场景 2 和 3，我们将逻辑合并到一个 if/else 语句中。如果 `this.head.next` 不为 `null`，我们知道列表中有超过 1\
  \ 个元素，我们将 `this.head.next` 设置为等于 `this.head`，这就删除了列表中的第一个元素。如果 `this.head.next`\
  \ 为 `null`，那么我们知道列表中只有 1 个元素，我们将 `this.head` 和 `this.tail` 都设置为 `null`，因为我们的 `LinkedList`\
  \ 中不再有更多元素了。\n\n```\n131     if (this.head.next) {\n132       this.head = this.head.next;\n\
  133     } else {\n134       this.head = null;\n135       this.tail = null;\n136\
  \     }\n```\n\n`02-linked-list/LinkedList.js`\n\n最后，我们从方法中返回我们的 `deletedHead` 对象：\n\
  \n```\n139     return deletedHead;\n140   }\n```\n\n`02-linked-list/LinkedList.js`\n\
  \n### `find`\n\n`find` 方法遍历 `LinkedList` 中的项，并找到第一个与我们想要的值匹配的 `LinkedListNode` 对象。该方法接受一个包含两个键值对的对象：`value`\
  \ 和 `callback`：\n\n```\n148   find({ value = undefined, callback = undefined })\
  \ {\n```\n\n`02-linked-list/LinkedList.js`\n\n与我们之前的的方法一样，我们首先检查 `this.head` 是否为\
