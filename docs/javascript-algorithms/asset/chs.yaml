  \n`prepend` 方法将一个 `LinkedListNode` 对象添加到我们的 `LinkedList` 的开头。首先，我们创建一个新的 `LinkedListNode`\
  \ 对象。\n\n```javascript\nprepend(value) {\n  // 创建一个新节点作为头部。\n  const newNode = new\
