  \n### 引言\n\n作为一名 JavaScript 开发者，你可能认为不需要学习数据结构或算法。\n\n你知道 JavaScript 本身（运行时+浏览器）使用了栈（stack）、堆（heap）和队列（queue）等吗？你对每天使用的\
  \ JavaScript 越了解，就越能驾驭它的力量并减少错误。如果你认为算法和数据结构只是一门对于 JavaScript 开发者来说并非必需的计算机科学课程，请重新考虑！\n\
  \n### 如何阅读这本书\n\n每一章都涵盖了一个你可能在工作或面试中遇到的算法。你可以逐一研究这些算法，也可以自由跳读。\n\n## 算法及其复杂度\n\n\
  ### 什么是算法\n\n在本书中，我们将编写 `algorithms` —— 即为我们解决特定问题的步骤集合。\n\n我们在日常生活中不断使用 `algorithms`。例如，如果我们在某条街上，想回到住在\
  \ 20 层的公寓？为了实现这一目标，我们可以采取以下操作：\n\n```\n1. 走路回到家里。\n2. 使用楼梯上到第 20 层。\n```\n\n这就是一个算法。我们定义并使用了一组解决“回家”任务的步骤。\n\
  \n### 算法复杂度\n\n让我们以上一节的“回家”问题为例。还有其他解决方法吗？有的，我们实现了不同的步骤（阅读“算法”部分）来实现该目标：\n\n```\n\
  1. 打一辆出租车送你回。。\n2. 使用电梯上到第 20 层。\n```\n\n现在，让我们考虑在这两个算法中应该选择哪一个：\n\n首先，我们需要明确我们的限制条件（我们有多少钱、我们多急需回家、我们的健康状况如何），并`从这些限制条件的角度评估算法`。\n\
  \n如你所见，这两种算法都需要不同的时间和资源。第一种需要更多的时间和精力，但钱较少。第二种需要的时间和精力较少，但钱更多。如果我们没钱且身体健康，我们需要选择第一种算法并享受步行。否则，如果我们有足够的钱且急需回家，第二种方案更好。\n\
  \n我们刚刚所做的就是评估`每个算法的复杂度（complexity of each algorithm）`。\n\n#### 时间空间复杂度\n\n在上例中，我们评估了每个算法所需的时间和资源（即金钱和或健康）。我们将这些评估称为`时间复杂度（time\
  \ complexity）`和`资源复杂度（resource complexity）`。这两个特征对于我们决定哪种算法适合我们的需求至关重要。\n\n在书中，我们不会从日常计划规划的角度来处理“回家”问题（在这种情况下我们可能只应用直觉）。相反，我们将采用更具数学的方法。\n\
  \n### 大 O 表示\n\n#### 大 O 表示定义\n\n*大 O 表示用于根据算法运行时间或空间增长的情况对算法进行分类。*\n\n这里的关键在于，大\
  \ O 表示是一种相对指标，显示了算法的执行时间根据输入的大小增长有多快。时间和内存的绝对值随硬件而异，因此我们需要使用相对指标。同一个程序在某台计算机上可能执行需\
  \ 1 秒，而在另一台上可能需要 10 秒。因此，当你比较两个算法的时间复杂度时，要求它们在相同的定义的硬件配置上运行，这并不方便，有时也无法实现。\n\n大\
  \ O 表示定义了`输入大小 → 耗时`的时间复杂度以及`输入大小 → 消耗内存`的空间复杂度。它根据增长率来表征程序（函数）：相同增长率的不同程序可以使用相同的\
  \ O 表示。\n\n使用字母 O 是是因为程序（函数）的增长率也被称为函数的阶数（order of the function）。\n\n#### 大 O 表示解释\n\
  \n让我们通过上述“回家”算法来说明大 O 概念，特别是算法中的“爬楼梯”部分。\n\n想象我们有两个男人：一个是年轻且快速的奥运冠军，另一个是典型的中年男性。我们刚刚同意，我们希望爬楼梯算法的复杂度对这两个来说是相同的，因此它不应该取决于人的速度，而应该取决于他们爬得有多高。在计算机方面，我们的算法分析不取决于硬件，而取决于软件问题本身。这两个男人到达第\
  \ 20 层需要走多少步？嗯，假设每层之间有 20 台阶。这意味着他们需要走 `20 * 20 = 400` 步才能到达第 20 层。让我们为 `n` 层进行泛化：\n\
  \n```\n输入：(20 * n) 步\n输出：(20 * n) 步（移动）\n```\n\n\n\n\n你看到这里的规律了吗？爬楼梯的时间复杂度与楼层数呈线性依赖关系。在\
  \ Big O 语法中，这种关系写如下：\n\n```\nO(20 * n)\n```\n\n这里有一个重要的规则需要理解：\n\n> 在使用 Big O 表示法描述复杂度时，我们必须始终舍非主导部分：`O(n\
  \ + 1)` 变为 `O(n)`，`O(n + n²)` 变为 `O(n²)`，`O(n + log(n))` 变为 `O(n)`，以此此类推。\n\n为什么呢？因为\
  \ Big O 描述的是函数的阶，而不是它消耗的精确毫秒或兆字节。它描述的是趋势而非绝对值。因此，非主导常数并不重要。非主导常数是在 `n` 取值巨大时我们可以丢弃的部分。例如，在\
  \ `n = 10000` 的情况下，这两个部分中哪一个对最终结果的影响更大：`20` 还是 `n = 10000`？显而易见，`n` 对最终结果的影响是常数\
  \ `20` 的 `500` 倍。因此，我们可以舍弃它，“爬楼梯”算法的时间复杂度如下：\n\n```\nO(n)\n```\n\n这是一个线性依赖的例子，但也存在其他类型的依赖关系：`O(log(n))`、`O(n\
  \ * log(n))`、`O(n²)`、`O(2^n)`、`O(n!)` 等。\n\n查看算法分析中常用的函数图表，它们展示了每个函数的操作次数 `N` 与输入规模\
  \ `n` 的关系。\n\n![](img/01-algorithms-and-their-complexities----big-o-charts.png)\n\
  \n所有这些图表向我们展示了函数的内时间和消耗取决于输入增长得有多快。两个不同的数组排序算法可能完成相同的排序任务，但一个耗时为 `O(n * log(n))`，另一个为\
  \ `O(n²)`。如果有选择，我们会倾向于选择第一个而不是第二个。\n\n*使用 Big O 表示法，我们可以根据 Big O 值对算法（函数、程序）进行比较，而独立于它们运行的硬件。*\n\
  \n查看一些常见的 Big O 表示法列表以及针对不同规模输入数据的性能对比。这将让你对不同算法的复杂度（时间和内存消耗）可能是什么样的有一个直观的感受。\n\n\
  | Big O Notation | 10 个元素的计算次数 | 100 个元素的计算次数 | 1000 个元素的计算次数 |\n| --- | --- | ---\
  \ | --- |\n| `O(1)` | 1 | 1 | 1 |\n| `O(log(n))` | 3 | 6 | 9 |\n| `O(n)` | 10 |\
  \ 100 | 1000 |\n| `O(n log(n))` | 30 | 600 | 9000 |\n| `O(n²)` | 100 | 10000 | 1000000\
  \ |\n| `O(2^n)` | 1024 | 1.26e+29 | 1.07e+301 |\n| `O(n!)` | 3628800 | 9.3e+157\
  \ | 4.02e+2567 |\n\n## Big O 表示法示例\n\n让我们继续看其他一些 big o 表示法的例子。\n\n### O(1) 示例\n\n\
  让我们写一个将数字提升到指定幂的函数：\n\n```\n 1 /**\n 2  * 将数字提升到幂。\n 3  *\n 4  * 示例：\n 5  * number\
  \ = 3\n 6  * power = 2\n 7  * output = 3² = 9\n 8  *\n 9  * @param {number} number\n\
  10  * @param {number} power\n11  * @return {number}\n12  */\n13 export function\
  \ fastPower(number, power) {\n14   return number ** power;\n15 }\n```\n\n`01-algorithms-and-their-complexities/fastPower.js`\n\
  \n它的时间复杂和空间复杂度是多少？\n\n思考函数的输入将如何影响它完成的操作次数。对于每一个输入，函数都只执行一次操作。这意味着该函数的时间复杂度为：\n\n\
  ```\nTime complexity: O(1)\n```\n\n现在让我们粗略分析评估此函数需要多少内存。在这种情况下，我们操作的变量数量不取决于输入。因此，空间复杂度为：\n\
  \n```\nSpace complexity: O(1)\n```\n\n### O(n) 示例\n\n现在让我们用迭代的方式来实现相同的幂函数：\n\n```\n\
  \ 1 /**\n 2  * 将数字提升到幂。\n 3  *\n 4  * 示例：\n 5  * number = 3\n 6  * power = 2\n 7\
  \  * output = 3² = 9\n 8  *\n 9  * @param {number} number\n10  * @param {number}\
  \ power\n11  * @return {number}\n12  */\n13 export function fastPower(number, power)\
  \ {\n14   return number ** power;\n15 }\n```\n\n*(注：原文中 O(n) 示例部分的代码存在重复 fast fastPower\
  \ 的错误，此处已根据原文逻辑进行格式化处理。)*\n\n\n\n\n```javascript\n /**\n * 从提供的字母中获取所有可能的组合。\n *\n\
  \ * Example:\n * letter = ['a', 'b']\n * output = ['aa', 'ab', 'ba', 'bb']\n *\n\
  \ * @param {string[]} letters\n * @return {string[]}\n */\nexport function pairs(letters)\
  \ {\n  const result = [];\n\n  for (let i = 0; i < letters.length; i += 1) {\n \
  \   for (let j = 0; j < letters.length; j += 1) {\n      result.push(`${letters[i]}${letters[j]}`);\n\
  \    }\n  }\n\n  return result;\n}\n```\n\n`01-algorithms-and-their-complexities/pairs.js`\n\
  \n现在有两个嵌套的 `for()` 循环，它们的作用相当于循环内部代码的倍器。在循环内部，我们有执行时间为常数的 `O(1)` 代码 - 只是向数组中推送元素。因此，我们将时间复杂度计算为函数各个部分时间复杂度之和：`O(1)\
  \ + letters.length * letters.length * O(1) + O(1)`。在去掉非主导部分后，我们得到最终的时间复杂度：\n\n```\n\
  Time complexity: O(letters.length²)\n```\n\n这意味着我们的函数运行速度将根据我们提供的输入字母数量的平方成比例变慢。\n\
  \n你可能还会注意到，提供给函数的字母越多，生成的组合就越多。所有这些组合都存储在 `pairs` 数组中。因此，该数组消耗的内存与字母数量的平方成正比。\n\n\
  ```\nSpace complexity: O(letters.length²)\n```\n\n## 空间复杂度与辅助空间复杂度示例\n\n此外，除了空间复杂度（space\
  \ complexity），还有辅助空间复杂度（auxiliary space complexity）。由于这两个术语经常被误用。\n\n它们之间的区别在于，辅助空间复杂度**不包括我们存储输入数据所需的内存量**。辅助空间复杂度仅显示算法解决问题需要多少`额外`的内存。相反，空间复杂度同时考虑了这两点：存储输入数据所需的内存量以及算法所需的额外内存量。\n\
  \n> 空间复杂度 = 输入 + 辅助空间复杂度\n\n让我们来看下面的示例。这里有一个将数组中所有元素乘以特定值的函数：\n\n```javascript\n\
  \ /**\n * 原地将数组中的所有值乘以特定值。\n *\n * Example:\n * array = [1, 2, 3]\n * multiplier\
  \ = 2\n * output = [2, 4, 6]\n *\n * @param {number[]} array\n * @param {number}\
  \ multiplier\n * @return {number[]}\n */\nexport function multiplyArrayInPlace(array,\
  \ multiplier) {\n  for (let i = 0; i < array.length; i += 1) {\n    array[i] *=\
  \ multiplier;\n  }\n\n  return array;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArrayInPlace.js`\n\
  \n该函数的空间复杂度与输入数组的大小成线性正比。因此，输入数组越大，该函数消耗的内存就越多。\n\n```\nSpace complexity: O(array.length)\n\
  ```\n\n现在让我们分析额外空间。我们可以看到函数所有的操作都是原地完成的，没有分配任何`额外`内存。\n\n```\nAuxiliary space complexity:\
  \ O(1)\n```\n\n有时，修改函数参数是不可接受的。与其原地修改输入数组参数，我们可能可能想先克隆它。让我们看看如何更改数组乘法函数以防止修改输入参数。\n\
  \n```javascript\n /**\n * 在分配额外内存以防止修改输入数组的情况下，\n * 将数组中的所有值乘以特定值。\n *\n * Example:\n\
  \ * array = [1, 2, 3]\n * multiplier = 2\n * output = [2, 4, 6]\n *\n * @param {number[]}\
  \ array\n * @param {number} multiplier\n * @return {number[]}\n */\nexport function\
  \ multiplyArrayInPlace(array, multiplier) {\n  const result = [...array];\n  for\
  \ (let i = 0; i < result.length; i += 1) {\n    result[i] *= multiplier;\n  }\n\n\
  \  return result;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArray.js`\n\
  \n现在有两个嵌套的 `for()` 循环，它们的作用相当于循环内部代码的倍器。在循环内部，我们有执行时间为常数的 `O(1)` 代码 - 只是向数组中推送元素。因此，我们将时间复杂度计算为函数各个部分时间复杂度之和：`O(1)\
  \ + letters.length * letters.length * O(1) + O(1)`。在去掉非主导部分后，我们得到最终的时间复杂度：\n\n```\n\
  Time complexity: O(letters.length²)\n```\n\n这意味着我们的函数运行速度将根据我们提供的输入字母数量的平方成比例变慢。\n\
  \n你可能还会注意到，提供给函数的字母越多，生成的组合就越多。所有这些组合都存储在 `pairs` 数组中。因此，该数组消耗的内存与字母数量的平方成正比。\n\n\
  ```\nSpace complexity: O(letters.length²)\n```\n\n## 空间复杂度与辅助空间复杂度示例\n\n此外，除了空间复杂度，还有辅助空间复杂度。由于这两个术语经常被误用。\n\
  \n它们之间的区别在于，辅助空间复杂度不包括我们存储输入数据所需的内存量。辅助空间复杂度仅显示算法解决问题需要多少`额外`的内存。相反，空间复杂度同时考虑了这两点：存储输入数据所需的内存量以及算法所需的额外内存量。\n\
  \n> 空间复杂度 = 输入 + 辅助空间复杂度\n\n让我们来看下面的示例。这里有一个函数将数组中所有元素乘以特定值：\n\n```javascript\n\
  \ /**\n * 原地将数组中的所有值乘以特定值。\n *\n * Example:\n * array = [1, 2, 3]\n * multiplier\
  \ = 2\n * output = [2, 4, 6]\n *\n * @param {number[]} array\n * @param {number}\
  \ multiplier\n * @return {number[]}\n */\nexport function multiplyArrayInPlace(array,\
  \ multiplier) {\n  for (let i = 0; i < array.length; i += 1) {\n    array[i] *=\
  \ multiplier;\n  }\n\n  return array;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArrayInPlace.js`\n\
  \n该函数的空间复杂度与输入数组的大小成线性正比。因此，输入数组越大，该函数消耗的内存就越多。\n\n```\nSpace complexity: O(array.length)\n\
  ```\n\n现在让我们分析额外空间。我们可以看到函数所有的操作都是原地完成的，没有分配任何`额外`内存。\n\n```\nAuxiliary space complexity:\
  \ O(1)\n```\n\n有时，修改函数参数是不可接受的。与其原地修改输入数组参数，我们可能想先克隆它。让我们看看如何更改数组乘法函数以防止输入参数。\n\n\
  ```javascript\n /**\n * 在分配额外内存以防止修改输入数组的情况下，\n * 将数组中的所有值乘以特定值。\n *\n * Example:\n\
  \ * array = [1, 2, 3]\n * multiplier = 2\n * output = [2, 4, 6]\n *\n * @param {number[]}\
  \ array\n * @param {number} multiplier\n * @return {number[]}\n */\nexport function\
  \ multiplyArrayInPlace(array, multiplier) {\n  const result = [...array];\n  for\
  \ (let i = 0; i < result.length; i += 1) {\n    result[i] *= multiplier;\n  }\n\n\
  \  return result;\n}\n```\n\n## 链表\n\n链表是一个不按顺序存储的实体集合。相反，每个实体都有指向下一个实体的指针。\n\n\
  ![](img/02-linked-list----LinkedListNode.jpg)\n\n这种结构允许在迭代期间进行高效的插入或删除。每个实体（也称为节点）由数据和指向下一个节点的链接组成。链表的缺点是访问时间是线性的。\n\
  \n**链表的主要操作有：**\n\n*   `prepend` - 在链表开头添加节点\n*   `append` - 在链表末尾添加节点\n*   `delete`\
  \ - 从链表中删除节点\n*   `deleteTail` - 从链表删除最后一个节点\n*   `deleteHead` - 从链表删除第一个节点\n* \
  \  `find` - 在链表中查找节点\n\n### 应用\n\n链表被用作许多数据结构（如队列、栈和哈希表）良好的基础。我们在 JavaScript 中创建的链表实现将用于学习的许多其他数据结构。\n\
  \n# 实现\n\n我们的 LinkedList 实现由两部分组成：\n\n*   `LinkedListNode` 类\n*   `LinkedList` 类\n\
  \n我们将在后续章节中探讨这些类的细节。\n\n#### `LinkedListNode`\n\n我们的 `LinkedListNode` 类将代表我们集合中的一个项目。`LinkedListNode`\
  \ 有两个重要的属性：\n\n1. `this.value`\n2. `this.next`\n\n`this.value` 包含了我们想要存储在节点中的实际值。`this.next`\
  \ 是指向我们链表中下一个节点的指针。\n\n##### 什么是指针？\n\nJavaScript 中的对象是键值对的字典。键始终是字符串。当我们说 `LinkedListNode`\
  \ 类中的 `next` 属性是“指针”时，我们真正的意思是 `this.next` 的值是对另一个 对象的引用——另一个 `LinkedListNode` 对象。\n\
  \n##### `constructor`\n\n我们 `LinkedListNode` 构造方法设置了 `this.value` 和 `this.next`\
