  \ 应用\n\n`Stack` 数据结构用于解决许多算法任务，例如：\n\n*   图的拓扑排序\n*   寻找图中的强连通分量\n*   汉诺塔问题\n* \
  \  记住部分完成的任务\n*   撤销（从操作中回溯）\n*   以及更多其他任务。\n\n在递归算法中，栈通常非常有用，因为你需要在递归时将临时数据推入栈中，然后在回溯时将其移除。栈为这种操作提供了一种直观的方法。\n\
  \n低级编程语言也使用栈数据结构在从一个函数调用另一个函数从内存中存储函数参数和局部变量。你可能通过臭名昭彰的“Stack Overflow”（栈溢出错误知道这一点。该错误与栈的使用有关，可能是由过深或无限递归引起的，在这种情况下，函数自调次数过多，导致存储变量和与每次调用相关信息的空间超过了栈的承受范围。\n\
  \n## 使用示例\n\n在我们继续实现 `Stack` 类之前，让我们假设我们已经实现了一个类，并尝试使用上面提到的基本方法。这将帮助我们更好地理解将要实现的内容。假设我们想用栈来反转数组：\n\
  \n```\n 1 // 导入 Stack 类。\n 2 import { Stack } from './Stack';\n 3 \n 4 // 创建栈实例。\n\
  \ 5 const stack = new Stack();\n 6 \n 7 // 创建我们想要反转的数组。\n 8 const arrayToReverse\
  \ = ['a', 'b', 'c'];\n 9\n10 stack.isEmpty(); // => true\n11 stack.toString(); //\
  \ => ''\n12 stack.toArray(); // => []\n13 \n14 // 向栈添加项。\n15 stack.push(arrayToReverse[0]);\n\
  16 stack.isEmpty(); // => false\n17 stack.toString(); // => 'a'\n18 stack.toArray();\
  \ // => ['a']\n19 \n20 // 向栈添加更多项。\n21 stack.push(arrayToReverse[1]);\n22 stack.push(arrayToReverse[2]);\n\
  23 stack.toString(); // => 'c,b,a'\n24 stack.toArray(); // => ['c', 'b', 'a']\n\
  25 \n26 // 检查下一步操作。\n27 stack.peek(); // => 'c'\n28 \n29 // 从栈中弹出。\n30 stack.pop();\
  \ // => 'c'\n31 stack.pop(); // => 'b'\n32 stack.pop(); // => 'a'\n33 \n34 stack.isEmpty();\
  \ // => true\n```\n\n# 实现\n\n栈可以用链表实现。我们可以使用 `LinkedList` 类中的 `append` 和 `deleteTail`\
  \ 操作来实现栈的 `push` 和 `pop` 操作。其思路是：当你想要向栈 `push` 一个项时，将该项 `append` 到链表末尾；当你想要从栈中 `pop`\
  \ 一个项时，`delete` 链表的尾部。由于我们要基于链表构建栈，让我们先开始导入它：\n\n```javascript\nimport LinkedList\
  \ from '../02-linked-list/LinkedList';\n```\n\n#### constructor\n\n让我们创建 `Stack`\
  \ 类：\n\n```javascript\nexport class Stack {\n  constructor() {\n    // 我们将基于链表结构实现\n\
  \    // 非常相似结构。比较 Stack 的 push/pop 操作\n    // 与 LinkedList 的 prepend/deleteHead\
  \ 操作。\n    this.linkedList = new LinkedList();\n  }\n}\n```\n\n#### push\n\n如果我们想向栈中推入某些东西，我们需要将数据\
  \ `append` 到链表的末尾。在这种情况下，栈顶就是链表的尾部：\n\n```javascript\n/**\n * @param {*} value\n\
  \ */\npush(value) {\n  // Pushing 意味着将值放在栈的顶部。因此，让我们在\n  // 链表的头部添加新值。\n  this.linkedList.prepend(value);\n\
  }\n```\n\n#### pop\n\n如果我们想从栈中弹出元素，我们需要 `delete` 链表尾部并返回它：\n\n```javascript\n/**\n\
  \ * @return {*}\n */\npop() {\n  // 让我们尝试删除链表中的第一个节点（头部）。\n  // 如果链表中没有头部（它为空），则直接返回\
  \ null。\n  const removedHead = this.linkedList.deleteHead();\n  return removedHead\
  \ ? removedHead.value : null;\n}\n```\n\n#### peek\n\n另一个常见的栈操作是检查栈顶是什么，而无需实际提取数据。在这种情况下，我们只需要读取链表的尾部：\n\
  \n```javascript\n/**\n * @return {*}\n */\npeek() {\n  if (this.isEmpty()) {\n \
  \   // 如果链表为空，则没有可以 peek 的内容。\n    return null;\n  }\n  // 仅从链表的头部读取值而不删除它。\n  return\
  \ this.linkedList.head.value;\n}\n```\n\n到此，我们已经完成了强制性的栈操作。现在，让我们继续实现一些辅助方法，这将使\
  \ `Stack` 类的使用更加方便。\n\n#### isEmpty\n\n实现 `isEmpty()` 方法来检查栈是否为空。要实现这一点，我们只需要检查链表是否有头部：\n\
  \n```javascript\n/**\n * @return {boolean}\n */\nisEmpty() {\n  // 如果链表没有头部，则栈为空。\n\
  \  return !this.linkedList.head;\n}\n```\n\n#### toArray\n\n另一个有用方法是 `toArray()`，将我们的栈转换为数组。要实现这一点，我们需要：\n\
  1. 将链表转换为数组，\n2. 提取每个链表节点的值，因为我们不希望 `Stack` 类的使用者去处理链表节点。通过这样做，我们封装了类的实现，\n3. 反转链表数组，以便链表的尾部成为数组的第一个元素，头部成为数组的最后一个元素。这不是强制性的，但是为了方便起而做的。\n\
  \n代码如下：\n\n```javascript\n/**\n * @return {[]}\n */\ntoArray() {\n  return this.linkedList\n\
  \    .toArray()\n    .map(linkedListNode => linkedListNode.value);\n}\n```\n\n####\
  \ toString\n\n最后一个实现的方法是 `toString()`，它基于 `toArray()` 并将栈转换为字符串表示：\n\n```javascript\n\
  /**\n * @param {function} [callback]\n * @return {string}\n */\ntoString(callback)\
  \ {\n  return this.linkedList.toString(callback);\n}\n```\n\n最后一个大括号是 `Stack` 类的结束括号。到此时，我们\
  \ `Stack` 类的基础实现已经就绪。你可以在 `code/src/04-stack/Stack.js` 文件中找到完整的类代码示例。\n\n\n\n\n\n\
  Wikipedia 上的栈 <a href=\"https://en.wikipedia.org/wiki/Stack*(abstract_data_type)\"\
  >https://en.wikipedia.org/wiki/Stack*(abstract_data_type)</a>\n\nYouTube 上的栈 [`www.youtube.com/watch?v=wjI1WNcIntg`](https://www.youtube.com/watch?v=wjI1WNcIntg)\n\
  \n示例与测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack)\n\
  \n## 哈希表 (Hash Table)\n\n难度：中\n\n`hash table`（或哈希映射）是一种实现`关联数组抽象数据类型`的数据结构，这种结构可以`将键映射到值`。例如，在`电话簿`（哈希表）中，你的`name`（键）可以作为你的`phone\
  \ number`（值）的唯一标识符。在电话簿中处理手机的`常用操作`如下：\n\n```\n 1 //  HashTable 类。\n 2 import {\
  \ HashTable } from './HashTable';\n 3 \n 4 // 创建哈希表实例。\n 5 const phoneBook = new\
  \ HashTable();\n 6 \n 7 // 向电话簿添加几个联系人。\n 8 phoneBook.set('John Smith', '+112342345678');\n\
  \ 9 phoneBook.set('Bill Jones', '+111111111111');\n10 \n11 // 现在我们可以在 O(1) 时间内访问每个联系人的电话。\n\
  12 phoneBook.get('John Smith'); // => '+112342345678'\n13 phoneBook.get('Bill Jones');\
  \ // => '+111111111111'\n14 \n15 // 删除电话号码。\n16 phoneBook.delete('John Smith');\n\
  17 phoneBook.get('John Smith'); // => undefined\n```\n\n`src/05-hash-table/HashTable.js`\n\
  \n理想情况下，哈希表允许我们以`O(1)` 的时间完成所有这些操作。相比之下，`Linked List`（链表）需要我们遍历列表中的`所有`节点来获取 John\
  \ Smith 的电话号码，查找时间为 `O(n)`。\n\n极高效的查找是哈希表的主要优势。\n\n但在最坏的情况下，哈希表的查找时间可能会达到 `O(n)`。我们将在本章节的后后部分讨论这种情况。\n\
  \n那么，我们该如何在哈希表中实现快速的 `O(1)` 查找呢？我们分配一个包含`buckets`（桶）或`slots`（槽）的数组，用于存储所有的哈希表数据。然后，我们需要将值的键映射到存储该值的桶的特定数字（索引或地址）。通过这种方式，我们只需要通过桶地址在\
  \ `O(1)` 时间内访问即可在哈希表中创建、读取和删除记录。\n\n构建哈希表存在某些局限性。桶的数量将有一个`固定大小`。这是因为任何程序都有特定的内存限制，我们不能假设为哈希表拥有无限的内存。\n\
  \n我们要映射到桶地址的键的大小可能是`任意的`（例如，`John Smith` 或仅为 `Jimmy`）。在桶数量有限的情况下，我们如何将任意大小的键映射到一个数字（索引或地址）？提示已经隐藏在“Hash\
  \ Table”这个数据结构的名称中了！那就是通过使用`hash function`（哈希函数）。\n\n### 哈希函数 (Hash Function)\n\n\
  `hash function` 是一种可以将`任意大小`的数据映射到`固定大小`数据的函数。哈希函数返回的值称为 `hash values`（哈希值）、`hash\
  \ codes`（哈希码）、`digests` 或简称为 `hashes`。\n\n在我们的情况下，哈希函数必须接受键（例如 `John Smith`）作为输入，并输出给定范围内的桶索引（例如，如果我们为桶分配一个大小为\
  \ 5 的数组，则从 `0` 到 `5`）。在现实世界中，桶的数量要得多。它应该与我们要存储在哈希表中的信息量成比例。\n\n哈希函数由两部分组成：\n\n1.\
  \ 将字符串转换为哈希码——理想情况下转换为键唯一数值表示。\n2. 使用模运算符将哈希码映射到特定的桶单元（因为桶的大小是的）。\n\n![](img/05-hash-table----hash-function.png)\n\
  \n#### 哈希函数示例\n\n有许多将字符串哈希为索引或地址的方法。计算字符串哈希的最简单方法之一是字符串中所有字符的 ASCII 码和。\n\n> 什么是\
  \ ASCII 码？\n\nASCII 代表美国信息交换标准（American Standard Code for Information Interchange），它是用数字表示英语字符的代码。计算机只理解\
  \ 1 和 0，这种代码我们将输入的字母转换为计算机可以理解的数字。\n\n让我们创建一个名为 `hash` 的 JavaScript 函数，将键和桶的数量作为参数。\n\
  \n```\n13 export function hash(key, bucketsNumber) {\n```\n\n`05-hash-table/hash.js`\n\
  \n我们将遍历字符串中的每个字符，并使用 JavaScript 的 `charCodeAt` 方法获取 ASCII 值。我们将这些代码相加得到 `hashCode`。\n\
  \n```\n14   let hashCode = 0;\n15   for (let characterIndex = 0; characterIndex\
  \ < key.length; characterIndex++) {\n16     hashCode += key.charCodeAt(characterIndex);\n\
  17   }\n18 \n19   // 减少哈数值以适应桶的大小。\n20   return hashCode % bucketsNumber;\n21 }\n\
  ```\n\n### 冲突解决 (Collision Resolution)\n\n理想情况下，哈希函数会将每个键分配到唯一的桶，但大多数哈希表设计采用不完美的哈希函数，这会导致哈希冲突，即哈希函数为多个键生成相同的索引。\n\
  \n链链法（Separate chaining）是一种技术，我们将每个桶转换为链表。这样每个桶就可以存储多个值而不仅仅是一个。如果发生冲突，我们将新值附加到桶链表的尾部。\n\
  \n![](img/05-hash-table----collisions.png)\n\n`read` 操作首先计算桶数，然后通过键在桶的链表中进行查找。在上面的示例中，使用链表获取\
  \ Billy Black 的电话号码所需的步骤如下：\n\n1. 计算 `Billy Black` 键的哈希码。假设 `Billy Black` 键的哈希码为\
  \ `11`。\n2. 通过模运算计算桶索引。如果有 `5` 个桶，我们得到的桶索引为 `11 % 5 = 1`。\n3. 从索引 `1` 的单元获取链表，并遍历它的每个值，将每个值的键与我们需要键（在本例中为\
  \ `Billy Black`）进行比较。一旦找到具有 `Billy Black` 键的链表节点，我们就直接返回它。\n\n\n\n\n哈希冲突是导致哈表基本操作（如\
  \ `read`、`write`、`update` 和 `delete`）的时间复杂度可能从 `O(1)` 降至 `O(n)` 的主要原因。在最坏的情况下，由于桶的数量较少且哈希函数不完美，所有值都可能存储在`one`\
  \ 桶中。这将导致哈表变得像一个链表。\n\n# 实现\n\n让我们结合上述哈希表基本操作以及分离链法冲突解决方法，并使用“链表”章节中的 `LinkedList`\
  \ 类来实现哈希表。\n\n首先，我们需要导入链表类以便在哈希表中使用。哈希表中的每个桶将拥有一个 `LinkedList` 作为值，我们可以在其中存储每个键值对对应的值。\n\
  \n```\n1 import LinkedList from '../02-linked-list/LinkedList';\n```\n\n`src/05-hash-table/HashTable.js`\n\
  \n接下来，我们将设置桶的大小：\n\n```\n3 // 桶的数量直接影响冲突的数量。\n4 // 桶的数量越大，冲突就越少。\n5 // 为了演示，我们将哈希表的大小设置为一个\n\
  6 // 较小的数字，以展示如何处理冲突。\n7 const defaultBucketsNumber = 32;\n```\n\n`src/05-hash-table/HashTable.js`\n\
  \n### `constructor`\n\n让我们从创建 `HashTable` 类开始：\n\n```\n9 export class HashTable\
  \ {\n```\n\n`4-stack/Stack.js`\n\n在构造方法中，我们链联了许多函数。让我们分解每个部分发生的情况，以便更好地理解正在发生什么。\n\
  \n```\n10   /**\n11    * @param {number} bucketsNumber - 存储哈表数据的桶的数量。\n12    *\n\
  13    */\n14   constructor(bucketsNumber = defaultBucketsNumber) {\n15     // 创建特定大小的哈表，并在每个桶中填充空链表。\n\
  16     this.buckets = Array(bucketsNumber).fill(null).map(() => new LinkedList());\n\
  17   }\n```\n\n`src/05-hash-table/HashTable.js`\n\n首先，我们创建一个新数组并用 `bucketsNumber`\
  \ 值初始化它：\n\n```\nthis.buckets = new Array(bucketsNumber)\n```\n\n然后，我们用 `null` 值填充数组，以便对其进行遍历：\n\
  \n```\nthis.buckets = new Array(bucketsNumber).fill(null)\n```\n\n最后，我们将数组中所有新创建的值都设置为一个\
  \ `LinkedList` 对象：\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null).map(()\
  \ => new LinkedList());\n```\n\n### `hash`\n\n`hash()` 方法将字符串 `key` 转换为我们需要的桶索引，该索引用于存储指定\
  \ `key` 的值。如上所述，我们将使用一种简单的方法，根据键中每个字符的 ASCII 值之和来计算哈希。\n\n```\n18   /**\n19    *\
  \ 将键字符串转换为哈希数字。\n20    *\n21    * @param {string} key\n22    * @return {number}\n\
  23    */\n24   hash(key) {\n25     let hashCode = 0;\n26 \n27     // 遍历所有键字符，并将它们的代码加到哈希中。\n\
  28     for (let characterIndex = 0; characterIndex < key.length; characterIndex\
  \ += 1) {\n29       hashCode += key.charCodeAt(characterIndex);\n30     }\n31 \n\
  32     // 缩小哈希数字以适应桶表的大小。\n33     return hashCode % this.buckets.length;\n34   }\n\
  ```\n\n`src/05-hash-table/HashTable.js`\n\n首先，我们使用 `for` 循环遍历所有字符并计算它们的和。\n\n```\n\
  for (let characterIndex = 0; characterIndex < key.length; characterIndex += 1) {\n\
  \  hashCode += key.charCodeAt(characterIndex);\n}\n```\n\n接下来，我们应用取模运算符 `%`，这将把我们生成的哈希范围限制在可用桶的数量之内：\n\
  \n```\n// 缩小哈希数字以适应桶表的大小。\nreturn hashCode % this.buckets.length;\n```\n\n如果我们的\
  \ `hashCode` 值等于 97 且 `this.buckets.length` 等于 50，函数将返回 `97 % 50 = 47`。我们将使用索引为\
  \ 47 的桶来存储键 ‘ab’ 的值。\n\n### `set`\n\n我们根据键和值向哈表中添加元素。\n\n```\n36   /**\n37    *\
  \ 通过键添加或更新值。\n38    *\n39    * @param {string} key\n40    * @param {*} value\n41\
  \    */\n42   set(key, value) {\n43     // 计算桶索引。\n44     const keyHash = this.hash(key);\n\
  45     // 获取特定桶索引的链表。\n46     const bucketLinkedList = this.buckets[keyHash];\n\
  47     // 在链表执行执行“按键查找”操作。\n48     const node = bucketLinkedList.find({ callback:\
  \ nodeValue => nodeValue.key === key });\n50 \n51     // 检查带有指定键的值是否已存在于链表中。\n52\
  \     if (!node) {\n53       // 插入新节点。\n55       bucketLinkedList.append({ key,\
  \ value });\n56     } else {\n57       // 更新现有节点。\n58       node.value = value;\n\
  59     }\n60   }\n```\n\n`src/05-hash-table/HashTable.js`\n\n我们开始计算键的哈希。该哈希值将指向桶索引。\n\
  \n```\nconst keyHash = this.hash(key);\n```\n\n接下来，获取存储在桶中的链表。\n\n```\nconst bucketLinkedList\
  \ = this.buckets[keyHash];\n```\n\n此时，我们需要检查正在尝试设置的值是否已存在于链表中。我们将使用 `find` 方法。\n\
  \n```\nconst node = bucketLinkedList.find({ callback: nodeValue => nodeValue.key\
  \ === key });\n```\n\n### `get`\n\n使用键从哈表中获取值的操作与 `set` 方法相似。唯一的区别是，在检查链表中是否存在该值后，返回其值或\
  \ `undefined`。\n\n```\n61   /**\n62    * 通过键获取值。\n63    *\n64    * @param {string}\
  \ key\n65    * @return {*}\n66    */\n67   get(key) {\n68     // 计算桶索引。\n69    \
  \ const keyHash = this.hash(key);\n70     // 获取特定桶索引的链表。\n71     const bucketLinkedList\
  \ = this.buckets[keyHash];\n72     // 在链表执行“按键查找”操作。\n73     const node = bucketLinkedList.find({\
  \ callback: nodeValue => nodeValue.key === key });\n74 \n75     // 检查带有指定键的值是否已存在于链表中。\n\
  76     return node ? node.value.value : undefined;\n77   }\n```\n\n`src/05-hash-table/HashTable.js`\n\
  \n### `delete`\n\n当我们从哈表中删除值时，我们使用与 `set` 方法相似的一些步骤。我们首先计算提供的键的哈希，然后获取桶的链表。最后，我们检查要删除的值是否存在于链表中。如果存在，我们使用\
  \ `LinkedList` 的 delete 方法并返回 `true`。否则，我们返回 `false`，表示没有可删除的内容。\n\n\n\n\n```javascript\n\
  \ 78   /**\n   * 根据键删除值。\n   * \n   * @param {string} key\n   * @return {boolean}\n\
  \   */\n   delete(key) {\n     // 计算哈桶索引。\n     const keyHash = this.hash(key);\n\
  \     // 获取特定哈桶索引的链表。\n     const bucketLinkedList = this.buckets[keyHash];\n  \
  \   // 在链表中执行“按键查找”操作。\n     const node = bucketLinkedList.find({ callback: nodeValue\
  \ => nodeValue.key === key });\n \n     // 如果链表中存在该节点，则删除该节点。\n     if (node) {\n\
  \       bucketLinkedList.delete(node.value);\n\n       return true;\n     }\n\n\
  \     return false;\n   }\n```\n\n`src/05-hash-table/HashTable.js`\n\n目前我们的 `HashTable`\
  \ 类的基本实现已经就绪。你可以在 `code/src/05-hash-table/HashTable.js` 文件中找到完整的类代码示例。\n\n### 操作时间复杂度\n\
  \n| 情况 | 搜索 | 插入 | 删除 |get |\n| --- | --- | --- | --- | --- |\n| **平均** | O(1) |\
  \ O(1) | O(1) | 具有良好的哈希函数和足够的哈桶数量 |\n| **最坏情况** | O(n) | O(n) | O(n) | 哈希函数较差且哈桶数量过小\
  \ |\n\n### 示例\n\n以下是一些你在面试过程中可能会遇到的相关问题：\n\n* [设计一个 HashSet](https://leetcode.com/problems/design-hashset/)\n\
  * [设计一个 HashMap](https://leetcode.com/problems/design-hashmap/)\n\n### 测验\n\n* Q1:\
