    \ \"a\" 是否大于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n\
    \   */\n  greaterThan(a, b) {\n    return this.compare(a, b) > 0;\n  }\n```\n\n\
    `utils/comparator/Comparator.js`\n\n### `lessThanOrEqual()`\n\n此函数检查变量 `a` 是否小于或等于\
    \ `b`。\n\n```javascript\n  /**\n   * 检查变量 \"a\" 是否小于或等于 \"b\"。\n   * @param {*}\
    \ a\n   * @param {*} b\n   * @return {boolean}\n   */\n  lessThanOrEqual(a, b)\
    \ {\n    return this.lessThan(a, b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `greaterThanOrEqual()`\n\n此函数检查变量 `a` 是否大于或等于 `b`。\n\n```javascript\n  /**\n\
    \   * 检查变量 \"a\" 是否大于或等于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return\
    \ {boolean}\n   */\n  greaterThanOrEqual(a, b) {\n    return this.greaterThan(a,\
    \ b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n###\
    \ `linearSearch()`\n\n既然我们已经实现了 `Comparator` 工具类，现在让我们来实现 `linearSearch()` 函数吧。\n\
    \n`linearSearch()` 函数将数组中的每个元素与我们尝试查找的元素进行比较。比较是通过 `Comparator` 类完成的。一旦找到元素，其位置就会记录在\
    \ `foundIndices` 数组中。\n\n```javascript\nexport default function linearSearch(array,\
    \ seekElement, comparatorCallback) {\n  const comparator = new Comparator(comparatorCallback);\n\
    \  const foundIndices = [];\n\n  array.forEach((element, index) => {\n    if (comparator.equal(element,\
    \ seekElement)) {\n      foundIndices.push(index);\n    }\n  });\n\n  return foundIndices;\n\
    }\n```\n"
- fmt: "\n$2^x = n \\implies x = \\log(n)$\n\nAnd `x` here is our time complexity.\n\
    \n> To grasp the idea of how efficient `O(log(n))` time is for binary search let’s\
    \ compare it to the `O(n)` time complexity of linear search. The Tycho-2 star\
    \ catalog contains information about the brightest `2,539,913` stars in our galaxy.\
    \ Let’s imagine that we want to find a star by its name in that catalog. In the\
    \ worst case scenario for linear search we would need to do `2,539,913` iterations.\
    \ In the worst case scenario for binary search and if all stars are sorted by\
    \ their names it would take only `22` iterations (`log_2(2539913) = 21.27`).\n\
    \n## Space Complexity\n\nThe algorithm may be implemented in different ways using\
    \ iterative approach or recursive approach (allocating additional memory for each\
    \ recursive call). Depending on the implementation that space complexity may vary.\
    \ In this chapter we will use simple iterative approach without creating array\
    \ copies. And thus the space complexity, in this case, would be `O(1)`.\n\n##\
    \ Application\n\n*   Binary search is used for doing `fast search operation` in\
    \ sorted arrays.\n\n*   Binary search approach is used for `Binary Search Tree`\
    \ implementation.\n\n*   Binary search approach may be used to quickly `find a\
    \ bug commit` in a commit history. Just split commit history by halves. If a bug\
    \ already exists in the “middle” commit then move left to the earlier commits\
    \ and split the left half. Otherwise, if the bug is not present then move right\
    \ to the later commits.\n\n*   Binary search approach may be used to quickly `find\
    \ a buggy line of code` in the program. Just comment the half of the code and\
    \ see if the bug is still presented. If yes then move up, otherwise move down.\n\
    \n## Usage Example\n\nEarlier in this chapter, we’ve discussed how fast it would\
    \ be to search for a star by its name in Tycho-2 catalog in case if it was sorted\
    \ by name. Instead of linear `2,539,913` iterations, it would give us only `22`\
    \ iterations to find the star.\n\nLet’s imagine that we already have this sorted\
    \ catalog of stars in our script and let’s see how we would want to apply binary\
    \ search to it.\n\n```\n 1 // Import dependencies.\n 2 import binarySearch from\
    \ './binarySearch';\n 3 \n 4 // Let's create a really simple and small demo version\
    \ of our sorted stars catalog.\n 5 const sortedArrayOfStars = [\n 6   { name:\
    \ 'Alpha Centauri A', position: {} },\n 7   { name: 'Alpha Centauri B', position:\
    \ {} },\n 8   { name: 'Betelgeuse', position: {} },\n 9   { name: 'Polaris', position:\
    \ {} },\n10   { name: 'Rigel', position: {} },\n11   { name: 'Sirius', position:\
    \ {} },\n12   // And 2.5 millions more records here :)\n13 ];\n14 \n15 // Our\
    \ custom object comparator for binary search function.\n16 // We will use string\
    \ comparison here. For example 'Polaris' is smaller than 'Rigel'.\n17 const comparator\
    \ = (star1, star2) => {\n18   if (star1.name === star2.name) return 0;\n19   return\
    \ star1.name < star2.name ? -1 : 1;\n20 };\n21 \n22 // Now let's search for the\
    \ stars.\n23 binarySearch(sortedArrayOfStars, { name: 'Not Existing Name' }, comparator);\
    \ // -> -1\n24 binarySearch(sortedArrayOfStars, { name: 'Alpha Centauri A' },\
    \ comparator); // -> 0\n25 binarySearch(sortedArrayOfStars, { name: 'Alpha Centauri\
    \ B' }, comparator); // -> 1\n26 binarySearch(sortedArrayOfStars, { name: 'Polaris'\
    \ }, comparator); // -> 3\n```\n\n`15-binary-search/example.js`\n\n## Implementation\n\
    \nIn the example above we’ve been using a custom comparison function that compared\
    \ star objects with each other. To make it possible we will re-use the `Comparator`\
    \ utility class that we’ve already implemented in “Linear Search” chapter. Please\
    \ address the “Linear Search” chapter to get the details of `Comparator` class\
    \ implementation. This is a really simple class that provides a common interface\
    \ for object comparison.\n\nSo let’s import dependencies first.\n\n```\n// Import\
    \ dependencies.\nimport Comparator from '../utils/comparator/Comparator';\n```\n\
    \n`16-binary-search/binarySearch.js`\n\nNow we may move on to binary search function\
    \ implementation.\n\n```\n 4 /**\n 5  * Binary search implementation.\n 6  *\n\
    \ 7  * @param {*[]} sortedArray\n 8  * @param {*} seekElement\n 9  * @param {function(a,\
    \ b)} [comparatorCallback]\n10  * @return {number}\n11  */\n12 export default\
    \ function binarySearch(sortedArray, seekElement, comparatorCallback) {\n13  \
    \ // Let's create comparator from the comparatorCallback function.\n14   // Comparator\
    \ object will give us common comparison methods like equal() and lessT\\\n15 \
    \ hen().\n16   const comparator = new Comparator(comparatorCallback);\n17 \n18\
    \   // These two indices will contain current array (sub-array) boundaries.\n\
    19   let startIndex = 0;\n20   let endIndex = sortedArray.length - 1;\n21 \n22\
    \   while (startIndex <= endIndex) {\n23     // Let's calculate middle index.\n\
    24     const middleIndex = Math.floor((startIndex + endIndex) / 2);\n25     //\
    \ If we found the element, return the index.\n26     if (comparator.equal(sortedArray[middleIndex],\
    \ seekElement)) {\n27       return middleIndex;\n28     }\n29     // If the element\
    \ is less than the seekElement, search the right half.\n30     if (comparator.lessThan(sortedArray[middleIndex],\
    \ seekElement)) {\n31       startIndex = middleIndex + 1;\n32     // If the element\
    \ is greater than the seekElement, search the left half.\n33     else {\n34  \
    \     endIndex = middleIndex - 1;\n35     }\n36   }\n37   return -1;\n38 }\n```\n\
    \n`16-binary-search/binarySearch.js`\n\n### Problems\n\nHere are some binary search\
    \ related problems you might encounter:\n\n*   [Search Insert](https://leetcode.com/problems/search-insert-position/)\n\
    \n*   [Divide Two Integers](https://leetcode.com/problems/divide-two-integers/)\n\
    \n*   [Search in Sorted Array](https://leetcode.com/problems/search-in-sorted-array/)\n\
    \n### Quiz\n\nQ1: Can we apply binary search to not array?\n\nQ2: What is the\
    \ time complexity of binary?\n\n### References\n\nBinary search on Wikipedia [https://en.wikipedia.org/wiki/Binary_search](https://en.wikipedia.org/wiki/Binary_search)\n\
    \nBinary search on YouTube [https://www.youtube.com/watch?v=P3YID7Bug](https://www.youtube.com/watch?v=P3YID7Bug)\n\
    \nBinary search example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/binary-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/binary-search)\n\
    \n## Sets. Cartesian Product.\n\n*   *Difficulty: easy*\n\n### Sets\n\nThe Cartesian\
    \ Product algorithm uses sets to calculate the sets of. When working with sets,\
    \ there are some basic terms we need to understand first.\n\nIn mathematics, a\
    \ **set** is a collection of distinct objects, considered as an object in its\
    \ own right. For example numbers `2`, `1`, `0` and `14` may form a set of numbers\
    \ `{2, 1, 0, 14}`. Strings `'apple'`, `'banana'` and `'grape'` may form a set\
    \ of strings/fruits `{'apple', 'banana', 'grape'}`. We can use arrays in JavaScript\
    \ to create sets.\n\n```\nconst setOfNumbers = [2, 1, 0, 14]; \n```\n\nThe objects\
    \ that form a set are called set **elements**.\n\n### Cartesian Product\n\nA **cartesian\
    \ product** is a mathematical operation that returns a set (or **product set**\
    \ or **product**) from multiple sets. For two sets `A` and `B` the product set\
    \ `A×B` will consist of all possible ordered pairs `(a,b)` where `a` is an element\
    \ of `A` set and `b` is an element of `B`.\n\nFor example the power set of two\
    \ sets `A = {x, y, z}` and `B = {1, 2, 3}` would be the following set:\n\n```\n\
    {(x,1), (x,2), (x,3), (y,1), (y,2), (y,3), (z,1), (z,2), (z,3)}\n```\n\nThe illustration\
    \ below shows an example of how the power set of two sets is formed:\n"
