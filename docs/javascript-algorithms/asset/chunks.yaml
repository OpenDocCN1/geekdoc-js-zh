    \n### Complexity\n\n| Space | Worst Case Performance | Best Case Performance |\
    \ Average Performance |\n\n| --- | --- | --- | --- |\n\n| O(1) | O(n) | O(1) |\
    \ O(n) |\n\nThe algorithm iteratively goes through the list. It doesn’t use additional\
    \ data structures and thus the **space complexity** is O(1).\n\nThe **worst-case\
    \ scenario** for performance is when the element we are looking for does not exist\
    \ in the array. In this case, the algorithm needs to traverse all list elements\
    \ in this case. As a result, we have O(n) time complexity for the worst-case scenario.\n\
    \nIn the **best-case scenario**, the element we’re looking for is placed at the\
    \ very beginning of the list. In this case, time complexity would be O(1). In\
    \ our implementation, the complexity would still be O(n) because we made an assumption\
    \ that the array might have duplicates and we want to find the position of all\
    \ the duplicates if there are any.\n\nIn the **average scenario** if we know that\
    \ the probability of finding every element in the array is equal, then the time\
    \ complexity would be O(n/2). If we don’t know that the probability of finding\
    \ every element in the array is equal, then the average case is O(n) time complexity.\n\
    \n### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n*   [Peak Index in a Mountain Array](https://leetcode.com/problems/peak-index-in-a-mountain-array/)\n\
    \n*   [Find First and Last Position of Element in Sorted Array](https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/)\n\
    \n### Quiz\n\n*Q1: What time complexity of the linear search algorithm?*\n\n*Q2:\
    \ Is it true that we should apply linear search algorithm for huge list?*\n\n\
    ### References\n\nLinear search on Wikipedia [https://en.wikipedia.org/wiki/Linear_search](https://en.wikipedia.org/wiki/Linear_search)\n\
    \nLinear search example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/search/linear-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/search/linear-search)\n\
    \n## Search. Binary Search.\n\n*   *Difficulty: medium*\n\n### The Task\n\nFind\
    \ the position of a specific element in a *sorted* array.\n\n### The Algorithm\n\
    \n**Binary search** is an efficient algorithm for finding the item in a sorted\
    \ array. It works by doing the following steps:\n\n1.  Get the middle element\
    \ of an array (it splits array by two halves).\n\n2.  Check if the middle element\
    \ is equal to the element we’re searching for.\n\n3.  If the middle element is\
    \ equal to the seek element then we’ve found it. Just return the current element\
    \ index.\n\n4.  If the middle element is bigger than the seek element then abandon\
    \ the right half of the array. Otherwise, abandon the left half of the array.\
    \ We can do so because we know that the array is sorted.\n\n5.  Treat half of\
    \ the array that is left as a new array and go to step 1 again.\n\nThe algorithm\
    \ ends up by either finding the position of the seek element or by returning `null`\
    \ or `-1` if the right or left half consists of just one element that is not equal\
    \ to the seek element.\n\nTake a look at the illustration below that shows the\
    \ flow of finding number `8` in a sorted array.\n\n![](images/16-binary-search----binary-search.png)\n\
    \n### Algorithm Complexities\n\n#### Time Complexity\n\nIn the example above can\
    \ see that after every comparison iteration we abandon the half of the array.\
    \ For example, after the first comparison (is `12` bigger than `8`?) we make the\
    \ decision to go left (to abandon the elements with indices starting from `4`\
    \ to `8`). We do so because the middle element `12` is larger than `8`. It’s not\
    \ possible to find `8` in the right half of the array since the array is sorted.\
    \ We repeat this process over and over again until we find `8`. *This is what\
    \ makes binary search efficient. Its time complexity is O(log(n)), where n is\
    \ the number of elements in the array.*\n\nTo illustrate the fact that time complexity\
    \ of this algorithm is *O(log(n))*, let’s think about the worst case when the\
    \ element we are searching for doesn’t exist in the array. In this case, how many\
    \ time do we split the array by two halves until the next half has just one element?\
    \ In our example above we have an array of `9` elements:\n\n```\nMath.floor(9\
    \ / 2); // -> 4\nMath.floor(4 / 2); // -> 2\nMath.floor(2 / 2); // -> 1\n```\n\
    \nThe number of possible divisions is proportional to the power of two that will\
    \ give us the total number of elements in the array (or at least *close* to the\
    \ total number of elements). We can write this statement using this formula:"
