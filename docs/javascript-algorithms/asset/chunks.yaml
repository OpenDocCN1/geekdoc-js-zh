  trans: "\n\n```javascript\n221\n  /**\n   * @param {*} item\n   * @return {MinHeap}\n\
    \   */\n  add(item) {\n    // 将新元素添加到堆的末尾（保持形状属性）。\n    this.heapContainer.push(item);\n\
    \n    // 将当前元素添加到堆元素映射中，以便快速访问。\n    this.heapElements.set(item, item);\n\n  \
    \  // 如果元素小于其父节点，则通过向上堆化来确保\n    // 堆属性被保持。\n    this.heapifyUp();\n\n    return\
    \ this;\n  }\n```\n\n`4-stack/Stack.js`\n\n#### `remove`\n\n该方法通过值从堆中删除元素。为了删除元素（s），我们需要执行以下操作：\n\
    \n*   在堆中找到所有具有指定值的元素（可能存在重复元素，且它们都需要被删除）\n*   遍历所有需要删除的元素。– 将堆的最后一个元素移动到空缺（被删除）的位置。–\
    \ 对于刚刚移动的元素，我们需要获取它的新父节点和子节点，以决定是否违反了堆属性。– 如果违反了堆属性，我们需要调用 `heapifyUp()`（如果父节点大于新元素值）或\
    \ `heapifyDown()`（如果元素值大于其任何子节点的值）方法。\n\n函数将返回 `this`，以便方便地进行如 `heap.remove(10).add(5)`get\
    \ 链式命令。\n\n```javascript\n239\n  /**\n   * @param {*} item\n   * @param {Comparator}\
    \ [comparator]\n   * @return {MinHeap}\n   */\n  remove(item, comparator = this.compare)\
    \ {\n    // 找到需要删除元素的数量。\n    const numberOfItemsToRemove = this.find(item, comparator).length;\n\
    \n    // 从堆元素映射中删除当前元素。\n    this.heapElements.delete(item);\n\n    for (let iteration\
    \ = 0; iteration < numberOfItemsToRemove; iteration += 1) {\n      // 每次删除后都需要重新找到要删除的元素索引，\n\
    \      // 因为索引在每次堆化过程后都会发生。\n      const indexToRemove = this.find(item, comparator).pop();\n\
    \n      // 如果需要删除堆中的最后一个元素，直接删除即可。\n      // 之后不需要对堆进行堆化。\n      if (indexToRemove\
    \ === (this.heapContainer.length - 1)) {\n        this.heapContainer.pop();\n\
    \      } else {\n        // 将堆中的最后一个元素移动到空缺（被删除）的位置。\n        this.heapContainer[indexToRemove]\
    \ = this.heapContainer.pop();\n\n        // 获取父节点。\n        const parentItem =\
    \ this.parent(indexToRemove);\n\n        // 如果没有父节点或者父节点与要删除的节点顺序正确，\n       \
    \ // 则则向下堆化。否则向上堆化。\n        if (\n          this.hasLeftChild(indexToRemove)\n\
    \          && (\n            !parentItem\n            || parentItem <= this.heapContainer[indexToRemove]\n\
    \          )\n        ) {\n          this.heapifyDown(indexToRemove);\n      \
    \  } else {\n          this.heapifyUp(indexToRemove);\n        }\n      }\n  \
    \  }\n\n    return this;\n  }\n```\n\n`4-stack/Stack.js`\n\n### 复杂度\n\n| Peek\
    \ | Poll | Add | Remove |\n| --- | --- | --- | --- |\n| O(1) | O(log(n)) | O(log(n))\
    \ | O(log(n)) |\n\n*Polling*（弹出）、从队列中添加和删除元素的时间复杂度为 `O(log(n))`，因为我们每次执行这些操作时，都需要对堆树重新进行堆化。这在最坏情况下会导致我们需要访问树分支中的所有元素。\n\
    \n*Peeking*（查看）的时间复杂度为 `O(1)`，因为我们只需要访问堆数组的第一个元素（根节点）。\n\n### 问题示例\n\n以下是你在面试过程中可能会遇到的相关问题：\n\
    \n*   [判断二叉树的完整性](https://leetcode.com/problems/check-completeness-of-a-binary-tree/)\n\
    *   [二叉树插入器](https://leetcode.com/problems/complete-binary-tree-inserter/)\n\n\
    ### 测验\n\n*Q1: 每个二叉堆必须满足哪两个约束？*\n\n*Q2: 当对堆执行 `poll` 操作并提取头部时，必须将什么值放在被提取元素的位置？*\n\
    \n*Q3: `MinHeap` 中 `poll()` 的时间复杂度是多少？*\n\n"
- fmt: "\n```javascript\n 1. Import dependencies.\nimport { PriorityQueue } from './PriorityQueue';\n\
    \n// Let's init an empty priority queue.\nconst priorityQueue = new PriorityQueue();\n\
    \n// Let's init an array of US cities with population specified in millions.\n\
    const notSortedCities = [\n  { name: 'New York', population: 8.6 },\n  { name:\
    \ 'Chicago', population: 2.7 },\n  { name: 'San Francisco', population: 0.84 },\n\
    \  { name: 'Houston', population: 2 },\n];\n\n// Let's add all cities to our priority\
    \ queue treating population as a priority.\nnotSortedCities.forEach(city => priorityQueue.add(city,\
    \ city.population));\n\n// Now let's fetch cities from priority queue one by one\
    \ and putting them into the\n// sortedCities array. We're expecting the cities\
    \ bing polled in population increasing order.\nconst sortedCities = [];\nwhile\
    \ (priorityQueue.peek()) {\n  // While we can peek something from the queue it\
    \ would mean that queue is not empty yet.\n  sortedCities.push(priorityQueue.poll());\n\
    }\n\n// We're expecting the sortedCities to be truly sorted in population increasing\
    \ order.\n// eslint-disable-next-line no-console\nconsole.log(sortedCities);\n\
    \n/*\n  The output would be:\n\n  [\n    { name: 'San Francisco', population:\
    \ 0.84 },\n    { name: 'Houston', population: 2 },\n    { name: 'Chicago', population:\
    \ 2.7 },\n    { name: 'New York', population: 8.6 },\n  ]\n*/\n```\n\n`07-priority-queue/example.js`\n\
    \n### Implementation\n\nWe’re going to build `PriorityQueue` class based on `MinHeap`\
    \ class as it was explained above. The `MinHeap` class supports custom comparator\
    \ functions. So we will use `Comparator` instance to alter the comparison algorithm\
    \ in `MinHeap` so that it would compare items priorities instead of values. For\
    \ more details about `MinHeap` and `Comparator` implementation please address\
    \ the “Heap” chapter of this book.\n\nLet’s import dependencies that we’re going\
    \ to use.\n\n```javascript\n// Import dependencies.\nimport { MinHeap } from '../07-heap/MinHeap';\n\
    import Comparator from '../utils/comparator/Comparator';\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \nLet’s declare the `PriorityQueue` class and extend it from `MinHeap` class.\n\
    \n```javascript\nexport class PriorityQueue extends MinHeap {\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `constructor()`\n\nIn constructor we will call the parent constructor of\
    \ `MinHeap` class first by calling `super()`.\n\nNext we will create a map of\
    \ priorities `this.priorities`. This map we store all priority queue items priority\
    \ values mapped by items themselves. For example `this.priorities` may look like\
    \ `{itemA: 10, itemB: 14}`, where `itemaA` and `itemB` are items keys and `10`\
    \ and `14` are items priorities.\n\nAlso we will create a custom `this.compare()`\
    \ function. This is the main place when we alter `MinHeap` behavior so that `MinHeap`\
    \ methods respect items priorities instead of items values. You may see here we’re\
    \ providing a custom `this.comparePriority()` function as a main comparison function.\
    \ This function will be explained below.\n\n```javascript\n  constructor() {\n\
    \    // Call MinHip constructor first.\n    super();\n\n    // Setup priorities\
    \ map.\n    this.priorities = new Map();\n\n    // Use custom comparator for heap\
    \ elements that will take element priority\n    // instead of element value into\
    \ account.\n    this.compare = new Comparator(this.comparePriority.bind(this));\n\
    \  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `comparePriority()`\n\
    \nThis function compares two items according to their priorities. To do so it\
    \ gets priorities of item `a` and `b` from `this.priorities` map. If both priorities\
    \ are equal it returns `0`, if `a` is less important than `b` then it returns\
    \ `-1` (items are not in correct order), otherwise it returns `1` (items are in\
    \ correct order).\n\n```javascript\n  /**\n   * Compares priorities of two items.\n\
    \   * @param {*} a\n   * @param {*} b\n   * @return {number}\n   */\n  comparePriority(a,\
    \ b) {\n    if (this.priorities.get(a) === this.priorities.get(b)) {\n      return\
    \ 0;\n    }\n    return this.priorities.get(a) < this.priorities.get(b) ? -1 :\
    \ 1;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `compareValue()`\n\
    \nThis method does the same as `comparePriority()` but instead of comparing priorities\
    \ it compares values.\n\n```javascript\n  /**\n   * Compares values.\n   * @param\
    \ {*} a\n   * @param {*} b\n   */\n  compareValue(a, b) {\n    if (a === b) {\n\
    \      return 0;\n    }\n    return a < b ? -1 : 1;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `add()`\n\nThis method adds items to the priority queue according to their\
    \ priority. It first sets priority value to `this.priorities` and then calls `super.add()`.\n\
    \n```javascript\n  /**\n   * Add item to the priority queue.\n   * @param {*}\
    \ item - item we're going to add.\n   * @param {number} priority - priority.\n\
    \   */\n  add(item, priority = 0) {\n    this.priorities.set(item, priority);\n\
    \    super.add();\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `remove()`\n\
    \nThis method removes the item from priority queue. It accepts two parameters,\
    \ the `item` that is going to remove and optional `customFindingComparator` allows\
    \ to customize the way item will be searched in heap.\n\n```javascript\n  /**\n\
    \   * Remove item from priority queue.\n   * @param {*} item - item we're going\
    \ to remove.\n   * @param {Function} customFindingComparator - custom callback.\n\
    \   */\n  remove(item, customFindingComparator) {\n    super.remove(item, customFindingComparator);\n\
    \    this.priorities.delete(item);\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `changePriority()`\n\nThis method changes priority of the item in queue.\
    \ Since on every priority change the heap needs to be rebuild in order for the\
    \ item to take a proper place we remove the item from the heap first and add it\
    \ back with updated priority. We could alternatively implement heap rebuilding\
    \ without removing the item but for simplicity reasons let’s stick with this.\n\
    \n```javascript\n  /**\n   * Change priority of the item in a queue.\n   * @param\
    \ {*} item - item we're going to re-prioritize.\n   * @param {number} priority\
    \ - new item's priority.\n   * @return {PriorityQueue}\n   */\n  changePriority(item,\
    \ priority) {\n    this.remove(item, new Comparator(this.compareValue));\n   \
    \ this.add(item, priority);\n    return this;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n### Complexities\n\nSince `PriorityQueue` is based on `MinHeap` class and its\
    \ main methods just wraps the main methods of `MinHeap` class with a altering\
    \ comparator function we may assume that time complexity of `PriorityQueue` class\
    \ are the same as of `MinHeap` class. Also notice that all operations with `this.priorities`\
    \ map are done in `O(1)` time.\n\n| Peek | Poll | Add | Remove |\n| --- | ---\
    \ | --- | --- |\n| O(1) | O(log(n)) | O(log(n)) | O(log(n)) |\n"
