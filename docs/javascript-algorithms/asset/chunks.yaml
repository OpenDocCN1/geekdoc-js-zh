  trans: "\n\n```javascript\n/**\n * @return {boolean}\n */\nisEmpty() {\n  return\
    \ !this.heapContainer.length;\n}\n```\n\n### 4-stack/Stack.js\n\n#### `find`\n\
    \n此辅助方法通过值查找堆中元素的位置。堆可能包含重复值，因此该方法返回一个位置数组，而不是仅仅是一个数字（我们正在搜索的元素的位置）。堆中两个元素之间的相等性通过使用\
    \ `comparator()` 函数进行检查。\n\n```javascript\n/**\n * @param {*} item\n * @param\
    \ {Comparator} [comparator]\n * @return {Number[]}\n */\nfind(item, comparator\
    \ = this.compare) {\n  const foundItemIndices = [];\n\n  for (let itemIndex =\
    \ 0; itemIndex < this.heapContainer.length; itemIndex += 1) {\n    if (comparator.equal(item,\
    \ this.heapContainer[itemIndex])) {\n      foundItemIndices.push(itemIndex);\n\
    \    }\n  }\n\n  return foundItemIndices;\n}\n```\n\n### 4-stack/Stack.js\n\n\
    #### `toString`\n\n此辅助方法通过直接调用 `heapContainer` 数组的 `toString()` 方法返回堆的字符串表示。\n\
    \n```javascript\n/**\n * @return {string}\n */\ntoString() {\n  return this.heapContainer.toString();\n\
    }\n```\n\n### 4-stack/Stack.js\n\n#### 保持堆属性的内部方法\n\n本节中的方法：`heapifyUp` 和 `heapifyDown`\
    \ 负责在任何堆修改后保持堆属性。使用 `heapifyUp` 和 `heapifyDown` 的堆修改方法——`peek`、`poll`、`add`、`remove`\
    \ 将下一节中解释。\n\n###### `heapifyUp`\n\n此方法确保在向最小堆添加新元素后，满足堆的属性。新元素可能比其父元素小。为了修复这种情况，我们取出堆容器中的最后一个元素（数组中的最后一个元素或树中左下角的元素），并将其向上移动，直到它相对于其父元素处于正确的顺序。\n\
    \n![](img/07-heap----heapify-up.png)\n\n我们还将通过向函数添加任意参数 `customStartIndex`，提供对堆中任何元素执行“上上调整”操作的可能性。我们在\
    \ `remove()` 方法中需要此功能。\n\n```javascript\n/**\n * @param {number} [customStartIndex]\n\
    \ */\nheapifyUp(customStartIndex) {\n  // 取出堆容器中的最后一个元素（数组中的最后一个元素或树中左下角的元素）\n\
    \  // 并将其向上移动，直到它相对于其父元素处于\n  //正确的顺序。\n  let currentIndex = customStartIndex\
    \ || this.heapContainer.length - 1;\n\n  while (\n    this.hasParent(currentIndex)\n\
    \    && this.compare.greaterThan(this.parent(currentIndex), this.heapContainer[currentIndex])\n\
    \  ) {\n    this.swap(currentIndex, this.getParentIndex(currentIndex));\n    currentIndex\
    \ = this.getParentIndex(currentIndex);\n  }\n}\n```\n\n### 4-stack/Stack.js\n\n\
    ###### `heapifyDown`\n\n此方法确保在堆根被弹出后，满足堆的属性。在这种情况下，常见的行为是将堆的根替换为 `heapContainer`\
    \ 的最后一个元素。但新的头部元素可能大于其子元素。在这种情况下，我们需要将父元素与其子元素进行比较，并将父元素与适当的子元素交换（最小堆取最小子元素，最大堆取最大子元素）。在交换后，我们需要对下一个子元素执行相同的操作。\n\
    \n![](img/07-heap----heapify-down.png)\n\n我们还将通过向函数添加任意参数 `customStartIndex`，提供对堆中任何元素执行“下调整”操作的可能性。我们在\
    \ `remove()` 方法中需要此功能。\n\n```javascript\n/**\n * @param {number} [customStartIndex]\n\
    \ */\nheapifyDown(customStartIndex = 0) {\n  // 比较父元素与其子元素，并将父元素与适当的\n  // 子交换（MinHeap\
    \ 取最小子元素，MaxHeap 取最大子元素）。\n  // 交换后对下一个子元素执行相同操作。\n  let currentIndex = customStartIndex;\n\
    \  let nextIndex = null;\n\n  while (this.hasLeftChild(currentIndex)) {\n    if\
    \ (\n      this.hasRightChild(currentIndex)\n      && this.compare.lessThanOrEqual(this.rightChild(currentIndex),\
    \ this.leftChild(currentIndex))\n    ) {\n      nextIndex = this.rightChild(currentIndex);\n\
    \    } else {\n      nextIndex = this.leftChild(currentIndex);\n    }\n\n    if\
    \ (this.compare.lessThanOrEqual(this.heapContainer[currentIndex], this.heapContainer[nextIndex]))\
    \ {\n      break;\n    }\n\n    this.swap(currentIndex, nextIndex);\n    currentIndex\
    \ = nextIndex;\n  }\n}\n```\n\n### 4-stack/Stack.js\n\n#### 主方法\n\n现在我们已经实现了一批辅助方法，让我们继续添加堆的主方法。\n\
    \n###### `peek`\n\n此方法将返回堆的头部但不移除它。当我们只需要检查最小堆的最小元素时，它是很有用的。堆的头部是 `heapContainer`\
    \ 数组的第一个元素。\n\n```javascript\n/**\n * @return {*}\n */\npeek() {\n  // 检查堆是否为空。\n\
    \  if (this.heapContainer.length === 0) {\n    // 如果堆为空则无内容。\n    return null;\n\
    \  }\n  // 返回堆的第一个元素\n  return this.heapContainer[0];\n}\n```\n\n### 4-stack/Stack.js\n\
    \n###### `poll`\n\n此方法将移除并返回堆的头部。当我们需要获取最小堆的最小元素时，它是很有用的。堆的头部是 `heapContainer`\
    \ 数组的第一个元素。\n\n在移除堆头部后，我们将 `heapContainer` 的最后一个元素移动到头部。此操作将保持形状属性（树必须是完全树）。但此时堆属性可能被违反，且最小堆的头部大于其子元素。为了修复这一点，我们调用\
    \ `heapifyDown()` 方法，它反过来将保持堆属性。我们将很快实现它。\n\n![](img/07-heap----poll-from-heap.png)\n\
    \n```javascript\n/**\n * @return {*}\n */\npoll() {\n  if (this.heapContainer.length\
    \ === 0) {\n    // 如果堆为空则无法弹出。\n    return null;\n  }\n  if (this.heapContainer.length\
    \ === 1) {\n    // 如果堆只有一个元素则直接提取。\n    return this.heapContainer.pop();\n  }\n\
    \  // 记住我们要返回的值。\n  const item = this.heapContainer[0];\n  // 将最后一个元素移动到头部以保持形状属性。\n\
    \  this.heapContainer[0] = this.heapContainer.pop();\n\n  // 为了保持堆属性，对堆进行下调整。\n\
    \  this.heapifyDown();\n\n  return item;\n}\n```\n\n### 4-stack/Stack.js\n\n######\
    \ `add`\n\n此方法向最小堆添加新元素。为了保持堆的形状属性，新元素被添加到 `heapContainer` 数组的末尾。在添加新元素后，新元素可能比其父元素小。在这种情况下，堆属性被违反。为了修复这一点，我们调用\
    \ `heapifyUp()` 方法，它会将新元素在树结构中向上移动，直到满足堆属性。\n\n![](img/07-heap----add-to-heap.png)\n\
    \n"
