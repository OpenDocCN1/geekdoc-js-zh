  trans: "\n\nQ2: 如何调整函数 `depthFirstSearch()` 以支持树节点拥有两个及以上的子节点？\n\n## 参考文献\n\n- Wikipedia\
    \ 上的度优先搜索 (BFS) [`en.wikipedia.org/wiki/Breadth-first_search`](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
    - 树的 BFS 示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search)\n\
    \n## 图形。深度优先搜索。\n\n*难度中等*\n\n### 任务\n\n假设我们有一个图，并且想要：\n\n- 检查特定顶点是否存在于图中（即对顶点“John”执行\
    \ `search` 操作），\n- 检查两个节点是否连通（即：在顶点“Bill”和“Tom”之间 `find connection path`），\n-\
    \ 通过访问图中的所有顶点来对顶点进行盘点（即将图转换为数组），\n- 等等（更多用例请参见下文的应用程序部分）。\n\n![](img/24-graph-depth-first-search----graph.png)\n\
    \n为了完成所有这些任务，我们需要利用`graph traversal algorithm`。换句话说，我们需要编写一种算法，能够访问从特定顶点可以到达图的所有顶点。\n\
    \n### 算法\n\n解决上述任务的方法之一是深度优先搜索算法。\n\n**深度优先搜索 (DFS)** 是一种用于遍历或搜索树或图数据结构的算法。该算法的核心思想是从某个特定节点（或顶点）开始，沿着每个分支尽可能深地探索，然后进行回溯。\n\
    \n在这里，`backtracking`（回溯）一词意味着当我们沿着图的分支深入移动并且当前路径上没有更多节点可以探索时，我们将向后移动，寻找另一个最近的未探索子分支（顶点），然后对其探索。\n\
    \n下面的插图展示了使用深度优先搜索算法进行图遍历的序列。\n\n![](img/24-graph-depth-first-search----graph-depth-first-search.png)\n\
    \n为了更好地理解深度优先搜索算法，你可以将其想象成穿过迷宫的过程。图是迷宫，图的边是路径，图的顶点是迷宫路径的交叉口。当你到达一个交叉口时，标记你打算走的路径，以避免将来再次走同一条路。当你到达一个所有路径都被标记为“已访问”的交叉口时，你会回到上一个交叉口（回溯），并选择另一条尚未过的路径。这个过程不断重复，直到你到达迷宫的出口。\n\
    \n该算法可以使用 `stack` 递归实现（参见本书中关于 `Stack` 数据结构的之前的章节）。使用栈进行深度优先搜索的想法如下：\n\n1. 选择起始顶点并将其添加到栈中。\n\
    2. 从栈中弹出下一个顶点并“访问”它（即：调用回调函数或对该顶点执行某些操作）。\n3. 将当前顶点的所有 `unvisited`（未访问）邻居推入栈中。\n\
    4. 回到第 2 步（重复此过程直到栈为空）。\n\n也可以使用 **Hash map**（哈希表）数据结构来高效检查顶点是否已经过访问。顶点必须具有一个唯一的\
    \ `key` 值，用作哈希表的键。\n\n### 应用\n\n深度优先搜索算法是与其他图相关算法的构建模块，例如：\n\n- 寻找连通分量，\n- 拓排序，\n\
    - 寻找图的桥，\n- 检测图中的环，\n- 路径查找，\n- 解决只有一个解的谜题（如迷宫），\n- 迷宫生成可能会使用随机深度优先搜索\n- 等等。\n\
    \n### 使用示例\n\n在实现 `depthFirstSearch()` 函数之前，让我们看看将如何使用它以及我们将向它传递哪些参数。`depthFirstSearch()`\
    \ 函数需要知道要遍历哪个图，以及从哪个起始顶点开始遍历过程。此外，我们还想向函数传递一个回调函数，该函数将在每次访问一个新顶点时被调用。考虑到这些点，让我们使用书书中“图形（Graphs）”章节中的\
    \ `Graph` 类创建一个非常基础的社交网络，然后遍历它。\n\n这是我们要实现的网络结构。\n\n![](img/24-graph-depth-first-search----network.png)\n\
    \n让我们从 `Bill` 开始，遍历所有直接连接或通过其他用户连接到 `Bill` 的用户。首先我们将创建一个图（类比社交网络）。接下来，我们将创建图顶点（类比在网络中注册用户）。然后，将在图节点之间创建图边（类比将用户添加到好友列表）。然后，我们将从\
    \ `Bill` 开始遍历所有用户。\n\n```\n 1 // 导入依赖项。\n 2 import Graph from '../08-graph/Graph';\n\
    \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
    \ '../08-graph/GraphEdge';\n 5 import { depthFirstSearch } from './depthFirstSearch';\n\
    \ 6 \n 7 // 创建我们过度简化的社交网络的演示版本。\n 8 const socialNetwork = new Graph();\n 9\n10\
    \ // 让在我们的网络中注册几个用户。\n11 const bill = new GraphVertex('Bill');\n12 const alice\
    \ = new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const\
    \ kate = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n16\
    \ const tom = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n\
    18\n19 // 现在在用户之间建立友谊关系。\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill,\
    \ alice))\n22   .addEdge(new GraphEdge(bill, john))\n23   .addEdge(new GraphEdge(bill,\
    \ kate))\n24   .addEdge(new GraphEdge(alice, ann))\n25   .addEdge(new GraphEdge(ann,\
    \ sam))\n26   .addEdge(new GraphEdge(john, ann))\n27   .addEdge(new GraphEdge(kate,\
    \ tom));\n28\n29 // 现在让我们以深度优先的方式遍历网络\n30 // 并我们将遇到的所有用户添加到 userVisits。\n31 const\
    \ userVisits = [];\n32 depthFirstSearch(socialNetwork, bill, (user) => {\n33 \
    \  userVisits.push(user);\n34 });\n35\n36 // 现在让我们看看用户是以什么顺序遍历的。\n37 // eslint-disable-line\
    \ no-console\n38 console.log(userVisits);\n39 /*\n40   输出将是\n41   [bill, alice,\
    \ ann, sam, john, kate]\n42 */\n```\n\n24-graph-depth-first-search/example.js\n\
    \n### 实现\n\n**函数参数**\n\n如上所述，`depthFirstSearch()` 函数接受三个参数：\n\n- `graph` - 要遍历的图（`Graph`\
    \ 类的实例），\n- `startVertex` - 我们将作为起始点的顶点（`GraphVertex` 类的实例），\n- `enterVertexCallback`\
    \ - 在每次访问顶点时调用的回调函数。\n\n**访问顶点记忆化**\n\n当我们为树实现深度优先搜索算法时，我们并不担心同一个节点在不同父节点处被访问两次的情况。这是因为树节点根据定义不能有两个或多个父节点，否则它就会变成图。因此，在树中我们只有一种进入节点的方式。但当我们处理图时，我们需要记住同一个图顶点可能会从许多邻居顶点被访问多次。这样同一个顶点可能会被多次添加到我们的遍历栈中。这使得整个遍历过程效率低下，甚至可能导致无限循环。这就是为什么我们在遍历图时需要标记所有访问过的顶点，以避免重复访问同一个顶点。我们将使用\
    \ `visitedVertices` 对象来实现。已访问图顶点的 `key` 值将是 `visitedVertices` 对象的键。这将帮助我们以 `O(1)`\
    \ 时间高效地检查节点是否已经过访问。\n\n**递归闭包**\n\n"
- fmt: "\nInside our `depthFirstSearch()` function let’s implement a recursive `depthFirstSearchRecursive()`\
    \ function. This function will contain the main traversal logic. The `depthFirstSearchRecursive()`\
    \ function is a closure, which means that it has an access to all variables and\
    \ parameters of the `depthFirstSearch()` function. Therefore we may pass only\
    \ one argument to it and it will be a vertex that is currently going to be traversed\
    \ (`currentVertex` parameter).\n\nWhat `depthFirstSearchRecursive()` does is simply\
    \ calling the `enterVertexCallback()` function, getting all `unvisited` neighbors\
    \ of `currentVertex`, marking them as visited and calling itself again for every\
    \ unvisited neighbor of the `currentVertex`.\n\n### Implementation example\n\n\
    ```\n 1 /**\n 2  * Traverse the graph in depth-first manner.\n 3  *\n 4  * @param\
    \ {Graph} graph - Graph that is going to be traversed.\n 5  * @param {GraphVertex}\
    \ startVertex - Vertex that we will use as a starting point.\n 6  * @param {function}\
    \ enterVertexCallback - Callback that will be called on every ver\\\n 7 tex visit.\n\
    \ 8  */\n 9 export function depthFirstSearch(graph, startVertex, enterVertexCallback)\
    \ {\n10   // In order to prevent the visiting of the same vertex twice\n11   //\
    \ we need to memorize all visited vertices.\n12   const visitedVertices = {};\n\
    13 \n14   // Since we're going to visit startVertex first let's add it to the\
    \ visited list.\n15   visitedVertices[startVertex.getKey()] = true;\n16 \n17 \
    \  /**\n 18    * Recursive implementation of depth-first search.\n 19    *\n 20\
    \    * @param {GraphVertex} currentVertex - Graph vertex that is currently being\
    \ trave\\\n 21 rsed.\n 22    */\n 23   const depthFirstSearchRecursive = (currentVertex)\
    \ => {\n 24     // Call the callback to notify subscribers about the entering\
    \ a new vertex.\n 25     enterVertexCallback(currentVertex);\n 26 \n 27     //\
    \ Iterate over every neighbor of currently visited vertex.\n 28     currentVertex\n\
    \ 29       .getNeighbors()\n 30       .forEach((nextVertex) => {\n 31        \
    \ // In case if the neighbor vertex was not visited before let's visit it.\n 32\
    \         if (!visitedVertices[nextVertex.getKey()]) {\n 33           // Memorize\
    \ current neighbor to avoid visiting it again in the feature.\n 34           visitedVertices[nextVertex.getKey()]\
    \ = true;\n 35           // Visit the next neighbor vertex.\n 36           depthFirstSearchRecursive(nextVertex);\n\
    \ 37         }\n 38       });\n 39   };\n 40 \n 41   // Start graph traversal\
    \ by calling recursive function.\n 42   depthFirstSearchRecursive(startVertex);\n\
    \ 43 }\n```\n\n`24-graph-depth-first-search/depthFirstSearch.js`\n\n### Usage\
    \ of Stack\n\nIt was mentioned above the depth-first search algorithm may be implemented\
    \ using `Stack` data-structure. We may use `Stack` for implementing DFS algorithm\
    \ `explicitly` or `implicitly`.\n\nFor `explicit stack usage` we need to import\
    \ a `Stack` class implementation from “Stack” chapter of the book (or any other\
    \ stack implementation including a plain JavaScript array) and use stack instance\
    \ for storing all the vertices we’re going to traverse. While stack is not empty\
    \ we need to `pop()` the last added vertex from it, get all unvisited neighbors\
    \ of the vertex, `push()` them to the stack and repeat. We don’t need recursion\
    \ for explicit stack usage, the `while` loop may be a good fit instead.\n\nBut\
    \ in `depthFirstSearch()` function above we’ve used stack `implicitly` using recursion.\
    \ Even though we didn’t import the `Stack` class explicitly we were still dealing\
    \ with the stack in form of recursive `function call stack`. Every time the `depthFirstSearchRecursive()`\
    \ function calls itself the JavaScript engine push current function variables\
    \ (state) into the memory stack.\n\n![](images/24-graph-depth-first-search----graph-depth-first-search-stack.png)\n\
    \n### Complexities\n\n#### Time Complexity\n\nTime complexity for `depthFirstSearch()`\
    \ function is mostly defined by time complexity of its internal recursive function\
    \ `depthFirstSearchRecursive()`. Because all operations outside of `depthFirstSearchRecursive()`\
    \ are constant time operations. Inside the `depthFirstSearchRecursive()` function\
    \ we do the following:\n\n* Getting all neighbors of the current vertex. To do\
    \ that we need to iterate over all edges that are connected to the current vertex.\
    \ Thus the number of edges will impact the performance of this step.\n\n* Iterating\
    \ over all unvisited neighbors of the current vertex. The more vertices we would\
    \ have, more iterations will be needed for this step.\n\nTaking all that into\
    \ account we may conclude that time complexity of graph depth-first search algorithm\
    \ is `O(|V| + |E|)`, where `|V|` is total number of vertices and `|E|` is total\
    \ number of edges in the graph.\n\n#### Auxiliary Space Complexity\n\nIn current\
    \ implementation of `depthFirstSearch()` function we’re using recursion. Every\
    \ next recursion call will increase the function call stack. In worst-case scenario\
    \ when graph would look like linked list the function `depthFirstSearchRecursive()`\
    \ will increase the call stack proportionally to the number of vertices `|V|`\
    \ in the graph. Additionally we’re keeping track of visited vertices using the\
    \ `visitedVertices` map. This map will require the space to store all `|V|` number\
    \ of vertices.\n\nTaking all that into account we may conclude that auxiliary\
    \ space complexity of the current DFS implementation is `O(|V|`.\n\n### Problems\
    \ Examples\n\nHere are some related problems you might encounter during the interview:\n\
    \n* [Clone Graph](https://leetcode.com/problems/clone-graph/)\n* [Is Graph Bipartite?](https://leetcode.com/problems/is-graph-bipartite/)\n\
    * [Number of Islands](https://leetcode.com/problems/number-of-islands/)\n\n###\
    \ Quiz\n\n*Q1: What is time complexity of depth-first search?*\n\n*Q2: What data-structure\
    \ fits best for depth-first search: Stack or Queue?*\n\n### References\n\nDepth-first\
    \ search (DFS) on Wikipedia [https://en.wikipedia.org/wiki/Depth-first_search](https://en.wikipedia.org/wiki/Depth-first_search)\n\
    \nDepth-first search visualization [https://www.cs.usfca.edu/~galles/visualization/DFS.html](https://www.cs.usfca.edu/~galles/visualization/DFS.html)\n\
    \nGraph DFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/depth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/depth-first-search)\n\
    \n## Graphs. Breadth-First Search.\n\n*   *Difficulty: medium*\n\n### The Task\n\
    \nImagine that we have a graph and we want to:\n\n* check whether specific vertex\
    \ exists in a graph (i.e. perform `search` operation for vertex `John`),\n\n*\
    \ do vertices inventory by visiting all the vertices of a graph (i.e. to convert\
    \ a graph to an array).\n\n* etc (for more usecases see Application below).\n\n\
    ![](images/25-graph-breadth-first-search----graph.png)\n\nTo accomplish all these\
    \ tasks we need to *find an algorithm of graph traversal*. In other words we need\
    \ to find an algorithm of visiting all the vertices of a graph that can be reached\
    \ from some specific vertex.\n\n### The Algorithm\n\nOne of the ways to solve\
    \ the tasks mentioned above is breadth-first search algorithm.\n\n**Breadth-first\
    \ search (BFS)** is an algorithm for traversing or searching tree or graph data\
    \ structures. It starts at some arbitrary vertex of a graph, and explores all\
    \ of the neighbor vertices at the present depth prior to moving on to the nodes\
    \ at the next depth level.\n\nIt uses the opposite strategy as depth-first search,\
    \ which instead explores the highest-depth nodes first before being forced to\
    \ backtrack and expand shallower nodes.\n\nThe illustration below shows the sequence\
    \ of graph traversal using breadth-first search algorithm.\n\n![](images/25-graph-breadth-first-search----graph-breadth-first-search.png)\n"
