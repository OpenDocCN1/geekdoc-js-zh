  trans: "\n\n在我们实现图的 JavaScript 版本之前，让我们先假设我们已经有了 `Graph`、`GraphVertex` 和 `GraphEdge`\
    \ 类，并描述我们打算如何使用它们。\n\n假设我们想创建一个非常简单的社交网络模型。我们希望能够注册新用户、创建“朋友”关系，并查看特定用户的好友列表。\n\
    \n```javascript\n 11 // 导入依赖。\n 2 import Graph from './Graph';\n 3 import GraphVertex\
    \ from './GraphVertex';\n 4 import GraphEdge from './GraphEdge';\n 5 \n 6 // 创建网络。\n\
    \ 7 const network = new Graph();\n 8 \n9 // 创建用户。\n10 const bill = new GraphVertex('Bill');\n\
    11 const mary = new GraphVertex('Mary');\n12 const john = new GraphVertex('John');\n\
    13 const jane = new GraphVertex('Jane');\n14 \n15 // 在我们的网络中注册用户。\n16 network\n\
    17   .addVertex(bill)\n18   .addVertex(mary)\n19   .addVertex(john)\n20   .addVertex(jane);\n\
    21 \n22 // 检查用户是否注册成功。\n23 network.getVertexByKey('Bill'); // -> bill\n24 network.getVertexByKey('Mary');\
    \ // -> mary\n25 \n26 // 建立朋友连接。\n27 network\n28   .addEdge(new GraphEdge(bill,\
    \ mary))\n29   .addEdge(new GraphEdge(john, jane))\n30   .addEdge(new GraphEdge(jane,\
    \ mary));\n31 \n32 // 检查特定用户是否是朋友。\n33 network.findEdge(bill, mary); // -> GraphEdge\
    \ 实体\n34 network.findEdge(john, jane); // -> GraphEdge 实体\n35 network.findEdge(bill,\
    \ john); // -> null\n36 \n37 // 获取特定用户的所有朋友。\n38 // eslint-disable-next-line no-unused-expressions\n\
    39 mary.getNeighbors().length; // -> 2\n40 mary.getNeighbors(); // -> [bill, jane]\n\
    ```\n\n08-graph/example.js\n\n# 实现\n\n我们将实现分为三个部分。首先，实现 `GraphEdge` 和 `GraphVertex`\
    \ 类，然后将它们封装进 `Graph` 类中。\n\n## GraphEdge\n\n让我们创建这个类。\n\n```javascript\n1 export\
    \ default class GraphEdge {\n```\n\n08-graph/GraphEdge.js\n\n### `constructor`\n\
    \n构造方法将接受 `startVertex`、`endVertex` 以及 `weight` 参数。边的实例将表示 `startVertex` 和 `endVertex`\
