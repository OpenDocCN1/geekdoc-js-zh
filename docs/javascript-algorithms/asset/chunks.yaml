    \ of original set is a combi\\\n 8 nation.\n 9   if (comboLength === 1) {\n10\
    \     return comboOptions.map(comboOption => [comboOption]);\n11   }\n12 \n13\
    \   // Init combinations array.\n14   const combos = [];\n15 \n16   // Extract\
    \ characters one by one and concatenate them to combinations of smaller s\\\n\
    17 ize.\n18   // We need to extract characters since we don't want to have duplicates.\n\
    19   comboOptions.forEach((currentOption, optionIndex) => {\n20     // Get all\
    \ smaller combinations WITHOUT the current element from original set.\n21    \
