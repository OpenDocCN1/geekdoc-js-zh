    \ + 1),\n23       comboLength - 1,\n24     );\n25 \n26     // Concatenate current\
    \ element (option) to all smaller combinations.\n27     smallerCombos.forEach((smallerCombo)\
    \ => {\n28       combos.push([currentOption].concat(smallerCombo));\n29     });\n\
    30   });\n31 \n32   // Return all combinations.\n33   return combos;\n34 }\n```\n\
    \n20-combinations/combineWithoutRepetitions.js\n\n#### Combinations With Repetitions\n\
    \nThis problem may be solved recursively. It means that we may generate combinations\
    \ of bigger size out of combinations of smaller sizes. For example, if we need\
    \ to generate all combinations of size `r = 2` with repetitions for a set `S =\
    \ {A, B, C}` we do the following:\n\n*   remember the first element `A` of the\
    \ set,\n\n*   find all combinations of size `r = 1` for a set `S = {A, B, C}`,\n\
    \n*   concatenate `A` with all smaller combinations from the previous step,\n\n\
    *   remember the second element `B` of the set,\n\n*   find all combinations of\
    \ size `r = 1` for a set `S = {A, B, C}`,\n\n*   concatenate `B` with all smaller\
    \ combinations from the previous step,\n\n*   and so on…\n\nThe base case for\
    \ our recursion would be the case when we need to generate combinations of size\
    \ `r = 1` for a set. In this case every element of a set is a combination we’re\
    \ looking for, thus no further recursion calls are needed.\n\nThe main difference\
    \ from the algorithm for combinations *without* repetitions here is that instead\
    \ of extracting the elements out of a set we just remember them. We don’t need\
    \ extractions since repetitions are allowed.\n\nTake a look at full recursion\
    \ calls tree below to get better understanding of the algorithm.\n\n![](images/20-combinations----combinations-with-repetitions.png)\n\
    \nHere is an example of how this algorithm may be implemented in JavaScript.\n\
    \n```\n 1 /**\n 2  * @param {*[]} comboOptions - original set that we will take\
    \ elements from.\n 3  * @param {number} comboLength - the length of combinations\
    \ we're going to make.\n 4  * @return {*[]}\n 5  */\n 6 export default function\
    \ combineWithRepetitions(comboOptions, comboLength) {\n 7   // If the length of\
    \ combinations is 1 then each element of original set is a combi\\\n 8 nation.\n\
    \ 9   if (comboLength === 1) {\n10     return comboOptions.map(comboOption =>\
    \ [comboOption]);\n11   }\n12 \n13   // Init combinations array.\n14   const combos\
    \ = [];\n15 \n16   // Go through every character of original set and concatenate\
    \ it to combinations\n17   // of smaller size.\n18   comboOptions.forEach((currentOption,\
    \ optionIndex) => {\n19     // Get all smaller combinations WITH the current element\
    \ from original set.\n20     const smallerCombos = combineWithRepetitions(\n21\
    \       comboOptions.slice(optionIndex),\n22       comboLength - 1,\n23     );\n\
    24 \n25     // Concatenate current element (option) to all smaller combinations.\n\
    26     smallerCombos.forEach((smallerCombo) => {\n27       combos.push([currentOption].concat(smallerCombo));\n\
    28     });\n29   });\n30 \n31   // Return all combinations.\n32   return combos;\n\
    33 }\n```\n\n20-combinations/combineWithRepetitions.js\n\n### Problems Examples\n\
    \nHere are some related problems that you might encounter during the interview:\n\
    \n*   [Combinations](https://leetcode.com/problems/combinations/)\n\n*   [Combination\
    \ Sum III](https://leetcode.com/problems/combination-sum-iii/)\n\n*   [Combination\
    \ Sum IV](https://leetcode.com/problems/combination-sum-iv/)\n\n### Quiz\n\n*Q1:\
    \ Does the order of the elements matter when forming a combination?*\n\n*Q2: If\
    \ we will need to generate all combinations without repetitions of size `2` from\
    \ the set of size `4`, how many combinations will we have?*\n\n### References"
