    \n## Hash Table\n\n*   *Difficulty: medium*\n\nA **hash table** (or **hash map**)\
    \ is a data structure that implements an *associative array abstract data type*,\
    \ a structure that can *map keys to values*. For example, your *name* (the key)\
    \ may be used as a unique identifier for your *phone number* (the value) in a\
    \ *phone book* (the hash map). The *common operations* for working with your phone\
    \ in a phone book would look like this:\n\n```\n 1 // Import HashTable class.\n\
    \ 2 import { HashTable } from './HashTable';\n 3 \n 4 // Create hash table instance.\n\
    \ 5 const phoneBook = new HashTable();\n 6 \n 7 // Add several contacts to the\
    \ phone book.\n 8 phoneBook.set('John Smith', '+112342345678');\n 9 phoneBook.set('Bill\
    \ Jones', '+111111111111');\n10 \n11 // Now we may access each contact's phone\
