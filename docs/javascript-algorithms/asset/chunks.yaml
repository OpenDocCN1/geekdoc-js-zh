  trans: "\n\n**堆属性**：如果 `P` 是子节点 `C` 的父节点，那么 `P` 的值要么`大于等于`（在**最大堆**中），要么`小于等于`（在**最小堆**中）`C`\
    \ 的键值。\n\n请看下面这个二叉**最小堆**示例。由于 `1` 是堆中最小的数字，它被放置在堆的根节点。根的所有孩子都大于根节点。子节点也是如此：根节点的左孩子比它的子节点小，以此此类推。这棵树本身是一个完全二叉树，因为它所有的层都是满的（除了最后一层是从左到右填充的）。\n\
    \n![](img/07-heap----min-heap.png)\n\n这是一个二叉**最大堆**示例。`100` 是堆中所有数字中最大的，因此它被放在堆的根节点。根的所有孩子都小于根节点。子节点也是如此：根节点的左孩子比它的子节点小，以此此类推。这棵树本身也是完全二叉树，因为它所有的层都是满的（除了最后一层是从左到右填充的）。\n\
    \n![](img/07-heap----max-heap.png)\n\n### 应用\n\n堆的一个直接应用是**堆排序**算法（它是最好的排序方法之一，它是就地的且没有平方级最坏情况的）。二叉堆由\
    \ J. W. J. Williams 于 1964 年引入，是一种专门用于堆排序算法的数据结构。\n\n你可能已经从上面的插图中注意到，堆允许我们快速访问一组值的最小值/最大值。堆的这种属性使其在实现名为**优先级队列**的抽象数据类型时非常高效。在优先级队列中，高优先级的元素会在低优先级元素之前处理。通过在堆中存储元素的优先级，我们能够快速访问队列中下一个最重要的元素。\n\
    \n堆也用于**图算法**，如 `Prim 最小生成树`算法和 `Dijkstra 最短路径`算法。\n\n### 基础操作\n\n以下是通常在堆上执行的基本操作：\n\
    \n*   **Peek**（查看） - 在不提取元素的情况下，返回堆的最小（对于最小堆）或最大（对于最大堆）元素。\n*   **Poll**（弹出） -\
    \ 从堆中提取最小（对于最小堆）或最大（对于最大堆）元素。\n*   **Add**（添加） - 将新元素添加到堆中。\n*   **Remove**（移除）\
    \ - 根据值从堆中移除元素。\n\n在本章后面的部分，我们将介绍这些操作的具体实现，你将看到细节。但值得注意的是，对于修改堆的操作（如 `poll`、`add`\
    \ 或 `remove`），我们首先尝试保持堆的**形状属性**。然后我们尝试修改堆的二叉树结构，使其也满足**堆属性**。因此还有两种常见的堆操作：**向上调整**（heapify\
    \ up）和**向下调整**（heapify down）。这些操作是内部的，不直接使用。这两个操作的唯一目的是在堆修改后保持堆属性。\n\n### 使用示例\n\
    \n在继续实际实现之前，让我们假设我们已经实现了一个 `MinHeap` 类并来使用它。这将帮助我们更好地理解即将实现的每个类方法的含义。\n\n```javascript\n\
    \ 1 // 导入 MinHeap 类。\n 2 import { MinHeap } from './MinHeap';\n 3 \n 4 // 创建最小堆实例。\n\
    \ 5 const minHeap = new MinHeap();\n 6\n 7 minHeap.isEmpty(); // => true\n 8\n\
    \ 9 // 向最小堆添加新元素。\n10 minHeap.add(5);\n11 minHeap.isEmpty(); // => false\n12 minHeap.peek();\
    \ // => 3\n13 minHeap.toString(); // => '5'\n 14 \n15 // 添加更多元素。\n16 minHeap.add(3);\n\
    17 // Peek 操作将始终返回堆的最小元素。\n18 minHeap.peek(); // => 3\n19 minHeap.toString();\
    \ // => '3,5'\n20 \n21 minHeap.add(10);\n22 minHeap.peek(); // => 3\n23 minHeap.toString();\
    \ // => '3,5,10'\n24 \n25 // 从堆中提取最小值。\n26 minHeap.poll(); // => 3\n27 minHeap.peek();\
    \ // => 5\n28 minHeap.toString(); // => '5,10'\n29 \n30 // 从堆中移除元素。\n31 minHeap.remove(10);\n\
    32 minHeap.peek(); // => 5\n33 minHeap.toString(); // => '5'\n```\n\n`07-heap/example.js`\n\
    \n### 实现\n\n#### 使用数组存储堆\n\n我们将构建一个**完全二叉树**作为堆。这意味着它是一个二叉树，除了最后一层外，每一层都是满的，并且所有节点都尽可能靠左对齐。\n\
    \n*堆的元素通常存储在数组中*。任何二叉树都可以存储在数组中，但二叉堆总是完全二叉树。\n\n![](img/07-heap-as-array.png)\n\
    \n将堆保存为数组后，我们可以轻松地找到任何节点的父节点和孩子。对于索引为 `i` 的节点，父节点位于索引 `floor((i - 1) / 2)`，左孩子位于\
    \ `2 * i + 1`，右孩子位于 `2 * i + 2`。\n\n#### 在堆中存储对象\n\n有时需要在堆中存储对象不仅是数字。例如，我们可能希望堆中存储\
    \ `{name: 'Paul', priority: 5}` 和 `{name: 'Jane', priority: 3}` 用户对象，以便下次调用 `poll()`\
    \ 方法时返回优先级更高的用户。为了实现这一点，我们需要提供一种在堆中比较对象的自定义方法。因此我们将实现一个通用的 `Comparator` 工具类，为对象比较提供通用接口。之后我们将使用\
    \ `Comparator` 工具类来实现 `MinHeap` 类。\n\n###### `Comparator` 类\n\n让我们声明这个类。\n\n```javascript\n\
    1 export default class Comparator {\n```\n\nutils/comparator/Comparator.js\n\n\
    ##### `constructor`\n\n`Comparator` 构造函数接受一个比较回调函数作为参数。该函数接受两个值进行比较。如果两个对象相等，返回\
    \ `0`；如果第一个对象小于第二个，返回 `-1`；如果第一个对象大于第二个，返回 `1`。\n\n`Comparator` 类本身并不感知任何比较逻辑。它只是提供一个通用接口（即我们将在下面实现的方法）来工作。\n\
    \n`compareFunction` 是 `Comparator` 构造函数的可选参数。如果未提供 `compareFunction`，我们将回退到 `defaultCompareFunction()`\
    \ 函数。\n\n```javascript\n16   /**\n17    * @param {function(a: *, b: *)} [compareFunction]\
    \ - 可能是自定义的比较函数，比\\\n18    * 比如可以比较自定义对象。\n19    */\n20   constructor(compareFunction)\
    \ {\n21     this.compare = compareFunction || Comparator.defaultCompareFunction;\n\
    22   }\n```\n\nutils/comparator/Comparator.js\n\n##### `defaultCompareFunction()`\n\
    \n"
- fmt: "\nThis is default fallback comparison function that treats two arguments `a`\
    \ and `b` as a string or a number and applies common comparison operators to them\
    \ like `===`, `<` and `>`.\n\n```javascript\n  /**\n   * Default comparison function.\
    \ It just assumes that \"a\" and \"b\" are strings or numbers.\n   * @param {(string|number)}\
    \ a\n   * @param {(string|number)} b\n   * @returns {number}\n   */\n  static\
    \ defaultCompareFunction(a, b) {\n    if (a === b) {\n      return 0;\n    }\n\
    \n    return a < b ? -1 : 1;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n\
    ### `equal()`\n\nThis function checks if two variables are equal.\n\n```javascript\n\
    \  /**\n   * Checks if two variables are equal.\n   * @param {*} a\n   * @param\
    \ {*} b\n   * @return {boolean}\n   */\n  equal(a, b) {\n    return this.compare(a,\
    \ b) === 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `lessThan()`\n\
    \nThis function checks if variable `a` is less than `b`.\n\n```javascript\n  /**\n\
    \   * Checks if variable \"a\" is less than \"b\".\n   * @param {*} a\n   * @param\
    \ {*} b\n   * @return {boolean}\n   */\n  lessThan(a, b) {\n    return this.compare(a,\
    \ b) < 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `greaterThan()`\n\
    \nThis function checks if variable `a` is greater than `b`.\n\n```javascript\n\
    \  /**\n   * Checks if variable \"a\" is greater than \"b\".\n   * @param {*}\
    \ a\n   * @param {*} b\n   * @return {boolean}\n   */\n  greaterThan(a, b) {\n\
    \    return this.compare(a, b) > 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `lessThanOrEqual()`\n\nThis function checks if variable `a` is less than\
    \ or equal to `b`.\n\n```javascript\n  /**\n   * Checks if variable \"a\" is less\
    \ than or equal to \"b\".\n   * @param {*} a\n   * @param {*} b\n   * @return\
    \ {boolean}\n   */\n  lessThanOrEqual(a, b) {\n    return this.lessThan(a, b)\
    \ || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `greaterThanOrEqual()`\n\
    \nThis function checks if variable `a` is greater than or equal to `b`.\n\n```javascript\n\
    \  /**\n   * Checks if variable \"a\" is greater than or equal to \"b\".\n   *\
    \ @param {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n  greaterThanOrEqual(a,\
    \ b) {\n    return this.greaterThan(a, b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### Class `MinHeap`\n\nLet’s move on and implement the `MinHeap` class.\n\n\
    Let’s import dependencies first. We will use `Comparator` instance in class constructor\
    \ in order to allow class consumers to change the way the heap elements are compared\
    \ with each other.\n\n```javascript\n// Import dependencies.\nimport Comparator\
    \ from '../utils/comparator/Comparator';\n```\n\n`4-stack/Stack.js`\n\n### `constructor`\n\
    \nLet’s declare the `MinHeap` class:\n\n```javascript\nexport class MinHeap {\n\
    ```\n\n`4-stack/Stack.js`\n\nIn class constructor we need to create an array that\
    \ will hold all heap data. To improve the performance of `has()` operation we\
    \ also create the `heapElements` map that will hold all heap elements and will\
    \ allow us to check if the element exists in the heap in `O(1)` time.\n\n```javascript\n\
    \  /**\n   * @constructs MinHeap\n   * @param {Function} [comparatorFunction]\n\
    \   */\n  constructor(comparatorFunction) {\n    // Array representation of the\
    \ heap.\n    this.heapContainer = [];\n\n    // A map of heap elements for fast\
    \ lookup.\n    this.heapElements = new Map();\n\n    // Allow class consumers\
    \ to change the way the heap elements are compared with each other.\n    // This\
    \ is particularly useful when we want to save objects in a heap.\n    this.compare\
    \ = new Comparator(comparatorFunction);\n  }\n```\n\n`4-stack/Stack.js`\n\n###\
    \ Helper Methods\n\nBefore we move on and implement main heap operations let’s\
    \ implement several helper methods that will help us traverse the heap.\n\n####\
    \ `getLeftChildIndex`\n\nThis helper method will return the index of the left\
    \ child by the index of the parent. If `i` is the parent index then the formula\
    \ for the left child is `2 * i + 1`.\n\n```javascript\n  /**\n   * @param {number}\
    \ parentIndex\n   * @return {number}\n   */\n  getLeftChildIndex(parentIndex)\
    \ {\n    return (2 * parentIndex) + 1;\n  }\n```\n\n`4-stack/Stack.js`\n\n####\
    \ `getRightChildIndex`\n\nThis helper method will return the index of the right\
    \ child by the index of the parent. If `i` is the parent index then the formula\
    \ for the right child is `2 * i + 2`.\n\n```javascript\n  /**\n   * @param {number}\
    \ parentIndex\n   * @return {number}\n   */\n  getRightChildIndex(parentIndex)\
    \ {\n    return (2 * parentIndex) + 2;\n  }\n```\n\n`4-stack/Stack.js`\n\n####\
    \ `getParentIndex`\n\nThis helper method will return the index of the parent node\
    \ by the index of the child node. If `i` is the child index then the formula for\
    \ the parent index is `floor((i - 1) / 2)`.\n\n```javascript\n  /**\n   * @param\
    \ {number} childIndex\n   * @return {number}\n   */\n  getParentIndex(childIndex)\
    \ {\n    return Math.floor(childIndex - 1) / 2;\n  }\n```\n\n`4-stack/Stack.js`\n\
    \n#### `hasParent`\n\nThis helper method indicates whether the node with index\
    \ `childIndex` has a parent. If the parent index calculate using this formula:\
    \ `floor((i - 1) / 2)` is positive then we return `true`. Otherwise, method returns\
    \ `false` (the current node is the root node).\n\n```javascript\n  /**\n   * @param\
    \ {number} childIndex\n   * @return {boolean}\n   */\n  hasParent(childIndex)\
    \ {\n    return this.getParentIndex(childIndex) >= 0;\n  }\n```\n\n`4-stack/Stack.js`\n\
    \n#### `has`\n\nThis helper method checks if the `item` exists in the heap.\n\n\
    ```javascript\n  /**\n   * @param {*} item\n   * @return {boolean}\n   */\n  has(item)\
    \ {\n    return !!this.heapElements.get(item);\n  }\n```\n\n`4-stack/Stack.js`\n\
    \n#### `hasLeftChild`\n\nThis helper method indicates whether the node with index\
    \ `parentIndex` has a left child. If the child index is greater than the `heapContainer`\
    \ array length the current node doesn’t have a left child.\n\n```javascript\n\
    \  /**\n   * @param {number} parentIndex\n   * @return {boolean}\n   */\n  hasLeftChild(parentIndex)\
    \ {\n    return this.getLeftChildIndex(parentIndex) < this.heapContainer.length;\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n#### `hasRightChild`\n\nThis helper method\
    \ indicates whether the node with index `parentIndex` has a right child. If the\
    \ child index is greater than the `heapContainer` array length it means that current\
    \ node doesn’t have right child.\n\n```javascript\n  /**\n   * @param {number}\
    \ parentIndex\n   * @return {boolean}\n   */\n  hasRightChild(parentIndex) {\n\
    \    return this.getRightChildIndex(parentIndex) < this.heapContainer.length;\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n#### `leftChild`\n\nThis helper method returns\
    \ the left child of the node.\n\n```javascript\n  /**\n   * @param {number} parentIndex\n\
    \   * @return {*}\n   */\n  leftChild(parentIndex) {\n    return this.heapContainer[this.getLeftChildIndex(parentIndex)];\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n#### `rightChild`\n\nThis helper method returns\
    \ the right child of the node.\n\n```javascript\n  /**\n   * @param {number} parentIndex\n\
    \   * @return {*}\n   */\n  rightChild(parentIndex) {\n    return this.heapContainer[this.getRightChildIndex(parentIndex)];\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n#### `parent`\n\nThis helper method returns\
    \ the parent of the child node.\n\n```javascript\n  /**\n   * @param {number}\
    \ childIndex\n   * @return {*}\n   */\n  parent(childIndex) {\n    return this.heapContainer[this.getParentIndex(childIndex)];\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n#### `swap`\n\nThis helper method swaps two\
    \ elements of the `heapContainer` array.\n\n```javascript\n  /**\n   * @param\
    \ {number} indexOne\n   * @param {number} indexTwo\n   */\n  swap(indexOne, indexTwo)\
    \ {\n    const tmp = this.heapContainer[indexTwo];\n    this.heapContainer[indexTwo]\
    \ = this.heapContainer[indexOne];\n    this.heapContainer[indexOne] = tmp;\n \
    \ }\n```\n\n`4-stack/Stack.js`\n\n#### `isEmpty`\n\nThis helper method checks\
    \ if we have at least one element in the `heapContainer` array.\n"
