    \nLet’s start from `Bill` and traverse all users that connected to `Bill` directly\
    \ or via another users. First we will create a graph (analogy of social network).\
    \ Next we will create graph vertices (analogy of registering the users in the\
    \ network). Then we will create graph edges between graph nodes (analogy of adding\
    \ users to friend lists). Then we will traverse all users starting from `Bill`.\n\
    \n```\n 1 // Import dependencies.\n 2 import Graph from '../08-graph/Graph';\n\
    \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
    \ '../08-graph/GraphEdge';\n 5 import { breadthFirstSearch } from './breadthFirstSearch';\n\
    \ 6 \n 7 // Create a demo-version of our overly-simplified social network.\n 8\
    \ const socialNetwork = new Graph();\n 9 \n10 // Let's register several users\
    \ in our network.\n11 const bill = new GraphVertex('Bill');\n12 const alice =\
    \ new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const\
