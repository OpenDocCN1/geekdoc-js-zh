    \ crawling.\n\nBreadth-first search algorithm also serves as a building block\
    \ for other graph related algorithms such as Cheney’s algorithm (copying garbage\
    \ collection), Cuthillâ€“McKee mesh numbering, Fordâ€“Fulkerson method for computing\
    \ the maximum flow in a flow network and others.\n\n### Usage Example\n\nBefore\
    \ implementing the `breadthFirstSearch()` function let’s see how we’re going to\
    \ use it and what parameters we’re going to pass into it. The `breadthFirstSearch()`\
    \ function needs to know what graph to traverse and from starting vertex to begin\
    \ a traversal process. Also we want to pass a callback to the function that will\
    \ be called every time a new vertex is being visited. Having all that in mind\
    \ let’s create really simple social network using `Graph` class from the “Graphs”\
    \ chapter of this book and then let’s traverse it.\n\nHere is a structure of the\
