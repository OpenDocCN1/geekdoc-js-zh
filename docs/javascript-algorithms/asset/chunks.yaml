  trans: "\n\n在我们的 `depthFirstSearch()` 函数内部，让我们实现一个递归的 `depthFirstSearchRecursive()`\
    \ 函数。该函数将包含主要的遍历逻辑。`depthFirstSearchRecursive()` 函数是一个闭包，这意味着它可以访问 `depthFirstSearch()`\
    \ 函数的所有变量和参数。因此，我们只需要向它传递一个参数，该参数是当前正准备遍历的顶点（`currentVertex` 参数）。\n\n`depthFirstSearchRecursive()`\
    \ 的作用仅仅是调用 `enterVertexCallback()` 函数，获取 `currentVertex` 的所有 `unvisited` 邻居，将它们标记为已访问，并对\
    \ `currentVertex` 的每个未访问的邻居再次调用自身。\n\n### 实现示例\n\n```\n 1 /**\n 2  * 以深度优先的方式遍历图。\n\
    \ 3  *\n 4  * @param {Graph} graph - 准备被遍历的图。\n 5  * @param {GraphVertex} startVertex\
    \ - 我们将用作起始点的顶点。\n 6  * @param {function} enterVertexCallback - 在每次访问顶点时调用的回调函数。\\\
    \n 7 tex visit.\n 8  */\n 9 export function depthFirstSearch(graph, startVertex,\
    \ enterVertexCallback) {\n10   // 为了防止重复访问同一个顶点\n11   // 我们需要记住所有已访问的顶点。\n12 \
    \  const visitedVertices = {};\n13 \n14   // 因为我们要先访问 startVertex，所以先将其添加到访问列表。\n\
    15   visitedVertices[startVertex.getKey()] = true;\n16 \n17   /**\n 18    * 深度优先搜索的递归实现。\n\
    \ 19    *\n 20    * @param {GraphVertex} currentVertex - 当前正在遍历的图顶点\\\n 21  rsed.\n\
    \ 22    */\n 23   const depthFirstSearchRecursive = (currentVertex) => {\n 24\
    \     // 调用回调通知订阅者进入了新顶点。\n 25     enterVertexCallback(currentVertex);\n 26 \n\
    \ 27     // 遍历当前访问顶点的每个邻居。\n 28     currentVertex\n 29       .getNeighbors()\n\
    \ 30       .forEach((nextVertex) => {\n 31         // 如果邻居顶点之前未被访问，则访问它。\n 32\
    \         if (!visitedVertices[nextVertex.getKey()]) {\n 33           // 记住当前邻居，以避免以后再次访问。\n\
    \ 34           visitedVertices[nextVertex.getKey()] = true;\n 35           //\
    \ 访问下一个邻居顶点。\n 36           depthFirstSearchRecursive(nextVertex);\n 37      \
    \   }\n 38       });\n 39   };\n 40 \n 41   // 通过调用递归函数开始图遍历。\n 42   depthFirstSearchRecursive(startVertex);\n\
    \ 43 }\n```\n\n`24-graph-depth-first-search/depthFirstSearch.js`\n\n###栈（Stack）的使用\n\
    \n上面提到过深度优先搜索算法可以使用 `Stack` 数据结构来实现。我们可以使用 `Stack` `显式地`（explicitly）或 `隐式地`（implicitly）实现\
    \ DFS 算法。\n\n对于`显式栈的使用`，我们需要从书中的“Stack”章节导入一个 `Stack` 类实现（或任何其他栈的实现，包括普通的 JavaScript\
    \ 数组），并使用栈实例来存储我们要遍历的所有顶点。只要栈不空，我们就从它中 `pop()` 最后添加的顶点，获取该顶点的所有未访问邻居，将它们 `push()`\
    \ 到栈中并重复此过程。显式栈的使用不需要递归，`while` 循环可能是更好的选择。\n\n但在上面的 `depthFirstSearch()` 函数中，我们通过递归`隐式地`使用了栈。虽然我们没有显式地导入\
    \ `Stack` 类，但我们仍然以递归`函数调用栈`的形式在处理栈。每当 `depthFirstSearchRecursive()` 函数调用自身时，JavaScript\
    \ 引擎就会将当前函数的变量（状态）推入内存栈中。\n\n![](img/24-graph-depth-first-search----graph-depth-first-search-stack.png)\n\
    \n### 复杂度\n\n#### 时间复杂度\n\n`depthFirstSearch()` 函数的时间复杂度主要由其内部递归函数 `depthFirstSearchRecursive()`\
    \ 的时间复杂度决定。因为 `depthFirstSearchRecursive()` 之外的所有操作都是常数操作。在 `depthFirstSearchRecursive()`\
    \ 函数内部，我们执行了以下操作：\n\n* 获取当前顶点的所有邻居。为了做到这一点，我们需要遍历连接到当前顶点的所有边。因此，边的数量将影响这一步骤的性能。\n\
    \n* 遍历当前顶点的所有未访问邻居。顶点越多，此步骤需要的迭代就越多。\n\n考虑到所有因素，我们可以得出图的深度优先搜索算法的时间复杂度为 `O(|V|\
    \ + |E|)`，其中 `|V|` 是图中顶点的总数，`|E|` 是图中边的总数。\n\n#### 辅助空间复杂度\n\n在 `depthFirstSearch()`\
    \ 函数的当前实现中，我们使用了递归。每次递归调用都会增加函数调用栈。在最坏的情况下（即图类似于链表），函数 `depthFirstSearchRecursive()`\
    \ 的调用栈将与图中顶点数量 `|V|` 成正比。此外，我们使用 `visitedVertices` map 来跟踪已访问的顶点。该 map 需要存储所有\
    \ `|V|` 个顶点的空间。\n\n考虑到所有因素，我们可以得出辅助空间复杂度为 `O(|V|)`。\n\n### 结论\n\n图的深度优先搜索算法的时间复杂度为\
    \ `O(|V| + |E|)`，其中 `|V|` 是图中顶点的总数，`|E|` 是图中边的总数。辅助空间复杂度为 `O(|V|)`。\n\n"
- fmt: "\nThis algorithm may be implemented using `queue` (see one of the previous\
    \ chapters of this book about the `Queue` data structure). Queue data structure\
    \ will give us desired FIFO (First-In-First-Out) sequence of graph vertex visiting\
    \ so that we would go wide instead of deep. FIFO sequence basically means that\
    \ once we added all neighbors of current vertex to the `Queue` we then will go\
    \ from neighbor to neighbor first and visit the first neighbor, then the second\
    \ neighbor and so on before moving deeper to the next level of neighbors’ children.\
    \ This is the opposite to `Stack`’s LIFO (Last-In-First-Out) approach that we’ve\
    \ used for implementing depth-first traversal where we were visiting the last\
    \ node that has been added to the stack every time. And by doing that we were\
    \ moving not from the neighbor to neighbor but from the parent to child first.\n\
    \nThe idea of using the queue for breadth-first search is the following:\n\n1.\
    \ Pick the starting vertex and put it to the visiting queue.\n2. Fetch next vertex\
    \ from the queue and “visit” it (i.e. call a callback or do some operations over\
    \ the vertex).\n3. Add all `unvisited` neighbors of current vertex to the queue\
    \ to visit them later.\n4. Go to step 2 (repeat this process until the queue is\
    \ empty).\n\n`Hash map` data structure may be used for efficient checking if the\
    \ vertex has been already visited or not. The vertex must have a unique `key`\
    \ value that is used as a key for a hash map.\n\n### Application\n\nBreadth-first\
    \ search algorithm is being used to find a shortest path between to nodes in graph.\
    \ And since the graph can represent real-world data such as roads networks, social\
    \ networks, computer networks there are many BFS algorithm applications may be\
    \ found:\n\n* **GPS Navigation** - to find a shortest path (combination of edges\
    \ in the map graph) from your location (the vertex in the map graph) to specific\
    \ city (another vertex in the map graph).\n* **Computer Networks** - traverse\
    \ Peer-to-Peer (P2P) network by P2P client (i.e. Torrent client) to find the “closest”\
    \ hosts with required file.\n* **Social Networks** - to find people with a given\
    \ distance from other person.\n* **Web Crawlers** - to traverse the content of\
    \ the web-site by following the links from the home-page and then from internal\
    \ pages. By using BFS it is possible to setup a desired depth of web-site crawling.\n\
    \nBreadth-first search algorithm also serves as a building block for other graph\
    \ related algorithms such as Cheney’s algorithm (copying garbage collection),\
    \ Cuthillâ–McKee mesh numbering, Fordâ–Fulkerson method for computing the maximum\
    \ flow in a flow network and others.\n\n### Usage Example\n\nBefore implementing\
    \ the `breadthFirstSearch()` function let’s see how we’re going to use it and\
    \ what parameters we’re going to pass into it. The `breadthFirstSearch()` function\
    \ needs to know what graph to traverse and from starting vertex to begin a traversal\
    \ process. Also we want to pass a callback to the function that will be called\
    \ every time a new vertex is being visited. Having all that in mind let’s create\
    \ really simple social network using `Graph` class from the “Graphs” chapter of\
    \ this book and then let’s traverse it.\n\nHere is a structure of the network\
    \ we’re going to implement.\n\n![](images/25-graph-breadth-first-search----network.png)\n\
    \nLet’s start from `Bill` and traverse all users that connected to `Bill` directly\
    \ or via another users. First we will create a graph (analogy of social network).\
    \ Next we will create graph vertices (analogy of registering the users in the\
    \ network). Then we will create graph edges between graph nodes (analogy of adding\
    \ users to friend lists). Then we will traverse all users starting from `Bill`.\n\
    \n```javascript\n 1 // Import dependencies.\n 2 import Graph from '../08-graph/Graph';\n\
    \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
    \ '../08-graph/GraphEdge';\n 5 import { breadthFirstSearch } from './breadthFirstSearch';\n\
    \ 6 \n 7 // Create a demo-version of our overly-simplified social network.\n 8\
    \ const socialNetwork = new Graph();\n 9 \n10 // Let's register several users\
    \ in our network.\n11 const bill = new GraphVertex('Bill');\n12 const alice =\
    \ new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const\
    \ kate = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n16\
    \ const tom = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n\
    \ 18 \n19 // Now let's establish friendship connections between the users of our\
    \ network.\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill, alice))\n22  \
    \ .addEdge(new GraphEdge(bill, john))\n23   .addEdge(new GraphEdge(bill, kate))\n\
    24   .addEdge(new GraphEdge(alice, ann))\n25   .addEdge(new GraphEdge(ann, sam))\n\
    26   .addEdge(new GraphEdge(john, ann))\n27   .addEdge(new GraphEdge(kate, tom));\n\
    \ 28 \n29 // Now let's traverse the network in breadth-first manner staring from\
    \ Bill\n30 // and add all users we will encounter to the userVisits array.\n31\
    \ const userVisits = [];\n32 breadthFirstSearch(socialNetwork, bill, (user) =>\
    \ {\n33   userVisits.push(user);\n34 });\n35 \n36 // Now let's see in what order\
    \ the users have been traversed.\n37 console.log(userVisits);\n38 // The output\
    \ will be:\n39 [bill, alice, john, kate, ann, tom, sam]\n```\n"
