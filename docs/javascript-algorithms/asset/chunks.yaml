    \ Finally, we check if the value we want to delete exists in the LinkedList. If\
    \ it exists, we use the `LinkedList` delete method and return true. Otherwise,\
    \ we return false indicating there was nothing to delete.\n"
  raw: "> Hash function collisions are the main reason why time complexities for basic\
    \ hash table operations like `read`, `write`, `update` and `delete` may be downgraded\
    \ from `O(1)` to `O(n)`. In the worst case scenario, with a small number of buckets\
    \ and with imperfect hash function all values might be stored in just *one* bucket.\
    \ This will make the hash table act like a linked list.\n\n### Implementation\n\
    \nLet’s take the hash table basic operations that have been mentioned above along\
    \ with separate chaining collision resolution approach and implement the hash\
    \ table using the LinkedList class from the Linked List chapter.\n\nFirst, we’ll\
    \ need to import our Linked List class to be used in our hash table. Each bucket\
    \ in our hash table will have a Linked List as the value where we will place the\
    \ values for each key/value pair.\n\n```\n1 import LinkedList from '../02-linked-list/LinkedList';\n\
    ```\n\nsrc/05-hash-table/HashTable.js\n\nNext, we’ll set our bucket size:\n\n\
    ```\n3 // Buckets number directly affects the number of collisions.\n4 // The\
    \ bigger the bucket number the less collisions we'll get.\n5 // For demonstration\
    \ purposes we set the hash table size to a\n6 // smaller number to show how collisions\
    \ are handled.\n7 const defaultBucketsNumber = 32;\n```\n\nsrc/05-hash-table/HashTable.js\n\
    \n#### `constructor`\n\nLet’s start by creating HashTable class:\n\n```\n9 export\
    \ class HashTable {\n```\n\n4-stack/Stack.js\n\nIn our constructor method, we\
    \ have quite a few functions chained together. Let’s break down what’s going on\
    \ in each piece so we have a better understanding of what is happening.\n\n```\n\
    10   /**\n11    * @param {number} bucketsNumber - Number of buckets that will\
    \ hold hash table dat\\\n12 a.\n13    */\n14   constructor(bucketsNumber = defaultBucketsNumber)\
    \ {\n15     // Create hash table of certain size and fill each bucket with empty\
    \ linked list.\n16     this.buckets = Array(bucketsNumber).fill(null).map(() =>\
    \ new LinkedList());\n17   }\n```\n\nsrc/05-hash-table/HashTable.js\n\nFirst,\
    \ we create a new array and initialize it with the `bucketsNumber` value:\n\n\
    ```\nthis.buckets = new Array(bucketsNumber)\n```\n\nThen, we fill the array with\
    \ `null` values so we can loop over it:\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null)\n\
    ```\n\nFinally we set all of the newly created values in our array to a LinkedList\
    \ object\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null).map(() =>\
    \ new LinkedList());\n```\n\n#### `hash`\n\nThe `hash()` method will convert the\
    \ string `key` to the index of a bucket we need to use to store the value for\
    \ the specified `key`. As it was described above we will use the simple approach\
    \ of calculating the hash based on the sum of ASCII code values of each character\
    \ in a key.\n\n```\n18   /**\n19    * Converts key string to hash number.\n20\
    \    *\n21    * @param {string} key\n22    * @return {number}\n23    */\n24  \
    \ hash(key) {\n25     let hashCode = 0;\n26 \n27     // Let's go through all key\
    \ characters and add their code to hash\n28     for (let characterIndex = 0; characterIndex\
    \ < key.length; characterIndex += 1) {\n29       hashCode += key.charCodeAt(characterIndex);\n\
    30     }\n31 \n32     // Reduce hash number so it would fit buckets table size.\n\
    33     return hashCode % this.buckets.length;\n34   }\n```\n\nsrc/05-hash-table/HashTable.js\n\
    \nFirst we go through all the characters using a `for` loop and calculate their\
    \ sum.\n\n```\nfor (let characterIndex = 0; characterIndex < key.length; characterIndex\
    \ += 1) {\n  hashCode += key.charCodeAt(characterIndex);\n}\n```\n\nNext, we apply\
    \ the modulo operator `%` that will limit the range of hashes we generate to the\
    \ number of available buckets:\n\n```\n// Reduce hash number so it would fit buckets\
    \ table size.\nreturn hashCode % this.buckets.length;\n```\n\nIf our `hashCode`\
    \ value equals 97 and `this.buckets.length` equals 50 the function will return\
    \ `97 % 50 = 47`. We will use the bucket with index 47 to store the value for\
    \ the key ‘ab’.\n\n#### `set`\n\nWe add elements to a hash table based on it’s\
    \ key and value.\n\n```\n36   /**\n37    * ADD or UPDATE the value by its key.\n\
    38    *\n39    * @param {string} key\n40    * @param {*} value\n41    */\n42 \
    \  set(key, value) {\n43     // Calculate bucket index.\n44     const keyHash\
    \ = this.hash(key);\n45     // Fetch linked list for specific bucket index.\n\
    46     const bucketLinkedList = this.buckets[keyHash];\n47     // Perform 'find\
    \ by key' operation in linked list.\n48     const node = bucketLinkedList.find({\
    \ callback: nodeValue => nodeValue.key === ke\\\n49 y });\n50 \n51     // Check\
    \ the value with specified key is already exists in linked list.\n52     if (!node)\
    \ {\n53       // Insert new linked list node.\n54       bucketLinkedList.append({\
    \ key, value });\n55     } else {\n56       // Update value of existing linked\
    \ list node.\n57       node.value.value = value;\n58     }\n59   }\n```\n\nsrc/05-hash-table/HashTable.js\n\
    \nWe start by calculating the hash for the provided key. This hash value will\
    \ point to the specific bucket index.\n\n```\nconst keyHash = this.hash(key);\n\
    ```\n\nNext, we get the linked list that is stored in the bucket we need.\n\n\
    ```\nconst bucketLinkedList = this.buckets[keyHash];\n```\n\nAt this point, we\
    \ need to check whether we already have the value with the specified key in our\
    \ hash table or not. First, we’ll try to find it in our linked list by using the\
    \ key/value pair. We’ll use the LinkedList `find` method with a custom callback.\
    \ This custom callback will compare the key/value pair stored in the LinkedList\
    \ node with the key that we’re trying to use to store the new value.\n\n```\n\
    const node = bucketLinkedList.find({ callback: nodeValue => nodeValue.key ===\
    \ key });\n```\n\nNow we need to decide whether we need to create a new node in\
    \ our LinkedList or update an existing one. If the value we’re trying to set already\
    \ exists in the LinkedList then we need to update it. Otherwise, we need to append\
    \ the new value to the end of the LinkedList.\n\nEach LinkedList node has a `value`\
    \ property which can be any type of data (strings, object, numbers, etc). For\
    \ our hash table, the `value` property for the nodes in our LinkedList will be\
    \ an object that contains the key/value pair. We must save both the `key` and\
    \ the `value` in order to be able to distinguish one node from another. If we\
    \ have two keys that resolve to the same bucket when the hash function is applied\
    \ to them, we need to know which value to retrieve based on the key.\n\n```\n\
    if (!node) {\n  bucketLinkedList.append({ key, value });\n} else {\n  node.value.value\
    \ = value;\n} \n```\n\n#### `get`\n\nGetting a value from the hash table by using\
    \ its key is a similar operation to the `set` method. The only difference is that\
    \ after checking if the value exists in the LinkedList we either return its value\
    \ or `undefined`.\n\n```\n60   /**\n61    * GET the value by its key.s\n62   \
    \ *\n63    * @param {string} key\n64    * @return {*}\n65    */\n66   get(key)\
    \ {\n67     // Calculate bucket index.\n68     const keyHash = this.hash(key);\n\
    69     // Fetch linked list for specific bucket index.\n70     const bucketLinkedList\
    \ = this.buckets[keyHash];\n71     // Perform 'find by key' operation in linked\
    \ list.\n72     const node = bucketLinkedList.find({ callback: nodeValue => nodeValue.key\
    \ === ke\\\n73 y });\n74 \n75     // Check the value with specified key is already\
    \ exists in linked list.\n76     return node ? node.value.value : undefined;\n\
    77   }\n```\n\nsrc/05-hash-table/HashTable.js\n\n#### `delete`\n\nWhen we delete\
    \ a value from our hash table, we use some of the same steps as the `set` method.\
    \ We first calculate the hash for the provided key, then fetch the bucket’s LinkedList.\
    \ Finally, we check if the value we want to delete exists in the LinkedList. If\
    \ it exists, we use the LinkedList delete method and return true. Otherwise, we\
    \ return false indicating there was nothing to delete."
