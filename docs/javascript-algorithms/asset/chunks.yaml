    \ with the appropria\\\n154 te\n155     // child (smallest child for MinHeap,\
    \ largest child for MaxHeap).\n156     // Do the same for next children after\
    \ swap.\n157     let currentIndex = customStartIndex;\n158     let nextIndex =\
    \ null;\n159 \n160     while (this.hasLeftChild(currentIndex)) {\n161       if\
    \ (\n162         this.hasRightChild(currentIndex)\n163         && this.compare.lessThanOrEqual(this.rightChild(currentIndex),\
    \ this.leftChil\\\n164 d(currentIndex))\n165       ) {\n166         nextIndex\
    \ = this.getRightChildIndex(currentIndex);\n167       } else {\n168         nextIndex\
    \ = this.getLeftChildIndex(currentIndex);\n169       }\n170 \n171       if (this.compare.lessThanOrEqual(\n\
    172         this.heapContainer[currentIndex],\n173         this.heapContainer[nextIndex],\n\
    174       )) {\n175         break;\n176       }\n177 \n178       this.swap(currentIndex,\
    \ nextIndex);\n179       currentIndex = nextIndex;\n180     }\n181   }\n```\n\n\
    4-stack/Stack.js\n\n##### Main Heap Methods\n\nNow that we have a bunch of helper\
    \ methods implemented let’s move on and add main methods of the heap.\n\n######\
    \ `peek`\n\nThis method will return the head of the heap without actually removing\
    \ it. It is useful when we just need to check the minimum element of the min-heap.\
    \ The head of the heap is a very first element of the `heapContainer` array.\n\
    \n```\n181   /**\n182    * @return {*}\n183    */\n184   peek() {\n185     //\
    \ Check if heap is not empty.\n186     if (this.heapContainer.length === 0) {\n\
    187       // If heap is empty then there is nothing to peek.\n188       return\
    \ null;\n189     }\n190 \n191     // Return the first element of heap array (the\
    \ head).\n192     return this.heapContainer[0];\n193   }\n```\n\n4-stack/Stack.js\n\
    \n###### `poll`\n\nThis method will remove and return the head of the heap. It\
    \ is useful when we need to fetch the minimum element of the min-heap. The head\
    \ of the heap is a very first element of the `heapContainer` array.\n\nAfter we\
    \ remove the head of the heap we need to move the last element of the `heapContainer`\
    \ to the head. This operation will preserve the *shape property* of the heap (the\
    \ tree of the heap must be a complete binary tree).\n\nAfter moving the last element\
    \ of the heap to its head we’ve preserved the *shape property*. But it is possible\
    \ that now the *heap property* is violated and the head of the min-heap is bigger\
    \ than its children. To fix that we call `heapifyDown()` method that in turn will\
    \ preserve the *heap property*. We will implement it shortly.\n\n![](images/07-heap----poll-from-heap.png)\n\
    \n```\n195   /**\n196    * @return {*}\n197    */\n198   poll() {\n199     if\
    \ (this.heapContainer.length === 0) {\n200       // If heap is empty then there\
    \ is nothing to poll.\n201       return null;\n202     }\n203 \n204     if (this.heapContainer.length\
    \ === 1) {\n205       // If the heap consist of the one element then just extract\
    \ it.\n206       return this.heapContainer.pop();\n207     }\n208 \n209     //\
    \ Remember the value we want to return.\n210     const item = this.heapContainer[0];\n\
    211 \n212     // Move the last element from the end to the head to preserve the\
    \ \"shape propert\\\n213 y\".\n214     this.heapContainer[0] = this.heapContainer.pop();\n\
    215 \n216     // Heapify the heap down in order to preserve the \"heap-property\"\
    .\n217     this.heapifyDown();\n218 \n219     return item;\n220   }\n```\n\n4-stack/Stack.js\n\
    \n###### `add`\n\nThis method adds a new element to the min-heap. In order to\
    \ preserve the shape-property of the heap, the new element is added to the end\
    \ of the `heapContainer` array. After adding the new element, it is possible that\
    \ the newly added element is smaller than its parent. In this case, the heap-property\
    \ is violated. To fix that, we call the `heapifyUp()` method that will lift the\
    \ new element up in a tree structure so the heap-property is satisfied.\n\n![](images/07-heap----add-to-heap.png)"
