    \ a heap:\n\n*   **Peek** - returns the minimum (for min-heap) or maximum (for\
    \ max-heap) element of a heap without extracting it.\n\n*   **Poll** - extracts\
    \ the minimum (for min-heap) or maximum (for max-heap) element out of a heap.\n\
    \n*   **Add** - adds new element to a heap.\n\n*   **Remove** - removes the element\
    \ from the heap by its value.\n\nLater in this chapter we will get to exact implementation\
