  trans: "\n\n该算法可以使用 `queue` 实现（参见本书之前章节关于 `Queue` 数据结构的章节之一）。`Queue` 数据结构将为我们提供期望的\
    \ FIFO（先进先出）图顶点访问顺序，这样我们就会向宽度方向而非深度方向进行扩展。FIFO 顺序基本上意味着，一旦我们将当前顶点的所有邻居添加到 `Queue`\
    \ 中，我们将首先在邻居之间进行移动，先访问第一个邻居，然后是第二个邻居，依此类推，最后移动到下一层邻居的子节点。这与我们实现深度优先遍历时使用的 `Stack`\
    \ 的 LIFO（后进先出）方法相反，在深度优先遍历中，我们每次访问的是栈中添加的最后一个节点。通过这种方式，我们移动的不是从邻居到邻居，而是先从父节点到孩子。\n\
    \n使用队列进行广度优先搜索的想法如下：\n\n1. 选择起始顶点并将其放入访问队列。\n2. 从队列中获取下一个顶点并“访问”它（即调用回调函数或对顶点执行某些操作）。\n\
    3. 将当前顶点的所有 `unvisited` 邻居添加到队列中以便稍后访问。\n4. 回到步骤 2（重复此过程直到队列为空）。\n\n可以使用 `Hash\
    \ map` 数据结构来高效地检查顶点是否已经被访问。顶点必须有一个唯一的 `key` 值，该值用作哈希映射的键。\n\n### 应用\n\n广度优先搜索算法用于寻找图中两个节点之间的最短路径。由于图可以表示现实世界的数据，如道路网络、社交网络、计算机网络，因此找到许多\
    \ BFS 算法的应用：\n\n* **GPS 导航** - 寻找从你的位置（图中的顶点）到特定城市（图中的另一个顶点）的最短路径（地图图中边的组合）。\n\
    * **计算机网络** - 通过 P2P 客户端（即 Torrent 客户端）遍历点对点（P2P）网络，以找到所需文件的“最近”主机。\n* **社交网络**\
    \ - 寻找与他人具有给定距离的人。\n* **网络爬虫** - 通过遵循从首页以及从内部页的链接来遍历网站内容。使用 BFS 可以设置网站爬取所需的特定深度。\n\
    \n广度优先搜索算法还是其他图相关算法的构建模块，例如 Cheney 算法（复制垃圾收集）、Cuthill–McKee 网格编号、用于计算流网络最大流的 Ford–Fulkerson\
    \ 方法等。\n\n### 使用示例\n\n在实现 `breadthFirstSearch()` 函数之前，让我们看看将如何使用它以及将向它传递哪些参数。`breadthFirstSearch()`\
    \ 函数需要知道遍历哪一个图以及从哪个起始顶点开始遍历过程。此外，我们还想向函数传递一个回调，该回调将在每次访问新顶点时被调用。考虑到所有这些，让我们使用本书“图”（Graphs）章节中的\
    \ `Graph` 类创建一个非常简单的社交网络，然后遍历它。\n\n这是我们要实现的网络结构。\n\n![](img/25-graph-breadth-first-search----network.png)\n\
    \n让我们从 `Bill` 开始，遍历所有直接或通过其他用户连接到 `Bill` 的用户。首先我们将创建一个图（社交网络的类比）。接下来，我们将创建图顶点（类比在网络中注册用户）。然后，将在图节点之间创建图边（类比将用户添加到好友列表）。最后，我们将从\
    \ `Bill` 开始遍历所有用户。\n\n```javascript\n 1 // 依赖。\n 2 import Graph from '../08-graph/Graph';\n\
    \ 3 import GraphVertex from '../08-graph/GraphVertex';\n 4 import GraphEdge from\
    \ '../08-graph/GraphEdge';\n 5 import { breadthFirstSearch } from './breadthFirstSearch';\n\
    \ 6 \n 7 // 创建我们过度简化的社交网络的演示版本。\n 8 const socialNetwork = new Graph();\n 9 \n\
    10 // 在我们的网络中注册几个用户。\n11 const bill = new GraphVertex('Bill');\n12 const alice\
    \ = new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n14 const\
    \ kate = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n16\
    \ const tom = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n\
    \ 18 \n19 // 现在让我们网络中的用户之间建立友谊连接。\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill,\
    \ alice))\n 22   .addEdge(new GraphEdge(bill, john))\n 23   .addEdge(new GraphEdge(bill,\
    \ kate))\n 24   .addEdge(new GraphEdge(alice, ann))\n 25   .addEdge(new GraphEdge(ann,\
    \ sam))\n 26   .addEdge(new GraphEdge(john, ann))\n 27   .addEdge(new GraphEdge(kate,\
    \ tom));\n 28 \n29 // 现在让我们从 Bill 开始以广度优先的方式遍历网络\n30 // 并我们将遇到的所有用户添加到 userVisits\
    \ 数组中。\n31 const userVisits = [];\n32 breadthFirstSearch(socialNetwork, bill,\
    \ (user) => {\n33   userVisits.push(user);\n34 });\n35 \n36 // 现在看看用户是以什么顺序被遍历的。\n\
    37 console.log(userVisits);\n38 // 输出将是：\n39 [bill, alice, john, kate, ann, tom,\
    \ sam]\n```\n"
- fmt: "\n```javascript\n/**\n *  Traverse the graph in breadth-first manner.\n *\n\
    \ * @param {Graph} graph - Graph that is going to be traversed.\n * @param {GraphVertex}\
    \ startVertex - Vertex that we will use as a starting point.\n * @param {function}\
    \ enterVertexCallback - Callback that will be called on every vertex visit.\n\
    \ */\nexport function breadthFirstSearch(graph, startVertex, enterVertexCallback)\
    \ {\n  // Init vertex queue. Whenever we will meet a new vertex it will be\n \
    \ // added to the Queue for further exploration.\n  const vertexQueue = new Queue();\n\
    \n  // Add startVertex to the queue since we're going to visit it first.\n  vertexQueue.enqueue(startVertex);\n\
    \n  // In order to prevent the visiting of the same vertex twice\n  // we need\
    \ to memorize all visited vertices.\n  const visitedVertices = {};\n\n  // Since\
    \ we're going to visit startVertex first let's add it to the visited list.\n \
    \ visitedVertices[startVertex.getKey()] = true;\n\n  // Traverse all vertices\
    \ from the queue while it is not empty.\n  while (!vertexQueue.isEmpty()) {\n\
    \    // Get the next vertex from the queue.\n    const currentVertex = vertexQueue.dequeue();\n\
    \n    // Call the callback to notify subscribers about the entering a new vertex.\n\
    \    enterVertexCallback(currentVertex);\n\n    // Add all neighbors to the queue\
    \ for future traversals.\n    currentVertex.getNeighbors().forEach((nextVertex)\
    \ => {\n      if (!visitedVertices[nextVertex.getKey()]) {\n        // Memorize\
    \ current neighbor to avoid visiting it again in the feature.\n        visitedVertices[nextVertex.getKey()]\
    \ = true;\n\n        // Add nextVertex to the queue for further visits.\n    \
    \    vertexQueue.enqueue(nextVertex);\n      }\n    });\n  }\n}\n```\n\n`graph-breadth-first-search/breadthFirstSearch.js`\n\
    \n### Complexities\n\n#### Time Complexity\n\nTime complexity of `breadthFirstSearch()`\
    \ function is mostly defined by the `while` loop since all lines outside of the\
    \ `while` loop perform in `O(1)` time. Remember that by using `visitedVertices`\
    \ hash map we’re preventing the same vertex to be added to the `vertexQueue` more\
    \ than once. Thus we may assume that we will enter the `while` loop exactly `|V|`\
    \ times, where `|V|` is a number of connected vertices in the graph that we’re\
    \ traversing. We also need to take into account the fact that we’re iterating\
    \ over every vertex edge to fetch vertex neighbors by calling `currentVertex.getNeighbors()`.\
    \ So our function will also visit all `|E|` number of graph edges. The last thing\
    \ we need to mention here is that inside the `while` loop we have Queue related\
    \ `enqueue()` and `dequeue()` operations that are being performed in `O(1)` time\
    \ since we’re dealing with linked-list based implementation of the `Queue` (for\
    \ more details please take a look the chapter on Queue data structure).\n\nHaving\
    \ all that in mind we may conclude that time complexity of `breadthFirstSearch()`\
    \ function is `O(|V| + |E|`, where `|E|` is a number of graph edges and `|V|`\
    \ is a number of vertices in the graph.\n\n#### Auxiliary Space Complexity\n\n\
    In current implementation of the `breadthFirstSearch()` function we use the following\
    \ additional variables:\n\n* `vertexQueue` queue - keeps all `|V|` number of graph\
    \ vertices,\n* `visitedVertices` hash map - keeps all `|V|` number of graph vertex\
    \ keys,\n* `currentVertex` variable - keeps only one current vertex instance.\n\
    \nSince `vertexQueue` and `visitedVertices` variables are the most space consuming\
    \ ones we may conclude that auxiliary space complexity of the `breadthFirstSearch()`\
    \ function is `O(|V|)`, where `|V|` is a number of vertices in the graph.\n\n\
    ### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n* [Clone Graph](https://leetcode.com/problems/clone-graph/)\n\
    * [Is Graph Bipartite?](https://leetcode.com/problems/is-graph-bipartite/)\n*\
    \ [Surrounded Regions](https://leetcode.com/problems/surrounded-regions/)\n\n\
    ### Quiz\n\n* *Q1: What is time complexity of the breadth-first search algorithm\
    \ for graphs?*\n* *Q2: What data-structure fits best for implementing breadth-first\
    \ search algorithm for graphs: Stack or Queue?*\n\n### References\n\nBreadth-first\
    \ search (BFS) on Wikipedia [https://en.wikipedia.org/wiki/Breadth-first_search](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
    \nBreadth-first search visualization [https://www.cs.usfca.edu/~galles/visualization/BFS.html](https://www.cs.usfca.edu/~galles/visualization/BFS.html)\n\
    \nGraph BFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search)\n\
    \n## Dijkstra’s Algorithm\n\n* *Difficulty: hard*\n\n### The Task\n\n*Given a\
    \ graph and a source vertex, find shortest paths from source.*\n\n**Example**\n\
    \nA good example of a graph is a map with cities (vertices) and roads that connect\
    \ them (edges). If graph is directed it means the roads are one way. If the graph\
    \ is undirected then roads are two way. Also a graph may be weighted.\n\n### The\
    \ Algorithm\n\n#### Algorithm Definition\n\n**Dijkstra’s algorithm** is an algorithm\
    \ for finding the shortest paths between nodes in a graph, which may represent,\
    \ for example, road networks. It was conceived by computer scientist Edsger W.\
    \ Dijkstra in 1956.\n\nDijkstra’s original variant found the shortest path between\
    \ two nodes, but a more common variant finds shortest paths from source to all\
    \ nodes.\n\n#### Algorithm Steps\n\nThe algorithm has the following steps:\n\n\
    1. Assign all vertices a **tentative distance** value: set it to `0` for our start\
    \ vertex (since we’ve already reached it) and `Infinity` for all other vertices\
    \ (since at this point they seem unreachable to us).\n2. Create a **set of visited\
    \ vertices**. We will use it to avoid endless loops while traversing the vertices.\n\
    3. Create a **vertex visiting queue** and put the starting vertex to this queue.\
    \ We will use priority queue with distance to the vertex as priority factor (priority\
    \ is explained in one of the previous chapters). The shorter the vertex distance\
    \ to the starting vertex the higher its priority.\n4. **Poll the next closest\
    \ vertex** from the queue (the vertex with smaller distance from the source).\
    \ Priority queue will allow us to do it.\n5. **Go through every unvisited neighbor**\
    \ of the current vertex. For each neighbor calculate `distanceToTheCurrentVertex\
    \ + distanceFromCurrentVertexToNeighbor`. If this distance is less than neighbor’s\
    \ tentative distance then replace it with this new value.\n6. When we’re done\
    \ considering all the neighbors of the current vertex, **mark current vertex as\
    \ visited**.\n7. **Go to step 4** and repeat it until the vertex visiting queue\
    \ is empty.\n\n#### Priority Queue Usage in the Algorithm\n\nIn Dijkstra’s algorithm\
    \ every time we poll the next vertex to visit (step 4) it must be a node that\
    \ was not visited before that *has the shortest distance to the starting vertex*.\n\
    \nBut how can we do this type of polling based on distance?\n"
