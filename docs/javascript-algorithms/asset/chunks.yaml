    \ operator (`**`) introduced in EcmaScript 2017 instead of Math.pow().\n\n```\n\
    21   // Calculate fibonacci number using Binet's formula.\n22   return Math.floor((phi\
    \ ** position) / sqrt5 + 0.5);\n```\n\n11-fibonacci/fibonacciNthClosedForm.js\n\
    \n### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n*   [Length of Longest Fibonacci Sequence](https://leetcode.com/problems/length-of-longest-fibonacci-subsequence/)\n\
    \n*   [Split Array into Fibonacci Sequence](https://leetcode.com/problems/split-array-into-fibonacci-sequence/)\n\
    \n### References\n\nFibonacci sequence on Wikipedia [https://en.wikipedia.org/wiki/Fibonacci_number](https://en.wikipedia.org/wiki/Fibonacci_number)\n\
    \nFibonacci sequence on YouTube [https://www.youtube.com/watch?v=T8xgfVzef_E](https://www.youtube.com/watch?v=T8xgfVzef_E)\n\
    \nFibonacci sequence implementation examples and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/fibonacci](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/fibonacci)\n\
    \n## Primality Test\n\n*   *Difficulty: easy*\n\nA **prime number** (or a **prime**)\
    \ is a natural number greater than `1` that cannot be formed by multiplying two\
    \ smaller natural numbers.\n\n> A natural number is any number greater than or\
    \ equal to 0 that is not a fraction or a decimal\n\nA natural number greater than\
    \ `1` that is not prime is called a composite number. For example, `5` is prime\
    \ because the only ways of writing it as a product, `1 Ã— 5` or `5 Ã— 1`, involve\
    \ `5` itself. However, `6` is a composite number because it is the product of\
    \ two numbers `(2 Ã— 3)` that are both smaller than `6`.\n\n![](images/12-primality-test----primality_test.png)\n\
    \nA **primality test** is an algorithm for determining whether an input number\
    \ is prime.\n\n### Applications\n\nAmong other fields of mathematics, primality\
    \ tests are used in cryptography.\n\n### Code\n\nTo determine if a number is a\
    \ prime or not, we’ll be using the modulo operator, also known as the remainder\
    \ operator. This operator calculates the remainder of two numbers when they are\
    \ divided.\n\nFirst, we start out by ensuring the number is not a fraction or\
    \ decimal by using the modulo operator. If the remainder of the number divided\
    \ by 1 is not 0, we know we have a fraction or decimal and it’s not a prime.\n\
    \n```\n5 export default function trialDivision(number) {\n6   // Prime numbers\
    \ can only be integers\n7   if (number % 1 !== 0) {\n8     return false;\n```\n\
    \n12-primality-test/trialDivision.js\n\nNext, we check if the number is less than\
    \ 1, if it is, it’s not a prime number\n\n```\n11   if (number <= 1) {\n12   \
    \  // Any number less than or equal to 1 is not a prime\n13     return false;\n\
    14   }\n```\n\n12-primality-test/trialDivision.js\n\nIf the number is less than\
    \ or equal to 3, then the number is a prime number (2 & 3 are prime numbers)\n\
    \n```\n16   if (number <= 3) {\n17     // 2 and 3 are prime numbers\n18     return\
    \ true;\n19   }\n```\n\n12-primality-test/trialDivision.js\n\nIf the number is\
    \ divisible by 2, then it is an even number and there are no even prime numbers\
    \ (they all can be divided by 2)\n\n```\n21   // If the number is divisble by\
    \ 2, then it is not a prime number\n22   if (number % 2 === 0) {\n23     return\
    \ false;\n24   }\n```\n\n12-primality-test/trialDivision.js\n\nFinally, if we’ve\
    \ made it this far in the code, we can actually do some calculations:\n\nWe calculate\
    \ the square root of the number we are testing and determine if any numbers up\
    \ to the square root of the number are divisible. If any of the numbers divided\
    \ by the number we are checking result in a remainder of 0, we know it is not\
    \ a prime number.\n\n```\n26   // If there is no dividers up to square root of\
    \ n then there is no higher dividers\\\n27  as well.\n28   const dividerLimit\
    \ = Math.sqrt(number);\n29   for (let divider = 3; divider <= dividerLimit; divider\
    \ += 2) {\n30     if (number % divider === 0) {\n31       return false;\n32  \
    \   }\n33   }\n34 \n35   return true;\n```\n\n12-primality-test/trialDivision.js\n\
    \n#### Why do we use the square root of the number?\n\nWe use the square root\
    \ of the number because any number greater than the square root of a number will\
    \ have a corresponding number smaller than the square root that will be used to\
    \ calculate the number.\n\nFor example, the square root of 36 is 6.\n\n1 * 36\
    \ = 36 2 * 18 = 36 3 * 12 = 36 4 * 9 = 36 5 * 7.2 = 36 6 * 6 = 36 7 * 5.15 = 36\
    \ <– The second operand is less than the square root of 36; we don’t need to check\
    \ numbers higher than the square root.\n\n### Problems Examples\n\nHere are some\
    \ related problems that you might encounter during the interview:\n\n*   [Prime\
    \ Palindrome](https://leetcode.com/problems/prime-palindrome/)\n\n*   [Count Primes](https://leetcode.com/problems/count-primes/)\n\
    \n### Quiz\n\n*Q1: Is 32 a prime number? Follow the logic from the code above\
    \ and find out*\n\n*Q2: Is 31 a prime number? Follow the logic from the code above\
    \ and find out*\n\n### References\n\nPrime numbers on Wikipedia [https://en.wikipedia.org/wiki/Prime_number](https://en.wikipedia.org/wiki/Prime_number)\n\
    \nPrimality test on Wikipedia [https://en.wikipedia.org/wiki/Primality_test](https://en.wikipedia.org/wiki/Primality_test)"
