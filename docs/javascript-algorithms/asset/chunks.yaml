  trans: "\n`~6` 的结果是 `-7`。为什么？当你使用 `NOT` 运算符来翻转所有位时，返回的数字是补码格式的有符号数。\n\n## 什么是补码？\n\
    \n补码是二进制数的一种格式，它是有符号数的略微修改版本。最高位（most significant bit）仍用于判断数字是正数还是负数，0 为正，1 为负。要计算补码格式下负数的值，需要反反所有位并加\
    \ 1。对于有符号数，使用补码格式的优势在于不存在“双零”问题，正如下表所示：\n\n| 十十进制 | 有符号数 | 补码 |\n| --- | --- |\
    \ --- |\n| +7 | 0111 | 0111 |\n| +6 | 0110 | 0110 |\n| +5 | 0101 | 0101 |\n| +4\
    \ | 0100 | 0100 |\n| +3 | 0011 | 0011 |\n| +2 | 0010 | 0010 |\n| +1 | 0001 | 0001\
    \ |\n| +0 | 0000 | 0000 |\n| -0 | 1000 | - |\n| -1 | 1001 | 1111 |\n| -2 | 1010\
    \ | 1110 |\n| -3 | 1011 | 1101 |\n| -4 | 1100 | 1100 |\n| -5 | 1101 | 1011 |\n\
    | -6 | 1110 | 1010 |\n| -7 | 1111 | 1001 |\n\n> 在 Java 中，位运算符与整数一起工作。JavaScript\
    \ 没有整数。它只有双精度浮点数。因此，位运算符会将数字操作数转换为整数，执行操作，然后将其转换回来。在大多数语言中，这些运算符非常接近硬件且速度非常快。在\
    \ JavaScript 中，它们离硬件非常远且速度非常慢。JavaScript 很少用于位操作。 - Douglas Crockford, Javascript:\
    \ The Good Parts\n\n尽管在实践中 JavaScript 并不是执行位操作的最理想编程语言，但它仍然是一个重要的概念。接下来的部分解释了所有类型的位操作以及它们在\
    \ JavaScript 中是如何实现的。为了简单起见，我们没有使用 64 位二进制数，而是使用 6 位数来解释不同的位操作。所有的位操作在向左右移动位时都使用从零开始的索引。\n\
    \n## Code\n\n### 获取位 (Get Bit)\n\n要从二进制数获取相关的位，我们首先想将相关位移动到第零位，然后使用 `&` 运算判断该位是\
    \ 1 还是 0。\n\n例如，数字 5 的二进制形式如下：\n\n`000101`\n\n如果我们想找到第二个位置位的值，首先将该位向右移动 2 位，如下：\n\
    \n移动 1 –> `000010` 移动 2 –> `000001`\n\n一旦我们将位移动了正确的位数，就使用 `&`（与门）运算来判断该位是 1 还是\
    \ 0。记住，当使用 `&` 运算时，只有当两个数字都是 1 时，运算结果才会返回 1。在这种情况下，当我们用数字 5 和 2 调用 `getBit` 函数时：\n\
    \n`let result = getBit(5,2)`\n\n`result` 等于 1。\n\n```javascript\n/**\n * @param\
    \ {number} number\n * @param {number} bitPosition - 从零开始。\n * @return {number}\n\
    \ */\nexport default function getBit(number, bitPosition) {\n  return (number\
    \ >> bitPosition) & 1;\n}\n```\n\n`09-bit-manipulation/getBit.js`\n\n### 设置位 (Set\
    \ Bit)\n\n要在二进制数中设置某位，我们必须先将数字 1 移动到正确的位置，然后将其与该数字进行 OR（或）运算。\n\n要设置数字 5 的第 3\
    \ 位，我们首先取数字 1，并将第 0 数字移动 3 次，如下：\n\n`000001` <– 1 的初始二进制表示 `000010` <– 移动 1 `000100`\
    \ <– 移动 2 `001000` <– 移动 3\n\n然后我们与数字 5 执行 `|`（或）运算来设置该数字。\n\n`000101` | `001000`\
    \ = `001101`\n\n```javascript\n/**\n * @param {number} number\n * @param {number}\
    \ bitPosition - 从零开始。\n * @return {number}\n */\nexport default function setBit(number,\
    \ bitPosition) {\n  return number | (1 << bitPosition);\n}\n```\n\n`09-bit-manipulation/setBit.js`\n\
    \n### 清除位 (Clear Bit)\n\n要清除特定位置的位，我们首先使用数字 1 创建一个掩码，然后对掩码进行 NOT（取反）操作并与数字进行 AND（与）运算。\n\
    \n例如，如果我们想清除数字 5 的第二个位置位，我们首先取数字 1 并将其位移动到第二个位置：\n\n`000001` <– 1 的初始二进制表示 `000010`\
    \ <– 移动 1 `000100` <– 移动 2\n\n然后我们对该数字使用 `~`（NOT）运算，得到如下结果：\n\n`11101`\n\n最后，我们与数字使用\
    \ `&` 运算来清除位：\n\n`000101` & `11101` = `000001`\n\n```javascript\n/**\n * @param\
    \ {number} number\n * @param {number} bitPosition - 从零开始。\n * @return {number}\n\
    \ */\nexport default function clearBit(number, bitPosition) {\n  const mask =\
    \ ~(1 << bitPosition);\n  return number & mask;\n}\n```\n\n`09-bit-manipulation/clearBit.js`\n\
    \n### 更新位 (Update Bit)\n\n该方法是 `clearBit` 和 `setBit` 方法的结合。\n\n```javascript\n\
    /**\n * @param {number} number\n * @param {number} bitPosition - 从零开始。\n * @param\
    \ {number} bitValue - 0 或 1。\n * @return {number}\n */\nexport default function\
    \ updateBit(number, bitPosition, bitValue) {\n  // 归一化值。\n  const bitValueNormalized\
    \ = bitValue ? 1 : 0;\n  // 掩码。\n  const clearMask = ~(1 << bitPosition);\n  //\
    \ 清除位并设置值。\n  return (number & clearMask) | (bitValueNormalized << bitPosition);\n\
    }\n```\n\n`09-bit-manipulation/updateBit.js`\n\n### 是否为偶数 (isEven)\n\n该方法判断提供的数字是否为偶数。对于奇数，右侧数字（最低位）为\
    \ 1，对于偶数，最低位为 0。\n\n```\nNumber: 5 = 000101\nisEven: false\n\nNumber: 4 = 000100\n\
    isEven: true\n```\n\n通过与 1 执行位 `AND` 运算，我们可以判断一个数字是偶数还是奇数。\n\n`000101` & `000001`\
    \ === `000001` (奇数) `000100` & `000001` === `000000` (偶数)\n\n```javascript\n/**\n\
    \ * @param {number} number\n * @return {boolean}\n */\nexport default function\
    \ isEven(number) {\n  return (number & 1) === 0;\n}\n```\n\n`09-bit-manipulation/isEven.js`\n\
    \n### 是否为正数 (isPositive)\n\n该方法判断数字是否为正。如果最高位（最左位）为 0，则函数返回 true。如果最高位为 1，则数字为负，函数返回\
    \ false。\n\n```\nNumber: 1 = 000001\nisPositive: true\n\nNumber: -1 = 100001\n\
    isPositive: false\n```\n\n为了获取最高位，我们将最左位移动 31 次，然后与 1 进行 AND 运算以判断它是 1 还是 0。\n\
    \n移动 1 –> `10000000000000000000000000000001` 移动 2 –> `01000000000000000000000000000000`\
    \ …. 移动 31 –> `00000000000000000000000000000001`\n\n`00000000000000000000000000000001`\
    \ & `000001` = `000001` <– 正数\n\n```javascript\n/**\n * @param {number} number\
    \ - 32 位整数。\n * @return {boolean}\n */\nexport default function isPositive(number)\
    \ {\n  // 0 既不是正数不是负数。\n  if (number === 0) {\n    return false;\n  }\n  // 最高第\
    \ 32 位可用于判断数字是否为正。\n  return ((number >> 31) & 1) === 0;\n}\n```\n\n`09-bit-manipulation/isPositive.js`\n\
    \n### 乘以二 (Multiply By Two)\n\n该方法将原始数字向左移动一位。通过将所有位向左移动，可以将数字乘以二。\n\n`000101`\
    \ <– 5 的初始二进制表示 `001010` <– 移动 1\n\n`001010` = 10\n\n```javascript\n/**\n * @param\
    \ {number} number\n * @return {number}\n */\nexport default function multiplyByTwo(number)\
    \ {\n  return number << 1;\n}\n```\n\n`09-bit-manipulation/multiplyByTwo.js`\n\
    \n### 除以二 (Divide By Two)\n\n要将二进制数除以二，我们将原始数字向右移动一位。通过将所有位向右移动，可以将该数字除以 2。\n\n\
    5 的初始二进制表示 –> `000101` 移动 1 –> `000010`\n\n`000010` = 2\n\n"
- fmt: "\n```javascript\n/**\n * @param {number} number\n * @return {number}\n */\n\
    export default function divideByTwo(number) {\n  return number >> 1;\n}\n```\n\
    \n`09-bit-manipulation/divideByTwo.js`\n\n### Switch Sign\n\nThis method switches\
    \ positive numbers to negative and negative numbers to positive. To do so it uses\
    \ the “Twos Complement” approach by inverting all of the bits of the number and\
    \ adding 1 to it.\n\n```\n1101 -3\n1110 -2\n1111 -1\n0000  0\n0001  1\n0010  2\n\
    0011  3\n```\n\nSwitching 5 to -5:\n\n`000101` = 5\n\nInvert bits:\n\n`111010`\n\
    \nAdd 1:\n\n`111011`\n\nAnd then switching -5 back to 5:\n\n`111011` = -5\n\n\
    Invert bits:\n\n`000100`\n\nAdd 1:\n\n`000101`\n\n```javascript\n/**\n * Switch\
    \ the sign of the number using \"Twos Complement\" approach.\n * @param {number}\
    \ number\n * @return {number}\n */\nexport default function switchSign(number)\
    \ {\n  return ~number + 1;\n}\n```\n\n`09-bit-manipulation/switchSign.js`\n\n\
    ### Multiply Two Signed Numbers\n\nThis method multiplies two signed integer numbers\
    \ using bitwise operators. This method is based on the following facts:\n\n```\n\
    a * b can be written in the below formats:\n  0                     if a is zero\
    \ or b is zero or both a and b are zeroes\n  2a * (b/2)            if b is even\n\
    \  2a * (b - 1)/2 + a    if b is odd and positive\n  2a * (b + 1)/2 - a    if\
    \ b is odd and negative\n```\n\nThe advantage of this approach is that in each\
    \ recursive step one of the operands reduces to half its original value. Hence,\
    \ the run time complexity is `O(log(b))` where `b` is the operand that reduces\
    \ to half on each recursive step.\n\n```javascript\nimport multiplyByTwo from\
    \ './multiplyByTwo';\nimport divideByTwo from './divideByTwo';\nimport isEven\
    \ from './isEven';\nimport isPositive from './isPositive';\n\n/**\n * Multiply\
    \ two signed numbers using bitwise operations.\n *\n * If a is zero or b is zero\
    \ or if both a and b are zeros:\n * multiply(a, b) = 0\n *\n * If b is even:\n\
    \ * multiply(a, b) = multiply(2a, b/2)\n *\n * If b is odd and b is positive:\n\
    \ * multiply(a, b) = multiply(2a, (b-1)/2) + a\n *\n * If b is odd and b is negative:\n\
    \ * multiply(a, b) = multiply(2a, (b+1)/2) - a\n *\n * Time complexity: O(log\
    \ b)\n *\n * @param {number} a\n * @param {number} b\n * @return {number}\n */\n\
    export default function multiply(a, b) {\n  // If a is zero or b is zero or if\
    \ both a and b are zeros then the production is also zero.\n  if (b === 0 || a\
    \ === 0) {\n    return 0;\n  }\n\n  // Otherwise we will have four different cases\
    \ that are described above.\n  const multiplyByOddPositive = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b - 1)) + a;\n  const multiplyByOddNegative = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b + 1)) - a;\n\n  const multiplyByEven = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b));\n  const multiplyByOdd = () => (isPositive(b) ? multiplyByOddPositive()\
    \ : multiplyByOddNegative());\n\n  return isEven(b) ? multiplyByEven() : multiplyByOdd();\n\
    }\n```\n\n`09-bit-manipulation/multiply.js`\n\n### Multiply Two Unsigned Numbers\n\
    \nThis method multiplies two integer numbers using bitwise operators. This method\
    \ is based on that “Every number can be denoted as the sum of powers of 2”.\n\n\
    The main idea of bitwise multiplication is that every number may be split to the\
    \ sum of powers of two:\n\n```\n19 = 2^4 + 2^1 + 2^0\n```\n\nThen multiplying\
    \ number `x` by `19` is equivalent of:\n\n```\nx * 19 = x * 2^4 + x * 2^1 + x\
    \ * 2^0\n```\n\nNow we need to remember that `x * 2^4` is equivalent of shifting\
    \ `x` left by `4` bits.\n\n```javascript\n/**\n * Multiply unsigned numbers using\
    \ bitwise operator.\n * The main idea of bitwise multiplication is that every\
    \ number may be split\n to the sum of powers of two:\n * 19 = 2^4 + 2^1 + 2^0\n\
    \ * Then multiplying number x by 19 is equivalent of:\n * x * 19 = x * 2^4 + x\
    \ * 2^1 + x * 2^0\n * Now we need to remember that (x * 2^4) is equivalent of\
    \ shifting x by 4 bits (x << 4).\n * @param {number} number1\n * @param {number}\
    \ number2\n * @return {number}\n */\nexport default function multiplyUnsigned(number1,\
    \ number2) {\n  let result = 0;\n  // Let number2 as multiplier for number1.\n\
    \  let multiplier = number2;\n  // Multiplier current bit.\n  let bitIndex = 0;\n\
    \  // Go through all bits of number2.\n  while (multiplier !== 0) {\n    // Check\
    \ if current multiplier bit is set.\n    if (multiplier & 1) {\n      // In case\
    \ multiplier's bit at bitIndex is set\n      // it would mean we need to multiply\
    \ number1 by the power of bitIndex and add it to the result.\n      result +=\
    \ (number1 << bitIndex);\n    }\n    bitIndex += 1;\n    multiplier >>= 1;\n \
    \ }\n  return result;\n}\n```\n\n`09-bit-manipulation/multiplyUnsigned.js`\n\n\
    ### Count Set Bits\n\nThis method counts the number of set bits (bits that are\
    \ 1) in a number using bitwise operators. While the number is still greater than\
    \ 0, we shift the number right one bit at a time and `AND` the number with 1 to\
    \ determine if the bit is set.\n\nInitial binary representation of 5 -> `000101`\
    \ Set bit count: 1 shift 1 -> `000010` Set bit count:1 shift 2 -> `000001` Set\
    \ bit count:2 shift 3 -> `000000` Set bit count:2\n\nNumber is now 0, terminate\
    \ while loop. Set bit count is 2.\n\n```javascript\n/**\n * @param {number} originalNumber\n\
    \ * @return {number}\n */\nexport default function countSetBits(originalNumber)\
    \ {\n  let setBitsCount = 0;\n  let number = originalNumber;\n  while (number)\
    \ {\n    // Add last bit of the number to the sum of set bits.\n    setBitsCount\
    \ += number & 1;\n\n    // Shift number right by one bit to investigate other\
    \ bits.\n    number >>= 1;\n  }\n  return setBitsCount;\n}\n```\n\n`09-bit-manipulation/countSetBits.js`\n\
    \n### Count the Bit Difference\n\nThis methods determines the number of bits that\
    \ are different between two numbers. By using the `XOR` operation, we can determine\
    \ the number of bits that are different between the two numbers, and then use\
    \ the `countBit` function to get a total number.\n\n```\n000101 ^ 000001 = 000100\n\
    Count of Bits to be Flipped: 1\n```\n\n```javascript\nimport countSetBits from\
    \ './countSetBits';\n\n/**\n * Counts the number of bits that need to be change\
    \ in order\n * to convert numberA to numberB.\n *\n * @param {number} numberA\n\
    \ * @param {number} numberB\n * @return {number}\n */\nexport default function\
    \ bitsDiff(numberA, numberB) {\n  return countSetBits(numberA ^ numberB);\n}\n\
    ```\n\n`09-bit-manipulation/bitsDiff.js`\n\n### Count the Number of Significant\
    \ Bits of a Number\n\nTo calculate the number of valuable bits we need to shift\
    \ `1` one bit left each time and see if the shifted number is bigger than the\
    \ input number.\n\n5 = `000101` Initial binary represenation of 1 -> `000001`\
    \ Bit count: 0 `000010` <– shift 1, 2 < 5 `000100` <– shift 2, 4 < 5 `001000`\
    \ <– shift 3, 8 > 5\n\nCount of valuable bits is: 3 When we shift 1 four times\
    \ it is bigger than 5.\n\n```javascript\n/**\n * Return the number of bits used\
    \ in the binary representation of the number.\n * @param {number} number\n * @return\
    \ {number}\n */\nexport default function bitLength(number) {\n  let bitsCounter\
    \ = 0;\n  while ((1 << bitsCounter) <= number) {\n    bitsCounter += 1;\n  }\n\
    \  return bitsCounter;\n}\n```\n"
