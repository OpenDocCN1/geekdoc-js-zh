  trans: "\n\n$2^x = n \\implies x = \\log(n)$\n\n这里的 `x` 是我们的时间复杂度。\n\n> 为了理解 `O(log(n))`\
    \ 时间复杂度对于二分查找是有多高效，让我们将其与线性查找的 `O(n)` 时间复杂度进行比较。Tycho-2 星表包含了关于我们银系中最明亮的 `2,539,913`\
    \ 颗恒星的信息。假设我们想在该星表中通过名称查找某颗恒星。在线性查找的最坏情况下，我们需要进行 `2,539,913` 次迭代。在二分查找的最坏情况下，如果所有恒星都按名称排序，只需要\
    \ `22` 次迭代（`log_2(2539913) = 21.27`）。\n\n## 空间复杂度\n\n该算法可以通过不同的方式实现，使用迭代方法或递归方法（为每个递归调用分配额外的内存）。取决于实现方式，空间复杂度可能会不同。在本章中，我们将使用简单的迭代方法，而不创建数组副本。因此，在这种情况下，空间复杂度将是\
    \ `O(1)`。\n\n## 应用\n\n*   二分查找用于在有序数组中进行`快速搜索操作`。\n\n*   二分查找法用于 `二分搜索树` 的实现。\n\
    \n*   二分查找法可以用于在提交历史中快速`找到 bug commit`。只需将提交历史一分为两半。如果 bug 已经存在于“中间”提交，则向左移动到更早的提交并再次平分左半。否则，如果\
    \ bug 不存在则向右移动到较后的提交。\n\n*   二分查找法可以用于在程序中快速`找到错误的代码行`。只需注释掉一半的代码并查看 bug 是否仍然存在。如果存在，则向上移动，否则向下移动。\n\
    \n## 使用示例\n\n在本章较早之前，我们讨论了如果 Tycho-2 星表按名称排序，通过名称在星表中查找恒星会有有多快。与其线性 `2,539,913`\
    \ 次迭代相比，它只需为我们提供 `22` 次迭代（`22` 次）就能找到那颗恒星。\n\n假设我们已经在脚本中有了这个排好序的恒星星表，看看我们将如何对其应用二分查找。\n\
    \n```\n 1 导入依赖。\n 2 import binarySearch from './binarySearch';\n 3 \n 4 // 让我们为我们的有序恒星表创建一个非常简单且小的演示版本。\n\
    \ 5 const sortedArrayOfStars = [\n 6   { name: 'Alpha Centauri A', position: {}\
    \ },\n 7   { name: 'Alpha Centauri B', position: {} },\n 8   { name: 'Betelgeuse',\
    \ position: {} },\n 9   { name: 'Polaris', position: {} },\n10   { name: 'Rigel',\
    \ position: {} },\n11   { name: 'Sirius', position: {} },\n12   // 这里还有额外的 250\
    \ 万条记录 :)\n13 ];\n14 \n15 // 我们用于二分查找函数的自定义对象比较器。\n16 // 我们在这里使用字符串比较。例如，'Polaris'\
    \ 比 'Rigel' 小。\n17 const comparator = (star1, star2) => {\n18   if (star1.name\
    \ === star2.name) return 0;\n19   return star1.name < star2.name ? -1 : 1;\n20\
    \ };\n21 \n22 // 现在让我们搜索恒星。\n23 binarySearch(sortedArrayOfStars, { name: 'Not\
    \ Existing Name' }, comparator); // -> -1\n24 binarySearch(sortedArrayOfStars,\
    \ { name: 'Alpha Centauri A' }, comparator); // -> 0\n25 binarySearch(sortedArrayOfStars,\
    \ { name: 'Alpha Centauri B' }, comparator); // -> 1\n26 binarySearch(sortedArrayOfStars,\
    \ { name: 'Polaris' }, comparator); // -> 3\n```\n\n`15-binary-search/example.js`\n\
    \n## 实现\n\n在上面的示例中，我们使用了一个自定义比较函数来对恒星对象进行相互比较。为了实现这一点，我们将重用一个在恒星对象之间进行比较的自定义比较函数。为了使其可行，我们将重用在“线性查找”章节实现的\
    \ `Comparator` 类。请查看 `Comparator` 类的实现细节。\n\n```\n// 导入依赖。\nimport Comparator\
    \ from '../utils/Comparator';\n```\n\n`16-binary-search/binarySearch.js`\n\n现在让我们看看如何实现二分查找。\n\
    \n```\n/**\n * 二分查找。\n * @param {Array} sortedArray 有序数组\n * @param {Object} target\
    \ 要查找的目标对象\n * @param {Function} comparator 比较函数\n * @returns {number} 找到的索引或\
    \ -1\n */\nexport default function binarySearch(sortedArray, target, comparator)\
    \ {\n  // 使用 Comparator\n  const comp = new Comparator(comparator);\n  let left\
    \ = 0;\n  let right = sortedArray.length - 1;\n\n  while (left <= right) {\n \
    \   // 计算中间索引\n    const mid = Math.floor((left + right) / 2);\n\n    // 如果找到目标\n\
    \    if (comp.equal(sortedArray[mid], target) === 0) {\n      return mid;\n  \
    \  }\n    // 如果目标更小，在左半部分查找\n    if (comp.lessThan(sortedArray[mid], target))\
    \ {\n      right = mid - 1;\n    } \n    // 如果目标更大，在右半部分查找\n    else {\n     \
    \ left = mid + 1;\n    }\n  }\n\n  return -1;\n}\n```\n"
- fmt: "\n![](images/17-cartesian-product----cartesian-product.png)\n\nThe number\
    \ of the elements in a product set `A×B` of two sets `A` and `B` may be calculated\
    \ as a multiplication of lengths of sets `A` and `B` as `|A|×|B|`. In example\
    \ above we had two sets of length 3. The product of those sets contains `3 * 3\
    \ = 9` elements.\n\nIt is also possible to create a cartesian product of more\
    \ than just two sets. For example we have a set of sweater colors `COLORS = {blue,\
    \ red, yellow}`, set of neck forms `NECK_FORMS = {round-neck, V−neck, polo−neck}`\
    \ and a set of sizes `SIZE = {XS, S, M, L, XL, XXL}` then the cartesian product\
    \ of these three sets would look like `{(blue,round-neck,XS), (blue,round-neck,S),\
    \ (blue,round-neck,M), ..., (yellow,polo−neck,XXL)}`.\n\n### Applications\n\n\
    A deck of cards is an example of a cartesian product being applied to the set\
    \ of card ranks `{A, K, Q, J, 10, 9, 8, 7, 6, 5, 4, 3, 2}` and the set of card\
    \ suits `{♠︎, ♣, ︎♥, ︎♦︎}`. The product of these two sets forms the standard 52-card\
    \ deck `{(A,♠), (A,♣), (A,♥), ..., (2,♦)}`.\n\nA two-dimensional coordinate system\
    \ is also a product set of two sets `R×R` with `R` denoting the set of real numbers.\n\
    \nIn general, the cartesian product may be used to generate all possible pairs\
    \ (sub-sets) of different entities. We may think of generating pairs of `(model,\
    \ color)` properties for a price list of cars or `(neck_form, size, color)` sub-sets\
    \ of properties for a sweater catalog and so on.\n\n### Usage Example\n\nLet’s\
    \ use our `cartesianProduct()` function to generate a deck of cards.\n\n```\n\
    \ 1 // Import dependencies.\n 2 import cartesianProduct from './cartesianProduct';\n\
    \ 3 \n 4 // Init the sets of card ranks and suits.\n 5 const cardRanks = ['A',\
    \ 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];\n 6 const cardSuits\
    \ = ['♠', '♣', '♥', '♦'];\n 7 \n 8 // Generate a deck of cards.\n 9 const cardDeck\
    \ = cartesianProduct(cardRanks, cardSuits);\n10 \n 11 // Check the deck.\n 12\
    \ // eslint-disable-next-line no-console\n 13 console.log(cardDeck); // -> [['A',\
    \ '♠'], ['A', '♣'], ..., ['2', '♦']]\n```\n\n17-cartesian-product/example.js\n\
    \n### Implementation\n\nIn order to implement `cartesianProduct()` function, first\
    \ we need to check the input. If the input is incorrect and some input sets are\
    \ empty the function will return `null`. Then we generate all pairs of elements\
    \ from two input sets `setA` and `setB` by using two nested `for` loops.\n\n```\n\
    \ 1 /**\n 2  * Generates Cartesian Product of two sets.\n 3  * @param {*[]} setA\n\
    \ 4  * @param {*[]} setB\n 5  * @return {*[]}\n 6  */\n 7 export default function\
    \ cartesianProduct(setA, setB) {\n 8   // Check if input sets are not empty.\n\
    \ 9   // Otherwise return null since we can't generate Cartesian Product out of\
    \ them.\n10   if (!setA || !setB || !setA.length || !setB.length) {\n 11     return\
    \ null;\n 12   }\n 13 \n 14   // Init product set.\n 15   const product = [];\n\
    \ 16 \n 17   // Now, let's go through all elements of a first and second set and\
    \ form all possi\\\n18 ble pairs.\n19   for (let indexA = 0; indexA < setA.length;\
    \ indexA += 1) {\n20     for (let indexB = 0; indexB < setB.length; indexB +=\
    \ 1) {\n21       // Add current product pair to the product set.\n22       product.push([setA[indexA],\
    \ setB[indexB]]);\n23     }\n24   }\n 25 \n 26   // Return cartesian product set.\n\
    \ 27   return product;\n 28 }\n```\n\n17-cartesian-product/cartesianProduct.js\n\
    \n### Complexities\n\nIf we’re generating the product set of two sets `A` and\
    \ `B` then two nested `for` loops will give us `|A| * |B|` number of loops, where\
    \ `|A|` is number of elements in set `A` and `|B|` is number of elements in set\
    \ `|B|`. So the time complexity is O(|A| * |B|).\n\nThe additional space complexity\
    \ is also O(|A| * |B|) since we’re allocating a new array that will hold all cartesian\
    \ product elements.\n\n### Problems Examples\n\nHere are some related problems\
    \ that you might might:\n"
