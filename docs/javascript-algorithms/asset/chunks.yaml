  trans: "\n\n让我们来实现一个简单的消息系统，将所有需要处理的消息存储在队列中。在下面的代码中，我们实例化一个新的 `Queue` 对象，并使用与对象相关的方法对队列进行\
    \ `enqueue`（入队）和 `dequeue`（出队），同时使用 `peek` 查看下一个将是哪个消息。我们还使用 `toString` 和 `isEmpty`\
    \ 方法来查看队列中当前的内容，并检查队列是否为空。\n\n```\n 1 // 首先，我们需要导入 Queue 类。\n 2 import { Queue\
    \ } from './Queue';\n 3 \n 4 // 然后，我们需要实例化队列。\n 5 const messageQueue = new Queue();\n\
    \ 6 \n 7 // 现在队列是空的，没有消息需要处理。\n 8 messageQueue.isEmpty(); // => true\n 9 messageQueue.toString();\
    \ // => ''\n10 \n11 // 向队列添加一条新消息。\n12 messageQueue.enqueue('message_1');\n13\
    \ messageQueue.isEmpty(); // => false\n14 messageQueue.toString(); // => 'message_1'\n\
    15 messageQueue.peek(); // => 'message_1'\n16 \n17 // 再添加一条消息。\n18 messageQueue.enqueue('message_2');\n\
    19 messageQueue.isEmpty(); // => false\n20 messageQueue.toString(); // => 'message_1,message_2'\n\
    21 messageQueue.peek(); // => 'message_2'\n22 \n23 // 现在来处理这些消息。\n24 messageQueue.dequeue();\
    \ // => 'message_1'\n25 messageQueue.dequeue(); // => 'message_2'\n26 \n27 messageQueue.isEmpty();\
    \ // => true\n```\n\n`03-queue/example.js`\n\n### Implementation\n\n队列可以用链表（Linked\
    \ List）来实现。链表的结构和操作与队列相似。我们的 `LinkedList` 类拥有一个 `append` 方法和一个 `delete head` 方法，这两个方法对于实现队列都是非常有用的。我们将使用这些方法来构建\
    \ `Queue` 类中的 `enqueue` 和 `de-queue` 方法。\n\n首先，让我们导入 `LinkedList` 类：\n\n```\n\
    1 import LinkedList from '../02-linked-list/LinkedList';\n```\n\n`03-queue/Queue.js`\n\
    \n### `constructor`\n\n在 `Queue` 类的构造函数中，我们创建了一个新的 `LinkedList` 对象用于存储数据：\n\n\
    ```\n4   constructor() {\n5     // 我们将基于 LinkedList 实现 Queue。\n6     this.linkedList\
    \ = new LinkedList();\n7   }\n```\n\n`03-queue/Queue.js`\n\n### `enqueue`\n\n\
    现在让我们来实现 `enqueue()` 操作。该方法将一个新元素添加到队列的末尾。我们将调用 `LinkedList` 对象的 `append` 方法将项目添加到队列末尾：\n\
    \n```\n30   /**\n31    * @param {*} value\n32    */\n33   enqueue(value) {\n34\
    \     // 入队意味着排队。因此，我们只需要在链表的开头\n35     // 添加新值即可。它需要等待\n36     // 直到所有之前的节点被处理完毕。\n\
    37     this.linkedList.append(value);\n38   }\n```\n\n`03-queue/Queue.js`\n\n\
    ### `dequeue`\n\n当我们想要 `dequeue()` 元素时，我们从链表中取出第一个元素（链表的 `head`）并将其返回。我们调用 `LinkedList`\
    \ 对象的 `removeHead` 方法，如果该方法返回的节点为 `null`，则返回 `null`。否则，返回节点的值。\n\n```\n40   /**\n\
    41    * @return {*}\n42    */\n43   dequeue() {\n44     // 尝试从链表中删除删除第一个节点（头部）。\n\
    45     // 如果链表中没有头部（为空），则直接返回 null。\n46     const removedHead = this.linkedList.deleteHead();\n\
    47     return removedHead ? removedHead.value : null;\n48   }\n```\n\n`03-queue/Queue.js`\n\
    \n### `peek`\n\n为了实现 `peek()` 操作，我们不会从列表中移除任何元素，只需从 `LinkedList` 对象的头部获取值并返回它。\n\
    \n```\n17   /**\n18    * @return {*}\n19    */\n20   peek() {\n21     if (!this.linkedList.head)\
    \ {\n22       // 如果链表为空，则没有内容可以查看。\n23       return null;\n24     }\n25 \n26 \
    \    // 直接从链表末尾读取值而不删除它。\n27     return this.linkedList.head.value;\n28   }\n\
    ```\n\n`03-queue/Queue.js`\n\n到此时，我们已经实现了主要的队列方法。让我们来实现几个辅助方法，让队列的使用变得更加方便。\n\n\
    ### `isEmpty`\n\n让我们实现一个检查队列是否为空的方法。为了做到这一点，我们只需要检查链表的头部并确保不存在元素：\n\n```\n 9 \
    \  /**\n10    * @return {boolean}\n11    */\n12   isEmpty() {\n13     // 如果其链表没有头部，则队列队列为空。\n\
    14     return !this.linkedList.head;\n15   }\n```\n\n`03-queue/Queue.js`\n\n###\
    \ `toString`\n\n我们也来实现 `toString()` 方法来让队列的使用更加方便。它将接受一个可选的 `callback`。\n\n```\n\
    50   /**\n51    * @param {*} callback\n52    * @return {string}\n53    */\n54\
    \   toString(callback) {\n55     // 队列的字符串表示。\n56     return this.linkedList.toString(callback);\n\
    57   }\n```\n\n"
- fmt: "\nOperations such as `searching` or `updating` the elements are not typical\
    \ for stacks. We’re only interested in working with the top of the stack.\n\n\
    ### Applications\n\nThe `Stack` data structure is used to solve many algorithmic\
    \ tasks such as:\n\n* graph topological sorting,\n* finding strongly connected\
    \ components in graphs,\n* The Tower of Hanoi Problem,\n* remembering partially\
    \ completed tasks,\n* undoing (backtracking from) an action\n* and many more.\n\
    \nStacks are often useful in recursive algorithms when you need to push temporary\
    \ data onto a stack as you recurse, but then remove them as you backtrack. A stack\
    \ offers an intuitive way to do this.\n\nLow-level programming languages also\
    \ use the stack data structure to store function parameters and local variables\
    \ in memory when calling one function from another for example. You might probably\
    \ know this from the notorious “Stack Overflow” error. The error is connected\
    \ to stack usage and may be caused by excessively deep or infinite recursion,\
    \ in which a function calls itself so many times that the space needed to store\
    \ the variables and information associated with each call is more than can fit\
    \ on the stack.\n\n### Usage Example\n\nBefore we continue with the `Stack` class\
    \ implementation, let’s imagine that we already have one implemented and try to\
    \ use its basic methods that were mentioned above. This will help us to get a\
    \ better understanding of what we’re going to implement. Let’s say we want to\
    \ use a stack to reverse an array:\n\n```\n 1 // Import the Stack class.\n 2 import\
    \ { Stack } from './Stack';\n 3 \n 4 // Create stack instance.\n 5 const stack\
    \ = new Stack();\n 6 \n 7 // Create an array we want to reverse.\n 8 const arrayToReverse\
    \ = ['a', 'b', 'c'];\n 9 \n10 stack.isEmpty(); // => true\n11 stack.toString();\
    \ // => ''\n12 stack.toArray(); // => []\n13 \n14 // Let's add items to stack.\n\
    15 stack.push(arrayToReverse[0]);\n16 stack.isEmpty(); // => false\n17 stack.toString();\
    \ // => 'a'\n18 stack.toArray(); // => ['a']\n19 \n20 // Add more items to stack.\n\
    21 stack.push(arrayToReverse[1]);\n22 stack.push(arrayToReverse[2]);\n23 stack.toString();\
    \ // => 'c,b,a'\n24 stack.toArray(); // => ['c', 'b', 'a']\n25 \n26 // Check what\
    \ next.\n27 stack.peek(); // => 'c'\n28 \n29 // Pop from stack.\n30 stack.pop();\
    \ // => 'c'\n31 stack.pop(); // => 'b'\n32 stack.pop(); // => 'a'\n33 \n34 stack.isEmpty();\
    \ // => true\n```\n\n### Implementation\n\nA stack can be implemented with a linked\
    \ list. We can use our `append` and `deleteTail` operations from the `LinkedList`\
    \ class to implement the `push` and `pop` operations of a stack. The idea is that\
    \ you `append` the item to the linked list when you want to `push` it to the stack\
    \ and `delete` the tail of linked list when you want to `pop` an item from the\
    \ stack. Since we’re going to build a stack based on linked list let’s start by\
    \ importing it:\n\n```javascript\nimport LinkedList from '../02-linked-list/LinkedList';\n\
    ```\n\n#### constructor\n\nLet’s create the `Stack` class:\n\n```javascript\n\
    export class Stack {\n  constructor() {\n    // We're going to implement based\
    \ on linked list\n    // structures quite similar. Compare push/pop operations\
    \ of Stack\n    // with prepend/deleteHead operations of LinkedList.\n    this.linkedList\
    \ = new LinkedList();\n  }\n}\n```\n\n#### push\n\nIf we want to push something\
    \ to the stack, we need to `append` the data to the end of the linked list. In\
    \ this case, the top of the stack would be the tail of the linked list:\n\n```javascript\n\
    /**\n * @param {*} value\n */\npush(value) {\n  // Pushing means to lay the value\
    \ on top of the stack. Therefore let's add\n  // new value at the head of the\
    \ linked list.\n  this.linkedList.prepend(value);\n}\n```\n\n#### pop\n\nIf we\
    \ want to pop the element from the stack we need to `delete` linked list tail\
    \ and return it:\n\n```javascript\n/**\n * @return {*}\n */\npop() {\n  // Let's\
    \ try to delete the first node from linked list (the head).\n  // If there is\
    \ no head in linked list (it is empty) just return null.\n  const removedHead\
    \ = this.linkedList.deleteHead();\n  return removedHead ? removedHead.value :\
    \ null;\n}\n```\n\n#### peek\n\nAnother common stack operation is checking what\
    \ is on top of the stack without actually extracting the data. In this case, we\
    \ just need to read linked list tail:\n\n```javascript\n/**\n * @return {*}\n\
    \ */\npeek() {\n  if (this.isEmpty()) {\n    // If linked list is empty then there\
    \ is nothing to peek from.\n    return null;\n  }\n  // Just read the value from\
    \ the head of linked list without deleting it.\n  return this.linkedList.head.value;\n\
    }\n```\n\nAt this point, we’re done with mandatory stack operations. Now let’s\
    \ move on and implement some helper methods that will make the usage of `Stack`\
    \ class to be more convenient.\n\n#### isEmpty\n\nLet’s implement `isEmpty()`\
    \ method that will check if the stack is empty or not. To do this we just need\
    \ to check if linked list has a head:\n\n```javascript\n/**\n * @return {boolean}\n\
    \ */\nisEmpty() {\n  // The queue is empty in case if its linked list dont have\
    \ head.\n  return !this.linkedList.head;\n}\n```\n\n#### toArray\n\nAnother useful\
    \ method is `toArray()` which converts our stack to an array. To do this, we need\
    \ to:\n1. Convert the linked list to an array,\n2. Extract the values of each\
    \ linked list nodes since we don’t want our `Stack` class consumers to deal with\
    \ linked list nodes. By doing this, we encapsulate the implementation of the class,\n\
    3. Reverse the linked list array so that the tail of the list would become the\
    \ first element in the array and the head would become the last element of the\
    \ array. This is not mandatory but is done for convenience reasons only.\n\nThe\
    \ code looks like this:\n\n```javascript\n/**\n * @return {[]}\n */\ntoArray()\
    \ {\n  return this.linkedList\n    .toArray()\n    .map(linkedListNode => linkedListNode.value);\n\
    }\n```\n\n#### toString\n\nAnd the last method we will implement is `toString()`\
    \ that will be based on `toArray()` and will convert the stack to its string representation:\n\
    \n```javascript\n/**\n * @param {function} [callback]\n * @return {string}\n */\n\
    toString(callback) {\n  return this.linkedList.toString(callback);\n}\n```\n\n\
    The last curly bracket is the closing bracket of `Stack` class. Our basic implementation\
    \ of the `Stack` class is ready at this point. You may find full class code example\
    \ in `code/src/04-stack/Stack.js` file.\n"
  raw: "Operations such as *searching* or *updating* the elements are not typical\
    \ for stacks. We’re only interested in working with the top of the stack.\n\n\
    ### Applications\n\nThe Stack data structure *is used to solve many algorithmic\
    \ tasks* such as:\n\n*   graph topological sorting,\n\n*   finding strongly connected\
    \ components in graphs,\n\n*   The Tower of Hanoi Problem,\n\n*   remembering\
    \ partially completed tasks,\n\n*   undoing (backtracking from) an action\n\n\
    *   and many more.\n\nStacks are often useful in recursive algorithms when you\
    \ need to push temporary data onto a stack as you recurse, but then remove them\
    \ as you backtrack. A stack offers an intuitive way to do this.\n\n*Low-level\
    \ programming languages also use the stack data structure* to store function parameters\
    \ and local variables in memory when calling one function from another for example.\
    \ You might probably know this from the notorious “Stack Overflow” error. The\
    \ error is connected to stack usage and may be caused by excessively deep or infinite\
    \ recursion, in which a function calls itself so many times that the space needed\
    \ to store the variables and information associated with each call is more than\
    \ can fit on the stack.\n\n### Usage Example\n\nBefore we continue with the stack\
    \ class implementation, let’s imagine that we already have one implemented and\
    \ try to use its basic methods that were mentioned above. This will help us to\
    \ get a better understanding of what we’re going to implement. Let’s say we want\
    \ to use a stack to reverse an array:\n\n```\n 1 // Import the Stack class.\n\
    \ 2 import { Stack } from './Stack';\n 3 \n 4 // Create stack instance.\n 5 const\
    \ stack = new Stack();\n 6 \n 7 // Create an array we want to reverse.\n 8 const\
    \ arrayToReverse = ['a', 'b', 'c'];\n 9 \n10 stack.isEmpty(); // => true\n11 stack.toString();\
    \ // => ''\n12 stack.toArray(); // => []\n13 \n14 // Let's add items to stack.\n\
    15 stack.push(arrayToReverse[0]);\n16 stack.isEmpty(); // => false\n17 stack.toString();\
    \ // => 'a'\n18 stack.toArray(); // => ['a']\n19 \n20 // Add more items to stack.\n\
    21 stack.push(arrayToReverse[1]);\n22 stack.push(arrayToReverse[2]);\n23 stack.toString();\
    \ // => 'c,b,a'\n24 stack.toArray(); // ['c', 'b', 'a']\n25 \n26 // Check what\
    \ next.\n27 stack.peek(); // => 'c'\n28 \n29 // Pop from stack.\n30 stack.pop();\
    \ // => 'c'\n31 stack.pop(); // => 'b'\n32 stack.pop(); // => 'a'\n33 \n34 stack.isEmpty();\
    \ // => true\n```\n\n04-stack/example.js\n\n### Implementation\n\nA stack can\
    \ be implemented with a linked list. We can use our `append` and `deleteTail`\
    \ operations from our `LinkedList` class to implement the `push` and `pop` operations\
    \ of a stack. The idea is that you *append* the item to the linked list when you\
    \ want to *push* it to the stack and you *delete* the tail of linked list when\
    \ you want to *pop* an item from the stack.\n\nSince we’re going to build a stack\
    \ based on a linked list let’s start by importing it:\n\n```\n1 import LinkedList\
    \ from '../02-linked-list/LinkedList';\n```\n\n04-stack/Stack.js\n\n#### `constructor`\n\
    \nLet’s create the `Stack` class:\n\n```\n3 export class Stack {\n```\n\n04-stack/Stack.js\n\
    \nNext we create our `LinkedList` object that will hold all stack data:\n\n```\n\
    4   constructor() {\n5     // We're going to implement Queue based on LinkedList\
    \ since this\n6     // structures a quite similar. Compare push/pop operations\
    \ of the Stack\n7     // with prepend/deleteHead operations of LinkedList.\n8\
    \     this.linkedList = new LinkedList();\n9   }\n```\n\n04-stack/Stack.js\n\n\
    #### `push`\n\nIf we want to push something to the stack, we need to append the\
    \ data to the end of the linked list. In this case, the top of the stack would\
    \ be the tail of the linked list:\n\n```\n32   /**\n33    * @param {*} value\n\
    34    */\n35   push(value) {\n36     // Pushing means to lay the value on top\
    \ of the stack. Therefore let's just add\n37     // new value at the head of the\
    \ linked list.\n38     this.linkedList.prepend(value);\n39   }\n```\n\n04-stack/Stack.js\n\
    \n#### `pop`\n\nIf we want to pop the element from the stack we need to delete\
    \ the linked list tail and return it:\n\n```\n41   /**\n42    * @return {*}\n\
    43    */\n44   pop() {\n45     // Let's try to delete the first node from linked\
    \ list (the head).\n46     // If there is no head in linked list (it is empty)\
    \ just return null.\n47     const removedHead = this.linkedList.deleteHead();\n\
    48     return removedHead ? removedHead.value : null;\n49   }\n```\n\n04-stack/Stack.js\n\
    \n#### `peek`\n\nAnother common stack operation is checking what is on top of\
    \ the stack without actually extracting the data. In this case, we just need to\
    \ read linked list tail:\n\n```\n19   /**\n20    * @return {*}\n21    */\n22 \
    \  peek() {\n23     if (this.isEmpty()) {\n24       // If linked list is empty\
    \ then there is nothing to peek from.\n25       return null;\n26     }\n27 \n\
    28     // Just read the value from the head of linked list without deleting it.\n\
    29     return this.linkedList.head.value;\n30   }\n```\n\n04-stack/Stack.js\n\n\
    At this point, we’re done with mandatory stack operations. Now let’s move on and\
    \ implement some helper methods that will make the usage of `Stack` class to be\
    \ more convenient.\n\n#### `isEmpty`\n\nLet’s implement `isEmpty()` method that\
    \ will check if the stack is empty or not. To do this we just need to check if\
    \ linked list has a head:\n\n```\n11   /**\n12    * @return {boolean}\n13    */\n\
    14   isEmpty() {\n15     // The queue is empty in case if its linked list don't\
    \ have head.\n16     return !this.linkedList.head;\n17   }\n```\n\n04-stack/Stack.js\n\
    \n#### `toArray`\n\nAnother useful method is `toArray()` which converts our stack\
    \ to an array. To do this, we need to:\n\n1.  Convert the linked list to an array,\n\
    \n2.  Extract the values of each linked list nodes since we don’t want our `Stack`\
    \ class consumers to deal with linked list nodes directly. By doing this, we encapsulate\
    \ the implementation of the class,\n\n3.  Reverse the linked list array so that\
    \ the tail of the list would become the first element in the array and the head\
    \ would become the last element of the array. This is not mandatory but is done\
    \ for convenience reasons only.\n\nThe code looks like this:\n\n```\n51   /**\n\
    52    * @return {*[]}\n53    */\n54   toArray() {\n55     return this.linkedList\n\
    56       .toArray()\n57       .map(linkedListNode => linkedListNode.value);\n\
    58   }\n```\n\n04-stack/Stack.js\n\n#### `toString`\n\nAnd the last method we\
    \ will implement is `toString()` that will be based on `toArray()` and will convert\
    \ the stack to its string representation:\n\n```\n60   /**\n61    * @param {function}\
    \ [callback]\n62    * @return {string}\n63    */\n64   toString(callback) {\n\
    65     return this.linkedList.toString(callback);\n66   }\n67 }\n```\n\n04-stack/Stack.js\n\
    \nThe last curly bracket is the closing bracket of `Stack` class.\n\nOur basic\
    \ implementation of the `Stack` class is ready at this point. You may find full\
    \ class code example in `code/src/04-stack/Stack.js` file.\n\n### Complexities\n\
    \n| Access | Search | Insertion (push) | Deletion (pop) |\n\n| --- | --- | ---\
    \ | --- |\n\n| O(n) | O(n) | O(1) | O(1) |\n\nIn case if Stack is implemented\
    \ via LinkedList as in example above then accessing and searching of the item\
    \ are done through the linked list search method which goes through all the elements\
    \ in the list. Therefore these operations are done in O(n) time.\n\nInsertion\
    \ (pushing) and deletion (popping) operations are fast since for linked list it\
    \ will take a constant amount of time O(1) to append the new value to the end\
    \ of the list or to delete the list’s tail.\n\n### Problems Examples\n\nHere are\
    \ some related problems that you might encounter during the interview:\n\n*  \
    \ [Implement Stacks Using Queues](https://leetcode.com/problems/implement-stack-using-queues/)\n\
    \n*   [Climbing Stairs](https://leetcode.com/problems/climbing-stairs/)\n\n###\
    \ Quiz\n\n*Q1: Is a Stack first-in-first-out or first-in-last-out?*\n\n*Q2: What\
    \ basic operations does Stack have: `peek() / enqueue() / dequeue()` or `peek()\
    \ / push() / pop()`?*\n\n*Q3: What is the time complexity of `push()` operation\
    \ in a Stack?*\n\n### References"
