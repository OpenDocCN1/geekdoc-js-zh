    \n### `getEdges()`\n\n此方法返回顶点的所有相邻边的数组。为了做到这一点，它将边的 `LinkedList` 转换为数组，然后使用 `map()`\
    \ 函数遍历并提取值。这些值是顶点实体。\n\n```javascript\n57   /**\n58    * 获取所有顶点边数组。\n59    * @return\
