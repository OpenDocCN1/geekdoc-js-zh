    \ + n²)` 变为 `O(n²)`，`O(n + log(n))` 变为 `O(n)`，以此此类推。\n\n为什么呢？因为 Big O 描述的是函数的阶，而不是它消耗的精确毫秒或兆字节。它描述的是趋势而非绝对值。因此，非主导常数并不重要。非主导常数是在\
    \ `n` 取值巨大时我们可以丢弃的部分。例如，在 `n = 10000` 的情况下，这两个部分中哪一个对最终结果的影响更大：`20` 还是 `n = 10000`？显而易见，`n`\
    \ 对最终结果的影响是常数 `20` 的 `500` 倍。因此，我们可以舍弃它，“爬楼梯”算法的时间复杂度如下：\n\n```\nO(n)\n```\n\n\
    这是一个线性依赖的例子，但也存在其他类型的依赖关系：`O(log(n))`、`O(n * log(n))`、`O(n²)`、`O(2^n)`、`O(n!)`\
    \ 等。\n\n查看算法分析中常用的函数图表，它们展示了每个函数的操作次数 `N` 与输入规模 `n` 的关系。\n\n![](img/01-algorithms-and-their-complexities----big-o-charts.png)\n\
    \n所有这些图表向我们展示了函数的内时间和消耗取决于输入增长得有多快。两个不同的数组排序算法可能完成相同的排序任务，但一个耗时为 `O(n * log(n))`，另一个为\
    \ `O(n²)`。如果有选择，我们会倾向于选择第一个而不是第二个。\n\n*使用 Big O 表示法，我们可以根据 Big O 值对算法（函数、程序）进行比较，而独立于它们运行的硬件。*\n\
    \n查看一些常见的 Big O 表示法列表以及针对不同规模输入数据的性能对比。这将让你对不同算法的复杂度（时间和内存消耗）可能是什么样的有一个直观的感受。\n\
    \n| Big O Notation | 10 个元素的计算次数 | 100 个元素的计算次数 | 1000 个元素的计算次数 |\n| --- | ---\
    \ | --- | --- |\n| `O(1)` | 1 | 1 | 1 |\n| `O(log(n))` | 3 | 6 | 9 |\n| `O(n)`\
    \ | 10 | 100 | 1000 |\n| `O(n log(n))` | 30 | 600 | 9000 |\n| `O(n²)` | 100 |\
    \ 10000 | 1000000 |\n| `O(2^n)` | 1024 | 1.26e+29 | 1.07e+301 |\n| `O(n!)` | 3628800\
    \ | 9.3e+157 | 4.02e+2567 |\n\n## Big O 表示法示例\n\n让我们继续看其他一些 big o 表示法的例子。\n\n\
    ### O(1) 示例\n\n让我们写一个将数字提升到指定幂的函数：\n\n```\n 1 /**\n 2  * 将数字提升到幂。\n 3  *\n 4 \
    \ * 示例：\n 5  * number = 3\n 6  * power = 2\n 7  * output = 3² = 9\n 8  *\n 9 \
    \ * @param {number} number\n10  * @param {number} power\n11  * @return {number}\n\
    12  */\n13 export function fastPower(number, power) {\n14   return number ** power;\n\
    15 }\n```\n\n`01-algorithms-and-their-complexities/fastPower.js`\n\n它的时间复杂和空间复杂度是多少？\n\
    \n思考函数的输入将如何影响它完成的操作次数。对于每一个输入，函数都只执行一次操作。这意味着该函数的时间复杂度为：\n\n```\nTime complexity:\
    \ O(1)\n```\n\n现在让我们粗略分析评估此函数需要多少内存。在这种情况下，我们操作的变量数量不取决于输入。因此，空间复杂度为：\n\n```\n\
    Space complexity: O(1)\n```\n\n### O(n) 示例\n\n现在让我们用迭代的方式来实现相同的幂函数：\n\n```\n 1\
    \ /**\n 2  * 将数字提升到幂。\n 3  *\n 4  * 示例：\n 5  * number = 3\n 6  * power = 2\n 7\
    \  * output = 3² = 9\n 8  *\n 9  * @param {number} number\n10  * @param {number}\
    \ power\n11  * @return {number}\n12  */\n13 export function fastPower(number,\
    \ power) {\n14   return number ** power;\n15 }\n```\n\n*(注：原文中 O(n) 示例部分的代码存在重复\
    \ fast fastPower 的错误，此处已根据原文逻辑进行格式化处理。)*\n"
