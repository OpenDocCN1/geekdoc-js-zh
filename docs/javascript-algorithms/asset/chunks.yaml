  trans: "\n\n```javascript\n /**\n * 从提供的字母中获取所有可能的组合。\n *\n * Example:\n * letter\
    \ = ['a', 'b']\n * output = ['aa', 'ab', 'ba', 'bb']\n *\n * @param {string[]}\
    \ letters\n * @return {string[]}\n */\nexport function pairs(letters) {\n  const\
    \ result = [];\n\n  for (let i = 0; i < letters.length; i += 1) {\n    for (let\
    \ j = 0; j < letters.length; j += 1) {\n      result.push(`${letters[i]}${letters[j]}`);\n\
    \    }\n  }\n\n  return result;\n}\n```\n\n`01-algorithms-and-their-complexities/pairs.js`\n\
    \n现在有两个嵌套的 `for()` 循环，它们的作用相当于循环内部代码的倍器。在循环内部，我们有执行时间为常数的 `O(1)` 代码 - 只是向数组中推送元素。因此，我们将时间复杂度计算为函数各个部分时间复杂度之和：`O(1)\
    \ + letters.length * letters.length * O(1) + O(1)`。在去掉非主导部分后，我们得到最终的时间复杂度：\n\n\
    ```\nTime complexity: O(letters.length²)\n```\n\n这意味着我们的函数运行速度将根据我们提供的输入字母数量的平方成比例变慢。\n\
    \n你可能还会注意到，提供给函数的字母越多，生成的组合就越多。所有这些组合都存储在 `pairs` 数组中。因此，该数组消耗的内存与字母数量的平方成正比。\n\
    \n```\nSpace complexity: O(letters.length²)\n```\n\n## 空间复杂度与辅助空间复杂度示例\n\n此外，除了空间复杂度（space\
    \ complexity），还有辅助空间复杂度（auxiliary space complexity）。由于这两个术语经常被误用。\n\n它们之间的区别在于，辅助空间复杂度**不包括我们存储输入数据所需的内存量**。辅助空间复杂度仅显示算法解决问题需要多少`额外`的内存。相反，空间复杂度同时考虑了这两点：存储输入数据所需的内存量以及算法所需的额外内存量。\n\
    \n> 空间复杂度 = 输入 + 辅助空间复杂度\n\n让我们来看下面的示例。这里有一个将数组中所有元素乘以特定值的函数：\n\n```javascript\n\
    \ /**\n * 原地将数组中的所有值乘以特定值。\n *\n * Example:\n * array = [1, 2, 3]\n * multiplier\
    \ = 2\n * output = [2, 4, 6]\n *\n * @param {number[]} array\n * @param {number}\
    \ multiplier\n * @return {number[]}\n */\nexport function multiplyArrayInPlace(array,\
    \ multiplier) {\n  for (let i = 0; i < array.length; i += 1) {\n    array[i] *=\
    \ multiplier;\n  }\n\n  return array;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArrayInPlace.js`\n\
    \n该函数的空间复杂度与输入数组的大小成线性正比。因此，输入数组越大，该函数消耗的内存就越多。\n\n```\nSpace complexity: O(array.length)\n\
    ```\n\n现在让我们分析额外空间。我们可以看到函数所有的操作都是原地完成的，没有分配任何`额外`内存。\n\n```\nAuxiliary space\
    \ complexity: O(1)\n```\n\n有时，修改函数参数是不可接受的。与其原地修改输入数组参数，我们可能可能想先克隆它。让我们看看如何更改数组乘法函数以防止修改输入参数。\n\
    \n```javascript\n /**\n * 在分配额外内存以防止修改输入数组的情况下，\n * 将数组中的所有值乘以特定值。\n *\n * Example:\n\
    \ * array = [1, 2, 3]\n * multiplier = 2\n * output = [2, 4, 6]\n *\n * @param\
    \ {number[]} array\n * @param {number} multiplier\n * @return {number[]}\n */\n\
    export function multiplyArrayInPlace(array, multiplier) {\n  const result = [...array];\n\
    \  for (let i = 0; i < result.length; i += 1) {\n    result[i] *= multiplier;\n\
    \  }\n\n  return result;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArray.js`\n\
    \n现在有两个嵌套的 `for()` 循环，它们的作用相当于循环内部代码的倍器。在循环内部，我们有执行时间为常数的 `O(1)` 代码 - 只是向数组中推送元素。因此，我们将时间复杂度计算为函数各个部分时间复杂度之和：`O(1)\
    \ + letters.length * letters.length * O(1) + O(1)`。在去掉非主导部分后，我们得到最终的时间复杂度：\n\n\
    ```\nTime complexity: O(letters.length²)\n```\n\n这意味着我们的函数运行速度将根据我们提供的输入字母数量的平方成比例变慢。\n\
    \n你可能还会注意到，提供给函数的字母越多，生成的组合就越多。所有这些组合都存储在 `pairs` 数组中。因此，该数组消耗的内存与字母数量的平方成正比。\n\
    \n```\nSpace complexity: O(letters.length²)\n```\n\n## 空间复杂度与辅助空间复杂度示例\n\n此外，除了空间复杂度，还有辅助空间复杂度。由于这两个术语经常被误用。\n\
    \n它们之间的区别在于，辅助空间复杂度不包括我们存储输入数据所需的内存量。辅助空间复杂度仅显示算法解决问题需要多少`额外`的内存。相反，空间复杂度同时考虑了这两点：存储输入数据所需的内存量以及算法所需的额外内存量。\n\
    \n> 空间复杂度 = 输入 + 辅助空间复杂度\n\n让我们来看下面的示例。这里有一个函数将数组中所有元素乘以特定值：\n\n```javascript\n\
    \ /**\n * 原地将数组中的所有值乘以特定值。\n *\n * Example:\n * array = [1, 2, 3]\n * multiplier\
    \ = 2\n * output = [2, 4, 6]\n *\n * @param {number[]} array\n * @param {number}\
    \ multiplier\n * @return {number[]}\n */\nexport function multiplyArrayInPlace(array,\
    \ multiplier) {\n  for (let i = 0; i < array.length; i += 1) {\n    array[i] *=\
    \ multiplier;\n  }\n\n  return array;\n}\n```\n\n`01-algorithms-and-their-complexities/multiplyArrayInPlace.js`\n\
    \n该函数的空间复杂度与输入数组的大小成线性正比。因此，输入数组越大，该函数消耗的内存就越多。\n\n```\nSpace complexity: O(array.length)\n\
    ```\n\n现在让我们分析额外空间。我们可以看到函数所有的操作都是原地完成的，没有分配任何`额外`内存。\n\n```\nAuxiliary space\
    \ complexity: O(1)\n```\n\n有时，修改函数参数是不可接受的。与其原地修改输入数组参数，我们可能想先克隆它。让我们看看如何更改数组乘法函数以防止输入参数。\n\
    \n```javascript\n /**\n * 在分配额外内存以防止修改输入数组的情况下，\n * 将数组中的所有值乘以特定值。\n *\n * Example:\n\
    \ * array = [1, 2, 3]\n * multiplier = 2\n * output = [2, 4, 6]\n *\n * @param\
    \ {number[]} array\n * @param {number} multiplier\n * @return {number[]}\n */\n\
    export function multiplyArrayInPlace(array, multiplier) {\n  const result = [...array];\n\
    \  for (let i = 0; i < result.length; i += 1) {\n    result[i] *= multiplier;\n\
    \  }\n\n  return result;\n}\n```\n\n## 链表\n\n链表是一个不按顺序存储的实体集合。相反，每个实体都有指向下一个实体的指针。\n\
    \n![](img/02-linked-list----LinkedListNode.jpg)\n\n这种结构允许在迭代期间进行高效的插入或删除。每个实体（也称为节点）由数据和指向下一个节点的链接组成。链表的缺点是访问时间是线性的。\n\
    \n**链表的主要操作有：**\n\n*   `prepend` - 在链表开头添加节点\n*   `append` - 在链表末尾添加节点\n*   `delete`\
    \ - 从链表中删除节点\n*   `deleteTail` - 从链表删除最后一个节点\n*   `deleteHead` - 从链表删除第一个节点\n\
    *   `find` - 在链表中查找节点\n\n### 应用\n\n链表被用作许多数据结构（如队列、栈和哈希表）良好的基础。我们在 JavaScript\
    \ 中创建的链表实现将用于学习的许多其他数据结构。\n\n### 实现\n\n我们的 LinkedList 实现由两部分组成：\n\n*   `LinkedListNode`\
