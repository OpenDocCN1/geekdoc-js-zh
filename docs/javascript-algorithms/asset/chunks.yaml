    30 const graph = new Graph(isDirected);\n31 \n32 // 现在我们将刚刚创建的点和道路添加到图中。\n33 //\
    \ 这就像是把地图上所有关于点和道路的信息放上去。\n34 // 记住，我们不需要同时添加它们之间的顶点和边。\n35 // 我们只需要添加边，顶点将自动添加到图中\n\
    36 // (关于 Graph 实现的更多细节，请参阅图的章节)。\n37 graph\n38   .addEdge(roadHomeA)\n39   .addEdge(roadHomeD)\n\
    40   .addEdge(roadAB)\n41   .addEdge(roadAC)\n42   .addEdge(roadCB)\n43   .addEdge(roadDC)\n\
