    \ nodeValue.key === key });\n```\n\n### `get`\n\nGetting a value from the hash\
    \ table using its key is a similar operation to the `set` method. The only difference\
    \ is that after checking if the value exists in the LinkedList we either return\
    \ its value or `undefined`.\n\n```\n61   /**\n62    * GET the value by its key.s\n\
    63    *\n64    * @param {string} key\n65    * @return {*}\n66    */\n67   get(key)\
