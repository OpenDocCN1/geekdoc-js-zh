    \ 并将其设置为 `this.head`，这样当我们从此方法返回时，就可以返回被删除掉的对象。\n\n```\n130     const deletedHead\
    \ = this.head;\n```\n\n`02-linked-list/LinkedList.js`\n\n同样对于场景 2 和 3，我们将逻辑合并到一个\
    \ if/else 语句中。如果 `this.head.next` 不为 `null`，我们知道列表中有超过 1 个元素，我们将 `this.head.next`\
    \ 设置为等于 `this.head`，这就删除了列表中的第一个元素。如果 `this.head.next` 为 `null`，那么我们知道列表中只有 1\
    \ 个元素，我们将 `this.head` 和 `this.tail` 都设置为 `null`，因为我们的 `LinkedList` 中不再有更多元素了。\n\
    \n```\n131     if (this.head.next) {\n132       this.head = this.head.next;\n\
    133     } else {\n134       this.head = null;\n135       this.tail = null;\n136\
    \     }\n```\n\n`02-linked-list/LinkedList.js`\n\n最后，我们从方法中返回我们的 `deletedHead`\
    \ 对象：\n\n```\n139     return deletedHead;\n140   }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n### `find`\n\n`find` 方法遍历 `LinkedList` 中的项，并找到第一个与我们想要的值匹配的 `LinkedListNode`\
    \ 对象。该方法接受一个包含两个键值对的对象：`value` 和 `callback`：\n\n```\n148   find({ value = undefined,\
    \ callback = undefined }) {\n```\n\n`02-linked-list/LinkedList.js`\n\n与我们之前的的方法一样，我们首先检查\
    \ `this.head` 是否为 `null`。如果是 `null`，我们从方法中返回，因为 `LinkedList` 是空的。\n\n```\n149\
    \     if (!this.head) {\n150       return null;\n151     }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n接下来，我们创建一个变量 `currentNode` 来跟踪我们在 `LinkedList` 中的位置，并将其设置为 `this.head` 以从 `LinkedList`\
    \ 的开始。\n\n```\n152 \n```\n\n`02-linked-list/LinkedList.js`\n\n然后我们创建一个 `while`\
    \ 循环来遍历 `LinkedList` 中的所有节点，并调用作为参数传递的 `callback` 函数，或者检查当前节点的值看是否匹配我们正在寻找的值。如果有匹配，我们就返回该节点。\n\
    \n```\n155     while (currentNode) {\n156       // 如果指定了 callback，则尝试通过 callback\
    \ 查找节点。\n157       if (callback && callback(currentNode.value)) {\n158       \
    \  return currentNode;\n159       }\n160 \n161       // 如果指定了 value，则尝试通过值比较。\n\
    162       if (value !== undefined && currentNode.value === value) {\n163     \
    \    return currentNode;\n164       }\n165 \n166       currentNode = currentNode.next;\n\
    167     }\n```\n\n`02-linked-list/LinkedList.js`\n\n最后，如果我们遍历了整个 `LinkedList`\
    \ 且没有找到我们寻找的值，我们就返回 `null`。\n\n```\n169     return null;\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n在此之后，我们已经实现了 `LinkedList` 方法。现在我们将实现两个辅助方法来方便测试和调试 `LinkedList`：`toArray`\n\n\
    `toArray` 方法将 `LinkedList` 中的所有项放入数组中。为了将它们放入数组，我们遍历 `LinkedList` 并并将每个项放入数组。\n\
    \n```\n175   toArray() {\n176     const nodes = [];\n177     let currentNode =\
    \ this.head;\n178     while (currentNode) {\n179       nodes.push(currentNode);\n\
    180       currentNode = currentNode.next;\n181     }\n182     return nodes;\n\
    183   }\n```\n\n`02-linked-list/LinkedList.js`\n\n### `toString`\n\n`toString`\
    \ 方法遍历 `LinkedList` 并打印 `LinkedList` 的字符串表示。该方法遍历 `LinkedList` 并通过 `toString`\
    \ 方法打印出字符串表示。对于 `LinkedList` 中的每个 `LinkedListNode`。\n\n```\n191   toString() {\n\
    192     let result = \"\";\n193     let currentNode = this.head;\n194     while\
    \ (currentNode) {\n195       result += currentNode.value + \" -> \";\n196    \
    \   currentNode = currentNode.next;\n197     }\n198     return result + \"null\"\
    ;\n199   }\n```\n\n`02-linked-list/LinkedList.js`\n\n"
- fmt: "\nLet’s implement a simple messaging system where we store all the messages\
    \ that need to be processed in a queue. In the code below, we instantiate a new\
    \ `Queue` object and use the methods associated with that object to `enqueue`\
    \ and `dequeue` messages in our queue as well as `peek` to see which message will\
    \ be next. We also use the `toString` and `isEmpty` methods to see what currently\
    \ is in our queue and check to see if it is empty or not.\n\n```\n 1 // First,\
    \ we need to import our Queue class.\n 2 import { Queue } from './Queue';\n 3\
    \ \n 4 // Then we need to instantiate a queue.\n 5 const messageQueue = new Queue();\n\
    \ 6 \n 7 // Queue now is empty and there is no messages to process.\n 8 messageQueue.isEmpty();\
    \ // => true\n 9 messageQueue.toString(); // => ''\n10 \n11 // Let's add new message\
    \ to the queue.\n12 messageQueue.enqueue('message_1');\n13 messageQueue.isEmpty();\
    \ // => false\n14 messageQueue.toString(); // => 'message_1'\n15 messageQueue.peek();\
    \ // => 'message_1'\n16 \n17 // Let's add one more message.\n18 messageQueue.enqueue('message_2');\n\
    19 messageQueue.isEmpty(); // => false\n20 messageQueue.toString(); // => 'message_1,message_2'\n\
    21 messageQueue.peek(); // => 'message_2'\n22 \n23 // Now let's process this messages.\n\
    24 messageQueue.dequeue(); // => 'message_1'\n25 messageQueue.dequeue(); // =>\
    \ 'message_2'\n26 \n27 messageQueue.isEmpty(); // => true\n```\n\n`03-queue/example.js`\n\
    \n### Implementation\n\nA queue can be implemented with a Linked List. The structure\
    \ and operations on a Linked List are similar to a Queue. Our `LinkedList` class\
    \ has an `append` method and a `delete head` method that are both useful for implementing\
    \ a Queue. We will use these methods for our `enqueue` and `de-queue` methods\
    \ in our `Queue`.\n\nFirst, let’s import our `LinkedList` class:\n\n```\n1 import\
    \ LinkedList from '../02-linked-list/LinkedList';\n```\n\n`03-queue/Queue.js`\n\
    \n### `constructor`\n\nIn the constructor for the `Queue` class we create a new\
    \ `LinkedList` object that we will use to store our data:\n\n```\n4   constructor()\
    \ {\n5     // We're going to implement Queue based on LinkedList.\n6     this.linkedList\
    \ = new LinkedList();\n7   }\n```\n\n`03-queue/Queue.js`\n\n### `enqueue`\n\n\
    Now let’s implement `enqueue()` operation. This method will append a new element\
    \ to the end of the queue. We will call our `LinkedList` object’s `append` method\
    \ to add our item to the end of the queue:\n\n```\n30   /**\n31    * @param {*}\
    \ value\n32    */\n33   enqueue(value) {\n34     // Enqueueing means to stand\
    \ in the line. Therefore let's just add\n35     // new value at the beginning\
    \ of the linked list. It will need to wait\n36     // until all previous nodes\
    \ will be processed.\n37     this.linkedList.append(value);\n38   }\n```\n\n`03-queue/Queue.js`\n\
    \n### `dequeue`\n\nWhen we want to `dequeue()` element, we take the first element\
    \ from our `LinkedList` (the `head` of the list) and return it. We call the `LinkedList`\
    \ object’s `removeHead` method, and if the node that is returned from the method\
    \ is `null` we return `null`. Otherwise, we return the value of the node.\n\n\
    ```\n40   /**\n41    * @return {*}\n42    */\n43   dequeue() {\n44     // Let's\
    \ try to delete the first node from linked list (the head).\n45     // If there\
    \ is no head in linked list (it is empty) just return null.\n46     const removedHead\
    \ = this.linkedList.deleteHead();\n47     return removedHead ? removedHead.value\
    \ : null;\n48   }\n```\n\n`03-queue/Queue.js`\n\n### `peek`\n\nTo implement the\
    \ `peek()` operation, we won’t remove any elements from our list, we only get\
    \ the value from the head of our `LinkedList` object and return it.\n\n```\n17\
    \   /**\n18    * @return {*}\n19    */\n20   peek() {\n21     if (!this.linkedList.head)\
    \ {\n22       // If linked list is empty then there is nothing to peek.\n23  \
    \     return null;\n24     }\n25 \n26     // Just read the value from the end\
    \ of linked list without deleting it.\n27     return this.linkedList.head.value;\n\
    28   }\n```\n\n`03-queue/Queue.js`\n\nAt this point, we’ve implemented the major\
    \ queue methods. Let’s implement several helper methods that will make our queue\
    \ usage more convenient.\n\n### `isEmpty`\n\nLet’s implement a method that checks\
    \ if the queue is empty. To do that, we just need to check the head of the linked\
    \ list and make sure that no element exists:\n\n```\n 9   /**\n10    * @return\
    \ {boolean}\n11    */\n12   isEmpty() {\n13     // The queue is empty in case\
    \ if its linked list don't have tail.\n14     return !this.linkedList.head;\n\
    15   }\n```\n\n`03-queue/Queue.js`\n\n### `toString`\n\nLet’s also implement `toString()`\
    \ method to make our queue usage more convenient. It will accept optional `callback`.\n\
    \n```\n50   /**\n51    * @param {*} callback\n52    * @return {string}\n53   \
    \ */\n54   toString(callback) {\n55     // String representation of the queue.\n\
    56     return this.linkedList.toString(callback);\n57   }\n```\n"
  raw: "Let’s implement a simple messaging system where we store all the messages\
    \ that need to be processed in a queue. In the code below, we instantiate a new\
    \ `Queue` object and use the methods associated with that object to `enqueue`\
    \ and `dequeue` messages in our queue as well as `peek` to see which message will\
    \ be next. We also use the `toString` and `isEmpty` methods to see what currently\
    \ is in our queue and check to see if it is empty or not.\n\n```\n 1 // First,\
    \ we need to import our Queue class.\n 2 import { Queue } from './Queue';\n 3\
    \ \n 4 // Then we need to instantiate a queue.\n 5 const messageQueue = new Queue();\n\
    \ 6 \n 7 // Queue now is empty and there is no messages to process.\n 8 messageQueue.isEmpty();\
    \ // => true\n 9 messageQueue.toString(); // => ''\n10 \n11 // Let's add new message\
    \ to the queue.\n12 messageQueue.enqueue('message_1');\n13 messageQueue.isEmpty();\
    \ // => false\n14 messageQueue.toString(); // => 'message_1'\n15 messageQueue.peek();\
    \ // => 'message_1'\n16 \n17 // Let's add one more message.\n18 messageQueue.enqueue('message_2');\n\
    19 messageQueue.isEmpty(); // => false\n20 messageQueue.toString(); // => 'message_1,message_2'\n\
    21 messageQueue.peek(); // => 'message_2'\n22 \n23 // Now let's process this messages.\n\
    24 messageQueue.dequeue(); // => 'message_1'\n25 messageQueue.dequeue(); // =>\
    \ 'message_2'\n26 \n27 messageQueue.isEmpty(); // => true\n```\n\n03-queue/example.js\n\
    \n### Implementation\n\nA queue can be implemented with a Linked List. The structure\
    \ and operations on a Linked List are similar to a Queue. Our Linked List class\
    \ has an *append* method and a *delete head* method that are both useful for implementing\
    \ a Queue. We will use these methods for our *enqueue* and *de-queue* methods\
    \ in our Queue.\n\nFirst, let’s import our LinkedList class:\n\n```\n1 import\
    \ LinkedList from '../02-linked-list/LinkedList';\n```\n\n03-queue/Queue.js\n\n\
    #### `constructor`\n\nIn the constructor for the `Queue` class we create a new\
    \ LinkedList object that we will use to store our data:\n\n```\n4   constructor()\
    \ {\n5     // We're going to implement Queue based on LinkedList.\n6     this.linkedList\
    \ = new LinkedList();\n7   }\n```\n\n03-queue/Queue.js\n\n#### `enqueue`\n\nNow\
    \ let’s implement `enqueue()` operation. This method will append a new element\
    \ to the end of the queue. We will call our LinkedList object’s `append` method\
    \ to add our item to the end of the queue:\n\n```\n30   /**\n31    * @param {*}\
    \ value\n32    */\n33   enqueue(value) {\n34     // Enqueueing means to stand\
    \ in the line. Therefore let's just add\n35     // new value at the beginning\
    \ of the linked list. It will need to wait\n36     // until all previous nodes\
    \ will be processed.\n37     this.linkedList.append(value);\n38   }\n```\n\n03-queue/Queue.js\n\
    \n#### `dequeue`\n\nWhen we want to `dequeue()` element, we take the first element\
    \ from our LinkedList (the *head* of the list) and return it. We call the LinkedList\
    \ object’s `removeHead` method, and if the node that is returned from the method\
    \ is `null` we return `null`. Otherwise, we return the value of the node.\n\n\
    ```\n40   /**\n41    * @return {*}\n42    */\n43   dequeue() {\n44     // Let's\
    \ try to delete the first node from linked list (the head).\n45     // If there\
    \ is no head in linked list (it is empty) just return null.\n46     const removedHead\
    \ = this.linkedList.deleteHead();\n47     return removedHead ? removedHead.value\
    \ : null;\n48   }\n```\n\n03-queue/Queue.js\n\n#### `peek`\n\nTo implement the\
    \ `peek()` operation, we won’t remove any elements from our list, we only get\
    \ the value from the head of our LinkedList object and return it.\n\n```\n17 \
    \  /**\n18    * @return {*}\n19    */\n20   peek() {\n21     if (!this.linkedList.head)\
    \ {\n22       // If linked list is empty then there is nothing to peek.\n23  \
    \     return null;\n24     }\n25 \n26     // Just read the value from the end\
    \ of linked list without deleting it.\n27     return this.linkedList.head.value;\n\
    28   }\n```\n\n03-queue/Queue.js\n\nAt this point, we’ve implemented the major\
    \ queue methods. Let’s implement several helper methods that will make our queue\
    \ usage more convenient.\n\n#### `isEmpty`\n\nLet’s implement a method that checks\
    \ if the queue is empty. To do that, we just need to check the head of the linked\
    \ list and make sure that no element exists:\n\n```\n 9   /**\n10    * @return\
    \ {boolean}\n11    */\n12   isEmpty() {\n13     // The queue is empty in case\
    \ if its linked list don't have tail.\n14     return !this.linkedList.head;\n\
    15   }\n```\n\n03-queue/Queue.js\n\n#### `toString`\n\nLet’s also implement `toString()`\
    \ method to make testing and debugging of our `Queue` class more convenient. This\
    \ method will re-use `toString()` method of our LinkedList class. It will accept\
    \ optional `callback()` function that may be used to convert each linked list\
    \ element to a string. It may be useful if we’re going to store objects in the\
    \ queue.\n\n```\n50   /**\n51    * @param [callback]\n52    * @return {string}\n\
    53    */\n54   toString(callback) {\n55     // Return string representation of\
    \ the queue's linked list.\n56     return this.linkedList.toString(callback);\n\
    57   }\n```\n\n03-queue/Queue.js\n\nOur basic implementation of the `Queue` class\
    \ is ready at this point. You may find full class code example in `code/src/03-queue/Queue.js`\
    \ file.\n\n### Complexities\n\n| Access | Search | Insertion (enqueue) | Deletion\
    \ (dequeue) |\n\n| --- | --- | --- | --- |\n\n| O(n) | O(n) | O(1) | O(1) |\n\n\
    When the queue is implemented with a LinkedList as in the example above, then\
    \ accessing and searching of the items are done through the Linked List search\
    \ method which traverses all the elements in the list. Therefore, these operations\
    \ are done in O(n) time.\n\nInsertion (enqueuing) and deletion (dequeuing) operations\
    \ are fast. For a Linked List it will take a constant amount of time O(1) to prepend\
    \ a new value to the beginning of the list or to delete the list’s tail.\n\n###\
    \ Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n*   [Implement Queues Using Stacks](https://leetcode.com/problems/implement-queue-using-stacks/)\n\
    \n*   [Design A Circular Queue](https://leetcode.com/problems/design-circular-queue/)\n\
    \n### Quiz\n\n*Q1: Is a Queue first-in-first-out or first-in-last-out?*\n\n*Q2:\
    \ What basic operations does Queue have: `peek() / enqueue() / dequeue()` or `peek()\
    \ / push() / pop()`?*\n\n*Q3: What is the time complexity of `enqueue()` operation\
    \ in a Queue?*\n\n### References\n\nQueue on Wikipedia <a href=”https://en.wikipedia.org/wiki/Queue*(abstract_data_type)”>https://en.wikipedia.org/wiki/Queue*(abstract_data_type)</a>\n\
    \nQueue on YouTube [https://www.youtube.com/watch?v=wjI1WNcIntg](https://www.youtube.com/watch?v=wjI1WNcIntg)\n\
    \nQueue example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/queue](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/queue)\n\
    \n## Stack\n\n*   *Difficulty: easy*\n\n### Stack and its common operations\n\n\
    A **stack** is a linear data structure that keeps its data in a stack or pile\
    \ manner. A data structure is said to be linear if its elements form a sequence.\
    \ Let’s think about a deck of playing cards that is face down. Each card is a\
    \ unit of data that the deck (or “Stack”) is holding. They are face down because\
    \ you don’t normally access the cards in the middle of the deck but you work with\
    \ the top of the stack instead. The basic operations you may perform with such\
    \ deck of playing cards are the following:\n\n*   You may *push* a new card on\
    \ top of the deck,\n\n*   you may *pop* a card from the top of the deck,\n\n*\
    \   you may *peek* a card from the top of the deck but leave it on the deck.\n\
    \nThese are the three most essential operations you normally use with a stack.\n\
    \nA stack uses *LIFO* (*last-in-first-out*) ordering which means that the latest\
    \ item you pushed to the stack is processed first. All the old items that are\
    \ pushed to the stack will need to wait until all the new ones are processed.\n\
    \n![](images/04-stack----stack.png)"
