  trans: "\n哈希冲突是导致哈表基本操作（如 `read`、`write`、`update` 和 `delete`）的时间复杂度可能从 `O(1)` 降至\
    \ `O(n)` 的主要原因。在最坏的情况下，由于桶的数量较少且哈希函数不完美，所有值都可能存储在`one` 桶中。这将导致哈表变得像一个链表。\n\n###\
    \ 实现\n\n让我们结合上述哈希表基本操作以及分离链法冲突解决方法，并使用“链表”章节中的 `LinkedList` 类来实现哈希表。\n\n首先，我们需要导入链表类以便在哈希表中使用。哈希表中的每个桶将拥有一个\
    \ `LinkedList` 作为值，我们可以在其中存储每个键值对对应的值。\n\n```\n1 import LinkedList from '../02-linked-list/LinkedList';\n\
    ```\n\n`src/05-hash-table/HashTable.js`\n\n接下来，我们将设置桶的大小：\n\n```\n3 // 桶的数量直接影响冲突的数量。\n\
    4 // 桶的数量越大，冲突就越少。\n5 // 为了演示，我们将哈希表的大小设置为一个\n6 // 较小的数字，以展示如何处理冲突。\n7 const defaultBucketsNumber\
    \ = 32;\n```\n\n`src/05-hash-table/HashTable.js`\n\n### `constructor`\n\n让我们从创建\
    \ `HashTable` 类开始：\n\n```\n9 export class HashTable {\n```\n\n`4-stack/Stack.js`\n\
    \n在构造方法中，我们链联了许多函数。让我们分解每个部分发生的情况，以便更好地理解正在发生什么。\n\n```\n10   /**\n11    * @param\
    \ {number} bucketsNumber - 存储哈表数据的桶的数量。\n12    *\n13    */\n14   constructor(bucketsNumber\
    \ = defaultBucketsNumber) {\n15     // 创建特定大小的哈表，并在每个桶中填充空链表。\n16     this.buckets\
    \ = Array(bucketsNumber).fill(null).map(() => new LinkedList());\n17   }\n```\n\
    \n`src/05-hash-table/HashTable.js`\n\n首先，我们创建一个新数组并用 `bucketsNumber` 值初始化它：\n\n\
    ```\nthis.buckets = new Array(bucketsNumber)\n```\n\n然后，我们用 `null` 值填充数组，以便对其进行遍历：\n\
    \n```\nthis.buckets = new Array(bucketsNumber).fill(null)\n```\n\n最后，我们将数组中所有新创建的值都设置为一个\
    \ `LinkedList` 对象：\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null).map(()\
    \ => new LinkedList());\n```\n\n### `hash`\n\n`hash()` 方法将字符串 `key` 转换为我们需要的桶索引，该索引用于存储指定\
    \ `key` 的值。如上所述，我们将使用一种简单的方法，根据键中每个字符的 ASCII 值之和来计算哈希。\n\n```\n18   /**\n19  \
    \  * 将键字符串转换为哈希数字。\n20    *\n21    * @param {string} key\n22    * @return {number}\n\
    23    */\n24   hash(key) {\n25     let hashCode = 0;\n26 \n27     // 遍历所有键字符，并将它们的代码加到哈希中。\n\
    28     for (let characterIndex = 0; characterIndex < key.length; characterIndex\
    \ += 1) {\n29       hashCode += key.charCodeAt(characterIndex);\n30     }\n31\
    \ \n32     // 缩小哈希数字以适应桶表的大小。\n33     return hashCode % this.buckets.length;\n\
    34   }\n```\n\n`src/05-hash-table/HashTable.js`\n\n首先，我们使用 `for` 循环遍历所有字符并计算它们的和。\n\
    \n```\nfor (let characterIndex = 0; characterIndex < key.length; characterIndex\
    \ += 1) {\n  hashCode += key.charCodeAt(characterIndex);\n}\n```\n\n接下来，我们应用取模运算符\
    \ `%`，这将把我们生成的哈希范围限制在可用桶的数量之内：\n\n```\n// 缩小哈希数字以适应桶表的大小。\nreturn hashCode % this.buckets.length;\n\
    ```\n\n如果我们的 `hashCode` 值等于 97 且 `this.buckets.length` 等于 50，函数将返回 `97 % 50 =\
    \ 47`。我们将使用索引为 47 的桶来存储键 ‘ab’ 的值。\n\n### `set`\n\n我们根据键和值向哈表中添加元素。\n\n```\n36\
    \   /**\n37    * 通过键添加或更新值。\n38    *\n39    * @param {string} key\n40    * @param\
    \ {*} value\n41    */\n42   set(key, value) {\n43     // 计算桶索引。\n44     const\
    \ keyHash = this.hash(key);\n45     // 获取特定桶索引的链表。\n46     const bucketLinkedList\
    \ = this.buckets[keyHash];\n47     // 在链表执行执行“按键查找”操作。\n48     const node = bucketLinkedList.find({\
    \ callback: nodeValue => nodeValue.key === key });\n50 \n51     // 检查带有指定键的值是否已存在于链表中。\n\
    52     if (!node) {\n53       // 插入新节点。\n55       bucketLinkedList.append({ key,\
    \ value });\n56     } else {\n57       // 更新现有节点。\n58       node.value = value;\n\
    59     }\n60   }\n```\n\n`src/05-hash-table/HashTable.js`\n\n我们开始计算键的哈希。该哈希值将指向桶索引。\n\
    \n```\nconst keyHash = this.hash(key);\n```\n\n接下来，获取存储在桶中的链表。\n\n```\nconst bucketLinkedList\
    \ = this.buckets[keyHash];\n```\n\n此时，我们需要检查正在尝试设置的值是否已存在于链表中。我们将使用 `find` 方法。\n\
    \n```\nconst node = bucketLinkedList.find({ callback: nodeValue => nodeValue.key\
    \ === key });\n```\n\n### `get`\n\n使用键从哈表中获取值的操作与 `set` 方法相似。唯一的区别是，在检查链表中是否存在该值后，返回其值或\
    \ `undefined`。\n\n```\n61   /**\n62    * 通过键获取值。\n63    *\n64    * @param {string}\
    \ key\n65    * @return {*}\n66    */\n67   get(key) {\n68     // 计算桶索引。\n69  \
    \   const keyHash = this.hash(key);\n70     // 获取特定桶索引的链表。\n71     const bucketLinkedList\
    \ = this.buckets[keyHash];\n72     // 在链表执行“按键查找”操作。\n73     const node = bucketLinkedList.find({\
    \ callback: nodeValue => nodeValue.key === key });\n74 \n75     // 检查带有指定键的值是否已存在于链表中。\n\
    76     return node ? node.value.value : undefined;\n77   }\n```\n\n`src/05-hash-table/HashTable.js`\n\
    \n### `delete`\n\n当我们从哈表中删除值时，我们使用与 `set` 方法相似的一些步骤。我们首先计算提供的键的哈希，然后获取桶的链表。最后，我们检查要删除的值是否存在于链表中。如果存在，我们使用\
    \ `LinkedList` 的 delete 方法并返回 `true`。否则，我们返回 `false`，表示没有可删除的内容。\n\n"
- fmt: "\n```\n 78   /**\n 79    * DELETE the value by its key.\n 80    *\n\n 81 \
    \   * @param {string} key\n 82    * @return {boolean}\n 83    */\n 84   delete(key)\
    \ {\n 85     // Calculate bucket index.\n 86     const keyHash = this.hash(key);\n\
    \ 87     // Fetch linked list for specific bucket index.\n 88     const bucketLinkedList\
    \ = this.buckets[keyHash];\n 89     // Perform 'find by key' operation in linked\
    \ list.\n 90     const node = bucketLinkedList.find({ callback: nodeValue => nodeValue.key\
    \ === ke\\\n 91 y });\n 92 \n 93     // Delete node from linked list if it exists\
    \ there.\n 94     if (node) {\n 95       bucketLinkedList.delete(node.value);\n\
    \ 96 \n 97       return true;\n 98     }\n 99 \n100     return false;\n101   }\n\
    ```\n\n`src/05-hash-table/HashTable.js`\n\nOur basic implementation of the `HashTable`\
    \ class is ready at this point. You may find full class code example in `code/src/05-hash-table/HashTable.js`\
    \ file.\n\n### Operations Time Complexity\n\n| Case | Search | Insertion | Deletion\
    \ | Comments |\n| --- | --- | --- | --- | --- |\n| **Average** | O(1) | O(1) |\
    \ O(1) | With good hash function and sufficient buckets number |\n| **Worst Case**\
    \ | O(n) | O(n) | O(n) | With bad hash function and too small buckets number |\n\
    \n### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n* [Design a HashSet](https://leetcode.com/problems/design-hashset/)\n\
    * [Design a HashMap](https://leetcode.com/problems/design-hashmap/)\n\n### Quiz\n\
    \n* Q1: What is the main advantage of a hash table compared to a linked list?\n\
    * Q2: What is the time complexity of `get()` operation in a hash table?\n* Q3:\
    \ What are collisions in hash tables?\n* Q4: What way(s) of handling the collision\
    \ do you know?\n\n### References\n\nHash table on Wikipedia [https://en.wikipedia.org/wiki/Hash_table](https://en.wikipedia.org/wiki/Hash_table)\n\
    Hash table on YouTube [https://www.youtube.com/watch?v=shs0KM3wKv8](https://www.youtube.com/watch?v=shs0KM3wKv8)\n\
    Hash table example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/hash-table](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/hash-table)\n\
    \n## Binary Search Tree (BST)\n\n* *Difficulty: medium*\n\nBefore we dive into\
    \ the topic of binary search trees, we first need to understand what `tree` and\
    \ `binary tree` data structures are.\n\n### Tree\n\nA `tree data structure` is\
    \ defined as a collection of nodes (starting at the `root node`), where each node\
    \ is a data structure consisting of a value and a list of references to nodes\
    \ (the “children”), with the constraints that there are no duplicate references,\
    \ and no references point to the root. These references are often referred to\
    \ as `edges`.\n\n#### What is a node?\n\n> A node is a basic unit used in computer\
    \ science. Nodes are individual parts of a larger data structure, such as linked\
    \ lists and tree data structures. Nodes contain data and also may link to other\
    \ nodes. Links between nodes are often implemented by pointers. -[Wikipedia](https://en.wikipedia.org/wiki/Node_(computer_science))\n\
    \nEvery node in a tree data structure (excluding the root node) is connected by\
    \ an edge from exactly one other node. All nodes form a `parent -> child` relationship,\
    \ and there are no cycles in the tree.\n\nHere is an example of a tree:\n\n![](images/06-binary-search-tree----tree.png)\n\
    \nIn this example, the tree consists of a set of `nodes` {\"a”, “b”, “c”, …, “i”}\
    \ and set of `edges` {\"ab”, “ac”, “bd”, …, “fi”} that form a parent-child relationship\
    \ between the nodes. The node “a” is the `root` of the tree and it has no parent\
    \ but has two `child` - nodes “b” and “c”. The node “f” in this example has one\
    \ `parent` “c” and three child nodes “g”, “h” and “i”. The nodes that don’t have\
    \ any children are called `leaf nodes`. In this example the nodes “d”, “e”, “g”,\
