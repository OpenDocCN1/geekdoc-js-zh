    ### 引言


    作为一名 JavaScript 开发者，你可能认为不需要学习数据结构或算法。


    你知道 JavaScript 本身（运行时+浏览器）使用了栈（stack）、堆（heap）和队列（queue）等吗？你对每天使用的 JavaScript 越了解，就越能驾驭它的力量并减少错误。如果你认为算法和数据结构只是一门对于
    JavaScript 开发者来说并非必需的计算机科学课程，请重新考虑！


    ### 如何阅读这本书


    每一章都涵盖了一个你可能在工作或面试中遇到的算法。你可以逐一研究这些算法，也可以自由跳读。


    ## 算法及其复杂度


    ### 什么是算法


    在本书中，我们将编写 `algorithms` —— 即为我们解决特定问题的步骤集合。


    我们在日常生活中不断使用 `algorithms`。例如，如果我们在某条街上，想回到住在 20 层的公寓？为了实现这一目标，我们可以采取以下操作：


    ```

    1. 走路回到家里。

    2. 使用楼梯上到第 20 层。

    ```


    这就是一个算法。我们定义并使用了一组解决“回家”任务的步骤。


    ### 算法复杂度


    让我们以上一节的“回家”问题为例。还有其他解决方法吗？有的，我们实现了不同的步骤（阅读“算法”部分）来实现该目标：


    ```

    1. 打一辆出租车送你回。。

    2. 使用电梯上到第 20 层。

    ```


    现在，让我们考虑在这两个算法中应该选择哪一个：


    首先，我们需要明确我们的限制条件（我们有多少钱、我们多急需回家、我们的健康状况如何），并`从这些限制条件的角度评估算法`。


    如你所见，这两种算法都需要不同的时间和资源。第一种需要更多的时间和精力，但钱较少。第二种需要的时间和精力较少，但钱更多。如果我们没钱且身体健康，我们需要选择第一种算法并享受步行。否则，如果我们有足够的钱且急需回家，第二种方案更好。


    我们刚刚所做的就是评估`每个算法的复杂度（complexity of each algorithm）`。


    #### 时间空间复杂度


    在上例中，我们评估了每个算法所需的时间和资源（即金钱和或健康）。我们将这些评估称为`时间复杂度（time complexity）`和`资源复杂度（resource
    complexity）`。这两个特征对于我们决定哪种算法适合我们的需求至关重要。


    在书中，我们不会从日常计划规划的角度来处理“回家”问题（在这种情况下我们可能只应用直觉）。相反，我们将采用更具数学的方法。


    ### 大 O 表示


    #### 大 O 表示定义


    *大 O 表示用于根据算法运行时间或空间增长的情况对算法进行分类。*


    这里的关键在于，大 O 表示是一种相对指标，显示了算法的执行时间根据输入的大小增长有多快。时间和内存的绝对值随硬件而异，因此我们需要使用相对指标。同一个程序在某台计算机上可能执行需
    1 秒，而在另一台上可能需要 10 秒。因此，当你比较两个算法的时间复杂度时，要求它们在相同的定义的硬件配置上运行，这并不方便，有时也无法实现。


    大 O 表示定义了`输入大小 → 耗时`的时间复杂度以及`输入大小 → 消耗内存`的空间复杂度。它根据增长率来表征程序（函数）：相同增长率的不同程序可以使用相同的
    O 表示。


    使用字母 O 是是因为程序（函数）的增长率也被称为函数的阶数（order of the function）。


    #### 大 O 表示解释


    让我们通过上述“回家”算法来说明大 O 概念，特别是算法中的“爬楼梯”部分。


    想象我们有两个男人：一个是年轻且快速的奥运冠军，另一个是典型的中年男性。我们刚刚同意，我们希望爬楼梯算法的复杂度对这两个来说是相同的，因此它不应该取决于人的速度，而应该取决于他们爬得有多高。在计算机方面，我们的算法分析不取决于硬件，而取决于软件问题本身。这两个男人到达第
    20 层需要走多少步？嗯，假设每层之间有 20 台阶。这意味着他们需要走 `20 * 20 = 400` 步才能到达第 20 层。让我们为 `n` 层进行泛化：


    ```

    输入：(20 * n) 步

    输出：(20 * n) 步（移动）

    ```


    '
- fmt: "\nDo you see the pattern here? The time complexity of climbing the stairs\
    \ has a linear dependency on the number of floors. In Big O syntax, this is written\
    \ as follows:\n\n```\nO(20 * n)\n```\n\nOne important rule to understand here:\n\
    \n> We must always get rid of non-dominant parts when describing complexity using\
    \ Big O notation: `O(n + 1)` becomes `O(n)`, `O(n + n^2)` becomes `O(n^2)`, `O(n\
    \ + log(n))` becomes `O(n)` and so on.\n\nWhy is that? Because Big O must describe\
    \ the order of the function and not an exact number of milliseconds or megabytes\
    \ it consumes. It describes the trend and not absolute values. Therefore non-dominant\
    \ constants do not matter. Non-dominant constants are the ones we may discard\
    \ for huge values of `n`. For example in a situation when `n = 10000` which of\
    \ these two parts will influence the final number more: `20` or `n = 10000`? It\
    \ is obvious that the influence of `n` to the final number is `500` times bigger\
    \ than the constant `20`. Therefore, we may discard it and the time complexity\
    \ of the “stairs climbing” algorithm is as follows:\n\n```\nO(n)\n```\n\nThis\
    \ was an example of linear dependency, but there are other types of dependency\
    \ exists as well: `O(log(n))`, `O(n * log(n))`, `O(n^2)`, `O(2^n)`, `O(n!)` etc.\n\
    \nTake a look at the graphs of functions commonly used in the analysis of algorithms,\
    \ showing the number of operations `N` versus input size `n` for each function.\n\
    \n![](images/01-algorithms-and-their-complexities----big-o-charts.png)\n\nAll\
    \ these graphs show us how fast our function’s memory and time consumption will\
    \ grow depending on the input. Two different array sorting algorithms may accomplish\
    \ the same task of sorting but one will do it in `O(n * log(n))` and another one\
    \ in `O(n^2)` time. If we have a choice, we would prefer the first one over the\
    \ second one.\n\n*With Big O notation we may compare algorithms (functions, programs)\
    \ based on their Big O value independently of the hardware they are running on.*\n\
    \nTake a look at the list of some of the most common Big O notations and their\
    \ performance comparisons against different sizes of the input data. This will\
    \ give you the feeling of how different algorithms complexities (time and memory\
    \ consumptions) may be.\n\n| Big O Notation | Computations for 10 elements | Computations\
    \ for 100 elements | Computations for 1000 elements |\n| --- | --- | --- | ---\
    \ |\n| `O(1)` | 1 | 1 | 1 |\n| `O(log(n))` | 3 | 6 | 9 |\n| `O(n)` | 10 | 100\
    \ | 1000 |\n| `O(n log(n))` | 30 | 600 | 9000 |\n| `O(n^2)` | 100 | 10000 | 1000000\
    \ |\n| `O(2^n)` | 1024 | 1.26e+29 | 1.07e+301 |\n| `O(n!)` | 3628800 | 9.3e+157\
    \ | 4.02e+2567 |\n\n## Big O Notation Examples\n\nLet’s move on and see some other\
    \ examples of big o notation.\n\n### O(1) example\n\nLet’s write a function that\
    \ raises a number to a specified power:\n\n```\n 1 /**\n 2  * Raise number to\
    \ the power.\n 3  *\n 4  * Example:\n 5  * number = 3\n 6  * power = 2\n 7  *\
    \ output = 3^2 = 9\n 8  *\n 9  * @param {number} number\n10  * @param {number}\
    \ power\n11  * @return {number}\n12  */\n13 export function fastPower(number,\
    \ power) {\n14   return number ** power;\n15 }\n```\n\n`01-algorithms-and-their-complexities/fastPower.js`\n\
    \nWhat would be its time and space complexities?\n\nLet’s think about how the\
    \ input of the function will affect the number of operations it will accomplish.\
    \ For every input, the function does exactly one operation. That would mean that\
