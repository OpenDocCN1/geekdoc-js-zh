  trans: "\n\n```javascript\n 1 // 依赖。\n 2 import combineWithoutRepetitions from './combineWithoutRepetitions';\n\
    \ 3 import combineWithRepetitions from './combineWithRepetitions';\n 4 \n 5 //\
