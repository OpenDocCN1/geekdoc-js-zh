  trans: "\n\n在我们开始实现排列算法之前，让我们假设我们已经实现了 `permutateWithoutRepetitions()` 和 `permutateWithRepetitions()`\
    \ 函数，并尝试使用它们。通过使用 `permutateWithRepetitions()`，我们将尝试生成锁的所有可能密码。而通过使用 `permutateWithoutRepetitions()`，我们将尝试生成三位参赛者比赛赛次结果的所有可能变体（假设数组中的\
    \ `0<sup>th</sup>` 位置表示该参赛者获得第一）。\n\n```javascript\n 1 // 导入依赖。\n 2 import permutateWithoutRepetitions\
    \ from './permutateWithoutRepetitions';\n 3 import permutateWithRepetitions from\
    \ './permutateWithRepetitions';\n 4 \n 5 // 重复排列示例。\n 6 // 使用重复排列生成所有可能的密码组合。\n\
    \\\n 7 tions.\n 8 const possiblePasswordSymbols = ['A', 'B', 'C'];\n 9 const passwordLength\
    \ = 3;\n10 const allPossiblePasswords = permutateWithRepetitions(possiblePasswordSymbols,\
    \ passw\\\n11 ordLength);\n12 \n13 // eslint-disable-next-line no-console\n14\
    \ console.log(allPossiblePasswords);\n15 /*\n16   输出将是：\n17   [\n18     ['A',\
    \ 'A', 'A'],\n19     ['A', 'A', 'B'],\n20     ['A', 'A', 'C'],\n21     ['A', 'B',\
    \ 'A'],\n22     ['A', 'B', 'B'],\n23     ['A', 'B', 'C'],\n24     ['A', 'C', 'A'],\n\
    25     ['A', 'C', 'B'],\n26     ['A', 'C', 'C'],\n27     ['B', 'A', 'A'],\n28\
    \     ['B', 'A', 'B'],\n29     ['B', 'A', 'C'],\n30     ['B', 'B', 'A'],\n31 \
    \    ['B', 'B', 'B'],\n32     ['B', 'B', 'C'],\n33     ['B', 'C', 'A'],\n34  \
    \   ['B', 'C', 'B'],\n35     ['B', 'C', 'C'],\n36     ['C', 'A', 'A'],\n37   \
    \  ['C', 'A', 'B'],\n38     ['C', 'A', 'C'],\n39     ['C', 'B', 'A'],\n40    \
    \ ['C', 'B', 'B'],\n41     ['C', 'B', 'C'],\n42     ['C', 'C', 'A'],\n43     ['C',\
    \ 'C', 'B'],\n44     ['C', 'C', 'C'],\n45   ]\n46  */\n47 \n48 // 非重复排列示例。\n49\
    \ // 现在我们为三位参赛者生成所有可能的比赛结果。\n50 const racers = ['John', 'Bill', 'Jane'];\n51 const\
    \ racingResults = permutateWithoutRepetitions(racers);\n53 \n54 // eslint-disable-next-line\
    \ no-console\n54 console.log(racingResults);\n55 /*\n56   输出将是：\n57   [\n58  \
    \   ['John', 'Bill', 'Jane'],\n59     ['Bill', 'John', 'Jane'],\n60     ['Bill',\
    \ 'Jane', 'John'],\n61     ['John', 'Jane', 'Bill'],\n62     ['Jane', 'John',\
    \ 'Bill'],\n63     ['Jane', 'Bill', 'John'],\n64   ]\n65 */\n```\n\n19-permutations/example.js\n\
    \n### 实现\n\n#### 重复排列\n\n我们将通过递归来解决这个问题。例如，如果我们需要为大小为 `3` 的集合 `{A, B, C}` 找到所有重复排列，我们执行以下操作：\n\
    \n* 记住集合中的第一个元素 `A`，\n* 为集合 `S = {A, B, C}` 找到大小为 `r = 1` 的所有排列，\n* 将 `A` 与上一步中所有较小的排列进行拼接，\n\
    * 记住集合中的第二个元素 `B`，\n* 为集合 `S = {A, B, C}` 找到大小为 `r = 1` 的所有排列，\n* 将 `B` 与上一步中所有较小的排列进行拼接，\n\
    * 依此类推……\n\n对于大小为 1 的排列，每个元素都是一个排列。因此，对于集合 `{A, B, C}`，大小为 `1` 的排列将是 `{A}`、`{B}`\
    \ 和 `{C}`。这将是我们递归函数的基础情况。\n\n![](img/19-permutations----permutations-with-repetitions.png)\n\
    \n查看下方该算法的 JavaScript 实现。\n\n```javascript\n 1 /**\n 2  * @param {*[]} permutationOptions\n\
    \ 3  * @param {number} permutationLength\n 4  * @return {*[]}\n 5  */\n 6 export\
    \ default function permutateWithRepetitions(\n 7   permutationOptions,\n 8   permutationLength\
    \ = permutationOptions.length,\n 9 ) {\n10   // 如果排列长度等于 1，则 permutationOptions\
    \ 中的每个元素\n11   // 都是一个排列。\n12   if (permutationLength === 1) {\n13     return\
    \ permutationOptions.map(permutationOption => [permutationOption]);\n14   }\n\
    15 \n16   // 初始化数组。\n17   const permutations = [];\n18 \n19   // 获取较小规模的排列。\n\
    20   const smallerPermutations = permutateWithRepetitions(\n21     permutationOptions,\n\
    22     permutationLength - 1,\n23   );\n24 \n25   // 遍历所有选项。\n26   permutationOptions.forEach((currentOption)\
    \ => {\n27     // 将当前选项与较小的排列拼接。\n28     smallerPermutations.forEach((smallerPermutation)\
    \ => {\n29       permutations.push([currentOption].concat(smallerPermutation));\n\
    30     });\n31   });\n32 \n33   // 返回排列。\n34   return permutations;\n35 }\n```\n\
    \n19-permutations/permutateWithRepetitions.js\n\n#### 非重复排列\n\n我们将通过递归解决这个问题。例如，如果我们需要找到大小为\
    \ 3 的集合的所有非重复排列，我们执行以下操作：\n\n* 提取集合的第一个元素 `A`，\n* 为集合 `S = {B, C}` 找到大小为 `2` 的所有排列，\n\
    * 将 `A` 与上一步中所有较小的排列进行拼接，\n* 提取集合的第二个元素 `B`，\n* 为集合 `S = {A, C}` 找到大小为 `2` 的所有排列，\n\
    * 将 `B` 与上一步中所有较小的排列进行拼接，\n* 依此类推……\n\n对于大小为 1 的排列，每个元素都是一个排列。因此，对于集合 `{A, B,\
    \ C}`，大小为 `1` 的排列将是 `{A}`、`{B}` 和 `{C}`。这将是我们递归函数的基础情况。这意味着通过每次迭代弹出一个元素，最终形成所有排列。单个元素的排列就是元素本身。\n\
    \n![](img/19-permutations----permutations-without-repetitions.png)\n\n查看下方该算法的\
    \ JavaScript 实现。\n\n```javascript\n1 /**\n * @param {*[]} permutationOptions\n\
    \ * @return {*[]}\n */\nexport default function permutateWithoutRepetitions(permutationOptions)\
    \ {\n // 如果只有一个元素需要排列，那么该元素就是排列本身。\n  if (permutationOptions.length === 1) {\n\
    \    return [permutationOptions];\n  }\n // 初始化排列数组。\n  const permutations = [];\n\
    \ \n // 获取排除第一个元素后 permutationOptions 的排列。\n // 通过这样做我们从后续的所有排列中排除第一个元素。\n  const\
    \ smallerPermutations = permutateWithoutRepetitions(permutationOptions.slice(1));\n\
    \ \n // 将第一个选项插入到较小排列的所有可能位置。\n  const firstOption = permutationOptions[0];\n\
    \  for (let permIndex = 0; permIndex < smallerPermutations.length; permIndex++)\
    \ {\n    const smallerPermutation = smallerPermutations[permIndex];\n \n    //\
    \ 在 smallerPermutation 的每个可能位置插入第一个选项。\n    for (let positionIndex = 0; positionIndex\
    \ <= smallerPermutation.length; positionIndex++) {\n      const permutationPrefix\
    \ = smallerPermutation.slice(0, positionIndex);\n      const permutationSuffix\
    \ = smallerPermutation.slice(positionIndex);\n      permutations.push(permutationPrefix.concat([firstOption],\
    \ permutationSuffix));\n    }\n  }\n \n // 返回所有排列。\n  return permutations;\n}\n\
    ```\n\n"
- fmt: "\n# Q2: If we will need to generate all permutations without repetitions of\
    \ size `2` from the set of size `4`, how many permutations will we have?\n\n##\
    \ References\n\nPermutations on Wikipedia [https://en.wikipedia.org/wiki/Permutation](https://en.wikipedia.org/wiki/Permutation)\n\
    \nPermutations on “Math is Fun” [https://www.mathsisfun.com/combinatorics/combinations-permutations.html](https://www.mathsisfun.com/combinatorics/combinations-permutations.html)\n\
    \nPermutations on Medium [https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5](https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5)\n\
    \nPermutations example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/permutations](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/permutations)\n\
    \n## Sets. Combinations.\n\nDifficulty: medium\n\nIn mathematics, a `combination`\
    \ is a selection of items from a collection, such that (unlike permutations) the\
    \ `order of selection does not matter`. More formally, a `r-combination` of a\
    \ set `S` of size `n` is a subset of `r` distinct elements of `S`.\n\nFor example,\
    \ let’s say that we have a set of 5 (`n = 5`) web developers `{Bill, John, Kate,\
    \ Mike, Julia}`. When you need to select 3 (`r = 3`) web developers out of 5 to\
    \ work on the new project it doesn’t matter which order you select them. The only\
    \ thing that matters is whether the developer has been selected or not. In a result\
    \ you may end up with combination `{John, Kate, Julia}` which is actually the\
    \ same as `{Kate, John, Julia}` because the order doesn’t matter. This is an example\
    \ of a `combination without repetition` because you can’t select the same developer\
    \ twice (the set `{Bill, Bill}` is not possible and doesn’t make sense).\n\nAnother\
    \ example of a combination is a change set that you generate out of the coins\
    \ set in your pocket. Let’s say you have a set of coins `{1, 1, 5, 5, 5, 10, 10,\
    \ 10}` and you need to give a change of 27 coins. You have a set of 3 unique elements\
    \ `{1, 5, 10}` (`n = 3`) and you’re allowed to pick the same element several times.\
    \ You may end up with the combination `{10, 10, 5, 1, 1}` (`r = 5`) which is the\
    \ same as `{1, 10, 10, 1, 5}` because the order doesn’t matter. This is an example\
    \ of a `combination with repetition` because you may include the same element\
    \ into a combination several times (the set of coins `{1, 1, 1}` is possible and\
    \ it makes sense).\n\n![](images/20-combinations----combinations.png)\n\n### Combinations\
    \ Without Repetitions\n\nLet’s take a simple example and form combinations *without*\
    \ repetitions of size `r = 2` out of a set `S = {A, B, C}` (`n = 3`). The combination\
    \ set `C` in this case will look like the following:\n\n```\nS = {A, B, C}\nr\
    \ = 2\n\nC = {\n    {A, B},\n    {A, C},\n    {B, C},\n}\n```\n\nNow, let’s try\
    \ to generalize this example and find out the formula of how many combinations\
    \ without repetitions (of size `r`) are there for the set of size `n`. We may\
    \ do it by following these two steps:\n\n* Assume that the order **does** matter\
    \ (like with permutations) and count the number of permutations of size `r` without\
    \ repetitions.\n* Afterwards assume that the order **does not** matter and eliminate\
    \ all duplicated combinations.\n\nFrom the chapter on permutations we already\
    \ know that the number of permutations without repetitions of size `r` for a set\
    \ of size `n` may be calculated as $P(n, r) = \\frac{n!}{(n - r)!}$. If we’re\
    \ dealing with the permutations of size `r = 2` for the set `S = {A, B, C}` we\
    \ will have $P(n, r) = \\frac{n!}{(n - r)!} = \\frac{3!}{(3 - 2)!} = 3! = 6$ permutations:\n\
    \n```\nS = {A, B, C}\nr = 2\n\nP = {\n    {A, B},\n    {B, A},\n    {A, C},\n\
    \    {C, A},\n    {B, C},\n    {C, B},\n}\n```\n\nThis set `P` is a permutation.\
    \ What if we’ll ignore the ordering and will treat subsets of a set `P` as combinations?\
    \ We will find out that `P` has duplicate combinations.\n\n```\nP = {\n    {A,\
    \ B},\n    {B, A}, <-- duplicate combination\n\n    {A, C},\n    {C, A}, <-- duplicate\
    \ combination\n\n    {B, C},\n    {C, B}, <-- duplicate combination\n}\n```\n\n\
    Now we need to figure out how many duplicates we have and eliminate them from\
    \ our calculations.\n"
