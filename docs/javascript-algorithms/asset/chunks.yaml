    \   */\n213   findMax() {\n214     if (!this.right) {\n215       return this;\n\
    216     }\n217 \n218     return this.right.findMax();\n219   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `toString()`\n\nThis is a helper method that returns a string representation\
    \ of the BST. It does in-order traversal first to convert the tree into a sorted\
    \ array of values. Then it converts the sorted array of values to a string.\n\n\
    ```\n298   /**\n299    * @return {string}\n300    */\n301   toString() {\n302\
    \     return this.traverseInOrder().toString();\n303   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n#### BinarySearchTree\n\n`BinarySearchTree` class is just a thin wrapper on\
    \ top of the `BinarySearchTreeNode` class that hides all the helper methods and\
    \ makes the work with BST more semantically correct.\n\n```\n 1 import BinarySearchTreeNode\
    \ from './BinarySearchTreeNode';\n 2 \n 3 export default class BinarySearchTree\
    \ {\n 4   constructor() {\n 5     this.root = new BinarySearchTreeNode(null);\n\
    \ 6   }\n 7 \n 8   /**\n 9    * Find the node by its value.\n10    * @param {*}\
    \ value\n11    * @return {BinarySearchTreeNode}\n12    */\n13   find(value) {\n\
    14     return this.root.find(value);\n15   }\n16 \n17   /**\n18    * Find the\
    \ node with min value.\n19    * @return {BinarySearchTreeNode}\n20    */\n21 \
    \  findMin() {\n22     return this.root.findMin();\n23   }\n24 \n25   /**\n26\
    \    * Find the node with max value.\n27    * @return {BinarySearchTreeNode}\n\
    28    */\n29   findMax() {\n30     return this.root.findMax();\n31   }\n32 \n\
    33   /**\n34    * Insert the new node in a tree.\n35    * @param {*} value\n36\
    \    * @param {*} [data] - node data (could be anything).\n37    * @return {BinarySearchTreeNode}\n\
    38    */\n39   insert(value, data = null) {\n40     return this.root.insert(value,\
    \ data);\n41   }\n42 \n43   /**\n44    * Check if tree contains the node with\
    \ specific value.\n45    * @param {*} value\n46    * @return {boolean}\n47   \
    \ */\n48   contains(value) {\n49     return this.root.contains(value);\n50   }\n\
    51 \n52   /**\n53    * Remove the node from a tree by its value.\n54    * @param\
    \ {*} value\n55    * @return {boolean}\n56    */\n57   remove(value) {\n58   \
    \  return this.root.remove(value);\n59   }\n60 \n61   /**\n62    * Convert tree\
    \ to string.\n63    * @return {string}\n64    */\n65   toString() {\n66     return\
    \ this.root.toString();\n67   }\n68 }\n```\n\n06-binary-search-tree/example.js\n\
    \n### Operations Time Complexity\n\n| Access | Search | Insertion | Deletion |\
    \ Comment |\n\n| --- | --- | --- | --- | --- |\n\n| O(log(n)) | O(log(n)) | O(log(n))\
    \ | O(log(n)) | For balanced trees |\n\nWe have `O(log(n))` time here because\
    \ every time we search/insert/remove anything from a tree we do the number of\
    \ operations that are proportional to the height of a tree which, in case of a\
    \ balanced tree, is described as `log(n)`.\n\nSince every search/insert/remove\
    \ operation is being done iteratively and on every iteration we’re cutting approximately\
    \ half of the tree off. This gives us `O(log(n))` time.\n\n### Problems Examples\n\
    \nHere are some related problems that you might encounter during the interview:\n\
    \n*   [Convert a Sorted List to a Binary Search Tree](https://leetcode.com/problems/convert-sorted-list-to-binary-search-tree/)\n\
    \n*   [Unique Binary Search Trees](https://leetcode.com/problems/unique-binary-search-trees/)\n\
    \n### Quiz\n\n*Q1: Does the root node in a tree have a parent node?*\n\n*Q2: Is\
    \ the node in a binary tree data structure allowed to have only one right child?*\n\
    \n*Q3: What type of binary search tree will have faster lookup: balanced or unbalanced?*\n\
    \n### References\n\nBST on Wikipedia [https://en.wikipedia.org/wiki/Binary_search_tree](https://en.wikipedia.org/wiki/Binary_search_tree)\n\
    \nBST on YouTube [https://www.youtube.com/watch?v=wcIRPqTR3Kc](https://www.youtube.com/watch?v=wcIRPqTR3Kc)\n\
    \nBST visualization [https://www.cs.usfca.edu/~galles/visualization/BST.html](https://www.cs.usfca.edu/~galles/visualization/BST.html)\n\
    \nBST example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/binary-search-tree](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/binary-search-tree)\n\
    \n## Binary Heap\n\n*   *Difficulty: medium*\n\nA **binary heap** is a binary\
    \ tree which also satisfies two additional constraints:\n\n*   *Shape property:*\
    \ a binary heap is a *complete binary tree*; that is, all levels of the tree,\
    \ except possibly the last one (deepest) are completely filled, and, if the last\
    \ level of the tree is not complete, the nodes of that level are filled from left\
    \ to right."
