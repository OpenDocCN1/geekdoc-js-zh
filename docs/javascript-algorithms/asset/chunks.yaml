  trans: "\n\n- [Wikipedia 上的组合](https://en.wikipedia.org/wiki/Combination)\n- [“Math\
    \ is Fun”上的组合](https://www.mathsisfun.com/combinatorics/combinations-permutations.html)\n\
    - [Medium 上的组合](https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5)\n\
    - [组合示例与测试用例](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/combinations)\n\
    \n## 排序：快速排序 (Quicksort)\n\n难度：中等\n\n### 任务\n\n将一个无序数值数组按升序排序。例如，一个无序数组 `[10,\
    \ 3, 0, 15, 10, 18, 2, 7, 11]` 升序排序后将变为：`[0, 2, 3, 7, 10, 10, 11, 15, 18]`。\n\n\
    除了排序数字，我们还希望能够对对象数组进行排序。为了实现这一点，我们将在算法中实现一个比较回调函数。例如，应该能够按年龄对数组 `[{name: \"Bill\"\
    , age: 23}, {name: \"Jane\", age: 18}]` 进行升序排序，得到数组 `[{name: \"Jane\", age: 18},\
    \ {name: \"Bill\", age: 23}]`。\n\n在任务描述中，我们只提到了按升序排序。不过一旦你理解了快速排序算法的原理，你就能修改算法来支持升序排序。\n\
    \n### 算法\n\n`Quicksort` 是一种效率为 `O(n * log(n))` 且常用的排序算法。快速排序是一种**比较排序**，这意味着它可以对任何定义了“小于”关系的类型项目进行排序。快速排序是一种**分治**算法。这意味着它将原始问题拆分成更小的子问题并尝试先解决这些子问题。然后合并较小问题的解决方案以得出最终解决方案。在我们例中，我们将数组分为两个部分，先排序较小的数组，然后再将它们合并成一个最终的排序数组。\n\
    \n该算法由三个递归（在子问题上重复）步骤组成：\n\n- **基准选择 (Pivot selection)**：从数组中选择一个元素，称为 `pivot`（通常取第一个、中间或最后一个）。\n\
    - **分区 (Partitioning)**：将数组分成三个子数组：`left`（包含所有小于基准元素的元素）、`center`（包含所有等于基准元素的元素）和\
    \ `right`（包含所有大于基准元素的元素）。\n- **递归 (Recurse)**：为它们选择新的基准元素并进一步分区，对较小的数组 `left`\
    \ 和 `right` 应用之前的两个步骤。我们不需要对 `center` 数组应用这些步骤，因为它已经是排序的并且包含了所有的相等元素。\n\n该算法的基准情况是排序仅有一个元素的数组。当数组中只有一个元素时，不需要进行排序，因此我们返回该值。\n\
    \n快速排序算法的递归步骤如图所示：\n\n![](img/21-quicksort----quicksort.png)\n\n### 使用示例\n\n在实现\
    \ `quickSort()` 函数之前，让我们假设我们已经实现了一个，并用它来在 `O(n * log(n))` 时间内排序用户名列表。这将帮助我们理解函数需要哪些参数，以及算法完成后结果将是什么。在这个示例中，我们将使用一个比较函数来排序数组。这允许我们在排序对象数组时使用自定义的比较逻辑。\n\
    \n```javascript\n 1 // 导入依赖项。\n 2 import quickSort from './quickSort';\n 3 \n\
    \ 4 // 让我们用 O(n * log(n)) 时间按年龄排序用户列表。\n 5 \n 6 // 初始化用户列表。\n 7 const notSortedUserList\
    \ = [\n 8   { age: 18, name: 'Bill' },\n 9   { age: 20, name: 'Kate' },\n10  \
    \ { age: 20, name: 'Tom' },\n11   { age: 24, name: 'Cary' },\n12   { age: 37,\
    \ name: 'Mike' },\n13   { age: 42, name: 'Ben' },\n14   { age: 50, name: 'Jane'\
    \ },\n15   { age: 60, name: 'Julia' },\n16 ];\n 17 \n18 // 创建一个比较两个用户对象的比较函数。\n\
    19 const userComparator = (user1, user2) => {\n20   if (user1.age === user2.age)\
    \ {\n21     return 0;\n22   }\n 23 \n24   return user1.age > user2.age ? 1 : -1;\n\
    25 };\n26 \n27 // 排序用户列表。\n28 const sortedUserList = quickSort(notSortedUserList,\
    \ userComparator);\n29 \n30 // eslint-disable-next-line no-console\n31 console.log(sortedUserList);\n\
    32 /*\n33   输出将为：\n34   [\n35       { age: 18, name: 'Bill' },\n36       { age:\
    \ 20, name: 'Kate' },\n37       { age: 20, name: 'Tom' },\n38       { age: 24,\
    \ name: 'Cary' },\n39       { age: 37, name: 'Mike' },\n40       { age: 42, name:\
    \ 'Ben' },\n41       { age: 50, name: 'Jane' },\n42       { age: 60, name: 'Julia'\
    \ },\n43   ]\n44  */\n```\n\n21-quicksort/example.js\n\n### 实现\n\n实现快速排序算法有多种方法。它们在两个方面有所不同：基准点的选择方式（第一个元素、中间元素、最后一个元素）以及分区的方式（就地、非原地）。你可以在\
    \ [JavaScript Algorithms 仓库](https://github.com/trekhleb/javascript-algorithms)\
    \ 中找到不同的实现。\n\n在本章中，我们将通过选择第一个元素作为基准点来实现快速排序，并采用“非原地”分区，以使算法的实现更加清晰易读。\n\n由于我们希望\
    \ `quickSort()` 函数不仅对数字排序，还能对对象排序，因此我们将重用已经在“二分查找”章节中实现的 `Comparator` 工具类。请参考“二分查找”章节以获取\
    \ `Comparator` 类的实现细节。这是一个简单的类，通过 `equal()`、`lessThan()` 和 `greaterThan()` 方法为对象比较提供通用的接口。\n\
    \n"
- fmt: "\n```javascript\n/**\n * @param {*[]} originalArray - array to be sorted.\n\
    \ * @param {function} comparatorCallback - function that compares two elements\n\
    \ * @return {*[]} - sorted array\n */\nexport default function quickSort(originalArray,\
    \ comparatorCallback = null) {\n  // Let's create comparator from the comparatorCallback\
    \ function.\n  // Comparator object will give us common comparison methods like\
    \ equal() and lessThan().\n  const comparator = new Comparator(comparatorCallback);\n\
    \n  // Clone original array to prevent it from modification.\n  // We don't do\
    \ in-place sorting in this example and thus we don't want side effects.\n  const\
    \ array = [...originalArray];\n\n  // If array has less than or equal to one elements\
    \ then it is already sorted.\n  // This is a base case for our recursion.\n  if\
    \ (array.length <= 1) {\n    return array;\n  }\n\n  // Init left and right arrays.\n\
    \  const leftArray = [];\n  const rightArray = [];\n\n  // Take the first element\
    \ of array as a pivot and init the center array.\n  const pivotElement = array.shift();\n\
    \  const centerArray = [pivotElement];\n\n  // Split all array elements between\
    \ left, center and right arrays.\n  // Since we're extracting elements out of\
    \ array we may just check array length to stop the loop.\n  while (array.length)\
    \ {\n    // Extract first element out from the unsorted array.\n    const currentElement\
    \ = array.shift();\n\n    // Compare extracted element to the pivot to decide\
    \ what sub-array\n    // it belongs to (left, center or right).\n    if (comparator.equal(currentElement,\
    \ pivotElement)) {\n      centerArray.push(currentElement);\n    } else if (comparator.lessThan(currentElement,\
    \ pivotElement)) {\n      leftArray.push(currentElement);\n    } else {\n    \
    \  rightArray.push(currentElement);\n    }\n  }\n\n  // Sort left and right arrays\
    \ recursively.\n  const leftArraySorted = quickSort(leftArray, comparatorCallback);\n\
    \  const rightArraySorted = quickSort(rightArray, comparatorCallback);\n\n  //\
    \ Let's now join sorted left array with center array and with sorted right array.\n\
    \  return leftArraySorted.concat(centerArray, rightArraySorted);\n}\n```\n\n`quicksort/quickSort.js`\n\
    \n### Complexities\n\n| Best | Average | Worst |\n| --- | --- | --- |\n| O(n *\
    \ log(n)) | O(n * log(n)) | O(n<sup>) |\n\nThe **worst case** scenario with `O(n²)`\
    \ time complexity might happen if we have an array that is already sorted in increasing\
    \ order and we always pick the first element of the array as the pivot point.\
    \ In this case, after the partitioning step, all the elements will be in the `right`\
    \ array leaving the `left` array empty. This situation will continue for all further\
    \ recursive partitions and we will end up with `(n - 1)` recursive steps in which\
    \ we will do full traversal over sub-arrays that will result in `O(n²)` time complexity.\n\
    \nThe **best case** scenario with `O(n * log(n))` time complexity will happen\
    \ when the pivot point will divide an array into two almost equal `left` and `right`\
    \ partitions. In this case, we will have `log(n)` levels in the quicksort diagram\
    \ (see the illustration above) with full sub-arrays traversal which gives us `O(n\
    \ * log(n))` time complexity.\n\n### Problems Examples\n\nHere are some related\
    \ problems that you might encounter during the interview:\n\n* [Sort List](https://leetcode.com/problems/sort-list/)\n\
    * [Kth Largest Element in an Array](https://leetcode.com/problems/kth-largest-element-in-an-array/)\n\
    \n### Quiz\n\n*Q1: On average, what is the time complexity of the Quicksort algorithm?\n\
    \n*Q2: How can we change our `quickSort()` function to make it sort the elements\
    \ in decreasing order?\n\n### References\n\nQuicksort on Wikipedia [https://en.wikipedia.org/wiki/Quicksort](https://en.wikipedia.org/wiki/Quicksort)\n\
    \nQuicksort on YouTube [https://www.youtube.com/watch?v=SLauY6PpjW4](https://www.youtube.com/watch?v=SLauY6PpjW4)\n\
    \nQuicksort example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort)\n\
    \n## Trees. Depth-First Search.\n\n*Difficulty: medium*\n\n### The Task\n\nImagine\
    \ that we have a tree of nodes and we want to:\n\n* check whether a specific node\
    \ exists in the tree\n* check whether two nodes are connected\n* visit all nodes\
    \ of the tree\n\n### The Algorithm\n\nOne of the ways to solve the tasks mentioned\
    \ above is depth-first search.\n\n**Depth-first search (DFS)** is an algorithm\
    \ for traversing tree or graph structures. The idea of the algorithm is to start\
    \ at some specific node (normally the root) and explore as far as possible along\
    \ each branch before backtracking.\n\nThe word *backtracking* means that when\
    \ we’re moving deeper along the branch and there are no more nodes to explore,\
    \ then we move back up the tree to find the next unexplored-branch.\n\nThe illustration\
    \ below shows the sequence of binary tree traversal.\n\nimages/22-tree-depth-search.png)\n\
    \nThink about this algorithm as if you are walking through a maze. As you walk,\
    \ you come upon intersections in the maze – these are like the nodes of our tree.\
    \ Each intersection has three options: take a *right* turn, take a *left* turn\
    \ or go *back* to the previous intersection (backtracking). Let’s say we’ve came\
    \ up with a strategy to try the right turns first. So we choose to go right and\
    \ mark the right turn with a paintbrush as “visited” to avoid this turn in the\
    \ future. If we come to a dead end in the maze (a leaf node), we backtrack until\
    \ we reach an intersection where we’ve gone right. Then we go to the left and\
    \ mark with our paintbrush the left turn as “visited”. Once we came to the intersection\
    \ with both turns being marked as “visited” we need to go back (backtrack) to\
    \ the previous intersection and find the first unvisited turn.\n\nThis algorithm\
    \ may be implemented recursively using a **stack** (see the Stack chapter for\
    \ an in-depth explanation on this data structure). The idea of using the stack\
    \ for depth-first search is the following:\n\n1. Pick the starting node and put\
    \ all its children into the stack.\n2. Pop the node from the stack to select the\
    \ next node to visit and push all its children into the stack.\n3. Go to step\
    \ 2 (repeat this process until the stack is empty).\n\n### Usage Example\n"
