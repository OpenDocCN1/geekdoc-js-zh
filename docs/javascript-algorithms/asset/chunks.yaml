    18 \n19 // Now let's establish friendship connections between the users of our\
    \ network.\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill, alice))\n22  \
    \ .addEdge(new GraphEdge(bill, john))\n23   .addEdge(new GraphEdge(bill, kate))\n\
    24   .addEdge(new GraphEdge(alice, ann))\n25   .addEdge(new GraphEdge(ann, sam))\n\
    26   .addEdge(new GraphEdge(john, ann))\n27   .addEdge(new GraphEdge(kate, tom));\n\
    28 \n29 // Now let's traverse the network in breadth-first manner staring from\
    \ Bill\n30 // and add all users we will encounter to the userVisits array.\n31\
    \ const userVisits = [];\n32 breadthFirstSearch(socialNetwork, bill, (user) =>\
    \ {\n33   userVisits.push(user);\n34 });\n35 \n36 // Now let's see in what order\
    \ the users have been traversed.\n37 // eslint-disable-next-line no-console\n\
    38 console.log(userVisits);\n39 /*\n40   The output will be:\n41   [bill, alice,\
    \ john, kate, ann, tom, sam]\n42 */\n```\n\n25-graph-breadth-first-search/example.js\n\
    \n### Implementation\n\n**Function arguments**\n\nAs described above the `breadthFirstSearch()`\
    \ function will accept three parameters:\n\n*   `graph` - graph that is going\
    \ to be traversed (instance of `Graph` class),\n\n*   `startVertex` - vertex that\
    \ we will use as a starting point (instance of `GraphVertex` class),\n\n*   `enterVertexCallback`\
    \ - callback that will be called on every vertex visit.\n\n**Visited vertices\
    \ memorization**\n\nWhen we’ve been implemented the breadth-first search algorithm\
    \ for trees we didn’t care about the case when the same node could be visited\
    \ twice during the traversal from different parents. It is because the tree node\
    \ by definition can’t have two or more parents. Otherwise it would become a graph.\
    \ So we have only *one way* to *enter* the node in a tree. But when we’re dealing\
    \ with graphs we need to remember that the same graph vertex may be visited *many\
    \ times* from many neighbor vertices. This way the same vertex may be added to\
    \ our traversal stack many times. That makes the whole traversal process inefficient\
    \ and may even cause an endless loop. That’s why we need to *mark all visited\
    \ vertices* while traversing a graph to avoid visiting the same vertex over and\
    \ over again. We will use `visitedVertices` object for that. The `key` value of\
    \ visited graph vertices will be the keys of `visitedVertices` object. This will\
    \ help us efficiently check if the node has been already visited in `O(1)` time.\n\
    \n**Usage of Queue**\n\nAs it was mentioned above in “The Algorithm” section we’re\
    \ going to implement breadth-first traversal using queues to store all the nodes\
    \ that are supposed to be visited. We may use JavaScript array as a simple Queue\
    \ with `unshift()` method for adding elements to the queue and `pop()` method\
    \ for fetching elements from the queue. But since we’ve already implemented the\
    \ `Queue` class earlier in this book we’ll use it here.\n\nThen using `while`\
    \ loop we’re visiting all the vertices from the queue until the queue is empty.\
    \ Every time we visit a new vertex we call a `enterVertexCallback()` and add all\
    \ unvisited neighbors of the `currentVertex` to the `vertexQueue`.\n\n```\n//\
    \ Import dependencies.\nimport { Queue } from '../03-queue/Queue';\n```\n\n25-graph-breadth-first-search/breadthFirstSearch.js\n\
    \n**Implementation example**\n\nWe will start implementing `breadthFirstSearch()`\
    \ with initial setup for the `vertexQueue` that will hold all the vertices we’re\
    \ going to visit and for the `visitedVertices` map that will hold keys of all\
    \ visited vertices to prevent them from visiting twice. Since we’re going to start\
    \ graph traversal from `startVertex` it should be added to both `vertexQueue`\
    \ and `visitedVertices` first."
