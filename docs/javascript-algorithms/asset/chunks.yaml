  trans: "\n然后我们创建两个变量，一个用于存储当前正在处理的数字，另一个用于存储上一个数字。\n\n```\n10   let currentValue\
    \ = 1;\n11   let previousValue = 0;\n```\n\n`11-fibonacci/fibonacci.js`\n\n如果我们只需要斐波那契数列中的第一个数字\
    \ (1)，那么直接返回数组：\n\n```\n13   if (n === 1) {\n14     return fibSequence;\n15  \
    \ }\n```\n\n`11-fibonacci/fibonacci.js`\n\n如果我们想要获取斐波那契数列中第一个数字以外的数字，我们创建一个 `iterationsCounter`\
    \ 变量来跟踪我们已经添加到数组中的数字。由于我们已经在数组中包含了 1，所以我们将 `iterationsCounter` 设置为 `n-1`：\n\n\
    ```\n16   let iterationsCounter = n - 1;\n```\n\n`11-fibonacci/fibonacci.js`\n\
    \n然后我们创建一个 `while` 循环，该循环会持续运行直到 `iterationsCounter` 达到 0。我们将当前值和之前计算的值相加，并将结果放入数组中。\n\
    \n```\n18   while (iterationsCounter) {\n19     currentValue += previousValue;\n\
    20     previousValue = currentValue - previousValue;\n21 \n22     fibSequence.push(currentValue);\n\
    23 \n24     iterationsCounter -= 1;\n25   }\n```\n\n`11-fibonacci/fibonacci.js`\n\
    \n最后，当我们跳出 `while` 循环后，返回我们的数组。\n\n```\n28   return fibSequence;\n29 }\n```\n\n\
    `11-fibonacci/fibonacci.js`\n\n### 计算第 N 斐波那契数\n\n计算第 N 个斐波那契数与创建一个斐波那契数组非常相似。与其将数字放入数组中，当我们到达第\
    \ N 个数字时，直接返回它。\n\n```\n 7 export default function fibonacciNth(n) {\n 8   let\
    \ currentValue = 1;\n 9   let previousValue = 0;\n10 \n11   if (n === 1) {\n12\
    \     return 1;\n13   }\n14 \n15   let iterationsCounter = n - 1;\n16 \n17   while\
    \ (iterationsCounter) {\n18     currentValue += previousValue;\n19     previousValue\
    \ = currentValue - previousValue;\n20 \n21     iterationsCounter -= 1;\n22   }\n\
    ```\n\n`11-fibonacci/fibonacciNth.js`\n\n### 计算第 N 斐波那契数（使用 Binet 公式）\n\nBinet\
    \ 公式是一种计算第 N 个斐波那契数的数学方法，而无需使用 `for` 或 `while` 循环。\n\n首先，我们计算 5 的平方根并将其保存到变量中：\n\
    \n```\n16   // 计算 √5 以在后续公式中使用。\n17   const sqrt5 = Math.sqrt(5);\n```\n\n`11-fibonacci/fibonacciNthClosedForm.js`\n\
    \n接下来，我们计算 `φ` (≈ 1.61803) 的值并将其保存到变量中\n\n```\n18   // 计算 φ 常数 (≈ 1.61803)。\n\
    19   const phi = (1 + sqrt5) / 2;\n```\n\n`11-fibonacci/fibonacciNthClosedForm.js`\n\
    \n最后，我们使用这两个值来计算第 N 个斐波那契数。你会注意到，我们使用了 EcmaScript 2017 中引入的幂运算符 (`**`)，而不是 `Math.pow()`。\n\
    \n```\n21   // 使用 Binet 公式计算斐波那契数。\n22   return Math.floor((phi ** position) /\
    \ sqrt5 + 0.5);\n```\n\n`11-fibonacci/fibonacciNthClosedForm.js`\n\n### 题目示例\n\
    \n以下是一些你在面试过程中可能会遇到的相关问题：\n\n*   [最长斐波那契数列长度](https://leetcode.com/problems/length-of-longest-fibonacci-subsequence/)\n\
    *   [将数组拆分为斐波那契数列](https://leetcode.com/problems/split-array-into-fibonacci-sequence/)\n\
    \n### 参考文献\n\nWikipedia 上的斐波那契数列 [`en.wikipedia.org/wiki/Fibonacci_number`](https://en.wikipedia.org/wiki/Fibonacci_number)\n\
    \nYouTube 上的斐波那契数列 [`www.youtube.com/watch?v=T8xgfVzef_E`](https://www.youtube.com/watch?v=T8xgfVzef_E)\n\
    \n斐波那契数列实现示例和测试例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/fibonacci`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/fibonacci)\n\
    \n## 素数测试\n\n*   **难度：简单**\n\n**质数**（或称为**素数**）是一个大于 `1` 的自然数，它不能通过两个较小的自然数相积得到。\n\
    \n> 自然数是任何大于等于 0 且不是分数或小数的数字\n\n大于 1 的非质数自然数称为合数。例如，`5` 是质数，因为将其写为乘积的唯一方式（`1 —\
    \ 5` 或 `5 — 1`）涉及 `5` 本身。然而，`6` 是合数，因为它是两个数字 `(2 — 3)` 的乘积。\n\n### 素数测试\n\n**素数测试**是一种用于判断给定整数是否为质数的算法。\n\
    \n### 应用\n\n素数测试用于密码学等许多领域。\n\n### 代码\n\n要判断一个数字是否为质数，我们首先确保该数字不能被 2 整除。如果能被 2\
    \ 整除，则它不是质数。\n\n```javascript\nfunction isPrime(number) {\n  if (number <= 1)\
    \ return false;\n  if (number === 2) return true;\n  if (number % 2 === 0) return\
    \ false;\n```\n\n接下来，我们检查该数字是否被其平方根范围任何奇数整除。如果任何数字的余数为 0，我们就知道它不是质数。\n\n```javascript\n\
    \  const limit = Math.sqrt(number);\n  for (let i = 3; i <= limit; i += 2) {\n\
    \    if (number % i === 0) return false;\n  }\n  return true;\n}\n```\n\n最后，如果我们一直运行到这里，就可以得出该数字是质数的结论。\n\
    \n### 为什么我们要使用数字的平方根？\n\n我们使用数字的平方根，是因为任何大于数字平方根的数字都会有一个对应的小于平方根的数字被使用。例如，36 的平方根是\
    \ 6。\n\n1 * 36 = 36\n2 * 18 = 36\n3 * 12 = 36\n4 * 9 = 36\n5 * 7.2 = 36\n6 * 6\
    \ = 36 – 第二个操作数小于 36 的平方根；我们不需要检查高于平方根的数字。\n\n"
- fmt: "\nPrimality test example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test)\n\
    \n# Is a power of two\n\n* *Difficulty: easy*\n\n### The Task\n\nGiven a positive\
    \ integer, write a function to find if it is a power of two or not.\n\n### Naive\
    \ solution\n\nIn the naive solution, we first check that the number is greater\
    \ than 1, if it is less than 1, it is not a power of 2.\n\n```\n5 export default\
    \ function isPowerOfTwo(number) {\n6   // 1 (2^0) is the smallest power of two.\n\
    7   if (number < 1) {\n8     return false;\n9   }\n```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\
    \nThen, we divide the number by 2 and check that the remainder is 0. If the remainder\
    \ is not 0, then the number is not a power of 2. If we continue dividing and reach\
    \ 1, then we know the number is a power of 2.\n\n```\n11   // Let's find out if\
    \ we can divide the number by two\n12   // many times without remainder.\n13 \
    \  let dividedNumber = number;\n14   while (dividedNumber !== 1) {\n15     if\
    \ (dividedNumber % 2 !== 0) {\n16       // For every case when remainder isn't\
    \ zero we can say that this number\n17       // couldn't be a result of power\
    \ of two.\n18       return false;\n19     }\n20 \n21     dividedNumber /= 2;\n\
    22   }\n23 \n24   return true;\n25 }\n```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\
    \n### Bitwise solution\n\nPowers of two in binary form always have just one bit.\
    \ The only exception is with a signed integer (e.g., an 8-bit signed integer with\
    \ a value of -128 looks like: `10000000`)\n\n```\n1 1: 0001\n2 2: 0010\n3 4: 0100\n\
    4 8: 1000\n```\n\nTo check if a number is a power of two, we first subtract 1\
    \ from the number.\n\nFor example, the number 8 looks like this in binary:\n\n\
    ```\n1 1000\n```\n\n8 - 1 in binary looks like this:\n\n```\n1 0111\n```\n\nAny\
    \ power of two minus 1 is all 1s except for the most significant bit. After subtracting\
    \ 1 from the number, we AND it with the number. If the result of the AND operation\
    \ is 0, we know it is a power of 2. If the result of the AND operation is 1, then\
    \ it is not a power of two.\n\n```\n1   1000\n2 & 0111\n3   ----\n4   0000 \n\
    ```\n\n```\n 5 export default function isPowerOfTwoBitwise(number) {\n 6   //\
    \ 1 (2^0) is the smallest power of two.\n 7   if (number < 1) {\n 8     return\
    \ false;\n 9   }\n10 \n11   /*\n12    * Powers of two in binary look like this:\n\
    13    * 1: 0001\n14    * 2: 0010\n15    * 4: 0100\n16    * 8: 1000\n17    *\n\
    18    * Note that there is always exactly 1 bit set. The only exception is with\
    \ a signe\\\n19 d integer.\n20    * e.g. An 8-bit signed integer with a value\
    \ of -128 looks like:\n21    * 10000000\n22    *\n23    * So after checking that\
    \ the number is greater than zero, we can use a clever lit\\\n24 tle bit\n25 \
    \   * hack to test that one and only one bit is set.\n26    */\n27   return (number\
    \ & (number - 1)) === 0;\n```\n\n`14-is-power-of-two/isPowerOfTwoBitwise.js`\n\
    \n### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n* [Power of Four](https://leetcode.com/problems/power-of-four/)\n\
    * [Reordered Power of Two](https://leetcode.com/problems/reordered-power-of-2/)\n\
    \n### Quiz\n\n*Q1: Is 32 a power of 2? Use the naive solution to find out*\n\n\
    *Q2: Is 31 a power of 2? Use the bitwise solution to find out*\n\n### References\n\
    \nBitwise solution on GeeksForGeeks [https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/](https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/)\n\
    \nBitwise solution on Stanford [http://www.graphics.stanford.edu/~seander/bithwise-operations/](http://www.graphics.stanford.edu/~seander/bithwise-operations/)\
    \ (Note: URL in source was incomplete, corrected for context)\n\n"
