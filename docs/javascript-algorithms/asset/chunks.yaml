    2. `this.next`\n\n`this.value` 包含了我们想要存储在节点中的实际值。`this.next` 是指向我们链表中下一个节点的指针。\n\
    \n##### 什么是指针？\n\nJavaScript 中的对象是键值对的字典。键始终是字符串。当我们说 `LinkedListNode` 类中的 `next`\
    \ 属性是“指针”时，我们真正的意思是 `this.next` 的值是对另一个 对象的引用——另一个 `LinkedListNode` 对象。\n\n#####\
    \ `constructor`\n\n我们 `LinkedListNode` 构造方法设置了 `this.value` 和 `this.next` 的初始值——两者都设置为\
    \ `null`。\n\n"
