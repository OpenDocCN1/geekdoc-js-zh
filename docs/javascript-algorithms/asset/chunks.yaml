  trans: "\n\nWikipedia 上的栈 <a href=\"https://en.wikipedia.org/wiki/Stack*(abstract_data_type)\"\
    >https://en.wikipedia.org/wiki/Stack*(abstract_data_type)</a>\n\nYouTube 上的栈 [`www.youtube.com/watch?v=wjI1WNcIntg`](https://www.youtube.com/watch?v=wjI1WNcIntg)\n\
    \n示例与测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack)\n\
    \n## 哈希表 (Hash Table)\n\n难度：中\n\n`hash table`（或哈希映射）是一种实现`关联数组抽象数据类型`的数据结构，这种结构可以`将键映射到值`。例如，在`电话簿`（哈希表）中，你的`name`（键）可以作为你的`phone\
    \ number`（值）的唯一标识符。在电话簿中处理手机的`常用操作`如下：\n\n```\n 1 //  HashTable 类。\n 2 import\
    \ { HashTable } from './HashTable';\n 3 \n 4 // 创建哈希表实例。\n 5 const phoneBook =\
    \ new HashTable();\n 6 \n 7 // 向电话簿添加几个联系人。\n 8 phoneBook.set('John Smith', '+112342345678');\n\
    \ 9 phoneBook.set('Bill Jones', '+111111111111');\n10 \n11 // 现在我们可以在 O(1) 时间内访问每个联系人的电话。\n\
    12 phoneBook.get('John Smith'); // => '+112342345678'\n13 phoneBook.get('Bill\
    \ Jones'); // => '+111111111111'\n14 \n15 // 删除电话号码。\n16 phoneBook.delete('John\
    \ Smith');\n17 phoneBook.get('John Smith'); // => undefined\n```\n\n`src/05-hash-table/HashTable.js`\n\
    \n理想情况下，哈希表允许我们以`O(1)` 的时间完成所有这些操作。相比之下，`Linked List`（链表）需要我们遍历列表中的`所有`节点来获取 John\
    \ Smith 的电话号码，查找时间为 `O(n)`。\n\n极高效的查找是哈希表的主要优势。\n\n但在最坏的情况下，哈希表的查找时间可能会达到 `O(n)`。我们将在本章节的后后部分讨论这种情况。\n\
    \n那么，我们该如何在哈希表中实现快速的 `O(1)` 查找呢？我们分配一个包含`buckets`（桶）或`slots`（槽）的数组，用于存储所有的哈希表数据。然后，我们需要将值的键映射到存储该值的桶的特定数字（索引或地址）。通过这种方式，我们只需要通过桶地址在\
    \ `O(1)` 时间内访问即可在哈希表中创建、读取和删除记录。\n\n构建哈希表存在某些局限性。桶的数量将有一个`固定大小`。这是因为任何程序都有特定的内存限制，我们不能假设为哈希表拥有无限的内存。\n\
    \n我们要映射到桶地址的键的大小可能是`任意的`（例如，`John Smith` 或仅为 `Jimmy`）。在桶数量有限的情况下，我们如何将任意大小的键映射到一个数字（索引或地址）？提示已经隐藏在“Hash\
    \ Table”这个数据结构的名称中了！那就是通过使用`hash function`（哈希函数）。\n\n### 哈希函数 (Hash Function)\n\
    \n`hash function` 是一种可以将`任意大小`的数据映射到`固定大小`数据的函数。哈希函数返回的值称为 `hash values`（哈希值）、`hash\
    \ codes`（哈希码）、`digests` 或简称为 `hashes`。\n\n在我们的情况下，哈希函数必须接受键（例如 `John Smith`）作为输入，并输出给定范围内的桶索引（例如，如果我们为桶分配一个大小为\
    \ 5 的数组，则从 `0` 到 `5`）。在现实世界中，桶的数量要得多。它应该与我们要存储在哈希表中的信息量成比例。\n\n哈希函数由两部分组成：\n\n\
    1. 将字符串转换为哈希码——理想情况下转换为键唯一数值表示。\n2. 使用模运算符将哈希码映射到特定的桶单元（因为桶的大小是的）。\n\n![](img/05-hash-table----hash-function.png)\n\
    \n#### 哈希函数示例\n\n有许多将字符串哈希为索引或地址的方法。计算字符串哈希的最简单方法之一是字符串中所有字符的 ASCII 码和。\n\n> 什么是\
    \ ASCII 码？\n\nASCII 代表美国信息交换标准（American Standard Code for Information Interchange），它是用数字表示英语字符的代码。计算机只理解\
    \ 1 和 0，这种代码我们将输入的字母转换为计算机可以理解的数字。\n\n让我们创建一个名为 `hash` 的 JavaScript 函数，将键和桶的数量作为参数。\n\
    \n```\n13 export function hash(key, bucketsNumber) {\n```\n\n`05-hash-table/hash.js`\n\
    \n我们将遍历字符串中的每个字符，并使用 JavaScript 的 `charCodeAt` 方法获取 ASCII 值。我们将这些代码相加得到 `hashCode`。\n\
    \n```\n14   let hashCode = 0;\n15   for (let characterIndex = 0; characterIndex\
    \ < key.length; characterIndex++) {\n16     hashCode += key.charCodeAt(characterIndex);\n\
    17   }\n18 \n19   // 减少哈数值以适应桶的大小。\n20   return hashCode % bucketsNumber;\n21\
    \ }\n```\n\n### 冲突解决 (Collision Resolution)\n\n理想情况下，哈希函数会将每个键分配到唯一的桶，但大多数哈希表设计采用不完美的哈希函数，这会导致哈希冲突，即哈希函数为多个键生成相同的索引。\n\
    \n链链法（Separate chaining）是一种技术，我们将每个桶转换为链表。这样每个桶就可以存储多个值而不仅仅是一个。如果发生冲突，我们将新值附加到桶链表的尾部。\n\
    \n![](img/05-hash-table----collisions.png)\n\n`read` 操作首先计算桶数，然后通过键在桶的链表中进行查找。在上面的示例中，使用链表获取\
    \ Billy Black 的电话号码所需的步骤如下：\n\n1. 计算 `Billy Black` 键的哈希码。假设 `Billy Black` 键的哈希码为\
    \ `11`。\n2. 通过模运算计算桶索引。如果有 `5` 个桶，我们得到的桶索引为 `11 % 5 = 1`。\n3. 从索引 `1` 的单元获取链表，并遍历它的每个值，将每个值的键与我们需要键（在本例中为\
    \ `Billy Black`）进行比较。一旦找到具有 `Billy Black` 键的链表节点，我们就直接返回它。\n\n"
- fmt: "\nHash function collisions are the main reason why time complexities for basic\
    \ hash table operations like `read`, `write`, `update` and `delete` may be downgraded\
    \ from `O(1)` to `O(n)`. In the worst case scenario, with a small number of buckets\
    \ and with imperfect hash function all values might be stored in just `one` bucket.\
    \ This will make the hash table act like a linked list.\n\n### Implementation\n\
    \nLet’s take the hash table basic operations that have been mentioned above along\
    \ with separate chaining collision resolution approach and implement the hash\
    \ table using the `LinkedList` class from the Linked List chapter.\n\nFirst, we’ll\
    \ need to import our Linked List class to be used in our hash table. Each bucket\
    \ in our hash table will have a `LinkedList` as the value where we will place\
    \ the values for each key/value pair.\n\n```\n1 import LinkedList from '../02-linked-list/LinkedList';\n\
    ```\n\n`src/05-hash-table/HashTable.js`\n\nNext, we’ll set our bucket size:\n\n\
    ```\n3 // Buckets number directly affects the number of collisions.\n4 // The\
    \ bigger the bucket number the less collisions we'll get.\n5 // For demonstration\
    \ purposes we set the hash table size to a\n6 // smaller number to show how collisions\
    \ are handled.\n7 const defaultBucketsNumber = 32;\n```\n\n`src/05-hash-table/HashTable.js`\n\
    \n### `constructor`\n\nLet’s start by creating `HashTable` class:\n\n```\n9 export\
    \ class HashTable {\n```\n\n`4-stack/Stack.js`\n\nIn our constructor method, we\
    \ have quite a few functions chained together. Let’s break down what’s going on\
    \ in each piece so we have a better understanding of what is happening.\n\n```\n\
    10   /**\n11    * @param {number} bucketsNumber - Number of buckets that will\
    \ hold hash table dat\\\n12 a.\n13    */\n14   constructor(bucketsNumber = defaultBucketsNumber)\
    \ {\n15     // Create hash table of certain size and fill each bucket with empty\
    \ linked list.\n16     this.buckets = Array(bucketsNumber).fill(null).map(() =>\
    \ new LinkedList());\n17   }\n```\n\n`src/05-hash-table/HashTable.js`\n\nFirst,\
    \ we create a new array and initialize it with the `bucketsNumber` value:\n\n\
    ```\nthis.buckets = new Array(bucketsNumber)\n```\n\nThen, we fill the array with\
    \ `null` values so we can loop over it:\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null)\n\
    ```\n\nFinally we set all of the newly created values in our array to a `LinkedList`\
    \ object:\n\n```\nthis.buckets = new Array(bucketsNumber).fill(null).map(() =>\
    \ new LinkedList());\n```\n\n### `hash`\n\nThe `hash()` method will convert the\
    \ string `key` to the index of a bucket we need to use to store the value for\
    \ the specified `key`. As it was described above we will use the simple approach\
    \ of calculating the hash based on the sum of ASCII code values of each character\
    \ in a key.\n\n```\n18   /**\n19    * Converts key string to hash number.\n20\
    \    *\n21    * @param {string} key\n22    * @return {number}\n23    */\n24  \
    \ hash(key) {\n25     let hashCode = 0;\n26 \n27     // Let's go through all key\
    \ characters and add their code to hash\n28     for (let characterIndex = 0; characterIndex\
    \ < key.length; characterIndex += 1) {\n29       hashCode += key.charCodeAt(characterIndex);\n\
    30     }\n31 \n32     // Reduce hash number so it would fit buckets table size.\n\
    33     return hashCode % this.buckets.length;\n34   }\n```\n\n`src/05-hash-table/HashTable.js`\n\
    \nFirst we go through all the characters using a `for` loop and calculate their\
    \ sum.\n\n```\nfor (let characterIndex = 0; characterIndex < key.length; characterIndex\
    \ += 1) {\n  hashCode += key.charCodeAt(characterIndex);\n}\n```\n\nNext, we apply\
    \ the modulo operator `%` that will limit the range of hashes we generate to the\
    \ number of available buckets:\n\n```\n// Reduce hash number so it would fit buckets\
    \ table size.\nreturn hashCode % this.buckets.length;\n```\n\nIf our `hashCode`\
    \ value equals 97 and `this.buckets.length` equals 50 the function will return\
    \ `97 % 50 = 47`. We will use the bucket with index 47 to store the value for\
    \ the key ‘ab’.\n\n### `set`\n\nWe add elements to a hash table based on it’s\
