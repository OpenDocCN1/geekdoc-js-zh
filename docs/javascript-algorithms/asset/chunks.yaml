    \ `O(n)` or `O(log(n))`?*\n\n*Q3: Is it true that algorithms with better time\
    \ complexity also have better space complexity?*\n\n## Linked List\n\n*   *Difficulty:\
    \ easy*\n\n### Linked list and its common operations\n\nA linked list is a collection\
    \ of entities which are not stored in sequential order. Instead, each entity has\
    \ a pointer to the next entity. Each entity, also referred to as a node, is composed\
    \ of data and a reference (in other words, a link) to the next node in the sequence.\n\
    \n![](images/02-linked-list----LinkedListNode.jpg)\n\nThis structure allows for\
    \ efficient insertion or removal of nodes from any position in the sequence during\
    \ iteration. More complex implementations of linked lists add additional links,\
    \ allowing efficient insertion or removal from arbitrary node references. A drawback\
    \ of linked lists is that access time is linear. Faster access, such as random\
    \ access, is not possible.\n\n**The main operations** on linked lists are:\n\n\
    *   *`prepend`* - add a node to the beginning of the list\n\n*   *`append`* -\
    \ add a node to the end of the list\n\n*   *`delete`* - remove a node from the\
    \ list\n\n*   *`deleteTail`* - remove the last node from the list\n\n*   *`deleteHead`*\
    \ - remove the first node from the list\n\n*   *`find`* - find a node in the list\n\
    \n### Applications\n\nA linked list is used as a good foundation for many other\
    \ data structures like queues, stacks and hash tables. The linked list implementation\
    \ we will create in JavaScript will be used for many of the other data structures\
    \ we will learn about in this book.\n\n### Implementation\n\nOur LinkedList implementation\
    \ will consist of two parts:\n\n*   A LinkedListNode class\n\n*   A LinkedList\
    \ class\n\nWe will explore the details of each of these classes in the following\
    \ sections.\n\n#### `LinkedListNode`\n\nOur `LinkedListNode` class is a class\
    \ that will represent one item in our collection of items. The `LinkedListNode`\
    \ has two important properties:\n\n1.  `this.value`\n\n2.  `this.next`\n\n`this.value`\
    \ contains the actual value we want to store in our node (a number, another object,\
    \ a string, etc). `this.next` is a pointer to the next node our list of nodes.\n\
    \n##### What is a pointer?\n\nObjects in JavaScript are dictionaries with key-value\
    \ pairs. Keys are always strings and values can be a boolean or strings, numbers\
    \ and objects. When we say our `next` property in our `LinkedListNode` class is\
