    12 \n13 // eslint-disable-next-line no-console\n14 console.log(allPossiblePasswords);\n\
    15 /*\n16   The output will be:\n17   [\n18     ['A', 'A', 'A'],\n19     ['A',\
    \ 'A', 'B'],\n20     ['A', 'A', 'C'],\n21     ['A', 'B', 'A'],\n22     ['A', 'B',\
    \ 'B'],\n23     ['A', 'B', 'C'],\n24     ['A', 'C', 'A'],\n25     ['A', 'C', 'B'],\n\
    26     ['A', 'C', 'C'],\n27     ['B', 'A', 'A'],\n28     ['B', 'A', 'B'],\n29\
    \     ['B', 'A', 'C'],\n30     ['B', 'B', 'A'],\n31     ['B', 'B', 'B'],\n32 \
    \    ['B', 'B', 'C'],\n33     ['B', 'C', 'A'],\n34     ['B', 'C', 'B'],\n35  \
    \   ['B', 'C', 'C'],\n36     ['C', 'A', 'A'],\n37     ['C', 'A', 'B'],\n38   \
    \  ['C', 'A', 'C'],\n39     ['C', 'B', 'A'],\n40     ['C', 'B', 'B'],\n41    \
    \ ['C', 'B', 'C'],\n42     ['C', 'C', 'A'],\n43     ['C', 'C', 'B'],\n44     ['C',\
    \ 'C', 'C'],\n45   ]\n46  */\n47 \n48 // PERMUTATIONS WITHOUT REPETITIONS EXAMPLE.\n\
    49 // Now let's generate all possible racing results for three racers.\n50 const\
    \ racers = ['John', 'Bill', 'Jane'];\n51 const racingResults = permutateWithoutRepetitions(racers);\n\
    52 \n53 // eslint-disable-next-line no-console\n54 console.log(racingResults);\n\
    55 /*\n56   The output will be:\n57   [\n58     ['John', 'Bill', 'Jane'],\n59\
    \     ['Bill', 'John', 'Jane'],\n60     ['Bill', 'Jane', 'John'],\n61     ['John',\
    \ 'Jane', 'Bill'],\n62     ['Jane', 'John', 'Bill'],\n63     ['Jane', 'Bill',\
    \ 'John'],\n64   ]\n65 */\n```\n\n19-permutations/example.js\n\n### Implementation\n\
    \n#### Permutations With Repetitions\n\nWe will solve this problem recursively.\
    \ For example, if we need to find all permutations with repetitions for the set\
    \ `{A, B, C}` of size `3` we do the following:\n\n*   remember the first element\
    \ `A` of the set,\n\n*   find all permutations of size `r = 1` for a set `S =\
    \ {A, B, C}`,\n\n*   concatenate `A` with all smaller permutations from the previous\
    \ step,\n\n*   remember the second element `B` of the set,\n\n*   find all permutations\
    \ of size `r = 1` for a set `S = {A, B, C}`,\n\n*   concatenate `B` with all smaller\
    \ permutations from the previous step,\n\n*   and so on…\n\nFor permutations of\
    \ size 1, each element is a permutation. So for the set `{A, B, C}` the permutations\
    \ of size `1` will be `{A}`, `{B}` and `{C}`. This will be our base case for our\
    \ recursive function.\n\n![](images/19-permutations----permutations-with-repetitions.png)\n\
    \nTake a look at JavaScript implementation of this algorithm below.\n\n```\n 1\
    \ /**\n 2  * @param {*[]} permutationOptions\n 3  * @param {number} permutationLength\n\
    \ 4  * @return {*[]}\n 5  */\n 6 export default function permutateWithRepetitions(\n\
    \ 7   permutationOptions,\n 8   permutationLength = permutationOptions.length,\n\
    \ 9 ) {\n10   // If permutation length is equal to 1 than every element of the\
    \ permutationOptions\n11   // is a permutation subset.\n12   if (permutationLength\
    \ === 1) {\n13     return permutationOptions.map(permutationOption => [permutationOption]);\n\
    14   }\n15 \n16   // Init permutations array.\n17   const permutations = [];\n\
    18 \n19   // Get permutations af smaller size that made of all permutation options.\n\
    20   const smallerPermutations = permutateWithRepetitions(\n21     permutationOptions,\n\
    22     permutationLength - 1,\n23   );\n24 \n25   // Recursively go through all\
    \ options and join it to the smaller permutations.\n26   permutationOptions.forEach((currentOption)\
    \ => {\n27     // Concatenate current options to smaller permutations.\n28   \
    \  smallerPermutations.forEach((smallerPermutation) => {\n29       permutations.push([currentOption].concat(smallerPermutation));\n\
    30     });\n31   });\n32 \n33   // Return permutations.\n34   return permutations;\n\
    35 }\n```\n\n19-permutations/permutateWithRepetitions.js\n\nWe’re using `concat()`\
    \ function to attach two arrays together.\n\n#### Permutations Without Repetitions\n\
    \nWe will solve this problem recursively. It means that we generate permutations\
    \ of a bigger size out of permutations of smaller sizes. For example, if we need\
    \ to generate all permutations of size `r = 3` without repetitions for a set `S\
    \ = {A, B, C, D}` we do the following:\n\n*   extract the first element `A` out\
    \ of the set,\n\n*   find all permutations of size `r = 2` for a set `S = {B,\
    \ C, D}`,\n\n*   concatenate `A` with all smaller permutations from the previous\
    \ step,\n\n*   extract the second element `B` out of the set,\n\n*   find all\
    \ permutations of size `r = 2` for a set `S = {C, D}`,\n\n*   concatenate `B`\
    \ with all smaller permutations from the previous step,\n\n*   and so on…\n\n\
    If we will continue applying this logic recursively by ejecting one element on\
    \ each iteration and forming the permutations out of the set of elements that\
    \ are left we’ll eventually end up forming permutations of one element. The permutation\
    \ of one element will be the element itself. This will be our base case for recursion\
    \ since we don’t need further recursion calls to calculate the permutations.\n\
    \n![](images/19-permutations----permutations-without-repetitions.png)\n\nTake\
    \ a look at JavaScript implementation of this algorithm below.\n\n```\n 1 /**\n\
    \ 2  * @param {*[]} permutationOptions\n 3  * @return {*[]}\n 4  */\n 5 export\
    \ default function permutateWithoutRepetitions(permutationOptions) {\n 6   //\
    \ If we have only one element to permutate then this element is already a permuta\\\
    \n 7 tion of itself.\n 8   if (permutationOptions.length === 1) {\n 9     return\
    \ [permutationOptions];\n10   }\n11 \n12   // Init permutations array.\n13   const\
    \ permutations = [];\n14 \n15   // Get all permutations for permutationOptions\
    \ excluding the first element.\n16   // By  doing this we're excluding the first\
    \ element from all further smaller permu\\\n17 tations.\n18   const smallerPermutations\
    \ = permutateWithoutRepetitions(permutationOptions.slice(1\\\n19 ));\n20 \n21\
    \   // Insert first option into every possible position of every smaller permutation.\n\
    22   const firstOption = permutationOptions[0];\n23   for (let permIndex = 0;\
    \ permIndex < smallerPermutations.length; permIndex += 1) {\n24     const smallerPermutation\
    \ = smallerPermutations[permIndex];\n25 \n26     // Insert first option into every\
    \ possible position of smallerPermutation.\n27     for (let positionIndex = 0;\
    \ positionIndex <= smallerPermutation.length; position\\\n28 Index += 1) {\n29\
    \       const permutationPrefix = smallerPermutation.slice(0, positionIndex);\n\
    30       const permutationSuffix = smallerPermutation.slice(positionIndex);\n\
    31       permutations.push(permutationPrefix.concat([firstOption], permutationSuffix));\n\
    32     }\n33   }\n34 \n35   // Return all permutations.\n36   return permutations;\n\
    37 }\n```\n\n19-permutations/permutateWithoutRepetitions.js\n\nWe’re using `concat()`\
    \ function to attach two arrays together.\n\n### Problems Examples\n\nHere are\
    \ some related problems that you might encounter during the interview:\n\n*  \
    \ [Clone Graph](https://leetcode.com/problems/clone-graph/)\n\n*   [Is Graph Bipartite?](https://leetcode.com/problems/is-graph-bipartite/)\n\
    \n*   [Number of Islands](https://leetcode.com/problems/number-of-islands/)\n\n\
    ### Quiz\n\n*Q1: Does the order of the elements matter when permuting the set?*"
