    \ GraphVertex {\n```\n\n08-graph/GraphVertex.js\n\n### `constructor`\n\n构造方法将接受顶点的\
    \ `value`。此外，在此方法中，我们将使用 `LinkedList` 类创建一个空的 `edges` 列表，用于存储所有相邻边。\n\n```javascript\n\
    \ 5   /**\n 6    * 顶点构造函数。\n 7    * @param {*} value\n8    */\n9   constructor(value)\
