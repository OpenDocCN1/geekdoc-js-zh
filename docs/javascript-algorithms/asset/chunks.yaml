    (i.e. finding the shortest path home in GPS navigator) where we must express our
    intuition about algorithm complexity in a much more strict, objective and mathematical
    way. When we speak about algorithms we normally use such metrics as *time complexity*
    (how much time the algorithm requires to solve a problem) and *space complexity*
    (how much memory the algorithm requires to solve a problem). These two metrics
    need to be evaluating to make a decision of which algorithm is better.


    The question is how we may express the values of time and space complexities in
    a more formal *mathematical* way. And here is where *big O notation* comes to
