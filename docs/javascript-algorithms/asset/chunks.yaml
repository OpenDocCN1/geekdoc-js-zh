  trans: "\n如果我们使用之前一个章节中实现的 `Queue` 类，那么 `Queue` 将遵循 FIFO（先入先出）顺序，但它不会考虑距离。例如，如果我们向队列中添加一个距离为\
    \ `20` 的顶点，然后向队列中添加一个距离为 `10` 的顶点，那么 `poll()` 操作将返回我们距离为 `20` 的顶点，因为它是先放入队列的——而不是距离较短的\
    \ `10` 顶点。因此，使用 `Queue` 是行不通的。\n\n另一种方法是将顶点访问队列存储为数组，每当我们我们需要从中获取下一个顶点时，可以遍历整个数组，并找到/返回具有最短距离的下一个顶点。这种方法可行，但时间复杂度为\
    \ `O(n)`。\n\n## 我们能让获取（polling）更快吗？\n\n是的，通过使用优先级队列（priority queue）可以。在这种情况下，获取操作的时间复杂度将为\
    \ `O(log(n))`，这使得算法运行得更快。\n\n你可以在本书的“优先级队列”章节中找到 `PriorityQueue` 类的完整描述以及实现示例。\n\
    \n## 逐步示例\n\n让我们采用上面的图，尝试应用 Dijkstra 算法寻找从 `Home` 顶点到所有顶点的最短路径。\n\n### 第 1 步\n\
    \n初始化所有顶点的临时距离。`startingVertex`（在我们案例中是 `Home` 顶点）的临时距离将为 `0`，这意味着到达 `Home` 不需要努力，因为我们已经在那里了。所有其他顶点的临时距离都被设置为\
    \ `Infinity`，因为我们不知道它们距离 `Home` 有多远，甚至不知道它们是否可达。\n\n我们将 `Home` 顶点添加到顶点优先级队列中，以便从它开始遍历图。\n\
    \n![](img/26-dijkstra----dijkstra-steps-step-1.png)\n\n### 第 2 步\n\n从优先级队列中获取下一个顶点。记住，每当我们从优先级队列中获取顶点时，它都会返回距离\
    \ `startingVertex` 最近的顶点。在我们的案例中，优先级队列中只有一个节点，就是 `Home` 顶点。因此当前顶点是 `Home`。\n\n\
    获取 `Home` 的所有邻居，并使用公式 `distanceToHome + distanceFromHomeToNeighbor` 设置它们的距离。在我们案例中，对于顶点\
    \ `A`，我们将距离设置为 `0 + 5 = 5`；对于顶点 `D`，我们将距离设置为 `0 + 8 = 8`。这意味着目前到 `A` 的最短距离是 `5`，到\
    \ `D` 的最短距离是 `8`。\n\n将顶点 `A` 和 `D` 推入优先级队列。\n\n一旦我们遍历了 `Home` 顶点的所有邻居，就可以将其标记为\
    \ `visited`（已访问）（你会看到下一个插图中 `Home` 节点被标记为黑色，这意味着它已被访问）。\n\n![](img/26-dijkstra----dijkstra-steps-step-2.png)\n\
    \n### 第 3 步\n\n从我们的顶点优先级队列中获取下一个离 `Home` 最近的未访问顶点。在我们案例中，队列中只有两个顶点，分别是 `A` 和 `D`。由于\
    \ `A` 顶点更离 `Home` 顶点（距离为 `5`），我们先访问它。\n\n获取 `A` 的所有未访问的邻居。邻居是顶点 `B` 和顶点 `C`。让我们使用公式\
    \ `distanceToA + distanceFromAtoNeighbor` 计算到邻居的最短路径。对于顶点 `B`，距离计算为 `5 + 9 = 14`。对于顶点\
    \ `C`，距离计算为 `5 + 3 = 8`。\n\n将新邻居 `B` 和 `C` 添加到顶点优先级队列。\n\n由于 `A` 的所有邻居已被访问，我们将\
    \ `A` 标记为已访问（它将在下一个插图中变为黑色）。\n\n![](img/26-dijkstra----dijkstra-steps-step-3.png)\n\
    \n### 第 4 步\n\n从我们的顶点优先级队列中获取下一个离 `Home` 最近的未访问顶点。在我们案例中，队列中只有三个顶点，分别是 `D`、`C`\
    \ 和 `B`。由于 `D` 和 `C` 顶点离 `Home` 最近（距离为 `8`），让我们查看它们中先添加到队列的顶点。它将是顶点 `D`。\n\n获取\
    \ `D` 的所有邻居（顶点 `C` 和 `E`），并计算到它们的最短距离。对于 `C`，我们将得到 `8 + 4 = 12`，对于 `8 + 6 = 14`。注意，顶点\
    \ `C` 已经有一个计算出的距离了。如果我们从顶点 `A` 去顶点 `C`，那么从 `Home` 到顶点 `C` 的距离将是 `8`。由于通过顶点 `D`\
    \ 从 `Home` 到顶点 `C` 的总距离比我们之前发现的长（`12 > 8`），因此我们放弃刚刚发现的距离（通过顶点 `D`），而采用最短路径方案（通过顶点\
    \ `A`）。因此此时顶点 `C` 的距离保持不变。\n\n将新邻居 `E` 添加到顶点优先级队列。没有需要将 `C` 加入队列，因为它已经在那里了。\n\n\
    将顶点 `D` 标记为已访问。\n\n![](img/26-dijkstra----dijkstra-steps-step-4.png)\n\n### 第\
    \ 5 步\n\n从顶点优先级队列中获取离 `Home` 最近的下一个顶点。在我们案例中是顶点 `C`。\n\n获取 `C` 的所有未访问邻居（在我们案例中是\
    \ `B` 和 `E`）。计算从 `C` 到它们的最短距离。对于 `B`，我们将得到 `8 + 5 = 13`，对于 `E`，我们将得到 `8 + 2 =\
    \ 10`。注意，我们刚刚发现了到 `B` 的更短路径。之前通过 `A` 到 `B` 的距离是 `14`，但现在我们发现通过 `C` 到 `B` 的距离更短，等于\
    \ `13`。这意味着我们需要更新优先级队列中 `B` 的距离为 `13`。\n\n将 `C` 的所有未访问邻居添加到优先级队列。\n\n将顶点 `C` 标记为已访问。\n\
    \n![](img/26-dijkstra----dijkstra-steps-step-5.png)\n\n### 第 6 步\n\n从顶点优先级队列中获取离\
    \ `Home` 最近的下一个顶点。在我们案例中是顶点 `E`。\n\n获取 `E` 的所有未访问邻居（在我们案例中是 `D` 和 `Office`）。计算从\
    \ `E` 到 `D` 和 `Office` 的最短距离。对于 `D`，我们将得到 `10 + 2 = 12`，对于 `Office`，我们将得到 `10\
    \ + 4 = 14`。注意，顶点 `D` 已经有一个计算出的距离了。\n\n将 `Office` 添加到队列。\n\n将顶点 `E` 标记为已访问。\n\n\
    ![](img/26-dijkstra----dijkstra-steps-step-6.png)\n\n### 第 7 步\n\n从顶点优先级队列中获取离\
    \ `Home` 最近的下一个顶点。在我们案例中是顶点 `B`。\n\n获取 `B` 的所有未访问邻居并更新它们的距离。在我们案例中只有一个未访问邻居 `Office`，其距离为\
    \ `13 + 7 = 20`。由于它比之前发现的 `Office` 距离大（`20 > 14`），我们忽略它。\n\n将顶点 `B` 标记为已访问。\n\n\
    ![](img/26-dijkstra----dijkstra-steps-step-7.png)\n\n### 第 8 步\n\n最后我们到达队列中的最后一个节点，该节点没有未访问的邻居。这意味着我们可以停止，并且刚刚找到了从\
    \ `Home` 顶点到所有顶点的最短路径。\n\n![](img/26-dijkstra----dijkstra-steps-step-8.png)\n\n\
    ## 应用\n\nDijkstra 算法可以应用于以下领域：\n\n*   在 **GIS（地理信息系统）** 中，寻找地图上地理位置之间的最短路径（交通和距离可以表示为图权重）。\n\
    *   在 **计算机网络** 中（例如，点对点应用），寻找机器 A 和 B 之间的最短路径。\n\n## 使用示例\n\n在我们开始实现 `dijkstra()`\
    \ 函数之前，让我们假设已经实现了它，并看看我们希望它如何工作以及它应该什么样的接口（输入参数和返回值）。\n\n让我们采用上面“任务”部分的图，尝试寻找从\
    \ `Home` 顶点到所有顶点的最短路径，特别是从 `Home` 到 `Office` 的最短路径。\n\n![](img/26-dijkstra----graph.png)\n\
    \n在在调用 `dijkstra()` 函数时，我们希望传递我们要遍历的 `graph` 以及起始顶点 `startVertex`。\n\n该函数应该返回我们一个\
    \ `distances` 对象，其中包含从 `startVertex` 到所有顶点的最短路径。该对象可以是一个以顶点为键、最短距离为值的 map。例如：\n\
    \n```\n{\n  Home: 0,\n  A: 4,\n  Office: 10,\n  ...\n}\n```\n"
- fmt: "\nThis would mean that the shortest distance to the node with key `Office`\
    \ from `startVertex` is `10`. The shortest distance to the node with key `A` from\
    \ `startVertex` is `4`. The shortest distance to `Home` in this case is zero because\
    \ our `startVertex` has key `Home` and we don’t need to do anything to get there\
    \ since we’re already there.\n\nBut `distances` map will not give us an understanding\
    \ of what the shortest path to the `Office` is. We know that it will take us `10`\
    \ distance units (let’s say miles) to get there but we don’t know which path to\
    \ take. Therefore we need our `dijkstra()` function to also return us another\
    \ object that we call `previousVertices`. The idea of this object is that it is\
