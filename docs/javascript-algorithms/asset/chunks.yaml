  trans: "\n\n素性测试示例及用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/primality-test)\n\
    \n# 是否为 2 的幂\n\n* *难度：简单*\n\n### 任务\n\n给定一个正整数，编写一个函数来判断它是否为 2 的幂。\n\n### 朴素解（暴力解）\n\
    \n在素解中，我们首先检查该数字是否大于 1，如果小于 1，则它不是 2 的幂。\n\n```\n5 export default function isPowerOfTwo(number)\
    \ {\n6   // 1 (2⁰) 是最小的 2 的幂。\n7   if (number < 1) {\n8     return false;\n9 \
    \  }\n```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\n然后，我们将数字除以 2 并检查余数是否为 0。如果余数不是\
    \ 0，则该数字不是 2 的幂。如果我们继续除法并达到 1，我们就知道该数字是 2 的幂。\n\n```\n11   // 让我们看看是否可以多次将数字除以二\n\
    12   // 而没有余数。\n13   let dividedNumber = number;\n14   while (dividedNumber !==\
    \ 1) {\n15     if (dividedNumber % 2 !== 0) {\n16       // 对于任何余数不为 0 的情况，我们可以说这个数字\n\
    17       // 不可能是 2 的幂的结果。\n18       return false;\n19     }\n20 \n21     dividedNumber\
    \ /= 2;\n22   }\n23 \n24   return true;\n25 }\n```\n\n`14-is-power-of-two/isPowerOfTwo.js`\n\
    \n### 位运算解\n\n二进制形式的 2 的幂始终只有一个位。唯一的例外是符号整数（例如，值为 -128 的 8 位符号整数看起来像：`10000000`）\n\
    \n```\n1 1: 0001\n2 2: 0010\n3 4: 0100\n4 8: 1000\n```\n\n要检查一个数字是否为 2 的幂，我们首先从该数字减去\
    \ 1。\n\n例如，数字 8 在二进制中看起来如下：\n\n```\n1 1000\n```\n\n8 - 1 在二进制中看起来如下：\n\n```\n\
    1 0111\n```\n\n任何 2 的幂减 1 都除了最高位外全为 1。在从数字减去 1 后，我们将其与该数字进行与（AND）运算。如果与运算的结果为\
    \ 0，我们就知道它是 2 的幂。如果与运算的结果为 1，那么它不是 2 的幂。\n\n```\n1   1000\n2 & 0111\n3   ----\n\
    4   0000 \n```\n\n```\n 5 export default function isPowerOfTwoBitwise(number)\
    \ {\n 6   // 1 (2⁰) 是最小的 2 的幂。\n 7   if (number < 1) {\n 8     return false;\n\
    \ 9   }\n10 \n11   /*\n12    * 二进制形式的 2 的幂看起来如下：\n13    * 1: 0001\n14    * 2:\
    \ 0010\n15    * 4: 0100\n16    * 8: 1000\n17    *\n18    * 注意始终有一个 1 位被设置。唯一的例外是符号\n\
    19    * 整数。\n20    * 例如，值为 -128 的 8 位符号整数看起来像：\n21    * 10000000\n22    *\n23\
    \    * 所以在检查数字大于 0 后，我们可以使用一种巧妙的位\n24    * 技巧来测试是否只有一个位\n25    * 位被设置。\n26   \
    \ */\n27   return (number & (number - 1)) === 0;\n```\n\n`14-is-power-of-two/isPowerOfTwoBitwise.js`\n\
    \n### 题目示例\n\n以下是一些在面试中可能会遇到的的相关问题：\n\n* [4 的幂](https://leetcode.com/problems/power-of-four/)\n\
    * [重排后的 2 的幂](https://leetcode.com/problems/reordered-power-of-2/)\n\n### 测验\n\
    \n*Q1: 32 是 2 的幂吗？使用朴素解找出答案*\n\n*Q2: 31 是 2 的幂吗？使用位运算解找出答案*\n\n### 参考文献\n\nGeeksForGeeks\
    \ 上的位运算解 [`www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/`](https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/)\n\
    \nStanford 上的位运算解 [`www.graphics.stanford.edu/~seander/bithwise-operations/`](http://www.graphics.stanford.edu/~seander/bithwise-operations/)\
    \ （注：原文 URL 不完整，已根据上下文修正）\n\n"
- fmt: "\n```javascript\n  /**\n   * @param {function(a: *, b: *)} [compareFunction]\
    \ - It may be custom compare function that, let's\n   * say may compare custom\
    \ objects together.\n   */\n  constructor(compareFunction) {\n    this.compare\
    \ = compareFunction || Comparator.defaultCompareFunction;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `defaultCompareFunction()`\n\nThis is default fallback comparison function\
    \ that treats two arguments `a` and `b` as a string or a number and applies common\
    \ comparison operators to them like `===`, `<` and `>`.\n\n```javascript\n  /**\n\
    \   * Default comparison function. It just assumes that \"a\" and \"b\" are strings\
    \ or numbers.\n   * @param {(string|number)} a\n   * @param {(string|number)}\
    \ b\n   * @returns {number}\n   */\n  static defaultCompareFunction(a, b) {\n\
    \    if (a === b) {\n      return 0;\n    }\n\n    return a < b ? -1 : 1;\n  }\n\
    ```\n\n`utils/comparator/Comparator.js`\n\n### `equal()`\n\nThis function checks\
    \ if two variables are equal.\n\n```javascript\n  /**\n   * Checks if two variables\
    \ are equal.\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n \
    \  */\n  equal(a, b) {\n    return this.compare(a, b) === 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `lessThan()`\n\nThis function checks if variable `a` is less than `b`.\n\
    \n```javascript\n  /**\n   * Checks if variable \"a\" is less than \"b\".\n  \
    \ * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n  lessThan(a,\
    \ b) {\n    return this.compare(a, b) < 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `greaterThan()`\n\nThis function checks if variable `a` is greater than\
    \ `b`.\n\n```javascript\n  /**\n   * Checks if variable \"a\" is greater than\
    \ \"b\".\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n\
    \  greaterThan(a, b) {\n    return this.compare(a, b) > 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `lessThanOrEqual()`\n\nThis function checks if variable `a` is less than\
    \ or equal to `b`.\n\n```javascript\n  /**\n   * Checks if variable \"a\" is less\
    \ than or equal to \"b\".\n   * @param {*} a\n   * @param {*} b\n   * @return\
    \ {boolean}\n   */\n  lessThanOrEqual(a, b) {\n    return this.lessThan(a, b)\
    \ || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n### `greaterThanOrEqual()`\n\
    \nThis function checks if variable `a` is greater than or equal to `b`.\n\n```javascript\n\
    \  /**\n   * Checks if variable \"a\" is greater than or equal to \"b\".\n   *\
    \ @param {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n  greaterThanOrEqual(a,\
    \ b) {\n    return this.greaterThan(a, b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `linearSearch()`\n\nNow that we’ve implemented our `Comparator` utility\
    \ class let’s implement the `linearSearch()` function.\n\nThe `linearSearch()`\
    \ function compares each element of the array to the element we are trying to\
    \ find. The comparison is done using the `Comparator` class. Once the element\
    \ is found, its position is recorded in the `foundIndices` array.\n\n```javascript\n\
    export default function linearSearch(array, seekElement, comparatorCallback) {\n\
    \  const comparator = new Comparator(comparatorCallback);\n  const foundIndices\
    \ = [];\n\n  array.forEach((element, index) => {\n    if (comparator.equal(element,\
    \ seekElement)) {\n      foundIndices.push(index);\n    }\n  });\n\n  return foundIndices;\n\
    }\n```\n\n`15-linear-search/linearSearch.js`\n\n### Complexity\n\n| Space | Worst\
