  trans: "\n\n![](img/17-cartesian-product----cartesian-product.png)\n\n两个集合 `A` 和\
    \ `B` 的积集 `A×B` 中的元素数量可以计算为集合 `A` 和 `B` 长度的乘积 `|A|×|B|`。在上面的示例中，我们有两个长度为 3 的集合。这两个集合的乘积包含\
    \ `3 * 3 = 9` 个元素。\n\n也可以创建两个集合的笛卡尔积。例如，我们有一个毛衣颜色集合 `COLORS = {blue, red, yellow}`、领口形状集合\
    \ `NECK_FORMS = {round-neck, V−neck, polo−neck}` 以及一个尺寸集合 `SIZE = {XS, S, M, L,\
    \ XL, XXL}`，那么这三个集合的笛卡尔积看起来就像 `{(blue,round-neck,XS), (blue,round-neck,S), (blue,round-neck,M),\
    \ ..., (yellow,polo−neck,XXL)}`。\n\n### 应用\n\n扑克牌是笛卡尔积应用于花牌等级集合 `{A, K, Q, J,\
    \ 10, 9, 8, 7, 6, 5, 4, 3, 2}` 和花色集合 `{♠︎, ♣, ︎♥, ︎♦︎}` 的示例。这两个集合的乘积形成了标准的 52\
    \ 张牌牌 `{(A,♠), (A,♣), (A,♥), ..., (2,♦)}`。\n\n二维坐标系也是两个集合 `R×R` 的积集，其中 `R` 表示实数集。\n\
    \n通常，笛卡尔积可用于生成不同实体之间所有可能的配对（子集）。我们可以认为为汽车价格表生成 `(model, color)` 属性对，或者为毛衣目录生成\
    \ `(neck_form, size, color)` 属性子集等等。\n\n### 使用示例\n\n让我们使用我们的 `cartesianProduct()`\
    \ 函数来生成一副扑牌。\n\n```\n 1 // 导入依赖。\n 2 import cartesianProduct from './cartesianProduct';\n\
    \ 3 \n 4 // 初始化牌等级和花色的集合。\n 5 const cardRanks = ['A', 'K', 'Q', 'J', '10', '9',\
    \ '8', '7', '6', '5', '4', '3', '2'];\n 6 const cardSuits = ['♠', '♣', '♥', '♦'];\n\
    \ 7 \n 8 // 生成一副扑牌。\n 9 const cardDeck = cartesianProduct(cardRanks, cardSuits);\n\
    10 \n 11 // 检查牌组。\n 12 // eslint-disable-next-line no-console\n 13 console.log(cardDeck);\
    \ // -> [['A', '♠'], ['A', '♣'], ..., ['2', '♦']]\n```\n\n17-cartesian-product/example.js\n\
    \n### 实现\n\n为了实现 `cartesianProduct()` 函数，我们首先需要检查输入。如果输入错误且某些输入集合为空，函数将返回 `null`。然后，我们使用两个嵌套的\
    \ `for` 循环从两个输入集合 `setA` 和 `setB` 生成所有元素配对。\n\n```\n 1 /**\n 2  * 生成两个集合的笛卡尔积。\n\
    \ 3  * @param {*[]} setA\n 4  * @param {*[]} setB\n 5  * @return {*[]}\n 6  */\n\
    \ 7 export default function cartesianProduct(setA, setB) {\n 8   // 检查输入集合是否为空。\n\
    \ 9   // 否则返回 null，因为我们无法从它们生成笛卡尔积。\n10   if (!setA || !setB || !setA.length ||\
    \ !setB.length) {\n 11     return null;\n 12   }\n 13 \n 14   // 初始化积集。\n 15 \
    \  const product = [];\n 16 \n 17   // 现在，遍历第一个和第二个集合的所有元素并形成所有可能\\\n18 ble pairs。\n\
    19   for (let indexA = 0; indexA < setA.length; indexA += 1) {\n20     for (let\
    \ indexB = 0; indexB < setB.length; indexB += 1) {\n21       // 将当前积配对添加到积集。\n\
    22       product.push([setA[indexA], setB[indexB]]);\n23     }\n24   }\n 25 \n\
    \ 26   // 返回笛卡尔积集。\n 27   return product;\n 28 }\n```\n\n17-cartesian-product/cartesianProduct.js\n\
    \n### 复杂度\n\n如果我们生成两个集合 `A` 和 `B` 的积集，那么两个嵌套的 `for` 循环将产生 `|A| * |B|` 次循环，其中 `|A|`\
    \ 是集合 `A` 中的元素数量，`|B|` 是集合 `|B|` 中的元素数量。因此时间复杂度为 O(|A| * |B|)。\n\n额外的空间复杂度也是 O(|A|\
    \ * |B|)，因为我们分配了一个新数组来存放所有的笛卡尔积元素。\n\n### 问题示例\n\n这里是一些你可能感兴趣的相关问题：\n\n"
- fmt: "\nWe will implement a power set generator using two approaches: the bitwise\
    \ approach that we’ve discussed above and a backtracking approach that will be\
    \ described in the next section.\n\n### Bitwise Approach\n\nIn the bitwise approach,\
    \ we will use the fact that the binary representation of the numbers up to `2^n`\
    \ (where `n` is the size of a set) will represent bit masks for our original set\
    \ that will produce subsets.\n\nTake a look at the implementation below:\n\n```javascript\n\
    \ 1 /**\n 2  * Find power-set of a set using BITWISE approach.\n 3  *\n 4  * @param\
    \ {*[]} originalSet\n 5  * @return {*[][]}\n 6  */\n 7 export default function\
    \ bwPowerSet(originalSet) {\n 8   const subSets = [];\n 9 \n10   // We will have\
    \ 2^n possible combinations (where n is a length of original set).\n11   // It\
    \ is because for every element of original set we will decide whether to include\\\
    \n12 de\n13   // it or not (2 options for each set element).\n14   const numberOfCombinations\
    \ = 2 ** originalSet.length;\n15 \n16   // Each number in binary representation\
    \ in a range from 0 to 2^n does exactly what\\\n17  we need:\n18   // it shows\
    \ by its bits (0 or 1) whether to include related element from the set o\\\n19\
    \ r not.\n20   // For example, for the set {1, 2, 3} the binary number of 0b010\
    \ would mean that w\\\n21 e need to\n22   // include only \"2\" to the current\
    \ set.\n23   for (let combinationIndex = 0; combinationIndex < numberOfCombinations;\
    \ combinatio\\\n24 nIndex += 1) {\n25     const subSet = [];\n26 \n27     for\
    \ (let setElementIndex = 0; setElementIndex < originalSet.length; setElementIn\\\
    \n28 dex += 1) {\n29       // Decide whether we need to include current element\
    \ into the subset or not.\n30       if (combinationIndex & (1 << setElementIndex))\
    \ {\n31         subSet.push(originalSet[setElementIndex]);\n32       }\n33   \
    \  }\n34 \n35     // Add current subset to the list of all subsets.\n36     subSets.push(subSet);\n\
    37   }\n38 \n39   return subSets;\n40 }\n```\n\n`18-power-set/bwPowerSet.js`\n\
    \nOur function accepts only one argument: `originalSet` which is an array. Then\
    \ it creates a `subSets` array that will hold all generated subsets of a power\
    \ set.\n\nThe following line calculates the number of combinations. This number\
    \ also is the maximum number in a range of numbers that we use as bit masks. To\
    \ raise the number to the power we use `**` operator.\n\n```javascript\nconst\
    \ numberOfCombinations = 2 ** originalSet.length;\n```\n\nThe first `for` loop\
    \ goes over every number in our range `[0, numberOfCombinations]`. For each iteration,\
    \ it creates a new power set `subSet` array that will hold all elements of the\
    \ current subset that corresponds to the current `combinationIndex`.\n\nIn the\
    \ internal `for` loop, we iterate over the original set elements to see whether\
    \ we need to include each particular element or not. This is decided by checking\
    \ the appropriate bit in `combinationIndex`. If the bit at `setElementIndex` position\
    \ is set then we need to include the element with the index `setElementIndex`\
    \ to the `subSet`. Otherwise, we’re ignoring it.\n\nThe bit checking is happens\
    \ by using the following construction:\n\n```javascript\nif (combinationIndex\
    \ & (1 << setElementIndex)) {\n  // Add the element to the subset.\n}\n```\n\n\
    Here we’re shifting `1` to the left by `setElementIndex` positions (i.e. if `setElementIndex`\
    \ is 4 then `0b1 << 4` will give us `0b1000`). And then we’re doing logical *and*\
    \ operation to check if appropriate bit in `combinationIndex` is set (i.e. if\
    \ `combinationIndex` is `0b0100` and we’re doing `0b0100 & 0b1000` this will give\
    \ us `0` indicating the fact that the 4th bit of `combinationIndex` is not set).\n\
    \n### Backtracking Approach\n\nIn the backtracking approaches we try to generate\
    \ all possible solutions, but each time we generate next solution we test if it\
    \ satisfies all conditions (or try to make it satisfy all our conditions), and\
    \ only then continue generating subsequent solutions. Otherwise, backtrack, and\
    \ go on a different path of finding a solution.\n\nOn every iteration in our example,\
    \ we’re going to add one more valid element. Validity in our case is defined by\
    \ the rule that we don’t want to have duplicates in subsets. Thus, on every iteration,\
    \ we may add any elements from the original set except the ones that have been\
    \ already added.\n\nThis approach may be illustrated using the following decision\
    \ tree.\n\n![](images/18-power-set----power-set-backtracking.png)\n\nThis decision\
    \ tree helps us to decide what elements we may include at this particular moment.\
    \ And if there are no options, let’s go one step back (backtrack) and try another\
    \ valid option.\n\nSo, for example, let’s trace the decision tree in depth-first\
    \ manner:\n\n1. At the top, we have only one option and it is to add empty set.\
    \ We memorize `{}`.\n2. The next element we may add is `a`. We memorize `{a}`.\n\
    3. We may add `b` so far. We memorize `{a, b}`.\n4. We may add `c` now. We memorize\
    \ `{a, b, c}`.\n5. At this moment we have no other elements to add. Backtrack\
    \ now!\n6. The current subset is `{a}`.\n7. But we can add `c` now. So we memorize\
    \ `{a, c}`.\n8. And so on…\n\nNow let’s try to implement this approach in code:\n\
    \n```javascript\n 1 /**\n  * Find power-set of a set using BACKING approach.\n\
    \ 2  *\n 3  * @param {*[]} originalSet - Original set we're forming of.\n 4  *\
    \ @param {*[][]} allSubsets - All subsets that have been formed so far (empty\n\
    \ 5  * subset is included by default).\n 6  * @param {*[]} currentSubSet - Current\
    \ subset that we're forming at the moment.\n 7  * @param {number} startAt - The\
    \ position of in original set we're starting to form\n 8  * current subset.\n\
    \ 9  * @return {*[][]} - All subsets of original set.\n10 */\n11 export default\
    \ function btPowerSet(\n12   originalSet,\n13   allSubsets = [[]],\n14   currentSubSet\
    \ = [],\n15   startAt = 0,\n16 ) {\n17   // Let's iterate over originalSet elements\
    \ that may be added to the subset\n18   // without having duplicates. The value\
    \ of startAt prevents adding the duplicates.\n19   for (let position = startAt;\
    \ position < originalSet.length; position += 1) {\n20     // Let's push current\
    \ element to the subset\n21     currentSubSet.push(originalSet[position]);\n22\
    \ \n23     // Current subset is already valid so let's memorize it.\n24     //\
    \ We do array destruction here to save the clone of the currentSubSet.\n25   \
    \  // We need to save a clone since the original currentSubSet is going to be\n\
    26     // mutated in further recursive calls.\n27     allSubsets.push([...currentSubSet]);\n\
    28 \n29     // Let's try to generate all other subsets for the current subset.\n\
    30     // We're increasing the position by one to avoid duplicates in subset.\n\
    31     btPowerSet(originalSet, allSubsets, currentSubSet, position + 1);\n32 \n\
    33     // BACKTRACK. Exclude last element from the subset and try the next valid\
    \ one.\n34     currentSubSet.pop();\n35   }\n36 \n37   // Return all subsets of\
    \ a set.\n38   return allSubsets;\n39 }\n```\n\n### Complexities\n"
  raw: "We will implement a power set generator using two approaches: the bitwise\
    \ approach that we’ve discussed above and a backtracking approach that will be\
    \ described in the next section.\n\n#### Bitwise Approach\n\nIn the bitwise approach,\
    \ we will use the fact that the binary representation of the numbers up to *2<sup>n</sup>*\
    \ (where *n* is the size of a set) will represent bit masks for our original set\
    \ that will produce subsets.\n\nTake a look at the implementation below:\n\n```\n\
    \ 1 /**\n 2  * Find power-set of a set using BITWISE approach.\n 3  *\n 4  * @param\
    \ {*[]} originalSet\n 5  * @return {*[][]}\n 6  */\n 7 export default function\
    \ bwPowerSet(originalSet) {\n 8   const subSets = [];\n 9 \n10   // We will have\
    \ 2^n possible combinations (where n is a length of original set).\n11   // It\
    \ is because for every element of original set we will decide whether to inclu\\\
    \n12 de\n13   // it or not (2 options for each set element).\n14   const numberOfCombinations\
    \ = 2 ** originalSet.length;\n15 \n16   // Each number in binary representation\
    \ in a range from 0 to 2^n does exactly what\\\n17  we need:\n18   // it shows\
    \ by its bits (0 or 1) whether to include related element from the set o\\\n19\
    \ r not.\n20   // For example, for the set {1, 2, 3} the binary number of 0b010\
    \ would mean that w\\\n21 e need to\n22   // include only \"2\" to the current\
    \ set.\n23   for (let combinationIndex = 0; combinationIndex < numberOfCombinations;\
    \ combinatio\\\n24 nIndex += 1) {\n25     const subSet = [];\n26 \n27     for\
    \ (let setElementIndex = 0; setElementIndex < originalSet.length; setElementIn\\\
    \n28 dex += 1) {\n29       // Decide whether we need to include current element\
    \ into the subset or not.\n30       if (combinationIndex & (1 << setElementIndex))\
    \ {\n31         subSet.push(originalSet[setElementIndex]);\n32       }\n33   \
    \  }\n34 \n35     // Add current subset to the list of all subsets.\n36     subSets.push(subSet);\n\
    37   }\n38 \n39   return subSets;\n40 }\n```\n\n18-power-set/bwPowerSet.js\n\n\
    Our function accepts only one argument: `originalSet` which is an array. Then\
    \ it creates a `subSets` array that will hold all generated subsets of a power\
    \ set.\n\nThe following line calculates the number of combinations. This number\
    \ also is the maximum number in a range of numbers that we use as bit masks. To\
    \ raise the number to the power we use `**` operator.\n\n```\nconst numberOfCombinations\
    \ = 2 ** originalSet.length;\n```\n\nThe first `for` loop goes over every number\
    \ in our range `[0, numberOfCombinations]`. For each iteration, it creates a new\
    \ power set `subSet` array that will hold all elements of the current subset that\
    \ corresponds to the current `combinationIndex`.\n\nIn the internal `for` loop,\
    \ we iterate over the original set elements to see whether we need to include\
    \ each particular element or not. This is decided by checking the appropriate\
    \ bit in `combinationIndex`. If the bit at `setElementIndex` position is set then\
    \ we need to include the element with the index `setElementIndex` to the `subSet`.\
    \ Otherwise, we’re ignoring it.\n\nThe bit checking is happens by using the following\
    \ construction:\n\n```\nif (combinationIndex & (1 << setElementIndex)) {\n  //\
    \ Add the element to the subset.\n}\n```\n\nHere we’re shifting `1` to the left\
    \ by `setElementIndex` positions (i.e. if `setElementIndex` is 4 then `0b1 <<\
    \ 4` will give us `0b1000`). And then we’re doing logical *and* operation to check\
    \ if appropriate bit in `combinationIndex` is set (i.e. if `combinationIndex`\
    \ is `0b0100` and we’re doing `0b0100 & 0b1000` this will give us `0` indicating\
    \ the fact that the 4<sup>th</sup> bit of `combinationIndex` is not set).\n\n\
    #### Backtracking Approach\n\nIn the *backtracking approaches* we try to generate\
    \ all possible solutions, but each time we generate next solution we test if it\
    \ satisfies all conditions (or try to make it satisfy all our conditions), and\
    \ only then continue generating subsequent solutions. Otherwise, backtrack, and\
    \ go on a different path of finding a solution.\n\nOn every iteration in our example,\
    \ we’re going to add one more valid element. Validity in our case is defined by\
    \ the rule that we don’t want to have duplicates in subsets. Thus, on every iteration,\
    \ we may add any elements from the original set except the ones that have been\
    \ already added.\n\nThis approach may be illustrated using the following *decision\
    \ tree*.\n\n![](images/18-power-set----power-set-backtracking.png)\n\nThis decision\
    \ tree helps us to decide what elements we may include at this particular moment.\
    \ And if there are no options, let’s go one step back (backtrack) and try another\
    \ valid option.\n\nSo, for example, let’s trace the decision tree in *depth-first*\
    \ manner:\n\n1.  At the top of the tree, we have only one option and it is to\
    \ “add empty set”. We may now memorize empty set `{}` as a “power set” subset\
    \ and move on trying to add more elements to the empty set.\n\n2.  The next valid\
    \ element that we may add to our current subset is `a`. So memorize subset `{a}`\
    \ as a valid “power set” subset and move on trying to add something new to the\
    \ `{a}`.\n\n3.  At this moment we may add `b` since it was not yet added to the\
    \ current subset. So let’s memorize subset `{a, b}` as a valid “power set” subset\
    \ and let’s move on trying to add more valid elements to `{a, b}`.\n\n4.  We may\
    \ add `c` now since it has not been added so far. Let’s memorize `{a, b, c}` as\
    \ a valid subset and move on.\n\n5.  At this moment we don’t have any other elements\
    \ to add to `{a, b, c}` since we will have duplicates. Backtrack now! Get rid\
    \ of lastly added element (do one step to the top in our decision tree). Now the\
    \ current subset is `{a, b}`.\n\n6.  At this moment we still don’t have any other\
    \ element to add since `c` element has been already added before. Backtrack again!\
    \ Move one step to the top of our decision tree. The current subset now is `{a}`.\n\
    \n7.  At this moment the `b` element has been already added at step 3 so we can’t\
    \ add it now. But we can add `c` now. So we may memorize the current subset `{a,\
    \ c}` as a valid “power set” subset.\n\n8.  And so on…\n\nNow let’s try to implement\
    \ this approach in code:\n\n```\n 1 /**\n 2  * Find power-set of a set using BACKTRACKING\
    \ approach.\n 3  *\n 4  * @param {*[]} originalSet - Original set of elements\
    \ we're forming power-set of.\n 5  * @param {*[][]} allSubsets - All subsets that\
    \ have been formed so far (empty\n 6  * subset is included by default).\n 7  *\
    \ @param {*[]} currentSubSet - Current subset that we're forming at the moment.\n\
    \ 8  * @param {number} startAt - The position of in original set we're starting\
    \ to form \\\n 9 current subset.\n10  * @return {*[][]} - All subsets of original\
    \ set.\n11  */\n12 export default function btPowerSet(\n13   originalSet,\n14\
    \   allSubsets = [[]],\n15   currentSubSet = [],\n16   startAt = 0,\n17 ) {\n\
    18   // Let's iterate over originalSet elements that may be added to the subset\n\
    19   // without having duplicates. The value of startAt prevents adding the duplicates.\n\
    20   for (let position = startAt; position < originalSet.length; position += 1)\
    \ {\n21     // Let's push current element to the subset\n22     currentSubSet.push(originalSet[position]);\n\
    23 \n24     // Current subset is already valid so let's memorize it.\n25     //\
    \ We do array destruction here to save the clone of the currentSubSet.\n26   \
    \  // We need to save a clone since the original currentSubSet is going to be\n\
    27     // mutated in further recursive calls.\n28     allSubsets.push([...currentSubSet]);\n\
    29 \n30     // Let's try to generate all other subsets for the current subset.\n\
    31     // We're increasing the position by one to avoid duplicates in subset.\n\
    32     btPowerSet(originalSet, allSubsets, currentSubSet, position + 1);\n33 \n\
    34     // BACKTRACK. Exclude last element from the subset and try the next valid\
    \ one.\n35     currentSubSet.pop();\n36   }\n37 \n38   // Return all subsets of\
    \ a set.\n39   return allSubsets;\n40 }\n```\n\n18-power-set/bwPowerSet.js\n\n\
    ### Complexities\n\n#### Bitwise Approach"
