    \ `2 * 1 + 1 = 3`) and its right child being placed at index `4` (because `2 *\
    \ 1 + 2 = 4`).\n\n*   The parent node for the node with index `i = 4` has index\
    \ `1` (because `floor(4 - 1 / 2) = floor(1.5) = 1`)\n\n#### Storing Objects in\
