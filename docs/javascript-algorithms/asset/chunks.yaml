    \n### `remove()`\n\n在删除节点之前，我们先使用上面描述的 `find()` 函数在树中找到它。当我们找到正确的节点后，可能会出现以下几种情况：\n\
    \n- **删除叶子节点**：从父父节点中移除指向该节点的指针。\n- **删除只有一个子节点的节点**：将该唯一的子节点变为当前节点父节点的直接祖先。\n\
    - **删除有两个子节点的节点**：找到下一个较大的值（右分支中的最小值），并用该下一个较大的值节点替换当前节点。\n\n该方法使用了其他辅助方法，如 `removeChild()`、`findMin()`、`setValue()`、`setRight()`、`replaceChild()`\
    \ 和 `copyNode()`，这些方法将在下方实现。\n\n```\n221   /**\n222    * @param {*} value\n223\
    \    * @return {boolean}\n224    */\n225   remove(value) {\n226     const nodeToRemove\
    \ = this.find(value);\n227 \n228     if (!nodeToRemove) {\n229       throw new\
    \ Error('树中未找到该项目');\n230     }\n231 \n232     const { parent } = nodeToRemove;\n\
    233 \n234     if (!nodeToRemove.left && !nodeToRemove.right) {\n235       // 节点是叶子节点，因此没有子节点。\n\
    236       if (parent) {\n237         // 节点有父节点。只需从父节点移除指向该节点的指针。\n238        \
    \ parent.removeChild(nodeToRemove);\n239       } else {\n240         // 节点没有父节点。只需擦除当前节点的值。\n\
    241         nodeToRemove.setValue(undefined);\n242       }\n243     } else if\
    \ (nodeToRemove.left && nodeToRemove.right) {\n244       // 节点有两个子节点。\n245   \
    \    // 找到下一个较大的值（右分支中的最小值）\n246       // 并用该下一个较大的值替换当前值节点。\n247       const\
    \ nextBiggerNode = nodeToRemove.right.findMin();\n248       if (nextBiggerNode\
    \ !== nodeToRemove.right) {\n249         this.remove(nextBiggerNode.value);\n\
    250         nodeToRemove.setValue(nextBiggerNode.value);\n251       } else {\n\
    252         // 万一下一个右侧的值是下一个较大的值且它没有左\\\n253         ft 子节点\n254         // 则只需用右侧节点替换要删除的节点。\n\
    255         nodeToRemove.setValue(nodeToRemove.right.value);\n256         nodeToRemove.setRight(nodeToRemove.right.right);\n\
    257       }\n258     } else {\n259       // 节点只有一个子节点。\n260       // 将该子节点变为当前节点父节点的直接节点。\n\
    261       /** @var BinarySearchTreeNode */\n262       const childNode = nodeToRemove.left\
    \ || nodeToRemove.right;\n263 \n264       if (parent) {\n265         parent.replaceChild(nodeToRemove,\
    \ childNode);\n266       } else {\n267         BinarySearchTreeNode.copyNode(childNode,\
    \ nodeToRemove);\n268       }\n269     }\n270 \n271     // 清除被删除节点的父节点。\n272 \
    \    nodeToRemove.parent = null;\n273 \n274     return true;\n275   }\n```\n\n\
    `06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `traverseOrder()`\n\n该方法对二叉搜索树进行中序遍历，返回一个排序后的数组。它首先遍历左子树，然后是根节点，最后是右子树。\n\
    \n```\n276   /**\n277    * @return {Array}\n278    */\n279   traverseOrder() {\n\
    280     let traverse = [];\n281     if (this.left) {\n282       traverse = traverse.concat(this.left.traverseOrder());\n\
    283     }\n284     traverse.push(this.value);\n285 \n286     if (this.right) {\n\
    287       traverse = traverse.concat(this.right.traverseOrder());\n288     }\n\
    289     return traverse;\n290   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `setLeft()`\n\n该方法设置节点的左子节点。它会处理 `parent` 指针将其指向当前节点。\n\n```\n34   /**\n\
    35    * @param {BinarySearchTreeNode} node\n36    * @return {BinarySearchTreeNode}\n\
    37    */\n38   setLeft(node) {\n39     this.left = node;\n40     if (this.left)\
    \ {\n41       this.left.parent = this;\n42     }\n43     return this;\n44   }\n\
    ```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setRight()`\n\n\
    该方法设置节点的右子节点。它会处理 `parent` 指针将其指向当前节点。\n\n```\n55   /**\n56    * @param {BinarySearchTreeNode}\
    \ node\n57    * @return {BinarySearchTreeNode}\n58    */\n59   setRight(node)\
    \ {\n60     this.right = node;\n61     if (this.right) {\n62       this.right.parent\
    \ = this;\n63     }\n64     return this;\n65   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `setData()`\n\n`setData` 是一个我们用于设置节点 `data` 的辅助函数。我们返回 `this` 对象以允许链式调用。此方法使得操作树更加方便。我们可以像这样做：`bst.setValue(5).setData('User\
    \ name')`。\n\n```\n24   /**\n25    * @param {*} data\n26    * @return {BinarySearchTreeNode}\n\
    27    */\n28   setData(data) {\n29     this.data = data;\n30 \n31     return this;\n\
    32   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setValue()`\n\
    \n`setValue` 是一个我们用于设置节点 `value` 的辅助函数。我们返回 `this` 对象以允许链式调用。\n\n```\n14   /**\n\
    15    * @param {*} value\n16    * @return {BinarySearchTreeNode}\n17    */\n18\
    \   setValue(value) {\n19     this.value = value;\n20 \n21     return this;\n\
    22   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `contains()`\n\
    \n这是一个辅助方法，返回 `true` 或 `false`，显示树中是否存在具有指定 `value` 的节点。\n\n```\n191   /**\n192\
    \    * @param {*} value\n193    * @return {boolean}\n194    */\n195   contains(value)\
    \ {\n196     return !!this.find(value);\n197   }\n```\n\n"
- fmt: "\nThis method removes child node from the current node. It accepts the node\
    \ that is going to be removed by using the `nodeToRemove` parameter. Then it will\
    \ compare the node that is going to be removed with the left and right child of\
    \ the current node to decide which one should be removed. If the `nodeToRemove`\
    \ is found among the children then the child is set to `null` and the function\
    \ returns `true` as a sign the removal process was successful. Otherwise this\
    \ method returns `false` which means that `nodeToRemove` is not among the children\
    \ of the current node.\n\n```\n76   /**\n77    * @param {BinarySearchTreeNode}\
    \ nodeToRemove\n78    * @return {boolean}\n79    */\n80   removeChild(nodeToRemove)\
    \ {\n81     if (this.left && this.left === nodeToRemove) {\n82       this.left\
    \ = null;\n83       return true;\n84     }\n85 \n86     if (this.right && this.right\
    \ === nodeToRemove) {\n87       this.right = null;\n88       return true;\n89\
    \     }\n90 \n91     return false;\n92   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `replaceChild()`\n\nThis is a helper method that replaces a child node `nodeToReplace`\
    \ with `replacementNode`. First, it tries to find the `nodeToReplace` among children\
    \ of the current node. If the node can’t be found the method will return `false`.\
    \ Otherwise, it will change child pointer to point to the new node.\n\n```\n 94\
    \   /**\n95    * @param {BinarySearchTreeNode} nodeToReplace\n96    * @param {BinarySearchTreeNode}\
    \ replacementNode\n97    * @return {boolean}\n98    */\n99   replaceChild(nodeToReplace,\
    \ replacementNode) {\n100     if (!nodeToReplace || !replacementNode) {\n101 \
    \      return false;\n102     }\n103 \n104     if (this.left && this.left ===\
    \ nodeToReplace) {\n105       this.left = replacementNode;\n106       return true;\n\
    107     }\n108 \n109     if (this.right && this.right === nodeToReplace) {\n110\
    \       this.right = replacementNode;\n111       return true;\n112     }\n113\
    \ \n114     return false;\n115   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `copyNode()`\n\nThis is a static helper method that clones one node attributes\
    \ to another.\n\n```\n117   /**\n118    * @param {BinarySearchTreeNode} sourceNode\n\
    119    * @param {BinarySearchTreeNode} targetNode\n120    */\n121   static copyNode(sourceNode,\
    \ targetNode) {\n122     targetNode.setValue(sourceNode.value);\n123     targetNode.setData(sourceNode.data);\n\
    124     targetNode.setLeft(sourceNode.left);\n125     targetNode.setRight(sourceNode.right);\n\
    126   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `findMin()`\n\
    \nThis method recursively finds the node with the minimum value. The node may\
    \ be found recursively by following the left child of every node starting from\
    \ the root. This will lead us to the very left bottom node in a tree.\n\n```\n\
    199   /**\n200    * @return {BinarySearchTreeNode}\n201    */\n202   findMin()\
    \ {\n203     if (!this.left) {\n204       return this;\n205     }\n206 \n207 \
    \    return this.left.findMin();\n208   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `findMax()`\n\nThis method recursively finds the node with the maximum value.\
    \ The node may be found recursively by following the right child of every node\
    \ starting from the root. This will lead us to the very right bottom node in a\
    \ tree.\n\n```\n210   /**\n211    * @return {BinarySearchTreeNode}\n212    */\n\
    213   findMax() {\n214     if (!this.right) {\n215       return this;\n216   \
    \  }\n217 \n218     return this.right.findMax();\n219   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### `toString()`\n\nThis is a helper method that returns a string representation\
    \ of the BST. It does in-order traversal first to convert the tree into a sorted\
    \ array of values. Then it converts the sorted array of values to a string.\n\n\
    ```\n298   /**\n299    * @return {string}\n300    */\n301   toString() {\n302\
    \     return this.traverseInOrder().toString();\n303   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### BinarySearchTree\n\nThe `BinarySearchTree` class is just a thin wrapper\
    \ on top of the `BinarySearchTreeNode` class that hides all the helper methods\
    \ and makes the work with BST more semantically correct.\n\n```\n 1 import BinarySearchTreeNode\
    \ from './BinarySearchTreeNode';\n 2 export default class BinarySearchTree {\n\
    \ 3   constructor() {\n 4     this.root = null;\n 5   }\n 6 \n 7   /**\n 8   \
    \ * Find the node by its value.\n 9    * @param {*} value\n 10    * @return {BinarySearchTreeNode}\n\
    \ 11   */\n 12   find(value) {\n 13     return this.root.find(value);\n 14   }\n\
    \ 15 \n 16   /**\n 17    * Find node with min value.\n 18    * @return {BinarySearchTreeNode}\n\
    \ 19   */\n 20   findMin() {\n 21     return this.root.findMin();\n 22   }\n 23\
    \ \n 24   /**\n 25    * Find node with max value.\n 26    * @return {BinarySearchTreeNode}\n\
    \ 27   */\n 28   findMax() {\n 29     return this.root.findMax();\n 30   }\n 31\
    \ \n 32   /**\n 33    * Insert the new node in a tree.\n 34    * @param {*} value\n\
    \ 35    * @param {*} data\n 36    * @return {BinarySearchTreeNode}\n 37    */\n\
    \ 38   insert(value, data = null) {\n 39     this.root.insert(value, data);\n\
    \ 40   }\n 41 \n 42   /**\n 43    * Check if tree contains the specific value.\n\
    \ 44    * @param {*} value\n 45    * @return {boolean}\n 46    */\n 47   contains(value)\
    \ {\n 48     return this.root.contains(value);\n 49   }\n 50 \n 51   /**\n 52\
    \    * Remove the node from a tree by its value.\n 53    * @param {*} value\n\
    \ 54    * @return {boolean}\n 55    */\n 56   remove(value) {\n 57     return\
    \ this.root.remove(value);\n 58   }\n 59 \n 60   /**\n 61    * Convert tree to\
    \ string.\n 62    * @return {string}\n 63    */\n 64   toString() {\n 65     return\
    \ this.root.toString();\n 66   }\n 67 }\n```\n"
