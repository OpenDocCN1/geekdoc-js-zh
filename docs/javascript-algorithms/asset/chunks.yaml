  trans: "\n\nWikipedia 上的优先级队列 [`en.wikipedia.org/wiki/Priority_queue`](https://en.wikipedia.org/wiki/Priority_queue)\n\
    \nYouTube 上的优先级队列 [`www.youtube.com/watch?v=wptevk0bshY`](https://www.youtube.com/watch?v=wptevk0bshY)\n\
    \n优先级队列示例与测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/priority-queue`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/priority-queue)\n\
    \n## 图\n\n- *难度：简单*\n\n`Graph` 是顶点和边的集合，边连接了所有或部分顶点。\n\n`Graph` 可以是有向的 (`directed`)\
    \ 或是无向的 (`undirected`)。在有向图中，每条边都有一个方向（类似于单行道）。你可以从起始节点访问终点，但反之则不行。在无向图中，边没有特定的方向（类似于双行道），因此任何两个连接在一起的顶点都可以相互访问。\n\
    \n### 什么是顶点？\n\n> 顶点（vertex）是图中表示数据的基本单位。“节点”（node）和“顶点”（vertex）这两个术语可以通用，用于描述图中数据表示的方式。顶点（vertex\
    \ 的复数）通过边连接。\n\n另一种说明有向图和无向图区别的方法是考虑社交网络。如果每个顶点都是一个“用户”，那么在有向图中每条边都是一种“关注”关系——你可以关注某人，但这并不意味着对方也会关注你。而在无向图中，边就像“朋友”关系——如果某人在你的朋友列表中，那么自动意味着也在也在人的朋友列表中。\n\
    \n![](img/08-graph----graph.png)\n\n在上面的示例中，我们有三个不同的图，它们都包含顶点和边。所有的图都有顶点集合 `{A,\
    \ B, C, D}` 且都有一个边集合。无向图有一个边集合：`{AB, BC, AC, CD}`。有向图也有一个边集合：`{AB, BC, CB, AC,\
    \ CD}`。注意，为了在有向图中双向连接顶点 `B` 和 `C`，集合中有了两条边 `BC` 和 `CB`。\n\n如果两个顶点通过一条边相互连接，我们称这些顶点为相邻的\
    \ (`adjacent`) 或“邻居” (`neighbors`)。例如，在上面的无向图中，顶点 `A` 和 `B` 是邻居，顶点 `A` 和 `C` 也是。但顶点\
    \ `B` 和 `D` 不是邻居，因为这些顶点通过多条边连接（`B` 连接到 `C`，`C` 再连接到 `D`）。\n\n两个顶点之间的边序列称为路径 (`path`)。在上面的有图中没有从\
    \ `D` 到 `A` 的路径，但存在从 `A` 到 `D` 的路径，该路径是边的集合：`{AC, CD}`。\n\n图中的所有顶点并不都需要连接。当存在无法到达的\
    \ (`unreachable`) 顶点时，我们将这种图称为不连通图 (`disconnected graph`)。如果图中每对顶点之间都有边，则被称为连通图\
    \ (`connected graph`)。\n\n图也可以包含循环。如果一个图没有循环，则被称为无环图 (`acyclic graph`)。\n\n加权图\
    \ (`weighted graph`) 是图中每条边都关联有一个权重的图。根据上下文，边权重可能代表不同的概念，如“距离”、“流量”、“成本”、“电阻”等。\n\
    \n### 应用\n\n- **地图 (Maps)** 应用使用图来计算顶点（地址、城市、位置）之间的最短路径。\n- **社交网络 (Social networks)**\
    \ 使用图进行朋友推荐算法。\n- **包管理器 (Package managers)** 使用图根据依赖关系计算安装包的正确顺序。\n- **搜索引擎 (Search\
    \ engines)** 使用图分析页面相关性。在搜索引擎使用的图中，网页是一个顶点，从该网页到另一个网页的链接是有向边。\n- **网络提供商 (Network\
    \ providers)** 使用图分析网络流量和安全性。在这种情况下，每个顶点都有一个 `IP` 地址，每条边代表在不同 IP 地址之间流动的网络包。\n\
    \n### 图表示\n\n图通常被表示为邻接列表 (`adjacency lists`) 或邻接矩阵 (`adjacency matrices`)。让我们以本章开始的图为例。\n\
    \n![](img/08-graph----graph.png)\n\n#### 邻接矩阵\n\n具有 `n` 个顶点的图也可以表示为大小为 `n — n`\
    \ 的二进制值（`0` 或 `1`）的邻接矩阵。在这样的矩阵中，位置 `(i, j)` 处的值 `1` 表示顶点 `i` 和 `j` 之间存在边。否则，如果值为\
    \ `0`，则这些顶点之间没有边。\n\n**无向图邻接矩阵示例**\n\n对于无向图，邻接矩阵是对称的。\n\n| | A | B | C | D |\n\
    | --- | --- | --- | --- | --- |\n| **A** | 0 | 1 | 1 | 0 |\n| **B** | 1 | 0 |\
    \ 1 | 0 |\n| **C** | 1 | 1 | 0 | 1 |\n| **D** | 0 | 0 | 1 | 0 |\n\n**有向图邻接矩阵示例**\n\
    \n对于有向图，邻接矩阵可能不对称。\n\n| | A | B | C | D |\n| --- | --- | --- | --- | --- |\n|\
    \ **A** | 0 | 1 | 1 | 0 |\n| **B** | 1 | 0 | 1 | 0 |\n| **C** | 0 | 1 | 0 | 1\
    \ |\n| **D** | 0 | 0 | 1 | 0 |\n\n**加权图邻接矩阵示例**\n\n对于加权图，可以使用边的权重来代替布尔值。\n\n|\
    \ | A | B | C | D |\n| --- | --- | --- | --- | --- |\n| **A** | 0 | 5 | 3 | 0\
    \ |\n| **B** | 0 | 0 | 4 | 0 |\n| **C** | 0 | 2 | 0 | 6 |\n| **D** | 0 | 0 | 0\
    \ | 0 |\n\n#### 邻接列表\n\n图的一种流行表示方法是使用一个包含所有顶点的对象列表。\n\n![](img/08-graph----graph.png)\n\
    \n有时，不是使用顶点列表，而是使用 `Edge` 实体的列表。`Edge` 实体存储起始顶点、终点顶点和权重。当我们需要存储某些元数据时，这种方法可能更方便。\n\
    \n```javascript\nclass Node {\n  constructor() {\n    /** @type {Edge[]} */\n\
    \    this.edges = [];\n  }\n}\n\nclass Edge {\n  constructor() {\n    /** @type\
    \ {Node} */\n    this.startVertex = null;\n    /** @type {Node} */\n    this.endVertex\
    \ = null;\n    this.weight = null;\n  }\n}\n\nclass Graph {\n  constructor() {\n\
    \    /** @type {Node[]} */\n    this.nodes = [];\n  }\n}\n```\n\n我们还需要一个独立的 `Graph`\
    \ 类来支持不连通的图。在本章中，我们将使用邻接列表方法来实现图。\n\n#### 邻接矩阵与邻接列表对比\n\n图相关的算法可以交替使用邻接矩阵或邻接列表来实现。区别在于，根据对图执行的操作，一种实现图的方式可能比另一种更高效。\n\
    \n"
- fmt: "\nBefore we implement the JavaScript version of our graph let’s imagine that\
    \ we already have `Graph`, `GraphVertex` and `GraphEdge` classes and describe\
    \ how we’re going to use them.\n\nLet’s say we want to create a really simple\
    \ social network model. We want to be able to register new users, to create “friends”\
    \ relationship and to see the list of friends of specific user.\n\n```javascript\n\
    \ 1 // Import dependencies.\n 2 import Graph from './Graph';\n 3 import GraphVertex\
    \ from './GraphVertex';\n 4 import GraphEdge from './GraphEdge';\n 5 \n 6 // Create\
    \ a network.\n 7 const network = new Graph();\n 8 \n 9 // Create users.\n10 const\
    \ bill = new GraphVertex('Bill');\n11 const mary = new GraphVertex('Mary');\n\
    12 const john = new GraphVertex('John');\n13 const jane = new GraphVertex('Jane');\n\
    14 \n15 // Register users in our network.\n16 network\n17   .addVertex(bill)\n\
    18   .addVertex(mary)\n19   .addVertex(john)\n20   .addVertex(jane);\n21 \n22\
    \ // Check if users have been registered successfully.\n23 network.getVertexByKey('Bill');\
    \ // -> bill\n24 network.getVertexByKey('Mary'); // -> mary\n25 \n26 // Establish\
    \ friendship connections.\n27 network\n28   .addEdge(new GraphEdge(bill, mary))\n\
    29   .addEdge(new GraphEdge(john, jane))\n30   .addEdge(new GraphEdge(jane, mary));\n\
    31 \n32 // Check if specific users are friends.\n33 network.findEdge(bill, mary);\
    \ // -> GraphEdge entity\n34 network.findEdge(john, jane); // -> GraphEdge entity\n\
    35 network.findEdge(bill, john); // -> null\n36 \n37 // Get all friends of specific\
    \ user.\n38 // eslint-disable-next-line no-unused-expressions\n39 mary.getNeighbors().length;\
    \ // -> 2\n40 mary.getNeighbors(); // -> [bill, jane]\n```\n\n08-graph/example.js\n\
    \n# Implementation\n\nLet’s split the implementation into three parts. First,\
    \ let’s implement `GraphEdge` and `GraphVertex` classes, then wrap them into the\
    \ `Graph` class.\n\n## GraphEdge\n\nLet’s create the class.\n\n```javascript\n\
    1 export default class GraphEdge {\n```\n\n08-graph/GraphEdge.js\n\n### `constructor`\n\
    \nThe constructor method will accept `startVertex` and `endVertex` along with\
    \ the `weight` parameters. The edge instance will represent a connection between\
    \ `startVertex` and `endVertex`. For a directed graph the order of the parameters\
    \ (`startVertex` and `endVertex`) are important because if you remember from the\
    \ introduction, the edges in a directed graph are a “one way street” – they can\
    \ only go one direction. For an undirected graph, the order of the parameters\
    \ are not important.\n\n```javascript\n 2   /**\n 3    * GraphEdge constructor.\n\
    \ 4    * @param {GraphVertex} startVertex\n 5    * @param {GraphVertex} endVertex\n\
    \ 6    * @param {number} [weight=1]\n 7    */\n 8   constructor(startVertex, endVertex,\
    \ weight = 0) {\n 9     this.startVertex = startVertex;\n10     this.endVertex\
    \ = endVertex;\n11     this.weight = weight;\n12   }\n```\n\n08-graph/GraphEdge.js\n\
    \n### `getKey()`\n\nThis method will return unique edge key which will consist\
    \ of start and end vertices keys. This key will be used in the `Graph` class later\
    \ to quickly look up the edges of the graph We will implement `getKey()` method\
    \ for `GraphVertex` instance below. The key value will look something like `A_B`\
    \ which would mean that this edge connects vertices `A` and `B` together.\n\n\
    ```javascript\n14   /**\n15    * Get string representation of the edge key.\n\
    16    * @return {string}\n17    */\n18   getKey() {\n19     const startVertexKey\
    \ = this.startVertex.getKey();\n20     const endVertexKey = this.endVertex.getKey();\n\
    21 \n23     return `${startVertexKey}_${endVertexKey}`;\n23   }\n```\n\n08-graph/GraphEdge.js\n\
    \n### `toString()`\n\nThis method will return a string representation of the edge.\
    \ For simplicity’s sake let’s return the edge key here.\n\n```javascript\n25 \
    \  /**\n26    * Convert edge to string.\n27    * @return {string}\n28    */\n\
    29   toString() {\n30     return this.getKey();\n31   }\n```\n\n08-graph/GraphEdge.js\n\
    \n## GraphVertex\n\nWe will use the `LinkedList` class from the previous chapters\
    \ to store all adjacent edges of the vertex. Let’s import our dependencies first.\n\
    \n```javascript\n1 // Import dependencies.\n2 import LinkedList from '../02-linked-list/LinkedList';\n\
    ```\n\n08-graph/GraphVertex.js\n\nLet’s now create a class.\n\n```javascript\n\
    4 export default class GraphVertex {\n```\n\n08-graph/GraphVertex.js\n\n### `constructor`\n\
    \nThe constructor method will accept the `value` of the vertex. Also in this method\
    \ we will create an empty `edges` using our `LinkedList` class that will store\
    \ all adjacent edges.\n\n```javascript\n 5   /**\n 6    * Graph vertex constructor.\n\
    \ 7    * @param {*} value\n 8    */\n 9   constructor(value) {\n10     this.value\
    \ = value;\n11     this.edges = new LinkedList();\n12   }\n```\n\n08-graph/GraphVertex.js\n\
    \n### `addEdge()`\n\nThis method adds new edge to the current vertex. It does\
    \ it by appending to the edge. The method returns `this` to allow for chaining\
    \ methods (e.g., `vertex.addEdge(edge)`).\n\n```javascript\n14   /**\n15    *\
    \ Add new edge to the vertex.\n16    * @param {GraphEdge} edge\n17    * @returns\
    \ {GraphVertex}\n18    */\n19   addEdge(edge) {\n20     this.edges.append(edge);\n\
    21 \n22     return this;\n23   }\n```\n\n08-graph/GraphVertex.js\n\n### `deleteEdge()`\n\
    \nThis method deletes the edge from the `LinkedList`.\n\n```javascript\n25   /**\n\
    26    * Delete vertex edge.\n27    * @param {GraphEdge} edge\n28    */\n29   deleteEdge(edge)\
    \ {\n30     this.edges.delete(edge);\n31   }\n```\n\n08-graph/GraphVertex.js\n\
    \n### `getEdges()`\n\nThis method returns an array of all adjacent edges of the\
    \ vertex. To do so it converts the edge’s `LinkedList` into array and then goes\
    \ through each list vertex using `map()` function and extracts the values. Those\
    \ values are vertex entities.\n\n```javascript\n57   /**\n58    * Get all vertex\
    \ edges as an array.\n59    * @return {GraphEdge[]}\n60    */\n61   getEdges()\
    \ {\n62     return this.edges.toArray().map(linkedListNode => linkedListNode.value);\n\
    63   }\n```\n\n08-graph/GraphVertex.js\n\n### `hasEdge()`\n\nThis method checks\
    \ whether the vertex has a specific edge instance. To do so, it uses the `LinkedList`\
    \ `find()` method. We pass in a function as an argument to the `find()` method.\
    \ Inside the function, we look for the correct edge by doing a strict comparison\
    \ of the objects using `===`. If the edge has been found, we convert it to boolean\
    \ by doing double conversion of the object to boolean using `!!`.\n\n```javascript\n\
    65   /**\n66    * Check if vertex has a specific edge connected to it.\n67   \
    \ * @param {GraphEdge} requiredEdge\n68    * @returns {boolean}\n69    */\n70\
    \   hasEdge(requiredEdge) {\n71     const edgeNode = this.edges.find({\n72   \
    \    callback: edge => edge === requiredEdge,\n73     });\n74 \n75     return\
    \ !!edgeNode;\n76   }\n```\n\n08-graph/GraphVertex.js\n\n### `getNeighbors()`\n\
    \nThis methods returns an array of all adjacent vertices of the current vertex.\
    \ To do so we need to:\n\n*   go through all adjacent edges,\n\n*   for each edge\
    \ we need to check the `startVertex` and the `endVertex` and return the vertex\
    \ which is not equal to the current one.\n\nWe need to do so because we can’t\
    \ guarantee that the current vertex is stored as `startVertex` in the edge. For\
    \ example consider the situation when we have vertices *A* and *B* and the edge\
    \ *AB*. In this case the edge *AB* will be added to both vertices *A* and *B*.\
    \ For vertex *A* it will be a `startVertex` in edge *AB* but for vertex *B* it\
    \ will be the `endVertex`. Both of these cases need to be handled.\n"
