    \ “The Task” section above and try to find the shortest paths to all vertices\
    \ from `Home` vertex and the shortest path from `Home` to `Office` in particular.\n\
    \n![](images/26-dijkstra----graph.png)\n\nWhen calling `dijkstra()` function we\
    \ would want to pass the `graph` we’re going to traverse along with the starting\
    \ vertex `startVertex`.\n\nThis function should return us `distances` object with\
    \ shortest paths to all vertices from the `startVertex`. This object may be a\
