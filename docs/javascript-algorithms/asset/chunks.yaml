  trans: "\n\n在开始实现深度优先搜索算法之前，让我们先假设我们已经实现了一个 `depthFirstSearch()` 函数。该函数允许我们遍历使用简单\
    \ `BinaryTreeNode` 类实现的二叉树节点。通过这种方式，我们将更好地理解想要传递给 `depthFirstSearch()` 函数的参数应该什么，以及我们期望从它得到的输出是什么。\n\
    \n在这个用例示例中，我们将使用一个回调函数作为 `depthFirstSearch()` 函数的第二个参数。每当该函数访问树中的一个节点时，该回调函数就会被调用一次。这允许我们在访问每个节点时添加自定义逻辑。\n\
    \n```javascript\n 1 // 导入依赖。\n 2 import { depthFirstSearch } from './depthFirstSearch';\n\
    \ 3 import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
    \ 4 \n 5 // 创建树节点。\n 6 const nodeA = new BinaryTreeNode('A');\n 7 const nodeB\
    \ = new BinaryTreeNode('B');\n 8 const nodeC = new BinaryTreeNode('C');\n 9 const\
    \ nodeD = new BinaryTreeNode('D');\n10 const nodeE = new BinaryTreeNode('E');\n\
    \ 1 \n12 // 使用创建的节点形成二叉树。\n13 nodeA\n14   .setLeft(nodeB)\n15   .setRight(nodeC);\n\
    16 \n17 nodeB\n18   .setLeft(nodeD)\n19   .setRight(nodeE);\n20 \n21 // 初始化包含树中所有遍历节点的数组。\n\
    22 const traversedNodes = [];\n23 \n24 // 创建访问节点回调函数。\n25 const visitNodeCallback\
    \ = (visitedNode) => {\n26   // 一旦访问该节点，将其添加到遍历节点列表中。\n27   traversedNodes.push(visitedNode);\n\
    28 };\n29 \n30 // 执行深度优先树遍历。\n31 depthFirstSearch(nodeA, visitNodeCallback);\n\
    32 \n33 // eslint-disable-next-line no-console\n34 console.log(traversedNodes);\n\
    35 /*\n36   输出将是：\n37   [nodeA, nodeB, nodeD, nodeE, nodeC]\n38 */\n```\n\n`22-tree-depth-first-search/example.js`\n\
    \n### 实现\n\n为了遍历我们的树，我们必须首先创建一个 `BinaryTreeNode` 类，用于表示二叉树的节点。在类构造函数中，我们将为节点分配值。我们的\
    \ `setLeft()` 和 `setRight()` 方法允许我们向其附加左、右节点。为了易用性，我们将从 `setLeft()` 和 `setRight()`\
    \ 方法返回 `this`，以便能够像 `nodeA.setLeft(nodeB).setRight(nodeC)` 这样进行链式调用。\n\n```javascript\n\
    \ 1 export class BinaryTreeNode {\n 2   /**\n 3    * @param {*} [value]\n 4  \
    \  */\n 5   constructor(value = null) {\n 6     this.left = null;\n 7     this.right\
    \ = null;\n 8     this.value = value;\n 9   }\n10 \n11   /**\n12    * @param {BinaryTreeNode}\
    \ node\n13    */\n14   setLeft(node) {\n15     this.left = node;\n16     return\
    \ this;\n17   }\n18 \n19   /**\n20    * @param {BinaryTreeNode} node\n21    */\n\
    22   setRight(node) {\n23     this.right = node;\n24     return this;\n25   }\n\
    26 }\n```\n\n`06-binary-search-tree/BinaryTreeNode.js`\n\n一旦我们实现了 `BinaryTreeNode`\
    \ 类，就可以实现 `depthFirstSearch()` 函数，用于遍历 `BinaryTreeNode` 实例。该函数接受起始 `node` 作为第一个参数，并将\
    \ `visitNodeCallback()` 作为第二个参数。每当我们在 DFS 路径上遇到新节点时，`visitNodeCallback()` 就会被调用。\n\
    \n我们将使用递归来实现 `depthFirstSearch()` 函数。这意味着，如果当前 `node` 的左、右节点存在，我们将对它们调用 `depthFirstSearch()`\
    \ 函数。\n\n```javascript\n 1 /**\n 2  * 对 rootNode 执行深度优先搜索 (DFS) 遍历。\n 3  *\n 4\
    \  * @param {BinaryTreeNode} node - 要遍历的起始节点。\n 5  * @param {callback} [visitNodeCallback]\
    \ - 访问节点回调。\n 6  */\n 7 export function depthFirstSearch(node, visitNodeCallback\
    \ = () => {}) {\n 8   // 调用访问节点回调。\n 9   visitNodeCallback(node);\n10 \n11   //\
    \ 遍历左分支。\n12   if (node.left) {\n13     depthFirstSearch(node.left, visitNodeCallback);\n\
    14   }\n15 \n16   // 遍历右分支。\n17   if (node.right) {\n18     depthFirstSearch(node.right,\
    \ visitNodeCallback);\n19   }\n20 }\n```\n\n`22-tree-depth-first-search/depthFirstSearch.js`\n\
    \n之前提到过深度优先搜索算法可以使用 `stack`（栈）数据结构来实现。但观察 `depthFirstSearch()` 函数的代码，你可能会疑惑为什么我们没有使用栈。\n\
    \n### 复杂度\n\n#### 时间复杂度\n\n深度优先搜索算法访问每个节点一次。因此，我们可以说时间复杂度为 `O(N)`。\n\n#### 辅助空间\n\
    \n在最坏的情况下，递归调用栈需要 `O(N)`。\n\n### 题目示例\n\n这里是一些你在面试中可能会遇到的相关问题：\n\n*   [相同树](https://leetcode.com/problems/same-tree/)\n\
    *   [二叉树的最大深度](https://leetcode.com/problems/maximum-depth-of-binary-tree/)\n\
    *   [验证二叉搜索树](https://leetcode.com/problems/validate-binary-search-tree/)\n\n\
    ### 测试\n\n*Q1 深度优先搜索的时间复杂度是多少？*\n\n*Q2 实现 depthFirstSearch 时可以避免递归吗？*\n\n### 参考文献\n\
    \n维基百科上的深度优先搜索 [`en.wikipedia.org/wiki/Depth-first_search`](https://en.wikipedia.org/wiki/Depth-first_search)\n\
    \n树的 DFS 示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search)\n\
    \n"
- fmt: "\n`Breadth-first search (BFS)` and `depth-first search (DFS)` algorithms are\
    \ very similar in that they are both traversing a tree, but they do it in two\
    \ different ways. `BFS goes wide` by exploring all the nodes of a tree on a certain\
    \ level and only then moves one level deeper and explores nodes on the next level.\
    \ `DFS goes deep` by exploring all the nodes of a tree by going down to the tree\
    \ leaves and only then backtracks and tries another branch until it reaches leaf\
    \ nodes.\n\nThe illustration below shows the sequence of binary tree traversal\
    \ using breadth-first search algorithm.\n\n![](images/23-tree-breadth-first-search----tree-breadth-first-search.png)\n\
    \nThis algorithm may be implemented using `queue` (see one of the previous chapters\
    \ of this book about the `Queue` data structure). The idea of using a queue to\
    \ implement breadth-first search algorithm is the following:\n\n1. Pick the starting\
    \ node and put it to the nodes queue.\n2. Pop the next node from the queue and\
    \ add all its children to the queue to visit them later.\n3. Go to step 2 (repeat\
    \ this process until the queue is empty).\n\n### Usage Example\n\nBefore moving\
    \ on with actual implementation of breadth-first search algorithm let’s imagine\
    \ that we already have a `breadthFirstSearch()` function implemented. This function\
    \ allows us to traverse binary tree nodes that are implemented using simple `BinaryTreeNode`\
    \ class. By doing that we’ll get better understanding of what arguments we want\
    \ to pass to our `breadthFirstSearch()` function and what output we expect from\
    \ it.\n\nIn this usage example, we will use a callback function as the second\
    \ argument to our `breadtFirstSearch()` function. This callback will be called\
    \ every time the function visits a node in the tree. This allows us to add custom\
    \ logic when we visit each node.\n\n```\n 1 // Import dependencies.\n 2 import\
    \ { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n 3 import\
    \ { breadthFirstSearch } from './breadthFirstSearch';\n 4 \n 5 // Create tree\
    \ nodes.\n 6 const nodeA = new BinaryTreeNode('A');\n 7 const nodeB = new BinaryTreeNode('B');\n\
    \ 8 const nodeC = new BinaryTreeNode('C');\n 9 const nodeD = new BinaryTreeNode('D');\n\
    10 const nodeE = new BinaryTreeNode('E');\n 11 \n 12 // Form a binary tree out\
    \ of created nodes.\n 13 nodeA\n 14   .setLeft(nodeB)\n 15   .setRight(nodeC);\n\
    \ 16 \n 17 nodeB\n 18   .setLeft(nodeD)\n 19   .setRight(nodeE);\n 20 \n 21 //\
    \ Init the array that will contain all traversed nodes of th tree.\n 22 const\
    \ traversedNodes = [];\n 23 \n 24 // Create visiting node callback.\n 25 const\
    \ visitNodeCallback = (visitedNode) => {\n 26   // Once we visit the node let's\
    \ add it to the list of nodes.\n 27   traversedNodes.push(visitedNode);\n 28 };\n\
    \ 29 \n 30 // Perform breadth-first traversal.\n 31 breadthFirstSearch(nodeA,\
    \ visitNodeCallback);\n 32 \n 33 // Check that traversal happened in order.\n\
    \ 34 expect(traversedNodes).toEqual([\n 35   nodeA, nodeB, nodeC, nodeD, nodeE,\n\
    \ 36 ]);\n 37 \n 38 // eslint-disable-next-line\n 39 console.log(traversedNodes);\n\
    \ 40 /*\n 41   The output will be:\n 42   [nodeA, nodeB, nodeC, nodeD, nodeE]\n\
    \ 43 */\n```\n`23-tree-breadth-first-search/example.js`\n\n### Implementation\n\
    \nSince we’re going to traverse binary tree let’s create a simple `BinaryTreeNode`\
    \ class that will represent the node of binary tree. Using `constructor` we will\
    \ assign the value to the node. And also using `setLeft()` and `setRight()` methods\
    \ we’ll be able to attach left and right nodes. For usability reasons we’ll return\
    \ `this` from `setLeft()` and `setRight()` methods to be able to chain them like\
    \ `nodeA.setLeft(nodeB).setRight(nodeC)`.\n\n```\n 1 export BinaryTreeNode {\n\
    \ 2   /**\n 3    @param {*} [value]\n 4    */\n 5   constructor(value = null)\
    \ {\n 6     this.left = null;\n 7     this.right = null;\n 8     this.value =\
    \ value;\n 9   }\n 10 \n 11   /**\n 12    @param {BinaryTreeNode} node\n 13  \
    \  */\n 14   setLeft(node) {\n 15     this.left = node;\n 16     return this;\n\
    \ 17   }\n 18 \n 19   /**\n 20    @param {BinaryTreeNode} node\n 21    */\n 22\
    \   setRight(node) {\n 23     this.right = node;\n 24     return this;\n 25  \
    \ }\n 26 }\n```\n`06-binary-search-tree/BinaryTreeNode.js`\n\nSince the breadth-first\
    \ traversal uses queue to store all the nodes that are supposed to be visited\
    \ let’s import a `Queue` class first.\n\n```\n// Import dependencies.\nimport\
    \ { Queue } from '../03-queue/Queue';\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
    \nOnce we’ve implemented the `BinaryTreeNode` class and imported `Queue` as dependency\
    \ we may proceed with implementation of `breadthFirstSearch()` function that will\
    \ traverse `BinaryTreeNode` instances. This function will accept the starting\
    \ `rootNode` as first parameter and `visitNodeCallback()` as second parameter.\
    \ `visitNodeCallback()` will be called each time we meet the new node on our BFS-path.\n\
    \nWhat we need to do inside the `breadthFirstSearch()` function is to:\n\n1. Create\
    \ an empty queue instance `nodeQueue`,\n2. Add the `rootNode` (the node from which\
    \ we’ll start BFS traversal) to the queue instance `nodeQueue`,\n3. Pop the next\
    \ node in the queue and assign it to `currentNode` variable,\n4. Call the `visitNodeCallback()`\
    \ callback to notify watchers/subscribers about visiting the new node,\n5. Add\
    \ all `currentNode` children to the queue to visit them later,\n6. Go to step\
    \ 3 until the `nodeQueue` is empty.\n\nHere is how this function implementation\
    \ looks:\n\n```\n 4 /**\n 5  * Perform breadth-first search (BFS) traversal of\
    \ the rootNode.\n 6  *\n 7  * @param {BinaryTreeNode} rootNode - The starting\
    \ node to be traversed.\n 8  * @param {callback} [visitNodeCallback] - Visiting\
    \ node callback.\n 9  */\n 10 export function breadthFirstSearch(rootNode, visitNodeCallback\
    \ = () {}) {\n 11   // Do initial queue setup.\n 12   // We need to add a rootNode\
    \ to the queue first to start the\n 13   // traversal process from it.\n 14  \
    \ const nodeQueue = new Queue();\n 15   nodeQueue.enqueue(rootNode);\n 16 \n 17\
    \   // Visit all the nodes of the queue until the queue is empty.\n 18   while\
    \ (!nodeQueue.isEmpty()) {\n 19     // Fetch the next node to visit.\n 20    \
    \ const currentNode = nodeQueue.dequeue();\n 21 \n 22     // Call the visiting\
    \ node callback.\n 23     visitNodeCallback(currentNode);\n 24 \n 25     // Add\
    \ left node to the traversal queue.\n 26     if (currentNode.left) {\n 27    \
    \   nodeQueue.enqueue(currentNode.left);\n 28     }\n 29 \n 30     // Add right\
    \ node to the traversal queue.\n 31     if (currentNode.right) {\n 32       nodeQueue.enqueue(currentNode.right);\n\
    \ 33     }\n 34   }\n 35 }\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
    \n### Complexities\n\n#### Time Complexity\n\nThe breadth-first search algorithm\
    \ that was implemented above visits every node of a tree exactly once. This is\
    \ achieved by using a `Queue` instance. Since a tree can’t have circular connections\
    \ (i.e. when two nodes share the same child) we can say that we put every node\
    \ to the queue only once. And then extract each node from the queue only once\
    \ by visiting it. Therefore we may say that the time complexity of tree traversal\
    \ using breadth-first approach is `O(|N|`, where `|N|` is total number of nodes\
    \ in a tree.\n\n#### Auxiliary Space Complexity\n\nIn worst-case scenario we will\
    \ have unbalanced tree that will look like a linked list (in case if each node\
    \ of a tree has only left (or only right) child). Since we use queue to store\
    \ the list of nodes that are going to be visited this queue in worst-case scenario\
    \ may contain all the nodes of a tree. Thus, in worst-case scenario, we will need\
    \ `O(|N|)` auxiliary memory space for our queue instance.\n"
