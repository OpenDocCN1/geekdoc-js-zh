    \ Without Repetitions\n\nThis problem may be solved recursively. It means that\
    \ we generate combinations of a bigger size out of combinations of smaller sizes.\
    \ For example, if we need to generate all combinations of size `r = 3` without\
    \ repetitions for a set `S = {A, B, C, D}` we do the following:\n\n*   extract\
    \ the first element `A` out of the set,\n\n*   find all combinations of size `r\
    \ = 2` for a set `S = {B, C, D}`,\n\n*   concatenate `A` with all smaller combinations\
    \ from the previous step,\n\n*   extract the second element `B` out of the set,\n\
    \n*   find all combinations of size `r = 2` for a set `S = {C, D}`,\n\n*   concatenate\
    \ `B` with all smaller combinations from the previous step,\n\n*   and so on…\n\
    \nThe base case for our recursion would be the case when we need to generate combinations\
    \ of size `r = 1` for a set. In this case every element of a set is a combination\
