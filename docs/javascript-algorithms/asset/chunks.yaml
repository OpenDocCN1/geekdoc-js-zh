  raw: '*   *Q1:* No. The root node by definition is the node in a tree that doesn’t
    have parent.


    *   *Q2:* Yes, it is allowed. Nodes in binary tree may have from zero to two children.


    *   *Q3:* The balanced binary search tree will have faster `O(log(n))` lookup.
    If the tree is unbalanced then in worst case (pathological tree) it will act like
    a linked list with `O(n)` lookup time


    **Binary Heap**


    *   *Q1:* “Shape property” and “Heap property”


    *   *Q2:* We need to move the last element of a heap (bottom left element of a
    tree) to the head and then do heapifying down operation


    *   *Q3:* `O(log(n))`


    **Priority Queue**


    *   *Q1:* We would need to use `MaxHeap` instead of `MinHeap`.


    *   *Q2:* `O(log(n))`


    **Graphs**


    *   *Q1:* Yes. The tree is a special case of directed connected acyclic graph.


    *   *Q2:* Yes. In this case we will have disconnected graph that consists of only
    two vertices (vertices).


    *   *Q3:* There are two common ways of representing the graph: adjacency list
    and adjacency matrix


    **Bit Manipulation**


    *   *Q1:* `111011`


    *   *Q2:* `000101 & 111110 = 000100`


    **Factorial**


    *   *Q1:* `7`


    **Primality Test**


    *   *Q1:* No, `32/2` is remainder `0`


    *   *Q2:* Yes, `31/2` is remainder `1`. The square root of `31` is `5.56776436283`
    – `31/3 = 10.3`, `31/4 = 7.75`, `31/5 = 6.2`


    **Is a power of two**


    *   *Q1:* Yes, `32/2 = 16`, `16/2 = 8`, `8/2 = 4`, `4/2 = 2`, `2/2 = 1`


    *   *Q2:* No, `01111 & 11110 = 01110`


    **Search. Linear Search.**


    *   *Q1:* Time complexity is `O(n)` for worst and average cases.


    *   *Q2:* No. Because of `O(n)` time complexity the common practice is to apply
    the algorithm for small sized lists


    **Search. Binary Search.**


    *   *Q1:* No. By its nature the binary search works only with sorted array. Otherwise
    we couldn’t abandon array halves on each step.


    *   *Q2:* Time complexity is `O(log(n))`. It is caused by the fact that we abandon
    the half of the array on each iteration.


    **Sets. Cartesian Product.**


    *   *Q1:* It has 4 elements: `[''ac'', ''ad'', ''bc'', ''bd'']`. The formula is
    `|A| * |B|`.


    *   *Q2:* Yes, it is possible. If we have four sets `A`, `B`, `C` and `D` then
    each element of cartesian product set would consist of four elements `(a, b, c,
    d)`.


    *   *Q3:* The time complexity is `O(|A|*|B|)`.


    **Sets. Power Set.**


    *   *Q1:* Yes, empty set is a part of power set.


    *   *Q2:* It has 2<sup>4</sup>=16 elements, where 4 is a size of original set
    `{a, b, c, d}`.


    **Sets. Permutations.**


    *   *Q1:* Yes, the order matters. This is distinguishing characteristic of permutations
    comparing to combinations.


    *   *Q2:* We will have `4! / (4 - 2)! = 4! / 2! = 24 / 2 = 12` permutations.


    **Sets. Combinations.**


    *   *Q1:* No, the order doesn’t matter. This is distinguishing characteristic
    of combinations comparing to permutations.


    *   *Q2:* We will have `4! / (2! * (4 - 2)!) = 4! / (2! * 2!) = 24 / 4 = 6` combinations.


    **Sorting: Quicksort**


    *   *Q1:* The average time complexity of Quicksort is `O(n * log(n))`.


    *   *Q2:* We just need to add the elements that are bigger than the pivot element
    to the left array (instead of the right one) and the elements that are smaller
    than the pivot element need to be added to the right array (instead of the left
    one).


    **Trees. Depth-First Search.**


    *   *Q1:* The time complexity of DFS is `O(|N|)`, where `|N|` is total number
    of nodes in a tree.


    *   *Q2:* Yes, we can avoid recursion by using the `Stack` class implemented earlier.
    In this case every time we visit the node, we need to put all its children (not
    just two) on the stack. And then fetch the next node to traverse from the top
    of the stack.


    **Trees. Breadth-First Search.**


    *   *Q1:* The time complexity of BFS is `O(|N|)`, where `|N|` is total number
    of nodes in a tree.


    *   *Q2:* Instead of adding just ‘left’ and ‘right’ child to the queue inside
    the `while` loop we need to fetch all children of the node and add all of them
    to the queue.


    **Graphs. Depth-First Search.**


    *   *Q1:* The time complexity of DFS for graphs is `O(|V| + |E|)`, where `|V|`
    is total number of vertices and `|E|` is total number of edges in the graph.


    *   *Q2:* Stack is a best fit for implementing DFS algorithm.


    **Graphs. Breadth-First Search.**


    *   *Q1:* The time complexity of BFS for graphs is `O(|V| + |E|)`, where `|V|`
    is total number of vertices and `|E|` is total number of edges in the graph.


    *   *Q2:* Queue is a best fit for implementing BFS


