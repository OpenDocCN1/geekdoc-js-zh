    \ for graphs?*\n\n*Q2: What data-structure fits best for implementing breadth-first\
    \ search algorithm for graphs: Stack or Queue?*\n\n### References\n\nBreadth-first\
    \ search (BFS) on Wikipedia [https://en.wikipedia.org/wiki/Breadth-first_search](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
    \nBreadth-first search visualization [https://www.cs.usfca.edu/~galles/visualization/BFS.html](https://www.cs.usfca.edu/~galles/visualization/BFS.html)\n\
    \nGraph BFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search)\n\
    \n## Dijkstra’s Algorithm\n\n*   *Difficulty: hard*\n\n### The Task\n\n*Given\
    \ a graph and a source vertex in the graph, find shortest paths from source to\
    \ all vertices in the given graph.*\n\n**Example**\n\nA good example of a graph\
    \ is a map with various cities (vertices) and roads that connect them (edges).\
    \ If graph is directed it means the roads connecting two cities are one way roads.\
    \ If the graph is undirected then all roads are two way roads. Also a graph may\
    \ be weighted. The weight of the edge may be treated as the distance between two\
    \ spots. The higher the weight the longer the distance between two cities.\n\n\
    ![](images/26-dijkstra----graph.png)\n\nPerhaps we want to find the shortest distance\
    \ to every location on the map from the `Home` vertex. With this information we\
    \ can, for example, find the shortest path from `Home` to the `Office`.\n\n![](images/26-dijkstra----graph-shortest.png)\n\
    \n### The Algorithm\n\n#### Algorithm Definition\n\n**Dijkstra’s algorithm** is\
    \ an algorithm for finding the shortest paths between nodes in a graph, which\
    \ may represent, for example, road networks. It was conceived by computer scientist\
    \ Edsger W. Dijkstra in 1956.\n\nDijkstra’s original variant found the shortest\
    \ path between two nodes, but a more common variant finds shortest paths from\
    \ the source node to all other nodes in the graph.\n\n#### Algorithm Steps\n\n\
    The algorithm has the following steps:\n\n1.  Assign all vertices a **tentative\
    \ distance** value: set it to `0` for our start vertex (since we’ve already reached\
    \ it) and `Infinity` for all other vertices (since at this point they seem unreachable\
    \ to us).\n\n2.  Create a **set of visited vertices**. We will use it to avoid\
    \ endless loops while traversing the vertices.\n\n3.  Create a **vertex visiting\
    \ queue** and put the starting vertex to this queue. We will use priority queue\
    \ with distance to the vertex as a priority factor (priority is explained in one\
    \ of the previous chapters). The shorter the vertex distance to the starting vertex\
    \ the higher its priority.\n\n4.  **Poll the next closest vertex** from the queue\
    \ (the vertex with smaller distance from the source). Priority queue will allow\
    \ us to do it.\n\n5.  **Go through every unvisited neighbor** of the current vertex.\
    \ For each neighbor calculate `distanceToTheCurrentVertex + distanceFromCurrentVertexToNeighbor`.\
    \ If this distance is less than neighbor’s tentative distance then replace it\
    \ with this new value.\n\n6.  When we’re done considering all the neighbors of\
    \ the current vertex, **mark current vertex as visited**.\n\n7.  **Go to step\
    \ 4** and repeat it until the vertex visiting queue is empty.\n\n#### Priority\
    \ Queue Usage in the Algorithm\n\nIn Dijkstra’s algorithm every time we poll the\
    \ next vertex to visit (step 4) it must be a node that was not visited before\
    \ and that *has the shortest distance to the starting vertex*.\n\nBut how can\
    \ we do this type of polling based on distance?"
