    \ Jones'); // => ''+111111111111'\n14 \n15 // Delete phone number.\n16 phoneBook.delete('John\
    \ Smith');\n17 phoneBook.get('John Smith'); // => undefined\n```\n\nsrc/05-hash-table/HashTable.js\n\
    \nIdeally, hash tables allow us to do all of these operations in `O(1)` time.\
    \ Compare that with a Linked List which requires us to go through *all* the nodes\
    \ in the list to fetch John Smith’s phone number, with an `O(n)` lookup time.\n\
    \n> The highly efficient lookup is the main advantage of hash tables.\n\nIn the\
    \ worst case scenario though it *is* possible for hash tables to have `O(n)` lookup\
    \ time. We’ll get to this scenario later in the chapter.\n\nSo, how do we achieve\
    \ a fast `O(1)` lookup in a hash table? We allocate an array of *buckets* or *slots*\
    \ that will hold all the hash table data. Then we need to map the key of the value\
    \ to a specific number (index or address) of the bucket where the value will be\
    \ stored. By doing that we will be able to create, read and delete records in\
    \ the hash table by simply accessing it using the bucket address in `O(1)` time.\n\
    \nThere are certain limitations in building a hash table. The number of buckets\
    \ will have a *fixed size*. This is because any program has certain memory limitations\
    \ and we can’t assume we have an unlimited amount of memory for our hash table.\n\
    \nThe key that we’re going to map to a bucket address may be of arbitrary size\
    \ (i.e. `John Smith` or just `Jimmy`). How do we map a key of arbitrary size to\
    \ a number (index or address) when the number of buckets is limited? The hint\
    \ is already hidden in the “Hash Table” data structure name! And it is by using\
    \ a **hash function**.\n\n### Hash Function\n\nA **hash function** is a function\
    \ that can be used to map data of *arbitrary size* to data of a *fixed size*.\
    \ The values returned by a hash function are called *hash values*, *hash codes*,\
    \ *digests*, or simply *hashes*.\n\nIn our case, our hash function must accept\
    \ the key (i.e. `John Smith`) as an input and output the index of a bucket in\
    \ a given range (i.e. from `0` to `5` if we allocate an array of size `5` for\
    \ the buckets). In the real world, the number of buckets is much bigger. It should\
    \ be proportional to the amount of information we’re going to store in our hash\
    \ table.\n\nThe hash function consists of two parts:\n\n1.  Convert the string\
    \ to a hash code – ideally to a unique numeric representation of the key.\n\n\
    2.  Map the hash code to a specific bucket cell using the modulo operator (since\
    \ we have a limited bucket size).\n\n![](images/05-hash-table----hash-function.png)\n\
    \n#### Hash function example\n\nThere are a number of ways to hash a string into\
    \ an index or address. One of the simplest ways to calculate the hash of a string\
    \ is to sum up the ASCII codes of all the characters in a string.\n\n> #### What\
    \ is an ASCII code?\n\n> \n\n> ASCII stands for American Standard Code for Information\
    \ Interchange and it is a code that represents characters in English as numbers.\
    \ Computers only understand 1s and 0s and this code translates the letters we\
    \ type into a number that the computer can understand.\n\nLet’s create a JavaScript\
    \ function called `hash` that takes the key and number of buckets as parameters.\n\
    \n```\n13 export function hash(key, bucketsNumber) {\n```\n\n05-hash-table/hash.js\n\
    \nWe’ll loop over each character in our string and use the JavaScript string method\
    \ `charCodeAt` to get an integer value for each character. The `charCodeAt` method\
    \ returns the ASCII code of a character. We add up all the codes of each character\
    \ to calculate our hash code.\n\n```\n14   let hashCode = 0;\n15   // Let's go\
    \ through all key characters and add their code to hash\n16   for (let characterIndex\
    \ = 0; characterIndex < key.length; characterIndex += 1) {\n17     hashCode +=\
    \ key.charCodeAt(characterIndex);\n18   }\n```\n\n05-hash-table/hash.js\n\nThen,\
    \ in order to make sure our index is a valid index for our hash table, we use\
    \ the modulo operator to calculate the correct bucket index and return the value.\n\
    \n```\n20   // Reduce hash number so it would fit buckets table size.\n21   return\
    \ hashCode % bucketsNumber;\n22 }\n```\n\n05-hash-table/hash.js\n\nFor example,\
    \ say we called our function using `ab` as our string and 100 as our bucket size.\
    \ What result would get returned from calling our hash function?\n\n`hash('ab',100)`\n\
    \nThe ASCII code for `a` is 97 and the ASCII code for `b` is 98\\. 97 + 98 = 195\\\
    . 195 % 100 is 95 and that is what is returned from our hash function. 95 is the\
    \ array index where the value will be stored in our hash table.\n\nYou may also\
    \ want to use more sophisticated approaches like *polynomial string hash* to make\
    \ the hash code more unique. We won’t cover these more sophisticated approaches,\
    \ but you can check the footnotes at the end of this chapter if you’d like to\
    \ learn more about different hash function techniques.\n\n### Collision Resolution\n\
    \nIdeally, the hash function will assign each key to a unique bucket, but most\
    \ hash table designs employ an imperfect hash function, which might cause hash\
    \ collisions where the hash function generates the same index for more than one\
    \ key.\n\nFor example:\n\n```\nASCII for 'a' is 97, for 'd' is 100.\n\nHash for\
    \ `a`: (97) % 100 = 97\nHash for `ad`: (97 + 100) % 100 = 97\n```\n\nThese collisions\
    \ must be accommodated in some way otherwise the `write` operation will override\
    \ the values for keys `a` and `ad` You might get the value for `a` when you wanted\
    \ the `ad` value and vice-versa.\n\n**Separate chaining**\n\nSeparate chaining\
    \ is a technique where we convert each bucket to a linked list. Then each bucket\
    \ will be able to store many values instead of just one. If a collision happens\
    \ we’ll attach new value to the tail of bucket’s linked list.\n\n![](images/05-hash-table----collisions.png)\n\
    \nThe `read` operation will calculate the bucket number first and then do a lookup\
    \ in the bucket’s linked list by key. Here are the required steps to fetch Billy\
    \ Black’s phone number from the example above using a linked list for our bucket:\n\
    \n1.  Calculate hash code for the `Billy Black` key. Let’s assume that hash code\
    \ for the `Billy Black` key is `11`.\n\n2.  Calculate the bucket index by doing\
    \ a modulo operation. With `5` buckets available we’ll get bucket index equal\
    \ to `11 % 5 = 1`.\n\n3.  Fetch the linked list from the cell with index `1` and\
    \ go through each of its values comparing each value key with the key we need\
    \ (in our case is `Billy Black`). Once we’ve found the linked list node with `Billy\
    \ Black` key we just return it."
