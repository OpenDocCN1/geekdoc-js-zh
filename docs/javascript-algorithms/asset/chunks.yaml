    \ Without Repetitions\n\nLet’s take a simple example and form combinations *without*\
    \ repetitions of size `r = 2` out of a set `S = {A, B, C}` (`n = 3`). The combination\
    \ set `C` in this case will look like the following:\n\n```\nS = {A, B, C}\nr\
    \ = 2\n\nC = {\n    {A, B},\n    {A, C},\n    {B, C},\n}\n```\n\nNow, let’s try\
    \ to generalize this example and find out the formula of how many combinations\
    \ without repetitions (of size `r`) are there for the set of size `n`. We may\
    \ do it by following these two steps:\n\n*   Assume that the order **does** matter\
    \ (like with permutations) and count the number of permutations of size `r` without\
    \ repetitions.\n\n*   Afterwards assume that the order **does not** matter and\
    \ eliminate all duplicated combinations.\n\nFrom the chapter on permutations we\
    \ already know that the number of permutations without repetitions of size `r`\
    \ for a set of size `n` may be calculated as $P(n, r) = \\frac{n!}{(n - r)!}$.\
    \ If we’re dealing with the permutations of size `r = 2` for the set `S = {A,\
    \ B, C}` we will have $P(n, r) = \\frac{n!}{(n - r)!} = \\frac{3!}{(3 - 2)!} =\
    \ 3! = 6$ permutations:\n\n```\nS = {A, B, C}\nr = 2\n\nP = {\n    {A, B},\n \
    \   {B, A},\n    {A, C},\n    {C, A},\n    {B, C},\n    {C, B},\n}\n```\n\nThis\
    \ set `P` is a permutation. What if we’ll ignore the ordering and will treat subsets\
    \ of a set `P` as combinations? We will find out that `P` has duplicate combinations.\n\
    \n```\nP = {\n    {A, B},\n    {B, A}, <-- duplicate combination\n\n    {A, C},\n\
    \    {C, A}, <-- duplicate combination\n\n    {B, C},\n    {C, B}, <-- duplicate\
    \ combination\n}\n```\n\nNow we need to figure out how many duplicates we have\
    \ and eliminate them from our calculations. To do this, we need to figure out\
    \ how many ways are there to generate all permutations without repetitions of\
    \ size `r = 2` for the sets of size `n = 2`. For example the set `{A, B}` has\
    \ two permutations without repetitions and they are `{A, B}` and `{B, A}`.\n\n\
    From the chapter on permutations, we know that there are $r!$ permutations that\
    \ exist in this case (when `r = n`). And this is because we have `r` options for\
    \ the first element of the permutations to choose from. Then we have `r - 1` options\
    \ for the second element of the permutations and so on. In result we will have\
    \ $r \\times (r-1) \\times (r-2) \\times \\dots \\times 1 = r!$ permutations.\n\
    \nFinally, in order find out how many combinations without permutations we have\
    \ we need to divide the number of permutations without repetitions by the number\
    \ of duplicated combinations.\n\n> **$C(n, r) = \\frac{n!}{(n - r)!} \\times \\\
    frac{1}{r!} = \\frac{n!}{r!(n - r)!}$**\n\nSo according to this formula the number\
    \ of combinations without repetitions of size `r = 2` for the set `S = {A, B,\
    \ C}` equals to $C(n, r) = \\frac{3!}{2!(3-2)!} = \\frac{3!}{2!} = \\frac{6}{2}\
    \ = 3$.\n\n### Combinations With Repetitions\n\nLet’s take a simple example and\
    \ form combinations *with* repetitions of size `r = 2` out of a set `S = {A, B,\
    \ C}` (`n = 3`). The combination set `C` in this case will look like the following:\n\
    \n```\nS = {A, B, C}\nr = 2\n\nC = {\n    {A, A},\n    {A, B},\n    {A, C},\n\
    \    {B, B},\n    {B, C},\n    {C, C},\n}\n```\n\nIt turned out that the number\
    \ of combinations *with* repetitions equals to number of combinations *without*\
    \ repetitions but for imaginary set `S` of length `r + (n - 1)`. The proof of\
    \ this fact is out of scope of this article but the final formula would look like\
    \ the following:\n\n> **$C(n, r) = \\frac{(r + n - 1)!}{r!(n - 1)!}$**\n\n###\
    \ Application\n\nPermutations and combinations are useful when solving the problems\
    \ relevant to **probability**. Since we may generate all possible options for\
    \ specific situation (or at list to calculate the number of possible options)\
    \ we may also conclude what are the chances for each options to occur. This might\
    \ be simple cases like predicting the probability of lottery winning but also\
    \ it may go beyond that to more scientific areas.\n\n### Usage Example\n\nBefore\
    \ we move on with combination implementation let’s imagine that we already have\
    \ a `combineWithoutRepetitions()` and `combineWithRepetitions()` functions implemented\
    \ and let’s try to use it. By using `combineWithoutRepetitions()` we will try\
    \ to generate all possible web-developers teams compositions out of the list of\
    \ available developers. And by using `combineWithRepetitions()` we will try to\
    \ generate all possible ice cream scoops combinations."
