    - Combinations on “Math is Fun” [https://www.mathsisfun.com/combinatorics/combinations-permutations.html](https://www.mathsisfun.com/combinatorics/combinations-permutations.html)\n\
    - Combinations on Medium [https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5](https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5)\n\
    - Combinations example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/combinations](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/combinations)\n\
    \n## Sorting: Quicksort\n\nDifficulty: medium\n\n### The Task\n\nSort an unordered\
    \ array of values in increasing order. For example, an unsorted array `[10, 3,\
    \ 0, 15, 10, 18, 2, 7, 11]` sorted in increasing order would look like this: `[0,\
    \ 2, 3, 7, 10, 10, 11, 15, 18]`.\n\nIn addition to sorting numbers, we’d like\
    \ to also be able to sort an array of objects. In order to accomplish this, in\
    \ our algorithm we will implement a comparison callback function. For example,\
    \ it should be possible to sort an array `[{name: \"Bill\", age: 23}, {name: \"\
    Jane\", age: 18}]` by age in increasing order to get an array `[{name: \"Jane\"\
    , age: 18}, {name: \"Bill\", age: 23}]`.\n\nIn our description of the task, we\
    \ only mention sorting by increasing order. Once you understand how the quicksort\
    \ algorithm works though, you’ll be able to change the algorithm to support sorting\
    \ by increasing order.\n\n### The Algorithm\n\n`Quicksort` is an `O(n * log(n))`\
    \ efficient and commonly used sorting algorithm. Quicksort is a `comparison sort`,\
    \ meaning that it can sort items of any type for which a “less-than” relation\
    \ is defined. Quicksort is a `divide and conquer` algorithm. It means that it\
    \ splits the original problem into smaller sub-problems and tries to solve them\
    \ first. Then it combines the solutions to the smaller problems to come up with\
    \ the final solution. In our case, we will split an array into two parts and then\
    \ sort smaller arrays first before merging them into one final sorted array.\n\
    \nThe algorithm consists of three recursive (repeating over sub-problems) steps:\n\
    \n- **Pivot selection**: pick an element, called a `pivot`, from the array (usually\
    \ the first, middle or the last one is taken).\n- **Partitioning**: split an array\
    \ into three sub-arrays: `left` (with all the elements that are smaller than the\
    \ pivot element), `center` (with all the elements that are equal to pivot element)\
    \ and `right` (with all the elements that are greater than the pivot element).\n\
    - **Recurse**: apply two previous steps to smaller arrays `left` and `right` by\
    \ choosing the new pivot element for them with further partitioning. We don’t\
    \ need to apply those steps to the `center` array because it is already sorted\
    \ and contains all equal elements.\n\nThe base case for this algorithm is to sort\
    \ an array with just one element. With one element in the array, no sorting is\
    \ necessary so we return the value.\n\nThe recursive steps of the Quicksort algorithm\
    \ are illustrated in the diagram below:\n\n![](images/21-quicksort----quicksort.png)\n\
    \n### Usage Example\n\nBefore we move on with `quickSort()` function implementation\
    \ let’s imagine that we already have one implemented and let’s use it for sorting\
    \ a list of usernames in `O(n * log(n))` time. This will help us to understand\
    \ what parameters the function needs and what the result will be when the algorithm\
    \ is finished. In this example, we will use a comparator function to sort the\
    \ array. This allows us to use custom comparison logic when sorting the array\
    \ of objects.\n\n```javascript\n 1 // Import dependencies.\n 2 import quickSort\
    \ from './quickSort';\n 3 \n 4 // Let's sort user list by age in O(n * log(n))\
    \ time.\n 5 \n 6 // Init users list.\n 7 const notSortedUserList = [\n 8   { age:\
    \ 18, name: 'Bill' },\n 9   { age: 20, name: 'Kate' },\n10   { age: 20, name:\
    \ 'Tom' },\n11   { age: 24, name: 'Cary' },\n12   { age: 37, name: 'Mike' },\n\
    13   { age: 42, name: 'Ben' },\n14   { age: 50, name: 'Jane' },\n15   { age: 60,\
    \ name: 'Julia' },\n16 ];\n 17 \n18 // Create comparator function that will compare\
    \ two user objects.\n19 const userComparator = (user1, user2) => {\n20   if (user1.age\
    \ === user2.age) {\n21     return 0;\n22   }\n23 \n24   return user1.age > user2.age\
    \ ? 1 : -1;\n25 };\n26 \n27 // Sort user list.\n28 const sortedUserList = quickSort(notSortedUserList,\
    \ userComparator);\n29 \n30 // eslint-disable-next-line no-console\n31 console.log(sortedUserList);\n\
    32 /*\n33   The output will be:\n34   [\n35       { age: 18, name: 'Bill' },\n\
    36       { age: 20, name: 'Kate' },\n37       { age: 20, name: 'Tom' },\n38  \
    \     { age: 24, name: 'Cary' },\n39       { age: 37, name: 'Mike' },\n40    \
    \   { age: 42, name: 'Ben' },\n41       { age: 50, name: 'Jane' },\n42       {\
    \ age: 60, name: 'Julia' },\n43   ]\n44  */\n```\n\n21-quicksort/example.js\n\n\
    ### Implementation\n\nThere are several ways to implement the quicksort algorithm.\
    \ They differ in two ways: how the pivot point is chosen (first element, middle\
    \ element, last element) and the way the partitioning happens (in-place, not in-place).\
    \ You will find the different implementations in the [JavaScript Algorithms repository](https://github.com/trekhleb/javascript-algorithms).\n\
    \nIn this chapter, we will implement quicksort by picking the first element as\
    \ the pivot point and we will do “not in-place” partitioning to make the algorithm\
    \ implementation more clear and readable.\n\nSince we want our `quickSort()` function\
    \ to be able to sort not only numbers but objects as well, we will re-use the\
    \ `Comparator` utility class that we’ve already implemented in the “Linear Search”\
    \ chapter. Please address “Linear Search” chapter to get the details of `Comparator`\
    \ class implementation. This is a simple class that provides a common interface\
    \ for object comparison with `equal()`, `lessThan()` and `greaterThan()` methods.\n"
