    \n## Priority Queue\n\n*   *Difficulty: medium*\n\n**Priority queue** is a data\
    \ type which is like a regular queue or stack data structure, but where additionally\
    \ each element has a “priority” associated with it. In a priority queue, an element\
    \ with high priority is served before an element with low priority (or vice versa\
    \ depending on the queue setup).\n\nWhile priority queues are often implemented\
    \ with heaps, they are conceptually distinct from heaps. A priority queue is an\
    \ abstract concept like “a list” or “a map”; just as a list can be implemented\
    \ with a linked list or an array, a priority queue can be implemented with a heap\
    \ or other methods such as an unordered array.\n\nThe idea of using Heap data\
    \ structure to implement priority queue is based on the heap property of always\
    \ returning the lowest (in case of min heap) or highest (in case of max heap)\
    \ elements when polling data from the heap. Once we change the heap behavior to\
    \ respect the priority of each item instead of their values we will get a priority\
    \ queue.\n\nOn the example below you may see the order of polling the elements\
    \ from priority queue. The `poll()` operation fetches the next most prioritized\
    \ element from the queue and reduces the queue by one element.\n\n![](images/07-priority-queue----priority-queue.png)\n\
    \nNormally the priority queue is implemented in a way that item with higher value\
    \ of the priority property is being polled from the queue first. But alternative\
    \ way of implementing priority queue is to treat lower numbers as more prioritised\
    \ so that the item with priority `0` will be pulled before the item with priority\
    \ `8`. It doesn’t matter that much which way we take. But since we already have\
    \ `MinHeap` class implemented in one of the previous chapters let’s implement\
    \ the reversed version of priority queue.\n\n![](images/07-priority-queue----priority-queue-reversed.png)\n\
    \n### Application\n\nPriority queue is being used as a part of Dijkstra’s algorithm\
    \ (finding the shortest paths in a graph), Prim’s algorithm (finding the minimum\
    \ spanning tree of a connected and undirected graph), sorting algorithms and others.\n\
    \n### Basic Operations\n\nHere are the basic operations normally performed on\
    \ a priority queue:\n\n*   **Poll** - extracts the next most important item from\
    \ the queue according to its priority (in our case we will fetch the items with\
    \ lower values of priorities first).\n\n*   **Peek** - returns the next prioritized\
    \ item from the queue without extracting it.\n\n*   **Add** - adds new element\
    \ to the queue with specific priority.\n\n*   **Remove** - removes the element\
    \ from the queue by its value.\n\n*   **Change Priority** - changes the priority\
    \ of the item in priority queue.\n\n*   **Has Value** - checks if item with specific\
    \ value exists in a queue.\n\n### Usage Example\n\nBefore we move on with actual\
    \ `PriorityQueue` class implementation let’s imagine that we already have it implemented\
    \ and try to use it. This will help us to understand the interface of working\
    \ the `PriorityQueue` class.\n\nJust for example we may do a simple trick and\
    \ sort the array of cities in population increasing order using `PriorityQueue`."
