    \ `nodeToRemove`，则将该子节点设置为 `null`，函数返回 `true` 表示移除过程成功。否则，此方法返回 `false`，意味着 `nodeToRemove`\
    \ 不在当前节点的节点中。\n\n```\n76   /**\n77    * @param {BinarySearchTreeNode} nodeToRemove\n\
    78    * @return {boolean}\n79    */\n80   removeChild(nodeToRemove) {\n81    \
    \ if (this.left && this.left === nodeToRemove) {\n82       this.left = null;\n\
    83       return true;\n84     }\n85 \n86     if (this.right && this.right ===\
    \ nodeToRemove) {\n87       this.right = null;\n88       return true;\n89    \
    \ }\n90 \n91     return false;\n92   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\
    \n### BinarySearchTree\n\n`BinarySearchTree` 类只是对 `BinarySearchTreeNode` 类的一个薄层封装，它隐藏了所有的辅助方法，并使得二叉搜索树（BST）的操作在语义上更加符合逻辑。\n\
    \n```\n 1 import BinarySearchTreeNode from './BinarySearchTreeNode';\n 2 export\
    \ default class BinarySearchTree {\n 3   constructor() {\n 4     this.root = null;\n\
    \ 5   }\n 6 \n 7   /**\n 8    * 根据值查找节点。\n 9    * @param {*} value\n 10    * @return\
    \ {BinarySearchTreeNode}\n 11    */\n 12   find(value) {\n 13     return this.root.find(value);\n\
    \ 14   }\n 15 \n 16   /**\n 17    * 查找最小值的节点。\n 18    * @return {BinarySearchTreeNode}\n\
    \ 19    */\n 20   findMin() {\n 21     return this.root.findMin();\n 22   }\n\
    \ 23 \n 24   /**\n 25    * 查找最大值的节点。\n 26    * @return {BinarySearchTreeNode}\n\
    \ 27    */\n 28   findMax() {\n 29     return this.root.findMax();\n 30   }\n\
    \ 31 \n 32   /**\n 33    * 在树中插入新节点。\n 34    * @param {*} value\n 35    * @param\
    \ {*} data\n 36    * @return {BinarySearchTreeNode}\n 37    */\n 38   insert(value,\
    \ data = null) {\n 39     this.root.insert(value, data);\n 40   }\n 41 \n 42 \
    \  /**\n 43    * 检查树是否包含特定值。\n 44    * @param {*} value\n 45    * @return {boolean}\n\
    \ 46    */\n 47   contains(value) {\n 48     return this.root.contains(value);\n\
    \ 49   }\n 50 \n 51   /**\n 52    * 通过值从树中移除节点。\n 53    * @param {*} value\n 54\
    \    * @return {boolean}\n 55    */\n 56   remove(value) {\n 57     return this.root.remove(value);\n\
    \ 58   }\n 59 \n 60   /**\n 61    * 将树转换为字符串。\n 62    * @return {string}\n 63\
    \    */\n 64   toString() {\n 65     return this.root.toString();\n 66   }\n 67\
    \ }\n```\n\n"
- fmt: "\n**Heap property**: if `P` is a parent node of child node `C`, then the value\
    \ of `P` is either `greater than or equal to` (in a **max heap**) or `less than\
    \ or equal to** (in a **min heap**) the key of `C`.\n\nTake a look at the following\
    \ example of a binary **min-heap** below. Since `1` is the smallest number in\
    \ the heap, it is placed at the root of the heap. All children of the root are\
    \ bigger than the root. The same works for the children: the left child of the\
    \ root is smaller than its children and so on. The tree itself is a complete binary\
    \ tree because all of its levels are full (except the last one that is being filled\
    \ from left to right).\n\n![](images/07-heap----min-heap.png)\n\nHere is an example\
    \ of a binary **max-heap**. `100` is the largest of all the numbers in the heap\
    \ so it is placed at the root of the heap. All children of the root are smaller\
    \ than the root. The same works for the children: the left child of the root is\
    \ smaller than its children and so on. The tree itself is also complete binary\
    \ tree because all its levels are full (except the last one that is being filled\
    \ from left to right).\n\n![](images/07-heap----max-heap.png)\n\n### Application\n\
    \nOne of the direct applications of the heap is the **heap-sort** algorithm (one\
    \ of the best sorting methods being in-place and with no quadratic worst-case\
    \ scenarios). The binary heap was introduced by J. W. J. Williams in 1964, as\
    \ a data structure particularly used for the heap-sort algorithm.\n\nYou might\
    \ have noticed from the illustrations above that heaps allows us to have a quick\
    \ access to the min/max values of a set of values. This property of a heap makes\
    \ it very efficient when it comes to implementation of an abstract data type called\
    \ **priority queue**. In a priority queue, an element with a high priority is\
    \ served before an element with a low priority. By storing the priorities of the\
    \ elements in a heap we’ll be able to have a quick access to the next most important\
    \ element in a queue.\n\nHeaps are also used by **graph algorithms** such as `Prim’s\
    \ minimal-spanning-tree` algorithm and `Dijkstra’s shortest-path` algorithm.\n\
    \n### Basic Operations\n\nHere are the basic operations normally performed on\
    \ a heap:\n\n*   **Peek** - returns the minimum (for min-heap) or maximum (for\
    \ max-heap) element of a heap without extracting it.\n*   **Poll** - extracts\
    \ the minimum (for min-heap) or maximum (for max-heap) element out of a heap.\n\
    *   **Add** - adds new element to a heap.\n*   **Remove** - removes the element\
    \ from the heap by its value.\n\nLater in this chapter we will get to exact implementation\
    \ of each of these operations and you will see the details. But what is worth\
    \ mentioning here is that for operations that modify the heap (like `poll`, `add`\
    \ or `remove`) we first try to keep the `shape property` of the heap. And then\
    \ we try to modify the heap binary tree structure in such a way that `heap property`\
    \ is also met. So there are two more common heap operations: **heapify up** and\
    \ **heapify down**. These operations are internal and are not used directly. The\
    \ only purpose of these two operations is to preserve the heap property after\
    \ heap modifications.\n\n### Usage Example\n\nBefore we move on to the actual\
    \ implementation let’s imagine we already have a `MinHeap` class implemented and\
    \ let’s use it. This will help us to better understand the meaning of each class\
    \ method that we’re going to implement.\n\n```javascript\n 1 // Import MinHeap\
    \ class.\n 2 import { MinHeap } from './MinHeap';\n 3 \n 4 // Create min-heap\
    \ instance.\n 5 const minHeap = new MinHeap();\n 6\n 7 minHeap.isEmpty(); // =>\
    \ true\n 8\n 9 // Add new element to min-heap.\n10 minHeap.add(5);\n11 minHeap.isEmpty();\
    \ // => false\n12 minHeap.peek(); // => 3\n13 minHeap.toString(); // => '5'\n\
    14 \n15 // Add more elements.\n16 minHeap.add(3);\n17 // Peek operation will always\
    \ return the minimum element of the heap.\n18 minHeap.peek(); // => 3\n19 minHeap.toString();\
    \ // => '3,5'\n20 \n21 minHeap.add(10);\n22 minHeap.peek(); // => 3\n23 minHeap.toString();\
    \ // => '3,5,10'\n24 \n25 // Extract the minimum value out of a heap.\n26 minHeap.poll();\
    \ // => 3\n27 minHeap.peek(); // => 5\n28 minHeap.toString(); // => '5,10'\n29\
    \ \n30 // Remove element from a heap.\n31 minHeap.remove(10);\n32 minHeap.peek();\
    \ // => 5\n33 minHeap.toString(); // => '5'\n```\n\n`07-heap/example.js`\n\n###\
    \ Implementation\n\n#### Storing Heap as Array\n\nWe will construct a heap as\
    \ a **complete binary tree**. This means that it is a binary tree where every\
    \ level, except possibly the last one, is completely filled, and all nodes are\
    \ as far left as possible.\n\n*Elements of a heap are commonly stored in array*.\
    \ Any binary tree can be stored in an array, but because a binary heap is always\
    \ a complete binary tree.\n\n![](07-heap-as-array.png)\n\nAfter saving the heap\
    \ as an array we can easily find the parent and children of any node. For a node\
    \ at index `i`, the parent is at index `floor((i - 1) / 2)`, the left child is\
    \ at `2 * i + 1`, and the right child is at `2 * i + 2`.\n\n#### Storing Objects\
    \ in Heap\n\nSometimes it may be required to store not only numbers but also objects\
    \ in a heap. For example we might want to store user objects like `{name: 'Paul',\
    \ priority: 5}` and `{name: 'Jane', priority: 3}` in a heap so that the next call\
    \ of `poll()` method would return the user with higher priority. In order to achieve\
    \ that we need to provide a custom way of comparing objects in a heap. Therefore\
    \ we’re going to implement a universal `Comparator` utility class that will provide\
    \ a common interface for object comparison. After that we will use `Comparator`\
    \ utility to implement a `MinHeap` class.\n\n###### Class `Comparator`\n\nLet’s\
    \ declare the class.\n\n```javascript\n1 export default class Comparator {\n```\n\
    \nutils/comparator/Comparator.js\n\n##### `constructor`\n\nThe `Comparator` constructor\
    \ will accept the compare function callback as an argument. This function accepts\
    \ two values for comparison. It will return `0` if two objects are equal, `-1`\
    \ if the first object is smaller than the second one and `1` if the first object\
    \ is greater than the first one.\n\nThe `Comparator` class itself will not know\
    \ anything about the comparison logic. It will just provide a common interface\
    \ (the methods that we’re going to implement below) to work with.\n\n`compareFunction`\
    \ is an optional argument for the `Comparator` constructor. If the `compareFunction`\
    \ is not provided we fall back to `defaultCompareFunction()` function.\n\n```javascript\n\
    16   /**\n17    * @param {function(a: *, b: *)} [compareFunction] - It may be\
    \ custom compare func\\\n18 tion that, let's\n19    * say may compare custom objects\
    \ together.\n20    */\n21   constructor(compareFunction) {\n22     this.compare\
    \ = compareFunction || Comparator.defaultCompareFunction;\n23   }\n```\n\nutils/comparator/Comparator.js\n\
    \n##### `defaultCompareFunction()`\n"
