    \ work on the new project it doesn’t matter which order you select them. The only\
    \ thing that matters is whether the developer has been selected or not. In a result\
    \ you may end up with combination `{John, Kate, Julia}` which is actually the\
    \ same as `{Kate, John, Julia}` because the order doesn’t matter. This is an example\
    \ of a **combination without repetition** because you can’t select the same developer\
    \ twice (the set `{Bill, Bill}` is not possible and doesn’t make sense).\n\nAnother\
    \ example of a combination is a change set that you generate out of the coins\
    \ set in your pocket. Let’s say you have a set of coins `{1, 1, 5, 5, 5, 10, 10,\
    \ 10}` and you need to give a change of 27 coins. You have a set of 3 unique elements\
    \ `{1, 5, 10}` (`n = 3`) and you’re allowed to pick the same element several times.\
    \ You may end up with the combination `{10, 10, 5, 1, 1}` (`r = 5`) which is the\
    \ same as `{1, 10, 10, 1, 5}` because the order doesn’t matter. This is an example\
    \ of a **combination with repetition** because you may include the same element\
    \ into a combination several times (the set of coins `{1, 1, 1}` is possible and\
