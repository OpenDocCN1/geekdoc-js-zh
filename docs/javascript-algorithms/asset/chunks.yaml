    \ = ['Bill', 'John', 'Kate', 'Jane', 'Mike'];\n 9 const possibleTeams = combineWithoutRepetitions(candidates,\
    \ teamSize);\n10 \n11 // eslint-disable-next-line no-console\n12 console.log(possibleTeams);\n\
    13 /*\n14  输出将是：\n15  [\n16       ['Bill', 'John', 'Kate'],\n17       ['Bill',\
    \ 'John', 'Jane'],\n18       ['Bill', 'John', 'Mike'],\n19       ['Bill', 'Kate',\
