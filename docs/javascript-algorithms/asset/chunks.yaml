    ## 二叉搜索树 (BST)\n\n* *难度：中等*\n\n在我们深入二叉搜索树主题之前，首先需要理解什么是`tree`（树）和二叉树数据结构。\n\n\
    ### 树\n\n`tree data structure`被定义为节点的集合（从`root 节点`开始），其中每个节点都是由一个值和一个指向节点的引用列表（“子节点”）组成的数据结构，其限制条件是没有重复引用，且没有引用指向根节点。这些引用通常被称为`边`。\n\
    \n#### 什么是节点？\n\n> 节点是计算机科学中使用的基本单元。节点是更大数据结构（如链表和树数据结构）的组成部分。节点包含数据，并可能链接到其他节点。节点之间的链接通常通过指针实现。-[Wikipedia](https://en.wikipedia.org/wiki/Node_(computer_science))\n\
    \n树数据结构中的每个节点（根节点除外）都通过一条边与另一个另一个节点连接。所有节点形成`parent -> child`关系，树中没有循环。\n\n这里是一个树的示例：\n\
    \n![](img/06-binary-search-tree----tree.png)\n\n在这个示例中，树由一组`nodes` {\"a”, “b”,\
    \ “c”, …, “i”}和一组`edges` {\"ab”, “ac”, “bd”, …, “fi”}组成，在节点之间形成父子关系。节点“a”是树的`root`，它没有父节点但有两个`child`节点——“b”和“c”。示例中的节点“f”有一个`parent`“c”和三个子节点“g”、“h”和“i”。没有节点的节点被称为`leaf\
    \ nodes`（叶子节点）。在示例中，节点“d”、“e”、“g”、“h”、“i”是叶子。\n\n树的`size`是它包含的节点数量。在上面的示例中，树的大小为\
    \ 9。\n\n节点的`height`是从它到最远叶节点的最长路径（边的数量）。根节点的高度就是`height of tree`。在上面的示例中，节点“c”的高度为\
    \ 2，因为从它到最深叶节点有两条边。\n\n### 二叉树\n\n`binary tree`是每个节点最多有两个子节点的树。\n\n![](img/06-binary-search-tree----tree.png)\n\
    \n### 二叉搜索树\n\n`binary search tree` (或 `BST`) 是一种二叉树，其中每个节点（叶子节点除外）满足以下规则：\n\n\
    * 节点`right subtree`的所有值必须`greater`节点本身，\n* 节点`left subtree`的所有值必须`less`节点本身。\n\
    \n叶子节点的节点为`null`，因此我们不对它们应用这些规则。\n\n这里是一个二叉搜索树的示例：\n\n![](img/06-binary-search-tree----binary-search-tree.png)\n\
    \n该树的根值为 `9`，其右子节点值为 `13`，大于根值。当我们向右子树移动时，发现右子树中的所有值都大于根节点。根节点的左子节点值为 `5`，小于根值。当我们向左子树移动时，发现左子树中的所有值都小于根节点。这些规则可以递归地应用于树中的所有节点。\n\
    \n### 应用\n\n当我们需要以`sorted`顺序维护`dynamically changing`的数据集时，可以使用二叉搜索树。\n\n### 基本操作\n\
    \n#### 搜索 (查找)\n\n二叉搜索树是排序的这一事实使得对树应用`binary search`方法并进行`fast lookup`成为可能。假设要在上面的树中查找值为\
    \ `7` 的节点。查找算法如下：\n\n1. 从根节点开始（将根节点视为当前节点）。\n2. 如果当前节点值大于 `7`，则向左（将左子节点变为当前节点）。否则，向右（将右子节点变为当前节点）。\n\
    3. 重复步骤 1 和 2，直到找到节点或当前节点没有剩余子节点。\n\n![](img/06-binary-search-tree----binary-search-tree-lookup.png)\n"
- fmt: "\nAfter every lookup iteration, we’re ignoring about half of the tree (or\
    \ subtree) and focusing on the other half. By focusing only on one half of the\
    \ tree and shrinking the search area by two on every iteration the time complexity\
    \ of lookup operation is `O(log(n))`.\n\n## Self-Balancing\n\nThe performance\
    \ of lookup operation in a binary search tree tightly depends on the shape of\
    \ the tree. For example, a balanced binary search tree takes `O(log(n))` time\
    \ to look for a specific value in a tree as explained above. But for pathological\
    \ binary search trees, the same operation takes `O(n)` time because the tree is\
    \ similar to a linked list.\n\nKeeping binary search trees balanced while adding\
    \ or removing nodes maintains the quick performance of the lookup operation. Several\
    \ data structures are built on top of binary search trees but with the additional\
    \ feature of balancing the tree after each modification: the [AVL Tree](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/avl-tree),\
    \ [Red-Black Tree](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/red-black-tree)\
    \ and others.\n\nIn this chapter, we will cover the basic implementation of a\
    \ binary search tree but without the re-balancing feature.\n\n## Inserting\n\n\
    To insert a new node into a binary search tree, we need to recursively compare\
    \ the current node value with a new node value. If the new node value is greater\
    \ than current node value we need to go right (make the right child the current\
    \ node). Otherwise, we need to go left (make the left child the current node).\
    \ Once the next child node is empty, it means we’ve reached the leaf node and\
    \ we’re ready to place a new node into its proper position.\n\n![](images/06-binary-search-tree----binary-search-tree-insertion.png)\n\
    \n## Removing\n\nRemoving the node from a binary search tree is a little bit trickier.\
    \ First, we need to find the node we want to remove (see the lookup operation\
    \ above). Several cases are possible:\n\n* `Removing a leaf node` - most straightforward\
    \ case, we remove the node.\n* `Removing a node with one child` - we make the\
    \ child node become a child node for the current node’s parent.\n* `Removing the\
    \ node with two children` - we need to find the next largest value (minimum value\
    \ in the right branch) and replace current node with that next largest value node.\n\
    \nHere is an illustration for the last case when the node has two children.\n\n\
    ![](images/06-binary-search-tree----binary-search-tree-removing.png)\n\n## Traversing\n\
    \nTraversing is visiting all the nodes of a tree in a specific order.\n\n![](images/06-binary-search-tree----binary-search-tree-traversal.png)\n\
    \nIn this chapter, we will implement in-order traversal to convert the binary\
    \ search tree to a sorted array.\n\n## Usage Example\n\nBefore we move on to the\
    \ exact JavaScript implementation of the binary search tree, let’s look at a use\
    \ case for our `BinarySearchTree` class and describe how we’re going to use it.\n\
    \nSay we have a collection of shopping items. And we want to make all of the following\
    \ operations to perform fast (in `O(log(n))` time): - getting items by specific\
    \ price, - inserting new items, - removing existing items, - getting the cheapest\
    \ item from the collection, - getting the most expensive item.\n\n```\n1 // Import\
    \ dependencies\n2 import BinarySearchTree from './BinarySearchTree';\n3 \n4 //\
    \ Create binary search tree instance.\n5 const bstCollection = new BinarySearchTree();\n\
    6 \n7 // Add shopping items to our binary search tree.\n8 // We will use price\
    \ as keys.\n9 bstCollection.insert(220, { title: 'Phone' });\n10 bstCollection.insert(3455,\
    \ { title: 'TV' });\n11 bstCollection.insert(8200, { title: 'Notebook' });\n12\
    \ bstCollection.insert(120, { title: 'Remote Control' });\n13 \n14 // Let's find\
    \ the cheapest and expensive items so far.\n15 const minItem = bstCollection.findMin().data;\
    \ // { title: 'Remote Control' }\n16 const maxItem = bstCollection.findMax().data;\
    \ // { title: 'Notebook' }\n17 \n18 // Let's find the item with the price 8200.\n\
    19 const item = bstCollection.find(3455).data; // { title: 'TV' }\n20 \n21 //\
    \ Remove the item by price.\n22 bstCollection.remove(120);\n23 // Check what is\
    \ the cheapest item at the moment.\n24 const newMinItem = bstCollection.findMin().data;\
    \ // { title: 'Phone' }\n25 \n26 // Now we may use the data we've fetched anyhow.\n\
    27 // eslint-disable-next-line\n28 console.log(minItem, maxItem, item, newMinItem);\n\
    ```\n06-binary-search-tree/example.js\n\n## Implementation\n\nWe’ll split our\
    \ implementation into two parts. First we will implement `BinarySearchTreeNode`\
    \ class which will represent nodes of the binary search tree and their functionality.\
    \ This class will contain the core functionality. Then we’ll implement `BinarySearchTree`\
    \ class that will just a wrapper over the `BinarySearchTreeNode` class and will\
    \ make working with binary search tree a bit easier.\n\n### BinarySearchTreeNode\n\
    \n#### constructor\n\nLet’s create the class.\n\n```javascript\n1 export default\
    \ class BinarySearchTreeNode {\n```\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \nOur constructor will accept the `value` parameter that we will use as a key\
    \ to define where in the tree the current node should be placed. All node comparisons\
    \ will be made using this `value` parameter. The `data` parameter serves as a\
    \ data bag that contains any type of data. For example it may contain a linked\
    \ list with all shopping items of a specific price, or it may contain a user object\
    \ with a name, telephone number, etc.\n\nIn our constructor, we’ll create pointers\
    \ to the left and right child as well as a pointer to the parent node. For the\
    \ root node in a tree the parent will always be `null`.\n\n```javascript\n2  \
    \ /**\n3    * @param {*} value - node value.\n4    * @param {*} data - node data\
    \ (could be anything).\n5    */\n6   constructor(value = null, data = null) {\n\
    7     this.left = null; // Pointer to the left child.\n8     this.right = null;\
    \ // Pointer to the right child.\n9     this.parent = null; // Pointer to the\
    \ parent node.\n10    this.value = value;\n11    this.data = data;\n12  }\n```\n\
    06-binary-search-tree/BinarySearchTreeNode.js\n\n#### find()\n\nThis method finds\
    \ the node in a whole tree by its `value` (key). It does a binary search tree\
    \ lookup operation that was in the explanation above. As a reminder, to find a\
    \ node by its key in the binary search tree we need to recursively compare its\
    \ value with the current node and then go left (to the left child) if current\
    \ node value is bigger than the one we want to find. Otherwise, we need to go\
    \ right (to the right node). The same process is repeated for the next node (left\
    \ or right child).\n\n```javascript\n168   /**\n169    * @param {*} value\n170\
    \    * @return {BinarySearchTreeNode}\n171    */\n172   find(value) {\n173   \
    \  // Check the root.\n174     if (this.value === value) {\n175       return this;\n\
    176     }\n177 \n178     if (value < this.value && this.left) {\n179       //\
    \ Check left nodes.\n180       return this.left.find(value);\n181     }\n182 \n\
    183     if (value > this.value && this.right) {\n184       // Check right nodes.\n\
    185       return this.right.find(value);\n186     }\n187 \n188     return null;\n\
    189   }\n```\n06-binary-search-tree/BinarySearchTreeNode.js\n"
