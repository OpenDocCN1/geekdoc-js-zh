    \ above the size of the tree is 9.\n\nThe **height** of the node is the longest\
    \ path (the number of edges) from it to the farthest leaf. The height of the root\
    \ node is the **height of the tree**. In the example above the height of the node\
    \ *“c”* is 2 since there are two edges from it to the deepest leaves (i.e., *“cf”*\
    \ and *“fg”*). And the height of the tree is 3.\n\nHere are several examples that\
    \ are **not trees** because some nodes have more than two parents and some nodes\
    \ form a cycle.\n\n![](images/06-binary-search-tree----not-a-tree.png)\n\n###\
    \ Binary Tree\n\nA **binary tree** is a tree in which each node has *at most two\
    \ children*, which are referred to as the *left child* and the *right child*.\n\
    \nHere is an example of a binary tree:\n\n![](images/06-binary-search-tree----binary-tree.png)\n\
    \nThe **root** node *“5”* has **left child** *“15”* and **right child** *“21”*.\
    \ The node *“21”* has only one right child (the node *“3”*) which does not violate\
    \ the binary tree definition.\n\n#### Types of Binary Trees\n\nThere are several\
    \ types of binary trees:\n\n*   A **full** binary tree is a binary tree with all\
    \ nodes having either 0 or 2 children.\n\n*   A **complete** binary tree is a\
    \ binary tree in which all levels (except possibly the deepest one) are entirely\
    \ filled with nodes. The deepest level may be partially filled, but all nodes\
    \ must be filled starting from the left without forming any gaps between them.\n\
    \n*   A **perfect** binary tree is a binary tree in which all internal nodes have\
    \ two children and all leaves have the same depth.\n\n*   A **balanced** binary\
    \ tree is a binary tree in which for all the nodes the left and right subtrees\
    \ differ in height by no more than 1.\n\n*   A **pathological** (or **degenerate**)\
    \ binary tree is a binary tree in which each node has at most one child. This\
    \ type of tree will perform similarly to linked lists.\n\n![](images/06-binary-search-tree----binary-tree-types.png)\n\
    \n### Binary Search Tree\n\nA **binary search tree** (or BST) is a binary tree\
    \ in which each node (except leaf nodes) satisfies the following rules:\n\n* \
    \  all values of the *right subtree* of a node must be *greater* than the node\
    \ value itself,\n\n*   all values of the *left subtree* of a node must be *less*\
    \ than the node value itself.\n\nThe leaf nodes children are `null` therefore\
    \ we’re not applying these rules to them.\n\nHere is an example of a binary search\
    \ tree:\n\n![](images/06-binary-search-tree----binary-search-tree.png)\n\nThe\
    \ root value for this tree is `9` and the root’s right child value is `13` which\
    \ is greater than the root value. As we travel farther down the right subtree,\
    \ we see that all the values in the right subtree are greater than the root node\
    \ value. The root’s left child value is `5` which is less than the root value.\
    \ As we travel down the left subtree, we see that all the values in the left subtree\
    \ are less than the root node value. These rules may be applied to all of the\
    \ nodes in the tree recursively.\n\n### Application\n\nBinary search trees may\
    \ be used in cases when we need to maintain *dynamically changing* datasets in\
    \ *sorted* order, for some sortable data.\n\n### Basic Operations\n\n#### Searching\
    \ (Lookup)\n\nThe fact that a binary search tree is a sorted tree makes it possible\
    \ to apply a *binary search* approach to the tree and perform a *fast lookup*.\n\
    \nLet’s imagine that we want to find the node with the value `7` in binary search\
    \ tree mentioned above. The lookup algorithm looks like this:\n\n1.  Start from\
    \ the root node (treat the root node as current node).\n\n2.  If current node\
    \ value is greater than `7`, then go left (make the left child the current node).\
    \ Otherwise, go right (make the right child the current node).\n\n3.  Repeat steps\
    \ 1 and 2 until the node is found or until there is no children of the current\
    \ node are left.\n\n![](images/06-binary-search-tree----binary-search-tree-lookup.png)"
