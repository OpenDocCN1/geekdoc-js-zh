    \ Home 到 Office 的最短距离是 14。\n71  */\n72 \n73 // 现在既然我们知道了从 Home 到 Office 的最短距离\n\
    74 // 让我们找出最短距离的最短路径。\n75 // ...（剩余文本）\n```\n"
- fmt: "\n4. ** to step 1 and and and it the the vertex visiting queue is empty. The\
    \ emptiness of the queue is being checked by using `isEmpty()` method of `PriorityQueue`\
    \ instance.\n\nHere is an example of how `dijstra()` function may be implemented.\n\
    \n```\n10 /**\n11  * Implementation of Dijkstra algorithm of finding the shortest\
    \ paths to graph nodes.\n12  * @param {Graph} graph - graph we're going to traverse.\n\
    13  * @param {GraphVertex} startVertex - traversal start vertex.\n14  * @return\
    \ {ShortestPaths}\n15  */\n16 export default function dijkstra(graph, startVertex)\
    \ {\n17   // Init helper variables that we will need for Dijkstra algorithm.\n\
    18   const distances = {};\n19   const visitedVertices = {};\n20   const previousVertices\
    \ = {};\n21   const queue = new PriorityQueue();\n22 \n23   // Init all distances\
    \ with infinity assuming that currently we can't reach\n24   // any of the vertices\
    \ except the start one.\n25   graph.getAllVertices().forEach((vertex) => {\n26\
    \     distances[vertex.getKey()] = Infinity;\n27     previousVertices[vertex.getKey()]\
    \ = null;\n28   });\n29 \n30   // We are already at the startVertex so the distance\
    \ to it is zero.\n31   distances[startVertex.getKey()] = 0;\n32 \n33   // Init\
    \ vertices queue.\n34   queue.add(startVertex, distances[startVertex.getKey()]);\n\
    35 \n36   // Iterate over the priority queue of vertices until it is empty.\n\
    37   while (!queue.isEmpty()) {\n38     // Fetch next closest vertex.\n39    \
    \ const currentVertex = queue.poll();\n40 \n41     // Iterate over every unvisited\
    \ neighbor of the current vertex.\n42     currentVertex.getNeighbors().forEach((neighbor)\
    \ => {\n43       if (!visitedVertices[neighbor.getKey()]) {\n44         const\
    \ edgeWight = neighbor.edge.weight;\n45         const existingDistanceToNeighbor\
    \ = distances[neighbor.getKey()];\n46         const distanceToNeighborFromCurrent\
    \ = distances[currentVertex.getKey()] + ed\\\n47 geWight;\n48 \n49         //\
    \ If we've found shorter path to the neighbor - update it.\n50         if (distanceToNeighborFromCurrent\
    \ < existingDistanceToNeighbor) {\n51           distances[neighbor.getKey()] =\
    \ distanceToNeighborFromCurrent;\n52 \n53           // Change priority of the\
    \ neighbor in a queue since it might have became c\\\n54           loser.\n55\
    \           if (queue.has(neighbor)) {\n56             queue.changePriority(neighbor,\
    \ distances[neighbor.getKey()]);\n57           }\n58 \n59           // Remember\
    \ previous closest vertex.\n60           previousVertices[neighbor.getKey()] =\
    \ currentVertex;\n61         }\n62 \n63         // Add neighbor to the queue for\
    \ further visiting.\n64         if (!queue.has(neighbor)) {\n65           queue.add(neighbor,\
    \ distances[neighbor.getKey()]);\n66         }\n67       }\n68     });\n69 \n\
    70     // Add current vertex to visited ones to avoid visiting it again later.\n\
    71     visitedVertices[currentVertex.getKey()] = true;\n72   }\n73 \n74   // Return\
    \ the set of shortest distances and paths to all vertices.\n75   return { distances,\
    \ previousVertices };\n76 }\n```\n\n26-dijkstra/dijkstra.js\n\n### Complexities\n\
    \nLet’s say that the graph we’re going to traverse has `|V|` vertices and `|E|`\
    \ edges.\n\n#### Time Complexity\n\nIn our `dijkstra()` function we first do initial\
    \ setup and then iterate over the queue. Let’s analyze these two steps.\n\n**Initial\
    \ setup** (creating `queue`, populating `distances` and `previousVertices`). The\
    \ complexity of these steps is `O(|V|)` since we’re iterating over all vertices\
    \ in the graph.\n\n**Iterating over the queue**. The code inside the `while` loop\
    \ will be called `|V|` times since we’re visiting every graph vertex exactly once\
    \ because of tracking the visited vertices in `visitedVertices` map. So we will\
    \ use the `|V|` multiplier of time complexity of the code inside the `while` loop.\n\
    \nLet’s analyze the steps we make inside the `while` loop:\n\n*   **Polling the\
    \ next vertex from the queue**. This operation uses `poll()` method of `MinHeap`\
    \ class which in turn has `O(log(|V|))` time complexity (please see the “Heap”\
    \ chapter for further details of how the complexity of `poll()` method has been\
    \ calculated).\n\n*   **Iterating over unvisited neighbors of the current vertex**.\
    \ In worst case scenario when the graph is fully connected and every vertex has\
    \ `|V| - 1` edges this step will take `O(|E|)` time.\n\n    *   **Updating vertex\
    \ distances**. This steps involves operations with `distances` map and thus they\
    \ have `O(1)` time complexity.\n\n    *   **Changing the vertex priority if needed**.\
    \ This is a `MinHeap` class related operation and it is done in `O(log(|V|))`\
    \ time because we’re removing and adding element from the heap tree and calling\
    \ `heapifyUp()` and `heapifyDown()` methods along the way.\n\n    *   **Checking\
    \ if vertex priority**.\n\n#### Auxiliary Complexity\n\nReturn the set of shortest\
    \ distances and paths to all vertices.\n\n### Problems\n\nHere are some related\
    \ problems:\n\n*   [Network Delay Time](https://leetcode.com/problems/network-delay-time/)\n\
    *   [Cheapest Flights Within K Stops](https://leetcode.com/problems/cheapest-flights-within-stops/)\n\
    \n### References\n\nDijkstra’s algorithm on Wikipedia `https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm`\n\
    \nDijkstra’s algorithm on YouTube `https://www.youtube.com/watch?v=gdmfOwylcI`\n\
    \nDijkstra’s algorithm example and test cases `https://github.com/trekhleb/javascript-algorithms/tree/master/src/graph`\n\
    \n## Appendix A: Quiz Answers\n\n**Algorithms and Their Complexities**\n\n*  \
    \ Q1: No, time complexity shows the rate (proportion) of function time and function\
    \ input\n*   Q2: `O(log(n))` is faster. For example `O(1000) = 1000`, but `O(log(1000))\
    \ = 9\n*   Q3: No it is not true. Sometimes it is a trade off and you make algorithm\
    \ work faster by consuming more memory\n\n**Linked List**\n\n*   Q1: It’s a reference\
    \ to the next object in the linked list\n*   Q2: deleteTail removes the last item\
    \ in the linked list, deleteHead removes the first\n\n**Queue**\n\n*   Q1: A Queue\
    \ is first-in-first-out\n*   Q2: Basic operations for Queue are `peek()`, `enqueue()`\
    \ and `dequeue()`\n*   Q3: The time complexity is `O(1)`\n\n**Stack**\n\n*   Q1:\
    \ A Queue is first-in-last-out\n*   Q2: Basic operations for STack are peek()`,\
    \ `push()` and `pop()`\n*   Q3: The time complexity is `O(1)`\n\n**Hash Table**\n\
    \n*   Q1: The main advantage of hash table is fast lookup\n*   Q2: The time complexity\
    \ is `O(1)` (with good hash function and sufficient buckets number)\n*   Q3: Collision\
    \ is a situation when we try to save two values with different keys to the same\
    \ bucket either because of not ideal hash function or because of lack of available\
    \ buckets\n*   Q4: One of the ways of handling the collision is Separate Chaining\
    \ when we use links list to store information in each bucket\n\n**Binary Search\
    \ Tree (BST)**\n"
  raw: "4.  **Go to step 1** and repeat it until the vertex visiting queue is empty.\
    \ The emptiness of the queue is being checked by using `isEmpty()` method of `PriorityQueue`\
    \ instance.\n\nHere is an example of how `dijstra()` function may be implemented.\n\
    \n```\n10 /**\n11  * Implementation of Dijkstra algorithm of finding the shortest\
    \ paths to graph nodes.\n12  * @param {Graph} graph - graph we're going to traverse.\n\
    13  * @param {GraphVertex} startVertex - traversal start vertex.\n14  * @return\
    \ {ShortestPaths}\n15  */\n16 export default function dijkstra(graph, startVertex)\
    \ {\n17   // Init helper variables that we will need for Dijkstra algorithm.\n\
    18   const distances = {};\n19   const visitedVertices = {};\n20   const previousVertices\
    \ = {};\n21   const queue = new PriorityQueue();\n22 \n23   // Init all distances\
    \ with infinity assuming that currently we can't reach\n24   // any of the vertices\
    \ except the start one.\n25   graph.getAllVertices().forEach((vertex) => {\n26\
    \     distances[vertex.getKey()] = Infinity;\n27     previousVertices[vertex.getKey()]\
    \ = null;\n28   });\n29 \n30   // We are already at the startVertex so the distance\
    \ to it is zero.\n31   distances[startVertex.getKey()] = 0;\n32 \n33   // Init\
    \ vertices queue.\n34   queue.add(startVertex, distances[startVertex.getKey()]);\n\
    35 \n36   // Iterate over the priority queue of vertices until it is empty.\n\
    37   while (!queue.isEmpty()) {\n38     // Fetch next closest vertex.\n39    \
    \ const currentVertex = queue.poll();\n40 \n41     // Iterate over every unvisited\
    \ neighbor of the current vertex.\n42     currentVertex.getNeighbors().forEach((neighbor)\
    \ => {\n43       if (!visitedVertices[neighbor.getKey()]) {\n44         const\
    \ edgeWight = neighbor.edge.weight;\n45         const existingDistanceToNeighbor\
    \ = distances[neighbor.getKey()];\n46         const distanceToNeighborFromCurrent\
    \ = distances[currentVertex.getKey()] + ed\\\n47 geWight;\n48 \n49         //\
    \ If we've found shorter path to the neighbor - update it.\n50         if (distanceToNeighborFromCurrent\
    \ < existingDistanceToNeighbor) {\n51           distances[neighbor.getKey()] =\
    \ distanceToNeighborFromCurrent;\n52 \n53           // Change priority of the\
    \ neighbor in a queue since it might have became c\\\n54 loser.\n55          \
    \ if (queue.has(neighbor)) {\n56             queue.changePriority(neighbor, distances[neighbor.getKey()]);\n\
    57           }\n58 \n59           // Remember previous closest vertex.\n60   \
    \        previousVertices[neighbor.getKey()] = currentVertex;\n61         }\n\
    62 \n63         // Add neighbor to the queue for further visiting.\n64       \
    \  if (!queue.has(neighbor)) {\n65           queue.add(neighbor, distances[neighbor.getKey()]);\n\
    66         }\n67       }\n68     });\n69 \n70     // Add current vertex to visited\
    \ ones to avoid visiting it again later.\n71     visitedVertices[currentVertex.getKey()]\
    \ = true;\n72   }\n73 \n74   // Return the set of shortest distances and paths\
    \ to all vertices.\n75   return { distances, previousVertices };\n76 }\n```\n\n\
    26-dijkstra/dijkstra.js\n\n### Complexities\n\nLet’s say that the graph we’re\
    \ going to traverse has `|V|` vertices and `|E|` edges.\n\n#### Time Complexity\n\
    \nIn our `dijkstra()` function we first do initial setup and then iterate over\
    \ the queue. Let’s analyze these two steps.\n\n**Initial setup** (creating `queue`,\
    \ populating `distances` and `previousVertices`). The complexity of this steps\
    \ is `O(|V|)` since we’re iterating over all vertices in the graph.\n\n**Iterating\
    \ over the queue**. The code inside the `while` loop will be called `|V|` times\
    \ since we’re visiting every graph vertex exactly once because of tracking the\
    \ visited vertices in `visitedVertices` map. So we will use the `|V|` multiplier\
    \ of time complexity of the code inside the `while` loop.\n\nLet’s analyze the\
    \ steps we make inside the `while` loop:\n\n*   **Polling the next vertex from\
    \ the queue**. This operation uses `poll()` method of `MinHeap` class which in\
    \ turn has `O(log(|V|))` time complexity (please see the “Heap” chapter for further\
    \ details of how the complexity of `poll()` method has been calculated).\n\n*\
    \   **Iterating over unvisited neighbors of the current vertex**. In worst case\
    \ scenario when the graph is fully connected and every vertex has `|V| - 1` edges\
    \ this step will take `O(|E|)` time.\n\n    *   **Updating vertex distances**.\
    \ This steps involves operations with `distances` map and thus they have `O(1)`\
    \ time complexity.\n\n    *   **Changing the vertex priority if needed**. This\
    \ is a `MinHeap` class related operation and it is done in `O(log(|V|))` time\
    \ because we’re removing and adding element from the heap tree and calling `heapifyUp()`\
    \ and `heapifyDown()` methods along the way.\n\n    *   **Checking if vertex is\
    \ already inside the queue**. This operation is done using hash map and thus it\
    \ takes `O(1)` time.\n\n    *   **Adding vertex to the queue**. This operation\
    \ takes `O(log(|V|))` because the `heapifyUp()` method of `MinHeap` class is being\
    \ called to rebuild a heap.\n\n    *   **Mark current vertex as visited**. This\
    \ is `O(1)` operation since we’re dealing with updating the `visitedVertices`\
    \ map hear.\n\nIf we will take all the steps complexities that are mentioned above\
    \ we’ll get the final time complexity of the `dijkstra()` function which is equal\
    \ to **`O(|E| * |V| * log(|V|))`**, where `|V|` is the number of graph vertices\
    \ and `|E|` is the number of graph edges.\n\n#### Auxiliary Space Complexity\n\
    \nWe use auxiliary data structures like maps (`distances`, `visitedVertices`,\
    \ `previousVertices` variables), priority queue (`queue` variable) to make `dijkstra()`\
    \ function work. All of these data structures are directly proportional in size\
    \ to the number of vertices in the graph. Thus we may assume that auxiliary space\
    \ complexity is **`O(|V|)`**.\n\n### Problems Examples\n\nHere are some related\
    \ problems that you might encounter during the interview:\n\n*   [Network Delay\
    \ Time](https://leetcode.com/problems/network-delay-time/)\n\n*   [Cheapest Flights\
    \ Within K Stops](https://leetcode.com/problems/cheapest-flights-within-k-stops/)\n\
    \n### References\n\nDijkstra’s algorithm on Wikipedia [https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm](https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm)\n\
    \nDijkstra’s algorithm on YouTube [https://www.youtube.com/watch?v=gdmfOwyQlcI](https://www.youtube.com/watch?v=gdmfOwyQlcI)\n\
    \nDijkstra’s algorithm example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/dijkstra](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/dijkstra)\n\
    \n## Appendix A: Quiz Answers\n\n**Algorithms and Their Complexities**\n\n*  \
    \ *Q1:* No, time complexity shows the rate (proportion) of function execution\
    \ time and function input\n\n*   *Q2:* `O(log(n))` is faster. For example `O(1000)\
    \ = 1000`, but `O(log(1000)) = 9`\n\n*   *Q3:* No it is not true. Sometimes it\
    \ is a trade off and you make algorithm work faster by consuming more memory.\n\
    \n**Linked List**\n\n*   *Q1:* It’s a reference to the next object in the linked\
    \ list\n\n*   *Q2:* deleteTail removes the last item in the linked list, deleteHead\
    \ removes the first\n\n**Queue**\n\n*   *Q1:* A Queue is first-in-first-out\n\n\
    *   *Q2:* Basic operations for Queue are `peek()`, `enqueue()` and `dequeue()`\n\
    \n*   *Q3:* The time complexity is `O(1)`\n\n**Stack**\n\n*   *Q1:* A Queue is\
    \ first-in-last-out\n\n*   *Q2:* Basic operations for STack are peek(), `push()`\
    \ and `pop()`\n\n*   *Q3:* The time complexity is `O(1)`\n\n**Hash Table**\n\n\
    *   *Q1:* The main advantage of hash table is fast lookup\n\n*   *Q2:* The time\
    \ complexity is `O(1)` (with good hash function and sufficient buckets number)\n\
    \n*   *Q3:* Collision is a situation when we try to save two values with different\
    \ keys to the same bucket either because of not ideal hash function or because\
    \ of lack of available buckets\n\n*   *Q4:* One of the ways of handling the collision\
    \ is Separate Chaining when we use links list to store information in each bucket\n\
    \n**Binary Search Tree (BST)**"
