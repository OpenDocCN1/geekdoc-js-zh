    \n此方法检查顶点是否有特定的边实例。为了做到这一点，它使用了 `LinkedList` 的 `find()` 方法。我们将一个函数作为参数传递给 `find()`\
    \ 方法。在函数内部，我们通过严格比较 `===` 来查找正确的边。如果找到了边，我们通过双重 `!!` 将其转换为布尔值。\n\n```javascript\n\
    65   /**\n66    * 检查顶点是否连接了特定的边。\n67    * @param {GraphEdge} requiredEdge\n68\
    \    * @returns {boolean}\n69    */\n70   hasEdge(requiredEdge) {\n71     const\
    \ edgeNode = this.edges.find({\n72       callback: edge => edge === requiredEdge,\n\
    73     });\n74 \n75     return !!edgeNode;\n76   }\n```\n\n08-graph/GraphVertex.js\n\
    \n### `getNeighbors()`\n\n此方法返回当前顶点的所有相邻顶点的数组。为了做到这一点，我们需要：\n\n*   遍历所有相邻边，\n\n\
