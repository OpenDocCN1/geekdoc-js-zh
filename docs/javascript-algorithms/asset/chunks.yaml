    \ binary tree can be stored in an array, but because a binary heap is always a\
    \ complete binary tree, it can be stored compactly (without any empty cells).\
    \ No space is required for pointers; instead, the parent and children of each\
    \ node can be found by arithmetic on array indices.\n\n![](images/07-heap----heap-as-array.png)\n\
    \nAfter saving the heap as an array we may easily calculate every node’s children\
    \ and its parent indices. Let `n` be the number of elements in the heap and `i`\
    \ be an arbitrary valid index of the array storing the heap. If the tree root\
    \ is at index `0`, with valid indices `0` through `n − 1`, then each element a\
    \ at index `i` has:\n\n*   *children* at indices `2i + 1` and `2i + 2`,\n\n* \
    \  its *parent* at index `floor((i − 1) ∕ 2)`.\n\nThe `floor()` function mentioned\
    \ above is a function that takes as input a real number `x` and gives as output\
