    \n##### `remove()`\n\nBefore removing the node, we need to find it in the tree\
    \ using `find()` function described above. After we find the correct node, several\
    \ cases are possible:\n\n*   **Removing the leaf node** - remove a pointer to\
    \ this node from the parent node.\n\n*   **Removing the node with one child**\
    \ - make one and only child to be a direct ancestor for the current node’s parent.\n\
    \n*   **Removing the node with two children** - find the next biggest value (minimum\
    \ value in the right branch) and replace current node with that next biggest value\
    \ node.\n\nThis method uses other helper methods like `removeChild()`, `findMin()`,\
    \ `setValue()`, `setRight()`, `replaceChild()`, `copyNode()` that will be implemented\
    \ below.\n\n```\n221   /**\n222    * @param {*} value\n223    * @return {boolean}\n\
    224    */\n225   remove(value) {\n226     const nodeToRemove = this.find(value);\n\
    227 \n228     if (!nodeToRemove) {\n229       throw new Error('Item not found\
    \ in the tree');\n230     }\n231 \n232     const { parent } = nodeToRemove;\n\
    233 \n234     if (!nodeToRemove.left && !nodeToRemove.right) {\n235       // Node\
    \ is a leaf and thus has no children.\n236       if (parent) {\n237         //\
    \ Node has a parent. Just remove the pointer to this node from the parent.\n238\
    \         parent.removeChild(nodeToRemove);\n239       } else {\n240         //\
    \ Node has no parent. Just erase current node value.\n241         nodeToRemove.setValue(undefined);\n\
    242       }\n243     } else if (nodeToRemove.left && nodeToRemove.right) {\n244\
    \       // Node has two children.\n245       // Find the next biggest value (minimum\
    \ value in the right branch)\n246       // and replace current value node with\
    \ that next biggest value.\n247       const nextBiggerNode = nodeToRemove.right.findMin();\n\
    248       if (nextBiggerNode !== nodeToRemove.right) {\n249         this.remove(nextBiggerNode.value);\n\
    250         nodeToRemove.setValue(nextBiggerNode.value);\n251       } else {\n\
    252         // In case if next right value is the next bigger one and it doesn't\
    \ have le\\\n253 ft child\n254         // then just replace node that is going\
    \ to be deleted with the right node.\n255         nodeToRemove.setValue(nodeToRemove.right.value);\n\
    256         nodeToRemove.setRight(nodeToRemove.right.right);\n257       }\n258\
    \     } else {\n259       // Node has only one child.\n260       // Make this\
    \ child to be a direct child of current node's parent.\n261       /** @var BinarySearchTreeNode\
    \ */\n262       const childNode = nodeToRemove.left || nodeToRemove.right;\n263\
    \ \n264       if (parent) {\n265         parent.replaceChild(nodeToRemove, childNode);\n\
    266       } else {\n267         BinarySearchTreeNode.copyNode(childNode, nodeToRemove);\n\
    268       }\n269     }\n270 \n271     // Clear the parent of removed node.\n272\
    \     nodeToRemove.parent = null;\n273 \n274     return true;\n275   }\n```\n\n\
    06-binary-search-tree/BinarySearchTreeNode.js\n\n##### `traverseInOrder()`\n\n\
    This method does an in-order traversal of the BST recursively. It first traverses\
    \ the left sub-tree of the root node. Then it concatenates the root node value\
    \ to the traversed array. Then it continues traversing the right sub-tree of the\
    \ root node. This method will return an array of BST node values in sorted order.\n\
    \n```\n276   /**\n277    * @return {*[]}\n278    */\n279   traverseInOrder() {\n\
    280     let traverse = [];\n281 \n282     // Add left node.\n283     if (this.left)\
    \ {\n284       traverse = traverse.concat(this.left.traverseInOrder());\n285 \
    \    }\n286 \n287     // Add root.\n288     traverse.push(this.value);\n289 \n\
    290     // Add right node.\n291     if (this.right) {\n292       traverse = traverse.concat(this.right.traverseInOrder());\n\
    293     }\n294 \n295     return traverse;\n296   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `setLeft()`\n\nThis method will set the left child for the current node.\
    \ It will also take care of `parent` pointer for the left node by pointing it\
    \ to the current node.\n\n```\n34   /**\n35    * @param {BinarySearchTreeNode}\
    \ node\n36    * @return {BinarySearchTreeNode}\n37    */\n38   setLeft(node) {\n\
    39     // Reset parent for left node since it is going to be detached.\n40   \
    \  if (this.left) {\n41       this.left.parent = null;\n42     }\n43 \n44    \
    \ // Attach new node to the left.\n45     this.left = node;\n46 \n47     // Make\
    \ current node to be a parent for new left one.\n48     if (this.left) {\n49 \
    \      this.left.parent = this;\n50     }\n51 \n52     return this;\n53   }\n\
    ```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\n##### `setRight()`\n\n\
    This method will set the right child for the current node. It will also take care\
    \ of `parent` pointer for the right node by pointing it to the current node.\n\
    \n```\n55   /**\n56    * @param {BinarySearchTreeNode} node\n57    * @return {BinarySearchTreeNode}\n\
    58    */\n59   setRight(node) {\n60     // Reset parent for right node since it\
    \ is going to be detached.\n61     if (this.right) {\n62       this.right.parent\
    \ = null;\n63     }\n64 \n65     // Attach new node to the right.\n66     this.right\
    \ = node;\n67 \n68     // Make current node to be a parent for new right one.\n\
    69     if (node) {\n70       this.right.parent = this;\n71     }\n72 \n73    \
    \ return this;\n74   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `setData()`\n\n`setData` is a helper function that we will use for setting\
    \ the node `data`. We return `this` object to allow us to chain methods. This\
    \ method makes working with the tree more convenient. We can do something like\
    \ this: `bst.setValue(5).setData('User name')`.\n\n```\n24   /**\n25    * @param\
    \ {*} data\n26    * @return {BinarySearchTreeNode}\n27    */\n28   setData(data)\
    \ {\n29     this.data = data;\n30 \n31     return this;\n32   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `setValue()`\n\nThis is a helper function that we will use for setting\
    \ the node `value`. We return `this` object to allow us to chain methods.\n\n\
    ```\n14   /**\n15    * @param {*} value\n16    * @return {BinarySearchTreeNode}\n\
    17    */\n18   setValue(value) {\n19     this.value = value;\n20 \n21     return\
    \ this;\n22   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\n#####\
    \ `contains()`\n\nThis is a helper method that returns `true` or `false` showing\
    \ if the node with the specified `value` exists in the tree.\n\n```\n191   /**\n\
    192    * @param {*} value\n193    * @return {boolean}\n194    */\n195   contains(value)\
    \ {\n196     return !!this.find(value);\n197   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
