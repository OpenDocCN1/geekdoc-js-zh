  trans: "\n\n```javascript\n/**\n *  以广度优先的方式遍历图。\n *\n * @param {Graph} graph -\
    \ 将要遍历的图。\n * @param {GraphVertex} startVertex - 我们将用作起始点的顶点。\n * @param {function}\
    \ enterVertexCallback - 每次访问顶点时都会调用的回调函数。\n */\nexport function breadthFirstSearch(graph,\
    \ startVertex, enterVertexCallback) {\n  // 初始化顶点队列。每当我们遇到一个新顶点时，它会被\n  // 添加到队列中以便进一步探索。\n\
    \  const vertexQueue = new Queue();\n\n  // 将 startVertex 加入队列，因为我们将首先访问它。\n \
    \ vertexQueue.enqueue(startVertex);\n\n  // 为了防止重复访问同一个顶点，\n  // 我们需要记住所有访问过的顶点。\n\
    \  const visitedVertices = {};\n\n  // 既然我们要首先访问 startVertex，就把它添加到已访问列表中。\n \
    \ visitedVertices[startVertex.getKey()] = true;\n\n  // 只要队列不为空就遍历队列中的所有顶点。\n\
    \  while (!vertexQueue.isEmpty()) {\n    // 从队列中获取下一个顶点。\n    const currentVertex\
    \ = vertexQueue.dequeue();\n\n    // 调用回调函数通知订阅者进入了新顶点。\n    enterVertexCallback(currentVertex);\n\
    \n    // 将所有邻居加入队列以供后续遍历。\n    currentVertex.getNeighbors().forEach((nextVertex)\
    \ => {\n      if (!visitedVertices[nextVertex.getKey()]) {\n        // 记住当前邻居以避免未来再次访问它。\n\
    \        visitedVertices[nextVertex.getKey()] = true;\n\n        // 将 nextVertex\
    \ 加入队列以便后续访问。\n        vertexQueue.enqueue(nextVertex);\n      }\n    });\n  }\n\
    }\n```\n\n`graph-breadth-first-search/breadthFirstSearch.js`\n\n### 复杂度\n\n####\
    \ 时间复杂度\n\n`breadthFirstSearch()` 函数的时间复杂度主要由 `while` 循环决定，因为 `while` 循环之外的所有行执行时间均为\
    \ `O(1)`。记住，通过使用 `visitedVertices` 哈希表，我们防止了同一个顶点被多次添加到 `vertexQueue` 中。因此我们可以假设进入\
    \ `while` 循环恰好 `|V|` 次，其中 `|V|` 是我们正在遍历的图中连通顶点的数量。我们还需要考虑到，我们遍历了每一个顶点边并通过调用 `currentVertex.getNeighbors()`\
    \ 来获取顶点的邻居。因此，我们的函数也会访问所有的 `|E|` 条图边。最后需要说明的是，在 `while` 循环内部我们有与队列相关的 `enqueue()`\
    \ 和 `dequeue()` 操作，这些操作的执行时间为 `O(1)`，因为我们处理的是基于链表的 `Queue` 实现（更多细节请参阅关于队列数据结构的章节）。\n\
    \n考虑到以上因素，我们可以得出结论：breadthFirstSearch()` 函数的时间复杂度为 `O(|V| + |E|`，其中 `|E|` 是图边的数量，`|V|`\
    \ 是图中顶点的数量。\n\n#### 辅助空间复杂度\n\n在 `breadthFirstSearch()` 函数当前的实现中，我们使用了以下额外变量：\n\
    \n* `vertexQueue` 队列 - 保存所有的 `|V|` 个图顶点，\n* `visitedVertices` 哈希表 - 保存所有的 `|V|`\
    \ 个图顶点键，\n* `currentVertex` 变量 - 仅保留一个当前顶点实例。\n\n由于 `vertexQueue` 和 `visitedVertices`\
    \ 变量最消耗空间，我们可以得出：breadthFirstSearch()` 函数的辅助空间复杂度为 `O(|V|)`，其中 `|V|` 是图中顶点的数量。\n\
    \n### 题目示例\n\n这里是你在面试过程中可能会遇到的一些相关问题：\n\n* [克隆图](https://leetcode.com/problems/clone-graph/)\n\
    * [图是二分图吗？](https://leetcode.com/problems/is-graph-bipartite/)\n* [被围绕的区域](https://leetcode.com/problems/surrounded-regions/)\n\
    \n### 测验\n\n* *Q1: 图广度优先搜索算法的时间复杂度是多少？*\n* *Q2: 哪种数据结构最适合实现图广度优先搜索算法：栈（Stack）还是队列（Queue）？*\n\
    \n### 参考文献\n\nWikipedia 广度优先搜索 (BFS) [`en.wikipedia.org/wiki/Breadth-first_search`](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
    \n广度优先搜索可视化 [`www.cs.usfca.edu/~galles/visualization/BFS.html`](https://www.cs.usfca.edu/~galles/visualization/BFS.html)\n\
    \n图 BFS 示例和测试案例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/graph/breadth-first-search)\n\
    \n## Dijkstra 算法\n\n* *难度：困难 (hard)*\n\n### 任务\n\n*给定一个图和一个源顶点，找到从源点的最短路径。*\n\n\
    **示例**\n\n图的一个良好例子是包含城市（顶点）和连接它们的道路（边）的地图。如果图是有向的，意味着道路是单程的。如果图是无向的，则道路是双向的。此外，图可以是加权的。\n\
    \n### 算法\n\n#### 算法定义\n\n**Dijkstra 算法**是一种寻找图中节点间最短路径的算法，图中可以代表路网。它由计算机科学家 Edsger\
    \ W. Dijkstra 于 1956 年提出。\n\nDijkstra 的原始变体寻找两个节点之间的最短路径，但更常见的变体是寻找从源点到所有节点的最短路径。\n\
    \n#### 算法步骤\n\n该算法包含以下步骤：\n\n1. 为所有顶点分配一个**临时距离**值：将起始顶点设置为 `0`（因为我们已经到达了），并将所有其他顶点设置为无穷大\
    \ `Infinity`（此时它们看起来是不可及的）。\n2. 创建**已访问顶点集合**。我们将用它来避免遍历顶点时出现死循环。\n3. 创建一个**顶点访问队列**并将起始顶点放入队列。我们将使用以顶点距离作为优先因子的优先级队列（优先级在之前的章节中解释过）。到起始点的距离越短，优先级越高。\n\
    4. **从队列中弹出最近的顶点**（距离源点最近的顶点）。优先级队列允许我们实现这一点。\n5. **遍历当前顶点的每个未访问邻居**。对于每个邻居，计算`到当前顶点的距离\
    \ + 当前顶点到邻居的距离`。如果此距离小于邻居的临时距离，则将其替换为新值。\n6. 当考虑完当前顶点的所有邻居后，**将当前顶点标记为已访问**。\n\
    7. **返回步骤 4** 并重复，直到顶点访问队列为空。\n\n#### 算法中优先级队列的使用\n\n在 Dijkstra 算法中，每当我们弹出要访问的顶点时（步骤\
    \ 4），它必须是一个之前未访问过且*距离起始点距离最短*的节点。\n\n但我们如何实现这种基于距离的弹出操作呢？\n\n"
- fmt: "\nIf we use the `Queue` class that was implemented in one of the previous\
    \ chapters the `Queue` will respect FIFO (First-In-First-Out) ordering but it\
    \ won’t take distance into account. For example, if we add a vertex with distance\
    \ `20` and then we add a vertex with distance `10` to the queue then the `poll()`\
    \ operation will return us the vertex with distance `20` since it was put to the\
    \ queue first – not the vertex with shorter distance `10`. So using a `Queue`\
    \ won’t work.\n\nAnother approach may be to store vertex visiting queue as an\
    \ array and every time we need to poll the next vertex from it we may traverse\
    \ entire array and find/return the next vertex with shortest distance. This approach\
    \ works but in `O(n)` time.\n\n## Can we make polling faster?\n\nYes, it is possible\
    \ by using priority queue. In this case the time complexity of polling will be\
    \ `O(log(n))` which make the algorithm work faster.\n\nYou may find full description\
    \ of `PriorityQueue` class with implementation example in “Priority Queue” chapter\
    \ of this book.\n\n## Step by Step Example\n\nLet’s take the graph above and try\
    \ to find the shortest paths to all vertices from `Home` vertex applying the Dijkstra’s\
    \ algorithm.\n\n### Step 1\n\nInit all vertices with tentative distances. The\
    \ `startingVertex` (in our case it is `Home` vertex) will have tentative distance\
    \ `0` meaning that there are no effort required to get to `Home` since we’re already\
    \ there. All other vertices have their tentative distance being set to `Infinity`\
    \ since we don’t know how far are they from `Home` and we don’t even know if they\
    \ are reachable at all.\n\nLet’s also add `Home` vertex to the vertices priority\
    \ queue to start traversing the graph from it.\n\n![](images/26-dijkstra----dijkstra-steps-step-1.png)\n\
    \n### Step 2\n\nPoll the next vertex from priority queue. Remember that every\
    \ time we poll the vertex from priority queue it will return us the vertex with\
    \ shortest distance to the `startingVertex`. In our case there is only one node\
    \ in priority queue and it is `Home` vertex. So the current vertex is `Home`.\n\
    \nGet all neighbors of `Home` and set the distance to them using formula `distanceToHome\
    \ + distanceFromHomeToNeighbor`. In our case for vertex `A` we’re setting the\
    \ distance `0 + 5 = 5`, for vertex `D` we’re setting the distance `0 + 8 = 8`.\
    \ This means that for now the shortest distance ot `A` is `5` and the shortest\
    \ distance to `D` is `8`.\n\nPush vertices `A` and `D` to the priority queue.\n\
    \nOnce we’ve traversed all neighbors of `Home` vertex we may mark it as `visited`\
    \ (you’ll see that `Home` node is marked as black one on the next illustration,\
    \ that means it is visited).\n\n![](images/26-dijkstra----dijkstra-steps-step-2.png)\n\
    \n### Step 3\n\nGet the next unvisited vertex from our vertex priority queue that\
    \ is closer to the `Home`. In our case we have only two vertices in a queue and\
    \ they are `A` and `D`. Since `A` vertex is closer to the `Home` vertex (distance\
    \ is `5`) we visit it first.\n\nGet all neighbors of `A` that are not visited\
    \ yet. The neighbors are vertex `B` and vertex `C`. Let’s calculate the shortest\
    \ path to neighbors using formula `distanceToA + distanceFromAtoNeighbor`. For\
    \ vertex `B` the distance is calculated as `5 + 9 = 14`. For vertex `C` the distance\
    \ is calculated as `5 + 3 = 8`.\n\nAdd new neighbors `B` and `C` to the vertex\
    \ priority queue.\n\nSince all neighbors of `A` have been visited we mark `A`\
    \ as visited (it will become black on the next illustration).\n\n![](images/26-dijkstra----dijkstra-steps-step-3.png)\n\
    \n### Step 4\n\nGet the next unvisited vertex from our vertex priority queue that\
    \ is closer to the `Home`. In our case we have only three vertices in a queue\
    \ and they are `D`, `C` and `B`. Since `D` and `C` vertices are closest to `Home`\
    \ (distance is `8`) let’s peak the first vertex that were added to the queue among\
    \ them. It will be vertex `D`.\n\nGet all neighbors of `D` (vertices `C` and `E`)\
    \ and let’s calculate the shortest distances to them. For `C` we will have `8\
    \ + 4 = 12`, for `8 + 6 = 14`. Notice that vertex `C` already has a calculated\
    \ distance to it. If we would go to vertex `C` from the vertex `A` then the distance\
    \ to vertex `C` from `Home` would be `8`. Since the overall distance to vertex\
    \ `C` from `Home` via vertex `D` is longer than the one we’ve found before (`12\
    \ > 8`) then we discard the distance we’ve just found (via vertex `D`) in favor\
    \ of the shortest path variant (via vertex `A`). So the distance for vertex `C`\
    \ stays unchanged at this point.\n\nAdd new neighbors `E` to the vertex priority\
    \ queue. There is no need to add `C` to the queue since it is already there.\n\
    \nMark vertex `D` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-4.png)\n\
    \n### Step 5\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `C`.\n\nGet all unvisited neighbors of `C`\
    \ (in our case it is `B` and `E`). Calculate the shortest distances to `B` and\
    \ `E` from `C`. For vertex `B` the distance will be calculated as `8 + 5 = 13`,\
    \ for `E` the distance is `8 + 2 = 10`. Notice that we’ve just found a shorter\
    \ path to `B`. Previously the distance to `B` from `Home` via `A` was equal to\
    \ `14` but now we’ve figured out that the distance from `Home` to `B` via `C`\
    \ is shorter and it equals to `13`. In this case we need to update the distance\
    \ to `B` to `13` and *we also need to update the priority for vertex `B` in our\
    \ priority queue*.\n\nAdd all unvisited neighbors of `C` to priority queue.\n\n\
    Mark vertex `C` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-5.png)\n\
    \n### Step 6\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `E`.\n\nGet all unvisited neighbors of `E`\
    \ (in our case it is `D` and `Office`). Calculate the shortest distances to `D`\
    \ and `Office` from `E`. For vertex `D` the distance will be calculated as `10\
    \ + 2 = 12`, for `Office` the distance is `10 + 4 = 14`. Notice that vertex `D`\
    \ already has a calculated distance to it.\n\nAdd `Office` to priority queue.\n\
    \nMark vertex `E` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-6.png)\n\
    \n### Step 7\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `B`.\n\nGet all unvisited neighbors of `B`\
    \ and update their distances. In our case there is only unvisited neighbor `Office`\
    \ and the distance to it is `13 + 7 = 20`. Since it is bigger than the distance\
    \ to `Office` that we’ve just found in a previous step (`20 > 14`) we ignore it.\n\
    \nMark vertex `B` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-7.png)\n\
    \n### Step 8\n\nFinally we’ve got to the last node in queue and this node doesn’t\
    \ have unvisited neighbors. This means that we may stop and that we’ve just found\
    \ a shortest paths to all vertices from `Home` vertex.\n\n![](images/26-dijkstra----dijkstra-steps-step-8.png)\n\
    \n## Application\n\nDijkstra’s algorithm may be applied to the following areas:\n\
    \n*   In **GIS (Geographic Information Systems)** to find the shortest paths between\
    \ geographical spots on the map (traffic and distance may be represented as graph\
    \ edges weights).\n*   In **Computer Networks** (eg, a peer-to-peer application),\
    \ to find the shortest paths between machine A and B.\n\n## Usage Example\n\n\
    Before we will start implementing the `dijkstra()` function let’s imagine that\
    \ we already have it implemented and see how we want it to work and what interface\
    \ (input parameters and output values) it should have.\n\nLet’s take a graph from\
    \ “The Task” section above and try to find the shortest paths to all vertices\
    \ from `Home` vertex and the shortest path from `Home` to `Office` in particular.\n\
    \n![](images/26-dijkstra----graph.png)\n\nWhen calling `dijkstra()` function we\
    \ would want to pass the `graph` we’re going to traverse along with the starting\
    \ vertex `startVertex`.\n\nThis function should return us `distances` object with\
    \ shortest paths to all vertices from the `startVertex`. This object may be a\
    \ map with vertices keys as a keys and with shortest distances as values. For\
    \ example:\n\n```\n{\n  Home: 0,\n  A: 4,\n  Office: 10,\n  ...\n}\n```\n"
  raw: "If we use the `Queue` class that was implemented in one of the previous chapters\
    \ the `Queue` will respect FIFO (First-In-First-Out) ordering but it won’t take\
    \ distance into account. For example, if we add a vertex with distance `20` and\
    \ then we add a vertex with distance `10` to the queue then the `poll()` operation\
    \ will return us the vertex with distance `20` since it was put to the queue first\
    \ – not the vertex with shorter distance `10`. So using a `Queue` won’t work.\n\
    \nAnother approach may be to store vertex visiting queue as an array and every\
    \ time we need to poll the next vertex from it we may traverse entire array and\
    \ find/return the next vertex with shortest distance. This approach works but\
    \ in `O(n)` time.\n\nCan we make polling faster?\n\nYes, it is possible by using\
    \ priority queue. In this case the time complexity of polling will be `O(log(n))`\
    \ which make the algorithm work faster.\n\nYou may find full description of `PriorityQueue`\
    \ class with implementation example in “Priority Queue” chapter of this book.\n\
    \n#### Step by Step Example\n\nLet’s take the graph above and try to find the\
    \ shortest paths to all vertices from `Home` vertex applying the Dijkstra’s algorithm.\n\
    \n**Step 1**\n\nInit all vertices with tentative distances. The `startingVertex`\
    \ (in our case it is `Home` vertex) will have tentative distance `0` meaning that\
    \ there are no effort required to get to `Home` since we’re already there. All\
    \ other vertices have their tentative distance being set to `Infinity` since we\
    \ don’t know how far are they from `Home` and we don’t even know if they are reachable\
    \ at all.\n\nLet’s also add `Home` vertex to the vertices priority queue to start\
    \ traversing the graph from it.\n\n![](images/26-dijkstra----dijkstra-steps-step-1.png)\n\
    \n**Step 2**\n\nPoll the next vertex from priority queue. Remember that every\
    \ time we poll the vertex from priority queue it will return us the vertex with\
    \ shortest distance to the `startingVertex`. In our case there is only one node\
    \ in priority queue and it is `Home` vertex. So the current vertex is `Home`.\n\
    \nGet all neighbors of `Home` and set the distance to them using formula `distanceToHome\
    \ + distanceFromHomeToNeighbor`. In our case for vertex `A` we’re setting the\
    \ distance `0 + 5 = 5`, for vertex `D` we’re setting the distance `0 + 8 = 8`.\
    \ This means that for now the shortest distance ot `A` is `5` and the shortest\
    \ distance to `D` is `8`.\n\nPush vertices `A` and `D` to the priority queue.\n\
    \nOnce we’ve traversed all neighbors of `Home` vertex we may mark it as `visited`\
    \ (you’ll see that `Home` node is marked as black one on the next illustration,\
    \ that means it is visited).\n\n![](images/26-dijkstra----dijkstra-steps-step-2.png)\n\
    \n**Step 3**\n\nGet the next unvisited vertex from our vertex priority queue that\
    \ is closer to the `Home`. In our case we have only two vertices in a queue and\
    \ they are `A` and `D`. Since `A` vertex is closer to the `Home` vertex (distance\
    \ is `5`) we visit it first.\n\nGet all neighbors of `A` that are not visited\
    \ yet. The neighbors are vertex `B` and vertex `C`. Let’s calculate the shortest\
    \ path to neighbors using formula `distanceToA + distanceFromAtoNeighbor`. For\
    \ vertex `B` the distance is calculated as `5 + 9 = 14`. For vertex `C` the distance\
    \ is calculated as `5 + 3 = 8`.\n\nAdd new neighbors `B` and `C` to the vertex\
    \ priority queue.\n\nSince all neighbors of `A` have been visited we mark `A`\
    \ as visited (it will become black on the next illustration).\n\n![](images/26-dijkstra----dijkstra-steps-step-3.png)\n\
    \n**Step 4**\n\nGet the next unvisited vertex from our vertex priority queue that\
    \ is closer to the `Home`. In our case we have only three vertices in a queue\
    \ and they are `D`, `C` and `B`. Since `D` and `C` vertices are closest to `Home`\
    \ (distance is `8`) let’s peak the first vertex that were added to the queue among\
    \ them. It will be vertex `D`.\n\nGet all neighbors of `D` (vertices `C` and `E`)\
    \ and let’s calculate the shortest distances to them. For `C` we will have `8\
    \ + 4 = 12`, for `8 + 6 = 14`. Notice that vertex `C` already has a calculated\
    \ distance to it. If we would go to vertex `C` from the vertex `A` then the distance\
    \ to vertex `C` from `Home` would be `8`. Since the overall distance to vertex\
    \ `C` from `Home` via vertex `D` is longer than the one we’ve found before (`12\
    \ > 8`) then we discard the distance we’ve just found (via vertex `D`) in favor\
    \ of the shortest path variant (via vertex `A`). So the distance for vertex `C`\
    \ stays unchanged at this point.\n\nAdd new neighbors `E` to the vertex priority\
    \ queue. There is no need to add `C` to the queue since it is already there.\n\
    \nMark vertex `D` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-4.png)\n\
    \n**Step 5**\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `C`.\n\nGet all unvisited neighbors of `C`\
    \ (in our case it is `B` and `E`). Calculate the shortest distances to `B` and\
    \ `E` from `C`. For vertex `B` the distance will be calculated as `8 + 5 = 13`,\
    \ for `E` the distance is `8 + 2 = 10`. Notice that we’ve just found a shorter\
    \ path to `B`. Previously the distance to `B` from `Home` via `A` was equal to\
    \ `14` but now we’ve figured out that the distance from `Home` to `B` via `C`\
    \ is shorter and it equals to `13`. In this case we need to update the distance\
    \ to `B` to `13` and *we also need to update the priority for vertex `B` in our\
    \ priority queue*.\n\nAdd all unvisited neighbors of `C` to priority queue.\n\n\
    Mark vertex `C` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-5.png)\n\
    \n**Step 6**\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `E`.\n\nGet all unvisited neighbors of `E`\
    \ and update their distances. In our case there is only one unvisited neighbor\
    \ `Office` and the distance to it is `10 + 4 = 14`.\n\nAdd `Office` vertex to\
    \ priority queue.\n\nMark vertex `E` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-6.png)\n\
    \n**Step 7**\n\nGet the next vertex from vertices priority queue that is closest\
    \ to `Home`. In our case it is vertex `B`.\n\nGet all unvisited neighbors of `B`\
    \ and update their distances. In our case there is only one unvisited neighbor\
    \ `Office` and the distance to it is `13 + 7 = 20`. Since it is bigger than the\
    \ distance to `Office` that we’ve just found in a previous step (`20 > 14`) we\
    \ ignore it.\n\nMark vertex `B` as visited.\n\n![](images/26-dijkstra----dijkstra-steps-step-7.png)\n\
    \n**Step 8**\n\nFinally we’ve got to the last node in a queue and this node doesn’t\
    \ have unvisited neighbors. This means that we may stop and that we’ve just found\
    \ a shortest paths to all vertices from `Home` vertex.\n\n![](images/26-dijkstra----dijkstra-steps-step-8.png)\n\
    \n### Application\n\nDijkstra’s algorithm may be applied to the following areas:\n\
    \n*   In **GIS (Geographic Information Systems)** to find the shortest paths between\
    \ geographical spots on the map (traffic and distance may be represented as graph\
    \ edges weights).\n\n*   In **Computer Networks** (eg, a peer-to-peer application),\
    \ to find the shortest paths between machine A and B.\n\n### Usage Example\n\n\
    Before we will start implementing the `dijkstra()` function let’s imagine that\
