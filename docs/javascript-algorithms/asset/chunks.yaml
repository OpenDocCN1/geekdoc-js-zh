    \n## Trees. Depth-First Search.\n\n*   *Difficulty: medium*\n\n### The Task\n\n\
    Imagine that we have a tree of nodes and we want to:\n\n*   check whether a specific\
    \ node exists in a tree (i.e. perform a *search* operation for node “E”),\n\n\
    *   check whether two nodes are connected (i.e. to *find a path* between node\
    \ “A” and “E”),\n\n*   do nodes inventory by visiting all the nodes of a tree\
    \ (i.e. to convert a tree to an array).\n\n![](images/22-tree-depth-first-search----tree.png)\n\
    \nTo accomplish all these tasks we need to utilize a *tree traversal algorithm*.\
    \ In other words, we need to write some code that will allow us to visit every\
    \ node of a tree.\n\nIn this chapter, we will traverse a *binary* tree (a tree\
    \ in which every node may have at most *two* children). Once you understand the\
    \ idea of a depth-first tree traversal for a binary tree you’ll be able to extend\
    \ it for trees with more than two possible children for each node.\n\nThe tree\
    \ that we will traverse is an abstraction of some real-world data. It may be a\
    \ binary tree of subsequent “yes/no” questions and you might want to find out\
    \ what “yes/no” answers will lead you to the final suggestion/conclusion that\
    \ is located on one of the leaves of a tree. You may also think about *chess game\
    \ moves* that are presented as a tree where the children of the node are all the\
    \ possible moves. Each move will lead you to the next node and the next node will\
    \ have another set of possible moves. And you might want to find out which move\
    \ will lead you to the “winning” leaf of a tree.\n\n### The Algorithm\n\nOne of\
    \ the ways to solve the tasks mentioned above is a depth-first search algorithm.\n\
    \n**Depth-first search (DFS)** is an algorithm for traversing a tree or graph\
    \ data structures. The idea of the algorithm is to start at some specific node\
    \ (normally the root node) and explore as far as possible along each branch before\
    \ backtracking.\n\nThe word *backtracking* means that when we’re moving deeper\
    \ along the branch of a tree and there are no more nodes along the current path\
    \ to explore, then we move back up the tree to find the next closest unexplored\
    \ sub-branch (node) and explore it.\n\nThe illustration below shows the sequence\
    \ of binary tree traversal using a depth-first search algorithm.\n\n![](images/22-tree-depth-first-search----tree-depth-first-search.png)\n\
    \nThink about this algorithm as if you are walking through a maze. As you walk,\
    \ you come upon intersections in the maze – these are like the nodes of our tree.\
    \ Each intersection has three options: take a *right* turn, take a *left* turn\
    \ or go *back* to the previous intersection (backtracking). Let’s say we’ve came\
    \ up with a strategy to try the right turns first. So we choose to go right and\
    \ mark the right turn with a paintbrush as “visited” to avoid this turn in the\
    \ future. If we come to a dead end in the maze (a leaf node), we backtrack until\
    \ we reach an intersection where we’ve already gone right. Then we go to the left\
    \ and mark with our paintbrush the left turn as “visited”. Once we came to the\
    \ intersection with both turns being marked as “visited” we need to go back (backtrack)\
    \ to the previous intersection and find the first unvisited turn. And so on until\
    \ we reach the exit of the maze.\n\nThis algorithm may be implemented recursively\
    \ using a **stack** (see the Stack chapter for an in-depth explanation on this\
    \ data structure). The idea of using the stack for depth-first search is the following:\n\
    \n1.  Pick the starting node and put all its children into the stack.\n\n2.  Pop\
    \ the node from the stack to select the next node to visit and push all its children\
    \ into the stack.\n\n3.  Go to step 2 (repeat this process until the stack is\
    \ empty).\n\n### Usage Example"
