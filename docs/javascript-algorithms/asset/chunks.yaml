    ### Complexities\n\nIf we’re generating the product set of two sets `A` and `B`\
    \ then two nested `for` loops will give us `|A| * |B|` number of loops, where\
    \ `|A|` is number of elements in set `A` and `|B|` is number of elements in set\
    \ `|B|`. So the **time complexity** is O(|A| * |B|).\n\nThe **additional space\
    \ complexity** is also O(|A| * |B|) since we’re allocating a new array that will\
    \ hold all cartesian product elements.\n\n### Problems Examples\n\nHere are some\
    \ related problems that you might encounter during the interview:\n\n*   [Letter\
    \ Combinations of a Phone Number](https://leetcode.com/problems/letter-combinations-of-a-phone-number/)\n\
    \n*   [Subsets II](https://leetcode.com/problems/subsets-ii/)\n\n### Quiz\n\n\
    *Q1: How many elements does a Cartesian Product of two sets `A = ['a', 'b']` and\
    \ `B = ['c', 'd']` have?*\n\n*Q2: Is it possible to generate Cartesian Product\
    \ for four sets?*\n\n*Q3: What is the time complexity of a cartesian product algorithm?*\n\
    \n### References\n\nCartesian product on Wikipedia [https://en.wikipedia.org/wiki/Cartesian_product](https://en.wikipedia.org/wiki/Cartesian_product)\n\
    \nCartesian product example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/cartesian-product](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/cartesian-product)\n\
    \n## Sets. Power Set.\n\n*   *Difficulty: medium*\n\nIn mathematics, the **power\
    \ set** of a set `S` is a set of all subsets of `S`, including the empty set and\
    \ set `S` itself. The power set of a set `S` is denoted as `P(S)`. The order of\
    \ the elements in subsets doesn’t matter, meaning that the set `{a, b}` is the\
    \ same as `{b, a}`.\n\nFor example for a set of `{a, b, c}`:\n\n*   the empty\
    \ set is `{}` (which may also be denoted as `âˆ…` or as the *null set*),\n\n*\
    \   one-element subsets are: `{a}`, `{b}`, abd `{c}`,\n\n*   two-element subsets\
    \ are: `{a, b}`, `{a, c}` and `{b, c}`,\n\n*   and the original set `{a, b, c}`\
    \ is also counted as a subset.\n\nSumming all up we can say that the power set\
    \ of a set `{a, b, c}` is a following set:\n\n```\nP({a, b, c}) = {\n    {},\n\
    \    {a}, {b}, {c},\n    {a, b}, {a, c}, {b, c},\n    {a, b, c}\n}\n```\n\nThe\
    \ image below illustrates the process of generating a power set of a set `{x,\
    \ y, z}` graphically.\n\n![](images/18-power-set----power-set.png)\n\n**Total\
    \ Number of Subsets**\n\nFor the set `S` with `n` members, the total number of\
    \ subsets in a power set `P(S)` is written as `|P(S)|` and is equal to ***|P(S)|\
    \ = 2<sup>n</sup>***.\n\nFor example, say we have a set `S = {a, b, c}` with `3`\
    \ members then the total number of subsets is *2<sup>3</sup> = 8*.\n\nWhy does\
    \ the power set have a power of two members? *The power set is binary in nature*.\
    \ Let’s write down a table of `8` binary numbers. Each binary number in this case\
    \ will consist of three bits and each bit corresponds to an element in the set\
    \ `S`. If the bit is set to 1, then the element is included in the subset. If\
    \ the bit is set to 0, the element will not be in the subset. Take a look at the\
    \ picture and the table below to get a better understanding of this idea.\n\n\
    ![](images/18-power-set----bit-mask.png)\n\n| Number | `abc` | Subset |\n\n| ---\
    \ | --- | --- |\n\n| `0` | `000` | `{}` |\n\n| `1` | `001` | `{c}` |\n\n| `2`\
    \ | `010` | `{b}` |\n\n| `3` | `011` | `{c, b}` |\n\n| `4` | `100` | `{a}` |\n\
    \n| `5` | `101` | `{a, c}` |\n\n| `6` | `110` | `{a, b}` |\n\n| `7` | `111` |\
    \ `{a, b, c}` |\n\nSo the bit combinations starting from *0* and up to *2<sup>n</sup>*\
    \ are describe all possible subsets of a power set. Thus each power set will have\
    \ *2<sup>n</sup>* subsets in total, where *n* is the number of elements in the\
    \ original set.\n\n### Usage Example\n\nBefore we move on to the power set algorithm\
    \ implementation, let’s imagine that we already have a `bwPowerSet()` function\
    \ implemented and let’s use it to generate all possible ingredient combinations\
    \ for a fruit salad. This will help us understand what types of inputs and outputs\
    \ we need for the function.\n\n```\n 1 // Import dependencies.\n 2 import bwPowerSet\
    \ from './bwPowerSet';\n 3 \n 4 // Set up ingredients.\n 5 const ingredients =\
    \ ['banana', 'orange', 'apple'];\n 6 \n 7 // Generate all possible salad mixes\
    \ out of our ingredients.\n 8 const saladMixes = bwPowerSet(ingredients);\n 9\
    \ \n10 // eslint-disable-next-line no-console\n11 console.log(saladMixes);\n12\
    \ \n13 /*\n14   The output will be:\n15 \n16   [\n17     [],\n18     ['banana'],\n\
    19     ['orange'],\n20     ['banana', 'orange'],\n21     ['apple'],\n22     ['banana',\
    \ 'apple'],\n23     ['orange', 'apple'],\n24     ['banana', 'orange', 'apple'],\n\
    25   ]\n26  */\n```\n\n18-power-set/example.js\n\n### Implementation"
