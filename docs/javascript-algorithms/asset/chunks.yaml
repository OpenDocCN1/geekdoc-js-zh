  trans: "\n\n这是一个默认的回退比较函数，它将两个参数 `a` 和 `b` 视为字符串或数字，并对它们应用常用的比较运算符，如 `===`、`<` 和\
    \ `>`。\n\n```javascript\n  /**\n   * 默认比较函数。它仅假设 \"a\" 和 \"b\" 是字符串或数字。\n   *\
    \ @param {(string|number)} a\n   * @param {(string|number)} b\n   * @returns {number}\n\
    \   */\n  static defaultCompareFunction(a, b) {\n    if (a === b) {\n      return\
    \ 0;\n    }\n\n    return a < b ? -1 : 1;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `equal()`\n\n此函数检查两个变量是否相等。\n\n```javascript\n  /**\n   * 检查两个变量是否相等。\n\
    \   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n   */\n  equal(a,\
    \ b) {\n    return this.compare(a, b) === 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `lessThan()`\n\n此函数检查变量 `a` 是否小于 `b`。\n\n```javascript\n  /**\n   * 检查变量\
    \ \"a\" 是否小于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n\
    \   */\n  lessThan(a, b) {\n    return this.compare(a, b) < 0;\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `greaterThan()`\n\n此函数检查变量 `a` 是否大于 `b`。\n\n```javascript\n  /**\n   * 检查变量\
    \ \"a\" 是否大于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return {boolean}\n\
    \   */\n  greaterThan(a, b) {\n    return this.compare(a, b) > 0;\n  }\n```\n\n\
    `utils/comparator/Comparator.js`\n\n### `lessThanOrEqual()`\n\n此函数检查变量 `a` 是否小于或等于\
    \ `b`。\n\n```javascript\n  /**\n   * 检查变量 \"a\" 是否小于或等于 \"b\"。\n   * @param {*}\
    \ a\n   * @param {*} b\n   * @return {boolean}\n   */\n  lessThanOrEqual(a, b)\
    \ {\n    return this.lessThan(a, b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\
    \n### `greaterThanOrEqual()`\n\n此函数检查变量 `a` 是否大于或等于 `b`。\n\n```javascript\n  /**\n\
    \   * 检查变量 \"a\" 是否大于或等于 \"b\"。\n   * @param {*} a\n   * @param {*} b\n   * @return\
    \ {boolean}\n   */\n  greaterThanOrEqual(a, b) {\n    return this.greaterThan(a,\
    \ b) || this.equal(a, b);\n  }\n```\n\n`utils/comparator/Comparator.js`\n\n###\
    \ 类 `MinHeap`\n\n让我们继续实现 `MinHeap` 类。\n\n首先导入依赖项。我们将在类构造函数中使用 `Comparator` 实例，以便允许类的使用者更改堆元素之间的比较方式。\n\
    \n```javascript\n// 导入依赖项。\nimport Comparator from '../utils/comparator/Comparator';\n\
    ```\n\n`4-stack/Stack.js`\n\n### `constructor`\n\n让我们声明 `MinHeap` 类：\n\n```javascript\n\
    export class MinHeap {\n```\n\n`4-stack/Stack.js`\n\n在类构造函数中，我们需要创建一个数组来存储所有堆数据。为了提高\
    \ `has()` 操作的性能，我们还创建了 `heapElements` Map，它将存储所有的堆元素，并允许我们在 `O(1)` 时间内检查元素是否存在于堆中。\n\
    \n```javascript\n  /**\n   * @constructs MinHeap\n   * @param {Function} [comparatorFunction]\n\
    \   */\n  constructor(comparatorFunction) {\n    // 堆的数组表示法。\n    this.heapContainer\
    \ = [];\n\n    // 用于快速查找的堆元素 Map。\n    this.heapElements = new Map();\n\n    //\
    \ 允许类的使用者更改堆元素之间的比较方式。\n    // 这在我们想要在堆中保存对象时特别有用。\n    this.compare = new Comparator(comparatorFunction);\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n### 辅助方法\n\n在继续实现主要的堆操作之前，让我们先实现几个帮助我们遍历堆的辅助方法。\n\
    \n#### `getLeftChildIndex`\n\n此辅助方法通过父节点索引返回左子节点的索引。如果 `i` 是父节点索引，那么左子节点的公式为 `2\
    \ * i + 1`。\n\n```javascript\n  /**\n   * @param {number} parentIndex\n   * @return\
    \ {number}\n   */\n  getLeftChildIndex(parentIndex) {\n    return (2 * parentIndex)\
    \ + 1;\n  }\n```\n\n`4-stack/Stack.js`\n\n#### `getRightChildIndex`\n\n此辅助方法通过父节点索引返回右子节点的索引。如果\
    \ `i` 是父节点索引，那么右子节点的公式为 `2 * i + 2`。\n\n```javascript\n  /**\n   * @param {number}\
    \ parentIndex\n   * @return {number}\n   */\n  getRightChildIndex(parentIndex)\
    \ {\n    return (2 * parentIndex) + 2;\n  }\n```\n\n`4-stack/Stack.js`\n\n###\
    \ `getParentIndex`\n\n此辅助方法通过父节点索引返回子节点索引。如果 `i` 是子节点索引，那么父节点的公式为 `(i - 1) / 2`。\n\
    \n```javascript\n  /**\n   * @param {number} childIndex\n   * @return {number}\n\
    \   */\n  getParentIndex(childIndex) {\n    return Math.floor((childIndex - 1)\
    \ / 2);\n  }\n```\n\n`4-stack/Stack.js`\n\n### `hasParent`\n\n此辅助方法检查索引 `childIndex`\
    \ 是否有父节点。如果 `floor((i - 1) / 2)` 为正数，则返回 `true`。\n\n```javascript\n  /**\n   *\
    \ @param {number} childIndex\n   * @return {boolean}\n   */\n  hasParent(childIndex)\
    \ {\n    return this.getParentIndex(childIndex) >= 0;\n  }\n```\n\n`4-stack/Stack.js`\n\
    \n### `has`\n\n此辅助方法检查 `item` 是否存在于堆中。\n\n```javascript\n  /**\n   * @param {*}\
    \ item\n   * @return {boolean}\n   */\n  has(item) {\n    return this.heapElements.has(item);\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n### `hasLeftChild`\n\n此辅助方法检查索引 `parentIndex`\
    \ 是否有左子节点。如果索引大于 `heapContainer` 的长度，则该节点没有左子节点。\n\n```javascript\n  /**\n   *\
    \ @param {number} parentIndex\n   * @return {boolean}\n   */\n  hasLeftChild(parentIndex)\
    \ {\n    return this.getLeftChildIndex(parentIndex) < this.heapContainer.length;\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n### `hasRightChild`\n\n此辅助方法检查索引 `parentIndex`\
    \ 是否有右子节点。如果索引大于 `heapContainer` 的长度，则意味着当前节点没有右子节点。\n\n```javascript\n  /**\n\
    \   * @param {number} parentIndex\n   * @return {boolean}\n   */\n  hasRightChild(parentIndex)\
    \ {\n    return this.getRightChildIndex(parentIndex) < this.heapContainer.length;\n\
    \  }\n```\n\n`4-stack/Stack.js`\n\n### `leftChild`\n\n此辅助方法返回节点的左子节点。\n\n```javascript\n\
    \  /**\n   * @param {number} parentIndex\n   * @return {*}\n   */\n  leftChild(parentIndex)\
    \ {\n    return this.heapContainer[this.getLeftChildIndex(parentIndex)];\n  }\n\
    ```\n\n`4-stack/Stack.js`\n\n### `rightChild`\n\n此辅助方法返回节点的右子节点。\n\n```javascript\n\
    \  /**\n   * @param {number} parentIndex\n   * @return {*}\n   */\n  rightChild(parentIndex)\
    \ {\n    return this.heapContainer[this.getRightChildIndex(parentIndex)];\n  }\n\
    ```\n\n`4-stack/Stack.js`\n\n### `parent`\n\n此辅助方法返回子节点的父节点。\n\n```javascript\n\
    \  /**\n   * @param {number} childIndex\n   * @return {*}\n   */\n  parent(childIndex)\
    \ {\n    return this.heapContainer[this.getParentIndex(childIndex)];\n  }\n```\n\
    \n`4-stack/Stack.js`\n\n### `swap`\n\n此辅助方法交换 `heapContainer` 数组中的两个元素。\n\n```javascript\n\
    \  /**\n   * @param {number} indexOne\n   * @param {number} indexTwo\n   */\n\
    \  swap(indexOne, indexTwo) {\n    const tmp = this.heapContainer[indexTwo];\n\
    \    this.heapContainer[indexTwo] = this.heapContainer[indexOne];\n    this.heapContainer[indexOne]\
    \ = tmp;\n  }\n```\n\n`4-stack/Stack.js`\n\n### `isEmpty`\n\n此辅助方法检查 `heapContainer`\
    \ 数组中是否至少有一个元素。\n\n"
- fmt: "\n```javascript\n/**\n * @return {boolean}\n */\nisEmpty() {\n  return !this.heapContainer.length;\n\
    }\n```\n\n### 4-stack/Stack.js\n\n#### `find`\n\nThis helper method finds the\
    \ positions of the elements in a heap by the value. It is possible that heap will\
    \ have duplicate values and thus this method returns an array of positions instead\
    \ of just one number (the position of the element we’re searching for). The equality\
    \ of two elements of a heap is being checked by using `comparator()` function.\n\
    \n```javascript\n/**\n * @param {*} item\n * @param {Comparator} [comparator]\n\
    \ * @return {Number[]}\n */\nfind(item, comparator = this.compare) {\n  const\
    \ foundItemIndices = [];\n\n  for (let itemIndex = 0; itemIndex < this.heapContainer.length;\
    \ itemIndex += 1) {\n    if (comparator.equal(item, this.heapContainer[itemIndex]))\
    \ {\n      foundItemIndices.push(itemIndex);\n    }\n  }\n\n  return foundItemIndices;\n\
    }\n```\n\n### 4-stack/Stack.js\n\n#### `toString`\n\nThis helper method returns\
    \ a string representation of the heap by just calling `toString()` method of the\
    \ `heapContainer` array.\n\n```javascript\n/**\n * @return {string}\n */\ntoString()\
    \ {\n  return this.heapContainer.toString();\n}\n```\n\n### 4-stack/Stack.js\n\
    \n#### Internal Methods that Preserve Heap Property\n\nThe methods in this section:\
    \ `heapifyUp` and `heapifyDown` are responsible for keeping the heap-property\
    \ after any heap modification. The heap modification methods that use `heapifyUp`\
    \ and `heapifyDown` – `peek`, `poll`, `add`, `remove` – are explained in the next\
    \ section.\n\n###### `heapifyUp`\n\nThis method makes sure that heap-property\
    \ of the heap is satisfied after new element has been added to the min-heap. It\
    \ is possible that new element may be smaller than its parent. In order to fix\
    \ this situation we take the last element (last in array or the bottom left in\
    \ a tree) in the heap container and lift it up until it is in the correct order\
    \ with respect to its parent element.\n\n![](images/07-heap----heapify-up.png)\n\
    \nWe also will provide a possibility to do the \"heapify-up\" operation for any\
    \ element of the heap by adding arbitrary parameter `customStartIndex` to the\
    \ function. We need this for `remove()` method.\n\n```javascript\n/**\n * @param\
    \ {number} [customStartIndex]\n */\nheapifyUp(customStartIndex) {\n  // Take the\
    \ last element (last in array or the bottom left in a tree)\n  // in the heap\
    \ container and lift it up until it is in the correct\n  // order with respect\
    \ to its parent element.\n  let currentIndex = customStartIndex || this.heapContainer.length\
    \ - 1;\n\n  while (\n    this.hasParent(currentIndex)\n    && this.compare.greaterThan(this.parent(currentIndex),\
    \ this.heapContainer[currentIndex])\n  ) {\n    this.swap(currentIndex, this.getParentIndex(currentIndex));\n\
    \    currentIndex = this.getParentIndex(currentIndex);\n  }\n}\n```\n\n### 4-stack/Stack.js\n\
    \n###### `heapifyDown`\n\nThis method makes sure that heap-property of the heap\
    \ is satisfied after the root of the heap has been polled out. The common behaviour\
    \ in this case is to replace the root of the heap with the last element of the\
    \ `heapContainer`. But the new head element may be greater than its children.\
    \ In this case we need to compare the parent element to its children and swap\
    \ parent with the appropriate child (smallest child for min-heap, largest child\
    \ for max-heap). We need to do the same for next children after the swap.\n\n\
    ![](images/07-heap----heapify-down.png)\n\nWe also will provide a possibility\
    \ to do the \"heapify-down\" operation for any element of the heap by adding arbitrary\
    \ parameter `customStartIndex` to the function. We need this for `remove()` method.\n\
    \n```javascript\n/**\n * @param {number} [customStartIndex]\n */\nheapifyDown(customStartIndex\
    \ = 0) {\n  // Compare the parent element to its children and swap parent with\
    \ the appropriate\n  // child (smallest child for MinHeap, largest child for MaxHeap).\n\
    \  // Do the same for next children after swap.\n  let currentIndex = customStartIndex;\n\
    \  let nextIndex = null;\n\n  while (this.hasLeftChild(currentIndex)) {\n    if\
    \ (\n      this.hasRightChild(currentIndex)\n      && this.compare.lessThanOrEqual(this.rightChild(currentIndex),\
    \ this.leftChild(currentIndex))\n    ) {\n      nextIndex = this.rightChild(currentIndex);\n\
    \    } else {\n      nextIndex = this.leftChild(currentIndex);\n    }\n\n    if\
    \ (this.compare.lessThanOrEqual(this.heapContainer[currentIndex], this.heapContainer[nextIndex]))\
    \ {\n      break;\n    }\n\n    this.swap(currentIndex, nextIndex);\n    currentIndex\
    \ = nextIndex;\n  }\n}\n```\n\n### 4-stack/Stack.js\n\n#### Main Methods\n\nNow\
    \ that we have a bunch of helper methods implemented let’s move on and add main\
    \ methods of the heap.\n\n###### `peek`\n\nThis method will return the head of\
    \ the heap without removing it. It is useful when we just need to check the minimum\
    \ element of the min-heap. The head of the heap is a first element of the `heapContainer`\
    \ array.\n\n```javascript\n/**\n * @return {*}\n */\npeek() {\n  // Check if heap\
    \ is empty.\n  if (this.heapContainer.length === 0) {\n    // If heap is empty\
    \ then there is nothing to peek.\n    return null;\n  }\n  // Return the first\
    \ element of heap\n  return this.heapContainer[0];\n}\n```\n\n### 4-stack/Stack.js\n\
    \n###### `poll`\n\nThis method will remove and return the head of the heap. It\
    \ is useful when we need to fetch the minimum element of the min-heap. The head\
    \ of the heap is a first element of the `heapContainer` array.\n\nAfter we remove\
    \ the head of the heap we move the last element of the `heapContainer` to the\
    \ head. This operation will preserve the shape property (the tree must be a complete\
    \ tree). But it is possible that now the heap property is violated and the head\
    \ of the min-heap is bigger than its children. To fix that we call `heapifyDown()`\
    \ method that in turn will preserve the heap property. We will implement shortly.\n\
    \n![](images/07-heap----poll-from-heap.png)\n\n```javascript\n/**\n * @return\
    \ {*}\n */\npoll() {\n  if (this.heapContainer.length === 0) {\n    // If heap\
    \ is empty then there is nothing to poll.\n    return null;\n  }\n  if (this.heapContainer.length\
    \ === 1) {\n    // If the heap consist of one element then just extract it.\n\
    \    return this.heapContainer.pop();\n  }\n  // Remember the value we want to\
    \ return.\n  const item = this.heapContainer[0];\n  // Move the last element from\
    \ the end to the head to preserve the shape property.\n  this.heapContainer[0]\
    \ = this.heapContainer.pop();\n\n  // Heapify the heap down in order to preserve\
    \ the heap property.\n  this.heapifyDown();\n\n  return item;\n}\n```\n\n### 4-stack/Stack.js\n\
    \n###### `add`\n\nThis method adds a new element to the min-heap. In order to\
    \ preserve the shape-property of the heap, the new element is added to the end\
    \ of the `heapContainer` array. After adding the new element, it is possible that\
    \ the newly added element is smaller than its parent. In this case, the heap-property\
    \ is violated. To fix that, we call the `heapifyUp()` method that will lift the\
    \ new element up in a tree structure so the heap-property is satisfied.\n\n![](images/07-heap----add-to-heap.png)\n"
