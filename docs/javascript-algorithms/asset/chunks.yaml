    ### Introduction


    As a JavaScript developer you might think you don’t need to learn about data structures
    or algorithms.


    Did you know JavaScript itself (runtime + browser) uses things like a stack, a
    heap and a queue? The more you understand the JavaScript you use on the daily
    basis – really understand it, the better you can wield it’s power and make less
    mistakes. If you thought algorithms and data structures were just a computer science
    course that wasn’t necessary on a day to day basis as JavaScript developer, think
    again!


    ### How To Read This Book


    Each chapter covers an algorithm you might encounter in your work or at an interview.
    You can work through the algorithms one at a time or feel free to jump around.


    ## Algorithms and Their Complexities


    ### What is an Algorithm


    In this book, we’re going to write `algorithms` - the sets of steps that will
    solve specific problems for us.


    We constantly use `algorithms in our everyday life. For example what if we’re
    somewhere on a street and want to get home to our apartment that is on the 20th
    floor? In order to achieve that we could do the following:


    ```

    1. Take a WALK to your home.

    2. Use STAIRS to go up to the 20th floor.

    ```


    This is an algorithm. We’ve defined and used the set of steps that solve our task
    of getting home.


    ### Algorithm Complexity


    Let’s take the example of “getting home” issue from the previous section. Is there
    another way of solving it? Yes, we implement different steps (read “algorithm”)
    to achieve that goal:


    ```

    1. Call a CAB that will drive you home.

    2. Use the ELEVATOR to get upstairs to the 20th floor.

    ```


    Now, let’s think about which of these two algorithms we should choose:


    First, we need to clarify our restrictions (how much money do we have, how urgently
    we need to get home, how healthy we are) and evaluate `algorithms from the perspective
    of these restrictions`.


    As you can see each of these two algorithms requires a different amount of time
    and resources. The first one will require more time and energy but less money.
    The second one will require less time and energy but more money. And if we don’t
    have money and are pretty healthy we need to choose the first algorithm and enjoy
    the walk. Otherwise, if we have enough money and need to get home urgently the
    second option is better.


    What we’ve just done here is we’ve evaluated the `complexity of each algorithm`.


    #### Time and Space Complexities


    In the previous example, we’ve evaluated time and resources (i.e. money and/or
    health) that each algorithm requires. We will refer to these evaluations as `time
    complexity` and `resource complexity`. These two characteristics are crucial for
    us to decide which algorithm suits our needs.


    In this book, we won’t deal with “getting home” problems from the perspective
    of daily routine planning where we may apply our intuition only. Rather, we will
    deal with a more mathematical way.


    ### Big O Notation


    #### Big O Notation Definition


    *Big O notation is used to classify algorithms according to how their running
    time or space grow.*


    The key here is that Big O notation is a relative metric that shows how fast execution
    time of the algorithm will grow depending on input size. Absolute values of time
    and memory vary on different hardware so we need to use relative metric. The same
    program may be executed in 1 second on one computer and 10 seconds on another
    one. Thus when you compare time complexities of two algorithms it is required
    for them to be running on the same predefined hardware configuration which is
    not convenient and sometimes is not reproducible.


    Big O notation defines relationship `input size → spent time` for time complexity
    and `input size → consumed memory` for space complexity. It characterizes programs
    (functions) according to their growth rates: different programs with the same
    growth rate may be represented using the same O notation.


    The letter O is used because the growth rate of a program (function) is also referred
    to as the order of the function.


    #### Big O Notation Explanation


    Let’s illustrate the Big O concept on the “getting home” algorithm that was mentioned
    above, specifically the “stairs climbing” portion of the algorithm.


    Let’s imagine we have two men: one is a young and fast Olympic champion and the
    other one is your typical middle-aged male. We’ve just agreed that we want the
    complexity of stairs climbing algorithm to be the same for both men so it should
    not depend on a man’s speed but rather depends on how high the two men climb.
    In terms of a computer, our algorithm analysis will not depend on the hardware,
    but on the software problem itself. How many steps would these two men need to
    take to get to the 20th floor? Well, let’s assume that we have 20 steps between
    each floor. That means the two men need to take `20 * 20 = 400` steps to get to
    the 20th floor. Let’s generalize it for `n''s` floor:


    ```

    Input: (20 * n) steps

    Output: (20 * n) steps (moves)

    ```

