    \   */\n  add(item) {\n    // Add new item to the end of the heap (shape property\
    \ is preserved).\n    this.heapContainer.push(item);\n\n    // Add current item\
    \ to the map of heap elements for fast access.\n    this.heapElements.set(item,\
    \ item);\n\n    // Make sure that the heap-property is preserved by moving the\n\
    \    // element up in case if it smaller than its parent.\n    this.heapifyUp();\n\
    \n    return this;\n  }\n```\n\n`4-stack/Stack.js`\n\n#### `remove`\n\nThis method\
    \ removes the element(s) from the heap by value. In order to remove the element(s)\
    \ we need to do the following:\n\n*   Find all elements in the heap with the specified\
    \ value (it is possible that we might have duplicates and all of them need to\
    \ be removed)\n*   Go through all the elements that needs to be removed. – Move\
    \ the last element of a heap to the vacant (removed) position. – For the element\
    \ that we’ve just moved we need to get its new parent and children to decide whether\
    \ heap property is not violated. – If the heap property is violated we need to\
    \ call `heapifyUp()` (if parent is greater than the new element value) or `heapifyDown()`\
    \ (if the element value is greater than the value of any of its children) method.\n\
    \nThe function will return `this` in order to be able to chain the commands like\
    \ `heap.remove(10).add(5)` just for convenience.\n\n```javascript\n239\n  /**\n\
    \   * @param {*} item\n   * @param {Comparator} [comparator]\n   * @return {MinHeap}\n\
    \   */\n  remove(item, comparator = this.compare) {\n    // Find number of items\
    \ to remove.\n    const numberOfItemsToRemove = this.find(item, comparator).length;\n\
    \n    // Remove current item from the map of heap elements.\n    this.heapElements.delete(item);\n\
    \n    for (let iteration = 0; iteration < numberOfItemsToRemove; iteration +=\
    \ 1) {\n      // We need to find item index to remove each time after removal\
    \ since\n      // indices are being changed after each heapify process.\n    \
    \  const indexToRemove = this.find(item, comparator).pop();\n\n      // If we\
    \ need to remove last child in the heap then just remove it.\n      // There is\
    \ no need to heapify the heap afterwards.\n      if (indexToRemove === (this.heapContainer.length\
    \ - 1)) {\n        this.heapContainer.pop();\n      } else {\n        // Move\
    \ last element in heap to the vacant (removed) position.\n        this.heapContainer[indexToRemove]\
    \ = this.heapContainer.pop();\n\n        // Get parent.\n        const parentItem\
    \ = this.parent(indexToRemove);\n\n        // If there is no parent or parent\
    \ is in correct order with the node\n        // we're going to delete then heapify\
    \ down. Otherwise heapify up.\n        if (\n          this.hasLeftChild(indexToRemove)\n\
    \          && (\n            !parentItem\n            || parentItem <= this.heapContainer[indexToRemove]\n\
    \          )\n        ) {\n          this.heapifyDown(indexToRemove);\n      \
    \  } else {\n          this.heapifyUp(indexToRemove);\n        }\n      }\n  \
    \  }\n\n    return this;\n  }\n```\n\n`4-stack/Stack.js`\n\n### Complexities\n\
    \n| Peek | Poll | Add | Remove |\n| --- | --- | --- | --- |\n| O(1) | O(log(n))\
    \ | O(log(n)) | O(log(n)) |\n\n*Polling*, adding and removing from queue have\
    \ `O(log(n))` time complexity because every time we do these operations we need\
    \ to re-heapify the tree of a heap. This would make us access all the elements\
    \ in a branch of a tree in worst case.\n\n*Peeking* has `O(1)` time complexity\
    \ because we’re just accessing the first element (the root) of the heap array.\n\
    \n### Problems Examples\n\nHere are some related problems that you might encounter\
    \ during the interview:\n\n*   [Check Completeness of a Binary Tree](https://leetcode.com/problems/check-completeness-of-a-binary-tree/)\n\
    *   [Binary Tree Inserter](https://leetcode.com/problems/complete-binary-tree-inserter/)\n\
    \n### Quiz\n\n*Q1: What are two constraints that each binary heap must satisfy?*\n\
    \n*Q2: When we do `poll` operation on a heap and extract the head then what value\
    \ must be put on the place of extracted one?*\n\n*Q3: What is the time complexity\
    \ of `poll()` in `MinHeap`?*\n"
