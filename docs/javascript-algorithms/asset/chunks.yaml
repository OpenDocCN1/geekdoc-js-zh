    \ - most straightforward case, we remove the node.\n\n*   **Removing a node with\
    \ one child** - we make the child node become a child node for the current node’s\
    \ parent\n\n*   **Removing the node with two children** - we need to find the\
    \ next largest value (minimum value in the right branch) and replace current node\
    \ with that next largest value node.\n\nHere is an illustration for the last case\
    \ when the node has two children.\n\n![](images/06-binary-search-tree----binary-search-tree-removing.png)\n\
    \n#### Traversing\n\nTraversing is visiting all the nodes of a tree in a specific\
    \ order.\n\n![](images/06-binary-search-tree----binary-search-tree-traversal.png)\n\
    \nIn this chapter, we will implement in-order traversal to convert the binary\
    \ search tree to a sorted array.\n\n### Usage Example\n\nBefore we move on to\
    \ the exact JavaScript implementation of the binary search tree, let’s look at\
    \ a use case for our `BinarySearchTree` class and describe how we’re going to\
    \ use it.\n\nSay we have a collection of shopping items. And we want to make *all*\
    \ of the following operations to perform fast (in `O(log(n))` time): - getting\
    \ items by specific price, - inserting new items, - removing existing items, -\
    \ getting the cheapest item from the collection, - getting the most expensive\
    \ item from the collection.\n\n```\n 1 // Import dependencies\n 2 import BinarySearchTree\
    \ from './BinarySearchTree';\n 3 \n 4 // Create binary search tree instance.\n\
    \ 5 const bstCollection = new BinarySearchTree();\n 6 \n 7 // Add shopping items\
    \ to our binary search tree collection.\n 8 // We will use items price as a keys.\n\
    \ 9 bstCollection.insert(1220, { title: 'Phone' });\n10 bstCollection.insert(3455,\
    \ { title: 'TV' });\n11 bstCollection.insert(8200, { title: 'Notebook' });\n12\
    \ bstCollection.insert(120, { title: 'Remote Control' });\n13 \n14 // Let's find\
    \ the cheapest and most expensive items so far.\n15 const minItem = bstCollection.findMin().data;\
    \ // -> { title: 'Remote Control' }\n16 const maxItem = bstCollection.findMax().data;\
    \ // -> { title: 'Notebook' }\n17 \n18 // Let's fins the item with the price 8200.\n\
    19 const item = bstCollection.find(3455).data; // -> { title: 'TV' }\n20 \n21\
    \ // Remove the item from collection by price.\n22 bstCollection.remove(120);\n\
    23 // Check what is the cheapest item at the moment.\n24 const newMinItem = bstCollection.findMin().data;\
    \ // -> { title: 'Phone' }\n25 \n26 // Now we may use the data we've just fetched\
    \ anyhow.\n27 // eslint-disable-next-line no-console\n28 console.log(minItem,\
    \ maxItem, item, newMinItem);\n```\n\n06-binary-search-tree/example.js\n\n###\
    \ Implementation\n\nWe’ll split our implementation into two parts. First, we will\
    \ first implement `BinarySearchTreeNode` class which will represent nodes of the\
    \ binary search tree and their functionality. This class will contain the core\
    \ functionality. Then, we’ll implement `BinarySearchTree` class that will be just\
    \ a wrapper over the `BinarySearchTreeNode` class and will make working with a\
    \ binary search tree a little bit easier.\n\n#### BinarySearchTreeNode\n\n#####\
    \ `constructor`\n\nLet’s create the class.\n\n```\n1 export default class BinarySearchTreeNode\
    \ {\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\nOur constructor will\
    \ accept the `value` parameter that we will use as a key to define where in the\
    \ tree the current node should be placed. All node comparisons will be made using\
    \ this `value` parameter. The `data` parameter serves as a data bag that contains\
    \ any type of data. For example, it may contain a linked list with all shopping\
    \ items of a specific price, or it may contain a user object with a name, telephone\
    \ number, etc.\n\nIn our constructor, we’ll also create pointers to the left and\
    \ right child as well as a pointer to the parent node. For the root node in a\
    \ tree the parent will always be `null`.\n\n```\n 2   /**\n 3    * @param {*}\
    \ [value] - node value.\n 4    * @param {*} [data] - node data (could be anything).\n\
    \ 5    */\n 6   constructor(value = null, data = null) {\n 7     this.left = null;\
    \ // Pointer to the left child.\n 8     this.right = null; // Pointer to the right\
    \ child.\n 9     this.parent = null; // Pointer to the parent node.\n10     this.value\
    \ = value;\n11     this.data = data;\n12   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `find()`\n\nThis method finds the node in a whole tree by its `value`\
    \ (key). It does a binary search tree lookup operation that was in the explanation\
    \ above. As a reminder, to find a node by its key in the binary search tree we\
    \ need to recursively compare its value with the current node and then go left\
    \ (to the left child) if current node value is bigger than the one we want to\
    \ find. Otherwise, we need to go right (to the right node). The same process is\
    \ repeated for the next node (left or right child).\n\n```\n168   /**\n169   \
    \ * @param {*} value\n170    * @return {BinarySearchTreeNode}\n171    */\n172\
    \   find(value) {\n173     // Check the root.\n174     if (this.value === value)\
    \ {\n175       return this;\n176     }\n177 \n178     if (value < this.value &&\
    \ this.left) {\n179       // Check left nodes.\n180       return this.left.find(value);\n\
    181     }\n182 \n183     if (value > this.value && this.right) {\n184       //\
    \ Check right nodes.\n185       return this.right.find(value);\n186     }\n187\
    \ \n188     return null;\n189   }\n```\n\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n##### `insert()`\n\nTo insert a new node to the binary search tree we perform\
    \ a similar function as the lookup - we compare the new node value with the current\
    \ node value and if the new value is bigger than the current node value, we move\
    \ right (to the right node). Otherwise, we move left (to the left node). We repeat\
    \ this process until the next node cannot be found (it is `null`). When we have\
    \ reached a `null` value, we have found the proper place for the new node to be\
    \ inserted and we assign this `null` pointer to the new node. The new node instance\
    \ is created using `BinarySearchTreeNode` constructor with `value` and `data`\
    \ parameters."
