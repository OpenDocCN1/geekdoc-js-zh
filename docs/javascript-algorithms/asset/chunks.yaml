    \ = this.endVertex.getKey();\n21 \n23     return `${startVertexKey}_${endVertexKey}`;\n\
    23   }\n```\n\n08-graph/GraphEdge.js\n\n### `toString()`\n\n此方法将返回边的字符串表示。为了简单起见，我们在这里返回边的键。\n\
    \n```javascript\n25   /**\n26    * 将边转换为字符串。\n27    * @return {string}\n28   \
    \ */\n29   toString() {\n30     return this.getKey();\n31   }\n```\n\n08-graph/GraphEdge.js\n\
    \n## GraphVertex\n\n我们将使用之前章节中的 `LinkedList` 类来存储顶点的所有相邻边。让我们先导入我们的依赖项。\n\n```javascript\n\
