    \ at a time and `AND` the number with 1 to determine if the bit is set or not.\n\
    \nInitial binary representation of 5 –> `000101` Set bit count: 1 shift 1 –> `000010`\
    \ Set bit count:1 shift 2 –> `000001` Set bit count:2 shift 3 –> `000000` Set\
    \ bit count:2\n\nNumber is now 0, so terminate while loop. Set bit count is 2.\n\
    \n```\n 1 /**\n 2  * @param {number} originalNumber\n 3  * @return {number}\n\
    \ 4  */\n 5 export default function countSetBits(originalNumber) {\n 6   let setBitsCount\
    \ = 0;\n 7   let number = originalNumber;\n 8 \n 9   while (number) {\n10    \
    \ // Add last bit of the number to the sum of set bits.\n11     setBitsCount +=\
    \ number & 1;\n12 \n13     // Shift number right by one bit to investigate other\
    \ bits.\n14     number >>= 1;\n15   }\n16 \n17   return setBitsCount;\n18 }\n\
    ```\n\n09-bit-manipulation/countSetBits.js\n\n##### Count the Bit Difference\n\
    \nThis methods determines the number of bits that are different between two numbers.\
    \ By using the `XOR` operation, we can determine the number of bits that are different\
    \ between the two numbers, and then use the `countBit` function to get a total\
    \ number.\n\n```\n1 000101 ^ 000001 = 000100\n2 Count of Bits to be Flipped: 1\n\
    ```\n\n```\n 1 import countSetBits from './countSetBits';\n 2 \n 3 /**\n 4  *\
    \ Counts the number of bits that need to be change in order\n 5  * to convert\
    \ numberA to numberB.\n 6  *\n 7  * @param {number} numberA\n 8  * @param {number}\
    \ numberB\n 9  * @return {number}\n10  */\n11 export default function bitsDiff(numberA,\
    \ numberB) {\n12   return countSetBits(numberA ^ numberB);\n13 }\n```\n\n09-bit-manipulation/bitsDiff.js\n\
    \n##### Count the Number of Significant Bits of a Number\n\nTo calculate the number\
    \ of valuable bits we need to shift `1` one bit left each time and see if the\
    \ shifted number is bigger than the input number.\n\n5 = `000101` Initial binary\
    \ represenation of 1 –> `000001` Bit count: 0 `000010` <– shift 1, 2 < 5 `000100`\
    \ <– shift 2, 4 < 5 `001000` <– shift 3, 8 > 5\n\nCount of valuable bits is: 3\
    \ When we shift 1 four times it is bigger than 5.\n\n```\n 1 /**\n 2  * Return\
    \ the number of bits used in the binary representation of the number.\n 3  *\n\
    \ 4  * @param {number} number\n 5  * @return {number}\n 6  */\n 7 export default\
    \ function bitLength(number) {\n 8   let bitsCounter = 0;\n 9 \n10   while ((1\
    \ << bitsCounter) <= number) {\n11     bitsCounter += 1;\n12   }\n13 \n14   return\
    \ bitsCounter;\n15 }\n```\n\n09-bit-manipulation/bitLength.js\n\n### Problems\
    \ Examples\n\nHere are some related problems that you might encounter during the\
    \ interview:\n\n*   [Reverse Bits](https://leetcode.com/problems/reverse-bits/)\n\
    \n*   [Bitwise AND of Numbers Range](https://leetcode.com/problems/bitwise-and-of-numbers-range/)\n\
    \n### Quiz\n\n*Q1: What does -5 look like in two’s complement binary format?*\n\
    \n*Q2: If we clear the bit in position 0 for the binary representation for the\
    \ number 5, what is the result?*\n\n### References"
