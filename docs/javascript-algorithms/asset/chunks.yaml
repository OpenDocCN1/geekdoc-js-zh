  trans: "\n\n```javascript\n 1. 依赖。\nimport { PriorityQueue } from './PriorityQueue';\n\
    \n// 初始化一个空优先级队列。\nconst priorityQueue = new PriorityQueue();\n\n// 初始化一个美国城市数组，人口以百万为单位指定。\n\
    const notSortedCities = [\n  { name: 'New York', population: 8.6 },\n  { name:\
    \ 'Chicago', population: 2.7 },\n  { name: 'San Francisco', population: 0.84 },\n\
    \  { name: 'Houston', population: 2 },\n];\n\n// 将所有城市添加到优先级队列，将人口视为优先级。\nnotSortedCities.forEach(city\
    \ => priorityQueue.add(city, city.population));\n\n// 现在我们从优先级队列中逐个获取城市，并将它们放入\n\
    // sortedCities 数组中。我们期望城市按人口从小到大的顺序被弹出。\nconst sortedCities = [];\nwhile (priorityQueue.peek())\
    \ {\n  // 只要我们还能从队列中查看元素，就意味着队列尚未为空。\n  sortedCities.push(priorityQueue.poll());\n\
    }\n\n// 我们期望 sortedCities 确实按人口从小到大的顺序排序。\n// eslint-disable-next-line no-console\n\
    console.log(sortedCities);\n\n/*\n  输出将是：\n\n  [\n    { name: 'San Francisco',\
    \ population: 0.84 },\n    { name: 'Houston', population: 2 },\n    { name: 'Chicago',\
    \ population: 2.7 },\n    { name: 'New York', population: 8.6 },\n  ]\n*/\n```\n\
    \n`07-priority-queue/example.js`\n\n### Implementation\n\n我们将根据上面解释的 `MinHeap`\
    \ 类来构建 `PriorityQueue` 类。`MinHeap` 类支持自定义比较函数。因此，我们将使用 `Comparator` 实例来修改 `MinHeap`\
    \ 中的比较算法，使其比较元素的优先级而不是值。关于 `MinHeap` 和 `Comparator` 实现的更多细节，请参考本书的“堆（Heap）”章节。\n\
    \n让我们导入将要到的依赖。\n\n```javascript\n// 导入依赖。\nimport { MinHeap } from '../07-heap/MinHeap';\n\
    import Comparator from '../utils/comparator/Comparator';\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n让我们声明 `PriorityQueue` 类并继承自 `MinHeap` 类。\n\n```javascript\nexport class PriorityQueue\
    \ extends MinHeap {\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `constructor()`\n\
    \n在构造函数中，我们首先通过调用 `super()` 调用 `MinHeap` 类的父构造函数。\n\n接下来，我们将创建一个优先级映射 `this.priorities`。这个映射存储了所有优先级队列项的优先级值，并以元素本身作为键。例如\
    \ `this.priorities` 可能看起来像 `{itemA: 10, itemB: 14}`，其中 `itemA` 和 `itemB` 是元素键，`10`\
    \ 和 `14` 是元素的优先级。\n\n我们还会创建一个自定义的 `this.compare()` 函数。这是修改 `MinHeap` 行为的主要地方，使\
    \ `MinHeap` 方法遵循元素的优先级而不是元素的值。你可能会在这里看到我们提供了一个自定义的 `this.comparePriority()` 函数作为主比较函数。该函数将在下方解释。\n\
    \n```javascript\n  constructor() {\n    // 先调用 MinHeap 构造函数。\n    super();\n\n\
    \    // 设置优先级映射。\n    this.priorities = new Map();\n\n    // 使用自定义比较器处理堆元素，考虑元素的优先级\n\
    \    // 而不是元素值。\n    this.compare = new Comparator(this.comparePriority.bind(this));\n\
    \  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `comparePriority()`\n\
    \n此函数根据它们的优先级比较两个元素。为此，它从 `this.priorities` 映射中获取元素 `a` 和 `b` 的优先级。如果两个优先级都相等，则返回\
    \ `0`；如果 `a` 比 `b` 不重要，则返回 `-1`（元素顺序不正确），否则返回 `1`（元素顺序正确）。\n\n```javascript\n\
    \  /**\n   * 比较两个元素的优先级。\n   * @param {*} a\n   * @param {*} b\n   * @return {number}\n\
    \   */\n  comparePriority(a, b) {\n    if (this.priorities.get(a) === this.priorities.get(b))\
    \ {\n      return 0;\n    }\n    return this.priorities.get(a) < this.priorities.get(b)\
    \ ? -1 : 1;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\n#### `compareValue()`\n\
    \n此方法与 `comparePriority()` 相同，但它比较的是值而不是优先级。\n\n```javascript\n  /**\n   * 比较值。\n\
    \   * @param {*} a\n   * @param {*} b\n   */\n  compareValue(a, b) {\n    if (a\
    \ === b) {\n      return 0;\n    }\n    return a < b ? -1 : 1;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `add()`\n\n此方法根据它们的优先级将元素添加到优先级队列中。它首先将优先级值设置为 `this.priorities`，然后调用 `super.add()`。\n\
    \n```javascript\n  /**\n   * 将元素添加到优先级队列。\n   * @param {*} item - 要添加的元素。\n  \
    \ * @param {number} priority - 优先级。\n   */\n  add(item, priority = 0) {\n    this.priorities.set(item,\
    \ priority);\n    super.add();\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `remove()`\n\n此方法从优先级队列中移除元素。它接受两个参数：要移除的 `item` 以及可选的 `customFindingComparator`（允许自定义在堆中搜索元素）。\n\
    \n```javascript\n  /**\n   * 从优先级队列中移除元素。\n   * @param {*} item - 要移除的元素。\n  \
    \ * @param {Function} customFindingComparator - 自定义回调。\n   */\n  remove(item,\
    \ customFindingComparator) {\n    super.remove(item, customFindingComparator);\n\
    \    this.priorities.delete(item);\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n#### `changePriority()`\n\n此方法更改队列元素的优先级。由于每次更改优先级都需要重新构建堆以便元素处于正确的位置，我们先从堆中移除元素，然后使用更新后的优先级将其添加。我们可以在不移除元素的情况下重建堆，但为了简单起见，我们保持这种做法。\n\
    \n```javascript\n  /**\n   * 队列中元素的优先级。\n   * @param {*} item - 要重新调级的元素。\n  \
    \ * @param {number} priority - 新的优先级。\n   * @return {PriorityQueue}\n   */\n \
    \ changePriority(item, priority) {\n    this.remove(item, new Comparator(this.compareValue));\n\
    \    this.add(item, priority);\n    return this;\n  }\n```\n\n`07-priority-queue/PriorityQueue.js`\n\
    \n### Complexities\n\n由于 `PriorityQueue` 基于 `MinHeap` 类，且其主要方法只是通过修改比较函数来封装 `MinHeap`\
    \ 类的主要方法，因此我们可以假设 `PriorityQueue` 类的时间复杂度与 `MinHeap` 类相同。此外注意，对 `this.priorities`\
    \ 映射的所有操作都在 `O(1)` 时间内完成。\n\n| Peek | Poll | Add | Remove |\n| --- | --- | ---\
    \ | --- |\n| O(1) | O(log(n)) | O(log(n)) | O(log(n)) |\n\n"
- fmt: "\nPriority Queue on Wikipedia [https://en.wikipedia.org/wiki/Priority_queue](https://en.wikipedia.org/wiki/Priority_queue)\n\
    \nPriority Queue on YouTube [https://www.youtube.com/watch?v=wptevk0bshY](https://www.youtube.com/watch?v=wptevk0bshY)\n\
    \nPriority Queue example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/priority-queue](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/priority-queue)\n\
    \n## Graphs\n\n- *Difficulty: easy*\n\nA `Graph` is a collection of vertices and\
    \ edges that connect all or some of those vertices together.\n\nA `Graph` may\
    \ be `directed` or `undirected`. In a `directed` graph each edge has a direction\
    \ (like a one-way street). You may access an end-node from a start-node but not\
    \ the other way around. In `undirected` graphs the edges don’t have a specific\
    \ direction (like a two-way street) and thus every two vertices that are connected\
    \ together have access to each other.\n\n### What is a vertex?\n\n> A vertex is\
    \ a basic unit used in graphs to represent data. The terms “node” and “vertex”\
    \ are used interchangeably to describe how data is represented in graphs. Vertices\
    \ (the plural form of vertex) are connected by edges.\n\nAnother way of illustrating\
    \ the difference between directed and undirected graphs is to think about social\
    \ networks. If each vertex is a “user”, then in a directed graph each edge would\
    \ be a “follow” relationship – you may follow someone but the doesn’t mean the\
    \ other person follows you back. Whereas in an undirected graph the edge would\
    \ be like a “friend” relationship – if someone is in your friend list then it\
    \ automatically means that you’re in that person’s friend list too.\n\n![](images/08-graph----graph.png)\n\
    \nIn the example above we have three different graphs that all have vertices and\
    \ edges. All of the graphs have a set of vertices `{A, B, C, D}` and all of the\
    \ graphs have a set of edges. The undirected graph has a set of vertices: `{AB,\
    \ BC, AC, CD}`. The directed graph also has a set of vertices: `{AB, BC, CB, AC,\
    \ CD}`. Notice that for directed graph to connect vertices `B` and `C` together\
    \ in both directions there are two edges `BC` and `CB` in the set.\n\nIf two vertices\
    \ are connected to each other by one edge, we call these vertices `adjacent` or\
    \ `neighbors`. In the undirected graph above, for example, the vertices `A` and\
    \ `B` are neighbors as well as the vertices `A` and `C`. But the vertices `B`\
    \ and `D` are not neighbors since these vertices are connected via more than one\
    \ edge (`B` is connected to `C` which is connected to `D`).\n\nThe sequence of\
    \ edges between two vertices is called a `path`. In the directed graph above there\
    \ is no path from `D` to `A` but there is a path from `A` and `D` and the path\
    \ is the set of edges: `{AC, CD}`.\n\nAll vertices in a graph do not need to be\
    \ connected. When there are vertices that are `unreachable` we call this type\
    \ of graph a `disconnected graph`. If every pair of vertices in a graph has an\
    \ edge, it is called a `connected graph`.\n\nGraphs can also have cycles. If a\
    \ graph doesn’t have cycles it is called `acyclic graph`.\n\nA `weighted graph`\
    \ is a graph where each edge has a weight associated with it. Depending on the\
    \ context, the edge weight may represent different concepts like “distance”, “traffic”,\
    \ “cost”, “resistance” and so on.\n\n### Application\n\n- **Maps** applications\
    \ use graphs to compute shortest paths between vertices (addresses, cities, locations).\n\
    - **Social networks** use graphs for friends suggestion algorithms.\n- **Package\
    \ managers** use graphs to calculate correct order of installing packages based\
    \ on their dependencies.\n- **Search engines** use graphs to analyze page relevance.\
    \ In graphs used by search engines, the web-page is a vertex and the link from\
    \ this web-page to another is directed edge.\n- **Network providers** use graphs\
    \ to analyze network traffic and security. In this case each vertex has an `IP`\
    \ address and every edge represent the network packets that flow between different\
    \ `IP` addresses.\n\n### Graph Representation\n\nGraphs are normally being represented\
    \ as `adjacency lists` or `adjacency matrices`. Let’s take the graphs from the\
    \ beginning of this chapter as an example.\n\n![](images/08-graph----graph.png)\n\
    \n#### Adjacency Matrix\n\nThe graph with `n` vertices may also be represented\
    \ as an adjacency matrix of size `n — n` of binary values (`0` or `1`). In such\
    \ matrix the value `1` at position `(i, j)` means that there is an edge between\
    \ vertices `i` and `j`. Otherwise if the value is `0` there is no edge between\
    \ those vertices.\n\n**Undirected graph adjacency matrix example**\n\nFor undirected\
    \ graphs the adjacency matrix will be symmetrical.\n\n| | A | B | C | D |\n| ---\
    \ | --- | --- | --- | --- |\n| **A** | 0 | 1 | 1 | 0 |\n| **B** | 1 | 0 | 1 |\
    \ 0 |\n| **C** | 1 | 1 | 0 | 1 |\n| **D** | 0 | 0 | 1 | 0 |\n\n**Directed graph\
    \ adjacency matrix example**\n\nFor directed graph the adjacency matrix may not\
    \ be symmetrical.\n\n| | A | B | C | D |\n| --- | --- | --- | --- | --- |\n| **A**\
    \ | 0 | 1 | 1 | 0 |\n| **B** | 0 | 0 | 1 | 0 |\n| **C** | 0 | 1 | 0 | 1 |\n| **D**\
    \ | 0 | 0 | 0 | 0 |\n\n**Weighted graph adjacency matrix example**\n\nIn case\
    \ of the weighted graphs the weights of the edges may be used instead of boolean.\n\
    \n| | A | B | C | D |\n| --- | --- | --- | --- | --- |\n| **A** | 0 | 5 | 3 |\
    \ 0 |\n| **B** | 0 | 0 | 4 | 0 |\n| **C** | 0 | 2 | 0 | 6 |\n| **D** | 0 | 0 |\
    \ 0 | 0 |\n\n#### Adjacency List\n\nA popular way to represent a graph is to have\
    \ `Node` (or `Vertex`) stored as an object which contains a list of all `Nodes`.\n\
    \n![](images/08-graph----graph.png)\n\nSometimes, instead of the list of `Nodes`\
    \ the list of `Edge` entities may be used. The `Edge` entity stores `startNode`,\
    \ `endNode` and `weight`. This approach may be more convenient when we need to\
    \ store some meta-data like `weight`.\n\n```javascript\nclass Node {\n  constructor()\
    \ {\n    /** @type {Edge[]} */\n    this.edges = [];\n  }\n}\n\nclass Edge {\n\
    \  constructor() {\n    /** @type {Node} */\n    this.startVertex = null;\n  \
    \  /** @type {Node} */\n    this.endVertex = null;\n    this.weight = null;\n\
    \  }\n}\n\nclass Graph {\n  constructor() {\n    /** @type {Node[]} */\n    this.nodes\
    \ = [];\n  }\n}\n```\n\nWe also need to have a separate `Graph` class here to\
    \ support graphs which are not connected (they contain outstanding nodes). In\
    \ this chapter we will implement graphs using adjacency list approach.\n\n####\
    \ Adjacency Matrix and Adjacency List Comparison\n\nGraph related algorithms may\
    \ be implemented using adjacency matrix or adjacency list interchangeably. The\
    \ difference is that for some algorithms one way of implementing the graphs may\
    \ be more efficient than other depending on the operations that are going to be\
    \ performed on the graph.\n\nThe main issue with adjacency matrices is their space\
    \ complexity of `O(n^2)`. For sparse graphs a lot of matrix space will be wasted\
    \ (filled with `0`). In case of adjacency list the space complexity will be proportional\
    \ to the number of vertices and edges.\n\nIn an adjacency list we can iterate\
    \ over the neighbors of the vertex. In an adjacency matrix we need to iterate\
    \ over all the vertices in the graph to get all the neighbors of the vertex. Adjacency\
    \ matrices have fast lookups to check for presence or absence of a specific edge.\n\
    \n### Basic Operations\n\nThe most common and basic graph operations are:\n\n\
    - Add/delete vertex to the graph.\n- Add/delete edge (connection) between two\
    \ vertices.\n- Get all neighbors of the vertex.\n- Check if two vertices are connected.\n\
    - Find a vertex by its value.\n\n### Usage Example\n"
