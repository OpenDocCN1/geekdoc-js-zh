  trans: "\n\n对于栈来说，`searching`或`updating`元素等操作并不典型。我们只对操作栈顶端感兴趣。\n\n### 应用\n\n`Stack`\
    \ 数据结构用于解决许多算法任务，例如：\n\n*   图的拓扑排序\n*   寻找图中的强连通分量\n*   汉诺塔问题\n*   记住部分完成的任务\n\
    *   撤销（从操作中回溯）\n*   以及更多其他任务。\n\n在递归算法中，栈通常非常有用，因为你需要在递归时将临时数据推入栈中，然后在回溯时将其移除。栈为这种操作提供了一种直观的方法。\n\
    \n低级编程语言也使用栈数据结构在从一个函数调用另一个函数从内存中存储函数参数和局部变量。你可能通过臭名昭彰的“Stack Overflow”（栈溢出错误知道这一点。该错误与栈的使用有关，可能是由过深或无限递归引起的，在这种情况下，函数自调次数过多，导致存储变量和与每次调用相关信息的空间超过了栈的承受范围。\n\
    \n### 使用示例\n\n在我们继续实现 `Stack` 类之前，让我们假设我们已经实现了一个类，并尝试使用上面提到的基本方法。这将帮助我们更好地理解将要实现的内容。假设我们想用栈来反转数组：\n\
    \n```\n 1 // 导入 Stack 类。\n 2 import { Stack } from './Stack';\n 3 \n 4 // 创建栈实例。\n\
    \ 5 const stack = new Stack();\n 6 \n 7 // 创建我们想要反转的数组。\n 8 const arrayToReverse\
    \ = ['a', 'b', 'c'];\n 9\n10 stack.isEmpty(); // => true\n11 stack.toString();\
    \ // => ''\n12 stack.toArray(); // => []\n13 \n14 // 向栈添加项。\n15 stack.push(arrayToReverse[0]);\n\
    16 stack.isEmpty(); // => false\n17 stack.toString(); // => 'a'\n18 stack.toArray();\
    \ // => ['a']\n19 \n20 // 向栈添加更多项。\n21 stack.push(arrayToReverse[1]);\n22 stack.push(arrayToReverse[2]);\n\
    23 stack.toString(); // => 'c,b,a'\n24 stack.toArray(); // => ['c', 'b', 'a']\n\
    25 \n26 // 检查下一步操作。\n27 stack.peek(); // => 'c'\n28 \n29 // 从栈中弹出。\n30 stack.pop();\
    \ // => 'c'\n31 stack.pop(); // => 'b'\n32 stack.pop(); // => 'a'\n33 \n34 stack.isEmpty();\
    \ // => true\n```\n\n### 实现\n\n栈可以用链表实现。我们可以使用 `LinkedList` 类中的 `append` 和 `deleteTail`\
    \ 操作来实现栈的 `push` 和 `pop` 操作。其思路是：当你想要向栈 `push` 一个项时，将该项 `append` 到链表末尾；当你想要从栈中\
    \ `pop` 一个项时，`delete` 链表的尾部。由于我们要基于链表构建栈，让我们先开始导入它：\n\n```javascript\nimport LinkedList\
    \ from '../02-linked-list/LinkedList';\n```\n\n#### constructor\n\n让我们创建 `Stack`\
    \ 类：\n\n```javascript\nexport class Stack {\n  constructor() {\n    // 我们将基于链表结构实现\n\
    \    // 非常相似结构。比较 Stack 的 push/pop 操作\n    // 与 LinkedList 的 prepend/deleteHead\
    \ 操作。\n    this.linkedList = new LinkedList();\n  }\n}\n```\n\n#### push\n\n如果我们想向栈中推入某些东西，我们需要将数据\
    \ `append` 到链表的末尾。在这种情况下，栈顶就是链表的尾部：\n\n```javascript\n/**\n * @param {*} value\n\
    \ */\npush(value) {\n  // Pushing 意味着将值放在栈的顶部。因此，让我们在\n  // 链表的头部添加新值。\n  this.linkedList.prepend(value);\n\
    }\n```\n\n#### pop\n\n如果我们想从栈中弹出元素，我们需要 `delete` 链表尾部并返回它：\n\n```javascript\n\
    /**\n * @return {*}\n */\npop() {\n  // 让我们尝试删除链表中的第一个节点（头部）。\n  // 如果链表中没有头部（它为空），则直接返回\
    \ null。\n  const removedHead = this.linkedList.deleteHead();\n  return removedHead\
    \ ? removedHead.value : null;\n}\n```\n\n#### peek\n\n另一个常见的栈操作是检查栈顶是什么，而无需实际提取数据。在这种情况下，我们只需要读取链表的尾部：\n\
    \n```javascript\n/**\n * @return {*}\n */\npeek() {\n  if (this.isEmpty()) {\n\
    \    // 如果链表为空，则没有可以 peek 的内容。\n    return null;\n  }\n  // 仅从链表的头部读取值而不删除它。\n\
    \  return this.linkedList.head.value;\n}\n```\n\n到此，我们已经完成了强制性的栈操作。现在，让我们继续实现一些辅助方法，这将使\
    \ `Stack` 类的使用更加方便。\n\n#### isEmpty\n\n实现 `isEmpty()` 方法来检查栈是否为空。要实现这一点，我们只需要检查链表是否有头部：\n\
    \n```javascript\n/**\n * @return {boolean}\n */\nisEmpty() {\n  // 如果链表没有头部，则栈为空。\n\
    \  return !this.linkedList.head;\n}\n```\n\n#### toArray\n\n另一个有用方法是 `toArray()`，将我们的栈转换为数组。要实现这一点，我们需要：\n\
    1. 将链表转换为数组，\n2. 提取每个链表节点的值，因为我们不希望 `Stack` 类的使用者去处理链表节点。通过这样做，我们封装了类的实现，\n3.\
    \ 反转链表数组，以便链表的尾部成为数组的第一个元素，头部成为数组的最后一个元素。这不是强制性的，但是为了方便起而做的。\n\n代码如下：\n\n```javascript\n\
    /**\n * @return {[]}\n */\ntoArray() {\n  return this.linkedList\n    .toArray()\n\
    \    .map(linkedListNode => linkedListNode.value);\n}\n```\n\n#### toString\n\n\
    最后一个实现的方法是 `toString()`，它基于 `toArray()` 并将栈转换为字符串表示：\n\n```javascript\n/**\n *\
    \ @param {function} [callback]\n * @return {string}\n */\ntoString(callback) {\n\
    \  return this.linkedList.toString(callback);\n}\n```\n\n最后一个大括号是 `Stack` 类的结束括号。到此时，我们\
    \ `Stack` 类的基础实现已经就绪。你可以在 `code/src/04-stack/Stack.js` 文件中找到完整的类代码示例。\n\n"
- fmt: "\nStack on Wikipedia <a href=”https://en.wikipedia.org/wiki/Stack*(abstract_data_type)”>https://en.wikipedia.org/wiki/Stack*(abstract_data_type)</a>\n\
    \nStack on YouTube [https://www.youtube.com/watch?v=wjI1WNcIntg](https://www.youtube.com/watch?v=wjI1WNcIntg)\n\
    \nStack example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/stack)\n\
    \n## Hash Table\n\nDifficulty: medium\n\nA `hash table` (or `hash map`) is a data\
    \ structure that implements an `associative array abstract data type`, a structure\
    \ that can `map keys to values`. For example, your `name` (the key) may be used\
    \ as a unique identifier for your `phone number` (the value) in a `phone book`\
    \ (the hash map). The `common operations` for working with your phone in a phone\
    \ book would look like this:\n\n```\n 1 // Import HashTable class.\n 2 import\
    \ { HashTable } from './HashTable';\n 3 \n 4 // Create hash table instance.\n\
    \ 5 const phoneBook = new HashTable();\n 6 \n 7 // Add several contacts to the\
    \ phone book.\n 8 phoneBook.set('John Smith', '+112342345678');\n 9 phoneBook.set('Bill\
    \ Jones', '+111111111111');\n10 \n11 // Now we may access each contact's phone\
    \ in O(1) time.\n12 phoneBook.get('John Smith'); // => '+112342345678'\n13 phoneBook.get('Bill\
    \ Jones'); // => '+111111111111'\n14 \n15 // Delete phone number.\n16 phoneBook.delete('John\
    \ Smith');\n17 phoneBook.get('John Smith'); // => undefined\n```\n\n`src/05-hash-table/HashTable.js`\n\
    \nIdeally, hash tables allow us to do all of these operations in `O(1)` time.\
    \ Compare that with a `Linked List` which requires us to go through `all` the\
    \ nodes in the list to fetch John Smith’s phone number, with an `O(n)` lookup\
    \ time.\n\nThe highly efficient lookup is the main advantage of hash tables.\n\
    \nIn the worst case scenario though it is possible for hash tables to have `O(n)`\
    \ lookup time. We’ll get to this scenario later in the chapter.\n\nSo, how do\
    \ we achieve a fast `O(1)` lookup in a hash table? We allocate an array of `buckets`\
    \ or `slots` that will hold all the hash table data. Then we need to map the key\
    \ of the value to a specific number (index or address) of the bucket where the\
    \ value will be stored. By doing that we will be able to create, read and delete\
    \ records in the hash table by simply accessing it using the bucket address in\
    \ `O(1)` time.\n\nThere are certain limitations in building a hash table. The\
    \ number of buckets will have a `fixed size`. This is because any program has\
    \ certain memory limitations and we can’t assume we have an unlimited amount of\
    \ memory for our hash table.\n\nThe key that we’re going to map to a bucket address\
    \ may be of arbitrary size (i.e. `John Smith` or just `Jimmy`). How do we map\
    \ a key of arbitrary size to a number (index or address) when the number of buckets\
    \ is limited? The hint is already hidden in the “Hash Table” data structure name!\
    \ And it is by using a `hash function`.\n\n### Hash Function\n\nA `hash function`\
    \ is a function that can be used to map data of `arbitrary size` to data of a\
    \ `fixed size`. The values returned by a hash function are called `hash values`,\
    \ `hash codes`, `digests`, or simply `hashes`.\n\nIn our case, our hash function\
    \ must accept the key (i.e. `John Smith`) as an input and output the index of\
    \ a bucket in a given range (i.e. from `0` to `5` if we allocate an array of size\
    \ `5` for the buckets). In the real world, the number of buckets is much bigger.\
    \ It should be proportional to the amount of information we’re going to store\
    \ in our hash table.\n\nThe hash function consists of two parts:\n\n1. Convert\
    \ the string to a hash code – ideally to a unique numeric representation of the\
    \ key.\n2. Map the hash code to a specific bucket cell using the modulo operator\
    \ (since we have a limited bucket size).\n\n![](images/05-hash-table----hash-function.png)\n\
    \n#### Hash function example\n\nThere are a number of ways to hash a string into\
    \ an index or address. One of the simplest ways to calculate the hash of a string\
    \ is to sum up the ASCII codes of all the characters in a string.\n\n> What is\
    \ an ASCII code?\n\nASCII stands for American Standard Code for Information Interchange\
    \ and it is a code that represents characters in English as numbers. Computers\
    \ only understand 1s and 0s and this code translates the letters we type into\
    \ a number that the computer can understand.\n\nLet’s create a JavaScript function\
    \ called `hash` that takes the key and number of buckets as parameters.\n\n```\n\
    13 export function hash(key, bucketsNumber) {\n```\n\n`05-hash-table/hash.js`\n\
    \nWe’ll loop over each character in our string and use the JavaScript `charCodeAt`\
    \ method to get the ASCII value. We sum up the codes to get the `hashCode`.\n\n\
    ```\n14   let hashCode = 0;\n15   for (let characterIndex = 0; characterIndex\
    \ < key.length; characterIndex++) {\n16     hashCode += key.charCodeAt(characterIndex);\n\
    17   }\n18 \n19   // Reduce hash number so it fit buckets size.\n20   return hashCode\
    \ % bucketsNumber;\n21 }\n```\n\n### Collision Resolution\n\nIdeally, the hash\
    \ function will assign each key to a unique bucket, but most hash table designs\
    \ employ an imperfect hash function, which might cause hash collisions where the\
    \ hash function generates the same index for more one key.\n\nSeparate chaining\
    \ is a technique where we convert each bucket to a linked list. Then each bucket\
    \ will be able to store many values instead of just one. If a collision happens\
    \ we’ll attach new value to the tail of bucket’s linked list.\n\n![](images/05-hash-table----collisions.png)\n\
    \nThe `read` operation will calculate the bucket number first and then do a lookup\
    \ in the bucket’s linked list by key. Here are the required steps to fetch Billy\
    \ Black’s phone number from the example above using a linked list for our bucket:\n\
    \n1. Calculate hash code for the `Billy Black` key. Let’s assume that hash code\
    \ for the `Billy Black` key is `11`.\n2. Calculate the bucket index by doing a\
    \ modulo operation. With `5` buckets available we’ll get bucket index equal to\
    \ `11 % 5 = 1`.\n3. Fetch the linked list from the cell with index `1` and go\
    \ through each of its values comparing each value key with the key we need (in\
    \ our case is `Billy Black`). Once we’ve found the linked list node with `Billy\
    \ Black` key we just return it.\n"
