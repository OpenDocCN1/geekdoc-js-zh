    \ is also met. So there are two more common heap operations: **heapify up** and\
    \ **heapify down**. These operations are internal and are not used directly. The\
    \ only purpose of these two operations is to preserve the heap property after\
    \ heap modifications.\n\n### Usage Example\n\nBefore we move on to the actual\
    \ implementation let’s imagine we already have a `MinHeap` class implemented and\
    \ let’s use it. This will help us to better understand the meaning of each class\
    \ method that we’re going to implement.\n\n```\n 1 // Import MinHeap class.\n\
    \ 2 import { MinHeap } from './MinHeap';\n 3 \n 4 // Create min-heap instance.\n\
    \ 5 const minHeap = new MinHeap();\n 6 \n 7 minHeap.isEmpty(); // => true\n 8\
    \ \n 9 // Add new element to min-heap.\n10 minHeap.add(5);\n11 minHeap.isEmpty();\
    \ // => false\n12 minHeap.peek(); // => 3\n13 minHeap.toString(); // => '5'\n\
    14 \n15 // Add more elements.\n16 minHeap.add(3);\n17 // Peek operation will always\
    \ return the minimum element of the heap.\n18 minHeap.peek(); // => 3\n19 minHeap.toString();\
    \ // => '3,5'\n20 \n21 minHeap.add(10);\n22 minHeap.peek(); // => 3\n23 minHeap.toString();\
    \ // => '3,5,10'\n24 \n25 // Extract the minimum value out of a heap.\n26 minHeap.poll();\
    \ // => 3\n27 minHeap.peek(); // => 5\n28 minHeap.toString(); // => '5,10'\n29\
    \ \n30 // Remove element from a heap.\n31 minHeap.remove(10);\n32 minHeap.peek();\
    \ // => 5\n33 minHeap.toString(); // => '5'\n```\n\n07-heap/example.js\n\n###\
    \ Implementation\n\n#### Storing Heap as Array\n\nWe will construct a heap as\
    \ a *complete binary tree*. This means that it is a binary tree where every level,\
    \ except possibly the last one, is completely filled, and all nodes are as far\
