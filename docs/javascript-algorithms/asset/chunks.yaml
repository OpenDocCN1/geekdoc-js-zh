    \ 算法示例和测试用例 `https://github.com/trekhleb/javascript-algorithms/tree/master/src/graph`\n\
    \n## 附录 A：测试答案\n\n**算法及其复杂度**\n\n*   Q1: 不是，时间复杂度显示函数时间与函数输入的速率（比例）。\n*   Q2:\
    \ `O(log(n))` 更快。例如 `O(1000) = 1000`，但 `O(log(1000)) = 9`。\n*   Q3: 不，这不是真的。有时这是一种权衡，你通过消耗更多内存来让算法运行更快。\n\
    \n**链表**\n\n*   Q1: 它是链表中下一个对象的引用。\n*   Q2: `deleteTail` 移除链表中的最后一个项，`deleteHead`\
    \ 移除第一个。\n\n**队列**\n\n*   Q1: 队列是先进先出的。\n*   Q2: 队列的基本操作是 `peek()`、`enqueue()`\
    \ 和 `dequeue()`。\n*   Q3: 时间复杂度是 `O(1)`。\n\n**栈**\n\n*   Q1: 栈是后进先出的。\n*   Q2:\
