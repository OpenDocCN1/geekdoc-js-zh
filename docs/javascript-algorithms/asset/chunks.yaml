    \n## 二叉搜索树 (BST)\n\n* *难度：中等*\n\n在我们深入学习二叉搜索树主题之前，首先需要理解什么是`tree`（树）和二叉树数据结构。\n\
    \n### 树\n\n`树数据结构`被定义为节点的集合（从`根节点`开始），其中每个节点都是由一个值和一个指向节点的引用列表（“子节点”）组成的数据结构，限制条件是没有重复引用，且没有引用指向根节点。这些引用通常被称为`边`。\n\
    \n#### 什么是节点？\n\n> 节点是计算机科学中使用的基本单元。节点是更大数据结构（如链表和树数据结构）的组成部分。节点包含数据，并可能链接到其他节点。节点之间的链接通常通过指针实现。-[Wikipedia](https://en.wikipedia.org/wiki/Node_(computer_science))\n\
    \n树数据结构中的每个节点（根节点除外）都通过一条边与另一个另一个节点连接。所有节点形成`parent -> child`（父子）关系，树中没有循环。\n\n\
    这里是一个树的示例：\n\n![](img/06-binary-search-tree----tree.png)\n\n在这个示例中，树由一组`nodes`\
    \ {\"a”, “b”, “c”, …, “i”}和一组`edges` {\"ab”, “ac”, “bd”, …, “fi”}组成，在节点之间形成父子关系。节点“a”是树的`root`，它没有父节点但有两个`child`节点——“b”和“c”。示例中的节点“f”有一个`parent`“c”和三个子节点“g”、“h”和“i”。没有节点的节点被称为`leaf\
    \ nodes`（叶子节点）。在示例中，节点“d”、“e”、“g”、“h”、“i”是叶子。\n\n树的`size`（大小）是它包含的节点数量。在上面的示例中，树的大小为\
    \ 9。\n\n节点的`height`（高度）是从它到最远叶节点的最长路径（边的数量）。根节点的高度就是`height of tree`。在上面的示例中，节点“c”的高度为\
