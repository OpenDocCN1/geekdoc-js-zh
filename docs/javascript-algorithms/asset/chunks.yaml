    \ has key `Home` and we don’t need to do anything to get there since we’re already\
    \ there.\n\nBut `distances` map will not give us an understanding of what the\
    \ shortest path to the `Office` is. We know that it will take us `10` distance\
    \ units (let’s say miles) to get there but we don’t know which path to take. Therefore\
    \ we need our `dijkstra()` function to also return us another object that we call\
