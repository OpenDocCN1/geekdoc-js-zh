    \ 对象。\n\n```javascript\nprepend(value) {\n  // 创建一个新节点作为头部。\n  const newNode =\
    \ new LinkedListNode(value, this.head);\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n然后我们将 `this.head` 指向我们新创建的 `LinkedListNode` 对象。如果这是我们 `LinkedList` 中的第一个项，我们还必须将\
    \ `this.tail` 指向该新对象，因为它也是我们 `LinkedList` 中的最后一个项。\n\n```javascript\nthis.head\
    \ = newNode;\n\n// 如果还没有尾节点，让新节点成为尾节点。\nif (!this.tail) {\n  this.tail = newNode;\n\
    }\n```\n\n`02-linked-list/LinkedList.js`\n\n最后，我们返回添加到我们的 `LinkedList` 中的值。\n\n\
    ```javascript\nreturn this;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\n### `append`\n\
    \n`append` 方法将一个 `LinkedListNode` 对象添加到我们的 `LinkedList` 的末尾。首先，我们创建一个新的 `LinkedListNode`\
    \ 对象。\n\n```javascript\nappend(value) {\n  const newNode = new LinkedListNode(value);\n\
    ```\n\n`02-linked-list/LinkedList.js`\n\n如果我们的 `LinkedList` 中没有其他项，那么我们需要将 `this.head`\
    \ 指向我们的新节点。\n\n```javascript\n// 如果还没有头部，让新节点成为头部。\nif (!this.head) {\n  this.head\
    \ = newNode;\n  this.tail = newNode;\n\n  return this;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n然后，我们获取 `this.tail` 的值，并将该对象的 `next` 属性设置为我们新创建的 `LinkedListNode` 对象。\n\n```javascript\n\
    const currentTail = this.tail;\ncurrentTail.next = newNode;\n// 将新节点附加到链表的末尾。\n\
    ```\n\n`02-linked-list/LinkedList.js`\n\n最后，我们将 `this.tail` 设置为新的 `LinkedListNode`\
    \ 对象。\n\n```javascript\nthis.tail = newNode;\n\nreturn this;\n}\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n### `delete`\n\n我们的 `delete` 方法在 `LinkedList` 中找到一个项并将其。首先，我们通过检查 `this.head`\
    \ 是否为 `null` 来检查我们的 `LinkedList` 是否为空。如果是，我们返回 `null`。\n\n```javascript\ndelete(value)\
    \ {\n  if (!this.head) {\n    return null;\n  }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n如果我们的 `LinkedList` 包含项，我们会创建一个 `deletedNode` 变量，它将作为占位符，用于最终作为 `delete` 方法的结果返回节点。\n\
    \n```javascript\nlet deletedNode = null;\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n在遍历 `LinkedList` 之前，我们首先检查 `this.head` 的值是否与我们要删除的值匹配。如果是，我们将 `deletedNode`\
    \ 变量设置为 `this.head`，然后将 `this.head` 移动到 `LinkedList` 中的下一个项。\n\n```javascript\n\
    // 如果必须删除头部，则让与头部不同的\n// 下一个节点成为新的头部。\nwhile (this.head && this.head.value ===\
    \ value) {\n  deletedNode = this.head;\n  this.head = this.head.next;\n}\n```\n\
    \n`02-linked-list/LinkedList.js`\n\n为了遍历 `LinkedList`，我们需要创建一个占位符变量 `currentNode`\
    \ 来跟踪我们在 `LinkedList` 中的位置。我们将 `currentNode` 的值设置为 `this.head` 以确保我们从开始开始。\n\n\
    ```javascript\nlet currentNode = this.head;\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n然后我们检查 `currentNode` 不为 `null`。如果不是，我们就启动循环。当我们到达一个 `next` 为 `null` 的节点时，我们将跳出循环。\n\
    \n```javascript\nif ( null)\nwhile (currentNode.next) {\n  if (currentNode.next.value\
    \ === value) {\n    deletedNode = currentNode.next;\n    this.tail = currentNode;\n\
    \    currentNode.next = null;\n    return deletedNode;\n  } else {\n    currentNode\
    \ = currentNode.next;\n  }\n}\n```\n\n`02-linked-list/LinkedList.js`\n\n### `deleteTail`\n\
    \n对于我们的 `deleteTail` 方法，我们首先创建一个变量 `deletedTail` 并设置为 `this.tail`，以便在从方法返回时可以返回被删除的对象。\n\
    \n```javascript\ndeleteTail() {\n  const deletedTail = this.tail;\n```\n\n`02-linked-list/LinkedList.js`\n\
    \n我们有两种情况需要编写代码：\n\n1. 我们的 `LinkedList` 中只有一个项\n2.  `LinkedList` 中有多个项\n\n对于情况\
    \ 1，`this.head.value` 和 `this.tail.value` 相同，因此我们将 `this.head` 和 `this.tail` 都设置为\
    \ `null` 并返回 `deletedTail`。\n\n```javascript\nif (this.head === this.tail) {\n\
    \  // 链表中只有一个节点。\n  this.head = null;\n  this.tail = null;\n  return deletedTail;\n\
    }\n```\n\n`02-linked-list/LinkedList.js`\n\n对于情况 2，我们需要遍历整个列表以获取倒数第二个 `LinkedListNode`。我们将通过检查\
    \ `currentNode.next.next` 值是否为 `null`，将倒数第二个 `LinkedListNode` 设置为 `this.tail`。如果\
    \ `currentNode.next.next` 为 `null`，我们就知道 `currentNode.next` 是我们要设置为 `this.tail`\
    \ 的对象。\n\n```javascript\n  // 如果链表中有很多节点...\n  // 回到最后一个节点，并删除倒数节点前一个节点的 \"next\"\
    \ 链接\n  let currentNode = this.head;\n  while (currentNode.next) {\n    if (!currentNode.next.next)\
    \ {\n      currentNode.next = null;\n    } else {\n      currentNode = currentNode.next;\n\
    \    }\n  }\n\n  this.tail = currentNode;\n\n  return deletedTail;\n}\n```\n\n\
    `02-linked-list/LinkedList.js`\n\n### `deleteHead`\n\n我们的 `deleteHead` 方法删除列表中的第一个项。与我们的\
    \ `deleteTail` 方法类似，我们有几种情况需要编写代码来删除 `LinkedList` 的头部：\n\n1. 列表中没有项\n2. 列表中只有\
    \ 1 个项\n3. 列表中有多个项\n\n"
- fmt: "\nFor scenario 1, we check if `this.head` is `null`, if it is null we return\
    \ `null` from the method.\n\n```\n125   deleteHead() {\n126     if (!this.head)\
    \ {\n127       return null;\n128     }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nFor scenarios 2 and 3, we must first create a variable: `deletedHead` and set\
    \ it to `this.head` so we can return the object that is deleted when we return\
    \ from this method.\n\n```\n130     const deletedHead = this.head;\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nAlso for scenarios 2 and 3, we combine the logic into an if/else statement.\
    \ If `this.head.next` is not `null`, we know there is more than 1 item in the\
    \ list and we set `this.head.next` to equal `this.head` which removes the first\
    \ item in the list. If `this.head.next` is `null`, then we know there is only\
    \ 1 item in the list and we set both `this.head` and `this.tail` to `null` as\
    \ there are no more items in our `LinkedList`.\n\n```\n131     if (this.head.next)\
    \ {\n132       this.head = this.head.next;\n133     } else {\n134       this.head\
    \ = null;\n135       this.tail = null;\n136     }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nFinally, we return our `deletedHead` object from the method:\n\n```\n139   \
    \  return deletedHead;\n140   }\n```\n\n`02-linked-list/LinkedList.js`\n\n###\
    \ `find`\n\nThe `find` method traverses the items in the `LinkedList` and locates\
    \ the first `LinkedListNode` object that matches the value we want. The method\
    \ takes an object that has two key/value pairs, a `value` and a `callback`:\n\n\
    ```\n148   find({ value = undefined, callback = undefined }) {\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nAs in our previous methods, we first check if `this.head` is `null`. If it is\
    \ null, we return from the method because the `LinkedList` is empty.\n\n```\n\
    149     if (!this.head) {\n150       return null;\n151     }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nNext, we create a variable `currentNode` to keep track of where we are in the\
    \ `LinkedList` and set it to `this.head` to start at the beginning of the `LinkedList`.\n\
    \n```\n152 \n```\n\n`02-linked-list/LinkedList.js`\n\nThen we create a while loop\
    \ to loop over all the nodes in the `LinkedList` and either call the `callback`\
    \ function sent as a parameter or check the value of the current node to see if\
    \ it matches the value we are looking for. If there is a match, we return the\
    \ node.\n\n```\n155     while (currentNode) {\n156       // If callback is specified\
    \ then try to find node by callback.\n157       if (callback && callback(currentNode.value))\
    \ {\n158         return currentNode;\n159       }\n160 \n161       // If value\
    \ is specified then try to compare by value..\n162       if (value !== undefined\
    \ && currentNode.value === value) {\n163         return currentNode;\n164    \
    \   }\n165 \n166       currentNode = currentNode.next;\n167     }\n```\n\n`02-linked-list/LinkedList.js`\n\
    \nFinally, if we go through the entire `LinkedList` and do not find the value\
    \ we are looking for, we return `null` from our method.\n\n```\n169     return\
    \ null;\n```\n\n`02-linked-list/LinkedList.js`\n\nAt this point, we’ve implemented\
    \ the essential `LinkedList` methods. We’ll now implement two helper methods that\
    \ will make it more convenient to test and debug our `LinkedList`.\n\n### `toArray`\n\
    \nThe `toArray` method takes all the nodes in the `LinkedList` and puts them in\
    \ an array. To put them in an array, we create a new array called `nodes`. Then\
    \ we loop over all the nodes in the `LinkedList` and push each one on to the array.\n\
    \n```\n175   toArray() {\n176     const nodes = [];\n178 \n179     let currentNode\
    \ = this.head;\n180     while (currentNode) {\n181       nodes.push(currentNode);\n\
    182       currentNode = currentNode.next;\n183     }\n184 \n185     return nodes;\n\
    186   }\n```\n\n`02-linked-list/LinkedList.js`\n\n### `toString`\n\nThe `toString`\
    \ method takes the `LinkedList` and prints out a string representation of the\
    \ `LinkedList`. The method takes the `LinkedList` and first converts it to an\
    \ array (using the `toArray` method described above). Then the `map` array method\
    \ is called to process each `LinkedListNode` in the list. The `toString` method\
    \ for each `LinkedListNode` is called and then the `toString` array method is\
    \ called to print out the entire array of `LinkedListNodes`.\n\n```\n191   toString(callback)\
    \ {\n192     return this.toArray().map(node => node.toString(callback)).toString();\n\
    193   }\n```\n\n`02-linked-list/LinkedList.js`\n\n### Complexities\n\n| Access\
    \ | Search | Insertion | Deletion |\n| --- | --- | --- | --- |\n| O(n) | O(n)\
    \ | O(1) | O(1) |\n\n### Examples\n\nHere are some related problems you might\
    \ encounter:\n\n*   [Cycle in a List](https://leetcode.com/problems/linked-list/)\n\
    *   [Intersection of Two Lists](https://leetcode.com/problems/intersection-two-lists/)\n\
    \n### Quiz\n\n*   Q1: What does `this.next` refer to in linked list?\n*   Q2:\
    \ What is the difference between `deleteTail` and `deleteHead`?\n\n### References\n\
    \n*   Linked List on Wikipedia [https://en.wikipedia.org/wiki/Linked_list](https://en.wikipedia.org/wiki/Linked_list)\n\
    *   Linked List on YouTube [https://www.youtube.com/v=njTh_OwA](https://www.youtube.com/v=njTh_OwA)\n\
    *   Linked List example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/data-structures/linked-list](https://github.com/trekhleb/javascript-algorithms/tree/master/data-structures/linked-list)\n\
    *   Doubly Linked List implementation [https://github.com/trekhleb/javascript-algorithms/tree/master/data-structures/doubly-linked-list](https://github.com/trekhleb/javascript-algorithms/tree/master/data-structures/doubly-linked-list)\n\
    \n## Queue\n\n*   Difficulty: easy\n\n### Queue and its common operations\n\n\
    A **queue** is a collection of entities in which the entities are kept in First-In-First-Out\
    \ (FIFO) order. In a FIFO data structure, the first element added to the queue\
    \ is the first one removed. When an element is added to the queue, all the elements\
    \ that added before it must be removed before the new element. A commonly seen\
    \ implementation of this in the real world are lines in supermarket where the\
    \ first shoppers in line are served, with everyone else behind the first shopper.\n\
    \n**The main operations on queues are:**\n*   `enqueue`: add an entity to the\
    \ rear position (joining the line at the supermarket)\n*   `dequeue`: remove an\
    \ entity from the front position (serving the first shopper in line)\n*   `peek`:\
    \ reading the entity from the front of the queue without dequeuing it (asking\
    \ who the next shopper in line will be)\n\n![](images/03-queue----queue.png)\n\
    \nOperations such as *searching* or *updating* elements are not common for queues.\
    \ There are only two things we’re interested in when working with queues: the\
    \ beginning and the end of it.\n\n### When to use a Queue\n\nQueues are found\
    \ in different messaging applications where messages are often generated faster\
    \ than they are processed. For example, when you want to parse a lot of web-pages\
    \ or send a lot of emails, you might want to put those web-pages or emails into\
    \ a queue for further processing and process them one by without worrying that\
    \ some of the data being lost or messages dropped.\n\nQueues are also used as\
    \ a component in many other algorithms. Queues are used in graph or tree breadth-first\
    \ search, for example, when we need to store a list of the nodes that we need\
    \ to process later. Each time we process a node, we add its adjacent nodes or\
    \ children to the end of the queue. Using a queue allows us to process nodes in\
    \ the order they are visited.\n\n### Usage Example\n\nBefore we continue with\
    \ the queue class implementation, let’s imagine that we already have one implemented\
    \ and use its basic methods mentioned above. This will help us get a better understanding\
    \ of what we’re going to implement.\n"
