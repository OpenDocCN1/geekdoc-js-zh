  trans: "\n\n```javascript\n/**\n * @param {*[]} originalArray - 需要排序的数组。\n * @param\
    \ {function} comparatorCallback - 比较两个元素的函数\n * @return {*[]} - 排序后的数组\n */\n\
    export default function quickSort(originalArray, comparatorCallback = null) {\n\
    \  // 根据 comparatorCallback 函数创建一个比较器。\n  // Comparator 对象将为我们提供常用的比较方法，如 equal()\
    \ 和 lessThan()。\n  const comparator = new Comparator(comparatorCallback);\n\n\
    \  // 克隆原始数组以防止修改。\n  // 在此示例中我们不进行原地排序，因此不希望产生副作用。\n  const array = [...originalArray];\n\
    \n  // 如果数组元素少于或等于一个，说明它已经是有序的。\n  // 这是我们递归的边界情况。\n  if (array.length <= 1) {\n\
    \    return array;\n  }\n\n  // 初始化左右两个数组。\n  const leftArray = [];\n  const rightArray\
    \ = [];\n\n  // 取数组的第一个元素作为基准（pivot），并初始化中间数组。\n  const pivotElement = array.shift();\n\
    \  const centerArray = [pivotElement];\n\n  // 将所有数组元素分到左、中、右数组中。\n  // 由于我们是从数组中提取元素，只需检查数组长度来停止循环。\n\
    \  while (array.length) {\n    // 从未排序数组中提取第一个元素。\n    const currentElement =\
    \ array.shift();\n\n    // 将提取的元素与基准比较，以决定它属于哪个子数组\n    //（左、中或右）。\n    if (comparator.equal(currentElement,\
    \ pivotElement)) {\n      centerArray.push(currentElement);\n    } else if (comparator.lessThan(currentElement,\
    \ pivotElement)) {\n      leftArray.push(currentElement);\n    } else {\n    \
    \  rightArray.push(currentElement);\n    }\n  }\n\n  // 递归地排序左右数组。\n  const leftArraySorted\
    \ = quickSort(leftArray, comparatorCallback);\n  const rightArraySorted = quickSort(rightArray,\
    \ comparatorCallback);\n\n  // 现在将排序后的左数组与中间数组以及排序后的右数组合并。\n  return leftArraySorted.concat(centerArray,\
    \ rightArraySorted);\n}\n```\n\n`quicksort/quickSort.js`\n\n### 复杂度\n\n| 最优 |\
    \ 平均 | 最差 |\n| --- | --- | --- |\n| O(n * log(n)) | O(n * log(n)) | O(n<sup>)\
    \ |\n\n时间复杂度为 `O(n²)` 的**最坏情况**可能会发生在：如果我们的数组已经按升序排列好，并且我们总是选择数组的第一个元素作为基准点。在这种情况下，经过分区步骤后，所有元素将位于\
    \ `right` 数组中，导致 `left` 数组为空。这种情况将在后续的所有递归分区中持续，我们最终会有 `(n - 1)` 个递归步骤，在这些步骤中会对子数组进行完整遍历，导致\
    \ `O(n²)` 的时间复杂度。\n\n时间复杂度为 `O(n * log(n))` 的**最佳情况**发生在：当基准点将数组划分为两个几乎相等的 `left`\
    \ 和 `right` 部分。在这种情况下，快速排序图中会有 `log(n)` 层（见上方的插图），配合完整的子数组遍历，为我们提供了 `O(n * log(n))`\
    \ 的时间复杂度。\n\n### 题目示例\n\n这里是你在面试过程中可能会遇到的一些相关问题：\n\n* [排序列表](https://leetcode.com/problems/sort-list/)\n\
    * [数组中的第 K 大元素](https://leetcode.com/problems/kth-largest-element-in-an-array/)\n\
    \n### 测验\n\n*Q1: 平均而言，快速排序算法的时间复杂度是多少？\n\n*Q2: 我们如何修改修改 `quickSort()` 函数来让它按降序排列元素？\n\
    \n### 参考文献\n\nWikipedia 上的快速排序 [`en.wikipedia.org/wiki/Quicksort`](https://en.wikipedia.org/wiki/Quicksort)\n\
    \nYouTube 上的快速排序 [`www.youtube.com/watch?v=SLauY6PpjW4`](https://www.youtube.com/watch?v=SLauY6PpjW4)\n\
    \n快速排序示例和测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sorting/quick-sort)\n\
    \n## 树。深度优先搜索（Depth-First Search）。\n\n*难度：中等*\n\n### 任务\n\n假设我们有一个节点树，并且想要：\n\n\
    * 检查特定节点是否存在于树中\n* 检查两个节点是否相连\n* 访问树中的所有节点\n\n### 算法\n\n解决上述任务的方法之一是深度优先搜索。\n\n\
    **深度优先搜索 (DFS)** 是一种用于遍历树或图结构的算法。该算法的思想是从某个特定节点（通常是根节点）开始，沿着每个分支尽可能深地进行探索，然后回溯。\n\
    \n*回溯*（backtracking）一词意味着，当我们沿着分支深入移动且没有更多节点可以探索时，我们将沿树向上移动以寻找下一个未探索的分支。\n\n下方的插图展示了二叉树遍历的序列。\n\
    \nimages/22-tree-depth-search.png)\n\n将这个算法想象成你正在穿过迷宫。当你行走时，会遇到迷宫中的交叉路口——这些就像我们树的节点。每个路口有三个选择：向*右*转、向*左*转或*返回*上一个交叉路口（回溯）。假设我们想了一种策略，优先尝试右转。因此我们选择向右转，并用画笔将右转标记为“已访问”，以避免以后再次进入。如果我们遇到迷宫的死胡同（叶子节点），我们会回溯，直到到达一个曾向右过的交叉路口。然后我们向左转，并用画笔将左转标记为“已访问”。当我们到达交叉路口的两个方向都被标记为“已访问”时，我们需要回溯到上一个交叉路口并寻找第一个未访问的转弯。\n\
    \n该算法可以通过递归使用**栈**来实现（关于此数据结构的深入解释，请参见栈章节）。使用栈进行深度优先搜索的思想如下：\n\n1. 选择起始节点并将其所有子节点放入栈中。\n\
    2. 从栈中弹出节点以选择下一个访问节点，将其所有子节点放入栈中。\n3. 返回第 2 步（重复此过程直到栈为空）。\n\n### 使用示例\n\n"
- fmt: "\nBefore moving on with the actual implementation of the depth-first search\
    \ algorithm let’s imagine that we already have a `depthFirstSearch()` function\
    \ implemented. This function allows us to traverse binary tree nodes that are\
    \ implemented using simple `BinaryTreeNode` class. By doing that we’ll a get better\
    \ understanding of what arguments we want to pass to our `depthFirstSearch()`\
    \ function and what output we expect from it.\n\nIn this usage example, we will\
    \ use a callback function as the second argument to our `depthFirstSearch()` function.\
    \ This callback will be called every time the function visits a node in the tree.\
    \ This allows us to add custom logic when we visit each node.\n\n```javascript\n\
    \ 1 // Import dependencies.\n 2 import { depthFirstSearch } from './depthFirstSearch';\n\
    \ 3 import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
    \ 4 \n 5 // Create tree nodes.\n 6 const nodeA = new BinaryTreeNode('A');\n 7\
    \ const nodeB = new BinaryTreeNode('B');\n 8 const nodeC = new BinaryTreeNode('C');\n\
    \ 9 const nodeD = new BinaryTreeNode('D');\n10 const nodeE = new BinaryTreeNode('E');\n\
    \ 11 \n12 // Form a binary tree out of created nodes.\n13 nodeA\n14   .setLeft(nodeB)\n\
    15   .setRight(nodeC);\n16 \n17 nodeB\n18   .setLeft(nodeD)\n19   .setRight(nodeE);\n\
    20 \n21 // Init the array that will contain all traversed nodes of th tree.\n\
    22 const traversedNodes = [];\n23 \n24 // Create visiting node callback.\n25 const\
    \ visitNodeCallback = (visitedNode) => {\n26   // Once we visit the node let's\
    \ add it to the list of traversed nodes.\n27   traversedNodes.push(visitedNode);\n\
    28 };\n29 \n30 // Perform depth-first tree traversal.\n31 depthFirstSearch(nodeA,\
    \ visitNodeCallback);\n32 \n33 // eslint-disable-next-line no-console\n34 console.log(traversedNodes);\n\
    35 /*\n36   The output will be:\n37   [nodeA, nodeB, nodeD, nodeE, nodeC]\n38\
    \ */\n```\n\n`22-tree-depth-first-search/example.js`\n\n### Implementation\n\n\
    In order to traverse our tree, we must first create a `BinaryTreeNode` class that\
    \ will represent a node of the binary tree. In the class constructor, we will\
    \ assign a value to the node. Our `setLeft()` and `setRight()` methods allow us\
    \ to attach left and right nodes to it. For usability reasons we’ll return `this`\
    \ from `setLeft()` and `setRight()` methods to be able to chain them like `nodeA.setLeft(nodeB).setRight(nodeC)`.\n\
    \n```javascript\n 1 export class BinaryTreeNode {\n 2   /**\n 3    * @param {*}\
    \ [value]\n 4    */\n 5   constructor(value = null) {\n 6     this.left = null;\n\
    \ 7     this.right = null;\n 8     this.value = value;\n 9   }\n10 \n11   /**\n\
    12    * @param {BinaryTreeNode} node\n13    */\n14   setLeft(node) {\n15     this.left\
    \ = node;\n16     return this;\n17   }\n18 \n19   /**\n20    * @param {BinaryTreeNode}\
    \ node\n21    */\n22   setRight(node) {\n23     this.right = node;\n24     return\
    \ this;\n25   }\n26 }\n```\n\n`06-binary-search-tree/BinaryTreeNode.js`\n\nOnce\
    \ we’ve implemented the `BinaryTreeNode` class we can then implement the `depthFirstSearch()`\
    \ function that will traverse `BinaryTreeNode` instances. This function will accept\
    \ the starting `node` as a first parameter and `visitNodeCallback()` as a second\
    \ parameter. `visitNodeCallback()` will be called each time we meet the new node\
    \ on our DFS-path.\n\nWe will implement the `depthFirstSearch()` function using\
    \ recursion. It means that we will call `depthFirstSearch()` function for the\
    \ left and right child of the current `node` if they exist.\n\n```javascript\n\
    \ 1 /**\n 2  * Perform depth-first search (DFS) traversal of the rootNode.\n 3\
    \  *\n 4  * @param {BinaryTreeNode} node - The starting node to be traversed.\n\
    \ 5  * @param {callback} [visitNodeCallback] - Visiting node callback.\n 6  */\n\
    \ 7 export function depthFirstSearch(node, visitNodeCallback = () => {}) {\n 8\
    \   // Call the visiting node callback.\n 9   visitNodeCallback(node);\n10 \n\
    11   // Traverse left branch.\n12   if (node.left) {\n13     depthFirstSearch(node.left,\
    \ visitNodeCallback);\n14   }\n15 \n16   // Traverse right branch.\n17   if (node.right)\
    \ {\n18     depthFirstSearch(node.right, visitNodeCallback);\n19   }\n20 }\n```\n\
    \n`22-tree-depth-first-search/depthFirstSearch.js`\n\nPreviously, it was mentioned\
    \ that the depth-first search algorithm may be implemented using the `stack` data\
    \ structure. But looking at the code of `depthFirstSearch()` function you might\
    \ be wondering why we didn’t use `stack`.\n\n### Complexities\n\n#### Time Complexity\n\
    \nThe depth-first search algorithm visits every node exactly once. Therefore we\
    \ may say that the time complexity is `O(N)`, where `N` is the total number of\
    \ nodes.\n\n#### Auxiliary Space\n\nIn the worst-case scenario, we will have `O(N)`\
    \ for the recursive call stack.\n\n### Problems Examples\n\nHere are some related\
    \ problems that you might encounter during the interview:\n\n*   [Same Tree](https://leetcode.com/problems/same-tree/)\n\
    *   [Maximum Depth of Binary Tree](https://leetcode.com/problems/maximum-depth-of-binary-tree/)\n\
    *   [Validate Binary Search Tree](https://leetcode.com/problems/validate-binary-search-tree/)\n\
    \n### Quiz\n\n*Q1: What is the time complexity of depth-first search?*\n\n*Q2:\
    \ Can we avoid recursion while implementing depthFirstSearch()?*\n\n### References\n\
    \nDepth-first search (DFS) on Wikipedia [https://en.wikipedia.org/wiki/Depth-first_search](https://en.wikipedia.org/wiki/Depth-first_search)\n\
    \nTree DFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search)\n\
    \n## Trees. Breadth-First Search.\n\n*   *Difficulty: medium*\n\n### The Task\n\
    \nImagine that we have a tree of nodes and we want to:\n\n*   check whether a\
    \ specific node exists in a tree (i.e. perform search operation for node “E”),\n\
    *   do a nodes inventory by visiting all the nodes of a tree (i.e. to convert\
    \ a tree to an array).\n\nTo accomplish all these tasks we need to utilize a tree\
    \ traversal algorithm. In other words, we need to write some code that will allow\
    \ us to visit every node of a tree.\n\nIn this chapter, we will traverse a *binary*\
    \ tree (a tree in which every node may have at most *two* children). Once you\
    \ understand the idea of a depth-first tree traversal for a binary tree you’ll\
    \ be able to extend it for trees with more than two possible children for each\
    \ node.\n\n### The Algorithm\n\nOne of the ways to solve the tasks mentioned above\
    \ is breadth-first search algorithm.\n\n**Breadth-first search (BFS)** is an algorithm\
    \ for traversing or searching tree or graph data structures. It starts at the\
    \ tree root, and explores all of the neighbor nodes at the present depth prior\
    \ to moving on to the nodes at the next depth level.\n"
  raw: "Before moving on with the actual implementation of the depth-first search\
    \ algorithm let’s imagine that we already have a `depthFirstSearch()` function\
    \ implemented. This function allows us to traverse binary tree nodes that are\
    \ implemented using simple `BinaryTreeNode` class. By doing that we’ll a get better\
    \ understanding of what arguments we want to pass to our `depthFirstSearch()`\
    \ function and what output we expect from it.\n\nIn this usage example, we will\
    \ use a callback function as the second argument to our `depthFirstSearch()` function.\
    \ This callback will be called every time the function visits a node in the tree.\
    \ This allows us to add custom logic when we visit each node.\n\n```\n 1 // Import\
    \ dependencies.\n 2 import { depthFirstSearch } from './depthFirstSearch';\n 3\
    \ import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
    \ 4 \n 5 // Create tree nodes.\n 6 const nodeA = new BinaryTreeNode('A');\n 7\
    \ const nodeB = new BinaryTreeNode('B');\n 8 const nodeC = new BinaryTreeNode('C');\n\
    \ 9 const nodeD = new BinaryTreeNode('D');\n10 const nodeE = new BinaryTreeNode('E');\n\
    11 \n12 // Form a binary tree out of created nodes.\n13 nodeA\n14   .setLeft(nodeB)\n\
    15   .setRight(nodeC);\n16 \n17 nodeB\n18   .setLeft(nodeD)\n19   .setRight(nodeE);\n\
    20 \n21 // Init the array that will contain all traversed nodes of th tree.\n\
    22 const traversedNodes = [];\n23 \n24 // Create visiting node callback.\n25 const\
    \ visitNodeCallback = (visitedNode) => {\n26   // Once we visit the node let's\
    \ add it to the list of traversed nodes.\n27   traversedNodes.push(visitedNode);\n\
    28 };\n29 \n30 // Perform depth-first tree traversal.\n31 depthFirstSearch(nodeA,\
    \ visitNodeCallback);\n32 \n33 // eslint-disable-next-line no-console\n34 console.log(traversedNodes);\n\
    35 /*\n36   The output will be:\n37   [nodeA, nodeB, nodeD, nodeE, nodeC]\n38\
    \ */\n```\n\n22-tree-depth-first-search/example.js\n\n### Implementation\n\nIn\
    \ order to traverse our tree, we must first create a `BinaryTreeNode` class that\
    \ will represent a node of the binary tree. In the class constructor, we will\
    \ assign a value to the node. Our `setLeft()` and `setRight()` methods allow us\
    \ to attach left and right nodes to it. For usability reasons we’ll return `this`\
    \ from `setLeft()` and `setRight()` methods to be able to chain them like `nodeA.setLeft(nodeB).setRight(nodeC)`.\n\
    \n```\n 1 export class BinaryTreeNode {\n 2   /**\n 3    * @param {*} [value]\n\
    \ 4    */\n 5   constructor(value = null) {\n 6     this.left = null;\n 7    \
    \ this.right = null;\n 8     this.value = value;\n 9   }\n10 \n11   /**\n12  \
    \  * @param {BinaryTreeNode} node\n13    */\n14   setLeft(node) {\n15     this.left\
    \ = node;\n16     return this;\n17   }\n18 \n19   /**\n20    * @param {BinaryTreeNode}\
    \ node\n21    */\n22   setRight(node) {\n23     this.right = node;\n24     return\
    \ this;\n25   }\n26 }\n```\n\n06-binary-search-tree/BinaryTreeNode.js\n\nOnce\
    \ we’ve implemented the `BinaryTreeNode` class we can then implement the `depthFirstSearch()`\
    \ function that will traverse `BinaryTreeNode` instances. This function will accept\
    \ the starting `node` as a first parameter and `visitNodeCallback()` as a second\
    \ parameter. `visitNodeCallback()` will be called each time we meet the new node\
    \ on our DFS-path.\n\nWe will implement the `depthFirstSearch()` function using\
    \ recursion. It means that we will call `depthFirstSearch()` function for the\
    \ left and right child of the current `node` if they exist.\n\n```\n 1 /**\n 2\
    \  * Perform depth-first search (DFS) traversal of the rootNode.\n 3  *\n 4  *\
    \ @param {BinaryTreeNode} node - The starting node to be traversed.\n 5  * @param\
    \ {callback} [visitNodeCallback] - Visiting node callback.\n 6  */\n 7 export\
    \ function depthFirstSearch(node, visitNodeCallback = () => {}) {\n 8   // Call\
    \ the visiting node callback.\n 9   visitNodeCallback(node);\n10 \n11   // Traverse\
    \ left branch.\n12   if (node.left) {\n13     depthFirstSearch(node.left, visitNodeCallback);\n\
    14   }\n15 \n16   // Traverse right branch.\n17   if (node.right) {\n18     depthFirstSearch(node.right,\
    \ visitNodeCallback);\n19   }\n20 }\n```\n\n22-tree-depth-first-search/depthFirstSearch.js\n\
    \nPreviously, it was mentioned that the depth-first search algorithm may be implemented\
    \ using the *stack* data structure. But looking at the code of `depthFirstSearch()`\
    \ function you might be wondering why we didn’t use the `Stack` class implemented\
    \ in the stack chapter. The reason for that is that we’ve used a stack but in\
    \ a slightly different form. Instead of using the `Stack` class directly we’ve\
    \ used the call stack of the `depthFirstSearch()` function instead. Since we’re\
    \ dealing with recursion calls here and calling the function out from itself the\
    \ first function call can’t be resolved unless subsequent function calls are resolved.\
    \ Therefore, all unresolved function calls are placed into the *function call\
    \ stack*.\n\n![](images/22-tree-depth-first-search----tree-depth-first-search-stack.png)\n\
    \n### Complexities\n\n#### Time Complexity\n\nThe depth-first search algorithm\
    \ that was implemented above visits every node of a tree exactly once. If the\
    \ tree we are traversing has `|N|` number of nodes then the function `depthFirstSearch()`\
    \ will be called recursively `|N|` number of times (once for every tree node).\
    \ Therefore we may say that the time complexity of tree traversal using a depth-first\
    \ approach is **`O(|N|)`**, where `|N|` is the total number of nodes in a tree.\n\
    \n#### Auxiliary Space Complexity\n\nIn the worst-case scenario, we will have\
    \ an unbalanced tree that will look like a linked list (each node of the tree\
    \ has *one left* (or *only one right*) child). Since we used the recursive approach\
    \ to implement the `depthFirstSearch()` function it will make the function call\
    \ stack grow with every new recursive call (for every new node). Thus, in the\
    \ worst-case scenario, we will need **`O(|N|)`** auxiliary memory space for our\
    \ recursive function call stack.\n\n### Problems Examples\n\nHere are some related\
    \ problems that you might encounter during the interview:\n\n*   [Same Tree](https://leetcode.com/problems/same-tree/)\n\
    \n*   [Maximum Depth of Binary Tree](https://leetcode.com/problems/maximum-depth-of-binary-tree/)\n\
    \n*   [Validate Binary Search Tree](https://leetcode.com/problems/validate-binary-search-tree/)\n\
    \n### Quiz\n\n*Q1: What is the time complexity of the depth-first search algorithm?*\n\
    \n*Q2: Can we avoid recursion while implementing the `depthFirstSearch()` function?*\n\
    \n### References\n\nDepth-first search (DFS) on Wikipedia [https://en.wikipedia.org/wiki/Depth-first_search](https://en.wikipedia.org/wiki/Depth-first_search)\n\
    \nTree DFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/depth-first-search)\n\
    \n## Trees. Breadth-First Search.\n\n*   *Difficulty: medium*\n\n### The Task\n\
    \nImagine that we have a tree of nodes and we want to:\n\n*   check whether a\
    \ specific node exists in a tree (i.e. perform *search* operation for node “E”),\n\
    \n*   do a nodes inventory by visiting all the nodes of a tree (i.e. to convert\
    \ a tree to an array).\n\n![](images/23-tree-breadth-first-search----tree.png)\n\
    \nTo accomplish all these tasks we need to utilize a *tree traversal algorithm*.\
    \ In other words, we need to write some code that will allow us to visit every\
    \ node of a tree.\n\nIn this chapter, we will traverse a *binary* tree (a tree\
    \ in which every node may have at most *two* children). Once you understand the\
    \ idea of a depth-first tree traversal for a binary tree you’ll be able to extend\
    \ it for trees with more than two possible children for each node.\n\n### The\
    \ Algorithm\n\nOne of the ways to solve the tasks mentioned above is breadth-first\
    \ search algorithm.\n\n**Breadth-first search (BFS)** is an algorithm for traversing\
    \ or searching tree or graph data structures. It starts at the tree root, and\
