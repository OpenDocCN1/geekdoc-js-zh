    \ // -> 'Home'\n80 \n81 // So the shortest path from Home to Office is:\n82 //\
    \ Home -> A -> C -> E -> Office\n```\n\n26-dijkstra/example.js\n\nThe output of\
    \ `dijkstra()` function will allow us find a shortest path from `Home` to `Office`\
    \ as well as to any other vertex in a graph.\n\n![](images/26-dijkstra----graph-shortest.png)\n\
    \n### Implementation\n\n#### Importing Dependencies\n\nSince we’re going to use\
    \ `PriorityQueue` class to keep track of vertex visiting sequence let’s import\
    \ it as a dependency.\n\n```\n// Import dependencies.\nimport { PriorityQueue\
    \ } from '../07-priority-queue/PriorityQueue';\n```\n\n26-dijkstra/dijkstra.js\n\
    \n#### Describing Types\n\nFirst let’s create a `ShortestPaths` type definition\
    \ that we will use when describing what the `dijkstra()` function will return.\n\
    \n```\n/**\n * @typedef {Object} ShortestPaths\n * @property {Object} distances\
    \ - shortest distances to all vertices\n * @property {Object} previousVertices\
    \ - shortest paths to all vertices.\n */\n```\n\n26-dijkstra/dijkstra.js\n\n####\
    \ Implementing the `dijkstra()` function\n\nNow we may use this type definition\
    \ in `dijkstra()` JSDoc section to describe the input and the output of the function.\
    \ This is not mandatory to describe function’s JSDoc but it will help function\
    \ consumers to better understand what parameters does function accept and what\
    \ it returns.\n\nThe `dijkstra()` function will accept the following parameters:\n\
    \n*   `graph` - graph we’re going to traverse (instance of `Graph` class, see\
    \ “Graphs” chapter for implementation details).\n\n*   `startVertex` - graph vertex\
    \ that we will use as a starting point for traversal (instance of `GraphVertex`\
    \ class, see “Graphs” chapter for implementation details).\n\nThe `dijkstra()`\
    \ function first inits the helper variables:\n\n*   `distances` - this map is\
    \ used to store the shortest distances to each vertex from the `startVertex`.\
    \ It may look like `{A: 5, D: 8}` meaning that the shortest distance from `startVertex`\
    \ to `A` is `5` and to `D` is `8`. at first we set the distance to all vertices\
    \ to `Infinity` because we haven’t reached them yet.\n\n*   `visitedVertices`\
    \ - this map is used to keep track of visited vertices and to avoid visiting the\
    \ same vertex more than once. It may look like `{A: true, D: true}` meaning that\
    \ vertices `A` and `D` have been already visited.\n\n*   `previousVertices` -\
    \ this map will store the information about which vertex was the previous one\
    \ to the current one in order to form a shortest path. For example this map may\
    \ look like `{A: B, B: D, D: StartVertex}` meaning that the shortest path to `A`\
    \ lays through `B`, the shortest path to `B` lays through `D` and finally the\
    \ shortest path to `D` is a direct path from `StartVertex`. This map will allow\
    \ us to restore the shortest paths to any connected vertex in the graph.\n\n*\
    \   `queue` - instance of `PriorityQueue` that we will use to keep track of which\
    \ vertex need to be visited next. Every time we need to make a decision about\
    \ which vertex to visit next we need to take unvisited vertex that is closest\
    \ to the `StartVertex`.\n\nThe `while` loop of `dijkstra()` function mimics the\
    \ algorithm steps that were described in the “Algorithm Steps” section above:\n\
    \n1.  **Poll the next closest vertex** from the queue (the vertex with smaller\
    \ distance from the source) using `poll()` method of `PriorityQueue` instance.\n\
    \n2.  **Go through every unvisited neighbor** of the current vertex using `getNeighbors()`\
    \ method of `Graph` instance. For each neighbor we calculate `distanceToNeighborFromCurrent`.\
    \ If this distance is less than `existingDistanceToNeighbor` then replace it with\
    \ this new value and change the priority of the `neighbor` in the `queue` using\
    \ `changePriority()` method.\n\n3.  **Mark current vertex as visited**."
