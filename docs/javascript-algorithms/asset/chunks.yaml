    \ at full recursion calls tree below to get better understanding of the algorithm.\n\
    \n![](images/20-combinations----combinations-without-repetitions.png)\n\nHere\
    \ is an example of how this algorithm may be implemented in JavaScript.\n\n```\n\
    \ 1 /**\n 2  * @param {*[]} comboOptions - original set that we will take elements\
    \ from.\n 3  * @param {number} comboLength - the length of combinations we're\
