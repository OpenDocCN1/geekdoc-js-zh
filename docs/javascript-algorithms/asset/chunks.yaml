    \ that connects current vertex to the specified vertex. To do so it uses the `LinkedList`\
    \ `find()` method with `edgeFinder()` the callback. In `edgeFinder()` callback\
    \ we’re trying to find a vertex which has `startVertex` or `endVertex` being set\
