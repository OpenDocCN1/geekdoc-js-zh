    *Q2: Is 31 a power of 2? Use the bitwise solution to find out*\n\n### References\n\
    \nBitwise solution on GeeksForGeeks [https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/](https://www.geeksforgeeks.org/program-to-find-whether-a-no-is-power-of-two/)\n\
    \nBitwise solution on Stanford [http://www.graphics.stanford.edu/~seander/bithacks.html#DetermineIfPowerOf2](http://www.graphics.stanford.edu/~seander/bithacks.html#DetermineIfPowerOf2)\n\
    \nBinary number subtraction on YouTube [https://www.youtube.com/watch?v=S9LJknZTyos](https://www.youtube.com/watch?v=S9LJknZTyos)\n\
    \nBitwise solution example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/is-power-of-two](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/math/is-power-of-two)\n\
    \n## Search. Linear Search.\n\n*   *Difficulty: easy*\n\n### The Task\n\nFind\
    \ the position of a specific element in a list (or array).\n\nThe list is not\
    \ sorted, it may contain strings, numbers or objects. The distribution of the\
    \ element in a list is unknown, we can’t say if it sorted or not.\n\n### The Algorithm\n\
    \nA **linear search** algorithm is a method for finding an element within a list.\
    \ It sequentially checks each element of the list until a match is found or the\
    \ whole list has been searched.\n\n![](images/15-linear-search----linear-search.png)\n\
    \n### Application\n\nIf we need to find one value in an unsorted array, the linear\
    \ search algorithm is a good option. If many values need to be found in the same\
    \ array, then pre-processing the array – like using a sorting algorithm first\
    \ – and using another search algorithm, like a binary search algorithm is a better\
    \ approach.\n\n### Usage Example\n\nLet’s say we want to implement a linear search\
    \ for the phone book array that contains a list of users (objects with name and\
    \ phone).\n\nTo make our linear search a little bit more useful we will make it\
    \ work not only with numbers and strings but also with objects. This option will\
    \ allow us to be more flexible when searching the array.\n\n```\n 1 // Import\
    \ dependencies.\n 2 import linearSearch from './linearSearch';\n 3 \n 4 // Create\
    \ people objects.\n 5 const tim = { name: 'Tim', phone: '+111111111112' };\n 6\
    \ const jane = { name: 'Jane', phone: '+111111111111' };\n 7 const bill = { name:\
    \ 'Bill', phone: '+111111111113' };\n 8 const janeNamesake = { name: 'Jane', phone:\
    \ '+111111111114' };\n 9 const peter = { name: 'Peter', phone: '+111111111115'\
    \ };\n10 \n11 // Add people to the phone book.\n12 const phoneBook = [tim, jane,\
    \ bill, janeNamesake];\n13 \n14 // Create custom comparator function that can\
    \ compare two person\n15 // and decide whether they are equal or not.\n16 const\
    \ personComparator = (person1, person2) => {\n17   return person1.name === person2.name\
    \ ? 0 : -1;\n18 };\n19 \n20 // Let's try to find Jane in the phone book using\
    \ linear search.\n21 // Notice that we have two persons with the same name Jane\
    \ in the phone book and\n22 // our comparision function takes only the person\
    \ name into account so we are\n23 // expecting to have two indices in the output.\n\
    24 \n25 // eslint-disable-next-line no-unused-expressions\n26 linearSearch(phoneBook,\
    \ jane, personComparator); // -> [1, 3]\n27 \n28 // Now let's try to find Peter.\
    \ He is not in the phone book so we expect an empty ar\\\n29 ray.\n30 \n31 //\
    \ eslint-disable-next-line no-unused-expressions\n32 linearSearch(phoneBook, peter,\
    \ personComparator); // -> []\n```\n\n15-linear-search/example.js\n\n### Implementation\n\
    \nIn the example above we use a custom comparison function. To allow us to use\
    \ this comparison function, we need to split our linear search algorithm into\
    \ two parts. First, we will implement a universal `Comparator` utility class that\
    \ will provide a common interface for object comparison. And second, we will move\
    \ on and implement the `linearSearch()` function itself that will use the `Comparator`\
    \ utility class internally.\n\n#### `Comparator`\n\nLet’s create the class.\n\n\
    ```\n1 export default class Comparator {\n```\n\nutils/comparator/Comparator.js\n\
    \n##### `constructor`\n\nThe `Comparator` constructor will accept the compare\
    \ function callback as an argument. This function accepts two values for comparison.\
    \ It will return `0` if two objects are equal, `-1` if the first object is smaller\
    \ than the second one and `1` if the first object is greater than the first one.\n\
    \nThe `Comparator` class itself will not know anything about the comparison logic.\
    \ It will just provide a common interface (the methods that we’re going to implement\
    \ below) to work with.\n\n`compareFunction` is an optional argument for the `Comparator`\
    \ constructor. If the `compareFunction` is not provided we fall back to `defaultCompareFunction()`\
    \ function."
