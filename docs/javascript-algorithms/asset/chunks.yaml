  trans: "\n\n`广度优先搜索 (BFS)` 和 `深度优先搜索 (DFS)` 算法在某些方面非常相似，它们都是在遍历树，但实现方式不同。`BFS 这种方式是宽广`，它通过探索树中某一层上的所有节点，然后才向深一层并探索下一层的节点。`DFS\
    \ 这种方式是深入`，它通过一直向下树的叶子节点来探索树的所有节点，然后回溯并尝试另一个分支，直到到达叶子节点。\n\n下面的图展示了使用广度优先搜索算法遍历二叉树的序列。\n\
    \n![](img/23-tree-breadth-first-search----tree-breadth-first-search.png)\n\n该算法可以使用\
    \ `queue` 实现（参见此书之前关于 `Queue` 数据结构的其中一个章节）。使用队列实现广度优先搜索算法的思路如下：\n\n1. 选取起始节点并将其放入节点队列。\n\
    2. 从队列中弹出下一个节点，将其所有子节点添加到队列中以便稍后访问。\n3. 回到第 2 步（重复此过程直到队列为空）。\n\n### 使用示例\n\n\
    在继续实现广度优先搜索算法之前，让我们假设我们已经实现了一个 `breadthFirstSearch()` 函数。该函数允许我们遍历使用简单 `BinaryTreeNode`\
    \ 类实现的二叉树节点。通过这种方式，我们将更好地理解想要传递给 `breadthFirstSearch()` 函数的参数，以及我们期望它返回的输出。\n\n\
    在这个用用示例中，我们将使用一个回调函数作为 `breadtFirstSearch()` 函数的第二个参数。每当函数访问树中的一个节点时，该回调就会被调用一次。这允许我们在访问每个节点时添加自定义逻辑。\n\
    \n```\n 1 // 导入依赖项。\n 2 import { BinaryTreeNode } from '../06-binary-search-tree/BinaryTreeNode';\n\
    \ 3 import { breadthFirstSearch } from './breadthFirstSearch';\n 4 \n 5 // 创建树节点。\n\
    \ 6 const nodeA = new BinaryTreeNode('A');\n 7 const nodeB = new BinaryTreeNode('B');\n\
    \ 8 const nodeC = new BinaryTreeNode('C');\n 9 const nodeD = new BinaryTreeNode('D');\n\
    10 const nodeE = new BinaryTreeNode('E');\n 11 \n 12 // 由创建的节点构建一个二叉树。\n 13 nodeA\n\
    \ 14   .setLeft(nodeB)\n 15   .setRight(nodeC);\n 16 \n 17 nodeB\n 18   .setLeft(nodeD)\n\
    \ 19   .setRight(nodeE);\n 20 \n 21 // 初始化包含树中所有遍历节点的数组。\n 22 const traversedNodes\
    \ = [];\n 23 \n 24 // 创建访问节点回调。\n 25 const visitNodeCallback = (visitedNode) =>\
    \ {\n 26   // 一旦访问该节点，我们就将其添加到节点列表中。\n 27   traversedNodes.push(visitedNode);\n\
    \ 28 };\n 29 \n 30 // 执行广度优先遍历。\n 31 breadthFirstSearch(nodeA, visitNodeCallback);\n\
    \ 32 \n 33 // 检查遍历是否按顺序发生。\n 34 expect(traversedNodes).toEqual([\n 35   nodeA,\
    \ nodeB, nodeC, nodeD, nodeE,\n 36 ]);\n 37 \n 38 // eslint-disable-next-line\n\
    \ 39 console.log(traversedNodes);\n 40 /*\n 41   输出将是：\n 42   [nodeA, nodeB, nodeC,\
    \ nodeD, nodeE]\n 43 */\n```\n`23-tree-breadth-first-search/example.js`\n\n###\
    \ 实现\n\n由于我们要遍历二叉树，让我们创建一个简单的 `BinaryTreeNode` 类来表示二叉树的节点。使用 `constructor` 我们将值赋值给节点。此外，通过\
    \ `setLeft()` 和 `setRight()` 方法，我们能够附加左节点和右节点。为了方便使用，我们将从 `setLeft()` 和 `setRight()`\
    \ 方法返回 `this`，以便能够像 `nodeA.setLeft(nodeB).setRight(nodeC)` 这样的链式调用。\n\n```\n 1\
    \ export BinaryTreeNode {\n 2   /**\n 3    @param {*} [value]\n 4    */\n 5  \
    \ constructor(value = null) {\n 6     this.left = null;\n 7     this.right = null;\n\
    \ 8     this.value = value;\n 9   }\n 10 \n 11   /**\n 12    @param {BinaryTreeNode}\
    \ node\n 13    */\n 14   setLeft(node) {\n 15     this.left = node;\n 16     return\
    \ this;\n 17   }\n 18 \n 19   /**\n 20    @param {BinaryTreeNode} node\n 21  \
    \  */\n 22   setRight(node) {\n 23     this.right = node;\n 24     return this;\n\
    \ 25   }\n 26 }\n```\n`06-binary-search-tree/BinaryTreeNode.js`\n\n由于广度优先遍历使用队列来存储所有应该访问的节点，让我们先导入\
    \ `Queue` 类。\n\n```\n// 导入依赖项。\nimport { Queue } from '../03-queue';\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
    \n由于我们要遍历二叉树，广度优先遍历使用队列来存储所有应该访问的节点，让我们先导入 `Queue` 类。\n\n一旦我们实现了 `BinaryTreeNode`\
    \ 类并导入了 `Queue`，我们就可以开始 `breadthFirstSearch()` 函数的实现，该函数将接收 `rootNode` 作为第一个参数，`visitNodeCallback`\
    \ 作为第二个参数。在 `breadthFirstSearch()` 函数内部我们需要：\n\n1. 创建一个空队列实例 `nodeQueue`，\n2.\
    \ 将 `rootNode` 放入队列以开始遍历，\n3. 从队列中弹出下一个节点并赋值给 `currentNode` 变量，\n4. 调用 `visitNodeCallback()`\
    \ 回调以通知订阅者节点，\n5. 直到 `nodeQueue` 为空。\n\n以下是该函数的实现：\n\n```\n 4 /**\n5  * 执行广度优先搜索\
    \ (BFS) 遍历。\n6  *\n7  * @param {BinaryTreeNode} rootNode - 起始节点。\n8  * @param\
    \ {callback} [visitNodeCallback] - 访问回调。\n9  */\n10 export function breadthFirstSearch(rootNode,\
    \ visitNodeCallback = () {}) {\n11   // 队列设置。\n12   const nodeQueue = new Queue();\n\
    13   // 将起始节点放入队列。\n14   nodeQueue.enqueue(rootNode);\n15 \n16   // 直到队列为空访问队列的所有节点。\n\
    17   while (!nodeQueue.isEmpty()) {\n18     // 获取下一个访问的节点。\n19     const currentNode\
    \ = nodeQueue.dequeue();\n20 \n21     // 调用访问回调。\n22     visitNodeCallback(currentNode);\n\
    23 \n24     // 将左节点加入遍历队列。\n25     if (currentNode.left) {\n26       nodeQueue.enqueue(currentNode.left);\n\
    27     }\n28 \n29     // 将右节点加入遍历队列。\n30     if (currentNode.right) {\n31    \
    \   nodeQueue.enqueue(currentNode.right);\n32     }\n33   }\n34 }\n```\n`23-tree-breadth-first-search/breadthFirstSearch.js`\n\
    \n### 复杂度\n\n#### 时间复杂度\n\n上述实现的广度优先搜索算法恰好访问树中的每个节点一次。这是通过使用 `Queue` 实例实现的。由于树不能有循环连接（即两个节点共享同一个子节点），我们可以说每个节点只放入队列一次。然后通过访问它从队列中提取每个节点一次。因此，我们可以说使用广度方法遍历树的时间复杂度为\
    \ `O(|N|)`，其中 `|N|` 是树中的节点总数。\n\n#### 辅助空间复杂度\n\n在最坏情况下，我们将有一个类似于链表的非平衡树（如果树的每个节点只有一个左孩子或右孩子）。由于我们使用队列来存储将被访问的节点列表，队列在最坏情况下可能包含树的所有节点。因此，在最坏情况下，我们的队列实例需要\
    \ `O(|N|)` 的辅助内存空间。\n\n"
- fmt: "\nQ2: How the function `depthFirstSearch()` may be adjusted in order to support\
    \ more than two children for tree node?\n\n## References\n\n- Breadth-first search\
    \ (BFS) on Wikipedia [https://en.wikipedia.org/wiki/Breadth-first_search](https://en.wikipedia.org/wiki/Breadth-first_search)\n\
    - Tree BFS example and test cases [https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/tree/breadth-first-search)\n\
    \n## Graphs. Depth-First Search.\n\n*Difficulty: medium*\n\n### The Task\n\nImagine\
    \ that we have a graph and we want to:\n\n- check whether specific vertex exists\
    \ in a graph (i.e. perform `search` operation for vertex “John”),\n- check whether\
    \ two nodes are connected (i.e. to `find connection path` between vertex “Bill”\
    \ and “Tom”),\n- do vertices inventory by visiting all the vertices of a graph\
    \ (i.e. to convert a graph to an array),\n- etc (for more usecases see Application\
    \ section below).\n\n![](images/24-graph-depth-first-search----graph.png)\n\n\
    To accomplish all these tasks we need to utilize a `graph traversal algorithm`.\
    \ In other words, we need to write an algorithm that will visit all the vertices\
    \ of a graph that can be reached from a specific vertex.\n\n### The Algorithm\n\
    \nOne of the ways to solve the tasks mentioned above is depth-first search algorithm.\n\
    \n**Depth-first search (DFS)** is an algorithm for traversing or searching a tree\
    \ or graph data structures. The idea of the algorithm is to start at some specific\
    \ node (or vertex) and explore as far as possible along each branch before backtracking.\n\
    \nHere, the word `backtracking` means that when we’re moving deeper along the\
    \ branch of a graph and there are no more nodes along the current path to explore,\
    \ then we’re moving backwards to find another closest unexplored sub-branch (vertex)\
    \ and then explore it.\n\nThe illustration below shows the sequence of graph traversal\
    \ using depth-first search algorithm.\n\n![](images/24-graph-depth-first-search----graph-depth-first-search.png)\n\
    \nTo get better understanding of depth-first search algorithm you can think of\
    \ the process of walking through the maze. Graph is a maze, graph edges are paths\
    \ and graph vertices are intersections of maze paths. When you get to an intersection,\
    \ you mark the path you intend to travel to avoid taking that same path in the\
    \ future. Once you come to the intersection where all paths are marked as “visited”,\
    \ you go back to the previous intersection (backtracking) and choose the next\
    \ path that has not been visited yet. This process is repeated until you reach\
    \ the exit of the maze.\n\nThis algorithm may be implemented recursively using\
    \ `stack` (see one of the previous chapters of this book about the `Stack` data\
    \ structure). The idea of using the stack for depth-first search is the following:\n\
    \n1. Pick the starting vertex and add it to the stack.\n2. Pop the next vertex\
    \ from the stack and “visit” it (i.e. call a callback or do some operations over\
    \ the vertex).\n3. Push all `unvisited` neighbors of current vertex into the stack.\n\
    4. Go to step 2 (repeat this process until the stack is empty).\n\nA **Hash map**\
    \ data structure may also be used for efficient checking if the vertex has been\
    \ already visited or not. The vertex must have a unique `key` value that is used\
    \ as a key for a hash map.\n\n### Application\n\nDepth-first search algorithm\
    \ serves as a building block for other graph related algorithms such as:\n\n-\
    \ finding connected components,\n- topological sorting,\n- finding the bridges\
    \ of a graph,\n- detecting cycle in a graph,\n- path Finding,\n- solving puzzles\
    \ with only one solution (such as mazes),\n- maze generation may use a randomized\
    \ depth-first search\n- etc.\n\n### Usage Example\n\nBefore implementing the `depthFirstSearch()`\
    \ function let’s see how we’re going to use it and what parameters we’re going\
    \ to pass into it. The `depthFirstSearch()` function needs to know what graph\
    \ to traverse and from starting vertex to begin a traversal process. Also we want\
    \ to pass a callback to the function that will be called every time a new vertex\
    \ is being visited. Having all that in mind let’s create really simple social\
    \ network using `Graph` class from the “Graphs” chapter of this book and then\
    \ let’s traverse it.\n\nHere is a structure of the network we’re going to implement.\n\
    \n![](images/24-graph-depth-first-search----network.png)\n\nLet’s start from `Bill`\
    \ and traverse all users that connected to `Bill` directly or via another users.\
    \ First we will create a graph (analogy of social network). Next we will create\
    \ graph vertices (analogy of registering the users in the network). Then we will\
    \ create graph edges between graph nodes (analogy of adding users to friend lists).\
    \ Then we will traverse all users starting from `Bill`.\n\n```\n 1 // Import dependencies.\n\
    \ 2 import Graph from '../08-graph/Graph';\n 3 import GraphVertex from '../08-graph/GraphVertex';\n\
    \ 4 import GraphEdge from '../08-graph/GraphEdge';\n 5 import { depthFirstSearch\
    \ } from './depthFirstSearch';\n 6 \n 7 // Create a demo-version of our overly-simplified\
    \ social network.\n 8 const socialNetwork = new Graph();\n 9\n10 // Let's register\
    \ several users in our network.\n11 const bill = new GraphVertex('Bill');\n12\
    \ const alice = new GraphVertex('Alice');\n13 const john = new GraphVertex('John');\n\
    14 const kate = new GraphVertex('Kate');\n15 const ann = new GraphVertex('Ann');\n\
    16 const tom = new GraphVertex('Tom');\n17 const sam = new GraphVertex('Sam');\n\
    \ 18\n19 // Now let's establish friendship connections between the users of our\
    \ network.\n20 socialNetwork\n21   .addEdge(new GraphEdge(bill, alice))\n22  \
    \ .addEdge(new GraphEdge(bill, john))\n23   .addEdge(new GraphEdge(bill, kate))\n\
    24   .addEdge(new GraphEdge(alice, ann))\n25   .addEdge(new GraphEdge(ann, sam))\n\
    26   .addEdge(new GraphEdge(john, ann))\n27   .addEdge(new GraphEdge(kate, tom));\n\
    28 \n29 // Now let's traverse the network in depth-first manner staring from Bill\n\
    30 // and add all users we will encounter to the userVisits.\n31 const userVisits\
    \ = [];\n32 depthFirstSearch(socialNetwork, bill, (user) => {\n33   userVisits.push(user);\n\
    34 });\n35 \n36 // Now let's see in what order the users have been traversed.\n\
    37 // eslint-disable-line no-console\n38 console.log(userVisits);\n39 /*\n40 \
    \  The output will be:\n41   [bill, alice, ann, sam, john, kate]\n42 */\n```\n\
    \n24-graph-depth-first-search/example.js\n\n### Implementation\n\n**Function arguments**\n\
    \nAs described above the `depthFirstSearch()` function will accept three parameters:\n\
    \n- `graph` - graph that is going to be traversed (instance of `Graph` class),\n\
    - `startVertex` - vertex that we will use as a starting point (instance of `GraphVertex`\
    \ class),\n- `enterVertexCallback` - callback that will be called on every vertex\
    \ visit.\n\n**Visited vertices memorization**\n\nWhen we’ve been implemented the\
    \ depth-first search algorithm for trees we didn’t care about the case when the\
    \ same node could be visited twice during the traversal from different parents.\
    \ It is because the tree node by definition can’t have two or more parents. Otherwise\
    \ it would become a graph. So we have only *one way* to *enter* the node in a\
    \ tree. But when we’re dealing with graphs we need to remember that the same graph\
    \ vertex may be visited *many times* from many neighbor vertices. This way the\
    \ same vertex may be added to our traversal stack many times. That makes the whole\
    \ traversal process inefficient and may even cause an endless loop. That’s why\
    \ we need to *mark all visited vertices* while traversing a graph to avoid visiting\
    \ the same vertex over and over again. We will use `visitedVertices` object for\
    \ that. The `key` value of visited graph vertices will be the keys of `visitedVertices`\
    \ object. This will help us efficiently check if the node has been already visited\
    \ in `O(1)` time.\n\n**Recursive closure**\n"
