  trans: "\n\n# Q2: 如果我们需要从一个大小为 4 的集合生成所有大小为 `2` 的不重复排列，我们会有多少个排列？\n\n## 参考文献\n\n\
    - Wikipedia 上的排列 [`en.wikipedia.org/wiki/Permutation`](https://en.wikipedia.org/wiki/Permutation)\n\
    \n- “Math is Fun”上的排列 [`www.mathsisfun.com/combinatorics/combinations-permutations.html`](https://www.mathsisfun.com/combinatorics/combinations-permutations.html)\n\
    \n- Medium 上的排列 [`medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5`](https://medium.com/@trekhleb/permutations-combinations-algorithms-cheat-sheet-68c14879aba5)\n\
    \n- 排列示例与测试用例 [`github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/permutations`](https://github.com/trekhleb/javascript-algorithms/tree/master/src/algorithms/sets/permutations)\n\
    \n## 集合。组合。\n\n难度：中等\n\n在数学中，`combination`（组合）是从集合中选取项目，其中（与排列不同）`选择的顺序并不重要`。更正式地说，一个大小为\
    \ `n` 的集合 `S` 的 `r-combination`（r 阶组合）是 `S` 中 `r` 个不同元素的子集。\n\n例如，假设我们有 5 个（`n\
    \ = 5`）Web 开发者集合 `{Bill, John, Kate, Mike, Julia}`。当你需要从 5 人中选择 3 个（`r = 3`）Web\
    \ 开发者来负责新项目时，你选择他们的顺序并不重要。唯一重要的是该开发者是否被选中了。在结果中，你可能会得到组合 `{John, Kate, Julia}`，这实际上等同于\
    \ `{Kate, John, Julia}`，因为顺序不重要。这是一个`combination without repetition`（不重复组合）的示例，因为不能重复选择同一个开发者（集合\
    \ `{Bill, Bill}` 是可能的且没有意义的）。\n\n组合的另一个例子是你根据口袋里的硬币集合生成的找零组合。假设你有一组硬币 `{1, 1,\
    \ 5, 5, 5, 10, 10, 10}`，你需要找 27 元硬币的零。你有一个包含 3 个唯一元素的集合 `{1, 5, 10}`（`n = 3`），并且允许多次选取同一个元素。你可能会得到组合\
    \ `{10, 10, 5, 1, 1}`（`r = 5`），这等同于 `{1, 10, 10, 1, 5}`，因为顺序不重要。这是一个`combination\
    \ with repetition`（重复组合）的示例，因为你可以将同一个元素多次包含组合（硬币集合 `{1, 1, 1}` 是可能的且有意义的）。\n\n\
    ![](img/20-combinations----combinations.png)\n\n### 不重复组合\n\n让我们通过简单的例子，从集合 `S\
    \ = {A, B, C}`（`n = 3`）中形成大小为 `r = 2` 的*不*重复组合。在这种情况下，组合集合 `C` 如下所示：\n\n```\n\
    S = {A, B, C}\nr = 2\n\nC = {\n    {A, B},\n    {A, C},\n    {B, C},\n}\n```\n\
    \n现在，让我们尝试泛化这个例子，并找出大小为 `n` 的集合中有多少个不重复（大小为 `r`）的组合。我们可以通过以下两个步骤来实现：\n\n* 假设顺序**是**重要的（就像排列一样），并计算不重复的、为\
    \ `r` 的排列数量。\n* 之后假设顺序**不**重要，并消除所有重复的组合。\n\n从排列的章节中，我们已经知道大小为 `n` 的集合的大小为 `r`\
    \ 的不重复排列数可以计算为 $P(n, r) = \\frac{n!}{(n - r)!}$。如果我们处理集合 `S = {A, B, C}` 大小为 `r\
    \ = 2` 的排列，我们将得到 $P(n, r) = \\frac{n!}{(n - r)!} = \\frac{3!}{(3 - 2)!} = 3! =\
    \ 6$ 个排列：\n\n```\nS = {A, B, C}\nr = 2\n\nP = {\n    {A, B},\n    {B, A},\n  \
    \  {A, C},\n    {C, A},\n    {B, C},\n    {C, B},\n}\n```\n\n这个集合 `P` 是一个排列。如果我们忽略顺序，并将集合\
    \ `P` 的子集视为组合呢？我们会发现 `P` 包含重复的组合。\n\n```\nP = {\n    {A, B},\n    {B, A}, <--\
    \ 重复组合\n\n    {A, C},\n    {C, A}, <-- 重复组合\n\n    {B, C},\n    {C, B}, <-- 重复组合\n\
    }\n```\n\n现在我们需要确定有多少个重复，并从我们的计算中消除它们。\n\n"
- fmt: "\n```javascript\n 1 // Import dependencies.\n 2 import combineWithoutRepetitions\
    \ from './combineWithoutRepetitions';\n 3 import combineWithRepetitions from './combineWithRepetitions';\n\
    \ 4 \n 5 // Combination WITHOUT repetitions.\n 6 // Let's generate all possible\
    \ teams compositions that may work on the next projects.\n 7 const teamSize =\
    \ 3;\n 8 const candidates = ['Bill', 'John', 'Kate', 'Jane', 'Mike'];\n 9 const\
    \ possibleTeams = combineWithoutRepetitions(candidates, teamSize);\n10 \n11 //\
    \ eslint-disable-next-line no-console\n12 console.log(possibleTeams);\n13 /*\n\
    14  The output will be:\n15  [\n16       ['Bill', 'John', 'Kate'],\n17       ['Bill',\
    \ 'John', 'Jane'],\n18       ['Bill', 'John', 'Mike'],\n19       ['Bill', 'Kate',\
    \ 'Jane'],\n20       ['Bill', 'Kate', 'Mike'],\n21       ['Bill', 'Jane', 'Mike'],\n\
    22       ['John', 'Kate', 'Jane'],\n23       ['John', 'Kate', 'Mike'],\n24   \
    \    ['John', 'Jane', 'Mike'],\n25       ['Kate', 'Jane', 'Mike'],\n26  ]\n27\
    \  */\n28 \n29 // Combination WITH repetitions.\n30 // Let's generate all possible\
    \ combinations of ice cream scoops.\n31 const iceCreamFlavours = ['banana', 'mint',\
    \ 'pistachio', 'vanilla'];\n32 const numberOfScoops = 3;\n33 const scoopCombinations\
    \ = combineWithRepetitions(iceCreamFlavours, numberOfScoops);\n34 \n35 // eslint-disable-next-line\
    \ no-console\n36 console.log(scoopCombinations);\n37 /*\n38  The output will be:\n\
    39  [\n40       ['banana', 'banana', 'banana'],\n41       ['banana', 'banana',\
    \ 'mint'],\n42       ['banana', 'banana', 'pistachio'],\n43       ['banana', 'banana',\
    \ 'vanilla'],\n44       ['banana', 'mint', 'mint'],\n45       ['banana', 'mint',\
    \ 'pistachio'],\n46       ['banana', 'mint', 'vanilla'],\n47       ['banana',\
    \ 'pistachio', 'pistachio'],\n48       ['banana', 'pistachio', 'vanilla'],\n49\
    \       ['banana', 'vanilla', 'vanilla'],\n50       ['mint', 'mint', 'mint'],\n\
    51       ['mint', 'mint', 'pistachio'],\n52       ['mint', 'mint', 'vanilla'],\n\
    53       ['mint', 'pistachio', 'pistachio'],\n54       ['mint', 'pistachio', 'vanilla'],\n\
    55       ['mint', 'vanilla', 'vanilla'],\n56       ['pistachio', 'pistachio',\
    \ 'pistachio'],\n57       ['pistachio', 'pistachio', 'vanilla'],\n58       ['pistachio',\
    \ 'vanilla', 'vanilla'],\n59       ['vanilla', 'vanilla', 'vanilla'],\n60  ]\n\
    61  */\n```\n\n`20-combinations/example.js`\n\n### Implementation\n\n#### Combinations\
    \ Without Repetitions\n\nThis problem may be solved recursively. It means that\
    \ we generate combinations of a bigger size out of combinations of smaller sizes.\
    \ For example, if we need to generate all combinations of size `r = 3` without\
    \ repetitions for a set `S = {A, B, C, D}` we do the following:\n\n* extract the\
    \ first element `A` out of the set,\n* find all combinations of size `r = 2` for\
    \ a set `S = {B, C, D}`,\n* concatenate `A` with all smaller combinations from\
    \ the previous step,\n* extract the second element `B` out of the set,\n* find\
    \ all combinations of size `r = 2` for a set `S = {C, D}`,\n* concatenate `B`\
    \ with all smaller combinations from the previous step,\n* and so on…\n\nThe base\
    \ case for our recursion would be the case when we need to generate combinations\
    \ of size `r = 1` for a set. In this case every element of a set is a combination\
    \ we’re looking for, thus no further recursion calls are needed.\n\nTake a look\
    \ at full recursion calls tree below to get better understanding of the algorithm.\n\
    \n![](images/20-combinations----combinations-without-repetitions.png)\n\nHere\
    \ is an example of how this algorithm may be implemented in JavaScript.\n\n```javascript\n\
    \ 1 /**\n 2  * @param {*[]} comboOptions - original set that we will take elements\
    \ from.\n 3  * @param {number} comboLength - the length of combinations we're\
    \ going to make.\n 4  * @return {*[]}\n 5  */\n 6 export default function combineWithoutRepetitions(comboOptions,\
    \ comboLength) {\n 7   // If the length of combinations is 1 then each element\
    \ of original set is a combi\\\n 8   nation.\n 9   if (comboLength === 1) {\n\
    10     return comboOptions.map(comboOption => [comboOption]);\n11   }\n12 \n13\
    \   // Init combinations array.\n14   const combos = [];\n15 \n16   // Extract\
    \ characters one by one and concatenate them to combinations of smaller s\\\n\
    17   ize.\n19   // We need to extract characters since we don't want to have duplicates.\n\
    19   comboOptions.forEach((currentOption, optionIndex) => {\n20     // Get all\
    \ combinations from original set.\n21     const smallerCombos = combineWithoutRepetitions(\n\
    22       comboOptions.slice(optionIndex + 1),\n23       comboLength - 1,\n24 \
    \    );\n25 \n26     // Concatenate current element (option) to all smaller combinations.\n\
    27     smallerCombos.forEach((smallerCombo) => {\n28       combos.push([currentOption].concat(smallerCombo));\n\
    29     });\n30   });\n31 \n32   // Return all combinations.\n33   return combos;\n\
    34 }\n```\n\n`20-combinations/combineWithoutRepetitions.js`\n\n#### Combinations\
    \ With Repetitions\n\nThis problem may be solved recursively. It means that we\
    \ generate combinations of bigger size out of combinations of smaller sizes. For\
    \ example, if we need to generate all combinations of size `r = 2` with repetitions\
    \ for a set `S = {A, B, C}` we do the following:\n\n* remember the first element\
    \ `A` of the set,\n* find all combinations of size `r = 1` for a set `S = {A,\
    \ B, C}`,\n* concatenate `A` with all smaller combinations from the previous step,\n\
    * remember the second element `B` of the set,\n* find all combinations of size\
    \ `r = 1` for a set `S = {B, C}`,\n* concatenate `B` with all smaller combinations\
    \ from the previous step,\n* and so on…\n\nThe base case for our recursion would\
    \ be the case when we need to generate combinations of size `r = 1` for a set.\
    \ In this case every element of a set is a combination we’re looking for, thus\
    \ no further recursion calls are needed.\n\nTake a look at full recursion calls\
    \ tree below to get better understanding of the algorithm.\n\n![](images/20-combinations----combinations-with-repetitions.png)\n\
    \nHere is an example of how this algorithm may be implemented in JavaScript.\n\
    \n```javascript\n 1 /**\n 2  * @param {*[]} comboOptions - original set that we\
    \ will take elements from.\n 3  * @param {number} comboLength - the length of\
    \ combinations we're going to make.\n 4  * @return {*[]}\n 5  */\n 6 export default\
    \ function combineWithRepetitions(comboOptions, comboLength) {\n 7   // If the\
    \ length of combinations is 1 then each element of original set is a combi\\\n\
    \ 8   nation.\n 9   if (comboLength === 1) {\n10     return comboOptions.map(comboOption\
    \ => [comboOption]);\n11   }\n12 \n13   // Init combinations array.\n14   const\
    \ combos = [];\n15 \n16   // Go through every character of original set and concatenate\
    \ it to combinations\n17   // of smaller size.\n18   comboOptions.forEach((currentOption,\
    \ optionIndex) => {\n19     // Get all combinations WITH the current element from\
    \ original set.\n20     const smallerCombos = combineWithRepetitions(\n21    \
    \   comboOptions.slice(optionIndex),\n22       comboLength - 1,\n23     );\n24\
    \ \n25     // Concatenate current element (option) to all smaller combinations.\n\
    26     smallerCombos.forEach((smallerCombo) => {\n27       combos.push([currentOption].concat(smallerCombo));\n\
    28     });\n29   });\n30 \n31   // Return all combinations.\n32   return combos;\n\
    33 }\n```\n\n`20-combinations/combineWithRepetitions.js`\n\n### Problems Examples\n\
    \nHere are some related problems that you might encounter during the interview:\n\
    \n* [Combinations](https://leetcode.com/problems/combinations/)\n\n* [Combination\
    \ Sum III](https://leetcode.com/problems/combination-sum-iii/)\n\n* [Combination\
    \ Sum IV](https://leetcode.com/problems/combination-sum-iv/)\n\n### Quiz\n\n*Q1:\
    \ Does the order of the elements matter when forming a combination?*\n\n*Q2: If\
    \ we will need to generate all combinations without repetitions of size `2` from\
    \ the set of size `4`, how many combinations will we have?*\n\n### References\n"
