  trans: "\n\n在每次查找迭代后，我们都会忽略大约一半的树（或子树），并关注另一半部分。通过每次只关注树的一半部分并在每次迭代中将搜索范围缩小一倍，查找操作的时间复杂度为\
    \ `O(log(n))`。\n\n## 自平衡\n\n二叉搜索树中查找操作的性能紧密取决于树的形状。例如，如上所述，平衡的二叉搜索树在树中查找特定值需要\
    \ `O(log(n))` 时间。但对于病态的二叉搜索树，相同的操作需要 `O(n)` 时间，因为该树类似于链表。\n\n在添加或删除节点时保持二叉搜索树的平衡可以维持查找操作的快速性能。有几种数据结构构建在二叉搜索树之上，但具有每次修改后平衡树的额外功能：[AVL\
    \ 树](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/avl-tree)、[红黑树](https://github.com/trekhleb/javascript-algorithms/tree/master/src/data-structures/tree/red-black-tree)等。\n\
    \n在本章中，我们将介绍二叉搜索树的基础实现，但不包含重平衡功能。\n\n## 插入\n\n要向二叉搜索树中插入一个新节点，我们需要递归地将当前节点值与新节点值进行比较。如果新节点值大于当前节点值，我们需要向右移动（将右子节点设置为当前节点）。否则，我们需要向左移动（将左子节点设置为当前节点）。一旦下一个子节点为空，意味着我们已经到达了叶子节点，并准备好将新节点放置在它的正确位置。\n\
    \n![](img/06-binary-search-tree----binary-search-tree-insertion.png)\n\n## 移除\n\
    \n从二叉搜索树中删除节点要复杂一些。首先，我们需要找到想要删除的节点（参见上文的查找操作）。可能存在几种情况：\n\n* `删除叶子节点` - 最简单的情况，我们直接删除该节点。\n\
    * `删除带子节点的节点` - 我们让该子节点成为当前节点父节点的子节点。\n* `删除有两个子节点的节点` - 我们需要找到下一个最大值（右分支中的最小值），并用该下一个较大值的节点替换当前节点。\n\
    \n这里是节点具有两个子节点时的最后一种情况的示例。\n\n![](img/06-binary-search-tree----binary-search-tree-removing.png)\n\
    \n## 遍历\n\n遍历是按照特定顺序访问树的所有节点。\n\n![](img/06-binary-search-tree----binary-search-tree-traversal.png)\n\
    \n在本章中，我们将实现中序遍历，将二叉搜索树转换为排序数组。\n\n## 使用示例\n\n在继续实现二叉搜索树的具体 JavaScript 代码之前，让我们先看一个\
    \ `BinarySearchTree` 类的用例，并描述我们将将如何使用它。\n\n假设我们有一组购物商品。我们希望所有以下操作都能快速执行（在 `O(log(n))`\
    \ 时间内）：按特定价格获取商品、插入新商品、移除现有商品、从集合中获取最便宜的商品、获取最昂贵的商品。\n\n```\n1 // 导入依赖项\n2 import\
    \ BinarySearchTree from './BinarySearchTree';\n3 \n4 // 创建二叉搜索树实例。\n5 const bstCollection\
    \ = new BinarySearchTree();\n6 \n7 // 将商品添加到我们的二叉搜索树中。\n8 // 我们将价格作为键。\n9 bstCollection.insert(220,\
    \ { title: 'Phone' });\n10 bstCollection.insert(3455, { title: 'TV' });\n11 bstCollection.insert(8200,\
    \ { title: 'Notebook' });\n12 bstCollection.insert(120, { title: 'Remote Control'\
    \ });\n13 \n14 // 找到目前为止最便宜和最贵的商品。\n15 const minItem = bstCollection.findMin().data;\
    \ // { title: 'Remote Control' }\n16 const maxItem = bstCollection.findMax().data;\
    \ // { title: 'Notebook' }\n17 \n18 // 找到价格为 8200 的商品。\n19 const item = bstCollection.find(3455).data;\
    \ // { title: 'TV' }\n20 \n21 // 按价格移除商品。\n22 bstCollection.remove(120);\n23 //\
    \ 检查目前最便宜的商品是什么。\n24 const newMinItem = bstCollection.findMin().data; // { title:\
    \ 'Phone' }\n25 \n26 // 现在我们可以以任何方式使用获取到的数据。\n27 // eslint-disable-next-line\n\
    28 console.log(minItem, maxItem, item, newMinItem);\n```\n06-binary-search-tree/example.js\n\
    \n## 实现\n\n我们将实现分为两个部分。首先，我们将实现 `BinarySearchTreeNode` 类，它将代表二叉搜索树的节点及其功能。该类将包含核心功能。然后，我们将实现\
    \ `BinarySearchTree` 类，它只是 `BinarySearchTreeNode` 类的封装，将使操作二叉搜索树变得简单一点。\n\n###\
    \ BinarySearchTreeNode\n\n####构造函数\n\n让我们创建这个类。\n\n```javascript\n1 export default\
    \ class BinarySearchTreeNode {\n```\n06-binary-search-tree/BinarySearchTreeNode.js\n\
    \n我们的构造函数将接受 `value` 参数，我们将将其作为键来定义当前节点应该放在树的什么位置。所有的节点比较将使用此 `value` 参数进行。`data`\
    \ 参数作为数据包，包含任何类型的数据。例如，它可能包含一个带有所有特定价格购物商品的链表，也可能包含一个带有名称、电话号码等的用户对象。\n\n在构造函数中，我们将创建指向左、右子节点的指针以及一个指向父节点的指针。对于树中的根节点，父节点始终为\
    \ `null`。\n\n```javascript\n2   /**\n3    * @param {*} value - 节点值。\n4    * @param\
    \ {*} data - 节点数据（可以是任何内容）。\n5    */\n6   constructor(value = null, data = null)\
    \ {\n7     this.left = null; // 指向左子节点的指针。\n8     this.right = null; // 指向右子节点的指针。\n\
    9     this.parent = null; // 指向父节点的指针。\n10    this.value = value;\n11    this.data\
    \ = data;\n12  }\n```\n06-binary-search-tree/BinarySearchTreeNode.js\n\n#### find()\n\
    \n该方法通过 `value` 在整个树中查找节点。它执行了上文提到的二叉搜索查找操作。提醒一下，在二叉搜索树中通过键查找节点，我们需要递归地将其与当前节点进行比较，如果当前节点值比我们要找的值大，则向左移动（到左子节点）。否则，我们需要向右移动（到右节点）。相同的过程在下一个节点（左或右子节点）上重复。\n\
    \n```javascript\n168   /**\n169    * @param {*} value\n170    * @return {BinarySearchTreeNode}\n\
    171    */\n172   find(value) {\n173     // 检查根节点。\n174     if (this.value ===\
    \ value) {\n175       return this;\n176     }\n177 \n178     if (value < this.value\
    \ && this.left) {\n179       // 检查左节点。\n180       return this.left.find(value);\n\
    181     }\n182 \n183     if (value > this.value && this.right) {\n184       //\
    \ 检查右节点。\n185       return this.right.find(value);\n186     }\n187 \n188     return\
    \ null;\n189   }\n```\n06-binary-search-tree/BinarySearchTreeNode.js\n\n"
- fmt: "\nThis method uses other helper methods like `setLeft()` and `setRight()`\
    \ that will be implemented below.\n\n```\n128   /**\n129    * @param {*} value\n\
    130    * @param {*} [data] - node data (could be anything).\n131    * @return\
    \ {BinarySearchTreeNode}\n132    */\n133   insert(value, data) {\n134     if (this.value\
    \ === null) {\n135       this.value = value;\n136       this.data = data;\n137\
    \ \n138       return this;\n139     }\n140 \n141     if (value < this.value) {\n\
    142       // Insert to the left.\n143       if (this.left) {\n144         return\
    \ this.left.insert(value, data);\n145       }\n146 \n147       const newNode =\
    \ new BinarySearchTreeNode(value, data);\n148       this.setLeft(newNode);\n144\
    \ \n150       return newNode;\n151     }\n152 \n153     if (value > this.value)\
    \ {\n154       // Insert to the right.\n155       if (this.right) {\n156     \
    \    return this.right.insert(value, data);\n157       }\n158 \n159       const\
    \ newNode = new BinarySearchTreeNode(value, data);\n160       this.setRight(newNode);\n\
    161 \n162       return newNode;\n163     }\n164 \n165     return this;\n166  \
    \ }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `remove()`\n\
    \nBefore removing the node, we need to find it in the tree using the `find()`\
    \ function described above. After we find the correct node, several cases are\
    \ possible:\n\n- **Removing the leaf node**: remove a pointer to this node from\
    \ the parent node.\n- **Removing the node with one child**: make one and only\
    \ child to be a direct ancestor for the current node’s parent.\n- **Removing the\
    \ node with two children**: find the next biggest value (minimum value in the\
    \ right branch) and replace current node with that next biggest value node.\n\n\
    This method uses other helper methods like `removeChild()`, `findMin()`, `setValue()`,\
    \ `setRight()`, `replaceChild()`, and `copyNode()` that will be implemented below.\n\
    \n```\n221   /**\n222    * @param {*} value\n223    * @return {boolean}\n224 \
    \   */\n225   remove(value) {\n226     const nodeToRemove = this.find(value);\n\
    227 \n228     if (!nodeToRemove) {\n229       throw new Error('Item not found\
    \ in the tree');\n230     }\n231 \n232     const { parent } = nodeToRemove;\n\
    233 \n234     if (!nodeToRemove.left && !nodeToRemove.right) {\n235       // Node\
    \ is a leaf and thus has no children.\n236       if (parent) {\n237         //\
    \ Node has a parent. Just remove the pointer to this node from the parent.\n238\
    \         parent.removeChild(nodeToRemove);\n239       } else {\n240         //\
    \ Node has no parent. Just erase current node value.\n241         nodeToRemove.setValue(undefined);\n\
    242       }\n243     } else if (nodeToRemove.left && nodeToRemove.right) {\n244\
    \       // Node has two children.\n245       // Find the next biggest value (minimum\
    \ value in the right branch)\n246       // and replace current value node with\
    \ that next biggest value.\n247       const nextBiggerNode = nodeToRemove.right.findMin();\n\
    248       if (nextBiggerNode !== nodeToRemove.right) {\n249         this.remove(nextBiggerNode.value);\n\
    250         nodeToRemove.setValue(nextBiggerNode.value);\n251       } else {\n\
    252         // In case if next right value is the next bigger one and it doesn't\
    \ have le\\\n253         ft child\n254         // then just replace node that\
    \ is going to be deleted with the right node.\n255         nodeToRemove.setValue(nodeToRemove.right.value);\n\
    256         nodeToRemove.setRight(nodeToRemove.right.right);\n257       }\n258\
    \     } else {\n259       // Node has only one child.\n260       // Make this\
    \ child to be a direct child of current node's parent.\n261       /** @var BinarySearchTreeNode\
    \ */\n262       const childNode = nodeToRemove.left || nodeToRemove.right;\n263\
    \ \n264       if (parent) {\n265         parent.replaceChild(nodeToRemove, childNode);\n\
    266       } else {\n267         BinarySearchTreeNode.copyNode(childNode, nodeToRemove);\n\
    268       }\n269     }\n270 \n271     // Clear the parent of removed node.\n272\
    \     nodeToRemove.parent = null;\n273 \n274     return true;\n275   }\n```\n\n\
    `06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `traverseOrder()`\n\nThis\
    \ method performs an in-order traversal of the BST, returning an array of sorted\
    \ values. It first traverses the left sub-tree, then the root, and finally the\
    \ right sub-tree.\n\n```\n276   /**\n277    * @return {Array\n278    */\n279 \
    \  traverseOrder() {\n280     let traverse = [];\n281     if (this.left) {\n282\
    \       traverse = traverse.concat(this.left.traverseOrder());\n283     }\n284\
    \     traverse.push(this.value);\n285 \n286     if (this.right) {\n287       traverse\
    \ = traverse.concat(this.right.traverseOrder());\n288     }\n289     return traverse;\n\
    290   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setLeft()`\n\
    \nThis method sets the left child of the current node. It also takes care of the\
    \ `parent` pointer, pointing it to the current node.\n\n```\n34   /**\n35    *\
    \ @param {BinarySearchTreeNode} node\n36    * @return {BinarySearchTreeNode}\n\
    37    */\n38   setLeft(node) {\n39     this.left = node;\n40     if (this.left)\
    \ {\n41       this.left.parent = this;\n42     }\n43     return this;\n44   }\n\
    ```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setRight()`\n\n\
    This method sets the right child of the current node. It also takes care of the\
    \ `parent` pointer, pointing it to the current node. \n\n```\n55   /**\n56   \
    \ * @param {BinarySearchTreeNode} node\n57    * @return {BinarySearchTreeNode}\n\
    58    */\n59   setRight(node) {\n60     this.right = node;\n61     if (this.right)\
    \ {\n62       this.right.parent = this;\n63     }\n64     return this;\n65   }\n\
    ```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setData()`\n\n\
    `setData` is a helper function that we will use for setting the node `data`. We\
    \ return `this` object to allow us to chain methods. This method makes working\
    \ with the tree more convenient. We can do something like this: `bst.setValue(5).setData('User\
    \ name')`.\n\n```\n24   /**\n25    * @param {*} data\n26    * @return {BinarySearchTreeNode}\n\
    27    */\n28   setData(data) {\n29     this.data = data;\n30 \n31     return this;\n\
    32   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `setValue()`\n\
    \n`setValue` is a helper function that we will use for setting the node `value`.\
    \ We return `this` object to allow for method chaining.\n\n```\n14   /**\n15 \
    \   * @param {*} value\n16    * @return {BinarySearchTreeNode}\n17    */\n18 \
    \  setValue(value) {\n19     this.value = value;\n20 \n21     return this;\n22\
    \   }\n```\n\n`06-binary-search-tree/BinarySearchTreeNode.js`\n\n### `contains()`\n\
    \nThis is a helper method that returns `true` or `false` showing if the node with\
    \ the specified `value` exists in the tree.\n\n```\n191   /**\n192    * @param\
    \ {*} value\n193    * @return {boolean}\n194    */\n195   contains(value) {\n\
    196     return !!this.find(value);\n197   }\n```\n"
