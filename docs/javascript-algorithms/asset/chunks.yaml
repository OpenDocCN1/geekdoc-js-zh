  trans: "\n\n```javascript\n/**\n * @param {number} number\n * @return {number}\n\
    \ */\nexport default function divideByTwo(number) {\n  return number >> 1;\n}\n\
    ```\n\n`09-bit-manipulation/divideByTwo.js`\n\n### 切换符号\n\n此方法将正数转换为负数，将负数转换为正数。为了实现这一点，它使用了“补码”方法，通过反转数字的所有位并加\
    \ 1。\n\n```\n1101 -3\n1110 -2\n1111 -1\n0000  0\n0001  1\n0010  2\n0011  3\n```\n\
    \n将 5 切换为 -5：\n\n`000101` = 5\n\n反转位：\n\n`111010`\n\n加 1：\n\n`111011`\n\n然后将 -5\
    \ 切换回 5：\n\n`111011` = -5\n\n反转位：\n\n`000100`\n\n加 1：\n\n`000101`\n\n```javascript\n\
    /**\n * 使用“补码”方法切换数字符号。\n * @param {number} number\n * @return {number}\n */\n\
    export default function switchSign(number) {\n  return ~number + 1;\n}\n```\n\n\
    `09-bit-manipulation/switchSign.js`\n\n### 两个符号数相乘\n\n此方法使用位运算符对两个符号整数进行乘法。此方法基于以下事实：\n\
    \n```\na * b 可以写为以下格式：\n  0                     如果 a 为零或 b 为零或 a 和 b 均为零\n  2a\
    \ * (b/2)            如果 b 为偶数\n  2a * (b - 1)/2 + a    如果 b 为奇数且为正数\n  2a * (b\
    \ + 1)/2 - a    如果 b 为奇数且为负数\n```\n\n这种方法的优点是在每个递归步骤中，其中一个操作数都会减少到原值的一半。因此，运行时间复杂度为\
    \ `O(log(b))`，其中 `b` 是每个递归步骤中减半的操作数。\n\n```javascript\nimport multiplyByTwo from\
    \ './multiplyByTwo';\nimport divideByTwo from './divideByTwo';\nimport isEven\
    \ from './isEven';\nimport isPositive from './isPositive';\n\n/**\n * 使用位运算执行两个符号数的乘法。\n\
    \ *\n * 如果 a 为零或 b 为零或如果 a 和 b 均为零：\n * multiply(a, b) = 0\n *\n * 如果 b 为偶数：\n\
    \ * multiply(a, b) = multiply(2a, b/2)\n *\n * 如果 b 为奇数且为正数：\n * multiply(a, b)\
    \ = multiply(2a, (b-1)/2) + a\n *\n * 如果 b 为奇数且为负数：\n * multiply(a, b) = multiply(2a,\
    \ (b+1)/2) - a\n *\n * 时间复杂度: O(log b)\n *\n * @param {number} a\n * @param {number}\
    \ b\n * @return {number}\n */\nexport default function multiply(a, b) {\n  //\
    \ 如果 a 为零或 b 为零或如果 a 和 b 均为零，则结果也是零。\n  if (b === 0 || a === 0) {\n    return\
    \ 0;\n  }\n\n  // 否则我们将面临上述的四种不同情况。\n  const multiplyByOddPositive = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b - 1)) + a;\n  const multiplyByOddNegative = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b + 1)) - a;\n\n  const multiplyByEven = () => multiply(multiplyByTwo(a),\
    \ divideByTwo(b));\n  const multiplyByOdd = () => (isPositive(b) ? multiplyByOddPositive()\
    \ : multiplyByOddNegative());\n\n  return isEven(b) ? multiplyByEven() : multiplyByOdd();\n\
    }\n```\n\n`09-bit-manipulation/multiply.js`\n\n### 两个无符号数相乘\n\n此方法使用位运算符对两个整数相乘。此方法基于“每个数字都可以表示为\
    \ 2 的幂之和”。\n\n位乘法的核心思想是每个数字都可以被拆分为 2 的幂之和：\n\n```\n19 = 2⁴ + 2¹ + 2⁰\n```\n\n\
    然后将数字 `x` 乘以 `19` 等同于：\n\n```\nx * 19 = x * 2⁴ + x * 2¹ + x * 2⁰\n```\n\n现在我们需要记住\
    \ `x * 2⁴` 等同于将 `x` 向左移动 `4` 位。\n\n```javascript\n/**\n * 使用位运算符相乘无符号数。\n * 位乘法的核心思想是每个数字都可以被拆分为\n\
    \ * 2 的幂之和：\n * 19 = 2⁴ + 2¹ + 2⁰\n * 那么将数字 x 乘以 19 等同于：\n * x * 19 = x * 2⁴ +\
    \ x * 2¹ + x * 2⁰\n * 现在我们需要记住 (x * 2⁴) 等同于将 x 移动 4 位 (x << 4)。\n * @param {number}\
    \ number1\n * @param {number} number2\n */\nexport default function multiplyUnsigned(number1,\
    \ number2) {\n  let result = 0;\n  let bitIndex = 0;\n  let multiplier = number2;\n\
    \  // 遍历 number2 的位。\n  while (multiplier !== 0) {\n    // 检查当前位是否设置。\n    if\
    \ (multiplier & 1) {\n      // 如果 multiplier 的 bitIndex 位设置\n      // 我们需要将 number1\
    \ 左移 bitIndex 加到结果中。\n      result += number1 << bitIndex;\n    }\n    bitIndex\
    \ += 1;\n    multiplier >>= 1;\n  }\n  return result;\n}\n```\n\n`09-bit-manipulation/multiplyUnsigned.js`\n\
    \n### 计算置位\n\n此方法使用位运算符统计数字中的置位（1）。当数字大于 0 时，我们每次将数字向右移一位并与 1 进行 `AND` 运算，以确定该位是否设置。\n\
    \n5 的二进制表示 -> `000101` 置位计数：0 移 1 位 -> `00010` 置位计数：1 移 2 位 -> `00001` 置位计数：2\
    \ 移 3 位 -> `00000`\n\n数字现在为 0，停止循环。\n\n置位计数为 2。\n\n```javascript\n/**\n * @param\
    \ {number} originalNumber\n * @return {number}\n */\nexport default function countSetBits(originalNumber)\
    \ {\n  let setBitsCount = 0;\n  let number = originalNumber;\n  while (number)\
    \ {\n    // 将数字的位加到置位计数。\n    setBitsCount += number & 1;\n\n    // 向右移一位检查其他位。\n\
    \    number >>= 1;\n  }\n  return setBitsCount;\n}\n```\n\n`09-bit-manipulation.js`\n\
    \n### 计算位差异\n\n此方法确定两个数字之间不同的位。通过使用 `XOR` 运算，我们可以确定两个数字之间不同的位，然后使用 `countSetBits`\
    \ 函数获取总数。\n\n```\n000101 ^ 000001 = 000100\n需要翻转的位数：1\n```\n\n```javascript\n\
    import countSetBits from './countSetBits';\n\n/**\n * 统计为了将 numberA 转换为 numberB\n\
    \ * 需要改变的位。\n *\n * @param {number} numberA\n * @param {number} numberB\n * @return\
    \ {number}\n */\nexport default function bitsDiff(numberA, numberB) {\n  return\
    \ countSetBits(numberA ^ numberB);\n}\n```\n\n`09-bit-manipulation/bitsDiff.js`\n\
    \n### 计算数字有效位数\n\n为了计算有效位数，我们需要每次将 `1` 向左移一位，并查看移动后的数字是否大于输入数字。\n\n5 = `000101`\
    \ 1 的初始二进制表示 -> `000001` 位计数：0 移 1 位 -> `000010` (2 < 5) 移 2 位 -> `000100` (4\
    \ < 5) 移 3 位 -> `001000` (8 > 5)\n\n有效位数是：3。当我们移动 4 次时，它就大于 5 了。\n\n```javascript\n\
    /**\n * 返回二进制表示中使用的位数。\n * @param {number} number\n * @return {number}\n */\n\
    export default function bitLength(number) {\n  let bitsCounter = 0;\n  while ((1\
    \ << bitsCounter) <= number) {\n    bitsCounter += 1;\n  }\n  return bitsCounter;\n\
    }\n```\n\n"
