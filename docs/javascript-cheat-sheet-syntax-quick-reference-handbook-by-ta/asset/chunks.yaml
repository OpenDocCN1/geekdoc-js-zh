    \n# Syntax Chart\n\n## `<script>` syntax:\n\n```html\n<script>\n\n……\n\n</script>\n\
    ```\n\n// `\"<script>……</script>\"` is a tag for JavaScript. The JavaScript codes\
    \ are included within it.\n// We can also use `<script type = \"text/javascript\"\
    >…</script>`.\n// We can also use `<script language=\"javascript\">…</script>`.\n\
    \ne.g.\n```html\n<script>\ndocument.write(\"Hello World!\");\n</script>\n```\n\
    // Output: Hello World!\n\n## `$` syntax:\n\n```javascript\nvar $ = value; //\
    \ \"$\" can be treated as a letter\nlet $ = value; // \"$\" can be treated as\
    \ a letter\n// $$ can be treated as two letters,\n// $$$ can be treated as three\
    \ letters.\n```\n\ne.g.\n```javascript\n<script>\nlet $ =100;  let $$ = 200; \
    \ // define variables\ndocument.write( $ + $$ );\n</script>\n```\n// Output: 300\n\
    \n## `? :` operator syntax:\n\n```javascript\n(test-expression) ? (if-true-do-this)\
    \ : (if-false-do-this);\n```\n// if `test-expression` returns true, run `if-true-do-this`\n\
    // if `test-expression` returns false, run `if-false-do-this`\n\ne.g\n```javascript\n\
    <script>\nvar x=100; var y=200;\nvar result = (x < y) ? \"apple\" : \"banana\"\
    ;\ndocument.write( result );\n</script>\n```\n// Output: apple\n\n## `??` syntax:\n\
    \n```javascript\nargument1 ?? argument2;\n```\n// Return the first argument if\
    \ the first argument is null or undefined.\n// Return the second argument if the\
    \ first argument is null or undefined.\n\ne.g.\n```javascript\n<script>\nvar fruit1\
    \ = null;\nvar fruit2 = \"Apple\";\nvar fruit = fruit1 ?? fruit2;\ndocument.write(\"\
    My fruit is \" + fruit);\n</script>\n```\n// Output: My fruit is Apple\n\n## `===`\
    \ syntax:\n\n```javascript\nvariable1 === variable2\n```\n// Return true if the\
    \ type and value of `variable1` is equal to the type and value of `variable2`.\
    \ Otherwise return false.\n\ne.g.\n```javascript\n<script>\nvar x = \"Hello\"\
    ; var y = \"Hello\";\ndocument.write( x === y );\n</script>\n```\n// Output: true\n\
    \n## `\"+\"` strings syntax:\n\n```javascript\nstr = str1 + str2;\n```\n// `+`\
    \ operators can connect two strings together.\n\ne.g.\n```javascript\n<script>\n\
    s1=\"JavaScript \"; s2=\" is very easy!\";\nstr = s1 + s2;\ndocument.write(str);\n\
    </script>\n```\n// Output: JavaScript is very easy!\n\n## `abs()` syntax:\n\n\
    ```javascript\nMath.abs(number)\n```\n// `Math.abs()` returns an absolute value\
    \ of a number.\n\ne.g.\n```javascript\n<script>\nvar num = Math.abs( -100 );\n\
    document.write( num + \" \");\n</script>\n```\n// Output: 100 \n\n## `acos()`\
    \ syntax:\n\n```javascript\nMath.acos(number)\n```\n// Return the arccosine (radians)\
    \ of a number.\n// The parameter `number` is expected between -1 and 1.\n\ne.g.\n\
    ```javascript\n<script>\ndocument.write(Math.acos(0.5));\n</script>\n```\n// Output:\
    \ 1.0471975511965979\n\n## `acosh()` syntax:\n\n```javascript\nMath.acosh(number)\n\
    ```\n// Get the hyperbolic arc-cosine of a number.\n\ne.g.\n```javascript\n<script>\n\
    document.write(Math.acosh(2));\n</script>\n```\n// Output: 1.3169578969248166\n\
    \n## `add()` syntax:\n\n```javascript\nset.add(value)\n```\n// Add a value to\
    \ a Set.\n\ne.g.\n```javascript\n<script>\nconst mySet = new Set(); // create\
    \ a Set\nmySet.add(\"a\"); // add values to the mySet\nmySet.add(\"b\");\nmySet.add(\"\
    c\");\ndocument.write(mySet.size); // show the size of mySet\n</script>\n```\n\
    // Output: 3\n\n## `addEventListener()` syntax:\n\n```javascript\ndocument.getElementById(\"\
    Btn\").addEventListener(\"click\", function(){});\n```\n"
