    ```\n// Return the domain of the server\n\n### Example:\n\n```javascript\ndocument.write(document.domain);\n\
    ```\n// Output: [current domain]\n\n---\n\n## element Syntax\n\n```javascript\n\
    document.element\n```\n// Get or set element value.\n\n### Example:\n\n```javascript\n\
    // Get the value of the element\n```\n\n---\n\n## endsWith() Syntax\n\n```javascript\n\
    string.endsWith(search, end)\n```\n// Return `true` if string ends with a specified\
    \ value\n// The `endsWith()` method is case sensitive.\n\n### Example:\n\n```javascript\n\
    var str = \"HTML CSS is very easy\";\ndocument.write(str.endsWith(\"easy\"));\n\
    ```\n// Output: true\n\n---\n\n## entries Syntax\n\n```javascript\nconst obj =\
    \ arr.entries();\n```\n// \"entries\" returns an object with array/value pairs.\n\
    \n### Example:\n\n```javascript\nconst arr = [\" Apple\", \" Banana\", \" Cherry\"\
    ];\nconst obj = arr.entries();\nfor (let n of obj) {\n  document.write(n + \"\
    <br>\");\n}\n```\n// Output:\n0, Apple\n1, Banana\n2, Cherry\n\n---\n\n## eval()\
    \ Syntax\n\n```javascript\neval(expression)\n```\n// Evaluate the expression.\
    \ Please do not use `eval()` as possible, because it can run any code, and cause\
    \ security problem.\n\n### Example:\n\n```javascript\nlet x = 10; let y = 20;\n\
    let sum = eval(x+y);\ndocument.write(sum);\n```\n// Output: 30\n\n---\n\n## every()\
    \ Syntax\n\n```javascript\narray.every(callback_function);\n```\n// \"every()\"\
    \ checks if all element values meet a specified condition.\n// Return `true` if\
