  trans: "\n\n## `onKeyUp` 语法\n\n`onKeyUp = \"function( )\"`\n\n`onKeyUp = \"function(\
    \ )\"` 意味着当按键释放时，会立即运行 `function( )`。\n\n例如：\n\n``````html\n<html><script type=\"\
    text/JavaScript\">\n\nfunction myFunction(msg) { document.write (msg);}\n</script>\
    \  \n\n<body onKeyUp =\"myFunction('KeyUp event occurs!')\">\n\n请按下按键，然后释放。 \n\
    \n</body></html\n```\n// 输出: `KeyUp event occurs!`\n\n---\n\n## `onload` 语法\n\n\
    `onLoad  = \"function( )\"`\n\n`onLoad = \"function( )\"` 在网页加载完成时执行该函数。\n\n例如：\n\
    \n``````html\n<html><body onLoad = \"myFun()\">   <!-- 载入事件 -->\n<script>\nfunction\
    \ myFun(){\ndocument.write (\"Welcome to my website!\");\n}\n</script>\n\n</body></html\n\
    ```\n// 输出: `Welcome to my website!`\n\n---\n\n## `onmousedown` 语法\n\n`<element\
    \ onmousedown=\"function()\">`\n\n// 当鼠标在元素上点击按下时，运行 `function()`。\n\n例如：\n\n\
    ``````html\n<h3 onmousedown=\"fun()\">\n\n请在我身上点击按下鼠标！\n\n</h3>\n<script>\nfunction\
    \ fun(){\nalert(\"The mouse is clicked down on the text\");\n}\n</script>\n```\n\
    | // 输出: | `Please click mouse down on me!` |\n| `The mouse is clicked down on\
    \ the text` |\n\n---\n\n## `onmousemove` 语法\n\n`<element onmousemove=\"function()\"\
    >`\n\n// 当鼠标在元素上移动时，运行 `function()`。\n\n例如：\n\n``````html\n<h3 onmousemove=\"\
    fun()\">\n\n请在我身上移动鼠标！\n\n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse\
    \ is moved on the text\");\n}\n</script>\n```\n| // 输出: | `Please move mouse on\
    \ me!` |\n| `The mouse is moved on the text` |\n\n---\n\n## `onmouseout` 语法\n\n\
    `onMouseOut = \"function( )\"`\n\n`onMouseOut = \"function( )\"` 意味着当鼠标指针移出元素范围时，会立即运行\
    \ `function( )`。\n\n例如：\n\n``````html\n<html><script type=\"text/javascript\"\
    >\n\nfunction myfunction() { alert (\"See You!\"); }\n</script>\n\n<body>\n\n\
    <textarea onMouseOut =\"myfunction()\">\n\n移开鼠标。</textarea>\n\n</body></html\n\
    ```\n// 输出: `See You!`\n\n---\n\n## `onmouseover` 语法\n\n`onMouseOver = \"function(\
    \ )\"`\n\n`onMouseOver = \"function( )\"` 当鼠标移动到元素上方时，立即执行该函数。\n\n例如：\n\n``````html\n\
    <html><script type=\"text/JavaScript\">\n\nfunction myFunction() {\nalert (\"\
    MouseOver event occurs!\");\n}\n</script>\n\n<body>      <!-- 鼠标悬停事件 -->\n<textarea\
    \ onMouseOver =\"myFunction()\">\n\n把鼠标放在在我身上!</textarea>\n\n</body></html\n```\n\
    // 输出: `MouseOver event occurs!`\n\n---\n\n## `onmouseup` 语法\n\n`<element onmouseup=\"\
    function()\">`\n\n// 当鼠标按钮在元素上释放时，运行 `function()`。\n\n例如：\n\n``````html\n<h3 onmouseup=\"\
    fun()\">\n\n请在我身上点击并释放按钮！\n\n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse\
    \ button is released up on the text\");\n}\n</script>\n```\n| // 输出: | `Please\
    \ click on me and release up the button!` |\n| `The mouse button is released up\
    \ on the text` |\n\n---\n\n## `onreset` 语法\n\n`onReset = \"function( )\"`\n\n\
    `onReset = \"function( )\"` 在表单重置时执行 `function( )`。\n\n例如：\n\n``````html\n<html>\n\
    \n<form onReset = \"alert('The form has been reset!')\">\n\n<input type = \"text\"\
    \ id = \"txt\">\n\n<input type = \"reset\" value = \"Reset\" >\n\n<!-- 重置事件 -->\n\
    \n</form>\n\n</html\n```\n// 输出: `The form has been reset!`\n\n---\n\n## `onresize`\
    \ 语法\n\n`<body onresize=\"function()\">`\n\n// 当浏览器窗口发生变化时，运行 `function()`。\n\n\
    例如：\n\n``````html\n<body onresize=\"fun()\">\n\n<p>请调整浏览器窗口的大小。</p>\n<script>\n\
    function fun(){ alert(\"The browser window changes!\");}\n</script>\n\n</body\n\
    ```\n// 输出: `Please resize the browser window.`\n`The browser window changes!`\n\
    \n---\n\n## `onscroll` 语法\n\n`<element onscroll=\"function()\">`\n\n// 当元素的滚动条发生滚动时，运行\
    \ `function()`。\n\n例如：\n\n``````html\n<textarea onscroll=\"fun()\">\n\nAAA\n\n\
    BBB\n\nCCC\n\nDDD\n\nEEE\n\nFFF\n\n</textarea>\n<script>\nfunction fun(){ alert(\"\
    The scrollbar is scrolled!\");}\n</script>\n```\n// 输出: `The scrollbar is scrolled!`\n\
    ![](img/image_rsrc837.jpg)\n\n---\n\n## `onselect` 语法\n\n`<element type=\"\" value=\"\
    \" onselect=\"function()\">`\n\n// 当元素内容被选中或高亮时，运行 `function()`。\n\n例如：\n\n``````html\n\
    <input type=\"text\" value=\"Highlight Me\" onselect=\"fun()\">\n<script>\nfunction\
    \ fun(){ alert(\"The text is being highlighting!\"); }\n</script>\n```\n| // 输出:\
    \ | ![](img/image_rsrc837.jpg) |\nThe text is being highlighting!\n\n---\n\n##\
    \ `onsubmit` 语法\n\n`onsubmit = \"function( )\"`\n\n`onsubmit = \"function( )\"\
    ` 在表单提交时执行 `function( )`。\n\n例如：\n\n``````html\n<html>\n\n<form onReset = \"alert('The\
    \ form has been reset!')\">\n\n<input type = \"text\" id = \"txt\">\n\n<input\
    \ type = \"reset\" value = \"Reset\" >\n\n<!-- 重置事件 -->\n\n</form>\n\n</html\n\
    ```\n// 输出: `The form has been reset!`\n\n---\n\n## `onunload` 语法\n\n`<body onunload=\"\
    function()\">`\n\n// 当页面卸载时，运行 `function()`。\n注意：由于浏览器版本或设置的原因，`onunload` 可能不起。不建议使用。\n\
    \n例如：\n\n``````html\n<body onunload=\"fun()\">\n\n<p>\"onunload\" event might\
    \ not work.</p>\n<script>\nfunction fun() { alert(\"See You!\"); }\n</script>\n\
    \n</body>\n```\n// 输出: `onunload` event might not work.\n`See You!`\n\n---\n\n\
    ## `open()` 语法\n\n`window.open( url, name, height, status, menubar, toolbar )`\n\
    \n`window.open` 可以打开一个新的自定义的窗口。\n\n`url` 参数意味着新窗口的 URL。\n`name` 参数意味着新窗口名称。\n\
    `width` 参数意味着新窗口的宽度。\n`height` 参数意味着新窗口的高度。\n`status` 参数定义窗口的状态栏。\n`menubar` 参数定义窗口的菜单栏。\n\
    `toolbar` 参数定义窗口的工具栏。\n\n例如：\n\n``````html\n<html>\n\n<script>\nfunction openWindow(){\n\
    windowObj = window.open(\" \",\"MyWindow\", \"height=200, width=350, toolbar=yes,\
    \ menubar=yes, status=no, top=200, left=200\"); // 打开一个自定义窗口并创建一个对象\nwindowObj.document.write(\"\
    This is a new window.\");\n}\n</script>\n\n<form><center><input type=\"button\"\
    \ onClick=\"openWindow()\" value=\"Open Window\"></center></form>\n\n</html\n\
    ```\n// 结果: 点击按钮时打开新窗口\n\n---\n\n## `opener` 语法\n\n`window.opener`\n\n// 如果 `window2`\
    \ 在 `window1` 中打开，则 `window2.opener` 返回 `window1`，而 `window2.opener.close()` 会关闭\
    \ `window1`。\n// opener 实际上是父窗口（即 `window1`）。\n\n例如：\n\n``````html\n<p id=\"w\"\
    >\n\n<button onclick=\"myFun()\">点击我</button>\n<script>\nfunction myFun() { //\
    \ 打开 window2\nconst window2 = window.open(\"\", \"\", \"width=200,height=100\"\
    );\nwindow2.opener.document.getElementById(\"w\").innerHTML=\"OK\";\n} // 在 window1\
    \ 中显示 \"OK\"\n</script>\n```\n// 输出: `OK`\n\n"
- fmt: "\n```javascript\ndocument.write(str.padStart(5,\"0\"));\n```\n\n</script>\n\
    \n// Output:   000Hi\n\n## parent syntax\n\n`parent.document`\n\n// Return a parent\
    \ window.\n\ne.g.\n\n```html\n<button onclick=\"myFun()\">Click Me</button>\n\n\
    <script>\nfunction myFun() {     // open a child window\nconst childWindow = window.open(\"\
    \", \"\", \"width=200,height=100\");\nparent.document.bgColor=\"green\";\n\n}\
    \     // set background green for parent window\n</script>\n```\n// Output:\n\
    |  |\n\n## parse() syntax\n\n`Date.parse(dateObject)`\n\n// Return the number\
    \ of milliseconds between January 1, 1970 and specified date.\n\ne.g.\n\n```html\n\
    <script>\nvar d = new Date (2010, 10, 1);  // create a date object\nvar result\
    \ = Date.parse(d);  \n// get the milliseconds from January 1, 1970 to specified\
    \ date \ndocument.write ( result );\n</script>\n```\n// Output:   1288587600000\n\
    \n## parseFloat() syntax\n\n`parseFloat(string)`\n\n// \"parseFloat(string)\"\
    \ can convert a string to a floating point number.\n\ne.g.\n\n```html\n<script>\n\
    var str1 = \"12.66\";  var str2 = \"68.22\";\nvar num1 = parseFloat( str1 ); \
    \     // convert to Float\nvar num2 = parseFloat( str2 );      // convert to Float\n\
    var addition = num1 + num2;     // add instead of join\ndocument.write ( addition\
    \ );\n</script>\n```\n// Output:   80.88\n\n## parseInt() syntax\n\n`parseInt(string)`\n\
    \n// \"parseInt(string)\" can convert a string to an integer number.\n\ne.g.\n\
    \n```html\n<script>\nvar str1 = \"12\";  var str2 = \"68\";\nvar num1 = parseInt(str1);\
    \  // convert to integer\nvar num2 = parseInt(str2);      // convert to integer\n\
    var addition = num1 + num2;  // add instead of join\ndocument.write ( addition\
    \ );\n</script>\n```\n// Output:   80\n\n## pathname syntax\n\n`location.pathname`\n\
    \n// Return the path name of the current page or url\n\ne.g.\n\n```html\n<script>\n\
    let path = location.pathname;\ndocument.write(path);\n</script>\n```\n// Output:\
    \   /myFolder/myFile.php\n\n## pi syntax\n\n`Math.PI`\n\n// `Math.PI` is a constant\
    \ that stores the value of pi.\n\ne.g.\n\n```html\n<script>\nvar pi = Math.PI;\n\
    document.write (\"The PI value is \" + pi);\n</script>\n```\n// Output:   The\
    \ PI value is 3.141592653589793\n\n## platform syntax\n\n`navigator.platform`\n\
    \n// Returns a platform where the browser is compiled.\n\ne.g.\n\n```html\n<script>\n\
    var pl = navigator.platform;\ndocument.write(\"Platform: \" + pl);\n</script>\n\
    ```\n// Output:   Platform: Win32\n\n## pop() syntax\n\n`array.pop()`\n\n// Remove\
    \ the last element of an array.\n\ne.g.\n\n```html\n<script>\nvar arr = [1,2,3,4,5,6];\n\
    arr.pop( );      // remove the last element of arr\ndocument.write (arr);\n</script>\n\
    ```\n// Output:   1,2,3,4,5\n\n## port syntax\n\n`location.port`\n\n// Return\
    \ a port number of the current page\n// If the default port number is 80 or 443,\
    \ browser will return nothing.\n\ne.g.\n\n```html\n<script>\nlet num = location.port;\n\
    document.write(\"The port number of the current page is: \" + num);\n</script>\n\
    ```\n// Output:   The port number of the current page is: (may be nothing)\n\n\
    ## POSITIVE_INFINITY syntax\n\n`Number.POSITIVE_INFINITY`\n\n// `POSITIVE_INFINITY`\
    \ means infinity, returns overflow\n\ne.g.\n\n```html\n<script>\nlet num = Number.POSITIVE_INFINITY;\n\
    document.write(num);\n</script>\n```\n// Output:   Infinity\n\n## pow() syntax\n\
    \n`Math.pow( x, y )`\n\n// Return the value of `x` to the power of `y`. Namely\
    \ (xy)\n\ne.g.\n\n```html\n<script>\nvar result = Math.pow(6, 2);\ndocument.write\
    \ ( result );\n</script>\n```\n// Output:   36\n\n## print() syntax\n\n`window.print()`\n\
    \n// print the contents of the current window.\n\ne.g.\n\n```html\n<script>\n\
    function printWin( ){\nwindow.print( );      // print the current window\n}\n\
    </script>\n<form>\n<input type=\"button\" onclick=\"printWin( )\" value=\"Print\"\
    >\n</form>\n```\n// Click \"Print\" button to print the content of the current\
    \ page\n\n## promise() syntax\n\n`new Promise(function(resolve, reject) {…}`\n\
    \n// `Promise()` can complete asynchronous tasks\n// `resolve` is used when the\
    \ program running is normal.\n// `reject` is used when an exception occurs.\n\n\
    e.g.\n\n```html\n<script>\nnew Promise(function(resolve, reject) {\nvar a = 100;\
    \  var b = 1;\nif (b == 0) reject(\"Divide zero, exception occurs!\");\nelse resolve(document.write(a\
    \ / b));\n})\n</script>\n```\n// Output:   100\n\n## prompt() syntax\n\n`window.prompt()`\n\
    \n// Prompt user to input something in a dialog box, for example, a user can enter\
    \ \"Yes, I like it.\", and then click the \"OK\" or \"Cancel\" button.\n\ne.g.\n\
    \n```html\n<script>\nvar data = window.prompt(\"Do you like JavaScript?\");\n\
    // prompt user to input something in dialog box.\n// `prompt()` stores the inputted\
    \ contents to the \"data\"\ndocument.write(data);\n</script>\n```\n// Output:\
    \   The message you have just inputted.\n\n## protocol syntax\n\n`location.protocol`\n\
    \n// Return the protocol of the current url\n// The protocol may be http:, https:,\
    \ file:, ftp:, mailto:\n\ne.g.\n\n```html\n<script>\nvar pr = location.protocol;\n\
    document.write(pr);\n</script>\n```\n// Output:   https:\n\n## prototype syntax\n\
    \n`Object.prototype.variable = value`\n\n// `Prototype` can provide additional\
    \ property to the object created by a constructor function. \n\ne.g.\n\n```html\n\
    <script>\nfunction Person(name, age) {   // constructor\nthis.name = name;\nthis.age\
    \ = age;\n}\nPerson.prototype.gender = \"Female\";     // add a property\nconst\
    \ student = new Person(\"Rosy\", 16);   // Create an object\ndocument.write(\"\
    The student is \" + student.name +\"<br>\" );\ndocument.write(\"The student is\
    \ \" + student.age +\"<br>\" );\ndocument.write(\"The student is \" + student.gender\
    \ +\"<br>\" );\n</script>\n```\n// Output:\nThe student is Rosy\nThe student is\
    \ 16\nThe student is Female\n\n## push() syntax\n\n`array.push()`\n\n// Add one\
    \ or more elements to the end of an array.\n\ne.g.\n\n```html\n<script>\nvar arr\
    \ = [1,2,3];\narr.push( 4, 5, 6 );      // add 4,5,6 to the end of \"arr\"\ndocument.write\
    \ (arr);\n</script>\n```\n// Output:   1,2,3,4,5,6\n\n## querySelectorAll() syntax\n\
    \n`var nodeList = document.querySelectorAll(\"tagName\")`\n\n// Query all elements\
    \ by tag name, and return a nodeList collection. The first list is `list[0]`,\
    \ the second list is `list[1]`……\n`nodeList.length` // get the length of the nodeList\
    \ collection.\n\ne.g.\n\n```html\n<html>\n<p>Text A</p>\n<p>Text B</p>\n<script>\n\
    var list = document.querySelectorAll(\"p\");\ndocument.write(\"There are \" +\
    \ list.length + \" lists<br>\");\ndocument.write (\"The second P contains \" +\
    \ list[1].innerHTML );\n</script>\n</html>\n```\n// Output:\nText A\nText B\n\
    There are 2 lists\nThe second P contains Text B\n\n## radio syntax\n\n`<input\
    \ type=\"radio\" name= \"same\" value= \"myValue\">`\n\n// A group of radio buttons\
    \ allows one circle to be checked at any time and submit the selected value to\
    \ handle.\n// Note: each radio name must be the same.\n\ne.g.\n\n```html\n<html><body><body>\n\
    <form name=\"myform\">\n<input type= \"radio\"  name=\"color\" value= \"Red\"\
    \ onClick= \"myfun(this.value )\"/> Red\n```\n"
