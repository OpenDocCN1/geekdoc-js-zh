    # JavaScript Cheat Sheet

    ( Cover all Basic JavaScript Syntaxes, More Than 300 Examples )

    Ray Yao


    ## About This Book

    This book covers all basic JavaScript syntaxes, almost each syntax entry lists
    a program example and result output. We can quickly reference the most helpful
    programming syntaxes, such as common command syntax, string function syntax, collection
    function syntax, class & object syntax……; all these syntaxes are very useful for
    programming.


    We can take this book as a basic syntax manual because its entries are arranged
    alphabetically so that we can easily reference the important syntax.


    Nowadays or in the future, the JavaScript Syntax Book can provide great help for
    coding both in our study and our work.


