    \n---\n\n## alert() 语法\n\n```javascript\nalert(contents);\n```\n// 弹出一个消息并显示指定的的内容\n\
    \ne.g.\n\n```html\n<script language=\"javascript\">\nalert(\"Hello World!\");\
