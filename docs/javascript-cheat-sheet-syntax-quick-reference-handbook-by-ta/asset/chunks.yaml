    \ the collection\n\n### Example:\n\n```html\n<html>\n<p>Text A</p>\n<p>Text B</p>\n\
    <script>\nvar coll = document.getElementsByTagName(\"p\");\ndocument.write(\"\
    There are \" + coll.length + \" elements\");\n</script>\n</html>\n```\n// Output:\
