    ### NEGATIVE_INFINITY syntax


    ```javascript

    Number.NEGATIVE_INFINITY;

    ```


    `Number.NEGATIVE_INFINITY` means negative infinity, returns overflow.


    e.g.

    ```html

    <script>

    let num = Number.NEGATIVE_INFINITY;

    document.write(num);

    </script>

    ```

    // Output: -Infinity


