    \ is found, otherwise null.\n\n### Example:\n\n```javascript\nvar patt=new RegExp(\"\
    o\");\ndocument.write(patt.exec(\"Hello\"));\n```\n// Output: o\n\n---\n\n## export\
    \ Syntax\n\n```javascript\nexport{ variable1, variable2, ……};\n```\n// Export\
