  trans: "\n\n## lastModified 语法：\n\n```javascript\ndocument.lastModified;\n```\n\
    // 返回文档最后修改的日期时间\n\ne.g.\n\n```html\n<p>此文档最后修改于：</p>\n<script>\nvar str = document.lastModified;\n\
    alert(str);\n</script>\n```\n// 输出: 此文档最后修改于: 07/02/2023 16:42:57\n\n## length\
    \ 语法：\n\n```javascript\narray.length\n```\n// 获取数组长度\n\ne.g.\n\n```html\n<script>\n\
    const pets = [\"ant\", \"bee\", \"cat\", \"dog\"];\nvar len = pets.length;\ndocument.write(\"\
    数组长度为: \" + len);\n</script>\n```\n// 输出: 数组长度为: 4\n\n## let 语法：\n\n```javascript\n\
    let variable; // 声明一个变量\nlet variable = value; // 定义一个带有值的变量\n```\n\ne.g.\n\n\
    ```html\n<script>\nlet x, y, z; // 声明三个变量\nlet str = \"Hello \"; // 定义一个带有值的变量\
    \ \"str\" \nx = 100; y = 200;\nz = x + y;\ndocument.write(str);\ndocument.write(z);\n\
    </script>\n```\n// 输出: Hello 300\n\n## link() 语法：\n\n```javascript\nstring.link(\
    \ String )\n```\n// `string.link( String )` 为字符串添加超链接。\n\ne.g.\n\n```html\n<script>\n\
    var str = \"请点击我!\";\nvar L = str.link(\"https://www.amazon.com/author/ray-yao\"\
    );\n// 为字符串添加超链接\ndocument.write (\"欢迎访问我们的网站: \" + L);\n</script>\n```\n// 输出:\
    \ 欢迎访问我们的网站: [请点击我](http://mybook.to/yaowining)\n\n## 局部变量语法：\n\n```javascript\n\
    function function-name ( var arg ) { // 定义一个函数\nvar local_variable = value; //\
