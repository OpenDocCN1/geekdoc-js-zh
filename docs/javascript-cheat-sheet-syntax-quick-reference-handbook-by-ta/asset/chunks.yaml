  trans: "\n\n# 将数据导出到任何需要导入数据的文件中。\n\n例如\n\n```javascript\nconst person = () => {\n\
    \  const name = \"Smith\";\n  const age = 17;\n  return name + ' is ' + age +\
    \ 'years old.';\n};\n\nexport default person;\n```\n\n// 请将此文件保存为 `person.js`，这样另一个文件\
    \ `importPerson.html` 就可以导入此文件。（查看默认导入语法）\n// 导出文件需要与导入文件配合使用\n\n## extends 语法:\n\
    \n```javascript\nclass BassClass { }; // 基类\nclass DerivedClass extends BassClass{\
    \ };\n```\n\n// 派生类可以扩展基类。\n// 派生类继承基类的所有属性和方法。\n\n例如\n\n```html\n<script>\nclass\
    \ Person { // 基类\n  name = \"Ray Yao\";\n}\nclass Author extends Person { // 派生类扩展基类\n\
    \  show() { return this.name; }\n}\n\nlet obj = new Author();\ndocument.write(obj.show());\n\
    </script>\n```\n// 输出: Ray Yao\n\n## filter() 语法:\n\n`array.filter(myFunction)`\n\
    \n// 创建一个包含符合条件的元素的新数组。\n\n例如\n\n```html\n<script>\nconst arr = [1, 2, 3, 4, 5];\
    \ \ndocument.write(arr.filter(function(element) {\n  return element > 2; // 过滤大于\
    \ 2 的元素\n}));\n</script>\n```\n// 输出: 3,4,5\n\n## find() 语法:\n\n`array.find(callback)`\n\
    \n// \"find()\" 返回第一个满足条件的元素值。\n\n例如\n\n```html\n<script>\nconst arr = [1, 2,\
    \ 3, 4, 5];\nvar first = arr.find(function(element) {\n  return element > 3; //\
    \ 查找大于 3 的元素\n});\ndocument.write(\"第一个元素是: \" + first);\n</script>\n```\n// 输出:\
    \ 4\n\n## findIndex() 语法:\n\n`array.findIndex(callback)`\n\n// \"findIndex()\"\
    \ 返回第一个满足条件的元素的索引。\n\n例如\n\n```html\n<script>\nconst arr = [10, 20, 30, 40, 50];\n\
    var index = arr.findIndex(function(element) {\n  return element > 30; // 查找大于\
    \ 30 的元素的索引\n});\ndocument.write(\"元素索引是: \" + index);\n</script>\n```\n// 输出:\
    \ 3\n\n## floor() 语法:\n\n`Math.floor(number)`\n\n// \"Math.floor()\" 返回小于或等于数字的最大整数。\n\
    \n例如\n\n```html\n<script>\ndocument.write(Math.floor(9.5));\n</script>\n```\n\
    // 输出: 9\n\n## focus() 语法:\n\n`document.getElementById(id).focus()`\n\n// 聚焦到某个元素\n\
    \n例如\n\n```html\n<input type=\"text\" id=\"myId\">\n<script>\nwindow.onload =\
    \ function() {\n  document.getElementById(\"myId\").focus();\n}\n</script>\n```\n\
    // 输出: (无输出)\n\n## for...in... 语法:\n\n`for (var property in object){…}`\n\n//\
    \ 遍历对象的属性。\n\n例如\n\n```html\n<script>\nvar exam = { Andy: 'A', Betty: 'B', Cindy:\
    \ 'C' };\nfor (var mark in exam) {\n  document.write(exam[mark] + \" \");\n}\n\
    </script>\n```\n// 输出: A B C\n\n## for 循环语法:\n\n`for(init; test-expression; increment)\
    \ { some code; }`\n\n// \"for 循环\"按照指定的次数重复执行代码块。\n\n例如\n\n```html\n<script>\n\
    for (var x = 0; x <= 5; x++) { // 循环 6 次\ndocument.write(x);\n}\n</script>\n```\n\
    // 输出: 012345\n\n## for...of...语法:\n\n`for (variable of collection){…}`\n\n//\
    \ \"for…of…\"遍历字符串、数组或任何集合的值。\n\n例如\n\n```html\n<script>\n// 遍历字符串\nconst str\
    \ = \"HELLO\";\nvar txt = \"\";\nfor (var myVar of str) { txt += myVar + \" ,\
    \ \"; }\ndocument.write(txt + \"<br>\");\n// 遍历数组\nconst arr = [\"A\", \"B\",\
    \ \"C\", \"D\", \"E\"];\nvar val = \"\";\nfor (var myVar of arr) { val += myVar\
    \ + \" , \"; }\n</script>\n```\n// 输出: H , E , L , L , O , A , B , C , D , E ,\n\
    \n## foreach() 语法:\n\n`array.forEach(myFunction)`\n\n// 为数组的每个元素调用一次函数。\n\n例如\n\
    \n```html\n<script>\nconst arr = [1, 2, 3, 4, 5];\nvar str = \"\";\nfunction myFun(value)\
    \ {\n  str += value + \" \";\n}\narr.forEach(myFun);\n</script>\n```\n// 输出: 1\
    \ 2 3 4 5\n\n"
- fmt: "\n# get date, month, year, day, fullyear syntax:\n\n`dateObject.getDate( )`\n\
    `dateObject.getMonth( )`\n`dateObject.getYear( )`\n`dateObject.getDay( )`\n`dateObject.getFullYear()`\
    \ \n\n- `getDate()` returns a date.\n- `getMonth( )` returns from `0` (January)\
    \ to `11` (December).\n- `getYear( )` returns a year, but need to add `1900`.\n\
    - `getDay( )` returns from `0` (Sunday) to `6` (Saturday).\n- `getFullYear()`\
    \ returns a year with the correct format.\n\n### e.g. \n\n```html\n<script>\n\
    var obj = new Date ( );     // create a date object\nvar m = obj.getMonth( ) +\
    \ 1;   // need add 1\nvar d = obj.getDate( );\nvar y = obj.getYear( ) + 1900;\
    \   // need add 1900\nvar fy = obj.getFullYear();\nvar day = obj.getDay();\ndocument.write\
    \ (  m + \" - \" + d + \" - \" + y +\"<br>\" );\ndocument.write ( day );   //\
    \ return from 0 (Sunday) to 6 (Saturday).\n</script>\n```\n\n// Output:\n9 - 6\
    \ - 2022\n2       \n\n---\n\n# get hours, minutes, seconds syntax:\n\n`dateObject.getHours(\
    \ )`     // get the hours\n`dateObject.getMinutes( )`   // get the minutes\n`dateObject.getSeconds(\
    \ )`   // get the seconds\n\n### e.g. \n\n```html\n<script>\nvar now = new Date(\
    \ );      // create a date object\nvar h = now.getHours( );\nvar m = now.getMinutes(\
    \ );\nvar s = now.getSeconds( );\ndocument.write ( \"The current time is:   \"\
    );\ndocument.write ( h + \":\" + m + \":\" + s );\n</script>\n```\n\n// Output:\
    \ The current time is: 21:57:40\n\n---\n\n# get() syntax:\n\n`map.get(key)`\n\
    // Get the value by the specified key in a `Map`\n\n### e.g. \n\n```html\n<script>\n\
    const myMap = new Map([[1, \" A\"],[2, \" B\"],[3, \" C\"]]);\ndocument.write(myMap.get(2));\n\
    </script>\n```\n\n// Output: B\n\n---\n\n# getAttribute() syntax:\n\n`getAttribute(\
    \ attribute )`\n// `getAttribute( attribute )` returns the value of a specified\
    \ attribute on an element.\n\n### e.g. \n\n```html\n<html><body>\n<p>Hello Dom!</p>\n\
    <script>\nvar text = document.getElementsByTagName(\"p\")[0];\ntext.setAttribute(\"\
    align\", \"center\");   // set attribute & value\nvar value = text.getAttribute(\"\
    align\");     // get attribute\ndocument.write( \"The 'Hello Dom!' is in the \"\
    \ + value);\n</script>\n</body></html>\n```\n\n// Output:     \nHello Dom!\nThe\
    \ 'Hello Dom!' is in the center\n\n---\n\n# getElementById() syntax:\n\n`document.getElementById(\"\
    element\").id`   \n// Get the element's id\n\n### e.g. \n\n```html\n<form id=\"\
    abc\" action=\"\">   \n</form>\n<script>\ndocument.write (\"The ID of the Form\
    \ is: \"\n+ document.getElementById(\"abc\").id);  // get the form's id   \n</script>\n\
    ```\n\n// Output: The ID of the Form is: abc\n\n---\n\n# getElementById() syntax:\n\
    \n`document.getElementById( ).innerHTML = value;`\n// `getElementById` accesses\
    \ an element by its `id`.\n// `innerHTML` displays contents in HTML document.\n\
    \n### e.g. \n\n```html\n<html>\n<div id = \"position\"></div>\n<script>\ndocument.getElementById(\"\
    position\").innerHTML= \"OK\";\n// show \"OK\" at the specified id \"position\"\
    \n</script>\n</html>\n```\n\n// Output:   OK\n\n---\n\n# getElementById().attribute\
    \ syntax:\n\n`document.getElementById(id).attribute = value;`\n// Assign a value\
    \ to the element's property\n\n### e.g. \n\n```html\n<html>\n<img id=\"photo\"\
    \ src=\"img1.gif\">\n<script>\ndocument.getElementById(\"photo\").src=\"img2.jpg\"\
    ;\n</script>\n</html>\n```\n\n// change the img1.gif to img2.jpg\n\n---\n\n# getElementById(id).style.property\
    \ syntax:\n\n`document.getElementById(id).style.property = value;`\n// Change\
    \ the style of the Html element\n\n### e.g. \n\n```html\n<html>\n<p id=\"hi\"\
    >Hello World!</p>\n<script>\ndocument.getElementById(\"hi\").style.color=\"green\"\
    ;\n</script>\n</html>\n```\n\n// output:   Hello World!\n\n---\n\n# getElementsByClassName()\
    \ syntax:\n\n`document.getElementsByClassName(\"MyClass\");`\n// Returns a collection\
    \ of all elements with the specified class name\n\n### e.g. \n\n```html\n<html>\n\
    <div class=\"MyClass\">Element1</div>\n<div class=\"MyClass\">Element2</div>\n\
    <script>\nvar collection = document.getElementsByClassName(\"MyClass\");\ncollection[0].innerHTML\
    \ = \"Very Good!\";\n</script>\n</html>\n```\n\n// Output: Very Good!\n\n---\n\
    \n# getElementsByTagName( ) syntax:\n\n`document.getElementsByTagName(tag )`\n\
    // Get elements by tag name, return a collection.\n\n### e.g. \n\n```html\n<ol>\n\
    <li>Red</li>\n<li>Yellow</li>\n</ol>\n<script>\nvar collection = document.getElementsByTagName(\"\
    li\");\ndocument.write(collection[0].innerHTML);\n</script>\n```\n\n// Output:\
    \ Red\n\n---\n\n# getTime() syntax:\n\n`dateObject.getTime()`\n// Return the number\
    \ of milliseconds since January 1, 1970.\n\n### e.g. \n\n```html\n<script>\nvar\
    \ d = new Date();\ndocument.write(d.getTime());\n</script>\n```\n\n// Output:\
    \ 166309512096\n\n---\n\n# getTimezoneOffset() syntax:\n\n`dateObject.getTimezoneOffset()`\n\
    // Return the time difference between UTC and local time. For example, if your\
    \ time is GMT+2, -120 will be returned.\n\n### e.g. \n\n```html\n<script>\nvar\
    \ obj = new Date();\nvar diff = obj.getTimezoneOffset();\ndocument.write(\"The\
    \ zone offset is: \" + diff);\n</script>\n```\n\n// Output: The time offset is:\
    \ 240\n\n---\n\n# get UTC hours, minutes, seconds syntax:\n\n`dateObject.getUTCHours(\
    \ )`     // get the hours\n`dateObject.getUTCMinutes( )`   // get the minutes\n\
    `dateObject.getUTCSeconds( )`   // get the seconds\n// UTC time is the same as\
    \ GMT (Greenwich Mean Time)\n\n### e.g. \n\n```html\n<script>\nvar now = new Date(\
    \ );      // create a date object\nvar h = now.getUTCHours( );\nvar m = now.getUTCMinutes(\
    \ );\nvar s = now.getUTCSeconds( );\ndocument.write ( \"The current UTC time is:\
    \   \");\ndocument.write ( h + \":\" + m + \":\" + s );\n</script>\n```\n\n//\
    \ Output: The current UTC time is: 1:8:43\n\n---\n\n# get UTC month, date, year,\
    \ day syntax:\n\n`object.getUTCMonth()+1`   // get utc month\n`object.getUTCDate()`\
    \   // get utc date\n`object.getUTCFullYear()`   // get utc year\n`object.getUTCDay()`\
    \   // get utc day\n// UTC time is the same as GMT (Greenwich Mean Time)\n// getUTCMonth()\
    \ returns from 0 to 11, it means from Jan to Dec.\n// getUtCDay() returns from\
    \ 0 to 6, it means from Sun to Sat.\n\n### e.g. \n\n```html\n<script>\nvar now\
    \ = new Date( );   // create a date object\nvar m = now.getUTCMonth( )+1;\nvar\
    \ d = now.getUTCDate( );\nvar y = now.getUTCFullYear();\nvar w = now.getUTCDay(\
    \ );\ndocument.write ( \"The UTC month, date, year, year, day is: \");\ndocument.write\
    \ ( m + \"-\" + d + \"-\" + y + \", \" + w);\n</script>\n```\n\n// Output: The\
    \ UTC month, date, year, year, day is:  7-1-2023, 6\n"
