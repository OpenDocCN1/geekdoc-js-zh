    prompt() syntax:


    window.prompt( );


    // Prompt user to input something in a dialog box, for example, a user can enter
    "Yes, I like it.", and then click the "OK" or "Cancel" button.


    e.g.


    <script>


    var data = window.prompt("Do you like JavaScript?");


    // prompt user to input something in dialog box.


    // prompt() stores the inputted contents to the "data"


    document.write(data);


    </script>


    // Output:   The message you have just inputted.


