    # go() 语法:


    ```javascript

    window.history.go(number);

    ```

    // 通过数字跳转到指定的网页。


    e.g.


    ```html

    <html

    <button onclick="history.history.go(-1)">后退</button>

    <button onclick="history.history.go(1)">前进</button>

    <button onclick="history.history.go(0)">刷新</button>

    </html>

    ```

    // 结果：

    // 点击按钮 "<button onclick="history. go(-1)">" 时，会返回上页。

    // 点击按钮 "<button onclick="history. go(1)">" 时，会前进到下一页。

    // 点击按钮 "<button onclick="history. go(0)">" 时，会刷新当前页面。


