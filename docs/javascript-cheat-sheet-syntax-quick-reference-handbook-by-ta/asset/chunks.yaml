  trans: "\n\n# 获取日期、月份、年份、日期、完整年份语法：\n\n`dateObject.getDate( )`\n`dateObject.getMonth(\
    \ )`\n`dateObject.getYear( )`\n`dateObject.getDay( )`\n`dateObject.getFullYear()`\
    \ \n\n- `getDate()` 返回日期。\n- `getMonth( )` 返回 `0`（1 月）到 `11`（12 月）。\n- `getYear(\
