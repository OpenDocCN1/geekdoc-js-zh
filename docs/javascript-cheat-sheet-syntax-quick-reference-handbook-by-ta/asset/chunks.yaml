    parent.insertBefore(newElement,child2); // 在 child2 之前插入

    </script>

    </html>

    ```

    // 输出:

    Text A

    New Text

    Text B


    ## instanceof 语法:


    `var variable = object instanceof type`


    // 如果对象是该类型的实例，则返回 true


    e.g.


    ```html

    <script>

    var fruit = ["Apple", "Banana", "Cherry"];

    document.write(fruit instanceof Array);    // 返回 true

    document.write(fruit instanceof Object);    // 返回 true

    document.write(fruit instanceof Number);    // 返回 false

    document.write(fruit instanceof String);    // 返回 false

    </script>

    ```

    // 输出: true true false false


    ## isArray() 语法:


    `array.isArray(object)`


    // 如果对象是数组，返回 true


    e.g.


    ```html

    <script>

    const letters = ["A", "B", "C"];

    document.write(Array.isArray(letters));

    </script>

    ```

    // 输出: true


    ## isNaN() 语法:


    `isNaN(value)`


    // 如果值不是数字，返回 true。


    e.g.


    ```html

    <script>

    var value = 100 / "Hello";     // Nan

    document.write(isNaN(value));

    </script>

    ```

    // 输出: true


    ## javaEnabled() 语法:


    `navigator.javaEnabled( )`


    // 浏览器是否支持 Java。

    // 注意：`navigator` 可能会返回不准确的信息。


    e.g.


    ```html

    <script>

    if ( navigator.javaEnabled( ) == true )

    document.write("The browser supports Java.");

    else

    document.write("The browser doesn''t support Java.");

    </script>

    ```

    // 输出: The browser supports Java.


    ## join 语法:


    `array.join( )`


    // 用逗号连接数组元素。


    e.g.


    ```html

    <script>

    var arr = new Array( );

    arr[0]="I";

    arr[1]="Love";

    arr[2]="JavaScript!";

    document.write(arr.join(", "));

    </script>

    ```

    // 输出: I, Love, JavaScript!


    ## json.parse() 语法:


    `JSON.parse(string)`


    // 将 JSON 字符串转换为对象


    e.g.


    ```html

    <script>

    var jsonStr = ''{"name":"Apple","color":"green"},{"name":"Banana","color":"yellow"},{"name":"Cherry":"red"}'';

    var jsObj = JSON.parse(jsonStr);

    document.write(jsObj[0].name + " " + jsObj[0].color);

    document.write(jsObj[1].name + " " + jsObj[1].color);

    document.write(jsObj[2].name + " " + jsObj[2].color);

    </script>

    ```

    // 输出: Apple greenBanana yellowCherry


    ## json.stringify() 语法:


    `JSON.stringify(object)`


    // 将 JavaScript 对象转换为 JSON 字符串。


    e.g.


    ```html

    <script>

    var jsObj= {"name":"Andy", "Lastname":"Smith", "Age":"17"};

    jsonStr = JSON.stringify(jsObj);

    document.write("<pre>" + jsonStr + "</pre>");

    </script>

    ```

    // 输出: {"name":"Andy","Lastname":"Smith","Age":"17"}


    ## key() 语法:


    `const keys = letters.keys()`


    // `keys()` 方法返回一个包含数组键的新迭代器对象。


    e.g.


    ```html

    <script>

    const letters = ["A", "B", "C", "D"];

    const keys = letters.keys(); // keys 是一个新的迭代器

    let index = "";

    for (let k of keys) {

    index += k + ",";

    }

    document.write(index);

    </script>

    ```

    // 输出: 0,1,2,3,


    ## language 语法:


    `navigator.language`


    // 返回浏览器语言


    e.g.


    ```html

    <script>

    let language = navigator.language;

    document.write("Browser language: " + language);

    </script>

    ```

    // 输出: Browser language: en-US


    ## lastIndexOf() 语法:


    `array.lastIndexOf( element )`


    // `lastIndexOf( )` 可以返回指定元素在数组中最后出现的位置。


    e.g.


    ```html

    <script>

    var arr = new Array( );

    arr[0] ="Mon"; arr[1] ="Tue"; arr[2] ="Wed"; arr[3] ="Tue";

    var index=arr.lastIndexOf ("Tue");    // 获取 "Tue" 的索引

    document.write (index);

    </script>

    ```

    // 输出: 3


    ## lastIndexOf() 语法:


    `array.lastIndexOf( word )`


    // `lastIndexOf( )` 可以返回指定单词在字符串中最后出现的位置。


    e.g.


    ```html

    <script>

    var str = "Please do what you decide to do!";

    var index = str.lastIndexOf("do");    // 返回索引

    document.write ( index );

    </script>

    ```

    // 输出: 29


