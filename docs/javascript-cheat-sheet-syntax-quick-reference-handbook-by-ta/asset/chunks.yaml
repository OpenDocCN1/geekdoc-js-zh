    // Set date and time by adding the milliseconds since 1/1/1970.


    e.g.


    ```html

    <script>

    const d = new Date();

    d.setTime(1656533882698);

    document.write(d);

    </script>

    ```

    // Output: Wed Jun 29 2022 16:18:02 GMT-0400 (Eastern Time)


    ## setTimeout() syntax:


    ```javascript

    window.setTimeout( "function()", milliseconds);

    ```

    `window.setTimeout()` can set the interval time to call the `function()` repeatedly.


    e.g.


    ```html

    <html>

    <body onload="autoTimer()">

    <script>

    var count=0;

    function autoTimer( ) {      // user-defined function

    count++;

    if (count <= 9) {

    document.write ( count );      // show the increasing numbers

    window.setTimeout( "autoTimer()" , 1000 );

    // call autoTime() every other 1 seconds

    }}

    </script>

    </body>

    </html>

    ```

    ```javascript

    // Output: 123456789

    ```


    ## set UTC date, month, year syntax:


    ```javascript

    dateObject.setUTCDate();      // set a date based on UTC

    dateObject.setUTCMonth();  // set a month based on UTC

    dateObject.setUTCFullYear();  // set a year based on UTC

    ```

    // UTC time is the same as GMT time (Greenwich Mean Time)


    e.g.


    ```html

    <script>

    var obj = new Date();      // create a date object

    obj.setUTCDate(18);

    obj.setUTCMonth(0);      // "0" means Jan, "11" means December.

    obj.setUTCFullYear(2016);

    var today = obj;

    document.write (today);

    </script>

    ```

    ```javascript

    // Output: Mon Jan 18 2016 08:54:16 GMT-0500 (Eastern Time)

    ```


    ## set UTC hours, minutes, seconds syntax:


    ```javascript

    dateObject.setUTCHours();  // set the hours based on UTC

    dateObject.setUTCMinutes();  // set the minutes based on UTC

    dateObject.setUTCSeconds();  // set the seconds based on UTC

    ```

    // UTC time is the same as GMT time (Greenwich Mean Time)


    e.g.


    ```html

    <script>

    var obj = new Date();      // create a date object

    obj.setUTCHours(9);  // UTC hour

    obj.setUTCMinutes(30);

    obj.setUTCSeconds(18);

    var now = obj;

    document.write (now);

    </script>

    ```

    ```javascript

    // Output: Wed Sep 07 2022 05:30:18 GMT-0400 (Eastern Time)

    ```


    ## shift() syntax:


    ```javascript

    array.shift();

    ```

    // Remove the first element of an array.


    e.g.


    ```html

    <script>

    var arr = [4,5,6];

    arr.shift( );      // remove the first element of the array

    document.write (arr);

    </script>

    ```

    ```javascript

    // Output: 5,6

    ```


    ## sign() syntax:


    ```javascript

    Math.sign(number)

    ```

    // Return 1 if the number is positive, return 0 if the number is zero, return
    -1 if the number is negative.


    e.g.


    ```html

    <script>

    document.write(Math.sign(10) + " ");

    document.write(Math.sign(0) + " ");

    document.write(Math.sign(-10) + " ");

    </script>

    ```

    ```javascript

    // Output: 1      0      -1

    ```


    ## sin() syntax:


    ```javascript

    Math.sin(radian)

    ```

    // Return the sine value of a radian.


    e.g.


    ```html

    <script>

    document.write(Math.sin(3.14).toFixed(2));

    </script>

    ```

    ```javascript

    // Output: 0.00

    ```


    ## sinh() syntax:


    ```javascript

    Math.sinh(number)

    ```

    // Get the hyperbolic sine of a number.


    e.g.


    ```html

    <script>

    document.write(Math.sinh(3));

    </script>

    ```

    ```javascript

    // Output: 10.017874927409903

    ```


    ## size syntax:


    ```javascript

    set.size      or    map.size

    ```

    // Get the size of a Set or a Map


    e.g.


    ```html

    <script>

    const mySet = new Set(["a","b","c"]);

    document.write(" mySet size " + mySet.size);

    const myMap = new Map([[1, " A"],[2, " B"],[3, " C"]]);

    document.write("Map size " + myMap.size + " ");

    </script>

    ```

    ```javascript

    // Output: mySet size 3 myMap size 3

    ```


    ## slice array syntax:


    ```javascript

    array.slice( start, last-1);

    ```

    // `array.slice(start, last-1)` can slice array into pieces, extracts elements
    from `start` to `last-1`. Index starts from 0.

    // `start` means the first element.

    // `last-1` means the `last-1` element.


    e.g.


    ```html

    <script>

    var arr = new Array( "a", "b", "c", "d", "e", "f" );

    var sli = arr.slice( 2, 5 ); // extract elements from index 2 to 5

    document.write( sli );

    </script>

    ```

    ```javascript

    // Output: c, e

    ```


    ## slice string syntax:


    ```javascript

    string.slice( start, last-1);

    ```

    // `string.slice(start, last-1)` can slice string into pieces, extracts letters
    from `start` to `last-1`. Index starts from 0.

    // `start` means the first letter.

    // `last-1` means the `last-1` letter.


    e.g.


    ```html

    <script>

    var str = "PowerShell";

    var s = str.slice( 5, 8 ); // extract letters from index 5 to 8

    document.write ( s );

    </script>

    ```

    ```javascript

    // Output: She

    ```


    ## slice array syntax (new array):


    ```javascript

    newArray = array.slice(index);

    ```

    // Slice a portion of an array and become a new array. `index` specifies the position
    to start slicing.


    e.g.


    ```html

    <script>

    const arr = ["A", "B", "C", "D", "E"];

    const newArr = arr.slice(2);

    document.write(newArr);

    </script>

    ```

    ```javascript

    // Output: "C", "D", "E"

    ```


    ## some() syntax:


    ```javascript

    array.some(callback_function);

    ```

    // `some()` checks if some element meet a specified condition. Return true if
    some element meet a specified condition.


    e.g.


    ```html

    <script>

    const arr = [10,20,30,40,50,60];

    var num = arr.some(myFun);

    document.write("Are element values greater than 20 ? " + num);

    function myFun(value) {

    return value > 20; // check if some element values are greater than 20

    }

    </script>

    ```

    ```javascript

    // Output: Are element values greater than 20 ? true

    ```


    ## sort array syntax:


    ```javascript

    array.sort();

    ```

    // `array.sort()` can sort array elements orderly.


    e.g.


    ```html

    <script>

    var arr = new Array( 2, 5, 3, 1, 4, 6 );

    arr.sort(); // sort all elements in order

    var s = arr.join(","); // join all elements by ","

    document.write ( s );

    </script>

    ```

    ```javascript

    // Output: 1,2,3,4,5,6

    ```


    ## split() syntax:


    ```javascript

    string.split(",") // Split on commas

    string.split(" ") // Split on spaces

    string.split("|") // Split on pipe

    ```

    // `split(" ")` can split a string into multiple substrings by the spaces in the
    string. But the separators are commas `","`.

    // `split()` is also used to convert a string into an array.


    e.g.


    ```html

    <script>

    var str = "JavaScript for Beginners";

    var substr = str.split( " " ); /* split str into substrings according to the spaces
    of str */

    document.write ( substr ); // shows substrings

    document.write ( "<br>" + substr[0]);

    document.write ( "<br>" + substr[1]);

    document.write ( "<br>" + substr[2]);

    </script>

    ```

    ```javascript

    // Output: JavaScript , for , Beginners

    JavaScript

    for

    Beginners

    ```


    ## splice() syntax:


    ```javascript

    array.splice(index, remove);

    ```

    // Add new elements to an array. `index` indicates the position to add elements.
    `remove` specifies how many original elements should be removed.


    e.g.


    ```html

    <script>

    const arr = ["A", "B", "C", "D"];

    arr.splice(2, 1, "10", "20", "30"); // add 3 elements at index 2, remove 1 original
    element "C"

    document.write(arr);

    </script>

    ```

    ```javascript

    // Output: A,B,10,20,30,D

    ```


    ## sqrt() syntax:


    ```javascript

    Math.sqrt();

    ```

    // Return the square root of a number.


    e.g.


    ```html

    <script>

