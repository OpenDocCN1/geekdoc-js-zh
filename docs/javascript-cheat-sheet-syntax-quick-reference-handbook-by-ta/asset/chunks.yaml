    \ 表\n\n# 语法表\n\n## `<script>` 语法：\n\n```html\n<script>\n\n……\n\n</script>\n```\n\
    \n// `\"<script>……</script>\"` 是 JavaScript 的标签。JavaScript 代码包含在其中。\n// 我们也可以使用\
    \ `<script type = \"text/javascript\">…</script>`。\n// 我们也可以使用 `<script language=\"\
    javascript\">…</script>`。\n\n例如：\n```html\n<script>\ndocument.write(\"Hello World!\"\
    );\n</script>\n```\n// 输出: Hello World!\n\n## `$` 语法：\n\n```javascript\nvar $\
    \ = value; // \"$\" 可以被视为字母\nlet $ = value; // \"$\" 可以被视为字母\n// $$ 可以被视为两个字母，\n\
    // $$$ 可以被视为三个字母。\n```\n\n例如：\n```javascript\n<script>\nlet $ =100;  \n</script>\n\
    ```\n// 输出: Hello World\n\n## `$` 语法：\n\n```javascript\n<script>\ndocument.write(\"\
    Hello World!\");\n</script>\n```\n// 输出: Hello World\n\n## `? :` 运算符语法：\n\n```javascript\n\
    (test-expression) ? true-value : false-value\n```\n// 如果 `test-expression` 为真，则返回\
    \ `true-value`；否则返回 `false-value`。\n\n例如：\n```javascript\n<script>\nlet $ =100;\
    \   \ndocument.write(\"100\");\n</script>\n```\n// 输出: 100\n\n## `??` 语法：\n\n\
    ```javascript\nargument1 ?? argument2;\n```\n// 如果第一个参数为 null 或 undefined，则返回第二个参数。\n\
    \n例如：\n```javascript\n<script>\nvar fruit1 = null; var fruit2 = \"Apple\";\ndocument.write(\"\
    Apple\");\n</script>\n```\n// 输出: Apple\n\n## `===` 语法：\n\n```javascript\nvariable1\
    \ === variable2\n```\n// 如果 `variable1` 的类型和值与 `variable2` 相等，则返回 true。\n\n例如：\n\
    ```javascript\n<script>\nvar x = \"Hello\"; var y = \"Hello\";\ndocument.write(\"\
    true\");\n</script>\n```\n// 输出: true\n\n## `\"+\"` 字符串语法：\n\n```javascript\n\
    str = str1 + str2;\n```\n// `+` 运算符可以连接两个字符串。\n\n例如：\n```javascript\n<script>\n\
    s1=\"JavaScript \"; s2=\" is easy!\";\ndocument.write(\"JavaScript is easy!\"\
    );\n</script>\n```\n// 输出: JavaScript is easy!\n\n## `abs()` 语法：\n\n```javascript\n\
    Math.abs(number)\n```\n// `Math.abs()` 返回数字的绝对值。\n\n例如：\n```javascript\n<script>\n\
    var num = Math.abs( -100 );\ndocument.write(\"100 \");\n</script>\n```\n// 输出:\
    \ 100\n\n## `acos()` 语法：\n\n```javascript\nMath.acos(number)\n```\n// 返回数字的反余弦（弧度）。\n\
    // 参数 `number` 预期在 -1 到 1 之间。\n\n例如：\n```javascript\n<script>\ndocument.write(\"\
    1.0471975511965979\");\n</script>\n```\n// 输出: 1.0471975511965979\n\n## `acosh()`\
    \ 语法：\n\n```javascript\nMath.acosh(number)\n```\n// 获取数字的双曲反余弦。\n\n例如：\n```javascript\n\
    <script>\ndocument.write(\"1.3169578969248166\");\n</script>\n```\n// 输出: 1.3169578969248166\n\
    \n## `add()` 语法：\n\n```javascript\nset.add(value)\n```\n//向 Set 添加值。\n\n例如：\n\
    ```javascript\n<script>\nconst mySet = new Set(); // 创建一个 Set\nmySet.add(\"a\"\
    ); // 向 mySet 中添加值\nmySet.add(\"b\");\nmySet.add(\"c\");\ndocument.write(mySet.size);\
    \ // 显示 mySet 的大小\n</script>\n```\n// 输出: 3\n\n## `addEventListener()` 语法：\n\n\
    ```javascript\ndocument.getElementById(\"Btn\").addEventListener(\"click\", function(){});\n\
    ```\n\n"
- fmt: "\n# Add event listener to the specified element\n\ne.g.\n\n```html\n<html>\n\
    <button id=\"Btn\">Click</button>\n<script>\ndocument.getElementById(\"Btn\").addEventListener(\"\
    click\", function(){ alert(\"Hi, My friends!\");});\n</script>\n</html>\n```\n\
    // Output: Hi, My friends!\n\n---\n\n## alert() syntax\n\n```javascript\nalert(contents);\n\
    ```\n// pops up a message and show the specified contents\n\ne.g.\n\n```html\n\
    <script language=\"javascript\">\nalert(\"Hello World!\"); // pop up a message\n\
    </script>\n```\n// Output: Hello World!\n\n---\n\n## anchors syntax\n\n```javascript\n\
    document.anchors\n```\n// `\"anchors\"` means `<a></a>` element.\n\ne.g.\n\n```html\n\
    <html>\n<a name = \"A\">Ruby</a><br>\n<a name = \"B\">Rust</a><br>\n<a name =\
    \ \"C\">Perl</a><br>\n<script>\nlet size = document.anchors.length; // get `<a></a>`\
    \ size\ndocument.write(\"The number of  'a' element is: \" + size);\n</script>\n\
    </html>\n```\n// Output:\nRuby\nRust\nPerl\nThe number of 'a' element is: 3\n\n\
    ---\n\n## anonymous function syntax\n\n```javascript\nvar handle = function(args)\
    \ { return value };\n```\n// Anonymous function has no function name, it is called\
    \ by a `handle`\n\ne.g.\n\n```html\n<script>\nvar handle = function (a, b) {return\
    \ a + b}; // anonymous function\ndocument.write(handle(10, 20));\n</script>\n\
    ```\n// Output: 30\n\n---\n\n## appCodeName syntax\n\n```javascript\nlet browser\
    \ = navigator.appCodeName;\n```\n// Get the code name of the browser\n// Note:\
    \ `\"navigator\"` may return an inaccurate information.\n\ne.g.\n\n```html\n<script>\n\
    let browser = navigator.appCodeName;\ndocument.write( \"Browser code name is :\
    \ \" + browser);\n</script>\n```\n// Output: Browser code name is : Mozilla\n\n\
    ---\n\n## appendChild() syntax\n\n```javascript\nwindow.document.createElement(\
    \ );\nappendClild( );\n```\n// `\"window.document.createElement( )\"` creates\
    \ an element with the specified name.\n// `\"appendClild( )\"` appends an element\
    \ as a last child element.\n\ne.g.\n\n```html\n<html>\n<br>\n<script>\nvar myLine\
    \ = document.createElement(\"hr\"); // creates an element \"hr\", a horizontal\
    \ ruled line tag\ndocument.body.appendChild(myLine); // appends a child element\
    \ \"myLine\" to the html body\n</script>\n</html>\n```\n// Output: _________________________\n\
    \n---\n\n## apply() syntax \n\n```javascript\nfunction.apply(this, array);\n```\n\
    // Call a function, the first argument must be the object itself.\n\ne.g.\n\n\
    ```html\n<script>\nfunction myFun(x, y) { return x + y;}\nvar myArr = [10, 20]\n\
    var myObj = myFun.apply(this, myArr); // call `myFun()`\ndocument.write(myObj);\n\
    </script>\n```\n// Output: 30\n\n---\n\n## apply() syntax (continued)\n\n```javascript\n\
    function.apply(arrayObj);\n```\n// Call s function with a specified array object.\n\
    // It can be applied to different array object.\n\ne.g.\n\n```html\n<script>\n\
    var student = {\ninfo: function() { // define a function\nreturn this.name + \"\
    \  \" + this.class;\n}}\nvar stud1 = { name:\"Andy\", class: \"Class 1\", } //\
    \ array\nvar stud2 = { name:\"Betty\", class: \"Class 2\", } // array\nvar detail\
    \ = student.info.apply(stud2); // call `info:function()`\n// show detail about\
    \ the student2\ndocument.write( detail );\n</script>\n```\n// Output: Betty Class\
    \ 2\n\n---\n\n## appName syntax\n\n```javascript\nlet browser = navigator.appName;\n\
    ```\n// Get browser name\n// Note: `\"navigator\"` may return an inaccurate information.\n\
    \ne.g.\n\n```html\n<script>\nlet browser = navigator.appName;\ndocument.write(\
    \ \"Browser Name is : \" + browser);\n</script>\n```\n// Output: Browser Name\
    \ is : Netscape\n\n---\n\n## appVersion syntax\n\n```javascript\nlet version =\
    \ navigator.appVersion;\n```\n// Get browser version\n// Note: `\"navigator\"\
    ` may return an inaccurate information.\n\ne.g.\n\n```html\n<script>\nlet version\
    \ = navigator.appVersion;\ndocument.write(\"Browser version is : \" + version);\n\
    </script>\n```\n// Output: Browser version is : 5.0 (Windows NT 6.3; WOW64) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome……\n\n---\n\n## arguments object syntax\n\n```javascript\n\
    arguments[index]\n```\n// `\"arguments\"` object can access the function arguments\n\
    \ne.g.\n\n```html\n<script>\nmyFun(10, 11, 12, 13, 14);\n</script>\n```\n*(Note:\
    \ The original text called `myFun` without definition in the snippet, but follows\
    \ the `arguments` logic)*\n\n---\n\n## array creating syntax\n\n```javascript\n\
    array-name = Array(\"value0\", \"value1\", \"value2\")\n```\n\n```\n\n```html\n\
    <script>\nvar arr = Array(\"red\", \"yellow\", \"green\");\ndocument.write(arr[0],\
    \ arr[1], arr[2]);\n</script>\n```\n// Output: red yellow green\n\n---\n\n## array\
    \ creating syntax (alternative)\n\n```javascript\narray-name = Array(\"value0\"\
    , \"value1\", \"value2\")\n```\n\n```html\n<script>\nvar color = [\"red\", \"\
    yellow\", \"green\"];\ndocument.write(color[0], color[1], color[2]);\n</script>\n\
    ```\n// Output: red yellow green\n\n---\n\n## arrow function syntax\n\n```javascript\n\
    let functionName = (argument) => { return value };\n```\n// The arrow function\
    \ is more concise than that ordinary function.\n\ne.g.\n\n```html\n<script>\n\
    const myFun = (x, y) => { x + y };\ndocument.write(myFun(100, 200));\n</script>\n\
    ```\n// Output: 300\n\n---\n\n## asin() syntax\n\n```javascript\nMath.asin( number\
    \ );\n```\n// Return the arcsine (radians) of a number.\n// The parameter number\
    \ is expected between -1 and 1.\n\ne.g.\n\n```html\n<script>\ndocument.write(\
    \ Math.asin(0.5));\n</script>\n```\n// Output: 0.523598775598298\n\n---\n\n##\
    \ asinh() syntax\n\n```javascript\nMath.asinh(number)\n```\n// Get the hyperbolic\
    \ arc-sine of a number\n\ne.g.\n\n```html\n<script>\ndocument.write(Math.asinh(1));\n\
    </script>\n```\n// Output: 0.881373587019542\n\n---\n\n## assert() syntax\n\n\
    ```javascript\nconsole.assert(test_expression, error_message);\n```\n// Show error\
    \ message in the console if test expression returns false.\n// To view the console,\
    \ please run a browser, press F12, click Console.\n\ne.g.\n\n```html\n<script>\n\
    let x = 10; let y = 20;\nconsole.assert(x > y, \"return false!'\");\n</script>\n\
    ```\n<p>After run this program, please press F12, then click \"Console\"</p>\n\
    // Output: Assertion failed: return false!'\n\n---\n\n## at() syntax\n\n```javascript\n\
    array.at(index)\n```\n// Return an element of the array based on the specified\
    \ index.\n\ne.g.\n\n```html\n<script>\nconst pets = [\"Ant\", \"Bee\", \"Cat\"\
    , \"Dog\"];\nvar result = pets.at(2);\ndocument.write(result);\n</script>\n```\n\
    // Output: Cat\n\n---\n\n## atan() syntax\n\n```javascript\nMath.atan(number);\n\
    ```\n// Return the arctangent value of a number between -PI/2 and PI/2 radians.\n\
    \ne.g.\n\n```html\n<script>\ndocument.write ( Math.atan(1));\n</script>\n```\n\
    // Output: 0.7853981633974483\n\n---\n\n## atanh() syntax\n\n```javascript\nMath.atanh(number)\n\
    ```\n"
