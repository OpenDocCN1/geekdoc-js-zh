    protocol syntax:


    location.protocol


    // Return the protocol of the current url


    // The protocol may be http:, https:, file:, ftp:, mailto:


    e.g.


    <script>


    var pr = location.protocol;


    document.write(pr);


    </script>


    // Output:   https:


