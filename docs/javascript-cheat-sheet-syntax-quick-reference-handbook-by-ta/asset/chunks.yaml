    ```\n// Output: Please press F12, then click the Consol tag\nIf you press F5 to\
    \ turn on the debugger, then you cannot see the following result 300.\n\n---\n\
    \n## Delete Array Element Syntax\n\n```javascript\ndelete array[index];\n```\n\
    // Delete an array element according its its index.\n// After the element has\
