    // 输出: Hello Dom!\n\n---\n\n## 数据类型语法\n\n- `string`: 字符或字符字符串\n- `number`: 整数或浮点数\n\
    - `boolean`: 值为 `true` 或 `false` 的值。\n- `function`: 用户定义的方法\n- `object`: 内置或用户定义的对象\n\
    \n### 示例：\n\n```javascript\nvar mystring=\"I am a string\"; // mystring 数据类型为\
    \ string。\nvar myinteger=168;  // myinteger 数据类型为 number。\nvar myfloat=12.88;\
    \  // myfloat 数据类型为 number。\nvar mybool=true;  // mybool 数据类型为 boolean。\n```\n\
    注意：`String` 始终由一对双引号包围。\n\n---\n\n## Date 对象语法\n\n```javascript\nvar dateObject\
    \ = new Date( ) // 创建日期对象\n```\n// 使用日期和时间时，我们必须先创建一个对象。\n\n### 示例：\n\n```javascript\n\
    var dateObject = new Date( );\ndocument.write ( dateObject );\n```\n// 输出: Thu\
    \ Nov 05 2015 21:39:28 GMT-0500 (Eastern Time)\n\n```javascript\nconst dateObj\
    \ = new Date(2022, 0, 18, 22, 36, 28, 0);\ndocument.write(dateObj);\n```\n// 输出:\
    \ Tue Jan 18 2022 22:36:28 GMT-0500 (Eastern Time)\n\n---\n\n## Debugger 语法\n\n\
    ```javascript\ndebugger;\n```\n// `debugger` 关键字停止执行 JavaScript 程序的某些。`debugger`\
    \ 用于设置断点。\n// 要检查结果：请通过 Chrome 浏览器运行程序 > F12 > Console……\n// 在 Console 中，如果我们按下\
    \ `F5` 开启调试器，则 `debugger;` 下方的代码将不会执行。\n\n### 示例：\n\n```javascript\ndocument.write(\
    \ \"Please press F12, then click the Consol tag\");\nvar result = 100 + 200;\n\
    console.log(\"If you press F5 to turn on the debugger, then you cannot see the\
    \ following result 300.\");\ndebugger; // 设置断点\nconsole.log(result);\n```\n//\
    \ 输出: Please press F12, then click the Consol tag\n如果你按下 F5 开启调试器，将无法看到下面的结果 300。\n\
    \n---\n\n## 删除数组元素语法\n\n```javascript\ndelete array[index];\n```\n// 根据索引删除数组元素。\n\
    // 元素被删除后，它将变为 \"undefined\"\n\n### 示例：\n\n```javascript\nconst letters = [\"\
    A\", \"B\", \"C\", \"D\"];\ndocument.write(\"The first letter is: \" + letters[0]\
    \ + \"<br>\");\ndelete letters[0]; // 删除数组元素\ndocument.write(\"The first letter\
    \ is: \" + letters[0] + \"<br>\");\n```\n// 输出: \nThe first letter is: A\nThe\
    \ first letter is: undefined\n\n---\n\n## delete() 语法\n\n```javascript\nmap.delete(key);\n\
    ```\n// 根据 Map 中指定的键删除 键/值对\n\n### 示例：\n\n```javascript\nconst myMap = new Map();\n\
    myMap.set(1, \" A\");\nmyMap.set(2, \" B\");\nmyMap.set(3, \" C\");\nmyMap.delete(3);\
    \ // 删除 (3, \"C\")\ndocument.write(myMap.size);\n```\n// 输出: 2\n\n---\n\n## do-while\
    \ 循环语法\n\n```javascript\ndo { // 此处某些 js 代码 } while ( test-expression);\n```\n\
    // \"do...while\" 循环一次代码块，如果指定的条件为真，则重复循环。\n\n### 示例：\n\n```javascript\nvar counter=0;\n\
    do {\n  document.write ( \"@\" );\n  counter++; // 每次循环加 1\n} while (counter<8);\
    \ // 循环 8 次\n```\n// 输出: @@@@@@@\n\n---\n\n## document.write() 语法\n\n```javascript\n\
    document.write( contents);\n```\n// 在网页中显示内容\n\n### 示例：\n\n```javascript\ndocument.write(\
    \ \"Hello World!\");\n```\n// 输出: Hello World!\n\n---\n\n## DOM 元素长度语法\n\n```javascript\n\
    var collection = document.getElementsByTagName(\"tagName\");\n```\n// `getElementsByTagName(\"\
    tagName\")` 通过 `tagName` 获取所有元素，并返回一个集合。\n`collection.length` // 获取集合的长度\n\n###\
    \ 示例：\n\n```html\n<html>\n<p>Text A</p>\n<p>Text B</p>\n<script>\nvar coll = document.getElementsByTagName(\"\
    p\");\ndocument.write(\"There are \" + coll.length + \" elements\");\n</script>\n\
    </html>\n```\n// 输出: There are 2 elements\n\n---\n\n## domain 语法\n\n```javascript\n\
    document.domain\n```\n// 返回服务器的域名\n\n### 示例：\n\n```javascript\ndocument.write(document.domain);\n\
    ```\n// 输出: [当前域名]\n\n---\n\n## element 语法\n\n```javascript\ndocument.element\n\
    ```\n// 获取或设置元素值\n\n### 示例：\n\n```javascript\n// 获取元素\n```\n\n---\n\n## endsWith()\
    \ 语法\n\n```javascript\nstring.endsWith(search, end)\n```\n// 如果字符串以指定的值结尾则返回 `true`\n\
    // `endsWith()` 方法对大小写敏感。\n\n### 示例：\n\n```javascript\nvar str = \"HTML CSS is\
    \ very easy\";\ndocument.write(str.endsWith(\"easy\"));\n```\n// 输出: true\n\n\
    ---\n\n## entries 语法\n\n```javascript\nconst obj = arr.entries();\n```\n// \"\
    entries\" 返回一个包含数组/值对的对象\n\n### 示例：\n\n```javascript\nconst arr = [\" Apple\"\
    , \" Banana\", \" Cherry\"];\nconst obj = arr.entries();\nfor (let n of obj) {\n\
    \  document.write(n + \"<br>\");\n}\n```\n// 输出:\n0, Apple\n1, Banana\n2, Cherry\n\
    \n---\n\n## eval() 语法\n\n```javascript\neval(expression)\n```\n// 计算表达式。不要使用 `eval()`，因为它运行任何代码并会导致安全问题。\n\
    \n### 示例：\n\n```javascript\nlet x = 10; let y = 20;\nlet sum = eval(x+y);\ndocument.write(sum);\n\
    ```\n// 输出: 30\n\n---\n\n## every() 语法\n\n```javascript\narray.every(callback_function);\n\
    ```\n// \"every()\" 检查所有元素值是否符合指定条件。\n// 如果所有元素值都符合指定条件，则返回 `true`。\n\n### 示例：\n\
    \n```javascript\nconst arr = [10,20,30,40,50,60];\nvar num = arr.every(myFun);\n\
    document.write(\"Are all element values greater than 20 ? \" + num);\n\nfunction\
    \ myFun(value) {\n  return value > 20; // 检查所有元素是否大于 20\n}\n```\n// 输出: Are all\
    \ element values greater than 20 ? false\n\n---\n\n## exec() 语法\n\n```javascript\n\
    pattern.exec(\"string\");\n```\n// `exec()` 使用正则表达式搜索字符，如果找到了匹配的字符则返回，否则返回 null。\n\
    \n### 示例：\n\n```javascript\nvar patt=new RegExp(\"o\");\ndocument.write(patt.exec(\"\
    Hello\"));\n```\n// 输出: o\n\n---\n\n## export 语法\n\n```javascript\nexport{ variable1,\
    \ variable2, ……};\n```\n// 将数据导出到任何需要导入数据的文件中。\n\n### 示例：\n\n```javascript\nconst\
    \ name = \"Smith\";\nconst age = 17;\nexport {name, age};\n```\n// 请将此文件保存为 \"\
    myExport.js\"，这样另一个文件 \"myImport.html\" 就可以导入此文件。\n\n---\n\n## export default\
    \ 语法\n\n```javascript\nexport default functionName;\n```\n\n"
- fmt: "\n# Export the data to any files that need to import the data.\n\ne.g.\n\n\
    ```javascript\nconst person = () => {\n  const name = \"Smith\";\n  const age\
    \ = 17;\n  return name + ' is ' + age + 'years old.';\n};\n\nexport default person;\n\
    ```\n\n// Please save this file as `person.js`, so that another file `importPerson.html`\
    \ can import this file. ( see the import default syntax )\n// The export file\
    \ needs to work with the import file.\n\n## extends syntax:\n\n```javascript\n\
    class BassClass { }; // base class\nclass DerivedClass extends BassClass{ };\n\
    ```\n\n// A bass class can be extended by a derived class.\n// The derived class\
    \ inherits all properties and methods of the bass class.\n\ne.g.\n\n```html\n\
    <script>\nclass Person { // bass class\n  name = \"Ray Yao\";\n}\nclass Author\
    \ extends Person { // derived class extends bass class\n  show() { return this.name;\
    \ }\n}\n\nlet obj = new Author();\ndocument.write(obj.show());\n</script>\n```\n\
    // Output: Ray Yao\n\n## filter() syntax:\n\n`array.filter(myFunction)`\n\n//\
    \ Create a new array with array elements that meet the condition.\n\ne.g.\n\n\
    ```html\n<script>\nconst arr = [1, 2, 3, 4, 5]; \ndocument.write(arr.filter(myFun));\
    \ // call myFun\nfunction myFun(value, index, array) {\n  return value >= 3 ;\
    \ // condition\n}\n</script>\n```\n// Output: 3, 4, 5\n\n## find() syntax:\n\n\
    `array.find(callback_fucntion)`\n\n// \"find()\" returns the value which is the\
    \ first element meeting a specified condition.\n\ne.g.\n\n```html\n<script>\n\
    const arr = [10,20,30,40,50,60];\nvar first = arr.find(myFun);\ndocument.write(\"\
    The first element value greater than 20 is : \" + first);\nfunction myFun(value,\
    \ index) {\n  return value > 20;\n}\n</script>\n```\n// Output: The first element\
    \ value greater than 20 is : 30\n\n## findIndex() syntax:\n\n`array.findIndex(callback_fucntion)`\n\
    \n// \"findIndex()\" returns the index which is the first element meeting a specified\
    \ condition.\n\ne.g.\n\n```html\n<script>\nconst arr = [10,20,30,40,50,60];\n\
    var first = arr.findIndex(myFun);\ndocument.write(\"The first element index whose\
    \ value is greater than 20 is : \" + first);\nfunction myFun(value, index) {\n\
    \  return value > 20;\n}\n</script>\n```\n// Output: The first element index whose\
    \ value is greater than 20 is : 2\n\n## floor() syntax:\n\n`Math.floor(argument)`\n\
    \n// \"Math.floor( );\" returns a closest integer that is less than or equal to\
    \ its argument.\n\ne.g.\n\n```html\n<script>\nvar num = 9.5;\ndocument.write (\"\
    Flooring number is \"+Math.floor( num ));\n</script>\n```\n// Output: Flooring\
    \ number is 9\n\n## focus() syntax:\n\n`document.getElementById(\"myId\").focus()`\n\
    \n// Focus to an element\n\ne.g.\n\n```html\n<input type=\"text\" id=\"myId\"\
    \ >\n<script>\nwindow.onload = function() {\n  document.getElementById(\"myId\"\
    ).focus();\n}\n</script>\n```\n// Output: | |\n\n## for…in… syntax:\n\n`for (\
    \ var property in object ) {…}`\n\n// Iterate over the properties of an object\n\
    \ne.g.\n\n```html\n<script>\nvar exam = { Andy: 'A', Betty: 'B', Cindy: 'C' };\n\
    for (var mark in exam) {\n  document.write(exam[mark] + \" \");\n}\n</script>\n\
    ```\n// Output: A B C\n\n## for loop syntax:\n\n`for( init, test-expression, increment)\
    \ { // some code; }`\n\n// \"for loop\" runs a block of code repeatedly by the\
    \ specified number of times.\n\ne.g.\n\n```html\n<script>\nfor (var x = 0; x <=\
    \ 5; x++) { // loop 5 times\ndocument.write ( x );\n}\n</script>\n```\n// Output:\
    \ 012345\n\n## for…of…syntax:\n\n`for (variable of collection){…}`\n\n// \"for…of…\"\
    loops through the values of a string, array, or any collection.\n\ne.g.\n\n```html\n\
    <script>\n// Iterate a string\nconst str = \"HELLO\";\nvar txt = \"\";\nfor (var\
    \ myVar of str) { txt += myVar + \" , \"; }\ndocument.write(txt + \"<br>\");\n\
    // Iterate an array\nconst arr = [\"A\", \"B\", \"C\", \"D\", \"E\"];\nvar val\
    \ = \"\";\nfor (var myVar of arr) { val += myVar + \" , \"; }\n</script>\n```\n\
    // Output: H , E , L , L , O , A , B , C , D , E\n\n## foreach() syntax:\n\n`array.forEach(myFunction)`\n\
    \n// Call a function for each element of the array.\n\ne.g.\n\n```html\n<script>\n\
    const arr = [1, 2, 3, 4, 5];\nvar str = \"\";\nfunction myFun(value) {\n  str\
    \ += value + \" \";\n}\narr.forEach(myFun);\n</script>\n```\n// Output: 1, 2,\
    \ 3, 4, 5\n"
