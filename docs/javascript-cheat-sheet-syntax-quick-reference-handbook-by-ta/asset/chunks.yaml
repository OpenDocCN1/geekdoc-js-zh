- fmt: "\n## `onKeyUp` syntax\n\n`onKeyUp = \"function( )\"`\n\n`onKeyUp = \"function(\
    \ )\"` means when a key is released, a `function( )` runs immediately.\n\ne.g.\n\
    \n```html\n<html><script type=\"text/JavaScript\">\n\nfunction myFunction(msg)\
    \ { document.write (msg);}\n</script>  \n\n<body onKeyUp =\"myFunction('KeyUp\
    \ event occurs!')\">\n\nPlease press a key, and release. \n\n</body></html\n```\n\
    // Output: `KeyUp event occurs!`\n\n---\n\n## `onload` syntax\n\n`onLoad  = \"\
    function( )\"`\n\n`onLoad = \"function( )\"` executes the function when a web\
    \ page has been loaded.\n\ne.g.\n\n```html\n<html><body onLoad = \"myFun()\">\
    \   <!-- load event -->\n<script>\nfunction myFun(){\ndocument.write (\"Welcome\
    \ to my website!\");\n}\n</script>\n\n</body></html\n```\n// Output: `Welcome\
    \ to my website!`\n\n---\n\n## `onmousedown` syntax\n\n`<element onmousedown=\"\
    function()\">`\n\n// Run `function()` when the mouse is clicked down on an element.\n\
    \ne.g.\n\n```html\n<h3 onmousedown=\"fun()\">\n\nPlease click mouse down on me!\n\
    \n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse is clicked down on the text\"\
    );\n}\n</script>\n```\n| // Output: | `Please click mouse down on me!` |\n| `The\
    \ mouse is clicked down on the text` |\n\n---\n\n## `onmousemove` syntax\n\n`<element\
    \ onmousemove=\"function()\">`\n\n// Run `function()` when the mouse is moved\
    \ on an element.\n\ne.g.\n\n```html\n<h3 onmousemove=\"fun()\">\n\nPlease move\
    \ mouse on me!\n\n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse is moved\
    \ on the text\");\n}\n</script>\n```\n| // Output: | `Please move mouse on me!`\
    \ |\n| `The mouse is moved on the text` |\n\n---\n\n## `onmouseout` syntax\n\n\
    `onMouseOut = \"function( )\"`\n\n`onMouseOut = \"function( )\"` means when the\
    \ mouse pointer moves out of an element, `function( )` runs immediately.\n\ne.g.\n\
    \n```html\n<html><script type=\"text/javascript\">\n\nfunction myfunction() {\
    \ alert (\"See You!\"); }\n</script>\n\n<body>\n\n<textarea onMouseOut =\"myfunction()\"\
    >\n\nmove the mouse away.</textarea>\n\n</body></html\n```\n// Output: `See You!`\n\
    \n---\n\n## `onmouseover` syntax\n\n`onMouseOver = \"function( )\"`\n\n`onMouseOver\
    \ = \"function( )\"` executes the function immediately when the mouse moves over\
    \ an element.\n\ne.g.\n\n```html\n<html><script type=\"text/JavaScript\">\n\n\
    function myFunction() {\nalert (\"MouseOver event occurs!\");\n}\n</script>\n\n\
    <body>      <!-- mouseover event -->\n<textarea onMouseOver =\"myFunction()\"\
    >\n\nPut the mouse on me!</textarea>\n\n</body></html\n```\n// Output: `MouseOver\
    \ event occurs!`\n\n---\n\n## `onmouseup` syntax\n\n`<element onmouseup=\"function()\"\
    >`\n\n// Run `function()` when the mouse button is released up on an element.\n\
    \ne.g.\n\n```html\n<h3 onmouseup=\"fun()\">\n\nPlease click on me and release\
    \ up the button!\n\n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse button\
    \ is released up on the text\");\n}\n</script>\n```\n| // Output: | `Please click\
    \ on me and release up the button!` |\n| `The mouse button is released up on the\
    \ text` |\n\n---\n\n## `onreset` syntax\n\n`onReset = \"function( )\"`\n\n`onReset\
    \ = \"function( )\"` executes the `function( )` when the form is reset.\n\ne.g.\n\
    \n```html\n<html>\n\n<form onReset = \"alert('The form has been reset!')\">\n\n\
    <input type = \"text\" id = \"txt\">\n\n<input type = \"reset\" value = \"Reset\"\
    \ >\n\n<!-- reset event -->\n\n</form>\n\n</html\n```\n// Output: `The form has\
    \ been reset!`\n\n---\n\n## `onresize` syntax\n\n`<body onresize=\"function()\"\
    >`\n\n// Run `function()` when the browser window is resized.\n\ne.g.\n\n```html\n\
    <body onresize=\"fun()\">\n\n<p>Please resize the browser window.</p>\n<script>\n\
    function fun(){ alert(\"The browser window changes!\");}\n</script>\n\n</body\n\
    ```\n// Output: `Please resize the browser window.`\n`The browser window changes!`\n\
    \n---\n\n## `onscroll` syntax\n\n`<element onscroll=\"function()\">`\n\n// Run\
    \ `function()` when the scrollbar of the element is scrolled.\n\ne.g.\n\n```html\n\
    <textarea onscroll=\"fun()\">\n\nAAA\n\nBBB\n\nCCC\n\nDDD\n\nEEE\n\nFFF\n\n</textarea>\n\
    <script>\nfunction fun(){ alert(\"The scrollbar is scrolled!\");}\n</script>\n\
    ```\n// Output: `The scrollbar is scrolled!`\n![](image_rsrc837.jpg)\n\n---\n\n\
    ## `onselect` syntax\n\n`<element type=\"\" value=\"\" onselect=\"function()\"\
    >`\n\n// Run `function()` when the element content is selected or highlighted.\n\
    \ne.g.\n\n```html\n<input type=\"text\" value=\"Highlight Me\" onselect=\"fun()\"\
    >\n<script>\nfunction fun(){ alert(\"The text is being highlighting!\"); }\n</script>\n\
    ```\n| // Output: | ![](image_rsrc837.jpg) |\nThe text is being highlighting!\n\
    \n---\n\n## `onsubmit` syntax\n\n`onsubmit = \"function( )\"`\n\n`onsubmit = \"\
    function( )\"` executes the `function( )` when the form is submitted.\n\ne.g.\n\
    \n```html\n<html>\n\n<form onReset = \"alert('The form has been reset!')\">\n\n\
    <input type = \"text\" id = \"txt\">\n\n<input type = \"reset\" value = \"Reset\"\
    \ >\n\n<!-- reset event -->\n\n</form>\n\n</html\n```\n// Output: `The form has\
    \ been reset!`\n\n---\n\n## `onunload` syntax\n\n`<body onunload=\"function()\"\
    >`\n\n// Run `function()` when the page is unloaded.\nNote: Because of browser\
    \ versions or settings, `onunload` might not work. It's not recommended to use.\n\
    \ne.g.\n\n```html\n<body onunload=\"fun()\">\n\n<p>\"onunload\" event might not\
    \ work.</p>\n<script>\nfunction fun() { alert(\"See You!\"); }\n</script>\n\n\
    </body>\n```\n// Output: `onunload` event might not work.\n`See You!`\n\n---\n\
    \n## `open()` syntax\n\n`window.open( url, name, height, status, menubar, toolbar\
    \ )`\n\n`window.open` can open a new customized window.\n\n`url` argument means\
    \ new window url.\n`name` argument means new window name.\n`width` argument means\
    \ the new window's width.\n`height` argument means the new window's height.\n\
    `status` argument defines window's status bar.\n`menubar` argument defines window's\
    \ menu bar.\n`toolbar` argument defines the window's toolbar.\n\ne.g.\n\n```html\n\
    <html>\n\n<script>\nfunction openWindow(){\nwindowObj = window.open(\" \",\"MyWindow\"\
    , \"height=200, width=350, toolbar=yes, menubar=yes, status=no, top=200, left=200\"\
    ); // open a customized window & create an object\nwindowObj.document.write(\"\
    This is a new window.\");\n}\n</script>\n\n<form><center><input type=\"button\"\
    \ onClick=\"openWindow()\" value=\"Open Window\"></center></form>\n\n</html>\n\
    ```\n// Result: Open a new window when the button is clicked\n\n---\n\n## `opener`\
    \ syntax\n\n`window.opener`\n\n// If `window2` is opened in `window1`, then `window2.opener`\
    \ returns `window1`, and `window2.opener.close()` closes `window1`.\n// The opener\
    \ window actually is a parent window. (Namely `window1`).\n\ne.g.\n\n```html\n\
    <p id=\"w\">\n\n<button onclick=\"myFun()\">Click Me</button>\n<script>\nfunction\
    \ myFun() { // open window2\nconst window2 = window.open(\"\", \"\", \"width=200,height=100\"\
    );\nwindow2.opener.document.getElementById(\"w\").innerHTML=\"OK\";\n} // show\
    \ \"OK\" in window1\n</script>\n```\n// Output: `OK`\n\n---\n\n## `padEnd()` syntax\n\
    \n`string.padEnd(length, character)`\n\n// Pad the end side of the string by specified\
    \ characters and length.\n\ne.g.\n\n```html\n<script>\nvar str = \"Hi\";\n\ndocument.write(str.padEnd(5,\"\
    0\"));\n</script>\n```\n// Output: `Hi000`\n\n---\n\n## `padStart()` syntax\n\n\
    `string.padStart(length, character)`\n\n// Pad the start side of the string by\
    \ specified characters and length.\n\ne.g.\n\n```html\n<script>\nvar str = \"\
    Hi\";\n```"
