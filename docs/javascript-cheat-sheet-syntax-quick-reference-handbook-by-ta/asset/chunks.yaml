    push() syntax:


    array.push();


    // Add one or more elements to the end of an array.


    e.g.


    <script>


    var arr = [1,2,3];


    arr.push( 4, 5, 6 );      // add 4,5,6 to the end of "arr"


    document.write (arr);


    </script>


    // Output:   1,2,3,4,5,6


