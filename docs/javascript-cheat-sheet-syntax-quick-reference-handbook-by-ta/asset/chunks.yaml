    return value1 operator value2;


    });


    // "reduce()" returns a single value  by using an accumulating calculation.


    // "reduce()" uses a single operator to continuously evaluate each array element
    value.


    e.g.


    <script>


    var arr = [10, 20, 30, 40];  


    var sum = arr.reduce(function(value1, value2) {


    return value1 + value2; // using "+" operator


    }); // 10 + 20 + 30 + 40 = 100


    document.write(sum);


    </script>


    // Output:   100


    e.g.


    <script>


    var arr = [10, 20, 30, 40];


    var difference = arr.reduce(function(value1, value2) {


    return value1 - value2;     // using "-" operator


    }); // 10 - 20 - 30 - 40 = -80


    document.write(difference);


    </script>


    // Output:   -80


