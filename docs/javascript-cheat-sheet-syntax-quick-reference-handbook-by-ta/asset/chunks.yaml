    \  return value > 20; // check if all element values are greater than 20\n}\n\
    ```\n// Output: Are all element values greater than 20 ? false\n\n---\n\n## exec()\
    \ Syntax\n\n```javascript\npattern.exec(\"string\");\n```\n// `exec()` searches\
