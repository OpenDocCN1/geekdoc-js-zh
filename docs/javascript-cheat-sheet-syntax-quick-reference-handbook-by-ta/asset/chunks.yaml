  trans: "\n\n// 将指定的外部脚本 `myScript.js` 导入当前 html 文件。\n\n例如：\n\n```html\n<html>\n\
    <img src = \"myPhoto.jpg\" width = \"100\" height = \"80\">\n</html>\n```\n\n\
    // 将图片 `myPhoto.jpg` 加载到当前 html 文件中。\n\n---\n\n### static（静态）语法：\n\n```javascript\n\
    Class.staticProperty\nClass.staticMethod\n```\n\n// 静态属性和静态方法可以通过类引用，不能通过对象引用。\n\
    \n例如：\n\n```javascript\n<script>\nclass MyClass{\n  static greet() { return \"\
    Hello!\"; }\n  static name = \"Nancy\";\n}   // MyClass 引用了静态方法和静态属性\ndocument.write(MyClass.greet()\
    \ +\" \");\ndocument.write(MyClass.name +\" \");\n</script>\n```\n// 输出：`Hello!\
    \ Nancy`\n\n---\n\n### startsWith() 语法：\n\n```javascript\nstring.startsWith(searchvalue,\
    \ start)\n```\n\n// 如果字符串以指定的值开头，则返回 `true`\n// `startsWith()` 方法区分大小写。\n\n例如：\n\
    \n```javascript\n<script>\nvar str = \"HTML CSS is very easy\";\ndocument.write(str.startsWith(\"\
    HTML\"));\n</script>\n```\n// 输出：`true`\n\n---\n\n### strict mode（严格模式）语法：\n\n\
    ```javascript\n// 严格模式通过将某些 JavaScript 静默错误更改为抛出异常或不输出输出消除它们。\n// 要声明严格模式，我们可以在脚本开头添加\
    \ \"use strict\"。\n```\n\n例如：\n\n```javascript\n<script>\n\"use strict\"; // 使用严格模式\n\
    num = 3.14;   // 错误！\"num\" 未声明，因为它没有 \"var\"。\ndocument.write(\"Result is: \"\
    \ + num);\n</script>\n```\n// 输出：（无）\n\n例如：\n\n```javascript\n<script>     //\
    \ 不使用严格模式\nnum = 3.14;   // OK！\ndocument.write(\"Result is: \" + num);\n</script>\n\
    ```\n// 输出：Result is: 3.14\n\n---\n\n### String() 语法：\n\n```javascript\nString(parameter)\n\
    ```\n\n// 将其参数转换为字符串。\n\n例如：\n\n```javascript\n<script>\ndocument.write(String(new\
    \ Date()));   // 转换为字符串\n</script>\n```\n// 输出：Tue Sep 13 2022 12:50:38 GMT-0400\n\
    \n---\n\n### string length（字符串长度）语法：\n\n```javascript\nstring.length\n```\n\n\
    // 计算字符串长度，包括空格。\n\n例如：\n\n```javascript\n<script>\nvar str = \"I love JavaScript!\"\
    ;\nvar len = str.length;     // 获取字符串长度\ndocument.write ( \"String length is \"\
    \ + len );\n</script>\n```\n// 输出：String length is 18\n\n---\n\n### string object（字符串对象）语法：\n\
    \n```javascript\nvar object = new String(\"myString\");\n```\n\n// 创建字符串对象\n\n\
    例如：\n\n```javascript\n<script>\nvar person = new String(\"John\");\ndocument.write(\
    \ person instanceof Object);    // 检查对象\n</script>\n```\n// 输出：`true`\n\n---\n\
    \n### submit（提交）语法：\n\n```html\n<input type=\"submit\" value=\"Submit\">\n```\n\
    \n// 将表单中的数据提交到服务器\n\n例如：\n\n```html\n<<html>\n<script language=\"javascript\"\
    >\nfunction send(){ alert (\"Submit successfully!\") }\n</script>\n<form name=\"\
    myForm\" >\nUser Name:   <input type=\"text\" name=\"user\"><br>\n<input type=\"\
    submit\" value=\"Submit\" onClick=\"send()\">     \n</form>\n</html>\n```\n//\
    \ 输出：Submit successfully!\n\n---\n\n### submit() 语法：\n\n```javascript\nform.submit()\n\
    ```\n\n// 将表单数据提交到服务器。\n\n例如：\n\n```html\n<html\n<form id=\"myform\">\n<textarea></textarea><br><br>\n\
    <input type=\"button\" onClick=\"myfun()\" value=\"submit\" >\n</form>\n<script\
    \ type=\"text/javascript\">\nfunction myfun() {\ndocument.getElementById(\"myform\"\
    ).submit();\nalert (\"Data submitted successfully!\");\n}     // \"submit( )\"\
    \ 将 \"myform\" 数据提交到服务器。\n</script>\n</html\n```\n// 输出：Data submitted successfully!\n\
    \n---\n\n### substr() 语法：\n\n```javascript\nstring.substr( start, length );\n\
    ```\n\n// \"substr( start, length )\" 可以从字符串中提取子串。\n// \"start\" 参数指定提取的起始位置。\n\
    // \"length\" 参数指定子串的长度。\n\n例如：\n\n```javascript\n<script>\nvar str = \"JavaScript\
    \ is easy.\";\nvar sub = str.substr( 4, 6 );  /* 从索引 4 开始提取长度为 6 的子串。  */\ndocument.write\
    \ ( sub );\n</script>\n```\n// 输出：Script\n\n---\n\n### substring() 语法：\n\n```javascript\n\
    string.substring( start, end );\n```\n\n// \"substring( start, end )\" 可以从字符串中提取子串。\n\
    // \"start\" 参数指定提取的起始位置。\n// \"end\" 参数指定提取的结束位置。\n\n例如：\n\n```javascript\n<script>\n\
    var str = \"JavaScript is easy.\";\nvar sub = str.substring( 4, 10 );\ndocument.write\
    \ ( sub );\n</script>\n```\n// 输出：Script\n\n---\n\n### super() 语法：\n\n```javascript\n\
    super(arg)\n```\n\n// \"super()\" 用于调用基类的构造函数。\n\n例如：\n\n```javascript\nclass\
    \ Person {\n  constructor(name){this.name = name; }\n  present(){return 'name\
    \ is ' + this.name; }\n}\nclass Author extends Person {\n  constructor(name){super(name);\
    \ }\n}\nlet obj = new Author(\"Ray Yao\");\ndocument.write(obj.present());\n```\n\
    // 输出：name is Ray Yao\n\n---\n\n### switch case 语法：\n\n```javascript\nswitch (\
    \ var ) {\n  case 1: // 等于此\n    break;\n  case 2: // 等于此\n    break;\n  case\
    \ 3: // 等于此\n    break;\n  default: // 都不匹配任何情况\n}\n```\n\n// \"break;\" 结束当前语句。\n\
    \n例如：\n\n```javascript\n<script>\nvar number=20;\nswitch ( number ) {\n  case\
    \ 10 : document.write ( \"case 10\" );  break;\n  case 20 : document.write ( \"\
    case 20\" );  break;\n  case 30 : document.write ( \"case 30\" );  break;\n  default:\
    \ document.write ( \"default\" );\n}\n</script>\n```\n// 输出：case 20\n\n---\n\n\
    ### tan() 语法：\n\n```javascript\nMath.tan(radian)\n```\n\n// 返回弧度的正切值。\n\n例如：\n\
    \n```javascript\n<script>\ndocument.write(Math.tan(3.14));\n</script>\n```\n//\
    \ 输出：-0.0015926549360723\n\n---\n\n### target 语法：\n\n```javascript\nevent.target.nodeName\n\
    ```\n\n// 返回触发事件的元素。\n\n例如：\n\n```html\n<body onclick=\"myFun(event)\">\n<p>点击任何元素</p>\n\
    <input type=\"text\"/> <button>按钮</button> <p id=\"myId\"></p>\n<script>\nfunction\
    \ myFun(event) {\nvar str = \"事件元素: \" + event.target.nodeName;\ndocument.getElementById(\"\
    myId\").innerHTML = str;\n}\n</script>\n</body>\n```\n// 输出：点击任何元素\n事件元素：BUTTON\n\
    \n"
- fmt: "\n```javascript\n// Output:  \nHouse size: large\nHouse price: expensive\n\
    House building: good!\n```\n\ne.g.\n\n```html\n<html>\n<button onclick=\"this.style.display='none'\"\
    >Click Me!, I will be disappeared!</button>\n</html>\n```\n\n```javascript\n//\
    \ the button will disappear when it is clicked\n// \"this\" represents the current\
    \ object \"button\"\n```\n\n### `this.innerHTML` syntax:\n\n`onclick=\"this.innerHTML='Text\
    \ Changed!'\"`\n\n// When the element is clicked, the contents will be changed\n\
    \ne.g.\n\n```html\n<html>\n<h1 onclick=\"this.innerHTML='Text Changed!'\">Click\
    \ Me!</h1>\n</html>\n```\n\n```javascript\n// Output:   Text Changed!\n```\n\n\
    ### `throw` syntax:\n\n```javascript\ntry { throw new Error();} // throw exception\n\
    catch(e) { e.message } // catch and process the exception\n```\n\ne.g.\n\n```javascript\n\
    <script>\ntry {\n  var x = 100, y =0;\n  if( x / y ) {\n    throw new Error('The\
    \ y is 0');\n  }\n}\ncatch(e) {\n  document.write('An error caught<br>');\n  document.write('Error\
    \ message: ' + e.message); \n} // \"e.message\" shows the exception message\n\
    </script>\n```\n\n```javascript\n// Output:   An error caught\nError message:\
    \ The y is 0\n```\n\n### `title` syntax:\n\n`document.title`\n\n// Return the\
    \ title of the current document.\n\ne.g.\n\n```html\n<title>DocTitle</title>\n\
    <script>\ndocument.write(document.title);\n</script>\n```\n\n```javascript\n//\
    \ Output:   DocTitle\n```\n\n### `toExponential()` syntax:\n\n`number.toExponential(length)`\n\
    \n// Returns a number string in which numbers are rounded and written using exponential\
    \ notation\n\ne.g.\n\n```javascript\n<script>\nvar num = 8.1688;\ndocument.write(num.toExponential(4));\n\
    </script>\n```\n\n```javascript\n// Output:   8.1688e+0\n```\n\n### `toFixed()`\
    \ syntax:\n\n`number.toFixed(decimalPlace)`\n\n// Convert a number into a string\
    \ with the specified decimal place\n\ne.g.\n\n```javascript\n<script>\nvar num\
    \ = 10.28;\nvar str = num.toFixed(1); // 1 is decimal place\n// convert the decimal\
    \ number to string with 1 decimal place\ndocument.write (str);\n</script>\n```\n\
    \n```javascript\n// Output:   10.3\n```\n\n### `toLocaleString()` syntax:\n\n\
    `dateObject.toLocaleString()`\n\n// Return date and time in string format, with\
    \ locale setting.\n\ne.g.\n\n```javascript\n<script>\nconst d = new Date();\n\
    document.write(d.toLocaleString());\n</script>\n```\n\n```javascript\n// Output:\
    \   2023/7/3 afternoon 3:24:00\n```\n\n### `tolowercase()` syntax:\n\n`string.toLowerCase()`\n\
    \n// Convert the string to lower case.\n\ne.g.\n\n```javascript\n<script>\nvar\
    \ str = \"Hello World!\";\nvar small = str.toLowerCase( );\ndocument.write ( \"\
    Lowercase is \" + small); \n</script>\n```\n\n```javascript\n// Output:   Lowercase\
    \ is hello world!\n```\n\n### `toISOstring()` syntax:\n\n`dateObject.toISOString()`\n\
    \n// Convert a date to a ISO string\n// ISO is the international standard of dates\
    \ and times.\n\ne.g.\n\n```javascript\n<script>\nconst d = new Date();\ndocument.write(d.toISOString());\n\
    </script>\n```\n\n```javascript\n// Output:   2022-09-20T20:42:38.739Z\n```\n\n\
    ### `top` syntax:\n\n`window.top`\n\n// Return the topmost window\n\ne.g.\n\n\
    ```javascript\n<script>\nif (window.self != window.top) {\n  var str = \"Return\
    \ a current window\";\n} else {\n  str = \"Return a topmost window\";\n}\ndocument.write(str);\n\
    </script>\n```\n\n```javascript\n// Output:   Return a topmost window\n```\n\n\
    ### `toPrecision()` syntax:\n\n`number.toPrecision(length)`\n\n// Return a number\
    \ string, with a specified length\n\ne.g.\n\n```javascript\n<script>\nvar num\
    \ = 8.1688;\ndocument.write(num.toPrecision(5));\n</script>\n```\n\n```javascript\n\
    // Output:   8.1688\n```\n\n### `toString()` syntax:\n\n`array.toString()`\n\n\
    // \"array.toString()\" converts a JavaScript array into a string.\n\ne.g.\n\n\
    ```javascript\n<script>\nvar myarray = new Array( );\nmyarray[0] =\"Mon\";\nmyarray[1]\
    \ =\"Tue\";\nmyarray[2] =\"Wed\";\nvar days = myarray.toString( ); // convert\
    \ to string\ndocument.write ( days );\n</script>\n```\n\n```javascript\n// Output:\
    \   Mon, Tue, Wed\n```\n\n### `toString()` syntax:\n\n`number.toString()`\n\n\
    // \"number.toString( )\" can convert a number to a string.\n\ne.g.\n\n```javascript\n\
