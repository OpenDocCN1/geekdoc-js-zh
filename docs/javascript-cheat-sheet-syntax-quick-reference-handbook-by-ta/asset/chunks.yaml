    ## cleartimeout() 语法


    `clearTimeout(timeoutVar)`


    `"clearTimeout()"` 清除用 `setTimeout()` 方法设置的定时器。


    例如：


    ```html

    <html>

    <p id="study"></p>

    <button onclick="stopFun()">Stop</button>

    <script>  // 请在 3 秒内点击 Stop 按钮！

    const timer = setTimeout(message, 3000);

    function message() {

    document.getElementById("study").innerHTML = "You can see this message because
    you forgot clicking the ''Stop'' button within 3 seconds!"

    }

    function stopFun() {

    document.write("Thank you for clicking the ''Stop'' button within 3 seconds!");

    clearTimeout(timer);

    }

    </script>

