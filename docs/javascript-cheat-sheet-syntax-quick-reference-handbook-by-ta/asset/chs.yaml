  \ `11`（12 月）。\n- `getYear( )` 返回年份，但需要加上 `1900`。\n- `getDay( )` 返回 `0`（星期日）到 `6`（星期六）。\n\
  - `getFullYear()` 返回格式正确的年份。\n\n### 示例： \n\n```html\n<script>\nvar obj = new Date\
  \ ( );     // 创建日期对象\nvar m = obj.getMonth( ) + 1;   // 需要加 1\nvar d = obj.getDate(\
  \ );\nvar y = obj.getYear( ) + 1900;   // 需要加 1900\nvar fy = obj.getFullYear();\n\
  var day = obj.getDay();\ndocument.write (  m + \" - \" + d + \" - \" + y +\"<br>\"\
  \ );\ndocument.write ( day );   // 返回 0（星期日）到 6（星期六）。\n</script>\n```\n\n// 输出：\n\
  9 - 6 - 2022\n2       \n\n---\n\n# 获取小时、分钟、秒语法：\n\n`dateObject.getHours( )`    \
  \ // 获取小时\n`dateObject.getMinutes( )`   // 获取分钟\n`dateObject.getSeconds( )`   //\
