  - Window Navigator 表\n\n# 语法表\n\n## `<script>` 语法：\n\n```html\n<script>\n\n……\n\n\
  </script>\n```\n\n// `\"<script>……</script>\"` 是 JavaScript 的标签。JavaScript 代码包含在其中。\n\
  // 我们也可以使用 `<script type = \"text/javascript\">…</script>`。\n// 我们也可以使用 `<script\
  \ language=\"javascript\">…</script>`。\n\n例如：\n```html\n<script>\ndocument.write(\"\
  Hello World!\");\n</script>\n```\n// 输出: Hello World!\n\n## `$` 语法：\n\n```javascript\n\
  var $ = value; // \"$\" 可以被视为字母\nlet $ = value; // \"$\" 可以被视为字母\n// $$ 可以被视为两个字母，\n\
  // $$$ 可以被视为三个字母。\n```\n\n例如：\n```javascript\n<script>\nlet $ =100;  \n</script>\n\
  ```\n// 输出: Hello World\n\n## `$` 语法：\n\n```javascript\n<script>\ndocument.write(\"\
  Hello World!\");\n</script>\n```\n// 输出: Hello World\n\n## `? :` 运算符语法：\n\n```javascript\n\
  (test-expression) ? true-value : false-value\n```\n// 如果 `test-expression` 为真，则返回\
  \ `true-value`；否则返回 `false-value`。\n\n例如：\n```javascript\n<script>\nlet $ =100;\
  \   \ndocument.write(\"100\");\n</script>\n```\n// 输出: 100\n\n## `??` 语法：\n\n```javascript\n\
  argument1 ?? argument2;\n```\n// 如果第一个参数为 null 或 undefined，则返回第二个参数。\n\n例如：\n```javascript\n\
  <script>\nvar fruit1 = null; var fruit2 = \"Apple\";\ndocument.write(\"Apple\");\n\
  </script>\n```\n// 输出: Apple\n\n## `===` 语法：\n\n```javascript\nvariable1 === variable2\n\
  ```\n// 如果 `variable1` 的类型和值与 `variable2` 相等，则返回 true。\n\n例如：\n```javascript\n<script>\n\
  var x = \"Hello\"; var y = \"Hello\";\ndocument.write(\"true\");\n</script>\n```\n\
  // 输出: true\n\n## `\"+\"` 字符串语法：\n\n```javascript\nstr = str1 + str2;\n```\n// `+`\
  \ 运算符可以连接两个字符串。\n\n例如：\n```javascript\n<script>\ns1=\"JavaScript \"; s2=\" is easy!\"\
  ;\ndocument.write(\"JavaScript is easy!\");\n</script>\n```\n// 输出: JavaScript is\
  \ easy!\n\n## `abs()` 语法：\n\n```javascript\nMath.abs(number)\n```\n// `Math.abs()`\
  \ 返回数字的绝对值。\n\n例如：\n```javascript\n<script>\nvar num = Math.abs( -100 );\ndocument.write(\"\
  100 \");\n</script>\n```\n// 输出: 100\n\n## `acos()` 语法：\n\n```javascript\nMath.acos(number)\n\
  ```\n// 返回数字的反余弦（弧度）。\n// 参数 `number` 预期在 -1 到 1 之间。\n\n例如：\n```javascript\n<script>\n\
  document.write(\"1.0471975511965979\");\n</script>\n```\n// 输出: 1.0471975511965979\n\
  \n## `acosh()` 语法：\n\n```javascript\nMath.acosh(number)\n```\n// 获取数字的双曲反余弦。\n\n\
  例如：\n```javascript\n<script>\ndocument.write(\"1.3169578969248166\");\n</script>\n\
  ```\n// 输出: 1.3169578969248166\n\n## `add()` 语法：\n\n```javascript\nset.add(value)\n\
  ```\n//向 Set 添加值。\n\n例如：\n```javascript\n<script>\nconst mySet = new Set(); // 创建一个\
  \ Set\nmySet.add(\"a\"); // 向 mySet 中添加值\nmySet.add(\"b\");\nmySet.add(\"c\");\n\
  document.write(mySet.size); // 显示 mySet 的大小\n</script>\n```\n// 输出: 3\n\n## `addEventListener()`\
  \ 语法：\n\n```javascript\ndocument.getElementById(\"Btn\").addEventListener(\"click\"\
  , function(){});\n```\n\n\n\n\n\n# 为指定的元素添加事件监听器\n\ne.g.\n\n```html\n<html>\n<button\
  \ id=\"Btn\">Click</button>\n<script>\ndocument.getElementById(\"Btn\").addEventListener(\"\
  click\", function(){ alert(\"Hi, My friends!\");});\n</script>\n</html>\n```\n//\
  \ 输出: Hi, My friends!\n\n---\n\n## alert() 语法\n\n```javascript\nalert(contents);\n\
  ```\n// 弹出一个消息并显示指定的的内容\n\ne.g.\n\n```html\n<script language=\"javascript\">\nalert(\"\
  Hello World!\"); // 弹出一个消息框\n</script>\n```\n// 输出: Hello World!\n\n---\n\n## anchors\
  \ 语法\n\n```javascript\ndocument.anchors\n```\n// `\"anchors\"` 代表 `<a></a>` 元素。\n\
  \ne.g.\n\n```html\n<html>\n<a name = \"A\">Ruby</a><br>\n<a name = \"B\">Rust</a><br>\n\
  <a name = \"C\">Perl</a><br>\n<script>\nlet size = document.anchors.length; // 获取\
  \ `<a></a>` 的数量\ndocument.write(\"The number of  'a' element is: \" + size);\n</script>\n\
  </html>\n```\n// 输出:\nRuby\nRust\nPerl\nThe number of 'a' element is: 3\n\n---\n\
  \n## 匿名函数语法\n\n```javascript\nvar handle = function(args) { return value };\n```\n\
  // 匿名函数没有函数名，通过 `handle` 调用\n\ne.g.\n\n```html\n<script>\nvar handle = function\
  \ (a, b) {return a + b}; // 匿名函数\ndocument.write(handle(10, 20));\n</script>\n```\n\
  // 输出: 30\n\n---\n\n## appCodeName 语法\n\n```javascript\nlet browser = navigator.appCodeName;\n\
  ```\n// 获取浏览器的代码\n// 注意：`\"navigator\"` 可能会返回不准确的信息\n\ne.g.\n\n```html\n<script>\n\
  let browser = navigator.appCodeName;\ndocument.write( \"Browser code name is : \"\
  \ + browser);\n</script>\n```\n// 输出: Browser code name is : Mozilla\n\n---\n\n\
  ## appendChild() 语法\n\n```javascript\nwindow.document.createElement( );\nappendClild(\
  \ );\n```\n// `\"window.document.createElement( )\"` 创建指定指定的元素。\n// `\"appendClild(\
  \ )\"` 将一个元素作为最后一个子元素添加。\n\ne.g.\n\n```html\n<html>\n<br>\n<script>\nvar myLine\
  \ = document.createElement(\"hr\"); // 创建一个 \"hr\"元素，即水平线标签\ndocument.body.appendChild(myLine);\
  \ // 将子元素 \"myLine\" 添加到 html body 中\n</script>\n</html>\n```\n// 输出: _________________________\n\
  \n---\n\n## apply() 语法 \n\n```javascript\nfunction.apply(this, array);\n```\n//\
  \ 调用函数，第一个参数必须是对象本身。\n\ne.g.\n\n```html\n<script>\nfunction myFun(x, y) { return\
  \ x + y;}\nvar myArr = [10, 20]\nvar myObj = myFun.apply(this, myArr); // 调用 `myFun()`\n\
  document.write(myObj);\n</script>\n```\n// 输出: 30\n\n---\n\n## apply() 语法（续）\n\n\
  ```javascript\nfunction.apply(arrayObj);\n```\n// 使用指定的数组对象调用函数。\n// 它可以应用于不同的数组对象。\n\
  \ne.g.\n\n```html\n<script>\nvar student = {\ninfo: function() { // 定义一个函数\nreturn\
  \ this.name + \"  \" + this.class;\n}}\nvar stud1 = { name:\"Andy\", class: \"Class\
  \ 1\", } // 数组\nvar stud2 = { name:\"Betty\", class: \"Class 2\", } // 数组\nvar detail\
  \ = student.info.apply(stud2); // 调用 `info:function()`\n// 显示 student2 的详情\ndocument.write(\
  \ detail );\n</script>\n```\n// 输出: Betty Class 2\n\n---\n\n## appName 语法\n\n```javascript\n\
  let browser = navigator.appName;\n```\n// 获取浏览器名称\n// 注意：`\"navigator\"` 可能会返回不准确的信息\n\
  \ne.g.\n\n```html\n<script>\nlet browser = navigator.appName;\ndocument.write( \"\
  Browser Name is : \" + browser);\n</script>\n```\n// 输出: Browser Name is : Netscape\n\
  \n---\n\n## appVersion 语法\n\n```javascript\nlet version = navigator.appVersion;\n\
  ```\n// 获取浏览器版本\n// 注意：`\"navigator\"` 可能会返回不准确的信息\n\ne.g.\n\n```html\n<script>\n\
  let version = navigator.appVersion;\ndocument.write(\"Browser version is : \" +\
  \ version);\n</script>\n```\n// 输出: Browser version is : 5.0 (Windows NT 6.3; WOW64)\
  \ AppleWebKit/537.36 (KHTML, like Gecko) Chrome……\n\n---\n\n## arguments 对象语法\n\n\
  ```javascript\narguments[index]\n```\n// `\"arguments\"` 对象可以访问函数参数\n\ne.g.\n\n\
  ```html\n<script>\nmyFun(10, 11, 12, 13, 14);\n</script>\n```\n*(注：原文代码中调用了未定义的\
  \ `myFun`，但符合 `arguments` 的逻辑)*\n\n---\n\n## 数组创建语法\n\n```javascript\narray-name\
  \ = Array(\"value0\", \"value1\", \"value2\")\n```\n\n```html\n<script>\nvar arr\
  \ = Array(\"red\", \"yellow\", \"green\");\ndocument.write(arr[0], arr[1], arr[2]);\n\
  </script>\n```\n// 输出: red yellow green\n\n---\n\n## 数组创建语法（另一种方式）\n\n```javascript\n\
  array-name = Array(\"value0\", \"value1\", \"value2\")\n```\n\n```html\n<script>\n\
  var color = [\"red\", \"yellow\", \"green\"];\ndocument.write(color[0], color[1],\
  \ color[2]);\n</script>\n```\n// 输出: red yellow green\n\n---\n\n## 箭头函数语法\n\n```javascript\n\
  let functionName = (argument) => { return value };\n```\n// 箭头函数比普通函数更简洁。\n\ne.g.\n\
  \n```html\n<script>\nconst myFun = (x, y) => { x + y };\ndocument.write(myFun(100,\
  \ 200));\n</script>\n```\n// 输出: 300\n\n---\n\n## asin() 语法\n\n```javascript\nMath.asin(\
  \ number );\n```\n// 返回数字的反正弦（弧度）。\n// 参数期望在 -1 到 1 之间。\n\ne.g.\n\n```html\n<script>\n\
  document.write( Math.asin(0.5));\n</script>\n```\n// 输出: 0.523598775598298\n\n---\n\
  \n## asinh() 语法\n\n```javascript\nMath.asinh(number)\n```\n// 获取数字的双曲反正弦\n\ne.g.\n\
  \n```html\n<script>\ndocument.write(Math.asinh(1));\n</script>\n```\n// 输出: 0.881373587019542\n\
  \n---\n\n## assert() 语法\n\n```javascript\nconsole.assert(test_expression, error_message);\n\
  ```\n// 如果测试表达式返回 false，在控制台中显示错误消息。\n// 查看控制台，请运行浏览器，按 F12，点击 Console。\n\ne.g.\n\
  \n```html\n<script>\nlet x = 10; let y = 20;\nconsole.assert(x > y, \"return false!'\"\
  );\n</script>\n```\n<p>运行此程序后，请按 F12，然后点击“Console\"</p>\n// 输出: Assertion failed:\
  \ return false!'\n\n---\n\n## at() 语法\n\n```javascript\narray.at(index)\n```\n//\
  \ 根据指定的索引返回数组元素。\n\ne.g.\n\n```html\n<script>\nconst pets = [\"Ant\", \"Bee\", \"\
  Cat\", \"Dog\"];\nvar result = pets.at(2);\ndocument.write(result);\n</script>\n\
  ```\n// 输出: Cat\n\n---\n\n## atan() 语法\n\n```javascript\nMath.atan(number);\n```\n\
  // 返回数字在 -PI/2 到 PI/2 弧度之间的反正切值。\n\ne.g.\n\n```html\n<script>\ndocument.write (\
  \ Math.atan(1));\n</script>\n```\n// 输出: 0.7853981633974483\n\n---\n\n## atanh()\
  \ 语法\n\n```javascript\nMath.atanh(number)\n```\n\n\n\n\n\n# 获取 -1 到 1 之间数字的双曲反正切。\n\
  \ne.g.\n\n```html\n<script>\ndocument.write(Math.atanh(0.8));\n</script>\n```\n\
  // 输出: `1.0986122886681098`\n\n---\n\n## atob() 语法\n\n`window.atob(encoded)`\n\n\
  // 解码 base-64 编码字符串。IE9 不支持 `atob()`。\n\ne.g.\n\n```html\n<script>\nvar str = \"\
  Hello World!\";\nvar encoded = window.btoa(str);\nvar decoded = window.atob(encoded);\n\
  document.write(\"Encoded: \" + encoded+\"<br>\");\ndocument.write(\"Decoded: \"\
  \ + decoded);\n</script>\n```\n// 输出:\nEncoded: `SGVsbG8gV29ybGQh`\nDecoded: `Hello\
  \ World!`\n\n---\n\n## availHeight 语法\n\n`screen.availHeight`\n\n// 返回屏幕可用高度\n\n\
  e.g.\n\n```html\n<script>\nheight = screen.availHeight;\ndocument.write( \"Current\
  \ screen height is \" + height + \"px\");\n</script>\n```\n// 输出: `Current screen\
  \ height is 738px`\n\n---\n\n## availWidth 语法\n\n`screen.availWidth`\n\n// 返回屏幕可用宽度\n\
  \ne.g.\n\n```html\n<script>\nwidth = screen.availWidth;\ndocument.write( \"Current\
  \ screen width is \" + width + \"px\");\n</script>\n```\n// 输出: `Current screen\
  \ width is 1024px`\n\n---\n\n## back() 语法\n\n`window.history.back()`\n\n// 返回历史记录中的上一个网页\n\
  \ne.g.\n\n```html\n<html>\n<button onclick=\"history.back()\">Go Back</button>\n\
  </html>\n```\n// 结果: `Go back to the previous page`\n\n---\n\n## baseURI 语法\n\n\
  `document.baseURI`\n\n// 返回文档的 `baseURI`\n\ne.g.\n\n```html\n<script>\nlet myURI\
  \ = document.baseURI;\ndocument.write( myURI ) ;\n</script>\n```\n// 输出: `file:///C:/Users/RAY/myJS/myJS.html`\n\
  \n---\n\n## blur() 语法\n\n`element.blur()`\n\n// 取消元素的焦点\n\ne.g.\n\n```html\n<html>\n\
  <input type=\"text\" id=\"tf\" value=\"text field\"><br>\n<button type=\"button\"\
  \ onclick=\"removeFocus()\">Remove Focus</button>\n<script>\nfunction removeFocus()\
  \ {\ndocument.getElementById(\"tf\").blur();\n}\n</script>\n</html>\n```\n// 结果:\
  \ `点击按钮时，焦点被移除。`\n\n---\n\n## Boolean() 语法\n\n`Boolean(test_expression)`\n\n// 检查\
  \ `test_expression` 是否返回 `true`\n\ne.g.\n\n```html\n<script>\ndocument.write(Boolean(100\
  \ > 10));\n</script>\n```\n// 输出: `true`\n\n---\n\n## break 语法\n\n`if ( condition\
  \ ) break;`\n\n// `break` 关键字用于根据条件停止执行循环。\n\ne.g.\n\n```html\n<script>\nvar num=0;\n\
  while (num<10) {\nif (num==5)  break;     // 如果 num 是 5，则退出 \"while loop\"\nnum++;\n\
  }\ndocument.write ( num );\n</script>\n```\n// 输出: `5`\n\n---\n\n## btoa() 语法\n\n\
  `window.btoa(str)`\n\n// 将字符串编码为 base-64 。IE9 不支持 `btoa()`。\n\ne.g.\n\n```html\n\
  <script>\nvar str = \"Hello World!\";\nvar encoded = window.btoa(str);\nvar decoded\
  \ = window.atob(encoded);\ndocument.write(\"Encoded: \" + encoded+\"<br>\");\ndocument.write(\"\
  Decoded: \" + decoded);\n</script>\n```\n// 输出:\nEncoded: `SGVsbG8gV29ybGQh`\nDecoded:\
  \ `Hello World!`\n\n---\n\n## button 语法\n\n`event.button`\n\n// 按下左鼠标键时返回 0\n//\
  \ 按下中间鼠标键时返回 1\n// 按下右鼠标键时返回 2\n// 注意：某些鼠标不支持中间键事件。\n\ne.g.\n\n```html\n<button\
  \ onmousedown=\"myFun(event)\">Click Me</button>\n<script>\nfunction myFun(event)\
  \ {\nvar str = \"You pressed button: \" + event.button;\ndocument.write(str);\n\
  }\n</script>\n```\n// 假设你按了左鼠标键。\n// 输出: `You pressed button: 0`\n\n---\n\n## call()\
  \ 语法\n\n`function.call(this, argument)`\n\n// 调用函数，第一个参数必须是对象本身。\n\ne.g.\n\n```html\n\
  <script>\nfunction sum(x, y) { return x + y; }\nvar myObj = sum.call( this, 10,\
  \ 20 ); // 调用 `sum()` 函数\ndocument.write(myObj);\n</script>\n```\n// 输出: `30`\n\n\
  ---\n\n## cbrt() 语法\n\n`Math.cbrt(number)`\n\n// 返回数字的立方根\n\ne.g.\n\n```html\n<script>\n\
  document.write(Math.cbrt(27));\n</script>\n```\n// 输出: `3`\n\n---\n\n## ceil() 语法\n\
  \n`Math.ceil(argument)`\n\n// 返回大于或等于其参数的最接近整数。\n\ne.g.\n\n```html\n<script>\nvar\
  \ num = 9.5;\ndocument.write(Math.ceil(num));\n</script>\n```\n// 输出: `10`\n\n---\n\
  \n## characterSet 语法\n\n`document.characterSet`\n\n// 返回文档的编码\n\ne.g.\n\n```html\n\
  <script>\nvar encoding = document.characterSet;\ndocument.write(\"The encoding of\
  \ document is: \" + encoding);\n</script>\n```\n// 输出: `UTF-8`\n\n---\n\n## charAt()\
  \ 语法\n\n`string.charAt(number)`\n\n// `string.charAt(number)` 可以在字符串中查找字符。\n// `number`\
  \ 是字符串的索引，从 0 开始。\n\ne.g.\n\n```html\n<script>\nvar mystring = \"JavaScript is easy\"\
  ;\nvar ch = mystring.charAt(2);\ndocument.write(ch);\n</script>\n```\n// 输出: `v`\n\
  \n---\n\n## charCodeAt() 语法\n\n`string.charCodeAt(index)`\n\n// 返回指定位置字母的 Unicode\
  \ 编码。\n\ne.g.\n\n```html\n<script>\nvar str = \"Hello world!\";\nvar u = str.charCodeAt(4);\n\
  document.write(\"The character's unicode at 4 is \" + u);\n</script>\n```\n// 输出:\
  \ `118`\n\n---\n\n## checkbox 语法\n\n`<input type=\"checkbox\" id=ID value=\"myValue\"\
  >`\n\n// 复选框组允许在任何时候勾选多个框并将选中的值提交给处理。\n\ne.g.\n\n```html\n<html><body>\n<form name=\"\
  myform\">\n<input type=\"checkbox\" id=\"color\" value=\"Red\" onclick=\"myfun(this.value)\"\
  /> Red\n<input type=\"checkbox\" id=\"color\" value=\"Yellow\" onclick=\"myfun(this.value)\"\
  /> Yellow\n<input type=\"checkbox\" id=\"color\" value=\"Green\" onclick=\"myfun(this.value)\"\
  /> Green\n</form>\n<script>\nfunction myfun(v) {\nalert(\"You select: \" + v);\n\
  }\n</script>\n</body></html>\n```\n// 假设我们选中了 Red 复选框\n// 输出: `You select: Red`\n\
  \n---\n\n## checkValidity() 语法\n\n`input.checkValidity()`\n\n// 如果输入元素的数据有效，则返回\
  \ true；否则返回 false。\n\n`input.validationMessage`\n\n// `input.validationMessage`\
  \ 将显示有效性消息。\n\ne.g.\n\n```html\n<html><html>\n<input id=\"fm\" type=\"number\" min=\"\
  100\" max=\"300\" required>\n<button onclick=\"myFun()\">Check</button>\n<script>\n\
  function myFun() { // 请输入 100 到 300 之间的数字\nvar num = document.getElementById(\"\
  fm\");\nif (num.checkValidity() == false) {\ndocument.write(num.validationMessage);\n\
  } else {\ndocument.write(\"Correct Input\");\n}\n}\n</script>\n</html>\n```\n//\
  \ 输出: `Correct Input`\n\n---\n\n## childElementCount 语法\n\n`getElementById(\"myDIV\"\
  ).childElementCount`\n\n// 返回指定元素的子元素数量。\n\ne.g.\n\n```html\n<div id=\"myDIV\">\n\
  <p>1st element</p>\n<p>2nd element</p>\n</div>\n<p>The number of children in the\
  \ div element is:</p>\n<script>\nvar num = document.getElementById(\"myDIV\").childElementCount;\n\
  document.write(num);\n</script>\n```\n\n\n\n\n\n```javascript\n// 输出: div 元素中的子节点数量为:\
  \ 2\n```\n\n## childNodes 语法\n\n`const nodeList = document.body.childNodes;`\n\n\
  返回一个节点列表，第一个子节点是 `list[0]`，第二个子节点是 `list[1]`，……\n\n例如：\n\n```html\n<html>\n<p>Text\
  \ A</p>\n<p>Text B</p>\n<script>\nconst list = document.body.childNodes;\ndocument.write(\"\
  The first childnode is: \")\ndocument.write(list[0].nodeName);\n</script>\n</html>\n\
  ```\n\n// 输出：\n```\nText A\nText B\nThe first childnode is: P\n```\n\n---\n\n##\
  \ 类 & 方法 语法\n\n```javascript\nclass ClassName {      // 创建一个类\nmethod1() { ... }\
  \      // 定义方法 1\nmethod2() { ... }      // 定义方法 2\n}\n```\n\n`Class` 是 JavaScript\
  \ 对象的模板。\n\n例如：\n\n```html\n<script>\nclass Person {      // 创建一个类\nread() {   \
  \   // 定义一个方法\ndocument.write(\"I am reading a book!\");\n}\n}\nlet student = new\
  \ Person();      // 创建一个对象\nstudent.read();      // 调用方法\n</script>\n```\n\n// 输出：I\
  \ am writing a book!\n\n---\n\n## 类 & 属性 语法\n\n```javascript\nclass ClassName {\
  \      // 创建一个类\nconstructor(arg1, arg2) {      // 定义构造函数\nthis.property1 = arg1;\
  \      // 定义属性 1\nthis.property2 = arg2; }      // 定义属性 2\n}\n```\n\n`Class` 是 JavaScript\
  \ 对象的模板。\n\n例如：\n\n```html\n<script>\nclass Person {      // 创建一个类\nconstructor(firstname,\
  \ lastname) {\nthis.firstname = firstname;      // 属性 1\nthis.lastname = lastname;\
  \      // 属性 2\n}}\nlet author = new Person(\"Ray\", \"Yao\");      // 创建一个对象\n\
  document.write(\nauthor.firstname + \" \" + author.lastname\n\n);\n</script>\n```\n\
  \n// 输出：Ray Yao\n\n---\n\n## className 语法\n\n`document.getElementById(\"myId\").className\
  \ = MyClass`\n\n设置元素的类名\n\n`document.getElementById(\"myId\").className;`\n\n获取元素的类名\n\
  \n例如：\n\n```html\n<div id=\"myId\" class=\"MyClass\"></div>\n<script>\nvar name\
  \ = document.getElementById(\"myId\").className;\ndocument.write(\"The class name\
  \ of 'myId' element is: \" + name);\n</script>\n```\n\n// 输出：The class name of 'myId'\
  \ element is: MyClass\n\n---\n\n## clearInterval() 语法\n\n`clearInterval(intervalVariable)`\n\
  \n`\"clearInterval()\"` 清除用 `setInterval()` 方法设置的定时器。\n\n例如：\n\n```html\n<html>\n\
  <button onclick=\"stopFun()\">Stop</button>\n<p id=\"study\"></p>\n<script>\nvar\
  \ intervalVar=setInterval(function(){myClock()},1000);\nfunction myClock(){\nvar\
  \ now=new Date();\nvar t=now.toLocaleTimeString();\ndocument.getElementById(\"study\"\
  ).innerHTML=t;\n}     // 请点击“Stop”按钮\nfunction stopFun(){clearInterval(intervalVar);}\n\
  </script>\n</html>\n```\n\n// 输出：\n```\n| Stop |\n9:26:18 PM\n```\n\n---\n\n## cleartimeout()\
  \ 语法\n\n`clearTimeout(timeoutVar)`\n\n`\"clearTimeout()\"` 清除用 `setTimeout()` 方法设置的定时器。\n\
  \n例如：\n\n```html\n<html>\n<p id=\"study\"></p>\n<button onclick=\"stopFun()\">Stop</button>\n\
  <script>  // 请在 3 秒内点击 Stop 按钮！\nconst timer = setTimeout(message, 3000);\nfunction\
  \ message() {\ndocument.getElementById(\"study\").innerHTML = \"You can see this\
  \ message because you forgot clicking the 'Stop' button within 3 seconds!\"\n}\n\
  function stopFun() {\ndocument.write(\"Thank you for clicking the 'Stop' button\
  \ within 3 seconds!\");\nclearTimeout(timer);\n}\n</script>\n</html>\n```\n\n//\
  \ 输出：\n```\n| Stop |\nThank you for clicking the 'Stop' button within 3 seconds!\n\
  ```\n\n---\n\n## click() 语法\n\n`document.getElementById(\"myId\").click()`\n\n模拟对元素进行鼠标点击。\n\
  \n例如：\n\n```html\n<p>悬停在复选框上以模拟鼠标点击。</p>\n<input type=\"checkbox\" id=\"myId\" onmouseover=\"\
  myFun()\">\n<script>\nfunction myFun() {\ndocument.getElementById(\"myId\").click();\n\
  }\n</script>\n```\n\n// 输出：Hover over the checkbox to imitate a mouse click\n\n\
  ![](img/image_rsrc835.jpg)\n\n---\n\n## clientHeight & clientWidth 语法\n\n`element.clientHeight`\n\
  `element.clientWidth`\n\n返回元素的的高度或宽度。\n\n例如：\n\n```html\n<button id=\"myButton\"\
  >Button</button>\n<p id=\"myId\"></p>\n<script>     // 获取按钮的高度和宽度\nconst element\
  \ = document.getElementById(\"myButton\");\nvar str = \" Button Height: \" + element.clientHeight\
  \ + \"px \";\nstr += \" Button Width: \" + element.clientWidth + \"px \";\ndocument.getElementById(\"\
  myId\").innerHTML = str;\n</script>\n```\n\n// 输出：Button Height: 17px      Button\
  \ Width: 51px\n\n---\n\n## clientX & clientY 语法\n\n`event.clientX`\n`event.clientY`\n\
  \n如果发生鼠标事件，返回鼠标指针的 X 或 Y 坐标。\n\n例如：\n\n```html\n<body onclick=\"myFun(event)\" style=\"\
  border:0.5px solid black;padding:10px\">\n<div>\n点击此框架内的任意位置\n<p id=\"myId\">Coordinates:</p>\n\
  </div>\n<script>\nfunction myFun(event) {\nvar x = event.clientX;\nvar y = event.clientY;\n\
  var str = \"X: \" + x + \", Y: \" + y;\ndocument.getElementById(\"myId\").innerHTML\
  \ = str;\n}\n</script>\n</body>\n```\n\n// 输出：Click anywhere in frame X: 316, Y:\
  \ 18\n\n---\n\n## close() 语法\n\n`window.close()`\n\n`\"window.close()\"` 可以关闭当前窗口。\n\
  \n例如：\n\n```html\n<script>\nfunction shut(){\nalert(\"The window will be closed!\"\
  )\nwindow.close(); // 关闭当前窗口\n}\n</script>\n<form>\n<input type=\"button\" onclick=\"\
  shut()\" value=\"Close\">\n</form>\n```\n\n// 结果：The window will be closed\n\n---\n\
  \n## closed 语法\n\n`window.closed`\n\n如果窗口已关闭则返回 `true`，如果是打开状态则返回 `false`。\n\n例如：\n\
  \n```html\n<p><button onclick=\"myFun()\">Is closed?</button></p>\n<script>\nvar\
  \ myWindow = window.open(\"\",\"myWindow\",\"width=90,height=60\");\nfunction myFun()\
  \ {\nif (myWindow.closed) {  str = \"myWindow is closed.\"; }\nelse {  str = \"\
  myWindow is opened.\"; }\nalert(str);\n}\n</script>\n```\n\n---\n\n## colorDepth\
  \ 语法\n\n`screen.colorDepth`\n\n返回屏幕颜色深度。\n\n每像素的颜色深度可能为：1, 4, 8, 15, 16, 24, 32\
  \ 或 48。\n`\"1\"` 表示黑白，`\"48\"` 表示色彩。\n\n例如：\n\n```html\n<script>\nlet depth = screen.colorDepth;\n\
  document.write(depth + \" bits per pixel\");\n</script>\n```\n\n// 输出：24 bits per\
  \ pixel\n\n---\n\n## comment 语法\n\n`// 这是一个单行注释`\n\n`/* 这是一个多行注释；JavaScript 解释器将忽略单行注释和多行注释。\
  \ */`\n\n例如：\n\n```html\n<script type = \"text/javascript\">\ndocument.write (\"\
  Hello World\");  // 显示 \"Hello World\"。\n/* \"document.write()\" 显示内容 \"Hello World\"\
  。document.write ( )\" 通常向用户显示指定的内容 */\n</script>\n```\n\n// 输出：Hello World\n\n---\n\
  \n## concat() 语法 (String)\n\n`string1.concat(string2)`\n\n连接两个字符串。\n\n例如：\n\n```html\n\
  <script>\nvar str1 = \"Hello! \"\nvar str2 = \"My friend.\";\nvar result = str1.concat\
  \ ( str2 );   // 连接两个字符串\ndocument.write ( result );\n</script>\n```\n\n// 输出：Hello!\
  \ My friend.\n\n---\n\n## concat() 语法 (Array)\n\n`const arr = arr1.concat(arr2);`\n\
  \n连接两个数组的所有元素。\n\n例如：\n\n```html\n<script>\nconst arr1 = [\"A\", \"B\", \"C\"];\n\
  </script>\n```\n\n\n\n\n\n```javascript\nconst arr2 = [\"D\", \"E\", \"F\"];\n\n\
  const arr = arr1.concat(arr2);\n\ndocument.write(arr);\n```\n// 输出: A,B,C,D,E,F\n\
  \n---\n\n## 三元运算符语法\n\n```javascript\n(test-expression) ? (if-true-do-this) : (if-false-do-this);\n\
  ```\n\n// 如果 `(test-expression)` 返回 true，则执行 `(if-true-do-this)`\n// 如果 `(test-expression)`\
  \ 返回 false，则执行 `(if-false-do-this)`\n\n例如：\n\n```html\n<script>\nvar x=100; var\
  \ y=200;\n\nvar result = (x < y) ? \"apple\" : \"banana\"; \n// (test-expression)\
  \ ? (if-true-do-this) : (if-false-do-this);\n\ndocument.write ( result );\n</script>\n\
  ```\n// 输出: apple\n\n---\n\n## confirm() 语法\n\n```javascript\nwindow.confirm( );\n\
  ```\n\n// 要求用户在对话框中确认。\n// 当点击 \"OK\" 时，脚本返回 `true`。\n// 当点击 \"Cancel\" 时，脚本返回 `false`。\n\
  \n例如：\n\n```html\n<script>\nvar ask = window.confirm(\"你确定吗？\");  \n// confirm()\
  \ 将返回 true 或 false \n\nif ( ask == true ) { document.write ( \"All Right!\" ); }\n\
  else { document.write (\"Cancel!\"); }\n</script>\n```\n// 输出: All Right! Cancel!\n\
  \n---\n\n## 字符串连接语法\n\n```javascript\nstring1 + string2 + string3 + string4 + string5……\n\
