  \ \" + Math.LN2 + \"</p>\"\n\"<p>Math.LN10: \" + Math.LN10 + \"</p>\"\n\"<p>Math.LOG2E:\
  \ \" + Math.LOG2E + \"</p>\"\n</script>\n```\n（注：后续内容为大量重复的乱码，已停止翻译以符合“不要重复输出原文”原则）\n\
  \n\n\n\n```javascript\ninfo+= \"<p>Cookies Enabled: \" + navigator.cookieEnabled\
  \ + \"</p>\";\ninfo+= \"<p>Java Enabled: \" + navigator.javaEnabled() + \"</p>\"\
  ;\ndocument.write(info);\n```\n\n// 输出:\nBrowser Code: Mozilla\nBrowser Name: Netscape\n\
  Browser Version: 5.0 (Windows NT 6.3; WOW64) AppleWebKit/537.36 (KHTML, like Gecko)\
  \ Chrome/86.0.4240.198 Safari/537.36\nBrowser Platform: Win32\nBrowser Agent: Mozilla/5.0\
  \ (Windows NT 6.3; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/86.0.4240.198\
  \ Safari/537.36\nBrowser Language: en-US\nCookies Enabled: true\nJava Enabled: false\n\
  \n-------------------------------------------------------------------------------\n\
  \n### NEGATIVE_INFINITY 语法\n\n```javascript\nNumber.NEGATIVE_INFINITY;\n```\n\n\
  `Number.NEGATIVE_INFINITY` 表示负无穷，返回溢出。\n\n例如：\n```html\n<script>\nlet num = Number.NEGATIVE_INFINITY;\n\
  document.write(num);\n</script>\n```\n// 输出: -Infinity\n\n-------------------------------------------------------------------------------\n\
  \n### nodeValue 语法\n\n```javascript\ndocument.getElementById(\"\").childNodes[index].nodeValue);\n\
  ```\n\n获取指定节点的值。\n`\"parentNode, firstNode, lastNode\"` 也可以访问 `node`。\n\n例如：\n```html\n\
  <html>\n<p id=\"id00\">A</p><p id=\"id01\">B</p><p id=\"id02\">C</p>\n<script>\n\
  document.write( \"The node value of the id01 is: \" + document.getElementById(\"\
  id01\").childNodes[0].nodeValue);\n</script>\n</html>\n```\n// 输出: A B C The node\
  \ value of the id01 is: B\n\n-------------------------------------------------------------------------------\n\
  \n### now() 语法\n\n```javascript\nconst milliseconds = Date.now();\n```\n\n返回自 1970\
  \ 年 1 月 1 日以来经过的毫秒数。\n\n例如：\n```html\n<script>\nconst milliseconds = Date.now();\n\
  document.write(milliseconds);\n</script>\n```\n// 输出: 1663717971688\n\n-------------------------------------------------------------------------------\n\
  \n### null 语法\n\n```javascript\nvar variable = null;\n```\n\n`\"null\"` 是一个特殊值，表示空值或未知值。\n\
  `null` 的类型为 `\"object\"`。注意：`\"null\"` 不是 `\"undefined\"`。\n\n例如：\n```html\n<script>\n\
  let number = null;\ndocument.write( typeof number );\n</script>\n```\n// 输出: object\n\
  \n-------------------------------------------------------------------------------\n\
  \n### number() 语法\n\n```javascript\nNumber(parameter)\n```\n\n`Number(parameter)`\
  \ 将参数转换为数字。\n\n例如：\n```html\n<script>\ndocument.write(Number(true)+\" \"+Number(\"\
  100\"));\n</script>\n```\n// 输出: 1 100\n\n-------------------------------------------------------------------------------\n\
  \n### 对象创建语法\n\n```javascript\nobj = new Object( );      // 创建一个对象\nobj.property;\
  \             // 对象的属性\nobj.method();             // 对象的方法\n```\n\n例如：\n```html\n\
  <script>\nhouse = new Object( );   // 创建一个对象 \"house\"\nvar size = \"large\";\n\
  var price = \"expensive\";\nfunction build(){ return \"good!\" };\ndocument.write\
  \ ( \"House size:  \" + this.size + \"<br>\" );\ndocument.write ( \"House price:\
  \  \" + this.price + \"<br>\");\ndocument.write ( \"House building:  \" + this.build()\
  \ + \"<br>\" );\n</script>\n```\n// 输出:\nHouse size: large\nHouse price: expensive\n\
  House building: good!\n\n-------------------------------------------------------------------------------\n\
  \n### 对象创建语法\n\n```javascript\nconst object = { property1:value1, property2: value2,\
  \ property: function(){}, …}\n```\n\n一个对象可以包含多个属性和函数。\n\n例如：\n```html\n<script>\n\
  const house = { size:\"large\", price:\"expensive\", build:function(){return \"\
  good!\"} }; // 创建一个对象 \"house\"\ndocument.write(\"The size of the house is \" +\
  \ house.size + \"<br>\");\ndocument.write(\"The price of the house is \" + house.price\
  \ + \"<br>\");\ndocument.write(\"The building of the house is \" + house.build()\
  \ + \"<br>\");\n</script>\n```\n// 输出:\nThe size of the house is large\nThe price\
  \ of the house is expensive\nThe building of the house is good!\n\n-------------------------------------------------------------------------------\n\
  \n### onabort 语法\n\n```javascript\nonAbort=\"function(){}\"\n```\n\n当媒体加载被中止时调用该函数。\n\
  \n例如：\n```html\n<img id=\"myPic\" src=\"image.jpg\" onAbort=\"alert('Image loading\
  \ aborted!')\">\n```\n// 输出: Image loading aborted!\n\n-------------------------------------------------------------------------------\n\
  \n### onblur 语法\n\n```javascript\nonBlur=\"function( )\"\n```\n\n`onBlur` 表示当用户光标离开元素时。\n\
  \n例如：\n```html\n<script>\n// ... \n</script>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onblclick 语法\n\n```javascript\nondblclick=\"function()\"\n```\n\n`ondblclick`\
  \ 表示双击元素时。\n\n例如：\n```html\n<script>\n// ... \n</script>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onchange 语法\n\n```javascript\nonChange=\"function()\"\n```\n\n`onChange` 表示当元素的内容改变时。\n\
  \n例如：\n```html\n<script>\n// ... \n</script>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onclick 语法\n\n```javascript\nonclick=\"function( )\"\n```\n\n`onclick` 表示点击元素时。\n\
  \n例如：\n```html\n<script>\n// ... \n</script>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onerror 语法\n\n```javascript\nonerror=\"function()\"\n```\n\n当媒体无法加载时发生错误，运行\
  \ `function()`。\n\n例如：\n```html\n<img src=\"image.jpg\" onerror=\"alert('The image\
  \ fails to load!')\">\n```\n// 输出: The image fails to load!\n\n-------------------------------------------------------------------------------\n\
  \n### onfocus 语法\n\n```javascript\nonFocus=\"function( )\"\n```\n\n`onFocus` 表示当用户光标移动到页面上的某个元素时，立即执行\
  \ `function( )`。\n\n例如：\n```html\n<html>\n<script>\nfunction myfunction( )\n{ confirm\
  \ (\"Are you ready to input data?\"); }\n</script>\n<input type=\"text\" onFocus\
  \ =\"myfunction( )\">\n</html>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onkeydown 语法\n\n```javascript\nonKeyDown=\"function()\"\n```\n\n`onKeyDown`\
  \ 表示当按下按键时执行 `function( )`。\n\n例如：\n```html\n<html\n<script type=\"text/JavaScript\"\
  >\nfunction myFunction(msg) {\nalert(msg);\n}\n</script>\n<body onKeyDown=\"myFunction('Hello!\
  \ My Friend.')\">\n</body>\n</html>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onkeypress 语法\n\n```javascript\nonKeyPress=\"function( )\"\n```\n\n`onKeyPress`\
  \ 表示当按下按时执行 `function( )`。\n\n例如：\n```html\n<html\n<script type=\"text/JavaScript\"\
  >\nfunction myFunction(msg) {\nalert(msg);\n}\n</script>\n<body onKeyPress=\"myFunction('Hello!\
  \ My Friend.')\">\n</body>\n</html>\n```\n\n-------------------------------------------------------------------------------\n\
  \n### onkeyup 语法：\n\n\n\n\n\n## `onKeyUp` 语法\n\n`onKeyUp = \"function( )\"`\n\n\
  `onKeyUp = \"function( )\"` 意味着当按键释放时，会立即运行 `function( )`。\n\n例如：\n\n``````html\n\
  <html><script type=\"text/JavaScript\">\n\nfunction myFunction(msg) { document.write\
  \ (msg);}\n</script>  \n\n<body onKeyUp =\"myFunction('KeyUp event occurs!')\">\n\
  \n请按下按键，然后释放。 \n\n</body></html\n```\n// 输出: `KeyUp event occurs!`\n\n---\n\n##\
  \ `onload` 语法\n\n`onLoad  = \"function( )\"`\n\n`onLoad = \"function( )\"` 在网页加载完成时执行该函数。\n\
  \n例如：\n\n``````html\n<html><body onLoad = \"myFun()\">   <!-- 载入事件 -->\n<script>\n\
  function myFun(){\ndocument.write (\"Welcome to my website!\");\n}\n</script>\n\n\
  </body></html\n```\n// 输出: `Welcome to my website!`\n\n---\n\n## `onmousedown` 语法\n\
  \n`<element onmousedown=\"function()\">`\n\n// 当鼠标在元素上点击按下时，运行 `function()`。\n\n\
  例如：\n\n``````html\n<h3 onmousedown=\"fun()\">\n\n请在我身上点击按下鼠标！\n\n</h3>\n<script>\n\
  function fun(){\nalert(\"The mouse is clicked down on the text\");\n}\n</script>\n\
  ```\n| // 输出: | `Please click mouse down on me!` |\n| `The mouse is clicked down\
  \ on the text` |\n\n---\n\n## `onmousemove` 语法\n\n`<element onmousemove=\"function()\"\
  >`\n\n// 当鼠标在元素上移动时，运行 `function()`。\n\n例如：\n\n``````html\n<h3 onmousemove=\"fun()\"\
  >\n\n请在我身上移动鼠标！\n\n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse is moved\
  \ on the text\");\n}\n</script>\n```\n| // 输出: | `Please move mouse on me!` |\n\
  | `The mouse is moved on the text` |\n\n---\n\n## `onmouseout` 语法\n\n`onMouseOut\
  \ = \"function( )\"`\n\n`onMouseOut = \"function( )\"` 意味着当鼠标指针移出元素范围时，会立即运行 `function(\
  \ )`。\n\n例如：\n\n``````html\n<html><script type=\"text/javascript\">\n\nfunction\
  \ myfunction() { alert (\"See You!\"); }\n</script>\n\n<body>\n\n<textarea onMouseOut\
  \ =\"myfunction()\">\n\n移开鼠标。</textarea>\n\n</body></html\n```\n// 输出: `See You!`\n\
  \n---\n\n## `onmouseover` 语法\n\n`onMouseOver = \"function( )\"`\n\n`onMouseOver\
  \ = \"function( )\"` 当鼠标移动到元素上方时，立即执行该函数。\n\n例如：\n\n``````html\n<html><script type=\"\
  text/JavaScript\">\n\nfunction myFunction() {\nalert (\"MouseOver event occurs!\"\
  );\n}\n</script>\n\n<body>      <!-- 鼠标悬停事件 -->\n<textarea onMouseOver =\"myFunction()\"\
  >\n\n把鼠标放在在我身上!</textarea>\n\n</body></html\n```\n// 输出: `MouseOver event occurs!`\n\
  \n---\n\n## `onmouseup` 语法\n\n`<element onmouseup=\"function()\">`\n\n// 当鼠标按钮在元素上释放时，运行\
  \ `function()`。\n\n例如：\n\n``````html\n<h3 onmouseup=\"fun()\">\n\n请在我身上点击并释放按钮！\n\
  \n</h3>\n<script>\nfunction fun(){\nalert(\"The mouse button is released up on the\
  \ text\");\n}\n</script>\n```\n| // 输出: | `Please click on me and release up the\
  \ button!` |\n| `The mouse button is released up on the text` |\n\n---\n\n## `onreset`\
  \ 语法\n\n`onReset = \"function( )\"`\n\n`onReset = \"function( )\"` 在表单重置时执行 `function(\
  \ )`。\n\n例如：\n\n``````html\n<html>\n\n<form onReset = \"alert('The form has been\
  \ reset!')\">\n\n<input type = \"text\" id = \"txt\">\n\n<input type = \"reset\"\
  \ value = \"Reset\" >\n\n<!-- 重置事件 -->\n\n</form>\n\n</html\n```\n// 输出: `The form\
  \ has been reset!`\n\n---\n\n## `onresize` 语法\n\n`<body onresize=\"function()\"\
  >`\n\n// 当浏览器窗口发生变化时，运行 `function()`。\n\n例如：\n\n``````html\n<body onresize=\"fun()\"\
  >\n\n<p>请调整浏览器窗口的大小。</p>\n<script>\nfunction fun(){ alert(\"The browser window changes!\"\
  );}\n</script>\n\n</body\n```\n// 输出: `Please resize the browser window.`\n`The\
  \ browser window changes!`\n\n---\n\n## `onscroll` 语法\n\n`<element onscroll=\"function()\"\
  >`\n\n// 当元素的滚动条发生滚动时，运行 `function()`。\n\n例如：\n\n``````html\n<textarea onscroll=\"\
  fun()\">\n\nAAA\n\nBBB\n\nCCC\n\nDDD\n\nEEE\n\nFFF\n\n</textarea>\n<script>\nfunction\
  \ fun(){ alert(\"The scrollbar is scrolled!\");}\n</script>\n```\n// 输出: `The scrollbar\
  \ is scrolled!`\n![](img/image_rsrc837.jpg)\n\n---\n\n## `onselect` 语法\n\n`<element\
  \ type=\"\" value=\"\" onselect=\"function()\">`\n\n// 当元素内容被选中或高亮时，运行 `function()`。\n\
  \n例如：\n\n``````html\n<input type=\"text\" value=\"Highlight Me\" onselect=\"fun()\"\
  >\n<script>\nfunction fun(){ alert(\"The text is being highlighting!\"); }\n</script>\n\
  ```\n| // 输出: | ![](img/image_rsrc837.jpg) |\nThe text is being highlighting!\n\n\
  ---\n\n## `onsubmit` 语法\n\n`onsubmit = \"function( )\"`\n\n`onsubmit = \"function(\
  \ )\"` 在表单提交时执行 `function( )`。\n\n例如：\n\n``````html\n<html>\n\n<form onReset = \"\
  alert('The form has been reset!')\">\n\n<input type = \"text\" id = \"txt\">\n\n\
  <input type = \"reset\" value = \"Reset\" >\n\n<!-- 重置事件 -->\n\n</form>\n\n</html\n\
  ```\n// 输出: `The form has been reset!`\n\n---\n\n## `onunload` 语法\n\n`<body onunload=\"\
  function()\">`\n\n// 当页面卸载时，运行 `function()`。\n注意：由于浏览器版本或设置的原因，`onunload` 可能不起。不建议使用。\n\
  \n例如：\n\n``````html\n<body onunload=\"fun()\">\n\n<p>\"onunload\" event might not\
  \ work.</p>\n<script>\nfunction fun() { alert(\"See You!\"); }\n</script>\n\n</body>\n\
  ```\n// 输出: `onunload` event might not work.\n`See You!`\n\n---\n\n## `open()` 语法\n\
  \n`window.open( url, name, height, status, menubar, toolbar )`\n\n`window.open`\
  \ 可以打开一个新的自定义的窗口。\n\n`url` 参数意味着新窗口的 URL。\n`name` 参数意味着新窗口名称。\n`width` 参数意味着新窗口的宽度。\n\
  `height` 参数意味着新窗口的高度。\n`status` 参数定义窗口的状态栏。\n`menubar` 参数定义窗口的菜单栏。\n`toolbar` 参数定义窗口的工具栏。\n\
  \n例如：\n\n``````html\n<html>\n\n<script>\nfunction openWindow(){\nwindowObj = window.open(\"\
  \ \",\"MyWindow\", \"height=200, width=350, toolbar=yes, menubar=yes, status=no,\
  \ top=200, left=200\"); // 打开一个自定义窗口并创建一个对象\nwindowObj.document.write(\"This is\
  \ a new window.\");\n}\n</script>\n\n<form><center><input type=\"button\" onClick=\"\
  openWindow()\" value=\"Open Window\"></center></form>\n\n</html\n```\n// 结果: 点击按钮时打开新窗口\n\
  \n---\n\n## `opener` 语法\n\n`window.opener`\n\n// 如果 `window2` 在 `window1` 中打开，则\
  \ `window2.opener` 返回 `window1`，而 `window2.opener.close()` 会关闭 `window1`。\n// opener\
  \ 实际上是父窗口（即 `window1`）。\n\n例如：\n\n``````html\n<p id=\"w\">\n\n<button onclick=\"\
  myFun()\">点击我</button>\n<script>\nfunction myFun() { // 打开 window2\nconst window2\
  \ = window.open(\"\", \"\", \"width=200,height=100\");\nwindow2.opener.document.getElementById(\"\
  w\").innerHTML=\"OK\";\n} // 在 window1 中显示 \"OK\"\n</script>\n```\n// 输出: `OK`\n\
  \n\n\n\n\n```javascript\ndocument.write(str.padStart(5,\"0\"));\n```\n\n</script>\n\
  \n// 输出:   000Hi\n\n## parent 语法\n\n`parent.document`\n\n// 返回父窗口。\n\ne.g.\n\n```html\n\
  <button onclick=\"myFun()\">点击我</button>\n\n<script>\nfunction myFun() {     //\
  \ 打开一个子窗口\nconst childWindow = window.open(\"\", \"\", \"width=200,height=100\"\
  );\nparent.document.bgColor=\"green\";\n\n}     //为父窗口设置绿色背景\n</script>\n```\n//\
  \ 输出:\n|  |\n\n## parse() 语法\n\n`Date.parse(dateObject)`\n\n// 返回 1970 年 1 月 1 日与指定日期之间的之间的毫秒数。\n\
  \ne.g.\n\n```html\n<script>\nvar d = new Date (2010, 10, 1);  // 创建日期对象\nvar result\
  \ = Date.parse(d);  \n// 获取从 1970 年 1 月 1 日到指定日期的毫秒数 \ndocument.write ( result );\n\
  </script>\n```\n// 输出:   1288587600000\n\n## parseFloat() 语法\n\n`parseFloat(string)`\n\
  \n// \"parseFloat(string)\" 可以将字符串转换为浮点数。\n\ne.g.\n\n```html\n<script>\nvar str1\
  \ = \"12.66\";  var str2 = \"68.22\";\nvar num1 = parseFloat( str1 );      // 转换为浮点数\n\
  var num2 = parseFloat( str2 );      // 转换为浮点数\nvar addition = num1 + num2;     //\
  \ 执行加法而非拼接\ndocument.write ( addition );\n</script>\n```\n// 输出:   80.88\n\n## parseInt()\
  \ 语法\n\n`parseInt(string)`\n\n// \"parseInt(string)\" 可以将字符串转换为整数\n\ne.g.\n\n```html\n\
  <script>\nvar str1 = \"12\";  var str2 = \"68\";\nvar num1 = parseInt(str1);  //\
  \ 转换为整数\nvar num2 = parseInt(str2);      // 转换为整数\nvar addition = num1 + num2; \
  \ // 执行加法而非拼接\ndocument.write ( addition );\n</script>\n```\n// 输出:   80\n\n## pathname\
  \ 语法\n\n`location.pathname`\n\n// 返回当前页面或 URL 的路径\n\ne.g.\n\n```html\n<script>\n\
  let path = location.pathname;\ndocument.write(path);\n</script>\n```\n// 输出:   /myFolder/myFile.php\n\
  \n## pi 语法\n\n`Math.PI`\n\n// `Math.PI` 是一个存储 π 值的常量。\n\ne.g.\n\n```html\n<script>\n\
  var pi = Math.PI;\ndocument.write (\"The PI value is \" + pi);\n</script>\n```\n\
  // 输出:   The PI value is 3.141592653589793\n\n## platform 语法\n\n`navigator.platform`\n\
  \n// 返回浏览器编译的平台。\n\ne.g.\n\n```html\n<script>\nvar pl = navigator.platform;\ndocument.write(\"\
  Platform: \" + pl);\n</script>\n```\n// 输出:   Platform: Win32\n\n## pop() 语法\n\n\
  `array.pop()`\n\n#### 删除数组的最后一个元素。\n\ne.g.\n\n```html\n<script>\nvar arr = [1,2,3,4,5,6];\n\
  arr.pop( );      // 删除 arr 的最后一个元素\ndocument.write (arr);\n</script>\n```\n// 输出:\
  \   1,2,3,4,5\n\n## port 语法\n\n`location.port`\n\n// 返回当前页面的端口号\n// 如果默认端口为 80 或\
  \ 443，浏览器将返回空。\n\ne.g.\n\n```html\n<script>\nlet num = location.port;\ndocument.write(\"\
  The port number of the current page is: \" + num);\n</script>\n```\n// 输出:   The\
  \ port number of the current page is: (可能为空)\n\n## POSITIVE_INFINITY 语法\n\n`Number.POSITIVE_INFINITY`\n\
  \n// `POSITIVE_INFINITY` 表示无穷大，返回溢出\n\ne.g.\n\n```html\n<script>\nlet num = Number.POSITIVE_INFINITY;\n\
  document.write(num);\n</script>\n```\n// 输出:   Infinity\n\n## pow() 语法\n\n`Math.pow(\
  \ x, y )`\n\n// 返回 `x` 的 `y` 次幂。即 (xy)\n\ne.g.\n\n```html\n<script>\nvar result\
  \ = Math.pow(6, 2);\ndocument.write ( result );\n</script>\n```\n// 输出:   36\n\n\
  ## print() 语法\n\n`window.print()`\n\n// 打印当前窗口的内容。\n\ne.g.\n\n```html\n<script>\n\
  function printWin( ){\nwindow.print( );      // 打印当前窗口\n}\n</script>\n<form>\n<input\
  \ type=\"button\" onclick=\"printWin( )\" value=\"打印\">\n</form>\n```\n// 点击“打印”按钮打印当前页的内容\n\
  \n## promise() 语法\n\n`new Promise(function(resolve, reject) {…}`\n\n// `Promise()`\
