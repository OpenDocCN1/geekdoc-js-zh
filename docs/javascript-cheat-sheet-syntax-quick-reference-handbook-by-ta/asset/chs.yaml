  </script>\n```\n// 输出: 1 2 3 4 5\n\n\n\n\n\n# 获取日期、月份、年份、日期、完整年份语法：\n\n`dateObject.getDate(\
  \ )`\n`dateObject.getMonth( )`\n`dateObject.getYear( )`\n`dateObject.getDay( )`\n\
