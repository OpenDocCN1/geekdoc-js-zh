- "# JavaScript 快速查表，语法快速参考手册：语法快速学习指南\n\n\n\n![](img/image_rsrc834.jpg)\n\n\n## 关于本书\n\
  这本书涵盖了所有基础的 JavaScript 语法，几乎每个语法条目都列出了一个程序示例和结果输出。我们可以快速参考最有帮助的编程语法，例如常用命令语法、字符串函数语法、集合函数语法、类与对象语法……所有这些语法对于编程都非常有用。\n\
  \n我们可以将此书视为基础语法手册，因为它的条目是按字母顺序排列的，方便我们快捷地参考重要的语法。\n\n无论现在还是未来，《JavaScript 语法书》都能为我们的学习和工作编码提供巨大的帮助。\n\
  \n\n\n\n## 免责声明\n本书仅作为基础语法手册；它不能包含该主题的所有条目。其目的是作为速查表书籍的补充，而不是作为完整的 JavaScript 字典。\n\
