  \n## extends 语法:\n\n```javascript\nclass BassClass { }; // 基类\nclass DerivedClass\
  \ extends BassClass{ };\n```\n\n// 派生类可以扩展基类。\n// 派生类继承基类的所有属性和方法。\n\n例如\n\n```html\n\
