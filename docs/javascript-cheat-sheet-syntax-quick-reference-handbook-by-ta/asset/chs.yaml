  ，这样另一个文件 \"myImport.html\" 就可以导入此文件。\n\n---\n\n## export default 语法\n\n```javascript\n\
  export default functionName;\n```\n\n\n\n\n\n# 将数据导出到任何需要导入数据的文件中。\n\n例如\n\n```javascript\n\
  const person = () => {\n  const name = \"Smith\";\n  const age = 17;\n  return name\
