    13.  <meter>- measurement within a known range


    14.  <nav>- shows navigation links in the document


    15.  <progress>-shows the progress of a task


    16.  <rp>- describes what to show in the browser


    17.  <section>- defines a section or a part of document


    18.  <summary>- visible heading for a <detail> element


    19.  <time>- gives date and time


    20.  <wbr> - possible line break.


    **Attributes in HTML5**


    In HTML, elements can have attributes which can set the different properties of
    the element and change its behavior. Some attributes have to be defined globally,
    and they can be used with any element. However, there are others which are meant
    to be used with certain specific elements only. Attributes are meant to be specified
    in the start tags. They can never be used in the closing tags.


    Like elements, attributes in HTML5 are insensitive to cases. They can be written
    in any case you want. However, you should practice using only lower case for them.


    Most of the attributes along with their possible values are defined in the HTML
    specifications. As such, you do not have the ability to create your own attributes.
    If you do so, it will make the HMTL invalid. After all, it can confuse the user
    agents and even cause issues in the correct interpretation of the web page.


    **Standard Attributes**


    Listed below are some of the standard attributes used in HTML5


    | **Attribute** | **Options** | **Functions** |


    | align | Left, right, center | Aligns the tag horizontally |


    | bgcolor | Hexidecimals, numeric, RGB values | A background color is placed behind
    an element |


    | accesskey | User defined | Defines a keyboard shortcut to access an element
    |


    | class | User defined | Differentiates an element for the use with cascading
    style sheets |


    | height | Numeric value | Defines the height of images, tables or table cells.
    |


    | Item | List of elements | It is used to group elements |'
