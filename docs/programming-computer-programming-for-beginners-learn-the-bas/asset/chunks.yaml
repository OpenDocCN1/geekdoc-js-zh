  trans: "\n\n- **多设备兼容性**：你可以使用样式表针对各种设备优化你的内容。\n- **全球标准**：事实是，`HTML` 中可用的属性正在减少。相反，`CSS`\
    \ 被推荐作为替代方案。因此，`CSS` 正被用于所有网页，以确保与未来网络浏览器的兼容性。\n\n## CSS 的缺点\n\n1. **CSS 的不同级别**\
    \ - 该语言有多个层级，从 `CSS1` 到 `CSS3`，这导致开发者之间对于应该使用哪个版本感到困惑。\n2. **碎片化** - 在 `CSS` 中，在某个浏览器中有效的内容可能在另一个浏览器中不起作用。因此，Web\
    \ 开发人员在网站上线之前，必须通过在多个浏览器中运行程序来测试兼容性。\n3. **缺乏安全性**：由于 `CSS` 是一个基于文本的开放系统，它没有内置的安全系统。因此，任何拥有网站读写权限的人都可以无意或有意地更改\
    \ `CSS` 文件、链接或更改格式。\n\n## 开始使用 CSS\n\n要开始使用 `CSS` 需要一个文本编辑器、现代浏览器和一些经验。让我们来看看\
    \ `CSS` 是如何工作的：\n\n当文档在浏览器中显示时，它必须将样式信息与文档的内容结合。文档的处理分为两个阶段：\n\n1. 浏览器将 `CSS`\
    \ 和标记语言转换为 `Document Object Model`（`DOM`），它代表了计算机内存中的文档。\n2. 浏览器显示文档的内容。\n\n在标记语言中，元素用于定义文档的结构。正如我们在上一节中中学的，元素是用标签标记的。`CSS`\
    \ 中的大多数元素都有起始标签和结束标签。标签以 `<` 符号开头并以 `>` 。\n\n然而，取决于标记语言，少数元素的 `/` 位于元素名称之后，且它们只有单个标签或起始标签。每个属性、元素和每段文本都成为\
    \ `DOM` 树形结构中的节点。这些节点由它们与其他 `DOM` 节点的关系来定义，即某些元素作为子节点的父节点，而子节点可能有一些兄弟节点。\n\n理解\
    \ `document object model` 将帮助你调试、设计和维护 `CSS`。让我们来看一个例子来解释这个模型——\n\n在文档中，`<p>`\
    \ 标签及其结束标签创建了一个容器：\n\n```html\n<p>\n <strong>C</strong>ascading\n <strong>S</strong>tyle\n\
    \ <strong>S</strong>heets\n</p>\n```\n\n在 `DOM` 中，`P` 节点是父节点，其子节点是文本节点和 `strong`\
    \ 节点，其中 `strong` 节点也是文本节点的父节点。\n\n## Hello World 程序\n\n与其他语言一样，hello world 程序可以作为\
    \ `CSS` 的良好介绍。你可以在下面的示例中看到 `CSS` 的实际效果。\n\n```css\n<style type=\"text/css\">\n\
    h1 {\nColor: DeepSkyBlue;\n}\n</style>html\n<h1>Hello, world! </h1>\n```\n\n如你所见，此\
    \ `CSS` 规则针对 `HTML` 页的 `H1` 标签。在这种情况下，我们通过一个名为 `DeepSkyBlue` 的颜色值更改了 `H1` 文本的颜色。\n\
    \n## 创建并将 CSS 应用到 HTML 文件\n\n在开始为你的 `HTML` 文件创建自己的 `CSS` 之前，你需要知道如何在 `HTML` 中实现\
    \ `CSS`。为了实现这一点，你有四种可用方案。它们列在下面。\n\n### 1. 内联 (Inline)\n\n在这种方法中，样式规则直接放置在 `HTML`\
    \ 文件中。在需要更改样式的标签中使用 `style` 属性。这里有一个内联方法的示例。\n\n```html\n<p style=\"color: blue\"\
    >…</p>\n```\n\n此规则的结果将是该段落的文本变为蓝色。\n\n使用这种方法也有缺点，因为它会让 `HTML` 膨肿，并且网站维护变得有些困难。但是，它在某些情况下运行良好。例如，如果你使用的系统无法访问\
    \ `CSS` 文件，那么你可以简单地将样式规则添加到元素中。\n\n### 2. 内部 (Internal)\n\n如果你想为整个页面实现特定的样式规则，你应该选择内部样式方法。它被称为嵌入式方法。规则放置在\
    \ `head` 元素内部。你可以在下面的示例看到它是如何工作的。\n\n```html\n<!DOCTYPE html>\n<Html>\n<Head>\n\
    <Title>CSS Example</title>\n<Style>\nP {\nColor: green;\n}\nA {\nColor: blue;\n\
    }\n</Style>\n</head>\n</html\n```\n\n当你使用这种方法时，你会发现所有段落都是绿色的，而所有链接都是蓝色的。\n\n这种方法的缺点是，每当有人访问网页时，样式都必须被下载。这给用户带来了缓慢的浏览体验。然而，这种方法也有自己的优势。由于\
    \ `CSS` 是 `HTML` 文档的一部分，整个页面仅作为一个一个文件存在。当你通过电子邮件向某人发送网页或将其用作博客的模板时，它是很有用的。嵌入方法的另一个优势是，当使用数据库生成页面内容时，可以同时生成动态样式。标题和其他元素的颜色被插入到嵌入在页面上的\
    \ `CSS` 规则中。它允许用户更改颜色。\n\n### 3. 外部 (External)\n\n正如名称所示，这种方法涉及创建一个完全独立的 `CSS`\
    \ 文件。这允许在多个页面使用它。这就是为什么要避免内联和内部方法的原因。下面是一个 `CSS` 文件的基本示例。\n\n```css\nP {\nColor:\
    \ green;\n}\nA {\nColor: blue;\n}\n```\n\n此文件需要保存在与 `HTML` 页面相同的目录下。你可以为 `CSS`\
    \ 文件选择任何名称，但常见的命名规范规定它应该命名为 `style.css` 以便你操作。一旦文件被保存，你就可以将 `HTML` 文件链接到它。以下代码显示了如何链接\
    \ `HTML` 文件。\n\n```html\n<!DOCTYPE html>\n<Html>\n<Head>\n<Title>Example</title>\n\
    <link rel=\"stylesheet\" href=\"style.css\">\n```\n\n在保存 HTML 文件时，它将链接到保存在相同目录下的名为\
    \ `style.css` 的 CSS 文件。你对 `CSS` 文件的任何更改将在打开相应的 `HTML` 文件时反映出来。\n\n链接到单独 `CSS`\
    \ 文件的优势是，如果你想更改整个网站的样式，只需要在单个 `CSS` 文件中进行一次更改。使用这种方法的另一个优势是速度。在第一次访问网站时，用户的浏览器会下载当前页面的\
    \ `HTML` 以及链接的 `CSS` 文件。当用户导航到网站的其他页面时，他们的浏览器只需要下载 `HTML` 页面，从而提高了浏览速度。\n\n**从\
    \ CSS 内部导入 CSS 文件**：此 `import` 规则允许从 `CSS` 内部附加一个新的 `CSS` 文件。要做到这一点，只需只需执行以下操作——\n\
    \n```css\n@import “newstyles.css’;\n```\n\n在这里，你可以编写你的 `CSS` 文件名代替 `newstyles`，并确保包含正确的路径。例如，我们有一个\
    \ 500 个页面的网站，想为所有页面添加第二个 `CSS` 文件。因此，我们不需要通过编辑所有 500 个 `HTML` 文件来添加另一个 `CSS` 链接，只需从第一个文件中导入第二个\
    \ `CSS` 文件，从而节省了大量时间。\n\n## CSS 规则的语法\n\n"
