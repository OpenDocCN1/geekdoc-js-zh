    ### 3. The layout issues can be fixed with JavaScript. By using this scripting
    language one can find area and position of any element on a particular page along
    with dimension of the browser window. This can prevent the overlapping issues.
    For example, your website has several levels of menu, but upon checking you find
    out that there is a space for sub-menu. So by showing it before you can prevent
    overlapping menu items.


    ### 4. Under JavaScript you can load information which can be accessed by only
    those users who find it relevant. For example; a navigation menu of a website
    has 5 links but other links to deeper pages will only be displayed when user activates
    the menu item.


    ### 5. Information which changes constantly such as sports match scores or stock
    market can be loaded from time to time without user interaction.


    ## Fundamentals of JavaScript


    JavaScript has become one of the most prominent languages on the internet. It
    can be used across platforms and various browsers. Therefore in order to use this
    language in practical world, we need to first learn about its fundamentals. This
    would give you a foundational understanding of JavaScript.


    #### 1. Variables


    As you already know, variables are containers in which data can be stored. The
    data stored in a variable can be an expression or a value. Expressions can be
    of three types in JavaScript language.


    | Expression | Description |

    | :--- | :--- |

    | Logical | Evaluates to a Boolean i.e. true or false |

    | Arithmetic | Evaluates to a number |

    | String | Evaluates to a String |


    #### The Scope of Variables in JavaScript


    The variable scope refers to the section of the program in which the variable
    is defined. Variables in JavaScript can have either one of two scopes.


    **Global Variables:** These variables can be defined anywhere in your code due
    to its global scope.


    **Local Variables:** These variables exist only inside the function that it has
    been defined in. Function parameters will always be local to that specific function.


    The local variable can be declared by using the `var` as keyword and global variables
    should be used without using `var` as keyword. For example: If a local variable
    is declared inside a function and it cannot be accessed outside of that function,
    thus making it local to that function. In case you declare the same variable without
    keyword `var`, it becomes accessible to the entire script and not only within
    that function.


    In JavaScript, a local variable will be given precedence inside the body of the
    function if there is a global variable that has the same name. By declaring a
    local variable that has the same name as that of a global variable, you are effectively
    hiding that global variable in the function.


    Let us look at an example for a local variable


    ```

    var num= 20;

    ```


    If you want to access the value of the `num` variable at some other point in the
    script, then you simply refer with the variable name. `document.write` function
    writes data to the web page.


    Look at the syntax below:


    ```javascript

    document.write(“The value of num is: “ +num);

    ```


    The result which we will get would be “The value of num is 20”.


    In order to store arithmetic expressions in a variable we simply need to assign
    the variable to the calculated value. Not the calculation but the result of that
    calculation gets stored in that variable. Therefore once again we will get the
    result as “The value of num is 20”. Look at the following example:


    ```javascript

    var num = (10+10);

    document.write( “ The value of num is: “+ num);

    ```


    In case you want to access the value of the `num` variable at some other point
    in the script, then you simply refer with the variable name. `document.write`
    function writes data to the web page.


    ```javascript

    document.write(“The value of num is: “ +num);

    ```

