    ```


    2. **在 <body> 标签内部**

    在某些情况下，你可能需要脚本在页面加载时运行。这样做是为了允许脚本生成页面中的内容。在这种情况下，脚本必须放置在 `<body>` 标签内部。在这种方法中，你将不会任何用
    JavaScript 定义的函数。你可以看到下面提供的此类 JavaScript 包含的示例。


    ```html

    39. <Html>

    40. <Head>

    41. </head>

    42. <Body>

    43. <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <p>Web Page</p>

    </body>

    </html>

    ```


    3. **在 <head> 和 <body> 标签内部**

    如果你愿意，可以结合这两种方法。换句话说，你可以将 JavaScript 同时放置在 `<head>` 和 `<body>` 中。查看示例了解如何工作。


    ```html

    45. <Html>

    46. <Head>

    47. <script type="text/javascript">

    <!--

    Function sayHello () {

    Alert ("Hello World")

    }

    //-->

    </script>

    </head>

    <Body>

    <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <input type="button" onclick="sayHello ()" value="Say Hello" />

    </body>

    </html>

    ```


    4. **在外部文件中**

    在创建简单页面时，将 JavaScript 包含在 HTML 文档内部是一个好主意。但是，当你创建网站时，可能会发现自己在多处重复相同的代码。正如你在 CSS
    中看到的，你可以创建一个完全独立的文件来存放 JavaScript 代码。该文件应该具有 `.js` 扩展名，并与需要代码的网页关联。下面的示例说明了如何在
    HTML 文档中包含外部 JavaScript 文件。在此示例中，`filename.js` 是包含 JavaScript 代码的文件。


    ```html

    49. <Html>

    50. <Head>

    51. <script type="text/javascript" src="filename.js" ></script>

    52. </head>

    53. <Body>

    ```


    ### JavaScript 中的事件（Events）

    事件是指是导致 JavaScript 代码执行的动作。事件通常由用户触发。例如，鼠标的点击可以是一种事件。根据事件，你可以在 JavaScript 中编写响应。例如，显示消息可以是对事件的响应。这些响应可以被称为事件处理器，因为它们处理正在发生的事件。在
    JavaScript 中，可以以多种方式对事件进行分类。毕竟，它们非常多。


    #### 15. onClick 事件

    常见的事件类型是 `onClick` 事件。每当用户左键点击网页时，该事件就会发生。针对此事件，你可以做出相应的响应，例如显示消息或进行你的验证。下面的示例说明了如何使用此类事件显示消息。


    ```html

    57. <Html>

    58. <Head>

    ```


