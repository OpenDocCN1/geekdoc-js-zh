    这一章应该让你对 HTML 的基础知识及其功能有了深入的理解。现在让我们来看一些关于该编程语言的常见问题，以便更清晰地理解这一主题。


    ## 常见问题 (FAQ)


    ### HTML5 的目的是什么？

    答：HTML5 的设计是为了克服 `XHTML`、`HTML4` 和 `HTML DOM level2\` 的缺点。该语言专注于在不使用额外插件的情况下交付高质量内容。该语言新的结构化元素标签为整个网页结构提供了更好的语义支持。错误处理被简化了，它还提供了向后兼容性。HTML5
    可以在平板电脑、智能手机和 PC 等平台上实现。


    ### HTML5 规范可以在所有类型的浏览器上实现吗？

    答：截至目前，还没有哪个浏览器支持该语言的所有方面。因此，开发者必须确保他可能使用的特性将被其显示内容的浏览器所支持。


    ### HTML 标签（tags）和元素（elements）不同吗？

    答：HTML 中的元素告诉浏览器如何呈现文本。而当元素被 `<>`（尖角括号）包围时，它们就变成了标签。


    ### 你所说的 DOCTYPE 是什么意思？它的新形式是什么？

    答：这个术语告诉浏览器网页上使用了哪种 HTML。浏览器使用 `CTYPE` 来确定如何制作网页。新形式是 `<!doctype html>`。


    ### 描述 HTML5 中 header、section、article 和 footer 的正确用法？

    答：Header - 用于包含给定页面的某个部分的导航和介绍性信息。这些信息可以是作者姓名、日期、时间、章节标题、目录或任何导航信息。


    Section - 这是一个灵活的容器，用于存放内容并共享共同信息。


    Article - 它包含一个自包含的性作品，该作品可以在页面之外独立地重新创建，而不会丢失其含义。例如：博客文章、新闻故事等。


    Footer - 它包含应在内容末尾显示的信息，也可能包含关于该章节的额外信息。例如：版权信息、相关链接等。


    ### HTML5 支持哪些媒体元素？

    答：它同时支持音频 (audio) 和视频 (video) 标签。


    ### HTML5 中包含新的图像元素吗？

    答：是的，有两个新的图像元素，它们是 `WebGl` 和 `Canvas`。`Canvas` 包含图形，而 Web Graphics Language (`WebGL`)
    是一种免费的跨平台工具，用于在浏览器中生成 3D 图形。


    ### 为什么我们需要 data-attributes（数据属性）？

    答：该属性是语言的新增功能，用于为元素分配自定义数据。该元素适合存储应用程序或页面特有的私或敏感数据，而这些数据没有匹配的元素和属性。


    ### HTML5 带有哪些标准 API？

    答：其中一些是：Text Track、Media、Application Cache（应用缓存）、Command、User Interaction（用户交互）、Data
    Transfer（数据传输）、Constraint Validation（约束验证）和 History API。


    ### HTML 浏览器缓存和 HTML5 应用缓存的区别是什么

    答：HTML5 应用缓存会创建一个离线版本，并在本地存储图像、HTML 文件、CSS 和 JavaScript 等文件，因此与传统的 HTML 缓存相比，它增加了网站的速度。


    总的来说，HTML 5 是一种用于创建强大的基于浏览器的应用程序语言。它允许你格式化文本、创建链接、添加图形、输入表格、表单、框架等，并将其保存到文本文件中，任何浏览器都可以读取并显示。


    现在你已经对 HTML5 有了了解，可以轻松地使用和实现这种编程语言来创建网站了。


    ## 第 3 章：理解 CSS：互联网的样式化


    HTML 的功能是创建网页。然而，它无法确保内容的正确呈现。为了让网页变得美观并提高其呈现效果，你需要使用如 `CSS` 这样的样式语言。


    ### 什么是 CSS？

    CSS 代表 Cascading Style Sheets（级联样式表），是一种简化确保你的网页具有可呈现过程的设计语言。它负责网页的外观。通过它，你可以控制页面的各个方面，如字体样式、文本颜色、列宽、段落间距、布局、背景图像或颜色或其他设计。你还可以启用显示变化以适应不同的屏幕尺寸和设备。


    `CSS` 通常用于指定 `HTML` 或 `XHTML` 编写的网页的视觉样式。然而，你也可以将该语言用于各种 `XML` 文档类型。


    `CSS` 的创建是为了允许文档内容与文档呈现（包括颜色、字体和布局）分离。通过将它们分离，可以改进某些方面，例如内容的可访问性。它还增强了在呈现的各个方面方面的控制能力和灵活性。它还允许多个
    `HTML` 文件共享相同的格式。


    这种分离使得以多种样式交付相同的页面成为可能，以适应不同的渲染方法，例如打印、屏幕显示和语音。用户也可以创建一个不同的 `CSS` 文件来覆盖由网页创建者指定的样式。


    目前，正在使用的最新 `CSS` 版本是 `CSS3\`。`CSS3` 在以前一个版本的基础上为该语言带来了许多新功能。我们将在本书书中重点关注 `CSS3`。


    ### CSS 的历史

    Hakon Wium Lie 在 1994 年 10 月 10 日首次提出了 `CSS`。在同一时期还提出了许多其他样式表语言。最后 `CSS1` 于 1996
    年发布，Microsoft Internet Explorer 成为第一个支持 `CSS` 的浏览器。这种语言专门开发用于保留网络上的内容，而 `HTML`
    则用于在万维网上创建文档。


    样式表的概念并不新鲜。然而，现有的语言要求样式表来自网络上的不同来源，而另一方面 `CSS` 通过级联样式影响文档样式。“级联”意味着组合多个 `CSS`
    文件来决定一个页面样式的能力。


    让我们来看看 `CSS` 的一些优势和缺点


    ### CSS 提供的优势

    使用 `CSS` 有一些显著的优势。其中一些提到如下：


    - **节省时间 (Timesaver)**：`CSS` 的最大优势之一是在 Web 开发中节省了大量时间。一个 `HTML` 页面只需要编写一次 `CSS`。然后它可以在多个
    `HTML` 页面上反复重复使用。可以为 `HTML` 中的每个元素定义样式，然后将其应用于各种网页。

    - **易于维护 (Easy Maintenance)**：`CSS` 允许你非常方便地维护多个页面。你可以通过更改 `CSS` 中的样式来轻松进行全局更改。所有
    `HTML` 页面中的相应元素将自动更新。

    - **页面加载更快 (Faster Loading Pages)**：在使用 `CSS` 时，没有必要在 `HTML` 中多次定义标签属性。只需要为标签编写一条
    `CSS` 规则，并将其应用到该特定标签的所有出现处。这大大减少了你的代码，从而加快了每个页面的下载速度。

    - **更好的样式 (Better Styles)**：与 `HTML` 相比，`CSS` 提供了范围得多的属性。这允许你改进 `HTML` 页面的外观，远比只使用
    `HTML` 属性所实现的要。

    - **缓存 (Caching)**：`CSS` 允许通过离线缓存本地存储 Web 应用程序。这允许你离线查看网站。缓存还能够更快地加载页面，并提高网站的整体性能。


