    \ type of data can be stored under one single array and that particular array\
    \ can be assigned a name which is related to the items it consists of.\n\nLet\
    \ us look at an example:\n\nvar shapes = new Array(“rectangle”, “square”, “triangle”);\n\
    \nvar colors = new Array( “red”, “pink”, “orange”);\n\nTo access any item in the\
    \ array you have to use its ID. It is the item’s position in the array. Arrays\
    \ always start with a 0 as an ID instead of 1 which might get confusing in the\
    \ beginning but with practice you can find the concept easy to learn. The ID’s\
    \ work in ascending order; like 0,1,2,3 and so on. Below is an example to understand\
    \ this concept-\n\nvar colors = new Array( “red”, “pink”, “green”);\n\ndocument.write(\
    \ “red: “+colors[0]);\n\ndocument.write( “pink: “+colors[1]);\n\ndocument.write(\
    \ “green: “+colors[2]);\n\nIn an array you can also assign values to a particular\
    \ position. For example:\n\nvar colors = new Array ();\n\ncolors [0] = “red”;\n\
    \ncolors [1] = “pink”;\n\ncolors [2] = “green”;\n\ndocument.write (“pink: “+colors\
    \ [2]);\n\n//update pink to blue\n\nColors [1] = “blue”;\n\ndocument.write (“blue:\
    \ “+ colors [2]);\n\n**Objects-** The objects are written with curly brackets.\
    \ The properties of object are written as –:\n\nname: value pairs, separated by\
    \ commas\n\nExample for objects:\n\nVar person = {first name: “Ryan”, last name:\
    \ “Booth”, age:35, eyeColor: “brown”};\n\nThe above example has four properties;\
    \ age, eye color, first name and last name.\n\n**Operators –** To perform any\
    \ operation in JavaScript we need operators. They include comparison, subtraction,\
    \ addition and many more. There are four basic operators:\n\n*   Assignment\n\n\
    *   Arithmetic\n\n*   Logical\n\n*   Comparison\n\nArithmetic operators-These\
    \ operators perform basic mathematical operations like division, addition, multiplication,\
    \ subtraction and so on.\n\n| Operator | Description |\n\n| * | Multiplication\
    \ |\n\n| - | Subtraction |\n\n| + | Addition |\n\n| / | division |\n\n| * | To\
    \ find the remainder (modulus) |\n\n| - | Decrement |\n\n| ++ | increment |\n\n\
    Assignment Operators-They are used to assign values to variables in JavaScript.\
    \ Listed below are all available assignment operators:\n\n| **Operator** | **Description**\
    \ |\n\n| **=** | Equal |\n\n| **+=** | Variable is assigned addition value |\n\
    \n| **-=** | Variable is assigned subtraction value |\n\n| ***=** | Variable is\
    \ assigned multiplication value |\n\n| **/=** | Variable is assigned division\
    \ value |\n\n| **%=** | Variable is assigned modulo value |\n\n**Example:** var\
    \ num =20;\n\ndocument.write(“The value of num is: “+num);\n\n //update the value\
    \ of num to 30\n\n num= (num+10);\n\n document.write( “ The new value of num is:\
    \ “+num);\n\nComparison Operators- These operators establish the relationship\
    \ between variables or their values. They are used inside conditional statements\
    \ (we will learn about this later) to create logic by comparing variables or their\
    \ values. This helps in evaluating whether the statement is true or false. Types\
    \ of comparison operators are:\n\n| **Operator** | **Description** |\n\n| <  |\
    \ Less than |\n\n| >  | Greater than |\n\n| == | Equal to |\n\n| != | Not equal\
    \ to |\n\n| === | Equal to, in object and value type |\n\n| >= | Greater than\
    \ or equal to |\n\n| <= | Less than or equal to |\n\nLogical Operators- They combine\
    \ comparison operators and are typically used in conditional statements. Types\
    \ of Logical operators are:\n\n| **Operator** | **Description** |\n\n| **!** |\
    \ Not |\n\n| && | And |\n\n| &#124;&#124; | Or |\n\n3.  **Conditional Statements**\n\
    \nLike other programming languages, there are different kinds of conditional statements\
    \ available in JavaScript. They allow you to define a condition whose results\
    \ determine the action that will be done. They allow your program to make a decision\
    \ based on the outcome of the condition and perform the relevant action.\n\nIn\
    \ order to create any kind of logic in a programming language, conditional statements\
    \ act as the basis for it. Conditional statements can be written in four ways\
    \ under JavaScript.-\n\n| **Statement** | **description** |\n\n| Switch | To execute\
    \ one out of many scripts |\n\n| If | Execute a script if a result of a specific\
    \ condition is true |\n\n| If..else | There are two codes in this conditional\
    \ statement. If statement executes a script when the condition is true whereas\
    \ the code under else statement is executed when the condition is false |\n\n\
    | If..else if..else | Execute a script if one of the unlimited conditions is true\
    \ or if all conditions are false then execute another script. |\n\nThe basic syntax\
    \ for the if…else statement is given below.\n\n***If (expression) {***\n\n ***Statement(s)\
    \ to be executed if expression is true***\n\n***}***\n\nExamples:\n\n**if**\n\n\
    var num=20;\n\nif (num==10)\n\n{\n\ndocument.write( “num is equal to 10”);\n\n\
    }\n\n**if..else**\n\nvar num= 20;\n\nif (num==10)\n\n{\n\n Document.write(“num\
    \ is equal to 10”);\n\n}\n\nElse\n\n{\n\n Document.write( “num is NOT equal to\
    \ 10, num is: “+num);\n\n}\n\n**if..else if…else**\n\nVar num=20;\n\nIf (num==10)\n\
    \n{\n\ndocument.write( “num is equal to 10”);\n\n}\n\nelse if (num==20)\n\n{\n\
    \ndocument.write( “num is equal to 20”);\n\n}\n\nelse\n\n{\n\ndocument.write(\
    \ “num is: “+num”);\n\n}\n\n ( d) **switch**\n\nvar num= 20;\n\n switch (num)\n\
    \n {\n\n case 10:\n\n document.write(“ num is equal to 10”);\n\n break;\n\n case\
    \ 20:\n\n Document.write(“ num is equal to 20”);\n\n break;\n\n default:\n\n document.write(\
    \ “num is: “+num);\n\n }\n\nIn the above example case clause defines whether the\
    \ value of data used is equal to value of switch and the break statement stops\
    \ the switch statement from executing the rest of the statement. The default clause\
    \ identifies a default script if none of the case statements are executed or if\
    \ break statements are not there in the executed statements. For example\n\nvar\
    \ num=20;\n\nswitch(num)\n\n{\n\ncase 10:\n\ndocument.write(“num is equal to 10”);\n\
    \nBreak;\n\ncase 20:\n\ndocument.write(“num is equal to 20”);\n\ndefault:\n\n\
    document.write(“num is: “+num);\n\n}\n\nTherefore the result of above example\
    \ would be “num is equal to 20” followed by “num is:20”\n\n5) **Functions**\n\n\
    Functions are the containers for the script. They are only to be executed by a\
    \ call to the function or an event. Hence, they are not executed when browser\
    \ is initially loaded and executes the script that is the part of web page.\n\n\
    For structuring a function f*unction* word followed by a space is used. The name\
    \ of the function can be anything; however one should ensure that the name given\
    \ is related to the task it will perform. Example:\n\nvar num =20;\n\nfunction\
    \ changevariablevalue()\n\n{\n\n num=21;\n\n}\n\nChangevariablevalue();\n\nDocument.write(\
    \ “num is: “+num);\n\n6) **Loops**\n\nLoops are used to iterate the arrays and\
    \ execute script along while accessing their values. Loop typically consists of\
    \ variable that has been assigned a numeric value. That variable is then used\
    \ with a comparison operator to compare it against other value. After this the\
    \ numeric value is increased or decreased. The comparison in the loop typically\
    \ determines whether the initial value of a variable is greater or less than another\
    \ numeric value. So till the time that condition is true the loop will run and\
    \ the value of variable is increased or decreased till the time condition becomes\
    \ false.\n\nLooping allows you to execute a single block of code multiple times\
    \ till a given condition is met. JavaScript offers two kinds of loops, the for\
    \ loop, and the while loop.\n\n**a) The for loop**\n\nThe for loop allows the\
    \ same block of code statements to be repeatedly executed till a certain specified\
    \ condition is met. The syntax of the for loop is given as follows.\n\n***30.*\
    \ *For (initial expression; condition expression; loop expression)***\n\n***31.*\
    \ *{Statements}***\n\n**Example:**"
