- fmt: "\n- **Multiple Device Compatibility**: You can use style sheets to optimize\
    \ your content for a range of devices.\n- **Global Standards**: The fact is that\
    \ the attributes available in `HTML` are being reduced. Instead, `CSS` is being\
    \ recommended as the alternative. As a result, `CSS` is being used for all web\
    \ pages to ensure compatibility with web browsers of the future.\n\n## Disadvantages\
    \ of CSS\n\n1. **Different levels of CSS** - The language comes in different levels\
    \ from `CSS1` to `CSS3` which has resulted in confusion amongst the developers\
    \ about which version should be used.\n2. **Fragmentation** - in `CSS` what might\
    \ work with one browser may not work with the other. Therefore the web developers\
    \ have to first test the compatibility by running the program across multiple\
    \ browsers before a website is made live.\n3. **Lack of security** - `CSS` doesn’t\
    \ have a built in security system since it has an open text-based system. So anyone\
    \ who has a read-write access to the website can alter the `CSS` file, links or\
    \ change the formatting whether by mistake or by design.\n\n## Getting Started\
    \ with CSS\n\nTo get started with `CSS` one needs a text editor, a modern browser\
    \ and some experience. Let us look how `CSS` works:\n\nWhen a document is displayed\
    \ in a browser, it must combine the style information with the content in the\
    \ document. The document gets processed in two stages:\n\n1. Browser converts\
    \ `CSS` and the markup language into the `Document Object Model` or `DOM`, which\
    \ represents the document in computer’s memory.\n2. Content of the document is\
    \ displayed by the browser.\n\nIn the markup language, elements are used to define\
    \ the document’s structure. As we have learnt in the previous chapter, elements\
    \ are marked using tags. Most of the elements in `CSS` have a starting and an\
    \ ending tag. The tags begin with the symbol `<` and end with `>`.\n\nHowever,\
    \ depending on the markup language few elements, where `/` comes after name of\
    \ the element and they have only single or start tag. Each attribute, element\
    \ and run of text becomes the node in the tree like structure of `DOM`. These\
    \ nodes are defined by their relationship to other `DOM` nodes i.e. there are\
    \ some elements which act as a parent for child nodes and child nodes might have\
    \ some siblings.\n\nUnderstanding the `document object model` will help you to\
    \ debug, design and maintain `CSS`. Let us look at an example to explain this\
    \ model-\n\nIn a document, the `<p>` tag and its end tag create a container:\n\
    \n```html\n<p>\n <strong>C</strong>ascading\n <strong>S</strong>tyle\n <strong>S</strong>heets\n\
    </p>\n```\n\nIn `DOM`, `P` node is parent and its children are text nodes and\
    \ `strong` nodes, where `Strong` nodes are also parents of text nodes.\n\n## The\
    \ Hello World Program in CSS\n\nAs with other languages, the hello world program\
    \ can serve as a good introduction to `CSS`. You can see `CSS` in action in the\
    \ following example.\n\n```css\n<style type=\"text/css\">\nh1 {\nColor: DeepSkyBlue;\n\
    }\n</style>\n```html\n<h1>Hello, world! </h1>\n```\n\nAs you can see, this `CSS`\
    \ rule targets the `H1` tag of the `HTML` page. In this case, we change the color\
    \ of the `H1` text with the help of a color value known as `DeepSkyBlue`.\n\n\
    ## Creating and Applying CSS to an HTML File\n\nBefore you can start creating\
    \ your own `CSS` for your `HTML` file, you need to know how you can implement\
    \ `CSS` in `HTML`. In order to do so, there are four options available to you.\
    \ They are listed below.\n\n### 1. Inline\n\nIn this method, the style rules are\
    \ placed directly into the `HTML` file. The `style` attribute is used in the tags\
    \ whose styles need to be changed. Here is an example showing the inline method.\n\
    \n```html\n<p style=\"color: blue\">…</p>\n```\n\nThe result of this rule will\
    \ be that the text of that paragraph becomes blue.\n\nUsing this method can have\
    \ a disadvantage too since it bloats `HTML` and website maintenance becomes a\
    \ little difficult. However, it works well in some situations. For example, in\
    \ case you are using a system where you do not have an access to `CSS` file then\
    \ you can simply add your style rules to the elements.\n\n### 2. Internal\n\n\
    If you want to implement a particular style rule for the whole page, you should\
    \ opt for the internal method. It is also known as the embedded method. The rules\
    \ are placed inside the `head` element. You can see in the following example how\
    \ it works.\n\n```html\n<!DOCTYPE html>\n<Html>\n<Head>\n<Title>CSS Example</title>\n\
    <Style>\nP {\nColor: green;\n}\nA {\nColor: blue;\n}\n</Style>\n</head>\n</html\n\
    ```\n\nWhen you use this, you will find that all the paragraphs are written in\
    \ green while all the links appear blue.\n\nThe drawback to this approach is that\
    \ every time styles have to be downloaded as someone visits the web page. This\
    \ gives a slow browsing experience to the user. However, this method has its own\
    \ advantages as well. The whole page exists as just one file since `CSS` is part\
    \ of `HTML` document. It is useful in cases where you are sending a web page to\
    \ someone via email or it will be used as a template for blogging. Another advantage\
    \ to embedded method is that the dynamic styles can be generated at the same time\
    \ when a database is used to generate the page content. The colors are inserted\
    \ for headings and other elements into the `CSS` rules which are embedded on the\
    \ page. It allows users to change the colors.\n\n### 3. External\n\nAs the name\
    \ suggests, this method involves the creation of a completely separate `CSS` file.\
    \ This allows the to multiple pages. This is why inline and internal methods are\
    \ avoided. A basic example of a CSS file is given below.\n\n```css\nP {\nColor:\
    \ green;\n}\nA {\nColor: blue;\n}\n```\n\nThis file needs to be saved in the same\
    \ directory as the `HTML` page. You can choose any name for the `CSS` file, but\
    \ common naming conventions dictate that it should be named as `style.css` to\
    \ make it easier for you. Once the file has been saved, you can link your `HTML`\
    \ file to it. The following code shows how you can link the `HTML` file.\n\n```html\n\
    <!DOCTYPE html>\n<Html>\n<Head>\n<Title>Example</title>\n<link rel=\"stylesheet\"\
    \ href=\"style.css\">\n```\n\nOn saving the HTML file, it will become linked to\
    \ the CSS file named `style.css` that is saved in the same directory. Any changes\
    \ you make to the `CSS` file will get reflected when you open the corresponding\
    \ `HTML` file.\n\nAdvantages of linking to separate `CSS` file is that if you\
    \ want to make a style change across the website then only once you need to make\
    \ the change in your single `CSS` file. Another advantage of using this method\
    \ is the speed. On the first visit to the website, the user’s browser downloads\
    \ the `HTML` of the current page along with linked `CSS` file. When the users\
    \ navigate to other pages of the website their browser only needs to download\
    \ the `HTML` page, thus increasing the browsing speed.\n\n**Importing a CSS file\
    \ from within CSS**: This import rule allows attaching a new `CSS` file from within\
    \ `CSS` itself. To do this one has to simply do the following-\n\n```css\n@import\
    \ “newstyles.css’;\n```\n\nHere, you can write your `CSS` file name instead of\
    \ `newstyles` and ensure that you include correct path. For example, we have a\
    \ 500 page website and we want to add a second `CSS` file to all the pages. So\
    \ instead of editing all 500 `HTML` files by adding another `CSS` link we can\
    \ simply import the second `CSS` file from the first file and hence saving lot\
    \ of time.\n\n## The Syntax of CSS Rules\n"
