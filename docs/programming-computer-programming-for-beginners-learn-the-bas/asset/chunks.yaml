    你也可以将链接指向同一页面的其他部分。如果你用过维基百科，你可能已经见过这种用法了。为了创建这样的链接，你需要在标签上添加一个 `id` 属性。几乎所有的标签都可以添加此类属性。请查看下例示例以理解它的工作原理。


    ```html

    <p id="bird">The List of Birds</p>

    ...

    <a href="#bird">Check the List of the Birds</a></a>

    ```


    一旦点击该链接，页面将滚动到该元素（在本例中是一个包含相应 `id` 标签的段落）。


    ### 创建 HTML 页面的步骤


    既然我们已经学习了 HTML 语言的基础知识，让我们来看创建 HTML 页面的具体步骤。


    1. 文本编辑器- 打开一个你喜欢的文本编辑器，例如记事本（notepad），并创建一个空文本文件。

    2. HTML 代码- 将 HTML 代码复制并粘贴到你的新文本文件中。

    3. 保存- 点击文件并以 HTML 文件扩展名保存，例如“nameyoulike.html”。

    4. 演示- 双击该文件即可在任何网络浏览器中查看。


    ### Hello World 示例


    为了帮助你更好地理解 HTML5 中使用的结构和语法，你应该查看以下示例。毕竟，没有比实践更好的学习方式了。以下是一个 hello world 示例，这种程序通常在编程中用于介绍语言的基础性知识。


    ```html

    <! DOYPE html>

    <html Lang="en">

    <Head>

    <Meta charset="utf-8">

    <Title>HTML5: Hello World Example</title>

    </head>

    <body>

    <h1>Hello World</h1>

    </body>

    </html>

    ```


    如你所见，这实际上是一个非常简单的程序。执行此代码后，将打开一个网页并显示文本“Hello World”。由于 HTML5 代码的简单性，你实际上可以理解程序中发生了什么。


    首先，定义在网页上显示的文本语言为英语。然后，使用 `charset` 属性定义 HTML 文档的字符编码。最后，在 `body` 标签内提述要显示的文本。


    ### HTML 文档的结构


    HTML 文档是一个包含超文本标记语言的文件。HTML 代码基于标签，这些标签提供了格式化文档的指令。在任何 HTML 文档中，都会提到文档类型元素，也称为
    `doctype`。其目的是确保浏览器以标准模式渲染 HTML，以便其能够以正确的方式运行。使用 `doctype` 还允许验证软件知道应该根据哪个版本的
    HTML 对代码进行验证。


    在 `doctype` 之后，使用了起始 `HTML` 标签。它开启 HTML 代码并用闭合的 `HTML` 标签结束。它们作为整个文档的封装。因此，闭合
    `HTML` 标签始终是任何 HTML 文档的最后内容。


    在 `HTML` 元素之后，插入了 `head` 元素。这个封装包含了文档的所有信息或元数据。随后是 `title` 元素，它用于定义页面的标题，标题将显示在菜单栏中。


    在关闭 `head` 元素之后，使用了 `body` 元素。它包含了将出现在页面上的实际内容。如你所见，Hello World 示例的 `body` 元素中只有一个头部（header）元素。


    ### HTML 的类型


    我们上面提到的，最新版本是 HTML 5。这个版本可以分为三类。这些类型定义了 HTML 如何使用。


    1. 过渡型（Transitional)-这是最常见的 HTML 类型，具有灵活的语法、拼写和语法组件。这种类型的 HTML 在没有语法限制的情况下使用。浏览器对标签支持尽力而为，因此如果标签拼写不正确，浏览器不会修正错误，而是显示内容。

    2. 严格型（Strict)-这种类型要求关闭所有打开的标签。严格 HTML 对手机是至关重要的，因为它们的处理能力有限。此外，如果代码整洁无误，页面加载速度会更快。

    3. 框架集（Frameset)-它允许开发者创建 HTML 文档的合集，即多个文档连接到单个屏幕。这种类型通常用于创建网站的菜单系统。


    ### HTML 中的元素


    在 HTML 中，一个基础元素会在文本块周围有两个标记。元素内部也可能包含其他元素。事实上，所有 HTML 文档都是如此。毕竟，代码的主要部分总是放在 HTML
    元素内部。然而，有少数例外，某些元素不能包含任何文本或其他元素。`img` 元素就是这样一个例子。


    ### HTML5 中的元素


    在 HTML5 中，对元素进行了一些更改。它们现在被分为一系列元素内容类别。在 HTML5 中，元素通过起始和结束标签来帮助标记。闭合标签始终包含一个斜杠，而起始标签则没有。在
    HTML5 中，元素名称对大小写不敏感。因此，你可以写大写甚至混合写，而没有任何问题。然而，使用小写字母作为元素名称是一个好习惯。下面列出了 HTML 5
    的一些语义化和结构化元素：


    1. `<article>-定义文章。

    2. `<aside>-定义内容页侧边的内容。

    3. `<bdi>-文本的一部分，其格式可能与文本的其他部分不同。

    4. `<details>-提供用户可能使用或隐藏的额外细节。

    5. `<dialog>-描述对话框或窗口。

    6. `<figcaption>`--为 `<figure>` 元素提供说明。

    7. `<figure>-定义插图、照片、图表、代码列表等内容。

    8. `<footer>>-定义章节或文档的页脚。

    9. `<header>-描述文档的头部。

    10. `<main>-定义文档的主要内容。

    11. `<mark>-显示高亮或标记的文本。

    12. `<menuitem>-菜单中的项，用户可以在弹出菜单栏中使用它。

    13. `<meter>-已知范围内的测量。

    14. `<nav>-显示文档中的导航链接。

    15. `<progress>-显示任务的进度。

    16. `<rp>-描述在浏览器中显示什么。

    17. `<section>-定义文档的章节或部分。

    18. `<summary>-`<details>` 元素的可见标题。

    19. `<time>-提供日期和时间。

    20. `<wbr>` -可能的换行符。


    ### HTML5 中的属性


    在 HTML 中，元素可以具有属性，这些属性可以设置元素的属性属性并改变行为。某些属性是全局定义的，可以用于任何元素。然而，还有其他属性旨在用于特定的元素。属性应该指定在起始标签中。它们永远不能在闭合标签中使用。


    与元素一样，HTML5 中的属性对大小写不敏感。你可以以任何大小写编写它们。然而，你应该练习使用小写字母。


    大多数属性及其可能的值都已经在 HTML 规范中定义。因此，你没有能力创建自己的属性。如果你这样做，它将使 HTML 无效。毕竟，这可能会困扰用户代理，甚至导致网页解释的正确性出现问题。


    ### 标准属性


    下面列出了 HTML5 中使用的一些标准属性


    | 属性 | 选项 | 功能 |

    | :--- | :--- | :--- |

    | align | 左, 右, 中 | 水平对齐标签 |

    | bgcolor | 十进制, 数值, RGB 值 | 在元素背景放置放置背景颜色 |

    | accesskey | 用户定义 | 定义访问元素的键盘快捷键 |

    | class | 用户定义 | 用于层级样式表区分元素 |

    | height | 数值 | 定义图像、表格或表格单元格的高度。 |

    | Item | 元素列表 | 它用于分组元素 |


