    \ grammar check |\n| :--- | :--- | :--- |\n| width | Numeric value | Defines width\
    \ of images, tables or table cells |\n| title | User defined | “pop-up” title\
    \ for elements |\n\n## Some Interesting features of HTML5\n\nHTML5 has various\
    \ features that a modern day website requires. Although there has been no change\
    \ in the programming model of HTML, however HTML5 is easy to implement. It is\
    \ a language which can be called as backward compatible, in the sense that these\
    \ new features can be ignored in case they are not supported by a browser. However,\
    \ most of the browsers support HTML5, listing below few of them:\n\na) Google\
    \ Chrome 10.0 and higher\nb) Firefox 4.0 and above\nc) Internet Explorer 8.0 and\
    \ above\n\n### 1. Multimedia Support in HTML5\nThe first and foremost feature\
    \ of this programming language is that it supports multimedia files i.e. both\
    \ audio and video files which can be played on the browser. Given below is the\
    \ sample syntaxes:\n\nSyntax to play video:\n```html\n<body>\n <video src= “video\
    \ path” controls>\n </video>\n</body>\n```\n\nSyntax to play audio:\n```html\n\
    <body>\n<audio src= “audio location” controls>\n  </audio>\n</body>\n```\n\n###\
    \ 2. New Input Element Types\nIn data driven web applications these input elements\
    \ play an important role. These help in receiving the input in a required format.\
    \ Some new inputs have been added in HTML5, few of the existing ones are file,\
    \ password etc. Below is an example of one of the useful input introduced:\n```html\n\
    <input id = “EmailIdInput” type= “email”/>\n```\n\n### 3. Canvas\nIt is a rectangular\
    \ area that allows pixel level operations such as drawing a box, line, circle,\
    \ performing graphics etc. Below is the sample syntax:\n```html\n<canvas id= “mybox”\
    \ width= “100” height= “100”>\n```\n\n### 4. Custom Data Attributes\nThere is\
    \ a new feature available in HTML5 which is the introduction of custom data attributes.\
    \ They can be added in a hidden manner from the user and can be used later by\
    \ Java Script functions. These attributes need to start with `data-`, and they\
    \ can be named as per your needs. Example-\n```html\n<div class= “example” data-subject=\
    \ “maths” data-level= “complex”>\n…\n</div>\n```\n\n### 5. Editable Contents\n\
    The end users can edit HTML control’s content under this feature. It also allows\
    \ developers to create web pages with sections like HTML editor, notes etc. In\
    \ order to use this feature add following to the control panel of HTML:\n```\n\
    contentEditable=“true”\n```\n\n### 6. Range validators and required\n`required`\
    \ attribute is used on the input controls and it ensures that until the value\
    \ is entered for input control form will not get posted. Sample syntax:\n```html\n\
    <input type= “text” name = “TextBox” required/>\n```\nUnder the range validators,\
    \ validation is reached only when minimum and maximum values are specified for\
    \ the input control. The value entered should be within the range otherwise the\
    \ form will not get posted. Below is the sample syntax for this feature:\n```html\n\
    <input type= “number” name = “Number of Items” min= “5” max= “10” required/>\n\
    ```\n\n### 7. Placeholder and autofocus attributes\nThe automatic focus is on\
    \ page load under this attribute. Placeholder feature displays the value like\
    \ a water mark unless the focus is shifted to the input control. Below is a sample\
    \ syntax:\n```html\n<button id= “SubmitButton” autofocus></button>\n<input type=\
    \ “text” name = “text box” Placeholder= “Please enter text…”/>\n```\n\n### 8.\
    \ Preload videos\nThis attribute enables the browser to preload the video. So\
    \ if the user visits the page which has been specifically made to play the video\
    \ and it is preloaded already than it saves lot of time to the visitor.\n\n###\
    \ 9. Geo-Location\nThis feature of HTML5 lets you share your location with websites\
    \ of your choice. It works well on smart phones.\n\n### 10. Figure element\nBy\
    \ using this feature one can semantically associate image with their captions.\
    \ We simply need to add `<figcaption>` element. Below is a sample of this element:\n\
    ```html\n<figure>\n<img src= “path/to/image” alt= “About Image”/>\n<figcaption>\n\
    <p> This is a beautiful scenery. <p>\n</figcaption>\n</figure>\n```\n\n## Advantages\
    \ of using HTML5\n\n1. **Built in audio/video compatibility**\nNowadays, websites\
    \ have to be highly interactive so as to keep the audience engaged. Therefore\
    \ developers need to include videos, animations, play music and social network\
    \ sites like Twitter and Facebook into the websites. With the help of HTML5 all\
    \ this can be done quite easily. It allows the developers to add rich content\
    \ to the site without using any third party programs.\n2. **Improved code and\
    \ cleaner markup**\nMost of the `div` tags can be replaced with semantic elements\
    \ of HTML5. Hence, this language offers a cleaner code.\n3. **Stylish forms**\n\
    The developers can use fancier forms with HTML5. There are different types of\
    \ text inputs and different fields for different inputs.\n4. **Enhanced Semantics**\n\
    The semantics have improved in HTML5 which has made identification easy for parts\
    \ of page like footers, headers, navigators etc. since they have specific tags.\
    \ HTML5 offers standardized codes thus increasing the semantic value of the web\
    \ page.\n5. **Consistency**\nAs more and more websites adopt HTML5 elements consistency\
    \ in terms of HTML coding will improve from one web page to another.\n6. **Accessibility**\n\
    The structure of a web page can be understood in detail by HTML5 elements it has.\n\
    7. **Web applications made easy**\nOnce you know the available features of the\
    \ browser you will be working on, you can use them.\n8. **Offline Cache**\nWhile\
    \ building a website, the developer can specify the files which should be cached\
    \ by the browser. So if you are offline, the page you have visited in past and\
    \ want to visit again will still get loaded.\n9. **Client side database**\nCookies\
    \ impact the response time of web pages. With HTML5 it is better managed by local\
    \ storage and session storage instead of cookies. However, it is not a permanent\
    \ database but enables temporary storage.\n10. **Mobile optimization**\n\n## Disadvantages\
    \ of HTML5\n\n1. HTML5 is only supported by modern browsers.\n2. Most parts of\
    \ the language are stable, however it is still considered to be work in progress.\
    \ This means that any element can change any time.\n3. Like Apple and Google,\
    \ HTML5 does not have an adaptation control. There is no central location from\
    \ where users can look and purchase HTML5 apps.\n4. HTML5 faces media licensing\
    \ issues.\n5. HTML5 cannot create dynamic output and the security features are\
    \ limited.\n\n## Some HTML5 best practices\n\n1. Always close your tags so as\
    \ to avoid glitch and validation issues.\n2. The `DOCTYPE` is used before opening\
    \ an HTML tag at the top of the page.\n3. Add styles only after you finish coding\
    \ the page.\n4. The way to ensure that you have coded the page semantically correct\
    \ is by validating it.\n5. Try and used `h1-h6` tags in place of `p`.\n6. In case\
    \ you are building a blog than save the `H1` tag for the heading of the article.\n\
    7. Once the markup has been completed, go through it couple of times to see if\
    \ there is a possibility to reduce the number of elements on that particular page.\n\
    8. Try and memorize all HTML tags.\n9. When we start building a website, we often\
    \ start with a base template which we customize according to the requirements.\
    \ Instead of writing all HTML5 codes from scratch, we can save time by using one\
    \ of the online HTML5 generators. A basic form needs to be filled to set up desired\
    \ options and the basic HTML5 template gets ready for you.\n10. Last but not least\
    \ least you start always check for the browser’s compatibility.\n"
