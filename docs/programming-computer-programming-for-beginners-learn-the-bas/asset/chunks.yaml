    \ by JavaScript:\na) Multiple line C-Style comments, where everything written\
    \ between `/*` and `*/` is a comment.\nb) Online comments of C++ style. The comments\
    \ under this type begin with `//` and continue till the next line break.\nc) HTML\
    \ style comments begin with `<!--`.\n\n#### Can a warning be displayed for the\
