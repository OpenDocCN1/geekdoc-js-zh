- fmt: "\nIn spite of the changes to the language, there are still a few features\
    \ in HTML5 that were present in the first version of HTML. This is the latest\
    \ version of HTML, and it was launched in October 2014. When you wish to learn\
    \ HTML, it will actually be HTML5 that you will be learning.\n\n## Basics of HTML\n\
    \nAll HTML documents should start with a document type declaration i.e. `<DOCTYPE\
    \ html>`.\n\nHTML document begins with `<html>` and ends with `</html>` only.\n\
    \nThe visible part of the HTML document is between `<body>` and `</body>`.\n\n\
    Let us look at the below example of a simple HTML document for a better understanding\
    \ of the language:\n\n- `<!DOCTYPE html>`: defines the document\n- `<html>`: signifies\
    \ root element of HTML page\n- `<head>`: includes meta information about the document\n\
    - `<title>Page Title</title>`: specifies title of the document\n- `</head>`: closes\
    \ the head\n- `<body>`: consists of visible page content\n- `<h1>My First Heading</h1>`:\
    \ defines large heading\n- `<p>My First paragraph.</p>`: defines a paragraph\n\
    \n```html\n<body>\n<html>\n```\n\n## Elements to create a HTML Web Page\n\nIn\
    \ order to create a simple web page, you need to know the basic elements and tags\
    \ such as those that are used in defining the layout among other things. These\
    \ elements are used in nearly all web pages to give a structure to the content\
    \ placed on them. Here is what you need to know to start creating simple web pages.\n\
    \n### Page Title\nAll HTML pages must have their own page title. It acts as the\
    \ name for the document. The page title helps the user understand what they can\
    \ expect from that page. Moreover, it will be used as the default title when the\
    \ page has been saved to the bookmarks of the browser. The page title is not shown\
    \ in the actual body of content of the web page.\n\nThe syntax for the page title\
    \ element is given below:\n\n`<Title>...</title>`\n\nThe title element is always\
    \ placed inside the head element. Example:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <h2>The title attribute</h2>\n  <p title=\"These are the tooltips\"\
    ></p>\n</body>\n</html>\n```\n\n### Paragraphs\nThe Page Title does not affect\
    \ the actual content placed on the web page. However, the Paragraph element most\
    \ certainly does. You can type in a message on separate lines in HTML. However,\
    \ they will always get printed on the same line by the browser unless you make\
    \ use of the Paragraph element. After all, HTML is not about presentation but\
    \ rather about meaning. The syntax for this element is given below:\n\n`<p>...</p>`\n\
    \nOn inserting a piece of text inside these tags, you can ensure that the text\
    \ will be considered as a separate block of text. It will get displayed as a new\
    \ paragraph. An example of its use is given below:\n\n```html\n<! DOYPE html>\n\
    <html>\n<head>\n  <title>List of Animals</title>\n</head>\n<body>\n  <p>this is\
    \ a list of animals. </p>\n  <p>it is quite interesting. </p>\n</body>\n</html>\n\
    ```\n\n### Line Breaks\nThe line-break tag is used for separating a single line\
    \ into two. Unlike other elements, line-breaks do not have any closing tags as\
    \ there is no content involved when a line is being broken. You may find it easy\
    \ use line breaks quite often. However, you must avoid so especially when two\
    \ pieces of text are meant to be completely separate from each other. In such\
    \ situations, the paragraph element will suit you better. The tag for line breaks\
    \ is `<br>` and an example of its use is given below:\n\n```html\nA List of Animals<br>\n\
    And Other Animals\n```\n\n### Lists\nHTML allows you to organize your content\
    \ into lists to make the content more presentable on a web page. There are actually\
    \ three kinds of lists available in HTML. They are ordered list, unordered lists\
    \ and, finally, definition lists. Out of them, a definition list is a bit advanced.\
    \ Therefore, we will only consider the ordered and the unordered lists here. Both\
    \ of these lists work in a similar manner. However, unordered lists are used when\
    \ the list items are non-sequential. They are generally preceded by bullets. However,\
    \ ordered lists are used when the items have to be listed sequentially. As such,\
    \ they are preceded by incremental numbers.\n\nThe unordered list element can\
    \ be defined by the following syntax:\n\n```html\n<ul>\n  <li>...</li>\n  <li>...</li>\n\
    \  <li>...</li>\n</ul>\n```\n\nThe syntax for ordered lists is similar. The only\
    \ difference is in the tag used as you can see below:\n\n```html\n<ol>\n  <li>...</li>\n\
    \  <li>...</li>\n  <li>...</li>\n</ol>\n```\n\nThe `<li>...</li>` tags are used\
    \ to define each item that will be placed on that list.\n\nIn order to understand\
    \ the ordered and unordered lists in HTML, you can take a look at the following\
    \ example:\n\n```html\n<! DOYPE html>\n<html>\n<head>\n  <title>my first web page</title>\n\
    </head>\n<body>\n  <h1>A Short List of Animals</h1>\n  <ul>\n    <li>Cat. </li>\n\
    \    <li>Dog. </li>\n    <li>Horse. </li>\n  </ul>\n</body>\n</html>\n```\n\n\
    (Note: The source text contained repetitive nested structures for list examples;\
    \ these have been cleaned into a concise standard representation while preserving\
    \ the content logic.)\n\n## Links\nLinks are central to our use of any website\
    \ or web page. As such, it helps to know how you can implement them in HTML. After\
    \ all, links are what enables the internet to bring everything together.\n\nWhen\
    \ creating a link in HTML, you need to understand a few things. An anchor tag\
    \ will be used for defining a link. You will need to add the link’s destination\
    \ to the anchor tag to create a functional link in HTML. The destination of the\
    \ link can be defined with the help of the `href` attribute in the tag.\n\nIt\
    \ is possible to make the link absolute which means that it will take you to a\
    \ specific website. For example, you can link to `http://www.amazon.com` or `http://www.google.com`.\
    \ The syntax, in this case, would be as follows:\n\n```html\n<a href=\"http://www.amazon.com\
    \ \">Amazon</a>\n```\n\nAlternatively, it can be used to point to another file\
    \ located in the same directory. For example, let’s suppose that you have created\
    \ another html file called `bird.html` and saved it in the same directory. In\
    \ that case, you can use the following syntax for creating a link to the file:\n\
    \n```html\n<a href=\"bird.html\">The List of Birds</a>\n```\n"
