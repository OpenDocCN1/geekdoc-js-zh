    ### 3. 布局问题可以通过 JavaScript 来修复。通过使用这种脚本语言，可以找到特定页面上任何元素的区域和位置，以及浏览器窗口的尺寸。这可以防止重叠问题。例如，你的网站有几级菜单，但在检查时你发现为子菜单留出了空间。因此，通过在之前显示，你可以防止菜单项重叠。


    ### 4. 通过 JavaScript，你可以加载只有那些认为该信息与其相关的的用户才能访问的信息。例如；网站的导航菜单有 5 个链接，但指向更深层页面的其他链接只有在用户激活菜单项时才会显示。


    ### 5. 诸如不断变化的信息（体育比赛比分或股票市场），可以在无需用户交互的情况下定期加载。


    ## JavaScript 基础


    JavaScript 已经成为互联网上最突出的语言之一。它可以跨平台并在各种浏览器中使用。因此，为了在现实世界中使用这种语言，我们需要首先学习它的基础知识。这将使你对
    JavaScript 有基础的理解。


    #### 1. 变量


    如你所知，变量是存储数据的容器。存储在变量中的数据可以是表达式或值。在 JavaScript 语言中，表达式有三种类型。


    | 表达式 | 说明 |

    | :--- | :--- |

    | 逻辑 | 求值为布尔值，即 true 或 false |

    | 算术 | 求值为一个数字 |

    | 字符串 | 求值为一个字符串 |


    #### JavaScript 中变量的作用域


    变量作用域是指定义变量的区域。JavaScript 中的变量可以有两种作用域之一。


    **全局变量：** 由于其全局作用域，这些变量可以在代码的任何地方定义。


    **局部变量：** 这些变量仅存在于定义的函数内部。函数参数始终是该特定函数的局部变量。


    可以使用 `var` 关键字声明局部变量，而全局变量应该在不使用 `var` 关键字的情况下使用。例如：如果在函数内部声明一个局部变量，则它无法在函数外部被访问，因此它是该函数的局部的。如果你在不使用
    `var` 关键字的情况下声明同一个变量，它将对整个脚本可见，而不仅仅是在该函数内部。


    在 JavaScript 中，如果存在同名的全局变量，则局部变量在函数体内部具有更高的优先级。通过声明一个与全局变量同名的局部变量，你实际上在函数内部隐藏了该全局变量。


    让我们来看一个局部变量的示例


    ```

    var num= 20;

    ```


    如果你想在脚本的其他地方访问 `num` 变量的值，只需引用变量名即可。`document.write` 函数将数据写入网页。


    查看下方的语法：


    ```javascript

    document.write(“The value of num is: “ +num);

    ```


    我们将得到的结果是“The value of num is: 20”。


    为了在变量中存储算术表达式，我们只需要将变量赋值为计算后的值。存储在变量中的不是计算过程，而是该计算的结果。因此，我们再次得到的结果是“The value
    of num is 20”。看以下示例：


    ```javascript

    var num = (10+10);

    document.write( “ The value of num is: “+ num);

    ```


    如果你想在脚本的其他地方访问 `num` 变量的值，只需引用变量名即可。`document.write` 函数将数据写入网页。


    ```javascript

    document.write(“The value of num is: “ +num);

    ```


