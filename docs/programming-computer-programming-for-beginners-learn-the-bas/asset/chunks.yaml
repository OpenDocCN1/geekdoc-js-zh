    CSS 中预定义了某些颜色名称。它们包括黄色、`blue`、`fuchsia`、`lime`、`green`、`navy`、`red`、`white`、`black`、`aqua`
    和 `olive` 等。CSS 认为认为 `transparent` 也是一个有效值。除了 `black` 和 `white` 之外，你会发现颜色名称在 CSS
    样式规则中很少使用。由于这些名称具有很高的特殊性，导致它们的灵活性受到限制。


    RGB 代码由三个值组成，每个值代表一种原色。值的范围从 0 到 255，阴色的最低级别由 `0` 表示。`255` 是可能的最大值。用百分比的形式表示这些值也是可行的。


    十六进制代码利用 16 进制系统。每个十六进制数字都以井符号开头。在 CSS 中，它们的长度可以是三位或六位。三位版本仅仅是六位版本的缩写形式。你会发现，后者版本允许你对颜色进行更具体的控制。


    ## 使用 Color 属性


    当你想要为文档应用颜色时，可以使用下面提供的两个属性中的一个或两者。


    - `Color`: 用于给文本应用颜色。

    - `Background- color`: 用于给背景应用颜色。


    在使用这些命令时，请确保你已经正确地输入了 `color`。浏览器不识别 `color.`。相反，它们可以理解 `color.`。这些属性可以应用于几乎所有的
    HTML 元素。


    ## 在 CSS 中样式化文本


    文本是另一个常见的样式化项目，用于提高可读性等。CSS 为你提供了许多属性，你可以使用这些属性来更改网页上文本的外观和布局。下面是文本中一些常用的属性。


    ### 2. `font-family` 属性

    该属性定义文本的字体，例如 `Verdana` 和 `Times New Roman`。当你使用此属性时，需要确保浏览器能够找到指定为值的字体。这意味着该字体必须在用户的计算机上可用。如果你使用某种稀有或不常用的字体，你的用户可能无法使用该文件，因为他们的电脑上没有该字体。有许多字体在计算机上是始终可用的，如上面的
    `Verdana` 和 `Times New Roman`，以及 `Arial` 和 `Calibri`。


    另一方面，你有能力将多个字体作为此属性的值。你需要借助逗号来分隔这些值。这允许浏览器在用户的计算机上搜索列表中的提到的字体之一。一旦找到正确的字体，将使用该字体显示文本。


    请记住，浏览器将按照顺序遵循列表。因此，在 fact 指定的为 `Arial, Verdana, serif` 的列表中，浏览器将首先搜索 `Arial`，如果找到则使用它。如果没有找到，它将搜索
    `Verdana` 字体，依此类推。你需要记住的另一个点是，如果字体名称由两个或多个单词组成，则需要将字体名称放在引号中。


    这里有一个如何使用该属性的简单示例。


    ```

    Font-family: Verdana, Arial, “Times New Roman”, serif

    ```


    ### 3. `Font-size`

    此属性设置文本的大小。当然，你可以设置任何你想要的值。然而，你需要考虑内容的可读性。因此，你想要用作标题的文本应该具有较高的 `font-size` 值，但也应该具有适当的标题标签，如
    `<h1>`。你不应该仅仅使用 HTML 段落元素来代替它们，并给它们设置更高的 `font-size`。用于设置文本大小的常用单位有：


    **a) `px` (像素)** - 它是一个绝对单位，人们可以根据需要增加或减少文本的像素大小。


    **b) `ems`** - 父元素设置的字体大小等于 `1em`。它可以用于设置任何内容的大小，而不只是文本。整个网站都可以使用 `ems` 进行调整，从而使维护变得简单。


    **c) `rems`** - 它们的工作方式与 `ems` 类似，不同在于文档根元素设置的字体大小等于 `1rem` 而不是父元素。这使得计算字体大小变得更容易。然而，Internet
    explorer 8 或更低版本不支持 `rems`。


    元素的 `font-size` 与父元素一致。在所有浏览器中，根元素的字体大小默认设置为 `16px`。因此，根元素内的任何段的 `font-size` 都是
    `16px`。


    让我们来看这个简单的尺寸设置示例：


    当你调整文本大一时，最好将文档的 `font-size` 设置为 `10px`，这样计算起来会容易得多。现在，当你这样做时，所需的 `rem` 或 `ems`
    值将是像素字体大小，并将除以 `10` 而不是 `16`。通过这样做，你可以根据需要轻松设置文本大小。此外，最好在样式表的选定区域列出所有字体规则集，以便于访问。


    ### 4. `Font-weight`

    此属性用于检查文本是否加粗。通常，用于此属性的值是 `bold` 或 `normal`。这是为了确保与旧浏览器兼容。然而，你还可以使用其他值，如 `lighter`
    和 `bolder`。你也可以使用 `100` 到 `900` 之间的任何值，并以百为单位递增。


    ### 5. `Font-style`

    此属性用于将一段文本样式化为斜体。此属性的可用值为 `italic` 或 `normal`。


    ### 6. `Text-decoration`

    此属性用于定义文本是否应该下划线、贯穿线或上划线。如果你不需要此类效果，可以使用值 `normal`。


    - `Underline`: 给文本加下划线。

    - `Line-Through`: 在文本上穿过一条线。

    - `Overline`: 在文本上方放置一条线。


    ### 7. `Text drop shadows`

    文本阴影有四个属性：


    **a) 水平偏移。** 它接受大多数可用的 CSS 大小长度单位。然而，通常使用 `px`。此值必须包含。


    **b) 垂直偏移。** 阴影上下移动而不是左右移动。此值必须包含。


    **c) 模糊半径** 阴影扩散得更开。如果未包含此值，默认变为 `0`，这意味着没有模糊。此属性也接受 CSS 的大多数长度和大小单位。


    **d) 阴影的基础颜色** 可以取任何 CSS 颜色单位。如果不包含此值，默认保持为黑色。


    通过逗号分隔多个阴影值，也可以为文本提供多个阴影。


    ### 8. `Text-Color`

    此属性用于设置文本的颜色。


    ### 9. `Text Alignment`

    文本对齐属性用于水平对齐文本。文本可以对齐 `right`、`left`、`center` 或 `justify`。示例：


    ```

    h1{text-align:right;}

    ```


    当使用对齐文本时，文本的每行都获得相同的宽度，左右边距是直的。示例：


    ``` evendiv{text-align:justify;}

    ```


    ### 10. `Text transformation`

    这指定文本中的小写字母和大写字母。通过使用此属性，单词的首字母也可以写成大写。示例：


    ```

    p.captitalize{text-transform:capitalize;}

    ```


    ### 11. `Text Indentation`

    它指定第一行的缩进。示例：


    ```

    p{text-indent:40px:}

    ```


