    ## Introduction


    The internet is everywhere. In fact, you used the internet to purchase this book.
    This was, of course, made possible by web development, the same thing you will
    be gaining an idea of in this book. The world of programming is vast, and web
    programming is just one of its sections, albeit a big one.


    Web programming or, as it is more commonly known, web development is the development
    of web applications. A web application can be something as simple as a web page,
    a social networking site or even a full-fledged game. Like all kinds of programming,
    web development has its own programming languages that are used for developing
    those applications.


    There are quite a few web development languages in use today. However, three of
    the most popular ones are `HTML`, `JavaScript`, and `CSS`. Knowing these languages
    can give you a strong base in which you can improve upon to become a full-fledged
    web developer.


    However, learning these programming languages can be a daunting task for someone
    who does have prior programming experience and exposure. So, the key is to get
    a firm grasp of the basic fundamentals of the language. One should take things
    slowly rather than aiming at creating fancy scripts in the beginning. For beginners,
    the terminology used in the programming may become confusing sometimes. Terms
    such as “objects”, “variables”, and “elements” have a specific meaning in programming.
    Therefore, it becomes imperative to learn and use these terms.


    In this book, you will be learning the basics of these three languages. You will
    understand the various fundamentals of each language such as the structure of
    the language and programming concepts. You will learn the syntax of each language
    along with the different kinds of functions. A hello world example has also been
    provided to help you understand the language at work. Apart from that we have
    included some useful tips and tricks for these languages along with frequently
    asked questions on them. In short, you will be familiarized with all the things
    you need to know before taking up that language for coding in.


    Let us now start learning `HTML`, `CSS` and `JavaScript`.


    ## Chapter 1: Introduction to Web Development


    Websites are created for different purposes depending upon the target audience,
    some are made for selling products and some are just for providing information.
    Web development tools provide companies with a platform to create their web presence.
    Websites give them visibility with a wider audience. To develop a site in accordance
    to the requirements, businesses hire developers. Developing a website can include
    anything from simple programming to network security, adding content or web server
    configuration.


    Programming involves set of instructions which are written in a computer language
    or codes. A developer needs to have a thorough knowledge of the programming languages.
    Before you start learning on how to program in different languages used on the
    web; it is essential to have an understanding of web development in general.


    ### What is Web Development?


    Web development can be broadly defined as the development of websites and web
    applications which will be hosted on the Internet or the intranet. In reality,
    web development is used as an umbrella term for a collection of activities such
    as web design, client-side coding, server-side scripting, network security configuration
    and other tasks.


    Web development involves usage of scripting languages both at the client’s site
    and at the server end. It ranges from creating plain text pages to complex applications.
    The web development hierarchy includes; client side coding, server side coding
    and database technology.


    ## Web Development Process

