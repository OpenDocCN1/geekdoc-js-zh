    You can also point the link to another section of the same page. You may have
    already seen this in action if you have used Wikipedia. In order to create such
    a link, you need to add an `id` attribute to a tag. It is possible to add such
    an attribute to nearly all tags. Look at the following example to understand how
    it works.


    ```html

    <p id="bird">The List of Birds</p>

    ...

    <a href="#bird">Check the List of the Birds</a></a>

    ```


    Once the link has been clicked on, the page will scroll to the element, in this
    case, a paragraph, which contains the corresponding `id` tag.


    ### Steps to create HTML page


    As we have gone through the basics of HTML language, let’s look at a step by step
    process of creating an HTML page.


    1. Text editor- Open a text editor of your choice, example-notepad and create
    an empty text file.

    2. HTML code- Copy and paste the HTML code into your new text file

    3. Save – Click the file and save it with HTML file extension, e.g “nameyoulike.html”

    4. Demo- Do a double click on the file to view it on any web browser.


    ### Hello World Example


    To help you get a better understanding of the structure and syntax used in HTML5,
    you should take a look at the following example. After all, there is no better
    way to learn than by practice. The following is a hello world example, a type
    of program that is often used in programming to provide an introduction to the
    fundamentals of a language.


    ```html

    <! DOYPE html>

    <html Lang="en">

    <Head>

    <Meta charset="utf-8">

    <Title>HTML5: Hello World Example</title>

    </head>

    <body>

    <h1>Hello World</h1>

    </body>

    </html>

    ```


    As you can see, this is actually quite a simple program. On executing this code,
    a web page will open up, displaying the text, “Hello World”. Due to the simplicity
    of code in HTML5, you can actually understand what is going on in the program.


    First, the language of the text to be displayed on the web page is defined to
    be English. Then, the character encoding of the HTML document is defined with
    the `charset` attribute. Finally, the text to be displayed is mentioned inside
    the `body` tags.


    ### The Structure of HTML Documents


    HTML document is a file which contains hypertext markup language. An HTML code
    is based on tags which provide instructions to format a document. In any HTML
    document, the document type element, also known as `doctype`, is mentioned. Its
    aim is to ensure that the browser renders the HTML in the standards mode so that
    it works in the correct manner. The use of `doctype` also allows validation software
    to know which version of HTML the code should be validated against.


    After the `doctype`, the opening `HTML` tag is used. This opens the HTML code
    and is closed with the closing HTML tag. They serve as a wrapper for the entire
    document. As a result, the closing HTML tag will always be the last thing in any
    HTML document.


    Following the `HTML` element, the `head` element is inserted. This wrapper contains
    all the information or the metadata of the document. This is followed by the `title`
    element which is used to define the title of the page as it will be shown in the
    menu bar.


    After the closing of the `head` element, the `body` element is used. This contains
    the actual content that will be present on the page. As you can see, there is
    only a header element in the `body` element of the Hello World example.


    ### Types of HTML


    The newest version as we have mentioned above is HTML 5. This version can be divided
    into three categories. The types define how HTML is used.


    1. Transitional- It is the most common type of HTML and has a flexible syntax,
    spelling and grammar component. This type of HTML has been used without syntax
    restrictions. The browsers support a best effort approach for tags, so if tags
    are not spelt correctly the browser will not correct the error but will display
    the content.

    2. Strict- This type requires closing of all opened tags. Strict HTML is essential
    on phones since they have limited processing power. Also the pages load faster
    if the codes are clean and free of error.

    3. Frameset- It allows developers to create a medley of HTML documents i.e. multiple
    documents are connected to a single screen. This type is usually used to create
    menu system of the website.


    ### Elements in HTML


    In HTML, a basic element will have two markers located around a block of text.
    It is also possible for an element to have other elements inside it. In fact,
    this is the case for all HTML documents. After all, the main sections of the code
    are always put inside the HTML elements. However, there are a few exceptions as
    certain elements cannot contain any text or other elements. The `img` element
    is one such example.


    ### Elements in HTML5


    In HTML5, a few changes were made to the elements. They are now separated into
    a range of element content categories. In HTML5, the elements are marked with
    the help of start and end tags. The closing tag always contains a slash whereas
    the opening one does not. In HTML5, the element names are insensitive to cases.
    As such, you can write them in uppercase or even mixed case without any problems.
    However, it is a good practice to use lower case for element names. Listed below
    are some of the semantic and structural elements of HTML 5 :-


    1. `<article>-defines an article

    2. `<aside>- defines content to side of the content page.

    3. `<bdi>- a part of text that may have been formatted in a different way than
    the rest of the text.

    4. `<details>- gives additional details that the user may use or hide

    5. `<dialog>- describes dialog box or window

    6. `<figcaption>`--gives a caption for `<figure>` element

    7. `<figure>- defines content like illustrations, photos, diagrams, code listing
    etc.

    8. `<footer>`- defines a footer for a section or the document

    9. `<header>- describes the header for the document

    10. `<main>- main content of a document is defined

    11. `<mark>- shows highlighted or marked text.

    12. `<menuitem>- an item from the menu which user can use from the popup menu
    bar.

    13. `<meter>- measurement within a known range

    14. `<nav>- shows navigation links in the document

    15. `<progress>-shows the progress of a task

    16. `<rp>- describes what to show in the browser

    17. `<section>- defines a section or a part of document

    18. `<summary>- visible heading for a `<detail>` element

    19. `<time>- gives date and time

    20. `<wbr>` - possible line break.


    ### Attributes in HTML5


    In HTML, elements can have attributes which can set the different properties of
    the element and change its behavior. Some attributes have to be defined globally,
    and they can be used with any element. However, there are others which are meant
    to be used with certain specific elements. Attributes are meant to be specified
    in the start tags. They can never be used in the closing tags.


    Like elements, attributes in HTML5 are insensitive to cases. They can be written
    in any case you want. However, you should practice using lower case for them.


    Most of the attributes along with their possible values are defined in the HTML
    specifications. As such, you do not have the ability to create your own attributes.
    If you do so, it will make the HMTL invalid. After all, it can confuse the user
    agents and even cause issues in the correct interpretation of the web page.


    ### Standard Attributes


    Listed below are some of the standard attributes used in HTML5


    | Attribute | Options | Functions |

    | :--- | :--- | :--- |

    | align | Left, right, center | Aligns the tag horizontally |

    | bgcolor | Hexidecimals, numeric, RGB values | A background color is placed behind
    an element |

    | accesskey | User defined | Defines a keyboard shortcut to access an element
    |

    | class | User defined | Differentiates an element for the use with cascading
    style sheets |

    | height | Numeric value | Defines the height of images, tables or table cells.
    |

    | Item | List of elements | It is used to group elements |

