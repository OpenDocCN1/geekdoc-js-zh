  trans: '


    这三种语言是交织在一起的：`HTML` 提供了网站的基本结构，而 `JavaScript` 和 `CSS` 对其进行了增强和修改。`CSS` 告诉 `HTML`
    应该使用什么颜色、字体和其他样式，而 `JavaScript` 则告诉 `HTML` 如何执行某些任务，例如弹出窗口等。


    在学习 Web 开发时，需要记住最重要的两点是：


    a) 使用正确的 `HTML` 标签 – 内容结构由不同的 `HTML` 标签来描述，每个标签都有其特定的含义和定义的位置。


    b) 保持你的 `JavaScript`、`HTML` 和 `CSS` 代码分离 - 始终将 `JavaScript` 和 `CSS` 放在 `HTML`
    文件之外的单独文件中。这将使你的工作变得简单，并且你能够更好地进行管理。因此，将所有的样式和功能性代码放在一个地方会让事情变得简单。


    ## 结论


    现在，这本关于 `HTML`、`CSS` 和 `JavaScript` 编程的书籍已经结束了。所有这些编程语言本身都是非常庞大的。然而，由于它们简单易用，你在掌握它们时应该不会遇到太大问题。只要努力努力并花一点时间，你就能很快创建出功能完备的网站。


    当然，这本书应该让你在所有三种语言上打下了良好的基础。你应该已经看过“Hello World”示例，并注意到它们是多么简单。因此，你在每种语言的基础语法上应该不应该有任何问题。


    你已经接触过这些语言中常用的基本函数、语句和标签。更重要的是，在你自己创建的网页中使用它们时，你应该不再会有任何任何问题了。


    在 `HTML` 中，你了解了如何编写一个简单的网页并填充内容。然后，通过 `CSS`，你已经能够对该网页进行样式化并使其看起来具有力。最后，`JavaScript`
    让你能够让网页更具交互性。因此，你的网页现在看起来和感觉起来应该非常像你以前在互联网上仰慕的那些网页。


    随着本书的结束，我祝你未来的编程之路一切顺利。这是一项令人兴奋的活动，从长远来看，对你的职业非常有帮助。


    ## 想学习更多编程知识吗？


