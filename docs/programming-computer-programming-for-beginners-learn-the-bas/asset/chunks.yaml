    \n如果下述示例中的 `validate()` 函数返回 `true`，则表单才会被提交；否则，表单将不会提交。\n\n```html\n<html>\n\
    \ <head>\n <script type=\"text/javascript\">\n<!--\nfunction validation() {\n\
    所有的验证逻辑都在这里\n…….\nreturn 返回 true 或 false\n}\n//-->\n</script>\n</head>\n<body>\n\
    \ <form method=\"post\" action=\"t.cgi\" onsubmit=\"return validate()\">\n …….\n\
    \ <input type=\"submit\" value=\"Submit\"/>\n</form>\n</body>\n</html>\n```\n\n\
    ### 17. onmouseover 和 onmouseout\n\n此事件在图像和文本上都能产生很好的效果。当鼠标悬停在元素上时，会触发 `onmouseover`\
    \ 事件；当鼠标移出时，会触发 `onmouseout`。示例：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\n<!--\nfunction over () {\ndocument.write ( \"鼠标悬停\");\n}\nfunction out() {\n\
    document.write ( \"鼠标移出\");\n}\n//-->\n</script>\n</head>\n<body>\n <p> 将你的鼠标移入\
    \ div 内部查看结果：</p>\n <div onmouseover=\"over ()\" onmouseout=\"out()\">\n <h2>\
    \ 它在 div 内部 </h2>\n  </div>\n</body>\n</html>\n```\n\n### 关于使用 JavaScript 的一些提示\n\
    \n1. 确保 JavaScript 能够帮助用户高效、快速地实现目标。如果不能做到，说明你可能使用方法不当。\n2. 你为用户提供的 JavaScript\
    \ 解决方案应该自然地优于之前的交互。然而，解决方案不应过于差异，以至于用户无法根据之前的经验与之联系。目标是确保终端用户对解决方案感到满意。\n3. 如果你正在处理敏感数据，不要依赖\
    \ JavaScript，因为所有代码都易于读取。此外，用户可能会在浏览器中关闭 JavaScript。\n\n我们可以说，这种简单而丰富的脚本语言有许多可能性。JavaScript\
    \ 提供了工具，允许终端用户在网页下载后与其交互。在本章中我们学习了 JavaScript 的基础知识，现在让我们来看看一些关于这种编程语言的常见问题。\n\
    \n### 常见\n\n#### JavaScript 和 Java 一样吗？\n答：不是，它们是不同的编程语言。Java 是一种通用编程语言，而 JavaScript\
    \ 用于使网站更具交互性。\n\n#### 哪些浏览器支持 JavaScript？\n答：大多数浏览器都支持 JavaScript。如下：\n* Microsoft\
    \ Internet explorer 3.0 及以上版本\n* Netscape Navigator 2.0 及以上版本\n* Safari\n* Firefox\n\
    * Google Chrome\n* Opera\n\n#### 如何在 JavaScript 中添加注释？\n答：JavaScript 支持三种类型的注释：\n\
    a) 多行 C 风格注释，写在 `/*` 和 `*/` 之间的所有内容都是注释。\nb) C++ 风格的单行注释。此类类型的注释以 `//` 开始，一直持续到下一行结束符。\n\
    c) HTML 风格注释以 `<!--` 开始。\n\n#### 当用户无法执行 JavaScript 代码时，可以向用户显示警告吗？\n答：可以，可以向用户显示不支持\
    \ JavaScript 的浏览器的警告。警告文本可以放在 `<NOSCRIPT>` 和 `</NOSCRIPT>` 标签之间。\n\n因此，启用了 JavaScript\
    \ 的浏览器将忽略这些标签之间的所有内容，而无法执行的浏览器将在页面上显示你的消息。该消息将显示给禁用了 JavaScript 的用户，也会显示给那些浏览器不支持\
    \ JavaScript 的用户。\n\n#### 可以删除 JavaScript 变量吗？\n答：你并不总是可以删除 JavaScript 变量，这取决于以下条件：\n\
    a) 如果 JavaScript 变量第一次是使用关键字 `var x;` 声明的，则无法删除。但作为通变方法，可以将变量设置为 `null` 或 `undefined`。但这并不等同于删除变量。\n\
    b) 如果变量 `x` 首次在脚本中出现且没有任何声明，则可以使用 `delete` 操作符，即 `delete x`。\n\n#### JavaScript\
    \ 程序不能做什么？\n答：JavaScript 代码无法实现以下操作：\na) 无法在客户端局域网 (LAN) 或用户系统上使用打印机或其他设备。\nb)\
    \ 无法直接访问用户系统或客户端局域网上的文件。唯一的例外是 cookie 文件。\nc) 无法实现多线程或多进程。\n\n#### 删除数组元素的方法是什么？\n\
    答：在 JavaScript 中删除数组元素有两种不同的方法，分别是：\na) `myArray.splice(n,1)`。这种方法较慢，但不会在数组中留下空隙。\n\
    b) `delete myArray[n]`。这种方法更快，但会在索引 `n` 处留下空隙。\n\n#### 有没有方法判断用户点击的是右键还是左键？可以使用\
    \ `onclick` 事件处理器吗？\n答：对于左键，会触发点击事件。然而，取决于浏览器，右键点击可能发生也可能不发生。特别是在 Microsoft Internet\
    \ Explorer 中，右键点击事件无效。因此，`onclick` 事件处理器不是测试左右鼠标键的可靠方法。相反，我们应该使用 `mousedown` 事件。大多数浏览器支持任何鼠标键的\
    \ `mouseup` 和 `mousedown` 事件。\n\n#### JavaScript 可以使用哪些数字格式？\n答：JavaScript 代码可以使用多种方式编写数学常量和数字面量，例如：\n\
    a) 指数形式的十进制数字，例如 `5.57e-11`\nb) 常规十进制数字，例如 `5`、`7`、`137`、`1.3` 等。\nc) 八进制数，例如\
    \ `-055`、`01234`、`0212`\nd) 以零开头的正八进制数。\ne) 十六进制，例如 `0xFF`、`-0xCFFF`。正十六进制以 `0x`\
    \ 开头，负十六进制以 `-0x` 开始。\nf) 预定义的数学常量，例如 `Math.PI` //pi = 3.14159\n\n#### 如何测试特定变量持有字符串还是数字？\n\
    答：测试变量持有字符串还是数字的方法是使用 `typeof` 操作符。如果变量持有字符串，`typeof(variable)` 将返回“string”，如果它持有数字，则将返回“number”。\n\
    \n"
- fmt: '

    All three languages are intertwined in the sense `HTML` provides the basic structure
    of web sites, which are enhanced and modified by `JavaScript` and `CSS`. `CSS`
    tells `HTML` what colors, fonts and other styles to be used and `JavaScript` tells
    `HTML` how to perform certain tasks like making a pop up window etc.


    The two most important things to keep in mind while learning web development are:


    a) Use correct `HTML` tags – The structure of the content is described by different
    `HTML` tags and each tag has its own meaning and a defined place.


    b) Keep your `JavaScript`, `HTML` and `CSS` code separate- Always put `JavaScript`
    and `CSS` in a separate file other than the `HTML` one. This will make your work
    simple and you will be able to manage better. So by keeping all your styles and
    functional codes in one place will make things easy.


    ## Conclusion


    We have now come to the end of this book on web programming with `HTML`, `CSS`,
    and `JavaScript`. All of these programming languages are quite vast in their own
    right. However, since they are simple and easy, you should not have too much of
    a problem in mastering them. With hard work and a bit of time, you will be able
    to create full-fledged websites in no time at all.


    Of course, this book should have given you enough to have a good base on all three
    languages. You should have already seen the hello world examples and noted how
    easy they are. As such, you should have no problems with the basic syntax for
    each language.


    You will have come across the basic functions, statements, and tags that are commonly
    used in these languages. More importantly, you should no longer have any problems
    in using them in a web page of your creation.


    In `HTML`, you came to know how a simple web page can be written and filled with
    content. Then, with `CSS`, you will have been able to stylize that web page and
    make it look attractive. Finally, `JavaScript` allowed you to make your web page
    more interactive. As such, your web page should now be looking feeling a lot like
    the web pages you have previously admired over the internet.


    With the end of this book, I wish you all the best for your future in programming.
    It is an exciting activity and one that will be useful for your career in the
    long run.


    ## Want to Learn more about Programming?


    Check out the other books by Joseph Connor:


