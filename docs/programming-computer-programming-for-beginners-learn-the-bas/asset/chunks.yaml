- fmt: '

    In CSS, the value of the `color` property can be mentioned as a name. Alternatively,
    you can use a hex code or an RGB code. Some of the ways you can use red as a value
    for this property is given below. In other words, when the following codes are
    used with the `color` property, you will notice that the text is displayed in
    red.


    - `red`

    - `Rib` (100%, 0%, and 0%)

    - `rgb(255,0,0)`

    - `#f00`

    - `#ff0000`


    Certain color names have been predefined in CSS. They include yellow, `blue`,
    `fuchsia`, `lime`, `green`, `navy`, `red`, `white`, `black`, `aqua` and `olive`
    among others. CSS also considers `transparent` to be a valid value. Other than
    `black` and `white`, you will find that color names are rarely used in CSS style
    rules. This is due to the high specificity of the names which make their flexibility
    rather limiting.


    The RGB code is made up of three values, each denoting the primary color. The
    values range from 0 to 255 with the lowest level of the shade being denoted by
    `0`. `255` is the highest possible. It is also feasible to represent these values
    in the form of a percentage.


    The Hexadecimal code makes use of the base-16 number system. Each hex number is
    prefixed with the hash symbol. In CSS, their length can be of three or six digits.
    The three digits version is simply a shortened form of the six digits one. You
    will find that the latter version allows you greater control over the color.


    ## Using the Color Property


    When you wish to apply color to the document, you can use one or both of the two
    properties given below.


    - `Color`: This is used for applying color to the text.

    - `Background- color`: This is used for applying color to the background.


    When using these commands, make sure that you have typed `color` properly. Browsers
    do not recognize `color.` Instead, they can understand `color.` These properties
    can be applied to nearly all HTML elements.


    ## Stylizing the Text in CSS


    The text is another common item that is stylized to improve readability among
    other things. CSS gives you a number of properties that you can use to alter the
    looks and layout of the text on the web page. Given below are some of the most
    commonly used properties in the text.


    ### 2. The `font-family` Property

    This property defines the font of the text such as `Verdana` and `Times New Roman`.
    When you use this property, you need to make sure that the browser is capable
    of locating the font that has been specified as the value. This means the font
    has to be available on the user’s computer. If you use a rare or uncommon font,
    it is possible that your users will not be able to use the file because they don’t
    have the font on their computers. There are quite a few fonts that will always
    be available on computers such as the `Verdana` above and `Times New Roman` along
    with `Arial` and `Calibri`.


    On the other hand, you have the ability to mention multiple fonts as the value
    for this property. You need to separate the values with the help of commas. This
    allows a browser to search the user’s computer for one of the fonts that have
    been mentioned in a list. Once it finds the correct font, that font will be used
    for displaying the text.


    Keep in mind that the browser will follow the list sequentially. Therefore, in
    a list that you have specified as `Arial, Verdana, serif`, the browser will search
    for trial first and use it if it is found. If not, it will search for the `Verdana`
    font and so on. Another point you need to remember is that you need to put the
    font name in quotation marks if the name consists of two words or more.


    Here a simple example showing how this property is meant to be used.


    ```

    Font-family: Verdana, Arial, “Times New Roman”, serif

    ```


    ### 3. `Font-size`

    This property sets the size of the text. You can, of course, set any value that
    you wish. However, you need to keep the readability of the content in mind. As
    a result, the text that you want to use as a heading should be of a higher `font-size`
    value but also have the appropriate heading tag such as `<h1>` as well. You should
    not simply use the HTML paragraph element for them and give them a higher `font-size`.
    Most common units that are used to size the text are:


    **a) `px` (pixels)** - It is an absolute unit and one can increase or decrease
    the pixel size of the text as per the requirement.


    **b) `ems`** - font size set for parent element is equal to `1em`. It can be used
    to size anything and not just text. The entire website can be sized using `ems`
    and hence will make the maintenance easy.


    **c) `rems`** - They work like `ems`, except that the font size set on the root
    element of the document is equal to `1rem` instead of the parent element. It makes
    easier to work out the font sizes. However, `rems` is not supported in Internet
    explorer 8 or lower versions.


    The `font-size` of an element is in accordance with the parent element. The size
    of font for a root element is set at `16px` by default across all browsers. Therefore
    any paragraph within the root element will have `16px` as `font-size`.


    Let us look at this simple sizing example:


    When you size your text, it is always better to set the `font-size` as `10px`
    for the document, so that it it becomes lot easier to do the math. Now, when you
    do this the required `rem` or `ems` values are then pixel font size which will
    be divided by `10` and not `16`. Doing that, you can easily size the text according
    to the requirement. Also, it is always better to list all font rule sets in a
    selected area of your stylesheet for an easy access.


    ### 4. `Font-weight`

    This property is used to check if the text is bold. Generally, the values used
    for this property are either `bold` or `normal`. This is to ensure compatibility
    with older browsers. However, there are other values that you can use such as
    `lighter` and `bolder`. You can also use any value between `100` and `900` with
    an increment of hundred.


    ### 5. `Font-style`

    This property is used to stylize a piece of text as italics. The available values
    for this property are `italic` or `normal`.


    ### 6. `Text-decoration`

    This property is used for defining whether the text should be underlined, have
    a line running through or over it. If you do not want such effects, you can use
    the value `normal` to denote so. The other values available are given below.


    - `Underline`: This underlines the given text.

    - `Line-Through`: This puts a line running through the text.

    - `Overline`: This will put a line running above the text.


    ### 7. `Text drop shadows`

    There are four properties to text shadow:


    **a) Horizontal offset of the shadow.** It takes most available CSS size and length
    units. However, `px` is used in general. This value has to be included.


    **b) Vertical offset of the shadow.** The shadow moves up and down instead of
    left-right. This value has to be included.


    **c) Blur radius** shadow us dispersed more widely. In case this value is not
    included then by default it becomes `0`, that means no blur. This property also
    takes most length and size units of CSS.


    **d) Base color of shadow** which can be taken as any CSS color unit. If this
    is not included then by default it remains black.


    Multiple shadows can also be given to the text by separating multiple shadow values
    with a comma.


    ### 8. `Text-Color`

    This property is used to set the color of the text.


    ### 9. `Text Alignment`

    Text align property is used to align the text horizontally. A text can be aligned
    `right`, `left`, `center` or `justified`. Example:


    ```

    h1{text-align:right;}

    ```


    When justified text alignment is used each line of the text gets an equal width
    and the right and left margins are straight. Example:


    ``` evendiv{text-align:justify;}

    ```


    ### 10. `Text transformation`

    This specifies lowercase and uppercase letters in a text. By using this property
    first letter of a word can be written in capital as well. Example:


    ```

    p.captitalize{text-transform:capitalize;}

    ```


    ### 11. `Text Indentation`

    It specifies the indentation of the first line. Example:


    ```

    p{text-indent:40px:}

    ```

