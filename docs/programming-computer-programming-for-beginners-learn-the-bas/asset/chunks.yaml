  trans: '


    在你开始构建网站之前，首要任务任务是你必须理解你正试图向观众或客户传递什么信息或消息。他们在内容方面期待看到什么？你如何让内容变得对用户友好且易于导航？一旦所有的前端设计方面都已明确，就必须开始着网站的后端工作了，这包括如何托管、使用什么架构、网站预期的流量负载是多少，以及我们该如何建立基础设施以确保网站的整体构建是稳健的。最后，必须确保网站可以在各种类型的浏览器/设备（如智能手机、平板电脑等）上打开，并且能够通过搜索引擎轻松搜索。


    Web 开发过程中涉及许多步骤，但广义上可以分为五个阶段。


    1. **发现（Discovery）** - 开发网站的第一步是理解业务需求，包括：创建网站的目的、目标受众以及网站内容。

    2. **定义（Definition）** - 必须将第一步收集的信息汇在一起，以定义网站的站点地图或计划。这涉及到创建一个易于导航的系统或用户界面。

    3. **设计（Design）** - 这一步涉及用户体验。网站的视觉吸引力取决于你选择的模板，并且应该始终考虑到目标受众。例如：针对青少年的网站元素将与金融机构的网站有所不同。

    4. **开发（Development）** - 在这一步中，实现最终设计以创建一个实际的功能性站点。使用内容管理系统和编程代码来开发网站。

    5. **部署（Deployment）** - 对网站的完整功能进行测试，一旦客户对最终产品满意，就会将网站文件上传到客户的服务器。


    ## Web 开发的方面


    Web 开发可以广义地分为两个部分。它们是前端开发和后端开发。为了拥有一个功能全网站，这两个过程都需要并肩工作。


    ### 前端开发

    也称为客户端编码，在这一开发中，你将创建用户在加载 Web 应用时将看到的内容。这包括设计和内容，以及用户将如何与之交互。对于前端开发，你需要使用 `HTML`、`JavaScript`
    和 `CSS`。


    `HTML` 是用于将文本转换为网页的代码。所有的网页都是用 `HTML` 编写的，这种语言对于所有 Web 应用也至关重要。`CSS` 用于设置样式规则，它决定了网页的外观。`JavaScript`
    用于为网页添加功能并使其更具交互性。


    ### 后端开发

    这也称为服务器端编码。它决定了网页服务器上正在发生什么。换句话说，用户看不到这些活动，但它们会影响网站。后端开发中的一项常见活动是为前端的生成创建一个数据库。


    后端开发中使用了多种编程语言和框架。`PHP`、`ASP.NET`、`Ruby on Rails`、`Python`、`Node.js` 和 `Java`
    就是其中的一些。


    ## 使用编程语言的优缺点


    使用编程语言被用于创建构建网站或 Web 应用的程序。大多数编程语言都是容易学习的。它们帮助你向网页中添加动态和具有交互性的活动。复杂的任务可以在相对较少的步骤中完成。


    编程语言的缺点是，在编码时出现的 bug（错误/漏洞）有时会让人很烦恼且难以解决。Web 开发者需要对编程语言的语法了如指掌。因此，大量的努力和良好的记忆是必不可少的。此外，人们需要提高编程速度，否则这将是一项非常耗时的活动。


    ## 为什么要学习 Web 开发？


    当然，开始学习 Web 开发的最常见原因是成为一名 Web 开发者。你将能够为人们创建网页和网站，让他们在互联网上查看。然而，这不是学习 Web 开发的唯一理由。还有很多原因，我们列出了其中的几个：


    1. Web 开发的特点之一是它相对容易学习。事实上，许多程序员声称，Web 开发对于想要开始学习编程的人来说是一个极佳的选择。如果你对成为程序员感兴趣，Web
    开发可以为你提供实现这一目标的基础。

    2. 学习 Web 开发可以给你带来良好的就业前景。企业希望建立有效的存在感，为了这一点，他们面临着压力要提供具有电子商务和通信功能的高质量网站。因此，越来越多的公司在寻找能够交付最佳作品的
    Web 开发者。

    3. 作为一名 Web 开发者，你有机会创造新的酷东西。你只需要有一台笔记本电脑和互联网连接，具备编程语言知识，就可以根据你的想象力创造一切。

    4. Web 开发不再仅仅关于 Web 了。当现在的公司考虑创建网站时，他们也会考虑社交媒体和移动技术。智能手机、网络电视、平板电脑等许多设备的使用量激增，因此开发者需要考虑到所有这些。这扩展了开发者的影响力。

    5. Web 开发非常灵活，具有前端、后端、内容管理系统、电子商务、移动 Web 等许多方面。这为专业人士提供了广泛的机会，同时新工具正在让这一过程变得更容易。


    现在你已经知道 Web 开发是关于什么的，让我们开始学习实际语言 `HTML`、`CSS` 和 `JavaScript`。


    ## 第 2 章：学习 HTML5：Web 语言


    `HTML` 是 Web 的核心。它是所有人接受的标准。因此，理解它将是开发网页的应用的关键。


    几乎所有读取和写入文件的计算机应用程序都使用特殊的格式格式。例如，Windows 中的记事本应用程序可以理解并使用 `.txt` 文件。这些文件将包含有关文档如何打开的指令。`HTML`
    以类似的方式运行。


    ### 什么是 HTML？


    `HTML` 是超文本标记语言的缩写。它是用于创建网页的语言。事实上，`HTML` 是现代互联网的基石技术。除了网页，它还用于创建 Web 和移动应用的用户界面。


    它由一组插入网页中的代码或标记符号组成。这些代码告知网络浏览器如何显示网页上的文字和图像。每一个的标记代码被称为元素或标签。网络浏览器可以读取 `HTML`
    文件，然后将其渲染为可见的网页。它还以语义化的方式描述网站的结构。


    ### HTML 的历史


    互联网和 `HTML` 的历史完全交织在一起，共同开发。Tim Berners-Lee 开发了后来被称为 `HTML` 的东西，用于第一个网站和第一个 Web
    服务器。它编写于 1990 年左右，并在 1991 年向公众开放。


