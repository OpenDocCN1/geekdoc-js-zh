    \ separating a single line into two. Unlike other elements, line-breaks do not\
    \ have any closing tags as there is no content involved when a line is being broken.\
    \ You may find it easy use line breaks quite often. However, you must avoid so\
    \ especially when two pieces of text are meant to be completely separate from\
    \ each other. In such situations, the paragraph element will suit you better.\
    \ The tag for line breaks is <br> and an example of its use is given below.\n\n\
    ***A List of Animals<br>***\n\n***And Other Animals***\n\n**Lists-**HTML allows\
    \ you to organize your content into lists to make the content more presentable\
    \ on a web page. There are actually three kinds of lists available in HTML. They\
    \ are ordered list, unordered lists and, finally, definition lists. Out of them,\
    \ a definition list is a bit advanced. Therefore, we will only consider the ordered\
    \ and the unordered lists here. Both of these lists work in a similar manner.\
    \ However, unordered lists are used when the list items are non-sequential. They\
    \ are generally preceded by bullets. However, ordered lists are used when the\
    \ items have to be listed sequentially. As such, they are preceded by incremental\
    \ numbers.\n\nThe unordered list element can be defined by the following syntax.\n\
    \n***<ul>***\n\n***<Li>…</li>***\n\n***<Li>…</li>***\n\n***<Li>…</li>***\n\n***</ul>***\n\
    \nThe syntax for ordered lists is similar. The only difference is in the tag used\
    \ as you can see below.\n\n***<Ol>***\n\n ***<Li>…</li>***\n\n ***<Li>…</li>***\n\
    \n ***<Li>…</li>***\n\n***</ol>***\n\nThe <li>…</li> tags are used to define each\
    \ item that will be placed on that list.\n\nIn order to understand the ordered\
    \ and unordered lists in HTML, you can take a look at the following example.\n\
    \n***<! DOCTYPE html>***\n\n***<Html>***\n\n***<Head>***\n\n***<Title>my first\
    \ web page</title>***\n\n***</head>***\n\n***<Body>***\n\n***<h1>A Short List\
    \ of Animals</h1>***\n\n***<Ul>***\n\n***<Li>Cat. </li>***\n\n***<Li>Dog. </li>***\n\
    \n***<Li>Horse. </li>***\n\n***</ul>***\n\n***</body>***\n\n***</html>***\n\n\
    When you get your browser to display this page, you will find that the names of\
    \ the animals have been displayed in the form of a bulleted list. You can change\
    \ the <ul>…</ul> tags into <ol>…</ol> tags. This will cause the display of the\
    \ list to be changed into a numbered list from a bullet list.\n\nIn HTML, you\
    \ have the ability to create a hierarchy of lists. This means you will be creating\
    \ a list within another list. This allows you to organize the content better.\
    \ You can take a look at the following example to understand how you can create\
    \ a hierarchy of lists.\n\n***<! DOCTYPE html>***\n\n***<Html>***\n\n***<Head>***\n\
    \n***<Title>my first web page</title>***\n\n***</head>***\n\n***<Body>***\n\n\
    ***<h1>A Short List of Animals</h1>***\n\n***<Ol>***\n\n***<Li>***\n\n***Cat.***\n\
    \n ***<Ul>***\n\n ***<Li>Siamese cat</li>***\n\n ***<Li>Persian cat</li>***\n\n\
    \ ***<Li>Burmese Cat<.li>***\n\n ***</ul>***\n\n***</li>***\n\n***<Li>***\n\n\
    ***Dog.***\n\n***<Ol>***\n\n***<Li>Golden Retriever</li>***\n\n***<Li>Tibetan\
    \ Mastiff</li>***\n\n***<Li>Pug</li>***\n\n***</ol>***\n\n***</li>***\n\n***<Li>Horse.\
    \ </li>***\n\n***</ul>***\n\n***</body>***\n\n***1.* *</html>***\n\nAs you can\
    \ see in the example, when you are creating a hierarchy of lists, it is possible\
    \ to use unordered and ordered lists together. You can use as many levels of lists\
    \ as you want.\n\n**Links-**Links are central to our use of any website or web\
    \ page. As such, it helps to know how you can implement them in HTML. After all,\
    \ links are what enables the internet to bring everything together. As you already\
    \ know, the first two letters in ‘HTML’ mean hypertext. This can be defined as\
    \ a system of linked text.\n\nWhen creating a link in HTML, you need to understand\
    \ a few things. An anchor tag will be used for defining a link. You will need\
    \ to add the link’s destination to the anchor tag to create a functional link\
    \ in HTML. The destination of the link can be defined with the help of the ‘href’\
    \ attribute in the tag.\n\nIt is possible to make the link absolute which means\
    \ that it will take you to a specific website. For example, you can link to ‘http:\
    \ //www.amazon.com’ or “http: //www.google.com’. The syntax, in this case, would\
    \ be as follows.\n\n***<a href=\"http://www.amazon.com \">Amazon</a>***\n\nAlternatively,\
    \ it can be used to point to another file located in the same directory. For example,\
    \ let’s suppose that you have created another html file called bird.html and saved\
    \ it in the same directory. In that case, you can use the following syntax for\
    \ creating a link to the file.\n\n***<a href=\"bird.html\">The List of Birds</a>***\n\
    \nKeep in mind that you can link to all kinds of files and not just html files.\
    \ More importantly, it is possible to link to a file over the internet as well."
