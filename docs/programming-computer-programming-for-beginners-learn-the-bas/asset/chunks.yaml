    2.  The DOCTYPE is used before opening an HTML tag at the top of the page.\n\n\
    3.  Add styles only after you finish coding the complete page.\n\n4.  The way\
    \ to ensure that you have coded the page semantically correct is by validating\
    \ it.\n\n5.  Try and used h1-h6 tags in place of p.\n\n6.  In case you are building\
    \ a blog than save the H1 tag for the heading of the article.\n\n7.  Once the\
    \ markup has been completed, go through it couple of times to see if there is\
    \ a possibility to reduce the number of elements on that particular page.\n\n\
    8.  Try and memorize all HTML tags.\n\n9.  When we start building a website, we\
    \ often start with a base template which we customize according to the requirements.\
    \ Instead of writing all HTML5 codes from scratch, we can save time by using one\
    \ of the online HTML5 generators. A basic form needs to be filled to set up desired\
    \ options and the basic HTML5 template gets ready for you.\n\n10.  Last but not\
    \ the least before you start always check for the browser’s compatibility."
