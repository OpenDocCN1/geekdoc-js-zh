  trans: "\n\n# 数组 (Arrays)\n它们与变量几乎相似，不同之处在于可以在一个名称下存储多个表达式和值，从而使其成为强大的数据类型。只要在作用范围内，数组中可以存储的数据量没有限制。只要它在脚本中已声明，就可以访问任何项的任何值以及任何给定时间点的任何值。相同类型的数据可以存储在一个单一数组中，该特定数组可以分配一个与其包含的项相关的名称。\n\
    \n让我们来看一个例子：\n\n```javascript\nvar shapes = new Array(“rectangle”, “square”, “triangle”);\n\
    var colors = new Array( “red”, “pink”, “orange”);\n```\n\n要访问数组中的任何项，你必须使用它的 ID。ID\
    \ 是该项在数组中的位置。数组的 ID 总是从 0 开始而不是 1，这在开始时可能会引起困惑，但通过练习，你会发现这个概念很容易学习。ID 按升序顺序工作；例如\
    \ 0, 1, 2, 3 等。下面是一个理解这个概念的示例——\n\n```javascript\nvar colors = new Array( “red”,\
    \ “pink”, “green”);\ndocument.write( “red: “+colors[0]);\ndocument.write( “pink:\
    \ “+colors[1]);\ndocument.write( “green: “+colors[2]);\n```\n\n在数组中，你也可以为特定位置赋值。例如：\n\
    \n```javascript\nvar colors = new Array ();\ncolors [0] = “red”;\ncolors [1] =\
    \ “pink”;\ncolors [2] = “green”;\ndocument.write (“pink: “+colors [2]);\n// 将粉色更新为蓝色\n\
    Colors [1] = “blue”;\ndocument.write (“blue: “+ colors [2]);\n```\n\n# 对象 (Objects)\n\
    对象用大括号编写。对象的属性写法格式为 –：\n\n- name: value 键值对，用逗号隔开\n\n对象的示例：\n\n```javascript\n\
    Var person = {first name: “Ryan”, last name: “Booth”, age:35, eyeColor: “brown”};\n\
    ```\n\n上面的示例有四个属性：年龄、眼色、名字和姓。\n\n# 运算符 (Operators)\n为了在 JavaScript 中执行任何操作，我们需要运算符。它们包括比较、减法、加法等许多。有四种基本运算符：\n\
    \n- 赋值 (Assignment)\n- 算术 (Arithmetic)\n- 逻辑 (Logical)\n- 比较 (Comparison)\n\n\
    ### 算术运算符\n这些运算符执行基础数学运算，如除法、加法、乘法、减法等。\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `*`\
    \ | 乘法 |\n| `-` | 减法 |\n| `+` | 加法 |\n| `/` | 除法 |\n| `%` | 取余（模） |\n| `--` |\
    \ 递减 |\n| `++` | 递增 |\n\n### 赋值运算符\n用于给 JavaScript 中的变量赋值。下面列出了所有可用的赋值运算符：\n\n\
    | 运算符 | 描述 |\n| :--- | :--- |\n| `=` | 等 |\n| `+=` | 给变量赋值加法值 |\n| `-=` | 给变量赋值减法值\
    \ |\n| `*=` | 给变量赋值乘法值 |\n| `/=` | 给变量赋值除法值 |\n| `%=` | 给变量赋值模值 |\n\n**示例：**\n\
    ```javascript\nvar num =20;\ndocument.write(“The value of num is: “+num);\n//\
    \ 将 num 的值更新为 30\nnum= (num+10);\ndocument.write( “ The new value of num is:+num);\n\
    ```\n\n### 比较运算符\n这些运算符建立变量或其值之间的关系。它们被用于条件语句（我们稍后会学习这一点），通过比较变量或其值来创建逻辑。这有助于判断语句是真是假。比较运算符的类型有：\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| `<` | 小于 |\n| `>` | 大于 |\n| `==` | 等于 |\n|\
    \ `!=` | 不等于 |\n| `===` | 等于，且对象和值类型相等 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n\
    ### 逻辑运算符\n它们组合比较运算符，通常用于条件语句。逻辑运算符的类型有：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `!`\
    \ | 非 |\n| `&&` | 与 |\n| `||` | 或 |\n\n# 3. 条件语句 (Conditional Statements)\n与其他编程语言一样，JavaScript\
    \ 中提供了多种条件语句。它们允许你定义一个条件，其结果决定了将执行的操作。它们允许你的程序根据条件的结果做出判断并执行相关操作。\n\n为了在编程语言中创建任何逻辑，条件语句是其基础。在\
    \ JavaScript 中，条件语句可以用四种方式编写——\n\n| 语句 | 描述 |\n| :--- | :--- |\n| Switch | 执行多个脚本中的一个\
    \ |\n| If | 如果特定条件的结果为真，则执行脚本 |\n| If..else | 此条件语句中有两个代码块。if 语句在条件为真时执行脚本，而当条件为假时执行\
    \ else 语句下的代码 |\n| If..else if..else | 如果无限条件中的某一个为真，或者所有条件都为假，则执行另一个脚本。 |\n\n\
    `if…else` 语句的基本语法所示。\n\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
    }\n```\n\n### 示例：\n\n**if**\n```javascript\nif (expression) {\n    当 expression\
    \ 为真时要执行的语句(s)\n}\n```\n\n**else**\n```javascript\nif (expression) {\n    当 expression\
    \ 为真时要执行的语句(s)\n} else {\n    当 expression 为假时要执行的代码\n}\n```\n\n**if..else**\n\
    ```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression)\
    \ {\n    当另一个条件为真时要执行的语句(s)\n} else {\n    当所有条件为假时要执行的代码\n}\n```\n\n**if..else\
    \ if..else**\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
    } else if (expression) {\n    当另一个条件为真时要执行的语句(s)\n} else if (expression) {\n \
    \   当第三一个条件为真时要执行的语句(s)\n} else {\n    执行的代码\n}\n```\n\n**switch**\n```javascript\n\
    switch (expression) {\n    case expression1:\n        当 expression 等于 expression1\
    \ 时执行的语句\n        break;\n    case expression2:\n        当 expression 等于 expression2\
    \ 时执行的语句\n        break;\n    default:\n        当没有一个 匹配时执行的代码\n}\n```\n\n`if…else`\
    \ 语句的基本语法所示。\n\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
    }\n```\n\n### 更多示例：\n\n**if**\n```javascript\nif (expression) {\n    当 expression\
    \ 为真时要执行的语句(s)\n}\n```\n\n**else**\n```javascript\nif (expression) {\n    当 expression\
    \ 为真时要执行的语句(s)\n} else {\n    当 expression 为假时要执行的代码\n}\n```\n\n**if..else**\n\
    ```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression)\
    \ {\n    当另一个条件为真时要执行的语句(s)\n} else {\n    执行的代码\n}\n```\n\n**if..else if..else**\n\
    ```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression)\
    \ {\n    当另一个条件为真时要执行的语句(s)\n} else if (expression) {\n    当第三一个条件为真时要执行的语句(s)\n\
    } else {\n    执行的代码\n}\n```\n\n**switch**\n```javascript\nswitch (expression)\
    \ {\n    case expression1:\n        当 expression 等于 expression1 时执行的语句\n     \
    \   break;\n    case expression2:\n        当 expression 等于 expression2 时执行的语句\n\
    \        break;\n    default:\n        当没有一个 匹配时执行的代码\n}\n```\n\n`if…else` 语句的基本语法所示。\n\
    \n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n}\n```\n\n\
    ### 更多示例：\n\n**if**\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
    }\n```\n\n**else**\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
    } else {\n    当 expression 为假时要执行的代码\n}\n```\n\n**if..else**\n```javascript\n\
    if (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression) {\n \
    \   当另一个条件为真时要执行的语句(s)\n} else {\n    执行的代码\n}\n```\n\n**if..else if..else**\n\
    ```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression)\
    \ {\n    当另一个条件为真时要执行的语句(s)\n} else if (expression) {\n    当第三一个条件为真时要执行的语句(s)\n\
    } else {\n    执行的代码\n}\n```\n\n**switch**\n```javascript\nswitch (expression)\
    \ {\n    case expression1:\n        当 expression 等于 expression1 时执行的语句\n     \
    \   break;\n    case expression2:\n        当 expression 等于 expression2 时执行的语句\n\
    \        break;\n    default:\n        当没有一个 匹配时执行的代码\n}\n```\n\n`if…else` 语句的基本语法所示。\n\
    \n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n}\n```\n\n\
