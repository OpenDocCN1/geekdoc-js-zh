  trans: '

    在 CSS 中，我们本质上并不是在编写程序。毕竟，它是一种样式表语言。相反，我们编写的是规则。一个 CSS 将包含一组样式规则，浏览器会在将它们应用到 HTML
    文档中的关联元素之前，对其进行解释。正如你已经看到的，一个样式规则由三部分组成。


    **选择器（Selector）**：这是应用样式的 HTML 标签。


    **属性（Property）**：这是 HTML 标签的一种属性。所有的 HTML 属性都会转换为它们相应的 CSS 属性。


    **值（Value）**：每个属性都有一个对应的值。


    ***例如：***


    ```css

    h1 {color:brown;font-size:12px;}

    ```


    在上面的示例中：


    `h1` 是选择器

    `color` 是属性

    `brown` 是值

    `font-size` 是属性

    `12px` 是值


    选择器指向你想要样化的元素。声明块包含多个一个声明，它们之间用分号隔开，每个声明都包含一个 CSS 值和属性名，它们之间用冒号隔开。CSS 声明必须以分号结束。声明块包含在大括号中。


    所有 CSS 规则的基本语法如下。


    ```css

    Selector {property: value}

    ```


    CSS 选择器根据元素的名称、类（class）、ID、属性等查找 HTML 元素。


    CSS 中的选择器可以通过多种方式定义。事实上，你可以轻松地选择一个你习惯使用的。以下是几种类型的选择器及其使用方法。


    ### 1. 类型选择器（The Type Selectors）


    你可能已经在之前的示例中注意到这种选择器的用法了。它允许规则应用于所有相同类型的元素。在接下来的示例中，绿色被应用于页面上所有的一级标题。


    ```css

    13. h1 {

    Color: #36CFFF;

    }

    ```


    ### 2. 通用选择器（The Universal Selectors）


    与其说选择特定类型的元素，不如使用通用选择器。这允许你将规则应用到可以使用给定属性的任何元素类型。下面的示例说明了通用选择器的用法。在其中，文档的整个内容将以黑色显示。


    ```css

    14. *

    Color: #000000;

    }

    ```


    ### 3. 后代选择器（The Descendant Selectors）


    在某些情况下，你可能希望仅当元素位于另一个特定元素内部时才对其应用样式规则。在后代选择器的帮助下这完全可能的。你可以查看下面的示例。在其中，只有当 `em`
    元素存在 `ul` 标签内部时，样式规则才会应用于它。


    ```css

    Ul em {

    1. Color: #000000;

    }

    ```


    ### 4. 类选择器（The Class Selectors）


    可以使用类属性来为元素定义样式规则。通过类选择器，具有该类的元素将根据定义的规则进行样式化。看看下面给出的示例。


    ```css

    15. .black {

    16. Color: #000000;

    17.

    ```


    使用此规则后，你会发现文档中所有类属性被设置为 `black` 的元素，其内容都将以黑色显示。同时，将来可以细化规则并指定某个特定元素。查看以下示例。


    ```css

    18. h1.black {

    19. Color: #000000;

    20.

    ```


    在上面的规则中，内容将样式化为黑色，但仅限于类属性已设置为 `black` 的 `h1` 元素。也可以对特定元素应用多个类选择器。查看下面的示例以了解它是如何工作的。


    ```html

    21. <p class="center bold">

    Text

    </p>

    ```


    ### 5. ID 选择器（The ID Selectors）


    在为元素定义样式规则时，也可以考虑 ID 属性。在这种情况下，所有具有该特定 ID 的元素将根据你定义的规则进行样式化。


    ```css

    22. #black {

    Color: #000000;

    }

    ```


    使用此 CSS 规则后，你会发现所有 id 属性为 `black` 的元素，其内容都将以黑色显示。还可以进一步细化此规则并针对特定类型的元素。在接下来的示例中，只有属性为
    `black` 的 `h1` 标签会受规则的影响。


    ```css

    h1#black {

    Color: #000000;

    }

    ```


    ID 选择器在与后代选择器配合使用时非常有用。在下面的示例中，你会看到，只有当这些二级标题出现在 id 属性指定为 `black` 的标签内部时，所有的 `h2`
    标签才会以黑色显示。


    ```css

    #black h2 {

    23. Color: #000000;

    }

    ```


    ### 6. 子选择器（The Child Selectors）


    子选择器类似于后代选择器。然而，它们的功能非常不同。下面的示例说明了子选择器的用法。在此 CSS 规则中，只有当段落是 `body` 元素的直接子元素时，它们才会以黑色显示。如果段落存在任何其他元素（如
    `td` 或 `div`）内部，则不会。


    ```css

    24. Body > p

    Color: #000000;

    }

    ```


    ### 7. 属性选择器（The Attribute Selectors）


    借助属性选择器，你可以为具有特定元素的元素应用样式。在示例中，类型为 `submit` 的 `input` 将不受影响。


    ```css

    25. Input [type = "text"]

    Color: #000000;

    }

    ```


    属性选择器有一个主要优势：


    `P [Lang]`–在这种情况下，段 元素具有 Lang 属性。

    `P [Lang="en"]`–仅选择 Lang 精确值为 "en" 的元素。

    `P [Lang~="en"]`–它将选择包含单词 "en" 的段元素。

    `P[lang|="en"]`–以 "en-" 开头的。


    ### 8. 多样式规则（Multiple Style Rules）


    在某些情况下，你可能需要为特定元素设置多个样式规则。CSS 允许你将不同的属性及其值组合在一个块中。你可以通过示例看到它是如何工作的。


    ```css

    26. h1 {

    Color: #000000;

    Font-weight: normal;

    Letter-spacing: .3em;

    Margin-bottom: 2em;

    Text-transform: lowercase;

    }

    ```


    如示例所示，所有的属性值对都用分号隔开。如果你愿意，可以将规则写在单行，而不是使用多行，但将它们放在不同的行可以提高代码的可读性。


    ### 9. 选择器分组（Selector Groups）


    如果你想或需要，也可以为多个选择器应用样式规则。在这种情况下，选择器之间必须用逗号隔开。你可以在示例中看到这种用法。


    ```css

    27. H1, h2, h3 {

    Color: #000000;

    Font-weight: normal;

    Letter-spacing: .4em;

    Margin-bottom: 1em;

    Text-transform: lowercase;

    }

    ```


    此处定义的样式规则不仅应用于 `h1` 元素，还应用于 `h2` 和 `h3` 元素。列表的顺序不影响规则。


