  \ 以获取最新发布的更新！\n\n## 引言\n\n互联网无处不在。事实上，你就是通过互联网购买这本书的。这无疑是通过 Web 开发实现的，而这正是你将在书中学。编程世界是广阔的，Web\
  \ 编程只是其中一个部分，尽管是一个很大的部分。\n\nWeb 编程或更为人知的 Web 开发是指 Web 应用程序的开发。Web 应用程序可以是简单的网页、社交网站，甚至是一个完整的游戏。像所有的编程类型一样，Web\
  \ 开发也有其用于开发这些应用程序的编程语言。\n\n目前正在使用的许多 Web 开发语言。然而，最流行的三种是 `HTML`、`JavaScript` 和 `CSS`（注：原文为\
  \ CSS，此处根据语意修正翻译为：目前正在使用的 Web 开发语言非常多。然而，最流行的三种是 `HTML`、`JavaScript` 和 `CSS`）。了解这些语言可以为你打下坚实的基础，你可以在此基础上进步成为一名全面的\
  \ Web 开发人员。\n\n然而，对于没有编程经验和接触的人来说，学习这些编程语言可能是一项艰巨的任务。因此，关键在于牢牢掌握语言的基础。应该循序渐进，而不是从一开始就追求创建花哨的脚本。对于初学者来说，编程中使用的术语有时可能会让他们感到困惑。“对象”、“变量”和“元素”等术语在编程中有特定的含义。因此，学习并使用这些术语是非常关重要的。\n\
  \n在书中，你将学习这三种语言的基础。你将理解每种语言的各种基础，例如语言结构和编程概念。你将学习每种语言的语法以及不同类型的函数。还提供了 hello world\
  \ 示例帮助你理解语言如何工作。此外，我们还包含了这些语言的一些实用技巧以及相关的常见问题。简而言之，在用该语言进行编码之前，你将熟悉需要知道的一切。\n\n\
  让我们现在开始学习 `HTML`、`CSS` 和 `JavaScript`。\n\n## 第 1 章：Web 开发简介\n\n网站的创建取决于目标受众的不同目的，有些是为了销售产品，有些仅仅是为了提供信息。Web\
  \ 开发工具为公司提供创建一个网络形象的平台。网站让他们接触更广泛的受众。为了根据需求开发网站，企业聘请开发人员。开发网站可以包括从简单的编程到网络安全、添加内容或\
  \ Web 服务器配置的所有内容。\n\n编程涉及用计算机语言或代码编写的指令集。开发者需要对编程语言有深入的。在你开始学习如何使用 Web 上使用的不同语言进行编程之前，理解一般的\
  \ Web 开发至关重要。\n\n### 什么是 Web 开发？\n\nWeb 开发可以广义地定义为在互联网或局域网上的网站和 Web 应用程序的开发。实际上，Web\
  \ 开发是一个通用术语，涵盖了 Web 设计、客户端编码、服务器端脚本、网络安全配置和其他任务的集合。\n\nWeb 开发涉及在客户端和服务器端对脚本语言的使用。其范围从创建纯文本页面到复杂的应用程序。Web\
  \ 开发的层次结构包括：客户端编码、服务器端编码和数据库技术。\n\n## Web 开发流程\n\n\n\n\n\n在你开始构建网站之前，首要任务任务是你必须理解你正试图向观众或客户传递什么信息或消息。他们在内容方面期待看到什么？你如何让内容变得对用户友好且易于导航？一旦所有的前端设计方面都已明确，就必须开始着网站的后端工作了，这包括如何托管、使用什么架构、网站预期的流量负载是多少，以及我们该如何建立基础设施以确保网站的整体构建是稳健的。最后，必须确保网站可以在各种类型的浏览器/设备（如智能手机、平板电脑等）上打开，并且能够通过搜索引擎轻松搜索。\n\
  \nWeb 开发过程中涉及许多步骤，但广义上可以分为五个阶段。\n\n1. **发现（Discovery）** - 开发网站的第一步是理解业务需求，包括：创建网站的目的、目标受众以及网站内容。\n\
  2. **定义（Definition）** - 必须将第一步收集的信息汇在一起，以定义网站的站点地图或计划。这涉及到创建一个易于导航的系统或用户界面。\n3.\
  \ **设计（Design）** - 这一步涉及用户体验。网站的视觉吸引力取决于你选择的模板，并且应该始终考虑到目标受众。例如：针对青少年的网站元素将与金融机构的网站有所不同。\n\
  4. **开发（Development）** - 在这一步中，实现最终设计以创建一个实际的功能性站点。使用内容管理系统和编程代码来开发网站。\n5. **部署（Deployment）**\
  \ - 对网站的完整功能进行测试，一旦客户对最终产品满意，就会将网站文件上传到客户的服务器。\n\n## Web 开发的方面\n\nWeb 开发可以广义地分为两个部分。它们是前端开发和后端开发。为了拥有一个功能全网站，这两个过程都需要并肩工作。\n\
  \n### 前端开发\n也称为客户端编码，在这一开发中，你将创建用户在加载 Web 应用时将看到的内容。这包括设计和内容，以及用户将如何与之交互。对于前端开发，你需要使用\
  \ `HTML`、`JavaScript` 和 `CSS`。\n\n`HTML` 是用于将文本转换为网页的代码。所有的网页都是用 `HTML` 编写的，这种语言对于所有\
  \ Web 应用也至关重要。`CSS` 用于设置样式规则，它决定了网页的外观。`JavaScript` 用于为网页添加功能并使其更具交互性。\n\n### 后端开发\n\
  这也称为服务器端编码。它决定了网页服务器上正在发生什么。换句话说，用户看不到这些活动，但它们会影响网站。后端开发中的一项常见活动是为前端的生成创建一个数据库。\n\
  \n后端开发中使用了多种编程语言和框架。`PHP`、`ASP.NET`、`Ruby on Rails`、`Python`、`Node.js` 和 `Java`\
  \ 就是其中的一些。\n\n## 使用编程语言的优缺点\n\n使用编程语言被用于创建构建网站或 Web 应用的程序。大多数编程语言都是容易学习的。它们帮助你向网页中添加动态和具有交互性的活动。复杂的任务可以在相对较少的步骤中完成。\n\
  \n编程语言的缺点是，在编码时出现的 bug（错误/漏洞）有时会让人很烦恼且难以解决。Web 开发者需要对编程语言的语法了如指掌。因此，大量的努力和良好的记忆是必不可少的。此外，人们需要提高编程速度，否则这将是一项非常耗时的活动。\n\
  \n## 为什么要学习 Web 开发？\n\n当然，开始学习 Web 开发的最常见原因是成为一名 Web 开发者。你将能够为人们创建网页和网站，让他们在互联网上查看。然而，这不是学习\
  \ Web 开发的唯一理由。还有很多原因，我们列出了其中的几个：\n\n1. Web 开发的特点之一是它相对容易学习。事实上，许多程序员声称，Web 开发对于想要开始学习编程的人来说是一个极佳的选择。如果你对成为程序员感兴趣，Web\
  \ 开发可以为你提供实现这一目标的基础。\n2. 学习 Web 开发可以给你带来良好的就业前景。企业希望建立有效的存在感，为了这一点，他们面临着压力要提供具有电子商务和通信功能的高质量网站。因此，越来越多的公司在寻找能够交付最佳作品的\
  \ Web 开发者。\n3. 作为一名 Web 开发者，你有机会创造新的酷东西。你只需要有一台笔记本电脑和互联网连接，具备编程语言知识，就可以根据你的想象力创造一切。\n\
  4. Web 开发不再仅仅关于 Web 了。当现在的公司考虑创建网站时，他们也会考虑社交媒体和移动技术。智能手机、网络电视、平板电脑等许多设备的使用量激增，因此开发者需要考虑到所有这些。这扩展了开发者的影响力。\n\
  5. Web 开发非常灵活，具有前端、后端、内容管理系统、电子商务、移动 Web 等许多方面。这为专业人士提供了广泛的机会，同时新工具正在让这一过程变得更容易。\n\
  \n现在你已经知道 Web 开发是关于什么的，让我们开始学习实际语言 `HTML`、`CSS` 和 `JavaScript`。\n\n## 第 2 章：学习 HTML5：Web\
  \ 语言\n\n`HTML` 是 Web 的核心。它是所有人接受的标准。因此，理解它将是开发网页的应用的关键。\n\n几乎所有读取和写入文件的计算机应用程序都使用特殊的格式格式。例如，Windows\
  \ 中的记事本应用程序可以理解并使用 `.txt` 文件。这些文件将包含有关文档如何打开的指令。`HTML` 以类似的方式运行。\n\n### 什么是 HTML？\n\
  \n`HTML` 是超文本标记语言的缩写。它是用于创建网页的语言。事实上，`HTML` 是现代互联网的基石技术。除了网页，它还用于创建 Web 和移动应用的用户界面。\n\
  \n它由一组插入网页中的代码或标记符号组成。这些代码告知网络浏览器如何显示网页上的文字和图像。每一个的标记代码被称为元素或标签。网络浏览器可以读取 `HTML`\
  \ 文件，然后将其渲染为可见的网页。它还以语义化的方式描述网站的结构。\n\n### HTML 的历史\n\n互联网和 `HTML` 的历史完全交织在一起，共同开发。Tim\
  \ Berners-Lee 开发了后来被称为 `HTML` 的东西，用于第一个网站和第一个 Web 服务器。它编写于 1990 年左右，并在 1991 年向公众开放。\n\
  \n\n\n\n\n尽管语言发生了变化，但 HTML5 中仍然存在一些在 HTML 第一版本就存在的特性。这是 HTML 的最新版本，于 2014 年 10 月发布。当你想要学习\
  \ HTML 时，你实际上学习的是 HTML5。\n\n## HTML 基础\n\n所有的 HTML 文档都应该以文档类型声明开头，即 `<DOCTYPE html>`。\n\
  \nHTML 文档仅以 `<html>` 开始并以 `</html>` 结束。\n\nHTML 文档的可视部分位于 `<body>` 和 `</body>` 之间。\n\
  \n让我们来看下面这个简单 HTML 文档的示例，以便更好地理解这种语言：\n\n- `<!DOCTYPE html>`：定义文档\n- `<html>`：标识\
  \ HTML 页面的根元素\n- `<head>`：包含关于文档的元数据\n- `<title>Page Title</title>`：指定文档的标题\n- `</head>`：关闭头部\n\
  - `<body>`：包含可见的页面内容\n- `<h1>My First Heading</h1>`：定义大标题\n- `<p>My First paragraph.</p>`：定义一个段落\n\
  \n```html\n<body>\n<html>\n```\n\n## 创建 HTML 网页的元素\n\n为了创建一个简单的网页，你需要了解一些基础元素和标签，例如用于定义布局的标签等。这些元素几乎用于所有的网页中，为放置在其上的内容提供结构。以下是你开始创建简单网页需要了解的知识。\n\
  \n### 页面标题\n所有的 HTML 页面必须有自己的页面标题。它作为文档的名称。页面标题帮助用户理解他们可以从该页面期待什么。此外，当页面被保存到浏览器书签时，它将作为默认标题。页面标题不会显示在网页的实际正文中。\n\
  \n页面标题元素的语法如下：\n\n`<Title>...</title>`\n\n标题元素始终放置在 `<head>` 元素内部。示例：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <h2>The title attribute</h2>\n  <p title=\"These\
  \ are the tooltips\"></p>\n</body>\n</html>\n```\n\n### 段落\n页面标题不会影响放置在网页上的实际内容。然而，段落元素（Paragraph\
  \ element）无疑会影响。你可以在 HTML 中分行输入消息。但是，除非你使用段落元素，否则浏览器始终会将它们打印在同一行上。毕竟，HTML 关乎的不是表现形式，而是含义。该元素的语法如下：\n\
  \n`<p>...</p>`\n\n在这些标签内插入文本，可以确保该文本被视为一个独立的文本块。它将显示为一个新的段落。其用法示例如下：\n\n```html\n\
  <! DOYPE html>\n<html>\n<head>\n  <title>List of Animals</title>\n</head>\n<body>\n\
  \  <p>this is a list of animals. </p>\n  <p>it is quite interesting. </p>\n</body>\n\
  </html>\n```\n\n### 换行\n换行标签用于将单行分成两行。与其他元素不同，换行符没有结束标签，因为在折断行时不涉及任何内容。你可能会发现经常使用换行很容易。但是，你必须避免这样做，特别是当两段文本应该完全分开时。在这些情况下，段落元素更适合你。换行的标签是\
  \ `<br>`，其用法示例如下：\n\n```html\nA List of Animals<br>\nAnd Other Animals\n```\n\n\
  ### 列表\nHTML 允许你将内容组织成列表，使内容在网页上更美观。HTML 中实际上有三种列表：有序列表、无序列表以及最后的定义列表。在其中，定义列表稍微高级一点。因此，我们在这里只考虑有序和无序列表。这两种列表的工作方式相似。然而，当列表项没有顺序时，使用无序列表。它们通常以项目符号开头。而当必须按顺序列出项目时，使用有序列表。因此，它们以递增的数字开头。\n\
  \n无序列表元素可以使用以下语法定义：\n\n```html\n<ul>\n  <li>...</li>\n  <li>...</li>\n  <li>...</li>\n\
  </ul>\n```\n\n有序列表的语法相似。唯一的区别在于使用的标签，如下文所示：\n\n```html\n<ol>\n  <li>...</li>\n \
  \ <li>...</li>\n  <li>...</li>\n</ol>\n```\n\n`<li>...</li>` 标签用于定义放置在列表列表上的每个项目。\n\
  \n为了理解 HTML 中的有序列表和无序列表，你可以查看下面的示例：\n\n```html\n<! DOYPE html>\n<html>\n<head>\n\
  \  <title>my first web page</title>\n</head>\n<body>\n  <h1>A Short List of Animals</h1>\n\
  \  <ul>\n    <li>Cat. </li>\n    <li>Dog. </li>\n    <li>Horse. </li>\n  </ul>\n\
  </body>\n</html>\n```\n\n（注：源文本包含重复的嵌套列表示例结构，这些已清理为简洁的标准表示，同时保留了内容逻辑。）\n\n## 链接\n\
  链接是我们使用任何网站或网页的核心。因此，了解如何在 HTML 中实现它们是有帮助的。毕竟，链接是互联网能够将一切结在一起的原因。\n\n在 HTML 中创建链接时，你需要理解几点。锚点标签（anchor\
  \ tag）用于定义链接。你需要将链接的目标添加到锚点标签中，以在 HTML 中创建功能链接。的目标可以通过标签中的 `href` 属性定义。\n\n链接可以是绝对的，这意味着它将带你进入特定的网站。例如，你可以链接到\
  \ `http://www.amazon.com` 或 `http://www.google.com`。在这种情况下，语法如下：\n\n```html\n<a\
  \ href=\"http://www.amazon.com \">Amazon</a>\n```\n\n或者，它可以指向相同目录下的另一个文件。例如，假设你创建了名为\
  \ `bird.html` 的另一个 html 文件并将其保存在相同目录中。在这种情况下，可以使用以下语法创建指向文件的链接：\n\n```html\n<a href=\"\
  bird.html\">The List of Birds</a>\n```\n\n\n\n\n\n你也可以将链接指向同一页面的其他部分。如果你用过维基百科，你可能已经见过这种用法了。为了创建这样的链接，你需要在标签上添加一个\
  \ `id` 属性。几乎所有的标签都可以添加此类属性。请查看下例示例以理解它的工作原理。\n\n```html\n<p id=\"bird\">The List\
  \ of Birds</p>\n...\n<a href=\"#bird\">Check the List of the Birds</a></a>\n```\n\
  \n一旦点击该链接，页面将滚动到该元素（在本例中是一个包含相应 `id` 标签的段落）。\n\n### 创建 HTML 页面的步骤\n\n既然我们已经学习了 HTML\
  \ 语言的基础知识，让我们来看创建 HTML 页面的具体步骤。\n\n1. 文本编辑器- 打开一个你喜欢的文本编辑器，例如记事本（notepad），并创建一个空文本文件。\n\
  2. HTML 代码- 将 HTML 代码复制并粘贴到你的新文本文件中。\n3. 保存- 点击文件并以 HTML 文件扩展名保存，例如“nameyoulike.html”。\n\
  4. 演示- 双击该文件即可在任何网络浏览器中查看。\n\n### Hello World 示例\n\n为了帮助你更好地理解 HTML5 中使用的结构和语法，你应该查看以下示例。毕竟，没有比实践更好的学习方式了。以下是一个\
  \ hello world 示例，这种程序通常在编程中用于介绍语言的基础性知识。\n\n```html\n<! DOYPE html>\n<html Lang=\"\
  en\">\n<Head>\n<Meta charset=\"utf-8\">\n<Title>HTML5: Hello World Example</title>\n\
  </head>\n<body>\n<h1>Hello World</h1>\n</body>\n</html>\n```\n\n如你所见，这实际上是一个非常简单的程序。执行此代码后，将打开一个网页并显示文本“Hello\
  \ World”。由于 HTML5 代码的简单性，你实际上可以理解程序中发生了什么。\n\n首先，定义在网页上显示的文本语言为英语。然后，使用 `charset`\
  \ 属性定义 HTML 文档的字符编码。最后，在 `body` 标签内提述要显示的文本。\n\n### HTML 文档的结构\n\nHTML 文档是一个包含超文本标记语言的文件。HTML\
  \ 代码基于标签，这些标签提供了格式化文档的指令。在任何 HTML 文档中，都会提到文档类型元素，也称为 `doctype`。其目的是确保浏览器以标准模式渲染\
  \ HTML，以便其能够以正确的方式运行。使用 `doctype` 还允许验证软件知道应该根据哪个版本的 HTML 对代码进行验证。\n\n在 `doctype`\
  \ 之后，使用了起始 `HTML` 标签。它开启 HTML 代码并用闭合的 `HTML` 标签结束。它们作为整个文档的封装。因此，闭合 `HTML` 标签始终是任何\
  \ HTML 文档的最后内容。\n\n在 `HTML` 元素之后，插入了 `head` 元素。这个封装包含了文档的所有信息或元数据。随后是 `title` 元素，它用于定义页面的标题，标题将显示在菜单栏中。\n\
  \n在关闭 `head` 元素之后，使用了 `body` 元素。它包含了将出现在页面上的实际内容。如你所见，Hello World 示例的 `body` 元素中只有一个头部（header）元素。\n\
  \n### HTML 的类型\n\n我们上面提到的，最新版本是 HTML 5。这个版本可以分为三类。这些类型定义了 HTML 如何使用。\n\n1. 过渡型（Transitional)-这是最常见的\
  \ HTML 类型，具有灵活的语法、拼写和语法组件。这种类型的 HTML 在没有语法限制的情况下使用。浏览器对标签支持尽力而为，因此如果标签拼写不正确，浏览器不会修正错误，而是显示内容。\n\
  2. 严格型（Strict)-这种类型要求关闭所有打开的标签。严格 HTML 对手机是至关重要的，因为它们的处理能力有限。此外，如果代码整洁无误，页面加载速度会更快。\n\
  3. 框架集（Frameset)-它允许开发者创建 HTML 文档的合集，即多个文档连接到单个屏幕。这种类型通常用于创建网站的菜单系统。\n\n### HTML\
  \ 中的元素\n\n在 HTML 中，一个基础元素会在文本块周围有两个标记。元素内部也可能包含其他元素。事实上，所有 HTML 文档都是如此。毕竟，代码的主要部分总是放在\
  \ HTML 元素内部。然而，有少数例外，某些元素不能包含任何文本或其他元素。`img` 元素就是这样一个例子。\n\n### HTML5 中的元素\n\n在\
  \ HTML5 中，对元素进行了一些更改。它们现在被分为一系列元素内容类别。在 HTML5 中，元素通过起始和结束标签来帮助标记。闭合标签始终包含一个斜杠，而起始标签则没有。在\
  \ HTML5 中，元素名称对大小写不敏感。因此，你可以写大写甚至混合写，而没有任何问题。然而，使用小写字母作为元素名称是一个好习惯。下面列出了 HTML 5\
  \ 的一些语义化和结构化元素：\n\n1. `<article>-定义文章。\n2. `<aside>-定义内容页侧边的内容。\n3. `<bdi>-文本的一部分，其格式可能与文本的其他部分不同。\n\
  4. `<details>-提供用户可能使用或隐藏的额外细节。\n5. `<dialog>-描述对话框或窗口。\n6. `<figcaption>`--为 `<figure>`\
  \ 元素提供说明。\n7. `<figure>-定义插图、照片、图表、代码列表等内容。\n8. `<footer>>-定义章节或文档的页脚。\n9. `<header>-描述文档的头部。\n\
  10. `<main>-定义文档的主要内容。\n11. `<mark>-显示高亮或标记的文本。\n12. `<menuitem>-菜单中的项，用户可以在弹出菜单栏中使用它。\n\
  13. `<meter>-已知范围内的测量。\n14. `<nav>-显示文档中的导航链接。\n15. `<progress>-显示任务的进度。\n16. `<rp>-描述在浏览器中显示什么。\n\
  17. `<section>-定义文档的章节或部分。\n18. `<summary>-`<details>` 元素的可见标题。\n19. `<time>-提供日期和时间。\n\
  20. `<wbr>` -可能的换行符。\n\n### HTML5 中的属性\n\n在 HTML 中，元素可以具有属性，这些属性可以设置元素的属性属性并改变行为。某些属性是全局定义的，可以用于任何元素。然而，还有其他属性旨在用于特定的元素。属性应该指定在起始标签中。它们永远不能在闭合标签中使用。\n\
  \n与元素一样，HTML5 中的属性对大小写不敏感。你可以以任何大小写编写它们。然而，你应该练习使用小写字母。\n\n大多数属性及其可能的值都已经在 HTML\
  \ 规范中定义。因此，你没有能力创建自己的属性。如果你这样做，它将使 HTML 无效。毕竟，这可能会困扰用户代理，甚至导致网页解释的正确性出现问题。\n\n###\
  \ 标准属性\n\n下面列出了 HTML5 中使用的一些标准属性\n\n| 属性 | 选项 | 功能 |\n| :--- | :--- | :--- |\n|\
  \ align | 左, 右, 中 | 水平对齐标签 |\n| bgcolor | 十进制, 数值, RGB 值 | 在元素背景放置放置背景颜色 |\n| accesskey\
  \ | 用户定义 | 定义访问元素的键盘快捷键 |\n| class | 用户定义 | 用于层级样式表区分元素 |\n| height | 数值 | 定义图像、表格或表格单元格的高度。\
  \ |\n| Item | 元素列表 | 它用于分组元素 |\n\n\n\n\n\n| spellcheck | 真或否 | 指定元素是否需要拼写或语法检查 |\n\
  | :--- | :--- | :--- |\n| width | 数值值 | 定义图像、表格或表格单元格的宽度 |\n| title | 用户定义 | 元素的“弹出式”标题\
  \ |\n\n## HTML5 的一些有趣特性\n\nHTML5 具有现代网站所需的各种特性。尽管 HTML 的编程模型没有发生变化，但 HTML5 易于实现。它是一种可以被称为**向后兼容**的语言，从意义上说，如果浏览器不支持这些新特性，可以忽略它们。然而，大多数浏览器都支持\
  \ HTML5，以下列出了其中几个浏览器：\n\na) Google Chrome 10.0 及更高版本\nb) Firefox 4.0 及以上版本\nc) Internet\
  \ Explorer 8.0 及以上版本\n\n### 1. HTML5 中的多媒体支持\n该编程语言最首要的特性是它支持多媒体文件，即音频和视频文件，这些文件可以在浏览器中播放。以下是示例语法：\n\
  \n播放视频的语法：\n```html\n<body\n <video src= “video path” controls>\n </video>\n</body>\n\
  ```\n\n播放音频的语法：\n```html\n<body\n<audio src= “audio location” controls>\n  </audio>\n\
  </body>\n```\n\n### 2. 新输入元素类型\n在数据驱动的 Web 应用中，这些输入元素起着重要作用。它们有助于以所需的格式接收输入。HTML5\
  \ 增加了一些新的输入，现有的输入中包括文件、密码等。以下是引入的一个有用输入示例：\n```html\n<input id = “EmailIdInput”\
  \ type= “email”/>\n```\n\n### 3. Canvas（画布）\n它是一个矩形区域，允许像素级操作，如绘制框、线、圆形、执行图形等。以下是示例语法：\n\
  ```html\n<canvas id= “mybox” width= “100” height= “100”>\n```\n\n### 4. 自定义数据属性\n\
  HTML5 提供了一项新特性，引入了自定义数据属性。它们可以以后隐藏的方式从用户添加，稍后由 JavaScript 函数使用。这些属性需要以 `data-` 开头，并根据您的需要命名。例如——\n\
  ```html\n<div class= “example” data-subject= “maths” data-level= “complex”>\n…\n\
  </div>\n```\n\n### 5. 可编辑内容\n在此特性下，终端用户可以编辑 HTML 控制的内容。它还允许开发者创建带有 HTML 编辑器、笔记等部分的网页。要使用此特性，请在\
  \ HTML 的控制面板中添加以下内容：\n```\ncontentEditable=“true”\n```\n\n### 6. 范围验证器和 required（必填）\n\
  `required` 属性用于输入控件，它确保在为输入控件输入值之前，表单不会提交。示例语法：\n```html\n<input type= “text” name\
  \ = “TextBox” required/>\n```\n在范围验证器下，只有当为输入控件指定了最小值和最大值时，才会达到验证。输入的值应在范围内，否则表单将无法提交。以下是该特性的示例语法：\n\
  ```html\n<input type= “number” name = “Number of Items” min= “5” max= “10” required/>\n\
  ```\n\n### 7. Placeholder（占位符）和 autofocus（自动聚焦）属性\n在此属性下，页面加载时会自动聚焦。Placeholder\
  \ 特性会像水印一样显示值，除非焦点转移到输入控件。以下是示例语法：\n```html\n<button id= “SubmitButton” autofocus></button>\n\
  <input type= “text” name = “text box” Placeholder= “Please enter text…”/>\n```\n\
  \n### 8. 预加载视频\n此属性允许浏览器预加载视频。因此，如果用户访问专门为播放该视频而制作的页面且视频已经预加载，将为访问者节省大量时间。\n\n###\
  \ 9. Geo-Location（地理定位）\nHTML5 的此功能允许你与选择的网站共享你的位置。它在智能手机上运行良好。\n\n### 10. Figure（图形）元素\n\
  通过使用此特性，可以在语义上将图像与其说明关联起来。我们只需要添加 `<figcaption>` 元素。以下是该元素的示例：\n```html\n<figure>\n\
  <img src= “path/to/image” alt= “About Image”/>\n<figcaption>\n<p> 这是一个美丽的风景。 <p>\n\
  </figcaption>\n</figure>\n```\n\n## 使用 HTML5 的优势\n\n1. **内置音频/视频兼容性**\n如今，网站必须具有高度交互性以保持观众的参与。因此，开发者需要在网站中包含视频、动画、播放音乐以及\
  \ Twitter 和 Facebook 这样的社交网络网站。在 HTML5 的帮助下，这一切都可以轻松完成。它允许开发者在不使用任何第三方程序的情况下为网站添加丰富的内容。\n\
  2. **改进的代码和更整洁的标记**\n大多数 `div` 标签可以用语义元素取代。\n3. **样式化的表单**\n开发者可以使用 HTML5 使用更精美的表单。它提供了不同类型的输入。\n\
  4. **增强语义化**\nHTML5 改进了语义化，使得页脚、页眉等部分的识别变得更加简单。\n5. **一致性**\n随着越来越多的网站采用 HTML5 元素，网页之间的一致性得到了提高。\n\
  6. **可访问性**\nHTML5 拥有的元素可以详细理解网页的结构。\n7. **Web 应用变得简单**\n一旦你了解了将使用的浏览器的可用功能，就可以使用它们。\n\
  8. **离线缓存**\n在构建网站时，开发者可以指定由浏览器缓存的文件。因此，如果你离线，过去访问过并再次访问的页面仍然会加载。\n9. **客户端数据库**\n\
  Cookies 影响网页的响应时间。通过 HTML5，最好由本地存储和会话存储管理。然而，它不是永久数据库，而是启用临时存储。\n10. **移动端优化**\n\
  \n## HTML5 的劣势\n\n1. HTML5 仅受现代浏览器支持。\n2. 该语言的大部分是稳定的，但仍被认为处于进行中。这意味着任何元素都可能 way。\n\
  3. 像 Apple 和 Google 一样，HTML5 没有适配控制。没有用户可以查看并购买 HTML5 应用的中心。\n4. HTML5 面临媒体许可问题。\n\
  5. HTML5 无法创建动态输出且安全性功能有限。\n\n## 一些 HTML5 最佳实践\n\n1. 始终关闭标签，以避免故障和验证问题。\n2. `DOCTYPE`\
  \ 用于页面顶部打开 HTML 标签之前。\n3. 仅在完成页面编码后添加样式。\n4. 确保你编写的代码语义正确的方法是对其进行验证。\n5. 尝试用 `h1-h6`\
  \ 标签代替 `p`。\n6. 如果你正在编写博客，请将 `H1` 标签留给文章标题。\n7. 标记完成后，检查几次，看看是否有减少该页面元素数量的可能性。\n\
  8. 尝试记住所有的 HTML 标签。\n9. 当我们开始构建网站时，通常从一个基础模板开始，并根据需要进行自定义。与其从头编写所有的 HTML5 代码，不如使用一个在线\
  \ HTML5 生成器来节省时间。需要填写基础表单来设置所需的选项，然后基础 HTML5 模板就会为你准备好。\n10. 最后但重要的是，你开始时总是要检查兼容性。\n\
  \n\n\n\n\n这一章应该让你对 HTML 的基础知识及其功能有了深入的理解。现在让我们来看一些关于该编程语言的常见问题，以便更清晰地理解这一主题。\n\n\
  ## 常见问题 (FAQ)\n\n### HTML5 的目的是什么？\n答：HTML5 的设计是为了克服 `XHTML`、`HTML4` 和 `HTML DOM\
  \ level2\\` 的缺点。该语言专注于在不使用额外插件的情况下交付高质量内容。该语言新的结构化元素标签为整个网页结构提供了更好的语义支持。错误处理被简化了，它还提供了向后兼容性。HTML5\
  \ 可以在平板电脑、智能手机和 PC 等平台上实现。\n\n### HTML5 规范可以在所有类型的浏览器上实现吗？\n答：截至目前，还没有哪个浏览器支持该语言的所有方面。因此，开发者必须确保他可能使用的特性将被其显示内容的浏览器所支持。\n\
  \n### HTML 标签（tags）和元素（elements）不同吗？\n答：HTML 中的元素告诉浏览器如何呈现文本。而当元素被 `<>`（尖角括号）包围时，它们就变成了标签。\n\
  \n### 你所说的 DOCTYPE 是什么意思？它的新形式是什么？\n答：这个术语告诉浏览器网页上使用了哪种 HTML。浏览器使用 `CTYPE` 来确定如何制作网页。新形式是\
  \ `<!doctype html>`。\n\n### 描述 HTML5 中 header、section、article 和 footer 的正确用法？\n\
  答：Header - 用于包含给定页面的某个部分的导航和介绍性信息。这些信息可以是作者姓名、日期、时间、章节标题、目录或任何导航信息。\n\nSection -\
  \ 这是一个灵活的容器，用于存放内容并共享共同信息。\n\nArticle - 它包含一个自包含的性作品，该作品可以在页面之外独立地重新创建，而不会丢失其含义。例如：博客文章、新闻故事等。\n\
  \nFooter - 它包含应在内容末尾显示的信息，也可能包含关于该章节的额外信息。例如：版权信息、相关链接等。\n\n### HTML5 支持哪些媒体元素？\n\
  答：它同时支持音频 (audio) 和视频 (video) 标签。\n\n### HTML5 中包含新的图像元素吗？\n答：是的，有两个新的图像元素，它们是 `WebGl`\
  \ 和 `Canvas`。`Canvas` 包含图形，而 Web Graphics Language (`WebGL`) 是一种免费的跨平台工具，用于在浏览器中生成\
  \ 3D 图形。\n\n### 为什么我们需要 data-attributes（数据属性）？\n答：该属性是语言的新增功能，用于为元素分配自定义数据。该元素适合存储应用程序或页面特有的私或敏感数据，而这些数据没有匹配的元素和属性。\n\
  \n### HTML5 带有哪些标准 API？\n答：其中一些是：Text Track、Media、Application Cache（应用缓存）、Command、User\
  \ Interaction（用户交互）、Data Transfer（数据传输）、Constraint Validation（约束验证）和 History API。\n\
  \n### HTML 浏览器缓存和 HTML5 应用缓存的区别是什么\n答：HTML5 应用缓存会创建一个离线版本，并在本地存储图像、HTML 文件、CSS 和\
  \ JavaScript 等文件，因此与传统的 HTML 缓存相比，它增加了网站的速度。\n\n总的来说，HTML 5 是一种用于创建强大的基于浏览器的应用程序语言。它允许你格式化文本、创建链接、添加图形、输入表格、表单、框架等，并将其保存到文本文件中，任何浏览器都可以读取并显示。\n\
  \n现在你已经对 HTML5 有了了解，可以轻松地使用和实现这种编程语言来创建网站了。\n\n## 第 3 章：理解 CSS：互联网的样式化\n\nHTML 的功能是创建网页。然而，它无法确保内容的正确呈现。为了让网页变得美观并提高其呈现效果，你需要使用如\
  \ `CSS` 这样的样式语言。\n\n### 什么是 CSS？\nCSS 代表 Cascading Style Sheets（级联样式表），是一种简化确保你的网页具有可呈现过程的设计语言。它负责网页的外观。通过它，你可以控制页面的各个方面，如字体样式、文本颜色、列宽、段落间距、布局、背景图像或颜色或其他设计。你还可以启用显示变化以适应不同的屏幕尺寸和设备。\n\
  \n`CSS` 通常用于指定 `HTML` 或 `XHTML` 编写的网页的视觉样式。然而，你也可以将该语言用于各种 `XML` 文档类型。\n\n`CSS`\
  \ 的创建是为了允许文档内容与文档呈现（包括颜色、字体和布局）分离。通过将它们分离，可以改进某些方面，例如内容的可访问性。它还增强了在呈现的各个方面方面的控制能力和灵活性。它还允许多个\
  \ `HTML` 文件共享相同的格式。\n\n这种分离使得以多种样式交付相同的页面成为可能，以适应不同的渲染方法，例如打印、屏幕显示和语音。用户也可以创建一个不同的\
  \ `CSS` 文件来覆盖由网页创建者指定的样式。\n\n目前，正在使用的最新 `CSS` 版本是 `CSS3\\`。`CSS3` 在以前一个版本的基础上为该语言带来了许多新功能。我们将在本书书中重点关注\
  \ `CSS3`。\n\n### CSS 的历史\nHakon Wium Lie 在 1994 年 10 月 10 日首次提出了 `CSS`。在同一时期还提出了许多其他样式表语言。最后\
  \ `CSS1` 于 1996 年发布，Microsoft Internet Explorer 成为第一个支持 `CSS` 的浏览器。这种语言专门开发用于保留网络上的内容，而\
  \ `HTML` 则用于在万维网上创建文档。\n\n样式表的概念并不新鲜。然而，现有的语言要求样式表来自网络上的不同来源，而另一方面 `CSS` 通过级联样式影响文档样式。“级联”意味着组合多个\
  \ `CSS` 文件来决定一个页面样式的能力。\n\n让我们来看看 `CSS` 的一些优势和缺点\n\n### CSS 提供的优势\n使用 `CSS` 有一些显著的优势。其中一些提到如下：\n\
  \n- **节省时间 (Timesaver)**：`CSS` 的最大优势之一是在 Web 开发中节省了大量时间。一个 `HTML` 页面只需要编写一次 `CSS`。然后它可以在多个\
  \ `HTML` 页面上反复重复使用。可以为 `HTML` 中的每个元素定义样式，然后将其应用于各种网页。\n- **易于维护 (Easy Maintenance)**：`CSS`\
  \ 允许你非常方便地维护多个页面。你可以通过更改 `CSS` 中的样式来轻松进行全局更改。所有 `HTML` 页面中的相应元素将自动更新。\n- **页面加载更快\
  \ (Faster Loading Pages)**：在使用 `CSS` 时，没有必要在 `HTML` 中多次定义标签属性。只需要为标签编写一条 `CSS` 规则，并将其应用到该特定标签的所有出现处。这大大减少了你的代码，从而加快了每个页面的下载速度。\n\
  - **更好的样式 (Better Styles)**：与 `HTML` 相比，`CSS` 提供了范围得多的属性。这允许你改进 `HTML` 页面的外观，远比只使用\
  \ `HTML` 属性所实现的要。\n- **缓存 (Caching)**：`CSS` 允许通过离线缓存本地存储 Web 应用程序。这允许你离线查看网站。缓存还能够更快地加载页面，并提高网站的整体性能。\n\
  \n\n\n\n\n- **多设备兼容性**：你可以使用样式表针对各种设备优化你的内容。\n- **全球标准**：事实是，`HTML` 中可用的属性正在减少。相反，`CSS`\
  \ 被推荐作为替代方案。因此，`CSS` 正被用于所有网页，以确保与未来网络浏览器的兼容性。\n\n## CSS 的缺点\n\n1. **CSS 的不同级别**\
  \ - 该语言有多个层级，从 `CSS1` 到 `CSS3`，这导致开发者之间对于应该使用哪个版本感到困惑。\n2. **碎片化** - 在 `CSS` 中，在某个浏览器中有效的内容可能在另一个浏览器中不起作用。因此，Web\
  \ 开发人员在网站上线之前，必须通过在多个浏览器中运行程序来测试兼容性。\n3. **缺乏安全性**：由于 `CSS` 是一个基于文本的开放系统，它没有内置的安全系统。因此，任何拥有网站读写权限的人都可以无意或有意地更改\
  \ `CSS` 文件、链接或更改格式。\n\n## 开始使用 CSS\n\n要开始使用 `CSS` 需要一个文本编辑器、现代浏览器和一些经验。让我们来看看 `CSS`\
  \ 是如何工作的：\n\n当文档在浏览器中显示时，它必须将样式信息与文档的内容结合。文档的处理分为两个阶段：\n\n1. 浏览器将 `CSS` 和标记语言转换为\
  \ `Document Object Model`（`DOM`），它代表了计算机内存中的文档。\n2. 浏览器显示文档的内容。\n\n在标记语言中，元素用于定义文档的结构。正如我们在上一节中中学的，元素是用标签标记的。`CSS`\
  \ 中的大多数元素都有起始标签和结束标签。标签以 `<` 符号开头并以 `>` 。\n\n然而，取决于标记语言，少数元素的 `/` 位于元素名称之后，且它们只有单个标签或起始标签。每个属性、元素和每段文本都成为\
  \ `DOM` 树形结构中的节点。这些节点由它们与其他 `DOM` 节点的关系来定义，即某些元素作为子节点的父节点，而子节点可能有一些兄弟节点。\n\n理解 `document\
  \ object model` 将帮助你调试、设计和维护 `CSS`。让我们来看一个例子来解释这个模型——\n\n在文档中，`<p>` 标签及其结束标签创建了一个容器：\n\
  \n```html\n<p>\n <strong>C</strong>ascading\n <strong>S</strong>tyle\n <strong>S</strong>heets\n\
  </p>\n```\n\n在 `DOM` 中，`P` 节点是父节点，其子节点是文本节点和 `strong` 节点，其中 `strong` 节点也是文本节点的父节点。\n\
  \n## Hello World 程序\n\n与其他语言一样，hello world 程序可以作为 `CSS` 的良好介绍。你可以在下面的示例中看到 `CSS`\
  \ 的实际效果。\n\n```css\n<style type=\"text/css\">\nh1 {\nColor: DeepSkyBlue;\n}\n</style>html\n\
  <h1>Hello, world! </h1>\n```\n\n如你所见，此 `CSS` 规则针对 `HTML` 页的 `H1` 标签。在这种情况下，我们通过一个名为\
  \ `DeepSkyBlue` 的颜色值更改了 `H1` 文本的颜色。\n\n## 创建并将 CSS 应用到 HTML 文件\n\n在开始为你的 `HTML`\
  \ 文件创建自己的 `CSS` 之前，你需要知道如何在 `HTML` 中实现 `CSS`。为了实现这一点，你有四种可用方案。它们列在下面。\n\n### 1.\
  \ 内联 (Inline)\n\n在这种方法中，样式规则直接放置在 `HTML` 文件中。在需要更改样式的标签中使用 `style` 属性。这里有一个内联方法的示例。\n\
  \n```html\n<p style=\"color: blue\">…</p>\n```\n\n此规则的结果将是该段落的文本变为蓝色。\n\n使用这种方法也有缺点，因为它会让\
  \ `HTML` 膨肿，并且网站维护变得有些困难。但是，它在某些情况下运行良好。例如，如果你使用的系统无法访问 `CSS` 文件，那么你可以简单地将样式规则添加到元素中。\n\
  \n### 2. 内部 (Internal)\n\n如果你想为整个页面实现特定的样式规则，你应该选择内部样式方法。它被称为嵌入式方法。规则放置在 `head`\
  \ 元素内部。你可以在下面的示例看到它是如何工作的。\n\n```html\n<!DOCTYPE html>\n<Html>\n<Head>\n<Title>CSS\
  \ Example</title>\n<Style>\nP {\nColor: green;\n}\nA {\nColor: blue;\n}\n</Style>\n\
  </head>\n</html\n```\n\n当你使用这种方法时，你会发现所有段落都是绿色的，而所有链接都是蓝色的。\n\n这种方法的缺点是，每当有人访问网页时，样式都必须被下载。这给用户带来了缓慢的浏览体验。然而，这种方法也有自己的优势。由于\
  \ `CSS` 是 `HTML` 文档的一部分，整个页面仅作为一个一个文件存在。当你通过电子邮件向某人发送网页或将其用作博客的模板时，它是很有用的。嵌入方法的另一个优势是，当使用数据库生成页面内容时，可以同时生成动态样式。标题和其他元素的颜色被插入到嵌入在页面上的\
  \ `CSS` 规则中。它允许用户更改颜色。\n\n### 3. 外部 (External)\n\n正如名称所示，这种方法涉及创建一个完全独立的 `CSS` 文件。这允许在多个页面使用它。这就是为什么要避免内联和内部方法的原因。下面是一个\
  \ `CSS` 文件的基本示例。\n\n```css\nP {\nColor: green;\n}\nA {\nColor: blue;\n}\n```\n\n\
  此文件需要保存在与 `HTML` 页面相同的目录下。你可以为 `CSS` 文件选择任何名称，但常见的命名规范规定它应该命名为 `style.css` 以便你操作。一旦文件被保存，你就可以将\
  \ `HTML` 文件链接到它。以下代码显示了如何链接 `HTML` 文件。\n\n```html\n<!DOCTYPE html>\n<Html>\n<Head>\n\
  <Title>Example</title>\n<link rel=\"stylesheet\" href=\"style.css\">\n```\n\n在保存\
  \ HTML 文件时，它将链接到保存在相同目录下的名为 `style.css` 的 CSS 文件。你对 `CSS` 文件的任何更改将在打开相应的 `HTML`\
  \ 文件时反映出来。\n\n链接到单独 `CSS` 文件的优势是，如果你想更改整个网站的样式，只需要在单个 `CSS` 文件中进行一次更改。使用这种方法的另一个优势是速度。在第一次访问网站时，用户的浏览器会下载当前页面的\
  \ `HTML` 以及链接的 `CSS` 文件。当用户导航到网站的其他页面时，他们的浏览器只需要下载 `HTML` 页面，从而提高了浏览速度。\n\n**从 CSS\
  \ 内部导入 CSS 文件**：此 `import` 规则允许从 `CSS` 内部附加一个新的 `CSS` 文件。要做到这一点，只需只需执行以下操作——\n\n\
  ```css\n@import “newstyles.css’;\n```\n\n在这里，你可以编写你的 `CSS` 文件名代替 `newstyles`，并确保包含正确的路径。例如，我们有一个\
  \ 500 个页面的网站，想为所有页面添加第二个 `CSS` 文件。因此，我们不需要通过编辑所有 500 个 `HTML` 文件来添加另一个 `CSS` 链接，只需从第一个文件中导入第二个\
  \ `CSS` 文件，从而节省了大量时间。\n\n## CSS 规则的语法\n\n\n\n\n在 CSS 中，我们本质上并不是在编写程序。毕竟，它是一种样式表语言。相反，我们编写的是规则。一个\
  \ CSS 将包含一组样式规则，浏览器会在将它们应用到 HTML 文档中的关联元素之前，对其进行解释。正如你已经看到的，一个样式规则由三部分组成。\n\n**选择器（Selector）**：这是应用样式的\
  \ HTML 标签。\n\n**属性（Property）**：这是 HTML 标签的一种属性。所有的 HTML 属性都会转换为它们相应的 CSS 属性。\n\n\
  **值（Value）**：每个属性都有一个对应的值。\n\n***例如：***\n\n```css\nh1 {color:brown;font-size:12px;}\n\
  ```\n\n在上面的示例中：\n\n`h1` 是选择器\n`color` 是属性\n`brown` 是值\n`font-size` 是属性\n`12px` 是值\n\
  \n选择器指向你想要样化的元素。声明块包含多个一个声明，它们之间用分号隔开，每个声明都包含一个 CSS 值和属性名，它们之间用冒号隔开。CSS 声明必须以分号结束。声明块包含在大括号中。\n\
  \n所有 CSS 规则的基本语法如下。\n\n```css\nSelector {property: value}\n```\n\nCSS 选择器根据元素的名称、类（class）、ID、属性等查找\
  \ HTML 元素。\n\nCSS 中的选择器可以通过多种方式定义。事实上，你可以轻松地选择一个你习惯使用的。以下是几种类型的选择器及其使用方法。\n\n###\
  \ 1. 类型选择器（The Type Selectors）\n\n你可能已经在之前的示例中注意到这种选择器的用法了。它允许规则应用于所有相同类型的元素。在接下来的示例中，绿色被应用于页面上所有的一级标题。\n\
  \n```css\n13. h1 {\nColor: #36CFFF;\n}\n```\n\n### 2. 通用选择器（The Universal Selectors）\n\
  \n与其说选择特定类型的元素，不如使用通用选择器。这允许你将规则应用到可以使用给定属性的任何元素类型。下面的示例说明了通用选择器的用法。在其中，文档的整个内容将以黑色显示。\n\
  \n```css\n14. *\nColor: #000000;\n}\n```\n\n### 3. 后代选择器（The Descendant Selectors）\n\
  \n在某些情况下，你可能希望仅当元素位于另一个特定元素内部时才对其应用样式规则。在后代选择器的帮助下这完全可能的。你可以查看下面的示例。在其中，只有当 `em`\
  \ 元素存在 `ul` 标签内部时，样式规则才会应用于它。\n\n```css\nUl em {\n1. Color: #000000;\n}\n```\n\n\
  ### 4. 类选择器（The Class Selectors）\n\n可以使用类属性来为元素定义样式规则。通过类选择器，具有该类的元素将根据定义的规则进行样式化。看看下面给出的示例。\n\
  \n```css\n15. .black {\n16. Color: #000000;\n17.\n```\n\n使用此规则后，你会发现文档中所有类属性被设置为\
  \ `black` 的元素，其内容都将以黑色显示。同时，将来可以细化规则并指定某个特定元素。查看以下示例。\n\n```css\n18. h1.black {\n\
  19. Color: #000000;\n20.\n```\n\n在上面的规则中，内容将样式化为黑色，但仅限于类属性已设置为 `black` 的 `h1` 元素。也可以对特定元素应用多个类选择器。查看下面的示例以了解它是如何工作的。\n\
  \n```html\n21. <p class=\"center bold\">\nText\n</p>\n```\n\n### 5. ID 选择器（The ID\
  \ Selectors）\n\n在为元素定义样式规则时，也可以考虑 ID 属性。在这种情况下，所有具有该特定 ID 的元素将根据你定义的规则进行样式化。\n\n\
  ```css\n22. #black {\nColor: #000000;\n}\n```\n\n使用此 CSS 规则后，你会发现所有 id 属性为 `black`\
  \ 的元素，其内容都将以黑色显示。还可以进一步细化此规则并针对特定类型的元素。在接下来的示例中，只有属性为 `black` 的 `h1` 标签会受规则的影响。\n\
  \n```css\nh1#black {\nColor: #000000;\n}\n```\n\nID 选择器在与后代选择器配合使用时非常有用。在下面的示例中，你会看到，只有当这些二级标题出现在\
  \ id 属性指定为 `black` 的标签内部时，所有的 `h2` 标签才会以黑色显示。\n\n```css\n#black h2 {\n23. Color:\
  \ #000000;\n}\n```\n\n### 6. 子选择器（The Child Selectors）\n\n子选择器类似于后代选择器。然而，它们的功能非常不同。下面的示例说明了子选择器的用法。在此\
  \ CSS 规则中，只有当段落是 `body` 元素的直接子元素时，它们才会以黑色显示。如果段落存在任何其他元素（如 `td` 或 `div`）内部，则不会。\n\
  \n```css\n24. Body > p\nColor: #000000;\n}\n```\n\n### 7. 属性选择器（The Attribute Selectors）\n\
  \n借助属性选择器，你可以为具有特定元素的元素应用样式。在示例中，类型为 `submit` 的 `input` 将不受影响。\n\n```css\n25. Input\
  \ [type = \"text\"]\nColor: #000000;\n}\n```\n\n属性选择器有一个主要优势：\n\n`P [Lang]`–在这种情况下，段\
  \ 元素具有 Lang 属性。\n`P [Lang=\"en\"]`–仅选择 Lang 精确值为 \"en\" 的元素。\n`P [Lang~=\"en\"]`–它将选择包含单词\
  \ \"en\" 的段元素。\n`P[lang|=\"en\"]`–以 \"en-\" 开头的。\n\n### 8. 多样式规则（Multiple Style\
  \ Rules）\n\n在某些情况下，你可能需要为特定元素设置多个样式规则。CSS 允许你将不同的属性及其值组合在一个块中。你可以通过示例看到它是如何工作的。\n\
  \n```css\n26. h1 {\nColor: #000000;\nFont-weight: normal;\nLetter-spacing: .3em;\n\
  Margin-bottom: 2em;\nText-transform: lowercase;\n}\n```\n\n如示例所示，所有的属性值对都用分号隔开。如果你愿意，可以将规则写在单行，而不是使用多行，但将它们放在不同的行可以提高代码的可读性。\n\
  \n### 9. 选择器分组（Selector Groups）\n\n如果你想或需要，也可以为多个选择器应用样式规则。在这种情况下，选择器之间必须用逗号隔开。你可以在示例中看到这种用法。\n\
  \n```css\n27. H1, h2, h3 {\nColor: #000000;\nFont-weight: normal;\nLetter-spacing:\
  \ .4em;\nMargin-bottom: 1em;\nText-transform: lowercase;\n}\n```\n\n此处定义的样式规则不仅应用于\
  \ `h1` 元素，还应用于 `h2` 和 `h3` 元素。列表的顺序不影响规则。\n\n**在 CSS 中使用颜色**\n\n当你对 HTML 文档进行样式化时，颜色无疑是你实现的内容之一。在\
  \ CSS 中，你有能力从 16,777,216 种颜色中选择为文本着色。以下是在你的样式规则中实现它们的方法。\n\n**颜色 属性的值**\n\n\n\n\n\
  在 CSS 中，`color` 属性的值可以使用名称指定。或者，你也可以十六进制代码（hex code）或 RGB 代码。下面给出了将红色作为此属性值的某些方法。换句话说，当\
  \ `color` 属性使用以下代码时，你会发现文本以红色显示。\n\n- `red`\n- `Rib` (100%, 0%, and 0%)\n- `rgb(255,0,0)`\n\
  - `#f00`\n- `#ff0000`\n\nCSS 中预定义了某些颜色名称。它们包括黄色、`blue`、`fuchsia`、`lime`、`green`、`navy`、`red`、`white`、`black`、`aqua`\
  \ 和 `olive` 等。CSS 认为认为 `transparent` 也是一个有效值。除了 `black` 和 `white` 之外，你会发现颜色名称在 CSS\
  \ 样式规则中很少使用。由于这些名称具有很高的特殊性，导致它们的灵活性受到限制。\n\nRGB 代码由三个值组成，每个值代表一种原色。值的范围从 0 到 255，阴色的最低级别由\
  \ `0` 表示。`255` 是可能的最大值。用百分比的形式表示这些值也是可行的。\n\n十六进制代码利用 16 进制系统。每个十六进制数字都以井符号开头。在\
  \ CSS 中，它们的长度可以是三位或六位。三位版本仅仅是六位版本的缩写形式。你会发现，后者版本允许你对颜色进行更具体的控制。\n\n## 使用 Color 属性\n\
  \n当你想要为文档应用颜色时，可以使用下面提供的两个属性中的一个或两者。\n\n- `Color`: 用于给文本应用颜色。\n- `Background- color`:\
  \ 用于给背景应用颜色。\n\n在使用这些命令时，请确保你已经正确地输入了 `color`。浏览器不识别 `color.`。相反，它们可以理解 `color.`。这些属性可以应用于几乎所有的\
  \ HTML 元素。\n\n## 在 CSS 中样式化文本\n\n文本是另一个常见的样式化项目，用于提高可读性等。CSS 为你提供了许多属性，你可以使用这些属性来更改网页上文本的外观和布局。下面是文本中一些常用的属性。\n\
  \n### 2. `font-family` 属性\n该属性定义文本的字体，例如 `Verdana` 和 `Times New Roman`。当你使用此属性时，需要确保浏览器能够找到指定为值的字体。这意味着该字体必须在用户的计算机上可用。如果你使用某种稀有或不常用的字体，你的用户可能无法使用该文件，因为他们的电脑上没有该字体。有许多字体在计算机上是始终可用的，如上面的\
  \ `Verdana` 和 `Times New Roman`，以及 `Arial` 和 `Calibri`。\n\n另一方面，你有能力将多个字体作为此属性的值。你需要借助逗号来分隔这些值。这允许浏览器在用户的计算机上搜索列表中的提到的字体之一。一旦找到正确的字体，将使用该字体显示文本。\n\
  \n请记住，浏览器将按照顺序遵循列表。因此，在 fact 指定的为 `Arial, Verdana, serif` 的列表中，浏览器将首先搜索 `Arial`，如果找到则使用它。如果没有找到，它将搜索\
  \ `Verdana` 字体，依此类推。你需要记住的另一个点是，如果字体名称由两个或多个单词组成，则需要将字体名称放在引号中。\n\n这里有一个如何使用该属性的简单示例。\n\
  \n```\nFont-family: Verdana, Arial, “Times New Roman”, serif\n```\n\n### 3. `Font-size`\n\
  此属性设置文本的大小。当然，你可以设置任何你想要的值。然而，你需要考虑内容的可读性。因此，你想要用作标题的文本应该具有较高的 `font-size` 值，但也应该具有适当的标题标签，如\
  \ `<h1>`。你不应该仅仅使用 HTML 段落元素来代替它们，并给它们设置更高的 `font-size`。用于设置文本大小的常用单位有：\n\n**a) `px`\
  \ (像素)** - 它是一个绝对单位，人们可以根据需要增加或减少文本的像素大小。\n\n**b) `ems`** - 父元素设置的字体大小等于 `1em`。它可以用于设置任何内容的大小，而不只是文本。整个网站都可以使用\
  \ `ems` 进行调整，从而使维护变得简单。\n\n**c) `rems`** - 它们的工作方式与 `ems` 类似，不同在于文档根元素设置的字体大小等于\
  \ `1rem` 而不是父元素。这使得计算字体大小变得更容易。然而，Internet explorer 8 或更低版本不支持 `rems`。\n\n元素的 `font-size`\
  \ 与父元素一致。在所有浏览器中，根元素的字体大小默认设置为 `16px`。因此，根元素内的任何段的 `font-size` 都是 `16px`。\n\n让我们来看这个简单的尺寸设置示例：\n\
  \n当你调整文本大一时，最好将文档的 `font-size` 设置为 `10px`，这样计算起来会容易得多。现在，当你这样做时，所需的 `rem` 或 `ems`\
  \ 值将是像素字体大小，并将除以 `10` 而不是 `16`。通过这样做，你可以根据需要轻松设置文本大小。此外，最好在样式表的选定区域列出所有字体规则集，以便于访问。\n\
  \n### 4. `Font-weight`\n此属性用于检查文本是否加粗。通常，用于此属性的值是 `bold` 或 `normal`。这是为了确保与旧浏览器兼容。然而，你还可以使用其他值，如\
  \ `lighter` 和 `bolder`。你也可以使用 `100` 到 `900` 之间的任何值，并以百为单位递增。\n\n### 5. `Font-style`\n\
  此属性用于将一段文本样式化为斜体。此属性的可用值为 `italic` 或 `normal`。\n\n### 6. `Text-decoration`\n此属性用于定义文本是否应该下划线、贯穿线或上划线。如果你不需要此类效果，可以使用值\
  \ `normal`。\n\n- `Underline`: 给文本加下划线。\n- `Line-Through`: 在文本上穿过一条线。\n- `Overline`:\
  \ 在文本上方放置一条线。\n\n### 7. `Text drop shadows`\n文本阴影有四个属性：\n\n**a) 水平偏移。** 它接受大多数可用的\
  \ CSS 大小长度单位。然而，通常使用 `px`。此值必须包含。\n\n**b) 垂直偏移。** 阴影上下移动而不是左右移动。此值必须包含。\n\n**c)\
  \ 模糊半径** 阴影扩散得更开。如果未包含此值，默认变为 `0`，这意味着没有模糊。此属性也接受 CSS 的大多数长度和大小单位。\n\n**d) 阴影的基础颜色**\
  \ 可以取任何 CSS 颜色单位。如果不包含此值，默认保持为黑色。\n\n通过逗号分隔多个阴影值，也可以为文本提供多个阴影。\n\n### 8. `Text-Color`\n\
  此属性用于设置文本的颜色。\n\n### 9. `Text Alignment`\n文本对齐属性用于水平对齐文本。文本可以对齐 `right`、`left`、`center`\
  \ 或 `justify`。示例：\n\n```\nh1{text-align:right;}\n```\n\n当使用对齐文本时，文本的每行都获得相同的宽度，左右边距是直的。示例：\n\
  \n``` evendiv{text-align:justify;}\n```\n\n### 10. `Text transformation`\n这指定文本中的小写字母和大写字母。通过使用此属性，单词的首字母也可以写成大写。示例：\n\
  \n```\np.captitalize{text-transform:capitalize;}\n```\n\n### 11. `Text Indentation`\n\
  它指定第一行的缩进。示例：\n\n```\np{text-indent:40px:}\n```\n\n\n\n\n\n### 12. 字间距 (Letter Spacing)\n\
  用于指定给定文本中字符之间的距离。下面的示例展示了如何减少或增加间-\n\n```css\nh1 {letter-spacing: 5px;}\nh2 {letter-spacing:\
  \ -5px;}\n```\n\n### 13. 行高 (Line Height)\n它指定每行之间的距离。例如：\n\n```css\np.small {line-height:\
  \ 0.6;}\np.big {line-height: 1.6;}\n```\n\n### 12. 文字方向 (Text direction)\n用于改变元素的方向。例如：\n\
  \n```css\ndiv {direction: rtl;}\n```\n\n### 14. 间距 (Word Spacing)\n它定义单词之间的空格。例如：\n\
  \n```css\nH1 {word-spacing: 15px;}\nH2 {word-spacing: -10px}\n```\n\n上述属性可以让你对如何在网页上样式化文本有一个基本的了解。除此之外，一旦你熟悉了基础属性，还有许多可以使用属性。下面列出了其中一些：\n\
  \n#### 字体样式 (Font Style)\na) **字体变体 (Font variant)**：在普通字体选项和小小型大字母之间切换。\nb) **字体变体连字\
  \ (Font variant ligatures)**：控制文本中使用哪些上下文形式和连字。\nc) **字体变体数字 (Font variant numeric)**：控制分数、数字和序数标记的替代字形的使用。\n\
  d) **字体伸缩 (Font stretch)**：通过使用此选项，可以在给定字体的所有可能的伸缩版本之间切换。\n\n#### 文字布局样式 (Text layout\
  \ Styles)\na) **空白 (White space)**：它定义了如何处理元素内的空白和相关的换行符。\nb) **单词断行 (Word break)**：指定是否在单词内部进行断行。\n\
  c) **自动换行 (Word wrap)**：它定义浏览器是否可以或不可以在单词内部换行以避免溢出。\nd) **书模式 (Writing mode)**：它指定文本行是垂直排列还是水平排列，以及后续行的方向。\n\
  \n### CSS 快捷方式 (Shortcuts in CSS)\n既然我们已经学习了 CSS 的基础，现在编写该语言的某些快捷方式，通过练习可以使用。这些快捷方式可以让你的代码更易读、加载速度更快且质量更高。快捷方式是加速过程的一种极方法。然而，在使用它们时应该小心，因为如果使用不当，可能会带来负面结果。因此，始终要分析使用此类快捷方式是否有益。\n\
  \n#### 属性分组 (Property Grouping)\n此快捷方式允许在一行内定义一组属性的一 set 值，而不是分布在不同的行中。\n\n示例：使用字体\n\
  \n| 未分组 | 分组后 |\n| :--- | :--- |\n| `h1{font-weight: normal;font-size: 20px;line-height:\
  \ 12px;font-family: georgia, tahoma, verdana;}` | `h1 {font: normal 20px/12px Georgia,\
  \ Tahoma, verdana;}` |\n\n#### 单行输入 (Typing on one line)\n每个人编写代码的方法都不同，但有一个共同点：使用的制表符和空格越少，代码加载就越快。其核心思想是创建一个没有过多空白的高可读性代码。在一行内输入一组属性可以是一个解决办法。\n\
  \n示例：\n\n| 多行输入 | 单行输入 |\n| :--- | :--- |\n| `p{color: #4f39ac;background: #f4f4f4;line-height:\
  \ 16px;}` | `P{color: 4f39ac; background: #f4f4f4; line-height: 16px;}` |\n\n####\
  \ 颜色值缩写 (Color value shortening)\n在为元素声明十六颜色值时，与其使用完整的 6 位值，可以将其缩短为三位。如果颜色代码由 3\
  \ 对重复的数字组成，这是可能的。\n\n示例：\n\n| | 颜色值缩写快捷方式 |\n| :--- | :--- |\n| `body {background:\
  \ #gggggg;}h1 {background: #aa5566;}p {background: #112233;}#menu {background: #ggaa44;}`\
  \ | `body {background: #ggg}h1 {background: #a23;}p (background: #123;}#menu {background:\
  \ #ga4;}` |\n\n#### 使用零 (Using zeros)\n当你使用 0 时，不需要使用 `pt`、`px`、`em` 或任何其他测量类型\n\
  \n示例：\n\n```css\n#menu {margin:20px 0;}\n```\n\n### 使用 CSS 的技巧和技巧 (Some tips and\
  \ tricks for using CSS)\n- 尝试使用更简洁、更易理解的快捷 CSS 代码。\n- 始终为符合标准的浏览器编写代码。之后，你可以在最后为\
  \ IE 进行修正。永远不要相反，因为这会增加前向兼容性的概率。\n- `class` 和 `ID` 选择器经常让初学者困惑。在 CSS 语言中，`class`\
  \ 用 \".\" 表示，而 \"#\" 表示 `ID` 选择器。简而言之，`ID` 用于唯一的且不可重复的样式；相反，`class` 可以被重用。\n- 在修改\
  \ CSS 时，获取布局的即时预览总是更好的。这样可以更好地理解和调试 CSS 样式。\n- 如果在具有固定高度的容器块中垂直居中文本，只需将文本的 `line-height`\
  \ 设置为与容器块的高度相同。\n- 要创建流式图像，将图片的 `max-width` 设置为 `100%`。\n- 当两个或多个 CSS 选择器向单个 html\
  \ 元素发送冲突的指令时，必须对应用哪些样式做出选择。这可以通过 CSS 特异性计算来实现，其表示形式为 `(a,b,c,d)`。\n- 任何包裹在链接中的图像都会有一个边框。因此，要删除边框，你可以执行以下操作：\n\
  ```css\na image {border: none} or a image {border:0}\n```\n- 始终确保按照特定顺序设置不同的链接状态。最常见且容易记忆的方法是\
  \ Love Hate，即- `LVHA`：Link（链接）、Visited（已访问）、Hover（悬停）、Active（激活）。\n- 为了创建 3D 按钮，技巧是给你的元素边框赋予不同的颜色。通常需要一或两个色调的改变，但你也可以尝试不同的效果。\n\
  \n这些只是少数技巧和技巧，但随着你投入实践并积累经验，你将自己发现更多。我们正在编写一些常见问题，以便更好地理解这种动态的语言。\n\n### CSS 常见问题\
  \ (FAQ’s on CSS)\n- **为什么需要样式表？**\n  答：需要样式表是因为它们对布局和显示提供了很大程度的控制。它们减少了控制布局所需的代码量。\n\
  - **如何链接外部样式表？**\n  答：它是一个可以链接到 HTML 文档的模板文件。`LINK` 元素用于链接文件。确保文件具有 `.css` 扩展名。\n\
  - **ID 选择器和类选择器有什么区别？**\n  答：ID 选择器是唯一的，而类选择器可以应用于多个 HTML 元素。\n- **块级元素和内联元素的区别是什么？**\n\
  \  答：内联元素占据必要的宽度，而块级元素占据可用宽度并换行。\n- **哪些字体是跨平台通用的？**\n  答：所有平台都识别五种基本字体。它们是：`sans-serif`、`serif`、`monospace`、`cursive`\
  \ 和 `fantasy`。\n- 样式表中包含注释吗？\n  答：只要有空白，可以在样式表的任何地方包含注释。\n- CSS 是否有局限性？\n  答：是的，有一些限制\n\
  \  a) 没有表达式和列声明\n  b) 无法按选择器排序\n  c) 无法针对特定文本\n  d) 垂直控制存在局限\n- **浮动属性是什么？**\n \
  \ 答：通过该属性，图像可以向左或右移动并与包裹它的文本一起移动。\n我们可以移除图片下方的间隙吗？如何做？\n答：是的，可以移除图片下方的间隙，因为图像被视为文本，它们是内联元素。\n\
  ```css\nimg {display:block;}\n```\n 如何在 CSS 中添加注释？\n答：可以使用 `/*` 和 `*/` 添加注释。\n\n\
  正如你可能意识到的，CSS 是一种非常容易学习的语言。它的设计用于不仅定义网页的整体外观，还定义文本和元素的结构。本章将让你对如何使用尖端和标准的 CSS 技术创建用户提供丰富体验的网页产生洞察。\n\
  \n\n\n\n\n你在掌握更高级技能时应该不会遇到什么问题。事实上，你会发现对网页进行基础层面的样式化是很容易的。\n\n## 第 4 章：学习 JavaScript：让网页更具交互性\n\
  \n到目前为止，你已经学习了如何使用 `HTML` 创建基础网页。你还知道如何通过 `CSS` 的帮助让你的网页看起来更美观。然而，对于现代网页来说，这远远够的。如今，网站需要具有交互性。为了实现这一点，你需要实现\
  \ `JavaScript`。\n\n## 什么是 JavaScript？\n\n`JavaScript` 实际上是一种动态编程语言。当与 `HTML` 一起使用时，它可以为网页提供动态交互性。然而，`JavaScript`（简称\
  \ `JS`）主要作为 `HTML` 文档中的脚本语言使用。这种语言不需要持续下载，可以轻松运行。它通常用于各种测验和投票。\n\n## 了解脚本语言\n\n\
  在我们学习所有关于 `JavaScript` 的知识之前，我们需要理解什么是脚本（script）。它是一个语句序列，为执行某些任务提供指令。通常，脚本语言比结构化语言更容易学习，代码编写也更快。其他脚本语言的示例还有：`Python`、`PHP`、`Tcl`\
  \ 等。这些语言可以根根于 `HTML` 中，通常用于为网页添加功能，如图形显示或不同的菜单样式。脚本语言可以是客户端的，也可以是服务器端的。在客户端脚本语言下，用户看到的数据会受到影响；而在服务端脚本语言中，数据是在服务器的数据库中进行处理的。\n\
  \n`JavaScript` 可用于向用户提供响应，甚至可以启动幻灯片。通过像 `JavaScript` 这样的脚本语言，基础网页可以转变为面向用户的活跃平台。\n\
  \n## JavaScript 的历史\n\n`JavaScript` 创建于 1995 年，用于网页浏览器 `Netscape Navigator`。这种语言的原始名称是\
  \ `Mocha`，由 Netscape 创始人 `Marc Andreessen` 命名。在同年晚些时候，名称被改为 `LiveScript`，在获得商标许可后，命名为\
  \ `JavaScript`。该语言的第一个商标版本于 1997 年以 `ECMAScript` 的名称发布。\n\n今天，`JavaScript` 已经进入了全新的进化阶段。根据现代浏览器，已经出现了许多创新、标准化和新开发。\n\
  \n## JavaScript 的特性\n\n1. **浏览器支持** - 大多数浏览器都接受这种脚本语言，因此不需要额外的插件。\n2. **可同时用于服务器端和客户端**\
  \ - 用户实际上可以在运行时更改网页的结构，因为 `JavaScript` 可以访问 `DOM`（文档对象模型）。因此，它可以用于为网页添加不同的效果。此外，它也可以用在服务器端。\n\
  3. **函数式编程语言** - 在这种语言中，函数可以像任何其他数据类型一样赋值给变量。此外，函数可以接受另一个函数作为参数。\n4. **支持对象** -\
  \ 它是一种面向对象的语言，使其容易学习和使用。\n5. **其他特性 –**\n    a) 它是一种区分大小敏感的脚本语言\n    b) 它可以显示信息或根据计算机时钟提取正确数据。\n\
  \    c) 可以在自定义的窗口中打开页面，你可以指定是否显示菜单行、浏览器按钮、状态栏或其他任何内容。\n    d) 可以在不使用服务器程序的情况下随机显示内容。\n\
  \    e) `JavaScript` 中的所有语句都以分号结束。\n\n## JavaScript 提供的优势\n\n`JavaScript` 是最全能但也最简单高效的语言。在我们学习了它广泛的用途和扩展功能之后，现在我们将看看这种语言提供的一些优势。`JavaScript`\
  \ 为用户提供了一系列好处。下面是其中一些。\n\n1. **简单性** - `JavaScript` 是最多功能且简单有效的语言。在我们学习了它广泛的用途和扩展功能之后，现在我们将看看这种语言提供的一些优势。`JavaScript`\
  \ 为用户提供了一系列好处。其中一些如下。\n2. **速度** - `JavaScript` 在客户端执行。由于它可以立即执行，因此不需要联系服务器并等待。这使得\
  \ `JavaScript` 变得非常快。\n3. **多功能性** - `JavaScript` 兼容许多其他语言。事实上，无论文件扩展名如何，插入 `JavaScript`\
  \ 都是可能的。你还可以在应用程序中使用 `JavaScript`。\n4. **API 可用性** - 应用程序接口（简称 `APIs`）的可用为 `JavaScript`\
  \ 提供了一系列功能。这包括音频样本的生成和动态创建。虽然这些 `APIs` 内置于不同的浏览器中，但第三方 `APIs` 也可用，允许你整合如 `Facebook`\
  \ 等社交网络。\n5. **扩展功能** - `JavaScript` 拥有如 `Greasemonkey` 等第三方插件。该插件允许开发者编写可以在所需页面上执行的片段，以扩展其功能。\n\
  \n## JavaScript 的缺点\n\n从理论上讲，这种语言对开发者非常有益，但在实践中它也有一些缺点-\n\n1. **安全性** - 一旦编写的 `JavaScript`\
  \ 代码段被附加到网页上，它们就会在客户端上执行，因此可能被用来过度利用用户的系统。虽然已经根据现代网络标准设置了某些限制，但恶意代码仍然可以被执行。\n2.\
  \ **不一致性** - `JavaScript` 可能会被不同的布局引擎不同的渲染，导致界面和功能方面的不一致。然而，最新版本的 `JavaScript` 已经根据通用标准进行了调整，但仍然存在差异。\n\
  3. **执行缓慢** - 语言中复杂的脚本需要更长的启动和运行时间。\n\n## JavaScript 可以做什么？\n\n自诞生以来，`JavaScript`\
  \ 在网页开发者中一直受欢迎，因为使用 `JavaScript` 可以完成很多事情。事实上，选择几乎是无限的。它可以用于制作简单的功能，如图像库、轮播图以及对用户的按钮点击提供响应。`JavaScript`\
  \ 的高级功能包括动画 3D 图形和游戏。你甚至可以使用 `JavaScript` 开发完整的基于数据库的应用程序等。\n\n\n\n\n\n### 3. 布局问题可以通过\
  \ JavaScript 来修复。通过使用这种脚本语言，可以找到特定页面上任何元素的区域和位置，以及浏览器窗口的尺寸。这可以防止重叠问题。例如，你的网站有几级菜单，但在检查时你发现为子菜单留出了空间。因此，通过在之前显示，你可以防止菜单项重叠。\n\
  \n### 4. 通过 JavaScript，你可以加载只有那些认为该信息与其相关的的用户才能访问的信息。例如；网站的导航菜单有 5 个链接，但指向更深层页面的其他链接只有在用户激活菜单项时才会显示。\n\
  \n### 5. 诸如不断变化的信息（体育比赛比分或股票市场），可以在无需用户交互的情况下定期加载。\n\n## JavaScript 基础\n\nJavaScript\
  \ 已经成为互联网上最突出的语言之一。它可以跨平台并在各种浏览器中使用。因此，为了在现实世界中使用这种语言，我们需要首先学习它的基础知识。这将使你对 JavaScript\
  \ 有基础的理解。\n\n### 1. 变量\n\n如你所知，变量是存储数据的容器。存储在变量中的数据可以是表达式或值。在 JavaScript 语言中，表达式有三种类型。\n\
  \n| 表达式 | 说明 |\n| :--- | :--- |\n| 逻辑 | 求值为布尔值，即 true 或 false |\n| 算术 | 求值为一个数字\
  \ |\n| 字符串 | 求值为一个字符串 |\n\n### JavaScript 中变量的作用域\n\n变量作用域是指定义变量的区域。JavaScript 中的变量可以有两种作用域之一。\n\
  \n**全局变量：** 由于其全局作用域，这些变量可以在代码的任何地方定义。\n\n**局部变量：** 这些变量仅存在于定义的函数内部。函数参数始终是该特定函数的局部变量。\n\
  \n可以使用 `var` 关键字声明局部变量，而全局变量应该在不使用 `var` 关键字的情况下使用。例如：如果在函数内部声明一个局部变量，则它无法在函数外部被访问，因此它是该函数的局部的。如果你在不使用\
  \ `var` 关键字的情况下声明同一个变量，它将对整个脚本可见，而不仅仅是在该函数内部。\n\n在 JavaScript 中，如果存在同名的全局变量，则局部变量在函数体内部具有更高的优先级。通过声明一个与全局变量同名的局部变量，你实际上在函数内部隐藏了该全局变量。\n\
  \n让我们来看一个局部变量的示例\n\n```\nvar num= 20;\n```\n\n如果你想在脚本的其他地方访问 `num` 变量的值，只需引用变量名即可。`document.write`\
  \ 函数将数据写入网页。\n\n查看下方的语法：\n\n```javascript\ndocument.write(“The value of num is:\
  \ “ +num);\n```\n\n我们将得到的结果是“The value of num is: 20”。\n\n为了在变量中存储算术表达式，我们只需要将变量赋值为计算后的值。存储在变量中的不是计算过程，而是该计算的结果。因此，我们再次得到的结果是“The\
  \ value of num is 20”。看以下示例：\n\n```javascript\nvar num = (10+10);\ndocument.write(\
  \ “ The value of num is: “+ num);\n```\n\n如果你想在脚本的其他地方访问 `num` 变量的值，只需引用变量名即可。`document.write`\
  \ 函数将数据写入网页。\n\n```javascript\ndocument.write(“The value of num is: “ +num);\n```\n\
  \n\n\n\n\n## 数组 (Arrays)\n它们与变量几乎相似，不同之处在于可以在一个名称下存储多个表达式和值，从而使其成为强大的数据类型。只要在作用范围内，数组中可以存储的数据量没有限制。只要它在脚本中已声明，就可以访问任何项的任何值以及任何给定时间点的任何值。相同类型的数据可以存储在一个单一数组中，该特定数组可以分配一个与其包含的项相关的名称。\n\
  \n让我们来看一个例子：\n\n```javascript\nvar shapes = new Array(“rectangle”, “square”, “triangle”);\n\
  var colors = new Array( “red”, “pink”, “orange”);\n```\n\n要访问数组中的任何项，你必须使用它的 ID。ID\
  \ 是该项在数组中的位置。数组的 ID 总是从 0 开始而不是 1，这在开始时可能会引起困惑，但通过练习，你会发现这个概念很容易学习。ID 按升序顺序工作；例如\
  \ 0, 1, 2, 3 等。下面是一个理解这个概念的示例——\n\n```javascript\nvar colors = new Array( “red”,\
  \ “pink”, “green”);\ndocument.write( “red: “+colors[0]);\ndocument.write( “pink:\
  \ “+colors[1]);\ndocument.write( “green: “+colors[2]);\n```\n\n在数组中，你也可以为特定位置赋值。例如：\n\
  \n```javascript\nvar colors = new Array ();\ncolors [0] = “red”;\ncolors [1] = “pink”;\n\
  colors [2] = “green”;\ndocument.write (“pink: “+colors [2]);\n// 将粉色更新为蓝色\nColors\
  \ [1] = “blue”;\ndocument.write (“blue: “+ colors [2]);\n```\n\n## 对象 (Objects)\n\
  对象用大括号编写。对象的属性写法格式为 –：\n\n- name: value 键值对，用逗号隔开\n\n对象的示例：\n\n```javascript\nVar\
  \ person = {first name: “Ryan”, last name: “Booth”, age:35, eyeColor: “brown”};\n\
  ```\n\n上面的示例有四个属性：年龄、眼色、名字和姓。\n\n## 运算符 (Operators)\n为了在 JavaScript 中执行任何操作，我们需要运算符。它们包括比较、减法、加法等许多。有四种基本运算符：\n\
  \n- 赋值 (Assignment)\n- 算术 (Arithmetic)\n- 逻辑 (Logical)\n- 比较 (Comparison)\n\n###\
  \ 算术运算符\n这些运算符执行基础数学运算，如除法、加法、乘法、减法等。\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `*` |\
  \ 乘法 |\n| `-` | 减法 |\n| `+` | 加法 |\n| `/` | 除法 |\n| `%` | 取余（模） |\n| `--` | 递减 |\n\
  | `++` | 递增 |\n\n### 赋值运算符\n用于给 JavaScript 中的变量赋值。下面列出了所有可用的赋值运算符：\n\n| 运算符 | 描述\
  \ |\n| :--- | :--- |\n| `=` | 等 |\n| `+=` | 给变量赋值加法值 |\n| `-=` | 给变量赋值减法值 |\n| `*=`\
  \ | 给变量赋值乘法值 |\n| `/=` | 给变量赋值除法值 |\n| `%=` | 给变量赋值模值 |\n\n**示例：**\n```javascript\n\
  var num =20;\ndocument.write(“The value of num is: “+num);\n// 将 num 的值更新为 30\n\
  num= (num+10);\ndocument.write( “ The new value of num is:+num);\n```\n\n### 比较运算符\n\
  这些运算符建立变量或其值之间的关系。它们被用于条件语句（我们稍后会学习这一点），通过比较变量或其值来创建逻辑。这有助于判断语句是真是假。比较运算符的类型有：\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `<` | 小于 |\n| `>` | 大于 |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n| `===` | 等于，且对象和值类型相等 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n### 逻辑运算符\n\
  它们组合比较运算符，通常用于条件语句。逻辑运算符的类型有：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `!` | 非 |\n| `&&`\
  \ | 与 |\n| `||` | 或 |\n\n## 3. 条件语句 (Conditional Statements)\n与其他编程语言一样，JavaScript\
  \ 中提供了多种条件语句。它们允许你定义一个条件，其结果决定了将执行的操作。它们允许你的程序根据条件的结果做出判断并执行相关操作。\n\n为了在编程语言中创建任何逻辑，条件语句是其基础。在\
  \ JavaScript 中，条件语句可以用四种方式编写——\n\n| 语句 | 描述 |\n| :--- | :--- |\n| Switch | 执行多个脚本中的一个\
  \ |\n| If | 如果特定条件的结果为真，则执行脚本 |\n| If..else | 此条件语句中有两个代码块。if 语句在条件为真时执行脚本，而当条件为假时执行\
  \ else 语句下的代码 |\n| If..else if..else | 如果无限条件中的某一个为真，或者所有条件都为假，则执行另一个脚本。 |\n\n`if…else`\
  \ 语句的基本语法所示。\n\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
  }\n```\n\n#### 示例：\n\n**if**\n```javascript\nif (expression) {\n    当 expression\
  \ 为真时要执行的语句(s)\n}\n```\n\n**else**\n```javascript\nif (expression) {\n    当 expression\
  \ 为真时要执行的语句(s)\n} else {\n    当 expression 为假时要执行的代码\n}\n```\n\n**if..else**\n```javascript\n\
  if (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression) {\n   \
  \ 当另一个条件为真时要执行的语句(s)\n} else {\n    当所有条件为假时要执行的代码\n}\n```\n\n**if..else if..else**\n\
  ```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n} else if (expression)\
  \ {\n    当另一个条件为真时要执行的语句(s)\n} else if (expression) {\n    当第三一个条件为真时要执行的语句(s)\n\
  } else {\n    执行的代码\n}\n```\n\n**switch**\n```javascript\nswitch (expression) {\n\
  \    case expression1:\n        当 expression 等于 expression1 时执行的语句\n        break;\n\
  \    case expression2:\n        当 expression 等于 expression2 时执行的语句\n        break;\n\
  \    default:\n        当没有一个 匹配时执行的代码\n}\n```\n\n`if…else` 语句的基本语法所示。\n\n```javascript\n\
  if (expression) {\n    当 expression 为真时要执行的语句(s)\n}\n```\n\n### 更多示例：\n\n**if**\n\
