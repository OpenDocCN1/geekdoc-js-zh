  \ expression 为假时要执行的代码\n}\n```\n\n**if..else**\n```javascript\nif (expression) {\n\
  \    当 expression 为真时要执行的语句(s)\n} else if (expression) {\n    当另一个条件为真时要执行的语句(s)\n\
  } else {\n    执行的代码\n}\n```\n\n**if..else if..else**\n```javascript\nif (expression)\
