  } else if (expression) {\n    当另一个条件为真时要执行的语句(s)\n} else {\n    执行的代码\n}\n```\n\n\
  **if..else if..else**\n```javascript\nif (expression) {\n    当 expression 为真时要执行的语句(s)\n\
  } else if (expression) {\n    当另一个条件为真时要执行的语句(s)\n} else if (expression) {\n   \
  \ 当第三一个条件为真时要执行的语句(s)\n} else {\n    执行的代码\n}\n```\n\n**switch**\n```javascript\n\
  switch (expression) {\n    case expression1:\n        当 expression 等于 expression1\
  \ 时执行的语句\n        break;\n    case expression2:\n        当 expression 等于 expression2\
  \ 时执行的语句\n        break;\n    default:\n        当没有一个 匹配时执行的代码\n}\n```\n\n\n\n\n\
  ```javascript\nvar colors = new array( “red”, “pink”, “green”);\n\nfor var (i=0;\
  \ i<colors.length; i++) {\nDocument.write( “The color is: “+ colors[i] +<br/>);\n\
  }\n```\n上面的示例展示了一个 `for` 循环，它会在数值值小于数组长度时运行。\n\n### b) while 循环\n通过 `while` 循环，可以控制循环执行的次数。换句话说，当你知道循环需要执行的次数时，就会使用这种循环。因此，你需要确保循环编写得正确，以免导致无限循环。`while`\
  \ 循环的语法如下所示。\n\n```32. While (expression) {\n33. 如果表达式为真，则执行的语句\n34. }\n```\n\n\
  #### 示例：\n```javascript\nvar i =0;\n\nwhile (i<10) {\ndocument.write(i + “<br/>”);\n\
  i++:\n}\n```\n在上面的示例脚本中，这种类型的循环包含了一行代码，在 `while` 循环的条件为假之前，该代码会重复数值值。因此，如果没有这一行，将会导致死循环。\n\
  \n### JavaScript 中的 Hello World 示例\n这里是 JavaScript 的 hello World 示例。它将说明该语言的工作原理，并让你熟悉其语法。正如你所看到的，这种语言非常简单。\n\
  \n```html\n<Html>\n<Body>\n<script language=\"javascript\" type=\"text/javascript\"\
  >\n<!--\ndocument.write (\"Hello World!\")\n//-->\n</script>\n</body>\n</html>\n\
  ```\n\n### JavaScript 语法\nJavaScript 应该通过 JavaScript 语句来实现。这些语句被放置在网页页的 `<script>`...\
  \ `</script>` HTML 标签内。`<script>` 标签可以放置在 HTML 文档的任何位置。`<script>` 标签会提醒浏览器将标签之间的文本解释为脚本。下面是一个\
  \ JavaScript 语法的示例。\n\n```html\n<script language=\"javascript\" type=\"text/javascript\"\
  >\nJavaScript 代码\n</script>\n```\n`script` 标签有两个至关重要的属性。它们如下所示。\n\n1. **Language（语言）：**\
  \ 此属性用于指定正在使用的脚本脚本语言。当然，由于你正在使用 JavaScript，因此该属性的值是 `javascript`。另一方面，对于最近版本的 HTML\
  \ 和 XHTML，此属性在如今已很少使用。\n2. **Type（类型）：** 此属性目前被用于指示脚本语言。该属性的值应设置为‘text/javascript.'。\n\
  \n#### 换行符与空白\nJavaScript 会忽略空白符。因此，你可以在脚本中自由使用换行符、制表符和空格。当然，你应该使用它们来格式化你的程序，并使其看起来一致且整洁。这使得代码易于阅读和理解。\n\
  \n#### 分号（Semicolons）\n通常情况下，分号被用于标记语句的结束。在 Java、`C++` 和 `C` 等语言中情况此类此。然而，JavaScript\
  \ 在一种情况下使得分号是可选的。你需要确保每条语句都放置在单独的一行上。只要你满足这个条件，就可以避免在代码中插入分号。然而，使用分号是一个良好的习惯，特别是当你正在学习编程时。\n\
  \n#### 大小写敏感（Case Sensitivity）\n你需要确保 JavaScript 中正确使用大小写，因为这种语言是对大小写敏感的。因此，所有的关键字、函数名、变量和其他标识符必须以正确的大小写输入。一致性至关重要。在\
  \ JavaScript 中，标识符 `hi` 和 `HI` 将具有不同的含义。\n\n### 如何在 HTML 文档中放置 JavaScript？\nJavaScript\
  \ 的优点之一是你可以灵活地在 HTML 文档的任何地方添加代码。尽管如此，遵循首选方法是一个极好的主意。这可以提高 HTML 文档中 JavaScript 代码的可读性和执行效率。以下是将\
  \ JavaScript 包含在 HTML 中的方法。\n\n1. **在 <head> 标签内部**\n此选项通常用于你希望在事件发生时运行脚本。例如，你可能希望在用户点击某处时运行脚本。在这些情况下，脚本将放置在\
  \ `<head>` 标签内部，如下例所示。\n\n```html\n35. <Html>\n36. <Head>\n37. <script type=\"text/javascript\"\
  >\n<!--\nFunction sayHello () {\nAlert (\"Hello World\")\n}\n//-->\n</script>\n\
  </head>\n<Body>\n<input type=\"button\" onclick=\"sayHello ()\" value=\"Say Hello\"\
  \ />\n</body>\n</html>\n```\n\n2. **在 <body> 标签内部**\n在某些情况下，你可能需要脚本在页面加载时运行。这样做是为了允许脚本生成页面中的内容。在这种情况下，脚本必须放置在\
  \ `<body>` 标签内部。在这种方法中，你将不会任何用 JavaScript 定义的函数。你可以看到下面提供的此类 JavaScript 包含的示例。\n\
  \n```html\n39. <Html>\n40. <Head>\n41. </head>\n42. <Body>\n43. <script type=\"\
  text/javascript\">\n<!--\ndocument.write (\"Hello World\")\n//-->\n</script>\n<p>Web\
  \ Page</p>\n</body>\n</html>\n```\n\n3. **在 <head> 和 <body> 标签内部**\n如果你愿意，可以结合这两种方法。换句话说，你可以将\
  \ JavaScript 同时放置在 `<head>` 和 `<body>` 中。查看示例了解如何工作。\n\n```html\n45. <Html>\n46.\
  \ <Head>\n47. <script type=\"text/javascript\">\n<!--\nFunction sayHello () {\n\
  Alert (\"Hello World\")\n}\n//-->\n</script>\n</head>\n<Body>\n<script type=\"text/javascript\"\
  >\n<!--\ndocument.write (\"Hello World\")\n//-->\n</script>\n<input type=\"button\"\
  \ onclick=\"sayHello ()\" value=\"Say Hello\" />\n</body>\n</html>\n```\n\n4. **在外部文件中**\n\
  在创建简单页面时，将 JavaScript 包含在 HTML 文档内部是一个好主意。但是，当你创建网站时，可能会发现自己在多处重复相同的代码。正如你在 CSS\
  \ 中看到的，你可以创建一个完全独立的文件来存放 JavaScript 代码。该文件应该具有 `.js` 扩展名，并与需要代码的网页关联。下面的示例说明了如何在\
  \ HTML 文档中包含外部 JavaScript 文件。在此示例中，`filename.js` 是包含 JavaScript 代码的文件。\n\n```html\n\
  49. <Html>\n50. <Head>\n51. <script type=\"text/javascript\" src=\"filename.js\"\
  \ ></script>\n52. </head>\n53. <Body>\n```\n\n### JavaScript 中的事件（Events）\n事件是指是导致\
  \ JavaScript 代码执行的动作。事件通常由用户触发。例如，鼠标的点击可以是一种事件。根据事件，你可以在 JavaScript 中编写响应。例如，显示消息可以是对事件的响应。这些响应可以被称为事件处理器，因为它们处理正在发生的事件。在\
  \ JavaScript 中，可以以多种方式对事件进行分类。毕竟，它们非常多。\n\n### 15. onClick 事件\n常见的事件类型是 `onClick`\
  \ 事件。每当用户左键点击网页时，该事件就会发生。针对此事件，你可以做出相应的响应，例如显示消息或进行你的验证。下面的示例说明了如何使用此类事件显示消息。\n\n\
  ```html\n57. <Html>\n58. <Head>\n```\n\n\n\n\n\n```html\n<script type=\"text/javascript\"\
  >\n59. \n60. <!--\nfunction sayHello () {\nAlert (\"Hello World\")\n}\n//-->\n</script>\n\
  </head>\n<body>\n<p>点击以下按钮并查看结果</p>\n<form>\n<input type=\"button\" onclick=\"sayHello\
  \ ()\" value=\"Say Hello\" />\n</form>\n</body>\n</html>\n```\n\n### 16. onSubmit\
  \ 事件类型\n\n此类类型的事件在提交表单时发生。可以针对此事件进行表单验证。让我们来看一个示例——\n\n如果下述示例中的 `validate()` 函数返回\
  \ `true`，则表单才会被提交；否则，表单将不会提交。\n\n```html\n<html>\n <head>\n <script type=\"text/javascript\"\
  >\n<!--\nfunction validation() {\n所有的验证逻辑都在这里\n…….\nreturn 返回 true 或 false\n}\n\
  //-->\n</script>\n</head>\n<body>\n <form method=\"post\" action=\"t.cgi\" onsubmit=\"\
  return validate()\">\n …….\n <input type=\"submit\" value=\"Submit\"/>\n</form>\n\
  </body>\n</html>\n```\n\n### 17. onmouseover 和 onmouseout\n\n此事件在图像和文本上都能产生很好的效果。当鼠标悬停在元素上时，会触发\
  \ `onmouseover` 事件；当鼠标移出时，会触发 `onmouseout`。示例：\n\n```html\n<html>\n<head>\n<script\
  \ type=\"text/javascript\">\n<!--\nfunction over () {\ndocument.write ( \"鼠标悬停\"\
  );\n}\nfunction out() {\ndocument.write ( \"鼠标移出\");\n}\n//-->\n</script>\n</head>\n\
  <body>\n <p> 将你的鼠标移入 div 内部查看结果：</p>\n <div onmouseover=\"over ()\" onmouseout=\"\
  out()\">\n <h2> 它在 div 内部 </h2>\n  </div>\n</body>\n</html>\n```\n\n## 关于使用 JavaScript\
  \ 的一些提示\n\n1. 确保 JavaScript 能够帮助用户高效、快速地实现目标。如果不能做到，说明你可能使用方法不当。\n2. 你为用户提供的 JavaScript\
  \ 解决方案应该自然地优于之前的交互。然而，解决方案不应过于差异，以至于用户无法根据之前的经验与之联系。目标是确保终端用户对解决方案感到满意。\n3. 如果你正在处理敏感数据，不要依赖\
  \ JavaScript，因为所有代码都易于读取。此外，用户可能会在浏览器中关闭 JavaScript。\n\n我们可以说，这种简单而丰富的脚本语言有许多可能性。JavaScript\
  \ 提供了工具，允许终端用户在网页下载后与其交互。在本章中我们学习了 JavaScript 的基础知识，现在让我们来看看一些关于这种编程语言的常见问题。\n\n\
  ### 常见\n\n### JavaScript 和 Java 一样吗？\n答：不是，它们是不同的编程语言。Java 是一种通用编程语言，而 JavaScript\
  \ 用于使网站更具交互性。\n\n### 哪些浏览器支持 JavaScript？\n答：大多数浏览器都支持 JavaScript。如下：\n* Microsoft\
  \ Internet explorer 3.0 及以上版本\n* Netscape Navigator 2.0 及以上版本\n* Safari\n* Firefox\n\
  * Google Chrome\n* Opera\n\n### 如何在 JavaScript 中添加注释？\n答：JavaScript 支持三种类型的注释：\n\
  a) 多行 C 风格注释，写在 `/*` 和 `*/` 之间的所有内容都是注释。\nb) C++ 风格的单行注释。此类类型的注释以 `//` 开始，一直持续到下一行结束符。\n\
  c) HTML 风格注释以 `<!--` 开始。\n\n### 当用户无法执行 JavaScript 代码时，可以向用户显示警告吗？\n答：可以，可以向用户显示不支持\
  \ JavaScript 的浏览器的警告。警告文本可以放在 `<NOSCRIPT>` 和 `</NOSCRIPT>` 标签之间。\n\n因此，启用了 JavaScript\
  \ 的浏览器将忽略这些标签之间的所有内容，而无法执行的浏览器将在页面上显示你的消息。该消息将显示给禁用了 JavaScript 的用户，也会显示给那些浏览器不支持\
  \ JavaScript 的用户。\n\n### 可以删除 JavaScript 变量吗？\n答：你并不总是可以删除 JavaScript 变量，这取决于以下条件：\n\
  a) 如果 JavaScript 变量第一次是使用关键字 `var x;` 声明的，则无法删除。但作为通变方法，可以将变量设置为 `null` 或 `undefined`。但这并不等同于删除变量。\n\
  b) 如果变量 `x` 首次在脚本中出现且没有任何声明，则可以使用 `delete` 操作符，即 `delete x`。\n\n### JavaScript 程序不能做什么？\n\
  答：JavaScript 代码无法实现以下操作：\na) 无法在客户端局域网 (LAN) 或用户系统上使用打印机或其他设备。\nb) 无法直接访问用户系统或客户端局域网上的文件。唯一的例外是\
  \ cookie 文件。\nc) 无法实现多线程或多进程。\n\n### 删除数组元素的方法是什么？\n答：在 JavaScript 中删除数组元素有两种不同的方法，分别是：\n\
  a) `myArray.splice(n,1)`。这种方法较慢，但不会在数组中留下空隙。\nb) `delete myArray[n]`。这种方法更快，但会在索引\
  \ `n` 处留下空隙。\n\n#### 有没有方法判断用户点击的是右键还是左键？可以使用 `onclick` 事件处理器吗？\n答：对于左键，会触发点击事件。然而，取决于浏览器，右键点击可能发生也可能不发生。特别是在\
  \ Microsoft Internet Explorer 中，右键点击事件无效。因此，`onclick` 事件处理器不是测试左右鼠标键的可靠方法。相反，我们应该使用\
  \ `mousedown` 事件。大多数浏览器支持任何鼠标键的 `mouseup` 和 `mousedown` 事件。\n\n### JavaScript 可以使用哪些数字格式？\n\
  答：JavaScript 代码可以使用多种方式编写数学常量和数字面量，例如：\na) 指数形式的十进制数字，例如 `5.57e-11`\nb) 常规十进制数字，例如\
  \ `5`、`7`、`137`、`1.3` 等。\nc) 八进制数，例如 `-055`、`01234`、`0212`\nd) 以零开头的正八进制数。\ne) 十六进制，例如\
  \ `0xFF`、`-0xCFFF`。正十六进制以 `0x` 开头，负十六进制以 `-0x` 开始。\nf) 预定义的数学常量，例如 `Math.PI` //pi\
  \ = 3.14159\n\n### 如何测试特定变量持有字符串还是数字？\n答：测试变量持有字符串还是数字的方法是使用 `typeof` 操作符。如果变量持有字符串，`typeof(variable)`\
  \ 将返回“string”，如果它持有数字，则将返回“number”。\n\n\n\n\n\n这三种语言是交织在一起的：`HTML` 提供了网站的基本结构，而\
  \ `JavaScript` 和 `CSS` 对其进行了增强和修改。`CSS` 告诉 `HTML` 应该使用什么颜色、字体和其他样式，而 `JavaScript`\
  \ 则告诉 `HTML` 如何执行某些任务，例如弹出窗口等。\n\n在学习 Web 开发时，需要记住最重要的两点是：\n\na) 使用正确的 `HTML` 标签\
  \ – 内容结构由不同的 `HTML` 标签来描述，每个标签都有其特定的含义和定义的位置。\n\nb) 保持你的 `JavaScript`、`HTML` 和 `CSS`\
  \ 代码分离 - 始终将 `JavaScript` 和 `CSS` 放在 `HTML` 文件之外的单独文件中。这将使你的工作变得简单，并且你能够更好地进行管理。因此，将所有的样式和功能性代码放在一个地方会让事情变得简单。\n\
  \n## 结论\n\n现在，这本关于 `HTML`、`CSS` 和 `JavaScript` 编程的书籍已经结束了。所有这些编程语言本身都是非常庞大的。然而，由于它们简单易用，你在掌握它们时应该不会遇到太大问题。只要努力努力并花一点时间，你就能很快创建出功能完备的网站。\n\
  \n当然，这本书应该让你在所有三种语言上打下了良好的基础。你应该已经看过“Hello World”示例，并注意到它们是多么简单。因此，你在每种语言的基础语法上应该不应该有任何问题。\n\
  \n你已经接触过这些语言中常用的基本函数、语句和标签。更重要的是，在你自己创建的网页中使用它们时，你应该不再会有任何任何问题了。\n\n在 `HTML` 中，你了解了如何编写一个简单的网页并填充内容。然后，通过\
  \ `CSS`，你已经能够对该网页进行样式化并使其看起来具有力。最后，`JavaScript` 让你能够让网页更具交互性。因此，你的网页现在看起来和感觉起来应该非常像你以前在互联网上仰慕的那些网页。\n\
  \n随着本书的结束，我祝你未来的编程之路一切顺利。这是一项令人兴奋的活动，从长远来看，对你的职业非常有帮助。\n\n## 想学习更多编程知识吗？\n\n查看 Joseph\
