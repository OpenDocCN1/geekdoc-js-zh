    **Install BuildWise Server**


    1. **Install Ruby**


    BuildWise requires Ruby to run. I recommend to download and install RubyShell³,


    a packaged installer of standard Ruby for Windows and all required libraries (called


    Gems in Ruby) for BuildWise.


    2. **Install BuildWise Server**


    Download and run BuildWise standalone Windows installer (BuildWiseStandalone-X-


    setup.exe) from TestWisely⁴. For Unix/Mac users, there is also a buildwise-X.zip.
    There


    will be a few more steps required for setting up Git, Ruby and Gems, though it
    is quite


    easy to find tutorials for these general knowledge online.


    3. **Start up BuildWise Server**


    Double click **startup.bat** under folder *C:\agileway\buildwise-standalone*,
    then open


    *http://localhost:3618* in your browser.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_173_0.png)


    4. **Login**


    The default login/password: *admin*/*buildwise*.


    ³http://testwisely.com/testwise/downloads


    ⁴http://testwisely.com/buildwise/downloads'
