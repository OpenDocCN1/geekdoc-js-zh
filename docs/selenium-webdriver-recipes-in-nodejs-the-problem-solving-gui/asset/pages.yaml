    **24.3 Selenium Grid**


    Selenium Grid allows you to run Selenium tests in parallel to cut down the execution
    time.


    Selenium Grid includes one hub and many nodes.


    1. **Start the Hub**


    The hub receives the test requests and distributes them to the nodes.


    java -jar selenium-server-standalone-2.53.1.jar -role hub


    2. **Start the nodes**


    A node gets tests from the hub and run them.


    java -jar selenium-server-standalone-2.53.1.jar -role node


    \


    -hub http://localhost:4444/grid/register


    If you starts a node on another machine, replace *localhost* with the hub’s IP
    address.


    3. **Using grid to run tests**


    You need to change the test script to point to the driver to the hub.


    driver = **new** webdriver.Builder()


    .usingServer(''http://localhost:4444/wd/hub'')


    .forBrowser(''chrome'')


    .build();


    The test will run on one of the nodes. Please note that the timing and test case
    counts


    (from RSpec) returned is apparently not right.


    Frankly, I haven’t yet met anyone who is able to show me a working selenium-grid
    running


    a fair number of UI selenium tests.


    Here are my concerns with Selenium Grid:


    • **Complexity**


    For every selenium grid node, you need to configure the node either by specifying


    command line parameters or a JSON file. Check out the Grid Wiki page² for details.


    It is my understanding that just pushing the tests to the hub, and it handles
    the rest


    based on the configuration. My experience tells me that it is too good to be true.
    For


    example, here is an error I got. While the error message is quite clear: no ChromeDriver


    installed. But on which node? Shouldn’t the hub ‘know’ about that?


    ²https://code.google.com/p/selenium/wiki/Grid2'
