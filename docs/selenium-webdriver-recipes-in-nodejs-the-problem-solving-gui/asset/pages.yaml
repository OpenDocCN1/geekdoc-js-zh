  md: '**2\. Locating web elements**


    As you might have already figured out, to drive an element in a page, we need
    to find it first.


    Selenium WebDriver uses what is called locators to find and match the elements
    on web


    page. There are 8 locators in Selenium WebDriver:


    **Locator**


    **Example**


    ID


    findElement(By.id("user"))


    Name


    findElement(By.name("username"))


    Link Text


    findElement(By.linkText("Login"))


    Partial Link Text


    findElement(By.partialLinkText("Next"))


    XPath


    findElement(By.xpath("//div[@id=''login'']/input"))


    Tag Name


    findElement(By.tagName("body"))


    Class Name


    findElement(By.className("table"))


    CSS


    findElement(By.css, "#login > input[type=''text'']"))


    You may use any one of them to narrow down the element you are looking for.


    **2.1 Start browser**


    Testing web sites starts with a browser. The test script below launches a Chrome
    browser


    window and navigate to a site.


    **var** webdriver = require(''selenium-webdriver'');


    **var** driver = **new** webdriver.Builder()


    .forBrowser(''chrome'')


    .build();


    driver.get("http://testwisely.com/demo")


    Use firefox and ie for testing in Firefox and IE respectively.


    **Test Pages**


    I prepared the test pages for the recipes, you can download it at the book’s site**.
    Unzip it


    to a local directory and refer to test pages like this:'
