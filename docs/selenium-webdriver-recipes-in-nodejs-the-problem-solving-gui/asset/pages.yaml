  md: '**Appendix - Continuous Testing**


    This book shows recipes on solving individual test scenarios with Selenium WebDriver.


    Ideally, we run all the test scripts to verify every new build as regression testing.
    However,


    when total execution time of all tests exceeds one hour, it is becoming impractical
    to run


    them often on testers’ machines. The solution is to execute tests on a Continuous
    Testing


    server with following benefits:


    • Easier to run


    • View test reports and error screenshots


    • Test history


    • Less interruption


    Continuous testing is a big topic, here I will just cover a bare minimum to show
    you one


    approach to run a suite of Selenium (in JavaScript) test scripts with a click
    of a button.


    **Verify server machine can run Selenium Mocha**


    Before we start running Selenium python tests in BuildWise server, it is a good
    idea to make


    sure we can run selenium tests from command line on this build server machine.


    1\. Install Node.js


    Standard installation, see Chapter 1 for more.


    2\. Install Mocha, Selenium and required test modules


    > npm install -g mocha


    > npm install -g mocha-junit-reporter


    > npm install -g selenium-webdriver@3.6.0


    > npm install -g faker


    3\. Verify that you can run Selenium Mocha tests on the build server machine.


    In the exercise, we will use a sample Git repository on GitHub². The folder containing


    Selenium Python test scripts is selenium-webdriver-nodejs-mocha.


    Start a new command window (Terminal on Mac/Linux) and run the following


    commands to verify test execution.


    ²https://github.com/testwisely/agiletravel-ui-tests'
  merge: -1
  pgno: 172
