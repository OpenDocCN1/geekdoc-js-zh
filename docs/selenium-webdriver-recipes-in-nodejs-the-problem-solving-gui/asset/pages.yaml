    **24.2 Execute tests in specified browser on another**


    **machine**


    Perquisite:


    • Make sure the Selenium Server is up and running.


    • You can connect to the server via HTTP.


    • Note down the server machine’s IP address.


    To change existing local Selenium tests (running on a local browser) to remote
    Selenium


    tests (running on a remote browser) is very easy, just update the initalization
    of WebDriver


    instance to usingServer like below:


    test.it("Remote control Firefox on another machine", **function**() {


    **this**.timeout(timeOut);


    driver = **new** webdriver.Builder()


    .usingServer(''http://localhost:4444/wd/hub'')


    .forBrowser(''firefox'')


    .build();


    driver.get("http://travel.agileway.net")


    driver.findElement(webdriver.By.name(''username'')).sendKeys(''agileway'');


    driver.findElement(webdriver.By.name(''password'')).sendKeys(''testwise'');


    driver.findElement(webdriver.By.name(''commit'')).click();


    driver.quit();


    });


    The test scripts (client) is expected to terminate each browser session properly,
    calling


    driver.quit.'
