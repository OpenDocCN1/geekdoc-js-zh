  md: '**20\. Leverage Programming**


    The reason that Selenium WebDriver quickly overtakes other commercial testing
    tools


    (typically promoting record-n-playback), in my opinion, is embracing the programming,


    which offers the flexibility needed for maintainable automated test scripts.


    In the chapter, I will show some examples that use some programming practices
    to help our


    testing needs.


    **20.1 Raise exceptions to fail test**


    While assert provides most of assertions needed, raising exceptions can be useful
    too as


    shown below.


    **if** (process.platform != "darwin" && process.platform != "linux") {


    **throw**("Unsupported platform: " + process.platform);


    }


    In test output (when running on Windows):


    Error: done() invoked **with** non-Error: Unsupported platform: win32


    An exception means an anomalous or exceptional condition occurred. The code to
    handle


    exceptions is called exception handling, an important concept in programming.
    If an


    exception is not handled, the program execution will terminate with the exception
    displayed.


    Here is a standard way of handing exceptions in JavaScript.'
