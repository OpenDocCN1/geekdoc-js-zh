    the browser.


    **1.6 Cross browser testing**


    The biggest advantage of Selenium over other web test frameworks, in my opinion,
    is that it


    supports all major web browsers: Firefox, Chrome and Internet Explorer/Edge. The
    browser


    market nowadays is more diversified (based on the StatsCounter⁵, the usage share
    in June


    2020 for Chrome, Firefox, Safari, IE/Edge and are 69.4%, 8.5%, 8.7% and 8.7% respectively).
    It


    is logical that all external facing web sites require serious cross-browser testing.
    Selenium


    is a natural choice for this purpose, as it far exceeds other commercial tools
    and free test


    frameworks.


    **Chrome**


    To run Selenium tests in Google Chrome, besides the Chrome browser itself, *ChromeDriver*


    needs to be installed.


    Installing ChromeDriver is easy: go to http://chromedriver.storage.googleapis.com/index.html⁶


    ⁵http://en.wikipedia.org/wiki/Usage_share_of_web_browsers


    ⁶http://chromedriver.storage.googleapis.com/index.html'
