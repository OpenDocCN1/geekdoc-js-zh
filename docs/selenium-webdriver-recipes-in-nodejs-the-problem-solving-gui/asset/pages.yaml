    **1.4 Install Selenium WebDriver**


    By default, Node.js scripts load dependent (npm) packages installed locally, i.e,
    the packages


    are installed under the directory where the scripts located.


    > cd YOUR_SCRIPT_DIRECTORY


    > npm install selenium-webdriver@3.6.0


    When it is done, you will see output like below:


    + selenium-webdriver@3.6.0


    At the time of writing, the latest release of Selenium WebDriver for JavaScript
    is 4.0.0-


    alpha.7, which is a pre-release version (and I found some issues with it). For
    some unknown


    reason, npm install selenium-webdriver will install 4.0.0-alpha.7 s a stable version.
    So


    here I use the syntax for installing a specific version of a npm module.


    This will create the **node_modules** directory in your current directory, and
    the packages


    will be installed into that directory.


    If you run into issues on npm package installation, refer NPM doc⁴.


    ⁴https://docs.npmjs.com/getting-started/installing-npm-packages-locally'
