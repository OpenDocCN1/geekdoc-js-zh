    AJAX (an acronym for Asynchronous JavaScript and XML) is widely used in web sites


    nowadays (Gmail uses AJAX a lot). Let’s look at an example first:


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_76_0.png)


    On clicking ‘Transfer’ button, an animated loading image showed up indicating
    ‘transfer in


