  md: '**Afterword**


    First of all, if you haven’t downloaded the recipe test scripts from the book
    site, I strongly


    recommend you to do so. It is free for readers who have purchased the ebook through


    Leanpub.


    This book comes with two formats: *Ebook* and *Paper book*. I originally thought
    there won’t


    be much demand for printed book, as the convenient ‘search ability’ of ebooks
    is good for this


    kind of solution books. However, during on-site consultation, I found some testers
    I worked


    with kept borrowing my printed proof-copy and wanted to buy it. It’s why I released
    the


    paper book on Amazon as well.


    **Practice makes perfect**


    • **Write tests**


    Many testers would like to practise test automation with Selenium WebDriver, but


    they don’t have a good target application to write tests against. Here I make
    one of my


    applications available for you: WhenWise sandbox site⁶. WhenWise is a modern web


    application using popular web technologies such as AJAX and Material Design. I
    have


    written 500 Selenium WebDriver tests for WhenWise. Execution of all tests takes
    more


    than 5 hours on a single machine. If you like, you can certainly practise writing
    tests


    against WhenWise sandbox server.


    WhenWise is also a show case of web applications designed (based on the popular


    Material Design) for testing, which means it is easier to write automated tests
    against


    it. Our every Selenium test starts with calling a database reset:


    visit *https://whenwise.agileway.net/reset*, which will reset the database to
    a seeded


    state.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_179_0.png)


    ⁶https://whenwise.agileway.net'
