    **22.4 “unexpected tag name ‘input’”**


    This is because there is another control matching your findElement and it is a
    different


    control type (input tag). For example,


    <**input** type="checkbox" name="vip" value="on"> VIP?


    <!-- ... -->


    <**select** name="vip">


    <**option** value="true">Yes</**option**>


    <**option** value="false">No/option>


    </**select**>


    The intention of the test script below’s intention is to select ‘Yes’ in the dropdown
    list, but


    not aware of there is another checkbox control sharing exactly the same name attribute.


    driver.get("file://" + __dirname + "/../../site/gotchas.html");


    **var** selElem = driver.findElement(By.name("vip"));


    selElem.findElement(By.css("option:nth-child(2)")).click();


    The above script will return error reporting “Unable to locate element: {“method”:”css
    se-


    lector”,”selector”:”option:nth-child(2)”}”. In other langugage bindings, calling
    Select specific


    operation selectByVisibleText will get this error.'
