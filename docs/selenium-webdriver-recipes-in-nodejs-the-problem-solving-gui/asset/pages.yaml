    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_76_1.png)


    After the server processing the request, the loading image is gone and a receipt
    number is


    displayed.


    From testing perspective, a test step (like clicking ‘Transfer’ button) is completed
    immedi-


    ately. However the updates to parts of a web page may happen after unknown delay,
    which


