    (java.lang.IllegalStateException) (Selenium::WebDriver::Error::UnknownError)


    • **Very limited control**


    Selenium-Grid comes with a web accessible console, in my view, very basic one.
    For


    instance, I created 2 nodes: one on Mac; the other on Windows 7 (the console displayed


    as ‘VISTA’).


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_160_0.png)


    An IE icon for for Mac node? This does not seem right.


    • **Lack of feedback**


    UI tests take time to execute, more tests means longer execution time. Selenium
    Grid’s


    distribution model is to reduce that. Apart from the raw execution time, there
    is also


    the feedback time. The team would like to see the test results as soon as a test
    execution


    finishes on one node. Even better, when we pass the whole test suite to the hub,
    it will


    ‘intelligently’ run new or last failed tests first. Selenium Grid, in my view,
    falls short


    on this.


    • **Lack of rerun**


    In a perfect world, all tests execute as expected every single time. But in reality,
    there


    are so many factors that could affect the test execution:


    **–** test statements didn’t wait long enough for AJAX requests to complete (server
    on


    load)


    **–** browser crashes (it happens)'
