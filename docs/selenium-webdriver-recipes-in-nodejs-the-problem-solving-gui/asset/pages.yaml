    **1.8 Create package.json file**


    A **package.json** file contains metadata about your Node.js app (in our case,
    test project),


    usually in the project root. It includes the list of module dependencies to install
    from npm.


    While it is not mandatory, it is a good idea to have it so that it will be easy
    to install or update


    the project’s dependent modules (just run npm install) . If you are familiar with
    Ruby, it


    is similar to a Gemfile.


    To create *package.json*, run the command below in the test project’s root folder.


    > npm init


    Follow the prompt and answer the questions, the answers will be saved in *package.json*
    file


    in the folder. Then install two modules: *selenium-webdriver* and *mocha*. You
    might have


    noticed the difference from the previous npm install commands: using --save instead
    of


    -g. This tell npm to install modules locally and update the *package.json* file.


    > npm install --save selenium-webdriver@3.6.0


    > npm install --save mocha


    After installation, you will see folder **node_modules** (locally installed modules)
    and the


    following content in the *package.json* file.'
