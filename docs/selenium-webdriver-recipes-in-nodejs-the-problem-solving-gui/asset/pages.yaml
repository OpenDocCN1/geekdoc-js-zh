    20


    **2.7 Find element by Tag Name**


    There are a limited set of tag names in HTML. In other words, many elements share
    the same


    tag names on a web page. We normally don’t use the tagName locator by itself to
    locate an


    element. We often use it with others in a chained locators (see the section below).
    However,


    there is an exception.


    driver.findElement(By.tagName("body")).getText();


    The above test statement returns the text view of a web page, this is a very useful
    one as


    Selenium WebDriver does not have built-in method return the text of a web page.
    However,


    unique this JavaScript binding, we cannot use this way directly. For example,
    the script below


    prints out the body’s text.


    **var** pageText = driver.findElement(By.tagName("body")).getText();


    console.log(pageText);


    The output is a ManagedPromise.


    ManagedPromise {


    flow_:


    ControlFlow {


    propagateUnhandledRejections_: **true**,


    ...


    }


    **What is a Promise?**


    A Promise is “an object that represents a value, or the eventual computation of
    a value”.


    Essentially, a promise is a result of async operation that is not resolved yet.
    If you are not


    familiar with JavaScript, it can be quite confusing. Good news is that, for the
    context of


    Selenium WebDriver, you will soon find out the pattern when there is need to resolve
    a


    promise.


    To resolve a promise, use .then(function(returnedValue)){ ... }.'
