  md: 'Testing AJAX


    65


    There are 2 common ways to test AJAX operations: waiting enough time or checking
    the


    web page periodically for a maximum given time.


    **12.1 Wait within a time frame**


    After triggering an AJAX operation (clicking a link or button, for example), we
    can set a


    timer in our test script to wait for all the asynchronous updates to occur before
    executing


    next step.


    test.it("Wait enough long time (using sleep)", **function**() {


    **this**.timeout(15000);


    // ..


