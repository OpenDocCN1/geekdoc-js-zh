  md: 'Selenium Remote Control Server


    149


    **–** node runs out of disk space


    **–** virus scanning process started in background


    **–** windows self-installed an update


    **–** …


    In this case, re-assign failed tests to anther node could save a potential good
    build.


    My point is: I could quickly put together a demo with Selenium Grid running tests
    on


    different nodes (with different browsers), and the audience might be quite impressed.


    However, in reality, when you have a large number of UI test suites, the game
    is totally


    different. The whole process needs to be simple, stable, flexible and very importantly,
    being


    able to provide feedback quickly. In the true spirit of Agile, if there are tests
    failing, no code


    shall be allowed to check in. Now we are talking about the pressure …


    How to achieve distributed test execution over multiple browsers? First of all,
    distributed


    test execution and cross browser testing are two different things. Distributed
    test execution


    speeds up test execution (could be just against single type of browser); while
    cross-browser


    testing is to verify the application’s ability to work on a range of browsers.
    Yes, distributed


    test execution can be used to test against different browsers. But do get distributed
    test


    execution done solidly before worrying about the cross browser testing.


    I firmly believe the UI test execution with feedback shall be a part of continuous
    integration


    (CI) process, just like running xUnit tests and the report shown on the CI server.
    It is OK for


    developers/testers to develop selenium tests in an IDE, in which they run one
    or a handful


    tests often. However, executing a large number of UI tests, which is time consuming,
    shall


    be done in the CI server.


    The purpose of a prefect CI process: building the application to pass all tests,
    to be ready to


    production release. Distributed execution of UI tests with quick feedback, in
    my opinion, is


    an important feature of a CI Server. However, most CI servers in the market do
    not support


    this feature. You can find more information on this topic in my other book *Practical
    Web*


    *Test Automation*³.


    ³https://leanpub.com/practical-web-test-automation'
