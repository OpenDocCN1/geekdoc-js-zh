    **16.11 Test responsive web pages**


    Modern websites embrace responsive design to fit in different screen resolutions
    on various


    devices, such as iPad and smartphones. Bootstrap is a very popular responsive
    framework.


    How to verify your web site’s responsiveness is a big question, it depends what
    you want to


    test. A quick answer is to use WebDriver’s driver.manage().window().setSize()
    to set


    your browser to a target resolution, and then execute tests.


    The example below verify a text box’s width changes when switching from a desktop


    computer to a iPad, basically, whether responsive is enabled or not..


    **var** driver = **new** webdriver.Builder().forBrowser(''chrome'').build();


    driver.get("https://agileway.net")


    // Desktop


    **var** width_desktop;


    driver.manage().window().setSize(1200, 800).then(**function**() {


    driver.findElement(By.name("email")).getSize().then(**function**(elemSize) {


    width_desktop = elemSize.width;


    });


    });


    // iPad


    **var** width_ipad;


    driver.manage().window().setSize(768, 1024).then(**function**() {


    driver.findElement(By.name("email")).getSize().then(**function**(elemSize) {


    width_ipad = elemSize.width;


    assert(width_desktop


    < width_ipad); // 1050 vs 358


    });


    });'
