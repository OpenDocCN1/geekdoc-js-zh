  md: '**9\. Navigation and Browser**


    Driving common web controls were covered from chapters 2 to 7\. In this chapter,
    I will show


    how to manage browser windows and page navigation in them.


    **9.1 Go to a URL**


    driver.get("http://testwisely.com");


    **9.2 Visit pages within a site**


    driver.get() takes a full URL. Most of time, testers test against a single site
    and specifying


    a full URL (such as http://…) is not necessary. We can create a reusable function
    to simplify


    its usage.


    **var** site_root_url = "http://test.testwisely.com";


    // ...


    **function** visit(path) {


    driver.get(site_root_url + path);


    }


    // ...


    test.it("Go to page within the site using function", **function**() {


    visit("/demo");


    visit("/demo/survey");


    visit("/"); // home page


    });


    Apart from being more readable, there is another benefit with this approach. If
    you want


    to run the same test against at a different server (the same application deployed
    on another


    machine), we only need to make one change: the value of site_root_url.'
