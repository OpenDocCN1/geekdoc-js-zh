  md: 'Introduction


    11


    I use Mocha in this book. You are free to choose any JavaScript test framework,
    Selenium


    WebDriver techniques are applicable regardless of syntax frameworks. Here is a
    Mocha test


    script for user login:


    **var** webdriver = require(''selenium-webdriver'');


    **var** test = require(''selenium-webdriver/testing''); // add ''test.'' wrapper


    **var** driver = **new** webdriver.Builder()


    .forBrowser(''chrome'')


    .build();


    **var** assert = require(''assert'');


    test.describe(''User Authentication'', **function** () {


    test.it(''User can sign in'', **function** () {


    driver.get(''http://travel.agileway.net'');


    driver.findElement(webdriver.By.name(''username'')).sendKeys(''agileway'');


    driver.findElement(webdriver.By.name(''password'')).sendKeys(''testwise'');


    driver.findElement(webdriver.By.name(''commit'')).click();


    driver.getTitle().then( **function**(the_title){


    assert.equal("Agile Travel", the_title);


    });


    });


    });


    The keywords describe and it define the structure of a Mocha test script. I used
    test.describe


    and test.it here, provided with selenium-webdriver/testing module, which transpar-


    ently waits for the promise to resolve before resuming the function.


    • **test.describe**


    Description of a collection of related test cases.


    • **test.it**


    Individual test case.


    I use Node.js’ assert module¹⁵ here to perform checks: assert.equal(...).


    **Mocha hooks**


    If you worked with xUnit before, you must have known setUp() and tearDown() fixtures


    that are run before or after every test. Mocha provides similar hooks before(),
    after(),


    ¹⁵https://nodejs.org/api/assert.html'
