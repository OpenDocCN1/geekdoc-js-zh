    **15.9 Retrieve data from Database**


    The ultimate way to obtain accurate test data is to get from the database. For
    many projects,


    this might not be possible. For ones do, this provides the ultimate flexibility
    in terms of


    getting test data.


    The test script example below is to enter the oldest (by age) user’s login into
    the text field


    on a web page. To get this oldest user in the system, I use SQL to query a SQlite3
    database


    directly (it will be different for yours, but the concept is the same) using sqlite3
    module⁵.


