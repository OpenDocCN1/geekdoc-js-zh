  md: 'Gotchas


    141


    UnexpectedTagNameException: Element should have been "select" but was "input"


    The reason: there are two controls with the same “name” attribute “vip”. By.name("vip")
    re-


    turns the first matching control, i.e., the text field. The solution is quite
    obvious after knowing


    the cause: change the locator to be more specific By.xpath("//select[@name=''vip'']").


    A quite common scenario is as below: a hidden element and a checkbox element share
    the


    same ID and NAME attributes.


    <**input** type="hidden" name="vip" value="false"/>


    <!-- ... -->


    <**input** type="checkbox" name="vip" value="on"> VIP?


    In this case, there might be no error thrown. However, this can be more subtle,
    as the


    operation is applied to a different control.


    **22.5 Element is not clickable or not visible**


    Some controls such as text fields, even when they are not visible in the current
    browser


    window, Selenium WebDriver will move the focus to them. Some other controls such
    as


    buttons, may be not. In that case, though the element is found by findElement,
    it is not


    clickable.


    The solution is to make the target control visible in browser.


    1\. Scroll the window to make the control visible


    Find out the control’s position and scroll to it.


    elem = driver.findElement(By.name("submit_action_2"));


    elemPos = elem.getLocation().y


    driver.executeScript("window.scroll(0, " + elemPos + ");"); // scroll


    Or scroll to the top / bottom of page.


    driver.executeScript("window.scrollTo(0, document.body.scrollHeight);");


    2\. A hack, call sendKeys to a text field nearby, if there is one.'
