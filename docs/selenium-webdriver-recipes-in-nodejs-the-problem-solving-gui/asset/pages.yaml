    **2.6 Find element by XPath**


    XPath, the XML Path Language, is a query language for selecting nodes from an
    XML


    document. When a browser renders a web page, it parses it into a DOM tree or similar.


    XPath can be used to refer a certain node in the DOM tree. If this sounds too
    technical for


    you, don’t worry, just remember XPath is the most powerful way to find a specific
    web


    control.


    // clicking the checkbox under ''div2'' container


    driver.findElement(By.xpath("//*[@id=''div2'']/input[@type=''checkbox'']")).click();


    Some testers feel intimidated by the complexity of XPath. However, in practice,
    there is only


    limited scope of XPath to master for testers.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_0.png)


    **Avoid using copied XPath from Browser’s Devel-**


    **oper Tool**


    Browser’s Developer Tool (right click to select ‘Inspect element’ to show) is
    very


    useful for identifying a web element in web page. You may get the XPath of a web


    element there, as shown below (in Chrome):


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_1.png)


    The copied XPath for the second “Click here” link in the example:


    //*[@id="container"]/div[3]/div[2]/a


    It works. However, I do not recommend this approach as the test script is


    fragile. If developer adds another div under <div id=''container''>, the copied


    XPath is no longer correct for the element while //div[contains(text(),


    "Second")]/a[text()="Click here"] still works.


    In summary, XPath is a very powerful way to locating web elements when id,


    name or linkText are not applicable. Try to use a XPath expression that is less


    vulnerable to structure changes around the web element.'
