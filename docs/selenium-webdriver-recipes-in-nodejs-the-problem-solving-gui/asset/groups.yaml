  - '[PAGE 85]


    **14\. Debugging Test Scripts**


    Debugging usually means analyzing and removing bugs in the code. In the context
    of


    automated functional testing, debugging is to find out why a test step did not
    execute as


    expected and fix it.


    **14.1 Print text for debugging**


    driver.get("file://" + __dirname + "/../../site/assert.html");


    driver.getTitle().then(**function**(page_title){


    console.log("Now on page: " + page_title);


    });


    driver.findElement(By.id("app_id")).getText().then(**function**(appNo){


    console.log("Application number is " + appNo);


    });


    Here is the output from executing the above test from command line:


    Now on page: Assertion Test Page


    Application number is 1234


    For complex object, its output in default string format might not be meaningful.
    We can


    convert dump it in JSON format:


    console.log(JSON.stringify(complexObject))


    When the test is executed in a Continuous Integration server, output is normally
    captured


    and shown. This can be quite helpful on debugging test execution.


    **14.2 Write page source or element HTML into a file**


    When the text you want to inspect is large (such as the page source), printing
    out the text to


    a console will not be helpful (too much text). A better approach is to write the
    output to a


    temporary file and inspect it later. It is often a better way to write to a temporary
    file, and


    use some other tool to inspect later.'
