    **16.8 Headless browser testing with PhantomJS**


    A headless browser is a web browser without a graphical user interface. The main
    benefit of


    headless browser testing is performance. PhantomJS³ is a headless browser that
    built on top


    of WebKit, the engine behind both Safari and Chrome. First of all, you need to
    download


    phantomjs.exe and put it in PATH.


    driver = **new** webdriver.Builder().forBrowser(''phantomjs'').build();


    driver.get("http://travel.agileway.net")


    driver.getTitle().then(**function**(the_title){


    assert.equal("Agile Travel", the_title)


    });


    driver.quit


    If your target application is relatively stable and not using JavaScript heavily,
    and you want


    gain test faster execution time, PhantomJS is a viable option.


    **Be aware of headless browser simulation in test au-**


    **tomation**


    Frankly, I am not big fan of headless testing with browser simulation for the
    reasons below:


    • It is NOT a real browser.


    • I need inspect the web page when a test failed, I cannot do that with PhantomJS.
    In


    test automation, as we know, we perform this all the time.


    • To achieve faster execution time, I prefer distributing tests to multiple build
    agents to


    rum them in parallel as a part of Continuous Testing process. That way, I get
    not only


    much faster execution time (throwing in more machines), also get useful features


    ³http://phantomjs.org/'
- md: "\nBrowser Profile and Capabilities\n\nsuch as quick feedback, rerunning failed\
    \ tests on another build agent, dynamic execution ordering by priority, etc. All\
    \ in real browsers.\n\nUpdate [April 13, 2017]: PhantomJS’ maintainer stepped\
    \ down*, the future of PhantomJS is in doubt.\n\n*https://groups.google.com/forum/m/#!topic/phantomjs/9aI5d-LDuNE\n\
    \n## 16.9 Headless Chrome\n\nChrome 59 (released on June 5, 2017) introduces headless\
    \ mode, which can be used with Selenium WebDriver. Here is how:\n\n```javascript\n\
    var chrome = require('selenium-webdriver/chrome');\nvar chromeOptions = new chrome.Options();\n\
    chromeOptions.addArguments(\"headless\");\nvar driver = new webdriver.Builder().forBrowser('chrome')\n\
    .setChromeOptions(chromeOptions)\n.build();\ndriver.get(\"http://travel.agileway.net\"\
    )\ndriver.getTitle().then(function(the_title){\n  assert.equal(\"Agile Travel\"\
    , the_title)\n});\n```\n\nPlease note that, at the time of writing, Headless mode\
    \ is available on Mac and Linux in Chrome 59, but Windows support⁴ will be available\
    \ soon.\n\n⁴https://bugs.chromium.org/p/chromium/issues/detail?id=686608\n\n##\
    \ 16.10 Headless Firefox\n\nHeadless is also supported in Firefox from version\
    \ 56, works the same way as Chrome. Please note the syntax has been changed several\
    \ times, the latest one is options.headless!.\n\n```javascript\nvar firefox =\
    \ require('selenium-webdriver/firefox');\nvar firefoxOptions = new firefox.Options();\n\
    firefoxOptions.headless();\nvar driver = new webdriver.Builder().forBrowser('firefox')\n\
    .setFirefoxOptions(firefoxOptions)\n.build();\n```\n\n## 16.11 Test responsive\
    \ web pages\n\nModern websites embrace responsive design to fit in different screen\
    \ resolutions on various devices, such as iPad and smartphones. Bootstrap is a\
    \ very popular responsive framework. How to verify your web site’s responsiveness\
    \ is a big question, it depends what you want to test. A quick answer is to use\
    \ WebDriver’s driver.manage().window().setSize() to set your browser to a target\
    \ resolution, and then execute tests.\n\nThe example below verify a text box’s\
    \ width changes when switching from a desktop computer to a iPad, basically, whether\
    \ responsive is enabled or not..\n\n```javascript\nvar driver = new webdriver.Builder().forBrowser('chrome').build();\n\
    driver.get(\"https://agileway.net\")\n// Desktop\nvar width_desktop;\ndriver.manage().window().setSize(1200,\
    \ 800).then(function() {\n  driver.findElement(By.name(\"email\")).getSize().then(function(elemSize)\
    \ {\n    width_desktop = elemSize.width;\n  });\n});\n\n// iPad\nvar width_ipad;\n\
    driver.manage().window().setSize(768, 1024).then(function() {\n  driver.findElement(By.name(\"\
    email\")).getSize().then(function(elemSize) {\n    width_ipad = elemSize.width;\n\
    \    assert(width_desktop < width_ipad); // 1050 vs 358\n  });\n});\n```\n\n##\
    \ 17. Advanced User Interactions\n\nThe Actions in Selenium WebDriver provides\
    \ a way to set up and perform complex user interactions. Specifically, grouping\
    \ a series of keyboard and mouse operations and sending to the browser.\n\n###\
    \ Mouse interactions\n\nThe Actions mouse APIs in JavaScript are slightly different\
    \ from Java’s (and other language bindings).\n\n| Java | JavaScript |\n| :---\
    \ | :--- |\n| click() | click() |\n| clickAndHold() | mouseDown().mouseMove(targetElem)..mouseUp()\
    \ |\n| contextClick() | click(elem, webdriver.Button.RIGHT) |\n| doubleClick()\
    \ | doubleClick() |\n| dragAndDrop() | dragAndDrop() |\n| dragAndDropBy() | dragAndDrop(location,\
    \ {x: number, y: number}) |\n| moveByOffset() | mouseMove(location, opt_offset)\
    \ |\n| moveToElement() | mouseMove() |\n| release() | mouseUp() |\n\n### Keyboard\
    \ interactions\n\n- keyDown()\n- keyUp()\n- sendKeys()\n\n### The usage\n\n`driver.actions().\
    \ + one or more above operations + .perform();`\n\nCheck out the WebDriver actions.js¹\
    \ for more.\n\n¹https://github.com/SeleniumHQ/selenium/blob/9f51796fc96120b7aaebd91b90418e1a13fbab51/javascript/node/selenium-webdriver/lib/actions.js\n\
    \n## 17.1 Double click a control\n\n```javascript\ndriver.get(\"file://\" + __dirname\
    \ + \"/../../site/text_field.html\");\nvar elem = driver.findElement(By.id(\"\
    quickfill\"));\ndriver.actions()\n.doubleClick(elem)\n.perform();\ndriver.findElement(By.id(\"\
    pass\")).getAttribute(\"value\").then(function(pwd_value) {\n  assert.equal(\"\
    ABC\", pwd_value);\n})\n```\n\n## 17.2 Move mouse to a control - Mouse Over\n\n\
    ```javascript\nvar elem = driver.findElement(By.id(\"email\"));\ndriver.actions()\n\
    .mouseMove(elem)\n.perform();\n```\n\n## 17.3 Click and hold - select multiple\n\
    \nThe test scripts below clicks and hold to select three controls in a grid.\n\
    \n```javascript\ndriver.get(\"http://jqueryui.com/selectable\");\ndriver.findElement(By.linkText(\"\
    Display as grid\")).click().then(function() {\n  driver.sleep(2000);\n  driver.switchTo().frame(0);\n\
    \  driver.findElements(By.xpath(\"//ol[@id='selectable']/li\")).then(function(lis)\
    \ {\n    driver.actions()\n    .mouseMove(lis[1])\n    .mouseDown()\n    .mouseMove(lis[3])\n\
    \    .mouseUp()\n    .perform();\n    driver.switchTo().defaultContent();\n  });\n\
    });\n```\n\n## 17.4 Context Click - right click a control\n\n```javascript\ndriver.get(\"\
    file://\" + __dirname + \"/../../site/text_field.html\");\ndriver.sleep(200);\n\
    var elem = driver.findElement(By.id(\"pass\"));\ndriver.actions()\n.click(elem,\
    \ webdriver.Button.RIGHT)\n.sendKeys(webdriver.Key.DOWN)\n.sendKeys(webdriver.Key.DOWN)\n\
    .sendKeys(webdriver.Key.DOWN)\n.sendKeys(webdriver.Key.RETURN)\n.perform();\n\
    ```\n\n## 17.5 Drag and drop\n\nDrag-and-drop is increasingly common in new sites.\
    \ Testing this feature can be largely achieved in Selenium, I used the word ‘largely’\
    \ means achieving the same outcome, not the ‘mouse dragging’ part. For this example,\
    \ the test script below will drop ‘Item 1’ to ‘Trash’.\n\n```javascript\ndriver.get(\"\
    file://\" + __dirname + \"/../../site/drag_n_drop.html\");\nvar dragFrom = driver.findElement(By.id(\"\
    item_1\"));\nvar target = driver.findElement(By.id(\"trash\"));\ndriver.actions()\n\
    .mouseMove(dragFrom)\n.mouseDown()\n.mouseMove(target)\n.mouseUp()\n.perform();\n\
    ```\n\n## 17.6 Drag slider\n\nSlider (a part of JQuery library) provide users\
    \ an very intuitive way to adjust values (typically in settings). The test below\
    \ simulates ‘dragging the slider to the right’.\n\n```javascript\ndriver.findElement(By.id(\"\
    pass_rate\")).then(function(the_text) {\n  assert.equal(\"15%\", the_text);\n\
    });\nvar elem = driver.findElement(By.id(\"pass-rate-slider\"));\ndriver.actions()\n\
    .dragAndDrop(elem, {x: 30, y: 0})\n.perform();\ndriver.findElement(By.id(\"pass_rate\"\
    )).then(function(the_text) {\n  assert.notEqual(\"15%\", the_text);\n});\n```\n\
    \nPlease note that the percentage figure after executing the test above are always\
    \ 50% (I saw 49% now and then).\n\n## 17.7 Send key sequences - Select All and\
    \ Delete\n\n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/text_field.html\"\
    );\ndriver.findElement(By.id(\"comments\")).sendKeys(\"Multiple Line\\r\\n Text\"\
    );\nvar elem = driver.findElement(By.id(\"comments\"));\ndriver.actions()\n.click(elem)\n\
    .keyDown(webdriver.Key.CONTROL)\n.sendKeys(\"a\")\n.keyUp(webdriver.Key.CONTROL)\n\
    .perform();\n// this different from click element, the key is send to browser\
    \ directly\ndriver.actions()\n.sendKeys(webdriver.Key.BACK_SPACE)\n.perform();\n\
    ```\n\nPlease note that the last test statement is different from elem.send_keys.\
    \ The keystrokes triggered by Actions.sendKeys is sent to the active browser window,\
    \ not a specific element.\n\n## 17.8 Click a specific part of an image\n\nThe\
    \ image below contains special marked areas (appears on mouse over) linked to\
    \ different URLs.\n\nHere is the HTML:\n\n```html\n<img src='images/software.png'\
    \ id=\"agileway_software\" usemap=\"#agileway_software_map\">\n<map name=\"agileway_software_map\"\
    \ id=\"agileway_software_map\">\n<area shape=\"rect\" coords=\"10,60,120,88\"\
    \ href=\"https://testwisely.com/buildwise\"/>\n<area shape=\"circle\" coords=\"\
    200,25,18\" href=\"https://clinicwise.net\">\n</map>\n```\n\nWe can use move_to(elem,\
    \ xoffset, yoffset) to click specific coordinates.\n\n```javascript\ndriver.get(\"\
    file://\" + __dirname + \"/../../site/image-map.html\");\nelem = driver.findElement(By.id(\"\
    agileway_software\"));\ndriver.actions()\n.mouseMove(elem, {x: 190, y: 30} )\n\
    .click()\n.perform();\ndriver.findElement(By.id(\"pass_rate\")).then(function(the_text)\
    \ {\n  assert.equal(\"ClinicWise - Cloud based Health Clinic Management System\"\
    , the_text);\n});\n```\n"
  mdcn: "\n\n浏览器配置与能力\n\n例如快速反馈、在另一个构建代理上重新运行失败的测试、按优先级进行动态执行排序等。所有操作都在真实浏览器中完成。\n\
    \n更新 [2017年4月13日]：PhantomJS 的维护者已辞职*，PhantomJS 的未来存在悬疑。\n\n*https://groups.google.com/forum/m/#!topic/phantomjs/9aI5d-LDuNE\n\
    \n## 16.9 无头 Chrome\n\nChrome 59（于 2017 年 6 月 5 日发布）引入了无头模式，可以配合 Selenium WebDriver\
    \ 使用。方法如下：\n\n```javascript\nvar chrome = require('selenium-webdriver/chrome');\n\
    var chromeOptions = new chrome.Options();\nchromeOptions.addArguments(\"headless\"\
    );\nvar driver = new webdriver.Builder().forBrowser('chrome')\n.setChromeOptions(chromeOptions)\n\
    .build();\ndriver.get(\"http://travel.agileway.net\")\ndriver.getTitle().then(function(the_title){\n\
    \  assert.equal(\"Agile Travel\", the_title)\n});\n```\n\n请注意，在编写时，Chrome 59 的无头模式已支持\
    \ Mac 和 Linux，但 Windows 支持⁴即将可用。\n\n⁴https://bugs.chromium.org/p/chromium/issues/detail?id=686608\n\
    \n## 16.10 无头 Firefox\n\nFirefox 从 56 版本开始也支持无头模式，工作方式与 Chrome 相同。请注意语法已更改多次，最新用法是\
    \ options.headless!。\n\n```javascript\nvar firefox = require('selenium-webdriver/firefox');\n\
    var firefoxOptions = new firefox.Options();\nfirefoxOptions.headless();\nvar driver\
    \ = new webdriver.Builder().forBrowser('firefox')\n.setFirefoxOptions(firefoxOptions)\n\
    .build();\n```\n\n## 16.11 测试响应式网页\n\n现代网站采用响应式设计以适应各种设备（如 iPad 和智能手机）的不同屏幕分辨率。Bootstrap\
    \ 是一个非常流行的响应式框架。如何验证网站的响应式是一个大问题，取决于你想测试什么。简单的答案是使用 WebDriver 的 `driver.manage().window().setSize()`\
    \ 将浏览器设置为目标分辨率，然后执行测试。\n\n下面的示例验证了当从台式电脑切换到 iPad 时文本框宽度的变化，基本上是验证是否启用了响应。\n\n\
    ```javascript\nvar driver = new webdriver.Builder().forBrowser('chrome').build();\n\
    driver.get(\"https://agileway.net\")\n// Desktop\nvar width_desktop;\ndriver.manage().window().setSize(1200,\
    \ 800).then(function() {\n  driver.findElement(By.name(\"email\")).getSize().then(function(elemSize)\
    \ {\n    width_desktop = elemSize.width;\n  });\n});\n\n// iPad\nvar width_ipad;\n\
    driver.manage().window().setSize(768, 1024).then(function() {\n  driver.findElement(By.name(\"\
    email\")).getSize().then(function(elemSize) {\n    width_ipad = elemSize.width;\n\
    \    assert(width_desktop < width_ipad); // 1050 vs 358\n  });\n});\n```\n\n##\
    \ 17. 高级用户交互\n\nSelenium WebDriver 中的 Actions 提供了一种设置和执行复杂用户交互的方法。具体来说，是将一系列键盘和鼠标操作分组并发送给浏览器。\n\
    \n### 鼠标交互\n\nJavaScript 中的 Actions 鼠标 API 与 Java（以及其他语言绑定）略有不同。\n\n| Java | JavaScript\
    \ |\n| :--- | :--- |\n| click() | click() |\n| clickAndHold() | mouseDown().mouseMove(targetElem)..mouseUp()\
    \ |\n| contextClick() | click(elem, webdriver.Button.RIGHT) |\n| doubleClick()\
    \ | doubleClick() |\n| dragAndDrop() | dragAndDrop() |\n| dragAndDropBy() | dragAndDrop(location,\
    \ {x: number, y: number}) |\n| moveByOffset() | mouseMove(location, opt_offset)\
    \ |\n| moveToElement() | mouseMove() |\n| release() | mouseUp() |\n\n### 键盘交互\n\
    \n- keyDown()\n- keyUp()\n- sendKeys()\n\n### 使用方法\n\n`driver.actions(). + 一个或多个以上操作\
    \ + .perform();`\n\n查看 WebDriver actions.js¹ 获取更多信息。\n\n¹https://github.com/SeleniumHQ/selenium/blob/9f51796fc96120b7aaebd91b90418e1a13fbab51/javascript/node/selenium-webdriver/lib/actions.js\n\
    \n## 17.1 双击控制控件\n\n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/text_field.html\"\
    );\nvar elem = driver.findElement(By.id(\"quickfill\"));\ndriver.actions()\n.doubleClick(elem)\n\
    .perform();\ndriver.findElement(By.id(\"pass\")).getAttribute(\"value\").then(function(pwd_value)\
    \ {\n  assert.equal(\"ABC\", pwd_value);\n})\n```\n\n## 17.2 移动鼠标到控制控件 - 鼠标悬停\n\
    \n```javascript\nvar elem = driver.findElement(By.id(\"email\"));\ndriver.actions()\n\
    .mouseMove(elem)\n.perform();\n```\n\n## 17.3 点击并按 - 选择多个\n\n下面的测试脚本点击并按住以选择网格中的三个控件。\n\
    \n```javascript\ndriver.get(\"http://jqueryui.com/selectable\");\ndriver.findElement(By.id(\"\
    selectable\")).click().then(function() {\n  driver.sleep(2000);\n  driver.findElements(By.xpath(\"\
    //ol/li\")).then(function(lis) {\n    driver.actions()\n    .mouseDown(lis[0])\n\
    \    .mouseMove(lis[1])\n    .mouseDown()\n    .mouseMove(lis[2])\n    .mouseUp()\n\
    \    .perform();\n  });\n});\n```\n\n## 17.4 右键点击 - 控件\n\n```javascript\ndriver.get(\"\
    file://\" + __dirname + \"/../../site/context_click.html\");\nvar elem = driver.findElement(By.id(\"\
    text\"));\ndriver.actions()\n.mouseMove(elem)\n.perform();\nvar elem = driver.findElement(By.id(\"\
    pass\"));\ndriver.actions()\n.click(elem, webdriver.Button.RIGHT)\n.perform();\n\
    ```\n\n## 17.5 拖拽\n\n拖拽功能在 Selenium 中非常常见。下面的示例演示了如何拖拽一个元素。\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/drag_drop.html\");\nvar dragFrom\
    \ = driver.findElement(By.id(\"drag\"));\nvar target = driver.findElement(By.id(\"\
    drop\"));\ndriver.actions()\n.mouseDown(dragFrom)\n.mouseMove(target)\n.mouseUp()\n\
    .perform();\n```\n\n## 17.6 拖动滑块\n\n滑块为用户提供了一种非常直观的调整数值的方式。下面的测试模拟了向右滑动。\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/slider.html\");\nvar elem =\
    \ driver.findElement(By.id(\"slider\"));\ndriver.actions()\n.dragAndDrop(elem,\
    \ {x: 50, y: 0})\n.perform();\n```\n\n## 17.7 按键序列 - 全选并删除\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/key_sequence.html\");\ndriver.findElement(By.id(\"\
    comments\")).sendKeys(\"Multiple Line\\n Text\");\nvar elem = driver.findElement(By.id(\"\
    comments\"));\ndriver.actions()\n.click(elem)\n.keyDown(webdriver.CONTROL)\n.sendKeys(\"\
    a\")\n.keyUp(webdriver.CONTROL)\n.perform();\n// 这不同于点击元素，键直接发送到浏览器\ndriver.actions()\n\
    .sendKeys(webdriver.Key.BACK_SPACE)\n.perform();\n```\n\n请注意，最后一个测试语句与 `elem.send_keys`\
    \ 不同。通过 Actions.sendKeys 触发的按键发送到活动窗口，而不是特定的元素。\n\n## 17.8 点击图片的特定部分\n\n下面的图片包含特殊的标记区域（鼠标悬停时显示），链接到不同的\
    \ URL。\n\n这里是 HTML：\n\n```html\n<img src='images/software.png' id=\"agileway_software\"\
    \ usemap=\"#agileway_software_map\">\n<map name=\"agileway_software_map\" id=\"\
    agileway_software_map\">\n<area shape=\"rect\" coords=\"10,60,120,88\" href=\"\
    https://testwisely.com/buildwise\"/>\n<area shape=\"circle\" coords=\"200,25,18\"\
    \ href=\"https://clinicwise.net\">\n</map>\n```\n\n我们可以使用 `move_to(elem, xoffset,\
    \ yoffset)` 点击特定的坐标。\n\n```javascript\ndriver.get(\"file://\" + __dirname + \"\
    /../../site/image-map.html\");\nelem = driver.findElement(By.id(\"agileway_software\"\
    ));\ndriver.actions()\n.mouseMove(elem, {x: 190, y: 30} )\n.click()\n.perform();\n\
    ```\n\n"
