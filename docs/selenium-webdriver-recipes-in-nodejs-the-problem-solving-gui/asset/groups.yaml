- md: "\nRadio button\n\n39\n\n## 6.5 Click Nth radio button in a group\n\n```javascript\n\
    driver.findElements(By.name(\"gender\")).then(function(radios){\n  radios[1].click();\n\
    });\n\ndriver.sleep(200);\n\nlet xpathStr = \"//input[@name='gender' and @value='female']\"\
    ;\nassert(driver.findElement(By.xpath(xpathStr)).isSelected());\n```\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_51_0.png)\n\
    \nOnce I was testing an online calendar, there were many time-slots, and the HTML\
    \ for each of these time-slots were exactly the same. I simply identified the\
    \ time slot by using the index (as above) on one of these ‘plural’ locators.\n\
    \n## 6.6 Click radio button by the following label\n\nSome .NET controls generate\
    \ poor quality HTML fragments like the one below:\n\n```html\n<div id=\"q1\" class=\"\
    question\">\n  <div class=\"question-answer col-lg-5\">\n    <div class=\"yes-no\"\
    >\n      <input id=\"QuestionViewModels_1__SelectedAnswerId\" name=\"QuestionViewModels[1].SelectedAnswerId\"\
    \ type=\"radio\" value=\"c225306e-8d8e-45b0-8261-22617d9796b5\">\n      <label\
    \ for=\"QuestionViewModels_1__SelectedAnswerId\">Yes</label>\n    </div>\n   \
    \ <div class=\"yes-no\">\n      <input id=\"QuestionViewModels_1__SelectedAnswerId\"\
    \ name=\"QuestionViewModels[1].SelectedAnswerId\" type=\"radio\" value=\"85ff8db7-1c58-47a2-a978-581200fb7098\"\
    >\n      <label for=\"QuestionViewModels_1__SelectedAnswerId\">No</label>\n  \
    \  </div>\n  </div>\n</div>\n```\n\nThe id attribute of the above two radio buttons\
    \ are the same, and the values are meaningless to human. The only thing can be\
    \ used to identify a radio button is the text in label elements. The solution\
    \ is to use XPath locator. You might have noticed that input (radio button) and\
    \ label are siblings in the HTML DOM tree. We can use this relation to come up\
    \ a XPath that identifies the label text, then the radio button.\n\nRadio button\n\
    \n40\n\n```javascript\nlet xpathStr = \"//div[@id='q1']//label[contains(.,'Yes')]/../input[@type='radio']\"\
    ;\ndriver.findElement(By.xpath(xpathStr)).click();\n```\n\n## 6.7 Customized Radio\
    \ buttons - iCheck\n\nThere are a number of plugins that customize radio buttons\
    \ into a more stylish form, like the one below (using iCheck).\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_52_0.png)\n\
    \nThe iCheck JavaScript transforms the radio button HTML fragment:\n\n```html\n\
    <input type=\"radio\" name=\"sex\" id=\"q2_1\" value=\"male\"> Male\n```\n\nto\n\
    \n```html\n<div class=\"iradio_square-red\" style=\"position: relative;\">\n \
    \ <input type=\"radio\" name=\"sex\" id=\"q2_1\" value=\"male\" style=\"...\"\
    \ />\n  <ins class=\"iCheck-helper\" style=\"...\" />\n</div>\n```\n\nHere are\
    \ test scripts to drive iCheck radio buttons:\n\n```javascript\n// Error if trying\
    \ input element directly: Element is not clickable\n// driver.findElement(By.id(\"\
    q2_1\")).click();\n\ndriver.findElements(By.className(\"iradio_square-red\")).then(function(checkboxes){\n\
    \  checkboxes[0].click();\n  driver.sleep(200); // add some delays for JavaScript\
    \ to execute\n});\n\ndriver.findElements(By.className(\"iradio_square-red\")).then(function(checkboxes){\n\
    \  checkboxes[1].click();\n  driver.sleep(100);\n});\n\n// More precise with XPath\n\
    driver.findElement(By.xpath(\"//div[contains(@class, 'iradio_square-red')]/input[@type='radio'\
    \ and @value='male']/..\")).click();\n```\n\n## 7. CheckBox\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_53_0.png)\n\
    \n**HTML Source**\n\n```html\n<input type=\"checkbox\" name=\"vehicle_bike\" value=\"\
    on\" id=\"checkbox_bike\">I have a bike<br>\n<input type=\"checkbox\" name=\"\
    vehicle_car\" id=\"checkbox_car\">I have a car\n```\n\n### 7.1 Check by name\n\
    \n```javascript\n// driver.get(\"file://\" + __dirname + \"/../../site/checkbox.html\"\
    );\ndriver.findElement(By.name(\"vehicle_bike\")).click();\n```\n\n### 7.2 Check\
    \ by id\n\nTo safely check a checkbox, we shall verify it is not checked first.\n\
    \n```javascript\nthe_checkbox = driver.findElement(By.id(\"checkbox_car\"));\n\
    the_checkbox.isSelected().then(function(selected) {\n  if (!selected) { the_checkbox.click();\
    \ }\n});\n```\n\n### 7.3 Uncheck a checkbox\n\nCheckBox\n\n42\n\n```javascript\n\
    the_checkbox = driver.findElement(By.name(\"vehicle_bike\"));\nthe_checkbox.click();\n\
    the_checkbox.isSelected().then(function(selected) {\n  if (selected) { the_checkbox.click();\
    \ }\n});\n```\n\n### 7.4 Assert a checkbox is checked (or not)\n\n```javascript\n\
    the_checkbox = driver.findElement(By.name(\"vehicle_bike\"));\nthe_checkbox.click();\n\
    driver.sleep(100);\nassert(the_checkbox.isSelected());\nthe_checkbox.click().then(function()\
    \ {\n  driver.sleep(100);\n  the_checkbox.isSelected().then(function(selected)\
    \ {\n    assert(!selected);\n  });\n});\n```\n\n### 7.5 Customized Checkboxes\
    \ - iCheck\n\nThere are a number of plugins that customize radio buttons into\
    \ a more stylish form, like the one below (using iCheck).\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_54_0.png)\n\
    \nThe iCheck JavaScript transforms the checkbox fragment:\n\n```html\n<input type=\"\
    checkbox\" name=\"sports[]\" value=\"Soccer\"> Soccer\n```\n\nto\n\n```html\n\
    <div class=\"icheckbox_square-red\" style=\"position: relative;\">\n  <input type=\"\
    checkbox\" name=\"sports[]\" value=\"Soccer\" style=\"...\" />\n  <ins class=\"\
    iCheck-helper\" style=\"...\" />\n</div>\n```\n\nHere are test scripts to drive\
    \ iCheck checkboxes:\n\n```javascript\ndriver.findElements(By.className(\"icheckbox_square-red\"\
    )).then(function(checkboxes){\n  checkboxes[0].click();\n  driver.sleep(200);\
    \ // add some delays for JavaScript to execute\n});\n\ndriver.findElements(By.className(\"\
    icheckbox_square-red\")).then(function(checkboxes){\n  checkboxes[1].click();\n\
    \  driver.sleep(100);\n});\n\n// More precise with XPath\ndriver.findElement(By.xpath(\"\
    //div[contains(@class, 'icheckbox_square-red')]/input[@type='checkbox' and @value='Soccer']/..\"\
    )).click();\n```\n\n## 8. Select List\n\nA Select list is also known as a drop-down\
    \ list or combobox.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_56_0.png)\n\n\
    **HTML Source**\n\n```html\n<select name=\"car_make\" id=\"car_make_select\">\n\
    \  <option value=\"\">Select --</option>\n  <option value=\"honda\">Honda (Japan)</option>\n\
    \  <option value=\"volvo\">Volvo (Sweden)</option>\n  <option value=\"audi\">Audi\
    \ (Germany)</option>\n  <option value=\"others\">Unknown</option>\n</select>\n\
    ```\n\n### 8.1 Select an option by text\n\nThe label of a select list is what\
    \ we can see in the browser.\n\n```javascript\n// driver.get(\"file://\" + __dirname\
    \ + \"/../../site/select_list.html\");\ndriver.findElement(By.name(\"car_make\"\
    )).sendKeys(\"Volvo (Sweden)\");\n// or starting partial text\ndriver.findElement(By.name(\"\
    car_make\")).sendKeys(\"Volvo\");\n```\n\nThe above syntax is quite different\
    \ from what it is in other Selenium language bindings, for example, in Java:\n\
    \n```java\nSelect select = new Select(driver.findElement(By.name(\"car_make_select\"\
    )));\nselect.selectByVisibleText(\"Volvo (Sweden)\");\n```\n\nI like this syntax\
    \ better, it is more clear. However, I could not find the equivalent way in Node.js\
    \ (the above syntax examples are provided on the Selenium official documentation\
    \ page for all other languages except JavaScript: “We don’t have a JavaScript\
    \ code sample yet https://www.selenium.dev/docs/site/en/support_packages/working_with_select_elements/\
    \ Help us out and raise a PR”, please let me know if you do).\n\n### 8.2 Select\
    \ an option by value\n\nThe value of a select list is what to be passed to the\
    \ server.\n\n```javascript\nvar selElement = driver.findElement(By.name(\"car_make\"\
    ));\nselElement.findElement(By.css(\"option[value='others']\")).click();\n```\n\
    \n### 8.3 Select an option by iterating all options\n\nHere I will show you a\
    \ more complex way to select an option in a select list, not for the sake of complexity,\
    \ of course. A select list contains options, where each option itself is a valid\
    \ control in Selenium.\n\n```javascript\nlet xpathStr = \"//select[@id='car_make_select']/option\"\
    ;\ndriver.findElements(By.xpath(xpathStr)).then(function(the_options) {\n  the_options.map(option\
    \ => {\n    option.getText().then(text => {\n      if (text == \"Volvo (Sweden)\"\
    ) {\n        option.click();\n      }\n    });\n  });\n});\n```\n\n### 8.4 Select\
    \ multiple options\n\nA select list also supports multiple selections.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_57_0.png)\n\
    \n**HTML Source**\n\n```html\n<select id=\"framework_select\" name=\"test_framework\"\
    \ multiple=\"multiple\">\n  <option></option>\n  <option value=\"rwebspec\">RWebSpec</option>\n\
    \  <option value=\"watir\">Watir</option>\n  <option value=\"selenium\">Selenium</option>\n\
    </select>\n```\n\n**Test Script**\n\n```javascript\nvar selElement = driver.findElement(By.name(\"\
    test_framework\"));\nselElement.findElement(By.css(\"option[value='selenium']\"\
    )).click();\nselElement.findElement(By.css(\"option[value='rwebspec']\")).click();\n\
    ```\n\n### 8.5 Select options by index\n\nSelecting options by index works for\
    \ both standard and multiple Select List.\n\n```javascript\n// standard\nvar standardSelElement\
    \ = driver.findElement(By.name(\"car_make\"));\nstandardSelElement.findElement(By.css(\"\
    option:nth-child(2)\")).click();\n\n// multiple\nvar multipleElement = driver.findElement(By.name(\"\
    test_framework\"));\n// 1 means the first option, not 0\nmultipleElement.findElement(By.css(\"\
    option:nth-child(2)\")).click();\nmultipleElement.findElement(By.css(\"option:nth-child(4)\"\
    )).click();\n```\n\n### 8.6 Clear one selection\n\nClearing selection only applies\
    \ to multiple select lists.\n"
