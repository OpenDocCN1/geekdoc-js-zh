- md: "\n## 10. Assertion\n\nWithout assertions (or often known as checks), a test\
    \ script is incomplete. Common assertions for testing web applications are:\n\n\
    - page title (equals)\n- page text (contains or does not contain)\n- page source\
    \ (contains or does not contain)\n- input element value (equals)\n- display element\
    \ text (equals)\n- element state (selected, disabled, displayed)\n\n### 10.1 Assert\
    \ page title\n\n```javascript\ndriver.getTitle().then(function(the_page_title)\
    \ {\n  assert.equal(\"Assertion Test Page\", the_page_title);\n});\n```\n\n###\
    \ 10.2 Assert Page Text\n\n**Example web page**\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_66_0.png)\n\
    \n**HTML source**\n\n```html\n<PRE>Text assertion with a\n(tab before), and\n\
    (new line before)!</PRE>\n```\n\nWe can use `string.indexOf()` to check whether\
    \ a string contains another string. It works, but not easy to read.\n\nString.prototype.contains\
    \ = function(it) { return this.indexOf(it) != -1; };\n\n**Test script**\n\n```javascript\n\
    driver.findElement(By.tagName(\"body\")).getText().then(function(the_page_text)\
    \ {\n  assert(the_page_text.includes(matching_str))\n});\n```\n\nPlease note the\
    \ `findElement(By.tagName(\"body\")).getText()` returns the text view of a web\
    \ page after stripping off the HTML tags, but may not be exactly the same as we\
    \ saw on the browser.\n\n### 10.3 Assert Page Source\n\nThe page source is raw\
    \ HTML returned from the server.\n\n```javascript\nhtml_fragment = \"Text assertion\
    \ with a\n(<b>tab</b> before), and \\n(new line before)!\";\ndriver.getPageSource().then(function(the_page_source)\
    \ {\n  assert(the_page_source.contains(html_fragment))\n});\n```\n\n### 10.4 Assert\
    \ Label Text\n\n**HTML source**\n\n```html\n<label id=\"receipt_number\">NB123454</label>\n\
    ```\n\nLabel tags are commonly used in web pages to wrap some text. It can be\
    \ quite useful to assert a specific text.\n\n```javascript\ndriver.findElement(By.id(\"\
    label_1\")).getText().then(function(the_elem_text) {\n  assert.equal(\"First Label\"\
    , the_elem_text);\n});\n```\n\n### 10.5 Assert Span text\n\n**HTML source**\n\n\
    ```html\n<span id=\"span_2\">Second Span</span>\n```\n\nFrom testing perspectives,\
    \ spans are the same as labels, just with a different tag name.\n\n```javascript\n\
    driver.findElement(By.id(\"span_2\")).getText().then(function(the_elem_text) {\n\
    \  assert.equal(\"Second Span\", the_elem_text);\n});\n```\n\n### 10.6 Assert\
    \ Div text or HTML\n\n**Example page**\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_68_0.png)\n\
    \n**HTML source**\n\n```html\n<div id=\"div_parent\">\n  Wise Products\n  <div\
    \ id=\"div_child_1\">\n    TestWise\n  </div>\n  <div id=\"div_child_2\">\n  \
    \  BuildWise\n  </div>\n</div>\n```\n\n**Test script**\n\n```javascript\n// text\n\
    driver.findElement(By.id(\"div_child_1\")).getText().then(function(elem_text)\
    \ {\n  assert.equal(\"TestWise\", elem_text);\n});\n\ndriver.findElement(By.id(\"\
    div_parent\")).getText().then(function(elem_text) {\n  assert.equal(\"Wise Products\\\
    nTestWise\\nBuildWise\", elem_text);\n});\n\n// HTML\nthe_element = driver.findElement(By.id(\"\
    div_parent\"));\ndriver.executeScript(\"return arguments[0].outerHTML;\", the_element).then(function(html)\
    \ {\n  assert.equal(\"<div id=\\\"div_parent\\\">\\nWise Products\\n<div id=\\\
    \"div_child_1\\\">\\nTestWise\\n</div>\\n<div id=\\\"div_child_2\\\">\\nBuildWise\\\
    n</div>\\n</div>\", html)\n});\n```\n\n### 10.7 Assert Table text\n\nHTML tables\
    \ are commonly used for displaying grid data on web pages.\n\n**Example page**\n\
    \n![](img/3d64dd4dddc685f0fc30665068dcfaf4_69_0.png)\n\n**HTML source**\n\n```html\n\
    <table id=\"aha_table\" cellpadding=\"1\" border=\"1\" width=\"30%\">\n  <tr id=\"\
    row_1\">\n    <td id=\"cell_1_1\">A</td>\n    <td id=\"cell_1_2\">B</td>\n  </tr>\n\
    \  <tr id=\"row_2\">\n    <td id=\"cell_2_1\">a</td>\n    <td id=\"cell_2_2\"\
    >b</td>\n  </tr>\n</table>\n```\n\n**Test script**\n\n```javascript\ndriver.findElement(By.id(\"\
    alpha_table\")).getText().then(function(the_elem_text) {\n  assert.equal(\"A B\\\
    na b\", the_elem_text);\n});\n\ndriver.findElement(By.id(\"alpha_table\")).then(function(the_element)\
    \ {\n  driver.executeScript(\"return arguments[0].outerHTML;\", the_element).then(function(elem_html)\
    \ {\n    assert(elem_html.contains(\"<td id=\\\"cell_1_1\\\">A</td>\"))\n  })\n\
    });\n```\n\n### 10.8 Assert text in a table cell\n\nIf a table cell (`td` tag)\
    \ has a unique ID, it is easy.\n\n```javascript\ndriver.findElement(By.id(\"cell_1_1\"\
    )).getText().then(function(cell_text) {\n  assert.equal(\"A\", cell_text);\n});\n\
    ```\n\nAn alternative approach is to identify a table cell using row and column\
    \ indexes (starting with 0).\n\n```javascript\ndriver.findElement(By.xpath(\"\
    //table/tr[2]/td[2]\")).getText().then(function(the_elem_text) {\n  assert.equal(\"\
    b\", the_elem_text);\n});\n```\n\n### 10.9 Assert text in table row\n\n```javascript\n\
    driver.findElement(By.id(\"row_1\")).getText().then(function(the_elem_text) {\n\
    \  assert.equal(\"A B\", the_elem_text);\n});\n```\n\n### 10.10 Assert image present\n\
    \n```javascript\nassert(driver.findElement(By.id(\"next_go\")).isDisplayed());\n\
    ```\n\n### 10.11 Assert element location and width\n\n```javascript\ndriver.findElement(By.id(\"\
    next_go\")).getSize().then(function(the_size) {\n  assert.equal(46, the_size.width)\n\
    });\n\ndriver.findElement(By.id(\"next_go\")).getLocation().then(function(the_loc)\
    \ {\n  assert(the_loc.x > 100)\n});\n```\n\n### 10.12 Assert element CSS style\n\
    \n```javascript\ndriver.findElement(By.id(\"highlighted\")).getCssValue(\"background-color\"\
    ).then(function(bc) {\n  assert.equal(\"rgba(206, 218, 27, 1)\", bc)\n});\n\n\
    driver.findElement(By.id(\"highlighted\")).getCssValue(\"font-size\").then(function(fsize)\
    \ {\n  assert.equal(\"15px\", fsize)\n});\n```\n\n### 10.13 Assert JavaScript\
    \ errors on a web page\n\nJavaScript errors can be inspected in browser’s console,\
    \ as below:\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_71_0.png)\n\nHere is how\
    \ to detect JavaScript errors with Selenium WebDriver:\n\n```javascript\ndriver.get(\"\
    http://testwisely.com/demo/customer\");\ndriver.sleep(300)\ndriver.manage().logs().get(\"\
    browser\").then(function(browser_log) {\n  console.log(browser_log);\n  assert.equal(1,\
    \ browser_log.length);\n  console.log(JSON.stringify(browser_log[0]));\n  assert(JSON.stringify(browser_log[0]).contains(\"\
    net::ERR_NAME_RESOLVED\"))\n});\n\n// Verify no JS errors.\ndriver.get(\"http://testwisely.com/demo\"\
    );\ndriver.sleep(300)\ndriver.manage().logs().get(\"browser\").then(function(browser_log)\
    \ {\n  assert.equal(0, browser_log.length);\n});\n```\n\nPlease note this feature\
    \ is browser dependent, it works on Chrome.\n\n## 11. Frames\n\nHTML Frames are\
    \ treated as independent pages, which is not a good design practice. As a result,\
    \ few new sites use frames. However, there are quite a number of sites that uses\
    \ iframes.\n\n### 11.1 Testing Frames\n\nHere is a layout of a fairly common frame\
    \ setup: navigations on the top, menus on the left and the main content on the\
    \ right.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_73_0.png)\n\n**HTML Source**\n\
    \n```html\n<frameset rows=\"100,*\" border=\"0\" border=\"0\" framespacing=\"\
    0\">\n  <frame name=\"topNav\" src=\"top_nav.html\">\n  <frameset cols=\"200,*\"\
    \ border=\"0\" border=\"0\" framespacing=\"0\">\n    <frame name=\"menu\" id=\"\
    menu_frame\" src=\"menu_1.html\" marginheight=\"0\" marginwidth=\"0\" scrolling=\"\
    auto\" noresize>\n    <frame name=\"content\" src=\"content.html\" marginheight=\"\
    0\" marginwidth=\"0\" scrolling=\"auto\" noresize>\n  </frameset>\n</frameset>\n\
    ```\n\nTo test a frame with Selenium, we need to identify the frame first by ID\
