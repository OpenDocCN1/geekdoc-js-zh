    receiptNo\")));\ndriver.manage().timeouts().implicitlyWait(0);\n```\n\n### 12.4\
    \ 使用 JQuery 等待 AJAX 调用完成\n\n如果目标应用程序使用 JQuery 进行 AJAX 请求（大多数都是如此），你可能可以使用 JavaScript\
    \ 调用来检查活跃的 AJAX 请求：`jQuery.active` 是 JQuery 内部用于跟踪请求数量的变量。\n\n1. 检查活跃的 AJAX 请求\n\
