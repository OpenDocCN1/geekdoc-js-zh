    \ as it far exceeds other tools and free frameworks.\n\n### Chrome\n\nTo run Selenium\
    \ tests in Google Chrome, besides the Chrome browser itself, ChromeDriver needs\
    \ to be installed. Installing ChromeDriver is easy: go to http://chromedriver.storage.googleapis.com/index.html.\n\
    \n⁵http://en.wikipedia.org/wiki/Usage_of_browsers\n⁶http://chromedriver.storage.googleapis.com/index.html\n\
    \nDownload the one for your target platform, unzip it and put chromedriver executable\
