  - '[PAGE 180]


    Afterword


    168


    • **Improve programming skills**


    It requires programming skills to effectively use Selenium WebDriver. For readers


    with no programming background, the good news is that the programming knowledge


    required for writing test scripts is much less comparing to coding applications,
    as you


    have seen in this book. If you like learning with hands-on practices, check out
    Learn


    Ruby Programming by Examples⁷.


    **Successful Test Automation**


    I believe that you are well equipped to cope with most testing scenarios if you
    have mastered


    the recipes in this book. However, this only applies to your ability to write
    individual tests.


    Successful test automation also requires developing and maintaining many automated
    test


    cases while software applications change frequently.


    • **Maintain test scripts to keep up with application changes**


    Let’s say you have 100 automated tests that all pass. The changes developers made
    in


    the next build will affect some of your tests. As this happens too often, many
    automated


    tests will fail. The only way to keep the test script maintainable is to adopt
    good test


    design practices (such as reusable functions and page objects) and efficient refactoring.


    Check out my other book *Practical Web Test Automation*⁸.


    • **Shorten test execution time to get quick feedback**


    With growing number of test cases, so is the test execution time. This leads to
    a long


    feedback gap from the time programmers committed the code to the time test execution


    completes. If programmers continue to develop new features/fixes during the gap
    time,


    it can easily get into a tail-chasing problem. This will hurt the team’s productivity
    badly.


    Executing automated tests in a Continuous Testing server with various techniques


    (such as distributing test to run in parallel) can greatly shorten the feedback
    time. Check


    out my other book *Practical Continuous Testing*⁹.


    Best wishes for your test automation!


    ⁷https://leanpub.com/learn-ruby-programming-by-examples-en


    ⁸https://leanpub.com/practical-web-test-automation


    ⁹https://leanpub.com/practical-continuous-testing'
