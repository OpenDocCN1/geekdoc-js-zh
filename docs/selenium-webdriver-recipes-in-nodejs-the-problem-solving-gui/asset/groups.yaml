    **24\. Selenium Remote Control**


    **Server**


    Selenium Server, formerly known as Selenium Remote Control (RC) Server, allows
    testers to


    writes Selenium tests in their favourite language and execute them on another
    machine. The


    word ‘remote’ means that the test scripts and the target browser may not be on
    the same


    machine.


    The Selenium Server is composed of two parts: a server and a client.


    • **Selenium Server**. A Java server which launches, drives and kills browsers
    on receiving


    commands, with the target browser installed on the machine.


    • **Client libraries**. Test scripts in tests’ favourite language bindings, such
    as Ruby, Java


    and Python.


    **24.1 Selenium Server Installation**


    Make sure you have Java Runtime installed first. Download Selenium Server *selenium-server-*


    *standalone-{VERSION}.jar* from Selenium download page¹ and place it on the computer
    with


    the browser(s) you want to test. Then from the directory with the jar run the
    following the


    Command Line


    java -jar selenium-server-standalone-2.53.1.jar


    Sample output


    ¹http://www.seleniumhq.org/download/'
