    \  // ..\n  driver.findElement(By.xpath(\"//input[@value='Transfer']\")).click();\n\
    \  driver.sleep(10000)\n  driver.findElement(By.tagName(\"body\")).getText().then(**function**(text){\n\
    \    assert(text.contains(\"Receipt No:\"))\n  });\n});\n```\n\n`driver.sleep(10000)`\
    \ 意味着在点击“Transfer”按钮后等待 10 秒。10 秒后，测试脚本将检查页面上的“Receipt No:” 文本。如果文本存在，则测试通过；否则，测试失败。换句话说，如果服务器在\
    \ 11 秒内完成处理并正确返回结果，则此测试执行将被标记为“失败”。\n\n### 12.2 显式等待直到超时\n\n显然，等待指定的时间并不是理想的。如果操作提前完成，测试执行仍处于暂停状态。与其被动等待，我们不如编写测试脚本，为满足某些条件定义一个等待语句，直到等待达到其超时期。如果\
    \ Selenium 在定义的超时值之前找到元素，代码执行将继续到下一行代码。\n\n```javascript\ntest.it(\"等待足够的时间 (使用显式等待)\"\
