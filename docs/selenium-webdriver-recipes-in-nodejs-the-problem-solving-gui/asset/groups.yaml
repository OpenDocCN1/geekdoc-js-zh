- md: "\n## 18. HTML 5 and Dynamic Web Sites\n\nWeb technologies are evolving. HTML5\
    \ includes many new features for more dynamic web applications and interfaces.\
    \ Furthermore, wide use of JavaScript (thanks to popular JavaScript libraries\
    \ such as jQuery), web sites nowadays are much more dynamic. In this chapter,\
    \ I will show some Selenium examples to test HTML5 elements and interactive operations.\n\
    \nPlease note that some tests only work on certain browsers (Chrome is your best\
    \ bet), as some HTML5 features are not fully supported in some browsers yet.\n\
    \n### 18.1 HTML5 Email type field\n\nLet’s start with a simple one. An email type\
    \ field is used for input fields that should contain an e-mail address. From the\
    \ testing point of view, we treat it exactly the same as a normal text field.\n\
    \n![](img/3d64dd4dddc685f0fc30665068dcfaf4_112_0.png)\n\n**HTML Source**\n```\n\
    <input id=\"email\" name=\"email\" type=\"email\" style=\"height:30px; width:\
    \ 280px;\">\n```\n\n**Test Script**\n```\ndriver.get(\"file://\" + __dirname +\
    \ \"/../../site/html5.html\");\ndriver.findElement(By.id(\"email\")).sendKeys(\"\
    test@wisely.com\");\n```\n\n### 18.2 HTML5 Time Field\n\nThe HTML5 time field\
    \ is much more complex, as you can see from the screenshot below.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_113_0.png)\n\
    \n**HTML Source**\n```\n<input id=\"start_time_1\" name=\"start_time\" type=\"\
    time\" style=\"width: 120px;\">\n```\n\nThe test scripts below do the following:\n\
    \n1. make sure the focus is not on this time field control\n2. click and focus\
    \ the time field\n3. clear existing time\n4. enter a new time\n\n```\ndriver.findElement(By.id(\"\
    start_time_1\")).sendKeys(\"12:05AM\");\n// focus on another ...\ndriver.findElement(By.id(\"\
    home_link\")).sendKeys(\"\");\ndriver.sleep(500);\n// now back to change it\n\
    driver.findElement(By.id(\"start_time_1\")).click();\n// [:delete, :left, :delete,\
    \ :left, :delete]\ndriver.findElement(By.id(\"start_time_1\")).sendKeys(webdriver.Key.DELETE);\n\
    driver.findElement(By.id(\"start_time_1\")).sendKeys(webdriver.Key.LEFT);\ndriver.findElement(By.id(\"\
    start_time_1\")).sendKeys(webdriver.Key.DELETE);\ndriver.findElement(By.id(\"\
    start_time_1\")).sendKeys(webdriver.Key.LEFT);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(webdriver.Key.DELETE);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(\"08\");\ndriver.sleep(300);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(\"27\");\ndriver.sleep(300);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(\"AM\");\n```\n\n### 18.3 Invoke ‘onclick' JavaScript event\n\nIn\
    \ the example below, when user clicks on the text field control, the tip text\
    \ (*‘Max 20 characters’*) is shown.\n\n**Example page**\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_114_0.png)\n\
    \n**HTML Source**\n```\n<input type=\"text\" name=\"person_name\" onclick=\"$('#tip').show();\"\
    \ onchange=\"change_person_name(this.value);\"/>\n<span id=\"tip\" style=\"display:none;\
    \ margin-left: 20px; color:gray;\">Max 20 characters</span>\n```\n\nWhen we use\
    \ normal sendKeys() in Selenium, it enters the text OK, but the tip text is not\
    \ displayed.\n\n```\ndriver.findElement(By.name(\"person_name\")).sendKeys(\"\
    Wise Tester\");\n```\n\nWe can simply calling ‘click’ to achieve it.\n\n```\n\
    driver.findElement(By.name(\"person_name\")).clear();\ndriver.findElement(By.name(\"\
    person_name\")).sendKeys(\"Wise Tester\");\ndriver.findElement(By.name(\"person_name\"\
    )).click();\ndriver.findElement(By.id(\"tip\")).getText().then(function(tipText)\
    \ {\n    assert.equal(\"Max 20 characters\", tipText);\n});\n```\n\n### 18.4 Invoke\
    \ JavaScript events such as ‘onchange’\n\nA generic way to invoke ‘OnXXXX’ events\
    \ is to execute JavaScript, the below is an example to invoke ‘OnChange’ event\
    \ on a text box.\n\n```\ndriver.findElement(By.name(\"person_name\")).sendKeys(\"\
    Wise Tester too\");\ndriver.executeScript(\"$('#person_name_textbox').trigger('change')\"\
    ).then(function() {\n    driver.findElement(By.id(\"person_name_label\")).getText().then(function(theText){\n\
    \        assert.equal(\"Wise Tester too\", theText);\n    });\n});\n```\n\n###\
    \ 18.5 Scroll to the bottom of a page\n\nCalling JavaScript API.\n\n```\ndriver.executeScript(\"\
    window.scrollTo(0, document.body.scrollHeight);\").then(function(){});\n```\n\n\
    Or send the keyboard command: ‘Ctrl+End’.\n\n```\ndriver.findElement(By.tagName(\"\
    body\")).sendKeys(webdriver.Key.CONTROL, webdriver.Key.END);\n```\n\n### 18.6\
    \ Select2 - Single Select\n\nSelect2 is a popular plug-in that makes long select\
    \ lists user-friendly, it turns the standard HTML select box into this:\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_15_0.png)\n\
    \n**HTML Source**\n```\n<select id=\"country_single\" data-placeholder=\"Choose\
    \ Country...\" class=\"select2\">\n    <option value=\"\"></option>\n    <option\
    \ value=\"United States\">United States</option>\n    <option value=\"United Kingdom\"\
    >United Kingdom</option>\n    <option value=\"Australia\">Australia</option>\n\
    </select>\n```\n\nThe HTML source seems not much different from the standard list\
    \ except adding the class select2. By using the class as the identification, the\
    \ JavaScript on page generates the following HTML fragment (beneath the element).\n\
    \n**Generated HTML Source**\n```\n<select id=\"country_single\" />\n<span class=\"\
    select2-container select2-container--default select2-container--open\">\n    <span\
    \ class=\"select2-dropdown select2-dropdown--below\">\n        <input autocomplete=\"\
    off\" class=\"select2-search__field\" type=\"search\">\n        <ul class=\"select2-results\"\
    \ id=\"select2-country-results\">\n            <li class=\"...\" id=\"...\"><span\
    \ class=\"select2-results\">United States</span></li>\n            <li class=\"\
    ...\" id=\"...\"><span class=\"select2-results\">United Kingdom</span></li>\n\
    \            <li class=\"...\" id=\"...\"><span class=\"select2-results\">Australia</span></li>\n\
    \        </ul>\n    </span>\n</span>\n```\n\nPlease note that this dynamically\
    \ generated HTML fragment is not viewable by ‘View Page Source’, you need to enable\
    \ the inspection tool (usually right click the page, then choose ‘Inspect Element’)\
    \ to see it.\n\nBefore we test it, we need to understand how we use it.\n\n- Click\
    \ the ‘Choose a Country’\n- Select an option\n\nThere is no difference from the\
    \ standard select list. That’s correct, we need to understand how Select2 emulates\
    \ the select select list. In Select2, clicking the ‘Choose a Country’ (to show\
    \ the options) is actually clicking the span next to the original <select> with\
    \ id country_single; selecting an option is clicking a list item (tag: li) under\
    \ ul with id select2-country-results (where country_single is the ID of original).\n\
    \nWith this knowledge, plus XPath in Selenium, we can drive a Select2 standard\
    \ select box with the test below:\n\n```\ndriver.get(\"file://\" + __dirname +\
    \ \"/../../site/select2.html\");\ndriver.sleep(500); // wait JS to load\ndriver.findElement(By.xpath(\"\
    //select[@id='country_single']/../span\")).click();\ndriver.sleep(300);\ndriver.findElements(By.xpath(\"\
    //ul[@id='select2-country-results']/li\")).then(function(options){\n    options.forEach(function(option){\n\
    \        option.getText().then(function(optionText) {\n            if (optionText\
    \ == \"Australia\") {\n                option.click();\n            }\n      \
    \  });\n    });\n});\n```\n\nA neat feature of Select2 is allowing user to search\
    \ the option list, to do that in Selenium:\n\n```\ndriver.findElement(By.xpath(\"\
    //select[@id='country_single']/../span//span[@class='select2-selection__arrow']\"\
    )).click();\ndriver.sleep(300);\nvar search_text_field = driver.findElement(By.xpath(\"\
    //span/input[@class = 'select2-search__field']\"));\nsearch_text_field.sendKeys(\"\
    United King\");\ndriver.sleep(200); // let filtering finishing\nsearch_text_field.sendKeys(webdriver.Key.ENTER);\n\
    // select 1st highlighted\n```\n\n### 18.7 Select2 - Multiple Select\n\nSelect2¹\
    \ also enhances the multiple selection (a lot).\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_117_0.png)\n\
    \n**HTML Source**\n```\n<select id=\"country_multiple\" data-placeholder=\"Choose\
