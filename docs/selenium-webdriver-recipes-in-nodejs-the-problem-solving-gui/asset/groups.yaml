- md: "\n## Gotchas\n\n141\n\n### UnexpectedTagNameException: Element should have\
    \ been \"select\" but was \"input\"\n\nThe reason: there are two controls with\
    \ the same “name” attribute “vip”. By.name(\"vip\") returns the first matching\
    \ control, i.e., the text field. The solution is quite obvious after knowing the\
    \ cause: change the locator to be more specific By.xpath(\"//select[@name='vip']\"\
    ).\n\nA quite common scenario is as below: a hidden element and a checkbox element\
    \ share the same ID and NAME attributes.\n\n```html\n<input type=\"hidden\" name=\"\
    vip\" value=\"false\"/>\n<!-- ... -->\n<input type=\"checkbox\" name=\"vip\" value=\"\
    on\"> VIP?\n```\n\nIn this case, there might be no error thrown. However, this\
    \ can be more subtle, as the operation is applied to a different control.\n\n\
    ## 22.5 Element is not clickable or not visible\n\nSome controls such as text\
    \ fields, even when they are not visible in the current browser window, Selenium\
    \ WebDriver will move the focus to them. Some other controls such as buttons,\
    \ may be not. In that case, though the element is found by findElement, it is\
    \ not clickable.\n\nThe solution is to make the target control visible in browser.\n\
    \n1. Scroll the window to make the control visible\n\nFind out the control’s position\
    \ and scroll to it.\n\n```javascript\nelem = driver.findElement(By.name(\"submit_action_2\"\
    ));\nelemPos = elem.getLocation().y\ndriver.executeScript(\"window.scroll(0, \"\
    \ + elemPos + \");\"); // scroll\n```\n\nOr scroll to the top / bottom of page.\n\
    `driver.executeScript(\"window.scrollTo(0, document.body.scrollHeight);\");`\n\
    \n2. A hack, call sendKeys to a text field nearby, if there is one.\n\n## 23.\
    \ Material Design Web App\n\nMaterial Design (MD) is a design language created\
    \ in 2014 by Google, has become huge popular for web apps. In the chapter I use\
    \ Materialize (a popular Material Design framework) as an example to show how\
    \ to test Material Design controls with Selenium WebDriver.\n\n### 23.1 Select\
    \ List (dropdown)\n\nDefault Materialize Select style.\n\n```javascript\ndriver.get(\"\
    https://whenwise.agileway.net\");\nelem_id = \"businessType\";\noption_label =\
    \ \"Physio\";\ndriver.findElement(By.xpath(\"//select[@id='\" + elem_id + \"']/..\"\
    )).click();\ndriver.sleep(500);\ndriver.findElement(By.xpath(\"//select[@id='\"\
    \ + elem_id + \"']/../ul/li/span[text()='\" + option_label + \"']\")).click();\n\
    driver.sleep(500);\n```\n\n### 23.2 Checkbox\n\nToggle a checkbox.\n\n```javascript\n\
    driver.get(\"https://whenwise.agileway.net/sign-in\");\n// the bleow won't work\n\
    // driver.findElement(By.id(\"remember_me\")).click();\n// this works\ndriver.findElement(By.xpath(\"\
    //input[@id='remember_me']/../span\")).click();\n```\n\nCheck a checkbox.\n\n\
    ```javascript\nif (!driver.findElement(By.id( \"remember_me\")).isSelected())\
    \ {\n    driver.findElement(By.xpath(\"//input[@id='remember_me']/../span\")).click();\n\
    }\n```\n\nUncheck a checkbox.\n\n```javascript\nif (driver.findElement(By.id(\
    \ \"remember_me\")).isSelected()) {\n    driver.findElement(By.xpath(\"//input[@id='remember_me']/../span\"\
    )).click();\n}\n```\n\n### 23.3 Drag range (noUiSlider)\n\nnoUiSlider is a Materialize\
    \ plugin for Range control.\n\n```javascript\ndriver.get(\"https://whenwise.agileway.net/biz/wise-driving\"\
    );\ndriver.sleep(1000);\ndriver.findElement(By.id(\"slider-start-time\")).getText().then(function(the_time)\
    \ {\n    assert.equal(\"09:00\", the_time);\n});\nelem = driver.findElement(By.className(\"\
    noUi-handle-lower\"));\n// advance one hour, the offset value of 60 is try-then-find-out\n\
    driver.actions().dragAndDrop(elem, {x: 60, y: 0}).perform();\ndriver.sleep(500);\n\
    driver.findElement(By.id(\"slider-start-time\")).getText().then(function(the_time)\
    \ {\n    assert.equal(\"10:00\", the_time);\n});\n```\n\n### 23.4 Verify Toast\
    \ message\n\nToast is Materialize’s way to send user alerts.\n\n```javascript\n\
    this.timeout(timeOut);\nvar faker = require('faker');\ndriver.get(\"https://whenwise.agileway.net/sign-up\"\
    );\ndriver.findElement(By.id(\"email\")).sendKeys(faker.internet.email());\ndriver.findElement(By.id(\"\
    password\")).sendKeys(\"test01\");\ndriver.findElement(By.id(\"create-account\"\
    )).click();\n// Materialize toast fade in a few seconds\ndriver.sleep(1000);\n\
    driver.findElement(By.id(\"toast-container\")).getText().then(function(toast_text){\n\
    \    assert(toast_text.contains(\"Please check your email to activate your account\"\
    ));\n});\n```\n\n### 23.5 Modal\n\n```javascript\ndriver.get(\"https://whenwise.agileway.net/biz/wise-driving\"\
    );\ndriver.sleep(1000);\ndriver.findElement(By.id(\"reviews-link\")).click();\n\
    // wait for modal to show up\nok_btn_xpath = \"//div[@id='modal-reviews']//a[@id='modal-ok']\"\
    ;\ndriver.wait(until.elementLocated(By.xpath(ok_btn_xpath)), 4000);\n// Verify\
    \ text in modal.\ndriver.findElement(By.id(\"modal-reviews\")).getText().then(function(the_modal_text)\
    \ {\n    assert(the_modal_text.contains(\"It has been a pleasure\"));\n});\n```\n\
    \n## 24. Selenium Remote Control Server\n\nSelenium Server, formerly known as\
    \ Selenium Remote Control (RC) Server, allows testers to write Selenium tests\
    \ in their favourite language and execute them on another machine. The word ‘remote’\
    \ means that the test scripts and target browser may not be on the same machine.\n\
    \nThe Selenium Server is composed of two parts:\n\n- **Selenium Server**. A Java\
    \ server which receives commands, drives and kills browsers, with the target browser\
    \ installed on the machine.\n- **Client libraries**. Test scripts’ favourite language\
    \ bindings, such as Ruby, Java and Python.\n\n### 24.1 Selenium Server Installation\n\
    \nMake sure you have Java Runtime installed first. Download Selenium Server *selenium-server-{VERSION}.jar*\
    \ from Selenium page and place it on the computer with the browser(s) you want\
    \ to test. Then from the directory with the jar run the following Command Line:\n\
    \n```bash\njava -jar selenium-server-standalone-2.53.1.jar\n```\n\nSample output\
    \ http://www.seleniumhq.org/download/:\n\n```text\n09:34:41.616 INFO - Launching\
    \ a standalone Selenium Server\n09:34:41.747 INFO - Java: Oracle Corporation\n\
    09:34:41.747 INFO - OS: Mac OS X 10.11 x86_64\n09:34:41.778 INFO - v2.53.1, with\
    \ Core v2.53.1. Built from revision a...\n09:37:43.973 INFO - RemoteWebDriver\
    \ instances should connect to: http://127.0.0.1:4444/wd/hub\n09:37:43.973 INFO\
    \ - Selenium Server is up and running\n```\n\nThere are two options you can pass\
    \ to the server: timeout and browserTimeout.\n\n```bash\njava -jar selenium-server-standalone-2.53.1.jar\
    \ -timeout=20 -browserTimeout=60\n```\n\n### 24.2 Execute tests in specified browser\
    \ on another machine\n\nPrerequisite:\n\n- Make sure the Selenium Server is up\
    \ and running.\n- You can connect to the server via HTTP.\n- Note down the server\
    \ machine’s IP address.\n\nTo change existing local Selenium tests (running on\
    \ a local browser) to remote Selenium tests (running on a remote browser) is very\
    \ easy, just update the initialization of WebDriver instance to usingServer like\
    \ below:\n\n```javascript\nit(\"Remote control Firefox on another machine\", function()\
    \ {\n    this.timeout(timeOut);\n    driver = new webdriver.Builder()\n      \
    \  .usingServer('http://localhost:4444/wd/hub')\n        .forBrowser('firefox')\n\
    \        .build();\n    driver.get(\"http://travel.agileway.net\");\n    driver.findElement(By.name('username')).sendKeys('agileway');\n\
    \    driver.findElement(By.name('password')).sendKeys('testwise');\n    driver.findElement(By.name('commit')).click();\n\
    \    driver.quit();\n});\n```\n\nThe test scripts (client) is expected to terminate\
    \ each browser session properly, calling driver.quit.\n\n### 24.3 Selenium Grid\n\
    \nSelenium Grid allows you to run Selenium tests in parallel to cut down the execution\
    \ time. Selenium Grid includes one hub and many nodes.\n\n1. **Start the Hub**\n\
    \nThe hub receives the test requests and distributes them to the nodes.\n\n```bash\n\
    java -jar selenium-server-standalone-2.53.1.jar -role hub\n```\n\n2. **Start the\
    \ nodes**\n\nA node gets tests from the hub and run them.\n\n```bash\njava -jar\
    \ selenium-server-standalone-2.53.1.jar -role node -hub http://localhost:4444/grid/register\n\
    ```\n\nIf you starts a node on another machine, replace *localhost* with the hub’s\
    \ IP address.\n\n3. **Using grid to run tests**\n\nYou need to change the test\
    \ script to point the driver to the hub.\n\n```javascript\ndriver = new webdriver.Builder()\n\
    \    .usingServer('http://localhost:4444/wd/hub')\n    .forBrowser('chrome')\n\
    \    .build();\n```\n\nThe test will run on one of the nodes. Please note that\
    \ the timing and test case counts (from RSpec) returned is apparently not right.\n\
    \nFrankly, I haven’t yet met anyone who is able to show me a working selenium-grid\
    \ running a fair number of UI selenium tests.\n\nHere are my concerns with Selenium\
    \ Grid:\n\n- **Complexity**\n\nFor every selenium grid node, you need to configure\
    \ the node either by specifying command line parameters or a JSON file. Check\
    \ out the Grid Wiki page² for details. It is my understanding that just pushing\
    \ the tests to the hub, and it handles the rest based on the configuration. My\
    \ experience tells me that it is too good to be true. For example, here is an\
    \ error I got. While the error message is quite clear: no ChromeDriver installed.\
    \ But on which node? Shouldn’t the hub ‘know’ about that?\n\n²https://code.google.com/p/selenium/wiki/Grid2\n"
  mdcn: "\n\n## 陷阱 (Gotchas)\n\n141\n\n### UnexpectedTagNameException: Element should\
    \ have been \"select\" but was \"input\"\n\n原因：有两个具有相同“name”属性值“vip”的控件。`By.name(\"\
    vip\")` 返回第一个匹配的控件，即文本字段。知道原因后，解决方案显而易见：将定位器更改为更具体的 `By.xpath(\"//select[@name='vip']\"\
    )`。\n\n一个常见的场景如下：一个隐藏元素和一个复选框元素共享相同的 ID 和 NAME 属性。\n\n```html\n<input type=\"\
