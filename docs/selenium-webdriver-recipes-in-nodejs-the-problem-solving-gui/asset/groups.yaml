    \n一旦知道了原因，解决方案很简单：\n\n优化\n\n138\n\n- 将 Selenium WebDriver 和浏览器都升级到最新版本。像 Chrome\
    \ 浏览器通常默认开启自动更新，我建议在 Selenium WebDriver 发布几天后再升级。\n- 锁定 Selenium WebDriver 和浏览器。关闭浏览器中的自动更新，并在升级\
