- md: "\n## Preface\n\nSelenium WebDriver comes with five core bindings: Java, C#,\
    \ Python,\nand JavaScript (Node.js). I have written Selenium recipes for all other\n\
    languages except JavaScript. This is not because I don’t know JavaScript, as a\
    \ matter\nfact, I have a long history of using JavaScript and I still using it\
    \ to develop\nweb applications. JavaScript, to me, seems always associated with\
    \ Web and HTML,\nthan being a standalone scripting language. One day, overcoming\
    \ my prejudice, I gave\nSelenium with Node.js a go. I was very impressed. I found\
    \ Selenium WebDriver\nis lightweight, quick setup, and above all, test execution\
    \ is really fast.\n\nOver the years, JavaScript has evolved far beyond a client-side\
    \ scripting language, and\nhas become a powerful language which can also be used\
    \ to create server-side\nor even desktop applications (Microsoft’s new programmer’s\
    \ editor\nStudio Code is built with Node.js). Node.js is a cross-platform runtime\
    \ environment that uses\nopen-source V8 Engine execute JavaScript code as an application.\
    \ As you have\nprobably noticed, the demand for JavaScript programmers is high\
    \ (see JavaScript\ndeveloper graph in US). It comes to no surprises that Selenium\
    \ WebDriver includes\nJavaScript as one of the official language bindings.\n\n\
    The purpose of this book is to help motivated testers work better with Selenium\n\
    WebDriver in JavaScript. If you have read my other book: *Practical Web Test Automation*,\n\
    you probably know my style: practical. I will let the test scripts do most of\
    \ the\ntalking. These test scripts are ‘live’, as I have created the target site\
    \ and\nincluded offline web pages. With both, you can:\n\n1. **Identify** your\
    \ issue\n2. **Find** the recipe\n3. **Run** the test case\n4. **See** test execution\
    \ in your browser\n\n¹http://www.indeed.com/salary/Javascript-Developer-United-States.html\n\
    ²https://leanpub.com/practical-web-automation\n\n**Who should read this book**\n\
    \nThis book is for testers or programmers who are writing (or want to learn) automated\
    \ tests\nwith Selenium WebDriver. In order to get the most of book, basic (very\
    \ basic) JavaScript\nskills is required.\n\n**How to read this book**\n\nUsually,\
    \ a ‘recipe’ book is a reference book. Readers can go directly to the part that\n\
    interests them. For example, if you are testing a multiple select list and don’t\
    \ know how,\nyou can look up in the Table of Contents, then go to the chapter\
    \ 8. This book supports this style of reading.\n\nIf you are new to Selenium WebDriver,\
    \ I recommend you to try out the recipes from the\nfront to back. The recipes\
    \ in the first half of the book are arranged according to their levels of\ncomplexity,\
    \ I believe readers can get the pattern of testing with Selenium and gain confidence\n\
    after going through them.\n\n**Recipe test scripts**\n\nTo help readers learn\
    \ more effectively, this book has a dedicated site that contains the\nrecipe test\
    \ scripts, test web pages and related resources. For access code, please see the\n\
    Resources section of this book.\n\nAs an old saying goes, “*There’s more than\
    \ one way to skin a cat.*” You can achieve the same\ntesting outcome with test\
    \ scripts implemented in different ways. The recipe test scripts in\nthis book\
    \ are written for simplicity, and there is always room for improvement. But for\
    \ many,\nto understand the solution quickly and get the job done are probably\
    \ more important.\n\nIf you have a better and simpler way, please let me know.\n\
    \nAll recipe test scripts are Selenium WebDriver 3 compliant, and can be run against\
    \ Chrome,\nFirefox and Internet Explorer on multiple platforms. I plan to keep\
    \ the test scripts updated\nwith the latest stable Selenium version.\n\n³http://zhimin.com/books/selenium-recipes-nodejs\n\
    \n**Send me feedback**\n\nI would appreciate your comments, suggestions, reports\
    \ on errors in the book and the recipe\ntest scripts. You may submit your feedback\
    \ on the book site.\n\n*Zhimin Zhan*\nBrisbane, Australia\n\n## 1. Introduction\n\
    \nSelenium is a free and open source library for automated testing web applications.\
    \ Selenium\nwas originally created in 2004 by Jason Huggins, it merged with another\
    \ test framework\nWebDriver in 2011 (that’s why is named ‘selenium-webdriver’)\
    \ led by Simon Stewart at\nGoogle (update: Simon now works at Facebook). As WebDriver\
    \ is a W3C standard¹, it gains\nsupport from all major browser vendors, as a result,\
    \ Selenium quickly become\nthe de facto framework for automated testing web applications.\n\
    \n### 1.1 Selenium language bindings\n\nSelenium tests can be written in multiple\
    \ programming languages such as Java, C#, Python,\nRuby and JavaScript (the core\
    \ ones). All examples in this book are written in Selenium with\nJavaScript binding.\
    \ As you will see from the examples below, the use of Selenium in different\n\
    bindings are very similar. Once you master one, you can apply it to others quite\
    \ easily. Take\na look at a simple Selenium test script in five different language\
    \ bindings: JavaScript, Java,\nC#, Python and Ruby.\n\n**JavaScript**:\n\n```javascript\n\
    **var** webdriver = require('selenium-webdriver');\n\n**var** driver = **new**\
    \ webdriver.Builder()\n  .forBrowser('chrome')\n  .build();\n\ndriver.get('http://www.google.com/ncr');\n\
    \ndriver.findElement(webdriver.By.name('q')).sendKeys('webdriver');\n\ndriver.findElement(webdriver.By.name('btnG')).click();\n\
    \ndriver.wait(webdriver.until.titleIs('webdriver - Google Search'), 1000);\n\n\
    driver.quit();\n```\n\n¹https://www.w3.org/TR/webdriver/\n\n## CONTENTS\n\n**22.\
