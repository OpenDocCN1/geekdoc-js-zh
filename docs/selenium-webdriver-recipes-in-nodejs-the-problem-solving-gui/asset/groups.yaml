    定位网页元素


    **var** webdriver = require(''selenium-webdriver''),

    By = webdriver.By,

    until = webdriver.until;


    **var** driver = **new** webdriver.Builder()

    .forBrowser(''chrome'')

    .build();


    //...


    driver.findElement(By.id("cancel_link")).click();


    // 链接

    driver.findElement(By.id("username")).sendKeys("agileway");


    // 文本框

    driver.findElement(By.id("alert_div")).getText();


    // HTML Div元素


    ### 2.3 通过 Name 查找元素


    name 属性用于表单控件，如文本字段和单选按钮。在提交表单时，name 属性的值会被传递到服务器。从发生改变的最小概率来看，name 属性可能仅次于 ID。


    driver.findElement(By.name("comment")).sendKeys("Selenium Cool");


    ### 2.4 通过 Link Text 查找元素


    仅适用于超链接。使用链接的文本可能是点击链接最直接的方法，因为这是我们在页面上看到的内容。


    driver.findElement(By.linkText("Cancel")).click();


    ### 2.5 通过 Partial Link Text 查找元素


    Selenium 允许你通过部分文本识别超链接控件。当文本是动态生成时，这非常有用。换句话说，网页上的文本在下次访问时可能会不同。我们可能可以使用这些动态生成的链接文本共享的共同文本来识别它们。


    // 将点击 "Cancel" 链接

    driver.findElement(By.partialLinkText("ance")).click();


    ### 2.6 通过 XPath 查找元素


    XPath 即 XML 路径语言，用于从 XML 文档中选择节点的查询语言。当浏览器渲染网页时，它将其解析为 DOM 树或类似结构。XPath 可以引用 DOM
    树中的某个节点。如果这听起来太技术化，别担心，只需记住 XPath 是查找特定网页控件最强大的方法。


    // 点击 ''div2'' 容器下的复选框

    driver.findElement(By.xpath("//*[@id=''div2'']/input[@type=''checkbox'']")).click();


    一些测试人员对 XPath 的复杂性感到畏惧。然而在实践中，测试人员需要掌握的 XPath 范围非常有限。


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_0.png)


    **避免使用从开发者工具复制的 XPath**


    浏览器开发者工具（右键点击选择“检查元素”以显示）对于识别网页中的网页元素非常有用。你可以在那里获取网页元素的 XPath，如下所示（在 Chrome 中）：


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_1.png)


    示例中第二个 “Click here” 链接的复制 XPath：

    //*[@id="container"]/div[3]/div[2]/a


    它是可以的。但是，我不建议这种方法，因为测试脚本是脆弱的。如果开发者在 `<div id=''container''>` 下添加了另一个 `div`，则复制的
    XPath 对于该元素将不再正确，而 `//div[contains(text(), "Second")]/a[text()="Click here"]`
    仍然有效。


    总而言之，当 id、name 或 linkText 不适用时，XPath 是定位网页元素的一种非常强大的方法。尝试使用对网页元素周围结构变化不敏感的 XPath
    表达式。


    ### 2.7 通过 Tag Name 查找元素


    HTML 中的标签名集合是有限的。换句话说，网页上的许多元素共享相同的标签名。我们通常不单独使用 tagName 定位器来定位元素。我们经常在链式定位器中将其与其他配合使用（见下文节）。然而，有一个例外。


    driver.findElement(By.tagName("body")).getText();


    上面的测试语句返回网页的文本视图，这是一个非常有用的功能，因为 Selenium WebDriver 没有内置方法返回网页的文本。但是，与此 JavaScript
    绑定不同，我们无法直接使用这种方法。例如，下面的脚本打印 body 的文本。


    **var** pageText = driver.findElement(By.tagName("body")).getText();

    console.log(pageText);


    输出是一个 ManagedPromise。

    ManagedPromise {

    flow_:

    ControlFlow {

    propagateUnhandledRejections_: **true**,

    ...

    }


    **什么是 Promise？**


    Promise 是“一个代表值（或值的最终计算结果）的对象”。从本质上说，promise 是尚未解析的异步操作的结果。如果你不熟悉 JavaScript，这可能会非常令人困惑。好消息是，在
    Selenium WebDriver 的上下文中，当需要解析 promise 时，你很快就会发现这种模式。


    要解析 promise，使用 .then(function(returnedValue)){ ... }。


    driver.findElement(By.tagName("body")).getText().then(**function**(body_text){

    console.log(body_text)

    });


    ### 2.8 通过 Class 查找元素


    HTML 元素的 class 属性用于样式化。它也可以用于识别元素。通常，一个 HTML 元素的 class 属性有多个值，如下所示。


    <**a** href="back.html" class="btn btn-default">Cancel</**a>

    <**input** type="submit" class="btn btn-deault btn-primary">Submit</**input>**


    你可以使用其中任何一个。


    driver.findElement(By.className("btn-primary")).click(); // 提交按钮

    driver.findElement(By.className("btn")).click();

    // 取消链接


    className 对于测试 JavaScript/CSS 库（如 TinyMCE）非常方便，这些库通常使用一组定义的类名。


    // 内联编辑

    driver.findElement(By.id("client_notes")).click();

    driver.sleep(500);

    driver.findElement(By.className("editable-textarea")).sendKeys("inline");

    driver.sleep(500);

    driver.findElement(By.className("editable-submit")).click();


    ### 2.9 通过 CSS 查找元素


    你也可以使用 CSS Path 来定位网页元素。


    driver.findElement(By.css("#div2 > input[type=''checkbox'']")).click();


    然而，使用 CSS 往往更容易受到网页结构变化的影响。


    ### 2.10 链 findElement 查找子元素


    对于包含多个具有相同元素的页面（如下所示），我们可以使用 XPath 定位器。


    <**div** id="div1">

    <**input** type="checkbox" name="same" value="on">Div 1 中的相同复选框

    </**div>**

    <**div** id="div2">

    <**input** type="checkbox" name="same" value="on">Div 2 中的相同复选框

    </**div>**


    还有另一种方法：链式 findElement 查找子元素。


    driver.findElement(By.id("div2")).findElement(By.name("same")).click();


    ### 2.11 使用定位器名称作为 JSON 属性


    你可以如下所示将定位器作为 JSON 属性使用。


    driver.findElement({name: ''comment''}).sendKeys("JSON")

    // 文本框

    driver.findElement({css: "#div1 > input[type=''checkbox'']"}).click();

    driver.findElement({className: "btn-primary"}).click();

    // 提交按钮


    ### 2.12 查找多个元素


    顾如名，findElements 返回匹配的元素列表。其语法与 findElement 完全相同，即可以使用任何定位器。测试语句将找到 div#container
    下的两个复选框并点击第二个。


