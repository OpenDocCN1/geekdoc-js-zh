  mdcn: "\n\n## 前言\n\nSelenium WebDriver 提供了五个核心绑定：Java、C#、Python 和 JavaScript (Node.js)。除了\
    \ JavaScript 之外，我为所有其他语言都编写了 Selenium 菜谱（recipes）。这并不是因为我不懂 JavaScript，事实上，我有长期的\
    \ JavaScript 使用历史，并且仍然在使用它来开发 Web 应用程序。对我来说，JavaScript 似乎总是与 Web 和 HTML 相关联，而不是作为一种独立的脚本语言。有一天，我克服了偏见，尝试了配合\
    \ Node.js 使用 Selenium。它给我留下了深刻的印象。我发现 Selenium WebDriver 轻量化、安装快速，最重要的是，测试执行速度非常快。\n\
    \n多年来，JavaScript 的进化已经远远超了客户端脚本语言的范畴，成为了一种强大的语言，还可以用于创建服务器端甚至桌面应用程序（微软的新型程序员编辑器\
    \ Studio Code 就是就是用 Node.js 构建的）。Node.js 是一个跨平台运行时环境，使用开源 V8 引擎将 JavaScript 代码作为应用程序执行。正如你可能注意到的，对\
    \ JavaScript 程序员的需求很高（请参见美国 JavaScript 开发者图表）。Selenium WebDriver 将 JavaScript\
    \ 作为官方语言绑定之一也并不为意外。\n\n本书的目的是帮助有积极性的测试人员更好地使用 JavaScript 配合 Selenium WebDriver。如果你读过我的另一本书：*实用\
    \ Web 测试自动化》（*Practical Web Test Automation*），你可能知道我的风格：实用。我会让测试脚本来完成大部分说明。这些测试脚本是“活的”，因为我创建了目标网站并包含了离线网页。通过这两者，你可以：\n\
    \n1. **识别**你的问题\n2. **找到**对应的菜谱\n3. **运行**测试用例\n4. **在**浏览器中查看测试执行结果\n\n¹http://www.indeed.com/salary/Javascript-Developer-United-States.html\n\
    ²https://leanpub.com/practical-web-automation\n\n**谁应该读这本书**\n\n本书适用于正在使用 Selenium\
    \ WebDriver 编写（或想学习）自动化测试的测试人员或程序员。为了充分利用书中的内容，需要具备基础（非常基础）的 JavaScript 技能。\n\n\
    **如何阅读这本书**\n\n通常情况下，“菜谱”类书籍是一本参考书。读者可以直接跳到感兴趣的部分。例如，如果你正在测试一个多选列表但不知道如何操作，可以查看目录，然后跳转到第\
    \ 8 章。本书支持这种阅读风格。\n\n如果你是 Selenium WebDriver 的新手，我建议你从头到尾尝试一遍这些菜谱。书的前半部分菜谱按照复杂度排序，我相信读者在完成这些练习后，可以掌握使用\
    \ Selenium 进行测试的模式并获得信心。\n\n**菜谱测试脚本**\n\n为了帮助读者更有效地学习，本书有一个专门的网站，包含了菜谱测试脚本、测试网页和相关资源。访问代码请参阅本书的“资源”章节。\n\
    \n正如俗语所说，“*活学不厌厌*。”你可以通过不同方式实现的测试脚本来实现相同的测试结果。书中的菜谱测试脚本是为了简单而编写的，总有改进空间。但对许多人来说，快速理解解决方案并完成工作可能更重要。\n\
    \n如果你有更好、更简单的方法，请告诉我。\n\n所有的菜谱测试脚本都符合 Selenium WebDriver 3 标准，可以在多个平台上的 Chrome、Firefox\
    \ 和 Internet Explorer 上运行。我计划将测试脚本更新到最新的稳定 Selenium 版本。\n\n³http://zhimin.com/books/selenium-recipes-nodejs\n\
    \n**给我发送反馈**\n\n我非常感谢你的评论、建议以及对书中和菜谱测试脚本错误的报告。你可以在书籍网站上提交你的反馈。\n\n*占敏 (Zhimin\
    \ Zhan)*\n澳大利亚布斯班\n\n## 1. 简介\n\nSelenium 是一个用于 Web 应用程序自动化测试的开源库。Selenium 最初由\
    \ Jason Huggins 于 2004 年创建，它在 2011 年与另一个测试框架 WebDriver 合并（这就是为什么它命名为“selenium-webdriver”），该框架由\
    \ Google 的 Simon Stewart 领导（更新：Simon 现在在 Facebook 工作）。由于 WebDriver 是 W3C 标准¹，它获得了所有主要浏览器厂商的支持，结果\
    \ Selenium 迅速成为 Web 应用程序自动化测试的事实框架。\n\n### 1.1 Selenium 语言绑定\n\nSelenium 测试可以用多种编程语言编写，如\
    \ Java、C#、Python、Ruby 和 JavaScript（核心语言）。书中所有的示例都是用 JavaScript 绑定 Selenium 编写的。正如你从下面的示例中看到的，不同绑定中的\
    \ Selenium 用法非常相似。一旦掌握了其中一种，就可以很容易应用到其他语言。看看五种不同语言定义的简单 Selenium 测试脚本：JavaScript、Java、C#、Python\
    \ 和 Ruby。\n\n**JavaScript**:\n\n```javascript\n**var** webdriver = require('selenium-webdriver');\n\
    \n**var** driver = **new** webdriver.Builder()\n  .forBrowser('chrome')\n  .build();\n\
    \ndriver.get('http://www.google.com/ncr');\n\ndriver.findElement(webdriver.By.name('q')).sendKeys('webdriver');\n\
    \ndriver.findElement(webdriver.By.name('btnG')).click();\n\ndriver.wait(webdriver.until.titleIs('webdriver\
    \ - Google Search'), 1000);\n\ndriver.quit();\n```\n\n¹https://www.w3.org/TR/webdriver/\n\
