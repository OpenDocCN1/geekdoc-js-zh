    **21.3 Avoid programming if-else block code if**


    **possible**


    It is common that programmers write test scripts in a similar way as coding applications,


    while I cannot say it is wrong. For me, I prefer simple, concise and easy to read
    test scripts.


    Whenever possible, I prefer one line of test statement matching one user operation.
    This can


    be quite helpful when debugging test scripts. For example, By using ternary operator
    ? :,


    the below 7 lines of test statements


    driver.findElement(By.id("notes")).getText().then(**function**(notesText){


    **if** (refNo.contains("VIP")) { // Special


    assert.equal("Please go upstairs", notesText)


    } **else** {


    assert.equal("", notesText)


    }


    });


    is reduced to three.


    driver.findElement(By.id("notes")).getText().then(**function**(notesText){


    assert.equal(refNo.contains("VIP") ? "Please go upstair" : "", notesText)


    });


