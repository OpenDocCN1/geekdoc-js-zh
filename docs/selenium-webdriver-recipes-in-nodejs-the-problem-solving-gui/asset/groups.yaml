    Locating web elements


    **var** webdriver = require(''selenium-webdriver''),

    By = webdriver.By,

    until = webdriver.until;


    **var** driver = **new** webdriver.Builder()

    .forBrowser(''chrome'')

    .build();


    //...


    driver.findElement(By.id("cancel_link")).click();


    // Link

    driver.findElement(By.id("username")).sendKeys("agileway");


    // Textfield

    driver.findElement(By.id("alert_div")).getText();


    // HTML Div element


    ### 2.3 Find element by Name


    The name attributes are used in form controls such as text fields and radio buttons.
    The values of the name attributes are passed to the server when a form is submitted.
    In terms of least likelihood of a change, the name attribute is probably only
    second to ID.


    driver.findElement(By.name("comment")).sendKeys("Selenium Cool");


    ### 2.4 Find element by Link Text


    For Hyperlinks only. Using a link’s text is probably the most direct way to click
    a link, as it is what we see on the page.


    driver.findElement(By.linkText("Cancel")).click();


    ### 2.5 Find element by Partial Link Text


    Selenium allows you to identify a hyperlink control with a partial text. This
    can be quite useful when the text is dynamically generated. In other words, the
    text on one web page might be different on your next visit. We might be able to
    use the common text shared by these dynamically generated link texts to identify
    them.


    // will click the "Cancel" link

    driver.findElement(By.partialLinkText("ance")).click();


    ### 2.6 Find element by XPath


    XPath, the XML Path Language, is a query language for selecting nodes from an
    XML document. When a browser renders a web page, it parses it into a DOM tree
    or similar. XPath can be used to refer to a certain node in the DOM tree. If this
    sounds too technical for you, don’t worry, just remember XPath is the most powerful
    way to find a specific web control.


    // clicking the checkbox under ''div2'' container

    driver.findElement(By.xpath("//*[@id=''div2'']/input[@type=''checkbox'']")).click();


    Some testers feel intimidated by the complexity of XPath. However, in practice,
    there is only limited scope of XPath to master for testers.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_0.png)


    **Avoid using copied XPath from Browser’s Developer Tool**


    Browser’s Developer Tool (right click to select ‘Inspect element’ to show) is
    very useful for identifying a web element in web page. You may get the XPath of
    a web element there, as shown below (in Chrome):


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_31_1.png)


    The copied XPath for the second “Click here” link in the example:

    //*[@id="container"]/div[3]/div[2]/a


    It works. However, I do not recommend this approach as the test script is fragile.
    If developer adds another div under <div id=''container''>`, the copied XPath
    is no longer correct for the element while //div[contains(text(), "Second")]/a[text()="Click
    here"] still works.


    In summary, XPath is a very powerful way for locating web elements when id, name
    or linkText are not applicable. Try to use a XPath expression that is less vulnerable
    to structure changes around the web element.


    ### 2.7 Find element by Tag Name


    There are a limited set of tag names in HTML. In other words, many elements share
    the same tag names on a web page. We normally don’t use the tagName locator by
    itself to locate an element. We often use it with others in a chained locators
    (see the section below). However, there is an exception.


    driver.findElement(By.tagName("body")).getText();


    The above test statement returns the text view of a web page, this is a very useful
    one as Selenium WebDriver does not have built-in method return the text of a web
    page. However, unlike this JavaScript binding, we cannot use this way directly.
    For example, the script below prints out the body’s text.


    **var** pageText = driver.findElement(By.tagName("body")).getText();

    console.log(pageText);


    The output is a ManagedPromise.

    ManagedPromise {

    flow_:

    ControlFlow {

    propagateUnhandledRejections_: **true**,

    ...

    }


    **What is a Promise?**


    A Promise is “an object that represents a value, or the eventual computation of
    a value”. Essentially, a promise is a result of async operation that is not resolved
    yet. If you are not familiar with JavaScript, it can be quite confusing. Good
    news is that, for the context of Selenium WebDriver, you will soon find out the
    pattern when there is need to resolve a promise.


    To resolve a promise, use .then(function(returnedValue)){ ... }.


    driver.findElement(By.tagName("body")).getText().then(**function**(body_text){

    console.log(body_text)

    });


    ### 2.8 Find element by Class


    The class attribute of a HTML element is used for styling. It can also be used
    for identifying elements. Commonly, a HTML element’s class attribute has multiple
    values, like below.


    <**a** href="back.html" class="btn btn-default">Cancel</**a>

    <**input** type="submit" class="btn btn-deault btn-primary">Submit</**input>**


    You may use any one of them.


    driver.findElement(By.className("btn-primary")).click(); // Submit button

    driver.findElement(By.className("btn")).click();

    // Cancel link


    The className locator is convenient for testing JavaScript/CSS libraries (such
    as TinyMCE) which typically use a set of defined class names.


    // inline editing

    driver.findElement(By.id("client_notes")).click();

    driver.sleep(500);

    driver.findElement(By.className("editable-textarea")).sendKeys("inline");

    driver.sleep(500);

    driver.findElement(By.className("editable-submit")).click();


    ### 2.9 Find element by CSS


    You may also use CSS Path to locate a web element.


    driver.findElement(By.css("#div2 > input[type=''checkbox'']")).click();


    However, the use of CSS is generally more prone to structure changes of a web
    page.


    ### 2.10 Chain findElement to find child elements


    For a page containing more than one elements with the same attributes, like the
    one below, we could use XPath locator.


    <**div** id="div1">

    <**input** type="checkbox" name="same" value="on"> Same checkbox in Div 1

    </**div>**

    <**div** id="div2">

    <**input** type="checkbox" name="same" value="on"> Same checkbox in Div 2

    </**div>**


    There is another way: chain findElement to find a child element.


    driver.findElement(By.id("div2")).findElement(By.name("same")).click();


    ### 2.11 Use locator name as JSON attribute


    You may use locator as JSON attribute as below.


    driver.findElement({name: ''comment''}).sendKeys("JSON")

    // a text box

    driver.findElement({css: "#div1 > input[type=''checkbox'']"}).click();

    driver.findElement({className: "btn-primary"}).click();

    // Submit button


    ### 2.12 Find multiple elements


    As its name suggests, findElements return a list of matched elements back. Its
    syntax is exactly the same as findElement, i.e. can use any of locators. The test
    statements will find two checkboxes under div#container and click the second one.


    **let** xpathStr = "//div[@id=''container'']//input[@type=''checkbox'']";

    **var** checkboxElems = driver.findElements(By.xpath(xpathStr))

    driver.sleep(500)

    // console.log("XXX: " + checkboxElems.length + "\n");

    driver.findElements(By.xpath(xpathStr)).then(**function**(checkboxElems) {

    checkboxElems[1].click();

    // second one

    });


    Sometimes findElement fails due to multiple matching elements on a page, which
    you were not aware of. findElements will come in handy to find them.


    ### 3 Hyperlink


    Hyperlinks (or links) are fundamental elements of web pages. As a matter of fact,
    it is hyperlinks that makes the World Wide Web possible. A sample link is provided
    below, along with the HTML source.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_35_0.png)


    **HTML Source**


    <**a** href="index.html" id="recommend_selenium_link" class="nav" data-id="123"

    style="font-size: 14px;">Recommend Selenium</**a>**


    ### 3.1 Click a link by text


    Using text is probably the most direct way to click a link in Selenium, as it
    is what we see on the page.


    // driver.get("file://" + __dirname + "/../../site/link.html");

    driver.findElement(By.linkText("Recommend Selenium")).click();


    ### 3.2 Click a link by ID


    driver.findElement(By.id("recommend_selenium_link")).click();


    Furthermore, if you are testing a web site with multiple languages, using IDs
    is probably the only feasible option. You do not want to write test scripts like
    below:

