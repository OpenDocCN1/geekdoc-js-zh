- md: "\n## 16. Browser Profile and Capabilities\n\nSelenium can start browser instances\
    \ with various profile preferences which can be quite useful. Obviously, some\
    \ preference settings are browser specific, so you might take some time to explore.\
    \ In this chapter, I will cover some common usages.\n\n### 16.1 Get browser type\
    \ and version\n\nDetecting browser type and version is useful to write custom\
    \ test scripts for different browsers.\n\n```javascript\ndriver = new webdriver.Builder().forBrowser('chrome').build();\n\
    \n// console.log(driver.getCapabilities()); // returns ManagedPromise object\n\
    \ndriver.getCapabilities().then(function(caps){\n  assert.equal(\"chrome\", caps.get(\"\
    browserName\"));\n  // firefox/chrome/internet explorer\n  console.log(caps.get(\"\
    version\")); // example: \"46.0\", \"51.0.2704.103\"\n});\n```\n\n### 16.2 Set\
    \ HTTP Proxy for Browser\n\nHere is an example to set HTTP proxy server for Chrome.\n\
    \n```javascript\nvar webdriver = require('selenium-webdriver'),\n    proxy = require('selenium-webdriver/proxy');\n\
    \nvar driver = new webdriver.Builder()\n  .forBrowser('chrome')\n  .setProxy(proxy.manual({http:\
    \ 'proxy:3128'}))\n  .build();\n\n// if proxy not set up, shall not able to visit\n\
    driver.get(\"http://testwisely.com/demo\").then(null, function(err) {\n  console.log(\"\
    Proxy error: \" + err);\n});\n```\n\n### 16.3 Verify file download in Chrome with\
    \ Custom User Preferences\n\nTo efficiently verify a file is downloaded, we would\
    \ like to:\n\n- save the file to a specific folder\n- avoid “Open with or Save\
    \ File” dialog\n\n```javascript\nvar chrome = require('selenium-webdriver/chrome');\n\
    var chromeOptions = new chrome.Options();\nvar path = require('path');\nvar tmp_dir\
    \ = path.normalize(__dirname + \"/../tmp/\");\n\nchromeOptions.setUserPreferences({'download.default_directory':\
    \ tmp_dir});\n\nvar driver = new webdriver.Builder()\n  .forBrowser('chrome')\n\
    \  .setChromeOptions(chromeOptions)\n  .build();\n\ndriver.get(\"http://zhimin.com/books/pwta\"\
    );\ndriver.findElement(By.linkText(\"Download\")).click().then(function() {\n\
    \  driver.sleep(10000); // wait 10 seconds for downloading to complete\n  var\
    \ fs = require('fs');\n  var filePath = tmp_dir + \"practical-web-test-automation-sample.pdf\"\
    ;\n  assert(fs.statSync(filePath).isFile());\n});\n```\n\nMore Chrome preferences:\
    \ http://src.chromium.org/svn/trunk/src/chrome/common/pref_names.cc\n\n### 16.4\
    \ Test downloading PDF in Firefox with Custom Profile\n\n```javascript\nvar firefox\
    \ = require('selenium-webdriver/firefox')\nvar path = require('path');\nvar myDownloadFolder\
    \ = path.normalize(__dirname + \"/../tmp/\");\n\nvar profile = new firefox.Profile();\n\
    \nprofile.setPreference(\"browser.download.folderList\", 2);\nprofile.setPreference(\"\
    browser.download.dir\", myDownloadFolder);\nprofile.setPreference(\"browser.helperApps.neverAsk.saveToDisk\"\
    , \"application/pdf\");\n// disable Firefox's built-in PDF viewer\nprofile.setPreference(\"\
    pdfjs.disabled\", true);\n\nvar options = new firefox.Options().setProfile(profile);\n\
    var driver = new webdriver.Builder().forBrowser('firefox')\n  .setFirefoxOptions(options)\n\
    \  .build();\n\ndriver.get(\"http://zhimin.com/books/pwta\");\ndriver.findElement(By.linkText(\"\
    Download\")).click().then(function() {\n  driver.sleep(10000); // wait 10 seconds\
    \ for downloading to complete\n  var fs = require('fs');\n  var filePath = myDownloadFolder\
    \ + \"practical-web-test-automation-sample.pdf\";\n  assert(fs.statSync(filePath).isFile());\n\
    });\n```\n\n### 16.5 Bypass basic authentication by embedding username and password\
    \ in URL\n\nAuthentication dialogs, like the one below, can be troublesome for\
    \ automated testing.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_99_0.png)\n\n\
    A very simple way to get pass Basic or NTLM authentication dialogs: prefix username\
    \ and password in the URL.\n\n```javascript\ndriver = new webdriver.Builder().forBrowser('firefox').build();\n\
    driver.get(\"http://tony:password@itest2.com/svn-demo/\")\n// got in, click a\
    \ link\ndriver.findElement(By.linkText(\"tony/\")).click();\n```\n\n### 16.6 Bypass\
    \ basic authentication with Firefox AutoAuth plugin\n\nThere is another complex\
    \ but quite useful approach to bypass basic authentication: use a browser extension.\
    \ Take Firefox for example, “Auto Login” submits HTTP authentication dialogs remembered\
    \ passwords.\n\nBy default, Selenium starts Firefox with an empty profile, which\
    \ means no remembered passwords and extensions. We can instruct Selenium to start\
    \ Firefox with an existing profile.\n\n- Start Firefox with a dedicated profile.\
    \ Run the command below (from command line)\n  Windows: `\"C:\\Program Files (x86)\\\
    Mozilla Firefox\\firefox.exe\" -p`\n  Mac: `/Applications/Firefox.app/Contents/MacOS/firefox-bin\
    \ -p`\n- Create a profile (I name it ‘testing’) and start Firefox with this profile\n\
    \  https://addons.mozilla.org/en-US/firefox/addon/autoauth/\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_101_0.png)\n\
    \n- Install autoauth plugin. A simple way: drag the file *autoauth-3.1.1-an.fx.xpi*\
    \ (included with the test project) to Firefox window.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_101_1.png)\n\
    \n- Visit the web site requires authentication. Manually type the user name and\
    \ password. Click ‘Remember’.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_102_0.png)\n\
    \nNow the preparation work is done (and only need to be once). Prerequisite: the\
    \ password is already remembered in 'testing'.\n\n```javascript\nvar firefox =\
    \ require('selenium-webdriver/firefox')\nvar path = require('path');\nvar AUTOAUTH_EXTENSION\
    \ = __dirname + '/../autoauth-3.1.1-an.fx.xpi';\n\nvar profile = new firefox.Profile();\n\
    profile.setPreference('general.useragent.override', 'foo;bar');\nprofile.addExtension(AUTOAUTH_EXTENSION);\n\
    \nvar options = new firefox.Options().setProfile(profile);\nvar driver = new webdriver.Builder().forBrowser('firefox')\n\
    \  .setFirefoxOptions(options)\n  .build();\n\ndriver.get(\"http://tony:password@itest2.com/svn-demo/\"\
    )\ndriver.findElement(By.linkText(\"tony/\")).click();\n```\n\nThe ‘testing’ profile\
    \ name must be supplied, otherwise it won’t work.\n\n### 16.7 Manage Cookies\n\
    \n```javascript\ndriver.get(\"http://travel.agileway.net\")\ndriver.manage().getCookies().then(function(cookies)\
    \ {\n  assert.equal(1, cookies.length);\n});\n\ndriver.manage().addCookie({name:\
    \ 'username', value: 'agileway'});\ndriver.manage().getCookies().then(function(cookies)\
    \ {\n  assert.equal(2, cookies.length);\n});\n```\n\n### 16.8 Headless browser\
    \ testing with PhantomJS\n\nA headless browser is a web browser without a graphical\
    \ interface. The main benefit of headless browser testing is performance. PhantomJS\
    \ is a headless browser that built on top of WebKit, the engine behind both Safari\
    \ and Chrome. First of all, you need to download phantomjs.exe and put it in PATH.\n\
    \n```javascript\ndriver = new webdriver.Builder().forBrowser('phantomjs').build();\n\
    driver.get(\"http://travel.agileway.net\")\ndriver.getTitle().then(function(the_title){\n\
    \  assert.equal(\"Agile Travel\", the_title)\n});\ndriver.quit();\n```\n\n###\
    \ Be aware of headless browser simulation in test automation\n\nFrankly, I am\
    \ not big fan of headless testing with browser simulation for the reasons below:\n\
    \n- It is NOT a real browser.\n- I need to inspect the web page when a test failed,\
    \ I cannot do that with PhantomJS.\n- To achieve faster execution time, I prefer\
    \ distributing tests to multiple build agents to run them in parallel as a part\
    \ of Continuous Testing process. That way, I get not only much faster execution\
    \ time (throwing in more machines), also get useful features.\n\n³http://phantomjs.org/\n"
  mdcn: "\n\n## 16. 浏览器配置与能力\n\nSelenium 可以启动带有各种配置偏好的浏览器实例，这非常有用。显然，某些偏好设置是特定于浏览器的，因此你可能需要花时间来探索。在本章中，我将介绍一些常见的用法。\n\
    \n### 16.1 获取浏览器类型和版本\n\n检测浏览器类型和版本对于为不同的浏览器编写自定义测试脚本非常有。\n\n```javascript\ndriver\
    \ = new webdriver.Builder().forBrowser('chrome').build();\n\n// console.log(driver.getCapabilities());\
    \ // 返回 ManagedPromise 对象\n\ndriver.getCapabilities().then(function(caps){\n \
    \ assert.equal(\"chrome\", caps.get(\"browserName\"));\n  // firefox/chrome/internet\
    \ explorer\n  console.log(caps.get(\"version\")); // example: \"46.0\", \"51.0.2704.103\"\
    \n});\n```\n\n### 16.2 为浏览器设置 HTTP 代理\n\n以下为 Chrome 设置 HTTP 代理服务器的示例。\n\n```javascript\n\
    var webdriver = require('selenium-webdriver'),\n    proxy = require('selenium-webdriver/proxy');\n\
    \nvar driver = new webdriver.Builder()\n  .forBrowser('chrome')\n  .setProxy(proxy.manual({http:\
    \ 'proxy:3128'}))\n  .build();\n\n// 如果代理未设置，将无法访问\ndriver.get(\"http://testwisely.com/demo\"\
    ).then(null, function(err) {\n  console.log(\"Proxy error: \" + err);\n});\n```\n\
    \n### 16.3 使用自定义用户偏好验证 Chrome 中的文件下载\n\n为了高效地验证文件已下载，我们希望：\n\n- 将文件保存到特定文件夹\n\
    - 避免“打开或保存文件”对话框\n\n```javascript\nvar chrome = require('selenium-webdriver/chrome');\n\
    var chromeOptions = new chrome.Options();\nvar path = require('path');\nvar tmp_dir\
    \ = path.normalize(__dirname + \"/../tmp/\");\n\nchromeOptions.setUserPreferences({'download.default_directory':\
    \ tmp_dir});\n\nvar driver = new webdriver.Builder()\n  .forBrowser('chrome')\n\
    \  .setChromeOptions(chromeOptions)\n  .build();\n\ndriver.get(\"http://zhimin.com/books/pwta\"\
    );\ndriver.findElement(By.linkText(\"Download\")).click().then(function() {\n\
    \  driver.sleep(10000); // 等待 10 秒完成下载\n  var fs = require('fs');\n  var filePath\
    \ = tmp_dir + \"practical-web-test-automation-sample.pdf\";\n  assert(fs.statSync(filePath).isFile());\n\
    });\n```\n\n更多 Chrome 偏好：http://src.chromium.org/svn/trunk/src/chrome/common/pref_names.cc\n\
    \n### 16.4 使用自定义配置测试 Firefox 中下载 PDF\n\n```javascript\nvar firefox = require('selenium-webdriver/firefox')\n\
    var path = require('path');\nvar myDownloadFolder = path.normalize(__dirname +\
    \ \"/../tmp/\");\n\nvar profile = new firefox.Profile();\n\nprofile.setPreference(\"\
    browser.download.folderList\", 2);\nprofile.setPreference(\"browser.download.dir\"\
    , myDownloadFolder);\nprofile.setPreference(\"browser.helperApps.neverAsk.saveToDisk\"\
    , \"application/pdf\");\n// 禁用 Firefox 内置的 PDF 查看器\nprofile.setPreference(\"pdfjs.disabled\"\
    , true);\n\nvar options = new firefox.Options().setProfile(profile);\nvar driver\
    \ = new webdriver.Builder().forBrowser('firefox')\n  .setFirefoxOptions(options)\n\
