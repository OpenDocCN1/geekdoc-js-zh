    **16\. Browser Profile and**


    **Capabilities**


    Selenium can start browser instances with various profile preferences which can
    be quite


    useful. Obviously, some preference settings are browser specific, so you might
    take some


    time to explore. In this chapter, I will cover some common usages.


    **16.1 Get browser type and version**


    Detecting browser type and version is useful to write custom test scripts for
    different


    browsers.


    driver = **new** webdriver.Builder().forBrowser(''chrome'').build();


