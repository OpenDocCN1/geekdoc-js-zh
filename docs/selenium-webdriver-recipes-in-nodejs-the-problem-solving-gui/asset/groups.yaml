    ## Appendix - Continuous Testing


    162


    ### Create Build Project in BuildWise


    BuildWise uses a concept of ‘Project’. A quick way to create a project in BuildWise
    is providing a name (for display), an identifier, and a local working folder containing
    test scripts. To make it easy for beginners, BuildWise includes a set of sample
    project configurations (with code hosted on Github) for different test frameworks.
    In the tutorial, I select ‘**Fill demo project**’ → ‘**Mocha (Node.js)**’.


    This will create the project *AgileTravel Quick Build Mocha* in BuildWise.


    ### Trigger test execution manually


    To start a build (for our purpose, ‘Build’ means execution of automated functional
    tests), click ‘Build Now’ button.


    The colour of the lava lamp (for the project) is now changed to orange, indicating
    a build is under way.


    Soon you will see a browser window launching and your tests executing.


    ### Feedback while test execution in progress


    Click a build label (such as ‘1 :building’) to show details of test execution:


    You can see results of a test script as soon as it finishes execution, no need
    to wait for the whole suite to complete. The above screenshot was taken when the
    first test script (containing 2 test cases) finished execution.


    You may inspect test failures (if any) on BuildWise. From the error or failure
    description, we can identify the cause. From line numbers in the error trace,
    we can easily navigate to the test case where the error occurred.


    Please note that the tests are executed on the build server, not on your machine
    (unless you are running BuildWise locally). You can now open test cases in TestWise
    on your computer and run them, without having to wait for the CI build to complete.


    ### Build finished


    When a test execution completes, you will get the full test results shown on BuildWise.
    You can export them to an Excel spreadsheet. For the build below, only one out
    of five automated test cases failed.


    Visit the home page of BuildWise server, a red lava lamp is shown next to the
    project.


    To fix a broken build, analyse the cause, update test scripts, and then trigger
    another build on BuildWise.


    If all tests pass, you will be rewarded with a green lava lamp on the dashboard
    page.


    ### Notification


    You can configure continuous integration servers to send notifications such as
    Emails and Slack immediately after a build has finished. The below is a set of
    Slack notifications sent from BuildWise:


    ### Review


    It is not that hard, is it? If you have been developing Selenium WebDriver tests
    using RSpec syntax, getting your tests running in BuildWise is quite straight
    forward. You can apply BuildWise configuration and the build script (**Rakefile**)
    of this sample project to your project with little modification.


    Continuous Testing is becoming a hot topic in software industry, as it is the
    key process of DevOps. Obviously, this chapter is just an introduction, the main
    purpose is to show a simple and effective way of running your whole automated
    test suite, separately from your testing IDE. For more on this topic, please look
    out to my upcoming book: Continuous Web and API Testing⁵.


    ⁵https://leanpub.com/continuous-web-and-api-testing


    ## Afterword


    First of all, if you haven’t downloaded the recipe test scripts from the book
    site, I strongly recommend you to do so. It is free for readers who have purchased
    the ebook through Leanpub.


    This book comes with two formats: *Ebook* and *Paper book*. I originally thought
    there won’t be much demand for printed books, but I was wrong. The demand for
    printed books is higher than I expected.


    Practice makes perfect


    - **Write tests**: Many testers would like to practice with Selenium, but they
    don''t know where to start. Here is a guide to help you get started.

    - **Improve programming skills**: Continuous testing requires programming skills.

    - **Maintain test scripts to keep up with application changes**.

    - **Shorten test execution time to get quick feedback**: With growing number of
    test cases, the execution time also grows.


    Best wishes for your test automation!


    ⁷https://leanpub.com/learn-ruby-programming-by-examples

    ⁸https://leanpub.com/practical-web-test-automation

    ⁹https://leanpub.com/practical-continuous-testing

