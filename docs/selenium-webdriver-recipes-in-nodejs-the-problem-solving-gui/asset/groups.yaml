    driver.executeScript("arguments[0].focus();", the_elem);


    This workaround can be quite useful. When testing a long web page and some controls
    are


    not visible, trying to click them might throw “Element is not visible” error.
    In that case,


    setting the focus on the element might make it a visible.


    **5.8 Set a value to a read-only or disabled text field**


    ‘Read only’ and ‘disabled’ text fields are not editable and are shown differently
    in the browser


