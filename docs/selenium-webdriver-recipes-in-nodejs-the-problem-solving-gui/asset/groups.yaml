    ### 20.1 Raise exceptions to fail test\n\nWhile assert provides most of assertions\
    \ needed, raising exceptions can be useful too as shown below.\n\n```javascript\n\
    if (process.platform != \"darwin\" && process.platform != \"linux\") {\n  throw(\"\
    Unsupported platform: \" + process.platform);\n}\n```\n\nIn test output (when\
    \ running on Windows):\n`Error: done() invoked with non-Error: Unsupported platform:\
    \ win32`\n\nAn exception means an anomalous or exceptional condition occurred.\
    \ The code to handle exceptions is called exception handling, an important concept\
    \ in programming. If an exception is not handled, the program execution will terminate\
    \ with the exception displayed.\n\nHere is a standard way of handling exceptions\
    \ in JavaScript.\n\n```javascript\ntry {\n  driver.actions.sendKeys(\"TestWise\"\
