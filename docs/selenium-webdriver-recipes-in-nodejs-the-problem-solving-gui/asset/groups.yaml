    register_link\")).click();\n```\n\nThis works for all languages.\n\n## 22. Gotchas\n\
    \nFor the most part, Selenium WebDriver API is quite straightforward. My one sentence\
    \ summary: find a element and perform an operation on it. Writing test scripts\
    \ in Selenium WebDriver is much more than knowing the API, it involves programming,\
    \ HTML, JavaScript and web browsers. There are cases that can be confusing to\
    \ newcomers.\n\n### 22.1 Test starts browser but no execution with blank screen\n\
    \nA very possible cause is that the version of installed Selenium WebDriver is\
    \ not compatible with the version of your browser. Here is a screenshot of Firefox\
    \ 41.0.2 started by a Selenium WebDriver 2.44.0 test.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_149_0.png)\n\
    \nThe test hung there. After I upgraded Selenium WebDriver to 2.45, the test ran\
    \ fine. This can happen to Chrome too. With both browsers and Selenium WebDriver\
    \ get updated quite frequently, in a matter of months, it is not that surprising\
    \ to get the incompatibility issues. For test engineers who are not aware of this,\
    \ it can be quite confusing as the tests might be running fine the day before\
    \ and no changes have been made since.\n\nOnce knowing the cause, the solutions\
    \ are easy:\n\nOptimization\n\n138\n\n- Upgrade both Selenium WebDriver and browsers\
    \ to the latest version. Browsers such as Chrome usually turn on auto-upgrade\
    \ by default, I suggest upgrading to the latest Selenium WebDriver several days\
    \ after it is released.\n- Lock Selenium WebDriver and browsers. Turn off auto-upgrade\
    \ in browser and be thoughtful on upgrading Selenium Webdriver.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_150_0.png)\n\
    \n### Be aware of browser and driver changes\n\nOne day I found over 40 test failures\
    \ (out of about 400) by surprise on the latest continuous testing build. There\
    \ were little changes since the last build, in which all tests passed. I quickly\
    \ figured out the cause: Chrome auto-upgraded to v44, which changed the behavior\
    \ of clicking links. After clicking, sometimes executions continue immediately\
    \ without waiting.\n\nWait, I see the OCR text is jumbled in some sections. Let\
    \ me re-align the logic based on the provided text:\n\n### 22.1 Test starts browser\
