    \ text. Almost every programming language supports regular expression, with minor\
    \ differences.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_141_0.png)\n\nThe test\
    \ script below will extract “V7H67U” and “2015-11-9” from the text Your coupon\
