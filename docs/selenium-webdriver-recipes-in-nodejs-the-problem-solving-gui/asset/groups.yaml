  - '[PAGE 149]


    **22\. Gotchas**


    For the most part, Selenium WebDriver API is quite straightforward. My one sentence


    summary: find a element and perform an operation on it. Writing test scripts in
    Selenium


    WebDriver is much more than knowing the API, it involves programming, HTML, JavaScript


    and web browsers. There are cases that can be confusing to newcomers.


    **22.1 Test starts browser but no execution with**


    **blank screen**


    A very possible cause is that the version of installed Selenium WebDriver is not
    compatible


    with the version of your browser. Here is a screenshot of Firefox 41.0.2 started
    by a Selenium


    WebDriver 2.44.0 test.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_149_0.png)


    The test hung there. After I upgraded Selenium WebDriver to 2.45, the test ran
    fine.


    This can happen to Chrome too. With both browsers and Selenium WebDriver get updated


    quite frequently, in a matter of months, it is not that surprising to get the
    incompatibility


    issues. For test engineers who are not aware of this, it can be quite confusing
    as the tests


    might be running fine the day before and no changes have been made since.


    Once knowing the cause, the solutions are easy:'
  - '[PAGE 150]


    Gotchas


    138


    • Upgrade both Selenium WebDriver and browsers to the latest version


    Browsers such as Chrome usually turn on auto-upgrade by default, I suggest upgrading


    to the latest Selenium WebDriver several days after it is released.


    • Lock Selenium WebDriver and browsers.


    Turn off auto-upgrade in browser and be thoughtful on upgrading Selenium Webdriver.


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_150_0.png)


    **Be aware of browser and driver changes**


    One day I found over 40 test failures (out of about 400) by surprise on the


    latest continuous testing build. There were little changes since the last build,
    in


    which all tests passed. I quickly figured out the cause: Chrome auto-upgraded
    to


    v44\. Chrome 44 with the ChromeDriver 2.17 changed the behaviour of clicking


    hyperlinks. After clicking a link, sometimes test executions immediately continue


    to the next operation without waiting for the “clicking link” operation to finish.


    driver.findElement(By.id("new_client")).click();


    // workaround for chrome v44, make sure the link is clicked


    driver.sleep(1000);


    A week later, I noticed the only line in the change log of ChromeDriver v2.18:


    "Changes include many bug fixes that allow ChromeDriver to work


    more reliably with Chrome 44+."


    **22.2 Failed to assert copied text in browser**


    To answer this, let’s start with an example. What we see in a browser (Internet
    Explorer)


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_150_1.png)


    is the result of rendering the page source (HTML) below in Internet Explorer:


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_150_2.png)'
