    **14.4 Run single test case with Mocha**


    When we run Mocha tests (mocha script_spec.js), it will run all test cases in
    the test


    script file. It is fine for regression testing. During development, we often just
    want to run


    one specific test case in a test script file. To run a single test in Mocha, add
    .only to the test


    case like below.


    test.it("Another test case", **function**() {


    });


    test.it.only("Just run this test case", **function**() {


    });


    Then mocha script_spec.js will only run the second test case.'
  - '[PAGE 88]


    Debugging Test Scripts


    76


    **14.5 Run tests matching a pattern with Mocha**


    Mocha can also the tests (by name) matching a patten. For example, there are 4
    tests in this


    test script file.


    test.it("Print out text", **function**() {


    // ...


    }


    test.it("Take screenshot", **function**() {


    // ...


    }


    test.it("Write page or element html to file ", **function**() {


    // ...


    }


    test.it("Take screenshot saved to timestamped file", **function**() {


    // ...


    }


    By supplying options -g <pattern>,


    > mocha -g screenshot ch14_debugging_spec.js


    Mocha will only run the two tests containing ‘screenshot’:


    √Take screenshot (1230ms)


    √Take screenshot saved to timestamped file (126ms)


    For more Mocha running options, visit https://mochajs.org/¹.


    **14.6 Leave browser open after test finishes**


    Once an error or failure occurred during test execution, a tester’s immediate
    instinct is to


    check two things:


    1\. which test statement failed?


    The first one can be easily found in command line output, identified by the line


    numbers in the backtrace. Some IDEs even highlights the error line.


    ¹https://mochajs.org/'
  - '[PAGE 89]


    Debugging Test Scripts


    77


    2\. the page content in the browser (for manual inspection).


    We need the browser to stay open to see the web page after the execution of one
    test


    case completes. However, we don’t want that when running a group of tests, as
    it will


    affect the execution of the following test cases.


    Usually, we put browser closing statements in test.After hook like the below:


    test.after(**function**() {


    // driver.quit();


    });


    Ideally, we would like to keep the browser open when running an individual test
    case and


    close the browser when running multiple test script files, without the need to
    toggle the


    ‘quit’ test step. TestWise², a testing IDE for Selenium, has this feature. It
    may be a possible


    extension you can add to your JavaScript IDE. What I can tell you is that this
    feature is quite


    useful.


    **14.7 Run selected test steps against current**


    **browser**


    In my early days with Selenium WebDriver, One feature I missed most from Watir
    was the


    ability to attach execution to an existing browser (IE) window. This is an extremely
    useful


    feature for debugging tests. When a test step fails, after analyzing and/or modifying
    (the test


    scripts or application), we often would like to rerun the test case continuing
    from where it


    stopped, rather than starting from the beginning again.


    I needed this feature so much that I created a testing tool (TestWise) to achive
    it. That is,


    creating a special test script file with selected test steps, executions of this
    special test will


    be **attached** to the last browser. Let me illustrate it.


    1\. Run an individual test


    ![](img/3d64dd4dddc685f0fc30665068dcfaf4_89_0.png)


    In this execution mode, TestWise will keep the browser open after the test execution


    completes.


    ²http://testwisely.com/testwise'
- md: "\n## Debugging Test Scripts\n\n78\n\n2. Encounter a test failure\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_0.png)\n\
    \n3. Select one or many test steps, and select ‘Run Selected Scripts Against Current\
    \ Browser’ in the right-click context menu.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_1.png)\n\
    \nTestWise will create a new debugging test script file (*debugging_spec.js*)\
    \ with the selected test steps, and run it. The same test failure is expected.\
    \ The execution, however, is different this time. It reuses the last browser and\
    \ runs only the selected steps.\n\n4. Edit and run the test steps in the *debugging_spec.js*\
    \ directly against the browser, as many times as necessary.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_2.png)\n\
    \nThis special test script look like this:\n\n```javascript\ntest.describe('Debugging',\
    \ function() {\n  test.before(function() {\n    this.timeout(timeOut);\n    driver\
    \ = new webdriver.Builder().forBrowser(helper.browserType()).\n      setChromeOptions(helper.debuggingChromeOptions()).build();\n\
    \  });\n\n  test.it('Special', function() {\n    this.timeout(timeOut);\n    //\
    \ edit your test scripts here to attach to the last open browser\n    driver.findElement(webdriver.By.name('commit')).click();\n\
    \  });\n});\n```\n\nThis special test only ‘attaches’ to the Chrome browser window\
    \ of the last execution from TestWise. I did not research whether it works for\
    \ other browser types, for me, being able to debug in the most popular browser\
    \ is good enough. The completed (selenium) test scripts, after the debugging is\
    \ done, of course can be run against any browser.\n\nThe mechanism is using Chrome’s\
    \ remote debugging port. You may implement this as an extension to your choice\
    \ of testing tools.\n\n## 15. Test Data\n\nGathering test data is an important\
    \ but often neglected activity. With the power of Java programming, testers now\
    \ have a new ability to prepare test data.\n\n### 15.1 Get date dynamically\n\n\
    ```javascript\n// assume today is 2016-07-18\nvar today = new Date();\n// generate\
    \ today's time as string, e.g. 18-7-2016 8:14\nvar dateStr = today.getDate()\n\
    + \"-\" + (today.getMonth()+1) + \"-\" + today.getFullYear() +\\\n\" \" +\ntoday.getHours()\
    \ + \":\" + today.getMinutes();\n\ndriver.findElement(By.name(\"username\")).sendKeys(dateStr);\n\
    ```\n\nPlease note the month is 0-based. As you can see, it seems quite complex\
    \ using JavaScript’s built-in date functions. A much easier and flexible way is\
    \ to use Moment.js¹.\n\n```javascript\n// npm install --save moment\nvar moment\
    \ = require('moment');\n// current time\nconsole.log(moment().format()); // 2016-07-18T07:53:42+10:00\n\
    console.log(moment().format(\"MMM DD, YYYY\")); // Jul 18, 2016\nconsole.log(moment().format(\"\
    DD/MM/YY\")); // 18/07/16\n// yesterday and tomorrow\nconsole.log(moment().subtract(1,\
    \ 'days').format(\"YYYY-MM-DD\")); // 2016-07-17\nconsole.log(moment().add(1,\
    \ 'days').format(\"YYYY-MM-DD\")); // 2016-07-19\n// in fortnight\nconsole.log(moment().add(2,\
    \ 'weeks').format(\"YYYY-MM-DD\")); // 2016-08-01\n```\n\nCheck Moment.js Docs²\
    \ for more usage.\n\n¹http://momentjs.com/\n²http://momentjs.com/docs/\n\n###\
    \ 15.2 Get a random boolean value\n\nA boolean value means either *true* or *false*.\
    \ Getting a random true or false might not sound that interesting. That was what\
    \ I thought when I first learned it. Later, I realized that it is actually very\
    \ powerful, because I can fill the computer program (test script as well) with\
    \ nondeterministic data.\n\n```javascript\nfunction getRandomBoolean() {\n  return\
    \ Math.random() >= 0.5;\n}\n```\n\nFor example, in a user sign up form, we could\
    \ write two cases: one for male and one for female. With random boolean, I could\
    \ achieve the same with just one test case. If the test case get run many times,\
    \ it will cover both scenarios.\n\n```javascript\ndriver.get(\"file://\" + __dirname\
    \ + \"/../../site/radio_button.html\");\nvar randomGender = getRandomBoolean()\
    \ ? \"male\" : \"female\";\ndriver.findElement(By.xpath(\"//input[@type='radio'\
    \ and @name='gender' and @value='\" +\nrandomGender + \"']\")).click();\n```\n\
    \n### 15.3 Generate a number within a range\n\n```javascript\n// a number within\
    \ a range\nfunction getRandomInteger(min, max) {\n  return Math.floor(Math.random()\
    \ * (max - min + 1)) + min;\n}\n```\n\nThe test statement below will enter a number\
    \ between 10 and 100. If the test gets run hundreds of times, not a problem at\
    \ all for automated test, it will cover all scenarios.\n\n### 15.4 Get a random\
    \ character\n\n```javascript\nfunction getRandomCharacter() {\n  var chars = \"\
    0123456789abcdefghijklmnopqrstuvwxyzQRSTUVWXYZ\";\n  return chars.charAt(Math.floor(Math.random()\
    \ * chars.length));\n}\n```\n\n### 15.5 Get a random string at length\n\n```javascript\n\
    function getRandomString(strLength) {\n  var text = \"\";\n  var possible = \"\
    ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz\";\n  for (var\
    \ i=0; i < strLength; i++)\n    text += possible.charAt(Math.floor(Math.random()\
    \ * possible.length));\n  return text;\n}\n```\n\n### 15.6 Get a random string\
    \ in collection\n\n```javascript\nfunction getRandomIn(array) {\n  return array[Math.floor(Math.random()\
    \ * array.length)];\n}\n```\n\ntest.it(\"Random string in collection\", function()\
    \ {\n  var allowableStrings = [\"Yes\", \"No\", \"Maybe\"];\n  driver.findElement(By.name(\"\
    username\")).sendKeys(getRandomIn(allowableStrings));\n});\n\n### 15.7 Generate\
    \ random names, emails, addresses with Faker\n\nFaker³ is a Node.js library that\
    \ generates fake data.\n\n```javascript\nvar faker = require('faker');\nconsole.log(faker.internet.email());\n\
    console.log(faker.name.findName());\nconsole.log(faker.address.streetAddress());\n\
    console.log(faker.phone.phoneNumber());\n```\n\nYou can find more examples.\n\n\
    ### 15.8 Generate a test file at fixed sizes\n\nWhen testing file uploads, testers\
    \ often try files in different sizes. The following generates a test file in precise\
    \ size on the fly.\n\n```javascript\nvar fs = require('fs');\nvar outputFile =\
    \ __dirname + \"/tmp/2MB.txt\";\nfs.writeFileSync(outputFile, \"0\".repeat(1024\
    \ * 1024 * 2));\n```\n\n### 15.9 Retrieve data from Database\n\nThe ultimate way\
    \ to obtain accurate test data is to get from the database. For many projects,\
    \ this might not be possible. For ones do, this provides the ultimate flexibility\
    \ in terms of getting test data.\n\nThe test script example is to enter the oldest\
    \ (by age) user’s login into the text field on a web page. To get this oldest\
    \ user in the system, I use SQL to query a SQLite3 database directly (it will\
    \ be different for yours, but the concept is the same) using sqlite3 module. Install\
    \ sqlite3 with npm first.\n\n> npm install --save sqlite3\n\n```javascript\nvar\
    \ fs = require('fs');\nvar sqlite3 = require('sqlite3').verbose();\nvar db_file\
    \ = __dirname + \"/../../testdata/sample.db\"\nvar db = new sqlite3.Database(db_file);\n\
    var oldestUserLogin = \"\";\n\ndb.serialize(function() {\n  if (!fs.existsSync(db_file))\
    \ {\n    console.log(\"DB not exists!\")\n  }\n  db.get(\"SELECT login FROM users\
    \ ORDER BY age DESC\", function(err, row) {\n    // console.log(row.login);\n\
    \    oldestUserLogin = row.login;\n    console.log(\"user => \" + oldestUserLogin);\n\
    \    driver.findElement(By.id(\"user\")).sendKeys(oldestUserLogin);\n  });\n});\n\
    \ndb.close();\n```\n"
  mdcn: "\n\n## 调试测试脚本\n\n78\n\n2. 遇到测试失败\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_0.png)\n\
    \n3. 选择一个或多个测试步骤，并在右键上下文菜单中选择“在当前浏览器上运行选定的脚本”（Run Selected Scripts Against Current\
    \ Browser）。\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_1.png)\n\nTestWise\
    \ 将根据选定的测试步骤创建一个新的调试测试脚本文件（*debugging_spec.js*）并运行它。预期相同的测试失败。但这次执行方式不同：它重用了上一个浏览器并仅运行选定的步骤。\n\
    \n4. 直接针对浏览器编辑并运行 *debugging_spec.js* 中的测试步骤，可以根据需要多次运行。\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_90_2.png)\n\
    \n这个特殊的测试脚本看起来如下：\n\n```javascript\ntest.describe('Debugging', function() {\n\
    \  test.before(function() {\n    this.timeout(timeOut);\n    driver = new webdriver.Builder().forBrowser(helper.browserType()).\n\
    \      setChromeOptions(helper.debuggingChromeOptions()).build();\n  });\n\n \
    \ test.it('Special', function() {\n    this.timeout(timeOut);\n    // 在这里编辑你的测试脚本以附加最后打开的浏览器\n\
    \    driver.findElement(webdriver.By.name('commit')).click();\n  });\n});\n```\n\
    \n这个特殊的测试仅“附加”到 TestWise 上一次执行的 Chrome 浏览器窗口。我没有研究过它是否适用于其他浏览器类型，但对我来说，能够在最流行的浏览器中进行调试已经足够了。调试完成后，这些完成的\
    \ (selenium) 测试脚本可以在任何浏览器上运行。\n\n该机制利用了 Chrome 的远程调试端口。你可以将其实现为所选测试工具的扩展。\n\n\
    ## 15. 测试数据\n\n收集测试数据是一个重要但经常被忽视的活动。凭借 Java 编程的力量，测试人员现在有了准备测试数据的新能力。\n\n### 15.1\
    \ 动态获取日期\n\n```javascript\n// 假设今天是 2016-07-18\nvar today = new Date();\n// 将今天的时间生成为字符串，例如18-7-2016\
    \ 8:14\nvar dateStr = today.getDate()\n+ \"-\" + (today.getMonth()+1) + \"-\"\
    \ + today.getFullYear() +\\\n\" \" +\ntoday.getHours() + \":\" + today.getMinutes();\n\
    \ndriver.findElement(By.name(\"username\")).sendKeys(dateStr);\n```\n\n请注意月份是从\
    \ 0 开始的。如你所见，使用 JavaScript 内置日期函数似乎相当复杂。更简单且灵活的方法是使用 Moment.js¹。\n\n```javascript\n\
    // npm install --save moment\nvar moment = require('moment');\n// 当前时间\nconsole.log(moment().format());\
    \ // 2016-07-18T07:53:42+10:00\nconsole.log(moment().format(\"MMM DD, YYYY\"));\
    \ // Jul 18, 2016\nconsole.log(moment().format(\"DD/MM/YY\")); // 18/07/16\n//\
    \ 昨天和明天\nconsole.log(moment().subtract(1, 'days').format(\"YYYY-MM-DD\")); //\
    \ 2016-07-17\nconsole.log(moment().add(1, 'days').format(\"YYYY-MM-DD\")); //\
    \ 2016-07-19\n// 两周后\nconsole.log(moment().add(2, 'weeks').format(\"YYYY-MM-DD\"\
    )); // 2016-08-01\n```\n\n查看 Moment.js 文档² 获取更多用法。\n\n¹http://momentjs.com/\n\
    ²http://momentjs.com/docs/\n\n### 15.2 获取随机布尔值\n\n布尔值意味着*true*（真）或*false*（假）。获取随机的真假听起来可能并不有趣。我第一次学时也是这么认为的。后来我意识到它实际上非常强大，因为可以用非确定性数据填充计算机程序（以及测试脚本）。\n\
    \n```javascript\nfunction getRandomBoolean() {\n  return Math.random() >= 0.5;\n\
    }\n```\n\n例如，在用户注册表单中，我们可以写两个用例：一个针对男性，一个针对女性。使用随机布尔值，我只需要一个测试用例就能实现同样。如果测试用例运行多次，它将覆盖两种场景。\n\
    \n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/radio_button.html\"\
    );\nvar randomGender = getRandomBoolean() ? \"male\" : \"female\";\ndriver.findElement(By.xpath(\"\
    //input[@type='radio' and @name='gender' and @value='\" +\nrandomGender + \"']\"\
    )).click();\n```\n\n### 15.3 生成范围内的数字\n\n```javascript\n// 范围内的数字\nfunction getRandomInteger(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n```\n\
    \n下面的测试语句将输入一个 10 到 100 之间的数字。如果测试运行数百次，对于自动化测试来说完全没有问题，它将覆盖所有场景。\n\n### 15.4\
    \ 获取随机字符\n\n```javascript\nfunction getRandomCharacter() {\n  var chars = \"0123456789abcdefghijklmnopqrstuvwxyzQRSTUVWXYZ\"\
    ;\n  return chars.charAt(Math.floor(Math.random() * chars.length));\n}\n```\n\n\
    ### 15.5 获取指定长度的随机字符串\n\n```javascript\nfunction getRandomString(strLength) {\n\
    \  var text = \"\";\n  var possible = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyz\"\
    ;\n  for (var i=0; i < strLength; i++)\n    text += possible.charAt(Math.floor(Math.random()\
    \ * possible.length));\n  return text;\n}\n```\n\n### 15.6 获取集合中的随机字符串\n\n```javascript\n\
    function getRandomIn(array) {\n  return array[Math.floor(Math.random() * array.length)];\n\
    }\n```\n\ntest.it(\"集合中的随机字符串\", function() {\n  var allowableStrings = [\"Yes\"\
    , \"No\", \"Maybe\"];\n  driver.findElement(By.name(\"username\")).sendKeys(getRandomIn(allowableStrings));\n\
    });\n\n### 15.7 使用 Faker 生成随机名称、邮箱和地址\n\nFaker³ 是一个生成假数据的 Node.js 库。\n\n```javascript\n\
    var faker = require('faker');\nconsole.log(faker.internet.email());\nconsole.log(faker.name.findName());\n\
    console.log(faker.address.streetAddress());\nconsole.log(faker.phone.phoneNumber());\n\
    ```\n\n你可以找到更多示例。\n\n### 15.8 生成固定大小的测试文件\n\n测试文件上传时，测试人员经常尝试不同大小的文件。以下代码动态生成指定大小的文件。\n\
    \n```javascript\nvar fs = require('fs');\nvar outputFile = __dirname + \"/tmp/2MB.txt\"\
    ;\nfs.writeFileSync(outputFile, \"0\".repeat(1024 * 1024 * 2));\n```\n\n### 15.9\
    \ 从数据库检索数据\n\n获取准确测试数据的终极是从数据库。对于许多项目这可能不可。对于可行的项目，这在获取测试数据方面提供了最大的灵活性。\n\n测试脚本示例是在网页上的文本框中输入年龄最大的用户的登录名。为了获取系统中的这个最老用户，我使用\
    \ sqlite3 模块直接查询 SQLite3 数据库（你的项目可能不同，但概念相同）。首先先用 npm 安装 sqlite3。\n\n> npm install\
    \ --save sqlite3\n\n```javascript\nvar fs = require('fs');\nvar sqlite3 = require('sqlite3').verbose();\n\
    var db_file = __dirname + \"/../../testdata/sample.db\"\nvar db = new sqlite3.Database(db_file);\n\
    var oldestUserLogin = \"\";\n\ndb.serialize(function() {\n  if (!fs.existsSync(db_file))\
    \ {\n    console.log(\"DB不存在!\")\n  }\n  db.get(\"SELECT login FROM users ORDER\
    \ BY age DESC\", function(err, row) {\n    // console.log(row.login);\n    oldestUserLogin\
    \ = row.login;\n    console.log(\"user => \" + oldestUserLogin);\n    driver.findElement(By.id(\"\
    user\")).sendKeys(oldestUserLogin);\n  });\n});\n\ndb.close();\n```\n\n"
