    \ a new Chrome open, perform a Google search of ‘webdriver’ and close the browser.\n\
    \n## 1.6 Cross browser testing\n\nThe biggest advantage of Selenium over other\
    \ test frameworks, my opinion, is that it supports all major browsers: Firefox,\
    \ Chrome and Internet Explorer/Edge. The browser market nowadays is more diversified\
    \ (based on usage in June 2020 for Chrome, Firefox, Safari, IE/Edge are 69.4%,\
