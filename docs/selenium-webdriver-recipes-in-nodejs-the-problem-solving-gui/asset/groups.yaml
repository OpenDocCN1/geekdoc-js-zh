    **1\. Introduction**


    Selenium is a free and open source library for automated testing web applications.
    Selenium


    was originally created in 2004 by Jason Huggins, it merged with another test framework


    WebDriver in 2011 (that’s why is named ‘selenium-webdriver’) led by Simon Stewart
    at


    Google (update: Simon now works at FaceBook). As WebDriver is a W3C standard¹,
    it gains


    support from all major browser vendors, as a result, Selenium WebDriver quickly
    become


    the de facto framework for automated testing web applications.


    **1.1 Selenium language bindings**


    Selenium tests can be written in multiple programming languages such as Java,
    C#, Python,


    Ruby and JavaScript (the core ones). All examples in this book are written in
    Selenium with


    JavaScript binding. As you will see from the examples below, the use of Selenium
    in different


    bindings are very similar. Once you master one, you can apply it to others quite
    easily. Take


    a look at a simple Selenium test script in five different language bindings: JavaScript,
    Java,


    C#, Python and Ruby.


    **JavaScript**:


    **var** webdriver = require(''selenium-webdriver'');


    **var** driver = **new** webdriver.Builder()


    .forBrowser(''chrome'')


    .build();


    driver.get(''http://www.google.com/ncr'');


    driver.findElement(webdriver.By.name(''q'')).sendKeys(''webdriver'');


    driver.findElement(webdriver.By.name(''btnG'')).click();


    driver.wait(webdriver.until.titleIs(''webdriver - Google Search''), 1000);


    driver.quit();


    **Java**:


    ¹https://www.w3.org/TR/webdriver/'
