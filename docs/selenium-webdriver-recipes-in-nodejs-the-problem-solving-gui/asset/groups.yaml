    **16.6 Bypass basic authentication with Firefox**


    **AutoAuth plugin**


    There is another complex but quite useful approach to bypass basic authentication:
    use a


    browser extension. Take Firefox for example, “Auto Login”² submits HTTP authentication


    dialogs remembered passwords.


    By default, Selenium starts Firefox with an empty profile, which means no remembered


    passwords and extensions. We can instruct Selenium to start Firefox with an existing
    profile.


    • Start Firefox with a dedicated profile. Run the command below (from command
    line)


    Windows:


    "C:\Program Files (x86)\Mozilla Firefox\firefox.exe" -p


    Mac:


    /Applications/Firefox.app/Contents/MacOS/firefox-bin


    -p


    • Create a profile (I name it ‘testing’) and start Firefox with this profile


    ²https://addons.mozilla.org/en-US/firefox/addon/autoauth/'
