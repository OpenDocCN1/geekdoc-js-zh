    driver.findElement(By.className(\"cke_button__numberedlist\")).click(); // numbered\
    \ list\n```\n\nWYSIWYG HTML editors\n\n118\n\n### 19.3 SummerNote\n\nSummerNote\
    \ is a Bootstrap based lightweight WYSIWYG editor, different from TinyMCE or CKEditor,\
    \ it does not use frames.\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_130_0.png)\n\
