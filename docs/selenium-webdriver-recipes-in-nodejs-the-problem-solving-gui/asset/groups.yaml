    \n```javascript\nvar webdriver = require('selenium-webdriver');\nvar driver =\
    \ new webdriver.Builder()\n  .forBrowser('chrome')\n  .build();\n```\n\n### Firefox\n\
    \nSelenium tests requires Gecko Driver to drive Firefox. The test script below\
    \ will open a site in a new Firefox window.\n\n```javascript\nvar webdriver =\
    \ require('selenium-webdriver');\nvar driver = new webdriver.Builder()\n  .forBrowser('firefox')\n\
    \  .build();\n```\n\n⁷https://github.com/mozilla/geckriver/releases/\n\n### Internet\
    \ Explorer\n\nSelenium requires IEDriverServer to drive IE browser. Its installation\
    \ process is very similar to ChromeDriver. IEDriverServer is available at http://www.seleniumhq.org/download/.\
    \ Choose the right one based on your windows version (32 or 64 bit). When tests\
    \ starts to execute in IE, before navigating the target site, you will see this:\
    \ Depending on the version of IE, configurations may be required. Please see IE\
    \ and IEDriverServer Runtime Configuration for details.\n\n```javascript\nvar\
    \ webdriver = require('selenium-webdriver');\nvar driver = new webdriver.Builder()\n\
    \  .forBrowser('ie')\n  .build();\n```\n\n⁸https://code.google.com/p/selenium/wiki/InternetExplorerDriver#Required_Configuration\n\
    \n### Edge Chromium\n\nEdge (Chromium) is Microsoft’s new and default web browser\
    \ that works on all common platforms, including macOS. An additional library ‘edge-selenium-tools’\
