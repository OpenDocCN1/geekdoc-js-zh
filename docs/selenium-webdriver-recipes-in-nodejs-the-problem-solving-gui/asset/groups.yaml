    td/button\")).click();\n})\n\n## 20.11 Extract dynamic text following a pattern\
    \ using Regex\n\nTo use dynamic data created from the application, e.g. receipt\
    \ number, we need to extract them out. Ideally, those data are marked by dedicated\
    \ IDs such as <span id='receipt_-number'></span>. However, it is not always the\
    \ case, i.e., the data are mixed with other text.\n\nThe most commonly used approach\
