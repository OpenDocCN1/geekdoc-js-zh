    \n从测试的角度来看，一个测试步骤（如点击“Transfer”按钮）会立即完成。然而，网页某些部分的更新可能会在未知延迟后发生，这与传统的网页请求有所不同。\n\
    \n测试 AJAX\n\n测试 AJAX 操作有两种常用方法：等待足够的时间，或者在给定的最大时间内定期检查网页。\n\n### 12.1 在时间范围内等待\n\
    \n在触发 AJAX 操作（例如点击链接或按钮）后，我们可以在测试脚本中设置一个计时器，以便在执行下一步之前，等待所有异步更新的完成。\n\n```javascript\n\
