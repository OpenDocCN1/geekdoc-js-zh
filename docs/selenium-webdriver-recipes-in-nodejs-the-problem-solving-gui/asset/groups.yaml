    driver.findElement(By.id(\"get_coupon_btn\")).click();\ndriver.findElement(By.id(\"\
    details\")).getText().then(function(couponText){\n  console.log(couponText);\n\
    \  var regex = /Your coupon code:\\s+(\\w+) used by\\s([\\d|-]+)/;\n  var matchArray\
    \ = regex.exec(couponText);\n  if (matchArray.length > 1) {\n    var coupon =\
    \ matchArray[1]\n    var expiryDate = matchArray[2]\n    assert.equal(20, coupon.length)\n\
    \    driver.findElement(By.name(\"coupon\")).sendKeys(coupon);\n  } else {\n \
    \   throw(\"Error: no valid coupon returned\")\n  }\n})\n\nRegular expression\
    \ is very powerful and it does take some time to master it. To get it going for\
    \ simple text matching, however, is not hard. Google ‘java regular expression’\
    \ shall return some good tutorials, and Rubular³ is a helpful tool to let you\
    \ try out regular expression online.\n\n³http://rubular.com/\n\n## 21. Optimization\n\
    \nWorking test scripts is just the first test step to successful test automation.\
    \ As automated tests are executed often, and we all know the application changes\
    \ frequently too. Therefore, it is important that we need our test scripts to\
    \ be:\n\n- Fast\n- Easy to read\n- Concise\n\nIn this chapter, I will show some\
    \ examples to optimize test scripts.\n\n### 21.1 Assert text in page_source is\
    \ faster than the text\n\nTo verify a piece of text on a web page, frequently\
    \ for assertion, we can use driver.getPageSource() or driver.findElement(By.tagName(\"\
    body\")).getText(). Besides the obvious different output, there are big performance\
    \ differences too. To get a text view (for a whole page or a web control), WebDriver\
    \ needs to analyze the raw HTML to generate the text view, and it takes time.\
    \ We usually do not notice that time when the raw HTML is small. However, for\
    \ a large web page like the WebDriver standard¹ (over 430KB in file size), incorrect\
    \ use of ‘text view’ will slow your test execution significantly.\n\n¹http://www.w3.org/TR/webdriver/\n\
    \ndriver.get(\"file://\" + __dirname + \"/../../site/WebDriverStandard.html\"\
    );\nvar startTime = new Date().getTime();\ndriver.findElement(By.tagName(\"body\"\
    )).getText().then(function(pageText) {\n  var endTime = new Date().getTime();\n\
    \  var duration = endTime - startTime;\n  console.log(\"Method 1: Search whole\
    \ document text took \" + duration + \" ms\")\n});\nstartTime = new Date().getTime();\n\
    driver.getPageSource().then(function(pageSource) {\n  var endTime = new Date().getTime();\n\
    \  var duration = endTime - startTime;\n  console.log(\"Method 2: Search whole\
    \ document html took \" + duration + \" ms\")\n});\n\nLet’s see the difference.\n\
    \nMethod 1: Search whole document text took 3006 ms\nMethod 2: Search whole document\
    \ html took 77 ms\n\n### 21.2 Getting text from more specific element is faster\n\
    \nA rule of thumb is that we save execution time by narrowing down a more specific\
    \ control. The two assertion statements largely achieve the same purpose but with\
    \ big difference in execution time.\n\ndriver.findElement(By.tagName(\"body\"\
    )).getText().then(function(pageText) {\n  assert(pageText.contains(\"platform-\
    \ and language-neutral wire protocol\"))\n});\nExecution time: 3.121 seconds\n\
    \ndriver.findElement(By.id(\"comments\")).getText().then(function(elemText) {\n\
    \  assert(elemText.contains(\"platform- and language-neutral wire protocol\"))\n\
    });\nExecution time: 0.067 seconds\n\n### 21.3 Avoid if-else block possible\n\n\
    It is common that programmers write test scripts in a similar way: For me, I prefer\
    \ simple, concise and easy to read. Whenever possible, using ternary operator\
    \ ?\n\ndriver.findElement(By.id(\"notes\")).getText().then(function(elemText)\
    \ {\n  assert.equal(elemText.contains(\"VIP\") ? \"Please upstairs\" : \"\", elemText)\n\
    });\n\n### 21.4 Enter large text into a box\n\nWe commonly use send_keys to enter\
    \ text into a box. When the text string you want to enter is quite large, e.g.\
    \ thousands of characters, try to avoid send_keys, as it is not efficient. Here\
    \ is an example:\n\nvar longStr = \"0\".repeat(1024 * 5)\nvar textAreaElem = driver.findElement(By.id(\"\
    comments\"));\ntextAreaElem.sendKeys(longStr);\nExecution time: 11.642 seconds.\n\
    \nThe solution is actually simple: using JavaScript.\n\ndriver.executeScript(\"\
    document.getElementById('comments').value=arguments[0];\", longStr);\nExecution\
    \ time: 0.061 seconds\n\n### 21.5 Use Environment Variables to change test behaviours\
    \ dynamically\n\nTypically, there are more than one test environment we need to\
    \ run automated tests against, and we might want to run the same test in different\
    \ browsers now and then. I saw the test scripts like the below often in projects:\n\
    \n// global variables with default values\nvar targetBrowser = \"firefox\"\n//\
    \ var targetBrowser = \"chrome\"\nvar targetSiteUrl = \"https://physio.clinicwise.net\"\
    \n// var targetSiteUrl = \"http://demo.poolwise.net\";\n\ndriver = new webdriver.Builder().forBrowser(targetBrowser).build();\n\
    driver.get(targetSiteUrl)\n\nIt works like this: testers comment and uncomment\
    \ a set of test statements to let test script run against different servers. This\
    \ is not an ideal approach, because it is inefficient, error prone and introducing\
    \ unnecessary check-ins (changing test script files with no changes to testing\
    \ logic).\n\nA simple solution is to use agreed environment variables, so that\
    \ the target server URL and browser type can be set externally, outside the test\
    \ scripts.\n\n// variables\nvar targetBrowser = \"firefox\"\nvar targetSiteUrl\
    \ = \"https://physio.clinicwise.net\"\n\n// ...\n\ntest.it(\"Use Environment variables\
    \ to change test behaviour dynamically\", function() {\n  if (process.env.TARGET_SITE_URL)\
    \ {\n    targetSiteUrl = process.env.TARGET_SITE_URL\n  }\n  if (process.env.TARGET_BROWSER)\
    \ {\n    targetBrowser = process.env.TARGET_BROWSER\n  }\n"
