    )).sendKeys(coupon);\n  } else {\n    throw(\"Error: no valid coupon returned\"\
    )\n  }\n})\n\n正则表达式非常强大，但需要一些时间来掌握。不过，要将其用于简单的文本匹配并不困难。搜索“java regular expression”会返回一些很好的教程，而\
    \ Rubular³ 是一个让你在线尝试正则表达式的有用工具。\n\n³http://rubular.com/\n\n## 21. 优化\n\n编写测试脚本只是成功实现自动化测试的第一步。由于自动化测试运行非常频繁，而且我们也知道应用程序也会频繁变化。因此，我们需要测试脚本具备以下特性：\n\
    \n- 快速\n- 易于阅读\n- 简洁\n\n在本章中，我将展示一些优化测试脚本的示例。\n\n### 21.1 在 page_source 中断言文本比断言文本更快\n\
    \n为了验证网页上的某段文本（通常用于断言），我们可以使用 `driver.getPageSource()` 或 `driver.findElement(By.tagName(\"\
    body\")).getText()`。除了输出明显不同外，性能上也有巨大的差异。为了获取文本视图（针对整个页面或 Web 控件），WebDriver 需要分析原始\
    \ HTML 来生成文本视图，这需要花费时间。当原始 HTML 较小时，我们通常察觉不到这段时间。但对于像 WebDriver 标准¹（文件大小超过 430KB）的大型网页，错误地使用“文本视图”会显著减慢你的测试执行。\n\
    \n¹http://www.w3.org/TR/webdriver/\n\ndriver.get(\"file://\" + __dirname + \"\
    /../../site/WebDriverStandard.html\");\nvar startTime = new Date().getTime();\n\
