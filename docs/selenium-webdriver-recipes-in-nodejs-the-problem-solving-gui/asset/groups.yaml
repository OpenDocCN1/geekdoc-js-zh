    \n### 注意浏览器和驱动程序的更改\n\n有一天，我在最新的持续测试构建中意外发现了发现了 40 多个测试失败（总共约 400 次）。自上次构建（当时所有测试均通过）以来，并没有没有太大的变化。我很快就找到了原因：Chrome\
    \ 自动升级到了 v44，它改变了点击链接的行为。点击后，有时执行会立即继续而无需等待。\n\n** 22.4 “意外的标签名‘input’”** - 这是因为有另一个匹配你的\
