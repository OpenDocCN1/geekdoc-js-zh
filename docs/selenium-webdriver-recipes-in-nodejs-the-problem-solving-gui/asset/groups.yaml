- md: "\n## Introduction\n\n11\n\nI use Mocha in this book. You are free to choose\
    \ any JavaScript test framework, Selenium WebDriver techniques are applicable\
    \ regardless of syntax frameworks. Here is a Mocha test script for user login:\n\
    \n```javascript\nvar webdriver = require('selenium-webdriver');\nvar test = require('selenium-webdriver/testing');\
    \ // add 'test.' wrapper\n\nvar driver = new webdriver.Builder()\n  .forBrowser('chrome')\n\
    \  .build();\n\nvar assert = require('assert');\n\ntest.describe('User Authentication',\
    \ function () {\n  test.it('User can sign in', function () {\n    driver.get('http://travel.agileway.net');\n\
    \    driver.findElement(webdriver.By.name('username')).sendKeys('agileway');\n\
    \    driver.findElement(webdriver.By.name('password')).sendKeys('testwise');\n\
    \    driver.findElement(webdriver.By.name('commit')).click();\n    driver.getTitle().then(function(the_title){\n\
    \      assert.equal(\"Agile Travel\", the_title);\n    });\n  });\n});\n```\n\n\
    The keywords `describe` and `it` define the structure of a Mocha test script.\
    \ I used `test.describe` and `test.it` here, provided with `selenium-webdriver/testing`\
    \ module, which transparently waits for the promise to resolve before resuming\
    \ the function.\n\n- **test.describe**: Description of a collection of related\
    \ test cases.\n- **test.it**: Individual test case.\n\nI use Node.js assert module¹⁵\
    \ here to perform checks: `assert.equal(...).`.\n\n### Mocha hooks\n\nIf you worked\
    \ with xUnit before, you must have known `setUp()` and `tearDown()` fixtures that\
    \ are run before or after every test. Mocha provides similar hooks `before()`,\
    \ `after()`, `beforeEach()`, and `afterEach()`, which can be used to set up preconditions\
    \ and clean up after test scripts.\n\n¹⁵https://nodejs.org/api/assert.html\n\n\
    ## Introduction\n\n12\n\n```javascript\ntest.describe('User Authentication', function\
    \ () {\n  test.before(function() {\n    // run before all test cases, commonly\
    \ initialize WebDriver\n    driver = new webdriver.Builder()\n      .forBrowser('chrome')\n\
    \      .build();\n  });\n\n  test.beforeEach(function() {\n    // run before each\
    \ test case, typically visit home page\n    driver.get(\"http://travel.agilway.net\"\
    )\n  });\n\n  test.afterEach(function() {\n    // run after each test case\n \
    \ });\n\n  test.after(function() {\n    // run after all test cases, typically\
    \ close browser\n    driver.quit();\n  });\n\n  test.it('Test case description',\
    \ function() {\n    // one test case\n  });\n\n  test.it('Another Test case description',\
    \ function() {\n    // another test case\n  });\n});\n```\n\n### Install Mocha\n\
    \nUse **npm** to install Mocha package.\n\n```bash\nnpm install -g mocha\n```\n\
    \n-g tells npm to install this module globally, i.e, any Node.js project can use\
    \ this module. When it is done, the output will be like below:\n\n```text\n+ mocha@8.0.1\n\
    ```\n\nRun the command below in a new Command window (or Terminal on Mac/Linux)\
    \ to verify that Mocha is installed.\n\n```bash\nmocha --version\n8.0.1\n```\n\
    \n### 1.8 Create package.json file\n\nA **package.json** file contains metadata\
    \ about your Node.js app (in our case, test project), usually in the project root.\
    \ It includes the list of module dependencies to install from npm. While it is\
    \ not mandatory, it is a good idea to have it so that it will be easy to install\
    \ or update the project’s dependent modules (just run `npm install`). If you are\
    \ familiar with Ruby, it is similar to a Gemfile.\n\nTo create *package.json*,\
    \ run the command below in the test project’s root folder.\n\n```bash\nnpm init\n\
    ```\n\nFollow the prompt and answer the questions, the answers will be saved in\
    \ *package.json* file in the folder. Then install two modules: *selenium-webdriver*\
    \ and *mocha*. You might have noticed the difference from the previous npm install\
    \ commands: using `--save` instead of `-g. This tells npm to install modules locally\
    \ and update the *package.json* file.\n\n```bash\nnpm install --save selenium-webdriver@3.6.0\n\
    npm install --save mocha\n```\n\nAfter installation, you will see folder **node_modules**\
    \ (locally installed modules) and the following content in the *package.json*\
    \ file:\n\n```json\n\"dependencies\": {\n  \"mocha\": \"^8.0.1\",\n  \"selenium-webdriver\"\
    : \"^3.6.0\",\n}\n```\n\n### 1.9 Run recipe test scripts\n\nTest scripts for all\
    \ recipes can be downloaded from this book’s site. They are all in a ready-to-run\
    \ state. I include the target web pages/sites as well as Selenium test scripts.\
    \ There are two kinds of target web pages: local HTML files and web pages on a\
    \ live site. An Internet connection is required to run tests written for a live\
    \ site.\n\nOne key advantage of open-source test frameworks, such as Selenium\
    \ WebDriver and Mocha, is FREEDOM. You can edit the test scripts in any text editors\
    \ and run them from a command line. For example, to run test cases in a test script\
    \ file (named *ch01_agiletravel_login_spec.js*), run command:\n\n```bash\nmocha\
    \ ch01_agiletravel_login_spec.js\n```\n\nYou might get the error output like below:\n\
    \n**Timeout error**\nUser Authentication\n1) User can sign in\n0 passing (2s)\n\
    1 failing\n1) User can sign in\nError: timeout of 2000ms exceeded. Ensure the\
    \ done() callback is called in this test. at Timeout.<anonymous> (C:\\...\\node_modules\\\
    mocha\\lib\\runnable.js:226:19) The default timeout for test case is 2 seconds.\
    \ One common way is to override the timeout value at the beginning of a test case:\n\
    \n```javascript\ntest.it('User can sign in', function () {\n  this.timeout(8000);\n\
    \  driver.get('http://travel.agileway.net');\n  // ...\n});\n```\n\n**Sample Output**\n\
    User Authentication\n✓Invalid user (784ms)\n✓User can login successfully (1197ms)\n\
    passing\n\n## Locating web elements\n\nAs you might have figured out, to drive\
    \ an element in HTML, we need to find it first. Selenium WebDriver uses what is\
    \ called locators to find and match the elements on page. There are 8 locators\
    \ in Selenium WebDriver:\n\n| Locator | Example |\n| :--- | :--- |\n| ID | findElement(By.id(\"\
    user\")) |\n| Name | findElement(By.name(\"username\")) |\n| Link Text | findElement(By.linkText(\"\
    Login\")) |\n| Partial Link Text | findElement(By.partialLinkText(\"Next\")) |\n\
    | XPath | findElement(By.xpath(\"//div[@id='login']/input\")) |\n| Tag Name |\
    \ findElement(By.tagName(\"body\")) |\n| Class Name | findElement(By.className(\"\
    table\")) |\n| CSS | findElement(By.css(\"#login > input[type='text']\")) |\n\n\
    You may use any one of them to narrow down the element you are looking for.\n\n\
    ### 2.1 Start browser\n\nTesting web sites starts with a browser. The test script\
    \ below launches a Chrome window and navigates to a site.\n\n```javascript\nvar\
    \ webdriver = require('selenium-webdriver');\nvar driver = new webdriver.Builder()\n\
    \  .forBrowser('chrome')\n  .build();\n\ndriver.get(\"http://testwisely.com/demo\"\
    )\n```\n\nUse firefox and ie for testing in Firefox and IE respectively.\n\n###\
    \ Test Pages\n\nI prepared the test pages for the recipes, you can download it\
    \ at the book’s site**. Unzip it to a local directory and refer to test pages\
    \ like this:\n\n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/locators.html\"\
    );\n```\n\n`__dirname` is the directory where the test script is.\n\nI recommend,\
    \ for beginners, to close the browser window at the end of a test case.\n\n```javascript\n\
    driver.quit();\n```\n\n### 2.2 Find element by ID\n\nUsing IDs is the easiest\
    \ and probably the safest way to locate an element in HTML. If a webpage is W3C\
    \ HTML conformed¹, the IDs should be unique and identified in web controls on\
    \ the page. In comparison to texts, test scripts that use IDs are less prone to\
    \ application changes (e.g. developers may decide to change the label, but are\
    \ less likely to change the ID).\n\n```javascript\nvar webdriver = require('selenium-webdriver');\n\
    var driver = new webdriver.Builder()\n  .forBrowser('chrome')\n  .build();\n\n\
    // ...\n\ndriver.findElement(webdriver.By.id(\"submit_btn\")).click();\n```\n\n\
    As we will use locator statement `webdriver.By` frequently in test scripts, we\
