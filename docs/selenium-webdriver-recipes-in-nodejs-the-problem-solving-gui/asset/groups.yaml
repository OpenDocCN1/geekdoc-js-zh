    \nWYSIWYG HTML editors\n\n119\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_131_0.png)\n\
    \n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/codemirror-5.1/demo/xml.html\"\
    );\ndriver.sleep(200);\nvar elem = driver.findElement(By.className(\"CodeMirror-scroll\"\
