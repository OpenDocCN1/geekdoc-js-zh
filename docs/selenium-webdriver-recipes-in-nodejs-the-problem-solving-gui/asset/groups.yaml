    <**input** type="submit" name="submit_action" value="Space After "/>


    The test script below will fail as there is a space character in the end.


    driver.findElement(By.xpath("//input[@value=''Space After'']")).click();


    Changing to match the value exactly will fix it.


    driver.findElement(By.xpath("//input[@value=''Space After '']")).click();


    **4.3 Submit a form**


    In the official Selenium tutorial, the operation of clicking a form submit button
    is done by


    calling *submit* function on an input element within a form. For example, the
    test script below


    is to test user sign in.


    driver.findElement(By.name("user")).sendKeys("agileway");


    password_element = driver.findElement(By.name( "password"));


    password_element.sendKeys("secret");


    password_element.submit();


    However, this is not my preferred approach. Whenever possible, I write test scripts
    this way:


    one test step corresponds to one user operation, such as a text entry or a mouse
    click. This


    helps me to identify issues quicker during test debugging. Using *submit* means
    testers need


    a step to define a variable to store an identified element (line 1 in above test
    script), to me, it


    breaks the flow. Here is my version:


    driver.findElement(By.name( "user")).sendKeys("agileway");


    driver.findElement(By.name( "password")).sendKeys("secret");


    driver.findElement(By.xpath("//input[@value=''Sign in'']")).click();


    Furthermore, if there is more than one submit button (unlikely but possible) in
    a form, calling


    *submit* is equivalent to clicking the first submit button only, which might cause
    confusion.


    **4.4 Click a button by ID**


    As always, a better way to identify a button is to use IDs. This applies to all
    controls, if there


    are IDs present.'
