    **24.3 Selenium Grid**


    Selenium Grid allows you to run Selenium tests in parallel to cut down the execution
    time.


    Selenium Grid includes one hub and many nodes.


    1. **Start the Hub**


    The hub receives the test requests and distributes them to the nodes.


    java -jar selenium-server-standalone-2.53.1.jar -role hub


    2. **Start the nodes**


    A node gets tests from the hub and run them.


    java -jar selenium-server-standalone-2.53.1.jar -role node


    \


    -hub http://localhost:4444/grid/register


    If you starts a node on another machine, replace *localhost* with the hub’s IP
    address.


    3. **Using grid to run tests**


    You need to change the test script to point to the driver to the hub.


    driver = **new** webdriver.Builder()


    .usingServer(''http://localhost:4444/wd/hub'')


    .forBrowser(''chrome'')


    .build();


    The test will run on one of the nodes. Please note that the timing and test case
    counts


    (from RSpec) returned is apparently not right.


    Frankly, I haven’t yet met anyone who is able to show me a working selenium-grid
    running


    a fair number of UI selenium tests.


    Here are my concerns with Selenium Grid:


    • **Complexity**


    For every selenium grid node, you need to configure the node either by specifying


    command line parameters or a JSON file. Check out the Grid Wiki page² for details.


    It is my understanding that just pushing the tests to the hub, and it handles
    the rest


    based on the configuration. My experience tells me that it is too good to be true.
    For


    example, here is an error I got. While the error message is quite clear: no ChromeDriver


    installed. But on which node? Shouldn’t the hub ‘know’ about that?


    ²https://code.google.com/p/selenium/wiki/Grid2'
- md: "\nSelenium Remote Control Server\n\n148\n\n[remote server] com.google.common.base.Preconditions(Preconditions.java):177:**in**\n\
    \n`checkState': The path to the driver executable must be set by the\nwebdriver.chrome.driver\
    \ system property; for more information,\nsee http://code.google.com/p/selenium/wiki/ChromeDriver.\n\
    (java.lang.IllegalStateException) (Selenium::WebDriver::Error::UnknownError)\n\
    \n- **Very limited control**\n\nSelenium-Grid comes with a web accessible console,\
    \ in my view, very basic one. For\ninstance, I created 2 nodes: one on Mac; the\
    \ other on Windows 7 (the console displayed\nas ‘VISTA’).\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_160_0.png)\n\
    \nAn IE icon for for Mac node? This does not seem right.\n\n- **Lack of feedback**\n\
    \nUI tests take time to execute, more tests means longer execution time. Selenium\
    \ Grid’s\ndistribution model is to reduce that. Apart from the raw execution time,\
    \ there is also\nthe feedback time. The team would like to see the test results\
    \ as soon as a test execution\nfinishes on one node. Even better, when we pass\
    \ the whole test suite to the hub, it will\n‘intelligently’ run new or last failed\
    \ tests first. Selenium Grid, in my view, falls short\non this.\n\n- **Lack of\
    \ rerun**\n\nIn a perfect world, all tests execute as expected every single time.\
    \ But in reality, there\nare so many factors that could affect the test execution:\n\
    \n- test statements didn’t wait long enough for AJAX requests to complete (server\
    \ on\nload)\n- browser crashes (it happens)\n- node runs out of disk space\n-\
    \ virus scanning process started in background\n- windows self-installed an update\n\
    - …\n\nIn this case, re-assign failed tests to anther node could save a potential\
    \ good build.\nMy point is: I could quickly put together a demo with Selenium\
    \ Grid running tests on\ndifferent nodes (with different browsers), and the audience\
    \ might be quite impressed.\nHowever, in reality, when you have a large number\
    \ of UI test suites, the game is totally\ndifferent. The whole process needs to\
    \ be simple, stable, flexible and very importantly, being\nable to provide feedback\
    \ quickly. In the true spirit of Agile, if there are tests failing, no code\n\
    shall be allowed to check in. Now we are talking about the pressure …\n\nHow to\
    \ achieve distributed test execution over multiple browsers? First of all, distributed\n\
    test execution and cross browser testing are two different things. Distributed\
    \ test execution\nspeeds up test execution (could be just against single type\
    \ of browser); while cross-browser\ntesting is to verify the application’s ability\
    \ to work on a range of browsers. Yes, distributed\ntest execution can be used\
    \ to test against different browsers. But do distributed test\nexecution done\
    \ solidly before worrying about the cross browser testing.\n\nI firmly believe\
    \ the UI test execution with feedback shall be a part of continuous integration\n\
    (CI) process, just like running xUnit tests and the report shown on the CI server.\
    \ It is OK for\ndevelopers/testers to develop selenium tests in an IDE, in which\
    \ they run one or a handful\ntests often. However, executing a large number of\
    \ UI tests, which is time consuming, shall\ndone in the CI server.\n\nThe purpose\
    \ of a prefect CI process: building the application to pass all tests, to be ready\
    \ to\nproduction release. Distributed execution of UI tests with quick feedback,\
    \ in my opinion, is\nan important feature of a CI Server. However, most CI servers\
    \ in the market do not support\nthis feature. You can find more information on\
    \ this topic in my other book *Practical Web\n*Test Automation*³.\n\n³https://leanpub.com/practical-web-test-automation\n\
    \n## 25. Quiz\n\nThere is maybe more than one correct answer for multiple-choice\
    \ questions.\n\n### 1. Introduction \n\n1.1 Which of the following browsers does\
    \ Selenium WebDriver officially support?\n(A) Chrome\n(B) Firefox\n(C) Edge v84+\n\
    (D) Safari\n(E) All of the above\n\n1.2 Which of the following are BDD frameworks?\n\
    (A) JUnit\n(B) RSpec\n(C) Cucumber\n(D) All of the above\n\n1.3 Which of the following\
    \ is NOT an official Selenium WebDriver language binding?\n(A) Java\n(B) Ruby\n\
    (C) Go\n(D) Python\n(E) C#\n\n1.4 Which of the following software are required\
    \ for running a Selenium script in a Chrome\nbrowser.\n(A) Programming language\
    \ runtime, e.g. Ruby\n(B) Selenium library, e.g. selenium-webdriver library\n\
    (C) Browser, e.g. Google Chrome\n(D) Browser driver (e.g. ChromeDriver) matches\
    \ the browser’s version and it is in the PATH\n(E) All of the above\n\n### 2.\
    \ Locators\n\n2.1 Generally speaking, which Selenium WebDriver locator is the\
