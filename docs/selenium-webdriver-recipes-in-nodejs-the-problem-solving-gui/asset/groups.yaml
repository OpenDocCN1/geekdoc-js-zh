    **21\. Optimization**


    Working test scripts is just the first test step to successful test automation.
    As automated


    tests are executed often, and we all know the application changes frequently too.
    Therefore,


    it is important that we need our test scripts to be


    • Fast


    • Easy to read


    • Concise


    In this chapter, I will show some examples to optimize test scripts.


    **21.1 Assert text in page_source is faster than the**


    **text**


    To verify a piece of text on a web page, frequently for assertion, we can use
    driver.getPageSource()


    or driver.findElement(By.tagName("body")).getText(). Besides the obvious differ-


    ent output, there are big performance differences too. To get a text view (for
    a whole page or


    a web control), WebDriver needs to analyze the raw HTML to generate the text view,
    and it


    takes time. We usually do not notice that time when the raw HTML is small. However,
    for a


    large web page like the WebDriver standard¹ (over 430KB in file size), incorrect
    use of ‘text


    view’ will slow your test execution significantly.


    ¹http://www.w3.org/TR/webdriver/'
