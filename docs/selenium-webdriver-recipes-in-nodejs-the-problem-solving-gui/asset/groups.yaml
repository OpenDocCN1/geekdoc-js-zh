    ### 在 BuildWise 中创建项目


    BuildWise 使用“项目（Project）”的概念。在 BuildWise 中创建项目的快速方法是提供一个名称（用于显示）、一个标识符以及一个包含测试脚本的本地工作文件夹。为了方便初学者，BuildWise
    针对不同的测试框架包含了一组示例项目配置（代码托管在 Github 上）。在教程中，我选择了“**Fill demo project**（填充演示项目）”→“**Mocha
    (Node.js)**”。


    这将在 BuildWise 中创建一个名为 *AgileTravel Quick Build Mocha* 的项目。


    ### 手动触发测试执行


    要启动构建（就我们而言，“构建”意味着执行自动化功能测试），请点击“Build Now（立即构建）”按钮。


    （项目的）熔岩灯颜色现在已变为橙色，表示构建正在进行。


    很快，你将看到一个浏览器窗口启动，你的测试正在执行。


    ### 测试执行过程中的反馈


    点击构建标签（例如‘1 :building’）可以显示测试执行的详情：


    测试脚本执行完毕，你就可以立即看到结果，无需等待整个套件完成。上面的截图是在第一个测试脚本（包含 2 个测试用例）执行完毕时拍摄的。


    你可以在 BuildWise 上检查测试失败（如果有）。从错误或失败描述中，我们可以识别原因。从错误跟踪轨迹中的行号，我们可以轻松导航到发生错误的测试用例。


    请注意，测试是在构建服务器上执行的，而不是在你的机器上（除非你正在本地运行 BuildWise）。你现在可以在电脑上的 TestWise 中打开并运行测试用例，而无需等待
    CI 构建完成。


    ### 构建完成


    当测试执行完成后，你将在 BuildWise 上看到完整的测试结果。你可以将它们导出到 Excel 表格中。对于下方的构建，五个自动化测试用例中仅有一个失败了。


    访问 BuildWise 服务器的主页，项目旁边会显示一个红色的熔岩灯。


    要修复失败的构建，请分析原因、更新测试脚本，然后在 BuildWise 上重新触发另一次构建。


    如果所有测试均通过，你将在仪表板页面上获得一个绿色的熔岩灯作为奖励。


    ### 通知


    你可以配置持续集成服务器在构建完成后立即发送电子邮件和 Slack 等通知。以下是从 BuildWise 发送的一组 Slack 通知：


    ### 结语


    这并不难，对吧？如果你一直在使用 RSpec 语法开发 Selenium WebDriver 测试，那么在 BuildWise 中运行你的测试是非常直接的。你可以对此示例项目的
