    \ name=\"vip\" value=\"on\"> VIP?\n```\n\n在这种情况下，可能不会抛出错误。然而，这可能会更加微妙，因为操作被应用于不同的控件上。\n\
    \n## 22.5 不可点击或不可见\n\n某些控件（如文本字段）即使在当前浏览器窗口中不可见，Selenium WebDriver 也会将焦点移动到它们上。其他某些控件（如按钮）可能不会。在这种情况下，尽管通过\
    \ `findElement` 找到了元素，但它是不可点击的。\n\n解决方案是让目标控件在浏览器中可见。\n\n1. 滚动窗口使控件可见\n\n找到控件的位置并滚动到该位置。\n\
