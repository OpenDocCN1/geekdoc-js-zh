    **16.9 Headless Chrome**


    Chrome 59 (released on June 5, 2017) introduces headless mode, which can be used
    with


    Selenium WebDriver. Here is how:


    **var** chrome = require(''selenium-webdriver/chrome'');


    **var** chromeOptions = **new** chrome.Options();


    chromeOptions.addArguments("headless");


    **var** driver = **new** webdriver.Builder().forBrowser(''chrome'')


    .setChromeOptions(chromeOptions)


    .build();


    driver.get("http://travel.agileway.net")


    driver.getTitle().then(**function**(the_title){


    assert.equal("Agile Travel", the_title)


    });


    Please note that, at the time of writing, Headless mode is available on Mac and
    Linux in


    Chrome 59, but Windows support⁴ will be available soon.


    **16.10 Headless Firefox**


    Headless is also supported in Firefox from version 56, works the same way as Chrome.
    Please


    note the syntax has been changed several times, the latest one is options.headless!.


    ⁴https://bugs.chromium.org/p/chromium/issues/detail?id=686608'
