    \n- **控制非常有限**\n\nSelenium-Grid 自带一个 Web 可访问控制台，在我看来，它非常基础。例如，我创建了 2 个节点：一个在 Mac\
    \ 上；另一个在 Windows 7 上（控制台显示为“VISTA”）。\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_160_0.png)\n\
    \nMac 节点的 IE 图标？这看起来是不对。\n\n- **缺乏反馈**\n\nUI 测试需要执行时间，测试越多意味着执行时间越长。Selenium Grid\
    \ 的分布式模型是为了减少这种等待。除了原始执行时间外，还有反馈时间。团队希望在某个节点上的测试执行完成后立即看到测试结果。更好的是，当我们把整个测试套件传递给\
    \ hub 时，它会“智能地”优先运行新测试或上次失败的测试。在我看来，Selenium Grid 在这方面存在不足。\n\n- **缺乏重试机制**\n\n\
    在完美的世界里，所有测试每次都能按预期执行。但在现实中，有许多因素会影响测试执行：\n\n- 测试语句没有等待足够长时间让 AJAX 请求完成（服务器加载中）\n\
    - 浏览器崩溃（确实会发生）\n- 节点磁盘空间不足\n- 后台启动了病毒扫描进程\n- Windows 自动安装了更新\n- …\n\n在这种情况下，将失败的测试重新分配到另一个节点可以拯救一个潜在的良好构建。我的观点是：我可以快速组合出一个使用\
    \ Selenium Grid 在不同节点（使用不同浏览器）上运行测试的 Demo，观众可能会印象深刻。然而，在现实中，当你有大量的 UI 测试套件时，情况完全不同了。整个过程需要简单、稳定、灵活，而且最重要的是，能够快速提供反馈。按照敏捷开发的真正精神，如果有测试失败，则不允许代码检入。现在我们谈论的是压力……\n\
    \n如何在多个浏览器上实现分布式测试执行？首先，分布式测试执行和跨浏览器测试是两个概念。分布式测试执行加速测试运行（可能只是针对单一类型的浏览器）；跨浏览器测试是为了验证应用程序在系列浏览器上工作的能力。是的，分布式测试执行可以用于测试不同的浏览器。但在担心跨浏览器测试之前，分布式测试执行是否做得稳固？\n\
    \n我坚信，带有反馈的 UI 测试执行应该是持续集成（CI）过程的一部分，就像运行 xUnit 测试并在 CI 服务器上显示报告一样。开发者/测试人员在 IDE\
    \ 中开发 Selenium 测试并在其中经常运行一个或几个测试是可以的。然而，执行大量耗时的 UI 测试应该在 CI 服务器上完成。\n\n完美的 CI\
    \ 流程的目的是：构建应用程序以通过所有测试，准备好发布生产。在我看来，带有快速反馈的 UI 测试分布式执行是 CI 服务器的一个重要功能。然而，市场上的大多数\
    \ CI 服务器都不支持此功能。你可以在我的另一本书 *Practical Web Test Automation*³ 中找到此主题的更多信息。\n\n³https://leanpub.com/practical-web-test-automation\n\
