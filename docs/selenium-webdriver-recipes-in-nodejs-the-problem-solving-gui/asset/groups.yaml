  mdcn: "\n\n## 18. HTML 5 与动态网站\n\nWeb 技术正在不断进化。HTML5 包含了许多新功能，用于构建更动态的 Web 应用和接口。此外，由于\
    \ JavaScript 的广泛使用（感谢 jQuery 等流行的 JavaScript 库），现在的网站更加动态。在本章，我将展示一些 Selenium\
    \ 示例来测试 HTML5 元素和交互操作。\n\n请注意，某些测试仅在特定浏览器中有效（Chrome 是最佳选择），因为某些 HTML5 功能在某些浏览器中尚未得到完全支持。\n\
    \n### 18.1 HTML5 Email 类型字段\n\n让我们从一个简单的开始。email 类型字段用于输入应包含电子邮件地址的输入框。从测试的角度来看，我们对待它与普通文本字段完全一样。\n\
    \n![](img/3d64dd4dddc685f0fc30665068dcfaf4_112_0.png)\n\n**HTML 源代码**\n```\n<input\
    \ id=\"email\" name=\"email\" type=\"email\" style=\"height:30px; width: 280px;\"\
    >\n```\n\n**测试脚本**\n```\ndriver.get(\"file://\" + __dirname + \"/../../site/html5.html\"\
    );\ndriver.findElement(By.id(\"email\")).sendKeys(\"test@wisely.com\");\n```\n\
    \n### 18.2 HTML5 时间字段\n\nHTML5 时间字段要复杂得多，如下面的截图所示。\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_113_0.png)\n\
    \n**HTML 源代码**\n```\n<input id=\"start_time_1\" name=\"start_time\" type=\"time\"\
    \ style=\"width: 120px;\">\n```\n\n下面的测试脚本执行以下操作：\n\n1. 确保焦点不在此时间字段控件上\n2. 点击并聚焦时间字段\n\
    3. 清除现有的时间\n4. 输入新时间\n\n```\ndriver.findElement(By.id(\"start_time_1\")).sendKeys(\"\
    12:05AM\");\n// 聚焦到另一个地方 ...\ndriver.findElement(By.id(\"home_link\")).sendKeys(\"\
    \");\ndriver.sleep(500);\n// 现在切回来修改它\ndriver.findElement(By.id(\"start_time_1\"\
    )).click();\n// [:delete, :left, :delete, :left, :delete]\ndriver.findElement(By.id(\"\
    start_time_1\")).sendKeys(webdriver.Key.DELETE);\ndriver.findElement(By.id(\"\
    start_time_1\")).sendKeys(webdriver.Key.LEFT);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(webdriver.Key.DELETE);\ndriver.findElement(By.id(\"start_time_1\"\
    )).sendKeys(webdriver.Key.LEFT);\ndriver.findElement(By.id(\"start_time_1\")).sendKeys(webdriver.Key.DELETE);\n\
    driver.findElement(By.id(\"start_time_1\")).sendKeys(\"08\");\ndriver.sleep(300);\n\
    driver.findElement(By.id(\"start_time_1\")).sendKeys(\"27\");\ndriver.sleep(300);\n\
    driver.findElement(By.id(\"start_time_1\")).sendKeys(\"AM\");\n```\n\n### 18.3\
    \ 触发 ‘onclick' JavaScript 事件\n\n在下面的示例中，当用户点击文本框控件时，会显示提示文本（*最多 20 个字符*）。\n\n\
    **示例页面**\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_114_0.png)\n\n**HTML 源代码**\n\
    ```\n<input type=\"text\" name=\"person_name\" onclick=\"$('#tip').show();\" onchange=\"\
    change_person_name(this.value);\"/>\n<span id=\"tip\" style=\"display:none; margin-left:\
    \ 20px; color:gray;\">Max 20 characters</span>\n```\n\n当我们在 Selenium 中使用普通的 `sendKeys()`\
    \ 时，它会输入文本，但提示文本不会显示。\n\n```\ndriver.findElement(By.name(\"person_name\")).sendKeys(\"\
    Wise Tester\");\n```\n\n我们可以简单地调用 ‘click’ 来来实现它。\n\n```\ndriver.findElement(By.name(\"\
    person_name\")).clear();\ndriver.findElement(By.name(\"person_name\")).sendKeys(\"\
    Wise Tester\");\ndriver.findElement(By.name(\"person_name\")).click();\ndriver.findElement(By.id(\"\
    tip\")).getText().then(function(tipText) {\n    assert.equal(\"Max 20 characters\"\
    , tipText);\n});\n```\n\n### 18.4 触发如 ‘onchange’ 等 JavaScript 事件\n\n触发 ‘OnXXXX’\
    \ 事件的通用方法是执行 JavaScript，以下是一个在文本框上触发 ‘OnChange’ 事件的示例。\n\n```\ndriver.findElement(By.name(\"\
    person_name\")).sendKeys(\"Wise Tester too\");\ndriver.executeScript(\"$('#person_name_textbox').trigger('change')\"\
    ).then(function() {\n    driver.findElement(By.id(\"person_name_label\")).getText().then(function(theText){\n\
    \        assert.equal(\"Wise Tester too\", theText);\n    });\n});\n```\n\n###\
    \ 18.5 滚动到页面底部\n\n调用 JavaScript API。\n\n```\ndriver.executeScript(\"window.scrollTo(0,\
    \ document.body.scrollHeight);\").then(function(){});\n```\n\n或者发送键盘命令：‘Ctrl+End’。\n\
    \n```\ndriver.findElement(By.tagName(\"body\")).sendKeys(webdriver.Key.CONTROL,\
    \ webdriver.Key.END);\n```\n\n### 18.6 Select2 - 单选\n\nSelect2 是一个流行的插件，它让长选择列表变得对用户友好，它将标准的\
    \ HTML select 框变成这样：\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_15_0.png)\n\n\
    **HTML 源代码**\n```\n<select id=\"country_single\" data-placeholder=\"Choose Country...\"\
    \ class=\"select2\">\n    <option value=\"\"></option>\n    <option value=\"United\
    \ States\">United States</option>\n    <option value=\"United Kingdom\">United\
    \ Kingdom</option>\n    <option value=\"Australia\">Australia</option>\n</select>\n\
    ```\n\nHTML 源代码与标准列表相比除了增加了 `select2` 类外似乎没有区别。通过使用该类作为标识符，页面上的 JavaScript 会生成以下\
    \ HTML 片段（在元素下方）。\n\n**生成的 HTML 源代码**\n```\n<select id=\"country_single\" />\n\
    <span class=\"select2-container select2-container--default select2-container--open\"\
    >\n    <span class=\"select2-dropdown select2-dropdown--below\">\n        <input\
    \ autocomplete=\"off\" class=\"select2-search__field\" type=\"search\">\n    \
    \    <ul class=\"select2-results\" id=\"select2-country-results\">\n         \
    \   <li class=\"...\" id=\"...\"><span class=\"select2-results\">United States</span></li>\n\
    \            <li class=\"...\" id=\"...\"><span class=\"select2-results\">United\
    \ Kingdom</span></li>\n            <li class=\"...\" id=\"...\"><span class=\"\
    select2-results\">Australia</span></li>\n        </ul\n    </span>\n</</span>\n\
    ```\n\n请注意，这个动态生成的 HTML 片段无法通过“查看网页源代码”看到，你需要启用检查工具（通常是右键点击页面，然后选择“检查元素”）来看到它。\n\
    \n在我们测试它之前，我们需要了解如何使用它。\n\n- 点击‘Choose a Country’\n- 选择一个选项\n\n这与标准选择列表没有区别。确实如此，我们需要理解\
    \ Select2 是如何模拟单选列表的。在 Select2 中，点击‘Choose a Country’（显示选项）实际上是点击原始 `<select>`\
    \ 旁边的 `<span>`。\n\n凭借这些知识，配合 Selenium 中的 XPath，我们可以驱动 Select2 标准选择框如下：\n\n```\n\
    driver.get(\"file://\" + __dirname + \"/../../site/select2.html\");\ndriver.sleep(500);\
    \ // 等待 JS 加载\ndriver.findElement(By.xpath(\"//select[@id='country_single']/../span\"\
    )).click();\ndriver.sleep(300);\ndriver.findElements(By.xpath(\"//ul[@id='select2-country-results']/li\"\
    )).then(function(options){\n    options.forEach(function(option){\n        option.getText().then(function(optionText)\
    \ {\n            if (optionText == \"Australia\") {\n                option.click();\n\
    \            }\n        });\n    });\n});\n```\n\nSelect2 的一个特色功能允许用户搜索选项，在 Selenium\
    \ 中这样做：\n\n```\ndriver.findElement(By.xpath(\"//select[@id='country_single']/../span[@class='select2-selection__arrow']\"\
    )).click();\ndriver.sleep(300);\nvar search_text_field = driver.findElement(By.xpath(\"\
    //span/input[@class = 'select2-search__field']\"));\nsearch_text_field.sendKeys(\"\
    United King\");\ndriver.sleep(200); // 等待过滤完成\nsearch_text_field.sendKeys(webdriver.Key.ENTER);\n\
    // 选中第一个\n```\n\n### 18.7 Select2 - 多选\n\nSelect2¹也增强了多选功能（很多）。\n\n![](img/3d64dd4dddc685f0fc30665068dcfaf4_117_0.png)\n\
    \n**HTML 源代码**\n```\n<select id=\"country_multiple\" data-placeholder=\"Choose\
    \ Countries...\" class=\"select2\" multiple style=\"width:420px;\">\n    <option\
    \ value=\"\"></option>\n    <option value=\"United States\">United States</option>\n\
    \    <option value=\"United Kingdom\">United Kingdom</option>\n    <option value=\"\
    Australia\">Australia</option>\n</select>\n```\n\n再次，与标准多选列表唯一的区别是 `select2` 类。敏锐的读者会发现生成的\
    \ HTML 片段与标准（单选）选择不同，这是由于使用方法的原因。研究驱动控件的概念是相同的，我把作业留给你们，只需展示测试脚本即可。\n\n¹https://github.com/select2/select2\n\
    \n"
