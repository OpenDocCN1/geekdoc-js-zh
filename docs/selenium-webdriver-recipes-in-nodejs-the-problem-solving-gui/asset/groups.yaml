    \  .sendKeys(\"<h3>Heading 3</h3><p>TestWise is Selenium IDE</p>\")\n  .perform();\n\
    ```\n\n## 20. Leverage Programming\n\nThe reason that Selenium WebDriver quickly\
    \ overtakes other commercial testing tools (typically promoting record-n-playback),\
    \ in my opinion, is embracing programming, which offers the flexibility needed\
