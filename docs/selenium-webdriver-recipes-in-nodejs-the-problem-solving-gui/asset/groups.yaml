    **try** {


    driver.actions.sendKeys("TestWise").perform();


    } **catch** (err) {


    console.log("Error occurred: " + err);


    } **finally** {


    console.log("Clean up");


    driver.quit();


    }


    The above scripts exits successfully with the output:


    Error occurred: TypeError: driver.actions.sendKeys is not a **function**


    Clean up


    catch block handles the exception. If an exception is handled, the program (in
    our case,


    test execution) continues. ex.printStackTrace() print out the stack trace of the
    exception


    occurred. finally block is always run (after) no matter exceptions are thrown
    (from try)


    or not.


    However, in Selenium WebDriver, we ususaly handle exceptions due to the use of
    JavaScript


    Promises.


    driver.findElement(By.name("user")).sendKeys("bomb").then(**null**, **function**(err)
    {


    **if** (err.name == "NoSuchElementError") {


    console.log("Error: " + err);


    }


    });


    I often use exceptions in my test scripts for non-assertion purposes too.


    1\. Flag incomplete tests


    The problem with “TODO” comments is that you might forget them.


    test.it("Foo", **function**() {


    // TODO


    });


    I like this way better.'
- md: "\n## Leverage Programming\n\ntest.it(\"Foo\", function() {\n  throw(\"TO BE\
    \ DONE\");\n});\n\n### 2. Stop test execution during debugging a test\n\nSometimes,\
    \ you want to utilize automated tests to get you to a certain page in the application\
    \ quickly.\n\n// test steps ...\n\nthrow(\"Stop here, I take over from now. I\
    \ delete this later.\")\n\n### 20.2 Ignorable test statement error\n\nWhen a test\
    \ step can not be performed correctly, execution terminates and the test is marked\
    \ as failed. However, failed to run certain test steps sometimes is OK. For example,\
    \ we want to make sure a test starts with no active user session. If a user is\
    \ currently signed in, try signing out; If a user has already signed out, performing\
    \ signing out will fail. But it is acceptable. \n\nHere is an example to capture\
    \ the error/failure in a test statement, and then ignore:\n\n```javascript\ndriver.findElement(By.name(\"\
    mayExists\")).click().then(null, function(err) {\n  // ignore the error if there\
    \ is\n});\n// ...\n```\n\n### 20.3 Read external file\n\nWe can use Node.js’s\
    \ built-in file i/o functions to read data, typically test data, from external\
    \ files. Try to avoid referencing an external file using absolute path like below:\n\
    \n```javascript\nfs = require('fs');\n// Read file in synchronously (blocking)\n\
    var contents = fs.readFileSync(\"c:\\\\agileway\\\\in.xml\", 'utf8'); // bad\n\
    console.log(contents);\n// ...\n```\n\nIf the test scripts is copied to another\
    \ machine, it might fail. When you have a lot references to absolute file paths,\
    \ it is going to be difficult to maintain. A common practice is to retrieve the\
    \ test data folder from a reusable function (so that need to only update once).\n\
    \n```javascript\nfs = require('fs');\nvar input_file = __dirname + \"/../testdata/in.xml\"\
    ;\nvar contents = fs.readFileSync(input_file, 'utf8');\n```\n\n### 20.4 Data-Driven\
    \ Tests with CSV\n\nA CSV (comma-separated values) file stores tabular data in\
    \ plain-text form. CSV files are commonly used for importing into or exporting\
    \ from applications. Comparing to Excel spreadsheets, a CSV file is a text file\
    \ that contains only the pure data, not formatting.\n\nThe below is the CSV version\
    \ of data driving test for the above user sign in example, using fast-csv library:\n\
    \n```javascript\n// npm install --save fast-csv\nvar csv = require(\"fast-csv\"\
    );\nfs = require('fs');\nvar input_file = __dirname + \"/../testdata/users.csv\"\
    \ncsv.parseFile(input_file).on(\"data\", function(data){\n  if (data[0] != \"\
    DESCRIPTION\") { // ignore header row\n    var login = data[1];\n    var password\
    \ = data[2];\n    var expected_text = data[3];\n    driver.get(\"http://travel.agileway.net\"\
    )\n    driver.findElement(By.name(\"username\")).sendKeys(login);\n    driver.findElement(By.name(\"\
    password\")).sendKeys(password);\n    driver.findElement(By.name(\"commit\")).click();\n\
    \    driver.findElement(By.tagName(\"body\")).getText().then(function(pageText)\
    \ {\n      assert(pageText.contains(expected_text));\n    })\n    driver.findElement(By.linkText(\"\
    Sign off\")).click().then(null, function(err) {\n      // ignore the error if\
    \ there is\n    });\n  }\n})\n.on(\"end\", function(){\n  console.log(\"done\"\
    );\n});\n```\n\n¹https://www.npmjs.com/package/fast-csv\n\n### 20.5 Identify element\
    \ IDs with dynamically generated long prefixes\n\nYou can use regular expression\
    \ to identify the static part of element ID or NAME. The below is a HTML fragment\
    \ for a text box, we could tell some part of ID or NAME are machine generated\
    \ (which might be different for next build), and the part “AppName” is meaningful.\n\
    \n```html\n<input id=\"ctl00_m_g_dcb0d043_e7f0_4128_99c6_71c113f45dd8_ctl00_tAppName_I\"\
    \ name=\"ctl00$m$g_dcb0d043_e7f0_4128_99c6_71c113f45dd8$ctl00$tAppName\"/>\n```\n\
    \nIf we can later verify that ‘AppName’ is static for each text box, the test\
    \ scripts below will work. Basically it instructs Selenium to find element whose\
    \ name attribute contains “tAppName” (Watir can use Regular expression directly\
    \ in finder, which I think it is better).\n\n```javascript\ndriver.get(\"file://\"\
    \ + __dirname + \"/../../site/text_field.html\");\nvar elemByName = driver.findElement(By.name(\"\
    ctl00$m$g_dcb0d043_e7f0_4128_99c6_71c113f45dd8$ctl00$tAppName\"));\nelemByName.sendKeys(\"\
    full name\");\nelemByName.clear();\ndriver.sleep(1000);\ndriver.findElement(By.xpath(\"\
    //input[contains(@name, 'tAppName')]\")).sendKeys(\"Still OK\");\n```\n\n### 20.6\
    \ Sending special keys such as Enter to an element or browser\n\nYou can use .sendKeys()\
    \ method to send special keys (and combination) to web control.\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/text_field.html\");\nvar elem\
    \ = driver.findElement(By.id(\"user\"));\nelem.clear();\nelem.sendKeys(\"agileway\"\
    );\ndriver.sleep(1); // sleep for seeing effect\nelem.sendKeys(webdriver.Key.CONTROL,\
    \ \"a\");\nelem.sendKeys(webdriver.Key.BACK_SPACE);\ndriver.sleep(1000);\nelem.sendKeys(\"\
    testwisely\");\ndriver.sleep(1000);\nelem.sendKeys(webdriver.Key.ENTER); // submit\
    \ the form\n```\n\nSome special keys:\n- BACK_SPACE\n- DELETE\n- TAB\n- CONTROL\n\
    - SHIFT\n- ALT\n- ARROW_UP\n- ARROW_DOWN\n- HOME\n- END\n- ESCAPE\n- META\n- COMMAND\n\
    \nThe full list can be found at Selenium: javascript/key.js.\n\n### 20.7 Use of\
    \ Unicode in test scripts\n\nSelenium WebDriver support Unicode.\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/assert.html\") // assert unicode\n\
    driver.findElement(By.id(\"unicode_test\")).getText().then(function(elemText)\
    \ {\n  assert.equal(\" \", elemText);\n});\ndriver.findElement(By.id(\"user\"\
    )).sendKeys(\" \");\n```\n\n### 20.8 Extract a group of dynamic search results\
    \ in order\n\nThe below is a sortable table, i.e., users can sort table columns\
    \ ascending or descending by clicking the header. To verify sorting, we need to\
    \ extract all the data in sorted column then verify data in desired order. Knowledge\
    \ of coding with List or Array is required.\n\n```javascript\n// npm install --save\
    \ async\nvar async = require('async');\ndriver.get(\"file://\" + __dirname + \"\
    /../../site/data_grid.html\");\ndriver.findElement(By.id(\"heading_product\")).click();\
    \ // sort asc\nvar productNames = [];\nvar addCellText = function (elem, doneCallback)\
    \ {\n  elem.getText().then(function(textValue) {\n    productNames.push(textValue);\n\
    \    return doneCallback(null);\n  });\n};\ndriver.findElements(By.xpath(\"//tbody/tr/td[1]\"\
    )).then(function(elems){\n  async.each(elems, addCellText, function(err) {\n \
    \   // console.log(\"All Finished!\");\n    // console.log(productNames);\n  \
    \  var sortedProductNames = Array.prototype.slice.call(productNames).sort();\n\
    \    assert.deepEqual(sortedProductNames, productNames);\n  });\n});\n```\n\n\
    This approach is not limited to data in tables. The below script extracts the\
    \ scores from elements like <span class='score'>98</span>.\n\n```javascript\n\
    scoreElems = driver.findElements(By.xpath(\"//div[@id='results']//span[@class='score']\"\
    ));\n// ...\n```\n\n### 20.9 Verify uniqueness of a set of data\n\nLike the recipe\
    \ above, extract data and store them in an array first, then compare the number\
    \ of elements in the array with another one without duplicates.\n\n```javascript\n\
    driver.findElements(By.xpath(\"//tbody/tr/td[2]\")).then(function(elems){\n  async.each(elems,\
    \ addCellText, function(err) {\n    var uniqYears = Array.from(new Set(releaseYears));\n\
    \    assert.equal(uniqYears.length, releaseYears.length);\n  });\n});\n```\n\n\
    ### 20.10 Extract dynamic visible rows from a results table\n\nMany web search\
    \ forms have filtering options that hide unwanted result entries. The test scripts\
    \ below verify the first product name and click the corresponding ‘Like’ button.\n\
    \n```javascript\ndriver.get(\"file://\" + __dirname + \"/../../site/data_grid.html\"\
    );\ndriver.findElements(By.xpath(\"//table[@id='grid']/tbody/tr\")).then(function(rows){\n\
    \  assert.equal(4, rows.length)\n});\ndriver.findElement(By.xpath(\"//table[@id='grid']//tbody/tr[1]/td[1]\"\
    )).getText().then(function(productName) {\n  assert.equal(\"ClinicWise\", productName)\n\
    })\ndriver.findElement(By.xpath(\"//table[@id='grid']//tbody/tr[1]/td/button\"\
    )).click();\n```\n\nNow check “Test automation products only” checkbox, and only\
    \ two products are shown.\n\n```javascript\ndriver.findElement(By.id(\"test_products_only_flag\"\
    )).click(); //Filter results\ndriver.sleep(100);\n\n// Error: Element is not currently\
    \ visible\ndriver.findElement(By.xpath(\"//table[@id='grid']//tbody/tr[1]/td/button\"\
    )).click();\n```\n\nThe last test statement would fail with an error “*Element\
    \ is not currently visible*”. After checking the “Test automation products only”\
    \ checkbox, we see only 2 rows on screen. However, there are still 4 rows in the\
    \ page, the other two are hidden.\n\nA solution is to extract the visible rows\
    \ to an array, then we could check them by index.\n"
  mdcn: "\n\n## 利用编程特性\n\n```javascript\ntest.it(\"Foo\", function() {\n  throw(\"\
    待待完成\");\n});\n```\n\n### 2. 在调试测试时停止测试执行\n\n有时，你希望利用自动化测试快速进入应用程序中的某个页面。\n\n\
    `// test steps ...`\n\n`throw(\"停止在这里，现在由我接管。稍后我会删掉它。\")\n\n### 20.2 可忽略的测试语句错误\n\
    \n当测试步骤无法正确执行时，执行将终止并将测试标记为失败。然而，某些测试步骤未能成功运行有时是可以接受的。例如，我们希望确保测试开始时没有活跃的用户会话。如果用户当前已登录，尝试注销；如果用户已经注销，执行注销将失败。但这是可以接受的。\n\
    \n以下是一个在测试语句中捕捉错误/失败并将其忽略的示例：\n\n```javascript\ndriver.findElement(By.name(\"\
    mayExists\")).click().then(null, function(err) {\n  // 如果有错误则忽略它\n});\n// ...\n\
    ```\n\n### 20.3 读取外部文件\n\n我们可以使用 Node.js 内置的文件 I/O 函数从外部文件中读取数据（通常是测试数据）。尽量避免使用类似下方的绝对路径引用外部文件：\n\
    \n```javascript\nfs = require('fs');\n// 同步（阻塞）读取文件\nvar contents = fs.readFileSync(\"\
    c:\\\\agileway\\\\in.xml\", 'utf8'); // 错误做法\nconsole.log(contents);\n// ...\n\
    ```\n\n如果测试脚本被复制到另一台机器上，它可能会失败。当你有大量的绝对文件路径引用时，维护将变得困难。一种常见的做法是从可重用的函数获取测试数据文件夹（这样只需要更新一次）。\n\
    \n```javascript\nfs = require('fs');\nvar input_file = __dirname + \"/../testdata/in.xml\"\
    ;\nvar contents = fs.readFileSync(input_file, 'utf8');\n```\n\n### 20.4 使用 CSV\
    \ 进行数据驱动测试\n\nCSV（逗号分隔值）文件以纯文本形式存储表格数据。CSV 文件通常用于向应用程序导入或从中导出数据。与 Excel 表格相比，CSV\
    \ 文件是仅包含纯数据的文本文件，不包含格式。\n\n以下是使用 `fast-csv` 库对上述用户登录示例进行的 CSV 版本数据驱动测试：\n\n```javascript\n\
    // npm install --save fast-csv\nvar csv = require(\"fast-csv\");\nfs = require('fs');\n\
    var input_file = __dirname + \"/../testdata/users.csv\"\ncsv.parseFile(input_file).on(\"\
    data\", function(data){\n  if (data[0] != \"DESCRIPTION\") { // 忽略标题行\n    var\
    \ login = data[1];\n    var password = data[2];\n    var expected_text = data[3];\n\
    \    driver.get(\"http://travel.agileway.net\")\n    driver.findElement(By.name(\"\
    username\")).sendKeys(login);\n    driver.findElement(By.name(\"password\")).sendKeys(password);\n\
    \    driver.findElement(By.name(\"commit\")).click();\n    driver.findElement(By.tagName(\"\
    body\")).getText().then(function(pageText) {\n      assert(pageText.contains(expected_text));\n\
    \    })\n    driver.findElement(By.linkText(\"Sign off\")).click().then(null,\
    \ function(err) {\n      // 如果有错误则忽略它\n    });\n  }\n})\n.on(\"end\", function(){\n\
    \  console.log(\"done\");\n});\n```\n\n¹https://www.npmjs.com/package/fast-csv\n\
    \n### 20.5 通过动态生成的长前缀识别元素 ID\n\n你可以使用正则表达式来识别元素 ID 或 NAME 的静态部分。下面是一个文本框的 HTML\
    \ 片段，我们可以判断 ID 或 NAME 的某些部分是机器生成的（这在下次构建时可能会不同），而“AppName”部分部分是有意义的。\n\n```html\n\
    <input id=\"ctl00_m_g_dcb0d043_e7f0_4128_99c6_71c113f45dd8_ctl00_tAppName_I\"\
    \ name=\"ctl00$m$g_dcb0d043_e7f0_4128_99c6_71c113f45dd8$ctl00$tAppName\"/>\n```\n\
    \n如果我们稍后验证“AppName”对于每个文本框都是静态的，那么下面的测试脚本将能够工作。基本上，它指示 Selenium 找到 name 属性包含“tAppName”的元素（Watir\
    \ 可以在查找器中直接使用正则表达式，我认为那样更好）。\n\n```javascript\ndriver.get(\"file://\" + __dirname\
    \ + \"/../../site/text_field.html\");\nvar elemByName = driver.findElement(By.name(\"\
    ctl00$m$g_dcb0d043_e7f0_4128_99c6_71c113f45dd8$ctl00$tAppName\"));\nelemByName.sendKeys(\"\
    full name\");\nelemByName.clear();\ndriver.sleep(1000);\ndriver.findElement(By.xpath(\"\
    //input[contains(@name, 'tAppName')]\")).sendKeys(\"Still OK\");\n```\n\n### 20.6\
    \ 向元素或浏览器发送 Enter 等特殊键\n\n你可以使用 `.sendKeys()` 方法向 Web 控制发送特殊键（及组合键）。\n\n```javascript\n\
    driver.get(\"file://\" + __dirname + \"/../../site/text_field.html\");\nvar elemByName\
    \ = driver.findElement(By.name(\"ctl00$m$g_dcb0d043_e7f0_4128_99c6_71c113f45dd8$ctl00$tAppName\"\
    ));\nelemByName.sendKeys(\"full name\");\nelemByName.clear();\ndriver.sleep(1000);\n\
    driver.findElement(By.xpath(\"//input[contains(@name, 'tAppName')]\")).sendKeys(\"\
    Still OK\");\n```\n\n一些特殊键：\n- BACK_SPACE\n- DELETE\n- TAB\n- SHIFT\n- CONTROL\n\
    - ALT\n- ENTER\n- ESCAPE\n- COMMAND\n- HOME\n- END\n- PAGE_UP\n- PAGE_DOWN\n-\
