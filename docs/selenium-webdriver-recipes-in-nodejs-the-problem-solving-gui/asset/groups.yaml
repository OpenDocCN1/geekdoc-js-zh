  - '[PAGE 10]


    **Preface**


    Selenium WebDriver comes with five core language bindings: Java, C#, Ruby, Python


    and JavaScript (Node.js). I have written Selenium WebDriver recipes for all other
    four


    languages except JavaScript. This is not because I don’t know JavaScript, as a
    matter of


    fact, I have a long history of using JavaScript and I am still using it to develop
    dynamic


    web applications. JavaScript, to me, seems always associated with Web and HTML,
    rather


    than being a standalone scripting language. One day, overcoming my prejudice,
    I gave


    Selenium WebDriver with Node.js a go. I was very impressed. I found Selenium WebDriver


    in JavaScript is lightweight, quick setup, and above all, test execution is fast,
    really fast.


    Over the years, JavaScript has evolved far beyond a client-side scripting language,
    and


    has become a powerful programming language which can also be used to create server-


    side applications, or even desktop applications (Microsoft’s new programmer’s
    editor Visual


    Studio Code is built with Node.js). Node.js is a cross-platform runtime environment
    that uses


    open-source V8 JavaScript Engine execute JavaScript code as an application. As
    you have


    probably noticed, the demand for JavaScript programmers is high (see JavaScript
    developer


    salary graph in US ¹). It comes to no surprises that Selenium WebDriver includes
    JavaScript


    as one of the five official language bindings.


    The purpose of this book is to help motivated testers work better with Selenium
    WebDriver.


    The book contains over 170 recipes for web application tests with Selenium WebDriver
    in


    JavaScript. If you have read my other book: *Practical Web Test Automation*²,
    you probably


    know my style: practical. I will let the test scripts do most of the talking.
    These recipe test


    scripts are ‘live’, as I have created the target test site and included offline
    test web pages.


    With both, you can:


    1. **Identify** your issue


    2. **Find** the recipe


    3. **Run** the test case


    4. **See** test execution in your browser


    ¹http://www.indeed.com/salary/q-Javascript-Developer-l-United-States.html


    ²https://leanpub.com/practical-web-test-automation'
  - '[PAGE 11]


    Preface


    ii


    **Who should read this book**


    This book is for testers or programmers who are writing (or want to learn) automated
    tests


    with Selenium WebDriver. In order to get the most of this book, basic (very basic)
    JavaScript


    skills is required.


    **How to read this book**


    Usually, a ‘recipe’ book is a reference book. Readers can go directly to the part
    that interests


    them. For example, if you are testing a multiple select list and don’t know how,
    you can look


    up in the Table of Contents, then go to the chapter 8\. This book supports this
    style of reading.


    If you are new to Selenium WebDriver, I recommend you to try out the recipes from
    the


    front to back. The recipes in the first half of the book are arranged according
    to their levels of


    complexity, I believe readers can get the pattern of testing with Selenium and
    gain confidence


    after going through them.


    **Recipe test scripts**


    To help readers to learn more effectively, this book has a dedicated site³ that
    contains the


    recipe test scripts, test web pages and related resources. For access code, please
    see the


    Resources section of this book.


    As an old saying goes, “*There’s more than one way to skin a cat.*” You can achieve
    the same


    testing outcome with test scripts implemented in different ways. The recipe test
    scripts in


    this book are written for simplicity, and there is always room for improvement.
    But for many,


    to understand the solution quickly and get the job done are probably more important.


    If you have a better and simpler way, please let me know.


    All recipe test scripts are Selenium WebDriver 3 compliant, and can be run against
    Chrome,


    Firefox and Internet Explorer on multiple platforms. I plan to keep the test scripts
    updated


    with the latest stable Selenium version.


    ³http://zhimin.com/books/selenium-recipes-nodejs'
