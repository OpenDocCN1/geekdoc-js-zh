  \n## 附录\n\n### 使用 LESS 进行 CSS 预处理\n\n在 JavaScript 书中谈论 CSS 似乎有点奇怪，但使用 LESS 进行预处理已经不再是标准的\
  \ CSS 了。LESS 添加了动态语言的一些熟悉特性，你可以利用这些特性编写高效的 CSS，允许你使用 JavaScript 编译应用的 CSS。这种预处理器允许你使用变量、函数以及所有其他一直想在\
  \ CSS 中使用的功能来构建 CSS。LESS 加快了开发过程，同时也让样式表更有组织、更易维护。\n\n在本附录中，你将了解到为什么应该使用 CSS 预处理以及如何安装自动化的\
  \ LESS 编译器。然后你将学习 LESS 的基础知识，包括变量、操作符和嵌套。你还将发现如何使用函数和自定义混合（mixins）。最后，你将构建你的 LESS\
  \ 并将其组织到单独的文件。\n\n#### 介绍 LESS\n\nLESS 允许你使用自定义变量和函数对 CSS 进行脚本化。然后脚本化的 LESS 文件在到达浏览器之前会被编译为静态\
  \ CSS，这意味着你可以在 CSS 开发中使用脚本，但仍然向用户提供普通的浏览器兼容型 CSS。此外，如果你决定放弃 LESS，可以直接开始使用生成的 CSS\
  \ 文件进行开发。因此，使用预处理器实际上没有任何损失。\n\n#### 预处理好在哪里？\n\nCSS 预处理有很多优势，这些优势都归结为加速开发和组织样式表。预处理最令人印象的用例是它如何处理\
  \ CSS3 厂商前缀。如果没有预处理器，你必须记住许多不同的前缀，其中一些可能使用完全不同的语法。例如，一个跨浏览器线性渐变：\n\n```css\n.my-element\
  \ {\n  background-image:  -khtml-gradient(linear, left top, left bottom, from(#444),\
  \ to(#000));\n  background-image: -webkit-gradient(linear, left top, left bottom,\
  \ color-stop(0%,#444), color_stop(100%,#000));\n  background-image: -webkit-linear-gradient(top,\
  \ #444, #000);\n  background-image:     -moz-linear-gradient(top, #444, #000);\n\
  \  background-image:       -o-linear-gradient(top, #444, #000);\n  background-image:\
  \           linear-gradient(top, #444, #000);\n  filter: progid:DXImageTransform.Microsoft.gradient(\
  \ startColorstr='#444444');\n}\n```\n\n（注：提示提供的源码在 CSS 代码块中包含重复/乱码的行；我已清理格式以表示标准的\
  \ CSS 结构。）\n\n\n\n\n在这里，`.more-padding` 块获得了 `35px` 的内边距，即 `25px + 10px`。你可以使用任何你想要的数学运算符：`+`、`-`、`*`\
  \ 和 `/`。不要害于在数字旁边使用运算符——它们不仅用于计算变量的变化。因为 LESS 文件会被编译为 CSS，所以当你懒得进行基础算术时，使用这些基础运算符没有任何损失。\n\
  \n事实上，这通常是一个更好的主意，因为样式表会显示为什么某个数字是那样的——例如在处理盒模型问题时：\n\n```css\n.bordered-element\
  \ {\n  border-left: 1px solid black;\n  border-right: 1px solid black;\n  width:\
  \ 250px - 1 - 1;\n}\n```\n\n在这里，该块没有使用含义模糊的 `248px`，而是使用运算符显示宽度是为了补偿两个边框的宽度。\n\n\
  ### 嵌套\n\n我最喜欢的 LESS 部分也是最简单的。嵌套允许你将选择器组织在父元素下，使得样式表编写更快，更有组织性。例如，如果不使用 LESS，你可能需要为网站头部编写多个不同的规则：\n\
  \n```css\nheader {\n  min-width: 800px;\n}\nheader nav {\n  width: 800px;\n  margin:\
  \ 0 auto;\n}\nheader nav li {\n  list-style: none;\n}\nheader a {\n  text-decoration:\
  \ none;\n}\n```\n\n但你的 LESS 文件可以通过将每条规则嵌套在其父元素内来极大地简化这些：\n\n```css\nheader {\n \
  \ min-width: 800px;\n  nav {\n    width: 800px;\n    margin: 0 auto;\n    li {\n\
  \      list-style: none;\n    }\n  }\n  a {\n    text-decoration: none;\n  }\n}\n\
  ```\n\n当这个 LESS 文件编译时，它看起来与之前的示例完全一样，所有的父规则都显式地写了出来。但嵌套为你节省了不断重新输入父选择器的麻烦。此外，它将规则组织成更有意义的块，例如此示例中的\
  \ `header` 部分。\n\n新的 CSS3 规范允许在实际的 CSS 文件中进行嵌套。但由于跨浏览器支持仍有很长的路要走，在你的编译样式表中使用它是愚蠢的。\n\
  \n### & 符号\n\n到为止，你已经看到了具有父子关系的嵌套，但它也可以更灵活。你可以使用 `&` 符号来嵌套分组的规则，例如，如果不使用 LESS，你会这样写：\n\
  \n```css\np {\n  color: gray;\n  padding: 10px;\n}\np.more-padding {\n  padding:\
  \ 25px;\n}\n```\n\n但你可以使用 `&` 符号来简化它：\n\n```css\np {\n  color: gray;\n  padding:\
  \ 10px;\n  &.more-padding {\n    padding: 25px;\n  }\n}\n```\n\n你也可以将其与伪类配合——例如，为链接定义悬停（hover）状态：\n\
  \n```css\na {\n  text-decoration: none;\n  &:hover {\n    text-decoration: underline;\n\
  \  }\n}\n```\n\n此外，你可以将 `&` 符号放在选择器之后以反转父子顺序：\n\n```css\n.child {\n  color: blue;\n\
  \  .parent & {\n    color: red;\n  }\n}\n```\n\n它编译为：\n\n```css\n.child {\n  color:\
  \ blue;\n}\n.parent .child {\n  color: red;\n}\n```\n\n### 嵌套与变量作用域\n\n变量作用域在嵌套时变得特别强大，因为你可以定义一个局限于给定块的变量：\n\
  \n```css\n.contact-form {\n  @labelWidth: 100px;\n  @formPadding: 5px;\n  padding:\
  \ 5px 0;\n  label {\n    display: inline-block;\n    width: @labelWidth - 10px;\n\
  \    padding-right: 10px;\n    text-align: right;\n    vertical-align: top;\n  }\n\
  \  input[type=text], input[type=email] {\n    width: 250px;\n    padding: @formPadding;\n\
  \  }\n  textarea {\n    width: 400px;\n    height: 150px;\n    padding: @formPadding;\n\
  \  }\n  input[type=submit] {\n    margin-left: @labelWidth;\n    font-size: 36px;\n\
  \  }\n}\n```\n\n在这里，两个变量 `@labelWidth` 和 `@formPadding` 被局限于 `.contact-form` 块的作用域。这样，你就可以拥有全局的\
  \ `@labelWidth` 和 `@formPadding` 变量，并为这个特定的表单设置不同的值。\n\n\n\n\n```less\n*/\n@import\
  \ \"reset.less\";\n@import \"site.less\";\n@import \"media-queries.less\";\n```\n\
  \n此 LESS 文件从基础变量开始，该文件包含了你希望在整个样式表中使用的所有全局变量。接着，它导入了一套标准的 mixins（混合宏），例如在 [`http://lesselements.com`](http://lesselements.com/)\
  \ 中找到的那些。它导入了各种样式表：一个 CSS 重置文件（如 YUI 重置）、一组名为 `site.less` 的主样式，以及一组基于媒体查询的样式修改。\n\
  \n此外，请注意主 `style.less` 文件中并没有实际的样式。通过将所有样式存储在子文件中，你可以确保只需将 `style.less` 复制到任何新项目中（同以及\
  \ `mixins.less` 和 `reset.less`）。\n\n## 自定义结构\n\n你应该根据自己的需求和工作流来自定义文件结构。如果你使用 `@font-face`\
  \ 嵌入了多个不同的字体，请将它们包含在单独的 `fonts.less` 文件中。如果你的样式部分封装得很好，请将其放在单独的文件中，以便于协作开发。\n\n\
  最后，匹配你已经在使用的任何组织方法。例如，如果你喜欢将样式按类型、颜色和布局进行划分，可以通过单独的文件来实现：\n\n- `type.less`：用于字体相关的属性，如\
  \ `font-size`\n- `color.less`：用于颜色和图像属性，如 `background`\n- `layout.less`：用于盒模型属性，如\
  \ `width` 和 `padding`\n\n## 总结\n\nLESS 通过将脚本功能引入样式表，简化了前端开发。它不仅加快了开发过程，还使样式表更具组织性、更易于维护。在这一附录中，你学习了预处理是如何运作的，以及如何安装\
  \ LESS 编译器。然后，你掌握了 LESS 的基础知识，包括变量、基本运算符和嵌套。接下来，你阅读了关于 LESS 内置函数的内容，以及如何编写自定义 mixins。最后，你了解了如何组织\
  \ LESS 应用中的文件结构，以补充你已经在使用的组织技术。在看到 LESS 的工作原理后，我相信你也会同意，在所有项目中使用 CSS 预处理是一个好主意。\n\
