  \ Nipster 上的星级评分。最后，检查 GitHub 以确保该模块受到活跃支持，并且与当前的 Node 版本保持同步。\n\n你绝对应该安装的一个模块是\
  \ Supervisor。Supervisor 监控你 Node 应用中的文件，每当 `*.js` 文件发生变化时，它都会重启服务器。它让开发变得容易得多。在此处了解更多：[`https://github.com/isaacs/node-supervisor`](https://github.com/isaacs/node-supervisor)。\n\
  \n# Node 模式\n\n接下来的三章将讨论在 Node 中构建应用的实用技术。现在，我将带你了解一些通用概念，以便你的应用建立在良好的实践坚实基础之上。\n\
  \n## 模块与全局变量\n\n你已经发现了一些关于引入第三方模块的知识。但你知道也可以创建自己的模块吗？就像你可能会将部分客户端 JavaScript 划分自己的库，将\
  \ Node 脚本分成模块也是一个好主意。编写自己的模块为你的应用提供了结构，并改进了协作开发。它也更容易在多个项目之间复用代码。\n\n### 创建自己的模块\n\
  \n在创建自己的模块时，只需将它们像其他模块一样放在 `node_modules` 目录中。以后引用它们时，使用 `require()` 方法。例如，如果你在\
  \ `node_modules` 目录中有 `my-module.js` 模块，你可以通过以下语句包含它：\n\n```\nvar myModule = require('my-module');\n\
  ```\n\n但如果你倾向于使用不同的结构，可以把模块包含在系统的任何地方。只需指向正确的路径即可：\n\n```\nvar myModule = require('~/path-to/my-module.js');\n\
  ```\n\n如果你认为其他开发者可以从你的模块中受益，请在 GitHub 或 Bitbucket 上分享它。\n\n### 模块间的全局作用域\n\n编写自己的模块时需要记住的一个重要点是，全局变量的工作方式与你预期的略有不同。例如，在客户端\
  \ JavaScript 中，可以通过省略 `var` 关键字来定义全局变量：\n\n```\nglobalVar = true;\nvar localVar\
  \ = false;\n```\n\n在前端，这种方法确保了 `globalVar` 在应用的所有函数中可用，无论哪个文件调用了该变量。然而，Node 处理全局变量的方式不同。在\
  \ Node 中，你定义的任何全局变量都仅在该模块中可用。由于模块直接映射到文件，每个变量仅在给文件中可用。\n\n### 创建全局变量\n\n你可以通过编写以下代码来绕过作用域问题：\n\
  \n```\nGLOBAL.globalVar = true; // 尽量避免这样做\n```\n\n这定义了 `globalVar`，使其可以在应用程序的所有模块中访问。但是，你永远不要在\
  \ Node 中定义全局变量，除非你有非常充分的理由。请记住，模块的全局上下文这样设置是有原因的：它避免了不同模块之间的变量冲突。Node 中的全局变量将用于你的整个应用程序，这意味着你\
  \ Node 服务器中的所有模块和脚本。因此，潜在的冲突问题比客户端应用中的问题要大得多。\n\n### 全局对象\n\n要查看全局作用域上定义了什么，请打开\
  \ REPL 会话并输入 `global`。该命令列出了全局命名空间对象中的所有内容，你可以在图 6-6 中看到部分。\n\n`global` 对象存储了所有的信息，就像客户端\
  \ JavaScript 中的 `window`。然而，由于没有浏览器窗口，Node 将存储在 `global` 中。正如你所看到的，全局命名空间中定义了很多变量。但并不意味着你应该向其中添加内容。由于潜在的冲突问题，定义自己的全局变量是一项风险业务。\n\
  \n### 使用 Exports\n\n通常情况下，你应该避免在 Node 中定义全局变量。相反，每当你需要共享变量作用域时，请手动进行。要共享作用域，你必须使用\
  \ `exports` 显式声明你想从模块共享的任何内容。例如，你的模块可能包含以下函数：\n\n```\nvar sayHello = function()\
  \ {\n  console.log('Hello World!');\n};\n```\n\n如果你在同一个模块中调用 `sayHello()`，它的工作正如你预期的那样。然而，如果你在\
  \ `app.js` 中引入了该模块，该函数不再可用：\n\n```\nvar myModule = require('my-module');\nsayHello();\
  \ // 这将不起\n```\n\n![9781118524565-fg0606.tif](img/9781118524565-fg0606_fmt.png)\n\
  \n图 6-6 REPL 会话中列出的全局作用域部分\n\n相反，你必须使用 `exports` 显式暴露你想共享的函数：\n\n```\nexports.sayHello\
  \ = function() {\n  console.log('Hello World!');\n};\n```\n\n现在你就可以从 `app.js` 调用这个函数了：\n\
  \n```\nvar myModule = require('my-module');\nmyModule.sayHello();\n```\n\n### 导出整个作用域\n\
  \n同样，如果你的模块是一个“独角兽”，你可以以稍微不同的方式暴露函数。例如，假设该模块只有 `sayHello()` 函数。你可以稍微不同地暴露它：\n\n\
  ```\nmodule.exports = function() {\n  console.log('Hello World!');\n};\n```\n\n\
  这里的区别在于你使用了 `module.exports` 而不是 `exports.sayHello`。当你在 app.js 文件中引用模块时，可以看到这种定义有所不同：\n\
  \n```\nvar sayHello = require('say-hello');\nsayHello();\n```\n\n正如你在这里看到的，函数被定义为模块的全部。这种技术对于一次性导出整个对象（而不是多次调用\
  \ `exports`）也有用。例如：\n\n```\n// 为模块定义一个对象\nvar myModule = {\n  var1: true,\n  var2:\
  \ false,\n  func1: function() {\n    console.log('Function 1');\n  },\n  func2:\
  \ function() {\n    console.log('Function 2');\n  }\n};\n\n// 导出整个对象\nmodules.exports\
  \ = myModule;\n```\n\n与其显式导出此模块中的每个变量，此脚本一次性导出了变量对象。模块的各个组件现在可以在 `app.js` 中访问了：\n\
  \n```\nvar myModule = require('my-module');\nif ( myModule.var1 ) {\n```\n\n\n\n\
  \n\n```javascript\n  myModule.func1();\n}\n\nelse {\n  myModule.func2();\n}\n```\n\
  \n# 模块的多个实例\n\n这种技术对于导出同一个模块的多个实例也非常有用。例如，创建一个用户的模块：\n\n```javascript\n// user 数据模块\n\
  modules.exports = function( name, age, gender ) {\n  this.name = name;\n  this.age\
  \ = age;\n  this.gender = gender;\n  this.about = function() {\n    return this.name\
  \ + ' is a ' + this.age + ' year old ' + this.gender;\n  }\n}\n```\n\n现在你可以在 `app.js`\
  \ 中使用 `new` 关键字创建一个 `User` 的新实例：\n\n```javascript\n// 引入模块\nvar User = require('./user.js');\n\
  // 创建用户的新实例，并传入合适的参数\nvar user = new User( 'Jon', 30, 'man' );\n// 使用模块的 about()\
  \ 方法\nconsole.log( user.about() );\n```\n\n该脚本引入了你在模块中设置的上下文，因此 `user.about()` 返回“Jon\
  \ is a 30 year old man.”同样，你可以访问模块中定义的其他信息。例如，要直接访问用户的姓名，你只需要编写 `user.name` 即可。\n\
  \n# 异步模式\n\n异步请求对于加快 Node 服务器速度和提高你的应用程序性能非常有帮助。但它们也可能更难处理，特别是当你期望函数按照特定顺序执行时。从本质上说，异步方法会尽早被调用，这意味着即使你于调用函数\
  \ `b` 之前调用了函数 `a`，你无法保证它会先完成。在没有确定的执行顺序的情况下，在 Node 中编程可能是具有挑战性的。每当你依赖函数按顺序执行时，情况尤为如此。\n\
  \n# 同步调用\n\n为了避免阻塞执行，Node 的大多数原生方法默认都是异步的。尽管如此，Node 也提供了其大多数方法的同步版本。例如，你可以使用 `fs`（文件系统）模块的\
  \ `readFile()` 方法读取文件内容：\n\n```javascript\n// 引入 fs 模块\nvar fs = require('fs');\n\
  // 读取文件\nfs.readFile('./path-to/my-file.txt', 'utf8', function(err, data) {\n  if\
  \ (err) throw err;\n  console.log(data);\n});\n```\n\n由于你没有将此标记为同步方法，Node 使用了默认的异步模式。然而，读取文件可能需要一些时间，如果你在等待此函数的结果，可能会产生意外的问题。为了解决这个问题，请使用\
  \ `readFileSync()` 方法：\n\n```javascript\n// 引入 fs 模块\nvar fs = require('fs');\n\
  // 同步读取文件\nvar data = fs.readFileSync('./path-to/my-file.txt', 'utf8');\nconsole.log(data);\n\
  ```\n\n该脚本在读取文件时会阻塞线程，因此在文件准备好之前，任何依赖函数都无法执行。然而，读取文件可能需要一段时间往往是不使用这种方法恰的原因。记住，同步调用完成所需的时间越长，你的整个\
  \ Node 服务器被阻塞的时间越长。因此，虽然你可以在某些情况下使用同步方法，但尽可能避免使用它们是一个好主意。\n\n大多数 Node 方法都带有一个同步对应，你可以通过附加\
  \ `Sync` 来访问它——例如，`readFile()` 变为 `readFileSync()`。\n\n# 嵌套回调\n\n幸运的是，你可以获得同步调用的所有用处，而不会阻塞主线程。技巧是使用嵌套回调。例如，你可以使用以下脚本读取目录中的所有文件：\n\
  \n```javascript\nvar fs = require('fs');\n// 获取目录列表\nfs.readdir('./my-dir', function(err,\
  \ files) {\n  var count = files.length,\n      results = {};\n  // 循环并读取所有文件\n \
  \ files.forEach(function(filename) {\n    fs.readFile('./my-dir/' + filename, 'utf8',\
  \ function(err, data) {\n      results[filename] = data;\n      count--;\n     \
  \ if ( count <= 0 ) {\n          console.log(results);\n      }\n    });\n  });\n\
  });\n```\n\n该脚本首先使用 `fs` 模块的 `readdir()` 获取目录列表。然后它遍历该目录中的所有文件，读取它们的内容。由于每个单独的调用都是异步的，所有文件都可以并行读取，脚本不会阻塞主线程完成其他任务。但嵌套确保了关键函数仍然按串行执行。\n\
  \n然而，你可能已经发现了这种方法的缺点：回调地狱（callback spaghetti），又被称为“地狱金字塔”。每个嵌套回调都会让链进一步缩进，并让你更容易在代码中迷路。这个示例只有两个嵌套回调，并不太糟糕，但它们真的会开始堆积。当这种情况发生时，代码会变得非常难以维护。为了避免这种情况，你可以使用\
  \ Promise 或 async/await。\n\n\n\n\n使用这种技术，你可以在整个应用程序中设置自定义事件和处理器。例如，以下是如何创建一个在间隔器每次滴答时触发的事件：\n\
  \n```javascript\n// 引入 events 模块\nvar events = require('events');\n\n// 创建 EventEmitter\
  \ 实例\nvar em = new events.EventEmitter();\nvar counter = 0;\n\n// 每 5 秒发射一次事件\n\
  var timer = setInterval(function() {\n  em.emit('tick');\n}, 5000);\n\n// 处理事件，记录\
  \ 'Tick' 或 'Tock'\nem.on('tick', function() {\n  counter++;\n  console.log( counter\
  \ % 2 ? 'Tick' : 'Tock');\n});\n```\n\n在这里，间隔器每隔五秒触发一次 `tick` 事件。每次触发时，`tick` 处理器都会增加\
  \ `counter` 值，然后打印 `Tick` 或 `Tock`。\n\n启动你的 Node 服务器，你将看到与图 6-7 类似的内容：\n\n![9781118524565-fg0607.tif](img/9781118524565-fg0607_fmt.png)\n\
  \n图 6-7 自定义事件每五秒记录一次。\n\n## 子进程 (Child Processes)\n\n虽然客户端 JavaScript 受限于浏览器支持的特性，但\
  \ Node 开发完全完全相反。除了 Node 提供的各种模块外，你还可以访问 Node 运行所在操作系统的所有功能。这意味着你可以用 Node 构建任何东西。\n\
  \n访问操作系统命令非常简单，只需引入 `child_process` 模块，它是 Node 核心部分的一部分。特别地，你可能想要使用 `spawn` 方法，因此请作为你的\
  \ `require` 语句的一部分调用它：\n\n```javascript\nvar spawn = require('child_process').spawn;\n\
  ```\n\n请注意，本节中的示例仅在 Linux 或 UNIX 系统（如 Mac）上运行。如果你正在使用 Windows，则将需要使用 Windows 命令。\n\
  \n### 使用子进程\n\n现在你可以使用这来调用你喜欢的任何操作系统命令。例如，你可以使用 `ls` 获取当前目录列表。第一步是为 `ls` 派生一个子进程：\n\
  \n```javascript\n// 引入 child_process 模块\nvar spawn = require('child_process').spawn;\n\
  // 为 ls 派生一个子进程\nvar ls = spawn('ls');\n```\n\n接下来，设置几个事件。首先是一个标准输出 (`stdout`) 处理器：\n\
  \n```javascript\n// 处理标准输出\nls.stdout.on('data', function(data) {\n  console.log(data.toString());\n\
  });\n```\n\n这会将 `ls` 的结果输出到 Node 控制台。然而，只有在没有错误时才会发生。你还应该设置一个标准错误 (`stderr`) 处理器：\n\
  \n```javascript\n// 处理错误\nls.stderr.on('data', function(data) {\n  console.log('Error:\
  \ ' + data);\n});\n```\n\n最后，你应该设置一个命令退出时的处理器。这样你就可以根据程序是否崩溃来获取成功或失败的消息：\n\n```javascript\n\
  // 处理退出\nls.on('exit', function(code) {\n  console.log('child process exited with\
  \ code ' + code);\n});\n```\n\n将脚本组合在一起：\n\n```javascript\n// 引入 child_process 模块\n\
  var spawn = require('child_process').spawn;\n// 为 ls 派生一个子进程\nvar ls = spawn('ls');\n\
  // 处理标准输出\nls.stdout.on('data', function(data) {\n  console.log(data.toString());\n\
  });\n// 处理错误\nls.stderr.on('data', function(data) {\n  console.log('Error: ' + data);\n\
  });\n// 处理退出\nls.on('exit', function(code) {\n  console.log('child process exited\
  \ with code ' + code);\n});\n```\n\n当你运行此脚本时，它将在 Node 控制台中输出工作目录的列表，如你在图 6-8 中所示：\n\
  \n![9781118524565-fg0608.tif](img/9781118524565-fg0608_fmt.png)\n\n图 6-8 此目录列表是通过\
  \ Node 使用 `child_process` 桥接到操作系统输出的。\n\n### 向子进程传递变量\n\n你也可以向子进程传递变量。例如，要获取目录中所有文件的列表（包括隐藏文件），在命令行中输入以下内容：\n\
  \n`ls -a`\n\n要在 Node 中执行相同的命令，请向 `spawn()` 传递第二个参数。此第二个参数是一个包含你想传递给命令的任何参数的数组：\n\
  \n```javascript\nvar ls = spawn('ls', ['-a']);\n```\n\n\n\n接下来，你为这些路由创建处理程序，使用 Underscore\
  \ 模板显示视图。默认情况下，Express 使用 Jade 模板，但你将其切换到 Underscore，这样你就无需学习一种新的模板语言。最后，你通过一个特殊的\
  \ POST 路由处理提交的表单数据。然后你验证表单数据，并为发生的任何错误渲染消息。如果表单通过验证，你将向服务器管理员发送电子邮件。到本章结束，你将已经掌握\
  \ Express，并准备好构建自己的 Node 应用。\n\n## 开始使用 Express\n\n使用 Express 的主要优势是它让开发变得更容易。幸运的是，这意味着使用\
  \ Express 的学习曲线非常平缓——为你的第一个应用准备环境轻而易举。\n\n## 安装 Express\n\n使用 Express 的第一步是通过 NPM\
  \ 安装该模块。由于你可能需要在许多不同的 Node 项目中使用 Express，因此使用 `-g` 标志将其安装为全局模块是一个好主意：\n\n```bash\n\
  npm install express -g\n```\n\n如果失败，请使用 sudo：\n\n```bash\nsudo npm install express\
  \ -g\n```\n\n尽管 Express 有许多依赖，但安装过程应该非常快。\n\n## 创建 Express 应用\n\n接下来为你的 Express\
  \ 应用创建一个新文件夹。在文件夹内部，调用以下命令：\n\n```bash\nexpress --css less\n```\n\n此命令创建了一个新的 Express\
  \ 应用，支持 CSS 预处理器 LESS，该应用将在本章中使用它。\n\n在实例化你的 Express 应用时，你可以包含许多不同的功能。例如，你可以使用 `--sessions`\
  \ 包含对会话的支持。\n\n我强烈建议在你构建的任何应用中使用 CSS 预处理。在本章中，我不会详细介绍 LESS 的细节，但你可以查看附录 A 获取有关该预处理器的更多信息。或者，如果你有想在\
  \ Express 中使用的其他预处理器，只需在命令中调用它：`--css sass` 或 `--css stylus`。\n\n在运行应用之前，你需要使用以下命令安装更多依赖项：\n\
  \n```bash\ncd . && npm install\n```\n\n最后，启动应用：\n\n```bash\nnode app\n```\n\n如果一切运行正常，你应该能看到它输出\
  \ `Express server listening on port 3000`，如图图 7-1 所示。\n\n![9781118524565-fg0701.tif](img/9781118524565-fg0701_fmt.png)\n\
  \n图 7-1 Express 服务器现在正在运行。\n\n当你路由到 [`http://localhost:3000`](http://localhost:3000)\
  \ 时，你应该能看到像图 7-2 这样的欢迎消息。\n\n![9781118524565-fg0702.eps](img/9781118524565-fg0702_fmt.png)\n\
  \n图 7-2 Express 服务器正在 localhost:3000 上运行。\n\n## 设置路由\n\n在第 3 章中，你在 Backbone 中设置了路由以将某些\
  \ URL 映射到应用的不同状态。Express 中的路由工作原理本质上相同，不同之处它们映射到服务器上的实际路径。\n\n### 现有路由\n\n学习路由的最好是查看\
  \ Express 构建中已经存在的路由。打开 `app.js` 并寻找以下行：\n\n```javascript\napp.get('/', routes.index);\n\
  app.get('/users', user.list);\n```\n\n这是两个基础路由，一个在根目录（[`http://localhost:3000/`](http://localhost:3000/)`），另一个在\
  \ [`http://localhost:3000/users`](http://localhost:3000/users)。\n\n#### Routes 目录\n\
  \n这两个基础路由都将路径绑定到应用中 `./routes` 目录下的特定回调函数。例如，第二个路由将 [`http://localhost:3000/users`](http://localhost:3000/users)\
  \ URL 绑定到位于 `./routes/user.js` 中的一个函数。打开该文件查看以下内容：\n\n```javascript\n/*\n* GET users\
  \ 列表。\n*/\nexports.list = function(req, res){\n  res.send('respond with a resource');\n\
  };\n```\n\n`app.js` 中的路由将 `/users` 路径映射到 `user.list`，这意味着它会在 `./routes/user.js`\
  \ 中查找 `exports.list` 回调。在这种情况下，列表函数向屏幕打印简单的消息，当你将浏览器路由到 [`http://localhost:3000/users`](http://localhost:3000/users)\
  \ 时，你可以看到它，如图图 7-3 所示。\n\n![9781118524565-fg0703.eps](img/9781118524565-fg0703_fmt.png)\n\
  \n图 7-3 浏览器中显示了 `user.list` 路由。\n\n你可能记得在第 6 章学习过 `exports` 对象。它被用于在 Node 的模块之间传递变量。在这种情况下，它中继了\
  \ `list` 函数，以便路由器可以使用它。\n\n现在看看第一个路由：\n\n```javascript\napp.get('/', routes.index);\n\
  ```\n\n这个路由稍微有点困惑，因为 `routes.index` 并不是指向名为 `./routes/routes.js` 的文件。相反，此路由指向 `./routes/index.js`\
  \ 中的行为。\n\n### Render 函数\n\n在主页路由中，你可能注意到了 `render` 函数的使用，Express 使用它来编译视图。在这种情况下，render\
  \ 函数是：\n\n```javascript\nres.render('index', { title: 'Express' });\n```\n\n第一个参数是模板文件名。它对应于\
  \ `./views` 目录下的 `index.jade` 文件。默认情况下，Express 使用 Jade 模板。第二个参数是你想传递给模板的变量。\n\n\
  ## 创建路由\n\n在你了解路由如何工作后，你可以创建一些自己的路由。打开 `app.js` 并添加以下路由：\n\n```javascript\napp.get('/about',\
  \ routes.about);\napp.get('/contact', routes.contact);\n```\n\n现在打开 `./routes/index.js`\
  \ 为这些路由添加：\n\n```javascript\n/*\n* GET about 页面。\n*/\nexports.about = function(req,\
  \ res){\n  res.render('about', { title: 'About' });\n};\n\n/*\n* GET contact 页面。\n\
  */\nexports.contact = function(req, res){\n  res.render('contact', { title: 'Contact'\
  \ });\n};\n```\n\n当你修改 `app.js` 文件时，确保重启 Express 服务器以传播更改。在这样做之前，这些路径将无法工作。或者可以使用\
  \ Supervisor，一个你在第 6 章介绍过的模块：[`https://github.com/isaacs/node-supervisor`](https://github.com/isaacs/node-supervisor)。\n\
  \n## Post, Put 和 Delete\n\n到为止你只使用了 `app.get()`，它对应于基本的 GET 请求——例如，获取页面。但 Express\
  \ 是围绕 REST 设计的，因此提供了额外的请求类型方法。你可以以与 `app.get()` 完全相同的方式使用 `app.post()`、`app.put()`\
  \ 和 `app.delete()` 为所需的请求提供路由。你将在本章晚些时候看到 `app.post()`，当你学习如何处理表单数据时。\n\n## 渲染视图\n\
  \n到为止你设置了一些路由，但如果你导航到 [`http://localhost:3000/about`](http://localhost:3000/about)\
  \ 或 [`http://localhost:3000/contact`](http://localhost:3000/contact)，你将得到 500 错误。这是因为你还没有设置视图。\n\
  \n### 启用 Underscore 模板\n\n默认情况下，Express 自带了一个名为 Jade 的模板引擎。Jade 是 TJ Holowaychuk（他也是\
  \ Express 的创建者）创建一个极简模板引擎。\n\n### Jade 模板\n\n为了了解 Jade 如何工作，打开 Express 应用目录下的 `layout.jade`。你应该看到类似的内容：\n\
  \n```jade\ndoctype 5\nhtml\n  head\n    title= title\n    link(rel='stylesheet',\
  \ href='/stylesheets/style.css')\n  body\n    block content\n```\n\n正如你看到的，Jade\
  \ 模板非常简洁。标签名称周围没有角括号，属性在括号内定义。\n\n你也可以使用 CSS 样式选择器在 Jade 中定义 ID 和类——例如：\n\n```jade\n\
  #my-id\n  p.my-class Text content\n```\n\n\n\n\n此代码段的编译如下：\n\n```html\n<div id=\"\
  my-id\">\n  <p class=\"my-class\">Text content</p>\n</div\n```\n\n虽然 Jade 模板对于减少模板文件中的字符数非常有用，但它们可能难以阅读，而且学习曲线比其他模板引擎更陡。\n\
  \n# Underscore 模板与 uinexpress\n\n在阅读了第 4 章后，你已经熟练了使用 Underscore 模板，那么为什么不在 Express\
  \ 中使用它们呢？幸运的是，有一个名为 `uinexpress` 的 Node 模块，它可以轻松地在 Express 中启用 Underscore 模板。首先通过\
  \ NPM 安装 `uinexpress` 和 `Underscore`：\n\n```bash\nnpm install uinexpress\nnpm install\
  \ underscore\n```\n\n接下来，打开 `app.js` 并修改 Express 配置。在 `// all environments` 行下方添加以下几行：\n\
  \n```javascript\napp.engine('html', require('uinexpress').__express);\napp.set('view\
  \ engine', 'html');\n```\n\n然后，注释掉 Jade 视图引擎的行：\n\n```javascript\n//  app.set('view\
  \ engine', 'jade');\n```\n\n最后，重启你的 Express 服务器使更改生效。\n\n# 转换 Jade 模板\n\n如果你路由到\
  \ [`http://localhost:3000`](http://localhost:3000)，你会发现页面现在崩溃了。这是因为 Jade 模板不再工作了。但别担心——你可以轻松地修改现有的\
  \ Jade 模板，为应用中的视图获取基础状态。首先，在 `views` 目录中打开 `layout.jade`，它看起来应该是这样的：\n\n```jade\n\
  doctype 5\nhtml\n  head\n    title= title\n    link(rel='stylesheet', href='/stylesheets/style.css')\n\
  \  body\n    block content\n```\n\n现在，将此模板转换为一个更熟悉的 Underscore 版本：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title><%=title %></title>\n    <link rel=\"\
  stylesheet\" href=\"/stylesheets/style.css\" />\n</head>\n<body>\n<%=<%=body %>\n\
  </body>\n</html>\n```\n\n在这里你看到了一些熟悉的 Underscore 模式，例如由 `<% %>` 分隔的变量。将此新的 Underscore\
  \ 模板保存为 `layout.html`。\n\n接下来，打开 `index.jade`，它看起来应该是这样的：\n\n```jade\nextends layout\n\
  block content\n  h1= title\n  p Welcome to #{title}\n```\n\n你也可以将其转换为 Underscore\
  \ 模板：\n\n```html\n<h1><%=title %></h1>\n<p>Welcome to <%=title %></p>\n```\n\n将此新文件保存为\
  \ `index.html`，你就大完成了。在 [`http://localhost:3000`](http://localhost:3000) 上刷新页面，你应该能看到与之前相同的欢迎信息，如图\
  \ 7-4。\n\n你可能已经注意到这些模板中删除了 `extends layout` 和 `block content` 调用。但别担心，新的 Underscore\
  \ 模板功能与它们先前的 Jade 前身完全相同。\n\n当索引视图被渲染时，它会编译 `index.html` 中的内容并将其传递给 `layout.html`\
  \ 中的 `<%=body %>` 变量。\n\n使用 Node 的用部分之一是你可以在客户端重用相同的模板文件。这意味着你可以使用 Node 创建页面的静态版本，也可以使用\
  \ Ajax 加载完全相同的页面。\n\n在第 3 章中，你读到过如何使用 `pushState` 加载 Backbone 视图。在那里我解释了为什么为每个页面准备静态备份是重要的。没有比使用在前端利用完全相同的\
  \ Underscore 模板的 Node 服务器更简单的方法来完成这一点了。\n\n## 创建视图\n\n一旦你启用了 Underscore 模板，就可以开始为各种页面构建视图了。我会保持这些视图非常简单，但欢迎根据你的\
  \ Underscore 技能对其进行润饰。\n\n## 首页\n\n首先，从首页的模板开始。在 `./views` 目录下的 `index.html` 中添加以下内容：\n\
  \n```html\n<h1><%=title %></h1>\n<% if ( typeof subtitle !== 'undefined' ) { %>\n\
  <h2><%=subtitle %></h2>\n<% } %>\n<p><%=description %></p>\n```\n\n这里函数中添加了几个新变量：一个可选的副标题和一个描述。\n\
  \n现在打开 `./routes` 目录下的 `index.js`。首页的路由已经指向此模板；你只需要更改传递给它的变量：\n\n```javascript\n\
  /*\n* GET home page.\n*/\nexports.index = function(req, res){\n  res.render('index',\
  \ {\n    title: 'My First Express App',\n    description: 'This is my first Express\
  \ app, so go easy on me'\n  });\n};\n```\n\n现在，如果你在 [`http://localhost:3000`](http://localhost:3000)\
  \ 刷新页面，你将看到如图 7-4 所示的新首页。\n\n![9781118524565-fg0704.eps](img/9781118524565-fg0704.eps)\n\
  \n图 7-4 新首页渲染正确。\n\n## 关于页面\n\n接下来，你需要为关于页创建一个视图。关于页的布局看起来和首页非常相似，你只需要创建 `main.html`\
  \ 并传递变量。为了避免重复，我们可以使用 `main.html`。\n\n修改首页路由：\n\n```javascript\n/*\n* GET home page.\n\
  */\nexports.index = function(req, res){\n  res.render('main', {\n    title: 'My\
  \ First Express App',\n    subtitle: 'I built this'\n  });\n};\n```\n\n然后设置关于路由：\n\
  \n```javascript\n/*\n* GET about page.\n*/\nexports.about = function(req, res){\n\
  \  res.render('main', {\n    title: 'About',\n    subtitle: 'I built this'\n  });\n\
  };\n```\n\n最后，重启服务器以清除缓存。现在路由到 [`http://localhost:3000/about`](http://localhost:3000/about)，你会看到如图\
  \ 7-5 所示的页面。\n\n![9781118524565-fg0705.eps](img/9781118524565-fg0705.eps)\n\n图 7-5\
  \ 关于页面渲染正确。\n\n## 联系页面\n\n最后但不是不是，你需要为联系页面设置视图。此视图会有所不同，因此你需要在 `./views` 目录中创建 `contact.html`\
  \ 并添加标记：\n\n```html\n<h1><%=title %></h1>\n<p><%=description %></p>\n<form method=\"\
  post\">\n  <div class=\"form-item\">\n    <label for=\"name\">Name</label>\n   \
  \ <input type=\"text\" name=\"name\" required />\n  </div>\n  <div class=\"form-item\"\
  >\n    <label for=\"email\">Email</label>\n    <input type=\"email\" name=\"email\"\
  \ required />\n  </div>\n  <div class=\"form-item\">\n    <label for=\"message\"\
  >Message</label>\n    <textarea name=\"message\" required></textarea>\n  </div>\n\
  \  <div class=\"form-item\">\n    <input type=\"submit\" value=\"Send\" />\n  </div>\n\
  </form>\n```\n\n接下来，调整路由：\n\n```javascript\n/*\n* GET contact page.\n*/\nexports.contact\
  \ = function(req, res){\n  res.render('contact', {\n    title: 'Contact Us',\n \
  \   description: 'Send us a message and we\\'ll get back to you'\n  });\n};\n```\n\
  \n现在，如果你路由到 [`http://localhost:3000/contact`](http://localhost:3000/contact)，你会发现页面看起来很丑。是时候添加一些\
  \ CSS 来改进样式了。进入 `./public/stylesheets`目录目录打开 `style.less`。在这里，添加以下 LESS 样式：\n\n\
  ```less\n.form-item {\n  @labelWidth: 100px;\n  @formPadding: 5px;\n  padding: 5px\
  \ 0;\n  label {\n    display: inline-block;\n    width: @labelWidth - 10px;\n  \
  \  padding-right: 10px;\n    text-align: right;\n    vertical-align: top;\n  }\n\
  \  input[type=text], input[type=email] {\n    width: 250px;\n    padding: @formPadding;\n\
  \  }\n  textarea {\n    width: 400px;\n    height: 150px;\n    padding: @formPadding;\n\
  \  }\n  input[type=submit] {\n    margin-left: @labelWidth;\n  }\n}\n```\n\n\n\n\
  \n\n```css\n  font-size: 36px;\n}\n}\n```\n\n当你保存 `style.less` 时，Express 会自动将其编译为\
  \ `style.css`。现在，访问 [`http://localhost:3000/contact`](http://localhost:3000/contact)，你将看到看到渲染后的表单，如图\
  \ 7-6 所示。\n\n![9781118524565-fg0706.eps](img/9781118524565-fg0706_fmt.png)\n\n图\
  \ 7-6 联系视图在额外的样式作用下渲染得很好。\n\nLESS 样式看起来与普通的 CSS 非常相似，但其中混合了一些额外内容，例如 `@labelWidth`\
  \ 和 `@formPadding` 变量。\n\n此外，注意所有样式都嵌套在 `.form-item` 下，这使得样式表的组织更加合理，但不用担心，它仍然会被编译为普通的\
  \ CSS。例如，嵌套的 `label` 变为 `.form-item label`。\n\n阅读附录 A 了解更多关于 LESS 和 CSS 预处理的知识。\n\
  \n# 布局模板\n\n在创建这些视图的模板时，不要忘记 `layout.html`。你可以使用此模板添加任何希望出现在应用每个页面上的内容——例如，Google\
  \ Analytics 跟踪代码或网站页脚。\n\n例如，你已经为应用的不同页面设置了路由，但用户如何到达这些页面呢？最好在 `layout.html` 中添加一些导航：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title><%=title %></title>\n  <link\
  \ rel=\"stylesheet\" href=\"/stylesheets/style.css\" />\n</head>\n<body>\n<nav>\n\
  \  <ul>\n    <li>\n      <a href=\"/\">首页</a>\n    </li>\n    <li>\n      <a href=\"\
  /about\">关于</a>\n    </li>\n    <li>\n      <a href=\"/contact\">联系</a>\n    </li>\n\
  \  </ul>\n</nav>\n<%=body %>\n</body>\n</html>\n```\n\n接下来为 `style.less` 添加一些样式：\n\
  \n```less\nnav {\n  background-color: tomato;\n  padding: 0 50px;\n  position: absolute;\n\
  \  top: 0;\n  left: 0;\n  right: 0;\n  > ul {\n    list-style: none;\n    margin:\
  \ 0;\n    padding: 0;\n  }\n  li {\n    > a {\n      color: papayawhip;\n      text-decoration:\
  \ none;\n      float: left;\n      padding: 20px;\n      &:hover {\n        color:\
  \ tomato;\n        background-color: papayawhip;\n      }\n    }\n  }\n}\n```\n\n\
  现在已经添加了导航，页面看起来漂亮多了，如图 7-7 所示。\n\n![9781118524565-fg0707.eps](img/9781118524565-fg0707_fmt.png)\n\
  \n图 7-7 `layout.html` 中添加了导航，这将其添加到应用中的所有视图中。\n\n不要太担心 LESS 代码——Express 会自动将其编译为普通的\
  \ CSS，如果你想了解更多关于 LESS 的知识，请阅读附录 A。\n\n# 处理表单数据\n\n此时，Express 应用中已经设置了几个基础路由和视图，但你仍然需要处理表单数据。在本节中，你首先学习如何设置\
  \ POST 路由来处理表单数据。然后你在服务器端对表单数据进行验证，并在客户端渲染任何错误。\n\n## 创建 POST 路由\n\n为了好玩，尝试提交当前的联系表单。你应该看到一个错误\
  \ `Cannot POST /contact`，如图 7-8 所示。\n\n这看起来可能有点奇怪，因为你已经为 `/contact` 设置了路由。然而，你仍然无法向该路由发布表单数据，因为它被设置为\
  \ GET 路由：\n\n```javascript\napp.get('/contact', routes.contact);\n```\n\n要处理 POST\
  \ 请求，你需要在 `app.js` 中设置不同的 POST 路由：\n\n```javascript\napp.post('/contact', routes.contactHandler);\n\
  ```\n\n![9781118524565-fg0708.eps](img/9781118524565-fg0708_fmt.png)\n\n图 7-8 提交表单触发了错误。\n\
  \n现在，在 `./routes/index.js` 中添加处理器：\n\n```javascript\n/*\n* POST 页面。\n*/\nexports.contactPostHandler\
  \ = function(req, res){\n  console.log('Name: ' + req.body.name);\n  console.log('Email:\
  \ ' + req.body.email);\n  console.log('Message: ' + req.body.message);\n  res.send('Form\
  \ posted successfully');\n};\n```\n\n尽管这个处理器非常基础，但有几个模式需要注意。主要注意脚本是如何深入请求对象 `req`\
  \ 来提取不同的不同字段的。例如 `req.body.name` 提取了在 `<input type=\"text\" name=\"name\" />` 字段中提交的数据。\n\
  \n重启 Express 服务器并提交表单。你应该能在浏览器中看到完成完成的消息。此外，表单数据会输出到控制台中，如图 7-9 所示。\n\n![9781118524565-fg0709.tif](img/9781118524565-fg0709_fmt.png)\n\
  \n图 7-9 表单数据正在输出到控制台中。\n\n## 向模板发送反馈\n\n表单已经输出了基础的成功消息，但仍然有很大的改进空间。如果表单有任何错误，这些错误应该输出给用户，以便提供重新提交表单的机会。\n\
  \n## 验证\n\n表单标记已经包含了 HTML5 验证钩子，例如电子邮件字段和 `required` 属性。假设用户使用的是兼容 HTML5 的浏览器，这些字段将在表单提交到你的服务器之前进行验证。\n\
  \n然而，重要的是，尽管有这些检查，某些格式错误的数据仍可能通过。例如，如果用户使用旧版浏览器，验证将不起，或者在极少数情况下黑客尝试直接向表单。幸运的是，你可以在后端构建额外的验证来清理表单数据，并向用户发送有意义的响应。首先构建验证以确保所有必填字段都已填写：\n\
  \n```javascript\n// 验证必填字段\nfunction isFilled(field) {\n  return field !== undefined\
  \ && field !== '';\n}\nexports.contactPostHandler = function(req, res) {\n  var\
  \ response = 'Form posted successfully',\n  required = [ 'name', 'email', 'message'\
  \ ],\n  missing = [];\n  // 检查必填字段\n  missing = required.filter(function(prop) {\n\
  \    return !isFilled(req.body[prop]);\n  });\n  if ( missing.length ) {\n    response\
  \ = 'Please fill out all required fields (' + missing.join(', ') +\n    ')';\n \
  \ }\n  // 发送成功或错误消息\n  res.send( response );\n};\n```\n\n这里发生了几件事：\n\n- 脚本定义了一个\
  \ `isFilled()` 函数，它检查字段是否为空或未定义。进行这两项检查都是重要的，以防有人直接向表单提交。\n- `required` 数组中的项根据\
  \ `isFilled()` 测试进行过滤。如果缺少任何任何项，就会创建一个相应的错误消息。\n- 如果存在错误，错误将打印到屏幕上，否则将打印成功消息。\n\n\
  这是一个非常基础的表单，所以你唯一需要验证的另一个电子邮件地址。你可以使用简单的电子邮件正则表达式来完成：\n\n```javascript\n// 验证必填字段\n\
  function isFilled(field) {\n  return field !== undefined && field !== '';\n}\n//\
  \ 验证电子邮件地址\nvar emailRegex = /^(([^<>\\]\\\\.,;:\\s@\\\"]+(\\.[^<>\\]\\\\.,;:\\\
  s@\\\"]+)*)|\n(\\\".\"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\\
  ])|\n([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;\nfunction isValidEmail(email) {\n  return\
  \ emailRegex.test(email);\n}\nexports.contactPostHandler = function(req, res) {\n\
  \  var response = 'Form posted successfully',\n  required = [ 'name', 'email', 'message'\
  \ ],\n  missing = [];\n  // 检查必填字段\n  missing = required.filter(function(prop) {\n\
  \    return !isFilled(req.body[prop]);\n  });\n  if ( missing.length ) {\n    response\
  \ = 'Please fill out all required fields (' + missing.join(', ') +\n    ')';\n \
  \ }\n  // 检查电子邮件\n  else if ( !isValidEmail( req.body.email ) ) {\n    response\
  \ = 'Please enter a valid email address';\n  }\n  // 发送成功或错误消息\n  res.send( response\
  \ );\n};\n```\n\n\n\n\n邮件测试非常直观。查看脚本中的**粗体部分**，可以看到一个 `isValidEmail` 函数，它使用一个基础正则表达式来验证电子邮件地址。\n\
  \n此表单的验证非常简单。但如果你正在处理更复杂的表单，可以考虑使用 Node Validator 模块：[`https://github.com/chriso/node-validator`](https://github.com/chriso/node-validator)。\n\
  \n# 在模板中渲染反馈\n\n到目前，脚本仅在提交表单时打印基础的错误或成功消息。但如果能在模板中输出这些反馈效果会好得多。这不仅看起来更好，还能让用户有机会修正表单中的任何问题。打开\
  \ `./views` 目录下的 `contact.html` 并进行以下更改：\n\n```html\n<h1><%=title %></h1>\n<% //\
  \ error message\nif (typeof success != 'undefined' && !success) { %>\n<p style=\"\
  color: red\"><%=description %></p>\n<% }\nelse { %>\n<p><%=description %></p>\n\
  <% } %>\n<% // 只有在未提交或提交失败时才输出表单\nif (typeof success == 'undefined' || !success)\
  \ { %>\n<form method=\"post\">\n  <div class=\"form-item\">\n    <label for=\"name\"\
  >Name:</label>\n    <input type=\"text\" name=\"name\" id=\"name\" required <%=\
  \ typeof name != 'undefined' ? 'value=\"' + name + '\"' : '' %/>\n  </div>\n  <div\
  \ class=\"form-item\">\n    <label for=\"email\">Email:</label>\n    <input type=\"\
  email\" name=\"email\" id=\"email\" required <%= typeof email != 'undefined' ? 'value=\"\
  ' + email + '\"' : '' %/>\n  </div>\n  <div class=\"form-item\">\n    <label for=\"\
  message\">Message:</label>\n    <textarea name=\"message\" id=\"message\" required><%=\
  \ typeof message != 'undefined' ? message : '' %></textarea>\n  </div>\n  <div class=\"\
  form-item\">\n    <input type=\"submit\" value=\"Send\" />\n  </div>\n</form>\n\
  <% } %>\n```\n\n这里对模板进行了一些基础更改，并已用**粗体**标记：\n\n- 如果表单提交失败，则添加了错误样式。\n- 设置为表单仅在提交失败（或尚未提交）时才渲染。\n\
  - 如果每个字段的值存在，则将其添加。这样一来，当发生错误时，用户就不会丢失其在表单中输入的任何内容。\n\n这里的更改都非常直观，但请注意 `typeof`\
  \ 检查。Underscore 模板会在尝试引用不存在的变量时抛出错误，因此检查未定义的变量是非常重要的。\n\n# 向模板传递新变量\n\n最后，修改视图控制器以便表单提交时将相应的变量传递给模板：\n\
  \n```javascript\n// 验证必字段\nfunction isFilled(field) {\n  return field !== undefined\
  \ && field !== '';\n}\n// 验证电子邮件地址\nvar emailRegex = /^(([^<>()[\\]\\\\.,;:\\s@\\\
  \"]+(\\.[^<>()[\\]\\\\.,;:\\s@\\\"]+)*)|(\\\".+\\\"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\\
  .[0-9]{1,3}\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+[a-zA-Z]{2,}))$/;\nfunction isValidEmail(email)\
  \ {\n  return emailRegex.test(email);\n}\nexports.contactPostHandler = function(req,\
  \ res) {\n  var response = 'Thank you for contacting us, we will get back to you\
  \ as soon as possible',\n      required = [ 'name', 'email', 'message' ],\n    \
  \  missing = [],\n      success = false;\n  // 检查必字段\n  missing = required.filter(function(prop)\
  \ {\n    return !isFilled(req.body[prop]);\n  });\n  if ( missing.length ) {\n \
  \   response = 'Please fill out all required fields (' + missing.join(', ') + ')';\n\
  \  }\n  // 检查邮箱\n  else if ( !isValidEmail( req.body.email ) ) {\n    response =\
  \ 'Please enter a valid email address';\n  }\n  else {\n    success = true;\n  }\n\
  \  // 构建模板变量\n  var templateVars = {\n      description: response,\n      success:\
  \ success\n  };\n  // 错误输出\n  if ( !success ) {\n    console.log( response );\n\
  \    templateVars.title = 'Contact Us';\n    templateVars.name = req.body.name;\n\
  \    templateVars.email = req.body.email;\n    templateVars.message = req.body.message;\n\
  \  }\n  // 成功输出\n  else {\n    templateVars.title = 'Form posted successfully';\n\
  \  }\n  // 渲染视图\n  res.render('contact', templateVars);\n};\n```\n\n\n\nGmail 防止你伪造另一个电子邮箱地址，因此你无法将“发件人”设置为表单中输入的电子邮箱地址。但如果你正在使用另一个\
  \ SMTP 服务器，你可能考虑从用户的电子邮箱地址发送，这样你就可以直接回复他们了。\n\n关于 `EmailJS` 的更多信息，请访问 [`https://github.com/eleith/emailjs`](https://github.com/eleith/emailjs)。或者，如果你需要更健壮的邮件支持，可以查看\
  \ Node 邮件模板：[`https://github.com/niftylettuce/node-email-templates`](https://github.com/niftylettuce/node-email-templates)。\n\
  \n## 结语\n\n最后，万一邮件发送失败，将此情况告知用户是一个好主意。要这样做，你可以在 `EmailJS` 的回调函数中打印一条基础错误消息。然而，由于回调是异步的，它实际上不会显示给用户，因为成功消息已经打印在屏幕上了。因此，必须对脚本进行一些重构：\n\
  \n```javascript\n// validate required fields\n\nfunction isFilled(field) {\n  return\
  \ field !== undefined && field !== '';\n}\n\n// validate email address\n\nvar emailRegex\
  \ = /^(([^<>()[\\]\\\\.,;:\\s@\\\"]+(\\.[^<>()[\\]\\\\.,;:\\s@\\\"]+)*)|(\\\".+\\\
  \"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\\
  .)+[a-zA-Z]{2,}))$/;\n\nfunction isValidEmail(email) {\n  return emailRegex.test(email);\n\
  }\n\nexports.contactPostHandler = function(req, res) {\n  var response = 'Thank\
  \ you for contacting us, we will get back to you as soon as possible',\n      required\
  \ = [ 'name', 'email', 'message' ],\n      missing = [],\n      success = false;\n\
  \  // check required fields\n  missing = required.filter(function(prop) {\n    return\
  \ !isFilled(req.body[prop]);\n  });\n  if ( missing.length ) {\n    response = 'Please\
  \ fill out all required fields (' + missing.join(', ') + ')';\n  }\n  // check email\n\
  \  else if ( !isValidEmail( req.body.email ) ) {\n    response = 'Please enter a\
  \ valid email address';\n  }\n  else {\n    success = true;\n  }\n  // build the\
  \ template variables\n  var templateVars = {\n    description: response,\n    success:\
  \ success\n  };\n  // error output\n  if ( !success ) {\n    console.log( response\
  \ );\n    templateVars.title = 'Contact Us';\n    templateVars.name = req.body.name;\n\
  \    templateVars.email = req.body.email;\n    templateVars.message = req.body.message;\n\
  \    // render the template\n    res.render('contact', templateVars);\n  }\n  //\
  \ else success output\n  else {    \n    // connect to your smtp server\n    var\
  \ emailjs = require('emailjs');\n    var server = emailjs.server.connect({\n   \
  \   user: 'username',\n      password: 'password',\n      host: 'smtp.gmail.com',\n\
  \      ssl: true\n    });\n    // build the email body with a datestamp\n    var\
  \ emailBody = 'From: ' + req.body.name + ' <' + req.body.email + '>' +\n      \"\
  \\n\";\n    emailBody += 'Message: ' + req.body.message + \"\\n\\n\";\n    emailBody\
  \ += 'Sent automatically from Node server on ' + Date();\n    // send the email\
  \ to the server admin\n    server.send({\n      from:      'Node Server <no-reply@localhost>',\n\
  \      to:      'Server Admin <admin@localhost>',\n      subject: 'Contact form\
  \ submission',\n      text: emailBody\n    }, function(err, message) {\n      console.log(err\
  \ || message);\n      // if smtp error\n      if ( err ) {\n        res.send('Sorry,\
  \ there was an error sending your message, please try again later');\n      }\n\
  \      // otherwise show success message\n      else {\n        templateVars.title\
  \ = 'Message sent successfully'\n        // render the template\n        res.render('contact',\
  \ templateVars);\n      }\n    });\n  }\n};\n```\n\n这里进行了一些基础更改：\n- 将 `render` 函数被提取到错误处理器中，以渲染任何验证错误。\n\
  - 如果 SMTP 邮件发送失败，则简单在屏幕上打印一个基础错误。在这种情况下，不重新渲染表单是一个好主意，因为用户可能无法再次使用它。\n- 如果 SMTP\
  \ 邮件发送成功，则从回调内部显示成功消息。这样，成功消息就不会覆盖错误消息。\n\n## 总结\n\n在本章中，你学习了 Express 框架的基础知识。你学习了如何安装\
  \ Express 并启动 Express 服务器。然后，你学习了如何设置路由来定义应用程序的路径。\n\n接下来，你在这些路由上设置了控制器，使用 Underscore\
  \ 模板渲染视图。然后，你学习了如何创建一个 `POST` 路由来处理来自应用的表单数据。你对数据进行了验证，并在发生错误时显示错误消息。表单提交成功后，服务器向管理员发送了邮件。为了这一点，它使用了\
  \ `EmailJS` 模块连接到外部 SMTP 服务器。\n\n你现在对 Node 开发有了相当坚实的基础。在下一章中，你将学习如何使用一种名为 `MongoDB`\
  \ 的 NoSQL 数据库。这将支持你的 Node 应用的数据组件。随后在 第 9 章中，你将学习如何使用 WebSockets 与客户端进行更快的 I/O 通信，并将一切整合在一起构建一个实时应用。\n\
