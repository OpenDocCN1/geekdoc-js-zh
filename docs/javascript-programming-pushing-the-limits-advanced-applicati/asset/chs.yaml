  \n# 第二部分：构建前端\n\n- 第 3 章: Backbone.js\n- 第 4 章: 使用 JavaScript 模板\n- 第 5 章: 创建表单\n\
  \n# 第 3 章：Backbone.js\n\nBackbone 为你的应用提供了结构。它提供了一个合理的框架，用于存储应用数据，并将这些数据作为屏幕内容传递给用户。它还可以管理这些数据与数据库或本地存储的同步。在本章中，你将了解到如何使用\
  \ `Backbone` 模型（models）和集合（collections）来存储应用数据。然后你将学习如何将这些数据绑定到显示的内容上。内容的任何变化都会在屏幕上自动更新。此外，你还将发现如何与数据库服务器同步\
  \ `Backbone` 数据，从而允许你保存和获取数据，并创建一个跨不同会话（sessions）的持久状态。\n\n本章还涵盖了如何将不同的 URL 绑定到应用的不同状态，以便你能够为应用构建导航和书签支持。最后，你将了解如何为数据的任何变化设置自定义处理程序，以及如何对集合进行操作和排序。\n\
  \n## 开始使用 Backbone\n\n尽管 `Backbone` 并不一定容易学习，但它绝对值得投入。如果你已经具有后端模型-视图-控制器（MVC）的经验，那么上手\
  \ `Backbone` 将容易得多。这是因为 `Backbone` 的概念比实际的实现和用法更难理解。\n\n## 什么是 Backbone？\n\n`Backbone`\
  \ 是一个 JavaScript MVC 框架，它将服务器端框架中常见的 MVC 模式的所有概念带到了前端。基本上，它允许你将应用数据与显示给查看者的视图和用户界面解耦。\n\
  \n`Backbone` 提供了在模型中保存数据的方法。然后你可以将这些模型同步到视图。这意味着每当数据发生变化时，这些变化会自动反映在屏幕内容上。此外，这些模型可以使用\
  \ `Ajax` 请求与服务器同步。同样，任何变化都可以在两个方向上自动同步，确保应用中的数据在不同页面和会话之间保持持久化。\n\n有人认为 `Backbone`\
  \ 并不是真正的 MVC，它更像是一个 MVP（模型-视图-演示器）。虽然这个论点在语义上并不完全准确，但它有些愚蠢，类似于经典的极客争论：你更倾向于喜欢《星球大战》还是《星际迷航》。论点在于，你使用\
  \ `Backbone` 的方式与 MVC 中的经典模式相似。它的设计目的是分离关注点，并将表现层与数据解耦。\n\n## 为什么要使用 Backbone？\n\
  \n`Backbone` 所做的一切，你都可以自己实现。事实上，你可能已经实现了其中的很大一部分。但 `Backbone` 将所有这些零散的脚本统一到了一个编写良好且经过充分测试的单一框架中。简而言之，`Backbone`\
  \ 让处理数据变得轻而易举。它避免了在将 JavaScript 数据与屏幕内容关联以及通过 `Ajax` 同步这些数据时通常编写的“面条代码”。\n\n当你使用\
  \ `Backbone` 时，应用中的数据与显示给用户的内容完全隔离。它还保持了数据与与服务器同步的过程之间的分离。\n\n`Backbone` 简化了开发过程，允许你独立开发应用的不同组件，并使用可更换的部件。\n\
  \n## Backbone 基础知识\n\n`Backbone` 有四个基本组件：\n\n- `Models`（模型）代表单个数据对象。\n- `Collections`（集合）是这些模型的组。\n\
  - `Views`（视图）代表用户界面的部分，并向用户显示模型和集合中的数据。\n- `Routers`（路由）处理视图与浏览器 URL 之间的关系，当用户导航到特定\
  \ URL 时，它会显示应用程序的特定状态。\n\n这些组件之间的关系在图 3-1 中所示。\n\n![9781118524565-fg0301.eps](img/9781118524565-fg0301_fmt.png)\n\
  \n图 3-1 在 Backbone 中，模型可以分组为集合。这些集合可以被用于定义视图，视图通常有父视图和子视图。这一切（可选地）由路由驱动。\n\n但 `Backbone`\
  \ 远不止于这些基础构建模块。它具有更改事件，每当模型发生变化时就会更新视图。它具有验证功能，以确保所有数据格式正确。而且它可以配置为自动与外部服务器或本地存储同步数据，以确保模型的持久性。\n\
  \n## 何时使用 Backbone\n\n一旦你开始使用 `Backbone`，你就会惊奇在没有它的情况下是如何构建某些项目的。然而，对于许多项目，`Backbone`\
  \ 是大过其实。`Backbone` 最适合需要处理大量数据的应用，特别是当这些数据与屏幕紧密相关时。事实上，对于交互性不强的网站，使用 `Backbone`\
  \ 并不是好主意。你可以始终使用独立库和插件构建 JavaScript，而无需触碰 `Backbone`。\n\n这并不是文件大小问题，因为 `Backbone`\
  \ 非常轻量，而是开发问题——使用 `Backbone` 需要大量的额外设置。对于数据驱动的网站和应用，这些额外设置实际上会节省时间，但对于更静态的网站并不值得。\n\
  \n## 安装 Backbone\n\n要使用 Backbone，首先从 [`backbonejs.org`](http://backbonejs.org) 下载核心文件。你还需要从\
  \ [`http://underscorejs.org/](http://underscorejs.org/) 下载 `Backbone` 的唯一依赖 `Underscore.js`。\n\
  \n然后在页面上包含这两个脚本，将 `Underscore` 放在：\n\n```html\n<script src=\"js/underscore.min.js\"\
  ></script>\n<script src=\"js/backbone.min.js\"></script>\n```\n\n即使合并，这些文件也极其轻量，压缩后大小小于\
  \ 10K。\n\n`Backbone` 不需要 `jQuery` 或任何其他库即可工作，但它与任何 `jQuery` 类型的库兼容得良好。本章中的大多数示例都使用了\
  \ `jQuery`，因此请确保在上述 `Backbone` 脚本之前包含它。现在，你准备好深入研究 `Backbone` 并开始构建结构化的应用程序。\n\n\
  尽管 `Backbone` 的基本功能并不显式需要 `jQuery` 或 `Zepto`，如果你想在视图内部进行任何 DOM 操作以及在模型中实现 RESTful\
  \ 持久化，你就需要这些库之一。\n\n## Backbone 模型\n\n`Backbone` 中的模型是应用数据层的基础构建块。例如，你可能有一个数据对象来表示应用中的用户：\n\
  \n```javascript\nuser: {\n  username: 'jonraasch',\n  displayName: 'Jon Raasch',\n\
  \  bio: '一个写网络书的宅客',\n  avatar: 'j134jks.png'\n}\n```\n\n\n\n\n在 Backbone 中，这些数据被保存为模型（model）。但\
  \ Backbone 模型的功能远不止于存储这些数据。它们包含了智能默认值、更改事件、验证等。\n\n一个良好的 Backbone 配置从为你的应用的数据模式（schema）定义这些模型开始。这与你的后端数据模式不一定有一一对应的关系，但可能接近。接下来，你设置事件监听器来跟踪模型的任何变化。但最重要的是，你还会创建一组验证规则，这些规则会在执行保存操作之前针对模型的属性进行运行。这样，你就可以为应用的业务逻辑创建单元测试，并在潜在数据问题出现之前将其排除。在模型与表示它们的视图（views）之间保持这种清晰的分离可以让业务逻辑测试变得容易得多。你可以专注于每个特定功能想要实现的目标，而无需担心页面上可能存在或不存在视觉元素。\n\
  \n### 创建模型\n\n要创建一个新模型，使用 Backbone 的 `Model.extend()` 方法：\n\n```javascript\n// create\
  \ the model\nvar Fruit = Backbone.Model.extend({});\n\n// create a new instance\
  \ of the model\nvar apple = new Fruit({\n  type: 'apple',\n  color: 'red',\n  condition:\
  \ 'shiny'\n});\n```\n\n现在，你可以使用 `get()` 方法访问模型的任何属性：\n\n```javascript\nconsole.log(\
  \ apple.get('color') );\n```\n\n你也可以使用 `set()` 方法设置任何属性值：\n\n```javascript\napple.set('condition',\
  \ 'bruised');\napple.set({ type: 'banana', color: 'yellow' });\n```\n\n如你所见，你可以设置一个键值对，也可以使用对象设置一组属性。\n\
  \n## 创建计算属性\n\n你还可以创建自定义的计算属性，例如：\n\n```javascript\nvar Fruit = Backbone.Model.extend({\n\
  \  description: function() {\n    return this.get('color') + ', ' + this.get('condition')\
  \ + ' ' + this.get('type');\n  }\n});\n\nvar apple = new Fruit({\n  type: 'apple',\n\
  \  color: 'red',\n  condition: 'shiny'\n});\n\nconsole.log( apple.description()\
  \ );\n```\n\n这个示例返回字符串 `red, shiny apple`。注意你是如何配合插值字符串使用 `get()` 方法的。\n\n## 设置默认值\n\
  \n你还可以为模型设置智能默认值。这样，你就可以在不设置所有属性的情况下创建一个新项目：\n\n```javascript\nvar Fruit = Backbone.Model.extend({\n\
  \  defaults: {\n    condition: 'perfect'\n  }\n});\n\nvar apple = new Fruit({\n\
  \  type: 'apple',\n  color: 'red'\n});\n\nconsole.log( apple.get('condition') );\n\
  ```\n\n在这里你为水果的条件设置了默认值。这段代码即使在你没有设置它的情况下，会将状态输出为“perfect”。\n\n在属性通常是某一种特定值的情况下，默认值可以为你节省大量时间。但不要过度使用它们；仍然有些属性是你每次创建对象时都应该设置的。例如，你不想在这里设置默认的水果类型，因为每个水果都应该是不同的。\n\
  \n## 使用 Initialize 函数\n\n`initialize` 函数是一个构造函数，在模型实例化时被调用。要使用它，你只需在传递配置对象时将函数赋值给该对象属性：\n\
  \n```javascript\nvar Fruit = Backbone.Model.extend({\n  initialize: function() {\n\
  \    console.log('Fruit model initialized');\n  }\n});\n```\n\n每当你创建一个该模型的新实例时，此回调函数就会触发。\n\
  \n## 使用 Backbone 事件\n\nBackbone 模型还包含许多事件，允许你跟踪模型的添加、删除、修改等任何变化。\n\n### 为你的模型绑定事件\n\
  \n你可以在 `initialize()` 函数中使用 `on()` 方法绑定这些事件中的任何一个。例如，每当使用模型添加新项目时触发事件，你可以写道：\n\n\
  ```javascript\nvar Fruit = Backbone.Model.extend({\n  initialize: function() {\n\
  \    this.on('add', function() {\n      console.log('Fruit added - ' + this.get('type'));\n\
  \    });\n  }\n});\n```\n\n注意我是如何使用 `this.get()` 来访问该模型的属性的，每个事件处理程序的上下文绑定到模型实例本身。\n\
  \n### 跟踪模型更改\n\nBackbone 中最常用的事件可能是 `change` 事件，因为它允许你将模型的更改与视图的视觉变化绑定。我将在本章后面详细介绍视图，所以现在我将保持简单并忽略实际的\
  \ DOM 更改。\n\n要跟踪模型的任何变化，你可以写：\n\n```javascript\nvar Fruit = Backbone.Model.extend({\n\
  \  initialize: function() {\n    this.on('change', function() {\n      console.log('Values\
  \ for this model have changed');\n    });\n  }\n});\n```\n\n每当模型属性发生变化时，此回调函数就会触发。\n\
  \n此外，你可以使用 `change:[attribute]` 跟踪模型单个属性的更改：\n\n```javascript\nvar Fruit = Backbone.Model.extend({\n\
  \  initialize: function() {\n    // track changes in the condition attribute\n \
  \   this.on('change:condition', function() {\n      console.log('The condition of\
  \ this fruit has changed. Might be getting moldy.');\n    });\n  }\n});\n```\n\n\
  此回调函数仅在模型的 `condition` 属性发生变化时触发，如示例所示：\n\n```javascript\napple.set('condition',\
  \ 'moldy');\n```\n\n在为多个属性附加更改事件时，请注意执行顺序问题。很难确定哪个属性监听器会先触发，因此要么确保回调是完全独立的，要么绑定单一的更改事件并手动检查每个属性的变化。\n\
  \n## 验证你的模型\n\n设置模型时最重要的部分可能是创建验证。这样，你就可以进行完整性检查，并防止格式错误的数据被保存。例如，你可以设置验证来确保某个属性是数值：\n\
  \n```javascript\nvar Fruit = Backbone.Model.extend({\n  // validate the model whenever\
  \ it changes\n  validate: function( options ) {\n    if ( options.quantity && !_.isNumber(\
  \ options.quantity ) ) {\n      return 'Quantity must be a number';\n    }\n  }\n\
  });\n\n// create a new instance of the model\nvar apple = new Fruit({\n  name: 'apple'\n\
  });\n\n// add an error event handler – this fires if it fails\napple.on( 'error',\
  \ function( model, error ) {\n  console.log( error );\n});\n\n// set a malformed\
  \ quantity to trigger validation\napple.set( 'quantity', 'a bunch' );\n```\n\n这段代码片段的作用如下：\n\
  \n1. 我正在创建一个验证函数来检查水果模型中格式错误的数据。\n2. 如果设置了数量，Underscore 的 `isNumber()` 方法会检查它是否为数字。Underscore\
  \ 是 Backbone 的前提条件，因此使用它的方法没有额外的开销。\n3. 如果模型验证失败，将触发错误事件。\n\n结果是，如果有人尝试将数量设为非数值，它将触发错误处理器并传递验证消息\
  \ `Quantity must be a number`。更重要的是，这些数据永远不会被保存到模型中，确保了模型的数据格式正确。\n\n由于模型验证非常重要，在模型上设置单元测试是一个好主意，以检查它们始终符合你的应用业务逻辑。\n\
  \n## 处理集合（Collections）\n\n在 Backbone 中，集合（collection）是一组模型。如果模型是对象，你可以将集合视为这些对象的数组。虽然\
  \ Backbone 集合除了对这些模型分组之外没有做更多，但理解它们仍然非常重要。毕竟，你最终可能会使用很多集合。\n\n## 创建集合\n\n这段代码使用水果模型创建一个项目集合：\n\
  \n```javascript\n// create a model\nvar Fruit = Backbone.Model.extend({});\n\n//\
  \ create a collection with this model\nvar Fruits = Backbone.Collection.extend({\n\
  \  model: Fruit\n});\n```\n\n在这里，集合是基于模型的。现在你可以向此集合模式中添加新项目：\n\n\n\n\n\n```javascript\n\
  var Fruit = Backbone.Model.extend({});\n\nvar Fruits = Backbone.Collection.extend({\n\
  \  model: Fruit\n});\n// 创建集合的集合实例\nvar fruitbowl = new Fruits({ type: 'apple',\
  \ color: 'red' });\n// 向集合中添加另一个模型\nfruitbowl.add({ type: 'banana', color: 'yellow'\
  \ });\n```\n\n在这里你可以看到向集合中添加项的两种方法。首先，你可以在创建集合时添加项；然后你可以使用 `add()` 添加其他项。\n\n或者，你也可以在创建集合时通过传递对象数组来一次添加多个项。\n\
  \n## 创建集合事件\n\n与模型一样，你也可以为你的集合附加事件处理器。所有的事件都是可用的：`add`、`remove`、`change` 等。不过，对于集合，你可能会发现自己使用了一些新模式：即，`add`\
  \ 和 `remove` 事件变得重要得多，因为你可能想要跟踪新项从集合数组中添加或移除的任何时候。例如，此脚本会在每当从集合中添加或移除项时触发事件：\n\n\
  ```javascript\nvar Fruit = Backbone.Model.extend({});\n\nvar Fruits = Backbone.Collection.extend({\n\
  \  model: Fruit,\n  initialize: function() {\n    this.on('add', function() {\n\
  \      console.log('New fruit added');\n    });\n    this.on('remove', function()\
  \ {\n      console.log('Fruit removed');\n    });\n  }\n});\n```\n\n注意，当使用对象实例化新集合时，这不会触发\
  \ `add` 事件处理器回调。\n\n你也可以将这些事件附加到模型以获得相同的结果。\n\n## 理解 Backbone View\n\n在 Backbone\
  \ 中，视图（views）代表应用程序的用户界面元素，这些元素通常可以代表你的数据模型。尽管它们与页面上的标记密切相关，但不要将视图视为应用的标记；相反，它们是渲染标记的逻辑。\n\
  \n你可以在没有视图的情况下使用 Backbone，但视图是框架真正发光的地方，因为你可以为模型和集合中发生的任何变化绑定事件到视图，从而将应用中数据的任何变化与\
  \ DOM 的视觉变化相联系。如果你以前没有尝试过，你会对它给你的工作流带来的改变感到。在我看来，将数据绑定到视图是使用 Backbone 的主要原因，因为它消除了你原本会使用的大量面条式代码（spaghetti\
  \ code）。\n\n## 创建视图\n\n创建一个视图与创建一个模型或集合类似：\n\n```javascript\nvar FruitView = Backbone.View.extend({\n\
  \  el: '#my-element',\n  render: function() {\n    this.$el.html('Markup here');\n\
  \    return this;\n  }\n});\n\nvar appleView = new FruitView({\n  model: apple\n\
  });\n```\n\n这段代码片段中发生了几点操作：\n\n1. `el` 指向视图插入的元素。在这种情况下，Backbone 在 DOM 中寻找匹配 CSS\
  \ 选择器 `#my-element` 的元素。这是创建视图元素的几种不同方法之一。\n2. 调用 `render` 函数来渲染视图。这是一个可选函数，不会被自动调用。在这种情况下，使用了\
  \ jQuery 的 `html()` 来渲染内容。\n3. 当创建此视图的新实例时，会传入一个要绑定到视图的模型实例。这种方法是可选的；对于任何绑定到特定模型的视图，这都是良好的做法。这样，你可以在视图的任何时候通过\
  \ `this.model` 访问模型。\n\n### 使用 Render 函数\n\n渲染函数是完全可选的。事实上，它们是一种常见的约定，而不是 Backbone\
  \ 本身的一部分。创建它们并在需要时调用它们取决于你，例如每当特定模型发生变化时。\n\n#### 调用渲染函数\n\n大多数情况下，你可能会在视图初始化时调用渲染函数；否则，视图将不会显示在页面上。例如，你在创建视图时渲染了以下视图：\n\
  \n```javascript\nvar MyView = Backbone.View.extend({\n  el: '#my-element',\n  initialize:\
  \ function() {\n    this.render();\n  },\n  render: function() {\n    this.$el.html('Hello\
  \ World!');\n    return this;\n  }\n});\n\nvar myView = new MyView ();\n```\n\n\
  在这里，当视图初始化时，它找到了 ID 为 `my-element` 的 DOM 元素，并将该元素的内部 HTML 替换为 `'Hello World!'`。\n\
  \n渲染函数返回 `this`。这是一个非常常见的模式，因为允许渲染函数像 Backbone API 的其他部分一样保持链式调用。\n\n通常，你可能希望将渲染函数绑定到特定模型的更改上。你很快就会发现如何使用更改事件的回调来实现这一点。\n\
  \n#### 渲染模型\n\n在大多数情况下，Backbone 视图绑定到模型，这意味着你可能需要在渲染函数中访问该模型的属性。例如，你可能想要渲染关于特定用户的数据。首先，从模型开始：\n\
  \n```javascript\n//为用户创建模型\nvar User = Backbone.Model.extend({});\nvar user = new\
  \ User({\n  username: 'jonraasch',\n  displayName: 'Jon Raasch',\n  bio: 'Some nerd'\n\
  });\n```\n\n接下来，创建一个绑定到此模型的视图：\n\n```javascript\n// 创建视图\nvar UserView = Backbone.View.extend({\n\
  \  el: '#user-card',\n  initialize: function() {\n    this.render();\n  },\n  render:\
  \ function() {\n    // 创建一个指向用户配置的包装链接\n    var $card = $('<a href=\"/users/' +\
  \ this.model.get('username') +\n      '\">');\n    // 添加用户名\n    var $name = $('<h1>'\
  \ + this.model.get('displayName') +\n      '</h1>').appendTo($card);\n    // 添加用户简介\n\
  \    var $bio = $('<p>' + this.model.get('bio') +\n    '</p>').appendTo($card);\n\
  \    // 将此元素附加到 DOM\n    this.$el.html ($card);\n    return this;\n  }\n});\n\n\
  // 创建视图的新实例，将其绑定到用户\nvar userView = new UserView({\n  model: user\n});\n```\n\n\n\
  \n\n\n`$el` 是 Backbone 如何随社区演进的一个示例。在 0.9 版本之前，在视图的 `initialize` 函数中通过 `this.$el\
  \ = $(this.el)` 自定义定义它已成为一种常见模式。\n\n## 引用现有元素\n\n在很多情况下，引用标记中已经存在的元素是有意义的。要引用现有元素，只需在创建视图时将\
  \ CSS 选择器传递给 `el` 即可：\n\n```javascript\nvar MyView = Backbone.View.extend({\n  el:\
  \ '#my-element',\n  render: function() {\n    this.$el.html('Markup here');\n  \
  \  return this;\n  }\n});\n```\n\n在这里，Backbone 会找到 ID 为 `my-element` 的元素并将其用于该视图。你可以传递任何你想要的\
  \ CSS 选择器。但是，请确保你传递的是 CSS 选择器字符串而不是 DOM 引用。例如，你不能传递 jQuery 引用，如 `$(‘my-element')`。\n\
  \n在引用现有元素时，请确保你的 CSS 选择器引用的是唯一的元素，除非你想让视图修改所有引用的元素。\n\n如果你页面上有一个相当静态的部分，需要根据 Backbone\
  \ 中的数据进行更改，那么引用现有元素是一个好主意。假设你的页眉中有一个欢迎消息（例如，`Welcome Kate`），如果用户修改了她的显示名称，该消息就需要更改。来看一些代码，从标记开始：\n\
  \n```html\n<header>\n  <div class=\"welcome-message\">Welcome</div>\n</header>\n\
  ```\n\n接下来，为用户创建一个包含其显示名称的模型：\n\n```javascript\n// 为用户创建一个模型\nvar User = Backbone.Model.extend({});\n\
  var user = new User({\n  displayName: 'Kate'\n});\n```\n\n一旦你有了模型，就可以设置视图了：\n\n\
  ```javascript\n// 为欢迎消息创建视图\nvar WelcomeMessageView = Backbone.View.extend({\n \
  \ // 将其绑定到页面上存在的元素\n  el: 'header .welcome-message',\n  initialize: function() {\n\
  \    // 将此视图模型中的任何更改绑定到它的 render 函数——\n    // 在这种情况下，你只需要跟踪 displayName 属性的变化\n\
  \    this.model.on('change:displayName', this.render, this);\n    // 同时在视图初始化时也调用\
  \ render 函数\n    this.render();\n  },\n  // render 函数在页面上显示模型中的数据\n  render: function()\
  \ {\n    var displayName = this.model.get('displayName');\n    this.$el.html('Welcome\
  \ ' + displayName);\n    return this;\n  }\n});\n\n// 为欢迎消息视图创建一个新实例\nvar welcomeMessageView\
  \ = new WelcomeMessageView({\n  model: user\n});\n```\n\n这里有很多操作，所以请让我为你过一遍：\n\n\
  1. 创建了视图并将其与标记中的 `<div class=”welcome-message\"></div>` 关联。\n2. 创建了 `initialize`\
  \ 函数，每当用户的显示名称发生变化时，它就会调用 `render` 函数。在为视图创建新实例也会调用 `render` 函数，以便它渲染出一个可靠的基础状态。\n\
  3. 在 `render` 函数中，用户模型 `displayName` 属性的值被用于显示欢迎消息。\n4. 最后，创建了视图的新实例。它传递了之前创建的用户模型。\n\
  \n现在，模型中的任何更改都绑定到浏览器中的视觉变化。要测试它，请尝试在你的 JavaScript 控制台中更改模型：\n\n```javascript\nuser.set('displayName',\
  \ 'Katherine');\n```\n\n你应该能看到页面上的欢迎消息发生了变化。\n\n## 创建新的视图元素\n\n你已经学习了如何为你的视图引用现有的\
  \ DOM 元素，但有时你可能想在 Backbone 中为视图创建一个新元素。要这样做，只需在创建视图时设置 `tagName` 即可：\n\n```javascript\n\
  var MyView = Backbone.View.extend({\n  tagName: 'li'\n});\nvar myView = new MyView;\n\
  ```\n\n你也可以为你的元素设置类名和/或 ID：\n\n```javascript\nvar MyView = Backbone.View.extend({\n\
  \  tagName: 'li',\n  className: 'container', // 你可以在这里使用多个类名，\n  // 例如 'container\
  \ list-item'\n  id: 'my-view-wrapper'\n});\nvar myView = new MyView;\n```\n\n这会创建一个\
  \ `<li class=”container” id=”my-view-wrapper\"></li>`。\n\n虽然这些设置对于创建完全匹配的标记元素非常有用，但它们实际上都是可选的。如果你没有设置任何内容（并且没有设置\
  \ `el`），Backbone 仅会使用一个带有任何类或 ID 的 `<div>`。\n\n如果你正在动态创建视图元素，请确保不要设置 `el`。\n\n这种方法在你向\
  \ DOM 注入新内容时最合理。例如，假设你想为集合中的每个项目创建一个元素列表。虽然列表可能存在于现有的 DOM 元素中，但你希望为每个项目创建一个新的视图元素。我将在下一节中介绍这种方法的实际示例。\n\
  \n## 在 Backbone 中使用嵌套视图\n\n当你使用 Backbone 构建应用时，你会使用很多嵌套视图。虽然它们可能会变得有点复杂，但嵌套视图是不可避免的。幸运的是，许多最佳实践可以帮助你保持嵌套视图更有组织。\n\
  \n要实现这一点，你必须卷起袖子来。来看一些代码，从标记开始：\n\n```html\n<ul id=\"band-wrapper\"></ul>\n```\n\
  \n因为你使用 Backbone 填充此列表，标记是简单的。接下来，你创建集合：\n\n```javascript\nvar Band = {};\n// 创建模型\n\
  Band.Member = Backbone.Model.extend({});\n// 创建集合\nBand.Members = Backbone.Collection.extend({\n\
  \  model: Band.Member\n});\n// 填充集合\nvar band = new Band.Members([\n  { name: 'John'\
  \ },\n  { name: 'Paul' },\n  { name: 'George' },\n  { name: 'Ringo' }\n]);\n```\n\
  \n如你所示，你正在创建一个包含四个成员的集合。\n\n### 为每个列表项创建视图\n\n现在，你为每个成员创建一个视图：\n\n```javascript\n\
  // 现在你为每个列表项创建一个视图\nBand.Member.View = Backbone.View.extend({\n  tagName: 'li',\n\
  \  render: function() {\n    // 将名称添加到列表项\n    this.$el.text(this.model.get('name'));\n\
  \    return this;\n  }\n});\n```\n\n这里的代码非常直观：为每个成员创建一个 `<li>`。但你如何让这些元素出现在页面上呢？为了这一点，你需要一个父视图。\n\
  \n### 为列表创建父视图\n\n```javascript\n// 为列表（父级）创建视图\nBand.Members.View = Backbone.View.extend({\n\
  \  el: '#band-wrapper',\n  initialize: function() {\n    this.render();\n  },\n\
  \  render: function() {\n    // 遍历集合中的所有项，为每个项创建一个\n    // 视图\n    this.collection.each(function(bandMember)\
  \ {\n      var bandMemberView = new Band.Member.View({\n        model: bandMember\n\
  \      });\n    });\n    return this;\n  }\n});\n\n// 为乐队视图创建一个新实例\nvar bandView\
  \ = new Band.Members.View({\n  collection: band\n});\n```\n\n这里仍然有很多操作：\n\n1. 为列表创建了一个新视图，它与示例开始的\
  \ `<ul>` 标记关联。\n2. 当此视图初始化时，它会被渲染。该 `render` 函数遍历集合，为每个成员创建一个新视图。\n\n## 连接父视图和子视图\n\
  \n\n\n\n但你还没有完成。你仍然需要实际渲染列表中的每一个项目。为了做到这一点，你需要将两个视图连接起来。首先，你需要对父视图的渲染函数进行一些更改：\n\
  \n```javascript\n// 为乐队创建一个视图\nvar Band.Members.View = Backbone.View.extend({\n\
  \  el: '#band-wrapper',\n  initialize: function() {\n    this.render();\n  },\n\
  \  render: function() {\n    // 清空视图元素\n    this.$el.empty();\n    // 在进入循环之前缓存此值（this）\n\
  \    var thisView = this;\n    // 遍历集合中的所有项，为每个项\n    // 创建视图\n    this.collection.each(function(bandMember)\
  \ {\n      var bandMemberView = new Band.Member.View({\n        model: bandMember\n\
  \      });\n      // 在子视图中保存对该视图的引用\n      bandMemberView.parentView = thisView;\n\
  \      // 渲染它\n      bandMemberView.render();\n    });\n    return this;\n  }\n\
  });\n```\n\n第一个更改是清空视图元素，这是必要的，因为你将在子视图中使用新的列表项填充它。但现在不用担心这个，你稍后会回来。接下来，`this` 的值被缓存为\
  \ `thisView`。稍后，你在集合循环中需要该值，因为循环会覆盖 `this` 上下文。\n\n现在，是重要的部分：在集合循环内部，你定义了对父视图的引用，你可以在子视图中访问它。因为这允许你理解视图之间是如何关联的，所以在处理嵌套视图时，这是一个至关重要的实践。\n\
  \n接下来，你调用了子视图的渲染函数。之前的示例是从视图的 `initialize` 函数中调用 `render` 函数。但在这里行不通，因为你需要 `parentView`\
  \ 引用，而该引用在子视图初始化时尚未定义。\n\n最后但同样重要点是，你必须修改子视图的渲染函数以与父视图连接：\n\n```javascript\n// 为每个乐队成员创建一个视图\n\
  var Band.Member.View = Backbone.View.extend({\n  tagName: 'li',\n  render: function()\
  \ {\n    // 将名称添加到列表项\n    this.$el.text(this.model.get('name'));\n    // 将新的列表项追加到父视图中的列表中\n\
  \    this.parentView.$el.append( this.$el );\n    return this;\n  }\n});\n```\n\n\
  在这里，唯一的更改是你引用了 `this.parentView.$el` 来从父视图获取视图元素，然后你使用它来追加列表项。当父视图和子视图连接后，乐队成员列表将如图\
  \ 3-2 所示所示。\n\n![9781118524565-fg0302.tif](img/9781118524565-fg0302_fmt.png)\n\n\
  图 3-2 乐队列表现在正在正常渲染。\n\n### 跟踪集合中的更改\n\n最后，你想跟踪对集合进行的任何更改。为了做到这一点，你可以在父视图的 `initialize`\
  \ 函数中设置监听器：\n\n```javascript\n// 为乐队创建一个视图\nvar Band.Members.View = Backbone.View.extend({\n\
  \  el: '#band-wrapper',\n  initialize: function() {\n    // 与 render 函数共享 \"this\"\
  \ 上下文\n    _.bindAll( this, 'render' );\n    // 为集合添加各种事件\n    this.collection.on('change',\
  \ this.render);\n    this.collection.on('add', this.render);\n    this.collection.on('remove',\
  \ this.render);\n    // 渲染初始状态\n    this.render();\n  },\n  render: function() {\n\
  \    // ...\n  }\n});\n```\n\n\n\n虽然 Backbone 不会为你完成所有工作，但它可以让你轻松地将数据更改与持久层自动同步。与\
  \ Backbone 的视图及其他部分类似，该框架并不承担所有工作；Backbone 只是提供了你可以使用的结构，让同步变得更简单。\n\n## 在服务器上同步模型\n\
  \n在 Backbone 中，在服务器上保存模型其实非常简单。在这个示例中，我只涵盖了如何在前端处理这种情况；后端 REST API 则由你来编写。Backbone\
  \ 也可以配置为与本地存储（local storage）协作。如果你想避免设置后端 API，可以跳过到在 Backbone 中使用 LocalStorage API\
  \ 部分；然后回来并遵循这些示例。\n\n在第 6 章中，你将了解到如何在 Node.js 中构建后端，但目前，请使用任何你熟悉的工具：PHP、Rails 等。\n\
  \n### 保存模型\n\n首先，从一个简单的用户数据模型开始：\n\n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({});\n\
  \n// 创建新用户\nvar user = new User({\n  displayName: 'Jon Raasch',\n  username: 'jonraasch'\n\
  });\n```\n\n现在，要在服务器上保存此模型，你只需要做几处更改：\n\n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({\n\
  \  // REST API 的 URL\n  url: './path-to-api/'\n});\n\n// 创建新用户\nvar user = new User({\n\
  \  displayName: 'Jon Raasch',\n  username: 'jonraasch',\n  bio: 'Some nerd.'\n});\n\
  \n// 保存\nuser.save();\n```\n\n如你所见，为了在服务器上保存此模型，你只做了两个更改：\n\n1. 指向你的 REST API 的\
  \ URL。该 URL 通过传递 `url` 选项被添加到模型声明中。\n2. 使用 `myModel.save()` 进行保存。\n\n当你保存此模型时，会向模型的\
  \ URL 发送一个 HTTP POST 请求，并带有以下 JSON 作为负载数据：\n\n```json\n{\n  \"displayName\":\"Jon\
  \ Raasch\",\n  \"username\":\"jonraasch\",\n  \"bio\":\"Some nerd.\"\n}\n```\n\n\
  ### 从服务器获取数据\n\n如果你在服务器上保存数据，可能也需要获取这些数据。这样，你在服务器上保存的任何数据都可以在用户下次访问页面时被加载。要从服务器获取模型，只需设置同步\
  \ URL 并调用 `myModel.fetch()`：\n\n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({\n\
  \  // REST API 的 URL\n  url: './path-to-api/'\n});\n\n// 创建新用户实例\nvar user = new\
  \ User;\n// 从服务器获取数据\nuser.fetch();\n```\n\n在这里，此代码段向 `./path-to-api/` 发起 HTTP GET\
  \ 请求，并用返回的 JSON 填充模型。\n\n当你想要确保模型数据的更改与服务器保持同步时，从服务器获取数据也非常有用。例如，如果有多个用户可以更改后端模型，你需要设置一个间隔来检查并确保没有人更改任何内容：\n\
  \n```javascript\n// 每 5 秒检查一次更改\nsetInterval(function() {\n  myModel.fetch();\n\
  }, 5000);\n```\n\n此代码段每隔五秒轮询一次服务器更改。在第 9 章中，你将读到关于轮询技术以及使用 Backbone 和 Node.js 构建实时应用的知识。\n\
  \n#### 提供成功和错误回调\n\n如果需要，Backbone 的同步函数也提供了成功和错误回调（callbacks）。例如，在在保存用户模型时，可以使用这些回调：\n\
  \n```javascript\n// 保存\nuser.save({}, {\n  // 成功回调\n  success: function() {\n  \
  \  console.log('User saved successfully');\n  },\n  // 错误回调\n  error: function()\
  \ {\n    console.log('There was a problem saving the user');\n  }\n});\n```\n\n\
  如你所见，你首先向 `save` 函数传递一个空对象，然后传递一个带有成功和错误回调的 `options` 对象。\n\n你还可以从错误回调的第二个参数中提取有关错误的信息：\n\
  \n```javascript\n// 保存\nuser.save({}, {\n  // 成功回调\n  success: function() {\n  \
  \  console.log('User saved successfully');\n  },\n  // 错误回调\n  error: function(data,\
  \ err) {\n    // 获取错误的状态码和文本\n    console.log('Error: ' + err.status + ' - ' + err.statusText);\n\
  \  }\n});\n```\n\n在这里，你将响应码和错误消息打印到控制台。例如，如果找不到页面，此回调将返回 `Error: 404 — Not Found`。\n\
  \n注意的是，如果模型未能通过 Backbone 验证，错误回调也会触发——例如，如果你在模型上设置了 `validate()` 函数。\n\n你也可以在获取数据（fetch）时设置成功和错误回调。唯一的区别是\
  \ `options` 对象是作为第一个参数传递给 `fetch()` 的：\n\n```javascript\n// 从服务器获取模型\nuser.fetch({\n\
  \  success: function() {\n    console.log( 'User data fetched from server' );\n\
  \  },\n  error: function() {\n    console.log( 'Unable to fetch user data' );\n\
  \  }\n});\n```\n\n### 请求类型\n\nBackbone 使用多种不同的 HTTP 请求方法来实现其同步 API：POST、GET、PUT\
  \ 和 DELETE。这些对于 REST API 来说非常重要，因为它们提供了有关向服务器请求的相关上下文。事实上，与 Backbone 同步最好的部分之一就在于它会自动处理这些不同的请求类型。不同请求的使用方式如下：\n\
  \n* POST：当你保存新模型时\n* GET：当你获取数据（fetch）时\n* PUT：当你保存模型更改时\n* DELETE：当你删除模型时\n\n在内部，Backbone\
  \ 实际上使用的是 CRUD，即创建（create）、读取（read）、更新（update）和删除（delete）。但当将其转换为 jQuery 或 Zepto\
  \ 的 Ajax API 时，分别映射到 POST、GET、PUT 和 DELETE。\n\n## 模拟 HTTP 和 JSON\n\n如果你在 Backbone\
  \ 同步遇到问题，可能是你的服务器与 Backbone 向其发送数据的方式存在冲突。幸运的是，Backbone 提供了一些简单的变通方法，可以让它在几乎任何服务器上运行。\n\
  \n首先，如果你的服务器无法处理 PUT 和 DELETE 请求，你可能希望设置为模拟 HTTP：\n\n```javascript\n// 修复某些 REST\
  \ 请求类型的问题\nBackbone.emulateHTTP = true;\n```\n\n添加此代码段将指示 Backbone 对通常的更新或删除操作使用\
  \ POST。此外，如果你的服务器无法处理以 JSON 编码的请求，请设置为模拟 JSON：\n\n```javascript\n// 修复 JSON 编码问题\n\
  Backbone.emulateJSON = true;\n```\n\n此代码段将 JSON 序列化，并在单个参数 `model` 下发布，例如：\n\n```text\n\
  [model] => {\n  \"displayName\":\"Jon Raasch\",\n  \"username\":\"jonraasch\",\n\
  \  \"bio\":\"Some nerd.\"\n}\n```\n\n通常，出于性能考虑，让服务器处理 Backbone 创建的请求类型是一个好主意。但如果那太困难，请尽管使用这些快速修复。\n\
  \n我在 Mac 的 `Sites` 目录下进行本地开发时，必须模拟 JSON。这是因为 Mac 内置服务器默认无法处理编码为 `application/json`\
  \ 的请求。配置 Backbone 使用 `emulateJSON` 可以确保数据像标准表单一样传递，使用 `application/x-form-urlencoded`。\n\
  \n## 在 Backbone 中使用 LocalStorage API\n\n默认情况下，Backbone 使用 REST API 同步到服务器，但你也可以将其配置为使用\
  \ `localStorage` API。实际上非常简单。首先，在这里下载本地存储适配器：[`https://github.com/jeromegn/Backbone.localStorage`](https://github.com/jeromegn/Backbone.localStorage)。然后在\
  \ Backbone 核心脚本之后引入此脚本。\n\n该脚本会为你完成大部分工作，重写了 `Backbone.sync` API（你将在本节稍后的部分学习它）。你只需要为每个想要保存的模型或集合配置它使用\
  \ `localStorage` 即可。\n\n例如，为了在本地存储中保存之前构建的用户模型，你只需写道：\n\n```javascript\n// 创建模型\n\
  var User = Backbone.Model.extend({\n  // 使用唯一名称定义本地存储\n```\n\n\n\n\n\n```javascript\n\
  \  localStorage: new Backbone.LocalStorage('user-store')\n});\n```\n\n唯一的区别在于，你不再为模型定义服务器端\
  \ API 的 URL，而是定义了一个 `localStorage` 存储器。现在，你可以使用所有相同的方法进行同步：`save()`、`fetch()` 等。\n\
  \n请务必在定义本地存储时使用一个在整个域内唯一的名称，否则它将覆盖其他的本地存储数据。\n\n同样，你也可以将集合保存到本地存储中：\n\n```javascript\n\
  // 创建集合\nvar Users = Backbone.Collection.extend({\n  // 使用唯一名称定义本地存储器\n  localStorage:\
  \ new Backbone.LocalStorage('collection-store')\n});\n```\n\n最棒的是，本地存储适配器并没有完全覆盖\
  \ `Backbone.sync`，这意味着你仍然可以在服务器上保存模型和集合。只需为任何想要保存到服务器上的模型设置 `url`，并为任何想要保存到本地存储中的模型设置\
  \ `localStorage` 即可。\n\n尽管本地存储非常有用，但请记住某些旧版浏览器并不支持它。你可以在这里找到兼容性表：[`http://www.html5rocks.com/en/features/storage`](http://www.html5rocks.com/en/features/storage)。\n\
  \n你还可以将 Backbone 连接到 WebSockets。第 9 章 解释了如何结合 WebSockets、Node、JS 和 Backbone 来创建实时应用。\n\
  \n## 在服务器上保存集合\n\n正如你可能猜到的那样，你也可以同步集合。然而，同步集合可能会变得复杂一些。\n\n### 获取集合\n\n首先，你使用 `myCollection.fetch()`\
  \ 从服务器拉取整个集合：\n\n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({});\n\
  // 创建集合\nvar Users = Backbone.Collection.extend({\n  model: User,\n  url: './path-to-api/'\n\
  });\n// 创建新集合\nvar users = new Users;\n// 从 API 获取集合\nusers.fetch();\n```\n\n这段代码将\
  \ API 返回的所有对象填充到集合中。它期望一个 JSON 对象数组，例如：\n\n```json\n[\n  { \"username\":\"user1\"\
  , \"displayName\":\"User 1\" },\n  { \"username\":\"user2\", \"displayName\":\"\
  User 2\" },\n  { \"username\":\"user3\", \"displayName\":\"User 3\" }\n]\n```\n\n\
  ### 保存集合\n\n虽然获取集合非常简单，但将其保存回服务器却要复杂得多，因为虽然你可以一次性获取整个集合，但你需要单独保存每个单独的模型。但这并不意味着你应该遍历所有模型并一次性保存它们。相反，你应该在每个模型上创建监听器，以便在发生任何变化时进行保存。\n\
  \n这也是一个在实际示例中讨论如何设置同步的一些最佳实践的绝佳机会。为了方便起见，我将在此示例中使用本地存储。为了跟进，请下载早些在 在 Backbone 中使用\
  \ LocalStorage API 节中过的本地存储适配器。\n\n如果你更倾向于与服务器端 API 工作，你也可以为此示例设置一个。但请确保将所有的 `localStorage`\
  \ 声明切换为 API 的 `url` 路径。\n\n### 设置集合\n\n首先，你设置你的模型和集合：\n\n```javascript\n// 创建模型\n\
  var User = Backbone.Model.extend({});\n// 创建集合\nvar Users = Backbone.Collection.extend({\n\
  \  model: User,\n  // 设置本地存储处理器\n  localStorage: new Backbone.LocalStorage('users')\n\
  });\n// 创建集合的新实例\nvar users = new Users;\n```\n\n在这里，你创建了一个与本地存储同步的用户集合。\n\n###\
  \ 获取现有数据\n\n接下来，通过在创建集合后添加 `fetch()`，从本地存储中获取任何现有数据：\n\n```javascript\n// 创建模型\n\
  var User = Backbone.Model.extend({});\n// 创建集合\nvar Users = Backbone.Collection.extend({\n\
  \  model: User,\n  // 设置本地存储处理器\n  localStorage: new Backbone.LocalStorage('users')\n\
  });\n// 创建集合的新实例\nvar users = new Users;\n// 从本地存储获取集合\nusers.fetch();\n// 打印集合\n\
  console.log( users.toJSON() );\n```\n\n在获取集合后，你对集合使用 `toJSON()` 将其打印到控制台。然而，在此时没有已保存的数据可以获取，因此集合仍然为空。\n\
  \n### 向集合添加模型\n\n接下来，你向集合中添加一个模型。但首先在模型上创建一个处理器，以便稍后保存任何已添加的模型：\n\n```javascript\n\
  // 创建模型\nvar User = Backbone.Model.extend({\n  initialize: function() {\n    //\
  \ 添加处理器以保存任何添加的模型\n    this.on('add', this.addHandler);\n  },\n  addHandler: function()\
  \ {\n    // 在创建模型时保存模型\n    this.save();\n  }\n});\n// 创建集合\nvar Users = Backbone.Collection.extend({\n\
  \  model: User,\n  // 设置本地存储处理器\n  localStorage: new Backbone.LocalStorage('users')\n\
  });\n// 创建集合的新实例\nvar users = new Users;\n// 从本地存储获取集合\nusers.fetch();\n// 打印集合\n\
  console.log( users.toJSON() );\n```\n\n如你所见，你使用 `this.on()` 来跟踪任何添加模型的事件。此处理器会保存任何添加的模型。\n\
  \n```javascript\nusers.add('user1');\nusers.add('user2');\n```\n\n重新加载页面，你应该能看到这两个用户，如图\
  \ 3-4 所示。\n\n你可能会注意到的一点是，每个用户都被添加了一个数字字符串作为 ID。这是因为 Backbone 在将项保存到本地存储时，每个项目都需要一个唯一标识。不要担心；这些是由存储适配器自动添加的。如果你愿意，也可以手动添加它们；只需为你的模型定义\
  \ `id` 属性即可。\n\n### 跟踪模型变化\n\n现在你正在跟踪添加的模型，你还需要跟踪变化。为了这样做，请附加另一个 `this.on()` 监听器：\n\
  \n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({\n  initialize: function()\
  \ {\n    // 添加处理器以保存任何变化\n    this.on('add', this.addHandler);\n    this.on('change',\
  \ this.changeHandler);\n  },\n  addHandler: function() {\n    // 在创建模型时保存模型\n  \
  \  this.save();\n  },\n  changeHandler: function() {\n    // 只保存变化的部分\n    this.save(this.changed);\n\
  \  }\n});\n```\n\n在这里，每当模型发生变化时，`changeHandler` 就会触发。但它并没有保存整个模型，而是使用 Backbone 内置的\
  \ `model.changed` 值只保存了变化的部分。该值是一个仅包含已更改属性的对象。\n\n在处理本地存储时，这不会产生巨大差异，但它仍然是一个重要的实践。在同步到服务器时，这种做法可以带来巨大的性能差异——它减少了服务器需要处理请求的大小，同时也缩小了用户必须上传的\
  \ HTTP 请求。\n\n现在，你可以通过在 JavaScript 控制台中更改某些值，来测试 `changeHandler` 是否有效：\n\n```javascript\n\
  users.first().set('username', 'newUserName');\n```\n\n这行代码从集合中取出第一个用户并更改用户名。当你刷新页面时，新名称将保存到本地存储中。\n\
  \n### 跟踪已删除的模型\n\n你还需要在模型被删除时设置跟踪。对于这一点，你需要一个新的同步方法，例如 `destroy()`：\n\n```javascript\n\
  myModel.destroy();\n```\n\n\n\n\n正如你可能猜到的样，这种方法从持久化层删除了模型。现在在另一个监听器中构建它，以跟踪删除事件：\n\
  \n```javascript\n// create the model\nvar User = Backbone.Model.extend({\n  initialize:\
  \ function() {\n    // add handlers to save any changes to the model\n    this.on('add',\
  \ this.addHandler);\n    this.on('change', this.changeHandler);\n    this.on('remove',\
  \ this.removeHandler);\n  },\n  addHandler: function() {\n    // save the model\
  \ when it's created\n    this.save();\n  },\n  changeHandler: function() {\n   \
  \ // only save what has changed\n    this.save(this.changed);\n  },\n  removeHandler:\
  \ function() {\n    // destroy the model from the server\n    this.destroy();\n\
  \  }\n});\n```\n\n现在，你可以在 JavaScript 控制台中测试它了：\n\n```javascript\nusers.remove( users.first()\
  \ );\n```\n\n这一行移除了集合中的第一个项。如果你刷新页面，你会发现更改也已保存到本地存储中。\n\n### 整合在一起\n\n现在，集合同步脚本已经完成。你按照以下方式组合代码：\n\
  \n```javascript\n// create the model\nvar User = Backbone.Model.extend({\n  initialize:\
  \ function() {\n    // add handlers to save any changes to the model\n    this.on('add',\
  \ this.addHandler);\n    this.on('change', this.changeHandler);\n    this.on('remove',\
  \ this.removeHandler);\n  },\n  addHandler: function() {\n    // save the model\
  \ when it's created\n    this.save();\n  },\n  changeHandler: function() {\n   \
  \ // only save what has changed\n    this.save(this.changed);\n  },\n  removeHandler:\
  \ function() {\n    // destroy the model from the server\n    this.destroy();\n\
  \  }\n});\n\n// create the collection\nvar Users = Backbone.Collection.extend({\n\
  \  model: User,\n  // set up the local storage handler\n  localStorage: new Backbone.LocalStorage('users')\n\
  });\n\n// create a new instance of the collection\nvar users = new Users;\n// fetch\
  \ the collection from local storage\nusers.fetch();\n// log the collection\nconsole.log(\
  \ users.toJSON() );\n```\n\n回顾一下这里发生了什么：\n\n1. 创建了模型和集合，并将该集合绑定到本地存储上。\n2. 当集合加载时，会从本地存储获取数据，这样保存的数据在用户重新访问页面时就能随时反映在集合中。\n\
  3. 在模型中，你设置了不同的事件处理器来 `save()` 添加或修改的模型，以及 `destroy()` 被删除的模型。\n\n你可以通过移除添加和删除处理器，并简单地将\
  \ `this.save` 和 `this.delete` 传递给 `on()` 事件绑定器来使脚本更加简洁。出于一致性考虑，我没有这样做，但你可以自己自己进行更改。\n\
  \n### 批量保存集合\n\n或者，你可以构建一个处理器来避免单独保存每个模型，而是将整个集合作为一个单一请求保存。\n\n### 构建自定义保存函数\n\n\
  例如，你可以为集合构建自己的 `save()` 函数：\n\n```javascript\nvar Users = Backbone.Collection.extend({\n\
  \  model: User,\n  url: './path-to-api/',\n  initialize: function() {\n    _.bind(\
  \ this.save, this );\n  },\n  // create a custom save function\n  save: function()\
  \ {\n    // save this to the server using jQuery's AJAX API\n    $.ajax({\n    \
  \  type: 'post',\n      // pull in the URL from the collection\n      url: this.url,\n\
  \      // convert the collection data to JSON\n      data: this.toJSON()\n    });\n\
  \  }\n});\n```\n\n在这里，你为集合构建了一个 `save()` 函数，它的功能如下：\n\n1. 调用 jQuery 的 AJAX API\n\
  2. 使用集合中的 URL\n3. 将数据转换为 JSON\n\n### 批量提交的缺点\n\n虽然这种方法看起来更简单，但当集合只有一小部分发生变化时，它并不一定效果良好。例如，如果你使用本地存储，你必须提交整个集合。通常情况下，如果你使用\
  \ Backbone，提交单个更改要好得多。\n\n### 使用 Backbone.sync\n\n如果你一直在构建没有 Backbone 的 SPA，你可能已经使用了某些东西来提供后退支持。然而，如果你使用的是原生\
  \ JS，你将不得不重写 `Backbone.sync`。要做到，你需要为每种请求类型创建处理器：\n\n```javascript\nBackbone.sync\
  \ = function(method, options) {\n  switch(method) {\n    case 'create':\n      //\
  \ how to handle create\n      break;\n    case 'read':\n      // how to handle read\n\
  \      break;\n    case 'update':\n      // how to handle update\n      break;\n\
  \    case 'delete':\n      // how to handle delete\n      break;\n  }\n};\n```\n\
  \n### 与路由器一起工作\n\n路由器允许 Backbone 将特定的视图状态绑定到给定的 URL。这意味着当用户请求 URL 时，它会显示相关的内容。在构建单页应用\
  \ (SPA) 时，路由器非常重要。例如，你是否用过某个应用并尝试使用后退键或书签页面，结果发现它把你带回了起始页？幸运的是，路由器让后退键和书签支持变得简单。\n\
  \n如果你一直在构建没有 Backbone 的 SPA，你可能已经使用了某些东西来提供后退支持。\n\n### 路由是如何工作的\n\n默认情况下，Backbone\
  \ 路由器设置了与哈希（hashes）工作的路由。例如，如果你的应用路径是 `www.mydomain.com/my-app`，某些路由可能看起来如下：\n\n\
  `www.mydomain.com/my-app#step1`\n\n`www.mydomain.com/my-app#step2`\n\n但路径本身并不起任何作用；你必须设置应用来响应每个哈希\
  \ URL。例如，每当 URL 指向 `#step1` 时，JavaScript 应该显示步骤 1 内容，当它指向 `#step2` 时，显示步骤 2 内容。这样，当用户点击后退键时，将显示新内容，就像路由到一个新的静态\
  \ URL 一样。\n\n\n\n\n假设你使用我一直强调的面向对象、解耦模式构建了应用，那么设置路由器应该非常简单。路由器本身也容易实现。你可能会遇到的唯一问题是应用没有设置好以便于显示不同的路由页面。\n\
  \n## 创建路由\n\n基础的路由器设置如下：定义几个路由；然后定义你的应用在这些路由上执行的操作：\n\n```javascript\nvar Workspace\
  \ = Backbone.Router.extend({\n  routes: {\n    'settings': 'settings', // #settings\n\
  \    'help':    'help'      // #help\n  },\n  settings: function() {\n    // 初始化设置页面所需的任何初始化操作\n\
  \    console.log('Settings init');\n  },\n  help: function() {\n    // 初始化帮助页面所需的任何初始化操作\n\
  \    console.log('Help init');\n  }\n});\n```\n\n在这里，设置的路由使用了一个包含键值对的对象：\n\n- 键是路由的\
  \ URL hash——例如，“settings\" 对应 `#settings`。\n- 值是当浏览器遇到此 hash 时要调用的函数引用。例如，如果浏览器跳转到\
  \ `#help`，它将调用 `help()` 函数。\n\n## 设置 History API\n\n仅仅设置路由不足以在你的应用中建立路由或实现后退按钮支持。你仍然必须调用\
  \ history API。要启动路由，添加以下代码：\n\n```javascript\nBackbone.history.start();\n```\n\n\
  现在，如果你将 URL 更改为 `www.my-app.com/my-app-url#settings`，你会在控制台中看到相应的消息。虽然这在大多数浏览器中运行良好，但在\
  \ IE 中可能会遇到一些问题。为了解决这些兼容性问题，请确保在页面加载后启动 history API。例如，如果你使用 jQuery，可以这样写：\n\n```javascript\n\
  $(function() {\n  Backbone.history.start();\n});\n```\n\n这种方法解决了所有 IE 相关问题。\n\n\
  如果应用已经渲染了当前页面，且你不希望路由再次触发，可以传递 `silent: true`，例如 `Backbone.history.start({silent:\
  \ true})`。\n\n## 导航\n\n现在，你只需要通过向浏览器传递 hash URL 来触发不同的路由——例如：\n\n```html\n<a href=\"\
  #settings\">Settings</a>\n```\n\n或者你甚至可以用 JavaScript 调用这些路由：\n\n```javascript\n\
  window.location.hash = 'settings';\n```\n\n虽然这两种技术都能成功路由到你应用的不同页面，但在后面的 PushState\
  \ 对比 Hashchange 中，你会学习到一种更健壮的方法，它既可以处理 hash 也可以处理 `pushState` API。更好的方法是使用 `Backbone.history.navigate()`\
  \ 触发不同的路由：\n\n```javascript\nBackbone.history.navigate('settings', {trigger: true});\n\
  ```\n\n在这里，Backbone 将浏览器的 URL hash 更改为 `#settings`。`trigger` 表示 API 应该同时调用该 URL\
  \ 的路由函数。\n\n在某些情况下，你可能想更改路由但在浏览器历史记录中注册它（例如，不将其包含在后退按钮历史中）。这样，用户就可以书签页面或与朋友分享链接，而无需每次点击后退按钮都经过该页面。如果你正在进行很多无意义的路由但仍想允许链接，这种方法是合理的。为了防止新路由被注册为浏览器历史的一部分，请传递\
  \ `replace: true`：\n\n```javascript\nBackbone.history.navigate('settings', {trigger:\
  \ true, replace: true});\n```\n\n## 设置动态路由\n\nBackbone 的路由器非常全面——你甚至可以使用它们来设置动态路由。例如，如果你的应用有一个搜索页面，你可以设置以下内容：\n\
  \n```javascript\nvar Workspace = Backbone.Router.extend({\n  routes: {\n    'search/:query':\
  \ 'search', // #search/monkeys\n  },\n  search: function(query) {\n    ...\n  }\n\
  });\n```\n\n此动态路由会将斜杠后的任何内容作为 `search()` 函数的第一个参数传递，这意味着你可以设置一个如 `#search/whatever-they-search-for`\
  \ 的链接，并将搜索查询传递给路由处理器。你还可以设置多个动态参数：\n\n```javascript\nvar Workspace = Backbone.Router.extend({\n\
  \  routes: {\n    'search/:query':        'search', // #search/monkeys\n    'search/:query/p:page':\
  \ 'search'  // #search/monkeys/p7\n  },\n  search: function(query, page) {\n   \
  \ ...\n  }\n});\n```\n\n在这里，你为搜索页面设置了分页功能。现在，如果用户位于 `#search/monkeys/p7`，她会被正确地路由。此外，如果她在搜索的第一页，路由器在没有页面参数的情况下仍然工作。此外，请注意静态和动态参数之间的相互作用：静态的\
  \ `p` 与动态的 `:page` 并存。\n\n## PushState 对比 Hashchange\n\n到目前为止，你一直使用默认 URL hash 实现的\
  \ Backbone 路由器。使用 hash 的路由可能看起来像这样：\n\n`www.my-app.com/path-to-app#route`\n\n然而，这些路径开始变得很丑，特别是在处理动态参数时，例如：\n\
  \n`www.my-app.com/path-to-app#search/monkeys/p7`\n\n幸运的是，HTML5 规范提供了 `pushState`，它允许你路由到正常的\
  \ URL 而不更改浏览器中的页面。例如，这些 URL 将被变为：\n\n`www.my-app.com/path-to-app/route`\n\n`www.my-app.com/path-to-app/search/monkeys/p7`\n\
  \n如你所见，使用 `pushState` 后路径看起来更整洁。\n\n### 使用 PushState\n\n在 Backbone 中实现 `pushState`\
  \ 是轻而易举。只需在启动 history API 时将其定义为选项即可：\n\n```javascript\nBackbone.history.start({pushState:\
  \ true});\n```\n\n然而，如果你的应用不在域名的根目录下，你会遇到一些问题，因为 `pushState` URL 类似于普通 URL。为了解决这个问题，传递\
  \ `root` ：\n\n```javascript\nBackbone.history.start({pushState: true, root: '/path/to-app'});\n\
  ```\n\n### 使用 Modernizr 实现向后兼容\n\n由于 `pushState` 是新 HTML 规范的一部分，你可能好奇旧浏览器中发生了什么。虽然\
  \ Backbone 不会自动处理回退，但你可以使用 Modernizr 轻松设置。你只需引入 Modernizr（可以在 [`modernizr.com/`](http://modernizr.com/)\
  \ 找到），然后如下传递 pushState 选项：\n\n```javascript\nBackbone.history.start({pushState:\
  \ Modernizr.history});\n```\n\n现在，支持的浏览器使用 pushState，不支持的浏览器回到 hash 实现。\n\n## pushState\
  \ 的最佳实践\n\n除了让 URL 更好看，`pushState` 对你的应用架构也有重要影响。如果你正确使用 `pushState`，它会让你的应用在不同环境和情况下更加健壮。然而，如果你使用不当，它会让你的应用变得糟糕。\n\
  \n这个问题主要出现在 JavaScript 不工作时。这不仅对于那些主动禁用 JavaScript 的人是一个问题，当 JavaScript 损坏或仍在加载时也是一个问题。\n\
  \n如果没有 JavaScript，hash URL 将无法加载。例如，如果用户书签了 hash URL 并在禁用 JavaScript 后重新访问该页面，用户将进入应用的启动页。此外，在\
  \ JavaScript 加载期间，启动页也会显示，然后跳转到正确的内容。`pushState` 为你提供了解决这个问题的方法。因为 `pushState` 路径与普通\
  \ URL 相同，你可以在服务器和 JavaScript 中处理页面更改。\n\n因此，当用户重新访问 `pushState` URL 时，你可以通过后端生成的标记静态地生成相应的内容。这样，即使用户禁用了\
  \ JavaScript 或 JavaScript 加载较慢，页面仍然可以工作。\n\n\n\n\n\n尽管你的应用可能依赖大量的 JavaScript，但请尽可能提供不依赖\
  \ JavaScript 的内容，以备 JavaScript 无法正常工作的罕见情况。\n\n然而，这个黄金机会也是一把双刃剑。如果你没有从服务器提供任何内容，当使用\
  \ `pushState` 时，应用可能会完全崩溃。当用户停留在页面并使用后退按钮时，问题不会出现。但如果用户收藏了该页面或将链接分享给朋友，页面将从该静态 URL\
  \ 加载。\n\n如果你的应用设置在 `www.my-app.com/path-to-app` 且 `pushState` 的 URL 为 `www.my-app.com/path-to-app/route`，请确保后端同样在该\
  \ URL 上提供你的应用。否则，页面将出现 `404`，无论你的用户 JavaScript 是否工作正常，应用都将完全崩溃。\n\n因此，即使你不想在那个 URL\
  \ 上设置有意义的静态内容，至少也要包含你的基础应用，以便 `Backbone` 能够介入并使用 JavaScript 提供正确的内容。最简单的方法是将你应用下的所有页面重写，路由回应用的主页。例如，在\
  \ Apache Web 服务器上，你可以在 `.htaccess` 文件中使用 `mod_rewrite` 来实现：\n\n```apache\n# 启用重写\n\
  RewriteEngine on\n# 将你应用下的所有页面重写回应用\nRewriteRule ^my-app\\/(.*)$ /my-app [QSA,L]\n\
  ```\n\n这种快速粗暴的修复确保了你的应用对 JavaScript 用户可以正常加载。但我强烈建议你考虑为所有路由提供一些有意义的静态内容。\n\n## 关于事件更多\n\
  \n你已经知道如何使用 `on()` 方法为模型和集合附加如 `add`、`remove` 和 `change` 等事件。在本节中，你将学习更多关于 `Backbone`\
  \ 中的事件绑定和解绑。\n\n在某些 `Backbone` 文档中，你可能注意到 `bind()` 被用来代替 `on()`。那只是一个旧的语法，已经被 jQuery\
  \ 的 `on()` 模式所废弃。\n\n### 解绑事件\n\n除了使用 `on()` 绑定事件外，你也可以同样轻松地使用 `off()` 方法解绑事件：\n\
  \n```javascript\nFruit.off('remove');\n```\n\n这段代码解绑了模型上所有的 `remove` 监听器。但如果你附加了许多不同的监听器，可以通过引用作为独立的函数来移除单个监听器：\n\
  \n```javascript\nvar removeCallback = function() {\n  console.log('Fruit removed\
  \ - ' + this.get('type'));\n},\nremoveCallback2 = function() {\n  console.log('Bummer');\n\
  };\n\nvar Fruit = Backbone.Model.extend({\n  initialize: function() {\n    this.on('remove',\
  \ removeCallback);\n    this.on('remove', removeCallback2);\n  }\n});\n...\n\nFruit.off('remove',\
  \ removeCallback2);\n```\n\n此脚本只解绑了第二个回调。\n\n最后，你可以通过不传递任何参数从对象上解绑所有事件：\n\n```javascript\n\
  Fruit.off();\n```\n\n### 手动触发事件\n\n有时，你想手动触发一个事件。当然，你可以直接触发绑定到事件的回调，但触发事件本身通常更简单或更准确。例如，假设你为不同的对象分配了几个不同的回调，但仍然想触发任何已分配的回调。触发事件很容易；只需使用\
  \ `trigger` 方法即可：\n\n```javascript\nFruit.trigger('add');\n```\n\n这将触发该模型上的 `add`\
  \ 事件，触发任何通过 `on()` 分配的回调。\n\n### 绑定“this”\n\n处理 `Backbone` 时最大的障碍之一是，每当你将函数作为回调传递时，`this`\
  \ 上下文就会改变。这个问题主要出现在处理事件和 `on()` API 时，因为你在 `Backbone` 中看到最多的回调就在那里。\n\n你可能注意到某些示例使用了类似下面的代码行：\n\
  \n```javascript\n_.bind( this.render, this );\n```\n\n这个 underscore 函数会将第一个参数中的对象，绑定到每个指定函数被调用时\
  \ `this` 的值上。通常情况下，使用这种方法是为了让回调函数在被调用时保留调用对象的上下文，而不是意料之外的上下文。在大多数情况下，你可以使用这种简单的万能技术，但可能会有那么一个时刻，你需要为某个函数传递一个单独的上下文。在这些情况下，你可以在分配回调时手动将上下文作为第三参数传递：\n\
  \n```javascript\nthis.model.on('change', this.render, this);\n```\n\n这个示例与你已经过的其他\
  \ `on()` 处理器几乎相同：每当模型发生变化时，都会调用视图的 `render` 函数。唯一的区别是第三个参数，你可以在那里传递 `this` 上下文。\n\
  \n在这种情况下，第三个参数确保 `this` 在更改处理程序中持续。但你也可以在这里传递任何想要的内容。例如，当你设置嵌套视图时，会在子视图中设置一个 `parentView`\
  \ 值。有时，该值可能是一个更相关的 `this` 值，在这种情况下，你可以改为传递该值：\n\n```javascript\nthis.model.on('change',\
  \ this.render, this.parentView);\n```\n\n在这里，`this.parentView` 将成为 render 函数中的 `this`\
  \ 上下文。\n\n### 所有事件 All\n\n你可以在 `Backbone` 中使用多种事件：\n\n- `add`\n- `remove`\n- `change`\n\
  - `change:[attribute]`\n- `destroy`\n- `sync`\n- `error`\n- `all`\n\n一个值得注意的特殊事件类型是\
  \ `all`，它是一个全能监听器，你可以用它同时跟踪所有这些事件。如果你想在一个地方设置所有的事件处理程序，这将非常有用。\n\n事件类型将作为第一个参数传递给此处理程序，你可以用它来设置自己的\
  \ switch 语句：\n\n```javascript\n// 创建模型\nvar User = Backbone.Model.extend({\n  initialize:\
  \ function() {\n    // 设置一个全能监听器\n    this.on('all', this.allHandler);\n  },\n \
  \ // Backbone 将事件类型作为第一个参数传递\n  allHandler: function(eventType) {\n    // 根据事件类型切换\n\
  \    switch(eventType) {\n      case 'add':\n        // 在 add 时你想做的任何操作\n      \
  \  break;\n      case 'remove':\n        // 在 remove 时你想做的任何操作\n        break;\n\
  \      case 'change':\n        // 在 change 时你想做的任何操作\n        break;\n    }\n  }\n\
  });\n```\n\n你可能在奇怪为什么使用这种方法而不是为每种事件类型设置单独的处理器。事实上，如果你的处理程序都是完全独立的，你就不需要这种方法。但如果你依赖于一个事件在另一个事件之前触发，最好在\
  \ `all` 事件中手动设置每一个事件，因为在 `Backbone` 中很难确定哪个事件会先触发。使用这种方法，你避免了任何竞态条件。\n\n## 操作集合\n\
  \n到为止，你以一种非常基础的方式使用了集合。你使用它们来对相关模型分组，然后遍历这些项。然而，你可以对集合做更多事情，例如提取某些项、按不同的键进行过滤以及根据自定义排序函数进行排序。\n\
  \n### 提取集合项\n\n一旦你向集合中添加了多个不同的项，你可以用几种不同的方式将它们提取。但首先，创建一个集合以便你有东西处理：\n\n```javascript\n\
  // 创建模型\nvar Fruit = Backbone.Model.extend({});\n// 创建集合\nvar Fruits = Backbone.Collection.extend({\n\
  \  model: Fruit\n});\nvar fruitbowl = new Fruits;\n// 向集合添加项\nfruitbowl.add({ type:\
  \ 'apple', color: 'red', quantity: 3 });\nfruitbowl.add({ type: 'apple', color:\
  \ 'yellow', quantity: 5 });\nfruitbowl.add({ type: 'banana', color: 'yellow', quantity:\
  \ 1 });\nfruitbowl.add({ type: 'orange', color: 'orange', quantity: 3 });\n```\n\
  \n现在，你可以深入从这个集合中提取单个项。\n\n#### 按索引提取集合项\n\n首先，你可以通过将索引传递给 `at()` 来提取任何集合项：\n\n```javascript\n\
  var thirdFruit = fruitbowl.at(2);\n```\n\n\n\n\n\n此代码段提取了集合中的第三项（因为索引从 0 开始），在这种情况下它是一个香蕉。\n\
  \n还有专门的函数用于提取集合的第一个和最后一个项：\n\n```javascript\n// first item\nvar firstFruit = fruitbowl.first();\n\
  \n// last item\nvar lastFruit = fruitbowl.last();\n```\n\n在这里，`first()` 和 `last()`\
  \ 函数分别提取了红苹果和橙子。\n\n在稍后的排序集合章节中，我将向你展示如何对集合进行排序。然而，即使你没有对集合进行排序，仍然可以根据它们插入的顺序来提取项。\n\
  \n## 匹配特定的集合项\n\n你也可以根据属性从集合中提取项。要这样做，请向 `where()` 传递过滤规则：\n\n```javascript\nvar\
  \ apples = fruitbowl.where({ type: 'apple' });\n```\n\n此代码段从你的集合中提取任何该类型的项。取决于匹配情况，这可以是单个项目，也可以是多个项目（或者没有项目）。\n\
  \n在这个示例中，`where()` 将两个苹果都提取为一个独立的集合。然后，你可以使用之前使用的 `index` 方法（或更具体的过滤器）从该集合中提取单个苹果。\n\
  \n## 排序集合\n\n你还可以通过几种不同的方式对集合进行排序。在通过索引提取集合项以及顺序遍历集合项时，排序是非常重要的。\n\n### 使用“按...排序”函数\n\
  \n默认情况下，集合保持插入顺序；你添加到集合中的第一个项目是第一个，第二个是第二个，依此类推。但你可以通过设置一个比较器函数来改变它们的默认顺序：\n\n```javascript\n\
  fruitbowl.comparator = function(fruit) {\n  // sort by quantity\n  return fruit.get('quantity');\n\
  };\n```\n\n在这里，这些项将根据其 `quantity` 属性的值进行排序。当应用于你之前创建的集合时，该比较器将顺序更改如下：\n\n```json\n\
  [\n  {\"type\":\"banana\",\"color\":\"yellow\",\"quantity\":1},\n  {\"type\":\"\
  apple\",\"color\":\"red\",\"quantity\":3},\n  {\"type\":\"orange\",\"color\":\"\
  orange\",\"quantity\":3},\n  {\"type\":\"apple\",\"color\":\"yellow\",\"quantity\"\
  :5}\n]\n```\n\n如你所见，项目是按数量排序的。当两个项目具有相同数量时（红苹果和橙子），顺序默认为原始的插入顺序。\n\n### 创建自定义排序函数\n\
  \n到目前，你创建了一个“按...排序”的比较器函数，这意味着它是根据单个指标的值进行排序。当你想要根据数值升序排序某些内容，或者按字母顺序排序字符串时，这非常棒。如果你的比较器函数只接受一个参数，则这种简单类型的比较会被自动使用。但你也可以通过向比较器传递两个参数来创建一个具有更多控制\
  \ own 的自定义排序函数，如下所示：\n\n```javascript\nfruitbowl.comparator = function( fruit1,\
  \ fruit2 ) { … }\n```\n\n然而，自定义排序函数要复杂得多。排序比较简单地返回一个用于比较的值，而自定义排序函数必须自己执行排序。这意味着你应该返回以下内容：\n\
  \n- 如果第一个模型应该在第二个模型之前，返回 `-1`。\n- 如果它们的排名相同，返回 `0`。\n- 如果第二个模型应该在第一个模型之前，返回 `1`。\n\
  \n例如，你可以按字母倒序对水果进行排序：\n\n```javascript\n// create a custom comparator to sort in\
  \ reverse alphabetical order\nfruitbowl.comparator = function(fruit1, fruit2) {\n\
  \  // get the names for each fruit\n  var fruitName1 = fruit1.get('type'),\n  fruitName2\
  \ = fruit2.get('type');\n  // compare the strings\n  if ( fruitName1 < fruitName2\
  \ ) return 1;\n  if ( fruitName1 > fruitName2 ) return -1;\n  return 0;\n};\n```\n\
  \n在这里，如果第二个水果具有更高的字母值，你返回 `1`（因为你希望更高的字母值靠前）。相反，如果第一个水果具有更高的字母值，你返回 `-1`。最后，如果它们相同，你返回\
  \ `0`。如你所见，自定义比较器将水果按字母倒序排序：\n\n```json\n[\n  {\"type\":\"orange\",\"color\":\"\
  orange\",\"quantity\":3},\n  {\"type\":\"banana\",\"color\":\"yellow\",\"quantity\"\
  :1},\n  {\"type\":\"apple\",\"color\":\"red\",\"quantity\":3},\n  {\"type\":\"apple\"\
  ,\"color\":\"yellow\",\"quantity\":5}\n]\n```\n\n我保持了这个示例的简单，但如果你想更复杂一点，还可以使用原生\
  \ JavaScript 字符串比较 `localeCompare()`：\n\n```javascript\n// create a custom comparator\
  \ to sort in reverse alphabetical order\nfruitbowl.comparator = function(fruit1,\
  \ fruit2) {\n  // get the type names for each fruit\n  var fruitName1 = fruit1.get('type'),\n\
  \  fruitName2 = fruit2.get('type');\n  // compare the strings with localeCompare\n\
  \  return fruitName2.localeCompare( fruitName1 );\n};\n```\n\n`localeCompare()`\
  \ 对于这种排序特别有用，因为它返回适当的 `1`、`0` 或 `-1` 值。通常你使用 `firstString.localeCompare( secondString\
  \ )`，但在这里它们反转了以实现字母倒序排序。\n\n### 手动触发排序\n\n比较器函数会自动保持集合顺序。例如，你可以向集合中添加额外的项：\n\n```javascript\n\
  // add items to the collection\nfruitbowl.add({ type: 'apple', color: 'red', quantity:\
  \ 5 });\nfruitbowl.add({ type: 'orange', color: 'orange', quantity: 3 });\n\n//\
  \ create a comparator\nfruitbowl.comparator = function(fruit) {\n  // sort by quantity\n\
  \  return fruit.get('quantity');\n};\n\n// add additional items\nfruitbowl.add({\
  \ type: 'peach', color: 'pink', quantity: 2 });\nfruitbowl.add({ type: 'plum', color:\
  \ 'purple', quantity: 4 });\n```\n\n尽管在定义比较器之后向此集合添加了一些项，但集合仍然保持有序。事实上，在添加额外项之前，集合根本不会进行排序。因此，在某些情况下，你将对集合进行重新排序。幸运的是，你可以使用\
  \ `sort()` 轻松实现这一点：\n\n```javascript\n// set the quantity of oranges to zero\n//\
  \ this won't automatically change the sort order\nfruitbowl.where({ type: 'orange'\
  \ }).set( 'quantity', 0 );\n\n// trigger a sorting\nfruitbowl.sort();\n```\n\n在这里，有人吃掉了所有的橙子，所以你必须手动对集合进行重新排序。\n\
  \n在本章中，你了解了如何使用 Backbone 为你的应用构建结构。你从学习为什么要使用 Backbone 以及何时避免它开始。然后你发现了在模型和集合中设置数据的基础知识。\n\
  \n接下来，你学习了如何通过 Backbone  将模型中的数据与屏幕上的视觉变化关联。你还发现了如何将该数据同步到持久化层。然后你学习了如何使用路由器将某些\
  \ URL 映射到应用中由 JavaScript 生成的不同页面，并构建对返回按钮和书签的支持。最后，你阅读了如何使用 Backbone 的事件处理器来跟踪各种事件，以及如何操作集合。\n\
  \n在接下来的章节中，你将发现如何使用许多其他 JavaScript 技术。然而，这本书将不断回到 Backbone，因为它是构建其余代码的基础。\n\n##\
  \ 额外资源\n\nBackbone Documentation: [`http://backbonejs.org/`](http://backbonejs.org/)\n\
  \nUnderscore Documentation: [`http://underscorejs.org/`](http://underscorejs.org/)\n\
  \nBackbone 最佳实践:\n\nBackbone Boilerplate: [`https://github.com/tbranyen/backbone-boilerplate`](https://github.com/tbranyen/backbone-boilerplate)\n\
  \nBackbone Patterns: [`http://ricostacruz.com/backbone-patterns/`](http://ricostacruz.com/backbone-patterns/)\n\
  \n\n\n\n\n# Backbone 相关书籍\n\n《Developing Backbone.js Applications》（免费电子书，强烈推荐）:\
  \ [`http://addyosmani.github.com/backbone-fundamentals/`](http://addyosmani.github.com/backbone-fundamentals/)\n\
  \nRails 上的 Backbone.js: [`https://learn.thoughtbot.com/products/1-backbone-js-on-rails`](https://learn.thoughtbot.com/products/1-backbone-js-on-rails)\n\
  \n# Backbone 教程\n\nBackbone.js 入: [`http://net.tutsplus.com/tutorials/javascript-ajax/getting-started-with-backbone-js/](http://net.tutsplus.com/tutorials/javascript-ajax/getting-started-with-backbone-js/)\n\
  \n使用 Backbone.js 构建联系人管理器: [`http://net.tutsplus.com/tutorials/javascript-ajax/build-a-contacts-manager-using-backbone-js-part-1/](http://net.tutsplus.com/tutorials/javascript-ajax/build-a-contacts-manager-using-backbone-js-part-1/)\n\
  \nBackbone.js 剖析: [`http://www.codeschool.com/courses/anatomy-of-backbonejs`](http://www.codeschool.com/courses/anatomy-of-backbonejs)\n\
  \n# 第 4 章\n\n## 使用 JavaScript 模板\n\n模板是在 `JavaScript` 中生成长字符串标记的最优方式。你不再通过向 `DOM`\
  \ 附加单个元素来逐个创建标记，而是构建一个可以一次性生成整块标记的模板。模板消除了将标记混合到 `JavaScript` 中的需求，并让生成 `DOM` 内容变得更加直观得多，因为它们为标记提供了一个专门的地方，标记将根据你传入的变量进行编译。这意味着你的\
  \ `JavaScript` 仍然可以驱动模板的内容，而无需与之混杂。\n\n在本章中，你将学习到为什么要使用模板，以及了解一些可以用于模板化的不同库。然后，你将发现使用\
  \ Underscore 模板的各种基础：如何将标记字符串与变量混合，以及如何包含基础的 `JavaScript` 代码（如循环）。你还会发现关于如何以及在何处包含模板的最佳实践。最后，我将结合你在第\
  \ 3 章中所学的内容，教你如何将模板整合到 Backbone 中用于渲染视图。\n\n### 模板简介\n\n`JavaScript` 模板将彻底改变你向 `DOM`\
  \ 注入标记的方式。它们可以轻松生成由 `JavaScript 变量` 驱动的长标记字符串，同时与程序的领域逻辑保持分离。\n\n### 为什么要使用模板？\n\
  \n在代码组织方面，`JavaScript` 模板是你使用的最重要的技术之一。模板允许你将混乱的标记与你的 `JavaScript` 分离。没有什么比充斥着标记字符串的\
  \ `JavaScript` 更难看了——它是面条式代码的典型。\n\n#### 关注点分离\n\n当你内联 `JavaScript` 中插入标记时，你是将 `JavaScript`\
  \ 与 `DOM` 紧密耦合在一起。这时，如果你因为样式或内容原因需要更改标记，就必须修改脚本。将标记保持在单独的位置要得多——一个可以独立于其他 `JavaScript`\
  \ 代码进行修改的模板。这样你就将应用程序的表示层与其领域逻辑解耦了。\n\n#### 性能\n\n模板的性能通常优于其他替代方案，因为标记是作为字符串独立编译的，而不是逐位插入\
  \ `DOM` 中。这意味着你只需要操作一次 `DOM` 即可渲染其初始状态：即在你最终插入编译后的模板时。\n\n更改 `DOM` 仍然是前端开发中最大的性能瓶颈之一。每当你对可见页面进行更改时，浏览器都必须重新渲染，这可能会触发重流（reflow）。每当浏览器需要调整页面上的其他内容以适应\
  \ `DOM` 的几何结构变化时，就会发生重流。例如，如果你增加了浮动元素的宽度，它可能会将其他浮动元素推到下一行，从而将所有后续内容向下推。\n\n通常情况下，触发重流是不可避免的——毕竟，你有时必须修改页面。但最好的方法是批量处理这些更改，以触发单次重流，而不是反复向\
  \ `DOM` 附加新元素。这正是大多数模板引擎的处理方式。\n\n若要了解重流是如何工作的，请看这个基于 Gecko 浏览器的可视化视频：[`http://youtu.be/ZTnIxIA5KGw`](http://youtu.be/ZTnIxIA5KGw)。\n\
  \n### 了解不同的模板库\n\n模板库主要分为两大类：嵌入 `JavaScript` 的和无逻辑（logic-less）的。前者允许你在模板中使用 `JavaScript\
  \ 逻辑`，而后者仅允许你传入变量并使用一些预定义的函数。\n\n支持无逻辑模板的理由是，它们遵循了模板的通用目的：关注点分离。这种方法的倡导者希望模板尽可能“愚蠢”，将所有逻辑都放在实际的\
  \ `JavaScript` 中。然而在实践中，无逻辑模板框架实际上可能会减少关注点分离，因为使用它们通常要求你以与表示层紧密耦合的方式准备数据。例如，如果你需要\
  \ `JavaScript` 重新格式化日期字符串，你是将其包含在领域逻辑中还是模板本身中？最终的选择取决于你的开发风格。\n\n#### Underscore.js\n\
  \n`Underscore` 是一个工具箱库，提供了系列解决常见 `JavaScript` 任务的函数。它还有一个基础的 `JavaScript 模板引擎`，有助于将渲染的标记与你的核心\
  \ `JavaScript` 文件分离。\n\n尽管 `Underscore 模板` 没有其他模板库那样功能全，但你可能不需要更丰富的功能。而且 `Underscore`\
  \ 是 Backbone 的先决条件，对于任何使用 Backbone 的项目来说，它都是一个极具吸引力的选择。\n\n我几乎在每个需要模板的项目中使用 Backbone，因此\
  \ `Underscore` 是我首选的模板库。它没有给应用增加任何额外负担，并允许你针对缺失的功能嵌入 `JavaScript`。\n\n要了解更多关于 `Underscore`\
  \ 的信息，请访问 [`http://underscorejs.org/.`](http://underscorejs.org/)。\n\n本章中的示例都使用\
  \ `Underscore`，但这些概念可以扩展到你喜欢的任何库。\n\n#### Handlebars.js\n\n`Handlebars.js` 是一个非常流行的模板解决方案，基本上是另一个无逻辑模板库\
  \ `Mustache.js` 的扩展。\n\nHandlebars 提供了你在 `Underscore` 中找不到的便利功能：\n\n- 你可以为变量设置上下文，以便遍历大型对象。\n\
  - 有几个内置的循环可以替代 `JavaScript 循环`。\n- 你可以在模板中使用特殊的注释语法。\n- 你可以定义简单的辅助函数，例如合并两个变量。\n\
  \n`Handlebars` 中的许多功能非常有用，但除了注释外，它们都是你可以在 `Underscore` 中通过混合一点 `JavaScript` 实现的。\n\
  \n这个问题更多是关于方法的选择：\n\n- 既然模板旨在将标记与 `JavaScript` 分离，你真的想在模板中混合大量的 `JavaScript` 吗？\n\
  - 另一方面，你仍然在使用 `Handlebars` 来执行脚本任务。既然你已经熟练编写 `JavaScript`，那么为什么还要去学习新方法呢？你真的需要那些额外的负担吗？\n\
  \n要了解更多关于 `Handlebars` 的信息，请访问 [`http://handlebarsjs.com`](http://handlebarsjs.com/)。`Handlebars.js`\
  \ 可以预编译模板，这通常对性能更好。\n\n#### Transparency\n\n`Transparency` 是一个有趣的模板解决方案，它的工作方式与其他方案不同。`Transparency`\
  \ 将你应用程序中的数据以 `JSON 对象` 的形式绑定到实际的 `DOM 元素`。然后，它不是编译长标记字符串并插入，而是使用缓存的 `DOM 引用` 逐一个地替换微型字符串。\n\
  \n\n\n\n\n它因与所有其他选项相比具有巨大的性能优势而受到一些赞誉。然而，`Transparency` 将数据绑定到 DOM 的方式违背了使用模板的初衷。它没有将你的标记和\
  \ JavaScript 解耦，反而是在应用的数据和表现层之间创建了最紧密的耦合。这使得实现变得困难，维护起来也更加痛苦。\n\n你可以在 [`http://leonidas.github.com/transparency/](http://leonidas.github.com/transparency/)\
  \ 了解更多关于 `Transparency` 的信息。\n\n## 微模板 (Micro Templating)\n\n不久，John Resig 在他的博客上发布了一个极其轻量级的微模板解决方案，大小仅约为\
  \ 1K。微模板是迄今为止最小的模板选项，也是最极简的。但如果你不需要任何额外功能，它可以是一个非常有吸引力的选择。要了解更多关于微模板的信息，请访问 [`http://ejohn.org/blog/javascript-micro-templating/](http://ejohn.org/blog/javascript-micro-templating/)。\n\
  \n`Underscore` 中的模板引擎实际上是基于 Resig 提出的微模板解决方案的。\n\n## 做出正确的选择\n\n面对市面上所有的模板解决方案，很难选择正确的一个。这里是你需要考虑的四点：\n\
  \n- **功能性**：该解决方案是否提供了你需要的所有内容？另一方面，它是否提供的功能太多，从而导致你的代码库膨肿？\n- **性能**：模板编译速度有多快？你可以预编译它们吗？这里有一个非常实用的\
  \ `JSPerf` 比较了不同的选项：[`http://jsperf.com/dom-vs-innerhtml-based-templating/365](http://jsperf.com/dom-vs-innerhtml-based-templating/365)。\n\
  - **灵活性**：使用起来方便吗？`Transparency` 在性能上超过所有竞争对手，但它严格地将模板绑定到 DOM，从而违背了模板的初衷。\n- **成熟度**：尽管非常诱人，但使用仍处于婴儿期阶段的模板引擎通常不是最明智的选择。对于业务关键型应用程序，选择一个经过测试的库可能是更明智的选择。\n\
  \n如果你仍然难以决定哪个模板库适合你，请前往 [`http://garann.github.com/template-chooser/](http://garann.github.com/template-chooser/)，在那里你可以根据所需的特征帮助缩小选择范围。\n\
  \n## 使用 Underscore 模板\n\n本章使用 `Underscore` 模板，因为它们易于使用，而且你已经将 `Underscore` 作为 `Backbone`\
  \ 的前提条件包含了。\n\n### Underscore 模板基础\n\n使用 `Underscore` 模板实际上非常简单。只需定义模板、传入变量，并将其插入\
  \ DOM 即可。\n\n#### 使用模板\n\n第一步是定义模板：\n\n```javascript\nvar myTemplate = _.template('Welcome,\
  \ <%= name %>');\n```\n\n此示例使用 `Underscore` 的 `template` 方法定义了一个新模板。模板中的文本工作方式如下：\n\
  \n- 有一些静态文本将按原样输出（“Welcome, ”\"）。\n- 还有一个变量 `name`，封装在 `<%= ... %>` 中。变量的值在编译模板时传入。\n\
  \n在 `Underscore` 中，代码使用 `<% ... %>` 进行插值。这里添加的等号（`<%=`）表示模板在编译时应该输出这段代码。\n\n下一步是编译模板。要做到这一点，你调用为模板定义的函数，并传入一个对象，其属性映射到模板字符串中定义的变量名。\n\
  \n```javascript\nvar compiled = myTemplate({name: 'Jon'});\n```\n\n当模板编译时，会传入你在这里定义的变量。现在使用\
  \ `console.log(compiled)` 查看完成的字符串：\n\n```text\nWelcome, Jon\n```\n\n就这些了。虽然本章介绍了许多你可以对模板执行的额外操作，但从根本上说，没有哪种操作比传入基本变量并渲染该文本更复杂。\n\
  \n#### 穿插标记\n\n你还可以在模板中组合标记。毕竟，构建简单的字符串并不是模板真正的用处。你可以在 JavaScript 中完成这一点。使用模板的主要用于为了避免将标记放在\
  \ JS 中。例如，你可以为网页内容的一个小部分创建一个模板：\n\n```javascript\nvar myTemplate = _.template('<article>\\\
  \n<hgroup>\\\n  <h1><%= title %></h1>\\\n  <h2><%= subtitle %></h2>\\\n</hgroup>\\\
  \n  <p><%= description %></p>\\\n</article>');\n```\n\n在这里，各种标记元素与变量混合在一起。每行以反斜杠结束，这允许你在\
  \ JavaScript 中构建多行字符串。\n\n处理反斜杠（`backslashes`）可能会非常麻烦，所以在在本章稍后的 回顾模板最佳实践 部分，我将向你展示一种更好的方法。\n\
  \n现在你可以用一些变量编译此模板：\n\n```javascript\nvar compiled = myTemplate({\n  title: 'JavaScript\
  \ Templates',\n  subtitle: 'Are pretty awesome',\n  description: 'They take the\
  \ markup out of your JavaScript'\n});\n```\n\n你已经编译了模板，但你仍然需要将其放置在页面上。你可以通过几种方式将此内容注入\
  \ DOM：\n\n- 通过 ID 选择元素并插入它。\n- 替换元素。\n- 将其追加到 body。\n\n为了保持简单，这里有一个使用 `jQuery` 将其添加到\
  \ body 的示例：\n\n```javascript\n$('body').append(compiled);\n```\n\n图 4-1 显示此内容正在页面上渲染。\n\
  \n![9781118524565-fg0401.tif](img/9781118524565-fg0401_fmt.png)\n\n图 4-1：页面已使用模板进行渲染。\n\
  \n简单回顾一下，这里是完整的代码：\n\n```javascript\n// 构建模板\nvar myTemplate = _.template('<article>\\\
  \n<hgroup>\\\n  <h1><%= title %></h1>\\\n  <h2><%= subtitle %></h2>\\\n</hgroup>\\\
  \n  <p><%= description %></p>\\\n</article>');\n\n// 使用变量编译模板\nvar compiled = myTemplate({\n\
    title: 'JavaScript Templates',\n  subtitle: 'Are pretty awesome',\n  description:\
  \ 'They take the markup out of your JavaScript'\n});\n\n// 将追加到 DOM\n$('body').append(compiled);\n\
  ```\n\n#### 使用插值字符串\n\n默认情况下，`Underscore` 使用 ERB 风格的分隔符——变量被隔离在 `<% %>` 中。但你也可以设置自己的分隔符。例如，要使用\
  \ Handlebars.js 风格的 `{{ ... }}` 插值，可以在 `_.templateSettings` 中定义它：\n\n```javascript\n\
  _.templateSettings = {\n  interpolate : /\\{\\{(.+?)\\}\\}/\n};\n```\n\n如此处所示，你使用正则表达式设置了\
  \ `interpolate` 设置。现在你可以在模板中使用新的分隔符：\n\n```javascript\n// 使用新分隔符构建模板\nvar myTemplate\
  \ = _.template('Welcome, {{ name }}');\n\n// 使用变量编译模板\nvar compiled = myTemplate({name:\
  \ 'Jon'});\n```\n\n在这里，你之前定义的模板正在使用新的插值模式进行编译。\n\n设置不同的插值设置不仅是为了样式。它有时是必要的，例如当默认的\
  \ `<%` 与为其他语言的标签冲突时。\n\n#### 回顾模板最佳实践\n\n之前的示例使用反斜杠在 JavaScript 中构建多行字符串。虽然这种方法可行，但会变得非常麻烦。此外，我一直在强调将标记留在\
  \ JavaScript 之外有多重要。虽然模板将它们都放在了一起，但到目前为止它们仍在 JS 中，这是一种非常糟糕的做法。幸运的是，有一种处理模板的更好方法。\n\
  \n 分离你的模板\n\n引入 JavaScript 模板的最佳方法是将其与你的其余 JavaScript 完全隔离开。为此，在页面上单独的 `<script>`\
  \ 标签中包含模板，例如：\n\n```html\n<script type=\"text/template\">\n<article>\n<hgroup>\n\
    <h1><%= title %></h1>\n  <h2><%= subtitle %></h2>\n</hgroup>\n  <p><%= description\
  \ %></p>\n</article>\n</script>\n```\n\n注意这里你不需要在每行末尾添加反斜杠——这是这不是字符串；它是一个独立的脚本。\n\
  \n\n\n\n此外，请密切注意 `<script>` 标签的 `type` 属性。通常，JavaScript 脚本标签使用 `type=\"text/javascript\"\
  `（在 HTML5 中可以不写 `type`）。然而，这里使用了 `type=\"text/template\"` 来表示这是一个模板，而不是 JavaScript。这是至关重要的；否则，浏览器将尝试将其作为\
  \ JavaScript 解析并运行（无疑会抛错误）。\n\n接下来，你需要将此内容引入 Underscore。要这样做，请先为 `<script>` 标签分配一个\
  \ ID：\n\n```html\n<script type=\"text/template\" id=\"my-template\">\n  ...\n</script>\n\
  ```\n\n现在，你可以使用 `jQuery` 获取此脚本的文本，并用它来定义模板：\n\n```javascript\nvar myTemplate = _.template(\
  \ $('#my-template').text() );\n```\n\n现在你就完成了——你现在可以像往常一样使用模板，传入变量来编译它。\n\n值得注意的是，当你使用这种方法时，没有使用\
  \ HTML5 `doctype` 的文档将无法通过正确标记的验证。此外，如果你担心非常老旧浏览器并使用了 XHTML `doctype`，请确保将你的模板包裹在\
  \ `//<![CDATA[ ... //]]>` 中。然而，在引入模板文本时也需要考虑到这一点。\n\n### 使用外部模板\n\n或者，你也可以使用外部模板。方法类似：首先使用\
  \ `<script>` 标签；但这次要添加一个外部的 `src`：\n\n```html\n<script type=\"text/template\" src=\"\
  my-template.html\" id=\"my-template\"></script>\n```\n\n现在内容变得稍微复杂了一些，因为你必须使用 `Ajax`\
  \ 请求模板内容：\n\n```javascript\n$.ajax({\n  // 从脚本标签中获取模板 url\n  url: $('#my-template').attr('src'),\n\
  \  // 加载完成后执行的操作\n  success: function(data) {\n    // 加载后，定义你的模板\n    var myTemplate\
  \ = _.template(data);\n    // 编译它\n    var compiled = myTemplate({\n      title:\
  \ 'JavaScript Templates',\n      subtitle: 'Are pretty awesome',\n      description:\
  \ 'They take the markup out of your JavaScript'\n    });\n    // 附加到 DOM\n    $('body').append(compiled);\n\
  \  },\n  // 以防发生错误\n  error: function() {\n    console.log('Problem loading template');\n\
  \  }\n});\n```\n\n如你所见，你首先使用脚本标签的 `src` 属性定义 `Ajax` 请求的 URL。然后当 `Ajax` 返回模板文本后，你在成功回调函数中编译模板。\n\
  \n考虑到你可能会对多个模板执行此操作，你应该定义一个函数来为你处理：\n\n```javascript\n// 加载外部模板\nvar loadTemplate\
  \ = function(src, callback) {\n  $.ajax({\n    url: src,\n    // 加载完成后执行的操作\n  \
  \  success: function(data) {\n      // 加载后，定义你的模板\n      var template = _.template(data);\n\
  \      // 调用回调并传递模板\n      callback(template);\n    },\n      // 以防发生错误\n      error:\
  \ function() {\n        console.log('Problem loading template: ' + src);\n    }\n\
  \  });\n};\n```\n\n该函数使用 `Ajax` 请求模板文本，创建模板函数，然后将其传递给回调函数，以便你可以编译它或执行任何其他需要的操作：\n\
  \n```javascript\n// 使用示例\nloadTemplate( $('#my-template').attr('src'), function(template)\
  \ {\n  // 编译它\n  var compiled = template({\n    title: 'JavaScript Templates',\n\
  \    subtitle: 'Are pretty awesome',\n    description: 'They take the markup out\
  \ of your JavaScript'\n  });\n  // 附加到 DOM\n  $('body').append(compiled);\n});\n\
  ```\n\n在此处调用你的模板加载函数，传入两个参数：\n\n- 从脚本标签中获取的模板 URL\n- 处理返回模板的回调函数\n\n如果你没有使用 HTML5\
  \ `doctype`，利用外部模板将避免 HTML 验证问题。\n\n### 外部与内联\n\n尽管外部模板有其优点，但出于以下原因，将它们保留在页面本身也是一个好主意：\n\
  \n- 包含外部文件意味着额外的 `HTTP` 请求。如果你在页面上经常使用多个模板，对性能的影响可能是巨大的。\n- 标记已经包含在页面中了，模板本质上是更多的标记。在大多数情况下，将模板保留在\
  \ HTML 中是有意义的，因为其他标记也位于那里。\n- 管理起来要简单得多；如你所见，外部模板的 `Ajax` 脚本意味着必须为每个模板导航不同的回调。\n\
  \n### 在模板中使用 JavaScript\n\n除了文本和变量外，你还可以在模板中使用 JavaScript。\n\n#### 基础 If-Then 条件\n\
  \n一个实用的技巧是包含基础条件语句。例如，你可以在模板中判断复选框是否被勾选：\n\n```html\n<input type=\"checkbox\" <%=\
  \ checked ? 'checked' : '' %> />\n```\n\n现在，你可以为 `checked` 变量传递一个 `Boolean` 值；如果它是\
  \ `true`，则在模板编译时复选框会被勾选。此外，如果你担心非常老旧浏览器并使用了 XHTML `doctype`，请确保将你的模板包裹在 `//<![CDATA[\
  \ ... //]]>` 中。然而，在引入模板文本时也需要考虑到这一点。\n\n\n\n从实际上来说，当你处理此类内容时，`each` 循环并不会带来太大区别，因为你可以通过简单的\
  \ `for` 循环来实现相同的功能。然而，当你想要遍历对象中的所有项时（这在原生处理中较难实现），它的优势就真正大显身手了。例如，你可以打印对象中所有的键值对：\n\
  \n```html\n<<ul>\n  <% _.each( myObject, function(value, key) { %>\n    <li><%=\
  \ key %> : <%= value %></li>\n  <% }); %>\n</</ul>\n```\n\n这里唯一的区别是回调函数接受两个参数：值，然后是相关的键。\n\
  \n现在，你可以在编译此模板时传递一个对象：\n\n```javascript\nvar compiled = template({\n  myObject:\
  \ {\n    boolean1: true,\n    boolean2: false,\n    string1: 'Hello',\n    string2:\
  \ 'World'\n  }\n});\n```\n\n当它进行渲染时，所有这些变量都会被打印出来，如图 4-3 所示。\n\n![9781118524565-fg0403.tif](img/9781118524565-fg0403_fmt.png)\n\
  \n图 4-3 此对象中的所有键值对已通过 `_.each()` 循环打印出来。\n\n## 在 Backbone 中使用模板\n\nJavaScript 模板和\
  \ Backbone 是天生一对的，因为没有比使用 JavaScript 模板更好的渲染 Backbone 视图内容的方法了。而且由于 Backbone 已经依赖\
  \ Underscore，因此在你的 Backbone 项目中使用 Underscore 模板不会增加额外的开销。\n\n### 不使用模板设置模型和视图\n\n\
  在开始之前，你需要一个模型和一个视图来工作。基本思路是：先设置一个模型，然后将模型中的数据传递到模板中以渲染视图中的内容。从设置模型开始。为此，我使用了来自第\
  \ 3 章示例中的一个模型：\n\n```javascript\n//为用户创建模型\nvar User = Backbone.Model.extend({});\n\
  var user = new User({\n  username: 'jonraasch',\n  displayName: 'Jon Raasch',\n\
  \  bio: 'Some nerd'\n});\n```\n\n现在，你获取这些内容并将其作为视图渲染在页面上。但在使用模板之前，回顾一下上一章是如何处理它的的：\n\
  \n```javascript\n//创建视图\nvar UserView = Backbone.View.extend({\n  el: '#user-card',\n\
  \  initialize: function() {\n    this.render();\n  },\n  render: function() {\n\
  \    //创建一个指向用户配置的链接作为包装\n    var $card = $('<a href=\"/users/' + this.model.get('username')\
  \ +\n      '\"/>');\n    //添加用户名\n    var $name = $('<h1>' + this.model.get('displayName')\
  \ +\n      '</h1>').appendTo($card);\n    //添加用户简介\n    var $bio = $('<p>' + this.model.get('bio')\
  \ +      '</p>').appendTo($card);\n    //将此元素附加到 DOM\n    this.$el.empty().append($card);\n\
  \    return this;\n  }\n});\n//创建视图的新实例，并将其与用户模型绑定\nvar userView = new UserView({\n\
  \  model: user\n});\n```\n\n这段代码首先将视图与 DOM 元素 `#user-card` 关联。然后，`render` 函数使用模型中的各种属性，并使用\
  \ jQuery 和内联标记将它们添加到 DOM 中。\n\n你可能注意到这些代码是多么凌乱。其中夹杂着许多糟糕的标记，以及为了从模型中获取每个单独数据的多次调用。幸运的是，你可以通过模板大量清理这些代码。\n\
  \n### 使用模板渲染视图\n\n将此视图转换为使用模板渲染并不复杂。第一步是将内联的 jQuery 和标记转换为模板：\n\n```html\n<script\
  \ type=\"text/template\" id=\"user-template\">\n  <a href=\"/users/<%= username\
  \ %>\">\n    <h1><%= displayName %></h1>\n    <p><%= bio %></p>\n  </a>\n</script>\n\
  ```\n\n这段代码看起来已经整洁许多，使用了带有变量插值值的简单标记。下一步是在视图定义处定义模板：\n\n```javascript\nvar UserView\
  \ = Backbone.View.extend({\n  el: '#user-card',\n  template: _.template( $('#user-template').text()\
  \ )\n});\n```\n\n在这里你使用为模板构建的脚本中的文本来定义模板。然后你将该值赋值给视图，以便你可以随时通过 `this.template()`\
  \ 访问它。\n\n现在像以前一样设置 `render` 函数，但这次使用模板渲染内容：\n\n```javascript\nvar UserView = Backbone.View.extend({\n\
  \  el: '#user-card',\n  template: _.template( $('#user-template').text() ),\n  initialize:\
  \ function() {\n    this.render();\n  },\n  render: function() {\n    //使用模型编译模板\n\
  \    var compiled = this.template( this.model.toJSON() );\n    //将编译后的标记附加到 DOM\n\
  \    this.$el.html( compiled );\n    return this;\n  }\n});\n```\n\n这段代码中发生的第一件事是编译模板。要实现这一点，你将模型转换为对象，然后将该对象传递给\
  \ `template` 函数。由于模型的键与早早创建的模板对齐，因此无需修改它（或逐个获取）。然后，你将编译后的代码附加到绑定视图的 DOM 元素中。\n\n\
  最后，为了保险起见，添加一个更改函数，以便在模型更改时重新渲染此视图：\n\n```javascript\nvar UserView = Backbone.View.extend({\n\
  \  el: '#user-card',\n  template: _.template( $('#user-template').text() ),\n  initialize:\
  \ function() {\n    //当模型更改时重新渲染视图\n    this.model.on('change', this.render, this);\n\
  \    this.render();\n  },\n  render: function() {\n    //使用模型编译模板\n    var compiled\
  \ = this.template( this.model.toJSON() );\n    //将编译后的标记附加到 DOM\n    this.$el.html(\
  \ compiled );\n    return this;\n  }\n});\n```\n\n现在，当模型变化时，视图将会更新。因为模板文本已缓存在视图中，JavaScript\
  \ 引擎不需要在每次模型变化时重新进行查找，这提高了性能。但在你渲染渲染之前，它无法编译，因为你必须考虑更改的模型。最后，这里是完整的代码：\n\n```html\n\
  <script type=\"text/template\" id=\"user-template\">\n  <a href=\"/users/<%= username\
  \ %>\">\n    <h1><%= displayName %></h1>\n    <p><%= bio %></p>\n  </a>\n</script>\n\
  \n<script type=\"text/javascript\">\n//为用户创建模型\nvar User = Backbone.Model.extend({});\n\
  var user = new User({\n  username: 'jonraasch',\n  displayName: 'Jon Raasch',\n\
  \  bio: 'Some nerd'\n});\n//创建视图\nvar UserView = Backbone.View.extend({\n  el: '#user-card',\n\
  \  template: _.template( $('#user-template').text() ),\n  initialize: function()\
  \ {\n    //当模型更改时重新渲染视图\n    this.model.on('change', this.render, this);\n    this.render();\n\
  \  },\n  render: function() {\n    //使用模型编译模板\n    var compiled = this.template(\
  \ this.model.toJSON() );\n    //将编译后的标记附加到 DOM\n    this.$el.html( compiled );\n\
  \    return this;\n  }\n});\n//创建视图的新实例，并将其与用户模型绑定\nvar userView = new UserView({\n\
  \  model: user\n});\n</script>\n```\n\n如你所见，与没有模板相比，代码要整洁和组织得多。\n\n## 总结\n\n模板消除了面条代码，并允许你在无需在\
  \ JavaScript 中嵌入标记的情况下构建长标记字符串。它们使代码库更加干净并简化了开发流程。\n\n在本章中，你学习了如何使用 Underscore 模板根据\
  \ JavaScript 变量来生成标记。这样，你的标记仍然可以由 JavaScript 驱动，而无需实际上与 JavaScript 混在一起。\n\n最后，你了解了如何在模板中使用循环，以及如何在\
  \ Backbone 中使用它们来渲染视图。\n\n\n\n\n在接下来的章节中，你将扩展对模板的使用，并将其与其他多种 JavaScript 技术结合。现在你已经理解了\
  \ Backbone 和模板，你拥有了构成应用程序其余部分基础的两大支柱。是时候深入学习并尽情享受了！\n\n## 额外资源\n\n## 模板库\n\n- Underscore:\
  \ [`http://underscorejs.org`](http://underscorejs.org)\n- Handlebars: [`http://handlebarsjs.com`](http://handlebarsjs.com/)\n\
  - Transparency: [`http://leonidas.github.com/transparency`](http://leonidas.github.com/transparency)\n\
  - 微模板化: [`http://ejohn.org/blog/javascript-micro-templating`](http://ejohn.org/blog/javascript-micro-templating/)\n\
  \n## 如何选择模板库\n- 模板选择器: [`http://garann.github.com/template-chooser`](http://garann.github.com/template-chooser/)\n\
  - 模板性能对比: [`http://jsperf.com/dom-vs-innerhtml-based-templating/365`](http://jsperf.com/dom-vs-innerhtml-based-templating/365)\n\
  \n## 无逻辑模板的优缺点\n- 客户端模板大对决: [`http://engineering.linkedin.com/frontend/client-side-templating-throwdown-mustache-handlebars-dustjs-and-more`](http://engineering.linkedin.com/frontend/client-side-templating-throwdown-mustache-handlebars-dustjs-and-more)\n\
  - 反对无逻辑模板的理由: [`http://www.ebaytechblog.com/2012/10/01/the-case-against-logic-less-templates/`](http://www.ebaytechblog.com/2012/10/01/the-case-against-logic-less-templates/)\n\
  \n## Backbone 中的模板\n- Backbone 视图模式: [`http://ricostacruz.com/backbone-patterns/#view_patterns`](http://ricostacruz.com/backbone-patterns/#view_patterns)\n\
  - Backbone.js 经验总结与改进示例应用: [`http://coenraets.org/blog/2012/01/backbone-js-lessons-learned-and-improved-sample-app/`](http://coenraets.org/blog/2012/01/backbone-js-lessons-learned-and-improved-sample-app/)\n\
  \n# 第 5 章\n\n## 创建表单\n\n表单是大多数应用程序和网站中不可或缺的一部分。近年来，表单在 HTML5 中已经进步到可以在不使用任何 JavaScript\
  \ 的情况下提供非常丰富的功能。当然，并不是所有浏览器都支持这些高级功能，因此你通常需要提供 JavaScript 备选方案。幸运的是，有很多第三方 polyfill（垫性方案）可以使用，来自动备份\
  \ HTML5 表单功能。\n\n在本章中，你将学习如何在表单中使用渐进式增强方法。你从一个适用于所有浏览器的稳健基础状态开始，然后在其之上 JavaScript\
  \ 特性。接着，你将发现各种 HTML5 表单功能，例如特殊的输入类型、组件和验证。接下来，你将学习如何使用 polyfills 在不支持这些特性的旧浏览器中支持它们。你还将读到一些关于通过\
  \ Ajax 提交表单的技巧。最后，你将发现如何将表单与 Backbone 连接，自动生成视图并使用 Backbone 的同步功能提交表单数据。\n\n###\
  \ 理解渐进式增强\n\n本章的通用方法是渐进式增强，这被广泛认为是使用 JavaScript 处理表单（以及几乎任何你可能用 JS 增强的其他内容）的最佳实践。这种方法从一个适用于所有浏览器的局限基础开始，然后在可以在支持的任何地方通过额外功能逐步增强该基础状态。这是最理想的，因为它在不同浏览器和环境之间提供了广泛的兼容性，同时在尽可能可能的地方提供了更丰富的功能。\n\
  \n### 渐进式增强方法\n\n表单的基本渐进式增强方法如下：\n\n1. 使用标准的 HTML5 表单标记为你的表单打下稳健的基础。\n2. 利用 JavaScript\
  \ 利用标记中的 HTML5 属性来确定你想对每个表单元素执行的操作。\n3. 在这些元素之上添加脚本层，通过日期选择器和其他组件将表单组件化，并提供如占位符文本、Ajax\
  \ 提交等增强功能。\n\n### 为什么要用渐进式增强？\n\n渐进式增强的逻辑在于它首先提供了一个在你支持的所有浏览器中通用的可用基础状态。这一概念在涉及表单时尤为重要，因为这些组件对于网站的整体目标至关重要。例如，你可能觉得首页介绍视频或动画没有加载是可以接受的，但如果用户无法提交订单表单是可以接受的吗？或者甚至无法登录？由于由于原因，你的表单在你想要支持的所有浏览器和环境中在某种程度上正常工作是至关重要的。此外，它们仍然需要让视障人士和其他残障人士的辅助设备访问。\n\
  \n此外，为你的用户提供尽可能好的体验至关重要。随着 Web 开发的发展，用户已经开始期待流畅的体验，而 JavaScript 表单增强是其中的很大一部分。\n\
  \n渐进式增强兼顾了这两者：为所有用户提供基本支持，并在支持支持的地方提供更丰富的功能。\n\n### 决定支持哪些环境\n\n你可能已经意识到，你的表单需要在旧版本的\
  \ IE 以及不支持 HTML5 的其他浏览器中工作。但即使用户禁用了 JavaScript，它们也需要工作。是的，你的网站应该在没有任何 JavaScript\
  \ 的情况下也能运行（至少运行一点）。\n\n即使你不担心那些禁用了 JavaScript 的用户，也要记住，当 JavaScript 崩溃时，它通常会停止页面上的所有其他脚本。因此，完全依赖\
  \ JavaScript 的网站可能是脆弱的。给自己留一些退路要好得多，这样一个小 bug 就不会禁用页面上的其他功能。\n\n此外，如果你的 JavaScript\
  \ 加载缓慢，用户不必等待它。他们可以在 JavaScript 加载时开始输入表单数据。正如 Jake Archibald 所说，“每个人在下载你的 JavaScript\
  \ 时都禁用了他们的 JavaScript。”\n\n本章演示了如何使用 HTML5 表单元素，但这些元素在不支持的浏览器中都会回退到基础表单元素。然后，我将向你展示如何在表单之上添加\
  \ JavaScript 层，使用户能够在没有 JavaScript 的情况下使用表单。尽管你最终通过 Ajax 提交表单，用户仍然能够以传统方式提交表单。\n\
  \n## 让 HTML5 为你工作\n\n\n\n\n\n你的表单基础将构建在 HTML5 之上，它提供的元素具有出乎意料的丰富交互性，且完全不需要 JavaScript。事实上，HTML5\
  \ 元素提供的体验比你用 JavaScript 实现的更好。它们速度快、无错误且易于实现。即使页面上其他地方脚本崩溃，它们仍然可以工作。综合考虑考虑，你应该尽可能使用浏览器的原生功能。没必要重新发明轮子是毫无意义的。\n\
  \n然而，请记住，这些元素仅在现代浏览器中有效。如果你希望在所有地方都提供这些更丰富的功能，则需要使用 JavaScript 提供回退方案（fallback）。尽管如此，大多数\
  \ HTML5 表单功能在任何浏览器中都能以基本水平运行。旧版浏览器无法理解 HTML5 元素和属性，因此它们会退化为基础文本输入，没有任何花哨。这意味着无论如何，即使你的用户使用的是旧版浏览器且\
  \ JavaScript 没有加载，他们仍然能够使用你的表单。\n\n## HTML5 输入类型\n\n在 HTML5 之前，输入类型非常基础：\n\n- 用于纯文本的\
  \ `text` 输入\n- 用于隐藏输入内容的 `password` 输入\n- 用于特定类型数据的 `checkbox` 和 `radio` 输入\n- 用于上传文件到服务器的\
  \ `file` 输入\n- 以及其他几个如 `hidden` 和 `submit`\n\n尽管这些确实有用，但与 HTML5 引入的功能相比显得相形见��。HTML5\
  \ 输入类型包含了各种实用的组件，如滑块、日期选择器和颜色选择器。此外，在移动设备上，许多 HTML5 输入类型提供了特殊的键盘，使数据输入更加容易。\n\n\
  ## 组件\n\n尽管 HTML5 规范概述了许多不同的表单组件，但浏览器的支持仍然有些不稳定。然而，每当表单组件不受支持时，它将简单地退回到标准文本输入。\n\
  \n在编写本文时，Firefox 和 IE 的 HTML5 表单组件支持都很差。\n\n### 滑块\n\n滑块是最支持最广泛的表单组件之一，在所有主流浏览器的最新版本中均可用。要调用滑块，请使用以下标记：\n\
  \n```html\n<input type=\"range\">\n```\n\n此标记创建一个滑块组件，你可以用它来控制数值，如图 5-1 所示。\n\n\
  ![9781118524565-fg0501.tif](img/9781118524565-fg0501_fmt.png)\n\n图 5-1 滑块组件为数字提供了直观的控制。这是它在\
  \ Chrome 中的外观。\n\n你也可以在 WebKit 浏览器中更改滑块的样式。欲更多更多，请访问 `http://css-tricks.com/value-bubbles-for-range-inputs/`。\n\
  \n你还可以控制滑块的某些方面：\n\n```html\n<input type=\"range\" min=\"0\" max=\"100\" step=\"\
  5\" value=\"30\">\n```\n\n属性如下：\n\n- `min` 是滑块的最小值（左侧）。\n- `max` 是最大值（右侧）。\n- `step`\
  \ 控制滑块每刻度调整数值的（默认为 `1`）。\n- `value` 是滑块的默认起始位置（默认为 `min` 和 `max` 之间的中间）。\n\n至少，你需要为滑块设置\
  \ `min` 和 `max`，为数值提供合理的边界。\n\n虽然滑块很有用，但它并没有向用户传递太多信息。如果你将其用于“感觉”类型的值，那是没问题的——例如，“你对这个问题的感受有多强烈。”但如果你想向用户传递实际数字，你需要通过\
  \ JavaScript 来捕获它。首先，设置一些基础标记：\n\n```html\n<input type=\"range\">\n<span class=\"\
  range-value\"></span>\n```\n\n接下来，你可以使用 jQuery 的 `change()` 处理程序挂钩范围范围值的任何变化：\n\n\
  ```javascript\n$('input[type=\"range\"]').change(function(e) {\n  var $this = $(this);\n\
  \  $this.siblings('.range-value').text($this.val());\n});\n```\n\n这里，一个属性选择器首先找到所有的范围输入。然后，每当这些输入发生变化时，就会找到兄弟元素\
  \ `.range-value` <span>，并将该 <span> 的文本设置为与范围输入的值匹配。如图 5-2 所示，这段代码段在滑块旁边显示数值。\n\n\
  ![9781118524565-fg0502.tif](img/9781118524565-fg0502_fmt.png)\n\n图 5-2 此范围滑块的值通过\
  \ JavaScript 显示。\n\n此脚本运行得很好，但你还需要在页面加载时显示范围的初始值。为了实现这一点，将其提取到一个函数并在两种情况下调用它：\n\n\
  ```javascript\n$.fn.displaySliderVal = function() {\n  this.siblings('.range-value').text(\
  \ this.val() );\n  return this;\n};\n\n$('input[type=\"range\"]').change(function(e)\
  \ {\n  $(this).displaySliderVal();\n}).displaySliderVal();\n```\n\n在这里，做了几处更改：\n\
  \n1. 脚本定义了 `displaySliderVal()`，这是 jQuery 原型上的方法，通过返回 jQuery 对象允许链式调用。\n2. 在更改处理程序中对\
  \ `$(this)` 调用了 `displaySliderVal()`。\n3. 也对 `$('input[type=\"range\"]')` 的初始引用调用了\
  \ `displaySliderVal()`，因此它显示默认值。\n\n你也可以使用 `<input type=\"number\">` 为数字使用选择器。\n\
  \n### 日期选择器\n\n另一个实用的组件是日期选择器，你可以通过以下标记调用它：\n\n```html\n<input type=\"date\">\n\
  ```\n\n这在某些浏览器中创建一个日期选择器，如图 5-3 所示。\n\n![9781118524565-fg0503.tif](img/9781118524565-fg0503_fmt.png)\n\
  \n图 5-3 Chrome 中的日期选择器。\n\n#### 日期输入问题的历史\n\n尽管可能是使用最广泛的表单组件，但日期选择器有一段相当糟糕的历史。在几年里，Safari\
  \ 和 Chrome 都以一种糟糕的方式支持日期选择器。它们没有使用方便的日历组件，而是使用了基础的选择框，包含所有可能的日期。\n\n由于用户必须滚动过无尽的日期来找到他们想要的，导致了糟糕的用户体验。这对于\
  \ `datetime` 尤为糟糕，它滑稽地让用户滚动每一天的每一分钟。\n\n主要问题不仅是糟糕的用户体验。它也很难用 JavaScript 组件进行覆盖，因为浏览器支持该日期输入，尽管这几乎不能称得上合格的支持。结果是，JavaScript\
  \ 无法使用特性检测来替换这些组件，而是必须依赖浏览器嗅探（browser sniffing，这是一种臭名昭著的做法）。幸运的是，情况不再如此。Chrome 使用了日历选择器，而\
  \ Safari 回到了基础文本输入（这本应该是所有 WebKit 浏览器处理此的方式）。\n\n然而，请记住，日历选择器并不总是提供最好的用户体验。它对于接近当前日期（或任意起始点）的日期非常有用。但因为很难切换年份，日历选择器对于出生日期不是一个好主意。你可以在图\
  \ 5-4 中看到这个问题。\n\n![9781118524565-fg0504.tif](img/9781118524565-fg0504_fmt.png)\n\
  \n图 5-4 在日期选择器中切换年份是一件麻烦。用户仍然可以手动输入任何日期，但可能会被组件中的可用性问题所困扰。\n\n因此，对于出生日期和其他超过一两年的日期，使用\
  \ `<input type=\"date\">`、`<input type=\"month\">` 和 `<input type=\"year\">` 的组合是更好的主意。或者使用能够更优雅地处理该问题的\
  \ JavaScript 组件。\n\n### 颜色选择器\n\n尽管大多数表单不需要颜色选择器，但在适当的情况下它可以派上用场。你可以通过以下标记调用它：\n\
  \n```html\n<input type=\"color\">\n```\n\n浏览器对颜色选择器的支持很差，但 Chrome 和 Opera 的当前版本都支持它，如图\
  \ 5-5 所示。\n\n\n\n\n\n![9781118524565-fg0505.tif](img/9781118524565-fg0505_fmt.png)\n\
  \n图 5-5 Chrome（左）和 Opera（右）中的颜色选择器。它们在视觉视觉上有所不同。Chrome 版本更适合精粒度控制，而 Opera 版本在大多数情况下更容易使用。\n\
  \n颜色选择器返回一个十六进制值——例如 `#ff7f24`。你使用与 `range` 输入框相同的属性选择器来访问此值：\n\n```\n$('input[type=\"\
  color\"]').val();\n```\n\n除了这里描述的控件外，还有一个搜索输入框。它的功能并不特别有趣，但在某些时候有用。\n\n## 上下文键盘\n\
  \n某些 HTML5 输入类型在手机和平板等移动设备上也具有特殊含义。它们会显示专用键盘，让使用户更容易输入特定数据。\n\n如今大多数智能手机和平板都使用软件键盘，即每当需要时在触摸屏幕上显示键盘，如图\
  \ 5-6 所示。\n\n![9781118524565-fg0506.tif](img/9781118524565-fg0506_fmt.png)\n\n图\
  \ 5-6 iPhone 上的标准键盘。\n\n然而，使用这些键盘可能会有些麻烦，特别是在手机上。\n\n幸运的是，某些 HTML5 输入类型会触发特殊键盘，使输入数据变得简单得多。例如，以下标记将显示类似于图\
  \ 5-7 所示的电话号码拨号盘。\n\n```\n<input type=\"tel\">\n```\n\n![9781118524565-fg0507.tif](img/9781118524565-fg0507_fmt.png)\n\
  \n图 5-7 此数字键盘在 iOS 中为 `<input type=\"tel”>` 显示。\n\n其他输入类型添加了有助于特定情况的特殊键——例如 `<input\
  \ type=”email”>` 和 `<input type=”url”>`——它们如图 5-8 所示。\n\n![9781118524565-fg0508.tif](img/9781118524565-fg0508_fmt.png)\n\
  \n图 5-8 iPhone 上的 `email` 输入（左）和 `URL` 输入（右）。\n\n另一个有用的输入类型是 `<input type=”number”>`，其结果可以在图\
  \ 5-9 中看到。\n\n这些输入类型对于语义化表单验证也有重要的含义。你将在下一节中学习更多。\n\n![9781118524565-fg0509.tif](img/9781118524565-fg0509_fmt.png)\n\
  \n图 5-9 数字输入会在 iOS 中调出数字键盘，因此用户无需手动切换。\n\n## 交互功能\n\n除了新的输入类型外，HTML5 还引入了许多交互式功能，如占位符文本和验证。这意味着以前可以通过\
  \ JavaScript 支持的各种功能，现在有了原生支持。\n\n### 占位符文本\n\n占位符文本在用户输入值之前显示在表单元素中。它通常用于提供关于字段中应输入什么内容的简短提示——例如日期的格式。\n\
  \n通过 HTML5，你可以使用 `placeholder` 属性在表单中显示占位符文本：\n\n```\n<input type=\"email\" placeholder=\"\
  john@example.com\">\n```\n\n在浏览器中，此占位符显示为较浅的文本，会被用户输入的任何值所取代。参见图 5-10。\n\n![9781118524565-fg0510.tif](img/9781118524565-fg0510_fmt.png)\n\
  \n图 5-10 此占位符文本提供了增强用户体验的视觉提示。\n\n占位符文本是提供快速视觉提示和加速表单输入的极佳方法。记住，用户在你的表单中输入数据的速度越快，他们越可能“转化”为另一笔销售或注册。从这些数据中可以看出，表单的清晰度越高，转化率就越高：[`http://www.lukew.com/ff/entry.asp?1416`](http://www.lukew.com/ff/entry.asp?1416)。\n\
  \n你还可以使用以下代码针对各种浏览器对占位符文本进行样式设置：\n\n```\ninput::-webkit-input-placeholder {color:green}\n\
  input::-moz-placeholder {color:green}\ninput:-ms-placeholder {color: green}\n```\n\
  \n注意你不能组合这些选择器——浏览器将忽略整个代码块。\n\n### 自动聚焦\n\n`autofocus` 是加速表单输入的另一种方法。它在页面加载时将光标带入特定字段，使用户可以直接开始输入，而无需点击或通过\
  \ Tab 键进入表单。要在你的 HTML5 表单中使用自动聚焦，只需向任何元素添加 `autofocus` 属性即可：\n\n```\n<input type=\"\
  text\" autofocus>\n```\n\n此属性在页面加载时将光标带入此字段。\n\n除了不需要任何额外代码外，原生 HTML5 自动聚焦比 JavaScript\
  \ 替代方案好得多，因为 JavaScript 脚本有时需要加载时间。在延迟期间，用户可能开始在另一个字段中输入。然而，一旦 `focus()` 函数执行，它会将用户的光标夺到自动聚焦的字段中——导致非常糟糕的用户体验。\n\
  \n## 验证\n\n原生表单验证可能是我对 HTML5 表单中最喜欢的新功能。它允许你跳过整个 JavaScript 验证过程，让浏览器为你工作。\n\n###\
  \ 基础表单验证\n\n最好的是，如果你使用 HTML5 输入类型，你已经完成了 90%，因为 HTML5 表单会根据输入类型进行验证。例如，如果你有 `<input\
  \ type=”email”>`，HTML5 会确保在用户提交表单时，它是一个格式正确的的电子邮件地址，如你在图 5-11 所示。\n\n![9781118524565-fg0511.tif](img/9781118524565-fg0511_fmt.png)\n\
  \n图 5-11 如果电子邮件地址格式错误，HTML5 会显示错误消息。\n\n它还考虑了任何范围——例如：\n\n```\n<input type=\"number\"\
  \ min=\"0\" max=\"500\">\n```\n\n如果数字超出设定范围，就会报错。\n\n此外，你可以通过添加 `required` 属性使任何字段变为必填：\n\
  \n```\n<input type=\"text\" required>\n```\n\n如果用户未填写，此字段将报错，如你在图 5-12 所示。\n\n![9781118524565-fg0512.tif](img/9781118524565-fg0512_fmt.png)\n\
  \n图 5-12 如果用户未填写，就会报错。\n\n出于安全考虑，请始终在服务器端进行验证。黑客可以使用旧浏览器并禁用 JavaScript 来绕过你可能实施的前端验证。\n\
  \n### 自定义验证规则\n\n你也可以为未涵盖的字段创建自定义验证规则。要这样做，只需向 `pattern` 属性添加正则表达式即可：\n\n```\n<input\
  \ type=\"text\" pattern=\"[a-zA-Z]+\">\n```\n\n在此示例中，用户输入的任何内容将通过正则表达式 `[a-zA-Z]+`\
  \ 的检查，该表达式只接受字母（无数字、空格或特殊字符）。\n\n创建自定义规则的唯一缺点是浏览器会显示如图 5-13 所示的通用错误消息。\n\n![9781118524565-fg0513.tif](img/9781118524565-fg0513_fmt.png)\n\
  \n图 5-13 如果用户输入不符合模式属性，将显示此通用验证错误。\n\n幸运的是，你可以使用 JavaScript 添加自己的自定义验证消息。只需将其添加到\
  \ `oninvalid` 监听器中：\n\n```\n<input type=\"text\" pattern=\"[a-zA-Z]+\" oninvalid=\"\
  setCustomValidity('You may only enter letters.');\">\n```\n\n在这里，使用了原生 `setCustomValidity()`\
  \ 方法来显示自定义消息，如图 5-14 所示。\n\n![9781118524565-fg0514.tif](img/9781118524565-fg0514_fmt.png)\n\
  \n图 5-14 此自定义验证消息通过 JavaScript 显示。\n\n\n\n\n\n虽然这种自定义验证消息比通用消息更有用，但仍有一些需要考虑的注意事项：\n\
  \n-   原生的验证消息会根据用户的语言进行本地化，而你可能并不计划将你的消息翻译成成百种不同的语言。\n-   无论错误原因是什么，此验证消息都会显示。例如，当用户输入的文本超过了\
  \ `maxlength` 或未填写 `required` 字段时，它也会显示。\n\n出于这些原因，除非你对默认文本非常不满意，否则最好避免覆盖 `email`、`url`\
  \ 和 `number` 的默认消息。此外，如果你在一个字段上使用了多个验证规则，请构建一个检查机制，以确定具体是哪个原因触发了错误。\n\n如果你的网站只提供英文版，你可能不在意本地化错误消息。但请记住，如果你对某些字段使用自定义消息而对其他字段使用默认消息，可能会出现多种语言的验证错误消息。\n\
  \n## 为旧版浏览器使用 Polyfills（垫片）\n\n尽管现代浏览器对 HTML5 表单的支持已经非常好，但遗憾的现实是，你的很多用户可能还没有更新。即使他们更新了，取决于他们使用的浏览器，某些功能的支持也并不稳定。因此，你需要用\
  \ JavaScript 为这些组件构建备用方案。\n\n### 寻找第三方 Polyfills\n\n幸运的是，你并不是唯一遇到这个问题的人，市上有许多全面的选项。最棒的是，这些开源产品几乎可以开箱即用提供大部分功能。\n\
  \nPolyfills 是一种垫片（shims），为旧版浏览器中不可用的新功能提供备用方案。通常情况下，polyfills 使用 JavaScript 在原生功能缺失的地方重新创建原生功能。但它们并不非要使用\
  \ JavaScript——例如，HTML5 视频的 polyfills 使用了 Flash。\n\nModernizr 团队在 `https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-Browser-Polyfills`\
  \ 维护了一份各种 polyfills 的优秀列表。\n\n该列表上的所有 polyfills 都是不错的，你应该能够找到适用于你所需的任何 HTML5 表单功能的\
  \ polyfill。当然，如果你找不到完美的 polyfill，你也可以自己编写自己的。\n\n### 编写你自己的 Polyfills\n\n虽然你可以下载几乎支持任何你需要支持的表单功能的\
  \ polyfill，但我想通过一些快速示例带你了解如何自己构建它们。结果，你将理解你所下载的任何内容内部发生了什么，并且如果你对第三方选项不满意，将能够自定义现有的\
  \ polyfill 或编写自己的。\n\n在构建 polyfills 时，请记住在不支持你正尝试实现的浏览器中进行测试。否则，即使你的脚本有 bug，你也会认为代码写得非常完美。\n\
  \n#### 通用方法\n\n通常情况下，为 HTML5 提供备用方案的最佳方法是利用你已经编写的标记。这意味着你应该挂钩不同的表单元素，并根据它们的属性创建功能，就像\
  \ HTML5 在支持的浏览器中所做的那样。\n\n例如，你可能有这样一个 `range` 输入框：\n\n```html\n<input type=\"range\"\
  \ min=\"0\" max=\"100\" value=\"30\">\n```\n\n最佳方法是首先利用属性选择器来决定何时显示 JavaScript 滑块组件：\n\
  \n```javascript\n$('input[type=\"range\"]');\n```\n\n然后使用各种属性来为你的 JavaScript 滑块设置选项，使用\
  \ `min` 和 `max` 设置上下限，使用 `value` 设置初始值。\n\n因为这种方法提供了最松的耦合，采用这种方法对于 polyfills 来说始终是最好的。另一种替代方案是在\
  \ JavaScript 中硬编码特定值，这意味着你需要在两个输入这些数据，这使得开发更加复杂，更重要的是更难维护。最糟糕的部分是，你必须记得做出这些更改，即使你在你的主流\
  \ HTML5 浏览器中不会看到任何问题。\n\n#### 编写一个 Autofocus Polyfill\n\nAutofocus 是最容易编写的 polyfill\
  \ 之一，因为找到带有 `autofocus` 属性的元素并对其设置 `focus()` 之外没多少额外要做的。例如，你可以在 jQuery 中实现这一点：\n\
  \n```javascript\n$('[autofocus]').focus();\n```\n\n此脚本使用属性选择器找到任何设置了 `autofocus`\
  \ 属性的元素，例如 `<input type=”text” autofocus>`。然后它使用 `focus()` 方法将光标焦点调用到该元素。\n\n实现\
  \ Polyfill\n\n现在，你需要确定何时使用该 polyfill。请注意，由于你的 polyfills 永远不会像原生支持那样好，在功能被原生支持的情况下，请避免实现它们。\n\
  \n在这个示例中，JavaScript 备用方案可能会导致可用性问题——例如，如果用户在 JavaScript 加载完成之前在另一个表单字段中输入。一旦 polyfill\
  \ 开始生效，它会劫持用户的输入光标并将其放在不同的字段中，而这个问题在 `autofocus` 的原生实现中是不存在的。\n\n因此，仅在不支持 autofocus\
  \ 时才实现 polyfill。但不要去查询哪些浏览器支持 `autofocus` 哪些不支持。浏览器嗅探（Browser-sniffing）是一种糟糕的做法，除非绝对必要，否则应该避免。相反，使用功能检测（feature-checking）并使用\
  \ JavaScript 确定是否支持 `autofocus`。你可以使用 Modernizr，它可以在 `http://modernizr.com` 获取。\n\
  \n包含 Modernizr 后，你可以为 autofocus 构建一个检查：\n\n```javascript\nif ( ! Modernizr.input.autofocus\
  \ ) {\n    $('[autofocus]').focus();\n}\n```\n\n此脚本使用 Modernizr API 来判断是否支持 autofocus。然后它在不支持的浏览器中调用\
  \ polyfill。\n\n如果 polyfill 脚本真的很大，考虑在此功能检查中从外部加载它。这样一来，现代浏览器就不会被大量它们不会使用的代码拖累。在这种情况下，考虑使用如\
  \ `require.js` 的 JavaScript 加载器来加载脚本。\n\n## 改进你的 Polyfill\n\n尽管这在基础层面上有效，但在创建 polyfills\
  \ 时要特别注意，因为你希望 polyfill 在任何情况下都能匹配原生功能。采取严谨的方法可以确保你的 polyfill 不会给你任何惊喜。记住，你主要在支持\
  \ HTML5 的浏览器中工作，所以你并不一定能发现你的 polyfill 中存在潜在问题。\n\n编写健壮 polyfill 的步骤如下：\n\n1. 确定可能导致问题的边缘情况行为。\n\
  2. 查看原生支持该功能的浏览器中是如何处理该情况的。\n3. 在你的 polyfill 中镜像原生行为。\n4. 创建单元测试以确保 polyfill 能够妥善处理所有情况。\n\
  \n例如，一个页面上可能不应该有超过一个带有 `autofocus` 的元素，但如果真的有了会怎样？在 Chrome 或其他现代浏览器中设置一个测试页面，你会发现光标焦点将带入页面上最后一个带有\
  \ `autofocus` 的元素。\n\n这在你编写的 autofocus polyfill 中并不一定是个问题，因为 jQuery 会遍历所有匹配的元素，将焦点带入每个元素。由于它随着循环中的每个新元素更改焦点，焦点最终落在最后一个带有\
  \ `autofocus` 的元素上。当然，这种方法在性能上略差，但可能不值得优化这种边缘情况。然而，如果你还为每个元素设置了焦点事件监听器会怎样？那时该处理程序将触发两次而不是一次。幸运的是，你可以使用\
  \ `:last` 选择类轻松地修复它：\n\n```javascript\n$('[autofocus]').filter(':last').focus();\n\
  ```\n\n\n\n\n\n在这里，使用了 jQuery 的 `filter()` 方法来寻找带有 `autofocus` 的最后一个元素。你也可以在主选择器中附加\
  \ `:last`，但从性能考虑，`filter()` 更好（适用于所有情况，而不仅仅是边缘情况）。\n\n但等一下。为什么不在原生支持 `autofocus`\
  \ 的浏览器中测试聚焦事件（focus events）呢？你会发现它们实际上根本不会触发。\n\n你觉得头晕了吗？我并不是在这里折磨你；我只是想让你看到编写一个真正健壮的\
  \ polyfill（填充方案）有多困难，即使是像 `autofocus` 这样简单的功能。我希望这次练习能让你对下载的第三方 polyfill 有更多的尊重，如果你在使用其中任何一个遇到问题，可以使用这些步骤来修复它。\n\
  \n我还可以继续下去：带有 `tabindex` 的元素是如何影响顺序的？\n\n# 编写一个占位符 polyfill\n\n为占位符文本（placeholder\
  \ text）编写 polyfill 比为 `autofocus` 稍微复杂一点，但它仍然你可以实现的 HTML5 表单功能中较容易的一个。\n\n## 检测支持情况\n\
  \n编写这个 polyfill 第一步是确定你是否真的需要它。为了这一点，你可以再次求助于 Modernizr：\n\n```javascript\nif (\
  \ ! Modernizr.input.placeholder ) {\n    jsPlaceholder();\n}\n```\n\n这段代码使用 `Modernizr.input.placeholder`\
  \ 来检测对占位符的支持。如果不支持，则会调用 `jsPlaceholder()` 函数。\n\n## 确定目标\n\n在你深入开始构建这个 polyfill\
  \ 之前，先思考它应该做什么：\n\n1. polyfill 应该从 `placeholder` 属性中获取文本并将其放入输入字段中。\n2. 当用户点击字段时，polyfill\
  \ 应该移除该文本，以便他们添加自己的内容。\n3. 那么，如果用户点击字段外部但没有添加文本，polyfill 应该再次添加占位符文本。\n4. 如果用户添加了文本，polyfill\
  \ 不应该执行上述任何操作。你不希望占位符文本覆盖掉已经填充的字段。此外，你也不希望在用户修改了字段时清空该字段的文本——用户应该能够重新访问他们已经更改过的字段，而字段不会被清空。\n\
  5. 每当占位符处于状态时，polyfill 应该附加一个占位符类名（classname）。这样，占位符文本就可以进行与普通文本不同的样式处理。\n\n## 构建基础\
  \ polyfill\n\n现在你已经确定了目标，就可以开始编写 polyfill 了。首先，获取任何带有 `placeholder` 属性的表单字段；然后附加\
  \ blur 和 focus 事件来添加和移除占位符文本：\n\n```javascript\nvar jsPlaceholder = function() {\n\
  \  // 当字段获得焦点时\n  $('[placeholder]').focus(function() {\n    var $input = $(this);\n\
  \    //  判断字段是否正在显示占位符文本\n    if ($input.val() === $input.attr('placeholder')) {\n\
  \      // 清空字段并移除占位符类\n      $input.val('');\n      if ( $input.hasClass('placeholder')\
  \ ) {\n        $input.removeClass('placeholder');\n      }\n    }\n  // 当字段失去焦点时\n\
  \  }).blur(function(){\n    var $input = $(this);\n    // 如果用户没有输入任何文本，则替换占位符\n\
  \    if ($input.val() === '' || $input.val() === $input.attr('placeholder')) {\n\
  \      // 添加占位符文本和类\n      $input.val($input.attr('placeholder'));\n      $input.addClass('placeholder');\n\
  \    }\n  // 触发 blur 事件以便在页面加载时添加占位符文本\n  }).trigger('blur');\n};\n```\n\n现在，让我们逐步过一遍代码：\n\
  \n1. polyfill 开始时选择任何带有 `placeholder` 属性的表单字段。\n2. 它为用户点击字段的情况设置了 `focus()` 事件。如果字段中的文本与占位符匹配，它将连同占位符类名一起被移除。\n\
  3. 它为用户点击字段外部的情况设置了 `blur()` 事件。在这里，如果用户没有输入文本，它添加占位符文本以及类名。\n4. 它触发 `blur()` 事件，以便在页面加载时添加占位符文本（但仅当字段未填充时）。\n\
  \n这个脚本中最令人困惑的部分可能是第 4 步。并不是在页面加载时显式地添加占位符文本，而是触发了 polyfill 处理过的 blur 事件。这样，你就不需要重复那些代码了。\n\
  \n值得注意的是，这个示例并没有完全遵循 W3C 的占位符实现规范。在原生实现中，输入的内容在聚焦时并不会被移除，而是在用户开始在字段中输入时才被移除。作为一个练习，请修改脚本以更准确地遵循规范。\n\
  \n## 提交表单\n\n现在，你可以看到占位符文本在你的表单字段中添加和移除，就像在支持它的浏览器中一样。然而，仍然有一些你需要考虑的事情。主要是 polyfill\
  \ 将表单元素的值替换为了占位符文本，这在提交表单时可能会导致问题，因为这些值将像用户输入的一样被传递。为了解决这个问题，请拦截页面上所有表单的提交事件（submit\
  \ event）：\n\n```javascript\n// 在表单提交时必须移除占位符，以免它们被提交\n$('form').submit(function()\
  \ {\n  $(this).find('[placeholder]').each(function() {\n    var $input = $(this);\n\
  \    // 如果字段正在显示占位符，则清空字段\n    if ($input.val() === $input.attr('placeholder'))\
  \ {\n      $input.val('');\n    }\n  })\n});\n```\n\n这个示例清空了任何显示占位符的字段的值。\n\n现在，脚本的运行方式已经非常接近你的需求了。唯一的问题出现在你有密码输入（password\
  \ inputs）时。密码输入会隐藏其值，显示为 `*******`。虽然这对密码是好事，但对于占位符文本来说没用。\n\n遗憾的是，解决这个问题相当棘手。你需要创建一个文本输入框来显示占位符，并将其切换为密码框。为了确保用户的密码不会显示在屏幕上，你需要在占位符非激活状态时切换回密码框。\n\
  \n为了实现这一更改，你需要修改你的 blur 处理函数：\n\n\n\n\n\n此失去处理器（blur handler）首先检测该字段是否为密码输入框。然后填充脚本（polyfill）会克隆该输入框——结果是输入框将保留应用于原始框的所有类名、样式等。你必须将克隆的输入框改为普通文本输入框，并添加占位符文本和类名，以及用于稍后操作的克隆类名。完成后，你可以将新字段添加到\
  \ DOM 中并隐藏旧字段。最后，为克隆的字段添加焦点处理器。因此，当用户点击它时，填充脚本会移除此字段，显示密码框并将光标移入其中。\n\n但失去处理器尚未完全完成。你必须修改提交处理器（submit\
  \ handler）以移除任何克隆的字段，以免它们随表单一起提交：\n\n```javascript\n// 在表单提交时必须移除占位符，以免它们被提交\n$('form').submit(function()\
  \ {\n  $(this).find('[placeholder]').each(function() {\n    var $input = $(this);\n\
  \    // 移除任何克隆的密码框\n    if ( $input.hasClass('clone') ) {\n      $input.remove();\n\
  \      return;\n    }\n    // 如果字段显示的是占位符，则清空\n    if ($input.val() === $input.attr('placeholder'))\
  \ {\n      $input.val('');\n    }\n  })\n});\n```\n\n### 整合一切\n\n现在，该填充脚本的工作方式几乎与原生功能无异。当所有代码组合在一起时，它看起来如下：\n\
  \n```javascript\nvar jsPlaceholder = function() {\n  // 当字段获得焦点时\n  $('[placeholder]').focus(function()\
  \ {\n    var $input = $(this);\n    // 判断字段是否显示占位符文本\n    if ($input.val() === $input.attr('placeholder'))\
  \ {\n      // 清空字段并移除占位符类名\n      $input.val('');\n      if ( $input.hasClass('placeholder')\
  \ ) {\n        $input.removeClass('placeholder');\n      }\n    }\n  // 当字段失去焦点时\n\
  \  }).blur(function() {\n    var $input = $(this);\n    // 如果用户没有输入任何文本，则替换占位符\n\
  \    if ($input.val() === '' || $input.val() ===\n        $input.attr('placeholder'))\
  \ {\n      // 如果是密码框，必须将其克隆为文本输入框\n      // 然后稍后移除它\n      // (否则它将显示为 ******)\n\
  \      if ( $input.attr('type') == 'password' ) {\n        var $newInput = $input.clone();\n\
  \        $newInput.attr('type', 'text');\n        $newInput.val($input.attr('placeholder'));\n\
  \        $newInput.addClass('placeholder clone');\n        $newInput.insertAfter($input);\n\
  \        $input.hide();\n        // 添加焦点状态以移除此输入框并显示/聚焦\n        // 原始框\n      \
  \  $newInput.focus(function() {\n          $(this).remove();\n          $input.show().focus();\n\
  \        });\n      }\n      else {\n        // 添加占位符文本和类\n        $input.val($input.attr('placeholder'));\n\
  \        $input.addClass('placeholder');\n      }\n    }\n  // 触发失去以便在页面加载时添加占位符文本\n\
  \  }).trigger('blur');\n  // 在表单提交时必须移除占位符，以免它们被提交\n  $('form').submit(function()\
  \ {\n    $(this).find('[placeholder]').each(function() {\n      var $input = $(this);\n\
  \      // 移除任何克隆的密码框\n      if ( $input.hasClass('clone') ) {\n        $input.remove();\n\
  \        return;\n      }\n      // 如果字段显示的是占位符，则清空\n      if ($input.val() ===\
  \ $input.attr('placeholder')) {\n        $input.val('');\n      }\n    })\n  });\n\
  };\n// 如果不支持，则添加占位符填充脚本\nif ( ! Modernizr.input.placeholder ) {\n  jsPlaceholder();\n\
  }\n```\n\n尽管这种实现处理占位符文本的方式与支持的浏览器几乎完全，但仍然存在一个问题。遗憾的是，用户无法在任何字段中输入与占位符完全相同的文本，因为脚本会认为那是占位符文本并将其移除。\n\
  \n这是一个非常极端的边缘情况，你只能接受。如果你能找到绕过此的方法，请修补此脚本并在 Twitter 上私信我 `@jonraasch`。\n\n### 结合填充脚本与组件\n\
  \n最后，仅仅因为你正在编写自己的填充脚本并不意味着你必须从头开始。你可以修改现有的填充脚本，或者在你的填充脚本中使用第三方组件（widget）。\n\n例如，jQuery\
  \ UI 提供了许多与 HTML5 类似的表单组件。你可以轻松地在填充脚本中利用这些组件。只需从表单标记中获取有关组件的信息，然后将其传递给 jQuery UI\
  \ 组件即可。\n\n## 连接到 REST API\n\n现在你需要考虑表单如何提交到服务器。你始终可以使用提交按钮的旧方法进行提交，但你在这里正在构建一个\
  \ JavaScript 应用。使用 Ajax 是更好的主意。通过 Ajax，你可以为用户提供更流畅的体验。与其硬刷新页面，不如提供一个精美的动画来指示表单已提交。\n\
  \n在提交表单之前，你需要一些标记：\n\n```html\n<form method=\"post\" action=\"api.php\">\n  <fieldset>\n\
  \    <label>Name:</label>\n    <input type=\"text\" name=\"name\">\n  </fieldset>\n\
  \  <fieldset>\n    <label>Email</label>\n    <input type=\"email\" name=\"email\"\
  >\n  </fieldset>\n  <fieldset>\n    <label>Username:</label>\n    <input type=\"\
  text\" name=\"username\">\n  </fieldset>\n  <fieldset>\n    <label>Password:</label>\n\
  \    <input type=\"password\" name=\"password\">\n  </fieldset>\n  <fieldset>\n\
  \    <input type=\"submit\">\n  </fieldset>\n</form>\n```\n\n这是一个提交到 `api.php` 的基础表单。后端的构建由你决定。\n\
  \n提交表单\n\n现在使用 jQuery 的 Ajax 提交表单。首先，拦截表单事件，然后从元素中获取方法和 URL：\n\n```javascript\n\
  // 拦截表单事件\n$('form').submit(function(e) {\n  // 防止按旧方式提交\n  e.preventDefault();\n\
  \  // 提取方法和 URL\n  var $form = $(this),\n  postMethod = $form.attr('method') ||\
  \ 'GET',\n  postURL = $form.attr('action');\n  // 记录日志\n  console.log('Form submitted\
  \ to ' + postURL + ' via ' + postMethod);\n});\n```\n\n前面的代码从表单获取了 `method` 和 `action`\
  \ 属性。注意当 `method` 未定义时有一个备选机制——在这种情况下，表单默认使用 `GET` 方法。\n\n接下来，使用这些变量设置 Ajax 请求，从表单中提取值以创建提交数据：\n\
  \n```javascript\n// 设置 AJAX 请求\n$.ajax({\n  url: postURL,\n  type: postMethod,\n\
  \  data: {\n    // 从表单中提取值\n    name: $form.find('input[name=\"name\"]').val(),\n\
  \    email: $form.find('input[name=\"email\"]').val(),\n    username: $form.find('input[name=\"\
  username\"]').val(),\n    password: $form.find('input[name=\"password\"]').val()\n\
  \  },\n  // 提交成功后\n  success: function(data) {\n    // 记录响应\n    console.log(data);\n\
  \  }\n});\n```\n\n\n\n\n```javascript\n  },\n  // on post error\n  error: function(e)\
  \ {\n    // log error info\n    console.log('Error submitting form - ' + e.status\
  \ + ': ' + e.statusText);\n  }\n});\n});\n```\n\n在这里，从表单元素中获取的 post URL 和方法被用于创建一个\
  \ Ajax 请求。为了构建 post 数据，你需要从表单中提取各种元素并获取它们的值。\n\n### 设置通用函数\n\n手动从表单中获取每个值是一种相当粗略的方法。这种方法实现起来非常麻烦，尤其是当你需要为多个表单设置时。更重要的是，它让\
  \ JavaScript 与 DOM 紧密耦合在了一起。\n\n更好的做法是设置一个通用函数，可以通过 Ajax 提交任何表单。你已经已经了，在从 `form`\
  \ 元素中提取 `post` 方法和 URL 后，表单标记是如何驱动这一功能的。为了更更上一层楼，请从表单中提取你所需的所有数据。\n\n首先，确保表单中字段的名称（names）与你想传递给服务器的\
  \ JSON 键（keys）匹配。一旦匹配，你只需要对表单数据进行序列化并提交它即可：\n\n```javascript\n// 劫持表单的提交事件\n$('form').submit(function(e)\
  \ {\n  // 防止它以旧方式提交\n  e.preventDefault();\n  // 获取 post 方法和 URL\n  var $form =\
  \ $(this),\n  postMethod = $form.attr('method') || 'GET',\n  postURL = $form.attr('action');\n\
  \  // 序列化表单数据\n  var postData = $form.serialize();\n  // 设置 AJAX 请求\n  $.ajax({\n\
  \    url: postURL,\n    type: postMethod,\n    data: postData,\n    // on post success\n\
  \    success: function(data) {\n      // 记录响应\n      console.log(data);\n    },\n\
  \    // on post error\n    error: function(e) {\n      // 记录错误信息\n      console.log('Error\
  \ submitting form - ' + e.status + ': ' + e.statusText);\n    }\n  });\n});\n```\n\
  \n这个示例利用了 jQuery 的 `serialize()` API，它将表单中的所有数据转换为对象。`serialize()` 非常好用——如果没有它，你必须遍历表单中的所有元素并从每个元素提取值。\n\
  \n遵循此步骤可以确保你应用中的每个表单都通过 Ajax 提交。\n\n如果你不想通过 Ajax 提交每个表单，可以设置一个如 `post-via-ajax`\
  \ 的类名（classname），以便在设置 `submit()` 句柄时挂钩钩子。\n\n## Backbone 中的表单\n\n如果你正在使用 Backbone，可以设置你的表单自动与\
  \ REST API 同步。在 Backbone 中设置这些内容比简单地设置 Ajax 脚本要复杂得多。\n\n但 Backbone 提供了许多其他你可以使用的便利功能，来增强你的表单体验。在这个示例中，你创建了一个表单，当用户输入无效数据时显示内联错误消息。\n\
  \n### 设置表单模型\n\n在 Backbone 中创建表单的第一步是定义模型（model）。这种思想是在编写任何标记之前这样做。这是因为 Backbone\
  \ 的核心是数据。通常情况下，你的工作方式将是：创建一个数据驱动的应用，而不是反过来。所以，从定义一个模型开始，用于存储用户注册时你需要的各种值。请注意，这个过程与表单无关；它完全关乎你的应用程序所需的业务逻辑。\n\
  \n```javascript\nvar User = Backbone.Model.extend({\n  defaults: {\n    name: '',\n\
  \    email: '',\n    username: '',\n    password: '',\n    passwordConf: ''\n  }\n\
  });\nvar user = new User;\n```\n\n在这里，你为表单字段设置了一些默认值。为了注册，用户必须提供他们的姓名、电子邮件、用户名和密码。他们还需要确认密码。目前，你将这些设置为空值，因为表单中的字段初始将是空的。\n\
  \n通常情况下，你会在模型中使用 `validate()` 构建验证功能，以检查有效的邮箱、确认的密码等。然而，这个表单是一个特殊情况，Backbone 原生的模型验证会导致问题。\n\
  \n对于注册过程，用户的密码需要是该模型的一部分。但在用户注册后，请务必不要将其传回前端。使用会话变量（session variable）或其他手段保持用户登录状态，而无需暴露其密码——这对于安全性是至关重要的。\n\
  \n### 设置表单视图\n\n现在你有了模型，是时候设置视图（view）和模板（template）的时间了，但首先，从页面上的标记开始：\n\n```html\n\
  <div id=\"signup-form-wrapper\"></div>\n```\n\n这个元素只是一个包装器，你用它将表单内容插入 DOM 中。为了让表单在没有\
  \ JavaScript 的情况下也能访问，你应该用静态版本的表单填充这个包装器。不过，为了使示例更，我跳过了这一点。现在，定义注册表单的视图：\n\n```javascript\n\
  var SignupView = Backbone.View.extend({\n  el: '#signup-form-wrapper',\n  template:\
  \ _.template( $('#form-template').text() ),\n  initialize: function() {\n    //\
  \ 渲染表单\n    this.render();\n  },\n  render: function() {\n    // 将模型转换为对象\n    var\
  \ modelData = this.model.toJSON();\n    // 将其插入 DOM\n    this.$el.html( this.template(\
  \ modelData ) );\n  }\n});\n\n// 创建视图的新实例\nvar signupView = new SignupView({\n \
  \ model: user\n});\n```\n\n到目前为止，视图还相当直观。首先，你将其绑定到已经放在页面上的包装器元素。然后，你使用 Underscore\
  \ 模板。最后，在加载时使用模板和来自模型的数据渲染视图。\n\n```html\n<script type=\"text/template\" id=\"form-template\"\
  >\n<form action=\"my-api\">\n  <fieldset>\n    <label for=\"name\">Name:</label>\n\
  \    <input type=\"text\" name=\"name\" id=\"name\" value=\"<%= name %>\"\n  </fieldset>\n\
  \  <fieldset>\n    <label for=\"email\">Email:</label>\n    <input type=\"email\"\
  \ name=\"email\" id=\"email\" value=\"<%= email %>\"\n  </fieldset>\n  <fieldset>\n\
  \    <label for=\"username\">Username:</label>\n    <input type=\"text\" name=\"\
  username\" id=\"username\" value=\"<%= username %>\"\n  </fieldset>\n  <fieldset>\n\
  \    <label for=\"password\">Password:</label>\n    <input type=\"password\" name=\"\
  password\" id=\"password\" value=\"<%= password %>\"\n  </fieldset>\n  <fieldset>\n\
  \    <label for=\"password-conf\">Confirm Password:</label>\n    <input type=\"\
  password\" name=\"passwordConf\" id=\"password-conf\" value=\"<%= passwordConf %>\"\
  \n  </fieldset>\n  <fieldset>\n    <input type=\"submit\">\n  </fieldset>\n</form>\n\
  </script>\n```\n\n在这里，你创建了提交到任何你需要的位置的表单。请密切注意 `<script>` 元素的 ID。该 ID 需要与你在视图使用的选择器匹配。\n\
  \n如图 5-15 所示，表单现在渲染在页面上。\n\n图 5-15 注册表单正在使用 Underscore 模板渲染。\n\n### 将表单字段保存到模型\n\
  \n现在你构建了视图，你需要一种方法将用户在表单中输入的数据传回模型。为了实现这一点，你需要一个新概念：Backbone 视图事件。\n\n你已经使用过内部 Backbone\
  \ 事件来跟踪模型、集合等的变化。但现在你将使用视图事件为视图中的元素绑定不同的处理程序。例如，你可以为任何表单字段的更改事件绑定处理程序：\n\n\n\n\n\
  \n```javascript\n  render: function() {\n    // 将模型转换为对象\n    var modelData = this.model.toJSON();\n\
  \    // 将其插入 DOM\n    this.$el.html( this.template( modelData ) );\n  },\n  // 每当表单字段发生变化时\n\
  \  inputChange: function(e) {\n    var $input = $(e.target);\n    // 获取模型中键的名称\n\
  \    var inputName = $input.attr('name');\n    // 在模型中设置新值\n    this.model.set(inputName,\
  \ $input.val());\n  }\n});\n```\n\n在这里，视图对象的 `events` 属性被用于将更改处理程序绑定到输入框上。该对象的语法如下：`'eventType\
  \ selector': callback`。例如，要为所有 `<a>` 元素绑定点击处理程序，你可以这样写：\n\n```javascript\nmyView.events\
  \ = {\n  'click a': clickHandler\n}\n```\n\n更改事件的处理器非常直观：你使用输入框的名称和值，并使用这些值来设置用户模型中对应的值。\n\
  \n通过 `Backbone` 绑定视图事件是非常重要的。这样做可以确保它们在每次视图渲染时都会被应用。\n\n## 添加验证\n\n现在，你需要为表单中的字段设置验证。当然，你可以依赖\
  \ HTML5 验证，但在这里我们将玩得高级一点。我将向你展示如何通过视图渲染内联验证消息。\n\n通常，你会在模型上设置验证，但在情况下，那样太繁琐了。因为你在过程的每一步都会将数据保存到模型，脚本在用户仍在输入数据时可能会报错。例如，当他们输入第一个密码时，根据定义它与确认密码不匹配，每次都会报错。糟糕糟糕，脚本甚至没有将确认密码保存到模型，因此无法成功完成表单。\n\
  \n第一步是添加一个新的模型来存储任何错误：\n\n```javascript\n// 用于无效字段的模型\nvar Invalid = Backbone.Model.extend({});\n\
  var User = Backbone.Model.extend({\n  defaults: {\n    name: '',\n    email: '',\n\
  \    username: '',\n    password: '',\n    passwordConf: ''\n  },\n  initialize:\
  \ function() {\n    // 绑定一个子模型来存放无效字段\n    this.set('invalid', new Invalid);\n \
  \ }\n});\nvar user = new User;\n```\n\n这为无效字段创建了一个新模型，然后将其作为原始用户模型的子模型进行绑定。在用户模型的\
  \ `initialize` 函数中定义它是非常重要的——如果你将其设置为 `defaults` 的一部分，该模型的所有新实例都将绑定到 `Invalid` 模型的同一个实例。\n\
  \n现在，你可以为视图添加一个自定义验证函数，并将任何错误添加到 `invalid` 模型中：\n\n```javascript\nvar SignupView\
  \ = Backbone.View.extend({\n  el: '#signup-form-wrapper',\n  template: _.template(\
  \ $('#form-template').text() ),\n  events: {\n    'change input': 'inputChange'\n\
  \  },\n  initialize: function() {\n    // 绑定 上下文\n    _.bindAll( this, 'validateForm',\
  \ 'inputChange' );\n    // 渲染表单\n    this.render();\n  },\n  render: function()\
  \ {\n    // 将模型和子模型转换为对象\n    var modelData = this.model.toJSON();\n    modelData.invalid\
  \ = modelData.invalid.toJSON();\n    // 将其插入 DOM\n    this.$el.html( this.template(\
  \ modelData ) );\n  },\n  validateForm: function() {\n    // 将模型数据转换为对象\n    var\
  \ data = this.model.toJSON();\n    data.invalid = data.invalid.toJSON();\n    //\
  \ 检查邮箱是否有效\n    var emailRegex = /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:a-z0-9?\\\
  .)+a-z0-9?/;\n    if ( data.email.length && ! data.email.match(emailRegex) ) {\n\
  \      // 将其添加到无效模型\n      this.model.get('invalid').set('email', '必须提供有效的邮箱邮箱');\n\
  \    }\n    else {\n      // 否则移除\n      this.model.get('invalid').unset('email');\n\
  \    }\n    // 检查密码是否匹配\n    if ( data.password.length && data.passwordConf.length\
  \ && data.password != data.passwordConf ) {\n      // 将其添加到无效模型\n      this.model.get('invalid').set('password',\
  \ \"密码不匹配\");\n      this.model.get('invalid').set('passwordConf', \"密码不匹配\");\n\
  \    }\n    else {\n      // 否则移除\n      this.model.get('invalid').unset('password');\n\
  \      this.model.get('invalid').unset('passwordConf');\n    }\n    if ( this.model.get('invalid').size()\
  \ > 0 ) {\n      return false;\n    } else {\n      return true;\n    }\n  }\n});\n\
  ```\n\n\n\n\n\n```html\n      <span class=\"error-message\"><%= invalid.password\
  \ %></</span>\n  <% %>\n  </fieldset>\n  <fieldset>\n    <label for=\"password-conf\"\
  >确认密码:</label>\n    <input type=\"password\" name=\"passwordConf\" id=\"password-conf\"\
  \ value=\"<%=\n    passwordConf %>\" <%= invalid.passwordConf ? 'class=\"error\"\
  ' : \"\" %>>\n    <% if ( invalid.passwordConf ) { %>\n        <span class=\"error-message\"\
  ><%= invalid.passwordConf %></</span>\n    <% } %>\n  </fieldset>\n  <fieldset>\n\
  \    <input type=\"submit\">\n  </fieldset>\n</form>\n</script>\n```\n\n如你所见，你添加了相应的错误信息。现在，你可以挂钩字段上的\
  \ `error` 类名并使用 CSS 添加红色边框。你还应该用红色显示 `error-message` `<span>`，如图 5-16 所示。\n\n![9781118524565-fg0516.tif](img/9781118524565-fg0516_fmt.png)\n\
  \n图 5-16 表单正确显示了错误信息。\n\n重新渲染表单显示错误会移除用户正在编辑的字段的光标焦点。作为一个加分作业，请想出一个方法，在渲染之前获取当前的焦点，并在渲染后重新应用焦点。\n\
  \n## 清理模板\n\n在表单模板中添加验证消息后，你可能已经注意到它变得很长且难以维护。因此现在你应该对其进行清理。你可以通过两种方法来实现：你可以遍历字段并生成表单。然而，这样你需要在模型中添加更多代码，而这些代码只涉及表单的显示，所以这并不是一个好主意。更好的方法是创建一个可以在模板内利用的辅助函数：\n\
  \n```html\n<script type=\"text/template\" id=\"form-template\">\n<%\nvar displayField\
  \ = function(fieldKey, fieldValue, displayName, inputType) {\n  if ( typeof( inputType\
  \ ) === 'undefined' ) inputType = 'text'\n  %>\n  <fieldset>\n    <label for=\"\
  <%= fieldKey %>\"><%= displayName %>:</label>\n    <input type=\"<%= inputType %>\"\
  \ name=\"<%= fieldKey %>\" id=\"<%= fieldKey\n%>\" value=\"<%= fieldValue %>\" <%=\
  \ invalid[fieldKey] ? 'class=\"error\"' : \"\"\n%>>\n    <% if ( invalid[fieldKey]\
  \ ) { %>\n        <span class=\"error-message\"><%= invalid[fieldKey] %></</span>\n\
  \    <% } %>\n  </fieldset>\n  <%\n}\n%>\n<form method=\"post\" action=\"my-api.php\"\
  >\n  <% displayField('name', name, '名称'); %>\n  <% displayField('email', email,\
  \ '邮箱', 'email'); %>\n  <% displayField('username', username, '用户名'); %>\n  <% displayField('password',\
  \ password, '密码', 'password'); %>\n  <% displayField('passwordConf', passwordConf,\
  \ '确认密码',\n  'password'); %>\n  <fieldset>\n    <input type=\"submit\">\n  </fieldset>\n\
  </form>\n</script>\n```\n\n在这里，你创建了辅助函数 `displayField()`，它接受几个参数：\n\n1. 字段的键（key）\n\
  2. 该字段中输入的值\n3. 你想在 `<label>` 中显示的名称\n4. 一个可选的输入类型，默认为文本输入\n\n一旦你输入了正确的数据，辅助函数就会输出正确的标记。如你所见，模板看起来容易管理多了。\n\
  \n你可以将此辅助函数包含在你的 JavaScript 核心中——毕竟，你的模板可以利用应用中的任何 JavaScript。但因为此功能特定于模板，更好的想法是直接将辅助函数包含在那里。\n\
  \n## 必填字段\n\n现在，你的注册表单看起来已经完整了，但在提交表单之前，你需要确保用户已填写了所有字段。为了做到这一点，请修改之前构建的 `validateForm()`\
  \ 函数：\n\n```javascript\nvalidateForm: function(`checkRequired`) {\n  // 将模型数据转换为\
  \ JSON\n  var data = this.model.toJSON();\n  data.invalid = data.invalid.toJSON();\n\
  \  // 为必字段字段保存消息 - 这将被多次复用\n  var requiredMsg = '必填字段';\n  // 检查邮箱是否有效\n  var emailRegex\
  \ = /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\\.[a-z0-99!#$%&'*+/=?^_`{|}~-]+)*@(?:a-z0-9?\\\
  .)+a-z0-9?/;\n  if ( data.email.length && ! data.email.match(emailRegex) ) {\n \
  \   // 将其添加到无效模型\n    this.model.get('invalid').set('email', '必须提供有效的邮箱');\n  }\n\
  \  else {\n    // 否则，如果不是必填字段，将其移除\n    if ( data.invalid.email != requiredMsg )\
  \ {\n      this.model.get('invalid').unset('email');\n    }\n  }\n  // 检查密码是否匹配\n\
  \  if ( data.password.length && data.passwordConf.length && data.password != data.passwordConf\
  \ ) {\n    // 将其添加到无效模型\n    this.model.get('invalid').set('password', \"密码不匹配\"\
  );\n    this.model.get('invalid').set('passwordConf', \"密码不匹配\");\n  }\n  else {\n\
  \    // 否则，如果不是必填字段，将其移除\n    if ( data.invalid.password != requiredMsg ) {\n  \
  \    this.model.get('invalid').unset('password');\n    }\n  }\n  // 检查所有字段是否已填写\n\
  \  if ( checkRequired ) {\n    // 遍历字段\n    _.each(data, function(value, key) {\n\
  \      // 跳过无效的子模型\n      if ( key == 'invalid' ) return;\n      // 如果字段为空\n   \
  \   if ( ! value.length ) {\n        // 将其添加到无效模型\n        this.model.get('invalid').set(key,\
  \ requiredMsg);\n      }\n      else {\n        // 否则，如果不是必填字段，移除之前设置的无效标记\n   \
  \     if ( data.invalid[key] == requiredMsg ) {\n          this.model.get('invalid').unset(key);\n\
  \        }\n      }\n    }, this);\n  }\n  // 如果有任何无效字段，返回 false，否则返回 true\n  if\
  \ ( _.size( this.model.get('invalid').toJSON()) ) {\n    return false;\n  }\n  return\
  \ true;\n},\n```\n\n注意，你首先构建了一个 `checkRequired` 参数来判断是否正在检查必填字段。如果在用户输入数据时不断检查必填字段，会让用户感到非常困扰。所以，你只在表单实际提交时检查它们。\n\
  \n如果设置了 `checkRequired` 参数，你会使用 Underscore 的 `_.each()` 方法遍历字段（跳过 `invalid` 子模型）。如果字段为空，你将之前设置的\
  \ `requiredMsg` 传递给 `invalid` 子模型；如果字段为空，你就移除之前设置的任何无效标记。然而，你需要确保只移除必填字段的错误；否则，可能会移除无效邮箱或密码不匹配的错误信息。\n\
  \n如图 5-17 所示，调用 `signupView.validateForm(true)` 时，空字段会抛出错误。\n\n## 提交表单\n\n最后，你需要创建一种方法将此表单提交到\
  \ REST API。幸运的是，用户的所有输入已经存储在模型中了。你只需要设置一个方法来同步它。为了实现这一点，在视图的 `events` 对象中设置一个提交处理器：\n\
  \n```javascript\nvar SignupView = Backbone.View.extend({\n  el: '#signup-form-wrapper',\n\
  ```\n\n\n\n\n\n```javascript\ntemplate: _.template( $('#form-template').text() ),\n\
  \  events: {\n    'change input': 'inputChange',\n    'submit form': 'saveForm'\n\
  \  },\n  ...\n  // 当表单提交时\n  saveForm: function(e) {\n    // 防止以传统的旧方式保存表单\n   \
  \ e.preventDefault();\n    // 验证表单\n    if ( this.validateForm(true) ) {\n     \
  \ // 如果有效，保存模型\n      this.model.save();\n    }\n    else {\n      // 否则渲染错误\n \
  \     this.render();\n    }\n  }\n});\n```\n\n在这里，表单上设置了一个提交处理程序，它会触发你的 `saveForm()`\
  \ 回调函数。在这个回调中，阻止了表单的默认行为，以确保它不会以旧的方式提交。然后你调用了 `validateForm()` 函数，并传递 `checkRequired`\
  \ 参数以确保它检查必填字段。如果表单通过验证，则会被保存，这样 Backbone 就会自动通过 Ajax 同步模型。否则，它将重新渲染以显示任何错误。然而，Backbone\
  \ 并不知道将此表单提交到哪里，你仍然需要从表单的 `action` 属性获取 URL：\n\n```javascript\n// 当表单提交时\nsaveForm:\
  \ function(e) {\n  // 防止以传统的旧方式保存表单\n  e.preventDefault();\n  // 验证表单\n  if ( this.validateForm(true)\
  \ ) {\n    // 使用表单中的 URL 设置 API 位置\n    this.model.url = this.$el.find('form').attr('action');\n\
  \    // 如果有效，保存模型\n    this.model.save();\n  }\n  else {\n    // 否则渲染错误\n    this.render();\n\
  \  }\n}\n```\n\n或者，你也可以在创建模型时直接声明 url，但让我们保持由表单标记驱动。\n\n现在，Backbone 将把表单数据提交到表单原本提交的相同\
  \ URL，但你仍然需要做一些工作。模型中的某些多余信息不应该发送到服务器。例如，`invalid` 子模型和密码确认并不是发送到 API 真正需要的数据。为了减小此请求的大小，在调用\
  \ `save()` 方法时移除它们。只需清理一个你想要保存的数据对象并将其传递进去：\n\n```javascript\n// 当表单提交时\nsaveForm:\
  \ function(e) {\n  // 防止以传统的旧方式保存表单\n  e.preventDefault();\n  // 验证表单\n  if ( this.validateForm(true)\
  \ ) {\n    // 使用表单中的 URL 设置 API 位置\n    this.model.url = this.$el.find('form').attr('action');\n\
  \    // 为 API 清理数据\n    var data = this.model.toJSON();\n    delete data.invalid;\n\
  \    delete data.passwordConf;\n    // 如果有效，保存模型\n    this.model.save(data);\n \
  \ }\n  else {\n    // 否则渲染错误\n    this.render();\n  }\n}\n```\n\n这从模型中移除了不必要的数据并将其传递到\
  \ `save()` 函数中。这样，脚本只会将相关数据传递给 API。\n\n### 整合在一起\n\n现在，你的表单已与 Backbone 正确连接。它会在表单中错误发生时显示内联错误，并通过\
  \ Ajax 提交表单数据。将所有代码组合在一起：\n\n```html\n<div id=\"signup-form-wrapper\"></</div>\n\
