  \ %>\" id=\"<%= fieldKey %>\" value=\"<%= fieldValue %>\" <%= invalid[fieldKey]\
  \ ? 'class=\"error\"' : \"\" %>>\n    <% if ( invalid[fieldKey] ) { %>\n      <span\
  \ class=\"error-message\"><%= invalid[fieldKey] %></span>\n    <% } %>\n  </fieldset>\n\
  \  <%\n}\n%>\n<form method=\"post\" action=\"my-api.php\">\n  <% displayField('name',\
