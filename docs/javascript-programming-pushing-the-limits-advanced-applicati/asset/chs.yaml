  \n## 发布\n\n现在你已经能够在浏览器中绘制自定义的 2D 和 3D 图形，你在前端可以实现的可能性几乎是无限的。使用这些技术来创建一个丰富的交互式应用，让你的用户感到惊喜并印象深刻。\n\
  \n在这个点，你已经准备好发布。然而，在本章中，你发现了补充测试驱动开发（TDD）的性能技术。## 性能清单\n\n应用最重要的特性之一就是它的运行速度。过去，优化工作集中在服务器：提高延迟和增加功能。然而，近年来开发者开始更多地关注客户端。虽然你可以通过购买更好的服务器来解决服务器性能，但对于客户端，你唯一能做的就是优化代码。这是因为你无法控制访问应用的设备。你可能认为随着计算机的不断改进，这不再是问题，但随着更多用户转向移动设备浏览网页，你的应用需要兼容性。此外，即使在桌面电脑上，用户对应用交互的预期也更高。\n\
  \n尽管如此，优化应用中的所有代码并没有太大意义。当然，你应该在编写代码时努力进行优化，但之后再去重构每一行代码并不真的值得。相反，你应该测试代码并确定瓶颈在哪里。\n\
  \n## 测试性能\n\n如果你已经用 QUnit 设置了单元测试，你应该已经获得了有关测试执行时间的数据。但当你想要比较不同的方法时，还有另一种测试性能的方法：使用[`http://jsperf.com`](http://jsperf.com)\
  \ 进行基准测试。\n\n它可以让你方便地比较短脚本的性能，并在不同浏览器之间进行比较，如图 12-1 所示。\n\n![9781118524565-fg1201.tif](img/9781118524565-fg1201_fmt.png)\n\
  \n图 12-1 jsPerf 缓存了你所有运行基准测试的浏览器，并提供了方便的比较。\n\n虽然 `jsPerf` 非常适合测试单个微优化，但对于测试整个应用的速度，它并不好用。对于这一点，请使用\
  \ QUnit 或 Chrome/Firefox 中的性能分析器工具。\n\n另一个用于性能测试的工具是 WebKit 开发工具中的性能分析器。你可以使用 JavaScript\
  \ 性能分析器来收集数据，确定哪些部分执行最频繁，哪些部分消耗了更多资源，如图 12-2 所示。\n\n```\nrequestAnimationFrame\n\
  ```\n\n\n\n\n# 优化\n\n除了测试，专注于优化重复执行的代码也是一个好主意。函数运行得越频繁，优化时带来的收益就越大。因此，请检查你的循环和任何重用的函数。你也可以提前为自己提供帮助，遵循“不要重复自己”（Don't\
  \ Repeat Yourself, DRY）的原则，将常用部分抽象到单独的函数中，以便在整个应用中共享。这样做的好处是除了减少总文件大小外，代码还更容易维护和测试。\n\
  \n![978118524565-fg1202.png]\n来自 WebKit 内置工具的 JavaScript 性能分析器。\n\n## 实际性能与感知性能\n\
  \n最后，请注意性能有两种类型：实际性能和感知性能。基准测试认为你的应用运行有多快其实并不重要，重要的是用户的感知。感知性能的经典案例是将某些任务推迟到以后执行，以便用户能够尽快看到页面上发生某些变化。例如，假设你有一个非常消耗资源的\
  \ JavaScript 图表。在图表加载时阻塞页面的其他部分是没有意义的。相反，先用一个“加载中”gif 加载整个页面，然后在最后加载图表。尽管脚本加载的时间相同（甚至更长），用户也会感知到更好的性能，因为他们能够与页面的其他部分进行交互。这个例子中的性能改进不必止于图表——你可以设置页面仅加载显示所需的最少内容，然后根据需要加载其余部分。\n\
  \n## 资源管理\n\n在涉及优化时，你可以在提供 `.js` 文件等资源的方式上获得最大的收益。你可以使用多种技术来缩小这些文件的大小，从而减少你的网站或应用对带宽的需求。用户拥有更多带宽和更快的速度会导致预期的提高，因此你最好尽一切努力去减小文件大小。毕竟，移动网络仍然很慢，你永远无法确定用户是如何连接到你的应用的。\n\
  \n在本节中，我涵盖了三管齐下的方法：最小化（minification）、gzip 压缩和托管。这些技术可以极大地减小文件体积；使用这些方法时，体积减少 90%\
  \ 或以上的情况并不罕见。你可能已经在这样做其中的一些了，但确保遵循所有这些指南将确保你的 JavaScript 尽可能快速加载。\n\n### 最小化 (Minification)\n\
  \n这几乎是理而应当的。在发布到生产环境之前，确保运行最小化工具或打包器来处理你的代码，以删除任何空白和注释，并减少局部变量。根据可以移除多少此类字符，你将在最小化时看到显著的收益——例如，一个\
  \ 100K 的文件缩小到 30K。\n\n但请记住，所有的最小化工具都是相同的。它们处理方式略有不同，并产生不同大小的文件。我个人最喜欢 Google Closure\
  \ Compiler (`http://code.google.com/p/closure-compiler/`)，因为它始终提供一些最小的最小化文件。例如，参见此对比：`http://coderjournal.com/2010/01/yahoo-yui-compressor-vs-microsoft-ajax-minifier-vs-google-closure-compiler/`。\n\
  \n你可以下载编译器并在计算机的终端中运行它，或者使用这里的在线版本：`http://closure-compiler.appspot.com/`。如果你正在运行\
  \ `Node`，请查看 `Uber-Compiler` 模块（它也编译 LESS）：`https://github.com/kennberg/node-uber-compiler`。\n\
  \n你还应该对 CSS 进行最小化，并考虑对标记（markup）也进行最小化。\n\n### Gzip 压缩\n\n除了最小化，你还应该对文件进行 gzip 压缩。Gzip\
  \ 将进一步减小文件大小并带来巨大的收益。Gzipped 后的文件通常是其未压缩版本大小的三分之一。例如，看看 jQuery 2.0。未压缩、未最小化的核心是\
  \ 240K。它被最小化到 83K，然后通过 gzip 进一步压缩到 30K 以下。与原始文件相比有 88% 的差异！\n\n最棒的是，gzip 可以在服务器上动态完成。如果你正在使用\
  \ `Node`，只需安装这些压缩模块之一：`https://github.com/joyent/node/wiki/modules#wiki-compression`。\n\
  \n或者如果你在 Apache 服务器上，可以通过 `.htaccess` 文件进行 gzip：\n\n```\n# 压缩 text, html, javascript,\
  \ css, xml:\nAddOutputFilterByType DEFLATE text/plain\nAddOutputFilterByType DEFLATE\
  \ text/html\nAddOutputFilterByType DEFLATE text/xml\nAddOutputFilterByType DEFLATE\
  \ text/css\nAddOutputFilterByType DEFLATE application/xml\nAddOutputFilterByType\
  \ DEFLATE application/xhtml+xml\nAddOutputFilterByType DEFLATE application/rss+xml\n\
  AddOutputFilterByType DEFLATE application/javascript\n```\n\n### 托管\n\n当你通过最小化和\
  \ gzip 压缩准备好 `.js` 文件后，是时候托管它了。但与其在主服务器上托管，最好是将其上传到 CDN，出于多个原因。我将在本章后面的部分讨论这些优势。\n\
  \n## 动画优化\n\n另一个你可以看到性能大幅提升的地方是应用中的动画。动画是浏览器最重的进程之一，因为它必须为动画的每一帧重复地绘制和重绘页面。\n\n\
  此外，性能在动画中尤为明显。这是因为动画性能越好，浏览器每秒渲染的帧数越多。优化不当的动画看起来卡顿，因为浏览器必须丢很多帧，而高性能的动画看起来流畅无缝。\n\
  \n在开始优化动画之前，决定你是否真的需要它。当然，动画可以提供更好的用户体验，但糟糕的性能会忽略这一切。所以要在动画上有所选择，只动画重要区域。\n\n###\
  \ CSS3 动画\n\nCSS3 引入了过渡（transition）和帧动画（keyframe animations），两者都可以作为 JavaScript\
  \ 的替代。由于这些动画可以被浏览器优化并利用硬件加速，因此尽可能这样做是好主意。结果是，在能力设备上，将使用图形处理器（GPU）而不是中央处理器（CPU）来渲染动画。GPU\
  \ 不仅更适合渲染，还能释放 CPU 专注于其他任务。\n\n### 将 CSS3 动画结合 JavaScript 使用\n\n使用 CSS3 动画并不意味着你必须在样式表中处理所有内容。你仍然可以使用\
  \ JavaScript 启动动画；只需为类名添加过渡效果，然后使用 JS 应用该类。\n\n首先，从 CSS 开始：\n\n```css\n.my-element\
  \ {\n  position: absolute;\n  top: 0;\n  left: 0;\n  -webkit-transition: left 500ms\
  \ ease;\n  -moz-transition: left 500ms ease;\n  transition: left 500ms ease;\n}\n\
  \n.my-element.slide-left {\n  left: 200px;\n}\n```\n\n\n\n\n\n接下来，使用 jQuery 为你的元素添加\
  \ `slide-left` 类：\n\n```javascript\n$('.my-element').addClass('slide-left');\n```\n\
  \n当应用此类时，元素将在 500 毫秒内向左移动 200 像素。\n\n## CSS3 动画的缺点\n\n遗憾的是，CSS3 动画可能比你习惯的 JavaScript\
  \ 技术更难处理。例如，jQuery 动画有一个直观的回调函数，该回调函数在每次动画完成时都会被调用。尽管你可以使用 CSS3 的 `transitionend`\
  \ 处理器来实现相同的功能，但此事件会在任何过渡完成时触发，并且很难辨别出底是哪一个过渡触发了它。更糟糕的是，如果你正在对多个属性进行过渡（例如，在同一次过渡中同时改变\
  \ `height` 和 `width`），它会触发多次。\n\n更重要的是，CSS3 动画产生了一个组织上的问题，因为动画通常更像是一个脚本任务，而不是样式任务，因此将这些代码放在样式表中是不合逻辑的。有时候这并不是大问题；例如，如果你想在悬停时切换链接的颜色，这种动画仅仅是一个样式问题。但一旦你开始使用\
  \ JavaScript 来应用 CSS3 动画，然后尝试在 JS 中处理 `transitionend` 事件，你就会发现同一脚本的部分在完全不同的位置运行。这并不意味着你应该完全避免这种做法。有时你确实使用\
  \ CSS3 动画；例如，在性能有限的移动设备上，它可以成为救命稻草。但你也需要理解这种开发模式的缺点。\n\n最后，请记住浏览器对 CSS3 动画的支持仍然不足。幸运的是，从\
  \ IE10 开始，所有主流浏览器都已支持过渡（transition）和关键帧动画（keyframe animation）（Opera Mini 除外）。然而，旧版本的\
  \ IE 不支持它，在本文写作时这仍然占据了相当的市场份额。对于过渡来说，这通常不是主要问题，因为它们会回退到即时的、非动画样式更改。另一方面，关键帧动画则是另一回事。当然，如果这些动画中有任何一个是至关重要的，你始终可以编写\
  \ JavaScript 回退方案或使用 polyfill。\n\n## Request Animation Frame (请求帧)\n\n另一种方法，如果你想避免与\
  \ CSS3 过渡之间进行复杂的接口交互，可以使用 HTML5 的 `requestAnimationFrame` API 获取一个兼得两者的解决方案。该 API\
  \ 为浏览器渲染动画的每一帧提供了一种更符合性能要求。\n\n### 为什么你应该使用 Request Animation Frame\n\n通常在 JavaScript\
  \ 中进行动画时，你会使用像 `setTimeout` 这样的定时循环来每几毫秒更改一次 CSS。但这并不是最佳方法，因为无法确定在每个用户的机器上使用的最佳帧率。更改太慢，你的动画看起来就会比实际需要的更卡顿；更改太快，浏览器会因为处理它最终不会执行的额外渲染任务而崩溃（因为计时器已经移动到了动画的下一帧）。\n\
  \n此外，即使 CPU 可以处理额外的帧，它们也必须在时间上与用户屏幕的刷新率相匹配——即屏幕显示新帧的速率。不同设备的刷新率不同。标准是 60 Hz，但处于节电模式的笔记本电脑可能使用\
  \ 50 Hz 的刷新率，而某些桌面显示器为 70 Hz。\n\n这就是 `requestAnimationFrame` 的用场。它提供了一种在浏览器中更好的动画的方法，通过提供一个根据设备能力渲染帧的\
  \ API，而不是将其设置为任意的计时器。然后浏览器就可以以它所能的最快速度渲染，可能会降低该速率以更好地对齐屏幕的刷新率。\n\n你可能认为这没有太大区别，但我们的眼睛对运动非常敏感，甚至能察觉帧率的微小变化。因此，保持一致的较低帧率比随机掉帧要好。前者看起来很平滑，而后者看起来很卡顿。\n\
  \n### Request Animation Frame Polyfill\n\n在开始使用 `requestAnimationFrame` 之前，请确保你正在使用\
  \ Paul Irish 提供的这个 polyfill：\n\n```javascript\n(function() {\n  var lastTime = 0;\n\
  \  var vendors = ['ms', 'moz', 'webkit', 'o'];\n  for(var x = 0; x < vendors.length\
  \ && !window.requestAnimationFrame; ++x) {\n    window.requestAnimationFrame = window[vendors[x]+'RequestAnimationFrame'];\n\
  \    window.cancelAnimationFrame =\n      window[vendors[x]+'CancelAnimationFrame']\
  \ || window[vendors[x]+'CancelRequestAnimationFrame'];\n  }\n  if (!window.requestAnimationFrame)\n\
  \    window.requestAnimationFrame = function(callback, element) {\n      var currTime\
  \ = new Date().getTime();\n      var timeToCall = Math.max(0, 16 - (currTime - lastTime));\n\
  \      var id = window.setTimeout(function() { callback(currTime + timeToCall);\
  \ },\n        timeToCall);\n      lastTime = currTime + timeToCall;\n      return\
  \ id;\n    };\n}());\n```\n\n这个 polyfill 齐了不同的浏览器，并为不支持的浏览器提供了回退方案。你可以在这里阅读更多信息：`http://paulirish.com/2011/requestframe-animating/`。\n\
  \n## 如何使用 Request Frame\n\n引入 polyfill 后，你就可以开始了。首先，创建一些用于操作的标记：\n\n```html\n<div\
  \ id=\"my-element\">点击开始</div></div>\n```\n\n并添加一些基础样式：\n\n```css\n#my-element {\n\
  \  position: absolute;\n  left: 0;\n  width: 200px;\n  height: 200px;\n  padding:\
  \ 1em;\n  background: tomato;\n  color: #FFF;\n  font-size: 2em;\n  text-align:\
  \ center;\n}\n```\n\n现在是 JavaScript 部分：\n\n```javascript\nvar elem = document.getElementById('my-element'),\n\
  \  startTime = null,\n  endPos = 500, // 像素\n  duration = 2000; // 毫秒\n\nfunction\
  \ render(time) {\n  if (time === undefined) {\n    time = new Date().getTime()\n\
  \  }\n  if (startTime === null) {\n    startTime = time;\n  }\n  elem.style.left\
  \ = ((time - startTime) / duration * endPos % endPos) + 'px';\n}\n\nelem.onclick\
  \ = function() {\n  (function animationLoop(){\n    render();\n    requestAnimationFrame(animationLoop,\
  \ elem);\n  })();\n};\n```\n\n此脚本为元素添加了点击处理程序，它将在 2 秒内将元素向右移动 500 像素，然后循环回到开头。\n\
  \n首先，`render()` 函数通过比较当前时间与开始时间，来计算出动画渲染的正确位置，类似于使用标准 JavaScript 定时器处理的方式。\n\n接下来，`animationLoop()`\
  \ 函数渲染动画的当前帧。然后它调用 `requestAnimationFrame()`，并将自身和要动画的元素传递进去，从而建立了一个循环，在浏览器准备就绪时在元素中渲染新帧。\n\
  \n\n\n\n\n在处理 jQuery DOM 引用时，这项技术尤为重要，因为即使使用极快的 Sizzle 引擎，CSS 选择器也可能非常消耗资源。例如，你应该避免在循环中选择\
  \ DOM 元素，除非该循环以某种方式改变了这些选择器引用的内容。\n\n查看这里的 jsPerf 测试：[`http://jsperf.com/caching-jquery-dom-refs/2`](http://jsperf.com/caching-jquery-dom-refs/2)（显示在图\
  \ 12-3）。你可以看到，缓存的选择器比在循环中反复调用的选择器快得多。\n\n![9781118524565-fg1203.tif](img/9781118524565-fg1203_fmt.png)\n\
  \n图 12-3：在 Chrome 中，`$(h1')` 的缓存引用快得多。\n\n## 避免重流（Reflows）\n\n此外，你可以通过尽量减少页面上的重流次数来优化客户端\
  \ JavaScript。每当元素的布局发生变化时，就会发生一次重流。例如，如果你让一个浮动元素变宽，它会把其他浮动元素推到下一行，然后继继将随后的元素向下推。\n\
  \n要直观了解重流是如何工作的，请查看这个在 Gecko 浏览器中运行的重流可视化：[`http://youtube/ZTnIxIA5KGw`](http://youtu.be/ZTnIxIA5KGw)。\n\
  \n避免重流的最佳方法是避免对 DOM 进行不必要的操作。尽可能对任何 DOM 更改进行批量处理并一次插入。\n\n查看这个 jsPerf 测试，它分别逐个或一次性将图像附加到页面中：[`http://jsperf.com/individual-vs-batch-jquery-insertion/6`](http://jsperf.com/individual-vs-batch-jquery-insertion/6)。如图\
  \ 12-4 所示，批量处理的更改运行速度快得多。\n\n![9781118524565-fg1204.tif](img/9781118524565-fg1204_fmt.png)\n\
  \n图 12-4：批量处理十张 Nyan cat 图像比逐个添加要快。\n\n## 部署\n\n在你充分测试了应用程序，并且对功能和性能都表示满意后，就是时候进行部署了。\n\
  \n### 在 CDN 上部署静态资源\n\n将你应用程序的静态脚本部署到诸如 Amazon Simple Storage Service (S3) 等 CDN\
  \ 有许多性能方面的优势。\n\n#### CDN 的优势\n\n首先，CDN 在全球范围内分发你的文件，这减少了延迟并增加了可用性，因为文件存储在距离请求用户最近的地方。记住，互联网并不是魔法；文件仍然需要从某处来往某处去——这种旅程受到电信号速度的限制。\n\
  \n其次，CDN 针对静态资源的交付进行了优化。例如，在你的网站上，你可能以某种方式使用了 cookie，即使是为了分析。每当用户从你的服务器请求文件时（无论是\
  \ HTML、JS、CSS 还是图像），这些 cookie 数据都会作为请求头的一部分传递。\n\n尽管 cookie 相对较小（通常小于 1K），但考虑到它会随着每一个请求发送，这些额外数据确实会累积成大量开。因此，将所有静态资源（JS、CSS\
  \ 和图像）托管在 CDN 上是一个好主意，因为 CDN 不会随头部传递任何 cookie。第三，CDN 提供了激进的 HTTP 缓存能力，这减少了延迟并增加了输出，允许\
  \ CDN 处理巨大的流量峰值。这结合高水平的冗余性，贡献了你自己的服务器难以实现的可用性水平。\n\n#### CDN 的劣势\n\n使用 CDN 的唯一缺点是它引入了新的故障点，这意味着如果你的服务器或\
  \ CDN 任何一个宕机，你的网站将无法工作。但你不必过度担心这个问题。大多数 CDN 都提供高程度的冗余，确保了极高的运行时间。我不是说 CDN 永远不会宕机，但这种风险与其提供的性能收益相比是不足道的。\n\
  \n只需记住，CDN 宕机并非罕见，即使是那些被认为极其稳定的流行的 CDN 也是如此。例如，Amazon Web Service (AWS) 过去曾宕机，由于依赖它的网站数量众多，这始终是一个备受关注的事件。2012\
  \ 年 10 月，AWS 宕机，导致 Reddit 和 Netflix 等主要网站也随之崩溃。\n\n### 在 EC2 上部署 Node 服务器\n\n除了将静态前端资源部署到\
  \ CDN 之外，你还可以将你的 Node 实现部署到云服务器，例如 Amazon 的 Elastic Compute Cloud (EC2)。EC2 服务器非常棒，因为它们是可扩展的，这意味着你可以在需要时增加资源，在不需要时避免付费。因此，你获得了一个兼顾两者的解决方案：在低谷期很便宜，但可以处理你抛给它的几乎任何负载。当然，你使用的资源越多，在托管上的花费就越高。但别担心；你可以设置自己能接受的限制。\n\
  \n要了解更多关于如何将 Node 服务器部署到 EC2，请访问[`http://rsms.me/2011/03/ec2-wep-template.html`](http://rsms.me/2011/03/ec2-wep-template.html)。\n\
  \n## 发布\n\n万事大备，你终于准备好发布了。所以不要太掉以，因为问题总是会发生。我希望你在书中发现了一些新技巧，但更重要的是，我希望这本书让你对 JavaScript\
  \ 产生了兴趣。JavaScript 中充满了许多乐趣，而这只是这个不断演变的语言的开始。\n\n你始终可以找到新的库来简化你开发的各个方面，以及所有不断增强你所能实现能力的\
  \ DOM API。此外，如果你为你想要的某个功能找不到浏览器级别的 API，你完全可以打赌在某个时刻会有一个一个——毕竟，你可以自己提建议。\n\n所以，继续学习，继续编码吧！\n\
