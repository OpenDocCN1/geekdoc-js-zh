  - Flatiron：[`http://flatironjs.org/`](http://flatironjs.org/)\n\n# 第 8 章\n\n## MongoDB\n\
  \n在本章中，你首先发现了 NoSQL 数据库的优势以及为什么许多新项目正在使用它们。然后你学习了如何安装 `MongoDB` 以及适用于 Node 的原生 `MongoDB`\
  \ 驱动。\n\n接下来你学习了如何使用 `MongoDB` 驱动创建数据库。你还学习了如何使用 `MongoDB` 强大的查询选项（例如正则表达式和运算符）从数据库读取项。此外，你学习了如何更新和删除数据库项，完成了\
  \ CRUD 系统。\n\n在确定了如何使用原生 `MongoDB` 驱动后，你学习了 `Mongoose`，这是一个用于 Node 和 `MongoDB` 的对象建模包。`Mongoose`\
  \ 提供了在模型中保存数据并将这些模型同步到 MongoDB 服务器的功能，就像你在 第 3 章中通过 Backbone 一样。\n\n最后，你了解了 Node\
  \ 的其他数据库模块，例如 `MySQL` 模块和另一种名为 `Redis` 的 NoSQL 数据库。\n\n## NoSQL 有什么好处？\n\n\n\n\n\
  \n在过去的 30 年里，数据库设计的主流模型一直是如 `MySQL` 等关系型数据库。然而，最近的趋势是背离传统的关系型数据库模型。这种趋势被称为 `NoSQL`（或不仅\
  \ SQL）。由于多种原因，非关系 `NoSQL` 数据库是一种非常有吸引力的替代方案，主要是可扩展性和简单性。考虑到 Node.js 项目通常有共同的目标，许多项目使用\
  \ NoSQL 数据库是有合理的。\n\n## 可扩展性\n\n使用像 `MongoDB` 这样的 NoSQL 数据库的主要原因之一是其内置的分片（sharding）功能。分片允许你将单个数据库分发到机器集群上，这意味着你可以进行水平扩展（分发负载），而不是纵向扩展（购买更强大的服务器）。水平扩展与云模型相得益彰，因为你的\
  \ `NoSQL` 云端可以根据需要增加资源来处理负载，而不是让一个长时间空置的强力服务器。\n\n除了负载之外，分片还能帮助服务器处理大数据。数据库中存储的数据量正呈指数级增长，以至于某些数据库对于单个服务器来说太太大了。对于这些数据库，跨集群的分发变成了一种必要。相比之下，传统的关系型数据库是在我们还没有处理大规模数据需求之前构建的。分发如\
  \ `MySQL` 这样的数据库并非不可能，但比分发专为分片设计的数据库要挑战性得多。\n\n## 简单性\n\n`NoSQL` 数据库扩展得如此好的原因之一是，它们从底层就是为了简单而构建的。除了分片，这种简单性还带来了额外的优势。由于由于解决了我们今天面临的许多管理问题的管理工具，`NoSQL`\
  \ 数据库更容易管理。这些工具允许许多 `NoSQL` 实现放弃了与关系型数据库通常关联的数据库管理员（DBA）。当然，这种简单性是以功能性为代价的。但如果你在数据库软件中只需要简单的功能，非关系数据库是无可比拟的。\n\
  \n## 开始使用 MongoDB\n\n`MongoDB` 是一种在 Node 开发中非常流行的 NoSQL 数据库。幸运的是，开始使用 `MongoDB`\
  \ 相对容易。在本节中，你将学习如何安装 `MongoDB` 以及几个 Node 驱动程序。然后运行数据库服务器并创建你的第一个数据库。\n\n### 安装 MongoDB\n\
  \n在使用 `MongoDB` 之前，你必须安装它。与其他 Node 模块不同，`MongoDB` 模块仅仅是一个驱动程序。这意味着在使用它之前，你必须在系统上安装\
  \ `MongoDB`。\n\n#### Mac 安装\n\n在 Mac 上安装 `MongoDB` 的简单方法是使用像 MacPorts 或 Homebrew\
  \ 的包管理器。如果你使用 MacPorts（[`http://www.macports.org/install.php`](http://www.macports.org/install.php)），只需输入以下命令：\n\
  \n```bash\nsudo port install mongodb\n```\n\n同样，如果你使用 Homebrew（[`http://mxcl.github.com/homebrew`](http://mxcl.github.com/homebrew/)`),输入以下内容：\n\
  \n```bash\nsudo brew install mongodb\n```\n\n或者，你可以手动安装 `MongoDB`。首先，从[`http://downloads.mongodb.org/osx/mongodb-osx-x86_64-2.2.2.tgz`](http://downloads.mongodb.org/osx/mongodb-osx-x86_64-2.2.2.tgz)\
  \ 下载 tar 包并解压内容。然后将 `PATH` 变量设置为你解压 `MongoDB` 核心的地方——这样你就可以轻松地使用它的命令了。在 `~/.bash_profile`\
  \ 的 `PATH` 声明中添加 `MongoDB` 目录。\n\n无论你在 Mac 上如何安装 `MongoDB`，你都还需要设置数据目录：\n\n```bash\n\
  sudo mkdir -p /data/db\nsudo chown id -u /data/db\n```\n\n这些命令以适当的权限设置了目录。\n\nMac\
  \ 有一个名为 `MongoHub` 的优秀 GUI 工具，你可以从[`http://mongohub.todayclose.com`](http://mongohub.todayclose.com/)\
  \ 下载。该工具在图 8-1 所示，可以帮助你管理数据库。\n\n`MongoHub` 非常适合管理数据库的复杂方面，当你不想麻烦学习如何通过 API 操作时。它还提供了一个监控器，你可以它实时查看数据库的活动。\n\
  \n![9781118524565-fg0801.eps](img/9781118524565-fg0801_fmt.png)\n\n图 8-1 用于 Mac\
  \ 的 MongoHub GUI 工具。\n\n#### Ubuntu 安装\n\n首先，为了验证 `apt-get` 包，请从 `MongoDB` 创建者处安装公共\
  \ GPG 密钥：\n\n```bash\nsudo apt-key adv --keyserver keyserver.ubuntu.com --recv 7F0CEB10\n\
  ```\n\n接下来创建一个 `/etc/apt/sources.list.d/10gen.list` 文件，并添加以下文本：\n\n```text\ndeb\
  \ http://downloads-distro.mongodb.org/repo/ubuntu-upstart dist 10gen\n```\n\n回到终端，重新加载存储库并安装最新稳定版本的\
  \ `MongoDB`：\n\n```bash\nsudo apt-get update\nsudo apt-get install mongodb-10gen\n\
  ```\n\n#### Windows 安装\n\n首先，从[`http://www.mongodb.org/downloads`](http://www.mongodb.org/downloads)\
  \ 下载最新的稳定版本。确保获取适用于你的 Windows 的版本（64 位或 32 位）。解压该文件内容并移动到 `C:\\mongodb`。你可以从 Windows\
  \ 命令行提示符移动它：\n\n```cmd\ncd \\\nmove C:\\mongodb-win32-* C:\\mongodb\n```\n\n最后，为\
  \ `MongoDB` 创建数据目录：\n\n```cmd\nmd data\nmd data\\db\n```\n\n`MongoDB` 的文档中提供了其他操作系统的安装说明。访问[`http://docs.mongodb.org/manual/installation`](http://docs.mongodb.org/manual/installation/)\
  \ 获取信息。\n\n## 运行 MongoDB\n\n安装 `MongoDB` 后，你就可以准备好运行它了。你可以在 Mac 上使用以下命令：\n\n```bash\n\
  mongod\n```\n\n或者在 Ubuntu 上使用：\n\n```bash\nsudo service mongodb start\n```\n\n或者在\
  \ Windows 上，从命令行提示符运行 `.exe` 文件：\n\n```cmd\nC:\\mongodb\\bin\\mongod.exe\n```\n\n\
  如果你在终端中看到一些输出并且命令仍在运行，你就知道一切正常。请参见图 8-2。\n\n![9781118524565-fg0802.tif](img/9781118524565-fg0802_fmt.png)\n\
  \n图 8-2 如果你的终端看起来像这样，MongoDB 正在运行。\n\n如果你在运行 `mongod` 命令遇到困难，请确保 `MongoDB` 已添加到你的\
  \ `PATH` 变量。包管理器会自动处理，但如果你是手动安装的 `MongoDB` 则必须手动设置。\n\n### 安装 MongoDB 模块\n\n一旦 `MongoDB`\
  \ 在你的系统中运行，你需要安装模块与数据库通信。在本章中，你将学习使用两个不同的模块：\n\n- MongoDB 原生 Node.js 驱动：JavaScript\
  \ 基础 MongoDB 支持\n- `Mongoose`：提供对象关系映射（ORM）的对象建模工具\n\n但现在，只需使用 `NPM` 安装原生驱动：\n\n\
  ```bash\nnpm install mongodb\n```\n\n### 创建数据库\n\n一旦 `MongoDB` 运行且 Node.js 驱动已安装，你就可以准备好创建一个数据库。首先，在\
  \ Node 中引入 `MongoDB` 模块：\n\n```javascript\nvar mongodb = require('mongodb');\n```\n\
  \n然后创建一个新数据库：\n\n```javascript\nvar dbServer = new mongodb.Server('localhost', 27017,\
  \ {auto_reconnect: true});\nvar db = new mongodb.Db('mydb', dbServer, {w: 1});\n\
  ```\n\n这里发生了几件事：\n\n1. `new mongodb.Server('localhost', 27017, {auto_reconnect:\
  \ true})` 连接到 MongoDB 服务器。它使用默认主机（localhost）和默认端口（27017）。`auto_reconnect` 允许在连接中断时自动重连。\n\
  \n2. `new mongodb.Db()` 创建一个新的数据库，在此例中 `mydb`。如果该数据库已存在，它将引用已存在的数据库。\n\n\n\n\n\n\
  3. `mongodb.Db()` 的第三个参数 `{w: 1}` 设置了写关注（write concern），表示这是主 `mongod` 实例。只要你的服务器上没有多个\
  \ MongoDB 实例，这行代码就能正常工作。但如果你想了解更多其他选项，请访问 [`http://docs.mongodb.org/manual/core/write-operations/#write-concern`](http://docs.mongodb.org/manual/core/write-operations/#write-concern)。\n\
  \n如果你需要对数据库进行身份验证，可以使用 `db.authenticate(user, password, function() { /* callback\
  \ */ })` 来实现。\n\n# MongoDB CRUD 操作\n\n在本节中，你将学习如何使用 MongoDB 中的 CRUD 来创建、读取、更新和删除文档。这四种操作代表了任何持久化存储系统（如数据库）的基本需求。\n\
  \n到目前为止，你已经包含了 MongoDB 模块并创建了一个新数据库。然而，如果你在 MongoHub 或或其他 GUI 工具上查看服务器，你会发现数据库并不存在。这是因为在创建它之前，仍然需要添加集合（collections）。\n\
  \nMongoDB 是一个基于文档的数据库，因此条目被称为文档（documents）。\n\n## 创建集合\n\n与 MySQL 等其他使用表（tables）表示数据的数据库不同，MongoDB\
  \ 使用集合，集合用简单的 JSON 对象表示。作为一名 JavaScript 开发者，这听起来应该如是悦耳。但在添加集合之前，你首先需要使用之前定义的 `db`\
  \ 变量连接到数据库：\n\n```javascript\ndb.open( function(err, conn) {\n});\n```\n\n在这里，你可以看到\
  \ Node 中一个熟悉的模式：一个异步回调，第一个参数是一个错误对象。\n\n## 添加集合\n\n接下来，在这个回调中，向数据库添加一个集合：\n\n```javascript\n\
  db.open( function(err, conn) {\n  // 向 db 添加一个集合\n  db.collection('myCollection',\
  \ function(err, collection) {\n    // 向集合中插入一个文档\n    collection.insert({\n    \
  \  a: 'my item'\n    }, function(err, result) {\n      // 打印结果\n      console.log(result);\n\
  \      // 关闭连接\n      db.close();\n    });\n  });\n});\n```\n\n以下是执行过程说明：\n\n1.\
  \ `db.collection()` 创建了一个名为 `myCollection` 的新集合。\n2. 在下一个回调中，使用 `collection.insert()`\
  \ 向集合中添加文档。这使用了传递给回调的 `collection` 对象。如你所见，插入的结构是一个简单的 JSON 对象，`{a: ‘my-item'}`。\n\
  3. 最后，在插入的回调中，将结果打印到控制台，并使用 `db.close()` 关闭数据库连接。在使用完毕后不要忘记关闭 MongoDB 连接。\n\n现在在\
  \ Node 中运行该脚本。图 8-3 显示了创建的数据库和集合。\n\n![9781118524565-fg0803.eps](img/9781118524565-fg0803_fmt.png)\n\
  \n图 8-3 MongoHub 显示新的数据库和集合。\n\n为了让示例更短，我避免了捕获任何错误。但如果在运行此脚本时遇到问题，你应该 `console.log()`\
  \ 来查找错误。\n\n## 唯一标识符\n\n当你运行此脚本时，你可能会在 Node 控制台中发现数据库条目的结果并不是简单的 `{a: ‘my item'}`（见图\
  \ 8-4）。这是因为 MongoDB 为文档添加了标识符 `_id`。MongoDB 存储在数据库中的所有内容都需要这些唯一标识符，因此在默认情况下，每当你创建新文档时，它都会添加它们。\n\
  \n![9781118524565-fg0804.tif](img/9781118524565-fg0804.png)\n\n图 8-4 控制台中数据库条目的结果。\n\
  \n但是，如你所见，这些标识符既冗长又难以处理。尽管它们在 MongoDB 内部运行良好，但你通常希望避免使用它们来引用数据库中的文档。与其他数据库一样，当需要一个标识符时，添加自己的键是一个好主意——例如\
  \ `{id: 1}`。\n\n## 读取数据\n\n在向数据库添加文档后，你可以使用 `find()` 读取它们。此 API 提供了许多实用的功能，允许你选择特定文档、利用选择器（selectors）并对数据进行排序。\n\
  \n在使用 `find()` API 之前，先创建一个新集合来操作：\n\n```javascript\n// 打开数据库\ndb.open( function(err,\
  \ conn) {\n  // 选择集合\n  db.collection('myNewCollection', function(err, collection)\
  \ {\n    // 缓存一个计数变量\n    var count = 0;\n    // 向集合中插入数字\n    for ( var i = 0;\
  \ i < 5; i++ ) {\n      collection.insert({\n        num: i\n      }, function(err,\
  \ result) {\n        // 打印结果\n        console.log(result);\n        // 增加计数值\n \
  \       count++;\n        // 如果计数足够高，关闭连接\n        if ( count > 4 ) {\n        \
  \  db.close();\n        }\n      });\n    }\n  });\n});\n```\n*(注：此处原文代码块似乎存在闭合括号缺失或截断，已按逻辑尽可能翻译并保持结构)*\n\
  *纠正：原文提供的代码块在 `find()` 之后逻辑混乱，翻译时保留了其原始结构：*\n\n```javascript\n// open database\n\
  db.open( function(err, conn) {\n  // select the collection\n  db.collection('myNewCollection',\
  \ function(err, collection) {\n    // cache a count variable\n    var count = 0;\n\
  \    // insert numbers into the collection\n    for ( var i = 0; i < 5; i++ ) {\n\
  \      collection.insert({\n        num: i\n      }, function(err, result) {\n \
  \       // log the result\n        console.log(result);\n        // increment the\
  \ count value\n        count++;\n        // if the count is high enough, close the\
  \ connection\n        if ( count > 4 ) {\n          db.close();\n        }\n   \
  \   });\n    }\n  });\n```\n*(注：原文文本中 `find()` 之后的部分似乎存在排版错误或截断，以下为基于原文逻辑的翻译延续)*\n\
  \n```javascript\n这创建了一个名为 `myNewCollection` 的集合。你可以看到，`find()` 使用某些值来选择数据。\n\n```text\n\
  { num: 0, _id: 50dc93c46f8df0000000001 }\n{ num: 4, _id: 50dc93c46f8df0000000005\
  \ }\n{ num: 3, _id: 50dc93c46f8df0000000004 }\n{ num: 2, _id: 50dc93c46f8df0000000003\
  \ }\n{ num: 1, _id: 50dc93c46f8df0000000002 }\n```\n*(注：原文此段落逻辑较为混乱，翻译已尽量遵循原文行结构)*\n\
  \n## 选择集合中的所有条目\n\n现在已经创建了集合，你可以通过代码选择数据库中的所有数据：\n\n```javascript\ndb.open( function(err,\
  \ conn) {\n  // 选择集合\n  db.collection('myNewCollection', function(err, collection)\
  \ {\n    // 选择集合中的所有文档\n    collection.find().toArray(function(err, result) {\n\
  \      // 打印结果\n      console.log(result);\n      // 关闭连接\n      db.close();\n \
  \   });\n  });\n});\n```\n\n如你所见，控制台输了所有数据：\n\n```text\n[\n  { num: 0, _id: 50dc93c46f8df0000000001\
  \ },\n  { num: 1, _id: 50dc93c46f8df0000000002 },\n  { num: 2, _id: 50dc93c46f8df0000000003\
  \ },\n  { num: 3, _id: 50dc93c46f8df0000000004 },\n  { num: 4, _id: 50dc93c46f8df0000000005\
  \ }\n]\n```\n\n你可能已经注意到这个集合中的文档现在是正确的顺序，尽管你刚刚看到它们是无序插入的。尽管异步插入调用完成的时间不同，MongoDB\
  \ 的 ID 仍然是正确的顺序。\n\n## 选择特定条目\n\n由于你没有向 `collection.find()` 传递任何参数，它选择了数据库中的所有文档。但你也可以选择特定文档。例如：\n\
  \n```javascript\ndb.collection('myNewCollection', function(err, collection) {\n\
  \  // 选择 num 为 2 的所有文档\n  collection.find({num: 2}).toArray(function(err, result)\
  \ {\n    // 打印数据\n    console.log(result);\n    // 关闭连接\n    db.close();\n  });\n\
  });\n```\n\n此脚本选择了 `num` 值为 `2` 的文档，如下方的输出所示：\n\n```text\n{ num: 2, _id: 50dc93c46f8df0000000003\
  \ }\n```\n\n\n\n\n\n由于只有一个文档的 `num` 值为 `2`，之前的搜索只返回了一个值。如果有多个匹配项，它将返回一个包含所有匹配文档的数组。\n\
  \n## 高级查询选择器\n\n你还可以使用更高级的选择器。例如，要选择所有大于 1 的值，可以使用 `$gt` 算符：\n\n```javascript\n\
  // 选择集合\ndb.collection('myNewCollection', function(err, collection) {\n  // 选择大于\
  \ 1 的数字\n  collection.find({num: {$gt: 1}}).toArray(function(err, result) {\n  \
  \  // 打印数据\n    console.log(result);\n    // 关闭连接\n    db.close();\n  });\n});\n\
  ```\n\n在此处，脚本为 `num` 值传递了一个查询对象 `{$gt: 1}` 以进行匹配，这会选出所有大于 1 的值，如该输出所示：\n\n```\n\
  [ { num: 2, _id: 50dc93c946f8df0000000003 },\n  { num: 3, _id: 50dc93c946f8df0000000004\
  \ },\n  { num: 4, _id: 50dc93c946f8df0000000005 } ]\n```\n\n你可以在查询对象中组合额外的参数。例如，你可以匹配所有大于\
  \ 1 且小于 4 的值：\n\n```javascript\ndb.collection('myNewCollection', function(err, collection)\
  \ {\n  // 选择大于 1 且小于 4 的数字\n  collection.find({num: {$gt: 1, $lt: 4}}).toArray(function(err,\
  \ result) {\n    // 打印数据\n    console.log(result);\n    // 关闭连接\n    db.close();\n\
  \  });\n});\n```\n\n此脚本添加了 `$lt` 算符来拉取同时也小于 4 的值，如下所示：\n\n```\n[ { num: 2, _id:\
  \ 50dc93c946f8df0000000003 },\n  { num: 3, _id: 50dc93c946f8df0000000004 } ]\n```\n\
  \n欲获取可在查询对象中使用的算符完整列表，请访问 [`http://docs.mongodb.org/manual/reference/operators`](http://docs.mongodb.org/manual/reference/operators)。\n\
  \n你甚至可以使用正则表达式在 MongoDB 中选择特定的字符串。只需将正则传递给选择器即可；例如，你可以使用 `collection.find({name:\
  \ /^a/})` 选择所有以“a”开头的名称。\n\n## 限制条目\n\n你还可以限制搜索返回的文档数量：\n\n```javascript\ndb.collection('myNewCollection',\
  \ function(err, collection) {\n  // 选择集合中的所有数据，限制为 3 条目\n  collection.find({}, {limit:\
  \ 3}).toArray(function(err, result) {\n    // 打印数据\n    console.log(result);\n \
  \   // 关闭连接\n    db.close();\n  });\n});\n```\n\n在此处，向 `collection.find()` 传递了第二个参数，它定义了关于搜索的额外信息。在这种情况下，`{limit:\
  \ 3}` 将搜索限制最多返回三个文档，如该输出所示：\n\n```\n[ { num: 0, _id: 50dc93c946f8df0000000001 },\n\
  \  { num: 1, _id: 50dc93c946f8df0000000002 },\n  { num: 2, _id: 50dc93c946f8df0000000003\
  \ } ]\n```\n\n你也可以使用 `findOne()` 代替 `find()` 作为简写方法来返回单个文档。\n\n## 排序条目\n\n此外，你可以在选择文档时对集合中的文档进行排序。\n\
  \n```javascript\ndb.collection('myNewCollection', function(err, collection) {\n\
  \  // 逆排序集合\n  collection.find({}, {sort:[['num', 'desc']]}).toArray(function(err,\
  \ result) {\n    // 打印数据\n    console.log(result);\n    // 关闭连接\n    db.close();\n\
  \  });\n});\n```\n\n在此处，脚本定义了一个 `sort` 参数，按 `num` 字段降序排序。该排序参数接受一个数组，这意味着你可以根据需要对多个列排序。你还可以将其与限制值组合。你可以在这里看到结果：\n\
  \n```\n[ { num: 4, _id: 50dc93c946f8df0000000005 },\n  { num: 3, _id: 50dc93c946f8df0000000004\
  \ },\n  { num: 2, _id: 50dc93c946f8df0000000003 },\n  { num: 1, _id: 50dc93c946f8df0000000002\
  \ },\n  { num: 0, _id: 50dc93c946f8df0000000001 } ]\n```\n\n\n\n\n\n• 回调函数，它还会传递查询结果，`function()\
  \ { ... }` \n\n使用 `findAndModify()` 的另一个注意事项是，回调函数返回的是修改前的文档。例如，在这种情况下，`findAndModify()`\
  \ 返回的是 `{num: 4}` 而不是新的 `{num: 25}`，你可以在此输出中看到：\n\n`{ _id: 50dc93c946f8df0000000005,\
  \ num: 4 }`\n\n# 删除数据\n\n最后，在完善你的 MongoDB 知识体系之前，你仍然需要了解 CRUD 中的 D（Delete，删除）。本小节将教你如何从数据库中移除文档和集合。\n\
  \n## 移除文档\n\n首先，你可以使用 `remove()` 从集合中删除文档。`remove()` 非常直观；你只需要传入想要删除的文档的条件，然后跟上回调函数：\n\
  \n```javascript\ndb.collection('myNewCollection', function(err, collection) {\n\
  \  // remove a document\n  collection.remove({num: 1}, function(err) {\n    if (err)\
  \ {\n      console.log(err);\n    }\n    else {\n      console.log('Successfully\
  \ removed');\n    }\n    db.close({});\n  });\n});\n```\n\n如果你想对正在移除的记录进行任何操作，请使用\
  \ `findAndRemove()`。不过，要小心——与 `findAndModify()` 一样，API 中增加了一个排序参数：\n\n```javascript\n\
  db.collection('myNewCollection', function(err, collection) {\n  // find and remove\n\
  \  collection.findAndRemove({num: 0}, [['_id', 'asc']], function(err, result) {\n\
  \    if (err) {\n      console.log(err);\n    }\n    // log the affected document\n\
  \    else {\n      console.log (result);\n    }\n    db.close({});\n  });\n});\n\
  ```\n\n这的工作方式与 `remove()` 完全相同，只是增加了一个用于排序的第二个参数。此外，查询结果会被传递给回调函数，这允许你输出删除前的文档。\n\
  \n## 集合集合\n\n你也可以删除整个集合。要做到这一点，请使用 `db.dropCollection()`：\n\n```javascript\n// open\
  \ database connection\ndb.open( function(err, conn) {\n  // drop a collection\n\
  \  db.dropCollection('myNewCollection', function(err, result) {\n    if (err) {\n\
  \      console.log(err);\n    }\n    else {\n      console.log(result);\n    }\n\
  \    db.close();\n  });\n});\n```\n\n此脚本会删除你一直在操作的集合。但要小心；正如本章中所有的数据库更改一样，并没有魔法的撤销按钮。\n\
  \n# Mongoose\n\nMongoose 是一个用于 Node 并连接到 MongoDB 的对象建模工具。你已经熟悉 Backbone 了，所以使用 Mongoose\
  \ 将是轻而易举，因为 Mongoose 处理数据的方式与 Backbone 类似，都使用模型和集合。Mongoose 然后将这些模型映射到 MongoDB 数据库，为你节省了大量的额外手动工作。\n\
  \n本节将教你如何安装 Mongoose 并创建模型来存储数据。然后你将学习读取数据的技巧，以及如何从这些从中选择特定的文档和字段。\n\n## 开始使用 Mongoose\n\
  \n使用 NPM 安装 Mongoose 非常简单：\n\n```bash\nnpm install mongoose\n```\n\n在安装 Mongoose\
  \ 及其依赖项后，在 Node 中引入它：\n\n```javascript\nvar mongoose = require('mongoose');\n```\n\
  \n接下来连接到 MongoDB 数据库：\n\n```javascript\nmongoose.connect('localhost', 'mydb');\n\
  ```\n\n这里 Mongoose 将连接到 `localhost` 上的 `mydb` 数据库。\n\n你可能注意到 `connect()` 调用没有包含回调函数。这是因为你必须手动设置这些回调：\n\
  \n```javascript\n// connect to a MongoDB database\nmongoose.connect('localhost',\
  \ 'test');\n// database connection\nvar db = mongoose.connection;\n// error callback\n\
  db.on('error', function(msg) {\n  console.log(\n    'Connection Error: %s', msg\n\
  \  );\n});\n// success callback\ndb.once('open', function callback () {\n  // on\
  \ success\n  console.log('Database opened');\n});\n```\n\n此脚本首先创建一个连接对象，然后绑定两个回调：一个在发生任何错误时触发，另一个在连接打开时触发一次。你在\
  \ Mongoose 中做的几乎所有操作将存在于成功回调中。为了简洁起见，我在后续示例中省略了它，但请假设所有代码都这里。\n\n### 创建模型\n\n你使用模型来定义\
  \ Mongoose 中的所有文档。模型允许你抽象掉数据库系统，并专注于你真正想要的数据：。在本节中，你将学习如何创建一个 schema（模式）来定义模型的结构，然后根据该结构创建并保存模型。\n\
  \n### 创建 Schema\n\n创建模型的第一步是创建一个 schema 来定义模型将使用的数据类型和结构。例如，为不同类型的水果创建一个 schema：\n\
  \n```javascript\n// define the schema\nvar fruitSchema = mongoose.Schema({\n  name:\
  \ String,\n  color: String,\n  quantity: Number,\n  ripe: Boolean\n});\n```\n\n\
  这里定义了一个具有不同字段的 schema，为每个字段设置了原始类型。你也可以通过传递对象而不是原始类型来设置更多信息，如示例所示：\n\n```javascript\n\
  // define the schema\nvar fruitSchema = mongoose.Schema({\n  name: {type: String,\
  \ require: true},\n  color: {type: String, require: true},\n  quantity: Number,\n\
  \  ripe: Boolean\n});\n```\n\n这里定义了模型将使用的数据类型和结构。例如，为不同类型的标识创建一个 schema：\n\n###\
  \ 创建模型\n\n接下来，使用 schema 来在 Mongoose 中定义模型。例如：\n\n```javascript\n// define the model\n\
  var Fruit = mongoose.model('fruit', fruitSchema);\n```\n\n这里使用 `fruitSchema` 创建了模型。接下来创建一个模型实例：\n\
  \n```javascript\n// create a new instance\nvar apple = new Fruit({\n  name: 'apple',\n\
  \  color: 'red',\n  quantity: 3,\n  ripe: true\n});\n```\n\n这里创建了模型。\n\n### 保存模型\n\
  \n仅仅在 Mongoose 中创建模型是不够的——你仍然需要将其保存。要做到这一点，请使用 `save()` 方法：\n\n```javascript\n//\
  \ save the model\napple.save( function(err, apple) {\n  if (err) {\n    console.log(err);\n\
  \  }\n  else {\n    console.log(apple);\n  }\n});\n```\n\n这将模型作为文档保存到 MongoDB。每当你创建或修改模型数据时，只需使用\
  \ `save()` 方法将更改同步到数据库。\n\n### 将前面的代码整合在一起\n\n```javascript\n// include the mongoose\
  \ module\nvar mongoose = require('mongoose');\n// connect to a MongoDB database\n\
  mongoose.connect('localhost', 'mydb');\n// connection\nvar db = mongoose.connection;\n\
  db.on('error', console.error.bind(console, 'Connection error:'));\ndb.once('open',\
  \ function callback () {\n  // define the schema\n  var fruitSchema = mongoose.Schema({\n\
  \    name: String,\n    color: String,\n    quantity: Number,\n    ripe: Boolean\n\
  \  });\n  // define the model\n  var Fruit = mongoose.model('fruit', fruitSchema);\n\
  \  // create a new instance\n  var apple = new Fruit({\n    name: 'apple',\n   \
  \ color: 'red',\n    quantity: 3,\n    ripe: true\n  });\n  // save the model\n\
  \  apple.save( function(err, apple) {\n    if (err) {\n      console.log(err);\n\
  \    }\n    else {\n      console.log(apple);\n    }\n  });\n});\n```\n\n回顾一下这里发生：\n\
  \n1. 脚本开始引入 Mongoose 模块。\n2. 接着建立与数据库的连接，并带有错误和成功回调。\n3. 在打开回调中，脚本定义了一个 schema。\n\
  \n\n\n\n\n4. 它使用 schema 来定义模型并创建该模型的新实例。\n\n5. 模型将被保存为 MongoDB 集合。\n\n## 读取数据\n\n\
  从 Mongoose 集合中读取数据非常简单。但首先向集合中添加一些数据，以便你进行操作：\n\n```javascript\nvar orange = new\
  \ Fruit({\n  name: 'orange',\n  color: 'orange',\n  quantity: 5,\n  ripe: true\n\
  });\n\nvar banana = new Fruit({\n  name: 'banana',\n  color: 'green',\n  quantity:\
  \ 1,\n  ripe: false\n});\n\norange.save( function(err, orange) {\n  if (err) {\n\
  \    console.log(err);\n  }\n  else {\n    console.log(orange);\n  }\n});\n\nbanana.save(\
  \ function(err, banana) {\n  if (err) {\n    console.log(err);\n  }\n  else {\n\
  \    console.log(banana);\n  }\n});\n```\n\n### 查找所有模型\n\n要读取保存到集合中的数据，请在相应的模型上使用\
  \ `find()` 方法：\n\n```javascript\n// define the model\nvar Fruit = mongoose.model('fruit',\
  \ fruitSchema);\n\n// select all the fruit\nFruit.find( function(err, fruit) {\n\
  \  if (err) {\n    console.log(err);\n  }\n  else {\n    console.log(fruit);\n \
  \ }\n});\n```\n\n此代码选择了集合中的所有的模型，如输出所示：\n\n```json\n[ { name: 'apple',\n    color:\
  \ 'red',\n    quantity: 3,\n    ripe: true,\n    _id: 50dcd5b8e890ee50000000001,\n\
  \    __v: 0 },\n  { name: 'orange',\n    color: 'orange',\n    quantity: 5,\n  \
  \  ripe: true,\n    _id: 50dcd5b8e890ee0000000001,\n    __v: 0 },\n  { name: 'banana',\n\
  \    color: 'green',\n    quantity: 1,\n    ripe: false,\n    _id: 50dcd5b8e890ee0000000002,\n\
  \    __v: 0 } ]\n```\n\n### 查找特定模型\n\n你也可以通过向 `find()` 方法传递第一个参数来缩小选择选择的范围：\n\n\
  ```javascript\n// select just the orange\nFruit.find({name: 'orange'}, function(err,\
  \ fruit) {\n  if (err) {\n    console.log(err);\n  }\n  else {\n    console.log(fruit);\n\
  \  }\n});\n```\n\n此代码段仅选择 `name` 值为 `'orange'` 的模型，如输出所示：\n\n```json\n[ { name:\
  \ 'orange',\n    color: 'orange',\n    quantity: 5,\n    ripe: true,\n    _id: 50dcd5b8e890ee0000000001,\n\
  \    __v: 0 } ]\n```\n\nMongoose 支持 MongoDB 所有强大的查询选项。例如，你可以使用正则表达式来选择模型：\n\n```javascript\n\
  // select fruits that end in 'e'\nFruit.find({name: /e$/}, function(err, fruit)\
  \ {\n  if (err) {\n    console.log(err);\n  }\n  else {\n    console.log(fruit);\n\
  \  }\n});\n```\n\n此示例使用正则表达式 `/e$/` 选择了以字母 ‘e’ 结尾的水果，如下：\n\n```json\n[ { name: 'apple',\n\
  \    color: 'red',\n    quantity: 3,\n    ripe: true,\n    _id: 50dcd5b8e890ee50000000001,\n\
  \    __v: 0 },\n  { name: 'orange',\n    color: 'orange',\n    quantity: 5,\n  \
  \  ripe: true,\n    _id: 50dcd5b8e890ee0000000001,\n    __v: 0 } ]\n```\n\n你还可以使用\
  \ MongoDB 的操作符，例如：\n\n```javascript\n// select quantities less than 4\nFruit.find({quantity:\
  \ {$lt: 4}}, function(err, fruit) {\n  if (err) {\n    console.log(err);\n  }\n\
  \  else {\n    console.log(fruit);\n  }\n});\n```\n\n此代码段选择了数量小于 `4` 的水果，如此输出所示：\n\
  \n```json\n[ { name: 'apple',\n    color: 'red',\n    quantity: 3,\n    ripe: true,\n\
  \    _id: 50dcd5b8e890ee50000000001,\n    __v: 0 },\n  { name: 'orange',\n    color:\
  \ 'orange',\n    quantity: 5,\n    ripe: true,\n    _id: 50dcd5b8e890ee0000000001,\n\
  \    __v: 0 } ]\n```\n\n\n\n\n在本章中，你将学习到创建 WebSockets 协议的原因以及它所取代的传统方法。随后，你将直接进入实践并创建一个简单的\
  \ WebSockets 应用程序。你将使用 `Socket.IO` 来在 Node 上创建 socket 服务器，并从浏览器连接到该服务器。接下来，你将使用\
  \ `Socket.IO` 创建一个实时聊天室应用。你将发现如何在服务器和客户端之间中继消息，以及如何将这些信息传递给用户。然后，你用 `Backbone.js`\
  \ 为该应用添加结构，为聊天室添加对多个用户名和时间戳的支持。最后，你将使用 `MongoDB` 实现应用的数据持久化。\n\n本章将本书第三部分中的所有概念结合在一起：`Node.js`、`Express`\
  \ 框架和 `MongoDB`。在本章节结束时，你能够熟练地在 `Node` 中创建自己的实时应用。\n\n# WebSockets 的工作原理\n\n要理解\
  \ WebSockets 是如何工作的，你首先需要理解它们设计旨在取代的传统方法。WebSockets 是解决长期以来轮询方案的解决方案，这些方案对实时数据的响应并不充分。\n\
  \n## 轮询的问题\n\n假设你正在为一个股票行情 Web 应用构建前端。当用户打开页面时，你首先通过 `Ajax` 请求拉取股票价格。然后你轮询服务器（例如每五秒一次），以查看是否发生了价格变化。然而，与其让你定期检查服务器，如果让服务器能够在每次发生变化时都通知你，难道不是更好吗？这本质上就是\
  \ WebSockets 的工作方式：它们在服务器和客户端之间创建了一个双向通信通道。\n\n## 平衡的艺术\n\n如果没有 WebSockets，轮询方案迫使开发者在两个问题之间进行平衡：\n\
  \n*   如果你轮询服务器不够频繁，在变化发生与该变化实际中继给用户之间可能会存在延迟。例如，如果股票价格在五秒结束之前发生了变化，用户将必须等待下一个间隔周期跳动才能看到该变化。\n\
  *   另一方面，如果你轮询服务器过于频繁，会为服务器和客户端产生不必要的负载。如果过去五秒内没有任何变化，为什么要用额外的 `Ajax` 请求减慢浏览器的速度呢？此外，为什么要减慢服务器来处理无意义的请求呢？\n\
  \n最糟糕的部分是，这两个问题是相互影响的。数据更新不够快，导致你刷新得更频繁，这导致了不必要的请求，从而让你刷新得更少（然后你又回到了起点）。如你所见，这个问题可能很难平衡。此外，即使你的服务器能够处理这些负载，你仍然会遇到\
  \ HTTP 延迟问题。对于实时解决方案，你可以将轮询间隔设置为 100 ms 左右，但很有可能数据包通过 `HTTP` 的一个完整往返过程至少需要 200 ms。\n\
  \n## 引入长轮询\n\n为了解决基础轮询方法的问题，创建了长轮询（通常称为 Comet 应用）。长轮询的一种典型方法是在固定的间隔上查询服务器，但与传统的轮询方法不同，连接保持开启状态，服务器只有在有新数据时才会发送响应。长轮询减少了不必要的负载，但仍然没有解决\
  \ `HTTP` 请求的基本延迟问题。Comet 应用的另一个主要缺点是它们经常违反 `HTTP 1.1` 规范，该规范规定客户端不应与服务器维持超过两个并发连接（`http://www.w3.org/Protocols/rfc2616/rfc2616-sec8.html#sec8.1.4`）。\n\
  \n长轮询依赖于 `iframe` 和 `MIME` 黑科技，这足以成为避免它的理由。\n\n# WebSockets 解决方案\n\nWebSockets 协议为轮询困境提供了一个优雅的解决方案。WebSockets\
  \ 在服务器和客户端之间建立了一个开放连接，因此服务器可以在没有被浏览器请求的情况下向浏览器发送内容。这种开放连接允许内容在两个方向上自由流动，比传统的 `HTTP`\
  \ 连接快得多。\n\n## 浏览器支持\n\n尽管你可能迫不及待地想要使用 WebSockets，但请记住它仍然是一项相对新技术。因此，浏览器支持可能是一个问题。幸运的是，在本文编写期间，所有桌面浏览器都完全支持\
  \ WebSockets。然而，微软 `IE9` 及之前的版本不支持 sockets。移动端支持也并不稳定。虽然大多数移动浏览器（如 `iOS Safari`）完全支持\
  \ WebSockets，但 `Android Browser` 或 `Opera Mini` 则不支持。请参见图 9-1 中的支持表。\n\n遗憾的是，如果你想支持旧版本的\
  \ `IE` 和任何版本的 `Android Browser`，你需要使用混合轮询方法。但不要灰馁，在下一节中，你将学习一种 sockets API，它为你想要支持的所有浏览器提供了非常健壮的后备方案。\n\
  \n![97811118524565-fg01.tif](img/97811118524565-fg01.png)\n\n图 9-1 WebSockets 支持\n\
  \n## 开始使用 Socket.IO\n\n`Socket.IO` 是一个用于服务器和客户端的 JavaScript 库，让 WebSocket 通信变得轻而易举。`Socket.IO`\
  \ 在运行时选择最佳传输方法，并为旧浏览器提供回备方案。最棒的是，它支持几乎所有浏览器（甚至是 `IE5`）。要了解更多关于 `Socket.IO` 浏览器支持的信息，请访问\
  \ `http://socket.io/#browser-support`。\n\n在本章中，我假设你正在配合 `Express` 框架使用 WebSockets，正如我在第\
  \ 7 章中所解释。\n\n## 服务器端的 Socket.IO\n\n在本小节中，你把 `Express` 与 `Socket.IO` 结合起来创建你的第一个\
  \ socket 服务器。你将学习如何跟踪连接并向客户端发送消息。首先，使用 `NPM` 安装 `Socket.IO`：\n\n```bash\nnpm install\
  \ socket.io\n```\n\n接下来，确保你的应用已安装 `Express`，并打开 `app.js` 文件。滚动到底部，将 `http.createServer()`\
  \ 调用替换为：\n\n```javascript\nvar server = http.createServer(app),\nio = require('socket.io').listen(server);\n\
  server.listen(app.get('port'), function(){\n  console.log(\"Express server listening\
  \ on port \" + app.get('port'));\n});\n```\n\n这段代码修改了 HTTP 服务器调用，以便创建 socket 服务器。\n\
  \n接下来，添加以下行：\n\n```javascript\nvar activeClients = 0;\n// 连接建立\nio.sockets.on('connection',\
  \ function(socket) {\n  activeClients++;\n  io.sockets.emit('message', {clients:\
  \ activeClients});\n  // 连接断开\n  socket.on('disconnect', function(data) {\n    activeClients--;\n\
  \    io.sockets.emit('message', {clients: activeClients});\n  });\n});\n```\n\n\
  这是一个非常简单的脚本，用于跟踪连接到 socket 服务器的用户数量。首先，通过 `io.sockets.on('connection')` 设置一个事件以跟踪新用户的连接。当该事件触发时，它会增加\
  \ `activeClients` 并通过 socket 连接发送消息。同样，还为特定用户从 socket 断开连接设置了另一个事件。类似的回调函数会触发，这次是减少\
  \ `activeClients` 的数量并通过 socket 发送该数据。\n\n## 客户端的 Socket.IO\n\n\n\n你现在已经设置了一些非常基础的事件，用于传输连接到\
  \ socket 的用户数量的数据。但你仍然需要在客户端连接到 socket 并处理这些数据。本小节将教你如何在客户端设置 socket 监听器，以实时更新视图。\n\
  \n在处理 socket 连接的客户端之前，你需要为页面创建一些标记（markup）来设置快速查看视图。首先，打开 `./routes/index.js` 并确保你已经为应用的根目录设置了路由：\n\
  \n```javascript\nexports.index = function(req, res){\n  res.render('index', { title:\
  \ 'Socket.IO' });\n};\n```\n\n然后打开 `./views/index.html` 并添加以下 Underscore 模板：\n\n\
  ```html\n<p>\n  Connected clients: <span id=\"client-count\">0</span></span>\n</p>\n\
  ```\n\n最后，打开 `./views/layout.html`，在 `</body>` 标签之前添加必要的 `<script>` 标签：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title><%=title %></title>\n  <link rel=\"stylesheet\"\
  \ href=\"/stylesheets/style.css\" />\n</head>\n<body>\n<%=body %>\n<script src=\"\
  /socket.io/socket.io.js\"></script>\n<script src=\"/javascripts/main.js\"></script>\n\
  </body>\n</html>\n```\n\n现在，视图引用了两个脚本：Socket.IO 核心库以及一个你可以用于编写客户端代码的 `main.js` 文件。没有必要将\
  \ `socket.io.js` 文件添加到你的服务器中，因为 Socket.IO 模块会为你处理这一点。\n\n确保已按照第 7 章 中的描述设置了带有 Underscore\
  \ 模板的 Express。否则，只需将本章使用的模板转换为默认的 Jade 模板即可。\n\n现在你准备好从浏览器连接到 socket 了。创建一个名为 `./public/javascripts/main.js`\
  \ 文件并写入以下代码：\n\n```javascript\n// 连接到端口 3000 的 socket\nvar socket = new io.connect(null,\
  \ {port: 3000});\n\n// 当接收到数据时，更新页面上的计数\nsocket.on('message', function(data) {\n\
  \    document.getElementById('client-count').innerHTML = data.clients;\n});\n```\n\
  \n在这里，脚本首先通过 [`http://localhost:3000`](http://localhost:3000) 连接到 WebSocket，因为 Node\
  \ 服务器就在那里。一旦用户连接，它将在服务器端触发 `io.socket.on('connection')` 事件。然后每当从 socket 接收到数据时，就会触发回调函数。该数据将用于根据适当的连接用户数量更新页面上的计数。\n\
  \n现在服务器和客户端的 WebSocket 功能已经创建，你准备好测试该应用程序了。启动你的 Express 服务器并打开 [`http://localhost:3000`](http://localhost:3000)；你应该能看到\
  \ `Connected lients: 1`，如图 9-2 所示。\n\n![9781118524565-fg0902.eps](img/9781118524565-fg0902_fmt.png)\n\
  \n图 9-2 正在通过 WebSocket 注册一个连接。\n\n现在在另一个标签页中打开同一个页面，你应该看到计数增加到 2。因为它们是使用 WebSocket\
  \ 连接的，更改将在两个页面上实时反映。接下来，关闭其中一个页面，你会看到计数跳回到 1。恭喜，你构建了第一个 WebSocket 应用！\n\n# 构建实时聊天室\n\
  \n你已经掌握了 WebSocket 的基础，但到目前为止这个计数应用并不完善。幸运的是，扩展它来创建一个聊天室并不困难。\n\n## 创建聊天室\n\n首先，你需要为聊天室创建一个视图。修改\
  \ `index.html` 如下：\n\n```html\n<div id=\"chat\">\n  <form id=\"message-form\">\n\
  \    <input id=\"message\" type=\"text\" autocomplete=\"off\" />\n    <button type=\"\
  submit\">Send</button>\n  </form>\n  <div id=\"messages\"></div>\n</div>\n```\n\n\
  接下来，在 `./public/stylesheets/style.less` 中添加一些样式：\n\n```less\n#chat {\n  width: 300px;\n\
  \  height: 400px;\n  border: 1px solid #ccc;\n  display: flex;\n  flex-direction:\
  \ column;\n\n  #messages {\n    flex: 1;\n    overflow-y: scroll;\n    margin-bottom:\
  \ 10px;\n  }\n\n  #message-form {\n    display: flex;\n  }\n}\n```\n\n现在，在 `./public/javascripts/main.js`\
  \ 中引入 jQuery 并处理逻辑：\n\n```javascript\n// 连接到端口 3000 的 socket\nvar socket = new io.connect(null,\
  \ {port: 3000});\n\n$(function).ready(function() {\n  $('#message-form').on('submit',\
  \ function(e) {\n    e.preventDefault();\n    var message = $('#message').val();\n\
  \    socket.emit('newchat', message);\n    $('#message').val('');\n  });\n\n  socket.on('chat',\
  \ function(data) {\n    $('#messages').append('<div>').text(data).append('</div>');\
  \ \n  });\n\n  socket.on('message', function(data) {\n    $('#client-count').html(data.clients);\n\
  \  });\n});\n```\n\n我假设你已经熟悉了 LESS，如果不熟悉，可以查看附录 A，或者直接将样式转换为普通的 CSS。\n\n## 向服务器提交消息\n\
  \n脚本现在变得稍微复杂了一些，你可以将 jQuery 下载到你的 `./public/javascripts/` 目录。。在 `views/layout.html`\
  \ 中包含它：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title><%=title %></title>\n\
  \  <link rel=\"stylesheet\" href=\"/stylesheets/style.css\" />\n</head>\n<body>\n\
  <%=body %>\n<script src=\"/socket.io/socket.io.js\"></script>\n<script src=\"/javascripts/jquery.min.js\"\
  ></script>\n<script src=\"/javascripts/main.js\"></script>\n</body>\n</html>\n```\n\
  \n现在，设置服务器来处理 `newchat` 消息。修改 `app.js` 如下：\n\n```javascript\nio.on('connection',\
  \ function(socket) {\n  activeClients++;\n  io.emit('message', {clients: activeClients});\n\
  \n  socket.on('newchat', function(data) {\n    io.emit('chat', data);\n  });\n\n\
  \  socket.on('disconnect', function() {\n    activeClients--;\n    io.emit('message',\
  \ {clients: activeClients});\n  });\n});\n```\n\n\n\n\n服务器端的更改非常简单，如代码中的**加粗部分**所示。首先，为\
  \ `newchat` 事件注册了一个处理器。该处理器简单地将该事件的数据通过 socket 发送回，以便所有连接的客户端都能注册新消息。\n\n### 在客户端上显示新消息\n\
  \n现在，当用户提交新消息时，它会通过 socket 传递给服务器，然后服务器将其通过 socket 传回所有已连接的客户端。你需要捕获这个新事件，然后在 `main.js`\
  \ 中的客户端侧显示消息：\n\n```javascript\nvar socket,\n    Chat = {};\nChat.init = function(setup)\
  \ {\n  // 连接到 socket\n  socket = new io.connect(setup.host);\n  // 当接收数据时，更新用户计数\n\
  \  socket.on('message', function(data) {\n    setup.dom.count.text(data.clients);\n\
  \  });\n  // 为聊天框绑定提交事件\n  setup.dom.form.submit(Chat.submit);\n  // 处理新聊天\n  Chat.$chatroom\
  \ = setup.dom.room;\n  socket.on('chat', Chat.printChat);\n};\n// 将新聊天提交到服务器\nChat.submit\
  \ = function(e) {\n  e.preventDefault();\n  // 获取输入框文本并清空\n  var $message = $(e.target.message),\n\
  \  text = $message.val();\n  $message.val('');\n  // 通过 socket 发送消息\n  socket.emit('newchat',\
  \ {text: text});\n};\n// 在聊天室中打印新聊天\nChat.printChat = function(data) {\n  var $newChat\
  \ = $('<p>' + data.text + '</p>');\n  $newChat.appendTo(Chat.$chatroom);\n  // 滚动到底部\n\
  \  Chat.$chatroom.animate({ scrollTop: Chat.$chatroom.height() }, 100);\n};\n$(function()\
  \ {\n  // 初始化聊天应用\n  Chat.init({\n    host: 'http://localhost:3000',\n    dom: {\n\
  \      count: $('#client-count'),\n      form: $('.chatbox'),\n      room: $('#chatroom')\n\
  \    }\n  });\n});\n```\n\n在加粗部分，该脚本为 `chat` 事件定义了一个处理器 `Chat.printChat`。该事件简单地创建一个带有文本的新\
  \ `<p>` 标签，并将其附加到聊天室的 `<div>` 中。它会滚动到该 `<div>` 的底部，以便最新的消息始终显示出来。\n\n现在在几个不同的标签页中启动\
  \ [`http://localhost:3000`](http://localhost:3000)。当你从任何一个标签页发送消息时，你会在每个标签页上看到显示，如图\
  \ 9-4 所示。\n\n![9781118524565-fg0904.eps](img/9781118524565-fg0904_fmt.png)\n\n图\
  \ 9-4：聊天应用现在可以工作了，消息会被中继给所有连接的用户。\n\n### 使用 Backbone.js 添加结构\n\n到目前为止，基础聊天室应用已经运行了，但还有很多需要添加的内容。不过，在深入研究额外功能之前，引入一些\
  \ Backbone 是个好主意。\n\n#### 在 Layout.html 中添加脚本\n\n首先，将 Backbone.js 和 Underscore.js\
  \ 的最新版本放在 `./public/javascripts` 目录下。然后在 `layout.html` 中包含这些脚本：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title><%=title %></title>\n  <link rel=\"stylesheet\"\
  \ href=\"/stylesheets/style.css\" />\n</head>\n<body>\n<%=body %>\n<script src=\"\
  /javascripts/jquery-1.8.3.min.js\"></script>\n<script src=\"/javascripts/underscore.min.js\"\
  ></script>\n<script src=\"/javascripts/backbone.min.js\"></script>\n<script src=\"\
  /socket.io/socket.io.js\"></script>\n<script src=\"/javascripts/main.js\"></script>\n\
  </body>\n</html>\n```\n\n#### 模型 (Models) 和集合 (Collections)\n\n使用 Backbone 构建时，，始终从模型和集合开始。因此，将这些添加到\
  \ `main.js` 中：\n\n```javascript\n// Models & Collections\nChat.Message = Backbone.Model.extend({\n\
  \  defaults: {\n    text: ''\n  }\n});\nChat.Messages = Backbone.Collection.extend({\n\
  \  model: Chat.Message\n});\n```\n\n如你所见，对于这个应用来说，模型是非常基本的。\n\n# 视图 (Views)\n\n\
  虽然模型很简单，但视图要复杂一些。你可能还记得在第 3 章中你使用 Backbone 创建了嵌套视图。本章也涵盖了类似的方法，因为你需要一个用于聊天室的主视图，它将填充每个每条消息的子视图。\n\
  \n我在这一节中进展得相当快，但脚本几乎完全遵循了第 3 章中嵌套视图的示例。如果你需要复习，可以随时翻回第 3 章。\n\n从子视图开始，它是非常基本的。首先，它创建一个带有文本的\
  \ `<p>`。接下来，它定义了一个 `render()` 函数，获取模型文本，然后将其附加到父视图 `<div>` 中。\n\n```javascript\n\
  Chat.MessageView = Backbone.View.extend({\n  tagName: 'p',\n  render: function()\
  \ {\n    // 添加消息文本\n    this.$el.text(this.model.get('text'));\n    // 将新消息附加到父视图\n\
  \    this.parentView.$el.append(this.$el);\n    return this;\n  }\n});\n```\n\n\
  接下来，创建父视图：\n\n```javascript\nChat.MessagesView = Backbone.View.extend({\n  el: '#chatroom',\n\
  \  initialize: function() {\n    // 将 \"this\" 绑定到 render\n    _.bindAll(this, 'render');\n\
  \    // 在集合上注册处理器\n    this.collection.on('change', this.render);\n    this.collection.on('add',\
  \ this.render);\n    this.collection.on('remove', this.render);\n  },\n  render:\
  \ function() {\n    // 清空容器\n    this.$el.empty();\n    // 遍历集合\n    this.collection.each(function(message)\
  \ {\n      var messageView = new Chat.MessageView({\n        model: message\n  \
  \    });\n      // 在视图中保存对 this 的引用\n      messageView.parentView = this;\n    \
  \  // 渲染\n      messageView.render();\n    });\n    // 滚动到底部\n    this.$el.animate({\
  \ scrollTop: this.$el.height() }, 100);\n    return this;\n  }\n});\n```\n\n## 将\
  \ Backbone 接入应用\n\n现在模型、集合和视图已经在 Backbone 中设置好了，但它们仍需连接到应用：\n\n```javascript\nChat.init\
  \ = function(setup) {\n  // 连接到 socket\n  socket = new io.connect(setup.host);\n\
  \  // 当接收数据时，更新用户计数\n  socket.on('message', function(data) {\n    setup.dom.count.text(data.clients);\n\
  \  });\n  // 初始化集合与视图\n  Chat.messages = new Chat.Messages();\n  Chat.messagesView\
  \ = new Chat.MessagesView({\n    collection: Chat.messages\n  });\n  // 为聊天框绑定提交事件\n\
  \  setup.dom.form.submit(Chat.submit);\n  // 处理新聊天\n  Chat.$chatroom = setup.dom.room;\n\
  \  socket.on('chat', Chat.addMessage);\n};\n// 将新消息添加到聊天室\nChat.addMessage = function(data)\
  \ {\n  Chat.messages.add(data);\n};\n```\n\n\n\n\n\n# 模型与集合 (Models & Collections)\n\
  \n```javascript\nChat.Message = Backbone.Model.extend({\n  defaults: {\n    text:\
  \ ''\n  }\n});\nChat.Messages = Backbone.Collection.extend({\n  model: Chat.Message\n\
  });\n```\n\n# 视图 (Views)\n\n```javascript\nChat.MessageView = Backbone.View.extend({\n\
  \  tagName: 'p',\n  render: function() {\n    // 添加消息文本\n    this.$el.text(this.model.get('text'));\n\
  \    // 将新消息添加到父视图中\n    this.parentView.$el.append(this.$el);\n    return this;\n\
  \  }\n});\nChat.MessagesView = Backbone.View.extend({\n  el: '#chatroom',\n  initialize:\
  \ function() {\n    // 将 \"this\" 上下绑定到 render 函数\n    _.bindAll(this, 'render');\n\
  \    // 为集合绑定各种事件\n    this.collection.on('change', this.render);\n    this.collection.on('add',\
  \ this.render);\n    this.collection.on('remove', this.render);\n    // 渲染初始状态\n\
  \    this.render();\n  },\n  render: function() {\n    // 清空容器\n    this.$el.empty();\n\
  \    // 遍历集合中的消息\n    this.collection.each(function(message) {\n      var messageView\
  \ = new Chat.MessageView({\n        model: message\n      });\n      // 在子视图中保存此视图的引用\n\
  \      messageView.parentView = this;\n      // 渲染它\n      messageView.render();\n\
  \    }, this);\n    // 滚动到部\n    this.$el.animate({ scrollTop: this.$el.height()\
  \ }, 100);\n    return this;\n  }\n});\n```\n\n# 初始化函数 (init function)\n\n```javascript\n\
  Chat.init = function(setup) {\n  // 连接到 socket\n  socket = new io.connect(setup.host);\n\
  \  // 当接收数据时，更新用户数量\n  socket.on('message', function(data) {\n    setup.dom.count.text(data.clients);\n\
  \  });\n  // 初始化集合与视图\n  Chat.messages = new Chat.Messages();\n  Chat.messagesView\
  \ = new Chat.MessagesView({\n    collection: Chat.messages\n  });\n  // 绑定聊天框的提交事件\n\
  \  setup.dom.form.submit(Chat.submit);\n  // 处理新聊天\n  Chat.$chatroom = setup.dom.room;\n\
  \  socket.on('chat', Chat.addMessage);\n};\n// 向服务器提交新聊天\nChat.submit = function(e)\
  \ {\n  e.preventDefault();\n  // 获取输入文本并将其清空\n  var $message = $(e.target.message),\n\
  \  text = $message.val();\n  $message.val('');\n  // 通过 socket 发送消息\n  socket.emit('newchat',\
  \ {text: text});\n};\n// 向聊天室添加新消息\nChat.addMessage = function(data) {\n  Chat.messages.add(data);\n\
  };\n```\n\n```javascript\n$(function() {\n  // 初始化聊天应用\n  Chat.init({\n    host:\
  \ 'http://localhost:3000',\n    dom: {\n      count: $('#client-count'),\n     \
  \ form: $('.chatbox'),\n      room: $('#chatroom')\n    }\n  });\n});\n```\n\n#\
  \ 添加用户 (Adding Users)\n\n现在聊天室已经构建了更具结构的结构，是时候添加更多功能了。首先，目前来看，聊天室对于通信来说并不实用，因为用户无法判断是谁在说什么。首先，创建一个提示框让用户输入名字：\n\
  \n```javascript\nChat.init = function(setup) {\n  // 连接到 socket\n  socket = new\
  \ io.connect(setup.host);\n  // 当接收数据时，更新用户数量\n  socket.on('message', function(data)\
  \ {\n    setup.dom.count.text(data.clients);\n  });\n  // 获取用户名\n  Chat.username\
  \ = Chat.getUsername();\n  // 初始化集合与视图\n  Chat.messages = new Chat.Messages();\n\
  \  Chat.messagesView = new Chat.MessagesView({\n    collection: Chat.messages\n\
  \  });\n  // 绑定聊天框的提交事件\n  setup.dom.form.submit(Chat.submit);\n  // 处理新聊天\n  Chat.$chatroom\
  \ = setup.dom.room;\n  socket.on('chat', Chat.addMessage);\n};\n// 获取用户名字\nChat.getUsername\
  \ = function() {\n  return prompt(\"你的名字是什么？\") || 'Anonymous';\n};\n```\n\n在这里，`Chat.getUsername()`\
  \ 函数使用基础的 `prompt` 来获取用户名，你可以在图 9-5 中看到它。\n\n图 9-5 此提示框获取了用户名。该提示框非常基础，你可以随地用模态对话框替换它。`Chat.getUsername()`\
  \ 返回用户输入的内容，或者在用户取消提示框时返回“Anonymous”（匿名）。\n\n接下来，修改 `Chat.submit()` 函数以通过 WebSocket\
  \ 传递用户名：\n\n```javascript\n// 向服务器提交新聊天\nChat.submit = function(e) {\n  e.preventDefault();\n\
  \  // 获取输入文本并将其清空\n  var $message = $(e.target.message),\n  text = $message.val();\n\
  \  $message.val('');\n  // 通过 socket 发送消息\n  socket.emit('newchat', {\n    name:\
  \ Chat.username,\n    text: text\n  });\n};\n```\n\n由于服务器仅仅地将发送到 socket 的任何内容转发回所有用户，因此你不需要服务器端执行任何操作。最后一步是修改消息视图以显示用户名：\n\
  \n```javascript\nChat.MessageView = Backbone.View.extend({\n  tagName: 'p',\n  template:\
  \ _.template('<strong><%=name %>:</strong> <%=text %>'),\n  render: function() {\n\
  \    // 添加消息的 html\n    this.$el.html(this.template(this.model.toJSON()));\n   \
  \ // 将新消息添加到父视图中\n    this.parentView.$el.append(this.$el);\n    return this;\n\
  \  }\n});\n```\n\n如你所见，视图现在使用 Underscore 模板来渲染消息。你需要模型中的所有数据，因此在编译模板时，会将模型转换为 JSON\
  \ 并传递给模板。现在启动两个不同的客户端。如图 9-6 所示，名字现在显示在聊天室中了。\n\n考虑将用户名保存在本地存储器（local storage）中，这样用户就不需要重新输入。我在示例中省略了这一点，以便你可以在带有不同用户名的多个标签中测试应用。\n\
  \n图 9-6 显示名字后，聊天室的用户体验（UX）有了很大提升。\n\n# 添加时间戳 (Adding a Timestamp)\n\n为消息添加时间戳也是一个好主意，这样用户可以看到每条消息发送的时间。首先，安装\
  \ `Moment.js` 模块，它可以让时间戳格式变得简单：\n\n```\nnpm install moment\n```\n\n使用 Moment.js，你可以为聊天消息创建时间戳，例如：\n\
  \n```javascript\nmoment().format('h:mm');\n```\n\n该方法返回格式化后的时间，例如下午 2:10 返回 `14:10`。虽然你可以在客户端包含此功能，但这不是最好的主意。聊天室的不同用户可能处于不同的时区，或者其机器上的时间设置错误。如果你在客户端包含此函数，将获得可靠性较低的值。因此，请将此函数放在服务器端，并在通过\
  \ socket 接收到消息时添加时间戳：\n\n```javascript\nvar moment = require('moment'),\n  activeClients\
  \ = 0;\n// 连接时\nio.sockets.on('connection', function(socket) {\n  activeClients++;\n\
  \  io.sockets.emit('message', {clients: activeClients});\n  // 断开连接\n  socket.on('disconnect',\
  \ function(data) {\n    activeClients--;\n    io.sockets.emit('message', {clients:\
  \ activeClients});\n  });\n  // 接收新聊天\n  socket.on('newchat', function(data) {\n\
  \    data.timestamp = moment().format('h:mm');\n    io.sockets.emit('chat', data);\n\
  \  });\n});\n```\n\n最后，你只需要在 `main.js` 的消息模板中添加时间戳：\n\n```javascript\nChat.MessageView\
  \ = Backbone.View.extend({\n  tagName: 'p',\n  template: _.template('<strong><%=name\
  \ %> [<%=timestamp %>]:</strong> <%=text %>'),\n  render: function() {\n    // 添加消息的\
  \ html\n    this.$el.html(this.template(this.model.toJSON()));\n    // 将新消息添加到父视图中\n\
  \    this.parentView.$el.append(this.$el);\n    return this;\n  }\n});\n```\n\n\n\
  \n\n现在聊天室中显示了时间戳，如图 9-7 所示。\n\n![9781118524565-fg0907.eps](img/9781118524565-fg0907_fmt.png)\n\
  \n图 9-7 聊天室中的消息现在显示了时间戳。\n\n## 使用 MongoDB 进行持久化\n\n按照目前的应用程序，消息是在发送给所有连接用户的实时流中显示的。但如果能将消息保存到持久化层中会更好，这样当用户进入聊天室时，就可以显示之前的消息。\n\
  \n### 连接到 MongoDB\n\n首先，确保 MongoDB 已安装并运行。然后安装 Native MongoDB 驱动模块：\n\n```bash\n\
  npm install mongodb\n```\n\n然后，在你的 Express `app.js` 文件顶部添加一个 `require()` 语句：\n\n\
  ```javascript\nvar express = require('express')\n  , routes = require('./routes')\n\
  \  , user = require('./routes/user')\n  , http = require('http')\n  , path = require('path')\n\
  \  , mongodb = require('mongodb');\n```\n\n接下来，连接到 MongoDB 服务器并在你的数据库创建一个消息集合（collection）：\n\
  \n```javascript\n// connect to mongodb\nvar db = new mongodb.Db('mydb', new mongodb.Server('localhost',\
  \ 27017,\n{auto_reconnect: true}), {w: 1});\ndb.open( function(err, conn) {\n  db.collection('chatroomMessages',\
  \ function(err, collection) {\n    // init the chatroom\n    chatroomInit(collection);\n\
  \  });\n});\n```\n\n`chatroomInit()` 函数只是一个回调，用于确保在连接到 MongoDB 之前初始化 socket 功能。因此，将聊天室代码折叠回调中：\n\
  \n```javascript\nvar chatroomInit = function(messageCollection) {\n  var moment\
  \ = require('moment'),\n      activeClients = 0;\n  // on connection\n  io.sockets.on('connection',\
  \ function(socket) {\n    activeClients++;\n    io.sockets.emit('message', {clients:\
  \ activeClients});\n    // on disconnect\n    socket.on('disconnect', function(data)\
  \ {\n      activeClients--;\n      io.sockets.emit('message', {clients: activeClients});\n\
  \    });\n    // new chat received\n    socket.on('newchat', function(data) {\n\
  \      data.timestamp = moment().format('h:mm');\n      io.sockets.emit('chat',\
  \ data);\n    });\n  });\n};\n```\n\n### 在 MongoDB 上保存消息\n\n接下来，通过修改 `newchat` 回调将收到的任何新聊天保存到数据库：\n\
  \n```javascript\n// new chat\nsocket.on('newchat', function(data) {\n  data.timestamp\
  \ = moment().format('h:mm');\n  io.sockets.emit('chat', data);\n  // save the new\
  \ message to mongodb\n  messageCollection.insert(data, function(err, result) {\n\
  \    console.log(result);\n  });\n});\n```\n\n在这里，脚本使用了传递给 `chatroomInit()` 的 `messageCollection`\
  \ 将新数据插入数据库。如果你重启 Node 服务器并提交一条新消息，请查看控制台中记录的数据库插入日志，如所示：\n\n```json\n[ {\n  name:\
  \ 'Anonymous',\n  text: 'Test message',\n  timestamp: '16:01',\n  _id: 50227...\n\
  } ]\n```\n\n### 从 MongoDB 加载消息\n\n现在消息已经保存到 MongoDB 中，你只需要在新用户连接到 socket 时加载这些文档即可。在\
  \ `io.sockets.on('connection')` 的回调中，添加以下代码：\n\n```javascript\n// get the last 10\
  \ messages from mongodb\nmessageCollection.find({}, {sort['_id', 'desc'], limit:\
  \ 10}).toArray(function(err, results) {\n  // loop through results in reverse\n\
  \  var i = results.length;\n  while(i--) {\n    // send each over the single socket\n\
  \    socket.emit('chat', results[i]);\n  }\n});\n```\n\n该脚本使用 MongoDB 的 `messageCollection`\
  \ 获取最后十条消息。为了做到这一点，它按 `_id` 降序排序，并限制为十条。然而，有几点重要事项需要注意：\n\n1. 因为文档按降序请求的，所以脚本必须使用\
  \ `while(i--)` 循环反向遍历它们。这样，它就可以获取最新的条目，但仍按正确的顺序显示它们。\n2. 脚本随后通过 socket 发射数据，几乎与它收到聊天室新消息的时间完全吻合。然而，它没有使用公共\
  \ socket `io.sockets.emit()`，而是使用了私有 socket `socket.emit()`。\n\n这至关重要，因为你只想将保存的消息转发给新连接的用户。如果你通过主公共\
  \ socket 传输这些消息，那么每当有新用户连接时，所有连接的用户都会收到一组新的近期消息。\n\n脚本在 socket 上发出了相同的 `chat` 事件，因此无需修改客户端的任何内容。`main.js`\
  \ 中的脚本已经处理了通过此 socket 发送的内容。然而，这种方法可能会产生一点瓶颈，因为它将作为十条独立的消息通过 socket 发射多条消息。你可以根据需要修改客户端脚本以接收消息数组。\n\
  \n### 关闭连接\n\n当新用户连接到 socket 时，你只需要加载这些文档。在 `io.sockets.on('connection')` 的回调中，添加以下代码\n\
  \n```javascript\n// on disconnect\nsocket.on('disconnect', function(data) {\n  activeClients--;\n\
  \  io.sockets.emit('message', {clients: activeClients});\n  // if no users\n  if\
  \ (!activeClients) db.close();\n});\n```\n\n现在，当用户断开连接时，脚本会检查连接数。\n\n## 总结\n\n聊天室脚本现在已完成，我想最后回过一遍代码。整合\
  \ `main.js` 中的客户端代码：\n\n```javascript\nvar socket,\n    Chat = {};\n\n// Models\
  \ & Collections\nChat.Message = Backbone.Model.extend({\n  defaults: {\n    text:\
  \ ''\n  }\n});\nChat.Messages = Backbone.Collection.extend({\n  model: Chat.Message\n\
  });\n\n// Views\nChat.MessageView = Backbone.View.extend({\n  tagName: 'p',\n  template:\
  \ _.template('<%=name %> [<%=timestamp %>]:</%=> <%=text %>'),\n  render: function()\
  \ {\n    // add the message html\n    this.$el.html(this.template(this.model.toJSON()));\n\
  \    // append the message to the parent view\n    this.parentView.$el.append(this.$el);\n\
  \    return this;\n  }\n});\nChat.MessagesView = Backbone.View.extend({\n  el: '#chatroom',\n\
  \  initialize: function() {\n    // bind \"this\" context to the render function\n\
  \    _.bindAll(this, 'render');\n    // add events for the collection\n    this.collection.on('change',\
  \ this.render);\n    this.collection.on('add', this.render);\n    this.collection.on('remove',\
  \ this.render);\n    // render the initial state\n    this.render();\n  },\n  render:\
  \ function() {\n    // empty the wrapper\n    this.$el.empty();\n    // loop through\
  \ the messages in the collection\n    this.collection.each(function(message) {\n\
  \      var messageView = new Chat.MessageView({\n        model: message\n      });\n\
  \      // save a reference to this view within the child view\n      messageView.parentView\
  \ = this;\n      // render it\n      messageView.render();\n    }, this);\n    //\
  \ scroll to the bottom\n    this.$el.animate({ scrollTop: this.$el.height() }, 100);\n\
  \    return this;\n  }\n});\n\n// init function\nChat.init = function(setup) {\n\
  \  // connect to the socket\n  socket = new io.connect(setup.host);\n  // when data\
  \ is received, update the user count\n  socket.on('message', function(data) {\n\
  \    setup.dom.count.text(data.clients);\n  });\n  // get username\n  Chat.username\
  \ = Chat.getUsername();\n  // initialize the collection & views\n  Chat.messages\
  \ = new Chat.Messages();\n  Chat.messagesView = new Chat.MessagesView({\n    collection:\
  \ Chat.messages\n  });\n};\n```\n\n\n\n\n```javascript\n  // 为聊天框绑定提交表单\n  setup.dom.form.submit(Chat.submit);\n\
  \n  // 处理新聊天\n  Chat.$chatroom = setup.dom.room;\n\n  socket.on('chat', Chat.addMessage);\n\
  \n};\n\n// 将新聊天提交到服务器\nChat.submit = function(e) {\n  e.preventDefault();\n  //\
  \ 获取输入框的内容并将其清空\n  var $message = $(e.target.message),\n  text = $message.val();\n\
  \  $message.val('');\n  // 通过 socket 发送消息\n  socket.emit('newchat', {\n    name:\
  \ Chat.username,\n    text: text\n  });\n};\n\n// 向聊天室中添加新消息\nChat.addMessage =\
  \ function(data) {\n  Chat.messages.add(data);\n};\n\n// 获取用户名\nChat.getUsername\
  \ = function() {\n  return prompt(\"你的名字是什么？\", '') || 'Anonymous';\n};\n\n$(function()\
  \ {\n  // 初始化聊天应用\n  Chat.init({\n    host: 'http://localhost:3000',\n    dom: {\n\
  \      count: $('#client-count'),\n      form: $('.chatbox'),\n      room: $('#chatroom')\n\
  \    }\n  });\n});\n```\n\n复述一下此脚本的执行流程：\n\n1. 它首先在 Backbone 中为消息创建模型（models）和集合（collections）。\n\
  2. 脚本接着为每条消息创建视图（views），以及一个用于消息列表的父视图。这些视图绑定到集合的变化上，因此任何数据变化会自动渲染在页面上。\n3. `Chat.init()`\
  \ 开始连接到 socket，然后调用 `Chat.getUsername()`，这允许用户在简单的 DOM `prompt()` 中输入名称。\n4. 随后，`Chat.init()`\
  \ 初始化 Backbone 中的集合和视图。\n5. 接下来，`Chat.submit()` 函数处理聊天消息表单的提交，通过 WebSocket 传输文本和用户名。\n\
  6. `Chat.init()` 的最后部分处理通过 WebSocket 接收的新聊天。这些消息被添加到 `Chat.messages` 集合中，该集合反过来渲染视图中的更改。\n\
  7. 最后，所有内容在主 `$(function)` 初始化中启动，它启动 socket 连接并触发 `Chat.init()`。\n\n复述服务器端，这里是\
  \ `app.js` 的相关部分：\n\n```javascript\nvar server = http.createServer(app),\nio = require('socket.io').listen(server);\n\
  server.listen(app.get('port'), function(){\n  console.log(\"Express server listening\
  \ on port \" + app.get('port'));\n});\n\n// 连接到 mongodb\nvar db = new mongodb.Db('mydb',\
  \ new mongodb.Server('localhost', 27017, {auto_reconnect: true}), {w: 1});\ndb.open(\
  \ function(err, conn) {\n  db.collection('chatroomMessages', function(err, collection)\
  \ {\n    // 初始化聊天室\n    chatroomInit(collection);\n  });\n});\n\nvar chatroomInit\
  \ = function(messageCollection) {\n  var moment = require('moment'),\n      activeClients\
  \ = 0;\n  // 连接建立时\n  io.sockets.on('connection', function(socket) {\n    activeClients++;\n\
  \    io.sockets.emit('message', {clients: activeClients});\n    // 断开连接时\n    socket.on('disconnect',\
  \ function(data) {\n      activeClients--;\n      io.sockets.emit('message', {clients:\
  \ activeClients});\n      // 如果没有活跃用户则关闭数据库连接\n      if ( !activeClients ) db.close();\n\
  \    });\n    // 从 mongodb 拉取最后 10 条消息\n    messageCollection.find({}, {sort:[['_id',\
  \ 'desc']], limit:\n10}).toArray(function(err, results) {\n      // 反序遍历结果\n   \
  \   var i = results.length;\n      while(i--) {\n        // 通过单个 socket 发送每条消息\n\
  \        socket.emit('chat', results[i]);\n      }\n    });\n    // 接收新聊天\n    socket.on('newchat',\
  \ function(data) {\n      data.timestamp = moment().format('h:mm');\n      io.sockets.emit('chat',\
  \ data);\n      // 保存到 mongodb\n      db.collection('chatroomMessages').insert(data,\
  \ function(err, result) {\n      });\n    });\n  });\n};\n```\n\n\n\n\n\n例如，根据 Pingdom\
  \ 的数据，2010 年到 2012 年，亚洲移动流量份额的增长率为 192%（[`royal.pingdom.com/2012/05/08/mobile-web-traffic-asia-tripled`](http://royal.pingdom.com/2012/05/08/mobile-web-traffic-asia-tripled/)）。而且这不仅仅是亚洲的现象：全球范围内的增长超过了\
  \ 162%。\n\n尽管桌面浏览仍然快于移动设备浏览，但预计最早在 2014 年就会发生变化。这是一个极具吸引力的机会，许多公司正在布局，以获取移动流量的红利。“移动优先”（Mobile-first）已成为许多开发者的共同格言，他们现在正针对移动设备开发应用，而将桌面支持视为事后考虑。这与几年前相比是一个重大的转变，那时移动应用\
  \ 只是附加在主产品——桌面 Web 应用——之上的插件。\n\n在本章中，你将了解到如何在移动领域中定位你的 Web 应用。你首先将学习如何检测移动设备，并创建能够根据不同屏幕尺寸和设备方向调整的响应式布局。然后，你将学习一些可以用来处理移动视口和提供响应式内容的脚本，随后是几个你可以用来简化移动开发的的移动端框架。\n\
  \n在建立起移动开发的坚实基础后，你将直接深入学习，使用 `Hammer.js` 库处理多点触事件和复杂的手势。该库可以帮助你利用应用中的触摸屏界面，该界面可以响应滑动、点击等更多用户交互。\n\
  \n接下来，你将发现如何使用 `geolocation API` 根据用户设备的 GPS 为你的应用用户提供本地化内容。你还将学到如何使用 `JavaScript`\
  \ 拨打电话号码和发送短信。最后，你将学习如何使用 `PhoneGap` 和 `JavaScript` 构建原生设备应用。`PhoneGap` 允许你桥接 `JavaScript`\
  \ 应用与浏览器端无法使用的各种 API 之间的鸿沟。到本章结束时，你将对移动开发的各种关键技能有一个很好的介绍。\n\n# 移动应用设置\n\n随着移动端的压倒性流行，仅为桌面浏览器构建\
  \ Web 应用已经没有太大意义了。除非确实没有办法让你的应用在移动端运行，否则你绝对应该为智能手机和平板构建一个版本。但这并不意味着你必须从零开始构建一个完全独立的应用。事实上，避免分段并为桌面和移动端创建一个更通用的代码库是一个好主意。\n\
  \n## 检测移动设备\n\n设置网站或应用移动版本的第一个挑战是首先检测用户是否在使用移动设备。通常情况下，最好在服务器端进行，这样你就可以发送精简的内容，并减小针对较慢移动连接的标记体积。然后你可以发送移动特定的\
  \ `JavaScript`，并避免在前端进行任何检测。\n\n然而，有时使用 `JavaScript` 处理这种检测是有意义的。遗憾的是，这意味着将通过用户代理（user\
  \ agents）进行浏览器嗅探。在没有用户代理的情况下，没有任何可靠的方法可以检测移动设备，因为设备制造商已经破坏了所有提议的方法。\n\n设备制造商故意规避移动检测，以便能够显示全功能的桌面网站并让他们的设备看起来更强大。\n\
  \n### 寻找用户代理\n\n使用用户代理检测移动设备面临着自身的挑战。随着新设备和移动浏览器的定期发布，要维护一份最新的移动用户代理列表可能是困难的。幸运的是有很多服务可以为你处理这些。\n\
  \n- 最简单的方法是从 [`http://detectmobilebrowsers.com`](http://detectmobilebrowsers.com/)\
  \ 下载 `JavaScript` 实现。然而，该脚本只提供了一个简单的重定向——因此你需要修改它以创建一个可以在你的 `JavaScript` 中使用的钩子，例如设置一个变量\
  \ `isMobile`。此外，请记住，随着用户代理的变化，你必须随时间更新该脚本。\n\n- 如果你需要更细粒度的检测，你应该使用 `WURFL`：[`http://wurfl.sourceforge.net`](http://wurfl.sourceforge.net/)。`WURFL`（无线通用资源列表）是一个经常更新的\
  \ XML 文件，它不仅列出了移动浏览器，还列出了它们的各种设备特定能力。因此，尽管它依赖于用户代理嗅探，但对于功能检测来说仍然相当可靠。\n\n唯一的缺点是，你必须设置一个\
  \ API 在你的 `JavaScript` 中使用它。幸运的是，有几个可用工具，例如用于 `PHP` 的远程客户端 `Tera-WURFL`：[`http://dbapi.scientiamobile.com/wiki/index.php/Remote_Webservice`](http://dbapi.scientiamobile.com/wiki/index.php/Remote_Webservice)。\n\
  \n### 发现方向\n\n一旦你知道用户在使用移动设备，你也可以用 `JavaScript` 检查设备方向。技巧是使用 `window.orientation`，它以度输出方向。你可以用它为竖屏和横屏模式设置一个简单的开关：\n\
  \n```\nswitch( window.orientation ) {\n  case 0:\n  case 180:\n    // 竖屏模式\n  break;\n\
  \  case 90:\n  case -90:\n    // 横屏模式\n  break;\n}\n```\n\n横屏模式可以是 `90` 或 `-90`\
  \ 度，取决于设备旋转的方向。此外，你可以使用 `window.onorientationchange` 跟踪设备方向的变化：\n\n```javascriptwindow.onorientationchange\
  \ = function() {\n  alert('新方向：' + window.orientation);\n};\n```\n\n在 iOS 中，你可以通过\
  \ `window.ondeviceorientation` 获取关于设备的更精确的信息，它甚至可以访问加速度计。更多信息请访问 [`http://www.peterfriese.de/how-to-use-the-gyroscope-of-your-iphone-in-a-web-app/](http://www.peterfriese.de/how-to-use-the-gyroscope-of-your-iphone-in-a-web-app/)。\n\
  \n### 使用媒体查询解决布局问题\n\n最后，如果你在检测布局问题，可以使用 `JavaScript` 使用媒体查询。例如，这里是根据窗口大小设置的方法：\n\
  \n```javascript\nif (window.matchMedia('(max-device-width: 480px)').matches) {\n\
  \  // 小于 480px 的设备\n}\n```\n\n然而，请记住，此脚本检测的是任何匹配的设备，无论是否是移动设备。\n\n# 移动站点样式\n\n过去，移动样式是\
  \ HTML/CSS 的事务。你使用媒体查询或后端移动检测显示显示样式表，并使用 HTML 技术在移动视口内显示修改后的站点。然而，最近出现了一种趋势，即使用\
  \ `JavaScript` 处理这一切。\n\n## 视口脚本\n\n其中一个例子是处理移动视口，即页面在移动屏幕上显示的缩放。过去，你通过基础 HTML 元标签来处理这个问题：\n\
  \n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0,\
  \ maximum-scale=1.0\" />\n```\n\n在理论上，这种方法应该很好很好工作，以特定的缩放级别显示页面。然而在实践中，它留下了很多遗憾。主要问题是旋转。你可能注意到你的设备在旋转到横屏时，屏幕会缩放以匹配设备在竖屏时的比例。虽然这对于阅读段落是好事，但对于大多数网站来说并不是最好的用户体验。\n\
  \n幸运的是，Zynga 的人员发布了一个开源的 `JavaScript`，可以更好地处理视口。你可以在这里下载：[`https://github.com/zynga/viewporter`](https://github.com/zynga/viewporter)。\n\
  \n\n\n\n该脚本更加优雅地处理了旋转问题，并提供了其他便利功能，例如移除浏览器的顶栏。\n\n# 另一个视口脚本\n\n视口（Viewport）的另一个问题是，在处理内容时它们可能是任意的。为什么要让用户的屏幕尺寸来决定页面的断点，并可能导致图像和段落截断到下一个屏幕上呢？\n\
  \n涉及到响应式设计和视口时，传统方法是设置固定的断点。如果你只需要支持少数设备，这种方法效果很好，但面对海量的不同移动设备屏幕尺寸，它就显得彻底失败了。幸运的是，有一个脚本可以根据页面内容来设置视口，你可以在这里下载：[`https://github.com/bradfrost/ish.`](https://github.com/bradfrost/ish.)。通过这个脚本，你可以定义几个桶大小（bucket\
  \ sizes），然后让它自动完成其余工作。\n\n# 响应式图像脚本\n\n在提供网站移动版本时，另一个常见问题是如何处理图像。一方面，你想为移动端显示小图像；另一方面，你想为桌面浏览器显示高分辨率图像。你可以通过从服务器提供完全不同的标记来解决这个问题，但这构建和维护可能会有些困难。有一个更简单的解决方案，它利用了图像路径的一些有趣技巧，你可以在这里下载：[`https://github.com/filamentgroup/Responsive-Images`](https://github.com/filamentgroup/Responsive-Images)。\n\
  \n基本上，你定义了两种想要使用的图像路径，脚本会使用 JavaScript 来决定使用最佳的哪一个。然而，这些路径仅在 Apache 服务器上有效，所以如果你没有使用\
  \ Apache，就需要探索其他选项。幸运的是，市面上有很多不同的脚本，你可以在这里阅读相关介绍：[`http://css-tricks.com/which-responsive-images-solution-should-you-use`](http://css-tricks.com/which-responsive-images-solution-should-you-use/)。\n\
  \n# 移动端框架\n\n由于移动设备的普及，现在有了大量的移动端库和框架。这些资源为你的移动开发工作提供了巨大的助力。然而，与任何第三方工具一样，选择最适合你项目的一个是非常关重要的。\n\
  \n- **Sencha Touch**：Sencha Touch 可能是最健壮的移动框架。它提供了许多实用的移动组件，以及 MVC 架构和样式。它非常适合需要大量移动特定功能的交互式应用。所以，如果你正在构建一个功能全的移动应用，请查看\
  \ Sencha Touch。但如果你只是为一个简单的画册网站构建移动端皮肤，Sencha Touch 就太大材小用了。在所有移动框架中，它的学习曲线最高，文件体积最大。要了解更多关于\
  \ Sencha Touch 信息，请访问 [`www.sencha.com/products/touch`](http://www.sencha.com/products/touch)。\n\
  - **jQuery Mobile**：jQuery Mobile 是另一个提供多种移动组件和主题的框架。它基于 `jQuery` 和 `jQuery UI`\
  \ 构建，因此大多数开发者发现它很容易上手并投入工作。jQuery Mobile 提供了很多样式和一个类似于 `jQuery UI` 的主题器（themer），因此它在没有设计稿的情况下推出移动端\
  \ UI 非常棒。但如果你已经有了设计方向，处理起来可能会稍微更具挑战性。jQuery Mobile 最适合不需要 `Sencha Touch` 所有功能的 Web\
  \ 应用。要了解更多关于 jQuery Mobile 信息，请访问 [`http://jquerymobile.com`](http://jquerymobile.com/)。\n\
  - **移动端库**：如果你只是为简单网站构建移动端皮肤，请避免使用移动端框架。如果你想为网站注入少量的移动功能，使用移动端库会让你更愉快。在第 2 章中，你读过关于\
  \ `Zepto.js` 的内容。Zepto 是一个轻级的 JavaScript 库，包含了几个用于移动端的基本触摸手势。在这里找到更多关于 Zepto 触摸事件的信息：[`http://zeptojs.com/#touch`](http://zeptojs.com/#touch)。此外，在下一节中，你将发现如何使用\
  \ `Hammer.js` 为你的应用添加稳健的触摸手势支持。\n\n# 触摸屏集成\n\n移动开发的特殊挑战之一是处理不同的界面：触摸屏。但你不应该将其视为一种挑战，而应将其视为提供更高质量\
  \ UX（用户体验）的机会。\n\n在写作期间，触摸屏主要是移动端的现象。但已经为桌面电脑生产了一些触摸屏器，随着桌面和移动界限模糊，这种趋势在未来几年可能会持续。\n\
  \n## 基础触摸事件\n\n为了与触摸屏交互，你必须为一种新事件创建处理器：触摸事件。但你可能在奇怪为什么要为触摸事件设置处理器。毕竟，移动浏览器在用户触摸屏幕时仍然会注册点击事件。然而，鼠标一次只能点击屏幕上的某一点，而触摸屏可以同时注册多个触摸事件——数量取决于用户手指的数量。\n\
  \n### 创建单个触摸事件\n\n为单个触摸事件创建处理器非常简单：\n\n```\nvar el = document.getElementById('my-element');\n\
  \nel.addEventListener('touchstart', function(e) {\n  // 触摸时执行的操作\n});\n```\n\n这里，脚本使用标准的\
  \ JavaScript `addEventListener()` 方法来绑定 `touchstart` 事件。该事件在用户手指触摸屏幕的瞬间就会触发。同样，你也可以绑定\
  \ `touchend`，它在用户移除手指时触发。还有第三种事件 `touchmove`，它在用户手指放在屏幕上移动时触发。\n\n### 创建多触摸事件\n\n\
  当使用触摸事件时，你可以从事件对象获取触摸点的坐标：\n\n```\nel.addEventListener('touchstart', function(e)\
  \ {\n  var x = e.touch.pageX;\n  var y = e.touch.pageY;\n});\n```\n\n正如你所看到的，如果用户触摸了屏幕的多个点，通过\
  \ `touch.pageX` 和 `touch.pageY` 获取只能获取其中一个点的坐标。但你也可以获取多个触摸点的信息——如果用户用多个手指触摸屏幕。你需要\
  \ `touches` 数组：\n\n```\nel.addEventListener('touchstart', function(e) {\n  // 第一个手指\n\
  \  var x1 = e.touches[0].pageX;\n  var y1 = e.touches[0].pageY;\n  // 第二个手指\n  var\
  \ x2 = e.touches[1].pageX;\n  var y2 = e.touches[1].pageY;\n});\n```\n\n在这里，事件传递\
  \ `touches[0]` 中第一个手指和 `touches[1]` 中第二个手指的坐标。额外的触摸点会被添加到此数组中（`touches[2]` 代表第三个手指）。\n\
  \n# 复杂触摸手势\n\n触摸编程最好的部分可能是可以使用触摸手势，例如滑动、缩放和旋转。这些手势改进了移动应用的 UI，提供了更具交互性的体验。\n\n虽然你可以编写自己的手势，但这可能会变得复杂。幸运的是，有很多手势库可用，最著名的是\
  \ `Hammer.js` ([`eightmedia.github.com/hammer.js/`](http://eightmedia.github.com/hammer.js/))。Hammer.js\
  \ 能够轻松为不同的移动平台（如 iOS、Android 和 Blackberry）包含各种触摸手势。\n\niOS 包含了一些原生手势支持。但你最终可能为其他设备构建回退方案，所以最好只使用\
  \ `Hammer.js`。\n\n## Hammer.js 基础\n\n使用 `Hammer.js` 非常简单。首先，下载源码并包含在页面中。接下来，将其绑定到一个元素：\n\
  \n```\nvar hammer = new Hammer( document.getElementById('my-element') );\n```\n\n\
  最后，在该对象上定义一个触摸事件：\n\n```\nhammer.ondoubletap = function(e) {\n```\n\n\n\n\n```javascript\n\
  console.log('Whoah the element has been double tapped');\n}\n```\n\n每当用户双击元素时，该事件就会被触发。但\
  \ `ondoubletap` 只是一个开始。Hammer.js 包含了许多不同的手势，如 `ondrag`、`onhold` 和 `ontransform`。\n\
  \n# 使用 Hammer.js 实现幻灯片\n\n网站常见的元素之一是图片幻灯片。为了提供更好的移动端体验，你可以通过手势控制增强基础幻灯片。这样用户就可以通过左右滑动来切换图片。\n\
  \n## 创建幻灯片\n\n首先，从一些 HTML 标记开始：\n\n```html\n<section class=\"slideshow\">\n  <div\
  \ class=\"slides\">\n    <img src=\"images/my-image.jpg\" alt=\"\" class=\"slide\"\
  \ />\n    <img src=\"images/my-image-2.jpg\" alt=\"\" class=\"slide\" />\n    <img\
  \ src=\"images/my-image-3.jpg\" alt=\"\" class=\"slide\" />\n    <img src=\"images/my-image-4.jpg\"\
  \ alt=\"\" class=\"slide\" />\n  </div>\n</section>\n```\n\n如你所见，幻灯片的标记保持非常简单。\n\
  \n接下来添加一些样式：\n\n```css\n.slideshow {\n  width: 500px;\n  height: 300px;\n  position:\
  \ relative;\n  overflow: hidden;\n}\n.slides {\n  position: absolute;\n  top: 0;\n\
  \  left: 0;\n  width: 10000px;\n  -webkit-transition: left 0.3s ease;\n  -moz-transition:\
  \ left 0.3s ease;\n  -o-transition: left 0.3s ease;\n  transition: left 0.3s ease;\n\
  }\n.slide {\n  width: 500px;\n  height: 300px;\n  float: left;\n}\n```\n\n这里样式的思路是让\
  \ `.slides` 容器内的所有 `.slide` 图片左浮动，形成一个长长的水平卷轴。然后将该容器绝对定位在父级 `.slideshow` 容器中。\n\n\
  通过这种，你就可以左右移动 `.slides` 容器来显示卷轴中不同的幻灯片。代码没有在 JavaScript 中处理动画，而是使用了一些简单的 CSS 过渡效果。在开发移动端应用时，使用过渡动画是一个好主意，因为它们的性能要得多。\n\
  \n最后，添加基础的 jQuery：\n\n```javascript\nfunction Slideshow($wrap) {\n  this.currSlide\
  \ = 0;\n  // 缓存一些变量\n  var $slideWrap = $wrap.find('.slides');\n  var slideWidth\
  \ = $slideWrap.children(':first-child').width();\n  var slideCount = $slideWrap.children().length;\n\
  \  this.changeSlide = function() {\n    // 对 currSlide 进行合理性检查\n    var $kids =\
  \ $slideWrap.children();\n    if ( this.currSlide >= $kids.length ) this.currSlide\
  \ = 0;\n    else if ( this.currSlide < 0 ) this.currSlide = $kids.length - 1;\n\
  \    // 幻灯片的水平位置\n    $slideWrap.css('left', slideWidth * this.currSlide * -1);\n\
  \  };\n  // 间隔切换幻灯片\n  var slideInterval = setInterval( $.proxy( function() {\n\
  \    this.currSlide++;\n    this.changeSlide();\n  }, this), 4000);\n}\nvar slideshow\
  \ = new Slideshow( $('.slideshow') );\n```\n\n到目前，幻灯片脚本非常直接：\n\n1. 首先，它设置了一个公共的\
  \ `this.currSlide` 变量并缓存了几个变量供以后使用。\n2. 然后它创建了一个公共的 `this.changeSlide()` 函数，该函数根据\
  \ `this.currSlide` 变量更改显示的幻灯片。\n3. `this.changeSlide()` 确保新幻灯片没有超出幻灯片的范围。然后它根据新幻灯片的索引和幻灯片的宽度移动\
  \ `.slides` 容器。动画由之前建立的 CSS 过渡处理。\n4. 最后，设置了一个间隔，每四秒切换一次当前幻灯片。这里需要注意的是使用了 `$.proxy()`，它将\
  \ `this` 的上下文传递到间隔的回调函数中。\n\n该脚本按间隔更改幻灯片，但你可以设置任何你需要的功能。只需使用 `this.changeSlide()`\
  \ 函数来创建上一页、下一页按钮、数字导航等。\n\n## 添加滑动手势\n\n到目前为止，幻灯片按间隔运行，每四秒切换一次幻灯片。下一步是为手机添加滑动手势。首先，从\
  \ `http://eightmedia.github.com/hammer.js` 下载 Hammer.js 并在页面引入主脚本。Hammer.js 也包含一个\
  \ jQuery 插件，但目前你只需要使用独立脚本即可。\n\n使用 Hammer.js 非常简单；首先在你想要绑定触摸事件的任何元素上创建一个新的 Hammer\
  \ 实例，然后定义一个处理器。例如：\n\n```javascript\nvar hammer = new Hammer( document.getElementById('my-element')\
  \ );\nhammer.onswipe = function(e) {\n  // 在滑动时你想做的任何操作\n};\n```\n\n在幻灯片示例中，你想将触摸事件绑定到该元素上。例如：\n\
  \n```javascript\nvar hammer = new Hammer( document.getElementById('my-element')\
  \ );\nhammer.onswipe = function(e) {\n  // 在滑动时你想做的任何操作\n};\n```\n*(注：此处省略了原文中重复出现的相同示例代码块以保持文档整洁)*\n\
  \n## 橡皮效果 (Rubber Banding)\n\n现在滑动手势可以工作了，但幻灯片在开头和结尾处有点奇怪，因为它会循环到另一侧。这在间隔切换中可行，但对于滑动事件来说不是最好的体验。幸运的是，很容易防止滑动事件的循环：\n\
  \n```javascript\nvar hammer = new Hammer( $wrap[0] );\nhammer.onswipe = $.proxy(function(e)\
  \ {\n  clearInterval(slideInterval);\n  switch (e.direction) {\n    case 'left':\n\
  \      if (this.currSlide >= slideCount - 1) {\n        return false;\n      }\n\
  \      this.currSlide++;\n      this.changeSlide();\n      break;\n    case 'right':\n\
  \      if (this.currSlide <= 0) {\n        return false;\n      }\n      this.currSlide--;\n\
  \      this.changeSlide();\n      break;\n  }\n}, this);\n```\n\n\n\n\n\n```javascript\n\
  \  // prevent default behavior\n  return false;\n}, this);\n```\n\n现在脚本停止了循环，但这并没有向用户传达多少信息——看起来就像是幻灯片坏掉了。更好的主意是设置“橡皮回弹”（rubber\
  \ banding）效果——让幻灯片稍微移出边界，然后弹回。橡皮回弹在移动端 UI 中是一种非常常见的范式，用户很可能会熟悉。幸运的是，由于已经设置了 CSS\
  \ 过渡效果，实现它并不困难：\n\n```javascript\nvar hammer = new Hammer( $wrap[0] );\n\nhammer.onswipe\
  \ = $.proxy (function(e) {\n  // clear any interval\n  clearInterval( slideInterval\
  \ );\n  switch( e.direction ) {\n    case 'left':\n      // stop if at the bounds\n\
  \      if (this.currSlide >= slideCount - 1) {\n        // rubberband it\n     \
  \   var thisPosLeft = slideWidth * -1 * (slideCount - 1);\n        $slideWrap.css('left',\
  \ thisPosLeft + slideWidth / 3 * -1)\n        setTimeout(function() {\n        \
  \  $slideWrap.css('left', thisPosLeft);\n        }, 200);\n        return false;\n\
  \      }\n      this.currSlide++;\n      this.changeSlide();\n      break;\n   \
  \ case 'right':\n      // stop if at the bounds\n      if (this.currSlide <= 0)\
  \ {\n        // rubberband it\n        $slideWrap.css('left', slideWidth / 3);\n\
  \        setTimeout(function() {\n          $slideWrap.css('left', 0);\n       \
  \ }, 200);\n        return false;\n      }\n      this.currSlide--;\n      this.changeSlide();\n\
  \      break;\n  }\n  // prevent default behavior\n  return false;\n}, this);\n\
  ```\n\n看一眼右侧滑动时的橡皮回弹效果——因为它更容易理解。首先，它让幻灯片向外移动三分之一；然后设置定时器将其弹回原位。左侧滑动设置了相反的操作。\n\n\
  ## 总结\n\n现在幻灯片已经同时支持滑动手势和橡皮回弹效果了。这里是完整的脚本：\n\n```javascript\nfunction Slideshow($wrap)\
  \ {\n  this.currSlide = 0;\n  // cache some variables\n  var $slideWrap = $wrap.find('.slides');\n\
  \  var slideWidth = $slideWrap.children(':first-child').width();\n  var slideCount\
  \ = $slideWrap.children().length;\n  this.changeSlide = function() {\n    // sanity\
  \ check on currSlide\n    var $kids = $slideWrap.children();\n    if ( this.currSlide\
  \ >= $kids.length ) this.currSlide = 0;\n    else if ( this.currSlide < 0 ) this.currSlide\
  \ = $kids.length - 1;\n    // change the horizontal position of the slides\n   \
  \ $slideWrap.css('left', slideWidth * this.currSlide * -1);\n  };\n  // change slides\
  \ on an interval\n  var slideInterval = setInterval( $.proxy ( function() {\n  \
  \  this.currSlide++;\n    this.changeSlide();\n  }, this), 4000);\n  // make swipeable\n\
  \  var hammer = new Hammer( $wrap[0] );\n  hammer.onswipe = $.proxy(function(e)\
  \ {\n    // clear any interval\n    clearInterval( slideInterval );\n    switch(\
  \ e.direction ) {\n      case 'left':\n        // stop if at the bounds\n      \
  \  if (this.currSlide >= slideCount - 1) {\n          // rubberband it\n       \
  \   var thisPosLeft = slideWidth * -1 * (slideCount - 1);\n          $slideWrap.css('left',\
  \ thisPosLeft + slideWidth / 3 * -1);\n          setTimeout(function() {\n     \
  \       $slideWrap.css('left', thisPosLeft);\n          }, 200);\n          return\
  \ false;\n        }\n        this.currSlide++;\n        this.changeSlide();\n  \
  \      break;\n      case 'right':\n        // stop if at the bounds\n        if\
  \ (this.currSlide <= 0) {\n          // rubberband it\n          $slideWrap.css('left',\
  \ slideWidth / 3);\n          setTimeout(function() {\n            $slideWrap.css('left',\
  \ 0);\n          }, 200);\n        return false;\n        }\n        this.currSlide--;\n\
  \        this.changeSlide();\n        break;\n    }\n    // prevent default behavior\n\
  \    return false;\n  }, this);\n}\n```\n\n\n\n\n```javascript\n  });\n}\n```\n\n\
  脚本首先检查是否可用地理定位功能，然后使用 `getCurrentPosition()` 返回用户的纬度和经度。当然，地理定位存在固有的隐私问题，因此每当你调用\
  \ API 时，用户的浏览器或设备都会提示他们接受，正如你在图 10-1 中所示。\n\n![9781118524565-fg1001.tif](img/9781118524565-fg1001_fmt.png)\n\
  \n图 10-1 用户必须授予地理定位数据的权限，如这台 iOS 设备所示。\n\n请记住，即使在非移动设备上，地理定位调用也会根据用户的 IP 返回某些内容。\n\
  \n## 连接到 Google Maps\n\n一旦获取了用户的纬度和经度，你就可以对其进行许多操作——例如调用 API 获取其城市名称，或将数据传递给 Google\
  \ Maps API。\n\n首先，请按照此处的说明获取 Google Maps API 密钥：[`https://developers.google.com/maps/documentation/javascript/tutorial#api_key`](https://developers.google.com/maps/documentation/javascript/tutorial#api_key)。然后，要显示用户当前位置的地图，请使用以下代码：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Current Location</title>\n\
  \  <meta name=\"viewport\" content=\"initial-scale=1.0, user-scalable=no\" />\n\
  \  <style type=\"text/css\">\n    html, body, #map_canvas { height: 100% }\n   \
  \ body { margin: 0; padding: 0 }\n  </style>\n</head>\n<body>\n  <div id=\"map_canvas\"\
  \ style=\"width:100%; height:100%\"></div>\n  <script src=\"https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&sensor=true\"\
  >\n  </script>\n  <script>\n    // get current position\n    if ( navigator.geolocation\
  \ ) {\n      navigator.geolocation.getCurrentPosition(function(position) {\n   \
  \     displayMap( position.coords.latitude, position.coords.longitude );\n     \
  \ });\n    }\n    // show map\n    function displayMap(latitude, longitude) {\n\
  \      // define map options\n      var mapOptions = {\n        center: new google.maps.LatLng(latitude,\
  \ longitude),\n        zoom: 10,\n        mapTypeId: google.maps.MapTypeId.ROADMAP\n\
  \      };\n      // pull the map from the Google API\n      var map = new google.maps.Map(document.getElementById(\"\
  map_canvas\"),\n        mapOptions );\n    }\n  </script>\n</body>\n</html>\n```\n\
  \n此脚本首先设置基础样式和标记，然后引用了 Google Maps API 脚本。确保将你的 API 密钥填充到 `YOUR_API_KEY` 值中。接下来，脚本使用\
  \ `navigator.geolocation.getCurrentPosition()` 获取用户的纬度和经度。然后它将该信息传递给 `displayMap()`\
  \ 函数。`displayMap()` 函数简单地将纬经度值传递给 Google Maps API 并渲染地图。就是这样。\n\n现在，在移动设备（或桌面浏览器）上启动此页面，你应该能看到类似于图\
  \ 10-2 的内容。\n\n![9781118524565-fg1002.tif](img/9781118524565-fg1002_fmt.png)\n\n\
  图 10-2 地理定位脚本正在显示波特兰的地图。\n\n## 跟踪地理定位变化\n\n如示例所示，与 API 交互非常简单。你可以将其提升到下一个水平，创建自定义地图或在用户附近的区域放置图钉。\n\
  \n你也可以使用 `watchCurrentPosition()` 随时间跟踪位置的变化：\n\n```javascript\nif ( navigator.geolocation\
  \ ) {\n  navigator.geolocation.watchCurrentPosition(function(position) {\n    console.log('Location:\
  \ ' + position.coords.latitude + ' ' + position.coords.longitude);\n  });\n}\n```\n\
  \n此脚本设置了一个事件处理程序来跟踪地理定位的变化。这比简单的使用间隔设置 `getCurrentPosition()` 好得多，因为它只在位置改变时触发。`watchCurrentPosition()`即使在你不需要跟踪移动目标时也很有用。移动设备通常在获取数据后立即返回粗略的地理定位，并在更精确的数据可用时对其进行精炼。\n\
  \n使用 `watchCurrentPosition()` 可以确保你在数据可用时获取最准确的位置数据。但为了节省资源，你应该在它触发几次后移除处理程序：\n\n\
  ```javascript\nvar watchCount = 0;\nvar positionTimer = navigator.geolocation.watchPosition(function\
  \ (position) {\n  // increment the count\n  watchCount++;\n  // clear the watch\
  \ on the third attempt\n  if ( watchCount > 2 ) {\n    navigator.geolocation.clearWatch(positionTimer);\n\
  \  }\n});\n```\n（注：输入文本是碎片化的，我已根据规则格式化了提供的代码段。）*\n\n\n\n\n如需查看更多原生功能，请访问 [`http://docs.phonegap.com`](http://docs.phonegap.com/)。\n\
  \nPhoneGap 的开源版本被称为 `Apache Cordova`。\n\n# PhoneGap 的优缺点\n\n虽然 PhoneGap 支持多种功能，但请记住，它并不适用于所有项目。\n\
  \n## PhoneGap 对比原生代码\n\nPhoneGap 使用网页视图（web views）而不是每个平台的原生 UI 框架来渲染应用。这在性能上显然比构建真正的原生应用要差。事实是，PhoneGap\
  \ 让发布原生应用变得简单。对于那些已经拥有 Web 应用并想将其转换为原生设备应用的项目来说，非常棒，这意味着你只需要很少编程就能发布你的专用应用程序。\n\n\
  如既往一样，一分钱一分货。原生的应用总是 PhoneGap 应用更好，但它们的开发成本通常高得多，尤其是当你计划在多个平台发布时。\n\n## 原生应用对标 Web\
  \ 应用\n\n你还需要决定是否真的需要原生应用。根据你的情况，标准的 Web 应用可能更合适。Web 应用对用户的投入较少，因为他们不需要向设备下载并安装新东西。问问自己自己：我是想下载这个应用，还是仅仅通过浏览器访问它？\n\
  \n此决定的另一个因素是你是否想涉及 iOS App Store 或 Android 市场。在分发方面，这些可能是福音；但在涉及收取的 30% 费用时可能是诅咒（更不用说那神秘的审批过程了）。\n\
  \n请记住，在许多设备上，Web 应用仍然保存到主屏幕，这意味着用户仍然可以点击手机上的图标来打开你的应用。\n\n# 开始使用 PhoneGap\n\n尽管\
  \ PhoneGap 可以将你的代码发布到许多不同的移动平台，但发布过程并不是拨开关那么简单。每个平台的部署方式都略有不同，必须单独进行。但这仍然比从头开始编写每个应用要容易得多。有关如何开始你想要支持的每个平台的更多信息，请访问\
  \ [`http://docs.phonegap.com/en/2.2.0/guide_getting-started_index.md.html`](http://docs.phonegap.com/en/2.2.0/guide_getting-started_index.md.html)。\n\
  \n此外，请记住，并不是所有的 API 在每个设备或平台上都可用。有关兼容性表，请访问 [`http://phonegap.com/about/feature`](http://phonegap.com/about/feature)。\n\
  \n## 连接摄像头\n\n一旦你设置好 PhoneGap，使用设备功能就很简单，因为 PhoneGap 通过简单的 JavaScript API 暴露了原生设备功能。例如，你可以使用\
  \ `getPicture()` 方法访问设备的摄像头：\n\n```javascript\nnavigator.camera.getPicture(onSuccess,\
  \ onError, {\n  quality: 60,\n  destinationType: Camera.DestinationType.DATA_URL\n\
  });\n\nfunction onSuccess(imageData) {\n  // 创建新图像\n  var img = new Image();\n \
  \ img.src = \"data:image/jpeg;base64,\" + imageData;\n  // 将其添加到 DOM\n  document.body.appendChild(\
  \ img );\n}\n\nfunction onError(message) {\n  alert(message);\n}\n```\n\n当应用运行此脚本时，它会打开设备上的原生相机对话框，然后将该数据传回应用。`getPicture()`\
  \ 方法接受成功和错误回调，以及一个选项对象。在示例中，相机作为数据 URI 传递图像，然后将其添加到 DOM 中。\n\n或者，你可以将此数据保存到服务器上，甚至可以访问设备的文件系统来存储图像。\n\
  \n虽然大多数设备在浏览器级别不提供摄像头访问权限，但 Android 支持 `Media Capture API`，即使没有 PhoneGap 你也可以用它拍照。\n\
  \n## 连接联系人列表\n\n移动设备可能不会提供浏览器级别的联系人列表数据访问。这些信息太敏感了。然而，原生应用可以访问这些数据，PhoneGap 应用也不例外。只需利用\
  \ `contacts` API 即可：\n\n```javascript\nnavigator.contacts.find('*', function(contacts)\
  \ {\n  console.log(contacts);\n}, function(error) {\n  alert(error);\n}, {\n  multiple:\
  \ true\n});\n```\n\n在这里`find()` 方法返回所有联系人的列表。与摄像头 API 类似，该方法接受成功和错误回调以及一个选项数组。\n\
  \n获取联系人信息对某些应用非常有用，例如用户想找朋友一起玩游戏或分享照片。\n\n## 其他 API\n\n希望这些快速示例让你了解使用 PhoneGap API\
  \ 它是多么简单。但它们真的只是冰山一角。PhoneGap 包含了你可以在移动应用中利用的各种附加 API。\n\n你可以访问加速度计和陀螺仪、录制音频和视频、在设备存储器中保存和加载文件等。更多信息，请访问\
  \ PhoneGap Docs：[`http://docs.phonegap.com/en/2.2.0/index.html`](http://docs.phonegap.com/en/2.2.0/index.html)。\n\
  \n## 总结\n\n在本章中，你学习了各种移动开发技能。你首先学习了如何检测移动设备并创建随不同屏幕尺寸和设备方向缩放的响应式布局。然后你研究了一些简单的脚本，可以使用它们处理移动视口并交付响应式内容和图像。\n\
  \n接下来你学习了多触控设备以及如何使用 Hammer.js 设置手势处理程序。然后你学习了使用地理位置 API 使用本地化内容，以及如何使用设备的手机功能——使用\
  \ JavaScript 发送电话和短信。\n\n最后，你阅读了 PhoneGap 以及如何使用你已有的 JavaScript 技能构建原生移动应用。\n\n\
  我确定你理解开发移动应用的重要性。现在你拥有实现它的技能了。\n\n# 其他资源\n\n### 移动使用统计\n\nGoogle Mobile Planet:\
  \ [`www.thinkwithgoogle.com/mobileplanet/en`](http://www.thinkwithgoogle.com/mobileplanet/en/)\n\
  \nOfcom Report: [`www.smartinsights.com/marketplace-analysis/customer-analysis/new-internet-usage-report`](http://www.smartinsights.com/marketplace-analysis/customer-analysis/new-internet-usage-report/)\n\
  \n\n\n\n\n# iOS 陀螺仪与加速度计：[`www.peterfriese.de/how-to-use-the-gyroscope-of-your-iphone-in-a-mobile-web-app`](http://www.peterfriese.de/how-to-use-the-gyroscope-of-your-iphone-in-a-mobile-web-app/)\n\
  \nPhoneGap 文档：[`http://docs.phonegap.com`](http://docs.phonegap.com/en/2.2.0/index.html)\n\
  \n# 第 11 章：JavaScript 图形\n\nHTML5 引入的最令人印象的功能之一是直接在浏览器中渲染图形的能力。你不仅可以使用 `JavaScript`\
  \ 生成静态图像，还可以利用这些技术创建惊叹的交互式应用程序，例如视频游戏。事实上，这些应用并不限于二维。随着 `WebGL` 引擎的集成，你现在可以创建在浏览器中原生运行的\
  \ 3D 应用程序。\n\n在本章中，你首先将发现如何在 `canvas` 中绘制 2D 场景，并整合动画和鼠标事件。然后，你将学习如何使用可缩放矢量图形 (`SVG`)\
  \ 渲染类似的场景，它们更容易制作动画并实现交互性。接下来，你将发现 `Raphaël.js` 库，它将通过直观的 API 简化 `SVG` 开发。随后，你将接触\
  \ `Raphaël` 的图表库，并发现如何用自己的代码来自定义这些图表。\n\n在理解了不同的二维技术后，你就可以准备好深入使用 `canvas` 和 `WebGL`\
  \ 进行 3D 渲染了。你将发现为什么要避免低级的 `WebGL` API，而是使用 `Three.js` 库，并利用它来构建和动画化一些基础的三维场景。最后，你将考虑另一种\
  \ 3D 渲染选项——`CSS3` 变换，这对于更基础的应用程序来说是一个极具吸引力的替代方案。到本章结束，你将掌握足够的 `JavaScript` 绘图技术，可以直接在浏览器中渲染你想要的任何场景。本章是开发基于\
  \ `JavaScript` 的丰富视觉应用的起点。\n\n## Canvas 基础\n\nHTML5 `canvas` 允许你动态渲染你所想象的几乎任何形状或场景。这一切从在标记中定义一个\
  \ `canvas` 元素开始：\n\n```\n<canvas id=\"my-canvas\" width=\"200\" height=\"150\"></canvas>\n\
  ```\n\n接下来，你使用 `JavaScript` 挂钩此元素并渲染你想要绘制的任何场景。首先通过元素的元素的 ID 钩子设置上下文：\n\n```javascript\n\
  var canvas = document.getElementById('my-canvas');\nif ( canvas.getContext ) {\n\
  \  var ctx = canvas.getContext('2d');\n}\n```\n\n`canvas` 元素的上下文告诉浏览器你想使用哪种类型的渲染引擎——在这种情况下，是基础的二维渲染。但在设置上下文之前，检查\
  \ `canvas` 的支持情况是重要的。某些用户使用的旧版浏览器不支持 `canvas`，你通过先验证 `canvas.getContext` 是否可用，可以避免在这些浏览器中抛出错误。幸运的是，如今\
  \ `canvas` 的支持已经相当不错了，除了 `IE8` 及更早版本，正如你在这里看到的：[`http://caniuse.com/#feat=canvas`](http://caniuse.com/#feat=canvas)。\n\
  \n在后面的 使用 WebGL 的 3D Canvas 部分中，你将学习如何使用不同的上下文来渲染 3D 场景。\n\n## 绘制基础形状\n\n现在，你已经准备好深入并在\
  \ `canvas` 上绘制了。`canvas` API 提供了许多你可以使用的不同方法来渲染形状和线条，以及用于这些对象样化的多种方法。例如，此脚本在 `canvas`\
  \ 上画了一个矩形：\n\n```javascript\nvar canvas = document.getElementById('my-canvas');\n\
  if ( canvas.getContext ) {\n  var ctx = canvas.getContext('2d');\n  ctx.fillStyle\
  \ = '#d64e34';\n  ctx.fillRect(10, 15, 80, 50);\n}\n```\n\n在这里，`fillStyle` 首先定义了矩形的颜色（以及你之后绘制的任何形状的颜色）。然后\
  \ `fillRect()` 在坐标 (10,15) 处渲染一个大小为 80px 乘 50px 的实心矩形，这意味着矩形距离 `canvas` 元素顶部 10\
  \ 像素，距离左侧 15 像素，如图 11-1 所示。\n\n![9781118524565-fg1101.tif](img/9781118524565-fg1101_fmt.png)\n\
  \n图 11-1 `fillRect` 在 `canvas` 上绘制了一个矩形。\n\n`fillRect` 是绘制框的简单简写，但你也可以通过绘制路径来构建自己的形状。例如，你可以画一个三角形：\n\
  \n```javascript\nctx.beginPath();\nctx.moveTo(20, 90);\nctx.lineTo(140, 90);\nctx.lineTo(80,\
  \ 25);\nctx.fill();\n```\n\n绘制自己的形状稍微复杂一些：\n\n1. `beginPath()` 开始新路径。\n2. `moveTo()`\
  \ 定义路径的起点，在这种情况下距离左侧 20px，距离顶部 90px。\n3. `lineTo()` 绘制一条连接到指定坐标的直线。\n4. `fill()`\
  \ 用指定的颜色填充路径。\n\n\n\n\n你可能会担心这种不断绘制和重绘画布（canvas）的做法实际上非常消耗资源。但令你惊讶的是：浏览器处理 canvas\
  \ 渲染得非常好，这类动画通常是平滑的。在下一章中，你将学习如何使用 `requestAnimationFrame` 让它们变得更加流畅。\n\n## Canvas\
  \ 鼠标事件\n\nHTML5 canvas 通常用于创建交互式元素，这意味着你需要设置一个接口来操作这些元素。然而，在 canvas 上添加鼠标交互并不像你想象的那样直观。你无法在你绘制到\
  \ canvas 的元素上设置点击监听器。相反，你必须设置通用的监听器，判断点击事件的位置是否与 canvas 上渲染的元素位置对齐。例如，取之前示例中的矩形：\n\
  \n```\nctx.fillRect(10, 15, 80, 50);\n```\n\n遗憾的是，你无法获取该矩形的 DOM 引用并用它来应用点击处理器，因为\
  \ canvas 只是所有绘制到它上面的内容的静态渲染。因此，在用 canvas 设置鼠标处理程序时，你需要得更有创意。首先，在 canvas 元素上设置一个通用的点击监听器，并确定点击事件相对于\
  \ canvas 的位置：\n\n```javascript\n$('#my-canvas').click(function(e) {\n  var offsetX\
  \ = e.pageX – this.offsetLeft;\n  var offsetY = e.pageY – this.offsetTop;\n});\n\
  ```\n\n接下来，判断该点是否存在于矩形的边界内：\n\n```javascript\n$('#my-canvas').click(function(e)\
  \ {\n  var offsetX = e.pageX - this.offsetLeft;\n  var offsetY = e.pageY - this.offsetTop;\n\
  \  if ( (offsetX > 10 && offsetX < 90) && (offsetY > 15 && offsetY < 65) ) {\n \
  \   alert('Rectangle clicked');\n  }\n});\n```\n\n在这里，脚本将点击事件的坐标与矩形的坐标进行比较。例如，矩形的\
  \ x 轴从 10（起点）到 90（起点加上宽度）。虽然这看起来可能很复杂，但计算矩形的点击点相对简单。想象一下，对于复杂的多边形或曲线，这种数学将会有多困难！\n\
  \n除非你真的对线性代数感兴趣，否则你可能想要使用一个库来处理这种行为。或者继续阅读下一节，在在那里你将学习 SVG，它对鼠标交互要友好得多。\n\n## SVG\
  \ 基础\n\n与 canvas 不同，你实际上可以使用标记而不需要 JavaScript 就可以定义 SVG 图像。例如，这段标记绘制了一个矩形：\n\n```xml\n\
  <svg height=\"200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"150\"\
  \ height=\"100\" fill=\"blue\" />\n</svg>\n```\n\n在这里，SVG 标记首先从 `<svg>` 容器开始。然后标记声明了一个矩形元素，带有尺寸和填充颜色。\n\
  \n你可以向 SVG 中添加任意数量的形状。例如，添加一个圆和一个三角形：\n\n```xml\n<svg height=\"200\" xmlns=\"http://www.w3.org/2000/svg\"\
  >\n  <rect width=\"150\" height=\"100\" fill=\"blue\" />\n  <circle r=\"50\" cx=\"\
  50\" cy=\"50\" fill=\"red\" />\n  <polygon points=\"0,0 50,50 100,0\" fill=\"orange\"\
  \ />\n</svg>\n```\n\n在这里，圆和多边形（三角形）堆叠在矩形之上，如图 11-5 所示。\n\n![9781118524565-fg1105.tif](img/9781118524565-fg1105_fmt.png)\n\
  \n图 11-5 使用简单的标记在此 SVG 中绘制了三个形状。SVG 中的形状按照添加的顺序堆叠。\n\n## 使 SVG 动画\n\n你已经知道处理 canvas\
  \ 可能很困难，因为绘制到 canvas 上的一切都是完全静态的。不过，你会高兴地知道，SVG 正好相反。当你想要移动某些东西时，不需要在 SVG 中绘制并重绘一切；你只需要从\
  \ DOM 中获取节点并用 JavaScript 移动它：\n\n```javascript\n$('svg circle').attr('cx', 60).attr('cy',\
  \ 60);\n```\n\n此示例使用 jQuery 选择圆并将中心点移动到 (60,60)。你可以对任何想要操作的其他内容使用类似的技术：颜色、尺寸等。你甚至可以设置简单的动画——例如，增加圆的尺寸：\n\
  \n```javascript\nvar circle = $('svg circle'),\n    radius = 50;\nvar svgInterval\
  \ = setInterval(function() {\n  radius += .2;\n  if ( radius > 70 ) {\n    clearInterval(svgInterval);\n\
  ```\n\n\n\n\n1. 它从移动操作 `M300,50` 开始，它将路径的起点移动到 (300,50)，这与你之前在 Canvas 基础章节中学过的 `moveTo()`\
  \ 方法类似。\n\n2. 接下来，`L100,350` 绘制一条到 (100,350) 的直线，类似于画布中的 `lineTo()` 方法。\n\n3. 然后\
  \ `L500,350` 和 `L300,50` 绘制了另外两条线来完成三角形，如图 11-7 所示。\n\n![9781118524565-fg1107.tif](img/9781118524565-fg1107_fmt.png)\n\
  \n图 11-7 这个三角形使用复杂的路径字符串绘制。\n\n接下来，路径字符串可以稍微简化：\n\n```\nvar triangle = paper.path('M300,50\
  \ L100,350 L500,350 Z');\n```\n\n在这里，最后一条线命令被替换为 `Z`，它关闭了路径，从而绘制了三角形的第三条线。\n\nRaphaël\
  \ 中的路径字符串是基于 W3Cget 的标准 SVG 路径字符串的。你可以在这里阅读更多关于路径字符串的信息：[`www.w3.org/TR/SVG.html#PathData`](http://www.w3.org/TR/SVG.html#PathData)。\n\
  \n## 绘制曲线\n\n为止，我向你展示了如何绘制直线，但你也可以使用路径字符串绘制许多曲线，从基础弧到复杂的贝塞尔曲线。然而，为复杂的曲线生成路径字符串具有挑战性。当然，你可以绘制任何类型的曲线；更好的想法是使用可视化编辑器创建所需的曲线，然后导出为\
  \ SVG。Adobe Illustrator 提供了导出为 SVG 的选项，如图 11-8 所示。使用此工具，你可以在 Illustrator 中绘制复杂的形状，然后将其保存为\
  \ SVG。\n\n![9781118524565-fg1108.tif](img/9781118524565-fg1108_fmt.png)\n\n图 11-8\
  \ Adobe Illustrator 允许你将矢量图形导出为 SVG。\n\n一旦保存了 SVG，用文本编辑器打开它并提取你需要的部分。例如，这是一个简单曲线的输出：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<!-- Generator: Adobe\
  \ Illustrator 16.0, SVG Version: 6.0 -->\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG\
  \ 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg version=\"\
  1.1\" id=\"Layer_1\" xmlns=\"http://www.w3.org/2000/svg\"\nxmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  \ x=\"0px\" y=\"0px\"\nwidth=\"600px\" height=\"400px\" viewBox=\"0 0 600\n400\"\
  \ style=\"enable-background:0 0 600\n400;\" xml:space=\"preserve\">\n<path style=\"\
  fill:none;stroke:#000000;stroke-width:1.5;\nstroke-miterlimit:10;\" d=\"M251.742,85.146\
  \ C75.453,48.476,100.839,430.671,\n309.565,250.152\"/>\n</svg>\n```\n\n我在这里强调了重要部分：`M251.742,85.146\
  \ C75.453,48.476,100.839,430.671`\n\n你可以将此路径字符串传递 Raphaël 的 `path()` API 以在你的 SVG\
  \ 中生成曲线。根据你在 Illustrator 中绘制路径的方式，你可能需要调整某些值使其在你的画布上正确对齐。\n\n这个示例很容易手动移植到 Raphaël，但如果你有复杂的\
  \ SVG，可以节省更多精力。只需将导出的 SVG 上传到[`www.raphysetael.com`](http://www.raphysetael.com/)，它会自动将\
  \ SVG 转换为 Raphaël 代码。\n\n或者，为了了解如何自己构建曲线，请访问[`https://developer.mozilla.org/en-US/docs/SVG/Paths`](https://developer.mozilla.org/endocs/SVG/Paths)，你可以在那里学习多种曲线类型。\n\
  \n## 样式\n\nRaphaël 为你的 SVG 提供了多种可以使用 `attr()` 方法应用的样式。你之前已经在示例中看到了这些样式，其中 `attr()`\
  \ 用于填充颜色和描边宽度。但在 Raphaël.js 丰富的样式功能方面，那些只是冰山一角。例如，要给上一个示例中的三角形应用渐变，你写道：\n\n```javascript\n\
  triangle.attr({\n  gradient: '90-#444-#EEE'\n});\n```\n\n在这里，渐变字符串定义了三个选项。首先，`90`\
  \ 是渐变的角度，在这种情况下，是从底部开始的垂直渐变（从顶部向下，使用 `270`）。接下来，为渐变定义了两种十六进制颜色，从深灰色过渡到浅灰色，如图 11-9\
  \ 所示。\n\n![9781118524565-fg1109.tif](img/9781118524565-fg1109_fmt.png)\n\n图 11-9\
  \ 这个渐变使用了 Raphaël 的 `attr()` 方法。\n\nRaphaël 还提供了各种描边选项，在此示例所示：\n\n```javascript\n\
  triangle.attr({\n  'gradient': '90-#444-#EEE',\n  'stroke': 'green',\n  'stroke-width':\
  \ 20,\n  'stroke-linejoin': 'round'\n});\n```\n\n这段代码首先将描边颜色改为 `green`，证明 Raphaël\
  \ 能够解析颜色字符串（除了十六进制颜色、RGB、RGBa、HSL 等）。然后将描边宽度增加到 20px，并将连接处设置为 `round`，从而渲染出类似图 11-10\
  \ 中的圆角。\n\n![9781118524565-fg1110.tif](img/9781118524565-fg1110_fmt.png)\n\n图 11-10\
  \ 三角形添加了多种描边样式。\n\nRaphaël 甚至包含了一些用于虚线和点线的有趣选项。你可以使用 `stroke-dasharray` 选项使用任何线和点的组合：\n\
  \n```javascript\nvar circle = paper.circle(300,200,120);\ncircle.attr({\n  'stroke-width':\
  \ 15,\n  'stroke-dasharray': '-..'\n});\n```\n\n如图 11-11 所示，这种 `stroke-dasharray`\
  \ 创建了虚线和点的模式。\n\n![9781118524565-fg1111.tif](img/9781118524565-fg1111_fmt.png)\n\
  \n图 11-11 这个描边利用了 `stroke-dasharray`。\n\n这些只是 Raphaël 许多选项中的一部分。\n\n\n\n\n\n```javascript\n\
  \  r: 60,\n  cx: 500,\n  cy: 100\n}, 2000, '<>';\n```\n\n在这里，脚本动画化圆的几个特性：`fill`\
  \ 颜色、`stroke-width`、半径 (`r`) 以及中心点（`cx` 和 `cy`）。\n\n最后，你可以对路径的各个点进行动画。只需向动画传递一个新的路径，`Raphaël`\
  \ 就会会在旧点和新点之间设置一个补间动画（tween），并在它们之间进行平滑动画：\n\n```javascript\nvar triangle = paper.path('M300,100\
  \ L150,300 L450,300 Z');\ntriangle.animate({path: 'M300,300 L150,100 L450,100 Z'},\
  \ 2000, '<>');\n```\n\n等等，我注意到原文还有更多的代码块。让我重新正确格式化一下整个文本：\n\n如果你运行此脚本，你将看到三角形的路径在翻转。但不必止于此；你可以使用路径动画来创建一个非常复杂的动画：\n\
  \n```javascript\nvar triangle = paper.path('M300,100 L150,300 L450,300 Z');\n(function\
  \ animationCycle() {\n  triangle.animate({path: 'M300,300 L150,100 L450,100 Z'},\
  \ 1200, '<>',\n    function() {\n      triangle.animate({path: 'M300,300 L600,300\
  \ L450,100 Z'}, 1200, '<>',\n      function() {\n        triangle.animate({path:\
  \ 'M450,100 L600,300 L300,300 Z'}, 1200,\n        '<>', function() {\n         \
  \ triangle.animate({path: 'M300,100 L150,300 L450,300 Z'}, 1200,\n          '<>',\
  \ animationCycle);\n        });\n      });\n    });\n  );\n})();\n```\n\n在这里，三角形以各种方向在无限循环中不断翻转。`Raphaël`\
  \ 中的动画限制仅限于你的想象力。\n\n## 鼠标事件\n\n在之前的 SVG 鼠标事件 部分中，你已经看到将鼠标交互应用到 SVG 是多么简单了，而用 `Raphaël`\
  \ 构建的 SVG 也不例外。但在应用鼠标交互之前，你必须获取 SVG 的 DOM 引用。要做到这一点，请访问 `Raphaël` 对象的 `node` 属性：\n\
  \n```javascript\nvar triangle = paper.path('M300,100 L150,300 L450,300 Z');\ntriangle.attr('fill',\
  \ 'white');\ntriangle.node.onclick = function() {\n  triangle.attr('fill', 'red');\n\
  };\n```\n\n在这里，一个点击事件被绑定到了三角形节点，它改变了填充颜色。如果你倾向于避免使用基本的 JavaScript 事件处理程序，也可以将此引用传递给\
  \ `jQuery` 或另一个库：\n\n```javascript\n$(triangle.node).on('mouseover', function()\
  \ {\n  triangle.attr('fill', 'red');\n}).on('mouseout', function() {\n  triangle.attr('fill',\
  \ 'white');\n});\n```\n\n在这里，`jQuery` 绑定了 `mouseover` 和 `mouseout` 处理程序以便在悬停时改变三角形的颜色。\n\
  \n在绑定鼠标事件时，如果你的 SVG 没有填充颜色，请务必小心。如果没有填充，只有当用户点击描边（stroke）时事件才会触发，而在形状内部则不会触发。如果这不是你想要行为，你可以应用一个\
  \ `rgba(0,0,0,0)` 的透明填充来解决这个问题。\n\n## 使用 gRaphaël 绘制图表\n\n除了标准图形库外，`Raphaël` 项目还维护了一个名为\
  \ `gRaphaël` 的图表库（[`g.raphaeljs.com`](http://g.raphaeljs.com/)`）。`gRaphaël` 构建在\
  \ `Raphaël` 之上并提供了一些图表选项。与其他库相比，这些图表相对轻量，特别是如果你已经在使用 `Raphaël` 处理其他功能时。然而，文件大小上的优势是有代价的——`gRaphaël`\
  \ 的图表功能没有其他图表库那么丰富。尽管如此，如果你想要简单且优雅的东西，`gRaphaël` 是一个极佳的选择。\n\n### 饼图\n\n你可以用一行代码在\
  \ `gRaphaël` 中创建一个饼图：\n\n```javascript\npaper.piechart(300, 200, 150, [65, 40, 13,\
  \ 32, 5, 1, 2]);\n```\n\n此脚本创建了一个中心点在 (300,200)、半径为 150px 的饼图，并显示数组中的数据（如 图 11-12\
  \ 所示）。\n\n![9781118524565-fg112.tif](img/9781118524565-fg112.tif)\n\n图 11-12 `gRaphaël`\
  \ 中的一个基础饼图。\n\n要在图表中添加图例，如 图 11-13 所示，在第五个参数中作为选项对象的一部分传递图例：\n\n```javascript\n\
  paper.piechart(300, 200, 150, [65, 40, 13, 32, 5, 1, 2], {\n  legend: ['Donkeys',\
  \ 'Monkeys', 'Llamas', 'Pandas', 'Rhinos', 'Gorillas']\n});\n```\n\n![9781118524565-fg113.tif](img/9781118524565-fg113.tif)\n\
  \n图 11-13 带有图例的饼图。你可以通过在图例中包含 `%%` 来微调 `legend` 数组，例如 `40`。最后，要转换图表中的切片，只需传递 `href`\
  \ 数组：\n\n```javascript\npaper.piechart(300, 200, 150, [65, 40, 13, 32, 5, 1, 2],\
  \ {\n  legend: ['Donkeys', 'Monkeys', 'Llamas', 'Pandas', 'Rhinos', 'Gorillas']\n\
  });\n```\n\n这些是 `gRaphaël` 饼图提供的一些选项。要了解更多功能，请访问 [`http://g.raphaeljs.com/piechart`](http://g.raphaeljs.com/piechart)）。\n\
  \n### 柱状图\n\n`gRaphaël` 也支持柱状图。例如：\n\n```javascript\nvar triangle = paper.path('M300,100\
  \ L150,300 L450,300 Z');\n```\n\n在这里，前两个参数是起始点 (0,0)，接两个是宽度和高度。通过一个值数组来转换 图 11-14\
  \ 所示的 SVG。\n\n![9781118524565-fg114.tif](img/9781118524565-fg114.tif)\n\n图 11-14\
  \ `gRaphaël` 中的基础柱状图。\n\n`gRaphaël` 也支持柱状图。例如：\n\n```javascript\nvar triangle =\
  \ paper.path('M300,100 L150,300 L450,300 Z');\n```\n\n在这里，前两个参数是起始点 (0,0)，接两个是宽度和高度。通过一个值数组来转换\
  \ 图 11-15 所示的 SVG。\n\n在柱状图上，通过传递三个数组来转换图表：\n\n```javascript\npaper.piechart(300,\
  \ 200, 150, [65, 40, 13, 32, 5, 1, 2]);\n```\n\n在这里，通过三个数组来转换图表：\n\n```javascript\n\
  paper.piechart(300, 200, 150, [65, 40, 13, 32, 5, 1, 2]);\n```\n\n\n\n\n\n在此实现中，一个设置对象被传递给\
  \ `labelBarChart`，它定义了标签的起始坐标 (0,390) 以及图表的宽度。此外，它还定义了每列的标签，以及针对文本的可选设置。如图 11-17\
  \ 所示，这标记了柱状图的 x 轴。\n\n![9781118524565-fg1117.tif](img/9781118524565-fg1117_fmt.png)\n\
  \n图 11-17 带有自定义标签的柱状图。\n\n标记 y 轴稍微有点挑战性，但并非不可能。按照 x 轴的示例将其编写为一个练习题。或者，如果你需要 y 轴标签且不想编写这段代码，可以考虑使用不同的库来制作柱状图，例如\
  \ Raphy Charts：[`http://softwarebyjosh.com/raphy-charts`](http://softwarebyjosh.com/raphy-charts/)`。\n\
  \n## 折线图\n\n幸运的是，gRaphaël 的折线图比它的柱状图健壮一点。API 也相当相似，主要的区别在于你需要传递两个值数组分别对应 x 值和 y\
  \ 值：\n\n```\nvar xVals = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55],\n    yVals\
  \ = [63, 84, 75, 91, 62, 75, 35, 53, 47, 75, 78, 54];\nvar chart = paper.linechart(0,\
  \ 0, 600, 380, xVals, yVals);\n```\n\n在这里，前两个参数是起始坐标 (0,0)，后面是图表的宽度和高度，然后是两个数组。它生成了一个如图\
  \ 11-18 所示的最基础折线图。\n\n![9781118524565-fg1118.tif](img/9781118524565-fg1118_fmt.png)\n\
  \n图 11-18 gRaphaël 的基础折线图。\n\n你也可以传递多组值向图表添加线条：\n\n```\nvar xVals = [0, 5, 10, 15,\
  \ 20, 25, 30, 35, 40, 45, 50, 55],\n    yVals1 = [63, 84, 75, 91, 62, 75, 35, 53,\
  \ 47, 75, 78, 54],\n    yVals2 = [24, 45, 31, 42, 88, 85, 67, 88, 72, 37, 54, 48];\n\
  var chart = paper.linechart(0, 0, 600, 380, xVals, [yVals1, yVals2]);\n```\n\n在这里，添加了第二组\
  \ y 值，它使用了相同的 x 值组，如图 11-19 所示。\n\n![9781118524565-fg1119.tif](img/9781118524565-fg1119_fmt.png)\n\
  \n图 11-19 你可以在图表中添加多条线条。\n\n幸运的是，与柱状图不同，gRaphaël 为折线图提供了添加轴的原方法。可以使用 `axis` 选项添加轴：\n\
  \n```\nvar chart = paper.linechart(30, 0, 570, 380, xVals, [yVals1, yVals2], {axis:\
  \ '0 0 1 1'});\n```\n\n`axis` 字符串定义了按 TRBL 顺序（上、右、下、左）渲染哪些轴——在这种情况下，显示底部和左侧轴（参见图\
  \ 11-20）。此外注意 `x_start` 和 `width` 参数已调整，为 y 轴留出了 30px 的空间。\n\n![9781118524565-fg1120.tif](img/9781118524565-fg1120_fmt.png)\n\
  \n图 11-20 带有轴的折线图。\n\n最后，你可能注意到轴上的步长值有点奇怪。由于 x 值分布均匀分布，对它们进行标记是良好的做法。你可以使用 `axisxstep`\
  \ 选项设置更自然的标记：\n\n```\nvar chart = paper.linechart(30, 0, 570, 380, xVals, [yVals1,\
  \ yVals2], {axis: '0 0 1 1', axisxstep: 11});\n```\n\n现在 x 轴的标记直观得多了，如你在图 11-21\
  \ 所示。\n\n![9781118524565-fg1121.tif](img/9781118524565-fg1121_fmt.png)\n\n图 11-21\
  \ 在此图表中调整了 axisxstep 值。\n\n`axisxstep` 值有点困惑，因为它比你想要显示的步长数量少一个。在这种情况下，11 的值表示轴上有\
  \ 12 个步长。\n\ngRaphaël 的折线图比它的柱状图健壮一点。API 也相当相似，主要的区别在于你需要传递两个值数组分别对应 x 值和 y 值：\n\
  \n## WebGL 的 3D 画布\n\n幸运的是，gRaphaël 的折线图比它的柱状图健壮一点。API 也相当相似，主要的区别在于你需要传递两个值数组分别对应\
  \ x 值和 y 值：\n\n## 介绍 Three.js\n\n如今 WebGL 最令人兴奋的方面之一是构建 3D 应用的能力。幸运的是，Three.js 简化了\
  \ 3D 开发\n\n## 添加相机\n\n接下来，创建任何 3D 场景中不可或缺的部分——相机。本身，WebGL 中的 3D 场景只是形状存在于 3D 空间的概念模型。相机用于渲染这些信息并将其传递给用户\n\
  \n## WebGL 注意事项\n\n在对在浏览器中使用 WebGL 感到兴奋之前，记住几点注意事项是重要的。首先，浏览器支持尚未完全。虽然大多数浏览器都支持\
  \ WebGL，但在任何版本的 IE 中都不支持。此外，移动端覆盖率非常差，仅在最新版本中支持。幸运的是，Three.js 提供 2D 画布回退方案，你将在本节最后学习。\n\
  \n## 设置场景\n\n要开始，请在你的页面中引入 Three.js：\n\n```html\n<div id=\"container\" style=\"\
  background-color: #000; width: 600px; height: 400px;\"></div>\n```\n\n现在，设置场景：\n\
  \n```javascript\n// 获取容器\nvar container = document.getElementById('container'),\n\
  \    width = container.offsetWidth,\n    height = container.offsetHeight;\n\n//\
  \ 创建渲染器并将其添加到容器\nvar renderer = new THREE.WebGLRenderer();\nrenderer.setSize(width,\
  \ height);\ncontainer.appendChild(renderer.domElement);\n\n// 创建新场景\nvar scene =\
  \ new THREE.Scene();\n```\n\n添加相机\n\n```javascript\n// 创建相机、设置位置并将其添加到场景\nvar camera\
  \ = new THREE.PerspectiveCamera( 45, width/height, 0.1, 1000 );\ncamera.position.z\
  \ = 400;\nscene.add( camera );\n```\n\n\n\n\n创建相机后，你需要在场景中对它进行定位。就像构成场景的形状一样，相机也存在于\
  \ 3D 空间中。你可以将这个位置想象成你希望摄像师站立，并拍摄最终将展开的场景。在这个示例中，`camera.position.z` 将相机沿 z 轴移动 400\
  \ 个单位。\n\n## 添加网格 (Mesh)\n\n在 WebGL 中，你添加到场景中的任何形状都被称为网格（mesh）。网格由两个部分组成：\n\n- `Geometry`（几何体），定义物体的顶点形状\n\
  - `Material`（材质），定义材质表面如何被光照和渲染\n\n要向场景中添加一个简单的球体，脚本需要创建这些组件：\n\n```javascript\n\
  // add a sphere\nvar geometry = new THREE.SphereGeometry( 100, 24, 24 ),\nvar material\
  \ = new THREE.PhongMaterial({\n  color: 0x00FF00\n}),\nsphere = new THREE.Mesh(\
  \ geometry, material );\nscene.add( sphere );\n```\n\n这段代码首先创建了一些球体几何体。第一个参数定义了\
  \ 100 个单位的半径，第二个参数定义了创建模型时使用的分段（segments）和环（rings）的数量。使用的分段和环越多，渲染时模型的表面看起来越平滑。这是因为\
  \ WebGL 中的球体并不是真正的球体：它是由多边形组成的近似值。要了解其工作原理，请参见图 11-22。\n\n![97811852465-fg1122.tif](img/97811852465-fg1122.png)\n\
  \n图 11-22 由多边形组成的 3D 球体。锯齿边缘在运行时由渲染器平滑。这个球体是使用 Blender 渲染的，但 WebGL 使用了相同的概念。\n\n\
  接下来，定义了一个颜色为 `#00FF00` 的 Phong 材质。Phong 是一种定义光线如何影响物体的着色器（shader）。先不用担心着色器。最后，将几何体和材质组合在一起创建网格，并将其添加到场景中。Three.js\
  \ 中另一种常用的材质是 `MeshLambertMaterial`，它与 Phong 类似，但 Lambert 的反射率较低且倾向于显示阴影。\n\n## 添加光照\n\
  \n现在相机和球体已经添加到场景中，工作快要完成了。然而，如果你尝试按原样渲染，Three.js 会显示黑屏，因为你还需要添加光照：\n\n```javascript\n\
  // add a light\nvar light = new THREE.DirectionalLight( 0xFFFFFF, 1 );\nlight.position.set(\
  \ 0, 0.5, 1 );\nscene.add( light );\n```\n\n这段代码向场景中添加了一个平行光。第一个参数指定光的颜色，第二个参数指定强度。平行光是\
  \ Three.js 中几种照明选项之一，包括环境光（均匀地照亮整个场景）和点光（从像蜡烛这样的单个点发射）。而平行光在给定的方向上均匀光照，就像照射在地球上的平行阳光（好吧，实际上是准平行的）。\n\
  \n要设置平行光的角度，你只需要对其进行定位。在这里，光线位于 y 轴向上 `0.5` 个单位，并向 z 轴相机方向 `1` 个单位。然后光线将调整其角度指向原点\
  \ `(0,0,0)`。在这种情况下，结果是向下并远离相机的 30° 角。\n\n## 渲染场景\n\n最后但同样重要的是，你需要渲染场景：\n\n```javascript\n\
  renderer.render( scene, camera );\n```\n\n如图 11-23 所示，此脚本创建了一个简单的球体。\n\n![97811852465-fg1123.tif](img/97811852465-fg1123.png)\n\
  \n图 11-23 此球体已使用 Three.js 和 WebGL 进行渲染。\n\n简单回顾一下，这里是整个示例：\n\n```javascript\n//\
  \ get the wrapper\nvar container = document.getElementById('container'),\nwidth\
  \ = container.offsetWidth,\nheight = container.offsetHeight;\n\n// create renderer\
  \ and add it to the container\nvar renderer = new THREE.WebGLRenderer();\nrenderer.setSize(\
  \ width, height );\ncontainer.appendChild( renderer.domElement );\n\n// create a\
  \ new scene\nvar scene = new THREE.Scene();\n\n// create a camera, position it and\
  \ add it to the scene\nvar camera = new THREE.PerspectiveCamera( 45, width/height,\
  \ 0.1, 1000 );\ncamera.position.z = 400;\nscene.add( camera );\n\n// add a sphere\n\
  var geometry = new THREE.SphereGeometry( 100, 24, 24 ),\nmaterial = new THREE.MeshPhongMaterial({\n\
  \  color: 0x00FF00\n}),\nsphere = new THREE.Mesh( geometry, material );\nscene.add(\
  \ sphere );\n\n// add a light\nvar light = new THREE.DirectionalLight( 0xFFFFFF,\
  \ 1 );\nlight.position.set( 0, 0.5, 1 );\nscene.add( light );\n\n// render it\n\
  renderer.render( scene, camera );\n```\n\n如示例所示，渲染场景需要以下四个主要步骤：\n1. 设置渲染器和场景。\n\
  2. 创建相机并定位，将其添加到场景中。\n3. 添加几何体和材质来创建网格。\n4. 添加光照并渲染。\n\n## 使用图像创建纹理\n\n之前的示例在创建模型材质时使用了简单的颜色。但\
  \ Three.js 也允许你使用图像为模型创建自定义纹理。例如，你可以从 `www.3dstudio-max.com/download.php?id=57`\
  \ 下载地球纹理，如图 11-24 所示。\n\n![97811852465-fg1124.tif](img/97811852465-fg1124.png)\n\
  \n图 11-24 纹理将被映射到球体。\n\n接下来，将此纹理添加到网格：\n\n```javascript\n// add image map\nvar map\
  \ = THREE.ImageUtils.loadTexture( 'images/earth.jpg' );\n\n// add the earth\nvar\
  \ geometry = new THREE.SphereGeometry( 100, 24, 24 ),\nmaterial = new THREE.MeshPhongMaterial({\n\
  \  map: map\n}),\nearth = new THREE.Mesh( geometry, material );\nscene.add( earth\
  \ );\n```\n\n这里使用了 `THREE.ImageUtils.loadTexture()` 来加载纹理。然而，如果你现在尝试渲染场景，可能会遇到问题，因为图像加载需要时间。为了解决这个问题，请确保在窗口加载后进行渲染：\n\
  \n```javascript\nwindow.onload = function() {\n  renderer.render( scene, camera\
  \ );\n};\n```\n\n在图 11-25 中，图像贴图正确地分布在球体周围，使其看起来像行星。这种计算在底层非常复杂，所以感谢 Three.js 为你处理了它。\n\
  \n97811852465-fg1125.tif](images/97811852465-fg1125.png)\n\n图 11-25 具有写实图像贴图的球体。\n\
  \n## 3D 画布动画\n\n你现在已经知道如何使用 WebGL 渲染静态的 3D 场景。但如果你只需要静态图像，可以在 3D 图形程序中渲染它们并在页面上包含基础\
  \ `<image>` 标签。使用 WebGL 的真正理由是创建交互式的、动画 3D 场景，这正是本小节要学习的内容。\n\nWebGL 画布的动画与 2D 画布类似：你只需要为动画的每一帧绘制并重绘场景。例如，以下脚本将旋转地球：\n\
  \n```javascript\nwindow.onload = function() {\n  var rotation = 0;\n  var animationLoop\
  \ = setInterval(function() {\n    rotation += 0.05;\n    earth.rotation.y = rotation;\n\
  \    renderer.render( scene, camera );\n  }, 100);\n};\n```\n\n\n\n\n在下一章中，你将发现如何使用\
  \ HTML5 的 `requestAnimationFrame`，它是使用简单间隔进行动画的替代方案。`requestAnimationFrame` 能产生更平滑且性能更好的动画。\n\
  \n### 添加鼠标事件\n\n在之前的 Canvas 鼠标事件 节中，你已经看到在画布绘制上应用事件监听器是困难的，因为绘制的形状无法在 DOM 中引用。遗憾的是，WebGL\
  \ 画布也不例外。不过，你可以使用一种技术为你的 3D 场景添加鼠标交互。该技巧本质上是从摄像机到鼠标位置创建一条射线，并查看它是否与物体相交：\n\n```javascript\n\
  var projector = new THREE.Projector();\n\ncontainer.onmousedown = function(e) {\n\
  \  e.preventDefault();\n  var vector = new THREE.Vector3( ( e.pageX - this.offsetLeft\
  \ ) /\n  this.offsetWidth * 2 - 1, - ( e.pageY - this.offsetTop ) /\n  this.offsetHeight\
  \ *  2 + 1, 0.5 );\n  projector.unprojectVector( vector, camera );\n  var raycaster\
  \ = new THREE.Raycaster( camera.position, vector.sub(\ncamera.position ).normalize()\
  \ );\n  var intersects = raycaster.intersectObject( earth );\n  if ( intersects.length\
  \ > 0 ) {\n    console.log('Earth');\n  }\n};\n```\n\n该脚本首先使用 `THREE.Vector3()`\
  \ 创建一个相对于其容器的鼠标位置向量。然后将该向量向摄像机方向“反投影”（反向投影）。接下来，从摄像机向反投影的向量投射一条射线。如果该射线与物体相交，说明用户正在点击该物体。\n\
  \n不要担心跟随 `THREE.Vector3` 中的代码——你只需复用此代码段来反投影向量并计算交点。\n\n你也可以将这种技术用于分层对象，以确保鼠标事件仅应用于顶层对象。例如，你可以给这个场景添加一个月球：\n\
  \n```javascript\nvar moonGeometry = new THREE.SphereGeometry( 20, 24, 24 ),\n  \
  \   moonMaterial = new THREE.MeshPhongMaterial({\n       color: 0xDDDDDD\n   }),\n\
  \   moon = new THREE.Mesh( moonGeometry, moonMaterial );\nmoon.position.z = 150;\n\
  moon.position.x = 50;\nscene.add( moon );\n```\n\n现在，不要在点击处理程序中使用 `intersectObject`，而是使用带有对象数组的\
  \ `intersectObjects`：\n\n```javascript\nvar intersects = raycaster.intersectObjects(\
  \ [earth, moon] );\nif ( intersects.length > 0 ) {\n  var topObjectId = intersects[0].object.id;\n\
  \  if ( topObjectId == earth.id ) {\n    console.log('Earth');\n  }\n  else if (\
  \ topObjectId == moon.id ) {\n    console.log('Moon');\n  }\n}\n```\n\n该脚本首先将 `earth`\
  \ 和 `moon` 网格引用传递给 `intersectsObjects`。然后它确定与点击事件相交的顶层物体的 `id`，即 `intersects` 数组中的第一个项。最后，它将该\
  \ `id` 与两个物体的 `id` 进行比较，以确定哪一个是顶层。\n\n### 使用 2D 画布回退方案\n\n遗憾的是，浏览器对 WebGL 画布的支持仍然不足，在本文编写时没有\
  \ IE 的支持，且移动端覆盖非常有限（详情请查看：[`http://caniuse.com/#feat=webgl`](http://caniuse.com/#feat=webgl)）。然而，Three.js\
  \ 库最棒的功能之一是它内置了 2D 画布回退。虽然回退效果没有 WebGL 渲染器那么好看，但它为不支持的浏览器提供了一定的覆盖范围。设置 2D 渲染器的方法与\
  \ WebGL 对应的相同：\n\n```javascript\nvar renderer = new THREE.CanvasRenderer();\n```\n\
  \n要使用回退方案，只需使用 Modernizr 或 Three.js 内置的检测器设置 WebGL 支持检测即可：\n\n```javascript\nvar\
  \ renderer = Detector.webgl ? new THREE.WebGLRenderer():\n  new THREE.CanvasRenderer();\n\
  ```\n\n2D 画布渲染器确实不漂亮，但它是一个不错的回退方案，如图 11-26 所示。\n\n![9781118524565-fg1126.tif](img/9781118524565-fg1126_fmt.png)\n\
  \n图 11-26 Three.js 的 WebGL 和 Canvas 渲染器比较。左侧的 WebGL 版本具有更好的着色和光照。此外，画布版本显示了一些人工伪影。\n\
  \n## CSS 中的 3D 变换\n\n在网页上创建交互式 3D 图形并不一定需要 WebGL。只要你需要的功能简单，你可能可以使用 CSS 中的 3D 变换来实现相同的功能。虽然浏览器对\
  \ 3D 变换的支持还不完美，但当前所有桌面和移动浏览器的版本都支持它们（详情请见 [`http://caniuse.com/#feat=transforms3d`](http://caniuse.com/#feat=transforms3d)）。这比\
  \ WebGL 画布要好得多，因为在本文编写时，后者不被 IE10、iOS Safari 或 Android 支持。\n\n当然，CSS3 的能力远少于 WebGL，局限于对平直对象的操作，例如在\
  \ 3D 空间中旋转卡片或文本行。要查看其如何工作，请从以下标记开始：\n\n```html\n<div class=\"container\">\n  <div\
  \ class=\"card\">CSS3 Transform</div>\n</>\n```\n\n然后用 3D 变换对其进行样式处理（相关部分）：\n\n\
  ```css\n.container {\n  width: 400px;\n  height: 250px;\n  position: relative;\n\
  \  -webkit-perspective: 500px;\n  -moz-perspective: 500px;\n  perspective: 500px;\n\
  }\n.card {\n  position: absolute;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left:\
  \ 0;\n  padding: 50px;\n  font-size: 50px;\n  background: tomato;\n  color: #FFF;\n\
  \  -webkit-transform: rotateY( 45deg );\n  -moz-transform: rotateY( 45deg );\n \
  \ transform: rotateY( 45deg );\n}\n```\n\n3D 变换的第一步是在父元素上定义透视（perspective）。这类似于设置摄像机的角度。接下来，CSS\
  \ 将实际 3D 变换应用于 `.card`。这些变换将其绕 y 轴旋转 45 度，产生了图 11-27 所示的倾斜卡片。\n\n![9781118524565-fg1127.tif](img/9781118524565-fg1127_fmt.png)\n\
  \n图 11-27 卡片使用 CSS 变换进行了旋转。\n\n默认情况下，透视仅适用于元素的后代。要将其扩展到所有后代，请为 `.card` 元素添加 `transform-style:\
  \ preserve-3d`（以及 `-webkit` 和 `-moz` 扩展）。\n\n要制作动画，你有几种选择。首先，可以使用 CSS 过渡（transition）：\n\
  \n```css\n.card {\n  position: absolute;\n  top: 0;\n  right: 0;\n  bottom: 0;\n\
  \  left: 0;\n  padding: 50px;\n  font-size: 48px;\n  background: tomato;\n  color:\
  \ #FFF;\n  -webkit-transform: rotateY( 45deg );\n  -moz-transform: rotateY( 45deg\
  \ );\n  transform: rotateY( 45deg );\n  -webkit-transition: -webkit-transform .5s\
  \ ease;\n  -moz-transition: -moz-transform .5s ease;\n  transition: transform .5s\
  \ ease;\n}\n.card:hover {\n  -webkit-transform: rotateY( -45deg );\n  -moz-transform:\
  \ rotateY( -45deg );\n  transform: rotateY( -45deg );\n}\n```\n\n在这里，CSS 为元素应用了过渡，它将平滑地在样式变化之间切换。然后为卡片添加\
  \ `:hover` 伪类，以将其旋转回 -45 度。或者，你可以使用 CSS 关键帧动画（下一章将更多关于过渡和关键帧动画的内容）。\n\n总结\n\n\n\n\
  \n在本章中，你发现了许多在浏览器中渲染图形的制技术。首先，你学习了 `canvas` 和 `SVG`，以及如何使用这两种技术来渲染基础形状。然后，你为这些形状制作了动画并应用了鼠标交互。\n\
  \n接下来，你通过 `SVG` 库 `Raphaël.js` 提升了你的 2D 绘画能力。通过 `Raphaël`，你研究了如何绘制更复杂的形状、如何添加各种样式选项以及利用内置的动画支持。随后，你将对\
  \ `Raphaël` 的知识扩展到了 `gRaphaël`，这是一个简单的图表库。\n\n在巩固了 2D 图形技能后，你通过 `WebGL` 进入了 3D canvas。你学习了如何使用\
  \ `Three.js` 库通过相机、光照、几何体和材质来渲染基础场景。然后，你发现了图像映射，并使用它们为场景创建了写实的纹理。接下来，你学习了如何为 3D\
  \ canvas 制作动画，以及一种为场景添加鼠标事件处理程序的技术。最后，你考虑了 `WebGL` 的替代方案：`CSS3` 中的 3D 变换。这些变换远没有\
  \ `WebGL` 强大，但可以为简单的问题提供更优雅的解决方案。\n\n现在你已经能够在浏览器中绘制自定义的 2D 和 3D 图形，你在前端可以实现的可能性几乎是无限的。使用这些技术来创建一个丰富的交互式应用，让你的用户感到惊喜并印象深刻。\n\
