  var signupView = new SignupView({\n  model: user\n});\n```\n\n简要回顾一下这里发生的情况：\n\n\
  1. 你创建了一个模板来显示表单。它使用辅助函数来显示每个表单字段以及可能发生的任何错误消息。\n2. 你为表单数据创建了一个模型，以及一个无效字段的子模型。\n\
  3. 你构建视图并绑定事件，以跟踪表单字段的变化以及表单的提交。\n4. 当视图初始化时，你使用模板对其进行渲染。\n5. 每当一个字段变化时，你都会验证表单字段。你通过正则表达式检查\
  \ `Email` 字段，并确保密码匹配。\n6. 当表单提交时，你还会确保所有字段都已填写。\n7. 每当表单输入变化时，你都会将更改保存到模型并验证表单，如果有错误消息，则重新渲染。\n\
  8. 你劫持了表单的提交事件。如果是有效的，你从表单中提取 post URL，然后将清理后的模型版本与服务器同步。然而，如果无效，你将重新渲染表单以显示任何错误消息。\n\
  \n## 总结\n\n在本章中，你将应用程序表单提升到了新的高度。你学习了渐进增强的方法，以及如何使用原生 HTML5 表单功能在无需任何 JavaScript\
  \ 的情况下增强你的表单。\n\n然后，你发现了如何使用第三方 polyfills 为旧版浏览器支持 HTML5 功能，以及如何编写自己的 polyfill。接下来，你发现了如何劫持表单的默认提交行为，并使用\
  \ Ajax 将其发布到你的 API。最后，你学习了如何将表单集成到 Backbone 中，创建一个数据驱动的表单，可以在错误发生时显示内联错误并自动与服务器同步。\n\
  \n表单是几乎任何应用程序不可或的一部分。良好的表单体验可以吸引用户并鼓励他们完成注册、结账与其他应用程序业务逻辑相关的关键操作。因此，许多公司发现，表单的质量与利润直接相关。\n\
  \n## 额外资源\n\n### HTML5 表单基础\n\nHTML5 表单的现状：[`http://www.wufoo.com/html5/`](http://www.wufoo.com/html5/)\n\
  \n使用 HTML5 让表单变得精致：[`http://www.html5rocks.com/en/tutorials/forms/html5forms/`](http://www.html5rocks.com/en/tutorials/forms/html5forms/)\n\
  \n疯狂的表单（深入研究 HTML5）：[`http://diveintohtml5.info/forms.html`](http://diveintohtml5.info/forms.html)\n\
  \n### HTML5 表单教程\n\n如何构建跨浏览器 HTML5 表单：[`http://net.tutsplus.com/tutorials/html-css-techniques/how-to-build-cross-browser-html5-forms/`](http://net.tutsplus.com/tutorials/html-css-techniques/how-to-build-cross-browser-html5-forms/)\n\
  \n约束验证：Web 表单的原生客户端验证\n\n\n\n\n别误会我；几乎任何服务器都能同时处理少数用户的高负载 I/O。问题在于你的应用程序扩展性如何。当然，拥有海量用户是一件好事。但这是一个你无法负担得起等待来优化的问题。当你谈论可能要重构整个应用程序时，“避免过早优化”的传统逻辑并不适用。如果你的应用程序需要处理沉重的\
  \ I/O 负载，你从第一天起就需要预测并为扩展而构建。你需要使用 Node 或或其他对 I/O 友好的来构建。\n\n## 大多数服务器的工作原理\n\n大多数服务器端技术在单个线程上处理多个请求。例如，如果你在\
  \ Apache 上构建 PHP 应用程序，每个请求都必须由一个单独的子进程处理。为此，服务器会根据需要增加额外的线程以适应额外的请求。\n\n如果负载不是太大，这一切运行得还算不错，但如果你尝试并行运行几百个线程，你将会看到明显的延迟。这种延迟发生在客户端等待服务器处理额外线程的过程中。在多线程系统上管理负载是一个体力活的问题——你通常需要购买更多的处理能力，而这并不廉价。\n\
  \n此外，为多线程服务器编程要复杂得多，因为应用程序必须是线程安全的。\n\n## 理解 Node 的工作原理\n\nNode 能够优雅处理大量 I/O 的原因在于它处理多个并发连接请求的方式。\n\
  \n正如你可能猜的那样，传统的多线程方法对于许多现代 Web 应用来说扩展性不够。但 Node 的处理方式不同。简而言之，Node 使用带有事件循环的单非阻塞线程处理请求。多个请求被排队，并使用异步回调函数依次处理。\n\
  \nNode 并不是唯一使用单线程的服务器；其他高速服务器如 Nginx 也采用的方法。但 Node 在方面特别出色，因为它运行 JavaScript。多年来，网页浏览器在优化其\
  \ JavaScript 引擎方面付出了巨大努力。由于这些引擎以单非阻塞线程异步事件循环运行代码，它们已经非常擅长传递异步函数，无论是像 `setTimeout`\
  \ 的定时事件还是像 `onclick` 的接口事件。这引出了 V8 引擎。\n\n## 在 Node 中使用 V8 JavaScript 引擎\n\nNode\
  \ 使用了 Google 为 Chrome 编写的极速 V8 引擎。V8 在执行 JavaScript 之前将其编译为原生机器码。这种方法比其他引擎产生的代码快得多。\n\
  \n编译后的代码在运行时进一步优化，动态缓存代码部分，并省略昂贵的运行时属性。当这一切结合在一起时，它产生了有以来构建的最快的 JavaScript 引擎。但不要听我的，亲眼为证。访问\
  \ V8 基准测试 [`http://v8.googlecode.com/svn/data/benchmarks/v7/run.html`](http://v8.googlecode.com/svn/data/benchmarks/v7/run.html)\
  \ 并 Chrome 与另一个浏览器进行比较。\n\n## 从前端转向 Node\n\n虽然你对语法会更熟悉，但使用 Node 与与在前端使用 JavaScript\
  \ 非常不同。诚然，你将能够使用已经熟悉的内核语言，但你必须学习完全全新的概念。你用 Node 解决的问题与客户端的问题从根本上说是不同的。\n\n尽管如此，Node\
  \ 开发的某些方面使得它比其他后端语言更容易学习。也就是说，事件循环以及 Node 运行单线程异步调用的方式，对任何工作过 JavaScript 的人来说都会非常熟悉。\n\
  \n就像前端 JavaScript 中一样，Node 逐行执行代码，并允许你设置回调来处理任何需要处理的事件。这些回调随后按顺序处理。然而，这些异步回调的处理方式并不完全相同。在客户端，你有一个用户触发各种回调，而你的\
  \ Node 应用可以同时有任何数量的用户。这意味着对执行顺序的保证更少——你需要更加小心，以避免由于一个异步函数在另一个之前触发的依赖关系导致的竞态条件。\n\
  \n## 安装 Node\n\n在开始使用 Node 之前，你需要安装它。有几种方法可以：\n\n*   克隆 git 仓库并编译\n*   下载 tarball\
  \ 并通过命令行安装\n*   下载适用于平台的自动化包安装程序\n*   使用如 MacPorts 等包管理器\n\n除非你已经在使用包管理器，否则从仓库安装是最佳选择——它真的非常简单，并允许你快速更新到不同版本的\
  \ Node。\n\n如果你不熟悉命令行，那么 Node 开发将非常困难。因此，从命令行安装之一开始而不是自动化包安装程序是个好主意。此外，由于 Node 是一项全新的技术，最好始终使用最新的稳定版本。\n\
  \n如果你在第 1 章中安装了 Weinre，你已经安装了 Node。\n\n### Mac/Linux 安装\n\n在 Mac 和 Linux 上安装 Node\
  \ 核心非常简单。你只需要下载 Node 源码并编译它。\n\n#### 获取并编译源码\n\n首先，确保你已安装 git：[`https://help.github.com/articles/set-up-git`](https://help.github.com/articles/set-up-git)。然后在命令行（在终端）中克隆仓库：\n\
  \n```bash\ngit clone https://github.com/joyent/node.git\n```\n\n```bash\ncd node\n\
  ```\n\n```bash\ngit checkout\n```\n\n这些命令克隆了 Node 仓库并检出最新版本的源码。\n\n如果你想避免使用 git，也可以从\
  \ [`http://nodejs.org/dist/latest/`](http://nodejs.org/dist/latest/) 下载源码。\n\n一旦获取了源码，就可以编译它：\n\
  \n```bash\n./configure --prefix=/opt/node\n```\n\n```bash\nmake\n```\n\n```bash\n\
  sudo make install\n```\n\n这些命令配置安装，然后进行制作和安装。Node 编译需要几分钟，所以去喝杯咖啡或继续阅读下一节。\n\n将\
  \ Node 可执行文件添加到你的系统路径以方便使用。在你的 `~/.profile`、`~/.bash_profile`、`~/.bashrc` 或 `~/.zshenv`\
  \ 中添加以下行：\n\n```bash\nexport PATH=$PATH:/opt/node/bin\n```\n\n#### 使用包安装程序\n\n或者，你可以使用包安装程序。访问\
  \ [`http://nodejs.org/dist/latest/`](http://nodejs.org/dist/latest/) 并下载最新的安装程序（.pkg\
  \ 文件）。只需打开文件并按照向导中的指令自动安装 Node。\n\n#### 使用包管理器\n\n还有几个你可以使用的包管理器来快速安装 Node。例如，在\
  \ Mac 上，你可以使用 MacPorts 安装 Node ([`www.macports.org/`](http://www.macports.org/)):\n\
  \n```bash\nport install nodejs\n```\n\n或者使用 Homebrew ([`mxcl.github.com/homebrew/`](http://mxcl.github.com/homebrew/)):\n\
  \n```bash\nbrew install node\n```\n\n其他支持 Node 的包管理器列表，请访问：[`https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager`](https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager)。\n\
  \n#### 使用 Xcode 4.5 编译\n\n如果你使用 Mac，可以配置 Node 与 Xcode 配合工作。首先，从 App Store 下载并安装\
  \ Xcode，它是免费：[`https://developer.apple.com/technologies/tools/`](https://developer.apple.com/technologies/tools/)。然后通过\
  \ Xcode：Preferences->Downloads->Install Command Line Tools 安装命令行工具。最后，使用 Xcode 路径编译源码：\n\
  \n```bash\nexport CC=/Applications/Xcode.app/Contents/Developer/Toolchains/\nXcodeDefault.xctoolchain/usr/bin/clang\n\
  ```\n\n\n\n\n```bash\nexport CXX=/Applications/Xcode.app/Contents/Developer/Toolchains/\n\
  ```\n```bash\nXcodeDefault.xctoolchain/usr/bin/clang++\n```\n```bash\n./configure\n\
  make\nsudo make install\n```\n\n#### Windows 安装\n\nNode 实际上针对 Linux / UNIX 类型环境设计的。但如果你正在运行\
  \ Windows 机器且不想安装 Ubuntu，仍然可以在 Windows 上安装它。就像在 Mac / Linux 上一样，有两种方法可以进行安装。如果你想对过程有更多控制权，可以从源码构建；如果你想快速开始运行，可以安装预编译版本。\n\
  \n## 编译 Windows 安装\n\n首先，确保你已经安装了 Python 和 Visual Studio。然后在 `cmd.exe` 中执行以下操作：\n\
  \n```cmd\nC:\\Users\\ryan>tar -zxf node-v0.8.16.tar.gz\nC:\\Users\\ryan>cd node-v0.8.16\n\
  C:\\Users\\ryan\\node-v0.8.16>vcbuild.bat release\n[等待 20 分钟]\nC:\\Users\\ryan\\\
  node-v0.8.16>Release\\node.exe\n> process.versions\n{ node: '0.8.16',\n  v8: '3.6.6.11',\n\
  \  ares: '1.7.5-DEV',\n  uv: '0.6',\n  openssl: '0.9.8r' }\n>\n```\n\n可执行文件将位于 `Release\\\
  node.exe`。\n\n## 不通过编译安装\n\n你也可以在 Windows 系统上安装预编译版本的 Node。首先，从 [`http://nodejs.org/dist/latest/node.exe`](http://nodejs.org/dist/latest/node.exe)\
  \ 下载。将 `node.exe` 放在一个干净的目录，并将该目录添加到你的 `PATH` 变量中，这样在 `cmd.exe` 中就可以可以使用 node 命令。\n\
  \n接下来，从 [`http://nodejs.org/dist/npm/`](http://nodejs.org/dist/npm/) 找到最新版本的 NPM\
  \ `.zip` 压缩包。将其解压到与 `node.exe` 文件相同的目录，你就功告成了。现在你应该可以在任何地方运行 Node 和 NPM。\n\n## 使用包安装程序\n\
  \n你也可以使用自动化包安装程序在 Windows 上安装 Node。只需从 [`http://nodejs.org/dist/latest/`](http://nodejs.org/dist/latest/)\
  \ 下载最新的 `.msi` 包并运行安装向导。\n\n## 检查安装\n\n在 Mac、Linux 或 Windows 上完成 Node 安装后，你可以在命令行中输入以下内容来验证安装：\n\
  \n```bash\nnode --version\n```\n\n如果一切顺利，你应该能看到它返回版本号——例如 `0.8.16`。现在你准备好上手并构建你的第一个\
  \ Node 应用了。\n\n如果你想在同一系统中管理多个 Node 版本，请安装 NVM：[`https://github.com/creationix/nvm`](https://github.com/creationix/nvm)。\n\
  \n## 开始使用 Node\n\n尽管 Node 初看起来可能令人生畏，但入门其实非常简单。没有无处不在的“Hello World”示例，任何 Node 介绍都是不，我和你一样兴奋。\n\
  \n## 创建服务器\n\n第一步打开文本编辑器并引入 `http` 模块，你用它来创建 HTTP 服务器：\n\n```javascript\n// 加载 http\
  \ 模块\nvar http = require('http');\n```\n\n在这里你使用 `require()` 方法来引入模块。`http` 模块是\
  \ Node 核心模块之一（在本章后面的部分，你将学习更多关于模块以及如何在应用中引入外部模块的内容）。接下来，使用 `http` 模块创建服务器：\n\n```javascript\n\
  // 加载 http 模块\nvar http = require('http');\n// 创建 http 服务器\nvar server = http.createServer(\
  \ function(request, response) {});\n```\n\n在这里，`createServer()` 方法接受一个回调函数，该函数传递\
  \ `request` 和 `response` 对象。在处理 Node 时，你会看到很多回调和闭包。它们是异步事件循环的核心内容。\n\n## 添加内容\n\n\
  接下来，使用 `response` 创建你的页面内容：\n\n```javascript\n// 创建 http 服务器\nvar server = http.createServer(\
  \ function(request, response) {\n  // 响应头\n  response.writeHead(200, {\n    'Content-type':\
  \ 'text/plain'\n  });\n  // 写入内容\n  response.write('Hello World!');\n  // 发送响应\n\
  \  response.end();\n});\n```\n\n这段代码块中发生了几项操作：\n\n1. `writeHead()` 方法定义了页面的 HTTP\
  \ 响应头。在这种情况下，它使用了响应码 `200`（表示 OK）并传递了纯文本类型的 content-type。其他响应码可能是 `404`（文件未找到），其他响应头可能是\
  \ `'cache-control': 'max-age=3600, must-revalidate'`（将页面缓存一小时）。\n2. `write()` 方法向页面写入实际的“Hello\
  \ World” 消息。\n3. `end()` 方法关闭响应并将响应头和内容发送给客户端。\n\n## 收尾工作\n\n现在 Hello World 脚本正在创建服务器和页面的所有内容，但你还没有完成。你仍然需要创建一个访问脚本的路径，你可以使用\
  \ `listen()` 方法来实现这一点：\n\n```javascript\n// 监听 8000 端口\nserver.listen(8000);\n```\n\
  \n在这里，你之前创建的服务器被设置在 `8000` 端口上。`listen()` 方法还接受第二个关于主机的参数，但你现在不需要它，因为你只是在本地构建。最后，将发生的情况记录到控制台是一个好主意：\n\
  \n```javascript\n// 记录到控制台\nconsole.log('Server running on port 8000');\n```\n\n\
  在这里，脚本使用了你在客户端开发中已经熟悉的 `console.log()` 方法。然而，它不会在浏览器中输出此消息，而是记录在终端中。\n\n## 运行脚本\n\
  \n将所有代码组合在一起：\n\n```javascript\n// 加载 http 模块\nvar http = require('http');\n// 创建\
  \ http 服务器\nvar server = http.createServer( function(request, response) {\n  //\
  \ 响应头\n  response.writeHead(200, {\n    'Content-type': 'text/plain'\n  });\n  //\
  \ 写入内容\n  response.write('Hello World!');\n  // 发送响应\n  response.end();\n});\n//\
  \ 监听 8000 端口\nserver.listen(8000);\n// 记录到控制台\nconsole.log('Server running on port\
  \ 8000');\n```\n\n将此文件保存为 `helloworld.js`，然后在命令行输入以下内容：\n\n```bash\nnode helloworld.js\n\
  ```\n\n访问 [`http://localhost:8000`](http://localhost:8000)，你就能看到你的第一个应用运行了。\n\n\
  ## 简化脚本\n\nHello World 脚本运行得完全正常，但你有几种方法可以让它更简单。首先，你可以将任何你想写入页面的内容传递给 `response.end()`\
  \ 方法。这意味着你可以消除 `response.write()` 调用并缩短脚本：\n\n```javascript\n// 加载 http 模块\nvar\
  \ http = require('http');\n// 创建 http 服务器\nvar server = http.createServer( function(request,\
  \ response) {\n  // 响应头\n  response.writeHead(200, {\n    'Content-type': 'text/plain'\n\
  \  });\n  // 带内容的响应\n  response.end('Hello World!');\n});\n// 监听 8000 端口\nserver.listen(8000);\n\
  // 记录到控制台\nconsole.log('Server running on port 8000');\n```\n\n此外，Node 中的大多数方法都是可以链调的，就像\
  \ jQuery 和 Underscore 中的方法一样。你可以通过将 `listen()` 方法链式到 `createServer()` 方法来看到这种用法：\n\
  \n```javascript\n// 加载 http 模块\nvar http = require('http');\n// 在 8000 端口创建 http\
  \ 服务器\nhttp.createServer( function(request, response) {\n  // 响应头\n  response.writeHead(200,\
  \ {\n    'Content-type': 'text/plain'\n  });\n  // 带内容的响应\n  response.end('Hello\
  \ World!');\n}).listen(8000);\n// 记录到控制台\nconsole.log('Server running on port 8000');\n\
  ```\n\n\n\n\n如此处所示，`listen()` 被链在前面的方法之后，允许你进一步缩短脚本。现在，在终端窗口中按 `Ctrl+C` 关闭之前的 Node\
  \ 会话，然后用 `node helloworld.js` 重新打开。[`http://localhost:8000`](http://localhost:8000)\
  \ 显示 Hello World 脚本运行情况与之前完全相同。\n\n## 使用 Node REPL\n\n在深入学习 Node 之前，熟悉读入-评估-打印循环（REPL）是一个好主意。它的发音为“repple”，它允许你直接在终端中运行\
  \ Node 代码。要访问 REPL，只需从命令行调用 Node 且不传递任何变量即可：\n\n```\nnode\n```\n\n现在你应该能看到一个提示符（`>`），你可以在这里输入\
  \ Node 命令并即时执行，如图图 6-2 所示。\n\n![9781118524565-fg0602.tif](img/9781118524565-fg0602_fmt.png)\n\
  \n图 6-2 REPL 允许你即时执行 Node 命令。\n\nREPL 用于测试小段代码。当你刚开始接触 Node 开发时，它特别方便，因为你可以快速对你正在学习的概念进行代码测试。\n\
  \n### REPL 特性\n\nREPL 的功能很大程度上与普通命令行类似：你可以使用上方向键访问之前的命令，使用 Tab 键补全命令。此外，你可以使用下划线（`_`）获取上一个表达式的结果，如图\
  \ 6-3 所示。\n\n![9781118524565-fg0603.tif](img/9781118524565-fg0603_fmt.png)\n\n图\
  \ 6-3：`_` 可获取 REPL 中上一个表达式的结果。\n\nREPL 甚至能优雅地处理多行表达式。只需开始输入一个函数或另一个未闭合的标签，REPL 就会自动扩展到多行，如图\
  \ 6-4 所示。\n\n![9781118524565-fg0604.tif](img/9781118524565-fg0604_fmt.png)\n\n图\
  \ 6-4：REPL 自动处理多行表达式。\n\n### 额外的 REPL 命令\n\n在 REPL 中你还可以使用一些额外的命令，如果你在 REPL 提示符中输入以下内容就可以看到它们：\n\
  \n```\n.help\n```\n\n如图 6-5 所示，这会输出一个 REPL 命令列表。\n\n![9781118524565-fg0605.tif](img/9781118524565-fg0605_fmt.png)\n\
  \n图 6-5：REPL 还提供了一些额外的实用的命令。\n\n### 中断\n\n如果你在多行输入中迷了方向，可以通过输入以下内容重新开始：\n\n```\n\
  .break\n```\n\n然而，请记住，你会丢失输入的所有内容。\n\n### 保存和加载\n\n你实际上可以在 REPL 中开发整个应用程序。但要小心：如果终端窗口崩溃，你将丢失所有内容。因此，在\
  \ REPL 中工作时，记住要尽早保存并频繁保存。要将当前的 REPL 会话保存到文件，可以使用 `.save` 命令——例如：\n\n```\n.save ~/path-to/my-file.js\n\
  ```\n\n同样地，你可以将文件内容加载到 REPL 会话中：\n\n```\n.load ~/path-to/my-file.js\n```\n\n## 退出\n\
  \n最后，要终止 REPL 会话，请使用 exit 命令：\n\n```\n.exit\n```\n\n或者，你也可以按 `Ctrl+D`。但如果有任何你想保留的内容，别忘记保存！\n\
  \n## Node 模块\n\nNode 并没有在每个构建中实现所有可能的特性，而是通过模块将核心保持尽可能精简和高效。模块仅仅是存储封装好的 JavaScript\
  \ 代码的文件。\n\nNode 的模块系统是模仿 CommonJS 设计的。\n\n### 引入模块\n\n你已经见过模块的运行了。例如，Hello World\
  \ 示例使用了 `http` 模块：\n\n```\nvar http = require('http');\n```\n\n如你在这里看到的，引入模块就像使用\
  \ `require()` 方法一样简单。你也可以从模块中引入特定的对象，而不是所有对象：\n\n```\nvar createServer = require('http').createServer;\n\
  ```\n\n记住 `require` 是一个同步方法。与你将在 Node 中使用的大多数方法不同，`require` 会阻塞主线程。你将在 Node 模式 部分中学习更多关于同步和异步方法的知识。\n\
