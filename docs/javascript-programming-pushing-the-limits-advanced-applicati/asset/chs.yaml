  \ 年 9 月）：ISBN 978-1849516549 [`http://amzn.to/XHo8Eb`](http://amzn.to/XHo8Eb)\n\n\
  《jQuery Cookbook》，Cody Lindley 著；O'Reilly Media（2009 年 11 月）：ISBN 978-0-596-15977-1\
  \ [`http://shop.oreilly.com/product/9780596159788.do`](http://shop.oreilly.com/product/9780596159788.do)\n\
