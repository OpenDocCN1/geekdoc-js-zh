- "# JavaScript 编程：突破极限：JavaScript 与 HTML5 高级应用开发\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n## 出版者致谢\n\n帮助本书进入市场的人员包括：\n\n### 编辑与制作\n- 消费者与技术出版副总监：Michelle Leete\n- 图书内容管理副总监：Martin\
  \ Tribe\n- 副主编：Chris Webb\n- 助理委约编辑：Ellie Scott\n- 项目编辑：Sydney Argenta\n- 文本拷贝编辑：Melba\
  \ Hopper\n- 技术编辑：Rick Waldron\n- 编辑经理：Jodi Jensen\n- 高级项目编辑：Sara Shlaer\n- 编辑助理：Annie\
  \ Sullivan\n\n### 营销\n- 副营销总监：Louise Breinholt\n- 营销经理：Lorna Mein\n- 营销助理：Polly\
  \ Thomas\n\n### 排版服务\n- 排字员：Jennifer Mayberry\n- 校对：Wordsmith Editorial\n- 索引员：Infodex\
  \ Indexing Services, Inc.\n\n## 关于作者\nJon Raasch 是一位自由职业 Web 开发人员，专门从事桌面和移动设备的现代\
  \ Web 应用开发。作为一名用户体验迷，他构建的 JavaScript 应用专注于服务用户，无论是通过提高性能、增强可用性还是提升功能。他认为，一旦满足了用户的需求，业务目标就会随之而来。Jon\
  \ 是《Smashing WebKit》的作者，《Smashing Mobile Web Development》的合著者。他曾为 Smashing Magazine\
  \ 和他的个人博客写过许多文章。在最佳实践方面他是一个完美主义者，你会发现他穿着睡衣构建网站和应用。他目前住在俄勒冈州波特兰。你可以在 Twitter 上关注\
  \ Jon `@jonraasch` 并访问他的网站 `jonraasch.com`。\n\n## 献献\n“挑战极限” – Rick Ross\n\n## 关于贡献者\n\
  Kevin Bradwick 拥有十多年的 Web 开发行业经验。他致力于构建和分享知识，旨在产生高质量的代码。他目前在 BBC 工作，构建并维护用于国内和国际网站的应用程序。\n\
  \n## 致谢\n感谢每一位对开发社区做出过贡献的人。这意味着任何对开源项目做出过贡献、编写过教程、回答过问题、甚至提交过错误报告的人。我们都站在巨人的肩膀上，这些众多的贡献在过去的几年里将\
  \ Web 开发带到了一个美好的境界。成为一名 Web 开发人员是一个惊叹的时代，这一切归功于我们优秀的社区。\n\n# JavaScript 编程：挑战极限\n\
  \n- QUnit. “QUnit API 文档”:[`http://api.qunitjs.com`](http://api.qunitjs.com/)\n\
  - JSHint 文档：[`http://www.jshint.com/docs/`](http://www.jshint.com/docs/)\n\n# 第\
  \ 2 章\n\n## 库、框架和插件\n\n除了遵循最佳实践外，你应该在库和插件的坚实基础上构建你的应用。当然，你可以自己写一切，这确实有其时机地。但在大多数情况下，依靠其他开发者发布的开源工作更有意义。\n\
  \n库和插件可以帮助加速你的开发过程，并用基础功能的样板代码启动你的应用。最棒的是，知名库背后有庞大的社区，有优秀的开发者在编写和重写代码，并有大量的用户群发现任何漏洞。有了这些更成熟、经过反复测试的库，你可以放心地在你的应用程序中使用它们。\n\
  \n另一方面，插件在代码质量方面参差不齐。一个好的插件可以为你节省大量时间，而一个糟糕的插件可能会产生比它解决更多的问题（并迫你花费在调试它上的时间比从头编写它花费的时间更多）。\n\
  \n在本章中，你发现了如何为你的项目选择合适的 `JavaScript` 库。我比较了 `jQuery`、`Zepto` 以及编写你自己的原生 JavaScript。然后你学习了较大的框架\
  \ `Bootstrap` 和 `jQuery UI`。在简要讨论了 `Modernizr` 如何简化跨浏览器 CSS 问题后，我展示了 `HTML5 Shiv`\
  \ 如何在旧版浏览器中构建对 `HTML5` 元素的支持。\n\n接下来，我讨论了 `HTML5 Boilerplate`，它既不是库 true 框架。它是一个兼具优点的模板，你可以使用它来获得框架的所有优势，加速标准\
  \ `HTML5` 应用的设置。\n\n最后，我深入研究了 `jQuery 插件`。你将看到寻找新插件的好地方，以及一个用于确定该插件是否足够好到集成到你项目的十点清单。\n\
  \n### 选择合适的 JavaScript 库\n\n在 `JavaScript` 项目开始时，你做的最重要的决定之一是使用哪个库（或者是否使用库）。一个良好的\
  \ `JavaScript` 库可以简化你的开发过程，为你提供各种标准工具，你可以在未来的项目中使用并重用。\n\n当然，这个选择会受到你对每个库经验水平的影响。但尽管如此，如果它是特定项目的最佳选择，不要害怕尝试新库。库与库之间共享许多语法，所以一旦你熟悉了一个，适应另一个就会容易得多。有很多流行的\
  \ `JavaScript` 库：`jQuery`、`Closure`、`Mootools`、`Zepto`（举例）。我个人最喜欢 `jQuery` 和 `Zepto`，我将在本节进行比较。\n\
  \n### jQuery\n\n`jQuery` 可能是 Web 上最流行的 `JavaScript` 库。它提供了各种工具和其他 API 函数，你可以用它们构建应用程序所需的组件。\n\
  \n#### jQuery 的优势\n\n`jQuery` 的主要优势在于它的范围。它非常健壮，提供的 API 比我用过的任何库都多。它也非常容易使用，出于几个原因：\n\
  \n- API 的语义对初学者非常宽容，允许各种失误而不会抛出 JavaScript 错误\n- 有许多便利函数。便利函数就像是一个门面函数——例如 `jQuery.post()`，它是\
  \ `jQuery.ajax()` 的代理。\n- 大多数 `jQuery` 方法都是可链的，这意味着每个方法都返回自身，因此你可以在一个 DOM 引用上链接任意数量的方法。例如：\n\
  \n```\njQuery('.my-element').addClass('my-class').fadeIn().click(myClickHandler)\n\
  ```\n\n\n\n\n所有这些因素降低了 jQuery 的入门门槛，并促进了它的极度普及。然而，jQuery 的规模和易用性也导致了它的主要缺点：文件大小。jQuery\
  \ 中所有不同的功能都是有代价的，那就是更大的代码库。便利函数进一步导致了文件体积的膨胀。\n\n幸运的是，jQuery 2.0 解决了大部分文件大小问题。jQuery\
  \ 2.0 提供了类似于 jQuery UI 的模块化构建过程，允许你构建一个特定项目的库实例，并针对你正在使用的 API 进行定制。此外，jQuery 2.0\
  \ 放弃了对 IE `6`、`7` 和 `8` 的支持，这减少了 1.9 版本中大量的代码库。但不必担心，jQuery 2.0 的 API 与 1.9 兼容，这意味着可以使用条件注释为任何不支持\
  \ 2.0 的浏览器加载 jQuery 1.9：\n\n```html\n<!--[if lt IE 9]>\n<script src=\"jquery-1.9.x.js\"\
  ></script>\n<![endif]-->\n<!--[if gte IE 9]><!-->\n<script src=\"jquery-2.x.x.js\"\
  ></script>\n<!--<![endif]-->\n```\n\n## jQuery 社区\n\njQuery 的普及也是一个显著的优势。强大的 jQuery\
  \ 社区以多种方式改进了代码库：\n\n- 几位核心贡献者不断编写和重写不同的 API——提高性能，扩展功能范围，并修复 Bug 和跨浏览器问题。\n- 海量的开发者正在使用该库。这些开发者将测试推向极限，在大量的用例和环境中测试该库，从而发现（并希望报告）任何进入稳定版本的\
  \ Bug。\n- 每当你在 jQuery 中遇到问题或不理解的内容时，也可以寻求社区的帮助。[`api.jquery.com`](http://api.jquery.com/)\
  \ 上的文档非常完整，应该是你的首选资源。此外，整个网络上的大量教程描述了如何处理常见的 jQuery 问题以及如何构建你应用中可能需要的大型组件。最后，如果你找不到解决问题的方法，只需在\
  \ [`stackoverflow.com`](http://www.stackoverflow.com/) 上提问，其他 jQuery 开发者定会来救你的急。\n\
  \n## 通过通用 CDN 引入 jQuery\n\n你已经发现 jQuery 的普及如何让代码库和文档受益。但你知不知道它还可以改进在网站上引入的方式？有如此多的网站在使用\
  \ jQuery，让每个网站都单独引入它并没有意义。为什么用户在访问每个使用这个流行库的网站时，都要下载相同的 jQuery 核心呢？幸运的是，Google 将\
  \ jQuery 托管在内容分发网络（CDN）上，你可以利用它缩短用户的下载时间。CDN 是高度优化的服务器，旨在快速提供 JavaScript 等静态文件。但作为\
  \ CDN 并不重要，重要的是这些代码是**通用**的。\n\n尽管大多数网站仍然提供自己的 jQuery，但有足够的网站在使用 Google 的 CDN，这值得这样做。如果你的用户最近访问过这些网站中的一个，脚本就会缓存在他们的浏览器中，这意味着即使是第一次访问你的网站，他们也不需要下载\
  \ jQuery。这种方法带来的性能提升是巨大的，你可以为成为利用此 CDN 的网站网络的一部分感到自豪——参与的网站越多，这种方法就越有利。\n\n需要记住，使用\
  \ CDN 仅改进了下载时间。实例化时间仍然是一个问题，而且不容忽视。\n\n使用 Google 的 CDN 非常轻而易举；只需将脚本源指向 Google 的服务器即可：\n\
  \n```html\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js\"\
  ></script>\n```\n\n此脚本请求 jQuery 的最新稳定版本并将其包含在你的网站中。然而，建议请求最新版本的 jQuery。jQuery 中的\
  \ API 会变得过时并最终不再支持，这在从版本 1.9 到 2.0 的过渡中尤为明显。因此，在调用 CDN 时指定你想使用的 jQuery 版本是一个更好的实践做法：\n\
  \n```html\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js\"\
  ></script>\n```\n\n此脚本拉取 jQuery 1.9.1 版本，因为路径中明确指定了版本。\n\n省略 http 协议可以确保你的浏览器使用页面当前正在使用的任何协议。这可以防止你的浏览器对提供协议不匹配的资源报错。但如果你尝试使用\
  \ `file:///` 协议在本地打开 HTML 文件，它将无法工作。\n\n## Zepto\n\nZepto 是 jQuery 的轻量级替代方案，最初是作为移动库开发的。但凭借其类似于\
  \ jQuery 的 API 和较小的文件大小，它是任何项目的绝佳选择。\n\n本书的大部分内容使用 jQuery，但值得注意的是 Zepto 是更轻量级的替代方案。\n\
  \n### Zepto 的优势\n\nZepto 的主要优势是文件大小；它仅重 8K 多，是目前最小的全功能库之一。尽管体积很小，Zepto 能够提供用于应用程序开发的实用工具包。jQuery\
  \ 支持 的大部分常用 API 和方法，不支持的部分通常可以通过自定义 JavaScript 轻松绕过。要了解更多关于 Zepto 的功能，请访问其文档网站 [`www.zeptojs.com`](http://www.zeptojs.com/)。\n\
  \n此外，由于 Zepto 拥有很大程度上兼容 jQuery 的 API，它非常易于使用，特别是如果你已经熟悉 jQuery 的话。你可以完全相同的方式复用 jQuery\
  \ 中的许多方法，并方便地链式调用以获得更整洁的代码。这意味着你今天就可以开始使用 Zepto，甚至无需查看它的文档。\n\n最后，如果你为移动端开发应用，Zepto\
  \ 还包含了一些基础的触摸事件，你可以利用这些事件来实现更好的触摸屏交互：\n\n- 点击事件：`tap`、`singleTap`、`doubleTap`、`longTap`\n\
  - 滑动事件：`swipe`、`swipeLeft`、`swipeRight`、`swipeUp`、`swipeDown`\n\n如果你正在构建移动端应用，还有一些额外的库可以使用。你可以在\
  \ 第 10 章 中找到更多关于这些和其他移动技术的知识。\n\n### 不支持 IE\n\n但在你对 Zepto 感到兴奋之前，重要的是记住它不支持 Internet\
  \ Explorer。这个问题并不是库开发者 Thomas Fuchs 的跨浏览器失误。相反，这是一个为了减小文件大小而做出的自觉决定，就像 jQuery 团队决定从\
  \ 2.0 版本开始放弃旧版 IE 一样。\n\n从历史上来看，令无数开发者感到痛苦的是，IE 遭受了一系列兼容性问题。它就是不遵守标准，每个主版本都有自己细微的特性。新版本的\
  \ IE 在弥补这些兼容性差距方面做出了显著努力，但事实仍然是，IE 处理许多 JavaScript 和 DOM 问题时采用了坚然非标准的方法，并且在 HTML5\
  \ 标准和功能方面落后于其他浏览器。\n\n大多数 JavaScript 库（如 jQuery）通过额外代码处理这些跨浏览器问题，以便你永远不需要看到这些问题。然而，这些额外代码导致了大量的臃肿。Zepto\
  \ 决定精减这些“脂肪”。对于通常不需要担心 IE 的移动应用来说，这是很棒的。但在涉及到桌面应用时，这可能会是一个致命的缺陷。\n\n由于 Zepto 使用\
  \ jQuery 语法，它的文档建议回退到 jQuery 作为 IE 的备选方案。这样你的应用在 IE 中仍然可以运行，而其他浏览器可以获得 Zepto 在文件大小上的优势。然而，这两个\
  \ API 并不完全兼容，因此请谨慎使用这种方法并进行彻底测试。如果你仍然想尝试这种方法，可以在这里了解该技术：[`http://zeptojs.com/#download`](http://zeptojs.com/#download)。\n\
  \n\n\n\n\n# 原生 DOM (Vanilla DOM)\n\n当然，你完全不需要使用 JavaScript 库。库会给你的应用增加不必要的臃肿，即使是像\
  \ `Zepto` 这样较小的也是。\n\n## 原生 DOM 的优缺点\n\n编写所有 JavaScript 的主要优势是你只需要包含和编写你的内容，而主要的缺点是增加了开发时间。根据定义，JavaScript\
  \ 库包含了应用程序中通常使用的各种功能，但极不太可能任何单个应用会使用其中所有功能。那些多余的未使用的 JavaScript 属于不必要的臃肿范畴。然而，你必须权衡文件大小的收益与额外开发时间之间的关系，如果你从未从零开始编写过\
  \ JavaScript 应用，你可能低估了其中涉及的时间。\n\n我相信你已经意识到，你需要编写各种脚本来处理应用所需的所有功能。但你可能还没有考虑到为这些功能中的每一个都要进行跨浏览器兼容性开发。\n\
  \n与跨浏览器 JS 相比，跨浏览器 CSS 问题的处理是轻而易举的。浏览器战争早期留下的怪异遗留问题不断浮现，迫使你为不同的浏览器构建完全不同的实现方案，因为每个浏览器处理方式都略有不同。\n\
  \n一个熟悉的例子是跨浏览器事件处理程序——例如，`onclick` 事件。为了绑定鼠标事件，所有现代浏览器都支持 `addEventListener`：\n\n\
  ```javascript\nvar elem = document.getElementByID('my-element');\nelem.addEventListener('click',\
  \ function(e) {\n  // 你想在点击时做的任何事情\n}, false);\n```\n\n这将在 Chrome、Firefox、Safari、Opera\
  \ 和 IE9+ 中任何 ID 为 `my-element` 的元素上绑定点击事件。然而，旧版本的 IE 对标准的支持是臭名的极差。为了兼容这些浏览器，你需要使用\
  \ `attachEvent`：\n\n```javascript\nvar elem = document.getElementByID('my-element');\n\
  elem.attachEvent('onclick', function(e) {\n  // 你想在点击时做的任何事情\n});\n```\n\n注意这里事件处理程序的\
  \ API 略有不同。你不仅必须使用 `attachEvent`，还必须将事件类型从 `click` 改为 `onclick`。当然，你可能希望同时使用这两者，以确保你的脚本适用于尽可能多的用户（旧版\
  \ IE 仍占据着令人沮丧的市场份额）。为了同时支持两者，你需要进行一些简单的特性检测：\n\n```javascript\nvar elem = document.getElementByID('my-element');\n\
  if ( document.addEventListener ) {\n  elem.addEventListener('click', function(e)\
  \ {\n    // 你想在点击时做的任何事情\n  }, false);\n}\nelse if ( document.attachEvent ) {\n\
  \  elem.attachEvent('onclick', function(e) {\n    // 你想在点击时做的任何事情\n  });\n}\n```\n\
  \n这个基础脚本只是开始。你可能想写一个通用处理程序来处理所有类型的事件，就像这段来自 NetTuts+ 的脚本（[`net.tutsplus.com/tutorials/javascript-ajax/javascript-from-null-cross-browser-event-binding`](http://net.tutsplus.com/tutorials/javascript-ajax/javascript-from-null-cross-browser-event-binding/))):\n\
  \n```javascript\nvar addEvent = (function( window, document ) {  \n  if ( document.addEventListener\
  \ ) {  \n    return function( elem, type, cb ) {  \n      if ( (elem && !elem.length)\
  \ || elem === window ) {  \n          elem.addEventListener(type, cb, false ); \
  \ \n      }  \n      else if ( elem && elem.length ) {  \n          var len = elem.length;\
  \  \n          for ( var i = 0; i < len; i++ ) {  \n            addEvent( elem[i],\
  \ type, cb );  \n          }  \n      }  \n    };  \n  }  \n  else if ( document.attachEvent\
  \ ) {  \n    return function ( elem, type, cb ) {  \n      if ( (elem && !elem.length)\
  \ || elem === window ) {  \n          elem.attachEvent( 'on' + type, function()\
  \ { return cb.call(elem, window.event) } );  \n      }  \n      else if ( elem.length\
  \ ) {  \n          var len = elem.length;  \n          for ( var i = 0; i < len;\
  \ i++ ) {  \n            addEvent( elem[i], type, cb );  \n          }  \n     \
  \ }  \n    };  \n  }  \n})( this, document );\n```\n\n如果你感到害怕了，那是好事。原生 DOM 不可小视，而且它会变得更加复杂。与其他跨浏览器实现（如\
  \ Ajax）相比，事件绑定相对简单。虽然我不能否认编写原生 DOM 的好处，但也无法假装它很容易。\n\n值得注意的是，即使你编写了原生 DOM，也不能保证它在文件大小上比库小。流行的\
  \ JavaScript 库如 `jQuery` 和 `Zepto` 已经由其贡献者对各种问题（包括文件大小）进行了仔细审查。如果你编写了大量的工具函数，你可能会发现它们比像\
  \ `Zepto` 这样较小的库（约 8 K）还要大。\n\n## 添加第三方工具\n\n尽管如此，你仍然不需要自己编写所有内容。相反，你可以组装一组工具函数。寻找这些函数的绝佳资源是\
  \ [`www.MicroJS.com`](http://www.microjs.com/)。\n\n你可以从 `MicroJS` 中挑选你需要的脚本，并构建一个完美适合你项目的轻量级库。\n\
  \n`MicroJS` 网站由 `Zepto` 的作者 Thomas Fuchs 维护。\n\n## 使用框架\n\n最近，在前端开发中使用全功能框架来多走一步已已变得流行。框架不仅仅是一个\
  \ JavaScript 库，因为它提供了样式和各种深度功能，例如表单控件。我倾向于避开框架，倾向于将 JavaScript 库、各种插件和自定义 CSS 拼凑在一起。这样我就可以创建一个符合我项目需求的自定义构建。但框架确实可以加速开发，我鼓励你尝试一下。\n\
  \n你可以像雕塑家一样做这个决定。你是喜欢用粘土雕塑，根据需要将组件组合在一起？还是喜欢在大理石上雕塑，拿一整块石头并凿掉不需要的部分？无论哪种方式，你最终都会到达类似的点。问题在于你想如何到达。\n\
  \n### Bootstrap\n\nBootstrap 提供了一套可以用于创建整个应用的功能和主题。Bootstrap 最初由 Twitter 为其自己的网站开发，后来向公众发布。Bootstrap\
  \ 提供了从响应式网格布局到表单控件的所有内容。它包含了各种组件和 JavaScript 插件，你可以利用它们来快速构建网站。Bootstrap 的插件包含了常用组件，如模态对话框、下拉菜单、工具提示和图像轮播。Bootstrap\
  \ 中的所有内容都使用一个共同主题进行样式处理，带有图标等。\n\n如果你想快速启动网站且不需要遵循特定的设计方向，Bootstrap 是棒棒。当然，你可以自己为\
  \ Bootstrap 中的所有内容设置样式，但它的主要目的是提供它自带的 UI 视觉效果和体验。\n\n### jQuery UI\n\n另一个选项 `jQuery\
  \ UI` 并不完全是一个框架。它更是一组你可以用来增强表单元素和网站其他方面的工具。但由于它本质上是一组 `jQuery` 插件，用于为常见的 UI 元素提供样式和功能，我将它与其他框架放在一起。\n\
  \n\n\n\n然而，是否将 jQuery UI 作为框架取决于你自己。你可以使用它所有的控件，如标签（tabs）、手风琴（accordions）和其他组件来构建你的整个网站。或者，你也可以将\
  \ jQuery UI 更多视为一组插件。你可以从中挑选你喜欢的组件——例如，使用它为你那些正在用自己自定义代码构建的表单添加一个日期选择器。是的，你可以找到单独的插件来满足这些特定需求，但\
  \ jQuery UI 的核心部分构建得非常精良，你可以轻松创建一个自定义版本，从而避免因未使用的组件导致过多的臃肿。\n\n我个人而言，我将 jQuery UI\
  \ 作为一组插件来使用，因为我不喜欢在 JavaScript 中包含过多的样式，并且更倾向于为标签和模态对话框等基础组件手动编写 CSS。\n\n# 移动端框架\n\
  \n有很多优秀的移动框架可用，例如 jQuery Mobile 和 Sencha Touch。你可以在第 10 章中找到更多关于这些框架以及移动开发的知识。\n\
  \n## 杂项脚本\n\n还有许多你可能想要包含在应用程序中的杂项脚本和工具。我几乎在每个项目中都会包含其中两个脚本：Modernizr 和 HTML5 Shiv。\n\
  \n### Modernizr\n\nModernizr 是一个小型脚本，可以帮助你构建现代应用程序，同时仍支持旧版浏览器。基本上，Modernizr 是一组特征检测，你可以使用它来确定用户的浏览器支持哪些\
  \ CSS3 和 HTML5 特性。\n\nModernizr 的方法是在 `<html>` 元素上添加类名，描述 CSS 中哪些特性可用。例如，如果 `background-size`\
  \ 可用，它会向 `<html>` 元素添加 `backgroundsize` 类。然后你就可以使用 CSS 针对这两种情况：\n\n```css\n/* 不\
  \ background-size */\nhtml .my-element {\n  background-image: url(../path-to/non-sizable-image.png);\n\
  \  background-repeat: repeat;\n}\n\n/* 支持 background-size */\nhtml.backgroundsize\
  \ .my-element {\n  background-image: url(../path-to/sizable-image.png);\n  background-size:\
  \ cover;\n}\n```\n\n你可以使用这种方法来针对各种特性，并使用类名或 Modernizr API 来针对你想要用 JavaScript 使用的\
  \ HTML5 特性。有关 Modernizr 及其它支持的检测类型的更多信息，请访问[`www.modernizr.com`](http://www.modernizr.com)。\n\
  \nModernizr 允许你创建一个自定义版本，只检测你关心的特性。我鼓励你这样做，因为它可以减小文件大小并缩短脚本的实例化时间。\n\n### HTML5\
  \ Shiv\n\nHTML5 Shiv 是一个非常简单的脚本，允许旧浏览器识别 HTML5 元素，如 `<header>`、`<footer>`、`<nav>`、`<section>`\
  \ 和 `<aside>`。如果没有像 HTML5 Shiv 这样的脚本，你仍然可以使用这些元素；但是应用于它们的 CSS 样式在不支持的浏览器中都会丢失。\n\
  \n由于我喜欢使用这些语义化标签，因此我构建的每个网站都会包含此脚本。要使用它，首先从 [`http://code.google.com/p/html5shiv`](http://code.google.com/p/html5shiv/)\
  \ 下载脚本。接下来，在`<head>` 中的某个地方使用 IE 条件将其包含在你的网站中：\n\n```html\n<!--[if lt IE 9]>\n<script\
  \ src=\"dist/html5shiv.js\"></script>\n<![endif]-->\n```\n\n使用条件判断是非常重要的，这样可以限制浏览器对不需要的资源的请求。由于\
  \ IE 8 及更低版本是唯一具有相当市场份额的不支持浏览器，你可以安全地在这里使用条件判断。此外，确保不要将此脚本包含在 `<body>` 中。它必须存在于\
  \ `<head>` 中，最好位于任何样式表声明之后（以获得更好的性能）。\n\n许多其他脚本和框架都包含了 HTML5 Shiv，所以请确保不要重复包含它。\n\
  \n### HTML5 Boilerplate\n\nHTML5 Boilerplate 不是一个库，也不是一个框架。它是一个你可以根据个人需求自定义的模板。Boilerplate\
  \ 是一种基础状态，你可以将其作为基础在其之上构建你的应用程序。它是非侵入性且轻量级的，是任何 HTML5 项目的理想起点。\n\nHTML5 Boilerplate\
  \ 结合了在本章中读到的很多内容；例如，它通过 Google CDN（带有本地备份）包含了 jQuery，以及 Modernizr 和 HTML5 Shiv。它还包含了\
  \ Normalize.css（CSS 重置的现代替代方案）以及许多基础样式和占位符图标。但其核心思想不是像使用框架一样使用它。这种基础状态旨在被完全自定义，而样式在大多数情况下是易于替换的占位符。最后，HTML5\
  \ Boilerplate 包含了一些服务器配置，以提高 Apache、Node 以及其他构建的性能。\n\nHTML5 Boilerplate 兼顾了两者之长。它具有框架的所有优点，因为它提供了一个你可以用来启动应用程序的高标准基准线。但它并没有做得过头。\n\
  \n## 寻找 jQuery 插件\n\n当你通过库、框架或模板涵盖了核心功能后，你的应用程序很可能仍然需要其他功能。你可以自己构建这些每一个组件，但如果你希望有更快的开发进程，最好尝试寻找插件。这样，你就可以在自己不写一行代码的情况下，完成应用程序的大部分剩余工作。\n\
  \n本节重点关注 jQuery 插件，因为它们非常流行。但大多数建议也适用于你可能使用的任何 JavaScript 插件。\n\n### 在哪里（以及哪里不要）寻找\n\
  \n寻找 jQuery 插件的最佳地点是 [`plugins.jquery.com`](http://plugins.jquery.com/) 官方注册表。在这个网站上，你可以搜索、浏览并找到由社区成员评分的插件。但\
  \ jQuery 的插件库并非详尽列表，你最终仍然需要依赖搜索引擎来寻找你需要的内容。通常情况下，插件质量越高，其搜索排名就越高（尽管这并非万无一失）。\n\n\
  当你制定搜索词时，请尽可能具体。我建议避开诸如“25000+ jQuery 插件”这类格式的博客文章。这些通常是为了给网站引流的垃圾列表，其中包含的插件很少（甚至从未）经过仔细研究。\n\
  \n### 寻找什么——十项检查\n\n当你考虑某个插件时，可以分析其许多因素。以下是在评估插件质量时可以考虑的清单：\n\n• 自己编写是否更好？如果功能非常简单，最好还是静下心来自己写它。毕竟，如果你编写它的时间比读完这份列表剩余的时间还要短，又何费此呢？此外，如果该插件与你使用的其他插件类似，那么添加另一个插件并使代码臃肿可能是不合理的。相反，你应该花一点时间扩展另一个插件以满足这两个需求。\n\
  \n\n\n\n\n# 插件评估标准\n\n- 文档是否完善？插件的文档几乎与插件本身一样重要。当你学习如何使用插件或遇到问题时，文档是你首选查阅的地方。此外，花时间编写良好的文档说明开发者在意发布一个高质量的插件，而不是仅仅为了给博客引流而把在其他项目中写的代码随手拿来。\n\
  \n- 是否有良好的支持记录？务必检查插件最近的更新时间。如果它得到了持续维护，这说明开发者在意发布质量的良好信号，也意味着当你遇到任何无法解决的问题时，他或她会为你提供帮助。如果插件是以博客文章的形式发布的，请检查作者回复的最后评论。还要检查开发者上次修复\
  \ Bug 或添加新功能的时间。当然，插件可能已经开发得非常完善，没有更多可以添加的内容了，但良好的支持是一个非常积极的信号。\n\n- 是否使用标准的参数签名模式？在查看文档时，你会看到插件是如何接收参数的。在使用了一些插件后，你会发现插件选项传递方式的一些共同趋势。\n\
  \n处理选项没有唯一的正确方法，但任何具有奇特参数签名模式的插件都是一个巨大的警示。这表明开发者对插件开发并不熟悉，或者开发者没有花心思考虑插件的架构。\n\n\
  - 标记要求是否简单？如果插件依赖源码中的任何标记，那么这些标记的格式就非常重要。\n\n这个问题包含两个方面：首先，奇怪或僵化的标记要求会让插件变得更难用，因为你必须调整自己的标记来适应插件的特定需求。其次，语义化较差或需要看似不必要的元素的标记，表明插件开发者缺乏技能。\n\
  \n- 是否使用了高质量的 CSS？如果插件使用了 CSS，那么这些 CSS 同样重要。良好的 CSS 表明开发者擅长前端工作。糟糕或过量的 CSS 并不意味着是否决因素，但无疑是一个警示。\n\
  \n- 是否有支持的浏览器列表？如果开发者在不同浏览器中测试过插件，他们可能会说明是哪些浏览器。如果开发者列出了具体测试了哪些浏览器以及版本号，那是一个非常好的信号。至少，开发者应该提到它“在所有现代浏览器中运行”或类似的表示他们关注跨浏览器开发的说法。\n\
  \n- 是否有压缩版本（minified version）？这一点有点吹毛求疵，但你应该检查插件网页是否提供了压缩版本。压缩版本是开发者在意性能和文件大小的标志。这并不是绝对必要的，因为开发者可能假设你会将其包含在站点的\
  \ JS 中并压缩。但如果它包含了压缩版本，或者开发者提到了文件大小、Gzip 压缩等，这无疑是一个很好的信号。\n\n- 是否有其他人在使用？最后要检查的项之一是有多少人在使用。如果它出现在一个带有用户评分的网站上，高分无疑是一个好信号。否则，去\
  \ Google 搜索一下看看有多少人在讨论这个插件，以及它出现在过多少个“8000 个 jQuery 插件”列表中。当然，如果插件真的很新，你可以在这方面对其宽容一些。\n\
  \n- 是否好用？最后，检查插件最好的方法是将其接入你的代码中并亲眼观察。这是最耗时的一步，所以当你确认它已经充分处理了列表中讨论的其他问题时再进行此操作。一旦它进入你的代码，请确保它实现了你的需求并具有良好的性能。最后，在将其深度集成到代码之前，务必在你支持的所有浏览器中测试该插件。或者，如果插件作者提供了单元测试，你只需要在你想要支持的环境中运行这些测试即可。单元测试也是质量的极佳指标，因为它意味着开发者花时间对插件进行了彻底测试。\n\
  \n## 总结\n\n在本章中，你了解了如何利用其他脚本的基础来快速启动你的应用程序。\n\n你阅读了 JavaScript 库 `jQuery` 和 `Zepto`，以及完全避免使用库而编写原生\
  \ JavaScript 的优势。然后，你学习了如 `Bootstrap` 和 `jQuery UI` 等较大的框架，以及使用框架的优缺点。\n\n接下来，你阅读了较小的工具脚本：`Modernizr`\
  \ 和 `HTML5 Shiv`。随后，你接触了 `HTML5 Boilerplate`，它结合了库、工具脚本和基础样式创建一个模板。这个模板比某些框架没那么重，但仍然提供了许多相同的优势。\n\
  \n最后，你发现了 `jQuery plugins`：在哪里可以找到它们以及如何判断给定的插件是否值得使用。现在，你准备好卷起袖子，在下一章开始编码了。\n\n\
