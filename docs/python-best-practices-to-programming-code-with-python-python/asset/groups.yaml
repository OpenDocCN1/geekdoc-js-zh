    \ most useful for string representations and for tracebacks and, by using the\
    \ assignment statement, you cut out the one benefit that a lambda expression offers\
    \ over and above a def statement – that it may be embedded within a bigger statement.\n\
    \nWhen you want to derive exceptions, use `Exception` and not `BaseException`.\
    \ Inheritance from the latter is reserved for those exceptions where it is pretty\
    \ much always wrong to catch them.\n\nWhen you design your exception hierarchies,\
