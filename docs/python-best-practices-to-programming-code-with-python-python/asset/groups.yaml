    \nBy reading this document, the reader agrees that under no circumstances is the\
    \ author responsible for any losses, direct or indirect, which are incurred as\
    \ a result of the use of information contained within this document, including,\
    \ but not limited to, errors, omissions, or inaccuracies.\n\n# Introduction\n\n\
    I want to thank you and congratulate you for reading the book, “Python: Best Practices\
    \ for Programming Code with Python”. This book contains proven steps and strategies\
    \ on how to program in Python more effectively. When you first learn Python, you\
    \ will be taught how to write code, but in many cases, you will not be taught\
    \ how to write that code neatly.\n\nIf you speak to any Python programmer, ask\
    \ them what it is like about Python. I guarantee they will tell you that one of\
    \ the main reasons is because it is easily readable. In fact, this is the absolute\
    \ heart of the Python language, simply because computer code is read far more\
    \ than it is written. Much of this is due down to the fact that Python code follows\
    \ a set of guidelines and “Pythonic” idioms – if you hear a programmer refer to\
    \ a part of the code as not being “Pythonic”, it means that it doesn’t follow\
    \ those guidelines and it doesn’t express intent in any readable manner.\n\nCode\
    \ style and layout is incredibly important, as is consistency in the style that\
    \ you use. With that said, there are times when consistency isn’t the right thing\
    \ and the guidelines are simply not applicable – you have to know when that time\
    \ is and that is when best judgment comes into programming with Python.\n\nWith\
    \ this guide, I am going to show you the absolute best way to write your code,\
    \ tidying up your program and making it all more effective and efficient. I won’t\
    \ just give you the basic. I will delve deep into everything you need to know,\
    \ from the layout of the code to how to write functions, idioms, and names.\n\n\
    I will talk about whitespaces and tabs, strings, and methods. I will also be giving\
    \ you some general recommendations for Python programming along with the general\
    \ concepts. In short, by the time you have read my Best Practice guide, you will\
    \ be the best Python programmer you can possibly be.\n\nMy book does assume some\
    \ prior knowledge of Python programming, so if you are a complete newbie to the\
    \ programming scene, please familiarize yourself with Python code before you read\
    \ this book. My aim is to help you to produce Python code that is free from, or\
    \ at least has very few, complications or obvious problems, as well as making\
    \ it more readable for others.\n\nThanks again for reading this book, I hope you\
    \ enjoy it!\n\n# Chapter 1: General Concepts of Python Coding\n\nBefore we get\
    \ properly into the book, these are the general concepts of coding that you should\
    \ be aware of; concepts that will make life easier for you.\n\n## Explicit Code\n\
    \nWhile you can do all sorts of weird and wonderful things with Python, it is\
    \ best to keep it straightforward and explicit.\n\n### A Bad Example:\n\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    ### A Good Example:\n\n```python\ndef make_complex(x, y):\n    return {'x': x,\
    \ 'y': y}\n```\n\nCompare these examples; in the latter example of code, we explicitly\
    \ received x and y from the caller and the return is an explicit dictionary.\n\
    \nThe developer who wrote this knows what to do just by looking at the first line\
    \ and the last line; this is not the case with the bad example.\n\n## One Line,\
    \ One Statement\n\nWhile there are compound statements, like the list comprehensions,\
    \ that are allowed and, in many cases, appreciated, it is not good practice to\
    \ have 2 statements that are disjointed on one line.\n\n### A Bad Example:\n\n\
    ```python\nprint 'one'; print 'two'\n\nif x == 1: print 'one'\n\nif <complex comparison>\
    \ and <other comparison>:\n    # do something\n```\n\n### A Good Example:\n\n\
    ```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n    print 'one'\n\ncond1 =\
    \ <complex comparison>\ncond2 = <other comparison>\nif cond1 and cond2:\n    #\
    \ do something\n```\n\n## Returning Values\n\nWhen you get a function that is\
    \ ever-growing in complexity, it isn’t unheard of use return statements in the\
    \ body. However, if you want to maintain clear intent and a good level of readability,\
    \ you should try not to return values from several points in the function.\n\n\
    When it comes to returning values within a function, there are 2 cases for doing\
    \ so: the result that comes from a normally processed return, and the errors that\
    \ are indicative of incorrect input parameters or for any reason the function\
    \ cannot complete the computation.\n\nIf you don't want exceptions raised for\
    \ the latter case, then it might be necessary for values, such as False or None\
    \ to be returned, as an indication that the function was not able to perform properly.\
    \ In cases such as this, it is best practice to return as soon as the wrong context\
    \ has been noticed.\n\nThis will help to neaten up the function structure because\
    \ all code that comes after the error return assumes that the condition has been\
    \ met so that the main function result can be computed. As such, it is sometimes\
    \ necessary to have several return statements like this.\n\nThat said, if a function\
    \ contains several different courses it can go, it can be unwieldy to debug the\
    \ result so it is preferable to maintain just one course. This also helps in working\
    \ out code paths.\n\n### For Example:\n\n```python\ndef complex_function(c, b,\
    \ a):\n    if not c:\n        return None # Raising an\n        exception might\
    \ be better\n    if not b:\n        return None # Raising an\n        exception\
    \ might be better\n    # Some elaborate code that is trying\n    to make x from\
    \ c, b and a\n    # Try not to return x if successful\n    if not x:\n       \
    \ # A Plan-B calculation of x\n        return x # One exit point for the\n   \
    \     value x will be helpful\n```\n\n# Chapter 2: Programming Recommendations\n"
