    \    return 's' in l\n```\n\nNow, both of these functions look exactly the same\
    \ simply because lookup_set uses that fact that Python sets are hash tables. However,\
    \ the performance of lookup in each of the examples is different. In order to\
    \ decide whether a specific item is contained in a list, Python has to search\
    \ through every single item until it finds one that matches. This takes time,\
    \ especially if you have a long list. With sets, each item has a hash that tells\
    \ Python where to look for the matching item. This makes the search much quicker\
    \ even if the sets are big ones. You can also search dictionaries in the same\
    \ way. Because there is a difference in the performance, it is a better idea to\
    \ use a set or a dictionary rather than a list in the following cases:\n\n+  \
    \ - Where a collection contains a lot of items\n- Where you are going to be searching\
    \ for items in a collection on a repeated basis\n- There are no duplicate items"
- md: "\nIn cases of smaller collections or those that you are not likely to be searching\
    \ on a frequent basis, the extra memory and time needed to set the hash table\
    \ up will, more often than not, be more than the time you save by improving the\
    \ speed of the search.\n\n## Chapter 5: Comments\n\nBecause you already have some\
    \ experience of Python coding, you will know that a comment is invisible when\
    \ the program is run. A comment is there to help the coder and others who read\
    \ it to understand what has been done and why. Now, some people think that, because\
    \ they are invisible then there is no need to write them while others write comments\
    \ that make no sense and contradict their code. I have to tell you, out of the\
    \ two, having a contradictory comment is far worse than not writing one at all\
    \ and, as such, whenever you make changes to your code, you must make sure that\
    \ you update your comments.\n\nWhen you write a comment, ensure that it is a proper\
    \ sentence with a proper ending. As it is when you write anything, your comment,\
    \ be it a sentence or a phrase, must have a capital letter to start it. The only\
    \ exception to that rule is if it is an identifier that starts with a lowercase\
    \ letter – a golden rule here is that you NEVER change the case of an identifier!\n\
    \nIf you are using a short comment you can leave off the full-stop at the end.\
    \ If you are writing block comments, these tend to be made up of at least one\
    \ paragraph, sometimes more, each one built from whole sentences. Each of these\
    \ sentences must have a full-stop. Following each full-stop there should be 2\
    \ spaces and all comments should be written in English. The only exception to\
    \ this is if you are 200% certain that your code is never going to be read by\
    \ people who do not speak or read your language.\n\n### Block Comments:\n\nA block\
    \ comment tends to apply to some or all of the code that comes after it. The comment\
    \ should be indented in the exact same way as the code it refers to and each line\
    \ of each block must begin with a # and one space. The only exception is if you\
    \ have used indented text within the comment. All paragraphs in each block comment\
    \ must be separated with a line that contains one #.\n\n### Inline Comments\n\n\
    These should be used as little as possible. As a refresher, an inline comment\
    \ is a comment that is placed on the same line that a statement is on. An inline\
    \ comment has to be separated from the statement by a minimum of two spaces and\
    \ they must begin with one # and one space.\n\nIn honesty, you should avoid using\
    \ inline comments because they are not really necessary and can cause an unwanted\
    \ distraction.\n\nFor example, you should never do this:\n\n```python\nx = x +\
    \ 1    # Increment x\n```\n\nHowever, sometimes, this could be useful:\n\n```python\n\
    x = x + 1 # Compensate\nfor the border\n```\n\n## Chapter 6: Conventions\n\nTo\
    \ make your Python code much better, follow these conventions:\n\nLook to see\
    \ if your variables are equal to a constant. There is no need for an explicit\
    \ comparison of the values to 0, None or True; instead, you could add it into\
    \ the if-statement. Look at the following examples:\n\n### A Bad Example:\n\n\
    ```python\nif attr == True:\n    print 'True!'\n```\n\n```python\nif attr == None:\n\
    \    print 'attr is None!'\n```\n\n### A Good Example:\n\n```python\n# Just look\
    \ at the value\nif attr:\n    print 'attr is the best!'\n```\n\n```python\n# or\
    \ check to see what the opposite is\nif not attr:\n    print 'attr is the worst!'\n\
    ```\n\n```python\n# or, as None is considered to be false,\n# make sure you run\
    \ an explicit check for it\nif attr is None:\n    print 'attr is None!'\n```\n\
    \n### How to Access Dictionary Elements:\n\nInstead of using the method **dict.has_key()**,\
    \ use the syntax **x in d** or use **dict.get()** to pass default arguments.\n\
    \n### A Bad Example:\n\n```python\nd = {'hello': 'world'}\nif d.has_key('hello'):\n\
    \    print d['hello']      # prints 'world'\nelse:\n    print 'the_default_value'\n\
    ```\n\n### A Good Example:\n\n```python\nd = {'hello': 'world'}\n\nprint d.get('hello',\
    \ 'default_value') # prints 'world'\nprint d.get('thingy', 'default_value') #\
    \ prints 'default_value'\n```\n\n```python\n# Or\nif 'hello' in d:\n    print\
    \ d['hello']\n```\n\n### Manipulate Lists the Short Way\n\nYou don't need to be\
    \ long-winded when it comes to manipulating lists; use list comprehensions or\
    \ the **filter()** or **map()** functions to use concise syntax when you want\
    \ to perform an operation on a list.\n\n### A Bad Example:\n\n```python\n# Filter\
    \ all elements that are more than 4\na = [5, 4, 3]\nb = []\n\nfor i in a:\n  \
    \  if i > 4:\n        b.append(i)\n```\n\n### A Good Example:\n\n```python\na\
    \ = [5, 4, 3]\nb = [i for i in a if i > 4]\n# Or:\nb = filter(lambda x: x > 4,\
    \ a)\n```\n\n### Another Bad Example:\n\n```python\n# Add 3 to all members of\
