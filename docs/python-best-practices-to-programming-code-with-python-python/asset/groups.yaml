    \ greeting is True:\n```\n\n## Chapter 3: Code Layout\n\nThe most obvious place\
    \ to start with is how to layout your code. I will be giving you the best practice\
    \ guidelines for code layout along with examples on how to do it and how not to:\n\
    \n## Indentation and Alignment\n\nEvery indent level should be 4 spaces.\n\nWhen\
    \ you use continuation lines, they should align the wrapped elements using one\
    \ of two methods:\n\n- Vertically with the Python implicit way of joining lines\
    \ inside braces, brackets, and parentheses, or\n- With hanging indents\n\nWhen\
    \ you use a hanging indent, consider that there shouldn't be any arguments on\
    \ line one and that, to mark the continuation line, indentation must be used.\n\
    \nConsider the following examples:\n\n## The Right Way:\n\n```python\n# Aligned\
