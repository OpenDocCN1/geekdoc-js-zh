  - '[PAGE 59]


    # Instance Variables and Method Names


    Again, the naming conventions for functions apply here – using lowercase with
    intermittent underscores. If you are using an instance variable or a non-public
    method, you should use a single leading underscore. To stop a name from clashing
    with a subclass, two leading underscores should be used as a way of invoking the
    name mangling rules in Python.


    When these rules are invoked, the name is mangled with the class name. For example,
    class Foo contains an attribute called `__a`. This cannot be accessed using `Foo__a`.
    As a rule, you should only use a double underscore when the name is likely to
    come into conflict with class attributes that are designed as subclasses.


    # Constants


    These tend to be defined on module level and are all uppercase with separating
    underscores, for example, `MAX_OVERFLOW`


    # Inheritance Design


    One rule to abide by is to determine if the instance variable or class method
    is non-public or public. If you can’t decide, go for non-public as you can easily
    change it to public later on, whereas changing public to non-public is not so
    easy.'
  - '[PAGE 60]


    A public attribute is one that clients that are not related to the class would
    use while a non-public attribute is one that is not intended for use by a third-party.
    With a public attribute, you guarantee backward compatibility from start to finish
    while, with the non-pubic attribute you do not and can remove or make changes
    to the attribute. Note that the term “private” is not used and this is because
    there is no real private attribute in the Python language.


    One other attribute category is that which is a protected attribute. In Python,
    they come under the subclass API. There are those classes that are designed solely
    as classes to inherit from, whether it is as a way of extending or modifying certain
    aspects of the behavior. When you design a class like this, always make sure that
    you make explicit decisions about the attributes – are they public, only to be
    used by the base class or are they in the subclass API?


    With all of this, these are the Pythonic guidelines:


    +   - A public attribute must not have a leading underscore


    +   - If a public attribute clashes with a keyword (reserved), add one trailing
    underscore to the attribute name. This is the preferred method over using a'
