    \n# 免责声明：\n\n请注意，本文档中包含的信息仅供教育和娱乐目的。我们已尽一切提供准确、最新且可靠的完整信息。不表示或不暗示任何形式的保证。读者承认，作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试尝试书中列出的任何技术之前，请咨询获得许可的专业人士。\n\
    \n通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不负责，包括但不限于错误、遗漏或不准确。\n\n# 引言\n\
    \n我想感谢并祝贺你阅读《Python：Python 编程最佳实践》一书。这本书包含了关于如何更有效地进行 Python 编程的成熟步骤和策略。当你第一次学习\
    \ Python 时，会被教你如何编写代码，但在许多情况下，并不会教你如何整洁地编写这些代码。\n\n如果你接触任何 Python 程序员，问问他们对 Python\
    \ 的感受。我保证他们会告诉你，原因之一是因为它易于阅读。事实上，这是 Python 语言绝对的核心，因为计算机代码被阅读的次数远多于编写的次数。这在很大程度上归于\
    \ Python 代码遵循一套指南和“Python 式”（Pythonic）惯用法——如果你听到程序员提到代码的某部分不“Pythonic”，那意味着它没有遵循这些指南，并且没有以任何可读的方式表达意图。\n\
    \n代码风格和布局至关重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，而且这些指南也根本不适用——你必须知道什么时候是这种时候，而这正是进行\
    \ Python 编程时做出最佳判断的时候。\n\n通过本指南，我将向你展示编写代码的极致方法，整理你的程序并使其变得更加高效、快捷。我不会仅仅给你基础知识。我将深入探讨你需要了解的一切，从代码的布局到如何编写函数、惯用法和命名。\n\
    \n我将谈论空格和制表符、字符串和方法。我还会为你提供关于 Python 编程的一些通用建议以及通用概念。简而言之，当你读完我的最佳实践指南后，你将成为你可能的最优秀的\
    \ Python 程序员。\n\n我的书假设你已经具备 Python 编程的一些基础知识，所以如果你是编程领域的完全新手，请在阅读本书之前熟悉熟悉 Python\
    \ 代码。我的目标是帮助你编写出没有（或至少极少）复杂性或明显问题的 Python 代码，并让它对其他人更具读性。\n\n再次感谢阅读本书，希望你喜欢它！\n\
    \n# 第 1 章：Python 编码通用概念\n\n在我们正式进入书籍之前，这些是你应该意识到的编码通用概念；这些概念会让你的生活变得更轻松。\n\n##\
    \ 显式代码\n\n虽然你可以用 Python 许多许多奇奇怪妙的事情，但最好保持简单直接和显式。\n\n### 一个糟糕的示例：\n\n```python\n\
    def make_complex(*args):\n    x, y = args\n    return dict(**locals())\n```\n\n\
    ### 一个良好的示例：\n\n```python\ndef make_complex(x, y):\n    return {'x': x, 'y': y}\n\
    ```\n\n比较这些示例；在后者的代码示例中，我们从调用者那里显式地接收了 x 和 y，返回值是一个显式的字典。\n\n编写这段代码的开发者只需看第一行和最后一行就知道要做什么；糟糕的示例并非如此。\n\
    \n## 一行一个语句\n\n虽然允许复合语句（如列表推导式），并且在很多情况下是受推崇的，但在行内放置两个互不关联的语句并不是良好做法。\n\n### 一个糟糕的示例：\n\
    \n```python\nprint 'one'; print 'two'\n\nif x == 1: print 'one'\n\nif <complex\
    \ comparison> and <other comparison>:\n    # do something\n```\n\n### 一个良好的示例：\n\
    \n```python\nprint 'one'\nprint 'two'\n\nif x == 1:\n    print 'one'\n\ncond1\
    \ = <complex comparison>\ncond2 = <other comparison>\nif cond1 and cond2:\n  \
    \  # do something\n```\n\n## 返回值\n\n当你获得一个复杂度不断增加的函数时，在函数体中使用 return 语句并不罕见。然而，如果你想保持清晰的意图和良好的可读性，你应该尽量不要从函数的多个点返回值。\n\
    \n当在函数内部返回值时，有两种情况：来自正常处理的返回结果，以及指示输入参数错误或由于某种原因函数无法完成计算的错误。\n\n如果你不想在后一种情况下抛出异常，那么可能需要返回某些值（如\
    \ False 或 None）作为函数未能正常执行的指示。在这样的情况下，最佳实践是一旦注意到错误的上下文就立即返回。\n\n这将有助于整洁函数结构，因为错误返回之后的所有代码都假设条件已经满足，从而可以计算主函数的结果。因此，有时确实需要多个这样的\
    \ return 语句。\n\n尽管如此，如果一个函数包含了多个不同的可以走的路径，那么调试结果可能会变得棘手，因此最好只维护一条路径。这有助于推导出代码路径。\n\
    \n### 例如：\n\n```python\ndef complex_function(c, b, a):\n    if not c:\n      \
    \  return None # 抛出异常\n        异常可能更好\n    if not b:\n        return None # 抛出异常\n\
    \        异常可能更好\n    # 尝试从 c, b 和 a 制作 x 的一些复杂代码\n    # 如果成功，尽量不要返回 x\n    if\
    \ not x:\n        # 备选方案计算 x\n        return x # 一个出口点对于\n        值 x 将很有帮助\n\
    ```\n\n"
