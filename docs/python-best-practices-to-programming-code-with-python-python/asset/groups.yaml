    \ always use the `ValueError('message')` instead of `raise ValueError 'message'`\n\
    \nThis is because the second example is neither valid nor legal syntax for Python\
    \ 3. Also, the use of the containing parentheses means that there is no requirement\
    \ to use continuation characters on a line when you add string formatting or when\
    \ an exception argument is too long.\n\n- When you catch exceptions, always mention\
    \ specific ones wherever you can rather than using the bare except: clause\n\n\
    ### For Example:\n```python\ntry:\n    import platform_specific_module\nexcept\
    \ ImportError:\n    platform_specific_module = None\n```\nKeyboardInterrupt and\
    \ SystemExit exceptions will be caught by a bare except: clause and this makes\
    \ it much more difficult to interrupt programs using CTRL+C and they can also\
    \ cover up other problems that may be there.\n\nIf you are looking to catch every\
    \ exception that signals errors in the program, use `except Exception:`. A general\
    \ rule is to only use the bare except: clause in one of these two cases:\n\n1.\
    \ If the traceback is being printed by the exception handler; that way, the user\
    \ will be made aware of any errors.\n2. If cleanup work is needed but the code\
    \ allows the exception to propagate up using `raise`. A more efficient way to\
    \ do this would be to use `try...finally`.\n\nWhen you are binding a caught exception\
    \ to a name, use the explicit binding syntax from Python 2.6:\n```python\ntry:\n\
    \    process_data()\nexcept Exception as exc:\n    raise\nDataProcessingFailedError(str(exc))\n\
    ```\nThis is the ONLY syntax that Python 3 supports and it cuts out any problems\
    \ of ambiguity that are associated with the older-style syntax that is comma-based.\n\
    \n- When you are catching system errors, use the exception hierarchy from Python\
    \ 3.3 rather than errno values. As well, when you use any try/except clause, try\
    \ limit the use of the try clause to the least amount of code. This will cut down\
    \ the risk of errors being hidden.\n\n### A Good Example:\n```python\ntry:\n \
    \   value = collection[key]\nexcept KeyError:\n    return key_not_found(key)\n\
    else:\n    return handle_value(value)\n```\n\n### A Bad Example:\n```python\n\
    # Too broad!\ntry:\n    return handle_value(collection[key])\nexcept KeyError:\n\
    \    # Will catch a KeyError that is raised by handle_value()\n    return key_not_found(key)\n\
    ```\n\n- When you use a resource that is local to a specific code section, use\
    \ it with a statement to make sure that it is cleaned immediately after use. You\
    \ can also use `try...finally`.\n\n- Always invoke context manager through separate\
    \ methods or functions whenever they are for a purpose other than getting and\
    \ releasing resources.\n\n### A Good Example:\n```python\nwith conn.start_transaction():\n\
    \    do_something_in_transaction(conn)\n```\n\n### A Bad Example:\n```python\n\
    with conn: something_in_transaction(conn)\n```\nThe second example does not give\
