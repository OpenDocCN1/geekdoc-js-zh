    \ for suffixes and prefixes, use `.startswith()` and `.endswith()` instead.\n\n\
    These are much cleaner methods and they are less prone to errors.\n\n### A Good\
    \ Example:\n```python\nif foo.startswith('bar'):\n```\n\n### A Bad Example:\n\
    ```python\nif foo[:3] == 'bar':\n```\n"
  mdcn: "\n这些是编写 Python 代码的基本建议，如果你希望你的代码更加有效、高效且具有可读性，你应该遵循这些建议。\n\n- 你的代码编写方式不应对其他\
    \ Python 实现产生不利影响，例如 IronPython、Jython、PyPy、Psyco 和 Cython。\n\n例如，你不应该永远依赖于 CPython\
    \ 中高效的字符串拼接，其形式为 `a=a+b` 或 `a+=b`。这是一种相当脆弱的优化，尽管它在 CPython 中效率极高，但因为它对所有类型都不生效，而且在任何不使用引用计数的\
    \ Python 实现中都不存在。\n\n相反，每当你使用对性能敏感的库部分时，你应该使用 `.join()` 形式。这可以确保拼接在所有不同的 Python\
    \ 实现中都是线性耗时的。\n\n- 永远不要使用等值运算符来与 `None` 等单例进行比较。相反，请使用 `is` 或 `is not`。\n\n你还应该警惕在应该使用\
    \ `if x is not None` 的地方使用 `if x`。一个例子是，当你正在测试一个默认值为 `None` 的参数或变量是否真的被设置了不同的值时。另一个值可能是一个在布尔上下文中为假的类型。\n\
    \n- 与其使用 `not is` 运算符，你应该使用 `is not`。虽然它们在功能上是等等的，但前者的可读性较低，因此后者更受青睐。例如：\n\n###\
    \ 推荐用法：\n```python\nif foo is not None:\n```\n\n### 不要这样用：\n```python\nif not\
    \ foo is None\n```\n\n- 当你使用富备比较（rich comparison）实现排序操作时，你应该实现所有的 6 个操作，而不是依赖其他代码来执行比较。这些操作是\
    \ `__eq__`、`__lt__`、`__ne__`、`__ge__`、`__gt__`、`__le__`\n\n为了减少工作量一个特定的装饰器可以帮助生成缺失的比较方法。该装饰器是\
    \ `functools.total_ordering()`。\n\n风格指南指出，Python 假设反射性规则。因此，Python 解释器可能会交换 `y\
    \ > x` 和 `x < y` 的顺序，或者可能会交换 `y >= x` 和 `x <= y`。\n\n你可能还会发现参数 `x == y` 被交换成了\
    \ `x != y`。`min()` 和 `sort()` 操作肯定会使用 `<` 运算符，而 `max()` 函数将使用 `>` 运算符。但是作为最佳实践指南，你应该使用所有的操作，以防混淆。\n\
    \n- 与其使用将 lambda 表达式绑定到标识符的赋值语句，不如使用 `def` 语句\n\n### 良好的示例：\n```python\ndef f(x):\
    \ return 2*x\n```\n\n### 糟糕的示例：\n```python\nf = lambda x: 2*x\n```\n\n第一个示例显示，给函数对象的名称是\
    \ 'f' 而不是集体的 `<lambda>`。这对于字符串表示以及回溯轨迹（tracebacks）最有用，而通过使用赋值语句，你放弃了 lambda 表达式相比\
    \ `def` 语句所提供的唯一优势——即它可能被嵌入到更大的语句中。\n\n当你想要派生异常时，请使用 `Exception` 而不是 `BaseException`。从后者的继承是留给那些捕获它们时几乎总是错误的异常的。\n\
    \n在设计异常层次结构时，应根据捕获异常可能需要的性质来构建，而不是根据异常抛出的位置。始终回答一个问题——“出什么问题了？”而不是仅仅说某事出错了。使用类命名的约定，但为产生错误的异常类添加“Error”\
    \ 后缀。\n\n对于不是错误且用作流程控制或其他信号形式的异常，没有需要添加特殊后缀。\n\n- 当你使用异常链（exception chaining）时，仅在需要的地方使用。\n\
    \n当你故意替换内部异常时，请确保将正确的细节转移到较新的异常中。示例包括：在将 `KeyError` 转换为 `AttributeError` 时确保属性名称被保留，或者在将原始异常文本嵌入到新异常的消息中。\n\
    \n- 当你使用 Python 2 并抛出异常时，始终使用 `ValueError('message')` 而不是 `raise ValueError 'message'`\n\
    \n这是因为第二个示例在 Python 3 中既不是有效的也不是合法的语法。此外，使用包含的括号意味着，当你在添加字符串格式化或异常参数过长时，不需要在行末尾使用续行符。\n\
    \n- 当你捕获异常时，尽可能在任何地方提到具体的异常，而不是使用裸露 `except:` 子句\n\n### 例如：\n```python\ntry:\n\
    \    import platform_specific_module\nexcept ImportError:\n    platform_specific_module\
    \ = None\n```\n`KeyboardInterrupt` 和 `SystemExit` 异常会被裸露 `except:` 子句捕获，这使得使用\
    \ CTRL+C 中断程序变得困难得多，而且它们还会掩盖可能存在的其他问题。\n\n如果你想要捕获程序中信号错误的每个异常，请使用 `except Exception:`。一个通用规则是仅在以下两种情况使用裸露\
    \ `except:` 子句：\n\n1. 如果回溯轨迹（traceback）是由异常处理器打印的；这样用户就能感知任何错误。\n2. 如果需要清理工作，但代码允许通过\
    \ `raise` 让异常向上传播。此此更有效的方法是使用 `try...finally`。\n\n当你将捕获的异常绑定到名称时，使用 Python 2.6\
    \ 的显式绑定语法：\n```python\nexcept Exception as e:\n```\n（注：原文示例代码不完整，此处根据上下文补全了常见的\
    \ `as e` 语法）\n"
