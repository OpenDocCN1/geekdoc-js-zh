    implementations, such as IronPython, Jython, PyPy, Psyco and Cython.


    For example, you should never revel rely on the efficient string concatenation
    of CPython that takes the form of `a=a+b` or `a+=b`. This is a somewhat fragile
    optimization, even though it is super-efficient in CPython, because it won''t
    work on all type sand it won''t be present in any Python implementation that does
    not use refcounting.


    Instead, where you use a part of the library that is performance-sensitive, you
    should use the `.join()` form instead. This will make sure that the concatenation
    is linear across all the different Python implementations.


    +   - Never use an equality operator to make comparisons to a singleton such as
    None. Instead, use `is or or not`.


