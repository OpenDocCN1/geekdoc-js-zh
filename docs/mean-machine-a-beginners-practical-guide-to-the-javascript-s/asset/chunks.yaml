    既然所需的包已经就绪，密钥也已准备好，让我们进入用户身份验证阶段。\n\n## 创建示例用户\n\n首先，我们需要确保我们确实有用户可以进行验证，因为在上一章的末尾，我们删除了所有用户。让我们使用在\
    \ API 中创建的 `POST http://localhost:8080/api/users` 路由来创建一个用户，并将其添加到数据库中。\n\n我们将发送一个带有以下信息的\
    \ `POST` 请求：\n\n**姓名** Chris **用户名** chris **密码** supersecret\n\n![创建示例用户](img/10-node-authentication----create-user.jpg)\n\
    \n创建示例用户\n\n由于目前还没有身份验证机制，用户会被成功创建。现在我们已经有了用户，让我们为他创建一个身份验证机制，让他登录并获取令牌。\n\n##\
    \ 身份验证用户并发放令牌\n\n我们将在 API 路由内部创建一个名为 `POST http://localhost/api/authenticate`\
    \ 的新路由。用户将在这里发送带有用户名和密码的 `POST` 请求。如果这两者都通过了，他们将收到一个令牌，以便访问我们 API 的信息。\n\n路由创建的顺序在这里很重要。我们不希望这个\
    \ `authenticate` 路由受到我们身份验证中间件的保护，因此它将**被放置在第 9 章创建的中间件之前**。以下是它的位置展示：\n\n```\n\
    \ 1 // 首页的基本路由\n 2 app.get('/', ...\n 3 \n 4 // 获取 express 路由器的实例\n 5 var apiRouter\
    \ = express.Router();\n 6 \n 7 // 用户验证路由\n 8 apiRouter.post('/authenticate', ...\n\
    \ 9 \n10 // 所有请求使用的中间件\n11 apiRouter.use(function(req, res, next) ...\n12 \n13\
    \ // 其他 api 路由。加密的路由\n14 apiRouter.get('/', ...\n```\n\n在 `apiRouter.post('/authenticate',\
    \ ...` 路由内部，我们将创建 JSON Web Token (JWT) 并将其返回给用户。\n\n让我们创建验证用户的路由。我们将：\n\n* 检查是否存在该用户名的用户\n\
    * 检查用户密码是否正确（通过将其与数据库中保存的哈希密码进行比较）\n* 如果一切无误，则创建一个令牌\n\n```\n 1 // 验证用户的路由 (POST\
    \ http://localhost:8080/api/authenticate)\n 2 apiRouter.post('/authenticate',\
    \ function(req, res) {\n 3 \n 4   // 查找用户\n 5   // 显式选择姓名、用户名和密码\n 6   User.findOne({\n\
    \ 7     username: req.body.username\n 8   }).select('name username password').exec(function(err,\
    \ user) {\n 9 \n10     if (err) throw err;\n11 \n12     // 未找到该用户名的用户\n13    \
    \ if (!user) {\n14       res.json({ \n15         success: false, \n16        \
    \ message: '身份验证失败。未找到用户.' \n17       });\n18     } else if (user) {\n19 \n20\
    \       // 检查密码是否匹配\n21       var validPassword = user.comparePassword(req.body.password);\n\
    22       if (!validPassword) {\n23         res.json({ \n24           success:\
    \ false, \n25           message: '身份验证失败。密码错误.' \n26         });\n27       } else\
    \ {\n28 \n29         // 如果找到了用户且密码正确\n30         // 创建令牌\n31         var token\
    \ = jwt.sign({\n32           name: user.name,\n33           username: user.username\n\
    34         }, superSecret, {\n35           expiresInMinutes: 1440 // 24 小时后过期\n\
    36         });\n37 \n38         // 将包含令牌的信息作为 JSON 返回\n39         res.json({\n\
    40           success: true,\n41           message: '请使用你的令牌!',\n42           token:\
    \ token\n43         });\n44       }   \n45 \n46     }\n47 \n48   });\n49 });\n\
    ```\n\n该路由完成了我们需要它执行的主要工作：**检查是否存在该用户名的用户**，使用我们在第 9 章的 User 模型中创建的 `comparePassword`\
    \ 方法**确保密码正确**，以及**创建一个令牌**。\n\n我们正在使用 `jwt` (jsonwebtoken) 包来签名令牌。当我们传入有效负载（在本例中是我们的用户）时，该包会自动生成我们\
    \ JWT 的头部和签名。\n\n现在，当我们使用之前使用的凭据通过向 `http://localhost:8080/api/authenticate` 发送\
    \ `POST` 请求，结合创建用户的信息（chris/supersecret）来验证用户时，我们将获得令牌！\n\n![身份验证用户并获取令牌](img/10-node-authentication----authenticate-user.jpg)\n\
    \n身份验证用户并获取令牌\n\n我们还可以用错误的用户名测试我们的身份验证路由：\n\n![验证错误的用户名](img/10-node-authentication----authenticate-wrong-user.jpg)\n\
    \n验证错误的用户名\n\n这里是错误密码的情况：\n\n![验证密码](img/10-node-authentication----wrong-password.jpg)\n\
    \n验证密码\n\n## 测试我们的路由中间件\n\n现在我们已经构建了负责保护后续路由的中间件，让我们测试一下刚刚创建的内容，以确保它工作正常。\n\n\
    以下是在不传递任何身份验证信息的情况下尝试访问主 API 路由的操作：\n\n![未提供令牌](img/10-node-authentication----unauthenticated.jpg)\n\
    \n未提供令牌\n\n"
