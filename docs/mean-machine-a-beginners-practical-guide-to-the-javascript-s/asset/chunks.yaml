    We’ll be using this API as the data backend of our Angular application that we
    will start to build. Let’s look at authenticating this API with token based authentication
    next and then we’ll be moving onto learning AngularJS.


    # Node Authentication


    In this chapter, we will implement a good basis of authentication for our application.
    It is important to note that there are multiple ways of implementing authentication
    and that will all be based on a case-by-case basis of what type of application
    you are building, who will be accessing your data, and many other factors.


    However, even though there can be many ways to implement authentication, there
    will be a foundation that is widely used and that is `token based authentication`.
    Using this type of authentication for our application from the start ensures that
    it will be protected no matter how large it grows.


    The main benefits of tokens are:


    * Stateless and scalable servers

    * Mobile application ready

    * Pass authentication to other applications (think OAuth through Facebook third-party
    applications)

    * Extra security as compared to other authentication methods


    Let’s talk a bit on authentication and why we should use token based authentication.


    ## Why Token Based Authentication Came to Be?


    Token based authentication has been used across the web for many services that
    we use on a daily basis. When a service provides us with an API to access their
    data, it is usually authenticated using tokens. Take Facebook’s API for example.
    We need to authenticate with Facebook (the first time with username and password)
    and then we are given a token for future authentication. Every request after that
    for a given time will only need the token and not our username and password. We’ll
    talk more on the logistics of this, but keep in mind that many other services
    including GitHub, Google+, and Twitter (among many more) use tokens for authentication.


    ### Server Based Authentication (Traditional Method)


    Before we can talk about why tokens came about for authentication, let’s look
    at how the norm for authentication used to work.


    > Since the HTTP protocol is stateless, if we authenticate a user with a username
    and password, then on the next request, our application won’t know who we are.
    We would have to authenticate again.


    The traditional way of having our applications remember who we are is to store
    the user logged in information on the server. This can be done in a few different
    ways on the session, usually in memory or stored on the disk.


    Here is a graph of how a server based authentication workflow would look:


    ![Server Based Authentication](images/10-node-authentication----tokens-traditional.png)


    Server Based Authentication


    As the web, applications, and the rise of the mobile applications have come about,
    this method of authentication has shown problems, especially in scalability.


    ### The Problems with Server Based Authentication


    A few major problems arose with this method of authentication.


    **Sessions**: Every time a user is authenticated, the server will need to create
    a record somewhere on our server. This is usually done in memory and when there
    are many users authenticating, the overhead on your server increases.


    **Scalability**: Since sessions are stored in memory, this provides problems with
    scalability. As our cloud providers start replicating servers to handle application
    load, having vital information in session memory will limit our ability to scale.


    **CORS**: As we want to expand our application to let our data be used across
    multiple mobile devices, we have to worry about cross-origin resource sharing
    (`CORS`). When using `AJAX` calls to grab resources from another domain (mobile
    to our API server), we could run into problems with forbidden requests.


    **CSRF**: We will also have protection against cross-site request forgery (`CSRF`).
    Users are susceptible to `CSRF` attacks since they can already be authenticated
    with say a banking site and this could be taken advantage of when visiting other
    sites.


    With these problems, scalability being the main one, it made sense to try a different
    approach.


    ## How Token Based Authentication Works


    Token based authentication is stateless. We are not storing any information about
    our user on the server or in a session.


    This concept alone takes care of many of the problems with having to store information
    on the server.


    > No session information means your application can scale and add more machines
    as necessary without worrying about where a user is logged in.


    Although this implementation can vary, the gist of it is as follows:


    1. User Requests Access with Username / Password

    2. Application validates credentials

    3. Application provides a signed token to the client

    4. Client stores that token and sends it along with every request

    5. Server verifies token and responds with data


    **Every single request after the first will require the token**. This token should
    be sent in the HTTP header so that we keep with the idea of stateless HTTP requests.
    We will also need to set our server to accept requests from all domains using
    `Access-Control-Allow-Origin: *`. What’s interesting about designating `*` in
    the `ACAO` header is that it does not allow requests to supply credentials like
    HTTP authentication, client-side SSL certificates, or cookies.


    Here’s an infographic to explain the process:


    ![Token Based Authentication](images/10-node-authentication----tokens-new.png)


    Token Based Authentication


    Once we have authenticated with our information and we have our token, we are
    able to do several things with this token.


    We could even create a permission based token and pass this along to a third-party
    application (say a new mobile app we want to use), and they will be able to have
    access to our data — **but only the information that we allowed with that specific
    token**.


    ### The Benefits of Tokens


    #### Stateless and Scalable


    Tokens are stored on client side. Completely stateless, and ready to be scaled.
    Our load balancers are able to pass a user along to any of our servers since there
    is no state or session information anywhere.


    If we were to keep session information for a user that was logged in, this would
    require us to keep sending that user to the same server that logged in at (called
    session affinity).


    This brings problems since, some users would be forced to the same server and
    this could bring about a spot of heavy traffic.


    Not to worry though! Those problems are gone with tokens since the token itself
    holds the data for that user.


    #### Security


    The token, not a cookie, is sent on every request and since there is no cookie
    being sent, this helps to prevent `CSRF` attacks. Even if your specific implementation
    stores the token within a cookie on the client side, the cookie is merely a storage
    mechanism instead of an authentication one. There is no session based information
    to manipulate since we don’t have a session!


    The token also expires after a set amount of time, so you will be required to
    login once again. This helps us stay secure.


    #### Extensibility (Friend of A Friend and Permissions)


    Tokens will allow us to build applications that share permissions with another.
    For example, we have linked random social accounts to our major ones like Facebook
    or Twitter.


    When we login to Twitter through a service (let’s say Buffer), we are allowing
    Buffer to post to our Twitter stream.


    By using tokens, this is how we provide selective permissions to third-party applications.
    We could even build our own API and hand out special permission tokens if our
    users wanted to give access to their data to another application.


    #### Multiple Platforms and Domains


    We talked a bit about `CORS` earlier. When our application and service expands,
    we will need to be providing access to all sorts of devices and applications (since
    our app will most definitely become popular!).

    '
