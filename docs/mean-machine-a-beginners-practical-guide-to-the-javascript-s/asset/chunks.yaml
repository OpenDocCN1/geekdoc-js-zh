  trans: "\n\n[指令（Directives）](https://docs.angularjs.org/guide/directive) 是 Angular\
    \ 内置的，你会频繁使用它们。它们是我们扩展 HTML 模板的方式，告诉 Angular 在何以及何时对我们的视图应用功能。指令会让 Angular 知道某些\
    \ HTML 元素应该绑定到我们定义的 Angular 变量或函数。它们还可以帮助 Angular 操作我们的 DOM。\n\n> jQuery 告诉我们如何抓取并注入\
    \ DOM。Angular 告诉我们如何操作数据，从而改变 DOM。\n\n让我们开始构建应用程序，并在在此过程中讨论更多概念。\n\n## 设置 Angular\
    \ 应用\n\n这个演示目前还没有从我们的 Node API 获取任何动态数据。我们将数据直接硬编码在 Angular 控制器（controllers）中。这将让我们先熟悉\
    \ Angular 的特定功能。\n\n这是我们 Angular 应用的文件结构。请注意，我们不需要像 Node 应用那样的 `package.json`\
    \ 或 `server.js` 文件。这是一个纯的前端应用程序，只包含 HTML/CSS/JS！\n\n* `js/`\n    * `app.js`\n\
    * `index.html`\n\n非常简单！2 个文件就能为我们的第一个 Angular 应用提供所需的一切。\n\n我们希望通过这个应用程序实现的目标是：\n\
    \n1. 设置一个 Angular 前端应用\n2. 将来自 Angular 控制器的数据（消息和列表）显示在视图中\n3. 通过输入框更新消息来展示数据绑定\n\
    \n### 创建你的 Angular 应用 (app.js)\n\n我们将从创建应用程序的主模块（module）开始。进入 `app.js` 文件，看看 Angular\
    \ 模块是如何创建的：\n\n```\n 1 // 命名我们的 angular 应用\n 2 angular.module('firstApp', [])\n\
    \ 3 \n 4 .controller('mainController', function() {\n 5 \n 6     // 将此绑定到 vm (视图模型)\n\
    \ 7     var vm = this;\n 8 \n 9     // 在这里定义变量和对象\n10     // 这允许它们在视图可用\n11 \n\
    12     // 定义一个基础变量\n13     vm.message = 'Hey there! Come and see how good I look!';\n\
    14 \n15     // 定义一个项目列表\n16     vm.computers = [\n17         { name: 'Macbook\
    \ Pro', color: 'Silver', nerdness: 7 },\n18         { name: 'Yoga 2 Pro', color:\
    \ 'Gray', nerdness: 6 },\n19         { name: 'Chromebook', color: 'Black', nerdness:\
    \ 5 }\n20     ];\n21 \n22 }); \n```\n\n你可以看到，Angular 模块只需要声明 `angular.module`。然后我们可以向此模块添加一个控制器。在构建这些应用程序时，我们将尝试每个应用只保留一个功能。这意味着我们不会将控制器和服务混合在同一个模块中。这回到了模块化应用程序的思想。\n\
    \n到目前为止，我们已经：\n\n* 创建了名为 `firstApp` 的主模块\n* 创建了名为 `mainController` 的控制器\n* 控制器中的信息将通过\
    \ `vm` 绑定到自身\n* 创建了一个名为 `message` 的变量\n* 创建了一个名为 `computers` 的项目列表\n\n注意我们如何在\
    \ `vm` 上定义变量和列表的。将父级 `this` 绑定到 `vm` 是一个好习惯。这在引用控制器时很有帮助，因为 `this` 可以在 JavaScript\
    \ 回调中使用。控制器上有有属性，这就是我们能够通过 `controller as` 语法在视图中使用它们。我们很快就会看到它是如何工作的。就是这样！你刚刚创建了你的\
    \ Angular 应用！现在它还没做什么，让我们通过创建 HTML 文件并对其应用此模块来让它变漂亮。\n\n字体 应用 Angular 应用 (index.html)\n\
    \n让我们开始构建基础 HTML 站点。我们将通过 CDN 引入 Bootstrap 和 Angular 以保持简单。这里是 `index.html` 的开头：\n\
    \n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3 <head>\n 4     <meta charset=\"\
    UTF-8\">\n 5     <title>My First Application</title>\n 6 \n 7     <!-- CSS -->\n\
    \ 8     <!-- 加载 bootstrap 和我们的样式表 -->\n 9     <link rel=\"stylesheet\" href=\"\
    http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.css\">\n11     <style>\n\
    12         body { padding-top:50px; }\n13     </style>\n14 \n15     <!-- JS -->\n\
    16     <!-- 加载 angular 和我们的自定义应用 -->\n17     <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"\
    ></script>\n19     <script src=\"js/app.js\"></script>\n20 </head>\n21 <body class=\"\
    container\">\n22 \n23 </body>\n24 </html\n```\n\n`index.html` 文件现在是空壳。我们加载了 Bootstrap，添加了一点用于间距的\
    \ CSS，并加载了 Angular 本身以及自定义的 `app.js`。如果我们现在在浏览器中查看，什么都不会发生，因为我们还没有应用创建的 Angular\
    \ 应用。我们讨论过 Angular 指令，这将是你第一次使用它们。Angular 提供指令将你的应用应用到 HTML 中。这些被称为 `ng-app` 和\
    \ `ng-controller`。让我们在 `<body>` 标签上添加：\n\n```\n 1 <!-- 声明我们的应用 -->\n 2 <body class=\"\
    container\" ng-app=\"firstApp\" ng-controller=\"mainController as main\">\n```\n\
    \n现在我们应用了控制器并将其命名为 `main`。我们讨论过 Angular 指令，这些可以将你的应用应用到 HTML 中。让我们在 `<body>` 标签内添加内容：\n\
    \n```html\n 1 <div class=\"jumbotron\">\n 2 \n 3 <!-- 显示消息 -->\n 4   <h2>This\
    \ is my message:</h2>\n 5   {{ main.message }}\n 6 \n7 </div>\n```\n\n现在我们在浏览器中看到了消息！注意我们是如何在控制器中定义这个变量的。\n\
    \n![消息变量](img/11-angular-start-variable.jpg)\n\n### 消息变量\n\n你刚刚在视图中显示了第一个变量！现在让我们处理列表。这将使用另一个名为\
    \ `ng-repeat` 的 Angular 指令。你将在视图中频繁使用它因为它类似于 `foreach`。\n\n在消息部分下方添加：\n\n```\n\
    \ 1 <!-- 使用 ng-repeat 显示列表 -->\n 2 <h2>This is my list:</h2>\n 3 <table class=\"\
    table-bordered\">\n 4     <thead>\n 5         <tr>\n 6             <td>名称</td>\n\
    \ 7             <td>颜色</td>\n 8             <td>极客程度</td>\n 9         </tr>\n\
    \ 10     </thead>\n 11     <tbody>\n 12         <tr ng-repeat=\"computer in main.computers\"\
    >\n 13             <td>{{ computer.name }}</td>\n 14             <td>{{ computer.color\
    \ }}</td>\n 15             <td>{{ computer.nerdness }}</td>\n 16         </tr>\n\
    \ 17     </tbody>\n 18 </table>\n```\n\n很酷对吧？Angular 将知道要遍历 computers 并在每一项显示在它自己的表格行中。\n\
    \n![显示列表](img/11-angular-start-list.png)\n\n### 显示列表\n\n我们还要为这个演示做最后一件事。这是让我们看到数据绑定生效的魔法部分。\n\
    \n我们将在站点上放置一个输入字段，并使用另一个（发现趋势了吗？）被称为 `ng-model` 的 Angular 指令将输入绑定到变量上。这将立即更改消息。你将亲眼看到变化的发生！让我们在消息部分上方添加输入框：\n\
    \n```\n 1 <!-- 使用 ng-model 更新消息变量的表单 -->\n 2 <div class=\"form-group\">\n 3  \
    \   <label>Message</label>\n 4     <input type=\"text\" class=\"form-control\"\
    \ ng-model=\"main.message\">\n 5 </div>\n```\n\n"
- fmt: "\nNow view the site in your browser and start typing into the input box. The\
    \ `message` variable immediately changes thanks to the magic of Angular and its\
    \ `directives`.\n\n![Show Data Binding](images/11-angular-start----angular-data-binding-example.jpg)\n\
    \nShow Data Binding\n\nHere is a [CodePen](http://codepen.io/sevilayha/full/DhLqk/)\
    \ so that you can see all of this in action quickly. The full code is also available\
    \ in the code repository for this book.\n\n***\n\n![Tip](images/icon-heart.png\
    \ \"Pro Tip\")\n\nTip\n\n### $scope vs. this\n\nIn other Angular tutorials around\
    \ the web, you may have seen `$scope` as a way to bind information from the controller\
    \ to the view. As of Angular 1.3, this method still exists, but it is encouraged\
    \ to use `controller as` syntax.\n\nThere are many benefits to this approach since\
    \ it keeps our code cleaner and more organized. It is even easier to read in our\
    \ views how our controllers are used.\n\nHere are two quick comparisons of `using\
    \ $scope` and `not using $scope`.\n\n```\n1 <!-- with $scope -->\n2 <div ng-app=\"\
    myApp\" ng-controller=\"mainController\">\n3     <p>{{ myVariable }}</p>\n4 </div>\n\
    5 \n6 <!-- without $scope - controller as -->\n7 <div ng-app=\"myApp\" ng-controller=\"\
    mainController as main\">\n8     <p>{{ main.myVariable }}</p>\n9 </div>\n```\n\
    \nThis has many benefits, especially when we start nesting controllers. It will\
    \ be easier to see which variables and functions live within each controller.\n\
    \nThis also has the benefit that it will force you to prepare for the new Angular\
    \ 2.0 syntax, which is expected in about a year. The Angular team has already\
    \ declared that `$scope` will be killed off in favor of a syntax closer to `controller\
    \ as`.\n\nDon’t worry about Angular 2.0 though. If you build your Angular applications\
    \ now using this syntax, migrating to the new version won’t be too painful.\n\n\
    ***\n\n### Creating and Processing a Form\n\nNow let’s move onto something more\
    \ advanced. We will often want a form on our site and Angular makes processing\
    \ forms incredibly easy. Let’s create a form that will add to our list of computers.\n\
    \nThis will be done in two different parts:\n\n1. Create an Angular function to\
    \ handle processing the form and adding to our list\n2. Add the HTML form and\
    \ wire it up to work with the Angular function\n\n#### Angular Function to Process\
    \ a Form\n\nLet’s add this Angular function to our controller.\n\n```\n 1 // name\
    \ our angular app\n 2 angular.module('firstApp', [])\n 3 \n4 .controller('mainController',\
    \ function() {\n 5 \n6     ...\n 7 \n8     // information that comes from our\
    \ form\n 9     vm.computerData = {};\n10 \n11     vm.addComputer = function()\
    \ {\n12         \n13         // add a computer to the list\n14         vm.computers.push({\n\
    15             name: vm.computerData.name,\n16             color: vm.computerData.color,\n\
    17             nerdness: vm.computerData.nerdness\n18         });\n19 \n20   \
    \      // after our computer has been added, clear the form\n21         vm.computerData\
    \ = {};\n22     };\n23 \n24 }); \n```\n\nWe will create an object to hold the\
    \ data of our form called `vm.computerData`. This step isn’t necessary since Angular\
    \ will automatically create it when it is needed, but we’ll define it for clarity.\n\
    \nWe are also creating a function that will take the information out of `vm.computerData`\
    \ and push it into our array of computers. When this is added, it should automatically\
    \ add the computer to our table without the need to refresh the page (almost like\
    \ magic).\n\nAfter the computer has been added to the list, we will clear the\
    \ form by clearing the object that contains the data. In jQuery applications,\
    \ clearing a form could be accomplished with:\n\n`$('input').val('');`\n\nNot\
    \ in Angular! We know all about `data-binding` now and since we clear the object\
    \ on the Angular side of things, which will automatically clear the form on the\
    \ view side.\n\nWith that of the way, let’s create the HTML form and wire it to\
    \ the function we just created.\n\n#### The HTML Form\n\nIn our `index.html` file,\
    \ under the HTML table of computers, add the following form:\n\n```\n 1 <!-- form\
    \ to add computer to the list -->\n 2 <form class=\"form-inline\" ng-submit=\"\
    main.addComputer()\">\n 3     \n 4     <input type=\"text\" class=\"form-control\"\
    \ placeholder=\"Macbook\" ng-model=\"main\\\n 5 .computerData.name\">\n 6    \
    \ <input type=\"text\" class=\"form-control\" placeholder=\"Silver\" ng-model=\"\
    main.\\\n 7 computerData.color\">\n 8     <input type=\"number\" class=\"form-control\"\
    \ placeholder=\"8\" ng-model=\"main.com\\\n 9 puterData.nerdness\">\n10 \n11 \
    \    <button type=\"submit\" class=\"btn btn-success\">Add</button>\n12 </form>\n\
    ```\n\nWe have 3 different inputs here and one submit button. We have used `ng-model`\
    \ to bind each input to a specific field in the `computerData` object we created\
    \ in our Angular controller.\n\nThe new Angular directive we see here is `ng-submit`.\
    \ This is used on forms and tells Angular what to do when the form is submitted.\
    \ Here is our form:\n\n![HTML Form](images/11-angular-start----angular-data-binding-example.jpg)\n\
    \nGo ahead and fill in some data and click Add. Watch as your table is automatically\
    \ updated and the new computer is added immediately without a page refresh (Wait,\
    \ I mean!)\n\n### Conclusion\n\nThis chapter introduced you to quite a few Angular\
    \ concepts all at once. They are all tools to help you build amazing applications.\
    \ Data-binding, dependency injection, and directives are the foundation of Angular\
    \ and you’ll use them in every app you build.\n\nNext up, we’ll explore routing\
    \ our applications so that we have fully featured sites.\n\n# Routing Angular\
    \ Applications\n\nWe’ll demonstrate Angular routing with a brand new app. It will\
    \ be good to create a few apps from scratch so that the process becomes familiar.\n\
    \nBefore we start that new application, however, let’s talk about the different\
    \ routing techniques. There are two main modules providing routing features: [ngRoute](https://docs.angularjs.org/api/ngRoute)\
    \ and [AngularUI Router](https://github.com/angular-ui/ui-router).\n\n### ngRoute\n\
    \n[ngRoute](https://docs.angularjs.org/api/ngRoute) is the module that is the\
    \ standard when building out routing in Angular applications. It is supported\
    \ by Angular and provides routing through a service called `$route` (we’ll show\
    \ off how this works later).\n\nThis routing module allows us to create **single\
    \ page applications and websites** that feel like the rich websites and mobile\
    \ applications that users are growing more and accustomed to. Think Gmail, Facebook,\
    \ Twitter, and some of the great mobile newsreaders like Feedly or Flipboard.\n\
    \nSingle page apps are becoming increasingly popular. Sites that mimic the single\
    \ page app behavior are able to provide the feel of a phone/tablet application.\
    \ Angular helps to create applications like this easily.\n\n### Node Server for\
    \ Our Routing Application\n\nIn order for us to use ngRoute, we will want to use\
    \ a server so that we can mimic how this app will work in browser. We’re going\
    \ to spin up a server because, as you’ll see, we can’t just open files locally.\
    \ Our Angular app will need to make requests for view files and we will run into\
    \ issues without a server.\n\nLet’s create that server using Node and Express.\
    \ This will be a good example because this will be our first glimpse of how we\
    \ can build our Node and Angular applications together in the same codebase. Remember,\
    \ we will be sticking to the client-server model, so we will need to maintain\
    \ a good separation of our backend and frontend code.\n"
  raw: "Now view the site in your browser and start typing into the input box. The\
    \ message variable immediately changes thanks to the magic of Angular and its\
    \ **directives**.\n\n![Show Data Binding](images/11-angular-start----angular-data-binding-example.jpg)\n\
    \nShow Data Binding\n\nHere is a [CodePen](http://codepen.io/sevilayha/full/DhLqk/)\
    \ so that you can see all of this in action quickly. The full code is also available\
    \ in the code repository for this book.\n\n* * *\n\n![Tip](images/icon-heart.png\
    \ \"Pro Tip\")\n\nTip\n\n#### $scope vs. this\n\nIn other Angular tutorials around\
    \ the web, you may have seen `$scope` as a way to bind information from the controller\
    \ to the view. As of Angular 1.3, this method still exists, but it is encouraged\
    \ to use **controller as** syntax.\n\nThere are many benefits to this approach\
    \ since it keeps our code cleaner and more organized. It is even easier to read\
    \ in our views how our controllers are used.\n\nHere are two quick comparisons\
    \ of *using $scope* and *not using $scope*.\n\n```\n1 <!-- with $scope -->\n2\
    \ <div ng-app=\"myApp\" ng-controller=\"mainController\">\n3     <p>{{ myVariable\
    \ }}</p>\n4 </div>\n5 \n6 <!-- without $scope - controller as -->\n7 <div ng-app=\"\
    myApp\" ng-controller=\"mainController as main\">\n8     <p>{{ main.myVariable\
    \ }}</p>\n9 </div>\n```\n\nThis has many benefits, especially when we start nesting\
    \ controllers. It will be easier to see which variables and functions live within\
    \ each controller.\n\nThis also has the benefit that it will force you to prepare\
    \ for the new Angular 2.0 syntax, which is expected in about a year. The Angular\
    \ team has already declared that `$scope` will be killed off in favor of a syntax\
    \ closer to `controller as`.\n\nDon’t worry about Angular 2.0 though. If you build\
    \ your Angular applications now using this syntax, migrating to the new version\
    \ won’t be too painful.\n\n* * *\n\n### Creating and Processing a Form\n\nNow\
    \ let’s move onto something more advanced. We will often want a form on our site\
    \ and Angular makes processing forms incredibly easy. Let’s create a form that\
    \ will add to our list of computers.\n\nThis will be done in two different parts:\n\
    \n1.  Create an Angular function to handle processing the form and adding to our\
    \ list\n\n2.  Add the HTML form and wire it up to work with the Angular function\n\
    \n#### Angular Function to Process a Form\n\nLet’s add this Angular function to\
    \ our controller.\n\n```\n 1 // name our angular app\n 2 angular.module('firstApp',\
    \ [])\n 3 \n 4 .controller('mainController', function() {\n 5 \n 6     ...\n 7\
    \ \n 8     // information that comes from our form\n 9     vm.computerData = {};\n\
    10 \n11     vm.addComputer = function() {\n12         \n13         // add a computer\
    \ to the list\n14         vm.computers.push({\n15             name: vm.computerData.name,\n\
    16             color: vm.computerData.color,\n17             nerdness: vm.computerData.nerdness\n\
    18         });\n19 \n20         // after our computer has been added, clear the\
    \ form\n21         vm.computerData = {};\n22     };\n23 \n24 }); \n```\n\nWe will\
    \ create an object to hold the data of our form called `vm.computerData`. This\
    \ step isn’t necessary since Angular will automatically create it when it is needed,\
    \ but we’ll define it for clarity.\n\nWe are also creating a function that will\
    \ take the information out of `vm.computerData` and push it into our array of\
    \ computers. When this is added, it should automatically add the computer to our\
    \ table without the need to refresh the page (almost like magic).\n\nAfter the\
    \ computer has been added to the list, we will clear the form by clearing the\
    \ object that contains the data. In jQuery applications, clearing a form could\
    \ be accomplished with:\n\n`$('input').val('');`\n\nNot in Angular! We know all\
    \ about **data-binding** now and since we clear the object on the Angular side\
    \ of things, which will automatically clear the form on the view side.\n\nWith\
    \ that out of the way, let’s create the HTML form and wire it to the function\
    \ we just created.\n\n#### The HTML Form\n\nIn our `index.html` file, under the\
    \ HTML table of computers, add the following form:\n\n```\n 1 <!-- form to add\
    \ computer to the list -->\n 2 <form class=\"form-inline\" ng-submit=\"main.addComputer()\"\
    >\n 3     \n 4     <input type=\"text\" class=\"form-control\" placeholder=\"\
    Macbook\" ng-model=\"main\\\n 5 .computerData.name\">\n 6     <input type=\"text\"\
    \ class=\"form-control\" placeholder=\"Silver\" ng-model=\"main.\\\n 7 computerData.color\"\
    >\n 8     <input type=\"number\" class=\"form-control\" placeholder=\"8\" ng-model=\"\
    main.com\\\n 9 puterData.nerdness\">\n10 \n11     <button type=\"submit\" class=\"\
    btn btn-success\">Add</button>\n12 </form>\n```\n\nWe have 3 different inputs\
    \ here and one submit button. We have used `ng-model` to bind each input to a\
    \ specific field in the `computerData` object we created in our Angular controller.\n\
    \nThe new Angular directive we see here is `ng-submit`. This is used on forms\
    \ and tells Angular what to do when the form is submitted. We are telling Angular\
    \ to submit the form and use the function called `addComputer()` that we created\
    \ in our controller.\n\nHere is our form:\n\n![HTML Form](images/11-angular-start----angular-form-show.jpg)\n\
    \nHTML Form\n\nGo ahead and fill in some data and click **Add**. Watch as your\
    \ table is automatically updated and the new computer is added immediately without\
    \ a page refresh!\n\n![Computer Created](images/11-angular-start----angular-form-created.jpg)\n\
    \nComputer Created\n\n### Conclusion\n\nThis chapter introduced you to quite a\
    \ few Angular concepts all at once. They are all tools to help you build out amazing\
    \ applications and we’ll be expanding on these even further in more advanced implementations.\
    \ Data-binding, dependency injection, and directives are the foundation of Angular\
    \ applications and you’ll use them all in every app you build.\n\nNext up, we’ll\
    \ explore routing our Angular applications so that we have more fully featured\
    \ sites/applications with multiple pages.\n\n# Routing Angular Applications\n\n\
    We’ll demonstrate Angular routing with a brand new Angular app/site. It will be\
    \ good to create a few apps from scratch so that the process becomes familiar.\n\
    \nBefore we start that new application, however, let’s talk about the different\
    \ routing techniques Angular has. There are two main modules for providing routing\
    \ features: [ngRoute](https://docs.angularjs.org/api/ngRoute) and [AngularUI Router](https://github.com/angular-ui/ui-router).\n\
    \n### ngRoute\n\n[ngRoute](https://docs.angularjs.org/api/ngRoute) is the module\
    \ that is the standard when building out routing in Angular applications. It is\
    \ supported by Angular and provides routing through a service called `$route`\
    \ (we’ll show off how this works later in this chapter).\n\nThis routing module\
    \ allows us to create **single page applications and websites** that feel like\
    \ the rich websites and mobile applications that users are growing more and more\
    \ accustomed to. Think Gmail, Facebook, Twitter, and some of the great mobile\
    \ newsreaders like Feedly or Flipboard.\n\nSingle page apps are becoming increasingly\
    \ popular. Sites that mimic the single page app behavior are able to provide the\
    \ feel of a phone/tablet application. Angular helps to create applications like\
    \ this easily. Let’s dive into how we can create a 3 page application using Angular.\n\
    \n### Node Server for Our Routing Application\n\nIn order for us to use ngRoute,\
    \ we will want to use a server so that we can mimic how this app will work in\
    \ browser. We’re going to spin up a server because, as you’ll see, we can’t just\
    \ open files locally anymore. Our Angular app will need to make requests for view\
    \ files and we will run into issues without a server.\n\nLet’s create that server\
    \ using Node and Express. This will be a good example because this will be our\
    \ first glimpse of how we can build our Node and Angular applications together\
    \ in the same codebase. Remember, we will be sticking to the client-server model,\
    \ so we will need to maintain a good separation of our backend and frontend code.\n\
    \nHere is the file structure for our application:"
