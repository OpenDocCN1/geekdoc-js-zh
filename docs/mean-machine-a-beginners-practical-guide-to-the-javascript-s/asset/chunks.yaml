  trans: "\n\n与任何语言或语言集一样，有很多场景下 `MEAN` 并不是最佳选择，在深入编码之前识别这一点至关重要。`MEAN` 栈的许多优势以及你使用它的原因根源于它对\
    \ `Node` 的使用。在某些你可能不想使用它的原因上，我们也再次看到了这种趋势。\n\n`Node` 通常不是处理 CPU 密集型任务的最优选型。尽管有一些[观点](http://neilk.net/blog/2013/04/30/why-you-should-use-nodejs-for-CPU-bound-tasks/)\
    \ 认为 `Node` 在计算密集型应用中实际上表现良好，但对于初学者来说，如果你知道你的应用程序需要大量的计算，最好是避开 `Node`（换句话说，我们不要在这里尝试去计算第\
    \ 1000 个质数）。\n\n## 谁在用 MEAN？\n\n许多开发者对 `MEAN` 栈赞誉有加。该技术栈在每项操作中都使用 JavaScript，这对于希望在项目中顺畅流转思路的开发者来说非常有吸引力。一些大型公司已经从中受益，并将\
    \ `Node` 集成到他们的许多业务中。\n\n![Walmart](img/walmart.jpg \"Walmart\")\n\n沃尔玛\n\n> **Walmart**:\
    \ 沃尔玛从 2012 年开始使用 `Node.js` 为移动用户提供现代的前端体验。通过利用 JavaScript 平台，他们能够快速地将现有的 API\
    \ 集成到他们的 `Node` 应用中。他们还提到，黑色星期五 53% 的在线流量流向他们的 `Node` 服务器，且实现了零停机。\n\n![Yahoo](img/yahoo.jpg\
    \ \"Yahoo\")\n\n雅虎\n\n> **Yahoo!**: 雅虎从 2010 年就开始尝试使用 `Node`。起初他们只是用它处理文件上传等小任务，而现在他们使用\
    \ `Node` 每分钟处理近 200 万次请求。他们注意到速度的提升和开发流程的简化。\n\n![Linkedin](img/linkedin.jpg \"\
    Linkedin\")\n\nLinkedIn\n\n> **LinkedIn**: LinkedIn 开始完全使用 `Node` 开发其移动端应用程序的服务器端。他们之前使用的是\
    \ `Ruby`，但自从切换以来，他们看到了性能的巨大提升，速度快了 2 到 10 倍。\n\n![Paypal](img/paypal.png \"Paypal\"\
    )\n\nPayPal\n\n> **PayPal**: PayPal 最近也加入了进来，并开始将部分 `Java` 代码迁移到 `Node`。他们最初只对账户概览页面进行实验，但一旦看到速度提升了\
    \ 35%，且开发时间减少了一半，他们就开始将所有网站迁移到 `Node.js`。\n\n如需更大且持续维护的列表，请访问 [Node Industry](http://nodejs.org/industry/)\
    \ 页面。\n\n## 入门指南\n\n让我们快速查看一下我们将使用的技术。记住，本书旨在教你所有这些组件是如何协同工作的，因此我们不会深入探讨每个领域最先进的技术和概念（尽管我们会讲得很深入）。我们将为每个章节中的每个主题提供更多资源链接，以丰富你的知识。\n\
    \n### MongoDB\n\n`MongoDB` 命名自“hu**mongo**us”（巨大的）一词，是一种以 JSON 格式存储文档的开源 NoSQL\
    \ 数据库。根据 Google 搜索、职位发布和招聘网站（Indeed.com）的趋势，它是[领先的 NoSQL 数据库](http://www.mongodb.com/leading-nosql-database)。\n\
    \n### Mongo vs. MYSQL\n\n使用 `MYSQL` 的 LAMP 栈多年来一直是领先的技术栈。`MYSQL` 被归类为**关系型数据库**。\n\
    \n> **关系型数据库** 数据存储在表中，表中不仅包含数据，还包含数据与数据库中其他信息之间的关系。 —\n\n### 文档数据库\n\n另一方面，`MongoDB`\
    \ 被归类为非关系型数据库，更具体地说是**文档型数据库**。这意味着你可以按照自己的意愿定义数据结构。你可以获得数据建模选项，以匹配你的应用程序及其性能需求。你可以轻松地使用\
    \ JSON、`XML`、`BSON` 或许多其他更适合你应用程序的格式将复杂对象插入到数据库中。如果出现用例需要，你甚至可以在某些文档数据库中存储 PDF\
    \ 文档。\n\n> **文档型数据库** 一种 NoSQL 数据库，它以半结构化文档的形式存储和检索数据（与关系型数据库中的表相反）。 —\n\n`MongoDB`\
    \ 中的数据建模极其灵活。存储数据的一种方法是创建单独的文档并创建引用来连接信息。你可以看到下面，我们的“精灵信息文档”（Elf Info Document）包含了基本信息，我们可以通过“精灵地址文档”（Elf\
    \ Address Document）来引用它。\n\n**精灵信息** `json { id: \"1234\", name: \"holly\", age:\
    \ \"400\", type: \"high-elf\" }`\n\n**精灵地址簿** `json { elven_id: \"1234\", city:\
    \ \"rivendell\", state: \"middle-earth\" }`\n\n另一种方法是将精灵地址直接嵌入到精灵信息文档中，这样每个精灵就只有一个文档，这允许在更新精灵信息时进行更少的写操作，并获得更高的性能（假设你的文档不会增长得太大）。\n\
    \n```\n 1 {\n 2   id: \"1234\",\n 3   name: \"holly\",\n 4   age: \"400\",\n 5\
    \   type: \"high-elf\",\n 6   address: {\n 7     city: \"rivendell\",\n 8    \
    \ state: \"middle-earth\",\n 9   }\n10 }\n```\n\n一旦你开始存储关于多个精灵的信息，它们的文档就可以归类为一个精灵信息集合（Elf\
    \ Info Collection）。集合就是一组相关的文档。在这种情况下，它们将具有相同的字段。\n\n### CAP 定理\n\n有一个被称为 `CAP`\
    \ 的概念，也称为布鲁定理，它指出网络系统只能同时提供以下功能的两种：\n\n- 一致性（Consistency）：应用程序中的所有节点都可用并同时显示相同的数据\n\
    - 可用性（Availability）：所有节点都可读可写\n- 分区容错（Partition Tolerance）：即使系统部分故障，你的应用程序也能继续运行\n\
    \n关于如何解释这一观点存在一些困惑，因此布鲁后来指出这实际上归结为**一致性**与**可用性**之间的权衡。仅仅看定义就能明显看出这些概念是互斥的。假设我们允许所有节点随时对读写都是**可用**的。银行应用程序是一个需要这种重要性的真实世界例子。为了方便起见，让我们假设透支费等这些趣事并不存在。银行需要随时知道你的准确账户余额。如果你账户里有\
    \ 100 元，你取了 100 元，那么你自然剩下了 0 元。由于所有节点都可读可写，在账户余额仍显示为 100 元的极短时间范围内，另一笔扣款可能会通过。因此，一旦账户余额更新，你的账户实际上会变成负数，因为第二笔扣款被允许通过了，尽管它本应被拒绝。这就是为什么在银行应用程序的案例中，**一致性**更为重要。\n\
    \n一致性的代价是放弃一些可用性。在上述的例子中，一旦你取了钱，就应该加上某些锁定，防止账户余额被读取为 100 元。如果你的应用程序无法每秒读取每个节点，那么它对某些用户来说可能是宕机或不可用的。某些应用程序相比一致性更看重可用性和性能，这就是许多文档型数据库大放异彩的地方。\n\
    \n"
- fmt: "\nMongoDB, by default, favors consistency over availability, but still allows\
    \ you to tweak some settings to give you more support in either direction. Read-write\
    \ locks are scoped to each database, so each node within a database will always\
    \ see the most up-to-date data. Because MongoDB supports `sharding`, once your\
    \ database begins to grow, your data may partition into multiple databases (or\
    \ `shards`) across several servers. Each shard will be an independent database,\
    \ together forming one collection of databases. This allows for faster queries\
    \ because you only need to access the shard that contains that information rather\
    \ than the entire database. It can also, however, cause inconsistency from shard\
    \ to shard for a short period of time after a write. This is called eventual consistency\
    \ and is a common compromise between consistency and availability.\n\n## Main\
    \ Features\n\n*   Agile and Scalable\n*   [Document-Oriented Storage](http://docs.mongodb.org/manual/core/data-modeling/)\
    \ - JSON-style documents with dynamic schemas offer simplicity and power.\n* \
    \  [Full Index Support](http://docs.mongodb.org/manual/indexes/) - Index on any\
    \ attribute, just like you’re used to.\n*   [Replication & High Availability](http://docs.mongodb.org/manual/replication/)\
    \ - Mirror across LANs and WANs for scale and peace of mind.\n*   [Auto-Sharding](http://docs.mongodb.org/manual/sharding/)\
    \ - Scale horizontally without compromising functionality.\n*   [Querying](http://docs.mongodb.org/manual/applications/read/)\
    \ - Rich, document-based queries.\n*   [Fast In-Place Updates](http://docs.mongodb.org/manual/applications/update/)\
    \ - Atomic modifiers for contention-free performance.\n*   [Map/Reduce](http://docs.mongodb.org/manual/applications/map-reduce/)\
    \ - Flexible aggregation and data processing.\n*   [GridFS](http://docs.mongodb.org/manual/applications/gridfs/)\
    \ - Store files of any size without complicating your stack.\n\n## Node.js\n\n\
    Node is built on Google Chrome’s V8 JavaScript runtime and sits as the server-side\
    \ platform in your MEAN application. So what does that mean? In a LAMP stack you\
    \ have your web server (`Apache`, `Nginx`, etc.) running with the server-side\
    \ scripting language (`PHP`, `Perl`, `Python`) to create a dynamic website. The\
    \ server-side code is used to create the application environment by extracting\
    \ data from the database (`MYSQL`) and is then interpreted by the web server to\
    \ produce the web page.\n\nWhen a new connection is requested, `Apache` creates\
    \ a new thread or process to handle that request, which makes it `multithreaded`.\
    \ Often you will have a number of idle child processes standing by waiting to\
    \ be assigned to a new request. If you configure your server to only have 50 idle\
    \ processes and 100 requests come in, some users may experience a connection timeout\
    \ until some of those processes are freed up. Of course there are several ways\
    \ to handle this scalability more efficiently, but in general `Apache` will use\
    \ one thread per request, so to support more and more users you will eventually\
    \ need more and more servers.\n\n> **Multithreading** A programming model where\
    \ the flow of the program has multiple threads of control. Different parts of\
    \ the program (threads) will be able to execute simultaneously and independently,\
    \ rather than waiting for each event to finish. This is nice for the user who\
    \ now doesn’t have to.\n\n> **Multithreading** A programming model where the flow\
    \ of the program has multiple threads of control. Different parts of the program\
    \ (threads) will be able to execute simultaneously and independently, rather than\
