    \ Let’s add the following to our `<body>` tag:\n\n```\n 1 <!-- declare our angular\
    \ application and angular controller -->\n 2 <body class=\"container\" ng-app=\"\
    firstApp\" ng-controller=\"mainController as main\">\n```\n\nWe are using the\
    \ `controller as` syntax and naming this controller `main`. We can now call variables\
    \ and functions from our controller by prefixing with the word `main`.\n\nNow\
    \ we have our application applied to the body of our HTML. You can also place\
    \ controllers to specific sections of your site so that you have a controller\
    \ for let’s say sidebar and a controller for the main content. This even further\
    \ compartmentalizes your site, but for this example, we’ll just apply one controller\
    \ to everything.\n\nLet’s do the next easiest step and display the message variable\
    \ we created earlier.\n\nAdd the following inside your `<body>` tag:\n\n```\n\
    \ 1 <div class=\"jumbotron\">\n 2 \n 3   <!-- display the message -->\n 4   <h2>This\
    \ is my message:</h2>\n 5   {{ main.message }}\n 6 \n 7 </div>\n```\n\nNow we\
    \ can see the message in our browser! Notice how we defined this variable on the\
    \ `main` keyword. Angular uses the curly brackets `{{ }}` to display items to\
    \ the view and will look for variables and functions that were defined in our\
    \ controller.\n\n![Show Message Variable](images/11-angular-start-angular-variable-display.jpg)\n\
    \n### Message Variable\n\nYou just displayed your first variable to your view!\
    \ Now let’s handle the list of computers. This will use another Angular directive\
    \ called `ng-repeat`. You’ll be using this a lot in your views since it acts as\
    \ a `foreach` for showing off data.\n\nAdd the following below the message section:\n\
    \n```\n 1 <!-- display the list using ng-repeat -->\n 2 <h2>This is my list:</h2>\n\
    \ 3 <table class=\"table table-bordered\">\n 4     <thead>\n 5         <tr>\n\
    \ 6             <td>Name</td>\n 7             <td>Color</td>\n 8             <td>Nerd\
    \ Level</td>\n 9         </tr>\n10     </thead>\n11     <tbody>\n12         <tr\
    \ ng-repeat=\"computer in main.computers\">\n13             <td>{{ computer.name\
    \ }}</td>\n14             <td>{{ computer.color }}</td>\n15             <td>{{\
    \ computer.nerdness }}</td>\n16         </tr>\n17     </tbody>\n18 </table>\n\
    ```\n\nPretty neat right? Angular will know to loop over the computers and display\
    \ each in its own table row.\n\n![Show List](images/11-angular-start-angular-list-display.png)\n\
    \n### Show List\n\nWe’ll do one more thing for this demo. This is the magic part\
    \ where we get to see data-binding in action.\n\nWe’ll place an input field on\
    \ this site and use another Angular directive (see the trend?) called `ng-model`\
    \ to bind an input to a variable. This will immediately change the message. You’ll\
    \ see the change happen right before your eyes! Let’s add the input box above\
    \ the message section:\n\n```\n 1 <!-- form to update the message variable using\
    \ ng-model -->\n 2 <div class=\"form-group\">\n 3     <label>Message</label>\n\
    \ 4     <input type=\"text\" class=\"form-control\" ng-model=\"main.message\"\
    >\n 5 </div>\n```\n"
  raw: "[Directives](https://docs.angularjs.org/guide/directive) are built into Angular\
    \ and you’ll be dealing with them a ton. They are how we extend our HTML templates\
    \ to tell Angular where and when to apply features to our views. Directives will\
    \ let Angular know that certain HTML elements should be data-bound to Angular\
    \ variables or functions we define. They can also help Angular manipulate our\
    \ DOM.\n\n> jQuery teaches us to grab and inject into the DOM. Angular teaches\
    \ us to manipulate data, which in turn, changes the DOM.\n\nLet’s get to building\
    \ out the application and talk more about concepts as we go along.\n\n### Setting\
    \ Up An Angular Application\n\nThis demo won’t have any dynamic data from our\
    \ Node API just yet. We’ll be hard-coding our data right into our Angular controllers.\
    \ This will let us get a feel for Angular specific features first.\n\nHere is\
    \ the file structure for our Angular application. Notice that we won’t need any\
    \ `package.json` or `server.js` file like our Node applications. This is a purely\
    \ front-end application with just HTML/CSS/JS!\n\n*   js/\n\n    *   app.js\n\n\
    *   index.html\n\nSuper simple stuff! 2 files will get us everything we need for\
    \ our first Angular application.\n\nThe things we are looking to accomplish with\
    \ this application are:\n\n1.  setup an Angular frontend application\n\n2.  display\
    \ data (message and a list) from our Angular controller to the view\n\n3.  show\
    \ off data-binding by updating the message using an input box\n\n#### Creating\
    \ Your Angular App (app.js)\n\nWe will start by creating the main module for our\
    \ application. Let’s go into that `app.js` file and see how Angular modules are\
    \ made:\n\n```\n 1 // name our angular app\n 2 angular.module('firstApp', [])\n\
    \ 3 \n 4 .controller('mainController', function() {\n 5 \n 6     // bind this\
    \ to vm (view-model)\n 7     var vm = this;\n 8 \n 9     // define variables and\
    \ objects on this\n10     // this lets them be available to our views\n11 \n12\
    \     // define a basic variable\n13     vm.message = 'Hey there! Come and see\
    \ how good I look!';\n14 \n15     // define a list of items\n16     vm.computers\
    \ = [\n17         { name: 'Macbook Pro', color: 'Silver', nerdness: 7 },\n18 \
    \        { name: 'Yoga 2 Pro', color: 'Gray', nerdness: 6 },\n19         { name:\
    \ 'Chromebook', color: 'Black', nerdness: 5 }\n20     ];\n21 \n22 }); \n```\n\n\
    You can see that the only thing necessary for an Angular module is to declare\
    \ `angular.module`. We can then add a controller onto this module. When building\
    \ out these applications, we’ll try to keep one feature on each application. This\
    \ means we won’t be mixing controllers and services onto the same module. This\
    \ goes back to the idea of having a compartmentalized application.\n\nSo far we\
    \ have:\n\n*   created our main module called **firstApp**\n\n*   created a controller\
    \ called **mainController**\n\n*   information in this controller will be bound\
    \ to itself using `vm`\n\n*   created a variable called **message**\n\n*   created\
    \ a list of items called **computers**\n\nNotice how we defined the variable and\
    \ our list on the `vm` variable. It is a good practice to bind the parent `this`\
    \ in the controller to `vm`. This helps when referencing the controller since\
    \ the word `this` can be used within JavaScript callbacks like `success()`.\n\n\
    Controllers have properties defined on them and this is how we will be able to\
    \ use them in our views with the **controller as** syntax. We’ll soon see exactly\
    \ how this works.\n\nThat’s it! You just made your first Angular app! Now it doesn’t\
    \ do much so let’s give it a pretty look by making our HTML file and applying\
    \ this module to it.\n\n#### Applying the Angular App (index.html)\n\nLet’s start\
    \ our basic HTML site. We’ll bring in Bootstrap and Angular via a CDN to keep\
    \ things simple. Here’s the very beginnings of our `index.html` file:\n\n```\n\
    \ 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3 <head>\n 4     <meta charset=\"\
    UTF-8\">\n 5     <title>My First Angular Application!</title>\n 6 \n 7     <!--\
    \ CSS -->\n 8     <!-- load bootstrap and our stylesheet -->\n 9     <link rel=\"\
    stylesheet\" href=\"http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/\\\n10 css/bootstrap.min.css\"\
    >\n11     <style>\n12         body { padding-top:50px; }\n13     </style>\n14\
    \ \n15     <!-- JS -->\n16     <!-- load angular and our custom application -->\n\
    17     <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.mi\\\
    \n18 n.js\"></script>\n19     <script src=\"js/app.js\"></script>\n20 </head>\n\
    21 <body class=\"container\">\n22     \n23 </body>\n24 </html>\n```\n\nThis `index.html`\
    \ file is barebones right now. We have loaded Bootstrap, adding a little CSS for\
    \ spacing, and loaded Angular itself and our custom `app.js`. Nothing will happen\
    \ if we view this in our browser yet since we haven’t applied our Angular app\
    \ that we made to this view.\n\nWe talked about **Angular directives** earlier\
    \ and this will be your first use of them. Angular provides directives to apply\
    \ your application to your HTML. These are called `ng-app` and `ng-controller`.\
    \ Let’s add the following to our `<body>` tag:\n\n```\n1 <!-- declare our angular\
    \ application and angular controller -->\n2 <body class=\"container\" ng-app=\"\
    firstApp\" ng-controller=\"mainController as main\">\n```\n\nWe are using the\
    \ **controller as** syntax and naming this controller `as main`. We can now call\
    \ variables and functions from our controller by prefixing with the word `main`.\n\
    \nNow we have our application applied to the body of our HTML. You can also place\
    \ controllers to specific sections of your site so that you have a controller\
    \ for let’s say a sidebar and a controller for the main content. This even further\
    \ compartmentalizes your site, but for this example, we’ll just apply one controller\
    \ to everything.\n\nLet’s do the next easiest step and display the message variable\
    \ we created earlier.\n\nAdd the following inside of your `<body>` tag:\n\n```\n\
    1 <div class=\"jumbotron\">\n2 \n3   <!-- display the message -->\n4   <h2>This\
    \ is my message:</h2>\n5   {{ main.message }}\n6 \n7 </div>\n```\n\nNow we can\
    \ see the message in our browser! Notice how we defined this variable on the `main`\
    \ keyword. Angular uses the curly brackets (`{{ }}`) to display items to the view\
    \ and will look for variables and functions that were defined in our controller.\n\
    \n![Show Message Variable](images/11-angular-start----angular-variable-display.jpg)\n\
    \nShow Message Variable\n\nYou just displayed your first variable to your view!\
    \ Now let’s handle the list of computers. This will use another Angular directive\
    \ called **ng-repeat**. You’ll be using this a lot in your views since it acts\
    \ as a foreach for showing off data.\n\nAdd the following below the message section:\n\
    \n```\n 1 <!-- display the list using ng-repeat -->\n 2 <h2>This is my list:</h2>\n\
    \ 3 <table class=\"table table-bordered\">\n 4     <thead>\n 5         <tr>\n\
    \ 6             <td>Name</td>\n 7             <td>Color</td>\n 8             <td>Nerd\
    \ Level</td>\n 9         </tr>\n10     </thead>\n11     <tbody>\n12         <tr\
    \ ng-repeat=\"computer in main.computers\">\n13             <td>{{ computer.name\
    \ }}</td>\n14             <td>{{ computer.color }}</td>\n15             <td>{{\
    \ computer.nerdness }}</td>\n16         </tr>\n17     </tbody>\n18 </table>\n\
    ```\n\nPretty neat right? Angular will know to loop over the computers and display\
    \ each in its own table row.\n\n![Show List](images/11-angular-start----angular-list-display.png)\n\
    \nShow List\n\nWe’ll do one more thing for this demo. This is the magic part where\
    \ we get to see **data-binding** in action.\n\nWe’ll place an input field on this\
    \ site and use yet another Angular directive (see the trend?) called **ng-model**\
    \ to bind an input to a variable. This will immediately change the message. You’ll\
    \ see the change happen right before your eyes! Let’s add the input box above\
    \ the message section:\n\n```\n1 <!-- form to update the message variable using\
    \ ng-model -->\n2 <div class=\"form-group\">\n3     <label>Message</label>\n4\
    \     <input type=\"text\" class=\"form-control\" ng-model=\"main.message\">\n\
    5 </div>\n```"
