  trans: "\n## 2. **第 4-9 章：服务器/后端** 概念、应用与最佳实践。\n## 3. **第 10-16 章：客户端/前端** 概念、应用与最佳实践。\n\
    ## 4. **第 17-19 章：MEAN Stack 应用** 将一切整合在一起，以便我们构建出色的应用程序。\n## 5. **第 20 章至无限：更多示例应用程序！**\n\
    \n## 入门与安装\n\n### 要求\n* [Node](http://nodejs.org)\n* `npm` - 包含在 Node 安装中\n\n\
    ### 工具\n* Sublime Text\n* Terminal - 我们喜欢使用 [iterm2](http://iterm2.com/) (mac/linux\
    \ 用户)\n* [Git Bash + ConEmu](http://scotch.io/bar-talk/get-a-functional-and-sleek-console-in-windows)\
    \ (windows 用户)\n* [Postman](https://chrome.google.com/webstore/detail/postman-rest-client/fdmmgilgnpjigdojojpjoooidkmcom?hl=en)\
    \ (Chrome)\n* [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
    \ (Firefox)\n\n### 安装\n请访问 [node 官网](http://nodejs.org) 并下载 Node。运行安装程序，你就会安装好\
    \ Node 和 `npm`！这可能是全书中最简单的一部分。\n\n![Node Installation](img/04-getting-started----node-install.jpg\
    \ \"Node Installation\")\n\nNode 安装\n\n让我们双重检查一切运行正常，进入控制台并输入以下：`node -v` 和 `npm\
    \ -v`。\n\n```\n1 node -v\n```\n\n![Node Version](img/04-getting-started----node-version.jpg\
    \ \"Node Version Check\")\nNode Version\n\n```\n1 npm -v\n```\n\n![NPM Version](img/04-getting-started----npm-version.jpg\
    \ \"NPM Version Check\")\nNPM Version\n\n如果你在执行其中任一个命令时遇到了可怕的“command not found”（未找到命令），请确保\
    \ node 已添加到你的 `PATH` 中。这会为命令行提供 `node` 和 `npm` 命令。只需搜索 `npm` 的安装位置，打开环境变量窗口，并添加\
    \ `npm` 的路径。重启电脑，让魔法开始。\n\n有关更详细的故障排除说明，请参见以下：\n**Windows**: [将 Node 添加到你的 Windows\
    \ PATH](http://stackoverflow.com/a/8768567/2976743)\n**Mac**: [将 Node 添加到你的 Mac\
    \ PATH](http://architectryan.com/2012/10/02/add-to-the-path-on-mac-os-x-mountain-lion/#.U_wCiFNdWqc)\n\
    \n如果你仍然遇到问题，请随时联系我们并提出你的问题。现在安装已经完成，让我们继续前进并开始构建东西吧！我们将从 MEAN Stack 应用的基础——Node\
    \ 开始！\n\n## 启动 Node\n让我们看看如何开始构建我们的 Node 应用程序。我们将介绍**基础 Node 配置**、**安装 npm 包**以及**创建一个简单的应用**。\n\
    \n### 配置 (package.json)\nNode 应用程序在名为 `package.json` 的文件中进行配置。你为你创建的每个项目都需要一个\
    \ `package.json` 文件。\n该文件是你配置项目名称、版本、存储库、作者以及所有重要的依赖项的地方。\n\n这是一个示例 `package.json`\
    \ 文件：\n\n```\n 1 {\n 2   \"name\": \"mean-machine-code\",\n 3   \"version\": \"\
    1.0.0\",\n 4   \"description\": \"The code repository for the book, MEAN Machine.\"\
    ,\n 5   \"main\": \"server.js\",\n 6   \"repository\": {\n 7     \"type\": \"\
    git\",\n 8     \"url\": \"https://github.com/scotch-io/mean-machine\"\n 9   },\n\
    \ 10   \"dependencies\": {\n 11     \"express\": \"latest\",\n 12     \"mongoose\"\
    : \"latest\"\n 13   },\n 14   \"author\": \"Chris Seville & Holly Lloyd\",\n 15\
    \   \"license\": \"MIT\",\n 16   \"homepage\": \"https://github.com/scotch-io/mean-machine\"\
    \n 17 }\n```\n\n这看起来很复杂，但如果你逐行查看，你会发现这里有很多属性让其他开发者更容易进入项目。我们将在书中书中稍后介绍这些不同的部分。\n\
    \n这些是最基础的属性。\n\n```\n1 {\n2   \"name\": \"mean-machine-code\",\n3   \"main\":\
    \ \"server.js\"\n4 }\n```\n\n`main` 告诉 Node 当我们想要启动应用程序时使用哪个文件。我们将该文件命名为 `server.js`\
    \ 以供我们的应用程序使用，这将是我们应用程序的地方。\n\n有关更多在 `package.json` 中指定的属性，请参见 [package.json 文档](https://www.npmjs.org/doc/files/package.json.html)。\n\
    \n### 初始化应用\n`package.json` 文件是关于我们启动每一个应用程序的。\n"
- fmt: "\nFeel free to go into your `server.js` file and make changes. Then watch\
    \ the magic happen when application restarts itself!\n\n![nodemon server.](images/05-node-start----nodemon-server.jpg\
    \ \"nodemon server.js\")\n\n`nodemon server.js`\n\nFor the rest of this book,\
    \ we will reference `nodemon` when we want to start a server. It’s just the easier\
    \ option when developing.\n\n***\n\nWe’ve now configured a real simple Node app\
    \ and started it up from our command line. We’re one step closer to building full\
    \ blown Node applications that are ready to show off to the world.\n\n## Packages\n\
    \nPackages extend the functionality of our application. Like we talked about in\
    \ our earlier Primers section, even one of the 4 main parts of the MEAN stack,\
    \ Express, is a Node package.\n\nLet’s look at how we can add and install packages.\
    \ Once we’ve talked about getting packages into our application, we will move\
    \ on to using the other components of the MEAN stack.\n\n### Installing Packages\n\
    \nThe `package.json` file is where we have defined our application name and the\
    \ main file to start our application. This is also where we will define the packages\
    \ that are needed.\n\nThere are two ways we can add packages to our project: `writing\
    \ them directly into package.json` and `installing via the command line`. Both\
    \ of these ways will add the packages we need to the `dependencies` section of\
    \ `package.json`.\n\n#### Method 1. Writing Packages Directly into Package.json\n\
    \nHere is a `package.json` file that we have added the Express dependency to.\n\
    \n```json\n1 {\n2   \"name\": \"packages-install\",\n3   \"main\": \"server.js\"\
    ,\n4   \"dependencies\": {\n5     \"express\": \"~4.8.6\"\n6   }\n7 }\n```\n\n\
    Just like that, we now have Express set as a package for our application and have\
    \ two parts of the MEAN stack! (_E_N)\n\n***\n\n![Note: npm Version Numbers](images/icon-pencil.png\
    \ \"Take Note\")\n\nNote: npm Version Numbers\n\n> You may be wondering what that\
    \ tilde (`~`) is doing next to the version number of Express. npm uses [semantic\
    \ versioning](https://www.npmjs.org/doc/misc/semver.html) when declaring package\
    \ versions. This means that the tilde will pull in the version that is `reasonably\
    \ close` to the one you specified. In this example, only versions of Express that\
    \ are greater than `4.8.6` and less than `4.9` will be installed.\n\n> The three\
    \ numbers each stand for a different portion of that version. For example, in\
    \ express 4.8.6 the 4 represents a major version, 8 represents minor version,\
    \ and 6 represents a patch. Usually bug fixes will be categorized as a patch and\
    \ shouldn’t break anything. A minor version update will add new features, but\
    \ still not break your previous code. And a major update might break existing\
    \ code, which might make you want to pull your hair out as some of you may already\
    \ know.\n\n> Using this type of versioning is good practice because we ensure\
    \ that only the version we specify will be pulled into our project. We will be\
    \ able to grab bug fixes up to the `4.9` version, but not any major changes that\
    \ would come with the `5.0` version.\n\n> If we revisit this application in the\
    \ future and use `npm install`, we know exactly what version of Express we are\
    \ using and that we won’t break our app by bringing in any newer versions since\
    \ we made this project.\n\n***\n\n#### Method 2. Adding Packages from the Command\
    \ Line\n\nThe second way to add packages to our application is to use the npm\
    \ shortcuts from the command line. This is often times the easier and better route\
    \ since npm can automatically save the package to your `package.json` file. And\
    \ here’s the cool part: `it will add the right version number`! If you write packages\
    \ into `package.json` you’ll have to dig around online to find the right version\
    \ number. This method makes life much easier.\n\nHere is the command to install\
    \ express and the `--save` modifier will add it to `package.json`.\n\n```\nnpm\
    \ install express --save\n```\n\nYou’ll notice that the above command grabs the\
    \ express package and installs it into a new folder called `node_modules`. This\
    \ is where packages live inside Node projects. This command installs only the\
    \ packages that we call specifically (express in this case).\n\n### Installing\
    \ All Packages\n\nMethod 2 will install packages for us. Method 1 will add the\
    \ packages to your `package.json`, but it won’t install them just yet. To install\
    \ all the packages inside the `dependencies` attribute of `package.json` to the\
    \ `node_modules` folder, just type:\n\n```\nnpm install\n```\n\nThat will look\
    \ at the dependencies we need and pull them into our application in the `node_modules`.\n\
    \n### Installing Multiple Packages\n\nnpm also comes with a handy way to install\
    \ multiple packages. Just type in all the packages you want into one `npm install`\
    \ command and they will be brought into the project.\n\n```\nnpm install express\
    \ mongoose passport --save\n```\n\nThis is a simple and easy way to bring in the\
    \ packages needed.\n\n## Recap\n\nNow when we want to start up a new Node project,\
    \ we just need to run two commands in the folder we want to create the project:\n\
    \n1. `npm init`\n2. Fill out the fields necessary when prompted to create your\
    \ `package.json` file.\n3. `npm install express --save`\n\nJust like that we have\
    \ everything we need to set up our application!\n\nLet’s move forward and dig\
    \ into using Express and Node to set up the foundation of our MEAN stack apps.\n\
    \n## Starting a Node Server\n\nWe’re going to move forward and look at the ways\
    \ to set up a Node server. In the previous chapter, we only logged something to\
    \ the console. In this chapter, we will send HTML files to our users.\n\n### Method\
    \ 1: Pure Node (no Express)\n\nWhen using Method 1, we will pull in two modules\
    \ that are built into Node. The [HTTP module](http://nodejs.org/api/http.html#http_http)\
    \ is used to start up HTTP servers and respond to HTTP requests from users. The\
    \ [fs module](http://nodejs.org/api/fs.html#fs_file_system) is used to read the\
    \ file system. We will need to read our `index.html` from the file system and\
    \ then pass it to our user using an HTTP server.\n\n### Sample Application\n\n\
    For this chapter’s example, we need a brand new folder with the following files:\n\
    \n*   package.json\n*   server.js\n*   index.html\n\nLike we learned before, `package.json`\
    \ will hold the configuration/packages for our project while `server.js` will\
    \ have our application setup and configuration. Our `index.html` will be a basic\
    \ HTML file.\n\n`package.json` and `index.html` will be the same for both methods.\
    \ The only file that will change between the two methods is the `server.js` file\
    \ because that’s where we will start our Node server.\n\n#### package.json\n\n\
    Here is our simple `package.json` file:\n\n```json\n1 {\n  \"name\": \"http-server\"\
    ,\n  \"main\": \"server.js\"\n}\n```\n\n#### index.html\n\nLet’s fill out a simple\
    \ `index.html` file also:\n\n```html\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\"\
    >\n 3 <head>\n 4 \t<meta charset=\"UTF-8\">\n 5 \t<title>Super Cool Site</title>\n\
    \ 6 \t<style>\n 7 \t\tbody { \n 8 \t\t\ttext-align:center; \n 9 \t\t\tbackground:#EFEFEF;\
    \ \n 10 \t\t\tpadding-top:50px;\n 11 \t\t}\n 12 \t</style>\n 13 </head>\n 14 <body>\n\
    \ 15 \n 16 \t<h1>Hello Universe!</h1>\n 17 \t\n 18 </body>\n 19 </html>\n```\n\
    \n#### Method 2: Using Express\n\nSince Express is one of the main parts of the\
    \ MEAN stack, we want to use this method. After you learn this method you’ll probably\
    \ never want to look back anyway.\n"
