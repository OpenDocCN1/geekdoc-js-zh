    35 };\n36 \n37 // return the model\n38 module.exports = mongoose.model('User',\
    \ UserSchema);\n```\n\nThere is a lot happening here, but it’s fairly simple.\
    \ We must **create our Schema**. We are defining *name*, *username*, and *password*\
    \ as **String**s. By setting the `index` and `unique` attributes, we are telling\
    \ Mongoose to create a unique index for this path. This means that a username\
    \ can not be duplicated. Another mongoose feature that we will implement is `select:\
    \ false` on the password attribute. When we query the list of users or a single\
    \ user, there will be no need to provide the password. By setting `select` to\
    \ `false`, the password will not be returned when listing our users, unless it\
    \ is explicitly called.\n\nWe are also creating a function using `pre` that will\
    \ ensure that the password is hashed before we save the user.\n\n> It is always\
    \ important to make sure that we are not saving plaintext passwords to the database.\
    \ We have to make sure our applications are as secure as can be from the start.\n\
    \nWith mongoose, we are also creating a method on our user model to compare the\
    \ password with a given hash. This is how we will authenticate our users in Chapter\
    \ 10.\n\nWith that file created, let’s pull it into our `server.js` so that we\
    \ can use it within our application. We’ll add one more line to that file and\
    \ use `require` like we have before to pull in features.\n\n```\n1 // server.js\n\
    2 \n3 // BASE SETUP\n4 // ==========================\n5 \n6 var User     = require('./app/models/user');\n\
    ```\n\nNow our entire application is ready and wired up so we can start building\
    \ out our routes. These routes will define our API, which is the main reason this\
    \ chapter exists. Onward!\n\n### Express Router and Routes\n\nWe will use an instance\
    \ of the Express Router to handle all of our API routes. Here is an overview of\
    \ the routes we will require, what they will do, and the HTTP Verb used to access\
    \ it.\n\n| /api/users | `GET` | Get all the users |\n\n| --- | --- | --- |\n\n\
    | /api/users | `POST` | Create a user |\n\n| /api/users/:user_id | `GET` | Get\
    \ a single user |\n\n| /api/users/:user_id | `PUT` | Update a user with new info\
    \ |\n\n| /api/users/:user_id | `DELETE` | Delete a user |\n\nThis will cover the\
    \ basic routes needed for an API. This also keeps to a good format where we have\
    \ kept the actions we need to execute (GET, POST, PUT, and DELETE) as HTTP verbs.\n\
    \n### Route Middleware\n\nWe’ve already defined our first route and seen it in\
    \ action. The Express Router gives us a great deal of flexibility in defining\
    \ our routes.\n\nWe’ve talked on route middleware in the Node Routing chapter.\
    \ For this example we are just going to `console.log()` the request to the console.\
    \ Let’s add that middleware to our ‘server.js’ file now.\n\n```\n 1 // ROUTES\
    \ FOR OUR API\n 2 // =============================\n 3 var apiRouter = express.Router();\
    \ \t// get an instance of the express Router\n 4 \n 5 // middleware to use for\
    \ all requests\n 6 apiRouter.use(function(req, res, next) {\n 7 \t// do logging\n\
    \ 8 \tconsole.log('Somebody just came to our app!');\n 9 \n10 \t// we'll add more\
    \ to the middleware in Chapter 10\n11 \t// this is where we will authenticate\
    \ users\n12 \n13 \tnext(); // make sure we go to the next routes and don't stop\
    \ here\n14 });\n15 \n16 // test route to make sure everything is working \n17\
    \ // (accessed at GET http://localhost:8080/api)\n18 apiRouter.get('/', function(req,\
    \ res) {\n19 \tres.json({ message: 'hooray! welcome to our api!' });\t\n20 });\n\
    21 \n22 // more routes for our API will happen here\n23 \n24 // REGISTER OUR ROUTES\
    \ -------------------------------\n25 // all of our routes will be prefixed with\
    \ /api\n26 app.use('/api', apiRouter);\n```\n\nAll we needed to do to declare\
    \ that middleware was to use `router.use(function())`. The order of how we define\
    \ the parts of our router is very important. They will run in the order that they\
    \ are listed like we talked about earlier.\n\nWe are sending back information\
    \ as **JSON data**. This is standard for an API and the people using your API\
    \ will be eternally grateful.\n\nWe will also add `next()` to indicate to our\
    \ application that it should continue to the other routes or next middleware.\
    \ This is important because our application would stop at this middleware without\
    \ it.\n\nNow when we send a request to our application using Postman, the request\
    \ will be logged to our Node console (the command line).\n\n**Middleware Uses**\
    \ Using middleware like this can be very powerful. We can do validations to make\
    \ sure that everything coming from a request is safe and sound. We can throw errors\
    \ here in case something in the request is wrong. We can do some extra logging\
    \ for analytics or any statistics we’d like to keep. And the big usage is to authenticate\
    \ the API calls by checking if a user has the correct token, which we will do\
    \ in the next chapter.\n\n### Creating the Basic Routes\n\nWe will now create\
    \ the routes to handle **getting all the users** and **creating a user**. This\
    \ will both be handled using the `/api/users` route. We’ll look at creating a\
    \ user first so that we have users to work with.\n\n#### Creating a User POST\
    \ (/api/users)\n\nWe will add the new route to handle POST and then test it using\
    \ Postman.\n\n```\n 1 // ROUTES FOR OUR API\n 2 // ===============================\n\
    \ 3 \n 4 // route middleware and first route are here\n 5 \n 6 // on routes that\
    \ end in /users\n 7 // ----------------------------------------------------\n\
    \ 8 apiRouter.route('/users')\n 9 \n10 \t// create a user (accessed at POST http://localhost:8080/api/users)\n\
    11 \t.post(function(req, res) {\n12 \t\t\n13 \t\t// create a new instance of the\
    \ User model\n14 \t\tvar user = new User(); \t\t\n15 \n16 \t\t// set the users\
    \ information (comes from the request)\n17 \t\tuser.name = req.body.name;  \n\
    18 \t\tuser.username = req.body.username;\n19 \t\tuser.password = req.body.password;\n\
    20 \n21 \t\t// save the user and check for errors\n22 \t\tuser.save(function(err)\
    \ {\n23             if (err) {\n24                 // duplicate entry\n25    \
    \             if (err.code == 11000) \n26                     return res.json({\
    \ success: false, message: 'A user with that\\\n27  username already exists. '});\n\
    28                 else \n29                     return res.send(err);\n30   \
    \          }\n31 \n32 \t\t\tres.json({ message: 'User created!' });\n33 \t\t});\n\
    34 \t\t\n35 \t})\n```\n\nNow we have created the `POST` route for our application.\
    \ We will use Express’s `apiRouter.route()` to handle multiple routes for the\
    \ same URI. We are able to handle all the requests that end in `/users`.\n\nLet’s\
    \ look at Postman now to create our user. We are passing the `name` variable.\
    \ This is how the information would look if it came from a form on our website\
    \ or application.\n\n![Node API Postman POST Create User](images/09-restful-api----create-user.jpg)\n\
    \nNode API Postman POST Create User\n\nNotice that we are sending the `name` data\
    \ as `x-www-form-urlencoded`. This will send all of our data to the Node server\
    \ as query strings."
