- fmt: '

    There are several Node frameworks in existence. We’re using `Express` in this
    book, but the concepts taught here will easily transfer over to other popular
    frameworks.


    The other main frameworks of interest are:


    *   [HapiJS](http://hapijs.com/) - Great framework being used by more and more
    enterprise companies.

    *   [KoaJS](http://koajs.com/) - a fork of `Express`

    *   [Restify](http://mcavage.me/node-restify/) - Borrows from `Express` syntax
    to create a framework devoted to building REST APIs.

    *   [Sails](http://sailsjs.org/#/) - Framework built to emulate the MVC model.


    `Express` will handle nearly all of the tasks that you need and it is extremely
    robust, usable, and now has commercial backing as it was recently bought/sponsored
    by [StrongLoop](http://strongloop.com/strongblog/tj-holowaychuk-sponsorship-of-express/).


    While those other frameworks are great in their own rights (definitely take a
    look at them), we will be focusing on `Express`. It is the `MEAN` stack after
    all.


    ### ExpressJS


    `Express` is a lightweight platform for building web apps using `NodeJS`. It helps
    organize web apps on the server side. The [ExpressJS website](http://expressjs.com)
    describes `Express` as “a minimal and flexible node.js web application framework”.


    `Express` hides a lot of the inner workings of `Node`, which allows you to dive
    into your application code and get things up and running a lot faster. It’s fairly
    easy to learn and still gives you a bit of flexibility with its structure. There
    is a reason it is currently the most popular framework for `Node`. Some of the
    big names using `Express` are:


    *   MySpace

    *   LinkedIn

    *   Klout

    *   Segment.io


    For a full list of `Express` users, visit the [Express list](http://expressjs.com/applications.html).


    `Express` comes with several great features that will add ease to your `Node`
    development.


    *   Router

    *   Handling Requests

    *   Application Settings

    *   Middleware


    Don’t worry if these terms are new to you. As we build our sample applications,
    we’ll dive into each of these components, learn about them, and use them. Onto
    the last part of the MEAN stack (probably my favorite part of the stack)!


    ### AngularJS


    `Angular`, created by Google, is a JavaScript framework built for fast and dynamic
    front-end deployment.


    `Angular` allows you to build your normal HTML application and then extend your
    markup to create dynamic components. If you’ve ever made a dynamic web page without
    `Angular`, you’ve probably noticed some of the common complications, such as data
    binding, form validation, DOM event handling, and much more. `Angular` introduces
    an all-in-one solution to these problems.


    For those of you worried about learning so much at once, you’re in luck. The learning
    curve for `Angular` is actually quite small, which may explain why its adoption
    has skyrocketed. The syntax is simple and its main principles like data-binding
    and dependency injection are easy to grasp with just a few examples, which of
    course will be covered in this book.


    Two of the major features of `Angular` are data binding and dependency injection.
    Data binding deals with how we handle data in our applications while dependency
    injection deals more with how we architect them.


    #### Data Binding


    If you come from the land of jQuery, you will be familiar with using your CSS
    selectors to traverse the DOM. Every time you need to grab a value from an input
    box, you use `$(''input'').val();`. This is great and all, but when you have large
    applications with multiple input boxes, this becomes a little harder to manage.


    When you’re pulling and injecting data into different places in your application,
    there is no longer `one true source of data`. With `Angular`, you have something
    similar to the MVC (model-view-controller) model where your data is in one spot.
    When you need information, you can be sure that you are looking at the correct
    information. This is because if you change data in your view (HTML files) or in
    your controller (JavaScript files), `the data changes everywhere`.


    #### Dependency Injection


    An `Angular` application is a collection of several different modules that all
    come together to build your application. For example, your application may have
    a model to interact with a specific item in an API, a controller to hand data
    to our views, or a module to handle routing our `Angular` application.


    * * *


    > **Dependency Injection** A dependency in your code occurs when one object depends
    on another. There are different degrees of dependency, but having too much of
    it can sometimes make it difficult to test your code or even make some processes
    run longer. Dependency injection is a method by which we can give an object the
    dependencies that it requires to run. —


    Having compartmentalized and modular applications gives us many benefits. Like
    packages in `Node` and PHP or gems in Ruby, we can reuse modules across different
    projects and even pull in modules that other developers have already created.


    By injecting these modules into our application, we can also test each module
    separately. We are able to determine what parts of our application are failing
    and narrow down the problem to a certain codeset.


    #### Other Main Features


    *   MVC

    *   Directives

    *   Scopes

    *   Templates

    *   Testing


    Check out this Tuts+ article for a more in depth overview of `Angular`: [5 Awesome
    AngularJS Features](http://code.tutsplus.com/tutorials/5-awesome-angularjs-features--net-25651).


    ## MEAN Thinking


    When building MEAN stack applications throughout our book, there’s a certain way
    of thinking that we’ll want to use. We’re talking about the `client-server model`.


    We are going to think of our application as two separate parts that handle specific
    tasks. The providers of a resource or service (`servers/backend/Node`) will handle
    the data layer and will provide information to our service requesters (`clients/frontend/Angular`).


    ### Client-Server Model


    When building this book, we will be thinking in `client-server model`. This is
    a very important concept while we are building our applications.


    * * *


    > **Client-Server Model** A network architecture in which one program, the client,
    requests service from another program, the server. They may reside on the same
    computer or communicate across a network. —


    There are many benefits to thinking of your application as two separate parts.
    By having our server be its own entity with an API from which we can access all
    of our data, we provide a way to create scalable application.


    This sort of thinking doesn’t just have to be exclusive to the MEAN stack either.
    There are numerous applications that would benefit from this type architecture.
    Having the server-side code be separate lets us create multiple front-end client
    applications like `websites`, `Android apps`, `iPhone apps`, and `Windows apps`
    that all connect to the same data.


    We can iterate on our server side code and this will not affect our frontend code.
    We also see **large companies like Facebook, Google, Twitter, and GitHub using
    this method**. They create the API and their frontend clients (website, mobile
    applications, and third party applications) integrate with it.


    *Fun Note*: The practice of using your own API to build a frontend client is called
    [dogfooding](http://en.wikipedia.org/wiki/Eating_your_own_dog_food) (one of my
    absolute favorite words).


    Here are the parts of our application separated as server and client.


    #### Server Components


    *   Database (MongoDB)

    *   Server/API (Node and Express)


    #### Client Components


    *   Frontend Layer (Angular)


    ![Client to Server Model](images/03-thinking----client-server.jpg "Client to Server
    Model")


    Client to Server Model


    ### Book Outline


    When building MEAN applications, we are going to look at the duties of the server
    (`Node`) and the client (`Angular`) separately.


    1.  **Chapter 1-3: Getting Started** Setting up the tools we’ll need for the book.

