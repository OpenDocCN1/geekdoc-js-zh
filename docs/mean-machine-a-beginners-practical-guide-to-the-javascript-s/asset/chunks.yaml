- fmt: "\nUp to this point, we have created a Node API and used JSON web tokens to\
    \ authenticate it. This has all been server-side code and now we will integrate\
    \ it with the frontend using the information we just learned about.\n\nThe goal\
    \ here is to start writing an Angular application and not have to edit the backend.\
    \ Treating your applications like this can simulate similar situations where the\
    \ backend API is built and maintained by someone other than yourself (like Facebook,\
    \ Twitter, or GitHub APIs). We only have access to the frontend code.\n\nThe first\
    \ step when building an application that will talk to a backend API is handling\
    \ authentication. After all, we won’t be able to grab any data from the API unless\
    \ we are authenticated.\n\n## Hooking Into Our Node API\n\nWhen we created our\
    \ Node API with JSON Web Token authentication in chapters 9 and 10, we developed\
    \ an API endpoint (`POST http://localhost:8080/api/authenticate`) where we could\
    \ send a username and password to receive a JWT.\n\nSince our backend already\
    \ has the tools to authenticate and provide a token, all we need to do is wire\
    \ up the frontend Angular application to hit that endpoint, store the JWT client-side,\
    \ and then we will be able to access all of the authenticated routes in our API.\n\
    \n## Authentication Service\n\nWe’ll be building two different services, one for\
    \ authentication and one for connecting to our API and grabbing user data. As\
    \ a general rule, if you are grabbing or sending data from/to an outside source,\
    \ a service will likely be your tool of choice.\n\nTo authenticate our users,\
    \ we will create an `authService`. This will have 3 main functions:\n\n* main\
    \ auth functions (login, logout, get current user, check if logged in)\n* token\
    \ auth functions (get the token, save the token)\n* auth interceptor (attach the\
    \ token to HTTP requests, redirect if not logged in)\n\nEach of the three factories\
    \ has a very specific purpose which is why we can’t just create a single one.\n\
    \nThe main auth functions are the ones that will be exposed to our application\
    \ and usable within controllers.\n\nThe auth interceptor will be responsible for\
    \ attaching the token to all HTTP requests. Remember in token based authentication,\
    \ the token is required with all authenticated requests; this interceptor is how\
    \ we will achieve the attachment. This interceptor will also be responsible for\
    \ redirecting a user to the login page if they are not authenticated.\n\nThe token\
    \ auth functions will be more of private factory for use within the other two\
    \ auth factories. It will just have to save a token or get a token out of local\
    \ storage.\n\nHere is a quick overview of how our file will look:\n\n```\n 1 angular.module('authService',\
    \ [])\n 2 \n 3 // ===================================================\n 4 // auth\
    \ factory to login and get information\n 5 // inject $http for communicating with\
    \ the API\n 6 // inject $q to return promise objects\n 7 // inject AuthToken to\
    \ manage tokens\n 8 // ===================================================\n 9\
    \ .factory('Auth', function($http, $q, AuthToken) {\n10 \n11   // create auth\
    \ factory object\n12   var authFactory = {};\n13 \n14   // handle login\n15 \n\
    16   // handle logout\n17 \n18   // check if a user is logged in\n19 \n20   //\
    \ get the user info\n21 \n22   // return auth factory object\n23   return authFactory;\n\
    24 \n25 })\n26 \n27 // ===================================================\n 28\
    \ // factory for handling tokens\n 29 // inject $window to store token client-side\n\
    \ 30 // ===================================================\n31 .factory('AuthToken',\
    \ function($window) {\n32 \n33   var authTokenFactory = {};\n34 \n35   // get\
    \ the token\n36 \n37   // set the token or clear the token\n38 \n39   return authTokenFactory;\n\
    40 \n41 })\n42 \n43 // ===================================================\n 44\
    \ // application configuration to integrate token into requests\n 45 // ===================================================\n\
    46 .factory('AuthInterceptor', function($q, AuthToken) {\n47 \n48   var interceptorFactory\
    \ = {};\n49 \n50   // attach the token to every request\n51 \n52   // redirect\
    \ if a token doesn't authenticate\n53 \n54   return interceptorFactory;\n55 \n\
    56 });\n```\n\nThese are the three factories we will be creating all lumped into\
    \ one Angular module called `authService`. For each, we are creating a new object,\
    \ attaching functions to the object, and returning the object.\n\nNotice that\
    \ we are able to inject a factory into another factory. We are using the `AuthToken`\
    \ factory in the other two factories. We are also injecting some Angular modules\
    \ into our factories like `$http`, `$q`, and `$location`.\n\n`$location` will\
    \ be the module that we use to redirect users. This is how we redirect while still\
    \ using the Angular routing mechanisms. This means that our user will be redirected\
    \ without a page refresh.\n\n`$q` is the module used to return promises. It will\
    \ allow us to run functions asynchronously and return their values when they are\
    \ done processing. In the previous chapter, we used `success()`, `error()`, and\
    \ `then()` to act on a promise; we will be able to use those functions when returning\
    \ a `$q`.\n\nLet’s go through each of these factories one by one so that we can\
    \ see how our entire `authService` will work.\n\n### Auth Token Factory\n\nWe’ll\
    \ start with the `AuthTokenFactory` since that will be used by the other two factories.\
    \ To check on what is in local storage, just go into the Chrome Dev tools, click\
    \ Resources, and check the Local Storage tab.\n\n![Local Storage](images/16-angular-authentication----local-storage.jpg)\n\
    \nLocal Storage\n\nHere is the code for `AuthTokenFactory`:\n\n```\n1 // ===================================================\n\
    \ 2 // factory for handling tokens\n 3 // inject $window to store token client-side\n\
    \ 4 // ===================================================\n5 .factory('AuthToken',\
    \ function($window) {\n6 \n7   var authTokenFactory = {};\n8 \n9   // get the\
    \ token out of local storage\n10   authTokenFactory.getToken = function() {\n\
    11     return $window.localStorage.getItem('token');\n12   };\n13 \n14   // function\
    \ to set token or clear token\n15   // if a token is passed, set the token\n16\
    \   // if there is no token, clear it from local storage\n17   authTokenFactory.setToken\
    \ = function(token) {\n18     if (token)\n19       $window.localStorage.setItem('token',\
    \ token);\n20     else\n21       $window.localStorage.removeItem('token');\n22\
    \   };\n23 \n24   return authTokenFactory;\n25 \n26 })\n```\n\nWe have just two\
    \ functions here. `getToken()` and `setToken()`. `$window.localStorage` is the\
    \ way that we can add, set or remove items from local storage.\n\nNext up, let’s\
    \ create the main Auth factory that we will be using within our application’s\
    \ controllers.\n\n### Auth Factory\n\nThe main Auth factory will contain functions\
    \ needed to log a user in, log a user out, check if a user is logged in, and get\
    \ the user information.\n\nLet’s see how that factory will look:\n"
  raw: "Up to this point, we have created a Node API and used JSON web tokens to authenticate\
    \ it. This has all been server-side code and now we will integrate it with the\
    \ frontend using the information we just learned about\n\nThe goal here is to\
    \ start writing an Angular application and not have to edit the backend. Treating\
    \ your applications like this can simulate similar situations where the backend\
    \ API is built and maintained by someone other than yourself (like Facebook, Twitter,\
    \ or GitHub APIs). We only have access to the frontend code.\n\nThe first step\
    \ when building an application that will talk to a backend API is handling authentication.\
    \ After all, we won’t be able to grab any data from the API unless we are authenticated.\n\
    \n### Hooking Into Our Node API\n\nWhen we created our Node API with JSON Web\
    \ Token authentication in chapters 9 and 10, we developed an API endpoint (`POST\
    \ http://localhost:8080/api/authenticate`) where we could send a username and\
    \ password to receive a JWT.\n\nSince our backend already has the tools to authenticate\
    \ and provide a token, all we need to do is wire up the frontend Angular application\
    \ to hit that endpoint, store the JWT client-side, and then we will be able to\
    \ access all of the authenticated routes in our API.\n\n### Authentication Service\n\
    \nWe’ll be building two different services, one for authentication and one for\
    \ connecting to our API and grabbing user data. As a general rule, if you are\
    \ grabbing or sending data from/to an outside source, a service will likely be\
    \ your tool of choice.\n\nTo authenticate our users, we will create an `authService`.\
    \ This will have 3 main functions:\n\n*   main auth functions (login, logout,\
    \ get current user, check if logged in)\n\n*   token auth functions (get the token,\
    \ save the token)\n\n*   auth interceptor (attach the token to HTTP requests,\
    \ redirect if not logged in)\n\nEach of the three factories has a very specific\
    \ purpose which is why we can’t just create a single one.\n\nThe main auth functions\
    \ are the ones that will be exposed to our application and usable within controllers.\n\
    \nThe auth interceptor will be responsible for attaching the token to all HTTP\
    \ requests. Remember in token based authentication, the token is required with\
    \ all authenticated requests; this interceptor is how we will achieve the attachment.\
    \ This interceptor will also be responsible for redirecting a user to the login\
    \ page if they are not authenticated.\n\nThe token auth functions will be more\
    \ of private factory for use within the other two auth factories. It will just\
    \ have to save a token or get a token out of local storage.\n\nHere is a quick\
    \ overview of how our file will look:\n\n```\n 1 angular.module('authService',\
    \ [])\n 2 \n 3 // ===================================================\n 4 // auth\
    \ factory to login and get information\n 5 // inject $http for communicating with\
    \ the API\n 6 // inject $q to return promise objects\n 7 // inject AuthToken to\
    \ manage tokens\n 8 // ===================================================\n 9\
    \ .factory('Auth', function($http, $q, AuthToken) {\n10 \n11   // create auth\
    \ factory object\n12   var authFactory = {};\n13 \n14   // handle login\n15 \n\
    16   // handle logout\n17 \n18   // check if a user is logged in\n19 \n20   //\
    \ get the user info\n21 \n22   // return auth factory object\n23   return authFactory;\n\
    24 \n25 })\n26 \n27 // ===================================================\n28\
    \ // factory for handling tokens\n29 // inject $window to store token client-side\n\
    30 // ===================================================\n31 .factory('AuthToken',\
    \ function($window) {\n32 \n33   var authTokenFactory = {};\n34 \n35   // get\
    \ the token\n36 \n37   // set the token or clear the token\n38 \n39   return authTokenFactory;\n\
    40 \n41 })\n42 \n43 // ===================================================\n44\
    \ // application configuration to integrate token into requests\n45 // ===================================================\n\
    46 .factory('AuthInterceptor', function($q, AuthToken) {\n47 \n48   var interceptorFactory\
    \ = {};\n49 \n50   // attach the token to every request\n51 \n52   // redirect\
    \ if a token doesn't authenticate\n53 \n54   return interceptorFactory;\n55 \n\
    56 });\n```\n\nThese are the three factories we will be creating all lumped into\
    \ one Angular module called `authService`. For each, we are creating a new object,\
    \ attaching functions to the object, and returning the object.\n\nNotice that\
    \ we are able to inject a factory into another factory. We are using the `AuthToken`\
    \ factory in the other two factories. We are also injecting some Angular modules\
    \ into our factories like `$http`, `$q`, and `$location`.\n\n**$location** will\
    \ be the module that we use to redirect users. This is how we redirect while still\
    \ using the Angular routing mechanisms. This means that our user will be redirected\
    \ without a page refresh.\n\n**$q** is the module used to return promises. It\
    \ will allow us to run functions asynchronously and return their values when they\
    \ are done processing. In the previous chapter, we used `success()`, `error()`,\
    \ and `then()` to act on a promise; we will be able to use those functions when\
    \ returning a `$q`.\n\nLet’s go through each of these factories one by one so\
    \ that we can see how our entire `authService` will work.\n\n#### Auth Token Factory\n\
    \nWe’ll start with the `AuthTokenFactory` since that will be used by the other\
    \ two factories. Essentially what we are doing is setting or getting data from\
    \ our browser’s [local storage](http://diveintohtml5.info/storage.html). To check\
    \ on what is in your local storage, just go into the Chrome Dev tools, click Resources,\
    \ and check the Local Storage tab.\n\n![Local Storage](images/16-angular-authentication----local-storage.jpg)\n\
    \nLocal Storage\n\nHere is the code for the `AuthTokenFactory`:\n\n```\n 1 //\
    \ ===================================================\n 2 // factory for handling\
    \ tokens\n 3 // inject $window to store token client-side\n 4 // ===================================================\n\
    \ 5 .factory('AuthToken', function($window) {\n 6 \n 7   var authTokenFactory\
    \ = {};\n 8 \n 9   // get the token out of local storage\n10   authTokenFactory.getToken\
    \ = function() {\n11     return $window.localStorage.getItem('token');\n12   };\n\
    13 \n14   // function to set token or clear token\n15   // if a token is passed,\
    \ set the token\n16   // if there is no token, clear it from local storage\n17\
    \   authTokenFactory.setToken = function(token) {\n18     if (token)\n19     \
    \  $window.localStorage.setItem('token', token);\n20     else\n21       $window.localStorage.removeItem('token');\n\
    22   };\n23 \n24   return authTokenFactory;\n25 \n26 })\n```\n\nWe have just two\
    \ functions here. `getToken()` and `setToken()`. `$window.localStorage` is the\
    \ way that we can add, set or remove items from local storage.\n\nNext up, let’s\
    \ create the main Auth factory that we will be using within our application’s\
    \ controllers.\n\n#### Auth Factory\n\nThe main Auth factory will contain functions\
    \ needed to log a user in, log a user out, check if a user is logged in, and get\
    \ the user information.\n\nLet’s see how that factory will look:"
