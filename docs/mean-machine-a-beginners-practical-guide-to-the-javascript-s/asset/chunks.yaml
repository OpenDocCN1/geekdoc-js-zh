  trans: "\n\n```\n 1 // get the http and filesystem modules\n 2 var http = require('http'),\n\
    \ 3   fs = require('fs');\n 4 \n 5 // create our server using the http module\n\
    \ 6 http.createServer(function(req, res) {\n 7 \n 8   // write to our server.\
    \ set configuration for the response\n 9   res.writeHead(200, {\n10     'Content-Type':\
    \ 'text/html',\n11     'Access-Control-Allow-Origin' : '*'\n12   });\n13 \n14\
    \   // grab the index.html file using fs\n15   var readStream = fs.createReadStream(__dirname\
    \ + '/index.html');\n16 \n17   // send the index.html file to our user\n18   readStream.pipe(res);\
    \  \n19 \n20 }).listen(1337);\n21 \n22 // tell ourselves what's happening\n23\
    \ console.log('Visit me at http://localhost:1337');\n```\n\n我们正在使用 `http` 模块创建一个服务器，并使用\
    \ `fs` 模块获取索引文件并在我们的响应中发送给用户。\n\n现在已经定义了 `server.js` 文件，让我们进入命令行并启动我们的 Node http\
    \ 服务器。\n\n`nodemon server.js`\n\n你应该能看到服务器启动，并且控制台打印了一条消息。\n\n![Node HTTP 服务器控制台](img/06-node-server----http-server-console.jpg)\n\
    \nNode HTTP 服务器控制台\n\n现在我们可以在浏览器中通过 `http://localhost:1337` 查看我们的网站。\n\n![Hello\
    \ Universe 浏览器](img/06-node-server----hello-browser.jpg)\n\nHello Universe 浏览器\n\
    \n我们终于向用户发送了一个 HTML 文件！你可能在认为设置这个 http 服务器需要了大量你可能记不住的语法。不过不用担心，Express 的方式要简洁得多。\n\
    \n### 方法 #2：使用 Express\n\n既然我们已经使用 HTTP 模块启动了服务器，让我们看看如何使用 Express 实现相同的功能。你会发现管理代码会变得简单得多。\n\
    \n我们首先需要将 Express 添加到此项目中。让我们使用命令行安装它并将其保存到 `package.json` 中。\n\n`npm install\
    \ express --save`\n\n现在让我们修改 `server.js` 文件以适配 Express。我们将从调用 Express 开始。使用该 Express\
    \ 实例，我们将定义一个路由并发送 `index.html` 文件。然后我们将在特定端口上“监听”来自浏览器的请求。\n\n```\n 1 // load\
    \ the express package and create our app\n 2 var express = require('express');\n\
    \ 3 var app     = express();\n 4 var path = require('path');\n 5   \n 6 // send\
    \ our index.html file to the user for the home page\n 7 app.get('/', function(req,\
    \ res) {\n 8 \tres.sendFile(path.join(__dirname + '/index.html'));\n 9 });\n10\
    \ \n11 // start the server\n12 app.listen(1337);\n13 console.log('1337 is the\
    \ magic port!');\n```\n\n现在我们获取了 Express，设置了端口并启动了服务器。Express 让启动服务器的工作变得更容易，语法也更简洁。使用\
    \ `nodemon server.js` 启动该服务器将再次向 `http://localhost:1337` 的用户输出我们的 HTML 文件。\n\n\
    我们将看到与之前相同的结果，但现在代码更容易理解了。\n\n![Hello Universe 浏览器](img/06-node-server----hello-browser.jpg)\n\
    \nHello Universe 浏览器\n\n* * *\n\n![提示](img/icon-heart.png \"专业级提示\")\n\n提示\n\n\
    ### 定义包的快捷方法\n\n定义包时的一个小技巧：不要在每次定义包时都输入 `var`，你可以使用 `\",\"` 将包连接起来。\n\n这是一个示例：\n\
    \n```\n1 var express = require('express');\n2 var app = express();\n3 \n4 // the\
    \ exact same result\n5 \n6 var express = require('express'),\n7     app = express();\n\
    ```\n\n这只是为了稍微整理一下你的代码，并让你跳过几次额外的按键。\n\n* * *\n\n我们现在可以创建一个 Node 服务器并向用户发送 HTML\
    \ 文件。到目前为止，我们定义了一个简单的 `get` 路由。让我们迈下一步，为我们的网站添加更多路由和页面。\n\n## Node 的路由\n\n为了给我们的网站添加更多页面，我们需要更多的路由。这可以通过\
    \ Express 内置的一个功能——Express Router 来实现。这将是一个大章节，因为路由将成为我们以后所有应用程序的巨大大部分。这就是我们对基础到高级网站进行路由的方法，也是我们最终构建\
    \ Angular 前端应用程序将使用的 RESTful API 的方式。展望未来真是令人兴奋！不过要一步步来。让我们开始路由。\n\n### Express\
    \ Router\n\nExpress Router 到底是什么？你可以把它看作是一个没有所有花哨功能的微型 Express 应用，只包含路由功能。它不引入视图或设置，但为我们提供了诸如\
    \ `.use()`、`.get()`、 `.param()` 和 `.route()` 这样的路由 API。让我们看看这具体意味着什么。\n\n使用路由有几种不同的方法。我们在创建主页时已经使用了其中一种方法\
    \ `app.get('/', ...)`。我们将查看其他方法。\n\n### 示例应用程序\n\n我们要为应用程序添加的主要功能：\n\n* 基础路由（我们已经创建了首页）\n\
    * 站点章节（路由部分）\n* 路由日志控制台\n* 带参数的路由（http://localhost:1337/admin/users）\n* 路由中间件\n\
    * 登录路由（GET）\n\n**什么是路由中间件？** 中间件在用户请求和最终响应之间调用。我们将在处理请求时讨论它。\n\n正如我们一直所做的，我们将路由放在\
    \ `server.js` 中。我们不需要 `package.json` 的任何更改。\n\n### 基础路由\n\n我们已经定义了首页的基础路由。Express\
    \ 允许我们在 `app` 对象上定义路由。我们还可以处理 `GET`、`POST`、`PUT/PATCH` 和 `DELETE` 等操作。\n\n这是定义路由最简单的方法，但随着应用程序的扩大，我们需要对路由进行组织。想象一个有一个管理部分和一个前端部分的应用程序，每个部分都有多个路由。\n\
    \n### express.Router()\n\n[express.Router](https://expressjs.com/api#router) 充当微应用。你可以像调用\
    \ Express 一样调用并在上面定义路由。让我们看一个示例，确切这意味着什么。如果你想尝试，请将其添加到 `server.js`。\n\n在 `server.js`\
    \ 的 `app.get()` 路由下方添加以下内容。我们将 1. **调用路由实例** 2. **对其应用路由** 3. 然后**将这些路由添加到主应用中**：\n\
    \n```\n 1 // create routes for the admin section\n 2 \n 3 // get an instance of\
    \ the router\n 4 var adminRouter = express.Router();\n 5 \n 6 // admin main page.\
    \ the dashboard (http://localhost:1337/admin)\n 7 adminRouter.get('/', function(req,\
    \ res) {\n 8 \tres.send('I am the dashboard!');\n 9 });\n10 \n 11 // users page\
    \ (http://localhost:1337/admin/users)\n 12 adminRouter.get('/users', function(req,\
    \ res) {\n 13 \tres.send('I show all the users!');\n 14 });\n 15 \n 16 // posts\
    \ page (http://localhost:1337/admin/posts)\n 17 adminRouter.get('/posts', function(req,\
    \ res) {\n 18 \tres.send('I show all the posts!');\n 19 });\n20 \n 21 // apply\
    \ the routes to our application\n 22 app.use('/admin', adminRouter);\n```\n\n"
- fmt: "\nWe can now access the admin panel page at `http://localhost:1337/admin`\
    \ and the sub-pages at `http://localhost:1337/admin/users` and `http://localhost:1337/admin/posts`.\n\
    \nNotice how we can set a default root for using these routes we just defined.\
    \ If we had changed line 22 to `app.use('/app', router)`, then our routes would\
    \ be `http://localhost:1337/app/` and `http://localhost:1337/app/users`.\n\nThis\
    \ is very powerful because we can create multiple `express.Router()`s and then\
    \ apply them to our application. We could have a `Router` for our basic routes,\
    \ authenticated routes, and even API routes.\n\nUsing the `Router`, we are allowed\
    \ to make our applications more modular and flexible than ever before by creating\
    \ multiple instances of the `Router` and applying them accordingly. Now we’ll\
    \ take a look at how we can use middleware to handle requests.\n\n### Route Middleware\
    \ (`router.use()`)\n\nRoute middleware in Express is a way to do something before\
    \ a request is processed. This could be things like checking if a user is authenticated,\
    \ logging data for analytics, or anything else we’d like to do before we actually\
    \ spit out information to our user.\n\nHere is some middleware to log a message\
    \ to our console every time a request is made. This will be a demonstration of\
    \ how to create middleware using the `Express Router`. We’ll just add the middleware\
    \ to the `adminRouter` we created in the last example. Make sure that this is\
    \ placed after your `adminRouter` declaration and before the users and posts routes\
    \ we defined. You’ll also notice the `next` argument here. This is the only way\
    \ that Express will know that the function is complete and it can proceed with\
    \ the next piece of middleware or continue on to the routing.\n\n```\n1 // route\
    \ middleware that will happen on every request\n2 adminRouter.use(function(req,\
    \ res, next) {\n3 \n4 \t// log each request to the console\n5 \tconsole.log(req.method,\
    \ req.url);\n6 \n7 \t// continue doing what we were doing and go to the route\n\
    8 \tnext(); \n9 });\n```\n\n`adminRouter.use()` is used to define middleware.\
    \ This will now be applied to all of the requests that come into our application\
    \ for this instance of `Router`. Let’s go into our browser and go to `http://localhost:1337/admin`\
    \ and we’ll see the request in our console.\n\n![Express Router Console Request](images/07-node-routing----express-router-console-log-request.jpg)\n\
    \nExpress Router Console Request\n\n**The order you place your middleware and\
    \ routes is very important** Everything will happen in the order that they appear.\
    \ This means that if you place your middleware after a route, then the route will\
    \ happen before the middleware and the request will end there. Your middleware\
    \ will not run at that point.\n\nKeep in mind that you can use route middleware\
    \ for many things. You can use it to check that a user is logged in during the\
    \ session before letting them continue.\n\n### Structuring Routes\n\nBy using\
    \ the `Router()`, we are able to section off parts of our site. This means you\
    \ can create a `basicRouter` for routes like the frontend of the site. You could\
    \ also create an `adminRouter` for administration routes that would be protected\
    \ by some sort of authentication.\n\nRouting our application this way let’s usize\
    \ each piece. This provides us the flexibility we need for complex applications\
    \ or APIs. We can also keep our applications clean and since we can move each\
    \ router definition into its own file then just pull in those files when we call\
    \ `app.use()`:\n\n```\n1 app.use('/', basicRoutes);\n2 app.use('/admin', adminRoutes);\n\
    3 app.use('/api', apiRoutes);\n```\n\n### Routes with Parameters (`/hello/:name`)\n\
    \nTo see how we can add route parameters to our application, let’s say we wanted\
    \ to have a route called `/admin/users/:name` where we could pass in a person’s\
    \ name into the URL and the application would spit out name! we could also use\
    \ this in a real application to pull the information for that user. Let’s see\
    \ what sort of route would look like.\n\n```\n1 // route with parameters (http://localhost:1337/admin/users/:name)\n\
    2 adminRouter.get('/users/:name', function(req, res) {\n3 \tres.send('hello '\
    \ + req.params.name + '!');\n4 });\n```\n\nNow we can visit `http://localhost:1337/admin/users/holly`\
    \ and see our browser spit out holly! `req.params` stores all the data that comes\
    \ from the original user’s request. Easy.\n\n![Express Router Parameters](images/07-node-routing----express-router-parameters.png)\n\
    \nExpress Router Parameters\n\nIn the future, we could use this to grab all the\
    \ user data that matches `holly`. We could then build an administration panel\
    \ to manage our users. Now let’s say we wanted to validate this name somehow.\
    \ Maybe we’d want to make sure it wasn’t naughty. We would do that inside route\
    \ middleware. We’ll use a special middleware for this.\n\n#### Route Middleware\
    \ for Parameters (`.param()`)\n\nWe will use Express’s `.param()` middleware.\
    \ This creates middleware that will run for a certain route parameter. In our\
    \ case, we are using `:name` in our hello route. Again make sure the middleware\
    \ is placed before the request.\n\n```\n1 // route middleware to validate :name\n\
    2 adminRouter.param('name', function(req, res, next, name) {\n3 \t// do validation\
    \ on name here\n4 \t// blah validation\n5 \t// log something so we know its working\n\
    6 \tconsole.log('doing validations on ' + name);\n7 \n8 \t// once validation is\
    \ done save the new item in the req\n9 \treq.name = name;\n10 \t// go to the next\
    \ thing\n11 \tnext(); \n12 });\n13 \n14 // route with parameters (http://localhost:1337/admin/hello/:name)\n\
    15 adminRouter.get('/hello/:name', function(req, res) {\n16 \tres.send('hello\
    \ ' + req.name + '!');\n17 });\n```\n\nNow when we hit the `/hello/:name` route,\
    \ our route middleware will kick in and be used. We can run validations and then\
    \ we’ll pass the new variable to our `.get` route by storing it in `req` (request).\
    \ We then access it by changing `req.params.name` to `req.name` since we took\
    \ `req.params.name` and stored it into `req` in the middleware.\n\nWhen we visit\
    \ our browser at `http://localhost:1337/admin/hello/sally` we’ll see our request\
    \ logged to the console.\n\n![Express Router Parameter Middleware](images/07-node-routing----express-router-parameter-middleware.png)\n\
    \nExpress Router Parameter Middleware\n\nRoute middleware for parameters can be\
    \ used to validate data coming to your application. If you have created a RESTful\
    \ API also, you can validate a token and make sure the user is able to access\
    \ your information. All of the work we’ve done with Node so far will lead to building\
    \ a RESTful API that will become the server-side application that we talked about\
    \ Chapter 3 when we spoke about the client-server model.\n\nThe last Express router\
    \ feature that we’ll look at is how to use `app.route()` to define multiple routes\
    \ at once.\n\n#### Login Routes (`app.route()`)\n\nWe can define our routes right\
    \ on our app. This is similar to using `app.get`, but we will use `app.route`.\
    \ `app.route` is basically a shortcut to call the Express Router. Instead of calling\
    \ `express.Router()`, we can call `app.route` and start applying our routes there.\n\
    \nUsing `app.route()` lets us define multiple actions on a single login route.\
    \ We’ll need a `GET` route to show the login form and a `POST` route to process\
    \ the login form.\n\n```\n1 app.route('/login')\n2 \n3 \t// show the form (GET\
    \ http://localhost:1337/login)\n4 \t.get(function(req, res) {\n5 \t\tres.send('this\
    \ is the login form');\n6 \t})\n7 \n8 \t// process the form (POST http://localhost:1337/login)\n\
    9 \t.post(function(req, res) {\n10 \t\tconsole.log('processing');\n11 \t\tres.send('processing\
    \ the login form!');\n12 \t});\n```\n\nNow we have defined our two different actions\
    \ on our `/login` route. Simple and very clean. These are applied directly to\
    \ our main `app` object in the `server.js` file, but we can also define them in\
    \ the `adminRouter` object we had earlier.\n"
