    you to tweak some settings to give you more support in either direction. Read-write
    locks are scoped to each database, so each node within a database will always
    see the most up-to-date data. Because MongoDB supports **sharding**, once your
    database begins to grow, your data may partition into multiple databases (or shards)
    across several servers. Each shard will be an independent database, together forming
    one collection of databases. This allows for faster queries because you only need
    to access the shard that contains that information rather than the entire database.
    It can also, however, cause inconsistency from shard to shard for a short period
    of time after a write. This is called eventual consistency and is a common compromise
    between consistency and availability.


    **Main Features**


    *   Agile and Scalable


    *   [Document-Oriented Storage](http://docs.mongodb.org/manual/core/data-modeling/)
    - JSON-style documents with dynamic schemas offer simplicity and power.


    *   [Full Index Support](http://docs.mongodb.org/manual/indexes/) - Index on any
    attribute, just like you’re used to.


    *   [Replication & High Availability](http://docs.mongodb.org/manual/replication/)
    - Mirror across LANs and WANs for scale and peace of mind.


    *   [Auto-Sharding](http://docs.mongodb.org/manual/sharding/) - Scale horizontally
    without compromising functionality.


    *   [Querying](http://docs.mongodb.org/manual/applications/read/) - Rich, document-based
    queries.


    *   [Fast In-Place Updates](http://docs.mongodb.org/manual/applications/update/)
    - Atomic modifiers for contention-free performance.


    *   [Map/Reduce](http://docs.mongodb.org/manual/applications/map-reduce/) - Flexible
    aggregation and data processing.


    *   [GridFS](http://docs.mongodb.org/manual/applications/gridfs/) - Store files
    of any size without complicating your stack.


    ### Node.js


    Node is built on Google Chrome’s V8 JavaScript runtime and sits as the server-side
    platform in your MEAN application. So what does that mean? In a LAMP stack you
    have your web server (Apache, Nginx, etc.) running with the server-side scripting
    language (PHP, Perl, Python) to create a dynamic website. The server-side code
    is used to create the application environment by extracting data from the database
    (MYSQL) and is then interpreted by the web server to produce the web page.


    When a new connection is requested, Apache creates a new thread or process to
    handle that request, which makes it **multithreaded**. Often you will have a number
    of idle child processes standing by waiting to be assigned to a new request. If
    you configure your server to only have 50 idle processes and 100 requests come
    in, some users may experience a connection timeout until some of those processes
    are freed up. Of course there are several ways to handle this scalability more
    efficiently, but in general Apache will use one thread per request, so to support
    more and more users you will eventually need more and more servers.


    * * *


    > **Multithreading** A programming model where the flow of the program has multiple
    threads of control. Different parts of the program (threads) will be able to execute
    simultaneously and independently, rather than waiting for each event to finish.
    This is nice for the user who now doesn’t have to wait for every event to finish
    before they get to see some action, but new threads require more memory, so this
    performance comes with a memory trade-off.


    > —


    This is where Node.js shines. Node is an **event driven** language that plays
    the same role as Apache. It will interpret the client-side code to produce the
    web page. They are similar in that each new connection fires a new event, but
    the main distinction comes from the fact that Node is asynchronous and single
    threaded. Instead of using multiple threads that sit around waiting for a function
    or event to finish executing, Node uses only one thread to handle all requests.
    Although this may seem inefficient at first glance, it actually works out well
    given the **asynchronous** nature of Node.


    * * *


    > **Event Driven Programming** The flow of a program is driven by specific events
    (mouse clicks, incoming messages, key presses, etc). Most GUIs are event based
    and this programming technique can be implemented in any language. —


    * * *


    > **Asynchronous Programming** Asynchronous events are executed independently
    of the main program’s “flow”. Rather than doing nothing while waiting for an event
    to occur, the program will pass an event to the event handler queue and continue
    with the main program flow. Once the event is ready, the program will return to
    it with a callback, execute the code, and then return to the main flow of the
    program. Because of this, an asynchronous program will most likely not run in
    the normal top to bottom order that you see with synchronous code. —


    Say, for example, a database query request comes in. Depending on how large the
    query is, it could take a couple of seconds to return anything. Since there is
    only one thread, it may seem that nothing else would be able to process while
    the query is executing. This would of course result in slow load times for your
    users which could be detrimental to the success of your site. Fortunately Node
    handles multiple requests much more gracefully than that by using **callbacks**.


    * * *


    > **Asynchronous Callbacks** A function that is passed as an argument to be executed
    at a later time (when it is ready). Callbacks are used when a function may need
    more time to execute in order to return the correct return values. —


    There are two types of callbacks: synchronous and asynchronous. Synchronous callbacks
    are considered “blocking” callbacks, meaning that your program will not continue
    running until the callback function is finished executing. Because I/O operations
    take a great deal of time to execute, this may make your application appear to
    be slow or even frozen to users. Node’s use of asynchronous callbacks (also known
    as non-blocking callbacks) allow your program to continue executing while I/O
    operations are taking place. Once the operations are complete, they will issue
    an interrupt/callback to tell your program that its ready to execute. Once the
    function is complete, your program will return back to what it was doing. Of course
    having several callbacks throughout your code can get very chaotic very fast,
    so it’s up to you, the programmer, to make sure that you do it correctly.


    #### NPM and Packages


    One of the benefits of Node is its package manager, [npm](https://www.npmjs.org/).
    Like Ruby has RubyGems and PHP has Composer, Node has npm. npm comes bundled with
    Node and will let us pull in a number of packages to fulfill our needs.


    Packages can extend functionality in Node and this package system is one thing
    that makes Node so powerful. The ability to have a set of code that you can reuse
    across all your projects is incredible and makes development that much easier.


    Multiple packages can be brought together and intertwined to create a number of
    complex applications.


    Listed below are a few of the many [popular packages](https://www.npmjs.org/browse/star)
    that are used in Node:


    *   [ExpressJS](http://expressjs.com/) is currently the most starred package on
    [npm’s site](https://www.npmjs.org/browse/star) (we’ll use this in the book of
    course)


    *   [Mongoose](http://mongoosejs.com/) is the package we will use to interact
    with MongoDB.


    *   [GruntJS](http://gruntjs.com/) for automating tasks (we’ll use this later
    in the book)


    *   [PassportJS](http://passportjs.org/) for authentication with many social services.


    *   [Socket.io](http://socket.io/) for building real time websocket applications
    (we’ll use this later in the book)


    *   [Elasticsearch](http://www.elasticsearch.com/) for providing high scalability
    search operations.


    #### Frameworks'
