  trans: "\n随时进入你的 `server.js` 文件并进行修改。然后观察应用程序自动重启时发生的奇迹吧！\n\n![nodemon 启动.](img/05-node-start----nodemon-server.jpg\
    \ \"nodemon server.js\")\n\n`nodemon server.js`\n\n在本书的其余部分，当我们想要启动服务器时，我们会引用\
    \ `nodemon`。它只是开发时的一个更简单的选择。\n\n***\n\n我们现在已经配置了一个非常简单的 Node 应用并从命令行启动了它。我们离构建可以向世界展示的完整\
    \ Node 应用又近了一步。\n\n## 包 (Packages)\n\n包扩展了我们应用程序的功能。正如我们在早前的“入门教程”（Primers）部分中讨论过的，即使是\
    \ MEAN 栈的四个主要部分之一的 Express，也是一个 Node 包。\n\n让我们看看如何添加和安装包。一旦我们讨论了如何将包引入我们的应用程序，我们将迁移到使用\
    \ MEAN 栈的其他组件。\n\n### 安装包\n\n`package.json` 文件是用来定义应用程序名称和启动应用程序的主文件的地方。这也是我们定义所需包的地方。\n\
    \n我们有两种方式可以将包添加到项目中：`直接将其写入 package.json` 和 `通过命令行安装`。这两种方式都会我们将需要的包添加到 `package.json`\
    \ 的 `dependencies` 部分。\n\n#### 方法 1. 直接将包写入 Package.json\n\n这是一个我们添加了 Express\
    \ 依赖的 `package.json` 文件。\n\n```json\n1 {\n2   \"name\": \"packages-install\",\n\
    3   \"main\": \"server.js\",\n4   \"dependencies\": {\n5     \"express\": \"~4.8.6\"\
    \n6   }\n7 }\n```\n\n就是这样，我们现在已经将 Express 设置为应用程序的一个包，并拥有了 MEAN 栈的两个部分！(_E_N)\n\
    \n***\n\n![注意：npm 版本号](img/icon-pencil.png \"请注意\")\n\n注意：npm 版本号\n\n> 你可能在想在\
    \ Express 版本号旁边的那个波浪号 (`~`) 是干什么用的。npm 在声明包版本时使用[语义化版本](https://www.npmjs.org/doc/misc/semver.html)。这意味着波浪号将拉取与你指定的`合理接近`的版本。在这个示例中，只会安装版本大于\
    \ `4.8.6` 且小于 `4.9` 的 Express 版本。\n\n> 这三个数字分别代表该版本的不同部分。例如，在 express 4.8.6 中，4\
    \ 代表主版本，8 代表次版本，6 代表补丁（patch）。通常 bug 修复会被归类为补丁，并且不会破坏任何内容。次版本更新会添加新功能，但仍然不会破坏你之前的代码。而主版本更新可能会破坏现有代码，正如你们中一些可能已经知道的那样，这可能会让你想抓头发。\n\
    \n> 使用这种版本控制是一种良好的实践，因为我们确保了只有我们指定的版本会被拉取到我们的项目中。我们能够获取直到 `4.9` 版本之前的 bug 修复，但不会引入随\
    \ `5.0` 版本而来的任何重大更改。\n\n> 如果我们将来重新访问此应用程序并使用 `npm install`，我们确切知道正在使用哪个版本的 Express，并且不会因为引入自该项目创建后的任何新版本而破坏我们的应用。\n\
    \n***\n\n#### 方法 2. 从命令行添加包\n\n向应用程序添加包的第二方法是使用命令行的 npm 快捷方式。这通常是更简单、更好的路线，因为\
    \ npm 可以自动将包保存到你的 `package.json` 文件中。酷酷的地方在这里：`它会添加正确的版本号`！如果你手动将包写入 `package.json`，你将得在网上寻找正确的版本号。这种方法让生活变得简单得多。\n\
    \n以下是安装 express 的命令，`--save` 修符会将其添加到 `package.json`。\n\n```\nnpm install express\
    \ --save\n```\n\n你会注意到上面的命令获取了 express 包并将其安装在名为 `node_modules` 的新文件夹中。这是 Node\
    \ 项目中包所在地。该命令只安装我们显式调用的包（在本例中为 express）。\n\n### 安装所有包\n\n方法 2 会为我们安装包。方法 1 会将包添加到你的\
    \ `package.json` 中，但还没有安装它们。要将 `package.json` 中 `dependencies` 属性下的所有包安装到 `node_modules`\
    \ 文件夹，只需输入：\n\n```\nnpm install\n```\n\n它将查看我们需要的依赖项并将它们拉取到应用程序的 `node_modules`\
    \ 中。\n\n### 安装多个包\n\nnpm 还提供了一种安装多个包的方便方法。只需在一个 `npm install` 命令中输入所有你需要的包，它们就会被引入项目。\n\
    \n```\nnpm install express mongoose passport --save\n```\n\n这是一种引入所需包的简单快捷的方法。\n\
    \n## 总结\n\n现在当我们想要启动一个新的 Node 项目时，我们只需要在想要创建项目的文件夹中运行两个命令：\n\n1. `npm init`\n\
    2. 在提示时填写必要的字段以创建 `package.json` 文件。\n3. `npm install express --save`\n\n就是这样，我们拥有了设置应用程序所需的所有内容！\n\
    \n让我们继续前进，深入研究使用 Express 和 Node 为我们的 MEAN 栈应用搭建基础。\n\n## 启动 Node 服务器\n\n我们将继续查看设置\
    \ Node 服务器的方法。在上章中，我们只向控制台输出了内容。在本章中我们将向用户发送 HTML 文件。\n\n### 方法 1：纯 Node (无 Express)\n\
    \n使用方法 1 时，我们将引入 Node 内置的两个模块。[http module](https://nodejs.org/api/http.html#http)\
    \ 用于启动 HTTP 服务器并响应用户的请求。[fs module](https://nodejs.org/api/fs.html#file_system)\
    \ 用于读取文件系统。我们需要从文件系统读取 `index.html`，然后通过 HTTP 服务器将其传递给用户。\n\n### 示例应用程序\n\n在本章的示例中，我们需要一个包含以下文件的文件夹：\n\
    \n*   package.json\n*   server.js\n*   index.html\n\n正如之前学的，`package.json` 将项目的配置/包，而\
    \ `server.js` 将包含应用程序设置和配置。我们的 `index.html` 将是一个基础 HTML 文件。\n\n`package.json`\
    \ 和 `index.html` 对于两种方法都是相同的。两种方法之间变化的文件只有 `server.js`，因为那是启动 Node 服务器的地方。\n\n\
    #### package.json\n\n这是我们简单的 `package.json` 文件：\n\n```json\n1 {\n  \"name\": \"\
    http-server\",\n  \"main\": \"server.js\"\n}\n```\n\n#### index.html\n\n让我们填写一个简单的\
    \ `index.html` 文件：\n\n```html\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3 <head>\n\
    \ 4 \t<meta charset=\"UTF-8\">\n 5 \t<title>Super Cool Site</title>\n 6 \t<style>\n\
    \ 7 \t\tbody { \n 8 \t\t\ttext-align:center; \n 9 \t\t\tbackground:#EFEFEF; \n\
    \ 10 \t\t\tpadding-top:50px;\n 11 \t\t}\n 12 \t</style>\n 13 </head>\n 14 <body>\n\
    \ 15 \n 16 \t<h1>Hello Universe!</h1>\n 17 \t\n 18 </body>\n 19 </html>\n```\n\
    \n#### 方法 2：使用 Express\n\n由于 Express 是 MEAN 栈的主要部分之一，我们希望使用这种方法。在学习学习了这种方法后，你可能再也不想回头了。\n"
- fmt: "\n```\n 1 // get the http and filesystem modules\n 2 var http = require('http'),\n\
    \ 3   fs = require('fs');\n 4 \n 5 // create our server using the http module\n\
    \ 6 http.createServer(function(req, res) {\n 7 \n 8   // write to our server.\
    \ set configuration for the response\n 9   res.writeHead(200, {\n10     'Content-Type':\
    \ 'text/html',\n11     'Access-Control-Allow-Origin' : '*'\n12   });\n13 \n14\
    \   // grab the index.html file using fs\n15   var readStream = fs.createReadStream(__dirname\
    \ + '/index.html');\n16 \n17   // send the index.html file to our user\n18   readStream.pipe(res);\
    \  \n19 \n20 }).listen(1337);\n21 \n22 // tell ourselves what's happening\n23\
    \ console.log('Visit me at http://localhost:1337');\n```\n\nWe are using the `http`\
    \ module to create a server and the `fs` module to grab an index file and send\
    \ it in our response to the user.\n\nWith our `server.js` file defined, let’s\
    \ go into our command line and start up our Node http server.\n\n`nodemon server.js`\n\
    \nYou should see your server start up and a message logged to the console.\n\n\
    ![Node HTTP Server Console](images/06-node-server----http-server-console.jpg)\n\
    \nNode HTTP Server Console\n\nNow we can see our site in browser at `http://localhost:1337`.\n\
    \n![Hello Universe Browser](images/06-node-server----hello-browser.jpg)\n\nHello\
    \ Universe Browser\n\nWe’ve finally sent an HTML file to our users! You may be\
    \ thinking that setting up that http server took a lot of syntax that you might\
    \ not be able to remember. Don’t worry though, the Express way is much cleaner.\n\
    \n### Method #2: Using Express\n\nNow that we have started up a server using the\
    \ HTTP module, let’s look at how we can do the same with Express. You’ll find\
    \ that it’s much easier to manage the code.\n\nWe will first need to add Express\
    \ to this project. Let’s use the command line to install it and save it to our\
    \ `package.json`.\n\n`npm install express --save`\n\nNow let’s change our `server.js`\
    \ file to accommodate Express. We’ll start by calling Express. Using that instance\
    \ of Express, we will define a route and send the `index.html` file. Then we’ll\
    \ “listen” on a certain port for a request from the browser.\n\n```\n 1 // load\
    \ the express package and create our app\n 2 var express = require('express');\n\
    \ 3 var app     = express();\n 4 var path = require('path');\n 5   \n 6 // send\
    \ our index.html file to the user for the home page\n 7 app.get('/', function(req,\
    \ res) {\n 8 \tres.sendFile(path.join(__dirname + '/index.html'));\n 9 });\n10\
    \ \n11 // start the server\n12 app.listen(1337);\n13 console.log('1337 is the\
    \ magic port!');\n```\n\nNow we have grabbed Express, set a port, and started\
    \ our server. Express has made the job of starting a server much easier and the\
    \ syntax is cleaner. Starting up this server using `nodemon server.js` will spit\
    \ out our HTML file to users at `http://localhost:1337` again.\n\nWe’ll see the\
    \ same result as before, but now the code is a little easier to follow.\n\n![Hello\
    \ Universe Browser](images/06-node-server----hello-browser.jpg)\n\nHello Universe\
    \ Browser\n\n* * *\n\n![Tip](images/icon-heart.png \"Pro Tip\")\n\nTip\n\n###\
    \ Defining Packages Shortcut\n\nJust a quick tip when defining packages, instead\
    \ of typing out `var` every time you define a package, you can string the packages\
    \ together using a `\",\"`.\n\nHere’s an example:\n\n```\n1 var express = require('express');\n\
    2 var app = express();\n3 \n4 // the exact same result\n5 \n6 var express = require('express'),\n\
    7     app = express();\n```\n\nThis just tidies up your code a bit and lets you\
    \ skip a few extra keystrokes.\n\n* * *\n\nWe can now create a Node server and\
    \ send HTML files to our users. We’ve defined a simple `get` route so far. Let’s\
    \ take the next step and add more routes and pages to our site.\n\n## Routing\
    \ Node Applications\n\nTo add more pages to our site, we will need more routes.\
    \ This can be done using a feature built into Express, the Express Router. This\
    \ is going to be a big chapter since routing is going to be a giant portion of\
    \ all our applications moving forward. This is how we route basic to advanced\
    \ websites, and also how we will ultimately build out our RESTful APIs that an\
    \ Angular frontend application will consume. That’s exciting to look forward that\
    \ far! One step at a time though. Let’s get to the routing.\n\n### Express Router\n\
    \nWhat exactly is the Express Router? You can consider it a mini express application\
    \ without all the bells and whistles, just the routing stuff. It doesn’t bring\
    \ in views or settings, but provides us with the routing APIs like `.use()`, `.get()`,\
    \ `.param()`, and `.route()`. Let’s take a look at exactly what this means.\n\n\
    There are a few different ways to use the router. We’ve already used one of the\
    \ methods when we created the home page route in the last chapter by using `app.get('/',\
    \ \\dots)`. We’ll look at the other methods by building out more sections of our\
    \ site and discuss why and when to use them.\n\n### Sample Application Features\n\
    \nThese are the main features we will add to our current application:\n\n* Basic\
    \ Routes (We’ve already created the homepage)\n* Site Section Routes (Admin section\
    \ with sub routes)\n* Route Middleware to log requests to the console\n* Route\
    \ with Parameters (`http://localhost:1337/users/holly`)\n* Route Middleware for\
    \ Parameters to validate specific parameters\n* Login routes doing a GET and POST\
    \ on `/login`\n* Validate a parameter passed to a certain route\n\n**What is Route\
    \ Middleware?** Middleware is invoked between a user’s request and the final response.\
    \ We’ll go over this concept when we log data to the console on every request.\
    \ A user will request the page, we will log it to the console (the middleware),\
    \ and then we’ll respond with the page they want. More on middleware soon.\n\n\
    Like we’ve done so far, we will keep our routes in `server.js`. We won’t need\
    \ to make any changes to `package.json`.\n\n### Basic Routes\n\nWe’ve already\
    \ defined our basic route for the home page. Express lets us define routes right\
    \ onto the `app` object. We can also handle multiple actions like `GET`, `POST`,\
    \ `PUT/PATCH`, and `DELETE`.\n\nThis is the easiest way to define routes, but\
    \ as our application gets larger, we’ll need more organization for our routes.\
    \ Just imagine an application that has an administration section and a frontend\
    \ section, each with multiple routes.\n\n### express.Router()\n\nThe [express.Router](https://expressjs.com/api#router)\
    \ acts as a mini application. You can call an instance of it (like we do for Express)\
    \ and then define routes on that. Let’s look at an example so we know exactly\
    \ what this means. Add this to your `server.js` if you’d like to follow along.\n\
    \nUnderneath our `app.get()` route inside `server.js`, add the following. We’ll\
    \ 1. **call an instance of the router** 2. **apply routes to it** 3. and then\
    \ **add those routes to our main app**\n\n```\n 1 // create routes for the admin\
    \ section\n 2 \n 3 // get an instance of the router\n 4 var adminRouter = express.Router();\n\
    \ 5 \n 6 // admin main page. the dashboard (http://localhost:1337/admin)\n 7 adminRouter.get('/',\
    \ function(req, res) {\n 8 \tres.send('I am the dashboard!');\n 9 });\n10 \n 11\
    \ // users page (http://localhost:1337/admin/users)\n 12 adminRouter.get('/users',\
    \ function(req, res) {\n 13 \tres.send('I show all the users!');\n 14 });\n 15\
    \ \n 16 // posts page (http://localhost:1337/admin/posts)\n 17 adminRouter.get('/posts',\
    \ function(req, res) {\n 18 \tres.send('I show all the posts!');\n 19 });\n 20\
    \ \n 21 // apply the routes to our application\n 22 app.use('/admin', adminRouter);\n\
    ```\n\nWe will call an instance of the `express.Router()` and assign it to the\
    \ `adminRouter` variable, apply routes to it, and then tell our application to\
    \ use those.\n"
