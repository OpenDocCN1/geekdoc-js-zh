  trans: "\n到目前为止，我们已经创建了一个 Node API 并使用 JSON 令牌（JWT）对其进行身份验证。这些一直都是服务器端代码，现在我们将使用刚刚学到的信息将其与前端集成。\n\
    \n这里的目标是开始编写一个 Angular 应用程序，而不需要修改后端。像这样这样处理你的应用程序可以模拟类似的情况，即后端 API 由你以外的人构建和维护（例如\
    \ Facebook、Twitter 或 GitHub API）。我们只有前端代码的访问权限。\n\n构建一个与后端 API 通信的应用程序时，第一步是处理身份验证。毕竟，如果不通过身份验证，我们就无法从\
    \ API 中获取任何数据。\n\n## 接入我们的 Node API\n\n我们在第 9 章和第 10 章中使用 JSON Web Token 身份验证创建\
    \ Node API 时，我们开发了一个 API 端点（`POST http://localhost:8080/api/authenticate`），我们可以在那里发送用户名和密码来接收\
    \ JWT。\n\n由于我们的后端已经有了身份验证和提供令牌的工具，我们只需要将前端 Angular 应用连接到该端点，将 JWT 存储在客户端，然后就可以访问\
    \ API 中所有经过身份验证的路由。\n\n## 身份验证服务\n\n我们将构建两个不同的服务，一个用于身份验证，另一个用于连接我们的 API 并获取用户数据。通常情况下，如果你从或向外部源获取或发送数据，服务可能是你的首选工具。\n\
    \n为了验证用户，我们将创建一个 `authService`。它将具有 3 个主功能：\n\n* 主身份验证函数（登录、注销、获取当前用户、检查是否登录）\n\
    * 令牌验证函数（获取令牌、保存令牌）\n* 身份验证拦截器（将令牌附加到 HTTP 请求中，未登录时重定向）\n\n这三个工厂中的每一个都有非常特定的用途，这就是为什么我们不能只创建一个。\n\
    \n主身份验证函数将暴露给我们的应用程序并在控制器内部使用。\n\n身份验证拦截器将负责将令牌附加到所有 HTTP 请求中。记住，在基于令牌的身份验证中，所有经过验证的请求都需要令牌；这个拦截器就是我们实现这种附加的方式。该拦截器还负责在用户未通过验证时将用户重定向到登录页面。\n\
    \n令牌验证函数更像是一个供其他两个身份验证工厂使用的私有工厂。它只需要保存令牌或从本地存储中获取令牌。\n\n以下是我们的文件内容的概览：\n\n```\n\
    \ 1 angular.module('authService', [])\n 2 \n 3 // ===================================================\n\
    \ 4 // 用于登录和获取信息的 auth 工厂\n 5 // 注入 $http 用于与 API 通信\n 6 // 注入 $q 返回 promise 对象\n\
    \ 7 // 注入 AuthToken 管理令牌\n 8 // ===================================================\n\
    \ 9 .factory('Auth', function($http, $q, AuthToken) {\n10 \n11   // 创建 auth 工厂\
    \ 对象\n12   var authFactory = {};\n13 \n14   // 处理登录\n15 \n16   // 处理注销\n17 \n\
    18   // 检查用户是否登录\n19 \n20   // 获取用户信息\n21 \n22   // 返回 auth 工厂 对象\n23   return\
    \ authFactory;\n24 \n25 })\n26 \n27 // ===================================================\n\
    \ 28 // 处理令牌的工厂\n 29 // 注入 $window 在客户端存储令牌\n 30 // ===================================================\n\
    31 .factory('AuthToken', function($window) {\n32 \n33   var authTokenFactory =\
    \ {};\n34 \n35   // 获取令牌\n36 \n37   // 设置令牌或清除令牌\n38 \n39   return authTokenFactory;\n\
    40 \n41 })\n42 \n43 // ===================================================\n 44\
    \ // 将令牌集成到请求中的应用程序配置\n 45 // ===================================================\n\
    46 .factory('AuthInterceptor', function($q, AuthToken) {\n47 \n48   var interceptorFactory\
    \ = {};\n49 \n50   // 为每个请求附加令牌\n51 \n52   // 如果令牌未通过身份验证则重定向\n53 \n54   return\
    \ interceptorFactory;\n55 \n56 });\n```\n\n这些是我们即将创建的三个工厂，它们都整合在一个名为 `authService`\
    \ 的 Angular 模块中。对于每个工厂，我们都创建了一个新对象，将函数附加到对象上并返回该对象。\n\n注意，我们能够将一个工厂注入另一个工厂中。我们在其他两个工厂中使用了\
    \ `AuthToken` 工厂。我们还向工厂中注入了一些 Angular 模块，如 `$http`、`$q` 和 `$location`。\n\n`$location`\
    \ 将用于重定向用户的模块。这就是我们在仍然使用 Angular 路由机制的同时进行重定向的方法。这意味着用户将在不刷新页面的情况下被重定向。\n\n`$q`\
    \ 是用于返回 promise 的模块。它允许我们异步运行函数并在处理完成时返回它们的值。在上一章中，我们使用 `success()`、`error()`\
    \ 和 `then()` 来处理 promise；在返回 `$q` 时，我们也可以使用这些函数。\n\n让我们逐一查看这些工厂，以便我们看到整个 `authService`\
    \ 是如何工作的。\n\n### 身份令牌工厂\n\n我们将从 `AuthTokenFactory` 开始，因为它将被其他两个工厂使用。要检查本地存储中的内容，只需进入\
    \ 开发者工具，点击 Resources（资源），然后查看 Local Storage（本地存储）标签页。\n\n![Local Storage](img/16-authentication----local-storage.jpg)\n\
    \nLocal Storage\n\n以下是 `AuthTokenFactory` 的代码：\n\n```\n1 // ===================================================\n\
    \ 2 // 处理令牌的工厂\n 3 // 注入 $window 在客户端存储令牌\n 4 // ===================================================\n\
    5 .factory('AuthToken', function($window) {\n6 \n7   var authTokenFactory = {};\n\
    8 \n9   // 从本地存储中获取令牌\n10   authTokenFactory.getToken = function() {\n11     return\
    \ $window.localStorage.getItem('token');\n12   };\n13 \n14   // 设置令牌或清除令牌的函数\n\
    15   // 如果传递了令牌，则设置令牌\n16   // 如果没有令牌，则从本地存储中清除\n17   authTokenFactory.setToken\
    \ = function(token) {\n18     if (token)\n19       $window.localStorage.setItem('token',\
    \ token);\n20     else\n21       $window.localStorage.removeItem('token');\n22\
    \   };\n23 \n24   return authTokenFactory;\n25 \n26 })\n```\n\n这里这里有两个函数。`getToken()`\
    \ 和 `setToken()`。`$window.localStorage` 是我们在本地存储中添加、设置或删除项目的方法。\n\n接下来，让我们创建将在应用程序控制器使用的主身份验证工厂。\n\
    \n### 身份验证工厂\n\n主身份验证工厂将包含登录用户、注销用户、检查用户是否登录以及获取用户信息所需的函数。\n\n让我们看看那个工厂是什么样子：\n\
    \n"
- fmt: "\n```javascript\n // ===================================================\n\
    \ // auth factory to login and get information\n // inject $http for communicating\
    \ with the API\n // inject $q to return promise objects\n // inject AuthToken\
    \ to manage tokens\n // ===================================================\n\
    .factory('Auth', function($http, $q, AuthToken) {\n\n  // create auth factory\
    \ object\n  var authFactory = {};\n\n  // log a user in\n  authFactory.login =\
    \ function(username, password) {\n\n    // return the promise object and its data\n\
    \    return $http.post('/api/authenticate', {\n      username: username,\n   \
    \   password: password\n    })\n      .success(function(data) {\n        AuthToken.setToken(data.token);\n\
    \        return data;\n      });\n  };\n\n  // log a user out by clearing the\
    \ token\n  authFactory.logout = function() {\n    // clear the token\n    AuthToken.setToken();\n\
    \  };\n\n  // check if a user is logged in\n  // checks if there is a local token\n\
    \  authFactory.isLoggedIn = function() {\n    if (AuthToken.getToken()) \n   \
    \   return true;\n    else\n      return false; \n  };\n\n  // get the logged\
    \ in user\n  authFactory.getUser = function() {\n    if (AuthToken.getToken())\n\
    \      return $http.get('/api/me');\n    else\n      return $q.reject({ message:\
    \ 'User has no token.' });    \n  };\n\n  // return auth factory object\n  return\
    \ authFactory;\n\n})\n```\n\nWe have 4 functions that will either return a promise\
    \ object (through `$http` or `$q`) or a simple `true/false`.\n\n`login` will create\
    \ an `$http.post()` request to the `/api/authenticate` endpoint on our Node API.\n\
    \n`logout` will simply use the `AuthToken` factory to clear the token.\n\n`isLoggedIn`\
    \ will return true or false depending on if the token exists in local storage.\n\
    \n`getUser` will create an `$http.get()` request to the `/me` API endpoint to\
    \ get the logged in user’s information.\n\nNext, we’ll create the interceptor\
    \ factory.\n\n## AuthInterceptor Factory\n\nThe `AuthInterceptor` factory will\
    \ be responsible for attaching the token to all HTTP requests coming from our\
    \ frontend application.\n\n```javascript\n // ===================================================\n\
    \ // application configuration to integrate token into requests\n // ===================================================\n\
    .factory('AuthInterceptor', function($q, $location, AuthToken) {\n\n  var interceptorFactory\
    \ = {};\n\n  // this will happen on all HTTP requests\n  interceptorFactory.request\
    \ = function(config) {\n\n    // grab the token\n    var token = AuthToken.getToken();\n\
    \n    // if the token exists, add it to the header as x-access-token\n    if (token)\
    \ \n      config.headers['x-access-token'] = token;\n    \n    return config;\n\
    \  };\n\n  // happens on response errors\n  interceptorFactory.responseError =\
    \ function(response) {\n\n    // if our server returns a 403 forbidden response\n\
    \    if (response.status == 403) {\n      AuthToken.setToken();\n      $location.path('/login');\n\
    \    }\n\n    // return the errors from the server as a promise\n    return $q.reject(response);\n\
    \  };\n\n  return interceptorFactory;\n  \n });\n```\n\nAn interceptor in Angular\
    \ will allow us to react to different HTTP request scenarios. When creating an\
    \ interceptor, we have a few options available to us.\n\n* `request` lets us intercept\
    \ requests before they are sent\n* `response` lets us change the response that\
    \ we get back from a request\n* `requestError` captures requests that have been\
    \ cancelled\n* `responseError` catches backend calls that fail. In this case,\
    \ we will use it to catch 403 Forbidden errors if the token does not validate\
    \ or does not exist.\n\nIf we receive a 403 error from our backend, we will be\
    \ forced to redirect the user to the login page using `$location.path('/login')`.\
    \ We will also clear any tokens in storage since those weren’t good enough to\
    \ validate our user.\n\nThose are the three factories necessary for creating authentication\
    \ in an Angular application. We are able to communicate with the backend API,\
    \ get and set tokens client-side, and attach the token to all our requests.\n\n\
    ## The Entire Auth Service File (authService.js)\n\n```javascript\n angular.module('authService',\
    \ [])\n  \n // ===================================================\n // auth factory\
    \ to login and get information\n // inject $http for communicating with the API\n\
    \ // inject $q to return promise objects\n // inject AuthToken to manage tokens\n\
    \ // ===================================================\n.factory('Auth', function($http,\
    \ $q, AuthToken) {\n\n  // create auth factory object\n  var authFactory = {};\n\
    \n  // log a user in\n  authFactory.login = function(username, password) {\n\n\
    \    // return the promise object and its data\n    return $http.post('/api/authenticate',\
    \ {\n      username: username,\n      password: password\n    })\n      .success(function(data)\
    \ {\n        AuthToken.setToken(data.token);\n        return data;\n      });\n\
    \  };\n\n  // log a user out by clearing the token\n  authFactory.logout = function()\
    \ {\n    // clear the token\n    AuthToken.setToken();\n  };\n\n  // check if\
    \ a user is logged in\n  // checks if there is a local token\n  authFactory.isLoggedIn\
    \ = function() {\n    if (AuthToken.getToken()) \n      return true;\n    else\n\
    \      return false; \n  };\n\n  // get the logged in user\n  authFactory.getUser\
    \ = function() {\n    if (AuthToken.getToken())\n      return $http.get('/api/me');\n\
    \    else\n      return $q.reject({ message: 'User has no token.' });    \n  };\n\
    \n  // return auth factory object\n  return authFactory;\n\n})\n\n // ===================================================\n\
    \ // factory for handling tokens\n // inject $window to store token client-side\n\
    \ // ===================================================\n.factory('AuthToken',\
    \ function($window) {\n\n  var authTokenFactory = {};\n\n  // get the token out\
    \ of storage\n  authTokenFactory.getToken = function() {\n    return $window.getItem('token');\n\
    \  };\n\n  // function to set token or clear token\n  // if a token is passed,\
    \ set the token\n  // if there is no token, clear it from local storage\n  authTokenFactory.setToken\
    \ = function(token) {\n    if (token)\n      $window.setItem('token', token);\n\
    \    else\n      $window.removeItem('token');\n  };\n\n  return authTokenFactory;\n\
    \n})\n\n // ===================================================\n // application\
    \ configuration to integrate token into requests\n // ===================================================\n\
    .factory('AuthInterceptor', function($q, $location, AuthToken) {\n\n  var interceptorFactory\
    \ = {};\n\n  // this will happen on all HTTP requests\n  interceptorFactory.request\
    \ = function(config) {\n\n    // grab the token\n    var token = AuthToken.getToken();\n\
    \n    // if the token exists, add it to the header as x-access-token\n    if (token)\
    \ \n      config.headers['x-access-token'] = token;\n    \n    return config;\n\
    \  };\n\n  // happens on response errors\n  interceptorFactory.responseError =\
    \ function(response) {\n\n    // if our server returns a 403 forbidden response\n\
    \    if (response.status == 403)\n      $location.path('/login');\n\n    // return\
    \ the errors from the server as a promise\n    return $q.reject(response);\n \
    \ };\n\n  return interceptorFactory;\n  \n });\n```\n\n### Conclusion\n\nWe now\
    \ have our two great Angular services that we can use in our application. These\
    \ two services will be the glue between the frontend Angular application and the\
    \ backend Node application.\n"
