- fmt: "\n```\n1 var superSecret = 'ilovescotchscotchyscotchscotch';\n```\n\nWith\
    \ the package that we need and secret ready to go, let’s move onto authenticating\
    \ a user.\n\n## Create a Sample User\n\nFirst, we need to make sure that we even\
    \ have a user to authenticate since towards the end of last chapter, we deleted\
    \ everyone. Let’s create the user using the `POST http://localhost:8080/api/users`\
    \ route we created in our API to add a user to our database.\n\nWe will send a\
    \ `POST` request with the following information:\n\n**Name** Chris **Username**\
    \ chris **Password** supersecret\n\n![Create Sample User](images/10-node-authentication----create-user.jpg)\n\
    \nCreate Sample User\n\nSince there is no authentication yet, the user will be\
    \ created just fine. Now that we have our user, let’s create the authentication\
    \ mechanism for him to sign in and get a token.\n\n## Authenticating A User and\
    \ Giving a Token\n\nWe will create a new route inside of our API routes called\
    \ `POST http://localhost/api/authenticate`. This is where a user will send `POST`\
    \ request with username and password. If both of those check out, they will receive\
    \ a token so that they can access the information from our API.\n\nThe order of\
    \ how we create our routes is important here. We don’t want this `authenticate`\
    \ route to be protected by our authentication middleware, so it will **be placed\
    \ before the middleware** that we created in Chapter 9. Here is a look at its\
    \ placement:\n\n```\n 1 // basic route for the home page\n 2 app.get('/', ...\n\
    \ 3 \n 4 // get an instance of the express router\n 5 var apiRouter = express.Router();\n\
    \ 6 \n 7 // route for authenticating users\n 8 apiRouter.post('/authenticate',\
    \ ...\n 9 \n10 // middleware to use for all requests\n11 apiRouter.use(function(req,\
    \ res, next) ...\n12 \n13 // other api routes. the authenticated routes\n14 apiRouter.get('/',\
    \ ...\n```\n\nInside of the `apiRouter.post('/authenticate', ...` route is where\
    \ we will be creating the JSON Web Token and returning it to our user.\n\nLet’s\
    \ create the route to authenticate our user. We will:\n\n* Check to make sure\
    \ a user with that username exists\n* Check to make sure that the user has the\
    \ correct password (by comparing their password to the hashed one saved in the\
    \ database)\n* Create a token if all is well\n\n```\n 1 // route to authenticate\
    \ a user (POST http://localhost:8080/api/authenticate)\n 2 apiRouter.post('/authenticate',\
    \ function(req, res) {\n 3 \n 4   // find the user\n 5   // select the name username\
    \ and password explicitly\n 6   User.findOne({\n 7     username: req.body.username\n\
    \ 8   }).select('name username password').exec(function(err, user) {\n 9 \n10\
    \     if (err) throw err;\n11 \n12     // no user with that username was found\n\
    13     if (!user) {\n14       res.json({ \n15         success: false, \n16   \
    \      message: 'Authentication failed. User not found.' \n17       });\n18  \
    \   } else if (user) {\n19 \n20       // check if password matches\n21       var\
    \ validPassword = user.comparePassword(req.body.password);\n22       if (!validPassword)\
    \ {\n23         res.json({ \n24           success: false, \n25           message:\
    \ 'Authentication failed. Wrong password.' \n26         });\n27       } else {\n\
    28 \n29         // if user is found and password is right\n30         // create\
    \ a token\n31         var token = jwt.sign({\n32           name: user.name,\n\
    33           username: user.username\n34         }, superSecret, {\n35       \
    \    expiresInMinutes: 1440 // expires in 24 hours\n36         });\n37 \n38  \
    \       // return the information including token as JSON\n39         res.json({\n\
    40           success: true,\n41           message: 'Enjoy your token!',\n42  \
    \         token: token\n43         });\n44       }   \n45 \n46     }\n47 \n48\
    \   });\n49 });\n```\n\nThis route does the main things that we need it to do:\
    \ **check if the user with that username exists**, **make sure that the password\
    \ is correct** using the `comparePassword` method we created in Chapter 9 on our\
    \ User model, and **create a token**.\n\nWe are using the `jwt` (jsonwebtoken)\
    \ package to sign the token. This package will automatically generate the header\
    \ and the signature of our JWT when we pass in the payload, which in this case\
    \ is our user.\n\nNow, when we try to authenticate a user using the credentials\
    \ we used earlier with a `POST` request to `http://localhost:8080/api/authenticate`\
    \ along with the information we used to create a user (chris/supersecret), we\
    \ will be given the token back!\n\n![Authenticate User and Get a Token](images/10-node-authentication----authenticate-user.jpg)\n\
    \nAuthenticate User and Get a Token\n\nWe can also test our authentication route\
    \ with the wrong username:\n\n![Authenticate Wrong Username](images/10-node-authentication----authenticate-wrong-user.jpg)\n\
    \nAuthenticate Wrong Username\n\nAnd here it is with the wrong password:\n\n![Authenticate\
    \ Password](images/10-node-authentication----wrong-password.jpg)\n\nAuthenticate\
    \ Password\n\n## Testing Our Route Middleware\n\nNow that we have built out the\
    \ middleware that is responsible for protecting all the routes that follow it,\
    \ let’s test what we’ve just made to make sure that it works properly.\n\nHere\
    \ is an attempt at trying to reach the main API route without passing in any authentication:\n\
    \n![No Token Provided](images/10-node-authentication----unauthenticated.jpg)\n\
    \nNo Token Provided\n"
