  trans: "\nNode 的包管理器将引入我们在 `package.json` 中定义的所有包。简单且易用。现在我们已经有了这些包，让我们在设置 API 时开始使用它们吧。\n\
    \n我们将通过 `server.js` 文件来设置应用程序，因为这是我们在 `package.json` 中声明的主文件。\n\n## 设置我们的服务器 (server.js)\n\
    \nNode 在启动应用程序时会查看此文件，以便它知道我们想要如何配置应用程序和 API。\n\n我们将从启动应用程序所需的最基本要素开始。我们将保持代码的整洁并进行良好的注释，这样我们就能准确了解每一步发生了什么。\n\
    \n```javascript\n 1 // BASE SETUP\n 2 // ======================================\n\
    \ 3 \n 4 // CALL THE PACKAGES --------------------\n 5 var express    = require('express');\
    \ // 调用 express\n 6 var app        = express(); // 使用 express 定义我们的 app\n 7 var\
    \ bodyParser = require('body-parser'); // 获取 body-parser\n 8 var morgan     =\
    \ require('morgan'); // 用于查看请求\n9 var mongoose   = require('mongoose'); // 用于处理我们的数据库\n\
    10 var port       = process.env.PORT || 8080; // 为我们的应用设置端口\n 11 \n12 // APP CONFIGURATION\
    \ ---------------------\n13 // 使用 body parser，以便我们可以从 POST 请求中获取信息\n14 app.use(bodyParser.urlencoded({\
    \ extended: true }));\n15 app.use(bodyParser.json());\n16 \n17 // 配置我们的应用以处理 CORS\
    \ 请求\n18 app.use(function(req, res, next) {\n19   res.setHeader('Access-Control-Allow-Origin',\
    \ '*');\n20   res.setHeader('Access-Control-Allow-Methods', 'GET, POST');\n21\
    \   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
    \ \\\n22 Authorization');\n23   next();\n24 });\n25 \n26 // 将所有请求记录到控制台 \n27 app.use(morgan('dev'));\n\
    28 \n29 // ROUTES FOR OUR API\n30 // =============================\n31 \n32 //\
    \ 首页的基础路由\n33 app.get('/', function(req, res) {\n34 \tres.send('Welcome to the\
    \ home page!');\n35 });\n36 \n37 // 获取 express 器的实例\n38 var apiRouter = express.Router();\n\
    39 \n40 // 测试路由以确保一切运行正常 \n41 // 访问地址为 GET http://localhost:8080/api\n42 apiRouter.get('/',\
    \ function(req, res) {\n43 \tres.json({ message: 'hooray! welcome to our api!'\
    \ });\t\n44 });\n45 \n46 // 更多 API 路由将在这里\n47 \n48 // REGISTER OUR ROUTES -------------------------------\n\
    49 // 我们所有的路由将以 /api 为前缀\n50 app.use('/api', apiRouter);\n51 \n52 // START THE\
    \ SERVER\n53 // ===============================\n54 app.listen(port);\n55 console.log('Magic\
    \ happens on port ' + port);\n```\n\n哇，我们做了很多工作！不过这一切都很简单，让我们仔细过一遍吧。\n\n**基础设置\
    \ (Base Setup)**：在基础设置中，我们引入了之前通过 `npm` 引入的所有包。我们将获取 `express`、`mongoose`，定义我们的应用，获取\
    \ `bodyParser` 并配置我们的应用使用它。我们还可以为应用程序设置 `port`，并获取稍后定义的用户模型。\n\n我们正在设置配置以允许来自其他域的请求，防止\
    \ CORS 错误。这允许任何域名访问我们的 API。\n\n**API 路由 (Routes for Our API)**：此部分将包含我们所有的路由。使用\
    \ `Express Router` 的结构允许我们引入路由实例。然后我们可以定义路由，并将这些路由应用到根 URL（在本例中为 API）。 true 一个首页路由用于打招呼；这只是一个为了确保一切运行正常的基础路由。\n\
    \n**启动服务器 (Start the Server)**：我们将让 `express` 应用监听我们之前定义的 `port`。。，我们的应用程序就会上线，我们可以对它进行测试了！\n\
    \n## 启动服务器并测试\n\n让我们确保到目前为止一切都运行正常。我们将启动 Node 应用，然后向我们定义的唯一路由发送请求，以确保我们收收到响应。\n\
    \n让我们启动服务器。在命令行中输入：\n\n```bash\nnodemon server.js\n```\n\n你应该能看到你的 Node 应用已启动，Express\
    \ 将创建一个服务器。\n\n![Starting Node Server](img/09-restful-api----start-node-server.jpg)\n\
    \n启动 Node 服务器\n\n现在我们知道应用程序已经运行了，让我们测试一下它。你应该可以通过访问基础路由 `http://localhost:8080`\
    \ 看到我们返回的消息。现在让我们测试其他剩余的路由（API 路由）。\n\n![Basic Route](img/09-restful-api----basic-route.jpg)\n\
    \n基础路由\n\n### 使用 Postman 测试我们的 API\n\n现在在浏览器中导航到 `http://localhost:8080/api`，你将看到我们的\
    \ JSON 消息。看到它固然，但测试 API 的最佳方法是使用专门为此构建的工具。Postman 将帮助我们测试 API。\n\n"
- fmt: "\n```javascript\n 1 // grab the packages that we need for the user model\n\
    \ 2 var mongoose = require('mongoose');\n 3 var Schema = mongoose.Schema;\n 4\
    \ var bcrypt = require('bcrypt-nodejs');\n 5 \n 6 // user schema \n 7 var UserSchema\
    \   = new Schema({\n 8 \tname: String,\n 9     username: { type: String, required:\
    \ true, index: { unique: true }},\n10     password: { type: String, required:\
    \ true, select: false }\n11 });\n12 \n13 // hash the password before the user\
    \ is saved\n14 UserSchema.pre('save', function(next) {\n15 \tvar user = this;\n\
    16 \n17 \t// hash the password only if the password has been changed or user is\
    \ new\n18 \tif (!user.isModified('password')) return next();\n19 \n20 \t// generate\
    \ the hash\n21 \tbcrypt.hash(user.password, null, null, function(err, hash) {\n\
    22 \t\tif (err) return next(err);\n23 \n24 \t\t// change the password to the hashed\
    \ version\n25 \t\tuser.password = hash;\n26 \t\tnext();\n27 \t});\n28 });\n29\
    \ \n30 // method to compare a given password with the database hash\n31 UserSchema.methods.comparePassword\
    \ = function(password) {\n32 \tvar user = this;\n33 \n34 \treturn bcrypt.compareSync(password,\
    \ user.password);\n35 };\n36 \n37 // return the model\n38 module.exports = mongoose.model('User',\
    \ UserSchema);\n```\n\nThere is a lot happening here, but it’s fairly simple.\
    \ We must create our Schema. We are defining `name`, `username`, and `password`\
    \ as `Strings`. By setting the `index` and `unique` attributes, we are telling\
    \ Mongoose to create a unique index for this path. This means that a username\
    \ can not be duplicated. Another mongoose feature that we will implement is `select:\
    \ false` on the password attribute. When we query the list of users or a single\
    \ user, there will be no need to provide the password. By setting `select` to\
    \ `false`, the password will not be returned when listing our users, unless it\
    \ is explicitly called.\n\nWe are also creating a function using `pre` that will\
    \ ensure that the password is hashed before we save the user.\n\n> It is always\
    \ important to make sure that we are not saving plaintext passwords to the database.\
    \ We have to make sure our applications are as secure as can be from the start.\n\
    \nWith mongoose, we are also creating a method on our user model to compare the\
    \ password with a given hash. This is how we will authenticate our users in Chapter\
    \ 10.\n\nWith that file created, let’s pull it into our `server.js` so that we\
    \ can use it within our application. We’ll add one more line to that file and\
    \ use `require` like we have before to pull in features.\n\n```javascript\n1 //\
    \ server.js\n2 \n3 // BASE SETUP\n4 // ==========================\n5 \n6 var User\
    \     = require('./app/models/user');\n```\n\nNow our entire application is ready\
    \ and wired up so we can start building out our routes. These routes will define\
    \ our API, which is the main reason this chapter exists. Onward!\n\n### Express\
    \ Router and Routes\n\nWe will use an instance of the Express Router to handle\
    \ all of our API routes. Here is an overview of the routes we will require, what\
    \ they will do, and the HTTP Verb used to access it.\n\n| /api/users | `GET` |\
    \ Get all the users |\n| --- | --- | --- |\n| /api/users | `POST` | Create a user\
    \ |\n| /api/users/:user_id | `GET` | Get a single user |\n| /api/users/:user_id\
    \ | `PUT` | Update a user with new info |\n| /api/users/:user_id | `DELETE` |\
    \ Delete a user |\n\nThis will cover the basic routes needed for an API. This\
    \ also keeps to a good format where we have kept the actions we need to execute\
    \ (`GET`, `POST`, `PUT`, and `DELETE`) as HTTP verbs.\n\n### Route Middleware\n\
    \nWe’ve already defined our first route and seen it in action. The Express Router\
    \ gives us a great deal of flexibility in defining our routes.\n\nWe’ve talked\
    \ on route middleware in the Node Routing chapter. For this example we are just\
    \ going to `console.log()` the request to the console. Let’s add that middleware\
    \ to our `server.js` file now.\n\n```javascript\n 1 // ROUTES FOR OUR API\n 2\
    \ // =============================\n 3 var apiRouter = express.Router(); \t//\
    \ get an instance of the express Router\n 4 \n 5 // middleware to use for all\
    \ requests\n 6 apiRouter.use(function(req, res, next) {\n 7 \t// do logging\n\
    \ 8 \tconsole.log('Somebody just came to our app!');\n 9 \n10 \t// we'll add more\
    \ to the middleware in Chapter 10\n11 \t// this is where we will authenticate\
    \ users\n12 \n13 \tnext(); // make sure we go to the next routes and don't stop\
    \ here\n14 });\n15 \n16 // test route to make sure everything is working \n17\
    \ // (accessed at GET http://localhost:8080/api)\n18 apiRouter.get('/', function(req,\
    \ res) {\n19 \tres.send('Everything is working!');\n20 });\n21 \n22 // REGISTER\
    \ ROUTES\n23 // -------------------------------\n24 app.use('/api', apiRouter);\n\
    ```\n\n### Creating the Basic Routes\n\nWe will now created the routes for our\
    \ application. We will use Express’s `apiRouter.route()` to handle multiple routes\
    \ for the same URI.\n\n#### Creating a User POST (/api/users)\n\nWe will add the\
    \ new route to handle POST.\n\n```javascript\n 1 // ROUTES FOR OUR API\n 2 //\
    \ ===============================\n 3 \n 4 // route middleware and first route\n\
    \ 5 \n 6 // on routes that end in /users\n 7 // ------------------------------------\n\
    \ 8 apiRouter.route('/users')\n 9\n10 \t// create a user (accessed at POST http://localhost:8080/api/users)\n\
    11 \t.post(function(req, res) {\n12 \t\t\n13 \t\t// create a new instance of the\
    \ User model\n14 \t\tvar user = new User(); \t\t\n15 \n16 \t\t// set the users\
    \ information (comes from the request)\n17 \t\tuser.name = req.body.name;  \n\
    18 \t\tuser.username = req.body.username;\n19 \t\tuser.password = req.body.password;\n\
    20 \n21 \t\t// save the user and check for errors\n22 \t\tuser.save(function(err)\
    \ {\n23              if (err) {\n24                 // duplicate entry\n25   \
    \              if (err.code == 11000) \n26                     return res.json({\
    \ success: false, message: 'A user with that\\\n27  username already exists. '});\n\
    28                 else \n29                     return res.send(err);\n30   \
    \          }\n31 \n32 \t\t\tres.json({ message: 'User created!' });\n33 \t\t});\n\
    34 \t\t\n35 \t})\n```\n\nNow we have created the `POST` route for our application.\
    \ We will use Express’s `apiRouter.route()` to handle multiple routes for the\
    \ same URI. We are able to handle all the requests that end in `/users`.\n\nLet’s\
    \ look at Postman now to create our user. We are passing the `name` variable.\
    \ This is how the information would look if it came from a form on our website\
    \ or application.\n\nNotice that we are sending the `name` data as `x-www-form-urlencoded`.\
    \ This will send all of our data to the Node server as query strings.\n"
