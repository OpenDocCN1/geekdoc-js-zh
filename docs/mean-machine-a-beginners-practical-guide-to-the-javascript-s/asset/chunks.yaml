  raw: "In our `app.routes.js` file, add the following below the `login` route:\n\n\
    ```\n1 // show all users\n2 .when('/users', {\n3   templateUrl: 'app/views/pages/users/all.html',\n\
    4   controller: 'userController',\n5   controllerAs: 'user'\n6 });\n```\n\nThat\
    \ will use the controller and view we just created. Visit `http://localhost:8080/users`\
    \ in your browser and you will see all the work we’ve done come together.\n\n\
    ![All Users](images/17-user-crm----all-users.jpg)\n\nAll Users\n\nAnother thing\
    \ to note is that if we go into our Chrome network tools and look at the request\
    \ to get all the users, we will see that Angular did in fact attach our token.\n\
    \n![Access Token](images/17-user-crm----access-token.jpg)\n\nAccess Token\n\n\
    There is one more thing left to do on this page and that is to provide the functionality\
    \ to delete a user.\n\n#### Delete a User\n\nWe will need two things to add delete\
    \ functionality.\n\n1.  A function in our controller\n\n2.  A button in our view\n\
    \nLet’s create the function first. In our `userCtrl.js`, add the function:\n\n\
    ```\n 1 // function to delete a user\n 2 vm.deleteUser = function(id) {\n 3  \
    \ vm.processing = true;\n 4 \n 5   // accepts the user id as a parameter\n 6 \
    \  User.delete(id)\n 7     .success(function(data) {\n 8 \n 9       // get all\
    \ users to update the table\n10       // you can also set up your api \n11   \
    \    // to return the list of users with the delete call\n12       User.all()\n\
    13         .success(function(data) {\n14           vm.processing = false;\n15\
    \           vm.users = data;\n16         });\n17 \n18     });\n19 };\n```\n\n\
    This `deleteUser` function will call the delete function in our `User` factory.\
    \ When that call is successful, we will make a call to grab all our users and\
    \ then update the `users` object, which in turn will update our table.\n\nAll\
    \ that’s needed now is a delete button in the view. In your user table in `views/pages/users/all.html`,\
    \ add the following right next to the edit button:\n\n```\n1 <a href=\"#\" \n\
    2   ng-click=\"user.deleteUser(person._id)\" \n3   class=\"btn btn-primary\">Delete</a>\n\
    ```\n\nWe are passing in the `person._id` and we’ll call the `deleteUser` function\
    \ when this button is clicked thanks to the `ngClick` Angular directive.\n\nNow\
    \ when we click delete, the user will be deleted and our table will be updated.\
    \ Next up, let’s make the **create a user** components.\n\n#### Create a User\n\
    \nJust like the list all users page, we will need a **controller**, **route**,\
    \ and **view** for the create user page.\n\n##### Create User Controller\n\nWe\
    \ will add a controller to the `userCtrl.js` file beneath the first controller\
    \ we created. We’ll call this one `userCreateController`.\n\n```\n 1 // controller\
    \ applied to user creation page\n 2 .controller('userCreateController', function(User)\
    \ {\n 3   \n 4   var vm = this;\n 5 \n 6   // variable to hide/show elements of\
    \ the view\n 7   // differentiates between create or edit pages\n 8   vm.type\
    \ = 'create';\n 9 \n10   // function to create a user\n11   vm.saveUser = function()\
    \ {\n12     vm.processing = true;\n13 \n14     // clear the message\n15     vm.message\
    \ = '';\n16 \n17     // use the create function in the userService\n18     User.create(vm.userData)\n\
    19       .success(function(data) {\n20         vm.processing = false;\n21 \n22\
    \         // clear the form\n23         vm.userData = {};\n24         vm.message\
    \ = data.message;\n25       });\n26       \n27   };  \n28 \n29 })\n```\n\nThis\
    \ is a pretty standard process to us by now. We have a function called `saveUser`\
    \ that will be used in a form in our view. We are also calling the `User.create()`\
    \ function in our `userService`. After a user is created, we will show a message\
    \ and clear the form so that we will be able to enter a new user.\n\nWe are passing\
    \ in the entire `userData` object into the create user function which includes:\n\
    \n```\n1 // all info is bound to our form using ng-model\n2 {\n3   name: \"Holly\"\
    ,\n4   username: \"hollylawly\",\n5   password: \"supersecret\"\n6 }\n```\n\n\
    The other addition here is the `type` variable. This will be used in our view.\
    \ Since we are using the same file (`views/pages/users/single.html`) for both\
    \ the creation and the editing pages, we will need a way to differentiate between\
    \ the two. Sure you could create two separate view files for these pages, but\
    \ there will only really be 2 minor differences in the view. We are eliminating\
    \ some repeated code by doing it this way.\n\n##### Create User Route\n\n```\n\
    1 // form to create a new user\n2 // same view as edit page\n3 .when('/users/create',\
    \ {\n4   templateUrl: 'app/views/pages/users/single.html',\n5   controller: 'userCreateController',\n\
    6   controllerAs: 'user'\n7 })\n```\n\n##### Create User View (pages/users/single.html)\n\
    \n```\n 1 <div class=\"page-header\">\n 2   <h1 ng-if=\"user.type == 'create'\"\
    >Create User</h1>\n 3   <h1 ng-if=\"user.type == 'edit'\">Edit User</h1>\n 4 </div>\n\
    \ 5 \n 6 <form class=\"form-horizontal\" ng-submit=\"user.saveUser()\">\n 7  \
    \ \n 8   <div class=\"form-group\">\n 9     <label class=\"col-sm-2 control-label\"\
    >Name</label>\n10     <div class=\"col-sm-6\">\n11       <input type=\"text\"\
    \ \n12         class=\"form-control\" \n13         ng-model=\"user.userData.name\"\
    >\n14     </div>\n15   </div>\n16 \n17   <div class=\"form-group\">\n18     <label\
    \ class=\"col-sm-2 control-label\">Username</label>\n19     <div class=\"col-sm-6\"\
    >\n20       <input type=\"text\" \n21         class=\"form-control\" \n22    \
    \     ng-model=\"user.userData.username\">\n23     </div>\n24   </div>\n25 \n\
    26   <div class=\"form-group\">\n27     <label class=\"col-sm-2 control-label\"\
    >Password</label>\n28     <div class=\"col-sm-6\">\n29       <input type=\"password\"\
    \ \n30         class=\"form-control\" \n31         ng-model=\"user.userData.password\"\
    >\n32     </div>\n33   </div>\n34   \n35   <div class=\"form-group\">\n36   <div\
    \ class=\"col-sm-offset-2 col-sm-6\">\n37     <button type=\"submit\" \n38   \
    \    class=\"btn btn-success btn-lg btn-block\" \n39       ng-if=\"user.type ==\
    \ 'create'\">Create User</button>\n40     <button type=\"submit\" \n41       class=\"\
    btn btn-success btn-lg btn-block\" \n42       ng-if=\"user.type == 'edit'\">Update\
    \ User</button>\n43   </div>\n44   </div>\n45 \n46 </form>\n47 \n48 <div class=\"\
    row show-hide-message\" ng-show=\"user.message\">\n49   <div class=\"col-sm-6\
    \ col-sm-offset-2\">\n50     \n51     <div class=\"alert alert-info\">\n52   \
    \    {{ user.message }}\n53     </div>\n54 \n55   </div>\n56 </div>\n```\n\nWe\
    \ have our basic form here with inputs bound using `ngModel`, the form being submitted\
    \ using `ngSubmit`, and our error message being shown using `ngShow`.\n\nThe thing\
    \ to notice here is that we are checking for that `type` variable and showing\
