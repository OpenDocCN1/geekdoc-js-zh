  trans: "\n\n我们将使用 `ngIf` 显示和隐藏处理图标，并将其绑定到名为 `processing` 的变量。让我们更新 `mainController`\
    \ 文件中的 `doLogin()` 函数来添加此变量。\n\n```\n 1 // 处理登录表单的函数\n 2 vm.doLogin = function()\
    \ {\n 3   vm.processing = true;\n 4 \n 5   Auth.login(vm.loginData.username, vm.loginData.password)\n\
    \ 6     .success(function(data) {\n 7       vm.processing = false;\n 8 \n 9  \
    \     // 如果用户登录成功，重定向到用户页面\n10       $location.path('/users');\n11     });\n12\
    \ };\n```\n\n当用户点击 `Login` 时，我们将 `processing` 变量设置为 `true`。当函数完成后完成后我们将变量设置为 `false`。\n\
    \n现在我们只需要做的就是创建并显示处理图标。\n\n在我们的 `login.html` 文件中，让我们为登录按钮添加该图标。\n\n```\n1 <button\
    \ type=\"submit\" class=\"btn btn-block btn-primary\">\n2 \n3   <span ng-if=\"\
    !login.processing\">Login</span>\n 4 \n5   <span ng-if=\"login.processing\" class=\"\
    spinner\"><span class=\"glyphicon glyphico\\\n6 n-repeat\"></span></span>\n 7\
    \ \n8 </button>\n```\n\n如果变量为 `true`，我们将显示旋转器。否则，我们的按钮将始终显示 `Login`。\n\n只需要少量的\
    \ CSS 来处理旋转动画，我们就准备了。将以下内容添加到 `style.css` 中：\n\n```\n 1 /* 动画\n 2 ======================\
    \ */\n 3 .spinner {\n 4   animation:spin 1s infinite;\n 5   -webkit-animation:spin\
    \ 1s infinite;\n 6   -moz-animation:spin 1s infinite;\n 7 }\n 8 \n 9 @keyframes\
    \ spin {\n10   from  { transform:rotate(0deg); }\n11   to    { transform:rotate(360deg);\
    \ }\n12 }\n13 \n14 @-webkit-keyframes spin {\n15   from  { -webkit-transform:rotate(0deg);\
    \ }\n16   to    { -webkit-transform:rotate(360deg); }\n17 }\n18 \n19 @-moz-keyframes\
    \ spin {\n20   from  { -moz-transform:rotate(0deg); }  \n21   to    { -moz-transform:rotate(360deg);\
    \ }\n22 }\n```\n\n我们将为任何元素添加 `spinner` 类，它都会开始旋转。如果我们现在点击登录按钮，我们将看到旋转器。\n\n![登录旋转器](img/17-user-crm----login-spinner.jpg)\n\
    \n登录旋转器\n\n这种技术可以用于我们的整个应用程序。\n\n### 添加登录错误消息\n\n如果登录未成功，我们将让用户知道。由于我们的 API 已经返回了错误消息，我们只需要显示它们即可。\n\
    \n在登录函数内部，我们将检查 API 返回给我们的 `success` 变量。\n\n```\n 1   vm.doLogin = function()\
    \ {\n 2     vm.processing = true;\n 3 \n 4     // 清除错误\n 5     vm.error = '';\n\
    \ 6 \n 7     Auth.login(vm.loginData.username, vm.loginData.password)\n 8    \
    \   .success(function(data) {\n 9         ...\n10 \n11         // 如果用户登录成功，重定向到用户页面\n\
    12         if (data.success) \n13           $location.path('/users');\n14    \
    \     else\n15           vm.error = data.message;\n16       });\n```\n\n每次我们点击登录时，错误消息都会清除，这样我们就不会看到过期的错误消息。在视图中，我们只需要检查该错误。在登录按钮上方添加以下内容：\n\
    \n```\n1 <div class=\"alert alert-danger\" ng-if=\"login.error\">\n2   {{ login.error\
    \ }}\n3 </div>\n```\n\n如果错误变量存在，我们将显示这个 div。\n\n![用户不存在](img/17-user-crm----user-not-found.jpg)\n\
    \n用户不存在\n\n![密码错误](img/17-user-crm----wrong-password.jpg)\n\n密码错误\n\n在我们的网站基础和登录准备就绪后，我们现在想要处理更多的身份验证，然后创建显示我们用户的页面。\n\
    \n### 身份验证\n\n我们已经在 `mainController` 中使用了 `Auth` 工厂。我们调用了所有函数，包括 `isLoggedIn`、`login`、`logout`\
    \ 和 `getUser`。\n\n用户可以登录，他们的令牌存储在 `localStorage` 中。如果你检查浏览器的本地存储，你将看到该令牌。在为用户页面获取用户列表之前，我们必须将此令牌附加到每个请求。这就是我们在\
    \ `authService` 中创建的 `AuthInterceptor` 发挥用场的地方。\n\n我们将在主 `app.js` 文件中使用它。让我们看看它是如何应用的：\n\
    \n```\n 1 angular.module('userApp', [\n 2   'ngAnimate', \n 3   'app.routes',\
    \ \n 4   'authService',\n 5   'mainCtrl',\n 6   'userCtrl',\n 7   'userService'\n\
    \ 8 ])\n 9 \n10 .config(function($httpProvider) {\n11   $httpProvider.interceptors.push(AuthInterceptor);\n\
    12 })\n```\n\n### 用户页面\n\n我们已经在 `mainController` 中使用了 `Auth` 工厂。我们调用了所有函数，包括 `isLoggedIn`、`login`、`logout`\
    \ 和 `getUser`。\n\n用户可以登录，他们的令牌存储在 `localStorage` 中。如果你检查浏览器的本地存储，你将看到该令牌。在为用户页面获取用户列表之前，我们必须将此令牌附加到每个请求。这就是我们在\
    \ `authService` 中创建的 `AuthInterceptor` 发挥用场的地方。\n\n我们将在主 `app.js` 文件中使用它。让我们看看它是如何应用的：\n\
    \n#### 所有用户\n\n```\n1 angular.module('userCtrl', ['userService'])\n2 .controller('all',\
    \ function(User) {\n3   var vm = this;\n 4 \n5   vm.processing = true;\n 6 \n\
    7   User.all()\n 8     .success(function(data) {\n 9       vm.processing = false;\n\
    10       vm.users = data;\n11     });\n12 })\n```\n\n#### 所有用户视图 (pages/users/all.html)\n\
    \n```\n1 <div class=\"page-header\">\n2   <h1>\n3     用户 \n4     <a href=\"/users/create\"\
    \ class=\"btn btn-default\">\n5       <span class=\"glyphicon glyphicon-plus\"\
    ></span> \n6       新用户\n7     </a>\n8   </h1>\n9 \n10 </div>\n11 \n12 <!-- 加载消息\
    \ -->\n13 <div class=\"jumbotron text-center\" ng-show=\"user.processing\">\n\
    14   <span class=\"glyphicon glyphicon-repeat\"></span>\n15   <p>加载用户中...</p>\n\
    16 </div>\n17 \n18 <table class=\"table table-bordered table-striped\" ng-show=\"\
    user.users\">\n19   <thead>\n20     <tr>\n21       <th>_id</th>\n22       <th>姓名</th>\n\
    23       <th>用户名</th>\n24       <th class=\"col-sm-2\"></th>\n25     </tr>\n26\
    \   </thead>\n27   <tbody>\n28 \n29     <!-- 循环用户 -->\n30     <tr ng-repeat=\"\
    person in user.users\">\n31       <td>{{ person._id }}</td>\n32       <td>{{ person.name\
    \ }}</td>\n33       <td>{{ person.username }}</td>\n34       <td class=\"col-sm-2\"\
    >\n35         <a ng-href=\"/users/{{ person._id }}\" class=\"btn btn-danger\"\
    >编辑</a>\n36       </td>\n37     </tr>\n38   </tbody>\n39 </table>\n```\n\n"
- fmt: "\nIn our `app.routes.js` file, add the following below the `login` route:\n\
    \n```\n1 // show all users\n2 .when('/users', {\n3   templateUrl: 'app/views/pages/users/all.html',\n\
    4   controller: 'userController',\n5   controllerAs: 'user'\n6 });\n```\n\nThat\
    \ will use the controller and view we just created. Visit `http://localhost:8080/users`\
    \ in your browser and you will see all the work we’ve done come together.\n\n\
    ![All Users](images/17-user-crm----all-users.jpg)\n\nAll Users\n\nAnother thing\
    \ to note is that if we go into our Chrome network tools and look at the request\
    \ to get all the users, we will see that Angular did in fact attach our token.\n\
    \n![Access Token](images/17-user-crm----access-token.jpg)\n\nAccess Token\n\n\
    There is one more thing left to do on this page and that is to provide the functionality\
    \ to delete a user.\n\n## Delete a User\n\nWe will need two things to add delete\
    \ functionality.\n\n1.  A function in our controller\n2.  A button in our view\n\
    \nLet’s create the function first. In our `userCtrl.js`, add the function:\n\n\
    ```\n 1 // function to delete a user\n 2 vm.deleteUser = function(id) {\n 3  \
    \ vm.processing = true;\n 4 \n 5   // accepts the user id as a parameter\n 6 \
    \  User.delete(id)\n 7     .success(function(data) {\n 8 \n 9       // get all\
    \ users to update the table\n10       // you can also set up your api \n11   \
    \    // to return the list of users with the delete call\n12       User.all()\n\
    13         .success(function(data) {\n14           vm.processing = false;\n15\
    \           vm.users = data;\n16         });\n17 \n18     });\n19 };\n```\n\n\
    This `deleteUser` function will call the delete function in the `User` factory.\
    \ When that call is successful, we will make a call to grab all our users and\
    \ then update the `users` object, which in turn will update our table.\n\nAll\
    \ that’s needed now is a delete button in the view. In your user table in `views/pages/users/all.html`,\
    \ add the following right next to the edit button:\n\n```\n1 <a href=\"#\" \n\
    2   ng-click=\"user.deleteUser(person._id)\" \n3   class=\"btn btn-primary\">Delete</a>\n\
    ```\n\nWe are passing in the `person._id` and we’ll call the `deleteUser` function\
    \ when this button is clicked thanks to the `ngClick` Angular directive.\n\nNow\
    \ when we click delete, the user will be deleted and our table will be updated.\
    \ Next up, let’s make the **create a user** components.\n\n## Create a User\n\n\
    Just like the list all users page, we will need a **controller**, **route**, and\
    \ **view** for the create user page.\n\n### Create User Controller\n\nWe will\
    \ add a controller to the `userCtrl.js` file beneath the first controller we created.\
    \ We’ll call this one `userCreateController`.\n\n```\n 1 // controller applied\
    \ to user creation page\n 2 .controller('userCreateController', function(User)\
    \ {\n 3   \n 4   var vm = this;\n 5 \n 6   // variable to hide/show elements of\
    \ the view\n 7   // differentiates between create or edit pages\n 8   vm.type\
    \ = 'create';\n 9 \n10   // function to create a user\n 11   vm.saveUser = function()\
    \ {\n 12     vm.processing = true;\n 13 \n 14     // clear the message\n 15  \
    \   vm.message = '';\n 16 \n 17     // use the create function in the userService\n\
    \ 18     User.create(vm.userData)\n 19       .success(function(data) {\n 20  \
    \       vm.processing = false;\n 21 \n 22         // clear the form\n 23     \
    \    vm.userData = {};\n 24         vm.message = data.message;\n 25       });\n\
    \ 26       \n 27   };  \n 28 \n 29 )\n```\n\nThis is a pretty standard process\
    \ to us by now. We have a function called `saveUser` that will be used in a form\
    \ in our view. We are also calling the `User.create()` function in the `userService`.\
    \ After a user is created, we will show a message and clear the form so that we\
    \ will be able to enter a new user.\n\nWe are passing in the entire `userData`\
    \ object into the create user function which includes:\n\n```\n1 // all info is\
    \ bound to our form using ng-model\n2 {\n3   name: \"Holly\",\n4   username: \"\
    hollylawly\",\n5   password: \"supersecret\"\n6 }\n```\n\nThe other addition here\
    \ is the `type` variable. This will be used in our view. Since we are using the\
    \ same file (`views/pages/users/single.html`) for both the creation and the editing\
    \ pages, we will need a way to differentiate between the two. Sure you could create\
    \ two separate view files for these pages, but there will only really be 2 minor\
    \ differences in the view. We are eliminating some repeated code by doing it this\
    \ way.\n\n### Create User Route\n\n```\n1 // form to create a new user\n2 // same\
    \ view as edit page\n3 .when('/users/create', {\n4   templateUrl: 'app/views/pages/users/single.html',\n\
    5   controller: 'userCreateController',\n6   controllerAs: 'user'\n7 })\n```\n\
    \n### Create User View (pages/users/single.html)\n\n```\n 1 <div class=\"page-header\"\
    >\n 2   <h1 ng-if=\"user.type == 'create'\">Create User</h1>\n 3   <h1 ng-if=\"\
    user.type == 'edit'\">Edit User</h1>\n 4 </div>\n 5 \n 6 <form class=\"form-horizontal\"\
    \ ng-submit=\"user.saveUser()\">\n 7   \n 8   <div class=\"form-group\">\n 9 \
    \    <label class=\"col-sm-2 control-label\">Name</label>\n10     <div class=\"\
    col-sm-6\">\n11       <input type=\"text\" \n12         class=\"form-control\"\
    \ \n13         ng-model=\"user.userData.name\">\n14     </div>\n15   </div>\n\
