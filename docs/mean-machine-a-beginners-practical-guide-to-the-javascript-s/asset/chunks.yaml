- fmt: "\n## 2. **Chapters 4-9: Server/Backend** Concepts, applications, and best\
    \ practices.\n## 3. **Chapters 10-16: Client/Frontend** Concepts, applications,\
    \ and best practices.\n## 4. **Chapters 17-19: MEAN Stack Applications** Bringing\
    \ it all together so that we can build amazing applications.\n## 5. **Chapters\
    \ 20-Infinity: More Sample Applications!**\n\n## Getting Started and Installation\n\
    \n### Requirements\n* [Node](http://nodejs.org)\n* `npm` - included in Node installation\n\
    \n### Tools\n* Sublime Text\n* Terminal - We like using [iterm2](http://iterm2.com/)\
    \ (mac/linux users)\n* [Git Bash + ConEmu](http://scotch.io/bar-talk/get-a-functional-and-sleek-console-in-windows)\
    \ (windows users)\n* [Postman](https://chrome.google.com/webstore/detail/postman-rest-client/fdmmgilgnpjigdojojpjoooidkmcomcm?hl=en)\
    \ (Chrome)\n* [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
    \ (Firefox)\n\n### Installation\nGo ahead and visit the [node website](http://nodejs.org)\
    \ and download Node. Run through the installation and you’ll have Node and `npm`\
    \ installed! That will probably be the easiest part of the book.\n\n![Node Installation](images/04-getting-started----node-install.jpg\
    \ \"Node Installation\")\n\nNode Installation\n\nLet’s double check that everything\
    \ is working, go into your console and type the following: `node -v` and `npm\
    \ -v`.\n\n```\n1 node -v\n```\n\n![Node Version](images/04-getting-started----node-version.jpg\
    \ \"Node Version Check\")\nNode Version\n\n```\n1 npm -v\n```\n\n![NPM Version](images/04-getting-started----npm-version.jpg\
    \ \"NPM Version Check\")\nNPM Version\n\nIf you’re getting the dreaded “command\
    \ not found” on either of these, make sure that node has been added to your `PATH`.\
    \ This provides the `node` and `npm` commands to the command line. Simply search\
    \ for where `npm` was installed, open up your environment variables window, and\
    \ add the path to `npm`. Restart your computer and let the magic begin.\n\nFor\
    \ more detailed troubleshooting instructions, see the following:\n**Windows**:\
    \ [Add Node to your Windows PATH](http://stackoverflow.com/a/8768567/2976743)\n\
    **Mac**: [Add Node to your Mac PATH](http://architectryan.com/2012/10/02/add-to-the-path-on-mac-os-x-mountain-lion/#.U_wCiFNdWqc)\n\
    \nAnd if you’re still having trouble, feel free to contact either of us with your\
    \ questions. Now that your installation is all done, let’s move forward and start\
    \ building things! We’ll begin with the foundation of our MEAN stack applications,\
    \ Node!\n\n## Starting Node\nLet’s look at how we can start to build out our Node\
    \ applications. We’ll go through **basic Node configuration**, **installing npm\
    \ packages**, and **creating a simple app**.\n\n### Configuration (package.json)\n\
    Node applications are configured within a file called `package.json`. You will\
    \ need a `package.json` file for each project you create.\nThis file is where\
    \ you configure the name of your project, versions, repository, author, and the\
    \ all important dependencies.\n\nHere is a sample `package.json` file:\n\n```\n\
    \ 1 {\n 2   \"name\": \"mean-machine-code\",\n 3   \"version\": \"1.0.0\",\n 4\
    \   \"description\": \"The code repository for the book, MEAN Machine.\",\n 5\
    \   \"main\": \"server.js\",\n 6   \"repository\": {\n 7     \"type\": \"git\"\
    ,\n 8     \"url\": \"https://github.com/scotch-io/mean-machine-code\"\n 9   },\n\
    10   \"dependencies\": {\n11     \"express\": \"latest\",\n12     \"mongoose\"\
    : \"latest\"\n13   },\n14   \"author\": \"Chris Sevilleja & Holly Lloyd\",\n15\
    \   \"license\": \"MIT\",\n16   \"homepage\": \"https://github.com/scotch-io/mean-machine-code\"\
    \n17 }\n```\n\nThat seems overwhelming at first, but if you take it line by line,\
    \ you can see that a lot of the attributes created here make it easier for other\
    \ developers to jump into the project. We’ll look through all these different\
    \ parts later in the book, but here’s a very simple `package.json` with only the\
    \ required parts.\n\n```\n1 {\n2   \"name\": \"mean-machine-code\",\n3   \"main\"\
    : \"server.js\"\n4 }\n```\n\nThese are the most basic required attributes.\n`main`\
    \ tells Node which file to use when we want to start our applications. We’ll name\
    \ that file `server.js` for all of our applications and that will be where we\
    \ start our applications.\n\nFor more of the attributes that can be specified\
    \ in our `package.json` files, here are the [package.json docs](https://www.npmjs.org/doc/files/package.json.html).\n\
    \n### Initialize Node App\nThe `package.json` file is how we will start every\
    \ application. It can be hard to remember exactly what goes into a `package.json`\
    \ file, so `npm` has created an easy way.\n\nThe `package.json` file is how we\
