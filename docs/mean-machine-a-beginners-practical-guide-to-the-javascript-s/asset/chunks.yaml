  trans: "\n\n```\n1     <link rel=\"stylesheet\" href=\"css/style.css\">\n```\n\n\
    我们将做的另一个更改是将 `<div ng-view></div>` 包裹在另一个 div 中，这样我们就可以专门地调用它。它看起来是这样：\n\n```\n\
    1     <div id=\"content-views\">\n2         <div ng-view></div>\n3     </div>\n\
    ```\n\n现在我们只需要进入新创建的样式表添加样式。不要忘记在 `index.html` 中链接你的样式表 `<link rel=\"stylesheet\"\
    \ href=\"css/style.css\" />`。\n\n```\n     body                          { padding-top:50px;\
    \ }\n\n     #content-views                { position:relative; }\n\n     .ng-enter,\
    \ .ng-leave          { width:100%; position:absolute; }\n     .ng-enter      \
    \               { \n       -webkit-animation:zoomInDown 1.2s both ease-in; \n\
    \       -moz-animation:zoomInDown 1.2s both ease-in; \n         animation:zoomInDown\
    \ 1.2s both ease-in; \n     }\n     .ng-leave                     { \n       -webkit-animation:zoomOutDown\
    \ 0.5s both ease-in; \n       -moz-animation:zoomOutDown 0.5s both ease-in; \n\
    \         animation:zoomOutDown 0.5s both ease-in; \n     }\n```\n\n**厂商前缀 (Vendor\
    \ Prefixes)**：在将此代码推送到生产环境时，确保添加 `-moz-animation` 和 `-webkit-animation` 厂商前缀，以实现浏览器的兼容。\n\
    \n继续点击应用程序中的页面，观察页面飞出和飞入的效果！就是这样，我们有了一个动画应用程序！可以尝试其他的 [animate.css](http://daneden.github.io/animate.css/)\
    \ 类，看看你可以创建出多么疯狂不同的效果。\n\n### 结论\n\n这应该向你了如何将 Angular 路由和动画模块结合，可以快速构建看起来复杂的应用程序。这些技术可以用于构建各种不同风格的应用程序。到目前为止，在\
    \ Angular 方面我们已经：\n\n*   设置了 AngularJS 模块\n*   将 Angular 应用到我们的 HTML 视图中\n*  \
    \ 使用 `ngRoute` 对我们的应用程序进行路由\n*   使用 `ngAnimate` 和 CSS 类为我们的应用程序制作动画\n\n掌握上述知识将让我们能够构建出非常漂亮的应用程序。在接下来的章节中，我们将通过构建更多示例应用程序进一步探索这些概念。\n\
    \n到目前为止我们关注的是前端 Angular 部分；下一步是如何让 Angular 应用程序动态化。我们将转向整合前端和后端，但首先让我们确保应用程序的基础是稳固的，以便我们的应用程序具有可扩展性且易于理解。\n\
    \n## MEAN Stack 应用程序结构\n\n到目前，我们已经能够将大部分代码存放在几个主文件中（Node 的 `server.js` 和 Angular\
    \ 的 `app.js`）。当我们开始转向更大的 MEAN Stack 应用程序时，将所有代码都堆积在这些主文件中将变得非常笨重。维护代码、查找应用程序的某些部分将变得困难，最糟糕的是，与其他开发者共享错综复杂的代码。\n\
    \n考虑到这一点，让我们看看我们的应用程序结构。组织如此简单的东西会有深远的影响。这是一个短小章节，但是一个非常重要的章节。\n\n### 示例组织\n\n\
    到目前为止，我们的应用程序具有以下文件结构：\n\n```\n // node applications\n - app/\n ----- models/\n\
    \n // angular applications\n - public/\n ----- css/\n ----- js/\n---------- controllers/\n\
    ---------- services/\n ----- app.js\n ----- views/\n---------- pages/\n -----\
    \ index.html\n\n - package.json\n - server.js\n```\n\n在 **Node 方面**，我们不能将所有内容都留在\
    \ `server.js` 中。当我们开始放入更多的路由、更多的配置和更多的应用程序功能时，该文件可能会变成一个巨大的代码条条混合体。这必须被拆分为更有组织性的结构。\n\
    \n在 **Angular 方面**，这种结构可能会变得困惑。我们应该在哪里放置像 Bootstrap 或 Font Awesome 这样的 `lib` 文件呢？我们的\
    \ `js` 文件夹是否应该包含所有内容，包括我们的 Angular 应用程序文件？\n\n### 更好的结构\n\n那么更好的结构应该是什么样的？让我们结合\
    \ Node 和 Angular 部分，因为我们下一步将转向全栈应用程序。\n\n这是一个为我们的应用程序提供良好基础的更好组织方式。这是一种**模块化**方法，允许我们简单地从应用程序中添加和删除组件。\n\
    \n```\n - app/\n ----- models/\n ----- routes/\n - public/\n ----- assets/  //\
    \ 应用程序的基础 css/js/images（不是 Angular 文件）\n---------- css/      // 一些自定义 css\n----------\
    \ js/       // 一些自定义 js（不是 Angular 文件）\n---------- img/\n---------- libs/    \
    \ // 库如 bootstrap, angular, font-awesome\n ----- app/      // 应用程序的 Angular 部分\n\
    ---------- controllers/\n---------- services/\n---------- app.js\n---------- app.routes.js\n\
    ---------- views/\n---------- pages/\n ----- index.html\n - package.json\n - server.js\n\
    ```\n\n#### App 文件夹\n\n我们有 `models` 文件夹。新由于我们有了 `routes/` 文件夹。我们可以将路由放在这里。`app.js`。\n\
    \n#### 配置文件\n\n我们将配置变量从 `server.js` 中移出。对于我们的目的，我们没有许多配置变量，只有 `port`、我们的 `database`\
    \ 以及我们将使用的 `secret`。\n\n在根目录下创建一个名为 `config.js` 的新文件。\n\n以下是我们需要的：\n\n```\nmodule.exports\
    \ = {\n  'port': process.env.PORT || 8080,\n  'database': 'mongodb://node:novus.modulus.net:27017/ganiq8o',\n\
    \  'secret': 'ilovescscotchyscotscotch'\n};\n```\n\n#### Public 文件夹\n\n这是大部分移动发生的地方。之前，我们将所有（Angular\
    \ 文件和资源文件）存储在 `public/js` 文件夹中。随着应用程序的增长，这可能会变得混乱，所以现在我们设置让资源和应用程序文件位于不同的目录。\n\
    \n任何 Angular 特有的（如控制器、服务、路由和视图）将位于 `app/` 文件夹。像图像、自定义 CSS 和库将位于 `assets/` 文件夹。\n\
    \n在这里我们创建了 `app.routes.js` 文件。未来当我们创建更多路由时，我们可能想要将其移动到自己的 `routes/` 文件夹中，就像我们对\
    \ Node 端做的那样。\n\n#### Routes 文件夹\n\n我们只是将路由移动到 `routes/api.js` 文件中。我们甚至可以在文件夹中创建多个路由。\n\
    \n### Node Node.js 后端\n\n由于第 10 章是关于创建 Node API 并对其进行验证的，这里只有 Node 代码可以处理。\n\n\
    看看如何重新整理 Node 代码（快速说 10 遍……Node 代码，Node 代码，Node 代码）。请继续复制你的第 10 章代码并为它创建一个新项目。\n\
    \n以下我们将采取的步骤概述：\n\n*   将配置变量移动到新的 `config.js`\n*   将路由移动到新的 `routes/api.js` 文件中\n\
    *   创建一个通符路由以准备用于 MEAN 应用\n\n#### 通符路由\n\n当 Angular 应用程序部署时，我们需要创建一个通符路由，以便任何不是针对\
    \ API 的请求都由 `index.html` 文件提供。这允许 Angular 处理路由。\n\n```javascript\napp.get('*',\
    \ (req, res) => {\n  res.sendFile(path.join(__dirname, 'public/index.html'));\n\
    });\n```\n\n"
- fmt: "\nNow we can use this file inside of our `server.js` file using `require()`.\
    \ The following lines will be edited:\n\n```\n1 var config     = require('./config');\n\
    2 \n3 // connect to our database (hosted on modulus.io)\n4 mongoose.connect(config.database);\
    \ \n5 \n6 // START THE SERVER\n7 // ====================================\n8 app.listen(config.port);\n\
    9 console.log('Magic happens on port ' + config.port);\n```\n\nAnd the following\
    \ lines have been moved out, so can now be deleted from `server.js`:\n\n```\n\
    1 // super secret for creating tokens\n2 var superSecret = 'ilovescotchscotchyscotchscotch';\n\
    ```\n\nWhile this may not seem like it did a lot, the concept will go a long way\
    \ when we have over 20+ settings for our application.\n\n***\n\n![Note](images/icon-pencil.png\
    \ \"Take Note\")\n\n## Note\n\n### What is `module.exports`?\n\nBy default, JavaScript\
    \ doesn’t have a way to pass information between different files. `module.exports`\
    \ is Node’s way of fixing this problem.\n\nYou can think of `module.exports` as\
    \ a giant object for our application. When our application starts, this `module.exports`\
    \ object looks like this:\n\n```\n1 module.exports = {};\n```\n\nAs we start pulling\
    \ things into our app with `require()`, everything is added to this object.\n\n\
    So now as we add that new `config.js` file with `require(./config.js);`, we have\
    \ access to those variables since we passed them through `module.exports`.\n\n\
    This is how we will be passing information to and from all of our files and we’ll\
    \ see this in practice again when we create our routes files.\n\nIt is also important\
    \ to note that many tutorials on the web will switch between `module.exports`\
    \ and `exports`. They mean the same thing and can be used interchangeably.\n\n\
    ***\n\n### Routes\n\nJust like our configuration variables, let’s move our routes\
    \ into their own files. Create a folder called `app/routes/` and a file called\
    \ `app/routes/api.js`.\n\nWhen creating new files, we will have to `require()`\
    \ anything that is needed by that file. In our case, we will need `body-parser`,\
    \ our `User` model, our `config` file for the `secret`, and `jsonwebtoken` since\
    \ those were used in our routes.\n\nWe will also need `app` and `express` but\
    \ we will be passing those into our routes since we want our application to use\
    \ the same `app` object we create in `server.js`. Let’s take a look at how we’ll\
    \ structure our `routes/api.js` file that holds all of our API routes. Go into\
    \ your existing ‘server.js’ file from chapter 10 and grab out all of the route\
    \ code, starting at `var apiRouter = express.Router();`. We will be wrapping this\
    \ in our `module.exports` so that it can be passed between our javascript files.\
    \ Also take note of the changes to our variable `superSecret` and the packages\
    \ we are including at the top.\n"
