    \nNext, we’ll create the interceptor factory.\n\n#### AuthInterceptor Factory\n\
    \nThe `AuthInterceptor` factory will be responsible for attaching the token to\
    \ all HTTP requests coming from our frontend application.\n\n```\n 1 // ===================================================\n\
    \ 2 // application configuration to integrate token into requests\n 3 // ===================================================\n\
    \ 4 .factory('AuthInterceptor', function($q, $location, AuthToken) {\n 5 \n 6\
    \   var interceptorFactory = {};\n 7 \n 8   // this will happen on all HTTP requests\n\
    \ 9   interceptorFactory.request = function(config) {\n10 \n11     // grab the\
    \ token\n12     var token = AuthToken.getToken();\n13 \n14     // if the token\
    \ exists, add it to the header as x-access-token\n15     if (token) \n16     \
    \  config.headers['x-access-token'] = token;\n17     \n18     return config;\n\
    19   };\n20 \n21   // happens on response errors\n22   interceptorFactory.responseError\
    \ = function(response) {\n23 \n24     // if our server returns a 403 forbidden\
    \ response\n25     if (response.status == 403) {\n26       AuthToken.setToken();\n\
    27       $location.path('/login');\n28     }\n29 \n30     // return the errors\
    \ from the server as a promise\n31     return $q.reject(response);\n32   };\n\
    33 \n34   return interceptorFactory;\n35   \n36 });\n```\n\nAn interceptor in\
    \ Angular will allow us to react to different HTTP request scenarios. When creating\
    \ an interceptor, we have a few options available to us.\n\n*   **request** lets\
    \ us intercept requests before they are sent\n\n*   **response** lets us change\
    \ the response that we get back from a request\n\n*   **requestError** captures\
    \ requests that have been cancelled\n\n*   **responseError** catches backend calls\
    \ that fail. In this case, we will use it to catch 403 Forbidden errors if the\
    \ token does not validate or does not exist.\n\nIf we receive a 403 error from\
    \ our backend, we will be forced to redirect the user to the login page using\
    \ `$location.path('/login')`. We will also clear any tokens in storage since those\
    \ weren’t good enough to validate our user.\n\nThose are the three factories necessary\
    \ for creating authentication in an Angular application. We are able to communicate\
    \ with the backend API, get and set tokens client-side, and attach the token to\
    \ all our requests.\n\n### The Entire Auth Service File (authService.js)\n\n```\n\
    \ 1 angular.module('authService', [])\n  2 \n  3 // ===================================================\n\
    \  4 // auth factory to login and get information\n  5 // inject $http for communicating\
    \ with the API\n  6 // inject $q to return promise objects\n  7 // inject AuthToken\
    \ to manage tokens\n  8 // ===================================================\n\
    \  9 .factory('Auth', function($http, $q, AuthToken) {\n 10 \n 11   // create\
    \ auth factory object\n 12   var authFactory = {};\n 13 \n 14   // log a user\
    \ in\n 15   authFactory.login = function(username, password) {\n 16 \n 17    \
    \ // return the promise object and its data\n 18     return $http.post('/api/authenticate',\
    \ {\n 19       username: username,\n 20       password: password\n 21     })\n\
    \ 22       .success(function(data) {\n 23         AuthToken.setToken(data.token);\n\
    \ 24         return data;\n 25       });\n 26   };\n 27 \n 28   // log a user\
    \ out by clearing the token\n 29   authFactory.logout = function() {\n 30    \
    \ // clear the token\n 31     AuthToken.setToken();\n 32   };\n 33 \n 34   //\
    \ check if a user is logged in\n 35   // checks if there is a local token\n 36\
    \   authFactory.isLoggedIn = function() {\n 37     if (AuthToken.getToken()) \n\
    \ 38       return true;\n 39     else\n 40       return false; \n 41   };\n 42\
    \ \n 43   // get the logged in user\n 44   authFactory.getUser = function() {\n\
    \ 45     if (AuthToken.getToken())\n 46       return $http.get('/api/me');\n 47\
    \     else\n 48       return $q.reject({ message: 'User has no token.' });   \
    \ \n 49   };\n 50 \n 51   // return auth factory object\n 52   return authFactory;\n\
    \ 53 \n 54 })\n 55 \n 56 // ===================================================\n\
    \ 57 // factory for handling tokens\n 58 // inject $window to store token client-side\n\
    \ 59 // ===================================================\n 60 .factory('AuthToken',\
    \ function($window) {\n 61 \n 62   var authTokenFactory = {};\n 63 \n 64   //\
    \ get the token out of local storage\n 65   authTokenFactory.getToken = function()\
    \ {\n 66     return $window.localStorage.getItem('token');\n 67   };\n 68 \n 69\
    \   // function to set token or clear token\n 70   // if a token is passed, set\
    \ the token\n 71   // if there is no token, clear it from local storage\n 72 \
    \  authTokenFactory.setToken = function(token) {\n 73     if (token)\n 74    \
    \   $window.localStorage.setItem('token', token);\n 75     else\n 76       $window.localStorage.removeItem('token');\n\
    \ 77   };\n 78 \n 79   return authTokenFactory;\n 80 \n 81 })\n 82 \n 83 // ===================================================\n\
    \ 84 // application configuration to integrate token into requests\n 85 // ===================================================\n\
    \ 86 .factory('AuthInterceptor', function($q, $location, AuthToken) {\n 87 \n\
    \ 88   var interceptorFactory = {};\n 89 \n 90   // this will happen on all HTTP\
    \ requests\n 91   interceptorFactory.request = function(config) {\n 92 \n 93 \
    \    // grab the token\n 94     var token = AuthToken.getToken();\n 95 \n 96 \
    \    // if the token exists, add it to the header as x-access-token\n 97     if\
    \ (token) \n 98       config.headers['x-access-token'] = token;\n 99     \n100\
    \     return config;\n101   };\n102 \n103   // happens on response errors\n104\
    \   interceptorFactory.responseError = function(response) {\n105 \n106     //\
    \ if our server returns a 403 forbidden response\n107     if (response.status\
    \ == 403)\n108       $location.path('/login');\n109 \n110     // return the errors\
    \ from the server as a promise\n111     return $q.reject(response);\n112   };\n\
    113 \n114   return interceptorFactory;\n115   \n116 });\n```\n\n### Conclusion\n\
    \nWe now have our two great Angular services that we can use in our application.\
    \ These two services will be the glue between the frontend Angular application\
    \ and the backend Node application."
