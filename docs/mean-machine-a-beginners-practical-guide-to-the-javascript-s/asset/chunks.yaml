  trans: "\n除了我们刚刚从零创建的内容外，市面上也有预构建的解决方案。一个功能齐全 Angular 模块是 [ng-token-auth](https://github.com/lynndylanhurley/ng-token-auth)\
    \ 模块。它提供了与上述相同的选项，但添加了一些如认证事件之类的整洁特性。\n\n让我们继续进行，并在我们的 User CRM 应用中使用这些新文件。这就是我们一直期待的——一个完整的\
    \ MEAN 栈应用程序！我们在之前章节中的所有工作都是在为这一刻做准备。卷起袖子；在下一章节中我们有大量工作要做。\n\n## MEAN 应用：用户管理\
    \ CRM\n\n到为止，我们已经创建了一个 Node API 并使用 JSON Web 令牌（JWT）对其进行身份验证。这些都是服务器端代码，现在我们将利用刚刚学到的\
    \ Angular 服务知识，将其与前端集成。\n\n这里的目标是开始编写一个 Angular 应用程序，而不需要修改后端。像这样处理你的应用程序可以模拟类似的情况，即后端\
    \ API 由你以外的人员构建和维护（例如 Facebook、Twitter 或 GitHub API）。我们只有前端代码的访问权限。\n\n### 设置应用程序\n\
    \n我们将使用在第 14 章中创建的基础和应用程序结构。由于那是我们的 Node API（带身份验证），它将成为构建完整 MEAN 栈应用程序的完美设置。\n\
    \n#### 文件夹结构\n\n我们将只处理 MEAN 栈中的前端和 Angular 部分，因此我们只需要在 `public/` 文件夹内工作。前端和后端的分离允许我们缩小注意力并保持开发整洁，因为我们已经确切知道代码需要去哪里。\n\
    \n这里是应用程序结构。\n\n```\n 1 - app/\n 2 ----- models/\n 3 ---------- user.js\n 4 -----\
    \ routes/\n 5 ---------- api.js\n 6 - public/\n 7 ----- assets/\n 8 ----------\
    \ css/ \n9 --------------- style.css\n10 ----- app/\n11 ---------- controllers/\n\
    12 --------------- mainCtrl.js\n13 --------------- userCtrl.js\n14 ----------\
    \ services/\n15 --------------- authService.js\n16 --------------- userService.js\n\
    17 ---------- app.routes.js\n18 ---------- app.js\n19 ---------- views/\n20 ---------------\
    \ pages/\n21 -------------------- users/\n22 ------------------------- all.html\n\
    23 ------------------------- single.html\n24 --------------- login.html\n25 ---------------\
    \ home.html\n26 ---------- index.html\n27 - package.json\n28 - config.js- server.js\n\
    ```\n\n这些文件大部分已经在第 14 章中创建了。\n\n`authService.js` 将与我们在上章节（第 16 章）创建的文件相同，而 `userService.js`\
    \ 将是第 15 章创建的文件。\n\n其余工作将集中在编写控制器、`routes` 和 `views` 上。\n\n#### 引入服务\n\n我们将添加上章节创建的服务。请取出你创建的文件并将它们添加到：\n\
    \n* `public/app/services/authService.js`\n* `public/app/services/userService.js`\n\
    \n现在服务已经是我们应用程序的一部分，让我们准备好 Angular 的基础工作，然后开始使用它们连接前端和后端。\n\n### 主应用程序\n\n我们 Angular\
    \ 应用程序的基础需要 5 个文件：\n\n* `public/app/controllers/mainCtrl.js`\n* `public/app/app.js`\n\
    * `public/app/app.routes.js`\n* `public/app/views/index.html`\n* `public/app/views/pages/home.html`\n\
    \n所有这些文件将协同工作以生成我们应用程序的主页。由于主页不需要认证，我们暂时还不需要使用 `authService.js`。\n\n我们的主页看起来是这样的：\n\
    \n![首页](img/17-user-crm----user-crm-home.jpg)\n\n首页\n\n让我们开始创建文件吧。\n\n**app/app.js**\n\
    \n```\n1 angular.module('userApp', [\n2   'ngAnimate',\n3   'app.routes', \n4\
    \   'authService', \n5   'mainCtrl', \n6   'userCtrl', \n7   'userService'\n8\
    \ ]);\n```\n\n这是我们整个应用程序的高层级概览。我们引入了：\n\n* `ngAnimate` 用于为我们所有的 Angular 指令添加动画（特别是\
    \ `ngShow`/`ngHide`）\n* `app.routes` 将作为我们应用程序的路由\n* `authService` 是在第 16 章创建的服务文件\n\
    * `mainCtrl` 将是我们创建的一个全新的控制器，它包含我们的主视图\n* `userCtrl` 将包含我们所有用户管理页面的控制器\n* `userService`\
    \ 是在第 15 章创建的服务文件\n\n#### 路由\n\n我们将从路由文件开始。目前，我们只为主页添加第一个路由。\n\n**public/app.routes.js**\n\
    \n```\n 1 angular.module('app.routes', ['ngRoute'])\n 2 \n3 .config(function($routeProvider,\
    \ $locationProvider) {\n 4 \n5   $routeProvider\n 6 \n7     // 主页路由\n8     .when('/',\
    \ {\n9       templateUrl : 'app/views/pages/home.html'\n10     });\n11   // 移除\
    \ URL\n12   $locationProvider.hashMode(true);\n13 });\n```\n\n这足够生成我们的首页了。现在让我们进入控制器。\n\
    \n#### 控制器\n\n**public/app/controllers/mainCtrl.js**\n\n```\n1 angular.module('mainCtrl',\
    \ [])\n2 \n3 .controller('mainCtrl', function($rootScope, $location, Auth) {\n\
    \ 4   var vm = this;\n 5 \n6   // 检查用户是否登录\n7   $rootScope.$on('$routeChange',\
    \ function() {\n8     vm.loggedIn = Auth.isLoggedIn();\n9 \n10     // 获取路由更改时的信息\n\
    11     Auth.getUser()\n12       .success(function(data) {\n13         vm.user\
    \ = data;\n14       });\n15   });\n16 \n17   // 处理登录的函数\n18   vm.doLogin = function()\
    \ {\n19     \n20     // 调用 login() 函数\n21     Auth.login(loginData.username, loginData.password)\n\
    22       .success(function(data) {\n23         // 如果用户登录成功，重定向到用户页面\n24      \
    \   $location.path('/users');\n25       });\n26   };\n27 \n28   // 处理注销的函数\n29\
    \   vm.doLogout = function() {\n30     \n31     Auth.logout();\n32     // 重置所有用户信息\n\
    33     vm.user = {};\n34     $location.path('/login');\n35   };\n36 });\n```\n\
    \n#### 缓存服务调用\n\n在每次路由更改时，我们都会获取用户数据。这是为了确保我们的信息是最新的，特别是在登录后。然而，我们不希望每次调用都访问 API，所以有一种方法可以缓存这些信息。\n\
    \n为了缓存 `getUser()` 调用，我们需要打开 `AuthService.js` 文件。\n\n我们只需要像下面这样向 `$http.get()`\
    \ 调用添加内容：\n\n"
- fmt: "\n```javascript\n// get the logged in user\nauthFactory.getUser = function()\
    \ {\n  if (AuthToken.getToken())\n    return $http.get('/api/me', { cache: true\
    \ });\n  else\n    return $q.reject({ message: 'User has no token.' });    \n\
    };\n```\n\nThe important part here is `{ cache: true }`. Now whenever the `Auth.getUser()`\
    \ call is made, this will check if that information has already been cached. If\
    \ it is in the cache, then it will return the cached information. If not, then\
    \ it will make the API call.\n\n***\n\n### Log a user in\n\nWe will have a function\
    \ to log a user in. This will authenticate the user with `username` and `password`.\
    \ `vm.loginData.username` is bound to an input that we will create in our view.\n\
    \n### Log a user out\n\nWe will call `Auth.logout()`, which will delete the user’s\
    \ token in `localStorage` and any information stored in the mainController `vm.user`\
    \ object. Then we will redirect the user to the home page since they will be unauthenticated\
    \ and therefore won’t have access to any other pages.\n\n### Home Page View\n\n\
    Just like in the Angular routing chapter, we will need a main file to be the overall\
