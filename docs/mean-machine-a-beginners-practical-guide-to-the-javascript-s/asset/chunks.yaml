    \ file since we already have Express installed.\n\n### Basic Routes\n\nWe’ve already\
    \ defined our basic route in the home page. Express let’s us define routes right\
    \ onto our `app` object. We can also handle multiple HTTP actions like `GET`,\
    \ `POST`, `PUT/PATCH`, AND `DELETE`.\n\nThis is the easiest way to define routes,\
    \ but as our application gets larger, we’ll need more organization for our routes.\
    \ Just imagine an application that has an administration section and a frontend\
    \ section, each with multiple routes. Express’s router helps us to organize these\
    \ when we define them.\n\nFor the following routes, we won’t be sending views\
    \ to the browser, just messages. This will be easier since what we want to focus\
    \ on is the routing aspects.\n\n### express.Router()\n\nThe [express.Router()](http://expressjs.com/api#router)\
    \ acts as a mini application. You can call an instance of it (like we do for Express)\
    \ and then define routes on that. Let’s look at an example so we know exactly\
    \ what this means. Add this to your ‘server.js’ file if you’d like to follow along.\n\
    \nUnderneath our `app.get()` route inside of `server.js`, add the following. We’ll\
    \ 1\\. **call an instance of the router** 2\\. **apply routes to it** 3\\. and\
    \ then **add those routes to our main app**\n\n```\n 1 // create routes for the\
    \ admin section\n 2 \n 3 // get an instance of the router\n 4 var adminRouter\
    \ = express.Router();\n 5 \n 6 // admin main page. the dashboard (http://localhost:1337/admin)\n\
    \ 7 adminRouter.get('/', function(req, res) {\n 8 \tres.send('I am the dashboard!');\n\
    \ 9 });\n10 \n11 // users page (http://localhost:1337/admin/users)\n12 adminRouter.get('/users',\
    \ function(req, res) {\n13 \tres.send('I show all the users!');\n14 });\n15 \n\
    16 // posts page (http://localhost:1337/admin/posts)\n17 adminRouter.get('/posts',\
    \ function(req, res) {\n18 \tres.send('I show all the posts!');\n19 });\n20 \n\
    21 // apply the routes to our application\n22 app.use('/admin', adminRouter);\n\
    ```\n\nWe will call an instance of the `express.Router()` and assign it to the\
    \ `adminRouter` variable, apply routes to it, and then tell our application to\
    \ use those routes."
