- fmt: "\nWe will show and hide the processing icon using `ngIf` and bind it to a\
    \ variable called `processing`. Let’s update the `doLogin()` function in our `mainController`\
    \ file to add this variable.\n\n```\n 1 // function to handle login form\n 2 vm.doLogin\
    \ = function() {\n 3   vm.processing = true;\n 4 \n 5   Auth.login(vm.loginData.username,\
    \ vm.loginData.password)\n 6     .success(function(data) {\n 7       vm.processing\
    \ = false;\n 8 \n 9       // if a user successfully logs in, redirect to users\
    \ page\n10       $location.path('/users');\n11     });\n12 };\n```\n\nWhen a user\
    \ clicks `Login`, we have set the `processing` variable to `true`. When the function\
    \ is done processing, we will set the variable to `false`.\n\nNow all well have\
    \ left to do is create the processing icon and show it.\n\nIn our `login.html`\
    \ file, let’s add the icon to the Login button.\n\n```\n1 <button type=\"submit\"\
    \ class=\"btn btn-block btn-primary\">\n2 \n3   <span ng-if=\"!login.processing\"\
    >Login</span>\n 4 \n5   <span ng-if=\"login.processing\" class=\"spinner\"><span\
    \ class=\"glyphicon glyphico\\\n6 n-repeat\"></span></span>\n 7 \n8 </button>\n\
    ```\n\nIf the variable is true, we will show the spinner. Otherwise, our button\
    \ will always say `Login`.\n\nJust a little CSS to handle the spinning animation\
    \ and we should be good. Add the following to `style.css`:\n\n```\n 1 /* ANIMATIONS\n\
    \ 2 ====================== */\n 3 .spinner {\n 4   animation:spin 1s infinite;\n\
    \ 5   -webkit-animation:spin 1s infinite;\n 6   -moz-animation:spin 1s infinite;\n\
    \ 7 }\n 8 \n 9 @keyframes spin {\n10   from  { transform:rotate(0deg); }\n11 \
    \  to    { transform:rotate(360deg); }\n12 }\n13 \n14 @-webkit-keyframes spin\
    \ {\n15   from  { -webkit-transform:rotate(0deg); }\n16   to    { -webkit-transform:rotate(360deg);\
    \ }\n17 }\n18 \n19 @-moz-keyframes spin {\n20   from  { -moz-transform:rotate(0deg);\
    \ }  \n21   to    { -moz-transform:rotate(360deg); }\n22 }\n```\n\nWhatever element\
    \ we add this `spinner` class to will start spinning. If we click the Login button\
    \ now, we will see the spinner.\n\n![Login Spinner](images/17-user-crm----login-spinner.jpg)\n\
    \nLogin Spinner\n\nThis technique can be used throughout our entire application.\n\
    \n### Adding a Login Error Message\n\nIf login is not successful, we will want\
    \ to let our users know. Since our API already gives back error messages, all\
    \ we have to do is display them.\n\nInside of our login function, we will check\
    \ for the `success` variable that was returned to us by the API.\n\n```\n 1  \
    \ vm.doLogin = function() {\n 2     vm.processing = true;\n 3 \n 4     // clear\
    \ the error\n 5     vm.error = '';\n 6 \n 7     Auth.login(vm.loginData.username,\
    \ vm.loginData.password)\n 8       .success(function(data) {\n 9         ...\n\
    10 \n11         // if a user successfully logs in, redirect to users page\n12\
    \         if (data.success) \n13           $location.path('/users');\n14     \
    \    else\n15           vm.error = data.message;\n16       });\n```\n\nEvery time\
    \ we click login, the error message will be cleared so we don’t see an out-of-date\
    \ error message. In our view, we just have to check for that error. Above the\
    \ login button, add the following:\n\n```\n1 <div class=\"alert alert-danger\"\
    \ ng-if=\"login.error\">\n2   {{ login.error }}\n3 </div>\n```\n\nIf the error\
    \ variable exists, then we will display this div.\n\n![User Doesn't Exist](images/17-user-crm----user-not-found.jpg)\n\
    \nUser Doesn’t Exist\n\n![Wrong Password](images/17-user-crm----wrong-password.jpg)\n\
    \nWrong Password\n\nWith our foundation of the site and login ready to go, we\
    \ will now want to handle a little more authentication and then create the pages\
    \ that will show our users.\n\n### Authentication\n\nWe have already used the\
    \ `Auth` factory in our `mainController`. We’ve called all the functions including\
    \ `isLoggedIn`, `login`, `logout`, and `getUser`.\n\nOur user can login and their\
    \ token is stored in `localStorage`. If you check your browser’s local storage,\
    \ you will be able to see the token. Before we can get our list of users for the\
    \ users pages, we must attach this token to every request. This is where the `AuthInterceptor`\
    \ we created in our `authService` comes in handy.\n\nWe will use this in the main\
    \ `app.js` file. Let’s look at how it is applied:\n\n```\n 1 angular.module('userApp',\
    \ [\n 2   'ngAnimate', \n 3   'app.routes', \n 4   'authService', \n 5   'mainCtrl',\
    \ \n 6   'userCtrl', \n 7   'userService'\n 8 ])\n 9 \n10 .config(function($httpProvider)\
    \ {\n11   $httpProvider.interceptors.push(AuthInterceptor);\n12 });\n```\n\n###\
    \ User Pages\n\nWe have already used the `Auth` factory in our `mainController`.\
    \ We’ve called all the functions including `isLoggedIn`, `login`, `logout`, and\
    \ `getUser`.\n\nOur user can login and their token is stored in `localStorage`.\
    \ If you check your browser’s local storage, you will be able to see the token.\
    \ Before we can get our list of users for the users pages, we must attach this\
    \ token to every request. This is where the `AuthInterceptor` we created in our\
    \ `authService` comes in handy.\n\nWe will use this in the main `app.js` file.\
    \ Let’s look at how it is applied:\n\n#### All Users\n\n```\n 1 angular.module('userCtrl',\
    \ ['userService'])\n 2 .controller('all', function(User) {\n 3   var vm = this;\n\
    \ 4 \n 5   vm.processing = true;\n 6 \n 7   User.all()\n 8     .success(function(data)\
    \ {\n 9       vm.processing = false;\n10       vm.users = data;\n11     });\n\
    \ 12 })\n```\n\n#### All Users View (pages/users/all.html)\n\n```\n 1 <div class=\"\
    page-header\">\n2   <h1>\n 3     Users \n4     <a href=\"/users/create\" class=\"\
    btn btn-default\">\n 5       <span class=\"glyphicon glyphicon-plus\"></span>\
    \ \n 6       New User\n 7     </a>\n 8   </h1>\n 9 \n10 </div>\n11 \n12 <!-- LOADING\
    \ MESSAGE -->\n13 <div class=\"jumbotron text-center\" ng-show=\"user.processing\"\
    >\n14   <span class=\"glyphicon glyphicon-repeat\"></span>\n15   <p>Loading Users...</p>\n\
    16 </div>\n17 \n18 <table class=\"table table-bordered table-striped\" ng-show=\"\
    user.users\">\n19   <thead>\n20     <tr>\n21       <th>_id</th>\n22       <th>Name</th>\n\
    23       <th>Username</th>\n24       <th class=\"col-sm-2\"></th>\n25     </tr>\n\
    26   </thead>\n27   <tbody>\n28 \n29     <!-- LOOP OVER THE USERS -->\n30    \
    \ <tr ng-repeat=\"person in user.users\">\n31       <td>{{ person._id }}</td>\n\
    32       <td>{{ person.name }}</td>\n33       <td>{{ person.username }}</td>\n\
    34       <td class=\"col-sm-2\">\n35         <a ng-href=\"/users/{{ person._id\
    \ }}\" class=\"btn btn-danger\">Edit</a>\n36       </td>\n37     </tr>\n38   </tbody>\n\
    39 </table>\n```\n"
  raw: "We will show and hide the processing icon using `ngIf` and bind it to a variable\
    \ called `processing`. Let’s update the `doLogin()` function in our `mainController`\
    \ file to add this variable.\n\n```\n 1 // function to handle login form\n 2 vm.doLogin\
    \ = function() {\n 3   vm.processing = true;\n 4 \n 5   Auth.login(vm.loginData.username,\
    \ vm.loginData.password)\n 6     .success(function(data) {\n 7       vm.processing\
    \ = false;\n 8 \n 9       // if a user successfully logs in, redirect to users\
    \ page\n10       $location.path('/users');\n11     });\n12 };\n```\n\nWhen a user\
    \ clicks **Login**, we have set the `processing` variable to **true**. When the\
    \ function is done processing, we will set the variable to **false**.\n\nNow all\
    \ well have left to do is create the processing icon and show it.\n\nIn our `login.html`\
    \ file, let’s add the icon to the Login button.\n\n```\n1 <button type=\"submit\"\
    \ class=\"btn btn-block btn-primary\">\n2 \n3   <span ng-if=\"!login.processing\"\
    >Login</span>\n4 \n5   <span ng-if=\"login.processing\" class=\"spinner\"><span\
    \ class=\"glyphicon glyphico\\\n6 n-repeat\"></span></span>\n7 \n8 </button>\n\
    ```\n\nIf the variable is true, we will show the spinner. Otherwise, our button\
    \ will always say **Login**.\n\nJust a little CSS to handle the spinning animation\
    \ and we should be good. Add the following to `style.css`:\n\n```\n 1 /* ANIMATIONS\n\
    \ 2 ====================== */\n 3 .spinner {\n 4   animation:spin 1s infinite;\n\
    \ 5   -webkit-animation:spin 1s infinite;\n 6   -moz-animation:spin 1s infinite;\n\
    \ 7 }\n 8 \n 9 @keyframes spin {\n10   from  { transform:rotate(0deg); }\n11 \
    \  to    { transform:rotate(360deg); }\n12 }\n13 \n14 @-webkit-keyframes spin\
    \ {\n15   from  { -webkit-transform:rotate(0deg); }\n16   to    { -webkit-transform:rotate(360deg);\
    \ }\n17 }\n18 \n19 @-moz-keyframes spin {\n20   from  { -moz-transform:rotate(0deg);\
    \ }  \n21   to    { -moz-transform:rotate(360deg); }\n22 }\n```\n\nWhatever element\
    \ we add this `spinner` class to will start spinning. If we click the Login button\
    \ now, we will see the spinner.\n\n![Login Spinner](images/17-user-crm----login-spinner.jpg)\n\
    \nLogin Spinner\n\nThis technique can be used throughout our entire application.\n\
    \n#### Adding a Login Error Message\n\nIf login is not successful, we will want\
    \ to let our users know. Since our API already gives back error messages, all\
    \ we have to do is display them.\n\nInside of our login function, we will check\
    \ for the `success` variable that was returned to us by the API.\n\n```\n 1  \
    \ vm.doLogin = function() {\n 2     vm.processing = true;\n 3 \n 4     // clear\
    \ the error\n 5     vm.error = '';\n 6 \n 7     Auth.login(vm.loginData.username,\
    \ vm.loginData.password)\n 8       .success(function(data) {\n 9         ...\n\
    10 \n11         // if a user successfully logs in, redirect to users page\n12\
    \         if (data.success) \n13           $location.path('/users');\n14     \
    \    else\n15           vm.error = data.message;\n16       });\n```\n\nEvery time\
    \ we click login, the error message will be cleared so we don’t see an out-of-date\
    \ error message. In our view, we just have to check for that error. Above the\
    \ login button, add the following:\n\n```\n1 <div class=\"alert alert-danger\"\
    \ ng-if=\"login.error\">\n2   {{ login.error }}\n3 </div>\n```\n\nIf the error\
    \ variable exists, then we will display this div.\n\n![User Doesn't Exist](images/17-user-crm----user-not-found.jpg)\n\
    \nUser Doesn’t Exist\n\n![Wrong Password](images/17-user-crm----wrong-password.jpg)\n\
    \nWrong Password\n\nWith our foundation of the site and login ready to go, we\
    \ will now want to handle a little more authentication and then create the pages\
    \ that will show our users.\n\n### Authentication\n\nWe have already used the\
    \ `Auth` factory in our `mainController`. We’ve called all the functions including\
    \ `isLoggedIn`, `login`, `logout`, and `getUser`.\n\nOur user can login and their\
    \ token is stored in localStorage. If you check your browser’s local storage,\
    \ you will be able to see the token. Before we can get our list of users for the\
    \ users pages, we must attach this token to every request. This is where the `AuthInterceptor`\
    \ we created in our `authService` comes in handy.\n\nWe will use this in the main\
    \ `app.js` file. Let’s look at how it is applied:\n\n```\n 1 angular.module('userApp',\
    \ [\n 2   'ngAnimate', \n 3   'app.routes', \n 4   'authService', \n 5   'mainCtrl',\
    \ \n 6   'userCtrl', \n 7   'userService'\n 8 ])\n 9 \n10 // application configuration\
    \ to integrate token into requests\n11 .config(function($httpProvider) {\n12 \n\
    13   // attach our auth interceptor to the http requests\n14   $httpProvider.interceptors.push('AuthInterceptor');\n\
    15 \n16 });\n```\n\nJust like we create `.controller`s and `.factory`s on our\
    \ angular.modules, we can use `.config` to add extra configurations to our application.\
    \ In this case, we are adding the `AuthInterceptor` to the $httpProvider.\n\n\
    The $httpProvider will attach the token to each request. We’ll see exactly where\
    \ this happens when we request user information in the next section.\n\nNow that\
    \ we are authenticated, we will be redirected to a page that lists all users in\
    \ the database.\n\n### User Pages\n\nTo create each user page, we will need a\
    \ new **controller**, **route**, and **view**. Let’s start by showing all the\
    \ users on a single page.\n\n#### All Users\n\nWe will need to go into our `userCtrl.js`\
    \ file and add a controller for this page.\n\n##### All Users Controller\n\n```\n\
    \ 1 // start our angular module and inject userService\n 2 angular.module('userCtrl',\
    \ ['userService'])\n 3 \n 4 // user controller for the main page\n 5 // inject\
    \ the User factory\n 6 .controller('userController', function(User) {\n 7 \n 8\
    \   var vm = this;\n 9 \n10   // set a processing variable to show loading things\n\
    11   vm.processing = true;\n12 \n13   // grab all the users at page load\n14 \
    \  User.all()\n15     .success(function(data) {\n16 \n17       // when all the\
    \ users come back, remove the processing variable\n18       vm.processing = false;\n\
    19 \n20       // bind the users that come back to vm.users\n21       vm.users\
    \ = data;\n22     });\n23 \n24 })\n```\n\nWhen the user page loads, we will use\
    \ the User factory to go and grab all of our users. Those users will be bound\
    \ to the `vm.users` variable so that we can use them in our view. Like the login\
    \ page, we are using the `processing` variable to show loading icons.\n\n#####\
    \ All Users View (pages/users/all.html)\n\nOur main view will contain a few different\
    \ components.\n\n*   A header with a button to create a new user\n\n*   A message\
    \ that says “Loading Users…”\n\n*   A table of our users\n\n*   Button to edit\
    \ a user\n\n```\n 1 <div class=\"page-header\">\n 2   <h1>\n 3     Users \n 4\
    \     <a href=\"/users/create\" class=\"btn btn-default\">\n 5       <span class=\"\
    glyphicon glyphicon-plus\"></span> \n 6       New User\n 7     </a>\n 8   </h1>\n\
    \ 9 \n10 </div>\n11 \n12 <!-- LOADING MESSAGE -->\n13 <div class=\"jumbotron text-center\"\
    \ ng-show=\"user.processing\">\n14   <span class=\"glyphicon glyphicon-repeat\
    \ spinner\"></span>\n15   <p>Loading Users...</p>\n16 </div>\n17 \n18 <table class=\"\
    table table-bordered table-striped\" ng-show=\"user.users\">\n19   <thead>\n20\
    \     <tr>\n21       <th>_id</th>\n22       <th>Name</th>\n23       <th>Username</th>\n\
    24       <th class=\"col-sm-2\"></th>\n25     </tr>\n26   </thead>\n27   <tbody>\n\
    28 \n29     <!-- LOOP OVER THE USERS -->\n30     <tr ng-repeat=\"person in user.users\"\
    >\n31       <td>{{ person._id }}</td>\n32       <td>{{ person.name }}</td>\n33\
    \       <td>{{ person.username }}</td>\n34       <td class=\"col-sm-2\">\n35 \
    \        <a ng-href=\"/users/{{ person._id }}\" class=\"btn btn-danger\">Edit</a>\n\
    36       </td>\n37     </tr>\n38 \n39   </tbody>\n40 </table>\n```\n\nThis will\
    \ show all of our users in a table. We will only show the loading message if the\
    \ `processing` variable is true. We will also only show the user table if the\
    \ `users` object has users.\n\nWe will use the `ng-repeat` directive as a table\
    \ row to loop over all our users. There is also an edit button that will link\
    \ to the edit user page and pass in the user’s id into the URL.\n\nThe last part\
    \ needed to see this users page is to create the route.\n\n##### All Users Route"
