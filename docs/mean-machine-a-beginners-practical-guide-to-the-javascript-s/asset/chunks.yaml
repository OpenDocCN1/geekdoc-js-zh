    \ same for both methods. The only file that will change between the two methods\
    \ is the `server.js` file because that’s where we will start up our Node server.\n\
    \n#### package.json\n\nHere is our simple `package.json` file:\n\n```\n1 {\n2\
    \   \"name\": \"http-server\",\n3   \"main\": \"server.js\"\n4 }\n```\n\n####\
    \ index.html\n\nLet’s fill out a simple `index.html` file also:\n\n```\n 1 <!DOCTYPE\
    \ html>\n 2 <html lang=\"en\">\n 3 <head>\n 4 \t<meta charset=\"UTF-8\">\n 5 \t\
    <title>Super Cool Site</title>\n 6 \t<style>\n 7 \t\tbody { \n 8 \t\t\ttext-align:center;\
    \ \n 9 \t\t\tbackground:#EFEFEF; \n10 \t\t\tpadding-top:50px;\n11 \t\t}\n12 \t\
    </style>\n13 </head>\n14 <body>\n15 \n16 \t<h1>Hello Universe!</h1>\n17 \t\n18\
    \ </body>\n19 </html>\n```\n\n### Method #1: Pure Node (no Express)\n\nWhen using\
    \ Method #1, we will pull in two modules that are built into Node itself. The\
    \ [HTTP module](http://nodejs.org/api/http.html#http_http) is used to start up\
    \ HTTP servers and respond to HTTP requests from users. The [fs module](http://nodejs.org/api/fs.html#fs_file_system)\
    \ is used to read the file system. We will need to read our `index.html` from\
    \ the file system and then pass it to our user using an HTTP server.\n\nThe `server.js`\
    \ for Method #1 will have the following code:"
