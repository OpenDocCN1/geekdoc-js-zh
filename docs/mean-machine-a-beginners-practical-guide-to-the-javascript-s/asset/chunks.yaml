    \ 绑定到我们在视图中创建的输入框。\n\n### 退出用户\n\n我们将调用 `Auth.logout()`，它将删除 `localStorage` 中的用户令牌以及存储在\
    \ `mainController` 的 `vm.user` 对象中的任何信息。然后我们将用户重定向到主页，因为他们将未经过身份验证，因此无法访问任何其他页面。\n\
    \n### 首页视图\n\n就像 Angular 路由章节一样，我们需要一个主文件作为网站的整体布局。由于 Node.js 向我们的用户返回此 `index.html`\
    \ 文件，这将是我们的布局文件。\n\n**public/app/views/index.html**\n\n```html\n<!DOCTYPE html>\n\
