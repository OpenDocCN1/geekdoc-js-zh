  raw: 'Again, this is a more advanced approach for larger applications. For the purposes
    of our demos, the structure we’ve been using works. Just keep it in mind because
    as our applications grow, it might be worth looking into this structure.


    * * *


    Practice makes perfect and the more MEAN applications that you create the more
    these concepts will solidify in your mind.


    ### Next Up


    We have our MEAN stack application done, but there is still so much more to learn.
    The next thing we need to do is deploy our site so that other people are able
    to view it online. After all, what good is all this work if we can’t show it off?
    Let’s look at how we can deploy our awesome new site to the web.


    ## Deploying MEAN Applications


    Up to this point, we have been working locally on our computers when building
    all these applications. We have been creating our files, starting our server courtesy
    of Node and Express, and testing on `http://localhost:8080`.


    The great things we create won’t be visible to the rest of the world! We’ll need
    to deploy our applications to some hosting service so that we can access it from
    a website.


    There are many different ways to deploy sites to an online server. For our purposes,
    it is best to look for an online host that specializes in hosting Node applications.


    Currently, the most popular server configuration is the LAMP stack (Linux, Apache,
    MySQL, and PHP). Since we are using Node instead of Apache, MongoDB instead of
    MySQL, and Node instead of PHP, it makes sense to look for a host that specializes
    in this sort of thing.


    ### Great Node Hosts


    Each of these hosts provides great features and are good choices for deploying
    your applications.


    [Modulus](https://modulus.io/) - We’ve been using Modulus to host MongoDB databases
    in some of our chapters. They also provide great Node hosting and feature really
    good support.


    [Digital Ocean](https://www.digitalocean.com/) - Digital Ocean is a VPS (virtual
    private server) provider so you are tasked with configuring and setting up your
    own server. Digital Ocean offers SSH access and plans that start at $5/mo. They
    also provide server images to install a Node environment with just a click of
    a button.


    [Heroku](https://www.heroku.com/) - Our personal favorite for hosting Node applications.
    Deploying Heroku applications is extremely easy and the command line tools they
    provide are very simple to get started with. They also let you host smaller applications
    for free, though there are limits to the amount of traffic they will support.


    **Honorable Mention**


    These hosts have great reputations, but we haven’t used them personally:


    *   [Joyent](https://www.joyent.com/) - The creator’s of Node offer great cloud
    computing options with scalable pricing.


    *   [Nodejitsu](https://www.nodejitsu.com/) - An easy to use hosting solution
    created by some of the earliest contributors to Node.


    Heroku provides a great balance between price, features, support, uptime, and
    tools available. We’ll be looking at how to deploy a MEAN stack application to
    Heroku. This process is similar to other hosts and these techniques can be used
    across most of them.


    ### Deploying to Heroku


    Heroku is known for making server configurations easy and painless. It allows
    us to build faster and focus on the details of our application rather than trying
    to configure our own servers.


    We’ll be deploying the full MEAN stack application that we have been working on
    throughout the book - our User CRM. The deployment is a fairly pain-free process
    and we’ll have our full application on the web in mere minutes.


    Let’s get started.


    #### Create a Heroku Account


    Go ahead and go to [Heroku.com](https://heroku.com) and create your free account.
    As you can see, the dashboard is incredibly simple and user friendly. It gives
    us this great **Getting Started with Heroku** dialog where we can find the instructions
    for each type of app you can deploy.


    ![Heroku Dashboard](images/18-mean-deployment----01-heroku-dashboard.jpg)


    Heroku Dashboard


    We’ll be walking through Heroku’s [Node deployment instructions](https://devcenter.heroku.com/articles/getting-started-with-nodejs).
    You can follow along with this book and reference that link in the future since
    they provide a large amount of scenarios for deployment.


    #### Tools Needed


    You’ll need a few things to start your deployment:


    *   [Node and npm](http://nodejs.org/) (pretty sure you already have this one
    installed)


    *   [Heroku Toolbelt](https://toolbelt.heroku.com/)


    *   [Git](http://git-scm.com/)


    ### Git Repository


    First, we will need to turn our application into a git repository. First we are
    going to create a local git repository and then have a git remote pointed at Heroku.
    We will then have the ability to push straight to Heroku.


    *If you already have been using a git repository for your projects and have been
    working on GitHub or BitBucket, awesome! You already have a git repository and
    can skip this step.*


    To create your local git repository, make sure you have [git](http://git-scm.com/)
    installed and have access to the `git` commands in your console.


    `cd` into your project and type the following to create a git repository:


    `git init`


    That will create your git repository. Now we will need to add your files to the
    repository and commit them.


    `git add .`


    `git commit -m ''adding first files''`


    ![Git Repo Creation](images/18-mean-deployment----git-repo.jpg)


    Git Repo Creation


    Now that we have our git repository ready to go, we can move onto the Heroku side
    of things.


    #### The Heroku Toolbelt


    The toolbelt will give us access to the Heroku Command Line Utility which we will
    need for deploying to Heroku.


    ![Heroku Toolbelt](images/18-mean-deployment----heroku-toolbelt.jpg)


    Heroku Toolbelt


    After we install the Toolbelt, we’ll have access to the `heroku` command. Go into
    your command line and type:


    ```

    1 $ heroku

    ```


    ![Heroku Command](images/18-mean-deployment----02-heroku-installed.jpg)


    Heroku Command


    Now you can see all the commands available to us. We’ll only be using a few of
    them when deploying to Heroku in this chapter. The first of these will be logging
    in.


    #### Logging Into Heroku


    This is the way we can link our local desktop to Heroku. We will authenticate
    from the command line so that Heroku will know that we are authorized to send
    applications for deployment. This is a fairly easy process.


    Just type:


    ```

    1 $ heroku login

    ```


    ![Heroku Login](images/18-mean-deployment----03-heroku-login.jpg)


    Heroku Login


    We’ll authenticate and Heroku will also ask you to upload a public SSH key. Since
    I already have my SSH key on Heroku, it did not prompt me for that. Now let’s
    move on and start building a very simple application so that we can deploy it
    to Heroku.


    ### Deploying Our User CRM App


    We will be taking the User CRM application that we created and deploy that to
    Heroku so that we can see exactly how to make our MEAN application live.


    This is a very simple process. From within the folder of your git repo, we take
    the following steps:


    1.  Create a remote repository (called `heroku` as opposed to our main `origin`
    remote repository) so our application knows where to push our deployable code


    2.  Push the repository!


    Let’s create the remote repository:


    ```

    1 $ heroku create

    ```


    ![Heroku Create](images/18-mean-deployment----05-heroku-create.jpg)


    Heroku Create


    * * *


    ##### Heroku Warning


    Heroku’s warning here about updating Git is misplaced. Their blog says to update
    to version 1.9.5, which is what we are using here. We’ve reached out to see what
    can be done about this and will update this chapter with information on that.


    Just keep moving forward since this warning does not affect our ability to use
    git or the Heroku Toolbelt.


    * * *


    We can now see that our remote repository has been created by typing the git command:


    ```

    1 $ git remote -v

    ```


    ![Git Remotes](images/18-mean-deployment----git-remote.jpg)


    Git Remotes'
