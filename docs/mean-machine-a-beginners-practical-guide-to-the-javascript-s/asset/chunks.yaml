    \ install:\n\n```\n1 $ npm install gulp-nodemon --save-dev\n```\n\nTo configure\
    \ this package is a little different then we’re used to. We will have to define\
    \ a few things like starting file (`server.js`), types of files to watch (`js\
    \ less html`), and the tasks to run.\n\n```\n 1 var nodemon = require('gulp-nodemon');\n\
    \ 2 \n 3 // the nodemon task\n 4 gulp.task('nodemon', function() {\n 5   nodemon({\n\
    \ 6     script: 'server.js',\n 7     ext: 'js less html'\n 8   })\n 9     .on('start',\
    \ ['watch'])\n10     .on('change', ['watch'])\n11     .on('restart', function()\
    \ {\n12       console.log('Restarted!');\n13     });\n14 });\n15 \n16 // defining\
    \ the main gulp task\n17 gulp.task('default', ['nodemon']);\n```\n\nNotice how\
    \ we defined the files to start with and the extensions to watch for. We also\
    \ defined the tasks (`watch` in this case) to work on server start and change.\n\
    \nWe are also defining a task called `default` which is the task that Gulp automatically\
    \ looks for at first.\n\nNow we can run our task with:\n\n```\n1 $ gulp\n```\n\
    \nWe can see our server start and Gulp watching for any files. When a file is\
    \ changed, Gulp will run the right tasks and then restart the server!\n\n![Gulp\
    \ Nodemon](images/19-mean-workflow----nodemon.jpg)\n\nGulp Nodemon\n\nAll of our\
    \ great development tools are now bundled into this one `gulpfile.js` and we are\
    \ more efficient developers! There are many more great Gulp plugins to look through,\
    \ so have fun experimenting with other plugins like [imagemin](https://www.npmjs.com/package/gulp-imagemin)\
    \ and [clean](https://www.npmjs.com/package/gulp-clean)."
