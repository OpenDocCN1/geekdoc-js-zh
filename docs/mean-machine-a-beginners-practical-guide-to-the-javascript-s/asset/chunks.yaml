    ### Code Repository


    The code for samples can be found at [http://github.com/scotch-io/mean-code](http://github.com/scotch-io/mean-code).


    ### Get In Contact


    If you have any questions, comments, kind words about the book, or corrections
    in the book, feel free to contact us at `chris@scotch.io` and `holly@scotch.io`.


    # Introduction


    Node is an exciting JavaScript language for web development that has been growing
    in popularity recent years. It started out for small development projects and
    has since penetrated the enterprise and can be seen in large companies like Microsoft,
    eBay, LinkedIn, Yahoo, Walmart, Uber, Oracle and several more.


    ### Why MEAN?


    MEAN stack uses four pieces of software: `MongoDB`, `ExpressJS`, `AngularJS`,
    and `NodeJS`. Using these four tools together lets developers create efficient,
    well organized and interactive applications quickly.


    Since every component of the stack uses JavaScript, you can glide through web
    development code seamlessly. Using all JavaScript lets us do some great things
    like:


    - Use JavaScript on the server-side (`Node` and `Express`)

    - Use JavaScript on the client-side (`Angular`)

    - Store JSON objects in `MongoDB`

    - Use JSON objects to transfer data easily from database to server to client


    > A single language across your entire stack increases productivity. Even client
    side developers that work in Angular can easily understand most of the code on
    the server side.


    Starting with the database, we store information in a JSON like format. We can
    then write JSON queries on our Node server and send this directly to our front-end
    using Angular. This is especially useful when you have multiple developers working
    on a project. Server-side code becomes more readable to front-end developers and
    vice versa. This makes everything a little more transparent and has been shown
    to greatly increase development time. The ease of development will become much
    more apparent once we start digging into examples and hopefully save you and your
    team some headaches in the future.


    ### When To Use the MEAN Stack


    The MEAN stack benefits greatly from the strengths of Node. Node lets us build
    real-time open APIs that we can consume and use with our frontend Angular code.
    Transferring data for applications like chat systems, status updates, or almost
    any other scenario that requires quick display of real-time data.


    - Chat client

    - Real-time user updates (like Twitter feed)

    - RSS feed

    - Online shop

    - Polling app


    ### When NOT To Use the MEAN Stack

