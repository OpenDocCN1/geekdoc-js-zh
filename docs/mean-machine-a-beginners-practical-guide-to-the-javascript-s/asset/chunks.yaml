    # Token Passed Through HTTP Header


    We can also pass the token in as a URL parameter like so: `http://localhost:8080/api/users?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJwYXNzd29yZCI6IiQyYSQxMCRyZ3JhdXB6c0RaSGJZNzdDUVNJbkh1WjkwUld2cS9OV3NpMGtPdWVlUGV0cVVCdmoyLmpLYSIsInVzZXJuYW1lIjoiY2hyaXMiLCJuYW1lIjoiQ2hyaXMiLCJfaWQiOiI1NDgxZTI2ZTkzYjliYmE3MTcxYmZkNWUiLCJfX3YiOjB9.fKBuDM0J1jpiAKfkPpr_b_NS6io8U4srLGuvEAfRhJg`


    ![Token Passed Through URL Parameter](images/10-node-authentication----token-url.jpg)


    # Token Passed Through URL Parameter


    ## Route to Get User Information


    Let’s quickly add one more route to our API so that we can return a user’s information.


    We will call this endpoint (`GET http://localhost:8080/api/me`) and this will
    allow us to get information about the logged in user.


    After all our other `apiRouter` routes, let’s define the following:


    ```

    1 // api endpoint to get user information

    2 apiRouter.get(''/me'', function(req, res) {

    3   res.send(req.decoded);

    4 });

    ```


    Remember in our middleware, we stored the logged in user in `req.decoded` for
    use in the other routes. Now we’ll just grab that information and return it. We’ll
    see how this is useful in the future Angular chapters when we want to display
    a logged in user’s name in a message (something like `Hello Chris`!).


    ## Modules to Help with Authentication


    Now that we have built all of this from scratch ourselves, it’s important to note
    that there are Node modules out there to help handle authentication for us. It
    is good to understand the basics by building security ourselves, but it also can
    help to have modules that are built by teams of people and make sure the security
    is solid.


    For handling authentication in Node, you won’t find a better package than [PassportJS](http://passportjs.org/).
    This allows us to integrate authentication on our server with session based security,
    social based authentication, and what we’ve done in this chapter, JWT security.


    There is even a package to handle checking the JWT and protecting routes called
    [express-jwt](https://github.com/auth0/express-jwt). This package creates a middleware
    for us so that we don’t have to. It will allow us to set protected and unprotected
    routes.


    ## Conclusion


    Now we have an API with token authentication! Just like the big companies like
    Facebook, Google, Twitter, and GitHub! Well not exactly like them since they implement
    more features like user specific permissions, group permissions, and many more
    advanced features, but this is the foundation of it.


    Remember that security is a very important part of our applications and protecting
    our users’ information should be top priority. Keep in mind that this is only
    just the beginning of security and that security is always evolving to guard from
    new and old attacks.


    This API will be used to hand data to our frontend AngularJS application. By doing
    so, we are once again adhering to the notion that our backend and frontend are
    both separate, yet work together to create amazing experiences.


    ## Starting Angular


    Let’s take a step back for a second. So far, we’ve worked our way through building
    an awesome backend, server-side service. We’ve learned how to create a RESTful
    API, how to use `MongoDB` to handle CRUD operations, and become fluent in `Node`.


    Now we have to handle the other side of the coin: the frontend. We have to become
    familiar with Angular applications, how they are set up, and how we will access
    our Node API and data that we’ve built.


    ### The State of JavaScript Applications


    If you’ve built JavaScript applications before without a framework (let’s use
    jQuery as an example), a lot of times you are grabbing and placing data within
    your application using `$(''#divname'').html()` or `$(''#divname'').append(variable)`.
    This causes problems since there isn’t a true source of data. You’re busy grabbing
    and placing numbers and elements here and there and sometimes you aren’t fully
    sure which is the latest and most valid piece of data.


    In MVC applications, the true source of data comes from the model which is facilitated
    to the view by the controller. This means there is a solid workflow for grabbing
    data. The view is built to just display data and be as logic free as possible.
    The model and controller are really where data manipulation need to take place.


    Angular helps solve these problems by treating front-end applications more like
    the back-end applications we’re used to. We like having data coming from a consistent
    place and just being injected into views. This keeps us sane since every part
    of our application has a true (singular) source of data.


    ### Introduction


    Angular calls itself “what HTML would have been, had it been designed for building
    web-apps”. It allows you as the developer to build out an MVC (model-view-controller)
    architecture for the frontend of your application. Since client-side applications
    are becoming more than just showing a static HTML page, new tools needed to be
    built to accommodate the growing JavaScript applications.


    Angular allows you to extend HTML so you are building on standards you already
    know, not learning a whole framework from scratch.


    ### Important Angular Concepts


    Some awesome concepts about Angular that will carry over to all the things we
    build are data-binding, dependency injection, and directives.


    #### Data-Binding


    [Data-binding](https://docs.angularjs.org/guide/databinding) allows us to have
    a centralized source of data. We’ll be talking a lot on the single true source
    of data. Forget about injecting data into your views using the jQuery ways of
    `append`, `val`, `html`, or whatever else jQuery provides. We will use Angular’s
    amazing data-binding to handle all of that for us.


    Let’s just imagine a scenario where you would create a variable in a controller.
    Then you would display that variable in your view. If you change the variable
    in your controller, it would automatically change in your view without you needing
    to inject it there (Angular does the injection for you by binding the variables
    in both places).


    The Angular docs provide a good explanation of this feature: “The compilation
    step produces a live view. Any changes to the view are immediately reflected in
    the model, and any changes in the model are propagated to the view. The model
    is the single-source-of-truth for the application state, greatly simplifying the
    programming model for the developer.”


    #### Dependency Injection


    An Angular application is a collection of a lot of different modules like a controller
    to handle passing data to our views, a service (seen as a model) that interacts
    with an API, a directive that will help us manipulate our views further, and so
    much more. When building our applications, we will take the modular approach since
    that let’ us build testable, modular, and scalable applications.


    Each module we build will be injected into our main application module to create
    the final product. Our main application will inherit the dependencies of the modules
    we inject into it and this is one of those times where you can use the saying:
    “the sum of its parts is greater than the whole”.


