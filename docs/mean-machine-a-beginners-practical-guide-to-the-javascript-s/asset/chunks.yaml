  trans: "\n\n在我们的 `app.routes.js` 文件中，在 `login` 路由下方添加以下内容：\n\n```\n1 // 显示所有用户\n\
    2 .when('/users', {\n3   templateUrl: 'app/views/pages/users/all.html',\n4   controller:\
    \ 'userController',\n5   controllerAs: 'user'\n6 });\n```\n\n这将使用我们刚刚创建的控制器和视图。在浏览器中访问\
    \ `http://localhost:8080/users`，你将看到我们做的所有工作整合在一起。\n\n![所有用户](img/17-user-crm----all-users.jpg)\n\
    \n所有用户\n\n另外一点需要注意的是，如果我们进入 Chrome 的网络工具并查看获取所有用户的请求，我们会看到 Angular 确实附加了我们的令牌（token）。\n\
    \n![访问令牌](img/17-user-crm----access-token.jpg)\n\n访问令牌\n\n页面上还有一件事要做的，就是提供删除用户的功能。\n\
    \n## 删除用户\n\n我们需要两个东西来添加删除功能：\n\n1.  控制器中的一个函数\n2.  视图中的一个按钮\n\n让我们先创建函数。在我们的\
    \ `userCtrl.js` 中，添加该函数：\n\n```\n 1 // 删除用户的函数\n 2 vm.deleteUser = function(id)\
    \ {\n 3   vm.processing = true;\n 4 \n 5   // 用户 id 作为参数\n 6   User.delete(id)\n\
    \ 7     .success(function(data) {\n 8 \n 9       // 获取所有用户以更新表格\n10       // 你也可以设置\
    \ api \n11       // 在删除调用时返回用户列表\n12       User.all()\n13         .success(function(data)\
    \ {\n14           vm.processing = false;\n15           vm.users = data;\n16  \
    \       });\n17 \n18     });\n19 };\n```\n\n此 `deleteUser` 函数将调用 `User` factory\
    \ 中的删除函数。当调用成功时，我们将进行调用来获取所有用户，然后更新 `users` 对象，反过来更新我们的表格。\n\n现在只需要在视图中有一个删除按钮。在\
    \ `views/pages/users/all.html` 的用户表格中，紧邻编辑按钮添加以下内容：\n\n```\n1 <a href=\"#\" \n\
    2   ng-click=\"user.deleteUser(person._id)\" \n3   class=\"btn btn-primary\">Delete</a>\n\
    ```\n\n我们传递了 `person._id`，并且得益于 `ngClick` Angular 指令，点击此按钮时我们将调用 `deleteUser`\
    \ 函数。\n\n现在当我们点击删除时，用户将被删除，我们的表格将得到更新。接下来，让我们制作**创建用户**组件。\n\n## 创建用户\n\n与列出所有用户的页面一样，我们需要为创建用户页面准备**控制器**、**路由**和**视图**。\n\
    \n### 创建控制器\n\n我们将在 `userCtrl.js` 文件中第一个创建的控制器下方添加一个控制器。我们将此命名为 `userCreateController`。\n\
    \n```\n 1 // 应用于创建页面的控制器\n 2 .controller('userCreateController', function(User)\
    \ {\n 3   \n 4   var vm = this;\n 5 \n 6   // 用于隐藏/显示视图元素的变量\n 7   // 区分创建或编辑页面\n\
    \ 8   vm.type = 'create';\n 9 \n10   // 创建用户的函数\n 11   vm.saveUser = function()\
    \ {\n 12     vm.processing = true;\n 13 \n 14     // 清空消息\n 15     vm.message\
    \ = '';\n 16 \n 17     // 使用 userService 中的创建函数\n 18     User.create(vm.userData)\n\
    \ 19       .success(function(data) {\n 20         vm.processing = false;\n 21\
    \ \n 22         // 清空表单\n 23         vm.userData = {};\n 24         vm.message\
    \ = data.message;\n 25       });\n 26       \n 27   };  \n 28 \n 29 )\n```\n\n\
    这对我们来说已经是非常标准的流程了。我们有一个名为 `saveUser` 的函数将用于视图中的表单。我们还调用了 `userService` 中的 `User.create()`\
    \ 函数。创建用户后，我们将显示消息并清空表单，这样就可以输入新用户。\n\n我们将整个 `userData` 对象传递到创建用户函数中，它包括：\n\n\
    ```\n1 // 所有信息都使用 ng-model 绑定到我们的表单\n2 {\n3   name: \"Holly\",\n4   username:\
    \ \"hollylawly\",\n5   password: \"supersecret\"\n6 }\n```\n\n这里的另一个添加是 `type`\
    \ 变量。它将用于我们的视图。由于我们在创建页面和编辑页面都使用同一个文件 (`views/pages/users/single.html`)，我们需要一种方法来区分它们。当然，你可以为这些页面创建两个独立的视图文件，但视图中只有\
    \ 2 处微小差异。通过这种方式，我们消除了一些重复代码。\n\n### 创建用户路由\n\n```\n1 // 创建新用户的表单\n2 // 相同的视图\n\
    3 .when('/users/create', {\n4   templateUrl: 'app/views/users/single.html',\n\
    5   controller: 'userCreateController',\n6   controllerAs: 'user'\n\n\n### 创建用户视图\
    \ (pages/users/single.html)\n\n```\n1 <div class=\"page-header\">\n2   <h1 ng-if=\"\
    user.type == 'create'\">创建用户</h1>\n3   <h1 ng-if=\"user.type == 'edit'\">编辑用户</h1>\n\
    4 </div>\n5 6 <form class=\"form-horizontal\" ng-submit=\"user.saveUser()\">\n\
    7   <div class=\"form-group\">\n8     <label class=\"col-sm-2\">名称</label>\n9\
    \     <div class=\"col-sm-6\">\n10      <input type=\"text\" class=\"form-control\"\
    \ ng-model=\"user.userData.name\">\n11    </div>\n12  </div>\n13  <div class=\"\
    form-group\">\n14    <label class=\"col-sm-2\">用户名</label>\n15    <div class=\"\
    col-sm-6\">\n16      <input type=\"text\" class=\"form-control\" ng-model=\"user.userData.username\"\
    >\n17    </div>\n18  </div>\n19  <div class=\"form-group\">\n20    <label class=\"\
    col-sm-2\">密码</label>\n21    <div class=\"col-sm-6\">\n22      <input type=\"\
    password\" class=\"form-control\" ng-model=\"user.userData.password\">\n23   \
    \ </div>\n24  </div>\n25  \n26  <div class=\"col-sm-6 col-offset-2\">\n27    <button\
    \ type=\"submit\" class=\"btn btn-success btn-block\" ng-if=\"user.type == 'create'\"\
    >创建用户</button>\n28    <button type=\"submit\" class=\"btn btn-success btn-block\"\
    \ ng-if=\"user.type == 'edit'\">更新用户</button>\n29  </div>\n30 </form>\n31 \n32\
    \ <div class=\"row show-hide-message\" ng-show=\"user.message\">\n33   <div class=\"\
    col-sm-6 col-offset-2\">\n34     \n35     <div class=\"alert alert-info\">\n36\
    \       {{ user.message }}\n37     </div>\n38   </div>\n39 </div>\n```\n\n这对我们来说已经是非常标准的流程了。我们有一个名为\
    \ `saveUser` 的函数将用于视图中的表单。我们还调用了 `userService` 中的 `User.create()` 函数。创建用户后，我们将显示消息并清空表单，这样就可以输入新用户。\n\
    \n我们将整个 `userData` 对象传递到创建用户函数中，它包括：\n\n```\n1 // 所有信息都使用 ng-model 绑定到我们的表单\n\
    2 {\n3   name: \"Holly\",\n4   username: \"hollylawly\",\n5   password: \"supersecret\"\
    \n6 }\n```\n\n这里的另一个添加是 `type` 变量。它将用于我们的视图。由于我们在创建页面和编辑页面都使用同一个文件 (`views/pages/users/single.html`)，我们需要一种方法来区分它们。当然，你可以为这些页面创建两个独立的视图文件，但视图中只有\
    \ 2 处微小差异。通过这种方式，我们消除了一些重复代码。\n\n### 编辑用户\n\n让我们运行编辑用户页面。我们将与创建用户页面使用相同的视图。唯一的区别是：\n\
    \n*   我们必须将参数传递到 URL (/users/user_id)\n*   我们需要在页面加载时获取用户信息\n*   我们需要将这些信息绑定到我们的表单\n\
    \n### 编辑用户控制器\n\n由于我们通过 URL 传递用户 ID，我们需要注入 Angular 的 `$routeParams` 模块来获取 URL\
    \ 参数。\n\n根据路由文件中命名的方式，我们将知道特定参数的名称。在本例中，我们获取的是 `$routeParams.user_id`。\n\n"
- fmt: "\n```\n 1 // controller applied to user edit page\n 2 .controller('userEditController',\
    \ function($routeParams, User) {\n 3 \n 4   var vm = this;\n 5 \n 6   // variable\
    \ to hide/show elements of the view\n 7   // differentiates between create or\
    \ edit pages\n 8   vm.type = 'edit';\n 9 \n10   // get the user data for the user\
    \ you want to edit\n11   // $routeParams is the way we grab data from the URL\n\
    \ 12   User.get($routeParams.user_id)\n 13     .success(function(data) {\n 14\
    \       vm.userData = data;\n 15     });\n 16 \n17   // function to save the user\n\
    \ 18   vm.saveUser = function() {\n 19     vm.processing = true;\n 20     vm.message\
    \ = '';\n 21 \n 22     // call the userService function to update \n 23     User.update($routeParams.user_id,\
    \ vm.userData)  24       .success(function(data) {\n 25         vm.processing\
    \ = false;\n 26 \n 27         // clear the form\n 28         vm.userData = {};\n\
    \ 29 \n 30         // bind the message from our API to vm.message\n 31       \
    \  vm.message = data.message;\n 32       });\n 33   };\n 34 \n 35 });\n```\n\n\
    When the edit user page loads, we will go and grab that user’s data by using the\
    \ `User.get()` function. This will hit our API and grab the user info. We will\
    \ then bind that object to `vm.userData`.\n\nSince `userData` is the object that\
    \ we used in our `/views/pages/users/single.html`, our form will automatically\
    \ populate with this data!\n\n### Edit User Route\n\nThis is where we define the\
    \ parameter name. We will pass in the `:user_id` here and that lets `$routeParams`\
    \ know that `$routeParams.user_id` exists in the controller we just made.\n\n\
    ```\n1 // page to edit a user\n2 .when('/users/:user_id', {\n3   templateUrl:\
    \ 'app/views/pages/users/single.html',\n4   controller: 'userEditController',\n\
    5   controllerAs: 'user'\n6 });\n```\n\n### Edit User View (pages/users/single.html)\n\
    \n```\n 1 <div class=\"page-header\">\n 2   <h1 ng-if=\"user.type == 'create'\"\
    >Create User</h1>\n 3   <h1 ng-if=\"user.type == 'edit'\">Edit User</h1>\n 4 </div>\n\
    \ 5 \n 6 <form class=\"form-horizontal\" ng-submit=\"user.saveUser()\">\n 7  \
    \ \n 8   <div class=\"form-group\">\n 9     <label class=\"col-sm-2 control-label\"\
    >Name</label>\n10     <div class=\"col-sm-6\">\n11       <input type=\"text\"\
    \ \n12         class=\"form-control\" \n13         ng-model=\"user.userData.name\"\
    >\n14     </div>\n15   </div>\n 16 \n 17   <div class=\"form-group\">\n 18   \
    \  <label class=\"col-sm-2 control-label\">Username</label>\n19     <div class=\"\
    col-sm-6\">\n20       <input type=\"text\" \n 21         class=\"form-control\"\
    \ \n22         ng-model=\"user.userData.username\">\n 23     </div>\n 24   </div>\n\
    \ 25 \n 26   <div class=\"form-group\">\n 27     <label class=\"col-sm-2 control-label\"\
    >Password</label>\n 28     <div class=\"col-sm-6\">\n29       <input type=\"password\"\
