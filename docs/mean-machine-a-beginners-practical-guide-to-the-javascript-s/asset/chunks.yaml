    \ can run Mongo without explicitly typing the full path every single time.\n\n\
    Open up your Environment Variables and enter the path to the bin folder where\
    \ you installed MongoDB (we are using `C:\\Program Files\\MongoDB 2.6 Standard\\\
    bin`). If you already have something in your PATH variable, you can add a semi-colon\
    \ and insert the new path right after.\n\n![MongoDB Environment Variable](images/08-mongodb----environment-variables.png\
    \ \"MongoDB Environment Variable\")\n\nMongoDB Environment Variable\n\nNow you\
    \ should be able to run:\n\n`mongod`\n\nin your command line. One common error\
    \ you may get is `dbpath (\\data\\db) does not exist`. If you receive this error,\
    \ go ahead and create this path inside of your C directory ‘C:\\data\\db’. This\
    \ is where all your data will be stored.\n\nIf you would like to specify a path\
    \ different than the default **data/db**, you can pass in a path like so:\n\n\
    `mongod --dbpath path/to/folder`\n\nOnce you create the path, start up mongo with\
    \ ‘mongod’ and you should see “waiting for connections on port 27017”. If you\
    \ didn’t create the PATH just navigate to the where your saved your executable,\
    \ something like “C:Program FilesMongodb\\bin\" and startup your mongo connection\
    \ with ‘mongod.exe’.\n\n![Starting MongoDB](images/08-mongodb----connecting.jpg)\n\
    \nStarting MongoDB\n\nNow we will be able to connect to our database and run some\
    \ commands! *Important:* Make sure you leave mongo running in that console and\
    \ open up a new one to test out these commands.\n\n### Common Database Commands\n\
    \nQueries in a document database system may be a little different than what you’re\
    \ used to. Rather than making a query for items in tables, we’re going to be querying\
    \ collections of documents.\n\nSince everything is stored in JSON style documents,\
    \ our syntax will be similar to how we would query our information in our applications.\n\
    \nOnce we have connected to our MongoDB instance using `mongod` and `mongo`, we\
    \ can start viewing the available databases and using them. Here are the common\
    \ commands.\n\n#### List All Databases\n\n```\n1 $ show databases\n```\n\n####\
    \ Creating a Database\n\n**MongoDB will not create a database unless you insert\
    \ information into that database.**\n\nThe trick is you don’t have to worry about\
    \ explicitly creating a database! You can just use a database (even if it’s not\
    \ created), create a collection and document, and everything will automatically\
    \ be made for you!\n\nWe’ll look at creating collections and documents in the\
    \ CRUD Commands section.\n\n#### Show Current Database\n\n```\n1 $ db\n```\n\n\
    #### Select a Database\n\n```\n1 $ use db_name\n```\n\nNow that we have the database\
    \ basics, let’s get to the main CRUD commands.\n\n### CRUD Commands\n\nBy using\
    \ the following commands, we can get familiar with MongoDB commands. These commands\
    \ will be similar to how we will handle CRUD operations in our Node.js applications.\n\
    \n#### Create\n\n```\n1 // save one user\n2 $ db.users.save({ name: 'Chris' });\n\
    3 \n4 // save multiple users\n5 $ db.users.save([{ name: 'Chris'}, { name: 'Holly'\
    \ }]);\n```\n\nBy saving a document into the `users` collection of the database\
    \ you are currently in, you have successfully **created both the database and\
    \ collection** if they did not already exist.\n\n#### Read\n\n```\n1 // show all\
    \ users\n2 $ db.users.find();\n3 \n4 // find a specific user\n5 $ db.users.find({\
    \ name: 'Holly' });\n```\n\n#### Update\n\n```\n1 db.users.update({ name: 'Holly'\
    \ }, { name: 'Holly Lloyd' });\n```\n\n#### Delete\n\n```\n1 // remove all\n2\
    \ db.users.remove({});\n3 \n4 // remove one\n5 db.users.remove({ name: 'Holly'\
    \ });\n```"
