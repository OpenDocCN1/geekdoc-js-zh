    )\n\nWalmart\n\n> **Walmart**: Walmart began using Node.js in 2012 to provide\
    \ mobile users with a modern front end experience. Making use of the JavaScript\
    \ platform, they were able to quickly and easily integrate their existing APIs\
    \ with their Node application. They also stated that 53% of their Black Friday\
    \ online traffic went to their Node servers with zero downtime.\n\n![Yahoo](images/yahoo.jpg\
    \ \"Yahoo\")\n\nYahoo\n\n> **Yahoo!**: Yahoo started experimenting with Node back\
    \ in 2010\\. At first they just used it for small things like file uploads, and\
    \ now they use Node to handle nearly 2 million requests per minute. They have\
    \ noted increases in speed and a simpler development process.\n\n![Linkedin](images/linkedin.jpg\
    \ \"Linkedin\")\n\nLinkedin\n\n> **LinkedIn** LinkedIn began developing the server\
    \ side of their mobile app entirely with Node. They were previously using Ruby,\
    \ but since the switch they have seen huge increases in performance, ranging from\
    \ 2 to 10 times faster.\n\n![Paypal](images/paypal.png \"Paypal\")\n\nPaypal\n\
    \n> **PayPal**: PayPal has recently jumped onboard and began migrating some of\
    \ their Java code to Node. They began experimenting with just their Account Overview\
    \ page, but once they saw a 35% speed increase and half the amount of time spent\
    \ on development, they started moving all sites to Node.js.\n\nFor a larger and\
    \ maintained list, visit the [Node Industry](http://nodejs.org/industry/) page.\n\
    \n## Primers\n\nLet’s take a quick look at the technologies we’ll be using. Remember,\
    \ this book is meant to teach you how all these pieces work together, so we won’t\
    \ be diving into the most advanced techniques and concepts of each (though we\
    \ will be going pretty far). We will provide links to more resources to further\
    \ your knowledge for each topic in each section.\n\n### MongoDB\n\nMongoDB, named\
    \ from the word “hu**mongo**us”, is an open-source NoSQL database that stores\
    \ documents in JSON-style format. It is the [leading NoSQL database](http://www.mongodb.com/leading-nosql-database)\
    \ based on the number of Google searches, job postings and job site (Indeed.com)\
    \ trends.\n\n**Mongo vs. MYSQL**\n\nLAMP, which uses MYSQL, has been the leading\
    \ stack for several years now. MYSQL is classified as a **relational database**.\n\
    \n* * *\n\n> **Relational database** Data is stored in tables that hold not only\
    \ the data, but also its relationship to other information in the database. —\n\
    \n**Document Databases**\n\nMongoDB, on the other hand, is classified as a non-relational\
    \ database, or more specifically a **document-oriented database**. This means\
    \ that you define your data structure however you want. You get the data-modeling\
    \ options to match your application and its performance requirements. You can\
    \ easily take complex objects and insert them into your database using JSON, XML,\
    \ BSON, or many other similar formats that are better suited to your application.\
    \ You can even store PDF documents in certain document databases if the use case\
    \ ever arises.\n\n* * *\n\n> **Document-oriented Database** A type of NoSQL database\
    \ which stores and retrieves data in a semi- structured document (as opposed to\
    \ tables in relational databases). —\n\nData modeling in MongoDB is extremely\
    \ flexible. One way to store data is by creating separate documents and creating\
    \ references to connect information. You can see below our Elf Info Document contains\
    \ basic information which we can reference with the Elf Address Document.\n\n\
    **Elf Info** `json { id: \"1234\", name: \"holly\", age: \"400\", type: \"high-elf\"\
    \ }`\n\n**Elf Address Book** `json { elven_id: \"1234\", city: \"rivendell\",\
    \ state: \"middle-earth\" }`\n\nAnother method is to embed the Elf Address straight\
    \ into the Elf Info document so that now you only have one document for each Elf,\
    \ which allows for less write operations to update information about an Elf as\
    \ well as faster performance (assuming your document doesn’t grow too large).\n\
    \n```\n 1 {\n 2   id: \"1234\",\n 3   name: \"holly\",\n 4   age: \"400\",\n 5\
    \   type: \"high-elf\",\n 6   address: {\n 7     city: \"rivendell\",\n 8    \
    \ state: \"middle-earth\"\n 9   }\n10 }\n```\n\nOnce you begin storing information\
    \ about multiple elves, each of their documents can be classified together as\
    \ one Elf Info Collection. A collection is just a group of related documents.\
    \ In this case they will all have the same fields with different values.\n\n**CAP\
    \ Theorem** There is a concept known as CAP or Brewer’s theorem which states that\
    \ distributed network systems can only provide two of the three following functionalities\
    \ at the same time:\n\n*   Consistency: All nodes in your application are available\
    \ to each other and showing the same data at the same time\n\n*   Availability:\
    \ All nodes are available to read and write\n\n*   Partition Tolerance: Even if\
    \ part of the system fails, your application will continue to operate\n\nThere\
    \ has been some confusion about how to interpret this, so Brewer later pointed\
    \ out that it really comes down to **consistency** vs. **availability**. Just\
    \ looking at the definitions alone, it becomes apparent that these are mutually\
    \ exclusive concepts. Let’s say you allow all nodes to be **available** for reading\
    \ and writing at all times. A real world example of where this would be important\
    \ is in a banking application. For the sake of example, let’s pretend overdraft\
    \ fees and all that fun stuff doesn’t exist. The bank needs to know your exact\
    \ account balance at all times. If you have $100 in your account and you withdraw\
    \ $100, you’re of course left with $0\\. Because all nodes are available to read\
    \ and write, there’s a chance that another debit could go through in the tiny\
    \ fraction of time that your account balance still reads $100\\. So then once\
    \ the account balance updates you will actually be in the negative because the\
    \ second debit was allowed through even though it should have been denied. This\
    \ is why **consistency** is more important in the case of this banking application.\n\
    \nThe cost of consistency is giving up some availability. As soon as you withdrew\
    \ money in the previous example, there should have been some locks put into place\
    \ preventing the account balance to be read as $100. If your application is unable\
    \ to read every node at every second, then it may appear down or unavailable to\
    \ some users. Some applications favor availability and performance over consistency,\
    \ which is where a lot of document-oriented databases shine."
