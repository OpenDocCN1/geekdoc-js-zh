    \ \"专业提示\")\n\n提示\n\n> 此图标表示一个专业提示。\n\n### 代码示例\n\n书中的代码被封装在如下所示的代码块中：\n\n###\
    \ 代码许可\n\n本书中的示例代码根据 [MIT](http://opensource.org/licenses/MIT) 许可证发布。\n\n### 代码仓库\n\
    \n可以在 [`github.com/scotch-io/mean-code`](http://github.com/scotch-io/mean-code)\
    \ 找到示例代码。\n\n### 联系我们\n\n如果您对本书有任何问题、意见、赞誉，或者发现书中的错误，请随时通过 `chris@scotch.io` 和\
    \ `holly@scotch.io` 与我们联系。\n\n# 介绍\n\nNode 是一种令人兴奋的 Web 开发 JavaScript 语言，近年来变得越来越流行。它最初用于小型开发项目，此后渗透到企业级，可以在微软、eBay、LinkedIn、Yahoo、沃尔、Uber、Oracle\
    \ 等许多大型公司看到。\n\n### 为什么选择 MEAN？\n\nMEAN Stack 使用四种软件：`MongoDB`、`ExpressJS`、`AngularJS`\
    \ 和 `NodeJS`。将这四种工具结合使用，允许开发者快速创建高效、组织良好且交互式的应用程序。\n\n由于栈中的每个组件都使用 JavaScript，你可以无缝地穿过\
    \ Web 开发代码。全栈 JavaScript 让我们能够完成很棒的事情：\n\n- 在服务端使用 JavaScript (`Node` 和 `Express`)\
    \ \n- 在客户端使用 JavaScript (`Angular`) \n- 在 `MongoDB` 中存储 JSON 对象\n- 使用 JSON 对象轻松地从数据库到服务器到客户端传输数据\n\
    \n> 整个技术栈使用同一种语言可以提高生产力。即使是工作在 Angular 中的客户端开发者，也能轻松理解服务端的大部分代码。\n\n从数据库开始，我们以类似\
    \ JSON 的格式存储信息。然后我们可以在 Node 服务器上编写 JSON 查询，并使用 Angular 将其直接发送到前端。当有多个开发者协作一个项目时，这特别有用。服务端代码对前端开发者来说更具可读性，反之亦然。这让一切变得更加透明，并证明能极大缩短开发时间。一旦我们开始深入研究示例，开发的便利性将变得更加明显，并希望在未来能为你和你的团队减少一些烦恼。\n\
    \n### 何时使用 MEAN Stack\n\nMEAN Stack 极大受益于 Node 的优势。Node 让我们能够构建实时开放 API，并与我们的前端\
    \ Angular 代码进行消费和使用。对于聊天系统、状态更新或几乎任何其他需要快速显示实时数据的场景，其数据传输非常有用。\n\n- 聊天客户端\n- 实时用户更新（如\
    \ Twitter 馈）\n- RSS 馈\n- 在线商店\n- 投票应用\n\n### 何时**不**使用 MEAN Stack\n\n"
- fmt: "\nAs with any language or set of languages, there are plenty of scenarios\
    \ where `MEAN` wouldn’t be the best fit and it’s very important to recognize this\
    \ before diving into coding. A lot of the benefits of the `MEAN` stack and reasons\
    \ why you would use it are rooted in its use of `Node`. We see this same trend\
    \ again with reasons you may not want to use it.\n\n`Node` is generally not the\
    \ best pick for CPU intensive tasks. There have been a few [arguments](http://neilk.net/blog/2013/04/30/why-you-should-use-nodejs-for-CPU-bound-tasks/)\
    \ for cases where `Node` actually did well in computationally heavy applications,\
    \ but for the novice it’s best to steer away from `Node` if you know your application\
    \ requires a lot of computing (in other words let’s not try to calculate the 1000th\
    \ prime number here).\n\n## Who’s Getting MEAN?\n\nMany developers have shouted\
    \ their praise for the `MEAN` stack. This stack uses JavaScript for for every\
    \ operation, which makes it appealing to developers who want to flow smoothly\
    \ through a project. Some large companies are already reaping the benefits and\
    \ have integrated `Node` into many of their operations.\n\n![Walmart](images/walmart.jpg\
    \ \"Walmart\")\n\nWalmart\n\n> **Walmart**: Walmart began using `Node.js` in 2012\
    \ to provide mobile users with a modern front end experience. Making use of the\
    \ JavaScript platform, they were able to quickly and easily integrate their existing\
    \ APIs with their `Node` application. They also stated that 53% of their Black\
    \ Friday online traffic went to their `Node` servers with zero downtime.\n\n![Yahoo](images/yahoo.jpg\
    \ \"Yahoo\")\n\nYahoo\n\n> **Yahoo!**: Yahoo started experimenting with `Node`\
    \ back in 2010\\. At first they just used it for small things like file uploads,\
    \ and now they use `Node` to handle nearly 2 million requests per minute. They\
    \ have noted increases in speed and a simpler development process.\n\n![Linkedin](images/linkedin.jpg\
    \ \"Linkedin\")\n\nLinkedin\n\n> **LinkedIn** LinkedIn began developing the server\
    \ side of their mobile app entirely with `Node`. They were previously using `Ruby`,\
    \ but since the switch they have seen huge increases in performance, ranging from\
    \ 2 to 10 times faster.\n\n![Paypal](images/paypal.png \"Paypal\")\n\nPaypal\n\
    \n> **PayPal**: PayPal has recently jumped onboard and began migrating some of\
    \ their `Java` code to `Node`. They began experimenting with just their Account\
    \ Overview page, but once they saw a 35% speed increase and half the amount of\
    \ time spent on development, they started moving all sites to `Node.js`.\n\nFor\
    \ a larger and maintained list, visit the [Node Industry](http://nodejs.org/industry/)\
    \ page.\n\n## Primers\n\nLet’s take a quick look at the technologies we’ll be\
    \ using. Remember, this book is meant to teach you how all these pieces work together,\
    \ so we won’t be diving into the most advanced techniques and concepts of each\
    \ (though we will be going pretty far). We will provide links to more resources\
    \ to further your knowledge for each topic in each section.\n\n### MongoDB\n\n\
    `MongoDB`, named from the word “hu**mongo**us”, is an open-source NoSQL database\
    \ that stores documents in JSON-style format. It is the [leading NoSQL database](http://www.mongodb.com/leading-nosql-database)\
    \ based on the number of Google searches, job postings and job site (Indeed.com)\
    \ trends.\n\n### Mongo vs. MYSQL\n\nLAMP, which uses `MYSQL`, has been the leading\
    \ stack for several years now. `MYSQL` is classified as a **relational database**.\n\
    \n> **Relational database** Data is stored in tables that hold not only the data,\
    \ but also its relationship to other information in the database. —\n\n### Document\
    \ Databases\n\n`MongoDB`, on the other hand, is classified as a non-relational\
    \ database, or more specifically a **document-oriented database**. This means\
    \ that you define your data structure however you want. You get the data-modeling\
    \ options to match your application and its performance requirements. You can\
    \ easily take complex objects and insert them into your database using JSON, `XML`,\
    \ `BSON`, or many other similar formats that are better suited to your application.\
    \ You can even store PDF documents in certain document databases if the use case\
    \ ever arises.\n\n> **Document-oriented Database** A type of NoSQL database which\
    \ stores and retrieves data in a semi- structured document (as opposed to tables\
    \ in relational databases). —\n\nData modeling in `MongoDB` is extremely flexible.\
    \ One way to store data is by creating separate documents and creating references\
    \ to connect information. You can see below our Elf Info Document contains basic\
    \ information which we can reference with the Elf Address Document.\n\n**Elf Info**\
    \ `json { id: \"1234\", name: \"holly\", age: \"400\", type: \"high-elf\" }`\n\
    \n**Elf Address Book** `json { elven_id: \"1234\", city: \"rivendell\", state:\
    \ \"middle-earth\" }`\n\nAnother method is to embed the Elf Address straight into\
    \ the Elf Info document so that now you only have one document for each Elf, which\
    \ allows for less write operations to update information about an Elf as well\
    \ as faster performance (assuming your document doesn’t grow too large).\n\n```\n\
    \ 1 {\n 2   id: \"1234\",\n 3   name: \"holly\",\n 4   age: \"400\",\n 5   type:\
    \ \"high-elf\",\n 6   address: {\n 7     city: \"rivendell\",\n 8     state: \"\
    middle-earth\",\n 9   }\n10 }\n```\n\nOnce you begin storing information about\
    \ multiple elves, each of their documents can be classified together as one Elf\
    \ Info Collection. A collection is just a group of related documents. In this\
    \ case they will all have the same fields.\n\n### CAP Theorem\n\nThere is a concept\
    \ known as `CAP` or Brewer’s theorem which states that distributed network systems\
    \ can only provide two of the following functionalities at the same time:\n\n\
    - Consistency: All nodes in your application are available to each other and showing\
    \ the same data at the same time\n- Availability: All nodes are available to read\
    \ and write\n- Partition Tolerance: Even if part of the system fails, your application\
    \ will continue\n\nThere has been some confusion about how to interpret this,\
    \ so Brewer later pointed out that it really comes down to **consistency** vs.\
    \ **availability**. Just looking at the definitions alone, it becomes apparent\
    \ that these are mutually exclusive concepts. Let’s say you allow all nodes to\
    \ be **available** for reading and writing at all times. A real world example\
    \ of where this would be important in a banking application. For the sake of example,\
    \ let’s pretend overdraft fees and all that fun stuff doesn’t exist. The bank\
    \ needs to know your exact account balance at all times. If you have $100 in your\
    \ account and you withdraw $100, you’re of course left with $0\\. Because all\
    \ nodes are available to read and write, there’s a chance that another debit could\
    \ go through in the tiny fraction of time that your account balance still reads\
    \ $100\\. So then once the account balance updates you will actually be in the\
    \ negative because the second debit was allowed through even though it should\
    \ have been denied. This is why **consistency** is more important in the case\
    \ of this banking application.\n\nThe cost of consistency is giving up some availability.\
    \ As soon as you withdrew money in the previous example, there should have been\
    \ some locks put into place preventing the account balance to be read as $100.\
    \ If your application is unable to read every node at every second, then it may\
    \ appear down or unavailable to some users. Some applications favor availability\
    \ and performance over consistency, which is where a lot of document-oriented\
    \ databases shine.\n"
