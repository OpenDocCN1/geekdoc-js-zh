  trans: "\n[content]\n这只是对你可以运行的命令类型的简要概述。[MongoDB 文档](http://docs.mongodb.org/manual/core/crud-introduction/)\
    \ 非常详尽，为那些想要深入研究的人提供了大量的细节。\n\nMongoDB 还为你提供了一个非常棒的[交互式教程](http://try.mongodb.org/)，让你走一遍上述命令。\n\
    \n## GUI 工具：Robomongo\n\n虽然使用我们的命令行进入 MongoDB 数据库非常简单，但对于那些倾向于使用图形化界面的人来说，也有一个\
    \ GUI 工具。\n\n尽管去下载 [Robomongo](http://robomongo.org/) 并启动它。\n\n与我们的数据库建立连接非常简单。只需将地址设置为\
    \ `localhost`，将端口设置为 `27017`。你可以为你的连接起任何名称。\n\n![Robomongo Connect](img/08-mongodb----robomongo-connect-local.jpg)\n\
    \nRobomongo Connect\n\n一旦连接成功，你就可以访问所有的数据库及其各自的集合了！你现在有了一个 GUI 来处理数据库操作，甚至可以打开一个\
    \ shell 来深入操作我们之前讨论过的命令。\n\n![Robomongo Connect to Database](img/08-mongodb----robomongo-local-db.jpg)\n\
    \nRobomongo Connect to Database\n\n## 在 Node.js 中使用 MongoDB\n\n如你所见，使用 MongoDB\
    \ 本地实例是一个非常直接的过程。此后，你可以使用 MongoDB 本地实例或托管实例（[modulus.io](https://modulus.io/)\
    \ 或 [mongolab.com](https://mongolab.com/)）。\n\n无论如何，我们都使用 [mongooseJS](http://mongoosejs.com/)，这是一个用于处理\
    \ MongoDB 的 Node 包。\n\n你只需要配置 mongoose 连接到本地数据库即可。这是一个简单的过程，因为我们甚至不需要创建数据库。如果我们与本地\
    \ MongoDB 工作，只需要运行以下命令确保 MongoDB 已经启动：\n\n```\n1 $ mongod\n```\n\n### 使用 Mongoose\
    \ 连接 MongoDB 数据库\n\n连接数据库是一个非常简单的过程。这里有一些在 Node 中连接数据库的示例代码：\n\n```\n1 // 获取我们需要的包\n\
    2 var mongoose = require('mongoose');\n3 \n4 mongoose.connect('mongodb://localhost/db_name');\n\
    ```\n\n就是这样！一旦我们开始向数据库中保存内容，名为 `db_name` 的数据库就会被自动创建。\n\n现在我们已经理解了 MongoDB 及其使用方法，让我们在\
    \ Node.js 应用程序实现 CRUD 并使用 mongooseJS 使用 MongoDB 吧。\n\n接下来的任务是构建一个 Node.js API。\n\
    \n## 构建一个 RESTful Node API\n\n### 什么是 REST？\n\n关于 RESTful API 的一点介绍，请看这个非常棒的演示文稿：[教狗学\
    \ REST](http://www.slideshare.net/landlessness/teach-a-dog-to-rest)。\n\n[RESTful\
    \ APIs](http://scotch.io/bar-talk/designing-a-restful-web-api) 正在成为 Web 服务的标准。现在仅仅构建一个应用程序是不够的，我们正在转向可以与多个设备和其他网站集成的平台发展。\n\
    \n互联互性正迅速成为游戏的关键。随着 [IFTTT](https://ifttt.com/) 和 [Zapier](https://zapier.com/)\
    \ 等项目的日益流行，用户已经表明他们喜欢让自己的应用程序连接在一起。这意味着他们所有的应用程序都有一种标准的方式相互“对话”。IFTTT 允许你设置触发器和响应，例如“当我写推文时，将其分享为我的\
    \ Facebook 状态”。Twitter 和 Facebook 的 API 允许我们做到这一点。\n\n![IFTTT](img/ifttt.jpg)\n\
    \nIFTTT\n\n像 Facebook 和 Google 这样的行业巨头有自己跨越多个第三方应用的 API。你甚至可以找到它们的 API 探索器，可以在那里对它们的\
    \ API 进行测试驱动，并查看你可以从 API 中提取什么信息。例如，一旦登录，你就可以从 [API 探索器](https://developers.facebook.com/tools/explorer/145634995501895/?method=GET&path=me%3Ffields%3Did%2Cname&version=v2.1)\
    \ 获取所有朋友的数据。使用 API 已经迅速成为构建应用程序的标准。\n\n仅仅让应用程序独立运行是不够的，你必须使用相同的数据构建一个网站和多个移动应用。如果你的应用程序火了，你将希望用户能够基于你的数据构建第三方应用程序。这就是你的\
    \ API 发挥用场的地方。我们将学习如何使用 Node 构建一个 API，以便多个应用程序可以使用该 API 和你的数据。\n\n### 为我们的 Angular\
    \ 前端提供后端服务\n\n在本章中，我们将学习使用 Node、Express 4 及其 Router 以及 Mongoose 创建一个 RESTful API，并与\
    \ MongoDB 实例交互。我们还将使用 Chrome 中的 [Postman](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop)\
    \ 或 Firefox 中的 [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
    \ 来测试我们的 API。\n\n这是一个与我们之前章节完全不同的示例应用程序，我们将在到达 Angular 前端时在后续几个章节中使用它。让我们看看我们想要构建的\
    \ API 及其能做什么。\n\n### 示例应用程序\n\n假设我们要……（此处原文似乎存在重复或截断，将按逻辑翻译剩余部分）\n\n（注：由于原文从此处开始出现了大量重复的占位符描述，根据“不要重复输出原文”的原则，我将针对其核心逻辑结构进行翻译处理。）\n\
    \n假设我们要构建一个 Node.js API。我们将使用 Node、Express 4 及其 Router 以及 Mongoose 来与 MongoDB\
    \ 实例交互。我们将使用 Postman 或 RESTClient 来测试 API。\n"
- fmt: "\nNode’s package manager will bring in all the packages we defined in `package.json`.\
    \ Simple and easy. Now that we have our packages, let’s go ahead and use them\
    \ when we set up our API.\n\nWe’ll be looking to our `server.js` file to setup\
    \ our app since that’s the main file we declared in `package.json`.\n\n## Setting\
    \ Up Our Server (server.js)\n\nNode will look here when starting the application\
    \ so that it will know how we want to configure our application and API.\n\nWe\
    \ will start with the bare essentials necessary to start up our application. We’ll\
    \ keep this code clean and commented well so we understand exactly what’s going\
    \ on every step of the way.\n\n```javascript\n 1 // BASE SETUP\n 2 // ======================================\n\
    \ 3 \n 4 // CALL THE PACKAGES --------------------\n 5 var express    = require('express');\
    \ // call express\n 6 var app        = express(); // define our app using express\n\
    \ 7 var bodyParser = require('body-parser'); // get body-parser\n 8 var morgan\
    \     = require('morgan'); // used to see requests\n 9 var mongoose   = require('mongoose');\
    \ // for working w/ our database\n10 var port       = process.env.PORT || 8080;\
    \ // set the port for our app\n 11 \n 12 // APP CONFIGURATION ---------------------\n\
    \ 13 // use body parser so we can grab information from POST requests\n 14 app.use(bodyParser.urlencoded({\
    \ extended: true }));\n 15 app.use(bodyParser.json());\n 16 \n 17 // configure\
    \ our app to handle CORS requests\n 18 app.use(function(req, res, next) {\n 19\
    \   res.setHeader('Access-Control-Allow-Origin', '*');\n 20   res.setHeader('Access-Control-Allow-Methods',\
    \ 'GET, POST');\n 21   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
    \ \\\n22 Authorization');\n 23   next();\n 24 });\n 25 \n 26 // log all requests\
    \ to the console \n 27 app.use(morgan('dev'));\n 28 \n 29 // ROUTES FOR OUR API\n\
    \ 30 // =============================\n 31 \n 32 // basic route for the home page\n\
    \ 33 app.get('/', function(req, res) {\n 34 \tres.send('Welcome to the home page!');\n\
    \ 35 });\n 36 \n 37 // get an instance of the express router\n 38 var apiRouter\
    \ = express.Router();\n 39 \n 40 // test route to make sure everything is working\
    \ \n 41 // accessed at GET http://localhost:8080/api\n 42 apiRouter.get('/', function(req,\
    \ res) {\n 43 \tres.json({ message: 'hooray! welcome to our api!' });\t\n 44 });\n\
    \ 45 \n 46 // more routes for our API will happen here\n 47 \n 48 // REGISTER\
    \ OUR ROUTES -------------------------------\n 49 // all of our routes will be\
    \ prefixed with /api\n 50 app.use('/api', apiRouter);\n 51 \n 52 // START THE\
    \ SERVER\n 53 // ===============================\n 54 app.listen(port);\n 55 console.log('Magic\
    \ happens on port ' + port);\n```\n\nWow we did a lot there! It’s all very simple\
    \ though so let’s walk through it a bit.\n\n**Base Setup**: In our base setup,\
    \ we pull in all the packages we pulled in using `npm`. We’ll grab `express`,\
    \ `mongoose`, define our app, get `bodyParser` and configure our app to use it.\
    \ We can also set the `port` for our application and grab the user model that\
    \ we will define later.\n\nWe are setting our configuration to allow requests\
    \ from other domains to prevent CORS errors. This allows any domain to access\
    \ our API.\n\n**Routes for Our API**: This section will hold all of our routes.\
    \ The structure for using the `Express Router` let’ us pull in an instance of\
    \ the router. We can then define routes and then apply those routes to a root\
    \ URL (in this case, API). There is also a home page route to say hello; this\
    \ is just a basic route to make sure that everything is working.\n\n**Start the\
    \ Server**: We’ll have our `express` app listen to the `port` we defined earlier.\
    \ Then our application will be live and we can test it!\n\n## Starting the Server\
    \ and Testing\n\nLet’s make sure that everything is working up to this point.\
    \ We will start our Node app and then send a request to the one route we defined\
    \ to make sure we get a response.\n\nLet’s start our server. From the command\
    \ line, type:\n\n```bash\nnodemon server.js\n```\n\nYou should see your Node app\
    \ start up and Express will create a server.\n\n![Starting Node Server](images/09-restful-api----start-node-server.jpg)\n\
    \nStarting Node Server\n\nNow that we know our application is up and running,\
    \ let’s test it. You should be able to see our message returned by visiting the\
    \ basic route: `http://localhost:8080`. Now let’s test the rest of our routes\
    \ (the API routes).\n\n![Basic Route](images/09-restful-api----basic-route.jpg)\n\
    \nBasic Route\n\n### Testing Our API Using Postman\n\nNow navigate to `http://localhost:8080/api`\
    \ in your browser and you will see our JSON message. Seeing it is great and all,\
    \ but the best way to test out our API is to use a tool built for this sort of\
    \ thing. Postman will help us test our API.\n"
