  trans: "\n\n现在我们有了 Express。让我们进入 `server.js` 并启动服务器来提供我们的 `index.html` 文件。\n\n```\n\
    \ 1 // 获取我们的包\n 2 var express = require('express');\n 3 var app     = express();\n\
    \ 4 var path    = require('path');\n 5 var port    = process.env.PORT || 8080;\n\
    \ 6 \n 7 // 配置公共资源文件夹\n 8 app.use(express.static(__dirname + '/public'));\n 9\
    \ \n10 // 发送 index.html 的路由\n11 app.get('/', function(req, res) {\n12     res.sendFile(path.join(__dirname\
    \ + '/public/app/views/index.html'));\n13 });\n14 \n15 // 启动服务器\n16 app.listen(port);\n\
    17 console.log('Magic happens on http://localhost:' + port);\n```\n\n这是一个非常简单的文件，我们只需要在启动服务器之前获取依赖并提供\
    \ `index.html` 文件。\n\n让我们快速连接其余的页面：\n\n#### `public/app/controllers/mainCtrl.js`\n\
    \n```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainController', function()\
    \ {\n4 \n5   var vm = this;\n6     \n7   vm.message = 'this is my message!';\n\
    8   \n9 });\n```\n\n#### `public/app/views/pages/home.html`\n\n```\n1 首页！\n```\n\
    \n#### `public/app/views/index.html`\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"\
    en\">\n 3 <head>\n 4   <meta charset=\"UTF-8\">\n 5   <title>Workflow!</title>\n\
    \ 6 \n7   <!-- 用于 Angular 路由 -->\n 8   <base href='/'>\n 9 \n10   <!-- CSS -->\n\
    11   <!-- 在此处加载 bootstrap -->\n12   <!-- 我们将在 gulp 部分加载 css 文件 -->\n13 \n14  \
    \ <!-- JS / 库 -->\n15   <!-- 在此处加载 angular 和 angular-route -->\n16 \n17   <!--\
    \ APP -->\n18   <script src=\"app/controllers/mainCtrl.js\"></script>\n19   <script\
    \ src=\"app/app.routes.js\"></script>\n20   <script src=\"app/app.js\"></script>\n\
    21 </head>\n22 <body class=\"container\" ng-app=\"myApp\" ng-controller=\"mainController\
    \ as main\">\n23 \n24   <div class=\"jumbotron text-center\">\n25     <h1>{{ main.message\
    \ }}</h1>\n26   </div>\n27 \n28   <div ng-view></div>\n29   \n30 </body>\n31 </html>\n\
    ```\n\n#### `public/app/app.js`\n\n```\n1 angular.module('myApp', ['app.routes',\
    \ 'mainCtrl']);\n```\n\n#### `public/app/app.routes.js`\n\n```\n 1 angular.module('app.routes',\
    \ ['ngRoute'])\n 2 \n3 .config(function($routeProvider, $locationProvider) {\n\
    4 \n5   $routeProvider\n 6     .when('/', {\n 7       templateUrl: 'app/views/pages/home.html',\n\
    \ 8       controller: 'mainController',\n9       controllerAs: 'main'\n10    \
    \ });\n11 \n12   $locationProvider.htmlMode(true);\n13 });\n```\n\n#### `public/assets/css/style.less`\n\
    \n```less\n1 /* 变量\n 2 ====================== */\n3 @blue: #6D0;\n4 @purple: #993399;\n\
    5 @red: #cc3333;\n6 \n7 /* 主\n 8 ====================== */\n9 body{ \n10   background:@blue;\n\
    11   color:@purple;\n12   border-top:5px solid @red;\n13   padding-top:0px;\n\
    14 }\n```\n\n现在我们可以使用命令启动服务器：\n\n```\n1 nodemon server.js\n```\n\n这个应用目前没不多，因为我们还没有获取\
    \ Bootstrap 或 Angular Route。我们将使用一个名为 Bower 的工具来拉取这些资源。\n\n### Bower\n\n[Bower](http://bower.io/)\
    \ 是一个专门用于前端资源的包管理器。你可以使用 `bower` 来引入任何 CSS/JS 库，如 Bootstrap、Angular、jQuery、Animate.css、Moment\
    \ 等。Bower 的工作原理与 npm 类似，毕竟它终究是一个包管理器。就像 npm 使用 `package.json` 文件来读取所需的所有包一样，bower\
    \ 使用 `bower.json` 文件。\n\n#### 安装 Bower\n\n我们首先需要安装 bower。幸运的是它是一个 npm 包，所以我们可以通过输入以下命令来安装：\n\
    \n```\nnpm install -g bower\n```\n\n我们使用 `-g` 全局安装 bower，以便我们可以在系统的任何地方访问它。让我们使用\
    \ `init` 命令创建一个 `bower.json` 文件。我们将保持所有默认设置。运行以下命令：\n\n```\nbower init\n```\n\n\
    现在我们有了 bower 和 `bower.json` 文件，将能够搜索并安装包了。\n\n#### 安装包\n\n```\nbower install <package_name>\
    \ --save\n```\n\n就像 npm 一样，如果我们添加 `--save` 修饰符，包将保存到我们的 `bower.json` 文件中。\n\n\
    ```\nbower install bootstrap\n```\n\n安装完成后，Bower 会将包放在名为 `bower_components` 的文件夹中。你可以根据\
    \ GitHub URL 安装包。\n\n```\nbower install <github-url>\n```\n\n#### 搜索包\n\n有一种方法通过命令行来搜索包。\n\
    \n```\nbower search <package_name>\n```\n\n这种方法可能很繁琐，当有很多结果时是。更方便的搜索包的方法是通过 Bower\
    \ 网站。[在 Bower 网站上搜索包](http://bower.io/search)\n\n#### 指定目录\n\n默认情况下，Bower 会将资源放在根目录的\
    \ `bower_components` 文件夹中。这不是放置文件的理想位置，因为我们已经决定将与应用程序关联的文件放在 `public/` 文件夹中。可以通过在项目根目录下创建一个文件来实现。该文件将命名为\
    \ `.bowerrc`，移动 `bower_components` 文件夹非常简单：\n\n```\n{\n  \"directory\": \"public/assets/libs\"\
    \n}\n```\n\n现在文件将放在我们指定的目录，我们可以保持根目录更加整洁。\n\n#### 使用包\n\n让我们安装常用的 MEAN 栈应用程序所需的包。运行以下命令：\n\
    \n```\nbower install bootstrap angular-route angular-animate --save\n```\n\n一旦包进入我们的项目，我们只需要链接正确的文件。通过点击你新的\
    \ `public/assets/libs` 文件夹，你能够确定具体想要哪个文件。\n\n"
- fmt: "\nJust like Bower and Nodemon, we are going to install `gulp` globally so\
    \ that we have access to it across our projects.\n\n```\n1 $ npm install -g gulp\n\
    ```\n\nWe will also want to install `gulp` in our specific project’s `devDependencies`.\n\
    \n```\n1 $ npm install gulp --save-dev\n```\n\nGreat! Now we have Gulp ready to\
    \ go and we can start to use it. First, let’s compile our LESS file we created\
    \ earlier into a CSS file so our browser will be able to use it.\n\n### Compiling\
    \ LESS\n\nEach task we will want to do is an npm package that extends Gulp. For\
    \ example, since we want to compile LESS files, we will need to also install [gulp-less](https://github.com/plus3network/gulp-less).\
    \ Let’s do that now.\n\n```\n1 $ npm install gulp-less --save-dev\n```\n\nNow\
    \ that we have that plugin, let’s go ahead and use it. Like Bower and npm, we\
    \ will need a configuration file in the root of our document. This file will tell\
    \ Gulp exactly what to do when we start it up.\n\nFirst we will need to create\
    \ a `gulpfile.js` in the root of our document.\n\nInside of our `gulpfile.js`\
    \ let’s start using LESS:\n\n```\n 1 // load the plugins\n 2 var gulp = require('gulp');\n\
    \ 3 var less = require('gulp-less');\n 4 \n 5 // define a task called css\n 6\
    \ gulp.task('css', function() {\n 7 \n 8 // grab the less file, process the LESS,\
    \ save to style.css\n 9   return gulp.src('public/assets/css/style.less')\n10\
    \     .pipe(less())\n11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n\
    ```\n\nCongratulations, you’ve just made your first Gulp task! Now all we have\
    \ to do is go back into our command line and type:\n\n```\n1 $ gulp css\n```\n\
    \nThat tells Gulp to run that specific task and then we can see that our new `style.css`\
    \ file will be generated in the `gulp.dest()` folder that we specified.\n\n![LESS\
    \ Compiled](images/19-mean-workflow----less.jpg)\n\nLESS Compiled\n\nYou can see\
    \ that the LESS is compiled to CSS just as we would expect.\n\n![LESS vs. CSS](images/19-mean-workflow----less-to-css.jpg)\n\
    \nLESS vs. CSS\n\n### Minifying CSS\n\nThe great thing about Gulp is that we are\
    \ able to pipe a file (or multiple files) through more than one package in one\
    \ task. Let’s see how we can add CSS minifying to this so that we have a `style.min.css`\
    \ to use in production.\n\nFirst install the [gulp-minify-css](https://www.npmjs.com/package/gulp-minify-css)\
    \ package as well as a package called [gulp-rename](https://www.npmjs.com/package/gulp-rename)\
    \ so that we can rename our file to `style.min.css`:\n\n```\n1 $ npm install gulp-minify-css\
    \ gulp-rename --save-dev\n```\n\nNow we can add it to our `gulpfile.js` and use\
    \ it in the `css` task.\n\n```\n 1 // load the plugins\n 2 var gulp      = require('gulp');\n\
    \ 3 var less      = require('gulp-less');\n 4 var minifyCSS = require('gulp-minify-css');\n\
    \ 5 var rename    = require('gulp-rename');\n 4 \n 7 // define a task called css\n\
    \ 8 gulp.task('css', function() {\n 9 \n10 // grab the less file, process the\
    \ LESS, save to style.css\n11   return gulp.src('public/assets/css/style.less')\n\
    12     .pipe(less())\n13     .pipe(minifyCSS())\n14     .pipe(rename({ suffix:\
    \ '.min' }))\n15     .pipe(gulp.dest('public/assets/css'));\n16 \n17 });\n```\n\
    \nNow when we run\n\n```\n1 $ gulp css\n```\n\nWe can see a new `style.min.css`\
    \ file created and it is compiled LESS and minified! We can now go into our `index.html`\
    \ file and add our new CSS file:\n\n```\n1 <link rel=\"stylesheet\" href=\"assets/css/style.min.css\"\
    >\n```\n\nAll those colors. Isn’t it pretty?\n\n![Site with LESS](images/19-mean-workflow----site-with-less.jpg)\n\
    \nSite with LESS\n\n### Using a Gulp Package\n\nThe process for using a Gulp package\
    \ is similar to what we just did with LESS.\n\n1. Install the package and `--save-dev`.\n\
    2. Load the plugin in your `gulpfile.js`.\n3. Configure a task and use the plugin!\n\
    \nGulp is easier to configure than Grunt, but the concept is the same: install\
    \ a package, load it, and configure. Let’s move onto other important tasks that\
    \ deal with JS.\n\n### Linting JS\n\nLet’s make sure that our JS files have no\
    \ errors. This includes our Node and Angular files. We’ll be using a JSHint plugin\
    \ called [gulp-jshint](https://www.npmjs.com/package/gulp-jshint) for this task.\n\
    \nLet’s install this new package:\n\n```\n1 $ npm install gulp-jshint --save-dev\n\
    ```\n\nNow let’s bring it into our `gulpfile.js` and create a task.\n\n```\n 1\
    \ // load the plugins\n 2 var gulp = require('gulp');\n 3 var less = require('gulp-less');\n\
    \ 4 \n 5 // define a task called css\n 6 gulp.task('css', function() {\n 7 \n\
    \ 8 // grab the less file, process the LESS, save to style.css\n 9   return gulp.src('public/assets/css/style.less')\n\
    10     .pipe(less())\n11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n\
    ```\n\n### Minifying and Concatenating JS\n\nAs our applications start to grow,\
    \ then we will have many more requests which bog down the performance of our application.\
    \ We will use two packages to minify and concatenate (bundle) our JS files so\
    \ we only need to load one file.\n\n### Minifying Angular\n\nThere is a problem\
    \ however when we minify Angular files. Angular files have to be declared a certain\
    \ way or the minifying process will break them.\n\n#### The Way to Declare Angular\
    \ Modules for Minification\n\nSo far in this book, we have gone with the easier\
    \ way of defining modules for simplicity. This looks like the following:\n"
