    });\n```\n"
  raw: "```\n1     <link rel=\"stylesheet\" href=\"css/style.css\">\n```\n\nThe other\
    \ change that we will make is to wrap our `<div ng-view></div>` with another div\
    \ so that we can call it specifically. This will look like so:\n\n```\n1     <div\
    \ id=\"content-views\">\n2         <div ng-view></div>\n3     </div>\n```\n\n\
    Now we just need to go into our newly created stylesheet and add our styles. Don’t\
    \ forget to link your stylesheet ‘<link rel=\"stylesheet\" href=\"css/style.css\"\
    \ />’ in your index.html.\n\n```\n 1     body                          { padding-top:50px;\
    \ }\n 2 \n 3     #content-views                { position:relative; }\n 4 \n 5\
    \     .ng-enter, .ng-leave          { width:100%; position:absolute; }\n 6   \
    \  .ng-enter                     { \n 7       -webkit-animation:zoomInDown 1.2s\
    \ both ease-in; \n 8       -moz-animation:zoomInDown 1.2s both ease-in; \n 9 \
    \        animation:zoomInDown 1.2s both ease-in; \n10     }\n11     .ng-leave\
    \                     { \n12       -webkit-animation:zoomOutDown 0.5s both ease-in;\
    \ \n13       -moz-animation:zoomOutDown 0.5s both ease-in; \n14         animation:zoomOutDown\
    \ 0.5s both ease-in; \n15     }\n```\n\n**Vendor Prefixes**: Make sure you add\
    \ the `-moz-animation` and `-webkit-animation` vendor prefixes when pushing this\
    \ code to production for cross compatibility in browsers.\n\nGo ahead and click\
    \ through the pages in your application and watch as the pages fly out and fly\
    \ in! Just like that, we have an animated application! Feel free to try out the\
    \ rest of the [animate.css](http://daneden.github.io/animate.css/) classes to\
    \ see the crazy different effects you can create.\n\n### Conclusion\n\nThis should\
    \ give you just a sample of how putting together the Angular routing and animating\
    \ modules together can quickly build complex looking apps. These techniques can\
    \ be used to build a multitude of applications in all sorts of different styles.\
    \ So far, on the Angular side of things we have:\n\n*   Set up an AngularJS module\n\
    \n*   Applied Angular to our HTML views\n\n*   Routed our application using ngRoute\n\
    \n*   Animated our application using ngAnimate and CSS classes\n\nHaving the knowledge\
    \ of the above will let us build awesome looking applications. We’ll explore these\
    \ concepts further as we build out more sample applications in the coming chapters.\n\
    \nWe’ve focused on the frontend Angular parts so far; next up is how to make Angular\
    \ applications dynamic. We’ll be moving towards integrating the frontend and the\
    \ backend, but first let’s make sure that the foundation of our application is\
    \ solid so that our applications are scalable and easy to understand.\n\n## MEAN\
    \ Stack Application Structure\n\nUp to this point, we’ve been able to place most\
    \ of our code into a few main files (`server.js` for Node and `app.js` for Angular).\
    \ As we start moving to larger MEAN stack applications, keeping all of our code\
    \ bunched into these main files will become cumbersome. It will be hard to maintain\
    \ our code, find certain parts of our applications, and worst of all, share convoluted\
    \ code with other developers.\n\nWith this in mind, let’s take a look at our application\
    \ structure. Organizing something this simple goes a long way. This will be a\
    \ short chapter, but a very important one.\n\n### Sample Organization\n\nSo far,\
    \ our applications have had this file structure:\n\n```\n 1 // node applications\n\
    \ 2 - app/\n 3 ----- models/\n 4 \n 5 // angular applications\n 6 - public/\n\
    \ 7 ----- css/\n 8 ----- js/\n 9 ---------- controllers/\n10 ---------- services/\n\
    11 ----- app.js\n12 ----- views/\n13 ---------- pages/\n14 ----- index.html\n\
    15 \n16 - package.json\n17 - server.js\n```\n\nOn the **Node side of things**,\
    \ we can’t keep everything in `server.js`. That file could become a giant spaghetti\
    \ mix of code when we start putting more routes, more configuration, and more\
    \ application functionality. That has to be broken down into a more organized\
    \ structure.\n\nOn the **Angular side of things**, this structure could become\
    \ confusing. Where would we put `lib` files like Bootstrap, or Font Awesome? Would\
    \ our `js` folder hold all of those things including our Angular application files?\n\
    \n#### A Better Structure\n\nSo what would a better structure look like? Let’s\
    \ combine both the Node and Angular sides since we will be moving towards full\
    \ stack applications next.\n\nHere is a better organization that lays a good foundation\
    \ for our applications. This is a **modular** approach that allows us to add and\
    \ remove components from our applications easily and simply.\n\n```\n 1 - app/\n\
    \ 2 ----- models/\n 3 ----- routes/\n 4 - public/\n 5 ----- assets/  // the base\
    \ css/js/images for our app (not Angular files)\n 6 ---------- css/      // some\
    \ custom css\n 7 ---------- js/       // some custom js (not Angular files)\n\
    \ 8 ---------- img/\n 9 ---------- libs/     // libraries like bootstrap, angular,\
    \ font-awesome\n10 ----- app/      // the Angular part of our application\n11\
    \ ---------- controllers/\n12 ---------- services/\n13 ---------- app.js\n14 ----------\
    \ app.routes.js\n15 ---------- views/\n16 --------------- pages/\n17 ---------------\
    \ index.html\n18 - package.json\n19 - config.js- server.js\n```\n\nLet’s break\
    \ down what is happening here. A lot of it is just moving things around into its\
    \ own file/folder.\n\n##### App Folder\n\nWe have our normal models folder here.\
    \ What’s new is that we have a `routes/` folder now. We can place our basic routes\
    \ here and call them from our main `server.js` file. Since the routes are the\
    \ main part of `server.js`, moving those out of the main file will clean it up\
    \ substantially.\n\nWe can even create multiple routes files like `routes/app.js`\
    \ and `routes/api.js` so that we can differentiate the parts of our application.\n\
    \n##### config.js\n\nWe are just moving configuration variables into this file.\
    \ This helps since we can set variables like environment, database settings, and\
    \ other application specific settings.\n\nWe can even grab these settings from\
    \ a dashboard in the future so that we can have a dashboard UI where we can have\
    \ users log in to set these.\n\n##### Public Folder\n\nThis is where the majority\
    \ of application movement has happened. Before, we stored everything (Angular\
    \ files and basic asset files) in the `public/js` folder. This can become confusing\
    \ as our application grows so now we have it set up so that **assets and application\
    \ files live in separate directories**.\n\nAnything Angular specific like controllers,\
    \ services, routes, and views will live in the `app/` folder. Assets like images,\
    \ custom CSS or JS, and libraries will live in the `assets/` folder.\n\nHere we\
    \ have also created a `app.routes.js` file. In the future as we create more routes\
    \ for our application, we may want to move these into its own `routes/` folder\
    \ like we did for the Node side.\n\nNow that we have seen a better structure,\
    \ let’s take our Chapter 10 application and arrange it so that it adheres to this\
    \ practice. This will lay the groundwork for moving forward when we create the\
    \ User CRM.\n\n### Organizing Node.js - Backend\n\nSince Chapter 10 was about\
    \ creating a Node API and authenticating it, we only have Node code to work with\
    \ here.\n\nLet’s see how we can rearrange our Node code (say that 10 times fast…\
    \ Node code, Node code, Node code). Go ahead and copy your Chapter 10 code and\
    \ create a new project for it.\n\nHere is an overview of the steps we will be\
    \ taking:\n\n*   move configuration variables into a new `config.js`\n\n*   move\
    \ routes into a new `routes/api.js` file\n\n*   create a catchall route to get\
    \ ready for MEAN app\n\n#### Configuration Files\n\nWe will be moving our configuration\
    \ variables out of our `server.js`. For our purposes, we don’t have many configuration\
    \ variables, just our `port`, our `database`, and the `secret` that we will be\
    \ using when configuring JSON Web Tokens.\n\nCreate a new file in the root directory\
    \ called `config.js`.\n\nThe following is all we need:\n\n```\n1 module.exports\
    \ = {\n2   'port': process.env.PORT || 8080,\n3   'database': 'mongodb://node:noder@novus.modulusmongo.net:27017/Iganiq8o',\n\
    4   'secret': 'ilovescotchscotchyscotchscotch'\n5 };\n```"
