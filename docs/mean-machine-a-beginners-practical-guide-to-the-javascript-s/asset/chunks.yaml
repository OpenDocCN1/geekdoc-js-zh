  trans: "\n\n```\n1 - public/    // 我们的所有前端代码 (HTML/CSS/JS) 都放在这里\n2 ----- views/\n\
    3 ---------- pages/\n4 ----- index.html\n5 ----- js/\n6 - package.json\n7 - server.js\n\
    ```\n\n这些就是我们启动服务器和 Angular 前端应用程序所需的文件。目前，我们将只关注 `package.json` 和 `server.js`\
    \ 来创建一个服务器。\n\n## 启动 Node 项目\n\n就像我们之前做的那样，`package.json` 将包含包和项目信息。请运行 `npm init`\
    \ 或直接手动创建该文件。这里有一个基础的 `package.json` 文件。\n\n```\n1 {\n2   \"name\": \"routing-app\"\
    ,\n3   \"main\": \"server.js\",\n4   \"dependencies\": {\n5     \"express\": \"\
    ~4.9.1\"\n6   }\n7 }\n```\n\n一旦你有了该 `package.json` 文件，运行 `npm install` 将你的依赖项（在此例中为\
    \ Express）获取到 `node_modules` 文件夹中。记住，你也可以通过命令行使用 `npm install express --save`\
    \ 来添加依赖项。\n\n## 设置 Express 服务器\n\n正如我们之前所做的，我们的服务器将在 `server.js` 中设置。让我们创建一个非常简单的服务器，向用户发送\
    \ `index.html`。\n\n```\n 1 // 获取我们需要的资源\n 2 var express = require('express');\n\
    \ 3 var app     = express();\n 4 var path = require('path');\n 5 \n6 // 设置 public\
    \ 文件夹以提供公共资源\n 7 app.use(express.static(__dirname + '/public'));\n 8 \n9 // 设置到\
    \ index.html 文件的路由\n10 app.get('*', function(req, res) {\n11     res.sendFile(path.join(__dirname\
    \ + '/public/views/index.html'));\n12 });\n13 \n14 // 在端口 8080 启动服务器 (http://localhost:8080)\n\
    15 app.listen(8080);\n16 console.log('Magic happens on port 8080.');\n```\n\n\
    当请求进入我们的服务器时（我们通过使用 `*` 通配符方法来实现），我们将向用户发送 `index.html` 文件，该文件包含了我们所有的 Angular/HTML/CSS\
    \ 代码。我们还使用 Express 通过 `app.use(express.static())` 为静态资源设置目录。这意味着每当我们的客户端请求 CSS\
    \ 文件、图像或 JS 文件时，Node 都会通过查看 `public` 文件夹来提供该资源。我们所有的前端代码都存储在这个 `public` 文件夹中，因此这对我们的项目是一个很好的设置。\n\
    \n创建一个快速的 `public/views/index.html` 文件并在其中编写任何你想写的内容。使用以下命令启动服务器：\n\n`nodemon\
    \ server.js`\n\n现在我们可以在浏览器中访问 `http://localhost:8080` 我们的应用程序。\n\n这就是 Node 的酷之处。即使你没有在最终项目中使用它，你也可以将其作为你想要构建的任何项目的服务器。在我们开发\
    \ Angular 应用程序时，我们只需要在这个 URL 中工作即可。\n\n现在我们已经准备好了构建 Angular 路由应用程序的基础，让我们开始着吧。\n\
    \n## 示例应用程序\n\n我们将仅仅创建一个包含首页、关于页和联系页的简单网站。Angular 是为了比这高级得多的应用程序而构建的，但本教程将展示那些更大型项目所需的许多概念。\n\
    \n### 目标\n\n* 单页应用\n* 页面切换时不刷新页面\n* 每个页面显示不同的数据\n\n### 文件结构\n\n这些将存于我们在上一步中设置的\
    \ `public` 文件夹中的文件。\n\n```\n 1 public/\n 2 - views/\n 3 ----- pages/        //\
    \ 将注入到主布局的页面\n 4 ---------- home.html\n 5 ---------- about.html\n 6 ----------\
    \ contact.html\n 7 ----- index.html        // 主布局\n 8 - js/\n 9 ----- app.js \
    \       // 存储所有的 Angular 代码\n10 ----- app.routes.js // 存储所有的 Angular 路由\n```\n\
    \n## 应用的 HTML\n\n这是简单的部分。我们使用 [Bootstrap](http://getbootstrap.com) 和 [Font Awesome](http://fontawesome.io)\
    \ 来让样式变得更简单。打开你的 `index.html` 文件，我们将添加一个带有导航栏的简单布局。\n\n```\n 1 <!DOCTYPE html>\n\
    \ 2 <html>\n 3 <head>\n 4     <meta charset=\"utf-8\">\n 5     <title>我的路由应用!</title>\n\
    \ 6 \n 7     <!-- 为 angular 路由设置基础路径 -->\n 8     <base href=\"/\">\n 9 \n10  \
    \   <!-- CSS -->\n11     <!-- 通过 CDN 加载 bootstrap 和 fontawesome -->\n12     <link\
    \ rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.0.0/\\\n\
    13 css/bootstrap.min.css\">\n14     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n15 .0/css/font-awesome.css\">\n16     <style>\n 17         body { padding-top:50px;\
    \ }\n 18     </style>\n 19 \n20     <!-- JS -->\n21     <!-- 通过 CDN 加载 angular\
    \ 和 fontawesome -->\n22     <script src=\"http://netdna.bootstrapcdn.com/angularjs/1.4.6/\\\
    \n23 angular.min.js\"></script>\n24     <script src=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n25 .0/js/font-awesome.min.js\"></script>\n 26 \n27     <!-- 加载自定义脚本 -->\n28\
    \     <script src=\"js/app.js\"></script>\n29     <script src=\"js/app.routes.js\"\
    ></script>\n30 </head>\n31 <body class=\"container\" ng-app=\"routerApp\">\n32\
    \ \n33   <!-- 头部和导航栏 -->\n34   <nav class=\"navbar navbar-default\">\n35     \
    \  <div class=\"container-fluid\">\n36         <a class=\"navbar-brand\" href=\"\
    #\">Angular 路由</a>\n37       </div>\n 38 \n39       <ul class=\"nav navbar-right\"\
    >\n40         <li><a href=\"/\"><i class=\"fa fa-home\"></i> 首页</a></li>->\n41\
    \         <li><a href=\"/about\"><i class=\"fa fa-shield\"></i> 关于</a></li>->\n\
    42         <li><a href=\"/contact\"><i class=\"fa fa-comment\"></i> 联系</a></li>->\n\
    43       </ul>\n\n44     </nav>\n45   </header>\n46 \n47   <!-- 主内容和注入的视图 -->\n\
    48   <main>\n49 \n50     <!-- 内容在此处 -->\n51   </main>\n52 </body>\n53 </html>\n\
    ```\n*(注：由于原文 HTML 示例中存在微小的标签闭合错误，如重复的 `</li>`，翻译时保持了其逻辑结构以确保一致性。)*\n\n我们从 Google\
    \ 加载 Angular 和 Route。单独加载模块很重要，因为我们将将其注入到应用程序。这是依赖注入的另一个示例。\n\n![Angular Foundation](img/12-angular-routing)\n\
    \n## Angular 应用程序\n\n### 模块和控制器\n\n接下来，我们必须创建应用程序。关于每个部分的更多信息请查阅文档。我们将在 `app.js`\
    \ 中创建它：\n\n```\n1 angular.module('routerApp', [])\n2 \n3 // 创建控制器\n4 // 将是整个网站的控制器\n\
    5 .controller('mainController', function() {\n6 \n7   var vm = this;\n8 \n9  \
    \ // 在视图中显示 bigMessage 变量\n10   vm.bigMessage = '风平浪静造就不了熟练的水手。';\n11 })\n12 \n\
    13 // 首页特定控制器\n14 .controller('homeController', function() {\n15 \n16   var vm\
    \ = this;\n17 \n18   vm.message = '这是首页！';\n19 })\n20 \n21 // 关于页控制器\n22 .controller('aboutController',\
    \ function() {\n23 \n24   var vm = this;\n25 \n26   vm.message = '看！我是关于页。';\n\
    27 })\n28 \n29 // 联系页控制器\n30 .controller('contactController', function() {\n31\
    \ \n32   var vm = this;\n33 \n34   vm.message = '联系我们！开玩笑的。这只是一个演示。';\n35 });\n\
    ```\n\n让我们将模块和控制器添加到 HTML 中，这样 Angular 就知道如何引导/初始化我们的应用程序。为了测试一切是否正常工作，我们还将显示我们创建的\
    \ `vm.bigMessage` 变量。\n\n#### 应用 Angular\n\n"
- fmt: "\nLet’s go back into our `index.html` and apply our app and controller using\
    \ `ng-app` and `ng-controller`. Since we already loaded our `app.js` file in the\
    \ `<head>` of our document, we’ll apply both to the `<body>` tag.\n\n```\n1 <body\
    \ class=\"container\" ng-app=\"routerApp\" ng-controller=\"mainController as main\\\
    \n2 \">\n```\n\nNotice again that we are using the `controller as` syntax when\
    \ we write `mainController as main`. We will also show off our `bigMessage` inside\
    \ the `<main>` section of our site:\n\n```\n1 <main>\n2     <div class=\"jumbotron\"\
    >\n3         <h1>{{ main.bigMessage }}</h1>\n4     </div>\n5 \n6     <!-- angular\
    \ templating will go here -->\n7     <!-- this is where content will be injected\
    \ -->\n8 </main>\n```\n\nNow if we display our `index.html` file in our browsers,\
    \ we should be able to see our message.\n\n![Angular Routing Message Display](images/12-angular-routing----angular-routing-message.jpg)\n\
    \nAngular Routing Message Display\n\nInside of our `<main>`, we will now see the\
    \ message that we created. Since we have our module and controller set up and\
    \ there are no errors in our JavaScript console, we know that Angular is working\
    \ properly. Now we will start working on using this layout to show the different\
    \ pages all without ever refreshing the page.\n\n### Injecting Pages into the\
    \ Main Layout\n\n`ng-view` is an Angular directive that will include the template\
    \ of the current route (`/home`, `/about`, or `/contact`) in the main layout file.\n\
    \n**How does this work?** Angular route (`ngRoute`) will look at the current URL,\
    \ and then match that URL with a view that we specify. So if we are at the `/about`\
    \ page, we’ll tell `ngRoute` to grab a specific view file (`pages/about.html`\
    \ in this case) and inject it where we put `ng-view`.\n\nWe haven’t set up those\
    \ routing rules we need yet, so let’s add `ng-view` to our template right now\
    \ and then move forward to the routing.\n\nInside of the `<main>` section of our\
    \ site, delete the message part and add the following:\n\n```\n1 <main>\n2 \n\
    3     <!-- angular templating -->\n4     <!-- this is where content will be injected\
    \ -->\n5 \n6     <div ng-view></div>\n7 \n8 </main>\n```\n\n### Configuring Routes\n\
    \nNow this won’t do much for our site yet. We have to define the routes and the\
    \ views that will get used for each. This is how we use Angular’s routing capabilities\
    \ so that our pages don’t refresh.\n\nThe Angular routing module provides us with\
    \ the `$routeProvider`(http://docs.angularjs.org/api/ngRoute.$routeProvider) service\
    \ which is how we will configure the routes. Routes are defined on the `$routeProvider`\
    \ object using `.when()`.\n\nLet’s create our routes now by creating a new file\
    \ `public/js/app.routes.js`. We’ll also apply each of the controllers we created\
    \ earlier to each page.\n\n```\n 1 // inject ngRoute for all our routing needs\n\
    \ 2 angular.module('routerRoutes', ['ngRoute'])\n 3 \n 4 // configure our routes\n\
    \ 5 .config(function($routeProvider, $locationProvider) {\n 6     $routeProvider\n\
    \ 7 \n 8         // route for the home page\n 9         .when('/', {\n110    \
    \         templateUrl : 'views/pages/home.html',\n 11             controller \
    \ : 'homeController',\n 12             controllerAs: 'home'\n 13         })\n\
    \ 14 \n 15         // route for the about page\n 16         .when('/about', {\n\
    \ 17             templateUrl : 'views/pages/about.html',\n 18             controller\
    \  : 'aboutController',\n 19             controllerAs: 'about'\n 20         })\n\
    \ 21 \n 22         // route for the contact page\n 23         .when('/contact',\
    \ {\n 24             templateUrl : 'views/pages/contact.html',\n 25          \
    \   controller  : 'contactController',\n 26             controllerAs: 'contact'\n\
    \ 27         );\n 28 \n 29     // set our app up to have pretty URLS\n 30    \
    \ $locationProvider.html5Mode(true);\n 31 });\n```\n\nNow we have defined our\
    \ routes with `$routeProvider`. As you can see by the configuration, you can specify\
    \ the `route`, the `template file` to use, and even a `controller`. This way,\
    \ each part of our application will use its own view and Angular controller.\n\
    \nWe are also allowed to define `controllerAs` here and then each controller will\
    \ be defined on our site automatically. For example, inside of our `home.html`\
    \ file, when our router brings in this file, the controller will be defined as\
    \ `homeController as home`.\n\n***\n\n![Tip: Cleaning Up the Angular URL](images/icon-heart.png\
    \ \"Pro Tip\")\n\nTip: Cleaning Up the Angular URL\n\nBy default, AngularJS will\
    \ route URLs with a hashtag. For example, Angular will have `http://example.com/`,\
    \ `http://example.com/#/about`, and `http://example.com/#/contact`.\n\nIt is very\
    \ easy to get clean URLs and remove the hashtag from the URL.\n\nThere are 2 things\
    \ that need to be done:\n\n1. Configuring `$locationProvider`\n2. Setting `<base>`\
    \ in the `<head>` of our document for relative links\n\nIn Angular, we will use\
    \ `$locationProvider.html5Mode(true)` and add `<base href=\"/\">` to our HTML.\n\
    \n#### Injecting Routes into Main App\n\nOne of the main tenants of Angular development\
    \ is dependency injection. We will keep to by injecting this new routes module\
    \ we created into `index.html`.\n\nWe will add it to the very first line like\
    \ so:\n\n`angular.module('routerApp', ['routerRoutes'])`\n\nJust like that, we\
    \ now have our routes!\n\n### Configuring Views\n\nWe now have our routes and\
    \ they are calling the appropriate files. To finish off this tutorial, we just\
    \ need to define the pages that will be injected. We will also have each display\
    \ a message from its respective controller. This is a straightforward process,\
    \ just some HTML and displaying the `{{ home.message }}`, `{{ about.message }}`,\
    \ and `{{ contact.message }}` variables within each view.\n\n`pages/home.html`\n\
    \n```\n1 <div class=\"jumbotron text-center\">\n2     <h1>Home Page</h1>\n3 \n\
    4     <p>{{ home.message }}</p>\n5 </div>\n```\n\n`pages/about.html`\n\n```\n\
    1 <div class=\"jumbotron text-center\">\n2     <h1>About Page</h1>\n3 \n4    \
    \ <p>{{ about.message }}</p>\n5 </div>\n```\n\n`pages/contact.html`\n\n```\n1\
    \ <div class=\"jumbotron text-center\">\n2     <h1>Contact Page</h1>\n3 \n4  \
    \   <p>{{ contact.message }}</p>\n5 </div>\n```\n\nWe are prefixing each of the\
    \ variables with the controller name for each HTML file that we defined in our\
    \ routes using `controllerAs`.\n\nVisit your application and click through the\
    \ pages. You’ll see the data change and your message variable change all without\
    \ a page refresh!**\n\n![Angular Routing Home Page](images/12-angular-routing----angular-routing-final.jpg)\n\
    \nAngular Routing Home Page\n\n### Conclusion\n\nThere we have it! A single page\
    \ application with 3 different pages. Each page will also bring in a different\
    \ Angular controller so that data can be different across our site.\n\nYou can\
    \ see the value of this as it gives our basic websites into more of an integrated\
    \ application feeling.\n"
  raw: "Let’s go back into our `index.html` and apply our app and controller using\
    \ **ng-app** and **ng-controller**. Since we already loaded our `app.js` file\
    \ in the `<head>` of our document, we’ll apply both to the `<body>` tag.\n\n```\n\
    1 <body class=\"container\" ng-app=\"routerApp\" ng-controller=\"mainController\
    \ as main\\\n2 \">\n```\n\nNotice again that we are using the **controller as**\
    \ syntax when we write `mainController as main`. We will also show off our bigMessage\
    \ inside the `<main>` section of our site:\n\n```\n1 <main>\n2     <div class=\"\
    jumbotron\">\n3         <h1>{{ main.bigMessage }}</h1>\n4     </div>\n5 \n6  \
    \   <!-- angular templating will go here -->\n7     <!-- this is where content\
    \ will be injected -->\n8 </main>\n```\n\nNow if we display our `index.html` file\
    \ in our browsers, we should be able to see our message.\n\n![Angular Routing\
    \ Message Display](images/12-angular-routing----angular-routing-message.jpg)\n\
    \nAngular Routing Message Display\n\nInside of our `<main>`, we will now see the\
    \ message that we created. Since we have our module and controller set up and\
    \ there are no errors in our JavaScript console, we know that Angular is working\
    \ properly. Now we will start working on using this layout to show the different\
    \ pages all without ever refreshing the page.\n\n### Injecting Pages into the\
    \ Main Layout\n\n`ng-view` is an Angular directive that will include the template\
    \ of the current route (**/home**, **/about**, or **/contact**) in the main layout\
    \ file.\n\n**How does this work?** Angular route (ngRoute) will look at the current\
    \ URL, and then match that URL with a view that we specify. So if we are at the\
    \ **/about** page, we’ll tell ngRoute to grab a specific view file (pages/about.html\
    \ in this case) and inject it where we put `ng-view`.\n\nWe haven’t set up those\
    \ routing rules we need yet, so let’s add `ng-view` to our template right now\
    \ and then move forward to the routing.\n\nInside of the `<main>` section of our\
    \ site, delete the message part and add the following:\n\n```\n1 <main>\n2 \n\
    3     <!-- angular templating -->\n4     <!-- this is where content will be injected\
    \ -->\n5 \n6     <div ng-view></div>\n7 \n8 </main>\n```\n\n### Configuring Routes\n\
    \nNow this won’t do much for our site yet. We have to define the routes and the\
    \ views that will get used for each. This is how we use Angular’s routing capabilities\
    \ so that our pages don’t refresh.\n\nThe Angular routing module provides us with\
    \ the [$routeProvider](http://docs.angularjs.org/api/ngRoute.$routeProvider) service\
    \ which is how we will configure the routes. Routes are defined on the `$routeProvider`\
    \ object using `.when()`.\n\nLet’s create our routes now by creating a new file\
    \ ‘public/js/app.routes.js’. We’ll also apply each of the controllers we created\
    \ earlier to each page.\n\n```\n 1 // inject ngRoute for all our routing needs\n\
    \ 2 angular.module('routerRoutes', ['ngRoute'])\n 3 \n 4 // configure our routes\n\
    \ 5 .config(function($routeProvider, $locationProvider) {\n 6     $routeProvider\n\
    \ 7 \n 8         // route for the home page\n 9         .when('/', {\n10     \
    \        templateUrl : 'views/pages/home.html',\n11             controller  :\
    \ 'homeController',\n12             controllerAs: 'home'\n13         })\n14 \n\
    15         // route for the about page\n16         .when('/about', {\n17     \
    \        templateUrl : 'views/pages/about.html',\n18             controller  :\
    \ 'aboutController',\n19             controllerAs: 'about'\n20         })\n21\
    \ \n22         // route for the contact page\n23         .when('/contact', {\n\
    24             templateUrl : 'views/pages/contact.html',\n25             controller\
    \  : 'contactController',\n26             controllerAs: 'contact'\n27        \
    \ });\n28 \n29     // set our app up to have pretty URLS\n30     $locationProvider.html5Mode(true);\n\
    31 });\n```\n\nNow we have defined our routes with **$routeProvider**. As you\
    \ can see by the configuration, you can specify the **route**, the **template\
    \ file** to use, and even a **controller**. This way, each part of our application\
    \ will use its own view and Angular controller.\n\nWe are also allowed to define\
    \ `controllerAs` here and then each controller will be defined on our site automatically.\
    \ For example, inside of our `home.html` file, when our router brings in this\
    \ file, the controller will be defined as `homeController as home`.\n\n* * *\n\
    \n![Tip: Cleaning Up the Angular URL](images/icon-heart.png \"Pro Tip\")\n\nTip:\
    \ Cleaning Up the Angular URL\n\nBy default, AngularJS will route URLs with a\
    \ hashtag. For example, Angular will have `http://example.com/`, `http://example.com/#/about`,\
    \ and `http://example.com/#/contact`.\n\nIt is very easy to get clean URLs and\
    \ remove the hashtag from the URL.\n\nThere are 2 things that need to be done.\n\
    \n1.  Configuring `$locationProvider`\n\n2.  Setting `<base>` in the `<head>`\
    \ of our document for relative links\n\nIn Angular, the [$location service](http://docs.angularjs.org/guide/dev_guide.services.$location)\
    \ parses the URL in the address bar and makes changes to your application and\
    \ vice versa.\n\nWe will use the `$locationProvider` service provided by Angular\
    \ to set the HTML5 Mode of our app to true. This will ensure that our app uses\
    \ the HTML5 History API (used by all the modern browsers). Older browsers will\
    \ fall back to the hashtag method of showing URLs.\n\n**What is the HTML5 History\
    \ API?** It is a standardized way to manipulate the browser history using a script.\
    \ This lets Angular change the routing and URLs of our pages without refreshing\
    \ the page. For more information on this, here is a good [HTML5 History API Article](http://diveintohtml5.info/history.html).\n\
    \nWe already set the `<base>` and `$locationProvider.html5Mode(true)`, so we should\
    \ see clean URLs in this application.\n\n* * *\n\n#### Injecting Routes into Main\
    \ App\n\nOne of the main tenants of Angular development is dependency injection.\
    \ We’ll keep to that by injecting this new routes module we created into our main\
    \ application. We already loaded the `app.routes.js` file in our `index.html`\
    \ file so let’s go into `app.js` and inject this routes module.\n\nWe will add\
    \ it to the very first line like so:\n\n`angular.module('routerApp', ['routerRoutes'])`\n\
    \nJust like that, we now have applied our routes to our application!\n\n### Configuring\
    \ Views\n\nWe now have our routes and they are calling the appropriate files and\
    \ controllers. To finish off this tutorial, we just need to define the pages that\
    \ will be injected. We will also have them each display a message from its respective\
    \ controller. This is a straightforward process, just some HTML and displaying\
    \ the `{{ home.message }}`, `{{ about.message }}`, and `{{ contact.message }}`\
    \ variables within each view.\n\n`pages/home.html`\n\n```\n1 <div class=\"jumbotron\
    \ text-center\">\n2     <h1>Home Page</h1>\n3 \n4     <p>{{ home.message }}</p>\n\
    5 </div>\n```\n\n`pages/about.html`\n\n```\n1 <div class=\"jumbotron text-center\"\
    >\n2     <h1>About Page</h1>\n3 \n4     <p>{{ about.message }}</p>\n5 </div>\n\
    ```\n\n`pages/contact.html`\n\n```\n1 <div class=\"jumbotron text-center\">\n\
    2     <h1>Contact Page</h1>\n3 \n4     <p>{{ contact.message }}</p>\n5 </div>\n\
    ```\n\nWe are prefixing each of the variables with the controller name for each\
    \ HTML file that we defined in our routes using `controllerAs`.\n\nVisit your\
    \ application and click through the pages. You’ll see the data change and your\
    \ message variable change **all without a page refresh**!\n\n![Angular Routing\
    \ Home Page](images/12-angular-routing----angular-routing-final.jpg)\n\nAngular\
    \ Routing Home Page\n\n### Conclusion\n\nThere we have it! A single page application\
    \ with 3 different pages. Each page will also bring in a different Angular controller\
    \ so that data can be different across our site.\n\nYou can see the value of this\
    \ as it gives our basic websites into more of an integrated application feeling."
