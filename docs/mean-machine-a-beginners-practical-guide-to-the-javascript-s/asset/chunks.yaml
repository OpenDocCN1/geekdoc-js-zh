  trans: "\n现在在浏览器中查看该站点并开始在输入框中输入。得益于 Angular 及其 `directives`（指令）的魔法，`message` 变量会立即发生。\n\
    \n![数据绑定](img/11-angular-start----angular-data-binding-example.jpg)\n\n数据绑定\n\n\
    这里有一个 [CodePen](http://codepen.io/sevilayha/full/DhLqk/)，让你可以快速看到这些操作演示。完整代码也可以在本书的代码仓库中找到。\n\
    \n***\n\n![Tip](img/icon-heart.png \"专业提示\")\n\n提示\n\n### $scope vs. this\n\n\
    在网络上的其他 Angular 教程中，你可能见过 `$scope` 是一种将信息从控制器（controller）绑定到视图的方法。从 Angular 1.3\
    \ 开始，这种方法仍然存在，但建议使用 `controller as` 语法。\n\n这种方法有很多益处，因为它能保持我们的代码更加整洁、更有组织。在视图中，我们甚至可以更容易地看到控制器是如何被使用的。\n\
    \n以下是 `使用 $scope` 和 `不使用 $scope` 的两个快速对比。\n\n```\n1 <!-- 使用 $scope -->\n2 <div\
    \ ng-app=\"myApp\" ng-controller=\"mainController\">\n3     <p>{{ myVariable }}</p>\n\
    4 </div>\n5 \n6 <!-- 不使用 $scope - 使用 controller as -->\n7 <div ng-app=\"myApp\"\
    \ ng-controller=\"mainController as main\">\n8     <p>{{ main.myVariable }}</p>\n\
    9 </div>\n```\n\n这有很多益处，特别是当我们开始嵌套控制器时。更容易看出哪些变量和函数存在于每个控制器中。\n\n这样做的好处是它将强迫你为新的\
    \ Angular 2.0 语法做准备，该版本预计在大一年后发布。Angular 团队已经宣布`$scope` 将被淘汰，转而采用更接近 `controller\
    \ as` 的语法。\n\n不过，不用担心 Angular 2.0。如果你现在使用这种语法构建 Angular 应用程序，迁移到新版本将不会痛苦。\n\n\
    ***\n\n### 创建和处理表单\n\n现在让我们进入更高级的内容。我们通常希望在网站上有一个表单，而 Angular 让处理表单变得极其简单。让我们创建一个可以将计算机添加到我们的计算机列表中的表单。\n\
    \n这将在两个不同的部分完成：\n\n1. 创建一个 Angular 函数来处理表单并将其添加到我们的列表\n2. 添加 HTML 表单并将其连接起来与 Angular\
    \ 函数协同工作\n\n#### 处理表单的 Angular 函数\n\n让我们将这个 Angular 函数添加到我们的控制器中。\n\n```\n 1 //\
    \ 命名我们的 angular 应用\n 2 angular.module('firstApp', [])\n 3 \n4 .controller('mainController',\
    \ function() {\n 5 \n6     ...\n 7 \n8     // 来自我们表单的信息\n 9     vm.computerData\
    \ = {};\n10 \n11     vm.addComputer = function() {\n12         \n13         //\
    \ 将计算机添加到列表\n14         vm.computers.push({\n15             name: vm.computerData.name,\n\
    16             color: vm.computerData.color,\n17             nerdness: vm.computerData.nerdness\n\
    18         });\n19 \n20         // 在添加计算机后，清空表单\n21         vm.computerData =\
    \ {};\n22     };\n23 \n24 }); \n```\n\n我们将创建一个对象来存放表单数据，称为 `vm.computerData`。这一步并不是必要的，因为\
    \ Angular 会在需要时自动创建它，但为了清晰，我们会定义它。\n\n我们还创建一个函数，从 `vm.computerData` 中提取信息并将其推入我们的计算机数组。当添加时，它应该会自动将计算机添加到表格中，而无需刷新页面（几乎像魔法）。\n\
    \n计算机添加到列表后，我们将通过清空包含数据的对象来清空表单。在 jQuery 应用程序中，清空表单可以通过以下实现：\n\n`$('input').val('');`\n\
    \n在 Angular 中不行！我们现在熟悉 `data-binding`（数据绑定）了，由于我们在 Angular 侧清空了对象，这会自动清空视图侧的表单。\n\
    \n如此，让我们创建 HTML 表单并将其连接到我们刚刚创建的函数。\n\n#### HTML 表单\n\n在我们的 `index.html` 文件中，计算机\
    \ HTML 表格下方，添加以下表单：\n\n```\n 1 <!-- 向列表添加计算机的表单 -->\n 2 <form class=\"form-inline\"\
    \ ng-submit=\"main.addComputer()\">\n 3     \n 4     <input type=\"text\" class=\"\
    form-control\" placeholder=\"Macbook\" ng-model=\"main\\\n 5 .computerData.name\"\
    >\n 6     <input type=\"text\" class=\"form-control\" placeholder=\"Silver\" ng-model=\"\
    main.\\\n 7 computerData.color\">\n 8     <input type=\"number\" class=\"form-control\"\
    \ placeholder=\"8\" ng-model=\"main.com\\\n 9 puterData.nerdness\">\n10 \n11 \
    \    <button type=\"submit\" class=\"btn btn-success\">Add</button>\n12 </form>\n\
    ```\n\n我们这里有 3 个不同的输入和一个提交按钮。我们使用了 `ng-model` 将每个输入绑定到我们在 Angular 控制器中创建的 `computerData`\
    \ 对象的特定字段。\n\n在这里看到的新 Angular 指令是 `ng-submit`。它用于表单，并告诉 Angular 在提交表单时做什么。这里是我们的表单：\n\
    \n![表单](img/11-angular-start----angular-data-binding-example.jpg)\n\n去填写一些数据并点击\
    \ Add。观察你的表格如何自动更新，计算机被添加。\n\n### 总结\n\n本章一次性向你介绍了许多 Angular 概念。它们都是帮助你构建应用程序的工具。数据绑定、依赖注入和指令是\
    \ Angular 的基础，你将在每个应用程序中使用它们。\n\n接下来，我们将探索应用程序的路由，以便拥有功能完整的站点。\n\n# Angular 路由\n\
    \n我们将通过一个全新的应用演示 Angular 路由。在开始该新应用之前，让我们先讨论不同的路由技术。\n\n### ngRoute\n\n[ngRoute](https://docs.angularjs.org/api/ngRoute)\
    \ 是构建 Angular 应用程序时路由的标准模块。它是 Angular 支持的，并通过名为 `$route` 的服务提供路由（我们稍后会展示它是如何工作的）。\n\
    \n### 路由应用程序的 Node 服务器\n\n为了让我们使用 ngRoute，我们希望使用服务器，以便模拟该应用程序在浏览器中的工作方式。我们将启动一个服务器，因为正如你所看到的，我们不能直接打开文件。我们的\
    \ Angular 应用程序需要请求视图文件，如果没有服务器，我们将遇到问题。\n"
- fmt: "\n```\n1 - public/    // all of our frontend code (HTML/CSS/JS) will go here\n\
    2 ----- views/\n3 ---------- pages/\n4 ----- index.html\n5 ----- js/\n6 - package.json\n\
    7 - server.js\n```\n\nThose are the files we’ll need to start up our server and\
    \ our frontend Angular application. For now, we will only focus on `package.json`\
    \ and `server.js` to create a server.\n\n## Starting the Node Project\n\nLike\
    \ we’ve done before, `package.json` will house the packages and project information.\
    \ Go ahead and run `npm init` or just create the file yourself. Here’s the barebones\
    \ `package.json` file.\n\n```\n1 {\n2   \"name\": \"routing-app\",\n3   \"main\"\
    : \"server.js\",\n4   \"dependencies\": {\n5     \"express\": \"~4.9.1\"\n6  \
    \ }\n7 }\n```\n\nOnce you have that `package.json` file, run: `npm install` to\
    \ get your dependencies (Express in this case) into your `node_modules` folder.\
    \ Remember, you can also add dependencies from the command line using: `npm install\
    \ express --save`.\n\n## Setting Up the Express Server\n\nLike we have before,\
    \ our server will be setup in `server.js`. Let’s go ahead and create a very simple\
    \ server where we send an `index.html` to our users.\n\n```\n 1 // get the things\
    \ we need\n 2 var express = require('express');\n 3 var app     = express();\n\
    \ 4 var path = require('path');\n 5 \n6 // set the public folder to serve public\
    \ assets\n 7 app.use(express.static(__dirname + '/public'));\n 8 \n9 // set up\
    \ our one route to the index.html file\n10 app.get('*', function(req, res) {\n\
    11     res.sendFile(path.join(__dirname + '/public/views/index.html'));\n12 });\n\
    13 \n14 // start the server on port 8080 (http://localhost:8080)\n15 app.listen(8080);\n\
    16 console.log('Magic happens on port 8080.');\n```\n\nWhenever a request comes\
    \ into our server (we do this by using the `*` wildcard method), we will send\
    \ the user the `index.html` file which will have all of our Angular/HTML/CSS code.\
    \ We are also using Express to set the directory for static resources using `app.use(express.static())`.\
    \ This means that whenever our client requests a file like a CSS file, image,\
    \ or JS file, Node will serve that resource by looking in the public folder. All\
    \ of our frontend code lives in this `public` folder so this is a good setup for\
    \ our project.\n\nCreate a quick `public/views/index.html` file and just write\
    \ whatever you want in it. Start your server with:\n\n`nodemon server.js`\n\n\
    Now we can visit the app in our browser at `http://localhost:8080`.\n\nThis is\
    \ what’s so cool about Node. Even if you aren’t using it in your final project,\
    \ you can use it as a server for any projects you want to build. As we work on\
    \ our Angular app, we can just work within this URL.\n\nNow that we have the foundation\
    \ ready to build out our Angular routing application, let’s get moving on that.\n\
    \n## Sample Application\n\nWe’re just going to make a simple site with a home,\
    \ about, and contact page. Angular is built for much more advanced applications\
    \ than this, but this tutorial will show many of the concepts needed for those\
    \ larger projects.\n\n### Goals\n\n* Single page application\n* No page refresh\
    \ on page change\n* Different data on each page\n\n### File Structure\n\nThese\
    \ are the files that will be inside of our `public` folder that we set up in the\
    \ earlier step.\n\n```\n 1 public/\n 2 - views/\n 3 ----- pages/        // the\
    \ pages that will be injected into the main layout\n 4 ---------- home.html\n\
    \ 5 ---------- about.html\n 6 ---------- contact.html\n 7 ----- index.html   \
    \     // main layout\n 8 - js/\n 9 ----- app.js        // stores all our angular\
    \ code\n10 ----- app.routes.js // stores all our angular routes\n```\n\n## The\
    \ HTML For Our App\n\nThis is the simple part. We’re using [Bootstrap](http://getbootstrap.com)\
    \ and [Font Awesome](http://fontawesome.io) to make our styles easier. Open up\
    \ your `index.html` file and we’ll add a simple layout with a navigation bar.\n\
    \n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n 4     <meta charset=\"utf-8\"\
    >\n 5     <title>My Routing App!</title>\n 6 \n 7     <!-- set the base path for\
    \ angular routing -->\n 8     <base href=\"/\">\n 9 \n10     <!-- CSS -->\n11\
    \     <!-- load bootstrap and fontawesome via CDN -->\n12     <link rel=\"stylesheet\"\
    \ href=\"http://netdna.bootstrapcdn.com/bootstrap/3.0.0/\\\n13 css/bootstrap.min.css\"\
    >\n14     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n15 .0/css/font-awesome.css\">\n16     <style>\n17         body { padding-top:50px;\
    \ }\n18     </style>\n19 \n20     <!-- JS -->\n21     <!-- load angular and fontawesome\
    \ via CDN -->\n22     <script src=\"http://netdna.bootstrapcdn.com/angularjs/1.4.6/\\\
    \n23 angular.min.js\"></script>\n24     <script src=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n25 .0/js/font-awesome.min.js\"></script>\n26 \n27     <!-- load custom scripts\
    \ -->\n28     <script src=\"js/app.js\"></script>\n29     <script src=\"js/app.routes.js\"\
    ></script>\n30 </head>\n31 <body class=\"container\" ng-app=\"routerApp\">\n32\
    \ \n33   <!-- HEADER AND NAVBAR -->\n34   <nav class=\"navbar navbar-default\"\
    >\n35       <div class=\"container-fluid\">\n36         <a class=\"navbar-brand\"\
    \ href=\"#\">Angular Routing</a>\n37       </div>\n38 \n39       <ul class=\"\
    nav navbar-right\">\n40         <li><a href=\"/\">i class=\"fa fa-home\"></i>\
    \ Home</a></li>\n41         <li><a href=\"/about\"><i class=\"fa fa-shield\"></i>\
    \ About</a></li>\n42         <li><a href=\"/contact\"><i class=\"fa fa-comment\"\
    ></i> Contact</a></li>\n43       </ul>\n44     </nav>\n45   </header>\n46 \n47\
    \   <!-- MAIN CONTENT AND INJECTED VIEWS -->\n48   <main>\n49 \n50     <!-- content\
    \ goes here -->\n51   </main>\n52 </body>\n53 </html>\n```\n\nWe’re loading Angular\
    \ and Route from the Google. It is important to load the module separately since\
    \ we will inject that into main application. This is another example of how dependency\
    \ injection working in Angular.\n\n![Angular Foundation](images/12-angular-routing----start.jpg)\n\
    \n## Angular Application\n\n### Module and Controller\n\nNext up, we have to create\
    \ our application. Check out the docs for more information on each. We’ll create\
    \ this in our `app.js`:\n\n```\n1 angular.module('routerApp', [])\n2 \n3 // create\
    \ the controllers\n4 // this will be the controller for the ENTIRE site\n5 .controller('mainController',\
    \ function() {\n6 \n7   var vm = this;\n8 \n9   // create a bigMessage variable\
    \ to display in our view\n10   vm.bigMessage = 'A smooth sea never made a skilled\
    \ sailor.';\n11 })\n12 \n13 // home page specific controller\n14 .controller('homeController',\
    \ function() {\n15 \n16   var vm = this;\n17 \n18   vm.message = 'This is the\
    \ home page!';\n19 })\n20 \n21 // about page controller\n22 .controller('aboutController',\
    \ function() {\n23 \n24   var vm = this;\n25 \n26   vm.message = 'Look! I am an\
    \ about page.';\n27 })\n28 \n29 // contact page controller\n30 .controller('contactController',\
    \ function() {\n31 \n32   var vm = this;\n33 \n34   vm.message = 'Contact us!\
    \ JK. This is just a demo.';\n35 });\n```\n\nLet’s add the module and controller\
    \ to our HTML so that Angular knows how to bootstrap/initialize our application.\
    \ To test that everything is working, we will also show the `vm.bigMessage` variable\
    \ that we created.\n\nWe also have a `homeController`, `aboutController` and `contactController`\
    \ here that we aren’t using yet. This is because we will use these for our About\
    \ and Contact pages when we eventually show them using Angular routing. `mainController`\
    \ will encompass everything inside of the `<body>` tag.\n\n#### Applying the Angular\
    \ Application\n"
  raw: "```\n1 - public/    // all of our frontend code (HTML/CSS/JS) will go here\n\
    2 ----- views/\n3 ---------- pages/\n4 ----- index.html\n5 ----- js/\n6 - package.json\n\
    7 - server.js\n```\n\nThose are the files we’ll need to start up our server and\
    \ our frontend Angular application. For now, we will only focus on `package.json`\
    \ and `server.js` to create a server.\n\n#### Starting the Node Project\n\nLike\
    \ we’ve done before, `package.json` will house the packages and project information.\
    \ Go ahead and run `npm init` or just create the file yourself. Here’s the barebones\
    \ `package.json` file.\n\n```\n1 {\n2   \"name\": \"routing-app\",\n3   \"main\"\
    : \"server.js\",\n4   \"dependencies\": {\n5     \"express\": \"~4.9.1\"\n6  \
    \ }\n7 }\n```\n\nOnce you have that `package.json` file, run: `npm install` to\
    \ get your dependencies (Express in this case) into your **node_modules** folder.\
    \ Remember, you can also add dependencies from the command line using: `npm install\
    \ express --save`.\n\n#### Setting Up the Express Server\n\nLike we have before,\
    \ our server will be setup in `server.js`. Let’s go ahead and create a very simple\
    \ server where we send an `index.html` to our users.\n\n```\n 1 // get the things\
    \ we need\n 2 var express = require('express');\n 3 var app     = express();\n\
    \ 4 var path = require('path');\n 5 \n 6 // set the public folder to serve public\
    \ assets\n 7 app.use(express.static(__dirname + '/public'));\n 8 \n 9 // set up\
    \ our one route to the index.html file\n10 app.get('*', function(req, res) {\n\
    11     res.sendFile(path.join(__dirname + '/public/views/index.html'));\n12 });\n\
    13 \n14 // start the server on port 8080 (http://localhost:8080)\n15 app.listen(8080);\n\
    16 console.log('Magic happens on port 8080.');\n```\n\nWhenever a request comes\
    \ into our server (we do this by using the `*` wildcard method), we will send\
    \ the user the `index.html` file which will have all of our Angular/HTML/CSS code.\
    \ We are also using Express to set the directory for static resources using `app.use(express.static())`.\
    \ This means that whenever our client requests a file like a CSS file, image,\
    \ or JS file, Node will serve that resource by looking in the public folder. All\
    \ of our frontend code lives in this **public** folder so this is a good setup\
    \ for our project.\n\nCreate a quick `public/views/index.html` file and just write\
    \ whatever you want in it. Start your server with:\n\n`nodemon server.js`\n\n\
    Now we can visit the app in our browser at `http://localhost:8080`.\n\nThis is\
    \ what’s so cool about Node. Even if you aren’t using it in your final project,\
    \ you can use it as a server for any projects you want to build. As we work on\
    \ our Angular app, we can just work within this URL.\n\nNow that we have the foundation\
    \ ready to build out our Angular routing application, let’s get moving on that.\n\
    \n### Sample Application\n\nWe’re just going to make a simple site with a home,\
    \ about, and contact page. Angular is built for much more advanced applications\
    \ than this, but this tutorial will show many of the concepts needed for those\
    \ larger projects.\n\n#### Goals\n\n*   Single page application\n\n*   No page\
    \ refresh on page change\n\n*   Different data on each page\n\n#### File Structure\n\
    \nThese are the files that will be inside of our **public** folder that we set\
    \ up in the earlier step.\n\n```\n 1 public/\n 2 - views/\n 3 ----- pages/   \
    \     // the pages that will be injected into the main layout\n 4 ---------- home.html\n\
    \ 5 ---------- about.html\n 6 ---------- contact.html\n 7 ----- index.html   \
    \     // main layout\n 8 - js/\n 9 ----- app.js        // stores all our angular\
    \ code\n10 ----- app.routes.js // stores all our angular routes\n```\n\n### The\
    \ HTML For Our App\n\nThis is the simple part. We’re using [Bootstrap](http://getbootstrap.com)\
    \ and [Font Awesome](http://fontawesome.io) to make our styles easier. Open up\
    \ your `index.html` file and we’ll add a simple layout with a navigation bar.\n\
    \n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n 4     <meta charset=\"utf-8\"\
    >\n 5     <title>My Routing App!</title>\n 6 \n 7     <!-- set the base path for\
    \ angular routing -->\n 8     <base href=\"/\">\n 9 \n10     <!-- CSS -->\n11\
    \     <!-- load bootstrap and fontawesome via CDN -->\n12     <link rel=\"stylesheet\"\
    \ href=\"http://netdna.bootstrapcdn.com/bootstrap/3.0.0/\\\n13 css/bootstrap.min.css\"\
    >\n14     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n15 .0/css/font-awesome.css\">\n16     <style>\n17         body { padding-top:50px;\
    \ }\n18     </style>\n19 \n20     <!-- JS -->\n21     <!-- load angular and angular-route\
    \ via CDN -->\n22     <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.mi\\\
    \n23 n.js\"></script>\n24     <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-ro\\\
    \n25 ute.js\"></script>\n26 \n27     <!-- load our custom angular app files -->\n\
    28     <script src=\"js/app.js\"></script>\n29     <script src=\"js/app.routes.js\"\
    ></script>\n30 </head>\n31 <body class=\"container\">\n32 \n33   <!-- HEADER AND\
    \ NAVBAR -->\n34   <header>\n35     <nav class=\"navbar navbar-default\">\n36\
    \       <div class=\"navbar-header\">\n37         <a class=\"navbar-brand\" href=\"\
    /\">Angular Routing Example</a>\n38       </div>\n39 \n40       <ul class=\"nav\
    \ navbar-nav navbar-right\">\n41         <li><a href=\"/\"><i class=\"fa fa-home\"\
    ></i> Home</a></li>\n42         <li><a href=\"/about\"><i class=\"fa fa-shield\"\
    ></i> About</a></li>\n43         <li><a href=\"/contact\"><i class=\"fa fa-comment\"\
    ></i> Contact</a></li>\n44       </ul>\n45     </nav>\n46   </header>\n47 \n48\
    \   <!-- MAIN CONTENT AND INJECTED VIEWS -->\n49   <main>\n50 \n51     stuff goes\
    \ here!\n52 \n53     <!-- angular templating will go here -->\n54     <!-- this\
    \ is where content will be injected -->\n55 \n56   </main>\n57 \n58 </body>\n\
    59 </html>\n```\n\nWe’re loading Angular and Angular Route from the Google CDN.\
    \ It is important to load up the routing module separately since we will be injecting\
    \ that into our main Angular app. This is another example of how we can see dependency\
    \ injection working in Angular applications. We’ll also store our application\
    \ routes inside of their own `app.routes.js` file which we will inject into our\
    \ main application.\n\n![Angular Routing Foundation](images/12-angular-routing----angular-routing-start.jpg)\n\
    \nAngular Routing Foundation\n\nNext up, we have to create our Angular application\
    \ (`angular.module`) and then we will come back to the HTML to apply that app.\n\
    \n### Angular Application\n\n#### Module and Controller\n\nWe’re going to setup\
    \ our application. Let’s create the angular module and controller. Check out the\
    \ docs for more information on each. We’ll create this in our JavaScript file\
    \ (`public/js/app.js`):\n\n```\n 1 angular.module('routerApp', [])\n 2 \n 3 //\
    \ create the controllers\n 4 // this will be the controller for the ENTIRE site\n\
    \ 5 .controller('mainController', function() {\n 6 \n 7   var vm = this;\n 8 \n\
    \ 9   // create a bigMessage variable to display in our view\n10   vm.bigMessage\
    \ = 'A smooth sea never made a skilled sailor.';\n11 })\n12 \n13 // home page\
    \ specific controller\n14 .controller('homeController', function() {\n15 \n16\
    \   var vm = this;\n17 \n18   vm.message = 'This is the home page!';\n19 })\n\
    20 \n21 // about page controller\n22 .controller('aboutController', function()\
    \ {\n23 \n24   var vm = this;\n25 \n26   vm.message = 'Look! I am an about page.';\n\
    27 })\n28 \n29 // contact page controller\n30 .controller('contactController',\
    \ function() {\n31 \n32   var vm = this;\n33 \n34   vm.message = 'Contact us!\
    \ JK. This is just a demo.';\n35 });\n```\n\nLet’s add the module and controller\
    \ to our HTML so that Angular knows how to bootstrap/initialize our application.\
    \ To test that everything is working, we will also show the `vm.bigMessage` variable\
    \ that we created.\n\nWe also have a `homeController`, `aboutController` and `contactController`\
    \ here that we aren’t using yet. This is because we will use these for our About\
    \ and Contact pages when we eventually show them using Angular routing. `mainController`\
    \ will encompass everything inside of the `<body>` tag while the other controllers\
    \ are specific to each page.\n\n#### Applying the Angular Application"
