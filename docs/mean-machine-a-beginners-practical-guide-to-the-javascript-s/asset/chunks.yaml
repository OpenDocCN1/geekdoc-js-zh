    \ `package.json` or `server.js` file like our Node applications. This is a purely\
    \ front-end application with just HTML/CSS/JS!\n\n* `js/`\n    * `app.js`\n* `index.html`\n\
    \nSuper simple stuff! 2 files will get us everything we need for our first Angular\
    \ application.\n\nThe things we are looking to accomplish with this application\
    \ are:\n\n1. setup an Angular frontend application\n2. display data (message and\
    \ a list) from our Angular controller to the view\n3. show off data-binding by\
    \ updating the message using an input box\n\n### Creating Your Angular App (app.js)\n\
    \nWe will start by creating the main module for our application. Let’s go into\
    \ that `app.js` file and see how Angular modules are made:\n\n```\n 1 // name\
    \ our angular app\n 2 angular.module('firstApp', [])\n 3 \n 4 .controller('mainController',\
    \ function() {\n 5 \n 6     // bind this to vm (view-model)\n 7     var vm = this;\n\
    \ 8 \n 9     // define variables and objects on this\n10     // this lets them\
    \ be available to our views\n11 \n 12     // define a basic variable\n13     vm.message\
    \ = 'Hey there! Come and see how good I look!';\n14 \n 15     // define a list\
