    \nThis drop in functionality is what is so great about Angular. We are creating\
    \ a set of modules and then injecting them into one another. We will inject this\
    \ into our User CRM application that we create in Chapter 17.\n\n*Note: If your\
    \ API is hosted on a separate server, then you will need to prefix all these `/api/`\
    \ URLs with your server URL like so: `$http.get('http://example.com/api/users,\
    \ ...)`.*\n\nNext up, we’ll create another service that we will use to handle\
    \ authentication. Services can be used for more than just grabbing data. They\
    \ can act as data objects and handle all the functions and properties necessary\
    \ for a certain operation, in this case, authentication.\n\n## Angular Authentication\n\
    \nWe now have the foundation for our MEAN stack application. We have talked extensively\
    \ about the separation between backend server-side and frontend client-side code."
