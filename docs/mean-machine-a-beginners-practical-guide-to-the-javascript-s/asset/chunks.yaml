  trans: "\n我们收到了一条成功消息，显示用户已创建。让我们来处理 API 路由以获取所有用户，这样我们就可以看到刚刚创建的用户。\n\n如果用户名已被占用，`mongoose`\
    \ 将抛出错误代码 `11000`。如果发生错误，我们将检查该错误代码并返回消息 `'A user with that username already exists.`（已存在该用户名的用户）。\n\
    \n![Duplicate User](img/09-restful-api----duplicate-user.jpg)\n\n重复用户\n\n## 获取所有用户\
    \ (GET /api/users)\n\n这是一个简单的路由，我们将将其添加到 `server.js` 中，也就是之前为 POST 创建的 `router.route('/users')`\
    \ 上。通过 `router.route()`，我们能够使用不同的 HTTP 动作链式不同的路由。这让我们的应用程序保持整洁和有序。\n\n```\n 1\
    \ // <--路由中间件和第一个路由在这里\n 2 \n 3 // 在以 /users 结尾的路由\n 4 // ----------------------------------------------------\n\
    \ 5 apiRouter.route('/users')\n 6\n 7\t// 创建用户（通过 POST http://localhost:8080/api/users\
    \ 访问）\n 8\t.post(function(req, res) {\n 9\t\t...\t\t\t\n10 \t})\n11 \n12\t// 获取所有用户（通过\
    \ GET http://localhost:8080/api/users 访问）\n13\t.get(function(req, res) {\n14 \t\
    \tUser.find(function(err, users) {\n15 \t\t\tif (err) res.send(err);\n16 \n17\
    \ // 返回用户\n18 \t\t\tres.json(users);\n19 \t\t});\n20 \t});\n```\n\n简单直了的路由。只需向\
    \ `http://localhost:8080/api/users` 发送一个 `GET` 请求，我们就能以 JSON 格式获取所有用户。\n\n![Node\
    \ API Postman GET All](img/09-restful-api----get-after-create.jpg)\n\nNode API\
    \ Postman 获取所有\n\n我们可以看到 Holly 已经在我们的数据库中了，得益于 `bcrypt` 以及我们创建的那个函数（每当我们保存用户到数据库时它就会运行），她的密码已经被哈希处理了。记得这里为\
    \ Holly 自动生成的 `_id` 吗？我们在创建获取单个用户的路由时将用到它。\n\n### 为单个项目创建路由\n\n我们已经处理了以 `/users`\
    \ 结尾的路由组。现在让我们处理传入参数（如用户 ID）时的路由。\n\n我们在这个路由（以 `/users/:user_id` 结尾）中执行的操作有：\n\
    \n* 获取单个用户。\n* 更新用户信息。\n* 删除用户。\n* 请求中的 `:user_id` 将通过我们稍早调用的那个 `body-parser`\
    \ 包来访问。\n\n## 获取单个用户 (GET /api/users/:user_id)\n\n我们将添加另一个 `apiRouter.route()`\
    \ 来处理所有带有 `:user_id` 的请求。同样，将其放入你的 `server.js` 文件中，放在 `apiRouter.route('/users')`\
    \ 代码块之后。\n\n```\n 1 // 在以 /users/:user_id 结尾的路由\n 2 // ----------------------------------------------------\n\
    \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET\
    \ http://localhost:8080/api/users/:user_id 访问）\n 7\t.get(function(req, res) {\n\
    \ 8\t\tUser.findById(req.params.user_id, function(err, user) {\n 9\t\t\tif (err)\
    \ res.send(err);\n10 \n11\t\t\t// 返回该用户\n12 \t\t\tres.json(user);\n13 \t\t});\n\
    ```\n\n从我们获取所有用户的调用中，我们可以得到所有用户的列表，每个用户都有唯一的 id。让我们取其中一个 id 并用 Postman 进行测试。\n\
    \n输入 `http://localhost:8080/api/users/5481e26e93b9ba717bd5`，选择 `GET` 并点击发送。\n\n\
    这将返回我们的用户数据。简单！\n\n```\n 1 {\n2     \"password\": \"$2a$10$rgrazsDZHb7C90vq/si0kueePetqUBv2j\n\
    3     \"username\": \"chris\",\n4     \"name\": \"Chris\",\n5     \"_id\": \"\
    5481e26e93b9ba717bd5\",\n6     \"__v\": 0\n7 }\n```\n\n![Node API Postman Get\
    \ User](img/09-restful-api----node-api-get-single.jpg)\n\nNode API Postman 获取单个用户\n\
    \n现在我们可以从 API 获取用户了，让我们更新用户的姓名。假设他想更有身份一点，我们将他的名字改为 `Sir Klaus`。\n\n## 更新用户信息\
    \ (PUT /api/users/:user_id)\n\n我们将路由链到 `router.route()` 上并添加 `.put()`。\n\n```\n\
    \ 1 // 在以 /users/:user_id 结尾的路由\n 2 // -------------------------------------\n\
    \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET\
    \ http://localhost:8080/api/users/:user_id 访问）\n 7\t.get(function(req, res) {\n\
    \ 8\t\t...\n 9 \t})\n10 \n11\t// 更新此 id 的用户 \n12\t//（通过 PUT http://localhost:8080/api/users/:user_id\
    \ 访问）\n13\t.put(function(req, res) {\n14 \n15\t\t// 使用我们的用户模型找到用户\n16\t\tUser.findById(req.params.user_id,\
    \ function(err, user) {\n17 \n18\t\t\tif (err) res.send(err);\n19 \n20\t\t\t//\
    \ 仅更新用户信息\n21\t\t\tif (req.body.name) user.name = req.body.name;\n22\t\t\tif (req.body.username)\
    \ user.username = req.body.username;\n23\t\t\tif (req.body.password) user.password\
    \ = req.body.password;\n24 \n25\t\t\t// 保存用户\n26\t\t\tuser.save(function(err)\
    \ {\n27\t\t\t\tif (err) res.send(err);\n28 \n29\t\t\t\t// 返回消息\n30\t\t\t\tres.json({\
    \ message: 'User updated!' });\n31 \t\t\t});\n32 \n\t\t});\n33 \t})\n```\n\n我们将使用\
    \ `PUT` 请求中提供的 `id`，获取该用户，进行更改并将其保存回数据库。注意，只有当 `name`、`username` 或 `password`\
    \ 发生变化时我们才会更改数据库中的它们。\n\n![Node API Postman Update Record](img/09-restful-api----node-api-postman-update-record.jpg)\n\
    \nNode API Postman 更新记录\n\n由于我们在 PUT 路由中加入了条件判断，如果没有传递 username 或 password，这些字段将不会被更新。我们不希望在未传递的情况下将它们更新为空。\n\
    \n我们还可以使用之前使用的 `GET /api/users` 调用查看她的名字是否已更改。\n\n![Node API Postman All Updated](img/09-restful-api----node-api-postman-all-updated.jpg)\n\
    \nNode API Postman 全部更新\n\nHolly 在数据库中的名字现在从 `Holly` 变成了她的全名 `Holly Lloyd`。快乐时光结束了。现在让我们删除\
    \ Holly。\n\n## 删除用户 (DELETE /api/users/:user_id)\n\n当有人请求删除用户时，他们只需要向 `/api/users/:user_id`\
    \ 发送 `DELETE` 即可。\n\n让我们添加删除用户的代码。\n\n```\n 1 // 在以 /users/:user_id 结尾的路由\n 2\
    \ // ----------------------------------------------------\n 3 apiRouter.route('/users/:user_id')\n\
    \ 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET http://localhost:8080/api/users/:user_id\
    \ 访问）\n 7\t.get(function(req, res) {\n 8\t\t...\n 9 \t})\n10 \n11\t// 更新此 id 的用户\
    \ \n12\t//（通过 PUT http://localhost:8080/api/users/:user_id 访问）\n13\t.put(function(req,\
    \ res) {\n14\t\t...\n15 \t})\n16 \n17\t// 删除此 id 的用户 \n18\t//（通过 DELETE http://localhost:8080/api/users/:user_id\
    \ 访问）\n19\t.delete(function(req, res) {\n20\t\tUser.remove({\n21\t\t\t_id: req.params.user_id\n\
    22\t\t}, function(err, user) {\n23\t\t\tif (err) return res.send(err);\n24 \n\
    25\t\t\tres.json({ message: 'Successfully deleted' });\n26 \t\t});\n27 \t});\n\
    ```\n\n现在当我们使用正确的 `user_id` 向我们的 API 发送 `DELETE` 请求时，我们将用户从世界中删除。\n\n![Node API\
    \ Postman Delete](img/09-restful-api----node-api-postman-delete.jpg)\n\nNode API\
    \ Postman 删除\n\n当我们尝试获取所有用户时，你应该注意到现在少了一个。\n\n### 总结\n\n我们现在有能力通过自己的 API 对特定资源（我们亲爱的用户）进行\
    \ CRUD（增删改查）。使用上述技术将为构建更大、更健壮的 API 奠良好的基础。\n\n这是使用 Express 4 创建 Node API 的快速回顾。对于你自己的\
    \ API，还有很多可以做的事。你可以添加身份验证、创建更好的错误消息，并添加不同的模块，而不仅仅局限于用户。\n"
