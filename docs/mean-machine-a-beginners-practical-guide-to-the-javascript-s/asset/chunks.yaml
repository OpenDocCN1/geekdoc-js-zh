    \ next();\n19 \n20 \t// generate the hash\n21 \tbcrypt.hash(user.password, null,\
    \ null, function(err, hash) {\n22 \t\tif (err) return next(err);\n23 \n24 \t\t\
    // change the password to the hashed version\n25 \t\tuser.password = hash;\n26\
    \ \t\tnext();\n27 \t});\n28 });\n29 \n30 // method to compare a given password\
