  trans: "\n\n```javascript\nvar User       = require('../models/user');\nvar jwt\
    \        = require('jsonwebtoken');\nvar config     = require('../../config');\n\
    \n// 用于创建令牌的密钥\nvar superSecret = config.secret;\n\nmodule.exports = function(app,\
    \ express) {\n\n  var apiRouter = express.Router();\n\n  // 身份验证用户的路由 (POST http://localhost:8080/api/authenticate)\n\
    \  apiRouter.post('/authenticate', function(req, res) {\n    console.log(req.body.username);\n\
    \n    // 查找用户\n    // 显式选择密码，因为 mongoose 默认不返回它\n    User.findOne({\n      username:\
    \ req.body.username\n    }).select('password').exec(function(err, user) {\n\n\
    \      if (err) throw err;\n\n      // 未找到该用户名的用户\n      if (!user) {\n      \
    \  res.json({ \n          success: false, \n          message: '认证失败。未找到用户。' \n\
    \        });\n      } else if (user) {\n\n        // 检查密码是否匹配\n        var validPassword\
    \ = user.comparePassword(req.body.password);\n        if (!validPassword) {\n\
    \          res.json({ \n            success: false, \n            message: '认证失败。密码错误。'\
    \ \n          });\n        } else {\n\n          // 如果找到了用户且密码正确\n          //\
    \ 创建令牌\n          var token = jwt.sign(user, superSecret, {\n            expiresInMinutes:\
    \ 1440 // 24 小时后过期\n          });\n\n          // 返回包含令牌在内的 JSON 信息\n        \
    \  res.json({\n            success: true,\n            message: '请使用您的令牌！',\n\
    \            token: token\n          });\n        }   \n\n      });\n  });\n\n\
    \  // 验证令牌的路由中间件\n  apiRouter.use(function(req, res, next) {\n      // 日志\n  \
    \    console.log('有人访问了我们的应用！');\n\n      // 检查头部、URL 参数或请求参数中的令牌\n      var token\
    \ = req.body.token || req.param('token') || req.headers['x-access-token'];\n\n\
    \      // 解码令牌\n      if (token) {\n\n        // 验证密钥并检查过期\n        jwt.verify(token,\
    \ superSecret, function(err, decoded) {      \n          if (err) {\n        \
    \    return res.json({ success: false, message: '令牌认证失败。' });    \n          }\
    \ else {\n            // 如果一切正常，保存到请求中供其他路由使用\n            req.decoded = decoded;\
    \    \n\n            next(); // 确保我们进入下一个路由而不是在此停止\n          }\n        });\n\
    \n      } else {\n\n      // 如果没有令牌\n      // 返回 HTTP 403 响应（访问被禁止）和错误消息\n   \
    \   return res.status(403).send({ \n        success: false, \n        message:\
    \ '未提供令牌。' \n      });\n      \n    }\n\n  });\n\n  // 测试路由以确保一切运行正常 \n  // 访问地址为\
    \ GET http://localhost:8080/api\n  apiRouter.get('/', function(req, res) {\n \
    \     res.json({ message: '万岁！欢迎来到我们的 api!' });   \n  });\n\n  // 以 /users 结尾的路由\n\
    \  // ----------------------------------------------------\n  apiRouter.route('/users')\n\
    \n      // 创建用户 (访问地址为 POST http://localhost:8080/users)\n      .post(function(req,\
    \ res) {\n          \n          var user = new User();      // 创建 User 模型的新实例\n\
    \          user.name = req.body.name;  // 设置用户名称（来自请求）\n          user.username\
    \ = req.body.username;  // 设置用户名（来自请求）\n          user.password = req.body.password;\
    \  // 设置用户密码（来自请求）\n          user.save(function(err) {\n              if (err)\
    \ res.send(err);\n              // 返回消息\n              res.json({ message: '用户创建成功！'\
    \ });\n          });\n      })\n      // 获取所有用户 (访问地址为 GET http://localhost:8080/api/users)\n\
    \      .get(function(req, res) {\n          User.find(function(err, users) {\n\
    \              if (err) res.send(err);\n              // 返回用户\n              res.json(users);\n\
    \          });\n      });\n  // 以 /users/:user_id 结尾的路由\n  // ----------------------------------------------------\n\
    \  apiRouter.route('/users/:user_id')\n      // 根据该 ID 获取用户\n      .get(function(req,\
    \ res) {\n          User.findById(req.params.user_id, function(err, user) {\n\
    \              if (err) res.send(err);\n              // 返回该用户\n             \
    \ res.json(user);\n          });\n      })\n      // 根据此 ID 更新用户\n      .put(function(req,\
    \ res) {\n          User.findById(req.params.user_id, function(err, user) {\n\
    \              if (err) res.send(err);\n              // 如果请求中存在新用户信息，则设置新信息\n\
    \              if (req.body.name) user.name = req.body.name;\n              if\
    \ (req.body.username) user.username = req.body.username;\n              if (req.body.password)\
    \ user.password = req.body.password;\n              user.save(function(err) {\n\
    \                  if (err) res.send(err);\n                  // 返回消息\n      \
    \            res.json({ message: '用户已更新！ });\n              });\n          });\n\
    \      })\n      // 根据此 ID 删除用户\n      .delete(function(req, res) {\n        \
    \  User.remove({\n              _id: req.params.user_id\n          }, function(err)\
    \ {\n              if (err) res.send(err);\n              // 返回消息\n          \
    \    res.json({ message: '用户已删除' });\n          });\n      });\n\n  return apiRouter;\n\
    };\n```\n\n"
- fmt: "\nAny route not handled by Node will be passed to Angular. Creating the route\
    \ is very easy. We are going to delete the route we created for the home page\
    \ and create the following:\n\n```\n 1 var path = require('path');\n 2 \n 3 ...\
    \ \n 4 \n 5 var apiRoutes...\n 6 \n 7 // MAIN CATCHALL ROUTE --------------- \n\
    \ 8 // SEND USERS TO FRONTEND ------------\n 9 // has to be registered after API\
    \ ROUTES\n10 app.get('*', function(req, res) {\n11   res.sendFile(path.join(__dirname\
    \ + '/public/app/views/index.html'));\n12 });\n```\n\nMake sure that `path` is\
    \ loaded in the packages section since that is required to pass an HTML file.\
    \ Using the `*` will match all routes. It is important to put this route **after\
    \ the API routes** since we only want it to catch routes not handled by Node.\n\
    \nIf this were placed above the API routes, then our user would always be sent\
    \ the `index.html` file and never even get to the API routes.\n\n# Final Node\
    \ server.js\n\nHere’s the full `server.js` file:\n\n```\n 1 // BASE SETUP\n 2\
    \ // ======================================\n 3 \n 4 // CALL THE PACKAGES --------------------\n\
    \ 5 var express    = require('express');    // call express\n 6 var app      \
    \  = express();         // define our app using express\n 7 var bodyParser = require('body-parser');\
    \  // get body-parser\n 8 var morgan     = require('morgan');     // used to see\
    \ requests\n 9 var mongoose   = require('mongoose');\n10 var config     = require('./config');\n\
    11 var path     = require('path');\n 12 \n 13 // APP CONFIGURATION ==================\n\
    \ 14 // ====================================\n 15 // use body parser so we can\
    \ grab information from POST requests\n16 app.use(bodyParser.urlencoded({ extended:\
    \ true }));\n17 app.use(bodyParser.json())\n 18 \n19 // configure our app to handle\
    \ CORS requests\n20 app.use(function(req, res, next) {\n21   res.setHeader('Access-Control-Allow-Origin',\
    \ '*');\n22   res.setHeader('Access-Control-Allow-Methods', 'GET, POST');\n23\
    \   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
    \ \\\n24 Authorization');\n25   next();\n26 });\n 27 \n28 // log all requests\
    \ to the console \n29 app.use(morgan('dev'))\n 30 \n31 // connect to our database\
    \ (hosted on modulus.io)\n32 mongoose.connect(config.database); \n 33 \n34 //\
    \ set static files location\n35 // used for requests that our frontend will make\n\
    36 app.use(express.static(__dirname + '/public'));\n 37 \n38 // ROUTES FOR OUR\
    \ API =================\n39 // ====================================\n 40 \n41\
    \ // API ROUTES ------------------------\n42 var apiRoutes = require('./app/routes/api')(app,\
    \ express);\n43 app.use('/api', apiRoutes);\n 44 \n45 // MAIN CATCHALL ROUTE ---------------\
    \ \n46 // SEND USERS TO FRONTEND ------------\n47 // has to be registered after\
    \ API ROUTES\n48 app.get('*', function(req, res) {\n49   res.sendFile(path.join(__dirname\
    \ + '/public/app/views/index.html'));\n50 });\n 51 \n52 // START THE SERVER\n\
    53 // ====================================\n54 app.listen(config.port);\n55 console.log('Magic\
    \ happens on port ' + config.port);\n```\n\nNow that we have organized the Node\
    \ side of things, let’s lay the groundwork for our Angular application.\n\n# Organizing\
    \ AngularJS - Frontend\n\nThe only file we will create here is the `index.html`\
    \ file since that is what we are returning with our Node catchall route. We’ll\
    \ just create the folders for the rest of the application so we have the foundation\
    \ ready to go.\n\nHere’s the file structure now:\n\n```\n 1 - app/\n 2 ----- models/\n\
    \ 3 ----- routes/\n 4 ---------- api.js\n 5 - public/\n 6 ----- assests/  \n 7\
    \ ---------- css/   \n 8 --------------- style.css   \n 9 ---------- js/\n10 ----------\
    \ img/       \n11 ---------- libs/     \n12 ----- app/      \n13 ---------- controllers/\n\
    14 ---------- services/\n15 ---------- app.routes.js\n16 ---------- app.js\n17\
    \ ---------- views/\n18 --------------- pages/\n19 --------------- index.html\n\
    20 - package.json\n21 - config.js- server.js\n```\n\nGo ahead and create the folders\
    \ and files within the `public/` folder.\n\nHere is a good starting point for\
    \ our `index.html` file:\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3\
    \ <head>\n 4   <meta charset=\"UTF-8\">\n 5   <title>My MEAN App</title>\n 6 </head>\n\
    \ 7 <body>\n 8   \n 9 HELLO!\n10 \n11 </body>\n12 </html>\n```\n\n# Testing Our\
    \ Newly Organized App\n\nLet’s make sure that everything is working properly.\n\
    \nRun\n\n`npm install`\n\nif you haven’t already to bring in the files that we’ll\
    \ need.\n\nThen go ahead and run:\n\n`nodemon server.js`\n\nand visit the application\
    \ in your browser!\n\n![Testing App structure](images/14-app-structure----test.jpg)\n\
    \nTesting App structure\n\nThat was a lot of setting up. This shows you how important\
    \ something as simple as directory structure is for our applications. This ensures\
    \ our scalability and our ability to add on new features and components in the\
    \ future. A solid infrastructure and file directory will also help other developers\
    \ we work with; they will be able to understand how things are laid out.\n\nNow\
    \ let’s continue our move to a full stack MEAN application by talking about how\
    \ we can link the frontend and the backend with Angular services. We will also\
    \ be using services to handle frontend authentication.\n\nAfter we learn about\
    \ Angular services and authentication, we’ll move on to creating our full stack\
    \ MEAN app.\n\n## Angular Services to Access an API\n\nSeparating server-side\
    \ and client-side applications means that there has to be something that links\
    \ the two together. When creating Angular applications, **services are the glue\
    \ between frontend and backend**.\n\nServices are the way we contact an API, get\
    \ data back, and pass it to our controllers. The controller then passes that information\
    \ to our views.\n\nWe will be using the [$http](https://docs.angularjs.org/api/ng/service/$http)\
    \ service to make requests. This means we can hook Angular to any API. It doesn’t\
    \ matter if we have a Node API, PHP API, or any other language. Angular can talk\
    \ to them all as long as we have a backend that allows calls and returns valid\
    \ JSON data.\n\n### Types of Angular Services\n\nThere are 3 types of Angular\
    \ services: **service**, **factory**, and **provider**. Each has its own use cases.\n\
    \n**Service**: The simplest type. Services are instantiated with the `new` keyword.\
    \ You have the ability to add properties to a service and call those properties\
    \ from within your controllers.\n\n**Factory**: The most popular type. In a Factory,\
    \ you create an object, add properties to that object, and then return it. Your\
    \ properties and functions will be available in your controllers.\n\n**Provider**:\
    \ Providers are the most complex of the services. They are the only service that\
    \ can be passed into the `config()` function to declare application-wide settings.\n\
    \nFor our purposes, we will be using **factories**. They provide a good middle\
    \ ground of functionality between services and providers.\n\n### The $http Module\n\
    \nThe [$http module](https://docs.angularjs.org/api/ng/service/$http) gives us\
    \ a way to communicate with remote HTTP servers. If you are familiar with jQuery\
    \ API calls, then you will see that the syntax is very similar.\n\nHere’s an example\
    \ call to get all users from our Node API we created earlier:\n\n```\n 1 angular.module('myApp',\
    \ [])\n 2 \n 3 // inject $http into our controller\n 4 .controller('mainController',\
    \ function($http) {\n 5 \n 6   var vm = this;\n 7 \n 8   // make an API call\n\
    \ 9   $http.get('/api/users')\n10     .then(function(data) {\n11         \n12\
    \       // bind the users we receive to vm.users\n13       vm.users = data.users;\n\
    14 \n15     });\n 16 \n17 });\n```\n"
