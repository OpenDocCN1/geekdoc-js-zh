    \ passport --save`\n\nThis is a simple and easy way to bring in the packages needed.\n\
    \n### Recap\n\nNow when we want to start up a new Node project, we just need to\
    \ run two commands in the folder we want to create the project:\n\n1.  `npm init`\n\
    \n2.  Fill out the fields necessary when prompted to create your `package.json`\
    \ file.\n\n3.  `npm install express --save`\n\nJust like that we have everything\
    \ we need to set up our application!\n\nLet’s move forward and dig into using\
    \ Express and Node to set up the foundation of our MEAN stack apps.\n\n## Starting\
    \ a Node Server\n\nWe’re going to move forward and look at the ways to set up\
    \ a node HTTP server so that we can send HTML files and more to our users. In\
    \ the previous chapter, we only logged something to the console. In this chapter,\
    \ we will take what we learned a step further so that we can serve a website to\
    \ our users. We’ll be another step closer to fully-fledged web applications.\n\
    \n**Method #1: Pure Node (no Express)** This is a simple way to create our server\
    \ and we’ll just do it this way so we know how it is done with barebones Node.\
    \ After this, we will be using the Express method (method #2) exclusively.\n\n\
    **Method #2: Using Express** Since Express is one of the main four parts of the\
    \ MEAN stack, we want to use this method. And once you learn this method you’ll\
    \ probably never want to look back anyway.\n\n### Sample Application\n\nFor this\
    \ chapter’s example, we will send an HTML file to our browser using Method #1\
    \ and Method #2\\. To get started, we need a brand new folder with the following\
    \ files:\n\n*   package.json\n\n*   server.js\n\n*   index.html\n\nLike we learned\
    \ before, `package.json` will hold the configuration/packages for our project\
    \ while `server.js` will have our application setup and configuration. Our `index.html`\
