    \ Simple and easy. Now that we have our packages, let’s go ahead and use them\
    \ when we set up our API.\n\nWe’ll be looking to our `server.js` file to setup\
    \ our app since that’s the main file we declared in `package.json`.\n\n#### Setting\
    \ Up Our Server (server.js)\n\nNode will look here when starting the application\
    \ so that it will know how we want to configure our application and API.\n\nWe\
    \ will start with the bare essentials necessary to start up our application. We’ll\
