  trans: "\n就像 Bower 和 Nodemon 一样，我们将全局安装 `gulp`，以便我们可以在所有项目中都访问它。\n\n```\n1 $ npm\
    \ install -g gulp\n```\n\n我们还想在特定项目的 `devDependencies` 中安装 `gulp`。\n\n```\n1 $\
    \ npm install gulp --save-dev\n```\n\n太棒了！现在 Gulp 已经准备就绪，我们可以开始使用它了。首先，让我们之前创建的\
    \ LESS 文件编译为 CSS 文件，这样浏览器就可以使用它。\n\n### 编译 LESS\n\n我们想要做的每个任务都是一个扩展 Gulp 的 npm\
    \ 包。例如，由于我们需要编译 LESS 文件，我们还需要安装 [gulp-less](https://github.com/plus3network/gulp-less)。让我们现在就安装它。\n\
    \n```\n1 $ npm install gulp-less --save-dev\n```\n\n现在我们有了这个插件，让我们来使用它吧。像 Bower\
    \ 和 npm 一样，我们需要在文档根目录下创建一个配置文件。此文件将告诉 Gulp 在我们启动时具体要做什么。\n\n首先，我们需要在文档根目录下创建一个\
    \ `gulpfile.js`。\n\n在我们的 `gulpfile.js` 内部，让我们开始使用 LESS：\n\n```\n 1 // load the\
    \ plugins\n 2 var gulp = require('gulp');\n 3 var less = require('gulp-less');\n\
    \ 4 \n 5 // define a task called css\n 6 gulp.task('css', function() {\n 7 \n\
    \ 8 // grab the less file, process the LESS, save to style.css\n 9   return gulp.src('public/assets/css/style.less')\n\
    10     .pipe(less())\n11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n\
    ```\n\n恭喜！你刚刚完成了第一个 Gulp 任务！现在我们只需要回到命令行并输入：\n\n```\n1 $ gulp css\n```\n\n这告诉\
    \ Gulp 运行特定任务，然后我们可以看到新的 `style.css` 文件将在我们指定的 `gulp.dest()` 文件夹中生成。\n\n![LESS\
    \ Compiled](img/19-mean-workflow----less.jpg)\n\n编译后的 LESS\n\n你可以看到 LESS 正如我们预期的那样被编译成了\
    \ CSS。\n\n![LESS vs. CSS](img/19-mean-workflow----less-to-css.jpg)\n\nLESS 对比\
    \ CSS\n\n### 压缩 CSS\n\nGulp 的强大之处在于，我们可以在一个任务中通过多个包处理一个文件（或多个文件）。让我们看看如何添加 CSS\
    \ 压缩功能，这样我们就可以有一个 `style.min.css` 用于生产环境。\n\n首先安装 [gulp-minify-css](https://www.npmjs.com/package/gulp-minify-css)\
    \ 包以及名为 [gulp-rename](https://www.npmjs.com/package/gulp-rename) 的包，以便我们可以将文件重命名为\
    \ `style.min.css`：\n\n```\n1 $ npm install gulp-minify-css gulp-rename --save-dev\n\
    ```\n\n现在我们可以将其添加到 `gulpfile.js` 并在 `css` 任务中使用它。\n\n```\n 1 // load the plugins\n\
    \ 2 var gulp      = require('gulp');\n 3 var less      = require('gulp-less');\n\
    \ 4 var minifyCSS = require('gulp-minify-css');\n 5 var rename    = require('gulp-rename');\n\
    \ 4\n \n 7 // define a task called css\n 8 gulp.task('css', function() {\n 9 \n\
    10 // grab the less file, process the LESS, save to style.css\n11   return gulp.src('public/assets/css/style.less')\n\
    12     .pipe(less())\n13     .pipe(minifyCSS())\n14     .pipe(rename({ suffix:\
    \ '.min' }))\n15     .pipe(gulp.dest('public/assets/css'));\n16 \n17 });\n```\n\
    \n现在当我们运行\n\n```\n1 $ gulp css\n```\n\n我们可以看到创建了一个新的 `style.min.css` 文件，并且它已经经过了\
    \ LESS 编译和压缩！现在我们可以进入 `index.html` 文件并添加新的新的 CSS 文件：\n\n```\n1 <link rel=\"stylesheet\"\
    \ href=\"assets/css/style.min.css\">\n```\n\n所有的颜色。漂亮吗？\n\n![Site with LESS](img/19-mean-workflow----site-with-less.jpg)\n\
    \n带有 LESS 的站点\n\n### 使用 Gulp 包\n\n使用 Gulp 包的过程与我们刚刚处理 LESS 的过程类似。\n\n1. 安装包并使用\
    \ `--save-dev`。\n2. 在你的 `gulpfile.js` 中加载插件。\n3. 配置任务并使用插件！\n\nGulp 的配置比 Grunt\
    \ 容易，但概念是相同的：安装包、加载它、然后配置。让我们转向处理 JS 的其他重要任务。\n\n### JS 检查\n\n确保我们的 JS 文件没有错误。这包括我们的\
    \ Node 和 Angular 文件。我们将使用一个名为 [gulp-jshint](https://www.npmjs.com/package/gulp-jshint)\
    \ 的 JSHint 插件来完成此任务。\n\n让我们安装这个新包：\n\n```\n1 $ npm install gulp-jshint --save-dev\n\
    ```\n\n现在将其引入我们的 `gulpfile.js` 并创建一个任务。\n\n```\n 1 // load the plugins\n 2 var\
    \ gulp = require('gulp');\n 3 var less = require('gulp-less');\n 4 \n 5 // define\
    \ a task called css\n 6 gulp.task('css', function() {\n 7 \n 8 // grab the less\
    \ file, process the LESS, save to style.css\n 9   return gulp.src('public/assets/css/style.less')\n\
    10     .pipe(less())\n11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n\
    ```\n\n### JS 的压缩与合并\n\n随着我们的应用程序开始增长，会有更多的请求会拖慢应用程序的性能。我们将使用两个包来压缩和合并（打包）我们的\
    \ JS 文件，这样我们只需要加载一个文件。\n\n### 压缩 Angular\n\n但是当压缩 Angular 文件时存在一个问题。Angular 文件必须以特定的方式声明，否则压缩过程会破坏它们。\n\
    \n#### 用于压缩的 Angular 模块声明方法\n\n到本书为止，为了简单起见，我们采用了更简单的方法来定义模块。它看起来如下：\n\n"
- fmt: "\n```javascript\nangular.module('myApp', ['ngRoute'])\n.config(function($routeProvider,\
    \ $locationProvider) {\n  // stuff here\n})\n.controller('mainController', function($http)\
    \ {\n  // stuff here  \n});\n```\n\nThe way to declare Angular modules for minification\
    \ is the following:\n\n```javascript\nangular.module('myApp', ['ngRoute'])\n.config([\n\
    \  '$routeProvider', \n  '$locationProvider', \n  function($routeProvider, $locationProvider)\
    \ {\n    // stuff here\n  }\n])\n.controller('mainController', ['$routeProvider',\
    \ function($http) {\n  // stuff here  \n]);\n```\n\nFeel free to use the above\
    \ code and declare modules this way from now on, even though that syntax is annoying\
    \ to write. There is however another way to minify your Angular files that involves\
    \ Gulp and another Gulp package.\n\n## Using Gulp to Prepare Minifying Angular\n\
    \nGulp has a package for this specific purpose called [gulp-ng-annotate](https://www.npmjs.com/package/gulp-ng-annotate).\n\
    \nLet’s go ahead and install the package:\n\n```bash\n$ npm install gulp-ng-annotate\
    \ --save-dev\n```\n\nNow we can use the package in our `gulpfile.js` and create\
    \ a new task:\n\n```javascript\nvar ngAnnotate = require('gulp-ng-annotate');\n\
    \n// task to lint, minify, and concat frontend angular files\ngulp.task('angular',\
    \ function() {\n  return gulp.src(['public/app/*.js', 'public/app/**/*.js'])\n\
    \    .pipe(jshint())\n    .pipe(jshint.reporter('default'))\n    .pipe(ngAnnotate())\n\
    \    .pipe(concat('app.js'))\n    .pipe(uglify())\n    .pipe(gulp.dest('public/dist'));\n\
    });\n```\n\nNow can run:\n\n```bash\n$ gulp angular\n```\n\nAnd we will see our\
    \ new `app.js` created with the right versions of our Angular files.\n\n![ng-annotate](images/19-mean-workflow----ng-annotate.jpg)\n\
    \nng-annotate\n\n## Watching for Changes\n\nNext up, we will automate Gulp so\
    \ that we don’t have to go into the command line every time we make a file change\
    \ and type `gulp <task_name>`.\n\nThe task to watch files is built into Gulp so\
    \ there’s no need to install a package here. It is important to note however that\
    \ there is a package out there that is used for more complex setups where there\
    \ are many files to watch; that package is called [gulp-watch](https://www.npmjs.com/package/gulp-watch).\n\
    \nLet’s go into our `gulpfile.js` and set it to watch specific files. We will\
    \ also tell Gulp what tasks to run when a file change has been detected.\n\n```javascript\n\
    gulp.task('watch', function() {\n  // watch the less file and run the css task\n\
    \  gulp.watch('public/assets/css/style.less', ['css']);\n\n  // watch js files\
    \ and run lint and run js and angular tasks\n  gulp.watch(['server.js', 'public/app/*.js',\
    \ 'public/app/**/*.js'], ['js', 'angular']);\n});\n```\n\nWe have defined a CSS\
    \ file to watch, and the task to run (which we created earlier). Now when we update\
    \ our `style.less` file, we can see Gulp go ahead and update the new `style.min.css`.\n\
    \n![Gulp Watch](images/19-mean-workflow----gulp-watch.jpg)\n\nGulp Watch\n\nSuper\
    \ fast!\n\n## Starting a Node Server\n\nWe can also use Gulp to start our server.\
    \ It will just use nodemon but, it’s kind of cool to just start up our entire\
    \ application by typing one command: `gulp`.\n\nThe package needed here is [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon).\
    \ Let’s install:\n\n```bash\n$ npm install gulp-nodemon --save-dev\n```\n\nTo\
    \ configure this package is a little different then we’re used to. We will have\
    \ to define a few things like starting file (`server.js`), types of files to watch\
    \ (`js less html`), and the tasks to run.\n\n```javascript\nvar nodemon = require('gulp-nodemon');\n\
    \n// the nodemon task\ngulp.task('nodemon', function() {\n  nodemon({\n    script:\
    \ 'server.js',\n    ext: 'js less html'\n  })\n    .on('start', ['watch'])\n \
    \   .on('change', ['watch'])\n    .on('restart', function() {\n      console.log('Restarted!');\n\
    \    });\n});\n\n// defining the main gulp task\ngulp.task('default', ['nodemon']);\n\
    ```\n\nNotice how we defined the files to start with and the extensions to watch\
    \ for. We also defined the tasks (`watch` in this case) to work on server start\
    \ and change.\n\nWe are also defining a task called `default` which is the task\
    \ that Gulp automatically looks for at first.\n\nNow we can run our task with:\n\
    \n```bash\n$ gulp\n```\n\nWe can see our server start and Gulp watching for any\
    \ files. When a file is changed, Gulp will run the right tasks and then restart\
    \ the server!\n\n![Gulp Nodemon](images/19-mean-workflow----nodemon.jpg)\n\nGulp\
    \ Nodemon\n\nAll of our great development tools are now bundled into this one\
    \ `gulpfile.js` and we are more efficient developers! There are many more great\
    \ Gulp plugins to look through, so have fun experimenting with other plugins like\
    \ [imagemin](https://www.npmjs.com/package/gulp-imagemin) and [clean](https://www.npmjs.com/package/gulp-clean).\n"
