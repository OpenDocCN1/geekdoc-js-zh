    The foundation of our Angular application will require 5 files:\n\n*   public/app/controllers/mainCtrl.js\n\
    \n*   public/app/app.js\n\n*   public/app/app.routes.js\n\n*   public/app/views/index.html\n\
    \n*   public/app/views/pages/home.html\n\nAll of these files will work together\
    \ to produce the home page of our application. Since the home page doesn’t require\
    \ authentication, we won’t need to use the `authService.js` just yet.\n\nThis\
    \ is what our home page will look like:\n\n![Home Page](images/17-user-crm----user-crm-home.jpg)\n\
    \nHome Page\n\nLet’s get started creating our files.\n\n**app/app.js**\n\n```\n\
    1 angular.module('userApp', [\n2   'ngAnimate',\n3   'app.routes', \n4   'authService',\
    \ \n5   'mainCtrl', \n6   'userCtrl', \n7   'userService'\n8 ]);\n```\n\nThis\
    \ is a high level overview of our entire application. We are bringing in:\n\n\
    *   **ngAnimate** to add animations to all of our Angular directives (specifically\
    \ ngShow/ngHide)\n\n*   **app.routes** will be the routing for our application\n\
    \n*   **authService** is the service file created in chapter 16\n\n*   **mainCtrl**\
    \ will be a brand new controller we create that will encompass our main view\n\
    \n*   **userCtrl** will have the controllers for all our user management pages\n\
    \n*   **userService** is the service file created in chapter 15\n\n#### Routes\n\
    \nWe will start with our route file. For now, we are only adding the first route\
    \ for our home page.\n\n**public/app.routes.js**\n\n```\n 1 angular.module('app.routes',\
    \ ['ngRoute'])\n 2 \n 3 .config(function($routeProvider, $locationProvider) {\n\
    \ 4 \n 5   $routeProvider\n 6 \n 7     // home page route\n 8     .when('/', {\n\
    \ 9       templateUrl : 'app/views/pages/home.html'\n10     });\n11 \n12   //\
    \ get rid of the hash in the URL\n13   $locationProvider.html5Mode(true);\n14\
    \ \n15 });\n```\n\nThis is enough to produce our homepage. Now let’s move on to\
    \ the main controller.\n\n#### Controller\n\n**public/app/controllers/mainCtrl.js**\n\
    \n```\n 1 angular.module('mainCtrl', [])\n 2 \n 3 .controller('mainController',\
    \ function($rootScope, $location, Auth) {\n 4   \n 5   var vm = this;\n 6 \n 7\
    \   // get info if a person is logged in\n 8   vm.loggedIn = Auth.isLoggedIn();\n\
    \ 9 \n10   // check to see if a user is logged in on every request\n11   $rootScope.$on('$routeChangeStart',\
    \ function() {\n12     vm.loggedIn = Auth.isLoggedIn();\n13 \n14     // get user\
    \ information on route change\n15     Auth.getUser()\n16       .success(function(data)\
    \ {\n17         vm.user = data;\n18       });\n19   });  \n20 \n21   // function\
    \ to handle login form\n22   vm.doLogin = function() {\n23 \n24     // call the\
    \ Auth.login() function\n25     Auth.login(vm.loginData.username, vm.loginData.password)\n\
    26       .success(function(data) {\n27 \n28         // if a user successfully\
    \ logs in, redirect to users page\n29         $location.path('/users');\n30  \
    \     });\n31   };\n32 \n33   // function to handle logging out\n34   vm.doLogout\
    \ = function() {\n35     Auth.logout();\n36     // reset all user info\n37   \
    \  vm.user = {};\n38     $location.path('/login');\n39   };\n40 \n41 });\n```\n\
    \nThe `mainController` will contain some major functions for our application.\
    \ Since this controller is applied to the overall layout of our application, it\
    \ will be responsible for holding the logged in and logged out user information.\n\
    \nThere are four main tasks that the `mainController` has that will be accomplished\
    \ by accessing the `Auth` service:\n\n**Checking if a user is logged in** We will\
    \ check if a user is logged in using the `Auth.isLoggedIn()` function. This will\
    \ check to see if there is a token in **localStorage**. We are also using a module\
    \ we haven’t used before called `$rootScope` to detect a route change and check\
    \ if our user is still logged in. This means that every time we visit a different\
    \ page, we will check our user’s login state.\n\n**Getting user data** Whenever\
    \ the page route is changed, we will go and grab information for the current user.\
    \ This way, we can display a message like `Hello Holly!`. This call uses the `Auth.getUser()`\
    \ function, which hits the API endpoint `http://localhost:8080/api/me`.\n\n* *\
    \ *\n\n![Tip](images/icon-heart.png \"Pro Tip\")\n\nTip\n\n#### Caching Service\
    \ Calls\n\nOn every route change, we are going to grab the user data. This is\
    \ to ensure that our user information is fresh, especially right after login.\
    \ We won’t want to make a call to the API however on every call, so there is a\
    \ way to cache that information. This can be used for any `$http` calls and can\
    \ be very useful in ensuring speed and efficiency in our application.\n\nTo cache\
    \ the `getUser()` call, we will need to open up our `AuthService.js` file.\n\n\
    All we have to do here is add to the `$http.get()` call like so:"
