    \ to a local database. This is a simple process since we don’t even need to create\
    \ the database. If we ware working with a local MongoDB, we just have to make\
    \ sure that MongoDB is started up by running the command:\n\n```\n1 $ mongod\n\
    ```\n\n#### Connecting to a MongoDB Database Using Mongoose\n\nConnecting to a\
    \ database is a very simple process. Here’s some sample code to connect to a database\
    \ in Node.\n\n```\n1 // grab the packages we need\n2 var mongoose = require('mongoose');\n\
    3 \n4 mongoose.connect('mongodb://localhost/db_name');\n```\n\nThat’s it! Once\
    \ we start saving things into our database, that database named db_name will automatically\
    \ be created.\n\nNow that we have an understanding of MongoDB and using it, let’s\
    \ implement CRUD and use MongoDB with mongooseJS inside of a Node.js application.\n\
    \nWe’re going to be building a Node.js API next.\n\n## Build a RESTful Node API\n\
    \n### What is REST?\n\nFor a little bit on RESTful APIs, take a look at this great\
    \ presentation: [Teach a Dog to REST](http://www.slideshare.net/landlessness/teach-a-dog-to-rest).\n\
    \n[RESTful APIs](http://scotch.io/bar-talk/designing-a-restful-web-api) are becoming\
    \ a standard across services on the web. It’s not enough to just build an application\
    \ now, we’re moving towards platforms that can integrate with multiple devices\
    \ and other websites.\n\nInterconnectivity is quickly becoming the name of the\
    \ game. With projects like [IFTTT](https://ifttt.com/) and [Zapier](https://zapier.com/)\
    \ gaining popularity, users have shown that they like their applications connected.\
    \ This means that all of their applications have a standard way of “talking” to\
    \ one another. IFTTT lets you set triggers and responses like “When I write a\
    \ Tweet, share it as my Facebook status”. The APIs of Twitter and Facebook allow\
    \ us to do this.\n\n![IFTTT](images/ifttt.jpg)\n\nIFTTT\n\nThe big players in\
    \ the game like Facebook and Google have their own APIs that are used across multiple\
    \ third party apps. You can even find their API Explorers where you can take their\
    \ API for a test drive and see what information you can pull from the API. For\
    \ instance, once you sign in, you can grab the data for all your friends from\
    \ the [API Explorer](https://developers.facebook.com/tools/explorer/145634995501895/?method=GET&path=me%3Ffields%3Did%2Cname&version=v2.1).\
    \ Using APIs has quickly become the standard for building applications.\n\nIt’s\
    \ not enough to have an application be standalone, you must build a website and\
    \ multiple mobile apps using the same data. If your application takes off, then\
    \ you’ll want users to be able to build third-party applications on your data.\
    \ This is where your API comes in. We’ll learn how to build one using Node so\
    \ that multiple applications can use that API and your data.\n\n### Backend Services\
    \ for our Angular Frontend\n\nIn this chapter, we’ll be looking at creating a\
    \ RESTful API using Node, Express 4 and its Router, and Mongoose to interact with\
    \ a MongoDB instance. We will also be testing our API using [Postman](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop)\
    \ in Chrome or [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
    \ in Firefox.\n\nThis will be a completely new sample application from our previous\
    \ chapters and we will be using it in a few chapters when we get to our Angular\
    \ frontend. Let’s take a look at the API we want to build and what it can do.\n\
    \n### Sample Application\n\nLet’s say we are going to build a CRM (Customer Relations\
    \ Management) tool. This would mean that we would need to be able to manage and\
    \ handle CRUD on the users in our database. Users will be the main thing we will\
    \ focus on when building this API and in a few chapters, Angular will build the\
    \ frontend views that will access our Users API.\n\nLet’s build an API that will:\n\
    \n*   Handle CRUD for an item (users)\n\n*   Have a standard URL (`http://example.com/api/users`\
    \ and `http://example.com/api/users/:user_id`)\n\n*   Use the proper HTTP verbs\
    \ to make it RESTful (`GET`, `POST`, `PUT`, and `DELETE`)\n\n*   Return JSON data\n\
    \n*   Log all requests to the console\n\n### Getting Started\n\nLet’s look at\
    \ all the files we will need to create our API. We will need to **define our Node\
    \ packages**, **start our server using Express**, **define our model**, **declare\
    \ our routes using Express**, and last but not least, **test our API**.\n\nHere\
    \ is our file structure. We won’t need many files and we’ll keep this very simple\
    \ for demonstration purposes. When moving to a production or larger application,\
    \ you’ll want to separate things out into a better structure (like having your\
    \ routes in their own file). We’ll go over file structure and best practices later\
    \ in the book.\n\n```\n1 - app/\n2 ----- models/\n3 ---------- user.js \t// our\
    \ user model\n4 - node_modules/     // created by npm. holds our dependencies/packages\n\
    5 - package.json \t\t// define all our node app and dependencies\n6 - server.js\
    \ \t\t// configure our application and create routes\n```\n\n#### Defining our\
    \ Node Packages (package.json)\n\nAs with all of our Node projects, we will define\
    \ the packages we need in `package.json`. Go ahead and create that file with these\
    \ packages.\n\n```\n 1 {\n 2   \"name\": \"node-api\",\n 3   \"main\": \"server.js\"\
    ,\n 4   \"dependencies\": {\n 5     \"morgan\": \"~1.5.0\",\n 6     \"express\"\
    : \"~4.10.3\",\n 7     \"body-parser\": \"~1.9.3\",\n 8     \"mongoose\": \"~3.8.19\"\
    ,\n 9     \"bcrypt-nodejs\": \"0.0.3\"\n10   }\n11 }\n```\n\nAs a shortcut, you\
    \ could type the following into your command line and they would add themselves\
    \ to the `package.json` file as well:\n\n`npm install express morgan mongoose\
    \ body-parser bcrypt-nodejs --save`\n\n##### What do these packages do?\n\n* \
    \  `express` is the Node framework.\n\n*   `morgan` allows us to log all requests\
    \ to the console so we can see exactly what is going on.\n\n*   `mongoose` is\
    \ the ODM we will use to communicate with our MongoDB database.\n\n*   `body-parser`\
    \ will let us pull POST content from our HTTP request so that we can do things\
    \ like create a user.\n\n*   `bcrypt-nodejs` will allow us to hash our passwords\
    \ since it is never safe to store passwords plaintext in our databases\n\n####\
    \ Install the Node Packages\n\nThis might be the easiest step. Go into the command\
    \ line in the root of your application and type:\n\n```\n1 npm install\n```\n\n\
    npm will now pull in all the packages defined into a `node_modules` folder in\
    \ our project."
