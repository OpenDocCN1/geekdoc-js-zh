    \ ' + req.name + '!');\n17 });\n```\n\nNow when we hit the **/hello/:name** route,\
    \ our route middleware will kick in and be used. We can run validations and then\
    \ we’ll pass the new variable to our `.get` route by storing it in `req` (request).\
    \ We then access it by changing `req.params.name` to `req.name` since we took\
    \ `req.params.name` and stored it into `req` in the middleware.\n\nWhen we visit\
    \ our browser at `http://localhost:1337/admin/hello/sally` we’ll see our request\
    \ logged to the console.\n\n![Express Router Parameter Middleware](images/07-node-routing----express-router-parameter-middleware.png)\n\
    \nExpress Router Parameter Middleware\n\nRoute middleware for parameters can be\
    \ used to validate data coming to your application. If you have created a RESTful\
    \ API also, you can validate a token and make sure the user is able to access\
    \ your information. All of the work we’ve done with Node so far will lead to building\
    \ a RESTful API that will become the server-side application that we talked about\
    \ Chapter 3 when we spoke about the client-server model.\n\nThe last Express router\
    \ feature that we’ll look at is how to use `app.route()` to define multiple routes\
    \ at once.\n\n#### Login Routes (app.route())\n\nWe can define our routes right\
    \ on our app. This is similar to using `app.get`, but we will use `app.route`.\
    \ `app.route` is basically a shortcut to call the Express Router. Instead of calling\
    \ `express.Router()`, we can call `app.route` and start applying our routes there.\n\
    \nUsing `app.route()` lets us define multiple actions on a single login route.\
    \ We’ll need a `GET` route to show the login form and a `POST` route to process\
    \ the login form.\n\n```\n 1 app.route('/login')\n 2 \n 3 \t// show the form (GET\
    \ http://localhost:1337/login)\n 4 \t.get(function(req, res) {\n 5 \t\tres.send('this\
    \ is the login form');\n 6 \t})\n 7 \n 8 \t// process the form (POST http://localhost:1337/login)\n\
    \ 9 \t.post(function(req, res) {\n10 \t\tconsole.log('processing');\n11 \t\tres.send('processing\
    \ the login form!');\n12 \t});\n```\n\nNow we have defined our two different actions\
    \ on our `/login` route. Simple and very clean. These are applied directly to\
    \ our main `app` object in the ‘server.js’ file, but we can also define them in\
    \ the `adminRouter` object we had earlier."
