  trans: "\n\n`heroku create` 命令会为我们的应用程序创建一个随机名称，在此例情况下，为 `fathomless-stream-3632`。这意味着我们的应用程序很快就能通过\
    \ `http://fathomless-stream-3632.herokuapp.com` 访问。\n\n这并不十分理想，所以让我们将其重命名为 `user-crm`。我们可以通过\
    \ `heroku apps` 命令查看已创建的应用。然后我们对其进行重命名。\n\n```\n1 $ heroku apps:rename user-crm\
    \ --app fathomless-stream-3632\n```\n\n如果我们想要的应用程序名称已被占用（由于我们在本书中使用 `user-crm`，所以它是被占用的），我们就必须更改名称或在末尾添加一些数字。让我们在名称末尾添加\
    \ `123`。\n\n```\n1 $ heroku apps:rename user-crm-123 --app fathomless-stream-3632\n\
    ```\n\n你也可以通过从开始就为应用程序命名来跳过所有这些重命名操作：\n\n```\n1 $ heroku create user-crm\n```\n\
    \n最终，当你想让应用程序上线时，你可能不希望人们通过 `http://xxxx.herokuapp.com` 访问。Heroku 提供了一种简单的方法，将你拥有的任何域名指向此应用程序，所以不用担心。我们将在在本章稍后重新讨论如何将域名指向我们的\
    \ Heroku 应用。\n\n![Image](img/18-mean-deployment----06-heroku-rename.jpg)\n\n图片\n\
    \n## 部署代码\n\n现在我们已经准备就绪，我们将把网站部署到 Heroku！这只需要一个简单的 git 命令。我们本质上是在把所有本地 git 仓库代码推送到由\
    \ Heroku 托管的远程仓库。\n\n```\n1 $ git push heroku master\n```\n\n这告诉 git 我们想要推送到新创建的\
    \ `heroku` 仓库和 `master` 分支（这是自动自动创建的默认 git 分支）。\n\n![Heroku Deploy](img/18-mean-deployment----07-heroku-deploy.jpg)\n\
    \nHeroku Deploy\n\n我们可以看到 Heroku 在部署我们的应用程序时会执行很多工作。它看到我们有一个基于 Node 的应用程序。然后它将通过读取我们的\
    \ `package.json` 文件来添加依赖项。它还将通过运行 `package.json` 文件中声明为 `main` 的文件来启动我们的 Node\
    \ 服务器。在我们的情况下，该文件是 `server.js`。\n\n## 确保运行一个实例\n\n我们想要确保应用程序正在运行，并且 Heroku 已为我们启动了服务器（称为\
    \ dynos）。输入以下内容进行确认：\n\n```\n1 $ heroku ps:scale web=1\n```\n\n如果我们进入仪表板，我们可以在\
    \ `Dynos` 部分看到，我们有一个 dyno，而且它是免费层级。你可以通过编辑使用的 dynos 数量来快速扩展或缩小应用程序。\n\n![Heroku\
    \ Dynos](img/18-mean-deployment----heroku-dynos.jpg)\n\nHeroku Dynos\n\n我们的应用程序现在已准备好查看了！\n\
    \n### 在浏览器中查看我们的应用程序\n\n我们终于到了自从书开始以来一直期待的部分！在浏览器中看到我们的全栈 MEAN ！\n\n如果你还记得 Heroku\
    \ 为你生成的那个疯狂的随机名称，或者你自己重命名了应用，请在浏览器中访问该地址：\n\n[`user-crm.herokuapp.com/`](https://user-crm.herokuapp.com/)\n\
    \nHeroku 还提供了一个使用命令行在浏览器中打开应用程序的快捷方式：\n\n```\n1 $ heroku open\n```\n\n这太神奇了！我们在浏览器中拥有了我们一直想要的网站。\n\
    \n### 定义特定的运行命令\n\n有时，我们可能有一个在 Heroku 接手我们的应用程序时想要运行的特定命令。这可以使用使用任务运行器来启动服务器，如\
    \ grunt 或 gulp（我们将在下一章介绍 gulp）。Heroku 会查看我们 `package.json` 文件中的 `main` 属性，如果我们定义了该属性，它还会查看\
    \ `scripts` 下的内容。\n\n还有另一种方法可以准确地告诉 Heroku 我们想要看到运行的是什么命令。你可以通过在我们的项目根目录下创建一个名为\
    \ `Procfile` 的新文件来实现。\n\n只需在你的项目根目录下创建一个 `Procfile` 并按所示定义启动命令即可：\n\n```\n1 web:\
    \ node server.js\n```\n\n这告诉 Heroku 在部署到 web 平台时，应该使用此命令来启动我们的应用程序。现在当我们执行 `git\
    \ push heroku master` 时，Heroku 将运行该特定命令，我们的网站就会上线。\n\n## 使用现有的 Heroku 应用\n\n如果你切换到另一台电脑并想要访问已经使用的\
    \ Heroku 应用，则需要采取几个步骤。这些步骤假设你是在一台新电脑上且尚未安装 Heroku。\n\n*   下载 [Heroku Toolbelt](https://toolbelt.heroku.com/)\n\
    *   登录：`heroku login`\n*   添加你的公钥：`heroku keys:add`\n*   拉取你当前的应用 `heroku git:clone\
    \ -a app-name`\n*   进行改进\n*   Git add 并 commit 你的更改\n*   推回 heroku：`git push heroku\
    \ master`\n\n通过这些简单的步骤，你可以跳转到任何电脑并立即获取你当前的项目。\n\n## 使用你自己的域名\n\nHeroku 为应用添加域名提供了非常简单的步骤。在本例中，我们假设你有一个域名\
    \ `supercool.com`。要为应用程序添加该域名，你需要完成两件事：\n\n1. 告诉 Heroku 哪些域名\n2. 配置你的 DNS 指向 Heroku\n\
    \n第一部分非常简单。我们将使用以下命令告诉 Heroku 域名：\n\n```\n1 heroku domains:add www.supercool.com\n\
    ```\n\n完成该步骤后，你可能需要一些时间才能在浏览器中访问 `www.supercool.com`。这取决于不同的注册商，但通常如下所示：\n\n|\
    \ 记录 | 名称 | 目标 |\n| --- | --- | --- |\n| CNAME | www | user-crm.herokuapp.com\
    \ |\n\n只要你遵循这些步骤，你很快就能看到它！\n\n有关更多信息，请访问 [Heroku 域名文档](https://devcenter.heroku.com/articles/custom-domains)。如果你感兴趣，它们提供了关于更多类型（通配符、子域名）的详细信息。它们还提供了针对几个注册商的说明。\n\
    \n## 总结\n\n我们终于构建了一个 MEAN 应用程序并使其上线。从本书中学到的许多技术都可以应用于不同的应用程序和用例。无论你尝试构建什么，Heroku\
    \ 都是部署应用程序/网站的快速简单方法。接下来，既然我们已经构建并部署了应用，让我们看看一些让开发过程更容易的技术。我们将研究如何使用 Gulp（任务运行器）和\
    \ Bower（前端资源管理器）。这两个工具将极大地加速我们的工作流。\n\n## MEAN 工作流工具\n\n### 应用\n\n我们需要创建一个示例 MEAN\
    \ 应用程序，以确切看到如何使用 Bower 和 Gulp 来帮助我们的工作流。\n\n这是目录结构。请创建这些文件和文件夹。\n\n```\n 1 - public/\n\
    \ 2 ----- app/\n 3 ---------- controllers/\n 4 --------------- mainCtrl.js\n 5\
    \ ---------- views/\n 6 --------------- pages/\n 7 -------------------- home.html\n\
    \ 8 --------------- index.html\n 9 ---------- app.js\n 10 ---------- app.routes.js\n\
    \ 11 ----- assets/\n 12 ---------- css/\n 13 --------------- style.less\n 14 -\
    \ server.js\n```\n\n这是一个 MEAN 项目，所以请运行：\n\n```\n1 $ npm init\n```\n\n以创建一个 `package.json`\
    \ 文件。创建此文件时，所有的默认值都是可以。\n\n现在我们需要 Express 作为依赖项，所以运行：\n\n```\n1 $ npm install\
    \ express --save\n```"
- fmt: "\nNow we have Express. Let’s go into `server.js` and start our server to serve\
    \ up our `index.html` file.\n\n```\n 1 // get our packages\n 2 var express = require('express');\n\
    \ 3 var app     = express();\n 4 var path    = require('path');\n 5 var port \
    \   = process.env.PORT || 8080;\n 6 \n 7 // configure public assets folder\n 8\
    \ app.use(express.static(__dirname + '/public'));\n 9 \n10 // route to send index.html\n\
    11 app.get('/', function(req, res) {\n12     res.sendFile(path.join(__dirname\
    \ + '/public/app/views/index.html'));\n13 });\n14 \n15 // start the server\n16\
    \ app.listen(port);\n17 console.log('Magic happens on http://localhost:' + port);\n\
    ```\n\nThis is a very simple file, and all we need to do is grab our dependencies\
    \ and serve up our `index.html` file before we start the server.\n\nLet’s quickly\
    \ wire up the rest of our pages:\n\n#### `public/app/controllers/mainCtrl.js`\n\
    \n```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainController', function()\
    \ {\n4 \n5   var vm = this;\n6     \n7   vm.message = 'this is my message!';\n\
    8   \n9 });\n```\n\n#### `public/app/views/pages/home.html`\n\n```\n1 Home Page!\n\
    ```\n\n#### `public/app/views/index.html`\n\n```\n 1 <!DOCTYPE html>\n 2 <html\
    \ lang=\"en\">\n 3 <head>\n 4   <meta charset=\"UTF-8\">\n 5   <title>Workflow!</title>\n\
    \ 6 \n 7   <!-- For Angular Routing -->\n 8   <base href='/'>\n 9 \n10   <!--\
    \ CSS -->\n11   <!-- load bootstrap here -->\n12   <!-- we'll load the css file\
    \ in the gulp section -->\n13 \n14   <!-- JS / LIBS -->\n15   <!-- load angular\
    \ and angular-route here -->\n16 \n17   <!-- APP -->\n18   <script src=\"app/controllers/mainCtrl.js\"\
    ></script>\n19   <script src=\"app/app.routes.js\"></script>\n20   <script src=\"\
    app/app.js\"></script>\n21 </head>\n22 <body class=\"container\" ng-app=\"myApp\"\
    \ ng-controller=\"mainController as main\">\n23 \n24   <div class=\"jumbotron\
    \ text-center\">\n25     <h1>{{ main.message }}</h1>\n26   </div>\n27 \n28   <div\
    \ ng-view></div>\n29   \n30 </body>\n31 </html>\n```\n\n#### `public/app/app.js`\n\
    \n```\n1 angular.module('myApp', ['app.routes', 'mainCtrl']);\n```\n\n#### `public/app/app.routes.js`\n\
    \n```\n 1 angular.module('app.routes', ['ngRoute'])\n 2 \n3 .config(function($routeProvider,\
    \ $locationProvider) {\n4 \n5   $routeProvider\n 6     .when('/', {\n 7      \
    \ templateUrl: 'app/views/pages/home.html',\n 8       controller: 'mainController',\n\
    9       controllerAs: 'main'\n10     });\n11 \n12   $locationProvider.htmlMode(true);\n\
    13 });\n```\n\n#### `public/assets/css/style.less`\n\n```less\n1 /* VARIABLES\n\
    \ 2 ====================== */\n3 @blue: #6D0;\n4 @purple: #993399;\n5 @red: #cc3333;\n\
    6 \n7 /* MAIN\n 8 ====================== */\n9 body{ \n10   background:@blue;\n\
    11   color:@purple;\n12   border-top:5px solid @red;\n13   padding-top:0px;\n\
    14 }\n```\n\nNow we can start our server using:\n\n```\n1 nodemon server.js\n\
    ```\n\nThis app won’t do much since we haven’t grabbed Bootstrap, or Angular Route.\
    \ We’ll be using a tool called Bower to pull in those resources.\n\n### Bower\n\
    \n[Bower](http://bower.io/) is a package manager specifically used for frontend\
    \ resources. You can use `bower` to pull in any CSS/JS libraries like Bootstrap,\
    \ Angular, jQuery, Animate.css, Moment, and many more. Bower works similar to\
    \ npm. It is just a package manager after all. Just like npm uses a `package.json`\
    \ file to read all the packages it needs, away uses a `bower.json` file.\n\n####\
    \ Installing Bower\n\nWe will first need to install away. Luckily it is an npm\
    \ package so we can install it by typing the following command:\n\n```\nnpm install\
    \ -g bower\n```\n\nWe are installing away globally with `-g` so that we have access\
    \ to it anywhere on our system. Let’s create a `bower.json` file by using init\
    \ command away. We’ll just stick to all defaults. Run the following:\n\n```\n\
    bower init\n```\n\nNow that we have away and our `bower.json` file, we will be\
    \ able to search for and install packages.\n\n#### Installing a Package\n\n```\n\
    bower install <package_name> --save\n```\n\nJust like npm, if we add the `--save`\
    \ modifier, this package will be saved to our `bower.json` file. Let’s install\
    \ Bootstrap and see how that works.\n\n```\nbower install bootstrap\n```\n\nWe\
    \ can now see that a new folder was called `bower_components`. By default, away\
    \ will place packages here. Other installation methods: You can also install a\
    \ package based on its GitHub URL. Just type `bower install <github-url>`.\n\n\
    #### Searching for Packages\n\nThere are two ways to search for a package. With\
    \ away installed, you are able to search from the command line.\n\n```\nbower\
    \ search <package_name>\n```\n\nThis can be tedious and doesn’t really offer the\
    \ best interface when there are a lot of results (try running `bower search angular`\
    \ to see a list). The easier method of searching for packages is through the Bower\
    \ website. They offer their list of resources available for searching right from\
    \ their site. [Search Packages on Bower’s Site](http://bower.io/search)\n\n####\
    \ Specifying A Directory\n\nBy default Bower will place all resources in the root\
    \ directory in a folder called `bower_components`. This isn’t the most ideal place\
    \ to put our files since we have already decided that all files that are associated\
    \ with the frontend of our applications will be placed in the `public/` folder.\
    \ Let’s change the default away folder to `public/assets/libs`. This can be done\
    \ by creating a new file in the root of our project. This file will be called\
    \ `.bowerrc` and is a very simple file to create. Here’s our `.bowerrc` file to\
    \ move the `bower_components` folder.\n\n```\n{\n  \"directory\": \"public/assets/libs\"\
    \n}\n```\n\nNow our files will be placed in the folder we just specified and we\
    \ are able to keep our root directly cleaner.\n\n#### Using a Package\n\nLet’s\
    \ install all the package that we’ll need for one of our usual MEAN stack applications.\
    \ Run the following command:\n\n```\nbower install bootstrap angular-route angular-animate\
    \ --save\n```\n\nOnce we have the package in our project, we just need to link\
    \ the right files. By clicking through your new `public/assets/libs` folder, you\
    \ will be able to determine exactly which file you want.\n\n```\n<head>\n  <meta\
    \ charset=\"UTF-8\">\n  <title>Workflow!</title>\n  \n  <!-- CSS -->\n  <link\
    \ rel=\"stylesheet\" href=\"assets/libs/bootstrap/dist/css/bootstrap.min.css\"\
    >\n  \n  <!-- JS / LIBS -->\n  <script src=\"assets/libs/angular/angular.min.js\"\
    ></script>\n  <script src=\"assets/libs/angular-route/angular-route.min.js\"></script>\n\
    \  <script src=\"assets/libs/angular-animate/angular-animate.min.js\"></script>\n\
    \  \n  <!-- APP -->\n  <script src=\"app/controllers/mainCtrl.js\"></script>\n\
    \  <script src=\"app/app.routes.js\"></script>\n  <script src=\"app/app.js\"></script>\n\
    </head>\n```\n"
  raw: "Now we have Express. Let’s go into `server.js` and start our server to serve\
    \ up our `index.html` file.\n\n```\n 1 // get our packages\n 2 var express = require('express');\n\
    \ 3 var app     = express();\n 4 var path    = require('path');\n 5 var port \
    \   = process.env.PORT || 8080;\n 6 \n 7 // configure public assets folder\n 8\
    \ app.use(express.static(__dirname + '/public'));\n 9 \n10 // route to send index.html\n\
    11 app.get('/', function(req, res) {\n12     res.sendFile(path.join(__dirname\
    \ + '/public/app/views/index.html'));\n13 });\n14 \n15 // start the server\n16\
    \ app.listen(port);\n17 console.log('Magic happens on http://localhost:' + port);\n\
    ```\n\nThis is a very simple file, and all we need to do is grab our dependencies\
    \ and serve up our `index.html` file before we start the server.\n\nLet’s quickly\
    \ wire up the rest of our pages:\n\n**public/app/controllers/mainCtrl.js**\n\n\
    ```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainController', function()\
    \ {\n4 \n5   var vm = this;\n6     \n7   vm.message = 'this is my message!';\n\
    8   \n9 });\n```\n\n**public/app/views/pages/home.html**\n\n```\n1 Home Page!\n\
    ```\n\n**public/app/views/index.html**\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"\
    en\">\n 3 <head>\n 4   <meta charset=\"UTF-8\">\n 5   <title>Workflow!</title>\n\
    \ 6 \n 7   <!-- For Angular Routing -->\n 8   <base href='/'>\n 9 \n10   <!--\
    \ CSS -->\n11   <!-- load bootstrap here -->\n12   <!-- we'll load the css file\
    \ in the gulp section -->\n13 \n14   <!-- JS / LIBS -->\n15   <!-- load angular\
    \ and angular-route here -->\n16 \n17   <!-- APP -->\n18   <script src=\"app/controllers/mainCtrl.js\"\
    ></script>\n19   <script src=\"app/app.routes.js\"></script>\n20   <script src=\"\
    app/app.js\"></script>\n21 </head>\n22 <body class=\"container\" ng-app=\"myApp\"\
    \ ng-controller=\"mainController as main\">\n23 \n24   <div class=\"jumbotron\
    \ text-center\">\n25     <h1>{{ main.message }}</h1>\n26   </div>\n27 \n28   <div\
    \ ng-view></div>\n29   \n30 </body>\n31 </html>\n```\n\n**public/app/app.js**\n\
    \n```\n1 angular.module('myApp', ['app.routes', 'mainCtrl']);\n```\n\n**public/app/app.routes.js**\n\
    \n```\n 1 angular.module('app.routes', ['ngRoute'])\n 2 \n 3 .config(function($routeProvider,\
    \ $locationProvider) {\n 4 \n 5   $routeProvider\n 6 \n 7     .when('/', {\n 8\
    \       templateUrl : 'app/views/pages/home.html',\n 9       controller  : 'mainController',\n\
    10       controllerAs: 'main'\n11     });\n12 \n13   $locationProvider.html5Mode(true);\n\
    14 });\n```\n\n**public/assets/css/style.less**\n\n```\n 1 /* VARIABLES\n 2 ======================\
    \ */\n 3 @blue: #A6D0C7;\n 4 @purple: #993399;\n 5 @red: #cc3333;\n 6 \n 7 /*\
    \ MAIN\n 8 ====================== */\n 9 body  { \n10   background:@blue; \n11\
    \   color:@purple;\n12   border-top:20px solid @red;\n13   padding-top:50px;\n\
    14 }\n```\n\nNow we can start our server using:\n\n```\n1 $ nodemon server.js\n\
    ```\n\nThis app won’t do much since we haven’t grabbed Bootstrap, Angular, or\
    \ Angular Route. We’ll be using a tool called Bower to pull in those resources\
    \ now.\n\n### Bower\n\n[Bower](http://bower.io/) is a package manager specifically\
    \ used for frontend resources. You can use bower to pull in any CSS/JS libraries\
    \ like Bootstrap, Angular, jQuery, Animate.css, Moment, and so many more.\n\n\
    Bower works very similar to npm. It is just a package manager after all. Just\
    \ like npm uses a `package.json` file to read all of the packages that it needs\
    \ to go and grab, bower uses a `bower.json` file.\n\n#### Installing Bower\n\n\
    We will first need to install bower to use it. Luckily it is an npm package so\
    \ we can install it by typing the following command:\n\n```\n1 $ npm install -g\
    \ bower\n```\n\nWe are installing bower globally with `-g` so that we have access\
    \ to it anywhere on our system.\n\nLet’s create a `bower.json` file by using the\
    \ init command bower provides. We’ll just stick to all the defaults. Run the following:\n\
    \n```\n1 $ bower init\n```\n\nNow that we have bower and our `bower.json` file,\
    \ we will be able to search for and install packages.\n\n#### Installing a Package\n\
    \n```\n1 $ bower install <package_name> --save\n```\n\nJust like npm, if we add\
    \ the `--save` modifier, this package will be saved to our `bower.json` file.\n\
    \nLet’s install Bootstrap and see how that works.\n\n```\n1 $ bower install bootstrap\n\
    ```\n\nWe can now see that a new folder was created called **bower_components**.\
    \ By default, bower will place packages here.\n\n**Other installation methods**:\
    \ You can also install a package based on its GitHub URL. Just type `bower install\
    \ <github-url>`.\n\n#### Searching for Packages\n\nThere are two ways to search\
    \ for a package. With bower installed, you are able to search from the command\
    \ line.\n\n```\n1 $ bower search <package_name>\n```\n\nThis can be tedious and\
    \ doesn’t really offer the best interface especially when there are a lot of results\
    \ (try running `bower search angular`) to see a giant list.\n\nThe easier method\
    \ of searching for packages is through the Bower website. They offer their list\
    \ of resources available for searching right from their site.\n\n[Search Packages\
    \ on Bower’s Site](http://bower.io/search)\n\n#### Specifying A Directory\n\n\
    By default Bower will place all resources in the root directory in a folder called\
    \ **bower_components**. This isn’t the most ideal place to put our files since\
    \ we have already decided that all files that are associated with the frontend\
    \ of our applications will be placed in the **public/** folder.\n\nLet’s change\
    \ the default bower folder to **public/assets/libs**. This can be done by creating\
    \ a new file in the root of our project. This file will be called `.bowerrc` and\
    \ is a very simple file to create.\n\nHere’s our `.bowerrc` file to move the `bower_components`\
    \ folder.\n\n```\n1 {\n2   \"directory\": \"public/assets/libs\"\n3 }\n```\n\n\
    Now our files will be placed in the folder we just specified and we are able to\
    \ keep our root directly cleaner.\n\n#### Using a Package\n\nLet’s install all\
    \ the package that we’ll need for one of our usual MEAN stack applications. Run\
    \ the following command:\n\n```\n1 $ bower install bootstrap angular angular-route\
    \ angular-animate --save\n```\n\nOnce we have the package in our project, we just\
    \ need to link to the right files. By clicking through your new **public/assets/libs**\
    \ folder, you will be able to determine exactly which file you want.\n\n```\n\
    \ 1 <head>\n 2   <meta charset=\"UTF-8\">\n 3   <title>Workflow!</title>\n 4 \n\
    \ 5   <!-- CSS -->\n 6   <link rel=\"stylesheet\" href=\"assets/libs/bootstrap/dist/css/bootstrap.min.css\"\
    >\n 7 \n 8   <!-- JS / LIBS -->\n 9   <script src=\"assets/libs/angular/angular.min.js\"\
    ></script>\n10   <script src=\"assets/libs/angular-route/angular-route.min.js\"\
    ></script>\n11   <script src=\"assets/libs/angular-animate/angular-animate.min.js\"\
    ></script>\n12 \n13   <!-- APP -->\n14   <script src=\"app/controllers/mainCtrl.js\"\
    ></script>\n15   <script src=\"app/app.routes.js\"></script>\n16   <script src=\"\
    app/app.js\"></script>\n17 </head>\n```\n\nNow we can see our application in our\
    \ browser after we start our server using:\n\n```\n1 $ nodemon server.js\n```\n\
    \nYou can start to see how your workflow becomes much faster. You’ll just need\
    \ to run two commands (`bower init` and `bower install <package_name> --save`)\
    \ and then you have all the assets you need.\n\nThis allows for a much cleaner\
    \ process than going through and finding the assets online, downloading, linking,\
    \ and all that mess. Also, like npm, having your dependencies defined in one file\
    \ lets other developers know exactly what is needed for the current project.\n\
    \n### Gulp\n\nYou may have heard of the task runner Grunt. [Gulp](https://github.com/gulpjs/gulp/blob/master/docs/getting-started.md)\
    \ is the newer kid on the block, but it improves on Grunt in a few ways, the most\
    \ important being a much simpler syntax for configuration.\n\nSo what exactly\
    \ is a task runner? A task runner like Gulp is able to help automate any tasks\
    \ you may have in your development process. This could include things like:\n\n\
    *   linting files (checking them for errors)\n\n*   minifying files\n\n*   process\
    \ LESS or SCSS\n\n*   concatenating multiple files into one\n\n*   Gulp can even\
    \ start our nodemon server for us\n\n*   so much more…\n\n#### Installing Gulp"
