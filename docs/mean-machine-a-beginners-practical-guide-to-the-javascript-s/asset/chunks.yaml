    \ = function(password) {\n32 \tvar user = this;\n33 \n34 \treturn bcrypt.compareSync(password,\
    \ user.password);\n35 };\n36 \n37 // return the model\n38 module.exports = mongoose.model('User',\
    \ UserSchema);\n```\n\n这里发生了很多操作，但它非常简单。我们必须创建自己的 Schema（模式）。我们把 `name`、`username`\
    \ 和 `password` 定义为 `Strings`（字符串）。通过设置 `index` 和 `unique` 属性，我们正在告诉 Mongoose 为此路径创建一个唯一索引。这意味着用户名不能重复。我们将实现的另一个\
    \ Mongoose 特性是在密码属性上设置 `select: false`。当我们查询用户列表或单个用户时，将不需要提供密码。通过将 `select` 设置为\
    \ `false`，在列出我们的用户时不会返回密码，除非显式调用它。\n\n我们还使用 `pre` 创建了一个函数，该函数将确保在保存用户之前对密码进行哈希处理。\n\
    \n> 确保我们没有将明文密码保存到数据库是非常重要的。我们必须确保我们的应用程序从开始就尽可能安全。\n\n通过 mongoose，我们还在用户模型上创建了一个方法，将密码与给定的哈希值进行比较。这就是我们将在第\
    \ 10 章中验证用户的方法。\n\n创建该文件后，让我们将其引入 `server.js` 中，这样我们就可以在应用程序中使用它。我们将在该文件中添加额外行，并像之前一样使用\
    \ `require` 来引入功能。\n\n```javascript\n1 // server.js\n2 \n3 // BASE SETUP\n4 //\
    \ ==========================\n5 \n6 var User     = require('./app/models/user');\n\
    ```\n\n现在我们的整个应用程序已准备就绪并连接好了，我们可以开始构建我们的路由了。这些路由将定义我们的 API，这也是本章存在的主要原因。继续吧！\n\
    \n### Express Router 和路由\n\n我们将使用 Express Router 的实例来处理所有的 API 路由。下面是我们将需要的路由概述、它们的功能以及访问它们时所使用的\
    \ HTTP 动词（Verb）。\n\n| /api/users | `GET` | 获取所有用户 |\n| --- | --- | --- |\n| /api/users\
    \ | `POST` | 创建用户 |\n| /api/users/:user_id | `GET` | 获取单个用户 |\n| /api/users/:user_id\
    \ | `PUT` | 使用新信息更新用户 |\n| /api/users/:user_id | `DELETE` | 删除用户 |\n\n这将涵盖 API\
    \ 所需的基础路由。这同时也符合良好的格式，我们将我们需要执行的操作（`GET`、`POST`、`PUT` 和 `DELETE`）保持为 HTTP 动词。\n\
    \n### 路由中间件 (Route Middleware)\n\n我们已经定义了第一个路由并看到了它的运行情况。Express Router 为我们定义路由提供了很大的灵活性。\n\
    \n我们在 Node 路由章节中讨论过路由中间件。对于这个示例，我们只是将通过 `console.log()` 将请求打印到控制台。现在让我们将该中间件添加到我们的\
    \ `server.js` 文件中。\n\n```javascript\n 1 // ROUTES FOR OUR API\n 2 // =============================\n\
    \ 3 var apiRouter = express.Router(); \t// get an instance of the express Router\n\
    \ 4 \n 5 // middleware to use for all requests\n 6 apiRouter.use(function(req,\
    \ res, next) {\n 7 \t// do logging\n 8 \tconsole.log('Somebody just came to our\
    \ app!');\n 9 \n10 \t// 我们将在第 10 章在中间件中添加更多内容\n11 \t// 我们将在这里验证用户\n12 \n13 \t\
    next(); // 确保我们进入下一个路由而不是在这里停止\n14 });\n15 \n16 // test route to make sure everything\
    \ is working \n17 // (accessed at GET http://localhost:8080/api)\n18 apiRouter.get('/',\
    \ function(req, res) {\n19 \tres.send('Everything is working!');\n20 });\n21 \n\
    22 // REGISTER ROUTES\n23 // ---------------\n24 app.use('/api', apiRouter);\n\
    ```\n\n### 创建基础路由\n\n我们现在为应用程序创建路由。我们将使用 Express 的 `apiRouter.route()` 来处理同一路径的多个路由。\n\
    \n#### 创建用户 POST (/api/users)\n\n我们将添加新路由来处理 POST。\n\n```javascript\n 1 // ROUTES\
    \ FOR OUR API\n 2 // ===============================\n 3 \n 4 // 路由中间件和第一个路由\n\
    \ 5 \n 6 // 以 /users 结尾的路由\n 7 // --------------------\n 8 apiRouter.route('/users')\n\
    \ 9\n10 \t// 创建用户（访问 POST http://localhost:8080/api/users）\n11 \t.post(function(req,\
    \ res) {\n12 \t\t\n13 \t\t// 创建 User 模型的新实例\n14 \t\tvar user = new User(); \t\t\
    \n15 \n16 \t\t// 设置用户信息（来自请求）\n17 \t\tuser.name = req.body.name;  \n18 \t\tuser.username\
    \ = req.body.username;\n19 \t\tuser.password = req.body.password;\n20 \n21 \t\t\
    // 保存用户并检查错误\n22 \t\tuser.save(function(err) {\n23               if (err) {\n\
    24                 // 重复条目\n25                 if (err.code == 11000) \n26   \
    \                  return res.json({ success: false, message: '该用户名已存在用户。' });\n\
    27                 else \n28                     return res.send(err);\n29   \
    \          }\n30 \n31 \t\t\tres.json({ message: 'User created!' });\n32 \t\t});\n\
    33 \t\t\n34 \t})\n```\n\n"
- fmt: "\nWe get back a successful message that our user has been created. Let’s handle\
    \ the API route to get all the users so that we can see the user that just came\
    \ into existence.\n\nIf the username was already used, `mongoose` will spit out\
    \ an error code of `11000`. We are going to check for that error code if there\
    \ is an error and return the message that `'A user with that username already\
    \ exists.`.\n\n![Duplicate User](images/09-restful-api----duplicate-user.jpg)\n\
    \nDuplicate User\n\n## Getting All Users (GET /api/users)\n\nThis will be a simple\
    \ route that we will add to `server.js` onto the `router.route('/users')` we created\
    \ for the POST. With `router.route()`, we are able to chain together the different\
    \ routes using different HTTP actions. This keeps our application clean and organized.\n\
    \n```\n 1 // <-- route middleware and first route are here\n 2 \n 3 // on routes\
    \ that end in /users\n 4 // ----------------------------------------------------\n\
    \ 5 apiRouter.route('/users')\n 6 \n 7\t// create a user (accessed at POST http://localhost:8080/api/users)\n\
    \ 8\t.post(function(req, res) {\n 9\t\t...\t\t\t\n10 \t})\n11 \n12\t// get all\
    \ the users (accessed at GET http://localhost:8080/api/users)\n13\t.get(function(req,\
    \ res) {\n14 \t\tUser.find(function(err, users) {\n15 \t\t\tif (err) res.send(err);\n\
    16 \n17 // return the users\n18 \t\t\tres.json(users);\n19 \t\t});\n20 \t});\n\
    ```\n\nStraightforward route. Just send a `GET` request to `http://localhost:8080/api/users`\
    \ and we’ll get all the users back in JSON format.\n\n![Node API Postman GET All](images/09-restful-api----get-after-create.jpg)\n\
    \nNode API Postman GET All\n\nWe can see that Holly is in our database and her\
    \ password has even been hashed thanks to `bcrypt` and that function that we created\
    \ that works whenever we save a user to the database. Remember that `_id` that\
    \ was automatically generated for Holly here. We will use it when we create the\
    \ route to get a single user.\n\n### Creating Routes for a Single Item\n\nWe’ve\
    \ handled the group for routes ending in `/users`. Let’s now handle the routes\
    \ for when we pass in a parameter like a user’s id.\n\nThe things we’ll want to\
    \ do for this route, which will end in `/users/:user_id` will be:\n\n* Get a single\
    \ user.\n* Update a user’s info.\n* Delete a user.\n* The `:user_id` from the\
    \ request will be accessed thanks to that `body-parser` package we called earlier.\n\
    \n## Getting a Single User (GET /api/users/:user_id)\n\nWe’ll add another `apiRouter.route()`\
    \ to handle all requests that have a `:user_id` attached to them. Again, drop\
    \ it into your `server.js` file after the `apiRouter.route('/users')` chunk.\n\
    \n```\n 1 // on routes that end in /users/:user_id\n 2 // ----------------------------------------------------\n\
    \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// get the user with that id\
    \ \n 6\t// (accessed at GET http://localhost:8080/api/users/:user_id)\n 7\t.get(function(req,\
    \ res) {\n 8\t\tUser.findById(req.params.user_id, function(err, user) {\n 9\t\t\
    \tif (err) res.send(err);\n10 \n11\t\t\t// return that user\n12 \t\t\tres.json(user);\n\
    13 \t\t});\n14 \t})\n```\n\nFrom our call to get all the users, we can a list\
    \ of all of our users, each with a unique id. Let’s grab one of those ids and\
    \ test it with Postman.\n\nEnter `http://localhost:8080/api/users/5481e26e93b9bba7171bfd5e`,\
    \ select `GET` and hit send.\n\nAnd this will return our pretty user data. Easy\
    \ peezy!\n\n```\n1 {\n2     \"password\": \"$2a$10$rgraupzsDZHbY77CQSInHuZ90RWvq/NWsi0kOueePetqUBvj2.jKa\"\
    ,\n3     \"username\": \"chris\",\n4     \"name\": \"Chris\",\n5     \"_id\":\
    \ \"5481e26e93b9bba7171bfd5e\",\n6     \"__v\": 0\n7 }\n```\n\n![Node API Postman\
    \ Get Single User](images/09-restful-api----node-api-postman-get-single.jpg)\n\
    \nNode API Postman Get Single User\n\nNow that we can grab a user from our API,\
    \ let’s look at updating a user’s name. Let’s say he wants to be more sophisticated,\
    \ so we’ll rename him from Klaus to `Sir Klaus`.\n\n## Updating a User’s Info\
    \ (PUT /api/users/:user_id)\n\nLet’s chain a route onto our `router.route()` and\
    \ add a `.put()`.\n\n```\n 1 // on routes that end in /users/:user_id\n 2 // -------------------------------------\n\
    \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// get the user with that id\
    \ \n 6\t// (accessed at GET http://localhost:8080/api/users/:user_id)\n 7\t.get(function(req,\
    \ res) {\n 8\t\t...\n 9 \t})\n10 \n11\t// update the user with this id \n12\t\
    // (accessed at PUT http://localhost:8080/api/users/:user_id)\n13\t.put(function(req,\
    \ res) {\n14 \n15\t\t// use our user model to find the user\n16\t\tUser.findById(req.params.user_id,\
    \ function(err, user) {\n17 \n18\t\t\tif (err) res.send(err);\n19 \n20\t\t\t//\
    \ update the users info only its new\n21\t\t\tif (req.body.name) user.name = req.body.name;\n\
    22\t\t\tif (req.body.username) user.username = req.body.username;\n23\t\t\tif\
    \ (req.body.password) user.password = req.body.password;\n24 \n25\t\t\t// save\
    \ the user\n26\t\t\tuser.save(function(err) {\n27\t\t\t\tif (err) res.send(err);\n\
    28 \n29\t\t\t\t// return a message\n30\t\t\t\tres.json({ message: 'User updated!'\
    \ });\n31\t\t\t});\n32 \n\t\t});\n33 \t})\n```\n\nWe will use the given `id` from\
    \ the `PUT` request, grab that user, make changes, and save him back to the database.\
    \ It’s important to note that we will only change the `name`, `username`, or `password`\
    \ in the database if it has changed.\n\n![Node API Postman Update Record](images/09-restful-api----node-api-postman-update-record.jpg)\n\
    \nNode API Postman Update Record\n\nSince we added the conditionals in our `PUT`\
    \ route, if the `username` or `password` hasn’t been passed through, those fields\
    \ won’t updated. We wouldn’t want those updated to be blanks if they weren’t passed\
    \ in.\n\nWe can also use the `GET /api/users` call we used earlier to see that\
    \ her name has changed.\n\n![Node API Postman All Updated](images/09-restful-api----node-api-postman-all-updated.jpg)\n\
    \nNode API Postman All Updated\n\nHolly’s name in the database has now been changed\
    \ from `Holly` to her full name, `Holly Lloyd`. That was all fun while it lasted.\
    \ Now let’s delete Holly.\n\n## Deleting a User (DELETE /api/users/:user_id)\n\
    \nWhen someone requests that a user is deleted, all they have to do is send a\
    \ `DELETE` to `/api/users/:user_id`.\n\nLet’s add the code for deleting users.\n\
    \n```\n 1 // on routes that end in /users/:user_id\n 2 // ----------------------------------------------------\n\
    \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// get the user with that id\
    \ \n 6\t// (accessed at GET http://localhost:8080/api/users/:user_id)\n 7\t.get(function(req,\
    \ res) {\n 8\t\t...\n 9 \t})\n10 \n11\t// update the user with this id \n12\t\
    // (accessed at PUT http://localhost:8080/api/users/:user_id)\n13\t.put(function(req,\
    \ res) {\n14\t\t...\n15 \t})\n16 \n17\t// delete the user with this id \n18\t\
    // (accessed at DELETE http://localhost:8080/api/users/:user_id)\n19\t.delete(function(req,\
    \ res) {\n20\t\tUser.remove({\n21\t\t\t_id: req.params.user_id\n22\t\t}, function(err,\
    \ user) {\n23\t\t\tif (err) return res.send(err);\n24 \n25\t\t\tres.json({ message:\
    \ 'Successfully deleted' });\n26 \t\t});\n27 \t});\n```\n\nNow when we send a\
    \ request to our API using `DELETE` with the proper `user_id`, we’ll delete our\
    \ user from existence.\n\n![Node API Postman Delete](images/09-restful-api----node-api-postman-delete.jpg)\n\
    \nNode API Postman Delete\n\nWhen we try to get all the users you should notice\
    \ that one is now missing.\n\n![Node API Get All Nothing](images/09-restful-api----node-api-postman-get-all-nothing.jpg)\n\
    \nNode API Get All Nothing\n\n### Conclusion\n\nWe now have the means to handle\
    \ CRUD on a specific resource (our beloved users) through our own API. Using the\
    \ techniques above will be a good foundation to move into building larger and\
    \ more robust APIs.\n\nThis has been a quick look at creating a Node API using\
    \ Express 4. There are many more things you can do with your own APIs. You can\
    \ add authentication, create better error messages, and add different sections\
    \ so you’re not just working with users.\n"
