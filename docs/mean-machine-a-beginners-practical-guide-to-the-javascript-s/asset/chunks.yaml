    \   \"license\": \"MIT\",\n16   \"homepage\": \"https://github.com/scotch-io/mean-machine-code\"\
    \n17 }\n```\n\nThat seems overwhelming at first, but if you take it line by line,\
    \ you can see that a lot of the attributes created here make it easier for other\
    \ developers to jump into the project. We’ll look through all these different\
    \ parts later in the book, but here’s a very simple `package.json` with only the\
    \ required parts.\n\n```\n1 {\n2   \"name\": \"mean-machine-code\",\n3   \"main\"\
    : \"server.js\"\n4 }\n```\n\nThese are the most basic required attributes.\n\n\
    **main** tells Node which file to use when we want to start our applications.\
    \ We’ll name that file `server.js` for all of our applications and that will be\
    \ where we start our applications.\n\nFor more of the attributes that can be specified\
    \ in our package.json files, here are the [package.json docs](https://www.npmjs.org/doc/files/package.json.html).\n\
    \n### Initialize Node App\n\nThe `package.json` file is how we will start every\
    \ application. It can be hard to remember exactly what goes into a package.json\
    \ file, so npm has created an easy to remember command that let’s you build out\
    \ your package.json file quickly and easily. That command is **npm init**.\n\n\
    Let’s create a sample project and test out the `npm init` command.\n\n1.  Create\
    \ a folder: `mkdir awesome-test`\n\n2.  Jump into that folder: `cd awesome-test`\n\
    \n3.  Start our Node project: `npm init`\n\nIt will give you a few options that\
    \ you can leave as default or customize as you wish. For now, you can leave everything\
    \ default except for the main (entry point) file. Ours will be called `server.js`.\n\
    \nYou can see that our new package.json file is built and we have our first Node\
    \ project!\n\n![NPM Init](images/04-getting-started----npm-init.jpg \"npm init\"\
    )\n\nNPM Init\n\nSince we have a `package.json` file now, we can go into our command\
    \ line and type `node server.js` to start up this Node app! It will just throw\
    \ an error since we haven’t created the **server.js** file that we want to use\
    \ to begin our Node application. Not very encouraging to see an error on our first\
    \ time starting a Node server! Let’s change that and make an application that\
    \ does something.\n\n### Creating a Very Simple Node App\n\nOpen up your package.json\
    \ file and delete everything except those basic requirements:\n\n```\n1   {\n\
    2     \"name\": \"awesome-test\",\n3     \"main\": \"server.js\"\n4   }\n```\n\
    \nNow we will need to create the `server.js` file. The only thing we will do here\
    \ is console.log out some information. **console.log()** is the way we dump information\
    \ to our console. We’re going to use it to send a message when we start up our\
    \ Node app.\n\nHere is our **server.js** file’s contents.\n\n```\n1 console.log('ITS\
    \ MY FIRST NODE APP! OH AND I GUESS HELLO WORLD');\n```\n\nNow we can start up\
    \ our Node application by going into our command line and typing: `node server.js`\n\
    \n![node server.js](images/05-node-start----node-server-first.jpg \"node server.js\"\
    )\n\nnode server.js\n\n### Starting a Node Application\n\nTo start a Node application,\
    \ you just go into the command line and type:\n\n`node server.js`\n\n`server.js`\
    \ is what we defined to be our main file in **package.json** so that’s the file\
    \ we will specify when starting. Our server will now be stopped since all we did\
    \ was `console.log()`, but in the future, if you would like to stop your Node\
    \ server, you can just type ‘ctrl c’.\n\n* * *\n\n![Tip](images/icon-heart.png)\n\
    \nTip\n\n#### Restarting a Node Application on File Changes\n\nBy default, the\
    \ `node server.js` command will start up our application, but it **won’t restart\
    \ when file changes are made**. This can become tedious when we are developing\
    \ since we will have to shut down and restart every time we make a change.\n\n\
    Luckily there is an npm package that will watch for file changes and restart our\
    \ server when changes are detected. This package is called [nodemon](https://github.com/remy/nodemon)\
    \ and to install it, just go into your command line and type: `npm install -g\
    \ nodemon`. The `-g` modifier means that this package will be installed globally\
    \ for your system. Now, instead of using `node server.js`, we are able to use:\n\
    \n> `nodemon server.js`\n\nAgain, if you’re getting the error that nodemon command\
    \ isn’t found you’ll have to edit your PATH in environment variables. A quick\
    \ way to do this is type ‘npm config get prefix’. This will show you the path\
    \ to npm. To add this to your PATH variable type in\n\n> ‘set PATH %PATH%;c:\\\
    whateverthepathis’ where ‘whateverthepathis’ is the result of npm config get prefix\n\
    \nYou will probably have to restart your computer but after that you’re ready\
    \ to go!"
