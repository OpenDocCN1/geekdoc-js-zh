  trans: "\n让我们回到 `index.html`，并使用 `ng-app` 和 `ng-controller` 应用我们的应用和控制器。由于我们已经在文档的\
    \ `<head>` 中加载了 `app.js` 文件，我们将它们都应用到 `<body>` 标签上。\n\n```\n1 <body class=\"container\"\
    \ ng-app=\"routerApp\" ng-controller=\"mainController as main\\\n2 \">\n```\n\n\
    再次注意，当我们编写 `mainController as main` 时，我们使用的是 `controller as` 语法。我们还将在网站的 `<main>`\
    \ 区域展示我们的 `bigMessage`：\n\n```\n1 <main>\n2     <div class=\"jumbotron\">\n3 \
    \        <h1>{{ main.bigMessage }}</h1>\n4     </div>\n5 \n6     <!-- angular\
    \ templating will go here -->\n7     <!-- this is where content will be injected\
    \ -->\n8 </main>\n```\n\n现在，如果在浏览器中显示 `index.html` 文件，我们应该看到我们的消息。\n\n![Angular\
    \ 路由消息显示](img/12-angular-routing----angular-routing-message.jpg)\n\nAngular 路由消息显示\n\
    \n在我们的 `<main>` 内部，现在我们将看到我们创建的消息。由于我们已经设置好了模块和控制器，并且 JavaScript 控制台中没有错误，我们知道\
    \ Angular 正在正常工作。现在，我们将开始尝试使用此布局来显示不同的页面，而无需刷新页面。\n\n### 将页面注入到主布局中\n\n`ng-view`\
    \ 是一个 Angular 指令，它将当前路由（`/home`、`/about` 或 `/contact`）的模板包含在主布局文件中。\n\n**它是如何工作的？**\
    \ Angular 路由（`ngRoute`）会查看当前 URL，然后将该 URL 与我们指定的视图进行匹配。因此，如果我们处于 `/about` 页面，我们将告诉\
    \ `ngRoute` 获取一个特定的视图文件（在本例中为 `pages/about.html`）并将其注入到我们放置 `ng-view` 的地方。\n\n\
    我们还没有设置所需的路由规则，所以现在就向模板中添加 `ng-view`，然后继续进行路由部分。\n\n在我们网站的 `<main>` 区域内，删除消息部分并添加以下内容：\n\
    \n```\n1 <main>\n2 \n3     <!-- angular templating -->\n4     <!-- this is where\
    \ content will be injected -->\n5 \n6     <div ng-view></div>\n7 \n8 </main>\n\
    ```\n\n### 配置路由\n\n现在这对我们的网站还没有什么太大的作用。我们必须定义路由以及每个路由将使用的视图。这就是我们如何使用 Angular\
    \ 的路由功能，以便我们的页面不发生刷新。\n\nAngular 路由模块为我们提供了 `$routeProvider`(http://docs.angularjs.org/api/ngRoute.$routeProvider)\
    \ 服务，我们将通过它来配置路由。路由在 `$routeProvider` 对象上使用 `.when()` 定义。\n\n现在让我们通过创建一个新文件 `public/js/app.routes.js`\
    \ 来创建我们的路由。我们还将之前之前创建的每个控制器应用到每个页面。\n\n```\n 1 // 为我们所有的路由需求注入 ngRoute\n 2 angular.module('routerRoutes',\
    \ ['ngRoute'])\n 3 \n 4 // 配置我们的路由\n 5 .config(function($routeProvider, $locationProvider)\
    \ {\n 6     $routeProvider\n 7 \n 8         // 首页的路由\n 9         .when('/', {\n\
    110             templateUrl : 'views/pages/home.html',\n 11             controller\
    \  : 'homeController',\n 12             controllerAs: 'home'\n 13         })\n\
    \ 14 \n 15         // 关于页面的路由\n 16         .when('/about', {\n 17            \
    \ templateUrl : 'views/pages/about.html',\n 18             controller  : 'aboutController',\n\
    \ 19             controllerAs: 'about'\n 20         })\n 21 \n 22         // 联系页面的路由\n\
    \ 23         .when('/contact', {\n 24             templateUrl : 'views/pages/contact.html',\n\
    \ 25             controller  : 'contactController',\n 26             controllerAs:\
    \ 'contact'\n 27         );\n 28 \n 29     // 设置我们的应用以使用优美的 URL\n 30     $locationProvider.html5Mode(true);\n\
    \ 31 });\n```\n\n现在我们已经使用 `$routeProvider` 定义了路由。正如配置所示，你可以指定 `route`、使用的 `template\
    \ file` 甚至一个 `controller`。这样，应用程序的每个部分都将使用它们自己的视图和 Angular 控制器。\n\n我们还可以在这里定义\
    \ `controllerAs`，然后每个控制器将自动定义在我们的站点上。例如，在 `home.html` 文件内部，当路由器引入此文件时，控制器将定义为\
    \ `homeController as home`。\n\n***\n\n![提示：清理 Angular URL](img/icon-heart.png\
    \ \"专业贴士\")\n\n提示：清理 Angular URL\n\n默认情况下，AngularJS 会路由带井号 (# 的 URL。例如，Angular\
    \ 将会有 `http://example.com/`、`http://example.com/#/about` 和 `http://example.com/#/contact`。\n\
    \n获取清洁的 URL 并从 URL 中删除井号非常简单。\n\n需要完成 2 件事：\n\n1. 配置 `$locationProvider`\n2. 在\
    \ `<head>` 中设置 `<base>`\n\n在 Angular 中，我们将使用 `$locationProvider.html5Mode(true)`\
    \ 并在 HTML 中添加 `<base href=\"/\">`。\n\n#### 将路由注入主应用\n\nAngular 开发的核心原则之一是依赖注入。我们将新创建的路由模块注入到\
    \ `index.html` 中。\n\n我们将像这样在第一行添加：\n\n`angular.module('routerApp', ['routerRoutes'])`\n\
    \n就像这样，我们现在有了路由！\n\n### 配置视图\n\n现在我们已经有了路由，并且它们正在调用相应的文件。为了完成本教程，我们只需要定义将注入的页面。我们还将让每个页面显示其相应控制器的消息。这是一个简单的过程，只需在每个视图中显示\
    \ `{{ home.message }}`、`{{ about.message }}` 和 `{{ contact.message }}` 变量。\n\n\
    `pages/home.html`\n\n```\n1 <div class=\"jumbotron text-center\">\n2     <h1>Home\
    \ Page</h1>\n3 \n4     <p>{{ home.message }}</p>\n5 </div>\n```\n\n`pages/about.html`\n\
    \n```\n1 <div class=\"jumbotron text-center\">\n2     <h1>About Page</h1>\n3 \n\
    4     <p>{{ about.message }}</p>\n5 </div>\n```\n\n`pages/contact.html`\n\n```\n\
    1 <div class=\"jumbotron text-center\">\n2     <h1>Contact Page</h1>\n3 \n4  \
    \   <p>{{ contact.message }}</p>\n5 </div>\n```\n\n我们在路由中通过 `controllerAs` 为每个\
    \ HTML 文件的变量都加上了控制器名称。\n\n访问您的应用程序并点击页面。你会看到数据发生了变化，你的消息变量也发生了变化，而完全无需刷新页面！**\n\
    \n![Angular 路由首页](img/12-angular-routing----angular-routing-final.jpg)\n\nAngular\
    \ 路由首页\n\n### 总结\n\n我们搞定了！一个具有 3 个不同页面的单页应用。每个页面还将引入不同的 Angular 控制器，以便数据在我们的站点上可以有所不同。\n\
    \n你可以看到它的价值，因为它让我们的基础网站变成了更像集成应用程序的感觉。\n"
- fmt: "\nAs cool as this site is without refreshing the page for routing, we will\
    \ make it even cooler by animating these pages. You have probably already seen\
    \ mobile apps that slide in and out of view as you click items. We’ll turn what\
    \ we just built into a clean and impressive animated site (don’t worry, it won’t\
    \ be anything too flashy… unless that’s what you want).\n\n***\n\n![Note: An Alternative\
    \ to ngRoute](images/icon-pencil.png \"Take Note\")\n\n#### Note: An Alternative\
    \ to ngRoute\n\nWhile `ngRoute` is the routing tool built to work most closely\
    \ with Angular, another tool called `UI Router` was built as another routing framework\
    \ by the AngularUI team. [AngularUI](http://angular-ui.github.io/) is the companion\
    \ suite that works hand in hand with Angular applications. They provide many useful\
    \ tools like `UI Router`, `UI Bootstrap` for using Bootstrap JavaScript components\
    \ within Angular, and a few other awesome tools.\n\n`UI Router` provides a different\
    \ approach than `ngRoute` in that it changes your application views based on state\
    \ of the application and not just the route URL. This means that your application\
    \ is not tied to the URL path and you can adjust what templates show based on\
    \ application state (ie if a user is logged in or not).\n\nThere are also great\
    \ benefits by having the ability to nest states. `ngRoute` doesn’t provide this\
    \ functionality and for more advanced UIs, it is helpful to have nested states\
    \ like having multiple sidebar panels and moving components you would see more\
    \ in mobile applications.\n\nWe will be using `ngRoute` since it is the standard,\
    \ but for more reading on `UI Router`, here’s a good starting article: [AngularJS\
    \ Routing Using UI-Router](http://scotch.io/tutorials/javascript/angular-routing-using-ui-router).\
    \ In the future, the Angular team has stated that the next routing module they\
    \ build will have features from both `ngRoute` and `UI Router`.\n\n***\n\n## Animating\
    \ Angular Applications\n\nWhat’s the point in creating these great single page\
    \ applications if they don’t act like it? We want our applications to act as similar\
    \ to native applications as possible so that we can blur the lines between web\
    \ and native applications and impress our users even further.\n\nAngularJS provides\
    \ a great way to create single page applications. This allows for our site to\
    \ feel more and more like a native mobile application since we have a single page\
    \ app. To make it feel even more native, we can add transitions and animations\
    \ using the [ngAnimate module](http://docs.angularjs.org/api/ngAnimate).\n\nThis\
    \ module allows us to create beautiful looking applications and we’ll be looking\
    \ at how to animate ng-view.\n\n### Animating Our Routing Application\n\nWe are\
    \ going to animate the single page application we built in the last chapter. Thanks\
    \ to our routing, our site will not refresh as people click between pages. Now\
    \ we will:\n\n*   have `ngRoute` handle our routing (done in the last chapter)\n\
    *   use `ngAnimate` to create page animations\n*   use `CSS animations` to handle\
    \ page animations\n\nBefore we can get to the animations, let’s talk a bit about\
    \ how the `ngAnimate module` works.\n\n#### How Does the ngAnimate Module Work?\n\
    \n`ngAnimate` will add and remove CSS classes to different Angular directives\
    \ based on if they are entering or leaving the view. This happens automatically\
    \ without us needing to configure anything.\n\nThe classes that are added and\
    \ removed automatically when we load up our site are `.ng-enter` or `.ng-leave`.\
    \ These are applied to the div where we apply the `ng-view` directive. We won’t\
    \ see these yet, but if you go into your browser inspector when you are clicking\
    \ between pages, you’ll see the `.ng-enter` and `.ng-leave` classes being applied.\n\
    \n#### How Animations Are Applied\n\nThis module keeps things clean and simple.\
    \ All it does is add classes. How does it create animations though? It actually\
    \ doesn’t. It gives us the tools to do so and then we are in control of the animations\
    \ by creating CSS animations. By using CSS animations, we ensure that our application\
    \ can work in mobile browsers, desktop browsers, and is adheres to the latest\
    \ standards (CSS3).\n\nWe’ll be using CSS animations from the [Animate.css](http://daneden.github.io/animate.css/)\
    \ project since those classes(https://github.com/daneden/animate.css/blob/master/animate.css)\
    \ are easily taken into our own projects.\n\n#### Directives that Use Animation\n\
    \n`ngAnimate` also applies these classes to more Angular directives automatically.\
    \ In addition to the `ngView` module, these classes are also applied to `ngRepeat`,\
    \ `ngInclude`, `ngIf`, `ngSwitch`, `ngShow`, `ngHide`, `ngView`, and `ngClass`.\
    \ This means that you can animate multiple parts of your application. We’ll be\
    \ focusing on `ngView` in this chapter, but the tactics can be easily applied\
    \ to the other directives.\n\n#### Animating Our Routing Application\n\nThere\
    \ are three steps to using the `ngAnimate` module inside of our application from\
    \ the last chapter:\n\n1.  Link to the `angular-animate.js` file\n2.  Inject the\
    \ `ngAnimate` module into our main Angular module\n3.  Add the `animate.css` stylesheet\
    \ to have prebuilt CSS animations\n\nWe’ll use a CDN for the `angular-animate.js`\
    \ and `animate.css` resources that we need. Go back into your `index.html` file\
    \ and add the two resources to the `<head>` of your document.\n\n```\n 1 <head>\n\
    \ 2     <meta charset=\"utf-8\">\n 3     <title>My Routing App!</title>\n 4 \n\
    \ 5     <!-- set the base path for angular routing -->\n 6     <base href=\"/\"\
    >\n 7 \n 8     <!-- CSS -->\n 9     <!-- load bootstrap and fontawesome -->\n\
    \ 10    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    >\n 11    <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n 12    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css\"\
    >\n 13 \n 14     <!-- JS -->\n 15     <!-- load angular, angular-route and angular-animate\
    \ -->\n 16    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular.min.js\"\
    ></script>\n 17    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-route.min.js\"\
    ></script>\n 18    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-animate.min.js\"\
    ></script>\n 19 \n 20    <script src=\"js/app.js\"></script>\n 21    <script src=\"\
    js/routes.js\"></script>\n 22 </head>\n```\n\nThe two main lines that we are looking\
    \ to add here are `animate.css` and `angular-animate.js`:\n\n```\n<link rel=\"\
    stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css\"\
    >\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-animate.min.js\"\
    ></script>\n```\n\nWith the resources we now need, inside of `app.js` file where\
    \ we defined our main module (`angular.module('routerApp', ['routerRoutes'])`),\
    \ we will need to inject the `ngAnimate` module. Without injecting the module\
    \ into our application, we won’t be able to use it. This is once again the Angular\
    \ dependency concepts in action.\n\n#### Injecting the ngAnimate Module\n\nTo\
    \ inject the ngAnimate module, we’ll follow the same process that we used to inject\
    \ our `routerRoutes` module. Just add it when declaring the `angular.module()`.\n\
    \nHere’s the module injected in our `app.js` file:\n\n```\nangular.module('routerApp',\
    \ ['routerRoutes', 'ngAnimate'])\n```\n\nNow when we start up our application\
    \ and inspect element in our browser, we can see the `ng-enter` and `ng-leave`\
    \ classes being applied. This won’t affect how our application looks or feels…\
    \ yet. We just need to apply CSS animations now.\n\n### CSS Animations and Positioning\n\
    \nIn our last chapter, we had all of our custom CSS (just the 1 line for body\
    \ padding) inline in our `index.html` file. Let’s move that into its own file\
    \ now. Inside of the public folder, create a `public/css/style.css` file. We will\
    \ add that to our `index.html` file instead of the inline file:\n"
  raw: "As cool as this site is without refreshing the page for routing, we will make\
    \ it even cooler by animating these pages. You have probably already seen mobile\
    \ apps that slide in and out of view as you click items. We’ll turn what we just\
    \ built into a clean and impressive animated site (don’t worry, it won’t be anything\
    \ too flashy… unless that’s what you want).\n\n* * *\n\n![Note: An Alternative\
    \ to ngRoute](images/icon-pencil.png \"Take Note\")\n\nNote: An Alternative to\
    \ ngRoute\n\nWhile ngRoute is the routing tool built to work most closely with\
    \ Angular, another tool called UI Router was built as another routing framework\
    \ by the AngularUI team. [AngularUI](http://angular-ui.github.io/) is the companion\
    \ suite that works hand in hand with Angular applications. They provide many useful\
    \ tools like UI Router, UI Bootstrap for using Bootstrap JavaScript components\
    \ within Angular, and a few other awesome tools.\n\nUI Router provides a different\
    \ approach than ngRoute in that it changes your application views based on **state\
    \ of the application and not just the route URL**. This means that your application\
    \ is not tied to the URL path and you can adjust what templates show based on\
    \ application state (ie if a user is logged in or not).\n\nThere are also great\
    \ benefits by having the ability to **nest states**. ngRoute doesn’t provide this\
    \ functionality and for more advanced UIs, it is helpful to have nested states\
    \ like having multiple sidebar panels and moving components you would see more\
    \ in mobile applications.\n\nWe will be using ngRoute since it is the standard,\
    \ but for more reading on UI Router, here’s a good starting article: [AngularJS\
    \ Routing Using UI-Router](http://scotch.io/tutorials/javascript/angular-routing-using-ui-router).\
    \ In the future, the Angular team has stated that the next routing module they\
    \ build will have features from both ngRoute and UI Router.\n\n* * *\n\n## Animating\
    \ Angular Applications\n\nWhat’s the point in creating these great single page\
    \ applications if they don’t act like it? We want our applications to act as similar\
    \ to native applications as possible so that we can blur the lines between web\
    \ and native applications and impress our users even further.\n\nAngularJS provides\
    \ a great way to create single page applications. This allows for our site to\
    \ feel more and more like a native mobile application since we have a single page\
    \ app. To make it feel even more native, we can add transitions and animations\
    \ using [ngAnimate module](http://docs.angularjs.org/api/ngAnimate).\n\nThis module\
    \ allows us to create beautiful looking applications and we’ll be looking at **how\
    \ to animate ng-view**.\n\n### Animating Our Routing Application\n\nWe are going\
    \ to animate the single page application we built in the last chapter. Thanks\
    \ to our routing, our site will not refresh as people click between pages. Now\
    \ we will:\n\n*   have **ngRoute** handle our routing (done in the last chapter)\n\
    \n*   use **ngAnimate** to create page animations\n\n*   use **CSS animations**\
    \ to handle page animations\n\nBefore we can get to the animations, let’s talk\
    \ a bit about how the **ngAnimate module works**.\n\n### How Does the ngAnimate\
    \ Module Work?\n\nngAnimate will add and remove CSS classes to different Angular\
    \ directives based on if they are entering or leaving the view. This happens automatically\
    \ without us needing to configure anything.\n\nThe classes that are added and\
    \ removed automatically when we load up our site are `.ng-enter` or `.ng-leave`.\
    \ These are applied to the div where we apply the `ng-view` directive. We won’t\
    \ see these yet, but if you go into your browser inspector when you are clicking\
    \ between pages, you’ll see the `.ng-enter` and `.ng-leave` classes being applied.\n\
    \n### How Animations Are Applied\n\nThis module keeps things clean and simple.\
    \ All it does is add classes. How does it create animations though? It actually\
    \ doesn’t. It gives us the tools to do so and then we are in control of the animations\
    \ by creating CSS animations. By using CSS animations, we ensure that our application\
    \ can work in mobile browsers, desktop browsers, and is adheres to the latest\
    \ standards (CSS3).\n\nWe’ll be using CSS animations from the [Animate.css](http://daneden.github.io/animate.css/)\
    \ project since those [classes](https://github.com/daneden/animate.css/blob/master/animate.css)\
    \ are easily taken into our own projects.\n\n### Directives that Use Animation\n\
    \nngAnimate also applies these classes to more Angular directives automatically.\
    \ In addition to the `ngView` module, these classes are also applied to ngRepeat,\
    \ ngInclude, ngIf, ngSwitch, ngShow, ngHide, ngView, and ngClass. This means that\
    \ you can animate multiple parts of your application. We’ll be focusing on **ngView**\
    \ in this chapter, but the tactics can be easily applied to the other directives.\n\
    \n### Animating Our Routing Application\n\nThere are three steps to using the\
    \ ngAnimate module inside of our application from the last chapter:\n\n1.  Link\
    \ to the `angular-animate.js` file\n\n2.  Inject the `ngAnimate` module into our\
    \ main Angular module\n\n3.  Add the `animate.css` stylesheet to have prebuilt\
    \ CSS animations\n\nWe’ll use a CDN for the `angular-animate.js` and `animate.css`\
    \ resources that we need. Go back into your **index.html** file and add the two\
    \ resources to the `<head>` of your document.\n\n```\n 1 <head>\n 2     <meta\
    \ charset=\"utf-8\">\n 3     <title>My Routing App!</title>\n 4 \n 5     <!--\
    \ set the base path for angular routing -->\n 6     <base href=\"/\">\n 7 \n 8\
    \     <!-- CSS -->\n 9     <!-- load bootstrap and fontawesome via CDN -->\n10\
    \     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/bootstrap/3.0.0/\\\
    \n11 css/bootstrap.min.css\">\n12     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
    \n13 .0/css/font-awesome.css\">\n14     <link rel=\"stylesheet\" href=\"http://cdnjs.cloudflare.com/ajax/libs/animate.c\\\
    \n15 ss/3.1.1/animate.min.css\">\n16 \n17     <style>\n18         body { padding-top:50px;\
    \ }\n19     </style>\n20 \n21     <!-- SPELLS -->\n22     <!-- load angular and\
    \ angular-route via CDN -->\n23     <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"\
    \\\n24 ></script>\n25     <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-route.j\\\
    \n26 s\"></script>    \n27     <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-animate\\\
    \n28 .js\"></script>\n29     \n30     <script src=\"js/app.js\"></script>\n31\
    \     <script src=\"js/app.routes.js\"></script>\n32 </head>\n```\n\nThe two main\
    \ lines that we are looking to add here are for `animate.css` and `angular-animate.js`:\n\
    \n```\n1 <link rel=\"stylesheet\" href=\"//cdnjs.cloudflare.com/ajax/libs/animate.css/3.1.1/\\\
    \n2 animate.min.css\">\n3 <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-animate.js\"\
    \\\n4 ></script>\n```\n\nWith the resources we now need, inside of our `app.js`\
    \ file where we defined our main Angular module (`angular.module('routerApp',\
    \ ['routerRoutes']`), we will need to inject the **ngAnimate** module. Without\
    \ injecting the module into our application, we won’t be able to use it. This\
    \ is once again the Angular dependency concepts in action.\n\n#### Injecting the\
    \ ngAnimate Module\n\nTo inject the ngAnimate module, we’ll follow the same process\
    \ that we used to inject our **routerRoutes** module. Just add it when declaring\
    \ the `angular.module()`.\n\nHere’s the module injected in our `app.js` file:\n\
    \n```\n1     angular.module('routerApp', ['routerRoutes', 'ngAnimate'])\n```\n\
    \nNow when we start up our application and inspect element in our browser, we\
    \ can see the `ng-enter` and `ng-leave` classes being applied. This won’t affect\
    \ how our application looks or feels… yet. We just need to apply CSS animations\
    \ now.\n\n### CSS Animations and Positioning\n\nIn our last chapter, we had all\
    \ of our custom CSS (just the 1 line for body padding) inline in our `index.html`\
    \ file. Let’s move that into its own file now. Inside of the public folder, create\
    \ a ‘public/css/style.css’ file. We will add that to our `index.html` file instead\
    \ of the inline file:"
