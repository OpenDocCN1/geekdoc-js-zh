  trans: "\n现在我们可以使用 `require()` 在我们的 `server.js` 文件中使用此文件。以下行将会被修改：\n\n```\n1 var\
    \ config     = require('./config');\n2 \n3 // 连接到我们的数据库（托管在 modulus.io）\n4 mongoose.connect(config.database);\
    \ \n5 \n6 // 启动服务器\n7 // ====================================\n8 app.listen(config.port);\n\
    9 console.log('Magic happens on port ' + config.port);\n```\n\n以下已经被移出，因此可以从 `server.js`\
    \ 中删除：\n\n```\n1 // 创建令牌的超级密钥\n2 var superSecret = 'ilovescotchscotchyscotchscotch';\n\
    ```\n\n虽然这看起来作用不大，但当我们的应用程序拥有 20 多个设置时，这个概念将产生巨大的影响。\n\n***\n\n![Note](img/icon-pencil.png\
    \ \"注意\")\n\n## Note\n\n### 什么是 `module.exports`？\n\n默认情况下，JavaScript 没有任何在不同文件之间传递信息的方法。`module.exports`\
    \ 是 Node 解决这个问题的方法。\n\n你可以将 `module.exports` 视为我们应用程序的一个巨大对象。当我们的应用程序启动时，这个 `module.exports`\
    \ 对象看起来如下：\n\n```\n1 module.exports = {};\n```\n\n当我们开始使用 `require()` 将内容引入应用程序时，所有内容都会被添加到这个对象中。\n\
    \n所以，现在当我们通过 `require(./config.js);` 添加新的 `config.js` 文件时，我们就可以访问那些变量了，因为我们通过\
    \ `module.exports` 传递了它们。\n\n这就是我们将在所有文件之间传递信息的方式，当我们在创建路由文件时再次在实践中看到这一点。\n\n\
    同样重要的一点是，网络上的许多教程会在 `module.exports` 和 `exports` 之间切换。它们的意思相同，可以互相替换。\n\n***\n\
    \n### 路由 (Routes)\n\n就像我们的配置变量一样，让我们把路由移动到自己的文件中。创建一个名为 `app/routes/` 的文件夹和一个名为\
    \ `app/routes/api.js` 的文件。\n\n在创建新文件时，我们必须 `require()` 该文件所需要的任何内容。在我们的情况下，我们需要\
    \ `body-parser`、我们的 `User` 模型、用于 `secret` 的 `config` 文件，以及 `jsonwebtoken`，因为它们在我们的路由中被用过。\n\
    \n我们还需要 `app` 和 `express`，但我们将它们传递到路由中，因为我们希望应用程序使用我们在 `server.js` 中创建的同一个 `app`\
    \ 对象。让我们来看看如何构建包含所有 API 路由的 `routes/api.js` 文件。进入第 10 章现有的‘server.js’文件，提取所有的路由代码，从\
    \ `var apiRouter = express.Router();` 开始。我们将将其封装在 `module.exports` 中，以便它可以在我们的\
    \ JavaScript 文件之间传递。还要注意变量 `superSecret` 的变化以及我们在顶部引入的包。\n"
- fmt: "\n```javascript\nvar User       = require('../models/user');\nvar jwt    \
    \    = require('jsonwebtoken');\nvar config     = require('../../config');\n\n\
    // super secret for creating tokens\nvar superSecret = config.secret;\n\nmodule.exports\
    \ = function(app, express) {\n\n  var apiRouter = express.Router();\n\n  // route\
    \ to authenticate a user (POST http://localhost:8080/api/authenticate)\n  apiRouter.post('/authenticate',\
    \ function(req, res) {\n    console.log(req.body.username);\n\n    // find the\
    \ user\n    // select the password explicitly since mongoose is not returning\
    \ it by default\n    User.findOne({\n      username: req.body.username\n    }).select('password').exec(function(err,\
    \ user) {\n\n      if (err) throw err;\n\n      // no user with that username\
    \ was found\n      if (!user) {\n        res.json({ \n          success: false,\
    \ \n          message: 'Authentication failed. User not found.' \n        });\n\
    \      } else if (user) {\n\n        // check if password matches\n        var\
    \ validPassword = user.comparePassword(req.body.password);\n        if (!validPassword)\
    \ {\n          res.json({ \n            success: false, \n            message:\
    \ 'Authentication failed. Wrong password.' \n          });\n        } else {\n\
    \n          // if user is found and password is right\n          // create a token\n\
    \          var token = jwt.sign(user, superSecret, {\n            expiresInMinutes:\
    \ 1440 // expires in 24 hours\n          });\n\n          // return the information\
    \ including token as JSON\n          res.json({\n            success: true,\n\
    \            message: 'Enjoy your token!',\n            token: token\n       \
    \   });\n        }   \n\n      }\n\n    });\n  });\n\n  // route middleware to\
    \ verify a token\n  apiRouter.use(function(req, res, next) {\n      // do logging\n\
    \      console.log('Somebody just came to our app!');\n\n      // check header\
    \ or url parameters or post parameters for token\n      var token = req.body.token\
    \ || req.param('token') || req.headers['x-access-token'];\n\n      // decode token\n\
    \      if (token) {\n\n        // verifies secret and checks exp\n        jwt.verify(token,\
    \ superSecret, function(err, decoded) {      \n          if (err) {\n        \
    \    return res.json({ success: false, message: 'Failed to authenticate token.'\
    \ });    \n          } else {\n            // if everything is good, save to request\
    \ for use in other routes\n            req.decoded = decoded;    \n\n        \
    \    next(); // make sure we go to the next routes and don't stop here\n     \
    \     }\n        });\n\n      } else {\n\n      // if there is no token\n    \
    \  // return an HTTP response of 403 (access forbidden) and an error message\n\
    \      return res.status(403).send({ \n        success: false, \n        message:\
    \ 'No token provided.' \n      });\n      \n    }\n\n  });\n\n  // test route\
    \ to make sure everything is working \n  // accessed at GET http://localhost:8080/api\n\
    \  apiRouter.get('/', function(req, res) {\n      res.json({ message: 'hooray!\
    \ welcome to our api!' });   \n  });\n\n  // on routes that end in /users\n  //\
    \ ----------------------------------------------------\n  apiRouter.route('/users')\n\
    \n      // create a user (accessed at POST http://localhost:8080/users)\n    \
    \  .post(function(req, res) {\n          \n          var user = new User();  \
    \    // create a new instance of the User model\n          user.name = req.body.name;\
    \  // set the users name (comes from the request)\n          user.username = req.body.username;\
    \  // set users username (comes from the request)\n          user.password = req.body.password;\
    \  // set the users password (comes from the request)\n          user.save(function(err)\
    \ {\n              if (err) res.send(err);\n              // return a message\n\
    \              res.json({ message: 'User created!' });\n          });\n      })\n\
    \      // get all the users (accessed at GET http://localhost:8080/api/users)\n\
    \      .get(function(req, res) {\n          User.find(function(err, users) {\n\
    \              if (err) res.send(err);\n              // return the users\n  \
    \            res.json(users);\n          });\n      });\n  // on routes that end\
    \ in /users/:user_id\n  // ----------------------------------------------------\n\
    \  apiRouter.route('/users/:user_id')\n      // get the user with that id\n  \
    \    .get(function(req, res) {\n          User.findById(req.params.user_id, function(err,\
    \ user) {\n              if (err) res.send(err);\n              // return that\
    \ user\n              res.json(user);\n          });\n      })\n      // update\
    \ the user with this id\n      .put(function(req, res) {\n          User.findById(req.params.user_id,\
    \ function(err, user) {\n              if (err) res.send(err);\n             \
    \ // set the new user information if it exists in the request\n              if\
    \ (req.body.name) user.name = req.body.name;\n              if (req.body.username)\
    \ user.username = req.body.username;\n              if (req.body.password) user.password\
    \ = req.body.password;\n              // save the user\n              user.save(function(err)\
    \ {\n                  if (err) res.send(err);\n                  // return a\
    \ message\n                  res.json({ message: 'User updated!' });\n       \
    \       });\n          });\n      })\n      // delete the user with this id\n\
    \      .delete(function(req, res) {\n          User.remove({\n              _id:\
    \ req.params.user_id\n          }, function(err, user) {\n              if (err)\
    \ res.send(err);\n              res.json({ message: 'Successfully deleted' });\n\
    \          });\n      });\n\n  return apiRouter;\n};\n```\n\nIf you look carefully,\
    \ you’ll see this doesn’t differ too much from how our code looked in `server.js`.\
    \ The main difference is that we are requiring `config.js` and using `config.secret`.\n\
    \nWe are also passing back a function into `module.exports` and requiring that\
    \ `app` and `express` are passed in. This is so we can use the `express` object\
    \ to get an instance of `express.Router()`. Currently, we are not using the `app`\
    \ object, but it note that if you are not using `express.Router()`, you could\
    \ directly specify routes on the `app` object as well.\n\nWe will then `return\
    \ apiRouter;` so that we can use it in `server.js`.\n\nNow that this file is created,\
    \ we just need to call it in `server.js`. This is where we can see just how clean\
    \ our main file has become and how much easier it is to read than before.\n\n\
    These are the lines to use in `server.js` when calling our newly created routes\
    \ file:\n\n```javascript\n// API ROUTES ------------------------\nvar apiRoutes\
    \ = require('./app/routes/api')(app, express);\napp.use('/api', apiRoutes);\n\
    ```\n\nIf you didn’t do it earlier, go through and remove those routes and calls\
    \ to packages that we moved into our `api.js` file. And that’s it! Now we have\
    \ moved about 170 lines of code out of our `server.js`!\n\n### Catchall Route\n\
    \nThe last thing we need to do is create a catchall route to pass users to an\
    \ Angular application. Currently we have a route that shows our home page in `server.js`.\
    \ It looks like this:\n\n```javascript\n// basic route for the home page\napp.get('/',\
    \ function(req, res) {\n  res.send('Welcome to the home page!');\n});\n```\n\n\
    For creating MEAN applications, our Node routes will take place here and then\
    \ any request sent to a route that isn’t handled by Node should be taken care\
    \ of by Angular. This is where a `catchall route` comes in handy.\n"
