- fmt: "\nThe `heroku create` command will create a random name for our application,\
    \ in this case, `fathomless-stream-3632`. This means that our application will\
    \ soon be reachable at `http://fathomless-stream-3632.herokuapp.com`.\n\nThat\
    \ isn’t really ideal so let’s rename that to `user-crm`. We can see the apps we\
    \ have created with the command `heroku apps`. Then we’ll go ahead and rename\
    \ it.\n\n```\n1 $ heroku apps:rename user-crm --app fathomless-stream-3632\n```\n\
    \nIf the name of the application we want is taken (`user-crm` is taken since we\
    \ used it for this book), then we will have to change the name or add some numbers\
    \ to the end of it. Let’s add `123` to the end of that name.\n\n```\n1 $ heroku\
    \ apps:rename user-crm-123 --app fathomless-stream-3632\n```\n\nYou can also bypass\
    \ all this renaming business by naming your application from the start:\n\n```\n\
    1 $ heroku create user-crm\n```\n\nEventually when you want your application to\
    \ go live, you probably won’t want people to visit it at `http://xxxx.herokuapp.com`.\
    \ Heroku provides an easy way to point any of the domains you may own to this\
    \ application so don’t worry. We’ll revisit how to point a domain to our Heroku\
    \ app later in this chapter.\n\n![Image](images/18-mean-deployment----06-heroku-rename.jpg)\n\
    \nImage\n\n## Deploying Code\n\nNow that we have everything in order, we’re going\
    \ to go ahead and get our site up to Heroku! This takes one simple git command.\
    \ We are essentially saying, push all of our local git repository code to the\
    \ remote repository hosted by Heroku.\n\n```\n1 $ git push heroku master\n```\n\
    \nThis informs git that we would like to push to the newly create `heroku` repository\
    \ and the `master` branch (which is the default git branch that was automatically\
    \ created for us).\n\n![Heroku Deploy](images/18-mean-deployment----07-heroku-deploy.jpg)\n\
    \nHeroku Deploy\n\nWe can see as Heroku goes through a great many things when\
    \ deploying our application. It sees that our we have a Node based application.\
    \ It will then go through adding the dependencies by reading our `package.json`\
    \ file. It will also start our Node server by running the file declared as `main`\
    \ in the `package.json` file. That file will be `server.js` in our case.\n\n##\
    \ Ensure One Instance Is Running\n\nWe want to be sure that our app is running\
    \ and that Heroku has started a server for us (called dynos). Type the following\
    \ to get confirmation:\n\n```\n1 $ heroku ps:scale web=1\n```\n\nIf we go into\
    \ our dashboard, we are able to see under the `Dynos` section, that we have one\
    \ dyno and it is the free tier. You can quickly scale your applications up or\
    \ down by editing how many dynos are used.\n\n![Heroku Dynos](images/18-mean-deployment----heroku-dynos.jpg)\n\
    \nHeroku Dynos\n\nOur application is now ready for viewing!\n\n### View Our Application\
    \ in Browser\n\nWe’re finally at the part that we’ve been waiting for since the\
    \ beginning of the book! Seeing our full stack MEAN application in the browser!\n\
    \nIf you remember the crazy random name that Heroku generated for you, or renamed\
    \ the app yourself, go ahead and visit that in browser:\n\n[https://user-crm.herokuapp.com/](https://user-crm.herokuapp.com/)\n\
    \nHeroku also provides a shortcut to open your application in the browser using\
    \ the command line:\n\n```\n1 $ heroku open\n```\n\nIt’s magic! We have our site\
    \ in the browser just like we wanted.\n\n### Defining a Specific Run Command\n\
    \nSometimes we may have a specific command that we want to run when Heroku gets\
    \ its hands on our application. This could be using a task runner to start the\
    \ server like grunt or gulp (we’ll get into gulp in the next chapter). Heroku\
    \ will look at the `main` attribute in our `package.json` file and will also look\
    \ under `scripts` if we have defined that attribute.\n\nThere is another way to\
    \ tell Heroku exactly what command we would like to see run. You can do this by\
    \ defining a new file in the root of our project called a `Procfile`.\n\nJust\
    \ create a `Procfile` in the root of your project and define the start command\
    \ like so:\n\n```\n1 web: node server.js\n```\n\nThis tells Heroku that when deploying\
    \ to the web, this command should be used to start our application. Now when we\
    \ `git push heroku master`, Heroku will run that specific command and our site\
    \ will be live.\n\n## Using a Current Heroku App\n\nIf you switch to a different\
    \ computer and want to access the Heroku app that you have already been using,\
    \ there are a few steps that have to be taken. These steps assume you are on a\
    \ new computer and have not yet installed Heroku.\n\n*   Download the [Heroku\
    \ Toolbelt](https://toolbelt.heroku.com/)\n*   Login: `heroku login`\n*   Add\
    \ your public key: `heroku keys:add`\n*   Pull down your current application `heroku\
    \ git:clone -a app-name`\n*   Make your improvements\n*   Git add and commit your\
    \ changes\n*   Push back to heroku: `git push heroku master`\n\nWith these simple\
    \ steps, you can jump onto any computer and immediately grab your current projects.\n\
    \n## Using Your Own Domain\n\nHeroku provides very simple steps for adding a domain\
    \ to an app. For this example, we will assume you have a domain `supercool.com`.\n\
    \nTo add that domain to your application, you will need to do two things:\n\n\
    1.  Tell Heroku which domains are matched\n2.  Configure your DNS to point to\
    \ Heroku\n\nThe first part of this is very easy. We will tell Heroku what domain\
    \ using the following:\n\n```\n1 heroku domains:add www.supercool.com\n```\n\n\
    Once that step is done, you will need to make sure you have a CNAME generated\
    \ wherever you have your domain. This varies across registrar but should look\
    \ something like the following:\n\n| Record | Name | Target |\n| --- | --- | ---\
    \ |\n| CNAME | www | user-crm.herokuapp.com |\n\nThis may take some time to propagate\
    \ before you will be able to visit `http://www.supercool.com` in your browser.\
    \ If you would also like to add the root domain (`supercool.com`), then you will\
    \ have to repeat the steps above. As long as you follow the two steps, you will\
    \ be able to see your site in no time!\n\nFor more information, visit the [Heroku\
    \ Domain Docs](https://devcenter.heroku.com/articles/custom-domains). They give\
    \ more detailed information about more types of domains (wildcards, sub-domains)\
    \ if you are interested. They also provide more instructions for CNAME configuration\
    \ across a few registrars.\n\n## Conclusion\n\nWe have finally built a MEAN stack\
    \ application and have it online. Many of the techniques learned so far in this\
    \ book can be applied to different applications and use cases. No matter what\
    \ you are trying to build, Heroku is a fast and easy way to deploy your apps/websites.\
    \ Moving forward, now that we’ve built an app and deployed it, let’s look at different\
    \ techniques to make our development process easier. We’ll be looking at how to\
    \ use Gulp, a task-runner, and Bower, a front-end resource manager. These two\
    \ tools will be able to speed up our workflow immensely.\n\n## MEAN Workflow Tools\n\
    \n### Sample MEAN App\n\nWe’ll need to create a sample MEAN application to see\
    \ exactly how we can use Bower and Gulp to help our workflow.\n\nHere is the directory\
    \ structure. Go ahead and create these files and folders.\n\n```\n 1 - public/\n\
    \ 2 ----- app/\n 3 ---------- controllers/\n 4 --------------- mainCtrl.js\n 5\
    \ ---------- views/\n 6 --------------- pages/\n 7 -------------------- home.html\n\
    \ 8 --------------- index.html\n 9 ---------- app.js\n 10 ---------- app.routes.js\n\
    \ 11 ----- assets/\n 12 ---------- css/\n 13 --------------- style.less\n 14 -\
    \ server.js\n```\n\nThis will be a MEAN project so go ahead and run:\n\n```\n\
    1 $ npm init\n```\n\nto create a `package.json` file. All the defaults will be\
    \ fine when creating this file.\n\nWe will now need Express as a dependency so\
    \ run:\n\n```\n1 $ npm install express --save\n```\n"
  raw: "The `heroku create` command will create a random name for our application,\
    \ in this case, **fathomless-stream-3632**. This means that our application will\
    \ soon be reachable at `http://fathomless-stream-3632.herokuapp.com`.\n\nThat\
    \ isn’t really ideal so let’s rename that to **user-crm**. We can see the apps\
    \ we have created with the command `heroku apps`. Then we’ll go ahead and rename\
    \ it.\n\n```\n1 $ heroku apps:rename user-crm --app fathomless-stream-3632\n```\n\
    \nIf the name of the application we want is taken (`user-crm` is taken since we\
    \ used it for this book), then we will have to change the name or add some numbers\
    \ to the end of it. Let’s add `123` to the end of that name.\n\n```\n1 $ heroku\
    \ apps:rename user-crm-123 --app fathomless-stream-3632\n```\n\nYou can also bypass\
    \ all this renaming business by naming your application from the start:\n\n```\n\
    1 $ heroku create user-crm\n```\n\nEventually when you want your application to\
    \ go live, you probably won’t want people to visit it at `http://xxxx.herokuapp.com`.\
    \ Heroku provides an easy way to point any of the domains you may own to this\
    \ application so don’t worry. We’ll revisit how to point a domain to our Heroku\
    \ app later in this chapter.\n\n![Image](images/18-mean-deployment----06-heroku-rename.jpg)\n\
    \nImage\n\n#### Deploying Code\n\nNow that we have everything in order, we’re\
    \ going to go ahead and get our site up to Heroku! This takes one simple git command.\
    \ We are essentially saying, push all of our local git repository code to the\
    \ remote repository hosted by Heroku.\n\n```\n1 $ git push heroku master\n```\n\
    \nThis informs git that we would like to push to the newly create `heroku` repository\
    \ and the `master` branch (which is the default git branch that was automatically\
    \ created for us).\n\n![Heroku Deploy](images/18-mean-deployment----07-heroku-deploy.jpg)\n\
    \nHeroku Deploy\n\nWe can see as Heroku goes through a great many things when\
    \ deploying our application. It sees that our we have a Node based application.\
    \ It will then go through adding the dependencies by reading our `package.json`\
    \ file. It will also start our Node server by running the file declared as `main`\
    \ in the `package.json` file. That file will be `server.js` in our case.\n\n####\
    \ Ensure One Instance Is Running\n\nWe want to be sure that our app is running\
    \ and that Heroku has started a server for us (called dynos). Type the following\
    \ to get confirmation:\n\n```\n1 $ heroku ps:scale web=1\n```\n\nIf we go into\
    \ our dashboard, we are able to see under the **Dynos** section, that we have\
    \ one dyno and it is the free tier. You can quickly scale your applications up\
    \ or down by editing how many dynos are used.\n\n![Heroku Dynos](images/18-mean-deployment----heroku-dynos.jpg)\n\
    \nHeroku Dynos\n\nOur application is now ready for viewing!\n\n### View Our Application\
    \ in Browser\n\nWe’re finally at the part that we’ve been waiting for since the\
    \ beginning of the book! Seeing our full stack MEAN application in the browser!\n\
    \nIf you remember the crazy random name that Heroku generated for you, or renamed\
    \ the app yourself, go ahead and visit that in browser:\n\n[https://user-crm.herokuapp.com/](https://user-crm.herokuapp.com/)\n\
    \nHeroku also provides a shortcut to open your application in the browser using\
    \ the command line:\n\n```\n1 $ heroku open\n```\n\nIt’s magic! We have our site\
    \ in the browser just like we wanted.\n\n#### Defining a Specific Run Command\n\
    \nSometimes we may have a specific command that we want to run when Heroku gets\
    \ its hands on our application. This could be using a task runner to start the\
    \ server like grunt or gulp (we’ll get into gulp in the next chapter). Heroku\
    \ will look at the `main` attribute in our `package.json` file and will also look\
    \ under `scripts` if we have defined that attribute.\n\nThere is another way to\
    \ tell Heroku exactly what command we would like to see run. You can do this by\
    \ defining a new file in the root of our project called a `Procfile`.\n\nJust\
    \ create a `Procfile` in the root of your project and define the start command\
    \ like so:\n\n```\n1 web: node server.js\n```\n\nThis tells Heroku that when deploying\
    \ to the web, this command should be used to start our application. Now when we\
    \ `git push heroku master`, Heroku will run that specific command and our site\
    \ will be live.\n\n### Using a Current Heroku App\n\nIf you switch to a different\
    \ computer and want to access the Heroku app that you have already been using,\
    \ there are a few steps that have to be taken. These steps assume you are on a\
    \ new computer and have not yet installed Heroku.\n\n*   Download the [Heroku\
    \ Toolbelt](https://toolbelt.heroku.com/)\n\n*   Login: `heroku login`\n\n*  \
    \ Add your public key: `heroku keys:add`\n\n*   Pull down your current application\
    \ `heroku git:clone -a app-name`\n\n*   Make your improvements\n\n*   Git add\
    \ and commit your changes\n\n*   Push back to heroku: `git push heroku master`\n\
    \nWith these simple steps, you can jump onto any computer and immediately grab\
    \ your current projects.\n\n### Using Your Own Domain\n\nHeroku provides very\
    \ simple steps for adding a domain to an app. For this example, we will assume\
    \ you have a domain named `www.supercool.com`.\n\nTo add that domain to your application,\
    \ you will need to do two things:\n\n1.  Tell Heroku which domains are matched\
    \ to this application\n\n2.  Configure your domain’s DNS to point to Heroku\n\n\
    The first part of this is very easy. We will tell Heroku what domain we will need\
    \ using the following command:\n\n```\n1 $ heroku domains:add www.supercool.com\n\
    ```\n\nOnce that step is done, you will need to make sure that you have a CNAME\
    \ record is generated wherever you have your domain registered. CNAME creation\
    \ varies across domain registrars, but should look something like the following:\n\
    \n| Record | Name | Target |\n\n| --- | --- | --- |\n\n| CNAME | www | user-crm.herokuapp.com\
    \ |\n\nThis may take some time to propagate before you will be able to visit `http://www.supercool.com`\
    \ in your browser. This usually depends on the registrar but it usually averages\
    \ anywhere between 10 minutes to 3 hours.\n\nIf you would also like to add the\
    \ root domain (`supercool.com`), then you will have to repeat the steps above.\n\
    \nAs long as you follow the two steps, you will be able to see your site at your\
    \ domain in no time!\n\nFor more information, visit the [Heroku Domain Docs](https://devcenter.heroku.com/articles/custom-domains).\
    \ They give more detailed information about more types of domains (wildcards,\
    \ sub-domains) if you are interested in those. They also provide more instructions\
    \ for CNAME configuration across a few other registrars.\n\n### Conclusion\n\n\
    We have finally built a full MEAN stack application and have it online. Many of\
    \ the techniques learned so far in this book can be applied to different applications\
    \ and use cases.\n\nNo matter what you are trying to build, Heroku is a fast and\
    \ easy way to deploy your apps/websites.\n\nMoving forward, now that we’ve built\
    \ an app and deployed it, let’s look at different techniques to make our development\
    \ process easier. We’ll be looking at how to use Gulp, a task-runner, and Bower,\
    \ a front-end resource manager. These two tools will be able to speed up our workflow\
    \ immensely.\n\n## MEAN Development Workflow Tools\n\n### Sample MEAN App\n\n\
    We’ll need to create a sample MEAN application to see exactly how we can use Bower\
    \ and Gulp to help our workflow.\n\nHere is the directory structure. Go ahead\
    \ and create these files and folders.\n\n```\n 1 - public/\n 2 ----- app/\n 3\
    \ ---------- controllers/\n 4 --------------- mainCtrl.js\n 5 ---------- views/\n\
    \ 6 --------------- pages/\n 7 -------------------- home.html\n 8 ---------------\
    \ index.html\n 9 ---------- app.js\n10 ---------- app.routes.js\n11 ----- assets/\n\
    12 ---------- css/\n13 --------------- style.less\n14 - server.js\n```\n\nThis\
    \ will be a MEAN project so go ahead and run:\n\n```\n1 $ npm init\n```\n\nto\
    \ create a `package.json` file. All the defaults will be fine when creating this\
    \ file.\n\nWe will now need Express as a dependency so run:\n\n```\n1 $ npm install\
    \ express --save\n```"
