    \ Let’s say we are going to build a sample application. Let’s say we are going\
    \ to build a sample application. Let’s say we are going to build a sample application.\
    \ Let’s say we are going to build a sample application. Let’s say we are going\
    \ to build a sample application. Let’s say we are going to build a sample application.\
    \ Let’s say we are going to build a sample application. Let’s say we are going\
    \ to build a sample application. Let’s say we are going to build a sample application.\
    \ Let’s say we are going to build a sample application. Let’s say we are going\
    \ to build a sample application. Let’s say we are going to build a to build a\
    \ sample application.\n\n### Getting Started\n\nLet’s look at the files. We won’t\
    \ need many files for demonstration. Here is our structure.\n\n```\n1 - app/\n\
    2 ----- models/\n3 ---------- user.js\t// our model\n4 - node_modules/     //\
    \ created by npm. holds our dependencies/\n5 - package.json     // define our\
    \ app\n6 - server.js\t\t// configure our application and create routes\n```\n\n\
    #### Defining our Node Packages (package.json)\n\nAs with all our Node projects,\
    \ we will define the packages in `package.json`. Go ahead and create that file\
    \ with these.\n\n```\n 1 {\n 2   \"name\": \"node-api\",\n 3   \"main\": \"server.js\"\
    ,\n 4   \"dependencies\": {\n 5     \"morgan\": \"1.5.0\",\n 6     \"express\"\
    : \"4.10.3\",\n 7     \"body-parser\": \"1.9.3\",\n 8     \"mongoose\": \"3.8.19\"\
    ,\n 9     \"bcrypt-nodejs\": \"0.0.3\"\n10   }\n11 }\n```\n\nAs a shortcut, you\
    \ could type the following into your command line and they would add themselves\
    \ to the `package.json` file as well:\n\n`npm install express morgan mongoose\
    \ body-parser bcrypt-nodejs --save`\n\n##### What do these packages do?\n\n* \
    \  `express` is the framework.\n*   `morgan` allows us to log all requests to\
    \ the console so we can see exactly what is going on.\n*   `mongoose` is the ODM\
    \ we will use to communicate with our MongoDB database.\n*   `body-parser` will\
    \ let us pull POST content from our HTTP request so that we can do things like\
    \ create a user.\n*   `bcrypt-nodejs` will allow us to hash our passwords since\
    \ it is never safe to store passwords plaintext in our databases\n\n#### Install\
    \ the Node Packages\n\nThis might be the easiest step. Go into the command line\
    \ in the root of your application and type:\n\n```\n1 npm install\n```\n\nnpm\
    \ will now pull in all the packages defined into a `node_modules` folder in our\
    \ project.\n"
