  trans: "\n\n我们现在可以访问管理面板页面 `http://localhost:1337/admin` 以及子页面 `http://localhost:1337/admin/users`\
    \ 和 `http://localhost:1337/admin/posts`。\n\n注意看我们如何为刚刚定义的这些路由设置默认根路径。如果我们将第 22\
    \ 行更改为 `app.use('/app', router)`，那么我们的路由将变为 `http://localhost:1337/app/` 和 `http://localhost:1337/app/users`。\n\
    \n这是非常强大的，因为我们可以创建多个 `express.Router()` 并将它们应用到应用程序中。我们可以为基础路由、身份验证路由甚至 API 路由分别创建一个\
    \ `Router`。\n\n通过使用 `Router`，我们允许通过创建多个 `Router` 实例并相应地应用它们，使应用程序比以往任何时候都更加模块化和灵活。现在我们将查看如何使用中间件来处理请求。\n\
    \n### 路由中间件 (`router.use()`)\n\nExpress 中的路由中间件是在处理请求之前执行某些操作的方法。这可以是检查用户是否已通过身份验证、为分析记录数据，或者我们在向用户输出信息之前想做的任何其他事情。\n\
    \n这里有一些中间件，可以在每次发送请求时向控制台打印一条消息。这将演示如何使用 `Express Router` 创建中间件。我们将该中间件添加到上一个示例中创建的\
    \ `adminRouter` 中。确保它放置在 `adminRouter` 声明之后，在我们定义的 users 和 posts 路由之前。你还会注意到这里的\
    \ `next` 参数。这是 Express 知道函数已完成并可以继续处理下一个中间件或继续路由的唯一方式。\n\n```\n1 // 在每个请求上都会发生的路由中间件\n\
    2 adminRouter.use(function(req, res, next) {\n3 \n4 \t//向控制台记录每个请求\n5 \tconsole.log(req.method,\
    \ req.url);\n6 \n7 \t// 继续之前的操作并进入路由\n8 \tnext(); \n9 });\n```\n\n`adminRouter.use()`\
    \ 用于定义中间件。现在，它将应用到进入我们此 `Router` 实例的所有请求上。让我们进入浏览器访问 `http://localhost:1337/admin`，我们将在控制台中看到该请求。\n\
    \n![Express Router Console Request](img/07-node-routing----express-router-console-log-request.jpg)\n\
    \nExpress Router Console Request\n\n**你放置中间件和路由的顺序非常重要** 一切将按照它们出现的顺序发生。这意味着如果你将中间件放在路由之后，那么路由将在中间件之前执行，请求将结束于此。你的中间件在那个点不会运行。\n\
    \n请记住，你可以将路由中间件用于很多事情。你可以用它在允许用户继续之前，检查会话期间用户是否已登录。\n\n### 路由结构\n\n通过使用 `Router()`，我们能够划分网站的部分。这意味着你可以为网站前端等路由创建一个\
    \ `basicRouter`。你也可以为受某种类型身份验证保护的管理路由创建一个 `adminRouter`。\n\n通过这种方式对我们的应用程序进行路由让我们独立每个部分。这为我们复杂的应用程序或\
    \ API 提供了所需的灵活性。我们还可以保持应用程序的整洁，由于我们可以将每个路由定义移动到自己的文件中，只需在调用 `app.use()` 时引入这些文件即可：\n\
    \n```\n1 app.use('/', basicRoutes);\n2 app.use('/admin', adminRoutes);\n3 app.use('/api',\
    \ apiRoutes);\n```\n\n### 带参数的路由 (`/hello/:name`)\n\n为了查看我们如何为应用程序添加路由参数，假设我们有一个名为\
    \ `/admin/users/:name` 的路由，其中我们可以向 URL 传递人的名字，应用程序将输出名字！我们也可以在实际应用程序中使用它来获取该用户的信息。让我们看看这种路由是什么样的。\n\
    \n```\n1 // 带参数的路由 (http://localhost:1337/admin/users/:name)\n2 adminRouter.get('/users/:name',\
    \ function(req, res) {\n3 \tres.send('hello ' + req.params.name + '!');\n4 });\n\
    ```\n\n现在我们可以访问 `http://localhost:1337/admin/users/holly` 并看到我们的浏览器输出 holly！`req.params`\
    \ 存储了来自原始用户请求的所有数据。简单。\n\n![Express Router Parameters](img/07-node-routing----express-router-parameters.png)\n\
    \nExpress Router Parameters\n\n在未来，我们可以利用此来获取所有匹配 `holly` 的用户数据。然后我们可以构建一个管理面板来管理我们的用户。现在假设我们想以某种方式验证这个名字。也许我们想确保它不是坏名字。我们将在路由中间件内部执行此。我们将使用一个特殊的中间件来处理。\n\
    \n#### 参数的路由中间件 (`.param()`)\n\n我们将使用 Express 的 `.param()` 中间件。这会创建一个为特定路由参数运行的中间件。在我们的情况下，我们在\
    \ hello 路由中使用了 `:name`。再次确保中间件放置在请求之前。\n\n```\n1 // 验证 :name 的路由中间件\n2 adminRouter.param('name',\
    \ function(req, res, next, name) {\n3 \t//在此处对 name 进行验证\n4 \t// 验证逻辑\n5 \t//\
    \ 记录某些内容以便知道它正在运行\n6 \tconsole.log('doing validations on ' + name);\n7 \n8 \t\
    // 验证完成后将新项保存到 req 中\n9 \treq.name = name;\n10 \t// 继续后续操作\n11 \tnext(); \n12\
    \ });\n13 \n14 // 带参数的路由 (http://localhost:1337/admin/hello/:name)\n15 adminRouter.get('/hello/:name',\
    \ function(req, res) {\n16 \tres.send('hello ' + req.name + '!');\n17 });\n```\n\
    \n现在当我们访问 `/hello/:name` 路由时，我们的路由中间件将介入并生效。我们可以运行验证，然后通过将新变量存储在 `req`（请求）中传递给我们的\
    \ `.get` 路由。我们通过将 `req.params.name` 更改为 `req.name` 来访问它，因为我们在中间件中获取了 `req.params.name`\
    \ 并将其存储到 `req` 中。\n\n当我们访问浏览器 `http://localhost:1337/admin/hello/sally` 时，我们会在控制台中看到请求。\n\
    \n![Express Router Middleware](img/07-node-routing----express-router-middleware.png)\n\
    \nExpress Router Parameter Middleware\n\n参数路由中间件可以验证传入应用程序的数据。如果你也创建了 RESTful\
    \ API，你可以验证令牌并确保用户能够访问你的信息。我们到目前为止所做的工作将导致构建我们在第 3 章讨论客户端服务器模型时提到的服务器端应用程序。\n\n\
    我们将查看的最后一个 Express 路由功能是如何使用 `app.route()` 同时定义多个路由。\n\n#### 登录路由 (`app.route()`)\n\
    \n我们可以直接在应用上定义路由。这类似于使用 `app.get`，但我们将使用 `app.route`。`app.route` 基本上是调用 Express\
    \ Router 的快捷方式。与其调用 `express.Router()`，我们可以调用 `app.route` 并那里开始应用路由。\n\n使用 `app.route()`\
    \ 允许我们在单个登录路由上定义多个操作。我们需要一个 `GET` 路由来显示登录表单，以及一个 `POST` 路由来处理登录表单。\n\n```\n1 app.route('/login')\n\
    2 \n3 \t// 显示表单 (GET http://localhost:1337/login)\n4 \t.get(function(req, res)\
    \ {\n5 \t\tres.send('this is the login form');\n6 \t})\n7 \n8 \t// 处理表单 (POST\
    \ http://localhost:1337/login)\n9 \t.post(function(req, res) {\n10 \t\tconsole.log('processing');\n\
    11 \t\tres.send('processing the login form!');\n12 \t});\n```\n\n现在我们为 `/login`\
    \ 路由定义了两个不同的操作。简单且非常整洁。这些直接应用于 `server.js` 文件中的主 `app` 对象，但我们也可以在早先创建的 `adminRouter`\
    \ 对象中定义它们。\n\n"
- fmt: "\nThis is a good method for setting up routes since it is clean and makes\
    \ it easy to see which routes are applied where. We’ll be building a RESTful API\
    \ soon and one of the main things we should do is use different HTTP verbs to\
    \ signify actions on our application. `GET /login` will provide the login form\
    \ while `POST /login` will process the login.\n\n## Recap\n\nWith the Express\
    \ Router, we are given much flexibility when defining routes. To recap, we can:\n\
    \n* Use `express.Router()` multiple times to define groups of routes\n* Apply\
    \ the `express.Router()` to a section of our site using `app.use()`.\n* Use route\
    \ middleware to process requests\n* Use route middleware to validate parameters\
    \ using `.param()`.\n* Use `app.route()` as a shortcut to the Router to define\
    \ multiple requests on a route\n\nNow that we’ve got a solid foundation of Node\
    \ and Express, let’s move forward and talk a little more about MongoDB. Then we’ll\
    \ get to the main part of our server-side applications: Building APIs!\n\n## Using\
    \ MongoDB\n\nMongoDB has been touted as an easy to use database that provides\
    \ high performance and availability. We’ve already spoken on the virtues of MongoDB\
    \ in the Primers section of the book (Chapter 3).\n\nIn this chapter, we will\
    \ talk about installing MongoDB and using it locally so that we are able to use\
    \ it for future applications.\n\n![MongoDB](images/08-mongodb----mongodb.png \"\
    MongoDB\")\n\n### MongoDB\n\nIn addition to installing MongoDB locally, we will\
    \ create a database on a hosted solution like [Modulus.io](https://modulus.io/)\
    \ or [mongolab](https://mongolab.com/).\n\n![Mongolab](images/08-mongodb----mongolab.jpg\
    \ \"Mongolab\")\n\n### Mongolab\n\nTo reiterate the benefits of MongoDB in a stack\
    \ like the MEAN stack, the `document-oriented storage` allows us to make development\
    \ easier across the entire stack. Since we are using JSON style documents in our\
    \ database, they can be used the same way all the way from the database (`MongoDB`)\
    \ to the server (`Node.js`) to the front-end (`AngularJS`).\n\nLet’s get to the\
    \ installation and simple usage of MongoDB.\n\n### Installing MongoDB Locally\n\
    \nThere are a few steps to know when using MongoDB locally. This process is the\
    \ same for the different OSes, although the small details of each step may be\
    \ different. The main steps are:\n\n1. Install MongoDB\n2. Create a folder (with\
    \ proper permissions) to store database data\n3. Start the MongoDB service\n4.\
    \ Connect or use in an application after the service is started\n\nLet’s get to\
    \ the installation procedures for Mac and Windows (Linux instructions can be found\
    \ at the [MongoDB docs](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-ubuntu/)),\
    \ and then we will move onto some basic commands that can be used within MongoDB.\n\
    \n#### Mac Installation\n\nThe default folder when [installing on a Mac] will\
    \ be `/data/db`. This is where everything will be stored and you must make sure\
    \ that you have permissions to this folder so that MongoDB can write to it.\n\n\
    We can install on Macs using either Homebrew or [manually](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x/#install-mongodb-manually).\
    \ We’ll be focusing on Homebrew for this article.\n\n```\n1 // update your packages\n\
    2 $ brew update\n3 \n4 \n5 // install mongoDB\n6 $ brew install mongodb\n```\n\
    \nMake sure that everything works by running:\n\n```\n1 $ mongod\n```\n\nThis\
    \ will start the MongoDB service and you should see `waiting for connections on\
    \ port 27017`. If you see an error about permissions, make sure you change the\
    \ permissions on your `/data/db` folder so that you have the proper permissions.\n\
    \n![Starting MongoDB Service](images/08-mongodb----mongo-start.jpg)\n\nStarting\
    \ MongoDB Service\n\nNow that the MongoDB service has started, we can connect\
    \ to it using:\n\n`mongo`\n\nMake sure that you run this command in a separate\
    \ terminal so that we are sure the service is still running.\n\n![Connecting to\
    \ MongoDB](images/08-mongodb----mongo-connect.jpg)\n\nConnecting to MongoDB\n\n\
    You will see the connection happen on the terminal where the service is started.\
    \ Go ahead and skip past this next section on Windows installation and we’ll get\
    \ to using MongoDB with simple commands.\n\n#### Windows Installation\n\nWindows\
    \ setup is fairly straightforward. Start by downloading MongoDB [here](http://www.mongodb.org/downloads).\
    \ Once that downloads, you’re going to want to add the path to the MongoDB executable\
    \ (usually the Program Files folder) to your environment variables so that you\
    \ can run Mongo without explicitly typing the full path every single time.\n\n\
    Open up your Environment Variables and enter the path to the bin folder where\
    \ you installed MongoDB (we are using `C:\\Program Files\\MongoDB 2.6 Standard\\\
    bin`). If you already have something in your PATH variable, you can add a semi-colon\
    \ and insert the new path right after.\n\n![MongoDB Environment Variable](images/08-mongodb----environment-variables.png\
    \ \"MongoDB Environment Variable\")\n\nMongoDB Environment Variable\n\nNow you\
    \ should be able to run:\n\n`mongod`\n\nin your command line. One common error\
    \ you may get is `dbpath (\\data\\db) does not exist`. If you receive this error,\
    \ go ahead and create this path inside of your C directory ‘C:\\data\\db’. This\
    \ is where all your data will be stored.\n\nIf you would like to specify a path\
    \ different than the default `data/db`, you can pass in a path like so:\n\n`mongod\
    \ --dbpath path/to/folder`\n\nOnce you create the path, start up mongo with ‘mongod.exe\
    \ `C:Program Files` and you should see “waiting for connections on port 27017”.\
    \ If you see an error about permissions, make sure you change the permissions\
    \ on your `/data/db` folder so that you have the proper permissions.\n\n![Starting\
    \ MongoDB](images/08-mongodb----mongo.jpg)\n\nStarting MongoDB Service\n\nNow\
    \ that the MongoDB service has started, we can connect to it using:\n\n`mongo`\n\
    \nMake sure that you run this command in a separate terminal so that we are sure\
    \ the service is still running.\n\n![Connecting to MongoDB](images/08-mongodb----mongo-connect.jpg)\n\
    \nConnecting to MongoDB\n\nYou will see the connection happen on the terminal\
    \ where the service is started. Go ahead and skip past this next section on Windows\
    \ installation and we’ll get to using MongoDB with simple commands.\n\n### Common\
    \ Database Commands\n\nQueries in a database system may be a little different\
    \ than what you’re used to. Rather than making a query for tables, we’re querying\
    \ collections of documents.\n\nSince everything is stored in JSON style documents,\
    \ our syntax will be similar to how we query our applications.\n\nOnce we have\
    \ connected to MongoDB using `mongod` and `mongo`, we can start viewing the available\
    \ databases and using them. Here are the common commands.\n\n#### List All Databases\n\
    \n```\n1 $ show databases\n```\n\n#### Creating a Database\n\n**MongoDB will not\
    \ create a database unless you insert information into that database.**\n\nThe\
    \ trick is you don’t have to worry about explicitly creating a database! You can\
    \ just use a database (even if it’s not created), create a collection and document,\
    \ and everything will automatically be made for you!\n\nWe’ll look at creating\
    \ collections and documents in the CRUD section.\n\n#### Show Current Database\n\
    \n```\n1 $ db\n```\n\n#### Select a Database\n\n```\n1 $ use db_name\n```\n\n\
    Now that we have the database basics, let’s get to the main CRUD commands.\n\n\
    ### CRUD Commands\n\nBy using the following commands, we can get familiar with\
    \ MongoDB commands. These commands will be similar to how we handle CRUD operations\
    \ in our Node.js applications.\n\n#### Create\n\n```\n1 // save one user\n2 $\
    \ db.users.save({ name: 'Chris' });\n3 \n4 // save multiple users\n5 $ db.users.save([{\
    \ name: 'Chris'}, { name: 'Holly' }]);\n```\n\nBy saving a document into the `users`\
    \ collection of the database you are currently in, you have successfully created\
    \ both the database and collection if they did not already exist.\n\n#### Read\n\
    \n```\n1 // show all users\n2 $ db.users.find();\n3 \n4 // find a specific user\n\
    5 $ db.users.find({ name: 'Holly' });\n```\n\n#### Update\n\n```\n1 db.users.update({\
    \ name: 'Holly' }, { name: 'Holly Lloyd' });\n```\n\n#### Delete\n\n```\n1 //\
    \ remove all\n2 db.users.remove({});\n3 \n4 // remove one\n5 db.users.remove({\
    \ name: 'Holly' });\n```\n"
