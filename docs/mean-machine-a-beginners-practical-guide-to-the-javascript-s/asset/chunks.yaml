    \ less = require('gulp-less');\n 4 \n 5 // define a task called css\n 6 gulp.task('css',\
    \ function() {\n 7 \n 8   // grab the less file, process the LESS, save to style.css\n\
    \ 9   return gulp.src('public/assets/css/style.less')\n10     .pipe(less())\n\
    11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n```\n\nCongratulations,\
    \ you’ve just made your first Gulp task! Now all we have to do is go back into\
    \ our command line and type:\n\n```\n1 $ gulp css\n```\n\nThat tells Gulp to run\
    \ that specific task and then we can see that our new `style.css` file will be\
    \ generated in the `gulp.dest()` folder that we specified.\n\n![LESS Compiled](images/19-mean-workflow----less.jpg)\n\
    \nLESS Compiled\n\nYou can see that the LESS is compiled to CSS just as we would\
    \ expect.\n\n![LESS vs. CSS](images/19-mean-workflow----less-to-css.jpg)\n\nLESS\
    \ vs. CSS\n\n#### Minifying CSS\n\nThe great thing about Gulp is that we are able\
    \ to pipe a file (or multiple files) through more than one package in one task.\
    \ Let’s see how we can add CSS minifying to this so that we have a `style.min.css`\
    \ to use in production.\n\nFirst install the [gulp-minify-css](https://www.npmjs.com/package/gulp-minify-css)\
    \ package as well as a package called [gulp-rename](https://www.npmjs.com/package/gulp-rename)\
    \ so that we can rename our file to `style.min.css`:\n\n```\n1 $ npm install gulp-minify-css\
    \ gulp-rename --save-dev\n```\n\nNow we can add it to our `gulpfile.js` and use\
    \ it in the `css` task.\n\n```\n 1 // load the plugins\n 2 var gulp      = require('gulp');\n\
    \ 3 var less      = require('gulp-less');\n 4 var minifyCSS = require('gulp-minify-css');\n\
    \ 5 var rename    = require('gulp-rename');\n 6 \n 7 // define a task called css\n\
    \ 8 gulp.task('css', function() {\n 9 \n10   // grab the less file, process the\
    \ LESS, save to style.css\n11   return gulp.src('public/assets/css/style.less')\n\
    12     .pipe(less())\n13     .pipe(minifyCSS())\n14     .pipe(rename({ suffix:\
    \ '.min' }))\n15     .pipe(gulp.dest('public/assets/css'));\n16 \n17 });\n```\n\
    \nNow when we run\n\n```\n1 $ gulp css\n```\n\nWe can see a new `style.min.css`\
    \ file created and it is compiled LESS and minified! We can now go into our `index.html`\
    \ file and add our new CSS file:\n\n```\n1 <link rel=\"stylesheet\" href=\"assets/css/style.min.css\"\
    >\n```\n\nAll those colors. Isn’t it pretty?\n\n![Site with LESS](images/19-mean-workflow----site-with-less.jpg)\n\
    \nSite with LESS\n\n#### Using a Gulp Package\n\nThe process for using a Gulp\
    \ package is similar to what we just did with LESS.\n\n1.  Install the package\
    \ and `--save-dev`\n\n2.  Load the plugin in your `gulpfile.js`\n\n3.  Configure\
    \ a task and use the plugin!\n\nGulp is easier to configure than Grunt, but the\
    \ concept is the same: install a package, load it, and configure. Let’s move onto\
    \ other important tasks that deal with JS.\n\n#### Linting JS\n\nLet’s make sure\
    \ that our JS files have no errors. This includes our Node and Angular files.\
    \ We’ll be using a JSHint plugin called [gulp-jshint](https://www.npmjs.com/package/gulp-jshint)\
    \ for this task.\n\nLet’s install this new package:\n\n```\n1 $ npm install gulp-jshint\
    \ --save-dev\n```\n\nNow let’s bring it into our `gulpfile.js` and create a brand\
    \ new task called `js`.\n\n```\n 1 ...\n 2 var jshint = require('gulp-jshint');\n\
    \ 3 \n 4 // css task goes here\n 5 \n 6 // task for linting js files\n 7 gulp.task('js',\
    \ function() {\n 8 \n 9   return gulp.src(['server.js', 'public/app/*.js', 'public/app/**/*.js'])\n\
    10     .pipe(jshint())\n11     .pipe(jshint.reporter('default'));\n12 \n13 });\n\
    ```\n\nThe cool thing we are doing here is using multiple files (passed in as\
    \ an array) to `gulp.src()`. We are also using the `*` wildcard to match any files\
    \ in the **public/app/** folder and any files in subfolders of that folder.\n\n\
    Go into `server.js` and delete a semicolon so that there is something for our\
    \ jshint to find. Now type:\n\n```\n1 $ gulp js\n```\n\nAnd we will see the error!\n\
    \n![JSHint](images/19-mean-workflow----js-error.jpg)\n\nJSHint\n\n#### Minifying,\
    \ and Concatenating JS\n\nCurrently, the `<head>` of our applications have looked\
    \ like this:\n\n```\n 1 <head>\n 2   <meta charset=\"UTF-8\">\n 3   <title>Workflow!</title>\n\
    \ 4 \n 5   <!-- For Angular Routing -->\n 6   <base href='/'>\n 7 \n 8   <!--\
    \ CSS -->\n 9   <link rel=\"stylesheet\" href=\"//maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/boo\\\
    \n10 tstrap.min.css\">\n11   <link rel=\"stylesheet\" href=\"assets/css/style.css\"\
    >\n12 \n13   <!-- JS / LIBS -->\n14   <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"\
    ><\\\n15 /script>\n16   <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-route.js\"\
    \\\n17 ></script>\n18 \n19   <!-- APP -->\n20   <script src=\"app/controllers/mainCtrl.js\"\
    ></script>\n21   <script src=\"app/app.routes.js\"></script>\n22   <script src=\"\
    app/app.js\"></script>\n23 </head>\n```\n\nAs our applications start to grow,\
    \ then we’ll have many more requests which will bog down the performance of our\
    \ application, especially with the custom Angular components we will have like\
    \ controllers and services.\n\nWe will be using two packages to minify and concatenate\
    \ (bundle together) our JS files so that we will only need to load a single JS\
    \ file. Our `index.html` file will look very clean with only one JS file to load!\n\
    \nLet’s install the two packages, [gulp-uglify](https://www.npmjs.com/package/gulp-uglify)\
    \ (for minifying) and [gulp-concat](https://github.com/wearefractal/gulp-concat).\n\
    \n```\n1 $ npm install gulp-uglify gulp-concat --save-dev\n```\n\nLet’s add them\
    \ to our `gulpfile.js` and create a new task just for our frontend JS resources\
    \ since we don’t want our backend Node files loaded on the frontend.\n\n```\n\
    \ 1 var concat = require('gulp-concat');\n 2 var uglify = require('gulp-uglify');\n\
    \ 3 \n 4 // task to lint, minify, and concat frontend files\n 5 gulp.task('scripts',\
    \ function() {\n 6   return gulp.src(['public/app/*.js', 'public/app/**/*.js'])\n\
    \ 7     .pipe(jshint())\n 8     .pipe(jshint.reporter('default'))\n 9     .pipe(concat('all.js'))\n\
    10     .pipe(uglify())\n11     .pipe(gulp.dest('public/dist'));\n12 });\n```\n\
    \nThis new `scripts` task will take all of our frontend Angular files, and bundle\
    \ them all together in a file called **public/dist/all.js**.\n\nSure enough, that\
    \ file shows all of our Angular files (controller, route, and main app file).\n\
    \n![All JS](images/19-mean-workflow----all.jpg)\n\nAll JS\n\nWe can do the same\
    \ for all of our Angular library files like `angular` and `angular-route` as well.\
    \ Just add them to the `gulp.src()` array.\n\n#### Minifying Angular\n\nThere\
    \ is a problem however when we minify Angular files. Angular files have to be\
    \ declared a certain way or the minifying process will break them.\n\n##### The\
    \ Way to Declare Angular Modules for Minification\n\nSo far in this book, we have\
    \ gone with the easier way of defining modules for simplicity. This looks like\
    \ the following:"
