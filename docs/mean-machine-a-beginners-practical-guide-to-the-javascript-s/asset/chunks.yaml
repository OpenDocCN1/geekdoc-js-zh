  trans: "\n虽然这个网站无需刷新页面即可路由已经很酷了，但我们将通过为页面添加动画让它变得更酷。你可能已经见过点击项目时会滑入和滑出视图的移动应用。我们将刚刚构建的内容变成一个整洁且令人深刻的动画网站（别担心，它不会太花哨的……除非你希望那样）。\n\
    \n***\n\n![注意：ngRoute 的替代方案](img/icon-pencil.png \"注意\")\n\n#### 注意：ngRoute 的替代方案\n\
    \n虽然 `ngRoute` 是为了与 Angular 配合得最紧密而构建的路由工具，但另一个名为 `UI Router` 的工具是由 AngularUI\
    \ 团队构建的另一个路由框架。[AngularUI](http://angular-ui.github.io/) 是与 Angular 应用紧密配合的配套套件。它们提供了许多实用的工具，如\
    \ `UI Router`、用于在 Angular 中使用 Bootstrap JavaScript 组件的 `UI Bootstrap` 以及其他一些非常棒的工具。\n\
    \n`UI Router` 提供了与 `ngRoute` 不同的方法，它根据应用程序的状态而非仅仅是路由 URL 来更改你的应用程序视图。这意味着你的应用程序没有绑定到\
    \ URL 路径，你可以根据应用程序状态（例如，用户是否登录）来调整显示的模板。\n\n拥有嵌套状态的能力也有许多益处。`ngRoute` 不提供此功能，而对于更高级的\
    \ UI，拥有嵌套状态是有帮助的，例如拥有多个侧边栏面板以及移动组件，这些在移动应用中会更常见。\n\n我们将我们将使用 `ngRoute` 因为它是标准做法，但如果想阅读关于\
    \ `UI Router` 的更多内容，这里有一个很好的入门文章：[使用 UI-Router 进行 AngularJS 路由](http://scotch.io/tutorials/javascript/angular-routing-using-ui-router)。未来，Angular\
    \ 团队已表示，他们构建的下一个路由模块将包含 `ngRoute` 和 `UI Router` 的功能。\n\n***\n\n## 为 Angular 应用添加动画\n\
    \n如果这些出色的单页应用表现得不像单页应用，那么创建它们的意义何在？我们希望应用程序尽可能像原生应用，这样我们就可以模糊 Web 应用与原生应用之间的界限，给用户留下更深的印象。\n\
    \nAngularJS 提供了一种创建单页应用的很好的方法。由于我们是单页应用，这使得网站感觉越来越像原生移动应用。为了让它感觉更原生，我们可以使用 [ngAnimate\
    \ 模块](http://docs.angularjs.org/api/ngAnimate) 添加过渡和动画。\n\n该模块允许我们创建外观精美的应用程序，我们将查看如何为\
    \ ng-view 添加动画。\n\n### 为我们的路由应用添加动画\n\n我们将为上一章中构建的单页应用添加动画。得益于我们的路由，当人们在页面之间点击时网站不会刷新。现在我们将：\n\
    \n*   让 `ngRoute` 处理路由（在上一章已完成）\n*   使用 `ngAnimate` 创建页面动画\n*   使用 `CSS 动画` 处理页面动画\n\
    \n在开始动画之前，让我们聊聊 `ngAnimate 模块` 是如何工作的。\n\n#### ngAnimate 模块是如何工作的？\n\n`ngAnimate`\
    \ 会根据元素进入或离开视图，向不同的 Angular 指令添加或移除 CSS 类。这会自动发生，我们不需要配置任何内容。\n\n当我们加载网站时自动添加和移除的类是\
    \ `.ng-enter` 或 `.ng-leave`。这些类被应用于应用 `ng-view` 指令的 div 上。我们现在还看不到这些，但如果你在页面之间点击时进入浏览器检查器，你会看到\
    \ `.ng-enter` 和 `.ng-leave` 类被应用。\n\n#### 动画是如何应用的\n\n该模块保持了内容的简洁和简单。它所做的只是添加类。但它是如何创建动画的呢？实际上它并没有。它为我们提供了所需的工具，然后我们通过创建\
    \ CSS 动画来控制动画。通过使用 CSS 动画，我们确保应用程序可以在移动浏览器、桌面端浏览器中工作，并符合最新标准（CSS3）。\n\n我们将使用 [Animate.css](http://daneden.github.io/animate.css/)\
    \ 项目的 CSS 动画，因为那些类（https://github.com/daneden/animate.css/blob/master/animate.css）可以很容易地引入我们自己的项目中。\n\
    \n#### 使用动画的指令\n\n`ngAnimate` 还会自动将这些类应用于更多的 Angular 指令。除了 `ngView` 模块外，这些类还被应用于\
    \ `ngRepeat`、`ngInclude`、`ngIf`、`ngSwitch`、`ngShow`、`ngHide`、`ngView` 和 `ngClass`。这意味着你可以对应用程序的多个部分添加动画。在本章中我们将关注\
    \ `ngView`，但这些策略可以很容易地应用于其他指令。\n\n#### 为我们的路由应用添加动画\n\n在上一章的应用程序中使用 `ngAnimate`\
    \ 模块有三个步骤：\n\n1.  链接到 `angular-animate.js` 文件\n2.  将 `ngAnimate` 模块注入到我们的主 Angular\
    \ 模块中\n3.  添加 `animate.css` 样式表以获得构建的 CSS 动画\n\n我们将使用 CDN 获取所需的 `angular-animate.js`\
    \ 和 `animate.css` 资源。回到你的 `index.html` 文件并将这两个资源添加到文档的 `<head>` 中。\n\n```\n 1\
    \ <head>\n 2     <meta charset=\"utf-8\">\n 3     <title>My Routing App!</title>\n\
    \ 4 \n 5     <!-- 设置路由的基路径 -->\n 6     <base href=\"/\">\n 7 \n 8     <!-- CSS\
    \ -->\n 9     <!-- 加载 bootstrap 和 fontawesome -->\n 10    <link rel=\"stylesheet\"\
    \ href=\"https://stackpath.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    >\n 11    <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n 12    <!-- 加载 animate.css -->\n 13    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css\"\
    >\n 14    \n 15     <!-- JS -->\n 16    <!-- 加载 angular, angular-route 和 angular-animate\
    \ -->\n 17    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular.min.js\"\
    ></script>\n 18    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-route.min.js\"\
    ></script>\n 19    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-animate.min.js\"\
    ></script>\n 20    \n 21    <script src=\"js/app.js\"></script>\n 22    <script\
    \ src=\"js/routes.js\"></script>\n 23 </head>\n```\n\n对于需要的 `angular-animate.js`\
    \ 和 `animate.css` 资源，我们将使用 CDN。回到你的 `index.html` 文件并将这两个资源添加到文档的 `<head>` 中。\n\
    \n（上述代码块中的注释已根据逻辑进行了翻译和对齐）\n"
- fmt: "\n```\n1     <link rel=\"stylesheet\" href=\"css/style.css\">\n```\n\nThe\
    \ other change that we will make is to wrap our `<div ng-view></div>` with another\
    \ div so that we can call it specifically. This will look like so:\n\n```\n1 \
    \    <div id=\"content-views\">\n2         <div ng-view></div>\n3     </div>\n\
    ```\n\nNow we just need to go into our newly created stylesheet and add our styles.\
    \ Don’t forget to link your stylesheet `<link rel=\"stylesheet\" href=\"css/style.css\"\
    \ />` in your `index.html`.\n\n```\n     body                          { padding-top:50px;\
    \ }\n\n     #content-views                { position:relative; }\n\n     .ng-enter,\
    \ .ng-leave          { width:100%; position:absolute; }\n     .ng-enter      \
    \               { \n       -webkit-animation:zoomInDown 1.2s both ease-in; \n\
    \       -moz-animation:zoomInDown 1.2s both ease-in; \n         animation:zoomInDown\
    \ 1.2s both ease-in; \n     }\n     .ng-leave                     { \n       -webkit-animation:zoomOutDown\
    \ 0.5s both ease-in; \n       -moz-animation:zoomOutDown 0.5s both ease-in; \n\
    \         animation:zoomOutDown 0.5s both ease-in; \n     }\n```\n\n**Vendor Prefixes**:\
    \ Make sure you add the `-moz-animation` and `-webkit-animation` vendor prefixes\
    \ when pushing this code to production for cross compatibility in browsers.\n\n\
    Go ahead and click through the pages in your application and watch as the pages\
    \ fly out and fly in! Just like that, we have an animated application! Feel free\
    \ to try out the rest of the [animate.css](http://daneden.github.io/animate.css/)\
    \ classes to see the crazy different effects you can create.\n\n### Conclusion\n\
    \nThis should give you just a sample of how putting together the Angular routing\
    \ and animating modules together can quickly build complex looking apps. These\
    \ techniques can be used to build a multitude of applications in all sorts of\
    \ different styles. So far, on the Angular side of things we have:\n\n*   Set\
    \ up an AngularJS module\n*   Applied Angular to our HTML views\n*   Routed our\
    \ application using `ngRoute`\n*   Animated our application using `ngAnimate`\
    \ and CSS classes\n\nHaving the knowledge of the above will let us build awesome\
    \ looking applications. We’ll explore these concepts further as we build out more\
    \ sample applications in the coming chapters.\n\nWe’ve focused on the frontend\
    \ Angular parts so far; next up is how to make Angular applications dynamic. We’ll\
    \ be moving towards integrating the frontend and the backend, but first let’s\
    \ make sure that the foundation of our application is solid so that our applications\
    \ are scalable and easy to understand.\n\n## MEAN Stack Application Structure\n\
    \nUp to this point, we’ve been able to place most of our code into a few main\
    \ files (`server.js` for Node and `app.js` for Angular). As we start moving to\
    \ larger MEAN stack applications, keeping all of our code bunched into these main\
    \ files will become cumbersome. It will be hard to maintain our code, find certain\
    \ parts of our applications, and worst of all, share convoluted code with other\
    \ developers.\n\nWith this in mind, let’s take a look at our application structure.\
    \ Organizing something this simple goes a long way. This will be a short chapter,\
    \ but a very important one.\n\n### Sample Organization\n\nSo far, our applications\
    \ have had this file structure:\n\n```\n // node applications\n - app/\n -----\
    \ models/\n\n // angular applications\n - public/\n ----- css/\n ----- js/\n----------\
    \ controllers/\n---------- services/\n ----- app.js\n ----- views/\n----------\
    \ pages/\n ----- index.html\n\n - package.json\n - server.js\n```\n\nOn the **Node\
    \ side of things**, we can’t keep everything in `server.js`. That file could become\
    \ a giant spaghetti mix of code when we start putting more routes, more configuration,\
    \ and more application functionality. That has to be broken down into a more organized\
    \ structure.\n\nOn the **Angular side of things**, this structure could become\
    \ confusing. Where would we put `lib` files like Bootstrap, or Font Awesome? Would\
    \ our `js` folder hold all of those things including our Angular application files?\n\
    \n### A Better Structure\n\nSo what would a better structure look like? Let’s\
    \ combine both the Node and Angular sides since we will be moving towards full\
    \ stack applications next.\n\nHere is a better organization that lays a good foundation\
    \ for our applications. This is a **modular** approach that allows us to add and\
    \ remove components from our applications easily and simply.\n\n```\n - app/\n\
    \ ----- models/\n ----- routes/\n - public/\n ----- assets/  // the base css/js/images\
    \ for our app (not Angular files)\n---------- css/      // some custom css\n----------\
    \ js/       // some custom js (not Angular files)\n---------- img/\n----------\
    \ libs/     // libraries like bootstrap, angular, font-awesome\n ----- app/  \
    \    // the Angular part of our application\n---------- controllers/\n----------\
    \ services/\n---------- app.js\n---------- app.routes.js\n---------- views/\n\
    ---------- pages/\n ----- index.html\n - package.json\n - server.js\n```\n\n####\
    \ App Folder\n\nWe have our models folder. What’s new is that we have `routes/`\
    \ folder. We can place our routes here. `app.js`.\n\n#### Configuration Files\n\
    \nWe will be moving our configuration variables out of `server.js`. For our purposes,\
    \ we don’t have many configuration variables, just our `port`, our `database`,\
    \ and the `secret` that we will be using when configuring JSON Web Tokens.\n\n\
    Create a new file in the root directory called `config.js`.\n\nThe following is\
    \ all we need:\n\n```\nmodule.exports = {\n  'port': process.env.PORT || 8080,\n\
    \  'database': 'mongodb://node:noder@novus.modulus.net:27017/Iganiq8o',\n  'secret':\
    \ 'ilovescotchscotchyscotchscotch'\n};\n```\n\n#### Public Folder\n\nThis is where\
    \ the majority of movement has happened. Before, we stored everything (Angular\
    \ files and asset files) in `public/js` folder. This can become confusing as our\
    \ application grows so now we have it set up so that assets and application files\
    \ live in separate directories.\n\nAnything Angular specific like controllers,\
    \ services, routes, and views will live in the `app/` folder. Assets like images,\
    \ custom CSS, and libraries will live in the `assets/` folder.\n\nHere we have\
    \ created a `app.routes.js` file. In the future as we create more routes, we may\
    \ want to move these into its own `routes/` folder like we did for the Node side.\n\
    \n#### Routes Folder\n\nWe are just moving routes into a new `routes/api.js` file.\
    \ We can even create multiple routes in its folder.\n\n### Organizing Node.js\
    \ - Backend\n\nSince Chapter 10 was about creating a Node API and authenticating\
    \ it, we only have Node code to work with here.\n\nLet’s see how we can rearrange\
    \ our Node code (say that 10 times fast… Node code, Node code, Node code). Go\
