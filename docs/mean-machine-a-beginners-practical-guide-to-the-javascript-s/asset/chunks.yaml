  trans: "\n\n任何未被 Node 处理的路由都将传递给 Angular。创建路由非常简单。我们将删除为主页创建的路由，并创建以下内容：\n\n```\n\
    \ 1 var path = require('path');\n 2 \n 3 ... \n 4 \n 5 var apiRoutes...\n 6 \n\
    \ 7 // 主通配路由  --------------- \n 8 // 将用户发送到前端 ------------\n 9 // 必须在 API 路由之后注册\n\
    10 app.get('*', function(req, res) {\n11   res.sendFile(path.join(__dirname +\
    \ '/public/app/views/index.html'));\n12 });\n```\n\n确保 `path` 已在包（packages）部分中加载，因为传递\
    \ HTML 文件需要它。使用 `*` 会匹配所有路由。将此路由放在 **API 路由之后** 是非常重要的，因为我们只希望它来捕获未被 Node 处理的路由。\n\
    \n如果将其置于 API 路由之上，我们的用户将始终被发送 `index.html` 文件，而永远无法到达 API 路由。\n\n# 最终的 Node server.js\n\
    \n这里是完整的 `server.js` 文件：\n\n```\n 1 // 基础设置\n 2 // ======================================\n\
    \ 3 \n 4 // 调用包 --------------------\n 5 var express    = require('express');\
    \    // 调用 express\n 6 var app        = express();         // 使用 express 定义我们的应用\n\
    \ 7 var bodyParser = require('body-parser');  // 获取 body-parser\n 8 var morgan\
    \     = require('morgan');     // 用于查看请求\n9 var mongoose   = require('mongoose');\n\
    10 var config     = require('./config');\n11 var path     = require('path');\n\
    12 \n13 // 应用配置 ==================\n14 // ====================================\n\
    15 // 使用 body parser 以便我们可以从 POST 请求中获取信息\n16 app.use(bodyParser.urlencoded({\
    \ extended: true }));\n17 app.use(bodyParser.json())\n18 \n19 配置我们的应用以处理 CORS\
    \ 请求\n20 app.use(function(req, res, next) {\n21   res.setHeader('Access-Control-Allow-Origin',\
    \ '*');\n22   res.setHeader('Access-Control-Allow-Methods', 'GET, POST');\n23\
    \   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
    \ \\\n24 Authorization');\n25   next();\n26 });\n27 \n28 // 将所有请求记录到控制台 \n29 app.use(morgan('dev'))\n\
    \ 30 \n31 连接到我们的数据库（托管在 modulus.io）\n32 mongoose.connect(config.database); \n\
    33 \n34 // 设置静态文件位置\n35 // 用于前端发起的请求\n36 app.use(express.static(__dirname + '/public'));\n\
    37 \n38 // API 路由 =================\n39 // ====================================\n\
    40 \n41 // API 路由 ------------------------\n42 var apiRoutes = require('./app/routes/api')(app,\
    \ express);\n43 app.use('/api', apiRoutes);\n44 \n45 // 主通配路由  ---------------\
    \ \n46 // 将用户发送到前端 ------------\n47 // 必须在 API 路由之后注册\n48 app.get('*', function(req,\
    \ res) {\n49   res.sendFile(path.join(__dirname + '/public/app/views/index.html'));\n\
    50 });\n51 \n52 // 服务器\n53 // ====================================\n54 app.listen(config.port);\n\
    55 console.log('Magic happens on port ' + config.port);\n```\n\n现在我们已经整理好了 Node\
    \ 端的工作，让我们为 Angular 应用程序奠定基础。\n\n# 组织 AngularJS - 前端\n\n在这里我们将创建唯一的文件是 `index.html`\
    \ 文件，因为这是我们通过 Node 通配路由返回的内容。我们只需为应用程序的其他部分创建文件夹，以便准备好基础工作工作。\n\n以下是目前的文件结构：\n\
    \n```\n 1 - app/\n 2 ----- models/\n 3 ----- routes/\n 4 ---------- api.js\n 5\
    \ - public/\n 6 ----- assests/  \n 7 ---------- css/   \n 8 --------------- style.css\
    \   \n 9 ---------- js/\n10 ---------- img/       \n11 ---------- libs/     \n\
    12 ----- app/      \n13 ---------- controllers/\n14 ---------- services/\n15 ----------\
    \ app.routes.js\n16 ---------- app.js\n17 ---------- views/\n18 ---------------\
    \ pages/\n19 --------------- index.html\n20 - package.json\n21 - config.js- server.js\n\
    ```\n\n继续在 `public/` 文件夹中创建文件夹和文件。\n\n这是我们 `index.html` 文件的良好起点：\n\n```\n 1 <!DOCTYPE\
    \ html>\n 2 <html lang=\"en\">\n 3 <head>\n 4   <meta charset=\"UTF-8\">\n 5 \
    \  <title>My MEAN App</title>\n 6 </head>\n 7 <body>\n 8   \n 9 HELLO!\n10 \n\
    11 </body>\n12 </html>\n```\n\n# 测试我们新整理的应用\n\n让我们确保一切都运行正常。\n\n运行\n\n`npm install`\n\
    \n如果你还没有安装依赖项的话。\n\n然后运行\n\n`nodemon server.js`\n\n并在浏览器中访问！\n\n"
- fmt: "\nThe `$http` module can be injected into an Angular module, whether it be\
    \ a controller or service. In the above example, it was injected into a controller.\
    \ However, we do not want to call the `$http` module directly in a controller.\
    \ That logic should be moved into a service so that we have a clear separation\
    \ of duties. Services get the data while the controller receives it and sends\
    \ to our views.\n\nLet’s look at how we can use the `$http` module in a factory.\n\
    \n### A Sample Angular Service\n\nWe’re going to build out a sample factory and\
    \ see how we can use it inside of an Angular controller.\n\n#### Angular Factory\n\
    \nHere’s a quick file called `userService.js` that will access an API that delivers\
    \ user data.\n\n```\n 1 angular.module('stuffService', [])\n 2 \n 3 .factory('Stuff',\
    \ function($http) {\n 4 \n 5   // create the object\n 6   var myFactory = {};\n\
    \ 7 \n 8   // a function to get all the stuff\n 9   myFactory.all = function()\
    \ {\n10     return $http.get('/api/stuff');\n11   };\n12 \n13   return myFactory;\n\
    14 \n15 });\n```\n\nWe have just created our first Angular service! The syntax\
    \ is fairly straightforward. We have a `factory` called `Stuff` and a function\
    \ called `all`. This function will create an HTTP GET call using the `$http` module\
    \ and return a promise object. We can then act on the promise object by accessing\
    \ `success()`, `error()`, or `then()`. For our purposes, `success()` will do just\
    \ fine.\n\n***\n\n![Tip](images/icon-heart.png \"Pro Tip\")\n\nTip\n\n#### Promises\n\
    \nPromises are a hard concept to grasp if you are new to JavaScript development.\
    \ Promises help us deal with the asynchronous nature of JavaScript by acting as\
    \ sort of a placeholder. We make a request for some kind of data and the promise\
    \ will wait for the response so the rest of our program can continue with whatever\
    \ else its doing. Once our promise receives the result, it will notify us and\
    \ we can carry out our next action based on that result whether it be a success\
