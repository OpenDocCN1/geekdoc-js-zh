    \nWe are applying our Angular application to the `<body>` tag and using the controller\
    \ as syntax (`mainController as main`). We’re also loading the `userCtrl.js` that\
    \ we’ll build soon.\n\nAll of our files are loaded for our CSS and our Angular\
    \ application.\n\nWe are making use of the variable `vm.loggedIn` to show if a\
    \ user is logged in or not. The `ngIf` Angular directives will help us show or\
    \ hide the navbar, since a user that isn’t logged in should not be able to see\
    \ it.\n\nWe have also created a logout link that will use the `doLogout()` function\
    \ we created in our `mainController`. Right next to the logout button, we have\
    \ also added a message to say hello to our logged in user. That data came from\
    \ our `mainController` when we called `Auth.getUser()` and bound that information\
    \ to `vm.user`.\n\n* * *\n\n![Tip](images/icon-heart.png \"Pro Tip\")\n\nTip\n\
    \n#### ngIf vs. ngShow/ngHide\n\nThe biggest difference in using ngIf over ngShow\
    \ or ngHide is that ngIf **will not** show that HTML element in view source or\
    \ inspect element.\n\nThis is helpful if you want to hide information that only\
    \ authenticated users should see.\n\n* * *\n\nTo finish off the home page, let’s\
    \ add some custom CSS stylings to our CSS file.\n\n**public/assets/css/style.css**\n\
    \n```\n1 main          {\n2   padding-top:30px; \n3 }\n4 \n5 /* HEADER \n6 =====================\
    \ */\n7 header .navbar    { \n8   border-radius:0;\n9 }\n```\n\nSince we aren’t\
    \ logged in, we won’t see the navbar and our users will just see the welcome text\
    \ and the link to the home page.\n\n![Home Page](images/17-user-crm----user-crm-home.jpg)\n\
    \nHome Page\n\nLet’s move onto creating the login page now so that our users will\
    \ actually be able to login.\n\n### Login Page\n\nWe will need to do two things\
    \ to create our login page:\n\n*   Create the login route\n\n*   Create the login\
    \ view\n\nWe’ll add the login route under the home page route to our `app.routes.js`\
    \ file:\n\n```\n 1   // route for the home page\n 2   .when('/', {\n 3     templateUrl\
    \ : 'app/views/pages/home.html'\n 4   })\n 5 \n 6   // login page\n 7   .when('/login',\
    \ {\n 8     templateUrl : 'app/views/pages/login.html',\n 9       controller \
    \ : 'mainController',\n10       controllerAs: 'login'\n11   });\n```\n\nWe are\
    \ applying the `mainController` to this route in addition to the overall site\
    \ except we are naming the `controllerAs` attribute `login`. This allows us to\
    \ access the `mainControllers` functions using `login.doLogin()`.\n\nLet’s create\
    \ the login view now:\n\n**app/views/pages/login.html**\n\n```\n 1 <div class=\"\
    row col-sm-6 col-sm-offset-3\">\n 2   \n 3 <div class=\"jumbotron\">\n 4   <h1>Login</h1>\
    \    \n 5 \n 6   <form ng-submit=\"login.doLogin()\">\n 7     \n 8     <!-- USERNAME\
    \ INPUT -->\n 9     <div class=\"form-group\">\n10       <label>Username</label>\n\
    11       <input type=\"text\" class=\"form-control\" \n12         ng-model=\"\
    login.loginData.username\">\n13     </div>\n14 \n15     <!-- PASSWORD INPUT -->\n\
    16     <div class=\"form-group\">\n17       <label>Password</label>\n18      \
    \ <input type=\"password\" class=\"form-control\" \n19         ng-model=\"login.loginData.password\"\
    >\n20     </div>\n21 \n22     <!-- LOGIN BUTTON -->\n23     <button type=\"submit\"\
    \ class=\"btn btn-block btn-primary\">\n24       <span>Login</span>\n25     </button>\n\
    26 \n27   </form>\n28 </div>\n29   \n30 </div>\n```\n\n*We have added line breaks\
    \ in the `<input>` tags to make them easier to read.*\n\nWe have created a normal\
    \ login form and bound our Angular functions and variables using `ng-submit` and\
    \ `ng-model`. Our user form will look clean and simple:\n\n![Login Page](images/17-user-crm----login.jpg)\n\
    \nLogin Page\n\nIf we go ahead and enter our credentials (`chris`, `supersecret`),\
    \ then we will be redirected to the `/users` page. That behavior was set in the\
    \ `doLogin()` function we created in `mainController`. The users page doesn’t\
    \ exist yet since we haven’t created the route or views.\n\nLet’s add a few things\
    \ to our login page like a processing icon and handling error messages.\n\n####\
    \ Adding a Processing Icon\n\nIt makes sense to show a processing indicator when\
    \ our form is processing. We can do this with two steps:\n\n1.  Creating a variable\
    \ called `processing`\n\n2.  Adding spinning icons in our views\n\nWhenever a\
    \ user clicks **Login**, we want the view to show a processing icon. When the\
    \ form is done processing, we want the processing button to disappear."
