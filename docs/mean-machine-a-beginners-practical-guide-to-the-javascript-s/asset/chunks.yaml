  trans: "\n这是一种设置路由的好方法，因为它非常整洁，并且便于查看哪些路由被应用于什么地方。我们很快将构建一个 RESTful API，我们应该做的主要事情之一使用不同的\
    \ HTTP 动词来表示对应用程序的操作。`GET /login` 将提供登录表单，而 `POST /login` 将处理登录逻辑。\n\n## 总结\n\n\
    通过 Express Router，我们在定义路由时具有极大的灵活性。回顾一下，我们可以：\n\n* 多次使用 `express.Router()` 来定义一组路由\n\
    * 使用 `app.use()` 将 `express.Router()` 应用于网站的某个部分\n* 使用路由中间件来处理请求\n* 使用路由中间件通过\
    \ `.param()` 验证参数\n* 使用 `app.route()` 作为通往 Router 的快捷方式，在单个路由上定义多个请求\n\n现在我们已经打下了\
    \ Node 和 Express 的坚实基础，让我们继续前进，进一步讨论一下 MongoDB。然后，我们将进入服务器端应用程序的核心部分：构建 API！\n\
    \n## 使用 MongoDB\n\nMongoDB 被推崇为一种易用、提供高性能和高可用性的数据库。我们已经在书的入门章节（第 3 章）中讨论过 MongoDB\
    \ 的优点。\n\n在本章中，我们将讨论安装 MongoDB 并在本地使用它，以便我们将其用于未来的应用程序。\n\n![MongoDB](img/08-mongodb----mongodb.png\
    \ \"MongoDB\")\n\n### MongoDB\n\n除了在本地安装 MongoDB 之外，我们将在像 [Modulus.io](https://modulus.io/)\
    \ 或 [mongolab](https://mongolab.com/) 这样的托管解决方案创建一个数据库。\n\n![Mongolab](img/08-mongodb----mongolab.jpg\
    \ \"Mongolab\")\n\n### Mongolab\n\n为了重申 MongoDB 在像 MEAN 等技术栈中的优势，`面向文档的存储` 让我们整个技术栈的开发变得更加简单。由于我们在数据库中使用\
    \ JSON 风格的文档，它们可以从数据库 (`MongoDB`) 到服务器 (`Node.js`) 再到前端 (`AngularJS`) 一直以相同的方式使用。\n\
    \n让我们开始 MongoDB 的安装和简单用法。\n\n### 在本地安装 MongoDB\n\n在本地使用 MongoDB 时，有几个步骤需要注意。这个过程对于不同的操作系统是相同的，尽管每个步骤的细微细节可能不同。主要步骤如下：\n\
    \n1. 安装 MongoDB\n2. 创建一个文件夹（具有适当权限）来存储数据库数据\n3. 启动 MongoDB 服务\n4. 在服务启动后连接或在应用程序中使用\n\
    \n让我们查看 Mac 和 Windows 的安装步骤（Linux 指南可以在 [MongoDB 文档](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-ubuntu/)\
    \ 中找到），然后我们将转向可以在 MongoDB 中使用的基本命令。\n\n#### Mac 安装\n\n[在 Mac 上安装]时，默认文件夹为 `/data/db`。这是存储所有内容的地方，你必须确保你拥有该文件夹的权限，以便\
    \ MongoDB 可以向其写入。\n\n我们可以使用 Homebrew 或 [手动](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x/#install-mongodb-manually)\
    \ 在 Mac 上安装。本文将重点关注 Homebrew。\n\n```\n1 // 更新你的包\n2 $ brew update\n3 \n4 \n5 //\
    \ 安装 mongoDB\n6 $ brew install mongodb\n```\n\n运行以下命令以确保一切运行正常：\n\n```\n1 $ mongod\n\
    ```\n\n这将启动 MongoDB 服务，你应该会看到 `waiting for connections on port 27017`。如果你看到关于权限的错误，请确保你更改了\
    \ `/data/db` 文件夹的权限，以便你拥有适当的权限。\n\n![Starting MongoDB Service](img/08-mongodb----mongo-start.jpg)\n\
    \n启动 MongoDB 服务\n\n现在 MongoDB 服务已经启动，我们可以使用以下命令连接到它：\n\n`mongo`\n\n确保你在独立的终端窗口中运行此命令，以便我们确定服务仍在运行。\n\
    \n![Connecting to MongoDB](img/08-mongodb----mongo-connect.jpg)\n\n连接到 MongoDB\n\
    \n你将在启动服务的终端上看到连接发生。请直接跳过此处关于 Windows 安装的下一章节，我们将通过简单命令使用 MongoDB。\n\n#### Windows\
    \ 安装\n\nWindows 的设置非常直观。首先从[此处](http://www.mongodb.org/downloads) 下载 MongoDB。下载完成后，你可能需要将\
    \ MongoDB 可执行文件的路径（通常是 Program Files 文件夹）添加到你的环境变量中，这样你就不需要每次都显式地输入完整路径来运行 Mongo。\n\
    \n打开你的环境变量，输入你安装 MongoDB 的 bin 文件夹路径（我们使用的是 `C:\\Program Files\\MongoDB 2.6 Standard\\\
    bin`）。如果你已经在 PATH 变量中有了自己的内容，可以添加一个分号并紧随其插入新路径。\n\n![MongoDB Environment Variable](img/08-mongodb----environment-variables.png\
    \ \"MongoDB Environment Variable\")\n\nMongoDB 环境变量\n\n现在你应该能够在命令行中运行：\n\n`mongod`\n\
    \n你可能会遇到的常见错误是 `dbpath (\\data\\db) does not exist`。如果你收到此错误，请在你的 C 目录下创建此路径 `C:\\\
    data\\db`。这是你所有数据存储的地方。\n\n如果你想指定与默认 `data/db` 不同的路径，可以像这样传递路径：\n\n`mongod --dbpath\
    \ path/to/folder`\n\n一旦创建了路径，使用 `mongod.exe C:Program Files` 启动 mongo，你应该就会看到“waiting\
    \ for connections on port 27017”。如果你看到关于权限的错误，请确保更改了 `/data/db` 文件夹的权限，以便你拥有适当的权限。\n\
    \n![Starting MongoDB Service](img/08-mongodb----mongo-start.jpg)\n\n启动 MongoDB\
    \ 服务\n\n现在 MongoDB 服务已经启动，我们可以使用以下命令连接到它：\n\n确保你在独立的终端中运行此命令，以便我们确定服务仍在运行。\n\n\
    ![Connecting to MongoDB](img/08-mongodb----mongo-connect.jpg)\n\n连接到 MongoDB\n\
    \n你将在启动服务的终端上看到连接发生。请直接跳过此处关于 Windows 安装的下一章节，我们将通过简单命令使用 MongoDB。\n\n### 常用数据库命令\n\
    \n在数据库中的查询可能与你习惯的有所不同。与其查询表，我们是在查询文档集合。\n\n由于数据是以 JSON 风格的文档存储的，我们的语法与我们的应用程序相似。\n\
    \n一旦我们通过 `mongod` 和 `mongo` 连接到 MongoDB，就可以查看并使用数据库了。这里是常用命令。\n\n#### 列出所有数据库\n\
    \n```\n1 $ show databases\n```\n\n#### 创建数据库\n\n**除非向数据库插入信息，否则 MongoDB 不创建数据库。**\n\
    \n技巧是你不需要式创建数据库！只需使用数据库（即使它尚未创建）、创建集合和文档，一切都会为你创建！\n\n我们将在 CRUD 部分查看集合和文档。\n\n\
    #### 显示当前数据库\n\n```\n1 $ db\n```\n\n#### 选择数据库\n\n```\n1 $ use db_name\n```\n\n\
    现在我们有了数据库的基础，让我们进入主要的 CRUD 命令。\n\n### CRUD 命令\n\n通过以下命令，我们可以熟悉 MongoDB 命令。这些命令与我们在\
    \ Node.js 应用程序中处理 CRUD 操作相似。\n\n#### 创建\n\n```\n1 // 保存一个用户\n2 $ db.users.save({\
    \ name: 'Chris' });\n3 \n4 // 保存多个用户\n5 $ db.users.save([{ name: 'Chris'}, { name:\
    \ 'Holly' }]);\n```\n\n通过将文档保存到当前数据库的 `users` 集合中，如果它们尚不存在，你就成功地创建了数据库和集合。\n\n\
    #### 读取\n\n```\n1 // 显示所有用户\n2 $ db.users.find();\n3 \n4 // 查找特定用户\n5 $ db.users.find({\
    \ name: 'Holly' });\n```\n\n#### 更新\n\n```\n1 db.users.update({ name: 'Holly'\
    \ }, { name: 'Holly Lloyd' });\n```\n\n#### 删除\n\n```\n1 // 删除所有\n2 db.users.remove({});\n\
    3 \n4 // 删除一个\n5 db.users.remove({ name: 'Holly' });\n```\n"
- fmt: "\nThis is just a quick overview of the types of commands you can run. The\
    \ [MongoDB docs](http://docs.mongodb.org/manual/core/crud-introduction/) are quite\
    \ comprehensive and provide a great deal of detail for those that want to dive\
    \ deeper.\n\nMongoDB also provides a great [interactive tutorial](http://try.mongodb.org/)\
    \ for you to walk through the above commands.\n\n## GUI Tool: Robomongo\n\nWhile\
    \ it’s easy enough to use our command line to get into our MongoDB databases,\
    \ there’s also a GUI for those that are inclined.\n\nGo ahead and download [Robomongo](http://robomongo.org/)\
    \ and fire it up.\n\nCreating a connection to our database is very easy. Just\
    \ set the address to `localhost` and the port to `27017`. Name your connection\
    \ anything you want.\n\n![Robomongo Connect](images/08-mongodb----robomongo-connect-local.jpg)\n\
    \nRobomongo Connect\n\nThen once you connect, you have access to all the databases\
    \ and their respective collections! You now have a GUI to handle database operations\
    \ and you can even open a shell to get down and dirty with the commands we discussed\
    \ earlier.\n\n![Robomongo Connect to Database](images/08-mongodb----robomongo-local-db.jpg)\n\
    \nRobomongo Connect to Database\n\n## Using MongoDB in a Node.js Application\n\
    \nAs you can see, using a local instance of MongoDB is a pretty straightforward\
    \ process. Moving forward, feel free to either use a local instance of MongoDB\
    \ or a hosted one ([modulus.io](https://modulus.io/) or [mongolab.com](https://mongolab.com/)).\n\
    \nEither way, we will use [mongooseJS](http://mongoosejs.com/), the Node package\
    \ for working with MongoDB.\n\nAll you have to do is configure mongoose to connect\
    \ to a local database. This is a simple process since we don’t even need to create\
    \ the database. If we ware working with a local MongoDB, we just have to make\
    \ sure that MongoDB is started up by running the command:\n\n```\n1 $ mongod\n\
    ```\n\n### Connecting to a MongoDB Database Using Mongoose\n\nConnecting to a\
    \ database is a very simple process. Here’s some sample code to connect to a database\
    \ in Node.\n\n```\n1 // grab the packages we need\n2 var mongoose = require('mongoose');\n\
    3 \n4 mongoose.connect('mongodb://localhost/db_name');\n```\n\nThat’s it! Once\
    \ we start saving things into our database, that database named `db_name` will\
    \ automatically be created.\n\nNow that we have an understanding of MongoDB and\
    \ using it, let’s implement CRUD and use MongoDB with mongooseJS inside of a Node.js\
    \ application.\n\nWe’re going to be building a Node.js API next.\n\n## Build a\
    \ RESTful Node API\n\n### What is REST?\n\nFor a little bit on RESTful APIs, take\
    \ a look at this great presentation: [Teach a Dog to REST](http://www.slideshare.net/landlessness/teach-a-dog-to-rest).\n\
    \n[RESTful APIs](http://scotch.io/bar-talk/designing-a-restful-web-api) are becoming\
    \ a standard across services on the web. It’s not enough to just build an application\
    \ now, we’re moving towards platforms that can integrate with multiple devices\
    \ and other websites.\n\nInterconnectivity is quickly becoming the name of the\
    \ game. With projects like [IFTTT](https://ifttt.com/) and [Zapier](https://zapier.com/)\
    \ gaining popularity, users have shown that they like their applications connected.\
    \ This means that all of their applications have a standard way of “talking” to\
    \ one another. IFTTT lets you set triggers and responses like “When I write a\
    \ Tweet, share it as my Facebook status”. The APIs of Twitter and Facebook allow\
    \ us to do this.\n\n![IFTTT](images/ifttt.jpg)\n\nIFTTT\n\nThe big players in\
    \ the game like Facebook and Google have their own APIs that are used across multiple\
    \ third party apps. You can even find their API Explorers where you can take their\
    \ API for a test drive and see what information you can pull from the API. For\
    \ instance, once you sign in, you can grab the data for all your friends from\
    \ the [API Explorer](https://developers.facebook.com/tools/explorer/145634995501895/?method=GET&path=me%3Ffields%3Did%2Cname&version=v2.1).\
    \ Using APIs has quickly become the standard for building applications.\n\nIt’s\
    \ not enough to have an application be standalone, you must build a website and\
    \ multiple mobile apps using the same data. If your application takes off, then\
    \ you’ll want users to be able to build third-party applications on your data.\
    \ This is where your API comes in. We’ll learn how to build one using Node so\
    \ that multiple applications can use that API and your data.\n\n### Backend Services\
    \ for our Angular Frontend\n\nIn this chapter, we’ll be looking at creating a\
    \ RESTful API using Node, Express 4 and its Router, and Mongoose to interact with\
    \ a MongoDB instance. We will also be testing our API using [Postman](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop)\
    \ in Chrome or [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
    \ in Firefox.\n\nThis will be a completely new sample application from our previous\
    \ chapters and we will be using it in a few chapters when we get to our Angular\
    \ frontend. Let’s take a look at the API we want to build and what it can do.\n\
    \n### Sample Application\n\nLet’s say we are going to. Let’s say we are going\
    \ to build a sample application. Let’s say we are going to build a sample application.\
    \ Let’s say we are going to build a sample application. Let’s say we are going\
