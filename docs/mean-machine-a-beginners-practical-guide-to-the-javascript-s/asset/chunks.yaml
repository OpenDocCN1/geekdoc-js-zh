    MongoDB 默认情况下优先考虑一致性而非可用性，但仍然允许你调整某些设置以在两个方向上获得更多支持。读写锁作用于每个数据库，因此数据库中的每个节点将始终能看到最新的数据。由于
    MongoDB 支持 `sharding`（分片），一旦你的数据库开始增长，你的数据可能会分区到跨多个服务器的多个数据库（或 `shards`）。每个分片将是一个独立的数据库，共同形成一个数据库集合。这使得查询速度更快，因为你只需要访问包含该信息的分片，而不是整个数据库。然而，它在写入后的一段时间时间内可能会导致分片与分片之间出现不一致性。这被称为最终一致性，是一致性和可用性之间的一种常见折中。


    ## 主要特性


    *   敏捷且可扩展

    *   [面向文档的存储](http://docs.mongodb.org/manual/core/data-modeling/) - 具有动态模式的 JSON
    风格文档提供了简单性和强大性。

    *   [全索引支持](http://docs.mongodb.org/manual/indexes/) - 像你习惯的那样，对任何属性建立索引。

    *   [复制与高可用性](http://docs.mongodb.org/manual/replication/) - 跨局域网和广域网镜像，以实现扩展并让人安心。

    *   [自动分片](http://docs.mongodb.org/manual/sharding/) - 在不牺牲功能的情况下进行水平扩展。

    *   [查询](http://docs.mongodb.org/manual/applications/read/) - 丰富的基于文档的查询。

    *   [快速就地更新](http://docs.mongodb.org/manual/applications/update/) - 用于无竞争性能的原子修改器。

    *   [Map/Reduce](http://docs.mongodb.org/manual/applications/map-reduce/) - 灵活的聚合和数据处理。

    *   [GridFS](http://docs.mongodb.org/manual/applications/gridfs/) - 存储任何大小的文件而不会使你的栈复杂。


    ## Node.js


    Node 构建在 Google Chrome 的 V8 JavaScript 运行时，作为你 MEAN 应用中的服务器端平台。这意味着什么？在 LAMP 栈中，你有一个
    Web 服务器（`Apache`、`Nginx` 等）运行着服务器端脚本语言（`PHP`、`Perl`、`Python`）来创建动态网站。服务器端代码通过从数据库（`MYSQL`）中提取数据来创建应用环境，然后由
    Web 服务器解释以生成网页。


    当请求新连接时，`Apache` 会创建一个新线程或进程来处理该请求，这使其成为 `multithreaded`（多线程的）。你通常会有若干空闲子进程等待被分配给新请求。如果你配置服务器仅有
    50 个空闲进程，而有 100 个请求进来，某些用户可能会遇到连接超时，直到其中一些进程被释放。当然，有几种方法可以更高效地处理这种扩展性，但通常 `Apache`
    会为每个请求使用一个线程，因此为了支持更多的用户，你最终需要越来越多的服务器。


    > **多线程** 一种编程模型，程序流具有多个控制线程。程序的不同部分（线程）能够同步且独立地执行，而无需等待每个事件完成。这对于现在不必等待的用户来说是很棒的。

