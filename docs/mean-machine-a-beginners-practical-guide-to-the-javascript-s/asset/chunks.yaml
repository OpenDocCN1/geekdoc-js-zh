    \ **check if the user with that username exists**, **make sure that the password\
    \ is correct** using the `comparePassword` method we created in Chapter 9 on our\
    \ User model, and **create a token**.\n\nWe are using the `jwt` (jsonwebtoken)\
    \ package to sign the token. This package will automatically generate the header\
    \ and the signature of our JWT when we pass in the payload, which in this case\
    \ is our user.\n\nNow, when we try to authenticate a user using the credentials\
    \ we used earlier with a POST request to `http://localhost:8080/api/authenticate`\
    \ along with the information we used to create a user (chris/supersecret), we\
    \ will be given the token back!\n\n![Authenticate User and Get a Token](images/10-node-authentication----authenticate-user.jpg)\n\
    \nAuthenticate User and Get a Token\n\nWe can also test our authentication route\
    \ with the wrong username:\n\n![Authenticate Wrong Username](images/10-node-authentication----authenticate-wrong-user.jpg)\n\
    \nAuthenticate Wrong Username\n\nAnd here it is with the wrong password:\n\n![Authenticate\
    \ Wrong Password](images/10-node-authentication----authenticate-wrong-pass.jpg)\n\
    \nAuthenticate Wrong Password\n\nNow that we have given our user the token, it\
    \ will be up to them to hold the token on the client side (probably in a cookie).\
    \ They will then send that token to us on every request where they would like\
    \ to get information. Let’s look at how we can check that token on every request\
    \ to make sure that it is a valid token.\n\n#### Route Middleware to Protect API\
    \ Routes\n\nWe will use the middleware that we already put in place (`apiRoutes.use(function())`)\
    \ to check the token on every request for our authenticated routes.\n\nWe will\
    \ create a flexible API by allowing a user to pass the token via POST parameters,\
    \ the URL parameters, or as an HTTP header. We will verify the token and if the\
    \ token is good, we will pass the user along to their original destination and\
    \ give them the information they requested.\n\nHere is that middleware for verifying\
    \ the token:\n\n```\n 1 // route middleware to verify a token\n 2 apiRouter.use(function(req,\
    \ res, next) {\n 3 \n 4   // check header or url parameters or post parameters\
    \ for token\n 5   var token = req.body.token || req.param('token') || req.headers['x-access-toke\\\
    \n 6 n'];\n 7 \n 8   // decode token\n 9   if (token) {\n10 \n11     // verifies\
    \ secret and checks exp\n12     jwt.verify(token, superSecret, function(err, decoded)\
    \ {      \n13       if (err) {\n14         return res.status(403).send({ \n15\
    \             success: false, \n16           message: 'Failed to authenticate\
    \ token.' \n17         });    \n18       } else {\n19         // if everything\
    \ is good, save to request for use in other routes\n20         req.decoded = decoded;\
    \   \n21 \n22         next();\n23 \n24       } \n25     });\n26 \n27   } else\
    \ {\n28 \n29     // if there is no token\n30     // return an HTTP response of\
    \ 403 (access forbidden) and an error message\n31     return res.status(403).send({\
    \ \n32       success: false, \n33       message: 'No token provided.' \n34   \
    \  });\n35     \n36   }\n37 \n38   // next() used to be here\n39 });\n```\n\n\
    We are using the `jsonwebtoken` package again, but this time we are going to verify\
    \ the token that was passed in. It is important that our secret used here matches\
    \ the secret that was used to create the token.\n\nIf everything looks good and\
    \ the token was able to be verified, we’ll take the information that came out\
    \ of the token and pass it to the other routes in the `req` object.\n\nIf there\
    \ is no token, we will want to send an HTTP status of 403 which means access forbidden.\
    \ We will also send the message that the token was not provided.\n\nWe have moved\
    \ the `next()` to be in the `if/else` statement so that our user will only continue\
    \ forward if they have a token and it verified correctly.\n\n#### Testing Our\
    \ Route Middleware\n\nNow that we have built out the middleware that is responsible\
    \ for protecting all the routes that follow it, let’s test what we’ve just made\
    \ to make sure that it works properly.\n\nHere is an attempt at trying to reach\
    \ the main API route without passing in any authentication:\n\n![No Token Provided](images/10-node-authentication----unauthenticated.jpg)\n\
    \nNo Token Provided\n\nNow let’s pass in a token through the HTTP Headers as `x-access-token`:"
