    Having our API just serve data, we can also make the design choice to serve assets
    from a CDN. This eliminates the issues that CORS brings up. Our data and resources
    are available `as long as a user has a valid token`.


    ## Standards Based


    When creating the token, we will be using standards-based [JSON Web Tokens](http://jwt.io/).
    This handy debugger and library chart created by [Auth0](https://auth0.com/) shows
    the support for JSON Web Tokens. You can see that it has a great amount of support
    across a variety of languages. This means you could actually switch out your authentication
    mechanism if you choose to change backend programming languages in the future!


    Now that we’ve gotten a good foundation of token based authentication, let’s get
    closer to implementing it by examining the method of implementation.


    ### JSON Web Tokens


    JSON Web Tokens (JWT), pronounced “jot”, are a standard since the information
    they carry is transmitted via JSON. We can read more about the [draft](http://self-issued.info/docs/draft-ietf-oauth-json-web-token.html)
    here, but that explanation isn’t the most pretty to look at.


    `JSON Web Tokens work across different programming languages`: JWTs work in .NET,
    Python, Node.js, Java, PHP, Ruby, Go, JavaScript, and Haskell. So you can see
    that these can be used in many different scenarios.


    `JWTs are self-contained`: They will carry all the information necessary within
    itself. This means that a JWT will be able to transmit basic information about
    itself, a payload (usually user information), and a signature.


    `JWTs can be passed around easily`: Since JWTs are self-contained, they are perfectly
    used inside an HTTP header when authenticating an API. You can also pass it through
    the URL.


    ### What does a JWT look like?


    A JWT is easy to identify. It is three strings separated by `.`.


    For example:


    ```

    1 aaaaaaaaaa.bbbbbbbbbbb.cccccccccccc

    ```


    Let’s break down the 3 parts and see what each contains.


    ### Breaking Down a JSON Web Token


    Since there are 3 parts separated by a `.`, each section is created differently.
    We have the 3 parts which are:


    *   header

    *   payload

    *   signature


    ![JSON Web Token Overview](images/10-node-authentication----jwt-overview.png)


    JSON Web Token Overview


    #### Header


    The header carries 2 parts:


    *   declaring the type, which is JWT

    *   the hashing algorithm to use (HMAC SHA256 in this case)


    Here’s an example:


    ```

    1 {

    2   "typ": "JWT",

    3   "alg": "HS256"

    4 }

    ```


    Now once this is `base64encode`, we have the first part of our JSON web token!


    ```

    1 eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9

    ```


    #### Payload


    The payload will carry the bulk of our JWT, also called the [JWT Claims](http://self-issued.info/docs/draft-ietf-oauth-json-web-token.html#RegisteredClaimName).
    This is where we will put the information that we want to transmit as well as
    other information about our token.


    There are multiple claims that we can provide. This includes registered claim
    names, public claim names, and private claim names.


    ##### Registered Claims


    Claims that are not mandatory whose names are reserved for us. These include:


    *   `iss`: the issuer of the token

    *   `sub`: the subject of the token

    *   `aud`: the audience of the token

    *   `exp`: this will probably be the registered claim most often used. This will
    define the expiration in NumericDate value. The expiration MUST be before the
    current date/time.

    *   `nbf`: defines the time before which the JWT MUST NOT be accepted for processing

    *   `iat`: the time the JWT was issued. Can be used to determine the age of the
    JWT

    *   `jti`: Unique identifier for the JWT. Can be used to prevent the JWT from
    being replayed. This is helpful for a one time use token.


    ##### Public Claims


    These are the claims that we create ourselves like user name, information, and
    other important information.


    ##### Private Claims


    A producer and consumer may agree to use claim names that are private. These are
    subject to collision, so use them with caution.


    ##### Example Payload


    Our example payload has two registered claims (`iss`, and `exp`) and two public
    claims (`name`, `admin`).


    ```

    1 {

    2   "iss": "scotch.io",

    3   "exp": 1300819380,

    4   "name": "Chris Sevilleja",

    5   "admin": true

    6 }

    ```


    This will encode to:


    ```

    1 eyJpc3MiOiJzY290Y2guaW8iLCJleHAiOjEzMDA4MTkzODAsIm5hbWUiOiJDaHJpcyBTZXZpbGxlamEi\

    2 LCJhZG1pbiI6dHJ1ZX0

    ```


    That will be the second part of our JSON Web Token.


    #### Signature


    The third and final part of our JSON Web Token is going to be the signature. This
    signature is made up of a hash of the following components:


    *   the header

    *   the payload

    *   secret


    The token is sent on every request so there are no CSRF attacks. There is no session
    based information to manipulate since, well, we don’t have a session!


    This is how we get the third part of the JWT:


    ```

    1 var headerHeaderPayload = header + "." + payload;

    2 var signature = hmacSHA256(headerPayloadSignature, secret);

    3 var jwt = headerPayloadSignature + "." + signature;

    ```

