    \ 'Silver', nerdness: 7 },\n18         { name: 'Yoga 2 Pro', color: 'Gray', nerdness:\
    \ 6 },\n19         { name: 'Chromebook', color: 'Black', nerdness: 5 }\n20   \
    \  ];\n21 \n22 }); \n```\n\nYou can see that the only thing necessary for an Angular\
    \ module is to declare `angular.module`. We can then add a controller onto this\
    \ module. When building out these applications, we’ll try to keep one feature\
    \ on each application. This means we won’t be mixing controllers and services\
    \ onto the same module. This goes back to the idea of having a compartmentalized\
    \ application.\n\nSo far we have:\n\n* created our main module called `firstApp`\n\
    * created a controller called `mainController`\n* information in this controller\
    \ will be bound to itself using `vm`\n* created a variable called `message`\n\
    * created a list of items called `computers`\n\nNotice how we defined the variable\
    \ and our list on `vm`. It is a good practice to bind the parent `this` to `vm`.\
    \ This helps when referencing the controller since `this` can be used within JavaScript\
    \ callbacks. Controllers have properties on them and this is how we will be able\
    \ to use them in our views with `controller as` syntax. We’ll soon see how this\
    \ works. That’s it! You just made your Angular app! Now it’t do much so let’s\
    \ give it a pretty look by making our HTML file and applying this module to.\n\
    \n### Applying the Angular App (index.html)\n\nLet’s start our basic HTML site.\
    \ We’ll bring in Bootstrap and Angular via a CDN to keep things simple. Here’s\
    \ the beginnings of `index.html`:\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"\
