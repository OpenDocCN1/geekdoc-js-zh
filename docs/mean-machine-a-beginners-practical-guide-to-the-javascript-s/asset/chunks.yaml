    \ // call express\n 6 var app        = express(); // define our app using express\n\
    \ 7 var bodyParser = require('body-parser'); // get body-parser\n 8 var morgan\
    \     = require('morgan'); // used to see requests\n 9 var mongoose   = require('mongoose');\
    \ // for working w/ our database\n10 var port       = process.env.PORT || 8080;\
    \ // set the port for our app\n11 \n12 // APP CONFIGURATION ---------------------\n\
    13 // use body parser so we can grab information from POST requests\n14 app.use(bodyParser.urlencoded({\
    \ extended: true }));\n15 app.use(bodyParser.json());\n16 \n17 // configure our\
    \ app to handle CORS requests\n18 app.use(function(req, res, next) {\n19   res.setHeader('Access-Control-Allow-Origin',\
    \ '*');\n20   res.setHeader('Access-Control-Allow-Methods', 'GET, POST');\n21\
    \   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
    \ \\\n22 Authorization');\n23   next();\n24 });\n25 \n26 // log all requests to\
    \ the console \n27 app.use(morgan('dev'));\n28 \n29 // ROUTES FOR OUR API\n30\
    \ // =============================\n31 \n32 // basic route for the home page\n\
    33 app.get('/', function(req, res) {\n34 \tres.send('Welcome to the home page!');\n\
    35 });\n36 \n37 // get an instance of the express router\n38 var apiRouter = express.Router();\n\
    39 \n40 // test route to make sure everything is working \n41 // accessed at GET\
    \ http://localhost:8080/api\n42 apiRouter.get('/', function(req, res) {\n43 \t\
    res.json({ message: 'hooray! welcome to our api!' });\t\n44 });\n45 \n46 // more\
    \ routes for our API will happen here\n47 \n48 // REGISTER OUR ROUTES -------------------------------\n\
    49 // all of our routes will be prefixed with /api\n50 app.use('/api', apiRouter);\n\
    51 \n52 // START THE SERVER\n53 // ===============================\n54 app.listen(port);\n\
    55 console.log('Magic happens on port ' + port);\n```\n\nWow we did a lot there!\
    \ It’s all very simple though so let’s walk through it a bit.\n\n**Base Setup**:\
    \ In our base setup, we pull in all the packages we pulled in using npm. We’ll\
    \ grab express, mongoose, define our app, get bodyParser and configure our app\
    \ to use it. We can also set the port for our application and grab the user model\
    \ that we will define later.\n\nWe are setting our configuration to allow requests\
    \ from other domains to prevent CORS errors. This allows any domain to access\
    \ our API.\n\n**Routes for Our API**: This section will hold all of our routes.\
    \ The structure for using the Express Router let’s us pull in an instance of the\
    \ router. We can then define routes and then apply those routes to a root URL\
    \ (in this case, API). There is also a home page route to say hello; this is just\
    \ a basic route to make sure that everything is working.\n\n**Start the Server**:\
    \ We’ll have our express app listen to the port we defined earlier. Then our application\
    \ will be live and we can test it!\n\n### Starting the Server and Testing\n\n\
    Let’s make sure that everything is working up to this point. We will start our\
    \ Node app and then send a request to the one route we defined to make sure we\
    \ get a response.\n\nLet’s start our server. From the command line, type:\n\n\
    ```\n1 nodemon server.js\n```\n\nYou should see your Node app start up and Express\
    \ will create a server.\n\n![Starting Node Server](images/09-restful-api----start-node-server.jpg)\n\
    \nStarting Node Server\n\nNow that we know our application is up and running,\
    \ let’s test it. You should be able to see our message returned by visiting the\
    \ basic route: `http://localhost:8080`. Now let’s test the rest of our routes\
    \ (the API routes).\n\n![Basic Route](images/09-restful-api----basic-route.jpg)\n\
    \nBasic Route\n\n#### Testing Our API Using Postman\n\nNow navigate to `http://localhost:8080/api`\
    \ in your browser and you will see our JSON message. Seeing it is great and all,\
    \ but the best way to test out our API is to use a tool built for this sort of\
    \ thing. Postman will help us test our API. It will basically send HTTP requests\
    \ to a URL of our choosing. We can even pass in parameters (which we will soon).\n\
    \nOpen up [Postman](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop)\
    \ in Chrome and let’s walk through how to use it.\n\n![Postman REST Client Node\
    \ API](images/09-restful-api----postman-rest-client-node-api.jpg)\n\nPostman REST\
    \ Client Node API\n\nAll you have to do is **enter your request URL**, **select\
    \ an HTTP verb**, and click Send. Simple enough right? We can even see a history\
    \ of the past calls we’ve made so that we can switch back and forth between calls\
    \ we need to test. Think creating and deleting records on the fly.\n\nHere’s the\
    \ moment we’ve been waiting for. Does our application work the way we configured\
    \ it? Enter `http://localhost:8080/api` into the URL. `GET` is what we want since\
    \ we just want to get data. Now click **Send**.\n\n![Node API Postman Test](images/09-restful-api----node-api-postman-test.jpg)\n\
    \nNode API Postman Test\n\nSweet! We got back exactly what we wanted. Now we know\
    \ we can serve information to requests. Let’s wire up our database so we can start\
    \ performing CRUD operations on some users.\n\n### Database and User Model\n\n\
    We’ll keep this short and sweet so that we can get to the fun part of building\
    \ the API routes. All we need to do is create a MongoDB database and have our\
    \ application connect to it. We will also need to create a user mongoose model\
    \ so we can use mongoose to interact with our database.\n\n#### Creating Our Database\
    \ and Connecting\n\nWe will be using a database provided by [Modulus](https://modulus.io/).\
    \ You can definitely create your own database and use it locally or use online\
    \ database providers like [Modulus](https://modulus.io/) or [Mongolab](https://mongolab.com/).\n\
    \nOnce you have your database created and have the URI to connect to (`mongodb://node:node@novus.modulusmongo.net:27017/Iganiq8o`),\
    \ let’s add it to our application. In `server.js` in the Base Setup section, let’s\
    \ add these two lines.\n\n```\n 1 // server.js\n 2 \n 3 // BASE SETUP\n 4 // ============================\n\
    \ 5 \n 6 ...\n 7 \n 8 // connect to our database (hosted on modulus.io)\n 9 mongoose.connect('mongodb://node:noder@novus.modulusmongo.net:27017/Iganiq8o');\
    \ \n10 \n11 ...\n```\n\nAll you need is a URI like above so that your application\
    \ can connect. This URI contains the host (`novus.modulusmongo.net`), the port\
    \ (`27017`), the database (`Iganiq8o`), and the user and password (`node@noder`).\n\
    \nYou can also create your MongoDB instance locally like we did in Chapter 8\\\
    . Your `mongoose.connect()` url would then be: `mongoose.connect(mongodb://localhost:27017/myDatabase`.\n\
    \nSince we already grabbed the mongoose package earlier with ‘npm install’, we\
    \ just need to connect to our remote database hosted by Modulus or locally. Now\
    \ that we are connected to our database, let’s create a mongoose model to handle\
    \ our users.\n\n#### User Model (app/models/user.js)\n\nSince the model won’t\
    \ be the focus of this tutorial, we’ll just create a model and provide our users\
    \ with a name field. That’s it. Let’s create that file and define the model."
