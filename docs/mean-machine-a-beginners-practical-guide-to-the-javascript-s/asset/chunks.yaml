  trans: "\n\n```javascript\n // ===================================================\n\
    \ // 用于登录和获取信息的 auth 工厂\n // 注入 $http 用于与 API 通信\n // 注入 $q 用于返回 promise 对象\n\
    \ // 注入 AuthToken 用于管理 token\n // ===================================================\n\
    .factory('Auth', function($http, $q, AuthToken) {\n\n  // 创建 auth 工厂对象\n  var\
    \ authFactory = {};\n\n  // 登录用户\n  authFactory.login = function(username, password)\
    \ {\n\n    // 返回 promise 对象及其数据\n    return $http.post('/api/authenticate', {\n\
    \      username: username,\n      password: password\n    })\n      .success(function(data)\
    \ {\n        AuthToken.setToken(data.token);\n        return data;\n      });\n\
    \  };\n\n  // 通过清除 token 退出登录\n  authFactory.logout = function() {\n    // 清除\
    \ token\n    AuthToken.setToken();\n  };\n\n  // 检查用户是否登录\n  // 检查是否存在本地 token\n\
    \  authFactory.isLoggedIn = function() {\n    if (AuthToken.getToken()) \n   \
    \   return true;\n    else\n      return false; \n  };\n\n  // 获取已登录的用户\n  authFactory.getUser\
    \ = function() {\n    if (AuthToken.getToken())\n      return $http.get('/api/me');\n\
    \    else\n      return $q.reject({ message: 'User has no token.' });    \n  };\n\
    \n  // 返回 auth 工厂对象\n  return authFactory;\n\n})\n```\n\n我们有 4 个函数，它们会返回一个 promise\
    \ 对象（通过 `$http` 或 `$q`）或者一个简单的 `true/false`。\n\n`login` 将向我们 Node API 上的 `/api/authenticate`\
    \ 端点创建一个一个 `$http.post()` 请求。\n\n`logout` 将简单地使用 `AuthToken` 工厂来清除 token。\n\n\
    `isLoggedIn` 将根据本地存储中是否存在 token 来返回 true 或 false。\n\n`getUser` 将向 `/me` API 端点发送一个\
    \ `$http.get()` 请求，用以获取已登录的用户信息。\n\n接下来，我们将创建拦截器（interceptor）工厂。\n\n## AuthInterceptor\
    \ 工厂\n\n`AuthInterceptor` 工厂将负责为从我们前端应用发送的所有 HTTP 请求附加 token。\n\n```javascript\n\
    \ // ===================================================\n // 将 token 集成到请求中的应用程序配置\n\
    \ // ===================================================\n.factory('AuthInterceptor',\
    \ function($q, $location, AuthToken) {\n\n  var interceptorFactory = {};\n\n \
    \ // 这将发生在所有 HTTP 请求上\n  interceptorFactory.request = function(config) {\n\n \
    \   // 获取 token\n    var token = AuthToken.getToken();\n\n    // 如果 token 存在，将其作为\
    \ x-access-token 添加到头部\n    if (token) \n      config.headers['x-access-token']\
    \ = token;\n    \n    return config;\n  };\n\n  // 发生在响应错误时\n  interceptorFactory.responseError\
    \ = function(response) {\n\n    // 如果我们的服务器返回了 403 forbidden 响应\n    if (response.status\
    \ == 403) {\n      AuthToken.setToken();\n      $location.path('/login');\n  \
    \  }\n\n    // 将服务器的错误作为 promise 返回\n    return $q.reject(response);\n  };\n\n\
    \  return interceptorFactory;\n  \n });\n```\n\nAngular 中的拦截器（interceptor）允许我们响应不同的\
    \ HTTP 请求场景。在创建拦截器时，我们有几个选项可用：\n\n* `request` 允许我们在请求发送之前对其进行拦截\n* `response`\
    \ 允许我们更改从请求中获取的响应\n* `requestError` 捕获已取消的请求\n* `responseError` 捕获失败的后端调用。在这种情况下，我们将使用它来捕获\
    \ token 无效或不存在时的 403 Forbidden 错误。\n\n如果从从后端接收到 403 错误，我们被迫使用 `$location.path('/login')`\
    \ 将用户重定向到登录页面。我们还将清除存储中的任何 token，因为这些 token 不足以验证我们的用户身份。\n\n这些就是创建 Angular 应用中创建身份验证功能所需的三个工厂。我们能够与后端\
    \ API 通信，在客户端获取和设置 token，并将 token 附加到所有的请求中。\n\n## 整个 Auth 服务文件 (authService.js)\n\
    \n```javascript\n angular.module('authService', [])\n  \n // ===================================================\n\
    \ // 用于登录和获取信息的 auth 工厂\n // 注入 $http 用于与 API 通信\n // 注入 $q 用于返回 promise 对象\n\
    \ // 注入 AuthToken 用于管理 token\n // ===================================================\n\
    .factory('Auth', function($http, $q, AuthToken) {\n\n  // 创建 auth 工厂对象\n  var\
    \ authFactory = {};\n\n  // 登录用户\n  authFactory.login = function(username, password)\
    \ {\n\n    // 返回 promise 对象及其数据\n    return $http.post('/api/authenticate', {\n\
    \      username: username,\n      password: password\n    })\n      .success(function(data)\
    \ {\n        AuthToken.setToken(data.token);\n        return data;\n      });\n\
    \  };\n\n  // 通过清除 token 退出登录\n  authFactory.logout = function() {\n    // 清除\
    \ token\n    AuthToken.setToken();\n  };\n\n  // 检查用户是否登录\n  // 检查是否存在本地 token\n\
    \  authFactory.isLoggedIn = function() {\n    if (AuthToken.getToken()) \n   \
    \   return true;\n    else\n      return false; \n  };\n\n  // 获取已登录的用户\n  authFactory.getUser\
    \ = function() {\n    if (AuthToken.getToken())\n      return $http.get('/api/me');\n\
    \    else\n      return $q.reject({ message: 'User has no token.' });    \n  };\n\
    \n  // 返回 auth 工厂对象\n  return authFactory;\n\n})\n\n // ===================================================\n\
    \ // 处理 token 的工厂\n // 注入 $window 在客户端存储 token\n // ===================================================\n\
    .factory('AuthToken', function($window) {\n\n  var authTokenFactory = {};\n\n\
    \  // 从存储中获取 token\n  authTokenFactory.getToken = function() {\n    return $window.getItem('token');\n\
    \  };\n\n  // 设置或清除 token 的函数\n  // 如果传递了 token，则设置 token\n  // 如果没有 token，则从本地存储中清除\n\
    \  authTokenFactory.setToken = function(token) {\n    if (token)\n      $window.setItem('token',\
    \ token);\n    else\n      $window.removeItem('token');\n  };\n\n  return authTokenFactory;\n\
    \n})\n\n // ===================================================\n // 将 token 集成到请求中的应用程序配置\n\
    \ // ===================================================\n.factory('AuthInterceptor',\
    \ function($q, $location, AuthToken) {\n\n  var interceptorFactory = {};\n\n \
    \ // 这将发生在所有 HTTP 请求上\n  interceptorFactory.request = function(config) {\n\n \
    \   // 获取 token\n    var token = AuthToken.getToken();\n\n    // 如果 token 存在，将其作为\
    \ x-access-token 添加到头部\n    if (token) \n      config.headers['x-access-token']\
    \ = token;\n    \n    return config;\n  };\n\n  // 发生在响应错误时\n  interceptorFactory.responseError\
    \ = function(response) {\n\n    // 如果我们的服务器返回了 403 forbidden 响应\n    if (response.status\
    \ == 403)\n      $location.path('/login');\n\n    // 将服务器的错误作为 promise 返回\n  \
    \  return $q.reject(response);\n  };\n\n  return interceptorFactory;\n  \n });\n\
    ```\n\n### 结论\n\n现在我们拥有了可以在应用程序中使用的两个优秀的 Angular 服务。这两个服务将成为前端 Angular 应用与后端 Node\
    \ 应用之间的胶合剂。\n\n"
- fmt: "\nIn addition to what we have just created from scratch, there are pre-built\
    \ solutions on the market as well. A fully-featured Angular module would be the\
    \ [ng-token-auth](https://github.com/lynndylanhurley/ng-token-auth) module. It\
    \ provides the same options as above but adds some neat features like auth events.\n\
    \nLet’s move forward and use these new files in our User CRM application. This\
    \ is what we’ve been waiting for - A full MEAN stack application! All of our work\
    \ in previous chapters has been building up to this point. Roll up your sleeves;\
    \ we’ve got a lot of work to do in the next chapter.\n\n## MEAN App: Users Management\
    \ CRM\n\nUp to this point, we have created a Node API and used JSON web tokens\
    \ to authenticate it. This has all been server-side code and now we will integrate\
    \ it with the frontend using the information we just learned about Angular services.\n\
    \nThe goal here is to start writing an Angular application and not have to edit\
    \ the backend. Treating your applications like this can simulate similar situations\
    \ where the backend API is built and maintained by someone other than yourself\
    \ (like Facebook, Twitter, or GitHub APIs). We only have access to the frontend\
    \ code.\n\n### Setting Up the Application\n\nWe will be using the foundation and\
    \ application structure we created in Chapter 14. Since that was our Node API\
    \ (w/ authentication), this will act as the perfect setup for building a full\
    \ MEAN stack application.\n\n#### Folder Structure\n\nWe will only be working\
    \ with the frontend and Angular parts of the MEAN stack, so we will only need\
    \ to work within the `public/` folder. That separation of frontend and backend\
    \ allows us to narrow our focus and keep our development clean because we already\
    \ know exactly where our code needs to go.\n\nHere is the application structure.\n\
    \n```\n 1 - app/\n 2 ----- models/\n 3 ---------- user.js\n 4 ----- routes/\n\
    \ 5 ---------- api.js\n 6 - public/\n 7 ----- assets/\n 8 ---------- css/ \n9\
    \ --------------- style.css\n10 ----- app/\n11 ---------- controllers/\n12 ---------------\
    \ mainCtrl.js\n13 --------------- userCtrl.js\n14 ---------- services/\n15 ---------------\
    \ authService.js\n16 --------------- userService.js\n17 ---------- app.routes.js\n\
    18 ---------- app.js\n19 ---------- views/\n20 --------------- pages/\n21 --------------------\
    \ users/\n22 ------------------------- all.html\n23 -------------------------\
    \ single.html\n24 --------------- login.html\n25 --------------- home.html\n26\
    \ ---------- index.html\n27 - package.json\n28 - config.js- server.js\n```\n\n\
    Most of these files were already created in Chapter 14.\n\nThe `authService.js`\
    \ will be the same file we created in the last chapter (Chapter 16) while `userService.js`\
    \ will be the file created in Chapter 15.\n\nThe rest of the work will be focused\
    \ on writing controllers, `routes`, and `views`.\n\n#### Bringing In the Services\n\
    \nWe’ll be adding the services that we created last chapter. Go ahead and take\
    \ the files you created and add them to:\n\n* `public/app/services/authService.js`\n\
    * `public/app/services/userService.js`\n\nNow that our services are part of our\
    \ application, let’s get the Angular groundwork ready and then we’ll start using\
    \ them to link the frontend to the backend.\n\n### Main Application\n\nThe foundation\
    \ of our Angular application will require 5 files:\n\n* `public/app/controllers/mainCtrl.js`\n\
    * `public/app/app.js`\n* `public/app/app.routes.js`\n* `public/app/views/index.html`\n\
    * `public/app/views/pages/home.html`\n\nAll of these files will work together\
    \ to produce the home page of our application. Since the home page doesn’t require\
    \ authentication, we won’t need to use the `authService.js` just yet.\n\nThis\
    \ is what our home page will look like:\n\n![Home Page](images/17-user-crm----user-crm-home.jpg)\n\
    \nHome Page\n\nLet’s get started creating our files.\n\n**app/app.js**\n\n```\n\
    1 angular.module('userApp', [\n2   'ngAnimate',\n3   'app.routes', \n4   'authService',\
    \ \n5   'mainCtrl', \n6   'userCtrl', \n7   'userService'\n8 ]);\n```\n\nThis\
    \ is a high level overview of our entire application. We are bringing in:\n\n\
    * `ngAnimate` to add animations to all of our Angular directives (specifically\
    \ `ngShow`/`ngHide`)\n* `app.routes` will be the routing for our application\n\
    * `authService` is the service file created in chapter 16\n* `mainCtrl` will be\
    \ a brand new controller we create that will encompass our main view\n* `userCtrl`\
    \ will have the controllers for all our user management pages\n* `userService`\
    \ is the service file created in chapter 15\n\n#### Routes\n\nWe will start with\
    \ our route file. For now, we are only adding the first route for our home page.\n\
    \n**public/app.routes.js**\n\n```\n 1 angular.module('app.routes', ['ngRoute'])\n\
    \ 2 \n3 .config(function($routeProvider, $locationProvider) {\n 4 \n5   $routeProvider\n\
    \ 6 \n7     // home page route\n8     .when('/', {\n9       templateUrl : 'app/views/pages/home.html'\n\
    10     });\n11   // get rid of the URL\n12   $locationProvider.hashMode(true);\n\
    13 });\n```\n\nThis is enough to produce our homepage. Now let’s move on to the\
    \ controller.\n\n#### Controller\n\n**public/app/controllers/mainCtrl.js**\n\n\
    ```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainCtrl', function($rootScope,\
    \ $location, Auth) {\n 4   var vm = this;\n 5 \n6   // check if a user is logged\
    \ in\n7   $rootScope.$on('$routeChange', function() {\n8     vm.loggedIn = Auth.isLoggedIn();\n\
    9 \n10     // get information on route change\n11     Auth.getUser()\n12     \
    \  .success(function(data) {\n13         vm.user = data;\n14       });\n15   });\n\
    16 \n17   // function to handle login\n18   vm.doLogin = function() {\n19    \
    \ \n20     // call the login() function\n21     Auth.login(loginData.username,\
    \ loginData.password)\n22       .success(function(data) {\n23         // if user\
    \ successfully logs in, redirect to users page\n24         $location.path('/users');\n\
    25       });\n26   };\n27 \n28   // function to handle logout\n29   vm.doLogout\
    \ = function() {\n30     \n31     Auth.logout();\n32     // reset all user info\n\
    33     vm.user = {};\n34     $location.path('/login');\n35   };\n36 });\n```\n\
    \n#### Caching Service Calls\n\nOn every route change, we are going to grab the\
    \ user data. This is to ensure that our information is fresh, especially right\
    \ after login. We won’t want to make a call to the API however on every call,\
    \ so there is a way to cache that information.\n\nTo cache the `getUser()` call,\
    \ we will need to open up our `AuthService.js` file.\n\nAll we have to do here\
    \ is add to the `$http.get()` call like so:\n"
