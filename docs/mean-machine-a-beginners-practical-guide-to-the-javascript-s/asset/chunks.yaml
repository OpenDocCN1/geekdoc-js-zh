  trans: "\n\n```javascript\nangular.module('myApp', ['ngRoute'])\n.config(function($routeProvider,\
    \ $locationProvider) {\n  // stuff here\n})\n.controller('mainController', function($http)\
    \ {\n  // stuff here  \n});\n```\n\n为了压缩（minification），声明 Angular 模块的方法如下：\n\n\
    ```javascript\nangular.module('myApp', ['ngRoute'])\n.config([\n  '$routeProvider',\
    \ \n  '$locationProvider', \n  function($routeProvider, $locationProvider) {\n\
    \    // stuff here\n  }\n])\n.controller('mainController', ['$routeProvider',\
    \ function($http) {\n  // stuff here  \n]);\n```\n\n从现在起，你可以随意使用上述代码并这样声明模块，尽管那种语法写起来很麻烦。不过，还有另一种压缩\
    \ Angular 文件的方法，它涉及到 Gulp 和另一个 Gulp 包。\n\n## 使用 Gulp 准备 Angular 压缩\n\nGulp 有一个专门为此目的的包，叫做\
    \ [gulp-ng-annotate](https://www.npmjs.com/package/gulp-ng-annotate)。\n\n让我们来安装这个包：\n\
    \n```bash\n$ npm install gulp-ng-annotate --save-dev\n```\n\n现在我们可以在 `gulpfile.js`\
    \ 中使用该包并创建一个新任务：\n\n```javascript\nvar ngAnnotate = require('gulp-ng-annotate');\n\
    \n// 用于检查、压缩并合并前端 angular 文件的任务\ngulp.task('angular', function() {\n  return gulp.src(['public/app/*.js',\
    \ 'public/app/**/*.js'])\n    .pipe(jshint())\n    .pipe(jshint.reporter('default'))\n\
    \    .pipe(ngAnnotate())\n    .pipe(concat('app.js'))\n    .pipe(uglify())\n \
    \   .pipe(gulp.dest('public/dist'));\n});\n```\n\n现在可以运行：\n\n```bash\n$ gulp angular\n\
    ```\n\n我们将看到创建了新的 `app.js`，其中包含了正确版本的 Angular 文件。\n\n![ng-annotate](img/19-mean-workflow----ng-annotate.jpg)\n\
    \nng-annotate\n\n## 监听变化\n\n接下来，我们将自动化 Gulp，这样我们就不用在每次修改文件时进入命令行并输入 `gulp <task_name>`\
    \ 了。\n\n监听文件的任务是 Gulp 内置的，因此这里不需要安装包。但需要注意的是，有一个包用于更复杂的设置，即有许多文件需要监听；那个包叫做 [gulp-watch](https://www.npmjs.com/package/gulp-watch)。\n\
    \n让我们进入 `gulpfile.js` 并设置它监听特定文件。我们还会告诉 Gulp 在检测到文件变化时运行哪些任务。\n\n```javascript\n\
    gulp.task('watch', function() {\n  // 监听 less 文件并运行 css 任务\n  gulp.watch('public/assets/css/style.less',\
    \ ['css']);\n\n  // 监听 js 文件并运行 lint、js 和 angular 任务\n  gulp.watch(['server.js',\
    \ 'public/app/*.js', 'public/app/**/*.js'], ['js', 'angular']);\n});\n```\n\n\
    我们定义了一个要监听的 CSS 文件以及要运行的任务（我们之前创建的那个）。现在，当我们更新 `style.less` 文件时，可以看到 Gulp 自动更新新的\
    \ `style.min.css`。\n\n![Gulp Watch](img/19-mean-workflow----gulp-watch.jpg)\n\n\
    Gulp Watch\n\n速度极快！\n\n## 启动 Node 服务器\n\n我们也可以使用 Gulp 来启动服务器。它将直接使用 nodemon，但通过输入一个命令\
    \ `gulp` 就能启动整个应用程序，感觉挺酷的。\n\n这里需要的包是 [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon)。让我们安装它：\n\
    \n```bash\n$ npm install gulp-nodemon --save-dev\n```\n\n配置这个包与我们习惯的有点不同。我们需要定义一些内容，例如启动文件（`server.js`）、监听的文件类型（`js\
    \ less html`）以及要运行的任务。\n\n```javascript\nvar nodemon = require('gulp-nodemon');\n\
    \n// nodemon 任务\ngulp.task('nodemon', function() {\n  nodemon({\n    script: 'server.js',\n\
    \    ext: 'js less html'\n  })\n    .on('start', ['watch'])\n    .on('change',\
    \ ['watch'])\n    .on('restart', function() {\n      console.log('Restarted!');\n\
    \    });\n});\n\n// 定义默认 gulp 任务\ngulp.task('default', ['nodemon']);\n```\n\n\
    注意我们是如何定义启动文件和监听扩展名的。我们还定义了在服务器启动和变化时运行的任务（在此例情况下为 `watch`）。\n\n我们还定义了一个名为 `default`\
    \ 的任务，这是 Gulp 首次会自动查找的任务。\n\n现在我们可以用以下命令运行任务了：\n\n```bash\n$ gulp\n```\n\n我们可以看到服务器启动以及\
    \ Gulp 正在监听任何文件。当文件发生变化时，Gulp 将运行相应的任务然后重启服务器！\n\n![Gulp Nodemon](img/19-mean-workflow----nodemon.jpg)\n\
    \nGulp Nodemon\n\n我们所有的优秀开发工具现在都集成到了这个 `gulpfile.js` 中，我们成了更高效的开发者！还有很多很棒的 Gulp\
    \ 插件可以查看，尽情尝试其他插件，如 [imagemin](https://www.npmjs.com/package/gulp-imagemin) 和\
    \ [clean](https://www.npmjs.com/package/gulp-clean)吧。\n\n"
