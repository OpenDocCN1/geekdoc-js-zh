    \ that one is now missing.\n\n![Node API Get All Nothing](images/09-restful-api----node-api-postman-get-all-nothing.jpg)\n\
    \nNode API Get All Nothing\n\n### Conclusion\n\nWe now have the means to handle\
    \ CRUD on a specific resource (our beloved users) through our own API. Using the\
    \ techniques above will be a good foundation to move into building larger and\
    \ more robust APIs.\n\nThis has been a quick look at creating a Node API using\
    \ Express 4. There are many more things you can do with your own APIs. You can\
    \ add authentication, create better error messages, and add different sections\
    \ so you’re not just working with users."
