    17     <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"\
    ></script>\n19     <script src=\"js/app.js\"></script>\n20 </head>\n21 <body class=\"\
    container\">\n22     \n23 </body>\n24 </html>\n```\n\n`index.html` file is barebones\
    \ now. We have loaded Bootstrap, adding a little CSS for spacing, and loaded Angular\
    \ itself and our custom `app.js`. Nothing will happen if we view this in our browser\
    \ yet since we haven’t applied our Angular app we made. We talked about Angular\
