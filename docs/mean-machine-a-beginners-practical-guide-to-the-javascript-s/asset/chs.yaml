  \ myFactory;\n14 \n15 });\n```\n\n\n\n到目前为止，我们已经创建了一个 Node API 并使用 JSON 令牌（JWT）对其进行身份验证。这些一直都是服务器端代码，现在我们将使用刚刚学到的信息将其与前端集成。\n\
  \n这里的目标是开始编写一个 Angular 应用程序，而不需要修改后端。像这样这样处理你的应用程序可以模拟类似的情况，即后端 API 由你以外的人构建和维护（例如\
  \ Facebook、Twitter 或 GitHub API）。我们只有前端代码的访问权限。\n\n构建一个与后端 API 通信的应用程序时，第一步是处理身份验证。毕竟，如果不通过身份验证，我们就无法从\
  \ API 中获取任何数据。\n\n## 接入我们的 Node API\n\n我们在第 9 章和第 10 章中使用 JSON Web Token 身份验证创建\
  \ Node API 时，我们开发了一个 API 端点（`POST http://localhost:8080/api/authenticate`），我们可以在那里发送用户名和密码来接收\
  \ JWT。\n\n由于我们的后端已经有了身份验证和提供令牌的工具，我们只需要将前端 Angular 应用连接到该端点，将 JWT 存储在客户端，然后就可以访问\
  \ API 中所有经过身份验证的路由。\n\n## 身份验证服务\n\n我们将构建两个不同的服务，一个用于身份验证，另一个用于连接我们的 API 并获取用户数据。通常情况下，如果你从或向外部源获取或发送数据，服务可能是你的首选工具。\n\
  \n为了验证用户，我们将创建一个 `authService`。它将具有 3 个主功能：\n\n* 主身份验证函数（登录、注销、获取当前用户、检查是否登录）\n\
  * 令牌验证函数（获取令牌、保存令牌）\n* 身份验证拦截器（将令牌附加到 HTTP 请求中，未登录时重定向）\n\n这三个工厂中的每一个都有非常特定的用途，这就是为什么我们不能只创建一个。\n\
  \n主身份验证函数将暴露给我们的应用程序并在控制器内部使用。\n\n身份验证拦截器将负责将令牌附加到所有 HTTP 请求中。记住，在基于令牌的身份验证中，所有经过验证的请求都需要令牌；这个拦截器就是我们实现这种附加的方式。该拦截器还负责在用户未通过验证时将用户重定向到登录页面。\n\
  \n令牌验证函数更像是一个供其他两个身份验证工厂使用的私有工厂。它只需要保存令牌或从本地存储中获取令牌。\n\n以下是我们的文件内容的概览：\n\n```\n\
  \ 1 angular.module('authService', [])\n 2 \n 3 // ===================================================\n\
  \ 4 // 用于登录和获取信息的 auth 工厂\n 5 // 注入 $http 用于与 API 通信\n 6 // 注入 $q 返回 promise 对象\n\
  \ 7 // 注入 AuthToken 管理令牌\n 8 // ===================================================\n\
  \ 9 .factory('Auth', function($http, $q, AuthToken) {\n10 \n11   // 创建 auth 工厂 对象\n\
  12   var authFactory = {};\n13 \n14   // 处理登录\n15 \n16   // 处理注销\n17 \n18   // 检查用户是否登录\n\
  19 \n20   // 获取用户信息\n21 \n22   // 返回 auth 工厂 对象\n23   return authFactory;\n24 \n\
  25 })\n26 \n27 // ===================================================\n 28 // 处理令牌的工厂\n\
  \ 29 // 注入 $window 在客户端存储令牌\n 30 // ===================================================\n\
  31 .factory('AuthToken', function($window) {\n32 \n33   var authTokenFactory = {};\n\
  34 \n35   // 获取令牌\n36 \n37   // 设置令牌或清除令牌\n38 \n39   return authTokenFactory;\n\
  40 \n41 })\n42 \n43 // ===================================================\n 44\
  \ // 将令牌集成到请求中的应用程序配置\n 45 // ===================================================\n\
  46 .factory('AuthInterceptor', function($q, AuthToken) {\n47 \n48   var interceptorFactory\
  \ = {};\n49 \n50   // 为每个请求附加令牌\n51 \n52   // 如果令牌未通过身份验证则重定向\n53 \n54   return\
  \ interceptorFactory;\n55 \n56 });\n```\n\n这些是我们即将创建的三个工厂，它们都整合在一个名为 `authService`\
  \ 的 Angular 模块中。对于每个工厂，我们都创建了一个新对象，将函数附加到对象上并返回该对象。\n\n注意，我们能够将一个工厂注入另一个工厂中。我们在其他两个工厂中使用了\
  \ `AuthToken` 工厂。我们还向工厂中注入了一些 Angular 模块，如 `$http`、`$q` 和 `$location`。\n\n`$location`\
  \ 将用于重定向用户的模块。这就是我们在仍然使用 Angular 路由机制的同时进行重定向的方法。这意味着用户将在不刷新页面的情况下被重定向。\n\n`$q`\
  \ 是用于返回 promise 的模块。它允许我们异步运行函数并在处理完成时返回它们的值。在上一章中，我们使用 `success()`、`error()` 和\
  \ `then()` 来处理 promise；在返回 `$q` 时，我们也可以使用这些函数。\n\n让我们逐一查看这些工厂，以便我们看到整个 `authService`\
  \ 是如何工作的。\n\n### 身份令牌工厂\n\n我们将从 `AuthTokenFactory` 开始，因为它将被其他两个工厂使用。要检查本地存储中的内容，只需进入\
  \ 开发者工具，点击 Resources（资源），然后查看 Local Storage（本地存储）标签页。\n\n![Local Storage](img/16-authentication----local-storage.jpg)\n\
  \nLocal Storage\n\n以下是 `AuthTokenFactory` 的代码：\n\n```\n1 // ===================================================\n\
  \ 2 // 处理令牌的工厂\n 3 // 注入 $window 在客户端存储令牌\n 4 // ===================================================\n\
  5 .factory('AuthToken', function($window) {\n6 \n7   var authTokenFactory = {};\n\
  8 \n9   // 从本地存储中获取令牌\n10   authTokenFactory.getToken = function() {\n11     return\
  \ $window.localStorage.getItem('token');\n12   };\n13 \n14   // 设置令牌或清除令牌的函数\n15\
  \   // 如果传递了令牌，则设置令牌\n16   // 如果没有令牌，则从本地存储中清除\n17   authTokenFactory.setToken =\
  \ function(token) {\n18     if (token)\n19       $window.localStorage.setItem('token',\
  \ token);\n20     else\n21       $window.localStorage.removeItem('token');\n22 \
  \  };\n23 \n24   return authTokenFactory;\n25 \n26 })\n```\n\n这里这里有两个函数。`getToken()`\
  \ 和 `setToken()`。`$window.localStorage` 是我们在本地存储中添加、设置或删除项目的方法。\n\n接下来，让我们创建将在应用程序控制器使用的主身份验证工厂。\n\
  \n### 身份验证工厂\n\n主身份验证工厂将包含登录用户、注销用户、检查用户是否登录以及获取用户信息所需的函数。\n\n让我们看看那个工厂是什么样子：\n\n\
  \n\n\n\n```javascript\n // ===================================================\n\
  \ // 用于登录和获取信息的 auth 工厂\n // 注入 $http 用于与 API 通信\n // 注入 $q 用于返回 promise 对象\n //\
  \ 注入 AuthToken 用于管理 token\n // ===================================================\n\
  .factory('Auth', function($http, $q, AuthToken) {\n\n  // 创建 auth 工厂对象\n  var authFactory\
  \ = {};\n\n  // 登录用户\n  authFactory.login = function(username, password) {\n\n \
  \   // 返回 promise 对象及其数据\n    return $http.post('/api/authenticate', {\n      username:\
  \ username,\n      password: password\n    })\n      .success(function(data) {\n\
  \        AuthToken.setToken(data.token);\n        return data;\n      });\n  };\n\
  \n  // 通过清除 token 退出登录\n  authFactory.logout = function() {\n    // 清除 token\n \
  \   AuthToken.setToken();\n  };\n\n  // 检查用户是否登录\n  // 检查是否存在本地 token\n  authFactory.isLoggedIn\
  \ = function() {\n    if (AuthToken.getToken()) \n      return true;\n    else\n\
  \      return false; \n  };\n\n  // 获取已登录的用户\n  authFactory.getUser = function()\
  \ {\n    if (AuthToken.getToken())\n      return $http.get('/api/me');\n    else\n\
  \      return $q.reject({ message: 'User has no token.' });    \n  };\n\n  // 返回\
  \ auth 工厂对象\n  return authFactory;\n\n})\n```\n\n我们有 4 个函数，它们会返回一个 promise 对象（通过\
  \ `$http` 或 `$q`）或者一个简单的 `true/false`。\n\n`login` 将向我们 Node API 上的 `/api/authenticate`\
  \ 端点创建一个一个 `$http.post()` 请求。\n\n`logout` 将简单地使用 `AuthToken` 工厂来清除 token。\n\n`isLoggedIn`\
  \ 将根据本地存储中是否存在 token 来返回 true 或 false。\n\n`getUser` 将向 `/me` API 端点发送一个 `$http.get()`\
  \ 请求，用以获取已登录的用户信息。\n\n接下来，我们将创建拦截器（interceptor）工厂。\n\n## AuthInterceptor 工厂\n\n\
  `AuthInterceptor` 工厂将负责为从我们前端应用发送的所有 HTTP 请求附加 token。\n\n```javascript\n // ===================================================\n\
  \ // 将 token 集成到请求中的应用程序配置\n // ===================================================\n\
  .factory('AuthInterceptor', function($q, $location, AuthToken) {\n\n  var interceptorFactory\
  \ = {};\n\n  // 这将发生在所有 HTTP 请求上\n  interceptorFactory.request = function(config)\
  \ {\n\n    // 获取 token\n    var token = AuthToken.getToken();\n\n    // 如果 token\
  \ 存在，将其作为 x-access-token 添加到头部\n    if (token) \n      config.headers['x-access-token']\
  \ = token;\n    \n    return config;\n  };\n\n  // 发生在响应错误时\n  interceptorFactory.responseError\
  \ = function(response) {\n\n    // 如果我们的服务器返回了 403 forbidden 响应\n    if (response.status\
  \ == 403) {\n      AuthToken.setToken();\n      $location.path('/login');\n    }\n\
  \n    // 将服务器的错误作为 promise 返回\n    return $q.reject(response);\n  };\n\n  return\
  \ interceptorFactory;\n  \n });\n```\n\nAngular 中的拦截器（interceptor）允许我们响应不同的 HTTP\
  \ 请求场景。在创建拦截器时，我们有几个选项可用：\n\n* `request` 允许我们在请求发送之前对其进行拦截\n* `response` 允许我们更改从请求中获取的响应\n\
  * `requestError` 捕获已取消的请求\n* `responseError` 捕获失败的后端调用。在这种情况下，我们将使用它来捕获 token 无效或不存在时的\
  \ 403 Forbidden 错误。\n\n如果从从后端接收到 403 错误，我们被迫使用 `$location.path('/login')` 将用户重定向到登录页面。我们还将清除存储中的任何\
  \ token，因为这些 token 不足以验证我们的用户身份。\n\n这些就是创建 Angular 应用中创建身份验证功能所需的三个工厂。我们能够与后端 API\
  \ 通信，在客户端获取和设置 token，并将 token 附加到所有的请求中。\n\n## 整个 Auth 服务文件 (authService.js)\n\n\
  ```javascript\n angular.module('authService', [])\n  \n // ===================================================\n\
  \ // 用于登录和获取信息的 auth 工厂\n // 注入 $http 用于与 API 通信\n // 注入 $q 用于返回 promise 对象\n //\
  \ 注入 AuthToken 用于管理 token\n // ===================================================\n\
  .factory('Auth', function($http, $q, AuthToken) {\n\n  // 创建 auth 工厂对象\n  var authFactory\
  \ = {};\n\n  // 登录用户\n  authFactory.login = function(username, password) {\n\n \
  \   // 返回 promise 对象及其数据\n    return $http.post('/api/authenticate', {\n      username:\
  \ username,\n      password: password\n    })\n      .success(function(data) {\n\
  \        AuthToken.setToken(data.token);\n        return data;\n      });\n  };\n\
  \n  // 通过清除 token 退出登录\n  authFactory.logout = function() {\n    // 清除 token\n \
  \   AuthToken.setToken();\n  };\n\n  // 检查用户是否登录\n  // 检查是否存在本地 token\n  authFactory.isLoggedIn\
  \ = function() {\n    if (AuthToken.getToken()) \n      return true;\n    else\n\
  \      return false; \n  };\n\n  // 获取已登录的用户\n  authFactory.getUser = function()\
  \ {\n    if (AuthToken.getToken())\n      return $http.get('/api/me');\n    else\n\
  \      return $q.reject({ message: 'User has no token.' });    \n  };\n\n  // 返回\
  \ auth 工厂对象\n  return authFactory;\n\n})\n\n // ===================================================\n\
  \ // 处理 token 的工厂\n // 注入 $window 在客户端存储 token\n // ===================================================\n\
  .factory('AuthToken', function($window) {\n\n  var authTokenFactory = {};\n\n  //\
  \ 从存储中获取 token\n  authTokenFactory.getToken = function() {\n    return $window.getItem('token');\n\
  \  };\n\n  // 设置或清除 token 的函数\n  // 如果传递了 token，则设置 token\n  // 如果没有 token，则从本地存储中清除\n\
  \  authTokenFactory.setToken = function(token) {\n    if (token)\n      $window.setItem('token',\
  \ token);\n    else\n      $window.removeItem('token');\n  };\n\n  return authTokenFactory;\n\
  \n})\n\n // ===================================================\n // 将 token 集成到请求中的应用程序配置\n\
  \ // ===================================================\n.factory('AuthInterceptor',\
  \ function($q, $location, AuthToken) {\n\n  var interceptorFactory = {};\n\n  //\
  \ 这将发生在所有 HTTP 请求上\n  interceptorFactory.request = function(config) {\n\n    //\
  \ 获取 token\n    var token = AuthToken.getToken();\n\n    // 如果 token 存在，将其作为 x-access-token\
  \ 添加到头部\n    if (token) \n      config.headers['x-access-token'] = token;\n    \n\
  \    return config;\n  };\n\n  // 发生在响应错误时\n  interceptorFactory.responseError =\
  \ function(response) {\n\n    // 如果我们的服务器返回了 403 forbidden 响应\n    if (response.status\
  \ == 403)\n      $location.path('/login');\n\n    // 将服务器的错误作为 promise 返回\n    return\
  \ $q.reject(response);\n  };\n\n  return interceptorFactory;\n  \n });\n```\n\n\
  ### 结论\n\n现在我们拥有了可以在应用程序中使用的两个优秀的 Angular 服务。这两个服务将成为前端 Angular 应用与后端 Node 应用之间的胶合剂。\n\
  \n\n\n\n除了我们刚刚从零创建的内容外，市面上也有预构建的解决方案。一个功能齐全 Angular 模块是 [ng-token-auth](https://github.com/lynndylanhurley/ng-token-auth)\
  \ 模块。它提供了与上述相同的选项，但添加了一些如认证事件之类的整洁特性。\n\n让我们继续进行，并在我们的 User CRM 应用中使用这些新文件。这就是我们一直期待的——一个完整的\
  \ MEAN 栈应用程序！我们在之前章节中的所有工作都是在为这一刻做准备。卷起袖子；在下一章节中我们有大量工作要做。\n\n## MEAN 应用：用户管理 CRM\n\
  \n到为止，我们已经创建了一个 Node API 并使用 JSON Web 令牌（JWT）对其进行身份验证。这些都是服务器端代码，现在我们将利用刚刚学到的 Angular\
  \ 服务知识，将其与前端集成。\n\n这里的目标是开始编写一个 Angular 应用程序，而不需要修改后端。像这样处理你的应用程序可以模拟类似的情况，即后端 API\
  \ 由你以外的人员构建和维护（例如 Facebook、Twitter 或 GitHub API）。我们只有前端代码的访问权限。\n\n### 设置应用程序\n\n\
  我们将使用在第 14 章中创建的基础和应用程序结构。由于那是我们的 Node API（带身份验证），它将成为构建完整 MEAN 栈应用程序的完美设置。\n\n\
  #### 文件夹结构\n\n我们将只处理 MEAN 栈中的前端和 Angular 部分，因此我们只需要在 `public/` 文件夹内工作。前端和后端的分离允许我们缩小注意力并保持开发整洁，因为我们已经确切知道代码需要去哪里。\n\
  \n这里是应用程序结构。\n\n```\n 1 - app/\n 2 ----- models/\n 3 ---------- user.js\n 4 -----\
  \ routes/\n 5 ---------- api.js\n 6 - public/\n 7 ----- assets/\n 8 ---------- css/\
  \ \n9 --------------- style.css\n10 ----- app/\n11 ---------- controllers/\n12 ---------------\
  \ mainCtrl.js\n13 --------------- userCtrl.js\n14 ---------- services/\n15 ---------------\
  \ authService.js\n16 --------------- userService.js\n17 ---------- app.routes.js\n\
  18 ---------- app.js\n19 ---------- views/\n20 --------------- pages/\n21 --------------------\
  \ users/\n22 ------------------------- all.html\n23 ------------------------- single.html\n\
  24 --------------- login.html\n25 --------------- home.html\n26 ---------- index.html\n\
  27 - package.json\n28 - config.js- server.js\n```\n\n这些文件大部分已经在第 14 章中创建了。\n\n`authService.js`\
  \ 将与我们在上章节（第 16 章）创建的文件相同，而 `userService.js` 将是第 15 章创建的文件。\n\n其余工作将集中在编写控制器、`routes`\
  \ 和 `views` 上。\n\n#### 引入服务\n\n我们将添加上章节创建的服务。请取出你创建的文件并将它们添加到：\n\n* `public/app/services/authService.js`\n\
  * `public/app/services/userService.js`\n\n现在服务已经是我们应用程序的一部分，让我们准备好 Angular 的基础工作，然后开始使用它们连接前端和后端。\n\
  \n### 主应用程序\n\n我们 Angular 应用程序的基础需要 5 个文件：\n\n* `public/app/controllers/mainCtrl.js`\n\
  * `public/app/app.js`\n* `public/app/app.routes.js`\n* `public/app/views/index.html`\n\
  * `public/app/views/pages/home.html`\n\n所有这些文件将协同工作以生成我们应用程序的主页。由于主页不需要认证，我们暂时还不需要使用\
  \ `authService.js`。\n\n我们的主页看起来是这样的：\n\n![首页](img/17-user-crm----user-crm-home.jpg)\n\
  \n首页\n\n让我们开始创建文件吧。\n\n**app/app.js**\n\n```\n1 angular.module('userApp', [\n2 \
  \  'ngAnimate',\n3   'app.routes', \n4   'authService', \n5   'mainCtrl', \n6  \
  \ 'userCtrl', \n7   'userService'\n8 ]);\n```\n\n这是我们整个应用程序的高层级概览。我们引入了：\n\n* `ngAnimate`\
  \ 用于为我们所有的 Angular 指令添加动画（特别是 `ngShow`/`ngHide`）\n* `app.routes` 将作为我们应用程序的路由\n\
  * `authService` 是在第 16 章创建的服务文件\n* `mainCtrl` 将是我们创建的一个全新的控制器，它包含我们的主视图\n* `userCtrl`\
  \ 将包含我们所有用户管理页面的控制器\n* `userService` 是在第 15 章创建的服务文件\n\n#### 路由\n\n我们将从路由文件开始。目前，我们只为主页添加第一个路由。\n\
  \n**public/app.routes.js**\n\n```\n 1 angular.module('app.routes', ['ngRoute'])\n\
  \ 2 \n3 .config(function($routeProvider, $locationProvider) {\n 4 \n5   $routeProvider\n\
  \ 6 \n7     // 主页路由\n8     .when('/', {\n9       templateUrl : 'app/views/pages/home.html'\n\
  10     });\n11   // 移除 URL\n12   $locationProvider.hashMode(true);\n13 });\n```\n\
  \n这足够生成我们的首页了。现在让我们进入控制器。\n\n#### 控制器\n\n**public/app/controllers/mainCtrl.js**\n\
  \n```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainCtrl', function($rootScope,\
  \ $location, Auth) {\n 4   var vm = this;\n 5 \n6   // 检查用户是否登录\n7   $rootScope.$on('$routeChange',\
  \ function() {\n8     vm.loggedIn = Auth.isLoggedIn();\n9 \n10     // 获取路由更改时的信息\n\
  11     Auth.getUser()\n12       .success(function(data) {\n13         vm.user =\
  \ data;\n14       });\n15   });\n16 \n17   // 处理登录的函数\n18   vm.doLogin = function()\
  \ {\n19     \n20     // 调用 login() 函数\n21     Auth.login(loginData.username, loginData.password)\n\
  22       .success(function(data) {\n23         // 如果用户登录成功，重定向到用户页面\n24        \
  \ $location.path('/users');\n25       });\n26   };\n27 \n28   // 处理注销的函数\n29   vm.doLogout\
  \ = function() {\n30     \n31     Auth.logout();\n32     // 重置所有用户信息\n33     vm.user\
  \ = {};\n34     $location.path('/login');\n35   };\n36 });\n```\n\n#### 缓存服务调用\n\
  \n在每次路由更改时，我们都会获取用户数据。这是为了确保我们的信息是最新的，特别是在登录后。然而，我们不希望每次调用都访问 API，所以有一种方法可以缓存这些信息。\n\
  \n为了缓存 `getUser()` 调用，我们需要打开 `AuthService.js` 文件。\n\n我们只需要像下面这样向 `$http.get()` 调用添加内容：\n\
  \n\n\n\n\n```javascript\n// get the logged in user\nauthFactory.getUser = function()\
  \ {\n  if (AuthToken.getToken())\n    return $http.get('/api/me', { cache: true\
  \ });\n  else\n    return $q.reject({ message: 'User has no token.' });    \n};\n\
  ```\n\n这里的重点是 `{ cache: true }`。现在每当调用 `Auth.getUser()` 时，它将检查该信息是否已经缓存。如果在缓存中，它将返回缓存的信息。如果没有，它将发起\
  \ API 调用。\n\n***\n\n### 登录用户\n\n我们将拥有一个函数来登录用户。这将使用 `username` 和 `password` 对用户进行身份验证。`vm.loginData.username`\
  \ 绑定到我们在视图中创建的输入框。\n\n### 退出用户\n\n我们将调用 `Auth.logout()`，它将删除 `localStorage` 中的用户令牌以及存储在\
  \ `mainController` 的 `vm.user` 对象中的任何信息。然后我们将用户重定向到主页，因为他们将未经过身份验证，因此无法访问任何其他页面。\n\
  \n### 首页视图\n\n就像 Angular 路由章节一样，我们需要一个主文件作为网站的整体布局。由于 Node.js 向我们的用户返回此 `index.html`\
  \ 文件，这将是我们的布局文件。\n\n**public/app/views/index.html**\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>User CRM</title>\n\
