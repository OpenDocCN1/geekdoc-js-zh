  >\n  <link rel=\"stylesheet\" href=\"//cdnjs.cloudflare.com/ajax/libs/animate.css/3.1.1/animate.min.css\"\
  >\n  <link rel=\"stylesheet\" href=\"assets/css/style.css\">\n\n  <!-- JS -->\n\
  \  <!--通过 CDN 加载 angular 和 angular-route -->\n  <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"\
  ></script>\n  <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-route.js\"\
  ></script>\n  <script src=\"//ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular-animate.js\"\
  ></script>\n  \n  <!-- controllers -->\n  <script src=\"app/controllers/mainCtrl.js\"\
  ></script>\n  <script src=\"app/controllers/userCtrl.js\"></script>\n  \n  <!--\
  \ services -->\n  <script src=\"app/services/authService.js\"></script>\n  \n  <!--\
  \ main Angular app 文件 -->\n  <script src=\"app/app.routes.js\"></script>\n  <script\
  \ src=\"app/app.js\"></script>\n</head>\n<body ng-app=\"userApp\" ng-controller=\"\
  mainController as main\">\n\n<!-- NAVBAR -->\n<header>\n  \n  <div class=\"navbar\
  \ navbar-inverse\" ng-if=\"main.loggedIn\">\n    <div class=\"container\">\n   \
  \   <div class=\"navbar-header\">\n        <a href=\"/\" class=\"navbar-brand\"\
  ><span class=\"glyphicon glyphicon-fire text-danger\"></span> User CRM</a>\n   \
  \   </div>  \n      <ul class=\"nav navbar-nav\">\n        <li><a href=\"/users\"\
  ><span class=\"glyphicon glyphicon-user\"></span> Users</a></li>\n      </ul>\n\
  \      <ul class=\"nav navbar-nav navbar-right\">\n        <li ng-if=\"!main.loggedIn\"\
  ><a href=\"/login\">Login</a></li>      \n        <li ng-if=\"main.loggedIn\" class=\"\
  navbar-text\">Hello {{ main.user.name }}!</li>\n        <li ng-if=\"main.loggedIn\"\
  ><a href=\"#\" ng-click=\"main.doLogout()\">Logout</a></li>\n      </ul>\n    </div>\n\
  \  </div>\n  \n</header>\n\n<main class=\"container\">\n  <!-- ANGULAR VIEWS -->\n\
  \  <div ng-view></div>\n</main>\n\n</body>\n</html>\n```\n\n我们将 Angular 应用应用到 `<body>`\
  \ 标签，并使用控制器作为语法 (`mainController as main`)。我们还加载了很快就会构建的 `userCtrl.js`。\n\n我们所有的\
  \ CSS 文件和 Angular 应用文件都已加载。\n\n我们将 Angular 应用应用到 `<body>` 标签，并使用控制器作为语法 (`mainController\
  \ as main`)。我们还加载了很快就会构建的 `userCtrl.js`。\n\n(注：原文中存在大量重复段落，已按要求去重)\n\n\n\n\n\n我们将使用\
  \ `ngIf` 显示和隐藏处理图标，并将其绑定到名为 `processing` 的变量。让我们更新 `mainController` 文件中的 `doLogin()`\
  \ 函数来添加此变量。\n\n```\n 1 // 处理登录表单的函数\n 2 vm.doLogin = function() {\n 3   vm.processing\
  \ = true;\n 4 \n 5   Auth.login(vm.loginData.username, vm.loginData.password)\n\
  \ 6     .success(function(data) {\n 7       vm.processing = false;\n 8 \n 9    \
  \   // 如果用户登录成功，重定向到用户页面\n10       $location.path('/users');\n11     });\n12 };\n\
  ```\n\n当用户点击 `Login` 时，我们将 `processing` 变量设置为 `true`。当函数完成后完成后我们将变量设置为 `false`。\n\
  \n现在我们只需要做的就是创建并显示处理图标。\n\n在我们的 `login.html` 文件中，让我们为登录按钮添加该图标。\n\n```\n1 <button\
  \ type=\"submit\" class=\"btn btn-block btn-primary\">\n2 \n3   <span ng-if=\"!login.processing\"\
  >Login</span>\n 4 \n5   <span ng-if=\"login.processing\" class=\"spinner\"><span\
  \ class=\"glyphicon glyphico\\\n6 n-repeat\"></span></span>\n 7 \n8 </button>\n\
  ```\n\n如果变量为 `true`，我们将显示旋转器。否则，我们的按钮将始终显示 `Login`。\n\n只需要少量的 CSS 来处理旋转动画，我们就准备了。将以下内容添加到\
  \ `style.css` 中：\n\n```\n 1 /* 动画\n 2 ====================== */\n 3 .spinner {\n\
  \ 4   animation:spin 1s infinite;\n 5   -webkit-animation:spin 1s infinite;\n 6\
  \   -moz-animation:spin 1s infinite;\n 7 }\n 8 \n 9 @keyframes spin {\n10   from\
  \  { transform:rotate(0deg); }\n11   to    { transform:rotate(360deg); }\n12 }\n\
  13 \n14 @-webkit-keyframes spin {\n15   from  { -webkit-transform:rotate(0deg);\
  \ }\n16   to    { -webkit-transform:rotate(360deg); }\n17 }\n18 \n19 @-moz-keyframes\
  \ spin {\n20   from  { -moz-transform:rotate(0deg); }  \n21   to    { -moz-transform:rotate(360deg);\
  \ }\n22 }\n```\n\n我们将为任何元素添加 `spinner` 类，它都会开始旋转。如果我们现在点击登录按钮，我们将看到旋转器。\n\n![登录旋转器](img/17-user-crm----login-spinner.jpg)\n\
  \n登录旋转器\n\n这种技术可以用于我们的整个应用程序。\n\n### 添加登录错误消息\n\n如果登录未成功，我们将让用户知道。由于我们的 API 已经返回了错误消息，我们只需要显示它们即可。\n\
  \n在登录函数内部，我们将检查 API 返回给我们的 `success` 变量。\n\n```\n 1   vm.doLogin = function() {\n\
  \ 2     vm.processing = true;\n 3 \n 4     // 清除错误\n 5     vm.error = '';\n 6 \n\
  \ 7     Auth.login(vm.loginData.username, vm.loginData.password)\n 8       .success(function(data)\
  \ {\n 9         ...\n10 \n11         // 如果用户登录成功，重定向到用户页面\n12         if (data.success)\
  \ \n13           $location.path('/users');\n14         else\n15           vm.error\
  \ = data.message;\n16       });\n```\n\n每次我们点击登录时，错误消息都会清除，这样我们就不会看到过期的错误消息。在视图中，我们只需要检查该错误。在登录按钮上方添加以下内容：\n\
  \n```\n1 <div class=\"alert alert-danger\" ng-if=\"login.error\">\n2   {{ login.error\
  \ }}\n3 </div>\n```\n\n如果错误变量存在，我们将显示这个 div。\n\n![用户不存在](img/17-user-crm----user-not-found.jpg)\n\
  \n用户不存在\n\n![密码错误](img/17-user-crm----wrong-password.jpg)\n\n密码错误\n\n在我们的网站基础和登录准备就绪后，我们现在想要处理更多的身份验证，然后创建显示我们用户的页面。\n\
  \n### 身份验证\n\n我们已经在 `mainController` 中使用了 `Auth` 工厂。我们调用了所有函数，包括 `isLoggedIn`、`login`、`logout`\
  \ 和 `getUser`。\n\n用户可以登录，他们的令牌存储在 `localStorage` 中。如果你检查浏览器的本地存储，你将看到该令牌。在为用户页面获取用户列表之前，我们必须将此令牌附加到每个请求。这就是我们在\
  \ `authService` 中创建的 `AuthInterceptor` 发挥用场的地方。\n\n我们将在主 `app.js` 文件中使用它。让我们看看它是如何应用的：\n\
  \n```\n 1 angular.module('userApp', [\n 2   'ngAnimate', \n 3   'app.routes', \n\
  \ 4   'authService',\n 5   'mainCtrl',\n 6   'userCtrl',\n 7   'userService'\n 8\
  \ ])\n 9 \n10 .config(function($httpProvider) {\n11   $httpProvider.interceptors.push(AuthInterceptor);\n\
  12 })\n```\n\n### 用户页面\n\n我们已经在 `mainController` 中使用了 `Auth` 工厂。我们调用了所有函数，包括 `isLoggedIn`、`login`、`logout`\
  \ 和 `getUser`。\n\n用户可以登录，他们的令牌存储在 `localStorage` 中。如果你检查浏览器的本地存储，你将看到该令牌。在为用户页面获取用户列表之前，我们必须将此令牌附加到每个请求。这就是我们在\
  \ `authService` 中创建的 `AuthInterceptor` 发挥用场的地方。\n\n我们将在主 `app.js` 文件中使用它。让我们看看它是如何应用的：\n\
  \n#### 所有用户\n\n```\n1 angular.module('userCtrl', ['userService'])\n2 .controller('all',\
  \ function(User) {\n3   var vm = this;\n 4 \n5   vm.processing = true;\n 6 \n7 \
  \  User.all()\n 8     .success(function(data) {\n 9       vm.processing = false;\n\
  10       vm.users = data;\n11     });\n12 })\n```\n\n#### 所有用户视图 (pages/users/all.html)\n\
  \n```\n1 <div class=\"page-header\">\n2   <h1>\n3     用户 \n4     <a href=\"/users/create\"\
  \ class=\"btn btn-default\">\n5       <span class=\"glyphicon glyphicon-plus\"></span>\
  \ \n6       新用户\n7     </a>\n8   </h1>\n9 \n10 </div>\n11 \n12 <!-- 加载消息 -->\n13\
  \ <div class=\"jumbotron text-center\" ng-show=\"user.processing\">\n14   <span\
  \ class=\"glyphicon glyphicon-repeat\"></span>\n15   <p>加载用户中...</p>\n16 </div>\n\
  17 \n18 <table class=\"table table-bordered table-striped\" ng-show=\"user.users\"\
  >\n19   <thead>\n20     <tr>\n21       <th>_id</th>\n22       <th>姓名</th>\n23  \
  \     <th>用户名</th>\n24       <th class=\"col-sm-2\"></th>\n25     </tr>\n26   </thead>\n\
  27   <tbody>\n28 \n29     <!-- 循环用户 -->\n30     <tr ng-repeat=\"person in user.users\"\
  >\n31       <td>{{ person._id }}</td>\n32       <td>{{ person.name }}</td>\n33 \
  \      <td>{{ person.username }}</td>\n34       <td class=\"col-sm-2\">\n35    \
  \     <a ng-href=\"/users/{{ person._id }}\" class=\"btn btn-danger\">编辑</a>\n36\
  \       </td>\n37     </tr>\n38   </tbody>\n39 </table>\n```\n\n\n\n\n\n在我们的 `app.routes.js`\
  \ 文件中，在 `login` 路由下方添加以下内容：\n\n```\n1 // 显示所有用户\n2 .when('/users', {\n3   templateUrl:\
  \ 'app/views/pages/users/all.html',\n4   controller: 'userController',\n5   controllerAs:\
  \ 'user'\n6 });\n```\n\n这将使用我们刚刚创建的控制器和视图。在浏览器中访问 `http://localhost:8080/users`，你将看到我们做的所有工作整合在一起。\n\
  \n![所有用户](img/17-user-crm----all-users.jpg)\n\n所有用户\n\n另外一点需要注意的是，如果我们进入 Chrome\
  \ 的网络工具并查看获取所有用户的请求，我们会看到 Angular 确实附加了我们的令牌（token）。\n\n![访问令牌](img/17-user-crm----access-token.jpg)\n\
  \n访问令牌\n\n页面上还有一件事要做的，就是提供删除用户的功能。\n\n## 删除用户\n\n我们需要两个东西来添加删除功能：\n\n1.  控制器中的一个函数\n\
  2.  视图中的一个按钮\n\n让我们先创建函数。在我们的 `userCtrl.js` 中，添加该函数：\n\n```\n 1 // 删除用户的函数\n 2 vm.deleteUser\
  \ = function(id) {\n 3   vm.processing = true;\n 4 \n 5   // 用户 id 作为参数\n 6   User.delete(id)\n\
  \ 7     .success(function(data) {\n 8 \n 9       // 获取所有用户以更新表格\n10       // 你也可以设置\
  \ api \n11       // 在删除调用时返回用户列表\n12       User.all()\n13         .success(function(data)\
  \ {\n14           vm.processing = false;\n15           vm.users = data;\n16    \
  \     });\n17 \n18     });\n19 };\n```\n\n此 `deleteUser` 函数将调用 `User` factory 中的删除函数。当调用成功时，我们将进行调用来获取所有用户，然后更新\
  \ `users` 对象，反过来更新我们的表格。\n\n现在只需要在视图中有一个删除按钮。在 `views/pages/users/all.html` 的用户表格中，紧邻编辑按钮添加以下内容：\n\
  \n```\n1 <a href=\"#\" \n2   ng-click=\"user.deleteUser(person._id)\" \n3   class=\"\
  btn btn-primary\">Delete</a>\n```\n\n我们传递了 `person._id`，并且得益于 `ngClick` Angular\
  \ 指令，点击此按钮时我们将调用 `deleteUser` 函数。\n\n现在当我们点击删除时，用户将被删除，我们的表格将得到更新。接下来，让我们制作**创建用户**组件。\n\
  \n## 创建用户\n\n与列出所有用户的页面一样，我们需要为创建用户页面准备**控制器**、**路由**和**视图**。\n\n### 创建控制器\n\n我们将在\
  \ `userCtrl.js` 文件中第一个创建的控制器下方添加一个控制器。我们将此命名为 `userCreateController`。\n\n```\n 1\
  \ // 应用于创建页面的控制器\n 2 .controller('userCreateController', function(User) {\n 3  \
  \ \n 4   var vm = this;\n 5 \n 6   // 用于隐藏/显示视图元素的变量\n 7   // 区分创建或编辑页面\n 8   vm.type\
  \ = 'create';\n 9 \n10   // 创建用户的函数\n 11   vm.saveUser = function() {\n 12     vm.processing\
  \ = true;\n 13 \n 14     // 清空消息\n 15     vm.message = '';\n 16 \n 17     // 使用\
  \ userService 中的创建函数\n 18     User.create(vm.userData)\n 19       .success(function(data)\
  \ {\n 20         vm.processing = false;\n 21 \n 22         // 清空表单\n 23        \
  \ vm.userData = {};\n 24         vm.message = data.message;\n 25       });\n 26\
  \       \n 27   };  \n 28 \n 29 )\n```\n\n这对我们来说已经是非常标准的流程了。我们有一个名为 `saveUser` 的函数将用于视图中的表单。我们还调用了\
  \ `userService` 中的 `User.create()` 函数。创建用户后，我们将显示消息并清空表单，这样就可以输入新用户。\n\n我们将整个 `userData`\
  \ 对象传递到创建用户函数中，它包括：\n\n```\n1 // 所有信息都使用 ng-model 绑定到我们的表单\n2 {\n3   name: \"Holly\"\
  ,\n4   username: \"hollylawly\",\n5   password: \"supersecret\"\n6 }\n```\n\n这里的另一个添加是\
  \ `type` 变量。它将用于我们的视图。由于我们在创建页面和编辑页面都使用同一个文件 (`views/pages/users/single.html`)，我们需要一种方法来区分它们。当然，你可以为这些页面创建两个独立的视图文件，但视图中只有\
  \ 2 处微小差异。通过这种方式，我们消除了一些重复代码。\n\n### 创建用户路由\n\n```\n1 // 创建新用户的表单\n2 // 相同的视图\n\
  3 .when('/users/create', {\n4   templateUrl: 'app/views/users/single.html',\n5 \
  \  controller: 'userCreateController',\n6   controllerAs: 'user'\n\n\n### 创建用户视图\
  \ (pages/users/single.html)\n\n```\n1 <div class=\"page-header\">\n2   <h1 ng-if=\"\
  user.type == 'create'\">创建用户</h1>\n3   <h1 ng-if=\"user.type == 'edit'\">编辑用户</h1>\n\
  4 </div>\n5 6 <form class=\"form-horizontal\" ng-submit=\"user.saveUser()\">\n7\
  \   <div class=\"form-group\">\n8     <label class=\"col-sm-2\">名称</label>\n9  \
  \   <div class=\"col-sm-6\">\n10      <input type=\"text\" class=\"form-control\"\
  \ ng-model=\"user.userData.name\">\n11    </div>\n12  </div>\n13  <div class=\"\
  form-group\">\n14    <label class=\"col-sm-2\">用户名</label>\n15    <div class=\"\
  col-sm-6\">\n16      <input type=\"text\" class=\"form-control\" ng-model=\"user.userData.username\"\
  >\n17    </div>\n18  </div>\n19  <div class=\"form-group\">\n20    <label class=\"\
  col-sm-2\">密码</label>\n21    <div class=\"col-sm-6\">\n22      <input type=\"password\"\
  \ class=\"form-control\" ng-model=\"user.userData.password\">\n23    </div>\n24\
  \  </div>\n25  \n26  <div class=\"col-sm-6 col-offset-2\">\n27    <button type=\"\
  submit\" class=\"btn btn-success btn-block\" ng-if=\"user.type == 'create'\">创建用户</button>\n\
  28    <button type=\"submit\" class=\"btn btn-success btn-block\" ng-if=\"user.type\
  \ == 'edit'\">更新用户</button>\n29  </div>\n30 </form>\n31 \n32 <div class=\"row show-hide-message\"\
  \ ng-show=\"user.message\">\n33   <div class=\"col-sm-6 col-offset-2\">\n34    \
  \ \n35     <div class=\"alert alert-info\">\n36       {{ user.message }}\n37   \
  \  </div>\n38   </div>\n39 </div>\n```\n\n这对我们来说已经是非常标准的流程了。我们有一个名为 `saveUser` 的函数将用于视图中的表单。我们还调用了\
  \ `userService` 中的 `User.create()` 函数。创建用户后，我们将显示消息并清空表单，这样就可以输入新用户。\n\n我们将整个 `userData`\
  \ 对象传递到创建用户函数中，它包括：\n\n```\n1 // 所有信息都使用 ng-model 绑定到我们的表单\n2 {\n3   name: \"Holly\"\
  ,\n4   username: \"hollylawly\",\n5   password: \"supersecret\"\n6 }\n```\n\n这里的另一个添加是\
  \ `type` 变量。它将用于我们的视图。由于我们在创建页面和编辑页面都使用同一个文件 (`views/pages/users/single.html`)，我们需要一种方法来区分它们。当然，你可以为这些页面创建两个独立的视图文件，但视图中只有\
  \ 2 处微小差异。通过这种方式，我们消除了一些重复代码。\n\n### 编辑用户\n\n让我们运行编辑用户页面。我们将与创建用户页面使用相同的视图。唯一的区别是：\n\
  \n*   我们必须将参数传递到 URL (/users/user_id)\n*   我们需要在页面加载时获取用户信息\n*   我们需要将这些信息绑定到我们的表单\n\
  \n### 编辑用户控制器\n\n由于我们通过 URL 传递用户 ID，我们需要注入 Angular 的 `$routeParams` 模块来获取 URL 参数。\n\
  \n根据路由文件中命名的方式，我们将知道特定参数的名称。在本例中，我们获取的是 `$routeParams.user_id`。\n\n\n\n\n\n```\n\
  \ 1 // 应用于用户编辑页面的控制器\n 2 .controller('userEditController', function($routeParams,\
  \ User) {\n 3 \n 4   var vm = this;\n 5 \n 6   // 用于显示/隐藏视图元素的变量\n 7   // 用于创建或编辑页面\n\
  \ 8   vm.type = 'edit';\n 9 \n10   // 获取要编辑的用户数据\n11   // $routeParams 是我们从 URL\
  \ 获取数据的方式\n12   User.get($routeParams.user_id)\n13     .success(function(data) {\n\
  14       vm.userData = data;\n15     });\n16 \n17   // 保存用户的函数\n18   vm.saveUser\
  \ = function() {\n19     vm.processing = true;\n20     vm.message = '';\n21 \n22\
  \     // 调用 userService 函数进行更新 \n23     User.update($routeParams.user_id, vm.userData)\
  \  24       .success(function(data) {\n25         vm.processing = false;\n26 \n\
  27         // 清空表单\n28         vm.userData = {};\n29 \n30         // 将 API 传的消息绑定到\
  \ vm.message\n31         vm.message = data.message;\n32       });\n33   };\n34 \n\
  35 });\n```\n\n当编辑用户页面加载时，我们将使用 `User.get()` 函数来获取该用户的数据。这将访问我们的 API 并获取用户信息。然后，我们将该对象绑定到\
  \ `vm.userData`。\n\n由于 `userData` 是我们在 `/views/pages/users/single.html` 中使用的对象，因此我们的表单将自动填充这些数据！\n\
  \n### 编辑用户路由\n\n这是我们定义参数名称的地方。我们在这里传递 `:user_id`，这让 `$routeParams` 知道 `$routeParams.user_id`\
  \ 存在我们刚刚创建的控制器中。\n\n```\n1 // 编辑用户的页面\n2 .when('/users/:user_id', {\n3   templateUrl:\
  \ 'app/views/pages/users/single.html',\n4   controller: 'userEditController',\n\
  5   controllerAs: 'user'\n6 });\n```\n\n### 编辑用户视图 (pages/users/single.html)\n\n\
  ```\n 1 <div class=\"page-header\">\n 2   <h1 ng-if=\"user.type == 'create'\">创建用户</h1>\n\
  \ 3   <h1 ng-if=\"user.type == 'edit'\">编辑用户</h1>\n 4 </div>\n 5 \n6 <form class=\"\
  form-horizontal\" ng-submit=\"user.saveUser()\">\n 7   \n 8   <div class=\"form-group\"\
  >\n 9     <label class=\"col-sm-2 control-label\">姓名</label>\n10     <div class=\"\
  col-sm-6\">\n11       <input type=\"text\" \n12         class=\"form-control\" \n\
  13         ng-model=\"user.userData.name\">\n14     </div>\n15   </</div>\n 16 \n\
  \ 17   <div class=\"form-group\">\n 18     <label class=\"col-sm-2 control-label\"\
  >用户名</label>\n19     <div class=\"col-sm-6\">\n20       <input type=\"text\" \n\
  21         class=\"form-control\" \n22         ng-model=\"user.userData.username\"\
  >\n23     </div>\n24   </</div>\n 25 \n 26   <div class=\"form-group\">\n 27   \
  \  <label class=\"col-sm-2 control-label\">密码</label>\n28     <div class=\"col-sm-6\"\
  >\n29       <input type=\"password\" \n30         class=\"form-control\" \n31  \
  \       ng-model=\"user.userData.password\">\n32     </div>\n33   </</div>\n 34\
  \   \n 35   <div class=\"form-group\">\n 36   <div class=\"col-sm-offset-2 col-sm-6\"\
  >\n37     <button type=\"submit\" \n38       class=\"btn btn-success btn-lg btn-block\"\
  \ \n39       ng-if=\"user.type == 'create'\">创建用户</button>\n40     <button type=\"\
  submit\" \n41       class=\"btn btn-success btn-lg btn-block\" \n42       ng-if=\"\
  user.type == 'edit'\">更新用户</button>\n43   </</div>\n 44   </</div>\n 45 \n 46 </form>\n\
  \ 47 \n48 <div class=\"row show-hide-message\" ng-show=\"user.message\">\n49   <div\
  \ class=\"col-sm-6 col-sm-offset-2\">\n50     \n51     <div class=\"alert alert-info\"\
  >\n52       {{ user.message }}\n53     </div>\n54     \n55   </</div>\n56 </div>\n\
  ```\n\n此视图与创建用户页面完全相同。这里的很妙之处在于，由于我们的输入框绑定到 `userData` 对象，并且我们在控制器中执行了获取数据的调用，用户信息将自动显示在表单中。\n\
  \n![编辑用户](img/17-user-crm----edit-user.jpg)\n\n### 编辑用户\n\n出于安全考虑，我们的密码不会显示，因为 API\
  \ 不返回该数据。\n\n### 为消息添加动画\n\n由于我们已经在 `index.html` 文件中通过 CDN 引入了 [animate.css](http://daneden.github.io/animate.css/)，我们可以使用它的类来为\
  \ Angular 指令添加动画。\n\n我们只需要添加一些自定义 CSS。我们将使用 `animate.css` 类让消息产生缩放效果。\n\n```\n1\
  \ /* 动画\n2 ====================== */\n3 \n4 /* 显示与隐藏 */\n5 .show-hide-message.ng-hide-remove\
  \ {\n6   -webkit-animation:zoomIn 0.3s both ease;\n7   -moz-animation:zoomIn 0.3s\
  \ both ease;\n8   animation:zoomIn 0.3s both ease;\n9 }\n```\n\n为 `ngShow` 和 `ngHide`\
  \ 指令添加动画类类 `.ng-hide-remove`。\n\n## 总结\n\n我们现在拥有了所有用户。通过将此方法应用于许多类型，我们可以看到应用程序是如何整合在一起的。\n\
  \n### 流程回顾\n\n上述步骤回顾了我们在整本书中所采取的步骤。将其拆分为 6 个要点时，看起来并不复杂，但执行所有操作都需要大量的知识。\n\n\n\n\
  \n再次强调，这是一种针对大型应用程序的更高级的方法。对于我们的演示，我们一直使用的这种结构已经足够了。但请记住这一点，因为随着应用程序的增长，可能值得研究一下这种结构。\n\
  \n***\n\n熟能生巧，你创建的 MEAN 应用越多，这些概念在你脑海中就会巩得越稳固。\n\n## 下一步计划\n\n我们已经完成了 MEAN 栈应用程序，但仍然有很多东西需要学习。接下来我们需要做的一件事是部署我们的网站，这样其他人就可以在网上查看了。毕竟，如果我们不能展示出来，做这些工作又有什么用呢？让我们来看看如何将我们出色的新网站部署到网上。\n\
  \n## 部署 MEAN 应用\n\n到目前为止，我们一直在电脑的本地上构建所有这些应用程序。我们一直在创建文件，得益于 `Node` 和 `Express`\
  \ 启动了服务器，并在 `http://localhost:8080` 上进行测试。\n\n我们创建的伟大作品将无法被世界上其他地方看到！我们需要将应用程序部署到某些托管服务，以便我们能通过网站访问它。\n\
  \n将网站部署到在线服务器有许多方法。对于我们的目的，最好寻找一个专门托管 `Node` 应用程序的在线主机。\n\n目前，最流行的服务器配置是 LAMP 栈（Linux,\
  \ Apache, MySQL 和 PHP）。由于我们使用 `Node` 代替 `Apache`，用 `MongoDB` 代替 `MySQL`，并用 `Node`\
  \ 代替 `PHP`，因此寻找一个专门从事此类服务的主机是合理的。\n\n### 优秀的 Node 托管主机\n\n这些托管主机都提供了极佳的功能，是部署应用程序的好选择。\n\
  \n[Modulus](https://modulus.io/) - 我们在某些章节中使用 `Modulus` 来托管 `MongoDB` 数据库。他们还提供优秀的\
  \ `Node` 托管服务，并拥有良好的支持。\n\n[Digital Ocean](https://www.digitalocean.com/) - Digital\
  \ Ocean 是 VPS（虚拟专用服务器）提供商，因此你需要负责配置和设置自己的服务器。Digital Ocean 提供 `SSH` 访问和每月 5 美元起的方案。他们还提供服务器镜像，只需点击按钮即可安装\
  \ `Node` 环境。\n\n[Heroku](https://www.heroku.com/) - 我们个人托管 `Node` 应用的最喜喜。部署 Heroku\
  \ 应用非常简单，他们提供的命令行工具非常易上手。他们还允许你免费托管较小的应用，尽管对支持的流量量有限制。\n\n#### 其他提及\n\n这些主机声誉良好，但我们尚未亲自使用过：\n\
  \n*   [Joyent](https://www.joyent.com/) - `Node` 的创建者提供可扩展定价的优质云计算选项。\n*   [Nodejitsu](https://www.nodejitsu.com/)\
  \ - 由一些 `Node` 早期贡献者创建的易用托管解决方案。\n\nHeroku 在价格、功能、支持、可用性和可用工具之间提供了极好的平衡。我们将查看如何将\
  \ MEAN 栈应用部署到 `Heroku`。这个过程与其他主机类似，这些技术可以适用于大多数主机。\n\n### 部署到 Heroku\n\nHeroku 以让服务器配置变得简单且无痛苦而闻名。它让我们构建得更快，并专注于应用程序的细节，而不是尝试配置自己的服务器。\n\
  \n我们将部署在整个整本书中一直在编写的完整 MEAN 栈应用程序——我们的用户 CRM 系统。部署是一个相当轻松的过程，几分钟内我们就能在网上拥有我们的完整应用程序。\n\
  \n让我们开始吧。\n\n#### 创建 Heroku 账户\n\n前往 [Heroku.com](https://heroku.com) 并创建你的免费账户。如你所见，仪表板极其简单且用户友好。它为我们提供了非常棒的**入门\
  \ Heroku** 对话框，我们可以在那里找到部署每种类型应用的指令说明。\n\n![Heroku Dashboard](img/18-mean-deployment----01-heroku-dashboard.jpg)\n\
  Heroku 仪表板\n\n我们将逐步介绍 Heroku 的 [Node 部署指南](https://devcenter.heroku.com/articles/getting-started-with-nodejs)。你可以跟随这本书学习，并在将来参考该链接，因为他们提供了大量的部署场景。\n\
  \n#### 所需工具\n\n你需要准备几样东西来开始部署：\n\n*   [Node and npm](http://nodejs.org/)（很确定你已经安装了这个）\n\
  *   [Heroku Toolbelt](https://toolbelt.heroku.com/)\n*   [Git](http://git-scm.com/)\n\
  \n### Git 仓库\n\n首先，我们需要将应用程序转换为 git 仓库。首先，我们将创建一个本地 git 仓库，然后让 git 远程仓库指向 Heroku。这样之后，我们就拥有了直接推送到\
  \ Heroku 的能力。\n\n*如果你已经为项目使用了 git 仓库并在 GitHub 或 BitBucket 上工作，那太棒了！你已经拥有 git 仓库，可以跳过此步。*\n\
  \n要创建本地 git 仓库，请确保你已安装 [git](http://git-scm.com/) 并且能够在控制台中访问 `git` 命令。\n\n`cd`\
  \ 进入你的项目目录并输入以下命令来创建 git 仓库：\n\n```bash\ngit init\n```\n\n这将创建你的 git 仓库。现在，我们需要将文件添加到仓库并提交它们。\n\
  \n```bash\ngit add .\n```\n\n```bash\ngit commit -m 'adding first files'\n```\n\n\
  ![Git Repo Creation](img/18-mean-deployment----git-repo.jpg)\n创建 Git 仓库\n\n现在我们的\
  \ git 仓库准备就绪，可以进入 Heroku 部分。\n\n#### Heroku 工具带 (Toolbelt)\n\n这个 Toolbelt 将为我们提供部署所需的工具。\n\
  \n![Heroku Toolbelt](img/18-mean-deployment----01-dashboard.jpg)\n\n安装 Toolbelt\
  \ 后，我们就可以使用 `heroku` 命令。进入命令行并输入：\n\n```bash\nheroku\n```\n\n![Heroku Command](img/18-mean-deployment----02-installed.jpg)\n\
  Heroku 命令\n\n现在你可以看到可以使用的所有命令。我们在部署到 Heroku 时将使用其中几个。第一个就是登录。\n\n#### 登录 Heroku\n\
  \n这是我们将桌面连接到 Heroku 的方式。我们将命令行进行验证，以便 Heroku 知道我们有权发送应用。这是一个非常简单的过程。\n\n输入：\n\n\
  ```bash\nheroku login\n```\n\n![Heroku Login](img/18-mean-deployment----03-heroku-login.jpg)\n\
  登录 Heroku\n\n我们将进行验证，Heroku 还会要求你上传 SSH 密钥。由于我已经在 Heroku 上有了 SSH 密钥，它没有提示我。现在让我们开始构建一个简单的应用。\n\
  \n### 部署我们的 User CRM 应用\n\n我们将创建的 User CRM 应用部署到 Heroku，这样我们就能看到如何让 MEAN 应用上线。\n\
  \n这是一个非常简单的过程。在 git 仓库目录内，我们执行以下步骤：\n\n1. 创建远程仓库（与我们的主 `origin` 远程仓库不同），以便我们的应用程序知道将代码推送到哪里\n\
  2. 推送仓库！\n\n让我们创建远程仓库：\n\n```bash\nheroku create\n```\n\n![Heroku Create](img/18-mean-deployment----05-heroku-create.jpg)\n\
  创建 Heroku\n\n##### Heroku 警告\n\nHeroku 这里关于更新 Git 的警告是不准确的。他们的博客建议更新到 1.9.5 版本，这正是我们在这里使用的版本。我们已经联系对方解决这个问题，并在本章中更新相关信息。\n\
  \n继续进行吧，因为这个警告不会影响我们使用 git 或 Heroku Toolbelt。\n\n***\n\n现在我们可以通过输入 git 命令看到我们的远程仓库已创建：\n\
  \n```bash\ngit remote -v\n```\n\n![Git Remotes](img/18-mean-deployment----git-remote.jpg)\n\
  Git 远程仓库\n\n\n\n\n`heroku create` 命令会为我们的应用程序创建一个随机名称，在此例情况下，为 `fathomless-stream-3632`。这意味着我们的应用程序很快就能通过\
  \ `http://fathomless-stream-3632.herokuapp.com` 访问。\n\n这并不十分理想，所以让我们将其重命名为 `user-crm`。我们可以通过\
  \ `heroku apps` 命令查看已创建的应用。然后我们对其进行重命名。\n\n```\n1 $ heroku apps:rename user-crm\
  \ --app fathomless-stream-3632\n```\n\n如果我们想要的应用程序名称已被占用（由于我们在本书中使用 `user-crm`，所以它是被占用的），我们就必须更改名称或在末尾添加一些数字。让我们在名称末尾添加\
  \ `123`。\n\n```\n1 $ heroku apps:rename user-crm-123 --app fathomless-stream-3632\n\
  ```\n\n你也可以通过从开始就为应用程序命名来跳过所有这些重命名操作：\n\n```\n1 $ heroku create user-crm\n```\n\n\
  最终，当你想让应用程序上线时，你可能不希望人们通过 `http://xxxx.herokuapp.com` 访问。Heroku 提供了一种简单的方法，将你拥有的任何域名指向此应用程序，所以不用担心。我们将在在本章稍后重新讨论如何将域名指向我们的\
  \ Heroku 应用。\n\n![Image](img/18-mean-deployment----06-heroku-rename.jpg)\n\n图片\n\
  \n## 部署代码\n\n现在我们已经准备就绪，我们将把网站部署到 Heroku！这只需要一个简单的 git 命令。我们本质上是在把所有本地 git 仓库代码推送到由\
  \ Heroku 托管的远程仓库。\n\n```\n1 $ git push heroku master\n```\n\n这告诉 git 我们想要推送到新创建的\
  \ `heroku` 仓库和 `master` 分支（这是自动自动创建的默认 git 分支）。\n\n![Heroku Deploy](img/18-mean-deployment----07-heroku-deploy.jpg)\n\
  \nHeroku Deploy\n\n我们可以看到 Heroku 在部署我们的应用程序时会执行很多工作。它看到我们有一个基于 Node 的应用程序。然后它将通过读取我们的\
  \ `package.json` 文件来添加依赖项。它还将通过运行 `package.json` 文件中声明为 `main` 的文件来启动我们的 Node 服务器。在我们的情况下，该文件是\
  \ `server.js`。\n\n## 确保运行一个实例\n\n我们想要确保应用程序正在运行，并且 Heroku 已为我们启动了服务器（称为 dynos）。输入以下内容进行确认：\n\
  \n```\n1 $ heroku ps:scale web=1\n```\n\n如果我们进入仪表板，我们可以在 `Dynos` 部分看到，我们有一个 dyno，而且它是免费层级。你可以通过编辑使用的\
  \ dynos 数量来快速扩展或缩小应用程序。\n\n![Heroku Dynos](img/18-mean-deployment----heroku-dynos.jpg)\n\
  \nHeroku Dynos\n\n我们的应用程序现在已准备好查看了！\n\n### 在浏览器中查看我们的应用程序\n\n我们终于到了自从书开始以来一直期待的部分！在浏览器中看到我们的全栈\
  \ MEAN ！\n\n如果你还记得 Heroku 为你生成的那个疯狂的随机名称，或者你自己重命名了应用，请在浏览器中访问该地址：\n\n[`user-crm.herokuapp.com/`](https://user-crm.herokuapp.com/)\n\
  \nHeroku 还提供了一个使用命令行在浏览器中打开应用程序的快捷方式：\n\n```\n1 $ heroku open\n```\n\n这太神奇了！我们在浏览器中拥有了我们一直想要的网站。\n\
  \n### 定义特定的运行命令\n\n有时，我们可能有一个在 Heroku 接手我们的应用程序时想要运行的特定命令。这可以使用使用任务运行器来启动服务器，如 grunt\
  \ 或 gulp（我们将在下一章介绍 gulp）。Heroku 会查看我们 `package.json` 文件中的 `main` 属性，如果我们定义了该属性，它还会查看\
  \ `scripts` 下的内容。\n\n还有另一种方法可以准确地告诉 Heroku 我们想要看到运行的是什么命令。你可以通过在我们的项目根目录下创建一个名为\
  \ `Procfile` 的新文件来实现。\n\n只需在你的项目根目录下创建一个 `Procfile` 并按所示定义启动命令即可：\n\n```\n1 web:\
  \ node server.js\n```\n\n这告诉 Heroku 在部署到 web 平台时，应该使用此命令来启动我们的应用程序。现在当我们执行 `git\
  \ push heroku master` 时，Heroku 将运行该特定命令，我们的网站就会上线。\n\n## 使用现有的 Heroku 应用\n\n如果你切换到另一台电脑并想要访问已经使用的\
  \ Heroku 应用，则需要采取几个步骤。这些步骤假设你是在一台新电脑上且尚未安装 Heroku。\n\n*   下载 [Heroku Toolbelt](https://toolbelt.heroku.com/)\n\
  *   登录：`heroku login`\n*   添加你的公钥：`heroku keys:add`\n*   拉取你当前的应用 `heroku git:clone\
  \ -a app-name`\n*   进行改进\n*   Git add 并 commit 你的更改\n*   推回 heroku：`git push heroku\
  \ master`\n\n通过这些简单的步骤，你可以跳转到任何电脑并立即获取你当前的项目。\n\n## 使用你自己的域名\n\nHeroku 为应用添加域名提供了非常简单的步骤。在本例中，我们假设你有一个域名\
  \ `supercool.com`。要为应用程序添加该域名，你需要完成两件事：\n\n1. 告诉 Heroku 哪些域名\n2. 配置你的 DNS 指向 Heroku\n\
  \n第一部分非常简单。我们将使用以下命令告诉 Heroku 域名：\n\n```\n1 heroku domains:add www.supercool.com\n\
  ```\n\n完成该步骤后，你可能需要一些时间才能在浏览器中访问 `www.supercool.com`。这取决于不同的注册商，但通常如下所示：\n\n| 记录\
  \ | 名称 | 目标 |\n| --- | --- | --- |\n| CNAME | www | user-crm.herokuapp.com |\n\n\
  只要你遵循这些步骤，你很快就能看到它！\n\n有关更多信息，请访问 [Heroku 域名文档](https://devcenter.heroku.com/articles/custom-domains)。如果你感兴趣，它们提供了关于更多类型（通配符、子域名）的详细信息。它们还提供了针对几个注册商的说明。\n\
  \n## 总结\n\n我们终于构建了一个 MEAN 应用程序并使其上线。从本书中学到的许多技术都可以应用于不同的应用程序和用例。无论你尝试构建什么，Heroku\
  \ 都是部署应用程序/网站的快速简单方法。接下来，既然我们已经构建并部署了应用，让我们看看一些让开发过程更容易的技术。我们将研究如何使用 Gulp（任务运行器）和\
  \ Bower（前端资源管理器）。这两个工具将极大地加速我们的工作流。\n\n## MEAN 工作流工具\n\n### 应用\n\n我们需要创建一个示例 MEAN\
  \ 应用程序，以确切看到如何使用 Bower 和 Gulp 来帮助我们的工作流。\n\n这是目录结构。请创建这些文件和文件夹。\n\n```\n 1 - public/\n\
  \ 2 ----- app/\n 3 ---------- controllers/\n 4 --------------- mainCtrl.js\n 5 ----------\
  \ views/\n 6 --------------- pages/\n 7 -------------------- home.html\n 8 ---------------\
  \ index.html\n 9 ---------- app.js\n 10 ---------- app.routes.js\n 11 ----- assets/\n\
  \ 12 ---------- css/\n 13 --------------- style.less\n 14 - server.js\n```\n\n这是一个\
  \ MEAN 项目，所以请运行：\n\n```\n1 $ npm init\n```\n\n以创建一个 `package.json` 文件。创建此文件时，所有的默认值都是可以。\n\
  \n现在我们需要 Express 作为依赖项，所以运行：\n\n```\n1 $ npm install express --save\n```\n\n\n\n\
  现在我们有了 Express。让我们进入 `server.js` 并启动服务器来提供我们的 `index.html` 文件。\n\n```\n 1 // 获取我们的包\n\
  \ 2 var express = require('express');\n 3 var app     = express();\n 4 var path\
  \    = require('path');\n 5 var port    = process.env.PORT || 8080;\n 6 \n 7 //\
  \ 配置公共资源文件夹\n 8 app.use(express.static(__dirname + '/public'));\n 9 \n10 // 发送 index.html\
  \ 的路由\n11 app.get('/', function(req, res) {\n12     res.sendFile(path.join(__dirname\
  \ + '/public/app/views/index.html'));\n13 });\n14 \n15 // 启动服务器\n16 app.listen(port);\n\
  17 console.log('Magic happens on http://localhost:' + port);\n```\n\n这是一个非常简单的文件，我们只需要在启动服务器之前获取依赖并提供\
  \ `index.html` 文件。\n\n让我们快速连接其余的页面：\n\n#### `public/app/controllers/mainCtrl.js`\n\
  \n```\n1 angular.module('mainCtrl', [])\n2 \n3 .controller('mainController', function()\
  \ {\n4 \n5   var vm = this;\n6     \n7   vm.message = 'this is my message!';\n8\
  \   \n9 });\n```\n\n#### `public/app/views/pages/home.html`\n\n```\n1 首页！\n```\n\
  \n#### `public/app/views/index.html`\n\n```\n 1 <!DOCTYPE html>\n 2 <html lang=\"\
  en\">\n 3 <head>\n 4   <meta charset=\"UTF-8\">\n 5   <title>Workflow!</title>\n\
  \ 6 \n7   <!-- 用于 Angular 路由 -->\n 8   <base href='/'>\n 9 \n10   <!-- CSS -->\n\
  11   <!-- 在此处加载 bootstrap -->\n12   <!-- 我们将在 gulp 部分加载 css 文件 -->\n13 \n14   <!--\
  \ JS / 库 -->\n15   <!-- 在此处加载 angular 和 angular-route -->\n16 \n17   <!-- APP -->\n\
  18   <script src=\"app/controllers/mainCtrl.js\"></script>\n19   <script src=\"\
  app/app.routes.js\"></script>\n20   <script src=\"app/app.js\"></script>\n21 </head>\n\
  22 <body class=\"container\" ng-app=\"myApp\" ng-controller=\"mainController as\
  \ main\">\n23 \n24   <div class=\"jumbotron text-center\">\n25     <h1>{{ main.message\
  \ }}</h1>\n26   </div>\n27 \n28   <div ng-view></div>\n29   \n30 </body>\n31 </html>\n\
  ```\n\n#### `public/app/app.js`\n\n```\n1 angular.module('myApp', ['app.routes',\
  \ 'mainCtrl']);\n```\n\n#### `public/app/app.routes.js`\n\n```\n 1 angular.module('app.routes',\
  \ ['ngRoute'])\n 2 \n3 .config(function($routeProvider, $locationProvider) {\n4\
  \ \n5   $routeProvider\n 6     .when('/', {\n 7       templateUrl: 'app/views/pages/home.html',\n\
  \ 8       controller: 'mainController',\n9       controllerAs: 'main'\n10     });\n\
  11 \n12   $locationProvider.htmlMode(true);\n13 });\n```\n\n#### `public/assets/css/style.less`\n\
  \n```less\n1 /* 变量\n 2 ====================== */\n3 @blue: #6D0;\n4 @purple: #993399;\n\
  5 @red: #cc3333;\n6 \n7 /* 主\n 8 ====================== */\n9 body{ \n10   background:@blue;\n\
  11   color:@purple;\n12   border-top:5px solid @red;\n13   padding-top:0px;\n14\
  \ }\n```\n\n现在我们可以使用命令启动服务器：\n\n```\n1 nodemon server.js\n```\n\n这个应用目前没不多，因为我们还没有获取\
  \ Bootstrap 或 Angular Route。我们将使用一个名为 Bower 的工具来拉取这些资源。\n\n### Bower\n\n[Bower](http://bower.io/)\
  \ 是一个专门用于前端资源的包管理器。你可以使用 `bower` 来引入任何 CSS/JS 库，如 Bootstrap、Angular、jQuery、Animate.css、Moment\
  \ 等。Bower 的工作原理与 npm 类似，毕竟它终究是一个包管理器。就像 npm 使用 `package.json` 文件来读取所需的所有包一样，bower\
  \ 使用 `bower.json` 文件。\n\n#### 安装 Bower\n\n我们首先需要安装 bower。幸运的是它是一个 npm 包，所以我们可以通过输入以下命令来安装：\n\
  \n```\nnpm install -g bower\n```\n\n我们使用 `-g` 全局安装 bower，以便我们可以在系统的任何地方访问它。让我们使用\
  \ `init` 命令创建一个 `bower.json` 文件。我们将保持所有默认设置。运行以下命令：\n\n```\nbower init\n```\n\n\
  现在我们有了 bower 和 `bower.json` 文件，将能够搜索并安装包了。\n\n#### 安装包\n\n```\nbower install <package_name>\
  \ --save\n```\n\n就像 npm 一样，如果我们添加 `--save` 修饰符，包将保存到我们的 `bower.json` 文件中。\n\n```\n\
  bower install bootstrap\n```\n\n安装完成后，Bower 会将包放在名为 `bower_components` 的文件夹中。你可以根据\
  \ GitHub URL 安装包。\n\n```\nbower install <github-url>\n```\n\n#### 搜索包\n\n有一种方法通过命令行来搜索包。\n\
  \n```\nbower search <package_name>\n```\n\n这种方法可能很繁琐，当有很多结果时是。更方便的搜索包的方法是通过 Bower\
  \ 网站。[在 Bower 网站上搜索包](http://bower.io/search)\n\n#### 指定目录\n\n默认情况下，Bower 会将资源放在根目录的\
  \ `bower_components` 文件夹中。这不是放置文件的理想位置，因为我们已经决定将与应用程序关联的文件放在 `public/` 文件夹中。可以通过在项目根目录下创建一个文件来实现。该文件将命名为\
  \ `.bowerrc`，移动 `bower_components` 文件夹非常简单：\n\n```\n{\n  \"directory\": \"public/assets/libs\"\
  \n}\n```\n\n现在文件将放在我们指定的目录，我们可以保持根目录更加整洁。\n\n#### 使用包\n\n让我们安装常用的 MEAN 栈应用程序所需的包。运行以下命令：\n\
  \n```\nbower install bootstrap angular-route angular-animate --save\n```\n\n一旦包进入我们的项目，我们只需要链接正确的文件。通过点击你新的\
  \ `public/assets/libs` 文件夹，你能够确定具体想要哪个文件。\n\n\n\n\n就像 Bower 和 Nodemon 一样，我们将全局安装\
  \ `gulp`，以便我们可以在所有项目中都访问它。\n\n```\n1 $ npm install -g gulp\n```\n\n我们还想在特定项目的 `devDependencies`\
  \ 中安装 `gulp`。\n\n```\n1 $ npm install gulp --save-dev\n```\n\n太棒了！现在 Gulp 已经准备就绪，我们可以开始使用它了。首先，让我们之前创建的\
  \ LESS 文件编译为 CSS 文件，这样浏览器就可以使用它。\n\n### 编译 LESS\n\n我们想要做的每个任务都是一个扩展 Gulp 的 npm 包。例如，由于我们需要编译\
  \ LESS 文件，我们还需要安装 [gulp-less](https://github.com/plus3network/gulp-less)。让我们现在就安装它。\n\
  \n```\n1 $ npm install gulp-less --save-dev\n```\n\n现在我们有了这个插件，让我们来使用它吧。像 Bower\
  \ 和 npm 一样，我们需要在文档根目录下创建一个配置文件。此文件将告诉 Gulp 在我们启动时具体要做什么。\n\n首先，我们需要在文档根目录下创建一个 `gulpfile.js`。\n\
  \n在我们的 `gulpfile.js` 内部，让我们开始使用 LESS：\n\n```\n 1 // load the plugins\n 2 var gulp\
  \ = require('gulp');\n 3 var less = require('gulp-less');\n 4 \n 5 // define a task\
  \ called css\n 6 gulp.task('css', function() {\n 7 \n 8 // grab the less file, process\
  \ the LESS, save to style.css\n 9   return gulp.src('public/assets/css/style.less')\n\
  10     .pipe(less())\n11     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n\
  ```\n\n恭喜！你刚刚完成了第一个 Gulp 任务！现在我们只需要回到命令行并输入：\n\n```\n1 $ gulp css\n```\n\n这告诉 Gulp\
  \ 运行特定任务，然后我们可以看到新的 `style.css` 文件将在我们指定的 `gulp.dest()` 文件夹中生成。\n\n![LESS Compiled](img/19-mean-workflow----less.jpg)\n\
  \n编译后的 LESS\n\n你可以看到 LESS 正如我们预期的那样被编译成了 CSS。\n\n![LESS vs. CSS](img/19-mean-workflow----less-to-css.jpg)\n\
  \nLESS 对比 CSS\n\n### 压缩 CSS\n\nGulp 的强大之处在于，我们可以在一个任务中通过多个包处理一个文件（或多个文件）。让我们看看如何添加\
  \ CSS 压缩功能，这样我们就可以有一个 `style.min.css` 用于生产环境。\n\n首先安装 [gulp-minify-css](https://www.npmjs.com/package/gulp-minify-css)\
  \ 包以及名为 [gulp-rename](https://www.npmjs.com/package/gulp-rename) 的包，以便我们可以将文件重命名为\
  \ `style.min.css`：\n\n```\n1 $ npm install gulp-minify-css gulp-rename --save-dev\n\
  ```\n\n现在我们可以将其添加到 `gulpfile.js` 并在 `css` 任务中使用它。\n\n```\n 1 // load the plugins\n\
  \ 2 var gulp      = require('gulp');\n 3 var less      = require('gulp-less');\n\
  \ 4 var minifyCSS = require('gulp-minify-css');\n 5 var rename    = require('gulp-rename');\n\
  \ 4\n \n 7 // define a task called css\n 8 gulp.task('css', function() {\n 9 \n\
  10 // grab the less file, process the LESS, save to style.css\n11   return gulp.src('public/assets/css/style.less')\n\
  12     .pipe(less())\n13     .pipe(minifyCSS())\n14     .pipe(rename({ suffix: '.min'\
  \ }))\n15     .pipe(gulp.dest('public/assets/css'));\n16 \n17 });\n```\n\n现在当我们运行\n\
  \n```\n1 $ gulp css\n```\n\n我们可以看到创建了一个新的 `style.min.css` 文件，并且它已经经过了 LESS 编译和压缩！现在我们可以进入\
  \ `index.html` 文件并添加新的新的 CSS 文件：\n\n```\n1 <link rel=\"stylesheet\" href=\"assets/css/style.min.css\"\
  >\n```\n\n所有的颜色。漂亮吗？\n\n![Site with LESS](img/19-mean-workflow----site-with-less.jpg)\n\
  \n带有 LESS 的站点\n\n### 使用 Gulp 包\n\n使用 Gulp 包的过程与我们刚刚处理 LESS 的过程类似。\n\n1. 安装包并使用 `--save-dev`。\n\
  2. 在你的 `gulpfile.js` 中加载插件。\n3. 配置任务并使用插件！\n\nGulp 的配置比 Grunt 容易，但概念是相同的：安装包、加载它、然后配置。让我们转向处理\
  \ JS 的其他重要任务。\n\n### JS 检查\n\n确保我们的 JS 文件没有错误。这包括我们的 Node 和 Angular 文件。我们将使用一个名为\
  \ [gulp-jshint](https://www.npmjs.com/package/gulp-jshint) 的 JSHint 插件来完成此任务。\n\n\
  让我们安装这个新包：\n\n```\n1 $ npm install gulp-jshint --save-dev\n```\n\n现在将其引入我们的 `gulpfile.js`\
  \ 并创建一个任务。\n\n```\n 1 // load the plugins\n 2 var gulp = require('gulp');\n 3 var\
  \ less = require('gulp-less');\n 4 \n 5 // define a task called css\n 6 gulp.task('css',\
  \ function() {\n 7 \n 8 // grab the less file, process the LESS, save to style.css\n\
  \ 9   return gulp.src('public/assets/css/style.less')\n10     .pipe(less())\n11\
  \     .pipe(gulp.dest('public/assets/css'));\n12 \n13 });\n```\n\n### JS 的压缩与合并\n\
  \n随着我们的应用程序开始增长，会有更多的请求会拖慢应用程序的性能。我们将使用两个包来压缩和合并（打包）我们的 JS 文件，这样我们只需要加载一个文件。\n\n\
  ### 压缩 Angular\n\n但是当压缩 Angular 文件时存在一个问题。Angular 文件必须以特定的方式声明，否则压缩过程会破坏它们。\n\n\
  #### 用于压缩的 Angular 模块声明方法\n\n到本书为止，为了简单起见，我们采用了更简单的方法来定义模块。它看起来如下：\n\n\n\n\n\n```javascript\n\
  angular.module('myApp', ['ngRoute'])\n.config(function($routeProvider, $locationProvider)\
  \ {\n  // stuff here\n})\n.controller('mainController', function($http) {\n  //\
  \ stuff here  \n});\n```\n\n为了压缩（minification），声明 Angular 模块的方法如下：\n\n```javascript\n\
  angular.module('myApp', ['ngRoute'])\n.config([\n  '$routeProvider', \n  '$locationProvider',\
  \ \n  function($routeProvider, $locationProvider) {\n    // stuff here\n  }\n])\n\
  .controller('mainController', ['$routeProvider', function($http) {\n  // stuff here\
  \  \n]);\n```\n\n从现在起，你可以随意使用上述代码并这样声明模块，尽管那种语法写起来很麻烦。不过，还有另一种压缩 Angular 文件的方法，它涉及到\
  \ Gulp 和另一个 Gulp 包。\n\n## 使用 Gulp 准备 Angular 压缩\n\nGulp 有一个专门为此目的的包，叫做 [gulp-ng-annotate](https://www.npmjs.com/package/gulp-ng-annotate)。\n\
  \n让我们来安装这个包：\n\n```bash\n$ npm install gulp-ng-annotate --save-dev\n```\n\n现在我们可以在\
  \ `gulpfile.js` 中使用该包并创建一个新任务：\n\n```javascript\nvar ngAnnotate = require('gulp-ng-annotate');\n\
  \n// 用于检查、压缩并合并前端 angular 文件的任务\ngulp.task('angular', function() {\n  return gulp.src(['public/app/*.js',\
  \ 'public/app/**/*.js'])\n    .pipe(jshint())\n    .pipe(jshint.reporter('default'))\n\
  \    .pipe(ngAnnotate())\n    .pipe(concat('app.js'))\n    .pipe(uglify())\n   \
  \ .pipe(gulp.dest('public/dist'));\n});\n```\n\n现在可以运行：\n\n```bash\n$ gulp angular\n\
  ```\n\n我们将看到创建了新的 `app.js`，其中包含了正确版本的 Angular 文件。\n\n![ng-annotate](img/19-mean-workflow----ng-annotate.jpg)\n\
  \nng-annotate\n\n## 监听变化\n\n接下来，我们将自动化 Gulp，这样我们就不用在每次修改文件时进入命令行并输入 `gulp <task_name>`\
  \ 了。\n\n监听文件的任务是 Gulp 内置的，因此这里不需要安装包。但需要注意的是，有一个包用于更复杂的设置，即有许多文件需要监听；那个包叫做 [gulp-watch](https://www.npmjs.com/package/gulp-watch)。\n\
  \n让我们进入 `gulpfile.js` 并设置它监听特定文件。我们还会告诉 Gulp 在检测到文件变化时运行哪些任务。\n\n```javascript\n\
  gulp.task('watch', function() {\n  // 监听 less 文件并运行 css 任务\n  gulp.watch('public/assets/css/style.less',\
  \ ['css']);\n\n  // 监听 js 文件并运行 lint、js 和 angular 任务\n  gulp.watch(['server.js',\
  \ 'public/app/*.js', 'public/app/**/*.js'], ['js', 'angular']);\n});\n```\n\n我们定义了一个要监听的\
  \ CSS 文件以及要运行的任务（我们之前创建的那个）。现在，当我们更新 `style.less` 文件时，可以看到 Gulp 自动更新新的 `style.min.css`。\n\
  \n![Gulp Watch](img/19-mean-workflow----gulp-watch.jpg)\n\nGulp Watch\n\n速度极快！\n\
  \n## 启动 Node 服务器\n\n我们也可以使用 Gulp 来启动服务器。它将直接使用 nodemon，但通过输入一个命令 `gulp` 就能启动整个应用程序，感觉挺酷的。\n\
  \n这里需要的包是 [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon)。让我们安装它：\n\n\
  ```bash\n$ npm install gulp-nodemon --save-dev\n```\n\n配置这个包与我们习惯的有点不同。我们需要定义一些内容，例如启动文件（`server.js`）、监听的文件类型（`js\
  \ less html`）以及要运行的任务。\n\n```javascript\nvar nodemon = require('gulp-nodemon');\n\
  \n// nodemon 任务\ngulp.task('nodemon', function() {\n  nodemon({\n    script: 'server.js',\n\
  \    ext: 'js less html'\n  })\n    .on('start', ['watch'])\n    .on('change', ['watch'])\n\
  \    .on('restart', function() {\n      console.log('Restarted!');\n    });\n});\n\
  \n// 定义默认 gulp 任务\ngulp.task('default', ['nodemon']);\n```\n\n注意我们是如何定义启动文件和监听扩展名的。我们还定义了在服务器启动和变化时运行的任务（在此例情况下为\
  \ `watch`）。\n\n我们还定义了一个名为 `default` 的任务，这是 Gulp 首次会自动查找的任务。\n\n现在我们可以用以下命令运行任务了：\n\
  \n```bash\n$ gulp\n```\n\n我们可以看到服务器启动以及 Gulp 正在监听任何文件。当文件发生变化时，Gulp 将运行相应的任务然后重启服务器！\n\
  \n![Gulp Nodemon](img/19-mean-workflow----nodemon.jpg)\n\nGulp Nodemon\n\n我们所有的优秀开发工具现在都集成到了这个\
  \ `gulpfile.js` 中，我们成了更高效的开发者！还有很多很棒的 Gulp 插件可以查看，尽情尝试其他插件，如 [imagemin](https://www.npmjs.com/package/gulp-imagemin)\
  \ 和 [clean](https://www.npmjs.com/package/gulp-clean)吧。\n\n"
