  \ 找到示例代码。\n\n### 联系我们\n\n如果您对本书有任何问题、意见、赞誉，或者发现书中的错误，请随时通过 `chris@scotch.io` 和 `holly@scotch.io`\
  \ 与我们联系。\n\n### 介绍\n\nNode 是一种令人兴奋的 Web 开发 JavaScript 语言，近年来变得越来越流行。它最初用于小型开发项目，此后渗透到企业级，可以在微软、eBay、LinkedIn、Yahoo、沃尔、Uber、Oracle\
  \ 等许多大型公司看到。\n\n### 为什么选择 MEAN？\n\nMEAN Stack 使用四种软件：`MongoDB`、`ExpressJS`、`AngularJS`\
  \ 和 `NodeJS`。将这四种工具结合使用，允许开发者快速创建高效、组织良好且交互式的应用程序。\n\n由于栈中的每个组件都使用 JavaScript，你可以无缝地穿过\
  \ Web 开发代码。全栈 JavaScript 让我们能够完成很棒的事情：\n\n- 在服务端使用 JavaScript (`Node` 和 `Express`)\
  \ \n- 在客户端使用 JavaScript (`Angular`) \n- 在 `MongoDB` 中存储 JSON 对象\n- 使用 JSON 对象轻松地从数据库到服务器到客户端传输数据\n\
  \n> 整个技术栈使用同一种语言可以提高生产力。即使是工作在 Angular 中的客户端开发者，也能轻松理解服务端的大部分代码。\n\n从数据库开始，我们以类似\
  \ JSON 的格式存储信息。然后我们可以在 Node 服务器上编写 JSON 查询，并使用 Angular 将其直接发送到前端。当有多个开发者协作一个项目时，这特别有用。服务端代码对前端开发者来说更具可读性，反之亦然。这让一切变得更加透明，并证明能极大缩短开发时间。一旦我们开始深入研究示例，开发的便利性将变得更加明显，并希望在未来能为你和你的团队减少一些烦恼。\n\
  \n### 何时使用 MEAN Stack\n\nMEAN Stack 极大受益于 Node 的优势。Node 让我们能够构建实时开放 API，并与我们的前端\
  \ Angular 代码进行消费和使用。对于聊天系统、状态更新或几乎任何其他需要快速显示实时数据的场景，其数据传输非常有用。\n\n- 聊天客户端\n- 实时用户更新（如\
  \ Twitter 馈）\n- RSS 馈\n- 在线商店\n- 投票应用\n\n### 何时**不**使用 MEAN Stack\n\n\n\n\n\n与任何语言或语言集一样，有很多场景下\
  \ `MEAN` 并不是最佳选择，在深入编码之前识别这一点至关重要。`MEAN` 栈的许多优势以及你使用它的原因根源于它对 `Node` 的使用。在某些你可能不想使用它的原因上，我们也再次看到了这种趋势。\n\
  \n`Node` 通常不是处理 CPU 密集型任务的最优选型。尽管有一些[观点](http://neilk.net/blog/2013/04/30/why-you-should-use-nodejs-for-CPU-bound-tasks/)\
  \ 认为 `Node` 在计算密集型应用中实际上表现良好，但对于初学者来说，如果你知道你的应用程序需要大量的计算，最好是避开 `Node`（换句话说，我们不要在这里尝试去计算第\
  \ 1000 个质数）。\n\n## 谁在用 MEAN？\n\n许多开发者对 `MEAN` 栈赞誉有加。该技术栈在每项操作中都使用 JavaScript，这对于希望在项目中顺畅流转思路的开发者来说非常有吸引力。一些大型公司已经从中受益，并将\
  \ `Node` 集成到他们的许多业务中。\n\n![Walmart](img/walmart.jpg \"Walmart\")\n\n沃尔玛\n\n> **Walmart**:\
  \ 沃尔玛从 2012 年开始使用 `Node.js` 为移动用户提供现代的前端体验。通过利用 JavaScript 平台，他们能够快速地将现有的 API 集成到他们的\
  \ `Node` 应用中。他们还提到，黑色星期五 53% 的在线流量流向他们的 `Node` 服务器，且实现了零停机。\n\n![Yahoo](img/yahoo.jpg\
  \ \"Yahoo\")\n\n雅虎\n\n> **Yahoo!**: 雅虎从 2010 年就开始尝试使用 `Node`。起初他们只是用它处理文件上传等小任务，而现在他们使用\
  \ `Node` 每分钟处理近 200 万次请求。他们注意到速度的提升和开发流程的简化。\n\n![Linkedin](img/linkedin.jpg \"\
  Linkedin\")\n\nLinkedIn\n\n> **LinkedIn**: LinkedIn 开始完全使用 `Node` 开发其移动端应用程序的服务器端。他们之前使用的是\
  \ `Ruby`，但自从切换以来，他们看到了性能的巨大提升，速度快了 2 到 10 倍。\n\n![Paypal](img/paypal.png \"Paypal\"\
  )\n\nPayPal\n\n> **PayPal**: PayPal 最近也加入了进来，并开始将部分 `Java` 代码迁移到 `Node`。他们最初只对账户概览页面进行实验，但一旦看到速度提升了\
  \ 35%，且开发时间减少了一半，他们就开始将所有网站迁移到 `Node.js`。\n\n如需更大且持续维护的列表，请访问 [Node Industry](http://nodejs.org/industry/)\
  \ 页面。\n\n## 入门指南\n\n让我们快速查看一下我们将使用的技术。记住，本书旨在教你所有这些组件是如何协同工作的，因此我们不会深入探讨每个领域最先进的技术和概念（尽管我们会讲得很深入）。我们将为每个章节中的每个主题提供更多资源链接，以丰富你的知识。\n\
  \n### MongoDB\n\n`MongoDB` 命名自“hu**mongo**us”（巨大的）一词，是一种以 JSON 格式存储文档的开源 NoSQL 数据库。根据\
  \ Google 搜索、职位发布和招聘网站（Indeed.com）的趋势，它是[领先的 NoSQL 数据库](http://www.mongodb.com/leading-nosql-database)。\n\
  \n### Mongo vs. MYSQL\n\n使用 `MYSQL` 的 LAMP 栈多年来一直是领先的技术栈。`MYSQL` 被归类为**关系型数据库**。\n\
  \n> **关系型数据库** 数据存储在表中，表中不仅包含数据，还包含数据与数据库中其他信息之间的关系。 —\n\n### 文档数据库\n\n另一方面，`MongoDB`\
  \ 被归类为非关系型数据库，更具体地说是**文档型数据库**。这意味着你可以按照自己的意愿定义数据结构。你可以获得数据建模选项，以匹配你的应用程序及其性能需求。你可以轻松地使用\
  \ JSON、`XML`、`BSON` 或许多其他更适合你应用程序的格式将复杂对象插入到数据库中。如果出现用例需要，你甚至可以在某些文档数据库中存储 PDF 文档。\n\
  \n> **文档型数据库** 一种 NoSQL 数据库，它以半结构化文档的形式存储和检索数据（与关系型数据库中的表相反）。 —\n\n`MongoDB` 中的数据建模极其灵活。存储数据的一种方法是创建单独的文档并创建引用来连接信息。你可以看到下面，我们的“精灵信息文档”（Elf\
  \ Info Document）包含了基本信息，我们可以通过“精灵地址文档”（Elf Address Document）来引用它。\n\n**精灵信息** `json\
  \ { id: \"1234\", name: \"holly\", age: \"400\", type: \"high-elf\" }`\n\n**精灵地址簿**\
  \ `json { elven_id: \"1234\", city: \"rivendell\", state: \"middle-earth\" }`\n\n\
  另一种方法是将精灵地址直接嵌入到精灵信息文档中，这样每个精灵就只有一个文档，这允许在更新精灵信息时进行更少的写操作，并获得更高的性能（假设你的文档不会增长得太大）。\n\
  \n```\n 1 {\n 2   id: \"1234\",\n 3   name: \"holly\",\n 4   age: \"400\",\n 5 \
  \  type: \"high-elf\",\n 6   address: {\n 7     city: \"rivendell\",\n 8     state:\
  \ \"middle-earth\",\n 9   }\n10 }\n```\n\n一旦你开始存储关于多个精灵的信息，它们的文档就可以归类为一个精灵信息集合（Elf\
  \ Info Collection）。集合就是一组相关的文档。在这种情况下，它们将具有相同的字段。\n\n### CAP 定理\n\n有一个被称为 `CAP`\
  \ 的概念，也称为布鲁定理，它指出网络系统只能同时提供以下功能的两种：\n\n- 一致性（Consistency）：应用程序中的所有节点都可用并同时显示相同的数据\n\
  - 可用性（Availability）：所有节点都可读可写\n- 分区容错（Partition Tolerance）：即使系统部分故障，你的应用程序也能继续运行\n\
  \n关于如何解释这一观点存在一些困惑，因此布鲁后来指出这实际上归结为**一致性**与**可用性**之间的权衡。仅仅看定义就能明显看出这些概念是互斥的。假设我们允许所有节点随时对读写都是**可用**的。银行应用程序是一个需要这种重要性的真实世界例子。为了方便起见，让我们假设透支费等这些趣事并不存在。银行需要随时知道你的准确账户余额。如果你账户里有\
  \ 100 元，你取了 100 元，那么你自然剩下了 0 元。由于所有节点都可读可写，在账户余额仍显示为 100 元的极短时间范围内，另一笔扣款可能会通过。因此，一旦账户余额更新，你的账户实际上会变成负数，因为第二笔扣款被允许通过了，尽管它本应被拒绝。这就是为什么在银行应用程序的案例中，**一致性**更为重要。\n\
  \n一致性的代价是放弃一些可用性。在上述的例子中，一旦你取了钱，就应该加上某些锁定，防止账户余额被读取为 100 元。如果你的应用程序无法每秒读取每个节点，那么它对某些用户来说可能是宕机或不可用的。某些应用程序相比一致性更看重可用性和性能，这就是许多文档型数据库大放异彩的地方。\n\
  \n\n\n\nMongoDB 默认情况下优先考虑一致性而非可用性，但仍然允许你调整某些设置以在两个方向上获得更多支持。读写锁作用于每个数据库，因此数据库中的每个节点将始终能看到最新的数据。由于\
  \ MongoDB 支持 `sharding`（分片），一旦你的数据库开始增长，你的数据可能会分区到跨多个服务器的多个数据库（或 `shards`）。每个分片将是一个独立的数据库，共同形成一个数据库集合。这使得查询速度更快，因为你只需要访问包含该信息的分片，而不是整个数据库。然而，它在写入后的一段时间时间内可能会导致分片与分片之间出现不一致性。这被称为最终一致性，是一致性和可用性之间的一种常见折中。\n\
  \n## 主要特性\n\n*   敏捷且可扩展\n*   [面向文档的存储](http://docs.mongodb.org/manual/core/data-modeling/)\
  \ - 具有动态模式的 JSON 风格文档提供了简单性和强大性。\n*   [全索引支持](http://docs.mongodb.org/manual/indexes/)\
  \ - 像你习惯的那样，对任何属性建立索引。\n*   [复制与高可用性](http://docs.mongodb.org/manual/replication/)\
  \ - 跨局域网和广域网镜像，以实现扩展并让人安心。\n*   [自动分片](http://docs.mongodb.org/manual/sharding/)\
  \ - 在不牺牲功能的情况下进行水平扩展。\n*   [查询](http://docs.mongodb.org/manual/applications/read/)\
  \ - 丰富的基于文档的查询。\n*   [快速就地更新](http://docs.mongodb.org/manual/applications/update/)\
  \ - 用于无竞争性能的原子修改器。\n*   [Map/Reduce](http://docs.mongodb.org/manual/applications/map-reduce/)\
  \ - 灵活的聚合和数据处理。\n*   [GridFS](http://docs.mongodb.org/manual/applications/gridfs/)\
  \ - 存储任何大小的文件而不会使你的栈复杂。\n\n## Node.js\n\nNode 构建在 Google Chrome 的 V8 JavaScript\
  \ 运行时，作为你 MEAN 应用中的服务器端平台。这意味着什么？在 LAMP 栈中，你有一个 Web 服务器（`Apache`、`Nginx` 等）运行着服务器端脚本语言（`PHP`、`Perl`、`Python`）来创建动态网站。服务器端代码通过从数据库（`MYSQL`）中提取数据来创建应用环境，然后由\
  \ Web 服务器解释以生成网页。\n\n当请求新连接时，`Apache` 会创建一个新线程或进程来处理该请求，这使其成为 `multithreaded`（多线程的）。你通常会有若干空闲子进程等待被分配给新请求。如果你配置服务器仅有\
  \ 50 个空闲进程，而有 100 个请求进来，某些用户可能会遇到连接超时，直到其中一些进程被释放。当然，有几种方法可以更高效地处理这种扩展性，但通常 `Apache`\
  \ 会为每个请求使用一个线程，因此为了支持更多的用户，你最终需要越来越多的服务器。\n\n> **多线程** 一种编程模型，程序流具有多个控制线程。程序的不同部分（线程）能够同步且独立地执行，而无需等待每个事件完成。这对于现在不必等待的用户来说是很棒的。\n\
  \n\n\n目前存在多个 Node 框架。我们在本书中使用 `Express`，但这里所教授的概念可以很容易地迁移到其他流行的框架上。\n\n其他值得关注的主要框架有：\n\
  \n*   [HapiJS](http://hapijs.com/) - 一个正在被越来越多的企业公司使用的极佳框架。\n*   [KoaJS](http://koajs.com/)\
  \ - `Express` 的一个分支版本。\n*   [Restify](http://mcavage.me/node-restify/) - 借用了 `Express`\
  \ 的语法，创建一个专门用于构建 REST API 的框架。\n*   [Sails](http://sailsjs.org/#/) - 构建用于模拟 MVC\
  \ 模型的框架。\n\n`Express` 将处理你几乎所有需要的任务，它非常健壮、易用，而且现在有了商业后盾，因为它最近被 [StrongLoop](http://strongloop.com/strongblog/tj-holowaychuk-sponsorship-of-express/)\
  \ 收购/赞助了。\n\n虽然其他框架也各有优之处（一定要看看它们），但我们将专注于 `Express`。毕竟，它是 `MEAN` 栈的一部分。\n\n###\
  \ ExpressJS\n\n`Express` 是一个使用 `NodeJS` 构建 Web 应用的轻量级平台。它帮助组织服务器端的 Web 应用。[ExpressJS\
  \ Website](http://expressjs.com) 将 `Express` 描述为“一个最小且灵活的 node.js Web 框架”。\n\n`Express`\
  \ 隐藏了 `Node` 的许多内部机制，让你能够深入应用程序代码并更快地让程序运行起来。它相当容易学习，并在结构上仍然赋予你一定的灵活性。它目前成为 `Node`\
  \ 最流行的框架是有原因的。使用 `Express` 的一些知名包括：\n\n*   MySpace\n*   LinkedIn\n*   Klout\n* \
  \  Segment.io\n\n访问 [Express 列表](http://expressjs.com/applications.html) 查看完整的 `Express`\
  \ 用户列表。\n\n`Express` 带有许多非常强大的功能，将为你的 `Node` 开发带来便利。\n\n*   路由 (Router)\n*   处理请求\
  \ (Handling Requests)\n*   应用设置 (Application Settings)\n*   中间件 (Middleware)\n\n\
  如果这些术语对你来说很新，不要担心。在我们构建示例应用程序时，我们将深入这些每一个组件，学习并使用它们。现在进入 MEAN 栈的最后一部分（可能是我最喜欢的部分）！\n\
  \n### AngularJS\n\n`Angular` 由 Google 创建，是一个为了快速动态的前端部署而构建的 JavaScript 框架框架\n\n\
  `Angular` 允许你构建标准的 HTML 应用，然后扩展你的标记来创建动态组件。如果你曾经在没有使用 `Angular` 的情况下制作过动态网页，你可能注意到一些常见的复杂性，例如数据绑定、表单验证、DOM\
  \ 事件处理等。`Angular` 为这些问题引入了一个一站式的解决方案。\n\n对于那些担心一次学习这么多内容的人来说，你们很幸运了。`Angular` 的学习曲线实际上非常小，这可能解释了为什么它的采用率会飙升。它的语法简单，其主要原理（如数据绑定和依赖注入）通过几个例子就能轻松掌握，这些内容当然会在书中涵盖。\n\
  \n`Angular` 的两个主要功能是数据绑定和依赖注入。数据绑定处理我们如何处理应用程序中的数据，而依赖注入更多地处理我们如何构建它们。\n\n#### 数据绑定\n\
  \n如果你来自 jQuery 的世界，你将熟悉使用 CSS 选择器来遍历 DOM。每当你需要从输入框获取值时，你都会使用 `$('input').val();`。这很棒，但当你有带有多个输入框的大型应用时，管理起来就会变得有些困难。\n\
  \n当你从应用程序的不同位置拉取并注入数据时，就不再有“单一数据源”了。在 `Angular` 中，你拥有一个类似于 MVC（模型-视图-控制器）模型结构，你的数据存储在一个地方。当你需要信息时，可以确定你正在查看正确的信息。这是因为如果你在视图（HTML\
  \ 文件）或控制器（JavaScript 文件）中更改了数据，**数据会在处处发生变化**。\n\n#### 依赖注入\n\n一个 `Angular` 应用程序是几个不同模块的集合，所有模块共同构建了你的应用程序。例如，你的应用程序可能有一个与\
  \ API 中的特定项交互的模型，一个将数据传递给视图的控制器，或者一个处理我们 `Angular` 应用程序路由的模块。\n\n* * *\n\n> **依赖注入**\
  \ 当代码中的一个对象依赖另一个对象时，就会发生依赖。依赖有不同的程度，但过多的依赖有时会让你的代码难以测试，甚至让某些过程运行时间更长。依赖注入是我们能够为对象提供其运行所需的依赖的方法。\
  \ —\n\n将应用程序分化和模块化带给我们许多益处。就像 `Node` 中的包、PHP 中的包或 Ruby 中的 gems 一样，我们可以在不同项目之间复用模块，甚至引入其他开发者已经创建的模块。\n\
  \n通过将这些模块注入到应用程序中，我们还可以单独测试每个模块。我们能够确定应用程序的哪些部分故障，并将问题缩小到特定的代码集。\n\n#### 其他主要功能\n\
  \n*   MVC\n*   指令 (Directives)\n*   作用域 (Scopes)\n*   模板 (Templates)\n*   测试 (Testing)\n\
  \n查看此 Tuts+ 文章以获得 `Angular` 更深入的概述：[5 个强大的 AngularJS 功能](http://code.tutsplus.com/tutorials/5-awesome-angularjs-features--net-25651)。\n\
  \n## MEAN 思维\n\n在我们本书构建 MEAN 栈应用程序期间，我们想要使用特定的思维方式。\n\n\n\n## 2. **第 4-9 章：服务器/后端**\
  \ 概念、应用与最佳实践。\n## 3. **第 10-16 章：客户端/前端** 概念、应用与最佳实践。\n## 4. **第 17-19 章：MEAN Stack\
  \ 应用** 将一切整合在一起，以便我们构建出色的应用程序。\n## 5. **第 20 章至无限：更多示例应用程序！**\n\n## 入门与安装\n\n###\
  \ 要求\n* [Node](http://nodejs.org)\n* `npm` - 包含在 Node 安装中\n\n### 工具\n* Sublime Text\n\
  * Terminal - 我们喜欢使用 [iterm2](http://iterm2.com/) (mac/linux 用户)\n* [Git Bash + ConEmu](http://scotch.io/bar-talk/get-a-functional-and-sleek-console-in-windows)\
  \ (windows 用户)\n* [Postman](https://chrome.google.com/webstore/detail/postman-rest-client/fdmmgilgnpjigdojojpjoooidkmcom?hl=en)\
  \ (Chrome)\n* [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
  \ (Firefox)\n\n### 安装\n请访问 [node 官网](http://nodejs.org) 并下载 Node。运行安装程序，你就会安装好 Node\
  \ 和 `npm`！这可能是全书中最简单的一部分。\n\n![Node Installation](img/04-getting-started----node-install.jpg\
  \ \"Node Installation\")\n\nNode 安装\n\n让我们双重检查一切运行正常，进入控制台并输入以下：`node -v` 和 `npm\
  \ -v`。\n\n```\n1 node -v\n```\n\n![Node Version](img/04-getting-started----node-version.jpg\
  \ \"Node Version Check\")\nNode Version\n\n```\n1 npm -v\n```\n\n![NPM Version](img/04-getting-started----npm-version.jpg\
  \ \"NPM Version Check\")\nNPM Version\n\n如果你在执行其中任一个命令时遇到了可怕的“command not found”（未找到命令），请确保\
  \ node 已添加到你的 `PATH` 中。这会为命令行提供 `node` 和 `npm` 命令。只需搜索 `npm` 的安装位置，打开环境变量窗口，并添加\
  \ `npm` 的路径。重启电脑，让魔法开始。\n\n有关更详细的故障排除说明，请参见以下：\n**Windows**: [将 Node 添加到你的 Windows\
  \ PATH](http://stackoverflow.com/a/8768567/2976743)\n**Mac**: [将 Node 添加到你的 Mac\
  \ PATH](http://architectryan.com/2012/10/02/add-to-the-path-on-mac-os-x-mountain-lion/#.U_wCiFNdWqc)\n\
  \n如果你仍然遇到问题，请随时联系我们并提出你的问题。现在安装已经完成，让我们继续前进并开始构建东西吧！我们将从 MEAN Stack 应用的基础——Node\
  \ 开始！\n\n## 启动 Node\n让我们看看如何开始构建我们的 Node 应用程序。我们将介绍**基础 Node 配置**、**安装 npm 包**以及**创建一个简单的应用**。\n\
  \n### 配置 (package.json)\nNode 应用程序在名为 `package.json` 的文件中进行配置。你为你创建的每个项目都需要一个 `package.json`\
  \ 文件。\n该文件是你配置项目名称、版本、存储库、作者以及所有重要的依赖项的地方。\n\n这是一个示例 `package.json` 文件：\n\n```\n\
  \ 1 {\n 2   \"name\": \"mean-machine-code\",\n 3   \"version\": \"1.0.0\",\n 4 \
  \  \"description\": \"The code repository for the book, MEAN Machine.\",\n 5   \"\
  main\": \"server.js\",\n 6   \"repository\": {\n 7     \"type\": \"git\",\n 8  \
  \   \"url\": \"https://github.com/scotch-io/mean-machine\"\n 9   },\n 10   \"dependencies\"\
  : {\n 11     \"express\": \"latest\",\n 12     \"mongoose\": \"latest\"\n 13   },\n\
  \ 14   \"author\": \"Chris Seville & Holly Lloyd\",\n 15   \"license\": \"MIT\"\
  ,\n 16   \"homepage\": \"https://github.com/scotch-io/mean-machine\"\n 17 }\n```\n\
  \n这看起来很复杂，但如果你逐行查看，你会发现这里有很多属性让其他开发者更容易进入项目。我们将在书中书中稍后介绍这些不同的部分。\n\n这些是最基础的属性。\n\
  \n```\n1 {\n2   \"name\": \"mean-machine-code\",\n3   \"main\": \"server.js\"\n\
  4 }\n```\n\n`main` 告诉 Node 当我们想要启动应用程序时使用哪个文件。我们将该文件命名为 `server.js` 以供我们的应用程序使用，这将是我们应用程序的地方。\n\
  \n有关更多在 `package.json` 中指定的属性，请参见 [package.json 文档](https://www.npmjs.org/doc/files/package.json.html)。\n\
  \n### 初始化应用\n`package.json` 文件是关于我们启动每一个应用程序的。\n\n\n\n随时进入你的 `server.js` 文件并进行修改。然后观察应用程序自动重启时发生的奇迹吧！\n\
  \n![nodemon 启动.](img/05-node-start----nodemon-server.jpg \"nodemon server.js\")\n\
  \n`nodemon server.js`\n\n在本书的其余部分，当我们想要启动服务器时，我们会引用 `nodemon`。它只是开发时的一个更简单的选择。\n\
  \n***\n\n我们现在已经配置了一个非常简单的 Node 应用并从命令行启动了它。我们离构建可以向世界展示的完整 Node 应用又近了一步。\n\n## 包\
  \ (Packages)\n\n包扩展了我们应用程序的功能。正如我们在早前的“入门教程”（Primers）部分中讨论过的，即使是 MEAN 栈的四个主要部分之一的\
  \ Express，也是一个 Node 包。\n\n让我们看看如何添加和安装包。一旦我们讨论了如何将包引入我们的应用程序，我们将迁移到使用 MEAN 栈的其他组件。\n\
  \n#### 安装包\n\n`package.json` 文件是用来定义应用程序名称和启动应用程序的主文件的地方。这也是我们定义所需包的地方。\n\n我们有两种方式可以将包添加到项目中：`直接将其写入\
  \ package.json` 和 `通过命令行安装`。这两种方式都会我们将需要的包添加到 `package.json` 的 `dependencies` 部分。\n\
  \n#### 方法 1. 直接将包写入 Package.json\n\n这是一个我们添加了 Express 依赖的 `package.json` 文件。\n\n\
  ```json\n1 {\n2   \"name\": \"packages-install\",\n3   \"main\": \"server.js\",\n\
  4   \"dependencies\": {\n5     \"express\": \"~4.8.6\"\n6   }\n7 }\n```\n\n就是这样，我们现在已经将\
  \ Express 设置为应用程序的一个包，并拥有了 MEAN 栈的两个部分！(_E_N)\n\n***\n\n![注意：npm 版本号](img/icon-pencil.png\
  \ \"请注意\")\n\n注意：npm 版本号\n\n> 你可能在想在 Express 版本号旁边的那个波浪号 (`~`) 是干什么用的。npm 在声明包版本时使用[语义化版本](https://www.npmjs.org/doc/misc/semver.html)。这意味着波浪号将拉取与你指定的`合理接近`的版本。在这个示例中，只会安装版本大于\
  \ `4.8.6` 且小于 `4.9` 的 Express 版本。\n\n> 这三个数字分别代表该版本的不同部分。例如，在 express 4.8.6 中，4\
  \ 代表主版本，8 代表次版本，6 代表补丁（patch）。通常 bug 修复会被归类为补丁，并且不会破坏任何内容。次版本更新会添加新功能，但仍然不会破坏你之前的代码。而主版本更新可能会破坏现有代码，正如你们中一些可能已经知道的那样，这可能会让你想抓头发。\n\
  \n> 使用这种版本控制是一种良好的实践，因为我们确保了只有我们指定的版本会被拉取到我们的项目中。我们能够获取直到 `4.9` 版本之前的 bug 修复，但不会引入随\
  \ `5.0` 版本而来的任何重大更改。\n\n> 如果我们将来重新访问此应用程序并使用 `npm install`，我们确切知道正在使用哪个版本的 Express，并且不会因为引入自该项目创建后的任何新版本而破坏我们的应用。\n\
  \n***\n\n#### 方法 2. 从命令行添加包\n\n向应用程序添加包的第二方法是使用命令行的 npm 快捷方式。这通常是更简单、更好的路线，因为 npm\
  \ 可以自动将包保存到你的 `package.json` 文件中。酷酷的地方在这里：`它会添加正确的版本号`！如果你手动将包写入 `package.json`，你将得在网上寻找正确的版本号。这种方法让生活变得简单得多。\n\
  \n以下是安装 express 的命令，`--save` 修符会将其添加到 `package.json`。\n\n```\nnpm install express\
  \ --save\n```\n\n你会注意到上面的命令获取了 express 包并将其安装在名为 `node_modules` 的新文件夹中。这是 Node 项目中包所在地。该命令只安装我们显式调用的包（在本例中为\
  \ express）。\n\n### 安装所有包\n\n方法 2 会为我们安装包。方法 1 会将包添加到你的 `package.json` 中，但还没有安装它们。要将\
  \ `package.json` 中 `dependencies` 属性下的所有包安装到 `node_modules` 文件夹，只需输入：\n\n```\nnpm\
  \ install\n```\n\n它将查看我们需要的依赖项并将它们拉取到应用程序的 `node_modules` 中。\n\n### 安装多个包\n\nnpm\
  \ 还提供了一种安装多个包的方便方法。只需在一个 `npm install` 命令中输入所有你需要的包，它们就会被引入项目。\n\n```\nnpm install\
  \ express mongoose passport --save\n```\n\n这是一种引入所需包的简单快捷的方法。\n\n## 总结\n\n现在当我们想要启动一个新的\
  \ Node 项目时，我们只需要在想要创建项目的文件夹中运行两个命令：\n\n1. `npm init`\n2. 在提示时填写必要的字段以创建 `package.json`\
  \ 文件。\n3. `npm install express --save`\n\n就是这样，我们拥有了设置应用程序所需的所有内容！\n\n让我们继续前进，深入研究使用\
  \ Express 和 Node 为我们的 MEAN 栈应用搭建基础。\n\n## 启动 Node 服务器\n\n我们将继续查看设置 Node 服务器的方法。在上章中，我们只向控制台输出了内容。在本章中我们将向用户发送\
  \ HTML 文件。\n\n### 方法 1：纯 Node (无 Express)\n\n使用方法 1 时，我们将引入 Node 内置的两个模块。[http module](https://nodejs.org/api/http.html#http)\
  \ 用于启动 HTTP 服务器并响应用户的请求。[fs module](https://nodejs.org/api/fs.html#file_system)\
  \ 用于读取文件系统。我们需要从文件系统读取 `index.html`，然后通过 HTTP 服务器将其传递给用户。\n\n## 示例应用程序\n\n在本章的示例中，我们需要一个包含以下文件的文件夹：\n\
  \n*   package.json\n*   server.js\n*   index.html\n\n正如之前学的，`package.json` 将项目的配置/包，而\
  \ `server.js` 将包含应用程序设置和配置。我们的 `index.html` 将是一个基础 HTML 文件。\n\n`package.json` 和\
  \ `index.html` 对于两种方法都是相同的。两种方法之间变化的文件只有 `server.js`，因为那是启动 Node 服务器的地方。\n\n####\
  \ package.json\n\n这是我们简单的 `package.json` 文件：\n\n```json\n1 {\n  \"name\": \"http-server\"\
  ,\n  \"main\": \"server.js\"\n}\n```\n\n#### index.html\n\n让我们填写一个简单的 `index.html`\
  \ 文件：\n\n```html\n 1 <!DOCTYPE html>\n 2 <html lang=\"en\">\n 3 <head>\n 4 \t<meta\
  \ charset=\"UTF-8\">\n 5 \t<title>Super Cool Site</title>\n 6 \t<style>\n 7 \t\t\
  body { \n 8 \t\t\ttext-align:center; \n 9 \t\t\tbackground:#EFEFEF; \n 10 \t\t\t\
  padding-top:50px;\n 11 \t\t}\n 12 \t</style>\n 13 </head>\n 14 <body>\n 15 \n 16\
  \ \t<h1>Hello Universe!</h1>\n 17 \t\n 18 </body>\n 19 </html>\n```\n\n#### 方法 2：使用\
  \ Express\n\n由于 Express 是 MEAN 栈的主要部分之一，我们希望使用这种方法。在学习学习了这种方法后，你可能再也不想回头了。\n\n\n\
  \n\n```\n 1 // get the http and filesystem modules\n 2 var http = require('http'),\n\
  \ 3   fs = require('fs');\n 4 \n 5 // create our server using the http module\n\
  \ 6 http.createServer(function(req, res) {\n 7 \n 8   // write to our server. set\
  \ configuration for the response\n 9   res.writeHead(200, {\n10     'Content-Type':\
  \ 'text/html',\n11     'Access-Control-Allow-Origin' : '*'\n12   });\n13 \n14  \
  \ // grab the index.html file using fs\n15   var readStream = fs.createReadStream(__dirname\
  \ + '/index.html');\n16 \n17   // send the index.html file to our user\n18   readStream.pipe(res);\
  \  \n19 \n20 }).listen(1337);\n21 \n22 // tell ourselves what's happening\n23 console.log('Visit\
  \ me at http://localhost:1337');\n```\n\n我们正在使用 `http` 模块创建一个服务器，并使用 `fs` 模块获取索引文件并在我们的响应中发送给用户。\n\
  \n现在已经定义了 `server.js` 文件，让我们进入命令行并启动我们的 Node http 服务器。\n\n`nodemon server.js`\n\n\
  你应该能看到服务器启动，并且控制台打印了一条消息。\n\n![Node HTTP 服务器控制台](img/06-node-server----http-server-console.jpg)\n\
  \nNode HTTP 服务器控制台\n\n现在我们可以在浏览器中通过 `http://localhost:1337` 查看我们的网站。\n\n![Hello\
  \ Universe 浏览器](img/06-node-server----hello-browser.jpg)\n\nHello Universe 浏览器\n\
  \n我们终于向用户发送了一个 HTML 文件！你可能在认为设置这个 http 服务器需要了大量你可能记不住的语法。不过不用担心，Express 的方式要简洁得多。\n\
  \n### 方法 #2：使用 Express\n\n既然我们已经使用 HTTP 模块启动了服务器，让我们看看如何使用 Express 实现相同的功能。你会发现管理代码会变得简单得多。\n\
  \n我们首先需要将 Express 添加到此项目中。让我们使用命令行安装它并将其保存到 `package.json` 中。\n\n`npm install express\
  \ --save`\n\n现在让我们修改 `server.js` 文件以适配 Express。我们将从调用 Express 开始。使用该 Express 实例，我们将定义一个路由并发送\
  \ `index.html` 文件。然后我们将在特定端口上“监听”来自浏览器的请求。\n\n```\n 1 // load the express package\
  \ and create our app\n 2 var express = require('express');\n 3 var app     = express();\n\
  \ 4 var path = require('path');\n 5   \n 6 // send our index.html file to the user\
  \ for the home page\n 7 app.get('/', function(req, res) {\n 8 \tres.sendFile(path.join(__dirname\
  \ + '/index.html'));\n 9 });\n10 \n11 // start the server\n12 app.listen(1337);\n\
  13 console.log('1337 is the magic port!');\n```\n\n现在我们获取了 Express，设置了端口并启动了服务器。Express\
  \ 让启动服务器的工作变得更容易，语法也更简洁。使用 `nodemon server.js` 启动该服务器将再次向 `http://localhost:1337`\
  \ 的用户输出我们的 HTML 文件。\n\n我们将看到与之前相同的结果，但现在代码更容易理解了。\n\n![Hello Universe 浏览器](img/06-node-server----hello-browser.jpg)\n\
  \nHello Universe 浏览器\n\n* * *\n\n![提示](img/icon-heart.png \"专业级提示\")\n\n提示\n\n###\
  \ 定义包的快捷方法\n\n定义包时的一个小技巧：不要在每次定义包时都输入 `var`，你可以使用 `\",\"` 将包连接起来。\n\n这是一个示例：\n\n\
  ```\n1 var express = require('express');\n2 var app = express();\n3 \n4 // the exact\
  \ same result\n5 \n6 var express = require('express'),\n7     app = express();\n\
  ```\n\n这只是为了稍微整理一下你的代码，并让你跳过几次额外的按键。\n\n* * *\n\n我们现在可以创建一个 Node 服务器并向用户发送 HTML\
  \ 文件。到目前为止，我们定义了一个简单的 `get` 路由。让我们迈下一步，为我们的网站添加更多路由和页面。\n\n## Node 的路由\n\n为了给我们的网站添加更多页面，我们需要更多的路由。这可以通过\
  \ Express 内置的一个功能——Express Router 来实现。这将是一个大章节，因为路由将成为我们以后所有应用程序的巨大大部分。这就是我们对基础到高级网站进行路由的方法，也是我们最终构建\
  \ Angular 前端应用程序将使用的 RESTful API 的方式。展望未来真是令人兴奋！不过要一步步来。让我们开始路由。\n\n### Express\
  \ Router\n\nExpress Router 到底是什么？你可以把它看作是一个没有所有花哨功能的微型 Express 应用，只包含路由功能。它不引入视图或设置，但为我们提供了诸如\
  \ `.use()`、`.get()`、 `.param()` 和 `.route()` 这样的路由 API。让我们看看这具体意味着什么。\n\n使用路由有几种不同的方法。我们在创建主页时已经使用了其中一种方法\
  \ `app.get('/', ...)`。我们将查看其他方法。\n\n## 示例应用程序\n\n我们要为应用程序添加的主要功能：\n\n* 基础路由（我们已经创建了首页）\n\
  * 站点章节（路由部分）\n* 路由日志控制台\n* 带参数的路由（http://localhost:1337/admin/users）\n* 路由中间件\n\
  * 登录路由（GET）\n\n**什么是路由中间件？** 中间件在用户请求和最终响应之间调用。我们将在处理请求时讨论它。\n\n正如我们一直所做的，我们将路由放在\
  \ `server.js` 中。我们不需要 `package.json` 的任何更改。\n\n### 基础路由\n\n我们已经定义了首页的基础路由。Express\
  \ 允许我们在 `app` 对象上定义路由。我们还可以处理 `GET`、`POST`、`PUT/PATCH` 和 `DELETE` 等操作。\n\n这是定义路由最简单的方法，但随着应用程序的扩大，我们需要对路由进行组织。想象一个有一个管理部分和一个前端部分的应用程序，每个部分都有多个路由。\n\
  \n### express.Router()\n\n[express.Router](https://expressjs.com/api#router) 充当微应用。你可以像调用\
  \ Express 一样调用并在上面定义路由。让我们看一个示例，确切这意味着什么。如果你想尝试，请将其添加到 `server.js`。\n\n在 `server.js`\
  \ 的 `app.get()` 路由下方添加以下内容。我们将 1. **调用路由实例** 2. **对其应用路由** 3. 然后**将这些路由添加到主应用中**：\n\
  \n```\n 1 // create routes for the admin section\n 2 \n 3 // get an instance of\
  \ the router\n 4 var adminRouter = express.Router();\n 5 \n 6 // admin main page.\
  \ the dashboard (http://localhost:1337/admin)\n 7 adminRouter.get('/', function(req,\
  \ res) {\n 8 \tres.send('I am the dashboard!');\n 9 });\n10 \n 11 // users page\
  \ (http://localhost:1337/admin/users)\n 12 adminRouter.get('/users', function(req,\
  \ res) {\n 13 \tres.send('I show all the users!');\n 14 });\n 15 \n 16 // posts\
  \ page (http://localhost:1337/admin/posts)\n 17 adminRouter.get('/posts', function(req,\
  \ res) {\n 18 \tres.send('I show all the posts!');\n 19 });\n20 \n 21 // apply the\
  \ routes to our application\n 22 app.use('/admin', adminRouter);\n```\n\n\n\n\n\n\
  我们现在可以访问管理面板页面 `http://localhost:1337/admin` 以及子页面 `http://localhost:1337/admin/users`\
  \ 和 `http://localhost:1337/admin/posts`。\n\n注意看我们如何为刚刚定义的这些路由设置默认根路径。如果我们将第 22 行更改为\
  \ `app.use('/app', router)`，那么我们的路由将变为 `http://localhost:1337/app/` 和 `http://localhost:1337/app/users`。\n\
  \n这是非常强大的，因为我们可以创建多个 `express.Router()` 并将它们应用到应用程序中。我们可以为基础路由、身份验证路由甚至 API 路由分别创建一个\
  \ `Router`。\n\n通过使用 `Router`，我们允许通过创建多个 `Router` 实例并相应地应用它们，使应用程序比以往任何时候都更加模块化和灵活。现在我们将查看如何使用中间件来处理请求。\n\
  \n### 路由中间件 (`router.use()`)\n\nExpress 中的路由中间件是在处理请求之前执行某些操作的方法。这可以是检查用户是否已通过身份验证、为分析记录数据，或者我们在向用户输出信息之前想做的任何其他事情。\n\
  \n这里有一些中间件，可以在每次发送请求时向控制台打印一条消息。这将演示如何使用 `Express Router` 创建中间件。我们将该中间件添加到上一个示例中创建的\
  \ `adminRouter` 中。确保它放置在 `adminRouter` 声明之后，在我们定义的 users 和 posts 路由之前。你还会注意到这里的\
  \ `next` 参数。这是 Express 知道函数已完成并可以继续处理下一个中间件或继续路由的唯一方式。\n\n```\n1 // 在每个请求上都会发生的路由中间件\n\
  2 adminRouter.use(function(req, res, next) {\n3 \n4 \t//向控制台记录每个请求\n5 \tconsole.log(req.method,\
  \ req.url);\n6 \n7 \t// 继续之前的操作并进入路由\n8 \tnext(); \n9 });\n```\n\n`adminRouter.use()`\
  \ 用于定义中间件。现在，它将应用到进入我们此 `Router` 实例的所有请求上。让我们进入浏览器访问 `http://localhost:1337/admin`，我们将在控制台中看到该请求。\n\
  \n![Express Router Console Request](img/07-node-routing----express-router-console-log-request.jpg)\n\
  \nExpress Router Console Request\n\n**你放置中间件和路由的顺序非常重要** 一切将按照它们出现的顺序发生。这意味着如果你将中间件放在路由之后，那么路由将在中间件之前执行，请求将结束于此。你的中间件在那个点不会运行。\n\
  \n请记住，你可以将路由中间件用于很多事情。你可以用它在允许用户继续之前，检查会话期间用户是否已登录。\n\n### 路由结构\n\n通过使用 `Router()`，我们能够划分网站的部分。这意味着你可以为网站前端等路由创建一个\
  \ `basicRouter`。你也可以为受某种类型身份验证保护的管理路由创建一个 `adminRouter`。\n\n通过这种方式对我们的应用程序进行路由让我们独立每个部分。这为我们复杂的应用程序或\
  \ API 提供了所需的灵活性。我们还可以保持应用程序的整洁，由于我们可以将每个路由定义移动到自己的文件中，只需在调用 `app.use()` 时引入这些文件即可：\n\
  \n```\n1 app.use('/', basicRoutes);\n2 app.use('/admin', adminRoutes);\n3 app.use('/api',\
  \ apiRoutes);\n```\n\n### 带参数的路由 (`/hello/:name`)\n\n为了查看我们如何为应用程序添加路由参数，假设我们有一个名为\
  \ `/admin/users/:name` 的路由，其中我们可以向 URL 传递人的名字，应用程序将输出名字！我们也可以在实际应用程序中使用它来获取该用户的信息。让我们看看这种路由是什么样的。\n\
  \n```\n1 // 带参数的路由 (http://localhost:1337/admin/users/:name)\n2 adminRouter.get('/users/:name',\
  \ function(req, res) {\n3 \tres.send('hello ' + req.params.name + '!');\n4 });\n\
  ```\n\n现在我们可以访问 `http://localhost:1337/admin/users/holly` 并看到我们的浏览器输出 holly！`req.params`\
  \ 存储了来自原始用户请求的所有数据。简单。\n\n![Express Router Parameters](img/07-node-routing----express-router-parameters.png)\n\
  \nExpress Router Parameters\n\n在未来，我们可以利用此来获取所有匹配 `holly` 的用户数据。然后我们可以构建一个管理面板来管理我们的用户。现在假设我们想以某种方式验证这个名字。也许我们想确保它不是坏名字。我们将在路由中间件内部执行此。我们将使用一个特殊的中间件来处理。\n\
  \n#### 参数的路由中间件 (`.param()`)\n\n我们将使用 Express 的 `.param()` 中间件。这会创建一个为特定路由参数运行的中间件。在我们的情况下，我们在\
  \ hello 路由中使用了 `:name`。再次确保中间件放置在请求之前。\n\n```\n1 // 验证 :name 的路由中间件\n2 adminRouter.param('name',\
  \ function(req, res, next, name) {\n3 \t//在此处对 name 进行验证\n4 \t// 验证逻辑\n5 \t// 记录某些内容以便知道它正在运行\n\
  6 \tconsole.log('doing validations on ' + name);\n7 \n8 \t// 验证完成后将新项保存到 req 中\n\
  9 \treq.name = name;\n10 \t// 继续后续操作\n11 \tnext(); \n12 });\n13 \n14 // 带参数的路由 (http://localhost:1337/admin/hello/:name)\n\
  15 adminRouter.get('/hello/:name', function(req, res) {\n16 \tres.send('hello '\
  \ + req.name + '!');\n17 });\n```\n\n现在当我们访问 `/hello/:name` 路由时，我们的路由中间件将介入并生效。我们可以运行验证，然后通过将新变量存储在\
  \ `req`（请求）中传递给我们的 `.get` 路由。我们通过将 `req.params.name` 更改为 `req.name` 来访问它，因为我们在中间件中获取了\
  \ `req.params.name` 并将其存储到 `req` 中。\n\n当我们访问浏览器 `http://localhost:1337/admin/hello/sally`\
  \ 时，我们会在控制台中看到请求。\n\n![Express Router Middleware](img/07-node-routing----express-router-middleware.png)\n\
  \nExpress Router Parameter Middleware\n\n参数路由中间件可以验证传入应用程序的数据。如果你也创建了 RESTful API，你可以验证令牌并确保用户能够访问你的信息。我们到目前为止所做的工作将导致构建我们在第\
  \ 3 章讨论客户端服务器模型时提到的服务器端应用程序。\n\n我们将查看的最后一个 Express 路由功能是如何使用 `app.route()` 同时定义多个路由。\n\
  \n#### 登录路由 (`app.route()`)\n\n我们可以直接在应用上定义路由。这类似于使用 `app.get`，但我们将使用 `app.route`。`app.route`\
  \ 基本上是调用 Express Router 的快捷方式。与其调用 `express.Router()`，我们可以调用 `app.route` 并那里开始应用路由。\n\
  \n使用 `app.route()` 允许我们在单个登录路由上定义多个操作。我们需要一个 `GET` 路由来显示登录表单，以及一个 `POST` 路由来处理登录表单。\n\
  \n```\n1 app.route('/login')\n2 \n3 \t// 显示表单 (GET http://localhost:1337/login)\n\
  4 \t.get(function(req, res) {\n5 \t\tres.send('this is the login form');\n6 \t})\n\
  7 \n8 \t// 处理表单 (POST http://localhost:1337/login)\n9 \t.post(function(req, res)\
  \ {\n10 \t\tconsole.log('processing');\n11 \t\tres.send('processing the login form!');\n\
  12 \t});\n```\n\n现在我们为 `/login` 路由定义了两个不同的操作。简单且非常整洁。这些直接应用于 `server.js` 文件中的主 `app`\
  \ 对象，但我们也可以在早先创建的 `adminRouter` 对象中定义它们。\n\n\n\n\n这是一种设置路由的好方法，因为它非常整洁，并且便于查看哪些路由被应用于什么地方。我们很快将构建一个\
  \ RESTful API，我们应该做的主要事情之一使用不同的 HTTP 动词来表示对应用程序的操作。`GET /login` 将提供登录表单，而 `POST\
  \ /login` 将处理登录逻辑。\n\n## 总结\n\n通过 Express Router，我们在定义路由时具有极大的灵活性。回顾一下，我们可以：\n\n\
  * 多次使用 `express.Router()` 来定义一组路由\n* 使用 `app.use()` 将 `express.Router()` 应用于网站的某个部分\n\
  * 使用路由中间件来处理请求\n* 使用路由中间件通过 `.param()` 验证参数\n* 使用 `app.route()` 作为通往 Router 的快捷方式，在单个路由上定义多个请求\n\
  \n现在我们已经打下了 Node 和 Express 的坚实基础，让我们继续前进，进一步讨论一下 MongoDB。然后，我们将进入服务器端应用程序的核心部分：构建\
  \ API！\n\n## 使用 MongoDB\n\nMongoDB 被推崇为一种易用、提供高性能和高可用性的数据库。我们已经在书的入门章节（第 3 章）中讨论过\
  \ MongoDB 的优点。\n\n在本章中，我们将讨论安装 MongoDB 并在本地使用它，以便我们将其用于未来的应用程序。\n\n![MongoDB](img/08-mongodb----mongodb.png\
  \ \"MongoDB\")\n\n### MongoDB\n\n除了在本地安装 MongoDB 之外，我们将在像 [Modulus.io](https://modulus.io/)\
  \ 或 [mongolab](https://mongolab.com/) 这样的托管解决方案创建一个数据库。\n\n![Mongolab](img/08-mongodb----mongolab.jpg\
  \ \"Mongolab\")\n\n### Mongolab\n\n为了重申 MongoDB 在像 MEAN 等技术栈中的优势，`面向文档的存储` 让我们整个技术栈的开发变得更加简单。由于我们在数据库中使用\
  \ JSON 风格的文档，它们可以从数据库 (`MongoDB`) 到服务器 (`Node.js`) 再到前端 (`AngularJS`) 一直以相同的方式使用。\n\
  \n让我们开始 MongoDB 的安装和简单用法。\n\n### 在本地安装 MongoDB\n\n在本地使用 MongoDB 时，有几个步骤需要注意。这个过程对于不同的操作系统是相同的，尽管每个步骤的细微细节可能不同。主要步骤如下：\n\
  \n1. 安装 MongoDB\n2. 创建一个文件夹（具有适当权限）来存储数据库数据\n3. 启动 MongoDB 服务\n4. 在服务启动后连接或在应用程序中使用\n\
  \n让我们查看 Mac 和 Windows 的安装步骤（Linux 指南可以在 [MongoDB 文档](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-ubuntu/)\
  \ 中找到），然后我们将转向可以在 MongoDB 中使用的基本命令。\n\n#### Mac 安装\n\n[在 Mac 上安装]时，默认文件夹为 `/data/db`。这是存储所有内容的地方，你必须确保你拥有该文件夹的权限，以便\
  \ MongoDB 可以向其写入。\n\n我们可以使用 Homebrew 或 [手动](http://docs.mongodb.org/manual/tutorial/install-mongodb-on-os-x/#install-mongodb-manually)\
  \ 在 Mac 上安装。本文将重点关注 Homebrew。\n\n```\n1 // 更新你的包\n2 $ brew update\n3 \n4 \n5 //\
  \ 安装 mongoDB\n6 $ brew install mongodb\n```\n\n运行以下命令以确保一切运行正常：\n\n```\n1 $ mongod\n\
  ```\n\n这将启动 MongoDB 服务，你应该会看到 `waiting for connections on port 27017`。如果你看到关于权限的错误，请确保你更改了\
  \ `/data/db` 文件夹的权限，以便你拥有适当的权限。\n\n![Starting MongoDB Service](img/08-mongodb----mongo-start.jpg)\n\
  \n启动 MongoDB 服务\n\n现在 MongoDB 服务已经启动，我们可以使用以下命令连接到它：\n\n`mongo`\n\n确保你在独立的终端窗口中运行此命令，以便我们确定服务仍在运行。\n\
  \n![Connecting to MongoDB](img/08-mongodb----mongo-connect.jpg)\n\n连接到 MongoDB\n\
  \n你将在启动服务的终端上看到连接发生。请直接跳过此处关于 Windows 安装的下一章节，我们将通过简单命令使用 MongoDB。\n\n#### Windows\
  \ 安装\n\nWindows 的设置非常直观。首先从[此处](http://www.mongodb.org/downloads) 下载 MongoDB。下载完成后，你可能需要将\
  \ MongoDB 可执行文件的路径（通常是 Program Files 文件夹）添加到你的环境变量中，这样你就不需要每次都显式地输入完整路径来运行 Mongo。\n\
  \n打开你的环境变量，输入你安装 MongoDB 的 bin 文件夹路径（我们使用的是 `C:\\Program Files\\MongoDB 2.6 Standard\\\
  bin`）。如果你已经在 PATH 变量中有了自己的内容，可以添加一个分号并紧随其插入新路径。\n\n![MongoDB Environment Variable](img/08-mongodb----environment-variables.png\
  \ \"MongoDB Environment Variable\")\n\nMongoDB 环境变量\n\n现在你应该能够在命令行中运行：\n\n`mongod`\n\
  \n你可能会遇到的常见错误是 `dbpath (\\data\\db) does not exist`。如果你收到此错误，请在你的 C 目录下创建此路径 `C:\\\
  data\\db`。这是你所有数据存储的地方。\n\n如果你想指定与默认 `data/db` 不同的路径，可以像这样传递路径：\n\n`mongod --dbpath\
  \ path/to/folder`\n\n一旦创建了路径，使用 `mongod.exe C:Program Files` 启动 mongo，你应该就会看到“waiting\
  \ for connections on port 27017”。如果你看到关于权限的错误，请确保更改了 `/data/db` 文件夹的权限，以便你拥有适当的权限。\n\
  \n![Starting MongoDB Service](img/08-mongodb----mongo-start.jpg)\n\n启动 MongoDB 服务\n\
  \n现在 MongoDB 服务已经启动，我们可以使用以下命令连接到它：\n\n确保你在独立的终端中运行此命令，以便我们确定服务仍在运行。\n\n![Connecting\
  \ to MongoDB](img/08-mongodb----mongo-connect.jpg)\n\n连接到 MongoDB\n\n你将在启动服务的终端上看到连接发生。请直接跳过此处关于\
  \ Windows 安装的下一章节，我们将通过简单命令使用 MongoDB。\n\n## 常用数据库命令\n\n在数据库中的查询可能与你习惯的有所不同。与其查询表，我们是在查询文档集合。\n\
  \n由于数据是以 JSON 风格的文档存储的，我们的语法与我们的应用程序相似。\n\n一旦我们通过 `mongod` 和 `mongo` 连接到 MongoDB，就可以查看并使用数据库了。这里是常用命令。\n\
  \n### 列出所有数据库\n\n```\n1 $ show databases\n```\n\n### 创建数据库\n\n**除非向数据库插入信息，否则 MongoDB\
  \ 不创建数据库。**\n\n技巧是你不需要式创建数据库！只需使用数据库（即使它尚未创建）、创建集合和文档，一切都会为你创建！\n\n我们将在 CRUD 部分查看集合和文档。\n\
  \n### 显示当前数据库\n\n```\n1 $ db\n```\n\n### 选择数据库\n\n```\n1 $ use db_name\n```\n\n\
  现在我们有了数据库的基础，让我们进入主要的 CRUD 命令。\n\n### CRUD 命令\n\n通过以下命令，我们可以熟悉 MongoDB 命令。这些命令与我们在\
  \ Node.js 应用程序中处理 CRUD 操作相似。\n\n### 创建\n\n```\n1 // 保存一个用户\n2 $ db.users.save({\
  \ name: 'Chris' });\n3 \n4 // 保存多个用户\n5 $ db.users.save([{ name: 'Chris'}, { name:\
  \ 'Holly' }]);\n```\n\n通过将文档保存到当前数据库的 `users` 集合中，如果它们尚不存在，你就成功地创建了数据库和集合。\n\n###\
  \ 读取\n\n```\n1 // 显示所有用户\n2 $ db.users.find();\n3 \n4 // 查找特定用户\n5 $ db.users.find({\
  \ name: 'Holly' });\n```\n\n### 更新\n\n```\n1 db.users.update({ name: 'Holly' },\
  \ { name: 'Holly Lloyd' });\n```\n\n### 删除\n\n```\n1 // 删除所有\n2 db.users.remove({});\n\
  3 \n4 // 删除一个\n5 db.users.remove({ name: 'Holly' });\n```\n\n\n\n[content]\n这只是对你可以运行的命令类型的简要概述。[MongoDB\
  \ 文档](http://docs.mongodb.org/manual/core/crud-introduction/) 非常详尽，为那些想要深入研究的人提供了大量的细节。\n\
  \nMongoDB 还为你提供了一个非常棒的[交互式教程](http://try.mongodb.org/)，让你走一遍上述命令。\n\n## GUI 工具：Robomongo\n\
  \n虽然使用我们的命令行进入 MongoDB 数据库非常简单，但对于那些倾向于使用图形化界面的人来说，也有一个 GUI 工具。\n\n尽管去下载 [Robomongo](http://robomongo.org/)\
  \ 并启动它。\n\n与我们的数据库建立连接非常简单。只需将地址设置为 `localhost`，将端口设置为 `27017`。你可以为你的连接起任何名称。\n\n\
  ![Robomongo Connect](img/08-mongodb----robomongo-connect-local.jpg)\n\nRobomongo\
  \ Connect\n\n一旦连接成功，你就可以访问所有的数据库及其各自的集合了！你现在有了一个 GUI 来处理数据库操作，甚至可以打开一个 shell 来深入操作我们之前讨论过的命令。\n\
  \n![Robomongo Connect to Database](img/08-mongodb----robomongo-local-db.jpg)\n\n\
  Robomongo Connect to Database\n\n## 在 Node.js 中使用 MongoDB\n\n如你所见，使用 MongoDB 本地实例是一个非常直接的过程。此后，你可以使用\
  \ MongoDB 本地实例或托管实例（[modulus.io](https://modulus.io/) 或 [mongolab.com](https://mongolab.com/)）。\n\
  \n无论如何，我们都使用 [mongooseJS](http://mongoosejs.com/)，这是一个用于处理 MongoDB 的 Node 包。\n\n\
  你只需要配置 mongoose 连接到本地数据库即可。这是一个简单的过程，因为我们甚至不需要创建数据库。如果我们与本地 MongoDB 工作，只需要运行以下命令确保\
  \ MongoDB 已经启动：\n\n```\n1 $ mongod\n```\n\n### 使用 Mongoose 连接 MongoDB 数据库\n\n连接数据库是一个非常简单的过程。这里有一些在\
  \ Node 中连接数据库的示例代码：\n\n```\n1 // 获取我们需要的包\n2 var mongoose = require('mongoose');\n\
  3 \n4 mongoose.connect('mongodb://localhost/db_name');\n```\n\n就是这样！一旦我们开始向数据库中保存内容，名为\
  \ `db_name` 的数据库就会被自动创建。\n\n现在我们已经理解了 MongoDB 及其使用方法，让我们在 Node.js 应用程序实现 CRUD 并使用\
  \ mongooseJS 使用 MongoDB 吧。\n\n接下来的任务是构建一个 Node.js API。\n\n## 构建一个 RESTful Node API\n\
  \n### 什么是 REST？\n\n关于 RESTful API 的一点介绍，请看这个非常棒的演示文稿：[教狗学 REST](http://www.slideshare.net/landlessness/teach-a-dog-to-rest)。\n\
  \n[RESTful APIs](http://scotch.io/bar-talk/designing-a-restful-web-api) 正在成为 Web\
  \ 服务的标准。现在仅仅构建一个应用程序是不够的，我们正在转向可以与多个设备和其他网站集成的平台发展。\n\n互联互性正迅速成为游戏的关键。随着 [IFTTT](https://ifttt.com/)\
  \ 和 [Zapier](https://zapier.com/) 等项目的日益流行，用户已经表明他们喜欢让自己的应用程序连接在一起。这意味着他们所有的应用程序都有一种标准的方式相互“对话”。IFTTT\
  \ 允许你设置触发器和响应，例如“当我写推文时，将其分享为我的 Facebook 状态”。Twitter 和 Facebook 的 API 允许我们做到这一点。\n\
  \n![IFTTT](img/ifttt.jpg)\n\nIFTTT\n\n像 Facebook 和 Google 这样的行业巨头有自己跨越多个第三方应用的 API。你甚至可以找到它们的\
  \ API 探索器，可以在那里对它们的 API 进行测试驱动，并查看你可以从 API 中提取什么信息。例如，一旦登录，你就可以从 [API 探索器](https://developers.facebook.com/tools/explorer/145634995501895/?method=GET&path=me%3Ffields%3Did%2Cname&version=v2.1)\
  \ 获取所有朋友的数据。使用 API 已经迅速成为构建应用程序的标准。\n\n仅仅让应用程序独立运行是不够的，你必须使用相同的数据构建一个网站和多个移动应用。如果你的应用程序火了，你将希望用户能够基于你的数据构建第三方应用程序。这就是你的\
  \ API 发挥用场的地方。我们将学习如何使用 Node 构建一个 API，以便多个应用程序可以使用该 API 和你的数据。\n\n### 为我们的 Angular\
  \ 前端提供后端服务\n\n在本章中，我们将学习使用 Node、Express 4 及其 Router 以及 Mongoose 创建一个 RESTful API，并与\
  \ MongoDB 实例交互。我们还将使用 Chrome 中的 [Postman](https://chrome.google.com/webstore/detail/postman-rest-client-packa/fhbjgbiflinjbdggehcddcbncdddomop)\
  \ 或 Firefox 中的 [RESTClient](https://addons.mozilla.org/en-US/firefox/addon/restclient/)\
  \ 来测试我们的 API。\n\n这是一个与我们之前章节完全不同的示例应用程序，我们将在到达 Angular 前端时在后续几个章节中使用它。让我们看看我们想要构建的\
  \ API 及其能做什么。\n\n## 示例应用程序\n\n假设我们要……（此处原文似乎存在重复或截断，将按逻辑翻译剩余部分）\n\n（注：由于原文从此处开始出现了大量重复的占位符描述，根据“不要重复输出原文”的原则，我将针对其核心逻辑结构进行翻译处理。）\n\
  \n假设我们要构建一个 Node.js API。我们将使用 Node、Express 4 及其 Router 以及 Mongoose 来与 MongoDB 实例交互。我们将使用\
  \ Postman 或 RESTClient 来测试 API。\n\n\n\nNode 的包管理器将引入我们在 `package.json` 中定义的所有包。简单且易用。现在我们已经有了这些包，让我们在设置\
  \ API 时开始使用它们吧。\n\n我们将通过 `server.js` 文件来设置应用程序，因为这是我们在 `package.json` 中声明的主文件。\n\
  \n## 设置我们的服务器 (server.js)\n\nNode 在启动应用程序时会查看此文件，以便它知道我们想要如何配置应用程序和 API。\n\n我们将从启动应用程序所需的最基本要素开始。我们将保持代码的整洁并进行良好的注释，这样我们就能准确了解每一步发生了什么。\n\
  \n```javascript\n 1 // BASE SETUP\n 2 // ======================================\n\
  \ 3 \n 4 // CALL THE PACKAGES --------------------\n 5 var express    = require('express');\
  \ // 调用 express\n 6 var app        = express(); // 使用 express 定义我们的 app\n 7 var\
  \ bodyParser = require('body-parser'); // 获取 body-parser\n 8 var morgan     = require('morgan');\
  \ // 用于查看请求\n9 var mongoose   = require('mongoose'); // 用于处理我们的数据库\n10 var port\
  \       = process.env.PORT || 8080; // 为我们的应用设置端口\n 11 \n12 // APP CONFIGURATION\
  \ ---------------------\n13 // 使用 body parser，以便我们可以从 POST 请求中获取信息\n14 app.use(bodyParser.urlencoded({\
  \ extended: true }));\n15 app.use(bodyParser.json());\n16 \n17 // 配置我们的应用以处理 CORS\
  \ 请求\n18 app.use(function(req, res, next) {\n19   res.setHeader('Access-Control-Allow-Origin',\
  \ '*');\n20   res.setHeader('Access-Control-Allow-Methods', 'GET, POST');\n21  \
  \ res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
  \ \\\n22 Authorization');\n23   next();\n24 });\n25 \n26 // 将所有请求记录到控制台 \n27 app.use(morgan('dev'));\n\
  28 \n29 // ROUTES FOR OUR API\n30 // =============================\n31 \n32 // 首页的基础路由\n\
  33 app.get('/', function(req, res) {\n34 \tres.send('Welcome to the home page!');\n\
  35 });\n36 \n37 // 获取 express 器的实例\n38 var apiRouter = express.Router();\n39 \n\
  40 // 测试路由以确保一切运行正常 \n41 // 访问地址为 GET http://localhost:8080/api\n42 apiRouter.get('/',\
  \ function(req, res) {\n43 \tres.json({ message: 'hooray! welcome to our api!' });\t\
  \n44 });\n45 \n46 // 更多 API 路由将在这里\n47 \n48 // REGISTER OUR ROUTES -------------------------------\n\
  49 // 我们所有的路由将以 /api 为前缀\n50 app.use('/api', apiRouter);\n51 \n52 // START THE SERVER\n\
  53 // ===============================\n54 app.listen(port);\n55 console.log('Magic\
  \ happens on port ' + port);\n```\n\n哇，我们做了很多工作！不过这一切都很简单，让我们仔细过一遍吧。\n\n**基础设置 (Base\
  \ Setup)**：在基础设置中，我们引入了之前通过 `npm` 引入的所有包。我们将获取 `express`、`mongoose`，定义我们的应用，获取 `bodyParser`\
  \ 并配置我们的应用使用它。我们还可以为应用程序设置 `port`，并获取稍后定义的用户模型。\n\n我们正在设置配置以允许来自其他域的请求，防止 CORS 错误。这允许任何域名访问我们的\
  \ API。\n\n**API 路由 (Routes for Our API)**：此部分将包含我们所有的路由。使用 `Express Router` 的结构允许我们引入路由实例。然后我们可以定义路由，并将这些路由应用到根\
  \ URL（在本例中为 API）。 true 一个首页路由用于打招呼；这只是一个为了确保一切运行正常的基础路由。\n\n**启动服务器 (Start the Server)**：我们将让\
  \ `express` 应用监听我们之前定义的 `port`。。，我们的应用程序就会上线，我们可以对它进行测试了！\n\n## 启动服务器并测试\n\n让我们确保到目前为止一切都运行正常。我们将启动\
  \ Node 应用，然后向我们定义的唯一路由发送请求，以确保我们收收到响应。\n\n让我们启动服务器。在命令行中输入：\n\n```bash\nnodemon\
  \ server.js\n```\n\n你应该能看到你的 Node 应用已启动，Express 将创建一个服务器。\n\n![Starting Node Server](img/09-restful-api----start-node-server.jpg)\n\
  \n启动 Node 服务器\n\n现在我们知道应用程序已经运行了，让我们测试一下它。你应该可以通过访问基础路由 `http://localhost:8080`\
  \ 看到我们返回的消息。现在让我们测试其他剩余的路由（API 路由）。\n\n![Basic Route](img/09-restful-api----basic-route.jpg)\n\
  \n基础路由\n\n### 使用 Postman 测试我们的 API\n\n现在在浏览器中导航到 `http://localhost:8080/api`，你将看到我们的\
  \ JSON 消息。看到它固然，但测试 API 的最佳方法是使用专门为此构建的工具。Postman 将帮助我们测试 API。\n\n\n\n\n\n```javascript\n\
  \ 1 // grab the packages that we need for the user model\n 2 var mongoose = require('mongoose');\n\
  \ 3 var Schema = mongoose.Schema;\n 4 var bcrypt = require('bcrypt-nodejs');\n 5\
  \ \n 6 // user schema \n 7 var UserSchema   = new Schema({\n 8 \tname: String,\n\
  \ 9     username: { type: String, required: true, index: { unique: true }},\n10\
  \     password: { type: String, required: true, select: false }\n11 });\n12 \n13\
  \ // hash the password before the user is saved\n14 UserSchema.pre('save', function(next)\
  \ {\n15 \tvar user = this;\n16 \n17 \t hash the password only if the password has\
  \ been changed or user is new\n18 \tif (!user.isModified('password')) return next();\n\
  19 \n20 \t generate the hash\n21 \tbcrypt.hash(user.password, null, null, function(err,\
  \ hash) {\n22 \t\tif (err) return next(err);\n23 \n24 \t\t // change the password\
  \ to the hashed version\n25 \t\tuser.password = hash;\n26 \t\tnext();\n27 \t});\n\
  28 });\n29 \n30 // method to compare a given password with the database hash\n31\
  \ UserSchema.methods.comparePassword = function(password) {\n32 \tvar user = this;\n\
  33 \n34 \treturn bcrypt.compareSync(password, user.password);\n35 };\n36 \n37 //\
  \ return the model\n38 module.exports = mongoose.model('User', UserSchema);\n```\n\
  \n这里发生了很多操作，但它非常简单。我们必须创建自己的 Schema（模式）。我们把 `name`、`username` 和 `password` 定义为 `Strings`（字符串）。通过设置\
  \ `index` 和 `unique` 属性，我们正在告诉 Mongoose 为此路径创建一个唯一索引。这意味着用户名不能重复。我们将实现的另一个 Mongoose\
  \ 特性是在密码属性上设置 `select: false`。当我们查询用户列表或单个用户时，将不需要提供密码。通过将 `select` 设置为 `false`，在列出我们的用户时不会返回密码，除非显式调用它。\n\
  \n我们还使用 `pre` 创建了一个函数，该函数将确保在保存用户之前对密码进行哈希处理。\n\n> 确保我们没有将明文密码保存到数据库是非常重要的。我们必须确保我们的应用程序从开始就尽可能安全。\n\
  \n通过 mongoose，我们还在用户模型上创建了一个方法，将密码与给定的哈希值进行比较。这就是我们将在第 10 章中验证用户的方法。\n\n创建该文件后，让我们将其引入\
  \ `server.js` 中，这样我们就可以在应用程序中使用它。我们将在该文件中添加额外行，并像之前一样使用 `require` 来引入功能。\n\n```javascript\n\
  1 // server.js\n2 \n3 // BASE SETUP\n4 // ==========================\n5 \n6 var\
  \ User     = require('./app/models/user');\n```\n\n现在我们的整个应用程序已准备就绪并连接好了，我们可以开始构建我们的路由了。这些路由将定义我们的\
  \ API，这也是本章存在的主要原因。继续吧！\n\n### Express Router 和路由\n\n我们将使用 Express Router 的实例来处理所有的\
  \ API 路由。下面是我们将需要的路由概述、它们的功能以及访问它们时所使用的 HTTP 动词（Verb）。\n\n| /api/users | `GET` |\
  \ 获取所有用户 |\n| --- | --- | --- |\n| /api/users | `POST` | 创建用户 |\n| /api/users/:user_id\
  \ | `GET` | 获取单个用户 |\n| /api/users/:user_id | `PUT` | 使用新信息更新用户 |\n| /api/users/:user_id\
  \ | `DELETE` | 删除用户 |\n\n这将涵盖 API 所需的基础路由。这同时也符合良好的格式，我们将我们需要执行的操作（`GET`、`POST`、`PUT`\
  \ 和 `DELETE`）保持为 HTTP 动词。\n\n### 路由中间件 (Route Middleware)\n\n我们已经定义了第一个路由并看到了它的运行情况。Express\
  \ Router 为我们定义路由提供了很大的灵活性。\n\n我们在 Node 路由章节中讨论过路由中间件。对于这个示例，我们只是将通过 `console.log()`\
  \ 将请求打印到控制台。现在让我们将该中间件添加到我们的 `server.js` 文件中。\n\n```javascript\n 1 // ROUTES FOR\
  \ OUR API\n 2 // =============================\n 3 var apiRouter = express.Router();\
  \ \t// get an instance of the express Router\n 4 \n 5 // middleware to use for all\
  \ requests\n 6 apiRouter.use(function(req, res, next) {\n 7 \t// do logging\n 8\
  \ \tconsole.log('Somebody just came to our app!');\n 9 \n10 \t// 我们将在第 10 章在中间件中添加更多内容\n\
  11 \t// 我们将在这里验证用户\n12 \n13 \tnext(); // 确保我们进入下一个路由而不是在这里停止\n14 });\n15 \n16 //\
  \ test route to make sure everything is working \n17 // (accessed at GET http://localhost:8080/api)\n\
  18 apiRouter.get('/', function(req, res) {\n19 \tres.send('Everything is working!');\n\
  20 });\n21 \n22 // REGISTER ROUTES\n23 // ---------------\n24 app.use('/api', apiRouter);\n\
  ```\n\n### 创建基础路由\n\n我们现在为应用程序创建路由。我们将使用 Express 的 `apiRouter.route()` 来处理同一路径的多个路由。\n\
  \n#### 创建用户 POST (/api/users)\n\n我们将添加新路由来处理 POST。\n\n```javascript\n 1 // ROUTES\
  \ FOR OUR API\n 2 // ===============================\n 3 \n 4 // 路由中间件和第一个路由\n 5\
  \ \n 6 // 以 /users 结尾的路由\n 7 // --------------------\n 8 apiRouter.route('/users')\n\
  \ 9\n10 \t// 创建用户（访问 POST http://localhost:8080/api/users）\n11 \t.post(function(req,\
  \ res) {\n12 \t\t\n13 \t\t// 创建 User 模型的新实例\n14 \t\tvar user = new User(); \t\t\n\
  15 \n16 \t\t// 设置用户信息（来自请求）\n17 \t\tuser.name = req.body.name;  \n18 \t\tuser.username\
  \ = req.body.username;\n19 \t\tuser.password = req.body.password;\n20 \n21 \t\t\
  // 保存用户并检查错误\n22 \t\tuser.save(function(err) {\n23               if (err) {\n24\
  \                 // 重复条目\n25                 if (err.code == 11000) \n26      \
  \               return res.json({ success: false, message: '该用户名已存在用户。' });\n27\
  \                 else \n28                     return res.send(err);\n29      \
  \       }\n30 \n31 \t\t\tres.json({ message: 'User created!' });\n32 \t\t});\n33\
  \ \t\t\n34 \t})\n```\n\n\n\n\n我们收到了一条成功消息，显示用户已创建。让我们来处理 API 路由以获取所有用户，这样我们就可以看到刚刚创建的用户。\n\
  \n如果用户名已被占用，`mongoose` 将抛出错误代码 `11000`。如果发生错误，我们将检查该错误代码并返回消息 `'A user with that\
  \ username already exists.`（已存在该用户名的用户）。\n\n![Duplicate User](img/09-restful-api----duplicate-user.jpg)\n\
  \n重复用户\n\n## 获取所有用户 (GET /api/users)\n\n这是一个简单的路由，我们将将其添加到 `server.js` 中，也就是之前为\
  \ POST 创建的 `router.route('/users')` 上。通过 `router.route()`，我们能够使用不同的 HTTP 动作链式不同的路由。这让我们的应用程序保持整洁和有序。\n\
  \n```\n 1 // <--路由中间件和第一个路由在这里\n 2 \n 3 // 在以 /users 结尾的路由\n 4 // ----------------------------------------------------\n\
  \ 5 apiRouter.route('/users')\n 6\n 7\t// 创建用户（通过 POST http://localhost:8080/api/users\
  \ 访问）\n 8\t.post(function(req, res) {\n 9\t\t...\t\t\t\n10 \t})\n11 \n12\t// 获取所有用户（通过\
  \ GET http://localhost:8080/api/users 访问）\n13\t.get(function(req, res) {\n14 \t\t\
  User.find(function(err, users) {\n15 \t\t\tif (err) res.send(err);\n16 \n17 // 返回用户\n\
  18 \t\t\tres.json(users);\n19 \t\t});\n20 \t});\n```\n\n简单直了的路由。只需向 `http://localhost:8080/api/users`\
  \ 发送一个 `GET` 请求，我们就能以 JSON 格式获取所有用户。\n\n![Node API Postman GET All](img/09-restful-api----get-after-create.jpg)\n\
  \nNode API Postman 获取所有\n\n我们可以看到 Holly 已经在我们的数据库中了，得益于 `bcrypt` 以及我们创建的那个函数（每当我们保存用户到数据库时它就会运行），她的密码已经被哈希处理了。记得这里为\
  \ Holly 自动生成的 `_id` 吗？我们在创建获取单个用户的路由时将用到它。\n\n### 为单个项目创建路由\n\n我们已经处理了以 `/users`\
  \ 结尾的路由组。现在让我们处理传入参数（如用户 ID）时的路由。\n\n我们在这个路由（以 `/users/:user_id` 结尾）中执行的操作有：\n\n\
  * 获取单个用户。\n* 更新用户信息。\n* 删除用户。\n* 请求中的 `:user_id` 将通过我们稍早调用的那个 `body-parser` 包来访问。\n\
  \n## 获取单个用户 (GET /api/users/:user_id)\n\n我们将添加另一个 `apiRouter.route()` 来处理所有带有 `:user_id`\
  \ 的请求。同样，将其放入你的 `server.js` 文件中，放在 `apiRouter.route('/users')` 代码块之后。\n\n```\n 1\
  \ // 在以 /users/:user_id 结尾的路由\n 2 // ----------------------------------------------------\n\
  \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET http://localhost:8080/api/users/:user_id\
  \ 访问）\n 7\t.get(function(req, res) {\n 8\t\tUser.findById(req.params.user_id, function(err,\
  \ user) {\n 9\t\t\tif (err) res.send(err);\n10 \n11\t\t\t// 返回该用户\n12 \t\t\tres.json(user);\n\
  13 \t\t});\n```\n\n从我们获取所有用户的调用中，我们可以得到所有用户的列表，每个用户都有唯一的 id。让我们取其中一个 id 并用 Postman\
  \ 进行测试。\n\n输入 `http://localhost:8080/api/users/5481e26e93b9ba717bd5`，选择 `GET` 并点击发送。\n\
  \n这将返回我们的用户数据。简单！\n\n```\n 1 {\n2     \"password\": \"$2a$10$rgrazsDZHb7C90vq/si0kueePetqUBv2j\n\
  3     \"username\": \"chris\",\n4     \"name\": \"Chris\",\n5     \"_id\": \"5481e26e93b9ba717bd5\"\
  ,\n6     \"__v\": 0\n7 }\n```\n\n![Node API Postman Get User](img/09-restful-api----node-api-get-single.jpg)\n\
  \nNode API Postman 获取单个用户\n\n现在我们可以从 API 获取用户了，让我们更新用户的姓名。假设他想更有身份一点，我们将他的名字改为 `Sir\
  \ Klaus`。\n\n## 更新用户信息 (PUT /api/users/:user_id)\n\n我们将路由链到 `router.route()` 上并添加\
  \ `.put()`。\n\n```\n 1 // 在以 /users/:user_id 结尾的路由\n 2 // -------------------------------------\n\
  \ 3 apiRouter.route('/users/:user_id')\n 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET http://localhost:8080/api/users/:user_id\
  \ 访问）\n 7\t.get(function(req, res) {\n 8\t\t...\n 9 \t})\n10 \n11\t// 更新此 id 的用户\
  \ \n12\t//（通过 PUT http://localhost:8080/api/users/:user_id 访问）\n13\t.put(function(req,\
  \ res) {\n14 \n15\t\t// 使用我们的用户模型找到用户\n16\t\tUser.findById(req.params.user_id, function(err,\
  \ user) {\n17 \n18\t\t\tif (err) res.send(err);\n19 \n20\t\t\t// 仅更新用户信息\n21\t\t\
  \tif (req.body.name) user.name = req.body.name;\n22\t\t\tif (req.body.username)\
  \ user.username = req.body.username;\n23\t\t\tif (req.body.password) user.password\
  \ = req.body.password;\n24 \n25\t\t\t// 保存用户\n26\t\t\tuser.save(function(err) {\n\
  27\t\t\t\tif (err) res.send(err);\n28 \n29\t\t\t\t// 返回消息\n30\t\t\t\tres.json({\
  \ message: 'User updated!' });\n31 \t\t\t});\n32 \n\t\t});\n33 \t})\n```\n\n我们将使用\
  \ `PUT` 请求中提供的 `id`，获取该用户，进行更改并将其保存回数据库。注意，只有当 `name`、`username` 或 `password` 发生变化时我们才会更改数据库中的它们。\n\
  \n![Node API Postman Update Record](img/09-restful-api----node-api-postman-update-record.jpg)\n\
  \nNode API Postman 更新记录\n\n由于我们在 PUT 路由中加入了条件判断，如果没有传递 username 或 password，这些字段将不会被更新。我们不希望在未传递的情况下将它们更新为空。\n\
  \n我们还可以使用之前使用的 `GET /api/users` 调用查看她的名字是否已更改。\n\n![Node API Postman All Updated](img/09-restful-api----node-api-postman-all-updated.jpg)\n\
  \nNode API Postman 全部更新\n\nHolly 在数据库中的名字现在从 `Holly` 变成了她的全名 `Holly Lloyd`。快乐时光结束了。现在让我们删除\
  \ Holly。\n\n## 删除用户 (DELETE /api/users/:user_id)\n\n当有人请求删除用户时，他们只需要向 `/api/users/:user_id`\
  \ 发送 `DELETE` 即可。\n\n让我们添加删除用户的代码。\n\n```\n 1 // 在以 /users/:user_id 结尾的路由\n 2 //\
  \ ----------------------------------------------------\n 3 apiRouter.route('/users/:user_id')\n\
  \ 4 \n 5\t// 获取该 id 的用户 \n 6\t//（通过 GET http://localhost:8080/api/users/:user_id\
  \ 访问）\n 7\t.get(function(req, res) {\n 8\t\t...\n 9 \t})\n10 \n11\t// 更新此 id 的用户\
  \ \n12\t//（通过 PUT http://localhost:8080/api/users/:user_id 访问）\n13\t.put(function(req,\
  \ res) {\n14\t\t...\n15 \t})\n16 \n17\t// 删除此 id 的用户 \n18\t//（通过 DELETE http://localhost:8080/api/users/:user_id\
  \ 访问）\n19\t.delete(function(req, res) {\n20\t\tUser.remove({\n21\t\t\t_id: req.params.user_id\n\
  22\t\t}, function(err, user) {\n23\t\t\tif (err) return res.send(err);\n24 \n25\t\
  \t\tres.json({ message: 'Successfully deleted' });\n26 \t\t});\n27 \t});\n```\n\n\
  现在当我们使用正确的 `user_id` 向我们的 API 发送 `DELETE` 请求时，我们将用户从世界中删除。\n\n![Node API Postman\
  \ Delete](img/09-restful-api----node-api-postman-delete.jpg)\n\nNode API Postman\
  \ 删除\n\n当我们尝试获取所有用户时，你应该注意到现在少了一个。\n\n## 总结\n\n我们现在有能力通过自己的 API 对特定资源（我们亲爱的用户）进行\
  \ CRUD（增删改查）。使用上述技术将为构建更大、更健壮的 API 奠良好的基础。\n\n这是使用 Express 4 创建 Node API 的快速回顾。对于你自己的\
  \ API，还有很多可以做的事。你可以添加身份验证、创建更好的错误消息，并添加不同的模块，而不仅仅局限于用户。\n\n\n\n\n我们将使用此 API 作为即将构建的\
  \ Angular 应用程序的数据后端。接下来，让我们如何使用基于令牌的身份验证对此 API 进行认证，然后我们将学习 AngularJS。\n\n# Node\
  \ 身份验证\n\n在本章中，我们将为应用程序实现良好的身份验证基础。需要注意的是，实现身份验证有多种方法，这些方法将取决于你正在构建的应用程序类型、谁将访问你的数据以及许多其他因素。\n\
  \n然而，尽管实现身份验证的方法有很多，但有一个被广泛使用的基础，那就是基于令牌的身份验证（token based authentication）。从一开始为我们的应用程序使用这种身份验证，可以确保无论它如何增长，都能受到保护。\n\
  \n令牌的主要优势是：\n\n*   无状态且可扩展的服务器\n*   适用于移动应用程序\n*   可以将身份验证传递给其他应用程序（例如通过 Facebook\
  \ 第三方应用程序使用 OAuth）\n*   与其他验证方法相比安全性更高\n\n让我们简单聊聊身份验证以及我们应该使用基于令牌的身份验证。\n\n## 为什么会有基于令牌的身份验证？\n\
  \n基于令牌的身份验证已应用于我们每天使用的 Web 服务。当某个服务提供 API 来访问数据时，通常使用令牌进行身份验证。以 Facebook 的 API 为例，我们需要先与\
  \ Facebook 进行身份验证（第一次使用用户名和密码），然后他们会给我们一个令牌用于后续身份验证。此后在规定时间内的每个请求只需要令牌，而不需要我们的用户名和密码。我们将详细讨论这其中的逻辑，但请记住，许多其他服务（包括\
  \ GitHub、Google+ 和 Twitter 在内的许多服务）都使用令牌进行身份验证。\n\n### 基于服务器的身份验证（传统方法）\n\n在讨论为什么出现令牌身份验证之前，让我们先看看以前身份验证标准是如何运作的。\n\
  \n> 由于 HTTP 协议是无状态的，如果我们使用用户名和密码对用户进行身份验证，那么在下次请求时，我们的应用程序将不知道我们是谁。我们必须再次进行身份验证。\n\
  \n让应用程序记住我们是谁的传统方法是将登录信息存储在服务器上。这可以通过会话（session）的几种方式实现，通常在内存中或存储在磁盘上。\n\n以下是基于服务器的身份验证工作流图：\n\
  \n![Server Based Authentication](img/10-node-authentication----tokens-traditional.png)\n\
  \n基于服务器的身份验证\n\n随着 Web、应用程序以及移动应用程序的兴起，这种身份验证方法显示出了问题，特别是在扩展性方面。\n\n### 基于服务器的身份验证的问题\n\
  \n这种身份验证方法出现了几个主要问题。\n\n**会话 (Sessions)**：每当用户进行身份验证时，服务器都需要在服务器某处创建一个记录。这通常在内存中完成，当有很多用户进行身份验证时，服务器的开销就会增加。\n\
  \n**扩展性 (Scalability)**：由于会话存储在内存中，这带来了扩展性问题。当我们的云供应商开始复制服务器来处理应用程序负载时，在会话内存中保留关键信息将限制我们的扩展能力。\n\
  \n**CORS**：由于我们想要扩展应用程序让数据跨多个移动设备使用，我们必须担心跨源资源共享 (`CORS`）。当使用 `AJAX` 调用从另一个域获取资源（移动端到我们的\
  \ API 服务器）时，我们可能会遇到禁止请求的问题。\n\n**CSRF**：我们还需要防止跨站请求伪造 (`CSRF`)。用户很容易受到 `CSRF` 攻击，因为他们可能已经在银行网站等地方进行了身份验证，这在访问其他网站时可能会被利用。\n\
  \n有了这些问题（扩展性是主问题），尝试不同的方法是有意义的。\n\n## 基于令牌的身份验证如何工作\n\n基于令牌的身份验证是无状态的。我们不在服务器或会话中存储任何关于用户的信息。\n\
  \n这一概念本身就解决了许多必须在服务器上存储信息的问题。\n\n> 没有会话信息意味着你的应用程序可以根据需要扩展并添加更多机器，而无需担心用户在哪里登录。\n\
  \n虽然这种实现可能有所不同，但其核心如下：\n\n1. 用户使用用户名/密码请求访问\n2. 应用程序验证凭据\n3. 应用程序向客户端提供经过签名的令牌\n\
  4. 客户端存储该令牌并在每次请求时发送它\n5. 服务器验证令牌并响应数据\n\n**第一次请求后的每一个请求都需要令牌**。此令牌应该发送在 HTTP 请求头中，以符合无状态\
  \ HTTP 请求的理念。我们还需要设置服务器使用 `Access-Control-Allow-Origin: *` 来自所有域的请求。在 `ACAO` 头部中指定\
  \ `*` 有趣的地方在于，它不允许请求提供如 HTTP 身份验证、客户端 SSL 证书或 Cookie 等凭据。\n\n这里有一个解释该过程的信息图：\n\n\
  ![Token Based Authentication](img/10-node-authentication----tokens-new.png)\n\n\
  基于令牌的身份验证\n\n一旦我们使用信息完成身份验证并获得令牌，我们就可以使用此令牌执行几件事。\n\n我们甚至可以创建一个基于权限的令牌并将其传递给第三方应用程序（例如我们想要使用的新移动应用），它们将能够访问我们的数据——**但仅限于我们通过特定令牌允许的信息**。\n\
  \n### 令牌的优势\n\n#### 无状态且可扩展\n\n令牌存储在客户端。完全无状态，并准备好进行扩展。我们的负载均衡器可以将用户传递到我们的任何服务器上，因为任何地方都没有状态或会话信息。\n\
  \n如果我们为登录的用户保留会话信息，这将要求我们一直让该用户访问登录时的同一台服务器（这被称为会话亲和性）。\n\n这带来了问题，因为某些用户会被强制指向同一台服务器，这会导致流量压力。\n\
  \n不必担心！有了令牌这些问题消失了，因为令牌本身持有该用户的数据。\n\n#### 安全性\n\n每个请求发送的是令牌而不是 Cookie，由于没有发送 Cookie，这有助于防止\
  \ `CSRF` 攻击。即使你的特定实现在客户端的 Cookie 中存储令牌，Cookie 也仅仅是存储机制而不是身份验证机制。由于我们没有会话，因此没有可以操纵的会话信息！\n\
  \n令牌在一段时间后也会过期，因此你会被要求重新登录。这有助于我们保持安全。\n\n#### 可扩展性（好友的好友和权限）\n\n令牌允许我们构建与其他应用程序共享权限的应用程序。例如，我们将随机的社交账户链接到\
  \ Facebook 或 Twitter 等主账户。\n\n当我们通过某个服务（比如 Buffer）登录 Twitter 时，我们正在允许 Buffer 向我们的\
  \ Twitter 流中发布内容。\n\n通过使用令牌，这就是我们向第三方应用程序提供选择性权限的方法。我们甚至可以构建自己的 API，如果用户想要将数据访问权限授予另一个应用程序，我们可以发放特殊的权限令牌。\n\
  \n#### 多平台和多域\n\n我们之前稍微讨论过 `CORS`。当我们的应用程序和服务扩展时，我们需要为各种设备和应用程序提供访问（因为我们的应用程序肯定会变得受欢迎！）。\n\
  \n\n\n\n\n让我们的 API 仅提供数据，我们也可以选择从 CDN 密送资源。这消除了 CORS 带来的问题。`只要用户拥有有效的令牌`，我们的数据和资源就是可用的。\n\
  \n## 基于标准\n\n在创建令牌时，我们将使用基于标准的 [JSON Web Tokens](http://jwt.io/)。这个由 [Auth0](https://auth0.com/)\
  \ 创建的方便实用的调试器和库图展示了对 JSON Web Tokens 的支持。你可以看到它在各种语言中都得到了大量的支持。这意味着，如果你将来选择更改后端编程语言，实际上可以切换你的身份验证机制！\n\
  \n现在我们已经为基于令牌的认证建立了良好的基础，让我们通过检查实现方法来更进一步实现它。\n\n### JSON Web Tokens\n\nJSON Web\
  \ Tokens (JWT)，读音为“jot”，是一种标准，因为它们携带的信息是通过 JSON 传输的。我们可以在这里了解更多关于[草案](http://self-issued.info/docs/draft-ietf-oauth-json-web-token.html)的内容，但那个解释看起来并不美观。\n\
  \n`JSON Web Tokens 跨不同的编程语言`：JWT 适用于 .NET、Python、Node.js、Java、PHP、Ruby、Go、JavaScript\
  \ 和 Haskell。所以你可以看到这些可以用于许多不同的场景。\n\n`JWTs 是自包含的`：它们内部会携带所有必要的信息。这意味着 JWT 能够传输关于它自身的的基本信息、负载（通常是用户信息）和签名。\n\
  \n`JWTs 可以很容易地传递`：由于 JWT 是自包含的，它们在验证 API 时非常适合用在 HTTP 请求头中。你也可以通过通过 URL 传递它。\n\n\
  ### JWT 看起来是什么样的？\n\nJWT 很容易识别。它是由三个由 `.` 分隔的字符串。\n\n例如：\n\n```\n1 aaaaaaaaaa.bbbbbbbbbbb.cccccccccccc\n\
  ```\n\n让我们拆解这 3 部分并看看每个部分包含什么。\n\n### 析 JSON Web Token\n\n由于有 3 部分由 `.` 分隔，因此每个部分的创建方式都不同。我们拥有的\
  \ 3 个部分分别是：\n\n*   header（头部）\n*   payload（负载）\n*   signature（签名）\n\n![JSON Web\
  \ Token Overview](img/10-node-authentication----jwt-overview.png)\n\nJSON Web Token\
  \ 概述\n\n#### Header（头部）\n\n头部携带 2 个部分：\n\n*   声明类型，即 JWT\n*   要使用的哈希算法（在本例中为 HMAC\
  \ SHA256）\n\n这是一个示例：\n\n```\n1 {\n2   \"typ\": \"JWT\",\n3   \"alg\": \"HS256\"\n\
  4 }\n```\n\n现在一旦对其进行 `base64encode`，我们就得到了 JSON web token 的第一部分！\n\n```\n1 eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\n\
  ```\n\n#### Payload（负载）\n\n负载将携带我们 JWT 的大部分内容，称为 [JWT Claims](http://self-issued.info/docs/draft-ietf-oauth-json-web-token.html#RegisteredClaimName)。在这里，我们将放置想要传输的信息以及关于我们令牌的其他信息。\n\
  \n我们可以提供多个声明（claims）。这包括注册声明名称、公共声明名称和私有声明名称。\n\n##### Registered Claims（注册声明）\n\
  \n这些是不是强制性的但其名称已为我们保留的声明。这些包括：\n\n*   `iss`：令牌的发布者\n*   `sub`：令牌的主体\n*   `aud`：令牌的受众\n\
  *   `exp`：这可能是最常用的注册声明。它将以 NumericDate 值的值定义过期时间。过期时间必须在当前日期/时间之前。\n*   `nbf`：定义了在此时间之前\
  \ JWT 不得被接受处理\n*   `iat`：JWT 的发布时间。可以用于确定 JWT 的年龄\n*   `jti`：JWT 的唯一标识符。可以用于防止 JWT\
  \ 被重放。这对于一次性使用的令牌很有帮助。\n\n##### Public Claims（公共声明）\n\n这些是我们自己创建的声明，例如用户名、信息和其他重要信息。\n\
  \n##### Private Claims（私有声明）\n\n生产者和消费者可能同意使用私有的声明名称。这些可能会发生冲突，因此使用时要谨慎。\n\n#####\
  \ Example Payload（示例负载）\n\n我们的示例负载包含两个注册声明（`iss` 和 `exp`）和两个公共声明（`name` 和 `admin`）。\n\
  \n```\n1 {\n2   \"iss\": \"scotch.io\",\n3   \"exp\": 1300819380,\n4   \"name\"\
  : \"Chris Sevilleja\",\n5   \"admin\": true\n6 }\n```\n\n这将被编码为：\n\n```\n1 eyJpc3MiOiJzY290Y2guaW8iLCJleHAiOjEzMDA4MTkzODAsIm5hbWUiOiJDaHJpcyBTZXZpbGxlamEi\\\
  \n2 LCJhZG1pbiI6dHJ1ZX0\n```\n\n那就是我们 JSON Web Token 的第二部分。\n\n#### Signature（签名）\n\
  \nJSON Web Token 的第三也是最后一部分是签名。该签名由以下组件的哈希值组成：\n\n*   header\n*   payload\n*   secret\n\
  \n令牌在每次请求时发送，因此没有 CSRF 攻击。没有可以操纵的基于会话的信息，因为，我们没有会话！\n\n我们是这样获取 JWT 的第三部分的：\n\n```\n\
  1 var headerHeaderPayload = header + \".\" + payload;\n2 var signature = hmacSHA256(headerPayloadSignature,\
  \ secret);\n3 var jwt = headerPayloadSignature + \".\" + signature;\n```\n\n\n\n\
  \n```\n1 var superSecret = 'ilovescotchscotchyscotchscotch';\n```\n\n既然所需的包已经就绪，密钥也已准备好，让我们进入用户身份验证阶段。\n\
  \n## 创建示例用户\n\n首先，我们需要确保我们确实有用户可以进行验证，因为在上一章的末尾，我们删除了所有用户。让我们使用在 API 中创建的 `POST\
  \ http://localhost:8080/api/users` 路由来创建一个用户，并将其添加到数据库中。\n\n我们将发送一个带有以下信息的 `POST`\
  \ 请求：\n\n**姓名** Chris **用户名** chris **密码** supersecret\n\n![创建示例用户](img/10-node-authentication----create-user.jpg)\n\
  \n创建示例用户\n\n由于目前还没有身份验证机制，用户会被成功创建。现在我们已经有了用户，让我们为他创建一个身份验证机制，让他登录并获取令牌。\n\n## 身份验证用户并发放令牌\n\
  \n我们将在 API 路由内部创建一个名为 `POST http://localhost/api/authenticate` 的新路由。用户将在这里发送带有用户名和密码的\
  \ `POST` 请求。如果这两者都通过了，他们将收到一个令牌，以便访问我们 API 的信息。\n\n路由创建的顺序在这里很重要。我们不希望这个 `authenticate`\
  \ 路由受到我们身份验证中间件的保护，因此它将**被放置在第 9 章创建的中间件之前**。以下是它的位置展示：\n\n```\n 1 // 首页的基本路由\n\
  \ 2 app.get('/', ...\n 3 \n 4 // 获取 express 路由器的实例\n 5 var apiRouter = express.Router();\n\
  \ 6 \n 7 // 用户验证路由\n 8 apiRouter.post('/authenticate', ...\n 9 \n10 // 所有请求使用的中间件\n\
  11 apiRouter.use(function(req, res, next) ...\n12 \n13 // 其他 api 路由。加密的路由\n14 apiRouter.get('/',\
  \ ...\n```\n\n在 `apiRouter.post('/authenticate', ...` 路由内部，我们将创建 JSON Web Token\
  \ (JWT) 并将其返回给用户。\n\n让我们创建验证用户的路由。我们将：\n\n* 检查是否存在该用户名的用户\n* 检查用户密码是否正确（通过将其与数据库中保存的哈希密码进行比较）\n\
  * 如果一切无误，则创建一个令牌\n\n```\n 1 // 验证用户的路由 (POST http://localhost:8080/api/authenticate)\n\
  \ 2 apiRouter.post('/authenticate', function(req, res) {\n 3 \n 4   // 查找用户\n 5\
  \   // 显式选择姓名、用户名和密码\n 6   User.findOne({\n 7     username: req.body.username\n\
  \ 8   }).select('name username password').exec(function(err, user) {\n 9 \n10  \
  \   if (err) throw err;\n11 \n12     // 未找到该用户名的用户\n13     if (!user) {\n14    \
  \   res.json({ \n15         success: false, \n16         message: '身份验证失败。未找到用户.'\
  \ \n17       });\n18     } else if (user) {\n19 \n20       // 检查密码是否匹配\n21     \
  \  var validPassword = user.comparePassword(req.body.password);\n22       if (!validPassword)\
  \ {\n23         res.json({ \n24           success: false, \n25           message:\
  \ '身份验证失败。密码错误.' \n26         });\n27       } else {\n28 \n29         // 如果找到了用户且密码正确\n\
  30         // 创建令牌\n31         var token = jwt.sign({\n32           name: user.name,\n\
  33           username: user.username\n34         }, superSecret, {\n35         \
  \  expiresInMinutes: 1440 // 24 小时后过期\n36         });\n37 \n38         // 将包含令牌的信息作为\
  \ JSON 返回\n39         res.json({\n40           success: true,\n41           message:\
  \ '请使用你的令牌!',\n42           token: token\n43         });\n44       }   \n45 \n46\
  \     }\n47 \n48   });\n49 });\n```\n\n该路由完成了我们需要它执行的主要工作：**检查是否存在该用户名的用户**，使用我们在第\
  \ 9 章的 User 模型中创建的 `comparePassword` 方法**确保密码正确**，以及**创建一个令牌**。\n\n我们正在使用 `jwt`\
  \ (jsonwebtoken) 包来签名令牌。当我们传入有效负载（在本例中是我们的用户）时，该包会自动生成我们 JWT 的头部和签名。\n\n现在，当我们使用之前使用的凭据通过向\
  \ `http://localhost:8080/api/authenticate` 发送 `POST` 请求，结合创建用户的信息（chris/supersecret）来验证用户时，我们将获得令牌！\n\
  \n![身份验证用户并获取令牌](img/10-node-authentication----authenticate-user.jpg)\n\n身份验证用户并获取令牌\n\
  \n我们还可以用错误的用户名测试我们的身份验证路由：\n\n![验证错误的用户名](img/10-node-authentication----authenticate-wrong-user.jpg)\n\
  \n验证错误的用户名\n\n这里是错误密码的情况：\n\n![验证密码](img/10-node-authentication----wrong-password.jpg)\n\
  \n验证密码\n\n## 测试我们的路由中间件\n\n现在我们已经构建了负责保护后续路由的中间件，让我们测试一下刚刚创建的内容，以确保它工作正常。\n\n以下是在不传递任何身份验证信息的情况下尝试访问主\
  \ API 路由的操作：\n\n![未提供令牌](img/10-node-authentication----unauthenticated.jpg)\n\n\
  未提供令牌\n\n\n\n\n\n![Token Passed Through HTTP Header](img/10-node-authentication----token-header.jpg)\n\
  \n# 通过 HTTP Header 传递 Token\n\n我们也可以像下面这样将 token 作为 URL 参数传递：`http://localhost:8080/api/users?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJwYXNzd29yZCI6IiQyYSQxMCRyZ3JhdXB6c0RaGJJZNzdDUVNJbkh1WjkwUld2cS9OV3NpMGtPdWVlUGV0cVVCoyLmpLYSIsInVzZXJuYW1lIjoiY2hyaXMiLCJuYW1lIjoiQ2hyaXMiLCJfaWQiOiI1NDgxZTI2ZTkzYjliYmE3MTcxYmZkNWUiLCJfX3YiOjB9.fKBuDM0J1jpiAKfkPpr_b_NS6io8U4srLGuvEAfRhJg`\n\
  \n![Token Passed Through URL Parameter](img/10-node-authentication----token-url.jpg)\n\
  \n# 通过 URL 参数传递 Token\n\n## 获取用户信息的路由\n\n让我们快速为我们的 API 增加一个路由，以便我们能够返回用户信息。\n\n\
  我们将调用此端点（`GET http://localhost:8080/api/me`），这将允许我们获取有关登录用户的信息。\n\n在所有其他 `apiRouter`\
  \ 路由之后，让我们定义以下内容：\n\n```\n1 // 获取用户信息的 API 端点\n2 apiRouter.get('/me', function(req,\
  \ res) {\n3   res.send(req.decoded);\n4 });\n```\n\n记住在我们的中间件中，我们把登录用户存储在 `req.decoded`\
  \ 中以供其他路由使用。现在我们只需获取该信息并将其返回。我们将在未来的 Angular 章节中看到这有多有用，比如当我们想在消息中显示登录用户的用户名时（类似于\
  \ `Hello Chris` 这样的内容！）。\n\n## 帮助身份验证的模块\n\n现在我们已经从零开始构建了这一切，但重要的是，市上有许多 Node 模块可以帮助我们处理身份验证。通过自己构建安全机制来理解基础知识是好的，但使用由团队构建并确保安全性稳固的模块也会很有帮助。\n\
  \n对于在 Node 中处理身份验证，你找不到比 [PassportJS](http://passportjs.org/) 更好的包了。它允许我们在服务器上集成基于会话的安全性、基于社交的身份验证，以及我们在在本章中所做的\
  \ JWT 安全性。\n\n甚至有一个包专门用于处理检查 JWT 和保护路由的包，叫做 [express-jwt](https://github.com/auth0/express-jwt)。这个包为我们创建了中间件，这样我们就不需要自己写。它允许我们设置受保护和未受保护的路由。\n\
  \n## 总结\n\n现在我们有一个带有 token 身份验证的 API 了！就像 Facebook、Google、Twitter 和 GitHub 等大公司一样！其实并不完全像它们，因为它们实现了更多功能，如用户特定权限、组权限以及许多其他高级功能，但这是基础。\n\
  \n记住，安全是我们应用程序中非常重要的部分，保护用户信息应该是重中之重。请记住，这只是安全的开始，安全一直在不断演进，以防御新的和旧的攻击。\n\n这个 API\
  \ 将用于将数据传递给我们的前端 AngularJS 。通过这样做，我们再次遵循了这样一个理念：我们的后端和前端都是分离的，但又协作工作以创建出的体验。\n\n\
  ## 开始 Angular\n\n让我们后退一步。到目前为止，我们已经完成了构建一个出色的后端服务端服务的构建。我们学习了如何创建 RESTful API，如何使用\
  \ `MongoDB` 处理 CRUD 操作，并熟练掌握了 `Node`。\n\n现在我们必须处理硬币的另一面：前端。我们必须熟悉 Angular 应用程序、它们是如何设置的，以及我们将如何访问我们所构建的\
  \ Node API 和数据。\n\n### JavaScript 应用程序的状态\n\n如果你以前在没有框架的情况下构建过 JavaScript 应用程序（让我们以\
  \ jQuery 为例），很多时候你使用 `$('#divname').html()` 或 `$('#divname').append(variable)` 在你的应用程序中获取并放置数据。这会导致问题，因为没有一个真正的数据源。你忙于在各处到处地获取和放置数字和元素，有时你并不完全确定哪条数据是最新且最有效的。\n\
  \n在 MVC 中，真正的数据源来自模型（model），由控制器（controller）辅助传递视图（view）。这意味着获取数据有一套稳固的工作流。视图的构建只是为了显示数据并尽可能不包含逻辑。模型和控制器才是真正需要处理数据的地方。\n\
  \nAngular 通过将前端应用程序处理得更像我们熟悉的后端应用程序来帮助解决这些问题。我们喜欢数据来自一个一致的地方并被注入到视图中。这让我们保持理智，因为我们应用程序的每个部分都有一个真实的（唯一的）数据源。\n\
  \n### 介绍\n\nAngular 自称为“如果 HTML 设计之是为了构建 Web 应用，那么它本该是什么样”。它允许你作为开发者为应用程序的前端构建 MVC（模型-视图-控制器）架构。由于客户端应用程序正变得不仅仅显示静态\
  \ HTML 页面，需要构建新的工具来适应日益增长的 JavaScript 应用程序。\n\nAngular 允许你扩展 HTML，因此你是在已经熟悉的标准进行构建，而不是从零学习整个框架。\n\
  \n### 重要的 Angular 概念\n\nAngular 中一些将贯穿我们构建的所有内容的优秀概念是数据绑定、依赖注入和指令。\n\n#### 数据绑定\n\
  \n[数据绑定](https://docs.angularjs.org/guide/databinding) 允许我们有一个集中的数据源。我们将经常讨论单一数据源。忘记使用\
  \ jQuery 的 `append`、`val`、`html` 或其他任何方法将数据注入你的视图中。我们将使用 Angular 奇的数据绑定来为我们处理所有这些。\n\
  \n让我们想象这样一个场景：你在控制器中创建了一个变量。然后你在视图中显示该变量。如果你在控制器中更改了变量，它会在视图中自动更改，而不需要你在那里注入（Angular\
  \ 通过绑定两个地方的变量为你完成注入）。\n\nAngular 文档对此功能提供了很好的解释：“编译步骤产生了一个活动视图。视图的任何更改都会反映在模型中，模型中的任何更改都会传播到视图。模型是应用程序状态的单一事实来源，大大简化了开发者的编程模型。”\n\
  \n#### 依赖注入\n\nAngular 应用程序是许多不同模块的集合，例如处理数据传递到视图的控制器、与 API 交互的服务（视为模型）、帮助我们进一步操作视图的指令，等等。在我们构建应用程序时，我们将采用模块化方法，因为这让我们能够构建可测试、模块化且可扩展的应用程序。\n\
  \n我们构建的每个模块将被注入到我们的主应用程序模块中以创建最终产品。我们的主应用程序将继承我们注入的模块的依赖项。\n\n#### 指令\n\n\n\n\n\n\
  [指令（Directives）](https://docs.angularjs.org/guide/directive) 是 Angular 内置的，你会频繁使用它们。它们是我们扩展\
  \ HTML 模板的方式，告诉 Angular 在何以及何时对我们的视图应用功能。指令会让 Angular 知道某些 HTML 元素应该绑定到我们定义的 Angular\
  \ 变量或函数。它们还可以帮助 Angular 操作我们的 DOM。\n\n> jQuery 告诉我们如何抓取并注入 DOM。Angular 告诉我们如何操作数据，从而改变\
  \ DOM。\n\n让我们开始构建应用程序，并在在此过程中讨论更多概念。\n\n## 设置 Angular 应用\n\n这个演示目前还没有从我们的 Node API\
  \ 获取任何动态数据。我们将数据直接硬编码在 Angular 控制器（controllers）中。这将让我们先熟悉 Angular 的特定功能。\n\n这是我们\
  \ Angular 应用的文件结构。请注意，我们不需要像 Node 应用那样的 `package.json` 或 `server.js` 文件。这是一个纯的前端应用程序，只包含\
  \ HTML/CSS/JS！\n\n* `js/`\n    * `app.js`\n* `index.html`\n\n非常简单！2 个文件就能为我们的第一个\
  \ Angular 应用提供所需的一切。\n\n我们希望通过这个应用程序实现的目标是：\n\n1. 设置一个 Angular 前端应用\n2. 将来自 Angular\
  \ 控制器的数据（消息和列表）显示在视图中\n3. 通过输入框更新消息来展示数据绑定\n\n### 创建你的 Angular 应用 (app.js)\n\n我们将从创建应用程序的主模块（module）开始。进入\
  \ `app.js` 文件，看看 Angular 模块是如何创建的：\n\n```\n 1 // 命名我们的 angular 应用\n 2 angular.module('firstApp',\
  \ [])\n 3 \n 4 .controller('mainController', function() {\n 5 \n 6     // 将此绑定到\
  \ vm (视图模型)\n 7     var vm = this;\n 8 \n 9     // 在这里定义变量和对象\n10     // 这允许它们在视图可用\n\
  11 \n12     // 定义一个基础变量\n13     vm.message = 'Hey there! Come and see how good I\
  \ look!';\n14 \n15     // 定义一个项目列表\n16     vm.computers = [\n17         { name:\
  \ 'Macbook Pro', color: 'Silver', nerdness: 7 },\n18         { name: 'Yoga 2 Pro',\
  \ color: 'Gray', nerdness: 6 },\n19         { name: 'Chromebook', color: 'Black',\
  \ nerdness: 5 }\n20     ];\n21 \n22 }); \n```\n\n你可以看到，Angular 模块只需要声明 `angular.module`。然后我们可以向此模块添加一个控制器。在构建这些应用程序时，我们将尝试每个应用只保留一个功能。这意味着我们不会将控制器和服务混合在同一个模块中。这回到了模块化应用程序的思想。\n\
  \n到目前为止，我们已经：\n\n* 创建了名为 `firstApp` 的主模块\n* 创建了名为 `mainController` 的控制器\n* 控制器中的信息将通过\
  \ `vm` 绑定到自身\n* 创建了一个名为 `message` 的变量\n* 创建了一个名为 `computers` 的项目列表\n\n注意我们如何在 `vm`\
  \ 上定义变量和列表的。将父级 `this` 绑定到 `vm` 是一个好习惯。这在引用控制器时很有帮助，因为 `this` 可以在 JavaScript 回调中使用。控制器上有有属性，这就是我们能够通过\
  \ `controller as` 语法在视图中使用它们。我们很快就会看到它是如何工作的。就是这样！你刚刚创建了你的 Angular 应用！现在它还没做什么，让我们通过创建\
  \ HTML 文件并对其应用此模块来让它变漂亮。\n\n字体 应用 Angular 应用 (index.html)\n\n让我们开始构建基础 HTML 站点。我们将通过\
  \ CDN 引入 Bootstrap 和 Angular 以保持简单。这里是 `index.html` 的开头：\n\n```\n 1 <!DOCTYPE html>\n\
  \ 2 <html lang=\"en\">\n 3 <head>\n 4     <meta charset=\"UTF-8\">\n 5     <title>My\
  \ First Application</title>\n 6 \n 7     <!-- CSS -->\n 8     <!-- 加载 bootstrap\
  \ 和我们的样式表 -->\n 9     <link rel=\"stylesheet\" href=\"http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.css\"\
  >\n11     <style>\n12         body { padding-top:50px; }\n13     </style>\n14 \n\
  15     <!-- JS -->\n16     <!-- 加载 angular 和我们的自定义应用 -->\n17     <script src=\"\
  http://ajax.googleapis.com/ajax/libs/angularjs/1.3.8/angular.min.js\"></script>\n\
  19     <script src=\"js/app.js\"></script>\n20 </head>\n21 <body class=\"container\"\
  >\n22 \n23 </body>\n24 </html\n```\n\n`index.html` 文件现在是空壳。我们加载了 Bootstrap，添加了一点用于间距的\
  \ CSS，并加载了 Angular 本身以及自定义的 `app.js`。如果我们现在在浏览器中查看，什么都不会发生，因为我们还没有应用创建的 Angular\
  \ 应用。我们讨论过 Angular 指令，这将是你第一次使用它们。Angular 提供指令将你的应用应用到 HTML 中。这些被称为 `ng-app` 和 `ng-controller`。让我们在\
  \ `<body>` 标签上添加：\n\n```\n 1 <!-- 声明我们的应用 -->\n 2 <body class=\"container\" ng-app=\"\
  firstApp\" ng-controller=\"mainController as main\">\n```\n\n现在我们应用了控制器并将其命名为 `main`。我们讨论过\
  \ Angular 指令，这些可以将你的应用应用到 HTML 中。让我们在 `<body>` 标签内添加内容：\n\n```html\n 1 <div class=\"\
  jumbotron\">\n 2 \n 3 <!-- 显示消息 -->\n 4   <h2>This is my message:</h2>\n 5   {{\
  \ main.message }}\n 6 \n7 </div>\n```\n\n现在我们在浏览器中看到了消息！注意我们是如何在控制器中定义这个变量的。\n\n\
  ![消息变量](img/11-angular-start-variable.jpg)\n\n### 消息变量\n\n你刚刚在视图中显示了第一个变量！现在让我们处理列表。这将使用另一个名为\
  \ `ng-repeat` 的 Angular 指令。你将在视图中频繁使用它因为它类似于 `foreach`。\n\n在消息部分下方添加：\n\n```\n 1\
  \ <!-- 使用 ng-repeat 显示列表 -->\n 2 <h2>This is my list:</h2>\n 3 <table class=\"table-bordered\"\
  >\n 4     <thead>\n 5         <tr>\n 6             <td>名称</td>\n 7             <td>颜色</td>\n\
  \ 8             <td>极客程度</td>\n 9         </tr>\n 10     </thead>\n 11     <tbody>\n\
  \ 12         <tr ng-repeat=\"computer in main.computers\">\n 13             <td>{{\
  \ computer.name }}</td>\n 14             <td>{{ computer.color }}</td>\n 15    \
  \         <td>{{ computer.nerdness }}</td>\n 16         </tr>\n 17     </tbody>\n\
  \ 18 </table>\n```\n\n很酷对吧？Angular 将知道要遍历 computers 并在每一项显示在它自己的表格行中。\n\n![显示列表](img/11-angular-start-list.png)\n\
  \n### 显示列表\n\n我们还要为这个演示做最后一件事。这是让我们看到数据绑定生效的魔法部分。\n\n我们将在站点上放置一个输入字段，并使用另一个（发现趋势了吗？）被称为\
  \ `ng-model` 的 Angular 指令将输入绑定到变量上。这将立即更改消息。你将亲眼看到变化的发生！让我们在消息部分上方添加输入框：\n\n```\n\
  \ 1 <!-- 使用 ng-model 更新消息变量的表单 -->\n 2 <div class=\"form-group\">\n 3     <label>Message</label>\n\
  \ 4     <input type=\"text\" class=\"form-control\" ng-model=\"main.message\">\n\
  \ 5 </div>\n```\n\n\n\n\n现在在浏览器中查看该站点并开始在输入框中输入。得益于 Angular 及其 `directives`（指令）的魔法，`message`\
  \ 变量会立即发生。\n\n![数据绑定](img/11-angular-start----angular-data-binding-example.jpg)\n\
  \n数据绑定\n\n这里有一个 [CodePen](http://codepen.io/sevilayha/full/DhLqk/)，让你可以快速看到这些操作演示。完整代码也可以在本书的代码仓库中找到。\n\
  \n***\n\n![Tip](img/icon-heart.png \"专业提示\")\n\n提示\n\n### $scope vs. this\n\n在网络上的其他\
  \ Angular 教程中，你可能见过 `$scope` 是一种将信息从控制器（controller）绑定到视图的方法。从 Angular 1.3 开始，这种方法仍然存在，但建议使用\
  \ `controller as` 语法。\n\n这种方法有很多益处，因为它能保持我们的代码更加整洁、更有组织。在视图中，我们甚至可以更容易地看到控制器是如何被使用的。\n\
  \n以下是 `使用 $scope` 和 `不使用 $scope` 的两个快速对比。\n\n```\n1 <!-- 使用 $scope -->\n2 <div ng-app=\"\
  myApp\" ng-controller=\"mainController\">\n3     <p>{{ myVariable }}</p>\n4 </div>\n\
  5 \n6 <!-- 不使用 $scope - 使用 controller as -->\n7 <div ng-app=\"myApp\" ng-controller=\"\
  mainController as main\">\n8     <p>{{ main.myVariable }}</p>\n9 </div>\n```\n\n\
  这有很多益处，特别是当我们开始嵌套控制器时。更容易看出哪些变量和函数存在于每个控制器中。\n\n这样做的好处是它将强迫你为新的 Angular 2.0 语法做准备，该版本预计在大一年后发布。Angular\
  \ 团队已经宣布`$scope` 将被淘汰，转而采用更接近 `controller as` 的语法。\n\n不过，不用担心 Angular 2.0。如果你现在使用这种语法构建\
  \ Angular 应用程序，迁移到新版本将不会痛苦。\n\n***\n\n### 创建和处理表单\n\n现在让我们进入更高级的内容。我们通常希望在网站上有一个表单，而\
  \ Angular 让处理表单变得极其简单。让我们创建一个可以将计算机添加到我们的计算机列表中的表单。\n\n这将在两个不同的部分完成：\n\n1. 创建一个\
  \ Angular 函数来处理表单并将其添加到我们的列表\n2. 添加 HTML 表单并将其连接起来与 Angular 函数协同工作\n\n#### 处理表单的\
  \ Angular 函数\n\n让我们将这个 Angular 函数添加到我们的控制器中。\n\n```\n 1 // 命名我们的 angular 应用\n 2\
  \ angular.module('firstApp', [])\n 3 \n4 .controller('mainController', function()\
  \ {\n 5 \n6     ...\n 7 \n8     // 来自我们表单的信息\n 9     vm.computerData = {};\n10 \n\
  11     vm.addComputer = function() {\n12         \n13         // 将计算机添加到列表\n14 \
  \        vm.computers.push({\n15             name: vm.computerData.name,\n16   \
  \          color: vm.computerData.color,\n17             nerdness: vm.computerData.nerdness\n\
  18         });\n19 \n20         // 在添加计算机后，清空表单\n21         vm.computerData = {};\n\
  22     };\n23 \n24 }); \n```\n\n我们将创建一个对象来存放表单数据，称为 `vm.computerData`。这一步并不是必要的，因为\
  \ Angular 会在需要时自动创建它，但为了清晰，我们会定义它。\n\n我们还创建一个函数，从 `vm.computerData` 中提取信息并将其推入我们的计算机数组。当添加时，它应该会自动将计算机添加到表格中，而无需刷新页面（几乎像魔法）。\n\
  \n计算机添加到列表后，我们将通过清空包含数据的对象来清空表单。在 jQuery 应用程序中，清空表单可以通过以下实现：\n\n`$('input').val('');`\n\
  \n在 Angular 中不行！我们现在熟悉 `data-binding`（数据绑定）了，由于我们在 Angular 侧清空了对象，这会自动清空视图侧的表单。\n\
  \n如此，让我们创建 HTML 表单并将其连接到我们刚刚创建的函数。\n\n#### HTML 表单\n\n在我们的 `index.html` 文件中，计算机\
  \ HTML 表格下方，添加以下表单：\n\n```\n 1 <!-- 向列表添加计算机的表单 -->\n 2 <form class=\"form-inline\"\
  \ ng-submit=\"main.addComputer()\">\n 3     \n 4     <input type=\"text\" class=\"\
  form-control\" placeholder=\"Macbook\" ng-model=\"main\\\n 5 .computerData.name\"\
  >\n 6     <input type=\"text\" class=\"form-control\" placeholder=\"Silver\" ng-model=\"\
  main.\\\n 7 computerData.color\">\n 8     <input type=\"number\" class=\"form-control\"\
  \ placeholder=\"8\" ng-model=\"main.com\\\n 9 puterData.nerdness\">\n10 \n11   \
  \  <button type=\"submit\" class=\"btn btn-success\">Add</button>\n12 </form>\n\
  ```\n\n我们这里有 3 个不同的输入和一个提交按钮。我们使用了 `ng-model` 将每个输入绑定到我们在 Angular 控制器中创建的 `computerData`\
  \ 对象的特定字段。\n\n在这里看到的新 Angular 指令是 `ng-submit`。它用于表单，并告诉 Angular 在提交表单时做什么。这里是我们的表单：\n\
  \n![表单](img/11-angular-start----angular-data-binding-example.jpg)\n\n去填写一些数据并点击\
  \ Add。观察你的表格如何自动更新，计算机被添加。\n\n## 总结\n\n本章一次性向你介绍了许多 Angular 概念。它们都是帮助你构建应用程序的工具。数据绑定、依赖注入和指令是\
  \ Angular 的基础，你将在每个应用程序中使用它们。\n\n接下来，我们将探索应用程序的路由，以便拥有功能完整的站点。\n\n# Angular 路由\n\
  \n我们将通过一个全新的应用演示 Angular 路由。在开始该新应用之前，让我们先讨论不同的路由技术。\n\n### ngRoute\n\n[ngRoute](https://docs.angularjs.org/api/ngRoute)\
  \ 是构建 Angular 应用程序时路由的标准模块。它是 Angular 支持的，并通过名为 `$route` 的服务提供路由（我们稍后会展示它是如何工作的）。\n\
  \n### 路由应用程序的 Node 服务器\n\n为了让我们使用 ngRoute，我们希望使用服务器，以便模拟该应用程序在浏览器中的工作方式。我们将启动一个服务器，因为正如你所看到的，我们不能直接打开文件。我们的\
  \ Angular 应用程序需要请求视图文件，如果没有服务器，我们将遇到问题。\n\n\n\n\n```\n1 - public/    // 我们的所有前端代码\
  \ (HTML/CSS/JS) 都放在这里\n2 ----- views/\n3 ---------- pages/\n4 ----- index.html\n\
  5 ----- js/\n6 - package.json\n7 - server.js\n```\n\n这些就是我们启动服务器和 Angular 前端应用程序所需的文件。目前，我们将只关注\
  \ `package.json` 和 `server.js` 来创建一个服务器。\n\n## 启动 Node 项目\n\n就像我们之前做的那样，`package.json`\
  \ 将包含包和项目信息。请运行 `npm init` 或直接手动创建该文件。这里有一个基础的 `package.json` 文件。\n\n```\n1 {\n\
  2   \"name\": \"routing-app\",\n3   \"main\": \"server.js\",\n4   \"dependencies\"\
  : {\n5     \"express\": \"~4.9.1\"\n6   }\n7 }\n```\n\n一旦你有了该 `package.json` 文件，运行\
  \ `npm install` 将你的依赖项（在此例中为 Express）获取到 `node_modules` 文件夹中。记住，你也可以通过命令行使用 `npm\
  \ install express --save` 来添加依赖项。\n\n## 设置 Express 服务器\n\n正如我们之前所做的，我们的服务器将在 `server.js`\
  \ 中设置。让我们创建一个非常简单的服务器，向用户发送 `index.html`。\n\n```\n 1 // 获取我们需要的资源\n 2 var express\
  \ = require('express');\n 3 var app     = express();\n 4 var path = require('path');\n\
  \ 5 \n6 // 设置 public 文件夹以提供公共资源\n 7 app.use(express.static(__dirname + '/public'));\n\
  \ 8 \n9 // 设置到 index.html 文件的路由\n10 app.get('*', function(req, res) {\n11     res.sendFile(path.join(__dirname\
  \ + '/public/views/index.html'));\n12 });\n13 \n14 // 在端口 8080 启动服务器 (http://localhost:8080)\n\
  15 app.listen(8080);\n16 console.log('Magic happens on port 8080.');\n```\n\n当请求进入我们的服务器时（我们通过使用\
  \ `*` 通配符方法来实现），我们将向用户发送 `index.html` 文件，该文件包含了我们所有的 Angular/HTML/CSS 代码。我们还使用 Express\
  \ 通过 `app.use(express.static())` 为静态资源设置目录。这意味着每当我们的客户端请求 CSS 文件、图像或 JS 文件时，Node\
  \ 都会通过查看 `public` 文件夹来提供该资源。我们所有的前端代码都存储在这个 `public` 文件夹中，因此这对我们的项目是一个很好的设置。\n\n\
  创建一个快速的 `public/views/index.html` 文件并在其中编写任何你想写的内容。使用以下命令启动服务器：\n\n`nodemon server.js`\n\
  \n现在我们可以在浏览器中访问 `http://localhost:8080` 我们的应用程序。\n\n这就是 Node 的酷之处。即使你没有在最终项目中使用它，你也可以将其作为你想要构建的任何项目的服务器。在我们开发\
  \ Angular 应用程序时，我们只需要在这个 URL 中工作即可。\n\n现在我们已经准备好了构建 Angular 路由应用程序的基础，让我们开始着吧。\n\
  \n## 示例应用程序\n\n我们将仅仅创建一个包含首页、关于页和联系页的简单网站。Angular 是为了比这高级得多的应用程序而构建的，但本教程将展示那些更大型项目所需的许多概念。\n\
  \n### 目标\n\n* 单页应用\n* 页面切换时不刷新页面\n* 每个页面显示不同的数据\n\n### 文件结构\n\n这些将存于我们在上一步中设置的 `public`\
  \ 文件夹中的文件。\n\n```\n 1 public/\n 2 - views/\n 3 ----- pages/        // 将注入到主布局的页面\n\
  \ 4 ---------- home.html\n 5 ---------- about.html\n 6 ---------- contact.html\n\
  \ 7 ----- index.html        // 主布局\n 8 - js/\n 9 ----- app.js        // 存储所有的 Angular\
  \ 代码\n10 ----- app.routes.js // 存储所有的 Angular 路由\n```\n\n## 应用的 HTML\n\n这是简单的部分。我们使用\
  \ [Bootstrap](http://getbootstrap.com) 和 [Font Awesome](http://fontawesome.io) 来让样式变得更简单。打开你的\
  \ `index.html` 文件，我们将添加一个带有导航栏的简单布局。\n\n```\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n\
  \ 4     <meta charset=\"utf-8\">\n 5     <title>我的路由应用!</title>\n 6 \n 7     <!--\
  \ 为 angular 路由设置基础路径 -->\n 8     <base href=\"/\">\n 9 \n10     <!-- CSS -->\n11\
  \     <!-- 通过 CDN 加载 bootstrap 和 fontawesome -->\n12     <link rel=\"stylesheet\"\
  \ href=\"http://netdna.bootstrapcdn.com/bootstrap/3.0.0/\\\n13 css/bootstrap.min.css\"\
  >\n14     <link rel=\"stylesheet\" href=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
  \n15 .0/css/font-awesome.css\">\n16     <style>\n 17         body { padding-top:50px;\
  \ }\n 18     </style>\n 19 \n20     <!-- JS -->\n21     <!-- 通过 CDN 加载 angular 和\
  \ fontawesome -->\n22     <script src=\"http://netdna.bootstrapcdn.com/angularjs/1.4.6/\\\
  \n23 angular.min.js\"></script>\n24     <script src=\"http://netdna.bootstrapcdn.com/font-awesome/4.0\\\
  \n25 .0/js/font-awesome.min.js\"></script>\n 26 \n27     <!-- 加载自定义脚本 -->\n28  \
  \   <script src=\"js/app.js\"></script>\n29     <script src=\"js/app.routes.js\"\
  ></script>\n30 </head>\n31 <body class=\"container\" ng-app=\"routerApp\">\n32 \n\
  33   <!-- 头部和导航栏 -->\n34   <nav class=\"navbar navbar-default\">\n35       <div\
  \ class=\"container-fluid\">\n36         <a class=\"navbar-brand\" href=\"#\">Angular\
  \ 路由</a>\n37       </div>\n 38 \n39       <ul class=\"nav navbar-right\">\n40  \
  \       <li><a href=\"/\"><i class=\"fa fa-home\"></i> 首页</a></li>->\n41       \
  \  <li><a href=\"/about\"><i class=\"fa fa-shield\"></i> 关于</a></li>->\n42     \
  \    <li><a href=\"/contact\"><i class=\"fa fa-comment\"></i> 联系</a></li>->\n43\
  \       </ul>\n\n44     </nav>\n45   </header>\n46 \n47   <!-- 主内容和注入的视图 -->\n48\
  \   <main>\n49 \n50     <!-- 内容在此处 -->\n51   </main>\n52 </body>\n53 </html>\n```\n\
  *(注：由于原文 HTML 示例中存在微小的标签闭合错误，如重复的 `</li>`，翻译时保持了其逻辑结构以确保一致性。)*\n\n我们从 Google 加载\
  \ Angular 和 Route。单独加载模块很重要，因为我们将将其注入到应用程序。这是依赖注入的另一个示例。\n\n![Angular Foundation](img/12-angular-routing)\n\
  \n## Angular 应用程序\n\n### 模块和控制器\n\n接下来，我们必须创建应用程序。关于每个部分的更多信息请查阅文档。我们将在 `app.js`\
  \ 中创建它：\n\n```\n1 angular.module('routerApp', [])\n2 \n3 // 创建控制器\n4 // 将是整个网站的控制器\n\
  5 .controller('mainController', function() {\n6 \n7   var vm = this;\n8 \n9   //\
  \ 在视图中显示 bigMessage 变量\n10   vm.bigMessage = '风平浪静造就不了熟练的水手。';\n11 })\n12 \n13 //\
  \ 首页特定控制器\n14 .controller('homeController', function() {\n15 \n16   var vm = this;\n\
  17 \n18   vm.message = '这是首页！';\n19 })\n20 \n21 // 关于页控制器\n22 .controller('aboutController',\
  \ function() {\n23 \n24   var vm = this;\n25 \n26   vm.message = '看！我是关于页。';\n27\
  \ })\n28 \n29 // 联系页控制器\n30 .controller('contactController', function() {\n31 \n\
  32   var vm = this;\n33 \n34   vm.message = '联系我们！开玩笑的。这只是一个演示。';\n35 });\n```\n\
  \n让我们将模块和控制器添加到 HTML 中，这样 Angular 就知道如何引导/初始化我们的应用程序。为了测试一切是否正常工作，我们还将显示我们创建的 `vm.bigMessage`\
  \ 变量。\n\n#### 应用 Angular\n\n\n\n\n让我们回到 `index.html`，并使用 `ng-app` 和 `ng-controller`\
  \ 应用我们的应用和控制器。由于我们已经在文档的 `<head>` 中加载了 `app.js` 文件，我们将它们都应用到 `<body>` 标签上。\n\n```\n\
  1 <body class=\"container\" ng-app=\"routerApp\" ng-controller=\"mainController\
  \ as main\\\n2 \">\n```\n\n再次注意，当我们编写 `mainController as main` 时，我们使用的是 `controller\
  \ as` 语法。我们还将在网站的 `<main>` 区域展示我们的 `bigMessage`：\n\n```\n1 <main>\n2     <div class=\"\
  jumbotron\">\n3         <h1>{{ main.bigMessage }}</h1>\n4     </div>\n5 \n6    \
  \ <!-- angular templating will go here -->\n7     <!-- this is where content will\
  \ be injected -->\n8 </main>\n```\n\n现在，如果在浏览器中显示 `index.html` 文件，我们应该看到我们的消息。\n\
  \n![Angular 路由消息显示](img/12-angular-routing----angular-routing-message.jpg)\n\nAngular\
  \ 路由消息显示\n\n在我们的 `<main>` 内部，现在我们将看到我们创建的消息。由于我们已经设置好了模块和控制器，并且 JavaScript 控制台中没有错误，我们知道\
  \ Angular 正在正常工作。现在，我们将开始尝试使用此布局来显示不同的页面，而无需刷新页面。\n\n### 将页面注入到主布局中\n\n`ng-view`\
  \ 是一个 Angular 指令，它将当前路由（`/home`、`/about` 或 `/contact`）的模板包含在主布局文件中。\n\n**它是如何工作的？**\
  \ Angular 路由（`ngRoute`）会查看当前 URL，然后将该 URL 与我们指定的视图进行匹配。因此，如果我们处于 `/about` 页面，我们将告诉\
  \ `ngRoute` 获取一个特定的视图文件（在本例中为 `pages/about.html`）并将其注入到我们放置 `ng-view` 的地方。\n\n我们还没有设置所需的路由规则，所以现在就向模板中添加\
  \ `ng-view`，然后继续进行路由部分。\n\n在我们网站的 `<main>` 区域内，删除消息部分并添加以下内容：\n\n```\n1 <main>\n\
  2 \n3     <!-- angular templating -->\n4     <!-- this is where content will be\
  \ injected -->\n5 \n6     <div ng-view></div>\n7 \n8 </main>\n```\n\n### 配置路由\n\n\
  现在这对我们的网站还没有什么太大的作用。我们必须定义路由以及每个路由将使用的视图。这就是我们如何使用 Angular 的路由功能，以便我们的页面不发生刷新。\n\
  \nAngular 路由模块为我们提供了 `$routeProvider`(http://docs.angularjs.org/api/ngRoute.$routeProvider)\
  \ 服务，我们将通过它来配置路由。路由在 `$routeProvider` 对象上使用 `.when()` 定义。\n\n现在让我们通过创建一个新文件 `public/js/app.routes.js`\
  \ 来创建我们的路由。我们还将之前之前创建的每个控制器应用到每个页面。\n\n```\n 1 // 为我们所有的路由需求注入 ngRoute\n 2 angular.module('routerRoutes',\
  \ ['ngRoute'])\n 3 \n 4 // 配置我们的路由\n 5 .config(function($routeProvider, $locationProvider)\
  \ {\n 6     $routeProvider\n 7 \n 8         // 首页的路由\n 9         .when('/', {\n\
  110             templateUrl : 'views/pages/home.html',\n 11             controller\
  \  : 'homeController',\n 12             controllerAs: 'home'\n 13         })\n 14\
  \ \n 15         // 关于页面的路由\n 16         .when('/about', {\n 17             templateUrl\
  \ : 'views/pages/about.html',\n 18             controller  : 'aboutController',\n\
  \ 19             controllerAs: 'about'\n 20         })\n 21 \n 22         // 联系页面的路由\n\
  \ 23         .when('/contact', {\n 24             templateUrl : 'views/pages/contact.html',\n\
  \ 25             controller  : 'contactController',\n 26             controllerAs:\
  \ 'contact'\n 27         );\n 28 \n 29     // 设置我们的应用以使用优美的 URL\n 30     $locationProvider.html5Mode(true);\n\
  \ 31 });\n```\n\n现在我们已经使用 `$routeProvider` 定义了路由。正如配置所示，你可以指定 `route`、使用的 `template\
  \ file` 甚至一个 `controller`。这样，应用程序的每个部分都将使用它们自己的视图和 Angular 控制器。\n\n我们还可以在这里定义 `controllerAs`，然后每个控制器将自动定义在我们的站点上。例如，在\
  \ `home.html` 文件内部，当路由器引入此文件时，控制器将定义为 `homeController as home`。\n\n***\n\n![提示：清理\
  \ Angular URL](img/icon-heart.png \"专业贴士\")\n\n提示：清理 Angular URL\n\n默认情况下，AngularJS\
  \ 会路由带井号 (# 的 URL。例如，Angular 将会有 `http://example.com/`、`http://example.com/#/about`\
  \ 和 `http://example.com/#/contact`。\n\n获取清洁的 URL 并从 URL 中删除井号非常简单。\n\n需要完成 2 件事：\n\
  \n1. 配置 `$locationProvider`\n2. 在 `<head>` 中设置 `<base>`\n\n在 Angular 中，我们将使用 `$locationProvider.html5Mode(true)`\
  \ 并在 HTML 中添加 `<base href=\"/\">`。\n\n#### 将路由注入主应用\n\nAngular 开发的核心原则之一是依赖注入。我们将新创建的路由模块注入到\
  \ `index.html` 中。\n\n我们将像这样在第一行添加：\n\n`angular.module('routerApp', ['routerRoutes'])`\n\
  \n就像这样，我们现在有了路由！\n\n### 配置视图\n\n现在我们已经有了路由，并且它们正在调用相应的文件。为了完成本教程，我们只需要定义将注入的页面。我们还将让每个页面显示其相应控制器的消息。这是一个简单的过程，只需在每个视图中显示\
  \ `{{ home.message }}`、`{{ about.message }}` 和 `{{ contact.message }}` 变量。\n\n`pages/home.html`\n\
  \n```\n1 <div class=\"jumbotron text-center\">\n2     <h1>Home Page</h1>\n3 \n4\
  \     <p>{{ home.message }}</p>\n5 </div>\n```\n\n`pages/about.html`\n\n```\n1 <div\
  \ class=\"jumbotron text-center\">\n2     <h1>About Page</h1>\n3 \n4     <p>{{ about.message\
  \ }}</p>\n5 </div>\n```\n\n`pages/contact.html`\n\n```\n1 <div class=\"jumbotron\
  \ text-center\">\n2     <h1>Contact Page</h1>\n3 \n4     <p>{{ contact.message }}</p>\n\
  5 </div>\n```\n\n我们在路由中通过 `controllerAs` 为每个 HTML 文件的变量都加上了控制器名称。\n\n访问您的应用程序并点击页面。你会看到数据发生了变化，你的消息变量也发生了变化，而完全无需刷新页面！**\n\
  \n![Angular 路由首页](img/12-angular-routing----angular-routing-final.jpg)\n\nAngular\
  \ 路由首页\n\n## 总结\n\n我们搞定了！一个具有 3 个不同页面的单页应用。每个页面还将引入不同的 Angular 控制器，以便数据在我们的站点上可以有所不同。\n\
  \n你可以看到它的价值，因为它让我们的基础网站变成了更像集成应用程序的感觉。\n\n\n\n虽然这个网站无需刷新页面即可路由已经很酷了，但我们将通过为页面添加动画让它变得更酷。你可能已经见过点击项目时会滑入和滑出视图的移动应用。我们将刚刚构建的内容变成一个整洁且令人深刻的动画网站（别担心，它不会太花哨的……除非你希望那样）。\n\
  \n***\n\n![注意：ngRoute 的替代方案](img/icon-pencil.png \"注意\")\n\n#### 注意：ngRoute 的替代方案\n\
  \n虽然 `ngRoute` 是为了与 Angular 配合得最紧密而构建的路由工具，但另一个名为 `UI Router` 的工具是由 AngularUI 团队构建的另一个路由框架。[AngularUI](http://angular-ui.github.io/)\
  \ 是与 Angular 应用紧密配合的配套套件。它们提供了许多实用的工具，如 `UI Router`、用于在 Angular 中使用 Bootstrap JavaScript\
  \ 组件的 `UI Bootstrap` 以及其他一些非常棒的工具。\n\n`UI Router` 提供了与 `ngRoute` 不同的方法，它根据应用程序的状态而非仅仅是路由\
  \ URL 来更改你的应用程序视图。这意味着你的应用程序没有绑定到 URL 路径，你可以根据应用程序状态（例如，用户是否登录）来调整显示的模板。\n\n拥有嵌套状态的能力也有许多益处。`ngRoute`\
  \ 不提供此功能，而对于更高级的 UI，拥有嵌套状态是有帮助的，例如拥有多个侧边栏面板以及移动组件，这些在移动应用中会更常见。\n\n我们将我们将使用 `ngRoute`\
  \ 因为它是标准做法，但如果想阅读关于 `UI Router` 的更多内容，这里有一个很好的入门文章：[使用 UI-Router 进行 AngularJS 路由](http://scotch.io/tutorials/javascript/angular-routing-using-ui-router)。未来，Angular\
  \ 团队已表示，他们构建的下一个路由模块将包含 `ngRoute` 和 `UI Router` 的功能。\n\n***\n\n## 为 Angular 应用添加动画\n\
  \n如果这些出色的单页应用表现得不像单页应用，那么创建它们的意义何在？我们希望应用程序尽可能像原生应用，这样我们就可以模糊 Web 应用与原生应用之间的界限，给用户留下更深的印象。\n\
  \nAngularJS 提供了一种创建单页应用的很好的方法。由于我们是单页应用，这使得网站感觉越来越像原生移动应用。为了让它感觉更原生，我们可以使用 [ngAnimate\
  \ 模块](http://docs.angularjs.org/api/ngAnimate) 添加过渡和动画。\n\n该模块允许我们创建外观精美的应用程序，我们将查看如何为\
  \ ng-view 添加动画。\n\n#### 为我们的路由应用添加动画\n\n我们将为上一章中构建的单页应用添加动画。得益于我们的路由，当人们在页面之间点击时网站不会刷新。现在我们将：\n\
  \n*   让 `ngRoute` 处理路由（在上一章已完成）\n*   使用 `ngAnimate` 创建页面动画\n*   使用 `CSS 动画` 处理页面动画\n\
  \n在开始动画之前，让我们聊聊 `ngAnimate 模块` 是如何工作的。\n\n#### ngAnimate 模块是如何工作的？\n\n`ngAnimate`\
  \ 会根据元素进入或离开视图，向不同的 Angular 指令添加或移除 CSS 类。这会自动发生，我们不需要配置任何内容。\n\n当我们加载网站时自动添加和移除的类是\
  \ `.ng-enter` 或 `.ng-leave`。这些类被应用于应用 `ng-view` 指令的 div 上。我们现在还看不到这些，但如果你在页面之间点击时进入浏览器检查器，你会看到\
  \ `.ng-enter` 和 `.ng-leave` 类被应用。\n\n#### 动画是如何应用的\n\n该模块保持了内容的简洁和简单。它所做的只是添加类。但它是如何创建动画的呢？实际上它并没有。它为我们提供了所需的工具，然后我们通过创建\
  \ CSS 动画来控制动画。通过使用 CSS 动画，我们确保应用程序可以在移动浏览器、桌面端浏览器中工作，并符合最新标准（CSS3）。\n\n我们将使用 [Animate.css](http://daneden.github.io/animate.css/)\
  \ 项目的 CSS 动画，因为那些类（https://github.com/daneden/animate.css/blob/master/animate.css）可以很容易地引入我们自己的项目中。\n\
  \n#### 使用动画的指令\n\n`ngAnimate` 还会自动将这些类应用于更多的 Angular 指令。除了 `ngView` 模块外，这些类还被应用于\
  \ `ngRepeat`、`ngInclude`、`ngIf`、`ngSwitch`、`ngShow`、`ngHide`、`ngView` 和 `ngClass`。这意味着你可以对应用程序的多个部分添加动画。在本章中我们将关注\
  \ `ngView`，但这些策略可以很容易地应用于其他指令。\n\n#### 为我们的路由应用添加动画\n\n在上一章的应用程序中使用 `ngAnimate`\
  \ 模块有三个步骤：\n\n1.  链接到 `angular-animate.js` 文件\n2.  将 `ngAnimate` 模块注入到我们的主 Angular\
  \ 模块中\n3.  添加 `animate.css` 样式表以获得构建的 CSS 动画\n\n我们将使用 CDN 获取所需的 `angular-animate.js`\
  \ 和 `animate.css` 资源。回到你的 `index.html` 文件并将这两个资源添加到文档的 `<head>` 中。\n\n```\n 1 <head>\n\
  \ 2     <meta charset=\"utf-8\">\n 3     <title>My Routing App!</title>\n 4 \n 5\
  \     <!-- 设置路由的基路径 -->\n 6     <base href=\"/\">\n 7 \n 8     <!-- CSS -->\n 9\
  \     <!-- 加载 bootstrap 和 fontawesome -->\n 10    <link rel=\"stylesheet\" href=\"\
  https://stackpath.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\">\n 11\
  \    <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n 12    <!-- 加载 animate.css -->\n 13    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css\"\
  >\n 14    \n 15     <!-- JS -->\n 16    <!-- 加载 angular, angular-route 和 angular-animate\
  \ -->\n 17    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular.min.js\"\
  ></script>\n 18    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-route.min.js\"\
  ></script>\n 19    <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.8/angular-animate.min.js\"\
  ></script>\n 20    \n 21    <script src=\"js/app.js\"></script>\n 22    <script\
  \ src=\"js/routes.js\"></script>\n 23 </head>\n```\n\n对于需要的 `angular-animate.js`\
  \ 和 `animate.css` 资源，我们将使用 CDN。回到你的 `index.html` 文件并将这两个资源添加到文档的 `<head>` 中。\n\n\
  （上述代码块中的注释已根据逻辑进行了翻译和对齐）\n\n\n\n\n```\n1     <link rel=\"stylesheet\" href=\"css/style.css\"\
  >\n```\n\n我们将做的另一个更改是将 `<div ng-view></div>` 包裹在另一个 div 中，这样我们就可以专门地调用它。它看起来是这样：\n\
  \n```\n1     <div id=\"content-views\">\n2         <div ng-view></div>\n3     </div>\n\
  ```\n\n现在我们只需要进入新创建的样式表添加样式。不要忘记在 `index.html` 中链接你的样式表 `<link rel=\"stylesheet\"\
  \ href=\"css/style.css\" />`。\n\n```\n     body                          { padding-top:50px;\
  \ }\n\n     #content-views                { position:relative; }\n\n     .ng-enter,\
  \ .ng-leave          { width:100%; position:absolute; }\n     .ng-enter        \
  \             { \n       -webkit-animation:zoomInDown 1.2s both ease-in; \n    \
  \   -moz-animation:zoomInDown 1.2s both ease-in; \n         animation:zoomInDown\
  \ 1.2s both ease-in; \n     }\n     .ng-leave                     { \n       -webkit-animation:zoomOutDown\
  \ 0.5s both ease-in; \n       -moz-animation:zoomOutDown 0.5s both ease-in; \n \
  \        animation:zoomOutDown 0.5s both ease-in; \n     }\n```\n\n**厂商前缀 (Vendor\
  \ Prefixes)**：在将此代码推送到生产环境时，确保添加 `-moz-animation` 和 `-webkit-animation` 厂商前缀，以实现浏览器的兼容。\n\
  \n继续点击应用程序中的页面，观察页面飞出和飞入的效果！就是这样，我们有了一个动画应用程序！可以尝试其他的 [animate.css](http://daneden.github.io/animate.css/)\
  \ 类，看看你可以创建出多么疯狂不同的效果。\n\n### 结论\n\n这应该向你了如何将 Angular 路由和动画模块结合，可以快速构建看起来复杂的应用程序。这些技术可以用于构建各种不同风格的应用程序。到目前为止，在\
  \ Angular 方面我们已经：\n\n*   设置了 AngularJS 模块\n*   将 Angular 应用到我们的 HTML 视图中\n*   使用\
  \ `ngRoute` 对我们的应用程序进行路由\n*   使用 `ngAnimate` 和 CSS 类为我们的应用程序制作动画\n\n掌握上述知识将让我们能够构建出非常漂亮的应用程序。在接下来的章节中，我们将通过构建更多示例应用程序进一步探索这些概念。\n\
  \n到目前为止我们关注的是前端 Angular 部分；下一步是如何让 Angular 应用程序动态化。我们将转向整合前端和后端，但首先让我们确保应用程序的基础是稳固的，以便我们的应用程序具有可扩展性且易于理解。\n\
  \n## MEAN Stack 应用程序结构\n\n到目前，我们已经能够将大部分代码存放在几个主文件中（Node 的 `server.js` 和 Angular\
  \ 的 `app.js`）。当我们开始转向更大的 MEAN Stack 应用程序时，将所有代码都堆积在这些主文件中将变得非常笨重。维护代码、查找应用程序的某些部分将变得困难，最糟糕的是，与其他开发者共享错综复杂的代码。\n\
  \n考虑到这一点，让我们看看我们的应用程序结构。组织如此简单的东西会有深远的影响。这是一个短小章节，但是一个非常重要的章节。\n\n### 示例组织\n\n到目前为止，我们的应用程序具有以下文件结构：\n\
  \n```\n // node applications\n - app/\n ----- models/\n\n // angular applications\n\
  \ - public/\n ----- css/\n ----- js/\n---------- controllers/\n---------- services/\n\
  \ ----- app.js\n ----- views/\n---------- pages/\n ----- index.html\n\n - package.json\n\
  \ - server.js\n```\n\n在 **Node 方面**，我们不能将所有内容都留在 `server.js` 中。当我们开始放入更多的路由、更多的配置和更多的应用程序功能时，该文件可能会变成一个巨大的代码条条混合体。这必须被拆分为更有组织性的结构。\n\
  \n在 **Angular 方面**，这种结构可能会变得困惑。我们应该在哪里放置像 Bootstrap 或 Font Awesome 这样的 `lib` 文件呢？我们的\
  \ `js` 文件夹是否应该包含所有内容，包括我们的 Angular 应用程序文件？\n\n### 更好的结构\n\n那么更好的结构应该是什么样的？让我们结合\
  \ Node 和 Angular 部分，因为我们下一步将转向全栈应用程序。\n\n这是一个为我们的应用程序提供良好基础的更好组织方式。这是一种**模块化**方法，允许我们简单地从应用程序中添加和删除组件。\n\
  \n```\n - app/\n ----- models/\n ----- routes/\n - public/\n ----- assets/  // 应用程序的基础\
  \ css/js/images（不是 Angular 文件）\n---------- css/      // 一些自定义 css\n---------- js/\
  \       // 一些自定义 js（不是 Angular 文件）\n---------- img/\n---------- libs/     // 库如\
  \ bootstrap, angular, font-awesome\n ----- app/      // 应用程序的 Angular 部分\n----------\
  \ controllers/\n---------- services/\n---------- app.js\n---------- app.routes.js\n\
  ---------- views/\n---------- pages/\n ----- index.html\n - package.json\n - server.js\n\
  ```\n\n#### App 文件夹\n\n我们有 `models` 文件夹。新由于我们有了 `routes/` 文件夹。我们可以将路由放在这里。`app.js`。\n\
  \n#### 配置文件\n\n我们将配置变量从 `server.js` 中移出。对于我们的目的，我们没有许多配置变量，只有 `port`、我们的 `database`\
  \ 以及我们将使用的 `secret`。\n\n在根目录下创建一个名为 `config.js` 的新文件。\n\n以下是我们需要的：\n\n```\nmodule.exports\
  \ = {\n  'port': process.env.PORT || 8080,\n  'database': 'mongodb://node:novus.modulus.net:27017/ganiq8o',\n\
  \  'secret': 'ilovescscotchyscotscotch'\n};\n```\n\n#### Public 文件夹\n\n这是大部分移动发生的地方。之前，我们将所有（Angular\
  \ 文件和资源文件）存储在 `public/js` 文件夹中。随着应用程序的增长，这可能会变得混乱，所以现在我们设置让资源和应用程序文件位于不同的目录。\n\n\
  任何 Angular 特有的（如控制器、服务、路由和视图）将位于 `app/` 文件夹。像图像、自定义 CSS 和库将位于 `assets/` 文件夹。\n\n\
  在这里我们创建了 `app.routes.js` 文件。未来当我们创建更多路由时，我们可能想要将其移动到自己的 `routes/` 文件夹中，就像我们对 Node\
  \ 端做的那样。\n\n#### Routes 文件夹\n\n我们只是将路由移动到 `routes/api.js` 文件中。我们甚至可以在文件夹中创建多个路由。\n\
  \n### Node Node.js 后端\n\n由于第 10 章是关于创建 Node API 并对其进行验证的，这里只有 Node 代码可以处理。\n\n看看如何重新整理\
  \ Node 代码（快速说 10 遍……Node 代码，Node 代码，Node 代码）。请继续复制你的第 10 章代码并为它创建一个新项目。\n\n以下我们将采取的步骤概述：\n\
  \n*   将配置变量移动到新的 `config.js`\n*   将路由移动到新的 `routes/api.js` 文件中\n*   创建一个通符路由以准备用于\
  \ MEAN 应用\n\n#### 通符路由\n\n当 Angular 应用程序部署时，我们需要创建一个通符路由，以便任何不是针对 API 的请求都由 `index.html`\
  \ 文件提供。这允许 Angular 处理路由。\n\n```javascript\napp.get('*', (req, res) => {\n  res.sendFile(path.join(__dirname,\
  \ 'public/index.html'));\n});\n```\n\n\n\n\n现在我们可以使用 `require()` 在我们的 `server.js`\
  \ 文件中使用此文件。以下行将会被修改：\n\n```\n1 var config     = require('./config');\n2 \n3 // 连接到我们的数据库（托管在\
  \ modulus.io）\n4 mongoose.connect(config.database); \n5 \n6 // 启动服务器\n7 // ====================================\n\
  8 app.listen(config.port);\n9 console.log('Magic happens on port ' + config.port);\n\
  ```\n\n以下已经被移出，因此可以从 `server.js` 中删除：\n\n```\n1 // 创建令牌的超级密钥\n2 var superSecret\
  \ = 'ilovescotchscotchyscotchscotch';\n```\n\n虽然这看起来作用不大，但当我们的应用程序拥有 20 多个设置时，这个概念将产生巨大的影响。\n\
  \n***\n\n![Note](img/icon-pencil.png \"注意\")\n\n## Note\n\n### 什么是 `module.exports`？\n\
  \n默认情况下，JavaScript 没有任何在不同文件之间传递信息的方法。`module.exports` 是 Node 解决这个问题的方法。\n\n你可以将\
  \ `module.exports` 视为我们应用程序的一个巨大对象。当我们的应用程序启动时，这个 `module.exports` 对象看起来如下：\n\n\
  ```\n1 module.exports = {};\n```\n\n当我们开始使用 `require()` 将内容引入应用程序时，所有内容都会被添加到这个对象中。\n\
  \n所以，现在当我们通过 `require(./config.js);` 添加新的 `config.js` 文件时，我们就可以访问那些变量了，因为我们通过 `module.exports`\
  \ 传递了它们。\n\n这就是我们将在所有文件之间传递信息的方式，当我们在创建路由文件时再次在实践中看到这一点。\n\n同样重要的一点是，网络上的许多教程会在\
  \ `module.exports` 和 `exports` 之间切换。它们的意思相同，可以互相替换。\n\n***\n\n### 路由 (Routes)\n\n\
  就像我们的配置变量一样，让我们把路由移动到自己的文件中。创建一个名为 `app/routes/` 的文件夹和一个名为 `app/routes/api.js` 的文件。\n\
  \n在创建新文件时，我们必须 `require()` 该文件所需要的任何内容。在我们的情况下，我们需要 `body-parser`、我们的 `User` 模型、用于\
  \ `secret` 的 `config` 文件，以及 `jsonwebtoken`，因为它们在我们的路由中被用过。\n\n我们还需要 `app` 和 `express`，但我们将它们传递到路由中，因为我们希望应用程序使用我们在\
  \ `server.js` 中创建的同一个 `app` 对象。让我们来看看如何构建包含所有 API 路由的 `routes/api.js` 文件。进入第 10\
  \ 章现有的‘server.js’文件，提取所有的路由代码，从 `var apiRouter = express.Router();` 开始。我们将将其封装在\
  \ `module.exports` 中，以便它可以在我们的 JavaScript 文件之间传递。还要注意变量 `superSecret` 的变化以及我们在顶部引入的包。\n\
  \n\n\n\n```javascript\nvar User       = require('../models/user');\nvar jwt    \
  \    = require('jsonwebtoken');\nvar config     = require('../../config');\n\n//\
  \ 用于创建令牌的密钥\nvar superSecret = config.secret;\n\nmodule.exports = function(app,\
  \ express) {\n\n  var apiRouter = express.Router();\n\n  // 身份验证用户的路由 (POST http://localhost:8080/api/authenticate)\n\
  \  apiRouter.post('/authenticate', function(req, res) {\n    console.log(req.body.username);\n\
  \n    // 查找用户\n    // 显式选择密码，因为 mongoose 默认不返回它\n    User.findOne({\n      username:\
  \ req.body.username\n    }).select('password').exec(function(err, user) {\n\n  \
  \    if (err) throw err;\n\n      // 未找到该用户名的用户\n      if (!user) {\n        res.json({\
  \ \n          success: false, \n          message: '认证失败。未找到用户。' \n        });\n\
  \      } else if (user) {\n\n        // 检查密码是否匹配\n        var validPassword = user.comparePassword(req.body.password);\n\
  \        if (!validPassword) {\n          res.json({ \n            success: false,\
  \ \n            message: '认证失败。密码错误。' \n          });\n        } else {\n\n    \
  \      // 如果找到了用户且密码正确\n          // 创建令牌\n          var token = jwt.sign(user,\
  \ superSecret, {\n            expiresInMinutes: 1440 // 24 小时后过期\n          });\n\
  \n          // 返回包含令牌在内的 JSON 信息\n          res.json({\n            success: true,\n\
  \            message: '请使用您的令牌！',\n            token: token\n          });\n   \
  \     }   \n\n      });\n  });\n\n  // 验证令牌的路由中间件\n  apiRouter.use(function(req,\
  \ res, next) {\n      // 日志\n      console.log('有人访问了我们的应用！');\n\n      // 检查头部、URL\
  \ 参数或请求参数中的令牌\n      var token = req.body.token || req.param('token') || req.headers['x-access-token'];\n\
  \n      // 解码令牌\n      if (token) {\n\n        // 验证密钥并检查过期\n        jwt.verify(token,\
  \ superSecret, function(err, decoded) {      \n          if (err) {\n          \
  \  return res.json({ success: false, message: '令牌认证失败。' });    \n          } else\
  \ {\n            // 如果一切正常，保存到请求中供其他路由使用\n            req.decoded = decoded;   \
  \ \n\n            next(); // 确保我们进入下一个路由而不是在此停止\n          }\n        });\n\n  \
  \    } else {\n\n      // 如果没有令牌\n      // 返回 HTTP 403 响应（访问被禁止）和错误消息\n      return\
  \ res.status(403).send({ \n        success: false, \n        message: '未提供令牌。' \n\
  \      });\n      \n    }\n\n  });\n\n  // 测试路由以确保一切运行正常 \n  // 访问地址为 GET http://localhost:8080/api\n\
  \  apiRouter.get('/', function(req, res) {\n      res.json({ message: '万岁！欢迎来到我们的\
  \ api!' });   \n  });\n\n  // 以 /users 结尾的路由\n  // ----------------------------------------------------\n\
  \  apiRouter.route('/users')\n\n      // 创建用户 (访问地址为 POST http://localhost:8080/users)\n\
  \      .post(function(req, res) {\n          \n          var user = new User();\
  \      // 创建 User 模型的新实例\n          user.name = req.body.name;  // 设置用户名称（来自请求）\n\
  \          user.username = req.body.username;  // 设置用户名（来自请求）\n          user.password\
  \ = req.body.password;  // 设置用户密码（来自请求）\n          user.save(function(err) {\n \
  \             if (err) res.send(err);\n              // 返回消息\n              res.json({\
  \ message: '用户创建成功！' });\n          });\n      })\n      // 获取所有用户 (访问地址为 GET http://localhost:8080/api/users)\n\
  \      .get(function(req, res) {\n          User.find(function(err, users) {\n \
  \             if (err) res.send(err);\n              // 返回用户\n              res.json(users);\n\
  \          });\n      });\n  // 以 /users/:user_id 结尾的路由\n  // ----------------------------------------------------\n\
  \  apiRouter.route('/users/:user_id')\n      // 根据该 ID 获取用户\n      .get(function(req,\
  \ res) {\n          User.findById(req.params.user_id, function(err, user) {\n  \
  \            if (err) res.send(err);\n              // 返回该用户\n              res.json(user);\n\
  \          });\n      })\n      // 根据此 ID 更新用户\n      .put(function(req, res) {\n\
  \          User.findById(req.params.user_id, function(err, user) {\n           \
  \   if (err) res.send(err);\n              // 如果请求中存在新用户信息，则设置新信息\n            \
  \  if (req.body.name) user.name = req.body.name;\n              if (req.body.username)\
  \ user.username = req.body.username;\n              if (req.body.password) user.password\
  \ = req.body.password;\n              user.save(function(err) {\n              \
  \    if (err) res.send(err);\n                  // 返回消息\n                  res.json({\
  \ message: '用户已更新！ });\n              });\n          });\n      })\n      // 根据此\
  \ ID 删除用户\n      .delete(function(req, res) {\n          User.remove({\n       \
  \       _id: req.params.user_id\n          }, function(err) {\n              if\
  \ (err) res.send(err);\n              // 返回消息\n              res.json({ message:\
  \ '用户已删除' });\n          });\n      });\n\n  return apiRouter;\n};\n```\n\n\n\n\n\
  \n任何未被 Node 处理的路由都将传递给 Angular。创建路由非常简单。我们将删除为主页创建的路由，并创建以下内容：\n\n```\n 1 var path\
  \ = require('path');\n 2 \n 3 ... \n 4 \n 5 var apiRoutes...\n 6 \n 7 // 主通配路由 \
  \ --------------- \n 8 // 将用户发送到前端 ------------\n 9 // 必须在 API 路由之后注册\n10 app.get('*',\
  \ function(req, res) {\n11   res.sendFile(path.join(__dirname + '/public/app/views/index.html'));\n\
  12 });\n```\n\n确保 `path` 已在包（packages）部分中加载，因为传递 HTML 文件需要它。使用 `*` 会匹配所有路由。将此路由放在\
  \ **API 路由之后** 是非常重要的，因为我们只希望它来捕获未被 Node 处理的路由。\n\n如果将其置于 API 路由之上，我们的用户将始终被发送 `index.html`\
  \ 文件，而永远无法到达 API 路由。\n\n# 最终的 Node server.js\n\n这里是完整的 `server.js` 文件：\n\n```\n\
  \ 1 // 基础设置\n 2 // ======================================\n 3 \n 4 // 调用包 --------------------\n\
  \ 5 var express    = require('express');    // 调用 express\n 6 var app        = express();\
  \         // 使用 express 定义我们的应用\n 7 var bodyParser = require('body-parser');  //\
  \ 获取 body-parser\n 8 var morgan     = require('morgan');     // 用于查看请求\n9 var mongoose\
  \   = require('mongoose');\n10 var config     = require('./config');\n11 var path\
  \     = require('path');\n12 \n13 // 应用配置 ==================\n14 // ====================================\n\
  15 // 使用 body parser 以便我们可以从 POST 请求中获取信息\n16 app.use(bodyParser.urlencoded({ extended:\
  \ true }));\n17 app.use(bodyParser.json())\n18 \n19 配置我们的应用以处理 CORS 请求\n20 app.use(function(req,\
  \ res, next) {\n21   res.setHeader('Access-Control-Allow-Origin', '*');\n22   res.setHeader('Access-Control-Allow-Methods',\
  \ 'GET, POST');\n23   res.setHeader('Access-Control-Allow-Headers', 'X-Requested-With,content-type,\
