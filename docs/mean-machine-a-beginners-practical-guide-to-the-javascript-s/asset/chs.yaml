  \ </html>\n```\n\n# 测试我们新整理的应用\n\n让我们确保一切都运行正常。\n\n运行\n\n`npm install`\n\n如果你还没有安装依赖项的话。\n\
  \n然后运行\n\n`nodemon server.js`\n\n并在浏览器中访问！\n\n\n\n\n`$http` 模块可以注入到 Angular 模块中，无论是控制器还是服务。在上面的示例中，它被注入到了控制器中。然而，我们不希望在控制器中直接调用\
  \ `$http` 模块。这些逻辑应该移动到服务中，以便实现清晰的职责分离。服务获取数据，而控制器接收数据并将其发送到我们的视图。\n\n让我们看看如何在工厂（factory）中使用\
  \ `$http` 模块。\n\n### 示例 Angular 服务\n\n我们将构建一个示例工厂，并查看我们如何在 Angular 控制器中使用它。\n\n\
  #### Angular 工厂\n\n这是一个名为 `userService.js` 的快速示例文件，它将访问一个提供用户数据的 API。\n\n```\n 1\
  \ angular.module('stuffService', [])\n 2 \n 3 .factory('Stuff', function($http)\
  \ {\n 4 \n 5   // create the object\n 6   var myFactory = {};\n 7 \n 8   // a function\
  \ to get all the stuff\n 9   myFactory.all = function() {\n10     return $http.get('/api/stuff');\n\
  11   };\n12 \n13   return myFactory;\n14 \n15 });\n```\n\n我们刚刚创建了第一个 Angular 服务！语法非常直观。我们有一个名为\
  \ `Stuff` 的 `factory` 和一个名为 `all` 的函数。该函数将使用 `$http` 模块创建一个 HTTP GET 调用并返回一个 promise\
  \ 对象。然后我们可以通过访问 `success()`、`error()` 或 `then()` 来对 promise 对象进行操作。对于我们的目的来说，`success()`\
  \ 就足够了。\n\n***\n\n![Tip](img/icon-heart.png \"专业提示\")\n\n提示\n\n#### Promises（期 Promise）\n\
  \n如果你是 JavaScript 开发的新手，Promises 是一个很难理解的概念。Promises 通过充当某种占位符来帮助我们处理 JavaScript\
  \ 的异步性质。我们请求某些数据，promise 将等待响应，以便我们的程序其他部分可以继续它们正在做的其他工作。一旦我们的 promise 接收到结果，它将通知我们，我们可以根据该结果（无论成功还是失败）执行后续操作。\n\
  \n这里是一些理解 promises 的良好资源：\n\n* [promisejs.org](https://www.promisejs.org/) - 一个良好的原生\
  \ JS 解释\n* [AngularJS 中的 Promises，漫画版详解](http://andyshora.com/promises-angularjs-explained-as-cartoon.html)\n\
  \n我们将使用 promises 来处理从我们的 API 获取数据。这确保了我们按照想要的方式获取数据，并且数据不会丢失。`$http` 模块将返回一个我们可以使用的\
  \ promise 对象。\n\n***\n\n现在我们已经创建了 `stuffService` Angular 模块和 `Stuff` 工厂，让我们看看如何在\
  \ Angular 控制器中使用这个工厂。\n\n#### 在控制器中使用服务\n\n```\n 1 // inject the stuff service into\
  \ our main Angular module\n 2 angular.module('myApp', ['stuffService'])\n 3 \n 4\
  \ // create a controller and inject the Stuff factory\n 5 .controller('userController',\
  \ function(Stuff) {\n 6   \n 7   var vm = this;\n 8 \n 9   // get all the stuff\n\
  10   Stuff.all()\n11 \n12     // promise object\n13     .success(function(data)\
  \ {\n14 \n15       // bind the data to a controller variable\n16       // this comes\
  \ from the stuffService\n17       vm.stuff = data;\n18     });\n19 \n20 });\n```\n\
  \n就是这样，我们创建了一个 Angular 服务，将其注入到控制器中，并获取了所有的用户数据。理解此处的职责分离至关重要。\n\n> 服务负责从外部资源（我们的\
  \ API）获取数据，而控制器负责将这些数据提供给我们的视图。\n\n我们的控制器和服务之间存在职责分离。服务获取数据，控制器将数据传递给视图。\n\n###\
