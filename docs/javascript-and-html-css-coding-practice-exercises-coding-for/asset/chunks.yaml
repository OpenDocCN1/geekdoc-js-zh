  trans: "\n\n# 这是一级标题\n\n# HTML CSS 练习：后代选择器\n\n### HTML 代码\n```html\n<!DOCTYPE HTML>\n\
    <html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>CSS 后代选择器示例</title>\n\
    <style type=\"text/css\">\np span{\ncolor:#4b6c9c; \n}\n</style>\n</head>\n<body>\n\
    <p>只有<span>span 内部的文本</span>部分将显示为不同的颜色</p>\n</body>\n</html>\n```\n\n#### 输出结果\n\
    只有 span 内部的文本将显示为不同的颜色\n\n# 样式占位符文本\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>HTML CSS 练习 - 样式占位符文本</title>\n\
    \  <style type=\"text/css\">\ninput[type=\"text\"]::-webkit-input-placeholder\
    \ {\n  color: orange;\n}\n</style>\n</head>\n<body>\n//将此内容插入 html 区域。位于 codepen\
    \ 的 body 内部\n<form action=\"\">\n<div>\n    <label for=\"email\">邮箱:</label>\n\
    \    <input id=\"email\" name=\"email\" type=\"text\" placeholder=\"yourname@yourdomain.com\"\
    >\n  </div>\n</form>\n//将此内容插入 css 区域。位于 codepen 的 body 内部\n</body>\n</html>\n\
    ```\n\n### 输出结果\n![](img/Image00019.jpg)\n\n# 指定表单数据的推送位置\n\n## 当表单被提交时\n\n###\
    \ HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>如何在提交表单时指定表单数据的推送位置</title>\n</head>\n<body>\n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formaction-answer-demo.php\"\
    \ method=\"post\">\n  名：<input type=\"text\" name=\"fname\"><br>\n  姓：<input type=\"\
    text\" name=\"lname\"><br>\n  <button type=\"submit\">提交</button><br>\n  <button\
    \ type=\"submit\" formaction=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formaction-admin-demo.php\"\
    >以管理员身份提交</button>\n</form>\n</body>\n</html>\n```\n\n#### 输出结果\n![](img/Image00020.jpg)\n\
    \n# 发送表单数据\n\n## (使用哪种 HTTP 方法)\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta charset=\"utf-8\">\n  <title>如何发送表单数据，使用哪种 HTTP 方法</title>\n</head>\n\
    <body>\n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formmethod-answer-demo.php\"\
    >\n  名：<input type=\"text\" name=\"fname\"><br>\n  姓：<input type=\"text\" name=\"\
    lname\"><br>\n  地址：<input type=\"text\" name=\"place\"><br>\n  <button type=\"\
    submit\">提交</button>\n  <button type=\"submit\" formmethod=\"post\" formaction=\"\
    http://localhost/html-css-exercise/basic/solution/button-formmethod-post-answer.php\"\
    >使用 POST 提交</button>\n</form>\n</body>\n</html>\n```\n\n#### 输出结果\n![](img/Image00021.jpg)\n\
    \n# 指定显示位置\n\n## 提交表单后的响应\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>如何在提交表单后指定显示响应的位置</title>\n</head>\n<body>\n\
    <form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formtarget-answer-demo.php\"\
    \ method=\"POST\">\n  名：<input type=\"text\" name=\"fname\"><br>\n  姓：<input type=\"\
    text\" name=\"lname\"><br>\n  <button type=\"submit\">提交</button>\n  <button type=\"\
    submit\" formtarget=\"_blank\">提交到新窗口/标签页</button>\n</form>\n</body>\n</html>\n\
    ```\n\n#### 输出结果\n![](img/Image00022.jpg)\n\n# 为按钮指定名称\n\n### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何为按钮指定名称</title>\
    \ \n</head> \n<body> \n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-formaction-answer-demo.php\"\
    >\n选择感兴趣的主题：<button name=\"topic\" value=\"JavaScript\">JavaScript</button>\n\
    <button name=\"topic\" value=\"PHP\">PHP</button>\n</form>\n</body>\n</html>\n\
    ```\n\n#### 输出结果\n![](img/Image00023.jpg)\n\n# 指定按钮的类型\n\n### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何指定按钮的类型</title>\n\
    </head>\n<body>\n<form action=\"https://www.htmlresource.com/html-css-exercise/basic/solution/button-type-answer-demo.php\"\
    \ method=\"post\">\n  名：<input type=\"text\" name=\"fname\"><br>\n  姓：<input type=\"\
    text\" name=\"lname\"><br>\n  地址：<input type=\"text\" name=\"place\"><br>\n  <button\
    \ type=\"submit\">提交</button>\n  <button type=\"reset\">重置</button>\n</form>\n\
    </body>\n</html>\n```\n\n#### 输出结果\n![](img/Image00024.jpg)\n\n# 动态绘制图形\n\n##\
    \ 通过脚本\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
    utf-8\">\n  <title>如何通过脚本动态绘制图形</title>\n</head>\n<body>\n<style>\n#FirstCanvas{\n\
    width: 500px;\nheight: 300px;\nborder: 3px solid red;\nbackground-color: blue;\n\
    }\n</style>\n<canvas id=\"FirstCanvas\"></canvas>\n</body>\n</html>\n```\n\n####\
    \ 输出结果\n![](img/Image00025.jpg)\n\n# 定义表格标题\n\n### HTML 代码\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何定义表格标题</title>\n\
    </head>\n<body>\n<table border=\"1\">\n<caption>第一列包含学生代码，第二列包含学生获得的百分比。</caption>\n\
    <tr>\n<th>学生代码</th>\n<th>百分比</th>\n</tr>\n<tr>\n<td>S001</td>\n<td>85%</td>\n\
    </tr>\n<tr>\n<td>S002</td>\n<td>86%</td>\n</tr>\n<tr>\n<td>S003</td>\n<td>72%</td>\n\
    </tr>\n<tr>\n<td>S004</td>\n<td>89%</td>\n</tr>\n</table>\n</body>\n</html>\n\
    ```\n\n#### 输出结果\n![](img/Image00026.jpg)\n\n# 指定列属性\n\n### HTML 代码\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>如何指定列组内每列的属性</title>\n\
    </head>\n<body>\n<table class=\"table-bordered\">\n<colgroup>\n  <col span=\"\
    3\" style=\"background-color:#cc66Ff\">\n<col style=\"background-color:#cc66Ff\"\
    >\n</colgroup>\n<tr>\n<th>COL-1</th>\n<th>COL-2</th>\n<th>COL-3</th>\n</tr>\n\
    <tr>\n<td>MySQL</td>\n<td>PHP</td>\n<td>SQL</td>\n</tr>\n<tr>\n<td>MySQL 练习</td>\n\
    <td>PHP 练习</td>\n<td>SQL 练习</td>\n</tr>\n</table>\n</body>\n</html>\n```\n\n"
