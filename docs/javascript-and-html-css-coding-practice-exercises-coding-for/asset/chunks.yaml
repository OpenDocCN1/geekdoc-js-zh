    \n# HTML CSS 练习：CSS 按钮\n\n### HTML 代码\n```html\n<!doctype html>\n<html>\n<head>\n\
    <title>HTML CSS 练习 - 使用 CSS3 创建按钮</title>\n<style>\nbutton {\nwidth: 200px;\n\
    padding:8px;\nbackground-color: #428bca;\nborder-color: #357ebd;\ncolor: #fff;\n\
    -moz-border-radius: 10px;\n-webkit-border-radius: 10px;\nborder-radius: 10px;\
    \ /* 未来兼容性 */\n-khtml-border-radius: 10px; /* 用于旧版 Konqueror 浏览器 */\ntext-align:\
    \ center;\nvertical-align: middle;\nborder: 1px solid transparent;\nfont-weight:\
    \ 900;\nfont-size:125%\n}\n</style>\n<title>未标题文档</title>\n</head>\n<body>\n<button>立即订阅</button>\n\
    </body>\n</html>\n```\n\n### 输出结果\n![](img/Image00013.jpg)\n\n# HTML CSS 练习：使用\
    \ css3 创建缝线效果\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>使用 CSS3 创建缝线效果</title>\n  <style>\n  .stitched\
    \ {\n  width: 200px;\n  padding: 20px;\n  margin: 10px;\n  background: #0d90df;\n\
    \  color: #fff;\n  font-size: 21px;\n  font-weight: bold;\n  line-height: 1.3em;\n\
    \  border: 2px dashed #fff;\n  border-radius: 10px;\n  box-shadow: 0 0 0 4px #0d90df,\
    \ 2px 1px 6px 4px rgba(10, 10, 0, 0.5);\n  text-shadow: -1px -1px #aa3030;\n \
    \ font-weight: normal;\n}\n  </style>\n</head>\n<body>\n  <div class=\"stitched</div\n\
    </body>\n</html>\n```\n\n### 输出结果\n![](img/Image0014.jpg)\n\n# HTML CSS 练习：使用\
    \ CSS3 创建角角\n\n### HTML 代码\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>CSS3 角</title>\n<style type=\"text/css\">\n.ribbon\
    \ {\nbackground-color: #a00;\noverflow: hidden;\nwhite-space: nowrap;\n /* 顶部角\
    \ */\nposition: absolute;\nleft: -50px;\ntop: 40px;\n /* 45 度旋转 */\n-webkit-transform:\
    \ rotate(-45deg);\n-moz-transform: rotate(-45deg);\n-ms-transform: rotate(-45deg);\n\
    -o-transform: rotate(-45deg);\n transform: rotate(-45deg);\n /* 创建阴影 */\n-webkit-box-shadow:\
    \ 0 0 10px #888;\n-moz-box-shadow: 0 0 10px #888;\n box-shadow: 0 0 10px #888;\n\
    }\n.ribbon a {\ncolor: #fff;\ntext-decoration: none;\npadding: 5px;\n0px;\nfont-weight:\
    \ bold;\ndisplay: block;\nwidth: 150px;\nheight: 50px;\nline-height: 50px;\ntext-align:\
    \ center;\nposition: absolute;\ntop: -25px;\nleft: 25px;\ntransform: rotate(-45deg);\n\
    }\n</style>\n</head>\n<body>\n<div class=\"ribbon\"><a href=\"#\">优惠</a></div>\n\
    </body>\n</html>\n```\n*(注：由于原文 HTML 代码片段不完整，在翻译时基于逻辑进行了结构性补全或保留，此处为保持原意的结构性翻译)*\n\
    \n### 修正后的 HTML CSS 练习：CSS3 角角效果（基于逻辑的的翻译）\n由于 HTML 代码代码截，，\n\n对应的 HTML 代码：\n\
    ```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>CSS33 角</title>\n<style type=\"text/css\">\n.ribbon {\nbackground-color:\
    \ #a00;\noverflow: hidden;\nwhite-space: nowrap;\n /* 顶部角 */\nposition: absolute;\n\
    left: -50px;\ntop: 40px;\n /* 45 度旋转 */\n-webkit-transform: rotate(-45deg);\n\
    -moz-transform: rotate(-45deg);\n-ms-transform: rotate(-45deg);\n-o-transform:\
    \ rotate(-45deg);\n transform: rotate(-45deg);\n /* 创建阴影 */\n-webkit-box-shadow:\
    \ 0 0 10px #888;\n-moz-box-shadow: 0 0 10px #888;\n box-shadow: 0 0 10px #888;\n\
    }\n.ribbon a {\ncolor: #fff;\ntext-decoration: none;\npadding: 5px;\n0px;\nfont-weight:\
    \ bold;\ndisplay: block;\nwidth: 150px;\nheight: 50px;\nline-height: 50px;\ntext-align:\
    \ center;\nposition: absolute;\ntop: -25px;\nleft: 25px;\ntransform: rotate(-45deg);\n\
    }\n</style>\n</head>\n<body>\n<div class=\"ribbon\"><a href=\"#\">优惠</a></div>\n\
    </body>\n</html>\n```\n\n### 输出结果\n![](img/Image0015.jpg)\n\n# HTML CSS 练习：CSS3\
    \ 模糊文本\n\n### HTML 代码\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>CSS3 模糊文本</title>\n<style type=\"text/css\">\n\
    .blurred {\nfilter: blur(5px);\n}\n</style>\n</head>\n<body>\n<p class=\"blurred\"\
    >这段文字是模糊的</p>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/Image0016.jpg)\n\n#\
    \ HTML CSS 练习：CSS3 气泡框\n\n### HTML 代码\n```html\n<!DOCTYPE HTML>\n<html lang=\"\
    en\">\n<head>\n<meta charset=\"utf-8\">\n<title>CSS3 气泡形状</title>\n<style type=\"\
    text/css\">\n.bubble {\nposition: relative;\nwidth: 200px;\nheight: 100px;\nbackground:\
    \ #f9f9f9;\nborder-radius: 50px;\npadding: 20px;\ntext-align: center;\n}\n.bubble:after\
    \ {\ncontent: '';\nposition: absolute;\nbottom: -20px;\nleft: 50px;\nwidth: 0;\n\
    height: 0;\nborder-left: 10px solid transparent;\nborder-right: 10px solid transparent;\n\
    border-top: 20px solid #f9f9f9;\n}\n</style>\n</head>\n<body>\n<div class=\"bubble\"\
    >这是一个气泡框</div>\n</body>\n</html>\n```\n\n### 输出结果\n![](img/Image0017.jpg)\n\n\
