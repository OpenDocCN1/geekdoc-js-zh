    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction\
    \ vowel_count(str1) {\n  var vowel_list = 'aeiouAEIOU';\n  var vcount = 0;\n \
    \ for(var x = 0; x < str1.length ; x++) {\n    if (vowel_list.indexOf(str1[x])\
    \ !== -1) {\n      vcount += 1;\n    }\n  }\n  return vcount;\n}\nconsole.log(vowel_count(\"\
    The quick fox\"));\n```\n\n#### 输出\n5\n\n### 解释\n`indexOf()` 方法返回调用字符串对象中从 `fromIndex`\
