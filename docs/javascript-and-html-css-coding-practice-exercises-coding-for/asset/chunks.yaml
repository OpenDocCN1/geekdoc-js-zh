    \ 函数 – 练习题\n\n## JavaScript: 查找第一个不重复字符\n示例参数：'abacbec'\n预期输出：'e'\n\n### HTML\
    \ 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n \
    \ <title>查找第一个重复的字符。</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT\
    \ 代码\n```javascript\nfunction find_FirstNotRepeatedChar(str) {\n  var arra1 =\
    \ str.split('');\n  var result = '';\n  var ctr = 0;\n  for (var x = 0; x < arra1.length;\
    \ x++) {\n    ctr = 0;\n    for (var y = 0; y < arra1.length; y++) {\n      if\
    \ (arra1[x] === arra1[y]) {\n        ctr+= 1;\n      }\n    }\n    if (ctr < 2)\
    \ {\n      result = arra1[x];\n      break;\n    }\n  }\n  return result;\n}\n\
    console.log(find_FirstNotRepeatedChar('abacbec'));\n```\n\n### 输出\ne\n\n### 流程图\n\
    ![](img/Image00000.jpg)\n\n# JavaScript: 查找字符串中最长的单词\n示例字符串：'Web Development Tutorial'\n\
    预期输出：'Development'\n\n### HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=utf-8 />\n  <title>查找字符串中最长的单词</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n### JAVASCRIPT 代码\n```javascript\nfunction find_longest_word(str)\
    \ {\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n  var result = array1[0];\n\
    \  for(var x = 1 ; x < array1.length ; x++) {\n    if(result.length < array1[x].length)\
    \ {\n      result = array1[x];\n    }\n  }\n  return result;\n}\nconsole.log(find_longest_word('Web\
    \ Development Tutorial'));\n```\n\n### 输出\nDevelopment\n\n### 解释\n假设 `str` 等于\
    \ `@Web Production #Tutorial`。\n当字符串与正则表达式匹配时，使用 `match()` 方法来获取匹配项。\n作为 `str.match(/w[a-z]0,/gi)`\
    \ 的结果将返回 `[\"Web\", \"Development\", \"Tutorial\"]`。\n`for` 循环比较数组每个元素与上一个元素的长度，并返回最长的字符串。\n\
    `length` 属性是一个 32 位无符号整数，其数值始终大于数组的最高索引。\n语法 -> `arr.length`\n\n#### 流程图\n![](img/Image00001.jpg)\n\
    \n# JavaScript: 统计字符串中元音的数量\n示例字符串：'The quick fox'\n预期输出：5\n\n### HTML 代码\n```html\n\
