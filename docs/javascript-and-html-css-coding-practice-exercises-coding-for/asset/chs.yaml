  \ 程序。字符串长度必须为 3。</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT\
  \ 代码\n```javascript\nfunction right_three(str) {\n    if (str.length > 1)\n    {\n\
