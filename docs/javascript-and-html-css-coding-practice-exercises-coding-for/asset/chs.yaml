- "# JAVASCRIPT 和 HTML CSS 编码实践指南：初学者编码\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n# JavaScript\
  \ 函数 – 练习题\n\n\n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>查找第一个重复的字符。</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n## JAVASCRIPT 代码\n```javascript\nfunction find_FirstNotRepeatedChar(str) {\n \
  \ var arra1 = str.split('');\n  var result = '';\n  var ctr = 0;\n  for (var x =\
  \ 0; x < arra1.length; x++) {\n    ctr = 0;\n    for (var y = 0; y < arra1.length;\
  \ y++) {\n      if (arra1[x] === arra1[y]) {\n        ctr+= 1;\n      }\n    }\n\
  \    if (ctr < 2) {\n      result = arra1[x];\n      break;\n    }\n  }\n  return\
  \ result;\n}\nconsole.log(find_FirstNotRepeatedChar('abacbec'));\n```\n\n### 输出\n\
  e\n\n## 流程图\n![](img/Image00000.jpg)\n\n\n## HTML 代码\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <meta charset=utf-8 />\n  <title>查找字符串中最长的单词</title>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction find_longest_word(str)\
  \ {\n  var array1 = str.match(/\\w[a-z]{0,}/gi);\n  var result = array1[0];\n  for(var\
  \ x = 1 ; x < array1.length ; x++) {\n    if(result.length < array1[x].length) {\n\
  \      result = array1[x];\n    }\n  }\n  return result;\n}\nconsole.log(find_longest_word('Web\
  \ Development Tutorial'));\n```\n\n### 输出\nDevelopment\n\n### 解释\n假设 `str` 等于 `@Web\
  \ Production #Tutorial`。\n当字符串与正则表达式匹配时，使用 `match()` 方法来获取匹配项。\n作为 `str.match(/w[a-z]0,/gi)`\
  \ 的结果将返回 `[\"Web\", \"Development\", \"Tutorial\"]`。\n`for` 循环比较数组每个元素与上一个元素的长度，并返回最长的字符串。\n\
  `length` 属性是一个 32 位无符号整数，其数值始终大于数组的最高索引。\n语法 -> `arr.length`\n\n## 流程图\n![](img/Image00001.jpg)\n\
  \n\n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=utf-8\
  \ />\n  <title>统计字符串中元音的数量</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n##\
  \ JAVASCRIPT 代码\n```javascript\nfunction vowel_count(str1) {\n  var vowel_list =\
  \ 'aeiouAEIOU';\n  var vcount = 0;\n  for(var x = 0; x < str1.length ; x++) {\n\
  \    if (vowel_list.indexOf(str1[x]) !== -1) {\n      vcount += 1;\n    }\n  }\n\
  \  return vcount;\n}\nconsole.log(vowel_count(\"The quick fox\"));\n```\n\n### 输出\n\
  5\n\n### 解释\n`indexOf()` 方法返回调用字符串对象中从 `fromIndex` 开始定义的值的首次出现的索引。如果找不到值，则返回 -1。\n\
  语法 -> `str.indexOf(searchValue[, fromIndex])`\n参数包括：\n`searchValue`：要查找的字符串。\n`fromIndex`（可选）：字符串向前搜索的索引。可以使用任何整数。\n\
  如果满足条件 `(vowel_list.indexOf(str1[x])!== -1)`，则字符串字符将被视为元音。\n\n## 流程图\n![](img/Image00003.jpg)\n\
  \n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=utf-8 />\n\
  \  <title>检查数字是否为质数</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT\
  \ 代码\n```javascript\nfunction test_prime(n) {\n  if (n===1) {\n    return false;\n\
  \  }\n  else if(n === 2) {\n    return true;\n  }else {\n```\n\n\n\n\n\n```javascript\n\
  for(var x = 2; x < n; x++) {\n  if(n % x === 0) {\n    return false;\n  }\n}\nreturn\
  \ true; \n}\n}\nconsole.log(test_prime(37));\n```\n### 输出\nTrue\n\n## 流程图\n![](img/Image00004.jpg)\n\
  \n\n注意六种可能的值：object、boolean、method、number、string 或 undefined。\n\n## HTML 代码\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n<title>检测 JavaScript 数据类型</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
  \ detect_data_type(value) {\n  var dtypes = [Function, RegExp, Number, String, Boolean,\
  \ Object], x, len;\n  if (typeof value === \"object\" || typeof value === \"function\"\
  ) {\n    for (x = 0, len = dtypes.length; x < len; x++) {\n      if (value instanceof\
  \ dtypes[x]) {\n        return dtypes[x];\n      }\n    }\n  }\n  return typeof\
  \ value;\n}\nconsole.log(detect_data_type(12));\nconsole.log(detect_data_type('w3resource'));\n\
  console.log(detect_data_type(false));\n```\n### 输出\nnumber\nstring\nBoolean\n\n\
  # JavaScript: 从数组中找到第二小和第二数字\n\n![](img/Image00005.jpg)\n\n## HTML 代码\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT\
  \ 代码\n```javascript\nfunction Second_Greatest_Lowest(arr_num) {\n  arr_num.sort(function(x,y)\
  \ {\n    return x-y;\n  });\n  var uniqa = [arr_num[0]];\n  var result = [];\n \
  \ for(var j=1; j < arr_num.length; j++) {\n    if(arr_num[j-1] !== arr_num[j]) {\n\
  \      uniqa.push(arr_num[j]);\n    }\n  }\n  result.push(uniqa[1],uniqa[uniqa.length-2]);\n\
  \  return result.join(',');\n}\nconsole.log(Second_Greatest_Lowest([1,2,3,4,5]));\n\
  ```\n### 输出\n2,4\n\n## 流程图\n![](img/Image00006.jpg)\n\n# JAVASCRIPT 基础\n\n# 计算两个数字的乘法和除\n\
  \n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8 />\n\
  <title>计算两个数字乘法和除法的 JavaScript 程序 </title>\n<style type=\"text/css\">\nbody {margin:\
  \ 30px;}\n</style>\n</head>\n<body>\n<form>\n第一个数字 : <input type=\"text\" id=\"\
  firstNumber\" /><br>\n第二个数字: <input type=\"text\" id=\"secondNumber\" /><br>\n<input\
  \ type=\"button\" onClick=\"multiplyBy()\" Value=\"乘\" />\n<input type=\"button\"\
  \ onClick=\"divideBy()\" Value=\"除\" />\n</form>\n<p>结果是 : <br>\n<span id=\"result\"\
  ></</span>\n</p>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
  \ multiplyBy() {\n  var num1 = document.getElementById(\"firstNumber\").value;\n\
  \  var num2 = document.getElementById(\"secondNumber\").value;\n  document.getElementById(\"\
  result\").innerHTML = num1 * num2;\n}\nfunction divideBy() {\n  var num1 = document.getElementById(\"\
  firstNumber\").value;\n  var num2 = document.getElementById(\"secondNumber\").value;\n\
  \  document.getElementById(\"result\").innerHTML = num1 / num2;\n}\n```\n## 解析\n\
  `document.getElementById(id).value`: 文本框的属性用于设置或返回值。\n`document.getElementById(\"\
  result\").innerHTML`: 元素的 `innerHTML` 属性用于设置或返回 HTML 内容。\n### 输出\n![](img/Image0007.jpg)\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>编写一个将温度摄氏度转换为华氏度的\
  \ JavaScript 程序</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT\
  \ 代码\n```javascript\nfunction cToF(celsius) {\n  var cTemp = celsius;\n  var cToFahr\
  \ = cTemp * 9 / 5 + 32;\n  var message = cTemp+'°C is ' + cToFahr + '°F.';\n  console.log(message);\n\
  }\nfunction fToC(fahrenheit) {\n  var fTemp = fahrenheit;\n  var fToCel = (fTemp\
  \ - 32) * 5 / 9;\n  var message = fTemp+'°F is ' + fToCel + '°C.';\n  console.log(message);\n\
  }\n```\n### 输出\n60°C is 140°F.\n45°F is 7°C.\n\n# 找出三个整数中最大的\n\n## HTML 代码\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>找出三个整数中最大的 JavaScript\
  \ 程序</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\n\
  function max_of_three(x, y, z) {\n  var max_val = 0;\n  if (x > y) {\n    max_val\
  \ = x;\n  } else {\n    max_val = y;\n  }\n  if (z > max_val) {\n    max_val = z;\n\
  \  }\n  return max_val;\n}\nconsole.log(max_of_three(1,2,3));\nconsole.log(max_of_three(10,5,2));\n\
  console.log(max_of_three(7,15,12));\n```\n### 输出\n3\n10\n15\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>反转给定字符串的 JavaScript 程序</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
  \ string_reverse(str) {\n  return str.split(\"\").reverse().join(\"\");\n}\nconsole.log(string_reverse(\"\
  resource\"));\nconsole.log(string_reverse(\"www\"));\nconsole.log(string_reverse(\"\
  JavaScript\"));\n```\n### 输出\necruoser\nwww\ntpircS\n\n# 将字符串中的每个字符替换为字母表中的下一个字符\n\
  \n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
  >\n<title>将给定字符串中的每个字符替换为字母表中的下一个字符的 JavaScript 程序</title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction LetterChanges(text) {\n\
  \  var s = text.split('');\n  for (var i = 0; i < s.length; i++) {\n    // 撒亚密码\n\
  \    switch(s[i]) {\n      case ' ':\n        break;\n      case 'z':\n        s[i]\
  \ = 'a';\n        break;\n      case 'Z':\n        s[i] = 'A';\n        break;\n\
  \      default:\n        s[i] = String.fromCharCode(1 + s[i].charCodeAt(0));\n \
  \   }\n    // 大写元音\n    switch(s[i]) {\n      case 'a': case 'e': case 'i': case\
  \ 'o': case 'u':\n      s[i] = s[i].toUpperCase();\n    }\n  }\n  return s.join('');\n\
  }\nconsole.log(LetterChanges(\"PYTHON\"));\n```\n### 输出\nQZUPPO\n\n\n\n\n\n```javascript\n\
  console.log(LetterChanges(\"W3R\"));\nconsole.log(LetterChanges(\"php\"));\n```\n\
  \n## 输出:\nQZUIPO\nX4S\nqIq\n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
  >\n  <title>创建一个去掉第一个和最后一个字符的字符串的 JavaScript 程序</title>\n</head>\n<body>\n</body>\n\
  </html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction without_first_end(str)\
  \ {\n  return str.substring(1, str.length - 1);\n}\nconsole.log(without_first_end('JavaScript'));\n\
  console.log(without_first_end('JS'));\nconsole.log(without_first_end('PHP'));\n\
  ```\n\n## 输出:\navaScrip\nH\n\n# 拼接两个字符串\n\n## 它们第一个字符之外\n\n## HTML 代码\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
  \ content=\"width=device-width\">\n  <title>拼接除第一个字符外的两个字符串的 JavaScript 程序</title>\n\
  </head>\n<body>\n</body>\n</html>\n```\n\n## JAVASCRIPT 代码\n```javascript\nfunction\
  \ concatenate(str1, str2) {\n  str1 = str1.substring(1, str1.length);\n  str2 =\
  \ str2.substring(1, str2.length);\n  return str1 + str2;\n}\nconsole.log(concatenate(\"\
  PHP\",\"JS\"));\nconsole.log(concatenate(\"A\",\"B\"));\nconsole.log(concatenate(\"\
  AA\",\"BB\"));\n```\n\n## 输出:\nHPS\nAB\n\n# 移动最后三个字符\n\n## 指定字符串的开头\n\n## HTML 代码\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"\
