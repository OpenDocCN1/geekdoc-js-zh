  Python\"));\nconsole.log(right_three(\"JavaScript\"));\nconsole.log(right_three(\"\
  Hi\"));\n```\n\n## 输出:\nhonPyt\niptJavaScr\nHi\n\n# 计算和\n\n## 给定数组的三个元素\n\n### 长度为\
