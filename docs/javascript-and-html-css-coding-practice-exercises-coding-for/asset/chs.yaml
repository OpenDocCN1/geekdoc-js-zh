  # 找到距离 100 最近的数值\n\n## HTML 代码\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\">\n\
  \  <title>从两个不同的给定整数中找到距离 100 最近的值的 JavaScript 程序</title>\n</html>\n```\n\n## JAVASCRIPT\
  \ 代码\n```javascript\nfunction near_100(x, y) {\n  if (x != y) {\n    x1 = Math.abs(x\
  \ - 100);\n    y1 = Math.abs(y - 100);\n    if (x1 < y1) {\n      return x;\n  \
  \  }\n    if (y1 < x1) {\n      return y;\n    }\n    return 0;\n  }\n  else {\n\
  \    return false;\n  }\n}\nconsole.log(near_100(90, 89));\nconsole.log(near_100(-90,\
  \ -89));\nconsole.log(near_100(90, 90));\n```\n\n## 输出:\n90\n-89\nfalse\n\n\n\n\n\
