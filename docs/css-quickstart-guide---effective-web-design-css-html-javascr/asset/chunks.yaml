    # Introduction


    CSS, the shortened version of Cascading Style Sheets, is one of the simplest of
    all the design languages, the one you need to use for the most effective web design.
    CSS will handle how your webpages look and how they feel; you can set the text
    color, the font style, how much space there is between each paragraph, how the
    web page columns are laid out and sized, the colors and images needed for the
    background and all the other layout and design variations that you need to make
    your website work on all different screen sizes and devices.


    CSS is incredibly easy to understand and learn and it gives you powerful control
    over how your HTML document are presented. It is commonly combines with two of
    the more popular markup languages, HTML or XHTML, to provide you with all the
    tools you need to produce a well-designed website.


    For the purpose of this book, I am going to take you through all of the main aspects
    of web design that you can control CSS, together with sample code. I hope that,
    by the end of it, you have some idea of how easy CSS is to use and the amazing
    results you can produce.


    # Chapter 1: The Advantages of Using CSS


    CSS has a lot of advantages over and above any other similar program, including:


    Time-Savings - with CSS, you can write it once and then use the exact same sheet
    in a number of different HTML pages. Each HTML element can have its own separate
    style that can be applied to multiple web pages.


    Faster Page Load Times – when you use CSS, there is no need to write the HTML
    tag attribute every single time. Instead, you can write just one rule for a tag
    and then apply it to every occurrence of the tag. Less code equals much faster
    loading times


    Easy to Maintain -  when you want to make a global change, all you need to do
    is change the style; each element relating to that style in all the web pages
    it was used in will be changed


    Superior to HTML in Style – CSS provides access to a much bigger range of attributes
    than HTML does so your HTML page will look better than if you used HTML attributes.


    Compatibility with Multiple Devices – Your style sheets allow for content to be
    optimized for more multiple types of device. Using the same HTML document, you
    can produce different website versions for printing, for PDAs or for mobile devices,
    for example.


    Global Web Standards – More and more, CS I being recommended over HTML so now
    is a good time to start learning it and using it in all your HTML pages. That
    way, they will be compatible with the browsers of the future.


    Offline Browsing   CSS is able to store applications locally using offline cache.
    This mean that you will find it easier to view offline websites and, because of
    the cache, they will load faster and the website will perform better.


    As you can see, CSS offers a ton of advantages over using HTML, not least the
    fact that it is now the recognized standard. With CSS becoming more and more poplar,
    now is the best time to start your learning process.


    Without any further ado, let us delve into the CSS elements that you use for web
    design.


    Before I go any further, I must state that some of the example code used in the
    book is attributed to www.tutorialspoint.com.


    # Chapter 2: CSS Modules


    CSS modules take on the existing CSS specifications along with a number of extension
    features, including:


    *   Selectors

    *   Box Model

    *   Image Values

    *   Backgrounds and borders

    *   Replaced content

    *   Text effect

    *   D and 3D transformations

    *   Animations

    *   Multiple column layout

    *   Use Interface


    CSS is made up of a number of style rules that are interpreted by the browser
    before being applied to the right element of the document. Style rules are split
    into three:


    Selector - this is the HTML tag that the style is applied to. Examples of these
    tags are, `<h1>` or `<table>`.


    *   Property – Properties are types of HTML ta attributes. In simple terms, all
    HTML attributes are changed to CSS properties, for example, `color` `border`,
    etc.


    *   Value – Each property is assigned a value or value. For example, the color
    property may have a value of red or perhaps `#F2F2F2`, etc.


    The syntax for a CSS style rule is:


    ```

    selector { property: value }

    ```


    For eample, you could define a border on a table as:


    ```

    table{ border :1px solid #C00; }

    ```

