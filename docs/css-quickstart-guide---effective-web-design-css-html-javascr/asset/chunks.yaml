    You need to be dedicated to learning it and, once you have, you must be prepared
    to keep up with all the latest developments. CSS isn’t a program you can learn,
    forget about and then pick up again a few months later. While you will still have
    the basics in your mind, in those few months, much may have happened and many
    changes may have been made. It is vital that you keep up with the changes and
    that you use CSS on a daily basis to ensure that you do not lose any of your newfound
    skills.


    CSS is a program that you learn, that you understand and that you live. Please
    may I ask a small favor of you - will you leave a review for me at Amazon.com?
    It isn’t only helpful to me; it is helpful to others who may decide to purchase
    my book.


    As stated earlier, this is to reiterate that some of the example code that I have
    used in this book is attributed to www.tutorialspoint.com'
