  trans: "\n在这个例子中，`table` 是一个选择器，`border` 是一个属性。它被赋予了 `1px solid #C00` 的值。\n\n选择器可以通过多种方式定义，下面我们逐一介绍：\n\
    \n## 类型选择器\n\n上面你已经看到了类型选择器的例子，但让我们再看一个——为所有一级标题添加颜色的方法：\n\n```css\nh1 {\n   \
    \ color: #36CFFF;\n}\n```\n\n## 通用选择器\n\n这个选择器不是选择与特定类型相关的元素，而是直接匹配元素类型的名称。例如：\n\
    \n```css\n* {\n    color: #000000;\n}\n```\n\n在这个例子中，所有元素的内容都变成了黑色。\n\n## 后代选择器\n\
    \n假设你想给某个特定元素设置样式，但仅当它位于另一个特定元素内部时。在下面的例子中，我们将样式规则应用于 `<em>` 元素，但仅当它位于 `<ul>`\
    \ 标签之外时：\n\n```css\nul em {\n    color: #000000;\n}\n```\n\n## 类选择器\n\n类选择器允许你使用元素的\
    \ `class` 属性来定义样式规则。所有属于该特定类的元素都会按照定义的规则进行格式化：\n\n```css\n.black {\n    color:\
    \ #000000;\n}\n```\n\n在这个例子中，规则将所有 `class` 属性为 `black` 的元素内容变为黑色。如果你愿意，还可以更进一步：\n\
    \n```css\nh1.black {\n    color: #000000;\n}\n```\n\n现在你指定了只有 `<h1>` 元素中 `class`\
    \ 属性为 `black` 的内容才会变为黑色。\n\n不过，一个元素并不限于只能使用一个类选择器。请看这个例子：\n\n```html\n<p class=\"\
    center bold\">\n该段落的样式由 Bold 和 Center 这两个类定义。\n</p>\n```\n\n## ID 选择器\n\n样式规则可以定义在元素的\
    \ `id` 属性上，一旦定义了规则，它将格式化所有具有指定 `id` 属性的元素：\n\n```css\n#black {\n    color: #000000;\n\
    }\n```\n\n这条规则会将所有 `id` 属性为 `black` 的元素内容变为黑色。如果你愿意，可以更具体一些，例如：\n\n```css\nh1#black\
    \ {\n    color: #000000;\n}\n```\n\n这条规则仅当 `<h1>` 元素的 `id` 属性设置为 `black` 时，才将其内容变为黑色。\n\
    \nID 选择器的真正威力在于它们作为后代选择器的基础时体现出来，例如：\n\n```css\n#black h2 {\n    color: #000000;\n\
    }\n```\n\n这里可以看到，所有二级标题只有在位于 `id` 属性设置为 `black` 的标签内部时，才会变为黑色。\n\n## 子选择器\n\n\
    子选择器与后代选择器类似，但功能不同。请看这个例子：\n\n```css\nbody > p {\n    color: #000000;\n}\n```\n\
    \n这将使段落变为黑色，但仅当它们是 `<body>` 元素的直接子元素时。其他位于其他元素（如 `<td>` 或 `<div>`）内部的段落不会改变。\n\
    \n## 属性选择器\n\n样式也可以应用于具有特定属性的 HTML 元素。请看下面的例子；你可以看到样式规则将匹配所有 `type` 属性值为 `text`\
    \ 的 `input` 元素：\n\n```css\ninput[type=\"text\"] {\n    color: #000000;\n}\n```\n\
    \n使用这种方法的优点是 `<input type=\"submit\" />` 不会受到影响，颜色变化仅应用于特定的文本字段。\n\n以下是属性选择器的规则：\n\
    \n*   `p[lang]` - 选择所有具有 `lang` 属性的段落元素\n*   `p[lang=\"fr\"]` – 选择所有 `lang` 属性精确值为\
    \ `\"fr\"` 的段落元素\n*   `p[lang~=\"fr\"]` – 选择所有 `lang` 属性包含 `\"fr\"` 的段落元素\n* \
    \  `p[lang|=\"en\"]` – 选择所有 `lang` 属性精确值为 `\"en\"` 或以 `\"en-\"` 开头的段落元素\n\n##\
    \ 多重样式规则\n\n可以为单个元素定义多条样式规则，这些规则应组合成一个块，包含多个属性及其对应的值，如下例所示：\n\n```css\nh1 {\n\
    \    color: #36C;\n    font-weight: normal;\n    letter-spacing: .4em;\n    margin-bottom:\
    \ 1em;\n    text-transform: lowercase;\n}\n```\n\n在这个例子中，你可以看到每对属性和值之间用分号（`;`）分隔。它们可以放在一行，也可以分散在多行，但为了便于阅读，我们将其放在单独的行上。\n\
    \n## 分组选择器\n\n样式可以应用于多个选择器。你只需记住用逗号分隔每个选择器，如下例所示：\n\n```css\nh1, h2, h3 {\n  \
    \  color: #36C;\n    font-weight: normal;\n    letter-spacing: .4em;\n    margin-bottom:\
    \ 1em;\n    text-transform: lowercase;\n}\n```\n\n这条样式规则将应用于所有 `h1`、`h2` 和 `h3`\
    \ 元素。列表中的顺序无关紧要，因为选择器中的所有元素都将应用这些声明。从下面的例子可以看出，可以组合多个类选择器：\n\n```css\n#content,\
    \ #footer, #supplement {\n    position: absolute;\n    left: 510px;\n    width:\
    \ 200px;\n}\n```\n\n# 第 3 章：包含方式\n\n你有四种方法将样式与 HTML 文档关联起来，其中最常用的是内联 CSS 和外部 CSS\
    \ 方法。\n\n## 嵌入式 CSS\n\nCSS 规则可以通过使用 `<style>` 元素放入 HTML 文档中。该标签位于 `<head>…</head>`\
    \ 标签内，使用此语法定义的规则适用于所有可用元素。下面的例子展示了一个嵌入式 CSS 样式元素：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n   <head>\n      <style type=\"text/css\" media=\"all\">\n         body\
    \ {\n            background-color: linen;\n         }\n         h1 {\n       \
    \     color: maroon;\n            margin-left: 40px;\n         }\n      </style>\n\
    \   </head>   \n   <body>\n      <h1>这是一个标题</h1>\n      <p>这是一个段落。</p>\n   </body>\n\
    </html>\n```\n\n### 属性\n\n与 `<style>` 元素相关的常见属性如下表所示：\n\n| 属性 | 值 | 描述 |\n| ---\
    \ | --- | --- |\n| `type` | `text/css` | 该属性将样式表的语言指定为 MIME 内容类型，是必需属性 |\n| `media`\
    \ | `screen` `tty` `tv` `projection` `handheld` `print` `braille` `aural` `all`\
    \ | 指定文档将在哪种设备上显示。默认值为 `all`，属于可选属性 |\n\n## 内联 CSS\n\n你也可以使用任何 HTML 元素的 `style`\
    \ 属性来定义规则。这些特定规则仅应用于该特定元素。通用语法为：\n\n```html\n<element style=\"...样式规则....\">\n\
    ```\n\n### 属性\n\n`style` 属性的值由不同的样式声明混合而成，每个声明之间用分号分隔。以下示例基于通用语法：\n\n```html\n\
    <html>\n   <head>\n   </head>\n   <body>\n      <h1 style=\"color:#36C;\"> 这是内联\
    \ CSS </h1>\n   </body>\n</html>\n```\n\n## 外部 CSS - `<link>` 元素\n\n你可以使用 `<link>`\
    \ 元素将外部样式表包含到 HTML 文档中。外部样式表是独立的文本文件，扩展名为 `.css`。你将在该文件中定义所有样式规则，然后可以通过 `<link>`\
    \ 元素将其添加到任何 HTML 文档中。通用语法为：\n\n```html\n<head>\n   <link type=\"text/css\" href=\"\
    ...\" media=\"...\" />\n</head>\n```\n\n### 属性\n\n与 `<style>` 元素相关的属性如下：\n\n|\
    \ 属性 | 值 | 描述 |\n| --- | --- | --- |\n| `type` | `text/css` | 将样式表的语言指定为 MIME\
    \ 内容类型，是必需属性 |\n| `href` | `URL` | 指定样式表包含样式规则，也是必需属性 |\n| `media` | `screen`\
    \ `tty` `tv` `projection` `handheld` `print` `braille` `aural` `all` | 指定文档可以在哪些设备上显示，是可选属性。默认值为\
    \ `all` |\n\n例如，考虑一个名为 `mystyle.css` 的样式表，其中包含以下规则：\n"
- fmt: "\n```\nh1, h2, h3 {\n   color: #36C;\n   font-weight: normal;\n   letter-spacing:\
    \ .4em;\n   margin-bottom: 1em;\n   text-transform: lowercase;\n}\n```\n\nNow,\
    \ using the following code, you can add this file to any HTML document:\n\n```\n\
    <head>\n   <link type = \"text/css\" href = \"mystyle.css\" media = \" all\" />\n\
    </head>\n```\n\n## Imported CSS - @import Rule\n\nThe `@import` rule is used to\
    \ import external stylesheets in a similar way to the `<link>` element. The generic\
    \ syntax is:\n\n```\n<head>\n   <@import \"URL\";\n</head>\n```\n\nIn this syntax,\
    \ `URL` is used as the URL of the specific stylesheet that contains the style\
    \ rules. Another way of writing it would be:\n\n```\n<head>\n   <@import url(\"\
    URL\");\n</head>\n```\n\nThe following example shows you how to import the style\
    \ sheet to the HTML document:\n\n```\n<head>\n   @import \"mystyle.css\";\n</head>\n\
    ```\n\n## Overriding CSS Rules\n\nSo far, we have looked at four different ways\
    \ to include a style sheet in an HTML document. Now we look at how to override\
    \ any of the style sheet rules:\n\n*   An inline style sheet will take the top\
    \ priority, including over any rule that is defined in an external sheet or defined\
    \ in `<style> … </style>` tags\n*   Any `<style> … </style>` tag will override\
    \ an external sheet file\n*   External style sheet rules are the lowest priority\
