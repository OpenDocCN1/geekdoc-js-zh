  trans: "\n\n# 第 9 章：使用图像\n\n图像是网站的重要组成部分，虽然不应使用过多，但使用的图像应质量良好且位置恰当。CSS 通过允许设置以下属性来控制这些图像的显示：\n\
    \n*   `Border` – 用于设置图像边框的宽度\n*   `Height` – 用于设置图像的高度\n*   `Width` – 用于设置图像的宽度\n\
    *   `-moz-opacity` – 用于确定图像的不透明度\n\n## 图像边框\n\n该属性用于设置图像边框的宽度，可以使用长度值或 `%`。例如：\n\
    \n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img style=\"border:0px;\"\
    \ src=\"/css/images/logo.png\" />\n      <br />\n      <img style=\"border:3px\
    \ dashed red;\" src=\"/css/images/logo.png\" />\n   </body>\n</html>\n```\n\n\
    结果将是一个无边框的徽标，然后是一个带有红色虚线边框的徽标。\n\n## 图像高度\n\n该属性用于设置图像的高度，可以使用长度值或 `%`。当使用 `%`\
    \ 时，该值应用于图像所在的盒子：\n\n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img\
    \ style=\"border:1px solid red; height:100px;\" src=\"/css/images/logo.png\" />\n\
    \      <br />\n      <img style=\"border:1px solid red; height:50%;\" src=\"/css/images/logo.png\"\
    \ />\n   </body>\n</html>\n```\n\n结果将是两个完全相同的徽标，但一个比另一个高。\n\n## 图像宽度\n\n该属性用于使用\
    \ `%` 或长度值设置图像的宽度。与高度类似，使用百分比时应用于图像所在的盒子：\n\n```\n<html>\n   <head>\n   </head>\n\
    \   <body>\n      <img style=\"border:1px solid red; width:150px;\" src=\"/css/images/logo.png\"\
    \ />\n      <br />\n      <img style=\"border:1px solid red; width:100%;\" src=\"\
    /css/images/logo.png\" />\n   </body>\n</html>\n```\n\n结果将是两个相同的徽标，但尺寸不同。\n\n\
    ## `-moz-opacity`\n\n最后一个属性用于设置图像的不透明度，适用于 Mozilla Firefox。对于 Internet Explorer，我们使用\
    \ `filter:alpha(opacity=x)` 来实现透明图像。\n\n在 Mozilla Firefox 中，属性 `-moz-opacity:x`\
    \ 中的 `x` 可以取 `0.0` 到 `1.0` 之间的任意值。值越低，图像越透明。同样，在 Internet Explorer 中，`filter:alpha(opacity=x)`\
    \ 的 `x` 值可以在 `0` 到 `100` 之间。同样，值越低，图像越透明。\n\n```\n<html>\n   <head>\n   </head>\n\
    \   <body>\n      <img style=\"border:1px solid red;-moz-opacity:0.4;filter:alpha(opacity=40);\"\
    \ src=\"/css/images/logo.png\" />\n   </body>\n</html>\n```\n\n结果将是一个带有红色实线边框的徽标。\n\
    \n# 第 10 章：链接\n\n在本章中，我们将了解如何使用 CSS 设置超链接的属性。可以设置以下属性：\n\n*   `:link` 用于表示未访问的超链接。\n\
    *   `:visited` 用于表示已访问的超链接。\n*   `:hover` 用于表示鼠标指针悬停在其上的元素。\n*   `:active` 用于表示当前正在被点击的元素。\n\
    \n通常，这些属性存储在 HTML 文档的头部。请记住以下有效使用的规则：\n\n*   在 CSS 定义中，`a:hover` 位于 `a:link` 和\
    \ `a:visited` 之后\n*   `a:active` 位于 `a:hover` 之后，如下例所示：\n\n```\n<style type=\"\
    text/css\">\n   a:link {color: #000000}\n   a:visited {color: #006600}\n   a:hover\
    \ {color: #FFCC00}\n   a:active {color: #FF00CC}\n</style>\n```\n\n接下来，我们将了解这些属性如何用于实现超链接的不同效果。\n\
    \n## 设置颜色\n\n此示例展示了如何使用任何有效格式的颜色名称值来设置链接的颜色：\n\n```\n<html>\n   <head>\n     \
    \ <style type=\"text/css\">\n         a:link {color:#000000}\n     </style>\n\
    \   </head>\n   <body>\n      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\
    \n结果将是一个黑色链接。请注意，这些链接均不可点击，仅用于演示目的。\n\n链接\n\n## 已访问链接的颜色\n\n此示例展示了如何设置已访问链接的颜色，同样使用任何有效格式的颜色名称值：\n\
    \n```\n<html>\n   <head>\n      <style type=\"text/css\">\n         a:visited\
    \ {color: #006600}\n      </style>\n   </head>\n   <body>\n      <a href=\"\"\
    > link</a>\n   </body>\n</html>\n```\n\n结果将是以下链接：初始为黑色，点击后变为绿色。\n\n链接\n\n## 鼠标悬停时链接的颜色\n\
    \n此示例展示了当鼠标指针悬停在链接上时如何改变其颜色：\n\n```\n<html>\n   <head>\n      <style type=\"text/css\"\
    >\n         a:hover {color: #FFCC00}\n      </style>\n   </head>\n   <body>\n\
    \      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\n结果将是一个黑色链接，当鼠标悬停在其上时变为黄色。\n\
    \n链接\n\n## 活动链接的颜色\n\n此示例展示了如何改变活动链接的颜色：\n\n```\n<html>\n   <head>\n      <style\
    \ type=\"text/css\">\n         a:active {color: #FF00CC}\n      </style>\n   </head>\n\
    \   <body>\n      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\n结果将是一个黑色链接，点击时变为粉色。\n\
    \n链接\n\n# 第 11 章：表格\n\n在本章中，我们将了解可以为 HTML 表格设置的属性。可以设置以下属性：\n\n*   `Border-collapse`\
    \ – 指定表格的单元格是保持各自的外观，还是由浏览器控制相邻的边框\n*   `Border-spacing` – 指定表格单元格之间的间距宽度\n* \
    \  `Caption-side` 标题 – 这些标题位于 `<caption>` 元素中，默认情况下渲染在表格上方。它们可用于设置表格标题的位置\n\n"
- fmt: "\n*   `Empty-cells` – this specifies whether there should be a border shown\
    \ on empty cells\n*   `Table-layout` – this lets the browser speed up the table\
    \ layout by using the first width property it finds for a column without having\
    \ to load the table and then rendering it\n\nNext we look at these properties\
    \ with examples.\n\n## `Border-Collapse`\n\nThis property may have two values\
    \ – `collapse` and `separate`. This example uses both:\n\n```html\n<html>\n  \
    \ <head>\n      <style type=\"text/css\">\n         table.one {border-collapse:collapse;}\n\
    \         table.two {border-collapse:separate;}\n         td.a {\n           \
    \ border-style:dotted;\n            border-width:3px;\n            border-color:#000000;\n\
    \            padding: 10px;\n         }\n         td.b {\n            border-style:solid;\n\
    \            border-width:3px;\n            border-color:#333333;\n          \
    \  padding:10px;\n         }\n      </style>\n   </head>\n   <body>\n      <table\
    \ class=\"one\">\n         <caption>Collapse Border Example</caption>\n      \
    \   <tr><td class=\"a1 Cell 1 Collapse Example</td></tr>\n         <tr><td class=\"\
    2\"> Cell 2 Collapse Example</td></tr>\n      </table>\n      <br />\n      <table\
    \ class=\"two\">\n         <caption>Separate Border Example</caption>\n      \
    \   <tr><td class=\"1\"> Cell 1 Separate Example</td></tr>\n         <tr><td class=\"\
    2\"> Cell 2 Separate Example</td></tr>\n      </table>\n   </body>\n</html>\n\
    ```\n\nThis will give you these results;\n\n| Collapse Border: |\n| Cell 1 Collapse\
    \ Example |\n| Cell 2 Collapse Example |\n| Separate Border: |\n| Cell 1 Separate\
    \ Example |\n| Cell 2 Separate Example |\n\n## `Border-Spacing`\n\nThis property\
    \ specifies how much distance there is between the border of two adjacent cells.\
    \ It can take either of two values, each of which should be a length unit. One\
    \ value applies to horizontal and vertical borders while using two values will\
    \ refer to the vertical and the horizontal spacing.\n\n```css\n<style type=\"\
    text/css\">\n   /* If you provide a value */\n   table.example {border-spacing:10px;}\n\
    \   /* This is how to provide two values */\n   table.example {border-spacing:10px;\
    \ 15px;}\n</style>\n```\n\nThe next example modifies the first example:\n\n```html\n\
    <html>\n   <head>\n      <style type=\"text/css\">\n         table.one {\n   \
    \         border-collapse:separate;\n            width:400px;\n            border-spacing:10px;\n\
    \         }\n         table.two {\n            border-collapse:separate;\n   \
    \         width:400px;\n            border-spacing:10px 50px;\n         }\n  \
    \    </style>\n   </head>\n   <body>\n      <table class=\"one\" border=\"1\"\
    >\n         <caption>Separate Border Example with border-spacing</caption>\n \
    \        <tr><td> Cell A Collapse Example</td></tr>\n         <tr><td> Cell B\
    \ Collapse Example</td></tr>\n      </table>\n      <br />\n      <table class=\"\
    two\" border=\"1\">\n         <caption>Separate Border Example with border-spacing</caption>\n\
    \         <tr><td> Cell A Separate Example</td></tr>\n         <tr><td> Cell B\
    \ Separate Example</td></tr>\n      </table>\n   </body>\n</html>\n```\n\n## `Caption-Side`\
    \ Property\n\nThis property allows you to specify the position of the `<caption>`\
    \ element content in relation to the table. It can use these four properties –\
    \ `top`, `left`, `bottom`, `right`. The following example uses all of the four\
    \ values:\n\n```html\n<html>\n   <head>\n      <style type=\"text/css\">\n   \
    \      caption.top {caption-side:top}\n         caption.bottom {caption-side:bottom}\n\
    \         caption.left {caption-side:left}\n         caption.right {caption-side:right}\n\
    \      </style>\n   </head>\n   <body>\n      <table style=\"width:400px; border:1px\
    \ solid black;\">\n         <caption class=\"top\">\n         This caption will\
    \ appear at the top\n         </caption>\n         <tr><td > Cell A</td></tr>\n\
    \         <tr><td > Cell B</td></tr>\n      </table>\n      <br />\n      <table\
    \ style=\"width:400px; border:1px solid black;\">\n         <caption class=\"\
    bottom\">\n         The caption appears at the bottom\n         </caption>\n \
    \        <tr><td > Cell A</td></tr>\n         <tr><td > Cell B</td></tr>\n   \
    \   </table>\n      <br />\n      <table style=\"width:400px; border:1px solid\
    \ black;\">\n         <caption class=\"left\">\n         The caption appears at\
    \ the left\n         </caption>\n         <tr><td > Cell A</td></tr>\n       \
    \  <tr><td > Cell B</td></tr>\n      </table>\n      <br />\n      <table style=\"\
    width:400px; border:1px solid black;\">\n         <caption class=\"right\">\n\
    \         The caption appears at the right\n         </caption>\n         <tr><td\
    \ > Cell A</td></tr>\n         <tr><td > Cell B</td></tr>\n      </table>\n  \
    \ </body>\n</html>\n```\n\n## `Empty-Cells`\n\nThis property is used to indicate\
    \ if an empty cell should have a border or not. It can have one of these three\
    \ value – `hide`, `show`, `inherit`. This example shows the property being used\
    \ to hide the borders of the empty cells in the `<table>` element:\n\n```html\n\
    <html>\n   <head>\n      <style type=\"text/css\">\n         table.empty{\n  \
    \          width:350px;\n            border-collapse:separate;\n            empty-cells:hide;\n\
    \         }\n         td.empty{\n            padding:5px;\n            border-style:solid;\n\
    \            border-width:1px;\n            border-color:#999999;\n         }\n\
    \      </style>\n   </head>\n   <body>\n      <table class=\"empty\">\n      <tr>\n\
    \         <th></th>\n         <th>Title one</th>\n         <th>Title two</th>\n\
    \      </tr>\n      <tr>\n         <th>Row Title</th>\n         <td class=\"empty\"\
    >value</td>\n         <td class=\"empty\">value</td>\n      </tr>\n      <tr>\n\
    \         <th>Row Title</th>\n         <td class=\"empty\">value</td>\n      \
    \   <td class=\"empty\"></td>\n      </tr>\n      </table>\n   </body>\n</html>\n\
    ```\n\n## `Table-Layout`\n\nThis property is meant to help you control how the\
    \ browser lays out or renders a table. It can have one of these three value –\
    \ `inherit`, `auto` or `fixed`. The next example shows the\n\n```html\n<html>\n\
    \   <head>\n      <style type=\"text/css\">\n         table.auto {\n         \
    \   table-layout: auto\n         }\n         table.fixed{\n            table-layout:\
    \ fixed\n         }\n      </style>\n   </head>\n   <body>\n      <table class=\"\
    auto\" border=\"1\" width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
    \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
    \      </tr>\n      </table>\n      <br />\n      <table class=\"fixed\" border=\"\
    1\" width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
    \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
    \      </tr>\n      </table>\n   </body>\n</html>\n```\n\n# Chapter 12: Borders\n\
    \nBorder properties allow you to say what the border of an element box should\
    \ look like. The following are the three properties that you can control\n\n*\
    \   `Border-color` – allows you to specify the color of the border\n*   `Border-style`\
    \ – allows you to specify the style from a choice of values, including a solid\
    \ line, dashed line, double line, etc.\n*   `Border-width` – allows you to specify\
    \ the width of the border\n\n### `Border-Color`\n\nThis property lets you change\
    \ the color of a border surrounding an element. You can change each side of the\
    \ border individually using these properties:\n\n*   `Border-bottom-color`\n*\
    \   `Border-top-color`\n*   `Border-left-color`\n*   `Border-right-color`\n\n\
    This example shows all four properties in use:\n\n```html\n<html>\n   <head>\n\
    \      <style type=\"text/css\">\n         p.example1{\n            border:1px\
    \ solid;\n            border-bottom-color:#009900; /* Green */\n            border-top-color:#FF0000;\
    \    /* Red */\n            border-left-color:#330000;   /* Black */\n       \
    \     border-right-color:#0000CC;  /* Blue */\n         }\n         p.example2{\n\
    \            border:1px solid;\n            border-color:#009900;        /* Green\
    \ */\n         }\n      </style>\n   </head>\n   <body>\n      <p class=\"example1\"\
    >\n      The example shows all borders in different colors.\n      </p>\n    \
    \  <p class=\"example2\">\n      The example shows all borders in green only.\n\
    \      </p>\n   </body>\n</html>\n```\n"
