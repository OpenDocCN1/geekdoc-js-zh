  trans: "\n结果将是\n\n此示例展示了所有边框以不同颜色显示。\n\n此示例展示了所有边框仅以绿色显示。\n\n## 边框样式（Border-style）\n\
    \n此属性允许你选择以下样式之一：\n\n*   None（无） – 完全没有边框\n*   Solid（实线） – 边框为实线\n*   Dotted（点线）\
    \ – 边框由点组成\n*   Dashed（虚线） – 边框由短线段组成\n*   Double（双线） – 两条实线\n*   Groove（凹槽） –\
    \ 使边框看起来像刻入页面\n*   Ridge（脊状） – 与凹槽效果相反\n*   Inset（内嵌） – 盒子看起来嵌入页面\n*   Outset（外凸）\
    \ – 盒子看起来从页面凸出\n*   Hidden（隐藏） – 与 None 完全相同，但针对表格元素的边框冲突解决有例外\n\n与颜色一样，你可以使用以下属性单独更改边框每一侧的样式：\n\
    \n*   `Border-bottom-style`\n*   `Border-top-style`\n*   `Border-left-style`\n\
    *   `Border-right-style`\n\n此示例使用了所有这四种样式：\n\n```html\n<html>\n\n   <head>\n\n\
    \   </head>\n\n   <body>.\n\n      <p style=\"border-width:4px; border-style:none;\"\
    >\n\n      This is a border with a width of none.\n\n      </p>\n\n      <p style=\"\
    border-width:4px; border-style:solid;\">\n\n      This is a solid border.\n\n\
    \      </p>\n\n      <p style=\"border-width:4px; border-style:dashed;\">\n\n\
    \      This is a dashed border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
    \ border-style:double;\">\n\n      This is a double border.\n\n      </p>\n\n\
    \      <p style=\"border-width:4px; border-style:groove;\">\n\n      This is a\
    \ groove border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:ridge\"\
    >\n\n      This is a ridge border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
    \ border-style:inset;\">\n\n      This is an inset border.\n\n      </p>\n\n \
    \     <p style=\"border-width:4px; border-style:outset;\">\n\n      This is an\
    \ outset border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:hidden;\"\
    >\n\n      This is a hidden border.\n\n      </p>\n\n      <p style=\"border-width:4px;border-top-style:solid;\n\
    \n      border-bottom-style:dashed; border-left-style:groove; border-right-style:double;\"\
    >\n\n      This is a border with four different styles.\n\n      </p>\n\n   </body>\n\
    \n</html>\n```\n\n结果将是 -\n\n这是一个宽度为 none 的边框。\n\n这是一个实线边框。\n\n这是一个虚线边框。\n\n这是一个双线边框。\n\
    \n这是一个凹槽边框。\n\n这是一个脊状边框。\n\n这是一个内嵌边框。\n\n这是一个外凸边框。\n\n这是一个隐藏边框。\n\n这是一个具有四种不同样式的边框。\n\
    \n## 边框宽度（Border-Width）\n\n这允许你设置边框的宽度，使用 pt、px 或 cm 的长度值，或者你可以将其设置为 thick（粗）、medium（中）或\
    \ thin（细）。你可以使用以下属性单独更改边框的每一侧：\n\n*   `border-bottom-width`\n*   `border-top-width`\n\
    *   `border-left-width`\n*   `border-right-width`\n\n此示例使用了所有这些属性：\n\n```html\n\
    <html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"border-width:4px;\
    \ border-style:solid;\">\n\n      This is a solid border with a width of 4px.\n\
    \n      </p>\n\n      <p style=\"border-width:4pt; border-style:solid;\">\n\n\
    \      This is a solid border whose width is 4pt.\n\n      </p>\n\n      <p style=\"\
    border-width:thin; border-style:solid;\">\n\n      This is a solid border whose\
    \ width is thin.\n\n      </p>\n\n      <p style=\"border-width:medium; border-style:solid;\"\
    >\n\n      This is a solid border whose width is medium;\n\n      </p>\n\n   \
    \   <p style=\"border-width:thick; border-style:solid;\">\n\n      This is a solid\
    \ border whose width is thick.\n\n      </p>\n\n      <p style=\"border-bottom-width:4px;border-top-width:10px;\n\
    \n      border-left-width: 2px;border-right-width:15px;border-style:solid;\">\n\
    \n      This is a border with four different widths.\n\n      </p>\n\n   </body>\n\
    \n</html>\n```\n\n结果将是：\n\n这是一个宽度为 4px 的实线边框。\n\n这是一个宽度为 4pt 的实线边框。\n\n这是一个宽度为\
    \ thin（细）的实线边框。\n\n这是一个宽度为 medium（中）的实线边框；\n\n这是一个宽度为 thick（粗）的实线边框。\n\n这是一个具有四种不同宽度的边框。\n\
    \n## 边框简写属性（Shorthand Border Properties）\n\n使用简写边框属性，你可以仅用一个属性而不是三个来指定线条的样式、颜色和宽度。以下示例使用\
    \ border 属性将三者合并，你会发现这是为元素设置边框最常用的方法：\n\n```html\n<html>\n\n   <head>\n\n   </head>\n\
    \n   <body>\n\n      <p style=\"border:4px solid red;\">\n\nAnother example:\n\
    \n      </p>\n\n   </body>\n\n</html>\n```\n\n# 第 13 章：边距（Margins）\n\n最后一章讨论 margin\
    \ 属性，即 HTML 元素周围的空间。Margin 属性值不会被子元素继承，并且你也可以使用负值来重叠内容。\n\n请记住——相邻的垂直边距（即上边距和下边距）会相互折叠，因此每个块之间的距离**不是**边距之和；而是取较大的边距，如果两者大小相同，则等于其中一个边距。\n\
    \n可以使用以下属性：\n\n*   `Margin` – 指定在一个声明中设置所有边距属性的简写\n*   `Margin-bottom` – 指定下边距\n\
    *   `Margin-top` – 指定上边距\n*   `Margin-left` – 指定左边距\n*   `Margin-right` – 指定右边距\n\
    \n现在我们将看看这些属性是如何使用的。\n\n### 边距属性（Margin Property）\n\n这是一个简写属性，允许你通过单个声明设置所有四个边距的属性。以下示例展示了如何为段落设置边距：\n\
    \n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"\
    margin: 15px; border:1px solid black;\">\n\n      all four margins will be 15px\n\
    \n      </p>\n\n      <p style=\"margin:10px 2%; border:1px solid black;\">\n\n\
    \      top and bottom margin will be 10px, left and right margin will be 2% of\
    \ the total width of the document.\n\n      </p>\n\n      <p style=\"margin: 10px\
    \ 2% -10px; border:1px solid black;\">\n\n      top margin will be 10px, left\
    \ and right margin will be 2% of the total width of the document, bottom margin\
    \ will be -10px\n\n      </p>\n\n      <p style=\"margin: 10px 2% -10px auto;\
    \ border:1px solid black;\">\n\n      top margin will be 10px, right margin will\
    \ be 2% of the total width of the document, bottom margin will be -10px, left\
    \ margin will be set by the browser\n\n      </p>\n\n   </body>\n\n</html>\n```\n\
    \n你将看到以下结果 -\n\n所有四个边距均为 15px\n\n上边距和下边距为 10px，左边距和右边距为文档总宽度的 2%。\n\n上边距为 10px，左边距和右边距为文档总宽度的\
    \ 2%，下边距为 -10px\n\n上边距为 10px，右边距为文档总宽度的 2%，下边距为 -10px，左边距由浏览器设置\n\n### 下边距（Margin-Bottom）\n\
    \n这允许你使用 auto、长度或百分比值设置下边距：\n\n```html\n<html>\n\n   <head>\n\n   </head>\n\n\
    \   <body>\n\n      <p style=\"margin-bottom: 15px; border:1px solid black;\"\
    >\n\n      This is a paragraph with a specified bottom margin.\n\n      </p>\n\
    \n      <p style=\"margin-bottom: 5%; border:1px solid black;\">\n\n      This\
    \ is another paragraph with a specified bottom margin in percent\n\n      </p>\n\
    \n   </body>\n\n</html>\n```\n\n结果将是 -\n\n这是一个指定了下边距的段落。\n\n这是另一个以百分比指定了下边距的段落。\n\
    \n### 上边距（Margin-Top）\n\n这允许你指定上边距，并使用 auto、长度或百分比值：\n\n```html\n<html>\n\n  \
    \ <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"margin-top: 15px; border:1px\
    \ solid black;\">\n\n      This is a paragraph with a specified top margin\n\n\
    \      </p>\n\n      <p style=\"margin-top: 5%; border:1px solid black;\">\n\n\
    \      This is another paragraph with a specified top margin in percent\n\n  \
    \    </p>\n\n   </body>\n\n</html>\n```\n\n结果如下 -\n\n这是一个指定了上边距的段落。\n\n"
