- fmt: "\nIn this example, the `table` is a selector and `border` is a property. It\
    \ has been given a value of `1px solid #C00`.\n\nSelectors can be defined in a\
    \ number of ways so let’s look at each different one:\n\n## Type Selectors\n\n\
    You saw an example of the Type selector above but let’s have a look at another\
    \ - a way of adding a color to all of the level 1 headings:\n\n```css\nh1 {\n\
    \    color: #36CFFF;\n}\n```\n\n## Universal Selectors\n\nInstead of selecting\
    \ the elements that relate to a specific type, this selector just matches the\
    \ names of the element types. For example:\n\n```css\n* {\n    color: #000000;\n\
    }\n```\n\nIn this example, the content of all the elements has been turned to\
    \ black.\n\n## Descendant Selectors\n\nLet’s say you want to give a particular\
    \ element a style but only when it is inside a specific element. In the following\
    \ example, we are applying the style rule to the `<em>` element but only when\
    \ it is outside of the `<ul>` tag:\n\n```css\nul em {\n    color: #000000;\n}\n\
    ```\n\n## Class Selectors\n\nClass selectors allow you to use the `class` attribute\
    \ of the elements to define your style rules. All of the elements of that particular\
    \ class are formatted as per the defined rule:\n\n```css\n.black {\n    color:\
    \ #000000;\n}\n```\n\nIn this example, the rule has turned the content of all\
    \ the elements with the `class` attribute of `black` to the color black. You could\
    \ go one step further if you like:\n\n```css\nh1.black {\n    color: #000000;\n\
    }\n```\n\nNow you have specified that only the content inside the `<h1>` element\
    \ with a `class` attribute of `black` will be turned to black.\n\nYou are not\
    \ limited to just one class selector for an element though. Look at this example:\n\
    \n```html\n<p class=\"center bold\">\nThe style of this paragraph is defined by\
    \ the classes Bold and Center\n</p>\n```\n\n## ID Selectors\n\nStyle rules can\
    \ be defined on the `id` attribute of an element and, when a rule is defined,\
    \ it will format all elements with the specified `id` attribute:\n\n```css\n#black\
    \ {\n    color: #000000;\n}\n```\n\nThis rule will turn the content of all elements\
    \ that has the `id` attribute to black. You can be a bit more specific if you\
    \ like, for example:\n\n```css\nh1#black {\n    color: #000000;\n}\n```\n\nThis\
    \ rule turns the content for `<h1>` elements to black ONLY if the `id` attribute\
    \ is set to `black`.\n\nThe real power of an id selector become known when they\
    \ are used as foundations for the descendant selector, for example:\n\n```css\n\
    #black h2 {\n    color: #000000;\n}\n```\n\nHere, you can see that all of the\
    \ level 2 headings will be turned to black only when they lie inside a tag that\
    \ has the `id` attribute set as `black`.\n\n## Child Selectors\n\nThe child selector\
    \ is similar to the descendant selector but with different functionality. Look\
    \ at this example:\n\n```css\nbody > p {\n    color: #000000;\n}\n```\n\nThis\
    \ will turn the paragraphs to black only if they are the direct child of the `<body>`\
    \ element. Other paragraphs that are inside other elements, like `<td>` or `<div>`\
    \ would not change.\n\n## Attribute Selectors\n\nStyles can also be applied to\
    \ HTML element that have specific attributes. Look at the example below; you can\
    \ see that the style rule is going to match all the `input` elements that have\
    \ a `type` attribute with a `text` value:\n\n```css\ninput[type=\"text\"] {\n\
    \    color: #000000;\n}\n```\n\nThe advantage to using this method is that `<input\
    \ type=\"submit\" />` is not affected and the color change only applied to certain\
    \ text fields.\n\nThe following rules are for the attribute selector:\n\n*   `p[lang]`\
    \ - this selects all of the paragraph elements that have a `lang` attribute\n\
    *   `p[lang=\"fr\"]` – this selects all the paragraph elements with `lang` attributes\
    \ that have an exact value of `\"fr\"`\n*   `p[lang~=\"fr\"]` – this selects all\
    \ the paragraph elements that have a `lang` attribute containing `\"fr\"`\n* \
    \  `p[lang|=\"en\"]` – this selects all the paragraph elements with a `lang` attribute\
    \ containing exact values of `\"en\"` or that start with `\"en-\"`.\n\n## Multiple\
    \ Style Rules\n\nMultiple style rules can be defined for one single element and\
    \ these should be defined to combine a number of properties and their corresponding\
    \ value into one block, as in this example:\n\n```css\nh1 {\n    color: #36C;\n\
    \    font-weight: normal;\n    letter-spacing: .4em;\n    margin-bottom: 1em;\n\
    \    text-transform: lowercase;\n}\n```\n\nIn this example, you can see that the\
    \ pairs of properties and their value are each separated by a semi-colon (`;`).\
    \ They can stay in one single line or you can spread them over multiple lines\
    \ but, to read them better, we have kept them on single lines.\n\n## Grouping\
    \ Selectors\n\nStyles can be applied to multiple selectors. You just have to remember\
    \ to separate each with a comma, as shown in this example:\n\n```css\nh1, h2,\
    \ h3 {\n    color: #36C;\n    font-weight: normal;\n    letter-spacing: .4em;\n\
    \    margin-bottom: 1em;\n    text-transform: lowercase;\n}\n```\n\nThis style\
    \ rule will apply to all of the `h1`, `h2` and `h3` elements as well. The order\
    \ in the list is not relevant because all of the elements in the selector are\
    \ going to have the declarations applied to them. As you can see from the example\
    \ below, various class selectors can be combined:\n\n```css\n#content, #footer,\
    \ #supplement {\n    position: absolute;\n    left: 510px;\n    width: 200px;\n\
    }\n```\n\n# Chapter 3: Inclusion\n\nYou have four ways of associating styles with\
    \ HTML documents, the most common of which is the inline CSS and the External\
    \ CSS methods.\n\n## Embedded CSS\n\nCSS rules can be put into an HTML document\
    \ with the use of the `<style>` element. The tag goes inside the `<head>…</head?`\
    \ tag and the rules that are defined with this syntax are applicable to all of\
    \ the available elements. The following example shows an embedded CSS style element:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n   <head>\n      <style type=\"text/css\"\
    \ media=\"all\">\n         body {\n            background-color: linen;\n    \
    \     }\n         h1 {\n            color: maroon;\n            margin-left: 40px;\n\
    \         }\n      </style>\n   </head>   \n   <body>\n      <h1>This is a heading</h1>\n\
    \      <p>This is a paragraph.</p>\n   </body>\n</html>\n```\n\n### Attributes\n\
    \nThe attributes commonly associated with the `<style>` elements are shown in\
    \ the following table:\n\n| Attribute | Value | Description |\n| --- | --- | ---\
    \ |\n| `type` | `text/css` | This attribute specifies the language for the style\
    \ sheet as an MIME content type and is a required attribute |\n| `media` | `screen`\
    \ `tty` `tv` `projection` `handheld` `print` `braille` `aural` `all` | This specifies\
    \ which device the document is going to be displayed on. The default value is\
    \ `all` and this is classed as an optional attribute |\n\n## Inline CSS\n\nYou\
    \ can also use the `style` attributes from any HTML elements to define the rules.\
    \ These specific rules will only be applied to that particular element. The generic\
    \ syntax is:\n\n```html\n<element style=\"...style rules....\">\n```\n\n### Attributes\n\
    \nThe value of a `style` attribute is a mixture of different style declarations,\
    \ each separated by semi colons. The following example is based on the generic\
    \ syntax:\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <h1 style=\"\
    color:#36C;\"> This is inline CSS </h1>\n   </body>\n</html>\n```\n\n## External\
    \ CSS - The `<link>` Element\n\nYou can use the `<link>` element as a way of including\
    \ an external stylesheet in the HTML document. External stylesheets are separate\
    \ text files that have a `.css` extension. You will define all of your style rules\
    \ in this file and this can then be added to any HTML document by using the `<link>`\
    \ element. The generic syntax is:\n\n```html\n<head>\n   <link type=\"text/css\"\
    \ href=\"...\" media=\"...\" />\n</head>\n```\n\n### Attributes\n\nThe attributes\
    \ that are associated with the `<style>` elements are as follows:\n\n| Attribute\
    \ | Value | Description |\n| --- | --- | --- |\n| `type` | `text/css` | This specifies\
    \ the language for the style sheet as a MIME content type and is a required attribute\
    \ |\n| `href` | `URL` | This specifies that the style sheet has style rules and\
    \ is also a required attribute |\n| `media` | `screen` `tty` `tv` `projection`\
    \ `handheld` `print` `braille` `aural` `all` | This specifies which devices the\
    \ document can be displayed on and is an optional attribute. The default value\
    \ is `all` |\n\nAs an example, consider a style sheet called `mystyle.css` with\
    \ these rules:\n"
