    | FFCC00 | FFCC33 | FFCC66 | FFCC99 | FFCCCC | FFCCFF |\n| FFFF00 | FFFF33 | FFFF66\
    \ | FFFF99 | FFFFCC | FFFFFF |\n\n# Chapter 6: Background\n\nIn this chapter,\
    \ we are going to look at setting backgrounds for different HTML elements. The\
    \ following properties can be set:\n\n*   `background-color` - to set the background\
    \ color of the element\n*   `background-image` - to set the background image of\
    \ the element\n*   `background-repeat` – to control background image repetition\n\
    *   `background-position` – to control where a background image is positioned\n\
    *   `background-attachment` – to control how a background image scrolls\n*   `background`\
    \ – used as a shorthand method of specifying various background properties\n\n\
    ## Setting the Background Color\n\nThe following example shows you how to set\
    \ background color on an element:\n\n```html\n<html>\n   <head>\n   <body>\n \
    \     <p style = \"background-color:yellow;\">\n      This text has a yellow background\
    \ color.</p>\n   </body>\n   </head>\n<html>\n```\n\nYou will see the following\
    \ on your screen:\n\nThe text has a yellow background color.\n\n## How to Set\
    \ the Background Image\n\nThe following example shows how to call a local stored\
    \ image to set the background:\n\n```html\n<html>\n   <head>\n      <style>\n\
    \         body  {\n            background-image: url(\"/css/images/css.jpg\");\n\
    \            background-color: #cccccc;\n         }\n      </style>\n      <body>\n\
    \         <h1>Hello World!</h1>\n      </body>\n   </head>\n<html>\n```\n\nYou\
    \ will now see “Hello, World!” appear on the specified background\n\n## How to\
    \ Repeat the Background Image\n\nThe following is an example of how to repeat\
    \ a small background image. The `no-repeat` value can be used for the `background-repeat`\
    \ property if the image is NOT to be repeated and is only to be displayed once.\
    \ By default, the value of `background-repeat` is set to `repeat`:\n\n```html\n\
    <html>\n   <head>\n      <style>\n         body {\n            background-image:\
    \ url(\"/css/images/css.jpg\");\n            background-repeat: repeat;\n    \
    \     }\n      </style>\n   </head>\n   <body>\n      <p>Tutorials point</p>\n\
    \   </body>\n</html>\n```\n\nThe background that we used in the last example will\
    \ now be shown repeated. In the following example, we can see how to repeat an\
    \ image vertically:\n\n```html\n<html>\n   <head>\n      <style>\n         body\
    \ {\n            background-image: url(\"/css/images/css.jpg\");\n           \
    \ background-repeat: repeat-y;\n         }\n      </style>\n   </head>\n   <body>\n\
    \      <p>Tutorials point</>\n   </body>\n</html>\n```\n\nThe chosen background\
    \ image will be repeated vertically.\n\nIn the next example, we look at horizontal\
    \ repetition:\n\n```html\n<html>\n   <head>\n      <style>\n         body {\n\
    \            background-image: url(\"/css/images/css.jpg\");\n            background-repeat:\
    \ repeat-x;\n         }\n </style>\n   </head>\n   <body>\n      <p>Tutorials\
    \ point</>\n   </body>\n</html>\n```\n\nThe chosen background image will be repeated\
    \ horizontally\n\n## How to Set the Position of the Background Image\n\nThis example\
    \ shows you how to set the image in a position that is 100 pixels in from the\
    \ left hand side:\n\n```html\n<html>\n   <head>\n      <style>\n         body\
    \ {\n            background-image: url(\"/css/images/css.jpg\");\n           \
    \ background-position:100px;\n         }\n      </style>\n   </head>\n   <body>\n\
    \      <p>Tutorials point</>\n   </body>\n</html>\n```\n\nThe background image\
    \ will be placed in the specified position\n\nNow we look at how to set the image\
    \ 100 pixels in from the left and 200 pixels from the top:\n\n```html\n<html>\n\
    \   <head>\n      <style>\n         body {\n            background-image: url(\"\
    /css/images/css.jpg\");\n            background-position:100px 200px;\n      \
    \   }\n </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n   </body>\n\
    </html>\n```\n\nThe background image will be placed in the specified positon\n\
    \n## How to Set the Background Attachment\n\nThis determines if an image is to\
    \ be fixed or if it should scroll when the page is scrolled. First, we look at\
    \ a fixed image:\n\n```html\n<!DOCTYPE html>\n<html>\n   <head>\n      <style>\n\
    \         body  {\n            background-image: url('/css/images/css.jpg');\n\
    \            background-repeat: no-repeat;\n            background-attachment:\
    \ fixed;\n         }\n      </style>\n   </head>\n   <body>\n      <p>The background-image\
    \ is fixed. Try scrolling down the page.</p>\n      <p>The background-image is\
    \ fixed. Try scrolling down the page.</p>\n      <p>The background-image is fixed.\
    \ Try scrolling down the page.</p>\n      <p>The background-image is fixed. Try\
    \ scrolling down the page.</p>\n      <p>The background-image is fixed. Try scrolling\
    \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
    \ the page.</p>\n      <p>The background-image is fixed. Try scrolling down the\
    \ page.</p>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
    \      <p>The background-image is fixed. Try scrolling down the page.</p>\n  \
    \ </body>\n</html>\n```\n\nYou will see this line repeated however many times\
    \ it is in the code:\n\nThe background-image is fixed. Try scrolling down the\
    \ page.\n\nFollowed by this:\n\nIf you do not see any scrollbars, try to resize\
    \ the browser window.\n\nNext, we look at setting a scrolling background:\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n   <head>\n      <style>\n         body  {\n\
    \            background-image: url('/css/images/css.jpg');\n            background-repeat:\
    \ no-repeat;\n            background-attachment: fixed;\n            background-attachment:scroll;\n\
    \         }.\n      </style>\n   </head>\n   <body>\n      <p>The background-image\
    \ is fixed. Try scrolling down the page.</p>\n      <p>The background-image is\
    \ fixed. Try scrolling down the page.</p>\n      <p>The background-image is fixed.\
    \ Try scrolling down the page.</p>\n      <p>The background-image is fixed. Try\
    \ scrolling down the page.</p>\n      <p>The background-image is fixed. Try scrolling\
    \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
    \ the page.</p>\n      <p>The background-image is fixed. Try scrolling down the\
    \ page.</p>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
    \      <p>The background-image is fixed. Try scrolling down the page.</p>\n  \
    \ </body>\n</html>\n```\n\nAgain, you will see this message repeated on a scrolling\
    \ background\n\nThe background-image is fixed. Try scrolling down the page.\n\n\
    Followed by this:\n\nIf you do not see any scrollbars, try to resize the browser\
    \ window.\n\n## How to use the Shorthand Property\n\nThe final example shows how\
    \ to set all of the background properties at the same time by using the shorthand\
    \ `background` property:\n\n```html\n<p style=\"background:url(/images/pattern1.gif)\
    \ repeat fixed;\">\n   This paragraph has a fixed background image that will be\
    \ repeated.\n</p>\n```\n\n# Chapter 7: Fonts\n\nNow we are going to look at how\
    \ to set up the fonts. The following are the font properties that you can set\
    \ for an element:\n\n*   `font-family` - is used to change the font face\n*  \
    \ `font-style` - is used to turn a font oblique or italic\n*   `font-weight` –\
    \ is used to increase or decrease the boldness or lightness of a font\n*   `font-variant`\
    \ – used to give the font a small caps effect\n*   `font-size` – is used to make\
    \ a font bigger or smaller\n"
