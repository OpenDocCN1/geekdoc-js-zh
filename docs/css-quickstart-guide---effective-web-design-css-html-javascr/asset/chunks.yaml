    \ | `rgb(rrr,ggg,bbb)` | `p{color:rgb(0,0,255);}` |\n| 关键字 | `aqua, black, 等`\
    \ | `p{color:teal;}` |\n\n让我们更详细地了解这些格式：\n\n## 十六进制代码\n\n十六进制是 6 位颜色表示。第一位 `RR`\
    \ 表示红色值，`GG` 表示绿色值，`BB` 表示蓝色值。\n\n这些值可以从图形软件（如 JASC Paintshop Pro、Adobe Photoshop、Advanced\
    \ Paintbrush 等）中获取。每个十六进制代码前面都有一个 # 或 £ 符号，以下是十六进制表示法的示例：\n\n| 颜色 | 颜色十六进制 |\n\
    | --- | --- |\n|  | `#000000` |\n|  | `#FF0000` |\n|  | `#00FF00` |\n|  | `#0000FF`\
    \ |\n|  | `#FFFF00` |\n|  | `#00FFFF` |\n|  | `#FF00FF` |\n|  | `#C0C0C0` |\n\
    |  | `#FFFFFF` |\n\n## 短十六进制代码\n\n这只是十六进制代码的较短版本，每个数字会被复制，从而得到等效的 6 位值。这些值也可以从图形软件中获取，并且前面也有\
    \ # 或 £ 符号：\n\n| 颜色 | 颜色十六进制 |\n| --- | --- |\n|  | `#000` |\n|  | `#F00` |\n\
    |  | `#0F0` |\n|  | `#0FF` |\n|  | `#FF0` |\n|  | `#0FF` |\n|  | `#F0F` |\n| \
    \ | `#FFF` |\n\n## RGB 值\n\n我们使用 `rgb()` 属性来指定此值，该属性接受三个值——红色、绿色和蓝色。值可以是百分比或 0\
    \ 到 255 之间的整数。请注意，并非所有浏览器都支持 `rgb()`，因此尽量少用。\n\n| 颜色 | 颜色 RGB |\n| --- | --- |\n\
    |  | `rgb(0,0,0)` |\n|  | `rgb(255,0,0)` |\n|  | `rgb(0,255,0)` |\n|  | `rgb(0,0,255)`\
    \ |\n|  | `rgb(255,255,0)` |\n|  | `rgb(0,255,255)` |\n|  | `rgb(255,0,255)` |\n\
    |  | `rgb(192,192,192)` |\n|  | `rgb(255,255,255)` |\n\n## 构建颜色代码\n\n如果你使用 CSS\
    \ 颜色代码生成器，你可以构建数百万种不同的颜色代码，但你需要一个支持 Java 的浏览器才能做到这一点。\n\n## 浏览器安全颜色\n\n下表显示了 216\
    \ 种被认为是安全且与计算机无关的颜色。它们从十六进制代码 `000000` 到 `FFFFFF`，之所以安全，是因为所有计算机都能在 256 色调色板上正确显示这些颜色：\n\
    \n| | | | | | |\n|---|---|---|---|---|---|\n| `000000` | `000033` | `000066` |\
    \ `000099` | `0000CC` | `0000FF` |\n| `003300` | `003333` | `003366` | `003399`\
