    \ 5.9vw; }` |\n| vmin | 1vw 或 1vh 中的较小值 | `p { font-size: 2vmin;}` |\n\n# 第 5\
    \ 章：颜色\n\n在 CSS 中，我们使用值来指定颜色。通常，这些值用于设置元素文本的颜色（即前景色）或元素的背景色。我们也可以使用它们来改变装饰效果（如边框）的颜色。\n\
