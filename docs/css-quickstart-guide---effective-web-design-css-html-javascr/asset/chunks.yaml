  trans: "\n*   `Empty-cells` – 指定是否应在空单元格上显示边框\n*   `Table-layout` – 允许浏览器通过使用它为列找到的第一个宽度属性来加速表格布局，而无需加载表格后再渲染\n\
    \n接下来我们通过示例来了解这些属性。\n\n## `Border-Collapse`\n\n该属性可以有两个值 – `collapse` 和 `separate`。以下示例同时使用了这两个值：\n\
    \n```html\n<html>\n   <head>\n      <style type=\"text/css\">\n         table.one\
    \ {border-collapse:collapse;}\n         table.two {border-collapse:separate;}\n\
    \         td.a {\n            border-style:dotted;\n            border-width:3px;\n\
    \            border-color:#000000;\n            padding: 10px;\n         }\n \
    \        td.b {\n            border-style:solid;\n            border-width:3px;\n\
    \            border-color:#333333;\n            padding:10px;\n         }\n  \
    \    </style>\n   </head>\n   <body>\n      <table class=\"one\">\n         <caption>折叠边框示例</caption>\n\
    \         <tr><td class=\"a1 Cell 1 Collapse Example</td></tr>\n         <tr><td\
    \ class=\"2\"> Cell 2 Collapse Example</td></tr>\n      </table>\n      <br />\n\
    \      <table class=\"two\">\n         <caption>分离边框示例</caption>\n         <tr><td\
    \ class=\"1\"> Cell 1 Separate Example</td></tr>\n         <tr><td class=\"2\"\
    > Cell 2 Separate Example</td></tr>\n      </table>\n   </body>\n</html>\n```\n\
    \n这将产生以下结果：\n\n| 折叠边框： |\n| 单元格 1 折叠示例 |\n| 单元格 2 折叠示例 |\n| 分离边框： |\n| 单元格 1 分离示例\
    \ |\n| 单元格 2 分离示例 |\n\n## `Border-Spacing`\n\n该属性指定两个相邻单元格边框之间的距离。它可以接受两个值中的任意一个，每个值都应为长度单位。一个值适用于水平和垂直边框，而使用两个值则分别表示垂直和水平间距。\n\
    \n```css\n<style type=\"text/css\">\n   /* 如果提供一个值 */\n   table.example {border-spacing:10px;}\n\
    \   /* 这是提供两个值的方法 */\n   table.example {border-spacing:10px; 15px;}\n</style>\n\
    ```\n\n下一个示例修改了第一个示例：\n\n```html\n<html>\n   <head>\n      <style type=\"text/css\"\
    >\n         table.one {\n            border-collapse:separate;\n            width:400px;\n\
    \            border-spacing:10px;\n         }\n         table.two {\n        \
    \    border-collapse:separate;\n            width:400px;\n            border-spacing:10px\
    \ 50px;\n         }\n      </style>\n   </head>\n   <body>\n      <table class=\"\
    one\" border=\"1\">\n         <caption>带边框间距的分离边框示例</caption>\n         <tr><td>\
    \ 单元格 A 折叠示例</td></tr>\n         <tr><td> 单元格 B 折叠示例</td></tr>\n      </table>\n\
    \      <br />\n      <table class=\"two\" border=\"1\">\n         <caption>带边框间距的分离边框示例</caption>\n\
    \         <tr><td> 单元格 A 分离示例</td></tr>\n         <tr><td> 单元格 B 分离示例</td></tr>\n\
    \      </table>\n   </body>\n</html>\n```\n\n## `Caption-Side` 属性\n\n该属性允许你指定\
    \ `<caption>` 元素内容相对于表格的位置。它可以接受以下四个值 – `top`、`left`、`bottom`、`right`。以下示例使用了所有四个值：\n\
    \n```html\n<html>\n   <head>\n      <style type=\"text/css\">\n         caption.top\
    \ {caption-side:top}\n         caption.bottom {caption-side:bottom}\n        \
    \ caption.left {caption-side:left}\n         caption.right {caption-side:right}\n\
    \      </style>\n   </head>\n   <body>\n      <table style=\"width:400px; border:1px\
    \ solid black;\">\n         <caption class=\"top\">\n         此标题将显示在顶部\n    \
    \     </caption>\n         <tr><td > 单元格 A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n\
    \      </table>\n      <br />\n      <table style=\"width:400px; border:1px solid\
    \ black;\">\n         <caption class=\"bottom\">\n         标题显示在底部\n         </caption>\n\
    \         <tr><td > 单元格 A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n    \
    \  </table>\n      <br />\n      <table style=\"width:400px; border:1px solid\
    \ black;\">\n         <caption class=\"left\">\n         标题显示在左侧\n         </caption>\n\
    \         <tr><td > 单元格 A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n    \
    \  </table>\n      <br />\n      <table style=\"width:400px; border:1px solid\
    \ black;\">\n         <caption class=\"right\">\n         标题显示在右侧\n         </caption>\n\
    \         <tr><td > 单元格 A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n    \
    \  </table>\n   </body>\n</html>\n```\n\n## `Empty-Cells`\n\n该属性用于指示空单元格是否应显示边框。它可以取以下三个值之一\
    \ – `hide`、`show`、`inherit`。以下示例展示了如何使用该属性隐藏 `<table>` 元素中空单元格的边框：\n\n```html\n\
    <html>\n   <head>\n      <style type=\"text/css\">\n         table.empty{\n  \
    \          width:350px;\n            border-collapse:separate;\n            empty-cells:hide;\n\
    \         }\n         td.empty{\n            padding:5px;\n            border-style:solid;\n\
    \            border-width:1px;\n            border-color:#999999;\n         }\n\
    \      </style>\n   </head>\n   <body>\n      <table class=\"empty\">\n      <tr>\n\
    \         <th></th>\n         <th>标题一</th>\n         <th>标题二</th>\n      </tr>\n\
    \      <tr>\n         <th>行标题</th>\n         <td class=\"empty\">值</td>\n    \
    \     <td class=\"empty\">值</td>\n      </tr>\n      <tr>\n         <th>行标题</th>\n\
    \         <td class=\"empty\">值</td>\n         <td class=\"empty\"></td>\n   \
    \   </tr>\n      </table>\n   </body>\n</html>\n```\n\n## `Table-Layout`\n\n该属性旨在帮助你控制浏览器如何布局或渲染表格。它可以取以下三个值之一\
    \ – `inherit`、`auto` 或 `fixed`。下一个示例展示了\n\n```html\n<html>\n   <head>\n      <style\
    \ type=\"text/css\">\n         table.auto {\n            table-layout: auto\n\
    \         }\n         table.fixed{\n            table-layout: fixed\n        \
    \ }\n      </style>\n   </head>\n   <body>\n      <table class=\"auto\" border=\"\
    1\" width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
    \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
    \      </tr>\n      </table>\n      <br />\n      <table class=\"fixed\" border=\"\
    1\" width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
    \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
    \      </tr>\n      </table>\n   </body>\n</html>\n```\n\n# 第 12 章：边框\n\n边框属性允许你指定元素框的边框外观。以下是你可以控制的三个属性：\n\
    \n*   `Border-color` – 允许你指定边框的颜色\n*   `Border-style` – 允许你从一系列值中选择样式，包括实线、虚线、双线等\n\
    *   `Border-width` – 允许你指定边框的宽度\n\n### `Border-Color`\n\n该属性允许你更改元素周围边框的颜色。你可以使用以下属性单独更改边框的每一侧：\n\
    \n*   `Border-bottom-color`\n*   `Border-top-color`\n*   `Border-left-color`\n\
    *   `Border-right-color`\n\n以下示例展示了所有四个属性的使用：\n\n```html\n<html>\n   <head>\n\
    \      <style type=\"text/css\">\n         p.example1{\n            border:1px\
    \ solid;\n            border-bottom-color:#009900; /* 绿色 */\n            border-top-color:#FF0000;\
    \    /* 红色 */\n            border-left-color:#330000;   /* 黑色 */\n           \
    \ border-right-color:#0000CC;  /* 蓝色 */\n         }\n         p.example2{\n  \
    \          border:1px solid;\n            border-color:#009900;        /* 绿色 */\n\
    \         }\n      </style>\n   </head>\n   <body>\n      <p class=\"example1\"\
    >\n      此示例展示了所有边框以不同颜色显示。\n      </p>\n      <p class=\"example2\">\n      此示例展示了所有边框仅以绿色显示。\n\
    \      </p>\n   </body>\n</html>\n```\n"
- fmt: "\nThe result will\n\nThis example shows all borders in different colors.\n\
    \nThis example shows all borders in green only.\n\n## Border-style\n\nThis property\
    \ let you select one of these styles:\n\n*   None – has no border at all\n*  \
    \ Solid – gives the border a solid line\n*   Dotted – the border is made of dots\n\
    *   Dashed – the border is made of short lines\n*   Double – this is two solid\
    \ lines\n*   Groove – make the border look like it has been carved into the page\n\
    *   Ridge – does the opposite of groove\n*   Inset – the box looks embedded in\
    \ the page\n*   Outset – the box looks as though it is coming out of the page\n\
    *   Hidden – exactly the same as for None but with the exception of a border-conflict\
    \ resolution for table elements\n\nAs with color, you can change the style of\
    \ each individual side of the border, using these properties:\n\n*   `Border-bottom-style`\n\
    *   `Border-top-style`\n*   `Border-left-style`\n*   `Border-right-style`\n\n\
    This example uses all four of these styles:\n\n```html\n<html>\n\n   <head>\n\n\
    \   </head>\n\n   <body>.\n\n      <p style=\"border-width:4px; border-style:none;\"\
    >\n\n      This is a border with a width of none.\n\n      </p>\n\n      <p style=\"\
    border-width:4px; border-style:solid;\">\n\n      This is a solid border.\n\n\
    \      </p>\n\n      <p style=\"border-width:4px; border-style:dashed;\">\n\n\
    \      This is a dashed border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
    \ border-style:double;\">\n\n      This is a double border.\n\n      </p>\n\n\
    \      <p style=\"border-width:4px; border-style:groove;\">\n\n      This is a\
    \ groove border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:ridge\"\
    >\n\n      This is a ridge border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
    \ border-style:inset;\">\n\n      This is an inset border.\n\n      </p>\n\n \
    \     <p style=\"border-width:4px; border-style:outset;\">\n\n      This is an\
    \ outset border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:hidden;\"\
    >\n\n      This is a hidden border.\n\n      </p>\n\n      <p style=\"border-width:4px;border-top-style:solid;\n\
    \n      border-bottom-style:dashed; border-left-style:groove; border-right-style:double;\"\
    >\n\n      This is a border with four different styles.\n\n      </p>\n\n   </body>\n\
    \n</html>\n```\n\nThe result will be -\n\nThis is a border with none width.\n\n\
    This is a solid border.\n\nThis is a dashed border.\n\nThis is a double border.\n\
    \nThis is a groove border.\n\nThis is a ridge border.\n\nThis is an inset border.\n\
    \nThis is an outset border.\n\nThis is a hidden border.\n\nThis is a border with\
    \ four different styles.\n\n## Border-Width\n\nThis allows you to set the width\
    \ of the border, using a value of length in pt., px or cm or you can set it to\
    \ thick, medium or thin. You can change each side of the border individually,\
    \ using these properties:\n\n*   `border-bottom-width`\n*   `border-top-width`\n\
    *   `border-left-width`\n*   `border-right-width`\n\nThis example use all of these\
    \ properties\n\n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n  \
    \    <p style=\"border-width:4px; border-style:solid;\">\n\n      This is a solid\
    \ border with a width of 4px.\n\n      </p>\n\n      <p style=\"border-width:4pt;\
    \ border-style:solid;\">\n\n      This is a solid border whose width is 4pt.\n\
    \n      </p>\n\n      <p style=\"border-width:thin; border-style:solid;\">\n\n\
    \      This is a solid border whose width is thin.\n\n      </p>\n\n      <p style=\"\
    border-width:medium; border-style:solid;\">\n\n      This is a solid border whose\
    \ width is medium;\n\n      </p>\n\n      <p style=\"border-width:thick; border-style:solid;\"\
    >\n\n      This is a solid border whose width is thick.\n\n      </p>\n\n    \
    \  <p style=\"border-bottom-width:4px;border-top-width:10px;\n\n      border-left-width:\
    \ 2px;border-right-width:15px;border-style:solid;\">\n\n      This is a border\
    \ with four different widths.\n\n      </p>\n\n   </body>\n\n</html>\n```\n\n\
    The result will be:\n\nThis is a solid border whose width is 4px.\n\nThis is a\
    \ solid border whose width is 4pt.\n\nThis is a solid border whose width is thin.\n\
    \nThis is a solid border whose width is medium;\n\nThis is a solid border whose\
    \ width is thick.\n\nThis is a border with four different widths.\n\n## Shorthand\
    \ Border Properties\n\nUsing the shorthand border property, you can specify the\
    \ style, color and width of the lines using just one property instead of three.\
    \ The following example uses the border property to combine all three and you\
    \ will find that this is the most commonly used method of setting a border around\
    \ an element:\n\n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n \
    \     <p style=\"border:4px solid red;\">\n\nAnother example:\n\n      </p>\n\n\
    \   </body>\n\n</html>\n```\n\n# Chapter 13: Margins\n\nThe final chapter deals\
    \ with the margin property, i.e. the space around the HTML element. Martin property\
    \ values are not inherited by child elements and it is also possible that you\
    \ can use negative value as a way of overlapping the content.\n\nRemember – the\
    \ vertical margins that are adjacent to one another (that is the top and bottom\
    \ margins) are going to collapse into each other so that distance between each\
    \ block is NOT the sum of the margins; instead it is the larger of the margins\
    \ or the same as one margin if both are the same size.\n\nThe following properties\
    \ can be used:\n\n*   `Margin` – specifies the shorthand for setting all the margin\
    \ properties in one single declaration\n*   `Margin-bottom` – specifies the bottom\
    \ margin\n*   `Margin-top` – specifies the top margin\n*   `Margin-left` – specifies\
    \ the left margin\n*   `Margin-right` – specifies the right margin\n\nNow we will\
    \ look at how these properties are used.\n\n### Margin Property\n\nThis is a shorthand\
    \ property that lets you set all properties for all four of the margin with a\
    \ single declaration. The following example shows you how to set a margin round\
    \ a paragraph:\n\n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n\
    \      <p style=\"margin: 15px; border:1px solid black;\">\n\n      all four margins\
    \ will be 15px\n\n      </p>\n\n      <p style=\"margin:10px 2%; border:1px solid\
    \ black;\">\n\n      top and bottom margin will be 10px, left and right margin\
    \ will be 2% of the total width of the document.\n\n      </p>\n\n      <p style=\"\
    margin: 10px 2% -10px; border:1px solid black;\">\n\n      top margin will be\
    \ 10px, left and right margin will be 2% of the total width of the document, bottom\
    \ margin will be -10px\n\n      </p>\n\n      <p style=\"margin: 10px 2% -10px\
    \ auto; border:1px solid black;\">\n\n      top margin will be 10px, right margin\
    \ will be 2% of the total width of the document, bottom margin will be -10px,\
    \ left margin will be set by the browser\n\n      </p>\n\n   </body>\n\n</html>\n\
    ```\n\nYou will see the following result -\n\nall four margins will be 15px\n\n\
    top and bottom margin will be 10px, left and right margin will be 2% of the total\
    \ width of the document.\n\ntop margin will be 10px, left and right margin will\
    \ be 2% of the total width of the document, bottom margin will be -10px\n\ntop\
    \ margin will be 10px, right margin will be 2% of the total width of the document,\
    \ bottom margin will be -10px, left margin will be set by the browser\n\n### Margin-Bottom\n\
    \nThis allows you set up the bottom margin using a value of auto, length or %\n\
    \n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"\
