  trans: "\n\n# font – 用于指定各种字体属性的简写属性\n\n## 如何设置字体系列\n\n以下示例展示了如何设置特定元素的字体系列。该值可以是任何字体系列名称：\n\
    \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-family:georgia,garamond,serif;\"\
    >\n      This text will be rendered in georgia, garamond, or the default serif\
    \ font\n      depending on which ones are in your system.\n      </p>\n   </body>\n\
    </html>\n```\n\n它将产生以下结果——\n\n此文本将根据您系统中存在的字体，以 georgia、garamond 或默认衬线字体呈现。\n\n\
    ## 如何设置字体样式\n\n以下示例展示了如何设置元素的样式。值可以是 `italic`、`normal`、`oblique` 等。\n\n```html\n\
    <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-style:italic;\"\
    >\n      This text is rendered in italic style\n      </p>\n   </body>\n</html>\n\
    ```\n\n您将得到以下结果：\n\n此文本以斜体样式呈现。\n\n## 如何设置字体变体\n\n此示例展示了如何设置字体变体，可能的值有 `small-caps`、`normal`\
    \ 等。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-variant:small-caps;\"\
    >\n      The text is going to be rendered as small caps\n      </p>\n   </body>\n\
    </html>\n```\n\n您将得到以下结果：\n\nTHE TEXT IS GOING TO BE RENDERED AS SMALL CAPS\n\n\
    ## 如何设置字体粗细\n\n下一个示例展示了如何设置元素的字体粗细。此属性将指定字体的粗体级别，可能的值包括 – `normal`、`lighter`、`bold`、`bolder`、`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`、`900`\
    \ 等。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-weight:bold;\"\
    >The font is bold.</p>\n      <p style=\"font-weight:bolder;\">The font is bolder.</p>\n\
    \      <p style=\"font-weight:500;\">The font is 500 weight.</p>\n   </body>\n\
    </html>\n```\n\n您将得到以下结果：\n\nThe font is bold.\n\nThe font is bolder.\n\nThe font\
    \ is 500 weight.\n\n## 如何设置字体大小\n\n此示例展示了如何设置元素的字体大小。这用于控制字体大小，可能的值有 – `small`、`x-small`、`xx-small`、`xx-large`、`x-large`、`large`、`smaller`、`larger`、`%`\
    \ 或像素大小：\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
    font-size:20px;\">The font size is 20 pixels</p>\n      <p style=\"font-size:small;\"\
    >The font size is small</p>\n      <p style=\"font-size:large;\">The font size\
    \ is large</p>\n   </body>\n</html>\n```\n\n您将得到以下结果：\n\nThe font size is 20 pixels\n\
    \nThe font size is small\n\nThe font size is large\n\n## 如何设置字体大小调整\n\n此示例将演示如何设置字体大小调整，它允许您更改\
    \ x 高度以使字体更易读。可能的值可以是任何数字：\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n\
    \      <p style=\"font-size-adjust:0.61;\">\n         The text uses a font-size-adjust\
    \ value.\n      </p>\n   </body>\n</html>\n```\n\n您将得到以下结果——\n\nTHE TEXT USES\
    \ A FONT-SIZE-ADJUST VALUE.\n\n## 如何设置字体拉伸\n\n下一个示例展示了如何设置字体拉伸，它依赖于您的计算机是否拥有特定字体的紧缩或扩展版本。值可能为\
    \ – `wider`、`normal`、`narrower`、`extra-condensed`、`ultra-condensed`、`condensed`、`semi-condensed`、`expanded`、`semi-expanded`、`extra-expanded`、`ultra-expanded`：\n\
    \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-stretch:ultra-expanded;\"\
    >\n         If this doesn't look like it works, most likely your computer does\
    \ not have a condensed or expanded version of the font\n      </p>\n   </body>\n\
    </html>\n```\n\n它将产生以下结果——\n\nIf this doesn't look like it works, most likely\
    \ your computer does not have a condensed or expanded version of the font\n\n\
    ## 如何设置简写属性\n\n最后一个示例展示了如何使用 `font` 属性同时设置所有字体属性：\n\n```html\n<html>\n   <head>\n\
    \   </head>\n   <body>\n      <p style=\"font:italic small-caps bold 15px georgia;\"\
    >\n      This will apply all of the properties on the text at the same time.\n\
    \      </p>\n   </body>\n</html>\n```\n\n它将产生以下结果——\n\nTHIS WILL APPLY ALL OF\
    \ THE PROPERTIES ON THE TEXT AT THE SAME TIME.\n\n# 第 8 章：文本\n\n本章将介绍如何通过使用一些\
    \ CSS 属性来操作文本。以下文本属性可用于元素：\n\n* `color` – 用于设置文本的颜色\n* `direction` – 用于设置文本的方向\n\
    * `letter-spacing` – 用于在单词的字母之间添加或删除空格\n* `text-indent` – 用于缩进文本段落的第一行\n* `text-align`\
    \ – 用于对齐整个文档中的文本\n* `text-decoration` – 用于为文本添加装饰，例如 `underline`、`overline` 和\
    \ `strikethrough`\n* `text-transform` – 用于将文本大写或在大小写字母之间转换\n* `white-space` –\
    \ 用于控制文本流和格式\n* `text-shadow` – 用于在文本周围设置阴影\n\n## 如何设置文本颜色\n\n此示例展示了如何设置文本的颜色，使用任何有效格式的任何颜色名称作为值。\n\
    \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"color:red;\"\
    >\n      This text is shown in red.\n      </p>\n   </body>\n</html>\n```\n\n\
    您将看到以下结果——\n\nThis text is shown in red.\n\n## 如何设置文本方向\n\n下一个示例展示了如何设置文本方向，使用\
    \ `ltr` 或 `rtl` 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n  \
    \    <p style=\"direction:rtl;\">\n      This text is going to be rendered from\
    \ right to left\n      </p>\n   </body>\n</html>\n```\n\n您将看到此结果——\n\nThis text\
    \ is going to be rendered from right to left\n\n## 如何设置字符间距\n\n此示例展示了如何设置字符之间的间距，使用\
    \ `normal` 或指定间距的数字作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n\
    \      <p style=\"letter-spacing:5px;\">\n      This text will have spaces between\
    \ letters.\n      </p>\n   </body>\n</html>\n```\n\n您将看到此结果——\n\nThis text will\
    \ have spaces between letters.\n\n## 如何设置单词间距\n\n下一个示例展示了如何设置单词之间的间距，使用 `normal`\
    \ 或指定间距的数字作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p\
    \ style=\"word-spacing:5px;\">\n      This text has spaces between words.\n  \
    \    </p>\n   </body>\n</html>\n```\n\n您将看到以下结果——\n\nThis text has spaces between\
    \ words.\n\n## 如何设置文本缩进\n\n下一个示例展示了如何缩进新段落的第一行，使用指定缩进空间的数字或 `%` 作为值。\n\n```html\n\
    <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"text-indent:1cm;\"\
    >\n      The text has the first line indented by 1cm and it will remain at\n \
    \     this position. This is done using the CSS text-indent property.\n      </p>\n\
    \   </body>\n</html>\n```\n\n您将看到此结果——\n\nThe text has the first line indented\
    \ by 1cm and it will remain at this position. This is done using the CSS text-indent\
    \ property\n\n## 如何设置文本对齐\n\n此示例展示了如何对齐文本，使用 `justify`、`left`、`right` 和 `center`\
    \ 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
    text-align:right;\">\n      The text will be right aligned.\n      </p>\n    \
    \  <p style=\"text-align:center;\">\n      The text will be center aligned.\n\
    \      </p>\n      <p style=\"text-align:left;\">\n      The text will be left\
    \ aligned.\n      </p>\n   </body>\n</html>\n```\n\n您将看到以下结果——\n\nThe text will\
    \ be right aligned.\n\nThe text will be center aligned.\n\nThe text will be left\
    \ aligned.\n\n## 如何装饰文本\n\n现在我们来看一个示例，展示如何装饰文本，使用 `none`、`overline`、`underline`、`blink`\
    \ 和 `strikethrough` 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n\
    \      <p style=\"text-decoration:underline;\">\n```\n\n"
- fmt: "\n# Chapter 9: Using Images\n\nImages are an important part of websites and,\
    \ although you shouldn’t use too many, those you do use should be of good quality\
    \ and in the right place. CSS helps to control the display of these images by\
    \ allowing you to set the following properties:\n\n*   `Border` – this is used\
    \ to set the width of the border on the image\n*   `Height` – this is used to\
    \ set the height of the image\n*   `Width` – this is used to set the width of\
    \ the image\n*   `-moz-opacity` – this used to determine the opacity of the image\n\
    \n## Image Border\n\nThis property is used to set the width of the border on the\
    \ image and can use values of length or `%`. For example:\n\n```\n<html>\n   <head>\n\
    \   </head>\n   <body>\n      <img style=\"border:0px;\" src=\"/css/images/logo.png\"\
    \ />\n      <br />\n      <img style=\"border:3px dashed red;\" src=\"/css/images/logo.png\"\
    \ />\n   </body>\n</html>\n```\n\nThe result will be a logo without a border and\
    \ then a logo with a dotted red border.\n\n## Image Height\n\nThis property is\
    \ used to set how high an image is and can use values of length or `%`. When you\
    \ use `%`, the value is applied to the box which the image is in:\n\n```\n<html>\n\
    \   <head>\n   </head>\n   <body>\n      <img style=\"border:1px solid red; height:100px;\"\
    \ src=\"/css/images/logo.png\" />\n      <br />\n      <img style=\"border:1px\
    \ solid red; height:50%;\" src=\"/css/images/logo.png\" />\n   </body>\n</html>\n\
    ```\n\nThe result will be two logos, exactly the same, but one taller than the\
    \ other.\n\n## Image Width\n\nThis is used to set the width of an image using\
    \ value of `%` or length. As with height, using percentage applies to the box\
    \ the image is in:\n\n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img\
    \ style=\"border:1px solid red; width:150px;\" src=\"/css/images/logo.png\" />\n\
    \      <br />\n      <img style=\"border:1px solid red; width:100%;\" src=\"/css/images/logo.png\"\
    \ />\n   </body>\n</html>\n```\n\nThe result will be two identical logos but of\
    \ different sizes.\n\n## `-moz-opacity`\n\nThe final property is used to set up\
    \ the opacity of the image and is used with Mozilla Firefox. For Internet Explorer,\
    \ we use `filter:alpha(opacity=x)` to come up with transparent images.\n\nIn Mozilla\
    \ Firefox, in the property `-moz-opacity:x`, `x` may hold a value of anywhere\
    \ between `0.0` and `1.0`. The lower the value, the more transparent the image.\
    \ By the same token, in Internet Explorer `filter:alpha(opacity=x)`, the value\
    \ of `x` can be anywhere between `0` and `100`. Again, the lower the value, the\
    \ more transparent the image is.\n\n```\n<html>\n   <head>\n   </head>\n   <body>\n\
    \      <img style=\"border:1px solid red;-moz-opacity:0.4;filter:alpha(opacity=40);\"\
    \ src=\"/css/images/logo.png\" />\n   </body>\n</html>\n```\n\nThe result will\
    \ be a logo with a border of solid red.\n\n# Chapter 10: Links\n\nIn this chapter,\
    \ we take a look at how to use CSS to set the properties of a hyper link. The\
    \ following properties can be set:\n\n*   `:link` is used to signify unvisited\
    \ hyperlinks.\n*   `:visited` is used to signify visited hyperlinks.\n*   `:hover`\
    \ is used to signify elements that have the mouse pointer hovering over the top.\n\
    *   `:active` is used to signify elements that are currently being clicked.\n\n\
    Normally, these properties are stored in the header of an HTML document. Remember\
    \ the following rules for effective use:\n\n*   `a:hover` comes after `a:link`\
    \ and `a:visited` in CSS definition\n*   `a:active` comes after `a:hover`, as\
    \ shown in the next example:\n\n```\n<style type=\"text/css\">\n   a:link {color:\
    \ #000000}\n   a:visited {color: #006600}\n   a:hover {color: #FFCC00}\n   a:active\
    \ {color: #FF00CC}\n</style>\n```\n\nNext we will look at how these properties\
    \ are used for different effects on hyperlinks.\n\n## Set the Color\n\nThis example\
    \ shows how we set the color of a link using values that are of any color name\
    \ in any format that is valid:\n\n```\n<html>\n   <head>\n      <style type=\"\
    text/css\">\n         a:link {color:#000000}\n     </style>\n   </head>\n   <body>\n\
    \      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\nThe result will be a\
    \ black link. Please note that none of these links are clickable; they are just\
    \ for demonstration purposes.\n\nLink\n\n## The Color of Visited Links\n\nThis\
    \ example shows how to set the color of a visited link, again with values of any\
    \ color name in any format that is valid:\n\n```\n<html>\n   <head>\n      <style\
    \ type=\"text/css\">\n         a:visited {color: #006600}\n      </style>\n  \
    \ </head>\n   <body>\n      <a href=\"\"> link</a>\n   </body>\n</html>\n```\n\
    \nThe result will be the following link, black to start and green when clicked\
    \ on.\n\nLink\n\n## Color of Links with Mouse Hover\n\nThis example shows how\
    \ to change the color of a link when we hover the mouse pointer over it:\n\n```\n\
    <html>\n   <head>\n      <style type=\"text/css\">\n         a:hover {color: #FFCC00}\n\
    \      </style>\n   </head>\n   <body>\n      <a href=\"\">Link</a>\n   </body>\n\
    </html>\n```\n\nThe result will be a black link that changes to yellow when the\
    \ mouse is hovered over the top.\n\nLink\n\n## Color of Active Links\n\nThis example\
    \ shows how we change the color of an active link:\n\n```\n<html>\n   <head>\n\
    \      <style type=\"text/css\">\n         a:active {color: #FF00CC}\n      </style>\n\
    \   </head>\n   <body>\n      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\
    \nThe result will be a black link that changes to pink when it is clicked on.\n\
    \nLink\n\n# Chapter 11: Tables\n\nIn this chapter, we are going to look at the\
    \ properties we can set for HTML tables. The following properties can be set:\n\
    \n*   `Border-collapse` – this specifies whether the cells of the table should\
    \ maintain their own appearance or if the browser should control the borders that\
    \ touch\n*   `Border-spacing` – this specifies the width of the space between\
    \ table cells\n*   `Caption-side` captions – these are in the `<caption>` element\
    \ and rendered, by default, above the table. They can be used to set the position\
    \ of the table caption\n"
