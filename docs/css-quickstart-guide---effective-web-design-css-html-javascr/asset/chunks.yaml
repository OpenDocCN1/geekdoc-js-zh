    \nTHIS WILL APPLY ALL OF THE PROPERTIES ON THE TEXT AT THE SAME TIME.\n\n# Chapter\
    \ 8: Text\n\nThis chapter is going to take a look at how we can manipulate text\
    \ with the use of some CSS properties. The following text properties can be used\
    \ on an element:\n\n*   color – used to set what color the text is\n\n*   direction\
    \ – used to set the direction of the text\n\n*   letter-spacing – used to add\
    \ in or remove spaces between letter in a word\n\n*   text-indent – used to indent\
    \ the first line of a paragraph of text\n\n*   text-align – used to align the\
    \ text in an entire document\n\n*   text-decoration – used to add decoration to\
    \ text, such as underline, overline, and strikethrough\n\n*   text-transform –\
    \ used to either capitalize the text or convert between upper and lower case letters\n\
    \n*   white-space – used to control text flow and formatting\n\n*   text-shadow\
    \ – used to set a shadow around the text\n\nHow to Set the Text Color\n\nThis\
    \ example shows how we set the color of the text, using values of any color name\
    \ in any format that is valid\n\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\
    \n      <p style=\"color:red;\">\n\n      This text is shown in red.\n\n     \
    \ </p>\n\n   </body>\n\n</html>\n\nYou will see the following result -\n\nThis\
    \ text is shown in red.\n\nHow to Set the Direction of the Text\n\nThe next example\
    \ shows how we set the text direction, using values of ltr or rtl\n\n<html>\n\n\
       <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"direction:rtl;\">\n\n\
          This text is going to be rendered from right to left\n\n      </p>\n\n  \
    \ </body>\n\n</html>\n\nYou will see this result -\n\nThis text is going to be\
    \ rendered from right to left\n\nHow to Set the Spaces Between Characters\n\n\
    This example shows how we set up the spaces between the characters, using values\
    \ of normal or number specifying space\n\n<html>\n\n   <head>\n\n   </head>\n\n\
       <body>\n\n      <p style=\"letter-spacing:5px;\">\n\n      This text will have\
    \ spaces between letters.\n\n      </p>\n\n   </body>\n\n</html>\n\nYou will see\
    \ this result -\n\nThis text will have spaces between letters.\n\nHow to Set the\
    \ Spaces Between Words\n\nThe next example shows how we set space in between words,\
    \ using values of normal or number specifying space\n\n<html>\n\n   <head>\n\n\
       </head>\n\n   <body>\n\n      <p style=\"word-spacing:5px;\">\n\n      This\
    \ text has spaces between words.\n\n      </p>\n\n   </body>\n\n</html>\n\nYou\
    \ will see the following result -\n\nThis text has spaces between words.\n\nHow\
    \ to Set the Text Indent\n\nThe next example shows how we indent the first line\
    \ of a new paragraph using values of number specifying indent space or %\n\n<html>\n\
    \n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"text-indent:1cm;\"\
    >\n\n      The text has the first line indented by 1cm and it will remain at\n\
    \n      this position. This is done using the CSS text-indent property.\n\n     \
    \ </p>\n\n   </body>\n\n</html>\n\nYou will see this result -\n\n The text has\
    \ the first line indented by 1cm and it will remain at this position. This is\
    \ done using the CSS text-indent property\n\nHow to Set up the Text Alignment\n\
    \nThis example shows how we align text, using values of justify, left, right and\
    \ center\n\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"\
    text-align:right;\">\n\n      The text will be right aligned.\n\n      </p>\n\n\
          <p style=\"text-align:center;\">\n\n      The text will be center aligned.\n\
    \n      </p>\n\n      <p style=\"text-align:left;\">\n\n      The text will be\
    \ left aligned.\n\n      </p>\n\n   </body>\n\n</html>\n\nYou will see the following\
    \ result -\n\nThe text will be right aligned.\n\nThe text will be center aligned.\n\
    \nThe text will be left aligned.\n\nHow to Decorate Text\n\nNow we look at an\
    \ example showing how we decorate text, using values of none, overline, underline,\
    \ blink and strikethrough\n\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n\
          <p style=\"text-decoration:underline;\">"
