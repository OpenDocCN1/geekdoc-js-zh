    \n这是一个指定了右外边距的段落\n\n这是另一个指定了百分比形式的右外边距的段落\n\n# 结语\n\n感谢您购买我的书，希望它对您有所帮助。正如您所见，对于任何想要进入网页设计世界的人来说，CSS\
    \ 都是一个真正令人惊叹的工具。尽管它是最容易理解和学习的语言之一，但我不能保证您能在一夜之间学会它。与任何计算机语言一样，它需要时间和耐心。\n\n您需要全身心投入学习，一旦掌握了它，就必须准备好跟上所有最新的发展。CSS\
    \ 不是那种您可以学会、忘记、几个月后再重新捡起来的程序。虽然您脑海中仍会保留基础知识，但在那几个月里，可能已经发生了很多变化，许多改动也可能已经出现。至关重要的是，您要跟上这些变化，并每天使用\
    \ CSS，以确保不会丢失任何新掌握的技能。\n\nCSS 是一种您需要学习、理解并融入日常生活的程序。请允许我向您提一个小请求——您能在 Amazon.com\
