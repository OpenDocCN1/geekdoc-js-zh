                border-spacing:10px;


             }


             table.two {


                border-collapse:separate;


                width:400px;


                border-spacing:10px 50px;


             }


          </style>


       </head>


       <body>


          <table class="one" border="1">


             <caption>Separate Border Example with border-spacing</caption>


             <tr><td> Cell A Collapse Example</td></tr>


             <tr><td> Cell B Collapse Example</td></tr>


          </table>


          <br />


          <table class="two" border="1">


             <caption>Separate Border Example with border-spacing</caption>


             <tr><td> Cell A Separate Example</td></tr>


             <tr><td> Cell B Separate Example</td></tr>


          </table>


       </body>


    </html>


    Caption-Side Property


    This property allows you to specify the position of the <caption> element content
    in relation to the table.  It can use these four properties – top, left, bottom,
    right. The following example uses all of the four values:


    <html>


       <head>


          <style type="text/css">


             caption.top {caption-side:top}


             caption.bottom {caption-side:bottom}


             caption.left {caption-side:left}


             caption.right {caption-side:right}


          </style>


       </head>


       <body>


          <table style="width:400px; border:1px solid black;">


             <caption class="top">


             This caption will appear at the top


             </caption>


             <tr><td > Cell A</td></tr>


             <tr><td > Cell B</td></tr>


          </table>


          <br />


          <table style="width:400px; border:1px solid black;">


             <caption class="bottom">


             The caption appears at the bottom


             </caption>


             <tr><td > Cell A</td></tr>


             <tr><td > Cell B</td></tr>


          </table>


          <br />


          <table style="width:400px; border:1px solid black;">


             <caption class="left">


             The caption appears at the left


             </caption>


             <tr><td > Cell A</td></tr>


             <tr><td > Cell B</td></tr>


          </table>


          <br />


          <table style="width:400px; border:1px solid black;">


             <caption class="right">


             The caption appears at the right


             </caption>


             <tr><td > Cell A</td></tr>


             <tr><td > Cell B</td></tr>


          </table>


       </body>


    </html>


    Empty-Cells


    This property is used to indicate if an empty cell should have a border or not.
    It can have one of these three value – hide, show, inherit. This example shows
    the property being used to hide the borders of the empty cells in the <table>
    element:


    <html>


       <head>


          <style type="text/css">


             table.empty{


                width:350px;


                border-collapse:separate;


                empty-cells:hide;


             }


             td.empty{


                padding:5px;


                border-style:solid;


                border-width:1px;


                border-color:#999999;


             }


          </style>


       </head>


       <body>


          <table class="empty">


          <tr>


             <th></th>


             <th>Title one</th>


             <th>Title two</th>


          </tr>


          <tr>


             <th>Row Title</th>


             <td class="empty">value</td>


             <td class="empty">value</td>


          </tr>


          <tr>


             <th>Row Title</th>


             <td class="empty">value</td>


             <td class="empty"></td>


          </tr>


          </table>


       </body>


    </html>


    Table-Layout


    This property is meant to help you control how the browser lays out or renders
    a table. It can have one of these three value – inherit, auto or fixed. The next
    example shows the


    <html>


       <head>


          <style type="text/css">


             table.auto {


                table-layout: auto


             }


             table.fixed{


                table-layout: fixed


             }


          </style>


       </head>


       <body>


          <table class="auto" border="1" width="100%">


          <tr>


             <td width="20%">1000000000000000000000000000</td>


             <td width="40%">10000000</td>


             <td width="40%">100</td>


          </tr>


          </table>


          <br />


          <table class="fixed" border="1" width="100%">


          <tr>


             <td width="20%">1000000000000000000000000000</td>


             <td width="40%">10000000</td>


             <td width="40%">100</td>


          </tr>


          </table>


       </body>


    </html>


    # Chapter 12: Borders


    Border properties allow you to say what the border of an element box should look
    like. The following are the three properties that you can control


    *   Border-color – allows you to specify the color of the border


    *   Border-style – allows you to specify the style from a choice of values, including
    a solid line, dashed line, double line, etc.


    *   Border-width – allows you to specify the width of the border


    Border-Color


    This property lets you change the color of a border surrounding an element. You
    can change each side of the border individually using these properties:


    *   Border-bottom-color


    *   Border-top-color


    *   Border-left-color


    *   Border-right-color


    This example shows all four properties in use:


    <html>


       <head>


          <style type="text/css">


             p.example1{


                border:1px solid;


                border-bottom-color:#009900; /* Green */


                border-top-color:#FF0000;    /* Red */


                border-left-color:#330000;   /* Black */


                border-right-color:#0000CC;  /* Blue */


             }


             p.example2{


                border:1px solid;


                border-color:#009900;        /* Green */


             }


          </style>


       </head>


       <body>


          <p class="example1">


          The example shows all borders in different colors.


          </p>


          <p class="example2">


          The example shows all borders in green only.


          </p>


       </body>


    </html>'
