    Selectors can be defined in a number of ways so let’s look at each different one:


    Type Selectors


    You saw an example of the Type selector above but let’s have a look at another
    - a way of adding a color to all of the level 1 headings:


    h1 {


    color: #36CFFF;


    }


    Universal Selectors


    Instead of selecting the elements that relate to a specific type, this selector
    just matches the names of the element types. For example:


    {


    color: #000000;


    }


    In this example, the content of all the elements has been turned to black


    Descendant Selectors


    Let’s say you want to give a particular element a style but only when it is inside
    a specific element. In the following example, we are applying the style rule to
    the <em> element but only when it is outside of the <ul> tag:


    ul em {


    color: #000000;


    }


    Class Selectors


    Class selectors allow you to use the class attribute of the elements to define
    your style rules. All of the elements of that particular class are formatted as
    per the defined rule:


    .black {


    color: #000000;


    }


    In this example, the rule has turned the content of all the elements with the
    class attribute of black to the color black. You could go one step further if
    you like:


    h1.black {


    color: #000000;


    }


    Now you have specified that only the content inside the <h1> element with a class
    attribute of black will be turned to black.


    You are not limited to just one class selector for an element though. Look at
    this example:


    <p class="center bold">


    The style of this paragraph is defined by the classes Bold and Center


    </p>


    ID Selectors


    Style rules can be defined on the id attribute of an element and, when a rule
    is defined, it will format all elements with the specified id attribute:


    #black {


    color: #000000;


    }


    This rule will turn the content of all elements that has the id attribute to black.
    You can be a bit more specific if you like, for example:


    h1#black {


    color: #000000;


    }


    This rule turns the content for <h1> elements to black ONLY if the id attribute
    is set to black.


    The real power of an id selector become known when they are used as foundations
    for the descendant selector, for example:


    #black h2 {


    color: #000000;


    }


    Here, you can see that all of the level 2 headings will be turned to black only
    when they lie inside a tag that has the id attribute set as black


    Child Selectors


    The child selector is similar to the descendant selector but with different functionality.
    Look at this example:


    body > p {


    color: #000000;


    }


    This will turn the paragraphs to black only if they are the direct child of the
    <body> element. Other paragraphs that are inside other elements, like <td> or
    <div> would not change.


    Attribute Selectors


    Styles can also be applied to HTML element that have specific attributes. Look
    at the example below; you can see that the style rule is going to match all the
    input elements that have a type attribute with a text value:


    input [type = "text"]{


    color: #000000;


    }


    The advantage to using this method is that <input type = “submit” /> is not affected
    and the color change only applied to certain text fields.


    The following rules are for the attribute selector:


    *   p[lang] -  this selects all of the paragraph elements that have a lang attribute


    *   p[lang]= “fr”] – this selects all the paragraph elements with lang attributes
    that have an exact value of “fr”


    *   p[lang~="fr"] – this selects all the paragraph elements that have a lang attribute
    containing “fr”


    *   p[lang|="en"] – this selects all the paragraph elements with a lang attribute
    containing exact values of “en” or that start with “en-“.


    Multiple Style Rules


    Multiple style rules can be defined for one single element and these should be
    defined to combine a number of properties and their corresponding value into one
    block, as in this example:


    h1 {


                    color: #36C;


                     font-weight: normal;


                    letter-spacing: .4em;


                    margin-bottom: 1em;


                    text-transform: lowercase;


    }


    In this example, you can see that the pairs of properties and their value are
    each separated by a semi-colon (;). They can stay in one single line or you can
    spread them over multiple lines but, to read them better, we have kept them on
    single lines.


    Grouping Selectors


    Styles can be applied to multiple selectors. You just have to remember to separate
    each with a comma, as shown in this example:


    h1, h2, h3 {


                    color: #36C;


                    font-weight: normal;


                    letter-spacing: .4em;


                    margin-bottom: 1em;


                    text-transform: lowercase;


    }


    This style rule will apply to all of the h1, h2 and h3 elements as well. The order
    in the list is not relevant because all of the elements in the selector are going
    to have the declarations applied to them. As you can see from the example below,
    various class selectors can be combined:


    #content, #footer, #supplement {


       position: absolute;


       left: 510px;


                    width: 200px;


             }


    # Chapter 3: Inclusion


    You have four ways of associating styles with HTML documents, the most common
    of which is the inline CSS and the External CSS methods.


    Embedded CSS


    CSS rules can be put into an HTML document with the use of the <style> element.
    The tag goes inside the <head>…</head? Tag ad the rules that are defined with
    this syntax are applicable to all of the available elements. The following example
    shows and embedded CSS style element:


    <!DOCTYPE html>


    <html>


       <head>


          <style type = "text/css" media = "all">


             body {


                background-color: linen;


             }


             h1 {


                color: maroon;


                margin-left: 40px;


             }


          </style>


       </head>  


       <body>


          <h1>This is a heading</h1>


          <p>This is a paragraph.</p>


       </body>


    </html>


    Attributes


    The attributes commonly associated with the <style> elements are shown in the
    following table:


    | Attribute | Value | Description |


    | type | Text/css | This attribute specifies the language for the style sheer
    as an MIME content type and s a required attribute |


    | media | screenttytvprojectionhandheldprintbrailleauralall | This specifies which
    device the document is going to be displayed on. The default value is all and
    this is classed as an optional attribute |


    Inline CSS


    You can also use the style attributes from any HTML elements to define the rules.
    These specific rules will only be applied that the particular element. The generic
    syntax is:


    <element style = "...style rules....">


    Attributes


    The value of a style attribute is a mixture of different style declarations, each
    separated by semi colons. The following example is based on the generic syntax:


    <html>


       <head>


       </head>


       <body>


          <h1 style = "color:#36C;"> This is inline CSS </h1>


       </body>


    </html>


    External CSS - The <link> Element


    You can use the <link> element as a way of including an external stylesheet in
    the HTML document. External stylesheet are separate text files that have a .css
    extension. You will define all of your style rules in this file and this can then
    be added to any HTML document by using the <link element. The generic syntax is:


    <head>


       <link type = "text/css" href = "..." media = "..." />


    </head>


    Attributes


    The attributes that are associated with the <style> elements are as follows:


    | Attribute | Value | Description |


    | type | text/css | This specifies the language for the style sheet as a MIME
    content type and is a required attribute |


    | href | URL | This specifies that the style sheet has style rules and is also
    a required attribute |


    | media | Screenttytvprojectionhandheldprintbrailleauralall | Tis specifies which
    devices the document can be displayed on and is an optional attribute. The default
