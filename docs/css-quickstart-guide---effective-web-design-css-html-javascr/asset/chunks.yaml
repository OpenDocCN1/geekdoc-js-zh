    *   Height – this is used to set the height of the image


    *   Width – this is used to set the width of the image


    *   -most-opacity -  this used to determine the opacity of the image


    Image Border


    This property is used to set the width of the border on the image and can use
    values of length or %. For example:


    <html>


       <head>


       </head>


       <body>


          <img style="border:0px;" src="/css/images/logo.png" />


          <br />


          <img style="border:3px dashed red;" src="/css/images/logo.png" />


       </body>


    </html>


    The result will be a logo without a border and then a logo with a dotted red border


    Image Height


    This property is used to set how high an image is and can use values of length
    or %. When you use %, the value is applied to the box which the image is in:


    <html>


       <head>


       </head>


       <body>


          <img style="border:1px solid red; height:100px;" src="/css/images/logo.png"
    />


          <br />


          <img style="border:1px solid red; height:50%;" src="/css/images/logo.png"
    />


       </body>


    </html>


    The result will be two logos, exactly the same, but one taller than the other


    Image Width


    This is used to set the width of an image using value of % or length. As with
    height, using percentage applies to the box the image is in


    <html>


       <head>


       </head>


       <body>


          <img style="border:1px solid red; width:150px;" src="/css/images/logo.png"
    />


          <br />


          <img style="border:1px solid red; width:100%;" src="/css/images/logo.png"
    />


       </body>


    </html>


    The result will be two identical logos but of different sizes


    -Moz-Opacity


    The final property is use to set up the opacity of the image and is used with
    Mozilla Firefox. For Internet Explorer, we use filter:alpha (opacity:x), to come
    up with transparent images.


    In Mozilla Firefox, in the property (-moz-opacity:x), x may hold a value of anywhere
    between 0.0 and 1.0\. The lower the value, the more transparent the image. By
    the same token, in Internet Explorer (filter:apha(opacity=x)), the value of x
    can be anywhere between 0 and 100. Again, the lower the value, the more transparent
    the image is.


    <html>


       <head>


       </head>


       <body>


          <img style="border:1px solid red;-moz-opacity:0.4;filter:alpha(opacity=40);"
    src="/css/images/logo.png" />


       </body>


    </html>


    The result will be a logo with a border of solid red.


    # Chapter 10: Links


    In this chapter, we take a look at how to use CSS to set the properties of a hyper
    link. The following properties can be set:


    *   :link is used to signify unvisited hyperlinks.


    *   :visited is used to signify visited hyperlinks.


    *   :hover is used to signify elements that have the mouse pointer hovering over
    the top.


    *   :active is used to signify elements that are currently being clicked.


    Normally, these properties are stored in the header of an HTML document. Remember
    the following rules for effective use:


    *   a:hover comes after a:link and a:visited in CSS definition


    *   a:active comes after a:hover, as shown in the next example:


    <style type="text/css">


       a:link {color: #000000}


       a:visited {color: #006600}


       a:hover {color: #FFCC00}


       a:active {color: #FF00CC}


    </style>


    Next we will look at how these properties are used for different effects on hyperlinks.


    Set the Color


    This example shows how we set the color of a link using values that are of any
    color name in any format that is valid:


    <html>


       <head>


          <style type="text/css">


             a:link {color:#000000}


         </style>


       </head>


       <body>


          <a href="">Link</a>


       </body>


    </html>


    The result will be a black link. Please note that none of these links are clickable;
    they are just for demonstration purposes.


    Link


    The Color of Visited Links


    This example shows how to set the color of a visited link, again with values of
    any color name in any format that is valid:


    <html>


       <head>


          <style type="text/css">


             a:visited {color: #006600}


          </style>


       </head>


       <body>


          <a href=""> link</a>


       </body>


    </html>


    The result will be the following link, black to start and green when clicked on.


    Link


    Color of Links with Mouse Hover


    This example shows how to change the color of a link when we hover the mouse pointer
    over it:


    <html>


       <head>


          <style type="text/css">


             a:hover {color: #FFCC00}


          </style>


       </head>


       <body>


          <a href="">Link</a>


       </body>


    </html>


    The result will be a black link that changes to yellow when the mouse is hovered
    over the top


    Link


    Color of Active Links


    This example shows how we change the color of an active link:


    <html>


       <head>


          <style type="text/css">


             a:active {color: #FF00CC}


          </style>


       </head>


       <body>


          <a href="">Link</a>


       </body>


    </html>


    The result will be a black link that changes to pink when it is clicked on.


    Link


    # Chapter 11: Tables


    In this chapter, we are going to look at the properties we can set for HTML tables.
    The following properties can be set:


    *   Border-collapse – this specifies whether the cells of the table should maintain
    their own appearance or if the browser should control the borders that touch             


    *   Border-spacing – this specifies the width of the space between table cells


    *   Caption-side captions – these are in the <caption> element and rendered, by
    default, above the table. They can be used to set the position of the table caption'
