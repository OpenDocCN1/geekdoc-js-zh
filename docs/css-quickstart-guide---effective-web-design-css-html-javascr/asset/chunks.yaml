    This is a border with four different styles.


    Border-Width


    This allows you to set the width of the border, using a value of length in pt.,
    px or cm or you can set it to thick, medium or thin. You can change each side
    of the border individually, using these properties:


    *   border-bottom-width 


    *   border-top-width 


    *   border-left-width


    *   border-right-width 


    This example use all of these properties


    <html>


       <head>


       </head>


       <body>


          <p style="border-width:4px; border-style:solid;">


          This is a solid border with a width of 4px.


          </p>


          <p style="border-width:4pt; border-style:solid;">


          This is a solid border whose width is 4pt.


          </p>


          <p style="border-width:thin; border-style:solid;">


          This is a solid border whose width is thin.


          </p>


          <p style="border-width:medium; border-style:solid;">


          This is a solid border whose width is medium;


          </p>


          <p style="border-width:thick; border-style:solid;">


          This is a solid border whose width is thick.


          </p>


          <p style="border-bottom-width:4px;border-top-width:10px;


          border-left-width: 2px;border-right-width:15px;border-style:solid;">


          This is a border with four different widths.


          </p>


       </body>


    </html>


    The result will be:


    This is a solid border whose width is 4px.


    This is a solid border whose width is 4pt.


    This is a solid border whose width is thin.


    This is a solid border whose width is medium;


    This is a solid border whose width is thick.


    This is a border with four different widths.


    Shorthand Border Properties


    Using the shorthand border property, you can specify the style, color and width
    of the lines using just one property instead of three. The following example uses
    the border property to combine all three and you will find that this is the most
    commonly used method of setting a border around an element:


    <html>


       <head>


       </head>


       <body>


          <p style="border:4px solid red;">


    Another example:


          </p>


       </body>


    </html>


    # Chapter 13: Margins


    The final chapter deals with the margin property, i.e. the space around the HTML
    element. Martin property values are not inherited by child elements and it is
    also possible that you can use negative value as a way of overlapping the content.


    Remember – the vertical margins that are adjacent to one another (that is the
    top and bottom margins) are going to collapse into each other so that distance
    between each block is NOT the sum of the margins; instead it is the larger of
    the margins or the same as one margin if both are the same size.


    The following properties can be used:


    *   Margin – specifies the shorthand for setting all the margin properties in
    one single declaration


    *   Margin-bottom – specifies the bottom margin


    *   Margin-top – specifies the top margin


    *   Margin-left – specifies the left margin


    *   Margin-right – specifies the right margin


    Now we will look at how these properties are used.


    Margin Property


    This is a shorthand property that lets you set all properties for all four of
    the margin with a single declaration. The following example shows you how to set
    a margin round a paragraph:


    <html>


       <head>


       </head>


       <body>


          <p style="margin: 15px; border:1px solid black;">


          all four margins will be 15px


          </p>


