    \ border:1px solid black;\">\n      This is another paragraph with a specified\
    \ top margin in percent\n      </p>\n   </body>\n</html>\n```\n\n结果如下所示——\n\n\
    这是一个指定了左外边距的段落\n\n这是另一个指定了百分比形式的上外边距的段落\n\n## `Margin-Right`\n\n该属性允许你指定右外边距，可以使用\
