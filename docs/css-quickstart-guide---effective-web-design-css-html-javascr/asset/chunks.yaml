    \ | FFFF99 | FFFFCC | FFFFFF |\n\n# 第 6 章：背景\n\n在本章中，我们将学习如何为不同的 HTML 元素设置背景。可以设置以下属性：\n\
    \n*   `background-color` - 设置元素的背景颜色\n*   `background-image` - 设置元素的背景图像\n*  \
    \ `background-repeat` – 控制背景图像的重复方式\n*   `background-position` – 控制背景图像的位置\n*\
    \   `background-attachment` – 控制背景图像如何随页面滚动\n*   `background` – 作为简写属性，用于同时指定多个背景属性\n\
    \n## 设置背景颜色\n\n以下示例展示了如何为元素设置背景颜色：\n\n```html\n<html>\n   <head>\n   <body>\n\
    \      <p style = \"background-color:yellow;\">\n      This text has a yellow\
    \ background color.</p>\n   </body>\n   </head>\n<html>\n```\n\n你将在屏幕上看到以下内容：\n\
    \n这段文本具有黄色背景。\n\n## 如何设置背景图像\n\n以下示例展示了如何调用本地存储的图像来设置背景：\n\n```html\n<html>\n\
    \   <head>\n      <style>\n         body  {\n            background-image: url(\"\
    /css/images/css.jpg\");\n            background-color: #cccccc;\n         }\n\
    \      </style>\n      <body>\n         <h1>Hello World!</h1>\n      </body>\n\
    \   </head>\n<html>\n```\n\n现在你将在指定的背景上看到“Hello, World!”。\n\n## 如何重复背景图像\n\n以下是一个重复小背景图像的示例。如果图像不希望重复，而只显示一次，则可以将\
    \ `background-repeat` 属性的值设为 `no-repeat`。默认情况下，`background-repeat` 的值为 `repeat`：\n\
    \n```html\n<html>\n   <head>\n      <style>\n         body {\n            background-image:\
    \ url(\"/css/images/css.jpg\");\n            background-repeat: repeat;\n    \
    \     }\n      </style>\n   </head>\n   <body>\n      <p>Tutorials point</p>\n\
    \   </body>\n</html>\n```\n\n上一个示例中使用的背景现在将重复显示。在下面的示例中，我们将看到如何垂直重复图像：\n\n```html\n\
    <html>\n   <head>\n      <style>\n         body {\n            background-image:\
    \ url(\"/css/images/css.jpg\");\n            background-repeat: repeat-y;\n  \
    \       }\n      </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n\
    \   </body>\n</html>\n```\n\n选定的背景图像将垂直重复。\n\n下一个示例中，我们来看水平重复：\n\n```html\n<html>\n\
    \   <head>\n      <style>\n         body {\n            background-image: url(\"\
    /css/images/css.jpg\");\n            background-repeat: repeat-x;\n         }\n\
    \ </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n   </body>\n</html>\n\
    ```\n\n选定的背景图像将水平重复。\n\n## 如何设置背景图像的位置\n\n以下示例展示了如何将图像放置在距离左侧 100 像素的位置：\n\n```html\n\
    <html>\n   <head>\n      <style>\n         body {\n            background-image:\
    \ url(\"/css/images/css.jpg\");\n            background-position:100px;\n    \
    \     }\n      </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n\
    \   </body>\n</html>\n```\n\n背景图像将被放置在指定位置。\n\n现在我们来看如何将图像放置在距离左侧 100 像素、距离顶部\
    \ 200 像素的位置：\n\n```html\n<html>\n   <head>\n      <style>\n         body {\n \
    \           background-image: url(\"/css/images/css.jpg\");\n            background-position:100px\
    \ 200px;\n         }\n </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n\
    \   </body>\n</html>\n```\n\n背景图像将被放置在指定位置。\n\n## 如何设置背景附着\n\n这决定了图像是固定不动，还是随页面滚动。首先，我们来看固定图像：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n   <head>\n      <style>\n         body  {\n\
    \            background-image: url('/css/images/css.jpg');\n            background-repeat:\
    \ no-repeat;\n            background-attachment: fixed;\n         }\n      </style>\n\
    \   </head>\n   <body>\n      <p>The background-image is fixed. Try scrolling\
    \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
    \ the page.</p>\n      <p>The background-image is fixed. Try scrolling down the\
    \ page.</p>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
    \      <p>The background-image is fixed. Try scrolling down the page.</p>\n  \
    \    <p>The background-image is fixed. Try scrolling down the page.</p>\n    \
    \  <p>The background-image is fixed. Try scrolling down the page.</p>\n      <p>The\
    \ background-image is fixed. Try scrolling down the page.</p>\n      <p>The background-image\
    \ is fixed. Try scrolling down the page.</p>\n   </body>\n</html>\n```\n\n你将看到这行文字在代码中重复出现多次：\n\
    \n背景图像是固定的。尝试向下滚动页面。\n\n接着是：\n\n如果你没有看到滚动条，请尝试调整浏览器窗口大小。\n\n接下来，我们来看设置滚动背景：\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n   <head>\n      <style>\n         body  {\n\
    \            background-image: url('/css/images/css.jpg');\n            background-repeat:\
    \ no-repeat;\n            background-attachment: fixed;\n            background-attachment:scroll;\n\
    \         }.\n      </style>\n   </head>\n   <body>\n      <p>The background-image\
    \ is fixed. Try scrolling down the page.</p>\n      <p>The background-image is\
    \ fixed. Try scrolling down the page.</p>\n      <p>The background-image is fixed.\
    \ Try scrolling down the page.</p>\n      <p>The background-image is fixed. Try\
    \ scrolling down the page.</p>\n      <p>The background-image is fixed. Try scrolling\
    \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
    \ the page.</p>\n      <p>The background-image is fixed. Try scrolling down the\
    \ page.</p>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
    \      <p>The background-image is fixed. Try scrolling down the page.</p>\n  \
    \ </body>\n</html>\n```\n\n同样，你将在滚动背景上看到这条重复的消息：\n\n背景图像是固定的。尝试向下滚动页面。\n\n接着是：\n\
    \n如果你没有看到滚动条，请尝试调整浏览器窗口大小。\n\n## 如何使用简写属性\n\n最后一个示例展示了如何通过简写 `background` 属性同时设置所有背景属性：\n\
    \n```html\n<p style=\"background:url(/images/pattern1.gif) repeat fixed;\">\n\
    \   This paragraph has a fixed background image that will be repeated.\n</p>\n\
    ```\n\n# 第 7 章：字体\n\n现在我们将学习如何设置字体。以下是你可以为元素设置的字体属性：\n\n*   `font-family` - 用于更改字体系列\n\
    *   `font-style` - 用于将字体设置为斜体或倾斜\n*   `font-weight` – 用于增加或减少字体的粗细或亮度\n*   `font-variant`\
    \ – 用于使字体呈现小型大写字母效果\n*   `font-size` – 用于放大或缩小字体\n\n"
- fmt: "\n# font – shorthand for specifying various font properties\n\n## How to Set\
    \ the Font Family\n\nThe following example shows how to set the font family of\
    \ a specific element. The value can be any font family name:\n\n```html\n<html>\n\
    \   <head>\n   </head>\n   <body>\n      <p style=\"font-family:georgia,garamond,serif;\"\
    >\n      This text will be rendered in georgia, garamond, or the default serif\
    \ font\n      depending on which ones are in your system.\n      </p>\n   </body>\n\
    </html>\n```\n\nIt will produce the following result –\n\nThis text will be rendered\
    \ in georgia, garamond, or the default serif font, depending on which ones are\
    \ in your system\n\n## How to Set the Font Style\n\nThe following example shows\
    \ how to set the style of an element. Values can be `italic`, `normal`, `oblique`,\
    \ etc.\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
    font-style:italic;\">\n      This text is rendered in italic style\n      </p>\n\
    \   </body>\n</html>\n```\n\nYou will get the following result:\n\nThis text is\
    \ rendered in italic style\n\n## How to Set the Font Variant\n\nThis example shows\
    \ how to set the font variant with possible values of `small-caps`, `normal`,\
    \ etc.\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
    font-variant:small-caps;\">\n      The text is going to be rendered as small caps\n\
    \      </p>\n   </body>\n</html>\n```\n\nYou will get the following result:\n\n\
    THE TEXT IS GOING TO BE RENDERED AS SMALL CAPS\n\n## How to Set the Font Weight\n\
    \nThe next example shows how we set the font weight of an element. This property\
    \ will specify the bold level of the font and possible values include – `normal`,\
    \ `lighter`, `bold`, `bolder`, `100`, `200`, `300`, `400`, `500`, `600`, `700`,\
    \ `800`, `900`, etc.\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n  \
    \    <p style=\"font-weight:bold;\">The font is bold.</p>\n      <p style=\"font-weight:bolder;\"\
    >The font is bolder.</p>\n      <p style=\"font-weight:500;\">The font is 500\
    \ weight.</p>\n   </body>\n</html>\n```\n\nYou will get the following result:\n\
    \nThe font is bold.\n\nThe font is bolder.\n\nThe font is 500 weight.\n\n## How\
    \ to Set the Font Size\n\nThis example shows how to set up the font size of the\
    \ element. This is used as a way of controlling the font size and has possible\
    \ values of – `small`, `x-small`, `xx-small`, `xx-large`, `x-large`, `large`,\
    \ `smaller`, `larger`, `%`, or size in pixels:\n\n```html\n<html>\n   <head>\n\
    \   </head>\n   <body>\n      <p style=\"font-size:20px;\">The font size is 20\
    \ pixels</p>\n      <p style=\"font-size:small;\">The font size is small</p>\n\
    \      <p style=\"font-size:large;\">The font size is large</p>\n   </body>\n\
    </html>\n```\n\nYou will get the following result:\n\nThe font size is 20 pixels\n\
    \nThe font size is small\n\nThe font size is large\n\n## How to Set Font Size\
    \ Adjust\n\nThis example will demonstrate how we set the font size adjust and\
    \ lets you change the x-height to make the font more readable. The possible values\
    \ can be any number:\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n  \
    \    <p style=\"font-size-adjust:0.61;\">\n         The text uses a font-size-adjust\
    \ value.\n      </p>\n   </body>\n</html>\n```\n\nYou will get the following result\
    \ -\n\nTHE TEXT USES A FONT-SIZE-ADJUST VALUE.\n\n## How to Set the Font Stretch\n\
    \nThis next example shows you how to set up the font stretch and it relies on\
    \ your computer to have either an expanded or a condensed version of the particular\
    \ font. The values could possibly be – `wider`, `normal`, `narrower`, `extra-condensed`,\
    \ `ultra-condensed`, `condensed`, `semi-condensed`, `expanded`, `semi-expanded`,\
    \ `extra-expanded`, `ultra-expanded`:\n\n```html\n<html>\n   <head>\n   </head>\n\
    \   <body>\n      <p style=\"font-stretch:ultra-expanded;\">\n         If this\
    \ doesn't look like it works, most likely your computer does not have a condensed\
    \ or expanded version of the font\n      </p>\n   </body>\n</html>\n```\n\nIt\
    \ will produce the following result –\n\nIf this doesn't look like it works, most\
    \ likely your computer does not have a condensed or expanded version of the font\n\
    \n## How to Set the Shorthand Property\n\nThe final example shows you how to use\
    \ the `font` property to set all of the font properties at the same time:\n\n\
    ```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font:italic\
    \ small-caps bold 15px georgia;\">\n      This will apply all of the properties\
    \ on the text at the same time.\n      </p>\n   </body>\n</html>\n```\n\nIt will\
    \ produce the following result –\n\nTHIS WILL APPLY ALL OF THE PROPERTIES ON THE\
    \ TEXT AT THE SAME TIME.\n\n# Chapter 8: Text\n\nThis chapter is going to take\
    \ a look at how we can manipulate text with the use of some CSS properties. The\
    \ following text properties can be used on an element:\n\n* `color` – used to\
    \ set what color the text is\n* `direction` – used to set the direction of the\
    \ text\n* `letter-spacing` – used to add in or remove spaces between letter in\
    \ a word\n* `text-indent` – used to indent the first line of a paragraph of text\n\
    * `text-align` – used to align the text in an entire document\n* `text-decoration`\
    \ – used to add decoration to text, such as `underline`, `overline`, and `strikethrough`\n\
    * `text-transform` – used to either capitalize the text or convert between upper\
    \ and lower case letters\n* `white-space` – used to control text flow and formatting\n\
    * `text-shadow` – used to set a shadow around the text\n\n## How to Set the Text\
    \ Color\n\nThis example shows how we set the color of the text, using values of\
    \ any color name in any format that is valid\n\n```html\n<html>\n   <head>\n \
    \  </head>\n   <body>\n      <p style=\"color:red;\">\n      This text is shown\
    \ in red.\n      </p>\n   </body>\n</html>\n```\n\nYou will see the following\
    \ result -\n\nThis text is shown in red.\n\n## How to Set the Direction of the\
    \ Text\n\nThe next example shows how we set the text direction, using values of\
    \ `ltr` or `rtl`\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p\
    \ style=\"direction:rtl;\">\n      This text is going to be rendered from right\
    \ to left\n      </p>\n   </body>\n</html>\n```\n\nYou will see this result -\n\
    \nThis text is going to be rendered from right to left\n\n## How to Set the Spaces\
    \ Between Characters\n\nThis example shows how we set up the spaces between the\
    \ characters, using values of `normal` or number specifying space\n\n```html\n\
    <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"letter-spacing:5px;\"\
    >\n      This text will have spaces between letters.\n      </p>\n   </body>\n\
    </html>\n```\n\nYou will see this result -\n\nThis text will have spaces between\
    \ letters.\n\n## How to Set the Spaces Between Words\n\nThe next example shows\
    \ how we set space in between words, using values of `normal` or number specifying\
    \ space\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
    word-spacing:5px;\">\n      This text has spaces between words.\n      </p>\n\
    \   </body>\n</html>\n```\n\nYou will see the following result -\n\nThis text\
    \ has spaces between words.\n\n## How to Set the Text Indent\n\nThe next example\
    \ shows how we indent the first line of a new paragraph using values of number\
    \ specifying indent space or `%`\n\n```html\n<html>\n   <head>\n   </head>\n \
    \  <body>\n      <p style=\"text-indent:1cm;\">\n      The text has the first\
    \ line indented by 1cm and it will remain at\n      this position. This is done\
    \ using the CSS text-indent property.\n      </p>\n   </body>\n</html>\n```\n\n\
    You will see this result -\n\nThe text has the first line indented by 1cm and\
    \ it will remain at this position. This is done using the CSS text-indent property\n\
    \n## How to Set up the Text Alignment\n\nThis example shows how we align text,\
    \ using values of `justify`, `left`, `right` and `center`\n\n```html\n<html>\n\
    \   <head>\n   </head>\n   <body>\n      <p style=\"text-align:right;\">\n   \
    \   The text will be right aligned.\n      </p>\n      <p style=\"text-align:center;\"\
    >\n      The text will be center aligned.\n      </p>\n      <p style=\"text-align:left;\"\
    >\n      The text will be left aligned.\n      </p>\n   </body>\n</html>\n```\n\
    \nYou will see the following result -\n\nThe text will be right aligned.\n\nThe\
    \ text will be center aligned.\n\nThe text will be left aligned.\n\n## How to\
    \ Decorate Text\n\nNow we look at an example showing how we decorate text, using\
    \ values of `none`, `overline`, `underline`, `blink` and `strikethrough`\n\n```html\n\
    <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"text-decoration:underline;\"\
    >\n```\n"
