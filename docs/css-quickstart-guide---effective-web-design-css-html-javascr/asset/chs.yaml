  | FFCC00 | FFCC33 | FFCC66 | FFCC99 | FFCCCC | FFCCFF |\n| FFFF00 | FFFF33 | FFFF66\
  \ | FFFF99 | FFFFCC | FFFFFF |\n\n# 第 6 章：背景\n\n在本章中，我们将学习如何为不同的 HTML 元素设置背景。可以设置以下属性：\n\
  \n*   `background-color` - 设置元素的背景颜色\n*   `background-image` - 设置元素的背景图像\n*   `background-repeat`\
  \ – 控制背景图像的重复方式\n*   `background-position` – 控制背景图像的位置\n*   `background-attachment`\
  \ – 控制背景图像如何随页面滚动\n*   `background` – 作为简写属性，用于同时指定多个背景属性\n\n## 设置背景颜色\n\n以下示例展示了如何为元素设置背景颜色：\n\
  \n```html\n<html>\n   <head>\n   <body>\n      <p style = \"background-color:yellow;\"\
  >\n      This text has a yellow background color.</p>\n   </body>\n   </head>\n\
  <html>\n```\n\n你将在屏幕上看到以下内容：\n\n这段文本具有黄色背景。\n\n## 如何设置背景图像\n\n以下示例展示了如何调用本地存储的图像来设置背景：\n\
  \n```html\n<html>\n   <head>\n      <style>\n         body  {\n            background-image:\
  \ url(\"/css/images/css.jpg\");\n            background-color: #cccccc;\n      \
  \   }\n      </style>\n      <body>\n         <h1>Hello World!</h1>\n      </body>\n\
  \   </head>\n<html>\n```\n\n现在你将在指定的背景上看到“Hello, World!”。\n\n## 如何重复背景图像\n\n以下是一个重复小背景图像的示例。如果图像不希望重复，而只显示一次，则可以将\
  \ `background-repeat` 属性的值设为 `no-repeat`。默认情况下，`background-repeat` 的值为 `repeat`：\n\
  \n```html\n<html>\n   <head>\n      <style>\n         body {\n            background-image:\
  \ url(\"/css/images/css.jpg\");\n            background-repeat: repeat;\n      \
  \   }\n      </style>\n   </head>\n   <body>\n      <p>Tutorials point</p>\n   </body>\n\
  </html>\n```\n\n上一个示例中使用的背景现在将重复显示。在下面的示例中，我们将看到如何垂直重复图像：\n\n```html\n<html>\n \
  \  <head>\n      <style>\n         body {\n            background-image: url(\"\
  /css/images/css.jpg\");\n            background-repeat: repeat-y;\n         }\n\
  \      </style>\n   </head>\n   <body>\n      <p>Tutorials point</>\n   </body>\n\
  </html>\n```\n\n选定的背景图像将垂直重复。\n\n下一个示例中，我们来看水平重复：\n\n```html\n<html>\n   <head>\n\
  \      <style>\n         body {\n            background-image: url(\"/css/images/css.jpg\"\
  );\n            background-repeat: repeat-x;\n         }\n </style>\n   </head>\n\
  \   <body>\n      <p>Tutorials point</>\n   </body>\n</html>\n```\n\n选定的背景图像将水平重复。\n\
  \n## 如何设置背景图像的位置\n\n以下示例展示了如何将图像放置在距离左侧 100 像素的位置：\n\n```html\n<html>\n   <head>\n\
  \      <style>\n         body {\n            background-image: url(\"/css/images/css.jpg\"\
  );\n            background-position:100px;\n         }\n      </style>\n   </head>\n\
  \   <body>\n      <p>Tutorials point</>\n   </body>\n</html>\n```\n\n背景图像将被放置在指定位置。\n\
  \n现在我们来看如何将图像放置在距离左侧 100 像素、距离顶部 200 像素的位置：\n\n```html\n<html>\n   <head>\n    \
  \  <style>\n         body {\n            background-image: url(\"/css/images/css.jpg\"\
  );\n            background-position:100px 200px;\n         }\n </style>\n   </head>\n\
  \   <body>\n      <p>Tutorials point</>\n   </body>\n</html>\n```\n\n背景图像将被放置在指定位置。\n\
  \n## 如何设置背景附着\n\n这决定了图像是固定不动，还是随页面滚动。首先，我们来看固定图像：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n   <head>\n      <style>\n         body  {\n            background-image:\
  \ url('/css/images/css.jpg');\n            background-repeat: no-repeat;\n     \
  \       background-attachment: fixed;\n         }\n      </style>\n   </head>\n\
  \   <body>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
  \      <p>The background-image is fixed. Try scrolling down the page.</p>\n    \
  \  <p>The background-image is fixed. Try scrolling down the page.</p>\n      <p>The\
  \ background-image is fixed. Try scrolling down the page.</p>\n      <p>The background-image\
  \ is fixed. Try scrolling down the page.</p>\n      <p>The background-image is fixed.\
  \ Try scrolling down the page.</p>\n      <p>The background-image is fixed. Try\
  \ scrolling down the page.</p>\n      <p>The background-image is fixed. Try scrolling\
  \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
  \ the page.</p>\n   </body>\n</html>\n```\n\n你将看到这行文字在代码中重复出现多次：\n\n背景图像是固定的。尝试向下滚动页面。\n\
  \n接着是：\n\n如果你没有看到滚动条，请尝试调整浏览器窗口大小。\n\n接下来，我们来看设置滚动背景：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n   <head>\n      <style>\n         body  {\n            background-image:\
  \ url('/css/images/css.jpg');\n            background-repeat: no-repeat;\n     \
  \       background-attachment: fixed;\n            background-attachment:scroll;\n\
  \         }.\n      </style>\n   </head>\n   <body>\n      <p>The background-image\
  \ is fixed. Try scrolling down the page.</p>\n      <p>The background-image is fixed.\
  \ Try scrolling down the page.</p>\n      <p>The background-image is fixed. Try\
  \ scrolling down the page.</p>\n      <p>The background-image is fixed. Try scrolling\
  \ down the page.</p>\n      <p>The background-image is fixed. Try scrolling down\
  \ the page.</p>\n      <p>The background-image is fixed. Try scrolling down the\
  \ page.</p>\n      <p>The background-image is fixed. Try scrolling down the page.</p>\n\
  \      <p>The background-image is fixed. Try scrolling down the page.</p>\n    \
  \  <p>The background-image is fixed. Try scrolling down the page.</p>\n   </body>\n\
  </html>\n```\n\n同样，你将在滚动背景上看到这条重复的消息：\n\n背景图像是固定的。尝试向下滚动页面。\n\n接着是：\n\n如果你没有看到滚动条，请尝试调整浏览器窗口大小。\n\
  \n## 如何使用简写属性\n\n最后一个示例展示了如何通过简写 `background` 属性同时设置所有背景属性：\n\n```html\n<p style=\"\
  background:url(/images/pattern1.gif) repeat fixed;\">\n   This paragraph has a fixed\
  \ background image that will be repeated.\n</p>\n```\n\n# 第 7 章：字体\n\n现在我们将学习如何设置字体。以下是你可以为元素设置的字体属性：\n\
  \n*   `font-family` - 用于更改字体系列\n*   `font-style` - 用于将字体设置为斜体或倾斜\n*   `font-weight`\
  \ – 用于增加或减少字体的粗细或亮度\n*   `font-variant` – 用于使字体呈现小型大写字母效果\n*   `font-size` – 用于放大或缩小字体\n\
  \n\n\n\n\n## font – 用于指定各种字体属性的简写属性\n\n### 如何设置字体系列\n\n以下示例展示了如何设置特定元素的字体系列。该值可以是任何字体系列名称：\n\
  \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-family:georgia,garamond,serif;\"\
  >\n      This text will be rendered in georgia, garamond, or the default serif font\n\
  \      depending on which ones are in your system.\n      </p>\n   </body>\n</html>\n\
  ```\n\n它将产生以下结果——\n\n此文本将根据您系统中存在的字体，以 georgia、garamond 或默认衬线字体呈现。\n\n### 如何设置字体样式\n\
  \n以下示例展示了如何设置元素的样式。值可以是 `italic`、`normal`、`oblique` 等。\n\n```html\n<html>\n   <head>\n\
  \   </head>\n   <body>\n      <p style=\"font-style:italic;\">\n      This text\
  \ is rendered in italic style\n      </p>\n   </body>\n</html>\n```\n\n您将得到以下结果：\n\
  \n此文本以斜体样式呈现。\n\n### 如何设置字体变体\n\n此示例展示了如何设置字体变体，可能的值有 `small-caps`、`normal` 等。\n\
  \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-variant:small-caps;\"\
  >\n      The text is going to be rendered as small caps\n      </p>\n   </body>\n\
  </html>\n```\n\n您将得到以下结果：\n\nTHE TEXT IS GOING TO BE RENDERED AS SMALL CAPS\n\n\
  ### 如何设置字体粗细\n\n下一个示例展示了如何设置元素的字体粗细。此属性将指定字体的粗体级别，可能的值包括 – `normal`、`lighter`、`bold`、`bolder`、`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`、`900`\
  \ 等。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-weight:bold;\"\
  >The font is bold.</p>\n      <p style=\"font-weight:bolder;\">The font is bolder.</p>\n\
  \      <p style=\"font-weight:500;\">The font is 500 weight.</p>\n   </body>\n</html>\n\
  ```\n\n您将得到以下结果：\n\nThe font is bold.\n\nThe font is bolder.\n\nThe font is 500\
  \ weight.\n\n### 如何设置字体大小\n\n此示例展示了如何设置元素的字体大小。这用于控制字体大小，可能的值有 – `small`、`x-small`、`xx-small`、`xx-large`、`x-large`、`large`、`smaller`、`larger`、`%`\
  \ 或像素大小：\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
  font-size:20px;\">The font size is 20 pixels</p>\n      <p style=\"font-size:small;\"\
  >The font size is small</p>\n      <p style=\"font-size:large;\">The font size is\
  \ large</p>\n   </body>\n</html>\n```\n\n您将得到以下结果：\n\nThe font size is 20 pixels\n\
  \nThe font size is small\n\nThe font size is large\n\n### 如何设置字体大小调整\n\n此示例将演示如何设置字体大小调整，它允许您更改\
  \ x 高度以使字体更易读。可能的值可以是任何数字：\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n\
  \      <p style=\"font-size-adjust:0.61;\">\n         The text uses a font-size-adjust\
  \ value.\n      </p>\n   </body>\n</html>\n```\n\n您将得到以下结果——\n\nTHE TEXT USES A\
  \ FONT-SIZE-ADJUST VALUE.\n\n### 如何设置字体拉伸\n\n下一个示例展示了如何设置字体拉伸，它依赖于您的计算机是否拥有特定字体的紧缩或扩展版本。值可能为\
  \ – `wider`、`normal`、`narrower`、`extra-condensed`、`ultra-condensed`、`condensed`、`semi-condensed`、`expanded`、`semi-expanded`、`extra-expanded`、`ultra-expanded`：\n\
  \n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"font-stretch:ultra-expanded;\"\
  >\n         If this doesn't look like it works, most likely your computer does not\
  \ have a condensed or expanded version of the font\n      </p>\n   </body>\n</html>\n\
  ```\n\n它将产生以下结果——\n\nIf this doesn't look like it works, most likely your computer\
  \ does not have a condensed or expanded version of the font\n\n### 如何设置简写属性\n\n\
  最后一个示例展示了如何使用 `font` 属性同时设置所有字体属性：\n\n```html\n<html>\n   <head>\n   </head>\n \
  \  <body>\n      <p style=\"font:italic small-caps bold 15px georgia;\">\n     \
  \ This will apply all of the properties on the text at the same time.\n      </p>\n\
  \   </body>\n</html>\n```\n\n它将产生以下结果——\n\nTHIS WILL APPLY ALL OF THE PROPERTIES\
  \ ON THE TEXT AT THE SAME TIME.\n\n# 第 8 章：文本\n\n本章将介绍如何通过使用一些 CSS 属性来操作文本。以下文本属性可用于元素：\n\
  \n* `color` – 用于设置文本的颜色\n* `direction` – 用于设置文本的方向\n* `letter-spacing` – 用于在单词的字母之间添加或删除空格\n\
  * `text-indent` – 用于缩进文本段落的第一行\n* `text-align` – 用于对齐整个文档中的文本\n* `text-decoration`\
  \ – 用于为文本添加装饰，例如 `underline`、`overline` 和 `strikethrough`\n* `text-transform` –\
  \ 用于将文本大写或在大小写字母之间转换\n* `white-space` – 用于控制文本流和格式\n* `text-shadow` – 用于在文本周围设置阴影\n\
  \n## 如何设置文本颜色\n\n此示例展示了如何设置文本的颜色，使用任何有效格式的任何颜色名称作为值。\n\n```html\n<html>\n   <head>\n\
  \   </head>\n   <body>\n      <p style=\"color:red;\">\n      This text is shown\
  \ in red.\n      </p>\n   </body>\n</html>\n```\n\n您将看到以下结果——\n\nThis text is shown\
  \ in red.\n\n## 如何设置文本方向\n\n下一个示例展示了如何设置文本方向，使用 `ltr` 或 `rtl` 作为值。\n\n```html\n\
  <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"direction:rtl;\">\n \
  \     This text is going to be rendered from right to left\n      </p>\n   </body>\n\
  </html>\n```\n\n您将看到此结果——\n\nThis text is going to be rendered from right to left\n\
  \n## 如何设置字符间距\n\n此示例展示了如何设置字符之间的间距，使用 `normal` 或指定间距的数字作为值。\n\n```html\n<html>\n\
  \   <head>\n   </head>\n   <body>\n      <p style=\"letter-spacing:5px;\">\n   \
  \   This text will have spaces between letters.\n      </p>\n   </body>\n</html>\n\
  ```\n\n您将看到此结果——\n\nThis text will have spaces between letters.\n\n## 如何设置单词间距\n\
  \n下一个示例展示了如何设置单词之间的间距，使用 `normal` 或指定间距的数字作为值。\n\n```html\n<html>\n   <head>\n \
  \  </head>\n   <body>\n      <p style=\"word-spacing:5px;\">\n      This text has\
  \ spaces between words.\n      </p>\n   </body>\n</html>\n```\n\n您将看到以下结果——\n\n\
  This text has spaces between words.\n\n## 如何设置文本缩进\n\n下一个示例展示了如何缩进新段落的第一行，使用指定缩进空间的数字或\
  \ `%` 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"\
  text-indent:1cm;\">\n      The text has the first line indented by 1cm and it will\
  \ remain at\n      this position. This is done using the CSS text-indent property.\n\
  \      </p>\n   </body>\n</html>\n```\n\n您将看到此结果——\n\nThe text has the first line\
  \ indented by 1cm and it will remain at this position. This is done using the CSS\
  \ text-indent property\n\n## 如何设置文本对齐\n\n此示例展示了如何对齐文本，使用 `justify`、`left`、`right`\
  \ 和 `center` 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p\
  \ style=\"text-align:right;\">\n      The text will be right aligned.\n      </p>\n\
  \      <p style=\"text-align:center;\">\n      The text will be center aligned.\n\
  \      </p>\n      <p style=\"text-align:left;\">\n      The text will be left aligned.\n\
  \      </p>\n   </body>\n</html>\n```\n\n您将看到以下结果——\n\nThe text will be right aligned.\n\
  \nThe text will be center aligned.\n\nThe text will be left aligned.\n\n## 如何装饰文本\n\
  \n现在我们来看一个示例，展示如何装饰文本，使用 `none`、`overline`、`underline`、`blink` 和 `strikethrough`\
  \ 作为值。\n\n```html\n<html>\n   <head>\n   </head>\n   <body>\n      <p style=\"text-decoration:underline;\"\
  >\n```\n\n\n\n\n\n# 第 9 章：使用图像\n\n图像是网站的重要组成部分，虽然不应使用过多，但使用的图像应质量良好且位置恰当。CSS 通过允许设置以下属性来控制这些图像的显示：\n\
  \n*   `Border` – 用于设置图像边框的宽度\n*   `Height` – 用于设置图像的高度\n*   `Width` – 用于设置图像的宽度\n\
  *   `-moz-opacity` – 用于确定图像的不透明度\n\n## 图像边框\n\n该属性用于设置图像边框的宽度，可以使用长度值或 `%`。例如：\n\
  \n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img style=\"border:0px;\"\
  \ src=\"/css/images/logo.png\" />\n      <br />\n      <img style=\"border:3px dashed\
  \ red;\" src=\"/css/images/logo.png\" />\n   </body>\n</html>\n```\n\n结果将是一个无边框的徽标，然后是一个带有红色虚线边框的徽标。\n\
  \n## 图像高度\n\n该属性用于设置图像的高度，可以使用长度值或 `%`。当使用 `%` 时，该值应用于图像所在的盒子：\n\n```\n<html>\n\
  \   <head>\n   </head>\n   <body>\n      <img style=\"border:1px solid red; height:100px;\"\
  \ src=\"/css/images/logo.png\" />\n      <br />\n      <img style=\"border:1px solid\
  \ red; height:50%;\" src=\"/css/images/logo.png\" />\n   </body>\n</html>\n```\n\
  \n结果将是两个完全相同的徽标，但一个比另一个高。\n\n## 图像宽度\n\n该属性用于使用 `%` 或长度值设置图像的宽度。与高度类似，使用百分比时应用于图像所在的盒子：\n\
  \n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img style=\"border:1px solid\
  \ red; width:150px;\" src=\"/css/images/logo.png\" />\n      <br />\n      <img\
  \ style=\"border:1px solid red; width:100%;\" src=\"/css/images/logo.png\" />\n\
  \   </body>\n</html>\n```\n\n结果将是两个相同的徽标，但尺寸不同。\n\n## `-moz-opacity`\n\n最后一个属性用于设置图像的不透明度，适用于\
  \ Mozilla Firefox。对于 Internet Explorer，我们使用 `filter:alpha(opacity=x)` 来实现透明图像。\n\
  \n在 Mozilla Firefox 中，属性 `-moz-opacity:x` 中的 `x` 可以取 `0.0` 到 `1.0` 之间的任意值。值越低，图像越透明。同样，在\
  \ Internet Explorer 中，`filter:alpha(opacity=x)` 的 `x` 值可以在 `0` 到 `100` 之间。同样，值越低，图像越透明。\n\
  \n```\n<html>\n   <head>\n   </head>\n   <body>\n      <img style=\"border:1px solid\
  \ red;-moz-opacity:0.4;filter:alpha(opacity=40);\" src=\"/css/images/logo.png\"\
  \ />\n   </body>\n</html>\n```\n\n结果将是一个带有红色实线边框的徽标。\n\n# 第 10 章：链接\n\n在本章中，我们将了解如何使用\
  \ CSS 设置超链接的属性。可以设置以下属性：\n\n*   `:link` 用于表示未访问的超链接。\n*   `:visited` 用于表示已访问的超链接。\n\
  *   `:hover` 用于表示鼠标指针悬停在其上的元素。\n*   `:active` 用于表示当前正在被点击的元素。\n\n通常，这些属性存储在 HTML\
  \ 文档的头部。请记住以下有效使用的规则：\n\n*   在 CSS 定义中，`a:hover` 位于 `a:link` 和 `a:visited` 之后\n\
  *   `a:active` 位于 `a:hover` 之后，如下例所示：\n\n```\n<style type=\"text/css\">\n   a:link\
  \ {color: #000000}\n   a:visited {color: #006600}\n   a:hover {color: #FFCC00}\n\
  \   a:active {color: #FF00CC}\n</style>\n```\n\n接下来，我们将了解这些属性如何用于实现超链接的不同效果。\n\n\
  ## 设置颜色\n\n此示例展示了如何使用任何有效格式的颜色名称值来设置链接的颜色：\n\n```\n<html>\n   <head>\n      <style\
  \ type=\"text/css\">\n         a:link {color:#000000}\n     </style>\n   </head>\n\
  \   <body>\n      <a href=\"\">Link</a>\n   </body>\n</html>\n```\n\n结果将是一个黑色链接。请注意，这些链接均不可点击，仅用于演示目的。\n\
  \n链接\n\n## 已访问链接的颜色\n\n此示例展示了如何设置已访问链接的颜色，同样使用任何有效格式的颜色名称值：\n\n```\n<html>\n   <head>\n\
  \      <style type=\"text/css\">\n         a:visited {color: #006600}\n      </style>\n\
  \   </head>\n   <body>\n      <a href=\"\"> link</a>\n   </body>\n</html>\n```\n\
  \n结果将是以下链接：初始为黑色，点击后变为绿色。\n\n链接\n\n## 鼠标悬停时链接的颜色\n\n此示例展示了当鼠标指针悬停在链接上时如何改变其颜色：\n\
  \n```\n<html>\n   <head>\n      <style type=\"text/css\">\n         a:hover {color:\
  \ #FFCC00}\n      </style>\n   </head>\n   <body>\n      <a href=\"\">Link</a>\n\
  \   </body>\n</html>\n```\n\n结果将是一个黑色链接，当鼠标悬停在其上时变为黄色。\n\n链接\n\n## 活动链接的颜色\n\n此示例展示了如何改变活动链接的颜色：\n\
  \n```\n<html>\n   <head>\n      <style type=\"text/css\">\n         a:active {color:\
  \ #FF00CC}\n      </style>\n   </head>\n   <body>\n      <a href=\"\">Link</a>\n\
  \   </body>\n</html>\n```\n\n结果将是一个黑色链接，点击时变为粉色。\n\n链接\n\n# 第 11 章：表格\n\n在本章中，我们将了解可以为\
  \ HTML 表格设置的属性。可以设置以下属性：\n\n*   `Border-collapse` – 指定表格的单元格是保持各自的外观，还是由浏览器控制相邻的边框\n\
  *   `Border-spacing` – 指定表格单元格之间的间距宽度\n*   `Caption-side` 标题 – 这些标题位于 `<caption>`\
  \ 元素中，默认情况下渲染在表格上方。它们可用于设置表格标题的位置\n\n\n\n\n*   `Empty-cells` – 指定是否应在空单元格上显示边框\n\
  *   `Table-layout` – 允许浏览器通过使用它为列找到的第一个宽度属性来加速表格布局，而无需加载表格后再渲染\n\n接下来我们通过示例来了解这些属性。\n\
  \n## `Border-Collapse`\n\n该属性可以有两个值 – `collapse` 和 `separate`。以下示例同时使用了这两个值：\n\n\
  ```html\n<html>\n   <head>\n      <style type=\"text/css\">\n         table.one\
  \ {border-collapse:collapse;}\n         table.two {border-collapse:separate;}\n\
  \         td.a {\n            border-style:dotted;\n            border-width:3px;\n\
  \            border-color:#000000;\n            padding: 10px;\n         }\n   \
  \      td.b {\n            border-style:solid;\n            border-width:3px;\n\
  \            border-color:#333333;\n            padding:10px;\n         }\n    \
  \  </style>\n   </head>\n   <body>\n      <table class=\"one\">\n         <caption>折叠边框示例</caption>\n\
  \         <tr><td class=\"a1 Cell 1 Collapse Example</td></tr>\n         <tr><td\
  \ class=\"2\"> Cell 2 Collapse Example</td></tr>\n      </table>\n      <br />\n\
  \      <table class=\"two\">\n         <caption>分离边框示例</caption>\n         <tr><td\
  \ class=\"1\"> Cell 1 Separate Example</td></tr>\n         <tr><td class=\"2\">\
  \ Cell 2 Separate Example</td></tr>\n      </table>\n   </body>\n</html>\n```\n\n\
  这将产生以下结果：\n\n| 折叠边框： |\n| 单元格 1 折叠示例 |\n| 单元格 2 折叠示例 |\n| 分离边框： |\n| 单元格 1 分离示例\
  \ |\n| 单元格 2 分离示例 |\n\n## `Border-Spacing`\n\n该属性指定两个相邻单元格边框之间的距离。它可以接受两个值中的任意一个，每个值都应为长度单位。一个值适用于水平和垂直边框，而使用两个值则分别表示垂直和水平间距。\n\
  \n```css\n<style type=\"text/css\">\n   /* 如果提供一个值 */\n   table.example {border-spacing:10px;}\n\
  \   /* 这是提供两个值的方法 */\n   table.example {border-spacing:10px; 15px;}\n</style>\n\
  ```\n\n下一个示例修改了第一个示例：\n\n```html\n<html>\n   <head>\n      <style type=\"text/css\"\
  >\n         table.one {\n            border-collapse:separate;\n            width:400px;\n\
  \            border-spacing:10px;\n         }\n         table.two {\n          \
  \  border-collapse:separate;\n            width:400px;\n            border-spacing:10px\
  \ 50px;\n         }\n      </style>\n   </head>\n   <body>\n      <table class=\"\
  one\" border=\"1\">\n         <caption>带边框间距的分离边框示例</caption>\n         <tr><td>\
  \ 单元格 A 折叠示例</td></tr>\n         <tr><td> 单元格 B 折叠示例</td></tr>\n      </table>\n\
  \      <br />\n      <table class=\"two\" border=\"1\">\n         <caption>带边框间距的分离边框示例</caption>\n\
  \         <tr><td> 单元格 A 分离示例</td></tr>\n         <tr><td> 单元格 B 分离示例</td></tr>\n\
  \      </table>\n   </body>\n</html>\n```\n\n## `Caption-Side` 属性\n\n该属性允许你指定 `<caption>`\
  \ 元素内容相对于表格的位置。它可以接受以下四个值 – `top`、`left`、`bottom`、`right`。以下示例使用了所有四个值：\n\n```html\n\
  <html>\n   <head>\n      <style type=\"text/css\">\n         caption.top {caption-side:top}\n\
  \         caption.bottom {caption-side:bottom}\n         caption.left {caption-side:left}\n\
  \         caption.right {caption-side:right}\n      </style>\n   </head>\n   <body>\n\
  \      <table style=\"width:400px; border:1px solid black;\">\n         <caption\
  \ class=\"top\">\n         此标题将显示在顶部\n         </caption>\n         <tr><td > 单元格\
  \ A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n      </table>\n      <br />\n\
  \      <table style=\"width:400px; border:1px solid black;\">\n         <caption\
  \ class=\"bottom\">\n         标题显示在底部\n         </caption>\n         <tr><td > 单元格\
  \ A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n      </table>\n      <br />\n\
  \      <table style=\"width:400px; border:1px solid black;\">\n         <caption\
  \ class=\"left\">\n         标题显示在左侧\n         </caption>\n         <tr><td > 单元格\
  \ A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n      </table>\n      <br />\n\
  \      <table style=\"width:400px; border:1px solid black;\">\n         <caption\
  \ class=\"right\">\n         标题显示在右侧\n         </caption>\n         <tr><td > 单元格\
  \ A</td></tr>\n         <tr><td > 单元格 B</td></tr>\n      </table>\n   </body>\n\
  </html>\n```\n\n## `Empty-Cells`\n\n该属性用于指示空单元格是否应显示边框。它可以取以下三个值之一 – `hide`、`show`、`inherit`。以下示例展示了如何使用该属性隐藏\
  \ `<table>` 元素中空单元格的边框：\n\n```html\n<html>\n   <head>\n      <style type=\"text/css\"\
  >\n         table.empty{\n            width:350px;\n            border-collapse:separate;\n\
  \            empty-cells:hide;\n         }\n         td.empty{\n            padding:5px;\n\
  \            border-style:solid;\n            border-width:1px;\n            border-color:#999999;\n\
  \         }\n      </style>\n   </head>\n   <body>\n      <table class=\"empty\"\
  >\n      <tr>\n         <th></th>\n         <th>标题一</th>\n         <th>标题二</th>\n\
  \      </tr>\n      <tr>\n         <th>行标题</th>\n         <td class=\"empty\">值</td>\n\
  \         <td class=\"empty\">值</td>\n      </tr>\n      <tr>\n         <th>行标题</th>\n\
  \         <td class=\"empty\">值</td>\n         <td class=\"empty\"></td>\n     \
  \ </tr>\n      </table>\n   </body>\n</html>\n```\n\n## `Table-Layout`\n\n该属性旨在帮助你控制浏览器如何布局或渲染表格。它可以取以下三个值之一\
  \ – `inherit`、`auto` 或 `fixed`。下一个示例展示了\n\n```html\n<html>\n   <head>\n      <style\
  \ type=\"text/css\">\n         table.auto {\n            table-layout: auto\n  \
  \       }\n         table.fixed{\n            table-layout: fixed\n         }\n\
  \      </style>\n   </head>\n   <body>\n      <table class=\"auto\" border=\"1\"\
  \ width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
  \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
  \      </tr>\n      </table>\n      <br />\n      <table class=\"fixed\" border=\"\
  1\" width=\"100%\">\n      <tr>\n         <td width=\"20%\">1000000000000000000000000000</td>\n\
  \         <td width=\"40%\">10000000</td>\n         <td width=\"40%\">100</td>\n\
  \      </tr>\n      </table>\n   </body>\n</html>\n```\n\n# 第 12 章：边框\n\n边框属性允许你指定元素框的边框外观。以下是你可以控制的三个属性：\n\
  \n*   `Border-color` – 允许你指定边框的颜色\n*   `Border-style` – 允许你从一系列值中选择样式，包括实线、虚线、双线等\n\
  *   `Border-width` – 允许你指定边框的宽度\n\n## `Border-Color`\n\n该属性允许你更改元素周围边框的颜色。你可以使用以下属性单独更改边框的每一侧：\n\
  \n*   `Border-bottom-color`\n*   `Border-top-color`\n*   `Border-left-color`\n*\
  \   `Border-right-color`\n\n以下示例展示了所有四个属性的使用：\n\n```html\n<html>\n   <head>\n  \
  \    <style type=\"text/css\">\n         p.example1{\n            border:1px solid;\n\
  \            border-bottom-color:#009900; /* 绿色 */\n            border-top-color:#FF0000;\
  \    /* 红色 */\n            border-left-color:#330000;   /* 黑色 */\n            border-right-color:#0000CC;\
  \  /* 蓝色 */\n         }\n         p.example2{\n            border:1px solid;\n \
  \           border-color:#009900;        /* 绿色 */\n         }\n      </style>\n\
  \   </head>\n   <body>\n      <p class=\"example1\">\n      此示例展示了所有边框以不同颜色显示。\n\
  \      </p>\n      <p class=\"example2\">\n      此示例展示了所有边框仅以绿色显示。\n      </p>\n\
  \   </body>\n</html>\n```\n\n\n\n结果将是\n\n此示例展示了所有边框以不同颜色显示。\n\n此示例展示了所有边框仅以绿色显示。\n\
  \n## 边框样式（Border-style）\n\n此属性允许你选择以下样式之一：\n\n*   None（无） – 完全没有边框\n*   Solid（实线）\
  \ – 边框为实线\n*   Dotted（点线） – 边框由点组成\n*   Dashed（虚线） – 边框由短线段组成\n*   Double（双线） –\
  \ 两条实线\n*   Groove（凹槽） – 使边框看起来像刻入页面\n*   Ridge（脊状） – 与凹槽效果相反\n*   Inset（内嵌） – 盒子看起来嵌入页面\n\
  *   Outset（外凸） – 盒子看起来从页面凸出\n*   Hidden（隐藏） – 与 None 完全相同，但针对表格元素的边框冲突解决有例外\n\n\
  与颜色一样，你可以使用以下属性单独更改边框每一侧的样式：\n\n*   `Border-bottom-style`\n*   `Border-top-style`\n\
  *   `Border-left-style`\n*   `Border-right-style`\n\n此示例使用了所有这四种样式：\n\n```html\n\
  <html>\n\n   <head>\n\n   </head>\n\n   <body>.\n\n      <p style=\"border-width:4px;\
  \ border-style:none;\">\n\n      This is a border with a width of none.\n\n    \
  \  </p>\n\n      <p style=\"border-width:4px; border-style:solid;\">\n\n      This\
  \ is a solid border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:dashed;\"\
  >\n\n      This is a dashed border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
  \ border-style:double;\">\n\n      This is a double border.\n\n      </p>\n\n  \
  \    <p style=\"border-width:4px; border-style:groove;\">\n\n      This is a groove\
  \ border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:ridge\"\
  >\n\n      This is a ridge border.\n\n      </p>\n\n      <p style=\"border-width:4px;\
  \ border-style:inset;\">\n\n      This is an inset border.\n\n      </p>\n\n   \
  \   <p style=\"border-width:4px; border-style:outset;\">\n\n      This is an outset\
  \ border.\n\n      </p>\n\n      <p style=\"border-width:4px; border-style:hidden;\"\
  >\n\n      This is a hidden border.\n\n      </p>\n\n      <p style=\"border-width:4px;border-top-style:solid;\n\
  \n      border-bottom-style:dashed; border-left-style:groove; border-right-style:double;\"\
  >\n\n      This is a border with four different styles.\n\n      </p>\n\n   </body>\n\
  \n</html>\n```\n\n结果将是 -\n\n这是一个宽度为 none 的边框。\n\n这是一个实线边框。\n\n这是一个虚线边框。\n\n这是一个双线边框。\n\
  \n这是一个凹槽边框。\n\n这是一个脊状边框。\n\n这是一个内嵌边框。\n\n这是一个外凸边框。\n\n这是一个隐藏边框。\n\n这是一个具有四种不同样式的边框。\n\
  \n## 边框宽度（Border-Width）\n\n这允许你设置边框的宽度，使用 pt、px 或 cm 的长度值，或者你可以将其设置为 thick（粗）、medium（中）或\
  \ thin（细）。你可以使用以下属性单独更改边框的每一侧：\n\n*   `border-bottom-width`\n*   `border-top-width`\n\
  *   `border-left-width`\n*   `border-right-width`\n\n此示例使用了所有这些属性：\n\n```html\n\
  <html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"border-width:4px;\
  \ border-style:solid;\">\n\n      This is a solid border with a width of 4px.\n\n\
  \      </p>\n\n      <p style=\"border-width:4pt; border-style:solid;\">\n\n   \
  \   This is a solid border whose width is 4pt.\n\n      </p>\n\n      <p style=\"\
  border-width:thin; border-style:solid;\">\n\n      This is a solid border whose\
  \ width is thin.\n\n      </p>\n\n      <p style=\"border-width:medium; border-style:solid;\"\
  >\n\n      This is a solid border whose width is medium;\n\n      </p>\n\n     \
  \ <p style=\"border-width:thick; border-style:solid;\">\n\n      This is a solid\
  \ border whose width is thick.\n\n      </p>\n\n      <p style=\"border-bottom-width:4px;border-top-width:10px;\n\
  \n      border-left-width: 2px;border-right-width:15px;border-style:solid;\">\n\n\
  \      This is a border with four different widths.\n\n      </p>\n\n   </body>\n\
  \n</html>\n```\n\n结果将是：\n\n这是一个宽度为 4px 的实线边框。\n\n这是一个宽度为 4pt 的实线边框。\n\n这是一个宽度为 thin（细）的实线边框。\n\
  \n这是一个宽度为 medium（中）的实线边框；\n\n这是一个宽度为 thick（粗）的实线边框。\n\n这是一个具有四种不同宽度的边框。\n\n## 边框简写属性（Shorthand\
  \ Border Properties）\n\n使用简写边框属性，你可以仅用一个属性而不是三个来指定线条的样式、颜色和宽度。以下示例使用 border 属性将三者合并，你会发现这是为元素设置边框最常用的方法：\n\
  \n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"border:4px\
  \ solid red;\">\n\nAnother example:\n\n      </p>\n\n   </body>\n\n</html>\n```\n\
  \n# 第 13 章：边距（Margins）\n\n最后一章讨论 margin 属性，即 HTML 元素周围的空间。Margin 属性值不会被子元素继承，并且你也可以使用负值来重叠内容。\n\
  \n请记住——相邻的垂直边距（即上边距和下边距）会相互折叠，因此每个块之间的距离**不是**边距之和；而是取较大的边距，如果两者大小相同，则等于其中一个边距。\n\
  \n可以使用以下属性：\n\n*   `Margin` – 指定在一个声明中设置所有边距属性的简写\n*   `Margin-bottom` – 指定下边距\n\
  *   `Margin-top` – 指定上边距\n*   `Margin-left` – 指定左边距\n*   `Margin-right` – 指定右边距\n\
  \n现在我们将看看这些属性是如何使用的。\n\n## 边距属性（Margin Property）\n\n这是一个简写属性，允许你通过单个声明设置所有四个边距的属性。以下示例展示了如何为段落设置边距：\n\
  \n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"margin:\
  \ 15px; border:1px solid black;\">\n\n      all four margins will be 15px\n\n  \
  \    </p>\n\n      <p style=\"margin:10px 2%; border:1px solid black;\">\n\n   \
  \   top and bottom margin will be 10px, left and right margin will be 2% of the\
  \ total width of the document.\n\n      </p>\n\n      <p style=\"margin: 10px 2%\
  \ -10px; border:1px solid black;\">\n\n      top margin will be 10px, left and right\
  \ margin will be 2% of the total width of the document, bottom margin will be -10px\n\
  \n      </p>\n\n      <p style=\"margin: 10px 2% -10px auto; border:1px solid black;\"\
  >\n\n      top margin will be 10px, right margin will be 2% of the total width of\
  \ the document, bottom margin will be -10px, left margin will be set by the browser\n\
  \n      </p>\n\n   </body>\n\n</html>\n```\n\n你将看到以下结果 -\n\n所有四个边距均为 15px\n\n上边距和下边距为\
  \ 10px，左边距和右边距为文档总宽度的 2%。\n\n上边距为 10px，左边距和右边距为文档总宽度的 2%，下边距为 -10px\n\n上边距为 10px，右边距为文档总宽度的\
  \ 2%，下边距为 -10px，左边距由浏览器设置\n\n## 下边距（Margin-Bottom）\n\n这允许你使用 auto、长度或百分比值设置下边距：\n\
  \n```html\n<html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"margin-bottom:\
  \ 15px; border:1px solid black;\">\n\n      This is a paragraph with a specified\
  \ bottom margin.\n\n      </p>\n\n      <p style=\"margin-bottom: 5%; border:1px\
  \ solid black;\">\n\n      This is another paragraph with a specified bottom margin\
  \ in percent\n\n      </p>\n\n   </body>\n\n</html>\n```\n\n结果将是 -\n\n这是一个指定了下边距的段落。\n\
  \n这是另一个以百分比指定了下边距的段落。\n\n## 上边距（Margin-Top）\n\n这允许你指定上边距，并使用 auto、长度或百分比值：\n\n```html\n\
  <html>\n\n   <head>\n\n   </head>\n\n   <body>\n\n      <p style=\"margin-top: 15px;\
  \ border:1px solid black;\">\n\n      This is a paragraph with a specified top margin\n\
  \n      </p>\n\n      <p style=\"margin-top: 5%; border:1px solid black;\">\n\n\
  \      This is another paragraph with a specified top margin in percent\n\n    \
  \  </p>\n\n   </body>\n\n</html>\n```\n\n结果如下 -\n\n这是一个指定了上边距的段落。\n\n\n\n\n\n这是另一个段落，指定了百分比形式的上外边距。\n\
  \n## `Margin-Left`\n\n该属性允许你设置左外边距，可以使用 `%`、`auto` 或 `length` 作为值。\n\n```html\n\
  <html>\n   <head>\n   </head>\n   <body>\n      <p style=\"margin-left: 15px; border:1px\
  \ solid black;\">\n      This is a paragraph with a specified left margin\n    \
  \  </p>\n      <p style=\"margin-left: 5%; border:1px solid black;\">\n      This\
  \ is another paragraph with a specified top margin in percent\n      </p>\n   </body>\n\
  </html>\n```\n\n结果如下所示——\n\n这是一个指定了左外边距的段落\n\n这是另一个指定了百分比形式的上外边距的段落\n\n## `Margin-Right`\n\
  \n该属性允许你指定右外边距，可以使用 `auto`、`length` 或 `%` 作为值。\n\n```html\n<html>\n   <head>\n \
  \  </head>\n   <body>\n      <p style=\"margin-right: 15px; border:1px solid black;\"\
  >\n      This is a paragraph with a specified right margin\n      </p>\n      <p\
  \ style=\"margin-right: 5%; border:1px solid black;\">\n      This is another paragraph\
  \ with a specified right margin in percent\n      </p>\n   </body>\n</html>\n```\n\
  \n结果将如下所示——\n\n这是一个指定了右外边距的段落\n\n这是另一个指定了百分比形式的右外边距的段落\n\n# 结语\n\n感谢您购买我的书，希望它对您有所帮助。正如您所见，对于任何想要进入网页设计世界的人来说，CSS\
