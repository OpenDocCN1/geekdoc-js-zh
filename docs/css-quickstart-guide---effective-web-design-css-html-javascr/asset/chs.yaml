- "# CSS：快速启动指南 - 高效网页设计（CSS、HTML、JavaScript、编程）\n\n\n\n\n# 引言\n\nCSS，即层叠样式表（Cascading\
  \ Style Sheets）的缩写，是所有设计语言中最简单的一种，也是实现最高效网页设计所必需的语言。CSS 将处理网页的外观和感觉；你可以设置文本颜色、字体样式、段落间距、网页列的布局和大小、背景所需的颜色和图像，以及所有其他布局和设计变化，以使你的网站在不同屏幕尺寸和设备上正常工作。\n\
  \nCSS 非常容易理解和学习，它让你能够强有力地控制 HTML 文档的呈现方式。它通常与两种更流行的标记语言（HTML 或 XHTML）结合使用，为你提供制作设计精良网站所需的所有工具。\n\
  \n本书将带你了解 CSS 可以控制的网页设计的所有主要方面，并附有示例代码。我希望，在阅读完本书后，你能对 CSS 的易用性以及它能产生的惊人效果有所了解。\n\
  \n# 第 1 章：使用 CSS 的优势\n\nCSS 相比其他类似程序有许多优势，包括：\n\n节省时间——使用 CSS，你可以编写一次样式表，然后在多个不同的\
  \ HTML 页面中使用完全相同的样式表。每个 HTML 元素都可以拥有自己独立的样式，并可应用于多个网页。\n\n更快的页面加载速度——使用 CSS 时，无需每次都编写\
  \ HTML 标签属性。相反，你可以为某个标签编写一条规则，然后将其应用于该标签的每次出现。更少的代码意味着更快的加载速度。\n\n易于维护——当你想要进行全局更改时，只需更改样式；所有使用该样式的网页中与该样式相关的每个元素都将被更改。\n\
  \n在样式上优于 HTML——CSS 提供了比 HTML 更广泛的属性访问范围，因此你的 HTML 页面看起来会比使用 HTML 属性更好。\n\n兼容多种设备——你的样式表允许内容针对多种设备类型进行优化。例如，使用相同的\
  \ HTML 文档，你可以为打印、PDA 或移动设备生成不同的网站版本。\n\n全球网络标准——越来越多地推荐使用 CSS 而非 HTML，所以现在是开始学习并将其应用于所有\
  \ HTML 页面的好时机。这样，它们将与未来的浏览器兼容。\n\n离线浏览——CSS 能够通过离线缓存本地存储应用程序。这意味着你将更容易查看离线网站，并且由于缓存，它们加载速度更快，网站性能更好。\n\
  \n如你所见，CSS 相比 HTML 提供了大量优势，尤其是它现在已成为公认的标准。随着 CSS 越来越流行，现在正是开始学习的最佳时机。\n\n闲话少说，让我们深入探讨用于网页设计的\
  \ CSS 元素。\n\n在进一步讲解之前，我必须说明，本书中使用的一些示例代码归功于 www.tutorialspoint.com。\n\n# 第 2 章：CSS\
  \ 模块\n\nCSS 模块采用了现有的 CSS 规范以及一些扩展功能，包括：\n\n*   选择器\n*   盒模型\n*   图像值\n*   背景和边框\n\
  *   替换内容\n*   文本效果\n*   2D 和 3D 变换\n*   动画\n*   多列布局\n*   用户界面\n\nCSS 由一系列样式规则组成，这些规则由浏览器解释后应用于文档的正确元素。样式规则分为三部分：\n\
  \n选择器——这是应用样式的 HTML 标签。这些标签的示例有`<h1>`或`<table>`。\n\n*   属性——属性是 HTML 标签属性的类型。简单来说，所有\
  \ HTML 属性都转换为 CSS 属性，例如`color`、`border`等。\n\n*   值——每个属性被赋予一个或多个值。例如，颜色属性的值可以是红色或`#F2F2F2`等。\n\
  \nCSS 样式规则的语法为：\n\n```\nselector { property: value }\n```\n\n例如，你可以为表格定义边框：\n\n\
  ```\ntable{ border :1px solid #C00; }\n```\n\n\n\n\n在这个例子中，`table` 是一个选择器，`border`\
  \ 是一个属性。它被赋予了 `1px solid #C00` 的值。\n\n选择器可以通过多种方式定义，下面我们逐一介绍：\n\n## 类型选择器\n\n上面你已经看到了类型选择器的例子，但让我们再看一个——为所有一级标题添加颜色的方法：\n\
  \n```css\nh1 {\n    color: #36CFFF;\n}\n```\n\n## 通用选择器\n\n这个选择器不是选择与特定类型相关的元素，而是直接匹配元素类型的名称。例如：\n\
  \n```css\n* {\n    color: #000000;\n}\n```\n\n在这个例子中，所有元素的内容都变成了黑色。\n\n## 后代选择器\n\
  \n假设你想给某个特定元素设置样式，但仅当它位于另一个特定元素内部时。在下面的例子中，我们将样式规则应用于 `<em>` 元素，但仅当它位于 `<ul>` 标签之外时：\n\
  \n```css\nul em {\n    color: #000000;\n}\n```\n\n## 类选择器\n\n类选择器允许你使用元素的 `class`\
  \ 属性来定义样式规则。所有属于该特定类的元素都会按照定义的规则进行格式化：\n\n```css\n.black {\n    color: #000000;\n\
  }\n```\n\n在这个例子中，规则将所有 `class` 属性为 `black` 的元素内容变为黑色。如果你愿意，还可以更进一步：\n\n```css\n\
  h1.black {\n    color: #000000;\n}\n```\n\n现在你指定了只有 `<h1>` 元素中 `class` 属性为 `black`\
  \ 的内容才会变为黑色。\n\n不过，一个元素并不限于只能使用一个类选择器。请看这个例子：\n\n```html\n<p class=\"center bold\"\
  >\n该段落的样式由 Bold 和 Center 这两个类定义。\n</p>\n```\n\n## ID 选择器\n\n样式规则可以定义在元素的 `id` 属性上，一旦定义了规则，它将格式化所有具有指定\
  \ `id` 属性的元素：\n\n```css\n#black {\n    color: #000000;\n}\n```\n\n这条规则会将所有 `id`\
  \ 属性为 `black` 的元素内容变为黑色。如果你愿意，可以更具体一些，例如：\n\n```css\nh1#black {\n    color: #000000;\n\
  }\n```\n\n这条规则仅当 `<h1>` 元素的 `id` 属性设置为 `black` 时，才将其内容变为黑色。\n\nID 选择器的真正威力在于它们作为后代选择器的基础时体现出来，例如：\n\
  \n```css\n#black h2 {\n    color: #000000;\n}\n```\n\n这里可以看到，所有二级标题只有在位于 `id` 属性设置为\
  \ `black` 的标签内部时，才会变为黑色。\n\n## 子选择器\n\n子选择器与后代选择器类似，但功能不同。请看这个例子：\n\n```css\nbody\
  \ > p {\n    color: #000000;\n}\n```\n\n这将使段落变为黑色，但仅当它们是 `<body>` 元素的直接子元素时。其他位于其他元素（如\
  \ `<td>` 或 `<div>`）内部的段落不会改变。\n\n## 属性选择器\n\n样式也可以应用于具有特定属性的 HTML 元素。请看下面的例子；你可以看到样式规则将匹配所有\
  \ `type` 属性值为 `text` 的 `input` 元素：\n\n```css\ninput[type=\"text\"] {\n    color:\
  \ #000000;\n}\n```\n\n使用这种方法的优点是 `<input type=\"submit\" />` 不会受到影响，颜色变化仅应用于特定的文本字段。\n\
  \n以下是属性选择器的规则：\n\n*   `p[lang]` - 选择所有具有 `lang` 属性的段落元素\n*   `p[lang=\"fr\"]` –\
  \ 选择所有 `lang` 属性精确值为 `\"fr\"` 的段落元素\n*   `p[lang~=\"fr\"]` – 选择所有 `lang` 属性包含 `\"\
  fr\"` 的段落元素\n*   `p[lang|=\"en\"]` – 选择所有 `lang` 属性精确值为 `\"en\"` 或以 `\"en-\"` 开头的段落元素\n\
  \n## 多重样式规则\n\n可以为单个元素定义多条样式规则，这些规则应组合成一个块，包含多个属性及其对应的值，如下例所示：\n\n```css\nh1 {\n\
  \    color: #36C;\n    font-weight: normal;\n    letter-spacing: .4em;\n    margin-bottom:\
  \ 1em;\n    text-transform: lowercase;\n}\n```\n\n在这个例子中，你可以看到每对属性和值之间用分号（`;`）分隔。它们可以放在一行，也可以分散在多行，但为了便于阅读，我们将其放在单独的行上。\n\
  \n## 分组选择器\n\n样式可以应用于多个选择器。你只需记住用逗号分隔每个选择器，如下例所示：\n\n```css\nh1, h2, h3 {\n    color:\
  \ #36C;\n    font-weight: normal;\n    letter-spacing: .4em;\n    margin-bottom:\
  \ 1em;\n    text-transform: lowercase;\n}\n```\n\n这条样式规则将应用于所有 `h1`、`h2` 和 `h3`\
  \ 元素。列表中的顺序无关紧要，因为选择器中的所有元素都将应用这些声明。从下面的例子可以看出，可以组合多个类选择器：\n\n```css\n#content,\
  \ #footer, #supplement {\n    position: absolute;\n    left: 510px;\n    width:\
  \ 200px;\n}\n```\n\n# 第 3 章：包含方式\n\n你有四种方法将样式与 HTML 文档关联起来，其中最常用的是内联 CSS 和外部 CSS\
  \ 方法。\n\n## 嵌入式 CSS\n\nCSS 规则可以通过使用 `<style>` 元素放入 HTML 文档中。该标签位于 `<head>…</head>`\
  \ 标签内，使用此语法定义的规则适用于所有可用元素。下面的例子展示了一个嵌入式 CSS 样式元素：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n   <head>\n      <style type=\"text/css\" media=\"all\">\n         body\
  \ {\n            background-color: linen;\n         }\n         h1 {\n         \
  \   color: maroon;\n            margin-left: 40px;\n         }\n      </style>\n\
  \   </head>   \n   <body>\n      <h1>这是一个标题</h1>\n      <p>这是一个段落。</p>\n   </body>\n\
  </html>\n```\n\n### 属性\n\n与 `<style>` 元素相关的常见属性如下表所示：\n\n| 属性 | 值 | 描述 |\n| ---\
  \ | --- | --- |\n| `type` | `text/css` | 该属性将样式表的语言指定为 MIME 内容类型，是必需属性 |\n| `media`\
  \ | `screen` `tty` `tv` `projection` `handheld` `print` `braille` `aural` `all`\
  \ | 指定文档将在哪种设备上显示。默认值为 `all`，属于可选属性 |\n\n## 内联 CSS\n\n你也可以使用任何 HTML 元素的 `style`\
  \ 属性来定义规则。这些特定规则仅应用于该特定元素。通用语法为：\n\n```html\n<element style=\"...样式规则....\">\n```\n\
  \n### 属性\n\n`style` 属性的值由不同的样式声明混合而成，每个声明之间用分号分隔。以下示例基于通用语法：\n\n```html\n<html>\n\
  \   <head>\n   </head>\n   <body>\n      <h1 style=\"color:#36C;\"> 这是内联 CSS </h1>\n\
  \   </body>\n</html>\n```\n\n## 外部 CSS - `<link>` 元素\n\n你可以使用 `<link>` 元素将外部样式表包含到\
  \ HTML 文档中。外部样式表是独立的文本文件，扩展名为 `.css`。你将在该文件中定义所有样式规则，然后可以通过 `<link>` 元素将其添加到任何 HTML\
  \ 文档中。通用语法为：\n\n```html\n<head>\n   <link type=\"text/css\" href=\"...\" media=\"\
  ...\" />\n</head>\n```\n\n### 属性\n\n与 `<style>` 元素相关的属性如下：\n\n| 属性 | 值 | 描述 |\n\
  | --- | --- | --- |\n| `type` | `text/css` | 将样式表的语言指定为 MIME 内容类型，是必需属性 |\n| `href`\
  \ | `URL` | 指定样式表包含样式规则，也是必需属性 |\n| `media` | `screen` `tty` `tv` `projection` `handheld`\
  \ `print` `braille` `aural` `all` | 指定文档可以在哪些设备上显示，是可选属性。默认值为 `all` |\n\n例如，考虑一个名为\
  \ `mystyle.css` 的样式表，其中包含以下规则：\n\n\n\n\n```\nh1, h2, h3 {\n   color: #36C;\n   font-weight:\
  \ normal;\n   letter-spacing: .4em;\n   margin-bottom: 1em;\n   text-transform:\
  \ lowercase;\n}\n```\n\n现在，使用以下代码，你可以将这个文件添加到任何 HTML 文档中：\n\n```\n<head>\n   <link\
  \ type = \"text/css\" href = \"mystyle.css\" media = \" all\" />\n</head>\n```\n\
  \n## 导入 CSS - @import 规则\n\n`@import` 规则用于导入外部样式表，其方式与 `<link>` 元素类似。通用语法如下：\n\n\
  ```\n<head>\n   <@import \"URL\";\n</head>\n```\n\n在此语法中，`URL` 用作包含样式规则的特定样式表的 URL。另一种写法是：\n\
  \n```\n<head>\n   <@import url(\"URL\");\n</head>\n```\n\n以下示例展示了如何将样式表导入 HTML 文档：\n\
  \n```\n<head>\n   @import \"mystyle.css\";\n</head>\n```\n\n## 覆盖 CSS 规则\n\n到目前为止，我们已经了解了在\
  \ HTML 文档中包含样式表的四种不同方式。现在我们来看看如何覆盖任何样式表规则：\n\n*   内联样式表拥有最高优先级，包括覆盖外部样式表或 `<style>\
  \ … </style>` 标签中定义的任何规则。\n*   任何 `<style> … </style>` 标签都会覆盖外部样式表文件。\n*   外部样式表规则的优先级最低，仅当内联样式或\
  \ `<style> … </style>` 标签未应用时才会生效。\n\n## 如何处理旧版浏览器\n\n有不少较旧的浏览器不支持 CSS，因此当你在 HTML\
  \ 文档中编写嵌入式 CSS 时，请务必小心。以下示例展示了如何使用注释标签来对旧版浏览器隐藏 CSS：\n\n```\n<style type=\"text/css\"\
  >\n   <!--\n      body, td {\n         color: blue;\n      }\n   -->\n</style>\n\
  ```\n\n## CSS 注释\n\n有时你需要在样式表块中添加额外的注释，但注释样式表的任何部分都非常容易。你只需将注释放在 `/*…. 这是样式表中的注释\
  \ …. */` 中即可。\n\n你也可以使用 `/*…. */` 来注释多行块，就像在 C 或 C++ 语言中那样。\n\n例如：\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n   <head>\n      <style>\n         p {\n            color: red;\n\
  \            /* 单行注释 */\n            text-align: center;\n         }\n         /*\
  \ 多行注释 */\n      </style>\n   </head>\n   <body>\n      <p>Hello World!</p>\n  \
  \ </body>\n</html>\n```\n\n这将在屏幕上显示“Hello, World!”。\n\n# 第 4 章：度量单位\n\nCSS 支持多种不同的度量单位，包括相对度量（如百分比）和绝对单位（如厘米、英寸、点等）。当你在样式规则中指定度量值时，需要使用这些值，例如\
  \ `border = “1px solid red”`。\n\n下表列出了 CSS 度量单位及其示例：\n\n| 单位 | 描述 | 示例 |\n| ---\
  \ | --- | --- |\n| % | 将度量定义为相对于其他值的百分比。典型情况是相对于包含元素。 | `p {font-size: 16pt; line-height:\
  \ 125%;}` |\n| cm | 以厘米为单位定义度量 | `div {margin-bottom: 2cm;}` |\n| em | 以 em 空格为单位的字体高度相对度量。一个\
  \ em 单位相当于任何给定字体的大小，因此如果你为字体分配 12 pt，每个 em 单位就是 12 pt。这意味着 2em 等于 24 pt。 | `p {letter-spacing:\
  \ 7em;}` |\n| ex | 定义相对于字体 x 高度的度量。x 高度由指定字体中小写字母 x 的高度决定。 | `p {font-size: 24pt;\
  \ line-height: 3ex;}` |\n| in | 以英寸为单位定义度量 | `p {word-spacing: .15in;}` |\n| mm\
  \ | 以毫米为单位定义度量 | `p {word-spacing: 15mm;}` |\n| pc | 以派卡为单位定义度量，1 派卡等于 12 点。这意味着\
  \ 1 英寸等于 6 派卡。 | `p {font-size: 20pc;}` |\n| pt | 以点为单位定义度量，1 点定义为 1/72 英寸 | `body\
  \ {font-size: 18pt;}` |\n| px | 以屏幕像素为单位定义度量 | `p {padding: 25px;}` |\n| vh | 视口高度的\
  \ 1% | `h2 { font-size: 3.0vh; }` |\n| vw | 视口宽度的 1% | `h1 { font-size: 5.9vw; }`\
  \ |\n| vmin | 1vw 或 1vh 中的较小值 | `p { font-size: 2vmin;}` |\n\n# 第 5 章：颜色\n\n在 CSS\
  \ 中，我们使用值来指定颜色。通常，这些值用于设置元素文本的颜色（即前景色）或元素的背景色。我们也可以使用它们来改变装饰效果（如边框）的颜色。\n\n颜色值可以用几种不同的格式指定，如下表所示：\n\
  \n| 格式 | 语法 | 示例 |\n| --- | --- | --- |\n| 十六进制代码 | `#RRGGBB` | `p{color:#FF0000;}`\
  \ |\n| 短十六进制代码 | `#RGB` | `p{color:#6A7;}` |\n| RGB 百分比 | `rgb(rrr%,ggg%,bbb%)`\
  \ | `p{color:rgb(50%,50%,50%);}` |\n| RGB 绝对值 | `rgb(rrr,ggg,bbb)` | `p{color:rgb(0,0,255);}`\
  \ |\n| 关键字 | `aqua, black, 等` | `p{color:teal;}` |\n\n让我们更详细地了解这些格式：\n\n## 十六进制代码\n\
  \n十六进制是 6 位颜色表示。第一位 `RR` 表示红色值，`GG` 表示绿色值，`BB` 表示蓝色值。\n\n这些值可以从图形软件（如 JASC Paintshop\
  \ Pro、Adobe Photoshop、Advanced Paintbrush 等）中获取。每个十六进制代码前面都有一个 # 或 £ 符号，以下是十六进制表示法的示例：\n\
  \n| 颜色 | 颜色十六进制 |\n| --- | --- |\n|  | `#000000` |\n|  | `#FF0000` |\n|  | `#00FF00`\
  \ |\n|  | `#0000FF` |\n|  | `#FFFF00` |\n|  | `#00FFFF` |\n|  | `#FF00FF` |\n| \
  \ | `#C0C0C0` |\n|  | `#FFFFFF` |\n\n## 短十六进制代码\n\n这只是十六进制代码的较短版本，每个数字会被复制，从而得到等效的\
  \ 6 位值。这些值也可以从图形软件中获取，并且前面也有 # 或 £ 符号：\n\n| 颜色 | 颜色十六进制 |\n| --- | --- |\n|  | `#000`\
  \ |\n|  | `#F00` |\n|  | `#0F0` |\n|  | `#0FF` |\n|  | `#FF0` |\n|  | `#0FF` |\n\
  |  | `#F0F` |\n|  | `#FFF` |\n\n## RGB 值\n\n我们使用 `rgb()` 属性来指定此值，该属性接受三个值——红色、绿色和蓝色。值可以是百分比或\
  \ 0 到 255 之间的整数。请注意，并非所有浏览器都支持 `rgb()`，因此尽量少用。\n\n| 颜色 | 颜色 RGB |\n| --- | --- |\n\
  |  | `rgb(0,0,0)` |\n|  | `rgb(255,0,0)` |\n|  | `rgb(0,255,0)` |\n|  | `rgb(0,0,255)`\
  \ |\n|  | `rgb(255,255,0)` |\n|  | `rgb(0,255,255)` |\n|  | `rgb(255,0,255)` |\n\
  |  | `rgb(192,192,192)` |\n|  | `rgb(255,255,255)` |\n\n## 构建颜色代码\n\n如果你使用 CSS 颜色代码生成器，你可以构建数百万种不同的颜色代码，但你需要一个支持\
  \ Java 的浏览器才能做到这一点。\n\n## 浏览器安全颜色\n\n下表显示了 216 种被认为是安全且与计算机无关的颜色。它们从十六进制代码 `000000`\
