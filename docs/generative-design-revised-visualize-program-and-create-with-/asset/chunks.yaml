    ## P.3.2.1 Dissolving the font outline


    A text is made up of characters. A character, in turn, is shaped by its outlines.
    In the following chapters, this outline dissipates into a multitude of points
    and will establish the basis for generative font manipulation. Individual points
    are replaced by other elements, thereby disguising the original font.


    **→ P_3_2_1_01**


    The starting point is a text and a font file. The `opentype.js` Library, designed
    by Frederik De Bleser, generates a multitude of points onto the font outline.
    This information can then be used to give the characters new visual identities.


    ![image](images/f0170-01.jpg)


    ![image](images/f0170-02.jpg)


    **→ P_3_2_1_02** SVGs are loaded and placed on the character outline in this version
    of the program. Rotation angles and scaling can be controlled with the mouse.


    **1**


    ```

    function setup() {

    ...

    opentype.load(''data/FreeSans.otf'', function(err, f) {

    font = f;

    loop();

    });

    }

    ```


    | **1** | The `opentype.js` library loads the font file and stores it in the `font`
    variable. |


    ```

    function draw() {

    ...

    if (textTyped.length > 0) {

    **2**

    var fontPath = font.getPath(textTyped, 0, 0, 200);

    **3**

    var path = new g.Path(fontPath.commands);

    **4**

    path = g.resampleByLength(path, 11);

    stroke(181, 157, 0);

    strokeWeight(1.0);

    var l = 5;

    **5**

    for (var i = 0; i < path.commands.length; i++) {

    var pnt = path.commands[i];

    line(pnt.x - l, pnt.y - l, pnt.x + l, pnt.y + l);

    }

    fill(0);

    noStroke();

    var diameter = 7;

    for (var i = 0; i < path.commands.length; i++) {

    var pnt = path.commands[i];

    **6**

    if (i % 2 == 0) {

    ellipse(pnt.x, pnt.y, diameter, diameter);

    }

    }

    }

    ...

    }

    ```


    | **2** | There are three steps to extract the points: first, the `getPath()`
    function of the `opentype.js` library converts the characters to path. |

    | **3** | This is then converted to a `g.Path` object (`g.js` is another library).
    |

    | **4** | The command `resampleByLength()` divides this path into sections of
    equal length (here eleven pixels). |

    | **5** | The dots are processed. Short, angled lines are first drawn on their
    positions.![image](images/f0171-01.jpg) |

    | **6** | Next, black circles are processed. In this run, only every second position
    is used.![image](images/f0171-02.jpg) |


    | Key | Description |

    |-----|-------------|

    | Keyboard | Text input |

    | DEL | Delete letters |

    | CTRL | Save image |


    ![image](images/f0171-03.jpg)


    **→ P_3_2_1_01** Graphic elements are placed on character outlines.


    ![image](images/f0172-01.jpg)


    **→ P_3_2_1_02** The appearance of the generated character forms can be regulated
    by the scaling and rotation of the elements on the character outlines.


    ## **P.3.2.2 Varying the font outline**


    If the font outline is not made up of straight lines or curves but controllable
    elements instead, then we increasingly free ourselves from the underlying font.
    All existing base points are joined together with specially formed Bézier curves.
    This is just one of the myriad ways of quickly creating dozens of new fonts.


    **→ P_3_2_2_01**


    The dots on the text outline are connected with Bézier curves. The shape of the
    curves can be controlled interactively with the mouse.


    ![image](images/f0174-01.jpg)


    ![image](images/f0174-02.jpg)


    **→ P_3_2_2_01** Different settings for the height and rotation of the Bézier
    curves.


    ```

    function draw() {

    ...

    if (textTyped.length() > 0) {

    ...

    **1**

    var addToAngle = map(mouseX, 0, width, -PI, +PI);

    var curveHeight = map(mouseY, 0, height, 0.1, 2);

    **2**

    for (var i = 0; i < path.commands.length-1; i++) {

    var pnt0 = path.commands[i];

    var pnt1 = path.commands[i+1];

    var d = dist(pnt0.x, pnt0.y, pnt1.x, pnt1.y);

    **3**

    if (d > 20) continue;

    **4**

    var stepper = map(i%2, 0, 1, -1, 1);

    var angle = atan2(pnt1.y-pnt0.y, pnt1.x-pnt0.x);

    angle = angle + addToAngle;

    var cx = pnt0.x+cos(angle*stepper)*d*4*curveHeight;

    var cy = pnt0.y+sin(angle*stepper)*d*3*curveHeight;

    **5**

    bezier(pnt0.x,pnt0.y, cx,cy, cx,cy, pnt1.x,pnt1.y);

    }

    }

    }

    ```


    | **1** | The variables `addToAngle` and `curveHeight` result from the x- and
    y-coordinates of the mouse position and control the rotation and height of the
    Bézier curves. |

