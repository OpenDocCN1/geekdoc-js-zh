    ## P.2.2.6 摆上的代理\n\n这些双重代理是可变的并且链接在一起。代理沿着相互关联的摆组移动，留下复杂的轨迹，让人联想到万花尺的绘图。随着时间的推移，它们的秘密任务变得可见。\n\
    \n`→ P_2_2_6_01`\n\n代理形成一条摆链。为了确定代理的各个位置，我们从中心开始。旋转角度和摆的长度决定了第一个代理的位置。这也是下一个摆的旋转中心。越往链外，摆越短，转动越快。每隔一个摆向相反方向转动。\n\
