  trans: "\n\nP.3.1.4 文字图示 166\n\nP.3.2 字体轮廓 170\n\nP.3.2.1 溶解字体轮廓 170\n\nP.3.2.2\
    \ 变化字体轮廓 174\n\nP.3.2.3 来自代理的字体轮廓 178\n\nP.3.2.4 平行字体轮廓 180\n\nP.3.2.5 动态字体 184\n\
    \n## P.3.0 你好，文字\n\n字母变成了空间。在生成基于矢量的字体时，你可以直接影响众多参数，并在时间和空间中用字母进行设计。字符出现的过程以及对其大小和位置的交互式操作都可以变得可见。\n\
    \n**→ P_3_0_01**\n\n字母的大小由鼠标的水平移动控制，而垂直移动则使字母上下移动。当按住鼠标按钮时，字母会留下轨迹。\n\n![image](img/f0152-01.jpg)\n\
    \n![image](img/f0152-02.jpg)\n\n**→ P_3_0_01** 字母留下其变化的轨迹，然后变得无法辨认，并生成新的形态。\n\n\
    **1**\n\n```\nvar font = \"sans-serif\";\nvar letter = \"A\";\n```\n\n| **1**\
    \ | 要使用的字体名称保存在变量 `font` 中。 |\n\n```\nfunction setup() {\n  createCanvas(windowWidth,\
    \ windowHeight);\n  background(255);\n  fill(0);\n  **2**\n  textFont(font);\n\
    \  textAlign(CENTER, CENTER);\n}\n```\n\n| **2** | 函数 `textFont()` 将其设置为当前字体。水平和垂直对齐方式可通过\
    \ `textAlign()` 指定。 |\n\n```\nfunction mouseMoved() {\n  clear();\n  **3**\n \
    \ textSize((mouseX - width / 2) * 5 + 1);\n  text(letter, width / 2, mouseY);\n\
    }\n```\n\n| **3** | 当鼠标移动时，字母大小根据鼠标水平位置的值而变化。字母水平居中于显示窗口的 `width / 2`，垂直位于 `mouseY`\
    \ 位置，并通过 `text()` 命令显示。 |\n\n**4**\n\n```\nfunction mouseDragged() {\n  textSize((mouseX\
    \ - width / 2) * 5 + 1);\n  text(letter, width / 2, mouseY);\n}\n```\n\n| **4**\
    \ | 当按住鼠标按钮移动鼠标时也会发生同样的情况，但此时背景不会获得新颜色，字母会留下轨迹。 |\n\n| 鼠标： | 位置 x：大小 |\n|  | 位置\
    \ y：位置 |\n|  | 拖动：绘制 |\n| 按键： | A–Z：选择字母 |\n|  | CTRL：保存图像 |\n\n![image](img/f0153-01.jpg)\n\
    \n## P.3.1.1 编写基于时间的文本\n\n用自动换行来编排文本并非新鲜事。但当垂直鼠标位置决定行距（行间间距），而输入每个字母前经过的时间决定其大小时，书写的节奏便开始与文本互动。\n\
    \n**→ P_3_1_1_01**\n\n打字时，虚拟的“笔尖”在绘图画布上从左向右移动。当到达右边界时，它会从头开始并换行。行距由垂直鼠标位置定义。测量每次按键之间的时间间隔。时间间隔越大，输入的字母就越大。\n\
    \n![image](img/f0154-01.jpg)\n\n![image](img/f0154-02.jpg)\n\n**→ P_3_1_1_01**\
    \ 垂直鼠标位置定义行距（行间距）。产生不同层次的可读性。\n\n```\nfunction draw() {\n  ...\n  spacing = map(mouseY,\
    \ 0, height, 0, 120);\n  translate(0, 200 + spacing);\n  var x = 0;\n  var y =\
    \ 0;\n  var fontSize = 20;\n  **1**\n  for (var i = 0; i < textTyped.length; i++)\
    \ {\n    **2**\n    fontSize = fontSizes[i];\n    textFont(font, fontSize);\n\
    \    **3**\n    var letter = textTyped.charAt(i);\n    var letterWidth = textWidth(letter)\
    \ + tracking;\n    **4**\n    if (x + letterWidth > width) {\n      x = 0;\n \
    \     y += spacing;\n    }\n    **5**\n    text(letter, x, y);\n    x += letterWidth;\n\
    \  }\n  **6**\n  var timeDelta = millis() - pMillis;\n  newFontSize = map(timeDelta,\
    \ 0, maxTimeDelta, minFontSize, maxFontSize);\n  newFontSize = min(newFontSize,\
    \ maxFontSize);\n  fill(200, 30, 40);\n  if (int(frameCount / 10) % 2 == 0) fill(255);\n\
    \  **7**\n  rect(x, y, newFontSize / 2, newFontSize / 20);\n}\n```\n\n| **1**\
    \ | 变量 `textTyped` 包含输入的文本。现在逐字母处理。 |\n| **2** | `fontSize` 取自数组 `fontSizes[]`\
    \ 中索引 `i` 的值，并将字体设置为该大小。 |\n| **3** | 现在从字符串 `textTyped` 中选取索引 `i` 处的字母，并保存在 `letter`\
    \ 中。此外，字母宽度 `textWidth(letter)` 增加了 `tracking` 的值。 |\n| **4** | 当当前位置加上字符宽度超过绘图画布宽度时，发生换行。因此\
    \ `x` 重置为 0，垂直位置 `y` 增加行距。 |\n| **5** | 在位置 `x`、`y` 处绘制字母。 |\n| **6** | 所有字母绘制完毕后，显示一个闪烁的光标。随着时间的推移，光标会变大，因此需要确定\
    \ `timeDelta`——自上次打字操作以来经过的时间。当前时间通过 `millis()` 函数以毫秒为单位获取。减去上次按键时保存的值 `pMillis`。现在可以将这个时间差转换为\
