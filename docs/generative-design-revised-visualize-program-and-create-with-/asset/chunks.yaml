    ## P.1.0 Hello, color


    The ability to directly influence 16,777,216 colors gives users an amazing freedom.
    Simultaneous contrast—without which it would be impossible to perceive colors—is
    illustrated here by juxtaposing a number of color combinations. Our perception
    of a color is affected by its neighboring color and the shifting proportions of
    that color to its background.


    `→ P_1_0_01`


    The horizontal position of the mouse controls the size of the color field. Starting
    in the center, the colored area is depicted with a height and width of 1 to 720
    pixels. The vertical mouse position controls the hue. The background passes through
    the color spectrum from 0 to 360, while the color field passes through the spectrum
    in the opposite direction, from 360 to 0.


    ![image](images/f0060-01.jpg)


    **1**


    ```

    function setup() {


    createCanvas(720, 720);


    noCursor();


    **2**


    colorMode(HSB, 360, 100, 100);


    rectMode(CENTER);


    noStroke();


    }

    ```


    | **1** | The `setup()` function sets the size of the display window and makes
    the cursor invisible. |


    | **2** | The colors should pass through the hue spectrum in this program. For
    this reason, `colorMode()` allows users to change the way color value is interpreted.
    `HSB` specifies the color model, and the three values following it specify the
    respective range. Hue, for example, can only be specified by values between 0
    and 360. |


    ```

    function draw() {


    **3**


    background(mouseY / 2, 100, 100);


    **4**


    fill(360 - mouseY / 2, 100, 100);


    **5**


    rect(360, 360, mouseX + 1, mouseX + 1);


    }

    ```


    | **3** | The y-value of the mouse position is divided by 2 to get values from
    0 to 360 on the color wheel. |


    | **4** | The halved y-value of the mouse position is subtracted from 360, creating
    values from 360 to 0. |


    | **5** | The size of the color field changes relative to the x-value of the mouse
    position, with a side length between 1 and 720 pixels. |


    | Mouse: | Position x: Size of rectangle |

    |  | Position y: Hue |

    | Keys: | S: Save image |


    ![image](images/f0061-01.jpg)


    `→ P_1_0_01` The x-value of the mouse position defines the size of the inside
    color field, the y-value the hue.


    ## P.1.1.1 Color spectrum in a grid


    This color spectrum is composed of colored rectangles. Each tile is assigned a
    hue on the horizontal axis and a saturation value on the vertical. The color resolution
    can be reduced by enlarging the rectangles so that the primary colors in the spectrum
    become clearer.


    `→ P_1_1_1_01`


    The grid is created by two nested for loops. In the outer loop, the y-position
    is increased, step by step. The inner loop then draws a line by increasing the
    value for the rectangle’s x-position, step by step, until the entire width is
    processed. The step size is set by the value of the mouse position and is located
    in the variables `stepX` and `stepY`. It also determines the length and width
    of the rectangles.


    ![image](images/f0062-01.jpg)


    ![image](images/f0062-02.jpg)


    `→ P_1_1_1_01` Although the distance of the color values is the same between all
    the color tiles, the contrasts are perceived as greater in some positions than
    in others.


    ```

    var stepX;


    var stepY;


    function setup() {


    **1**


    createCanvas(800, 400);


    noStroke();


    **2**


    colorMode(HSB, width, height, 100);


    }

    ```


    | **1** | The display size is set using `createCanvas()`. The values defined here
    can be retrieved at any time using the system variables `width` and `height`.
    |


    | **2** | The value range for hue and saturation is set at 800 or 400 using the
    command `colorMode()`. Hue is no longer defined as a number between 0 and 360
    but rather as one between 0 and 800\. The same is true of the saturation value.
    |


    ```

    function draw() {


    **3**


    stepX = mouseX + 2;


    stepY = mouseY + 2;


    **4**


    for (var gridY = 0; gridY < height; gridY += stepY) {


    for (var gridX = 0; gridX < width; gridX += stepX) {


    **5**


    fill(gridX, height - gridY, 100);


    rect(gridX, gridY, stepX, stepY);


    }


    }


    }

    ```


    | **3** | The addition of 2 prevents `stepX` or `stepY` from being too small,
    which would lead to longer display times. |


    | **4** | With the help of two nested loops, all the positions in the grid will
    now be processed. The y-position of the rectangle to be drawn is defined by `gridY`
    in the outer loop. The value increases only when the inner loop has been processed
    (i.e., once a complete row of rectangles has been drawn). |

