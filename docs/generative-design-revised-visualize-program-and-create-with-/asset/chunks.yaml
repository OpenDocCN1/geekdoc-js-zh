    **→ P_4_1_1_01** Using keys 1 to 3, selections can be made among different portions
    of the image sections. The motifs are still recognizable in these large, detail-rich
    excerpts but now have an unsettling perspective.


    ## **P.4.1.2 Feedback of image cutouts**


    A familiar example of feedback: a video camera is directed at a television screen
    that displays the image taken by the camera. After a short time, the television
    screen depicts an ever-recurring and distorted image. When this phenomenon is
    simulated, an image’s level of complexity is increased. This repeated overlaying
    leads to a fragmentary composition.


    **→ P_4_1_2_01**


    First, the image is loaded and shown in the display. A section of the image is
    copied to a new randomly selected position with each iteration step. The resulting
    image now serves as the basis for the next step—the principle of each and every
    feedback.


    ![image](images/f0196-01.jpg)


    ![image](images/f0196-02.jpg)


    **→ Fotografie: Stefan Eigner** original image: subway tunnel


    ![image](images/f0196-03.jpg)


    **→ P_4_1_2_01** Right after the program starts, the motif is easily recognizable.
    It then dissolves more and more through the overlapping of copied image strips.


    **1**


    function setup() {


    createCanvas(1024, 780);


    image(img, 0, 100);


    }


    | **1** | When the program is started, the loaded image is offset one hundred
    pixels downward using the image() command and positioned on the drawing canvas.
    |


    **2**


    function draw() {


    var x1 = floor(random(width));


    var y1 = 0;


    var x2 = round(x1 + random(-7, 7));


    var y2 = round(random(-5, 5));


    var w = floor(random(10, 40));


    var h = height;


    **3**


    set(x2, y2, get(x1, y1, w, h));


    }


    | **2** | The x-position of the detail to be copied (x1), the target position
    (x2, y2), and its width (w) are all determined randomly. |


    | **3** | Using the function get(), some of the canvas content is copied and then
    pasted into the new position (x2, y2) using set(). |


    | Keys: | DEL: Delete displayS: Save image |


    ![image](images/f0197-01.jpg)


    ## **P.4.2.1 Collage from image collection**


    Your archive of photographs now becomes artistic material. This program assembles
    a collage from a folder of images. The cropping, cutting, and sorting of the source
    images are especially important, since only picture fragments are recombined in
    the collage.


    **→ P_4_2_1_01**


    All the pictures in a folder are read dynamically and assigned to one of several
    layers. This allows the semantic groups to be treated differently. The individual
    layers also have room for experimentation with rotation, position, and size when
    constructing the collage. Note the layer order; the first level is drawn first
    and is thus in the background.


    ![image](images/f0198-01.jpg)


    ![image](images/f0198-02.jpg)


    **→ P_4_2_1_01 Illustration: Andrea von Danwitz** The image consists of three
    levels: scraps of paper are on layer 1, cutouts of the sky on layer 2, and plants
    and street elements on layer 3.


    ![image](images/f0198-03.jpg)


    A new composition is immediately created when the images on a level are switched
    or the parameters are changed.


    **1**


    var layer1Images = [];


    var layer2Images = [];


    var layer3Images = [];


    var layer1Items = [];


    var layer2Items = [];


    var layer3Items = [];


    | **1** | Several arrays are needed to load the images and arrange the layout
    of the collage pieces. In layer1Images, e.g., the loaded images are saved for
    the first layer in order to be used later to create the collage items. |


    function setup() {


    ...


    **2**


    layer1Items = generateCollageItems(


    layer1Images, 100, width / 2, height / 2,


    width, height, 0.1, 0.5, 0, 0);


    layer2Items = generateCollageItems(


    layer2Images, 150, width / 2, height / 2,


    width, height, 0.1, 0.3, -HALF_PI, HALF_PI);


    layer3Items = generateCollageItems(


    layer3Images, 110, width / 2, height / 2,


    width, height, 0.1, 0.4, 0, 0);


    **3**


    drawCollageItems(layer1Items);


    drawCollageItems(layer2Items);


    drawCollageItems(layer3Items);


    }


    | **2** | The function generateCollageItems() fills the array layers (layer1Items,...)
    with collage items. The parameters determine which loaded images are to be used
    and how many items are to be created, and they specify value ranges for positions,
    scattering, scaling, and rotation. In this example, images in the array layer1Items
    are used. All instances are placed in the position (width/2, height/2) with a
    scattering of width and height. The scaling varies from 0.1 to 0.5 and no rotation
    is used. |


    | **3** | Each time the drawCollageItems() function is run, one of the layers
    is drawn. The order of the layers’ invocation determines the construction of the
    final composition. The images from layer1Items are located in the background,
    those from layer3Items in the foreground. |


    **4**


    function CollageItem(image) {


    this.image = image;


    this.x = 0;


    this.y = 0;


    this.rotation = 0;


    this.scaling = 1;


    }


    | **4** | All features of a collage item are summarized in the class CollageItem.
    |


    | Keys: | 1–3: New random arrangement for one of the three levelsS: Save image
    |


    ![image](images/f0200-01.jpg)


    **→ P_4_2_1_02 → Illustration: Andrea von Danwitz** A second version of the program
    allows the image details to be arranged radially around a particular center. The
    angle at which the images gather and their distance from the center can be specified
    for each layer.


    ## **P.4.2.2 Time-based image collection**


    In this example, the inner structures of moving images are visualized. After extracting
    individual images from a video file, this program arranges the images in defined
    and regular time intervals in a grid. This grid depicts a compacted version of
    the entire video file and represents the rhythm of its cuts and frames.


    **→ P_4_2_2_01**


    To fill the grid, individual still images are extracted at regular intervals from
    the entire length of a video. Accordingly, a sixty-second video and a grid with
    twenty tiles results in three-second intervals.


    ![image](images/f0202-01.jpg)


    **1**


    function draw() {


    if(movie.elt.readyState == 4) {


    var posX = tileWidth * gridX;


    var posY = tileHeight * gridY;


    image(movie, posX, posY, tileWidth, tileHeight);


    currentImage++;


    **2**


    var nextTime = map(currentImage, 0, imageCount,


    0, movie.duration());


    **3**


    movie.time(nextTime);


    **4**


    gridX++;


    if (gridX >= tileCountX) {


    gridX = 0;


    gridY++;


    }


    **5**


    if (currentImage >= imageCount) noLoop();


    }


    }


    | **1** | Every time the draw() function is run, an image is selected from the
    video and depicted in the grid. The first image at time 0 can be placed immediately.
    |


    | **2** | The next time in the video (nextTime) is calculated. The variable currentImage
    (a number between 0 and imageCount) is converted to a second value between 0 and
    the entire playing time of the video. |


    | **3** | Using the time() function, the program jumps to the newly calculated
    time. |


    | **4** | To define the next tile, gridX is increased by 1\. If the end of the
    line has been reached, the program jumps to the first image of the next line by
    setting gridX to 0 and increasing gridY incrementally. |


    | **5** | The end of the program is reached when all the tiles are filled with
    images. |


    | Keys: | S: Save image |'
