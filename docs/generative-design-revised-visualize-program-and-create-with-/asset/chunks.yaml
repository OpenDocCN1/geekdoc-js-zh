    ## **P.2.2.3 Shapes from agents**


    It is only through cooperative efforts that dumb agents become strong. A circle
    is the source shape in this example. The permutation rule is that every point
    on the circle is represented by a dumb agent and that movement of the points will
    cause the circle to gradually change its shape. This produces a surprisingly large
    repertoire of forms.


