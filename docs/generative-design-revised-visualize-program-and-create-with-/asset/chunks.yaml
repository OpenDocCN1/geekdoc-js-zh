    **^([1](#15-appendix02.xhtml_rpg244fn1))** “Painting with a mouse on the computer
    screen has a high entertainment value, but [. . .] drawing a stroke with a pen
    is no different from drawing a stroke with a mouse. The real challenge is to discover
    the intrinsic properties of the new medium and to find out how the stroke you
    draw via computation is one you could never draw, or even imagine, without computation.”


    **John Maeda**


    *Design by Numbers*


    **^([2](#15-appendix02.xhtml_rpg246fn1))** “In addition to ‘divide and conquer,’
    there are many other problem-solving strategies, such as top-down and bottom-up,
    et cetera. In this context, the ‘pattern’ idea (analyzing problems in recurring
    patterns and solving these systematically) can be very helpful.”


    **Christopher Alexander**


    *A Pattern Language*


    **^([3](#15-appendix02.xhtml_rpg248fn1))** “The ability to take data—to be able
    to understand it, to process it, to extract value from it, to visualize it, to
    communicate it—that’s going to be a hugely important skill in the next decades,
    not only at the professional level but even at the educational level for elementary
    school kids, for high school kids, for college kids. Because now we really do
    have essentially free and ubiquitous data. So the complimentary scarce factor
    is the ability to understand that data and extract value from it.”


    **Hal Varian**


    Professor at the University of California, Berkeley


    ## A.3 Bibliography


    ### General


    **Armstrong, Helen.** *Digital Design Theory: Readings from the Field*. New York:
    Princeton Architectural Press, 2016.


    *Collection of new and old essays on generative design and related fields*.


    **Flake, Gary William.** *The Computational Beauty of Nature: Computer Explorations
    of Fractals, Chaos, Complex Systems, and Adaptation*. Cambridge, MA: MIT Press,
    1998.


    *Generative design looked at from a (very) mathematical viewpoint*.


    **Reas, Casey, Chandler McWilliams, and Jeroen Barendse.** *Form+Code in Design,
    Art, and Architecture*. New York: Princeton Architectural Press, 2010.


    ### p5.js and Processing


    **McCarthy, Lauren, Ben Fry, and Casey Reas.** *Make: Getting Started with p5.js:
    Making Interactive Graphics in JavaScript and Processing*. San Francisco: Maker
    Media, 2016.


    **Reas, Casey, and Ben Fry.** *Processing: A Programming Handbook for Visual Designers
    and Artists*, second edition. Cambridge, MA: MIT Press, 2014.


    **Shiffman, Daniel.** [TheCodingTrain.com](http://TheCodingTrain.com).


    *Great video tutorials on p5.js, processing, and generative design*.


    **Shiffman, Daniel.** *The Nature of Code: Simulating Natural Systems with Processing*.
    Self-published, 2012.


    ### Data graphics


    **Cairo, Alberto.** *The Truthful Art: Data, Charts, and Maps for Communication*.
    San Francisco: New Riders, 2016.


    **Fry, Ben.** *Visualizing Data: Exploring and Explaining Data with the Processing
    Environment*. Sebastopol, CA: O’Reilly Media, 2008.


    **Klanten, Robert, Sven Ehmann, Thibaud Tissot, and Nicolas Bourquin.** *Data
    Flow 2: Visualizing Information in Graphic Design*. Berlin: Gestalten, 2010.


    *Illustrated book covering advanced data graphic programming with Processing and
    presenting a wide range of data graphics projects*


    **Lupi, Giorgia, and Stefanie Posavec.** *Dear Data*. New York: Princeton Architectural
    Press, 2016.


    **Munzner, Tamara.** *Visualization Analysis and Design*. Boca Raton, FL: CRC
    Press, 2014.


    **Tufte, Edward R.** *Envisioning Information*. Cheshire, CT: Graphics Press,
    1990.


    **Tufte, Edward R.** *The Visual Display of Quantitative Information*. Cheshire,
    CT: Graphics Press, 2001.


    ### Aesthetics


    **Gerstner, Karl.** *Designing Programmes*. Zurich: Lars Müller, 2007. *Originally
    published in 1964; its title is somewhat misleading in our computer age—if it
    were published for the first time today, it would be called like* Inventing Design
    Rules.


    **Kandinsky, Wassily.** *Point and Line to Plane*. Edited by Hilla Rebay. Translated
    by Howard Dearstyne and Hilla Rebay. New York: Dover Publications, 1979.


    *Originally published in 1925; theoretical musings on abstract painting by the
    Bauhaus master*.


    **Leborg, Christian.** *Visual Grammar*. Translated by Diane Oatley. New York:
    Princeton Architectural Press, 2006.


    *Visual syntax abstract in overview; very clear and well illustrated* Studio Moniker.
    *Conditional Design Workbook*. Amsterdam: Valiz, 2013.


    ### History and context


    **Brown, Paul, Charlie Gere, Nicholas Lambert, and Catherine Mason, eds.** *White
    Heat Cold Logic: British Computer Art, 1960–1980*. Cambridge, MA: MIT Press, 2008.


    **Burnham, Jack.** *Software: Information Technology; Its New Meaning for Art*.
    New York: Jewish Museum, 1970.


    **Leavitt, Ruth, ed.** *Artist and Computer*. New York: Harmony Books, 1976.


    **Lee, Pamela M.** *Chronophobia: On Time in the Art of the 1960s*. Cambridge,
    MA: MIT Press, 2004.


    **Maeda, John.** *Design by Numbers*. Cambridge, MA: MIT Press, 2001.


    *First popular book that showed the design world how it was done, using the programming
    language DBN*.


    **Maeda, John.** *Maeda@Media*. New York: Rizzoli, 2000. *Autobiography and retrospective
    of John Maeda’s major contribution to generative design*.


    **McCollough, Malcolm.** *Abstracting Craft: The Practiced Digital Hand*. Cambridge,
    MA: MIT Press, 1998.


    **Paul, Christiane.** *Digital Art*. New York: Thames & Hudson, 2003.


    **Reichardt, Jasia.** *Cybernetic Serendipity: The Computer and the Arts*. New
    York: Frederick A. Praeger, 1968.


    *Catalog of the first major exhibition on computer art in London*.


    **Rosen, Margit, ed.** *A Little-Known Story about a Movement, a Magazine, and
    the Computer’s Arrival in Art: New Tendencies and Bit International, 1961–1973*.
    Cambridge, MA: MIT Press, 2011.


    **Shanken, Edward A.** *Art and Electronic Media*. New York: Phaidon Press, 2009.


    **Wardrip-Fruin, Noah, and Nick Montfort, eds.** *The New Media Reader*. Cambridge,
    MA: MIT Press, 2003.


    **Whitelaw, Mitchell.** *Metacreation: Art and Artificial Life*. Cambridge, MA:
    MIT Press, 2004.


    **Wilson, Mark.** *Drawing with Computers: The Artist’s Guide to Computer Graphics*.
    New York: Perigee Books, 1985.


    **Wood, Debora.** *Imaging by Numbers: A Historical View of the Computer Print*.
    Chicago: Northwestern University Press, 2008.


    ## A.4 The authors


    **Benedikt Groß** Born in 1980 in Baden-Württemberg. 2002: studied geography and
    computer science. Discontinued those studies and became interested in design.
    2007: completed master’s degree in generative systems with Julia Laub at the HfG
    Schwäbisch Gmünd. Thereafter, employed in higher education and in the field of
    design. 2011–13: master’s student in design interactions at the Royal College
    of Art London under Anthony Dunne and Fiona Raby; at the same time, data visualization
    specialist at the MIT Senseable City Lab in Cambridge, Massachusetts / Singapore.
    Since 2013: freelance work in speculative and computational design; various international
    exhibitions, awards, and publications. Since 2017: professor of interaction design
    at the HfG Schwäbisch Gmünd.


    **Hartmut Bohnacker** Born in 1972 in Baden-Württemberg. Beginning in 1992: studied
    mathematics (discontinued) and earned a degree in economics in 1997. 1998: studied
    communication design at the HfG Schwäbisch Gmünd. Since completing studies in
    2002: independent designer in Stuttgart, specializing in conception, design, and
    prototypical implementation of projects in the field of interface and interaction
    development; teacher of digital media. Since 2009: professor of interaction design
    at the HfG Schwäbisch Gmünd.

