  trans: "\n\n| 3 | 当第二版启动时（`randomMode` 为 true），`cropX` 和 `cropY` 的所有值都会从鼠标位置附近的一个数值范围内随机选取。\
    \ |\n| 4 | `constrain()` 函数确保裁剪区域不会超出图像边界。 |\n| 5 | 最后，使用 `get()` 从图像 `img` 中复制该区域，并存储到数组中。\
    \ |\n\n| 鼠标： | 位置 x/y：细节定位左键点击：复制细节 |\n| 按键： | 1–3：改变细节大小 R：随机开/关 S：保存图像 |\n\n\
    ![image](img/f0193-01.jpg)\n\n![image](img/f0194-01.jpg)\n\n→ P_4_1_1_01 小图像片段的乘法产生了节奏性的结构，这些结构只有细看才能被识别为图像片段。\n\
    \n![image](img/f0195-01.jpg)\n\n→ P_4_1_1_01 使用按键 1 到 3，可以在图像片段的不同部分之间进行选择。在这些大尺寸、细节丰富的截图中，主题仍然可辨认，但现在呈现出一种令人不安的透视效果。\n\
    \n## P.4.1.2 图像截图的反馈\n\n一个熟悉的反馈例子：摄像机对准电视屏幕，屏幕上显示摄像机拍摄的图像。片刻之后，电视屏幕上呈现出不断重复且扭曲的图像。当模拟这种现象时，图像的复杂度会增加。这种重复叠加导致了碎片化的构图。\n\
    \n→ P_4_1_2_01\n\n首先，加载图像并显示在屏幕上。每次迭代时，将图像的一个区域复制到随机选择的新位置。生成的图像随后作为下一步的基础——这就是反馈的原理。\n\
    \n![image](img/f0196-01.jpg)\n\n![image](img/f0196-02.jpg)\n\n→ 摄影：Stefan Eigner\
    \ 原始图像：地铁隧道\n\n![image](img/f0196-03.jpg)\n\n→ P_4_1_2_01 程序启动后，主题很容易辨认。随后，通过复制图像条带的叠加，主题逐渐消散。\n\
    \n1\n\n```\nfunction setup() {\n  createCanvas(1024, 780);\n  image(img, 0, 100);\n\
    }\n```\n\n| 1 | 程序启动时，使用 `image()` 命令将加载的图像向下偏移一百像素，并放置在绘图画布上。 |\n\n2\n\n```\n\
    function draw() {\n  var x1 = floor(random(width));\n  var y1 = 0;\n  var x2 =\
    \ round(x1 + random(-7, 7));\n  var y2 = round(random(-5, 5));\n  var w = floor(random(10,\
    \ 40));\n  var h = height;\n  3\n  set(x2, y2, get(x1, y1, w, h));\n}\n```\n\n\
    | 2 | 要复制的细节的 x 位置（`x1`）、目标位置（`x2`、`y2`）及其宽度（`w`）都是随机确定的。 |\n| 3 | 使用函数 `get()`\
    \ 复制部分画布内容，然后使用 `set()` 将其粘贴到新位置（`x2`、`y2`）。 |\n\n| 按键： | DEL：删除显示 S：保存图像 |\n\n\
    ![image](img/f0197-01.jpg)\n\n## P.4.2.1 从图像集合中拼贴\n\n你的照片档案现在变成了艺术素材。该程序从一个图像文件夹中拼贴出一幅作品。源图像的裁剪、切割和排序尤为重要，因为拼贴中只重新组合了图像碎片。\n\
    \n→ P_4_2_1_01\n\n文件夹中的所有图像被动态读取，并分配到多个图层之一。这样可以对语义组进行不同处理。在构建拼贴时，各个图层在旋转、位置和大小方面也有实验空间。注意图层顺序；第一层先绘制，因此位于背景。\n\
    \n![image](img/f0198-01.jpg)\n\n![image](img/f0198-02.jpg)\n\n→ P_4_2_1_01 插图：Andrea\
    \ von Danwitz 图像由三个层次组成：第 1 层是纸片，第 2 层是天空的剪影，第 3 层是植物和街道元素。\n\n![image](img/f0198-03.jpg)\n\
    \n当切换某一层的图像或更改参数时，会立即生成新的构图。\n\n1\n\n```\nvar layer1Images = [];\nvar layer2Images\
    \ = [];\nvar layer3Images = [];\nvar layer1Items = [];\nvar layer2Items = [];\n\
    var layer3Items = [];\n```\n\n| 1 | 需要多个数组来加载图像并安排拼贴片的布局。例如，在 `layer1Images` 中，加载的图像被保存到第一层，以便稍后用于创建拼贴项。\
    \ |\n\n```\nfunction setup() {\n...\n  2\n  layer1Items = generateCollageItems(\n\
    \    layer1Images, 100, width / 2, height / 2,\n    width, height, 0.1, 0.5, 0,\
    \ 0);\n  layer2Items = generateCollageItems(\n    layer2Images, 150, width / 2,\
    \ height / 2,\n    width, height, 0.1, 0.3, -HALF_PI, HALF_PI);\n  layer3Items\
    \ = generateCollageItems(\n    layer3Images, 110, width / 2, height / 2,\n   \
    \ width, height, 0.1, 0.4, 0, 0);\n  3\n  drawCollageItems(layer1Items);\n  drawCollageItems(layer2Items);\n\
    \  drawCollageItems(layer3Items);\n}\n```\n\n| 2 | 函数 `generateCollageItems()`\
    \ 用拼贴项填充数组层（`layer1Items` 等）。参数决定了使用哪些加载的图像以及创建多少项，并指定位置、散布、缩放和旋转的值范围。在此示例中，使用数组\
    \ `layer1Items` 中的图像。所有实例都放置在位置（`width/2`、`height/2`），散布范围为 `width` 和 `height`。缩放范围从\
    \ 0.1 到 0.5，不使用旋转。 |\n| 3 | 每次运行 `drawCollageItems()` 函数时，都会绘制其中一个图层。图层的调用顺序决定了最终构图的构建。`layer1Items`\
    \ 中的图像位于背景，`layer3Items` 中的图像位于前景。 |\n\n4\n\n```\nfunction CollageItem(image)\
    \ {\n  this.image = image;\n  this.x = 0;\n  this.y = 0;\n  this.rotation = 0;\n\
    \  this.scaling = 1;\n}\n```\n\n| 4 | 拼贴项的所有特征都汇总在类 `CollageItem` 中。 |\n\n| 按键：\
    \ | 1–3：为三个层级之一生成新的随机排列 S：保存图像 |\n\n![image](img/f0200-01.jpg)\n\n→ P_4_2_1_02\
    \ → 插图：Andrea von Danwitz 该程序的第二个版本允许图像细节围绕特定中心径向排列。可以指定每个图层中图像聚集的角度及其与中心的距离。\n\
    \n## P.4.2.2 基于时间的图像集合\n\n在此示例中，运动图像的内部结构被可视化。从视频文件中提取单个图像后，该程序以定义好的固定时间间隔将图像排列在网格中。该网格展示了整个视频文件的压缩版本，并代表了其剪辑和帧的节奏。\n\
    \n→ P_4_2_2_01\n\n为了填充网格，从视频的整个长度中按固定间隔提取单个静止图像。因此，一个 60 秒的视频和包含 20 个格子的网格会产生\
    \ 3 秒的间隔。\n\n![image](img/f0202-01.jpg)\n\n1\n\n```\nfunction draw() {\n  if(movie.elt.readyState\
    \ == 4) {\n    var posX = tileWidth * gridX;\n    var posY = tileHeight * gridY;\n\
    \    image(movie, posX, posY, tileWidth, tileHeight);\n    currentImage++;\n \
    \   2\n    var nextTime = map(currentImage, 0, imageCount,\n      0, movie.duration());\n\
    \    3\n    movie.time(nextTime);\n    4\n    gridX++;\n    if (gridX >= tileCountX)\
    \ {\n      gridX = 0;\n      gridY++;\n    }\n    5\n    if (currentImage >= imageCount)\
    \ noLoop();\n  }\n}\n```\n\n| 1 | 每次运行 `draw()` 函数时，都会从视频中选择一帧图像并显示在网格中。时间 0 处的第一帧图像可以立即放置。\
    \ |\n| 2 | 计算视频中的下一个时间点（`nextTime`）。变量 `currentImage`（介于 0 和 `imageCount` 之间的数字）被转换为介于\
    \ 0 和视频总播放时间之间的秒数值。 |\n| 3 | 使用 `time()` 函数，程序跳转到新计算的时间点。 |\n| 4 | 为了定义下一个格子，`gridX`\
    \ 增加 1。如果到达行尾，程序通过将 `gridX` 设置为 0 并递增 `gridY` 来跳转到下一行的第一帧图像。 |\n| 5 | 当所有格子都被图像填满时，程序结束。\
    \ |\n\n| 按键： | S：保存图像 |\n\n"
- fmt: "\n![image](images/f0203-01.jpg)\n\n**→ P_4_2_2_01** Fifty-five images from\
    \ a two-and-a-half-minute video clip, filmed on the way to the main train station\
    \ in Stuttgart, Germany.\n\n## **P.4.3.1 Graphics from pixel values**\n\nPixels,\
    \ the smallest elements of an image, can serve as the starting point for the composition\
    \ of portraits. In this example, each pixel is reduced to its color value. These\
    \ values modulate design parameters such as rotation, width, height, and area.\
    \ The pixel is completely replaced by a new graphic representation, and the portrait\
    \ becomes somewhat abstract.\n\n**→ P_4_3_1_01**\n\nThe pixels of an image are\
    \ analyzed sequentially and transformed into other graphic elements. The key to\
    \ this is the conversion of the color values of pixels (RGB) into the corresponding\
    \ gray values, because—in contrast to the pure RGB values—these can be practically\
    \ applied to design aspects such as line width. It is advisable to reduce the\
    \ resolution of the source image first.\n\n![image](images/f0204-01.jpg)\n\n![image](images/f0204-02.jpg)\n\
    \n**→ P_4_3_1_01 → Photograph: Tom Ziora** The gray value of each pixel defines\
    \ the size of its diameter; the pixels’ original color values are kept.\n\n```\n\
    **1**\nfor (var gridX=0; gridX<img.width; gridX++) {\n  for (var gridY=0; gridY<img.height;\
    \ gridY++) {\n    var tileWidth = width / img.width;\n    var tileHeight = height\
    \ / img.height;\n    var posX = tileWidth * gridX;\n    var posY = tileHeight\
    \ * gridY;\n    img.loadPixels();\n**2**\n    var c = color(img.get(gridX, gridY));\n\
    **3**\n    var grayscale = round(red(c) * 0.222 +\n      green(c) * 0.707 + blue(c)\
    \ * 0.071);\n**4**\n    switch (drawMode) {\n      case 1:\n        var w1 = map(grayscale,\
    \ 0, 255, 15, 0.1);\n        stroke(0);\n        strokeWeight(w1 * mouseXFactor);\n\
    \        line(posX, posY, posX + 5, posY + 5);\n        break;\n      case 2:\n\
    \        ...\n    }\n  }\n}\n```\n\n| **1** | The width and height of the original\
    \ image determines the resolution of the grid. |\n| **2** | The color of the pixels\
    \ at the current grid position (and thus the image) is defined. |\n| **3** | In\
    \ calculating the gray value, the values for red, green, and blue are weighted\
    \ differently, whereby there are no absolutely correct weights since colors are\
    \ both displayed and perceived differently. This gray value is used later to control\
    \ individual parameters. |\n| **4** | The program provides several drawing modes,\
    \ `drawMode`, which can also be influenced by the horizontal mouse position. These\
    \ were previously converted into a value between 0.05 and 1 and are available\
    \ in the variable `mouseXFactor`. |\n| Mouse: | Position x/y: Different parameters\
    \ (dependent on drawing mode) |\n| Keys: | S: Save image |\n\n![image](images/f0205-01.jpg)\n\
    \n![image](images/f0206-01.jpg)\n\n**→ P_4_3_1_01** The gray value defines the\
    \ size, stroke value, rotation, and position of the elements.\n\n![image](images/f0206-02.jpg)\n\
    \n**→ P_4_3_1_01** In this drawing mode (key 9), each pixel is represented by\
    \ several color-distorting elements.\n\n![image](images/f0207-01.jpg)\n\n![image](images/f0208-01.jpg)\n\
    \n**→ P_4_3_1_02** Pixels of various brightness are replaced here by SVG units.\
    \ The SVG files have been sorted according to brightness using a supplementary\
    \ program. Note that the files have been renamed (the brightness value forms the\
    \ beginning of the file name).\n\n## **P.4.3.2 Type from pixel values**\n\nThe\
    \ following text image is ambiguous. It can be read for its meaning, or viewed\
    \ at a distance and perceived as a picture. The pixels from the image control\
    \ the configuration of the letters. The size of each letter depends on the gray\
    \ values of the pixels in the original image and thereby creates an additional\
    \ message.\n\n**→ P_4_3_2_01**\n\nA character string is processed letter by letter\
    \ → P.3.1.1/P.3.1.2 and constructed row by row in the normal writing direction.\
    \ Before a character is drawn, its position in display coordinates is matched\
    \ to the corresponding position in the original image in pixel coordinates. Only\
    \ a subset of the original pixels is used—merely those for which a corresponding\
    \ character position exists. The color of the selected pixel can now be converted\
    \ into its gray value and the gray value used to modulate the font size, for example.\n\
    \n![image](images/f0210-01.jpg)\n\n![image](images/f0210-02.jpg)\n\n**→ P_4_3_2_01**\
    \ The color of a pixel can define the size or color of the letters, or both.\n\
    \n```\nfunction draw() {\n  ...\n  var x = 0;\n  var y = 10;\n  var counter =\
    \ 0;\n**1**\n  while (y < height) {\n    img.loadPixels();\n**2**\n    var imgX\
    \ = round(map(x, 0, width, 0, img.width))\n    var imgY = round(map(y, 0, height,\
    \ 0, img.height))\n    var c = color(img.get(imgX, imgY));\n    var grayscale\
    \ = round(red(c) * 0.222 +\n      green(c) * 0.707 +\n      blue(c) * 0.071);\n\
    \    push();\n    translate(x, y);\n**3**\n    if (fontSizeStatic) {\n      textSize(fontSizeMax);\n\
    \      if (blackAndWhite) fill(grayscale);\n      else fill(c);\n    } else {\n\
    \      var fontSize = map(grayscale, 0, 255,\n        fontSizeMax, fontSizeMin);\n\
    **4**\n      fontSize = max(fontSize, 1);\n      textSize(fontSize);\n      if\
    \ (blackAndWhite) fill(0);\n      else fill(c);\n    }\n    var letter = inputText.charAt(counter);\n\
    \    text(letter, 0, 0);\n    var letterWidth = textWidth(letter) + kerning;\n\
    **5**\n    x += letterWidth;\n    pop();\n**6**\n    if (x + letterWidth >= width)\
    \ {\n      x = 0;\n      y += spacing;\n    }\n    counter++;\n    if (counter\
    \ >= inputText.length) {\n      counter = 0;\n    }\n  }\n  noLoop();\n}\n```\n\
    \n| **1** | The writing process continues as long as the y-coordinate of the current\
    \ writing position `y` is still less than the height of the display. |\n| **2**\
    \ | Using the `map()` function, the display coordinates are converted into image\
    \ coordinates; e.g., the x-coordinate `x` is proportionally converted from a value\
    \ between 0 and the display width to a corresponding value between 0 and the width\
    \ of the image `img.width`. |\n| **3** | Depending on the selected mode `fontSizeStatic`\
    \ (key 1 or 2), the font size is set to a fixed value `fontSizeMax` or is varied\
    \ by the gray value. |\n| **4** | The value `fontSize` cannot be zero or negative,\
    \ as this would cause problems. Therefore, the function `max()` ensures this value\
    \ is at least 1. |\n| **5** | The value of the variable `x` is increased by the\
    \ character width. |\n| **6** | If `x` is greater than or equal to the width of\
