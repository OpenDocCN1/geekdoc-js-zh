    ## A.1 Looking ahead


    Would you like to dive deeper into generative design? We hope so, because there
    is still much to discover! This chapter gives an overview on complex methods that
    are the basis for data visualization, 3D shape generation, wild particle animation,
    et cetera. You can find the code in the additional sketches on our website and
    our GitHub channel (links available on [generative-gestaltung.de](http://generative-gestaltung.de)).
    After all the practical making of the previous chapters, this chapter is an invitation
    to reflect on what you’ve learned and to explore theoretical and conceptual connections
    in the context of generative design.


