    \ The motifs are still recognizable in these large, detail-rich excerpts but now\
    \ have an unsettling perspective.\n\n## P.4.1.2 Feedback of image cutouts\n\n\
    A familiar example of feedback: a video camera is directed at a television screen\
    \ that displays the image taken by the camera. After a short time, the television\
    \ screen depicts an ever-recurring and distorted image. When this phenomenon is\
    \ simulated, an image’s level of complexity is increased. This repeated overlaying\
    \ leads to a fragmentary composition.\n\n→ P_4_1_2_01\n\nFirst, the image is loaded\
    \ and shown in the display. A section of the image is copied to a new randomly\
    \ selected position with each iteration step. The resulting image now serves as\
    \ the basis for the next step—the principle of each and every feedback.\n\n![image](images/f0196-01.jpg)\n\
    \n![image](images/f0196-02.jpg)\n\n→ Fotografie: Stefan Eigner original image:\
    \ subway tunnel\n\n![image](images/f0196-03.jpg)\n\n→ P_4_1_2_01 Right after the\
    \ program starts, the motif is easily recognizable. It then dissolves more and\
