    The p5.js community is spread across the entire world. It is therefore advisable
    to write comments and variable names in English. This makes it easier for you
    and others to look for and find suggestions and answers to problems on internet
    forums.


    | **1** | Text that follows two forward slashes is ignored and can be used for
    comments. |


    **Useful Names and Clear Structures** In addition to the use of comments, sensibly
    selected variable and function names help users to maintain an overview and to
    understand what a specific program does.


    **2**


    ```

    function mixer(apples, oranges) {


    var juice = (apples + oranges) / 2;


    return juice;


    }

    ```


    To this end, it is necessary to structure the program into smaller, logical sections
    with the help of functions and classes. This encapsulation of functionality also
    means that the program can be quickly modified and extended.


    | **2** | In this example it is difficult to recognize just what the function
    calculates. The fact that the average of two numbers is calculated can only be
    guessed from the formula. |


    **Performance** Even though computers are becoming faster and faster, it still
    takes time to execute a command. Even short periods of time add up noticeably
    when a command is executed often. Try not to burden the program with unnecessary
    work.


    **3**


    ```

    for (var i = 0; i < 10000000; i++) {


    var speed = dist(mouseX, mouseY, pmouseX, pmouseY);


    doSomethingWithMouseSpeed(speed);


    }

    ```


    **4**


    ```

    var speed = dist(mouseX, mouseY, pmouseX, pmouseY);


    for (var i = 0; i < 10000000; i++) {


    doSomethingWithMouseSpeed(speed);


    }

    ```


    With the programs in this book, we have tried to uphold the aforementioned principles.
    Sometimes, however, clarity and performance contradict each other, meaning that
    program code optimized for performance can be more difficult to understand. In
    such cases we have opted for clearer structures.


    | **3** | Here `mouseSpeed` is calculated in all ten million loops even though
    the mouse position cannot be changed during this process. |


    | **4** | Performance is therefore improved enormously when the mouse speed is
    calculated outside the loop. |


