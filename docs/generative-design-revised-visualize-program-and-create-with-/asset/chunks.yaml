    ## **P.4.3.4 Emojis from pixel values**


    An emotional transformation from a raster element to a symbol: here the things
    that visualize feelings in an SMS become a small part of a greater whole. Any
    collection of thumbnails in this program can be the source material, and the pixel
    values determine which can join.


