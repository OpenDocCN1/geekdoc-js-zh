    **Collide** is an art installation that transforms recorded motion data into abstract
    graphics and sound. Surreal imagery and an engaging sound-scape create an immersive
    space that captures the essence of motion, color, and sound to represent the experience
    of “letting go.” Inspired by the phenomenon of synesthesia, the union of the senses,
