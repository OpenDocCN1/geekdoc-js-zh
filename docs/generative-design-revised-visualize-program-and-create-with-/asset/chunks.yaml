    **Block Bills** is a series of sixty-four generated banknotes representing blocks
    in a Bitcoin blockchain. A visual system defined by the artist Matthias Dörfelt
    uses both randomness and the unique aspects of each block in the selected blockchain
    to affect every aspect of each bill in the series. The bills are allusions to
    Dörfelt’s ambivalence toward Bitcoin and cryptocurrencies; they bring these otherwise
    intangible and invisible constructions into a visually and emotionally tangible
    context.


    ![image](images/f0034-01.jpg)


    **Map and Road Network Data**


    OpenStreetMap


    **Routing Engine**


    GraphHopper


    **Roads to Rome** is a data visualization project that explores the idiom “All
    roads lead to Rome.” The outcome is both information visualization and data art
    and unveils mobility patterns at a very large scale. The visualizations were created
    using routing algorithms on existing street infrastructure (OpenStreetMap) from
    the city to continent scale. In addition to their aesthetic quality, the resulting
    images bring insights into the ways in which road infrastructures reflect regional,
    political, and geographical situations.


