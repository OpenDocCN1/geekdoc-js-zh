    \  ellipse(50, 50, 80, 80);\n}\n```\n\n### 35\n\n```javascript\nif (aNumber ==\
    \ 3) {\n  fill(255, 0, 0);\n} else {\n  fill(0, 255, 0);\n}\n```\n\n### 36\n\n\
    ```javascript\nif (aNumber == 3) fill(255, 0, 0);\nelse fill(0, 255, 0);\n```\n\
    \n区分变量的多个值通常可以通过 `switch` 命令实现。\n\n**34**：只有当 `if` 语句中的条件满足时——即变量 `aNumber` 的值为\
    \ 3 时——才会执行花括号内的两行代码。\n\n**35**：使用 `else`，`if` 条件扩展了一段代码，当指定的 `if` 条件不满足时执行这段代码。\n\
    \n**36**：如果代码段只有一行，如上一个示例所示，可以省略花括号。\n\n### 37\n\n```javascript\nswitch (aNumber)\
    \ {\n  case 1:\n    rect(20, 20, 80, 80);\n    break;\n  case 2:\n    ellipse(50,\
    \ 50, 80, 80);\n    break;\n  default:\n    line(20, 20, 80, 80);\n}\n```\n\n\
    **37**：`switch` 命令测试变量 `aNumber` 的值是否与 `case` 行中列出的某个值匹配，如果匹配则跳转到该处，并继续执行代码直到遇到\
    \ `break` 语句。如果没有匹配的值，程序执行会从 `default` 继续。\n\n## 函数\n\n程序中经常有在不同位置以类似方式出现的部分。在许多此类情况下，将这些部分封装到函数中是明智的做法。例如：\n\
    \n### 38\n\n```javascript\nfunction draw() {\n  translate(40, 15);\n  line(0,\
    \ -10, 0, 10);\n  line(-8, -5, 8, 5);\n  line(-8, 5, 8, -5);\n  translate(20,\
    \ 50);\n  line(0, -10, 0, 10);\n  line(-8, -5, 8, 5);\n  line(-8, 5, 8, -5);\n\
    }\n```\n\n要改变这个程序中星星的外观，必须在两个地方修改绘图命令。因此，最好将相应的行存储在一个函数中。\n\n**38**：坐标系被移动到另一个位置，在那里用三条线绘制一颗星星。然后再次移动坐标系，并在新位置使用相同的命令绘制一颗星星。\n\
    \n### 39\n\n```javascript\nfunction draw() {\n  translate(40, 15);\n  drawStar();\n\
    \  translate(20, 50);\n  drawStar();\n}\n\nfunction drawStar() {\n  line(0, -10,\
    \ 0, 10);\n  line(-8, -5, 8, 5);\n  line(-8, 5, 8, -5);\n}\n```\n\n可以向函数传递值，函数也可以返回一个值作为结果。\n\
    \n**39**：函数 `drawStar()` 现在包含了绘图命令。可以从程序中的任何其他点调用此函数，以执行其中包含的代码。\n\n### 40\n\n\
    ```javascript\nfunction setup() {\n  console.log(\"The faculty of 5 is 1*2*3*4*5\
    \ = \"\n    + faculty(5));\n}\n\nfunction faculty(theValue) {\n  var result =\
    \ 1;\n  for (var i = 1; i <= theValue; i++) {\n    result = result * i;\n  }\n\
    \  return result;\n}\n```\n\n在 JavaScript 中，函数接受另一个函数作为其参数之一（称为“回调函数”）的情况尤为常见。回调函数允许在事件触发时执行操作。\n\
    \n**40**：这里定义了一个函数 `faculty()`，其中传递了一个值 `theValue`。当调用该函数时，参数（此处为 5）被传入变量 `theValue`。在函数内部，使用该值执行各种计算，并通过命令\
    \ `return` 返回结果。\n\n### 41\n\n```javascript\nloadJSON(\"myData.json\", callback);\n\
    \nfunction callback(data) {\n  console.log(data);\n}\n```\n\n**41**：当以这种方式使用 p5.js\
    \ 函数 `loadJSON()` 时，程序流程不会被加载过程阻塞，而是在后台运行（异步加载）。当文件完全加载后，会调用 `callback()` 函数。\n\
    \n## 循环\n\n循环用于在程序中多次执行特定命令。可以通过多种方式编写循环：\n\n`for` 循环用于将代码段循环执行特定次数。\n\n### 42\n\
    \n```javascript\nfor (var i = 0; i <= 5; i++) {\n  line(0, 0, i * 20, 100);\n\
    \  line(100, 0, i * 20, 100);\n}\n```\n\n**42**：花括号内的两行代码恰好执行六次。首先将变量 `i` 设置为值\
    \ 0，然后在每次循环后增加 1（`i++`），只要该值小于或等于 5。\n\n### 43\n\n```javascript\nvar myvalue =\
    \ 0;\nwhile (myValue < 100) {\n  myValue = myValue + random(5);\n  console.log(\"\
    The value of myValue is \" + myValue);\n}\n```\n\n**43**：只要变量 `myValue` 的值小于 100，这个\
    \ `while` 循环就会继续。在每个新的循环周期中，会添加一个介于 0 和 5 之间的随机值。\n\n只要满足特定条件，`while` 循环就会继续。\n\
    \n有几种方法可以遍历数组中的所有值。这里展示了一些常用方法：\n\n```javascript\nvar planets = [\"Mercury\",\
    \ \"Venus\", \"Earth\", \"Mars\",\n  \"Jupiter\", \"Saturn\", \"Uranus\", \"Neptune\"\
    ];\n```\n\n### 44\n\n```javascript\nfor (var i = 0; i < planets.length; i++) {\n\
    \  console.log(planets[i]);\n}\n```\n\n### 45\n\n```javascript\nplanet.forEach(function(planet)\
    \ {\n  console.log(planet);\n});\n```\n\n**44**：变体 1：当变量 `i` 小于数组长度时，`for` 循环运行。\n\
    \n**45**：变体 2：这里使用了数组函数 `forEach()`。这需要一个回调函数，该函数在循环的每次迭代中被调用。变量 `planet` 依次包含数组的各个值。\n\
    \n为了遍历对象的所有键/值对，以下 `for` 循环的变体是合适的：\n\n```javascript\nvar planet = {name: \"Saturn\"\
    , mass: 5.685e26,\n  temperature: 134, diameter: 120536};\n```\n\n### 46\n\n```javascript\n\
    for (k in planet) {\n  console.log(\"Key: \" + k + \", Value: \" + planet[k]);\n\
    }\n```\n\n**46**：变量 `k` 依次包含对象的每个键。这可用于访问关联的值。\n\n## P.0.3 优雅地编程\n\n在编程中，通常有多种方法可以达到期望的结果。程序能运行只是解决方案的一部分，尽管是非常重要的一部分；还有其他方面需要考虑。\n\
    \n### 注释\n\n程序越复杂、越棘手，其他人——甚至你自己在一段时间后——就越难理解它。一个难以理解的程序无法被修改或更新。程序中的注释有助于澄清代码。\n\
    \n#### 1\n\n```javascript\n// calculate distance between actual and previous mouse\n\
    // position, which represents the speed of the mouse\nvar speed = dist(mouseX,\
    \ mouseY, pmouseX, pmouseY);\n```\n\n"
