    \ {\n  createCanvas(1024, 780);\n  image(img, 0, 100);\n}\n```\n\n| 1 | When the\
    \ program is started, the loaded image is offset one hundred pixels downward using\
    \ the `image()` command and positioned on the drawing canvas. |\n\n2\n\n```\n\
