    \nsaturationValues[index],\n\nbrightnessValues[index]);\n\nrect(posX, posY, tileWidth,\
    \ tileHeight);\n\ncounter++;\n\n...\n\n}\n\n| **2** | When the grid is drawn,\
    \ the colors are selected from the arrays, one by one. The continually incrementing\
