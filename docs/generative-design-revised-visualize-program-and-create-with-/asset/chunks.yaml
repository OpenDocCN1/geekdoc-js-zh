    **Block Bills** 是一系列六十四张生成的钞票，代表比特币区块链中的区块。艺术家马蒂亚斯·德费尔特定义的可视化系统同时利用随机性和所选区块链中每个区块的独特方面，影响该系列中每张钞票的各个方面。这些钞票暗喻了德费尔特对比特币和加密货币的矛盾心理；它们将这些原本无形且不可见的构造带入了一个视觉和情感上可感知的语境中。


    ![image](img/f0034-01.jpg)


