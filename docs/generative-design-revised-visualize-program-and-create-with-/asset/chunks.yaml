  raw: 'The sixteen possible states of the four neighbors can be easily summarized
    in a four-digit binary code. The correct SVG module can be determined simply by
    converting the binary code into a decimal number, without complicated combinatorics.


    ![image](images/f0142-01.jpg)


    function draw() {


    background(255);


    **1**


    if (mouseIsPressed) {


    if (mouseButton == LEFT) setTile();


    if (mouseButton == RIGHT) unsetTile();


    }


    **2**


    if (doDrawGrid) drawGrid();


    drawModules();


    }


    | **1** | Using the functions setTile() and unsetTile(), the state of a field
    in the grid is set to 1 or 0. |


    | **2** | Using the function drawModules(), all SVG modules are displayed. The
    underlying grid can be drawn with the function drawGrid(). |


    function setTile() {


    **3**


    var gridX = floor(mouseX / tileSize) + 1;


    gridX = constrain(gridX, 1, gridResolutionX - 2);


    var gridY = floor(mouseY / tileSize) + 1;


    gridY = constrain(gridY, 1, gridResolutionY - 2);


    **4**


    tiles[gridX][gridY] = 1;


    }


    | **3** | The mouse position is transferred to the corresponding grid field square
    in the grid (gridX, gridY). |


    | **4** | The state of all the fields in the grid is saved in the two-dimensional
    tiles array. The clicked-on field is set to the value 1. |


    function drawModules() {


    for (var gridX=0; gridX<gridResolutionX-1; gridX++) {


    for (var gridY=0; gridY<gridResolutionY-1; gridY++) {


    **5**


    if (tiles[gridX][gridY] == 1) {


    var NORTH = str(tiles[gridX][gridY - 1]);


    var WEST = str(tiles[gridX - 1][gridY]);


    var SOUTH = str(tiles[gridX][gridY + 1]);


    var EAST = str(tiles[gridX + 1][gridY]);


    **6**


    var binaryResult = NORTH + WEST + SOUTH + EAST;


    **7**


    var decimalResult = parseInt(binaryResult, 2);


    var posX = tileSize * gridX - tileSize / 2;


    var posY = tileSize * gridY - tileSize / 2;


    **8**


    image(modules[decimalResult], posX, posY,


    tileSize, tileSize);


    ...


    }


    }


    }


    }


    | **5** | All tiles are processed. Only fields whose state is 1 (i.e., filled
    ones) are taken into account. |


    | **6** | The state of the four neighbors is queried, converted into strings,
    and concatenated. Consequently, binaryResult contains a sequence of four zeros
    or ones. |


    | **7** | The coded states of the binary representations are converted into a
    decimal number using the function parseInt(). |


    | **8** | The corresponding SVG module is selected with decimalResult and drawn
    on the drawing canvas. |


    | Mouse: | Drag: Draw modules |


    | Drag right mouse button: Delete modules |


    | Keys: | DEL: Clear canvas |


    |  | G: Show grid on/off |


    |  | D: Show module values on/off |


