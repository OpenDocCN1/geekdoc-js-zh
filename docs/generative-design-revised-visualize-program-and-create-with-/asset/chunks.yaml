    \n## P.3.0 Hello, type\n\nLetters become spaces. In generating a vector-based\
    \ font, you can directly influence numerous parameters and design with letters\
    \ in time and space. Traces of the emergence of the character and the interactive\
    \ manipulation of its size and position can be made visible.\n\n**→ P_3_0_01**\n\
    \nThe size of the letter is controlled with the horizontal movement of the mouse,\
    \ and its vertical movement moves the letters up and down. The letter leaves a\
    \ trail when the mouse button is held down.\n\n![image](images/f0152-01.jpg)\n\
    \n![image](images/f0152-02.jpg)\n\n**→ P_3_0_01** The letter leaves the tracks\
    \ of its changes, then becomes unrecognizable and generates new forms.\n\n**1**\n\
    \n```\nvar font = \"sans-serif\";\nvar letter = \"A\";\n```\n\n| **1** | The name\
    \ of the font to use is saved in the variable `font`. |\n\n```\nfunction setup()\
    \ {\n  createCanvas(windowWidth, windowHeight);\n  background(255);\n  fill(0);\n\
    \  **2**\n  textFont(font);\n  textAlign(CENTER, CENTER);\n}\n```\n\n| **2** |\
    \ The function `textFont()` makes it the current font. The horizontal and vertical\
    \ alignment can be specified with `textAlign()`. |\n\n```\nfunction mouseMoved()\
    \ {\n  clear();\n  **3**\n  textSize((mouseX - width / 2) * 5 + 1);\n  text(letter,\
    \ width / 2, mouseY);\n}\n```\n\n| **3** | When the mouse is moved, the letter\
    \ size changes according to the value of the horizontal mouse position. The letter\
    \ is positioned horizontally in the middle of the display window `width / 2`,\
    \ vertically in the position `mouseY`, and displayed using the `text()` command.\
    \ |\n\n**4**\n\n```\nfunction mouseDragged() {\n  textSize((mouseX - width / 2)\
    \ * 5 + 1);\n  text(letter, width / 2, mouseY);\n}\n```\n\n| **4** | This also\
    \ occurs when the mouse is moved with the mouse button held down, but now the\
    \ background does not get a new color and the letter leaves a trail. |\n\n| Mouse:\
    \ | Position x: Size |\n|  | Position y: Position |\n|  | Drag: Draw |\n| Keys:\
    \ | A–Z: Letter selection |\n|  | CTRL: Save image |\n\n![image](images/f0153-01.jpg)\n\
    \n## P.3.1.1 Writing time-based text\n\nComposing text with automatic line breaks\
    \ is nothing new. But when the vertical mouse position is responsible for the\
    \ leading (the space between lines), and the elapsed time before entering each\
    \ letter determines its size, then the rhythm of writing begins to interact with\
    \ the text.\n\n**→ P_3_1_1_01**\n\nWhen typing, the virtual “pen tip” moves from\
    \ left to right over the drawing canvas. When it reaches the right border, it\
    \ starts again from the beginning and skips a line. Leading is defined by the\
    \ vertical mouse position. The time between the individual keystrokes is measured.\
    \ The greater the time interval, the larger the entered letter.\n\n![image](images/f0154-01.jpg)\n\
    \n![image](images/f0154-02.jpg)\n\n**→ P_3_1_1_01** The vertical mouse position\
    \ defines the leading (line spacing). Different levels of legibility result.\n\
    \n```\nfunction draw() {\n  ...\n  spacing = map(mouseY, 0, height, 0, 120);\n\
    \  translate(0, 200 + spacing);\n  var x = 0;\n  var y = 0;\n  var fontSize =\
    \ 20;\n  **1**\n  for (var i = 0; i < textTyped.length; i++) {\n    **2**\n  \
    \  fontSize = fontSizes[i];\n    textFont(font, fontSize);\n    **3**\n    var\
    \ letter = textTyped.charAt(i);\n    var letterWidth = textWidth(letter) + tracking;\n\
    \    **4**\n    if (x + letterWidth > width) {\n      x = 0;\n      y += spacing;\n\
    \    }\n    **5**\n    text(letter, x, y);\n    x += letterWidth;\n  }\n  **6**\n\
    \  var timeDelta = millis() - pMillis;\n  newFontSize = map(timeDelta, 0, maxTimeDelta,\
    \ minFontSize, maxFontSize);\n  newFontSize = min(newFontSize, maxFontSize);\n\
    \  fill(200, 30, 40);\n  if (int(frameCount / 10) % 2 == 0) fill(255);\n  **7**\n\
    \  rect(x, y, newFontSize / 2, newFontSize / 20);\n}\n```\n\n| **1** | The variable\
    \ `textTyped` contains the entered text. This is now processed letter by letter.\
    \ |\n| **2** | The `fontSize` is taken from the array `fontSizes[]` from index\
    \ `i`, and the font is set to this size. |\n| **3** | Now the letter at index\
    \ `i` is selected from the string `textTyped` and saved in `letter`. In addition,\
    \ the letter width `textWidth(letter)` is increased by the value `tracking`. |\n\
    | **4** | When the current position plus the character width exceeds the width\
    \ of the drawing canvas, a line break occurs. Thus `x` is reset to 0 and the vertical\
    \ position `y` is increased by leading. |\n| **5** | The letter is drawn at the\
    \ position `x`, `y`. |\n| **6** | After all letters have been drawn, a blinking\
    \ cursor is displayed. Over time, this is supposed to grow, so `timeDelta`—the\
    \ time that has elapsed since the last typing operation—must be determined. The\
    \ current time is obtained in milliseconds with the `millis()` function. The value\
    \ `pMillis`, which was saved with the last keystroke, is subtracted from this.\
    \ This time difference can now be converted to the range `minFontSize` to `maxFontSize`.\
    \ |\n| **7** | This value is used to draw a rectangle at the current drawing position.\
    \ |\n\n```\nfunction keyTyped(){\n  if(keyCode >= 32){\n    **8**\n    textTyped\
    \ += key;\n    fontSizes.push(newFontSize);\n  }\n}\n```\n\n| **8** | By pressing\
    \ a key, the typed letter of the character string `textTyped` is attached and\
    \ the array `fontSizes[]` is grown by appending the new letter size in `newFontSize`.\
    \ |\n\n```\nfunction keyPressed() {\n  ...\n  **9**\n  pMillis = millis();\n}\n\
    ```\n\n| **9** | The current time is saved in `pMillis` so that the time of the\
    \ last keystroke is always available. |\n\n| Mouse: | Position x: Size |\n|  |\
    \ Position y: Position |\n| Keys: | A–Z: Letter selection |\n|  | CTRL: Save image\
    \ |\n\n## P.3.1.2 Text as blueprint\n\nIn this example, time no longer determines\
    \ letter size. Rather, certain letters modify, for instance, the text orientation.\
    \ In this program, every character is translated using a visual rule. The source\
    \ text thus becomes the blueprint for the composition.\n\n**→ P_3_1_2_01**\n\n\
    The user can freely enter the text using the keyboard. Every character is translated\
    \ by a fixed rule in the program that specifies what will be drawn and how position\
    \ and size are to be altered.\n\nEvery entry can be undone using the backspace\
    \ or delete key.\n\nIn this example, some of the characters are replaced by loaded\
    \ SVG modules.\n\n![image](images/f0156-01.jpg)\n\n![image](images/f0156-02.jpg)\n\
    \n**→ P_3_1_2_01** The program interprets a text (here the lyrics of the song\
    \ *Taschenrechner* by Kraftwerk) as a floor plan. Using the ALT key, different\
    \ RandomSeeds can be generated that constantly give the text a new appearance,\
    \ since there are two possible random directions for the space key.\n\n```\nfunction\
    \ draw() {\n  ...\n  **1**\n  translate(centerX, centerY);\n  scale(zoom);\n \
    \ **2**\n  for (var i = 0; i < textTyped.length; i++) {\n    var letter = textTyped.charAt(i);\n\
    \    **3**\n    var letterWidth = textWidth(letter);\n    **4**\n    switch (letter)\
    \ {\n      **5**\n      case ' ':\n        var dir = floor(random(0, 2));\n  \
    \      if (dir == 0) {\n          image(shapeSpace, 1, -15);\n          translate(4,\
    \ 1);\n          rotate(QUARTER_PI);\n        }\n        if (dir == 1) {\n   \
    \       image(shapeSpace2, 1, -15);\n          translate(14, -5);\n          rotate(-QUARTER_PI);\n\
    \        }\n        break;\n      **6**\n      case ',':\n        image(shapeComma,\
    \ 1, -15);\n        translate(35, 15);\n        rotate(QUARTER_PI);\n        break;\n\
    \      ...\n      **7**\n      default:\n        fill(0);\n        text(letter,\
    \ 0, 0);\n        translate(letterWidth, 0);\n    }\n  }\n  // blinking cursor\
    \ after text\n  fill(0);\n  **8**\n  if (int(frameCount / 6) % 2 == 0) rect(0,\
    \ 0, 15, 2);\n}\n```\n\n| **1** | The origin of the coordinate system is moved\
    \ to the point (`centerX`, `centerY`) before the text is displayed. This flexible\
    \ definition allows the point to be moved via mouse interaction. |\n| **2** |\
    \ All typed letters are processed sequentially. |\n"
