- fmt: '

    The aim of a so-called treemap is to divide a rectangle into smaller rectangles
    according to the frequency with which each word is used in a text. The complete
    text of Jane Austen’s *Pride and Prejudice* is read from a text file and transferred
    to the `Treemap` class for visualization. Individual parameters for the `TreeMap`
    algorithm can be keyed in.


    ![image](images/f0166-01.jpg)


    ![image](images/f0166-02.jpg)


    **→ P_3_1_4_01** Section of a treemap arranged according to frequency, in which
    only horizontal elements are permitted.


    **1**


    ```

    var mapData = {};

    ...

    ```


    **2**


    ```

    var doSort = true;

    var rowDirection = "both";

    ```


    | **1** | The data container `mapData` will later be filled with the loaded text’s
    words and their numbers. |

    | **2** | The `doSort` and `rowDirection` variables control the various layouts
    of the `TreeMap`. |


    ```

    function setup() {

    ...

    joinedText = joinedText.join(" ");

    **3**

    var words = joinedText.match(/\w+/g);

    **4**

    treemap = new gd.Treemap(1, 1, width - 3, height - 3,

    {sort:doSort, direction:rowDirection});

    for (var i = 0; i < words.length; i++) {

    **5**

    var w = words[i].toLowerCase();

    treemap.addData(w);

    }

    treemap.calculate();

    }

    ```


    | **3** | The complete text is split into individual words using `match()`. The
    parameter for this function is a regular expression. With its help, very complex
    text searches can be performed. The one used here is relatively simple: one or
    more consecutive (`+`) word characters (`\w`) are to be searched. The `g` at the
    end means “global,” i.e., the search should not stop after the first occurrence.
    |

    | **4** | The `TreeMap` is generated. The first four parameters specify position
    (`x`, `y`), width, and height. In addition, an object is swapped for the display
    options. |

    | **5** | The array with the words is processed. Each word is initially converted
    into lowercase letters so that different capitalizations of the same word (e.g.,
    when it is used as the first word of a sentence) are still recognized. Then, `addData()`
    adds the word to the treemap and starts the tally with `calculate()`. |


    ```

    function draw() {

    background(255);

    textAlign(CENTER, BASELINE);

    **6**

    for (var i = 0; i < treemap.items.length; i++) {

    var item = treemap.items[i];

    fill(255);

    stroke(0);

    strokeWeight(1);

    **7**

    rect(item.x, item.y, item.w, item.h);

    var word = item.data;

    textFont(font, 100);

    **8**

    var textW = textWidth(word);

    var fontSize = 100 * (item.w * 0.9) / textW;

    **9**

    fontSize = min(fontSize, (item.h * 0.9));

    textFont(font, fontSize);

    fill(0);

    noStroke();

    **10**

    text(word, item.x + item.w/2, item.y + item.h*0.8);

    }

    ...

    }

    ```


    | **6** | The `Treemap` class was used to calculate a treemap element for each
    word, all of which are now available as items in the array. |

    | **7** | Position, width, and height of the element are automatically available
    in the variables `x`, `y` and `w` and `h` and can be used to draw the element’s
    frame. |

    | **8** | Then the font size is set to 100 to determine the width of the word.
    Using a rule of thirds, the font size can be calculated so that the word fits
    within the width of the `item.w` rectangle. |

    | **9** | The word, however, may not be taller than the rectangle. |

