    \  this.scaling = 1;\n}\n```\n\n| 4 | All features of a collage item are summarized\
    \ in the class `CollageItem`. |\n\n| Keys: | 1–3: New random arrangement for one\
    \ of the three levelsS: Save image |\n\n![image](images/f0200-01.jpg)\n\n→ P_4_2_1_02\
    \ → Illustration: Andrea von Danwitz A second version of the program allows the\
