    - **3**: The `hide()` command prevents the video image from being automatically
    displayed on the drawing canvas.


    ```

    function draw() {


    **4**


    if(streamReady) {


    for (var j = 0; j <= mouseX / 50; j++) {


    video.loadPixels();


    **5**


    var pixelIndex = (((video.width - 1 - x)


    + y * video.width) * 4);


    var c = color(video.pixels[pixelIndex],


    video.pixels[pixelIndex + 1],


    video.pixels[pixelIndex + 2]);


    **6**


    var cHSV = chroma(red(c), green(c), blue(c));


    strokeWeight(cHSV.get(''hsv.h'') / 50);


    stroke(c);


    diffusion = map(mouseY, 0, height, 5, 100);


    beginShape();


    **7**


    curveVertex(x, y);


    curveVertex(x, y);


    **8**


    for (var i = 0; i < pointCount; i++) {


    var rx = int( random(-diffusion, diffusion));


    curvePointX = constrain(x + rx, 0, width - 1);


    var ry = int( random(-diffusion, diffusion));


    curvePointY = constrain(y + ry, 0, height - 1);


    curveVertex(curvePointX, curvePointY);


    }


    curveVertex(curvePointX, curvePointY);


    endShape();


    **9**


    x = curvePointX;


    y = curvePointY;


    }


    }


    }

    ```


    - **4**: If the video signal is available, the pixels of the current video image
    are loaded.

    - **5**: As in a static pixel image, the pixels in a video image are also numbered
    row by row. Therefore, the pixel index has to be calculated from the current writing
    position (`x`, `y`). When using webcams directed at the user, it is useful to
    mirror the video image horizontally using the calculation `video.width-1-x`.

    - **6**: The stroke value is set so it is defined by the hue of the pixel. The
    `chroma.js` library helps to convert RGB to HSV values.

    - **7**: The line element can now be drawn. The first curve point is placed on
    the current drawing position. This is done twice because the first and last points
    are not drawn when drawing lines with `curveVertex()`.

    - **8**: The variable `pointCount` now specifies how many curve points are to
    be drawn. The default value is 1, so only one line is drawn. The curve points
    are placed in random positions around the drawing position. The value `diffusion`
    specifies how large this area is.

    - **9**: The last curve point is specified as the new drawing position.


    - Mouse: Position x: Drawing speed, Position y: Direction

    - Keys: Arrow ↓/↑: Number of curve points –/+, Q: Stop drawing, W: Continue drawing,
    Arrow ←/→: Minimum font size –/+, S: Save image


    ![image](images/f0216-01.jpg)


    ![image](images/f0217-01.jpg)


    **→ P_4_3_3_01** The people leave tracks in the image with their movements. The
    length of the lines varies throughout the drawing process, whereby the image is
    sometimes more detailed and sometimes more abstract.


    ![image](images/f0218-01.jpg)


    **→ P_4_3_3_02** Three agents move around the display in this version of the program.
    The first agent’s stroke value is defined by the pixel’s hue; the second’s by
    the pixel’s saturation; and the third’s by the pixel’s brightness.


    ![image](images/f0219-01.jpg)


    **→ P_4_3_3_02** When a subject moves in front of the camera, a collection of
    seemingly random scribbles come together to represent the subject’s form.


    ## P.4.3.4 Emojis from pixel values


    An emotional transformation from a raster element to a symbol: here the things
    that visualize feelings in an SMS become a small part of a greater whole. Any
    collection of thumbnails in this program can be the source material, and the pixel
    values determine which can join.


    **→ P_4_3_4_01**


    Color values can be interpreted as points in 3D space. For this program, it is
    necessary to find the shortest distance from a color value to a set of other color
    values, here the average colors of the individual emojis. There are various mathematical
    methods for this search. Particularly fast and comparatively easy to use is the
    search in a so-called k-dimensional tree. The functionality for this is provided
    by the library `kdTree.js`.


    ![image](images/f0220-01.jpg)


    ```

    <script src="../../libraries/kd-tree/kdTree.js" type="text/javascript"></script>

    <script src="data/emoji-average-colors.js" type="text/javascript"></script>

    ```


    - **1**: Two additional scripts are required for this program. These are loaded
