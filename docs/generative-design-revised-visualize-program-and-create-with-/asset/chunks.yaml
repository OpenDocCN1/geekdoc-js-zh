    \nnextPos.setMag((joints - i) / joints * lineLength);\n\nnextPos.add(pos);\n\n\
    **5**\n\nif (showPendulum) {\n\nnoStroke();\n\nfill(0, 10);\n\nellipse(pos.x,\
    \ pos.y, 4, 4);\n\nnoFill();\n\nstroke(0, 10);\n\nline(pos.x, pos.y, nextPos.x,\
    \ nextPos.y);\n\n}\n\n**6**\n\npendulumPath[i].push(nextPos);\n\npos = nextPos;\n\
    \n}\n\n}\n\nif (showPendulumPath) {\n\nstrokeWeight(1.6);\n\nfor (var i = 0; i\
    \ < pendulumPath.length; i++) {\n\nvar path = pendulumPath[i];\n\nbeginShape();\n\
    \n**7**\n\nvar hue = map(i, 0, joints, 120, 360);\n\nstroke(hue, 80, 60, 50);\n\
    \nfor (var j = 0; j < path.length; j++) {\n\nvertex(path[j].x, path[j].y);\n\n\
    }\n\nendShape();\n\n}\n\n}\n\n}\n```\n\n| **1** | 变量 `angle` 包含第一个摆的角度。在每一帧中，角度略微增加。\
