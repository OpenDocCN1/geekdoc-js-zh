    ## P.2.3.5 Drawing with the pen tablet


    Compared to a conventional mouse, a pen tablet puts several more parameters at
    a user’s disposal, including pressure and position. When drawing, the pen movement
    can be better recorded and interpreted so that the movement of your hand can be
    reproduced more accurately. When you use a pen tablet you are closer to the generative
    process.


    `→ P_2_3_5_01_TABLET`


    The additional parameters provided by a pen tablet are transferred to a basic
    element (in this case a pen). The azimuth, pressure, and inclination define the
    rotation, saturation, and length, respectively, of the element. The parameters
    are read using the tablet classes of the book’s Generative Design library. The
    form is not loaded from an SVG file but rather drawn as a curve, enabling the
    individual curve points to be manipulated more easily.


    ![image](images/f0138-01.jpg)


    ![image](images/f0138-02.jpg)


    `→ P_2_3_5_01_TABLET` → Illustration: Jana-Lina Berkenbusch The new elements are
    always superimposed on the old ones, thereby making it necessary to work from
    the background to the foreground.


    ```

    function draw() {


    var tabletValues = tablet.values();


    1


    var pressure = gamma(tabletValues.pressure, 2.5);


    var angle = tabletValues.azimuth;


    var penLength = cos(tabletValues.inclination);


    2


    if (pressure > 0 && penLength > 0) {


    push();


    translate(mouseX, mouseY);


    rotate(angle);


    3


    var elementLength = penLength * 250;


    var h1 = random(10) * (1.2 + penLength);


    var h2 = (-10 + random(10)) * (1.2 + penLength);


    ...


    4


    pointsX = [];


    pointsY = [];


    pointsX[0] = 0;


    pointsY[0] = 0;


    pointsX[1] = elementLength * 0.77;


    pointsY[1] = h1;


    pointsX[2] = elementLength;


    pointsY[2] = 0;


    pointsX[3] = elementLength * 0.77;


    pointsY[3] = h2;


    pointsX[4] = 0;


    pointsY[4] = -5;


    5


    beginShape();


    curveVertex(pointsX[3], pointsY[3]);


    for (var i = 0; i < pointsX.length; i++) {


    curveVertex(pointsX[i], pointsY[i]);


    }


    curveVertex(pointsX[1], pointsY[1]);


    endShape(CLOSE);


    pop();


    }


    }

    ```


    | 1 | The tablet captures many characteristics of the pen. These three queries
    get pressure and angle information. |

    | 2 | The elements should only be drawn if the pen is not completely perpendicular
    to the tablet and the pressure is greater than zero. |

    | 3 | Declaration of variables that are needed to describe the shape. Using the
    `random()` function, the shapes are varied slightly in their length and width
    when calculated. |

    | 4 | Two arrays, `pointsX` and `pointsY`, are created for the shape’s contour
    points and then filled with values. |

    | 5 | The shape is drawn. |


    | ! | For drawing the closed curve, see: [→P.2.2.3 Shapes from agents](#10-part02ch02.xhtml_p.2.2.3)
    |


