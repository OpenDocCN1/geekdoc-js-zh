    在此示例中，坐标系向右移动 40 像素，向下移动 20 像素，然后旋转 0.5 弧度（约 30°），最后按 1.5 倍缩放。


    在 Processing 中，角度通常以弧度表示，其中 180° 等于圆周率 π（≈ 3.14），旋转方向为顺时针。


