    ## I.2 [www.generative-gestaltung.de](http://www.generative-gestaltung.de)


    *Generative Design: Visualize, Program, and Create with Javascript in p5.js* is
    a tried and tested tutorial that allows people to design with p5.js. It is not
    necessary to type in any code: all the programs in the book, called “sketches,”
    can be downloaded for free from the book’s website for experimentation. This symbol
    **→** indicates the name of a sketch in the download package.


    The code summary page shows the main features of the code and how it affects the
    program output. The book explains how the parameters of the code impact the outcome
    and how users can interact with the sketch to develop their own visual solutions.


    ![image](images/f0008-01.jpg)


    ![image](images/f0009-01.jpg)


    Hello and welcome to Generative Design. Here, you will find all of the sketches
    from the book and their associated code. Run the sketches directly in the browser
    with the p5.js-web-editor or locally on your machine by downloading the code package
    below.


    **![image](images/arrowdown.jpg) Download Code Package**


    ## Library


    ### P.1. Color


    ![image](images/f0009-02.jpg)


    **![image](images/arrowright.jpg) P_1_0_01**


    ![image](images/f0009-03.jpg)


    **![image](images/arrowright.jpg) P_1_1_1_01**


    ![image](images/f0009-04.jpg)


    **![image](images/arrowright.jpg) P_1_1_2_01**


    ## I.3 Projects


    These thirteen works by various media artists, designers, and architects active
    in the field of generative design are intended to serve as a representative overview
    of the topic and a source of inspiration.


    ### 01


    #### 2016/17 **Daily Sketches**


    Zach Lieberman


    ![image](images/f0011-01.jpg)


    **Daily Sketches** is a series of short generative animations shared daily with
    the world by Zach Lieberman on social media for fast feedback. The sketches show
    the process of exploring new visual concepts using geometry, animation, gesture,
    form, and code. Lieberman describes his sketches of the day as follows: “A lot
    of times, as artists, we feel like we’re struggling to find our frequencies and
    what resonates with the frequencies of the world. This act of sketching is a kind
    of tuning of these frequencies.”


    ![image](images/f0012-01.jpg)


    ![image](images/f0013-01.jpg)


    ![image](images/f0014-01.jpg)


    **Design and Development**


    Shota Matsuda (Takram)


    **Photo Credits**


    Koki Nagahama


    **Planck** is a web browser–based framework developed by Takram for the visualization
    of large geographical data sets. The framework is designed to achieve both analytical
    and immersive visual experience by using various techniques, such as parallel
    projection and depth of field. Three visualizations were created for Media Ambition
    Tokyo 2017, presenting data on Japan’s estimated population in 2050, the languages
    people have tweeted in, and world air traffic.


    ### 02


    #### 2017 **Planck**


    Takram


    ![image](images/f0015-01.jpg)


    ![image](images/f0016-01.jpg)


    **Interaction Design**


    Bjørn Karmann


    **Fashion Design**


    Julie Helles


    **Textile Design**


    Kristine Boesen


    **Bachelor‘s Degree Graduation Project**


    Kolding Design School, DK


    Fashion has always been a means of self-expression, but **Abstract_** takes individuality
    a step further by enabling a customer to write themselves into a piece of clothing.
    Abstract_’s interactive platform prompts the customer to write a personal story
    and uses the computer’s camera to capture facial expressions. Data collected from
    the story, the rhythm of the keystrokes, and the customer’s expression are then
    transformed into a visual representation and mapped onto a textile for clothing.


    ### 03


    #### 2015 **Abstract_**


    Bjørn Karmann


    Julie Helles


    Kristine Boesen


    ![image](images/f0017-01.jpg)


    ### 04


    #### 2016 **Rottlace – Björk**


    MIT Media Matter Group


    Christoph Bader


    Dominik Kolb


    Prof. Neri Oxman


    Stratasys Ltd.


    ![image](images/f0018-01.jpg)


    ![image](images/f0019-01.jpg)


    **Photo Credits**


    Santiago Felipe

