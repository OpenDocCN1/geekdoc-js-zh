    **3**

    "1f4a3": {"averageColor": {"r":57, "g":57, "b":52}},

    **4**

    "1f43b": {"averageColor": {"r":187, "g":111,"b":88}},

    **5**

    "1f600": {"averageColor": {"r":227, "g":181, "b":70}},

    ...

    }

    ```


    - **3**：文件 `1f4a3.png`：![image](img/i220-1.jpg)

    - **4**：文件 `1f43b.png`：![image](img/i220-2.jpg)

    - **5**：文件 `1f600.png`：![image](img/i220-3.jpg)


    ```

