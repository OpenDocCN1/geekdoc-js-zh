    by attractors, programmed virtual magnets that attract and repel.


    ![image](images/f0240-01.jpg)

    ![image](images/f0241-01.jpg)


    **→ M_4_3_01** A data visualization of folders and files presented in the form
    of a sunburst diagram. The darker the circle segments, the longer the files in
