    \ at which the images gather and their distance from the center can be specified\
    \ for each layer.\n\n## P.4.2.2 Time-based image collection\n\nIn this example,\
    \ the inner structures of moving images are visualized. After extracting individual\
    \ images from a video file, this program arranges the images in defined and regular\
    \ time intervals in a grid. This grid depicts a compacted version of the entire\
    \ video file and represents the rhythm of its cuts and frames.\n\n→ P_4_2_2_01\n\
    \nTo fill the grid, individual still images are extracted at regular intervals\
    \ from the entire length of a video. Accordingly, a sixty-second video and a grid\
    \ with twenty tiles results in three-second intervals.\n\n![image](images/f0202-01.jpg)\n\
    \n1\n\n```\nfunction draw() {\n  if(movie.elt.readyState == 4) {\n    var posX\
