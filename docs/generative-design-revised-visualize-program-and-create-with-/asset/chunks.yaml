    \n**→ P_1_1_1_01** 在此分辨率下也能看到二次色。\n\n## P.1.1.2 圆形色环\n\n组织颜色的模型有很多种。将色谱排列成圆形（色环）是一种流行的模型，用于比较和谐、对比和色调。你可以控制圆形扇区的数量，以及它们的亮度和饱和度值，从而更好地理解\
    \ HSB 模式下的颜色排列。\n\n**→ P_1_1_2_01**\n\n色环扇区以扇形排列。每个顶点由对应角度的余弦值和正弦值计算得出。可以使用 Processing\
    \ 的一种模式方法，使得创建扇区特别容易。各个点必须按以下顺序设置：首先是中心点，然后依次是外部点。\n\n![image](img/f0064-01.jpg)\n\
    \n![image](img/f0064-02.jpg)\n\n**→ P_1_1_2_01** 扇区数量 45，按键 2。\n\n![image](img/f0064-03.jpg)\n\
    \n**→ P_1_1_2_01** 扇区数量 12，按键 4。\n\n![image](img/f0064-04.jpg)\n\n**→ P_1_1_2_01**\
    \ 扇区数量 6，按键 5。\n\n```\n**1**\nfunction draw() {\ncolorMode(HSB, 360, width, height);\n\
    background(360, 0, height);\n**2**\nvar angleStep = 360 / segmentCount;\nbeginShape(TRIANGLE_FAN);\n\
    **3**\nvertex(width / 2, height / 2);\nfor (var angle = 0; angle <= 360; angle\
    \ += angleStep) {\n**4**\nvar vx = width / 2 + cos(radians(angle)) * radius;\n\
    var vy = height / 2 + sin(radians(angle)) * radius;\nvertex(vx, vy);\n**5**\n\
    fill(angle, mouseX, mouseY);\n}\n**6**\nendShape();\n}\n```\n\n| **1** | 饱和度和亮度的取值范围经过调整，使得鼠标坐标可以作为它们的值。\
    \ |\n\n| **2** | 角度增量 `angleStep` 取决于要绘制的扇区数量（`segmentCount`）。 |\n\n| **3** |\
    \ 第一个顶点位于绘图画布的中心。 |\n\n| **4** | 对于其他顶点，需要将 `angle` 从度数（0–360）转换为弧度（0–2π），因为 `sin()`\
    \ 和 `cos()` 函数要求以这种方式输入角度。此转换通过使用 `radians()` 完成。 |\n\n| **5** | 定义下一个扇区的填充颜色：`angle`\
    \ 的值作为色相，`mouseX` 作为饱和度，`mouseY` 作为亮度。 |\n\n| **6** | 使用 `endShape()` 结束颜色扇区的构建。\
