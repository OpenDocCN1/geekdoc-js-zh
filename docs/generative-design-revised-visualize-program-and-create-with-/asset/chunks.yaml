- fmt: "\n### 31\n\n```javascript\nvar cosineValue = cos(angle);\n```\n\n**28**: The\
    \ value in `aValue` is converted from a number between 10 and 20 to a number between\
    \ 0 and 1.\n\n**29**: Round: `roundedValue` is 3.\n\n**30**: A random number between\
    \ -5 and 5.\n\n**31**: Calculates the cosine of the angle.\n\n## Mouse and Keyboard\n\
    \nThere are several ways to access information using the mouse and keyboard as\
    \ input devices. One option is to query the variables available in p5.js.\n\n\
    ### 32\n\n```javascript\nfunction draw() {\n  console.log(\"mouseposition:\" +\
    \ mouseX + \",\" + mouseY);\n  console.log(\"mousekey pressed?:\" + mouseIsPressed);\n\
    \  console.log(\"key pressed?:\" + keyIsPressed);\n  console.log(\"last pressed\
    \ key:\" + key);\n}\n```\n\nAnother possibility is to implement one of the event\
    \ handlers. An event handler is called when the corresponding event occurs—i.e.,\
    \ when a mouse button or key on the keyboard is pressed.\n\n**32**: The Processing\
    \ variables `mouseX` and `mouseY` always contain the actual position of the mouse;\
    \ `mouseIsPressed` is true if one of the mouse buttons is pressed in that moment.\
    \ For the keyboard, `keyIsPressed` indicates if a key is pressed; the key last\
    \ pressed appears in `key`.\n\n### 33\n\n```javascript\nfunction mouseReleased()\
    \ {\n  console.log(\"The mouse key was released\");\n}\n```\n\nAdditional event\
    \ handlers include `mousePressed()`, `mouseMoved()`, `keyPressed()`, and `keyReleased()`.\n\
    \n**33**: The function `mouseReleased()` is called when the left mouse button\
    \ is released.\n\n## Conditions\n\nIt is often necessary to execute lines of code\
    \ only when certain conditions are met. The `if` statement is used to do this.\n\
    \n### 34\n\n```javascript\nif (aNumber == 3) {\n  fill(255, 0, 0);\n  ellipse(50,\
    \ 50, 80, 80);\n}\n```\n\n### 35\n\n```javascript\nif (aNumber == 3) {\n  fill(255,\
    \ 0, 0);\n} else {\n  fill(0, 255, 0);\n}\n```\n\n### 36\n\n```javascript\nif\
    \ (aNumber == 3) fill(255, 0, 0);\nelse fill(0, 255, 0);\n```\n\nDifferentiating\
    \ between multiple values of a variable can usually be achieved by the `switch`\
    \ command.\n\n**34**: The two lines of code inside the curly brackets are executed\
    \ only when the condition inside the `if` statement is met—i.e., when the value\
    \ of the variable `aNumber` is 3.\n\n**35**: With `else`, the `if` condition is\
    \ expanded by one code snippet that is executed when the specified `if` condition\
    \ is not met.\n\n**36**: If a code snippet consists of only one line, as in the\
    \ previous example, the curly brackets can be eliminated.\n\n### 37\n\n```javascript\n\
    switch (aNumber) {\n  case 1:\n    rect(20, 20, 80, 80);\n    break;\n  case 2:\n\
    \    ellipse(50, 50, 80, 80);\n    break;\n  default:\n    line(20, 20, 80, 80);\n\
    }\n```\n\n**37**: The `switch` command tests if the value of the variable `aNumber`\
    \ corresponds to one of the values listed in the `case` lines, jumps there if\
    \ it does, and continues code execution until the following `break` statement.\
    \ If no corresponding value exists, program execution continues at `default`.\n\
    \n## Functions\n\nThere are often parts of a program that appear in a similar\
    \ way in different places. In many such cases it is wise to encapsulate these\
    \ parts in a function. For example:\n\n### 38\n\n```javascript\nfunction draw()\
    \ {\n  translate(40, 15);\n  line(0, -10, 0, 10);\n  line(-8, -5, 8, 5);\n  line(-8,\
    \ 5, 8, -5);\n  translate(20, 50);\n  line(0, -10, 0, 10);\n  line(-8, -5, 8,\
    \ 5);\n  line(-8, 5, 8, -5);\n}\n```\n\nTo change the star’s appearance in this\
    \ program, the drawing commands have to be changed in two places. It is therefore\
    \ better to store the corresponding lines in a function.\n\n**38**: The coordinate\
    \ system is moved to another location, where a star is made of three lines. The\
    \ coordinate system is then moved again, and a star is drawn using the same commands\
    \ at the new location.\n\n### 39\n\n```javascript\nfunction draw() {\n  translate(40,\
    \ 15);\n  drawStar();\n  translate(20, 50);\n  drawStar();\n}\n\nfunction drawStar()\
    \ {\n  line(0, -10, 0, 10);\n  line(-8, -5, 8, 5);\n  line(-8, 5, 8, -5);\n}\n\
    ```\n\nValues can be passed in functions, which can also return a value as a result.\n\
    \n**39**: The function `drawStar()` now contains the drawing commands. This function\
    \ can be called from any other point in the program to execute the code contained\
    \ there.\n\n### 40\n\n```javascript\nfunction setup() {\n  console.log(\"The faculty\
    \ of 5 is 1*2*3*4*5 = \"\n    + faculty(5));\n}\n\nfunction faculty(theValue)\
    \ {\n  var result = 1;\n  for (var i = 1; i <= theValue; i++) {\n    result =\
    \ result * i;\n  }\n  return result;\n}\n```\n\nIn JavaScript, it is particularly\
    \ common for functions to accept as one of its arguments another function called\
    \ a “callback function.” Callback functions allow actions to occur when triggered\
    \ by an event.\n\n**40**: A function `faculty()` is defined here, in which a value\
    \ is passed, `theValue`. When the function is called, the parameter, 5 in this\
    \ case, is passed in the variable `theValue`. In the function, various calculations\
    \ are executed with this value, and the result is returned using the command `return`.\n\
    \n### 41\n\n```javascript\nloadJSON(\"myData.json\", callback);\n\nfunction callback(data)\
    \ {\n  console.log(data);\n}\n```\n\n**41**: When the p5.js function `loadJSON()`\
    \ is used in this way, the program flow is not blocked by the loading process\
    \ but runs in the background (asynchronous loading). When the file is fully loaded,\
    \ the `callback()` function is called.\n\n## Loops\n\nLoops are used to execute\
    \ a particular command several times within a program. You can program loops in\
    \ several ways:\n\nThe `for` loop is used to loop a code snippet for a specific\
    \ number of repetitions.\n\n### 42\n\n```javascript\nfor (var i = 0; i <= 5; i++)\
    \ {\n  line(0, 0, i * 20, 100);\n  line(100, 0, i * 20, 100);\n}\n```\n\n**42**:\
    \ The two lines of code inside the curly brackets are executed exactly six times.\
    \ First the variable `i` is set to the value 0, then increased by 1 (`i++`) after\
    \ each cycle, as long as the value is 5 or less.\n\n### 43\n\n```javascript\n\
    var myvalue = 0;\nwhile (myValue < 100) {\n  myValue = myValue + random(5);\n\
    \  console.log(\"The value of myValue is \" + myValue);\n}\n```\n\n**43**: This\
    \ `while` loop will continue as long as the value of the variable `myValue` is\
    \ less than 100. A random value between 0 and 5 is added in each new loop cycle.\n\
    \nA `while` loop will continue as long as a certain condition is fulfilled.\n\n\
    There are several ways to go through all the values in an array. Some of the usual\
    \ methods are shown here:\n\n```javascript\nvar planets = [\"Mercury\", \"Venus\"\
    , \"Earth\", \"Mars\",\n  \"Jupiter\", \"Saturn\", \"Uranus\", \"Neptune\"];\n\
    ```\n\n### 44\n\n```javascript\nfor (var i = 0; i < planets.length; i++) {\n \
    \ console.log(planets[i]);\n}\n```\n\n### 45\n\n```javascript\nplanet.forEach(function(planet)\
    \ {\n  console.log(planet);\n});\n```\n\n**44**: Variation 1: The `for` loop runs\
    \ if the variable `i` is smaller than the length of the array.\n\n**45**: Variation\
    \ 2: The array function `forEach()` is used here. This requires a callback function,\
    \ which is called in every iteration of the loop. The variable `planet` contains\
    \ the individual values of the array successively.\n\nIn order to traverse all\
    \ key/value pairs of an object, the following variation of the `for` loop is suitable:\n\
    \n```javascript\nvar planet = {name: \"Saturn\", mass: 5.685e26,\n  temperature:\
    \ 134, diameter: 120536};\n```\n\n### 46\n\n```javascript\nfor (k in planet) {\n\
    \  console.log(\"Key: \" + k + \", Value: \" + planet[k]);\n}\n```\n\n**46**:\
    \ The variable `k` contains each key of the object in succession. This can be\
    \ used to access the associated values.\n\n## P.0.3 Programming beautifully\n\n\
    In programming there are usually many ways to attain a desired result. The fact\
    \ that a program works, however, is just one part of the solution, albeit a very\
    \ important one; there are other aspects you should consider.\n\n### Comments\n\
    \nThe trickier and more complex a program is, the harder it is for others—and\
    \ for you, too, after a short time—to understand it. A program that is not accessible\
    \ cannot be modified or updated. Comments in the program help to clarify the code.\n\
    \n#### 1\n\n```javascript\n// calculate distance between actual and previous mouse\n\
    // position, which represents the speed of the mouse\nvar speed = dist(mouseX,\
    \ mouseY, pmouseX, pmouseY);\n```\n"
