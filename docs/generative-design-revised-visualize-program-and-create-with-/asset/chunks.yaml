    **VOID** 是一系列使用自定义生成软件创作的图像。一群受算法控制的粒子在表面上移动，留下彩色痕迹。随着时间的推移，这会产生一种以不可预测方式发展的抽象构图。


    ![image](img/f0022-01.jpg)


