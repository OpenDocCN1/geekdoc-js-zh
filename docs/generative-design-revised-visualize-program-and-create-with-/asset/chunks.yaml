    **2**\n    var imgX = round(map(x, 0, width, 0, img.width))\n    var imgY = round(map(y,\
    \ 0, height, 0, img.height))\n    var c = color(img.get(imgX, imgY));\n    var\
    \ grayscale = round(red(c) * 0.222 +\n      green(c) * 0.707 +\n      blue(c)\
    \ * 0.071);\n    push();\n    translate(x, y);\n**3**\n    if (fontSizeStatic)\
    \ {\n      textSize(fontSizeMax);\n      if (blackAndWhite) fill(grayscale);\n\
    \      else fill(c);\n    } else {\n      var fontSize = map(grayscale, 0, 255,\n\
    \        fontSizeMax, fontSizeMin);\n**4**\n      fontSize = max(fontSize, 1);\n\
    \      textSize(fontSize);\n      if (blackAndWhite) fill(0);\n      else fill(c);\n\
    \    }\n    var letter = inputText.charAt(counter);\n    text(letter, 0, 0);\n\
    \    var letterWidth = textWidth(letter) + kerning;\n**5**\n    x += letterWidth;\n\
    \    pop();\n**6**\n    if (x + letterWidth >= width) {\n      x = 0;\n      y\
    \ += spacing;\n    }\n    counter++;\n    if (counter >= inputText.length) {\n\
    \      counter = 0;\n    }\n  }\n  noLoop();\n}\n```\n\n| **1** | 只要当前书写位置的 y\
    \ 坐标 `y` 仍小于显示高度，书写过程就继续。 |\n| **2** | 使用 `map()` 函数将显示坐标转换为图像坐标；例如，x 坐标 `x` 从\
    \ 0 到显示宽度之间的值按比例转换为 0 到图像宽度 `img.width` 之间的对应值。 |\n| **3** | 根据所选模式 `fontSizeStatic`（按键\
    \ 1 或 2），字体大小设置为固定值 `fontSizeMax`，或由灰度值变化。 |\n| **4** | 值 `fontSize` 不能为零或负数，否则会导致问题。因此，函数\
    \ `max()` 确保该值至少为 1。 |\n| **5** | 变量 `x` 的值增加字符宽度。 |\n| **6** | 如果 `x` 大于或等于绘图画布的宽度，则换行。`y`\
    \ 值增加行间距，`x` 从绘图画布最左侧重新从 0 开始。 |\n| 按键： | 1：切换字符大小模式 2：切换字符颜色模式 箭头 ↓/↑：最大字符大小\
    \ –/+ 箭头 ←/→：最小字符大小 –/+ S：保存图像 |\n\n![image](img/f0212-01.jpg)\n\n**→ P_4_3_2_01**\
    \ 字符的大小和颜色由底层图像定义。\n\n![image](img/f0213-01.jpg)\n\n**→ P_4_3_2_01** 此处像素的灰度值决定了字体大小。\n\
    \n## **P.4.3.3 实时像素值**\n\n像素的颜色值可以再次转换为图形元素，但有两个重要区别：首先，像素不断变化，因为图像来自视频摄像头；其次，像素由不断运动的“傻瓜代理”依次转换，而非一次性全部转换。摄像头捕捉到的运动以及代理的迁移，因此可以在我们眼前绘制出一幅画面。\n\
    \n**→ P_4_3_3_01**\n\n一个傻瓜代理在绘图画布上移动。在每个位置分析当前实时视频图像的颜色值，并将其作为每个颜色和描边值的参数。鼠标位置定义了描边长度和代理的速度。\n\
    \n![image](img/f0214-01.jpg)\n\n**→P.2.2.1 傻瓜代理**\n\n![image](img/f0214-02.jpg)\n\
    \n**→ P_4_3_3_01** 代理的路径逐渐形成一幅图像。\n\n```\nfunction setup() {\n  ...\n**1**\n \
    \ video = createCapture(VIDEO, function(){\n    streamReady = true\n  });\n**2**\n\
    \  video.size(width, height);\n**3**\n  video.hide();\n  ...\n}\n```\n\n| **1**\
    \ | 函数 `createCapture()` 创建一个视频元素，用于访问网络摄像头上的图像。 |\n| **2** | 来自所连接视频摄像头的实时视频图像被缩小到绘图画布的大小。\
    \ |\n\n"
