    如果字体轮廓不是由直线或曲线构成，而是由可控元素构成，那么我们就越来越脱离底层字体。所有现有的基点通过特殊形状的贝塞尔曲线连接在一起。这只是快速创建数十种新字体的众多方法之一。


    **→ P_3_2_2_01**


