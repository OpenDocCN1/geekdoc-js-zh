    A.7 告别


    ## A.1 展望未来


    你是否想更深入地探索生成式设计？我们希望如此，因为还有太多值得发现！本章概述了作为数据可视化、3D 形状生成、动态粒子动画等基础的一些复杂方法。你可以在我们网站和
    GitHub 频道上的附加示例代码中找到相关代码（链接见[generative-gestaltung.de](http://generative-gestaltung.de)）。在前几章的实际创作之后，本章邀请你反思所学内容，并在生成式设计的背景下探索理论与概念的联系。


    ![image](img/f0229-01.jpg)

    ![image](img/f0230-01.jpg)


    **→ M_1_5_02** 当噪声生成的值控制一群代理的定向运动时，产生的典型图像。代理以点的形式呈现，并在连续绘制于旧图像上时留下轨迹。


    ![image](img/f0231-01.jpg)

    ![image](img/f0232-01.jpg)

    ![image](img/f0234-01.jpg)

    ![image](img/f0235-01.jpg)


    **→ M_2_5_02** 不同正弦波的叠加产生利萨如图形，以其研究者朱尔·安托万·利萨如的名字命名。如果并非按顺序连接生成的点，而是将每个点与所有其他点相连，就会产生令人兴奋的网状结构。


    ![image](img/f0236-01.jpg)

    ![image](img/f0237-01.jpg)

    ![image](img/f0238-01.jpg)

    ![image](img/f0239-01.jpg)


    **→ M_4_3_01** 规则延伸的线条上的点被吸引子（编程中的虚拟磁铁，可吸引和排斥）逐渐变形。


    ![image](img/f0240-01.jpg)

    ![image](img/f0241-01.jpg)


    **→ M_4_3_01** 以旭日图形式呈现的文件夹和文件的数据可视化。圆形扇区颜色越深，表示文件夹中文件未更改的时间越长。可以从硬盘加载并可视化任何文件夹和文件结构。


    ![image](img/f0242-01.jpg)


    **→ M_5_4_01** 维基百科文章链接结构的数据可视化。每个圆圈的大小代表文章长度，颜色代表主题。通过尝试示例程序，可以感受到生成式设计的精髓。在接下来的页面中，我们将反思示例程序背后的理念，并将所学内容置于上下文中。这部分也具有参考性质——它指出了相关主题和联系。


    ![image](img/f0243-01.jpg)


    ## A.2 反思


    本书展示了如何通过代码生成图像。通过尝试示例程序，你可以感受到生成式设计的精髓。在接下来的页面中，我们将反思示例程序背后的理念，并将所学内容置于上下文中。本节还指出了相关主题和联系。


    **现状** 数字化已成为设计学科不可或缺的一部分，我们所有人都使用计算机进行日常工作。然而，设计领域最知名的工具，如 Adobe Creative Cloud
    产品（Photoshop、Illustrator 等），仅具有插图和成像功能。现有的工具，如画笔、剪刀或暗房，可以被虚拟化并提高效率，使我们能够更快地获得结果并更舒适地工作。然而，设计过程并未随着这些工具而发展。**^(1)**
    无论图像是用鼠标还是画笔制作的，例如绘制线条的概念仍然相同。生成式设计与传统方法不同；其设计过程是独特的，并且本质上带来了新的可能性。


    **新的设计过程？** 使用生成式设计带来的设计过程的主要变化是，传统工艺退居幕后，抽象和信息成为新的主要元素。相关的问题不再是“我如何绘制？”而是“我如何抽象？”这是因为从想法到最终图像的过程只能通过算法——一系列规则——来实现，计算机解释并处理这些规则。在显示之前，每个生成的图像必须首先用一组规则完整描述。这给设计师带来了两个挑战：如何抽象一个模糊的想法，以及如何以形式化的方式将想法输入计算机。没有固定的规则来抽象一个想法；为了实现一个复杂的想法，必须将问题分解成更小的部分。这种解决问题的策略也称为“分而治之”。**^(2)**
    例如，一个表面需要尽可能多地填充随机直径的圆，且不能重叠。第一步是将模糊的想法转化为具体而简单的“配方”：画一个新圆。如果这个圆不与显示中的任何其他圆相交，则使这个圆尽可能大。如果圆与另一个相交，则重新开始。**→
    P.2.2.5** 只有通过这种分解，才有可能用编程语言表述各个步骤，从而使其对计算机可执行。编程语言提供了执行此操作的基本构建块，例如*重复、随机性*和*逻辑*，这些将在接下来的页面中更精确地解释。


    **重复** 使我们能够让计算机处理一个任务直到解决，并赋予我们操作大量对象的能力。重复的重要性体现在本书程序中 for 循环的使用频率上，或者体现在 draw
    循环是 `p5.js` 的核心函数这一事实上。


    **随机性** 用于产生变化，以打破计算机严格的规律性。真正的随机性很少产生构图上有趣的结果。相反，当随机性受到限制并以适度的剂量应用时，才会产生这些结果。在
    `p5.js` 中，随机性由关键字 `random` 和 `noise` 表示。**→ P.3.2.5**


    ![image](img/f0246-01.jpg)


    **→ P_3_2_5_01 至 → P_3_2_5_0**


    运动中的文字


    我们使用**逻辑**作为一种控制结构来引导生成过程。在这里，我们可以设置条件，将程序流程导向不同的分支。例如，章节“文本作为蓝图”**→ P.3.1.2**
    包含另一种开关结构，我们可以根据输入的文本执行程序的不同部分：每个字母正常写出，但每当出现标点符号时，书写方向改变，并且标点符号被替换为弯曲元素。控制结构最常用的关键字是
    `if`、`else`、`switch` 和 `case`。


    ![image](img/f0246-02.jpg)


    **→ P.3.1.2**


    文本作为蓝图


