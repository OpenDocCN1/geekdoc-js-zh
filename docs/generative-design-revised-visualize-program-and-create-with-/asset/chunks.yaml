    **Jller** is part of an ongoing research project in the fields of industrial automation
    and historical geology. This apparatus uses computer vision to sort pebbles from
    a specific river by their geologic age. The installation displays natural geological
    history in an automated sorting process that constitutes a performance in its
    own right.


    ![image](images/f0038-01.jpg)


