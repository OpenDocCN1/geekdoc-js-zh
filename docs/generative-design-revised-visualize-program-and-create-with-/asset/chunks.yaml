    ## P.3.2.4 Parallel font outlines


    Using the moiré effect of overlapping grid structures, you can create optical
    illusions that affect font outlines and change the impression of font volumes.
    Eventually forms emerge that detach themselves from the font and lead a life of
    their own.


    **→ P_3_2_4_01**


    The starting point is the font contour of a letter. For each of the many short
    sections that make up the font’s outline, the same calculation procedure is used:
    the section is rotated 90° and set to the correct length. The result is a path
    that runs parallel to the original path. The grid structure arises when this is
    repeated several times with ever-increasing distances.


