    ### Julia Laub

    Born in 1980 in Bavaria. 2003: studied communication design at the HfG Schwäbisch
    Gmünd. Studied abroad at the HGK Basel. 2007: completed master’s thesis, “Generative
    Systems,” with Benedikt Groß. Since 2008: independent graphic designer specializing
    in book design, corporate design, and generative design. 2010: cofounder of the
    design studio onformative (studio for digital art and design) in Berlin with Cedric
    Kiefer. Teacher and leader of workshops at various universities.


    ### Claudius Lazzeroni

    Born in 1965 in Bavaria. 1984: trained to become a photographer with Raoul Manuel
    Schnell. 1987: tutor at Massachusetts College of Art in Boston. 1992: earned degree
    in media design at the BILDO Academy in Berlin. Until 1996: creative director
    at Pixelpark. Until 2001: founder, director, and creative director of the design
    agency IM STALL in Berlin. Since 1999: professor of interface design at the Folkwang
    Kunsthochschule in Essen. Since 2005: exploration, development, and construction
    of solographs. Since 2007: expansion of academic department to include physical
    computing.


    ### Niels Poldervaart

    Born in 1994 in the Netherlands. 2016: earned bachelor’s degree in communication
    and multimedia design at the Avans University of Applied Sciences’s-Hertogenbosch.
    Since 2016: web developer and designer, with a focus on data visualization, e-learning,
    gaming, and graphic design.


    ### Joey Lee

    Born in 1990 in California. 2012: earned bachelor’s degree in geography from the
    University of California, Los Angeles, and master’s degree in geography from the
    University of British Columbia, Vancouver. International activities in research
    and teaching at institutions such as MIT Senseable City Lab in 2013 and at Mozilla
    Science Lab in 2015. Various international exhibitions, prizes, and publications
    in the fields of new spatial and digital media, climate research in urban areas,
    and open source.


