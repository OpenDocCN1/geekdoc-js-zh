  trans: "\n编程语言 Processing 于 2001 年春天由本·弗莱和凯西·瑞斯与一小群助手共同发起。Processing 的主要目标（至今仍是）是让视觉导向的人能够轻松上手编程。Processing\
    \ 是一个用于快速创建数字化、可编程草图（Processing 程序称为“sketch”）的工具或开发环境。^(1) 围绕 Processing 有一个庞大且活跃的社区，极大地促进了协作学习。网上有许多示例、视频、教程等资源。Processing\
    \ 已成为设计、信息图表、建筑和艺术领域编程的标准。\n\n[processingfoundation.org](http://processingfoundation.org)\n\
    \n**凯西·瑞斯和本·弗莱**\n\n`p5.js` 追求同样的目标：让图形编程尽可能简单。`p5.js` 和 Processing 的各个命令极为相似。主要区别在于，与\
    \ Processing 不同，`p5.js` 基于的不是 Java 编程，而是 JavaScript。这在技术上具有重要意义，对用户也很重要，因为 JavaScript\
    \ 是运行在网页浏览器中、使网站动态且交互的编程语言。借助 `p5.js` 创建的程序可以直接在网络上使用。\n\n`p5.js` 是一个开源项目；可以免费下载并用于独立项目。由于\
    \ `p5.js` 是一个 JavaScript 库，而 JavaScript 是互联网时代使用最广泛的编程语言，因此代码示例很容易移植到大多数其他开发环境中。JavaScript\
    \ 是跨平台的，因此同一份源代码可以在所有拥有现代浏览器或相应运行时环境的操作系统上使用——不仅限于计算机，还包括智能手机和平板电脑。\n\n此外，围绕 `p5.js`\
    \ 以及更大范围的 JavaScript，存在着庞大的在线社区。几乎所有与 JavaScript 相关的问题或难题都能在网上找到答案。互联网上充斥着其他 JavaScript\
    \ 库，它们通常可以轻松地与 `p5.js` 结合使用。\n\n对于本书中的程序，我们使用自己的程序库，该库可在本书网站上找到；我们还提供了一份外部库列表。例如，你可以使用\
    \ `generative-design-library` 在绘图板上工作，或创建 Adobe ASE 格式的调色板。\n\n[generative-gestaltung.de](http://generative-gestaltung.de)\n\
    \n**generative-design-library**\n\n**调色板导出 P.1.2**\n\n调色板\n\n**编写程序** `p5.js`\
    \ 使用 JavaScript 编程语言，但比纯 JavaScript 更简单。最重要的命令，尤其是用于图形输出的命令（例如绘制圆形），非常易于使用。初学者无需承担在浏览器窗口中显示图形元素所必需的其他额外结构。\n\
    \n在接下来的页面中，我们将演示如何设置工作空间（开发环境），并介绍 `p5.js` 最重要的语言元素和编程概念。你可以立即开始输入所展示的命令，并查看这些命令生成的结果。\n\
    \n## P.0.1 开发环境\n\n迫不及待想开始了吗？很好！以下是如何尝试我们的程序、扩展它们或创建全新程序的方法。只需下载我们的代码包，其中包含本书的所有程序。链接可在\
    \ [generative-gestaltung.de](http://generative-gestaltung.de) 找到。\n\n### 变体 1：p5.js\
    \ 网页编辑器\n\n这是最简单的入门方式。你只需要一个浏览器和互联网连接。\n\n1. 打开 `p5.js` 的在线编辑器。它提供了一个舒适的环境，可以快速尝试一些东西。在浏览器窗口中，左侧有一个编辑代码的区域。有播放和停止按钮用于启动和停止程序；右侧是画布，你的草图将在此渲染；底部是控制台，用于显示任何错误消息或程序的其他文本输出。[editor.p5js.org](http://editor.p5js.org)\n\
    \n2. 将本书的程序上传到在线编辑器，复制并粘贴文本，或者从本书的收藏中复制一个草图。\n\n![image](img/f0046-01.jpg)\n\n\
    代码编辑器和输出统一在浏览器窗口中。其他几个在线代码编辑器，如 Codepen.io 或 jsfiddle.net，与 `p5.js` 网页编辑器类似，但它们是更通用的解决方案，并未针对\
    \ `p5.js` 进行优化。\n\n### 变体 2：代码编辑器和浏览器\n\n网页编辑器是初步尝试 `p5.js` 的好方法；但从长远来看，我们建议你按照以下说明设置本地工作环境。\n\
    \n1. 首先，一个好的代码编辑器至关重要，例如 Sublime Text、Atom、Brackets 或 Coda。\n\n2. 下载我们的代码包。链接可在本书网站上找到。[generative-gestaltung.de](http://generative-gestaltung.de)\n\
    \n3. 现在，你可以通过在浏览器中打开某个草图文件夹（例如 `P_1_0_01`）中的 `index.html` 来运行程序。\n\n4. 要修改程序，请在文本编辑器中打开\
    \ `sketch.js` 文件，进行编辑，然后在浏览器中打开相应的 `index.html`。在浏览器内容更新之前，必须保存对 `sketch.js` 所做的任何更改。重新加载浏览器以查看更改。\n\
    \n关于使用 `p5.js` 的更详细指南可在 `p5.js` 网站上找到。[p5js.org/get-started](http://p5js.org/get-started)\n\
