    ## **P.4.0 Hello, image**


    A digital image is a mosaic of small color tiles. Dynamic access to these tiny
    elements allows for the generation of new compositions. It is possible to create
    your own collection of image tools with the following programs.


    **→ P_4_0_01**


    An image is loaded and displayed in a grid defined by the mouse. Each tile in
    the grid is filled with a scaled copy of the source image.


    ![image](images/f0190-01.jpg)


    ![image](images/f0190-02.jpg)


    original image


    ![image](images/f0190-03.jpg)


    **→ P_4_0_01** Abstract images are created through the repeated copying and extreme
    scaling of the source image.


    **1**


    var img;


    function preload() {


    img = loadImage(''data/image.jpg'');


    }


    | **1** | The image is loaded in the preload() function. This ensures that the
    loading process is completed before calling the setup() and draw() functions.
    |


    **2**


    function draw() {


    var tileCountX = mouseX / 3 + 1;


    var tileCountY = mouseY / 3 + 1;


    var stepX = width / tileCountX;


    var stepY = height / tileCountY;


    for (var gridY = 0; gridY < height; gridY += stepY) {


    for (var gridX = 0; gridX < width; gridX += stepX) {


    **3**


    image(img, gridX, gridY, stepX, stepY);


    }


    }


    }


    | **2** | The mouse position determines tileCountX and tileCountY and, thereby,
    their width stepX and height stepY. |


    | **3** | The image is drawn using the function image(). The upper-left corner
    of the image is located in the grid (gridX, gridY); width and height are determined
    by tile width stepX and tile height stepY. |


    | Mouse: | Position x: Number of horizontal tilesPosition y: Number of vertical
    tiles |


    | Keys: | S: Save image |


    ![image](images/f0191-01.jpg)


    ## **P.4.1.1 Image cutouts in a grid**


    The principle illustrated below is almost the same as the one in the previous
    example, and yet a whole new world of images emerges. An image’s details and fine
    structures become pattern generators when only a portion of it is selected and
    configured into tiles. The results are even more interesting if these sections
    are randomly selected.


    **→ P_4_1_1_01**


    Using the mouse, a section of the image is selected in the display window. After
    releasing the mouse button, several copies of this section are stored in an array
    and organized in a grid. The program offers two variations. In variation one,
    all copies are made from the exact same section. In variation two, the section
    is shifted slightly at random each time.


    ![image](images/f0192-01.jpg)


    ![image](images/f0192-02.jpg)


    original image


    ![image](images/f0192-03.jpg)


    **→ P_4_1_1_01** By repeatedly copying and moving image sections, abstract images
    are created.


    **1**


    function cropTiles() {


    tileWidth = width / tileCountY;


    tileHeight = height / tileCountX;


    **2**


    imgTiles = [];


    for (var gridY = 0; gridY < tileCountY; gridY++) {


    for (var gridX = 0; gridX < tileCountX; gridX++) {


    **3**


    if (randomMode) {


    cropX = int(random(mouseX - tileWidth / 2,


    mouseX + tileWidth / 2));


    cropY = int(random(mouseY - tileHeight / 2,


    mouseY + tileHeight / 2));


    }


    **4**


    cropX = constrain(cropX, 0, width - tileWidth);


    cropY = constrain(cropY, 0, height - tileHeight);


    **5**


    imgTiles.push(img.get(cropX, cropY,


    tileWidth, tileHeight));


    }


    }


    }


    | **1** | The core of the program is the cropTiles() function. Here the image
    is fragmented and the copies of the sections are stored in an array. |


    | **2** | The image framing array imgTiles is cleared. |'
