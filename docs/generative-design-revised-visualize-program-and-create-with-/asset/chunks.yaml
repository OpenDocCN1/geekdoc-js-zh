    ## **P.2.3.1 Drawing with animated brushes**


    In previous chapters, agents moved autonomously according to predefined rules.
    In this example, users will interact with an agent, creating an experimental drawing
    tool that follows its own set of rules. What makes animated brushes so unusual
    is their ability to be inspired by their own behavior while drawing. This process
    offers a much greater range of expression, as the act of drawing becomes like
    a ballroom dance with a partner.


    **→ P_2_3_1_01**


    ![image](images/f0126-01.jpg)


    The first drawing tool is an excellent demonstration of how much visual potential
    can be contained in very simple principles. A line rotates around the mouse position.
    The lines consolidate in different ways depending on the speed and direction of
    the mouse’s movements. The line changes its color and length with each mouse click.
    The rotation speed can be set with the right or left arrow keys.


    ![image](images/f0126-02.jpg)


    **→ P_2_3_1_01** The mouse was only moved back and forth along the middle of the
    horizontal line. The animated brush thereby generated different levels of density.


