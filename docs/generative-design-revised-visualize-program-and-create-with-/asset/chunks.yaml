    \ 为 3 时，`index` 将依次取值 0、1、2、0、1、2……这意味着网格中只使用了数组中的前几个颜色。 |\n\n**3**\n\n```\nif\
    \ (key == '1') {\n  for (var i = 0; i < tileCountX; i++) {\n    hueValues[i] =\
