    ## **P.2.3.2** **Relation and distance in drawing**


    Since the relation of individual elements to one another is crucial to an overall
    image, it is important for users to be able to control individual parameters such
    as distance and angle; this program provides the necessary knowledge.


    **→ P_2_3_2_01**


    In the previous example, a new element was drawn on the drawing canvas in each
    frame when the mouse button was held down. This function is now restricted: a
    new element is positioned only when it stays a minimum distance from the previously
    drawn element. There are several ways to do this:


    Variation 1: The new element is not placed directly at the mouse position but
    rather at the exact specified minimum distance from the last element.


    Variation 2: The new element is placed at the mouse position, and the minimum
    distance only serves as a threshold value.


    ![image](images/f0130-01.jpg)


    ![image](images/f0130-02.jpg)


    **→ P_2_3_2_01** The more quickly the mouse is moved during the drawing process,
    the longer the lines become.


    function draw() {


    **1**


    if (mouseIsPressed && mouseButton == LEFT) {


    var d = dist(x, y, mouseX, mouseY);


    **2**


    if (d > stepSize) {


    var angle = atan2(mouseY - y, mouseX - x);


    push();


    translate(x, y);


    rotate(angle);


    stroke(col);


    **3**


    if (frameCount % 2 == 0) stroke(150);


    **4**


    line(0, 0, 0, lineLength * random(0.95, 1.0) * d/10);


    pop();


    **5**


    if (drawMode == 1) {


    x = x + cos(angle) * stepSize;


    y = y + sin(angle) * stepSize;


    }


    else {


    x = mouseX;


    y = mouseY;


    }


    }


    }


    }


    | **1** | Holding down the mouse button (i.e., when you want to draw) calculates
    the distance from the last drawing position (x,y) to the current mouse position.
    |


    | **2** | If this distance is greater than stepSize, a new point is drawn. To
    do this, the angle to the previous drawing position has to be calculated. This
    is easily accomplished with the function atan2(), which requires two parameters:
    the vertical distance between the two points mouseY-y and the horizontal distance
    between the two points mouseX-x. |


    |  | ![image](images/f0131-01.jpg) |


    | **3** | The lines are drawn alternately in different colors: the randomly selected
    color (col) or a medium gray. |


    | **4** | A vertical line is drawn. Since the coordinate system was previously
    rotated by angle, the line is now perpendicular to the drawing path. The line’s
    length results from the basic length lineLength, a random factor that varies the
    length slightly, by the factor d/10. This means that the greater the distance
    between the old and new points, the longer the line is drawn, thereby reflecting
    the speed of the mouse. |


    | **5** | In version 1 (drawMode==1), the new point is placed at the distance
    stepSize from the old position. In version 2, the mouse determines the new position.
    |


