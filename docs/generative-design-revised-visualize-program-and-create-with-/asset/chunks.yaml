    \n**32**：Processing 变量 `mouseX` 和 `mouseY` 始终包含鼠标的实际位置；如果此时按下了某个鼠标按钮，`mouseIsPressed`\
    \ 为 true。对于键盘，`keyIsPressed` 指示是否有按键被按下；最后按下的键显示在 `key` 中。\n\n### 33\n\n```javascript\n\
    function mouseReleased() {\n  console.log(\"The mouse key was released\");\n}\n\
    ```\n\n其他事件处理函数包括 `mousePressed()`、`mouseMoved()`、`keyPressed()` 和 `keyReleased()`。\n\
    \n**33**：当释放鼠标左键时，会调用函数 `mouseReleased()`。\n\n## 条件\n\n通常，只有在满足特定条件时才需要执行某些代码行。为此使用\
