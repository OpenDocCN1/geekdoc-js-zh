    \ '5':\nsegmentCount = 6;\nbreak;\n}\n}\n```\n\n| **7** | `switch()` 命令检查最后按下的键，从而可以轻松在不同情况之间切换。\
    \ |\n\n| **8** | 例如，如果按下按键 3，则 `segmentCount` 被设置为值 24。 |\n\n| 鼠标：按键： | 位置 `x`：饱和度位置\
    \ `y`：亮度 1–5：扇区数量 S：保存图像 |\n\n## P.1.2.1 通过插值生成调色板\n\n在每个颜色模型中，颜色都有其明确的位置。从一种颜色到另一种颜色的直接路径总是有精确可定义的渐变，这些渐变会根据具体模型而变化。利用这种插值，你可以创建每个渐变中的颜色组，并定位单个中间色调。\n\
    \n**→ P_1_2_1_01**\n\n由于颜色不是由单个数字而是由多个值定义的，因此需要在这些值之间进行插值。根据所选的颜色模型（RGB 或 HSB），相同的颜色由不同的值定义，从而导致从一种颜色到另一种颜色的路径会经过不同的颜色。例如，在\
    \ HSB 颜色模型中，会绕道经过色环。这种差异源于颜色模型的特性，根据情况，这两种模型都可能非常有用。因此，选择合适的颜色模型来解决特定问题非常重要。\n\
    \n![image](img/f0066-01.jpg)\n\n![image](img/f0066-02.jpg)\n\n**→ P_1_2_1_01**\
    \ RGB 颜色空间中的插值。每一行中，两种颜色以九个步骤进行插值。\n\n```\nfunction draw() {\n**1**\ntileCountX\
    \ = int(map(mouseX, 0, width, 2, 100));\ntileCountY = int(map(mouseY, 0, height,\
    \ 2, 10));\nvar tileWidth = width / tileCountX;\nvar tileHeight = height / tileCountY;\n\
    var interCol;\n...\n**2**\nfor (var gridY = 0; gridY < tileCountY; gridY++) {\n\
    **3**\nvar col1 = colorsLeft[gridY];\nvar col2 = colorsRight[gridY];\nfor (var\
    \ gridX = 0; gridX < tileCountX; gridX++) {\nvar amount = map(gridX, 0, tileCountX\
    \ - 1, 0, 1);\n...\n**4**\ninterCol = lerpColor(col1, col2, amount);\n...\nfill(interCol);\n\
    var posX = tileWidth * gridX;\nvar posY = tileHeight * gridY;\nrect(posX, posY,\
    \ tileWidth, tileHeight);\n...\n}\n}\n}\n```\n\n| **1** | 颜色渐变数量 `tileCountX`\
    \ 和行数 `tileCountY` 由鼠标位置决定。 |\n\n| **2** | 逐行绘制网格。 |\n\n| **3** | 左右两列的颜色设置在数组\
    \ `colorsLeft` 和 `colorsRight` 中。 |\n\n| **4** | 中间颜色通过 `lerpColor()` 计算。该函数在单个颜色值之间执行插值。变量\
    \ `amount` 是一个介于 0 和 1 之间的值，指定了起始颜色和结束颜色之间的位置。 |\n\n| **!** | 在所有调色板章节描述的程序中，可以使用\
    \ C 键保存 Adobe 应用程序的 ASE 格式调色板。 |\n\n| 鼠标：按键： | 左键点击：新的随机颜色集位置 `x`：分辨率位置 `y`：行数\
    \ 1–2：插值样式 S：保存图像 C：保存 ASE 调色板 |\n\n![image](img/f0067-01.jpg)\n\n**→ P_1_2_1_01**\
    \ HSB 颜色空间中的插值。尽管每行开头和结尾的颜色与对面图像中的相同，但生成了完全不同的中间颜色步骤。\n\n## P.1.2.2 从图像中提取调色板\n\
    \n我们周围始终环绕着调色板；我们只需记录并评估它们。从一个人的衣柜照片中获取的颜色——一个非常个性化的调色板——通过以下程序进行选择和排序。你可以导出生成的颜色集合，并将其用作灵感调色板。\n\
    \n**→ P_1_2_2_01**\n\n使用鼠标位置以特定的网格间距，逐行逐个扫描加载图像的像素，以定义各自的颜色值。这些值存储在一个数组中，可以按色相、饱和度、亮度或灰度值进行排序。\n\
