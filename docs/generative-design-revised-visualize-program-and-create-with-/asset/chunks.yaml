    data/pic1.jpg\");\n}\n```\n\n| **2** | 在程序开始运行之前，加载图像并存储到名为 `img` 的变量中。 |\n\n\
    ```\nfunction draw() {\n**3**\nvar tileCount = floor(width / max(mouseX, 5));\n\
    **4**\nvar rectSize = width / tileCount;\n```\n\n"
