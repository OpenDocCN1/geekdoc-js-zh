    ## P.2.3.4 Drawing with dynamic brushes


    A virtual rubber band becomes a dynamic paintbrush as arbitrary basic elements
    are strung like pearls on a string between brushstrokes and a lazy agent. The
    tension between the two poles defines the size and position of the elements when
    drawing.


    `→ P_2_3_4_01`


    A graphic element is dragged on one end by the mouse. The opposite end moves sluggishly
    in the direction of the mouse. Depending on the drawing speed and set inertia,
    the original elements are depicted as stretched to their limits or virtually unchanged.
    The width of the element remains the same.


    ![image](images/f0134-01.jpg)


    ```

    function draw() {


    if (mouseIsPressed && mouseButton == LEFT) {


    1


    var d = dist(x, y, mouseX, mouseY);


    if (d > stepSize) {


    var angle = atan2(mouseY - y, mouseX - x);


    push();


    2


    translate(mouseX, mouseY);


    rotate(angle + PI);


    image(lineModule, 0, 0, d, moduleSize);


    pop();


    3


    x = x + cos(angle) * stepSize;


    y = y + sin(angle) * stepSize;


    }


    }


    }

    ```


    | 1 | In this program, the variables `x` and `y` are used for the position of
    the opposite pole. The distance between these variables and the mouse position
    determines how much the character element is stretched. |

    | 2 | The coordinate system is moved to the mouse position with `translate()`
    and turned so it faces the opposite pole; the element is then drawn. The additional
    angle, PI here, can vary depending on the SVG module. Its length is set at `d`
    (the distance to the mouse), the width to `moduleSize`. |

    | 3 | The position of the opposite pole is moved by the value `stepSize` at every
    step. Since this movement is usually much slower than that of the mouse, a rubber-band
    effect is produced. |


