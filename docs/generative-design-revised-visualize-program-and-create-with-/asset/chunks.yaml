- fmt: '

    Tension is highest when order borders on chaos. Individual forms abandon their
    strict arrangement in the dynamic grid and submit to random configurations. Elements
    inclined to the grid and those adverse to it fight for visual supremacy. It is
    the moments of transition that are important.


    → `P_2_1_2_01`


    A fixed number of circles are drawn to the display one by one, line by line. Random
    values are added to the grid position of a circle, forcing it to move along the
    x- and y-axes. The farther the mouse is moved to the right, the greater the circle’s
    movement.


    ![image](images/f0086-01.jpg)


    ```

    function draw() {


    1


    translate(width / tileCount / 2, height / tileCount / 2);


    ...


    strokeWeight(mouseY / 60);


    for (var gridY = 0; gridY < tileCount; gridY++) {


    for (var gridX = 0; gridX < tileCount; gridX++) {


    var posX = width / tileCount * gridX;


    var posY = height / tileCount * gridY;


    2


    var shiftX = random(-mouseX, mouseX) / 20;


    var shiftY = random(-mouseX, mouseX) / 20;


    3


    ellipse(posX + shiftX, posY + shiftY,


    mouseY / 15, mouseY / 15);


    }


    }


    }

    ```


    | `1` | The origin of the coordinate system is shifted by half a tile width and
    height to the right and down so the circles are located in the center of their
    tiles. |

    | `2` | The higher the x value of the mouse position `mouseX`, the greater the
    range of values for the random numbers. |

    | `3` | Adding the values `shiftX` and `shiftY` to the grid coordinates `posX`
    and `posY` results in the final shifted positions of the circles. |

    | Mouse: | Position x: Circle positionPosition y: Circle sizeLeft click: New random
    values of circle position |

    | Keys: | S: Save image |


    ![image](images/f0087-01.jpg)


    → `P_2_1_2_01` Transparent circles move in the horizontal grid according to the
    mouse position. The vertical mouse position determines the size of the circles.


    ![image](images/f0087-02.jpg)


    → `P_2_1_2_02` The shifting black circles are situated behind a dense grid of
    white circles.


    ![image](images/f0088-01.jpg)


    → `P_2_1_2_02` A color variation with transparent circles.


    ![image](images/f0088-02.jpg)


    → `P_2_1_2_02` In this row, only the violet circles are offset, while the pink
    ones remain fixed to the grid.


    ![image](images/f0089-01.jpg)


    → `P_2_1_2_04` Only the corners of the elements are shifted here, not the elements
    themselves.


    ![image](images/f0089-02.jpg)


    → `P_2_1_2_04` The overlaps and gaps here reveal the grid before it gradually
    becomes unrecognizable.


    ## P.2.1.3 Complex modules in a grid


    Even more interesting is the nesting of several forms into a complex module. In
    this illustration, four different clusters of ellipses increase in size in opposite
    directions and are positioned alternately on the grid. The varied diameters and
    transparencies of the individual ellipses create an illusion of depth.


    → `P_2_1_3_01`


    The module filling the grid consists of a stack of circles that become smaller
    and smaller and move in one direction (top, bottom, right, or left) that is decided
    randomly. The number of circles corresponds to mouse position x, the movement
    to mouse position y.


