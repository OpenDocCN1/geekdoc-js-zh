    **Rottlace** 是专为冰岛唱作人比约克设计的一系列面具中的一部分。其设计灵感源于人体肌肉骨骼系统的几何与材料逻辑。这些面具可被理解为“肌肉织物”：一种捆绑式、连续的多材料结构，为面部和颈部提供形式与结构的完整性，同时赋予其运动能力，最终形成一个无需部件、整体合成的物体。


