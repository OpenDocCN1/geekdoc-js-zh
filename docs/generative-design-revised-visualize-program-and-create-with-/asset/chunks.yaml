    GraphHopper


    **条条大路通罗马** 是一个数据可视化项目，探索了“条条大路通罗马”这一习语。其结果既是信息可视化，也是数据艺术，并揭示了大规模移动模式。这些可视化是通过对现有街道基础设施（OpenStreetMap）应用路由算法，从城市尺度到大陆尺度创建的。除了美学价值外，生成的图像还揭示了道路基础设施如何反映区域、政治和地理状况。


