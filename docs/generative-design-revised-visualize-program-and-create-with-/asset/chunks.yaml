    \ round(x1 + random(-7, 7));\n  var y2 = round(random(-5, 5));\n  var w = floor(random(10,\
    \ 40));\n  var h = height;\n  3\n  set(x2, y2, get(x1, y1, w, h));\n}\n```\n\n\
    | 2 | The x-position of the detail to be copied (`x1`), the target position (`x2`,\
    \ `y2`), and its width (`w`) are all determined randomly. |\n\n| 3 | Using the\
    \ function `get()`, some of the canvas content is copied and then pasted into\
    \ the new position (`x2`, `y2`) using `set()`. |\n\n| Keys: | DEL: Delete displayS:\
    \ Save image |\n\n![image](images/f0197-01.jpg)\n\n## P.4.2.1 Collage from image\
    \ collection\n\nYour archive of photographs now becomes artistic material. This\
    \ program assembles a collage from a folder of images. The cropping, cutting,\
    \ and sorting of the source images are especially important, since only picture\
    \ fragments are recombined in the collage.\n\n→ P_4_2_1_01\n\nAll the pictures\
    \ in a folder are read dynamically and assigned to one of several layers. This\
    \ allows the semantic groups to be treated differently. The individual layers\
    \ also have room for experimentation with rotation, position, and size when constructing\
    \ the collage. Note the layer order; the first level is drawn first and is thus\
    \ in the background.\n\n![image](images/f0198-01.jpg)\n\n![image](images/f0198-02.jpg)\n\
    \n→ P_4_2_1_01 Illustration: Andrea von Danwitz The image consists of three levels:\
    \ scraps of paper are on layer 1, cutouts of the sky on layer 2, and plants and\
    \ street elements on layer 3.\n\n![image](images/f0198-03.jpg)\n\nA new composition\
    \ is immediately created when the images on a level are switched or the parameters\
    \ are changed.\n\n1\n\n```\nvar layer1Images = [];\nvar layer2Images = [];\nvar\
    \ layer3Images = [];\nvar layer1Items = [];\nvar layer2Items = [];\nvar layer3Items\
    \ = [];\n```\n\n| 1 | Several arrays are needed to load the images and arrange\
    \ the layout of the collage pieces. In `layer1Images`, e.g., the loaded images\
    \ are saved for the first layer in order to be used later to create the collage\
    \ items. |\n\n```\nfunction setup() {\n...\n  2\n  layer1Items = generateCollageItems(\n\
    \    layer1Images, 100, width / 2, height / 2,\n    width, height, 0.1, 0.5, 0,\
    \ 0);\n  layer2Items = generateCollageItems(\n    layer2Images, 150, width / 2,\
    \ height / 2,\n    width, height, 0.1, 0.3, -HALF_PI, HALF_PI);\n  layer3Items\
    \ = generateCollageItems(\n    layer3Images, 110, width / 2, height / 2,\n   \
    \ width, height, 0.1, 0.4, 0, 0);\n  3\n  drawCollageItems(layer1Items);\n  drawCollageItems(layer2Items);\n\
    \  drawCollageItems(layer3Items);\n}\n```\n\n| 2 | The function `generateCollageItems()`\
    \ fills the array layers (`layer1Items`,...) with collage items. The parameters\
    \ determine which loaded images are to be used and how many items are to be created,\
    \ and they specify value ranges for positions, scattering, scaling, and rotation.\
    \ In this example, images in the array `layer1Items` are used. All instances are\
