    **Collide** 是一件艺术装置，将记录的运动数据转化为抽象图形和声音。超现实的图像与引人入胜的音景营造出一个沉浸式空间，捕捉运动、色彩和声音的本质，以代表“放手”的体验。受联觉现象（感官的联合）启发，Collide
