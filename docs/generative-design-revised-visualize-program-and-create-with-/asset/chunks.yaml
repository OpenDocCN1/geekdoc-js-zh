    ## **P.4.3.1 Graphics from pixel values**


    Pixels, the smallest elements of an image, can serve as the starting point for
    the composition of portraits. In this example, each pixel is reduced to its color
    value. These values modulate design parameters such as rotation, width, height,
    and area. The pixel is completely replaced by a new graphic representation, and
    the portrait becomes somewhat abstract.


    **→ P_4_3_1_01**


    The pixels of an image are analyzed sequentially and transformed into other graphic
    elements. The key to this is the conversion of the color values of pixels (RGB)
    into the corresponding gray values, because—in contrast to the pure RGB values—these
    can be practically applied to design aspects such as line width. It is advisable
    to reduce the resolution of the source image first.


    ![image](images/f0204-01.jpg)


    ![image](images/f0204-02.jpg)


    **→ P_4_3_1_01 → Photograph: Tom Ziora** The gray value of each pixel defines
    the size of its diameter; the pixels’ original color values are kept.


    **1**


    for (var gridX=0; gridX<img.width; gridX++) {


    for (var gridY=0; gridY<img.height; gridY++) {


    var tileWidth = width / img.width;


    var tileHeight = height / img.height;


    var posX = tileWidth * gridX;


    var posY = tileHeight * gridY;


    img.loadPixels();


    **2**


    var c = color(img.get(gridX, gridY));


    **3**


    var grayscale = round(red(c) * 0.222 +


    green(c) * 0.707 + blue(c) * 0.071);


    **4**


    switch (drawMode) {


    case 1:


    var w1 = map(grayscale, 0, 255, 15, 0.1);


    stroke(0);


    strokeWeight(w1 * mouseXFactor);


    line(posX, posY, posX + 5, posY + 5);


    break;


    case 2:


    ...


    }


    }


    }


    | **1** | The width and height of the original image determines the resolution
    of the grid. |


    | **2** | The color of the pixels at the current grid position (and thus the image)
    is defined. |


