  raw: 'Once a design idea has been translated into code that can be interpreted by
    the computer, it is possible to generate many image possibilities, without the
    hand ever drawing a line. However, the first results are almost never 100 percent
    satisfactory. These results must be evaluated; this evaluation serves as the basis
    for improving the next iteration. In contrast to the conventional approach, we
    do not directly put our hands on the image but instead change the underlying abstraction
    or individual parameters in the program and continue to refine each iteration
    until the desired end result is achieved. Interaction helps accelerate this reciprocal
    effect. A generative system in and of itself is not necessarily interactive, and
    this book does not deal explicitly with interaction. The extra effort involved
    in installing control elements (buttons, sliders, et cetera) is worth it, however.
    These allow us to track and control every parameter change in real time. Since
    all the programs in this book run in the web browser, it is very easy to enhance
    them with standard HTML elements such as buttons, sliders, et cetera. **[→ P.2.1.4](#10-part02ch02.xhtml_p.2.1.4)**


    ![image](images/f0247-01.jpg)


    **→ P.2.1.4**


    Checkboxes in a grid


    ### Design process: analog and digital


    ![image](images/f0245-01.jpg)


    The idea for an output is manually implemented, step by step, in a “visual flight
    rule” fashion. Designers can evaluate and intervene directly in each step as they
    draw on paper, create keyframes for animation, et cetera. If the idea is implemented
    digitally, tools like brushes, scissors, or photo labs become virtual and therefore
    more efficient. Although this makes everything faster and easier, the design process
    remains the same.


    ### Design process: generative


    ![image](images/f0245-02.jpg)


    ![image](images/f0245-03.jpg)


    **P.2.2.5**


    Structural density from agents.


    **New Possibilities in Design** The integration of programming into the design
    process greatly increases the possibilities for designers. Conceptual competence
    still lies with the designer; the computer assumes only the role of the tireless
    helper. It is a given in today’s automated and digital world that designs can
    be executed quickly and easily and that it is possible to generate a composition
    with thousands of elements. But it is more interesting to look at the new possibilities
    of generative design in terms of *emergence, simulation*, and *tools*.


    In the context of generative design, processes are emergent when their results
    are not predetermined and when the interaction of all the elements leads to more
    than is obvious from their individual properties. A common example of *emergence*
    is the flocking behavior of birds: simple rules result in highly complex, unpredictable
    behavior. In the section “Growth structure from agents,” **[→ P.2.2.4](#10-part02ch02.xhtml_p.2.2.4)**
    a very simple algorithm that consists of only two steps results in completely
    unexpected organic structures. (Boids and automata are other examples.)


    ![image](images/f0247-02.jpg)


    **→P.2.2.4**


    Growth structure from agents


    The **simulation** of natural processes is another important method in generative
    design. For example, in the chapter “Agents on a pendulum,” **[→ P.2.2.6](#10-part02ch02.xhtml_p.2.2.6)**
    a structure of several connected pendulums is created. The movement of a single
    pendulum is simple: it circles its point of articulation. However, if several
    of them are linked to form a chain, then the outermost ones move in a complex
    manner. And, as is so often the case, the transfer of knowledge between fields
    leads to amazing results; certainly there are many more models in nature that
    could potentially be transferred to a generative system.


    ![image](images/f0247-03.jpg)


    **→ P.2.2.6**


    Agents on the pendulum


    Perhaps the most important aspect of this increase in possibilities is that the
    designer is now the creator of individualized tools, since each generative program
    is also a customized software tool. This allows the designer to explore new paths
    that would not have been available using existing software, leading to a wider
    range of visual design mediums. It is astonishing how much designers can accomplish
    with tools they develop themselves, as is evident in “Drawing.” **[→ P.2.3](#10-part02ch02.xhtml_p.2.3)**
    Even these simple tools greatly increase a designer’s options, and, because such
    tools can be refined constantly, they become perfectly tailored work instruments.
    In addition, it is usually not a huge leap from a generative program to developing
    one’s own app.


    ![image](images/f0248-01.jpg)


    **→ P.2.3**


    Drawing


    **Looking ahead** The world of generative design has significantly evolved since
    the first edition of this book. Generative design—also referred to as creative
    coding—has established itself in the design world. Working with generative design
    has become common practice, as the basis of data visualizations, artwork, media
    installations, architectural models, video clips, fonts, dynamic appearances—all
    the way to customized mass production. A look into the future clearly shows that
    the use of generative design will continue to increase. This is indicated by the
    following favorable factors:


    The amount of information with which we are confronted daily is rapidly increasing
    thanks to ubiquitously accessible computer networks. Helping society deal with
    this flood of information through data visualization is an important task for
    designers.**^([3](#15-appendix02.xhtml_pg248fn1))** Generative design will be
    indispensable in coping with this challenge.


    The expansion of technological possibilities is a constant source of stimulation
    for generative design. Just a few years ago, for example, it was nearly impossible
    to generate complex, 3D worlds or to make them tangible with virtual reality and
    augmented reality—something that is now possible even on a smartphone. This technical
    potential will continue to be a driving force in generative design.


    Equally important is the community of collaborators, which in almost no other
    design field is so vital. It is astounding how much the internet-based communities
    that have arisen around Processing, p5.js, vvvv, openFrameworks, NodeBox, or Basil.js
    have contributed to libraries, tutorials, sample programs, articles, forum contributions,
    wikis, et cetera. This is certainly in part because creating code—generative design’s
    underlying design medium—is well suited to teamwork, as software development has
    demonstrated. One advantage of code is that it can easily be exchanged and spread,
    in contrast to other media such as video.


    Nevertheless, a designer who has programming skills is still the exception rather
    than the rule today. This has historical and cultural reasons: generally designers
    have been forced to decide to be either artists or technicians. To be both in
    perfect union is rarely an option, for example, in university curricula, although
    this distinction has begun to blur in recent years. In addition, learning this
    new design process—using mathematical-analytical source code to transform an idea
    into a visual result—feels to many like an insurmountable obstacle. Overcoming
    this obstacle is one of this book’s main objectives.


    An understanding of generative design will lead to a new matter-of-factness in
    taking advantange of the computer’s potential. Programming, and thus generative
    design, is rapidly becoming a universal cultural asset and technical tool, just
    as photography and film were in the last century. The possibilities are already
    there; we just need to use them.


    **Georg Trogemann, Jochen Viehoff**


    *CodeArt*, foreword'
