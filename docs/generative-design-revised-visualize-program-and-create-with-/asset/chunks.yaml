    figures, named after the person who researched them, Jules Antoine Lissajous.
    If you connect the generated points not in sequence but rather each point with
    all the others, exciting netlike structures arise.


    ![image](images/f0236-01.jpg)

    ![image](images/f0237-01.jpg)

    ![image](images/f0238-01.jpg)

    ![image](images/f0239-01.jpg)


