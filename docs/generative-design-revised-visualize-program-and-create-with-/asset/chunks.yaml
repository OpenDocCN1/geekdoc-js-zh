    \n**→ P_2_2_5_02** By loading SVG modules, very different images are created.\
    \ Using keys 1 to 3, it is possible to specify which elements are to be visible:\
    \ the SVGs, the connecting lines, or the circles.\n\n## **P.2.2.6 Agents on a\
    \ pendulum**\n\nThese double agents are changeable and chained together. The agents\
    \ move along sets of interrelated pendulums, leaving behind complex traces that\
    \ are reminiscent of the drawings of a Spirograph. Over time, their secret mission\
    \ becomes visible.\n\n**→ P_2_2_6_01**\n\nThe agents form a chain of pendulums.\
    \ To determine the individual positions of the agents, we begin at the center.\
    \ The angle of rotation and the length of the pendulum determine the position\
    \ of the first agent. This is also the rotation center for the next pendulum.\
    \ The farther out in the chain, the shorter the pendulum becomes and the faster\
    \ it turns. Every other pendulum turns in the opposite direction.\n\n![image](images/f0120-01.jpg)\n\
    \n![image](images/f0120-02.jpg)\n\n**→ P_2_2_6_01** Shapes with, e.g., three,\
    \ six, or four symmetry axes are produced with different settings for the ratio\
    \ of the rotational speeds.\n\nfunction draw() {\n\nbackground(0, 0, 100);\n\n\
    **1**\n\nangle += speed;\n\nif (angle <= maxAngle + speed) {\n\n**2**\n\nvar pos\
    \ = center.copy();\n\nfor (var i = 0; i < joints; i++) {\n\n**3**\n\nvar a = angle\
    \ * pow(speedRelation, i);\n\nif (i % 2 == 1) a = -a;\n\n**4**\n\nvar nextPos\
    \ = p5.Vector.fromAngle(radians(a));\n\nnextPos.setMag((joints - i) / joints *\
    \ lineLength);\n\nnextPos.add(pos);\n\n**5**\n\nif (showPendulum) {\n\nnoStroke();\n\
    \nfill(0, 10);\n\nellipse(pos.x, pos.y, 4, 4);\n\nnoFill();\n\nstroke(0, 10);\n\
    \nline(pos.x, pos.y, nextPos.x, nextPos.y);\n\n}\n\n**6**\n\npendulumPath[i].push(nextPos);\n\
    \npos = nextPos;\n\n}\n\n}\n\nif (showPendulumPath) {\n\nstrokeWeight(1.6);\n\n\
    for (var i = 0; i < pendulumPath.length; i++) {\n\nvar path = pendulumPath[i];\n\
    \nbeginShape();\n\n**7**\n\nvar hue = map(i, 0, joints, 120, 360);\n\nstroke(hue,\
    \ 80, 60, 50);\n\nfor (var j = 0; j < path.length; j++) {\n\nvertex(path[j].x,\
    \ path[j].y);\n\n}\n\nendShape();\n\n}\n\n}\n\n}\n\n| **1** | The variable angle\
    \ contains the angle for the first pendulum. In each frame, the angle is incremented\
    \ slightly. |\n\n| **2** | The variable center is copied to pos. It contains a\
    \ value from p5\\. Vector. Thus, only one variable is needed to store the x and\
    \ y coordinates of a point. In addition, the p5\\. Vector object offers much more\
    \ practical computing functionalities. |\n\n| **3** | The angle a for a pendulum\
    \ is calculated from the base angle and a factor, which increases in size the\
    \ farther the pendulum is from the center; e.g., for the value 2 for speedRelation,\
    \ the factor for the pendulum with index 3 is, in this case, 8 (2 to the power\
    \ of 3). For every other angle, the direction of rotation is reversed. |"
