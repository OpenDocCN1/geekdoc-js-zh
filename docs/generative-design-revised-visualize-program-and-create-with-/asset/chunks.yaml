    ### 朱莉娅·劳布

    1980 年出生于巴伐利亚。2003 年：在施瓦本格明德设计学院学习传播设计。曾在巴塞尔设计学院留学。2007 年：与贝内迪克特·格罗斯共同完成硕士论文《生成系统》。自
    2008 年起：独立平面设计师，专攻书籍设计、企业形象设计和生成设计。2010 年：与塞德里克·基弗在柏林共同创立设计工作室 onformative（数字艺术与设计工作室）。在多所大学担任讲师及工作坊负责人。


    ### 克劳迪乌斯·拉泽罗尼

    1965 年出生于巴伐利亚。1984 年：师从拉乌尔·曼努埃尔·施内尔学习摄影。1987 年：在波士顿麻省艺术学院担任助教。1992 年：在柏林 BILDO
    学院获得媒体设计学位。至 1996 年：在 Pixelpark 担任创意总监。至 2001 年：在柏林创立设计机构 IM STALL 并担任总监及创意总监。自
    1999 年起：在埃森福克旺艺术大学担任界面设计教授。自 2005 年起：探索、开发并构建 solographs。自 2007 年起：扩展学术部门，纳入物理计算领域。


    ### 尼尔斯·波尔德瓦特

    1994 年出生于荷兰。2016 年：在斯海尔托亨博斯阿凡斯应用科学大学获得传播与多媒体设计学士学位。自 2016 年起：担任网页开发者和设计师，专注于数据可视化、电子学习、游戏和平面设计。


    ### 乔伊·李

    1990 年出生于加利福尼亚。2012 年：在加州大学洛杉矶分校获得地理学学士学位，并在温哥华不列颠哥伦比亚大学获得地理学硕士学位。曾在麻省理工学院感知城市实验室（2013
    年）和 Mozilla 科学实验室（2015 年）等机构从事国际研究与教学活动。在新空间与数字媒体、城市气候研究及开源领域拥有多项国际展览、奖项和出版物。


    ## A.5 致谢


    感谢 p5.js 的发起人劳伦·麦卡锡。


    感谢 Gold & Wirtschaftswunder 的所有参与者：朱莉娅·屈内、克里斯蒂安·席勒、施特芬·克诺尔、克里斯蒂安·尼古劳斯、安德烈亚斯·勒林茨。


    感谢赫尔曼·施密特美因茨出版社的每一位成员（尤其是布丽吉特·拉布）。


    感谢萨布丽娜·格罗斯提供的文本反馈和建议。


    感谢所有贡献少量代码的贡献者，以及我们在本书中使用的所有 JavaScript 库的开发者（参见代码包中的 readme 文件）。


    感谢 twemoji 团队（[github.com/twitter/twemoji](http://github.com/twitter/twemoji)）。


