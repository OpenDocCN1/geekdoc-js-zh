    # P.0 p5.js 简介


    **P.0 p5.js 简介** 42


    P.0.0 p5.js、JavaScript 与 Processing 44


    P.0.1 开发环境 46


    P.0.2 语言元素 48


    P.0.3 优雅编程 56


    ## P.0.0 p5.js、JavaScript 与 Processing


    本书使用 JavaScript 库 p5.js 来介绍生成式设计的概念。以下页面概述了 JavaScript 的基本元素和功能，并简要介绍了 Processing
    和 p5.js 的历史。


    p5.js 项目于 2013 年 8 月由艺术家、加州大学洛杉矶分校设计媒体艺术项目助理教授劳伦·麦卡锡发起。要解释 p5.js 背后的理念，有必要先提及更早的
    Processing 项目。


