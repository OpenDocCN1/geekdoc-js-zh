  trans: '

    所谓树图（treemap）的目标是根据文本中每个单词的使用频率，将一个矩形分割成更小的矩形。简·奥斯汀的《傲慢与偏见》全文从文本文件中读取，并传输到 `Treemap`
    类中进行可视化。`TreeMap` 算法的各个参数可以手动输入。


    ![image](img/f0166-01.jpg)


    ![image](img/f0166-02.jpg)


    **→ P_3_1_4_01** 按频率排列的树图部分，其中只允许水平元素。


    **1**


    ```

    var mapData = {};

    ...

    ```


    **2**


    ```

    var doSort = true;

    var rowDirection = "both";

    ```


    | **1** | 数据容器 `mapData` 稍后将填充加载文本中的单词及其数量。 |

    | **2** | `doSort` 和 `rowDirection` 变量控制 `TreeMap` 的不同布局。 |


    ```

    function setup() {

    ...

    joinedText = joinedText.join(" ");

    **3**

    var words = joinedText.match(/\w+/g);

    **4**

    treemap = new gd.Treemap(1, 1, width - 3, height - 3,

    {sort:doSort, direction:rowDirection});

    for (var i = 0; i < words.length; i++) {

    **5**

    var w = words[i].toLowerCase();

    treemap.addData(w);

    }

    treemap.calculate();

    }

    ```


    | **3** | 使用 `match()` 将完整文本拆分为单个单词。该函数的参数是一个正则表达式。借助它，可以执行非常复杂的文本搜索。这里使用的表达式相对简单：搜索一个或多个连续（`+`）的单词字符（`\w`）。末尾的
    `g` 表示“全局”，即搜索不应在第一次出现后停止。 |

