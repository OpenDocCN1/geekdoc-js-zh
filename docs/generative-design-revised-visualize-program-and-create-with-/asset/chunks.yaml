    ## 变换


    p5.js 的优势之一在于它可以移动、旋转和缩放坐标系。之后的所有图形命令都参照这个改变后的坐标系。


    **12**


    ```

    translate(40, 20);

    rotate(0.5);

    scale(1.5);

