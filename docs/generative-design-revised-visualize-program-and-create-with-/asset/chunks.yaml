    ## P.2.0 Hello, shape


    Are point, line, and plane still the holy trinity of every form? Wassily Kandinsky’s
    determination of these basic elements is more relevant than ever when viewed in
    the context of generative design. In keeping with this approach, the pixel is
    the origin of the small black circle in the image below. Lines are created by
    a series of pixels while planes are created by a collection of connected lines.


    **→ P_2_0_01**


    The shape is reduced to one pixel when the cursor is located in the middle of
    the upper border of the display window.


    The x-value of the mouse position sets the length of the lines. The y-value sets
    the value and number of the lines.


    ![image](images/f0080-01.jpg)


    ```

    function draw() {


    background(255);


    **1**


    translate(width / 2, height / 2);


    **2**


    var circleResolution = map(mouseY, 0, height, 2, 80);


    **3**


    var radius = mouseX - width / 2 + 0.5;


    **4**


    var angle = TWO_PI / circleResolution;


    strokeWeight(mouseY / 20);


    beginShape();


    for (var i = 0; i <= circleResolution; i++) {


    var x = cos(angle * i) * radius;


    var y = sin(angle * i) * radius;


    line(0, 0, x, y);


    **5**


    // vertex(x, y);


    }


    endShape(CLOSE);


    }

    ```


    | **1** | The origin of the coordinate system is moved to the center of the drawing
    canvas. |

    | **2** | The function `map()` converts the y-value of the mouse position (a number
    between 0 and height) to a value between 2 and 80. |

    | **3** | By subtracting half of the display’s width from the x-value of the mouse
    position, the radius becomes increasingly smaller the more the mouse is moved
    toward the center. Adding 0.5 to the x-value ensures the diameter of the circle
    is at least 1. |

    | **4** | The increment angle is calculated as the full circle, `TWO_PI`, divided
    by the number of lines, `circleResolution`. |

    | **5** | The end points of the line can be connected as a closed vertex by deleting
    the comment characters `//`. |


    | Mouse:Keys: | Position x: Line lengthPosition y: Value and number of linesS:
    Save image |


    ![image](images/f0081-01.jpg)


    **→ P_2_0_02 and → P_2_0_03** In this variation, the end points of the star forms
    are connected to the closed polygons. In addition, when drawing with the mouse,
    the transformation tracks are retained because the background is not given a new
    color.


    ## P.2.1.1 Alignment in a grid


    How can a diagonal with only two possible directions use the strict order of a
    grid to make complex structures? The direction of the diagonals in every grid
    is decided randomly. Overlapping, resulting from changes in line width, creates
    new forms, connections, and interstices.


    **→ P_2_1_1_01**


    In a grid, either a line A is drawn from the upper-left to the lower-right corner
    or a line B is drawn from the lower-left to the upper-right corner. The direction
    of the diagonals is selected randomly.


    ![image](images/f0082-01.jpg)


    ![image](images/f0082-02.jpg)


    **→ P_2_1_1_01** The line values of the diagonals are linked to the mouse position,
    and the types of line endings are switched using keys 1 to 3.


