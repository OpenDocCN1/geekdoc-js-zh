    # P.1 颜色


    与本书不同——我们通过反射和过滤光来感知颜色——计算机是真正的量子弹射器。当我们看屏幕时，光以不同波长直接射入我们的眼睛，并且可以实时操控。以下示例为用户提供了使用颜色时最重要的技术特性，并介绍了在屏幕上设计时使用颜色的几种方法。


    **P.1 颜色** 58


    P.1.0 你好，颜色 60


    P.1.1 色谱 62


