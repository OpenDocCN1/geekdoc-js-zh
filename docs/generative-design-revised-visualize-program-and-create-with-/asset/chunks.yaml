    \ 原始图像：地铁隧道。\n\n![image](img/f0068-03.jpg)\n\n**→ P_1_2_2_01** 按色相排列的像素。\n\n![image](img/f0068-04.jpg)\n\
    \n按饱和度排列的像素。\n\n![image](img/f0068-05.jpg)\n\n按亮度排列的像素。\n\n```\nvar img;\n**1**\n\
