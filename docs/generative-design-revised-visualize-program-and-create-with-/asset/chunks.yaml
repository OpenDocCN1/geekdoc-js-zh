    **1**


    if (mouseIsPressed && mouseButton == LEFT) {


    var d = dist(x, y, mouseX, mouseY);


    **2**


    if (d > stepSize) {


    var angle = atan2(mouseY - y, mouseX - x);


    push();


    translate(x, y);


    rotate(angle);


    stroke(col);


    **3**


    if (frameCount % 2 == 0) stroke(150);


    **4**


    line(0, 0, 0, lineLength * random(0.95, 1.0) * d/10);


