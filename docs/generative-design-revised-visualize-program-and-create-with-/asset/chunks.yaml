    Compared to a conventional mouse, a pen tablet puts several more parameters at
    a user’s disposal, including pressure and position. When drawing, the pen movement
    can be better recorded and interpreted so that the movement of your hand can be
    reproduced more accurately. When you use a pen tablet you are closer to the generative
    process.


