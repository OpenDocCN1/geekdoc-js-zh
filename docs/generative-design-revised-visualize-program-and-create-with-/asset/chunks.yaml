    element (in this case a pen). The azimuth, pressure, and inclination define the
    rotation, saturation, and length, respectively, of the element. The parameters
    are read using the tablet classes of the book’s Generative Design library. The
    form is not loaded from an SVG file but rather drawn as a curve, enabling the
    individual curve points to be manipulated more easily.


