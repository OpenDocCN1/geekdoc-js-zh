    ## P.2.3.7 Drawing with multiple brushes


    The arrangement of the different brushes, all of which simultaneously react to
    the mouse position, gives the impression of drawing in a hall of mirrors. The
    horizontal and vertical mirroring of each brush movement generates kaleidoscopic
    results.


    **→ P_2_3_7_01**


    Creating a paint program is very simple: in each frame, a line is drawn between
    the current mouse position and the one in the preceding frame. This small line
    can easily be drawn several times, either offset as exact copies horizontally
    and vertically or as reflections: horizontal, vertical, or diagonal—or both offset
    and reflected at the same time.


    ![image](images/f0146-01.jpg)


    ![image](images/f0146-02.jpg)


    **→ P_2_3_7_01** Three different ways to use mirror axes and repetitions.


