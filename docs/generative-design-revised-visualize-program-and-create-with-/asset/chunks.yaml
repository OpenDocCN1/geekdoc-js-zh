    ## Setup, Draw, and Preload


    p5.js provides various functions that are called automatically. The two most important
    are `setup()` and `draw()`.


    The `draw()` function is called in every drawing step and each command line is
    executed each time.


    **4**


    ```

    function draw() { }

    ```


    **4** Although this `draw()` function contains no commands, it keeps the program
    running.


    **5**


    ```

    function draw() {

    console.log(frameCount);

    }

    ```


    The `draw()` function is displayed with a preset frequency that specifies how
    many images are shown per second. The standard number is set at sixty images per
    second, but this can be reset using the command `frameRate()`.


    **5** A `draw()` function with one command. The command `console.log()` writes
    text to the console. In this case, it displays the continually increasing number
    of the actual frame.


    **6**


    ```

    frameRate(30);

    ```


    However, if the computational effort per frame becomes so high that the browser
    is unable to execute it within the preset time, the set frame rate decreases automatically.


    Some actions should only be performed once when the program is started and not
    repeatedly in each frame. The `setup()` function is used for this.


    **6** This drawing speed is set at 30 images per second.


    **7**


    ```

    function setup() {

    frameRate(30);

    }

    ```


    The `preload()` function ensures that additional data are fully loaded when the
    program starts.


    **7** These commands, which should be executed just once when the program is started,
    appear in the `setup()` function.


    **8**


    ```

    function preload(){

    img = loadImage("data/pic1.jpg");

    }

    ```


    **8** In `preload()` the instructions for loading data are inserted; in this example
    an image should be loaded.


    ## Drawing Canvas and Renderer


    A drawing canvas is created within the browser window. This is the display window
    for the program’s visual output and can be scaled to any size.


    **9**


    ```

    createCanvas(640, 480);

    ```


    In addition to the parameters’ width and height, using the command `createCanvas()`
    makes it possible to enter which renderer should be used for displaying the image.
    The renderer is responsible for how the different graphic commands are actually
    translated into pixels. The following rendering options are available:


    **9** The drawing canvas is now 640 pixels wide and 480 pixels high.


    **10**


    ```

    createCanvas(640, 480, P2D);

    ```


    **11**


    ```

    createCanvas(640, 480, WEBGL);

    ```


    **10** The standard renderer: this is used if nothing else has been specified.


    **11** Renderer for hardware-accelerated 3D graphics in the web browser.


    ## Transformations


    One of the strengths of p5.js is that it can move, rotate, and scale the coordinate
    system. All graphic commands thereafter refer to this altered coordinate system.


    **12**


    ```

    translate(40, 20);

    rotate(0.5);

    scale(1.5);

    ```


    In this example, the coordinate system is moved 40 pixels to the right and 20
    pixels downward, then rotated 0.5 radians (about 30°), and finally scaled by a
    factor of 1.5.


    In Processing, angles are generally shown in radians, in which 180° equals the
    number pi (≈ 3.14) and the rotation is in a clockwise direction.


    **12** ![image](images/f0050-01.jpg)


    ## Variables and Data Types


    In a program, information is stored in variables so that it is available to other
    parts of the program. These variables can have any name other than the keywords
    for JavaScript keywords. Keywords can be recognized by their special color in
    the editor.


    **13**


    ```

    var myVariable;

    myVariable = 5;

    ```


    **13** The variable `myVariable` is created. The value 5 is then saved there.


    Variables can contain different data types. Unlike most other programming languages,
    JavaScript does not have to take this into account when creating a variable. Nevertheless,
    it is important to keep track of which variables store which type of value. For
    example, data types can be:


    **14**


    ```

    var myBooleanvalue = true:

    ```


    **15**


    ```

    var myInteger = 7:

    ```


    **16**


    ```

    var myFloatingPointNumber = -3.219:

    ```


    **17**


    ```

    var myCharacter = "A":

    ```


    **18**


    ```

    var myString = "This is a text":

    ```


    **14** Logic values (Boolean values): true or false


    **15** Integers: e.g., 50, -532.


    **16** Floating point value: e.g., 0.02, -73.1.


    **17** A single character: e.g., “a”, “A”, “9”, “&”.


    **18** Character string/text: e.g., “Hello, world”.


    ## Arrays


    When working with a large number of values, it is inconvenient to have to create
    a variable for each value. An array allows a list of values to be managed.


    **19**


    ```

    var planets = ["Mercury", "Venus", "Earth", "Mars".

    "Jupiter", "Saturn", "Uranus", "Neptune"]:

    ```


    **19** Arrays are defined by their square brackets. Within these, any number of
    values (here the eight planet names) can be listed, separated by commas.


    **20**


    ```

    console.log(planet[0]):

    ```


    **20** Values can be accessed by entering an index number in the square brackets
    following the variable name. The index 0 points to the first entry in the array.


    If values are not immediately assigned to an array, the array can be created first
    and filled later:


    **21**


    ```

    var planetDiameter = [];

    planetDiameter[0] = 4879;

    planetDiameter[1] = 12104;

    planetDiameter[2] = 12756;

    planetDiameter[3] = 6794;

    ...

    ```


    Arrays have many other functions for processing elements. In this book we mainly
    use `<yourarray>.push()` to add new elements to the end of an array.


    **21** The square brackets initialize an empty array. Values are then assigned
    to the array. This could also happen later while the program is running.


    **22**


    ```

    planet.push ("Pluto");

    ```


    **22** Although Pluto is no longer considered a planet, its name can be added
    to the array `planet` in this way.


    ## Objects


    In addition to arrays, many pieces of information can be stored in objects at
    one time. The difference is that individual values are not accessed via a numeric
    index but via a key.


    **23**


    ```

    var planet = {name: "Saturn", mass: 5.685e26,

    temperature: 134};

    planet.diameter = 120536;

    console.log("mass in kg: " + planet.mass);

    ```


    Alternatively, a value can be accessed as follows. This is necessary if the keys
    are not fixed from the beginning but are dynamically generated or read out.


    **23** JavaScript objects are created by enclosing a set of key/value pairs within
    a set of curly brackets `{}`. Here an object with three key/value pairs is generated.
    Another key/value pair is added to the existing object, and one of the values
    is accessed and logged to the console.


    **24**


    ```

    var k = "mass";

    console.log("mass in kg: " + planet[k]);

    ```


    **24** If the name of the key is stored in a variable, then the value can be accessed
    using that variable as a reference to that key.


