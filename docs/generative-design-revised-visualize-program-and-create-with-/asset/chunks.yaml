    \ = map(currentImage, 0, imageCount,\n      0, movie.duration());\n    3\n   \
    \ movie.time(nextTime);\n    4\n    gridX++;\n    if (gridX >= tileCountX) {\n\
    \      gridX = 0;\n      gridY++;\n    }\n    5\n    if (currentImage >= imageCount)\
    \ noLoop();\n  }\n}\n```\n\n| 1 | Every time the `draw()` function is run, an\
    \ image is selected from the video and depicted in the grid. The first image at\
    \ time 0 can be placed immediately. |\n\n| 2 | The next time in the video (`nextTime`)\
    \ is calculated. The variable `currentImage` (a number between 0 and `imageCount`)\
    \ is converted to a second value between 0 and the entire playing time of the\
    \ video. |\n\n| 3 | Using the `time()` function, the program jumps to the newly\
    \ calculated time. |\n\n| 4 | To define the next tile, `gridX` is increased by\
    \ 1. If the end of the line has been reached, the program jumps to the first image\
    \ of the next line by setting `gridX` to 0 and increasing `gridY` incrementally.\
    \ |\n\n| 5 | The end of the program is reached when all the tiles are filled with\
    \ images. |\n\n| Keys: | S: Save image |\n"
