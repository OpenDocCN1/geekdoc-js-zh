- fmt: "\nThe programming language Processing was initiated in the spring of 2001\
    \ by Ben Fry and Casey Reas with a small group of assistants. The main aim of\
    \ Processing was and still is to give visually oriented people easy access to\
    \ programming. Processing is a tool or development environment for the quick creation\
    \ of digital, programmed sketches (a Processing program is called a “sketch”).^([1](#08-part02ch00.xhtml_pg44fn1))\
    \ There is a large, vibrant community surrounding Processing that greatly simplifies\
    \ collaborative learning. There are many examples, videos, tutorials, et cetera,\
    \ available online. Processing has become standard for programming in design,\
    \ infographics, architecture, and art.\n\n[processingfoundation.org](http://processingfoundation.org)\n\
    \n**Casey Reas and Ben Fry**\n\n`p5.js` pursues the same goal: making it as easy\
    \ as possible to program graphics. The individual commands of `p5.js` and Processing\
    \ are extremely similar. The main difference is that unlike Processing, `p5.js`\
    \ is based not on Java programming but on JavaScript. This is technically significant\
    \ as well as important for users because JavaScript is the programming language\
    \ that runs in web browsers and makes websites dynamic and interactive. The programs\
    \ created with the help of `p5.js` can be used directly on the web.\n\n`p5.js`\
    \ is an open-source project; it can be downloaded for free and used for independent\
    \ projects. Since `p5.js` is a JavaScript library and JavaScript is the most widely\
    \ used programming language of the internet age, it is easy to translate the code\
    \ examples to most other development environments. JavaScript is cross-platform,\
    \ so the same source code can be used on all operating systems for which a modern\
    \ browser or a corresponding runtime environment exists—not only on computers\
    \ but also on smartphones and tablets.\n\nAdditionally, there is an enormous online\
    \ community surrounding `p5.js` and, to an even greater extent, JavaScript. There\
    \ is an online answer to almost any JavaScript-related question or problem. The\
    \ internet is full of other JavaScript libraries, which can usually be combined\
    \ easily with `p5.js`.\n\nFor the programs in this book, we use our own program\
    \ library, which can be found on the book’s website; we also have provided a list\
    \ of external libraries. For example, you can use the `generative-design-library`\
    \ to work on your graphics tablet or create color palettes in Adobe ASE format.\n\
    \n[generative-gestaltung.de](http://generative-gestaltung.de)\n\n**generative-design-library**\n\
    \n**Palette exporting P.1.2**\n\nColor palettes\n\n**Writing Programs** `p5.js`\
    \ uses the JavaScript programming language, but it is simpler than pure JavaScript.\
    \ The most important commands, especially those for graphical output (such as\
    \ drawing a circle), are very easy to use. The beginner is not burdened with additional\
    \ constructions that would otherwise be necessary to display graphic elements\
    \ in the browser window.\n\nOn the following pages we will demonstrate how to\
    \ set up a work space—the development environment—and introduce the most important\
    \ language elements and programming concepts of `p5.js`. You can start immediately\
    \ by typing the commands presented and seeing what those commands generate.\n\n\
    ## P.0.1 The development environment\n\nItching to get started? Good! Here’s how\
    \ to try out our programs, expand on them, or create completely new ones. Just\
    \ download our code package with all the programs of the book. The link can be\
    \ found at [generative-gestaltung.de](http://generative-gestaltung.de).\n\n###\
    \ Variation 1: The p5.js Web Editor\n\nThis is the easiest way to start. All you\
    \ need is a browser and access to the internet.\n\n1. Open the online editor of\
    \ `p5.js`. This provides a comfortable environment in which to try something quickly.\
    \ In the browser window, there is an area to edit the code on the left side. There\
    \ are play and stop buttons to start and stop the program; a canvas on the right\
    \ where your sketch will be rendered; and, at the bottom, the console, which will\
    \ display any error messages or other text output from the program. [editor.p5js.org](http://editor.p5js.org)\n\
    \n2. Upload the book’s programs to the online editor, copy and paste the text,\
    \ or copy one of the sketches from the book’s collection.\n\n![image](images/f0046-01.jpg)\n\
    \nCode editor and output are united in the browser window. Several other online\
    \ code editors, such as Codepen.io or jsfiddle.net, are similar to the `p5.js`\
    \ web editor, but they are more generic solutions and are not optimized for `p5.js`.\n\
    \n### Variation 2: Code Editor and Browser\n\nThe web editor is a great way to\
    \ initially experiment with `p5.js`; in the long term, however, we recommend that\
    \ you set up a local working environment, as described below.\n\n1. Above all,\
    \ a good code editor, such as Sublime Text, Atom, Brackets, or Coda, is essential.\n\
    \n2. Download our code package. The link can be found on the book’s website. [generative-gestaltung.de](http://generative-gestaltung.de)\n\
    \n3. You can now run the program by opening the `index.html` from one of the sketch\
    \ folders (e.g., `P_1_0_01`) in the browser.\n\n4. To modify a program, open the\
    \ `sketch.js` file in a text editor, make some edits, and open the corresponding\
    \ `index.html` in the browser. Any changes made in `sketch.js` must be saved before\
    \ the browser content is updated. Reload the browser to view the changes.\n\n\
    A more detailed guide to working with `p5.js` can be found on the `p5.js` website.\
    \ [p5js.org/get-started](http://p5js.org/get-started)\n\n**!** Some of our code\
    \ samples need to be run on a server to work. These sketches use external resources\
    \ such as a webcam or external files and must be executed by a web server (the\
    \ URL of the sketch must start with “http” or the browser will prohibit the use\
    \ of these resources). Detailed explanations of how to use them can be found on\
    \ the book’s website.\n\n![image](images/f0047-01.jpg)\n\nA code editor, for example\
    \ Sublime Text. The editor is a separate program and is not integrated in the\
    \ browser.\n\n![image](images/f0047-02.jpg)\n\nThe file `index.html`, and thus\
    \ the sketch, is opened directly in the browser from the hard drive. The URL therefore\
    \ also starts with “file.”\n\n## P.0.2 Language elements\n\nTo be able to give\
    \ instructions to a computer, you will need to speak its language. In the following\
    \ section, the most important functions and control structures of JavaScript and\
    \ `p5.js` will be introduced.\n\n### Hello, Ellipse\n\nA first program. Open the\
    \ `sketch.js` file (located in the `empty-example` folder), enter the following\
    \ line within the `draw()` function, and open the associated `index.html` in a\
    \ browser.\n\n```\nfunction draw() {\n  ellipse(50, 50, 80, 80);\n}\n```\n\nThere\
    \ are commands that draw, such as `ellipse`, `rect`, `line`, et cetera, and commands\
    \ that specify how the graphic that follows should be drawn, such as `stroke`,\
    \ `strokeWeight`, `noStroke`, `fill`, `noFill`, et cetera. Once a drawing mode\
    \ has been configured, it will apply for all additional drawing commands until\
    \ the drawing mode is reconfigured. Most drawing commands require one or more\
    \ parameters that indicate where something should be drawn and at what size. The\
    \ unit of measure for this is the pixel. The origin of the coordinate system is\
    \ located in the upper left corner of the drawing canvas.\n\n1. A circle is drawn\
    \ on the canvas. A function is created by declaring the word “function” followed\
    \ by the function name and a set of parentheses `()`. What the function should\
    \ do—for example, draw a circle—is defined between the curly brackets `{...}`.\n\
    \n```\npoint(60, 50);\n```\n\nThe pixel generated by the command `point(60, 50)`\
    \ is thus drawn sixty pixels from the left edge and fifty pixels from the upper\
    \ edge.\n\n2. ![image](images/f0048-01.jpg)\n\nOf course, it is possible to have\
    \ more than one line of code. The individual lines are then processed sequentially\
    \ from top to bottom. The following command lines are thus read by `p5.js`:\n\n\
    ```\nfill(128);\nstrokeWeight(1);\n```\n"
