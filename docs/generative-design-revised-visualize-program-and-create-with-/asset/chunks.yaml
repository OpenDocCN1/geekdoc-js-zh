    \ and `height`. The scaling varies from 0.1 to 0.5 and no rotation is used. |\n\
    \n| 3 | Each time the `drawCollageItems()` function is run, one of the layers\
    \ is drawn. The order of the layers’ invocation determines the construction of\
    \ the final composition. The images from `layer1Items` are located in the background,\
    \ those from `layer3Items` in the foreground. |\n\n4\n\n```\nfunction CollageItem(image)\
