    This group is working to creating specifications and extensions to current standards
    to expose functionality that will give developers more control in tracking performance
    naturally in a browser. Their charter is located here: http://www.w3.org/performance/.
    We will be discussing the process and specifications that have come from this
    in Chapter 5.


    Since the point of this book is not just about performance but also about visualizing
    information, I recommend Nathan Yau''s book Visualize This: The FlowingData Guide
    to Design, Visualization, and Statistics (Wiley, 2011) as a great primer for data
    visualization as a craf. Nathan also maintains http:// flowingdata.com.


    # Summary


    This chapter explored some introductory concepts around performance. We defined
    two aspects of performance for applications; web performance is an indication
    of the time it takes to serve content to our ends, and runtime performance is
    an indication of how responsive our applications are when our users are using
    them.


    We briefly explored some of the protocols that hold the web together, the TCP/IP
    model, and we traced a request for content from our browser up the TCP/IP model,
    correlating each action along the way with which the model was taking place. We
    examined the architecture of a TCP round trip and saw the steps involved browsers
    need to take for every piece of content that we request—sometimes in the case
    of HTTP redirects, multiple times for each request.


