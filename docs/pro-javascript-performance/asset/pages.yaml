  md: '# CHAPTER 1


    # # What is Performance


    Performance refers to the speed at which an application functions. It is a multifaceted
    aspect of quality. When we''re talking about web applications, the time it takes
    your application to be presented to your users is what we will call web performance.
    The speed at which your application responds to your users’ interactions is what
    we will call runtime performance.


    Performance in the context of web (and especially mobile web) development is a
    relatively new subject, but it is absolutely overdue for the attention it has
    been getting.


    In this book we will explore how to quantify and optimize JavaScript performance,
    in the context of both web performance and runtime performance. This is vitally
    important because JavaScript is potentially the largest area for improvement when
    trying to address the total performance of your site. Steve Saunders, architect
    of YSlow and PageSpeed, and pioneer in the world of web performance, has demonstrated
    this in an experiment where he showed an average performance improvement of 31%
    when removing JavaScript from a sample of web sites. As Steve did in his experiment,
    or we can refine how we write JavaScript and learn to measure the efficiencies
    in we write.


    It''s not realistic to remove JavaScript from our front-end, so let''s look at
    how making our JavaScript more efficient. Even more important, let''s look at
    how we can create automated tools to track these efficiencies and visualize them
    for reporting and analysis.


    # # Web Performance


    Sitting with your laptop or device, you can open a web browser, type in a URL
    and hit Enter, and wait for the page to be delivered and rendered by your browser.
    The span of time that you are waiting for the page to be depends on web performance.
    For our purposes we will define web performance as an overall indicator of the
    time it takes for a page to be delivered and made available to your user.


    There are many things that influence web performance, network latency being the
    first. How is your network? How many round trips and server responses are needed
    to serve your content?


    To better understand network latency, let''s first look at the steps in an HTTP
    transaction (1.1). When it requests a URL, the URL for a page or a URL for each
    asset on a web page, the browser spins up a thread to handle the request and initiates
    a DNS lookup at the remote DNS server. This allows the browser to get the IP address
    for the URL


