  md: "That's better. By inlining perfLogger, we no longer block the loading and executing\
    \ of it, so that our methodology doesn't interfere with the recording of our data.\n\
    This is a valuable lesson—always be careful that your metrics are not being altered\
    \ by the way you are capturing them. The only way to do this is to give your data\
    \ a thorough analysis; never take your results at face value.\n\n# Why Not to\
    \ Lazy Load Images\n\nAfter we've explored so far this chapter, it might be tempting\
    \ to go and try to lazy load as much as possible. But lazy loading is not a silver\
    \ bullet. You need to be sure that the content isn't needed on page load. You\
    \ also need to ensure that your page function works with JavaScript turned off.\n\
    The way we lazy load images would be to alter the HTML of the src attribute to\
    \ remove the contents of the src attribute of each image. We could just move the\
    \ contents of the src attribute to an attribute in the image tag of our own design,\
    \ maybe the rel attribute. This would prevent the images from being downloaded:\n\
    \n```\n<img src=\"# rel=\"[path to image]\" />\n```\n\nThen, on loading we use\
    \ JavaScript to iterate through all of the image tags on the page and set each\
    \ one's src attribute to the content of the new attribute:\n\n```\n<script>\n\
    function lazyLoadImages() {\n  var img = document.getElementsByTagName(\"img\"\
    );\n  for(var x = 0; x<img.length; x++) {\n    img[x].src = img[x].rel;\n  }\n\
    }\n</script>\n```\n\nThere are several scenarios where that's not a good idea,\
    \ mostly because of issues that prevent lazy JavaScript from loading the images\
    \ at all. If a user comes to our site with JavaScript turned off, they won't get\
    \ images loaded at all. If we use third-party ads on our site, it's possible for\
    \ the third party JavaScript code to have an error and prevent any of our images\
    \ from loading. When search engines come to index our pages there is a chance\
    \ that they won't see our images, so they will cache our page with no images and\
    \ display our preview. The most significant reason, that using the rel attribute\
    \ to hold the image path is not a semantically correct way to use the marker.\n\
    That being semantically correct in the context of HTML means that we are retaining\
    \ the meaning of the tag in our usage of the tag; use HTML tags because of what\
    \ the tags say about the data they contain, instead of visual decoration the developer\
    \ might assign to them. If we use tags meaningfully—for example using <p> tags\
    \ for non-visual spacing—external applications accessing our pages, search engines\
    \ or screen readers should be able to parse the information in the pages meaningfully.\
    \ It also allows us to separate content from presentation.\n\n# Summary\n\nThis\
    \ chapter explored in detail how we can use JavaScript to improve aspects of web\
    \ performance, specifically how the browsers parse and render our content, and\
    \ the potential bottlenecks in this process. We looked at ways to prevent the\
    \ blocking of other content by downloading of external JavaScript file, including\
    \ the new async attribute, and creating the script programmatically."
