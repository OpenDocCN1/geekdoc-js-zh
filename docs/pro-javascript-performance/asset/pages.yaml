  md: '+   The injected code installs API intercepts for the winsock, wininet, and
    SSL API functions and intercepts all of the API calls to record the waterfall
    data.


    +   The injected code also runs a server on localhost (inside of the browser)
    for our browser extensions to communicate.


    +   Our browser extensions (one for each supported browser) poll localhost over
    Ajax for any commands they need to execute (navigating the browser for example).


    +   The browser extensions also post events as they happen to be the injected
    browser code (onload for example).


    It''s quite a bizarre setup to think that all of that is going on inside of the
    browser just to control the browser and record the network activity.


    # How do you use WebPagetest with the applications that you develop?


    WebPagetest IS the application that I develop ;- I use it a lot when working with
    developers on website issues, though, so I get to see it from both a user and
    developer perspective. The main thing I do is look at waterfalls. I can''t stress
    strongly enough that I feel web developers know how to interpret a waterfall and
    not to rely on checklists or scores. Seeing how a website actually loads is critical.


    # What features are in the near and longer term for WebPagetest? Personally I''d
    love a memory profiler.


    Mobile is probably the biggest focus area now. The tooling there is really primitive
    and it''s a lot harder to get access to the kind of data we can get on the desktop,
    but we''re getting there. Getting more information from browsers is always high
    on the list as well. We recently added support for Chrome dev tools timeline data
    from Chrome agents, and we''re looking at what other options are available.'
