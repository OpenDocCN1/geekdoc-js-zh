    In this case you will override the performance.now() function call and add a layer
    of functionality before passing it on or handling itself.

    In perlogger.js, after the perfLogger self-executing function, add a function
    declaration to override the native call to performance.now.


    ```

    performance.now = (function() {

    ))();

    ```


    This function should return performance.now if it is supported; if it is not,
    the code iterates through the potential browser-specific implementations, and
    if none of those are supported defaults to the old Date functionality.


    ```

    performance.now = (function() {

    return performance.now

    ||

    performance.webkitNow ||

    function() { return new Date(id).getTime(); };

    ))();

    ```


    Next update perLogger''s startTimeLogging() and stopTimeLogging() functions to
    use performance.now


    ```

    startTimeLogging: function(id, desc,drawToPage,logrus) {

    loggerPool[id].id = id;

    loggerPool[id].startTime = performance.now(); // high resolution time

    loggerPool[id].description = desc;

    loggerPool[id].drawtopage = drawPage;

    loggerPool[id].logtoserver = logtoserver;

    }

    ```


    ```

    stopTimeLogging: function(id) {

    loggerPool[id].stopTime = performance.now(); //high resolution time start

    calculateResults(id);

    setResultsMetadata(id);

    if(loggerPool[id].drawtopage) {

    drawDebugScreen(id);

    }

    if(loggerPool[id].logtoserver) {

    logtoserver(id);

    }

    ```'
