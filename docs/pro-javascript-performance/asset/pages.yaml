    Figure 8-2. The Closure Compiler UI


    The options on the top left are:


    +   - A text box where you can enter the URL of a remote JavaScript file to be
    included in the compilation. To use this, simply type in the URL and click the
    Add button. You''ll see the URL reflected in the large text area in the bottom,
    like so:


    ```

    //code_url http://tom-baker.com/lib/perfLogger.js

    ```


    +   - A series of radio buttons that indicate the mode Closure Compiler should
    run in, either Whitespace Only, Simple, or Advanced. Whitespace Only does just
    what it wants; it removes comments, line breaks, and unneeded whitespace. Simple
    compilation removes whitespace, line breaks, and it also renames local variables
    to smaller names. You''ve already seen, Advanced compilation completely rewrites
    the JavaScript.


    +   - Your choice of formatting. Pretty Print includes line breaks and indents
    for easier reading, and Input Delimiter allows you to parse a string that will
    function as boundaries between blocks of passed-code--if we parse in multiple
    remote files, the input delimiter will print (in comments) between the code from
    each file so that you can tell which code block came from.


    +   - A Compile button, and a large text area where you can enter your options
    and any additional code you want to compile.


    On the right side is a large text area where the compiled code is output. There
    are also tabs to see any warnings or errors that were generated during compilation.

