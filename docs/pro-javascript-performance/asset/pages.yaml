  md: 'So we can see that these benefits are somewhat intangible. The page is visible
    sooner than the end user, so it appears to load faster, according to our technical
    measurements it doesn''t really load faster. fact, it looks like it takes slightly
    longer to load in the case of the script loader because there are extra assets
