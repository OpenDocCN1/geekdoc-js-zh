  md: '# Simple Charting with R


    Now here is where things start to get really fun with R. You know how to import
    data, store data, and iterate through data; let''s visualize data!


    R provides several charting functions. The first one we look at is plot()

    The plot() function will display a different type of chart depending on the arguments
    that you pass in it. It accepts the following parameters: an object that supports
    the plotting function, an optional parameter that will supplement as a y axis
    value in case the first parameter does not include it, the number of named graphical
    parameters, a string to determine the type of plot (draw (more one in a second),
    the title of the chart, a subtitle of the chart, the label for the x-axis, the
    label for the y-axis, and finally a number to indicate the aspect ratio for the
    chart (the aspect ratio is the metric of y/x).


    Let''s take a look at some of the plot options reflected in the chart. Note that
    when you plot the users data frame, you get a numeric representation of the user
    names on the x-axis and the y-axis is the admin, both in a range from 0 to 1 (instead
    of TRUE and FALSE).

    Figure-2 shows the results


    ```

    plot(users,main="plotting users data frame=no type specified"

    plot(users,type="p",main="plotting users data frame ntype=p for points")nplot(users,type="l",main="plotting
    users data frame ntype=l for lines")nplot(users,type="b",main="plotting users
    data frame ntype=b for both")nplot(users,type="c",main="plotting users data frame
    ntype=c for lines points"

    plot(users,type="o",main="plotting users data frame ntype=o for overplotting")nplot(users,type="h",main="plotting
    users data frame ntype=h for histogram")nplot(users,type="s",main="plotting users
    data frame ntype=s for stair steps")nplot(users,type="n",main="plotting users
    data frame ntype=n for no plotting")

    ```


    Bar charts are also supported in the base of R, with the barplot() function. Some
    of the most useful parameters the barplot() functions accept a vector or matrix
    to model the height of the bars, an optional width parameter, the amount of space
    that will precede each bar, the names for each bar, the text to use as a legend,
    a boolean value beside that signifies whether the bar is stacked, or another boolean
    value set to make the bars horizontal instead of vertical, a vector of colors
    to use, and the border color for each bar, an angle header and sub header for
    the chart.

    Figure 2-24 shows what the users data frame looks like as a bar chart.


    ```

    barplot(users$admin,names.users$username,main="Bar chart of users that are admins")nYou
    also create bubble charts in R. To do this, the symbols() function, pass in the
    R object that you want to represent, and set the circles to a column that represents
    the radius of each circle.

    ```


    +   Note: Bubble charts are used to represent three-dimensional data. They are
    much like a scatter plot, with the placement of the dots on the x-axis and the
    y-axis denoting value, in the case of bubble charts the radius of the dots also
    denotes value.


    Figure 2-25 shows the result.


    ```

    symbols(users,circles=users$admin,col="red",main="Bubble chart of users that are
    admins")

    ```'
