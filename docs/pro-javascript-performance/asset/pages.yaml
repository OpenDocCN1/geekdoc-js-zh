    # Comparison of Results


    To determine the best tool for a given situation, we need the scientific approach!
    Let''s implement the tools just discussed and run a multivariate test to ourselves
    which will give us the best results. First we''ll look at a waterfall chart of
    our unminified code, since that is in Figure 2-15. We see that unminified of our
    JavaScript file is 2.1 KB and our total page size is 3.3KB. This sample can be
    found at http://tom-barker.com/lab/perflogger.html. Now let use Minify and test
    these results. You can see in the waterfall chart of Figure 2-16 that the JavaScript
    from Minify (both minified and gzipped) is 573 bytes, and the total page size
    is 1.9 KB.


    When I use Ugl Compressor and Closure Compiler (with simple options chosen, so
    the file is not minified, rewritten on these files I get the same result; the
    JavaScript file is reduced to 1.6 KB and the total page size is 2.9 KB. Remember,
    the host that I am using does not support HTTP compression at a global scale,
    so these are simply minified, not gzipped. These are not apples-comparison of
    the minification algorithm, just a comparison of the products out of the box.


    ![](img/a914f260cb5c9705eb1c32a679549219_28_0.png)


