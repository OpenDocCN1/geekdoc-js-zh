    We should also expose a property that hold the URL to the savePerfData, which
    we''ll call serverURL.

    And ideally we need a way to run multiple times on a single page. To do that we
    create an associative array that will hold a collection of tests with string as
    the identifier. We''ll call this associative loggerPool.

    Out of all these properties and properties, which ones will we want to expose
    publicly? We don''t want to expose any of the properties; if we do, there is a
    possibility of external code altering them. If we want to allow them to be set
