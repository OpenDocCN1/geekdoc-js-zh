    # How to Use


    In Firefox if you open Firefox, you can see that there is a new tab called YSlow.
    When you click on the tab you are presented with the splash screen shown in Figure
    2-7. From this screen you can run the YSlow test on the page that is currently
    loaded or choose to always run the test whenever a new page is loaded.


    You can also choose which rule set to evaluate against, As I have been saying,
    practices change, and the different rules reflect that. There is the classic set
    of rules for YSlow initially launched with, an updated rule set (V2) that changed
    the weighting of certain rules (like making CSS and JavaScript external) and another
    number of rules, and a subset of the rules for small-scale sites and pages those
    would be overkill.


    After running the test you''ll see the results shown in Figure 2-8. The results
    are split into two sections: the rules with their respective ratings on the left
    and an explanation of the rule on the right.


    For a detailed breakdown of the rules that YSlow uses, see http: http://developer.yahoo.com/performance/rules.


    There is a sub-navigation bar that further breaks down the results, showing the
    components, statistics for the page, and tools you can use for further refinement
    of performance.


    The components section is much like the Network Monitoring tab in Firefox; it
    lists the individual assets in the page, and each component''s file size, you
    can use for further refinement of performance. URL, response header, time, expires
    header, and et.


    +   - Tip Entity tags, or tags for short, are fingerprints that are generated
    by a web server and sent in the HTTP transaction and stored on the client. They
    are a caching mechanism, by which you can request a piece of content by sending
    its stored tag in the transaction, and the server can compare to see if the et
    tag matches the tag it has stored. If match, the client uses the cached version


