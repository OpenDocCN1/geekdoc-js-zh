  md: '# CHAPTER 6


    # Web Performance Optimizations


    The last chapter explored the results of the W3C''s first steps at standardizing
    performance in a browser, the Performance object. Chapter 5 looked at each of
    the APIs in the Performance object; you saw how to gather and derive performance
    metrics from the Performance Timing object, how to use the Performance Navigation
    object exposes high-resolution time to use tracking data down to the millisecond
    limit.


    Based on all of that, you updated perfLogger library to incorporate all of the
    great metrics that the Performance object provides. It simply means to use high-resolution
    time with browsers that support it, and fall back gracefully for those that don''t.


    You took all of this data and expanded the R scripts to chart out what this data
    says about our users, their connections, and browsers.


    And now this that you will use all of the tools that we have created thus far,
    and all of the tools that we looked at in Chapter 2, to quantify the benefits
    possible from some web performance optimization tips—specifically, how JavaScript
    can block page rendering and how you can use JavaScript to postpone the loading
    of heavier of content. Remember that web performance is the time that your content
    is delivered to your end user, including network latency and browser time.


    # Optimizing Page Render Bottlenecks


    The first place we will look to optimizing is the rendering in the browser. This
    issue is outside of any network latency concerns; it simply means how fast the
    browser will process and render content to present to the user. Let''s take a
    look at how drawing our content to the screen in modern browsers.


    As discussed in Chapter 1, modern browsers are made up of several interacting
    components. There is a UI layer that draws the client-facing interface for the
    browser, including the location of the bar, and forward buttons, and any other
    chrome that the browser may have. The user interacts with the UI layer and the
    UI layer drives the rest of the application.


    We have a network layer that handles network connections, establishing TCP connections,
    and performing the HTTP roundtrips. The network layer provides content to the
    rendering engine.


    The rendering engine handles painting the content to the screen. When it encounters
    JavaScript, it hands off to the JavaScript interpreter. See Figure 6-1 for an
    annotated look at the high-level architecture of modern browsers.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# CHAPTER 6 WEB PERFORMANCE OPTIMIZATIONS


    ![](img/a914f260cb5c9705eb1c32a679549219_112_0.png)


    Figure 6-1. Annotated browser architecture


    As I say, the rendering engine—be it Gecko, or WebKit, or what you have—retrieves
    content from the network layer. It has a finite bus size, so it pulls in the data
    in chunks and passes the chunks into its own workflow.


    The workflow is a process with several steps. First the content is parsed, meaning
    that the markup is read as characters and undergoes lexical analysis, in which
    the characters are compared to a rule set and converted to tokens based on the
    rule set. The rule set is the DTD that we define in HTML document; it specifies
    that tags that make up the version of the language we will use. The tokens are
    just the characters broken into meaningful segments.


    For example, the network layer may return the following string:


    ```

    <DOCTYPE html><head><meta charset="UTF-8" />

    ```


    This string would get tokenized into meaningful chunks:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <meta charset="UTF-8" />

    ```


    The rendering engine then takes the tokens and converts them to DOM elements.
    The DOM elements are laid out in a render tree that the rendering engine iterates
    over. In the first iteration the rendering engine lays out the positioning of
    the DOM elements, and in the next it paints them to the screen. See Figure 6-2
    for this workflow.


    110'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# CHAPTER 6 ■ WEB PERFORMANCE OPTIMIZATIONS


    Network Layer

    Render Engine


    ![](img/a914f260cb5c9705eb1c32a679549219_113_0.png)


    Figure 6-2. Rendering engine workflow


    Normally during this process, if the rendering engine identifies an external script
    during tokenization, it pauses the content and begins downloading the script.
    The rendering engine only resumes parsing after the script has been downloaded
    and executed. This causes a potential bottleneck in the time it takes for content
    to be displayed to the end user. See Figure 6-3 for a flowchart of this potential
    bottleneck.


    ![](img/a914f260cb5c9705eb1c32a679549219_113_1.png)


    Figure 6-3. Script tags encountered during parsing'
