    The thing to keep in mind is in the way that we are measuring our performance
    with these charts, it looks like it''s taking as long, or a little longer because
    we are counting done at the onload event of the page. If we don''t need our external
    scripts available before the onload event we can use a design pattern lazy loading
    to load our scripts after the onload.


    # # Lazy Loading


    We will now look at lazy loading, a way to programmatically delay the loading
    of assets. We will look at what lazy loading is, as a design pattern, and how
    we can use it tactically to improve the web performance of our pages.


    # # The Art of Lazy Loading


    At a very high level, lazy loading is a design pattern in which we postpone the
    creation or initialization of something until it is absolutely necessary (See
    Figure 6-12).


    ![](img/a914f260cb5c9705eb1c32a679549219_123_0.png)


    **Figure 6-12.** Lazy loading sequence diagram


    There are several implementations of this pattern:


    +   - The virtual proxy pattern

    - The lazy initialization pattern

    - Value holder pattern'
