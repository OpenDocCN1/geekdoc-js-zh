    Tom Barker has been a software engineer since the 90s, focusing on the full stack
    of web development. Currently he is the Senior Manager of Web Development at Comcast,
    an Adjunct Professor at Philadelphia University, a husband, a father, an amateur
    power lifter and an armchair philosopher. He is obsessed with elegant software
    solutions, continual improvement, refining processes, data analysis, and visualization.'
