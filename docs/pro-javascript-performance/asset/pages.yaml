    # Comparison of Core JavaScript Frameworks


    Something that I''ve noticed over the years in the classroom with new students
    coming in, and in interviews coming for positions, is that groups tend to know
    how to use a framework, usually Jquery, instead of knowing core JavaScript. This
    is problematic not everything should be done using frameworks. Frameworks are
    an author-time efficiency, meaning that making codes much simpler by abstracting
    the real work that goes into those tasks. The upside of this is in addition to
    wrapping lots of functionality in a local API, they usually wrap lots of error
    checking and cross-browser support. But all of this functionality is available
    in the core language and runs faster in the core language because we can only
    do what we know, not what is needed to support every user of the framework. If
    we know the framework, the ability to write functionality for our purposes, and
    in general to create something new. We become consumers and aggregators of functionality
    instead of creators.


    That raises a question: Is JavaScript more performant—in terms of time performance—than
    using a framework? Logically it would seem so, but let''s run through some examples
    to benchmark most common of frameworks, Logically jQuery as a point of comparison.


    > jQuery is a JavaScript framework, created in 2006 by John Resig. Maintenance
    of jQuery was taken over by the jQuery Project in 2009. As ease of writing jQuery
    is the most widely used JavaScript framework.


