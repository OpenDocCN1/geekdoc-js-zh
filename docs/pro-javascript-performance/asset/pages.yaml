  md: "# DOM Access\n\nThe makers are constantly working to make DOM access more efficient,\
    \ but the fact remains that\nDOM access involves interfacing with an aspect of\
    \ the browser outside the JavaScript interpreter, the\nrender engine, which makes\
    \ it the slowest part of JavaScript development.\nThere are ways to optimize interaction\
    \ with the DOM. Let's look at some.\n\n# Queue Changes to DOM Elements\n\nWhen\
    \ we are making multiple changes to the content of a DOM element, we can queue\
    \ those changes and\nthen append them to the element at once. Let's take a look\
    \ at an example of this.\nStart with a sleek HTML structure, our perflogger library,\
    \ and populateArray function as in\nprevious tests. In the demo of the page, add\
    \ a div with an id of DOMtest and a script tag. In the script tag,\ncreateArray.\n\
    \n```\n<div id=\"DOMtest\"><p>Dom Test</p></div>\n<script>\ntempArray = populateArray(400);\n\
    </script>\n```\n\nSo with all of it out of the way, you'll create a function called\
    \ sequentialWrites().This function\\will loop through tempArray and update the\
    \ innerHTML of DOMtest in each iteration. You'll then\nbenchmark this:\n\n```\n\
    function sequentialWrites() {\nvar l = tempArray.length\nfor(var i = 0; i < l;\
    \ i++) {\n  document.getElementById(\"DOMtest\").innerHTML += i;\n}\n```\n\nperflogger.logBenchmark(\"\
    SequentialWrites\", 10, sequentialWrites, true, true);\nNext create a function\
    \ called queueWrites, which will loop through tempArray, but at each step\nunction\
    \ will will concatenate the changes to a string value. After the loop, the complete\
    \ is, finally, benchmark the queueWrites function:\n\n```\nfunction queueWrites()\
    \ {\nvar l = tempArray.length,\nwriteVal=\"\"\nfor(var i = 0; i < l; i++) {\n\
    \  writeVal += i\n}\ndocument.getElementById(\"DOMtest\").innerHTML += writeVal;\n\
    }\n```\n\nperflogger.logBenchmark(\"QueueWrites\", 10, queueWrites, true, true);\n\
    Your complete test script should look like the following.\n\n```\n<div id=\"DOMtest\"\
    ><p>Dom Test</p></div>\n<script>\ntempArray = populateArray(400);\n2 http://updates.html5.com/2012/04/Big-boost-to-DOM-performance---WebKit-s-innerHTML-is-\n\
    240faster\n```"
  merge: -1
  pgno: 165
