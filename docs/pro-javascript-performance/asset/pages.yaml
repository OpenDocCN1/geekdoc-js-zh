  md: 'At this pointwe have a high level description of our benchmarking engine will
    work. Let''s call this functionality perfLogger. We still need to interact with
    other processes in order to save our data and visualize, let''s create a sequence
    diagram to show the interactions of these processes.

    Our benchmarking process, perfLogger, will call an external process, savePerfData.
    We''ll use XHR object to post the data to savePerfData. The process savePerfData
    should in turn save the results of the test in a flat file. We''ll call the flat
