  md: '# CHAPTER 5


    # Looking Forward, a Standard fornPerformance


    In Chapter 4 we built a JavaScript library to track ad hoc and benchmark functions.
    This is a great tool to gather timing metrics and extrapolate performance gains
    through coding styles, as you''ll see in the coming chapters.

    So we''ve seen how to build our tools, or use existing tools to gather the data
    that we need in order to measure performance, but now we will look at the work
    that the W3C has been doing to craft a standard for tracking performance metrics
    in browsers.

    Note that some of these features are now starting to be supported in modern browsers;
    some features are only available in beta and pre-beta versions of the browsers.
    For this reason I will identify the release version used in all of the examples
    in this chapter when relevant. It is also for this reason that I may show screen
    shots of the same thing but in different browsers, to illustrate the differing
    levels of support for these features.


    # W3C Web Performance Working Group


    In 2010 the W3C created a new working group, the Web Performance Working Group.
    The mission for this working group, as stated on its mission page, is to provide
    methods to measure aspects of application performance of user features and APIs.
    What that means in a very practical sense is that the working group has developed
    an API that browsers can will expose to JavaScript that holds key performance
    metrics.


    This is implemented in a new performance object that is part of the native window
    object:


    ```

    >>window.performance

    ```


    # The Performance Object


    If you type window.performance in a JavaScript console, you''ll see that it returns
    an object of type Performance with potentially several objects and methods that
    it exposes. Figure 5-1 shows the Performance object structure in Chrome 20 beta.'
