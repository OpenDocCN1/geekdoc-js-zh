  md: '# Was it tough getting the project open sourced?


    Not at all. AOL were very supportive and really understood the benefit of opening
    the tool to the community, particularly since it wasn''t specifically strategic
    to the business.


    # What were some of the challenges you ran into while working on the project?


    Getting access to the interfaces in the browsers to get useful information has
    been the biggest challenge. Some of the newer browsers (now) make the information
    lot more accessible but there was no extension or browser APIs for getting access
    to the request chain inside IE. I tried a lot of different techniques and API
    interception points before getting to a useful place (and it''s still evolving,
    as the current injection points still have caveats, particularly around HTTPS).


    The other big challenge was finding the time to work on it. It wasn''t actually
    part of my day job at AOL to develop it was largely built as I got cycles to work
    on. I''m extremely grateful to Google for letting me work on full-time now (though
    the work always seems to outstrip available).


    # What is the goal of WebPagestag LLC?


    It was originally created as a shell to hold on to the WebPagestag assets and
    give it a place to live. In early 2012 I worked with other web performance developers
    and founded the WPO Foundation. We''re still in the process of filing for nonprofit
    status, but the goal is to have a foundation that will invest in open web performance
    efforts and freely available data research. WebPagestag is being moved into the
    WPO Foundation and will help fund some of the efforts.


    # How long are test results needed?


    Theoretically forever. I still have the test data on the server from when it initially
    launched in 2008. It''s somewhere around 2TB right now, but with storage systems
    are growing I don''t see a problem for the foreseeable future. WebPagestag has
    auto-archiving support built-in where I can archive test data when a test is assessed
    so long-term storage isn''t much of a problem. That said, I don''t currently maintain
    offsite backups if there is a disaster at the site then the data will be gone
    (I do maintain redundant copies-on).


    # How long do tests take to run on average?


    I''m not sure there is an average time—it really depends on how many runs and
    if a test will include first and repeat view data. Each run has a forced time
    of 60 seconds (on the public instance), so worst-case with 10 runs it could take
    20 minutes to complete a single test. Since only one test can run at a time on
    a given test machine, it makes relatively expensive to scale (which is why there
    isn''t broad support testing through the API).'
