  md: '# CHAPTER 3 WPTRUNNER—AUTOMATED PERFORMANCE MONITORING AND VISUALIZATION WITH
    WEBPAGETEST


    Note The documentation is unclear on when Internet Explorer uses the underscore
    character, but this variation is to keep in mind.


    runs: This specifies the number of tests to run.


    fvonly: If you set fonly to 1, you get results only for the first view, and do
    not repeat the view test.


    private: Setting the private flag to 1 will make sure that the test is not displayed
    in the list of tests.


    block: This parameter allows you to set a comma separated list of block options.
    Remember from last chapter that you can specify URLs as well as types of files.


    f: This specifies the format that the test result will be. It accepts xml and
    json.


    k: This is where you specify the public API key.


    A sample call to the API would look like


    ```

    http://www.webpagestest.org/runtest.php?f=xml&k=111&url=tom-barker.com

    ```


    You''ll create a new PHP file named run_wpt.php. The first thing you''ll do is
    to format the URL. You''ll import the shared configuration file to make sure you
    have access to the API key as well as the array of URLs:


    ```

    require("wpt_credentials_urls.php");

    ```


    Then you''ll create variables to hold the API parameters. For this example you
    only care about the output format, which you will set to XML, and make sure that
    tests are kept private.


    ```

    $outputformat = "xml";

    $private = 1;

    ```


    And finally you''ll create a new variable $wpt_url to store the API URL with parameters
    concatenated to it, all except the URL parameter. You''ll get to the URL parameter
    next:


    ```

    $wpt_url = "http://www.webpagestest.org/runtest.php?f=$outputformat&private=$private&k=$key&url=";

    ```


    To set the URL parameter you''ll need to iterate through the array that you have
    set in wpt_credentials_urls.php.


    ```

    for($x=0; $x<count($urls_to_benchmark); $x++) {


    }

    ```


    As you step through this loop you will pull each element one at a time, and concatenate
    to $wpt_url. You''ll use PHP''s native function get_get_contents() to hit the
    URL and read the server''s response into a variable $wpt_response:


    ```

    $wpt_response = file_get_contents($wpt_url . $urls_to_benchmark[$x]);

    ```


    Remember, the API will return an XML structure that you will need to parse. The
    XML looks like this:'
