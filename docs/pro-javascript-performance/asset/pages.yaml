    #  Charting with R


    run wpo_log gives you a daily log, a comma-separated list of the least time, total
    payload, and number of HTTP requests for each URL that you want to track. That''s
    great, but it''s only part of the story. You can''t extract data and expand your
    audience to get the full story. It is up to you to represent that data visually.


    So let''s use R to build a time series chart to show the change in performance.
    First let''s create a new R file From the architecture, you can see that it should
    be called wpo.R.


    First create variables to hold the path to the data and chart directories:


    ```

    dataDirectory <- "/Users/tbarkee00/WPTRunner/data/"

    chartDirectory <- "/Users/tbarkee00/WPTRunner/charts/"

    ```


    ```

    Then read the contents of wpo_log and store it as a data frame named wpologs

    wpologs <- read.table(paste(dataDirectory, "wpo_log.txt", sep=""), header=TRUE,
    sep=",")

    ```


    > Note This code uses the paste() function to concatenate the stored data directory
    to the file name to construct the full path to the file. In R there is no concatenation
    operator as in most other languages. You use the paste() function instead. This
    function accepts N of strings to concatenate and a sep parameter specifies a string
    to paste between the strings—for example, if you wanted to insert commas between
    each string, or some other separator. In the example you use an empty string.


    In the same way, you should create a variable to hold the path to the file that
    you will create for our chart. This variable wpochart, and also convert the data
    in the bytes column from bytes to kilobytes.


    ```

    wpochart <- paste(chartDirectory, "wpo_times.pdf", sep="")

    wpologs$bytes <- wpologs$bytes / 1000 #convert bytes to KB

    ```


