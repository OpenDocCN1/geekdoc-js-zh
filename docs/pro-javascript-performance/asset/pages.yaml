  md: '# Runtime Performance


    Runtime performance is the duration of time that your application is executing,
    or running. Runtime performance speaks to how quickly your application responds
    to user input it is running—for example, while saving preferences, or when accessing
    elements in the DOM.


    Runtime performance is influenced by any number of things—from the efficiency
    of the algorithms employed for simplicity, to optimizations or shortcomings of
    the interpreter or browser engine, to effective memory management and CPU usage,
    to design choices between synchronous or asynchronous operations.


    While runtime performance is thus a subjective perception of the overall peppiness
    of your application, you can use instrumentation that will allow you to track
    the track and trend of your users'' overall experiences and analyze the outliers.
    You can also conduct multivariate testing to see what approach yields the greatest
    performance at scale and with browsers in use with your specific use case.


    We will explore these ideas in Chapter 4.


    # Why does performance matter?


    The first reason should be obvious—fast web sites mean a better overall experience
    for your user. A better experience in theory should equate to happier users.


    A faster experience also means you can access your features faster, hopefully
    before they abandon the session. Session or site abandonment happens for many
    number of reasons: users taking too long to load users, browsers crashing or any
    other of a near-infinite number of reasons.


    Figuring out your site abandonment rate is easy. Just take the number of users
    who do whatever action you want of—purchase an item, register a new account, upsell
    to a service, view pages in other sections, click a given button on the homepage,
    whatever the high-level objective is that you have for you. Just take that number
    and divide it by the total number of visits. Subtract that from one and multiply
    by 100 to get the percentage of traffic that abandoned your site before filling
    your objective:


    ```

    [aboundment rate] = (1 - ((number of fulfilled objects) \\ [total number of visits]))
    * 100

    ```


    As an example we have a web form, maybe a customer registration page. The whole
    point of that is to get users accounts—once we have an account we can start tailoring
    things to their personal preferences, we can target ads to their purchasing habits,
    and we can make recommendations to them based on past purchases and viewing history.
    Whatever the purpose, we want them to sign in and for how we''ll measure the success
    of this page. Once a user hits Submit on the form, we go to a PHP script that
    updates a database, creates a new entry in our out, and then directs to our homepage.


    So we look at the view metrics for this page and see that we have 100,000 unique
    views; in our algorithm this is the total number of users. If we look at the number
    of users created in our database, we see that we have 30,000 users. At this point
    we could apply the algorithm to get our abandonment rate of 70


    ```

    (1 - (30,000 \\ 100,000)) * 100

    ```


    Improving performance can bring significant benefits to your bottom line by reducing
    your abandonment rate. There have been a number of prominent cases where companies
    have demonstrated the quite harm (in increased abandonment rates) caused by poor
    web performance.


    Keynote has made available an article by Alberto Savoia, detailing the impact
    of performance on abandonment rates at http://www.keynote.com/downloads/articles/tradescrets.pdf.
    In their'
