  md: 'We looked at modern browser architecture and saw that browsers are no longer
    huge black-box monoliths, but instead are modular and some even open source. We
    talked about the benefits of this modular architecture, noting that as the web
    becomes ubiquitous, rendering engines are being used for other applications to
    parse and render markup in email clients or embedded in custom applications, and
    that we can even embed pieces of browsers in our own applications.


    We looked at why performance matters to our business, from customer happiness
    to looking to abandonment rates.


    Finally we started to talk about gathering, analyzing, and visualizing our data.
    This last point is a recurring theme that we will see throughout this book—measuring
    and quantifying with empirical data, visualizing that data to show the overall
    shape of the data. The shape of the data is key; it can reveal trends and patterns
    that aren''t obvious in the raw data. We can look at a visualization immediately
    and know generally what it is saying.


    We''ll look much deeper into these concepts in the coming chapters, and we begin
    in the next chapter by exploring tools that are available for us to track and
    improve performance.'
