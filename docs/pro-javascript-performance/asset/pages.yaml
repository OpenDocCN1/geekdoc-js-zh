    # High-Resolution Time


    The next change we will look at is a feature called high-resolution time—recorded
    in sub-millisecond values. This is useful for capturing timing data that happens
    in less than 1 millisecond. We''ll make use of high-resolution time in the next
    chapter to capture run performance metrics.

    The Web Performance Working Group has detailed a public method of the performance
    object, now().


    As you in the previous chapter, when timing code execution we run into cases where
    we had 0 millisecond results. This is because the values that are returned from
    the Date() object only have precision up to 1 millisecond. Type the following
    into a JavaScript console to see the Date() object:


    ```

    >>> new Date().getMilliseconds()

    603

    ```


    ```

    >>> Date.now()

    134072684122

    ```'
