  md: '# CHAPTER 2


    # Tools and Technology to Measure and Impact Performance


    Chapter 1 outlined the concepts of web performance and runtime performance and
    discussed influencing factors for each. This chapter will look at some of the
    tools that are available to track performance and to help improve performance.


    In future chapters we will explore how to use some of these tools programmatically
    and combine them to creating and reporting applications, so getting familiar with
    them first is essential. Other tools, like Firebug and YSlow, are just essential
    tools for developing and maintaining performant web sites.


    # Firebug


    2006 was a great year for web development. First of all, Microsoft released Internet
    Explorer 7, which brought with it native JavaScript for the XMLHttpRequest object—previously
    web developers had to branch their code. If a browser''s JavaScript engine supported
    XHR we would use that; otherwise we would know that we were in an earlier version
    of IE and lacked the XHR control.


    A slew of new frameworks also came out in 2006, including jQuery, YUI, and all
    with the aim of speeding up and simplifying development.


    And arguably the greatest milestone of the year was the release of Firebug from
    Joe Hewitt and the team at Mozilla. Firebug is an in-browser tool that allows
    web developers to do a number of tasks that were not previously possible. We can
    now run code via a console command line, alter CSS on the fly, andthe aspect that
    will interest us most when talking about performance—monitor network assets as
    they are downloaded to a page. If you do not currently have Firebug running on
    your computer, take the following steps to install it.


    # How to Install


    First lets install Firebug. You can get the latest version of Firebug: https://firebug.com/downloads/.
    It was originally released as a Firefox extension, but since then there are Firefox
    releases for most other browsers. Since Firebug lite doesn''t include the Network
    Monitoring tab, we will use Firefox for this section so that we have all the features
    of Firebug available to you.


    If you navigate to the URL just shown, you come to a page presenting you with
    different versions of Firebug that are available for download, as shown in Figure
    2-1.'
