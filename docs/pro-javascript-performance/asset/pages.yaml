    Figure 8-9. A more detailed browser support matrix


    The way you start choose your browser matrix is by looking at your logs—what browsers
    are most used by your clients? Make sure you take into account at least the active
    browsers, which won''t always be the most attractive browsers. (How many years
    did you need to support IE 6 just because your user base was locked into it because
    of corporate policy?) But don''t assume that because a certain set of browsers
    are being used to visit your site, you only need to focus on those browsers. It
    might just be your matrix as well, so that you can code for the future.


    Once you have your browser support matrix, you can begin gathering workstations
    or virtual machines to test on. Even if you have a QA staff that handles testing,
    as web developers the onus is on us to make sure what we create is functional
    and in a good state before handing off to QA. That includes benchmarking our code
    against our browser matrix.


    If you are going to use virtual machines (VMs), my favorite option is to use Virtual
    Box from Oracle, available at https://www.virtualbox.org/. It''s a completely
    free, open source, lightweight, professional-level solution for running VMs. See
    Figure 8-10 for the Virtual Box homepage.'
