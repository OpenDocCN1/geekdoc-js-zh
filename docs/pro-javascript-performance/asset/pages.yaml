  md: "All of human history and science is built on the idea of recording previous\
    \ learning and building on top of it. We avoid re-inventing the wheel. This is\
    \ the idea of design patterns and anti-patterns: we have identified issues and\
    \ the most effective way to solve them; let's focus on new challenges and solve\
    \ those, and preserve our new findings for future purpose.\n\nIt is also much\
    \ simpler and takes fewer words to refer to something as a factory rather than\
    \ refer to that same thing as an object that generates other objects.\n\n# Lazy\
    \ Loading Scripts\n\nWhen we don't need our JavaScript code to be available as\
    \ soon as the page loads, we script-load our external JavaScript after the window.onload\
    \ event. This is lazy loading our scripts. Let's take a look at how we can lazy-load\
    \ our scripts and see what kind of benefit to performance we can get from that.\
    \ Then we'll evaluate the results.\n\n# Set Up Lazy Loading\n\nTo start with,\
    \ create a new test URL to generate. You'll call the script-loaded page from previous\
    \ examples and rename it lazyscript.html. You'll also be updating the remoteloader\
    \ object. In the new lazyscript.html page, you will add a script tag and some\
    \ JavaScript. This will check whether the window.attachEvent function is available\
    \ in the current browser. The attachEvent accepts two parameters: the event to\
    \ attach to, and the function to invoke when the event occurs. The current browser\
    \ supports window.attachEvent, you'll pass in the onload event and the call to\
    \ remoteloader.loadJS to load the remote scripts.\n\nIf attachEvent is not supported,\
    \ use window.addEventListener() to the same effect. Here's the code:\n\n```\n\
    <script>\nif (window.attachEvent)\n  window.attachEvent('onload', remoteloader.loadJS(\"\
    /lab/perfLogger.js\"));\nelse\n  window.addEventListener('load', remoteloader.loadJS(\"\
    /lab/perfLogger.js\"), false);\n</script>\n```\n\nTechnically, you've just lazy-loaded\
    \ the remote script loading—but there is one catch. Right now we know when the\
    \ script has finished loading. If you try to make the call to logger.showPerformanceMetrics()\
    \ and the script hasn't just loaded but also executed, you will get an error.\n\
    \nSo you need to make some modifications. You need to be able to know when the\
    \ script has loaded and run the performance test after it. So you need to make\
    \ the remoteloader.loadJS function accept a callback.\n\n+   - Note callback can\
    \ then execute the callback function. This is one of the very beautiful things\
    \ about functional programming, that we pass functions between functions or objects.\
    \ It opens up other ways of changing functionality without inheritance."
