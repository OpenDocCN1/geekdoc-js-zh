- img_proc: true
  md: 'Let''s look at what this means. Normally when you reference variables in other
    scopes—at the global level, in other namespaces, and so on—the interpreter needs
    to traverse the stack to get the variable. Let''s use document.location as an
    example. If you reference document.location from within an object, the interpreter
    will need to go from the function that references the variable, out of the namespace
    to the global scope, down to the document scope, and get the location value. See
    Figure 7-1.


    ![](img/a914f260cb5c9705eb1c32a679549219_141_0.png)


    Figure 7-1. Tracing the stack to get to document.location


    This is based on the efficiency of the interpreter and the inheritance hierarchy
    that you create—if there are namespaces 4 or 5 or 10 objects deep, it will take
    just that much longer to get to the global scope and then back down the scope
    of your intended variable.

    to get around this, you can create a locally scoped variable to hold that value,
    and reference that variable instead. This allows you to create a shortcut to the
    variable reference and reap a runtime performance boost. See Figure 7-2.


    ![](img/a914f260cb5c9705eb1c32a679549219_141_1.png)


    Figure 7-2. Creating a local variable to cache the reference to document.location


    Let''s quantify this performance boost with a practical example.


