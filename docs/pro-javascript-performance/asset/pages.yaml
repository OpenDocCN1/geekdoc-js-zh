  md: '# Declare and Data Types


    To declare a variable you simply assign value to it. The assignment operator is
    a left-pointing arrow, so creating and declaring variables looks like this:


    ```

    foo <- bar

    ```


    R is loosely typed, and it supports all of the scalar data types you would expect:
    string, numbers, and booleans.


    ```

    myString <- "This is a string"

    myNumber <- 23

    myBool <- TRUE

    ```


    It also lists, but here is one of the quirks of the language. R has a data type
    called vector that functions like a strictly typed single-dimensional array. It
    is a list whose items are the same data type, either strings, numbers, or booleans.
    To declare vectors use the combine function c(), and you add to vectors with the
    c() function as well. You access elements using square brackets. Unlike in many
    languages, vectors are not zero based; the first element is referenced as element
    [1].


    ```

    myVector <- c(12,343,564) #declare a vector

    myVector <- c(myVector, 545) # appends the number 545 to myVector

    myVector[3] # returns 564

    ```


    R also has another list, called matrix. Matrices are like strictly two dimensional
    arrays. You create a matrix using the matrix function, which accepts five parameters:
    a vector to use as the content, the number of rows to shape the content, the number
    of columns to shape the into, an optional boolean value to indicate whether the
    content should be shaped by row or column (the default is FALSE by), and a list
    that contains vectors for row and column names:


    ```

    matrix([content vector], nrow=[number of rows], ncol=[number of columns], byrow=[how
    to sort], dimnames=[vector of row names, vector of column names])

    ```


    You index in a matrix with square brackets as well, but you must specify the column
    and the row in the brackets.


    ```

    m <- matrix(c(11,12,13,14,15,16,17,18), nrow=4, ncol=2, dimnames=list(c("row1","row2","row3","row4"),c("col1","col2\)))

    ```


    ```

    > m

    col1 col2

    row1 11 15

    row2 12 16

    row3 13 17

    row4 14 18

    ```


    ```

    > m[1,1] #return 11

    [1]11

    ```


    ```

    > m[4,2] #return 18

    [1]18

    ```


    So far matrices and vectors can only contain a single data type. R supports another
    list type, called a data frame. Data frames are multidimensional lists that can
    contain multiple data types—sort of.'
