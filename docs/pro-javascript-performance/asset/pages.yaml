    # async


    Another option to prevent blocking the rendering engine is to use the async attribute
    for script tags. Introduced in HTML5, the async option is a native attribute that
    will tell the browser to load the script asynchronously. It is supported in all
    modern browsers, and even Internet Explorer starting with a proprietary attribute
    called defer. The async attribute accepts a Boolean value: just including it in
    a script with no value defaults to true.


    ```

    <script src="[URL]" async=true></script>

    <script src="[URL]" async></script>

    ```


    When using async you don''t know when the file will be downloaded, so you can
    attach an event handler to handle the script tag. This will allow you to invoke
    or instantiate any code that will need to be run when the file is downloaded:

    <script src="[URL]" async onload="init();"></script>


