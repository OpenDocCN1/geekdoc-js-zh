  md: 'Figure 6-14 is the average render time. Remember from Chapter 5 that we calculate
    render time as being Date.now() minus performance, timing, domLoading, where domLoading
    begins to load. That means that this metric is actually rendered meaningless when
    we lazy-load, because we don''t start lazy loading until the document is finished
    loading, so Date.now() is delayed to whenever the asynchronous loading of the
    script file is complete.


    ![](img/a914f260cb5c9705eb1c32a679549219_129_0.png)


