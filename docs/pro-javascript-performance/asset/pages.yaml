    # The Cost of Nested Loops


    We know that loops in general cost more in performance than unfurling the code
    and executing it sequentially. This is because each loop is synchronous and blocks
    execution of the rest of the application it is in. As you see in Chapter 2, that
    was one of Google''s Closure Compiler''s optimizations, and Chapter 8 explores
    that concept. But even more expensive than nested loops.


    There are ways to avoid nested loops, such as unwinding, as Closure Compiler does,
    or fusion, where we merge the execution of the sub-loops into a single loop. But
    to see why we would do that let''s evaluate the cost of nested loops.


    Make a new page, starting out with the basic HTML skeletal structure, with the
    perfLogger library and populateArray variable.


    Within the script of the page, you will create functions, each with increasing
    depth of nested loops. The twoLoopsDeep has a nested loop, threeLoopsDeep has
    a loop with two nested loops, and so on until we get to fiveLoopsDeep.


