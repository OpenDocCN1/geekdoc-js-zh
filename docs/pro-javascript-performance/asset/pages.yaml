    # Getting Started with R


    R was created in 1993 by Ross Ihaka and Robert Gentleman. It is an extension and
    successor to the S language, which was itself a statistical language created in
    1976 by John Chambers while at Bell Labs.


    R is an open source environment and the language that runs in that, for environment
    is statistical computing. It''s a very general description. I''m not a statistician,
    nor am I a data analyst. I''m a web developer and I run a department of web developers,
    if you are reading this, chances are you are a web developer. What do we do, as
    web developers, with R?


    Generally I use R to suck in data, parse it, process it and then visualize it
    for reporting purposes. Figure 2-20 illustrates this workflow. It''s not the only
    language I use in this workflow, but it is my favorite. I need use other languages
    usually to access a data source or scrape another application. In the next chapter
    I use PHP for the glue language, but I could use any other language—Ruby, shell
    script, Python, and so on.


    After I use a glue language to collect the data, I write out the data as a comma-separated
    file, and read it into R. Within R I process the data, averaging it, aggregating
    it, layering two or more data sets, and then from the R chart to tell the story
    I see in it.


    Once I have a chart created, generally as a PDF so that it maintains its vectors
    and fonts, from R I import the chart into Adobe Illustrator, or any other program,
    where I can clean up things like consistency and ensure axis labels with long
    names are visible.


    | Glue Language | R Language | Adobe Illustrator |

    | Collect and Format Data | Ingest, Process and Chart | Tighten Formatting of
    Chart |


    Figure 2-20. Workflow for preparing data visualizations with R'
