    # Plotting Load Time


    Excellent! Let''s plot one of the columns now. The most important column is the
    page load time, so let''s do that one. You''ll use the plot() function and in
    tbdotcomloadtime. You''ll see the following options for plot():


    ```

    type="l" so that we are drawing lines

    xast="n" to not draw an x-axis

    col="#ff0000" to make the line color red

    yab = "Load Time in Milliseconds" to set that as the label displayed on the y
    axis.

    ```


    The call to the plot() function should look like this:


    ```

    plot(tbdotcomloadtime, ylim=(0,10000), type="l", xast="n", col="#ff0000"

    yab="Load Time in Milliseconds")

    ```


    If you hadn''t hidden the x-axis, it would have appeared as a series of numbers
    as R defaults to displaying x-axis names as incrementing when the values are nominal
    ordinal factors. The dates to show up in the x axis, you need to draw a custom
    axis. Use the axis() function to do this. The first parameter that the axis function
    accepts a number that indicates which axis to draw: 1 for the bottom, 2 for the
    left, 3 for the top, and 4 for the right side. The rest of the parameters are
    named values, including these:


    +   - at: The points where marks should be drawn

    - lab: The value to show as the axis label, either a boolean or a vector of strings

    - tick: A value to show or hide checkmarks

    - lwd: The line width


    You can also plot in graphical parameters. For more details, type ?axis or ?par
    at the console. So you''ll use the axis() function to draw an x axis to all of
    the dates, like so:


    ```

    axis(1, at=1: length(rows.names(tbdotcom)), lab=rownames(tbdotcom), cex.axis=0.3)

    ```


