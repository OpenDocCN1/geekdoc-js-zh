    # Parsing the Test Results


    So you have a flat file with a list of URLs that point to Webpagest test results.
    These tests are not instantaneous, so you need to wait for them to complete before
    beginning to parse the results.


    You can begin parsing the test URLs to see if they have completed. The test results
    are formatted as:


    ```

    <response>

    <statusCode></statusCode>

    <statusText></statusText>

    <data>

    <startTime></startTime>

    </data>

    </response>

    ```


    To see if the test is complete, you check the statusCode. A 100 means that the
    test is pending, a 101 means the test has started, and a 200 means the test is
    complete. Any 400 status code indicates an error.


    With in mind let''s start parsing the results!

    First you''ll need to include the shared files so you have access to the file()
    function and the paths to the flat files:


    ```

    require("util/wpt_credentials_urls.php");

    require("util/fileio.php");

    ```


