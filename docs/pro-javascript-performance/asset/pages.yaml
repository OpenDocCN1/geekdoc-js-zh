    #  Instrumentation and Visualization


    A big part of this book is about putting tooling in your code and using data visualizations
    to demonstrate the results. In truth, that is the kind of point of this book.
    There is no one silver-bullet solution when it comes to performance. The results
    one sees may not be the same as another gets, because they may have a completely
    different user base, or a completely different browser.


    Maybe your users are locked into using Internet Explorer because of corporate
    policy, or maybe your audience is made of early adopters and you have a high population
    of people using beta releases of browsers, which may have different optimizations
    in their interpreter or rendering engine, or even have bugs in their interpreter
    or rendering engine.


    Whatever the case, your results will vary. And they will vary at scale, because
    of connection speed at different times of the day (as when users work at home),
    because of their method of connecting (cable versus dial), or any other reason.


    By measuring your results and visualizing to see the overall shape of what your
    data looks like, you will be able to de-tune your site based on your own real
    data and trends. Data visualization as a discipline has blossomed lately. It is
    not relegated to the world of mathematics, theory, or choreography. I remember
    when I got an ink of what I could do with data visualization. I was at a conference;
    it was Velocity in Santa Clara surrounded by my peers. I watched Rauser give a
    talk about how he and team at Amazon debug production issues by analyzing production
    logs. In his session he talked about sometimes needing to pull out granular data
    on the individual user level, lay it out in hard code, and just squint at the
    data to see the overall shape of it. The shape is what was telling.


    That resonated with me, and since then I''ve explored that in almost every aspect
    of my life, I use data visualizations as management tools for running my organization.
    Some of the charts that we created in this book are derived from charts that I
    run for my own team.


    In my leisure time I prefer lifting lift to what makes me feel, and when I present
    (Figure 1-4) I can see how going on in my life affect my lifts, by cross-referencing
    dates in the series. The sign that you have advanced to a higher level of experience
    is the time it takes to recover from heavy lifts and the amount that it takes
    to begin. Beginners advance very quickly because they are lifting far from their
    potential weight ceiling, but intermediate and advanced lifts will push their
    muscles so hard and so close to their potential ceiling that it takes them longer
    to recover and increase their lift weights.


    At home I track the humidity level in each room of my house, and I play with the
    dials. I see what effect the heat has on humidity or out spaces between the floorboards
    and the walls, or even just having the doors open instead of closed for each room
    in the house. In such a way I aspire to naturally have the lowest possible humidity
    level in my house without running my dehumidifier.


    Visualizing my data allows me to see a larger shape of a situation and to clearly
    see any spikes, outliers, or trends that might not be obvious in the raw data.'
