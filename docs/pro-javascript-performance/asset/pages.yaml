    # # The Goal of This Book


    There is no shortage of information available online and in other books about
    current best practices for performance—but performance is a moving target. Because
    each browser uses a different JavaScript interpreter and rendering engine, your
    results will differ between browsers and browser versions. Best practices are
    changing or becoming redefined continually because of changes and optimizations
    at the interpreter level, differences in system configuration, and network speeds.
    This pace of change is exacerbated by the quick release schedule that most browsers
    have adopted.


    But just as important as following practices is the ability to measure your own
    performance, so that you can adjust as time comes, so that you can note the subtle
    nuances in your code and define your best practices by your own observations.


    My goal with this book is to give you the tools to observe and track over time
    the performance of your web applications from multiple perspectives, so that you
    are always aware of all aspects of your performance. And by tools, I don''t just
    mean the code that we develop throughout the course of the book or the applications
    we talk about and even automate. I mean the insight to care about these metrics
    and the mental models to build such instrumentation and visualization into everything
    that you do.


    In many ways, analyzing and optimizing the efficiency of how things operate and
    perform is part of reaching the next level of excellence. Every journeyman can
    create something to spec, but a master crafts with excellence and proves that
    with empirical data.


    # # Technologies Used and Further Reading


    As the title suggests, we use JavaScript extensively throughout this book. We
    also use PHP to automate certain tools, scrape results, and format data. If you
    are not already familiar with PHP, its grammar and lexicon are fairly similar
    to JavaScript, so you should have no problem switching context between the languages.
    Extensive coverage of PHP is outside the scope of this book. If you want more
    of an introduction to the language you check out *Beginning PHP and MySQL*, by
    W. Jason Gilmore (Apress, 2005), or if you want a dive deeper into modern PHP
    check out *Pro PHP Programming*, by Peter McIntyre, Brian Danchilla, and Mladen
    Gogala (Apress, 2011).'
