  md: 'Note Threads are sequential units of controlled execution for applications.
    Whenever an application performs any operation, it uses a thread. Some applications
    are multithreaded, which means they can do multiple things at once. Generally
    browsers use at least one thread per tab. That means the steps that the thread
    executes—the steps that we outline as part of the connection, download and rendering
    process—are handled sequentially.


    Next the browser negotiates a TCP three-way handshake with the remote server to
    set up a TCP/IP connection. This handshake consists of a Synchronize, Synchronize-Acknowledge,
    and Acknowledge message to be passed between the browser and the remote server.
    This handshake allows the client to attempt communication, the server to acknowledge
    and accept the attempt, and the client to acknowledge that the attempt has been
    accepted.


    This handshake is like the military voice procedure for two radio communication—how
    they know when the other party has finished their message, how they know not to
    talk over each other, and how they know that the one side understood the message
    from the other? These have been standardized in voice procedure, where certain
    keys have nuanced meaning; for example, Over means that one party has finished
    speaking and is waiting for a response, and Roger indicates that the message has
    been understood.


    The TCP handshake, like all communication protocols, is just a standardized way
    to define communication between multiple parties.


    # THE TCP/IP MODEL


    TCP stands for Transmission Control Protocol. It is the protocol that is used
    in the TCP/IP model that defines how communications between a client and a server
    are handled, specifically breaking the data into segments, and handling the handshake
    that we described earlier (Figure 1.1).


    The TCP/IP model is a four-layer model that represents the relationship between
    different protocols that define how data is shared across the Internet. The specification
    for the TCP/IP model is maintained by the Internet Engineering Task Force, in
    two RFC (Request For Comment) documents, found here: http://tools.ietf.org/html/rfc1122
    and http://tools.ietf.org/html/rfc1123.


    The four layers in the TCP/IP model are, in order from closest to the end user,
    the Network Access layer, the Internet layer, the Transport layer, and the Application
    layer.


    The Network Access layer controls the communication between the hardware in the
    network.


    The Internet layer handles network addressing and routing, getting IP and MAC
    addresses.


    The Transport layer is where our TCP (or UDP) communication takes places.


    The Application layer handles the top-level communication that the client and
    servers use, like HTTP and SMTP for email clients.'
