    readCSVUrls() and it accept two parameters: $csvFiles, which will reference the
    flat file webpagest_responses.txt, in which turn hold the test results URLs, and
    $file, which will reference the flat file wpt_log.txt that holds the values that
    you pull from the test results:


    ```

    function readCSVUrls($csvFiles, $file) {

    }

    ```


    Within the function you''ll delete wpt_log if it exists. This is just for housekeeping
    purposes, since it is easier and less error-prone to prune your results to see
    what you left off and insert there. Then check to make sure webpagest_responses
    exists, and that it is readable. If it is, open the file and begin to loop through
    it:'
