  md: '# CHAPTER 5 | LOOKING FORWARD, A STANDARD FOR PERFORMANCE


    Because of refinements in the performance of JavaScript interpreters and browser
    rendering engines, some of our operations may complete within microseconds. When
    we get 0 millisecond results for our tests.


    A more subtle danger with this sort of test is that the Date object is based on
    system date, which theoretically can be changed during a test, and would skew
    the results. Any number of things could change the system date without our input,
    from daylight savings time adherence, to corporate policy synchronizing system
    times. And any of these would change our timed results, and even potentially negative
    results.


    The performance.now() method returns results in fractions of milliseconds. It
    is also relative to the navigationStart event, not the system date, so it will
    be impacted by changing system time. Chrome supporting high-resolution time with
    Chrome 20 via the browser-specific prefixed webkitNow()


    ```

    Google Chrome 20

    >>> performance.now()

    290117.469999974

    ```


    And Firefox began supporting high-resolution time with Firefox 15 Aurora release:


    ```

    Firefox 15

    >>> performance.now()

    5641.447434

    ```


    This is great, but how do we use this now, and how do we make sure the code that
    we write now will be relevant when this is supported in all browsers? Future-proof
    our perfLogger library, we can code against the performance.now() method and build
    in a shim for a fallback if the browser does not yet support it.


    > A shim is an abstraction layer that intercepts API calls or events and either
    changes the signature of the call and passes on the call to fit an updated API
    signature, or handles the functionality of the API itself. Figure 5-9 diagrams
    a shim intercepting an event or message dispatch, presumably to perform some logic,
    before republishing the message. Figure 5-10 diagrams a shim that is overriding
    a function or an object, processes the information, and then passes data to, or
    invokes via composition, the original object or function.


    ![](img/a914f260cb5c9705eb1c32a679549219_101_0.png)


    Figure 5-9. Intercept'
