    \ function.\n\n```\nloadJS: function(script_url, f){\n}\n```\n\n```\nfunction\
    \ constructScriptTag(src, func){\n```\n\nWithin constructScriptTag(), you'll check\
    \ to see if a callback has been passed in; and if it has, add an onload attribute\
    \ to the script object and assign the callback function to onload attribute. This\
    \ will make the browser execute this callback function when the script has completed\
    \ loading the file. In truth, it will act different ways, depending on the browser.\
    \ It may call the callback function every time the state changes on the connection,\
    \ just like an AJAX transaction. So you'll code defensively around this in the\
    \ callback function:\n\n```\nif(func){\nscript.onload = func;\n}\n```\n\nYour\
