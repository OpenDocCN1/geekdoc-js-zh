    Generally you can use Firebug to get an idea of potential issues during development
    or for production support. You can proactively monitor the size of your payloads
    and the general load time, and you can check to make sure your pages aren''t taking
    too long to load. What is the overall size of my page, what are the largest assets,
    and what is the longest to load? You can answer questions like that. You use filters
    to focus on areas of concern, like seeing how large our external JavaScript files
    are. Or even sort the rows by domain name to see content grouped by domain, or
    by HTTP status to quickly pick out any calls that are error out.


    Because Firebug is a passive tool that merely reports what is happening and doesn''t
    recommend for improvements, it''s best suited as a development tool or for debugging
    issues that arise.


    # YSlow


    For a deeper analysis of a page''s web performance you can use YSlow.

    Developed by Steve Souders and the team at Yahoo!, YSlow was released in 2007.
    It was initially released as a Firefox extension, but eventually it was ported
    to work with most other browsers as well. Firebug, YSlow is an in-browser tool,
    and like Firebug it does not allow automation, but it is an invaluable tool to
    assess a page''s web performance and get feedback on steps to improve performance.


    The steps for improvement are what distinguish YSlow. It uses a set of criteria
    to evaluate the performance of a given page and gives feedback that is specific
    to the needs of your site. Best of all, the criteria are a living thing, and YSlow
    updates them as best practices change and old ones become less relevant.


    Let''s try out YSlow.


    # How to Install


    To install YSlow, simply navigate to http://yslow.org/ and choose the platform
    that you want to run it in. Figure 2-6 shows all the different browsers and platforms
    that are currently available on the YSlow website.

    Since we are already using Firefox with Firebug, let''s continue to use that browser
    for YSlow. Once you select the Firefox version, install the extension and restart
    the browser, you are ready to start using YSlow.'
