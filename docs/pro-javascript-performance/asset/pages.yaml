    This is exciting, and ultimately the most important part of the data that you
    get from WebPagetest. But you also want to chart the other aspects of performance
    that you pulled from the test result, because they are contributors to the ultimate
    page load time. If you chart the page size and the number of HTTP requests, you
    will paint a larger picture that shows indicators of page speed.


    # Plotting Payload and Number of HTTP Requests


    The next chart adds those elements. The scales are different between each metric
    — page speed is in the thousands of milliseconds, the number of HTTP requests
    is in the tens, and file size is in the hundreds of bytes. You could normalize
    all of this data and show it in standard deviations, but that would abstract from
    the actual numbers, and you need those to debug any issues.


    Instead, you''ll create a time series chart for each aspect of quality. BUT you''ll
    include these time series charts on one single graph. The reason for this is to
    adhere to Edward Tufte''s principles of good data design—to make our graphic as
    dense with data as possible.


    This code charts the remaining columns in our data frames, the bytes and httprequests
    columns, the same way you chart the loadtime:


    ```

    plot(tbotcom$bytes, ylim=c(0, 1000), type="1", col="#ff0000", ylab="Page Size
    in KB", xlab=""

    xaxt="n"

    axis(1, at=1:length(row.names(tbotcom)), lab=rownames(tbotcom), cex.axis=0.3)

    ```


