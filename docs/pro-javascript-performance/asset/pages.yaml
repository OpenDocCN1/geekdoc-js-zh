  md: '# CHAPTER 5 LOOKING FORWARD, A STANDARD FOR PERFORMANCE


    data or the fetchStart. If we want to track end-to-end time we will often start
    with this value.


    unloadEventStart: This is the time snapshot for when the browser begins to unload
    the previous page, if there is a previous page at the same domain to unload.


    unloadEnd: This is the time snapshot for when the browser completes unloading
    the previous page.


    redirectStart: This is the time snapshot for when the browser begins any HTTP
    redirects.


    redirectEnd: This is the time snapshot for all HTTP redirects are complete.


    To calculate the total time spent on HTTP redirects, subtract redirectStart from
    redirectEnd:


    ```

    <script>

    var http_redirect_time = performance.timing.redirectEnd - performance.timing.redirectStart;

    </script>

    ```


    fetchStart: This is the time snapshot for when the browser begins to check the
    cache for the requested resource.


    To calculate the total time spent loading cache, subtract fetchStart from domainLookup:


    ```

    <script>

    var cache_time = performance.timing.domainLookupStart - performance.timing.fetchStart;

    </script>

    ```


    domainLookupStart: This is the time snapshot for when the browser begins the DNS
    lookup for the requested content.


    domainLookupEnd: This is the time snapshot for when the browser completes the
