    # Open Source


    I''ve named this project WPTRanner and put the code for it in one open source
    project on Github, the URL is https://github.com/tjmbarker/WPTRanner and I welcome
    you to grab and use it for your own purposes, fork it to start your own projects,
    or contribute back to make it a better project for everyone''s benefit.


    # Summary


    This chapter explored an automated way to track the web performance of a set of
    URLs with WebPagest, PHP, and R. There are so many things you could use this for.
    Of course you could track the performance of your sites over time, but you could
    also track the performance of experimental features that you want to add to your
    sites, or even track the performance of pages while they are in development before
    they go to production.


    You could use the results of this report to form a standard of what you expect
    your performance to be and create process to make sure new features don''t impact
    that performance. You can generate internal, and executive level reports you tie
    this data with other data, like release dates, user visits, or even other number
    of related and pertinent data.


    Next chapter you will create a JavaScript library to benchmark the run performance
    of your JavaScript, and chart that data to extract useful metrics that you can
    use for not only your code standards, but to influence product decisions and browser
    support matrices. As an added bonus, we''ll close this chapter with an interview
    with Patrick Meenan, creator of WebPagestest, about the the tool and its future.


    # Interview with Patrick Meenan of WebPagestest


    Patrick Meenan was kind enough to answer a wide range of questions about WebPagestest
    for Pro JavaScript readers.


    # What was the original inspiration for creating WebPagestest?


    There were a couple of situations that we were having difficulty with in 2006–2007
    when it was created:


    +   Most of our developers were using Firefox (because of Firefox).

    Our office was across the street from the data center, so developers had high-bandwidth/low-latency
    connections to the server.


    As a result, pages always felt fast to the developers, and it was very difficult
    to start a conversation about speeding things up. Our monitoring services were
    all testing from backbone locations, those that weren''t much better. So we had
    a need for a tool that let developers see what the performance looked like for
    our users (on more representative browsers with more realistic connections).'
