    # Minification


    In general, a good amount of energy is spent thinking about optimizing caching.
    This is a great thing because caching as much content as you will create a better
    user experience for subsequent visits and save bandwidth and hit to your origins.


    When a user comes to a site for the first time there will be no cache. To ensure
    that our first-time visits are as streamlined as possible, we need to minify our
    JavaScript.


    Minification is originally based on the idea that the JavaScript interpreter ignores
    white space, line breaks, and of course comments, we can save on total size of
    our .js files if we remove unneeded characters.


    There are many products that minify JavaScript. Some of the best adds on that
    concept.


    # Minify


    First we''ll look at Minify, available at http://code.google.com/p/minify/. Minify
    proxies the JavaScript file; the script tag on the page points to Minify, which
    is a PHP file (In the following code we point to the /min directory where the
    PHP file is .php). The script tag looks like:


    ```

    <script type="text/javascript" src="min/?f-lib/preprologger.js"></script>

    ```


    > Note A web proxy is that accepts a URL, reads in and processes the contents
    of the URL, and makes that content available, either as-is or decorated with additional
    functionality or formatting. Usually we use proxies to make content on one domain
    available to client-side code on another domain. Minify reads in the, decorates
    by its way of removing extraneous characters, and gzips the response.


    Minify reads the JavaScript file, minifies it and when it responds sets the accept
    encoding HTTP header to gzip, deflate. Effectively it has built in HTTP compression.
    This is especially useful if your web host does not allow the gzi of static content
    (like the web host I use, unfortunately). The high level architecture of how Minify
    works in Figure 2-14.


    To use Minify, simply download the project from http://code.google.com/p/minify/,
    place the decompressed/min folder in the root of your web site, and navigate to
    the Minify control panel, located at /builder/.


    From this control panel you can add the JavaScript files you wanted in the minified
    result, and the page generates the script tag you can use to link to this result.
    Simply firstly.'
