  md: '# CHAPTER 3 ■ WPTRUNNER—AUTOMATED PERFORMANCE MONITORING AND VISUALIZATION
    WITH WEBPAGETEST


    # Do you recommend a different approach than polling for test complete when using
    the API?


    The API supports a callback method where the server will make a request to a beacon
    URL that you provide (the pingtest parameter) but you''re still going to poll
    away in case the callback gets missed for some reason you can do it for efficiency
    but it won''t make the code any easier.


    # What is the process for tests going through your queue?


    Each location writes a separate queue, so they are independent, and here is the
    basic flow:


    +   1. regexp.php writes a job to the queue directory for the given location and
    adds an in-memory priority queue (to make sure tests are in order). There are
    actually 10 different priority queues for a given location, user-initiated tests
    get top priority, API tests get medium priority, and there are a few other explicit
    classes.

    2. The test agents poll the server for work, specifying their location as part
    of the request (work/worker.php).

    3. The server picks through the priority queues in order and returns the first
    job it finds for the given location.

    4. The test agent parses the test request and runs the tests specified (all of
    the runs, first and repeat view).

    5. As each run completes, the test agent uploads the results for that run to work/
    workday.php.

    6. When the test is fully complete the test agent sends a “done” flag along with
    the test data.


    # What are some of the most interesting things you have heard that people are
    doing with WebPagestest?


    I''m excited to see the systems that people built on top of it. The HTTP Archive
    (httparchive.org) is a great example, but a lot of companies have integrated into
    their internal systems using the API.


    # Could you talk a little about the agent architecture?


    These days there are actually several different agents. The are Chrome and Firefox,
    and there are the IE agent, the new Windows agent that supports Chrome and Firefox,
    and the iOS and Android agents opensource. There is an experimental WebDriver/NodeJs
    agent that we are working with that Akamai provides cross-platform support for
    testing in Chrome. WebPagestest has a standard API for test agents, which makes
    it easy to run in a new agent and plug it in.

    The Windows agents are probably some of the more interesting ones architecturally
    because they do some crazy things to get access to the data they need. The new
    Windows agent, for example:


    +   * Launches the browser process (Chrome, Firefox or IE).

    * Uses code injection techniques to inject and run code in the context of the
    browser.


    63'
