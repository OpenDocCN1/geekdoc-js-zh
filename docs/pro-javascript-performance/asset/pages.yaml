  md: '# CHAPTER 3 ■ WPRUNNER—AUTOMATED PERFORMANCE MONITORING AND VISUALIZATION WITH
    WEBPAGETEST


    ![](img/a914f260cb5c9705eb1c32a679549219_46_0.png)


    Figure 3-1. First iteration of sequence diagram


    This is a great start. You know from our experience with WebPagest last chapter
    that tests runs in WPT are not usually run instantaneously. You have to get into
    a queue, and even when you are in the front of the queue itself takes a little
    while. This is to be expected because the test isn''t simulating the experience;
    it is really loading the site in the agent that you choose.

    What means tactically is that when you call the API, it returns a URL that you
    can poll that will indicate when the test is complete. It is important to note
    because you''ll want to save the returned URLs that you get and be able to reference
    them again and again, until the test is complete, so you''ll want to store them
    in a flat file. You''ll tail the values to the flat file; that is, you''ll append
    the newest values to the end of the file. To keep it simple you can use a flat
    file that you''ll call webpagest_responses.txt.

    You''ll also use a flat file to store the test results once the tests complete.
    You will call this flat file wpo_log.txt. The final piece you''ll need is an R
    script to read wpo_log.txt and generate the chart.

    If you add these additional parts to the sequence diagram, your finished architecture
    document should look like Figure 3-2.


