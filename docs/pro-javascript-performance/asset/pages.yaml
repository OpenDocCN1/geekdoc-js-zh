  md: 'Another contributor to network latency is the number of HTTP requests that
    your page needs to make load all of the objects on the page. Every asset that
    is included on the page—each image and external JavaScript and CSS file—requires
    a round trip to the server. Each spin ups a new thread and a new instance of request
    and response, plus the cost in time shown in Figure 1-1, which includes a cost
    for DNS lookup, TCP connection, and HTTP


    Waterfall charts are used to demonstrate the time it takes to request a page and
    all the assets included in the page. They show the HTTP transaction for each asset
    needed to construct a page, including the size of each asset, how long each one
    took to download, and the sequence in which they were downloaded. At a high level,
    each bar in the waterfall chart is a resource that we are downloading. The length
    of a bar corresponds to how long it takes to connect and download. The charts
    run on a sequential timeline, so that the top bar is the first item that gets
    downloaded and the bar is the final item, and the far left of the timeline is
    when the connections begin and the far right is when they end. We will talk much
    more about waterfall charts in Chapter 2, when we discuss tools for measuring
    and impacting performance.


    # Parsing and Rendering


    Another influencer of web performance, outside of network concerns, is browser
    parsing and rendering. Browser parsing and rendering is influenced by a number
    of things. To better understand this concept first look at an overview of the
    browser''s architecture as it pertains to parsing and rendering web pages (Figure
    1-3).


    Most modern browsers have the following architecture: to handle the UI, including
    location and the bar history, a Rendering Engine for parsing and drawing all of
    the objects in the page, a JavaScript Engine for interpreting the JavaScript,
    and a network layer to handle the HTTP requests.


    Since the browser reads content from the top down, where you place assets impacts
    the perceived speed of your site. For example, if you put your JavaScript tags
    before HTML content, the browser will call the JavaScript interpreter and parse
    the JavaScript before finishing the remainder of the HTML content, which can delay
    making the page usable for the end user.


    Browsers are your bread and butter as a web developer, and you should be more
    than familiar with each of the rendering engines and JavaScript engines. It is
    more than your time to download the


