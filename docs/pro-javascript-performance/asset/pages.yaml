  md: '# CHAPTER 8


    # Balancing Performance with Software Engineering Best Practices and Running in
    Production


    Chapter 7 explored ways to improve runtime performance. You quantified these improvements
    using the example perfLogger library and charted the results with R. That has
    been a theme throughout this book—measure and prove a point with data. If I had
    to choose a single sentence to serve as a thesis statement for this book, it would
    have to be something that I said in the first chapter that deserves repeating:
    Any journeyman can create something to spec, but a master crafts with excellence
    and proves that excellence with empirical data.


    We''ve strove to do so far throughout this book, creating our tools to instrument
    our code and master the performance of our web sites. We crafted visualizations
    to prepare our data for easier consumption.


    But this is a little different. We will still look at raw data and performance
    optimizations, the focus will be on balancing the need to optimize with our needs,
    like adhering to coding standards and best practices, readability, and making
    our code modular for use across a larger team.


    We''ll also take a closer look at how to generate data at scale, either making
    our own test lab using virtual machines, or putting our code on a production site
    to crowd-source the data.


    # Balancing Performance with Readability, Modularity, and Good Design


    At the time of writing this size of the group that I lead was roughly 20 to 25
    engineers, and engineering leads. There''s a lot of hands to make changes in just
    two to three code repositories. I track our performance like a hawk would track
    a field mouse. I chart out our web performance from WebPagtest for URLs. I meet
    with the team regularly to discuss the output of these reports, going over our
    first view and repeat data to make sure we are making efficient use of cache.
    We look at all the aspects of performance and try toeke out as many optimizations
    as we can.


    But there are other things that I track as well; among are things like: What is
    our defect density? What is our incident rate for each product in production?
    Those things could be harmful to a product brand, arguably more than performance,
    depending on the severity of the issue.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# CHAPTER 8 ## BALANCING PERFORMANCE WITH SOFTWARE ENGINEERING BEST PRACTICES
    AND RUNNING IN PRODUCTION


    In looking at things defects and production incidents, one of the leading root
    causes, in my experience, is communication. Are the engineers talking to the QA
    staff updating them on features? Are the engineers talking with the production
    staff about how to support the features? Are the engineers talking with each other?
    Communication issues don''t stop there. With millions of lines of code, does everyone
    know what the code does? Are libraries written to modularize functionality? Does
    everyone know these libraries? If I were to read a piece of code, would I know
    what and how to use it? How readable is the code?


    When code is breaking in production, it is more important than that all twenty
    of my engineers know how to use all the code and functionality available to them
    than writing out an extra millisecond or two of performance.


    That''s why we strive for modular design, reusability, and readability.

    We try to practice modular design, that we write code in self-contained and interchangeable
    modules. Writing code in modules minimizes the potential harm that can come from
    changes because the modules communicate with each other via their interfaces,
    we can easily test the interface and integrate tests how they interact.


    By striving for reusability we reduce the chances of creating new bugs. Ideally,
    the code that we are reusing has been tested and proven already.

    Making our code readable means to make it obvious what our code does. This includes


    +   - Abstracting complex logic into clear and meaningfully named functions and
    self-contained objects or modules (it''s all circular).

    - Using consistent formatting that we have agreed upon as our standard.

    - Using good and clear naming patterns for our variable names.


    While all of those are good practices, they generally also counter to having the
    least, most performant code humanly possible. Long, meaningful variable names
    take up characters that add to file size, which increases the payload of a. The
    same principle applies to the extra lines of code needed to write functions and
    constructors, not to mention the extra overhead for the interpreter of creating
    these objects in the heap, managing garbage collection, and traversing their scope
    chain.


    But having our code in objects and functions abstracts logic to meaningfully named,
    atomic pieces that can be updated and maintained without having much of an impact
    on the rest of the system.


    It''s all about perspective and finding balance. That''s part of what we will
    talk about this chapter.


    # Scorched-Earth Performance


    In earlier chapters I''ve mentioned the term scorched-earth performance. That''s
    a term I''ve coined that indicates we have sacrificed all else in the ultimate
    pursuit of performance. In this section we look at some scorched-earth practices,
    and we quantify the benefit, but also discuss the cost to give the full picture.


    # Inlining Functions


    Let''s first look at the run-time performance benefit that we get from inlining
    functions. In past chapters we''ve looked at the overhead cost of having and traversing
    memory structures. Last chapter we talked about this in the context of differing
    memory scopes, but the same concept applies to object hierarchies we create.'
