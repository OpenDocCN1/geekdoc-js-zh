    # Importing External Data


    Now that you''ve seen how to hold data, let''s look at how to import data. You
    can read data from a flat file using the read.table() function. This function
    accepts four parameters: the path to the flat file to read in, a boolean to indicate
    whether the first row of the flat file contains headers or not, the character
    to treat as the column delimiter, and the column to treat as the row identifier.
    The read.table() function returns a data frame.'
