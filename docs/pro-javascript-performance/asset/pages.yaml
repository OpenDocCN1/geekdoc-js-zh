  md: "# CHAPTER 6 | WEB PERFORMANCE OPTIMIZATIONS\n\nTo get around this potential\
    \ issue it has generally been good practice to place all script tags at the bottom\
    \ of your HTML, so that any page in rendering to process the JavaScript is done\
    \ after the page is fully rendered.\n\n# Script Loading\n\nAnother option is to\
    \ load remote JavaScript files programmatically. This is called script loading\
    \ and allows us to trick the rendering engine, let's look at how.\n\nRemember\
    \ that the workflow we've explored for how the rendering engine applies pauses\
    \ to external scripts. The browser looks for the src attribute of the script tag,\
    \ which tells it it must download a remote resource. If it encounters a script\
    \ tag without a src attribute, the rendering engine simply passes the code to\
    \ the JavaScript Interpreter for execution.\n\nSo what can we do is inline JavaScript\
    \ to append script tags to the document dynamically, like so:\n\n```\n<script>\n\
    var script = document.createElement('SCRIPT');\nscript.src = src;\nwindow.document.getElementsByTagName('HEAD')[0].appendChild(script);\n\
    </script>\n```\n\nThis snippet uses the .createElement() function to create a\
    \ new script tag and store it in a variable named script. It sets the src attribute\
    \ of the new script tag to point to a remote JavaScript file, and appends the\
    \ new script tag to the Head section of the document.\n\nThat's fairly simple,\
    \ let's flesh that out into a real example that we can use.\n\nFirst create a\
    \ namespace, which you can call remoteLoader:\n\n```\nvar remoteLoader = function\
    \ remoteLoader(){\n\nreturn{\n}\n};\nWithin remoteLoader, create a private function\
    \ to construct the script tags, using the same logic outlined in the snippet.\
    \ constructScriptTag() and pass in a URL to use as the source of the script tag:\n\
    function constructScriptTag(src) {\n  var script = document.createElement('SCRIPT');\n\
    \  script.src = src;\n  return script;\n}\n\nWithin the returned object, create\
    \ a single function called loadJS(), with a parameter named script_url:\nloadJS:\
    \ function(script_url) {\n}\n```\n\n1 At least Steve Souders wrote about it in\
    \ his book High Performance Web Sites: Essential Knowledge for Front-End Engineers\
    \ (O'Reilly 2007).\n\n112"
