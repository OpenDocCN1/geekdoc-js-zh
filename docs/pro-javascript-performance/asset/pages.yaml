    the beginning of the navigation request to when the page is loaded, the lazy-loaded
    script loaded and the init function is called. This is a genuine representation
    of the full load time, and from here you can see that we get significant gains
    by lazy loading. The results are 100 milliseconds faster on average than our baseline
    and async tests, and 350 milliseconds faster on average than our script-loaded
    test.


