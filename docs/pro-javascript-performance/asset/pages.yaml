  md: "Transposing the data puts it on its side so that it looks like this.\n\n> df\n\
    \n| 1 | 2 | 3 | 4 |\n| X.0050476189047619 | 0.0050 | 0.0298 | 0.00125 | 0.00716\
    \ |\n\nThen just set the column names of the data frame to the list of column\
    \ names that you've been binding and create the chart:\n\n```\ncolnames(df) <-\
    \ colnamelist\n```\n\n```\nbarplot(as.matrix(df), main=descr)\n```\n\nThe completed\
    \ function looks like the following. You will use this from now on to generate\
    \ charts to demonstrate test results.\n\n```\nPlotResultofTestsByBrowser <- function(testList,\
    \ browserList, descr){\n  df <- data.frame()\n  colnameList <- c()\n\n  for(browser\
    \ in browserList){\n    for(test in testList){\n      colnameList <- c(colnameList,\
    \ paste(browser, \"\\n\", test))\n      tmp <- mean(getDFByBrowser(ParseResultsByTest(test),\
    \ browser)$RunTime\n      df <- rbind(df, tmp)\n    }\n  }\n  df <- t(df)\n  colnames(df)\
    \ <- colnameList\n  barplot(as.matrix(df), main=descr)\n}\n```\n\n# JQuery vs\
