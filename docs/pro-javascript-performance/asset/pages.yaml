  md: '# CHAPTER 4


    # perfLogger—JavaScript Benchmarking and Logging


    Last chapter we coded an automated solution to track and visualize the web performance
    of URLs over time. We used WebPagetest to generate our metrics, PHP to aggregate
    and scrub the numbers, and R to create data visualizations from those numbers.
    We called this project WPTRuner, and we can use it to test the efficacy of feature
    optimizations that we would want to implement and the performance of new features
    that we will develop.

    WPTRuner covered the tracking of web performance; in this chapter we''ll create
    a tool to track runtime environment.

    We are going to create a JavaScript library to benchmark the runtime performance
    of almost anything from ad hoc pieces of code, to the render time of modules.
    Following our running theme, we will visualize the results of these tests.

    We''ll be using these tools to analyze the results of some performance best practices
    that we will be going over in later chapters, but than anything I hope that we
    take these tools and the thirst to quantify results with empirical data with everything
    that you do.


    # Architecture


    Once we start out with the architecture phase. Before starting any endeavor, think
    about all of the pieces involved, and how they should interact.

    There are a couple of ways to benchmark code—either by timing it or by calculating
    the number of operations performed during execution. For example, and to we want
    to minimize the overhead effect as much as possible,we''ll calculate the time
    in milliseconds during code execution. We will capture a time stamp right before
    we run the code and a time stamp right after we run the code, and call the difference
    our runtime times.


    ```

    [end time] - [run time]

    ```


    This is a great point. A flowchart of what we have so far looks like the diagram
    in Figure 4-1.


    > The observer effect says that simply observing an act influences its outcome.
    For our tests, performing additional operations during the operation that we are
    timing could add latency in the code that we are benchmarking.'
