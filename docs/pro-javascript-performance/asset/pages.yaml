  md: '# A Practical Example of R


    This has been just the barest rest of R, but now that you understand its basic
    building blocks, let''s construct the chart that you see in Figure 2-19 earlier.


    First you''ll create four variables, one number to hold the value of the uncompressed
    JavaScript file, one vector to hold the names of the tools, one vector to hold
    the file size of the JavaScript files after they have been run through the tools,
    and a final vector to hold the percentage difference between the minified size
    and the original size.


    You''ll be refactoring that last variable soon, but for now let you see the pattern
    that we are applying to the percentage—100 minus the result of the new size divided
    by the total size multiplied by hundred.


    ```

    originalSize <- 2150

    tout <- c("YUI", "Closure Compiler (simple)", "Minify", "Closure Compiler (advanced)")nsize
    <- c(1638, 1638, 573, 0)

    diff <- c(100 - (1638 / 2150)*100), (100 - (1638 / 2150)*100), (100 - (573 / 2150)*100),
    (0 / 2150)*100)

    ```


    Next create a data frame from those vectors, and make the row identifier of the
    tool names.


    ```

    mincompare <- data.frame(diff, size, row.names=tool)

    ```


    If you type mincompare in the console, you''ll see that it is structured like
    this:


    ```

    YUI 23.81395 1638

    Closure Compiler (simple) 23.81395 1638

    Minify 73.34884 573

    Closure Compiler (advanced) 100.00000 0

    ```


    Perfect! From here you can start to construct the chart. Use the barplot function
    to plot the diff column. Make explicitly the y-axis names to the row names of
    the data frame, and give the chart a title of "Percent of file size reduction"


    ```

    barplot(mincompare$diff, horiz=TRUE, args.names=row.names(mincompare), main="Percent
    of file size reduction by product")

    ```


    If you run this in the console you''ll see that we''re almost there. It should
    look like Figure 2-26.

    You see that the first and third y-axis names are missing; because the chart is
    too large to fit vertically as it is now. You can fix this by making the text
    horizontal just like the bars.


    To do this, set the graphical parameters of the chart using the par function.
    But first, save the existing parameters so that you can revert them to after creating
    the chart:


    ```

    opar <- par(no.readonly=TRUE)

    ```


    This saves the existing parameters in a variable called opar so you can retrieve
    them after you are done.

    Next you can make the text horizontal, with the par() function:


    ```

    par(las=1, mar=c(10,10,10,10))

    ```'
