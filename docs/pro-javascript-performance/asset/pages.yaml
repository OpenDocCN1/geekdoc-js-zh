  md: "Some user strings contains commas, as the delimiter that you will use to separate\
    \ fields in our flat file will be a comma, you'll need to strip commas out of\
    \ the user agent. Abstract functionality into its own function cleanCommas() and\
    \ stub out a to call it for:\n\n```\n$obj->useragent = cleanCommas($obj->useragent);\n\
    ```\n\nNext, you'll construct a comma-separated string from all of the property\
    \ values and values that pass to the appendToFile($file) function from the shared\
    \ file, fileio.php. For an extra dimension of data, could prepend an IP address\
    \ to that file. Adding this data will help you extrapolate and categorize the\
    \ results in all sorts of interesting ways: for example, converting IP to geographical\
    \ information and sorting the results by region, or by ISP.\n\n```\n$newLine =\
    \ $obj->SERVER[\"REMOTE_ADDR\"] . \",\" . $obj->id . \",\" . $obj->startTime .\
    \ \",\" . $obj->stopTime . \",\" . $obj->runtime . \",\" . $obj->url . \",\" .\
    \ $obj->useragent;\nappendToFile($newLine, $file);\",\n```\n\nYour complete function\
    \ should look like this:\n\n```\nfunction saveLog($obj, $file) {\n  if(!file_exists($file))\
    \ {\n    formatLog($file);\n  }\n  $obj->useragent = cleanCommas($obj->useragent);\n\
    \  $newLine = $obj->SERVER[\"REMOTE_ADDR\"] . \",\" . $obj->id . \",\" . $obj->startTime\
    \ . \",\" . $obj->stopTime . \",\" . $obj->runtime . \",\" . $obj->url . \",\"\
    \ . $obj->useragent;\n  appendToFile($newLine, $file);\n}\n```\n\nLet's quickly\
    \ use a little trick, calling the explode() function. The function will accept\
    \ a parameter $data. You'll use a function—PHP's equivalent to the split() function,\
    \ which splits a string at a defined delimiter (in this case a comma) and returns\
    \ an array with each string part as a separate element. Pass that array to the\
    \ implode() function; it is PHP's equivalent to the join() function, which using\
    \ the two functions in conjunction you create a single-line find-and-replace function.\n\
    \n```\nfunction cleanCommas($data) {\n  return implode(\",\", explode(\",\", $data));\n\
    }\n```\n\nLet's linger on this find-and-replace trick for a minute. Think about\
    \ how it's working. Exploding on the delimiter splits the string at each index\
    \ of the delimiter. If we take the string \"the quick brown fox jumps over the\
    \ lazy dog\" and explode it on the delimiter, it becomes the array\n\n[\"quick\"\
    , \"brown\", \"fox\", \"jumps\", \"over\", \"lazy\", \"dog\"]\n\nIf we then implode\
    \ that and pass in the string \"a\" to use to glue the array together, we get\
    \ the following:\n\n```\n\"a quick brown fox jumps over a lazy dog\"\n```"
