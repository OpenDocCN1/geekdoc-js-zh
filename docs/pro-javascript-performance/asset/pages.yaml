    The final comparison is to take the original JavaScript file and run it through
    Closure Compiler with the Advanced option enabled, which rewrites the code to
    be as streamlined. When you do, make sure you include all JavaScript on the page;
    not just the kms file, but also the JavaScript on the page that instantiates the
    objects. It''s necessary to do this because Closure Compiler will eliminate all
    code that it does not execute. If you have a namespace object in JS file you must
    instantiate it on the HTML page that instantiates the object in the same file
    so Closure Compiler can see that it''s used and include it in its output.

    The final output from Closure Compiler will embed on the HTML page instead of
    linking to it externally. You can see the results in Figure 2-18.

    Now that we have data, let''s visualize and evaluate.


    # Analysis and Visualization


    We''ll open up R and in our minification results, the new file size for each tool''s
    output, and the difference for each. We''ll then some R to create a horizontal
    bar chart to compare the difference.

    Don''t worry, we''ll do this we''ll explore R in depth, and when we do I''ll explain
    what each line does. Now let''s roll with it and look at the chart that we''ll
    ultimately generate, shown in Figure 2-19.

    You can see from Figure 2-19 that Closure Compiler gives the greatest reduction
    in size out of the box, Minify''s minification of moving and gipping brings it
    to a close size. YUI and the simple minification that Closure Compiler provides
    come in a distant third.

    Against this compared, Minify performs out of the—we''ll see our results at third
    place they would have had better performance out of the box.

    Sheer size reduction is only one of our overall determination. As you see in the
    example earlier, Closure Compiler''s advanced output is far from the code that
    originally went into it. If issues were introduced in production they could be
    difficult to debug, especially if there is third-party code on your pages interacting
    with yours.

    Does yours have third-party code, do you add code? Are your servers on or belong
    to a web host? How important is support provided to you, for having the absolute
    fastest experience possible? When determining your preferred tool, it is best
    to evaluate as we just did and build a environment where you can integrate this
    tool and have control configuring your web host? If so, YUI or Closure Compiler
    might be your best choice. Are you comfortable with the scorched-earth approach
    of Closure Compiler''s advanced setting? If so, that gives the greatest performance
    boost – but good luck trying to debug its output in production.'
