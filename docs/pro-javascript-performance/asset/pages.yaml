  md: '# CHAPTER 3


    # WPTRunner—Automated Performance Monitoring and Visualization with WebPagest


    The last chapter laid a good amount of ground work that we will be building upon
    throughout the rest of the book. We looked at how to generate waterfall charts
    with Firebug and YSlow, and use them as debugging tools. We explored some of the
    extensive features and functionality of WebPagest. We talked about the concept
    of minifying JavaScript and ran a multivariate test to compare the results of
    several minifying tools. We closed the chapter by learning about R and writing
    a script to visualize the results of our multivariate test.


    This chapter expands on those concepts. You will be hooking into WebPagest to
    automate monitoring of a URLs, and using R to visualize those results.


    You will essentially create a framework that will allow you to monitor the web
    performance of your sites. By plugging in specific URLs, you can run multivariate
    test across URLs, and compare the impact of performance to feature updates or
    ad choices on our sites.


    # Architecture


    Let''s fleshing out an architecture. I usually start by standing in front of a
    whiteboard and working out high-level concepts and cases using UML. I''ll open
    up Omnigraff or Visio or some other flow-charting application and work on an architecture
    document. For this you will create a UML sequence diagram to show the interactions
    between the objects or processes in the system.


    As we saw in the last chapter, WebPagest is a robust application that will provide
    detailed performance information. It also exposes an API that you can invoke to
    fire off a test. With this in mind you know''ll need something to call the API,
    and get the response back.


    You also know that you will need to parse the response that comes from WebPagest,
    let''s create three processes in the architecture document: one to represent WebPagest,
    one to call the API, and one to process the response.


    Let''s call the process that calls the pagetest API run_wpt and the process that
    handles the result, process_wpt_response. So so far our sequence diagram should
    look like Figure 3-1.'
