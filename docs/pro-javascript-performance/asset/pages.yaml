    # Rendering Engines


    Let''s take a look at some of the more widely used rendering engines out in the
    wild. It''s important to think of the rendering engine also as the browser. By
    modularizing the architecture of the browsers, browser makers have been able to
    develop the components. More tools than those render HTML, including email clients
    and web components in other applications. Having a distributable rendering engine,
    browser makers can create their own or license them by other companies. This usually
    allows developers to know what to expect from a software package just by which
    rendering engine it is.


    Firefox and all of its derivatives and cousins (like Thunderbird, Mozilla''s email
    client) use Gecko, available at: https://developer.mozilla.org/en/Gecko. Gecko
    was first developed at Netscape, before the Mozilla Project spun out as its own
    entity, as the successor to the Netscape rendering engine, back in 1998.


    Webkit is what Chrome and Safari use, and is your target for most mobile web development
    since it is used as the layout and rendering engine for Android devices as well
    as mobile for iOS devices and the Silk browser on Kindle Fires. Webkit is available
    at: http://www.webkit.org/. Webkit was started in 2001 as Apple as a fork of the
    rendering engine, KHTML from KDE. Webkit was opened publicly in 2005.


    Opera on desktop, mobile, and all the Nintendo consoles (NDS, Wii) use Presto,
    which was introduced in 2003 with Opera 7. More information about Presto can be
    found at http://dev.opera.com/articles/view/presto-2-web-standards-supported-by/


    And finally, Internet Explorer, along with other Microsoft products like Outlook,
    use MSHTML, codenamed Trident. Microsoft first introduced Trident with Internet
    Explorer 4 in 1997 and has been iterating on the engine since. Documentation for
    Trident can be found here: http://msn.microsoft.com/en-us/library/b0508953.


    # JavaScript Engines


    Next''s take a look at the JavaScript engines used by the most popular browsers.
    Modularizing the JavaScript interpreter makes the same kind of sense as modularizing
    the rendering engine, or modularizing any code for that matter. The interpreter
    can be shared with other properties, or embedded in other tools. The open source
    interpreters can be used in your projects, perhaps helps to build your own static
    code analysis tools, or to help build in JavaScript support to allow your scripts
    certain functionality in your applications.


    SpiderMonkey is the JavaScript engine made by Mozilla that is used in Firefox,
    Brendan Eich, creator of JavaScript, created SpiderMonkey in 1996 and has been
    the JavaScript interpreter for Netscape and then Firefox ever. The documentation
    for SpiderMonkey is available here: https://developer.mozilla.org/en/SpiderMonkey.
    Mozilla has provided documentation showing how to embed_SpiderMonkey into your
    own applications: https://developer.mozilla.org/en/How_to_embed_JavaScript_engine.


    Opera uses Carakan, which was introduced in 2010. More information about Carakan
    can be found here: http://my.opera.com/dragonfly/index.html/tag/Carakan.


    Google''s open source JavaScript engine used by Chrome is available here: http://code.google.com/p/v8/.
    Documentation for it is available here: https://developers.google.com/v8/


    Safari uses JavaScriptCore sometimes called Nitro. More information about JavaScriptCore
    can be found here: http://www.webkit.org/projects/javascript/index.html.'
