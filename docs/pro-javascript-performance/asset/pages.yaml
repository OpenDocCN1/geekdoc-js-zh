  md: '# Summary


    In this chapter we learned about several tools that are invaluable to us in our
    goal to create and maintain perform web sites. We saw Firebug''s Network Monitoring
    tab is a great tool to keep track of the network dependencies that we make our
    pages and the impacts they have on our page speed. Its passive nature makes Network
    Monitoring a great tool to use as we develop pages or debug known issues.


    We used different filters with YSlow to test the current performance of our sites,
    but also to get customized tips to better optimize the performance of these sites.


    With Webpagetest we were also able to see the performance of external assets and
    get performance tips, but for different aspects of data as well. We saw the robust
    configuration that Webpagetest sports, including scripting capabilities to test
    more complex scenarios. We also saw that Webpagetest exposes an API, which we
    will use that next chapter to automate performance monitoring.


    We explored several tools for minifying our JavaScript. We implemented each tool
    and compared the results by visualizing the differences in file size that each
    tool gave us. We also started to look at some the details that matter more than
    just the numbers.


    We then dipped our toes in the R language. We installed the R console, explored
    some introductory concepts in R, and coded our first chart in R—the same chart
    that we used to compare the results of the minification tool comparison.


    In the coming chapters we will use and expand on our knowledge of R, as well as
    make use of many of the tools and concepts we explored this chapter.'
