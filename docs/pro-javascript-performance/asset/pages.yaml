    Figure 4-3. High-level sequence diagram


    So far we have seen how we are going to generate runtime numbers for the code
    that we want to benchmark, as well as the flow for how we will save the data.
    Let''s now think about the API for our library.

    Ultimately perfLogger is meant to be used by external code, so make sure you thought
