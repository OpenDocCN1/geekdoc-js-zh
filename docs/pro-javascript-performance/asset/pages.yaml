  md: "In the virtual proxy pattern, shown in Figure 6-13, we instantiate a stub and\
    \ load in the actual implementation when it is needed (usually via composition)\
    \ and expose it. This pattern is generally realized when applications have modules\
    \ or components that are not always needed, or needed immediately—much like JavaScript\
    \ files that may not be needed before the page loads.\n\n| client | bar |\n|---|---|\n\
    | foo() | my_bar = null |\n| foo.bar() | my_bar = new bar() |\",\n\nFigure 6-13.\
    \ The Virtual Proxy pattern\n\nIn the lazy initialization pattern we check whether\
    \ the object exists (is it null?), and if it doesn't yet exist, we instantiate\
    \ it. This is probably the pattern that most people have used and never even realized\
    \ was lazy initialization. This pattern is most used when declaring objects or\
    \ namespaces in JavaScript. If our namespace exists, use it; if not, create it.\n\
    \n```\nif (obj == null) {\n  obj = new obj();\\}\n```\n\nreturn obj;\nThe final\
    \ value holder pattern is where we call a public function of an object to get\
    \ an instance of the object. The object is instantiated only on the first call\
    \ of the function. The value holder pattern is most commonly used as part of the\
    \ implementation of a singleton pattern.\n\n> Note Design patterns are core algorithmic\
    \ patterns that have been identified and named to create a vocabulary that describes\
    \ a simple vernacular the steps needed to solve complex problems. The seminal\
    \ work on design patterns is the original book Design Patterns: Elements of Reusable\
    \ Object-Oriented Software, by Erich Gamma, et.al. (Addison-Wesley-1994).\n\n\
    The idea of anti-patterns has been identified as well. Anti-patterns are the inverse\
    \ of design patterns, common, systemic repeatable mistakes that once identified\
    \ can be avoided. It is hugely useful to learn at least some of both."
