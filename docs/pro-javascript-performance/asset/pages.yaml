  md: "That's a 60% improvement for Chrome and a 93% improvement for Firefox, just\
    \ by using core JavaScript instead of JQuery.\n\n# The True Cost of Eval\n\nIf\
    \ you aren't familiar with eval, eval is a JavaScript native function that accepts\
    \ a string and executes the string as JavaScript. It basically fires up the interpreter\
    \ and allows the passed-in string to be parsed and interpreted at the time of\
    \ invocation.\n\nWe'll all heard that eval is evil and should be avoided at all\
    \ cost! The rationale is that it is potentially dangerous because it is essentially\
    \ injecting code directly to the interpreter, and that because the interpreter\
    \ is being accessed causes a hit on performance. It's good practice over the years\
    \ to avoid the use of eval. Even in the cases where it was accepted and commonplace,\
    \ to de-serialize JSON objects have standard solutions that don't use eval.\n\n\
    I would contend that code injection is a perfectly legitimate solution sometimes,\
    \ with a history that dates back to assembler in C for performance boosts and\
    \ low-level control. Having a console available in our browser that lets us execute\
    \ code client-side also neglects this aspect of the argument against eval.\n\n\
    But let's quantify the impact on performance this long held belief for ourselves.\
    \ Let's run a test that compares the run performance of passing a string that\
    \ contains a function to eval versus invoking the function directly.\n\nJust as\
    \ in previous tests, start with our basic HTML skeletal structure, with perfLogger:\n\
    \n```\n<!DOCTYPE html>\n<html><head>\n<meta charset=\"UTF-8\" />\n<title>cache\
    \ Location Comparison</title>\n<script src=\"/lab/perflogger.js\"></script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\nNext create a script tag in the body\
    \ and a function called getAvg. The getAvg function iterates from 0 to 200, each\
    \ consecutive number, and then averages it.\n\n```\n<script>\nfunction getAvg(){\n\
    \  var avg = 0;\n  for(var x = 0; x < 200; x++){\n    avg += x;\n  }\n  return(avg/200);\n\
    }\n</script>\n```\n\nCreate two functions, one that will convert the getAvg function\
    \ to a string and pass it to eval and store the return value in a variable, and\
    \ the other function will simply invoke the getAvg function and store the result:\n\
    \n1 http://blogs.msdn.com/b/ericlippert/archive/2003/11/01/53329.aspx"
  merge: -1
  pgno: 162
- img_proc: true
