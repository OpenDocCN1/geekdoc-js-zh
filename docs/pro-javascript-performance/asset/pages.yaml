    # Summary


    In this chapter you created a tool to gather the running time of ad hoc blocks
    of code, or benchmark passed-in functions through aggregating the running time
    of multiple iterations of code. You created a server-side script in PHP to which
    our library can send the results of these tests. Finally, you created an R script
    to pull out and test our results.


