  md: '# >>> performance.memory. jsHeapSizeLimit

    767557632


    For reference, the heap is the collection of JavaScript objects that the interpreter
    keeps in resident memory. In the heap each object is an interconnected node, connected
    via properties, like the prototype chain, or composed objects. JavaScript running
    in the browser references references the objects in the heap via object references,
    as demonstrated in Figure 5-7. When we destroy an object in JavaScript, what we
    are really doing is destroying the object reference. When the interpreter sees
    an object in the heap with no object references, it removes that object from the
    heap. This is called garbage collection.


    ![](img/a914f260cb5c9705eb1c32a679549219_99_0.png)


    Figure 5-7. the JavaScript Heap


    The usedJsHeapSize property shown in Figure 5-6 the amount of memory that all
    of the current objects are in the heap. The totalJsHeapSize is size of the heap
    including free space not used by objects.


    Because we need to launch the browser with command-line parameters to get these
    properties, this isn''t something that we can include in our library and put out
    in our production environment and hope to get real data from it. Instead it is
    we can monitor and run in our own lab for profiling purposes.


    Note Profiling allows us to monitor our memory usage. This is useful for detecting
    memory leaks, the creation of objects that get destroyed. Usually in JavaScript
    this occurs when we programmatically assign event handlers to DOM objects and
    forget to remove the event handlers. More nuanced than just detecting leakages,
    profiling is also useful for optimizing the memory usage of our applications over
    time. We should intelligently create, destroy, or reuse objects and always be
    mindful of scope to avoid profiling charts that trend upward in an ever-growing
    series of spikes. A much better profile chart shows a controlled rise and plateau.'
