    # Next Steps: From Practice to Practical Application


    Throughout the book so far we have creating tests and talking about looking at
    data that is being generated from these tests at scale. We now look at the tactics
    of doing this on the job.


    # Monitoring Web Performance


    This is fairly straightforward. You just need to choose a number of URLs that
    you want to monitor, plug them into PTWebRunner, and begin tracking their URLs
    over time.


    As you gather data you should review data with your team. Identify areas for improvement—are
    your images not optimized, is your content not gzipped, how can you minimize HTTP
    requests? Set performance goals and working toward those goals with your team.


    # Instrumenting Your Site


    The next thing you want to do, if you aren''t already doing so, is to instrument
    your site—to put benchmarking code in production to gather live performance data
    for your pages that are already out in the world.


    To do this, you just need to choose what pages you want to monitor, choose a set
    of metrics that you want to gather—the perceived time of the page, the runtime
    of the more complex pieces of functionality—and integrate perfLogger into those
    pages to capture data. Note that you probably don''t want to use the benchmark
    framework of perfLogger, since that will impact the performance of the pages,
    but use startLogging and stopLogging to capture information.


    I do this on my own site. In Figure 8-7 you can see a screenshot of my page with
    perfLogger deforming on the right side of the page.


    ![](img/a914f260cb5c9705eb1c32a679549219_192_0.png)


    Figure 8-7. The tom-barker.com with performance data drawn to the screen


    192'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# CHAPTER 8 ======= BALANCING PERFORMANCE WITH SOFTWARE ENGINEERING PRACTICES
    AND RUNNING IN PRODUCTION


    The benefit of putting instrumentation on our live sites is that we get live data
    from our users. We track this data over time and look for issues as conditions
    change—new browsers and browser versions introduced, new features promoted to
    production, and so on. Issues appear as spikes in performance numbers to indicate
    that something is suddenly running much slower, or even unexpected drops in performance
    numbers, which could indicate that your site might be unavailable to your users.
    Instrumenting your site is something that is as regular as maintenance of your.


    # Benchmark in Your Test Lab


    So we instrument our code in production and we monitor our performance regularly,
    how do we make sure our code performs before we release it? We benchmark in a
    test lab.


    A test lab can be a physical lab of workstations, or it can be one or two machines
    with virtual machines running them.


    If you have the scale, budget, and staff for a physical test, then that''s awesome!
    That''s how it''s done for real-world web applications. But for 7 out of the 12
    companies I''ve worked at, there was a pipe dream. My developers and I had to
    test and certify our code on our own machines. And in some cases it may be all
    that you need.


    In case your first order of business is to establish a browser support matrix—how
    else can you know what browsers and clients to enable if you don''t have a list
    of what you will support? The bare minimum browser support matrix is a list of
    browsers and versions and what level of support you will provide for those. In
    my own experience there are three levels of support—will provide support to an
    end user using this browser (Support in Production), should our QA team test with
    these browsers (Test in QA), and should engineers be conducting developer testing
    with these browsers, at least making sure that features function in these browsers
    (Developer Testing)? See Figure 8-8 for an example of this sort of browser matrix.


    | Browser | Support in Production | Test in QA | Developer Testing |

    | --- | --- | --- | --- |

    | IE 10 | N | Y | Y |

    | IE 9 | Y | Y | N |

    | IE 8 | Y | Y | N |

    | IE 7 | Y | N | Y |

    | Chrome 21b | N | Y | Y |

    | Chrome 20 | Y | Y | Y |

    | Chrome 19 | Y | Y | N |

    | Firefox Aurora | N | N | Y |

    | Firefox Beta | N | Y | Y |

    | Firefox 14 | Y | Y | N |

    | Firefox 13 | Y | Y | N |

    | Safari 5.5 | N | Y | Y |

    | Safari 5.0x | N | Y | N |


    Figure 8-8. A bare-minimum browser support matrix


    Ideally and eventually, though, your browser support matrix should include things
    like plug-ins, as well as a breakdown of features, because not every feature may
    work in every browser. See Figure 8-9 for a more robust browser support matrix.'
