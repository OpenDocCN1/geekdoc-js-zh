  md: '# CHAPTER 2 TOOLS AND TECHNOLOGY TO MEASURE AND IMPACT PERFORMANCE


    those things in a browser. Back then, if you had been used to the Integrated Development
    Environments (IDEs) for compiled languages, and thus accustomed to memory profiling
    and being able to debug your code at runtime and see the inside values and step
    through your logic, you would have been quite dismayed at the lack of tools for
    web development.


    But as useful as the console is, our concern now is the Net tab.


    # How to Use


    Network Monitoring in Firebug is a passive tool; you just click the Net tab—short
    for Network Monitoring—if this is the first time you click the tab, you will need
    to enable it) and navigate to a web page (my tom-barker.com in the following examples).
    As the page loads, you see all of the network assets load. This display is a waterfall
    chart (Figure 2-4).


    As introduced in Chapter 1, waterfall charts are a data visualization used to
    demonstrate the effects of essentially adding and removing elements in a system.
    They are used in the world of performance monitoring to demonstrate how the payload
    and load time of a page are influenced by components that make up page.


    Each bar in the waterfall is a remote piece of content that is part of the page,
    whether it is an image, a script, a SWF, or a web font. The bars are stacked sequentially
    top-to-down in order to list items. This shows in which process each item is downloaded—image
    A JS are downloaded, and so on—how long each piece takes to download. In addition
    to the bar, each row has columns to indicate the URL, the HTTP status, the source,
    the file size, and the remote IP address. The blue vertical line indicates when
    the document finished loading. The color coding of the bars indicates when in
    the process of connecting the particular asset is at a given time. The blue is
    for DNS lookup, the yellow is for connecting, the red is for sending, and the
    purple is for waiting for data, and the green is for receiving data.


    Below the Net tab is a navigation bar that allows you to filter the results in
    the waterfall chart. You can show all the content, only HTML, only JavaScript,
    only Ajax (called XHR for XML HTTP Request), only images, only Flash, or media
    files. See Figure 2-5 for my results filtered by JavaScript.


    ![](img/a914f260cb5c9705eb1c32a679549219_17_0.png)


    Figure 2-4. A waterfall chart in the Network Monitoring tab


