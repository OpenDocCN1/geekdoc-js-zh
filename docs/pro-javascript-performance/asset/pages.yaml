    # Summary


    This chapter took a deep dive into runtime performance, exploring concepts like
    taking variables and properties in other scope chains storing them locally to
    avoid the performance hit of retrieving across the scope stack.


    You learned the benefit of using pure JavaScript instead of frameworks for everything,
    and compared benchmark results from looping and DOM access using IQuery and JavaScript
    to prove the performance gain from doing so.


    One example quantified the cost of using eval() to directly invoking a function.
    This speaks to the performance benefit we get from functions as parameters of
    passing strings and passing them to eval. You also saw that eval might not be
    as evil as the long-standing belief.


    You saw the performance of queuing writes to the DOM, both updates to DOM elements
    and using DocumentFragment objects to queue latency in we get from adding new
    DOM elements.


    And finally we we the increase in latency from increasing the depth of nested
    loops. Chapter 8 talks about balancing performance with readability and modularity.'
