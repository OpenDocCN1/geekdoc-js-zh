    # RESPECTING THE DRY PRINCIPLE


    Let''s go down a tangent for a moment. I don''t know about you, but I''m tired
    of writing the same R code over and again with only slight variations just to
    get and chart our benchmarking results. In software engineering there is the concept
    known as the DRY principle: Don''t Repeat Yourself. It''s a primal, inherent thing,
    the concept that anything we need to do more than once we should automate. It
    was named and popularized in *The Pragmatic Programmer*, by Andy Hunt and Dave
    Thomas (Addison-Wesley 1999).'
  merge: -1
  pgno: 156
