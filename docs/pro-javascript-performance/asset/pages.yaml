  md: '# CHAPTER 7


    # Runtime Performance


    The last chapter explored ways to optimize web performance with JavaScript. You
    learned several ways to avoid external JavaScript block the parsing of the rest
    of the page. We looked at the async attribute, which is new to HTML 5, and at
    drawing script tags with JavaScript.


    You learned about the lazy pattern, and applied it to our example''s script tags,
    adding them to the page only after the page has loaded. We expanded that to apply
    to our CSS files; lazy loading our DOM files after the document has loaded.


    You ran tests for each of these scenarios; you captured data about each one and
    visualized runtime performance of the results.


    In this chapter we will now look at runtime optimizations in the browser. We will
    look at caching references across the scope chain to save time on look-ups. You
    will learn about using frameworks such as jQuery and compare the runtime performance
    of operations in jQuery and pure JavaScript. You''ll even try to quantify a long-held
    belief when using eval() performance. And the first chapter looks at how to streamline
    DOM interaction, and the incremental cost of nesting loops.


    Keep in mind that each browser uses a different JavaScript engine, runtime performance
    numbers can be different for each browser. For the examples we will look at in
    this chapter you will first write the code to test, using our perfLogger library,
    and then look at the perfLogger results in a single browser, and then put the
    code in a public place where you can crowd-source traffic to it or run it through
    our own browser - where you hit the many times from a number of different browsers.
    I''ll tell more about how to implement these changes in production next chapter.
    And finally we chart the difference in aggregate for each group browser.


    > Note Some of these tests you have results in the sub-millisecond range, for
    best results we will use browsers that support high-resolution time. Also remember
    that your results may vary based on the browsers that you test on or your clients
    use. As you''ll see in this chapter''s tests, each browser has varying degrees
    of efficiency in different areas of execution. The point of this chapter is to
    learn how to make your own tests and analyze those results, as browsers and client
    configurations change, to continually evaluate your best practices based on your
    end users.


    # Cache Variables and Properties across Scope


    The first optimization to consider is caching variables and object properties.'
