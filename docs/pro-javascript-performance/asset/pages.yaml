    # Summary


    This chapter explored the .performance object, a new standardized way from the
    W3C to gather performance metrics from the browser. We incorporated the Performance
    object into our existing perfLogger project, including the performance metrics
    in each test that we run, as well as building in support for window.performance''s
    high-resolution time, if the browser supports it.


    We used this new data to look at the overall web performance of our sites.


    We touched upon the emerging possibilities of looking at client machine memory
    usage from a browser, specifically Chrome''s implementation, and a brief look
    at how to get Firefox to expose similar data.


    The next chapter will take a look at optimizing web performance; you will run
    multivariate tests with the tools we''ve developed to look at the results of our
    optimizations.'
