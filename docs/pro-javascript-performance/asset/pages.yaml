    # CONDITIONAL COMPILATION


    Conditional compilation is a feature of some languages that traditionally allows
    the language compiler to produce different executable code based on conditions
    specified at compile time. This is somewhat of a misnomer for JavaScript because,
    of course, JavaScript is interpreted, not compiled (it doesn''t run at the kernel
    level but in the browser), but the idea translates.


    Conditional compilation allows for writing JavaScript that will only be interpreted
    if specific conditions are met. By default conditional compilation is turned off
    for JScript; we need to provide an interpreter-level flag to turn it on: @cc_on.
    If we are going to write conditionally compiled JavaScript, we should wrap it
    in comments so that our code doesn''t break in other JavaScript interpreters that
    don''t support conditional compilation.


    An example of JScript conditional compilation is


    ```

    <script>

    var useAX = false; // use ActiveX controls default to false

    /*@cc_on

    @if (@win32)

    useAX = true;

    @end

    */

    </script>

    ```'
