  md: "# CHAPTER 7 RUNTIME PERFORMANCE\n\nLet's respect the DRY principle and automate\
    \ this bit of R code that we've been writing and rewriting to fit our needs for\
    \ each test.\n\nMake a function called PlotResultofTestsByBrowser and pass in\
    \ three values to this function: testList, a vector of test names, browserlist,\
    \ a vector of browsers, and descr, a string that will be the header chart:\n\n\
    ```\nPlotResultofTestsByBrowser <- function(testList, browserlist, descr){\n```\n\
    \n\nWithin the function, declare an empty data frame, which you will use to hold\
    \ the averages, and an empty list, which you will use to construct the column\
    \ names of the data frame:\n\n```\ndf <- data.frame()\ncolname <- c(c)\n```\n\n\
    Next, the function steps through each browser in browserlist, and within that\
    \ loop iterates through each test in testList. Within the inner loop the code\
    \ constructs the column name for the particular Test/Browser combination that\
    \ we are on and pushes that into columnNameList. To make sure that the test fits\
    \ in our chart, truncate the name to only ten characters.\n\nCall ParseResultsTestID\
    \ and pass in the current test name; then pass that value to getDFByBrowser with\
    \ the current browser name, and get the mean of returned value and store it in\
    \ a temporary variable you can call tmp. Finally add tmp to your data frame:\n\
    \n```\nfor(browser in browserList){\n  for(test in testList){\n    columnList\
    \ <- c(columnList, paste(\"\\n\", substr(test, 1,10)))\n    tmp <- mean(getDFByBrowser(ParseResultsTestID(test),\
    \ browser)$RunTime)\n    df <- rbind(df, tmp)\n  }\nn\n```\n\nThis functionality\
    \ will step through each test and browser combination until it constructs a data\
    \ frame like something like the following:\n\n+   > df\n\n```\nX0.0050476189047619\n\
    1 0.00505\n2 0.02979\n3 0.00125\n4 0.00716\n```\n\nThat's great; that's what we\
    \ want. From there all you need to do is transpose the data frame.\n\n```\ndf\
    \ <- t(df)\n```"
