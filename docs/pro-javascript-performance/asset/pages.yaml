    There are many ways to refine this if you wanted. You could abstract the generating
    and

    exporting of the chart to a function.


    Or you could use a native function of R called apply() to derive the difference
    instead of looping

    the vector. Let''s take a look at right now like this:


    # Using apply()


    The apply() function allows us to apply a function to elements in a vector. It
    takes several parameters; first is

    a list of values, a next number to indicate how we apply the function through
    the list (1 is for rows, 2

    for columns, and (1,2) indicates both rows and columns), and finally the function
    to apply to the list:


    ```

    apply(list, [how to apply function], [function to apply])

    ```


    We could eliminate the getPercent improved function and use the following:


    ```

    diff <- apply(as.matrix(size), 1, function(x) 100 - (x / 2150)*1000

    ```


    Note that this converts the size variable into a matrix as we pass it to apply().
    This is because apply()

    expects matrices, arrays, or data.frames. The apply() function has a derivative
    apply() that you could use

    well.


    When using your code is cleaner, and it uses the language as it was intended,
    it adheres to the

    philosophy of language, meaning that it is more logical programming with statistical
    analysis

    than imperative programming. The updated code should now look like this:


    ```

    originalSize <- 2150

    toc <- c("VUI", "Closure Compiler (simple)", "Minify", "Closure Compiler (advanced)")

    size <- c(1638, 573, 0)

    diff <- apply(as.matrix(size), 1, function(x) 100 - (x / originalSize)*1000

    mincompare <- data.frame(diff, size, row.names=tool)

    ```


    ```

    pdf("Figure 2-19.pdf")

    opar <- par(no.readonly=TRUE)

    par(las=1, mar=c(10,10,10,10))

    barplot(mincompare$diff, horiz=TRUE, names.arg=row.names(mincompare), main="Percent
    of file

    size reduction by product")

    op(opar)

    dev.off()

    ```


