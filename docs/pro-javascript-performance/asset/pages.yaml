    OK. You''re instrumenting your production code, monitoring the web performance
    of your pages in production, and benchmarking the code in a test lab using your
    browser matrix. What now?


    # Share Your Findings


    Benchmarking, instrumenting, and monitoring are great, but if you don''t tell
    anyone, what is the point? Share your findings with your team. But first analyze
    your data—I mean really understand your data so that you can speak to each data
    point and have an idea about the cause or implication of each finding.


    Use the data visualization skills that you have been refining throughout the course
    of the book to generate charts, assemble the charts into a report, and share your
    analysis. Play with different types of charts to see which ones communicates most
    your point.


    Have an open mind, and consider what you are missing that could explain a larger
    picture? Get second opinions and double-check your tests. Maybe the test you are
    benchmarking is flawed in some way, like an improperly scoped variable throwing
    off your results.


    Once you have your findings double-checked your analysis complete, and your charts
    created, you should assemble your results into a report, maybe an email, maybe
    a PDF maybe a wiki entry; it just needs


    201'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# CHAPTER 8 BALANCING PERFORMANCE WITH SOFTWARE ENGINEERING BEST PRACTICES
    AND RUNNING IN PRODUCTION


    to be something in which you can include not just your graphs but your analysis
    and context as well, and that can be distributed.


    Review your report with your team, go over root causes, and come up with a plan
    of attack to address the areas for improvement. Above all strive to improve.


    # Balancing


    In this chapter we explored some closing thoughts about performance. We talked
    about balancing performance with keeping the best practices of readability, reuse,
    and modularity. We looked at scorched-earth performance practices. We coalescing
    them into a single function to reduce overhead that the JavaScript interpreter
    must go through to construct and execute object hierarchy. We created a test to
    compare the runtime performance of inlining functions versus functions versus
    using objects.


    While we saw performance gains with this scorched-earth performance practice,
    we also lost the gains of modularity, readability, and reusability that good software
    design gives us.


    We also looked at running our code through Google''s Closure Compiler. We saw
    significant performance benefits. We made our code much harder to debug, and would
    add a more difficult layer of abstraction to maintain and update.


    The point of these two examples was not just the raw numbers, it was that in all
    things we do must strive to find balance. Performance is immensely important,
    but there are other aspects of quality just as important, if not more so.


    We also talked about how to implement the things that we have learned. We discussed
    monitoring the web performance of our production sites using WPTRuner. We talked
    about using perfLogger to instrument our code in the wild. We talked about assembling
    a browser support matrix and creating a test lab to benchmark our code in our
    test lab.


    And finally we talked about the importance of sharing our data; using our findings
    as a feedback loop to identify areas of improvement in our continual quest to
    be excellent.


