- "# JavaScript 智能学习法：利用技术将学习量减半的新方法\n\n## 我如何提议利用技术将你的努力减半\n\n当你开始学习像 JavaScript\
  \ 这样复杂的东西时，你就要承担起沉重的认知负担。如果非要猜测的话，我会说自学一门语言这个项目至少会消耗一大车花园推车那么多的脑葡萄糖。但你可能没有意识到的是：当你自学时，你的认知负担会加倍。\n\
  \n是的，如果作者写得好，所有信息都在书里。但学习一门语言远不止阅读一些信息。你需要将信息牢记于心，这需要某种计划。你需要练习。你打算如何组织这些？而且你需要某种方法在偏离轨道时纠正自己。由于书籍并不是帮助你完成这些任务的最佳方式，大多数作者甚至不会尝试。这意味着所有为自己设计学习路径的工作都留给了你。而这种\
  \ DIY 的元学习，这种如何掌握书中内容的挣扎，比学习本身还要费力。\n\n传统上，现场讲师弥合了阅读和学习之间的鸿沟。如果你有时间并且负担得起，参加全面的课程或与导师一对一学习仍然是学习\
  \ JavaScript 的最佳方式。但是，既然很多人更喜欢自学，为什么不利用最新的技术作为替代教师呢？让书来阐述原理。然后使用交互式程序进行记忆、练习和纠正。当计算机参与进来时，你将用一半的努力，以两倍的速度学习。这是一种更聪明的学习\
  \ JavaScript 的方式。这是一种更聪明的学习任何东西的方式。\n\n\n\n\n\n# 优化学习体验\n\n既然我们正在拥抱新技术，为什么不利用所有能到手的技术来优化书籍呢？旧技术——即纸质书——从教学角度来看有严重的局限性。新技术——即电子书——是未来的方向，原因有很多。以下列举几点：\n\
  \n色彩是一种极好的信息工具。这就是为什么交通信号灯会使用它。但在纸上印刷彩色会使成本成倍增加。由于高昂的制版费用，在按需印刷的书中印上“色彩”这个词，零售价就要增加三十美元。因此，彩色通常被排除在外，否则书籍就会被定价为奢侈品。而在电子书中，色彩是免费的。\n\
  \n纸张本身就很昂贵，所以通常没有空间容纳作者想做的所有事情。详细讨论细微之处？别想了。对难点提供额外帮助？负担不起。数百个示例？最好删掉一些。但电子书没有这种限制。额外增加一百页数字内容要花多少钱？通常分文不花。\n\
  \n当一本书以传统方式出版时，从手稿到印刷可能需要长达一年的时间。这意味着没有时间对目标读者进行广泛测试，也没有时间进行测试必然建议的修订。而且一旦书籍印刷出版，发行修订版就是一项昂贵的大工程。出版商会尽可能推迟。读者反馈通常需要数年才能带来改进。而电子书可以在一天内从手稿变成书籍，留下大量时间进行测试和修订。出版后，基于读者反馈的改进版新版本可以按作者意愿频繁推出，且无需成本。\n\
  \n有了这些优势，难道还有人怀疑所有最好的教学书籍都将是电子书吗？难道还有人否认，作者除了以电子形式出版一本好书之外，能为你做的最有帮助的事情，就是承担全部教学任务（而不仅仅是部分），通过增加互动性来帮助你记忆、练习和纠错吗？\n\
  \n## 为 JavaScript 提出的学习方法\n\n那么，以下就是我提议如何利用当前技术，帮助你用一半的时间和一半的精力学习 `JavaScript`。\n\
  \n*   `认知分块控制`。测试告诉我，在进行高强度学习时，即使是意志坚定的人也会比我预想的更快感到疲劳。你可能能一口气读两小时小说，但当你学习全新且复杂的内容时，情况就完全不同了。我的测试显示，学习新材料大约十分钟是大多数学习者开始疲劳前的极限。但好消息是：即使你在学习十分钟后进入了疲劳区，你仍然有足够的脑力进行长达三十分钟的练习。设计得当的练习比学习更省力，却能教你更多。少读多练是学习最快的方法。\n\
  *   `500 个编码示例`，涵盖你所学内容的方方面面。示例让概念易于掌握，并将你的注意力集中在每章涵盖的关键材料上。代码中嵌入的颜色提示有助于你记住规则。我是不是做得过火，放了比你需要的更多的示例？好吧，如果内容对你来说太简单，跳过一些就行。\n\
  *   `在初学者身上测试过`。本书包含多轮基于编程初学者反馈的修订。它包含了额外的帮助性讨论，以澄清在测试中被证明是绊脚石的概念。测试者中包括我那位对技术恐惧的妻子，她发现，在良好的指导下，她也能编程——并且惊讶地发现自己乐在其中。同样，我自己也有几个意外发现。一些对我来说简单的东西，对某些读者来说却并不简单。于是进行了重写。\n\
  *   `每章配有免费的交互式编码练习——总共 1750 个`。测试者表示，这是对他们帮助最大的功能。这并不意外。据《纽约时报》报道，心理学家“已经证明，进行一次测试——比如，写下你能记住的某段已学散文的所有内容——可以比进一步学习更深刻地加深对那段文章的记忆。”我敢说，在学习编程时，效果会加倍。读完每章后，上网练习你学到的所有内容。每章末尾都有一个链接，指向其配套的在线练习。所有练习的索引可在\
  \ `http://www.ASmarterWayToLearn.com/js/` 找到。\n*   `实时编码体验`。在脚本编写中，最好的回报就是看到你的代码完美运行。大多数练习环节都包含实时编码练习，让你在浏览器中看到脚本的执行。\n\
  \n## 如何使用本书\n\n这本书和你以前拥有的任何书都不太一样，所以一份简短的使用说明可能会有所帮助。\n\n*   `学习、练习、然后休息`。如果你决心掌握\
  \ `JavaScript` 的基础知识，而不仅仅是感受一下这门语言，那么请以 15 到 30 分钟为一个单元使用本书和在线练习，然后休息一下。花 5 到 10\
  \ 分钟学习一章。立即前往 `http://www.ASmarterWayToLearn.com/js` 在线编码 10 到 20 分钟，练习所学内容，直到你正确完成所有编码。然后去散散步。\n\
  *   `使用最大、最彩色的屏幕`。本书可以在小手机屏幕和单色阅读器上阅读，但如果你在更大的屏幕上看到彩色内容，你会更开心。我将颜色作为重要的教学工具，所以如果你在黑白模式下阅读，你就牺牲了全彩电子书的一些额外教学价值。彩色元素在某些黑白屏幕上会显示为较浅的色调，在这些设备上效果并非完全丧失，但全彩更好。至于在大屏幕上阅读——本书包含超过\
  \ 2000 行示例代码。小屏幕会将长代码行分割成尴尬、随意的片段，打乱格式。虽然仍可辨认，但代码变得更难阅读。如果你的移动设备不适合阅读本书，可以考虑在笔记本电脑上安装免费的\
  \ Kindle 阅读应用。\n*   `如果在移动设备上阅读，请横屏`。出于某种原因，我在 iPad 上除非看视频，否则会抗拒这样做。但即使是我这个“竖屏狂”，在审校本书时也会将平板切换到横屏模式。所以请：从第\
  \ 1 章开始，帮自己一个忙，旋转你的平板、阅读器或手机，让文本行更长。这有助于避免上面提到的令人不快的代码混乱。\n*   `在实体键盘上做编码练习`。移动设备可能非常适合阅读，但绝不是编码的方式。极少数\
  \ Web 开发者会尝试在手机上工作。学习编码也是如此。理论上，大多数交互式练习可以在移动设备上完成。但这个想法似乎太不合理，以至于我禁用了平板、阅读器和手机上的在线练习。如果你愿意，可以在移动设备上阅读本书。但请在笔记本电脑上练习。\n\
  \n\n\n\n\n*   **如果你有权威问题，试着克服它。** 当你开始做练习时，你会发现我可能会在坚持让你把每个小细节都做对这件事上显得很烦人。例如，如果你缩进一行时少了一个空格而不是两个，监控你工作的程序会告诉你代码不正确，尽管它实际上仍然可以完美运行。我坚持一切都必须精确无误，是因为我有控制欲吗？不，是因为我必须限制无害的标新立异行为，以便实现练习的自动化。如果我给予你你可能想要的那么多自由，那么创建检查你工作的算法对我来说将是一个堪比无人驾驶汽车级别的项目。此外，学会以极其精确的方式编写代码有助于你学会密切关注细节，这是任何语言编码的基本要求。\n\
  *   **暂时接受我的格式偏好。** 当前的代码格式就像十七世纪的拼写。每个人都按自己的方式做。没有普遍接受的标准。但是，当你做交互式练习时，检查你工作的算法需要标准。它们不能像人类老师那样给予你自由度，因为，说实话，它们没那么聪明。所以我不得不确定某些约定。我所教授的所有约定都被编码社区中的很大一部分人所接受，所以你会与大家保持一致。但这并不意味着你将永远被我的格式偏好束缚。当你开始编码项目时，你很快就会形成自己的观点，或者加入一个有风格指南的组织。在那之前，我会要求你让你的代码看起来像我的代码。\n\
  *   **如有任何问题或疑问，请给我发电子邮件。** 这本书和练习已经在许多学习者身上测试过，但还没有在你身上测试过。如果你遇到困难，或者只是对某事感到好奇，或者我以某种方式让你感到困扰，请给我发电子邮件至\
  \ `mark@ASmarterWayToLearn.com`。我很高兴收到你的来信。我会及时回复。而且，在你的帮助下，我可能会学到一些东西，从而改进下一版。\n\
  \n# 1 警告框\n\n警告框是一个弹出窗口，用于向用户显示消息。以下是显示消息“感谢您的输入！”的警告框代码：\n\n```javascript\nalert(\"\
  Thanks for your input!\");\n```\n\n`alert` 是一个关键字——即对 JavaScript 有特殊含义的词。它的意思是：“在警告框中显示后面的消息。”注意\
  \ `alert` 不大写。如果你大写，脚本将停止运行。\n\n括号是 JavaScript 的特殊要求，你很快就会习惯。你将在各种 JavaScript 语句中反复输入括号。\n\
  \n在编码中，带引号的文本 `\"Thanks for your input!\"` 被称为文本字符串或简称为字符串。这个名称很合理：它是一串用引号括起来的字符。在编码世界之外，我们只会称之为引文。\n\
  \n注意左括号紧贴着关键字，左引号紧贴着左括号。由于 JavaScript 忽略空格（文本字符串除外），你可以写成……\n\n```javascript\nalert\
  \ ( \"Thanks for your input!\" );\n```\n\n但我希望你了解 JavaScript 的风格约定，所以我要求你始终省略括号前后的空格。\n\
  \n在英语中，细心的作者会在每个陈述句末尾加句号。在脚本中，细心的编码者会在每个语句末尾加分号。（有时，复杂的、类似段落的语句以花括号而不是分号结尾。这将在后面的章节中介绍。）分号并非总是必需的，但更容易的做法是在每个语句末尾加分号，而不是停下来判断是否需要。在本训练中，我要求你在每个不以花括号结尾的语句末尾加分号。\n\
  \n![](img/00001.jpeg)\n\n*   有些编码者写 `window.alert` 而不是简单的 `alert`。这是一种非常正式但完全正确的写法。大多数编码者更喜欢简短形式。在本训练中，我们将坚持使用简短形式。\n\
  *   在上面的例子中，有些编码者会使用单引号而不是双引号。只要成对匹配，这是合法的。但在这种情况下，我要求你使用双引号。\n\n本章的交互式编码练习请访问：\n\
  [`www.ASmarterWayToLearn.com/js/1.html`](http://www.ASmarterWayToLearn.com/javascript/1.html)\n\
  \n# 2 字符串变量\n\n请记住以下事实。\n*   我的名字是 Mark。\n*   我的国籍是美国。\n\n现在你已经记住了我的名字和国籍，我就不必再逐字重复了。如果我对你说：“你可能认识其他和我同名的人”，你会知道我在指“Mark”。\n\
  \n如果我问你我的国籍是否和你的一样，我就不必问：“你的国籍和美国一样吗？”我会问：“你的国籍和我的国籍一样吗？”你会记得当我说“我的国籍”时，我指的是“美国”，然后你会将你的国籍与“美国”进行比较，即使我没有明确说出“美国”。\n\
  \n在这些例子中，“我的名字”和“我的国籍”这两个术语的工作方式与 JavaScript 变量相同。我的名字是一个指代特定值 `\"Mark\"` 的术语。同样，变量是一个指代特定值的词。\n\
  \n当你写 `var`（表示变量）后跟你选择的名字时，就创建了一个变量。当你将值赋给它时，它就具有了特定的值。这是一个 JavaScript 语句，它创建了变量\
  \ `name` 并将值 `\"Mark\"` 赋给它。\n\n```javascript\nvar name = \"Mark\";\n```\n\n现在变量\
  \ `name` 指向文本字符串 `\"Mark\"`。\n\n注意，我选择把它叫做 `name`。我也可以叫它 `myName`、`xyz`、`lol` 或其他名字。在一定的限制内，如何命名变量由我决定。\n\
  \n将字符串 `\"Mark\"` 赋给变量 `name` 后，我的 JavaScript 代码就不必再指定 `\"Mark\"`。每当 JavaScript\
  \ 遇到 `name` 时，它就知道这是一个指向 `\"Mark\"` 的变量。\n\n例如，如果你让 JavaScript 打印 `name`，它会记住 `name`\
  \ 所指向的值，并打印……\n\n`Mark`\n\n变量所指向的值可以改变。\n\n让我们回到最初的例子，我要求你记住的那些事实。这些事实可以改变，如果改变了，那么“我的名字”和“我的国籍”这两个术语将指向新的值。\n\
  \n我可以去法院把名字改成 Ace。那么我的名字就不再是 Mark。如果我想要你正确地称呼我，我必须告诉你我的名字现在是 Ace。在我告诉你之后，你就会知道我的名字不再指向它之前指向的值（`Mark`），而是指向一个新值（`Ace`）。\n\
  \n如果我把国籍转到英国，我的国籍就不再是美国，而是英国。如果我想要你知道我的国籍，我必须告诉你它现在是英国。在我告诉你之后，你就会知道我的国籍不再指向原来的值\
  \ `\"U.S.\"`，而是指向一个新值。\n\nJavaScript 变量也可以改变。\n\n如果我编码……\n\n```javascript\nvar name\
  \ = \"Mark\";\n```\n\n`name` 指向 `\"Mark\"`。然后我接着编码一行……\n\n```javascript\nname =\
  \ \"Ace\";\n```\n\n在我编码新行之前，如果我让 JavaScript 打印 `name`，它会打印……\n\n`Mark`\n\n但那是过去。现在如果我让\
  \ JavaScript 打印 `name`，它会打印……\n\n`Ace`\n\n一个变量可以有任意数量的值，但一次只能有一个。\n\n你可能想知道，为什么在上面的语句中，将\
  \ `\"Ace\"` 赋给 `name` 时，关键字 `var` 不见了。这是因为该变量已经在之前将 `\"Mark\"` 赋给它的原始语句中声明过了。记住，`var`\
  \ 是创建变量的关键字——即声明变量的关键字。一旦变量被声明，你就不必再次声明它。你可以直接将新值赋给它。\n\n你可以在一个语句中声明一个变量，使其未定义。然后在后面的语句中给它赋值，而无需再次声明。\n\
  \n```javascript\nvar nationality;\n```\n\n\n\n\n\n```javascript\nnationality = \"\
  U.S.\";\n```\n\n在上面的例子中，赋值语句紧跟在声明语句之后。但这两条语句之间可以插入任意数量的代码，只要声明语句在前即可。事实上，并没有规定说你*必须*为已声明的变量赋值。\n\
  \nJavaScript 变量名对 JavaScript 本身没有内在含义。\n\n在英语中，单词是有含义的。你不能随意使用任何单词来交流。我可以说“My name\
  \ is Mark”，但如果我想让别人理解，我就不能说“My floogle is Mark”。那是毫无意义的。\n\n但对于变量，JavaScript 对语义是盲目的。你*可以*使用任何单词（只要不违反变量命名规则）。从\
  \ JavaScript 的角度来看……\n\n```javascript\nvar floogle = \"Mark\";\n```\n\n……和下面的代码一样有效……\n\
  \n```javascript\nvar name = \"Mark\";\n```\n\n如果你编写……\n\n```javascript\nvar floogle\
  \ = \"Mark\";\n```\n\n……然后让 JavaScript 打印 `floogle`，JavaScript 会打印……\n\n`Mark`\n\
  \n在一定范围内，你可以随意命名变量，JavaScript 不会在意。\n\n```javascript\nvar lessonAuthor = \"Mark\"\
  ;\nvar guyWhoKeepsSayingHisOwnName = \"Mark\";\nvar x = \"Mark\";\n```\n\n尽管 JavaScript\
  \ 对含义视而不见，但在变量命名时，你仍然希望赋予变量有意义的名称，因为这有助于你和其他的编码人员理解你的代码。\n\n再次强调，变量和文本字符串之间的语法区别在于：变量从不放在引号内，而文本字符串总是放在引号内。\n\
  \n总是这样写……\n\n```javascript\nvar lastName = \"Smith\";\nvar cityOfOrigin = \"New\
  \ Orleans\";\nvar aussieGreeting = \"g'Day\";\n```\n\n如果是一个字母或单词，且没有放在引号内，也不是像 `alert`\
  \ 这样对 JavaScript 有特殊含义的关键字，那么它就是变量。\n\n如果是一些放在引号内的字符，那么它就是*文本字符串*。\n\n如果你还没注意到，让我指出变量与等号之间、等号与值之间的空格。\n\
  \n```javascript\nvar nickname = \"Bub\";\n```\n\n这些空格是风格选择，而非语法要求。但我要求你在练习题的代码中都包含它们。\n\
  \n在上一章中，你学会了编写……\n\n```javascript\nalert(\"Thanks for your input!\");\n```\n\n当代码执行时，会显示一个消息框，内容为“Thanks\
  \ for your input!”\n\n但如果你改为编写以下两条语句：\n\n```javascript\nvar thanx = \"Thanks for\
  \ your input!\";\nalert(thanx);\n```\n\n上面的代码没有将文本字符串直接放在 `alert` 语句的括号内，而是将文本字符串赋值给一个变量。然后将变量（而非字符串）放在括号内。由于\
  \ JavaScript 总是用变量的值来替换变量，因此 JavaScript 显示的不是变量名 `thanx`，而是它所引用的文本“Thanks for your\
  \ input!”。同样的提示框“Thanks for your input!”会显示出来。\n\n本章的交互式编码练习请访问：\n[`www.ASmarterWayToLearn.com/js/2.html`](http://www.ASmarterWayToLearn.com/javascript/2.html)\n\
  \n## 数字变量\n\n你可以赋给变量的不仅仅是字符串，还可以是数字。\n\n```javascript\nvar weight = 150;\n```\n\n\
  编写了上面的语句后，每当你在代码中写 `weight` 时，JavaScript 就知道你指的是 `150`。你可以在数学计算中使用这个变量。\n\n如果你让\
  \ JavaScript 将 25 加到 `weight` 上……\n\n`weight + 25`\n\n……JavaScript 会记住 `weight`\
  \ 指的是 `150`，并得出总和 `175`。\n\n与字符串不同，数字不放在引号内。这样 JavaScript 就知道它是一个可以进行数学运算的数字，而不是像邮政编码那样作为文本处理的字符串。\n\
  \n但是，既然它没有放在引号内，JavaScript 怎么知道它不是变量呢？因为数字（或以数字开头的任何字符组合）不能用作变量名。如果是数字，JavaScript\
  \ 会将其排除在变量之外。所以它一定是数字。\n\n如果你将数字放在引号内，它就成了字符串。JavaScript 无法对其进行加法运算。它只能对没有放在引号内的数字进行加法运算。\n\
  \n现在看这段代码。\n\n```javascript\nvar originalNum = 23;\nvar newNum = originalNum + 7;\n\
  ```\n\n在上面的第二条语句中，当 JavaScript 遇到变量 `originalNum` 时，它会用数字 `23` 替换。它将 `7` 加到 `23`\
  \ 上，并将结果 `30` 赋值给变量 `newNum`。\n\nJavaScript 也可以处理完全由变量组成的表达式。例如……\n\n```javascript\n\
  var originalNum = 23;\nvar numToBeAdded = 7;\nvar newNum = originalNum + numToBeAdded;\n\
  ```\n\n变量可以用于计算自身的新值。\n\n```javascript\nvar originalNum = 90;\noriginalNum = originalNum\
  \ + 10;\n```\n\n如果你将数字放在引号内，然后加上 7……\n\n```javascript\nvar originalNum = \"23\"\
  ;\nvar newNum = originalNum + 7;\n```\n\n……这不会起作用，因为 JavaScript 不能对字符串和数字求和。JavaScript\
  \ 将 `\"23\"` 解释为一个单词，而不是数字。在第二条语句中，它不会将 `23 + 7` 加起来得到 `30`。它会做一些可能让你惊讶的事情。我将在后续章节中告诉你。现在，你只需要知道放在引号内的数字不是数字，而是字符串，JavaScript\
  \ 无法对其进行加法运算。\n\n请注意，任何特定的变量名都可以是数字变量或字符串变量的名称。从 JavaScript 的角度来看，名称本身并不表示它是哪种变量。实际上，一个变量可以一开始是一种类型，然后变成另一种类型。\n\
  \n你注意到下面代码中的新内容了吗？\n\n```javascript\nvar originalNumber = 23;\nvar newNumber = originalNumber\
  \ + 7;\n```\n\n这条语句将*数学运算的结果*赋值给变量 `newNumber`。当然，这个运算的结果*是*一个数值。\n\n这个例子在数学表达式中混合使用了变量和字面量数字。但你也可以只使用数字或只使用变量。对\
  \ JavaScript 来说都一样。\n\n我已经告诉过你，变量名不能以数字开头。下面的语句……\n\n```javascript\nvar 1stPresident\
  \ = \"Washington\";\n```\n\n……是非法的，因为变量名开头有 `\"1\"`。\n\n但是，你*可以*在变量名中包含数字，只要它们不在开头。下面的语句……\n\
  \n```javascript\nvar prezWhoCame1st = \"Washington\";\n```\n\n……是合法的。\n\n方便的是，如果你在提示框中指定一个数字而不是字符串……\n\
  \n```javascript\nalert(144);\n```\n\n……或者指定一个代表数字的变量作为提示框消息……\n\n```javascript\n\
  var caseQty = 144;\nalert(caseQty);\n```\n\n……JavaScript 会自动将其转换为字符串并显示。\n\n本章的交互式编码练习请访问：\n\
  [`www.ASmarterWayToLearn.com/js/3.html`](http://www.ASmarterWayToLearn.com/javascript/3.html)\n\
  \n## 变量名的合法与非法\n\n你已经学习了关于变量命名的三条规则：不能放在引号内；名称不能是数字或以数字开头；不能是 JavaScript 的任何关键字——那些作为编程指令的特殊单词，比如\
  \ `alert` 和 `var`。\n\n以下是其余规则：\n\n*   变量名不能包含空格。\n*   变量名只能包含字母、数字、美元符号和下划线。\n*\
  \   虽然变量名不能是 JavaScript 的关键字，但可以*包含*关键字。例如，`userAlert` 和 `myVar` 是合法的。\n*   大写字母没问题，但要小心。变量名区分大小写。`rose`\
  \ 不是 `Rose`。如果你将字符串 `\"Floribundas\"` 赋值给变量 `rose`，然后向 JavaScript 询问 `Rose` 的值，你会得到空结果。\n\
  \n\n\n\n\n## 命名约定\n\n我教授的是 `camelCase` 命名约定。为什么叫“camelCase”？因为如果名称由多个单词组成，中间会有一个或两个（或三个）驼峰。`camelCase`\
  \ 名称以小写字母开头。如果名称中有多个单词，每个后续单词的首字母大写，形成一个驼峰。如果你只用一个单词来构成变量名，比如 `response`，就没有驼峰。那是一头没食物的骆驼。请采用\
  \ `camelCase` 约定。它会让你的变量名更具可读性，并且你不太容易混淆变量名。\n\n示例：\n`userResponse`\n`userResponseTime`\n\
  `userResponseTimeLimit`\n`response`\n\n让你的变量名具有描述性，这样当三周或一年后你或其他人再回来看代码时，更容易理解代码的含义。通常，`userName`\
  \ 比 `x` 好，`faveBreed` 比 `favBrd` 好，尽管较短的名称完全合法。不过，你需要在可读性和简洁性之间取得平衡。`bestSupportingActressInADramaOrComedy`\
  \ 虽然清晰明了，但对大多数人来说可能过于冗长，不便输入或阅读。我会把它缩短。\n\n本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/4.html`](http://www.ASmarterWayToLearn.com/javascript/4.html)\n\
  \n## 数学表达式：熟悉的运算符\n\n在任何可以使用数字的地方，你都可以使用数学表达式。例如，你熟悉下面这种语句：\n\n```javascript\nvar\
  \ popularNumber = 4;\n```\n\n但你也可以这样写：\n\n```javascript\nvar popularNumber = 2 +\
  \ 2;\n```\n\n你还可以写：\n\n```javascript\nalert(2 + 2);\n```\n\n这会在警告框中显示消息“4”。当 JavaScript\
  \ 看到数学表达式时，它总是会进行计算并返回结果。\n\n下面是一条从 12 中减去 24 的语句，将 -12 赋值给变量：\n\n```javascript\n\
  var popularNumber = 12 - 24;\n```\n\n这条语句将 3 乘以 12 的乘积 36 赋值给变量：\n\n```javascript\n\
  var popularNumber = 3 * 12;\n```\n\n在这条语句中，数字 10 被赋值给一个变量。然后给该变量加 1，并将和 210 赋值给第二个变量。和往常一样，你可以混合使用变量和数字：\n\
  \n```javascript\nvar num = 10;\nvar popularNumber = num + 200;\n```\n\n你也可以只使用变量：\n\
  \n```javascript\nvar num = 10;\nvar anotherNum = 1;\nvar popularNumber = num + anotherNum;\n\
  ```\n\n我一直在使用的算术运算符 `+`、`-`、`*` 和 `/` 对你来说无疑很熟悉。下面这个可能不常见：\n\n```javascript\nvar\
  \ whatsLeftOver = 10 % 3;\n```\n\n`%` 是取模运算符。它不会给出一个数除以另一个数的结果，而是给出除法执行后的余数。\n\n\
  如果一个数能被另一个数整除，取模运算返回 0。在下面的语句中，0 被赋值给变量：\n\n```javascript\nvar whatsLeftOver = 9\
  \ % 3;\n```\n\n本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/5.html`](http://www.ASmarterWayToLearn.com/javascript/5.html)\n\
  \n## 数学表达式：不熟悉的运算符\n\n有几个专门的数学表达式你需要了解。这是第一个：\n\n```javascript\nnum++;\n```\n\n\
  这是以下写法的简写：\n\n```javascript\nnum = num + 1;\n```\n\n它将变量递增 1。递减则使用减号而不是加号：\n\n```javascript\n\
  num--;\n```\n\n你可以在赋值语句中使用这些表达式。但结果可能会让你惊讶：\n\n```javascript\nvar num = 1;\nvar\
  \ newNum = num++;\n```\n\n在上面的例子中，`num` 的原始值被赋给 `newNum`，然后 `num` 才递增。如果第一条语句中 `num`\
  \ 初始赋值为 1，那么第二条语句将其值增加到 2。`newNum` 得到 `num` 的原始值 1。\n\n如果将加号放在变量前面，结果会不同：\n\n```javascript\n\
  var num = 1;\nvar newNum = ++num;\n```\n\n在上面的语句中，`num` 和 `newNum` 最终的值都是 2。\n\n\
  如果将减号放在变量后面，新变量被赋予原始值，而第一个变量被递减：\n\n```javascript\nvar num = 1;\nvar newNum = num--;\n\
  ```\n\n`num` 递减为 0，`newNum` 得到 `num` 的原始值 1。\n\n但如果将减号放在变量前面，`newNum` 被赋予递减后的值，而不是原始值。`num`\
  \ 和 `newNum` 最终的值都是 0：\n\n```javascript\nvar num = 1;\nvar newNum = --num;\n```\n\
  \n本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/6.html`](http://www.ASmarterWayToLearn.com/javascript/6.html)\n\
  \n## 数学表达式：消除歧义\n\n复杂的算术表达式可能会带来一个问题，你可能还记得高中代数中的情况。看这个例子，告诉我 `totalCost` 的值是多少：\n\
  \n```javascript\nvar totalCost = 1 + 3 * 4;\n```\n\n`totalCost` 的值取决于你执行算术运算的顺序。如果你先加\
  \ `1 + 3`，然后将和乘以 4，`totalCost` 的值为 16。但如果你反过来，先乘以 3 乘以 4，然后将乘积加 1，你会得到 13。\n\n在\
  \ JavaScript 中，和代数一样，歧义通过优先级规则消除。和代数一样，这里适用的规则是乘法运算在加法运算之前完成。所以 `totalCost` 的值为\
  \ 13。\n\n但你不必记住 JavaScript 复杂的优先级规则。你可以通过使用括号来消除歧义，从而巧妙地解决这个问题。括号会覆盖所有内置的优先级规则。它们强制\
  \ JavaScript 先完成括号内的运算，再完成其他运算。\n\n当你使用括号向 JavaScript 明确你的意图时，你的代码也更容易理解，无论是对于其他程序员，还是对于一年后试图理解自己代码的你。在这条语句中，括号告诉\
  \ JavaScript 先计算 3 乘以 4，再加 1。结果是 13：\n\n```javascript\nvar totalCost = 1 + (3 *\
  \ 4);\n```\n\n如果我移动括号，算术运算的顺序就会不同。在下一条语句中，括号的位置告诉 JavaScript 先加 1 和 3，再乘以 4。结果是\
  \ 16：\n\n```javascript\nvar totalCost = (1 + 3) * 4;\n```\n\n另一个例子：\n\n```javascript\n\
  var resultOfComputation = (2 * 4) * 4 + 2;\n```\n\n通过将第一个乘法运算放在括号内，你告诉 JavaScript\
  \ 先执行该运算。但接下来呢？顺序可能是：\n1. 2 乘以 4。\n2. 将该乘积乘以 4。\n3. 再加 2。\n...这样 `resultOfComputation`\
  \ 的值为 34。\n\n或者顺序可能是：\n1. 2 乘以 4。\n2. 将该乘积乘以 4 加 2 的和。\n...这样 `resultOfComputation`\
  \ 的值为 48。\n\n解决方案是使用更多括号。如果你希望先执行第二次乘法，然后再加 2，可以这样写：\n\n```javascript\nresultOfComputation\
  \ = ((2 * 4) * 4) + 2;\n```\n\n但如果你希望将 2 乘以 4 的乘积乘以 4 加 2 的结果，可以这样写：\n\n```javascript\n\
  resultOfComputation = (2 * 4) * (4 + 2);\n```\n\n本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/7.html`](http://www.ASmarterWayToLearn.com/javascript/7.html)\n\
  \n## 连接文本字符串\n\n在第 1 章中，你学会了在警告框中显示消息，可以这样编码：\n\n```javascript\nalert(\"Thanks for\
  \ your input!\");\n```\n\n或者这样编码：\n\n```javascript\nvar message = \"Thanks for your\
  \ input!\";\nalert(message);\n```\n\n但假设你想个性化一条消息。在代码的另一部分，你询问了用户的名字，并将她输入的名字赋值给变量\
  \ `userName`。\n\n现在，你想将她的名字与标准的“Thanks”组合起来，生成一个警告框，例如显示“Thanks, Susan!”。\n\n当用户提供她的名字时，我们将其赋值给变量\
  \ `userName`。代码如下：\n\n```javascript\nalert(\"Thanks, \" + userName + \"!\");\n```\n\
  \n使用加号运算符，代码将三个元素组合（连接）成消息：字符串 `\"Thanks, \"` 加上变量 `userName` 表示的字符串，再加上字符串 `\"\
  !\"`。\n\n注意，第一个字符串包含一个空格。如果没有它，警告框会显示“Thanks,Susan!”。\n\n\n\n\n你可以将字符串和变量的任意组合进行拼接，也可以全部使用字符串或全部使用变量。例如，我可以像下面这样重写上一个示例。\n\
  \n```javascript\nvar message = \"Thanks, \";\nvar banger = \"!\";\nalert(message\
  \ + userName + banger);\n```\n\n下面是使用三个字符串的示例。\n\n```javascript\nalert(\"Thanks,\
  \ \" + \"Susan\" + \"!\");\n```\n\n你可以将拼接结果赋值给一个变量。\n\n```javascript\nvar message\
  \ = \"Thanks, \";\nvar userName = \"Susan\";\nvar banger = \"!\";\nvar customMess\
  \ = message + userName + banger;\nalert(customMess);\n```\n\n如果你把数字放在引号中，JavaScript\
  \ 会将其作为字符串进行拼接，而不是相加。以下代码……\n\n```javascript\nalert(\"2\" + \"2\");\n```\n\n……会显示消息\
  \ \"22\"。\n\n如果你混合使用字符串和数字……\n\n```javascript\nalert(\"2 plus 2 equals \" + 2 +\
  \ 2);\n```\n\n……JavaScript 会自动将数字转换为字符串，并显示消息 \"2 plus 2 equals 22\"。\n\n本章的交互式编程练习请访问：\n\
  [`www.ASmarterWayToLearn.com/js/8.html`](http://www.ASmarterWayToLearn.com/javascript/8.html)\n\
  \n# 9 提示框\n\n*提示框*会向用户询问一些信息，并提供一个回答字段供用户输入答案。\n\n以下代码向用户提问“你的物种？”，并在回答字段中提供了一个默认答案“human”。用户可以修改这个答案。无论用户保留默认答案还是将其改为其他内容，她的回答都会被赋值给该变量。\n\
  \n```javascript\nvar spec = prompt(\"Your species?\", \"human\");\n```\n\n提示框代码与\
  \ `alert()` 代码类似，但有两个不同之处。\n\n* 在提示框中，你需要一种方式来捕获用户的回答。这意味着你需要先声明一个变量，然后加上等号。\n*\
  \ 在提示框中，你可以指定第二个字符串。这是提示框显示时字段中出现的默认回答。如果用户保留默认回答并直接点击 `OK`，则默认回答会被赋值给该变量。是否包含默认回答由你决定。\n\
  \n正如你所料，你可以将字符串赋值给变量，然后在括号内使用变量代替字符串。\n\n```javascript\nvar question = \"Your species?\"\
  ;\nvar defaultAnswer = \"human\";\nvar spec = prompt(question, defaultAnswer);\n\
  ```\n\n用户的回答是一个文本字符串。即使回答是数字，它也会以字符串形式返回。例如，考虑以下代码。\n\n```javascript\nvar numberOfCats\
  \ = prompt(\"How many cats?\");\nvar tooManyCats = numberOfCats + 1;\n```\n\n由于你询问的是数字，并且用户很可能输入了一个数字，你可能会认为第二条语句中的数学运算能够生效。例如，如果用户输入\
  \ 3，变量 `tooManyCats` 的值应该是 4，你可能会这么想。但没那么幸运。所有对提示框的回答都以字符串形式返回。当字符串 `\"3\"` 与数字\
  \ `1` 通过加号连接时，JavaScript 会将 `1` 转换为字符串并进行拼接。因此，`tooManyCats` 的值最终不是 4，而是 `\"31\"\
  `。你将在后续章节中学习如何解决这个问题。\n\n如果用户不输入任何内容并点击 `OK`，则该变量会被赋值为空字符串：`\"\"`\n\n如果用户点击 `Cancel`，则该变量会被赋值为一个特殊值：`null`。\n\
  \n![](img/00001.jpeg)\n\n* 有些程序员会写成 `window.prompt` 而不是简单的 `prompt`。这是一种非常正式但完全正确的写法。大多数程序员更喜欢简写形式。在本教程中，我们将坚持使用简写形式。\n\
  * 在上面的示例中，有些程序员会使用单引号而不是双引号。只要成对匹配，这是合法的。但在这种情况下，我会要求你使用双引号。\n\n本章的交互式编程练习请访问：\n\
  [`www.ASmarterWayToLearn.com/js/9.html`](http://www.ASmarterWayToLearn.com/javascript/9.html)\n\
  \n# 10 if 语句\n\n假设你编写了一个提示框，询问“教皇住在哪里？”\n\n如果用户回答正确，你会显示一个祝贺的警告框。\n\n代码如下。\n\n```javascript\n\
  var x = prompt(\"Where does the Pope live?\");\nif (x === \"Vatican\") {\n   alert(\"\
  Correct!\");\n}\n```\n\n如果用户在提示框字段中输入 `\"Vatican\"`，则会显示祝贺警告框。如果他输入其他内容，则什么也不会发生。（这个简化的代码没有考虑其他正确答案，比如“The\
  \ Vatican”。我现在不想深入讨论这个问题。）\n\n这里有很多内容需要理解。让我们分解一下。\n\n`if` 语句总是以 `if` 开头。它与括号之间的空格对你来说是新的。我之前教你编写警告框和提示框时，左括号紧挨着关键字：`alert(\"\
  Hi\");` 现在我在 `if` 语句中要求你不要这样做。这纯粹是风格问题，但常见的风格规则允许这种不一致。\n\n在 `if` 关键字加空格之后，是被测试的条件——被赋值为用户回答的变量是否等于\
  \ `\"Vatican\"`？\n\n条件被括在圆括号中。\n\n如果条件测试为真，则会执行某些操作。可能执行任意数量的语句。在这个例子中，只执行一条语句：显示一个祝贺警告框。\n\
  \n`if` 语句的第一行以左花括号结束。整个 `if` 语句以单独一行的右花括号结束。请注意，这是对“语句以分号结束”这一规则的例外。当语句是类似段落的复杂语句并以花括号结束时，通常省略分号。\n\
  \n但是那个三个等号是怎么回事？你可能会认为它应该只是一个等号，但等号是保留用于给变量*赋值*的。如果你要*测试*变量的值，就不能使用单个等号。\n\n如果你忘记了这个规则，在应该使用三个等号时使用了单个等号，代码将无法正常运行。\n\
  \n正如你所料，你可以在示例代码中使用变量代替字符串。\n\n```javascript\nvar correctAnswer = \"Vatican\";\n\
  if (x === correctAnswer) {\n   alert(\"Correct!\");\n}\n```\n\n当条件满足时，你可以执行任意数量的语句。\n\
  \n```javascript\nvar correctAnswer = \"Vatican\";\nif (x === correctAnswer) {\n\
  \   score++;\n   userIQ = \"genius\";\n   alert(\"Correct!\");\n}\n```\n\n![](img/00001.jpeg)\n\
  \n* 有些程序员在编写简单的 `if` 语句时不使用花括号，这是合法的。有些程序员将左花括号放在单独一行。有些程序员如果 `if` 语句很简单，会将其全部放在一行。我发现不必逐案决定是最简单的，因此我按照示例所示的方式格式化所有\
  \ `if` 语句。在练习中，我会要求你对所有 `if` 语句遵循这些风格规则。\n* 在大多数情况下，双等号 `==` 与三等号 `===` 效果相同。然而，存在细微的技术差异，你可能永远不需要了解。同样，为了简单起见，我总是使用三等号。\n\
  \n本章的交互式编程练习请访问：\n[`www.ASmarterWayToLearn.com/js/10.html`](http://www.ASmarterWayToLearn.com/javascript/10.html)\n\
  \n# 11 比较运算符\n\n让我们再详细谈谈 `===`。它是一种*比较运算符*，具体来说是*相等运算符*。正如你在上一章中学到的，你用它来*比较*两个事物是否*相等*。\n\
  \n你可以使用相等运算符来比较变量与字符串、变量与数字、变量与数学表达式，或者变量与变量。你还可以用它来比较各种组合。以下所有内容都是 `if` 语句中合法的第一行：\n\
  \n```javascript\nif (fullName === \"Mark\" + \" \" + \"Myers\") {\nif (fullName\
  \ === firstName + \" \" + \"Myers\") {\nif (fullName === firstName + \" \" + \"\
  Myers\") {\nif (fullName === \"firstName + \" \" + lastName) {\nif (totalCost ===\
  \ 81.50 + 135) {\nif (totalCost === materialsCost + 135) {\nif (totalCost === materialsCost\
  \ + laborCost) {\nif (x + y === a - b) {\n```\n\n当比较字符串时，相等运算符是区分大小写的。`\"Rose\"\
  ` 不等于 `\"rose\"`。\n\n\n\n\n\n另一个比较运算符 `!==` 是 `===` 的反义词，表示*不等于*。\n\n```\n1 if (yourTicketNumber\
  \ !== 487208) {\n2   alert(\"Better luck next time.\");\n3 }\n```\n\n与 `===` 类似，不等运算符可用于比较数字、字符串、变量、数学表达式及其组合。\n\
  \n与 `===` 类似，使用不等运算符进行字符串比较时区分大小写。`\"Rose\" !== \"rose\"` 的结果为 true。\n\n以下是另外 4\
  \ 个比较运算符，通常用于比较数字。\n\n- `>` 大于\n- `<` 小于\n- `>=` 大于或等于\n- `<=` 小于或等于\n\n在下面的示例中，所有条件都为\
  \ true。\n\n```\nif (1 > 0) {\nif (0 < 1) {\nif (1 >= 0) {\nif (1 >= 1) {\nif (0\
  \ <= 1) {\nif (1 <= 1) {\n```\n\n![](img/00001.jpeg)\n\n*   正如双等号通常可以代替三等号一样，`!=`\
  \ 通常可以代替 `!==`。在练习中，我会要求你坚持使用 `!==`。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/11.html`](http://www.ASmarterWayToLearn.com/javascript/11.html)\n\
  \n# 12 *if...else* 和 *else if* 语句\n\n到目前为止，你编写的 *if* 语句都是非此即彼的。如果条件测试为 true，则执行某些操作；如果条件测试为\
  \ false，则不执行任何操作。\n\n```\n1 var x = prompt(\"Where does the Pope live?\");\n2 if\
  \ (x === \"Vatican\") {\n3   alert(\"Correct!\");\n4 }\n```\n\n很多时候，你希望无论条件如何都能执行某些操作。例如：\n\
  \n```\n1 var x = prompt(\"Where does the Pope live?\");\n2 if (x === \"Vatican\"\
  ) {\n3   alert(\"Correct!\");\n4 }\n5 if (x !== \"Vatican\") {\n6   alert(\"Wrong\
  \ answer\");\n7 }\n```\n\n在这个例子中，我们有两个 *if* 语句，一个测试 `\"Vatican\"`，另一个测试 *非* `\"\
  Vatican\"`。这样覆盖了所有情况，根据用户输入的内容显示相应的提示信息。\n\n这段代码可以工作，但比必要的更冗长。下面的代码更简洁，而且更易读。\n\n\
  ```\n1 if (x === \"Vatican\") {\n2   alert(\"Correct!\");\n3 }\n4 else {\n5   alert(\"\
  Wrong answer\");\n6 }\n```\n\n在我遵循的样式约定中，*else* 部分的格式与 *if* 部分完全相同。\n\n与 *if* 部分一样，*else*\
  \ 部分中可以执行任意数量的语句。\n\n```\n1 var correctAnswer = \"Vatican\";\n2 if (x === correctAnswer)\
  \ {\n3   alert(\"Correct!\");\n4 }\n5 else {\n6   score--;\n7   userIQ = \"problematic\"\
  ;\n8   alert(\"Incorrect\");\n9 }\n```\n\n*else if* 用于当所有上述测试都失败，并且你想测试另一个条件时。\n\
  \n```\n1 var correctAnswer = \"Vatican\";\n2 if (x === correctAnswer) {\n3   alert(\"\
  Correct!\");\n4 }\n5 else if (x === \"Rome\") {\n6   alert(\"Incorrect but close\"\
  );\n7 }\n8 else {\n9   alert(\"Incorrect\");\n10}\n```\n\n在一系列 *if* 测试中，一旦某个条件测试为\
  \ true，JavaScript 就会停止测试。\n\n![](img/00001.jpeg)\n\n*   格式化 *if* 语句及其变体的方式非常多，可能性几乎无穷无尽。我倾向于我向你展示的格式，因为它易于学习且能生成可读性强的代码。我会要求你在整个练习中坚持使用这种格式。\n\
  \n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/12.html`](http://www.ASmarterWayToLearn.com/javascript/12.html)\n\
  \n# 13 测试条件组合\n\n使用 *if* 语句，你已经学会了测试一个条件。如果条件满足，则执行一个或多个语句。但假设测试成功需要满足的条件不止一个，而是*两个*。\n\
  \n例如，如果一个家伙体重超过 300 磅，他只是一个超级大块头。但如果他体重超过 300 磅*并且*在 6 秒内跑完 40 码？你会邀请他尝试加入 NFL 担任前锋。你可以使用以下运算符在\
  \ JavaScript 中测试条件的组合...\n\n`&&`\n\n代码如下。\n\n```\n1 if (weight > 300 && time < 6)\
  \ {\n2   alert(\"Come to our tryout!\");\n3 }\n4 else {\n5   alert(\"Come to our\
  \ cookout!\");\n6 }\n```\n\n你可以将任意数量的条件链接在一起。\n\n```\n1 if (weight > 300 && time\
  \ < 6 && age > 17 && gender === \"male\") {\n2   alert(\"Come to our tryout!\");\n\
  3 }\n4 else {\n5   alert(\"Come to our cookout!\");\n6 }\n```\n\n你也可以测试一组条件中的*任意一个*。这是运算符。\n\
  \n`||`\n\n示例如下。\n\n```\n1 if (SAT > avg || GPA > 2.5 || sport === \"football\")\
  \ {\n2   alert(\"Welcome to Bubba State!\");\n3 }\n4 else {\n5   alert(\"Have you\
  \ looked into appliance repair?\");\n6 }\n```\n\n如果第 1 行中的任意一个或所有条件为 true，则显示第一个提示。如果它们都不为\
  \ true（第 4 行），则显示第二个提示。\n\n你可以组合任意数量的 *and* 和 *or* 条件。当你这样做时，会产生歧义。以这一行为例...\n\n\
  `if (age > 65 || age < 21 && res === \"U.S.\") {`\n\n这可以有两种理解方式。\n\n*   第一种理解方式：如果此人年龄超过\
  \ 65 岁或小于 21 岁，并且除了这两个条件之一外，还是美国居民。根据这种解释，下表中的两列都需要为 true 才能通过。\n\n![](img/00002.jpeg)\n\
  \n*   第二种理解方式：如果此人年龄超过 65 岁且居住在任何地方，或者年龄小于 21 岁且是美国居民。根据这种解释，下表中任意一列为 true 即可通过。\n\
  \n![](img/00003.jpeg)\n\n这与你在组合数学表达式时面临的问题相同。解决方法也一样：使用括号。\n\n在以下代码中，如果对象年龄超过 65\
  \ 岁且是美国居民，则通过。或者，如果对象年龄小于 21 岁且是美国居民，则通过。\n\n`if ((age > 65 || age < 21) && res\
  \ === \"U.S.\") {`\n\n在以下代码中，如果对象年龄超过 65 岁且居住在任何地方，则通过。或者，如果对象年龄小于 21 岁且居住在美国，则通过。\n\
  \n`if (age > 65 || (age < 21 && res === \"U.S.\")) {`\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/13.html`](http://www.ASmarterWayToLearn.com/javascript/13.html)\n\
  \n# 14 嵌套的 *if* 语句\n\n看看这段代码。\n\n```\n1 if ((x === y || a === b) && c === d) {\n\
  2   g = h;\n3 }\n4 else {\n5   e = f;\n6 }\n```\n\n在上面的代码中，如果前两个条件中的任意一个为 true，并且第三个条件也为\
  \ true，则将 `g` 赋值为 `h`。否则，将 `e` 赋值为 `f`。\n\n还有另一种编码方式，使用*嵌套*。\n\n```\n1  if (c ===\
  \ d) {\n2    if (x === y) {\n3      g = h;\n4    }\n5    else if (a === b) {\n6\
  \      g = h;\n7    }\n8    else {\n9      e = f;\n10   }\n11 }\n12 else {\n13 \
  \  e = f;\n14 }\n```\n\n嵌套层级通过花括号的位置传达给 JavaScript。在顶层 *if* 内部嵌套了三个代码块。如果顶层 *if*\
  \ 测试的条件（即 `c` 与 `d` 具有相同的值）为 false，则不会执行任何嵌套的代码块。第 1 行的左花括号和第 11 行的右花括号包含了所有嵌套代码，告诉\
  \ JavaScript 内部的所有内容都是第二层级的。\n\n为了可读性，较低层级比其上层级缩进 2 个空格。\n\n在这个示例中相对简单的测试和结果集合中，我更倾向于使用更简洁的多条件结构。但当情况变得非常复杂时，嵌套的\
  \ *if* 是一个不错的选择。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/14.html`](http://www.ASmarterWayToLearn.com/javascript/14.html)\n\
  \n# 15 数组\n\n让我们给一些变量分配一些字符串值。\n\n```\nvar city0 = \"Atlanta\";\nvar city1 = \"\
  Baltimore\";\nvar city2 = \"Chicago\";\nvar city3 = \"Denver\";\nvar city4 = \"\
  Los Angeles\";\nvar city5 = \"Seattle\";\n```\n\n变量名都相同，只是末尾的数字不同。如果我想的话，我本可以将变量命名为\
  \ `buffy`、`the`、`vampireSlayer` 等等，但我选择这样命名是因为接下来讨论的方向。\n\n现在，完成了这些赋值之后，如果我编写...\n\
  \n`alert(\"Welcome to \" + city3);`\n\n\n\n\n...会弹出一条提示，显示“欢迎来到丹佛”。\n\n我将向你展示另一种变量，这种变量在你后续章节学习的许多任务中都会派上用场。我指的是名为`array`的变量类型。普通变量只能赋一个值，例如\
  \ 9 或“巴黎”，而`array`是一种可以赋多个值的变量。你可以这样定义一个`array`：\n\n```\nvar cities = [\"Atlanta\"\
  , \"Baltimore\", \"Chicago\", \"Denver\", \"Los Angeles\", \"Seattle\"];\n```\n\n\
  在本章开头的示例中，我每个变量名都以数字结尾。`city0`是“Atlanta”，`city1`是“Baltimore”，以此类推。我刚刚定义的`array`与之类似，但在我这样定义`array`时，JavaScript\
  \ 会自动为不同的值（即`elements`）编号。（你也可以通过单独定义元素来控制编号，见下文。）引用每个元素时，只需写出`array`名称（此处为`cities`），后跟方括号括起来的数字。`cities[0]`是“Atlanta”，`cities[1]`是“Baltimore”，以此类推。\n\
  \n由于 JavaScript 会自动为`array`元素编号，你无法控制编号顺序。列表中的第一个元素始终具有`index` 0，第二个元素`index`为 1，依此类推。\n\
  \n下面是我之前编写的提示框代码，但这次指定的是`array`元素而非普通变量。\n\n```\nalert(\"Welcome to \" + cities[3]);\n\
  ```\n\n`array`可以赋任何你能赋给普通变量的值。你甚至可以在同一个`array`中混合不同类型（尽管通常不会这么做）。\n\n```\nvar mixedArray\
  \ = [1, \"Bob\", \"Now is\", true];\n```\n\n在上例中，`mixedArray[0]`的数值为 1，`mixedArray[1]`的字符串值为\"\
  Bob\"，以此类推。\n\n### 需要记住的事项：\n\n* 第一项始终具有`index` 0，而不是 1。这意味着如果列表最后一项的`index`为 9，则列表中共有\
  \ 10 项。\n* 与普通变量相同的命名规则适用。只允许使用字母、数字、`$`和`_`。首字符不能是数字。不能有空格。\n* 程序员通常倾向于使用复数形式作为`array`名称——例如用`cities`而不是`city`——因为`array`是一组事物的列表。\n\
  * 与普通变量一样，`array`只需声明一次。如果给已声明的`array`赋新值，则省略`var`。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/15.html`](http://www.ASmarterWayToLearn.com/javascript/15.html)\n\
  \n# 16 数组：添加和删除元素\n\n正如你在前几章所学，你可以声明一个空变量，即没有值的变量。然后你可以随时给它赋值，也可以随意更改其值。这些操作同样适用于`array`。\n\
  \n以下是声明空`array`的方法。\n\n```\nvar pets = [];\n```\n\n假设`array` `pets`已经声明。以下是给它赋值的方法。\n\
  \n```\npets[0] = \"dog\";\npets[1] = \"cat\";\npets[2] = \"bird\";\n```\n\n在上例中，我按顺序定义了`array`的前三个元素。但如果你愿意，也可以合法地在`array`中留下空隙（尽管通常不会）。例如，假设你从同一个空`array`开始，并编写以下代码行。\n\
  \n```\npets[3] = \"lizard\";\npets[6] = \"snake\";\n```\n\n现在，如果你引用`pets[3]`，会得到\"\
  lizard\"。引用`pets[6]`，会得到\"snake\"。但如果你引用`pets[0]`到`pets[2]`，或`pets[4]`、`pets[5]`，则会得到`undefined`。\n\
  \n你可以给已有值的`array`添加更多值。假设`array` `pets`的前三个元素是\"dog\"、\"cat\"和\"bird\"。然后你编写以下代码。\n\
  \n```\npets[3] = \"lizard\";\npets[4] = \"fish\";\npets[5] = \"gerbil\";\npets[6]\
  \ = \"snake\";\n```\n\n现在`array`有 7 个元素：\"dog\"、\"cat\"、\"bird\"、\"lizard\"、\"fish\"\
  、\"gerbil\"和\"snake\"。\n\n如果你给已有值的`array`元素赋新值，旧值会被新值替换。\n\n使用关键字`pop()`，你可以删除`array`的最后一个元素。假设你有一个`array`\
  \ `pets`，其元素为\"dog\"、\"cat\"和\"bird\"。以下代码删除最后一个元素\"bird\"，留下一个包含两个元素的`array`。\n\
  \n```\npets.pop();\n```\n\n使用关键字`push()`，你可以在`array`末尾添加一个或多个元素。假设你有同样的`array`，包含\"\
  dog\"、\"cat\"和\"bird\"。以下代码在`array`末尾添加两个新元素。\n\n```\npets.push(\"fish\", \"ferret\"\
  );\n```\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/16.html`](http://www.ASmarterWayToLearn.com/javascript/16.html)\n\
  \n# 17 数组：删除、插入和提取元素\n\n使用`shift()`方法从`array`开头删除一个元素。假设你有一个`array` `pets`，其元素为\"\
  dog\"、\"cat\"和\"bird\"。以下代码删除第一个元素\"dog\"，留下一个包含两个元素的`array`。\n\n```\npets.shift();\n\
  ```\n\n要在`array`开头添加一个或多个元素，请使用`unshift()`方法。以下代码在`array`开头添加两个元素。\n\n```\npets.unshift(\"\
  fish\", \"ferret\");\n```\n\n使用`splice()`方法可以在`array`中的任意位置插入一个或多个元素，同时可选地删除其后的一个或多个元素。假设你有一个`array`，元素为\"\
  dog\"、\"cat\"、\"fly\"、\"bug\"、\"ox\"。以下代码在\"cat\"之后添加\"pig\"、\"duck\"和\"emu\"，同时删除\"\
  fly\"和\"bug\"。\n\n```\npets.splice(2, 2, \"pig\", \"duck\", \"emu\");\n```\n\n括号内的第一个数字是你要开始添加（如果添加）或删除（如果删除）的位置的`index`。第二个数字是要删除的现有元素数量，从你插入的元素之后的第一个元素开始。上述代码最终得到一个包含\"\
  dog\"、\"cat\"、\"pig\"、\"duck\"、\"emu\"和\"ox\"的`array`。\n\n你也可以只添加而不删除任何元素。以下代码添加\"\
  pig\"、\"duck\"和\"emu\"，不删除任何元素。\n\n```\npets.splice(2, 0, \"pig\", \"duck\", \"\
  emu\");\n```\n\n你也可以只删除元素而不添加任何内容。如果初始元素为\"dog\"、\"cat\"、\"fly\"、\"bug\"和\"ox\"\
  ，以下代码从`index` 3 开始删除两个元素——\"bug\"和\"ox\"。剩下\"dog\"、\"cat\"和\"fly\"。\n\n```\npets.splice(2,\
  \ 2);\n```\n\n使用`slice()`方法可以复制任意位置的一个或多个连续元素，并将它们放入一个新的`array`。如果你有一个`array` `pets`，包含\"\
  dog\"、\"cat\"、\"fly\"、\"bug\"和\"ox\"，以下代码将\"fly\"和\"bug\"复制到新`array` `noPets`中，并保持原始`array`\
  \ `pets`不变。\n\n```\nvar noPets = pets.slice(2, 4);\n```\n\n括号内的第一个数字是要复制的第一个元素的`index`。第二个数字是要复制的最后一个元素之后的那个元素的`index`。\n\
  \n这里有两件事可能会让你困惑：\n\n* 由于括号内的第一个`index`数字指定了要复制的第一个元素，你可能会认为第二个`index`数字指定了要复制的最后一个元素。实际上，第二个数字指定的是要复制的最后一个元素之后的那个元素的`index`。\n\
  * 你必须将切片后的元素赋值给一个`array`。当然，这个`array`可以是进行切片的同一个`array`。在这种情况下，原始`array`将缩减为仅包含被复制的元素。\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/17.html`](http://www.ASmarterWayToLearn.com/javascript/17.html)\n\
  \n# 18 `for`循环\n\n你知道《墙上有 99 瓶啤酒》这首歌吗？如果你要教别人唱这首歌，你可以给他们以下指令：\n\n1. 唱“墙上有 99 瓶啤酒，99\
  \ 瓶啤酒。”\n2. 唱“拿下一瓶传一圈，墙上有 98 瓶啤酒。”\n3. 唱“墙上有 98 瓶啤酒，98 瓶啤酒。”\n\n\n\n\n4. 唱“拿下一瓶递过去，墙上还有\
  \ 97 瓶啤酒。”\n5. 唱“墙上 97 瓶啤酒，97 瓶啤酒。”\n6. 唱“拿下一瓶递过去，墙上还有 96 瓶啤酒。”\n\n……以此类推，还有 192\
  \ 行指令。\n\n但这不是你给出指令的方式，对吧？你会更简洁。你会这样说：\n\n唱“墙上 99 瓶啤酒，99 瓶啤酒。拿下一瓶递过去，墙上还有 98 瓶啤酒。”重复此过程，每次减\
  \ 1，直到墙上没有啤酒瓶为止。\n\n## 循环简介\n\n在编程中，你经常会遇到类似啤酒瓶的情况。例如，假设你主动提出要检查用户所在城市是否是美国最干净的\
  \ 5 个城市之一。用户输入了她的城市，你将她的城市赋值给变量 `cityToCheck`。\n\n你已经将最干净的 5 个城市列表赋值给了数组 `cleanestCities`。\n\
  \n```javascript\nvar cleanestCities = [\"Cheyenne\", \"Santa Fe\", \"Tucson\", \"\
  Great Falls\", \"Honolulu\"];\n```\n\n现在你遍历数组，看是否与用户所在城市匹配。如果匹配，你显示一个 `alert` 告诉用户她的城市是最干净的城市之一。如果没有匹配，你显示一个\
  \ `alert` 告诉用户她的城市不在列表中。\n\n```javascript\nif (cityToCheck === cleanestCities[0])\
  \ {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck === cleanestCities[1])\
  \ {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck === cleanestCities[2])\
  \ {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck === cleanestCities[3])\
  \ {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck === cleanestCities[4])\
  \ {\n    alert(\"它是最干净的城市之一\");\n}\nelse {\n    alert(\"它不在列表中\");\n}\n```\n\n方便的是，JavaScript\
  \ 提供了一种更简洁的编码方式。下面是一个 `for` 循环，它完成了上面冗长代码的大部分功能。\n\n```javascript\nfor (var i =\
  \ 0; i <= 4; i++) {\n   if (cityToCheck === cleanestCities[i]) {\n     alert(\"\
  它是最干净的城市之一\");\n   }\n}\n```\n\n### 分解 `for` 循环\n\n第一行以关键字 `for` 开头。定义循环的三个规范位于括号内：\n\
  \n1. 声明一个变量，用于计数迭代次数，并作为变化的数组索引，将其设置为起始值，此处为 `0`。\n2. 定义循环的限制。此处，只要计数器不超过 `4`，循环就继续运行。由于计数器从\
  \ `0` 开始，循环将运行 5 次。\n3. 每次循环结束时对计数器进行的操作。此处，每次计数器递增。\n\n括号内的三个规范顺序始终相同：\n1. 计数器的名称（通常为\
  \ `i`）及其起始值（通常为 `0`）\n2. 循环运行的次数（此处为数组元素的数量）\n3. 每次迭代后如何更改计数器（通常每次加 1）\n\n### 注意事项\n\
  \n* 在示例中，计数器 `i` 有两个作用。它跟踪迭代次数，以便循环在正确的位置停止；同时它作为数组的索引号，使得代码能够在每次迭代计数器递增时遍历数组的所有元素。\n\
  * 使用 `i` 作为计数器并非神圣不可改变。你可以使用任何合法的变量名。但程序员通常使用 `i`，因为它使第一行更紧凑，并且程序员理解 `i` 代表“迭代”。\n\
  * 在示例中，初始计数为 `0`，即数组第一个元素的索引号。但根据需求，它可以是任何数字。\n* 在示例中，计数器每次迭代递增。但根据需求，你可以递减、每次增加\
  \ 2，或以其他方式更改。\n* 在示例中，我指定循环在 `i <= 4` 时运行。或者，我可以指定 `i < 5`。无论哪种方式，由于计数器从 `0` 开始，循环运行\
  \ 5 次。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/18.html`](http://www.ASmarterWayToLearn.com/javascript/18.html)\n\
  \n# 19. `for` 循环：标志、布尔值、数组长度和循环中断\n\n上一章给出的 `for` 循环示例存在几个问题。第一个问题是潜在的沟通问题。如果用户所在城市与最干净城市列表匹配，会显示一个确认的\
  \ `alert`。但如果没有匹配，则什么也不会发生，用户被蒙在鼓里。如果没有找到匹配，我们需要显示一个 `alert` 说明情况。\n\n### 使用标志和布尔值\n\
  \n我们使用一个“标志”来实现。标志就是一个变量，它以一个你给定的默认值开始，然后在特定条件下切换为另一个值。在我们的示例中，假设标志如下：\n\n```javascript\n\
  var matchFound = \"no\";\n```\n\n如果找到匹配，标志的值被更改。最后，如果标志没有被更改——如果它仍然保持原始值 `\"no\"\
  `——则意味着没有找到匹配，因此我们显示一个 `alert` 说明城市不在列表中。\n\n```javascript\nvar matchFound = \"\
  no\";\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i])\
  \ {\n        matchFound = \"yes\";\n        alert(\"它是最干净的城市之一\");\n    }\n}\nif\
  \ (matchFound === \"no\") {\n    alert(\"它不在列表中\");\n}\n```\n\n这样可行，但通常不将字符串 `\"\
  no\"` 和 `\"yes\"` 赋给开关，而是使用布尔值 `false` 和 `true`。\n\n```javascript\nvar matchFound\
  \ = false;\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i])\
  \ {\n        matchFound = true;\n        alert(\"它是最干净的城市之一\");\n    }\n}\nif (matchFound\
  \ === false) {\n    alert(\"它不在列表中\");\n}\n```\n\n布尔值只有两个：`true` 和 `false`。注意它们不需要用引号括起来。\n\
  \n### 使用 `break` 优化\n\n我们示例的下一个问题是它可能浪费计算周期。假设在第二次循环时找到了匹配并显示了 `alert`。按照循环的编码方式，循环会一直运行到结束。这是不必要的，因为我们在第二次循环时已经得到了答案。这个问题可以通过关键字\
  \ `break` 解决。\n\n```javascript\nvar matchFound = false;\nfor (var i = 0; i <= 4;\
  \ i++) {\n    if (cityToCheck === cleanestCities[i]) {\n        matchFound = true;\n\
  \        alert(\"它是最干净的城市之一\");\n        break;\n    }\n}\nif (matchFound === false)\
  \ {\n    alert(\"它不在列表中\");\n}\n```\n\n### 动态数组长度\n\n最后一个问题：在示例中，我假设数组元素的数量是已知的。但如果不知道呢？JavaScript\
  \ 有一种方法可以找出。以下代码将数组 `cleanestCities` 中的元素数量赋值给变量 `numElements`。\n\n```javascript\n\
  var numElements = cleanestCities.length;\n```\n\n现在我们可以将循环次数限制为 JavaScript 计算出的数量。\n\
  \n```javascript\nvar numElements = cleanestCities.length;\nvar matchFound = false;\n\
  for (var i = 0; i < numElements; i++) {\n    if (cityToCheck === cleanestCities[i])\
  \ {\n        matchFound = true;\n        alert(\"它是最干净的城市之一\");\n        break;\n\
  \    }\n}\nif (matchFound === false) {\n    alert(\"它不在列表中\");\n}\n```\n\n现在，只要\
  \ `i` 小于元素数量，循环就会继续。（由于长度编号从 1 开始，而 `i` 编号从 0 开始，我们需要在长度值之前停止 1。）\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/19.html`](http://www.ASmarterWayToLearn.com/javascript/19.html)\n\
  \n# 20. 嵌套 `for` 循环\n\n大西洋唱片公司雇佣了你和我来为未来的说唱明星生成一份名字列表。为了简化，我们首先分别列出一些名和姓。\n\n\n\n\
  \n\n![](img/00004.jpeg)\n\n通过将每个名字与每个姓氏组合，我们可以生成 20 个不同的说唱歌手全名。\n\n从\"BlueRay\"\
  开始，我们遍历姓氏列表，生成...\n\nBlueRay Zzz\nBlueRay Burp\nBlueRay Dogbone\nBlueRay Droop\n\
  \n然后移动到下一个名字\"Upchuck\"，再次遍历姓氏列表，生成...\n\nUpchuck Zzz\nUpchuck Burp\nUpchuck Dogbone\n\
  Upchuck Droop\n\n以此类推，将每个名字与每个姓氏组合。\n\n但你看，为什么不让 JavaScript 来做这些重复的工作呢？我们将使用嵌套的\
  \ `for` 语句。\n\n```javascript\nvar firstNames = [\"BlueRay \", \"Upchuck \", \"Lojack\
  \ \", \"Gizmo \", \"Do-Rag \"];\nvar lastNames = [\"Zzz\", \"Burp\", \"Dogbone\"\
  , \"Droop\"];\nvar fullNames = [];\n\nfor (var i = 0; i < firstNames.length; i++)\
  \ {\n  for (var j = 0; j < lastNames.length; j++) {\n    fullNames.push(firstNames[i]\
  \ + lastNames[j]);\n  }\n}\n```\n\n### 思考要点：\n\n* 内层循环在外层循环的每次迭代中都会完整地循环一遍。如果外层循环计数器是\
  \ `i`，内层循环计数器是 `j`，那么当 `i` 为 0 时，`j` 会从 0、1、2 一直循环到结束。然后 `i` 增加到 1，`j` 再次遍历所有值。外层循环就像时钟的分针，内层循环就像秒针。\n\
  * 你可以根据需要嵌套任意多层。\n* 嵌套循环相对于其外层循环缩进 2 个空格。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/20.html`](http://www.ASmarterWayToLearn.com/javascript/20.html)\n\
  \n# 21 改变大小写\n\n你让用户输入她所在的城市。然后你将她输入的城市与最干净的 5 个城市列表进行比对。\n\n如果用户输入\"Cheyenne\"\
  或其他最干净的城市，你的代码会弹出一个提示，告诉她这是最干净的城市之一。\n\n但如果她输入的是\"cheyenne\"而不是\"Cheyenne\"——有些用户难免会这样——那么就不会匹配。JavaScript\
  \ 是字面理解的。\n\n人类知道在这个上下文中\"cheyenne\"指的是\"Cheyenne\"，但 JavaScript 不知道。我们需要某种方法让 JavaScript\
  \ 识别出未大写版本也能匹配。\n\n一种方法是扩展 `cleanestCities` 数组，包含所有城市名称的小写版本：\n\n`var cleanestCities\
  \ = [\"Cheyenne\", \"cheyenne\", \"Santa Fe\", \"santa fe\", \"Tucson\", \"tucson\"\
  , \"Great Falls\", \"great falls\", \"Honolulu\", \"honolulu\"];`\n\n这种方法在一定程度上可行，但需要大量额外编码。而且，如果用户输入\"\
  santa Fe\"、\"Santa fe\"或\"sAnta Fe\"，我们又回到了最初的问题。要覆盖所有这些可能性以及其他情况，代码会变得非常冗长。\n\n\
  解决方案是将数组元素全部写成小写，并将用户的输入（无论是什么）也转换为小写，这样我们就能始终用苹果和苹果进行比较。\n\n```javascript\nvar\
  \ cityToCheck = prompt(\"Enter your city\");\ncityToCheck = cityToCheck.toLowerCase();\n\
  var cleanestCities = [\"cheyenne\", \"santa fe\", \"tucson\", \"great falls\", \"\
  honolulu\"];\nfor (var i = 0; i <= 4; i++) {\n  if (cityToCheck === cleanestCities[i])\
  \ {\n    alert(\"It's one of the cleanest cities\");\n  }\n}\n```\n\n第 2 行是这里的新内容：\n\
  `cityToCheck = cityToCheck.toLowerCase();`\n\n转换后的字符串被赋值给一个变量。在这个例子中，就是被转换的字符串本身所在的变量\
  \ `cityToCheck`。注意关键字 `toLowerCase` 必须使用驼峰式大小写。\n\n还要注意，`toLowerCase` 方法会将字符串中的所有字符转换为小写，而不仅仅是首字母。例如，\"\
  ChEyEnNe\" 会变成 \"cheyenne\"。\n\n你也可以反过来，将所有内容转换为大写，然后与\"CHEYENNE\"、\"SANTA FE\"\
  等进行比对。大多数程序员更喜欢小写方法。要将字符串转换为大写，你可以这样写：\n`cityToCheck = cityToCheck.toUpperCase();`\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/21.html`](http://www.ASmarterWayToLearn.com/javascript/21.html)\n\
  \n# 22 字符串：测量长度和提取部分\n\n你让用户输入一个城市名称。你想将她输入的名称转换为首字母大写的格式。无论她输入的是\"boston\"、\"BOSTON\"\
  还是\"bosTon\"，你都希望将输入标准化为\"Boston\"。你在上一章学到的 `toLowerCase` 和 `toUpperCase` 方法无法单独完成这个任务，因为它们会对字符串中的每个字符进行相同的全局更改。但如果你将字符串分成两段，就可以使用这些方法将字符串调整为你想要的格式。（目前，我忽略城市名称可能由两个或更多单词组成的情况，比如\
  \ New Orleans 或 Sault Ste. Marie。）\n\n要复制字符串的一部分，可以使用 `slice` 方法。假设用户输入了一个字符串，并且该字符串被赋值给变量\
  \ `cityToCheck`。以下代码复制字符串的第一个字符，并将其赋值给变量 `firstChar`。`cityToCheck` 的原始值不变。如果 `cityToCheck`\
  \ 是\"Boston\"，那么 `firstChar` 就是\"B\"。\n\n`var firstChar = cityToCheck.slice(0, 1);`\n\
  \n### 需要注意的事项：\n\n* 字符串的索引方式与数组类似。只不过每个索引号指向的不是元素，而是一个字符。\n* 与数组索引一样，字符串索引从 0 开始。\n\
  * 在 `slice` 方法中，括号内的第一个数字是切片中第一个字符的索引。第二个数字并不是切片中的最后一个字符，而是切片*之后*的第一个字符。如果你用第二个索引减去第一个索引，得到的结果总是切片的长度。\n\
  \n另一个例子：\n`var someChars = cityToCheck.slice(2, 5);`\n\n再次假设字符串是\"Boston\"。切片从索引\
  \ 2（第三个字符）开始，即\"s\"。它结束于索引 5 之前的字符，即\"n\"。`someChars` 的值是\"sto\"。\n\n如果省略括号内的第二个数字，JavaScript\
  \ 会包含从起始位置到字符串末尾的所有字符。\n`var someChars = cityToCheck.slice(2);`\n\n切片从索引 2（第三个字符）开始，即\"\
  s\"。由于没有指定结束位置，切片会一直取到字符串的最后一个字符。`someChars` 的值是\"ston\"。\n\n现在我们有一种方法可以将字符串的第一个字符大写，并确保其余字母为小写。\n\
  \n```javascript\nvar firstChar = cityToCheck.slice(0, 1);\nvar otherChars = cityToCheck.slice(1);\n\
  firstChar = firstChar.toUpperCase();\notherChars = otherChars.toLowerCase();\nvar\
  \ cappedCity = firstChar + otherChars;\n```\n\n上面代码逐行执行的操作如下：\n1. 复制字符串的第一个字符，并赋值给变量\
  \ `firstChar`。\n2. 复制从第二个字符到末尾的所有字符，并赋值给变量 `otherChars`。\n3. 将第一个字符大写。\n4. 将其他字符小写。\n\
  5. 将两部分拼接起来，重新组成完整的字符串。\n\n有时知道字符串中有多少个字符会很有用。例如，假设你想从任何长度超过三个字符的字符串中截取前三个字符，比如从\"\
  November\"中截取\"Nov\"。要查找字符串中的字符数，你可以使用你已经学过的用于查找数组元素数量的相同语法。\n\n```javascript\n\
  var month = prompt(\"Enter a month\");\nvar charsInMonth = month.length;\nif (charsInMonth\
  \ > 3) {\n  monthAbbrev = month.slice(0, 3);\n}\n```\n\n第 2 行统计字符串中的字符数，并将该数字赋值给变量\
  \ `charsInMonth`。\n\n能够测量字符串中的字符数会非常方便。例如，假设你想遍历一个字符串，检查其中是否有双空格。你可以将字符数用作循环的界限。以下代码检查字符串中是否有双空格，如果发现则显示一个提示。\n\
  \n\n\n\n\n```javascript\n1 var str = prompt(\"Enter some text\");\n2 var numChars\
  \ = str.length;\n3 for (var i = 0; i < numChars; i++) {\n4   if (str.slice(i, i\
  \ + 2) === \" \") {\n5     alert(\"No double spaces!\");\n6     break;\n7   }\n\
  8 }\n```\n\n第 2 行计算字符串中的字符数，并将该数字赋给变量`numChars`。在第 3 行中，这个数字被用作循环限制器。只要计数器`i`小于字符串中的字符数，循环就会继续运行。（请记住，长度是从\
  \ 1 开始计数的，而计数器是从 0 开始计数的，因此循环必须在长度数减 1 处停止。）第 4 行逐字符遍历字符串，检查每个 2 字符片段，寻找双空格。\n\n\
  本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/22.html`](http://www.ASmarterWayToLearn.com/javascript/22.html)\n\
  \n## 23 字符串：查找片段\n\n《纽约客》杂志不允许使用“第二次世界大战”这个短语。他们说应该用“第二次世界大战”。因此，让我们在下面的句子中搜索被禁止的字符，并用《纽约客》偏爱的短语替换它们。\n\
  \n| 令人惊讶的是，即使在第二次世界大战最黑暗的深处，J.R.R.托尔金仍在撰写三部曲，其中包含了一种只有诗歌和神话才具备的奇特适用性，即善良的灰袍巫师能够理解邪恶的魔法师，正是因为他与他们足够相似，能够以他们无法理解的方式把握他们的思想和动机。\
  \ |\n\n你已经知道一种查找并替换被禁止片段的方法。假设上面的段落已被赋给变量`text`。\n\n```javascript\n1 for (var i\
  \ = 0; i < text.length; i++) {\n2   if (text.slice(i, i + 12) === \"World War II\"\
  ) {\n3     text = text.slice(0, i) + \"the Second World War\" + text.slice(i + 12);\n\
  4   }\n5 }\n```\n\n该代码循环遍历字符串，查找“World War II”。第 2 行逐字符遍历字符串，检查每个 12 字符序列。如果找到“World\
  \ War II”，第 3 行将三个片段连接起来：“World War II”之前的所有字符、替换短语“the Second World War”，以及“World\
  \ War II”之后的所有字符。\n\n但 JavaScript 有一种更高效的方法来实现这一点，即使用`indexOf`方法。\n\n`var firstChar\
  \ = text.indexOf(\"World War II\");`\n\n如果该片段存在，该方法会找到该片段第一个字符的索引，并将其赋给变量`firstChar`。如果该片段不存在，该方法会将`-1`赋给该变量，这样你就知道它不存在。\n\
  \n现在我们可以用更少的代码将禁止的短语替换为首选的短语。\n\n```javascript\n1 var firstChar = text.indexOf(\"\
  World War II\");\n2 if (firstChar !== -1) {\n3   text = text.slice(0, firstChar)\
  \ + \"the Second World War\" + text.slice(firstChar + 12);\n4 }\n```\n\n第 1 行检查该短语，如果找到，则将短语第一个字符的索引赋给变量`firstChar`。如果未找到，则将`-1`赋给该变量。如果该变量的值不是`-1`（第\
  \ 2 行）——即找到了该短语——则第 3 行的连接操作将违规短语替换为正确的短语。\n\n`indexOf`方法只查找你要找的片段的第一个实例。在上面的例子中，你可以通过循环来克服这个限制。你会将第一个“World\
  \ War II”实例改为“the Second World War”，然后在下一个循环迭代中，找到下一个剩余的实例并更改它，以此类推。\n\n要查找字符串中片段的最后一个实例，请使用`lastIndexOf`。以下代码找到该片段最后一个实例的第一个字符的索引，即第二个“be”。变量`segIndex`最终值为`16`，即第二个“be”中“b”的索引。\n\
  \n```javascript\n1 var text = \"To be or not to be.\";\n2 var segIndex = text.lastIndexOf(\"\
  be\");\n```\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/23.html`](http://www.ASmarterWayToLearn.com/javascript/23.html)\n\
  \n## 24 字符串：查找特定位置的字符\n\n用户输入了他的名字。该字符串已被赋给变量`firstName`。你想要提取第一个字符。你已经知道一种方法。\n\
  \n`var firstChar = firstName.slice(0, 1);`\n\n这里有一种更直接的方法。\n\n`var firstChar = firstName.charAt(0)`\n\
  \n上面的代码找到由变量`firstName`表示的字符串中索引 0（开头）处的单个字符，并将其赋给变量`firstChar`。\n\n以下代码找到字符串中的最后一个字符。\n\
  \n`var lastChar = name.charAt(name.length - 1);`\n\n以下代码循环遍历字符串，查找感叹号。如果找到该字符，则显示一个警告。\n\
  \n```javascript\n1 for (var i = 0; i < text.length; i++) {\n2   if (text.charAt(i)\
  \ === \"!\") {\n3     alert(\"Exclamation point found!\");\n4     break;\n5   }\n\
  6 }\n```\n\n注意：`indexOf`方法只能识别特定位置的字符。它不能更改某个位置的字符。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/24.html`](http://www.ASmarterWayToLearn.com/javascript/24.html)\n\
  \n## 25 字符串：替换字符\n\n在前面的章节中，你学习了两种不同的方法来将字符串中的“World War II”替换为“the Second World\
  \ War”。首先，是循环加切片的方法。\n\n```javascript\n1 for (var i = 0; i < text.length; i++) {\n\
  2   if (text.slice(i, i + 12) === \"World War II\") {\n3     text = text.slice(0,\
  \ 1) + \"the Second World War\" + text.slice(i + 12);\n4   }\n5 }\n```\n\n当你学习了`indexOf`方法后，你改进了这种相当粗糙的方法。\n\
  \n```javascript\n1 var firstChar = text.indexOf(\"World War II\");\n2 if (firstChar\
  \ !== -1) {\n3   text = text.slice(0, firstChar) + \"the Second World War\" + text.slice(firstChar\
  \ + 12);\n4 }\n```\n\n但 JavaScript 还提供了一种更直接的方法，即`replace`方法。\n\n`var newText =\
  \ text.replace(\"World War II\", \"the Second World War\");`\n\n括号内的第一个字符串是要替换的片段。第二个字符串是要插入的片段。在上面的代码中，由变量`text`表示的字符串中的片段“World\
  \ War II”被替换为片段“the Second World War”，修改后的字符串被赋给新变量`newText`。\n\n如果将修改后的字符串赋给一个新变量，如上例所示，则原始字符串保持不变。如果你希望原始字符串被修改后的字符串替换，则将修改后的字符串赋给原始变量。\n\
  \n`text = text.replace(\"World War II\", \"the Second World War\");`\n\n在上面的例子中，只替换了字符串的第一个实例。如果你想替换所有实例，你必须让\
  \ JavaScript 知道你想要一个*全局*替换。\n\n`var newText = text.replace(/World War II/g, \"the\
  \ Second World War\");`\n\n在全局替换中，你将待替换的片段用斜杠括起来而不是引号，并在结束斜杠后加上`g`表示“全局”。要插入的片段用引号括起来，与一次性替换相同。\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/25.html`](http://www.ASmarterWayToLearn.com/javascript/25.html)\n\
  \n## 26 数字取整\n\n你经营一个在线音乐服务，客户对每首歌进行评分。你汇总所有客户评分并计算平均值，给歌曲打零到五星。通常，平均会产生一个分数。你需要将其四舍五入到最接近的整数，以便将数字转换为星数。假设平均值已赋给变量`scoreAvg`。以下是将其四舍五入到最接近整数的代码。\n\
  \n`var numberOfStars = Math.round(scoreAvg);`\n\n需要记住的事项：\n\n* `Math.`是所有数学函数的开头。\"\
  M\"必须大写。\n* 当小数为`.5`时，函数向上取整。它将`1.5`取整为`2`，`2.5`取整为`3`，等等。它将`-1.5`取整为`-1`，`-2.5`取整为`-2`，等等。\n\
  \n\n\n\n当结果被赋值给一个新变量时，如上例所示，括号内未取整的数字会被保留。但你可以将取整后的数字赋值给原始变量，这样未取整的数字就会被取整后的数字替换。\n\
  \n```javascript\nscoreAvg = Math.round(scoreAvg);\n```\n\n你也可以在括号内直接放入一个字面数字，而不是变量。\n\
  \n```javascript\nvar scoreAvg = Math.round(.0678437);\n```\n\n要强制 JavaScript 向上取整到最近的整数，无论小数部分多小，请使用\
  \ `ceil` 而不是 `round`。以下代码将 `.000001`（通常向下取整为 `0`）向上取整到最近的整数 `1`。\n\n```javascript\n\
  var scoreAvg = Math.ceil(.000001);\n```\n\n`ceil` 代表“天花板”。它将 `.000001` 向上取整为 `1`，`-.000001`\
  \ 向上取整为 `0`，`1.00001` 向上取整为 `2`，以此类推。\n\n要强制 JavaScript 向下取整到最近的整数，无论小数部分多大，请使用\
  \ `floor` 而不是 `round`。以下代码将 `.999999`（通常向上取整为 `1`）向下取整到 `0`。\n\n```javascript\n\
  var scoreAvg = Math.floor(.999999);\n```\n\n`floor` 将 `.999999` 向下取整为 `0`，`1.9`\
  \ 向下取整为 `1`，`-.000001` 向下取整为 `-1`，以此类推。\n\n本章的交互式编程练习请访问：\n[`www.ASmarterWayToLearn.com/js/26.html`](http://www.ASmarterWayToLearn.com/javascript/26.html)\n\
  \n# 27 生成随机数\n\n假设你想模拟掷骰子。在模拟中，你希望它随机出现 1、2、3、4、5 或 6。第一步是让 JavaScript 生成一个随机数。（嗯，它几乎是随机的，技术上称为伪随机，但对于大多数用途来说已经足够接近随机了。）\n\
  \n以下代码生成一个伪随机数，有 16 位小数，范围从 `0.0000000000000000` 到 `0.9999999999999999`，并将其赋值给变量\
  \ `randomNumber`。\n\n```javascript\nvar randomNumber = Math.random();\n```\n\n函数\
  \ `Math.random()` 总是返回一个 16 位小数，范围从 `0.0000000000000000` 到 `0.9999999999999999`。我们可以通过乘以一百万万亿（1\
  \ 后面跟 17 个零）将这个小数转换为整数：\n\n`0.0000000000000000 * 100000000000000000 = 0`\n`0.7474887706339359\
  \ * 100000000000000000 = 7474887706339359`\n`0.9999999999999999 * 100000000000000000\
  \ = 9999999999999999`\n\n数万亿个可能的数字对于我们的虚拟掷骰子来说太多了。我们只需要六个可能的数字，1 到 6。因此，我们的第一步不是乘以一百万万亿，而是将这个巨大的小数乘以\
  \ 6。\n\n`0.0000000000000000 * 6 = 0`\n`0.7474887706339359 * 6 = 4.7474887706339359`\n\
  `0.9999999999999999 * 6 = 5.9999999999999994`\n\n直觉可能会告诉你，通过取整就能完成，但数学上这行不通。因为没有任何数能向上取整为\
  \ `0`，也没有任何数能向下取整为 `6`，而中间的数字（既可以通过向上取整也可以通过向下取整得到）出现的频率几乎是其他数字的两倍。但如果我们给结果加上 `1`，然后向下取整，就能让所有数字有均等的机会。以下是我们的虚拟掷骰子代码。\n\
  \n```javascript\nvar bigDecimal = Math.random();\nvar improvedNum = (bigDecimal\
  \ * 6) + 1;\nvar numberOfStars = Math.floor(improvedNum);\n```\n\n以上代码逐行执行的操作如下：\n\
  \n1. 生成一个 16 位小数，并赋值给变量 `bigDecimal`。\n2. 将 16 位小数转换为范围从 `0.0000000000000000` 到\
  \ `5.9999999999999999` 的数字，然后加上 `1`，因此范围最终变为 `1.0000000000000000` 到 `6.9999999999999999`。这个数字被赋值给变量\
  \ `improvedNum`。\n3. 将 `improvedNum` 表示的值向下取整到最近的整数，范围从 1 到 6。\n\n本章的交互式编程练习请访问：\n\
  [`www.ASmarterWayToLearn.com/js/27.html`](http://www.ASmarterWayToLearn.com/javascript/27.html)\n\
  \n# 28 将字符串转换为整数和小数\n\n有时 JavaScript 似乎能读懂你的心思。例如，假设你写...\n\n```javascript\nvar\
  \ currentAge = prompt(\"Enter your age.\");\n```\n\n...JavaScript 会将用户的回答作为字符串赋值给\
  \ `currentAge`。她输入的 `32` 在你看来可能是一个数字，但对 JavaScript 来说它是一个字符串：`\"32\"`。\n\n然而，假设你写...\n\
  \n```javascript\nvar currentAge = prompt(\"Enter your age.\");\nvar yearsEligibleToVote\
  \ = currentAge - 18;\n```\n\n在上面的代码中，赋值给变量 `currentAge` 的值是一个字符串，因为它来自用户的提示响应。但在第\
  \ 2 行，当该变量出现在算术表达式中时，该值会自动（且临时地）转换为数字，以便进行数学运算。\n\n类似地，如果你让 JavaScript 将 `\"100\"\
  ` 除以 `2` 或将 `\"2.5\"` 乘以 `2.5`，JavaScript 似乎理解你希望将字符串视为数字，并进行数学运算。你甚至可以让 JavaScript\
  \ 仅使用字符串作为项进行乘法、除法或减法，JavaScript 会正确理解你的意图并进行计算。\n\n```javascript\nvar profit =\
  \ \"200\" - \"150\";\n```\n\n在上面的语句中，两个字符串被视为数字，因为它们出现在数学表达式中。变量 `profit` 尽管有引号，但被赋值为数字\
  \ `50`。\n\n不言而喻，你让 JavaScript 进行数学运算的字符串必须是引号内的数字，例如 `\"50\"`，而不能是字母字符。如果你写...\n\
  \n```javascript\nvar profit = \"200\" - \"duck\";\n```\n\n...会弹出一个显示 `NaN` 的警告，意思是“不是数字”。这没什么好奇怪的。200\
  \ 减去 \"duck\" 怎么可能是一个数字呢？\n\n你可能还记得前一章的内容，当你在包含加号的表达式中混合字符串和数字时，JavaScript 会做与上面例子相反的事情。JavaScript\
  \ 不会将字符串转换为数字，而是将数字转换为字符串。它不会进行加法，而是进行拼接。\n\n```javascript\nvar result = \"200\"\
  \ + 150;\n```\n\n在上面的语句中，JavaScript 看到字符串 `\"200\"` 和数字 `150`，通过将 `150` 转换为字符串 `\"\
  150\"` 来解决冲突。然后它将两个字符串拼接起来。变量 `result` 被赋值为 `\"200150\"`。如果表达式中的 `+` 是其他算术运算符（`-`、`*`\
  \ 或 `/`），JavaScript 会将字符串 `\"200\"` 转换为数字 `200` 并进行数学运算。\n\n你可以看到以下代码会出问题。\n\n```javascript\n\
  var currentAge = prompt(\"Enter your age.\");\nvar qualifyingAge = currentAge +\
  \ 1;\n```\n\n上面的代码有一个意想不到的后果。`currentAge` 表示的字符串与已转换为 `\"1\"` 的 `1` 拼接在一起。例如：如果用户输入\
  \ `\"52\"`，`qualifyingAge` 被赋值的不是 `53`，而是 `\"521\"`。\n\n如果你想进行加法运算，必须将任何字符串转换为数字。\n\
  \n```javascript\nvar currentAge = prompt(\"Enter your age.\");\nvar qualifyingAge\
  \ = parseInt(currentAge) + 1;\n```\n\n第 2 行将 `currentAge` 表示的字符串转换为数字，然后加上 `1`，并将和赋值给\
  \ `qualifyingAge`。\n\n`parseInt` 将所有字符串（包括包含浮点数的字符串）转换为整数。但令人震惊且真实的是：它不会进行四舍五入。它只是截断小数部分。在下面的语句中，`myInteger`\
  \ 被赋值的不是你可能期望的 `2`，而是 `1`。\n\n```javascript\nvar myInteger = parseInt(\"1.9999\"\
  );\n```\n\n要保留任何小数值，请使用 `parseFloat`。在下面的语句中，`myFractional` 被赋值为 `1.9999`。\n\n```javascript\n\
  var myFractional = parseFloat(\"1.9999\");\n```\n\n为了减少混淆，即使 JavaScript 不要求显式转换（例如在混合字符串和数字进行乘法运算时），程序员有时也倾向于进行显式的手动转换。\n\
  \n本章的交互式编程练习请访问：\n[`www.ASmarterWayToLearn.com/js/28.html`](http://www.ASmarterWayToLearn.com/javascript/28.html)\n\
  \n# 29 将字符串转换为数字，将数字转换为字符串\n\n\n\n\n\n## 数字转换与字符串格式化\n\n在上一章中，你学会了使用 `parseInt`\
  \ 将表示数字的字符串转换为整数，以及使用 `parseFloat` 将表示数字的字符串转换为浮点数。你可以通过使用 `Number` 来巧妙处理整数和浮点数之间的区别。这个便捷的转换工具可以将表示整数或浮点数的字符串转换为与括号内数字完全相同的数值。\n\
  \n以下代码将字符串 \"24\" 转换为数字 24。\n\n```javascript\nvar integerString = \"24\"\nvar num\
  \ = Number(integerString);\n```\n\n以下代码将字符串 \"24.9876\" 转换为数字 24.9876。\n\n```javascript\n\
  var floatingNumString = \"24.9876\";\nvar num = Number(floatingNumString);\n```\n\
  \n假设你的代码进行了一次算术运算，得到了一个很大的数字。现在你想将计算结果呈现给用户。但在显示这个数字之前，你想用逗号格式化它，使其更易读。为此，你需要将数字转换为字符串。具体做法如下。\n\
  \n将数字转换为字符串（例如为了格式化）是很直接的。\n\n```javascript\nvar numberAsNumber = 1234;\nvar numberAsString\
  \ = numberAsNumber.toString();\n```\n\n上面的代码将数字 1234 转换为字符串 \"1234\"，并将其赋值给变量 `numberAsString`。\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/29.html`](http://www.ASmarterWayToLearn.com/javascript/29.html)\n\
  \n# 30 控制小数位数\n\n商品的价格是 $9.95。销售税是价格的 6.5%。你将这两个数字相加得到总价。\n\n```javascript\nvar\
  \ total = price + (price * taxRate);\n```\n\n变量 `total` 现在的值是 10.59675。\n\n但这并不是你要向顾客收取的金额，对吧？你要向她收取的是四舍五入到两位小数的金额：$10.60。\n\
  \n具体做法如下。\n\n```javascript\nvar prettyTotal = total.toFixed(2);\n```\n\n上面的语句将 `total`\
  \ 表示的数字四舍五入到 2 位小数，并将结果赋值给变量 `prettyTotal`。括号内的数字告诉 JavaScript 要将小数保留到多少位。\n\n现在加上美元符号，就大功告成了。\n\
  \n```javascript\nvar currencyTotal = \"$\" + prettyTotal;\n```\n\n要将数字缩短到没有小数，只需将括号留空。\n\
  \n```javascript\nvar prettyTotal = total.toFixed();\n```\n\n不幸的是，`toFixed` 方法有一个隐藏的陷阱。如果小数以\
  \ 5 结尾，通常它会像你期望的那样向上舍入。但是，根据浏览器的不同，有时它会向下舍入！例如，如果你对 1.555 应用该方法，并指定保留 2 位小数，它可能会给出\
  \ \"1.56\"，也可能产生 \"1.55\"。\n\n有一些复杂的方法可以解决这个问题。这里有一个不太优雅的修复方法，使用了你已经了解和掌握的方法。\n\n\
  ```javascript\nvar str = num.toString();\nif (str.charAt(str.length - 1) === \"\
  5\") {\n  str = str.slice(0, str.length - 1) + \"6\";\n}\nnum = Number(str);\nprettyNum\
  \ = num.toFixed(2);\n```\n\n如果小数以 5 结尾，代码会将其改为 6，从而强制该方法在应该向上舍入时进行向上舍入。以下是逐行解释：\n\
  \n1. 将数字转换为字符串并赋值给变量 `str`。\n2. 检查最后一个字符是否为 \"5\"。\n3. 如果是，则截掉 \"5\" 并追加 \"6\"。\n\
  4. --\n5. 将其转换回数字。\n6. 将其四舍五入到 2 位小数。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/30.html`](http://www.ASmarterWayToLearn.com/javascript/30.html)\n\
  \n# 31 获取当前日期和时间\n\n你的网页中包含一条通知，告知用户其所在时区的当前本地日期和时间。但当前的日期和时间是多少呢？JavaScript 是这样获取的。\n\
  \n```javascript\nvar rightNow = new Date();\n```\n\n上面的语句创建了一个称为 `Date` 对象的东西。它看起来像这样。\n\
  \n![](img/00005.jpeg)\n\n请注意，JavaScript 是从用户的计算机获取此信息的。其准确性取决于计算机的日期和时间设置。例如，如果用户刚从美国西海岸搬到美国东海岸，并且没有重置计算机上的时区，那么计算机仍将使用太平洋时间。`Date`\
  \ 对象也将使用太平洋时间。\n\n`Date` 对象可能看起来像字符串，但它不是。例如，你不能对其使用像 `charAt`、`indexOf` 或 `slice`\
  \ 这样的方法。\n\n如果你需要将 `Date` 对象转换为字符串，可以像将数字转换为字符串一样进行转换。\n\n```javascript\nvar dateString\
  \ = rightNow.toString();\n```\n\n上面的代码将变量 `rightNow` 表示的 `Date` 对象转换为字符串，并将该字符串赋值给变量\
  \ `dateString`。\n\n大多数情况下，你只想从 `Date` 对象中提取一些信息，而不将其转换为字符串。\n\n我将向你展示如何提取 `Date`\
  \ 对象的各个部分。在本章中，我将从第一部分开始介绍。下一章将介绍其余部分。\n\n以下代码创建一个新的 `Date` 对象，将其赋值给变量 `rightNow`，提取星期几，并将星期几赋值给变量\
  \ `theDay`。\n\n```javascript\nvar rightNow = new Date();\nvar theDay = rightNow.getDay();\n\
  ```\n\n在我上面展示的 `Date` 对象示意图中，星期几表示为 \"Mon\"。但是当你从对象中提取星期几时，它是以数字形式表示的。星期几用 0（星期日）到\
  \ 6（星期六）的数字表示。这意味着你需要一些代码将其转换回像 \"Mon\" 这样的星期名称。\n\n```javascript\nvar dayNames\
  \ = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"];\nvar now =\
  \ new Date();\nvar theDay = now.getDay();\nvar nameOfToday = dayNames[theDay];\n\
  ```\n\n以下是具体过程：\n\n1. 创建一个以 \"Sun\" 开头的星期数组，并将其赋值给 `dayNames`。\n2. 创建一个新的 `Date`\
  \ 对象，并将其赋值给 `now`。\n3. 将星期几作为数字提取出来，并赋值给 `theDay`。\n4. 使用星期数字作为索引来指定正确的数组元素，即星期名称。\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/31.html`](http://www.ASmarterWayToLearn.com/javascript/31.html)\n\
  \n# 32 提取日期和时间的各个部分\n\n以下是提取 `Date` 对象各部分的重要方法总结。\n\n![](img/00006.jpeg)\n\n我在上一章中介绍了\
  \ `getDay`。现在让我们看看其他的提取方法。与 `getDay` 类似，`getMonth` 返回的不是 `Date` 对象中显示的月份全名，而是一个数字。以下代码生成一个月份数字，范围从\
  \ 0（一月）到 11（十二月）。\n\n```javascript\nvar d = new Date();\nvar currentMonth = d.getMonth();\n\
  ```\n\n`getDate` 返回一个表示月份中第几天的数字。\n\n```javascript\nvar dayOfMonth = d.getDate();\n\
  ```\n\n`getFullYear` 返回一个四位数的年份数字。\n\n```javascript\nvar currYr = d.getFullYear();\n\
  ```\n\n`getHours` 返回一个从 0（午夜）到 23（晚上 11 点）的数字。\n\n```javascript\nvar currentHrs\
  \ = d.getHours();\n```\n\n`getMinutes` 返回一个从 0 到 59 的数字。\n\n```javascript\nvar currMins\
  \ = d.getMinutes();\n```\n\n`getSeconds` 返回一个从 0 到 59 的数字。\n\n```javascript\nvar\
  \ currSecs = d.getSeconds()\n```\n\n`getMilliseconds` 返回一个从 0 到 999 的数字。\n\n```javascript\n\
  var currMills = d.getMilliseconds();\n```\n\n`getTime` 返回自 1970 年 1 月 1 日午夜以来经过的毫秒数。\n\
  \n```javascript\nvar millsSince = d.getTime();\n```\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/32.html`](http://www.ASmarterWayToLearn.com/javascript/32.html)\n\
  \n# 33 指定日期和时间\n\n距离美国社会保障计划资金耗尽还有多少天？\n\n我们先从预估日期开始。根据该系统的受托人，资金将在 2035 年耗尽。他们没有确定具体日期。我们就选年中——6\
  \ 月 30 日。\n\n好了，最难的部分——确定末日——已经完成。一旦有了这个日期，构建一个逐日倒计时对 JavaScript 来说就是小菜一碟。\n\n\n\
  \n\n你已经知道如何执行第一步，创建一个表示当前日期和时间的 `Date` 对象：\n\n```javascript\nvar today = new Date();\n\
  ```\n\n接下来，你创建第二个 `Date` 对象。但这次你指定了一个未来的日期，2035 年 6 月 30 日。\n\n```javascript\nvar\
  \ doomsday = new Date(\"June 30, 2035\");\n```\n\n注意日期的指定方式。它被引号括起来。月份是拼写完整的。日期后面有一个逗号。年份用四位数字表示。\n\
  \n接着，你从两个日期中提取自参考日期（1970 年 1 月 1 日）以来经过的毫秒数。\n\n```javascript\nvar msToday = today.getTime();\n\
  var msDoomsday = doomsday.getTime();\n```\n\n你计算差值。\n\n```javascript\nvar msDiff\
  \ = msDoomsday - msToday;\n```\n\n一些简单的数学运算将毫秒转换为天数。\n\n```javascript\nvar dDiff\
  \ = msDiff / (1000 * 60 * 60 * 24);\n```\n\n括号内的数学运算产生的大数字将毫秒转换为秒（`1000`）、分钟（`60`）、小时（`60`）和天（`24`）。\n\
  \n你想要一个表示整天的数字，所以向下取整。下面的语句将天数（可能是一个浮点数）向下取整为整数。\n\n```javascript\ndDiff = Math.floor(dDiff);\n\
  ```\n\n以下是整个过程的浓缩版本，看起来更像生产代码：\n\n```javascript\nvar msDiff = new Date(\"June 30,\
  \ 2035\").getTime() - new Date().getTime();\nvar daysTillDoom = Math.floor(msDiff\
  \ / (1000 * 60 * 60 * 24));\n```\n\n第 1 行将当前时刻自参考日期以来的毫秒数从 2035 年 6 月 30 日自参考日期以来的毫秒数中减去。第\
  \ 2 行将毫秒转换为天数并向下取整。\n\n如果时间很重要，你也可以指定时间。\n\n```javascript\nvar d = new Date(\"July\
  \ 21, 1983 13:25:00\");\n```\n\n注意指定时间的形式：日期后面没有逗号。使用 24 小时制。小时、分钟和秒之间用冒号分隔。\n\n\
  本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/33.html`](http://www.ASmarterWayToLearn.com/javascript/33.html)\n\
  \n# 34 修改日期和时间的元素\n\n你可以修改 `Date` 对象的各个元素。以下是总结：\n\n![](img/00007.jpeg)\n\n`setFullYear`\
  \ 设置现有 `Date` 对象的年份，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\nd.setFullYear(2001);\n\
  ```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的年份改为 2001，保持 `Date` 对象的所有其他元素不变。\n\
  \n`setMonth` 设置现有 `Date` 对象的月份，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\n\
  d.setMonth(11);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的月份改为 11（十二月），保持\
  \ `Date` 对象的所有其他元素不变。\n\n`setDate` 设置现有 `Date` 对象的日期（月份中的第几天），而不改变其他任何元素。\n\n```javascript\n\
  var d = new Date();\nd.setDate(15);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date`\
  \ 对象的日期改为该月的 15 日，保持 `Date` 对象的所有其他元素不变。\n\n`setHours` 设置现有 `Date` 对象的小时数，而不改变其他任何元素。\n\
  \n```javascript\nvar d = new Date();\nd.setHours(13);\n```\n\n第 1 行为当前时刻创建一个新的 `Date`\
  \ 对象。第 2 行将 `Date` 对象的小时数改为 13 时（下午 1 点），保持 `Date` 对象的所有其他元素不变。\n\n`setMinutes`\
  \ 设置现有 `Date` 对象的分钟数，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\nd.setMinutes(05);\n\
  ```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的分钟数改为整点后的 5 分钟，保持 `Date` 对象的所有其他元素不变。\n\
  \n`setSeconds` 设置现有 `Date` 对象的秒数，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\n\
  d.setSeconds(55);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的秒数改为整分钟后的\
  \ 55 秒，保持 `Date` 对象的所有其他元素不变。\n\n`setMilliseconds` 设置现有 `Date` 对象的毫秒数，而不改变其他任何元素。\n\
  \n```javascript\nvar d = new Date();\nd.setMilliseconds(867);\n```\n\n第 1 行为当前时刻创建一个新的\
  \ `Date` 对象。第 2 行将 `Date` 对象的毫秒数改为整秒后的 867 毫秒，保持 `Date` 对象的所有其他元素不变。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/34.html`](http://www.ASmarterWayToLearn.com/javascript/34.html)\n\
  \n# 35 函数\n\n函数是一段 JavaScript 代码块，每当调用它的名称时，它会机械地重复执行相同的操作。它节省了重复编码的工作，并使代码更易于理解。\n\
  \n假设在你的网站上，有几个页面需要显示一个警告框，告诉用户当前时间。（为了简单起见，我们使用 24 小时制，而不转换为上午和下午。）代码可能如下所示：\n\n\
  ```javascript\nvar now = new Date();\nvar theHr = now.getHours();\nvar theMin =\
  \ now.getMinutes();\nalert(\"time: \" + theHr + \":\" + theMin);\n```\n\n你可以每次需要时重复编写这段代码。或者，你可以将其编写为一个函数，并给它命名，比如\
  \ `tellTime`。之后，只需以下代码即可执行整个代码块：\n\n`tellTime();`\n\n每当 JavaScript 看到这条简短语句时，时间显示代码块就会执行。\n\
  \n以下是将上述一次性代码打包为可重复使用函数的方式：\n\n```javascript\nfunction tellTime() {\n  var now =\
  \ new Date();\n  var theHr = now.getHours();\n  var theMin = now.getMinutes();\n\
  \  alert(\"Current time: \"+ theHr + \":\" + theMin);\n}\n```\n\n时间显示代码——创建 `Date`\
  \ 对象、提取时间、格式化并显示警告框的代码——与我们开始时完全一样，但现在被打包成一个函数。以下是各部分说明：\n\n1. 第 1 行是一个声明语句，包含：\n\
  \   - 关键字 `function`\n   - 我为函数起的名称\n   - 标识其为函数的括号\n   - 用于包裹将要执行的代码的左花括号\n2. 第\
  \ 2 到 5 行是你之前看到的相同代码块，但为了清晰进行了缩进。关于缩进多少，意见不一。我训练你缩进 2 个空格。\n3. 第 6 行是单独一行的右花括号，用于包裹将要执行的代码。\n\
  \n再次注意，调用代码——即调用函数的代码——只需写出函数名称及其括号即可。\n\n`tellTime();`\n\n你可以为函数指定任何合法的变量名，然后加上括号。函数命名遵循与变量命名相同的规则，因为从技术上讲，函数*就是*一个变量。当你后续章节了解更多关于函数的知识时，这一点会更有意义。\n\
  \n函数和调用它们的语句可能相隔数千行代码。通常，函数与主代码位于同一位置——在外部 JavaScript 文件中、HTML body 部分的末尾或 HTML\
  \ head 部分中。通常，所有函数应位于主代码之前，这样当主代码调用它们时，它们已经加载到内存中并准备就绪。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/35.html`](http://www.ASmarterWayToLearn.com/javascript/35.html)\n\
  \n# 36 函数：向它们传递数据\n\n函数是一段代码块，每当调用它的名称时，它会机械地执行某些操作。例如，当你编写 `greetUser();` 时，名为该名称的函数就会执行。需要明确的是：我这里讨论的函数是你自己编写并命名的函数。\n\
  \n假设当你编写 `greetUser();` 时，会调用一个函数，该函数显示一个警告框，内容为“Hello, there.”\n\n以下是该函数的代码：\n\n\
  ```javascript\nfunction greetUser() {\n  alert(\"Hello, there.\");\n}\n```\n\n\n\
  \n\n\n## 函数：向函数传递数据\n\n函数的一个非常实用的特性是，调用代码中的括号不必为空。如果你在括号内放入一些数据，就可以将这些数据传递给函数，供其执行时使用。\n\
  \n假设，与其写 `greetUser();`，不如写...\n\n`greetUser(\"Hello, there.\");`\n\n现在，你不仅调用了函数，还向它传递了数据。括号内的字符串，即你传递的数据，被称为`实参`。\n\
  \n函数现在更加灵活了，因为它显示的消息不再被硬编码在函数内部。它会显示你通过实参从调用代码传递过来的任何消息。\n\n为了让函数成为一个可编程的机器人，而不是一个只能做单一工作的机器人，你需要设置它来接收你传递的数据。具体做法如下。\n\
  \n```javascript\nfunction greetUser(greeting) {\n  alert(greeting);\n}\n```\n\n\
  现在，我们填充了调用代码和函数定义的括号。调用代码的括号中包含一个实参。在示例中，实参是字符串 `\"Hello, there.\"`。而且，如上例所示，函数定义的括号中现在包含一个变量\
  \ `greeting`。\n\n函数语句括号内的变量被称为`形参`。形参的名称由你决定。你可以给它取任何合法的变量名。然后你可以在函数体内用它来完成某些操作。在上面的例子中，我用它来指定\
  \ `alert` 中的消息。\n\n当变量在函数定义中用作形参时，你不需要声明它。当它用作形参时，声明是隐式的。\n\n调用函数的语句中的实参——`\"Hello,\
  \ there.\"`——是传递给函数的数据。函数定义括号内的形参捕获传递过来的数据。现在它持有 `\"Hello, there.\"`。换句话说，函数调用中指定的字符串\
  \ `\"Hello, there\"` 被赋值给了函数中的 `greeting`。然后，变量 `greeting` 被用来指定 `alert` 语句中的消息。\n\
  \n传递给函数的值在函数体内被用来完成某些操作。在这个例子中，该值被用来指定 `alert` 中的消息。\n\n在示例中，实参是一个字符串，但它也可以是一个变量。在下面的代码中，我声明了变量\
  \ `greeting` 并将其赋值为 `\"Hello, there.\"`。然后，我没有使用字符串本身作为函数调用中的实参，而是使用了变量。\n\n```javascript\n\
  var greeting = \"Hello, there.\";\ngreetUser(greeting);\n```\n\n在上面的例子中，函数名 `greetUser`\
  \ 与形参 `greeting` 共享了部分名称，但这只是为了便于理解代码。函数名和形参名不必有任何共同之处。请记住，只要遵循变量命名规则，这些名称都由你决定。\n\
  \n在示例中，我将调用代码中的实参命名为 `greeting`，也将函数代码中的形参命名为 `greeting`。但这也不是必须的。它们不必匹配。无论实参的名称是什么，它都会被形参接受，无论形参的名称是什么。在下面的代码中，变量\
  \ `whatever` 是实参。形参 `greeting` 与名称不匹配，但仍然捕获了值。\n\n这是函数，再次带有形参 `greeting`。\n\n```javascript\n\
  function greetUser(greeting) {\n  alert(greeting);\n}\n```\n\n这是调用函数的语句，带有实参 `whatever`。\n\
  \n```javascript\nvar whatever = \"Hello, there.\";\ngreetUser(whatever);\n```\n\n\
  实参和形参的名称不匹配是可以的。形参仍然捕获了实参，即字符串 `\"Hello, there.\"`。不过，为了清晰起见，通常让实参和形参同名是有意义的。\n\n\
  数字，无论是字面数字还是由变量表示的数字，都可以作为实参。在下面的代码中，我声明了变量 `almostAMil` 并为其赋值 `999999`。然后我将 `almostAMil`\
  \ 用作函数调用中的实参。\n\n```javascript\nvar almostAMil = 999999;\nshowBigNum(almostAMil);\n\
  ```\n\n或者，如果我想的话，我也可以使用字面数字 `999999` 作为实参。\n\n`showBigNum(999999);`\n\n你可以向函数传递任意数量的实参，用逗号分隔。通常，函数有相同数量的形参，也用逗号分隔。（特殊情况有罕见的例外。）同样，当你使用变量作为实参时，它们的名称不必与形参的名称匹配。JavaScript\
  \ 根据顺序匹配实参和形参，而不是根据名称。列表中的第一个实参传递给列表中的第一个形参，第二个实参传递给第二个形参，依此类推。\n\n作为实参，你可以使用变量、字符串和字面数字的任意组合。在下面的例子中，调用代码向函数传递了一个变量、一个字符串和一个数字。三个形参捕获了这些值。函数将它们拼接起来创建一条\
  \ alert 消息。\n\n首先，这是函数。\n\n```javascript\nfunction showMessage(m, string, num) {\n\
  \  alert(m + string + num);\n}\n```\n\n现在这是调用函数的语句。\n\n```javascript\nvar month\
  \ = \"March\";\nshowMessage(month, \"'s winner number is \", 23);\n```\n\n实参 `month`（一个变量）被传递给形参\
  \ `m`。实参 `\"'s winning number is \"`（一个字符串）被传递给形参 `string`。实参 `23`（一个字面数字）被传递给形参\
  \ `num`。\n\n当代码执行时，会弹出一条 alert 显示：\"March's winning number is 23.\"\n\n通常，你会使用函数定义中包含的所有形参作为执行代码中的变量，因为如果不是这样，你为什么要将它们包含在函数定义中呢？但并没有规定你必须全部使用它们。而且你当然不必按照它们在括号内出现的顺序来使用它们。每个形参都是一个完整的变量，在函数内部，你可以像使用任何变量一样使用它。\n\
  \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/36.html`](http://www.ASmarterWayToLearn.com/javascript/36.html)\n\
  \n# 37 函数：从函数返回数据\n\n正如你在上一章中学到的，当你向函数传递数据以便它能够完成定制任务时，函数变得更加灵活。但函数还能做更多事情。它可以将数据传递回调用代码。\n\
  \n假设你收取最低运费 $5，加上超过 $50 的商品总额的 3%，最高到 $100。当总额达到 $100 时，你提供免费送货。以下是计算订单总额的代码。\n\n\
  ```javascript\nvar orderTot;\nif (merchTot >= 100) {\n  orderTot = merchTot;\n}\n\
  else if (merchTot < 50.01) {\n  orderTot = merchTot + 5;\n}\nelse {\n  orderTot\
  \ = merchTot + 5 + (.03 * (merchTot - 50));\n}\n```\n\n如果商品总额至少为 $100，则订单总额等于商品总额。如果商品总额为\
  \ $50 或更少，则订单总额为商品总额加 $5。如果订单总额在 $50 到 $100 之间，则订单总额为商品总额加 $5 再加上超过 $50 部分的 3%。\n\
  \n- 价值 $150 的商品，总价为 $150。\n- 价值 $15 的商品，总价为 $20。\n- 价值 $70 的商品，总价为 $75.60。\n\n以下是我们如何将上述代码转换为函数。\n\
  \n```javascript\nfunction calcTot(merchTot) {\n  var orderTot;\n  if (merchTot >=\
  \ 100) {\n    orderTot = merchTot;\n  }\n  else if (merchTot < 50.01) {\n    orderTot\
  \ = merchTot + 5;\n  }\n  else {\n    orderTot = merchTot + 5 + (.03 * (merchTot\
  \ - 50));\n  }\n  return orderTot;\n}\n```\n\n\n\n\n这里要关注的是，我们声明了一个变量 `orderTot`（第\
  \ 2 行），然后——这是新内容——在处理完成且商品总价已知后，函数将 `orderTot` 中保存的值*返回*给调用代码（第 12 行）。它把数据传*回去*。\n\
  \n但调用代码需要某种东西来接收数据。除了变量，还能是什么呢？下面是调用该函数的代码。\n\n```\nvar totalToCharge = calcTot(79.99);\n\
  ```\n\n如果你是编程新手，这条语句可能看起来很奇怪。函数怎么能赋值给变量呢？你可能习惯看到字面量赋值给变量……\n\n```\nvar totalToCharge\
  \ = 85.00;\n```\n\n你可能习惯看到变量赋值给变量……\n\n```\nvar totalToCharge = merchTotal;\n```\n\
  \n你可能习惯看到算术表达式或其他表达式赋值给变量……\n\n```\nvar totalToCharge = merchTotal + ship + tax;\n\
  ```\n\n但是把*函数*赋值给变量？\n\n其实这并不奇怪，因为请记住，你实际赋值给变量的是函数代码中 `return` 语句*传回*的值。这条语句……\n\
  \n```\nvar totalToCharge = calcTot(79.99);\n```\n\n……是以下内容的简写：“将函数 `calcTot` *返回*的值赋值给变量\
  \ `totalToCharge`。”\n\n所以现在调用代码和函数之间有了双向通信。调用代码将值 79.99 传递给函数，由函数的参数 `merchTot`\
  \ 接收。这个变量 `merchTot` 在函数体内用于计算订单总价。然后，通过 `return` 语句，该订单总价被传回给调用代码中的 `totalToCharge`。这是一个完整的循环。\n\
  \n请注意，调用代码中接收值的变量 `totalToCharge` 与函数内部返回值的变量 `merchTot` 是不同的。我特意这样设计，是为了让你明白这两个变量不必同名。在上一章中你学到，当调用代码中的参数将值传递给函数定义中的形参时，它们*可以*同名，但并非必须。同样，函数返回的变量和调用代码中接收它的变量也可以同名，但并非必须。\n\
  \n任何可以使用变量的地方，都可以使用函数。（从技术上讲，函数*就是*一种变量。）例如……\n\n你可以使用函数来指定 alert 中的消息。\n\n```\n\
  alert(calcTot(79.99));\n```\n\n在上面的例子中，alert 消息是函数 `calcTot` 在传入参数 79.99 时返回的值。\n\
  \n你可以在表达式中使用函数。\n\n```\nvar orderTot = merchTot + calcTax(merchTot);\n```\n\n在上面的例子中，赋值给\
  \ `orderTot` 的值是 `merchTot` 与函数 `calcTax` 在传入参数 `merchTot` 时返回的值之和。\n\n你可以在函数调用中使用函数。\n\
  \n```\nvar tot = calc(merchTot, calcTax(merchTot));\n```\n\n在上面的例子中，调用代码向函数 `calc`\
  \ 传递了两个参数。第一个参数是 `merchTot`。第二个参数是函数 `calcTax`，它也接收 `merchTot` 作为参数。\n\n在函数内部，你可以调用另一个函数。\n\
  \n```\n1 function calcTot(price) {\n2   return price + calcShip(price);\n3 }\n```\n\
  \n在上面的例子中，函数 `calcTot` 调用了函数 `calcShip`。它将 `price` 作为参数传递，并接收返回的运费。它将运费加到价格上，然后将总和作为总价返回给原始调用代码。\n\
  \n你已经知道可以向任意数量的参数传递任意数量的参数。不幸的是，在 `return` 语句中你没有这种灵活性。无论函数需要多少个参数或进行多少处理，它只能向调用它的代码返回一个值。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/37.html`](http://www.ASmarterWayToLearn.com/javascript/37.html)\n\
  \n# 38 函数：局部变量与全局变量\n\n现在我们讨论变量*作用域*的问题。也就是*全局*变量和*局部*变量的区别。有些变量具有全局作用域，因此它们是全局变量。其他变量具有局部作用域，因此它们是局部变量。这再简单不过了，但不知为何，当书籍和教程中提到这个话题时，往往晦涩难懂。放松点，这很容易。\n\
  \n全局变量是在代码主体中声明的变量——也就是说，*不是*在函数内部声明的。\n\n局部变量是在函数内部声明的变量。它可以是函数的参数（通过被命名为参数而隐式声明），也可以是函数内部使用\
  \ `var` 关键字显式声明的变量。\n\n全局变量之所以是全局的，是因为它在代码的每个部分都有意义，无论该代码是在主体中还是在任何函数中。全局作用域就像全球知名度。无论你走到世界哪个角落，他们都听说过比尔·克林顿。\n\
  \n局部变量是仅在其声明的函数内部有意义的变量。局部作用域就像本地知名度。德卢斯市长在德卢斯广为人知，但在其他地方几乎无人知晓。\n\n因此，全局变量和局部变量有两个区别——它们声明的位置，以及它们被知晓和可以使用的位置。\n\
  \n![](img/00008.jpeg)\n\n在我展示第一个例子之前，我希望你暂时抛开关于通过参数向函数传递值以及通过 `return` 语句将值传回调用代码的知识。假装你对这些一无所知。我稍后会再回到这些话题。下面是一个例子。\n\
  \n首先，在主代码中，声明一个变量，然后调用一个函数：\n\n```\n1 var theSum\n2 addNumbers();\n```\n\n然后是函数：\n\
  \n```\n1 function addNumbers() {\n2   theSum = 2 + 2;\n3 }\n```\n\n在这个例子中，变量 `theSum`\
  \ 在主代码中声明。调用函数 `addNumbers` 来给它赋值。由于变量是在主代码中声明的，它具有全局作用域，因此这个函数或任何其他函数都可以使用它。主代码中的任何内容也可以使用它。函数将\
  \ 2 + 2 的和赋值给这个全局变量。由于变量具有全局作用域，这个赋值在代码的所有部分（主代码和所有函数）都有意义。现在，变量在函数 `addNumbers`、主代码以及任何使用它的其他函数中都具有值\
  \ 4。无论我在哪里写……\n\n```\nalert(theSum);\n```\n\n无论我写在哪里——在主代码中、在函数 `addNumbers` 中，还是在任何其他函数中——alert\
  \ 都会显示数字 4。\n\n但如果我不在主代码中声明变量，而是在函数内部声明……\n\n```\n1 function addNumbers() {\n2 \
  \  var theSum = 2 + 2;\n3 }\n```\n\n……那么变量只在函数内部具有值 4。在其他任何地方，它都是未知的。在其他任何地方，它根本没有值。由于变量\
  \ `theSum` 是在函数内部使用关键字 `var` 声明的，而不是在主代码中，它的作用域是局部的。它只在函数内部有意义。在其他函数和主代码中，它是未知的。如果我写……\n\
  \n```\nalert(theSum);\n```\n\n……在函数内部，alert 会显示数字 4，因为变量 `theSum` 在其声明的函数内部是已知的。但如果我在其他地方——主代码或另一个函数中——写同样的\
  \ alert 语句，代码就会出错，因为 `theSum` 在函数外部是未知的。\n\n\n\n\n## 全局作用域与局部作用域\n\n**注意：** 当你在函数中声明变量时，我称该变量具有局部作用域。所谓“在函数中声明它”，是指你使用关键字\
  \ `var` 显式地声明该变量——而不是随意地在函数中引入它而不加 `var`。（例外情况是，如果你将其命名为参数，那么它会隐式地声明为函数的局部变量。）如果你变得马虎，开始在函数体内使用一个新变量，却没有在函数中用关键字\
  \ `var` 显式声明它，那么它就是全局变量——即使你在主代码中任何地方都没有声明它。\n\n现在，为了说明一个要点，我将做一些你在实际代码中绝不会想做的事情。我将在主代码和函数中同时声明一个变量。\n\
  \n首先，在主代码中：\n```javascript\nvar theSum = 1000;\naddNumbers();\n```\n\n然后在函数中：\n\
  ```javascript\nfunction addNumbers() {\n  var theSum = 2 + 2;\n}\n```\n\n通过两次声明变量——一次在主代码中，一次在函数中——我创建了两个同名但不同的变量。一个\
  \ `theSum` 是全局的，另一个 `theSum` 是局部的。这不是你希望做的事情——它会让你陷入编码错误，并使你的代码几乎无法理解——但我这样做是为了展示全局作用域和局部作用域的区别。\n\
  \n通过在主代码中声明一次 `theSum`，再在函数中声明一次，我创建了（1）一个几乎在任何地方都可用的全局变量，以及（2）一个同名的、*仅*在函数内部可用的局部变量。为什么我说全局变量几乎在任何地方可用？因为它在函数内部无效。在函数内部，名称\
  \ `theSum` 代表一个局部变量，因此该名称无法引用全局变量。在这种情况下，程序员会说全局变量被局部变量*遮蔽*了。在函数内部，它不可见。在函数内部，只能看到同名的局部变量。\n\
  \n局部变量 `theSum` 在函数内部的值为 4，但函数外部的 `theSum` 值为 1000。\n\n现在，让我们继续深入这个仙境，爱丽丝。\n\n首先，主代码中的一条语句：\n\
  ```javascript\nvar theSum = addNumbers();\n```\n\n然后是一个函数：\n```javascript\nfunction\
  \ addNumbers() {\n  var theSum = 2 + 2;\n  return theSum;\n}\n```\n\n同样，这不是你实际会编写的代码。我仅用这个例子来演示原理。在这段代码中，你仍然有两个不同的变量——一个全局变量和一个局部变量——它们共享同一个名称\
  \ `theSum`，但现在，得益于 `return` 语句，局部变量的值被赋给了全局变量。现在两个变量具有相同的名称和相同的值，但它们仍然是不同的变量。\n\n\
  这引出了你可能想问的一个问题：\n\n如果一个函数可以使用全局变量，为什么还必须通过参数传递值？为什么不直接声明一个全局变量，然后让函数使用它？嗯，你可以这样做，但要求函数与全局变量打交道，就是要求它们“偷听”主代码，就像人类偷听一样，这会引发混乱和意外后果的麻烦。程序员对此没有争议。始终通过参数显式地向函数传递值是最好的做法。全局变量在函数中没有立足之地。\n\
  \n同样的逻辑也适用于使用 `return` 语句的理由。你*可以*在函数内部更改全局变量的值。当你这样做时，它的值会在所有地方改变，包括主代码中。不需要 `return`。但更好的做法是在函数内部使用局部变量，然后通过\
  \ `return` 语句显式地将该值传递回去。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/38.html`](http://www.ASmarterWayToLearn.com/javascript/38.html)\n\
  \n# 39. `switch` 语句：如何开始\n\n考虑下面这一连串的条件语句。\n```javascript\nif (dayOfWk === \"Sat\"\
  \ || dayOfWk === \"Sun\") {\n  alert(\"Whoopee!\");\n} else if (dayOfWk === \"Fri\"\
  ) {\n  alert(\"TGIF!\");\n} else {\n  alert(\"Shoot me now!\");\n}\n```\n\n如果是周末，则显示“Whoopee!”警告框。如果是星期五，则显示“TGIF”警告框。如果是工作日，则显示“Shoot\
  \ me now”警告框。\n\n它能工作，但笨重且有点丑陋，尤其是当你要测试许多条件时。现在是时候学习一种更优雅的替代方案了，你可以用它来测试无数条件，那就是\
  \ `switch` 语句。你需要测试的条件越多，你就会越喜欢 `switch` 语句。下面的 `switch` 语句复制了上面示例的功能：\n\n```javascript\n\
  switch(dayOfWk) {\n  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case\
  \ \"Sun\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"\
  TGIF!\");\n    break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\n现在，我希望你只关注上面代码的前三行。\n\
  \n1. 以关键字 `switch` 开头。紧挨着它的是被测试的变量，放在括号内。然后是一个左花括号。\n2. 第一种可能性，即变量 `dayOfWeek` 的值为\
  \ `\"Sat\"`。以关键字 `case` 开头。然后是被尝试的值 `\"Sat\"`。接着是一个空格和一个冒号。\n3. 如果测试通过——即 `dayOfWeek`\
  \ 确实等于 `\"Sat\"`——则执行的语句。该语句缩进。如果测试通过，可以执行任意数量的语句。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/39.html`](http://www.ASmarterWayToLearn.com/javascript/39.html)\n\
  \n# 40. `switch` 语句：如何完成\n\n在上一章中，你关注了下面这个 `switch` 语句的前三行。\n\n```javascript\nswitch(dayOfWk)\
  \ {\n  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Sun\" :\n \
  \   alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"TGIF!\");\n \
  \   break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\n在本章中，你将处理剩下的代码。\n\
  \n`if` 语句的第一行后面跟着一条（或多条）在条件为真时执行的语句。`switch` 语句的工作方式类似。在每个 `case` 子句的下一行，有一条（或多条）在该\
  \ case 为真时执行的语句。\n\n再次强调，如果 case 为真，则执行的代码缩进 2 个空格。（普遍约定是缩进一定量。关于最佳缩进量，意见不一。我统一使用\
  \ 2 个空格的缩进，这很常见，但远非普遍。）\n\n但为什么除了最后一个 case 之外，所有 case 都包含一个 `break` 语句呢？\n\nJavaScript\
  \ 有一个不方便的怪癖：在找到真 case 后，JavaScript 不仅会执行该 case 下面的语句，还会执行*所有*下面 case 的*所有*语句。因此，在找到真\
  \ case 并执行条件代码后，你需要通过编写 `break` 语句跳出 `switch` 块。例如，如果你在上面的代码中省略了 `break` 语句，会发生以下情况：\n\
  \n1. 显示一个警告框，内容为“Whoopee!”\n2. 显示第二个警告框，内容为“Whoopee!”\n3. 显示第三个警告框，内容为“TGIF!”\n\
  4. 显示第四个警告框，内容为“Shoot me now.”\n\n现在让我们看第 11 行。\n```javascript\ndefault :\n  alert(\"\
  Shoot me now!\");\n}\n```\n\n关键字 `default` 的作用类似于 `if...else` 语句中的 `else`。它后面的代码在以上条件都不满足时执行。因此，在上面的示例中，如果\
  \ `dayOfWk` 不是 `\"Sat\"`、`\"Sun\"` 或 `\"Fri\"`——即它*是*这三个值以外的任何值——则显示一个警告框，内容为“Shoot\
  \ me now.”\n\n注意，`default` 后面跟一个空格和一个冒号，就像上面的 `case` 子句一样。\n\n还要注意，没有 `break` 语句。这是因为\
  \ `default` 总是放在最后，这意味着它下面没有需要不当执行的语句。\n\n\n\n\n\n在 switch 语句中，`default` 代码是可选的，就像\
  \ `if` 语句中 `else` 代码是可选的。如果没有 `default` 代码，且没有任何 case 测试为真，则什么也不会发生。\n\n当没有 `default`\
  \ 代码时，细心的程序员仍然会在最后一个条件后加上 `break` 语句作为保险，即使它可能是多余的。如果你以后决定在末尾添加一个新条件，就不必记得为上面的块添加\
  \ break，以避免灾难性的语句级联。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/40.html`](http://www.ASmarterWayToLearn.com/javascript/40.html)\n\
  \n# 41\n\n## `while` 循环\n\n这个 `for` 循环在每次迭代时显示一个警告框。\n\n```\nfor (var i = 0; i <=\
  \ 3; i++) {\n  alert(i);\n}\n```\n\n如你所知，该过程由括号内的三个术语控制：\n\n*   `var i = 0` 建立一个计数器。\n\
  *   `i <= 3` 表示只要 `i` 小于或等于 3，循环就继续运行。由于 `i` 初始赋值为 0，循环将运行 4 次。\n*   `i++` 在每次迭代时递增\
  \ `i`。\n\n所有关于如何循环的指令都集中在括号之间：从哪里开始计数，循环持续多久，以及每次如何更新计数器。\n\n`while` 循环做同样的事情，但组织方式不同。只有中间项（循环持续多久）放在括号内。计数器在\
  \ `while` 块的第一行*之前*定义。计数器在循环运行时执行的代码*内部*更新。\n\n```\nvar i = 0;\nwhile (i <= 3) {\n\
  \  alert(i);\n  i++;\n}\n```\n\n在其他方面，`while` 循环的组织方式与 `for` 循环类似。\n\n*   括号包围循环限制条件。\n\
  *   花括号包围要执行的代码。\n*   要执行的代码缩进 2 个空格。\n\n由于任何 `for` 循环都可以转换为 `while` 循环，反之亦然，你可以使用你喜欢的任何一种。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/41.html`](http://www.ASmarterWayToLearn.com/javascript/41.html)\n\
  \n# 42\n\n## `do...while` 循环\n\n在 `while` 循环中，指令的顺序是：\n\n1.  声明一个变量作为计数器，并为其赋值。\n\
  2.  启动循环，指定循环运行多长时间。\n3.  执行一条或多条语句。\n4.  在循环内部，作为最后一条语句，递增计数器。\n\n```\nvar i =\
  \ 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\n`do...while` 循环完成的任务与 `while`\
  \ 循环*几乎*相同。\n\n```\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i <= 3);\n```\n\
  \n两种循环之间的区别：\n\n*   关键字 `do` 代替 `while` 作为语句的开头。\n*   `while` 子句（包括括号内的循环限制代码）移到了底部——*在*右花括号之后。\n\
  \n注意 `while` 子句以分号结尾。\n\n在功能上，`while` 循环和 `do...while` 循环的区别在于，可以编写一个 `while` 语句，使其指令块永远不会执行。考虑这个\
  \ `while` 循环。\n\n```\nvar i = 0;\nwhile (i < 0) {\n  alert(i);\n  i++;\n}\n```\n\
  \n代码说只要计数器小于 0，就持续显示警告框。但由于计数器从未小于 0，花括号内的代码永远不会执行。\n\n将其与 `do...while` 循环进行比较。\n\
  \n```\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i < 0);\n```\n\n警告框将显示一次，即使继续运行的条件——`i`\
  \ 小于 0——从未发生。由于 `do...while` 循环在到达底部的循环限制器*之前*执行花括号内的代码，因此无论循环限制器如何，它总是至少执行一次该代码。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/42.html`](http://www.ASmarterWayToLearn.com/javascript/42.html)\n\
  \n# 43\n\n## 放置脚本\n\nJavaScript 代码不关心它位于何处。它可以混合在——即嵌入在——创建网页的 HTML 中。或者，像外部 CSS\
  \ 文件一样，它可以放在由 HTML 文件加载的单独文件中。在大多数情况下，最好使用外部 JavaScript 文件，原因与最好使用外部 CSS 文件相同。但你仍然需要知道如何将\
  \ JavaScript 放置在 HTML 文件中，所以我们先从这里开始。\n\n如你所知，HTML 代码的顺序很重要，因为它决定了页面上元素的顺序。如果你希望标题出现在文本上方，你需要在\
  \ HTML 中将标题放在文本上方。但 JavaScript 的工作方式不同。例如，你所有的 JavaScript 函数在页面加载时都会被加载到内存中。无论代码在哪里，浏览器都会在页面加载完成时找到并存储它。一旦页面加载完成，所有\
  \ JavaScript 代码都会保留在内存中，随时准备执行，只要页面显示。\n\n你可以合法地将 JavaScript 代码放在 HTML 文件中的几乎任何位置——在\
  \ head 部分、body 部分的开头、body 部分的中间某处或 body 部分的末尾。如果你愿意，你甚至可以将不同的 JavaScript 函数分散在 HTML\
  \ 文件的不同位置。浏览器会自行整理。\n\n不过，通常放置脚本的最佳位置是在 body 部分的末尾。这可以确保 CSS 样式和图像显示不会因为脚本加载而延迟。\n\
  \n当你将 JavaScript 代码块嵌入 HTML 中（而不是使用单独的 JavaScript 文件）时，必须将 JavaScript 代码放在 `<script>`\
  \ 和 `</script>` 标签之间。以下是两个函数放在标签之间的示例。\n\n```\n<script>\nfunction sayHi() {\n  alert(\"\
  Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n}\n</script>\n\
  ```\n\n你可以在 `<script>` 和 `</script>` 标签之间放置任意数量的代码——包括任意数量的函数。而且，正如我之前提到的，如果你愿意，你可以将不同的代码段分散在\
  \ HTML 文件中的任何位置。但每个代码段都必须放在 `<script>` 和 `</script>` 标签之间。\n\n大多数情况下，程序员更倾向于将所有或大部分\
  \ JavaScript 代码放在一个单独的 JavaScript 文件中，然后让浏览器在加载 HTML 文件的同时加载这个外部文件。\n\nJavaScript\
  \ 文件与 HTML 和 CSS 文件一样，是一个纯文本文件。它没有头部或任何其他特殊部分。它甚至没有 `<script>` 和 `</script>` 标签。它只是纯粹的\
  \ JavaScript 代码。包含上述示例中两个函数的 JavaScript 文件的全部内容将是：\n\n```\nfunction sayHi() {\n\
  \  alert(\"Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n}\n\
  ```\n\n使 JavaScript 文件成为 JavaScript 文件的是它的文件扩展名：`.js`。文件名开头部分由你决定，只要合法即可。以下任何一个都可以。\n\
  \n*   `scripts.js`\n*   `coreJS.js`\n*   `main-code.js`\n*   `main_code.js`\n* \
  \  `main.code.js`\n\n在 HTML 文件中包含 JavaScript 文件的方式与包含外部 CSS 文件的方式相同——使用一对开始和结束标签。\n\
  \n`<script src=\"whatever.js\"></script>`\n\n出于与将 JavaScript 代码放在 body 部分末尾相同的原因，最好将包含\
  \ JavaScript 文件的标记放在 body 部分的末尾。\n\n你可以包含任意数量的外部 JavaScript 文件。\n\n你可以包含 JavaScript\
  \ 文件，同时在 HTML 中嵌入其他 JavaScript 代码。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/43.html`](http://www.ASmarterWayToLearn.com/javascript/43.html)\n\
  \n# 44.\n\n## 注释\n\n\n\n\n\n注释，正如你在处理 HTML 和 CSS 时所了解的，是一种告诉浏览器忽略代码正文中某些文本部分的方式。注释是为人类而非机器服务的。它们能帮助你和他人日后修改代码时理解其含义。你还可以使用注释来*注释掉*部分代码，以便进行测试和调试。由于与\
  \ HTML 或 CSS 相比，JavaScript 在日后回顾时通常更难理解，你可能需要花更多精力为 JS 代码添加注释，尤其是在团队协作或未来可能由他人维护你的代码的情况下。\n\
  \n在 HTML 中，只有一种方式将文本标记为注释：使用 `<!--` 开头，`-->` 结尾。在 CSS 中，也只有一种方式：使用 `/*` 开头，`*/`\
  \ 结尾。但在 JavaScript 中，有两种方式将文本标记为注释。\n\n第一种方式是标记单行注释，如下面第 1 行所示。\n\n```\n1 // 这是一条注释，浏览器会忽略它\n\
  \n2 for (var i = 0; i\n\n3   if (animals[i] === \"bat\") {\n\n4     animals[i] =\
  \ \"cat\";\n\n5   }\n\n6 }\n```\n\n两个斜杠表示：“从这到行尾的所有内容都是注释。”在上面的例子中，由于斜杠位于行首，因此整行都是注释。但你也可以写一行既有代码又有注释的内容，像这样：\n\
  \n```\nvar animals = []; // 声明一个空数组\n```\n\n你可以写任意多行注释。每一行都必须以两个斜杠开头。\n\n```\n//\
  \ 每一行注释都必须以一对\n\n// 斜杠开头，就像这样。（顺便提一下，大多数代码编辑器\n\n// 都能智能识别注释，并以不同颜色渲染，\n\n// 方便你轻松区分\n\
  \n// 注释与代码。）\n```\n\n当你使用斜杠注释时，没有结束标签，因为行尾会自动结束注释。\n\n为了可读性，请在两个斜杠与注释内容之间加一个空格。当你在同一行中混合代码与注释时，请在代码与两个斜杠之间加一个空格。\n\
  \n当注释需要多行时，许多程序员更喜欢另一种方法。作为 CSS 用户，你已经熟悉这些标签了。\n\n```\n/*\n\n当注释需要多行时，\n\n像这样的块注释，带有开始\n\
  \n和结束标签，是更好的选择。\n\n*/\n```\n\nJavaScript 的多行注释标签与 CSS 注释标签相同。以 `/*` 开头，以 `*/` 结尾。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/44.html`](http://www.ASmarterWayToLearn.com/javascript/44.html)\n\
  \n# 45\n\n## 事件：链接\n\n一个好的网站是一个响应式的网站。用户执行某个操作——点击按钮、移动鼠标、按下按键——然后就会发生一些事情。JavaScript\
  \ 提供了多种方式来响应用户的需求。举几个例子：\n\n用户点击一个写着“我们的承诺”的按钮，弹出一个提示框，详细说明承诺内容。\n\n页面显示一张模特的“之前”照片。当用户将鼠标悬停在照片上时，照片会替换为她的“之后”照片。\n\
  \n用户在表单的“盎司”字段中输入一个数字。当她点击“克”字段时，会显示对应的克数。\n\n用户已在表单中输入了她的电子邮件地址，正准备输入评论。当她将光标从电子邮件字段移动到评论字段时，JavaScript\
  \ 会检查电子邮件地址是否有效。在这个例子中，地址无效——她省略了地址末尾的“.com”。一条消息会显示，告知她输入了无效的电子邮件地址。\n\n在一个在线购物网站上，有一张黑色手表的图片。旁边有一个下拉列表，要求用户选择颜色。当她选择后，图片中手表的颜色会变为所选颜色。\n\
  \n所有这些用户操作——点击按钮、移动鼠标、在表单字段间切换、选择不同选项——都被称为*事件*。响应事件的 JavaScript 代码（例如，当指针悬停时显示承诺或交换图像）被称为*事件处理程序*。\n\
  \n在本章及接下来的几章中，你将学习最古老、最直接的事件处理方法——*内联*事件处理。当你编写生产代码时，这并不是处理事件的最佳方式，原因与内联 CSS 样式不是格式化\
  \ HTML 元素的最佳方式相同。但由于这是最不抽象的方法，因此最容易学习，并且可以作为更高级方法的垫脚石。在本书后面，你将学习大多数专业人士更青睐的方法——*脚本化*方法。\n\
  \n内联事件处理意味着你将 JavaScript 代码片段与 HTML 标记混合在一起。下面是一行代码，它显示一个链接，并在用户点击时显示一个提示框。\n\n\
  `<a href=\"#\" onClick=\"alert('Hi');\">点击</a>`\n\n作为 HTML 编码者，你熟悉这段标记的开头和结尾：`<a\
  \ href=` 和 `>点击</a>`\n\n但当用户点击这个链接时，它的行为与普通超链接不同。它不会将用户带到另一个页面或同一页面的命名锚点，而是显示一个写着“Hi”的提示框。\n\
  \n当用户点击链接时，它不会跳转到任何地方，而是执行一条 JavaScript 语句，在本例中是调用一个函数。\n\n我们来分解一下。\n\n*   当用户点击链接时，你并不希望加载新网页，因此，在引号内放置一个\
  \ `#` 而不是 URL。这告诉浏览器重新加载当前页面。\n\n*   `onClick=` 表示：“当按钮被点击时，执行以下 JavaScript。”`onClick`\
  \ 不区分大小写。你可以写成 `onclick`、`ONCLICK` 或 `OnClIcK`，都能正常工作。但惯例是 `onClick`，所以我们沿用这个写法。\n\
  \n*   后面跟着一个或多个 JavaScript 语句，用引号括起来。当用户点击链接时，这些语句会被执行。\n\n还有一点需要注意：`onClick=\"\
  alert('Hi');\"` 括号内的消息用单引号括起来，而不是我们之前用于提示字符串的双引号。在 JavaScript 代码中，不允许在双引号内嵌套双引号，也不允许在单引号内嵌套单引号。由于整个\
  \ JavaScript 语句被双引号括起来，因此必须将提示消息用单引号括起来。\n\n但上面的标记存在一个问题。`<a href=\"#\"` 告诉浏览器重新加载页面。这意味着如果用户已经滚动到链接位置，点击除了运行\
  \ JavaScript 代码外，还会将页面滚动回顶部——这通常不是你希望的操作。我之所以展示这种有缺陷的方法（使用 `<a href=\"#\"`），是因为你会在其他人的代码中偶尔遇到它，但你可能会更喜欢这种方法：\n\
  \n`<a href=\"JavaScript:void(0)\" onClick=\"alert('Hi');\">点击</a>`\n\n现在你得到了你想要的：除了执行的\
  \ JavaScript 之外，什么都不会发生。\n\n在上面的例子中，点击只执行一条 JavaScript 语句。但引号内可以包含任意数量的 JavaScript\
  \ 语句。当然，除了常识限制外，没有数量限制。正如你将看到的，有比将多条语句塞进一个内联 `onClick` 事件更好的触发 JavaScript 的方法。但让我通过这个例子向你展示原理。当用户点击时，第一条语句将\
  \ `'hi'` 赋值给一个变量，第二条语句显示一个提示框，将变量指定为消息。\n\n`<a href=\"JavaScript:void(0)\" onClick=\"\
  var greet='hi'; alert(greet);\">点击</a>`\n\n正如我所说，专业编码人员不赞成使用内联 JavaScript。但如果你*确实*使用这种方法，更专业的方式是调用一个函数。\n\
  \n下面是一个函数。\n\n```\n1 function popup(message) {\n\n2   alert(message);\n\n3 }\n```\n\
  \n这是调用该函数的事件处理程序。\n\n`<a href=\"JavaScript:void(0)\" onClick=\"popup('Hi');\">点击</a>`\n\
  \n\n\n\n\n当用户点击链接时，事件处理程序会调用该函数，并将参数 `'Hi'` 传递给它。该函数会显示一个提示框，内容为 `'Hi'`。\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/45.html`](http://www.ASmarterWayToLearn.com/javascript/45.html)\n\
  \n# 46\n\n事件：按钮\n\n在上一章中，你学会了如何重新利用链接，使其在被点击时触发事件，而不是加载新页面。你学会了使用*内联*事件处理，这不是最佳方式，但最容易学习。在本书后面，你将学习大多数专业人士更青睐的方法——*脚本*方法。\n\
  \n但即使你使用内联方法，当你想给用户提供可点击的内容时，通常更专业的方法是使用按钮而不是链接。\n\n假设当用户点击按钮时，会弹出一个提示框，显示“Hello\
  \ world!”。\n\n代码如下：\n\n```\n<input type=\"button\" value=\"Click\" onClick=\"alert('Hello\
  \ world!');\">\n```\n\n无论你编写的是链接还是按钮，事件处理程序都是一样的：`onClick=\"alert('Hello world!');\"\
  `\n\n但代码的开头不同：`<input type=\"button\" value=\"Click\"`\n\n一些专业人士可能会认为按钮代码应该包含在 *form*\
  \ 标签中，但这并非绝对必要。而且，既然我们已经通过使用内联事件处理程序违反了最佳实践，为什么不通过多次违规来让专业人士震惊呢？（你将在本书后面学习到比内联事件处理程序更体面的替代方案。）\n\
  \n作为 HTML 编码人员，你知道可以将图像用作热链接。标记看起来像这样：\n\n```\n<a href=\"summary-page.html\"><img\
  \ src=\"button-sum-pg.png\"></a>\n```\n\n你也可以使用图像来触发事件。假设当用户点击图像时，会弹出一个提示框。代码如下。请注意，内联事件处理程序的代码与之前相同。\n\
  \n```\n<img src=\"button-greet.png\" onClick=\"alert('Hello world!');\">\n```\n\n\
  或者，如果你想更专业一些，可以让事件触发一个函数。\n\n```\n<img src=\"button-greet.png\" onClick=\"greetTheUser();\"\
  >\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/46.html`](http://www.ASmarterWayToLearn.com/javascript/46.html)\n\
  \n# 47\n\n事件：鼠标\n\n你已经学会了如何通过使用*内联*事件处理，在用户点击链接、按钮或图像时触发操作。内联事件处理不是最佳方法，但最容易学习。在本书后面，你将学习大多数专业人士更青睐的方法——*脚本*方法。\n\
  \n但无论你使用内联方法还是更受青睐的脚本方法，`onClick` 事件只是你的代码可以响应的众多事件类型之一。在本章中，你将学习如何在用户将鼠标悬停在页面上的某个元素上时，以及当用户将鼠标移开时触发操作。\n\
  \n假设你的页面最初显示一张模特的“之前”照片。当用户将鼠标悬停在照片上时，它会被替换为“之后”照片。你可能更倾向于使用 CSS 来实现，但由于这是一本 JavaScript\
  \ 书籍，我将向你展示如何使用事件处理程序来实现。\n\n以下是将*之前*照片替换为*之后*照片的标记：\n\n```\n<img src=\"before-pic.jpg\"\
  \ onMouseover=\"src='after-pic.jpg'\">\n```\n\n它以一个普通的图像标签开始：`<img src=\"before-pic.jpg\"\
  `\n\n然后是事件处理关键字。该关键字采用驼峰式命名——可选但广泛使用：`onMouseover`\n\n关键字 `onMouseover` 后面跟着一个等号，就像\
  \ `onClick` 一样。然后是事件的响应，用引号括起来：`\"src='after-pic.jpg'\"`\n\n你可能会惊讶地发现，事件的响应并不是用\
  \ JavaScript 编写的。它是 HTML 标记。\n\n注意：图像源必须用单引号括起来，因为整个短语被双引号包围。\n\n你也可以将 `onMouseover`\
  \ 事件处理用于其他 HTML 元素。以下是一段内联代码，当鼠标悬停在标题上时会显示一个提示框：\n\n```\n<h1 onMouseover=\"alert('Be\
  \ sure to get your shopping done today.');\">World Ends Tomorrow</h1>\n```\n\n当用户将鼠标悬停在标题上时，会显示一个提示框。\n\
  \n在上面的例子中，你可能更倾向于调用一个显示提示框的函数，而不是内联编写提示框代码。\n\n以下是 CSS 悬停颜色变化的 JavaScript 替代方案：\n\
  \n```\n<a href=\"index.html\" onMouseover=\"this.style.color='green';\">Home Page</a>\n\
  ```\n\n当用户将鼠标悬停在链接上时，它会变成绿色。\n\n此时，不必担心示例中 `this.style.color` 的整体概念。现在只需记住这个序列，以便在练习中重复使用。\n\
  \n在下一个示例中，当用户将鼠标悬停在段落上时，段落会展开以包含更多信息：\n\n```\n<p id=\"loris\" onMouseover=\"expand();\"\
  >Slow Loris: Mouse over for more info</p>\n```\n\n此时，不必担心 `expand` 函数如何扩展段落。你将在后面学习到。\n\
  \n在我们开始的示例中，模特的“之前”和“之后”照片，当用户将鼠标悬停在图像上时，`onMouseover` 事件处理程序会将“之前”照片替换为“之后”照片。通常，你会希望当用户将鼠标移开图像时，图像恢复为原始状态。因此，你可以将\
  \ `onMouseover` 事件处理程序与 `onMouseout` 事件处理程序结合使用。\n\n```\n<img src=\"before-pic.jpg\"\
  \ onMouseover=\"src='after-pic.jpg'\"\nonMouseout=\"src='before-pic.jpg'\">\n```\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/47.html`](http://www.ASmarterWayToLearn.com/javascript/47.html)\n\
  \n# 48\n\n事件：字段\n\n假设你有一个用于输入用户电子邮件地址的文本字段。当用户点击该字段输入内容时，字段变为黄色。\n\n以下是实现这一效果的标记：\n\
  \n```\nEmail:<br>\n<input type=\"text\" size=\"30\" onFocus=\"this.style.backgroundColor='yellow';\"\
  >\n```\n\n再次强调，我向你展示的是不推荐的*内联*事件处理方式，将其作为学习本书后面更专业事件处理的垫脚石。同样，我不解释 `this.style.backgroundColor`。只需记住这个序列，以便在练习中使用。\n\
  \n这里的关键字是 `onFocus`。它告诉 JavaScript 在用户点击该字段时执行某些操作。\n\n语法与你已经学会的其他事件处理程序相同：一个关键字，后面跟着一个等号，再后面跟着用引号括起来的\
  \ JavaScript 或 HTML。\n\n在用户输入她的电子邮件地址（或者不输入）并点击字段外部或按 Tab 键移动到另一个字段后——也就是说，当该字段不再获得焦点时——你希望它恢复为白色背景。你可以使用\
  \ `onBlur` 关键字来实现，它与 `onFocus` 相反。\n\n以下标记同时处理 `onFocus` 和 `onBlur` 事件：\n\n```\n\
  Email:<br>\n<input type=\"text\" size=\"30\" onFocus=\"this.style.backgroundColor='yellow';\"\
  \ onBlur=\"this.style.backgroundColor='white';\">\n```\n\n当用户点击进入该字段时，它变为黄色。当她点击离开该字段时，它恢复为白色。\n\
  \n稍微专业一点的方法是调用实现相同功能的函数：\n\n```\nEmail:<br>\n<input type=\"text\" size=\"30\" onFocus=\"\
  makeFieldYellow();\" onBlur=\"makeFieldWhite();\">\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/48.html`](http://www.ASmarterWayToLearn.com/javascript/48.html)\n\
  \n# 49\n\n读取字段值\n\n假设你在表单中包含了一个电子邮件字段，并将其设为必填字段。表单有一个**提交**按钮，用户点击该按钮以提交他在表单中输入的信息。\n\
  \n以下是创建表单的标记。我对其进行了简化，省略了任何表单操作和其他属性，包括换行符，这些与你当前学习的内容无关。\n\n```\n<form>\n  Email:\n\
    <input type=\"text\">\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\
  \n\n\n\n现在，在我们简化后的表单标记中，有以下三个元素：\n\n1. 文本“Email”\n2. 用于输入用户电子邮件地址的文本字段\n3. 提交按钮\n\
  \n我将为电子邮件字段添加一个 `id`。\n\n```\n<form>\n  Email:\n  <input type=\"text\" id=\"email\"\
  >\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n接下来，我将使用关键字 `onSubmit`\
  \ 添加一个事件处理程序。\n\n```\n<form onSubmit=\"checkAddress('email');\">\n  Email:\n  <input\
  \ type=\"text\" id=\"email\">\n  <input type=\"submit\" value=\"Submit\">\n</form>\n\
  ```\n\n现在，当用户点击 `submit` 按钮时，函数 `checkAddress` 会执行。请注意，尽管操作是点击 `submit` 按钮，但 `onSubmit`\
  \ 事件处理程序位于 `form` 标签中，而不是 `submit` 按钮标签中。这是因为提交是一个适用于整个表单的事件，而不是 `submit` 按钮。\n\n\
  有趣的地方来了。当表单提交时，函数 `checkAddress` 会检查用户是否在电子邮件字段中输入了内容。如果没有，该函数会显示一个提醒，告知用户需要填写电子邮件地址。\n\
  \n为了实现这一点，函数需要一种方法来读取电子邮件字段中的内容。这就是我添加到字段中的 `id` 发挥作用的地方。以下是函数的代码。\n\n```\n1 function\
  \ checkAddress(fieldId) {\n2   if (document.getElementById(fieldId).value === \"\
  \") {\n3    alert(\"Email address required.\");\n4   }\n5 }\n```\n\n如果电子邮件字段中没有值，则会显示一个提醒，告知用户需要填写电子邮件地址。\n\
  \n这是你需要记住的顺序：\n\n1. 关键字 `document`，后跟...\n2. 一个点，后跟...\n3. 关键字 `getElementById`，后跟...\n\
  4. 参数（在括号中），从调用代码接收到的 `fieldId`，后跟...\n5. 另一个点，后跟...\n6. 关键字 `value`\n\n请注意，`getElementById`\
  \ 必须严格使用驼峰命名法。如果你按直觉写成 `getElementByID`，将大写字母“D”，那么它不会起作用。\n\n有些程序员更倾向于将字段中找到的值存入一个变量，如下所示。\n\
  \n```\n1 function checkAddress(fieldId) {\n2   var val = document.getElementById(fieldId).value;\n\
  3   if val === \"\") {\n4    alert(\"Email address required.\");\n5   }\n6 }\n```\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/49.html`](http://www.ASmarterWayToLearn.com/javascript/49.html)\n\
  \n# 50\n\n设置字段值\n\n用户在表单字段中输入了她的邮政编码。你想省去她输入城市和州的麻烦。因此，当她点击离开该字段时，你为她自动填写城市字段。\n\
  \n让我来演示如何做到这一点。为了简化，我们假设美国只有三个邮政编码。我们还假设用户一定会输入其中一个代码。我们不会检查错误。在这个例子中，JavaScript\
  \ 代码只会填写城市字段，而不填写州。以下是表单的相关标记。（我省略了表单动作、`submit` 按钮以及本章不相关的其他所有内容。）\n\n```\n<form>\n\
  \  ZIP:<br>\n  <input type=\"text\" id=\"zip\" onBlur=\"fillCity();\"><br>\n  City:<br>\n\
  \  <input type=\"text\" id=\"city\">\n</form>\n```\n\n当用户点击离开邮政编码字段时，`onBlur` 事件触发\
  \ `fillCity` 函数。代码如下。\n\n```\n1  function fillCity() {\n2    var cityName;\n3  \
  \  var zipEntered = document.getElementById(\"zip\").value;\n4    switch (zipEntered)\
  \ {\n5    case \"60608\" :\n6      cityName = \"Chicago\";\n7      break;\n8   \
  \ case \"68114\" :\n9      cityName = \"Omaha\";\n10     break;\n11   case \"53212\"\
  \ :\n12     cityName = \"Milwaukee\";\n13   }\n14   document.getElementById(\"city\"\
  ).value = cityName;\n15 }\n```\n\n这个例子表明，你不仅可以使用 `document.getElementById`... 读取字段中的值，还可以“写入”一个值到字段中。\n\
  \n在这个例子中，函数将邮政编码字段中找到的值赋给一个变量。然后，使用 `switch` 语句，将邮政编码与城市名称匹配，并将该名称赋给第二个变量。接着，使用该变量将城市名称放入城市字段。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/50.html`](http://www.ASmarterWayToLearn.com/javascript/50.html)\n\
  \n# 51\n\n读取和设置段落文本\n\n你的网页最初显示一张名为懒猴的小型哺乳动物的图片，并附带一句话：\n\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。点击了解更多。\n\
  \n当用户点击链接时，段落会展开：\n\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。它们有一个圆头、窄吻、大眼睛，以及多种因物种而异的独特颜色图案。懒猴的手和脚有几种适应性特征，使它们能够像钳子一样抓握，并能够长时间抓住树枝。懒猴具有毒性咬合，这在哺乳动物中是一种罕见的特征。\n\
  \n这是标记。\n\n```\n<p id=\"slowLoris\">\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。 <a href=\"javascript:void(0);\"\
  \ onClick=\"expandLoris();\"><em>点击了解更多。</em></a>\n</p>\n```\n\n段落被分配了一个 `id`，该\
  \ `id` 将被函数使用。当用户点击链接时，会调用一个名为 `expandLoris` 的函数。\n\n这是函数。\n\n```\n1 function expandLoris()\
  \ {\n2   var expandedParagraph = \"懒猴是一组构成蜂猴属的几种链鼻灵长类动物。它们有一个圆头、窄吻、大眼睛，以及多种因物种而异的独特颜色图案。懒猴的手和脚有几种适应性特征，使它们能够像钳子一样抓握，并能够长时间抓住树枝。懒猴具有毒性咬合，这在哺乳动物中是一种罕见的特征。\"\
  ;\n3   document.getElementById(\"slowLoris\").innerHTML = expandedParagraph;\n4\
  \ }\n```\n\n第 2 行将长版本的文本赋给一个变量。然后，通过其 `id` 识别段落，第 3 行将原始内容（`innerHTML`）替换为存储在变量中的文本。\n\
  \n几乎任何内容，包括 HTML 标签，都可以通过这种方式插入到网页中。例如，你可以让这个列表出现在页面上的某个 `div` 中，该 `div` 的 `id`\
  \ 为“lorisList”。\n\n1. 懒猴\n2. 快猴\n3. 刚刚好的猴\n\n这是将列表标记加载到 `div` 中的函数，该 `div` 已被赋予\
  \ `id` 为“lorisList”。\n\n```\n1 function placeAList() {\n2   var listToPlace = \"\
  <ol><li>懒猴</li><li>快猴</li><li>刚刚好的猴</li></ol>\";\n3   document.getElementById(\"\
  lorisList\").innerHTML = listToPlace;\n4 }\n```\n\n第 2 行将列表的所有 HTML 赋给一个变量。第 3 行将\
  \ HTML 放入已被分配 `id` 为“lorisList”的 `div` 中。\n\n你可以使用 `document.getElementById(elementId).innerHTML`\
  \ 来读取以及“写入”元素的内容。例如，以下函数将段落、`div` 或其他具有 `id` 为“content”的元素中的任何内容赋给变量 `whatsThere`。\n\
  \n```\n1 function peekAtContent() {\n2   var whatsThere = document.getElementById(\"\
  content\").innerHTML;\n3 }\n```\n\n第 2 行读取 `id` 为“content”的元素内的所有 HTML，并将其赋给变量 `whatsThere`。如果该元素是一个段落，其内容为\
  \ `<em>你好，水手！</em>`，那么变量 `whatsThere` 会捕获 `<em>你好，水手！</em>`。\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/51.html`](http://www.ASmarterWayToLearn.com/javascript/51.html)\n\
  \n# 52\n\n操作图像和文本\n\n你的网页显示一张水滴鱼的图片。水滴鱼是一种迷人的动物，但它太丑了，以至于一些用户会发出“恶心”的感叹。因此，你给他们提供了让它消失的选项。当他们点击图片时，图片消失。\n\
  \n你首先给图片分配一个 `id`。\n\n\n\n\n\n<img src=\"Blobfish.jpg\" id=\"ugly\"...\n\n然后你添加一个事件处理程序。\n\
  \n<img src=\"blobfish.jpg\" id=\"ugly\" onClick=\"makeInvisible();\">\n\n你有一个用于隐藏的\
  \ CSS 类。\n\n`.hidden {display:none;}`\n\n事件处理程序调用的函数为图像添加了 \"hidden\" 类，因此它消失了。\n\
  \n```\nfunction makeInvisible() {\n  document.getElementById(\"ugly\").className\
  \ = \"hidden\";\n}\n```\n\n当函数被调用时，它将 \"hidden\" 类分配给 id 为 \"ugly\" 的元素。图像消失。\n\n\
  需要记住的一些事项：\n\n*   这只是你已经学过的内容的变体：`document.getElementById(theElementId).value`（用于表单字段）和\
  \ `document.getElementById(theElementId).innerHTML`（用于段落、div 和其他 HTML 元素）。\n\n*\
  \   它是 `className`，采用驼峰命名法，而不是 class。\n\n*   以这种方式为元素分配类会替换元素在静态标记中已分配的所有类。\n\n\
  如果你想为一个元素添加一个类，同时保留其现有的类，也是可以做到的。例如，假设你有一个段落，其类将其样式设置为 Verdana，大小为 1 em。当用户将鼠标悬停在其上时，你想将其大小加倍到\
  \ 2 em。但你不想丢失其原始类的 Verdana 样式。你希望保留那个设置 Verdana 样式的类，并添加放大字体的类，而不是替换它。假设该元素的 id\
  \ 为 \"p1\"。这是函数。\n\n```\nfunction makeBig() {\n  document.getElementById(\"p1\"\
  ).className += \" big\";\n}\n```\n\n与用新类替换所有现有类的代码相比，这段代码有两个小差异。\n\n*   它使用的是 `+=`\
  \ 而不是 `=`。\n\n*   类名前面需要一个空格。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/52.html`](http://www.ASmarterWayToLearn.com/javascript/52.html)\n\
  \n# 53\n\n交换图像\n\n在第 47 章中，你学习了当用户将鼠标悬停在图像上时如何用另一张图像替换它。当页面首次显示时，用户看到的是“之前”的图片。当用户将鼠标悬停在图片上时，它会被替换为“之后”的图片。\n\
  \n你学习了如何通过编写如下所示的内联事件处理程序来实现这一点。\n\n<img src=\"before-pic.jpg\" onMouseover=\"src='after-pic.jpg'\"\
  >\n\n另一种方法是调用一个执行交换的函数。这是标记：\n\n<img src=\"before-pic.jpg\" id=\"before\" onMouseover=\"\
  swapPic();\">\n\n这是函数代码。\n\n```\nfunction swapPic() {\n  document.getElementById(\"\
  before\").src = \"after-pic.jpg\";\n}\n```\n\n但为什么不把这个函数做成一个通用例程，可以交换任意图像为任意其他图像呢？为了实现这一点，标记必须将\
  \ id 和替换图像的名称作为参数传递给函数。\n\n<img src=\"before-pic.jpg\" id=\"before\" onMouseover=\"\
  swapPic(id,'after-pic.jpg');\">\n\n函数将这些参数作为其参数接收，并使用它们来交换图像。\n\n```\nfunction swapPic(eId,\
  \ newPic) {\n  document.getElementById(eId).src = newPic;\n}\n```\n\n本章的交互式编码练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/53.html`](http://www.ASmarterWayToLearn.com/javascript/53.html)\n\
  \n# 54\n\n交换图像和设置类\n\n你一直在学习如何读取 HTML 元素的属性，以及如何使用包含神奇词语 `document.getElementById`\
  \ 的各种语句来更改这些属性。例如，以下函数移除 id 为 \"before\" 的原始图像，并将其替换为第二张图像 \"after-pic.jpg\"。\n\n\
  ```\nfunction swapPic() {\n  document.getElementById(\"before\").src = \"after-pic.jpg\"\
  ;\n}\n```\n\n一种更常见的编写函数的方式是将其分解为两个步骤，首先将 `document.getElementById(\"before\")` 赋值给一个变量。然后将该变量与\
  \ `.src` 结合。我们称之为详细方法。\n\n```\nfunction swapPic() {\n  var pic = document.getElementById(\"\
  before\");\n  pic.src = \"after-pic.jpg\";\n}\n```\n\n这是一个使用更详细的方法来查找 id 为 \"link1\"\
  \ 的链接地址的函数。\n\n```\nfunction getAddress() {\n  var link = document.getElementById(\"\
  link1\");\n  var address = link.href;\n}\n```\n\n该函数探测链接标签的 `href` 属性。例如，如果 `href`\
  \ 等于 \"http://wikipedia.org\"，那么该地址就会存入变量 `address` 中。\n\n这个函数通过更改其类来改变 id 为 \"\
  f12\" 的表单的格式。\n\n```\nfunction enlargeForm() {\n  var frm = document.getElementById(\"\
  link1);\n  frm.className = \"jumbo\";\n}\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/54.html`](http://www.ASmarterWayToLearn.com/javascript/54.html)\n\
  \n# 55\n\n设置样式\n\n在第 52 章中，你学习了如何向任何元素添加 CSS 类来更改其样式。例如，这个函数向一个元素添加了 \"big\" 类。如果新类\
  \ \"big\" 为该元素指定了比原来更大的字体大小，那么元素内的文本就会变大。\n\n```\nfunction makeBig() {\n  document.getElementById(\"\
  p1\").className += \" big\";\n}\n```\n\n还有另一种指定样式属性的方法。\n\n```\nfunction makeBig()\
  \ {\n  document.getElementById(\"p1\").style.fontSize = \"2em\";\n}\n```\n\n与第一个示例类似，该函数更改了\
  \ id 为 \"p1\" 的元素的默认字体大小。但与第一个示例不同的是，它不会移除分配给该元素的任何其他样式，无论这些样式是在 CSS 中指定的还是内联的。\n\
  \n示例：如果标题、段落或 div 的初始大小为 1em，则该函数会将其内容的大小加倍。如果元素具有粗体、Georgia 斜体、12 像素边框的初始样式，则所有这些格式都会保留。只有大小发生变化。\n\
  \n此语句将图像左浮动。\n\n`document.getElementById(\"pic99\").style.cssFloat = \"left\";`\n\
  \n此语句使元素不可见。\n\n`document.getElementById(\"div9\").style.visibility = \"hidden\"\
  ;`\n\n此语句为元素设置左右边距为 10 像素。\n\n`document.getElementById(\"mainPic\").style.margin\
  \ = \"0 10px 0 10px;\";`\n\n你可以用这种方式设置许多样式属性。有时属性规范的术语并不明显，因此最好检查语言规则——是 `float`\
  \ 还是 `cssFloat`？——而不是猜测。\n\n和往常一样，你既可以读取属性，也可以设置它们。然而，规则并不简单。如果你写...\n\n`var m =\
  \ document.getElementById(\"mainPic\").style.margin;`\n\n...它只会告诉你内联指定的边距（如果有的话）。如果边距是在\
  \ CSS 中指定的，你将无法获取它们。以下语句会为你提供所有样式属性，包括 CSS 和内联指定的，但它有一个限制。Internet Explorer 9 之前的版本不支持它。\n\
  \n`var m = document.getComputedStyle(\"mainPic\").margin;`\n\n本章的交互式编码练习请访问：\n\n\
  [`www.ASmarterWayToLearn.com/js/55.html`](http://www.ASmarterWayToLearn.com/javascript/55.html)\n\
  \n# 56\n\n按标签名定位所有元素\n\n假设你想让用户选择将文档中所有段落的文本大小加倍。为了实现这一点，你可以为每个段落指定一个 id。当用户单击“加倍文本大小”按钮时，一个函数会遍历所有段落\
  \ id 并进行更改。该函数可以通过为每个段落分配一个新类（该类指定更大的字体大小）来增大字体，也可以直接分配新的样式属性，如下所示：\n\n`getElementById(the\
  \ id).style.fontSize = \"2em\";`\n\n实现相同目的的更简单方法是让函数说：“找到文档中的所有段落并增大它们的大小。”\n\n\
  此语句找到所有段落并将它们赋值给一个变量：\n\n`var par = document.getElementsByTagName(\"p\");`\n\n\n\
  \n\n变量 `par` 现在保存了一个类似数组的集合，包含文档中的所有段落。为简单起见，假设文档正文仅包含三个段落。\n\n```\n<p>This bed\
  \ is too small.</p>\n<p>This bed is too big.</p>\n<p>This bed is just right.</p>\n\
  ```\n\n`par[0]` 是第一个段落。`par[1]` 是第二个段落。`par[2]` 是第三个段落。`par.length` 是 3，即集合中的项目数量。\n\
  \n如果你编写...\n\n```\nvar textInMiddleParagraph = par[1].innerHTML;\n```\n\n...那么变量\
  \ `textInMiddleParagraph` 被赋值为 `\"This bed is too big.\"`\n\n如果你编写...\n\n```\npar[1].innerHTML\
  \ = \"This SUV is too big.\";\n```\n\n...那么段落文本将变为 `\"This SUV is too big.\"`\n\n\
  下面是一个循环，为所有段落指定字体族。\n\n```\nfor (var i = 0; i < par.length; i++) {\n  par[i].style.fontFamily\
  \ = \"Verdana, Geneva, sans-serif\";\n}\n```\n\n这条语句创建文档中所有图像的集合，并将其赋值给变量 `pics`。\n\
  \n```\nvar pics = document.getElementsByTagName(\"img\");\n```\n\n这条语句创建文档中所有 div\
  \ 的集合，并将其赋值给变量 `divs`。\n\n```\nvar divs = document.getElementsByTagName(\"div\"\
  );\n```\n\n这条语句创建文档中所有无序列表的集合，并将其赋值给变量 `ulists`。\n\n```\nvar ulists = document.getElementsByTagName(\"\
  ul\");\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/56.html`](http://www.ASmarterWayToLearn.com/javascript/56.html)\n\
  \n# 57\n\n通过标签名定位元素\n\n在上一章中，你学会了如何创建一个类似数组的集合，包含文档中所有具有特定标签名的元素。例如，以下语句创建文档中所有段落的集合，并将该集合赋值给变量\
  \ `pars`。\n\n```\nvar pars = document.getElementsByTagName(\"p\");\n```\n\n你还学会了使用类似数组的表示法（方括号中的数字）来读取或设置元素集合中任意元素的属性。例如，以下语句“读取”集合\
  \ `pars` 中第二个元素的内容，并将字符串赋值给变量 `textInMiddleParagraph`。\n\n```\nvar textInMiddleParagraph\
  \ = pars[1].innerHTML;\n```\n\n但假设你不想获取文档中所有段落的集合，而只想获取某个特定 `div` 内的所有段落。没问题。假设该\
  \ `div` 的 `id` 是 `\"rules\"`。代码如下：\n\n```\nvar e = document.getElementById(\"rules\"\
  );\nvar paragraphs = e.getElementsByTagName(\"p\");\n```\n\n第 1 行将 `id` 为 `\"rules\"\
  ` 的 `div` 赋值给变量 `e`。\n\n第 2 行创建该 `div` 中所有段落的集合，并将该集合赋值给变量 `paragraphs`。\n\n一旦目标\
  \ `div` 的 `id` 被赋值给变量（例如 `e`），你就可以收集该 `div` 内的所有段落。不再编写...\n\n```\ndocument.getElementsByTagName(\"\
  p\");\n```\n\n...（这会创建文档中所有段落的集合），而是编写...\n\n```\ne.getElementsByTagName(\"p\");\n\
  ```\n\n...这会创建该 `div` 中所有段落的集合。\n\n假设你有一个白色背景的表格。当用户点击按钮时，单元格变为粉色。代码如下：\n\n```\n\
  var t = document.getElementById(\"table9\");\nvar cells = t.getElementsByTagName(\"\
  td\");\nfor (var i = 0; i < cells.length; i++) {\n  cells[i].style.backgroundColor\
  \ = \"pink\";\n}\n```\n\n逐行解释如下：\n\n1. 通过 `id` 定位表格\n2. 收集表格中所有带有 `td` 标签的元素\n3-5.\
  \ 遍历所有元素，更改它们的背景颜色\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/57.html`](http://www.ASmarterWayToLearn.com/javascript/57.html)\n\
  \n# 58\n\nDOM\n\n在前几章中，你学习了两种不同的方法来定位网页组件，以便读取或设置它们。你学习了 `getElementById`，也学习了 `getElementsByTagName`。这些通常是定位元素的最佳方法，但它们也有局限性。第一种方法\
  \ `getElementById` 只能访问那些被分配了 `id` 的组件。第二种方法 `getElementsByTagName` 适合批量修改，但对于精细的局部操作则略显笨拙。这两种方法都可以更改网页上的内容，但都无法处理页面上的*所有*内容，无法创建新内容、移动现有内容或删除它们。\n\
  \n幸运的是，这两种方法只是处理 `文档对象模型`（`DOM`）的众多方法中的两种。`DOM` 是一个组织结构图，当你的网页加载时，浏览器会自动为整个网页创建它。网页上的所有内容——标签、文本块、图像、链接、表格、样式属性等——都在这个组织结构图中占据位置。这意味着你的\
  \ JavaScript 代码只需指出某个内容在图表中的位置，就能获取网页上的任何内容，任何内容都可以。更重要的是，你的 JavaScript 可以通过操作图表来添加、移动或删除内容。如果你愿意（当然你不会），你几乎可以完全使用\
  \ JavaScript 的 `DOM` 方法从头创建一个完整的网页。\n\n下面是一个简化的网页。我缩进了层次结构中的不同级别。对于标准网页，`DOM` 的前三个级别总是相同的。`document`\
  \ 是第一级。`document` 下面是第二级 `html`。`html` 下面是并列的第三级 `head` 和 `body`。每个级别下面还有更多级别。\n\
  \n```\n1st level: document\n2nd level:   <html>\n3rd level:     <head>\n4th level:\
  \       <title>\n5th level:         Simple document\n                 </title>\n\
  \               </head>\n3rd level      <body>\n4th level        <p>\n5th level\
  \          There's not much to this.\n                 </p>\n               </body>\n\
  \             </html>\n```\n\n下面是相同的内容，以组织结构图的形式展示。请注意，这是一个理想化的图表，去除了大多数浏览器在 `DOM`\
  \ 中插入的垃圾元素。我将在后续章节中向你展示如何清除这些垃圾元素。\n\n![](img/00009.jpeg)\n\n如你所见，网页上的每一个内容都被包含在内，甚至包括标题文本和段落文本。让我们通过添加一个\
  \ `div` 和第二个段落来使其稍微复杂一些。以下是 HTML 形式。\n\n```\n1st level: document\n2nd level:   <html>\n\
  3rd level:     <head>\n4th level:       <title>\n5th level:         Simple document\n\
  \                 </title>\n               </head>\n3rd level      <body>\n4th level\
  \        <div>\n5th level          <p>\n6th level            There's not much to\
  \ this.\n                   </p>\n5th level          <p>\n6th level            Nor\
  \ to this.\n                   </p>\n                 </div>\n               </body>\n\
  \             </html>\n```\n\n以及组织结构图（去除所有垃圾元素后）...\n\n![](img/00010.jpeg)\n\n在公司组织结构图中，每个方框代表一个人。在\
  \ `DOM` 组织结构图中，每个方框代表一个**节点**。上面表示的 HTML 页面，在其清理后的 `DOM` 形式中，有 11 个节点：`document`\
  \ 节点、`html` 节点、`head` 和 `body` 节点、`title` 节点、`div` 节点、两个段落节点，以及三个文本节点（一个用于标题，另外两个分别用于两个段落）。\n\
  \n在这个特定的图表中，有三种类型的节点：`document`、`element` 和 `text`。`document` 节点是顶层。元素节点是 `<html>`、`<head>`、`<body>`、`<title>`、`<div>`\
  \ 和 `<p>`。文本节点是构成标题和两个段落的字符串。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/58.html`](http://www.ASmarterWayToLearn.com/javascript/58.html)\n\
  \n# 59\n\nDOM：父节点与子节点\n\n\n\n\n你能说出美国第 44 任总统的第二个孩子叫什么吗？是萨莎。那第 43 任总统的父亲（男性）呢？没错，是乔治。\n\
  \n欢迎来到文档对象模型（DOM）中最基本的节点指定方式。你可以通过说某个节点是特定父节点的第*x*个子节点来指定 DOM 中的任何节点。你也可以通过说某个节点是某个子节点的父节点来指定它。\n\
  \n看看上一章中简化的 HTML 文档。\n\n第 1 级：document\n\n第 2 级：`<html>`\n\n第 3 级：`<head>`\n\n第\
  \ 4 级：`<title>`\n\n第 5 级：Simple document\n\n`</title>`\n\n`</head>`\n\n第 3 级 `<body>`\n\
  \n第 4 级 `<div>`\n\n第 5 级 `<p>`\n\n第 6 级 There's not much to this.\n\n`</p>`\n\n\
  第 5 级 `<p>`\n\n第 6 级 Nor to this.\n\n`</p>`\n\n`</div>`\n\n`</body>`\n\n`</html>`\n\
  \n除了文档节点，每个节点都包含在另一个节点内。`<head>`和`<body>`节点包含在`<html>`节点内。`<div>`节点包含在`<body>`节点内。两个`<p>`节点包含在`<div>`节点内。每个`<p>`节点内包含一个文本节点。\n\
  \n当一个节点包含在另一个节点内时，我们说被包含的节点是包含它的节点的**子节点**。例如，`<div>`节点是`<body>`节点的子节点。反过来，`<body>`节点是`<div>`节点的**父节点**。以下是上一章的组织结构图，再次清理了垃圾伪影，显示了所有父节点及其子节点。\n\
  \n![](img/00011.jpeg)\n\n如你所见，`<html>`是**document**的子节点……`<head>`和`<body>`是`<html>`的子节点……`<div>`是`<body>`的子节点……两个`<p>`是`<div>`的子节点……每个文本节点是`<p>`的子节点。反过来，**document**是`<html>`的父节点，`<html>`是`<head>`和`<body>`的父节点，`<head>`是`<title>`的父节点，`<title>`是一个文本节点的父节点，以此类推。具有相同父节点的节点称为兄弟节点。因此，`<head>`和`<body>`是兄弟节点，因为`<html>`是它们的共同父节点。两个`<p>`是兄弟节点，因为`<div>`是它们的共同父节点。\n\
  \n从图表底部开始，文本“Nor to this.”是`<p>`的子节点，`<p>`是`<div>`的子节点，`<div>`是`<body>`的子节点，`<body>`是`<html>`的子节点，`<html>`是**document**的子节点。\n\
  \n现在看这个标记。\n\n```\n<p>This is <em>important</em>!</p>\n```\n\n如果你为这个段落画一个图表，你可能会认为所有文本都是`<p>`节点的子节点。但请记住，每个被另一个节点包含的节点都是包含它的节点的子节点。由于文本节点“important”被元素节点`<em>`包含，这个特定的文本节点是`<em>`的子节点，而不是`<p>`的子节点。文本节点“This\
  \ is ”和“!”以及元素节点`<em>`是兄弟节点，因为它们都被`<p>`包含。它们都是`<p>`的子节点。\n\n![](img/00012.jpeg)\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/59.html`](http://www.ASmarterWayToLearn.com/javascript/59.html)\n\
  \n# 60\n\n## DOM：查找子节点\n\n正如你在上一章所学，文档对象模型（DOM）是一个父节点和子节点的层级结构。网页上的所有内容，除了文档本身，都是其他内容的子节点。现在我们来讨论你的\
  \ JavaScript 代码如何利用这个父节点和子节点的层级结构来读取或更改网页上的几乎任何内容。\n\n让我们从你已经学过的定位网页元素的方法开始。回想一下前面的章节，你可以通过指定元素的\
  \ id（如果有的话）来定位它。\n\n```\nvar eField = document.getElementById(\"email\");\n```\n\
  \n上面的语句定位了 id 为“email”的元素。\n\n你还学会了如何生成文档中特定类型所有元素的类数组集合……\n\n```\nvar eField =\
  \ document.getElementsByTagName(\"p\");\n```\n\n创建了段落的集合后，你可以定位集合中的任何段落，例如读取其内容。\n\
  \n```\nvar contents = p[2].innerHTML;\n```\n\n上面的语句将文档中第三个段落包含的文本字符串赋值给变量`contents`。\n\
  \n另一种方法不是列出文档中所有特定类型的元素，而是将焦点缩小到文档级别以下，例如一个 div，然后在该 div 内生成一个集合。\n\n```\n1 var\
  \ d = document.getElementById(\"div3\");\n2 var p = d.getElementsByTagName(\"p\"\
  );\n3 var contents = p[2].innerHTML;\n```\n\n在上面的例子中，你生成的集合不是文档中所有段落元素，而是仅包含在 id\
  \ 为“div3”的 div 内的那些段落元素。然后你定位了其中一个段落。\n\n现在考虑这个标记。\n\n```\n<body>\n  <div id=\"\
  cal\">\n     <p>Southern Cal is sunny.</p>\n     <p>Northern Cal is rainy.</p>\n\
  \     <p>Eastern Cal is desert.</p>\n  </div>\n  <div id=\"ny\">\n     <p>Urban\
  \ NY is crowded.</p>\n     <p>Rural NY is sparse.</p>\n  </div>\n</body>\n```\n\n\
  如果你想读取标记中最后一个段落的内容，你可以这样写……\n\n```\n1 var p = document.getElementsByTagName(\"p\"\
  );\n2 var contents = p[4].innerHTML;\n```\n\n第 1 行生成文档中所有`<p>`的集合并赋值给变量`p`。第 2 行“读取”文档中第\
  \ 5 个段落包含的文本。\n\n另一种方法：你可以通过将元素集合缩小到仅第二个 div 中的元素来定位同一个段落。\n\n```\n1 var div = document.getElementById(\"\
  ny\");\n2 var p = div.getElementsByTagName(\"p\");\n3 var contents = p[1].innerHTML;\n\
  ```\n\n分解如下：\n\n1. 将 id 为“ny”的 div 赋值给变量`div`\n2. 生成该 div 中所有`<p>`的集合并赋值给变量`p`\n\
  3. “读取”该 div 中第 2 个段落包含的文本并赋值给变量`contents`\n\n现在我将向你展示一种使用 DOM 组织结构图来定位段落的新方法。\n\
  \n```\n1 var p = document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];\n\
  2 var contents = p.innerHTML;\n```\n\n我将突出显示每个子节点层级并说明它指向什么。\n\n1. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
  \ 是文档的第一个子节点，`<html>`\n2. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
  \ 是`<html>`的第二个子节点，`<body>`\n3. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
  \ 是`<body>`的第二个子节点，id 为“ny”的`<div>`\n4. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
  \ 是 id 为“ny”的`<div>`的第二个子节点，即该 div 中的第二个`<p>`\n\n注意：上面的代码假设浏览器没有在 DOM 中包含任何垃圾伪影。我将在下一章讨论这些。\n\
  \n当我们沿着组织结构图向下移动时，每个父节点后面跟着一个点，然后是关键字`childNodes`，再后面是方括号中的数字，类似于数组表示法。与数组表示法一样，第一个子节点是数字\
  \ 0。\n\n再次给出标记。上面代码中的关键元素已突出显示。\n\n```\n<body>\n  <div id=\"cal\">\n    <p>Southern\
  \ Cal is sunny.</p>\n    <p>Northern Cal is rainy.</p>\n    <p>Eastern Cal is desert.</p>\n\
  \   </div>\n   <div id=\"ny\">\n     <p>Urban NY is crowded.</p>\n     <p>Rural\
  \ NY is sparse.</p>\n   </div>\n</body>\n```\n\n在上面的例子中，我向你展示了如何从文档级别开始向下定位到目标节点。但在实践中，你通常会从较低的级别开始。例如，你可以从第二个\
  \ div 开始，指定其 id。然后定位它的一个子节点。\n\n```\n1 var d = document.getElementById(\"ny\");\n\
  ```\n\n\n\n\n```\n2 var p = d.childNodes[1];\n3 var contents = p.innerHTML;\n```\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/60.html`](http://www.ASmarterWayToLearn.com/javascript/60.html)\n\
  \n# 61\n\nDOM：\n\n垃圾节点与 nodeType\n\n现在该谈谈 DOM 中的垃圾节点了——也就是前三章中我一直提到的那些烦人的东西。让我们重新看看作为示例的简化网页。\n\
  \n1st level: document\n\n2nd level:   `<html>`\n\n3rd level:     `<head>`\n\n4th\
  \ level:       `<title>`\n\n5th level:         Simple document\n\n             \
  \    `</title>`\n\n               `</head>`\n\n3rd level      `<body>`\n\n4th level\
  \        `<div>`\n\n5th level          `<p>`\n\n6th level            There's not\
  \ much to this.\n\n                   `</p>`\n\n5th level          `<p>`\n\n6th\
  \ level            Nor to this.\n\n                   `</p>`\n\n               \
  \  `</div>`\n\n               `</body>`\n\n             `</html>`\n\n这是我为该页面绘制的\
  \ DOM 图。\n\n![](img/00011.jpeg)\n\n但这个图只对少数浏览器有效。大多数浏览器会将由回车、制表符和空格（*用于格式化代码*）产生的空白符解释为文本节点。当你查看标记时，你会看到\
  \ 3 个文本节点，它们是 title 元素和两个段落元素的子节点。\n\n1st level: document\n\n2nd level:   `<html>`\n\
  \n3rd level:     `<head>`\n\n4th level:       `<title>`\n\n5th level:         Simple\
  \ document\n\n                 `</title>`\n\n               `</head>`\n\n3rd level\
  \      `<body>`\n\n4th level        `<div>`\n\n5th level          `<p>`\n\n6th level\
  \            There's not much to this.\n\n                   `</p>`\n\n5th level\
  \          `<p>`\n\n6th level            Nor to this.\n\n                   `</p>`\n\
  \n                 `</div>`\n\n               `</body>`\n\n             `</html>`\n\
  \nFirefox 会看到这个标记中多了 8 个文本节点，它们只是由缩进产生的空白符。\n\n![](img/00013.jpeg)\n\n这些多余的文本节点产生了噪声，使得你的\
  \ DOM 读取代码难以找到信号。在一个浏览器中，body 节点的第一个子节点可能是 div；在另一个浏览器中，body 的第一个子节点可能是一个空文本节点。\n\
  \n有多种解决方案。作为其中一种方法，Mozilla 开发者网络建议了一种几乎可笑地绝望的变通方案，但它确实解决了问题，而且不需要 JavaScript 做任何额外工作。你可以像这样格式化标记。\n\
  \n```\n<html\n  ><head\n    ><title\n      >Simple document\n    </title\n  ></head\n\
  \  ><body\n    ><div\n      ><p\n        >There's not much to this.\n      </p\n\
  \      ><p\n       >Nor to this.\n      </p\n    ></div\n  ></body\n></html>\n```\n\
  \n这种标记利用了以下事实：任何包含在标签的 `<` 和 `>` 之间的回车、制表符和空格都会被浏览器忽略。对浏览器来说，`<  p  >` 等同于 `<p>`。并且...\n\
  \n`<   div   >`\n\n...等同于 `<div>`。\n\n当空白符位于括号内时，浏览器不会将其计为文本节点。因此，如果你像上面的代码那样将所有回车、制表符和空格“隐藏”在括号内，DOM\
  \ 中就不会有垃圾节点。任何会阻止 JavaScript 读取信号的噪声都会被移除。\n\n你也可以使用像 [`www.willpeavy.com/minifier/`](http://www.willpeavy.com/minifier/)\
  \ 这样的压缩程序来清理 DOM 中的垃圾节点。当然，你应该保留原始的非压缩版本文件，以便将来能够在不抓狂的情况下修改页面。\n\n```\n<html><head><title>Simple\
  \ document</title></head><body><div><p>There's not much to this.</p><p>Nor to this.</p></div></body></html>\n\
  ```\n\n另一种方法是按常规方式格式化 HTML，然后让 JavaScript 嗅探出垃圾节点。JavaScript 可以检查一个节点，看它是什么类型——元素、文本、注释等。例如，以下语句检查目标节点的节点类型，并将其赋值给变量\
  \ `nType`。\n\n`var nType = targetNode.nodeType;`\n\n在上面的语句中，JavaScript 将一个代表节点类型的数字赋值给变量\
  \ `nType`。如果节点是像 `<div>` 或 `<p>` 这样的元素，数字为 1。如果是文本节点，数字为 3。\n\n假设你想将某个 div 中第二个段落的内容替换为字符串\
  \ \"All his men.\"。以下是标记，我们将要更改的文本已高亮显示。\n\n```\n<div id=\"humpty\">\n  <p>All the\
  \ king's horses.</p>\n  <p>All the dude's crew.</p>\n  <p>All the town's orthopedists.</p>\n\
  </div>\n```\n\n这是代码。\n\n```\n1  var d = document.getElementById(\"humpty\");\n2\
  \  var pCounter = 0;\n3  for (var i = 0; i < d.childNodes.length; i++) {\n4    if\
  \ (d.childNodes[i].nodeType === 1 ) {\n5      pCounter++;\n6    }\n7    if (pCounter\
  \ === 2) {\n8      d.childNodes[i].innerHTML = \"All his men.\";\n9      break;\n\
  10   }\n11 }\n```\n\n以下是分解说明：\n\n1 将 div 赋值给变量 `d`\n2 计数段落数量\n3 遍历 div 的子节点，寻找下一个元素节点（即类型\
  \ 1），我们假设它是段落\n4-6 计数器加 1。我们正在寻找第二个段落。\n7-9 当计数器达到 2 时，我们就找到了目标段落。更改文本。\n\n当然，如果你知道你可能想让\
  \ JavaScript 更改第二个段落，更简单的方法是给它分配一个 id，然后直接定位到它，就像这样。\n\n`document.getElementById(\"\
  p2\").innerHTML = \"All his men.\";`\n\n你可以理解为什么 `getElementId` 方法比追踪 DOM 层级更受程序员欢迎。但有些事情如果不通过\
  \ DOM 的父子关系来处理是无法做到的，你将在后续章节中了解到。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/61.html`](http://www.ASmarterWayToLearn.com/javascript/61.html)\n\
  \n# 62\n\nDOM：\n\n更多定位元素的方法\n\n到目前为止，你已经学会了使用 DOM 的父子层级，通过指定子节点在类似数组的子节点集合中的顺序来定位父节点的子节点——`childNodes[0]`、`childNodes[1]`、`childNodes[2]`\
  \ 等等。但还有其他利用层级进行定位的方法。首先，除了写 `childNodes[0]`，你还可以写 `firstChild`。另外，例如，要定位一个有 10\
  \ 个子节点的集合中的第 10 个子节点，除了写 `childNodes[9]`，你还可以写 `lastChild`。\n\n`var targetNode =\
  \ parentNode.childNodes[0];`\n\n...等同于...\n\n`var targetNode = parentNode.firstChild;`\n\
  \n而如果有 3 个子节点...\n\n`var targetNode = parentNode.childNodes[2];`\n\n...等同于...\n\n\
  `var targetNode = parentNode.lastChild;`\n\n你也可以反向操作，定位任何子节点的父节点。假设你有以下标记。使用 DOM，如何找到高亮\
  \ div 的父节点？\n\n```\n<div id=\"div1\">\n  <div id=\"div2\">\n    <p>Chicago</p>\n\
  \    <p>Kansas City</p>\n    <p>St. Louis</p>\n  </div>\n</div>\n```\n\n你想知道 id\
  \ 为 \"div2\" 的 div 的父节点。以下代码将 \"div2\" div 的父节点赋值给变量 `pNode`。\n\n```\n1 var kidNode\
  \ = document.getElementById(\"div2\");\n2 var pNode = kidNode.parentNode;\n```\n\
  \n你可以使用 `nextSibling` 和 `previousSibling` 来定位元素子节点集合中的下一个子节点和上一个子节点。在以下代码中，第一条语句定位\
  \ id 为 \"div1\" 的 div。第二条语句定位与 \"div1\" id 具有相同父节点的下一个节点。\n\n```\n1 var firstEl\
  \ = document.getElementById(\"div1\");\n2 secondEl = firstEl.nextSibling;\n```\n\
  \n如果没有 `nextSibling` 或 `previousSibling`，你会得到 `null`。在以下代码中，变量 `nonexistentEl` 的值为\
  \ `null`，因为 JavaScript 发现没有与 `firstEl` 具有相同父节点的上一个节点。\n\n```\n1 var firstEl = document.getElementById(\"\
  div1\");\n2 var nonexistentEl = firstEl.previousSibling;\n```\n\n\n\n\n计算兄弟节点可能有些棘手，因为正如你所知，某些浏览器会将\
  \ HTML 格式化产生的空白视为文本节点，即使这些空白是空的且没有意义。\n\n在上面的 HTML 示例中，有两个 `div` 和三个段落，你可能会认为第一个段落的下一兄弟节点是第二个段落。但实际上，在某些浏览器中，第一个段落的下一兄弟节点是一个空的文本节点。而*那个*节点的下一兄弟节点才是第二个段落。\n\
  \n这意味着，为了使用 `nextSibling` 或 `previousSibling` 定位某个节点，你必须像上一章中展示的那样，防御性地格式化你的 HTML\
  \ 标记，或者像上一章中展示的那样，对每个节点进行类型检查，以确保它是你正在寻找的那种节点。\n\n再次强调，对于任何你可能想要“读取”或更改的节点，最好为其分配一个\
  \ `id`。然后你可以使用 `document.getElementById` 更直接地定位该节点。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/62.html`](http://www.ASmarterWayToLearn.com/javascript/62.html)\n\
  \n# 63\n\nDOM：\n\n获取目标的名称\n\n在之前的一章中，你学习了如何通过如下语句获取节点的节点类型。\n\n```\nvar nType =\
  \ targetNode.nodeType;\n```\n\n在上面的示例中，如果节点是一个元素，变量 `nType` 将被赋值为数字 1。如果节点是文本，则被赋值为数字\
  \ 3。\n\n你可以通过使用 `nodeName` 获取关于节点的更多信息。在下面的示例中，目标节点的节点名称被赋值给变量 `nName`。\n\n```\n\
  1 var parent = document.getElementById(\"div1\");\n2 var target = parent.firstChild;\n\
  3 nName = target.nodeName;\n```\n\n第 1 行和第 2 行定位了 id 为 `\"div1\"` 的元素的第一个子节点。第 3\
  \ 行将目标的节点名称赋值给变量 `nName`。\n\n在上面的示例中，如果节点是一个元素，变量 `nName` 将被赋值为一个字符串，例如 `P` 或 `DIV`，该字符串对应于标签中括号内的字符。在\
  \ HTML 中，名称通常以全大写形式给出，即使标记是小写的。\n\n| **标签** | **节点名称** |\n| --- | --- |\n| `<p>`\
  \ *或* `<P>` | `P` |\n| `<div>` *或* `<DIV>` | `DIV` |\n| `<span>` *或* `<SPAN>` |\
  \ `SPAN` |\n| `<img>` *或* `<IMG>` | `IMG` |\n| `<a>` *或* `<A>` | `A` |\n| `<em>`\
  \ *或* `<EM>` | `EM` |\n| `<table>` *或* `<TABLE>` | `TABLE` |\n| `<li>` *或* `<LI>`\
  \ | `LI` |\n\n另一方面，如果节点是一个文本节点，节点的名称始终是 `#text`——小写形式。\n\n如果是文本节点，你可以通过以下方式获取其值，即其内容。\n\
  \n```\n1 var parent = document.getElementById(\"div1\");\n2 var target = parent.firstChild;\n\
  3 var nTextContent = target.nodeValue;\n```\n\n第 1 行和第 2 行定位了 id 为 `\"div1\"` 的元素的第一个子节点。第\
  \ 3 行将节点值赋值给变量 `nTextContent`。\n\n因此，如果标记如下，其中 `H2` 元素的第一个子节点是一个名称为 `\"#text\"`\
  \ 的节点……\n\n```\n<h2>Do <em>not</em> hit!</h2>\n```\n\n……那么节点值是 `\"Do \"`。\n\n像 `P`\
  \ 或 `IMG` 这样的元素节点有名称但没有值。如果你试图将元素节点的值赋值给一个变量，该变量将被赋值为 `null`。\n\n```\n<h2>Do <em>not</em>\
  \ hit!</h2>\n```\n\n在上面的示例中，`<em>` 是一个元素，这意味着它的值是 `null`。\n\n容易将文本节点的节点值与 `innerHTML`\
  \ 属性混淆。两者有两个区别。\n\n*   `innerHTML` 是元素节点 `<h2>` 的属性，在上面的示例中。节点值是文本节点本身的属性，而不是父元素的属性。\n\
  \n*   `innerHTML` 包含元素的*所有*后代，包括像 `<em>` 这样的内部元素节点以及文本节点。节点值仅包含构成单个文本节点的字符。\n\n\
  在下面的代码中，`H2` 元素的 `innerHTML` 被高亮显示。\n\n```\n<h2>Do <em>not</em> hit!</h2>\n```\n\
  \n在下面的代码中，`H2` 元素的第一个子节点的节点值被高亮显示。\n\n```\n<h2>Do <em>not</em> hit!</h2>\n```\n\n\
  由于在某些情况下，`nodeName` 可能会返回例如 `\"p\"` 而不是 `\"P\"`，或者 `\"href\"` 而不是 `\"HREF\"`，因此在进行名称测试时，最好统一大小写，如下所示。\n\
  \n```\nif (targetNode.nodeName.toLowerCase === \"img\") {\n```\n\n如果节点名称原本是大写的，代码会将其转换为小写。如果原本就是小写，则不会有任何影响。\n\
  \n如果你正在检查节点名称以确定节点是否为文本节点，则无需转换为小写，因为文本节点的名称始终是 `\"#text\"`，而不是 `\"#TEXT\"`。\n\n\
  本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/63.html`](http://www.ASmarterWayToLearn.com/javascript/63.html)\n\
  \n# 64\n\nDOM：\n\n计数元素\n\n在之前的一章中，你学习了如何创建一个类似数组的集合，其中包含所有共享特定标签名称的元素。例如，以下代码创建了一个包含所有\
  \ `<li>` 元素的集合，并将该集合赋值给变量 `liElements`。\n\n```\nvar liElements = getElementsByTagName(\"\
  li\");\n```\n\n一旦你有了元素集合，就可以找出其中有多少个元素。在下面的代码中，`liElements` 所代表的集合中 `<li>` 元素的数量被赋值给变量\
  \ `howManyLi`。\n\n```\nvar howManyLi = liElements.length;\n```\n\n然后，例如，你可以遍历该集合，查找没有文本的\
  \ `<li>` 元素，并输入一些占位文本。\n\n```\n1 for (var i = 0; i < howManyLi; i++) {\n2   if (liElements[i].innerHTML\
  \ === \"\") {\n3     liElements[i].innerHTML = \"coming soon\";\n4   }\n5 }\n```\n\
  \n我带你走了一遍这个过程，是为了向你介绍一个类似的操作，你可以使用 DOM 层次结构而不是标签名称来执行。你可以创建一个目标节点的所有子节点的集合。\n\n\
  ```\n1 var parentNode = document.getElementById(\"d1\");\n2 var nodeList = parentNode.childNodes;\n\
  ```\n\n第 1 行将 id 为 `\"d1\"` 的元素赋值给变量 `parentNode`。第 2 行将 `parentNode` 的子节点集合赋值给\
  \ `nodeList`。\n\n你可以获取集合中的项目数量。以下语句将节点集合中的项目数量赋值给变量 `howManyKids`。\n\n```\nvar howManyKids\
  \ = nodeList.length;\n```\n\n然后你可以定位集合中的任何项目。以下代码统计了 div 内的图片数量。\n\n```\n1 var numberPics\
  \ = 0;\n2 for (var i = 0; i < howManyKids; i++) {\n3   if (nodelist[i].nodeName.toLowerCase()\
  \ === \"img\") {\n4     numberPics++;\n5   }\n6 }\n```\n\n分解如下：\n\n1. 声明图片计数器并将其设置为\
  \ 0\n2. 遍历 div 的所有子节点\n3-5. 如果节点名称（转换为小写后）是 `\"img\"`，则递增图片计数器\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/64.html`](http://www.ASmarterWayToLearn.com/javascript/64.html)\n\
  \n# 65\n\nDOM：\n\n属性\n\n看一下这段标记。\n\n```\n<a href=\"http://www.amazon.com\">Shop</a>\n\
  ```\n\n你已经了解到，在上述标记中，文本节点 `\"Shop\"` 是元素节点 `<a>` 的第一个（也是唯一的）子节点。但是 `href=\"http://www.amazon.com\"\
  ` 是什么呢？它绝对是 DOM 中的一个节点，你可以说它从属于 `<a>`。但它不是 `<a>` 的子节点。它是 `<a>` 的一个*属性*。\n\n每当你看到这种形式……\n\
  \n```\n<element something=\"something in quotes\">\n```\n\n……你看到的是一个带有属性的元素。等号和引号是提示。等号左侧的单词是属性*名称*。等号右侧的单词是属性*值*。\n\
  \n以下是更多示例。属性值被高亮显示。\n\n```\n<div id=\"p1\">\n<p class=\"special\">\n<img src=\"\
  images/slow-loris.png\">\n<span style=\"font-size:24px;\">\n```\n\n一个元素可以有任意数量的属性。在这个标签中，元素\
  \ `img` 有 4 个属性。我高亮显示了它们的值。\n\n```\n<img src=\"dan.gif\" alt=\"Dan\" height=\"42\"\
  \ width=\"42\">\n```\n\n你可以使用 `hasAttribute` 来检查一个元素是否具有某个特定属性。\n\n\n\n\n```\n1\
  \ var target = document.getElementById(\"p1\");\n2 var hasClass = target.hasAttribute(\"\
  class\");\n```\n\n第 1 行将元素赋值给变量 `target`。第 2 行检查该元素是否具有名为 \"class\" 的属性。如果有，变量 `hasClass`\
  \ 被赋值为 `true`；如果没有，则被赋值为 `false`。\n\n你可以使用 `getAttribute` 读取属性的值。\n\n```\n1 var\
  \ target = document.getElementById(\"div1\");\n2 var attVal = target.getAttribute(\"\
  class\");\n```\n\n第 1 行将元素赋值给变量 `target`。第 2 行读取属性的值并将其赋值给变量 `attVal`。\n\n你可以使用\
  \ `setAttribute` 设置属性的值。\n\n```\n1 var target = document.getElementById(\"div1\"\
  );\n2 target.setAttribute(\"class, \"special\");\n```\n\n第 1 行将元素赋值给变量 `target`。第\
  \ 2 行为其赋予一个属性 \"class\"（括号内的第一个参数），其值为 \"special\"（括号内的第二个参数）。实际上，标记变为：\n\n```\n\
  <div id=\"div1\" class=\"special\">\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/65.html`](http://www.ASmarterWayToLearn.com/javascript/65.html)\n\
  \n# 66\n\nDOM：\n\n属性名称和值\n\n在前几章中，你学习了如何使用如下语句创建具有相同标签名的元素集合：\n\n```\nvar list =\
  \ document.getElementsByTagName(\"p\");\n```\n\n以及如何使用如下语句创建元素的所有子节点的集合：\n\n```\n\
  var list = document.getElementById(\"p1\").childNodes;\n```\n\n类似地，你可以使用如下语句创建元素的所有属性的集合：\n\
  \n```\nvar list = document.getElementById(\"p1\").attributes;\n```\n\n将集合赋值给变量后，你可以获取集合中的项目数量：\n\
  \n```\nvar numOfItems = list.length;\n```\n\n或者，你可以将这些任务压缩成一条语句，而无需先将目标赋值给变量：\n\n\
  ```\nvar numOfItems = document.getItemById(\"p1\").attributes.length;\n```\n\n使用类似数组的表示法，你可以找出集合中任何属性的名称。以下语句针对属性集合中的第三个项目，并将其名称赋值给变量\
  \ `nName`。\n\n```\nvar nName = list[2].nodeName;\n```\n\n例如，如果标记是：\n\n```\n<p id=\"\
  p1\" class=\"c1\" onMouseover=\"chgColor();\">\n```\n\n那么变量 `nName` 被赋值为 \"onMouseover\"\
  。\n\n你还可以获取属性的值：\n\n```\nvar nValue = list[2].nodeValue;\n```\n\n在上面的示例标记中，变量 `nValue`\
  \ 被赋值为 \"chgColor();\"。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/66.html`](http://www.ASmarterWayToLearn.com/javascript/66.html)\n\
  \n# 67\n\nDOM：\n\n添加节点\n\n利用 DOM 层次结构，你可以在文档的 head 或 body 部分的任何位置添加元素、属性和文本节点。在本章中，你将学习如何创建一个段落节点，为其赋予一个属性，并用文本内容填充它。在下一章中，你将学习如何将段落及其属性和文本内容插入到页面中。\n\
  \n第一步是创建段落节点。\n\n```\nvar nodeToAdd = document.createElement(\"p\");\n```\n\n该示例创建了一个段落元素。要创建\
  \ `div` 元素，你可以在括号中放入 \"div\"。要创建图像元素，则放入 \"img\"。要创建链接，则放入 \"a\"，以此类推。\n\n以下语句创建了一个图像元素。\n\
  \n```\nvar imgNodeToAdd = document.createElement(\"img\");\n```\n\n在上一章中，你学习了如何使用\
  \ `setAttribute` 为已存在于网页中的元素添加属性。对于已创建但尚未放入文档 body 中的元素，你也可以执行相同的操作。\n\n```\nnodeToAdd.setAttribute(\"\
  class\", \"regular\");\n```\n\n上面的代码为你刚刚创建的新段落元素赋予了类 \"regular\"。如果需要，你可以使用单独的语句为段落元素添加更多属性——例如，span、style，甚至\
  \ id。\n\n如果元素是 `<img>` 元素，你可以添加 border 或 alt 作为属性。如果是 `<a>` 元素，你可以添加网址。\n\n以下语句为图像元素添加了\
  \ border 属性。\n\n```\nimgNodeToAdd.setAttribute(\"border\", \"1\");\n```\n\n上面的代码为图像添加了\
  \ 1 像素的边框。\n\n请记住，此时我们只是在创建节点。新的属性节点已连接到新的元素节点，但我们尚未将节点添加到页面中。\n\n回到段落元素，我们已经创建了它并为其添加了类属性。现在让我们为其添加一些文本内容。同样，我们首先创建所需的节点。\n\
  \n```\nvar newTxt = document.createTextNode(\"Hello!\");\n```\n\n上面的语句创建了一个内容为 \"\
  Hello!\" 的文本节点。\n\n接下来，我们将文本放入段落元素中。\n\n```\nnodeToAdd.appendChild(newTxt);\n```\n\
  \n上面的语句将内容为 \"Hello!\" 的新文本节点添加到新的段落节点中。\n\n现在，我们有了一个带有类属性和一些文本内容的新段落节点。我们已准备好将其插入到页面中。\n\
  \n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/67.html`](http://www.ASmarterWayToLearn.com/javascript/67.html)\n\
  \n# 68\n\nDOM：\n\n插入节点\n\n在上一章中，你学习了如何通过先创建文本节点，然后使用 `appendChild` 将节点追加到元素中来为元素添加文本内容。当然，你也可以使用相同的方法将段落元素本身（无论是否填充内容）追加到父节点，例如\
  \ body 或 `div`。以下语句集针对一个 `div`（第 1 行），创建一个新的段落元素（第 2 行），创建要放入其中的文本（第 3 行），将文本放入段落中（第\
  \ 4 行），然后将段落元素及其文本内容追加到目标 `div`（第 5 行）。\n\n```\n1 var parentDiv = document.getElementById(\"\
  div1\");\n2 var newParagraph = document.createElement(\"p\");\n3 var t = document.createTextNode(\"\
  Hello world!\");\n4 newParagraph.appendChild(t);\n5 parentDiv.appendChild(newParagraph);\n\
  ```\n\n当你像上面的示例那样通过将节点作为子节点追加到父节点来将其添加到网页时，限制在于你无法控制新元素在父节点的子节点中的位置。JavaScript 总是将其放在末尾。因此，例如，如果上面的示例中的\
  \ `div` 已经有三个段落，那么新段落将成为第四个，即使你希望将其放在更高的位置。\n\n解决方案是 `insertBefore`。\n\n例如，假设你希望该段落成为\
  \ `div` 中的第一个段落，而不是最后一个。\n\n```\n1 var parentDiv = document.getElementById(\"div1\"\
  );\n2 var newParagraph = document.createElement(\"p\");\n3 var t = document.createTextNode(\"\
  Hello world!\");\n4 newParagraph.appendChild(t);\n5 paragraph1 = parentDiv.firstChild;\n\
  6 parentDiv.insertBefore(newParagraph, paragraph1);\n```\n\n上面的示例选择父元素的一个子节点作为目标（第\
  \ 5 行），并告诉 JavaScript 将新元素及其文本内容插入到该元素之前（第 6 行）。\n\n没有直接的 `insertAfter` 方法。但你仍然可以实现。只需在目标节点的下一个兄弟节点之前执行\
  \ `insertBefore` 即可。\n\n```\n1 var target = parentDiv.childNodes[1];\n2 parentDiv.insertBefore(newE,\
  \ target.nextSibling);\n```\n\n通过将新节点插入到第二个子节点的下一个兄弟节点之前，你就将新节点插入到了第二个子节点之后。\n\n\
  要移除节点，请使用 `removeChild`。\n\n```\n1 var parentDiv = document.getElementById(\"div1\"\
  );\n2 var nodeToRemove = parentDiv.childNodes[2];\n3 parentDiv.removeChild(nodeToRemove);\n\
  ```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/68.html`](http://www.ASmarterWayToLearn.com/javascript/68.html)\n\
  \n# 69\n\n对象\n\n我相信你一定见过这样的表格，比较网络主机提供的不同套餐。\n\n![](img/00014.jpeg)\n\n\n\n\n如果你想在\
  \ JavaScript 中使用这些数据，你可以将每个值赋给不同的变量，就像这样。\n\n```\n1  var plan1Name = \"Basic\";\n\
  2  var plan1Price = 3.99;\n3  var plan1Space = 100;\n4  var plan1Data = 1000;\n\
  5  var plan1Pages = 10;\n6  var plan2Name = \"Professional\";\n7  var plan2Price\
  \ = 5.99;\n8  var plan2Space = 500;\n9  var plan2Data = 5000;\n10 var plan2Pages\
  \ = 50;\n11 var plan3Name = \"Ultimate\";\n12 var plan3Price = 9.99;\n13 var plan3Space\
  \ = 2000;\n14 var plan3Data = 20000;\n15 var plan3Pages = 500;\n```\n\n完成所有这些变量赋值后，你就可以编写如下的\
  \ JavaScript 语句……\n\n```\nalert(\"The cost of the \" + plan2Name + \"package is\
  \ $\" + plan2Price + \" per month.\");\n```\n\n……然后会弹出一个提示框，显示：“The cost of the\
  \ Professional package is $5.99 per month.”\n\n但是，将所有值赋给变量这种方式很笨拙，而且如果情况变得复杂，可能会引发问题。更好的处理方式是创建带有*属性*的*对象*。这是一种更便捷的方案，能更准确地反映我们最初所看到的托管公司表格的二维网格特性。下表展示了以对象和属性形式表示的所有选项。\n\
  \n![](img/00015.jpeg)\n\n在这个例子中，每个托管方案都是一个对象——`plan1`、`plan2`、`plan3`。每个对象有 5 个属性——`name`、`cost`、`space`、`transfer`\
  \ 和 `pages`。属性就是附加到对象上的变量。这里，每个对象都有一个字符串属性（`name`）和四个数值属性（`price`、`space`、`transfer`\
  \ 和 `pages`）。\n\n在代码中，我们使用点表示法来引用对象及其属性。下面是创建上述提示框的语句，其中用对象-属性对替换了简单的变量。\n\n```\n\
  alert(\"The cost of the \" + plan2.name + \" package is $\" + plan2.price + \" per\
  \ month.\");\n```\n\n`plan2.name` 代表 \"Professional\"。`plan2.price` 代表 5.99。\n\n\
  定义对象及其属性最直接的方式如下：\n\n```\n1 var plan1 = {\n2   name: \"Basic\",\n3   price: 3.99,\n\
  4   space: 100,\n5   transfer: 1000,\n6   pages: 10\n7 };\n```\n\n需要注意的事项：\n\n*\
  \   代码以任何变量定义的方式开始：关键字 `var`，后跟对象名，再跟等号。\n*   但接下来，不是值，而是一个花括号，其配对花括号位于代码块末尾。\n\
  *   每个属性以名称开头，后跟冒号，再跟值。\n*   除最后一个属性定义外，每个属性定义末尾都有逗号。\n*   由于第一行有等号，所以结尾的花括号后跟一个分号。\n\
  \n现在让我们再添加一个属性 `discountMonths`。如果当前月份是七月、八月或十二月，客户将获得托管方案 20% 的折扣。为了记录这些特殊月份，我们将它们赋给一个新属性。这个新属性是一个数组，而不是简单变量。\n\
  \n```\nplan1.discountMonths = [6, 7, 11];\n```\n\n上面的语句为对象 `plan1` 创建了一个新属性 `discountMonths`，并为其分配了一个数组，表示客户享受折扣的三个月份。\n\
  \n引用该数组属性的各个元素的方式与引用任何数组元素的方式相同，即使用方括号内的数字，但采用对象-属性对的点表示法：`plan1.discountMonths`。\n\
  \n```\nvar mo = plan1.discountMonths[2];\n```\n\n上面的语句将数组的第三个元素（代表十二月的数字）赋给变量 `mo`。\n\
  \n到目前为止，我们只定义了一个对象 `plan1` 及其属性。要完成包含 `plan2` 和 `plan3` 的对象集合，你需要重复同样的操作，然后再重复一次。你可能会想，这比本章开头定义\
  \ 15 个简单变量要费事得多，但定义对象及其属性实际上是更好的做法，原因我将在后续章节中讨论。此外，还有一种更省力的方法，你也会学到。\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/69.html`](http://www.ASmarterWayToLearn.com/javascript/69.html)\n\
  \n# 70\n\n## 对象：属性\n\n要更改对象数值属性的值，可以使用简单的赋值语句，就像给普通变量赋值一样。\n\n```\ndeal3.cost =\
  \ 79.95;\n```\n\n无论 `deal3.cost` 之前的值是什么，现在它变成了 79.95。\n\n当然，你也可以赋一个字符串而不是数值。\n\n\
  ```\ndeal3.name = \"Super-saver\";\n```\n\n无论 `deal3.name` 之前的值是什么，现在它变成了 \"Super-saver\"\
  。\n\n你也可以将一个数组列表赋给属性。\n\n```\ndeal3.features = [\"Guarantee\", \"Free Ship\"];\n\
  ```\n\n无论 `deal3.features` 之前的值是什么，现在它变成了一个包含 \"Guarantee\" 和 \"Free Ship\" 元素的数组。\n\
  \n你还可以赋一个布尔值。\n\n```\ndeal3.membersOnly = false;\n```\n\n无论 `deal3.membersOnly`\
  \ 之前的值是什么，现在它变成了 false。\n\n你也可以使用赋值语句为对象定义一个新属性。假设对象 `deal3` 有一些属性，但其中没有 `deal3.market`。现在你想添加它，同时为其赋值。\n\
  \n```\ndeal3.market = \"regional\";\n```\n\n就像你可以通过不赋值来创建一个未定义的变量一样，你也可以创建一个没有任何属性的对象。\n\
  \n```\nvar deal4 = {};\n```\n\n如果你想现在创建一个属性，但稍后再赋值，你可以将其创建为 undefined。\n\n```\n\
  deal3.market = undefined;\n```\n\n注意，关键字 `undefined` 没有引号。它不是字符串。\n\n你可以删除对象的一个属性。\n\
  \n```\ndelete deal3.market;\n```\n\n你可以检查对象的某个属性是否存在。下面的语句测试是否存在 `deal3.market`\
  \ 这样的属性，并将结果（true 或 false）赋给变量 `propertyExists`。\n\n```\npropertyExists = \"market\"\
  \ in deal3;\n```\n\n需要注意的事项：\n\n*   你可以使用任何合法的变量名代替 `propertyExists`。\n*   关键字 `in`\
  \ 询问：“属性 market 是否在对象 `deal3` 中——true 还是 false？”\n*   属性 `market` 用引号括起来。\n*   对象\
  \ `deal3` 没有用引号括起来。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/70.html`](http://www.ASmarterWayToLearn.com/javascript/70.html)\n\
  \n# 71\n\n## 对象：方法\n\n让我们回到显示不同托管方案的图表。\n\n![](img/00016.jpeg)\n\n我们将编写一个函数，根据此图表计算年费。请注意，如果用户在一年中的某些时间注册，他将获得全年折扣。如果他在七月或八月注册\
  \ Basic 方案，他将获得 20% 的折扣。如果他在七月、八月或十二月注册 Professional 方案，他将获得 20% 的折扣。如果他在七月或八月注册\
  \ Ultimate 方案，他将获得 20% 的折扣。\n\n我们首先创建三个带有属性的对象。这是代表 Basic 方案的对象及其属性。\n\n```\n1 var\
  \ plan1 = {\n2   name: \"Basic\",\n3   price: 3.99,\n4   space: 100,\n5   transfer:\
  \ 1000,\n6   pages: 10,\n7   discountMonths: [6, 7]\n8 };\n```\n\n该函数遍历所有折扣月份（第\
  \ 5 行），检查是否有任何月份恰好是当前月份（第 6 行）。如果是，则通过将常规价格乘以 0.8 来计算 20% 的折扣。然后，将折扣后或未折扣的月价格乘以\
  \ 12，得到年价格，并将该数字返回给调用代码（第 11 行）。\n\n```\n1  function calcAnnual() {\n2    var bestPrice\
  \ = plan1.price;\n3    var currDate = new Date();\n4    var thisMo = currDate.getMonth();\n\
  5    for (var i = 0; i < plan1.discountMonths.length; i++) {\n6      if (plan1.discountMonths[i]\
  \ === thisMo) {\n7        bestPrice = plan1.price * .8;\n8        break;\n9    \
  \  }\n10   }\n11   return bestPrice * 12;\n12 }\n```\n\n这是执行该函数的调用语句。\n\n```\nvar\
  \ annualPrice = calcAnnual();\n```\n\n\n\n\n但现在，让我们让函数更灵活，这样折扣率可以根据调用语句传递给它的值而变化。以下是修改后的版本，如果用户符合折扣条件，则将收取的百分比传递给参数\
  \ `percentIfDisc`。\n\n```\nfunction calcAnnual(percentIfDisc) {\n  var bestPrice\
  \ = plan1.price;\n  var currDate = new Date();\n  var thisMo = currDate.getMonth();\n\
  \  for (var i = 0; i < plan1.discountMonths.length; i++) {\n    if (plan1.discountMonths[i]\
  \ === thisMo) {\n      bestPrice = plan1.price * percentIfDisc;\n      break;\n\
  \    }\n  }\n  return bestPrice * 12;\n}\n```\n\n这是调用语句，它将值传递给函数并执行它。在这个例子中，它传递了值\
  \ .85，表示 15% 的折扣。\n\n`var annual Price = calcAnnual(.85);`\n\n你已经了解到，你可以将一个变量附加到一个对象上，该变量就成为该对象的属性。现在还有更多信息。你可以将一个函数附加到一个对象上，该函数就成为该对象的\
  \ `method`。它执行与普通函数相同的任务，但现在它被附加到了一个对象上。你为什么要使用方法而不是普通函数的原因将在后续章节中变得清晰。现在，让我展示一下如何操作。\n\
  \n这段代码将我之前编写的函数插入到对象定义中，因此现在它成了一个方法。在操作上，它与普通函数相同，但现在它被附加到了对象上。\n\n```\nvar plan1\
  \ = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n  pages:\
  \ 10,\n  discountMonths: [6, 7],\n  calcAnnual: function(percentIfDisc) {\n    var\
  \ bestPrice = plan1.price;\n    var currDate = new Date();\n    var thisMo = currDate.getMonth();\n\
  \    for (var i = 0; i < plan1.discountMonths.length; i++) {\n      if (plan1.discountMonths[i]\
  \ === thisMo) {\n        bestPrice = plan1.price * percentIfDisc;\n        break;\n\
  \      }\n    }\n    return bestPrice * 12;\n  }\n};\n```\n\n需要注意的事项：\n\n*   除了第一行之外，方法的每一行都与我们最初创建的普通函数的代码完全相同。\n\
  *   方法定义的开始方式与属性定义的开始方式相同，即名称后跟冒号。\n*   每个属性定义和方法定义都以逗号结尾，除了最后一个属性或方法。如果你要在 `calcAnnual`\
  \ 方法定义下方添加一个属性或方法，你需要在 `calcAnnual` 定义的右花括号后插入一个逗号。\n*   表示变量名是函数名的圆括号紧跟在关键字 `function`\
  \ 之后。参数（如果有）放在圆括号内，与任何函数定义一样。\n\n这是调用该方法的方式。\n\n`var annualPrice = plan1.calcAnnual(.85);`\n\
  \n我将对方法定义进行一些改进。在我上面编写的定义中，属性是通过对象名称来引用的——例如 `plan1.price`。这样可行，但更好的方法（原因将在后续章节中变得清晰）是用关键字\
  \ `this` 替换对象名称。当 JavaScript 看到 `this` 关键字时，它知道你在引用正在定义的对象。\n\n```\nvar plan1 =\
  \ {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n  pages:\
  \ 10,\n  discountMonths: [6, 7],\n  calcAnnual: function(percentIfDisc) {\n    var\
  \ bestPrice = this.price;\n    var currDate = new Date();\n    var thisMo = currDate.getMonth();\n\
  \    for (var i = 0; i < this.discountMonths.length; i++) {\n      if (this.discountMonths[i]\
  \ === thisMo) {\n        bestPrice = this.price * percentIfDisc;\n        break;\n\
  \      }\n    }\n    return bestPrice * 12;\n  }\n};\n```\n\n当你编写 `this.whatever`\
  \ 时，JavaScript 足够智能，能够理解你在引用正在定义的对象的属性——在本例中，就是 `plan1`。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/71.html`](http://www.ASmarterWayToLearn.com/javascript/71.html)\n\
  \n# 72\n\n对象：\n\n构造函数\n\n再次，这里是显示不同托管计划的图表版本。\n\n![](img/00014.jpeg)\n\n这是我如何将基础计划的信息封装到一个对象和五个属性中的方式。\n\
  \n```\nvar plan1 = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer:\
  \ 1000,\n  pages: 10\n};\n```\n\n但这只为我们提供了一个表示第一个计划的对象。我还得为专业版和终极版重复同样的操作。这手工活太多了。我们需要一个工厂来批量生产这些东西。JavaScript\
  \ 允许你构建这样一个工厂。它被称为 `constructor function`。\n\n```\nfunction Plan(name, price, space,\
  \ transfer, pages) {\n  this.name = name;\n  this.price = price;\n  this.space =\
  \ space;\n  this.transfer = transfer;\n  this.pages = pages;\n}\n```\n\n这本来是一个普通的函数定义，但有两个不同之处：\n\
  \n*   函数名首字母大写。JavaScript 并不在意你是否这样做，但按照惯例，这样做是为了将构造函数与普通函数区分开来。\n*   每个参数值都被赋值给一个变量。但这个变量是附加到某个尚未指定名称的对象上的属性。不过别担心。就像参数值将由调用代码填充一样，对象的名称也会由调用代码填充。\n\
  \n这是创建基础计划对象的调用代码。\n\n`var plan1 = new Plan(\"Basic\", 3.99, 100, 1000, 10);`\n\n\
  如果没有那个 `new`，这本来只是一个普通的函数调用。正是这个关键字告诉 JavaScript 创建一个新对象。新对象的名称是 `plan1`。它的属性在圆括号内列出。\n\
  \n现在，使用相同的模式，可以轻松地批量生产任意数量的对象。\n\n```\nvar plan1 = new Plan(\"Basic\", 3.99, 100,\
  \ 1000, 10);\nvar plan2 = new Plan(\"Premium\", 5.99, 500, 5000, 50);\nvar plan3\
  \ = new Plan(\"Ultimate\", 9.99, 2000, 20000, 500);\n```\n\n通常，参数和属性使用相同的名称，但这不是必须的。你*可以*这样写：\n\
  \n```\nfunction Plan(name, price, space, transfer, pages) {\n  this.doc = name;\n\
  \  this.grumpy = price;\n  this.sleepy = space;\n  this.bashful = transfer;\n  this.sneezy\
  \ = pages;\n}\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/72.html`](http://www.ASmarterWayToLearn.com/javascript/72.html)\n\
  \n# 73\n\n对象：\n\n构造函数用于方法\n\n这是包含折扣月份的托管计划图表版本。\n\n![](img/00016.jpeg)\n\n在第 71\
  \ 章中，我向你展示了如何将函数附加到对象上，使用的方法与将变量附加到对象上相同。当你将变量附加到对象上时，它被称为对象的属性。当你将函数附加到对象上时，它被称为对象的方法。在下面的例子中，该方法检查当前日期是否在折扣月份内，如果是，则应用折扣。然后该方法计算年费。\n\
  \n如果你要创建多个具有相同属性和方法模式的对象，那么将方法以及属性都构建到构造函数中会很方便。\n\n在下面的代码中，构造函数为创建的每个对象创建相同的方法，同时也为每个对象创建所有属性。\n\
  \n```\nfunction Plan(name, price, space, transfer, pages, discountMonths) {\n  this.name\
  \ = name;\n  this.price = price;\n  this.space = space;\n  this.transfer = transfer;\n\
  \  this.pages = pages;\n  this.discountMonths = discountMonths;\n  this.calcAnnual\
  \ = function(percentIfDisc) {\n    var bestPrice = this.price;\n    var currDate\
  \ = new Date();\n    var thisMo = currDate.getMonth();\n    for (var i = 0; i <\
  \ this.discountMonths.length; i++) {\n      if (this.discountMonths[i] === thisMo)\
  \ {\n        bestPrice = this.price * percentIfDisc;\n        break;\n      }\n\
  \    }\n    return bestPrice * 12;\n  };\n}\n```\n\n\n\n\n\n11 `var thisMo = currDate.getMonth();`\n\
  \n12 `for (var i = 0; i < this.discountMonths.length; i++) {`\n\n13 `if (this.discountMonths[i]\
  \ === thisMo) {`\n\n14 `bestPrice = this.price * percentIfDisc;`\n\n15 `break;`\n\
  \n16 `}`\n\n17 `}`\n\n18 `return bestPrice * 12;`\n\n19 `};`\n\n20 `}`\n\n关于第 8\
  \ 行（方法定义的起始行）需要注意以下几点：\n\n- 与上面的属性定义类似，该行以关键字 `this` 开头，指向当前正在构造的任何对象的名称。\n- 接下来的三个部分相同：一个点、方法名和一个等号。\n\
  - 接下来的部分不同：关键字 `function`。\n- 在这种情况下，括号内有一个参数 `percentIfDisc`。这不是构造函数的一部分参数，而是构造函数将为每个对象创建的方法的参数。该参数的值不是在通过构造函数创建新对象时传入，而是在通过构造函数创建对象及其方法后，调用该方法时传入。\n\
  \n以下是调用构造函数创建三个新对象（对应三种托管方案）的代码。\n\n```\n1 var p1 = new Plan(\"Basic\", 3.99, 100,\
  \ 1000, 10, [6, 7]);\n2 var p2 = new Plan(\"Premium\", 5.99, 500, 5000, 50, [6,\
  \ 7, 11]);\n3 var p3 = new Plan(\"Ultimate\", 9.99, 2000, 20000, 500, [6, 7]);\n\
  ```\n\n上述代码创建了对象及其属性和方法后，以下是调用方法（例如 Premium 方案的方法）的代码。\n\n```\nvar annualPrice =\
  \ p2.calAnnual(.85);\n```\n\n一次性字面量对象定义（无构造函数）中的方法定义与构造函数中的方法定义的主要区别在于第一行。在其他方面，两种定义完全相同。\n\
  \n这是在没有构造函数的情况下一次性创建对象时方法定义的第一行：\n\n```\ncalcAnnual: function(percentIfDisc) {\n\
  ```\n\n这是构造函数内方法定义的第一行：\n\n```\nthis.calcAnnual = function(percentIfDisc) {\n```\n\
  \n还有另外两个区别。由于在构造函数中方法定义以赋值语句（`something = something else`）开头，因此需要在右花括号后加上分号。如果后面还有其他属性或方法定义，则不需要逗号。\n\
  \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/73.html`](http://www.ASmarterWayToLearn.com/javascript/73.html)\n\
  \n# 74\n\n对象：原型\n\n在上一章中，我们使用构造函数创建了三个对象。每个对象对应一个托管方案。每个对象有六个属性和一个方法。下表展示了这三个对象及其属性和方法。请注意最后一行（表格中绿色标记的行），它代表三个对象的方法……\n\
  \n![](img/00017.jpeg)\n\n绿色的最后一行存在一些不优雅之处。上面各行显示的属性是针对每个对象定制的，但方法在不同对象之间始终相同。构造函数为每个对象重复复制相同的方法，一个接一个。如果我们使用构造函数创建\
  \ 100 个对象，JavaScript 会重复复制该方法 100 次，每个对象一次。虽然能工作，但不够美观。\n\n下面的表格更有意义，它显示所有对象共享同一个方法。\n\
  \n![](img/00018.jpeg)\n\n我们希望只保留方法的一个副本，由构造函数创建的所有对象共享，无论创建多少个对象。\n\n如何实现？通过 *prototype*\
  \ 语句。\n\n首先，我们不在构造函数中包含该方法，因为这样会为每个通过构造函数创建的对象复制一个方法副本。\n\n相反，我们以这种方式将方法定义为构造函数的原型。\n\
  \n```\n1  Plan.prototype.calcAnnual = function(percentIfDisc) {\n2    var bestPrice\
  \ = this.price;\n3    var currDate = new Date();\n4    var thisMo = currDate.getMonth();\n\
  5    for (var i = 0; i < this.discountMonths.length; i++) {\n6      if (this.discountMonths[i]\
  \ === thisMo) {\n7        bestPrice = this.price * percentIfDisc;\n8        break;\n\
  9      }\n10   }\n11   return bestPrice * 12;\n12 };\n```\n\n现在，所有通过构造函数 `Plan`\
  \ 创建的对象将共享同一个 `calcAnnual` 方法副本。没有不必要的重复。\n\n请注意，除了第一行之外，方法的编码方式与它在构造函数定义中时完全相同。如果只考虑等号右侧的部分，甚至第一行也是相同的。等号左侧由点连接的部分是：\n\
  \n- 构造函数名称，此处为 `Plan`\n- 关键字 `prototype`\n- 所有通过 `Plan` 创建的对象将共享的方法名称，此处为 `calcAnnual`\n\
  \n对象可以拥有原型属性以及原型方法。假设你希望所有通过 `Plan` 创建的对象共享同一个属性 `cancellable`，其值为 `true`。你可以这样编写原型。\n\
  \n```\nPlan.prototype.cancellable = true;\n```\n\n现在，所有通过构造函数 `Plan` 创建的对象共享一个属性\
  \ `cancellable`，其值为 `true`。\n\n这是包含原型方法和原型属性的对象表。\n\n![](img/00019.jpeg)\n\n可以为任何单个对象覆盖原型。例如，假设你希望所有通过构造函数创建的对象共享同一个\
  \ `cancellable` 属性，但最便宜的方案 `plan1`（名称为 \"Basic\"）除外。以下语句可以实现。\n\n```\nplan1.cancellable\
  \ = false;\n```\n\n所有通过构造函数创建的对象仍然共享属性 `cancellable`，但现在该属性对于一个对象的值与其他所有对象不同。如下表所示。\n\
  \n![](img/00020.jpeg)\n\n同样，你也可以为任何单个对象覆盖共享的原型方法。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/74.html`](http://www.ASmarterWayToLearn.com/javascript/74.html)\n\
  \n# 75\n\n对象：检查属性和方法\n\n你可以通过编写如下简单语句来检查对象是否具有特定属性。\n\n```\nvar gotTheProperty =\
  \ \"price\" in plan1;\n```\n\n各部分如下：\n\n- 用引号括起来的属性名——此处为 `price`\n- 关键字 `in`\n\
  - 对象——此处为 `plan1`\n\n再次强调，问题是：名为 `plan1` 的对象是否具有名为 `price` 的属性？换句话说，是否存在 `plan1.price`\
  \ 这样的东西？在我们一直使用的三个托管方案的示例中，`plan1` 确实有一个价格 `3.99`。因此 `gotTheProperty` 被赋值为 `true`。但\
  \ `plan1` 没有名为 `location` 的属性。所以如果我们编写……\n\n```\nvar gotTheProperty = \"location\"\
  \ in plan1;\n```\n\n……变量 `gotTheProperty` 为 `false`。\n\n示例中的 `plan1` 还有一个名为 `calcAnnual`\
  \ 的方法。方法是对象的一种属性，因此如果你编写……\n\n```\nvar gotTheProperty = \"calcAnnual\" in plan1;\n\
  ```\n\n……变量 `gotTheProperty` 为 `true`。\n\n需要注意的事项：\n\n属性（变量）用引号括起来。我们不习惯将 JavaScript\
  \ 变量放在引号内，所以这一点需要特别留意。\n\n关键字是 `in`——非常直观。代码询问：“plan1 中是否有名为 'price' 的属性？”\n\n如果你想要获取对象属性的列表，有一种巧妙的方法：\n\
  \n```\n1 var listOfProperties = [];\n2 for (var prop in plan1) {\n3   listOfProperties.push(prop);\n\
  4 }\n```\n\n第 1 行声明了一个空数组 `listOfProperties`。第 2-4 行遍历 `plan1` 的所有属性，将每个属性（包括任何方法）通过\
  \ `push` 添加到数组 `listOfProperties` 中。使用我们一直在处理的示例，数组 `listOfProperties` 最终得到的值为 `\"\
  name,price,space,transfer,pages,discountMonths,calcAnnual\"`。\n\n\n\n\n请注意，与常规的\
  \ `for` 循环不同，这个循环不会限制循环次数或递增计数器。每次迭代后，JavaScript 会自动移动到对象的下一个属性，并在没有更多属性可枚举时停止迭代。\n\
  \n另请注意，你可以使用任何其他合法的变量名来代替 `prop`。\n\n在示例中，方法 `calcAnnual` 并未包含在对象 `plan1` 的原始定义中。它后来被添加到了用于创建该对象的构造函数的原型中，因此通过继承成为了对象的一个属性。上述代码将继承的属性（包括方法）也纳入了集合。如果你希望将属性列表限制为对象显式声明的那些属性，而忽略从原型继承的属性，则需要使用\
  \ `hasOwnProperty`。\n\n```\n1 var listOfProperties = [];\n2 for (var prop in plan1)\
  \ {\n3   if (plan1.hasOwnProperty(prop)) {\n4    listOfProperties.push(prop);\n\
  5   }\n6 }\n```\n\n在上面的示例中，每个属性依次被赋值给变量 `prop`。然后 `if` 语句测试该属性是否为对象自身拥有的属性，而非通过原型继承的。\n\
  \n当然，你也可以测试字面属性名，而不是使用变量。\n\n```\nvar isOwnedProperty = plan1.hasOwnProperty(\"\
  price\");\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/75.html`](http://www.ASmarterWayToLearn.com/javascript/75.html)\n\
  \n# 76\n\n浏览器控制：\n\n获取和设置 URL\n\n除了在网页上实现各种功能外，你还可以使用 JavaScript 来控制浏览器。首先，你可以让浏览器告诉你它当前的位置。\n\
  \n```\nvar whereWeAt = window.location.href;\n```\n\n例如，如果浏览器当前位于 *http://www.mybeautifulsite.com/products/page33.html#humidifier*，那么上述语句会将字符串\
  \ `\"http://www.mybeautifulsite.com/products/page33.html#humidifier\"` 赋值给变量 `whereWeAt`。\n\
  \n你也可以获取其中的一部分。以下语句仅获取域名。\n\n```\nvar theDomain = window.location.hostname;\n```\n\
  \n在示例中，字符串 `\"www.mybeautifulwebsite.com\"` 被赋值给变量 `theDomain`。`\"http://\"`、路径和锚点被省略。\n\
  \n以下是获取路径的方法。\n\n```\nvar thePath = window.location.pathname;\n```\n\n在示例中，字符串 `/products/page33.html`\
  \ 被赋值给变量 `thePath`。如果浏览器位于首页且 URL 仅为 *http://www.mybeautifulsite.com*，则字符串 `/` 会被赋值给该变量。\n\
  \n在示例中，浏览器被指向了由锚点 `#humidifier` 标记的页面部分。以下语句识别该锚点。\n\n```\nvar theAnchor = window.location.hash;\n\
  ```\n\n字符串 `#humidifier` 被赋值给变量 `theAnchor`。如果 URL 中没有锚点，则该变量被赋值为空字符串 `\"\"`。\n\n\
  和往常一样，你可以颠倒顺序，告诉浏览器要去哪里，而不是询问它在哪里。\n\n```\nwindow.location.href = \"http://www.me.com/1.html\"\
  ;\n```\n\n上述语句告诉浏览器导航到 `me.com` 站点上名为 `1.html` 的页面。\n\n如果你希望浏览器导航到该站点的主页，可以这样写：\n\
  \n```\nwindow.location.href = \"http://www.me.com\";\n```\n\n如果你希望它定位到某个锚点：\n\n\
  ```\nwindow.location.href = \"http://www.me.com/1.html#section9\";\n```\n\n如果能使用\
  \ `window.pathname = ...` 来跳转到当前站点的另一个页面，或者使用 `window.hash = ...` 来跳转到当前页面的某个锚点，那会很好，但你不能这样做。不过，你可以查询浏览器的域名，并将其与你想要前往的页面组合起来。\n\
  \n```\n1 var currentSite = window.location.hostname;\n2 var destination = \"http://\"\
  \ + currentSite + \"/wow.html\";\n3 window.location.href = destination;\n```\n\n\
  以下是逐行解析：\n\n1.  获取域名并赋值给变量 `currentSite`。示例：`www.me.com`\n\n2.  将字符串 `\"http://\"\
  ` 与域名及目标页面拼接，并将组合结果赋值给变量 `destination`\n\n3.  将浏览器定向到目标地址\n\n以下是如何将浏览器定向到当前页面的某个锚点。\n\
  \n```\n1 var currentSite = window.location.hostname;\n2 var currentPath = window.location.pathname;\n\
  3 var destination = \"http://\" + currentSite + currentPath + \"#humidifier\";\n\
  4 window.location.href = destination;\n```\n\n解析如下：\n\n1.  获取域名并赋值给变量 `currentSite`。示例：`www.me.com`\n\
  \n2.  获取路径名并赋值给变量 `currentPath`。示例：`/1.html`\n\n3.  将字符串 `\"http://\"` 与域名、目标页面及所需锚点拼接，并将组合结果赋值给变量\
  \ `destination`\n\n4.  将浏览器定向到目标地址\n\n![](img/00001.jpeg)\n\n*   你可以省略 `window`。使用\
  \ `location.href`、`location.hostname`、`location.pathname` 和 `location.hash` 是合法的。更常见的做法是包含\
  \ `window`。\n\n*   在检测 URL 时，你可以省略 `href`。使用 `window.location` 或仅使用 `location` 是合法的。（见上文。）出于某些深奥的原因，更推荐包含\
  \ `href`。\n\n*   你可以使用 `document.URL` 作为 `window.location.href` 的替代方案。\n\n*   还有两种方法可以将浏览器定向到某个\
  \ URL，作为 `window.location.href` 的替代方案。你将在下一章学习如何使用它们。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/76.html`](http://www.ASmarterWayToLearn.com/javascript/76.html)\n\
  \n# 77\n\n浏览器控制：\n\n另一种获取和设置 URL 的方式\n\n在上一章中，你学会了通过将字符串赋值给 `window.location.href`\
  \ 来将浏览器定向到新的 URL。以下是实现相同功能的另一种方法。\n\n```\nwindow.location.assign(\"http://www.me.com\"\
  );\n```\n\n该语句将浏览器定向到 `me.com` 的主页。\n\n与 `window.location.href` 语句一样，你可以根据需要使 URL\
  \ 尽可能详细。\n\n```\nwindow.location.assign(\"http://www.me.com/lojack.html#guarantee\"\
  );\n```\n\n该语句将浏览器定向到 `me.com` 站点上 `lojack.html` 页面中的 `#guarantee` 锚点。\n\n以下是另一种效果略有不同的替代方法。\n\
  \n```\nwindow.location.replace(\"http://www.me.com/lojack.html#guarantee\");\n```\n\
  \n同样，该语句将浏览器定向到新的 URL。但通过使用 `replace` 而不是 `assign`，你会干扰浏览器历史记录。当你使用 `assign` 时，历史记录保持不变。该语句将用户从原始页面带到新页面。如果到达新页面后，用户按下\
  \ `Backspace` 键或点击浏览器的 `后退` 按钮，她会返回到刚刚离开的原始页面。但当你使用 `replace` 时，原始页面不会进入历史记录。如果用户在被带到新页面后按下\
  \ `Backspace`，她会被带到原始页面 *之前* 显示的页面，因为原始页面已不在历史记录中。如果原始页面之前没有页面，则按下 `Backspace` 时不会发生任何操作。\n\
  \n要重新加载当前页面，请使用以下语句之一：\n\n```\nwindow.location.reload(true);\nwindow.location.reload(false);\n\
  window.location.reload();\n```\n\n所有三个语句都会重新加载当前页面。如果参数为 `true`（上面的示例 1），该语句会强制浏览器从服务器加载页面。如果参数为\
  \ `false`（示例 2）或没有参数（示例 3），则浏览器会从缓存加载页面（如果页面已被缓存）。\n\n![](img/00001.jpeg)\n\n* \
  \  你可以使用 `window.location.href = window.location.href` 或任何简化的替代方法来重新加载当前页面。重新加载速度更快，但它不允许你指定浏览器是从服务器还是从缓存重新加载。`document.URL\
  \ = document.URL` 不起作用。\n\n本章的交互式编程练习请访问：\n\n\n\n\n\n[`www.ASmarterWayToLearn.com/js/77.html`](http://www.ASmarterWayToLearn.com/javascript/77.html)\n\
  \n# 78 浏览器控制：前进与后退\n\n你可以让浏览器在历史记录中后退一个 URL，就像用户按下了**退格键**或点击了浏览器的**后退**按钮一样。\n\n\
  ```\nhistory.back();\n```\n\n要让浏览器在历史记录中前进，就像用户按下了**Alt+右箭头**或点击了浏览器的**前进**按钮一样……\n\
  \n```\nhistory.forward();\n```\n\n在这两种情况下，如果历史记录中没有可用的 URL，浏览器将不会执行任何操作。\n\n你可以告诉浏览器你想在历史记录中前进或后退多少步，使用负数表示后退，正数表示前进。以下语句相当于按了三次**退格键**。\n\
  \n```\nhistory.go(-3);\n```\n\n以下语句让浏览器前进两个 URL。\n\n```\nhistory.go(2);\n```\n\n\
  如果括号内的负数大于历史记录中可后退的 URL 数量，浏览器将不会执行任何操作。如果括号内的正数大于历史记录中可前进的 URL 数量，浏览器也不会执行任何操作。\n\
  \n当你只想前进或后退一步时，可以选择任意一种方法。\n\n```\nhistory.back();\n```\n\n……等同于……\n\n```\nhistory.go(-1);\n\
  ```\n\n以及……\n\n```\nhistory.forward();\n```\n\n……等同于……\n\n```\nhistory.go(1);\n\
  ```\n\n没有可靠的方法可以得知历史记录中可后退和前进的项目数量。\n\n如果用户通过点击链接来到当前页面，你可以获取该链接所在页面的 URL。\n\n```\n\
  var whereUserCameFrom = document.referrer;\n```\n\n上面的语句将点击链接时的页面 URL 赋值给变量 `whereUserCameFrom`。\n\
  \n然而，这仅在点击了链接（包括搜索结果中的链接）时才有效。如果用户是通过书签或在地址栏中输入 URL 来到你的页面，`document.referrer` 的结果将是一个空字符串\
  \ `\"\"`。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/78.html`](http://www.ASmarterWayToLearn.com/javascript/78.html)\n\
  \n# 79 浏览器控制：用内容填充窗口\n\n弹出窗口是浏览器功能中的“罗德尼·丹杰菲尔德”，因为激进营销者的滥用而名声不佳。但它们也有合法的用途。如果你打算使用它们，就必须处理弹出窗口拦截器，你很快就会学到如何应对。本章和下一章将教你创建窗口的代码。\n\
  \n这是最基本的语句。\n\n```\nvar monkeyWindow = window.open();\n```\n\n上面的代码打开一个最大尺寸的空白窗口，并为其分配一个*句柄*，即一个指向该特定窗口的变量——在本例中是\
  \ `monkeyWindow`。根据浏览器的不同，该窗口可能会覆盖在前一个窗口之上、在新标签页中打开，甚至在新浏览器副本中打开。你无法控制这一点。\n\n有三种方法可以填充新窗口的内容。你可以使用\
  \ `write` 方法将 HTML 内容显示在屏幕上……\n\n```\n1 var monkeyWindow = window.open();\n2 var\
  \ windowContent = \"<h1>卷尾猴</h1><img src='monkey.jpg'><p>“卷尾猴”一词源自一群名为“嘉布遣小兄弟会”的修士，他们穿着<br>带有大兜帽的棕色长袍，遮住头部。</p>\"\
  ;\n3 monkeyWindow.document.write(windowContent);\n```\n\n逐行解释如下：\n\n1.  打开一个新窗口，并将其句柄赋值为\
  \ `monkeyWindow`\n2.  将文本赋值给变量 `windowContent`\n3.  用该文本填充窗口\n\n需要注意的事项：\n\n*  \
  \ 在包裹整个字符串的主引号内，任何引用的文本必须使用单引号，例如 `<img src='monkey.jpg'>`。\n*   使用 `document.write`\
  \ 方法，你将 HTML 字符串放置到页面上。通过窗口的句柄（即打开窗口时声明的变量）来指定该窗口。\n*   此示例中的 `document.write` 方法用于用内容填充一个空窗口。你也可以用它向已有内容的窗口写入内容，但它会覆盖原始文档的所有\
  \ HTML，完全替换其内容。\n*   你也可以不将 HTML 字符串赋值给变量，而是直接将 HTML 字符串放在括号内（当然要用引号括起来）。但这会比示例代码更加笨拙。\n\
  \n第二种填充窗口内容的方法是向其分配一个文档，正如你在前几章中学到的那样。\n\n```\nmonkeyWindow.location.assign(\"http://www.animals.com/capuchin.html\"\
  );\n```\n\n……或者……\n\n```\nmonkeyWindow.location.href = \"http://www.animals.com/capuchin.html\"\
  ;\n```\n\n第三种也是最常见的填充窗口内容的方法是在打开窗口的语句中包含文档分配。\n\n```\nvar monkeyWindow = window.open(\"\
  http://www.animals.com/capuchin.html\");\n```\n\n如果你在弹出窗口中打开的文档与原始文档位于同一主机和目录下，你可以直接这样写……\n\
  \n```\nvar monkeyWindow = window.open(\"capuchin.html\");\n```\n\n关闭窗口的方法如下。\n\n\
  ```\nmonkeyWindow.close();\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/79.html`](http://www.ASmarterWayToLearn.com/javascript/79.html)\n\
  \n# 80 浏览器控制：控制窗口的大小和位置\n\n在上一章中，你学会了不带参数打开一个新窗口——即全尺寸窗口。\n\n你还学会了带一个参数（URL）打开窗口。\n\
  \n可以包含的第二个参数是窗口名称。\n\n```\nvar monkeyWindow = window.open(\"monk.html\", \"win1\"\
  );\n```\n\n在上面的语句中，括号内的第二个项 `\"win1\"` 就是名称。\n\n该名称用于指定 HTML 中 `<a>` 或 `<form>`\
  \ 元素的 `target` 属性。\n\n需要了解的事项：\n\n*   名称（用于 HTML）不是句柄。句柄用于 JavaScript 语句中，以写入窗口、为其分配\
  \ URL 或关闭它。句柄是等号前面的变量。\n*   名称用引号括起来。\n*   名称与 URL 之间用逗号和空格分隔。\n*   名称本身不能包含空格。\n\
  \n你可以指定 URL 参数而不指定名称参数，但不能指定名称参数而不指定 URL 参数。但可以指定一个空的 URL 参数，如下所示。\n\n```\nvar monkeyWindow\
  \ = window.open(\"\", \"win1\");\n```\n\n通常，你会希望指定窗口大小。\n\n```\nvar monkeyWindow\
  \ = window.open(\"monk.html\", \"win1\", \"width=420,height=380\");\n```\n\n需要了解的事项：\n\
  \n*   两个参数（宽度和高度）都包含在一组引号内。\n*   引号内不能有空格，这不仅仅是风格偏好，而是要求。任何空格都会导致 JavaScript 出错。\n\
  *   数字指的是像素。在上面的示例中，窗口宽度为 420 像素，高度为 380 像素。\n*   宽度和高度最小为 100。\n*   与 URL 和名称参数不同，顺序无关紧要。宽度可以在高度之前，高度也可以在宽度之前。但宽度和高度这一组必须放在第三位，位于\
  \ URL 和名称之后。\n*   为了指定这些参数，你必须指定 URL 和名称，即使指定的是空字符串。\n\n比屏幕小的窗口将显示在屏幕的左上角。但你可以选择告诉浏览器窗口的放置位置。\n\
  \n```\nvar w = window.open(\"\", \"\", \"width=420,height=380,left=200,top=100\"\
  );\n```\n\n需要了解的事项：\n\n*   同样，数字是像素——距离屏幕左边缘的像素数和距离屏幕顶部的像素数。\n*   定位参数与大小参数包含在同一组引号内，并且像大小参数一样，用逗号分隔且没有空格。\n\
  *   引号内的参数顺序无关紧要。\n\n\n\n\n*   你可以指定窗口大小而不指定窗口位置，但如果指定了窗口位置而没有指定大小，该设置将被忽略，因为窗口会变成填满整个屏幕的全尺寸窗口。\n\
  \n通常，部分或全部参数可以赋值给一个变量，然后在打开窗口的语句中使用该变量。由于整个内容必须是一个带引号的字符串，字符串内的引号需要改为单引号。\n\n```\n\
  1 var windowSpecs = \"'faq.html', 'faq', 'width=420,height=380,left=200,top=100'\"\
  ;\n2 var faqPage = window.open(windowSpecs);\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/80.html`](http://www.ASmarterWayToLearn.com/javascript/80.html)\n\
  \n# 81\n\n## 浏览器控制：\n\n### 检测弹出窗口拦截器\n\n弹出窗口拦截器现在已是浏览器的标准功能，通常默认启用一定程度的拦截。JavaScript\
  \ 弹出窗口，尤其是那些在同一网站内打开新页面的窗口，通常默认会被允许，但你无法完全确定。如果弹出窗口是你网站的核心功能，你需要测试你的弹出窗口是否会被拦截。如果会被拦截，你可以要求用户为你的网站禁用弹出窗口拦截器。\n\
  \n这个测试方法相当简陋。你尝试打开一个小的测试弹出窗口，然后迅速关闭它——速度快到用户可能注意不到屏幕的闪烁。如果尝试成功，窗口句柄会有一个值。如果弹出窗口被拦截，句柄将为\
  \ `null`，此时你可以向用户发送提示信息。\n\n以下是代码。\n\n```\n1 function checkForPopBlocker() {\n2\
  \   var testPop = window.open(\"\", \"\",\"width=100,height=100\");\n3   if (testPop\
  \ === null) {\n4     alert(\"请禁用您的弹出窗口拦截器。\");\n5   }\n6   testPop.close();\n7 }\n\
  ```\n\n逐行解释：\n\n2 尝试打开一个小窗口\n\n3-4 如果句柄被赋值为 `null`，表示窗口无法打开，则显示一个警告\n\n6 关闭窗口\n\n\
  上述函数适用于除 Internet Explorer 之外的所有浏览器。在 Internet Explorer 中，如果弹出窗口被拦截，句柄将是 `undefined`\
  \ 而不是 `null`。因此，为了覆盖所有情况，你需要这样编写函数。\n\n```\n1 function checkForPopBlocker() {\n\
  2   var testPop = window.open(\"\", \"\",\"width=100,height=100\");\n3   if (testPop\
  \ === null || typeof(testPop === \"undefined\") {\n4     alert(\"请禁用您的弹出窗口拦截器。\"\
  );\n5   }\n6   testPop.close();\n7 }\n```\n\n通常，你会在页面加载时运行这个测试。\n\n`<body onLoad\
  \ =\"checkForPopBlocker();\">`\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/81.html`](http://www.ASmarterWayToLearn.com/javascript/81.html)\n\
  \n# 82\n\n## 表单验证：文本字段\n\n用户是否正确填写了你的表单？JavaScript 可以帮助你找出答案——也就是说，帮助你*验证*表单。通过表单验证，如果出现问题，你可以要求用户重新填写。首先，如果你有必填字段，你可以检查用户是否在其中输入了内容。让我们从一个简单的表单开始，该表单要求用户输入她的姓氏。\n\
  \n以下是该表单的标记。为了让你专注于学习重点，我省略了很多内容，包括样式设置。\n\n```\n<form onSubmit=\"return checkForLastName();\"\
  >\n  请输入您的姓氏。<br>\n  <input type=\"text\" id=\"lastNameField\">\n  <input type=\"\
  submit\" value=\"提交表单\">\n</form>\n```\n\n当用户点击**提交**按钮时，会调用函数 `checkForLastName`。\n\
  \n以下是该函数。\n\n```\n1 function checkForLastName() {\n2   if (document.getElementById(\"\
  lastNameField\").value.length === 0) {\n3     alert(\"请输入您的姓氏\");\n4     return\
  \ false;\n5   }\n6 }\n```\n\n第 2 行询问 ID 为 `\"lastNameField\"` 的字段中值的长度是否为 0。也就是说，是否没有输入任何内容？如果是，则显示一个警告，要求用户输入她的名字。然后在第\
  \ 4 行发生了其他事情：布尔值 `false` 被返回给调用代码。这会阻止表单提交。为了取消提交，调用函数的标记中必须有一个匹配的关键字 `return`。如果没有这个\
  \ `return`，函数第 4 行的 `return` 将无法阻止表单提交。\n\n`<form onSubmit=\"return checkForLastName();\"\
  >`\n\n作为用户友好的设计，你可以使用 `focus` 方法将光标定位到需要填写的字段中。\n\n```\n1 function checkForLastName()\
  \ {\n2   if (document.getElementById(\"lastNameField\").value.length === 0) {\n\
  3     alert(\"请输入您的姓氏\");\n4     document.getElementById(\"lastNameField\").focus();\n\
  5     return false;\n6   }\n7 }\n```\n\n重复书写 `document.getElementById...` 显得相当笨拙，所以我们将其放入一个变量中。\n\
  \n```\n1 function checkForLastName() {\n2 var targetField = document.getElementById(\"\
  lastNameField\");\n3   if (targetField.value.length === 0) {\n4     alert(\"请输入您的姓氏\"\
  );\n5     targetField.focus();\n6     return false;\n7   }\n8 }\n```\n\n我们再添加一个功能。我们将通过将需要填写的字段背景色改为黄色来引导用户注意该字段。\n\
  \n这需要两条额外的语句。如果用户没有填写该字段，第 6 行将其背景色改为黄色。当用户填写完字段后，第 9 行在用户后续提交时再次运行函数，将背景色恢复为白色。\n\
  \n```\n1  function checkForLastName() {\n2   var targetField = document.getElementById(\"\
  lastNameField\");\n3   if (targetField.value.length === 0) {\n4     alert(\"请输入您的姓氏\"\
  );\n5     targetField.focus();\n6     targetField.style.background = \"yellow\"\
  ;\n7     return false;\n8   }\n9   targetField.style.background = \"white\";\n10\
  \ }\n```\n\n![](img/00001.jpeg)\n\n*   本章的示例代码通过 ID 定位表单和字段，这是最直接的方法。但你也可以通过名称、标签或\
  \ DOM 层级中的位置来定位。\n\n*   与其将 ID 硬编码到函数中，你可以通过将字段 ID 作为参数，并从调用代码中传递 ID 来使其可复用。\n\n\
  本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/82.html`](http://www.ASmarterWayToLearn.com/javascript/82.html)\n\
  \n# 83\n\n## 表单验证：下拉菜单\n\n考虑一个包含选择州字段的表单。为了简单起见，我将州列表限制为 4 个。当用户点击“SELECT A STATE”右侧的向上或向下箭头时，会下拉一个菜单。她从中选择一个州。\n\
  \n但如果她忘记选择州呢？\n\n以下是标记，为教学目的进行了简化。\n\n```\n<form onSubmit=\"return checkForSelection();\"\
  >\n  <select id=\"states\">\n    <option value=\"\" selected=\"selected\">\n   \
  \   选择一个州</option>\n        <option value=\"AL\">阿拉巴马州</option>\n        <option\
  \ value=\"AK\">阿拉斯加州</option>\n        <option value=\"AZ\">亚利桑那州</option>\n   \
  \     <option value=\"AR\">阿肯色州</option>\n    </select>&nbsp;&nbsp;\n  <input type=\"\
  submit\" value=\"提交表单\">\n</form>\n```\n\n当点击**提交**按钮时，会调用函数 `checkForSelection`。注意，关键字\
  \ `return` 再次出现在函数调用之前。\n\n以下是该函数。\n\n```\n1 function checkForSelection() {\n2 \
  \  if (document.getElementById(\"states\").selectedIndex === 0) {\n3     alert(\"\
  请选择一个州。\");\n4     return false;\n5   }\n6 }\n```\n\n在函数中，如果 `selectedIndex` 为 0（第\
  \ 2 行），表示用户尚未做出选择。第 3 行显示一个警告，要求她选择。第 4 行返回 `false`，取消表单提交。\n\n以下是该函数的两个改进版本。首先，它接受元素\
  \ ID 作为参数，从而可以处理多个表单。其次，将元素赋值给一个变量。\n\n```\n1 function checkForSelection(selecID)\
  \ {\n2   var target = document.getElementById(selecID);\n```\n\n\n\n\n```\n3   if\
  \ (target.selectedIndex === 0) {\n4     alert(\"Please select a state.\");\n5  \
  \   return false;\n6   }\n7 }\n```\n\n上述编码的函数需要事件处理程序将 ID 作为参数包含在内。\n\n`<form onSubmit=\"\
  return checkForSelection('states');\">`\n\n查找本章的交互式编码练习，请访问：\n\n[`www.ASmarterWayToLearn.com/js/83.html`](http://www.ASmarterWayToLearn.com/javascript/83.html)\n\
  \n# 84\n\n表单验证：单选按钮\n\n让我们编写一个包含一组单选按钮的表单。这些按钮分别是 Cat、Bat 和 Hat。\n\n这是标记代码，为了让你专注于正在学习的内容而进行了简化。\n\
  \n```\n<form onSubmit=\"return validateRadios();\">\n  <input type=\"radio\" name=\"\
  r1\" value=\"cat\"> Cat<br>\n  <input type=\"radio\" name=\"r1\" value=\"bat\">\
  \ Bat<br>\n  <input type=\"radio\" name=\"r1\" value=\"hat\"> Hat<br>\n  <input\
  \ type=\"submit\" value=\"Submit Form\">\n</form>\n```\n\n注意，所有单选按钮的名称都是相同的，即`r1`。\n\
  \n这是验证函数，用于检查用户是否点击了其中一个按钮。\n\n```\n1  function validateRadios() {\n2    var radios\
  \ = document.getElementsByName(\"r1\");\n3    for (var i = 0; i < radios.length;\
  \ i++) {\n4      if (radios[i].checked) {\n5        return true;\n6      }\n7  \
  \  }\n8    alert(\"Please check one.\");\n9    return false;\n10 }\n```\n\n第 2 行创建了一个包含所有名称为`r2`的按钮的集合，并将该集合赋值给变量`radios`。这是可行的，因为尽管一个元素不能与其他元素共享其\
  \ id，但任意数量的元素可以共享相同的名称。第 3 行和第 7 行遍历集合，检查是否有任何按钮被选中。如果是，代码通过第 5 行的`return`关键字跳出函数，返回布尔值`true`，以便表单可以提交。如果循环运行完毕没有找到任何选中的按钮，第\
  \ 8 行显示一个警告，第 9 行返回`false`，取消表单提交。\n\n如果我们指定一个参数，允许事件处理程序将按钮组名称传递给函数，则该函数可用于验证任意数量表单的按钮部分。\n\
  \n```\n1  function validateRadios(ename) {\n2    var radios = document.getElementsByName(eName);\n\
  ```\n\n为了使用上述编码的函数，事件处理程序必须将按钮组名称作为参数包含在内。\n\n`<form onSubmit=\"return validateRadios('r1');\"\
  >`\n\n查找本章的交互式编码练习，请访问：\n\n[`www.ASmarterWayToLearn.com/js/84.html`](http://www.ASmarterWayToLearn.com/javascript/84.html)\n\
  \n# 85\n\n表单验证：邮政编码\n\n现在，一个单字段表单要求用户输入她的邮政编码。\n\n你已经学会了如何确保用户没有留空字段。但是如何测试她是否输入了正确的邮政编码位数——5\
  \ 位数字呢？\n\nHTML 提供了一种方法防止她输入过多数字：`maxlength=5`。但如果你想确保她没有输入过少数字，你需要使用 JavaScript。以下是该函数。\n\
  \n```\n1 function validateZIP() {\n2   var numChars = document.getElementById(\"\
  zip\").value.length;\n3   if (numChars < 5) {\n4     alert(\"Please enter a 5-digit\
  \ code.\");\n5     return false;\n6   }\n7 }\n```\n\n如果字段中的字符数少于 5，则显示警告，并向调用代码返回\
  \ false，取消表单提交。\n\n关于邮政编码字段输入的另一个问题是用户是否只输入了数字。以下是为此添加的代码。\n\n```\n1  function validateZIP()\
  \ {\n2    var valueEntered = document.getElementById(\"zip\").value;\n3    var numChars\
  \ = valueEntered.length;\n4    if (numChars < 5) {\n5      alert(\"Please enter\
  \ a 5-digit code.\");\n6      return false;\n7    }\n8    for (var i = 0; i <= 4;\
  \ i++) {\n9      var thisChar = parseInt(valueEntered[i]);\n10     if (isNaN(thisChar))\
  \ {\n11       alert(\"Please enter only numbers.\");\n12       return false;\n13\
  \     }\n14   }\n15 }\n```\n\n高亮显示的代码遍历已输入的五个字符，检查确保所有字符都是表示数字的字符串字符。因为字段中的五个字符是字符串字符，每个字符在测试前必须尽可能转换为数字。第\
  \ 9 行执行此操作。第 10 行测试转换是否成功。如果第 9 行的`parseInt`得到了一个数字，则没问题。但如果转换尝试后字符不是数字——即第 10 行的`isNaN`为真——则显示警告并返回\
  \ false，取消表单提交。\n\n![](img/00001.jpeg)\n\n一种更优雅、更通用的表单验证方法是使用*正则表达式*。正则表达式超出了本书的范围，但我将在下一章中让你略窥一二。\n\
  \n查找本章的交互式编码练习，请访问：\n\n[`www.ASmarterWayToLearn.com/js/85.html`](http://www.ASmarterWayToLearn.com/javascript/85.html)\n\
  \n# 86\n\n表单验证：电子邮件\n\n验证电子邮件字段包括检查确保没有非法字符（如空格），并且合法电子邮件地址的所有要素都存在：一个或多个字符，后跟`@`，再后跟一个或多个字符，后跟一个点，再后跟两到四个字符。测试所有这些的标准方法是将用户的输入与正则表达式进行匹配。正则表达式超出了本书的范围，但我将在本章末尾让你体验一下。同时，这里介绍如何使用`indexOf`来避免许多用户错误。\n\
  \n让我们从检查空格开始，空格在电子邮件地址中是非法的。\n\n```\n1 function validateEmail() {\n2   var eEntered\
  \ = document.getElementById(\"email\").value;\n3   if (eEntered.indexOf(\" \") !==\
  \ -1) {\n4     alert(\"No spaces allowed in address\");\n5     return false;\n6\
  \   }\n7 }\n```\n\n第 3 行是关键。如果非法空格字符的索引不是-1，则意味着该字符存在于某处，并显示警告。\n\n如果你愿意，你可以用同样的方法测试所有其他非法字符的存在。但在那种情况下，你最好使用正则表达式，正如我在本章末尾所示。\n\
  \n在电子邮件地址中，你希望`@`符号距离字符串开头至少一个字符，并且距离字符串末尾不少于 5 个字符。以下是将此测试添加到示例函数中的一行代码。\n\n```\n\
  1   function validateEmail() {\n2     var addressIsLegal = true;\n3     var eEntered\
  \ = document.getElementById(\"address\").value;\n4     if (eEntered.indexOf(\" \"\
  ) !== -1) {\n5       addressIsLegal = false;\n6     }\n7     if (eEntered.indexOf(\"\
  @\") < 1 || eEntered.indexOf(\"@\") > eEntered.length - 5) {\n8       addressIsLegal\
  \ = false;\n9     }\n10    if (addressIsLegal === false) {\n11      alert(\"Please\
  \ correct email address\");\n12      return false;\n13    }\n14 }\n```\n\n关于第 7\
  \ 行：管道符左侧的第一部分测试该字符是否位于地址的开头，这是非法的。管道符右侧的第二部分测试该字符后面是否少于 4 个字符。由于域名至少需要一个字符，加上一个点，再加上至少两个字符的扩展名，因此@后面少于\
  \ 4 个字符是非法的。\n\n最后，我将添加一个对点的测试，该点需要与\"@\"至少相隔 1 个字符，并且其后有 2 到 4 个字符。\n\n```\n1 \
  \  function validateEmail() {\n2    var addressIsLegal = true;\n3    var eEntered\
  \ = document.getElementById(\"address\").value;\n4    if (eEntered.indexOf(\" \"\
  ) !== -1) {\n5      addressIsLegal = false;\n6    }\n7    if (eEntered.indexOf(\"\
  @\") < 1 || eEntered.indexOf(\"@\") > eEntered.length - 5) {>\n8      addressIsLegal\
  \ = false;\n9    }\n10   if (eEntered.indexOf(\".\") - eEntered.indexOf(\"@\") <\
  \ 2 ||\neEntered.indexOf(\".\") > eEntered.length - 3) {\n11     addressIsLegal\
  \ = false;\n12   }\n13   if (addressIsLegal === false) {\n```\n\n\n\n\n\n14    \
  \ alert(\"Please correct email address\");\n15     return false;\n16   }\n14 }\n\
  \n`第 10 行`：点号和`@`之间必须至少有一个字符。第一部分（管道符左侧）测试是否缺少该字符（或多个字符），如果缺少则非法。点号后面也必须至少有两个字符。第二部分（管道符右侧）测试点号后面的字符是否少于两个，如果少于则非法。\n\
  \n![](img/00001.jpeg)\n\n上面展示的所有测试，以及其他更多测试，都可以整合到一个正则表达式测试中。正则表达式表达了一种模式，在这种情况下，用户的输入必须匹配该模式才能通过验证。如果你熟悉通配符`*`（表示“任意长度的任意字符组合”），那么大致就是这个概念。但正则表达式远不止通配符这么简单。\n\
  \n正则表达式值得单独写一本书，超出了本书的范围。但为了让你感受一下它们有多强大（以及简洁！），这里有一个例子。它测试了上面代码中检查的所有非法情况，甚至更多。（本章练习中不会涉及这个例子，所以不必记住其中的任何内容。）\n\
  \n```\n1 function validateEmail() {\n2   var eEntered = document.getElementById(\"\
  address\").value;\n3   var regex = /^[\\w\\-\\.\\+]+\\@[a-zA-Z0-9\\. \\-]+\\.[a-zA-z0-9]{2,4}$/;\n\
  4   if (!(eEntered.match(emailCorrectPattern))) {\n5     alert(\"Please correct\
  \ email address\");\n6     return false;\n7   }\n8 }\n```\n\n本章的交互式编程练习请访问：\n\n\
  [`www.ASmarterWayToLearn.com/js/86.html`](http://www.ASmarterWayToLearn.com/javascript/86.html)\n\
  \n# 87\n\n异常：`try` 和 `catch`\n\n如果你运行以下代码，什么也不会发生。\n\n```\n1 function greetWorld()\
  \ {\n2   var greeting = \"Hello world!\";\n3   aler(greeting);\n4 }\n```\n\n关键字\
  \ `alert` 被拼写成了 `aler`，导致代码出错。但 JavaScript 不会告诉你哪里出了问题。就像一辆无法启动的汽车：是电池？油路？还是火花塞？\n\
  \n当然，在上面这段小代码中，很容易发现问题。但如果函数有 40 行代码，并且调用了其他三个函数呢？如果 JavaScript 能向你报告具体问题，而不是直接崩溃，那就太好了。这正是\
  \ `try...catch` 的作用。它的工作原理如下。\n\n```\n1 function greetWorld() {\n2   try {\n3  \
  \   var greeting = \"Hello world!\";\n4     aler(greeting);\n5   }\n6   catch(err)\
  \ {\n7     alert(err);\n8   }\n9 }\n```\n\n原始的操作代码被包裹在 `try` 块中。拼写错误的 `aler` 导致了一个\
  \ JavaScript 错误，该错误被传递给 `catch` 块。一个警告框会显示导致问题的错误。\n\n当你将一些操作代码包裹在 `try` 块中时，你是在对\
  \ JavaScript 说：“尝试执行这段代码。如果出现错误，停止执行，并转到 `catch` 块查看该怎么做。”在上面的例子中，JavaScript 抛出的错误被赋值给参数\
  \ `err`，然后该值显示在警告框中：\n\n`\"ReferenceError: Can't find variable: aler\"`\n\n好吧，在这个例子中，JavaScript\
  \ 并没有给出你想要的精确信息。它没有告诉你漏掉了 `alert` 关键字中的 \"t\"，而是告诉你遇到了一个未定义的变量。但已经足够接近了。JavaScript\
  \ 为你指明了正确的方向。\n\n请注意，`try` 和 `catch` 总是成对出现。没有 `try`，错误就不会触发 `catch`。没有 `catch`，JavaScript\
  \ 在抛出错误时就不知道该怎么办。\n\n还有一些需要注意的事项：\n\n*   `try` 和 `catch` 块内的代码用花括号包裹。\n*   `try`\
  \ 块内的功能代码需要缩进。\n*   错误参数（本例中为 `err`）可以使用任何合法的变量名。\n*   在这个例子中，错误发生时显示了一个警告框。但你也可以做其他事情。\n\
  \n`try` 和 `catch` 这对组合的用途有限。例如，在上面的例子中，如果你漏掉了一个括号、方括号或引号，或者多写了它们，都不会显示警告框。代码只会崩溃，什么也不会发生。`try`\
  \ 和 `catch` 方法主要用于发现未定义的变量，或者像本例中这样，JavaScript 将其解释为未定义变量的错误。\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/87.html`](http://www.ASmarterWayToLearn.com/javascript/87.html)\n\
  \n# 88\n\n异常：`throw`\n\n通过添加一个或多个 `throw` 语句，你可以在 `try...catch` 对中定义自己的错误。这对于处理用户的不当行为非常有用。\n\
  \n假设你要求用户创建一个密码。密码长度必须在 8 到 12 个字符之间，必须包含至少一个数字，并且不能包含空格。以下是创建表单的标记，为了让你专注于要点而进行了简化：\n\
  \n```\n<form onSubmit=\"return checkPassword();\">\n  Enter a password<br>\n  (8-12\
  \ characters, at least 1 number, no spaces)<br>\n  <input type=\"text\" id=\"f1\"\
  >\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n这是测试用户输入是否满足要求的函数。如果不满足，函数会显示一个警告框。\n\
  \n```\n1  function checkPassword() {\n2    try {\n3      var pass = document.getElementById(\"\
  f1\").value;\n4      if (pass.length < 8) {\n5        throw \"Please enter at least\
  \ 8 characters.\";\n6      }\n7      if (pass.indexOf(\" \") !== -1) {\n8      \
  \  throw \"No spaces in the password, please.\";\n9      }\n10     var numberSomewhere\
  \ = false;\n11     for (var i = 0; i < pass.length; i++) {\n12       if (isNaN(pass(i,\
  \ i+1)) === false) {\n13         numberSomewhere = true;\n14         break;\n15\
  \       }\n16     }\n17     if (numberSomewhere === false) {\n18       throw \"\
  Include at least 1 number.\";\n19     }\n20   }\n21   catch(err) {\n22     alert(err);\n\
  23   }\n24 }\n```\n\n第 4 到 9 行以及第 17 到 19 行测试了三种不同的用户错误，每个错误都抛出了一个自定义字符串。`catch`\
  \ 代码捕获的不是 JavaScript 生成的错误，而是 `throw` 发送的字符串。这个值被赋值给第 21 行的变量 `err`，并作为第 22 行的显示消息。\n\
  \n请注意，任何类型的值（包括数字或布尔值）都可以通过 `throw` 传递给 `catch` 参数。你也可以传递一个变量。\n\n本章的交互式编程练习请访问：\n\
  \n[`www.ASmarterWayToLearn.com/js/88.html`](http://www.ASmarterWayToLearn.com/javascript/88.html)\n\
  \n# 89\n\n在 JavaScript 中处理事件\n\n在前面的章节中，你学习了如何使用内联事件处理程序来处理按钮点击或表单提交等事件。这是最古老、最不抽象的方式。但根据专业程序员“分离政教”的理念，JavaScript\
  \ 的功能应该与 HTML 的内容分开。首先，一个不太理想的内联方式示例：\n\n`<input type=\"button\" value=\"Click\"\
  \ onClick=\"sayHello();\">`\n\n我们将移除上面标记中高亮的部分，并添加一个 `id`。\n\n`<input type=\"button\"\
  \ value=\"Click\" id=\"button1\">`\n\n以下是处理事件的 JavaScript 代码。\n\n```\n1 var b1 =\
  \ document.getElementById(\"button1\");\n2 b1.onclick = sayHello;\n```\n\n第 1 行将元素赋值给变量\
  \ `b1`。第 2 行监听该元素的点击事件。当点击发生时，它会调用函数 `sayHello`。\n\n需要注意的事项：\n\n*   与内联事件处理中使用的驼峰式命名不同，事件名称必须全部小写，否则无法工作。是\
  \ `onclick` 而不是 `onClick`，`onfocus` 而不是 `onFocus`，`onsubmit` 而不是 `onSubmit`。\n*\
  \   与内联事件处理不同，等号后面的函数名不带引号。\n*   与内联事件处理不同，函数名后面没有括号。\n\n如果你愿意，可以将其压缩成一条语句：\n\n\
  ```\ndocument.getElementById(\"button1\").onclick = sayHello;\n```\n\n\n\n\n无论使用内联事件处理还是脚本化事件处理，函数代码都是相同的。例如：\n\
  \n```\nfunction sayHello() {\n  alert(\"Hi there.\");\n}\n```\n\n这段代码调用了一个函数，当用户将鼠标悬停在原始图像上时，它会将一张图像替换为另一张图像。\n\
  \n```\nvar targetImg = document.getElementById(\"i12\");\ntargetImg.onmouseover\
  \ = swapPic;\n```\n\n这段代码调用了一个函数，当表单提交时，它会验证电子邮件地址。\n\n```\nvar emailFrm = document.getElementById(\"\
  form5\");\nemailFrm.onsubmit = valEmail;\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/89.html`](http://www.ASmarterWayToLearn.com/javascript/89.html)\n"
