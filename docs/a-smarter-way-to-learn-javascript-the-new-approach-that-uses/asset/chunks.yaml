    In the following example, the calling code passes a variable, a string, and a
    number to the function. Three parameters catch the values. The function concatenates
    them to create an alert message.


    First, here''s the function.


    1 function showMessage(m, string, num);


    2   alert(m + string + num);


    3 }


    Now here''s the statement that calls the function.


    1 var month = "March";


    2 showMessage(month, "''s winner number is ", 23);


