    ## 26 数字取整


    你经营一个在线音乐服务，客户对每首歌进行评分。你汇总所有客户评分并计算平均值，给歌曲打零到五星。通常，平均会产生一个分数。你需要将其四舍五入到最接近的整数，以便将数字转换为星数。假设平均值已赋给变量`scoreAvg`。以下是将其四舍五入到最接近整数的代码。


    `var numberOfStars = Math.round(scoreAvg);`


    需要记住的事项：


    * `Math.`是所有数学函数的开头。"M"必须大写。

    * 当小数为`.5`时，函数向上取整。它将`1.5`取整为`2`，`2.5`取整为`3`，等等。它将`-1.5`取整为`-1`，`-2.5`取整为`-2`，等等。


