    ## 25 字符串：替换字符


    在前面的章节中，你学习了两种不同的方法来将字符串中的“World War II”替换为“the Second World War”。首先，是循环加切片的方法。


    ```javascript

    1 for (var i = 0; i < text.length; i++) {

    2   if (text.slice(i, i + 12) === "World War II") {

    3     text = text.slice(0, 1) + "the Second World War" + text.slice(i + 12);

    4   }

    5 }

    ```


    当你学习了`indexOf`方法后，你改进了这种相当粗糙的方法。


    ```javascript

    1 var firstChar = text.indexOf("World War II");

    2 if (firstChar !== -1) {

    3   text = text.slice(0, firstChar) + "the Second World War" + text.slice(firstChar
    + 12);

    4 }

    ```


    但 JavaScript 还提供了一种更直接的方法，即`replace`方法。


    `var newText = text.replace("World War II", "the Second World War");`


    括号内的第一个字符串是要替换的片段。第二个字符串是要插入的片段。在上面的代码中，由变量`text`表示的字符串中的片段“World War II”被替换为片段“the
    Second World War”，修改后的字符串被赋给新变量`newText`。


    如果将修改后的字符串赋给一个新变量，如上例所示，则原始字符串保持不变。如果你希望原始字符串被修改后的字符串替换，则将修改后的字符串赋给原始变量。


    `text = text.replace("World War II", "the Second World War");`


    在上面的例子中，只替换了字符串的第一个实例。如果你想替换所有实例，你必须让 JavaScript 知道你想要一个*全局*替换。


    `var newText = text.replace(/World War II/g, "the Second World War");`


    在全局替换中，你将待替换的片段用斜杠括起来而不是引号，并在结束斜杠后加上`g`表示“全局”。要插入的片段用引号括起来，与一次性替换相同。


