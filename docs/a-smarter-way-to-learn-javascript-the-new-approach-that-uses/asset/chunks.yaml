    # 76


    浏览器控制：


    获取和设置 URL


    除了在网页上实现各种功能外，你还可以使用 JavaScript 来控制浏览器。首先，你可以让浏览器告诉你它当前的位置。


    ```

    var whereWeAt = window.location.href;

    ```


    例如，如果浏览器当前位于 *http://www.mybeautifulsite.com/products/page33.html#humidifier*，那么上述语句会将字符串
    `"http://www.mybeautifulsite.com/products/page33.html#humidifier"` 赋值给变量 `whereWeAt`。


    你也可以获取其中的一部分。以下语句仅获取域名。


    ```

    var theDomain = window.location.hostname;

    ```


    在示例中，字符串 `"www.mybeautifulwebsite.com"` 被赋值给变量 `theDomain`。`"http://"`、路径和锚点被省略。


    以下是获取路径的方法。


    ```

    var thePath = window.location.pathname;

    ```


    在示例中，字符串 `/products/page33.html` 被赋值给变量 `thePath`。如果浏览器位于首页且 URL 仅为 *http://www.mybeautifulsite.com*，则字符串
    `/` 会被赋值给该变量。


    在示例中，浏览器被指向了由锚点 `#humidifier` 标记的页面部分。以下语句识别该锚点。


    ```

    var theAnchor = window.location.hash;

    ```


    字符串 `#humidifier` 被赋值给变量 `theAnchor`。如果 URL 中没有锚点，则该变量被赋值为空字符串 `""`。


    和往常一样，你可以颠倒顺序，告诉浏览器要去哪里，而不是询问它在哪里。


    ```

    window.location.href = "http://www.me.com/1.html";

    ```


    上述语句告诉浏览器导航到 `me.com` 站点上名为 `1.html` 的页面。


    如果你希望浏览器导航到该站点的主页，可以这样写：


    ```

    window.location.href = "http://www.me.com";

    ```


    如果你希望它定位到某个锚点：


    ```

    window.location.href = "http://www.me.com/1.html#section9";

    ```


    如果能使用 `window.pathname = ...` 来跳转到当前站点的另一个页面，或者使用 `window.hash = ...` 来跳转到当前页面的某个锚点，那会很好，但你不能这样做。不过，你可以查询浏览器的域名，并将其与你想要前往的页面组合起来。


    ```

    1 var currentSite = window.location.hostname;

    2 var destination = "http://" + currentSite + "/wow.html";

    3 window.location.href = destination;

    ```


    以下是逐行解析：


    1.  获取域名并赋值给变量 `currentSite`。示例：`www.me.com`


    2.  将字符串 `"http://"` 与域名及目标页面拼接，并将组合结果赋值给变量 `destination`


    3.  将浏览器定向到目标地址


    以下是如何将浏览器定向到当前页面的某个锚点。


    ```

    1 var currentSite = window.location.hostname;

    2 var currentPath = window.location.pathname;

    3 var destination = "http://" + currentSite + currentPath + "#humidifier";

    4 window.location.href = destination;

    ```


    解析如下：


    1.  获取域名并赋值给变量 `currentSite`。示例：`www.me.com`


    2.  获取路径名并赋值给变量 `currentPath`。示例：`/1.html`


    3.  将字符串 `"http://"` 与域名、目标页面及所需锚点拼接，并将组合结果赋值给变量 `destination`


    4.  将浏览器定向到目标地址


    ![](img/00001.jpeg)


    *   你可以省略 `window`。使用 `location.href`、`location.hostname`、`location.pathname`
    和 `location.hash` 是合法的。更常见的做法是包含 `window`。


    *   在检测 URL 时，你可以省略 `href`。使用 `window.location` 或仅使用 `location` 是合法的。（见上文。）出于某些深奥的原因，更推荐包含
    `href`。


    *   你可以使用 `document.URL` 作为 `window.location.href` 的替代方案。


    *   还有两种方法可以将浏览器定向到某个 URL，作为 `window.location.href` 的替代方案。你将在下一章学习如何使用它们。


    本章的交互式编程练习请访问：


    [`www.ASmarterWayToLearn.com/js/76.html`](http://www.ASmarterWayToLearn.com/javascript/76.html)


    # 77


    浏览器控制：


    另一种获取和设置 URL 的方式


    在上一章中，你学会了通过将字符串赋值给 `window.location.href` 来将浏览器定向到新的 URL。以下是实现相同功能的另一种方法。


    ```

    window.location.assign("http://www.me.com");

    ```


    该语句将浏览器定向到 `me.com` 的主页。


    与 `window.location.href` 语句一样，你可以根据需要使 URL 尽可能详细。


    ```

    window.location.assign("http://www.me.com/lojack.html#guarantee");

    ```


    该语句将浏览器定向到 `me.com` 站点上 `lojack.html` 页面中的 `#guarantee` 锚点。


    以下是另一种效果略有不同的替代方法。


    ```

    window.location.replace("http://www.me.com/lojack.html#guarantee");

    ```


    同样，该语句将浏览器定向到新的 URL。但通过使用 `replace` 而不是 `assign`，你会干扰浏览器历史记录。当你使用 `assign` 时，历史记录保持不变。该语句将用户从原始页面带到新页面。如果到达新页面后，用户按下
    `Backspace` 键或点击浏览器的 `后退` 按钮，她会返回到刚刚离开的原始页面。但当你使用 `replace` 时，原始页面不会进入历史记录。如果用户在被带到新页面后按下
    `Backspace`，她会被带到原始页面 *之前* 显示的页面，因为原始页面已不在历史记录中。如果原始页面之前没有页面，则按下 `Backspace` 时不会发生任何操作。


    要重新加载当前页面，请使用以下语句之一：


    ```

    window.location.reload(true);

    window.location.reload(false);

    window.location.reload();

    ```


    所有三个语句都会重新加载当前页面。如果参数为 `true`（上面的示例 1），该语句会强制浏览器从服务器加载页面。如果参数为 `false`（示例 2）或没有参数（示例
    3），则浏览器会从缓存加载页面（如果页面已被缓存）。


    ![](img/00001.jpeg)


    *   你可以使用 `window.location.href = window.location.href` 或任何简化的替代方法来重新加载当前页面。重新加载速度更快，但它不允许你指定浏览器是从服务器还是从缓存重新加载。`document.URL
    = document.URL` 不起作用。


