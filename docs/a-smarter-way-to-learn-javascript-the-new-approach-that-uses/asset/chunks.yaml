  raw: 'If you wanted to use this data in JavaScript, you could assign each value
    to a different variable, like this.


    1  var plan1Name = "Basic";


    2  var plan1Price = 3.99;


    3  var plan1Space = 100;


    4  var plan1Data = 1000;


    5  var plan1Pages = 10;


    6  var plan2Name = "Professional";


    7  var plan2Price = 5.99;


    8  var plan2Space = 500;


    9  var plan2Data = 5000;


    10 var plan2Pages = 50;


    11 var plan3Name = "Ultimate";


    12 var plan3Price = 9.99;


    13 var plan3Space = 2000;


    14 var plan3Data = 20000;


    15 var plan3Pages = 500;


    Having made all these variable assignments, you could then, for example, write
    this JavaScript statement...


    alert("The cost of the " + plan2Name + "package is $" + plan2Price + " per month.");


    ...and an alert would display saying, "The cost of the Professional package is
    $5.99 per month."


    But assigning all these values to variables is unwieldy, and can lead to problems
    if things get complicated. A better way to handle the situation is to create *objects*
    with *properties*. This is a handier scheme that more accurately reflects the
    2-dimensional, gridlike nature of the host company''s table that we started with.
    This table shows all the options expressed as objects and properties.


    ![](images/00015.jpeg)


    In this example, each hosting plan is an object—plan1, plan2, plan3. And each
    object has 5 properties—name, cost, space, transfer, and pages. Properties are
    just variables that are attached to an object. In this case, there''s a string
    property (name) and four number properties (price, space, transfer, and pages)
    for each object.


    In code we refer to objects and their properties using dot notation. Here''s the
    statement that creates the alert shown above, with object-property pairs replacing
    the simple variables.


    alert("The cost of the " + plan2.name + " package is $" + plan2.price + " per
    month.");


    plan2.name represents "Professional". plan2.price represents 5.99.


    The most straightforward way to define an object and its properties is this.


    1 var plan1 = {


    2   name: "Basic",


    3   price: 3.99,


    4   space: 100,


    5   transfer: 1000,


    6   pages: 10


    7 };


    Things to notice:


    *   The code begins like any variable definition, with the keyword var, followed
    by the object name, and then an equal sign.


    *   But then, instead of a value, there''s a curly bracket, whose twin comes at
    the end of the block.


    *   Each property begins with a name, followed by a colon, and then a value.


    *   Each property definition except the last ends with a comma.


    *   The closing curly bracket is followed by a semicolon, because of the equal
    sign in the first line.


    Now let''s add one more property, discountMonths. If the current month is July,
    August, or December, the customer gets a 20 percent discount on the hosting plan.
    To keep track of those special months, we''ll assign them to a new property. This
    new property is an array, not a simple variable.


    plan1.discountMonths = [6, 7, 11];


    The statement above creates a new property of the object plan1, discountMonths,
    and assigns an array to it representing the three months when the customer gets
    a discount.


    You refer to the individual elements of this array property the same way you''d
    refer to the elements of any array, with a number inside brackets, but using the
    dot notation of the object-property pair, plan1.discountMonths.


    var mo = plan1.discountMonths[2];


    The statement above assigns the third element of the array, the number representing
    December, to the variable mo.


    So far, we''ve defined only one object, plan1, and its properties. To complete
    the set of objects that includes plan2 and plan3, you''d have to do the same thing
    again, and then again. You may be thinking that this all takes more work than
    just defining 15 simple variables as I did early in the chapter, but defining
    objects and their properties is actually a better way to go, for reasons that
    I''ll discuss in later chapters. Plus, there''s a less labor-intensive way to
    go about it, which you''ll also learn.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/69.html](http://www.ASmarterWayToLearn.com/javascript/69.html)


    # 70


    Objects:


    Properties


    To change the value of an object''s number value, use a simple assignment statement,
    the same way you''d assign a value to a plain variable.


    deal3.cost = 79.95;


    Whatever the value of deal3.cost was, now it''s 79.95.


    Of course, you can assign a string instead of a number.


    deal3.name = "Super-saver";


    Whatever the value of deal3.name was, now it''s "Super-saver".


    You can also assign an array list to a property.


    deal3.features = ["Guarantee", "Free Ship"];


    Whatever the value of deal3.features was, now it''s an array with the elements
    "Guarantee" and "Free Ship."


    You can also assign a Boolean value.


    deal3.membersOnly = false;


    Whatever the value of deal3.membersOnly was, now it''s false.


    You can also use an assignment statement to define a new property for an object.
    Suppose the object deal3 has some properties, but none of them are deal3.market.
    Now you want to add it, while assigning it a value.


    deal3.market = "regional";


    Just as you can create an undefined variable by not assigning it a value, you
    can create an object without any properties.


    var deal4 = {};


    If you want to create a property now and assign it a value later, you can create
    it with a value of undefined.


    deal3.market = undefined;


    Note that the keyword undefined isn''t in quotation marks. It isn''t a string.


    You can delete a property of an object.


    delete deal3.market;


    You can check to see if a property of an object exists. The following statement
    tests whether there is such a thing as deal3.market and assigns the result (true
    or false) to the variable propertyExists.


    propertyExists = "market" in deal3;


    Things to notice:


    *   You could use any legal variable name instead of propertyExists.


    *   The keyword in asks, "The property market is in the object deal3—true or false?"


    *   The property market is in quotes.


    *   The object deal3 is not in quotes.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/70.html](http://www.ASmarterWayToLearn.com/javascript/70.html)


    # 71


    Objects:


    Methods


    Let''s return to the chart showing different hosting plans.


    ![](images/00016.jpeg)


    We''re going to write a function that calculates the annual charge based on this
    chart. Note that if the user signs up at certain times of the year, he gets a
    discount for the entire year. If he signs up for the Basic plan in July or August,
    he gets 20 per cent off. If he signs up for the Professional plan in July, August,
    or December, he gets 20 per cent off. If he signs up for the Ultimate plan in
    July or August, he gets 20 per cent off.


    We begin by creating three objects with properties. This is the object and its
    properties that represent the Basic plan.


    1 var plan1 = {


    2   name: "Basic",


    3   price: 3.99,


    4   space: 100,


    5   transfer: 1000,


    6   pages: 10,


    7   discountMonths: [6, 7]


    8 };


    The function cycles through all the discount months (line 5) checking to see if
    any of them happen to be the current month (line 6). If so, it calculates a 20
    percent discount by multiplying the regular price by .8. Then it multiplies the
    monthly price, discounted or not, by 12, to get the annual price, and returns
    the number to the calling code (line 11).


    1  function calcAnnual() {


    2    var bestPrice = plan1.price;


    3    var currDate = new Date();


    4    var thisMo = currDate.getMonth();


    5    for (var i = 0; i < plan1.discountMonths.length; i++) {


    6      if (plan1.discountMonths[i] === thisMo) {


    7        bestPrice = plan1.price * .8;


    8        break;


    9      }


    10   }


    11   return bestPrice * 12;


    12 }


    This is the calling statement that executes the function.


    var annualPrice = calcAnnual();'
