    have to *ever* define a variable that you''ve declared.


    JavaScript variable names have no inherent meaning to JavaScript.


    In English, words have meaning. You can''t use just any word to communicate. I
    can say, "My name is Mark," but, if I want to be understood, I can''t say, "My
    floogle is Mark." That''s nonsense.


    But with variables, JavaScript is blind to semantics. You *can* use just any word
    (as long as it doesn''t break the rules of variable-naming). From JavaScript''s
    point of view...


    var floogle = "Mark";


    ...is just as good as...


    var name = "Mark";


    If you write...


    var floogle = "Mark";


    ...then ask JavaScript to print floogle, JavaScript prints...


    Mark


    Within limits, you can name variables anything you want, and JavaScript won''t
    care.


    var lessonAuthor = "Mark";


    var guyWhoKeepsSayingHisOwnName = "Mark";


    var x = "Mark";


    JavaScript''s blindness to meaning notwithstanding, when it comes to variable
    names, you''ll want to give your variables meaningful names, because it''ll help
    you and other coders understand your code.


    Again, the syntactic difference between variables and text strings is that variables
    are never enclosed in quotes, and text strings are always enclosed in quotes.


    It''s always...


    var lastName = "Smith";


    var cityOfOrigin = "New Orleans";


    var aussieGreeting = "g''Day";


    If it''s an alphabet letter or word, and it isn''t enclosed in quotes, and it
    isn''t a keyword that has special meaning for JavaScript, like alert, it''s a
    variable.


    If it''s some characters enclosed in quotes, it''s a *text string.*


    If you haven''t noticed, let me point out the spaces between the variable and
    the equal sign, and between the equal sign and the value.


    var nickname = "Bub";


    These spaces are a style choice rather than a legal requirement. But I''ll ask
    you to include them in your code throughout the practice exercises.


    In the last chapter you learned to write...


    alert("Thanks for your input!");


    When the code executes, a message box displays saying "Thanks for your input!"


    But what if you wrote these two statements instead:


    1 var thanx = "Thanks for your input!"


    2 alert(thanx);


    Instead of placing a text string inside the parentheses of the *alert* statement,
    the code above assigns the text string to a variable. Then it places the variable,
    not the string, inside the parentheses. Because JavaScript always substitutes
    the value for the variable, JavaScript displays—not the variable name thanx but
    the text to which it refers, "Thanks for your input!" That same alert, "Thanks
    for your input!" displays.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/2.html](http://www.ASmarterWayToLearn.com/javascript/2.html)


    # 3


    Variables for Numbers


    A string isn''t the only thing you can assign to a variable. You can also assign
    a number.


    var weight = 150;


    Having coded the statement above, whenever you write weight in your code, JavaScript
    knows you mean 150\. You can use this variable in math calculations.


    If you ask JavaScript to add 25 to weight...


    weight + 25


    ...JavaScript, remembering that weight refers to 150, will come up with the sum
    175.


    Unlike a string, a number is not enclosed in quotes. That''s how JavaScript knows
    it''s a number that it can do math on and not a text string, like a ZIP code,
    that it handles as text.


    But then, since it''s not enclosed in quotes, how does JavaScript know it''s not
    a variable? Well, because a number, or any combination of characters starting
    with a number, can''t be used as a variable name. If it''s a number, JavaScript
    rejects it as a variable. So it must be a number.


    If you enclose a number in quotation marks, it''s a string. JavaScript can''t
    do addition on it. It can do addition only on numbers not enclosed in quotes.


    Now look at this code.


    1 var originalNum = 23;


    2 var newNum = originalNum + 7;


    In the second statement in the code above, JavaScript substitutes the number 23
    when it encounters the variable originalNum. It adds 7 to 23\. And it assigns
    the result, 30, to the variable newNum.


    JavaScript can also handle an expression made up of nothing but variables. For
    example...


    1 var originalNum = 23;


    2 var numToBeAdded = 7;


    3 var newNum = originalNum + numToBeAdded;


    A variable can be used in calculating its own new value.


    1 var originalNum = 90;


    2 originalNum = originalNum + 10;


    If you enclose a number in quotation marks and add 7...


    1 var originalNum = "23";


    2 var newNum = originalNum + 7;


    ...it won''t work, because JavaScript can''t sum a string and a number. JavaScript
    interprets "23" as a word, not a number. In the second statement, it doesn''t
    add 23 + 7 to total 30\. It does something that might surprise you. I''ll tell
    you about this in a subsequent chapter. For now, know that a number enclosed by
    quotation marks is not a number, but a string, and JavaScript can''t do addition
    on it.


    Note that any particular variable name can be the name of a number variable or
    string variable. From JavaScript''s point of view, there''s nothing in a name
    that denotes one kind of variable or another. In fact, a variable can start out
    as one type of variable, then become another type of variable.


    Did you notice what''s new in...


    1 var originalNumber = 23;


    2 var newNumber = originalNumber + 7;


    The statement assigns to the variable newNumber *the result of a mathematical
    operation*. The result of this operation, of course, *is* a number value.


    The example mixes a variable and a literal number in a math expression. But you
    could also use nothing but numbers or nothing but variables. It''s all the same
    to JavaScript.


    I''ve told you that you can''t begin a variable name with a number. The statement...


    var 1stPresident = "Washington";


    ...is illegal, thanks to that initial "1" in the variable name.


    But you *can* include numbers in variable names, as long as none of them come
    first. The statement...


    var prezWhoCame1st = "Washington";


    ...is legal.


    Conveniently, if you specify a number instead of a string as an alert message...


    alert(144);


    ...or if you specify a variable that represents a number as an alert message...


    1 var caseQty = 144;


    2 alert(caseQty);


    ...JavaScript automatically converts it to a string and displays it.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/3.html](http://www.ASmarterWayToLearn.com/javascript/3.html)


    # 4


    Variable Names Legal and Illegal


    You''ve already learned three rules about naming a variable: You can''t enclose
    it in quotation marks. The name can''t be a number or start with a number. It
    can''t be any of JavaScript''s keywords—the special words that act as programming
    instructions, like alert and var.


    Here are the rest of the rules:


    *   A variable name can''t contain any spaces.


    *   A variable name can contain only letters, numbers, dollar signs, and underscores.


    *   Though a variable name can''t be any of JavaScript''s keywords, it can *contain*
    keywords. For example, userAlert and myVar are legal.


    *   Capital letters are fine, but be careful. Variable names are case sensitive.
    A rose is not a Rose. If you assign the string "Floribundas" to the variable rose,
    and then ask JavaScript for the value assigned to Rose, you''ll come up empty.'
