    ```javascript

    name = "Ace";

    ```


    在我编码新行之前，如果我让 JavaScript 打印 `name`，它会打印……


    `Mark`


    但那是过去。现在如果我让 JavaScript 打印 `name`，它会打印……


    `Ace`


    一个变量可以有任意数量的值，但一次只能有一个。


    你可能想知道，为什么在上面的语句中，将 `"Ace"` 赋给 `name` 时，关键字 `var` 不见了。这是因为该变量已经在之前将 `"Mark"` 赋给它的原始语句中声明过了。记住，`var`
    是创建变量的关键字——即声明变量的关键字。一旦变量被声明，你就不必再次声明它。你可以直接将新值赋给它。


    你可以在一个语句中声明一个变量，使其未定义。然后在后面的语句中给它赋值，而无需再次声明。


    ```javascript

    var nationality;

    ```


