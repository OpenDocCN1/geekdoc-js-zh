  trans: "\n\n## 全局作用域与局部作用域\n\n**注意：** 当你在函数中声明变量时，我称该变量具有局部作用域。所谓“在函数中声明它”，是指你使用关键字\
    \ `var` 显式地声明该变量——而不是随意地在函数中引入它而不加 `var`。（例外情况是，如果你将其命名为参数，那么它会隐式地声明为函数的局部变量。）如果你变得马虎，开始在函数体内使用一个新变量，却没有在函数中用关键字\
    \ `var` 显式声明它，那么它就是全局变量——即使你在主代码中任何地方都没有声明它。\n\n现在，为了说明一个要点，我将做一些你在实际代码中绝不会想做的事情。我将在主代码和函数中同时声明一个变量。\n\
    \n首先，在主代码中：\n```javascript\nvar theSum = 1000;\naddNumbers();\n```\n\n然后在函数中：\n\
    ```javascript\nfunction addNumbers() {\n  var theSum = 2 + 2;\n}\n```\n\n通过两次声明变量——一次在主代码中，一次在函数中——我创建了两个同名但不同的变量。一个\
    \ `theSum` 是全局的，另一个 `theSum` 是局部的。这不是你希望做的事情——它会让你陷入编码错误，并使你的代码几乎无法理解——但我这样做是为了展示全局作用域和局部作用域的区别。\n\
    \n通过在主代码中声明一次 `theSum`，再在函数中声明一次，我创建了（1）一个几乎在任何地方都可用的全局变量，以及（2）一个同名的、*仅*在函数内部可用的局部变量。为什么我说全局变量几乎在任何地方可用？因为它在函数内部无效。在函数内部，名称\
    \ `theSum` 代表一个局部变量，因此该名称无法引用全局变量。在这种情况下，程序员会说全局变量被局部变量*遮蔽*了。在函数内部，它不可见。在函数内部，只能看到同名的局部变量。\n\
    \n局部变量 `theSum` 在函数内部的值为 4，但函数外部的 `theSum` 值为 1000。\n\n现在，让我们继续深入这个仙境，爱丽丝。\n\n\
    首先，主代码中的一条语句：\n```javascript\nvar theSum = addNumbers();\n```\n\n然后是一个函数：\n```javascript\n\
    function addNumbers() {\n  var theSum = 2 + 2;\n  return theSum;\n}\n```\n\n同样，这不是你实际会编写的代码。我仅用这个例子来演示原理。在这段代码中，你仍然有两个不同的变量——一个全局变量和一个局部变量——它们共享同一个名称\
    \ `theSum`，但现在，得益于 `return` 语句，局部变量的值被赋给了全局变量。现在两个变量具有相同的名称和相同的值，但它们仍然是不同的变量。\n\
    \n这引出了你可能想问的一个问题：\n\n如果一个函数可以使用全局变量，为什么还必须通过参数传递值？为什么不直接声明一个全局变量，然后让函数使用它？嗯，你可以这样做，但要求函数与全局变量打交道，就是要求它们“偷听”主代码，就像人类偷听一样，这会引发混乱和意外后果的麻烦。程序员对此没有争议。始终通过参数显式地向函数传递值是最好的做法。全局变量在函数中没有立足之地。\n\
    \n同样的逻辑也适用于使用 `return` 语句的理由。你*可以*在函数内部更改全局变量的值。当你这样做时，它的值会在所有地方改变，包括主代码中。不需要\
    \ `return`。但更好的做法是在函数内部使用局部变量，然后通过 `return` 语句显式地将该值传递回去。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/38.html`](http://www.ASmarterWayToLearn.com/javascript/38.html)\n\
    \n## 39. `switch` 语句：如何开始\n\n考虑下面这一连串的条件语句。\n```javascript\nif (dayOfWk === \"\
    Sat\" || dayOfWk === \"Sun\") {\n  alert(\"Whoopee!\");\n} else if (dayOfWk ===\
    \ \"Fri\") {\n  alert(\"TGIF!\");\n} else {\n  alert(\"Shoot me now!\");\n}\n\
    ```\n\n如果是周末，则显示“Whoopee!”警告框。如果是星期五，则显示“TGIF”警告框。如果是工作日，则显示“Shoot me now”警告框。\n\
    \n它能工作，但笨重且有点丑陋，尤其是当你要测试许多条件时。现在是时候学习一种更优雅的替代方案了，你可以用它来测试无数条件，那就是 `switch` 语句。你需要测试的条件越多，你就会越喜欢\
    \ `switch` 语句。下面的 `switch` 语句复制了上面示例的功能：\n\n```javascript\nswitch(dayOfWk) {\n\
    \  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Sun\" :\n   \
    \ alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"TGIF!\");\n \
    \   break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\n现在，我希望你只关注上面代码的前三行。\n\
    \n1. 以关键字 `switch` 开头。紧挨着它的是被测试的变量，放在括号内。然后是一个左花括号。\n2. 第一种可能性，即变量 `dayOfWeek`\
    \ 的值为 `\"Sat\"`。以关键字 `case` 开头。然后是被尝试的值 `\"Sat\"`。接着是一个空格和一个冒号。\n3. 如果测试通过——即\
    \ `dayOfWeek` 确实等于 `\"Sat\"`——则执行的语句。该语句缩进。如果测试通过，可以执行任意数量的语句。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/39.html`](http://www.ASmarterWayToLearn.com/javascript/39.html)\n\
    \n## 40. `switch` 语句：如何完成\n\n在上一章中，你关注了下面这个 `switch` 语句的前三行。\n\n```javascript\n\
    switch(dayOfWk) {\n  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case\
    \ \"Sun\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"\
    TGIF!\");\n    break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\n\
    在本章中，你将处理剩下的代码。\n\n`if` 语句的第一行后面跟着一条（或多条）在条件为真时执行的语句。`switch` 语句的工作方式类似。在每个 `case`\
    \ 子句的下一行，有一条（或多条）在该 case 为真时执行的语句。\n\n再次强调，如果 case 为真，则执行的代码缩进 2 个空格。（普遍约定是缩进一定量。关于最佳缩进量，意见不一。我统一使用\
    \ 2 个空格的缩进，这很常见，但远非普遍。）\n\n但为什么除了最后一个 case 之外，所有 case 都包含一个 `break` 语句呢？\n\nJavaScript\
    \ 有一个不方便的怪癖：在找到真 case 后，JavaScript 不仅会执行该 case 下面的语句，还会执行*所有*下面 case 的*所有*语句。因此，在找到真\
    \ case 并执行条件代码后，你需要通过编写 `break` 语句跳出 `switch` 块。例如，如果你在上面的代码中省略了 `break` 语句，会发生以下情况：\n\
    \n1. 显示一个警告框，内容为“Whoopee!”\n2. 显示第二个警告框，内容为“Whoopee!”\n3. 显示第三个警告框，内容为“TGIF!”\n\
    4. 显示第四个警告框，内容为“Shoot me now.”\n\n现在让我们看第 11 行。\n```javascript\ndefault :\n  alert(\"\
    Shoot me now!\");\n}\n```\n\n关键字 `default` 的作用类似于 `if...else` 语句中的 `else`。它后面的代码在以上条件都不满足时执行。因此，在上面的示例中，如果\
    \ `dayOfWk` 不是 `\"Sat\"`、`\"Sun\"` 或 `\"Fri\"`——即它*是*这三个值以外的任何值——则显示一个警告框，内容为“Shoot\
    \ me now.”\n\n注意，`default` 后面跟一个空格和一个冒号，就像上面的 `case` 子句一样。\n\n还要注意，没有 `break`\
    \ 语句。这是因为 `default` 总是放在最后，这意味着它下面没有需要不当执行的语句。\n\n"
- fmt: "\nIn a switch statement, `default` code is optional, just as `else` code is\
    \ optional after an `if` statement. Without the `default` code, if none of the\
    \ cases test true, nothing happens.\n\nWhen there is no `default` code, careful\
    \ coders include a `break` statement after the last condition anyway as insurance,\
    \ even though it may be superfluous. If you decide to add a new condition to the\
    \ end later, you won't have to remember to add a break to the block above it in\
    \ order to avoid a disastrous cascade of statements.\n\nFind the interactive coding\
    \ exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/40.html](http://www.ASmarterWayToLearn.com/javascript/40.html)\n\
    \n# 41\n\n## `while` loops\n\nThis `for` loop displays an alert on each iteration.\n\
    \n```\nfor (var i = 0; i <= 3; i++) {\n  alert(i);\n}\n```\n\nAs you know, the\
    \ process is controlled by the three terms inside the parentheses:\n\n*   `var\
    \ i = 0` establishes a counter.\n*   `i <= 3` says the loop is to keep running\
    \ as long as `i` is less than or equal to 3. Since `i` is assigned 0 initially,\
    \ the loop will run 4 times.\n*   `i++` increments `i` on each iteration.\n\n\
    All the how-to-loop directions are packed into the space between the parentheses:\
    \ where to start the counter, how long to keep the loop going, and how to update\
    \ the counter each time through.\n\nA `while` loop does the same thing, but it's\
    \ organized differently. Only the middle term, how long to keep the loop going,\
    \ is inside the parentheses. The counter is defined *before* the first line of\
    \ the `while` block. The counter is updated *within* the code that executes when\
    \ the loop runs.\n\n```\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n\
    ```\n\nIn other ways, a `while` loop is organized along the same lines as a `for`\
    \ loop.\n\n*   Parentheses enclose the loop limiter.\n*   Curly brackets enclose\
    \ the code that executes.\n*   The code that executes is indented 2 spaces.\n\n\
    Since any `for` loop can be translated into a `while` loop and vice versa, you\
    \ can use whichever one you prefer.\n\nFind the interactive coding exercises for\
    \ this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/41.html](http://www.ASmarterWayToLearn.com/javascript/41.html)\n\
    \n# 42\n\n## `do...while` loops\n\nIn a `while` loop the order of instructions\
    \ is:\n\n1.  Declare a variable to serve as a counter, and assign a value to it.\n\
    2.  Start the loop, specifying how long the loop is to run.\n3.  Execute one or\
    \ more statements.\n4.  Within the loop, as a final statement, advance the counter.\n\
    \n```\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\nA `do...while`\
    \ loop accomplishes *almost* the same task as a `while` loop.\n\n```\nvar i =\
    \ 0;\ndo {\n  alert(i);\n  i++;\n} while (i <= 3);\n```\n\nThe differences between\
    \ the two types of loops:\n\n*   Instead of `while`, the keyword `do` leads off\
    \ the statement.\n*   The `while` clause, including the loop-limiting code inside\
    \ the parentheses, moves to the bottom—*after* the closing curly bracket.\n\n\
    Note that the `while` clause ends with a semicolon.\n\nFunctionally, the difference\
    \ between a `while` loop and a `do...while` loop is that it's possible to code\
    \ a `while` statement whose block of instructions never execute. Consider this\
    \ `while` loop.\n\n```\nvar i = 0;\nwhile (i < 0) {\n  alert(i);\n  i++;\n}\n\
    ```\n\nThe code says to keep running an alert as long as the counter is less than\
    \ 0. But since the counter is never less than 0, the code inside the curly brackets\
    \ never executes.\n\nCompare this with the `do...while` loop.\n\n```\nvar i =\
    \ 0;\ndo {\n  alert(i);\n  i++;\n} while (i < 0);\n```\n\nThe alert will display\
    \ once, even though the keep-going condition—`i` less than 0—never occurs. Since\
    \ a `do...while` loop executes the code inside the curly brackets *before* it\
    \ gets to the loop-limiter at the bottom, it always executes that code at least\
    \ once, no matter what the loop-limiter says.\n\nFind the interactive coding exercises\
    \ for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/42.html](http://www.ASmarterWayToLearn.com/javascript/42.html)\n\
    \n# 43\n\n## Placing scripts\n\nJavaScript code doesn't care where it lives. It\
    \ can be mixed in with—that is, embedded in—the HTML that creates a Web page.\
    \ Or, like an external CSS file, it can be placed in a separate file that is loaded\
    \ by the HTML file. In most cases, it's best to have an external JavaScript file,\
    \ for some of the same reasons it's best to have an external CSS file. But you\
    \ still need to know how to place JavaScript within your HTML file, so let's start\
    \ with that.\n\nAs you know, the order of HTML code is important, because it determines\
    \ the order of elements on the page. If you want the headline to appear above\
    \ the text, you put the headline above the text in the HTML. But JavaScript doesn't\
    \ work the same way. All of your JavaScript functions, for example, are loaded\
    \ into memory when the page loads. Wherever the code may be, the browser finds\
    \ it and stores it by the time the page is finished loading. Once the page is\
    \ loaded, all the JavaScript code stays in memory, ready to execute, for as long\
    \ as the page is displayed.\n\nYou can legally put JavaScript code almost anywhere\
    \ in the HTML file—in the head section, at the beginning of the body section,\
    \ somewhere in the middle of the body section, or at the end of the body section.\
    \ You *could*, if you wanted to be perverse, sprinkle different Javascript functions\
    \ all over your HTML file in different places. The browser would sort it all out.\n\
    \nGenerally, the best place for scripts, though, is at the end of the body section.\
    \ This guarantees that CSS styling and image display won't get held up while scripts\
    \ are loading.\n\nWhen you embed blocks of JavaScript in HTML (as opposed to having\
    \ a separate JavaScript file), you must enclose the JavaScript code between `<script>`\
    \ and `</script>` tags. Here are two functions enclosed between the tags.\n\n\
    ```\n<script>\nfunction sayHi() {\n  alert(\"Hello world!\");\n}\nfunction sayBye()\
    \ {\n  alert(\"Buh-bye!\");\n}\n</script>\n```\n\nYou can enclose any amount of\
    \ code—including any number of functions—between the `<script>` and `</script>`\
    \ tags. And, as I mentioned before, you can have different sections of code scattered\
    \ all over your HTML file if you want. But each section has to be enclosed between\
    \ the `<script>` and `</script>` tags.\n\nFor most purposes, coders prefer to\
    \ have all or most of their JavaScript code in a separate JavaScript file, then\
    \ have the browser load this external file at the same time it's loading the HTML\
    \ file.\n\nA JavaScript file is, like HTML and CSS files, a simple text file.\
    \ It doesn't have a header or any other special sections. It doesn't even have\
    \ `<script>` and `</script>` tags. It's just pure JavaScript code. The entire\
    \ contents of a JavaScript file that holds the two functions in the example above\
    \ would be:\n\n```\nfunction sayHi() {\n  alert(\"Hello world!\");\n}\nfunction\
    \ sayBye() {\n  alert(\"Buh-bye!\");\n}\n```\n\nWhat makes a JavaScript file a\
    \ JavaScript file is its file extension: `.js`. The front end of the file name\
    \ is up to you, as long as it's legal. Any of these would be fine.\n\n*   `scripts.js`\n\
    *   `coreJS.js`\n*   `main-code.js`\n*   `main_code.js`\n*   `main.code.js`\n\n\
    You include a JavaScript file in an HTML file the same way you include an external\
    \ CSS file—with an opening and closing tag.\n\n`<script src=\"whatever.js\"></script>`\n\
    \nFor the same reason that it's a good idea to put JavaScript code at the end\
    \ of the body section, it's a good idea to place the markup that includes JavaScript\
    \ files at the end of the body section.\n\nYou can include as many external JavaScript\
    \ files as you like.\n\nYou can include JavaScript files and also embed other\
    \ JavaScript code in the HTML.\n\nFind the interactive coding exercises for this\
    \ chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/43.html](http://www.ASmarterWayToLearn.com/javascript/43.html)\n\
    \n# 44.\n\n## Commenting\n"
