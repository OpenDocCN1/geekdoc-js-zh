    hard-wired into it. It''ll display any message that you pass to it from the calling
    code, via the argument.


    In order for a function to become a programmable robot rather than a one-job robot,
    you have to set it up to receive the data you''re passing. Here''s how you do
    it.


    1 function greetUser(greeting) {


    2   alert(greeting);


    3 }


    So now we''ve filled the parentheses of both the calling code and the function
    definition. The parentheses of the calling code contain an argument. In the example,
    the argument is the string "Hello, there." And, as you can see in the example
    above, the parentheses of the function definition now contain a variable, greeting.


    A variable inside the parentheses in a function statement is known as a *parameter*.
    The parameter name is up to you. You can give it any name that would be legal
    for a variable. Then you can use it to accomplish something in the body of the
    function. On line 2 in the example above, I used it to specify the message in
    an alert.


    You don''t have to declare a variable when it''s used as a parameter in a function
    definition. When it''s used as a parameter, the declaration is implicit.


    The argument in the statement that calls the function —"Hello, there."—is the
    data that''s passed to the function. The parameter inside the parentheses in the
    function definition *catches* the data that''s passed. It now holds "Hello, there."
    In other words, the string "Hello, there", specified in the function call, is
    assigned to greeting in the function. Then that variable, greeting, is used to
    specify the message in the alert statement.


    The value passed to a function is used in the body of the function to accomplish
    something. In this case, the value is used to specify the message in the alert.


    In the example, the argument is a string, but it could just as easily be a variable.
    In the following code, I declare the variable greeting and assign it the value
    "Hello, there." Then, rather than using the string itself as an argument in the
    function call, I use the variable.


    1 var greeting = "Hello, there."


    2 greetUser(greeting);


    In the example above, the name of the function greetUser, shares some of its name
    with the parameter greeting, but that''s just to make the code easy to understand.
    The name of the function and the name of the parameter don''t have to have anything
    in common. And remember, these names are up to you, as long as you follow the
    variable-naming rules.


