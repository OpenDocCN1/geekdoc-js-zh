  raw: 'And as long as we''re embracing new technology, why not use all the tech we
    can get our hands on to optimize the book? Old technology—i.e. the paper book—has
    severe limitations from an instructional point of view. New technology—i.e. the
    ebook—is the way to go, for many reasons. Here are a few:


    Color is a marvelous information tool. That''s why they use it for traffic lights.
    But printing color on paper multiplies the cost. Thanks to killer setup charges,
    printing this single word—color—in a print-on-demand book adds thirty dollars
    to the retail price. So color is usually out, or else the book is priced as a
    luxury item. With an ebook, color is free.


    Paper itself is expensive, so there usually isn''t room to do everything the author
    would like to do. A full discussion of fine points? Forget it. Extra help for
    the rough spots? Can''t afford it. Hundreds of examples? Better delete some. But
    no such limitation applies to an ebook. What do an extra hundred digital pages
    cost? Usually nothing.


    When a book is published traditionally, it may take up to a year for the manuscript
    to get into print. This means there isn''t time for extensive testing on the target
    audience, or for the revisions that testing would inevitably suggest. And once
    the book is in print, it''s a big, expensive deal to issue revised editions. Publishers
    put it off as long as possible. Reader feedback usually doesn''t lead to improvements
    for years. An ebook can go from manuscript to book in a day, leaving lots of time
    for testing and revision. After it''s published, new editions with improvements
    based on reader feedback can come out as often as the author likes, at no cost.


    With all this going for them, is there any doubt that all the best instructional
    books are going to be ebooks? And would anyone deny that the most helpful thing
    an author can do for you, in addition to publishing a good book electronically,
    is to take on the whole teaching job, not just part of it, by adding interactivity
    to help you with memorization, practice, and correction?


    Here, then, is how I propose to use current technology to help you learn JavaScript
    in half the time, with half the effort.


