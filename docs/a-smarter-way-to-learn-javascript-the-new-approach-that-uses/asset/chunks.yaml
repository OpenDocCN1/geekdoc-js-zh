    # 64


    DOM：


    计数元素


    在之前的一章中，你学习了如何创建一个类似数组的集合，其中包含所有共享特定标签名称的元素。例如，以下代码创建了一个包含所有 `<li>` 元素的集合，并将该集合赋值给变量
    `liElements`。


    ```

    var liElements = getElementsByTagName("li");

    ```


    一旦你有了元素集合，就可以找出其中有多少个元素。在下面的代码中，`liElements` 所代表的集合中 `<li>` 元素的数量被赋值给变量 `howManyLi`。


    ```

    var howManyLi = liElements.length;

    ```


    然后，例如，你可以遍历该集合，查找没有文本的 `<li>` 元素，并输入一些占位文本。


    ```

    1 for (var i = 0; i < howManyLi; i++) {

    2   if (liElements[i].innerHTML === "") {

    3     liElements[i].innerHTML = "coming soon";

    4   }

    5 }

    ```


    我带你走了一遍这个过程，是为了向你介绍一个类似的操作，你可以使用 DOM 层次结构而不是标签名称来执行。你可以创建一个目标节点的所有子节点的集合。


    ```

    1 var parentNode = document.getElementById("d1");

    2 var nodeList = parentNode.childNodes;

    ```


    第 1 行将 id 为 `"d1"` 的元素赋值给变量 `parentNode`。第 2 行将 `parentNode` 的子节点集合赋值给 `nodeList`。


    你可以获取集合中的项目数量。以下语句将节点集合中的项目数量赋值给变量 `howManyKids`。


    ```

    var howManyKids = nodeList.length;

    ```


    然后你可以定位集合中的任何项目。以下代码统计了 div 内的图片数量。


    ```

    1 var numberPics = 0;

    2 for (var i = 0; i < howManyKids; i++) {

    3   if (nodelist[i].nodeName.toLowerCase() === "img") {

    4     numberPics++;

    5   }

    6 }

    ```


