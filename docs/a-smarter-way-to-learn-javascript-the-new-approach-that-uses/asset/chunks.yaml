  trans: "\n现在，在我们简化后的表单标记中，有以下三个元素：\n\n1. 文本“Email”\n2. 用于输入用户电子邮件地址的文本字段\n3. 提交按钮\n\
    \n我将为电子邮件字段添加一个 `id`。\n\n```\n<form>\n  Email:\n  <input type=\"text\" id=\"email\"\
    >\n  <input type=\"submit\" value=\"Submit\">\n</form>\n```\n\n接下来，我将使用关键字 `onSubmit`\
    \ 添加一个事件处理程序。\n\n```\n<form onSubmit=\"checkAddress('email');\">\n  Email:\n \
    \ <input type=\"text\" id=\"email\">\n  <input type=\"submit\" value=\"Submit\"\
    >\n</form>\n```\n\n现在，当用户点击 `submit` 按钮时，函数 `checkAddress` 会执行。请注意，尽管操作是点击 `submit`\
    \ 按钮，但 `onSubmit` 事件处理程序位于 `form` 标签中，而不是 `submit` 按钮标签中。这是因为提交是一个适用于整个表单的事件，而不是\
    \ `submit` 按钮。\n\n有趣的地方来了。当表单提交时，函数 `checkAddress` 会检查用户是否在电子邮件字段中输入了内容。如果没有，该函数会显示一个提醒，告知用户需要填写电子邮件地址。\n\
    \n为了实现这一点，函数需要一种方法来读取电子邮件字段中的内容。这就是我添加到字段中的 `id` 发挥作用的地方。以下是函数的代码。\n\n```\n1 function\
    \ checkAddress(fieldId) {\n2   if (document.getElementById(fieldId).value ===\
    \ \"\") {\n3    alert(\"Email address required.\");\n4   }\n5 }\n```\n\n如果电子邮件字段中没有值，则会显示一个提醒，告知用户需要填写电子邮件地址。\n\
    \n这是你需要记住的顺序：\n\n1. 关键字 `document`，后跟...\n2. 一个点，后跟...\n3. 关键字 `getElementById`，后跟...\n\
    4. 参数（在括号中），从调用代码接收到的 `fieldId`，后跟...\n5. 另一个点，后跟...\n6. 关键字 `value`\n\n请注意，`getElementById`\
    \ 必须严格使用驼峰命名法。如果你按直觉写成 `getElementByID`，将大写字母“D”，那么它不会起作用。\n\n有些程序员更倾向于将字段中找到的值存入一个变量，如下所示。\n\
    \n```\n1 function checkAddress(fieldId) {\n2   var val = document.getElementById(fieldId).value;\n\
    3   if val === \"\") {\n4    alert(\"Email address required.\");\n5   }\n6 }\n\
    ```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/49.html`](http://www.ASmarterWayToLearn.com/javascript/49.html)\n\
    \n# 50\n\n设置字段值\n\n用户在表单字段中输入了她的邮政编码。你想省去她输入城市和州的麻烦。因此，当她点击离开该字段时，你为她自动填写城市字段。\n\
    \n让我来演示如何做到这一点。为了简化，我们假设美国只有三个邮政编码。我们还假设用户一定会输入其中一个代码。我们不会检查错误。在这个例子中，JavaScript\
    \ 代码只会填写城市字段，而不填写州。以下是表单的相关标记。（我省略了表单动作、`submit` 按钮以及本章不相关的其他所有内容。）\n\n```\n<form>\n\
    \  ZIP:<br>\n  <input type=\"text\" id=\"zip\" onBlur=\"fillCity();\"><br>\n \
    \ City:<br>\n  <input type=\"text\" id=\"city\">\n</form>\n```\n\n当用户点击离开邮政编码字段时，`onBlur`\
    \ 事件触发 `fillCity` 函数。代码如下。\n\n```\n1  function fillCity() {\n2    var cityName;\n\
    3    var zipEntered = document.getElementById(\"zip\").value;\n4    switch (zipEntered)\
    \ {\n5    case \"60608\" :\n6      cityName = \"Chicago\";\n7      break;\n8 \
    \   case \"68114\" :\n9      cityName = \"Omaha\";\n10     break;\n11   case \"\
    53212\" :\n12     cityName = \"Milwaukee\";\n13   }\n14   document.getElementById(\"\
    city\").value = cityName;\n15 }\n```\n\n这个例子表明，你不仅可以使用 `document.getElementById`...\
    \ 读取字段中的值，还可以“写入”一个值到字段中。\n\n在这个例子中，函数将邮政编码字段中找到的值赋给一个变量。然后，使用 `switch` 语句，将邮政编码与城市名称匹配，并将该名称赋给第二个变量。接着，使用该变量将城市名称放入城市字段。\n\
    \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/50.html`](http://www.ASmarterWayToLearn.com/javascript/50.html)\n\
    \n# 51\n\n读取和设置段落文本\n\n你的网页最初显示一张名为懒猴的小型哺乳动物的图片，并附带一句话：\n\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。点击了解更多。\n\
    \n当用户点击链接时，段落会展开：\n\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。它们有一个圆头、窄吻、大眼睛，以及多种因物种而异的独特颜色图案。懒猴的手和脚有几种适应性特征，使它们能够像钳子一样抓握，并能够长时间抓住树枝。懒猴具有毒性咬合，这在哺乳动物中是一种罕见的特征。\n\
    \n这是标记。\n\n```\n<p id=\"slowLoris\">\n懒猴是一组构成蜂猴属的几种链鼻灵长类动物。 <a href=\"javascript:void(0);\"\
    \ onClick=\"expandLoris();\"><em>点击了解更多。</em></a>\n</p>\n```\n\n段落被分配了一个 `id`，该\
    \ `id` 将被函数使用。当用户点击链接时，会调用一个名为 `expandLoris` 的函数。\n\n这是函数。\n\n```\n1 function\
    \ expandLoris() {\n2   var expandedParagraph = \"懒猴是一组构成蜂猴属的几种链鼻灵长类动物。它们有一个圆头、窄吻、大眼睛，以及多种因物种而异的独特颜色图案。懒猴的手和脚有几种适应性特征，使它们能够像钳子一样抓握，并能够长时间抓住树枝。懒猴具有毒性咬合，这在哺乳动物中是一种罕见的特征。\"\
    ;\n3   document.getElementById(\"slowLoris\").innerHTML = expandedParagraph;\n\
    4 }\n```\n\n第 2 行将长版本的文本赋给一个变量。然后，通过其 `id` 识别段落，第 3 行将原始内容（`innerHTML`）替换为存储在变量中的文本。\n\
    \n几乎任何内容，包括 HTML 标签，都可以通过这种方式插入到网页中。例如，你可以让这个列表出现在页面上的某个 `div` 中，该 `div` 的 `id`\
    \ 为“lorisList”。\n\n1. 懒猴\n2. 快猴\n3. 刚刚好的猴\n\n这是将列表标记加载到 `div` 中的函数，该 `div` 已被赋予\
    \ `id` 为“lorisList”。\n\n```\n1 function placeAList() {\n2   var listToPlace =\
    \ \"<ol><li>懒猴</li><li>快猴</li><li>刚刚好的猴</li></ol>\";\n3   document.getElementById(\"\
    lorisList\").innerHTML = listToPlace;\n4 }\n```\n\n第 2 行将列表的所有 HTML 赋给一个变量。第 3\
    \ 行将 HTML 放入已被分配 `id` 为“lorisList”的 `div` 中。\n\n你可以使用 `document.getElementById(elementId).innerHTML`\
    \ 来读取以及“写入”元素的内容。例如，以下函数将段落、`div` 或其他具有 `id` 为“content”的元素中的任何内容赋给变量 `whatsThere`。\n\
    \n```\n1 function peekAtContent() {\n2   var whatsThere = document.getElementById(\"\
    content\").innerHTML;\n3 }\n```\n\n第 2 行读取 `id` 为“content”的元素内的所有 HTML，并将其赋给变量\
    \ `whatsThere`。如果该元素是一个段落，其内容为 `<em>你好，水手！</em>`，那么变量 `whatsThere` 会捕获 `<em>你好，水手！</em>`。\n\
    \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/51.html`](http://www.ASmarterWayToLearn.com/javascript/51.html)\n\
    \n# 52\n\n操作图像和文本\n\n你的网页显示一张水滴鱼的图片。水滴鱼是一种迷人的动物，但它太丑了，以至于一些用户会发出“恶心”的感叹。因此，你给他们提供了让它消失的选项。当他们点击图片时，图片消失。\n\
    \n你首先给图片分配一个 `id`。\n\n"
- fmt: "\n<img src=\"Blobfish.jpg\" id=\"ugly\"...\n\nThen you add an event handler.\n\
    \n<img src=\"blobfish.jpg\" id=\"ugly\" onClick=\"makeInvisible();\">\n\nYou have\
    \ a CSS class for invisibility.\n\n`.hidden {display:none;}`\n\nThe function called\
    \ by the event handler gives the image a class of \"hidden,\" so it disappears.\n\
    \n```\nfunction makeInvisible() {\n  document.getElementById(\"ugly\").className\
    \ = \"hidden\";\n}\n```\n\nWhen the function is called, it assigns the \"hidden\"\
    \ class to the element with the id \"ugly.\" The image disappears.\n\nSome things\
    \ to keep in mind:\n\n*   This is just a variation on things you've already learned,\
    \ `document.getElementById(theElementId).value` (for form fields) and `document.getElementById(theElementId).innerHTML`\
    \ (for paragraphs, divs, and other HTML elements).\n\n*   It's `className`, in\
    \ camelCase, not class.\n\n*   Assigning a class to an element this way replaces\
    \ any classes that the element has been assigned in the static markup.\n\nIf you\
    \ want to add a class to an element, preserving its existing classes, you can\
    \ do it. For example, suppose you have a paragraph with a class that styles it\
    \ in Verdana, size 1 em. When the user mouses over it, you want to double its\
    \ size to 2 em. But you don't want to lose the Verdana styling of its original\
    \ class. Rather than replace the class that styles it in Verdana, you want to\
    \ retain that class and add the class that enlarges the font. Let's say the element\
    \ has the id \"p1\". This is the function.\n\n```\nfunction makeBig() {\n  document.getElementById(\"\
    p1\").className += \" big\";\n}\n```\n\nCompared with the code that replaces all\
    \ the existing classes with a new one, this code has two small differences.\n\n\
    *   It's `+=` instead of just `=`.\n\n*   A space before the class name is required.\n\
    \nFind the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/52.html](http://www.ASmarterWayToLearn.com/javascript/52.html)\n\
    \n# 53\n\nSwapping images\n\nIn Chapter 47 you learned how to replace one image\
    \ with another when the user mouses over the image. When the page first displays,\
    \ a \"before\" picture is what the user sees. When the user mouses over the picture,\
    \ it is replaced by an \"after\" picture.\n\nYou learned how to do this by coding\
    \ an inline event handler that looks like this.\n\n<img src=\"before-pic.jpg\"\
    \ onMouseover=\"src='after-pic.jpg'\">\n\nAnother way to do it is to call a function\
    \ that makes the swap. This is the markup:\n\n<img src=\"before-pic.jpg\" id=\"\
    before\" onMouseover=\"swapPic();\">\n\nThis is the function code.\n\n```\nfunction\
    \ swapPic() {\n  document.getElementById(\"before\").src = \"after-pic.jpg\";\n\
    }\n```\n\nBut why not make the function a general-purpose routine that can swap\
    \ any image for any other image? In order for this to work, the markup has to\
    \ pass both the id and the name of the replacement image to the function as arguments.\n\
    \n<img src=\"before-pic.jpg\" id=\"before\" onMouseover=\"swapPic(id,'after-pic.jpg');\"\
    >\n\nThe function accepts these arguments as its parameters and uses them to swap\
    \ the images.\n\n```\nfunction swapPic(eId, newPic) {\n  document.getElementById(eId).src\
    \ = newPic;\n}\n```\n\nFind the interactive coding exercises for this chapter\
    \ at:\n\n[http://www.ASmarterWayToLearn.com/js/53.html](http://www.ASmarterWayToLearn.com/javascript/53.html)\n\
    \n# 54\n\nSwapping images and setting classes\n\nYou've been learning how to read\
    \ the properties of HTML elements, and also how to change those properties using\
    \ various statements that incorporate the magic words `document.getElementById`...\
    \ For example, the following function removes the original image, with the id\
    \ of \"before,\" and replaces it with a second image, \"after-pic.jpg.\"\n\n```\n\
    function swapPic() {\n  document.getElementById(\"before\").src = \"after-pic.jpg\"\
    ;\n}\n```\n\nA more common way to code the function is to break it into two steps,\
    \ first assigning `document.getElementById(\"before\")` to a variable. Then you\
    \ combine that variable with `.src`. Let's call it the verbose approach.\n\n```\n\
    function swapPic() {\n  var pic = document.getElementById(\"before\");\n  pic.src\
    \ = \"after-pic.jpg\";\n}\n```\n\nHere's a function that uses the more verbose\
    \ approach to find out the address of a link that has the id \"link1\".\n\n```\n\
    function getAddress() {\n  var link = document.getElementById(\"link1\");\n  var\
    \ address = link.href;\n}\n```\n\nThe function probes the `href` property of the\
    \ link tag. For example, if `href` equals \"http://wikipedia.org\" that address\
    \ winds up in the variable `address`.\n\nThis function changes the formatting\
    \ of a form that has the id \"f12\" by changing its class.\n\n```\nfunction enlargeForm()\
    \ {\n  var frm = document.getElementById(\"link1);\n  frm.className = \"jumbo\"\
    ;\n}\n```\n\nFind the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/54.html](http://www.ASmarterWayToLearn.com/javascript/54.html)\n\
    \n# 55\n\nSetting styles\n\nIn Chapter 52 you learned how to add a css class to\
    \ any element to change its styling. For example, this function adds the class\
    \ \"big\" to an element. If, for example, the new class, \"big,\" specifies a\
    \ larger font size for the element than it has originally, the result is that\
    \ the text inside the element gets bigger.\n\n```\nfunction makeBig() {\n  document.getElementById(\"\
    p1\").className += \" big\";\n}\n```\n\nThere's another way to specify style properties.\n\
    \n```\nfunction makeBig() {\n  document.getElementById(\"p1\").style.fontSize\
    \ = \"2em\";\n}\n```\n\nLike the first example, the function changes the default\
    \ font size of an element with the id \"p1\". But, unlike the first example, it\
    \ doesn't remove any other styles assigned to the element, whether those styles\
    \ are specified in css or inline.\n\nExample: If the heading, paragraph, or div\
    \ has an initial size of 1em, the function doubles the size of its contents. If\
    \ the element has an initial style of bold Georgia italic with 12-pixel borders,\
    \ all of this formatting is preserved. Only the size changes.\n\nThis statement\
    \ left-floats an image.\n\n`document.getElementById(\"pic99\").style.cssFloat\
    \ = \"left\";`\n\nThis statement makes an element invisible.\n\n`document.getElementById(\"\
    div9\").style.visibility = \"hidden\";`\n\nThis statement gives an element left\
    \ and right margins of 10 pix.\n\n`document.getElementById(\"mainPic\").style.margin\
    \ = \"0 10px 0 10px;\";`\n\nYou can set many style properties this way. Sometimes\
    \ the terms for property specs aren't obvious, so it's best to check the language\
    \ rules—is it `float` or `cssFloat`?—rather than guessing.\n\nAs usual, you can\
    \ read properties as well as set them. However, the rules aren't straightforward.\
    \ If you write...\n\n`var m = document.getElementById(\"mainPic\").style.margin;`\n\
    \n...it'll tell you only the margins specified inline, if any. If margins are\
    \ specified in css, you won't get them. The following statement gives you all\
    \ the style properties, specified in both css and inline, but it has a limitation.\
    \ Versions of Internet Explorer before Version 9 don't support it.\n\n`var m =\
    \ document.getComputedStyle(\"mainPic\").margin;`\n\nFind the interactive coding\
    \ exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/55.html](http://www.ASmarterWayToLearn.com/javascript/55.html)\n\
    \n# 56\n\nTarget all elements by tag name\n\nSuppose you want to give your users\
    \ the option of doubling the size of the text in all the paragraphs of the document.\
    \ To accomplish this, you could give each paragraph an id. When the user clicks\
    \ the Double Text Size button, a function would cycle through all the paragraph\
    \ ids and make the change. The function could upsize the font either by assigning\
    \ a new class to each paragraph, with the class specifying a larger font size,\
    \ or it could assign the new style property directly, like this:\n\n`getElementById(the\
    \ id).style.fontSize = \"2em\";`\n\nAn easier way to accomplish the same thing\
    \ is to have the function say, \"Find all the paragraphs in the document and increase\
    \ their size.\"\n\nThis statement finds all the paragraphs and assigns them to\
    \ a variable:\n\n`var par = document.getElementsByTagName(\"p\");`\n"
