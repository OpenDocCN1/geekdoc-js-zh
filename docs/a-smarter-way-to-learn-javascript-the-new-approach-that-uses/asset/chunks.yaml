    # 46


    Events: button


    In the last chapter you learned how to repurpose a link to make it trigger an
    event when it''s clicked, instead of loading a new page. You learned to do it
    with *inline* event-handling, not the best way, but the easiest to learn. Later
    in the book, you''ll learn the approach that''s preferred by most professionals—the
    *scripting* approach.


    But even if you''re using the inline method, when you want to give the user something
    to click, a more professional approach, usually, is to use a button rather than
    a link.


    Suppose that when the user clicks a button, an alert displays saying, "Hello world!"


    Here''s the code.


    ```

    <input type="button" value="Click" onClick="alert(''Hello world!'');">

    ```


    The event handler is the same, whether you''re coding a link or a button: `onClick="alert(''Hello
    world!'');"`


    But the beginning of the code is different: `<input type="button" value="Click"`


    Some pros would argue that the button code should be enclosed in *form* tags,
    but it''s not absolutely necessary. And anyway, since we''re already violating
    best practices by using inline event handlers, why not scandalize the pros with
    multiple violations? (You''ll learn more respectable alternatives to inline event
    handlers later in the book.)


    As an HTML coder you know that you can use an image as a hot link. The markup
    would look something like this.


    ```

    <a href="summary-page.html"><img src="button-sum-pg.png"></a>

    ```


    You can also use an image to trigger an event. Let''s say that when the user clicks
    an image, an alert pops up. This is the code. Note that the code for the inline
    event handler is the same as before.


    ```

    <img src="button-greet.png" onClick="alert(''Hello world!'');">

    ```


    Or, if you want to be more professional about it, you could have the event trigger
    a function.


    ```

    <img src="button-greet.png" onClick="greetTheUser();">

    ```


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/46.html](http://www.ASmarterWayToLearn.com/javascript/46.html)


    # 47


    Events: mouse


    You''ve learned how to make things happen when the user clicks a link, a button,
    or an image, by using *inline* event-handling. Inline event handling isn''t the
    best approach, but the easiest to learn. Later in the book, you''ll learn the
    approach that''s preferred by most professionals—the *scripting* approach.


    But whether you''re using the inline method or the preferred scripting method,
    the `onClick` event is only one of many kinds of events that your code can respond
    to. In this chapter, you''ll learn how to make things happen when the user mouses
    over something on the page, and also when the user mouses away from it.


    Suppose your page initially displays a "before" picture of a model. When the user
    mouses over the picture, it is replaced by an "after" picture. You might prefer
    to do this with CSS, but since this is a JavaScript book, I''ll show you how to
    do it with an event handler.


    This is the markup that replaces the *before* picture with the *after* picture.


    ```

    <img src="before-pic.jpg" onMouseover="src=''after-pic.jpg''">

    ```


    It begins as a plain vanilla image tag: `<img src="before-pic.jpg"`


    Then comes the event-handling keyword. The keyword is in camelCase—optional but
    widely used: `onMouseover`


    An equal sign follows the keyword `onMouseover`, just as it does with `onClick`.
    Then comes the response to the event, which is in quotes: `"src=''after-pic.jpg''"`


    You may be surprised that the response to the event isn''t written in JavaScript.
    It''s HTML markup.


    Note: The image source must be enclosed in single quotes, because of those double
    quotes that enclose the whole phrase.


    You can use `onMouseover` event handling with other HTML elements, too. Here''s
    a bit of inline code that displays an alert when a heading is moused over.


    ```

    <h1 onMouseover="alert(''Be sure to get your shopping done today.'');">World Ends
    Tomorrow</h1>

    ```


    When the user mouses over the head, an alert displays.


    In the example above, you might prefer to call a function that displays the alert
    rather than code the alert inline.


    Here''s a JavaScript alternative to the preferred CSS color-change on hover.


    ```

    <a href="index.html" onMouseover="this.style.color=''green'';">Home Page</a>

    ```


    When the user mouses over the link, it turns green.


    At this point don''t be concerned about the overall idea behind `this.style.color`
    in the example. For now, just memorize the sequence so you can repeat it in the
    exercises.


    In the next example, the paragraph expands to include more information when the
    user hovers over it.


    ```

    <p id="loris" onMouseover="expand();">Slow Loris: Mouse over for more info</p>

    ```


    At this point don''t worry now about how the function `expand` grows the paragraph.
    You''ll learn about that later.


    In the example we started with, the model''s before-and-after pictures, the `onMouseover`
    event handler replaces the "before" picture with the "after" picture when the
    user mouses over the image. Normally, you''d want the image to revert to the original
    when the user mouses away from the picture. So you''d combine the `onMouseover`
    event handler with the `onMouseout` event handler.


    ```

    <img src="before-pic.jpg" onMouseover="src=''after-pic.jpg''"

    onMouseout="src=''before-pic.jpg''">

    ```


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/47.html](http://www.ASmarterWayToLearn.com/javascript/47.html)


    # 48


    Events: fields


    Let''s say you have a text field for the user''s email address. When the user
    clicks in the field to type her entry, the field turns yellow.


    This is the markup that makes it happen.


    ```

    Email:<br>

    <input type="text" size="30" onFocus="this.style.backgroundColor=''yellow'';">

    ```


    Once again, I''m showing you the not-recommended *inline* way to handle an event,
    using it as a stepping stone for learning more professional event-handling later
    in the book. Again, I''m not explaining `this.style.backgroundColor`. Just memorize
    the sequence to use in the exercises.


    The keyword here is `onFocus`. It tells JavaScript to do something when the user
    clicks in the field.


    The syntax is the same as for other event handlers that you''ve already learned
    to code: a keyword, followed by an equal sign, followed by JavaScript or HTML
    in quotes.


    After the user enters her email address—or not—and clicks outside the field or
    presses the tab key to move to another field—that is, when this field no longer
    has the focus—you want it to revert to a white background. You do this with the
    `onBlur` keyword, which is the opposite of `onFocus`.


    This markup handles both the `onFocus` and the `onBlur` events.


    ```

    Email:<br>

    <input type="text" size="30" onFocus="this.style.backgroundColor=''yellow'';"
    onBlur="this.style.backgroundColor=''white'';">

    ```


    When the user clicks into the field, it turns yellow. When she clicks out of the
    field, it reverts to white.


    A slightly more professional approach would be to call functions that accomplish
    the same things.


    ```

    Email:<br>

    <input type="text" size="30" onFocus="makeFieldYellow();" onBlur="makeFieldWhite();">

    ```


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/48.html](http://www.ASmarterWayToLearn.com/javascript/48.html)


    # 49


    Reading field values


    Suppose you''ve included an email field in a form, and you''ve made it a required
    field. The form has a **submit** button that the user clicks to submit the information
    that he''s entered in the form.


    This is the markup that creates the form. I''ve simplified it, omitting any form
    action and other attributes, including linebreaks, that don''t bear on what you''re
    learning here.


    ```

    <form>

      Email:

      <input type="text">

      <input type="submit" value="Submit">

    </form>

    ```

