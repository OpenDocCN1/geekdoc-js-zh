    Assume that the array pets has already been declared. This is how you assign values
    to it.


    1 pets[0] = "dog";


    2 pets[1] = "cat";


    3 pets[2] = "bird";


    In the example above, I defined the first three elements of the array, in order.
    But you can legally leave gaps in an array if you choose to (not that you normally
    would). For example, suppose you start with the same empty array and code these
    lines.


    1 pets[3] = "lizard";


    2 pets[6] = "snake";


    Now, if you refer to pets[3], you''ll get "lizard". If you refer to pets[6], you''ll
    get "snake". But if you refer to pets[0] through pets[2] or pets[4] or pets[5],
    you''ll get undefined.


    You can assign additional values to an array that already has values. Assume that
    the first three elements of the array pets are "dog", "cat", and "bird". Then
    you write this code.


    1 pets[3] = "lizard";


    2 pets[4] = "fish";


    3 pets[5] = "gerbil";


    4 pets[6] = "snake";


    Now the array has 7 elements: "dog", "cat", "bird", "lizard", "fish", "gerbil",
    and "snake".


    If you assign a new value to an array element that already has one, the old value
    is replaced by the new one.


    Using the keyword, pop, you can remove the last element of an array.


    Suppose you have an array, pets, whose elements are "dog", "cat", and "bird".
    The following code deletes the last element, "bird", leaving a two-element array.


    pets.pop();


    Using the keyword, push, you can add one or more elements to the end of an array.


    Suppose you have that same array consisting of "dog", "cat", and "bird". The following
    code adds two new elements to the end of the array.


    pets.push("fish", "ferret");


