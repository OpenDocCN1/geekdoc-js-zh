  trans: "\n\n<img src=\"Blobfish.jpg\" id=\"ugly\"...\n\n然后你添加一个事件处理程序。\n\n<img src=\"\
    blobfish.jpg\" id=\"ugly\" onClick=\"makeInvisible();\">\n\n你有一个用于隐藏的 CSS 类。\n\
    \n`.hidden {display:none;}`\n\n事件处理程序调用的函数为图像添加了 \"hidden\" 类，因此它消失了。\n\n```\n\
    function makeInvisible() {\n  document.getElementById(\"ugly\").className = \"\
    hidden\";\n}\n```\n\n当函数被调用时，它将 \"hidden\" 类分配给 id 为 \"ugly\" 的元素。图像消失。\n\n需要记住的一些事项：\n\
    \n*   这只是你已经学过的内容的变体：`document.getElementById(theElementId).value`（用于表单字段）和 `document.getElementById(theElementId).innerHTML`（用于段落、div\
    \ 和其他 HTML 元素）。\n\n*   它是 `className`，采用驼峰命名法，而不是 class。\n\n*   以这种方式为元素分配类会替换元素在静态标记中已分配的所有类。\n\
    \n如果你想为一个元素添加一个类，同时保留其现有的类，也是可以做到的。例如，假设你有一个段落，其类将其样式设置为 Verdana，大小为 1 em。当用户将鼠标悬停在其上时，你想将其大小加倍到\
    \ 2 em。但你不想丢失其原始类的 Verdana 样式。你希望保留那个设置 Verdana 样式的类，并添加放大字体的类，而不是替换它。假设该元素的 id\
    \ 为 \"p1\"。这是函数。\n\n```\nfunction makeBig() {\n  document.getElementById(\"p1\"\
    ).className += \" big\";\n}\n```\n\n与用新类替换所有现有类的代码相比，这段代码有两个小差异。\n\n*   它使用的是\
    \ `+=` 而不是 `=`。\n\n*   类名前面需要一个空格。\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/52.html`](http://www.ASmarterWayToLearn.com/javascript/52.html)\n\
    \n# 53\n\n交换图像\n\n在第 47 章中，你学习了当用户将鼠标悬停在图像上时如何用另一张图像替换它。当页面首次显示时，用户看到的是“之前”的图片。当用户将鼠标悬停在图片上时，它会被替换为“之后”的图片。\n\
    \n你学习了如何通过编写如下所示的内联事件处理程序来实现这一点。\n\n<img src=\"before-pic.jpg\" onMouseover=\"\
    src='after-pic.jpg'\">\n\n另一种方法是调用一个执行交换的函数。这是标记：\n\n<img src=\"before-pic.jpg\"\
    \ id=\"before\" onMouseover=\"swapPic();\">\n\n这是函数代码。\n\n```\nfunction swapPic()\
    \ {\n  document.getElementById(\"before\").src = \"after-pic.jpg\";\n}\n```\n\n\
    但为什么不把这个函数做成一个通用例程，可以交换任意图像为任意其他图像呢？为了实现这一点，标记必须将 id 和替换图像的名称作为参数传递给函数。\n\n<img\
    \ src=\"before-pic.jpg\" id=\"before\" onMouseover=\"swapPic(id,'after-pic.jpg');\"\
    >\n\n函数将这些参数作为其参数接收，并使用它们来交换图像。\n\n```\nfunction swapPic(eId, newPic) {\n  document.getElementById(eId).src\
    \ = newPic;\n}\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/53.html`](http://www.ASmarterWayToLearn.com/javascript/53.html)\n\
    \n# 54\n\n交换图像和设置类\n\n你一直在学习如何读取 HTML 元素的属性，以及如何使用包含神奇词语 `document.getElementById`\
    \ 的各种语句来更改这些属性。例如，以下函数移除 id 为 \"before\" 的原始图像，并将其替换为第二张图像 \"after-pic.jpg\"。\n\
    \n```\nfunction swapPic() {\n  document.getElementById(\"before\").src = \"after-pic.jpg\"\
    ;\n}\n```\n\n一种更常见的编写函数的方式是将其分解为两个步骤，首先将 `document.getElementById(\"before\")`\
    \ 赋值给一个变量。然后将该变量与 `.src` 结合。我们称之为详细方法。\n\n```\nfunction swapPic() {\n  var pic\
    \ = document.getElementById(\"before\");\n  pic.src = \"after-pic.jpg\";\n}\n\
    ```\n\n这是一个使用更详细的方法来查找 id 为 \"link1\" 的链接地址的函数。\n\n```\nfunction getAddress()\
    \ {\n  var link = document.getElementById(\"link1\");\n  var address = link.href;\n\
    }\n```\n\n该函数探测链接标签的 `href` 属性。例如，如果 `href` 等于 \"http://wikipedia.org\"，那么该地址就会存入变量\
    \ `address` 中。\n\n这个函数通过更改其类来改变 id 为 \"f12\" 的表单的格式。\n\n```\nfunction enlargeForm()\
    \ {\n  var frm = document.getElementById(\"link1);\n  frm.className = \"jumbo\"\
    ;\n}\n```\n\n本章的交互式编码练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/54.html`](http://www.ASmarterWayToLearn.com/javascript/54.html)\n\
    \n# 55\n\n设置样式\n\n在第 52 章中，你学习了如何向任何元素添加 CSS 类来更改其样式。例如，这个函数向一个元素添加了 \"big\" 类。如果新类\
    \ \"big\" 为该元素指定了比原来更大的字体大小，那么元素内的文本就会变大。\n\n```\nfunction makeBig() {\n  document.getElementById(\"\
    p1\").className += \" big\";\n}\n```\n\n还有另一种指定样式属性的方法。\n\n```\nfunction makeBig()\
    \ {\n  document.getElementById(\"p1\").style.fontSize = \"2em\";\n}\n```\n\n与第一个示例类似，该函数更改了\
    \ id 为 \"p1\" 的元素的默认字体大小。但与第一个示例不同的是，它不会移除分配给该元素的任何其他样式，无论这些样式是在 CSS 中指定的还是内联的。\n\
    \n示例：如果标题、段落或 div 的初始大小为 1em，则该函数会将其内容的大小加倍。如果元素具有粗体、Georgia 斜体、12 像素边框的初始样式，则所有这些格式都会保留。只有大小发生变化。\n\
    \n此语句将图像左浮动。\n\n`document.getElementById(\"pic99\").style.cssFloat = \"left\"\
    ;`\n\n此语句使元素不可见。\n\n`document.getElementById(\"div9\").style.visibility = \"hidden\"\
    ;`\n\n此语句为元素设置左右边距为 10 像素。\n\n`document.getElementById(\"mainPic\").style.margin\
    \ = \"0 10px 0 10px;\";`\n\n你可以用这种方式设置许多样式属性。有时属性规范的术语并不明显，因此最好检查语言规则——是 `float`\
    \ 还是 `cssFloat`？——而不是猜测。\n\n和往常一样，你既可以读取属性，也可以设置它们。然而，规则并不简单。如果你写...\n\n`var m\
    \ = document.getElementById(\"mainPic\").style.margin;`\n\n...它只会告诉你内联指定的边距（如果有的话）。如果边距是在\
    \ CSS 中指定的，你将无法获取它们。以下语句会为你提供所有样式属性，包括 CSS 和内联指定的，但它有一个限制。Internet Explorer 9\
    \ 之前的版本不支持它。\n\n`var m = document.getComputedStyle(\"mainPic\").margin;`\n\n本章的交互式编码练习请访问：\n\
    \n[`www.ASmarterWayToLearn.com/js/55.html`](http://www.ASmarterWayToLearn.com/javascript/55.html)\n\
    \n# 56\n\n按标签名定位所有元素\n\n假设你想让用户选择将文档中所有段落的文本大小加倍。为了实现这一点，你可以为每个段落指定一个 id。当用户单击“加倍文本大小”按钮时，一个函数会遍历所有段落\
    \ id 并进行更改。该函数可以通过为每个段落分配一个新类（该类指定更大的字体大小）来增大字体，也可以直接分配新的样式属性，如下所示：\n\n`getElementById(the\
    \ id).style.fontSize = \"2em\";`\n\n实现相同目的的更简单方法是让函数说：“找到文档中的所有段落并增大它们的大小。”\n\n\
    此语句找到所有段落并将它们赋值给一个变量：\n\n`var par = document.getElementsByTagName(\"p\");`\n\n"
- fmt: "\nThe variable `par` now holds an array-like collection of all the paragraphs\
    \ in the document. Suppose, to keep things simple, that the body of the document\
    \ comprises just three paragraphs.\n\n```\n<p>This bed is too small.</p>\n<p>This\
    \ bed is too big.</p>\n<p>This bed is just right.</p>\n```\n\n`par[0]` is the\
    \ first paragraph. `par[1]` is the second paragraph. `par[2]` is the third paragraph.\
    \ `par.length` is 3, the number of items in the collection.\n\nIf you write...\n\
    \n```\nvar textInMiddleParagraph = par[1].innerHTML;\n```\n\n...the variable `textInMiddleParagraph`\
    \ is assigned `\"This bed is too big.\"`\n\nIf you write...\n\n```\npar[1].innerHTML\
    \ = \"This SUV is too big.\";\n```\n\n...the paragraph text changes to `\"This\
    \ SUV is too big.\"`\n\nHere's a loop that assigns a font family to all the paragraphs.\n\
    \n```\nfor (var i = 0; i < par.length; i++) {\n  par[i].style.fontFamily = \"\
    Verdana, Geneva, sans-serif\";\n}\n```\n\nThis statement makes a collection of\
    \ all the images in the document and assigns it to the variable `pics`.\n\n```\n\
    var pics = document.getElementsByTagName(\"img\");\n```\n\nThis statement makes\
    \ a collection of all the divs in the document and assigns it to the variable\
    \ `divs`.\n\n```\nvar divs = document.getElementsByTagName(\"div\");\n```\n\n\
    This statement makes a collection of all the unordered lists in the document and\
    \ assigns it to the variable `ulists`.\n\n```\nvar ulists = document.getElementsByTagName(\"\
    ul\");\n```\n\nFind the interactive coding exercises for this chapter at:\n\n\
    [http://www.ASmarterWayToLearn.com/js/56.html](http://www.ASmarterWayToLearn.com/javascript/56.html)\n\
    \n# 57\n\nTarget some elements by tag name\n\nIn the last chapter you learned\
    \ how to make an array-like collection of all the elements in a document that\
    \ have a particular tag name. For example, this statement makes a collection of\
    \ all the paragraphs in the document and assigns the collection to the variable\
    \ `pars`.\n\n```\nvar pars = document.getElementsByTagName(\"p\");\n```\n\nYou\
    \ also learned to read or set the properties of any of the elements in a collection\
    \ of elements by using array-like notation—a number in square brackets. For example,\
    \ this statement \"reads\" the contents of the second element in the collection\
    \ `pars` and assigns the string to the variable `textInMiddleParagraph`.\n\n```\n\
    var textInMiddleParagraph = pars[1].innerHTML;\n```\n\nBut suppose you don't want\
    \ a collection of all the paragraphs in the document. Suppose you want just a\
    \ collection of all the paragraphs within a particular `div`. No problem. Let's\
    \ say the `id` of the `div` is `\"rules\"`. Here's the code.\n\n```\nvar e = document.getElementById(\"\
    rules\");\nvar paragraphs = e.getElementsByTagName(\"p\");\n```\n\nLine 1 assigns\
    \ the `div` with the `id` `\"rules\"` to the variable `e`.\n\nLine 2 makes a collection\
    \ of all the paragraphs in the `div` and assigns the collection to the variable\
    \ `paragraphs`.\n\nOnce the `id` of the target `div` has been assigned to a variable,\
    \ for example `e`, you can assemble a collection of all the paragraphs within\
    \ that `div`. Instead of writing...\n\n```\ndocument.getElementsByTagName(\"p\"\
    );\n```\n\n...which would make a collection of all the paragraphs in the document,\
    \ you write...\n\n```\ne.getElementsByTagName(\"p\");\n```\n\n...which makes a\
    \ collection of all the paragraphs in the `div`.\n\nSuppose you have a table with\
    \ a white background. When the user clicks a button, the cells turn pink. Here's\
    \ the code.\n\n```\nvar t = document.getElementById(\"table9\");\nvar cells =\
    \ t.getElementsByTagName(\"td\");\nfor (var i = 0; i < cells.length; i++) {\n\
    \  cells[i].style.backgroundColor = \"pink\";\n}\n```\n\nHere's the line-by-line\
    \ breakdown.\n\n1. Targets the table by its `id`\n2. Assembles a collection of\
    \ all the elements in the table with a `td` tag\n3-5. Loops through all of them\
    \ to change their background color\n\nFind the interactive coding exercises for\
    \ this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/57.html](http://www.ASmarterWayToLearn.com/javascript/57.html)\n\
    \n# 58\n\nThe DOM\n\nIn previous chapters you learned two different ways to target\
    \ components of your web page so you could read or set them. You learned to `getElementById`,\
    \ and you learned to `getElementsByTagName`. These are often the best methods\
    \ for targeting things, but they have limitations. The first, `getElementById`,\
    \ gives you access only to those components that have been assigned an `id`. The\
    \ second, `getElementsByTagName`, is good for wholesale changes, but is a bit\
    \ cumbersome for fine surgical work. Both approaches can change things on your\
    \ web page, but neither is able to deal with *all* the things on the page, to\
    \ create new things, to move existing things, or to delete them.\n\nFortunately,\
    \ both of these approaches are only two of many methods for working with the `Document\
    \ Object Model`, the `DOM`. The `DOM` is an organization chart, created automatically\
    \ by the browser when your web page loads, for the whole web page. All the things\
    \ on your web page—the tags, the text blocks, the images, the links, the tables,\
    \ the style attributes, and more—have spots on this organization chart. This means\
    \ that your JavaScript code can get its hands on anything on your web page, anything\
    \ at all, just by saying where that thing is on the chart. What's more, your JavaScript\
    \ can add things, move things, or delete things by manipulating the chart. If\
    \ you wanted to (you wouldn't), you could almost create an entire web page from\
    \ scratch using JavaScript's `DOM` methods.\n\nHere's a simplified web page. I've\
    \ indented the different levels in the hierarchy. The three top levels of the\
    \ `DOM` are always the same for a standard web page. The `document` is the first\
    \ level. Under the `document` is the second level, the `html`. And under the `html`\
    \ are the co-equal third levels, the `head` and the `body`. Under each of these\
    \ are more levels.\n\n```\n1st level: document\n2nd level:   <html>\n3rd level:\
    \     <head>\n4th level:       <title>\n5th level:         Simple document\n \
    \                </title>\n               </head>\n3rd level      <body>\n4th\
    \ level        <p>\n5th level          There's not much to this.\n           \
    \      </p>\n               </body>\n             </html>\n```\n\nHere's the same\
    \ thing, shown as an organization chart. Note that this is an idealized chart,\
    \ cleaned of junk artifacts that most browsers insert in the `DOM`. I'll show\
    \ you how to clean out these artifacts in later chapters.\n\n![](images/00009.jpeg)\n\
    \nAs you can see, every single thing on the web page is included, even the title\
    \ text and the paragraph text. Let's make it a little more complicated by adding\
    \ a `div` and a second paragraph. Here it is in HTML form.\n\n```\n1st level:\
    \ document\n2nd level:   <html>\n3rd level:     <head>\n4th level:       <title>\n\
    5th level:         Simple document\n                 </title>\n              \
    \ </head>\n3rd level      <body>\n4th level        <div>\n5th level          <p>\n\
    6th level            There's not much to this.\n                   </p>\n5th level\
    \          <p>\n6th level            Nor to this.\n                   </p>\n \
    \                </div>\n               </body>\n             </html>\n```\n\n\
    And in organization chart (minus any junk artifacts)...\n\n![](images/00010.jpeg)\n\
    \nIn a company organization chart, each box represents a person. In the `DOM`\
    \ organization chart, each box represents a **node**. The HTML page represented\
    \ above, in its cleaned-up `DOM` form, has 11 nodes: the `document` node, the\
    \ `html` node, the `head` and `body` nodes, the `title` node, the `div` node,\
    \ two paragraph nodes, and three text nodes, one for the title and one for each\
    \ of the two paragraphs.\n\nIn this particular chart, there are three types of\
    \ nodes: `document`, `element`, and `text`. The `document` node is the top level.\
    \ Element nodes are `<html>`, `<head>`, `<body>`, `<title>`, `<div>`, and `<p>`.\
    \ Text nodes are the strings that comprise the title and the two paragraphs.\n\
    \nFind the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/58.html](http://www.ASmarterWayToLearn.com/javascript/58.html)\n\
    \n# 59\n\nThe DOM: Parents and children\n"
