  trans: "\n\n# 函数：向函数传递数据\n\n函数的一个非常实用的特性是，调用代码中的括号不必为空。如果你在括号内放入一些数据，就可以将这些数据传递给函数，供其执行时使用。\n\
    \n假设，与其写 `greetUser();`，不如写...\n\n`greetUser(\"Hello, there.\");`\n\n现在，你不仅调用了函数，还向它传递了数据。括号内的字符串，即你传递的数据，被称为`实参`。\n\
    \n函数现在更加灵活了，因为它显示的消息不再被硬编码在函数内部。它会显示你通过实参从调用代码传递过来的任何消息。\n\n为了让函数成为一个可编程的机器人，而不是一个只能做单一工作的机器人，你需要设置它来接收你传递的数据。具体做法如下。\n\
    \n```javascript\nfunction greetUser(greeting) {\n  alert(greeting);\n}\n```\n\n\
    现在，我们填充了调用代码和函数定义的括号。调用代码的括号中包含一个实参。在示例中，实参是字符串 `\"Hello, there.\"`。而且，如上例所示，函数定义的括号中现在包含一个变量\
    \ `greeting`。\n\n函数语句括号内的变量被称为`形参`。形参的名称由你决定。你可以给它取任何合法的变量名。然后你可以在函数体内用它来完成某些操作。在上面的例子中，我用它来指定\
    \ `alert` 中的消息。\n\n当变量在函数定义中用作形参时，你不需要声明它。当它用作形参时，声明是隐式的。\n\n调用函数的语句中的实参——`\"\
    Hello, there.\"`——是传递给函数的数据。函数定义括号内的形参捕获传递过来的数据。现在它持有 `\"Hello, there.\"`。换句话说，函数调用中指定的字符串\
    \ `\"Hello, there\"` 被赋值给了函数中的 `greeting`。然后，变量 `greeting` 被用来指定 `alert` 语句中的消息。\n\
    \n传递给函数的值在函数体内被用来完成某些操作。在这个例子中，该值被用来指定 `alert` 中的消息。\n\n在示例中，实参是一个字符串，但它也可以是一个变量。在下面的代码中，我声明了变量\
    \ `greeting` 并将其赋值为 `\"Hello, there.\"`。然后，我没有使用字符串本身作为函数调用中的实参，而是使用了变量。\n\n```javascript\n\
    var greeting = \"Hello, there.\";\ngreetUser(greeting);\n```\n\n在上面的例子中，函数名 `greetUser`\
    \ 与形参 `greeting` 共享了部分名称，但这只是为了便于理解代码。函数名和形参名不必有任何共同之处。请记住，只要遵循变量命名规则，这些名称都由你决定。\n\
    \n在示例中，我将调用代码中的实参命名为 `greeting`，也将函数代码中的形参命名为 `greeting`。但这也不是必须的。它们不必匹配。无论实参的名称是什么，它都会被形参接受，无论形参的名称是什么。在下面的代码中，变量\
    \ `whatever` 是实参。形参 `greeting` 与名称不匹配，但仍然捕获了值。\n\n这是函数，再次带有形参 `greeting`。\n\n\
    ```javascript\nfunction greetUser(greeting) {\n  alert(greeting);\n}\n```\n\n\
    这是调用函数的语句，带有实参 `whatever`。\n\n```javascript\nvar whatever = \"Hello, there.\"\
    ;\ngreetUser(whatever);\n```\n\n实参和形参的名称不匹配是可以的。形参仍然捕获了实参，即字符串 `\"Hello, there.\"\
    `。不过，为了清晰起见，通常让实参和形参同名是有意义的。\n\n数字，无论是字面数字还是由变量表示的数字，都可以作为实参。在下面的代码中，我声明了变量 `almostAMil`\
    \ 并为其赋值 `999999`。然后我将 `almostAMil` 用作函数调用中的实参。\n\n```javascript\nvar almostAMil\
    \ = 999999;\nshowBigNum(almostAMil);\n```\n\n或者，如果我想的话，我也可以使用字面数字 `999999` 作为实参。\n\
    \n`showBigNum(999999);`\n\n你可以向函数传递任意数量的实参，用逗号分隔。通常，函数有相同数量的形参，也用逗号分隔。（特殊情况有罕见的例外。）同样，当你使用变量作为实参时，它们的名称不必与形参的名称匹配。JavaScript\
    \ 根据顺序匹配实参和形参，而不是根据名称。列表中的第一个实参传递给列表中的第一个形参，第二个实参传递给第二个形参，依此类推。\n\n作为实参，你可以使用变量、字符串和字面数字的任意组合。在下面的例子中，调用代码向函数传递了一个变量、一个字符串和一个数字。三个形参捕获了这些值。函数将它们拼接起来创建一条\
    \ alert 消息。\n\n首先，这是函数。\n\n```javascript\nfunction showMessage(m, string, num)\
    \ {\n  alert(m + string + num);\n}\n```\n\n现在这是调用函数的语句。\n\n```javascript\nvar\
    \ month = \"March\";\nshowMessage(month, \"'s winner number is \", 23);\n```\n\
    \n实参 `month`（一个变量）被传递给形参 `m`。实参 `\"'s winning number is \"`（一个字符串）被传递给形参 `string`。实参\
    \ `23`（一个字面数字）被传递给形参 `num`。\n\n当代码执行时，会弹出一条 alert 显示：\"March's winning number\
    \ is 23.\"\n\n通常，你会使用函数定义中包含的所有形参作为执行代码中的变量，因为如果不是这样，你为什么要将它们包含在函数定义中呢？但并没有规定你必须全部使用它们。而且你当然不必按照它们在括号内出现的顺序来使用它们。每个形参都是一个完整的变量，在函数内部，你可以像使用任何变量一样使用它。\n\
    \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/36.html`](http://www.ASmarterWayToLearn.com/javascript/36.html)\n\
    \n## 37 函数：从函数返回数据\n\n正如你在上一章中学到的，当你向函数传递数据以便它能够完成定制任务时，函数变得更加灵活。但函数还能做更多事情。它可以将数据传递回调用代码。\n\
    \n假设你收取最低运费 $5，加上超过 $50 的商品总额的 3%，最高到 $100。当总额达到 $100 时，你提供免费送货。以下是计算订单总额的代码。\n\
    \n```javascript\nvar orderTot;\nif (merchTot >= 100) {\n  orderTot = merchTot;\n\
    }\nelse if (merchTot < 50.01) {\n  orderTot = merchTot + 5;\n}\nelse {\n  orderTot\
    \ = merchTot + 5 + (.03 * (merchTot - 50));\n}\n```\n\n如果商品总额至少为 $100，则订单总额等于商品总额。如果商品总额为\
    \ $50 或更少，则订单总额为商品总额加 $5。如果订单总额在 $50 到 $100 之间，则订单总额为商品总额加 $5 再加上超过 $50 部分的 3%。\n\
    \n- 价值 $150 的商品，总价为 $150。\n- 价值 $15 的商品，总价为 $20。\n- 价值 $70 的商品，总价为 $75.60。\n\n\
    以下是我们如何将上述代码转换为函数。\n\n```javascript\nfunction calcTot(merchTot) {\n  var orderTot;\n\
    \  if (merchTot >= 100) {\n    orderTot = merchTot;\n  }\n  else if (merchTot\
    \ < 50.01) {\n    orderTot = merchTot + 5;\n  }\n  else {\n    orderTot = merchTot\
    \ + 5 + (.03 * (merchTot - 50));\n  }\n  return orderTot;\n}\n```\n\n"
