    ## 23 Strings: Finding segments


    The New Yorker magazine doesn''t allow the phrase "World War II. " They say it
    should be "the Second World War." So let''s search the following sentence for
    the banned characters and replace them with the phrase that the New Yorker prefers.


    | It is startling to think that, even in the darkest depths of World War II, J.
    R. R. Tolkien was writing the trilogy, which contains, with the weird applicability
    available only to poetry and myth, the essential notion that the good gray wizard
    can understand the evil magi precisely because he is just enough like them to
    grasp their minds and motives in ways that they cannot grasp his. |


    You already know a way to find the banned segment and replace it. Suppose the
    paragraph above has been assigned to the variable `text`.


    ```javascript

    1 for (var i = 0; i < text.length; i++) {

    2   if (text.slice(i, i + 12) === "World War II") {

    3     text = text.slice(0, i) + "the Second World War" + text.slice(i + 12);

    4   }

    5 }

    ```


    The code loops through the string looking for "World War II." Line 2 progresses
    through the string character-by-character, examining each 12-character sequence.
    If it finds "World War II," line 3 concatenates three segments: all the characters
    preceding "World War II," the substitute phrase "the Second World War," and then
    all the characters following "World War II."


    But JavaScript has a more efficient way to accomplish this, using the `indexOf`
    method.


    `var firstChar = text.indexOf("World War II");`


    If the segment exists, the method finds the index of the first character of the
    segment and assigns it to the variable `firstChar`. If the segment doesn''t exist,
    the method assigns `-1` to the variable, so you know it''s not there.


    Now we can replace the banned phrase with the preferred phrase with less coding.


    ```javascript

    1 var firstChar = text.indexOf("World War II");

    2 if (firstChar !== -1) {

    3   text = text.slice(0, firstChar) + "the Second World War" + text.slice(firstChar
    + 12);

    4 }

    ```


    Line 1 checks for the phrase, assigning the index of the first character of the
    phrase to the variable `firstChar`—if the phrase is found. If it isn''t found,
    `-1` is assigned to the variable. If the variable doesn''t have the value `-1`
    (line 2)—if the phrase has been found—the concatenation in line 3 replaces the
    offending phrase with the correct pharse.


    The `indexOf` method finds only the first instance of the segment you''re looking
    for. In the example above, you could overcome this limitation by looping. You''d
    change the first instance of "World War II" to "the Second World War," then in
    the next loop iteration, find the next surviving instance and change that, and
    so on.


    To find the last instance of a segment in a string, use `lastIndexOf`. The following
    code finds the index of the first character of the last instance of the segment,
    the second "be". The variable `segIndex` winds up with a value of `16`, the index
    of "b" in the second "be".


    ```javascript

    1 var text = "To be or not to be.";

    2 var segIndex = text.lastIndexOf("be");

    ```


