    # 38 函数：局部变量与全局变量


    现在我们讨论变量*作用域*的问题。也就是*全局*变量和*局部*变量的区别。有些变量具有全局作用域，因此它们是全局变量。其他变量具有局部作用域，因此它们是局部变量。这再简单不过了，但不知为何，当书籍和教程中提到这个话题时，往往晦涩难懂。放松点，这很容易。


    全局变量是在代码主体中声明的变量——也就是说，*不是*在函数内部声明的。


    局部变量是在函数内部声明的变量。它可以是函数的参数（通过被命名为参数而隐式声明），也可以是函数内部使用 `var` 关键字显式声明的变量。


    全局变量之所以是全局的，是因为它在代码的每个部分都有意义，无论该代码是在主体中还是在任何函数中。全局作用域就像全球知名度。无论你走到世界哪个角落，他们都听说过比尔·克林顿。


    局部变量是仅在其声明的函数内部有意义的变量。局部作用域就像本地知名度。德卢斯市长在德卢斯广为人知，但在其他地方几乎无人知晓。


    因此，全局变量和局部变量有两个区别——它们声明的位置，以及它们被知晓和可以使用的位置。


    ![](img/00008.jpeg)


    在我展示第一个例子之前，我希望你暂时抛开关于通过参数向函数传递值以及通过 `return` 语句将值传回调用代码的知识。假装你对这些一无所知。我稍后会再回到这些话题。下面是一个例子。


    首先，在主代码中，声明一个变量，然后调用一个函数：


    ```

    1 var theSum

    2 addNumbers();

    ```


    然后是函数：


    ```

    1 function addNumbers() {

    2   theSum = 2 + 2;

    3 }

    ```


    在这个例子中，变量 `theSum` 在主代码中声明。调用函数 `addNumbers` 来给它赋值。由于变量是在主代码中声明的，它具有全局作用域，因此这个函数或任何其他函数都可以使用它。主代码中的任何内容也可以使用它。函数将
    2 + 2 的和赋值给这个全局变量。由于变量具有全局作用域，这个赋值在代码的所有部分（主代码和所有函数）都有意义。现在，变量在函数 `addNumbers`、主代码以及任何使用它的其他函数中都具有值
    4。无论我在哪里写……


    ```

    alert(theSum);

    ```


    无论我写在哪里——在主代码中、在函数 `addNumbers` 中，还是在任何其他函数中——alert 都会显示数字 4。


    但如果我不在主代码中声明变量，而是在函数内部声明……


    ```

    1 function addNumbers() {

    2   var theSum = 2 + 2;

    3 }

    ```


    ……那么变量只在函数内部具有值 4。在其他任何地方，它都是未知的。在其他任何地方，它根本没有值。由于变量 `theSum` 是在函数内部使用关键字 `var`
    声明的，而不是在主代码中，它的作用域是局部的。它只在函数内部有意义。在其他函数和主代码中，它是未知的。如果我写……


    ```

    alert(theSum);

    ```


    ……在函数内部，alert 会显示数字 4，因为变量 `theSum` 在其声明的函数内部是已知的。但如果我在其他地方——主代码或另一个函数中——写同样的
    alert 语句，代码就会出错，因为 `theSum` 在函数外部是未知的。

