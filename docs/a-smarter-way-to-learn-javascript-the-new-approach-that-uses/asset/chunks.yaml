- fmt: "\nSo now in our stripped-down form markup, we've got these three elements:\n\
    \n1. The text \"Email\"\n2. The text field for the user's email address\n3. The\
    \ submit button\n\nI'm going to give the email field an `id`.\n\n```\n<form>\n\
    \  Email:\n  <input type=\"text\" id=\"email\">\n  <input type=\"submit\" value=\"\
    Submit\">\n</form>\n```\n\nNext, I'm going to add an event-handler, using the\
    \ keyword `onSubmit`.\n\n```\n<form onSubmit=\"checkAddress('email');\">\n  Email:\n\
    \  <input type=\"text\" id=\"email\">\n  <input type=\"submit\" value=\"Submit\"\
    >\n</form>\n```\n\nNow, when the user clicks the `submit` button, the function\
    \ `checkAddress` executes. Note that, even though the action is a click on the\
    \ `submit` button, the `onSubmit` event handler is in the `form` tag, not in the\
    \ `submit` button tag. That's because the submission is an event that applies\
    \ to the whole form, not the `submit` button.\n\nHere's where things get interesting.\
    \ When the form is submitted, the function `checkAddress` looks to see if the\
    \ user has entered anything in the email field. If not, the function displays\
    \ an alert reminding the user that the email address is required.\n\nIn order\
    \ to do this, the function needs a way to read what's in the email field. This\
    \ is where the `id` that I added to the field comes in. Here's the code for the\
    \ function.\n\n```\n1 function checkAddress(fieldId) {\n2   if (document.getElementById(fieldId).value\
    \ === \"\") {\n3    alert(\"Email address required.\");\n4   }\n5 }\n```\n\nIf\
    \ there's no value in the email field, an alert displays telling the user that\
    \ an email address is required.\n\nThis is the sequence you need to memorize:\n\
    \n1. The keyword `document`, followed by...\n2. a dot, followed by...\n3. the\
    \ keyword `getElementById`, followed by...\n4. the parameter, in parens, received\
    \ from the calling code, `fieldId`, followed by...\n5. another dot, followed by...\n\
    6. the keyword `value`\n\nNote that `getElementById` must be in strict camelCase.\
    \ If you do what comes naturally and write `getElementByID`, with a cap \"D,\"\
    \ it won't work.\n\nSome coders prefer to put the value found in the field into\
    \ a variable, like this.\n\n```\n1 function checkAddress(fieldId) {\n2   var val\
    \ = document.getElementById(fieldId).value;\n3   if val === \"\") {\n4    alert(\"\
    Email address required.\");\n5   }\n6 }\n```\n\nFind the interactive coding exercises\
    \ for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/49.html](http://www.ASmarterWayToLearn.com/javascript/49.html)\n\
    \n# 50\n\nSetting field values\n\nThe user has entered her ZIP code in a form\
    \ field. You want to save her the trouble of entering the city and state. So when\
    \ she clicks out of the field, you fill in the city field for her.\n\nLet me show\
    \ you how to do that. To keep things simple, we'll pretend there are only three\
    \ ZIP codes in the U.S. We'll also pretend that the user will infallibly enter\
    \ one of these codes. We won't check for errors. And for this example, the JavaScript\
    \ code will fill in only the city field, not the state. Here's the relevant markup\
    \ for the form. (I'm omitting a form action, a `submit` button, and everything\
    \ else that's not relevant to this chapter.)\n\n```\n<form>\n  ZIP:<br>\n  <input\
    \ type=\"text\" id=\"zip\" onBlur=\"fillCity();\"><br>\n  City:<br>\n  <input\
    \ type=\"text\" id=\"city\">\n</form>\n```\n\nWhen the user clicks out of the\
    \ ZIP field, the `onBlur` event triggers the `fillCity` function. This is the\
    \ code.\n\n```\n1  function fillCity() {\n2    var cityName;\n3    var zipEntered\
    \ = document.getElementById(\"zip\").value;\n4    switch (zipEntered) {\n5   \
    \ case \"60608\" :\n6      cityName = \"Chicago\";\n7      break;\n8    case \"\
    68114\" :\n9      cityName = \"Omaha\";\n10     break;\n11   case \"53212\" :\n\
    12     cityName = \"Milwaukee\";\n13   }\n14   document.getElementById(\"city\"\
    ).value = cityName;\n15 }\n```\n\nThis example shows that you can not only read\
    \ a value in a field with `document.getElementById`..., but can also \"write\"\
    \ a value into a field.\n\nIn this case, the function assigns the value found\
    \ in the ZIP field to a variable. Then, using a `switch` statement, it matches\
    \ the ZIP to a city name and assigns that name to a second variable. Then, using\
    \ the variable, it places the city name in the city field.\n\nFind the interactive\
    \ coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/50.html](http://www.ASmarterWayToLearn.com/javascript/50.html)\n\
    \n# 51\n\nReading and setting paragraph text\n\nYour webpage initially displays\
    \ a picture of a little mammal known as the slow loris, along with a single sentence:\n\
    \nSlow lorises are a group of several species of strepsirrhine primates which\
    \ make up the genus Nycticebus. Click for more.\n\nWhen the user clicks the link,\
    \ the paragraph expands:\n\nSlow lorises are a group of several species of strepsirrhine\
    \ primates which make up the genus Nycticebus. They have a round head, narrow\
    \ snout, large eyes, and a variety of distinctive coloration patterns that are\
    \ species-dependent. The hands and feet of slow lorises have several adaptations\
    \ that give them a pincer-like grip and enable them to grasp branches for long\
    \ periods of time. Slow lorises have a toxic bite, a rare trait among mammals.\n\
    \nThis is the markup.\n\n```\n<p id=\"slowLoris\">\nSlow lorises are a group of\
    \ several species of strepsirrhine primates which make up the genus Nycticebus.\
    \ <a href=\"javascript:void(0);\" onClick=\"expandLoris();\"><em>Click for more.</em></a>\n\
    </p>\n```\n\nAn `id` is assigned to the paragraph, which will be used by the function.\
    \ When the user clicks the link, a function, `expandLoris`, is called.\n\nThis\
    \ is the function.\n\n```\n1 function expandLoris() {\n2   var expandedParagraph\
    \ = \"Slow lorises are a group of several species of trepsirrhine primates which\
    \ make up the genus Nycticebus. They have a round head, narrow snout, large eyes,\
    \ and a variety of distinctive coloration patterns that are species-dependent.\
    \ The hands and feet of slow lorises have several adaptations that give them a\
    \ pincer-like grip and enable them to grasp branches for long periods of time.\
    \ Slow lorises have a toxic bite, a rare trait among mammals.\";\n3   document.getElementById(\"\
    slowLoris\").innerHTML = expandedParagraph;\n4 }\n```\n\nLine 2 assigns the long\
    \ version of the text to a variable. Then, identifying the paragraph by its `id`,\
    \ line 3 replaces the original content, the `innerHTML`, with the text stored\
    \ in the variable.\n\nAlmost anything, including HTML tags, can be inserted into\
    \ the web page this way. For example, you could make this list appear on the page\
    \ within, say, a `div` with the `id` \"lorisList\".\n\n1. Slow loris\n2. Fast\
    \ loris\n3. Just-right loris\n\nThis is the function that loads the list markup\
    \ into the `div`, which has been given an `id` of \"lorisList\".\n\n```\n1 function\
    \ placeAList() {\n2   var listToPlace = \"<ol><li>Slow loris</li><li>Fast loris</li><li>Just-right\
    \ loris</li></ol>\";\n3   document.getElementById(\"lorisList\").innerHTML = listToPlace;\n\
    4 }\n```\n\nLine 2 assigns all the HTML for the list to a variable. Line 3 places\
    \ the HTML into the `div` that has been assigned the `id` \"lorisList\".\n\nYou\
    \ can use `document.getElementById(elementId).innerHTML` to read as well as \"\
    write\" the contents of an element. For example, this function assigns whatever\
    \ is in the paragraph, `div`, or other element with the `id` \"content\" to the\
    \ variable `whatsThere`.\n\n```\n1 function peekAtContent() {\n2   var whatsThere\
    \ = document.getElementById(\"content\").innerHTML;\n3 }\n```\n\nLine 2 reads\
    \ all the HTML within the element with an `id` of \"content\" and assigns it to\
    \ the variable `whatsThere`. If the element is, for example, a paragraph whose\
    \ content is `<em>Hello, Sailor!</em>`, the variable `whatsThere` captures `<em>Hello,\
    \ Sailor!</em>`.\n\nFind the interactive coding exercises for this chapter at:\n\
    \n[http://www.ASmarterWayToLearn.com/js/51.html](http://www.ASmarterWayToLearn.com/javascript/51.html)\n\
    \n# 52\n\nManipulating images and text\n\nYour webpage displays a picture of a\
    \ blobfish. The blobfish is a fascinating animal, but it's so ugly, some of your\
    \ users go \"Yuck.\" So you give them the option of making it disappear. When\
    \ they click the image, it vanishes.\n\nYou begin by giving the image an `id`.\n"
  raw: 'So now in our stripped-down form markup, we''ve got these three elements:


    1.  The text "Email"


    2.  The text field for the user''s email address


    3.  The submit button


    I''m going to give the email field an id.


    <form>


      Email:


      <input type="text" id="email">


      <input type="submit" value="Submit">


    </form>


    Next, I''m going to add an event-handler, using the keyword onSubmit.


    <form onSubmit="checkAddress(''email'');">


      Email:


      <input type="text" id="email">


      <input type="submit" value="Submit">


    </form>


    Now, when the user clicks the **submit** button, the function checkAddress executes.
    Note that, even though the action is a click on the **submit** button, the onSubmit
    event handler is in the form tag, not in the **submit** button tag. That''s because
    the submission is an event that applies to the whole form, not the **submit**
    button.


    Here''s where things get interesting. When the form is submitted, the function
    checkAddress looks to see if the user has entered anything in the email field.
    If not, the function displays an alert reminding the user that the email address
    is required.


    In order to do this, the function needs a way to read what''s in the email field.
    This is where the id that I added to the field comes in. Here''s the code for
    the function.


    1 function checkAddress(fieldId) {


    2   if (document.getElementById(fieldId).value === "") {


    3    alert("Email address required.");


    4   }


    5 }


    If there''s no value in the email field, an alert displays telling the user that
    an email address is required.


    This is the sequence you need to memorize:


    1.  The keyword document, followed by...


    2.  a dot, followed by...


    3.  the keyword getElementById, followed by...


    4.  the parameter, in parens, received from the calling code, fieldId,followed
    by...


    5.  another dot, followed by...


    6.  the keyword value


    Note that getElementById must be in strict camelCase. If you do what comes naturally
    and write getElementByID, with a cap "D," it won''t work.


    Some coders prefer to put the value found in the field into a variable, like this.


    1 function checkAddress(fieldId) {


    2   var val = document.getElementById(fieldId).value;


    3   if val === "") {


    4    alert("Email address required.");


    5   }


    6 }


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/49.html](http://www.ASmarterWayToLearn.com/javascript/49.html)


    # 50


    Setting field values


    The user has entered her ZIP code in a form field. You want to save her the trouble
    of entering the city and state. So when she clicks out of the field, you fill
    in the city field for her.


    Let me show you how to do that. To keep things simple, we''ll pretend there are
    only three ZIP codes in the U.S. We''ll also pretend that the user will infallibly
    enter one of these codes. We won''t check for errors. And for this example, the
    JavaScript code will fill in only the city field, not the state. Here''s the relevant
    markup for the form. (I''m omitting a form action, a *submit* button, and everything
    else that''s not relevant to this chapter.)


    <form>


      ZIP:<br>


      <input type="text" id="zip" onBlur="fillCity();"><br>


      City:<br>


      <input type="text" id="city">


    </form>


    When the user clicks out of the ZIP field, the onBlur event triggers the fillCity
    function. This is the code.


    1  function fillCity() {


    2    var cityName;


    3    var zipEntered = document.getElementById("zip").value;


    4    switch (zipEntered) {


    5    case "60608" :


    6      cityName = "Chicago";


    7      break;


    8    case "68114" :


    9      cityName = "Omaha";


    10     break;


    11   case "53212" :


    12     cityName = "Milwaukee";


    13   }


    14   document.getElementById("city").value = cityName;


    15 }


    This example shows that you can not only read a value in a field with document.getElementById...,
    but can also "write" a value into a field.


    In this case, the function assigns the value found in the ZIP field to a variable.
    Then, using a *switch* statement, it matches the ZIP to a city name and assigns
    that name to a second variable. Then, using the variable, it places the city name
    in the city field.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/50.html](http://www.ASmarterWayToLearn.com/javascript/50.html)


    # 51


    Reading and setting paragraph text


    Your webpage initially displays a picture of a little mammal known as the slow
    loris, along with a single sentence:


    Slow lorises are a group of several species of strepsirrhine primates which make
    up the genus Nycticebus. Click for more.


    When the user clicks the link, the paragraph expands:


    Slow lorises are a group of several species of strepsirrhine primates which make
    up the genus Nycticebus. They have a round head, narrow snout, large eyes, and
    a variety of distinctive coloration patterns that are species-dependent. The hands
    and feet of slow lorises have several adaptations that give them a pincer-like
    grip and enable them to grasp branches for long periods of time. Slow lorises
    have a toxic bite, a rare trait among mammals.


    This is the markup.


    <p id="slowLoris">


    Slow lorises are a group of several species of strepsirrhine primates which make
    up the genus Nycticebus. <a href="javascript:void(0);" onClick="expandLoris();"><em>Click
    for more.</em></a>


    </p>


    An id is assigned to the paragraph, which will be used by the function. When the
    user clicks the link, a function, expandLoris, is called.


    This is the function.


    1 function expandLoris() {


    2   var expandedParagraph = "Slow lorises are a group of several species of trepsirrhine
    primates which make up the genus Nycticebus. They have a round head, narrow snout,
    large eyes, and a variety of distinctive coloration patterns that are species-dependent.
    The hands and feet of slow lorises have several adaptations that give them a pincer-like
    grip and enable them to grasp branches for long periods of time. Slow lorises
    have a toxic bite, a rare trait among mammals.";


    3   document.getElementById("slowLoris").innerHTML = expandedParagraph;


    4 }


    Line 2 assigns the long version of the text to a variable. Then, identifying the
    paragraph by its id, line 3 replaces the original content, the innerHTML, with
    the text stored in the variable.


    Almost anything, including HTML tags, can be inserted into the web page this way.
    For example, you could make this list appear on the page within, say, a div with
    the id "lorisList".


    1.  Slow loris


    2.  Fast loris


    3.  Just-right loris


    This is the function that loads the list markup into the div, which has been given
    an id of "lorisList".


    1 function placeAList() {


    2   var listToPlace = "<ol><li>Slow loris</li><li>Fast loris</li><li>Just-right
    loris</li></ol>";


    3  document.getElementById("lorisList").innerHTML = listToPlace;


    4 }


    Line 2 assigns all the HTML for the list to a variable. Line 3 places the HTML
    into the div that has been assigned the id "lorisList".


    You can use document.getElementById(*element id*).innerHTML to read as well as
    "write" the contents of an element. For example, this function assigns whatever
    is in the paragraph, div, or other element with the id "content" to the variable
    whatsThere.


    1 function peekAtContent() {


    2   var whatsThere = document.getElementById("content").innerHTML;


    3 }


    Line 2 reads all the HTML within the element with an id of "content" and assigns
    it to the variable whatsThere. If the element is, for example, a paragraph whose
    content is "<em>Hello, Sailor!</em>" the variable whatsThere captures "<em>Hello,
    Sailor!</em>"


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/51.html](http://www.ASmarterWayToLearn.com/javascript/51.html)


    # 52


    Manipulating images and text


    Your webpage displays a picture of a blobfish. The blobfish is a fascinating animal,
    but it''s so ugly, some of your users go "Yuck." So you give them the option of
    making it disappear. When they click the image, it vanishes.


    You begin by giving the image an id.'
