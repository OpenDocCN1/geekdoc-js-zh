    # 74


    对象：原型


    在上一章中，我们使用构造函数创建了三个对象。每个对象对应一个托管方案。每个对象有六个属性和一个方法。下表展示了这三个对象及其属性和方法。请注意最后一行（表格中绿色标记的行），它代表三个对象的方法……


    ![](img/00017.jpeg)


    绿色的最后一行存在一些不优雅之处。上面各行显示的属性是针对每个对象定制的，但方法在不同对象之间始终相同。构造函数为每个对象重复复制相同的方法，一个接一个。如果我们使用构造函数创建
    100 个对象，JavaScript 会重复复制该方法 100 次，每个对象一次。虽然能工作，但不够美观。


    下面的表格更有意义，它显示所有对象共享同一个方法。


    ![](img/00018.jpeg)


    我们希望只保留方法的一个副本，由构造函数创建的所有对象共享，无论创建多少个对象。


    如何实现？通过 *prototype* 语句。


    首先，我们不在构造函数中包含该方法，因为这样会为每个通过构造函数创建的对象复制一个方法副本。


    相反，我们以这种方式将方法定义为构造函数的原型。


    ```

    1  Plan.prototype.calcAnnual = function(percentIfDisc) {

    2    var bestPrice = this.price;

    3    var currDate = new Date();

    4    var thisMo = currDate.getMonth();

    5    for (var i = 0; i < this.discountMonths.length; i++) {

    6      if (this.discountMonths[i] === thisMo) {

    7        bestPrice = this.price * percentIfDisc;

    8        break;

    9      }

    10   }

    11   return bestPrice * 12;

    12 };

    ```


    现在，所有通过构造函数 `Plan` 创建的对象将共享同一个 `calcAnnual` 方法副本。没有不必要的重复。


    请注意，除了第一行之外，方法的编码方式与它在构造函数定义中时完全相同。如果只考虑等号右侧的部分，甚至第一行也是相同的。等号左侧由点连接的部分是：


    - 构造函数名称，此处为 `Plan`

    - 关键字 `prototype`

    - 所有通过 `Plan` 创建的对象将共享的方法名称，此处为 `calcAnnual`


    对象可以拥有原型属性以及原型方法。假设你希望所有通过 `Plan` 创建的对象共享同一个属性 `cancellable`，其值为 `true`。你可以这样编写原型。


    ```

    Plan.prototype.cancellable = true;

    ```


    现在，所有通过构造函数 `Plan` 创建的对象共享一个属性 `cancellable`，其值为 `true`。


    这是包含原型方法和原型属性的对象表。


    ![](img/00019.jpeg)


    可以为任何单个对象覆盖原型。例如，假设你希望所有通过构造函数创建的对象共享同一个 `cancellable` 属性，但最便宜的方案 `plan1`（名称为
    "Basic"）除外。以下语句可以实现。


    ```

    plan1.cancellable = false;

    ```


    所有通过构造函数创建的对象仍然共享属性 `cancellable`，但现在该属性对于一个对象的值与其他所有对象不同。如下表所示。


    ![](img/00020.jpeg)


    同样，你也可以为任何单个对象覆盖共享的原型方法。


