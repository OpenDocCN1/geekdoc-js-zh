- fmt: "\nBut now let's make the function more flexible so the discount rate can vary,\
    \ depending on the value that the calling statement passes to it. Here's the revision,\
    \ with the percentage to be charged, passed to the parameter `percentIfDisc`,\
    \ if the user qualifies for a discount.\n\n```\nfunction calcAnnual(percentIfDisc)\
    \ {\n  var bestPrice = plan1.price;\n  var currDate = new Date();\n  var thisMo\
    \ = currDate.getMonth();\n  for (var i = 0; i < plan1.discountMonths.length; i++)\
    \ {\n    if (plan1.discountMonths[i] === thisMo) {\n      bestPrice = plan1.price\
    \ * percentIfDisc;\n      break;\n    }\n  }\n  return bestPrice * 12;\n}\n```\n\
    \nThis is the calling statement that passes the value to the function and executes\
    \ it. In this example, it passes the value .85, representing a discount of 15\
    \ percent.\n\n`var annual Price = calcAnnual(.85);`\n\nYou've learned that you\
    \ can attach a variable to an object, and the variable becomes the object's property.\
    \ Here's more news. You can attach a function to an object, and the function becomes\
    \ that object's `method`. It does the same task the regular function does, but\
    \ now it's attached to an object. The reasons why you would want to use a method\
    \ rather than an ordinary function will become clear in subsequent chapters. For\
    \ now, let me show you how it's done.\n\nThis code inserts the function that I\
    \ coded above into the object definition, so now it's a method. Operationally,\
    \ it's the same as the plain-vanilla function, but now it's attached to the object.\n\
    \n```\nvar plan1 = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer:\
    \ 1000,\n  pages: 10,\n  discountMonths: [6, 7],\n  calcAnnual: function(percentIfDisc)\
    \ {\n    var bestPrice = plan1.price;\n    var currDate = new Date();\n    var\
    \ thisMo = currDate.getMonth();\n    for (var i = 0; i < plan1.discountMonths.length;\
    \ i++) {\n      if (plan1.discountMonths[i] === thisMo) {\n        bestPrice =\
    \ plan1.price * percentIfDisc;\n        break;\n      }\n    }\n    return bestPrice\
    \ * 12;\n  }\n};\n```\n\nThings to notice:\n\n*   Except for the first line, every\
    \ line of the method is identical to the code I used to create the plain-vanilla\
    \ function that we started with.\n*   The method definition begins the same way\
    \ a property definition begins, with the name followed by a colon.\n*   A comma\
    \ ends every property definition and method definition except for the last property\
    \ or method. If you were to add a property or method below the `calcAnnual` method\
    \ definition, you'd need to insert a comma after the closing curly bracket of\
    \ the `calcAnnual` definition.\n*   The parentheses that indicate that a variable\
    \ name is the name of a function come immediately after the keyword `function`.\
    \ Parameters, if there are any, go inside the parens, as in any function definition.\n\
    \nThis is how you'd call the method.\n\n`var annualPrice = plan1.calcAnnual(.85);`\n\
    \nI'm going to add a refinement to the method definition. In the definition I\
    \ coded above, the properties are referred to using the name of the object—for\
    \ example, `plan1.price`. This works, but a better approach, for reasons that\
    \ will become clear in subsequent chapters, is to replace the name of the object\
    \ with the keyword `this`. When JavaScript sees `this` keyword, it knows you're\
    \ referring to the object that's being defined.\n\n```\nvar plan1 = {\n  name:\
    \ \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer: 1000,\n  pages: 10,\n\
    \  discountMonths: [6, 7],\n  calcAnnual: function(percentIfDisc) {\n    var bestPrice\
    \ = this.price;\n    var currDate = new Date();\n    var thisMo = currDate.getMonth();\n\
    \    for (var i = 0; i < this.discountMonths.length; i++) {\n      if (this.discountMonths[i]\
    \ === thisMo) {\n        bestPrice = this.price * percentIfDisc;\n        break;\n\
    \      }\n    }\n    return bestPrice * 12;\n  }\n};\n```\n\nWhen you write `this.whatever`,\
    \ JavaScript is smart enough to understand that you're referring to a property\
    \ of the object that's being defined—in this case, `plan1`.\n\nFind the interactive\
    \ coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/71.html](http://www.ASmarterWayToLearn.com/javascript/71.html)\n\
    \n# 72\n\nObjects:\n\nConstructors\n\nAgain, here's a version of the chart showing\
    \ different hosting plans.\n\n![](images/00014.jpeg)\n\nThis is how I encapsulated\
    \ the information for the Basic plan in an object and five properties.\n\n```\n\
    var plan1 = {\n  name: \"Basic\",\n  price: 3.99,\n  space: 100,\n  transfer:\
    \ 1000,\n  pages: 10\n};\n```\n\nBut that only gets us an object that represents\
    \ the first plan. I'd have to do the same thing again for the Professional and\
    \ Ultimate plans. This is too much hand craftsmanship. We need a factory to crank\
    \ out these things by the dozen. JavaScript lets you build such a factory. It's\
    \ called a `constructor function`.\n\n```\nfunction Plan(name, price, space, transfer,\
    \ pages) {\n  this.name = name;\n  this.price = price;\n  this.space = space;\n\
    \  this.transfer = transfer;\n  this.pages = pages;\n}\n```\n\nThis would be a\
    \ plain-vanilla function definition but for two differences:\n\n*   The function\
    \ name is capitalized. JavaScript doesn't care whether you do this or not, but\
    \ it's conventional to do it to distinguish constructor functions from regular\
