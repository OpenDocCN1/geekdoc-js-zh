  trans: "\n变量 `par` 现在保存了一个类似数组的集合，包含文档中的所有段落。为简单起见，假设文档正文仅包含三个段落。\n\n```\n<p>This\
    \ bed is too small.</p>\n<p>This bed is too big.</p>\n<p>This bed is just right.</p>\n\
    ```\n\n`par[0]` 是第一个段落。`par[1]` 是第二个段落。`par[2]` 是第三个段落。`par.length` 是 3，即集合中的项目数量。\n\
    \n如果你编写...\n\n```\nvar textInMiddleParagraph = par[1].innerHTML;\n```\n\n...那么变量\
    \ `textInMiddleParagraph` 被赋值为 `\"This bed is too big.\"`\n\n如果你编写...\n\n```\n\
    par[1].innerHTML = \"This SUV is too big.\";\n```\n\n...那么段落文本将变为 `\"This SUV\
    \ is too big.\"`\n\n下面是一个循环，为所有段落指定字体族。\n\n```\nfor (var i = 0; i < par.length;\
    \ i++) {\n  par[i].style.fontFamily = \"Verdana, Geneva, sans-serif\";\n}\n```\n\
    \n这条语句创建文档中所有图像的集合，并将其赋值给变量 `pics`。\n\n```\nvar pics = document.getElementsByTagName(\"\
    img\");\n```\n\n这条语句创建文档中所有 div 的集合，并将其赋值给变量 `divs`。\n\n```\nvar divs = document.getElementsByTagName(\"\
    div\");\n```\n\n这条语句创建文档中所有无序列表的集合，并将其赋值给变量 `ulists`。\n\n```\nvar ulists = document.getElementsByTagName(\"\
    ul\");\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/56.html`](http://www.ASmarterWayToLearn.com/javascript/56.html)\n\
    \n# 57\n\n通过标签名定位元素\n\n在上一章中，你学会了如何创建一个类似数组的集合，包含文档中所有具有特定标签名的元素。例如，以下语句创建文档中所有段落的集合，并将该集合赋值给变量\
    \ `pars`。\n\n```\nvar pars = document.getElementsByTagName(\"p\");\n```\n\n你还学会了使用类似数组的表示法（方括号中的数字）来读取或设置元素集合中任意元素的属性。例如，以下语句“读取”集合\
    \ `pars` 中第二个元素的内容，并将字符串赋值给变量 `textInMiddleParagraph`。\n\n```\nvar textInMiddleParagraph\
    \ = pars[1].innerHTML;\n```\n\n但假设你不想获取文档中所有段落的集合，而只想获取某个特定 `div` 内的所有段落。没问题。假设该\
    \ `div` 的 `id` 是 `\"rules\"`。代码如下：\n\n```\nvar e = document.getElementById(\"\
    rules\");\nvar paragraphs = e.getElementsByTagName(\"p\");\n```\n\n第 1 行将 `id`\
    \ 为 `\"rules\"` 的 `div` 赋值给变量 `e`。\n\n第 2 行创建该 `div` 中所有段落的集合，并将该集合赋值给变量 `paragraphs`。\n\
    \n一旦目标 `div` 的 `id` 被赋值给变量（例如 `e`），你就可以收集该 `div` 内的所有段落。不再编写...\n\n```\ndocument.getElementsByTagName(\"\
    p\");\n```\n\n...（这会创建文档中所有段落的集合），而是编写...\n\n```\ne.getElementsByTagName(\"p\"\
    );\n```\n\n...这会创建该 `div` 中所有段落的集合。\n\n假设你有一个白色背景的表格。当用户点击按钮时，单元格变为粉色。代码如下：\n\n\
    ```\nvar t = document.getElementById(\"table9\");\nvar cells = t.getElementsByTagName(\"\
    td\");\nfor (var i = 0; i < cells.length; i++) {\n  cells[i].style.backgroundColor\
    \ = \"pink\";\n}\n```\n\n逐行解释如下：\n\n1. 通过 `id` 定位表格\n2. 收集表格中所有带有 `td` 标签的元素\n\
    3-5. 遍历所有元素，更改它们的背景颜色\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/57.html`](http://www.ASmarterWayToLearn.com/javascript/57.html)\n\
    \n# 58\n\nDOM\n\n在前几章中，你学习了两种不同的方法来定位网页组件，以便读取或设置它们。你学习了 `getElementById`，也学习了\
    \ `getElementsByTagName`。这些通常是定位元素的最佳方法，但它们也有局限性。第一种方法 `getElementById` 只能访问那些被分配了\
    \ `id` 的组件。第二种方法 `getElementsByTagName` 适合批量修改，但对于精细的局部操作则略显笨拙。这两种方法都可以更改网页上的内容，但都无法处理页面上的*所有*内容，无法创建新内容、移动现有内容或删除它们。\n\
    \n幸运的是，这两种方法只是处理 `文档对象模型`（`DOM`）的众多方法中的两种。`DOM` 是一个组织结构图，当你的网页加载时，浏览器会自动为整个网页创建它。网页上的所有内容——标签、文本块、图像、链接、表格、样式属性等——都在这个组织结构图中占据位置。这意味着你的\
    \ JavaScript 代码只需指出某个内容在图表中的位置，就能获取网页上的任何内容，任何内容都可以。更重要的是，你的 JavaScript 可以通过操作图表来添加、移动或删除内容。如果你愿意（当然你不会），你几乎可以完全使用\
    \ JavaScript 的 `DOM` 方法从头创建一个完整的网页。\n\n下面是一个简化的网页。我缩进了层次结构中的不同级别。对于标准网页，`DOM`\
    \ 的前三个级别总是相同的。`document` 是第一级。`document` 下面是第二级 `html`。`html` 下面是并列的第三级 `head`\
    \ 和 `body`。每个级别下面还有更多级别。\n\n```\n1st level: document\n2nd level:   <html>\n3rd\
    \ level:     <head>\n4th level:       <title>\n5th level:         Simple document\n\
    \                 </title>\n               </head>\n3rd level      <body>\n4th\
    \ level        <p>\n5th level          There's not much to this.\n           \
    \      </p>\n               </body>\n             </html>\n```\n\n下面是相同的内容，以组织结构图的形式展示。请注意，这是一个理想化的图表，去除了大多数浏览器在\
    \ `DOM` 中插入的垃圾元素。我将在后续章节中向你展示如何清除这些垃圾元素。\n\n![](img/00009.jpeg)\n\n如你所见，网页上的每一个内容都被包含在内，甚至包括标题文本和段落文本。让我们通过添加一个\
    \ `div` 和第二个段落来使其稍微复杂一些。以下是 HTML 形式。\n\n```\n1st level: document\n2nd level: \
    \  <html>\n3rd level:     <head>\n4th level:       <title>\n5th level:       \
    \  Simple document\n                 </title>\n               </head>\n3rd level\
    \      <body>\n4th level        <div>\n5th level          <p>\n6th level     \
    \       There's not much to this.\n                   </p>\n5th level        \
    \  <p>\n6th level            Nor to this.\n                   </p>\n         \
    \        </div>\n               </body>\n             </html>\n```\n\n以及组织结构图（去除所有垃圾元素后）...\n\
    \n![](img/00010.jpeg)\n\n在公司组织结构图中，每个方框代表一个人。在 `DOM` 组织结构图中，每个方框代表一个**节点**。上面表示的\
    \ HTML 页面，在其清理后的 `DOM` 形式中，有 11 个节点：`document` 节点、`html` 节点、`head` 和 `body` 节点、`title`\
    \ 节点、`div` 节点、两个段落节点，以及三个文本节点（一个用于标题，另外两个分别用于两个段落）。\n\n在这个特定的图表中，有三种类型的节点：`document`、`element`\
    \ 和 `text`。`document` 节点是顶层。元素节点是 `<html>`、`<head>`、`<body>`、`<title>`、`<div>`\
    \ 和 `<p>`。文本节点是构成标题和两个段落的字符串。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/58.html`](http://www.ASmarterWayToLearn.com/javascript/58.html)\n\
    \n# 59\n\nDOM：父节点与子节点\n\n"
- fmt: "\nCan you name the second child of the 44th President of the United States?\
    \ That would be Sasha. How about the parent (male) of the 43rd President? That's\
    \ right, George.\n\nWelcome to the most fundamental way of designating nodes of\
    \ the Document Object Model (DOM). You can designate any node of the DOM by saying\
    \ the node is the *x*th child of a particular parent. You can also designate a\
    \ node by saying it's the parent of any child.\n\nTake a look at the simplified\
    \ html document from the last chapter.\n\n1st level: document\n\n2nd level: `<html>`\n\
    \n3rd level: `<head>`\n\n4th level: `<title>`\n\n5th level: Simple document\n\n\
    `</title>`\n\n`</head>`\n\n3rd level `<body>`\n\n4th level `<div>`\n\n5th level\
    \ `<p>`\n\n6th level There's not much to this.\n\n`</p>`\n\n5th level `<p>`\n\n\
    6th level Nor to this.\n\n`</p>`\n\n`</div>`\n\n`</body>`\n\n`</html>`\n\nExcept\
    \ for the document node, each node is enclosed within another node. The `<head>`\
    \ and `<body>` nodes are enclosed within the `<html>` node. The `<div>` node is\
    \ enclosed within the `<body>` node. Two `<p>` nodes are enclosed within the `<div>`\
    \ node. And a text node is enclosed within each of the `<p>` nodes.\n\nWhen a\
    \ node is enclosed within another node, we say that the enclosed node is a **child**\
    \ of the node that encloses it. So, for example, the `<div>` node is a child of\
    \ the `<body>` node. Conversely, the `<body>` node is the **parent** of the `<div>`\
    \ node. Here's the organization chart from the last chapter, again cleaned of\
    \ junk artifacts, showing all the parents and their children.\n\n![](images/00011.jpeg)\n\
    \nAs you can see, `<html>` is the child of the **document**...`<head>` and `<body>`\
    \ are the children of `<html>`...`<div>` is the child of `<body>`...two `<p>`'s\
    \ are the children of `<div>`...each text node is the child of a `<p>`. Conversely,\
    \ the **document** is the parent of `<html>`, `<html>` is the parent of `<head>`\
    \ and `<body>`, `<head>` is the parent of `<title>`, `<title>` is the parent of\
    \ a text node, and so on. Nodes with the same parent are known as siblings. So,\
    \ `<head>` and `<body>` are siblings because `<html>` is the parent of both. The\
    \ two `<p>`'s are siblings because `<div>` is the parent of both.\n\nStarting\
    \ at the bottom of the chart, the text \"Nor to this.\" is a child of `<p>`, which\
    \ is a child of `<div>`, which is a child of `<body>`, which is a child of `<html>`,\
    \ which is a child of the **document**.\n\nNow look at this markup.\n\n```\n<p>This\
    \ is <em>important</em>!</p>\n```\n\nIf you made a chart for this paragraph, you\
    \ might think that all the text is a child of the `<p>` node. But remember, every\
    \ node that is enclosed by another node is the child of the node that encloses\
    \ it. Since the text node \"important\" is enclosed by the element node `<em>`,\
    \ this particular text node is the child of `<em>`, not `<p>`. The text nodes\
    \ \"This is \" and \"!\" as well as the element node `<em>` are siblings, because\
    \ they're all enclosed by `<p>`. They're all children of `<p>`.\n\n![](images/00012.jpeg)\n\
    \nFind the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/59.html](http://www.ASmarterWayToLearn.com/javascript/59.html)\n\
    \n# 60\n\n## The DOM: Finding children\n\nAs you learned in the last chapter,\
    \ the Document Object Model (DOM) is a hierarchy of parents and children. Everything\
    \ on the web page, excluding the document itself, is a child of something else.\
    \ So now let's talk about how your JavaScript code can make use of this hierarchy\
    \ of parents and children to read or change virtually anything on a web page.\n\
    \nLet's begin with the methods you've already learned for targeting things on\
    \ the web page. You'll recall from earlier chapters that you can target an element\
    \ by specifying its id, if it has one.\n\n```\nvar eField = document.getElementById(\"\
    email\");\n```\n\nThe statement above targets the element with the id of \"email\"\
    .\n\nYou also learned how to make an array-like collection of all the elements\
    \ of a particular kind within the document...\n\n```\nvar eField = document.getElementsByTagName(\"\
    p\");\n```\n\nHaving made a collection of paragraphs, you can target any paragraph\
    \ within the collection so that you can, for example, read its contents.\n\n```\n\
    var contents = p[2].innerHTML;\n```\n\nThe statement above assigns the text string\
    \ contained within the third paragraph of the document to the variable `contents`.\n\
    \nAn alternative to listing all the elements of a certain kind in the document\
    \ is to narrow the focus below the document level, for example to a div, and then\
    \ make a collection within that div.\n\n```\n1 var d = document.getElementById(\"\
    div3\");\n2 var p = d.getElementsByTagName(\"p\");\n3 var contents = p[2].innerHTML;\n\
    ```\n\nIn the example above, you generate a collection not of all the paragraph\
    \ elements in the document, but only those paragraph elements within the div that\
    \ has an id of \"div3\". Then you target one of those paragraphs.\n\nNow consider\
    \ this markup.\n\n```\n<body>\n  <div id=\"cal\">\n     <p>Southern Cal is sunny.</p>\n\
    \     <p>Northern Cal is rainy.</p>\n     <p>Eastern Cal is desert.</p>\n  </div>\n\
    \  <div id=\"ny\">\n     <p>Urban NY is crowded.</p>\n     <p>Rural NY is sparse.</p>\n\
    \  </div>\n</body>\n```\n\nIf you wanted to read the contents of the last paragraph\
    \ in the markup, you could write...\n\n```\n1 var p = document.getElementsByTagName(\"\
    p\");\n2 var contents = p[4].innerHTML;\n```\n\nLine 1 makes a collection of all\
    \ the `<p>`s in the document and assigns the collection to the variable `p`. Line\
    \ 2 \"reads\" the text contained in the 5th paragraph of the document.\n\nAnother\
    \ approach: You could target the same paragraph by narrowing the collection of\
    \ elements to those that are just in the second div.\n\n```\n1 var div = document.getElementById(\"\
    ny\");\n2 var p = div.getElementsByTagName(\"p\");\n3 var contents = p[1].innerHTML;\n\
    ```\n\nHere's the breakdown:\n\n1. Assigns the div with the id \"ny\" to the variable\
    \ `div`\n2. Makes a collection of all the `<p>`s in the div and assigns the collection\
    \ to the variable `p`\n3. \"Reads\" the text contained in the 2nd paragraph of\
    \ the div and assigns it to the variable `contents`\n\nNow I'll show you a new\
    \ way to target the paragraph, by using the DOM organization chart.\n\n```\n1\
    \ var p = document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];\n\
    2 var contents = p.innerHTML;\n```\n\nI'll highlight each child level and tell\
    \ you what it points to.\n\n1. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the first child of the document, `<html>`\n2. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<html>`, `<body>`\n3. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<body>`, `<div>` with the id \"ny\"\n4. `document.childNodes[0].childNodes[1].childNodes[1].childNodes[1];`\
    \ is the second child of `<div>` with the id \"ny\", the second `<p>` within the\
    \ div\n\nNote: The code above assumes the browser hasn't included any junk artifacts\
    \ in the DOM. I'll discuss these in the next chapter.\n\nAs we work our way down\
    \ the organization chart, each parent is followed by a dot, which is followed\
    \ by the keyword `childNodes`, which is followed by a number in brackets, as in\
    \ array notation. As in array notation, the first child is number 0.\n\nHere's\
    \ the markup again. The key players in the code above are highlighted.\n\n```\n\
    <body>\n  <div id=\"cal\">\n    <p>Southern Cal is sunny.</p>\n    <p>Northern\
    \ Cal is rainy.</p>\n    <p>Eastern Cal is desert.</p>\n   </div>\n   <div id=\"\
    ny\">\n     <p>Urban NY is crowded.</p>\n     <p>Rural NY is sparse.</p>\n   </div>\n\
    </body>\n```\n\nIn the example above, I showed you how to work your way down to\
    \ the targeted node starting at the document level. But in practice, you'd normally\
    \ start at a lower level. For example, you could start with the second div, specifying\
    \ its id. Then you'd target one of its children.\n\n```\n1 var d = document.getElementById(\"\
    ny\");\n```\n"
