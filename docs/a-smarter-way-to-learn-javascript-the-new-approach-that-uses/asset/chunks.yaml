- fmt: "\n*   You can specify window size without specifying window position, but\
    \ if you specify window position without size, it will be ignored since it will\
    \ be a full-size window that fills the whole screen.\n\nAs usual, some or all\
    \ of the parameters can be assigned to a variable, and the variable can be used\
    \ in the statement that opens the window. Since the whole thing has to be a quoted\
    \ string, the quotes within the string have to be changed to single quotes.\n\n\
    ```\n1 var windowSpecs = \"'faq.html', 'faq', 'width=420,height=380,left=200,top=100'\"\
    ;\n2 var faqPage = window.open(windowSpecs);\n```\n\nFind the interactive coding\
    \ exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/80.html](http://www.ASmarterWayToLearn.com/javascript/80.html)\n\
    \n# 81\n\n## Browser control:\n\n### Testing for popup blockers\n\nPopup blockers\
    \ are now a standard feature of browsers, with some level of popup blocking usually\
    \ built in as a default. JavaScript popups, and especially those that open a new\
    \ page within the same website, are often tolerated by default, but you can never\
    \ be sure. If popups are an essential feature of your site, you need to test whether\
    \ your popups are going to be blocked. If they are, you can ask the user to disable\
    \ the popup blocker for your site.\n\nThe test is pretty inelegant. You attempt\
    \ to open a small test popup, then quickly close it—so fast that the user may\
    \ not notice the little screen flash. If the attempt succeeds, the window's handle\
    \ will have a value. If the popup is blocked, the handle will be null, and you\
    \ can deliver your message to the user.\n\nHere's the code.\n\n```\n1 function\
    \ checkForPopBlocker() {\n2   var testPop = window.open(\"\", \"\",\"width=100,height=100\"\
    );\n3   if (testPop === null) {\n4     alert(\"Please disable your popup blocker.\"\
    );\n5   }\n6   testPop.close();\n7 }\n```\n\nHere's the line-by-line breakdown:\n\
    \n2 Attempts to open a tiny window\n\n3-4 If the handle is assigned null, meaning\
    \ the window couldn't open, an alert displays\n\n6 Closes the window\n\nThe function\
    \ shown above works with all browsers except Internet Explorer. In Internet Explorer,\
    \ if the popup is blocked, the handle will be undefined instead of null. So to\
    \ cover all bases, you need to code the function this way.\n\n```\n1 function\
    \ checkForPopBlocker() {\n2   var testPop = window.open(\"\", \"\",\"width=100,height=100\"\
    );\n3   if (testPop === null || typeof(testPop === \"undefined\") {\n4     alert(\"\
    Please disable your popup blocker.\");\n5   }\n6   testPop.close();\n7 }\n```\n\
    \nNormally, you'd run the test when the page loads.\n\n`<body onLoad =\"checkForPopBlocker();\"\
    >`\n\nFind the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/81.html](http://www.ASmarterWayToLearn.com/javascript/81.html)\n\
    \n# 82\n\n## Form validation: text fields\n\nIs the user filling out your forms\
    \ correctly? JavaScript helps you find out—that is, helps you *validate* your\
    \ form. With form validation, if there's a problem, you can ask the user to try\
    \ again. To begin with, if you have a required field, you can check to see if\
    \ the user has entered something in it. Let's start with a simple form that asks\
    \ the user to enter her last name.\n\nHere's some markup for the form. I'm omitting\
    \ lots of things, including styling stuff, to keep you focused on what's important\
    \ to learn here.\n\n```\n<form onSubmit=\"return checkForLastName();\">\n  Please\
    \ enter your last name.<br>\n  <input type=\"text\" id=\"lastNameField\">\n  <input\
    \ type=\"submit\" value=\"Submit Form\">\n</form>\n```\n\nWhen the user clicks\
    \ the **Submit** button, the function `checkForLastName` is called.\n\nHere's\
    \ the function.\n\n```\n1 function checkForLastName() {\n2   if (document.getElementById(\"\
    lastNameField\").value.length === 0) {\n3     alert(\"Please enter your last name\"\
    );\n4     return false;\n5   }\n6 }\n```\n\nLine 2 asks whether the length of\
    \ the value found in the field with the id `\"lastNameField\"` is 0. That is,\
    \ is nothing entered there? If so, an alert displays asking the user to enter\
    \ her name. And then in line 4 something else happens. The Boolean value false\
    \ is returned to the calling code. This prevents the form from being submitted.\
    \ In order for the submission to be called off, there has to be a matching keyword\
    \ return in the markup that calls the function. Without this return in the calling\
    \ code, the return in line 4 of the function won't stop the form from being submitted.\n\
    \n`<form onSubmit=\"return checkForLastName();\">`\n\nAs a user-friendly touch,\
    \ you can use the focus method to place the cursor in the field that needs to\
    \ be completed.\n\n```\n1 function checkForLastName() {\n2   if (document.getElementById(\"\
    lastNameField\").value.length === 0) {\n3     alert(\"Please enter your last name\"\
    );\n4     document.getElementById(\"lastNameField\").focus();\n5     return false;\n\
    6   }\n7 }\n```\n\nRepeating the `document.getElementId...` designation gets pretty\
    \ unwieldy, so let's put it into a variable.\n\n```\n1 function checkForLastName()\
    \ {\n2 var targetField = document.getElementById(\"lastNameField\");\n3   if (targetField.value.length\
    \ === 0) {\n4     alert(\"Please enter your last name\");\n5     targetField.focus();\n\
    6     return false;\n7   }\n8 }\n```\n\nLet's add one more feature. We'll direct\
    \ the user's attention to the field that needs to be completed by giving it a\
    \ yellow background color.\n\nThis requires two additional statements. If the\
    \ user hasn't completed the field, line 6 changes its background color to yellow.\
    \ After the user completes the field, line 9 restores the background color to\
    \ white when the function runs again on the user's subsequent submission.\n\n\
    ```\n1  function checkForLastName() {\n2   var targetField = document.getElementById(\"\
    lastNameField\");\n3   if (targetField.value.length === 0) {\n4     alert(\"Please\
    \ enter your last name\");\n5     targetField.focus();\n6     targetField.style.background\
    \ = \"yellow\";\n7     return false;\n8   }\n9   targetField.style.background\
