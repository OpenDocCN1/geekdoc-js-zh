    注释，正如你在处理 HTML 和 CSS 时所了解的，是一种告诉浏览器忽略代码正文中某些文本部分的方式。注释是为人类而非机器服务的。它们能帮助你和他人日后修改代码时理解其含义。你还可以使用注释来*注释掉*部分代码，以便进行测试和调试。由于与
    HTML 或 CSS 相比，JavaScript 在日后回顾时通常更难理解，你可能需要花更多精力为 JS 代码添加注释，尤其是在团队协作或未来可能由他人维护你的代码的情况下。


    在 HTML 中，只有一种方式将文本标记为注释：使用 `<!--` 开头，`-->` 结尾。在 CSS 中，也只有一种方式：使用 `/*` 开头，`*/`
    结尾。但在 JavaScript 中，有两种方式将文本标记为注释。


    第一种方式是标记单行注释，如下面第 1 行所示。


    ```

    1 // 这是一条注释，浏览器会忽略它


    2 for (var i = 0; i


    3   if (animals[i] === "bat") {


    4     animals[i] = "cat";


    5   }


    6 }

    ```


    两个斜杠表示：“从这到行尾的所有内容都是注释。”在上面的例子中，由于斜杠位于行首，因此整行都是注释。但你也可以写一行既有代码又有注释的内容，像这样：


    ```

    var animals = []; // 声明一个空数组

    ```


    你可以写任意多行注释。每一行都必须以两个斜杠开头。


    ```

    // 每一行注释都必须以一对


    // 斜杠开头，就像这样。（顺便提一下，大多数代码编辑器


    // 都能智能识别注释，并以不同颜色渲染，


    // 方便你轻松区分


    // 注释与代码。）

    ```


    当你使用斜杠注释时，没有结束标签，因为行尾会自动结束注释。


    为了可读性，请在两个斜杠与注释内容之间加一个空格。当你在同一行中混合代码与注释时，请在代码与两个斜杠之间加一个空格。


    当注释需要多行时，许多程序员更喜欢另一种方法。作为 CSS 用户，你已经熟悉这些标签了。


    ```

    /*


    当注释需要多行时，


    像这样的块注释，带有开始


    和结束标签，是更好的选择。


    */

    ```


    JavaScript 的多行注释标签与 CSS 注释标签相同。以 `/*` 开头，以 `*/` 结尾。


    本章的交互式编程练习请访问：


    [`www.ASmarterWayToLearn.com/js/44.html`](http://www.ASmarterWayToLearn.com/javascript/44.html)


    # 45


    ## 事件：链接


    一个好的网站是一个响应式的网站。用户执行某个操作——点击按钮、移动鼠标、按下按键——然后就会发生一些事情。JavaScript 提供了多种方式来响应用户的需求。举几个例子：


    用户点击一个写着“我们的承诺”的按钮，弹出一个提示框，详细说明承诺内容。


    页面显示一张模特的“之前”照片。当用户将鼠标悬停在照片上时，照片会替换为她的“之后”照片。


    用户在表单的“盎司”字段中输入一个数字。当她点击“克”字段时，会显示对应的克数。


    用户已在表单中输入了她的电子邮件地址，正准备输入评论。当她将光标从电子邮件字段移动到评论字段时，JavaScript 会检查电子邮件地址是否有效。在这个例子中，地址无效——她省略了地址末尾的“.com”。一条消息会显示，告知她输入了无效的电子邮件地址。


    在一个在线购物网站上，有一张黑色手表的图片。旁边有一个下拉列表，要求用户选择颜色。当她选择后，图片中手表的颜色会变为所选颜色。


    所有这些用户操作——点击按钮、移动鼠标、在表单字段间切换、选择不同选项——都被称为*事件*。响应事件的 JavaScript 代码（例如，当指针悬停时显示承诺或交换图像）被称为*事件处理程序*。


    在本章及接下来的几章中，你将学习最古老、最直接的事件处理方法——*内联*事件处理。当你编写生产代码时，这并不是处理事件的最佳方式，原因与内联 CSS 样式不是格式化
    HTML 元素的最佳方式相同。但由于这是最不抽象的方法，因此最容易学习，并且可以作为更高级方法的垫脚石。在本书后面，你将学习大多数专业人士更青睐的方法——*脚本化*方法。


    内联事件处理意味着你将 JavaScript 代码片段与 HTML 标记混合在一起。下面是一行代码，它显示一个链接，并在用户点击时显示一个提示框。


    `<a href="#" onClick="alert(''Hi'');">点击</a>`


    作为 HTML 编码者，你熟悉这段标记的开头和结尾：`<a href=` 和 `>点击</a>`


    但当用户点击这个链接时，它的行为与普通超链接不同。它不会将用户带到另一个页面或同一页面的命名锚点，而是显示一个写着“Hi”的提示框。


    当用户点击链接时，它不会跳转到任何地方，而是执行一条 JavaScript 语句，在本例中是调用一个函数。


    我们来分解一下。


    *   当用户点击链接时，你并不希望加载新网页，因此，在引号内放置一个 `#` 而不是 URL。这告诉浏览器重新加载当前页面。


    *   `onClick=` 表示：“当按钮被点击时，执行以下 JavaScript。”`onClick` 不区分大小写。你可以写成 `onclick`、`ONCLICK`
    或 `OnClIcK`，都能正常工作。但惯例是 `onClick`，所以我们沿用这个写法。


    *   后面跟着一个或多个 JavaScript 语句，用引号括起来。当用户点击链接时，这些语句会被执行。


    还有一点需要注意：`onClick="alert(''Hi'');"` 括号内的消息用单引号括起来，而不是我们之前用于提示字符串的双引号。在 JavaScript
    代码中，不允许在双引号内嵌套双引号，也不允许在单引号内嵌套单引号。由于整个 JavaScript 语句被双引号括起来，因此必须将提示消息用单引号括起来。


    但上面的标记存在一个问题。`<a href="#"` 告诉浏览器重新加载页面。这意味着如果用户已经滚动到链接位置，点击除了运行 JavaScript 代码外，还会将页面滚动回顶部——这通常不是你希望的操作。我之所以展示这种有缺陷的方法（使用
    `<a href="#"`），是因为你会在其他人的代码中偶尔遇到它，但你可能会更喜欢这种方法：


    `<a href="JavaScript:void(0)" onClick="alert(''Hi'');">点击</a>`


    现在你得到了你想要的：除了执行的 JavaScript 之外，什么都不会发生。


    在上面的例子中，点击只执行一条 JavaScript 语句。但引号内可以包含任意数量的 JavaScript 语句。当然，除了常识限制外，没有数量限制。正如你将看到的，有比将多条语句塞进一个内联
    `onClick` 事件更好的触发 JavaScript 的方法。但让我通过这个例子向你展示原理。当用户点击时，第一条语句将 `''hi''` 赋值给一个变量，第二条语句显示一个提示框，将变量指定为消息。


    `<a href="JavaScript:void(0)" onClick="var greet=''hi''; alert(greet);">点击</a>`


    正如我所说，专业编码人员不赞成使用内联 JavaScript。但如果你*确实*使用这种方法，更专业的方式是调用一个函数。


    下面是一个函数。


    ```

    1 function popup(message) {


    2   alert(message);


    3 }

    ```


    这是调用该函数的事件处理程序。


    `<a href="JavaScript:void(0)" onClick="popup(''Hi'');">点击</a>`


