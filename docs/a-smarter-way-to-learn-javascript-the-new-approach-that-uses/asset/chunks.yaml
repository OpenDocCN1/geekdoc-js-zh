    \n第 1 行将元素赋值给变量 `b1`。第 2 行监听该元素的点击事件。当点击发生时，它会调用函数 `sayHello`。\n\n需要注意的事项：\n\n\
    *   与内联事件处理中使用的驼峰式命名不同，事件名称必须全部小写，否则无法工作。是 `onclick` 而不是 `onClick`，`onfocus` 而不是\
    \ `onFocus`，`onsubmit` 而不是 `onSubmit`。\n*   与内联事件处理不同，等号后面的函数名不带引号。\n*   与内联事件处理不同，函数名后面没有括号。\n\
    \n如果你愿意，可以将其压缩成一条语句：\n\n```\ndocument.getElementById(\"button1\").onclick = sayHello;\n\
    ```\n\n"
- fmt: "\nThe function code is the same whether you use inline or scripted event-handling.\
    \ For example:\n\n```\nfunction sayHello() {\n  alert(\"Hi there.\");\n}\n```\n\
    \nThis code calls a function that swaps one image for another when the user mouses\
    \ over the original image.\n\n```\nvar targetImg = document.getElementById(\"\
    i12\");\ntargetImg.onmouseover = swapPic;\n```\n\nThis code calls a function that\
    \ validates an email address when a form is submitted.\n\n```\nvar emailFrm =\
    \ document.getElementById(\"form5\");\nemailFrm.onsubmit = valEmail;\n```\n\n\
    Find the interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/89.html](http://www.ASmarterWayToLearn.com/javascript/89.html)\n"
