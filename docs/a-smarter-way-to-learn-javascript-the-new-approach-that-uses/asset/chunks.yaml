    \n# 61\n\nThe DOM:\n\nJunk artifacts and nodeType\n\nIt's time to talk about the\
    \ junk artifacts of the DOM, the pesky things that I've been referring to in the\
    \ last three chapters. Let's revisit the simplified web page that we've been using\
    \ as an example.\n\n1st level: document\n\n2nd level:   `<html>`\n\n3rd level:\
    \     `<head>`\n\n4th level:       `<title>`\n\n5th level:         Simple document\n\
    \n                 `</title>`\n\n               `</head>`\n\n3rd level      `<body>`\n\
    \n4th level        `<div>`\n\n5th level          `<p>`\n\n6th level          \
    \  There's not much to this.\n\n                   `</p>`\n\n5th level       \
    \   `<p>`\n\n6th level            Nor to this.\n\n                   `</p>`\n\n\
    \                 `</div>`\n\n               `</body>`\n\n             `</html>`\n\
    \nThis is how I diagrammed the DOM for the page.\n\n![](images/00011.jpeg)\n\n\
    But this diagram is valid for only a couple of browsers. Most browsers interpret\
    \ the whitespace that's created by some carriage returns, tabs, and spaces *used\
    \ to format the code* as text nodes. When *you* look at the markup, you see 3\
    \ text nodes, the children of the title element and of the two paragraph elements.\n\
    \n1st level: document\n\n2nd level:   `<html>`\n\n3rd level:     `<head>`\n\n\
    4th level:       `<title>`\n\n5th level:         Simple document\n\n         \
    \        `</title>`\n\n               `</head>`\n\n3rd level      `<body>`\n\n\
    4th level        `<div>`\n\n5th level          `<p>`\n\n6th level            There's\
    \ not much to this.\n\n                   `</p>`\n\n5th level          `<p>`\n\
    \n6th level            Nor to this.\n\n                   `</p>`\n\n         \
    \        `</div>`\n\n               `</body>`\n\n             `</html>`\n\nFirefox\
    \ sees this markup with 8 additional text nodes that are nothing but whitespace\
    \ created by indenting.\n\n![](images/00013.jpeg)\n\nThese extra text nodes create\
    \ noise that makes it hard for your DOM-reading code to find the signal. In one\
    \ browser, the first child of the body node might be a div. In another browser,\
    \ the first child of the body might be an empty text node.\n\nThere are a number\
    \ of solutions. As one approach, the Mozilla Developer Network suggests a workaround\
    \ that's almost comically desperate but does solve the problem without any extra\
    \ effort from JavaScript. You format the markup like this.\n\n```\n<html\n  ><head\n\
    \    ><title\n      >Simple document\n    </title\n  ></head\n  ><body\n    ><div\n\
    \      ><p\n        >There's not much to this.\n      </p\n      ><p\n       >Nor\
    \ to this.\n      </p\n    ></div\n  ></body\n></html>\n```\n\nThis markup takes\
    \ advantage of the fact that any carriage returns, tabs, and spaces that are enclosed\
    \ in the `<` and the `>` of a tag are ignored by the browser. To the browser,\
    \ `<  p  >` is the same as `<p>`. And...\n\n`<   div   >`\n\n...is the same as\
    \ `<div>`.\n\nWhen whitespace is inside the brackets, the browser doesn't count\
    \ it as a text node. So if you \"hide\" all carriage returns, tabs, and spaces\
    \ inside the brackets as the code above does, there's no junk in the DOM. Any\
    \ noise that would keep your JavaScript from reading the signal is removed.\n\n\
    You can also clean out junk in the DOM by using a minifier program like the one\
    \ at [http://www.willpeavy.com/minifier/](http://www.willpeavy.com/minifier/).\
    \ You will, of course, want to preserve the original, non-minified version of\
    \ the file so you can revise the page in the future without going crazy.\n\n```\n\
    <html><head><title>Simple document</title></head><body><div><p>There's not much\
    \ to this.</p><p>Nor to this.</p></div></body></html>\n```\n\nAnother approach\
    \ is to format your HTML conventionally and let your JavaScript sniff out the\
    \ junk nodes. JavaScript can check a node to see what type it is—element, text,\
    \ comment, and so on. For example, this statement checks the node type of a targeted\
    \ node and assigns it to the variable `nType`.\n\n`var nType = targetNode.nodeType;`\n\
    \nIn the statement above, JavaScript assigns a number representing the node type\
    \ to the variable `nType`. If the node is an element like `<div>` or `<p>`, the\
    \ number is 1. If it's a text node, the number is 3.\n\nSuppose you want to replace\
    \ the text content of the second paragraph in a particular div with the string\
    \ \"All his men.\" Here's the markup, with the text we're going to change highlighted.\n\
    \n```\n<div id=\"humpty\">\n  <p>All the king's horses.</p>\n  <p>All the dude's\
    \ crew.</p>\n  <p>All the town's orthopedists.</p>\n</div>\n```\n\nThis is the\
    \ code.\n\n```\n1  var d = document.getElementById(\"humpty\");\n2  var pCounter\
    \ = 0;\n3  for (var i = 0; i < d.childNodes.length; i++) {\n4    if (d.childNodes[i].nodeType\
    \ === 1 ) {\n5      pCounter++;\n6    }\n7    if (pCounter === 2) {\n8      d.childNodes[i].innerHTML\
    \ = \"All his men.\";\n9      break;\n10   }\n11 }\n```\n\nHere's the breakdown:\n\
    \n1 Assigns the div to the variable `d`\n2 Counts the number of paragraphs\n3\
    \ Goes through the children of the div looking for the next element node, i.e.\
    \ Type 1, which we assume is a paragraph\n4-6 Adds 1 to the counter. We're looking\
    \ for the second paragraph.\n7-9 When the counter hits 2, we've reached the targeted\
    \ paragraph. Change the text\n\nOf course, if you know you might want your JavaScript\
    \ to change that second paragraph, it would be a lot easier to assign it an id,\
    \ and go straight to it, like this.\n\n`document.getElementById(\"p2\").innerHTML\
    \ = \"All his men.\";`\n\nYou can see why the `getElementId` method is more popular\
    \ with coders than tracing the DOM hierarchy. But there are some things you can't\
    \ do without working your way through the parent-child relationships of the DOM,\
    \ as you'll learn in subsequent chapters.\n\nFind the interactive coding exercises\
    \ for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/61.html](http://www.ASmarterWayToLearn.com/javascript/61.html)\n\
    \n# 62\n\nThe DOM:\n\nMore ways to target elements\n\nSo far you've learned to\
    \ use the DOM's parent-child hierarchy to target a child node of a parent node\
    \ by specifying its order in an array-like collection of children—`childNodes[0]`,\
    \ `childNodes[1]`, `childNodes[2]`, and so on. But there are other ways to use\
    \ the hierarchy for targeting. To begin with, instead of writing `childNodes[0]`,\
    \ you can write `firstChild`. And instead of writing, for example, `childNodes[9]`,\
    \ to target the 10th child in a 10-child collection of children, you can write\
    \ `lastChild`.\n\n`var targetNode = parentNode.childNodes[0];`\n\n...is the same\
    \ as...\n\n`var targetNode = parentNode.firstChild;`\n\nAnd if there are, for\
    \ example, 3 child nodes...\n\n`var targetNode = parentNode.childNodes[2];`\n\n\
    ...is the same as...\n\n`var targetNode = parentNode.lastChild;`\n\nYou can also\
    \ work backwards, targeting the parent node of any child node. Let's say you have\
    \ this markup. Using the DOM, how do you find the parent of the highlighted div?\n\
    \n```\n<div id=\"div1\">\n  <div id=\"div2\">\n    <p>Chicago</p>\n    <p>Kansas\
    \ City</p>\n    <p>St. Louis</p>\n  </div>\n</div>\n```\n\nYou want to know the\
    \ parent of the div with the id \"div2\". The following code assigns the parent\
    \ of the \"div2\" div to the variable `pNode`.\n\n```\n1 var kidNode = document.getElementById(\"\
    div2\");\n2 var pNode = kidNode.parentNode;\n```\n\nYou can use `nextSibling`\
    \ and `previousSibling` to target the next child and the previous child in the\
    \ collection of an element's children. In the following code, the first statement\
    \ targets a div with the id \"div1\". The second statement targets the next node\
    \ that has the same parent as the \"div1\" id.\n\n```\n1 var firstEl = document.getElementById(\"\
    div1\");\n2 secondEl = firstEl.nextSibling;\n```\n\nIf there is no `nextSibling`\
    \ or `previousSibling`, you get `null`. In the following code, the variable `nonexistentEl`\
    \ has a value of `null`, because JavaScript finds that there is no previous node\
    \ that has the same parent as `firstEl`.\n\n```\n1 var firstEl = document.getElementById(\"\
    div1\");\n2 var nonexistentEl = firstEl.previousSibling;\n```\n"
