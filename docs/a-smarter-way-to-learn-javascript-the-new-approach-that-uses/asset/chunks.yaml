    在上面的例子中，赋值语句紧跟在声明语句之后。但这两条语句之间可以插入任意数量的代码，只要声明语句在前即可。事实上，并没有规定说你*必须*为已声明的变量赋值。


    JavaScript 变量名对 JavaScript 本身没有内在含义。


    在英语中，单词是有含义的。你不能随意使用任何单词来交流。我可以说“My name is Mark”，但如果我想让别人理解，我就不能说“My floogle
    is Mark”。那是毫无意义的。


    但对于变量，JavaScript 对语义是盲目的。你*可以*使用任何单词（只要不违反变量命名规则）。从 JavaScript 的角度来看……


    ```javascript

    var floogle = "Mark";

    ```


    ……和下面的代码一样有效……


    ```javascript

    var name = "Mark";

    ```


    如果你编写……


    ```javascript

    var floogle = "Mark";

    ```


    ……然后让 JavaScript 打印 `floogle`，JavaScript 会打印……


    `Mark`


    在一定范围内，你可以随意命名变量，JavaScript 不会在意。


    ```javascript

    var lessonAuthor = "Mark";

    var guyWhoKeepsSayingHisOwnName = "Mark";

    var x = "Mark";

    ```


    尽管 JavaScript 对含义视而不见，但在变量命名时，你仍然希望赋予变量有意义的名称，因为这有助于你和其他的编码人员理解你的代码。


    再次强调，变量和文本字符串之间的语法区别在于：变量从不放在引号内，而文本字符串总是放在引号内。


    总是这样写……


    ```javascript

    var lastName = "Smith";

    var cityOfOrigin = "New Orleans";

    var aussieGreeting = "g''Day";

    ```


    如果是一个字母或单词，且没有放在引号内，也不是像 `alert` 这样对 JavaScript 有特殊含义的关键字，那么它就是变量。


    如果是一些放在引号内的字符，那么它就是*文本字符串*。


    如果你还没注意到，让我指出变量与等号之间、等号与值之间的空格。


    ```javascript

    var nickname = "Bub";

    ```


    这些空格是风格选择，而非语法要求。但我要求你在练习题的代码中都包含它们。


    在上一章中，你学会了编写……


    ```javascript

    alert("Thanks for your input!");

    ```


    当代码执行时，会显示一个消息框，内容为“Thanks for your input!”


    但如果你改为编写以下两条语句：


    ```javascript

    var thanx = "Thanks for your input!";

    alert(thanx);

    ```


    上面的代码没有将文本字符串直接放在 `alert` 语句的括号内，而是将文本字符串赋值给一个变量。然后将变量（而非字符串）放在括号内。由于 JavaScript
    总是用变量的值来替换变量，因此 JavaScript 显示的不是变量名 `thanx`，而是它所引用的文本“Thanks for your input!”。同样的提示框“Thanks
    for your input!”会显示出来。


    本章的交互式编码练习请访问：

    [`www.ASmarterWayToLearn.com/js/2.html`](http://www.ASmarterWayToLearn.com/javascript/2.html)


    ## 数字变量


    你可以赋给变量的不仅仅是字符串，还可以是数字。


    ```javascript

    var weight = 150;

    ```


    编写了上面的语句后，每当你在代码中写 `weight` 时，JavaScript 就知道你指的是 `150`。你可以在数学计算中使用这个变量。


    如果你让 JavaScript 将 25 加到 `weight` 上……


    `weight + 25`


    ……JavaScript 会记住 `weight` 指的是 `150`，并得出总和 `175`。


    与字符串不同，数字不放在引号内。这样 JavaScript 就知道它是一个可以进行数学运算的数字，而不是像邮政编码那样作为文本处理的字符串。


    但是，既然它没有放在引号内，JavaScript 怎么知道它不是变量呢？因为数字（或以数字开头的任何字符组合）不能用作变量名。如果是数字，JavaScript
    会将其排除在变量之外。所以它一定是数字。


    如果你将数字放在引号内，它就成了字符串。JavaScript 无法对其进行加法运算。它只能对没有放在引号内的数字进行加法运算。


    现在看这段代码。


    ```javascript

    var originalNum = 23;

    var newNum = originalNum + 7;

    ```


    在上面的第二条语句中，当 JavaScript 遇到变量 `originalNum` 时，它会用数字 `23` 替换。它将 `7` 加到 `23` 上，并将结果
    `30` 赋值给变量 `newNum`。


    JavaScript 也可以处理完全由变量组成的表达式。例如……


    ```javascript

    var originalNum = 23;

    var numToBeAdded = 7;

    var newNum = originalNum + numToBeAdded;

    ```


    变量可以用于计算自身的新值。


    ```javascript

    var originalNum = 90;

    originalNum = originalNum + 10;

    ```


    如果你将数字放在引号内，然后加上 7……


    ```javascript

    var originalNum = "23";

    var newNum = originalNum + 7;

    ```


    ……这不会起作用，因为 JavaScript 不能对字符串和数字求和。JavaScript 将 `"23"` 解释为一个单词，而不是数字。在第二条语句中，它不会将
    `23 + 7` 加起来得到 `30`。它会做一些可能让你惊讶的事情。我将在后续章节中告诉你。现在，你只需要知道放在引号内的数字不是数字，而是字符串，JavaScript
    无法对其进行加法运算。


    请注意，任何特定的变量名都可以是数字变量或字符串变量的名称。从 JavaScript 的角度来看，名称本身并不表示它是哪种变量。实际上，一个变量可以一开始是一种类型，然后变成另一种类型。


    你注意到下面代码中的新内容了吗？


    ```javascript

    var originalNumber = 23;

    var newNumber = originalNumber + 7;

    ```


    这条语句将*数学运算的结果*赋值给变量 `newNumber`。当然，这个运算的结果*是*一个数值。


    这个例子在数学表达式中混合使用了变量和字面量数字。但你也可以只使用数字或只使用变量。对 JavaScript 来说都一样。


    我已经告诉过你，变量名不能以数字开头。下面的语句……


    ```javascript

    var 1stPresident = "Washington";

    ```


    ……是非法的，因为变量名开头有 `"1"`。


    但是，你*可以*在变量名中包含数字，只要它们不在开头。下面的语句……


    ```javascript

    var prezWhoCame1st = "Washington";

    ```


    ……是合法的。


    方便的是，如果你在提示框中指定一个数字而不是字符串……


    ```javascript

    alert(144);

    ```


    ……或者指定一个代表数字的变量作为提示框消息……


    ```javascript

    var caseQty = 144;

    alert(caseQty);

    ```


    ……JavaScript 会自动将其转换为字符串并显示。


