    # 46


    事件：按钮


    在上一章中，你学会了如何重新利用链接，使其在被点击时触发事件，而不是加载新页面。你学会了使用*内联*事件处理，这不是最佳方式，但最容易学习。在本书后面，你将学习大多数专业人士更青睐的方法——*脚本*方法。


    但即使你使用内联方法，当你想给用户提供可点击的内容时，通常更专业的方法是使用按钮而不是链接。


    假设当用户点击按钮时，会弹出一个提示框，显示“Hello world!”。


    代码如下：


    ```

    <input type="button" value="Click" onClick="alert(''Hello world!'');">

    ```


    无论你编写的是链接还是按钮，事件处理程序都是一样的：`onClick="alert(''Hello world!'');"`


    但代码的开头不同：`<input type="button" value="Click"`


    一些专业人士可能会认为按钮代码应该包含在 *form* 标签中，但这并非绝对必要。而且，既然我们已经通过使用内联事件处理程序违反了最佳实践，为什么不通过多次违规来让专业人士震惊呢？（你将在本书后面学习到比内联事件处理程序更体面的替代方案。）


    作为 HTML 编码人员，你知道可以将图像用作热链接。标记看起来像这样：


    ```

    <a href="summary-page.html"><img src="button-sum-pg.png"></a>

    ```


    你也可以使用图像来触发事件。假设当用户点击图像时，会弹出一个提示框。代码如下。请注意，内联事件处理程序的代码与之前相同。


    ```

    <img src="button-greet.png" onClick="alert(''Hello world!'');">

    ```


    或者，如果你想更专业一些，可以让事件触发一个函数。


    ```

    <img src="button-greet.png" onClick="greetTheUser();">

    ```


