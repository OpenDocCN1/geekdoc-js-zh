    # 57


    Target some elements by tag name


    In the last chapter you learned how to make an array-like collection of all the
    elements in a document that have a particular tag name. For example, this statement
    makes a collection of all the paragraphs in the document and assigns the collection
    to the variable pars.


    var pars = document.getElementsByTagName("p");


    You also learned to read or set the properties of any of the elements in a collection
    of elements by using array-like notation—a number in square brackets. For example,
    this statement "reads" the contents of the second element in the collection pars
    and assigns the string to the variable textInMiddleParagraph.


    var textInMiddleParagraph = pars[1].innerHTML;


    But suppose you don''t want a collection of all the paragraphs in the document.
    Suppose you want just a collection of all the paragraphs within a particular div.
    No problem. Let''s say the id of the div is "rules". Here''s the code.


    1 var e = document.getElementByID("rules");


    2 var paragraphs = e.getElementsByTagName("p");


    Line 1 assigns the div with the id "rules" to the variable e.


    Line 2 makes a collection of all the paragraphs in the div and assigns the collection
    to the variable paragraphs.


    Once the id of the target div has been assigned to a variable, for example e,
    you can assemble a collection of all the paragraphs within that div. Instead of
    writing...


    document.getElementsByTagName("p");


    ...which would make a collection of all the paragraphs in the document, you write...


    e.getElementsByTagName("p");


    ...which makes a collection of all the paragraphs in the div.


    Suppose you have a table with a white background. When the user clicks a button,
    the cells turn pink. Here''s the code.


    1 var t = document.getElementById("table9");


    2 var cells = t.getElementsByTagName("td");


    3 for (var i = 0; i < cells.length; i++) {


    4   cells[i].style.backgroundColor = "pink";


    5 }


    Here''s the line-by-line breakdown.


    1.     Targets the table by its id


    2.     Assembles a collection of all the elements in the table with a td tag


    3-5\. Loops through all of them to change their background color


