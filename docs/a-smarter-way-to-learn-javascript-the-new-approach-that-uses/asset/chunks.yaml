  trans: "\n你已经知道如何执行第一步，创建一个表示当前日期和时间的 `Date` 对象：\n\n```javascript\nvar today = new\
    \ Date();\n```\n\n接下来，你创建第二个 `Date` 对象。但这次你指定了一个未来的日期，2035 年 6 月 30 日。\n\n```javascript\n\
    var doomsday = new Date(\"June 30, 2035\");\n```\n\n注意日期的指定方式。它被引号括起来。月份是拼写完整的。日期后面有一个逗号。年份用四位数字表示。\n\
    \n接着，你从两个日期中提取自参考日期（1970 年 1 月 1 日）以来经过的毫秒数。\n\n```javascript\nvar msToday = today.getTime();\n\
    var msDoomsday = doomsday.getTime();\n```\n\n你计算差值。\n\n```javascript\nvar msDiff\
    \ = msDoomsday - msToday;\n```\n\n一些简单的数学运算将毫秒转换为天数。\n\n```javascript\nvar dDiff\
    \ = msDiff / (1000 * 60 * 60 * 24);\n```\n\n括号内的数学运算产生的大数字将毫秒转换为秒（`1000`）、分钟（`60`）、小时（`60`）和天（`24`）。\n\
    \n你想要一个表示整天的数字，所以向下取整。下面的语句将天数（可能是一个浮点数）向下取整为整数。\n\n```javascript\ndDiff = Math.floor(dDiff);\n\
    ```\n\n以下是整个过程的浓缩版本，看起来更像生产代码：\n\n```javascript\nvar msDiff = new Date(\"June\
    \ 30, 2035\").getTime() - new Date().getTime();\nvar daysTillDoom = Math.floor(msDiff\
    \ / (1000 * 60 * 60 * 24));\n```\n\n第 1 行将当前时刻自参考日期以来的毫秒数从 2035 年 6 月 30 日自参考日期以来的毫秒数中减去。第\
    \ 2 行将毫秒转换为天数并向下取整。\n\n如果时间很重要，你也可以指定时间。\n\n```javascript\nvar d = new Date(\"\
    July 21, 1983 13:25:00\");\n```\n\n注意指定时间的形式：日期后面没有逗号。使用 24 小时制。小时、分钟和秒之间用冒号分隔。\n\
    \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/33.html`](http://www.ASmarterWayToLearn.com/javascript/33.html)\n\
    \n# 34 修改日期和时间的元素\n\n你可以修改 `Date` 对象的各个元素。以下是总结：\n\n![](img/00007.jpeg)\n\n`setFullYear`\
    \ 设置现有 `Date` 对象的年份，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\nd.setFullYear(2001);\n\
    ```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的年份改为 2001，保持 `Date` 对象的所有其他元素不变。\n\
    \n`setMonth` 设置现有 `Date` 对象的月份，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\n\
    d.setMonth(11);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的月份改为 11（十二月），保持\
    \ `Date` 对象的所有其他元素不变。\n\n`setDate` 设置现有 `Date` 对象的日期（月份中的第几天），而不改变其他任何元素。\n\n\
    ```javascript\nvar d = new Date();\nd.setDate(15);\n```\n\n第 1 行为当前时刻创建一个新的 `Date`\
    \ 对象。第 2 行将 `Date` 对象的日期改为该月的 15 日，保持 `Date` 对象的所有其他元素不变。\n\n`setHours` 设置现有 `Date`\
    \ 对象的小时数，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\nd.setHours(13);\n\
    ```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的小时数改为 13 时（下午 1 点），保持 `Date`\
    \ 对象的所有其他元素不变。\n\n`setMinutes` 设置现有 `Date` 对象的分钟数，而不改变其他任何元素。\n\n```javascript\n\
    var d = new Date();\nd.setMinutes(05);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2\
    \ 行将 `Date` 对象的分钟数改为整点后的 5 分钟，保持 `Date` 对象的所有其他元素不变。\n\n`setSeconds` 设置现有 `Date`\
    \ 对象的秒数，而不改变其他任何元素。\n\n```javascript\nvar d = new Date();\nd.setSeconds(55);\n\
    ```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date` 对象的秒数改为整分钟后的 55 秒，保持 `Date` 对象的所有其他元素不变。\n\
    \n`setMilliseconds` 设置现有 `Date` 对象的毫秒数，而不改变其他任何元素。\n\n```javascript\nvar d = new\
    \ Date();\nd.setMilliseconds(867);\n```\n\n第 1 行为当前时刻创建一个新的 `Date` 对象。第 2 行将 `Date`\
    \ 对象的毫秒数改为整秒后的 867 毫秒，保持 `Date` 对象的所有其他元素不变。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/34.html`](http://www.ASmarterWayToLearn.com/javascript/34.html)\n\
    \n# 35 函数\n\n函数是一段 JavaScript 代码块，每当调用它的名称时，它会机械地重复执行相同的操作。它节省了重复编码的工作，并使代码更易于理解。\n\
    \n假设在你的网站上，有几个页面需要显示一个警告框，告诉用户当前时间。（为了简单起见，我们使用 24 小时制，而不转换为上午和下午。）代码可能如下所示：\n\
    \n```javascript\nvar now = new Date();\nvar theHr = now.getHours();\nvar theMin\
    \ = now.getMinutes();\nalert(\"time: \" + theHr + \":\" + theMin);\n```\n\n你可以每次需要时重复编写这段代码。或者，你可以将其编写为一个函数，并给它命名，比如\
    \ `tellTime`。之后，只需以下代码即可执行整个代码块：\n\n`tellTime();`\n\n每当 JavaScript 看到这条简短语句时，时间显示代码块就会执行。\n\
    \n以下是将上述一次性代码打包为可重复使用函数的方式：\n\n```javascript\nfunction tellTime() {\n  var now\
    \ = new Date();\n  var theHr = now.getHours();\n  var theMin = now.getMinutes();\n\
    \  alert(\"Current time: \"+ theHr + \":\" + theMin);\n}\n```\n\n时间显示代码——创建 `Date`\
    \ 对象、提取时间、格式化并显示警告框的代码——与我们开始时完全一样，但现在被打包成一个函数。以下是各部分说明：\n\n1. 第 1 行是一个声明语句，包含：\n\
    \   - 关键字 `function`\n   - 我为函数起的名称\n   - 标识其为函数的括号\n   - 用于包裹将要执行的代码的左花括号\n2.\
    \ 第 2 到 5 行是你之前看到的相同代码块，但为了清晰进行了缩进。关于缩进多少，意见不一。我训练你缩进 2 个空格。\n3. 第 6 行是单独一行的右花括号，用于包裹将要执行的代码。\n\
    \n再次注意，调用代码——即调用函数的代码——只需写出函数名称及其括号即可。\n\n`tellTime();`\n\n你可以为函数指定任何合法的变量名，然后加上括号。函数命名遵循与变量命名相同的规则，因为从技术上讲，函数*就是*一个变量。当你后续章节了解更多关于函数的知识时，这一点会更有意义。\n\
    \n函数和调用它们的语句可能相隔数千行代码。通常，函数与主代码位于同一位置——在外部 JavaScript 文件中、HTML body 部分的末尾或 HTML\
    \ head 部分中。通常，所有函数应位于主代码之前，这样当主代码调用它们时，它们已经加载到内存中并准备就绪。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/35.html`](http://www.ASmarterWayToLearn.com/javascript/35.html)\n\
    \n# 36 函数：向它们传递数据\n\n函数是一段代码块，每当调用它的名称时，它会机械地执行某些操作。例如，当你编写 `greetUser();` 时，名为该名称的函数就会执行。需要明确的是：我这里讨论的函数是你自己编写并命名的函数。\n\
    \n假设当你编写 `greetUser();` 时，会调用一个函数，该函数显示一个警告框，内容为“Hello, there.”\n\n以下是该函数的代码：\n\
    \n```javascript\nfunction greetUser() {\n  alert(\"Hello, there.\");\n}\n```\n\
    \n"
- fmt: "\n# Functions: Passing Data to Functions\n\nOne of the really useful things\
    \ about functions is that those parentheses in the calling code don't have to\
    \ be empty. If you put some data inside the parentheses, you can pass that data\
    \ to the function that it'll use when it executes.\n\nSuppose, instead of writing\
    \ `greetUser();` you write...\n\n`greetUser(\"Hello, there.\");`\n\nNow, instead\
    \ of just calling the function, you're calling it and passing data to it. The\
    \ string inside the parentheses, i.e. the data you're passing, is called an `argument`.\n\
    \nThe function is now more versatile, because the message it displays is no longer\
    \ hard-wired into it. It'll display any message that you pass to it from the calling\
    \ code, via the argument.\n\nIn order for a function to become a programmable\
    \ robot rather than a one-job robot, you have to set it up to receive the data\
    \ you're passing. Here's how you do it.\n\n```javascript\nfunction greetUser(greeting)\
    \ {\n  alert(greeting);\n}\n```\n\nSo now we've filled the parentheses of both\
    \ the calling code and the function definition. The parentheses of the calling\
    \ code contain an argument. In the example, the argument is the string `\"Hello,\
    \ there.\"`. And, as you can see in the example above, the parentheses of the\
    \ function definition now contain a variable, `greeting`.\n\nA variable inside\
    \ the parentheses in a function statement is known as a `parameter`. The parameter\
    \ name is up to you. You can give it any name that would be legal for a variable.\
    \ Then you can use it to accomplish something in the body of the function. In\
    \ the example above, I used it to specify the message in an `alert`.\n\nYou don't\
    \ have to declare a variable when it's used as a parameter in a function definition.\
    \ When it's used as a parameter, the declaration is implicit.\n\nThe argument\
    \ in the statement that calls the function —`\"Hello, there.\"`— is the data that's\
    \ passed to the function. The parameter inside the parentheses in the function\
    \ definition catches the data that's passed. It now holds `\"Hello, there.\"`.\
    \ In other words, the string `\"Hello, there\"`, specified in the function call,\
    \ is assigned to `greeting` in the function. Then that variable, `greeting`, is\
    \ used to specify the message in the `alert` statement.\n\nThe value passed to\
    \ a function is used in the body of the function to accomplish something. In this\
    \ case, the value is used to specify the message in the `alert`.\n\nIn the example,\
    \ the argument is a string, but it could just as easily be a variable. In the\
    \ following code, I declare the variable `greeting` and assign it the value `\"\
    Hello, there.\"`. Then, rather than using the string itself as an argument in\
    \ the function call, I use the variable.\n\n```javascript\nvar greeting = \"Hello,\
    \ there.\";\ngreetUser(greeting);\n```\n\nIn the example above, the name of the\
    \ function `greetUser` shares some of its name with the parameter `greeting`,\
    \ but that's just to make the code easy to understand. The name of the function\
    \ and the name of the parameter don't have to have anything in common. And remember,\
    \ these names are up to you, as long as you follow the variable-naming rules.\n\
    \nIn the example, I named the argument in the calling code `greeting`, and also\
    \ named the parameter in the function code `greeting`. But this isn't necessary,\
    \ either. They don't have to match. No matter what an argument's name is, it is\
    \ accepted by the parameter, no matter what the parameter's name is. In the following\
    \ code, the variable `whatever` is the argument. The parameter `greeting` doesn't\
    \ match the name, but still catches the value.\n\nHere's the function, once again,\
    \ with the parameter `greeting`.\n\n```javascript\nfunction greetUser(greeting)\
    \ {\n  alert(greeting);\n}\n```\n\nAnd here's the statement that calls the function,\
    \ with the argument `whatever`.\n\n```javascript\nvar whatever = \"Hello, there.\"\
    ;\ngreetUser(whatever);\n```\n\nIt's okay that the name of the argument and the\
    \ name of the parameter don't match. The parameter still catches the argument,\
    \ the string `\"Hello, there.\"`. Still, it often makes sense to give an argument\
    \ and a parameter the same name, for clarity.\n\nA number, either a literal number\
    \ or a number represented by a variable, can be an argument. In the following\
    \ code I declare the variable `almostAMil` and assign the number `999999` to it.\
    \ Then I use `almostAMil` as the argument in the function call.\n\n```javascript\n\
    var almostAMil = 999999;\nshowBigNum(almostAMil);\n```\n\nAlternatively, if I\
    \ wanted to, I could use the literal number `999999` as the argument.\n\n`showBigNum(999999);`\n\
    \nYou can pass any number of arguments, separated by commas, to a function. Typically,\
    \ the function has the same number of parameters, also separated by commas. (There\
    \ are rare exceptions for special cases.) Again, when you use variables as arguments,\
    \ their names don't have to match the names of the parameters. JavaScript matches\
    \ up arguments and parameters according to their order, not their names. The first\
    \ argument in the list is passed to the first parameter in the list, the second\
    \ argument is passed to the second parameter, and so on.\n\nAs arguments, you\
    \ can use any combination of variables, strings, and literal numbers. In the following\
    \ example, the calling code passes a variable, a string, and a number to the function.\
    \ Three parameters catch the values. The function concatenates them to create\
    \ an alert message.\n\nFirst, here's the function.\n\n```javascript\nfunction\
    \ showMessage(m, string, num) {\n  alert(m + string + num);\n}\n```\n\nNow here's\
    \ the statement that calls the function.\n\n```javascript\nvar month = \"March\"\
    ;\nshowMessage(month, \"'s winner number is \", 23);\n```\n\nThe argument `month`\
    \ (a variable) is passed to the parameter `m`. The argument `\"'s winning number\
    \ is \"` (a string) is passed to the parameter `string`. The argument `23` (a\
    \ literal number) is passed to the parameter `num`.\n\nWhen the code executes,\
    \ an alert displays saying, \"March's winning number is 23.\"\n\nNormally, you'd\
    \ use all the parameters included in the function definition as variables in the\
    \ code that executes, because, why else would you want them in the function definition?\
    \ But there's nothing that says you must use them all. And you certainly don't\
    \ have to use them in the same order in which they appear within the parentheses.\
    \ Each one is a full-fledged variable that, within the function, you can use the\
    \ way you'd use any variable.\n\nFind the interactive coding exercises for this\
    \ chapter at: [http://www.ASmarterWayToLearn.com/js/36.html](http://www.ASmarterWayToLearn.com/javascript/36.html)\n\
    \n## 37 Functions: Passing data back from them\n\nAs you learned in the last chapter,\
    \ a function becomes more versatile when you pass data to it so it can deliver\
    \ a custom job. But a function can do even more. It can pass data back to the\
    \ calling code.\n\nLet's say you charge a minimum shipping rate of $5, plus 3\
    \ percent of the merchandise total above $50, up to $100. You offer free shipping\
    \ when the total hits $100. Here's the code that calculates the order total.\n\
    \n```javascript\nvar orderTot;\nif (merchTot >= 100) {\n  orderTot = merchTot;\n\
    }\nelse if (merchTot < 50.01) {\n  orderTot = merchTot + 5;\n}\nelse {\n  orderTot\
    \ = merchTot + 5 + (.03 * (merchTot - 50));\n}\n```\n\nIf the merchandise total\
    \ is at least $100, the order total is the same as the merchandise total. If the\
    \ merchandise total is $50 or less, the order total is the merchandise total plus\
    \ $5. If the order total is between $50 and $100, the order total is the merchandise\
    \ total plus $5 plus 3 percent of the amount over $50.\n\n- Something costing\
    \ $150 is $150 total.\n- Something costing $15 is $20 total.\n- Something costing\
    \ $70 is $75.60 total.\n\nHere's how we turn the code above into a function.\n\
    \n```javascript\nfunction calcTot(merchTot) {\n  var orderTot;\n  if (merchTot\
    \ >= 100) {\n    orderTot = merchTot;\n  }\n  else if (merchTot < 50.01) {\n \
    \   orderTot = merchTot + 5;\n  }\n  else {\n    orderTot = merchTot + 5 + (.03\
    \ * (merchTot - 50));\n  }\n  return orderTot;\n}\n```\n"
