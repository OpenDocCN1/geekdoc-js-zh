    looking for, as I also showed you in the last chapter.


    Once again, I''ll say that you''re often better off assigning an id to any node
    you might want to "read" or change. Then you can target the node more directly,
    using document.getElementById.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/62.html](http://www.ASmarterWayToLearn.com/javascript/62.html)


    # 63


    The DOM:


    Getting a target''s name


    In a previous chapter you learned how to get a node''s node type with a statement
    like this.


    var nType = targetNode.nodeType;


    In the example above, if the node is an element, the variable nType will be assigned
    the number 1\. If the node is text, it''ll be assigned the number 3.


    You can get additional information about a node by using nodeName. In the following
    example, the node name of the target node is assigned to the variable nName.


    1 var parent = document.getElementById("div1");


    2 var target = parent.firstChild;


    3 nName = target.nodeName;


    Lines 1 and 2 target the first child of an element with the id "div1". Line 3
    assigns the node name of the target to the variable nName.


    In the example above, if the node is an element, the variable nName will be assigned
    a string, like P or DIV, that corresponds to the characters of the tag that are
    enclosed in the brackets. In HTML, the name is usually given in all-caps, even
    if the markup is in lowercase.


    | **Tag** | **Node Name** |


    | --- | --- |


    | <p> *or* <P> | P |


    | <div> *or* <DIV> | DIV |


    | <span> *or* <SPAN> | SPAN |


    | <img> *or* <IMG> | IMG |


    | <a> *or* <A> | A |


    | <em> *or* <EM> | EM |


    | <table> *or* <TABLE> | TABLE |


    | <li> *or* <LI> | LI |


    On the other hand, if the node is a text node, the name of the node is always
    #text—in lower-case.


    If it''s a text node, you can find out its value—i.e. its content—this way.


    1 var parent = document.getElementById("div1");


    2 var target = parent.firstChild;


    3 var nTextContent = target.nodeValue;


    Lines 1 and 2 target the first child of an element with the id "div1". Line 3
    assigns the node value to the variable nTextContent.


    So if this is the markup, with the first child of the H2 element a node with the
    name "#text"...


    <h2>Do <em>not</em> hit!</h2>


    ...the node value is "Do ".


    An element node like P or IMG has a name but no value. If you try to assign an
    element node value to a variable, the variable will be assigned null.


    <h2>Do <em>not</em> hit!</h2>


    In the above example, <em> is an element, which means its value is null.


    It''s possible to confuse the node value of a text node with the innerHTML property.
    There are two differences.


    *   innerHTML is a property of the element node, <h2>, in the above example. The
    node value is a property of the text node itself, not the parent element.


    *   innerHTML includes *all* the descendants of the element, including any inner
    element nodes like <em> as well as text nodes. The node value includes only the
    characters that comprise the single text node.


    In the following code, the innerHTML of the H2 element is highlighted.


    <h2>Do <em>not</em> hit!</h2>


    In the following code, the node value of the first child of the H2 element is
    highlighted.


    <h2>Do <em>not</em> hit!</h2>


    Since there are situations in which nodeName gets you, for example, a "p" instead
    of a "P" or an "href" instead of an "HREF," it''s good practice to standardize
    the case when you''re testing for names, like this.


    if (targetNode.nodeName.toLowerCase === "img") {


    If the node name was originally upper-case, the code changes it to lower-case.
    If it was lower-case to begin with, no harm done.


    If you''re checking a node name to see if a node is a text node, converting to
    lower-case isn''t necessary, because the name of a text node is always "#text",
    never "#TEXT".


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/63.html](http://www.ASmarterWayToLearn.com/javascript/63.html)


    # 64


    The DOM:


    Counting elements


    In an earlier chapter you learned how to make an array-like collection of all
    the elements that share a particular tag name. For example, the following code
    makes a collection of all the <li> elements and assigns the collection to the
    variable liElements.


    var liElements = getElementsByTagName("li");


    Once you have the collection of elements, you can find out how many of them there
    are. In the following code, the number of <li> elements in the collection represented
    by liElements is assigned to the variable howManyLi.


    var howManyLi = liElements.length;


    Then you can, for example, cycle through the collection looking for <li> elements
    that have no text, and can enter some placeholder text.


    1 for (var i = 0; i < howManyLi; i++) {


    2   if (liElements[i].innerHTML === "") {


    3     liElements[i].innerHTML = "coming soon";


    4   }


    5 }


    I''ve walked you through this to introduce you to an analagous move you can make
    using the DOM hierarchy rather than tag names. You can make a collection of all
    the child nodes of a targeted node.


    1 var parentNode = document.getElementById("d1");


    2 var nodeList = parentNode.childNodes;


    Line 1 assigns an element with the id "d1" to the variable parentNode. Line 2
    assigns a collection of the child nodes of parentNode to nodeList.


    You can get the number of items in the collection. The following statement assigns
    the number of items in the node collection to the variable howManyKids.


    var howManyKids = nodeList.length;


    Then you can target any item in the collection. The following code counts the
    number of images within the div.


    1 var numberPics = 0;


    2 for (var i = 0; i < howManyKids; i++) {


    3   if (nodelist[i].nodeName.toLowerCase() === "img") {


    4     numberPics++;


    5   }


    6 }


    Here''s the breakdown:


    1 Declares the image-counter and sets it at 0


    2 Loops through all the children of the div


    3-5 If the node name, converted to lower-case, is "img", increments the image-counter


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/64.html](http://www.ASmarterWayToLearn.com/javascript/64.html)


    # 65


    The DOM:


    Attributes


    Take a look at this bit of markup.


    <a href="http://www.amazon.com">Shop</a>


    You''ve learned that in the above markup the text node "Shop" is the first (and
    only) child of the element node <a>. But what is href="http://www.amazon.com"?
    It''s definitely a node of the DOM, and you could say that it''s subsidiary to
    <a>. But it''s not a child of <a>. It''s an *attribute* of <a>.


    Whenever you see this form...


    <*element something*="*something in quotes*">


    ...you''re looking at an element with an attribute. The equal sign and the quotes
    are the tipoff. The word on the left side of the equal sign is the attribute *name*.
    The word on the right side of the equal sign is the attribute *value*.


    Here are more examples. The attribute values are highlighted.


    <div id="p1">


    <p class="special">


    <img src="images/slow-loris.png">


    <span style="font-size:24px;">


    An element can have any number of attributes. In this tag, the element img has
    4 attributes. I''ve highlighted their values.


    <img src="dan.gif" alt="Dan" height="42" width="42">


    You can find out whether an element has a particular attribute with hasAttribute.'
