    [http://www.ASmarterWayToLearn.com/js/52.html](http://www.ASmarterWayToLearn.com/javascript/52.html)


    # 53


    Swapping images


    In Chapter 47 you learned how to replace one image with another when the user
    mouses over the image. When the page first displays, a "before" picture is what
    the user sees. When the user mouses over the picture, it is replaced by an "after"
    picture.


    You learned how to do this by coding an inline event handler that looks like this.


    <img src="before-pic.jpg" onMouseover="src=''after-pic.jpg''">


    Another way to do it is to call a function that makes the swap. This is the markup:


    <img src="before-pic.jpg" id="before" onMouseover="swapPic();">


    This is the function code.


    1 function swapPic() {


    2   document.getElementById("before").src = "after-pic.jpg";


    3 }


    But why not make the function a general-purpose routine that can swap any image
    for any other image? In order for this to work, the markup has to pass both the
    id and the name of the replacement image to the function as arguments.


    <img src="before-pic.jpg" id="before" onMouseover="swapPic(id,''after-pic.jpg'');">


    The function accepts these arguments as its parameters and uses them to swap the
    images.


    1 function swapPic(eId, newPic) {


    2   document.getElementById(eId).src = newPic;


    3 }


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/53.html](http://www.ASmarterWayToLearn.com/javascript/53.html)


    # 54


    Swapping images and setting classes


    You''ve been learning how to read the properties of HTML elements, and also how
    to change those properties using various statements that incorporate the magic
    words document.getElementById.... For example, the following function removes
    the original image, with the id of "before," and replaces it with a second image,
    "after-pic.jpg."


    1 function swapPic() {


    2   document.getElementById("before").src = "after-pic.jpg";


    3 }


    A more common way to code the function is to break it into two steps, first assigning
    document.getElementById("before") to a variable. Then you combine that variable
    with .src. Let''s call it the verbose approach.


    1 function swapPic() {


    2   var pic = document.getElementById("before");


    3   pic.src = "after-pic.jpg";


    4 }


    Here''s a function that uses the more verbose approach to find out the address
    of a link that has the id "link1".


    1 function getAddress() {


    2   var link = document.getElementById("link1");


    3   var address = link.href;


    4 }


    The function probes the href property of the link tag. For example, if href equals
    "http://wikipedia.org" that address winds up in the variable address.


    This function changes the formatting of a form that has the id "f12" by changing
    its class.


    1 function enlargeForm() {


    2   var frm = document.getElementById("link1);


    3   frm.className = "jumbo";


    4 }


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/54.html](http://www.ASmarterWayToLearn.com/javascript/54.html)


    # 55


    Setting styles


    In Chapter 52 you learned how to add a css class to any element to change its
    styling. For example, this function adds the class "big" to an element. If, for
    example, the new class, "big," specifies a larger font size for the element than
    it has originally, the result is that the text inside the element gets bigger.


    1 function makeBig() {


    2   document.getElementById("p1").className += " big";


    3 }


    There''s another way to specify style properties.


    1 function makeBig() {


    2   document.getElementById("p1").style.fontSize = "2em";


    3 }


    Like the first example, the function changes the default font size of an element
    with the id "p1". But, unlike the first example, it doesn''t remove any other
    styles assigned to the element, whether those styles are specified in css or inline.


    Example: If the heading, paragraph, or div has an initial size of 1em, the function
    doubles the size of its contents. If the element has an initial style of bold
    Georgia italic with 12-pixel borders, all of this formatting is preserved. Only
    the size changes.


    This statement left-floats an image.


    document.getElementById("pic99").style.cssFloat = "left";


    This statement makes an element invisible.


    document.getElementById("div9").style.visibility = "hidden";


    This statement gives an element left and right margins of 10 pix.


    document.getElementById("mainPic").style.margin = "0 10px 0 10px;";


    You can set many style properties this way. Sometimes the terms for property specs
    aren''t obvious, so it''s best to check the language rules—is it "float" or "cssFloat"?—rather
    than guessing.


    As usual, you can read properties as well as set them. However, the rules aren''t
    straightforward. If you write...


    var m = document.getElementById("mainPic").style.margin;


    ...it''ll tell you only the margins specified inline, if any. If margins are specified
    in css, you won''t get them. The following statement gives you all the style properties,
    specified in both css and inline, but it has a limitation. Versions of Internet
    Explorer before Version 9 don''t support it.


    var m = document.getComputedStyle("mainPic").margin;


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/55.html](http://www.ASmarterWayToLearn.com/javascript/55.html)


    # 56


    Target all elements by tag name


    Suppose you want to give your users the option of doubling the size of the text
    in all the paragraphs of the document. To accomplish this, you could give each
    paragraph an id. When the user clicks the **Double Text Size** button, a function
    would cycle through all the paragraph ids and make the change. The function could
    upsize the font either by assigning a new class to each paragraph, with the class
    specifying a larger font size, or it could assign the new style property directly,
    like this:


    getElementById(*the id)*.style.fontSize = "2em";


    An easier way to accomplish the same thing is to have the function say, "Find
    all the paragraphs in the document and increase their size."


    This statement finds all the paragraphs and assigns them to a variable:


    var par = document.getElementsByTagName("p");'
