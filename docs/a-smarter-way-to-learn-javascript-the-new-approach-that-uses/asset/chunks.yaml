    If no match is found, we need to display an alert saying so. But how do we do
    that?


    We do it with a *flag*. A flag is just a variable that starts out with a default
    value that you give it, and then is switched to a different value under certain
    conditions. In our example, let''s say this is the flag.


    var matchFound = "no";


    If a match is found, the value of the flag is changed. At the end, if the flag
    *hasn''t* been changed—if it still has the original value of "no"—it means no
    match was found, and so we display an alert saying the city isn''t on the list.


    1  var matchFound = "no";


    2  for (var i = 0; i <= 4; i++);


    3    if (cityToCheck === cleanestCities[i]) {


    4      matchFound = "yes";


    5      alert("It''s one of the cleanest cities");


    6    }


    7  }


    8  if (matchFound === "no") {


    9    alert("It''s not on the list");


    10 }


    This works, but rather than assigning the strings "no" and "yes" to the switch,
    it''s conventional to use the *Boolean* values false and true.


    1  var matchFound = false;


    2  for (var i = 0; i <= 4; i++);


    3    if (cityToCheck === cleanestCities[i]) {


    4      matchFound = true;


    5      alert("It''s one of the cleanest cities");


    6    }


    7  }


