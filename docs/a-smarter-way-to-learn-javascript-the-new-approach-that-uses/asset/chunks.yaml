    \n5. Sing \"97 bottles of beer on the wall, 97 bottles of beer.\"\n6. Sing \"\
    Take one down and pass it around, 96 bottles of beer on the wall.\"\n\n...and\
    \ so on, for 192 more lines of instructions.\n\nBut that isn't how you'd give\
    \ the instructions, is it? You'd be more concise. You'd say something like this:\n\
    \nSing \"99 bottles of beer on the wall, 99 bottles of beer. Take one down and\
    \ pass it around, 98 bottles of beer on the wall.\" Repeat this, subtracting 1\
    \ each time, until there are no more bottles of beer on the wall.\n\n## Introduction\
    \ to Loops\n\nIn coding, you run into the bottles-of-beer situation quite often.\
    \ For example, suppose you've offered to check if the user's city is one of the\
    \ 5 cleanest in the U.S. The user has entered her city, and you've assigned her\
    \ city to the variable `cityToCheck`.\n\nYou've already assigned the list of the\
    \ 5 cleanest cities to the array `cleanestCities`.\n\n```javascript\nvar cleanestCities\
    \ = [\"Cheyenne\", \"Santa Fe\", \"Tucson\", \"Great Falls\", \"Honolulu\"];\n\
    ```\n\nNow you go through the array to see if there's a match with the user's\
    \ city. If there is, you display an `alert` telling the user her city is one of\
    \ the cleanest. If there's no match, you display an `alert` telling the user her\
    \ city isn't on the list.\n\n```javascript\nif (cityToCheck === cleanestCities[0])\
    \ {\n    alert(\"It's one of the cleanest cities\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[1]) {\n    alert(\"It's one of the cleanest cities\");\n\
    }\nelse if (cityToCheck === cleanestCities[2]) {\n    alert(\"It's one of the\
    \ cleanest cities\");\n}\nelse if (cityToCheck === cleanestCities[3]) {\n    alert(\"\
    It's one of the cleanest cities\");\n}\nelse if (cityToCheck === cleanestCities[4])\
    \ {\n    alert(\"It's one of the cleanest cities\");\n}\nelse {\n    alert(\"\
    It's not on the list\");\n}\n```\n\nConveniently, JavaScript provides a more concise\
    \ coding approach. Here's a `for` loop that accomplishes most of what the verbose\
    \ code in the example above accomplishes.\n\n```javascript\nfor (var i = 0; i\
    \ <= 4; i++) {\n   if (cityToCheck === cleanestCities[i]) {\n     alert(\"It's\
    \ one of the cleanest cities\");\n   }\n}\n```\n\n### Breaking Down the `for`\
    \ Loop\n\nThe first line begins with the keyword `for`. The three specifications\
    \ that define the loop are inside the parentheses:\n\n1. A variable that counts\
    \ iterations and also serves as the changing array index is declared and set to\
    \ a starting value, in this case `0`.\n2. The limit on the loop is defined. In\
    \ this case, the loop is to keep running as long as the counter doesn't exceed\
    \ `4`. Since the counter, in this case, is starting at `0`, the loop will run\
    \ 5 times.\n3. What happens to the counter at the end of every loop. In this case,\
    \ the counter is incremented each time.\n\nThe three specifications inside the\
    \ parentheses are always in the same order:\n1. What to call the counter (usually\
    \ `i`) and what number to start it at (typically `0`)\n2. How many loops to run\
    \ (in this case, the number of elements in the array)\n3. How to change the counter\
    \ after each iteration (typically to add 1 each time through)\n\n### Things to\
    \ Keep in Mind\n\n* In the example, the counter `i` serves two purposes. It keeps\
    \ track of the number of iterations so looping can halt at the right point, and\
    \ it serves as the index number of the array, allowing the code to progress through\
    \ all the elements of the array as the counter increments with each iteration.\n\
    * There is nothing sacred about using `i` as the counter. You can use any legal\
    \ variable name. But coders usually use `i` because it keeps the first line compact,\
    \ and because coders understand that `i` stands for \"iteration.\"\n* In the example,\
    \ the initial count is `0`, the index number of the first element of the array.\
    \ But it could be any number, depending on your needs.\n* In the example, the\
    \ counter increments with each iteration. But, depending on your needs, you can\
    \ decrement it, increase it by 2, or change it in some other way each time through.\n\
    * In the example, I specify that the loop is to run as long as `i <= 4`. Alternatively,\
    \ I could have specified `i < 5`. Either way, since the counter starts at `0`,\
    \ the loop runs 5 times.\n\nFind the interactive coding exercises for this chapter\
    \ at: [http://www.ASmarterWayToLearn.com/js/18.html](http://www.ASmarterWayToLearn.com/javascript/18.html)\n\
    \n## 19. `for` Loops: Flags, Booleans, Array Length, and Loopus Interruptus\n\n\
    There are several problems with the `for` loop example I gave you in the last\
    \ chapter. The first problem is a potential communication problem. If a match\
    \ between the user's city and the list of cleanest cities is found, a confirming\
    \ `alert` displays. But if there is no match, nothing happens. The user is left\
    \ in the dark. If no match is found, we need to display an `alert` saying so.\n\
    \n### Using Flags and Booleans\n\nWe do it with a `flag`. A flag is just a variable\
    \ that starts out with a default value that you give it, and then is switched\
    \ to a different value under certain conditions. In our example, let's say this\
    \ is the flag:\n\n```javascript\nvar matchFound = \"no\";\n```\n\nIf a match is\
    \ found, the value of the flag is changed. At the end, if the flag hasn't been\
    \ changed—if it still has the original value of `\"no\"`—it means no match was\
    \ found, and so we display an `alert` saying the city isn't on the list.\n\n```javascript\n\
    var matchFound = \"no\";\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck\
    \ === cleanestCities[i]) {\n        matchFound = \"yes\";\n        alert(\"It's\
    \ one of the cleanest cities\");\n    }\n}\nif (matchFound === \"no\") {\n   \
    \ alert(\"It's not on the list\");\n}\n```\n\nThis works, but rather than assigning\
    \ the strings `\"no\"` and `\"yes\"` to the switch, it's conventional to use the\
    \ `Boolean` values `false` and `true`.\n\n```javascript\nvar matchFound = false;\n\
    for (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i]) {\n\
    \        matchFound = true;\n        alert(\"It's one of the cleanest cities\"\
    );\n    }\n}\nif (matchFound === false) {\n    alert(\"It's not on the list\"\
    );\n}\n```\n\nThere are only two Booleans, `true` and `false`. Note that they\
    \ aren't enclosed in quotes.\n\n### Optimizing with `break`\n\nThe next problem\
    \ with our example is that it potentially wastes computing cycles. Suppose on\
    \ the second loop a match is found and the `alert` displays. The way the loop\
    \ is coded, the loop goes on looping all the way to the end. This is unnecessary,\
    \ since we got our answer in the second loop. The problem is solved with the keyword\
    \ `break`.\n\n```javascript\nvar matchFound = false;\nfor (var i = 0; i <= 4;\
    \ i++) {\n    if (cityToCheck === cleanestCities[i]) {\n        matchFound = true;\n\
    \        alert(\"It's one of the cleanest cities\");\n        break;\n    }\n\
    }\nif (matchFound === false) {\n    alert(\"It's not on the list\");\n}\n```\n\
    \n### Dynamic Array Length\n\nThe last problem: In the example, I assume that\
    \ the number of elements in the array is known. But what if it isn't? JavaScript\
    \ has a way of finding out. The following code assigns the number of elements\
    \ in the array `cleanestCities` to the variable `numElements`.\n\n```javascript\n\
    var numElements = cleanestCities.length;\n```\n\nNow we can limit the number of\
    \ loops to the count that JavaScript comes up with.\n\n```javascript\nvar numElements\
    \ = cleanestCities.length;\nvar matchFound = false;\nfor (var i = 0; i < numElements;\
    \ i++) {\n    if (cityToCheck === cleanestCities[i]) {\n        matchFound = true;\n\
    \        alert(\"It's one of the cleanest cities\");\n        break;\n    }\n\
    }\nif (matchFound === false) {\n    alert(\"It's not on the list\");\n}\n```\n\
    \nNow the loop keeps going as long as `i` is less than the number of elements.\
    \ (Since the length number is 1-based and the `i` number is 0-based, we need to\
    \ stop 1 short of the length.)\n\nFind the interactive coding exercises for this\
    \ chapter at: [http://www.ASmarterWayToLearn.com/js/19.html](http://www.ASmarterWayToLearn.com/javascript/19.html)\n\
    \n## 20. Nested `for` Loops\n\nAtlantic Records has hired you and me to generate\
    \ a list of names for future rap stars. To make things easy, we'll start by making\
    \ separate lists of some first names and last names.\n"
