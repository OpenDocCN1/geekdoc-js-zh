    1  var numElements = cleanestCities.length;


    2  var matchFound = false;


    3  for (var i = 0; i < numElements; i++);


    4    if (cityToCheck === cleanestCities[i]) {


    5      matchFound = true;


    6      alert("It''s one of the cleanest cities");


