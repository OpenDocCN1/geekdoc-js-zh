    ## 24 字符串：查找特定位置的字符


    用户输入了他的名字。该字符串已被赋给变量`firstName`。你想要提取第一个字符。你已经知道一种方法。


    `var firstChar = firstName.slice(0, 1);`


    这里有一种更直接的方法。


    `var firstChar = firstName.charAt(0)`


    上面的代码找到由变量`firstName`表示的字符串中索引 0（开头）处的单个字符，并将其赋给变量`firstChar`。


    以下代码找到字符串中的最后一个字符。


    `var lastChar = name.charAt(name.length - 1);`


    以下代码循环遍历字符串，查找感叹号。如果找到该字符，则显示一个警告。


    ```javascript

    1 for (var i = 0; i < text.length; i++) {

    2   if (text.charAt(i) === "!") {

    3     alert("Exclamation point found!");

    4     break;

    5   }

    6 }

    ```


    注意：`indexOf`方法只能识别特定位置的字符。它不能更改某个位置的字符。


