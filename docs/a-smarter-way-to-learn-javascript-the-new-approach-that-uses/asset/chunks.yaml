    \n# 9 Prompts\n\nA *prompt box* asks the user for some information and provides\
    \ a response field for her answer.\n\nThis code asks the user the question \"\
    Your species?\" and provides a default answer in the response field, \"human\"\
    . She can change the response. Whether she leaves the default response as-is or\
    \ changes it to something else, her response is assigned to the variable.\n\n\
    ```javascript\nvar spec = prompt(\"Your species?\", \"human\");\n```\n\nPrompt\
    \ code is like `alert()` code, with two differences.\n\n* In a prompt, you need\
    \ a way to capture the user's response. That means you need to start by declaring\
    \ a variable, followed by an equal sign.\n* In a prompt, you can specify a second\
    \ string. This is the default response that appears in the field when the prompt\
    \ displays. If the user leaves the default response as-is and just clicks `OK`,\
    \ the default response is assigned to the variable. It's up to you whether you\
    \ include a default response.\n\nAs you might expect, you can assign the strings\
    \ to variables, then specify the variables instead of strings inside the parentheses.\n\
    \n```javascript\nvar question = \"Your species?\";\nvar defaultAnswer = \"human\"\
    ;\nvar spec = prompt(question, defaultAnswer);\n```\n\nThe user's response is\
    \ a text string. Even if the response is a number, it comes back as a string.\
    \ For example, consider this code.\n\n```javascript\nvar numberOfCats = prompt(\"\
    How many cats?\");\nvar tooManyCats = numberOfCats + 1;\n```\n\nSince you're asking\
    \ for a number, and the user is presumably entering one, you might expect the\
    \ math in the second statement to work. For example, if the user enters 3, the\
    \ variable `tooManyCats` should have a value of 4, you might think. But no such\
    \ luck. All responses to prompts come back as strings. When the string `\"3\"\
    ` is linked with a plus to the number `1`, JavaScript converts the `1` to a string\
    \ and concatenates. So the value of `tooManyCats` winds up being not 4 but `\"\
    31\"`. You'll learn how to solve this problem in a subsequent chaper.\n\nIf the\
    \ user enters nothing and clicks `OK`, the variable is assigned an empty string:\
    \ `\"\"`\n\nIf the user clicks `Cancel`, the variable is assigned a special value,\
    \ `null`.\n\n![](images/00001.jpeg)\n\n* Some coders write `window.prompt` instead\
    \ of, simply, `prompt`. This is a highly formal but perfectly correct way to write\
    \ it. Most coders prefer the short form. We'll stick to the short form in this\
    \ training.\n* In the example above, some coders would use single rather than\
    \ double quotation marks. This is legal, as long as it's a matching pair. But\
    \ in a case like this, I'll ask you to use double quotation marks.\n\nFind the\
    \ interactive coding exercises for this chapter at:\n[http://www.ASmarterWayToLearn.com/js/9.html](http://www.ASmarterWayToLearn.com/javascript/9.html)\n\
    \n# 10 if statements\n\nSuppose you code a prompt that asks, \"Where does the\
    \ Pope live?\"\n\nIf the user answers correctly, you display an alert congratulating\
    \ him.\n\nThis is the code.\n\n```javascript\nvar x = prompt(\"Where does the\
    \ Pope live?\");\nif (x === \"Vatican\") {\n   alert(\"Correct!\");\n}\n```\n\n\
    If the user enters `\"Vatican\"` in the prompt field, the congratulations alert\
    \ displays. If he enters something else, nothing happens. (This simplified code\
    \ doesn't allow for other correct answers, like \"The Vatican.\" I don't want\
    \ to get into that now.)\n\nThere's a lot to take in here. Let's break it down.\n\
    \nAn `if` statement always begins with `if`. The space that separates it from\
    \ the parenthesis is new to you. I've taught you to code alerts and prompts with\
    \ the opening parenthesis running up against the keyword: `alert(\"Hi\");` Now\
    \ I'm asking you not to do that in an `if` statement. It's purely a matter of\
    \ style, but common style rules sanction this inconsistency.\n\nFollowing the\
    \ `if` keyword-plus-space is the condition that's being tested—does the variable\
    \ that's been assigned the user's response have a value of `\"Vatican\"`?\n\n\
    The condition is enclosed in parentheses.\n\nIf the condition tests true, something\
    \ happens. Any number of statements might execute. In this case, only one statement\
    \ executes: a congratulatory alert displays.\n\nThe first line of an `if` statement\
    \ ends with an opening curly bracket. An entire `if` statement ends with a closing\
    \ curly bracket on its own line. Note that this is an exception to the rule that\
    \ a statement ends with a semicolon. It's common to omit the semicolon when it's\
    \ a complex statement that's paragraph-like and ends in a curly bracket.\n\nBut\
    \ what about that triple equal sign? You might think that it should just be an\
    \ equal sign, but the equal sign is reserved for *assigning* a value to a variable.\
    \ If you're *testing* a variable for a value, you can't use the single equal sign.\n\
    \nIf you forget this rule and use a single equal sign when you should use the\
    \ triple equal sign, the code won't run properly.\n\nAs you might expect, you\
    \ can use a variable instead of a string in the example code.\n\n```javascript\n\
    var correctAnswer = \"Vatican\";\nif (x === correctAnswer) {\n   alert(\"Correct!\"\
    );\n}\n```\n\nWhen a condition is met, you can have any number of statements execute.\n\
    \n```javascript\nvar correctAnswer = \"Vatican\";\nif (x === correctAnswer) {\n\
    \   score++;\n   userIQ = \"genius\";\n   alert(\"Correct!\");\n}\n```\n\n![](images/00001.jpeg)\n\
    \n* Some coders write simple `if` statements without curly brackets, which is\
    \ legal. Some put the opening curly bracket on its own line. Some put the whole\
    \ `if` statement, if it's simple, on a single line. I find it easiest not to have\
    \ to make case-by-case decisions, so I format all `if` statements the same way,\
    \ as shown in the example. In the exercises, I'll ask you to follow these style\
    \ rules for all `if` statements.\n* In most cases, a double equal sign `==` is\
    \ just as good as a triple equal sign `===`. However, there is a slight technical\
    \ difference, which you may never need to know. Again, to keep things simple,\
    \ I always use the triple equal sign.\n\nFind the interactive coding exercises\
    \ for this chapter at:\n[http://www.ASmarterWayToLearn.com/js/10.html](http://www.ASmarterWayToLearn.com/javascript/10.html)\n\
    \n# 11 Comparison operators\n\nLet's talk a little more about `===`. It's a type\
    \ of *comparison operator*, specifically an *equality operator*. As you learned\
    \ in the last chapter, you use it to *compare* two things to see if they're *equal*.\n\
    \nYou can use the equality operator to compare a variable with a string, a variable\
    \ with a number, a variable with a math expression, or a variable with a variable.\
    \ And you can use it to compare various combinations. All of the following are\
    \ legal first lines in `if` statements:\n\n```javascript\nif (fullName === \"\
    Mark\" + \" \" + \"Myers\") {\nif (fullName === firstName + \" \" + \"Myers\"\
    ) {\nif (fullName === firstName + \" \" + \"Myers\") {\nif (fullName === \"firstName\
    \ + \" \" + lastName) {\nif (totalCost === 81.50 + 135) {\nif (totalCost === materialsCost\
    \ + 135) {\nif (totalCost === materialsCost + laborCost) {\nif (x + y === a -\
    \ b) {\n```\n\nWhen you're comparing strings, the equality operator is case-sensitive.\
    \ `\"Rose\"` does not equal `\"rose\"`.\n"
