    # 87


    Exceptions: try and catch


    If you run the following code, nothing will happen.


    1 function greetWorld() {


    2   var greeting = "Hello world!";


    3   aler(greeting);


    4 }


    The keyword alert, misspelled aler, breaks the code. But JavaScript doesn''t tell
    you what''s wrong. It''s like a car that won''t start. Is it the battery? The
    fuel line? A spark plug?


    Of course, in the small piece of code above, it''s easy to spot the problem. But
    what if the function runs 40 lines and calls three other functions? It would be
    nice if JavaScript reported the specific problem to you instead of just breaking.
    Well, that''s what *try...catch* is for. Here''s how it works.


    1 function greetWorld() {


    2   try {


    3     var greeting = "Hello world!";


    4     aler(greeting);


    5   }


    6   catch(err) {


    7     alert(err);


    8   }


    9 }


    The original operational code is wrapped in the try block. The mis-formed aler
    causes a JavaScript error, which is passed to the catch block. An alert displays
    the error that caused the problem.


    When you wrap some operational code in a try block, you say to JavaScript, "Try
    to execute this code. If there''s an error, stop executing, and go to the catch
    block to see what to do." In the example above, the error thrown by JavaScript
    is assigned to the parameter err, and that value is displayed in an alert:


    "ReferenceError: Can''t find variable: aler"


    Okay, so in this case JavaScript doesn''t give you exactly the information you
    want. Instead of letting you know that you left a "t" off the alert keyword, it
    tells you it has encountered a variable that hasn''t been defined. But close enough.
    JavaScript has pointed you in the right direction.


    Note that try and catch are always paired. Without try, an error won''t trigger
    catch. Without catch, JavaScript won''t know what to do when it throws an error.


    Some more things to keep in mind:


    *   The code inside the try and the catch blocks is wrapped in curly brackets.


    *   The functional code inside the try block is indented.


    *   The error parameter, in this case err, can take any legal variable name.


    *   In this example, an alert displays when an error occurs. But you could do
    something else.


    The try and catch pair have limited usefulness. For example, in the example above,
    if you omit a parenthesis, bracket, or quotation mark, or if you have too many
    of them, no alert will display. The code will just break, and nothing will happen.
    The try and catch approach is useful mainly for spotting variables that haven''t
    been defined or, as in this case, errors that JavaScript interprets as variables
    that haven''t been defined.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/87.html](http://www.ASmarterWayToLearn.com/javascript/87.html)


    # 88


    Exceptions: throw


    By adding one or more *throw* statements, you can define your own errors in a
    *try...catch* pair. This can be useful for dealing with wayward user behavior.


    Suppose you''ve asked the user to create a password. It must be at least 8 to
    12 characters long, must contain at least one number, and can''t contain any spaces.
    This is the markup that creates the form, simplified to keep you focused on the
    essentials:


    <form onSubmit="return checkPassword();">


      Enter a password<br>


      (8-12 characters, at least 1 number, no spaces)<br>


      <input type="text" id="f1">


      <input type="submit" value="Submit">


    </form>


    This is the function that tests whether the user''s input has met the requirements.
    If not, the function displays an alert.


    1  function checkPassword() {


    2    try {


    3      var pass = document.getElementById("f1").value;


    4      if (pass.length < 8) {


    5        throw "Please enter at least 8 characters.";


    6      }


    7      if (pass.indexOf(" ") !== -1) {


    8        throw "No spaces in the password, please.";


    9      }


    10     var numberSomewhere = false;


    11     for (var i = 0; i < pass.length; i++) {


    12       if (isNaN(pass(i, i+1)) === false) {


    13         numberSomewhere = true;


    14         break;


    15       }


    16     }


    17     if (numberSomewhere === false) {


    18       throw "Include at least 1 number.";


    19     }


    20   }


    21   catch(err) {


    22     alert(err);


    23   }


    24 }


    Lines 4 through 9 and 17 through 19 test for three different user errors, with
    a customized string thrown for each error. The catch code, instead of catching
    a JavaScript-generated error, catches the string sent by throw. This is the value
    that is assigned to the variable err in line 21 and serves as the display message
    in line 22.


    Note that any type of value, including a number or Boolean, can be passed to the
    catch parameter via throw. You can also pass a variable.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/88.html](http://www.ASmarterWayToLearn.com/javascript/88.html)


    # 89


    Handling events within JavaScript


    In earlier chapters you learned how to handle events like a button click or form
    submission with inline event handlers. That is the oldest and least abstract way
    to do it. But according to the professional coder''s separate-church-and-state
    ethos, the functionality of JavaScript should be kept separate from the content
    of HMTL. First, an example of the less desirable inline approach:


    <input type="button" value="Click" onClick="sayHello();">


    We''re going to remove the highlighted part of the markup above, and we''re going
    to add an id.


    <input type="button" value="Click" id="button1">


    Here''s the JavaScript code that handles the event.


    1 var b1 = document.getElementById("button1");


    2 b1.onclick = sayHello;


    Line 1 assigns the element to the variable b1. Line 2 watches for the element
    to be clicked. When that happens, it calls the function sayHello.


    Things to notice:


    *   Unlike the camelCase used for inline event-handling, the event name must be
    all-lowercase or it won''t work. It''s onclick not onClick, onfocus not onFocus,
    onsubmit not onSubmit


    *   Unlike inline event-handling, the function name following the equal sign isn''t
    in quotes.


    *   Unlike inline event-handling, there are no parentheses following the function
    name.


    If you wanted, you could condense it into a single statement by writing...


