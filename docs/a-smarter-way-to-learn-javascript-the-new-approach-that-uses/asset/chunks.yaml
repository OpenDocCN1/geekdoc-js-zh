    This is how I encapsulated the information for the Basic plan in an object and
    five properties.


    1 var plan1 = {


    2   name:   "Basic",


    3   price: 3.99,


    4   space: 100,


    5   transfer: 1000,


    6   pages: 10


    7 };


    But that only gets us an object that represents the first plan. I''d have to do
    the same thing again for the Professional and Ultimate plans. This is too much
    hand craftsmanship. We need a factory to crank out these things by the dozen.
    JavaScript lets you build such a factory. It''s called a *constructor function*.


    1 function Plan(name, price, space, transfer, pages) {


    2   this.name = name;


    3   this.price = price;


    4   this.space = space;


    5   this.transfer = transfer;


    6   this.pages = pages;


    7 }


