    当结果被赋值给一个新变量时，如上例所示，括号内未取整的数字会被保留。但你可以将取整后的数字赋值给原始变量，这样未取整的数字就会被取整后的数字替换。


    ```javascript

    scoreAvg = Math.round(scoreAvg);

    ```


    你也可以在括号内直接放入一个字面数字，而不是变量。


    ```javascript

    var scoreAvg = Math.round(.0678437);

    ```


    要强制 JavaScript 向上取整到最近的整数，无论小数部分多小，请使用 `ceil` 而不是 `round`。以下代码将 `.000001`（通常向下取整为
    `0`）向上取整到最近的整数 `1`。


    ```javascript

    var scoreAvg = Math.ceil(.000001);

    ```


    `ceil` 代表“天花板”。它将 `.000001` 向上取整为 `1`，`-.000001` 向上取整为 `0`，`1.00001` 向上取整为 `2`，以此类推。


    要强制 JavaScript 向下取整到最近的整数，无论小数部分多大，请使用 `floor` 而不是 `round`。以下代码将 `.999999`（通常向上取整为
    `1`）向下取整到 `0`。


    ```javascript

    var scoreAvg = Math.floor(.999999);

    ```


    `floor` 将 `.999999` 向下取整为 `0`，`1.9` 向下取整为 `1`，`-.000001` 向下取整为 `-1`，以此类推。


