    The next problem with our example is that it potentially wastes computing cycles.
    Suppose on the second loop a match is found and the alert displays. The way the
    loop is coded, the loop goes on looping all the way to the end. This is unnecessary,
    since we got our answer in the second loop. The problem is solved with the keyword
    break.


    1  var matchFound = false;


    2  for (var i = 0; i <= 4; i++);


    3    if (cityToCheck === cleanestCities[i]) {


