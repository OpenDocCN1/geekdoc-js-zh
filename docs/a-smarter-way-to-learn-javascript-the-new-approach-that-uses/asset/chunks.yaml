    \ {\n    alert(\"It's one of the cleanest cities\");\n  }\n}\n```\n\nLine 2 is\
    \ what's new here:\n`cityToCheck = cityToCheck.toLowerCase();`\n\nThe converted\
    \ string is assigned to a variable. In this case, it's the same variable whose\
    \ string is being converted, `cityToCheck`. Note that the keyword `toLowerCase`\
    \ must be in camelCase.\n\nNote too that the `toLowerCase` method converts all\
    \ the characters of the string to lower-case, not just the initial letters. For\
    \ example, \"ChEyEnNe\" becomes \"cheyenne.\"\n\nYou could go the other way and\
