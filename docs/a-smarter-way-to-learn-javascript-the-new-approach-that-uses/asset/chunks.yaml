    ## 变量名的合法与非法


    你已经学习了关于变量命名的三条规则：不能放在引号内；名称不能是数字或以数字开头；不能是 JavaScript 的任何关键字——那些作为编程指令的特殊单词，比如
    `alert` 和 `var`。


    以下是其余规则：


    *   变量名不能包含空格。

    *   变量名只能包含字母、数字、美元符号和下划线。

    *   虽然变量名不能是 JavaScript 的关键字，但可以*包含*关键字。例如，`userAlert` 和 `myVar` 是合法的。

    *   大写字母没问题，但要小心。变量名区分大小写。`rose` 不是 `Rose`。如果你将字符串 `"Floribundas"` 赋值给变量 `rose`，然后向
    JavaScript 询问 `Rose` 的值，你会得到空结果。


