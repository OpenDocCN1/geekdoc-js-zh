    ## 25 Strings: Replacing characters


    In previous chapters you learned two different ways to replace "World War II"
    with "the Second World War" in a string. First, there was the loop-and-slice approach.


    ```javascript

    1 for (var i = 0; i < text.length; i++) {

    2   if (text.slice(i, i + 12) === "World War II") {

    3     text = text.slice(0, 1) + "the Second World War" + text.slice(i + 12);

    4   }

    5 }

    ```


    You improved on that rather crude approach when you learned the `indexOf` method.


    ```javascript

    1 var firstChar = text.indexOf("World War II");

    2 if (firstChar !== -1) {

    3   text = text.slice(0, firstChar) + "the Second World War" + text.slice(firstChar
    + 12);

    4 }

    ```


    But JavaScript provides a more straightforward way still, the `replace` method.


    `var newText = text.replace("World War II", "the Second World War");`


    The first string inside the parentheses is the segment to be replaced. The second
    string is the segment to be inserted. In the above code, the segment "World War
    II" is replaced by the segment "the Second World War" in the string represented
    by the variable `text`, and the revised string is assigned to the new variable
    `newText`.


    If you assign the revised string to a new variable, as in the example above, the
    original string is preserved. If you want the original string to be replaced by
    the revised string, assign the revised string to the original variable.


    `text = text.replace("World War II", "the Second World War");`


    In the examples above, only the first instance of a string is replaced. If you
    want to replace all instances, you must let JavaScript know that you want a *global*
    replace.


    `var newText = text.replace(/World War II/g, "the Second World War");`


    In a global replace, you enclose the segment to be replaced by slashes instead
    of quotation marks, and follow the closing slash with `g` for "global." The segment
    to be inserted is enclosed by quotation marks, as in a one-time replace.


