  trans: "\n你可以将字符串和变量的任意组合进行拼接，也可以全部使用字符串或全部使用变量。例如，我可以像下面这样重写上一个示例。\n\n```javascript\n\
    var message = \"Thanks, \";\nvar banger = \"!\";\nalert(message + userName + banger);\n\
    ```\n\n下面是使用三个字符串的示例。\n\n```javascript\nalert(\"Thanks, \" + \"Susan\" + \"!\"\
    );\n```\n\n你可以将拼接结果赋值给一个变量。\n\n```javascript\nvar message = \"Thanks, \";\nvar\
    \ userName = \"Susan\";\nvar banger = \"!\";\nvar customMess = message + userName\
    \ + banger;\nalert(customMess);\n```\n\n如果你把数字放在引号中，JavaScript 会将其作为字符串进行拼接，而不是相加。以下代码……\n\
    \n```javascript\nalert(\"2\" + \"2\");\n```\n\n……会显示消息 \"22\"。\n\n如果你混合使用字符串和数字……\n\
    \n```javascript\nalert(\"2 plus 2 equals \" + 2 + 2);\n```\n\n……JavaScript 会自动将数字转换为字符串，并显示消息\
    \ \"2 plus 2 equals 22\"。\n\n本章的交互式编程练习请访问：\n[`www.ASmarterWayToLearn.com/js/8.html`](http://www.ASmarterWayToLearn.com/javascript/8.html)\n\
    \n# 9 提示框\n\n*提示框*会向用户询问一些信息，并提供一个回答字段供用户输入答案。\n\n以下代码向用户提问“你的物种？”，并在回答字段中提供了一个默认答案“human”。用户可以修改这个答案。无论用户保留默认答案还是将其改为其他内容，她的回答都会被赋值给该变量。\n\
    \n```javascript\nvar spec = prompt(\"Your species?\", \"human\");\n```\n\n提示框代码与\
    \ `alert()` 代码类似，但有两个不同之处。\n\n* 在提示框中，你需要一种方式来捕获用户的回答。这意味着你需要先声明一个变量，然后加上等号。\n\
    * 在提示框中，你可以指定第二个字符串。这是提示框显示时字段中出现的默认回答。如果用户保留默认回答并直接点击 `OK`，则默认回答会被赋值给该变量。是否包含默认回答由你决定。\n\
    \n正如你所料，你可以将字符串赋值给变量，然后在括号内使用变量代替字符串。\n\n```javascript\nvar question = \"Your\
    \ species?\";\nvar defaultAnswer = \"human\";\nvar spec = prompt(question, defaultAnswer);\n\
    ```\n\n用户的回答是一个文本字符串。即使回答是数字，它也会以字符串形式返回。例如，考虑以下代码。\n\n```javascript\nvar numberOfCats\
    \ = prompt(\"How many cats?\");\nvar tooManyCats = numberOfCats + 1;\n```\n\n\
    由于你询问的是数字，并且用户很可能输入了一个数字，你可能会认为第二条语句中的数学运算能够生效。例如，如果用户输入 3，变量 `tooManyCats` 的值应该是\
    \ 4，你可能会这么想。但没那么幸运。所有对提示框的回答都以字符串形式返回。当字符串 `\"3\"` 与数字 `1` 通过加号连接时，JavaScript\
    \ 会将 `1` 转换为字符串并进行拼接。因此，`tooManyCats` 的值最终不是 4，而是 `\"31\"`。你将在后续章节中学习如何解决这个问题。\n\
    \n如果用户不输入任何内容并点击 `OK`，则该变量会被赋值为空字符串：`\"\"`\n\n如果用户点击 `Cancel`，则该变量会被赋值为一个特殊值：`null`。\n\
    \n![](img/00001.jpeg)\n\n* 有些程序员会写成 `window.prompt` 而不是简单的 `prompt`。这是一种非常正式但完全正确的写法。大多数程序员更喜欢简写形式。在本教程中，我们将坚持使用简写形式。\n\
    * 在上面的示例中，有些程序员会使用单引号而不是双引号。只要成对匹配，这是合法的。但在这种情况下，我会要求你使用双引号。\n\n本章的交互式编程练习请访问：\n\
    [`www.ASmarterWayToLearn.com/js/9.html`](http://www.ASmarterWayToLearn.com/javascript/9.html)\n\
    \n# 10 if 语句\n\n假设你编写了一个提示框，询问“教皇住在哪里？”\n\n如果用户回答正确，你会显示一个祝贺的警告框。\n\n代码如下。\n\n\
    ```javascript\nvar x = prompt(\"Where does the Pope live?\");\nif (x === \"Vatican\"\
    ) {\n   alert(\"Correct!\");\n}\n```\n\n如果用户在提示框字段中输入 `\"Vatican\"`，则会显示祝贺警告框。如果他输入其他内容，则什么也不会发生。（这个简化的代码没有考虑其他正确答案，比如“The\
    \ Vatican”。我现在不想深入讨论这个问题。）\n\n这里有很多内容需要理解。让我们分解一下。\n\n`if` 语句总是以 `if` 开头。它与括号之间的空格对你来说是新的。我之前教你编写警告框和提示框时，左括号紧挨着关键字：`alert(\"\
    Hi\");` 现在我在 `if` 语句中要求你不要这样做。这纯粹是风格问题，但常见的风格规则允许这种不一致。\n\n在 `if` 关键字加空格之后，是被测试的条件——被赋值为用户回答的变量是否等于\
    \ `\"Vatican\"`？\n\n条件被括在圆括号中。\n\n如果条件测试为真，则会执行某些操作。可能执行任意数量的语句。在这个例子中，只执行一条语句：显示一个祝贺警告框。\n\
    \n`if` 语句的第一行以左花括号结束。整个 `if` 语句以单独一行的右花括号结束。请注意，这是对“语句以分号结束”这一规则的例外。当语句是类似段落的复杂语句并以花括号结束时，通常省略分号。\n\
    \n但是那个三个等号是怎么回事？你可能会认为它应该只是一个等号，但等号是保留用于给变量*赋值*的。如果你要*测试*变量的值，就不能使用单个等号。\n\n如果你忘记了这个规则，在应该使用三个等号时使用了单个等号，代码将无法正常运行。\n\
    \n正如你所料，你可以在示例代码中使用变量代替字符串。\n\n```javascript\nvar correctAnswer = \"Vatican\"\
    ;\nif (x === correctAnswer) {\n   alert(\"Correct!\");\n}\n```\n\n当条件满足时，你可以执行任意数量的语句。\n\
    \n```javascript\nvar correctAnswer = \"Vatican\";\nif (x === correctAnswer) {\n\
    \   score++;\n   userIQ = \"genius\";\n   alert(\"Correct!\");\n}\n```\n\n![](img/00001.jpeg)\n\
    \n* 有些程序员在编写简单的 `if` 语句时不使用花括号，这是合法的。有些程序员将左花括号放在单独一行。有些程序员如果 `if` 语句很简单，会将其全部放在一行。我发现不必逐案决定是最简单的，因此我按照示例所示的方式格式化所有\
    \ `if` 语句。在练习中，我会要求你对所有 `if` 语句遵循这些风格规则。\n* 在大多数情况下，双等号 `==` 与三等号 `===` 效果相同。然而，存在细微的技术差异，你可能永远不需要了解。同样，为了简单起见，我总是使用三等号。\n\
    \n本章的交互式编程练习请访问：\n[`www.ASmarterWayToLearn.com/js/10.html`](http://www.ASmarterWayToLearn.com/javascript/10.html)\n\
    \n# 11 比较运算符\n\n让我们再详细谈谈 `===`。它是一种*比较运算符*，具体来说是*相等运算符*。正如你在上一章中学到的，你用它来*比较*两个事物是否*相等*。\n\
    \n你可以使用相等运算符来比较变量与字符串、变量与数字、变量与数学表达式，或者变量与变量。你还可以用它来比较各种组合。以下所有内容都是 `if` 语句中合法的第一行：\n\
    \n```javascript\nif (fullName === \"Mark\" + \" \" + \"Myers\") {\nif (fullName\
    \ === firstName + \" \" + \"Myers\") {\nif (fullName === firstName + \" \" + \"\
    Myers\") {\nif (fullName === \"firstName + \" \" + lastName) {\nif (totalCost\
    \ === 81.50 + 135) {\nif (totalCost === materialsCost + 135) {\nif (totalCost\
    \ === materialsCost + laborCost) {\nif (x + y === a - b) {\n```\n\n当比较字符串时，相等运算符是区分大小写的。`\"\
    Rose\"` 不等于 `\"rose\"`。\n\n"
- fmt: '

    Another comparison operator, `!==`, is the opposite of `===`. It means *is not
    equal to*.


    ```

    1 if (yourTicketNumber !== 487208) {

    2   alert("Better luck next time.");

    3 }

    ```


    Like `===`, the not-equal operator can be used to compare numbers, strings, variables,
    math expressions, and combinations.


    Like `===`, string comparisons using the not-equal operator are case-sensitive.
    It''s true that `"Rose" !== "rose"`.


    Here are 4 more comparison operators, usually used to compare numbers.


    - `>` is greater than

    - `<` is less than

    - `>=` is greater than or equal to

    - `<=` is less than or equal to


    In the examples below, all the conditions are true.


    ```

    if (1 > 0) {

    if (0 < 1) {

    if (1 >= 0) {

    if (1 >= 1) {

    if (0 <= 1) {

    if (1 <= 1) {

    ```


    ![](images/00001.jpeg)


    *   Just as the double equal sign can usually be used instead of the triple equal
    sign, `!=` can usually be used instead of `!==`. In the exercises, I''ll ask you
    to stick to `!==`.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/11.html](http://www.ASmarterWayToLearn.com/javascript/11.html)


    # 12 *if...else* and *else if* statements


    The *if* statements you''ve coded so far have been all-or-nothing. If the condition
    tested true, something happened. If the condition tested false, nothing happened.


    ```

    1 var x = prompt("Where does the Pope live?");

    2 if (x === "Vatican") {

    3   alert("Correct!");

    4 }

    ```


    Quite often, you want something to happen either way. For example:


    ```

    1 var x = prompt("Where does the Pope live?");

    2 if (x === "Vatican") {

    3   alert("Correct!");

    4 }

    5 if (x !== "Vatican") {

    6   alert("Wrong answer");

    7 }

    ```


    In this example, we have two *if* statements, one testing for `"Vatican"`, and
    another testing for *not*-`"Vatican"`. So all cases are covered, with one alert
    or another displaying, depending on what the user has entered.


    The code works, but it''s more verbose than necessary. The following code is more
    concise and, as a bonus, more readable.


    ```

    1 if (x === "Vatican") {

    2   alert("Correct!");

    3 }

    4 else {

    5   alert("Wrong answer");

    6 }

    ```


    In the style convention I follow, the *else* part has exactly the same formatting
    as the *if* part.


    As in the *if* part, any number of statements can execute within the *else* part.


    ```

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   alert("Correct!");

    4 }

    5 else {

    6   score--;

    7   userIQ = "problematic";

    8   alert("Incorrect");

    9 }

    ```


    *else if* is used if all tests above have failed and you want to test another
    condition.


    ```

    1 var correctAnswer = "Vatican";

    2 if (x === correctAnswer) {

    3   alert("Correct!");

    4 }

    5 else if (x === "Rome") {

    6   alert("Incorrect but close");

    7 }

    8 else {

    9   alert("Incorrect");

    10}

    ```


    In a series of *if* tests, JavaScript stops testing whenever a condition tests
    true.


    ![](images/00001.jpeg)


    *   There are so many ways to format *if* statements and their variations that
    the range of possibilities is almost endless. I''m partial to the format I''ve
    showed you, because it''s easy to learn and produces readable code. I''ll ask
    you to stick to this format throughout the exercises.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/12.html](http://www.ASmarterWayToLearn.com/javascript/12.html)


    # 13 Testing sets of conditions


    Using the *if* statement, you''ve learned to test for a condition. If the condition
    is met, one or more statements execute. But suppose not one but *two* conditions
    have to be met in order for a test to succeed.


    For example, if a guy weighs more than 300 pounds, he''s just a great big guy.
    But if he weighs more than 300 pounds *and* runs 40 yards in under 6 seconds?
    You''re going to invite him to try out for the NLF as a lineman. You can test
    for a combination of conditions in JavaScript by using...


    `&&`


    Here''s the code.


    ```

    1 if (weight > 300 && time < 6) {

    2   alert("Come to our tryout!");

    3 }

    4 else {

    5   alert("Come to our cookout!");

    6 }

    ```


    You can chain any number of conditions together.


    ```

    1 if (weight > 300 && time < 6 && age > 17 && gender === "male") {

    2   alert("Come to our tryout!");

    3 }

    4 else {

    5   alert("Come to our cookout!");

    6 }

    ```


    You can also test for *any* of a set of conditions. This is the operator.


    `||`


    Here''s an example.


    ```

    1 if (SAT > avg || GPA > 2.5 || sport === "football") {

    2   alert("Welcome to Bubba State!");

    3 }

    4 else {

    5   alert("Have you looked into appliance repair?");

    6 }

    ```


    If in line 1 any or all of the conditions are true, the first alert displays.
    If none of them are true (line 4), the second alert displays.


    You can combine any number of *and* and *or* conditions. When you do, you create
    ambiguities. Take this line...


    `if (age > 65 || age < 21 && res === "U.S.") {`


    This can be read in either of two ways.


    *   The first way it can be read: If the person is over 65 or under 21 and, in
    addition to either of these conditions, is also a resident of the U.S. Under this
    interpretation, both columns need to be true in the following table to qualify
    as a pass.


    ![](images/00002.jpeg)


    *   The second way it can be read: If the person is over 65 and living anywhere
    or is under 21 and a resident of the U.S. Under this interpretation, if either
    column in the following table is true, it''s a pass.


    ![](images/00003.jpeg)


    It''s the same problem you face when you combine mathematical expressions. And
    you solve it the same way: with parentheses.


    In the following code, if the subject is over 65 and a U.S. resident, it''s a
    pass. Or, if the subject is under 21 and a U.S. resident, it''s a pass.


    `if ((age > 65 || age < 21) && res === "U.S.") {`


    In the following code, if the subject is over 65 and living anywhere, it''s a
    pass. Or, if the subject is under 21 and living in the U.S., it''s a pass.


    `if (age > 65 || (age < 21 && res === "U.S.")) {`


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/13.html](http://www.ASmarterWayToLearn.com/javascript/13.html)


    # 14 *if* statements nested


    Check out this code.


    ```

    1 if ((x === y || a === b) && c === d) {

    2   g = h;

    3 }

    4 else {

    5   e = f;

    6 }

    ```


    In the code above, if either of the first conditions is true, and, in addition,
    the third condition is true, then `g` is assigned `h`. Otherwise, `e` is assigned
    `f`.


    There''s another way to code this, using *nesting*.


    ```

    1  if (c === d) {

    2    if (x === y) {

    3      g = h;

    4    }

    5    else if (a === b) {

    6      g = h;

    7    }

    8    else {

    9      e = f;

    10   }

    11 }

    12 else {

    13   e = f;

    14 }

    ```


    Nest levels are communicated to JavaScript by the positions of the curly brackets.
