    \ you'd write:\n`cityToCheck = cityToCheck.toUpperCase();`\n\nFind the interactive\
    \ coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/21.html](http://www.ASmarterWayToLearn.com/javascript/21.html)\n\
    \n# 22 Strings: Measuring length and extracting parts\n\nYou've asked the user\
    \ to give you the name of a city. You want to convert the name she's given you\
    \ to a name with an initial cap. Whether she's input \"boston,\" \"BOSTON\", or\
    \ \"bosTon,\" you want to normalize the input to \"Boston.\" The `toLowerCase`\
    \ and `toUpperCase` methods you learned in the last chapter won't get the job\
    \ done on their own, because they make the same wholesale change to every character\
    \ in the string. But if you break the string up into two segments, you can use\
    \ these methods to get the string into the shape you want. (For now, I'll ignore\
    \ the possibility that the city name might be made up of two or more words, like\
    \ New Orleans or Sault Ste. Marie.)\n\nTo copy a section of a string, you use\
    \ the `slice` method. Suppose the user has entered a string, and the string has\
    \ been assigned to the variable `cityToCheck`. The following code copies the first\
    \ character of the string and assigns it to the variable `firstChar`. The original\
    \ value of `cityToCheck` doesn't change. If `cityToCheck` is \"Boston\", `firstChar`\
    \ is \"B\".\n\n`var firstChar = cityToCheck.slice(0, 1);`\n\n### Things to be\
    \ aware of:\n\n* A string is indexed like an array. Only, instead of each index\
    \ number referring to an element, it refers to a character.\n* Like array indexing,\
    \ string indexing begins with 0.\n* In the `slice` method, the first number inside\
    \ the parentheses is the index of the first character in the slice. The second\
    \ number is not, however, the last character in the slice. It's the first character\
