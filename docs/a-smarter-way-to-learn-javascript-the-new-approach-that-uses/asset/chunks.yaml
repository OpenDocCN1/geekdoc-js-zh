    \ way to get JavaScript to recognize the uncapitalized version as a match.\n\n\
    One way would be to expand the `cleanestCities` array to include the uncapitalized\
    \ versions of all the city names:\n\n`var cleanestCities = [\"Cheyenne\", \"cheyenne\"\
    , \"Santa Fe\", \"santa fe\", \"Tucson\", \"tucson\", \"Great Falls\", \"great\
