  trans: "\n\n![](img/00004.jpeg)\n\n通过将每个名字与每个姓氏组合，我们可以生成 20 个不同的说唱歌手全名。\n\n从\"BlueRay\"\
    开始，我们遍历姓氏列表，生成...\n\nBlueRay Zzz\nBlueRay Burp\nBlueRay Dogbone\nBlueRay Droop\n\
    \n然后移动到下一个名字\"Upchuck\"，再次遍历姓氏列表，生成...\n\nUpchuck Zzz\nUpchuck Burp\nUpchuck Dogbone\n\
    Upchuck Droop\n\n以此类推，将每个名字与每个姓氏组合。\n\n但你看，为什么不让 JavaScript 来做这些重复的工作呢？我们将使用嵌套的\
    \ `for` 语句。\n\n```javascript\nvar firstNames = [\"BlueRay \", \"Upchuck \", \"\
    Lojack \", \"Gizmo \", \"Do-Rag \"];\nvar lastNames = [\"Zzz\", \"Burp\", \"Dogbone\"\
    , \"Droop\"];\nvar fullNames = [];\n\nfor (var i = 0; i < firstNames.length; i++)\
    \ {\n  for (var j = 0; j < lastNames.length; j++) {\n    fullNames.push(firstNames[i]\
    \ + lastNames[j]);\n  }\n}\n```\n\n### 思考要点：\n\n* 内层循环在外层循环的每次迭代中都会完整地循环一遍。如果外层循环计数器是\
    \ `i`，内层循环计数器是 `j`，那么当 `i` 为 0 时，`j` 会从 0、1、2 一直循环到结束。然后 `i` 增加到 1，`j` 再次遍历所有值。外层循环就像时钟的分针，内层循环就像秒针。\n\
    * 你可以根据需要嵌套任意多层。\n* 嵌套循环相对于其外层循环缩进 2 个空格。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/20.html`](http://www.ASmarterWayToLearn.com/javascript/20.html)\n\
    \n# 21 改变大小写\n\n你让用户输入她所在的城市。然后你将她输入的城市与最干净的 5 个城市列表进行比对。\n\n如果用户输入\"Cheyenne\"\
    或其他最干净的城市，你的代码会弹出一个提示，告诉她这是最干净的城市之一。\n\n但如果她输入的是\"cheyenne\"而不是\"Cheyenne\"——有些用户难免会这样——那么就不会匹配。JavaScript\
    \ 是字面理解的。\n\n人类知道在这个上下文中\"cheyenne\"指的是\"Cheyenne\"，但 JavaScript 不知道。我们需要某种方法让\
    \ JavaScript 识别出未大写版本也能匹配。\n\n一种方法是扩展 `cleanestCities` 数组，包含所有城市名称的小写版本：\n\n`var\
    \ cleanestCities = [\"Cheyenne\", \"cheyenne\", \"Santa Fe\", \"santa fe\", \"\
    Tucson\", \"tucson\", \"Great Falls\", \"great falls\", \"Honolulu\", \"honolulu\"\
    ];`\n\n这种方法在一定程度上可行，但需要大量额外编码。而且，如果用户输入\"santa Fe\"、\"Santa fe\"或\"sAnta Fe\"\
    ，我们又回到了最初的问题。要覆盖所有这些可能性以及其他情况，代码会变得非常冗长。\n\n解决方案是将数组元素全部写成小写，并将用户的输入（无论是什么）也转换为小写，这样我们就能始终用苹果和苹果进行比较。\n\
    \n```javascript\nvar cityToCheck = prompt(\"Enter your city\");\ncityToCheck =\
    \ cityToCheck.toLowerCase();\nvar cleanestCities = [\"cheyenne\", \"santa fe\"\
    , \"tucson\", \"great falls\", \"honolulu\"];\nfor (var i = 0; i <= 4; i++) {\n\
    \  if (cityToCheck === cleanestCities[i]) {\n    alert(\"It's one of the cleanest\
    \ cities\");\n  }\n}\n```\n\n第 2 行是这里的新内容：\n`cityToCheck = cityToCheck.toLowerCase();`\n\
    \n转换后的字符串被赋值给一个变量。在这个例子中，就是被转换的字符串本身所在的变量 `cityToCheck`。注意关键字 `toLowerCase` 必须使用驼峰式大小写。\n\
    \n还要注意，`toLowerCase` 方法会将字符串中的所有字符转换为小写，而不仅仅是首字母。例如，\"ChEyEnNe\" 会变成 \"cheyenne\"\
    。\n\n你也可以反过来，将所有内容转换为大写，然后与\"CHEYENNE\"、\"SANTA FE\"等进行比对。大多数程序员更喜欢小写方法。要将字符串转换为大写，你可以这样写：\n\
    `cityToCheck = cityToCheck.toUpperCase();`\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/21.html`](http://www.ASmarterWayToLearn.com/javascript/21.html)\n\
    \n# 22 字符串：测量长度和提取部分\n\n你让用户输入一个城市名称。你想将她输入的名称转换为首字母大写的格式。无论她输入的是\"boston\"、\"\
    BOSTON\"还是\"bosTon\"，你都希望将输入标准化为\"Boston\"。你在上一章学到的 `toLowerCase` 和 `toUpperCase`\
    \ 方法无法单独完成这个任务，因为它们会对字符串中的每个字符进行相同的全局更改。但如果你将字符串分成两段，就可以使用这些方法将字符串调整为你想要的格式。（目前，我忽略城市名称可能由两个或更多单词组成的情况，比如\
    \ New Orleans 或 Sault Ste. Marie。）\n\n要复制字符串的一部分，可以使用 `slice` 方法。假设用户输入了一个字符串，并且该字符串被赋值给变量\
    \ `cityToCheck`。以下代码复制字符串的第一个字符，并将其赋值给变量 `firstChar`。`cityToCheck` 的原始值不变。如果 `cityToCheck`\
    \ 是\"Boston\"，那么 `firstChar` 就是\"B\"。\n\n`var firstChar = cityToCheck.slice(0,\
    \ 1);`\n\n### 需要注意的事项：\n\n* 字符串的索引方式与数组类似。只不过每个索引号指向的不是元素，而是一个字符。\n* 与数组索引一样，字符串索引从\
    \ 0 开始。\n* 在 `slice` 方法中，括号内的第一个数字是切片中第一个字符的索引。第二个数字并不是切片中的最后一个字符，而是切片*之后*的第一个字符。如果你用第二个索引减去第一个索引，得到的结果总是切片的长度。\n\
    \n另一个例子：\n`var someChars = cityToCheck.slice(2, 5);`\n\n再次假设字符串是\"Boston\"。切片从索引\
    \ 2（第三个字符）开始，即\"s\"。它结束于索引 5 之前的字符，即\"n\"。`someChars` 的值是\"sto\"。\n\n如果省略括号内的第二个数字，JavaScript\
    \ 会包含从起始位置到字符串末尾的所有字符。\n`var someChars = cityToCheck.slice(2);`\n\n切片从索引 2（第三个字符）开始，即\"\
    s\"。由于没有指定结束位置，切片会一直取到字符串的最后一个字符。`someChars` 的值是\"ston\"。\n\n现在我们有一种方法可以将字符串的第一个字符大写，并确保其余字母为小写。\n\
    \n```javascript\nvar firstChar = cityToCheck.slice(0, 1);\nvar otherChars = cityToCheck.slice(1);\n\
    firstChar = firstChar.toUpperCase();\notherChars = otherChars.toLowerCase();\n\
    var cappedCity = firstChar + otherChars;\n```\n\n上面代码逐行执行的操作如下：\n1. 复制字符串的第一个字符，并赋值给变量\
    \ `firstChar`。\n2. 复制从第二个字符到末尾的所有字符，并赋值给变量 `otherChars`。\n3. 将第一个字符大写。\n4. 将其他字符小写。\n\
    5. 将两部分拼接起来，重新组成完整的字符串。\n\n有时知道字符串中有多少个字符会很有用。例如，假设你想从任何长度超过三个字符的字符串中截取前三个字符，比如从\"\
    November\"中截取\"Nov\"。要查找字符串中的字符数，你可以使用你已经学过的用于查找数组元素数量的相同语法。\n\n```javascript\n\
    var month = prompt(\"Enter a month\");\nvar charsInMonth = month.length;\nif (charsInMonth\
    \ > 3) {\n  monthAbbrev = month.slice(0, 3);\n}\n```\n\n第 2 行统计字符串中的字符数，并将该数字赋值给变量\
    \ `charsInMonth`。\n\n能够测量字符串中的字符数会非常方便。例如，假设你想遍历一个字符串，检查其中是否有双空格。你可以将字符数用作循环的界限。以下代码检查字符串中是否有双空格，如果发现则显示一个提示。\n\
    \n"
