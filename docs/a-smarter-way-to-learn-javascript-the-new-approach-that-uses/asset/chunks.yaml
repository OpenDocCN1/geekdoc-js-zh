    \ the string \"24\" to the number 24.\n\n```javascript\nvar integerString = \"\
    24\"\nvar num = Number(integerString);\n```\n\nThe following code converts the\
    \ string \"24.9876\" to the number 24.9876.\n\n```javascript\nvar floatingNumString\
    \ = \"24.9876\";\nvar num = Number(floatingNumString);\n```\n\nSuppose your code\
    \ has done an arithmetic calculation that yielded a big number. Now you want to\
    \ present the result of the calculation to your user. But before you display the\
    \ number, you want to format it with commas so it's readable. In order to do that,\
    \ you'll have to convert the number to a string. This is how you do it.\n\nConverting\
    \ a number to a string, perhaps so you can format it, is straightforward.\n\n\
    ```javascript\nvar numberAsNumber = 1234;\nvar numberAsString = numberAsNumber.toString();\n\
    ```\n\nThe code above converts the number 1234 to the string \"1234\" and assigns\
    \ it to the variable `numberAsString`.\n\nFind the interactive coding exercises\
    \ for this chapter at: [http://www.ASmarterWayToLearn.com/js/29.html](http://www.ASmarterWayToLearn.com/javascript/29.html)\n\
    \n## 30 Controlling the Length of Decimals\n\nThe price of the item is $9.95.\
    \ The sales tax is 6.5% of the price. You combine the two numbers to get the total.\n\
    \n```javascript\nvar total = price + (price * taxRate);\n```\n\nThe variable `total`\
    \ now has a value of 10.59675.\n\nBut that isn't what you're going to charge the\
    \ customer, is it? You're going to charge her an amount rounded off to two decimal\
    \ places: $10.60.\n\nHere's how to do it.\n\n```javascript\nvar prettyTotal =\
    \ total.toFixed(2);\n```\n\nThe statement above rounds the number represented\
    \ by `total` to 2 places and assigns the result to the variable `prettyTotal`.\
    \ The number inside the parentheses tells JavaScript how many places to round\
    \ the decimal to.\n\nNow add a dollar sign, and you're all set.\n\n```javascript\n\
    var currencyTotal = \"$\" + prettyTotal;\n```\n\nTo shorten a number to no decimals,\
    \ leave the parentheses empty.\n\n```javascript\nvar prettyTotal = total.toFixed();\n\
    ```\n\nUnfortunately, the `toFixed` method comes with a surprise inside. If a\
    \ decimal ends in 5, it usually rounds up, as you would expect. But, depending\
    \ on the browser, sometimes it rounds down! If, for example, you apply the method\
    \ to 1.555, specifying 2 decimal places, it may give you \"1.56\". Or it may produce\
    \ \"1.55\".\n\nThere are sophisticated ways to address the problem. Here's an\
    \ inelegant fix that uses methods you already know and understand.\n\n```javascript\n\
    var str = num.toString();\nif (str.charAt(str.length - 1) === \"5\") {\n  str\
    \ = str.slice(0, str.length - 1) + \"6\";\n}\nnum = Number(str);\nprettyNum =\
    \ num.toFixed(2);\n```\n\nIf the decimal ends in a 5, the code changes it to a\
    \ 6 so the method is forced to round up when it should. Here's what's happening,\
    \ line-by-line:\n\n1. Converts the number to a string and assigns it to the variable\
    \ `str`.\n2. Checks to see if the last character is \"5\".\n3. If so, slices off\
    \ the \"5\" and appends \"6\".\n4. --\n5. Converts it back to a number.\n6. Rounds\
    \ it to 2 places.\n\nFind the interactive coding exercises for this chapter at:\
    \ [http://www.ASmarterWayToLearn.com/js/30.html](http://www.ASmarterWayToLearn.com/javascript/30.html)\n\
    \n## 31 Getting the Current Date and Time\n\nYour webpage includes a notice telling\
    \ the user the current local date and time in his particular time zone. But what\
    \ is the current date and time? Here's how JavaScript finds out.\n\n```javascript\n\
    var rightNow = new Date();\n```\n\nThe statement above creates something called\
    \ a `Date` object. This is what it looks like.\n\n![](images/00005.jpeg)\n\nNote\
    \ that JavaScript gets this information from the user's computer. It is only as\
    \ accurate as the computer's date and time settings. For example, if the user\
    \ just moved from the U.S. West Coast to the U.S. East Coast and hasn't reset\
    \ the time zone on his computer, the computer will still be on Pacific Time. The\
    \ `Date` object, too, will be on Pacific Time.\n\nThe `Date` object may resemble\
    \ a string, but it isn't one. For example, you can't use methods on it like `charAt`,\
    \ `indexOf`, or `slice`.\n\nIf you need the `Date` object to be a string, you\
    \ can convert it to one the same way you convert a number to a string.\n\n```javascript\n\
    var dateString = rightNow.toString();\n```\n\nThe code above converts the `Date`\
    \ object represented by the variable `rightNow` to a string and assigns the string\
    \ to the variable `dateString`.\n\nMost of the time, you'll just want to extract\
    \ some of the information from the `Date` object without converting it to a string.\n\
    \nI'm going to show you how to extract the individual pieces of the `Date` object.\
    \ In this chapter I'll get you started with the first piece. In the next chapter\
    \ I'll cover the rest.\n\nThe following code creates a new `Date` object, assigns\
    \ it to the variable `rightNow`, extracts the day of the week, and assigns the\
    \ day of the week to the variable `theDay`.\n\n```javascript\nvar rightNow = new\
    \ Date();\nvar theDay = rightNow.getDay();\n```\n\nIn the diagram of the `Date`\
    \ object that I showed you above, the day of the week was represented as \"Mon.\"\
    \ But when you extract the day of the week from the object, it's represented as\
    \ a number. Days are designated by a number from 0 for Sunday through 6 for Saturday.\
    \ This means that you'll need a bit of code to convert it back into a day name\
    \ like \"Mon.\"\n\n```javascript\nvar dayNames = [\"Sun\", \"Mon\", \"Tue\", \"\
    Wed\", \"Thu\", \"Fri\", \"Sat\"];\nvar now = new Date();\nvar theDay = now.getDay();\n\
    var nameOfToday = dayNames[theDay];\n```\n\nHere's what's going on:\n\n1. Creates\
    \ an array of days starting with \"Sun\" and assigns it to `dayNames`.\n2. Creates\
    \ a new `Date` object and assigns it to `now`.\n3. Extracts the day of the week\
    \ as a number and assigns it to `theDay`.\n4. Uses the day number as an index\
    \ to specify the correct array element, i.e. the day name.\n\nFind the interactive\
    \ coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/31.html](http://www.ASmarterWayToLearn.com/javascript/31.html)\n\
    \n## 32 Extracting Parts of the Date and Time\n\nHere's a summary of important\
    \ methods for extracting pieces of the `Date` object.\n\n![](images/00006.jpeg)\n\
    \nI covered `getDay` in the last chapter. Let's look at the rest of the extraction\
    \ methods. Like `getDay`, `getMonth` gives you not the spelled-out name of the\
    \ month shown in the `Date` object, but a number. The following code produces\
    \ a month number ranging from 0 for January through 11 for December.\n\n```javascript\n\
    var d = new Date();\nvar currentMonth = d.getMonth();\n```\n\n`getDate` gives\
    \ you a number for the day of the month.\n\n```javascript\nvar dayOfMonth = d.getDate();\n\
    ```\n\n`getFullYear` gives you a 4-digit number for the year.\n\n```javascript\n\
    var currYr = d.getFullYear();\n```\n\n`getHours` gives you a number from 0 through\
    \ 23 corresponding to midnight through 11 p.m.\n\n```javascript\nvar currentHrs\
    \ = d.getHours();\n```\n\n`getMinutes` gives you a number from 0 through 59.\n\
    \n```javascript\nvar currMins = d.getMinutes();\n```\n\n`getSeconds` gives you\
    \ a number from 0 through 59.\n\n```javascript\nvar currSecs = d.getSeconds()\n\
    ```\n\n`getMilliseconds` gives you a number from 0 through 999.\n\n```javascript\n\
    var currMills = d.getMilliseconds();\n```\n\n`getTime` gives you the number of\
    \ milliseconds that have elapsed since midnight, Jan. 1, 1970.\n\n```javascript\n\
    var millsSince = d.getTime();\n```\n\nFind the interactive coding exercises for\
    \ this chapter at: [http://www.ASmarterWayToLearn.com/js/32.html](http://www.ASmarterWayToLearn.com/javascript/32.html)\n\
    \n## 33 Specifying a Date and Time\n\nHow many days before the U.S. Social Security\
    \ program goes broke?\n\nLet's start with the estimated date. According to the\
    \ system's trustees, the money will run out in 2035. They didn't pin down an exact\
    \ date. Let's pick the middle of the year—June 30.\n\nOkay, that's the hard part—pinpointing\
    \ doomsday. Once we have that, constructing a day-by-day countdown is a JavaScript\
    \ romp.\n"
  raw: 'In the last chapter you learned to use parseInt to convert a string representing
    a number into an integer. And you learned to use parseFloat to convert a string
    representing a number into a floating-point number. You can finesse the distinction
    between integers and floating-point numbers by using Number. This handy conversion
    tool converts a string representing either an integer or a floating-point number
    to a number that''s identical to the one inside the parentheses.


    The following code converts the string "24" to the number 24.


    1 var integerString = "24"


    2 var num = Number(integerString);


    The following code converts the string "24.9876" to the number 24.9876.


    1 var floatingNumString = "24.9876";


    2 var num = Number(floatingNumString);


    Suppose your code has done an arithmetic calculation that yielded a big number.
    Now you want to present the result of the calculation to your user. But before
    you display the number, you want to format it with commas so it''s readable. In
    order to do that, you''ll have to convert the number to a string. This is how
    you do it.


    Converting a number to a string, perhaps so you can format it, is straightforward.


    1 var numberAsNumber = 1234;


    2 var numberAsString = numberAsNumber.toString();


    The code above converts the number 1234 to the string "1234" and assigns it to
    the variable numberAsString.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/29.html](http://www.ASmarterWayToLearn.com/javascript/29.html)


    # 30


    Controlling the length of decimals


    The price of the item is $9.95\. The sales tax is 6.5% of the price. You combine
    the two numbers to get the total.


    var total = price + (price * taxRate);


    The variable total now has a value of 10.59675.


    But that isn''t what you''re going to charge the customer, is it? You''re going
    to charge her an amount rounded off to two decimal places: $10.60.


    Here''s how to do it.


    var prettyTotal = total.toFixed(2);


    The statement above rounds the number represented by total to 2 places and assigns
    the result to the variable prettyTotal. The number inside the parentheses tells
    JavaScript how many places to round the decimal to.


    Now add a dollar sign, and you''re all set.


    var currencyTotal = "$" + prettyTotal;


    To shorten a number to no decimals, leave the parentheses empty.


    var prettyTotal = total.toFixed();


    Unfortunately, the toFixed method comes with a surprise inside. If a decimal ends
    in 5, it usually rounds up, as you would expect. But, depending on the browser,
    sometimes it rounds *down*! If, for example, you apply the method to 1.555, specifying
    2 decimal places, it may give you "1.56". Or it may produce "1.55".


    There are sophisticated ways to address the problem. Here''s an inelegant fix
    that uses methods you already know and understand.


    1 var str = num.toString();


    2 if (str.charAt(str.length - 1) === "5") {


    3   str = str.slice(0, str.length - 1) + "6";


    4 }


    5 num = Number(str);


    6 prettyNum = num.toFixed(2);


    If the decimal ends in a 5, the code changes it to a 6 so the method is forced
    to round up when it should. Here''s what''s happening, line-by-line:


    1.  Converts the number to a string and assigns it to the variable str.


    2.  Checks to see if the last character is "5".


    3.  If so, slices off the "5" and appends "6".


    4.  --


    5.  Converts it back to a number.


    6.  Rounds it to 2 places.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/30.html](http://www.ASmarterWayToLearn.com/javascript/30.html)


    # 31


    Getting the current date and time


    Your webpage includes a notice telling the user the current local date and time
    in his particular time zone. But what *is* the current date and time? Here''s
    how JavaScript finds out.


    var rightNow = new Date();


    The statement above creates something called a *Date object*. This is what it
    looks like.


    ![](images/00005.jpeg)


    Note that JavaScript gets this information from the user''s computer. It is only
    as accurate as the computer''s date and time settings. For example, if the user
    just moved from the U.S. West Coast to the U.S. East Coast and hasn''t reset the
    time zone on his computer, the computer will still be on Pacific Time. The Date
    object, too, will be on Pacific Time.


    The Date object may resemble a string, but it isn''t one. For example, you can''t
    use methods on it like charAt, indexOf, or slice.


    If you need the Date object to be a string, you can convert it to one the same
    way you convert a number to a string.


    var dateString = rightNow.toString();


    The code above converts the Date object represented by the variable rightNow to
    a string and assigns the string to the variable dateString.


    Most of the time, you''ll just want to extract some of the information from the
    Date object without converting it to a string.


    I''m going to show you how to extract the individual pieces of the Date object.
    In this chapter I''ll get you started with the first piece. In the next chapter
    I''ll cover the rest.


    The following code creates a new Date object, assigns it to the variable rightNow,
    extracts the day of the week, and assigns the day of the week to the variable
    theDay.


    1 var rightNow = new Date();


    2 var theDay = rightNow.getDay();


    In the diagram of the Date object that I showed you above, the day of the week
    was represented as "Mon." But when you extract the day of the week from the object,
    it''s represented as a number. Days are designated by a number from 0 for Sunday
    through 6 for Saturday. This means that you''ll need a bit of code to convert
    it back into a day name like "Mon."


    1 var dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];


    2 var now = new Date();


    3 var theDay = now.getDay();


    4 var nameOfToday = dayNames[theDay];


    Here''s what''s going on:


    1.  Creates an array of days starting with "Sun" and assigns it to dayNames.


    2.  Creates a new Date object and assigns it to now.


    3.  Extracts the day of the week as a number and assigns it to theDay.


    4.  Uses the day number as an index to specify the correct array element, i.e.
    the day name.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/31.html](http://www.ASmarterWayToLearn.com/javascript/31.html)


    # 32


    Extracting parts of the date and time


    Here''s a summary of important methods for extracting pieces of the Date object.


    ![](images/00006.jpeg)


    I covered getDay in the last chapter. Let''s look at the rest of the extraction
    methods. Like getDay, getMonth gives you not the spelled-out name of the month
    shown in the Date object, but a number. The following code produces a month number
    ranging from 0 for January through 11 for December.


    1 var d = new Date();


    2 var currentMonth = d.getMonth();


    getDate gives you a number for the day of the month.


    var dayOfMonth = d.getDate();


    getFullYear gives you a 4-digit number for the year.


    var currYr = d.getFullYear();


    getHours gives you a number from 0 through 23 corresponding to midnight through
    11 p.m.


    var currentHrs = d.getHours();


    getMinutes gives you a number from 0 through 59.


    var currMins = d.getMinutes();


    getSeconds gives you a number from 0 through 59.


    var currSecs = d.getSeconds()


    getMilliseconds gives you a number from 0 through 999.


    var currMills = d.getMilliseconds();


    getTime gives you the number of milliseconds that have elapsed since midnight,
    Jan. 1, 1970.


    var millsSince = d.getTime();


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/32.html](http://www.ASmarterWayToLearn.com/javascript/32.html)


    # 33


    Specifying a date and time


    How many days before the U.S. Social Security program goes broke?


    Let''s start with the estimated date. According to the system''s trustees, the
    money will run out in 2035\. They didn''t pin down an exact date. Let''s pick
    the middle of the year—June 30.


    Okay, that''s the hard part—pinpointing doomsday. Once we have that, constructing
    a day-by-day countdown is a JavaScript romp.'
