    ## 16 Arrays: Adding and removing elements


    As you learned in earlier chapters, you can declare an empty variable, one that
    doesn''t have a value. Then you can assign it a value whenever you like. And you
    can change its value at will. You can do all these things with an `array`, as
    well.


    This is how you declare an empty `array`.


    ```

    var pets = [];

    ```


    Assume that the `array` `pets` has already been declared. This is how you assign
    values to it.


    ```

    pets[0] = "dog";

    pets[1] = "cat";

    pets[2] = "bird";

    ```


    In the example above, I defined the first three elements of the `array`, in order.
    But you can legally leave gaps in an `array` if you choose to (not that you normally
    would). For example, suppose you start with the same empty `array` and code these
    lines.


    ```

    pets[3] = "lizard";

    pets[6] = "snake";

    ```


    Now, if you refer to `pets[3]`, you''ll get "lizard". If you refer to `pets[6]`,
    you''ll get "snake". But if you refer to `pets[0]` through `pets[2]` or `pets[4]`
    or `pets[5]`, you''ll get `undefined`.


    You can assign additional values to an `array` that already has values. Assume
    that the first three elements of the `array` `pets` are "dog", "cat", and "bird".
    Then you write this code.


    ```

    pets[3] = "lizard";

    pets[4] = "fish";

    pets[5] = "gerbil";

    pets[6] = "snake";

    ```


    Now the `array` has 7 elements: "dog", "cat", "bird", "lizard", "fish", "gerbil",
    and "snake".


    If you assign a new value to an `array` element that already has one, the old
    value is replaced by the new one.


    Using the keyword `pop()`, you can remove the last element of an `array`. Suppose
    you have an `array`, `pets`, whose elements are "dog", "cat", and "bird". The
    following code deletes the last element, "bird", leaving a two-element `array`.


    ```

    pets.pop();

    ```


    Using the keyword `push()`, you can add one or more elements to the end of an
    `array`. Suppose you have that same `array` consisting of "dog", "cat", and "bird".
    The following code adds two new elements to the end of the `array`.


    ```

    pets.push("fish", "ferret");

    ```


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/16.html](http://www.ASmarterWayToLearn.com/javascript/16.html)


    ## 17 Arrays: Removing, inserting, and extracting elements


    Use the `shift()` method to remove an element from the beginning of an `array`.
    Suppose you have an `array`, `pets`, whose elements are "dog", "cat", and "bird".
    The following removes the first element, "dog", leaving you with a two-element
    `array`.


    ```

    pets.shift();

    ```


    To add one or more elements to the beginning of an `array`, use the `unshift()`
    method. The following code adds two elements to the beginning of the `array`.


    ```

    pets.unshift("fish", "ferret");

    ```


    Use the `splice()` method to insert one or more elements anywhere in an `array`,
    while optionally removing one or more elements that come after it. Suppose you
    have an `array` with the elements "dog", "cat", "fly", "bug", "ox". The following
    code adds "pig", "duck", and "emu" after "cat" while removing "fly" and "bug".


    ```

    pets.splice(2, 2, "pig", "duck", "emu");

    ```


    The first digit inside the parentheses is the `index` of the position where you
    want to start adding if you''re adding and deleting if you''re deleting. The second
    digit is the number of existing elements to remove, starting with the first element
    that comes after the element(s) that you''re splicing in. The code above leaves
    you with an `array` consisting of "dog", "cat", "pig", "duck", "emu", and "ox".


    You could make additions without removing any elements. The following code adds
    "pig", "duck", and "emu" without removing any elements.


    ```

    pets.splice(2, 0, "pig", "duck", "emu");

    ```


    You can also remove elements without adding any. If you start with the elements
    "dog", "cat", "fly", "bug", and "ox", the following code removes two elements
    starting at `index` 3—"bug" and "ox". This leaves "dog", "cat", and "fly".


    ```

    pets.splice(2, 2);

    ```


    Use the `slice()` method to copy one or more consecutive elements in any position
    and put them into a new `array`. If you start with an `array`, `pets`, consisting
    of "dog", "cat", "fly", "bug", and "ox", the following code copies "fly" and "bug"
    to the new `array` `noPets` and leaves the original `array`, `pets`, unchanged.


    ```

    var noPets = pets.slice(2, 4);

    ```


    The first digit inside the parentheses is the `index` of the first element to
    be copied. The second digit is the `index` of the element after the last element
    to be copied.


    Two things could trip you up here:


    * Since the first `index` number inside the parentheses specifies the first element
    to be copied, you might think the second `index` number specifies the last element
    to be copied. In fact, the second number specifies the `index` number of the element
    after the last element to be copied.

    * You must assign the sliced elements to an `array`. It could, of course, be the
    same `array` from which you''re doing the slicing. In that case, you''d be reducing
    the original `array` to only the copied elements.


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/17.html](http://www.ASmarterWayToLearn.com/javascript/17.html)


    ## 18 `for` loops


    You know the song "99 Bottles of Beer on the Wall"? If you''re teaching someone
    the song, you could give them these instructions:


    1. Sing "99 bottles of beer on the wall, 99 bottles of beer."

    2. Sing "Take one down and pass it around, 98 bottles of beer on the wall."

    3. Sing "98 bottles of beer on the wall, 98 bottles of beer."

