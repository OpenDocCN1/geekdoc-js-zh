    DOM：


    添加节点


    利用 DOM 层次结构，你可以在文档的 head 或 body 部分的任何位置添加元素、属性和文本节点。在本章中，你将学习如何创建一个段落节点，为其赋予一个属性，并用文本内容填充它。在下一章中，你将学习如何将段落及其属性和文本内容插入到页面中。


    第一步是创建段落节点。


    ```

    var nodeToAdd = document.createElement("p");

    ```


    该示例创建了一个段落元素。要创建 `div` 元素，你可以在括号中放入 "div"。要创建图像元素，则放入 "img"。要创建链接，则放入 "a"，以此类推。


    以下语句创建了一个图像元素。


    ```

    var imgNodeToAdd = document.createElement("img");

    ```


    在上一章中，你学习了如何使用 `setAttribute` 为已存在于网页中的元素添加属性。对于已创建但尚未放入文档 body 中的元素，你也可以执行相同的操作。


    ```

    nodeToAdd.setAttribute("class", "regular");

    ```


    上面的代码为你刚刚创建的新段落元素赋予了类 "regular"。如果需要，你可以使用单独的语句为段落元素添加更多属性——例如，span、style，甚至 id。


    如果元素是 `<img>` 元素，你可以添加 border 或 alt 作为属性。如果是 `<a>` 元素，你可以添加网址。


    以下语句为图像元素添加了 border 属性。


    ```

    imgNodeToAdd.setAttribute("border", "1");

    ```


    上面的代码为图像添加了 1 像素的边框。


    请记住，此时我们只是在创建节点。新的属性节点已连接到新的元素节点，但我们尚未将节点添加到页面中。


    回到段落元素，我们已经创建了它并为其添加了类属性。现在让我们为其添加一些文本内容。同样，我们首先创建所需的节点。


    ```

    var newTxt = document.createTextNode("Hello!");

    ```


    上面的语句创建了一个内容为 "Hello!" 的文本节点。


    接下来，我们将文本放入段落元素中。


    ```

    nodeToAdd.appendChild(newTxt);

    ```


    上面的语句将内容为 "Hello!" 的新文本节点添加到新的段落节点中。


    现在，我们有了一个带有类属性和一些文本内容的新段落节点。我们已准备好将其插入到页面中。


