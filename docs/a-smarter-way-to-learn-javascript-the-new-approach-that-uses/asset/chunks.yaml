    2 var plan2 = new Plan("Premium", 5.99, 500, 5000, 50);


    3 var plan3 = new Plan("Ultimate", 9.99, 2000, 20000, 500);


    It''s common to use the same names for parameters and properties, but you don''t
    have to. You *could* write:


