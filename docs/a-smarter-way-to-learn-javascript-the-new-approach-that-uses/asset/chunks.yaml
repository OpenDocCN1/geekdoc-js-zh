    They don''t have to match. No matter what an argument''s name is, it is accepted
    by the parameter, no matter what the parameter''s name is. In the following code,
    the variable whatever is the argument. The parameter greeting doesn''t match the
    name, but still catches the value.


    Here''s the function, once again, with the parameter greeting.


    1 function greetUser(greeting) {


    2   alert(greeting);


    3 }


    And here''s the statement that calls the function, with the argument whatever.


    1 var whatever = "Hello, there.";


    2 greetUser(whatever);


