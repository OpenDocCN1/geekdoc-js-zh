  trans: "\n\n## 数字转换与字符串格式化\n\n在上一章中，你学会了使用 `parseInt` 将表示数字的字符串转换为整数，以及使用 `parseFloat`\
    \ 将表示数字的字符串转换为浮点数。你可以通过使用 `Number` 来巧妙处理整数和浮点数之间的区别。这个便捷的转换工具可以将表示整数或浮点数的字符串转换为与括号内数字完全相同的数值。\n\
    \n以下代码将字符串 \"24\" 转换为数字 24。\n\n```javascript\nvar integerString = \"24\"\nvar\
    \ num = Number(integerString);\n```\n\n以下代码将字符串 \"24.9876\" 转换为数字 24.9876。\n\n\
    ```javascript\nvar floatingNumString = \"24.9876\";\nvar num = Number(floatingNumString);\n\
    ```\n\n假设你的代码进行了一次算术运算，得到了一个很大的数字。现在你想将计算结果呈现给用户。但在显示这个数字之前，你想用逗号格式化它，使其更易读。为此，你需要将数字转换为字符串。具体做法如下。\n\
    \n将数字转换为字符串（例如为了格式化）是很直接的。\n\n```javascript\nvar numberAsNumber = 1234;\nvar numberAsString\
    \ = numberAsNumber.toString();\n```\n\n上面的代码将数字 1234 转换为字符串 \"1234\"，并将其赋值给变量\
    \ `numberAsString`。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/29.html`](http://www.ASmarterWayToLearn.com/javascript/29.html)\n\
    \n## 30 控制小数位数\n\n商品的价格是 $9.95。销售税是价格的 6.5%。你将这两个数字相加得到总价。\n\n```javascript\n\
    var total = price + (price * taxRate);\n```\n\n变量 `total` 现在的值是 10.59675。\n\n\
    但这并不是你要向顾客收取的金额，对吧？你要向她收取的是四舍五入到两位小数的金额：$10.60。\n\n具体做法如下。\n\n```javascript\n\
    var prettyTotal = total.toFixed(2);\n```\n\n上面的语句将 `total` 表示的数字四舍五入到 2 位小数，并将结果赋值给变量\
    \ `prettyTotal`。括号内的数字告诉 JavaScript 要将小数保留到多少位。\n\n现在加上美元符号，就大功告成了。\n\n```javascript\n\
    var currencyTotal = \"$\" + prettyTotal;\n```\n\n要将数字缩短到没有小数，只需将括号留空。\n\n```javascript\n\
    var prettyTotal = total.toFixed();\n```\n\n不幸的是，`toFixed` 方法有一个隐藏的陷阱。如果小数以 5 结尾，通常它会像你期望的那样向上舍入。但是，根据浏览器的不同，有时它会向下舍入！例如，如果你对\
    \ 1.555 应用该方法，并指定保留 2 位小数，它可能会给出 \"1.56\"，也可能产生 \"1.55\"。\n\n有一些复杂的方法可以解决这个问题。这里有一个不太优雅的修复方法，使用了你已经了解和掌握的方法。\n\
    \n```javascript\nvar str = num.toString();\nif (str.charAt(str.length - 1) ===\
    \ \"5\") {\n  str = str.slice(0, str.length - 1) + \"6\";\n}\nnum = Number(str);\n\
    prettyNum = num.toFixed(2);\n```\n\n如果小数以 5 结尾，代码会将其改为 6，从而强制该方法在应该向上舍入时进行向上舍入。以下是逐行解释：\n\
    \n1. 将数字转换为字符串并赋值给变量 `str`。\n2. 检查最后一个字符是否为 \"5\"。\n3. 如果是，则截掉 \"5\" 并追加 \"6\"\
    。\n4. --\n5. 将其转换回数字。\n6. 将其四舍五入到 2 位小数。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/30.html`](http://www.ASmarterWayToLearn.com/javascript/30.html)\n\
    \n## 31 获取当前日期和时间\n\n你的网页中包含一条通知，告知用户其所在时区的当前本地日期和时间。但当前的日期和时间是多少呢？JavaScript\
    \ 是这样获取的。\n\n```javascript\nvar rightNow = new Date();\n```\n\n上面的语句创建了一个称为 `Date`\
    \ 对象的东西。它看起来像这样。\n\n![](img/00005.jpeg)\n\n请注意，JavaScript 是从用户的计算机获取此信息的。其准确性取决于计算机的日期和时间设置。例如，如果用户刚从美国西海岸搬到美国东海岸，并且没有重置计算机上的时区，那么计算机仍将使用太平洋时间。`Date`\
    \ 对象也将使用太平洋时间。\n\n`Date` 对象可能看起来像字符串，但它不是。例如，你不能对其使用像 `charAt`、`indexOf` 或 `slice`\
    \ 这样的方法。\n\n如果你需要将 `Date` 对象转换为字符串，可以像将数字转换为字符串一样进行转换。\n\n```javascript\nvar dateString\
    \ = rightNow.toString();\n```\n\n上面的代码将变量 `rightNow` 表示的 `Date` 对象转换为字符串，并将该字符串赋值给变量\
    \ `dateString`。\n\n大多数情况下，你只想从 `Date` 对象中提取一些信息，而不将其转换为字符串。\n\n我将向你展示如何提取 `Date`\
    \ 对象的各个部分。在本章中，我将从第一部分开始介绍。下一章将介绍其余部分。\n\n以下代码创建一个新的 `Date` 对象，将其赋值给变量 `rightNow`，提取星期几，并将星期几赋值给变量\
    \ `theDay`。\n\n```javascript\nvar rightNow = new Date();\nvar theDay = rightNow.getDay();\n\
    ```\n\n在我上面展示的 `Date` 对象示意图中，星期几表示为 \"Mon\"。但是当你从对象中提取星期几时，它是以数字形式表示的。星期几用 0（星期日）到\
    \ 6（星期六）的数字表示。这意味着你需要一些代码将其转换回像 \"Mon\" 这样的星期名称。\n\n```javascript\nvar dayNames\
    \ = [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"];\nvar now\
    \ = new Date();\nvar theDay = now.getDay();\nvar nameOfToday = dayNames[theDay];\n\
    ```\n\n以下是具体过程：\n\n1. 创建一个以 \"Sun\" 开头的星期数组，并将其赋值给 `dayNames`。\n2. 创建一个新的 `Date`\
    \ 对象，并将其赋值给 `now`。\n3. 将星期几作为数字提取出来，并赋值给 `theDay`。\n4. 使用星期数字作为索引来指定正确的数组元素，即星期名称。\n\
    \n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/31.html`](http://www.ASmarterWayToLearn.com/javascript/31.html)\n\
    \n## 32 提取日期和时间的各个部分\n\n以下是提取 `Date` 对象各部分的重要方法总结。\n\n![](img/00006.jpeg)\n\n\
    我在上一章中介绍了 `getDay`。现在让我们看看其他的提取方法。与 `getDay` 类似，`getMonth` 返回的不是 `Date` 对象中显示的月份全名，而是一个数字。以下代码生成一个月份数字，范围从\
    \ 0（一月）到 11（十二月）。\n\n```javascript\nvar d = new Date();\nvar currentMonth = d.getMonth();\n\
    ```\n\n`getDate` 返回一个表示月份中第几天的数字。\n\n```javascript\nvar dayOfMonth = d.getDate();\n\
    ```\n\n`getFullYear` 返回一个四位数的年份数字。\n\n```javascript\nvar currYr = d.getFullYear();\n\
    ```\n\n`getHours` 返回一个从 0（午夜）到 23（晚上 11 点）的数字。\n\n```javascript\nvar currentHrs\
    \ = d.getHours();\n```\n\n`getMinutes` 返回一个从 0 到 59 的数字。\n\n```javascript\nvar\
    \ currMins = d.getMinutes();\n```\n\n`getSeconds` 返回一个从 0 到 59 的数字。\n\n```javascript\n\
    var currSecs = d.getSeconds()\n```\n\n`getMilliseconds` 返回一个从 0 到 999 的数字。\n\n\
    ```javascript\nvar currMills = d.getMilliseconds();\n```\n\n`getTime` 返回自 1970\
    \ 年 1 月 1 日午夜以来经过的毫秒数。\n\n```javascript\nvar millsSince = d.getTime();\n```\n\n\
    本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/32.html`](http://www.ASmarterWayToLearn.com/javascript/32.html)\n\
    \n## 33 指定日期和时间\n\n距离美国社会保障计划资金耗尽还有多少天？\n\n我们先从预估日期开始。根据该系统的受托人，资金将在 2035 年耗尽。他们没有确定具体日期。我们就选年中——6\
    \ 月 30 日。\n\n好了，最难的部分——确定末日——已经完成。一旦有了这个日期，构建一个逐日倒计时对 JavaScript 来说就是小菜一碟。\n\n"
- fmt: "\nYou already know how to do the first step, creating a `Date` object for\
    \ the current date and time:\n\n```javascript\nvar today = new Date();\n```\n\n\
    Next, you create a second `Date` object. But this time you specify the future\
    \ date, June 30, 2035.\n\n```javascript\nvar doomsday = new Date(\"June 30, 2035\"\
    );\n```\n\nNotice how the date is specified. It's in quotes. The month is spelled\
    \ out. There's a comma after the day of the month. The year is expressed in four\
    \ digits.\n\nNext, you extract from both dates the milliseconds that have elapsed\
    \ since the reference date of January 1, 1970.\n\n```javascript\nvar msToday =\
    \ today.getTime();\nvar msDoomsday = doomsday.getTime();\n```\n\nYou calculate\
    \ the difference.\n\n```javascript\nvar msDiff = msDoomsday - msToday;\n```\n\n\
    Some simple math converts the milliseconds to days.\n\n```javascript\nvar dDiff\
    \ = msDiff / (1000 * 60 * 60 * 24);\n```\n\nThe huge number created by the math\
    \ inside the parentheses converts the milliseconds into seconds (`1000`), minutes\
    \ (`60`), hours (`60`), and days (`24`).\n\nYou want a number that represents\
    \ whole days, so you round down. The following statement rounds the number of\
    \ days, which is probably a floating-point number, down to an integer.\n\n```javascript\n\
    dDiff = Math.floor(dDiff);\n```\n\nHere's the whole thing, condensed into something\
    \ that looks more like production code:\n\n```javascript\nvar msDiff = new Date(\"\
    June 30, 2035\").getTime() - new Date().getTime();\nvar daysTillDoom = Math.floor(msDiff\
    \ / (1000 * 60 * 60 * 24));\n```\n\nLine 1 subtracts the milliseconds since the\
    \ reference date of the current moment from the milliseconds since the reference\
    \ date of June 30, 2035. Line 2 converts the milliseconds to days and rounds down.\n\
    \nIf the time is important, you can specify that as well.\n\n```javascript\nvar\
    \ d = new Date(\"July 21, 1983 13:25:00\");\n```\n\nNote the form used to specify\
    \ the time: No comma after the date. 24-hour time. Colons separating hours, minutes,\
    \ and seconds.\n\nFind the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/33.html](http://www.ASmarterWayToLearn.com/javascript/33.html)\n\
    \n# 34 Changing elements of a date and time\n\nYou can change individual elements\
    \ of a `Date` object. Here's a summary:\n\n![](images/00007.jpeg)\n\n`setFullYear`\
    \ sets the year of an existing `Date` object without changing any other element.\n\
    \n```javascript\nvar d = new Date();\nd.setFullYear(2001);\n```\n\nLine 1 creates\
    \ a new `Date` object for the current moment. Line 2 changes the year of the `Date`\
    \ object to 2001, leaving all other elements of the `Date` object intact.\n\n\
    `setMonth` sets the month of an existing `Date` object without changing any other\
    \ element.\n\n```javascript\nvar d = new Date();\nd.setMonth(11);\n```\n\nLine\
    \ 1 creates a new `Date` object for the current moment. Line 2 changes the month\
    \ of the `Date` object to 11 (December), leaving all other elements of the `Date`\
    \ object intact.\n\n`setDate` sets the day of the month of an existing `Date`\
    \ object without changing any other element.\n\n```javascript\nvar d = new Date();\n\
    d.setDate(15);\n```\n\nLine 1 creates a new `Date` object for the current moment.\
    \ Line 2 changes the date of the `Date` object to the 15th of the month, leaving\
    \ all other elements of the `Date` object intact.\n\n`setHours` sets the hours\
    \ of an existing `Date` object without changing any other element.\n\n```javascript\n\
    var d = new Date();\nd.setHours(13);\n```\n\nLine 1 creates a new `Date` object\
    \ for the current moment. Line 2 changes the hours of the `Date` object to the\
    \ 13th hour (1 p.m.), leaving all other elements of the `Date` object intact.\n\
    \n`setMinutes` sets the minutes of an existing `Date` object without changing\
    \ any other element.\n\n```javascript\nvar d = new Date();\nd.setMinutes(05);\n\
    ```\n\nLine 1 creates a new `Date` object for the current moment. Line 2 changes\
    \ the minutes of the `Date` object to 5 minutes after the hour, leaving all other\
    \ elements of the `Date` object intact.\n\n`setSeconds` sets the seconds of an\
    \ existing `Date` object without changing any other element.\n\n```javascript\n\
    var d = new Date();\nd.setSeconds(55);\n```\n\nLine 1 creates a new `Date` object\
    \ for the current moment. Line 2 changes the seconds of the `Date` object to the\
    \ 55 seconds after the minute, leaving all other elements of the `Date` object\
    \ intact.\n\n`setMilliseconds` sets the milliseconds of an existing `Date` object\
    \ without changing any other element.\n\n```javascript\nvar d = new Date();\n\
    d.setMilliseconds(867);\n```\n\nLine 1 creates a new `Date` object for the current\
    \ moment. Line 2 changes the milliseconds of the `Date` object to 867 milliseconds\
    \ after the second, leaving all other elements of the `Date` object intact.\n\n\
    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/34.html](http://www.ASmarterWayToLearn.com/javascript/34.html)\n\
    \n# 35 Functions\n\nA function is a block of JavaScript that robotically does\
    \ the same thing again and again, whenever you invoke its name. It saves you repetitive\
    \ coding and makes your code easier to understand.\n\nOn your website, suppose\
    \ there are several pages where you want to display an alert that tells the user\
    \ the current time. (To keep it simple, we'll settle for 24-hour time rather than\
    \ converting to a.m. and p.m.) The code might look like this.\n\n```javascript\n\
    var now = new Date();\nvar theHr = now.getHours();\nvar theMin = now.getMinutes();\n\
    alert(\"time: \" + theHr + \":\" + theMin);\n```\n\nYou could write this block\
    \ of code over and over again, every time you need it. Or you could write it once\
    \ as a function, naming it, say, `tellTime`. After that, this is the only code\
    \ you'll need in order to make the whole block execute:\n\n`tellTime();`\n\nWhenever\
    \ JavaScript sees that short statement, the time-telling block executes.\n\nThis\
    \ is how you package the one-off code above as a repeatable function:\n\n```javascript\n\
    function tellTime() {\n  var now = new Date();\n  var theHr = now.getHours();\n\
    \  var theMin = now.getMinutes();\n  alert(\"Current time: \"+ theHr + \":\" +\
    \ theMin);\n}\n```\n\nThe time-telling code—the code that creates the `Date` object,\
    \ extracts the time, formats it, and displays an alert—is exactly the same code\
    \ we started with, but is now packaged as a function. Here are the parts:\n\n\
    1. On line 1 an opening declaration statement that includes:\n   - the keyword\
    \ `function`\n   - a name I made up for the function\n   - parentheses that identify\
    \ it as a function\n   - an opening curly bracket to enclose the code that will\
    \ execute\n2. On lines 2 through 5 the same block of code that you saw before\
    \ executes, but it's indented for clarity. Opinions vary on how much to indent.\
    \ I train you to indent 2 spaces.\n3. On line 6 a closing curly bracket on its\
    \ own line to enclose the code that will execute\n\nAgain, note that the calling\
    \ code—the code that invokes the function—does nothing more than state the name\
    \ of the function including its parentheses.\n\n`tellTime();`\n\nYou can give\
    \ a function any name that would be a legal variable name, then add parentheses.\
    \ Function-naming follows the same rules as variable naming because, technically,\
    \ a function *is* a variable. This will make more sense to you when you learn\
    \ more about functions in a subsequent chapter.\n\nFunctions and the statements\
    \ that call them may be separated by thousands of lines of code. Typically, functions\
    \ are in the same place as the main code—in an external JavaScript file, at the\
    \ end of the HTML body section, or in the HTML head section. Normally, all the\
    \ functions should precede the main code, so when they're called by the main code,\
    \ they're already loaded in memory and ready to go.\n\nFind the interactive coding\
    \ exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/35.html](http://www.ASmarterWayToLearn.com/javascript/35.html)\n\
    \n# 36 Functions: Passing them data\n\nA function is a block of code that does\
    \ something robotically, whenever you invoke its name. For example, when you write\
    \ `greetUser();` a function with that name executes. To be clear: The kind of\
    \ function I'm talking about is one that you've written yourself, and named yourself.\n\
    \nSuppose that when you write `greetUser();` a function is called that displays\
    \ an alert saying, \"Hello, there.\"\n\nThis is the code for the function.\n\n\
    ```javascript\nfunction greetUser() {\n  alert(\"Hello, there.\");\n}\n```\n"
