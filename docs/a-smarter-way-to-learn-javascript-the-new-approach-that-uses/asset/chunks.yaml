- fmt: '

    *   **If you have an authority problem, try to get over it.** When you start doing
    the exercises, you''ll find that I can be a pain about insisting that you get
    every little detail right. For example, if you indent a line one space instead
    of two spaces, the program monitoring your work will tell you the code isn''t
    correct, even though it would still run perfectly. Do I insist on having everything
    just so because I''m a control freak? No, it''s because I have to place a limit
    on harmless maverick behavior in order to automate the exercises. If I were to
    grant you as much freedom as you might like, creating the algorithms that check
    your work would be, for me, a project of driverless-car proportions. Besides,
    learning to write code with fastidious precision helps you learn to pay close
    attention to details, a fundamental requirement for coding in any language.

    *   **Subscribe, temporarily, to my formatting biases.** Current code formatting
    is like seventeenth-century spelling. Everyone does it his own way. There are
    no universally accepted standards. But the algorithms that check your work when
    you do the interactive exercises need standards. They can''t grant you the latitude
    that a human teacher could, because, let''s face it, they aren''t that bright.
    So I''ve had to settle on certain conventions. All of the conventions I teach
    are embraced by a large segment of the coding community, so you''ll be in good
    company. But that doesn''t mean you''ll be married to my formatting biases forever.
    When you begin coding projects, you''ll soon develop your own opinions or join
    an organization that has a stylebook. Until then, I''ll ask you to make your code
    look like my code.

    *   **Email me with any problems or questions.** The book and exercises have been
    tested on many learners, but haven''t been tested on you. If you hit a snag, if
    you''re just curious about something, or if I''ve found some way to give you fits,
    email me at `mark@ASmarterWayToLearn.com`. I''ll be happy to hear from you. I''ll
    reply promptly. And, with your help, I''ll probably learn something that improves
    the next edition.


    # 1 Alerts


    An alert is a box that pops up to give the user a message. Here''s code for an
    alert that displays the message "Thanks for your input!"


    ```javascript

    alert("Thanks for your input!");

    ```


    `alert` is a keyword—that is, a word that has special meaning for JavaScript.
    It means, "Display, in an alert box, the message that follows." Note that `alert`
    isn''t capitalized. If you capitalize it, the script will stop.


    The parentheses are a special requirement of JavaScript, one that you''ll soon
    get used to. You''ll be typing parens over and over again, in all kinds of JavaScript
    statements.


    In coding, the quoted text `"Thanks for your input!"` is called a text string
    or simply a string. The name makes sense: it''s a string of characters enclosed
    in quotes. Outside the coding world, we''d just call it a quotation.


    Note that the opening parenthesis is jammed up against the keyword, and the opening
    quotation mark is hugging the opening parenthesis. Since JavaScript ignores spaces
    (except in text strings), you could write...


    ```javascript

    alert ( "Thanks for your input!" );

    ```


    But I want you to know the style conventions of JavaScript, so I''ll ask you to
    always omit spaces before and after parentheses.


    In English, a careful writer ends every declarative sentence with a period. In
    scripting, a careful coder ends every statement with a semicolon. (Sometimes complex,
    paragraph-like statements end with a curly bracket instead of a semicolon. That''s
    something I''ll cover in a later chapter.) A semicolon isn''t always necessary,
    but it''s easier to end every statement with a semicolon, rather than stop to
    figure out whether you need one. In this training, I''ll ask you to end every
    statement (that doesn''t end with a curly bracket) with a semicolon.


    ![](images/00001.jpeg)


    *   Some coders write `window.alert` instead of, simply, `alert`. This is a highly
    formal but perfectly correct way to write it. Most coders prefer the short form.
    We''ll stick to the short form in this training.

    *   In the example above, some coders would use single rather than double quotation
    marks. This is legal, as long as it''s a matching pair. But in a case like this,
    I''ll ask you to use double quotation marks.


    Find the interactive coding exercises for this chapter at:

    [http://www.ASmarterWayToLearn.com/js/1.html](http://www.ASmarterWayToLearn.com/javascript/1.html)


    # 2 Variables for Strings


    Please memorize the following facts.

    *   My name is Mark.

    *   My nationality is U.S.


    Now that you''ve memorized my name and nationality, I won''t have to repeat them,
    literally, again. If I say to you, "You probably know other people who have my
    name," you''ll know I''m referring to "Mark."


    If I ask you whether my nationality is the same as yours, I won''t have to ask,
    "Is your nationality the same as U.S.?" I''ll ask, "Is your nationality the same
    as my nationality?" You''ll remember that when I say "my nationality," I''m referring
    to "U.S.", and you''ll compare your nationality to "U.S.", even though I haven''t
    said "U.S." explicitly.


    In these examples, the terms "my name" and "my nationality" work the same way
    JavaScript variables do. My name is a term that refers to a particular value,
    `"Mark"`. In the same way, a variable is a word that refers to a particular value.


    A variable is created when you write `var` (for variable) followed by the name
    that you choose to give it. It takes on a particular value when you assign the
    value to it. This is a JavaScript statement that creates the variable name and
    assigns the value `"Mark"` to it.


    ```javascript

    var name = "Mark";

    ```


    Now the variable `name` refers to the text string `"Mark"`.


    Note that it was my choice to call it `name`. I could have called it `myName`,
    `xyz`, `lol`, or something else. It''s up to me how to name my variables, within
    limits.


    With the string `"Mark"` assigned to the variable `name`, my JavaScript code doesn''t
    have to specify `"Mark"` again. Whenever JavaScript encounters `name`, JavaScript
    knows that it''s a variable that refers to `"Mark"`.


    For example, if you ask JavaScript to print `name`, it remembers the value that
    `name` refers to, and prints...


    `Mark`


    The value that a variable refers to can change.


    Let''s get back to the original examples, the facts I asked you to memorize. These
    facts can change, and if they do, the terms my name and my nationality will refer
    to new values.


    I could go to court and change my name to Ace. Then my name is no longer Mark.
    If I want you to address me correctly, I''ll have to tell you that my name is
    now Ace. After I tell you that, you''ll know that my name doesn''t refer to the
    value it used to refer to (`Mark`), but refers to a new value (`Ace`).


    If I transfer my nationality to U.K., my nationality is no longer U.S. It''s U.K.
    If I want you to know my nationality, I''ll have to tell you that it is now U.K.
    After I tell you that, you''ll know that my nationality doesn''t refer to the
    original value, `"U.S."`, but now refers to a new value.


    JavaScript variables can also change.


    If I code...


    ```javascript

    var name = "Mark";

    ```


    `name` refers to `"Mark"`. Then I come along and code the line...


    ```javascript

    name = "Ace";

    ```


    Before I coded the new line, if I asked JavaScript to print `name`, it printed...


    `Mark`


