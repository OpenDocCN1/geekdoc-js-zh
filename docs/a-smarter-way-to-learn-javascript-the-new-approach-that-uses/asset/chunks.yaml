  trans: "\n\n4. 唱“拿下一瓶递过去，墙上还有 97 瓶啤酒。”\n5. 唱“墙上 97 瓶啤酒，97 瓶啤酒。”\n6. 唱“拿下一瓶递过去，墙上还有\
    \ 96 瓶啤酒。”\n\n……以此类推，还有 192 行指令。\n\n但这不是你给出指令的方式，对吧？你会更简洁。你会这样说：\n\n唱“墙上 99 瓶啤酒，99\
    \ 瓶啤酒。拿下一瓶递过去，墙上还有 98 瓶啤酒。”重复此过程，每次减 1，直到墙上没有啤酒瓶为止。\n\n## 循环简介\n\n在编程中，你经常会遇到类似啤酒瓶的情况。例如，假设你主动提出要检查用户所在城市是否是美国最干净的\
    \ 5 个城市之一。用户输入了她的城市，你将她的城市赋值给变量 `cityToCheck`。\n\n你已经将最干净的 5 个城市列表赋值给了数组 `cleanestCities`。\n\
    \n```javascript\nvar cleanestCities = [\"Cheyenne\", \"Santa Fe\", \"Tucson\"\
    , \"Great Falls\", \"Honolulu\"];\n```\n\n现在你遍历数组，看是否与用户所在城市匹配。如果匹配，你显示一个 `alert`\
    \ 告诉用户她的城市是最干净的城市之一。如果没有匹配，你显示一个 `alert` 告诉用户她的城市不在列表中。\n\n```javascript\nif (cityToCheck\
    \ === cleanestCities[0]) {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[1]) {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[2]) {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[3]) {\n    alert(\"它是最干净的城市之一\");\n}\nelse if (cityToCheck\
    \ === cleanestCities[4]) {\n    alert(\"它是最干净的城市之一\");\n}\nelse {\n    alert(\"\
    它不在列表中\");\n}\n```\n\n方便的是，JavaScript 提供了一种更简洁的编码方式。下面是一个 `for` 循环，它完成了上面冗长代码的大部分功能。\n\
    \n```javascript\nfor (var i = 0; i <= 4; i++) {\n   if (cityToCheck === cleanestCities[i])\
    \ {\n     alert(\"它是最干净的城市之一\");\n   }\n}\n```\n\n### 分解 `for` 循环\n\n第一行以关键字 `for`\
    \ 开头。定义循环的三个规范位于括号内：\n\n1. 声明一个变量，用于计数迭代次数，并作为变化的数组索引，将其设置为起始值，此处为 `0`。\n2. 定义循环的限制。此处，只要计数器不超过\
    \ `4`，循环就继续运行。由于计数器从 `0` 开始，循环将运行 5 次。\n3. 每次循环结束时对计数器进行的操作。此处，每次计数器递增。\n\n括号内的三个规范顺序始终相同：\n\
    1. 计数器的名称（通常为 `i`）及其起始值（通常为 `0`）\n2. 循环运行的次数（此处为数组元素的数量）\n3. 每次迭代后如何更改计数器（通常每次加\
    \ 1）\n\n### 注意事项\n\n* 在示例中，计数器 `i` 有两个作用。它跟踪迭代次数，以便循环在正确的位置停止；同时它作为数组的索引号，使得代码能够在每次迭代计数器递增时遍历数组的所有元素。\n\
    * 使用 `i` 作为计数器并非神圣不可改变。你可以使用任何合法的变量名。但程序员通常使用 `i`，因为它使第一行更紧凑，并且程序员理解 `i` 代表“迭代”。\n\
    * 在示例中，初始计数为 `0`，即数组第一个元素的索引号。但根据需求，它可以是任何数字。\n* 在示例中，计数器每次迭代递增。但根据需求，你可以递减、每次增加\
    \ 2，或以其他方式更改。\n* 在示例中，我指定循环在 `i <= 4` 时运行。或者，我可以指定 `i < 5`。无论哪种方式，由于计数器从 `0` 开始，循环运行\
    \ 5 次。\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/18.html`](http://www.ASmarterWayToLearn.com/javascript/18.html)\n\
    \n## 19. `for` 循环：标志、布尔值、数组长度和循环中断\n\n上一章给出的 `for` 循环示例存在几个问题。第一个问题是潜在的沟通问题。如果用户所在城市与最干净城市列表匹配，会显示一个确认的\
    \ `alert`。但如果没有匹配，则什么也不会发生，用户被蒙在鼓里。如果没有找到匹配，我们需要显示一个 `alert` 说明情况。\n\n### 使用标志和布尔值\n\
    \n我们使用一个“标志”来实现。标志就是一个变量，它以一个你给定的默认值开始，然后在特定条件下切换为另一个值。在我们的示例中，假设标志如下：\n\n```javascript\n\
    var matchFound = \"no\";\n```\n\n如果找到匹配，标志的值被更改。最后，如果标志没有被更改——如果它仍然保持原始值 `\"no\"\
    `——则意味着没有找到匹配，因此我们显示一个 `alert` 说明城市不在列表中。\n\n```javascript\nvar matchFound = \"\
    no\";\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i])\
    \ {\n        matchFound = \"yes\";\n        alert(\"它是最干净的城市之一\");\n    }\n}\n\
    if (matchFound === \"no\") {\n    alert(\"它不在列表中\");\n}\n```\n\n这样可行，但通常不将字符串\
    \ `\"no\"` 和 `\"yes\"` 赋给开关，而是使用布尔值 `false` 和 `true`。\n\n```javascript\nvar matchFound\
    \ = false;\nfor (var i = 0; i <= 4; i++) {\n    if (cityToCheck === cleanestCities[i])\
    \ {\n        matchFound = true;\n        alert(\"它是最干净的城市之一\");\n    }\n}\nif\
    \ (matchFound === false) {\n    alert(\"它不在列表中\");\n}\n```\n\n布尔值只有两个：`true` 和\
    \ `false`。注意它们不需要用引号括起来。\n\n### 使用 `break` 优化\n\n我们示例的下一个问题是它可能浪费计算周期。假设在第二次循环时找到了匹配并显示了\
    \ `alert`。按照循环的编码方式，循环会一直运行到结束。这是不必要的，因为我们在第二次循环时已经得到了答案。这个问题可以通过关键字 `break` 解决。\n\
    \n```javascript\nvar matchFound = false;\nfor (var i = 0; i <= 4; i++) {\n   \
    \ if (cityToCheck === cleanestCities[i]) {\n        matchFound = true;\n     \
    \   alert(\"它是最干净的城市之一\");\n        break;\n    }\n}\nif (matchFound === false)\
    \ {\n    alert(\"它不在列表中\");\n}\n```\n\n### 动态数组长度\n\n最后一个问题：在示例中，我假设数组元素的数量是已知的。但如果不知道呢？JavaScript\
    \ 有一种方法可以找出。以下代码将数组 `cleanestCities` 中的元素数量赋值给变量 `numElements`。\n\n```javascript\n\
    var numElements = cleanestCities.length;\n```\n\n现在我们可以将循环次数限制为 JavaScript 计算出的数量。\n\
    \n```javascript\nvar numElements = cleanestCities.length;\nvar matchFound = false;\n\
    for (var i = 0; i < numElements; i++) {\n    if (cityToCheck === cleanestCities[i])\
    \ {\n        matchFound = true;\n        alert(\"它是最干净的城市之一\");\n        break;\n\
    \    }\n}\nif (matchFound === false) {\n    alert(\"它不在列表中\");\n}\n```\n\n现在，只要\
    \ `i` 小于元素数量，循环就会继续。（由于长度编号从 1 开始，而 `i` 编号从 0 开始，我们需要在长度值之前停止 1。）\n\n本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/19.html`](http://www.ASmarterWayToLearn.com/javascript/19.html)\n\
    \n## 20. 嵌套 `for` 循环\n\n大西洋唱片公司雇佣了你和我来为未来的说唱明星生成一份名字列表。为了简化，我们首先分别列出一些名和姓。\n\n"
- fmt: "\n![](images/00004.jpeg)\n\nBy combining each of the first names with each\
    \ of the last names, we can generate 20 different full names for rappers.\n\n\
    Starting with \"BlueRay,\" we go through the list of last names, generating...\n\
    \nBlueRay Zzz\nBlueRay Burp\nBlueRay Dogbone\nBlueRay Droop\n\nWe move to the\
    \ next first name, \"Upchuck.\" Again, we go through the list of last names, generating...\n\
    \nUpchuck Zzz\nUpchuck Burp\nUpchuck Dogbone\nUpchuck Droop\n\nAnd so on, combining\
    \ each first name with each last name.\n\nBut look, why not have JavaScript do\
    \ the repetitive work? We'll use nested `for` statements.\n\n```javascript\nvar\
    \ firstNames = [\"BlueRay \", \"Upchuck \", \"Lojack \", \"Gizmo \", \"Do-Rag\
    \ \"];\nvar lastNames = [\"Zzz\", \"Burp\", \"Dogbone\", \"Droop\"];\nvar fullNames\
    \ = [];\n\nfor (var i = 0; i < firstNames.length; i++) {\n  for (var j = 0; j\
    \ < lastNames.length; j++) {\n    fullNames.push(firstNames[i] + lastNames[j]);\n\
    \  }\n}\n```\n\n### Things to think about:\n\n* The inner loop runs a complete\
    \ cycle of iterations on each iteration of the outer loop. If the outer loop counter\
    \ is `i` and the inner loop counter is `j`, `j` will loop through 0, 1, 2, and\
    \ all the way to the end while `i` is on 0. Then `i` will increment to 1, and\
    \ `j` will loop through all of its values again. The outer loop is the minute\
    \ hand of a clock. The inner loop is the second hand.\n* You can have as many\
    \ levels of nesting as you like.\n* A nested loop is indented 2 spaces beyond\
    \ its outer loop.\n\nFind the interactive coding exercises for this chapter at:\
