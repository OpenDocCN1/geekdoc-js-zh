    # 71


    ## 对象：方法


    让我们回到显示不同托管方案的图表。


    ![](img/00016.jpeg)


    我们将编写一个函数，根据此图表计算年费。请注意，如果用户在一年中的某些时间注册，他将获得全年折扣。如果他在七月或八月注册 Basic 方案，他将获得 20%
    的折扣。如果他在七月、八月或十二月注册 Professional 方案，他将获得 20% 的折扣。如果他在七月或八月注册 Ultimate 方案，他将获得
    20% 的折扣。


    我们首先创建三个带有属性的对象。这是代表 Basic 方案的对象及其属性。


    ```

    1 var plan1 = {

    2   name: "Basic",

    3   price: 3.99,

    4   space: 100,

    5   transfer: 1000,

    6   pages: 10,

    7   discountMonths: [6, 7]

    8 };

    ```


    该函数遍历所有折扣月份（第 5 行），检查是否有任何月份恰好是当前月份（第 6 行）。如果是，则通过将常规价格乘以 0.8 来计算 20% 的折扣。然后，将折扣后或未折扣的月价格乘以
    12，得到年价格，并将该数字返回给调用代码（第 11 行）。


    ```

    1  function calcAnnual() {

    2    var bestPrice = plan1.price;

    3    var currDate = new Date();

    4    var thisMo = currDate.getMonth();

    5    for (var i = 0; i < plan1.discountMonths.length; i++) {

    6      if (plan1.discountMonths[i] === thisMo) {

    7        bestPrice = plan1.price * .8;

    8        break;

    9      }

    10   }

    11   return bestPrice * 12;

    12 }

    ```


    这是执行该函数的调用语句。


    ```

    var annualPrice = calcAnnual();

    ```

