  trans: "\n\n在 switch 语句中，`default` 代码是可选的，就像 `if` 语句中 `else` 代码是可选的。如果没有 `default`\
    \ 代码，且没有任何 case 测试为真，则什么也不会发生。\n\n当没有 `default` 代码时，细心的程序员仍然会在最后一个条件后加上 `break`\
    \ 语句作为保险，即使它可能是多余的。如果你以后决定在末尾添加一个新条件，就不必记得为上面的块添加 break，以避免灾难性的语句级联。\n\n本章的交互式编程练习请访问：\n\
    \n[`www.ASmarterWayToLearn.com/js/40.html`](http://www.ASmarterWayToLearn.com/javascript/40.html)\n\
    \n# 41\n\n## `while` 循环\n\n这个 `for` 循环在每次迭代时显示一个警告框。\n\n```\nfor (var i = 0; i\
    \ <= 3; i++) {\n  alert(i);\n}\n```\n\n如你所知，该过程由括号内的三个术语控制：\n\n*   `var i = 0`\
    \ 建立一个计数器。\n*   `i <= 3` 表示只要 `i` 小于或等于 3，循环就继续运行。由于 `i` 初始赋值为 0，循环将运行 4 次。\n\
    *   `i++` 在每次迭代时递增 `i`。\n\n所有关于如何循环的指令都集中在括号之间：从哪里开始计数，循环持续多久，以及每次如何更新计数器。\n\n\
    `while` 循环做同样的事情，但组织方式不同。只有中间项（循环持续多久）放在括号内。计数器在 `while` 块的第一行*之前*定义。计数器在循环运行时执行的代码*内部*更新。\n\
    \n```\nvar i = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\n在其他方面，`while`\
    \ 循环的组织方式与 `for` 循环类似。\n\n*   括号包围循环限制条件。\n*   花括号包围要执行的代码。\n*   要执行的代码缩进 2 个空格。\n\
    \n由于任何 `for` 循环都可以转换为 `while` 循环，反之亦然，你可以使用你喜欢的任何一种。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/41.html`](http://www.ASmarterWayToLearn.com/javascript/41.html)\n\
    \n# 42\n\n## `do...while` 循环\n\n在 `while` 循环中，指令的顺序是：\n\n1.  声明一个变量作为计数器，并为其赋值。\n\
    2.  启动循环，指定循环运行多长时间。\n3.  执行一条或多条语句。\n4.  在循环内部，作为最后一条语句，递增计数器。\n\n```\nvar i\
    \ = 0;\nwhile (i <= 3) {\n  alert(i);\n  i++;\n}\n```\n\n`do...while` 循环完成的任务与\
    \ `while` 循环*几乎*相同。\n\n```\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i\
    \ <= 3);\n```\n\n两种循环之间的区别：\n\n*   关键字 `do` 代替 `while` 作为语句的开头。\n*   `while` 子句（包括括号内的循环限制代码）移到了底部——*在*右花括号之后。\n\
    \n注意 `while` 子句以分号结尾。\n\n在功能上，`while` 循环和 `do...while` 循环的区别在于，可以编写一个 `while`\
    \ 语句，使其指令块永远不会执行。考虑这个 `while` 循环。\n\n```\nvar i = 0;\nwhile (i < 0) {\n  alert(i);\n\
    \  i++;\n}\n```\n\n代码说只要计数器小于 0，就持续显示警告框。但由于计数器从未小于 0，花括号内的代码永远不会执行。\n\n将其与 `do...while`\
    \ 循环进行比较。\n\n```\nvar i = 0;\ndo {\n  alert(i);\n  i++;\n} while (i < 0);\n```\n\
    \n警告框将显示一次，即使继续运行的条件——`i` 小于 0——从未发生。由于 `do...while` 循环在到达底部的循环限制器*之前*执行花括号内的代码，因此无论循环限制器如何，它总是至少执行一次该代码。\n\
    \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/42.html`](http://www.ASmarterWayToLearn.com/javascript/42.html)\n\
    \n# 43\n\n## 放置脚本\n\nJavaScript 代码不关心它位于何处。它可以混合在——即嵌入在——创建网页的 HTML 中。或者，像外部 CSS\
    \ 文件一样，它可以放在由 HTML 文件加载的单独文件中。在大多数情况下，最好使用外部 JavaScript 文件，原因与最好使用外部 CSS 文件相同。但你仍然需要知道如何将\
    \ JavaScript 放置在 HTML 文件中，所以我们先从这里开始。\n\n如你所知，HTML 代码的顺序很重要，因为它决定了页面上元素的顺序。如果你希望标题出现在文本上方，你需要在\
    \ HTML 中将标题放在文本上方。但 JavaScript 的工作方式不同。例如，你所有的 JavaScript 函数在页面加载时都会被加载到内存中。无论代码在哪里，浏览器都会在页面加载完成时找到并存储它。一旦页面加载完成，所有\
    \ JavaScript 代码都会保留在内存中，随时准备执行，只要页面显示。\n\n你可以合法地将 JavaScript 代码放在 HTML 文件中的几乎任何位置——在\
    \ head 部分、body 部分的开头、body 部分的中间某处或 body 部分的末尾。如果你愿意，你甚至可以将不同的 JavaScript 函数分散在\
    \ HTML 文件的不同位置。浏览器会自行整理。\n\n不过，通常放置脚本的最佳位置是在 body 部分的末尾。这可以确保 CSS 样式和图像显示不会因为脚本加载而延迟。\n\
    \n当你将 JavaScript 代码块嵌入 HTML 中（而不是使用单独的 JavaScript 文件）时，必须将 JavaScript 代码放在 `<script>`\
    \ 和 `</script>` 标签之间。以下是两个函数放在标签之间的示例。\n\n```\n<script>\nfunction sayHi() {\n\
    \  alert(\"Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n\
    }\n</script>\n```\n\n你可以在 `<script>` 和 `</script>` 标签之间放置任意数量的代码——包括任意数量的函数。而且，正如我之前提到的，如果你愿意，你可以将不同的代码段分散在\
    \ HTML 文件中的任何位置。但每个代码段都必须放在 `<script>` 和 `</script>` 标签之间。\n\n大多数情况下，程序员更倾向于将所有或大部分\
    \ JavaScript 代码放在一个单独的 JavaScript 文件中，然后让浏览器在加载 HTML 文件的同时加载这个外部文件。\n\nJavaScript\
    \ 文件与 HTML 和 CSS 文件一样，是一个纯文本文件。它没有头部或任何其他特殊部分。它甚至没有 `<script>` 和 `</script>` 标签。它只是纯粹的\
    \ JavaScript 代码。包含上述示例中两个函数的 JavaScript 文件的全部内容将是：\n\n```\nfunction sayHi() {\n\
    \  alert(\"Hello world!\");\n}\nfunction sayBye() {\n  alert(\"Buh-bye!\");\n\
    }\n```\n\n使 JavaScript 文件成为 JavaScript 文件的是它的文件扩展名：`.js`。文件名开头部分由你决定，只要合法即可。以下任何一个都可以。\n\
    \n*   `scripts.js`\n*   `coreJS.js`\n*   `main-code.js`\n*   `main_code.js`\n\
    *   `main.code.js`\n\n在 HTML 文件中包含 JavaScript 文件的方式与包含外部 CSS 文件的方式相同——使用一对开始和结束标签。\n\
    \n`<script src=\"whatever.js\"></script>`\n\n出于与将 JavaScript 代码放在 body 部分末尾相同的原因，最好将包含\
    \ JavaScript 文件的标记放在 body 部分的末尾。\n\n你可以包含任意数量的外部 JavaScript 文件。\n\n你可以包含 JavaScript\
    \ 文件，同时在 HTML 中嵌入其他 JavaScript 代码。\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/43.html`](http://www.ASmarterWayToLearn.com/javascript/43.html)\n\
    \n# 44.\n\n## 注释\n\n"
