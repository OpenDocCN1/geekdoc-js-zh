    optional after an *if* statement. Without the *default* code, if none of the cases
    test true, nothing happens.


    When there is no *default* code, careful coders include a *break* statement after
    the last condition anyway as insurance, even though it may be superfluous. If
    you decide to add a new condition to the end later, you won''t have to remember
    to add a break to the block above it in order to avoid a disastrous cascade of
    statements.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/40.html](http://www.ASmarterWayToLearn.com/javascript/40.html)


    # 41


    *while* loops


    This *for* loop displays an alert on each iteration.


    1 for (var i = 0; i <= 3; i++) {


    2   alert(i);


    3 }


    As you know, the process is controlled by the three terms inside the parentheses:


    *   var i = 0 establishes a counter.


    *   i <= 3 says the loop is to keep running as long as i is less than or equal
    to 3\. Since i is assigned 0 initially, the loop will run 4 times.


    *   i++ increments i on each iteration.


    All the how-to-loop directions are packed into the space between the parentheses:
    where to start the counter, how long to keep the loop going, and how to update
    the counter each time through.


    A *while* loop does the same thing, but it''s organized differently. Only the
    middle term, how long to keep the loop going, is inside the parentheses. The counter
    is defined *before* the first line of the *while* block. The counter is updated
    *within* the code that executes when the loop runs.


    1 var i = 0;


    2 while (i <= 3) {


    3   alert(i);


    4   i++;


    5 }


    In other ways, a *while* loop is organized along the same lines as a *for* loop.


    *   Parentheses enclose the loop limiter.


    *   Curly brackets enclose the code that executes.


    *   The code that executes is indented 2 spaces.


    Since any *for* loop can be translated into a *while* loop and vice versa, you
    can use whichever one you prefer.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/41.html](http://www.ASmarterWayToLearn.com/javascript/41.html)


    # 42


    *do...while* loops


    In a *while* loop the order of instructions is:


    1.  Declare a variable to serve as a counter, and assign a value to it.


    2.  Start the loop, specifying how long the loop is to run.


    3.  Execute one or more statements.


    4.  Within the loop, as a final statement, advance the counter.


    1 var i = 0;


    2 while (i <= 3) {


    3   alert(i);


    4   i++;


    5 }


    A *do...while* loop accomplishes *almost* the same task as a *while* loop.


    1 var i = 0;


    2 do {


    3   alert(i);


    4   i++;


    5 } while (i <= 3);


    The differences between the two types of loops:


    *   Instead of while, the keyword do leads off the statement.


    *   The while clause, including the loop-limiting code inside the parentheses,
    moves to the bottom—*after* the closing curly bracket.


    Note that the while clause ends with a semicolon.


    Functionally, the difference between a *while* loop and a *do...while* loop is
    that it''s possible to code a *while* statement whose block of instructions never
    execute. Consider this *while* loop.


    1 var i = 0;


    2 while (i < 0) {


    3   alert(i);


    4   i++;


    5 }


    The code says to keep running an alert as long as the counter is less than 0\.
    But since the counter is never less than 0, the code inside the curly brackets
    never executes.


    Compare this with the *do...while* loop.


    1 var i = 0;


    2 do {


    3   alert(i);


    4   i++;


    5 } while (i < 0);


    The alert will display once, even though the keep-going condition—i less than
    0—never occurs. Since a *do...while* loop executes the code inside the curly brackets
    *before* it gets to the loop-limiter at the bottom, it always executes that code
    at least once, no matter what the loop-limiter says.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/42.html](http://www.ASmarterWayToLearn.com/javascript/42.html)


    # 43


    Placing scripts


    JavaScript code doesn''t care where it lives. It can be mixed in with—that is,
    embedded in—the HTML that creates a Web page. Or, like an external CSS file, it
    can be placed in a separate file that is loaded by the HTML file. In most cases,
    it''s best to have an external JavaScript file, for some of the same reasons it''s
    best to have an external CSS file. But you still need to know how to place JavaScript
    within your HTML file, so let''s start with that.


    As you know, the order of HTML code is important, because it determines the order
    of elements on the page. If you want the headline to appear above the text, you
    put the headline above the text in the HTML. But JavaScript doesn''t work the
    same way. All of your JavaScript functions, for example, are loaded into memory
    when the page loads. Wherever the code may be, the browser finds it and stores
    it by the time the page is finished loading. Once the page is loaded, all the
    JavaScript code stays in memory, ready to execute, for as long as the page is
    displayed.


    You can legally put JavaScript code almost anywhere in the HTML file—in the head
    section, at the beginning of the body section, somewhere in the middle of the
    body section, or at the end of the body section. You *could*, if you wanted to
    be perverse, sprinkle different Javascript functions all over your HTML file in
    different places. The browser would sort it all out.


    Generally, the best place for scripts, though, is at the end of the body section.
    This guarantees that CSS styling and image display won''t get held up while scripts
    are loading.


    When you embed blocks of JavaScript in HTML (as opposed to having a separate JavaScript
    file), you must enclose the JavaScript code between <script> and </script> tags.
    Here are two functions enclosed between the tags.


    1 <script>


    2 function sayHi() {


    3   alert("Hello world!");


    4 }


    5 function sayBye() {


    6   alert("Buh-bye!");


    7 }


    8 </script>


    You can enclose any amount of code—including any number of functions—between the
    <script> and </script> tags. And, as I mentioned before, you can have different
    sections of code scattered all over your HTML file if you want. But each section
    has to be enclosed between the <script> and </script> tags.


    For most purposes, coders prefer to have all or most of their JavaScript code
    in a separate JavaScript file, then have the browser load this external file at
    the same time it''s loading the HTML file.


    A JavaScript file is, like HTML and CSS files, a simple text file. It doesn''t
    have a header or any other special sections. It doesn''t even have <script> and
    </script> tags. It''s just pure JavaScript code. The entire contents of a JavaScript
    file that holds the two functions in the example above would be:


    1 function sayHi() {


    2   alert("Hello world!");


    3 }


    4 function sayBye() {


    5   alert("Buh-bye!");


    6 }


    What makes a JavaScript file a JavaScript file is its file extension: .js. The
    front end of the file name is up to you, as long as it''s legal. Any of these
    would be fine.


    *   scripts.js


    *   coreJS.js


    *   main-code.js


    *   main_code.js


    *   main.code.js


    You include a JavaScript file in an HTML file the same way you include an external
    CSS file—with an opening and closing tag.


    <script src="whatever.js"></script>


    For the same reason that it''s a good idea to put JavaScript code at the end of
    the body section, it''s a good idea to place the markup that includes JavaScript
    files at the end of the body section.


    You can include as many external JavaScript files as you like.


    You can include JavaScript files and also embed other JavaScript code in the HTML.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/43.html](http://www.ASmarterWayToLearn.com/javascript/43.html)


    # 44.


