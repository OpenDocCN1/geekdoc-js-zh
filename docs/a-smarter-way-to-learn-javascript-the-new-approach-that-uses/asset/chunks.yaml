    ...会弹出一条提示，显示“欢迎来到丹佛”。


    我将向你展示另一种变量，这种变量在你后续章节学习的许多任务中都会派上用场。我指的是名为`array`的变量类型。普通变量只能赋一个值，例如 9 或“巴黎”，而`array`是一种可以赋多个值的变量。你可以这样定义一个`array`：


    ```

    var cities = ["Atlanta", "Baltimore", "Chicago", "Denver", "Los Angeles", "Seattle"];

    ```


    在本章开头的示例中，我每个变量名都以数字结尾。`city0`是“Atlanta”，`city1`是“Baltimore”，以此类推。我刚刚定义的`array`与之类似，但在我这样定义`array`时，JavaScript
    会自动为不同的值（即`elements`）编号。（你也可以通过单独定义元素来控制编号，见下文。）引用每个元素时，只需写出`array`名称（此处为`cities`），后跟方括号括起来的数字。`cities[0]`是“Atlanta”，`cities[1]`是“Baltimore”，以此类推。


    由于 JavaScript 会自动为`array`元素编号，你无法控制编号顺序。列表中的第一个元素始终具有`index` 0，第二个元素`index`为 1，依此类推。


    下面是我之前编写的提示框代码，但这次指定的是`array`元素而非普通变量。


    ```

    alert("Welcome to " + cities[3]);

    ```


    `array`可以赋任何你能赋给普通变量的值。你甚至可以在同一个`array`中混合不同类型（尽管通常不会这么做）。


    ```

    var mixedArray = [1, "Bob", "Now is", true];

    ```


    在上例中，`mixedArray[0]`的数值为 1，`mixedArray[1]`的字符串值为"Bob"，以此类推。


    ### 需要记住的事项：


    * 第一项始终具有`index` 0，而不是 1。这意味着如果列表最后一项的`index`为 9，则列表中共有 10 项。

    * 与普通变量相同的命名规则适用。只允许使用字母、数字、`$`和`_`。首字符不能是数字。不能有空格。

    * 程序员通常倾向于使用复数形式作为`array`名称——例如用`cities`而不是`city`——因为`array`是一组事物的列表。

    * 与普通变量一样，`array`只需声明一次。如果给已声明的`array`赋新值，则省略`var`。


    本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/15.html`](http://www.ASmarterWayToLearn.com/javascript/15.html)


    ## 16 数组：添加和删除元素


    正如你在前几章所学，你可以声明一个空变量，即没有值的变量。然后你可以随时给它赋值，也可以随意更改其值。这些操作同样适用于`array`。


    以下是声明空`array`的方法。


    ```

    var pets = [];

    ```


    假设`array` `pets`已经声明。以下是给它赋值的方法。


    ```

    pets[0] = "dog";

    pets[1] = "cat";

    pets[2] = "bird";

    ```


    在上例中，我按顺序定义了`array`的前三个元素。但如果你愿意，也可以合法地在`array`中留下空隙（尽管通常不会）。例如，假设你从同一个空`array`开始，并编写以下代码行。


    ```

    pets[3] = "lizard";

    pets[6] = "snake";

    ```


    现在，如果你引用`pets[3]`，会得到"lizard"。引用`pets[6]`，会得到"snake"。但如果你引用`pets[0]`到`pets[2]`，或`pets[4]`、`pets[5]`，则会得到`undefined`。


    你可以给已有值的`array`添加更多值。假设`array` `pets`的前三个元素是"dog"、"cat"和"bird"。然后你编写以下代码。


    ```

    pets[3] = "lizard";

    pets[4] = "fish";

    pets[5] = "gerbil";

    pets[6] = "snake";

    ```


    现在`array`有 7 个元素："dog"、"cat"、"bird"、"lizard"、"fish"、"gerbil"和"snake"。


    如果你给已有值的`array`元素赋新值，旧值会被新值替换。


    使用关键字`pop()`，你可以删除`array`的最后一个元素。假设你有一个`array` `pets`，其元素为"dog"、"cat"和"bird"。以下代码删除最后一个元素"bird"，留下一个包含两个元素的`array`。


    ```

    pets.pop();

    ```


    使用关键字`push()`，你可以在`array`末尾添加一个或多个元素。假设你有同样的`array`，包含"dog"、"cat"和"bird"。以下代码在`array`末尾添加两个新元素。


    ```

    pets.push("fish", "ferret");

    ```


    本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/16.html`](http://www.ASmarterWayToLearn.com/javascript/16.html)


    ## 17 数组：删除、插入和提取元素


    使用`shift()`方法从`array`开头删除一个元素。假设你有一个`array` `pets`，其元素为"dog"、"cat"和"bird"。以下代码删除第一个元素"dog"，留下一个包含两个元素的`array`。


    ```

    pets.shift();

    ```


    要在`array`开头添加一个或多个元素，请使用`unshift()`方法。以下代码在`array`开头添加两个元素。


    ```

    pets.unshift("fish", "ferret");

    ```


    使用`splice()`方法可以在`array`中的任意位置插入一个或多个元素，同时可选地删除其后的一个或多个元素。假设你有一个`array`，元素为"dog"、"cat"、"fly"、"bug"、"ox"。以下代码在"cat"之后添加"pig"、"duck"和"emu"，同时删除"fly"和"bug"。


    ```

    pets.splice(2, 2, "pig", "duck", "emu");

    ```


    括号内的第一个数字是你要开始添加（如果添加）或删除（如果删除）的位置的`index`。第二个数字是要删除的现有元素数量，从你插入的元素之后的第一个元素开始。上述代码最终得到一个包含"dog"、"cat"、"pig"、"duck"、"emu"和"ox"的`array`。


    你也可以只添加而不删除任何元素。以下代码添加"pig"、"duck"和"emu"，不删除任何元素。


    ```

    pets.splice(2, 0, "pig", "duck", "emu");

    ```


    你也可以只删除元素而不添加任何内容。如果初始元素为"dog"、"cat"、"fly"、"bug"和"ox"，以下代码从`index` 3 开始删除两个元素——"bug"和"ox"。剩下"dog"、"cat"和"fly"。


    ```

    pets.splice(2, 2);

    ```


    使用`slice()`方法可以复制任意位置的一个或多个连续元素，并将它们放入一个新的`array`。如果你有一个`array` `pets`，包含"dog"、"cat"、"fly"、"bug"和"ox"，以下代码将"fly"和"bug"复制到新`array`
    `noPets`中，并保持原始`array` `pets`不变。


    ```

    var noPets = pets.slice(2, 4);

    ```


    括号内的第一个数字是要复制的第一个元素的`index`。第二个数字是要复制的最后一个元素之后的那个元素的`index`。


    这里有两件事可能会让你困惑：


    * 由于括号内的第一个`index`数字指定了要复制的第一个元素，你可能会认为第二个`index`数字指定了要复制的最后一个元素。实际上，第二个数字指定的是要复制的最后一个元素之后的那个元素的`index`。

    * 你必须将切片后的元素赋值给一个`array`。当然，这个`array`可以是进行切片的同一个`array`。在这种情况下，原始`array`将缩减为仅包含被复制的元素。


    本章的交互式编程练习请访问：[`www.ASmarterWayToLearn.com/js/17.html`](http://www.ASmarterWayToLearn.com/javascript/17.html)


    ## 18 `for`循环


    你知道《墙上有 99 瓶啤酒》这首歌吗？如果你要教别人唱这首歌，你可以给他们以下指令：


    1. 唱“墙上有 99 瓶啤酒，99 瓶啤酒。”

    2. 唱“拿下一瓶传一圈，墙上有 98 瓶啤酒。”

    3. 唱“墙上有 98 瓶啤酒，98 瓶啤酒。”

