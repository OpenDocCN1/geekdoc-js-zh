    small phone screens and monochrome readers, but you''ll be happier if things appear
    in color on a larger screen. I use color as an important teaching tool, so if
    you''re reading in black-and-white, you''re sacrificing some of the extra teaching
    value of a full-color ebook. Colored elements do show up as a lighter shade on
    some black-and-white screens, and on those devices the effect isn''t entirely
    lost, but full color is better. As for reading on a larger screen— the book includes
    more than 2,000 lines of example code. Small screens break long lines of code
    into awkward, arbitrary segments, jumbling the formatting. While still decipherable,
    the code becomes harder to read. If you don''t have a mobile device that''s ideal
    for this book, consider installing the free Kindle reading app on your laptop.

    *   `If you''re reading on a mobile device, go horizontal`. For some reason, I
    resist doing this on my iPad unless I''m watching a video. But even I, Vern Vertical,
    put my tablet into horizontal mode to proof this book. So please: starting with
    Chapter 1, do yourself a favor and rotate your tablet, reader, or phone to give
    yourself a longer line of text. It''ll help prevent the unpleasant code jumble
    mentioned above.

    *   `Do the coding exercises on a physical keyboard`. A mobile device can be ideal
    for reading, but it''s no way to code. Very, very few Web developers would attempt
    to do their work on a phone. The same thing goes for learning to code. Theoretically,
    most of the interactive exercises could be done on a mobile device. But the idea
    seems so perverse that I''ve disabled online practice on tablets, readers, and
