    ## 命名约定


    我教授的是 `camelCase` 命名约定。为什么叫“camelCase”？因为如果名称由多个单词组成，中间会有一个或两个（或三个）驼峰。`camelCase`
    名称以小写字母开头。如果名称中有多个单词，每个后续单词的首字母大写，形成一个驼峰。如果你只用一个单词来构成变量名，比如 `response`，就没有驼峰。那是一头没食物的骆驼。请采用
    `camelCase` 约定。它会让你的变量名更具可读性，并且你不太容易混淆变量名。


    示例：

    `userResponse`

    `userResponseTime`

    `userResponseTimeLimit`

    `response`


    让你的变量名具有描述性，这样当三周或一年后你或其他人再回来看代码时，更容易理解代码的含义。通常，`userName` 比 `x` 好，`faveBreed`
    比 `favBrd` 好，尽管较短的名称完全合法。不过，你需要在可读性和简洁性之间取得平衡。`bestSupportingActressInADramaOrComedy`
    虽然清晰明了，但对大多数人来说可能过于冗长，不便输入或阅读。我会把它缩短。


    本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/4.html`](http://www.ASmarterWayToLearn.com/javascript/4.html)


    ## 数学表达式：熟悉的运算符


    在任何可以使用数字的地方，你都可以使用数学表达式。例如，你熟悉下面这种语句：


    ```javascript

    var popularNumber = 4;

    ```


    但你也可以这样写：


    ```javascript

    var popularNumber = 2 + 2;

    ```


    你还可以写：


    ```javascript

    alert(2 + 2);

    ```


    这会在警告框中显示消息“4”。当 JavaScript 看到数学表达式时，它总是会进行计算并返回结果。


    下面是一条从 12 中减去 24 的语句，将 -12 赋值给变量：


    ```javascript

    var popularNumber = 12 - 24;

    ```


    这条语句将 3 乘以 12 的乘积 36 赋值给变量：


    ```javascript

    var popularNumber = 3 * 12;

    ```


    在这条语句中，数字 10 被赋值给一个变量。然后给该变量加 1，并将和 210 赋值给第二个变量。和往常一样，你可以混合使用变量和数字：


    ```javascript

    var num = 10;

    var popularNumber = num + 200;

    ```


    你也可以只使用变量：


    ```javascript

    var num = 10;

    var anotherNum = 1;

    var popularNumber = num + anotherNum;

    ```


    我一直在使用的算术运算符 `+`、`-`、`*` 和 `/` 对你来说无疑很熟悉。下面这个可能不常见：


    ```javascript

    var whatsLeftOver = 10 % 3;

    ```


    `%` 是取模运算符。它不会给出一个数除以另一个数的结果，而是给出除法执行后的余数。


    如果一个数能被另一个数整除，取模运算返回 0。在下面的语句中，0 被赋值给变量：


    ```javascript

    var whatsLeftOver = 9 % 3;

    ```


    本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/5.html`](http://www.ASmarterWayToLearn.com/javascript/5.html)


    ## 数学表达式：不熟悉的运算符


    有几个专门的数学表达式你需要了解。这是第一个：


    ```javascript

    num++;

    ```


    这是以下写法的简写：


    ```javascript

    num = num + 1;

    ```


    它将变量递增 1。递减则使用减号而不是加号：


    ```javascript

    num--;

    ```


    你可以在赋值语句中使用这些表达式。但结果可能会让你惊讶：


    ```javascript

    var num = 1;

    var newNum = num++;

    ```


    在上面的例子中，`num` 的原始值被赋给 `newNum`，然后 `num` 才递增。如果第一条语句中 `num` 初始赋值为 1，那么第二条语句将其值增加到
    2。`newNum` 得到 `num` 的原始值 1。


    如果将加号放在变量前面，结果会不同：


    ```javascript

    var num = 1;

    var newNum = ++num;

    ```


    在上面的语句中，`num` 和 `newNum` 最终的值都是 2。


    如果将减号放在变量后面，新变量被赋予原始值，而第一个变量被递减：


    ```javascript

    var num = 1;

    var newNum = num--;

    ```


    `num` 递减为 0，`newNum` 得到 `num` 的原始值 1。


    但如果将减号放在变量前面，`newNum` 被赋予递减后的值，而不是原始值。`num` 和 `newNum` 最终的值都是 0：


    ```javascript

    var num = 1;

    var newNum = --num;

    ```


    本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/6.html`](http://www.ASmarterWayToLearn.com/javascript/6.html)


    ## 数学表达式：消除歧义


    复杂的算术表达式可能会带来一个问题，你可能还记得高中代数中的情况。看这个例子，告诉我 `totalCost` 的值是多少：


    ```javascript

    var totalCost = 1 + 3 * 4;

    ```


    `totalCost` 的值取决于你执行算术运算的顺序。如果你先加 `1 + 3`，然后将和乘以 4，`totalCost` 的值为 16。但如果你反过来，先乘以
    3 乘以 4，然后将乘积加 1，你会得到 13。


    在 JavaScript 中，和代数一样，歧义通过优先级规则消除。和代数一样，这里适用的规则是乘法运算在加法运算之前完成。所以 `totalCost` 的值为
    13。


    但你不必记住 JavaScript 复杂的优先级规则。你可以通过使用括号来消除歧义，从而巧妙地解决这个问题。括号会覆盖所有内置的优先级规则。它们强制 JavaScript
    先完成括号内的运算，再完成其他运算。


    当你使用括号向 JavaScript 明确你的意图时，你的代码也更容易理解，无论是对于其他程序员，还是对于一年后试图理解自己代码的你。在这条语句中，括号告诉
    JavaScript 先计算 3 乘以 4，再加 1。结果是 13：


    ```javascript

    var totalCost = 1 + (3 * 4);

    ```


    如果我移动括号，算术运算的顺序就会不同。在下一条语句中，括号的位置告诉 JavaScript 先加 1 和 3，再乘以 4。结果是 16：


    ```javascript

    var totalCost = (1 + 3) * 4;

    ```


    另一个例子：


    ```javascript

    var resultOfComputation = (2 * 4) * 4 + 2;

    ```


    通过将第一个乘法运算放在括号内，你告诉 JavaScript 先执行该运算。但接下来呢？顺序可能是：

    1. 2 乘以 4。

    2. 将该乘积乘以 4。

    3. 再加 2。

    ...这样 `resultOfComputation` 的值为 34。


    或者顺序可能是：

    1. 2 乘以 4。

    2. 将该乘积乘以 4 加 2 的和。

    ...这样 `resultOfComputation` 的值为 48。


    解决方案是使用更多括号。如果你希望先执行第二次乘法，然后再加 2，可以这样写：


    ```javascript

    resultOfComputation = ((2 * 4) * 4) + 2;

    ```


    但如果你希望将 2 乘以 4 的乘积乘以 4 加 2 的结果，可以这样写：


    ```javascript

    resultOfComputation = (2 * 4) * (4 + 2);

    ```


    本章的交互式编码练习请访问：[`www.ASmarterWayToLearn.com/js/7.html`](http://www.ASmarterWayToLearn.com/javascript/7.html)


    ## 连接文本字符串


    在第 1 章中，你学会了在警告框中显示消息，可以这样编码：


    ```javascript

    alert("Thanks for your input!");

    ```


    或者这样编码：


    ```javascript

    var message = "Thanks for your input!";

    alert(message);

    ```


    但假设你想个性化一条消息。在代码的另一部分，你询问了用户的名字，并将她输入的名字赋值给变量 `userName`。


    现在，你想将她的名字与标准的“Thanks”组合起来，生成一个警告框，例如显示“Thanks, Susan!”。


    当用户提供她的名字时，我们将其赋值给变量 `userName`。代码如下：


    ```javascript

    alert("Thanks, " + userName + "!");

    ```


    使用加号运算符，代码将三个元素组合（连接）成消息：字符串 `"Thanks, "` 加上变量 `userName` 表示的字符串，再加上字符串 `"!"`。


    注意，第一个字符串包含一个空格。如果没有它，警告框会显示“Thanks,Susan!”。


