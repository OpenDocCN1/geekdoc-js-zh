    # 27 生成随机数


    假设你想模拟掷骰子。在模拟中，你希望它随机出现 1、2、3、4、5 或 6。第一步是让 JavaScript 生成一个随机数。（嗯，它几乎是随机的，技术上称为伪随机，但对于大多数用途来说已经足够接近随机了。）


    以下代码生成一个伪随机数，有 16 位小数，范围从 `0.0000000000000000` 到 `0.9999999999999999`，并将其赋值给变量
    `randomNumber`。


    ```javascript

    var randomNumber = Math.random();

    ```


    函数 `Math.random()` 总是返回一个 16 位小数，范围从 `0.0000000000000000` 到 `0.9999999999999999`。我们可以通过乘以一百万万亿（1
    后面跟 17 个零）将这个小数转换为整数：


    `0.0000000000000000 * 100000000000000000 = 0`

    `0.7474887706339359 * 100000000000000000 = 7474887706339359`

    `0.9999999999999999 * 100000000000000000 = 9999999999999999`


    数万亿个可能的数字对于我们的虚拟掷骰子来说太多了。我们只需要六个可能的数字，1 到 6。因此，我们的第一步不是乘以一百万万亿，而是将这个巨大的小数乘以 6。


    `0.0000000000000000 * 6 = 0`

    `0.7474887706339359 * 6 = 4.7474887706339359`

    `0.9999999999999999 * 6 = 5.9999999999999994`


    直觉可能会告诉你，通过取整就能完成，但数学上这行不通。因为没有任何数能向上取整为 `0`，也没有任何数能向下取整为 `6`，而中间的数字（既可以通过向上取整也可以通过向下取整得到）出现的频率几乎是其他数字的两倍。但如果我们给结果加上
    `1`，然后向下取整，就能让所有数字有均等的机会。以下是我们的虚拟掷骰子代码。


    ```javascript

    var bigDecimal = Math.random();

    var improvedNum = (bigDecimal * 6) + 1;

    var numberOfStars = Math.floor(improvedNum);

    ```


    以上代码逐行执行的操作如下：


    1. 生成一个 16 位小数，并赋值给变量 `bigDecimal`。

    2. 将 16 位小数转换为范围从 `0.0000000000000000` 到 `5.9999999999999999` 的数字，然后加上 `1`，因此范围最终变为
    `1.0000000000000000` 到 `6.9999999999999999`。这个数字被赋值给变量 `improvedNum`。

    3. 将 `improvedNum` 表示的值向下取整到最近的整数，范围从 1 到 6。


    本章的交互式编程练习请访问：

    [`www.ASmarterWayToLearn.com/js/27.html`](http://www.ASmarterWayToLearn.com/javascript/27.html)


    # 28 将字符串转换为整数和小数


    有时 JavaScript 似乎能读懂你的心思。例如，假设你写...


    ```javascript

    var currentAge = prompt("Enter your age.");

    ```


    ...JavaScript 会将用户的回答作为字符串赋值给 `currentAge`。她输入的 `32` 在你看来可能是一个数字，但对 JavaScript
    来说它是一个字符串：`"32"`。


    然而，假设你写...


    ```javascript

    var currentAge = prompt("Enter your age.");

    var yearsEligibleToVote = currentAge - 18;

    ```


    在上面的代码中，赋值给变量 `currentAge` 的值是一个字符串，因为它来自用户的提示响应。但在第 2 行，当该变量出现在算术表达式中时，该值会自动（且临时地）转换为数字，以便进行数学运算。


    类似地，如果你让 JavaScript 将 `"100"` 除以 `2` 或将 `"2.5"` 乘以 `2.5`，JavaScript 似乎理解你希望将字符串视为数字，并进行数学运算。你甚至可以让
    JavaScript 仅使用字符串作为项进行乘法、除法或减法，JavaScript 会正确理解你的意图并进行计算。


    ```javascript

    var profit = "200" - "150";

    ```


    在上面的语句中，两个字符串被视为数字，因为它们出现在数学表达式中。变量 `profit` 尽管有引号，但被赋值为数字 `50`。


    不言而喻，你让 JavaScript 进行数学运算的字符串必须是引号内的数字，例如 `"50"`，而不能是字母字符。如果你写...


    ```javascript

    var profit = "200" - "duck";

    ```


    ...会弹出一个显示 `NaN` 的警告，意思是“不是数字”。这没什么好奇怪的。200 减去 "duck" 怎么可能是一个数字呢？


    你可能还记得前一章的内容，当你在包含加号的表达式中混合字符串和数字时，JavaScript 会做与上面例子相反的事情。JavaScript 不会将字符串转换为数字，而是将数字转换为字符串。它不会进行加法，而是进行拼接。


    ```javascript

    var result = "200" + 150;

    ```


    在上面的语句中，JavaScript 看到字符串 `"200"` 和数字 `150`，通过将 `150` 转换为字符串 `"150"` 来解决冲突。然后它将两个字符串拼接起来。变量
    `result` 被赋值为 `"200150"`。如果表达式中的 `+` 是其他算术运算符（`-`、`*` 或 `/`），JavaScript 会将字符串
    `"200"` 转换为数字 `200` 并进行数学运算。


    你可以看到以下代码会出问题。


    ```javascript

    var currentAge = prompt("Enter your age.");

    var qualifyingAge = currentAge + 1;

    ```


    上面的代码有一个意想不到的后果。`currentAge` 表示的字符串与已转换为 `"1"` 的 `1` 拼接在一起。例如：如果用户输入 `"52"`，`qualifyingAge`
    被赋值的不是 `53`，而是 `"521"`。


    如果你想进行加法运算，必须将任何字符串转换为数字。


    ```javascript

    var currentAge = prompt("Enter your age.");

    var qualifyingAge = parseInt(currentAge) + 1;

    ```


    第 2 行将 `currentAge` 表示的字符串转换为数字，然后加上 `1`，并将和赋值给 `qualifyingAge`。


    `parseInt` 将所有字符串（包括包含浮点数的字符串）转换为整数。但令人震惊且真实的是：它不会进行四舍五入。它只是截断小数部分。在下面的语句中，`myInteger`
    被赋值的不是你可能期望的 `2`，而是 `1`。


    ```javascript

    var myInteger = parseInt("1.9999");

    ```


    要保留任何小数值，请使用 `parseFloat`。在下面的语句中，`myFractional` 被赋值为 `1.9999`。


    ```javascript

    var myFractional = parseFloat("1.9999");

    ```


    为了减少混淆，即使 JavaScript 不要求显式转换（例如在混合字符串和数字进行乘法运算时），程序员有时也倾向于进行显式的手动转换。


    本章的交互式编程练习请访问：

    [`www.ASmarterWayToLearn.com/js/28.html`](http://www.ASmarterWayToLearn.com/javascript/28.html)


    # 29 将字符串转换为数字，将数字转换为字符串


