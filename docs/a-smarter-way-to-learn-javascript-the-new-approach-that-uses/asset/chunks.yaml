    \ the variable is a property attached to some object whose name hasn't been specified\
    \ yet. But don't worry. Just as the parameter values will be filled in by the\
    \ calling code, so will the name of the object.\n\nThis is the calling code that\
    \ creates the object for the Basic plan.\n\n`var plan1 = new Plan(\"Basic\", 3.99,\
    \ 100, 1000, 10);`\n\nThis would be just a regular function call if it weren't\
