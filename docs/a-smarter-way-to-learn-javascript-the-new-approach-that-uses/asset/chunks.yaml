    \ Plan(\"Ultimate\", 9.99, 2000, 20000, 500);\n```\n\nIt's common to use the same\
    \ names for parameters and properties, but you don't have to. You *could* write:\n\
    \n```\nfunction Plan(name, price, space, transfer, pages) {\n  this.doc = name;\n\
    \  this.grumpy = price;\n  this.sleepy = space;\n  this.bashful = transfer;\n\
    \  this.sneezy = pages;\n}\n```\n\nFind the interactive coding exercises for this\
