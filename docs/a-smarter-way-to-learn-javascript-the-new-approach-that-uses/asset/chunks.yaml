    ## Naming Conventions


    I teach the `camelCase` naming convention. Why "camelCase"? Because there is a
    hump or two (or three) in the middle if the name is formed by more than one word.
    A `camelCase` name begins in lower case. If there''s more than one word in the
    name, each subsequent word gets an initial cap, creating a hump. If you form a
    variable name with only one word, like `response`, there''s no hump. It''s a camel
    that''s out of food. Please adopt the `camelCase` convention. It''ll make your
    variable names more readable, and you''ll be less likely to get variable names
    mixed up.


    Examples:

    `userResponse`

    `userResponseTime`

    `userResponseTimeLimit`

    `response`


    Make your variable names descriptive, so it''s easier to figure out what your
    code means when you or someone else comes back to it three weeks or a year from
    now. Generally, `userName` is better than `x`, and `faveBreed` is better than
    `favBrd`, though the shorter names are perfectly legal. You do have to balance
    readability with conciseness, though. `bestSupportingActressInADramaOrComedy`
    is a model of clarity, but may be too much for most of us to type or read. I''d
    shorten it.


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/4.html](http://www.ASmarterWayToLearn.com/javascript/4.html)


    ## Math Expressions: Familiar Operators


    Wherever you can use a number, you can use a math expression. For example, you''re
    familiar with this kind of statement.


    ```javascript

    var popularNumber = 4;

    ```


    But you can also write this.


    ```javascript

    var popularNumber = 2 + 2;

    ```


    You can also write:


    ```javascript

    alert(2 + 2);

    ```


    This displays the message "4" in an alert box. When it sees a math expression,
    JavaScript always does the math and delivers the result.


    Here''s a statement that subtracts 24 from 12, assigning -12 to the variable.


    ```javascript

    var popularNumber = 12 - 24;

    ```


    This one assigns the product of 3 times 12, 36, to the variable.


    ```javascript

    var popularNumber = 3 * 12;

    ```


    In this one, the number 10 is assigned to a variable. Then 1 is added to the variable,
    and the sum, 210, is assigned to a second variable. As usual, you can mix variables
    and numbers.


    ```javascript

    var num = 10;

    var popularNumber = num + 200;

    ```


    You can also use nothing but variables.


    ```javascript

    var num = 10;

    var anotherNum = 1;

    var popularNumber = num + anotherNum;

    ```


    The arithmetic operators I''ve been using, `+`, `-`, `*`, and `/`, are undoubtedly
    familiar to you. This one may not be:


    ```javascript

    var whatsLeftOver = 10 % 3;

    ```


    `%` is the modulus operator. It doesn''t give you the result of dividing one number
    by another. It gives you the remainder when the division is executed.


    If one number divides evenly into another, the modulus operation returns 0. In
    the following statement, 0 is assigned to the variable.


    ```javascript

    var whatsLeftOver = 9 % 3;

    ```


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/5.html](http://www.ASmarterWayToLearn.com/javascript/5.html)


    ## Math Expressions: Unfamiliar Operators


    There are several specialized math expressions you need to know. Here''s the first
    one.


    ```javascript

    num++;

    ```


    This is a short way of writing...


    ```javascript

    num = num + 1;

    ```


    It increments the variable by 1. You decrement using minuses instead of pluses.


    ```javascript

    num--;

    ```


    You can use these expressions in an assignment. But the result may surprise you.


    ```javascript

    var num = 1;

    var newNum = num++;

    ```


    In the example above, the original value of `num` is assigned to `newNum`, and
    `num` is incremented afterward. If `num` is originally assigned 1 in the first
    statement, the second statement boosts its value to 2. `newNum` gets the original
    value of `num`, 1.


    If you place the pluses before the variable, you get a different result.


    ```javascript

    var num = 1;

    var newNum = ++num;

    ```


    In the statements above, both `num` and `newNum` wind up with a value of 2.


    If you put the minuses after the variable, the new variable is assigned the original
    value, and the first variable is decremented.


    ```javascript

    var num = 1;

    var newNum = num--;

    ```


    `num` is decremented to 0, and `newNum` gets the original value of `num`, 1.


    But if you put the minuses before the variable, `newNum` is assigned the decremented,
    not the original, value. Both `num` and `newNum` wind up with a value of 0.


    ```javascript

    var num = 1;

    var newNum = --num;

    ```


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/6.html](http://www.ASmarterWayToLearn.com/javascript/6.html)


    ## Math Expressions: Eliminating Ambiguity


    Complex arithmetic expressions can pose a problem, one that you may remember from
    high school algebra. Look at this example and tell me what the value of `totalCost`
    is.


    ```javascript

    var totalCost = 1 + 3 * 4;

    ```


    The value of `totalCost` varies, depending on the order in which you do the arithmetic.
    If you begin by adding `1 + 3`, then multiply the sum by 4, `totalCost` has the
    value of 16. But if you go the other way and start by multiplying 3 by 4, then
    add 1 to the product, you get 13.


    In JavaScript as in algebra, the ambiguity is cleared up by precedence rules.
    As in algebra, the rule that applies here is that multiplication operations are
    completed before addition operations. So `totalCost` has the value of 13.


    But you don''t have to memorize JavaScript''s complex precedence rules. You can
    finesse the issue by using parentheses to eliminate ambiguity. Parens override
    all the built-in precedence rules. They force JavaScript to complete operations
    enclosed by parens before completing any other operations.


    When you use parens to make your intentions clear to JavaScript, it also makes
    your code easier to grasp, both for other coders and for you when you''re trying
    to understand your own code a year down the road. In this statement, the parentheses
    tell JavaScript to first multiply 3 by 4, then add 1. The result: 13.


    ```javascript

    var totalCost = 1 + (3 * 4);

    ```


    If I move the parentheses, the arithmetic is done in a different order. In this
    next statement, the placement of the parens tells JavaScript to first add 1 and
    3, then multiply by 4. The result is 16.


    ```javascript

    var totalCost = (1 + 3) * 4;

    ```


    Here''s another example.


    ```javascript

    var resultOfComputation = (2 * 4) * 4 + 2;

    ```


    By placing the first multiplication operation inside parentheses, you''ve told
    JavaScript to do that operation first. But then what? The order could be:

    1. Multiply 2 by 4.

    2. Multiply that product by 4.

    3. Add 2 to it.

    ...giving `resultOfComputation` a value of 34.


    Or the order could be:

    1. Multiply 2 by 4.

    2. Multiply that product by the sum of 4 and 2.

    ...giving `resultOfComputation` a value of 48.


    The solution is more parentheses. If you want the second multiplication to be
    done before the 2 is added, write this...


    ```javascript

    resultOfComputation = ((2 * 4) * 4) + 2;

    ```


    But if you want the product of 2 times 4 to be multiplied by the number you get
    when you total 4 and 2, write this...


    ```javascript

    resultOfComputation = (2 * 4) * (4 + 2);

    ```


    Find the interactive coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/7.html](http://www.ASmarterWayToLearn.com/javascript/7.html)


    ## Concatenating Text Strings


    In Chapter 1 you learned to display a message in an alert, coding it this way.


    ```javascript

    alert("Thanks for your input!");

    ```


    Or you could code it this way.


    ```javascript

    var message = "Thanks for your input!";

    alert(message);

    ```


    But suppose you wanted to personalize a message. In another part of your code
    you''ve asked the user for her name and assigned the name that she entered to
    a variable, `userName`.


    Now, you want to combine her name with a standard "Thanks" to produce an alert
    that says, for example, "Thanks, Susan!"


    When the user provided her name, we assigned it to the variable `userName`. This
    is the code.


    ```javascript

    alert("Thanks, " + userName + "!");

    ```


    Using the plus operator, the code combines—concatenates—three elements into the
    message: the string `"Thanks, "` plus the string represented by the variable `userName`
    plus the string `"!"`


    Note that the first string includes a space. Without it, the alert would read,
    "Thanks,Susan!".

