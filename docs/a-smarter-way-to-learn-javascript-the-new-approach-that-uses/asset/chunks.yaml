    [http://www.ASmarterWayToLearn.com/js/57.html](http://www.ASmarterWayToLearn.com/javascript/57.html)


    # 58


    The DOM


    In previous chapters you learned two different ways to target components of your
    web page so you could read or set them. You learned to getElementById, and you
    learned to getElementsByTagName. These are often the best methods for targeting
    things, but they have limitations. The first, getElementById, gives you access
    only to those components that have been assigned an id. The second, getElementsByTagName,
    is good for wholesale changes, but is a bit cumbersome for fine surgical work.
    Both approaches can change things on your web page, but neither is able to deal
    with *all* the things on the page, to create new things, to move existing things,
    or to delete them.


    Fortunately, both of these approaches are only two of many methods for working
    with the **Document Object Model**, the **DOM**. The DOM is an organization chart,
    created automatically by the browser when your web page loads, for the whole web
    page. All the things on your web page—the tags, the text blocks, the images, the
    links, the tables, the style attributes, and more—have spots on this organization
    chart. This means that your JavaScript code can get its hands on anything on your
    web page, anything at all, just by saying where that thing is on the chart. What''s
    more, your JavaScript can add things, move things, or delete things by manipulating
    the chart. If you wanted to (you wouldn''t), you could almost create an entire
    web page from scratch using JavaScript''s DOM methods.


    Here''s a simplified web page. I''ve indented the different levels in the hierarchy.
    The three top levels of the DOM are always the same for a standard web page. The
    document is the first level. Under the document is the second level, the html.
    And under the html are the co-equal third levels, the head and the body. Under
    each of these are more levels.


    1st level: document


    2nd level:   <html>


    3rd level:     <head>


    4th level:       <title>


    5th level:         Simple document


                     </title>


                   </head>


    3rd level      <body>


    4th level        <p>


    5th level          There''s not much to this.


                     </p>


                   </body>


                 </html>


    Here''s the same thing, shown as an organization chart. Note that this is an idealized
    chart, cleaned of junk artifacts that most browsers insert in the DOM. I''ll show
    you how to clean out these artifacts in later chapters.


    ![](images/00009.jpeg)


    As you can see, every single thing on the web page is included, even the title
    text and the paragraph text. Let''s make it a little more complicated by adding
    a div and a second paragraph. Here it is in HTML form.


    1st level: document


    2nd level:   <html>


    3rd level:     <head>


    4th level:       <title>


    5th level:         Simple document


                     </title>


                   </head>


    3rd level      <body>


    4th level        <div>


    5th level          <p>


    6th level            There''s not much to this.


                       </p>


    5th level          <p>


    6th level            Nor to this.


                       </p>


                     </div>


                   </body>


                 </html>


    And in organization chart (minus any junk artifacts)...


    ![](images/00010.jpeg)


    In a company organization chart, each box represents a person. In the DOM organization
    chart, each box represents a **node**. The HTML page represented above, in its
    cleaned-up DOM form, has 11 nodes: the document node, the html node, the head
    and body nodes, the title node, the div node, two paragraph nodes, and three text
    nodes, one for the title and one for each of the two paragraphs.


    In this particular chart, there are three types of nodes: document, element, and
    text. The document node is the top level. Element nodes are **<html>**, **<head>**,
    **<body>**, **<title>**, **<div>**, and **<p>**. Text nodes are the strings that
    comprise the title and the two paragraphs.


    Find the interactive coding exercises for this chapter at:


    [http://www.ASmarterWayToLearn.com/js/58.html](http://www.ASmarterWayToLearn.com/javascript/58.html)


