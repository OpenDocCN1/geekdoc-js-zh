  trans: "\n*   你可以指定窗口大小而不指定窗口位置，但如果指定了窗口位置而没有指定大小，该设置将被忽略，因为窗口会变成填满整个屏幕的全尺寸窗口。\n\
    \n通常，部分或全部参数可以赋值给一个变量，然后在打开窗口的语句中使用该变量。由于整个内容必须是一个带引号的字符串，字符串内的引号需要改为单引号。\n\n\
    ```\n1 var windowSpecs = \"'faq.html', 'faq', 'width=420,height=380,left=200,top=100'\"\
    ;\n2 var faqPage = window.open(windowSpecs);\n```\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/80.html`](http://www.ASmarterWayToLearn.com/javascript/80.html)\n\
    \n# 81\n\n## 浏览器控制：\n\n### 检测弹出窗口拦截器\n\n弹出窗口拦截器现在已是浏览器的标准功能，通常默认启用一定程度的拦截。JavaScript\
    \ 弹出窗口，尤其是那些在同一网站内打开新页面的窗口，通常默认会被允许，但你无法完全确定。如果弹出窗口是你网站的核心功能，你需要测试你的弹出窗口是否会被拦截。如果会被拦截，你可以要求用户为你的网站禁用弹出窗口拦截器。\n\
    \n这个测试方法相当简陋。你尝试打开一个小的测试弹出窗口，然后迅速关闭它——速度快到用户可能注意不到屏幕的闪烁。如果尝试成功，窗口句柄会有一个值。如果弹出窗口被拦截，句柄将为\
    \ `null`，此时你可以向用户发送提示信息。\n\n以下是代码。\n\n```\n1 function checkForPopBlocker() {\n\
    2   var testPop = window.open(\"\", \"\",\"width=100,height=100\");\n3   if (testPop\
    \ === null) {\n4     alert(\"请禁用您的弹出窗口拦截器。\");\n5   }\n6   testPop.close();\n\
    7 }\n```\n\n逐行解释：\n\n2 尝试打开一个小窗口\n\n3-4 如果句柄被赋值为 `null`，表示窗口无法打开，则显示一个警告\n\n6\
    \ 关闭窗口\n\n上述函数适用于除 Internet Explorer 之外的所有浏览器。在 Internet Explorer 中，如果弹出窗口被拦截，句柄将是\
    \ `undefined` 而不是 `null`。因此，为了覆盖所有情况，你需要这样编写函数。\n\n```\n1 function checkForPopBlocker()\
    \ {\n2   var testPop = window.open(\"\", \"\",\"width=100,height=100\");\n3  \
    \ if (testPop === null || typeof(testPop === \"undefined\") {\n4     alert(\"\
    请禁用您的弹出窗口拦截器。\");\n5   }\n6   testPop.close();\n7 }\n```\n\n通常，你会在页面加载时运行这个测试。\n\
    \n`<body onLoad =\"checkForPopBlocker();\">`\n\n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/81.html`](http://www.ASmarterWayToLearn.com/javascript/81.html)\n\
    \n# 82\n\n## 表单验证：文本字段\n\n用户是否正确填写了你的表单？JavaScript 可以帮助你找出答案——也就是说，帮助你*验证*表单。通过表单验证，如果出现问题，你可以要求用户重新填写。首先，如果你有必填字段，你可以检查用户是否在其中输入了内容。让我们从一个简单的表单开始，该表单要求用户输入她的姓氏。\n\
    \n以下是该表单的标记。为了让你专注于学习重点，我省略了很多内容，包括样式设置。\n\n```\n<form onSubmit=\"return checkForLastName();\"\
    >\n  请输入您的姓氏。<br>\n  <input type=\"text\" id=\"lastNameField\">\n  <input type=\"\
    submit\" value=\"提交表单\">\n</form>\n```\n\n当用户点击**提交**按钮时，会调用函数 `checkForLastName`。\n\
    \n以下是该函数。\n\n```\n1 function checkForLastName() {\n2   if (document.getElementById(\"\
    lastNameField\").value.length === 0) {\n3     alert(\"请输入您的姓氏\");\n4     return\
    \ false;\n5   }\n6 }\n```\n\n第 2 行询问 ID 为 `\"lastNameField\"` 的字段中值的长度是否为 0。也就是说，是否没有输入任何内容？如果是，则显示一个警告，要求用户输入她的名字。然后在第\
    \ 4 行发生了其他事情：布尔值 `false` 被返回给调用代码。这会阻止表单提交。为了取消提交，调用函数的标记中必须有一个匹配的关键字 `return`。如果没有这个\
    \ `return`，函数第 4 行的 `return` 将无法阻止表单提交。\n\n`<form onSubmit=\"return checkForLastName();\"\
    >`\n\n作为用户友好的设计，你可以使用 `focus` 方法将光标定位到需要填写的字段中。\n\n```\n1 function checkForLastName()\
    \ {\n2   if (document.getElementById(\"lastNameField\").value.length === 0) {\n\
    3     alert(\"请输入您的姓氏\");\n4     document.getElementById(\"lastNameField\").focus();\n\
    5     return false;\n6   }\n7 }\n```\n\n重复书写 `document.getElementById...` 显得相当笨拙，所以我们将其放入一个变量中。\n\
    \n```\n1 function checkForLastName() {\n2 var targetField = document.getElementById(\"\
    lastNameField\");\n3   if (targetField.value.length === 0) {\n4     alert(\"请输入您的姓氏\"\
    );\n5     targetField.focus();\n6     return false;\n7   }\n8 }\n```\n\n我们再添加一个功能。我们将通过将需要填写的字段背景色改为黄色来引导用户注意该字段。\n\
    \n这需要两条额外的语句。如果用户没有填写该字段，第 6 行将其背景色改为黄色。当用户填写完字段后，第 9 行在用户后续提交时再次运行函数，将背景色恢复为白色。\n\
    \n```\n1  function checkForLastName() {\n2   var targetField = document.getElementById(\"\
    lastNameField\");\n3   if (targetField.value.length === 0) {\n4     alert(\"请输入您的姓氏\"\
    );\n5     targetField.focus();\n6     targetField.style.background = \"yellow\"\
    ;\n7     return false;\n8   }\n9   targetField.style.background = \"white\";\n\
    10 }\n```\n\n![](img/00001.jpeg)\n\n*   本章的示例代码通过 ID 定位表单和字段，这是最直接的方法。但你也可以通过名称、标签或\
    \ DOM 层级中的位置来定位。\n\n*   与其将 ID 硬编码到函数中，你可以通过将字段 ID 作为参数，并从调用代码中传递 ID 来使其可复用。\n\
    \n本章的交互式编程练习请访问：\n\n[`www.ASmarterWayToLearn.com/js/82.html`](http://www.ASmarterWayToLearn.com/javascript/82.html)\n\
    \n# 83\n\n## 表单验证：下拉菜单\n\n考虑一个包含选择州字段的表单。为了简单起见，我将州列表限制为 4 个。当用户点击“SELECT A STATE”右侧的向上或向下箭头时，会下拉一个菜单。她从中选择一个州。\n\
    \n但如果她忘记选择州呢？\n\n以下是标记，为教学目的进行了简化。\n\n```\n<form onSubmit=\"return checkForSelection();\"\
    >\n  <select id=\"states\">\n    <option value=\"\" selected=\"selected\">\n \
    \     选择一个州</option>\n        <option value=\"AL\">阿拉巴马州</option>\n        <option\
    \ value=\"AK\">阿拉斯加州</option>\n        <option value=\"AZ\">亚利桑那州</option>\n \
    \       <option value=\"AR\">阿肯色州</option>\n    </select>&nbsp;&nbsp;\n  <input\
    \ type=\"submit\" value=\"提交表单\">\n</form>\n```\n\n当点击**提交**按钮时，会调用函数 `checkForSelection`。注意，关键字\
    \ `return` 再次出现在函数调用之前。\n\n以下是该函数。\n\n```\n1 function checkForSelection() {\n\
    2   if (document.getElementById(\"states\").selectedIndex === 0) {\n3     alert(\"\
    请选择一个州。\");\n4     return false;\n5   }\n6 }\n```\n\n在函数中，如果 `selectedIndex` 为\
    \ 0（第 2 行），表示用户尚未做出选择。第 3 行显示一个警告，要求她选择。第 4 行返回 `false`，取消表单提交。\n\n以下是该函数的两个改进版本。首先，它接受元素\
    \ ID 作为参数，从而可以处理多个表单。其次，将元素赋值给一个变量。\n\n```\n1 function checkForSelection(selecID)\
    \ {\n2   var target = document.getElementById(selecID);\n```\n"
- fmt: "\n```\n3   if (target.selectedIndex === 0) {\n4     alert(\"Please select\
    \ a state.\");\n5     return false;\n6   }\n7 }\n```\n\nThe function coded above\
    \ needs the event-handler to include the ID as an argument.\n\n`<form onSubmit=\"\
    return checkForSelection('states');\">`\n\nFind the interactive coding exercises\
    \ for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/83.html](http://www.ASmarterWayToLearn.com/javascript/83.html)\n\
    \n# 84\n\nForm validation: radio buttons\n\nLet's code a form with a group of\
    \ radio buttons. The buttons are Cat, Bat, and Hat.\n\nThis is the markup, simplified\
    \ to keep your focus on what you're learning here.\n\n```\n<form onSubmit=\"return\
    \ validateRadios();\">\n  <input type=\"radio\" name=\"r1\" value=\"cat\"> Cat<br>\n\
    \  <input type=\"radio\" name=\"r1\" value=\"bat\"> Bat<br>\n  <input type=\"\
    radio\" name=\"r1\" value=\"hat\"> Hat<br>\n  <input type=\"submit\" value=\"\
    Submit Form\">\n</form>\n```\n\nNote that the radio buttons all have the same\
    \ name, `r1`.\n\nThis is the validating function that checks to see if the user\
    \ has clicked one of the buttons.\n\n```\n1  function validateRadios() {\n2  \
    \  var radios = document.getElementsByName(\"r1\");\n3    for (var i = 0; i <\
    \ radios.length; i++) {\n4      if (radios[i].checked) {\n5        return true;\n\
    6      }\n7    }\n8    alert(\"Please check one.\");\n9    return false;\n10 }\n\
    ```\n\nLine 2 makes a collection of all the buttons with the name `r2` and assigns\
    \ the collection to the variable `radios`. This is possible because, though an\
    \ element can't share its id with any other elements, any number of elements can\
    \ share the same name. Lines 3 and 7 loop through collection to see whether any\
    \ of the buttons is checked. If so, the code breaks out of the function with the\
    \ `return` keyword in line 5, passing back the Boolean `true` so the form can\
    \ be submitted. If the loop runs its course without finding any buttons checked,\
    \ line 8 displays an alert and line 9 returns `false`, cancelling the form submission.\n\
    \nThe function can be used to validate button sections for any number of forms\
    \ if we specify a parameter, allowing the event-handler to pass the button group\
    \ name to the function.\n\n```\n1  function validateRadios(ename) {\n2    var\
    \ radios = document.getElementsByName(eName);\n```\n\nIn order to use the function\
    \ coded above, the event-handler would have to include the button group name as\
    \ an argument.\n\n`<form onSubmit=\"return validateRadios('r1');\">`\n\nFind the\
    \ interactive coding exercises for this chapter at:\n\n[http://www.ASmarterWayToLearn.com/js/84.html](http://www.ASmarterWayToLearn.com/javascript/84.html)\n\
    \n# 85\n\nForm validation: ZIP codes\n\nNow, a one-field form that asks the user\
