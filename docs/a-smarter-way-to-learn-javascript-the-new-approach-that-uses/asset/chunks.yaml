- fmt: "\n## Global and Local Scope\n\n**Note:** I say that a variable has local scope\
    \ when you declare it in a function. By \"declaring it in a function\" I mean\
    \ that you declare the variable explicitly with the keyword `var`—as opposed to\
    \ casually introducing it into the function without `var`. (The exception is if\
    \ you name it as a parameter, in which case it's declared implicitly as a local\
    \ variable of the function.) If you get sloppy and begin using a new variable\
    \ in the body of a function without explicitly declaring it in the function with\
    \ the keyword `var`, it is global—even though you haven't declared it anywhere\
    \ in the main code.\n\nNow, to illustrate a point, I'm going to do something you'd\
    \ actually never want to do in your code. I'm going to declare a variable both\
    \ in the main code and in the function.\n\nFirst, in the main code:\n```javascript\n\
    var theSum = 1000;\naddNumbers();\n```\n\nThen in the function:\n```javascript\n\
    function addNumbers() {\n  var theSum = 2 + 2;\n}\n```\n\nBy declaring the variable\
    \ twice—once in the main code and again in the function—I've created two different\
    \ variables that share the same name. One `theSum` is global. The other `theSum`\
    \ is local. This is not something you would ever want to do—it sets you up for\
    \ coding mistakes and makes your code almost impossible to follow—but I did it\
    \ to show the difference between global and local scope. \n\nBy declaring `theSum`\
    \ once in the main code, and again in the function, I've created (1) a global\
    \ variable that's useable *almost* everywhere and (2) a local variable of the\
    \ same name that's useable *only* inside the function. Why do I say the global\
    \ variable is useable almost everywhere? Because it's no good inside the function.\
    \ Inside the function, the name `theSum` stands for a local variable, so the name\
    \ can't refer to the global variable. In this situation, coders say the global\
    \ variable is *in the shadow* of the local variable. Inside the function, it can't\
    \ be seen. Inside the function, only the local variable of that name can be seen.\n\
    \nThe local variable `theSum` has a value of 4 inside the function, but `theSum`\
    \ outside the function has a value of 1000.\n\nNow let's journey a little farther\
    \ into Wonderland, Alice.\n\nFirst, a statement in the main code:\n```javascript\n\
    var theSum = addNumbers();\n```\n\nThen a function:\n```javascript\nfunction addNumbers()\
    \ {\n  var theSum = 2 + 2;\n  return theSum;\n}\n```\n\nAgain, this isn't something\
    \ you'd actually code. I use the example only to demonstrate principles. In this\
    \ code, you still have two different variables—a global variable and a local variable—that\
    \ share the same name, `theSum`, but now, thanks to the `return` statement, the\
    \ value of the local variable is assigned to the global variable. Now both variables\
    \ have the same name and the same value, but they're still different variables.\n\
    \nWhich brings us to a question you may be asking:\n\nIf a function can use a\
    \ global variable, why do you have to pass a value from an argument to a parameter?\
    \ Why not just declare a global variable, then have the function use it? Well,\
    \ you can, but asking functions to work with global variables is asking them to\
    \ eavesdrop on the main code, and like human eavesdropping, it invites mischief\
    \ in the form of confusion and unintended consequences. There is no controversy\
    \ among coders about this. It's always best to pass values explicitly to functions\
    \ through arguments. Global variables have no place in functions.\n\nThe same\
    \ logic applies to the argument for using the `return` statement. You *can* change\
    \ the value of a global variable within a function. When you do, the value of\
    \ it changes everywhere, including in the main code. No `return` is needed. But\
    \ it's better practice to use a local variable within the function, then pass\
    \ that value back explicitly through a `return` statement.\n\nFind the interactive\
    \ coding exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/38.html](http://www.ASmarterWayToLearn.com/javascript/38.html)\n\
    \n## 39. `switch` Statements: How to Start Them\n\nConsider this chain of conditional\
    \ statements.\n```javascript\nif (dayOfWk === \"Sat\" || dayOfWk === \"Sun\")\
    \ {\n  alert(\"Whoopee!\");\n} else if (dayOfWk === \"Fri\") {\n  alert(\"TGIF!\"\
    );\n} else {\n  alert(\"Shoot me now!\");\n}\n```\n\nIf it's a weekend day, the\
    \ \"Whoopee!\" alert displays. If it's Friday, the \"TGIF\" alert displays. If\
    \ it's a weekday, the \"Shoot me now\" alert displays.\n\nIt works, but it's unwieldy\
    \ and a little ugly, especially if you have many conditions to test. It's time\
    \ for you to learn a more elegant alternative that you can use for testing myriad\
    \ conditions, the `switch` statement. The more conditions you need to test, the\
    \ more you'll like the `switch` statement. This `switch` statement duplicates\
    \ the functionality of the example above:\n\n```javascript\nswitch(dayOfWk) {\n\
    \  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Sun\" :\n   \
    \ alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"TGIF!\");\n \
    \   break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\nFor the moment,\
    \ I want you to focus on just the first three lines of the code above.\n\n1. Begins\
    \ with the keyword `switch`. Bumping up against it is the variable that's being\
    \ tested, inside parentheses. Then there's an opening curly bracket.\n2. The first\
    \ possibility, that the variable `dayOfWeek` has the value `\"Sat\"`. Begins with\
    \ the keyword `case`. Then the value that is being tried, `\"Sat\"`. Then a space\
    \ and a colon.\n3. The statement that executes if the test passes—if `dayOfWeek`\
    \ does, in fact, have the value `\"Sat\"`. This statement is indented. Any number\
    \ of statements can execute if the test passes.\n\nFind the interactive coding\
    \ exercises for this chapter at: [http://www.ASmarterWayToLearn.com/js/39.html](http://www.ASmarterWayToLearn.com/javascript/39.html)\n\
    \n## 40. `switch` Statements: How to Complete Them\n\nIn the last chapter you\
    \ focused on the first three lines of this `switch` statement.\n\n```javascript\n\
    switch(dayOfWk) {\n  case \"Sat\" :\n    alert(\"Whoopee\");\n    break;\n  case\
    \ \"Sun\" :\n    alert(\"Whoopee\");\n    break;\n  case \"Fri\" :\n    alert(\"\
    TGIF!\");\n    break;\n  default :\n    alert(\"Shoot me now!\");\n}\n```\n\n\
    In this chapter you'll tackle the rest of the code.\n\nThe first line of an `if`\
    \ statement is followed by a statement (or statements) that executes if the condition\
    \ is true. A `switch` statement works similarly. On the line below each `case`\
    \ clause, there's a statement (or statements) that executes if the case is true.\n\
    \nOnce again, the code that executes if the case is true is indented 2 spaces.\
    \ (The universal convention is that it is indented by some amount. Opinions differ\
    \ on how much is best. I standardize on a 2-space indentation, which is common\
    \ but far from universal.)\n\nBut why do all of the cases except the last one\
    \ include a `break` statement?\n\nJavaScript has an inconvenient quirk: After\
    \ a true case is found, JavaScript not only executes the statement(s) immediately\
    \ below that case. It executes *all* the statements for *all* the cases below\
    \ it. So after a true case is found and the conditional code executes, you need\
    \ to jump out of the `switch` block by coding a `break` statement. If, for example,\
    \ you omit the `break` statements in the code above, this happens:\n\n1. An alert\
    \ displays saying \"Whoopee!\"\n2. A second alert displays saying \"Whoopee!\"\
    \n3. A third alert displays saying \"TGIF!\"\n4. A fourth alert displays saying\
    \ \"Shoot me now.\"\n\nNow let's look at line 11.\n```javascript\ndefault :\n\
    \  alert(\"Shoot me now!\");\n}\n```\n\nThe keyword `default` works like `else`\
    \ in an `if...else` statement. The code that follows it executes if none of the\
    \ conditions above it are met. So, in the example above, if `dayOfWk` isn't `\"\
    Sat\"` or `\"Sun\"` or `\"Fri\"`—if it's *anything* other than those three values—an\
    \ alert displays saying \"Shoot me now.\"\n\nNote that `default` is followed by\
    \ a space and a colon, just like the `case` clauses above it.\n\nNote also that\
    \ there's no `break` statement. That's because `default` always comes last, which\
    \ means there are no statements below it to execute inappropriately.\n"
