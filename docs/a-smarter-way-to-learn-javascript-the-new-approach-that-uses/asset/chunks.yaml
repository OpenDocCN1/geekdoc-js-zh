    11 }

    12 else {

    13   e = f;

    14 }

    ```


    嵌套层级通过花括号的位置传达给 JavaScript。在顶层 *if* 内部嵌套了三个代码块。如果顶层 *if* 测试的条件（即 `c` 与 `d` 具有相同的值）为
