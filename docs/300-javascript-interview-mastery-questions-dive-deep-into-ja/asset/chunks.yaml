    ![](img/Image00000.jpg)


    # 300 道 JavaScript 面试精通题

    深入探索 JavaScript 理论、语法与 API，自信应对面试

    *文本版权 © 2020 Jonathan Middaugh 保留所有权利。*


    ## 引言

    本书包含涵盖 JavaScript 语法、规则、功能及理论的问题。旨在帮助你提升 JavaScript 知识，同时让你接触到 JavaScript 中的一些边界情况和特殊场景。我发现，这类例子最能巩固开发者对这门有趣语言的理解。


    本书中有少数问题针对浏览器中运行的 JavaScript，但大多数问题与环境无关。少数问题还涉及 TypeScript，但会特别标注。本书分为 4 个“测试”，每个问题都链接到书末的答案。


    作为额外福利，下面两个链接提供了另外 50 道免费 JavaScript 面试精通题和 50 道免费 TypeScript 面试精通题。


    [50 道 JavaScript 面试精通题](https://medium.com/the-clever-dev/50-difficult-javascript-interview-questions-88e6e92367e7?source=friends_link&sk=321a35a056e98aef103cc540794bd79f)（发布在我的
    Medium.com 专栏上）。


    [50 道 TypeScript 面试精通题](https://medium.com/the-clever-dev/50-difficult-typescript-interview-questions-a7103299e210?source=friends_link&sk=d6f5b58ec947559175b3972498395fa9)（发布在我的
    Medium.com 专栏上）。


    ## 关于作者

    如果你喜欢本书并希望继续与我一起学习 JavaScript，请查看以下内容：


    * [我的 Medium.com 作品集](https://medium.com/@jonathan.middaugh) – 包含 JavaScript 文章以及我偶尔从事的开发者副业

    * [我的 YouTube 频道](https://www.youtube.com/channel/UCb6AZy0_D1y661PMZck3jOw) –
    与我的 Medium.com 作品集相同，但我喜欢制作视频时的互动感。此外，我相信它们能以不同方式帮助不同的人学习

    * [Twitter](https://twitter.com/SDevpreneur) – 在此关注我，获取最新文章动态以及开发者社区中有趣的内容


