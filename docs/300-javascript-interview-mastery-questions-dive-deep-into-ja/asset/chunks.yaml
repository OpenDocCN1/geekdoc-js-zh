    \n答案是 A。\n\n### Q49\n`Promise.resolve()` 返回什么类型的对象？\n答案：一个处于已解决状态且具有给定解决值的 promise。\n\
    \n### Q50\n`setTimeout()` 和 `setInterval()` 有什么区别？选择两个选项。\nA) `setTimeout` 在指定时间过后执行一次\n\
