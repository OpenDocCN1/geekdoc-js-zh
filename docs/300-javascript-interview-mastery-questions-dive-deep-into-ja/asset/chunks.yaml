  trans: "\n\n# 测试 1 答案\n\n## 测试 1\n\n### Q41\n下面的代码会向控制台输出什么，为什么？\n```javascript\n\
    const test = (incrementer) => {\n  if (incrementer < 0){\n    return;\n  }\n \
    \ console.log('first: ' + incrementer);\n  test(incrementer - 1);\n  console.log('second:\
    \ ' + incrementer)\n}\ntest(2);\n```\n输出如下：\n\"first: 2\"\n\"first: 1\"\n\"first:\
    \ 0\"\n\"second: 0\"\n\"second: 1\"\n\"second: 2\"\n\n这个函数是递归的。观察它如何堆叠函数调用以及代码执行的顺序很有趣。\n\
    \n### Q42\n判断对错？`Promise.any()` 和 `Promise.race()` 的区别在于 `Promise.race()` 返回第一个落定的\
    \ Promise（无论兑现还是拒绝），而 `Promise.any()` 会继续解析直到有一个 Promise 被兑现，并且只有当所有 Promise 都被拒绝时才会拒绝。\n\
    A) 正确\nB) 错误\n\n答案是 A。`Promise.any()` 和 `Promise.race()` 非常相似。\n\n### Q43\n判断对错？JavaScript\
    \ 不支持重载？\nA) 正确\nB) 错误\n\n答案是 A。虽然 JavaScript 本身不支持重载，但 TypeScript 支持。此外，可以通过让函数在未传入所有可能参数时返回不同输出来模拟重载。\n\
    \n### Q44\n不使用 class 语法，从父对象创建一个子对象。\n\n一个示例解决方案：\n```javascript\nfunction Dog(name)\
    \ {\n  this.name = name;\n}\nconst buddy = new Dog(\"buddy\");\nconst rover =\
    \ Object.create(buddy);\n```\n如果你检查 `Object.getPrototypeOf(rover)`，你会看到 `buddy`\
    \ 是 `rover` 的父原型。\n\n### Q45\n在数组的 `forEach` 循环中，`return` 语句的作用是什么？\nA) 什么都不做\n\
    B) 返回指定的值\nC) 结束该次循环\n\n答案是 A。如果你需要从循环中返回值，不要使用 `forEach` 循环。\n\n### Q46\n判断对错？`for`\
    \ 循环中最多有三个参数。\nA) 正确\nB) 错误\n\n答案是 B。例如：\n```javascript\nfor (var i = 0, j = 0;\
    \ i <= 10; i++, j++){\n  …\n}\n```\n这是有效的 `for` 循环语法。\n\n### Q47\n判断对错？`RegExp`\
    \ 没有任何属性。\nA) 正确\nB) 错误\n\n答案是 B。`RegExp` 有很多属性，例如 `.flags` 和 `.global`。\n\n###\
    \ Q48\n```javascript\nfunction resolveQuickly(x) {\n  return new Promise(resolve\
    \ => {\n    console.log(x)\n  });\n}\nasync function asyncTest() {\n  var x =\
    \ resolveQuickly(10);\n  console.log(5);\n}\nasyncTest();\n```\nA) 10, 5\nB) 5,\
    \ 10\nC) 它不会打印任何内容\n\n答案是 A。这个函数在 `Promise` 中没有任何异步操作，所以 `Promise` 是同步解析的。\n\n\
    ### Q49\n什么是阻塞？\n答案：当一个缓慢或耗时的进程阻止剩余代码的执行，直到它完成时，就称为阻塞。\n\n### Q50\n以下哪个不是 `Promise`\
    \ 的有效状态？\nA) Pending（待定）\nB) Fulfilled（已兑现）\nC) Rejected（已拒绝）\nD) Completed（已完成）\n\
    \n答案是 D。\n\n### Q51\n哪个函数会在浏览器下一次重绘显示之前执行指定的代码块？\nA) `requestAnimationFrame()`\n\
    B) `setTimeout()`\nC) `requestRepaintDelay()`\n\n答案是 A。\n\n### Q52\n假设你想在动画中达到\
    \ 60fps 的刷新率。编写一个 `setInterval` 函数，以 60fps 触发下面伪代码中的 `animate` 函数。\n```javascript\n\
    function animate() {...}\n```\n答案：`setInterval(animate, Math.ceil(1000/60))`\n\
    \n### Q53\nJavaScript 中有哪两种导出方式？\nA) Abstract（抽象）\nB) Whole（整体）\nC) Default（默认）\n\
    D) Named（命名）\n\n答案是 C、D。\n\n### Q54\n你会使用什么语句来迭代异步对象？\nA) if async then\nB) `for\
    \ await…of`\nC) async iterable\nD) do while async\n\n答案是 B。\n\n### Q55\n为什么在导入模块时要使用别名？\n\
    答案：可能是因为模块名称很长，或者名称不能正确表达代码的功能。\n```javascript\nimport {longLongLongLongName as\
    \ shortName}\n```\n\n### Q56\n判断对错？下面的代码输出相同的结果。\n```javascript\nvar i, j;\nloop1:for\
    \ (i = 0; i < 5; i++) {\n  loop2:for (j = 0; j < 5; j++) {\n    if (i === 1 &&\
    \ j === 1) {continue loop1;}\n    console.log(`i: ${i}, j: ${j}`)\n  }\n}\n\n\
    var i, j\nloop1:for (i = 0; i < 5; i++) {\n  loop2:for (j = 0; j < 5; j++) {\n\
    \    if (i === 1 && j === 1) {break loop2;}\n    console.log(`i: ${i}, j: ${j}`)\n\
    \  }\n}\n```\nA) 正确\nB) 错误\n\n答案是 A。\n\n### Q57\n判断对错？以下两者等价。\n`var a = 1; var\
    \ z = a;`\n和\n`var a, z = a = 1;`\nA) 正确\nB) 错误\n\n答案是 A。\n\n### Q58\n使用 reducer\
    \ 找出下面数组的最小值。\n`const arr = [5, 10, 12, 4, 2];`\n\n一个可能的答案：\n```javascript\nconst\
    \ reducedVal = arr.reduce((accumulator, element) => {\n  if (accumulator > element)\
    \ {\n    return element;\n  }\n  return accumulator;\n});\n```\n\n### Q59\nJavaScript\
    \ 中的子程序是什么？\n答案：子程序是在主程序中遇到的一个函数，它被保存到一个对象中并存储起来供以后使用。执行作用域（变量、参数等）与子程序一起存储。\n\
    \n### Q60\n判断对错？你可以使用 `eventHandlers` 的 cut 和 copy 来阻止用户将内容从浏览器复制到剪贴板？\nA) 正确\n\
    B) 错误\n\n答案是 A。这些事件处理程序是 Web API 的一部分。\n\n### Q61\n下面的代码会向控制台输出什么，为什么？\n```javascript\n\
    let i = 10\nfor(; i < 12;){\n  console.log(++i);\n}\n```\nA) lint 错误\nB) 运行时错误\n\
    C) 无限循环\nD) 11, 12\n\n答案是 D。`for` 循环不需要三个语句，第一个可以为空。\n\n### Q62\n创建新对象的三种方式是什么？\n\
    A) `new Object()`\nB) `Object.create()`\nC) 工厂模式\nD) 字面量表示法\n\n答案是 A、B、D。字面量表示法的例子：`const\
    \ obj = { a: 1 }`\n\n### Q63\n下面的代码会向控制台输出什么，为什么？\n```javascript\nconst a = {x:\
    \ 1}\nconst b = {...a}\nconst c = {};\nObject.assign(c, a);\na.x = 2;\nconsole.log(a.x);\n\
    console.log(b.x);\nconsole.log(c.x);\n```\nA) 1, 1, 1\nB) 2, 2, 2\nC) 1, 2, 2\n\
    D) 2, 1, 1\nE) 2, 1, 2\nF) 2, 2, 1\n\n答案是 D。\n\n### Q64\n实现一个经典的闭包示例，每次调用时递增。\n\
    \n一个可能的答案：\n```javascript\nvar increment = (function () {\n  var incrementer =\
