    \ an infinite loop\nD) Lint error\n\nThe answer is C. `i*1.5` doesn’t change the\
    \ value of `i`.\n\n### Q62\nWhich of the following is a difference between `Object.assign()`\
    \ and the spread syntax?\nA) Spread syntax calls setters, `Object.assign()` does\
    \ not\nB) `Object.assign` calls setters, spread syntax does not\nC) They actually\
    \ behave identically\n\nThe answer is B.\n\n### Q63\nGive an example of a one\
    \ line check to see if a property exists on object `dog`.\n`const dog = { sound:\
    \ ‘woof’, legs: 4 }`\nOne possible answer: `let propExists = ‘sound’ in dog;`\n\
    \n### Q64\nWhich of the following is not a way to convert the `arguments` function\
    \ object to an array?\nA) `arguments.assign(arguments)`\nB) `Array.prototype.slice.call(arguments);`\n\
    C) `Array.from(arguments);`\nD) `[...arguments]`\n\nThe answer is A.\n\n### Q65\n\
    What is the target phase of event handling?\nThe target phase is the second of\
    \ the three phases of event handling. The first is capture, the third is bubbling.\n\
    \n### Q66\nWhat does the double bang (`!!`) do?\nA) nothing\nB) returns the truthy\
    \ value of an object\nC) throws an error\n\nThe answer is B. Example: `!!0` returns\
    \ `false`.\n\n### Q67\n`1 < 2 < 3`\nA) true\nB) false\n\nThe answer is A. `1 <\
