    \ 60fps 的刷新率。编写一个 `setInterval` 函数，以 60fps 触发下面的伪代码 `animate` 函数。\n\n```javascript\n\
    function animate() {...}\n```\n\nQ52 已回答。\n\n**Q53.** JavaScript 中的两种导出类型是什么？\n\
    \nA) 抽象  \nB) 整体  \nC) 默认  \nD) 命名\n\nQ53 已回答。\n\n**Q54.** 你会使用什么语句来迭代异步对象？\n\n\
    A) `if async then`  \nB) `for await…of`  \nC) `async iterable`  \nD) `do while\
    \ async`\n\nQ54 已回答。\n\n**Q55.** 为什么在导入模块时使用别名？\n\nQ55 已回答。\n\n**Q56.** 判断对错？下面的代码产生相同的输出。\n\
    \n```javascript\nvar i, j;\nloop1:\nfor (i = 0; i < 5; i++) {\n  loop2:\n  for\
    \ (j = 0; j < 5; j++) {\n    if (i === 1 && j === 1) {\n      continue loop1;\n\
    \    }\n    console.log(`i: ${i}, j: ${j}`)\n  }\n}\nvar i, j\nloop1:\nfor (i\
    \ = 0; i < 5; i++) {\n  loop2:\n  for (j = 0; j < 5; j++) {\n    if (i === 1 &&\
    \ j === 1) {\n      break loop2;\n    }\n    console.log(`i: ${i}, j: ${j}`)\n\
    \  }\n}\n```\n\nA) 正确  \nB) 错误\n\nQ56 已回答。\n\n**Q57.** 判断对错？以下两者是等价的。\n\n```javascript\n\
    var a = 1;\nvar z = a;\n```\n\n和\n\n```javascript\nvar a, z = a = 1;\n```\n\n\
    A) 正确  \nB) 错误\n\nQ57 已回答。\n\n**Q58.** 使用 reducer 找到下面数组的最小值。\n\n```javascript\n\
    const arr = [5, 10, 12, 4, 2];\n```\n\nQ58 已回答。\n\n**Q59.** JavaScript 中的子程序是什么？\n\
    \nQ59 已回答。\n\n**Q60.** 判断对错？你可能使用事件处理程序 `cut` 和 `copy` 来阻止用户将内容从浏览器复制到剪贴板？\n\n\
    A) 正确  \nB) 错误\n\nQ60 已回答。\n\n**Q61.** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\n\
    let i = 10\nfor(; i< 12;){\n  console.log(++i);\n}\n```\n\nA) lint 错误  \nB) 运行时错误\
    \  \nC) 无限循环  \nD) 11, 12\n\nQ61 已回答。\n\n**Q62.** 创建新对象的三种方法是什么？\n\nA) `new Object()`\
    \  \nB) `Object.create()`  \nC) 工厂模式  \nD) 字面量表示法\n\nQ62 已回答。\n\n**Q63.** 下面的代码会向控制台输出什么，为什么？\n\
    \n```javascript\nconst a = {x: 1}\nconst b = {...a}\nconst c = {};\nObject.assign(c,\
    \ a);\na.x = 2;\nconsole.log(a.x);\nconsole.log(b.x);\nconsole.log(c.x);\n```\n\
    \nA) 1, 1, 1  \nB) 2, 2, 2  \nC) 1, 2, 2  \nD) 2, 1, 1  \nE) 2, 1, 2  \nF) 2,\
    \ 2, 1\n\nQ63 已回答。\n\n**Q64.** 实现一个经典的闭包例子，每次调用时递增。\n\nQ64 已回答。\n\n**Q65.** 如果\
    \ `myFunction` 被调用为 `myFunction(5);`，返回值是什么？\n\n```javascript\nfunction myFunction(x,\
    \ y) {\n  const arr = Array.prototype.slice.call(arguments);\n  return arr.length;\n\
    }\n```\n\nA) 0  \nB) 1  \nC) 2\n\nQ65 已回答。\n\n**Q66.** `Object.seal()` 会做以下哪些？选择所有适用的。\n\
    \nA) 阻止添加新属性  \nB) 将所有现有属性标记为不可配置  \nC) 阻止更改现有属性的值\n\nQ66 已回答。\n\n**Q67.** `Object.freeze()`\
    \ 会做以下哪些？选择所有适用的。\n\nA) 阻止添加新属性  \nB) 阻止删除现有属性  \nC) 阻止更改属性的可枚举性  \nD) 阻止更改属性的可配置性\
    \  \nE) 阻止更改属性的可写性  \nF) 阻止更改属性的值  \nG) 阻止更改对象的原型\n\nQ67 已回答。\n\n**Q68.** `event.target`\
    \ 和 `event.currentTarget` 有什么区别？\n\nA) `event.currentTarget` 返回触发监听器所附加到的元素  \n\
    B) `event.target` 返回触发事件的最细粒度元素。  \nC) `event.target` 返回触发监听器所附加到的元素  \nD) `event.currentTarget`\
    \ 返回触发事件的最细粒度元素。\n\nQ68 已回答。\n\n**Q69.** 如果你需要稍后调用一个匿名函数，请展示创建该匿名函数时使用的语法。\n\n\
    Q69 已回答。\n\n**Q70.** 数组 `sort()` 方法的默认排序是什么？\n\nA) 按数值从大到小  \nB) 按数值从小到大  \nC)\
    \ 按字符值从大到小  \nD) 按字符值从小到大\n\nQ70 已回答。\n\n**Q71.** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\n\
    let scope = \"global\";\ngetScope = () => {\n  var scope = \"local\";\n  const\
    \ inner = () => {\n    return scope;\n  }\n  return inner;\n}\ngetScope()();\n\
    ```\n\nA) `global`  \nB) `local`  \nC) `undefined`\n\nQ71 已回答。\n\n**Q72.** 下面的代码会向控制台输出什么，为什么？\n\
    \n```javascript\nconsole.log(3 + '2');\n```\n\nA) 32  \nB) 5  \nC) 运行时错误\n\nQ72\
    \ 已回答。\n\n**Q73.** 什么是竞态条件？\n\nQ73 已回答。\n\n**Q74.** 什么是函数式编程？\n\nQ74 已回答。\n\n\
    **Q75.** 什么是高阶函数？\n\nA) 由多个函数或接口组成的函数  \nB) 可以接受函数作为参数，或返回另一个函数的函数  \nC) 作为子对象超类的函数\n\
    \nQ75 已回答。\n\n"
- fmt: "\n# Test 1 Answers\n\n## Test 1\n\n### Q41\nWhat will the code below output\
    \ to the console and why?\n```javascript\nconst test = (incrementer) => {\n  if\
    \ (incrementer < 0){\n    return;\n  }\n  console.log('first: ' + incrementer);\n\
    \  test(incrementer - 1);\n  console.log('second: ' + incrementer)\n}\ntest(2);\n\
    ```\nIt outputs the following:\n\"first: 2\"\n\"first: 1\"\n\"first: 0\"\n\"second:\
    \ 0\"\n\"second: 1\"\n\"second: 2\"\n\nThis function is recursive. It is interesting\
    \ to see how it stacks function calls and the order the code executes in.\n\n\
    ### Q42\nTrue or False? The difference in `Promise.any()` and `Promise.race()`\
    \ is that `Promise.race()` returns the first settled Promise (fulfilled or rejected),\
    \ while `Promise.any()` continues to resolve until a promise is fulfilled, and\
    \ only rejects if all promises are rejected.\nA) True\nB) False\n\nThe answer\
    \ is A. `Promise.any()` and `Promise.race()` are very similar.\n\n### Q43\nTrue\
    \ or False? JavaScript does not support overloading?\nA) True\nB) False\n\nThe\
    \ answer is A. While JavaScript does not natively support overloading, TypeScript\
    \ does. Also, overloading can be simulated in JavaScript by having a function\
    \ return a different output when not all possible parameters are passed to it.\n\
    \n### Q44\nWithout using class syntax, create a child object from a parent object.\n\
    \nOne example solution:\n```javascript\nfunction Dog(name) {\n  this.name = name;\n\
    }\nconst buddy = new Dog(\"buddy\");\nconst rover = Object.create(buddy);\n```\n\
    If you examine `Object.getPrototypeOf(rover)`, you will see that `buddy` is `rover`’s\
    \ parent prototype.\n\n### Q45\nWhat does a `return` statement do in a `forEach`\
    \ loop on an `Array`?\nA) Nothing\nB) Returns the specified value\nC) Ends that\
    \ loop\n\nThe answer is A. If you need to return a value from a loop, don’t use\
    \ the `forEach` loop.\n\n### Q46\nTrue or False? There are a maximum of three\
    \ parameters in a `for` loop.\nA) True\nB) False\n\nThe answer is B. An example:\n\
    ```javascript\nfor (var i = 0, j = 0; i <= 10; i++, j++){\n  …\n}\n```\nThis is\
    \ valid `for` loop syntax.\n\n### Q47\nTrue or False? `RegExp` do not have any\
    \ properties.\nA) True\nB) False\n\nThe answer is B. `RegExp`s have many properties,\
    \ such as `.flags` and `.global`.\n\n### Q48\n```javascript\nfunction resolveQuickly(x)\
    \ {\n  return new Promise(resolve => {\n    console.log(x)\n  });\n}\nasync function\
    \ asyncTest() {\n  var x = resolveQuickly(10);\n  console.log(5);\n}\nasyncTest();\n\
    ```\nA) 10, 5\nB) 5, 10\nC) It does not print\n\nThe answer is A. This function\
    \ has nothing asynchronous in the `Promise`, so the `Promise` resolves synchronously.\n\
    \n### Q49\nWhat is blocking?\nAnswer: When a slow or expensive process blocks\
    \ the execution of remaining code until it is complete.\n\n### Q50\nWhich of the\
    \ following is not a valid state for a `Promise`?\nA) Pending\nB) Fulfilled\n\
    C) Rejected\nD) Completed\n\nThe answer is D.\n\n### Q51\nWhich function executes\
    \ a specified code block before the browser next repaints the display?\nA) `requestAnimationFrame()`\n\
    B) `setTimeout()`\nC) `requestRepaintDelay()`\n\nThe answer is A.\n\n### Q52\n\
    Assume you want to achieve a refresh rate of 60fps on an animation. Write a `setInterval`\
    \ function that triggers the below psuedocoded `animate` function at 60fps.\n\
    ```javascript\nfunction animate() {...}\n```\nAnswer: `setInterval(animate, Math.ceil(1000/60))`\n\
    \n### Q53\nWhat are the two types of exports in JavaScript?\nA) Abstract\nB) Whole\n\
    C) Default\nD) Named\n\nThe answers are C, D.\n\n### Q54\nWhat statement would\
    \ you use to iterate over asynchronous objects?\nA) if async then\nB) `for await…of`\n\
    C) async iterable\nD) do while async\n\nThe answer is B.\n\n### Q55\nWhy use an\
    \ alias when importing a module?\nAnswer: Perhaps the module has a very long name,\
    \ or a name that doesn't express what the code does properly.\n```javascript\n\
    import {longLongLongLongName as shortName}\n```\n\n### Q56\nTrue or False? The\
    \ below code results in the same output.\n```javascript\nvar i, j;\nloop1:for\
    \ (i = 0; i < 5; i++) {\n  loop2:for (j = 0; j < 5; j++) {\n    if (i === 1 &&\
    \ j === 1) {continue loop1;}\n    console.log(`i: ${i}, j: ${j}`)\n  }\n}\n\n\
    var i, j\nloop1:for (i = 0; i < 5; i++) {\n  loop2:for (j = 0; j < 5; j++) {\n\
    \    if (i === 1 && j === 1) {break loop2;}\n    console.log(`i: ${i}, j: ${j}`)\n\
    \  }\n}\n```\nA) True\nB) False\n\nThe answer is A.\n\n### Q57\nTrue or False?\
    \ The following are equivalent.\n`var a = 1; var z = a;`\nand\n`var a, z = a =\
    \ 1;`\nA) True\nB) False\n\nThe answer is A.\n\n### Q58\nUse a reducer to find\
    \ the min value of the below array.\n`const arr = [5, 10, 12, 4, 2];`\n\nA possible\
    \ answer:\n```javascript\nconst reducedVal = arr.reduce((accumulator, element)\
    \ => {\n  if (accumulator > element) {\n    return element;\n  }\n  return accumulator;\n\
    });\n```\n\n### Q59\nWhat is a subroutine in JavaScript?\nAnswer: A subroutine\
    \ is a function encountered in the main routine that is then saved to an object\
    \ and stored for later use. The execution scope (variables, params, etc) are stored\
    \ with the subroutine.\n\n### Q60\nTrue or False? You might use `eventHandlers`\
    \ cut and copy to keep a user from copying content from the browser to the clipboard?\n\
    A) True\nB) False\n\nThe answer is A. These event handlers are part of the Web\
    \ API.\n\n### Q61\nWhat will the code below output to the console and why?\n```javascript\n\
    let i = 10\nfor(; i < 12;){\n  console.log(++i);\n}\n```\nA) lint error\nB) runtime\
    \ error\nC) infinite loop\nD) 11, 12\n\nThe answer is D. A `for` loop doesn’t\
    \ require three statements, and the first can be empty.\n\n### Q62\nWhat are the\
    \ three ways to create a new object?\nA) `new Object()`\nB) `Object.create()`\n\
    C) factory pattern\nD) literal notation\n\nThe answer is A, B, D. An example of\
    \ literal notation: `const obj = { a: 1 }`\n\n### Q63\nWhat will the code below\
    \ output to the console and why?\n```javascript\nconst a = {x: 1}\nconst b = {...a}\n\
    const c = {};\nObject.assign(c, a);\na.x = 2;\nconsole.log(a.x);\nconsole.log(b.x);\n\
    console.log(c.x);\n```\nA) 1, 1, 1\nB) 2, 2, 2\nC) 1, 2, 2\nD) 2, 1, 1\nE) 2,\
    \ 1, 2\nF) 2, 2, 1\n\nThe answer is D.\n\n### Q64\nImplement the classic example\
    \ of a closure that increments up each time it is called.\n\nA potential answer:\n\
    ```javascript\nvar increment = (function () {\n  var incrementer = 0;\n  return\
    \ function () {\n    incrementer += 1; \n    return incrementer\n  }\n})();\n\
    console.log(increment()); //outputs 1\nconsole.log(increment()); //outputs 2\n\
    console.log(increment()); //outputs 3\n```\n\n### Q65\nIf `myFunction` is called\
    \ as `myFunction(5)`, what will be the return value?\n```javascript\nfunction\
    \ myFunction(x, y) {\n  const arr = Array.prototype.slice.call(arguments);\n \
    \ return arr.length;\n}\n```\nA) 0\nB) 1\nC) 2\n\nThe answer is B.\n\n### Q66\n\
    Which of the below does `Object.seal()` do? Select all that apply.\nA) prevents\
    \ new properties from being added\nB) marks all existing properties as non-configurable\n\
    C) prevents values of existing properties from being changed\n\nThe answer is\
    \ A, B. A similar but more rigorous function is `Object.freeze()`.\n\n### Q67\n\
    Which of the below does `Object.freeze()` do? Select all that apply.\nA) prevents\
    \ new properties from being added\nB) prevents existing properties from being\
    \ removed\nC) prevents changing the enumerability of properties\nD) prevents changing\
    \ the configurability of properties\nE) prevents changing the writability of properties\n\
    F) prevents changing the values of properties\nG) prevents changing the prototype\
    \ of the object\n\nThe answer is All of the Above.\n\n### Q68\nWhat is the difference\
    \ between `event.target` and `event.currentTarget`?\nA) `event.currentTarget`\
    \ returns the element the triggered listener was attached to\nB) `event.target`\
    \ returns the most granular element the event was triggered on\nC) `event.target`\
    \ returns the element the triggered listener was attached to\nD) `event.currentTarget`\
    \ returns the most granular element the event was triggered on\n\nThe answers\
    \ are A, B. `event.currentTarget` changes as the event bubbles up, `event.target`\
    \ stays the same.\n\n### Q69\nIf you need to call an anonymous function later,\
    \ show what syntax you would use for creating the anonymous function.\n\nA possible\
    \ answer:\n```javascript\nlet caller = function () {\n  console.log('call me maybe');\n\
    };\n```\nThe function is anonymous, but is stored to a variable for later reference.\n\
    \n### Q70\nWhat is the default sort of the `Array.sort()` method?\nA) largest\
    \ to smallest by numeric value\nB) smallest to largest by numeric value\nC) largest\
    \ to smallest by character value\nD) smallest to largest by character value\n\n\
    The answer is D. For example, 10 will be placed before 2 because the ‘1’ will\
    \ be evaluated against the ‘2’.\n\n### Q71\nWhat will the code below output to\
    \ the console and why?\n```javascript\nlet scope = \"global\";\ngetScope = ()\
    \ => {\n  var scope = \"local\";\n  const inner = () => {\n    return scope\n\
    \  }\n  return inner;\n}\ngetScope()();\n```\nA) global\nB) local\nC) undefined\n\
    \nThe answer is B. The inner arrow function has the scope of the location it was\
    \ defined.\n\n### Q72\nWhat will the code below output to the console and why?\n\
    `console.log(3 + ‘2’);`\nA) 32\nB) 5\nC) runtime error\n\nThe answer is A. 3 will\
    \ be coerced into a string.\n\n### Q73\nWhat is a race condition?\nAnswer: A race\
    \ condition is when two threads or async processes must complete in the proper\
    \ order and update some shared state, otherwise there will be a bug or unwanted\
    \ outcome.\n\n### Q74\nWhat is functional programming?\nAnswer: A coding paradigm\
    \ utilizing declarative code and pure functions.\n\n### Q75\nWhat is a higher\
    \ order function?\nA) a function composed of multiple functions or interfaces\n\
    B) a function that can take a function as an argument, or that returns another\
    \ function\nC) a function that is a superclass for child objects\n\nThe answer\
    \ is B.\n\n## Test 2 Answers\n\n### Q1\nConsider the following code:\n```typescript\n\
    class Person {\n  firstName: string;\n  lastName: string;\n}\nconst myPerson =\
    \ new Person();\nconsole.log(myPerson.a);\n```\nExplain how the prototype chain\
    \ is used to determine that `myPerson.a` is undefined?\n\nThe browser checks `myPerson.[[Prototype]]`\
    \ and does not see a property named `a`. Then the browser checks `myPerson.[[Prototype]].[[Prototype]]`\
    \ (which is the `Object` prototype) and does not see a property named `a`. Then\
    \ the browser checks `myPerson.[[Prototype]].[[Prototype]].[[Prototype]]`, which\
    \ is `null`, so the browser returns `undefined`.\n\n### Q2\nWhat does the `class`\
    \ keyword do in JavaScript?\nA) It conveys real meaning beyond what a typical\
    \ object is\nB) It is syntactic sugar to make JavaScript more object oriented\n\
    C) It creates an interface-like object that can be used for inheritance\n\nThe\
    \ answer is B. Even when the `class` keyword is used, JavaScript still uses prototypical\
    \ inheritance.\n\n### Q3\nWhat will the code below output to the console and why?\n\
    ```javascript\nlet x = 10;\nif(x){\n  let x = 12;\n  console.log(x);\n}\n```\n\
    A) 10\nB) 12\nC) It will throw an error\n\nThe answer is B. The inner `x` has\
    \ priority over the outer `x` variable.\n\n### Q4\nTrue or False? Tasks from the\
    \ `queueMicrotask` queue are executed in a Last In, First Out basis.\nA) True\n\
    B) False\n\nThe answer is B. The tasks are in fact executed in a First In, First\
    \ Out order.\n\n### Q5\nWhat would be a name for this function that follows “clean\
    \ code” principles?\n```javascript\nconst pntDT = () => {\n  const today = new\
    \ Date();\n  const time = today.getHours() + \":\" + today;\n  console.log(time);\n\
    };\npntDT();\n```\nThere are many possible function names that would comply better\
    \ with clean code principles. For example, `printDateAndTime()` would be a better\
    \ name because it leaves no doubt as to what the function does.\n\n### Q6\nWhich\
    \ of the following is not a step to create and register a new custom element?\n\
    A) Create an HTML container in the DOM\nB) Create a javascript class that defines\
    \ the behavior of the element\nC) Register the class and a `DOMString` representing\
    \ the name of the element with the `CustomElementRegistry` object\n\nThe answer\
    \ is A.\n\n### Q7\nBriefly explain the Shadow DOM API.\nThe Shadow DOM API provides\
    \ a way to attach a hidden separate DOM to an element not accessible through the\
    \ usual JS DOM manipulation API. Shadow DOM provides for encapsulation of Web\
    \ Components. Hidden DOM trees attach to elements in the regular DOM tree.\n\n\
    ### Q8\nWhat method attaches a shadow DOM tree to the specified element and returns\
    \ a reference to its `ShadowRoot`?\nA) `Element.shadowAdd()`\nB) `Element.setDOMShadow()`\n\
    C) `Element.attachShadow()`\n\nThe answer is C.\n\n### Q9\nWhat value will `arr[2][1]`\
    \ return?\n```javascript\nconst arr = [[\"a\", \"b\", \"c\"],[\"d\", \"e\", \"\
    f\"],[\"g\", \"h\", \"i\"]];\n```\nA) d\nB) h\nC) b\nD) None of the above\n\n\
    The answer is B. First, arrays are zero-based in JavaScript. Therefore, `arr[2][1]`\
    \ will access the 3rd element of the outer array, and the 2nd element of the inner\
    \ array, returning a value of “h”.\n\n### Q10\nWhat will the code below output\
    \ to `<app>`?\n```javascript\ndocument.getElementById(\"app\").innerHTML = `<div>hewohewo2</div>`\n\
    ```\nA) hewo hewo2\nB) hewohewo2\nC) hewo hewo2\nD) Does not compile\n\nThe answer\
    \ is C.\n\n### Q11\nWhat pattern does jQuery use to make a single instance of\
    \ its globally available jQuery object?\nA) OOP\nB) Factory\nC) Singleton\nD)\
    \ None\n\nThe answer is C. One instance of the jQuery object is created globally.\n\
    \n### Q12\nWhat is the difference between `window.localStorage` and `window.sessionStorage`?\
    \ Select the best answer.\nA) `localStorage` stores key/value pairs in the web\
    \ browser, and `localStorage` deletes after the browser closes\nB) `sessionStorage`\
    \ stores key/value pairs in the web browser, and `sessionStorage` deletes after\
    \ the browser closes\nC) Both store key/value pairs in the web browser, but `localStorage`\
    \ deletes after the browser closes\nD) Both store key/value pairs in the web browser,\
    \ but `sessionStorage` deletes after the browser closes\n\nThe answer is D.\n\n\
    ### Q13\nWhat will the code below output to the console and why?\n```javascript\n\
    let arr1 = [1, 2, 3];\narr1.push(4);\narr1.pop();\narr1.slice(1, 2);\narr1.splice(1,\
    \ 2);\nconsole.log(arr1);\n```\nA) 1\nB) [1]\nC) [1,2]\nD) [2,3]\nE) Prints nothing.\n\
    \nThe answer is B.\n\n### Q14\nTrue or False: The `!` operator returns a boolean.\
    \ Select one option.\nA) True\nB) False\n\nThe answer is A. An example of a situation\
    \ in which `!` can be used is an `if` statement. `if` statements need a boolean\
    \ returned in the evaluation, such as `if(x !== y)`.\n\n### Q15\nEvaluate the\
    \ code below. If both `div` and `button` have a click listener, how can you stop\
