    of the following is not a built-in JS error type?A)  ErrorB)  EvalErrorC) SyntaxErrorD)  TypeErrorE)  UndefinedErrorThe
    answer is E.[Q21 Unanswered.](#text00025.html_a7UG)Q22 Answered.How are numbers
    stored in JavaScript?  Select all that apply.A)  Double precisionB)  64-bitC) 
    Floating point numbersA, B, and C are all correct.[Q22 Unanswered.](#text00026.html_a805)Q23
    Answered.If a function has no return value specified, what value does it return?A)  nullB)  undefinedC)  nothingThe
    answer is B.[Q23 Unanswered.](#text00027.html_a86Z)Q24 Answered.What is the syntax
    for calling a method which may or may not exist on an object?let value = myAPI.testMethod?.();[Q24
    Unanswered.](#text00028.html_a7UB)Q25 Answered.Which of the following is not a
    valid Promise method?A)  Promise.some()B)  Promise.allSettled()C)  Promise.reject()D)  Promise.race()The
    answer is A.[Q25 Unanswered.](#text00029.html_a7MV)Q26 Answered.How can you dynamically
    access an object property based on a variable value?Answer with example variable: let
    key = ''someValue'';myObject[key];[Q26 Unanswered.](#text00030.html_a80F)Q27 Answered.True
    or False?  A string can be modified after it is created.A)  TrueB)  FalseThe answer
    is B.  Strings are immutable in JavaScript.  However, the variable pointing to
    a string can of course be reassigned to another string.[Q27 Unanswered.](#text00031.html_a7R9)Q28
    Answered.True or False? JavaScript is synchronous.A)  TrueB)  FalseThe answer
    is A.  The Queue in JavaScript''s Runtime is synchronous, thus the language is
    synchronous.[Q28 Unanswered.](#text00032.html_a7VT)Q29 Answered.True or False? 
    A nested catch in a promise chain can catch errors thrown higher up in the promise
    chain?A)  TrueB)  FalseThe answer is B.  From MDN docs: “Nesting is a control
    structure to limit the scope of catch statements. Specifically, a nested catch
    only catches failures in its scope and below, not errors higher up in the chain
    outside the nested scope”.See here for more reading: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises[Q29
    Unanswered.](#text00033.html_a7TR)Q30 Answered.True or False?  The Map object
    can have keys that are of types other than strings, such as number.A)  TrueB)  FalseThe
    answer is A.[Q30 Unanswered.](#text00034.html_a83M)Q31 Answered.What will the
    code below output to the console and why?const map = new Map();map.set({},1);console.log(map.get({}));A)  undefinedB)  1C) 
    Compile time errorThe answer is A.  map.get({}) is valid syntax, but the Object
    in the set and in the get are two different empty objects in memory.  Therefore,
    the getter doesn’t return a value.  If the object used for map.set had first been
    assigned to a const, then that const was used in the get, the appropriate value
    would have been returned.[Q31 Unanswered.](#text00035.html_a7P5)Q32 Answered.What
    will the code below output to the console and why?let map1 = new Map([[''a'',
    1],[''b'', 1],[''c'', 1],]);let map2 = new Map([[''a'', 2],[''b'', 2]]);let spreadMap
    = new Map([...map1, ...map2]);A)  Map(3) {"a" => 1, "b" => 1, "c" => 1}B)  Map(3) {"a"
    => 2, "b" => 2, "c" => 1}C)  Map(5) {"a" => 1, "b" => 1, "c" => 1, "a" => 2, "b"
    => 2}The answer is B.  Any identical keys in the second map will override keys
    in the first map.[Q32 Unanswered.](#text00036.html_a7SY)Q33 Answered.True or False?
    Bracket notation can be chained just like dot notation?A)  TrueB)  FalseThe answer
    is A.  obj.prop1.prop2 and obj[‘prop1’][‘prop2’] are equivalent.[Q33 Unanswered.](#text00037.html_a7WH)Q34
    Answered.What will the code below output to the console and why?class Person {name:
    string;DOB: string;}console.log(typeof Person);A)  “class”B)  “function”C)  “object”The
    answer is B.  This is a reminder that classes are simply syntactic sugar that
    make JavaScript feel more object oriented.[Q34 Unanswered.](#text00038.html_a7RF)Q35
    Answered.Examine the code below.  Diagnose an error that will occur.  Assume that
    handleResponse and handleError are properly defined.promise.then(function(response)
    {this.handleResponse();},function(error) {this.handleError();});The answer is
    this is not scoped properly.  Instead, the code needs a way to have the proper
    scope on this , such as using bind or var self = this;[Q35 Unanswered.](#text00039.html_a7T2)Q36
    Answered.What types of properties show up in for...in loops?A)  Executable PropertiesB)  Enumerable
    PropertiesC)  Iterable PropertiesThe answer is B.[Q36 Unanswered.](#text00040.html_a7W0)Q37
    Answered.True or False? .bind(this) immediately calls the bound function.A)  TrueB)  FalseThe
    answer is B.[Q37 Unanswered.](#text00041.html_a7WV)Q38 Answered.What does the
    code print?function getName() {var name = "Jon";function printName() {console.log(name);}printName();}getName();A)  JonB)  undefinedC) 
    Compile time errorThe answer is A.  Inner functions have access to variables declated
    in the outer scope.[Q38 Unanswered.](#text00042.html_a7TS)Q39 Answered.True or
    False?  The await keyword is required with async functions?A)  TrueB)  FalseThe
    answer is B.  An async function returns a promise and has many uses.  The await
    keyword adds extra functionality and overhead that may not be needed.  See [here](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Async_await)
    for an example.[Q39 Unanswered.](#text00043.html_a7Y5)Q40 Answered.What are the
    three ways for a function to refer to itself for recusion? Select three answers.A)  Use
    self.runB)  The function’s nameC)  An in-scope variable that refers to the functionD)  Use
    arguments.calleeThe answers are B, C, D.[Q40 Unanswered.](#text00044.html_a7R6)'
  toc: []
  trans: "\n\n# JavaScript 问答集\n\n## 测试 1 答案\n\n**Q1 已回答。** 以下哪个会先打印？\n\n```javascript\n\
    setTimeout(() => {\n  console.log('setTimeout wins');\n}, 0);\nqueueMicrotask(()\
    \ => {\n  console.log('queueMicrotask wins');\n});\n```\n\nA) `setTimeout` 胜出\
    \  \nB) `queueMicrotask` 胜出  \nC) 编译时错误\n\nQ1 未回答。\n\n**Q2 已回答。** 下面的代码会向控制台输出什么，为什么？\n\
    \n```javascript\nlet x = 10;\nconst byValue = (y) => {\n  y = 20;\n}\nbyValue(x);\n\
    console.log(x);\n```\n\nA) 20  \nB) 10  \nC) 编译时错误\n\n答案是 B。与对象不同，当原始值被传递给函数时，只传递其值，而不是内存位置的引用。因此，对参数的更改只影响函数作用域内的参数。\n\
    \nQ2 未回答。\n\n**Q3 已回答。** 考虑以下代码。它会向控制台输出什么，为什么？\n\n```javascript\nlet x = 5;\n\
    let x = 10;\nconsole.log(x);\n```\n\nA) 5  \nB) 10  \nC) 它会抛出一个编译器错误。\n\n答案是 C。然而，下面的代码可以工作，因为声明的作用域不同（尽管这不是干净的代码）。\n\
    \n```javascript\nlet x = 5;\nif(x){\n  let x = 10;\n  console.log(x);\n}\n```\n\
    \nQ3 未回答。\n\n**Q4 已回答。** 考虑以下代码。每一行输出什么？\n\n```javascript\nconsole.log(new String(\"\
    yes\") === new String(\"yes\")); // 第 1 行\nconsole.log(\"yes\" === \"yes\"); //\
    \ 第 2 行\n```\n\nA) 第 1 行打印 `true`，第 2 行打印 `true`  \nB) 第 1 行打印 `false`，第 2 行打印\
    \ `true`  \nC) 第 1 行打印 `true`，第 2 行打印 `false`  \nD) 第 1 行打印 `false`，第 2 行打印 `false`\n\
    \n答案是 B。第 1 行比较两个对象，发现它们各自是唯一的（字面上不是同一个对象），因此结果为 `false`。即使是 `==` 宽松检查，第 1 行也会得到\
    \ `false`。第 2 行通过，因为它比较的是两个字符串原始值，而不是字符串对象。\n\nQ4 未回答。\n\n**Q5 已回答。** 下面的代码会向控制台输出什么，为什么？\n\
    \n```javascript\nconst x = new String(\"tricky\");\nconst y = x;\nconsole.log(x\
    \ === y);\n```\n\nA) `true`  \nB) `false`\n\n答案是 A。与上一个问题不同，这里只创建了一个唯一对象，两个常量（`x`\
    \ 和 `y`）指向内存中的这个唯一对象。\n\nQ5 未回答。\n\n**Q6 已回答。** 在 JavaScript 中，数组是对象还是原始值？\n\n\
    A) 对象  \nB) 原始值\n\n答案是 A。数组是 JavaScript 中一种特殊的对象。它们拥有其他对象没有的属性，这些属性继承自 `Array.prototype`。\n\
    \nQ6 未回答。\n\n**Q7 已回答。** 下面 `async` 函数的返回类型是什么？\n\n```javascript\nasync function\
    \ goodbye() {\n  return 'goodbye';\n}\n```\n\nA) `string`  \nB) `Promise`  \n\
    C) `Async`\n\n答案是 B。`async` 函数返回 Promise。要实际消费 Promise 兑现时返回的值，你需要一个 `.then` 语句，例如\
    \ `goodbye.then((value) => console.log(value));`。\n\nQ7 未回答。\n\n**Q8 已回答。** 判断对错？`await`\
    \ 关键字会阻塞应用中所有 JavaScript 代码的执行，直到等待的 Promise 返回。\n\nA) 正确  \nB) 错误\n\n答案是 B。`await`\
    \ 关键字只阻塞包含 `await` 关键字的特定 `async` 函数内部的代码执行。调用 `await` 所在 async 函数的调用者可以在等待 async\
    \ 函数解析的同时继续执行。这被称为分割执行流。\n\nQ8 未回答。\n\n**Q9 已回答。** 回忆一下，函数在 JavaScript 中是对象。以下代码会打印什么？\n\
    \n```javascript\nfunction myFunc() {}\nconsole.log(typeof myFunc);\n```\n\nA)\
    \ `object`  \nB) `function`  \nC) `true`  \nD) 它抛出一个错误\n\n答案是 B。尽管函数在 JavaScript\
    \ 中确实是对象，但 `typeof myFunc` 打印的是 “function”。\n\nQ9 未回答。\n\n**Q10 已回答。** 判断对错？以下语法对于打印\
    \ ‘goodbye’ 是有效的。\n\n```javascript\nlet goodbye = async () => { return \"Goodbye\"\
    \ };\ngoodbye().then(console.log); // 第 2 行\n```\n\nA) 正确  \nB) 错误\n\n答案是 A。第\
    \ 2 行是将 async 函数的返回值传递给回调的一种有效简写。\n\nQ10 未回答。\n\n**Q11 已回答。** 以下哪一项不是 `typeof`\
    \ 和 `instanceof` 之间的区别？\n\nA) `typeof` 返回一个类型，`instanceof` 返回一个布尔值  \nB) `instanceof`\
    \ 需要 TypeScript，而 `typeof` 不需要  \nC) `typeof` 在右侧接受变量名，而 `instanceof` 在左侧和右侧都接受值\n\
    \n答案是 B。`typeof` 和 `instanceof` 都不需要 TypeScript，两者都是 JavaScript 原生的。\n\nQ11 未回答。\n\
    \n**Q12 已回答。** 以下哪个在所有 Promise 都兑现时解析，或者一旦有一个 Promise 被拒绝就拒绝？\n\nA) `Promise.race()`\
    \  \nB) `Promise.any()`  \nC) `Promise.all()`  \nD) `Promise.resolve()`\n\n答案是\
    \ C。如果你希望执行等待所有 Promise 解析（或任何一个失败），`Promise.all()` 很有用。此外，以上所有都是有效的 Promise 函数。\n\
    \nQ12 未回答。\n\n**Q13 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nlet x = 10;\n\
    function myFunc(y){\n  y = 12;\n}\nmyFunc(x);\nconsole.log(x);\n```\n\nA) 10 \
    \ \nB) 12  \nC) `undefined`\n\n答案是 A。原始值是按值传递，而不是按引用传递，因此在函数中“更改它们”不会影响原始变量。\n\
    \nQ13 未回答。\n\n**Q14 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nconsole.log(11\
    \ & 3);\n```\n\nA) 11  \nB) 1  \nC) 2  \nD) 3\n\n答案是 D。`&` 是一个位运算符（与 `&&` 非常不同）。`11\
    \ & 3` 等同于（二进制）`1011 & 0011`。只有同时为 1 的位才保留为 1，因此输出是 `0011`，即 3 的二进制表示。\n\nQ14\
    \ 未回答。\n\n**Q15 已回答。** `Object.[[Prototype]]` 的值是什么？\n\nA) `Object`  \nB) `null`\
    \  \nC) `{}`\n\n答案是 B。虽然 `Object` 位于原型链的顶端，但当浏览器查找访问属性的值时，它会遍历原型链，直到找到该值或没有更多原型可遍历。`Object.[[Prototype]]`\
    \ 的值是 `null`，而返回的值是 `undefined`。\n\n更多阅读请参见：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain\n\
    \nQ15 未回答。\n\n**Q16 已回答。** 空值合并运算符是做什么的？\n\n当左侧操作数为 `null` 或 `undefined` 时，它返回右侧操作数。否则，返回左侧操作数。语法是\
    \ `??`。\n\nQ16 未回答。\n\n**Q17 已回答。** 哪个运算符会返回一个操作数除以另一个操作数后的余数？\n\nA) `$`  \nB)\
    \ `#`  \nC) `%`  \nD) 以上都不是\n\n答案是 C。\n\nQ17 未回答。\n\n**Q18 已回答。** 判断对错？`getElementsByTagName`\
    \ 是一个 JavaScript 函数。\n\nA) 正确  \nB) 错误\n\n答案是 B。`getElementsByTagName` 实际上是 Web\
    \ API 函数。它像普通的 JS 函数一样可用，但无论使用何种语言都可以访问。\n\nQ18 未回答。\n\n**Q19 已回答。** 给出一个在 JavaScript\
    \ 中使用事件委托的例子。\n\n一个例子：如果你想要监听事件的元素可能在页面加载时不存在，请使用事件委托。相反，将事件处理程序放在父元素上，并查看 `event.target`。\n\
    \n现代框架和库（如 React）使得这一点不那么必要。\n\nQ19 未回答。\n\n**Q20 已回答。** 下面的代码求值为 `true` 还是 `false`？\n\
    \n```javascript\nBigInt(10000000000000000000) === 10000000000000000000\n```\n\n\
    A) `true`  \nB) `false`\n\n答案是 B。然而，`BigInt(10000000000000000000) == 10000000000000000000`\
    \ 是 `true`。\n\nQ20 未回答。\n\n**Q21 已回答。** 以下哪一项不是内置的 JS 错误类型？\n\nA) `Error`  \n\
    B) `EvalError`  \nC) `SyntaxError`  \nD) `TypeError`  \nE) `UndefinedError`\n\n\
    答案是 E。\n\nQ21 未回答。\n\n**Q22 已回答。** 数字在 JavaScript 中是如何存储的？选择所有适用的选项。\n\nA) 双精度\
    \  \nB) 64 位  \nC) 浮点数\n\nA、B 和 C 都是正确的。\n\nQ22 未回答。\n\n**Q23 已回答。** 如果一个函数没有指定返回值，它返回什么值？\n\
    \nA) `null`  \nB) `undefined`  \nC) `nothing`\n\n答案是 B。\n\nQ23 未回答。\n\n**Q24 已回答。**\
    \ 调用一个对象上可能存在也可能不存在的方法的语法是什么？\n\n```javascript\nlet value = myAPI.testMethod?.();\n\
    ```\n\nQ24 未回答。\n\n**Q25 已回答。** 以下哪一项不是有效的 Promise 方法？\n\nA) `Promise.some()`\
    \  \nB) `Promise.allSettled()`  \nC) `Promise.reject()`  \nD) `Promise.race()`\n\
    \n答案是 A。\n\nQ25 未回答。\n\n**Q26 已回答。** 如何根据变量值动态访问对象属性？\n\n用变量示例回答：\n\n```javascript\n\
    let key = 'someValue';\nmyObject[key];\n```\n\nQ26 未回答。\n\n**Q27 已回答。** 判断对错？字符串在创建后可以被修改。\n\
    \nA) 正确  \nB) 错误\n\n答案是 B。字符串在 JavaScript 中是不可变的。然而，指向字符串的变量当然可以重新赋值为另一个字符串。\n\
    \nQ27 未回答。\n\n**Q28 已回答。** 判断对错？JavaScript 是同步的。\n\nA) 正确  \nB) 错误\n\n答案是 A。JavaScript\
    \ 运行时中的队列是同步的，因此该语言是同步的。\n\nQ28 未回答。\n\n**Q29 已回答。** 判断对错？Promise 链中嵌套的 `catch`\
    \ 可以捕获 Promise 链中更上层抛出的错误？\n\nA) 正确  \nB) 错误\n\n答案是 B。根据 MDN 文档：“嵌套是一种控制结构，用于限制\
    \ `catch` 语句的作用域。具体来说，嵌套的 `catch` 只捕获其作用域及以下范围内的失败，而不是嵌套作用域之外链中更上层的错误”。\n\n更多阅读请参见：https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises\n\
    \nQ29 未回答。\n\n**Q30 已回答。** 判断对错？`Map` 对象可以具有字符串以外的类型的键，例如数字。\n\nA) 正确  \nB) 错误\n\
    \n答案是 A。\n\nQ30 未回答。\n\n**Q31 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nconst\
    \ map = new Map();\nmap.set({},1);\nconsole.log(map.get({}));\n```\n\nA) `undefined`\
    \  \nB) 1  \nC) 编译时错误\n\n答案是 A。`map.get({})` 是有效的语法，但 `set` 中的对象和 `get` 中的对象是内存中两个不同的空对象。因此，getter\
    \ 不返回值。如果用于 `map.set` 的对象首先被赋值给一个 `const`，然后该 `const` 被用于 `get`，则会返回适当的值。\n\n\
    Q31 未回答。\n\n**Q32 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nlet map1 = new\
    \ Map([['a', 1],['b', 1],['c', 1]]);\nlet map2 = new Map([['a', 2],['b', 2]]);\n\
    let spreadMap = new Map([...map1, ...map2]);\n```\n\nA) `Map(3) {\"a\" => 1, \"\
    b\" => 1, \"c\" => 1}`  \nB) `Map(3) {\"a\" => 2, \"b\" => 2, \"c\" => 1}`  \n\
    C) `Map(5) {\"a\" => 1, \"b\" => 1, \"c\" => 1, \"a\" => 2, \"b\" => 2}`\n\n答案是\
    \ B。第二个映射中的任何相同键都会覆盖第一个映射中的键。\n\nQ32 未回答。\n\n**Q33 已回答。** 判断对错？括号表示法可以像点表示法一样链式使用？\n\
    \nA) 正确  \nB) 错误\n\n答案是 A。`obj.prop1.prop2` 和 `obj['prop1']['prop2']` 是等价的。\n\n\
    Q33 未回答。\n\n**Q34 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nclass Person {\n\
    \  name: string;\n  DOB: string;\n}\nconsole.log(typeof Person);\n```\n\nA) `\"\
    class\"`  \nB) `\"function\"`  \nC) `\"object\"`\n\n答案是 B。这提醒我们，类只是让 JavaScript\
    \ 感觉更面向对象的语法糖。\n\nQ34 未回答。\n\n**Q35 已回答。** 检查下面的代码。诊断将发生的错误。假设 `handleResponse`\
    \ 和 `handleError` 已正确定义。\n\n```javascript\npromise.then(function(response) {\n\
    \  this.handleResponse();\n},\nfunction(error) {\n  this.handleError();\n});\n\
    ```\n\n答案是 `this` 的作用域不正确。相反，代码需要一种方法来获得 `this` 的正确作用域，例如使用 `bind` 或 `var self\
    \ = this;`。\n\nQ35 未回答。\n\n**Q36 已回答。** 哪些类型的属性会出现在 `for...in` 循环中？\n\nA) 可执行属性\
    \  \nB) 可枚举属性  \nC) 可迭代属性\n\n答案是 B。\n\nQ36 未回答。\n\n**Q37 已回答。** 判断对错？`.bind(this)`\
