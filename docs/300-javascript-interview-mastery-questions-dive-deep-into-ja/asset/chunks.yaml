    \ If a function has no return value specified, what value does it return?\n\n\
    A) `null`  \nB) `undefined`  \nC) `nothing`\n\nThe answer is B.\n\n[Q23 Unanswered.](#text00027.html_a86Z)\n\
    \n**Q24 Answered.** What is the syntax for calling a method which may or may not\
