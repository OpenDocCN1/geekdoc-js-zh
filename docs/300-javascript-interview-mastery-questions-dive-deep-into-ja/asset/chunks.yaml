    \nThe answer is A.\n\n### Q60\nWhat two types can `String.prototype.replace()`\
    \ take as the first parameter? Select all correct options.\nA) String\nB) regex\n\
    C) Object\n\nThe answer is A, B.\n\n### Q61\nWhat will the code below output to\
