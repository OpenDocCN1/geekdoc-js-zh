    \ which they are created.\n\n### Q40\nWhich of the following are generally true\
    \ regarding access modifiers?\nA) Fields should have the most narrow access modifier\
    \ possible\nB) Methods should have the widest access modifier possible\nC) Avoid\
    \ using public fields unless the field is a constant\n\nThe answers are A, C.\n\
    \n### Q41\nWhat kind of error will be thrown if you forget a parenthesis in your\
    \ `for` loop?\nA) SyntaxError\nB) TypeError\nC) ReferenceError\n\nThe answer is\
    \ A.\n\n### Q42\nTrue or False? The below code is an example of overloading.\n\
    `console.log({a: 1}.toString = 'Test');`\nA) True\nB) False\n\nThe answer is B.\
    \ The default `toString` method is overridden here.\n\n### Q43\nTrue or False?\
    \ JavaScript supports static variables on classes.\nA) True\nB) False\n\nThe answer\
    \ is A.\n\n### Q44\nGive an example of using new ES6 syntax for creating a parent/child\
    \ relationship.\n```javascript\nlet dog = { name: \"buddy\", legs: 4 };\nlet animal\
    \ = { type: \"mammal\" };\nObject.setPrototypeOf(dog, animal);\nconsole.log(Object.getPrototypeOf(dog));\n\
    ```\n\n### Q45\nTrue or False? A `try` statement must always be followed by at\
    \ least one `catch` statement.\nA) True\nB) False\n\nThe answer is B. A `try`\
    \ statement may be followed by a `finally` statement instead.\n\n### Q46\nTrue\
    \ or False? Use `RegExp` literal notation when the `RegExp` will be changing and\
