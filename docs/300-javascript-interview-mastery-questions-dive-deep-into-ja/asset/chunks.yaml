    chaining can be stacked like below?let stateStats = state.area?.land?.sqmiles;A)  TrueB)  FalseThe
    answer is A.[Q23 Unanswered.](#text00255.html_a7WC)Q24 Answered.What will the
    below code output to the console and why?const a;a.test ??= 25;console.log(a.test);A)  undefinedB)  25C) 
    Compile time errorThe answer is C.  The constant a was not initialized, therefore
    a.test will be flagged by the compiler.[Q24 Unanswered.](#text00256.html_a83W)Q25
    Answered.What is the technical name of parenthesis () in JavaScript?A)  Grouping
    OperatorB)  Parenthesis OperatorC)  Binding OperatorThe answer is A.[Q25 Unanswered.](#text00257.html_a7V2)Q26
    Answered.What does the below code output to the console and why?let str = new
    String(''aaa'');str.concat(''bbb'').concat(''ccc'');console.log(str);A)  aaaB)  aaabbbcccC)  cccD)  bbbcccThe
    answer is A.  concat returns a new string, the original string is not affected.[Q26
    Unanswered.](#text00258.html_a860)Q27 Answered.What is the Queue in JavaScript
    Runtime?The Queue is list of messages to be processed, and each message has an
    associated function to call.Different than the stack because stack is a list of
    dependent functions, where the more recent must be executed in order to execute
    te older properly.  The Queue is First In, First Out, meaning oldest messages
    are processed first.[Q27 Unanswered.](#text00259.html_a7VY)Q28 Answered.True or
    False?  Vanilla JavaScript (no TypeScript) has abstract classes, as of ES2015.A)  TrueB)  FalseThe
    answer is B.  The abstract modifier cannot be used for creating a class which
    cannot be instantiated.[Q28 Unanswered.](#text00260.html_a7TN)Q29 Answered.What
    will the code below output to the console and why?const b = {a: 1,b: 2,3: 3}for(key
    in b){console.log(b[key]);}A)  1 2 3B)  1 2C)  Uncaught SyntaxError: Unexpected
    numberThe answer is C.  In JavaScript, keys must be strings.  If you want to use
    a type other than string, use the Map object.[Q29 Unanswered.](#text00261.html_a7TD)Q30
    Answered.What is the syntax for initializing a Map object with multiple key/value
    pairs?Answer: Create a new Map object initialized with a two dimensional array
    of key/value pairs.  For example: const map = new Map([[''a'',1], [''b'',2],[''c'',3]]);[Q30
    Unanswered.](#text00262.html_a85T)Q31 Answered.True or false?  An interface can
    extend another interface.  Assume TypeScript is enabled.A)  TrueB)  FalseThe answer
    is A.  This is different than behavior in some programming languages (Java, for
    example).  When an interface extends another interface, it has the properties
    of the parent interface, and the child interface simply adds more properties (or
    overwrites properties).[Q31 Unanswered.](#text00263.html_a7SN)Q32 Answered.True
    or false?  Assume TypeScript is enabled.  An object inherits all the fields and
    methods of its parent class.A)  TrueB)  FalseThe answer is B.  An object does
    not inherit fields and methods that have the “private” modifier.[Q32 Unanswered.](#text00264.html_a816)Q33
    Answered.Which of the following are valid modifiers of TypeScript interface methods? 
    Select all correct answers.A)  publicB)  protectedC)  privateD)  abstractE)  None
    of the above.The answer is E.  All interface methods are public and abstract in
    TypeScript interfaces, but actually putting the public or abstract modifier in
    the interface is incorrect syntax.[Q33 Unanswered.](#text00265.html_a827)Q34 Answered.True
    or False?  The static keyword is not a valid modifier in JavaScript.  Rather,
    a typing superscript like TypeScript is required for static to work.A)  TrueB)  FalseThe
    answer is B. [Q34 Unanswered.](#text00266.html_a84M)Q35 Answered.What one-line
    code block will print the following characters:☃⌨ ὀ˿One possible answer: console.log(String.fromCodePoint(9731,
    9000, 8000, 0x2FF)); This creates a string from Unicode code points, which are
    an extensive collection of characters and symbols.[Q35 Unanswered.](#text00267.html_a7M4)Q36
    Answered.What, if anything, is in position 3 on the array?const arr = [1, 2];arr.length
    = 3;A)  It is emptyB)  It is not actually createdC)  nullThe answer is A.  It
    is an empty slot.  console.log(arr); will print [1,2,undefined];[Q36 Unanswered.](#text00268.html_a85K)Q37
    Answered.Write a one line example of how to reverse the array.reduce function.Answer:
    There''s actually a built in Array function called Array.reduceRight.[Q37 Unanswered.](#text00269.html_a85Y)Q38
    Answered.What are some limitations of arrow functions?  Select all correct options.A) 
    Arrow functions should not be used as methodsB)  Arrow functions do not have arguments,
    super, or new.target keywordsC)  Arrow functions cannot use yield keyword in it''s
    bodyD)  Arrow functions cannot be used as constructorsThe answer is all of the
    above.[Q38 Unanswered.](#text00270.html_a806)Q39 Answered.What is the difference
    in the default scope of traditional functions and arrow functions?Answer:  Traditional
    functions default this to the window scope. Arrow functions execute in the scope
    in which they are created.[Q39 Unanswered.](#text00271.html_a7UV)Q40 Answered.Which
    of the following are generally true regarding access modifiers?A)  Fields should
    have the most narrow access modifier possibleB)  Methods should have the widest
    access modifier possibleC)  Avoid using public fields unless the field is a constantThe
    answers are A, C.  All members (both fields and methods) should have the most
    narrow access modifier possible.  This keeps methods from being used in unintended
    ways and keeps fields from having their values changed unintentionally.[Q40 Unanswered.](#text00272.html_a81A)Q41
    Answered.What kind of error will be thrown if you forget a parenthesis in your
    for loop?A)  SyntaxErrorB)  TypeErrorC)  ReferenceErrorThe answer is A.[Q41 Unanswered.](#text00273.html_a80H)Q42
    Answered.True or False?  The below code is an example of overloading.console.log({a:
    1}.toString = ''Test'');A)  TrueB)  FalseThe answer is B.  The default toString
    method is overridden here, not overloaded.[Q42 Unanswered.](#text00274.html_a7RJ)Q43
    Answered.True or False?  JavaScript supports static variables on classes.A)  TrueB)  FalseThe
    answer is A.  This is a recent addition to JavaScript and not all browsers support
    it as of 2020.[Q43 Unanswered.](#text00275.html_a83H)Q44 Answered.Give an example
    of using new ES6 syntax for creating a parent/child relationship.let dog = { name:
    "buddy", legs: 4 };let animal = { type: "mammal" };Object.setPrototypeOf(dog,
    animal);console.log(Object.getPrototypeOf(dog));[Q44 Unanswered.](#text00276.html_a7KY)Q45
    Answered.True or False?  A try statement must always be followed by at least one
    catch statement.A)  TrueB)  FalseThe answer is B.  A try statement may be followed
    by a finally statement instead of a catch statement.  A finally statement always
    executes.[Q45 Unanswered.](#text00277.html_a7ZT)Q46 Answered.True or False?  Use
    RegExp literal notation when the RegExp will be changing and use the RegExp constructor
    function when the RegExp will remain constant.A)  TrueB)  FalseThe answer is B. 
    This is the opposite of how to use them:  Use RegExp constructor function notation
    when the RegExp will be changing and use the RegExp literal notation when the
    RegExp will remain constant.[Q46 Unanswered.](#text00278.html_a7VH)Q47 Answered.True
    or False?  Promises are asynchronous in JavaScript.A)  TrueB)  FalseThe answer
    is B.  Promises are synchronous, however, they often do asynchronous things like
    making calls to an API.  See this example below that shows they are synchronous. 
    This prints 10, then 5.function resolveQuickly(x) {return new Promise(resolve
    => {console.log(x)});}async function asyncTest() {var x = resolveQuickly(10);console.log(5);}asyncTest();[Q47
    Unanswered.](#text00279.html_a7RZ)Q48 Answered.What is the purpose of web workers?A) 
    To execute expensive tasks on a separate thread than the main threadB)  To offload
    events to different objectsC)  To speed up prototypical inheritanceThe answer
    is A.[Q48 Unanswered.](#text00280.html_a7PS)Q49 Answered.What type of object does
    Promise.resolve() return?Answer: A promise in a resolved state with a given resolved
    value.[Q49 Unanswered.](#text00281.html_a85C)Q50 Answered.What is the difference
    between setTimeout() and setInterval()?  Select two options.A)  setTimeout executes
    once after a specified time has elapsedB)  setInterval executes repeatedly with
    a given delay between execuionsC)  setTimeout executes repeatedly with a given
    delay between execuionsD)  setInterval executes once after a specified time has
    elapsedThe answers are A, B.[Q50 Unanswered.](#text00282.html_a85B)Q51 Answered.True
    or False?  setInterval interval time includes the time it took to execute the
    code.A)  TrueB)  FalseThe answer is A.  If the interval is set to 100ms and the
    code block takes 50ms to execute, there will only be a 50ms gap before the block
    kicks off again.[Q51 Unanswered.](#text00283.html_a7YS)Q52 Answered.True or False? 
    The below code compiles.const array = [1, 2, 3];for (let i = 0; i < array1.length;
    array1[i++] = String.fromCharCode(96 + i));A)  TrueB)  FalseThe answer is A. 
    A for loop can have an empty statement after it.[Q52 Unanswered.](#text00284.html_a7RK)Q53
    Answered.What is the difference in importing a default export vs a named, non-default
    export?A)  curly bracesB)  the name is never included in the defaultC)  nothingThe
    answer is A.  Default exports can still be named.[Q53 Unanswered.](#text00285.html_a86X)Q54
    Answered.True or False?  Function declarations are hoisted, function expressions
    are not hoisted.A)  TrueB)  FalseThe answer is A.[Q54 Unanswered.](#text00286.html_a7U9)Q55
    Answered.What statement will show the url from which a module was imported?A)  import.pathB)  path.showC)  path.directoryD)  import.metaThe
    answer is D.  This will work if experimental support for import.meta is on.[Q55
    Unanswered.](#text00287.html_a7XP)Q56 Answered.What is the difference in console.log.
    console.error, and console.warn?These three functions log differently in different
    browsers, but usually error has an ''error'' icon or red color, warn has ''warn''
    icon or yellow color.[Q56 Unanswered.](#text00288.html_a83U)Q57 Answered.What
    is the significance of seeing prototype in the following documentation:  Array.prototype.reduce()as
    opposed to:  Array.from()?  Select all correct answers.A)  prototype indicates
    reduce is an instance level methodB)  the lack of prototype indicates from is
    a class level methodC)  prototype indicates reduce is inherited from ObjectThe
    answers are A, B.[Q57 Unanswered.](#text00289.html_a7P4)Q58 Answered.How does
    the Maximum Call Stack Exceeded error get triggered?Answer: Usually a function
    is recursively calling itself, so the "Stack" of function calls waiting to execute
    grows until a maximum is reached.[Q58 Unanswered.](#text00290.html_a84W)Q59 Answered.Which
    of the following is not a method available on the Web API window object for resizing?A)  resizeFrom()B)  resizeBy()C)  resizeTo()D)  sizeToContent()The
    answer is A.[Q59 Unanswered.](#text00291.html_a85N)Q60 Answered.What two types
    can String.prototype.replace() take as the first parameter?  Select all correct
    options.A)  StringB)  regexC)  ObjectThe answer is A, B.  However, if another
    primitive is passed, it will be converted to a string.[Q60 Unanswered.](#text00292.html_a7UT)Q61
    Answered.What will the code below output to the console and why?for(let i = 6;
    i < 10; i*1.5){if(i%2){continue;}console.log(i)}A)  6B)  6, 9C)  It enters into
    an infinite loopD)  Lint errorThe answer is C.  i*1.5 doesn’t change the value
    of i.  Rather, i *= 1.5 would properly update the value.[Q61 Unanswered.](#text00293.html_a7N2)Q62
    Answered.Which of the following is a difference between Object.assign() and the
    spread syntax?A)  Spread syntax calls setters, Object.assign() does notB)  Object.assign
    calls setters, spread syntax does notC)  They actualy behave identicallyThe answer
    is B.[Q62 Unanswered.](#text00294.html_a7YF)Q63 Answered.Give an example of a
    one line check to see if a property exists on object dog .const dog = { sound:
    ‘woof’, legs: 4 }One possible answer:let propExists = ‘sound’ in woof;[Q63 Unanswered.](#text00295.html_a7XN)Q64
    Answered.Which of the following is not a way to convert the arguments function
    object to an array?A)  arguments.assign(arguments)B)  Array.prototype.slice.call(arguments);C)  Array.from(arguments);D)  [...arguments]The
    answer is A.[Q64 Unanswered.](#text00296.html_a7TJ)Q65 Answered.What is the target
    phase of event handling?The target phase is the second of the three phases of
    event handling.  The first is capture, the third is bubbling.  The target phase
    is simply the event reaching the target.[Q65 Unanswered.](#text00297.html_a7TM)Q66
    Answered.What does the double bang (!!) do?A)  nothingB)  returns the truthy value
    of an objectC)  throws an errorThe answer is B.  For example, !!0 returns false.[Q66
    Unanswered.](#text00298.html_a7WJ)Q67 Answered.A)  trueB)  falseThe answer is
    A.  1 < 2 returns true, true < 3 returns true.[Q67 Unanswered.](#text00299.html_a7MF)Q68
    Answered.How does JavaScript evaluate the truthy-ness or falsey-ness of a value
    or object in a boolean context?A)  type coercionB)  it’s a property on each objectC) 
    some values never have truthy or falsey valuesThe answer is A.[Q68 Unanswered.](#text00300.html_a7U1)Q69
    Answered.What is the purpose of using an IIFE?  Select all possible answers.A) 
    setting a variable valueB)  initializing values on an objectC)  use in a closure
    for initializing a valueD)  running a one-time functionThe answers are A, C, D. 
    However, one could probably even use an IIFE to accomplish B if so desired.[Q69
    Unanswered.](#text00301.html_a814)Q70 Answered.What is an example of lexical scope? 
    Select all possible answers.A)  scope being defined dynamically based on variable
    inputB)  let self = this; //in a parent function, then self is available to an
    inner functionC)  the scope of an inner function contains the scope of the parent
    functionThe answers are B, C.[Q70 Unanswered.](#text00302.html_a80C)Q71 Answered.What
    will the code below output to the console and why?let a = 3;a <<= 1;console.log(a);A)  3B)  4C)  6D)  8The
    answer is C.  The left shift operator moves the bits to the left by the specified
    amount and assigns the value.  In this case, 3 (11 in binary) is moved to 110
    in binary, which is a value of 6.[Q71 Unanswered.](#text00303.html_a7T1)Q72 Answered.What
    will the code below output to the console and why?badCode = () => { let arr =
    [1,2,3,4];  const inner = () => {return arr.pop(2)}return inner;}console.log(badCode()());A)  linting
    errorB)  3, 4C)  34D)  4The answer is D.  pop doesn’t accept any parameters, but
    in vanilla JavaScript it simply discards any passed parameters.[Q72 Unanswered.](#text00304.html_a7V0)Q73
    Answered.What will the code below output to the console and why?const obj = {
    a: 1 };let obj2 = obj;obj2.a = 2;console.log(obj.a);A)  1B)  2C)  undefinedThe
    answer is B.[Q73 Unanswered.](#text00305.html_a7N1)Q74 Answered.What is a side
    effect in programming?Answer: A side effect is when a function modifies a state
    or observable value that affects other parts of the application.  This is as opposed
    to the main effect of the function, which is the value the function returns.[Q74
    Unanswered.](#text00306.html_a7VX)Q75 Answered.True or False?  Array.prototype.filter()
    returns an array of all items that did NOT pass the test implemented by the provided
    function.A)  TrueB)  FalseThe answer is B.  The opposite is correct, filter returns
    the items that did pass the test implemented by the provided function.[Q75 Unanswered.](#text00307.html_a80V)'
