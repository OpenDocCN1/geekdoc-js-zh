    ![](Image00000.jpg)


    # 300 JavaScript Interview Mastery Questions

    Dive Deep into JavaScript Theory, Syntax, and APIs, and Interview with Confidence

    *Text copyright © 2020 Jonathan Middaugh all rights reserved.*


    ## Introduction

    This book contains questions covering JavaScript syntax, rules, functionality,
    and theory. It is designed to help you improve upon your JavaScript knowledge
    as well as expose you to some edge cases and unusual situations in JavaScript.
    I find that these are the types of examples that really solidify a developer’s
    understanding of this fun language.


    The book has a few questions specific to JavaScript running in the browser, but
    most questions are agnostic of environment. A few questions also include TypeScript,
    but they will be designated as such. The book is organized into 4 “tests” with
    each question linking to its answer in the back of the book.


    As a bonus, the two links below provide another 50 free JavaScript interview mastery
    questions and 50 free TypeScript interview mastery question.


    [50 JavaScript Interview Mastery Questions](https://medium.com/the-clever-dev/50-difficult-javascript-interview-questions-88e6e92367e7?source=friends_link&sk=321a35a056e98aef103cc540794bd79f)
    (published on my Medium.com publication).


    [50 TypeScript Interview Mastery Questions](https://medium.com/the-clever-dev/50-difficult-typescript-interview-questions-a7103299e210?source=friends_link&sk=d6f5b58ec947559175b3972498395fa9)
    (published on my Medium.com publication).


    ## About the Author

    If you enjoy this book and want to continue learning JavaScript with me, take
    a look at the following:


    * [My Medium.com Portfolio](https://medium.com/@jonathan.middaugh) – Filled with
    JavaScript articles and the occasional dev side hustle I’m working on

    * [My YouTube Channel](https://www.youtube.com/channel/UCb6AZy0_D1y661PMZck3jOw)
    – Same as my Medium.com portfolio, but I enjoy the interactive feel of making
    the videos. Plus I believe they can help different people learn in different ways

    * [Twitter](https://twitter.com/SDevpreneur) – Follow me here for news about recent
    articles plus whatever is interesting in the dev community

