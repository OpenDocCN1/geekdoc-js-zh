  trans: "\n\n# 目录\n- 测试 1 问题\n- 测试 2 问题\n- 测试 3 问题\n- 测试 4 问题\n- 测试 1 答案\n- 测试 2\
    \ 答案\n- 测试 3 答案\n- 测试 4 答案\n\n## 测试 1 问题\n\n**问题 1.** 以下哪个会先打印？\n\n```\nsetTimeout(()\
    \ => {console.log('setTimeout wins');},0);\nqueueMicrotask(() => {console.log('queueMicrotask\
    \ wins');});\n```\n\n- A) `setTimeout` 胜出\n- B) `queueMicrotask` 胜出\n- C) 编译时错误\n\
    \n答案是 B。来自 `queueMicrotask` 的任务在调用栈清空后、事件循环被调用前执行。来自 `setTimeout` 的任务属于事件队列的一部分。\n\
    \n问题 1 已回答。\n\n**问题 2.** 下面的代码会向控制台输出什么，为什么？\n\n```\nlet x = 10;\nconst byValue\
    \ = (y) => {y = 20;}\nbyValue(x);\nconsole.log(x);\n```\n\n- A) 20\n- B) 10\n\
    - C) 编译时错误\n\n问题 2 已回答。\n\n**问题 3.** 考虑以下代码。它会向控制台输出什么，为什么？\n\n```\nlet x = 5;\n\
    let x = 10;\nconsole.log(x);\n```\n\n- A) 5\n- B) 10\n- C) 会抛出编译错误\n\n问题 3 已回答。\n\
    \n**问题 4.** 考虑以下代码。每一行输出什么？\n\n```\nconsole.log(new String(\"yes\") === new String(\"\
    yes\")); // 第 1 行\nconsole.log(\"yes\" === \"yes\"); // 第 2 行\n```\n\n- A) 第 1\
    \ 行输出 true，第 2 行输出 true\n- B) 第 1 行输出 false，第 2 行输出 true\n- C) 第 1 行输出 true，第\
    \ 2 行输出 false\n- D) 第 1 行输出 false，第 2 行输出 false\n\n问题 4 已回答。\n\n**问题 5.** 下面的代码会向控制台输出什么，为什么？\n\
    \n```\nconst x = new String(\"tricky\");\nconst y = x;\nconsole.log(x === y);\n\
    ```\n\n- A) True\n- B) False\n\n问题 5 已回答。\n\n**问题 6.** 在 JavaScript 中，数组是对象还是原始类型？\n\
    \n- A) 对象\n- B) 原始类型\n\n问题 6 已回答。\n\n**问题 7.** 下面异步函数的返回类型是什么？\n\n```\nasync function\
    \ goodbye() {return ‘goodbye’;}\n```\n\n- A) string\n- B) `Promise`\n- C) Async\n\
    \n问题 7 已回答。\n\n**问题 8.** 判断对错？`await` 关键字会阻塞应用中所有 JavaScript 代码的执行，直到等待的 `Promise`\
    \ 被返回。\n\n- A) 正确\n- B) 错误\n\n问题 8 已回答。\n\n**问题 9.** 回忆一下，函数在 JavaScript 中是对象。以下代码会打印什么？\n\
    \n```\nfunction myFunc() {}\nconsole.log(typeof myFunc);\n```\n\n- A) object\n\
    - B) function\n- C) true\n- D) 会抛出错误\n\n问题 9 已回答。\n\n**问题 10.** 判断对错？以下语法对于打印‘goodbye’是有效的。\n\
    \n```\nlet goodbye = async () => { return \"Goodbye\" };\ngoodbye().then(console.log);\n\
    ```\n\n- A) 正确\n- B) 错误\n\n问题 10 已回答。\n\n**问题 11.** 以下哪一项不是 `typeof` 和 `instanceof`\
    \ 之间的区别？\n\n- A) `typeof` 返回一个类型，而 `instanceof` 返回一个布尔值\n- B) `instanceof` 需要\
    \ TypeScript，而 `typeof` 不需要\n- C) `typeof` 右侧是变量名，而 `instanceof` 左侧和右侧都是值\n\n\
    问题 11 已回答。\n\n**问题 12.** 以下哪个方法会在所有 promise 都完成时解决，或者一旦有一个 promise 被拒绝就立即拒绝？\n\
    \n- A) `Promise.race()`\n- B) `Promise.any()`\n- C) `Promise.all()`\n- D) `Promise.resolve()`\n\
    \n问题 12 已回答。\n\n**问题 13.** 下面的代码会向控制台输出什么，为什么？\n\n```\nlet x = 10;\nfunction myFunc(y){y\
    \ = 12;}\nmyFunc(x);\nconsole.log(x);\n```\n\n- A) 10\n- B) 12\n- C) undefined\n\
    \n问题 13 已回答。\n\n**问题 14.** 下面的代码会向控制台输出什么，为什么？\n\n```\nconsole.log(11 & 3);\n\
    ```\n\n- A) 11\n- B) 1\n- C) 2\n- D) 3\n\n问题 14 已回答。\n\n**问题 15.** `Object.[[Prototype]]`\
    \ 的值是什么？\n\n- A) `Object`\n- B) `null`\n- C) `{}`\n\n问题 15 已回答。\n\n**问题 16.**\
    \ `??`（空值合并运算符）的作用是什么？\n\n问题 16 已回答。\n\n**问题 17.** 哪个运算符会返回一个操作数除以另一个操作数的余数？\n\
    \n- A) `$`\n- B) `#`\n- C) `%`\n- D) 以上都不是\n\n问题 17 已回答。\n\n**问题 18.** 判断对错？`getElementsByTagName`\
    \ 是一个 JavaScript 函数。\n\n- A) 正确\n- B) 错误\n\n问题 18 已回答。\n\n**问题 19.** 请给出一个在 JavaScript\
    \ 中使用事件委托的例子。\n\n问题 19 已回答。\n\n**问题 20.** 下面的代码会求值为 true 还是 false？\n\n```\nBigInt(10000000000000000000)\
    \ === 10000000000000000000\n```\n\n- A) true\n- B) false\n\n问题 20 已回答。\n\n**问题\
    \ 21.** 以下哪一项不是 JavaScript 内置的错误类型？\n\n- A) `Error`\n- B) `EvalError`\n- C) `SyntaxError`\n\
    - D) `TypeError`\n- E) `UndefinedError`\n\n问题 21 已回答。\n\n**问题 22.** 数字在 JavaScript\
    \ 中是如何存储的？请选择所有适用的选项。\n\n- A) 双精度\n- B) 64 位\n- C) 浮点数\n\n问题 22 已回答。\n\n**问题 23.**\
    \ 如果一个函数没有指定返回值，它会返回什么值？\n\n- A) `null`\n- B) `undefined`\n- C) 什么也不返回\n\n问题 23\
    \ 已回答。\n\n**问题 24.** 调用一个对象上可能存在也可能不存在的方法的语法是什么？\n\n问题 24 已回答。\n\n**问题 25.** 以下哪一项不是有效的\
    \ Promise 方法？\n\n- A) `Promise.some()`\n- B) `Promise.allSettled()`\n- C) `Promise.reject()`\n\
    - D) `Promise.race`\n\n问题 25 已回答。\n\n**问题 26.** 如何根据变量值动态访问对象属性？\n\n问题 26 已回答。\n\
    \n**问题 27.** 判断对错？字符串在创建后可以被修改。\n\n- A) 正确\n- B) 错误\n\n问题 27 已回答。\n\n**问题 28.**\
    \ 判断对错？JavaScript 是同步的。\n\n- A) 正确\n- B) 错误\n\n问题 28 已回答。\n\n**问题 29.** 判断对错？在\
    \ `Promise` 链中，嵌套的 `catch` 可以捕获链中更上层抛出的错误？\n\n- A) 正确\n- B) 错误\n\n问题 29 已回答。\n\
    \n**问题 30.** 判断对错？`Map` 对象的键可以是字符串以外的类型，例如数字。\n\n- A) 正确\n- B) 错误\n\n问题 30 已回答。\n\
    \n**问题 31.** 下面的代码会向控制台输出什么，为什么？\n\n```\nconst map = new Map();\nmap.set({},1);\n\
    console.log(map.get({}));\n```\n\n- A) undefined\n- B) 1\n- C) 编译时错误\n\n问题 31\
    \ 已回答。\n\n**问题 32.** 下面的代码会向控制台输出什么，为什么？\n\n```\nlet map1 = new Map([['a', 1],['b',\
    \ 1],['c', 1],]);\nlet map2 = new Map([['a', 2],['b', 2]]);\nlet spreadMap = new\
    \ Map([...map1, ...map2]);\n```\n\n- A) `Map(3) {\"a\" => 1, \"b\" => 1, \"c\"\
    \ => 1}`\n- B) `Map(3) {\"a\" => 2, \"b\" => 2, \"c\" => 1}`\n- C) `Map(5) {\"\
    a\" => 1, \"b\" => 1, \"c\" => 1, \"a\" => 2, \"b\" => 2}`\n\n问题 32 已回答。\n\n**问题\
    \ 33.** 判断对错？方括号表示法可以像点表示法一样进行链式调用？\n\n- A) 正确\n- B) 错误\n\n问题 33 已回答。\n\n**问题\
    \ 34.** 下面的代码会向控制台输出什么，为什么？\n\n```\nclass Person {name: string;DOB: string;}\n\
    console.log(typeof Person);\n```\n\n- A) `\"class\"`\n- B) `\"function\"`\n- C)\
    \ `\"object\"`\n\n问题 34 已回答。\n\n**问题 35.** 检查下面的代码。诊断将会发生的错误。假设 `handleResponse`\
    \ 和 `handleError` 已正确定义。\n\n```\npromise.then(function(response) {\n  this.handleResponse();\n\
    },\nfunction(error) {\n  this.handleError();\n});\n```\n\n问题 35 已回答。\n\n**问题 36.**\
    \ 哪些类型的属性会出现在 `for...in` 循环中？\n\n- A) 可执行属性\n- B) 可枚举属性\n- C) 可迭代属性\n\n问题 36 已回答。\n\
    \n**问题 37.** 判断对错？`.bind(this)` 会立即调用绑定的函数。\n\n- A) 正确\n- B) 错误\n\n问题 37 已回答。\n\
    \n**问题 38.** 代码会打印什么？\n\n```\nfunction getName() {\n  var name = \"Jon\";\n  function\
    \ printName() {\n    console.log(name);\n  }\n  printName();\n}\ngetName();\n\
    ```\n\n- A) Jon\n- B) undefined\n- C) 编译时错误\n\n问题 38 已回答。\n\n**问题 39.** 判断对错？`await`\
    \ 关键字必须与 `async` 函数一起使用？\n\n- A) 正确\n- B) 错误\n\n问题 39 已回答。\n\n**问题 40.** 函数在递归中引用自身有哪三种方式？请选择三个答案。\n\
    \n- A) 使用 `self.run`\n- B) 函数名\n- C) 一个指向该函数的作用域内变量\n- D) 使用 `arguments.callee`\n\
    \n问题 40 已回答。\n\n**问题 41.** 下面的代码会向控制台输出什么，为什么？\n\n```\nconst test = (incrementer)\
    \ => {\n  if (incrementer < 0){\n    return;\n  }\n  console.log('first: ' + incrementer);\n\
    \  test(incrementer - 1);\n  console.log('second: ' + incrementer)\n}\ntest(2);\n\
    ```\n\n问题 41 已回答。\n\n"
