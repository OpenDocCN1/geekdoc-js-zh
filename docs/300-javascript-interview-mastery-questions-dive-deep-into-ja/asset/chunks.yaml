    \ access an object property based on a variable value?\n\nAnswer with example\
    \ variable:\n\n```javascript\nlet key = 'someValue';\nmyObject[key];\n```\n\n\
    [Q26 Unanswered.](#text00030.html_a80F)\n\n**Q27 Answered.** True or False? A\
    \ string can be modified after it is created.\n\nA) True  \nB) False\n\nThe answer\
    \ is B. Strings are immutable in JavaScript. However, the variable pointing to\
    \ a string can of course be reassigned to another string.\n\n[Q27 Unanswered.](#text00031.html_a7R9)\n\
    \n**Q28 Answered.** True or False? JavaScript is synchronous.\n\nA) True  \nB)\
    \ False\n\nThe answer is A. The Queue in JavaScript's Runtime is synchronous,\
    \ thus the language is synchronous.\n\n[Q28 Unanswered.](#text00032.html_a7VT)\n\
    \n**Q29 Answered.** True or False? A nested `catch` in a promise chain can catch\
    \ errors thrown higher up in the promise chain?\n\nA) True  \nB) False\n\nThe\
    \ answer is B. From MDN docs: “Nesting is a control structure to limit the scope\
    \ of `catch` statements. Specifically, a nested `catch` only catches failures\
    \ in its scope and below, not errors higher up in the chain outside the nested\
    \ scope”.\n\nSee here for more reading: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Using_promises\n\
    \n[Q29 Unanswered.](#text00033.html_a7TR)\n\n**Q30 Answered.** True or False?\
    \ The `Map` object can have keys that are of types other than strings, such as\
    \ number.\n\nA) True  \nB) False\n\nThe answer is A.\n\n[Q30 Unanswered.](#text00034.html_a83M)\n\
    \n**Q31 Answered.** What will the code below output to the console and why?\n\n\
    ```javascript\nconst map = new Map();\nmap.set({},1);\nconsole.log(map.get({}));\n\
    ```\n\nA) `undefined`  \nB) 1  \nC) Compile time error\n\nThe answer is A. `map.get({})`\
    \ is valid syntax, but the Object in the `set` and in the `get` are two different\
    \ empty objects in memory. Therefore, the getter doesn’t return a value. If the\
    \ object used for `map.set` had first been assigned to a `const`, then that `const`\
    \ was used in the `get`, the appropriate value would have been returned.\n\n[Q31\
    \ Unanswered.](#text00035.html_a7P5)\n\n**Q32 Answered.** What will the code below\
    \ output to the console and why?\n\n```javascript\nlet map1 = new Map([['a', 1],['b',\
    \ 1],['c', 1]]);\nlet map2 = new Map([['a', 2],['b', 2]]);\nlet spreadMap = new\
    \ Map([...map1, ...map2]);\n```\n\nA) `Map(3) {\"a\" => 1, \"b\" => 1, \"c\" =>\
    \ 1}`  \nB) `Map(3) {\"a\" => 2, \"b\" => 2, \"c\" => 1}`  \nC) `Map(5) {\"a\"\
    \ => 1, \"b\" => 1, \"c\" => 1, \"a\" => 2, \"b\" => 2}`\n\nThe answer is B. Any\
    \ identical keys in the second map will override keys in the first map.\n\n[Q32\
    \ Unanswered.](#text00036.html_a7SY)\n\n**Q33 Answered.** True or False? Bracket\
    \ notation can be chained just like dot notation?\n\nA) True  \nB) False\n\nThe\
    \ answer is A. `obj.prop1.prop2` and `obj['prop1']['prop2']` are equivalent.\n\
    \n[Q33 Unanswered.](#text00037.html_a7WH)\n\n**Q34 Answered.** What will the code\
    \ below output to the console and why?\n\n```javascript\nclass Person {\n  name:\
    \ string;\n  DOB: string;\n}\nconsole.log(typeof Person);\n```\n\nA) `\"class\"\
    `  \nB) `\"function\"`  \nC) `\"object\"`\n\nThe answer is B. This is a reminder\
    \ that classes are simply syntactic sugar that make JavaScript feel more object\
    \ oriented.\n\n[Q34 Unanswered.](#text00038.html_a7RF)\n\n**Q35 Answered.** Examine\
    \ the code below. Diagnose an error that will occur. Assume that `handleResponse`\
    \ and `handleError` are properly defined.\n\n```javascript\npromise.then(function(response)\
    \ {\n  this.handleResponse();\n},\nfunction(error) {\n  this.handleError();\n\
    });\n```\n\nThe answer is `this` is not scoped properly. Instead, the code needs\
    \ a way to have the proper scope on `this`, such as using `bind` or `var self\
    \ = this;`.\n\n[Q35 Unanswered.](#text00039.html_a7T2)\n\n**Q36 Answered.** What\
    \ types of properties show up in `for...in` loops?\n\nA) Executable Properties\
    \  \nB) Enumerable Properties  \nC) Iterable Properties\n\nThe answer is B.\n\n\
    [Q36 Unanswered.](#text00040.html_a7W0)\n\n**Q37 Answered.** True or False? `.bind(this)`\
    \ immediately calls the bound function.\n\nA) True  \nB) False\n\nThe answer is\
    \ B.\n\n[Q37 Unanswered.](#text00041.html_a7WV)\n\n**Q38 Answered.** What does\
    \ the code print?\n\n```javascript\nfunction getName() {\n  var name = \"Jon\"\
    ;\n  function printName() {\n    console.log(name);\n  }\n  printName();\n}\n\
    getName();\n```\n\nA) `Jon`  \nB) `undefined`  \nC) Compile time error\n\nThe\
    \ answer is A. Inner functions have access to variables declared in the outer\
    \ scope.\n\n[Q38 Unanswered.](#text00042.html_a7TS)\n\n**Q39 Answered.** True\
    \ or False? The `await` keyword is required with `async` functions?\n\nA) True\
    \  \nB) False\n\nThe answer is B. An `async` function returns a promise and has\
    \ many uses. The `await` keyword adds extra functionality and overhead that may\
    \ not be needed. See [here](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Asynchronous/Async_await)\
    \ for an example.\n\n[Q39 Unanswered.](#text00043.html_a7Y5)\n\n**Q40 Answered.**\
    \ What are the three ways for a function to refer to itself for recursion? Select\
    \ three answers.\n\nA) Use `self.run`  \nB) The function’s name  \nC) An in-scope\
    \ variable that refers to the function  \nD) Use `arguments.callee`\n\nThe answers\
