    \ 是 `undefined`？\n\n浏览器检查 `myPerson.[[Prototype]]`，没有看到名为 `a` 的属性。然后浏览器检查 `myPerson.[[Prototype]].[[Prototype]]`（即\
    \ `Object` 原型），也没有看到名为 `a` 的属性。然后浏览器检查 `myPerson.[[Prototype]].[[Prototype]].[[Prototype]]`，它是\
    \ `null`，所以浏览器返回 `undefined`。\n\n### Q2\nJavaScript 中的 `class` 关键字有什么作用？\nA) 它传达了超越普通对象的实际含义\n\
