- fmt: "\n# Table of Contents\n- [Test 1 Questions](#text00004.html_a7KJ)\n- [Test\
    \ 2 Questions](#text00080.html_a7KK)\n- [Test 3 Questions](#text00156.html_a7KM)\n\
    - [Test 4 Questions](#text00232.html_a7KN)\n- [Test 1 Answers](#text00308.html_a7KP)\n\
    - [Test 2 Answers](#text00384.html_a7KR)\n- [Test 3 Answers](#text00459.html_a7KS)\n\
    - [Test 4 Answers](#text00535.html_a7KT)\n\n## Test 1 Questions\n\n**Q1.** Which\
    \ of the following prints first?\n\n```\nsetTimeout(() => {console.log('setTimeout\
    \ wins');},0);\nqueueMicrotask(() => {console.log('queueMicrotask wins');});\n\
    ```\n\n- A) `setTimeout` wins\n- B) `queueMicrotask` wins\n- C) Compile time error\n\
    \nThe answer is B. Tasks from `queueMicrotask` are called after the callstack\
    \ is empty and before the event loop is called. Tasks from `setTimeout` are part\
    \ of the eventQueue.\n\n[Q1 Answered.](#text00309.html_a85W)\n\n**Q2.** What will\
    \ the code below output to the console and why?\n\n```\nlet x = 10;\nconst byValue\
    \ = (y) => {y = 20;}\nbyValue(x);\nconsole.log(x);\n```\n\n- A) 20\n- B) 10\n\
    - C) Compile time error\n\n[Q2 Answered.](#text00310.html_a7V3)\n\n**Q3.** Consider\
    \ the following code. What will it log to the console and why?\n\n```\nlet x =\
    \ 5;\nlet x = 10;\nconsole.log(x);\n```\n\n- A) 5\n- B) 10\n- C) It will throw\
    \ a compiler error.\n\n[Q3 Answered.](#text00311.html_a7S5)\n\n**Q4.** Consider\
    \ the following code. What does each line output?\n\n```\nconsole.log(new String(\"\
    yes\") === new String(\"yes\")); // Line 1\nconsole.log(\"yes\" === \"yes\");\
    \ // Line 2\n```\n\n- A) Line 1 prints true, Line 2 prints true\n- B) Line 1 prints\
    \ false, Line 2 prints true\n- C) Line 1 prints true, Line 2 prints false\n- D)\
    \ Line 1 prints false, Line 2 prints false\n\n[Q4 Answered.](#text00312.html_a818)\n\
    \n**Q5.** What will the code below output to the console and why?\n\n```\nconst\
    \ x = new String(\"tricky\");\nconst y = x;\nconsole.log(x === y);\n```\n\n- A)\
    \ True\n- B) False\n\n[Q5 Answered.](#text00313.html_a7XK)\n\n**Q6.** Are arrays\
    \ objects or primitives in JavaScript?\n\n- A) Objects\n- B) Primitives\n\n[Q6\
    \ Answered.](#text00314.html_a854)\n\n**Q7.** What is the return type of the async\
    \ function below?\n\n```\nasync function goodbye() {return ‘goodbye’;}\n```\n\n\
    - A) string\n- B) `Promise`\n- C) Async\n\n[Q7 Answered.](#text00315.html_a7W6)\n\
    \n**Q8.** True or False? The `await` keyword blocks all JavaScript code execution\
    \ in an app until the awaited `Promise` is returned.\n\n- A) True\n- B) False\n\
    \n[Q8 Answered.](#text00316.html_a7VS)\n\n**Q9.** Recall that functions are objects\
    \ in JavaScript. What does the following print?\n\n```\nfunction myFunc() {}\n\
    console.log(typeof myFunc);\n```\n\n- A) object\n- B) function\n- C) true\n- D)\
    \ It throws an error\n\n[Q9 Answered.](#text00317.html_a7YV)\n\n**Q10.** True\
    \ or False? The following is valid syntax for printing ‘goodbye’.\n\n```\nlet\
    \ goodbye = async () => { return \"Goodbye\" };\ngoodbye().then(console.log);\n\
    ```\n\n- A) True\n- B) False\n\n[Q10 Answered.](#text00318.html_a7MU)\n\n**Q11.**\
    \ What of the following is not a difference between `typeof` and `instanceof`?\n\
    \n- A) `typeof` returns a type and `instanceof` returns a boolean\n- B) `instanceof`\
    \ requires TypeScript and `typeof` does not\n- C) `typeof` takes the variable\
    \ name on the right while `instanceof` takes a value on the left and right\n\n\
    [Q11 Answered.](#text00319.html_a7RY)\n\n**Q12.** Which of the following resolves\
    \ when all promises are fulfilled, or rejects as soon as one promise is rejected?\n\
    \n- A) `Promise.race()`\n- B) `Promise.any()`\n- C) `Promise.all()`\n- D) `Promise.resolve()`\n\
    \n[Q12 Answered.](#text00320.html_a83J)\n\n**Q13.** What will the code below output\
    \ to the console and why?\n\n```\nlet x = 10;\nfunction myFunc(y){y = 12;}\nmyFunc(x);\n\
    console.log(x);\n```\n\n- A) 10\n- B) 12\n- C) undefined\n\n[Q13 Answered.](#text00321.html_a7NY)\n\
    \n**Q14.** What does the below code output to the console and why?\n\n```\nconsole.log(11\
    \ & 3);\n```\n\n- A) 11\n- B) 1\n- C) 2\n- D) 3\n\n[Q14 Answered.](#text00322.html_a7UD)\n\
    \n**Q15.** What is the value of `Object.[[Prototype]]`?\n\n- A) `Object`\n- B)\
    \ `null`\n- C) `{}`\n\n[Q15 Answered.](#text00323.html_a7W1)\n\n**Q16.** What\
    \ does the `??` (nullish coalescing operator) do?\n\n[Q16 Answered.](#text00324.html_a7TP)\n\
    \n**Q17.** What operator will return the remainder when one operand is divded\
    \ by another operand?\n\n- A) `$`\n- B) `#`\n- C) `%`\n- D) None of the above\n\
    \n[Q17 Answered.](#text00325.html_a7RC)\n\n**Q18.** True or False? `getElementsByTagName`\
    \ is a JavaScript function.\n\n- A) True\n- B) False\n\n[Q18 Answered.](#text00326.html_a7NU)\n\
    \n**Q19.** Give an example of when to use event delegation in JavaScript.\n\n\
    [Q19 Answered.](#text00327.html_a7Y3)\n\n**Q20.** Does the code below evaluate\
    \ to true or false?\n\n```\nBigInt(10000000000000000000) === 10000000000000000000\n\
    ```\n\n- A) true\n- B) false\n\n[Q20 Answered.](#text00328.html_a868)\n\n**Q21.**\
    \ Which of the following is not a built-in JS error type?\n\n- A) `Error`\n- B)\
    \ `EvalError`\n- C) `SyntaxError`\n- D) `TypeError`\n- E) `UndefinedError`\n\n\
    [Q21 Answered.](#text00329.html_a7N9)\n\n**Q22.** How are numbers stored in JavaScript?\
    \ Select all that apply.\n\n- A) Double precision\n- B) 64-bit\n- C) Floating\
    \ point numbers\n\n[Q22 Answered.](#text00330.html_a7RM)\n\n**Q23.** If a function\
    \ has no return value specified, what value does it return?\n\n- A) `null`\n-\
    \ B) `undefined`\n- C) nothing\n\n[Q23 Answered.](#text00331.html_a7VR)\n\n**Q24.**\
    \ What is the syntax for calling a method which may or may not exist on an object?\n\
    \n[Q24 Answered.](#text00332.html_a7YP)\n\n**Q25.** Which of the following is\
    \ not a valid Promise method?\n\n- A) `Promise.some()`\n- B) `Promise.allSettled()`\n\
    - C) `Promise.reject()`\n- D) `Promise.race`\n\n[Q25 Answered.](#text00333.html_a7Y1)\n\
    \n**Q26.** How can you dynamically access an object property based on a variable\
    \ value?\n\n[Q26 Answered.](#text00334.html_a7RH)\n\n**Q27.** True or False? A\
    \ string can be modified after it is created.\n\n- A) True\n- B) False\n\n[Q27\
    \ Answered.](#text00335.html_a81F)\n\n**Q28.** True or False? JavaScript is synchronous.\n\
    \n- A) True\n- B) False\n\n[Q28 Answered.](#text00336.html_a7WP)\n\n**Q29.** True\
    \ or False? A nested `catch` in a `Promise` chain can catch errors thrown higher\
    \ up in the `Promise` chain?\n\n- A) True\n- B) False\n\n[Q29 Answered.](#text00337.html_a83A)\n\
    \n**Q30.** True or False? The `Map` object can have keys that are of types other\
    \ than strings, such as number.\n\n- A) True\n- B) False\n\n[Q30 Answered.](#text00338.html_a81E)\n\
    \n**Q31.** What will the code below output to the console and why?\n\n```\nconst\
    \ map = new Map();\nmap.set({},1);\nconsole.log(map.get({}));\n```\n\n- A) undefined\n\
    - B) 1\n- C) Compile time error\n\n[Q31 Answered.](#text00339.html_a84J)\n\n**Q32.**\
    \ What will the code below output to the console and why?\n\n```\nlet map1 = new\
    \ Map([['a', 1],['b', 1],['c', 1],]);\nlet map2 = new Map([['a', 2],['b', 2]]);\n\
    let spreadMap = new Map([...map1, ...map2]);\n```\n\n- A) `Map(3) {\"a\" => 1,\
    \ \"b\" => 1, \"c\" => 1}`\n- B) `Map(3) {\"a\" => 2, \"b\" => 2, \"c\" => 1}`\n\
    - C) `Map(5) {\"a\" => 1, \"b\" => 1, \"c\" => 1, \"a\" => 2, \"b\" => 2}`\n\n\
    [Q32 Answered.](#text00340.html_a7PF)\n\n**Q33.** True or False? Bracket notation\
    \ can be chained just like dot notation?\n\n- A) True\n- B) False\n\n[Q33 Answered.](#text00341.html_a82E)\n\
    \n**Q34.** What will the code below output to the console and why?\n\n```\nclass\
    \ Person {name: string;DOB: string;}\nconsole.log(typeof Person);\n```\n\n- A)\
    \ `\"class\"`\n- B) `\"function\"`\n- C) `\"object\"`\n\n[Q34 Answered.](#text00342.html_a83K)\n\
    \n**Q35.** Examine the code below. Diagnose an error that will occur. Assume that\
    \ `handleResponse` and `handleError` are properly defined.\n\n```\npromise.then(function(response)\
    \ {\n  this.handleResponse();\n},\nfunction(error) {\n  this.handleError();\n\
    });\n```\n\n[Q35 Answered.](#text00343.html_a81K)\n\n**Q36.** What types of properties\
    \ show up in `for...in` loops?\n\n- A) Executable Properties\n- B) Enumerable\
    \ Properties\n- C) Iterable Properties\n\n[Q36 Answered.](#text00344.html_a7PU)\n\
    \n**Q37.** True or False? `.bind(this)` immediately calls the bound function.\n\
    \n- A) True\n- B) False\n\n[Q37 Answered.](#text00345.html_a7ZC)\n\n**Q38.** What\
    \ does the code print?\n\n```\nfunction getName() {\n  var name = \"Jon\";\n \
    \ function printName() {\n    console.log(name);\n  }\n  printName();\n}\ngetName();\n\
    ```\n\n- A) Jon\n- B) undefined\n- C) Compile time error\n\n[Q38 Answered.](#text00346.html_a7Z4)\n\
    \n**Q39.** True or False? The `await` keyword is required with `async` functions?\n\
    \n- A) True\n- B) False\n\n[Q39 Answered.](#text00347.html_a844)\n\n**Q40.** What\
    \ are the three ways for a function to refer to itself for recusion? Select three\
    \ answers.\n\n- A) Use `self.run`\n- B) The function’s name\n- C) An in-scope\
    \ variable that refers to the function\n- D) Use `arguments.callee`\n\n[Q40 Answered.](#text00348.html_a7NH)\n\
    \n**Q41.** What will the code below output to the console and why?\n\n```\nconst\
    \ test = (incrementer) => {\n  if (incrementer < 0){\n    return;\n  }\n  console.log('first:\
    \ ' + incrementer);\n  test(incrementer - 1);\n  console.log('second: ' + incrementer)\n\
    }\ntest(2);\n```\n\n[Q41 Answered.](#text00349.html_a7PD)\n"
