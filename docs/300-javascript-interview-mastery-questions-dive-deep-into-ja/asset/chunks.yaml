    \ the lack of `prototype` indicates `from` is a class level method\nC) `prototype`\
    \ indicates `reduce` is inherited from `Object`\n\nThe answers are A, B.\n\n###\
    \ Q58\nHow does the Maximum Call Stack Exceeded error get triggered?\nAnswer:\
    \ Usually a function is recursively calling itself, so the \"Stack\" of function\
    \ calls waiting to execute grows until a maximum is reached.\n\n### Q59\nWhich\
    \ of the following is not a method available on the Web API `window` object for\
