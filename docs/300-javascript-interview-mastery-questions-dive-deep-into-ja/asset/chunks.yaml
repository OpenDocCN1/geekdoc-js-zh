    ### Q42. True or False?


    The difference in `Promise.any()` and `Promise.race()` is that `Promise.race()`
    returns the first settled Promise (fulfilled or rejected), while `Promise.any()`
    continues to resolve until a promise is fulfilled, and only rejects if all promises
    are rejected.


    A) True

    B) False


    [Q42 Answered.](#text00350.html_a84E)

