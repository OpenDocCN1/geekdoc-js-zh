    B) the name is never included in the default\nC) nothing\n\nThe answer is A.\n\
    \n### Q54\nTrue or False? Function declarations are hoisted, function expressions\
    \ are not hoisted.\nA) True\nB) False\n\nThe answer is A.\n\n### Q55\nWhat statement\
