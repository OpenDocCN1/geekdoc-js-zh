  raw:  Q42.True or False?  The difference in Promise.any() and Promise.race() is
    that Promise.race() returns the first settled Promise (fulfilled or rejected),
    while Promise.any() continues to resolve until a promise is fulfilled, and only
    rejects if all promises are rejected.A)  TrueB)  False[Q42 Answered.](#text00350.html_a84E)
  toc: []
  trans: '


    ### Q42. 正确还是错误？


    `Promise.any()` 和 `Promise.race()` 的区别在于，`Promise.race()` 返回第一个状态确定的 Promise（无论是
    fulfilled 还是 rejected），而 `Promise.any()` 会持续等待直到有一个 Promise 状态变为 fulfilled，只有在所有
    Promise 都被 rejected 时才会 reject。


    A) 正确

    B) 错误


    Q42 答案。


    '
- fmt: "\n# JavaScript 问答集\n\n## Test 1 Answers\n\n**Q1 Answered.** Which of the following\
    \ prints first?\n\n```javascript\nsetTimeout(() => {\n  console.log('setTimeout\
    \ wins');\n}, 0);\nqueueMicrotask(() => {\n  console.log('queueMicrotask wins');\n\
    });\n```\n\nA) `setTimeout` wins  \nB) `queueMicrotask` wins  \nC) Compile time\
    \ error\n\n[Q1 Unanswered.](#text00005.html_a7S7)\n\n**Q2 Answered.** What will\
    \ the code below output to the console and why?\n\n```javascript\nlet x = 10;\n\
    const byValue = (y) => {\n  y = 20;\n}\nbyValue(x);\nconsole.log(x);\n```\n\n\
    A) 20  \nB) 10  \nC) Compile time error\n\nThe answer is B. Unlike objects, when\
    \ primitives are passed to a function only their value is passed, not the reference\
    \ to the memory location. Therefore, changes to the parameter only affect the\
    \ parameter in the function’s scope.\n\n[Q2 Unanswered.](#text00006.html_a7UX)\n\
    \n**Q3 Answered.** Consider the following code. What will it log to the console\
    \ and why?\n\n```javascript\nlet x = 5;\nlet x = 10;\nconsole.log(x);\n```\n\n\
    A) 5  \nB) 10  \nC) It will throw a compiler error.\n\nThe answer is C. However,\
    \ the below works because the scope of the declarations is different (It’s not\
    \ clean code, however).\n\n```javascript\nlet x = 5;\nif(x){\n  let x = 10;\n\
    \  console.log(x);\n}\n```\n\n[Q3 Unanswered.](#text00007.html_a80Z)\n\n**Q4 Answered.**\
    \ Consider the following code. What does each line output?\n\n```javascript\n\
    console.log(new String(\"yes\") === new String(\"yes\")); // Line 1\nconsole.log(\"\
    yes\" === \"yes\"); // Line 2\n```\n\nA) Line 1 prints `true`, Line 2 prints `true`\
    \  \nB) Line 1 prints `false`, Line 2 prints `true`  \nC) Line 1 prints `true`,\
    \ Line 2 prints `false`  \nD) Line 1 prints `false`, Line 2 prints `false`\n\n\
    The answer is B. Line 1 is comparing two objects, seeing that they are each unique\
    \ (literally not the exact same object) and thus is `false`. Even a `==` loose\
    \ check will result in `false` for Line 1. Line 2 passes because it is comparing\
    \ two string primitives, not string objects.\n\n[Q4 Unanswered.](#text00008.html_a7WG)\n\
    \n**Q5 Answered.** What will the code below output to the console and why?\n\n\
    ```javascript\nconst x = new String(\"tricky\");\nconst y = x;\nconsole.log(x\
    \ === y);\n```\n\nA) `true`  \nB) `false`\n\nThe answer is A. Unlike the previous\
    \ question, where two unique objects were created, this time there is one unique\
    \ object created, with two constants (`x` and `y`) pointing to this unique object\
    \ in memory.\n\n[Q5 Unanswered.](#text00009.html_a7ND)\n\n**Q6 Answered.** Are\
    \ Arrays objects or primitives in JavaScript?\n\nA) Objects  \nB) Primitives\n\
    \nThe answer is A. Arrays are a special kind of object in JavaScript. They have\
    \ properties that no other objects have, which are inherited from `Array.prototype`.\n\
    \n[Q6 Unanswered.](#text00010.html_a7TX)\n\n**Q7 Answered.** What is the return\
    \ type of the `async` function below?\n\n```javascript\nasync function goodbye()\
    \ {\n  return 'goodbye';\n}\n```\n\nA) `string`  \nB) `Promise`  \nC) `Async`\n\
    \nThe answer is B. `async` functions return Promises. To actually consume the\
    \ value returned when the promise fulfills, you need a `.then` statement such\
    \ as `goodbye.then((value) => console.log(value));`.\n\n[Q7 Unanswered.](#text00011.html_a7UF)\n\
    \n**Q8 Answered.** True or False? The `await` keyword blocks all JavaScript code\
    \ execution in an app until the awaited Promise is returned.\n\nA) True  \nB)\
    \ False\n\nThe answer is B. The `await` keyword only blocks execution of code\
    \ inside the specific `async` function containing the `await` keyword. The caller\
    \ of the `await`’s async function can continue with execution while awaiting the\
    \ async functions resolution. This is called splitting execution flow.\n\n[Q8\
    \ Unanswered.](#text00012.html_a7YG)\n\n**Q9 Answered.** Recall that functions\
    \ are objects in JavaScript. What does the following print?\n\n```javascript\n\
    function myFunc() {}\nconsole.log(typeof myFunc);\n```\n\nA) `object`  \nB) `function`\
    \  \nC) `true`  \nD) It throws an error\n\nThe answer is B. Despite the fact that\
    \ functions are indeed objects in JavaScript, `typeof myFunc` prints “function”.\n\
    \n[Q9 Unanswered.](#text00013.html_a7KV)\n\n**Q10 Answered.** True or False? The\
    \ following is valid syntax for printing ‘goodbye’.\n\n```javascript\nlet goodbye\
    \ = async () => { return \"Goodbye\" };\ngoodbye().then(console.log); // Line\
    \ 2\n```\n\nA) True  \nB) False\n\nThe answer is A. Line 2 is a valid shorthand\
    \ for passing the returned value of an async function to a callback.\n\n[Q10 Unanswered.](#text00014.html_a804)\n\
    \n**Q11 Answered.** Which of the following is not a difference between `typeof`\
    \ and `instanceof`?\n\nA) `typeof` returns a type and `instanceof` returns a boolean\
    \  \nB) `instanceof` requires TypeScript and `typeof` does not  \nC) `typeof`\
    \ takes the variable name on the right while `instanceof` takes a value on the\
    \ left and right\n\nThe answer is B. Neither `typeof` nor `instanceof` require\
    \ TypeScript, both are native to JavaScript.\n\n[Q11 Unanswered.](#text00015.html_a7ZB)\n\
    \n**Q12 Answered.** Which of the following resolves when all promises are fulfilled,\
    \ or rejects as soon as one promise is rejected?\n\nA) `Promise.race()`  \nB)\
    \ `Promise.any()`  \nC) `Promise.all()`  \nD) `Promise.resolve()`\n\nThe answer\
    \ is C. `Promise.all()` is useful if you want the execution to wait until all\
    \ Promises resolve (or any fail). Also, all of the above are valid Promise functions.\n\
    \n[Q12 Unanswered.](#text00016.html_a7SG)\n\n**Q13 Answered.** What will the code\
    \ below output to the console and why?\n\n```javascript\nlet x = 10;\nfunction\
    \ myFunc(y){\n  y = 12;\n}\nmyFunc(x);\nconsole.log(x);\n```\n\nA) 10  \nB) 12\
    \  \nC) `undefined`\n\nThe answer is A. Primitives are passed by value, not by\
    \ reference, so “changing them” in a function doesn’t affect the original variable.\n\
    \n[Q13 Unanswered.](#text00017.html_a853)\n\n**Q14 Answered.** What does the below\
    \ code output to the console and why?\n\n```javascript\nconsole.log(11 & 3);\n\
    ```\n\nA) 11  \nB) 1  \nC) 2  \nD) 3\n\nThe answer is D. `&` is a bitwise operator\
    \ (very different from `&&`). `11 & 3` is the same as (in binary) `1011 & 0011`.\
    \ Only bits that are both 1 are kept at 1, so the output is `0011`, which is the\
    \ binary representation of 3.\n\n[Q14 Unanswered.](#text00018.html_a7S9)\n\n**Q15\
    \ Answered.** What is the value of `Object.[[Prototype]]`?\n\nA) `Object`  \n\
    B) `null`  \nC) `{}`\n\nThe answer is B. While `Object` is at the top of the prototype\
    \ chain, when the browser is seeking the value of an accessed property, it will\
    \ traverse the prototype chain until the value is found or until there are no\
    \ more prototypes to traverse. While `null` is the value of `Object.[[Prototype]]`,\
    \ `undefined` is the returned value.\n\nSee here for more reading: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Inheritance_and_the_prototype_chain\n\
    \n[Q15 Unanswered.](#text00019.html_a7T4)\n\n**Q16 Answered.** What does the nullish\
    \ coalescing operator do?\n\nIt returns the right-hand side operand when the left\
    \ hand operand is `null` or `undefined`. Otherwise, the left hand operand is returned.\
    \ The syntax is `??`.\n\n[Q16 Unanswered.](#text00020.html_a7ZF)\n\n**Q17 Answered.**\
    \ What operator will return the remainder when one operand is divided by another\
    \ operand?\n\nA) `$`  \nB) `#`  \nC) `%`  \nD) None of the above\n\nThe answer\
    \ is C.\n\n[Q17 Unanswered.](#text00021.html_a7YU)\n\n**Q18 Answered.** True or\
    \ False? `getElementsByTagName` is a JavaScript function.\n\nA) True  \nB) False\n\
    \nThe answer is B. `getElementsByTagName` is actually Web API function. It is\
    \ available like a normal JS function, but is accessible regardless of language\
    \ being used.\n\n[Q18 Unanswered.](#text00022.html_a82R)\n\n**Q19 Answered.**\
    \ Give an example of when to use event delegation in JavaScript.\n\nOne example:\
    \ Use event delegation if an element that you want to listen for events on may\
    \ not exist at page load. Instead, put event handler on a parent element and look\
    \ at `event.target`.\n\nModern frameworks and libraries such as React make this\
    \ less necessary.\n\n[Q19 Unanswered.](#text00023.html_a84R)\n\n**Q20 Answered.**\
    \ Does the code below evaluate to `true` or `false`?\n\n```javascript\nBigInt(10000000000000000000)\
    \ === 10000000000000000000\n```\n\nA) `true`  \nB) `false`\n\nThe answer is B.\
    \ However, `BigInt(10000000000000000000) == 10000000000000000000` is `true`.\n\
    \n[Q20 Unanswered.](#text00024.html_a7YE)\n\n**Q21 Answered.** Which of the following\
    \ is not a built-in JS error type?\n\nA) `Error`  \nB) `EvalError`  \nC) `SyntaxError`\
    \  \nD) `TypeError`  \nE) `UndefinedError`\n\nThe answer is E.\n\n[Q21 Unanswered.](#text00025.html_a7UG)\n\
    \n**Q22 Answered.** How are numbers stored in JavaScript? Select all that apply.\n\
    \nA) Double precision  \nB) 64-bit  \nC) Floating point numbers\n\nA, B, and C\
