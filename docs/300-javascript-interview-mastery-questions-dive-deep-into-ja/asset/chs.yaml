  \n- A) object\n- B) function\n- C) true\n- D) 会抛出错误\n\n问题 9 已回答。\n\n**问题 10.** 判断对错？以下语法对于打印‘goodbye’是有效的。\n\
  \n```\nlet goodbye = async () => { return \"Goodbye\" };\ngoodbye().then(console.log);\n\
  ```\n\n- A) 正确\n- B) 错误\n\n问题 10 已回答。\n\n**问题 11.** 以下哪一项不是 `typeof` 和 `instanceof`\
