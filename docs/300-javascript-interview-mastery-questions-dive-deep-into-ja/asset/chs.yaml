  \ `typeof` 不需要\n- C) `typeof` 右侧是变量名，而 `instanceof` 左侧和右侧都是值\n\n问题 11 已回答。\n\n**问题\
  \ 12.** 以下哪个方法会在所有 promise 都完成时解决，或者一旦有一个 promise 被拒绝就立即拒绝？\n\n- A) `Promise.race()`\n\
  - B) `Promise.any()`\n- C) `Promise.all()`\n- D) `Promise.resolve()`\n\n问题 12 已回答。\n\
  \n**问题 13.** 下面的代码会向控制台输出什么，为什么？\n\n```\nlet x = 10;\nfunction myFunc(y){y = 12;}\n\
