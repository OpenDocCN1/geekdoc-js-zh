  B) 默认导出中从不包含名称\nC) 没有区别\n\n答案是 A。\n\n### Q54\n判断对错？函数声明会被提升，函数表达式不会被提升。\nA) 正确\n\
  B) 错误\n\n答案是 A。\n\n### Q55\n哪个语句会显示导入模块的 URL？\nA) `import.path`\nB) `path.show`\n\
  C) `path.directory`\nD) `import.meta`\n\n答案是 D。\n\n### Q56\n`console.log`、`console.error`\
