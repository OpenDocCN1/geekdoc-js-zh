  \ 循环语法。\n\n### Q47\n判断对错？`RegExp` 没有任何属性。\nA) 正确\nB) 错误\n\n答案是 B。`RegExp` 有很多属性，例如\
  \ `.flags` 和 `.global`。\n\n### Q48\n```javascript\nfunction resolveQuickly(x) {\n\
