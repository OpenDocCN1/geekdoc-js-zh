  \ Completed（已完成）\n\n答案是 D。\n\n### Q51\n哪个函数会在浏览器下一次重绘显示之前执行指定的代码块？\nA) `requestAnimationFrame()`\n\
  B) `setTimeout()`\nC) `requestRepaintDelay()`\n\n答案是 A。\n\n### Q52\n假设你想在动画中达到 60fps\
