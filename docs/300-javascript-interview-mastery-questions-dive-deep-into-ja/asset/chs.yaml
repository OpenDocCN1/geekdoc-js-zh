- "# 300 道 JavaScript 面试精通题：深入 JavaScript 理论、语法与 API，自信应对面试\n\n\n\n\n## 引言\n本书包含涵盖\
  \ JavaScript 语法、规则、功能及理论的问题。旨在帮助你提升 JavaScript 知识，同时让你接触到 JavaScript 中的一些边界情况和特殊场景。我发现，这类例子最能巩固开发者对这门有趣语言的理解。\n\
  \n本书中有少数问题针对浏览器中运行的 JavaScript，但大多数问题与环境无关。少数问题还涉及 TypeScript，但会特别标注。本书分为 4 个“测试”，每个问题都链接到书末的答案。\n\
  \n作为额外福利，下面两个链接提供了另外 50 道免费 JavaScript 面试精通题和 50 道免费 TypeScript 面试精通题。\n\n[50 道\
  \ JavaScript 面试精通题](https://medium.com/the-clever-dev/50-difficult-javascript-interview-questions-88e6e92367e7?source=friends_link&sk=321a35a056e98aef103cc540794bd79f)（发布在我的\
  \ Medium.com 专栏上）。\n\n[50 道 TypeScript 面试精通题](https://medium.com/the-clever-dev/50-difficult-typescript-interview-questions-a7103299e210?source=friends_link&sk=d6f5b58ec947559175b3972498395fa9)（发布在我的\
  \ Medium.com 专栏上）。\n\n## 关于作者\n如果你喜欢本书并希望继续与我一起学习 JavaScript，请查看以下内容：\n\n* [我的 Medium.com\
  \ 作品集](https://medium.com/@jonathan.middaugh) – 包含 JavaScript 文章以及我偶尔从事的开发者副业\n\
  * [我的 YouTube 频道](https://www.youtube.com/channel/UCb6AZy0_D1y661PMZck3jOw) – 与我的\
  \ Medium.com 作品集相同，但我喜欢制作视频时的互动感。此外，我相信它们能以不同方式帮助不同的人学习\n* [Twitter](https://twitter.com/SDevpreneur)\
  \ – 在此关注我，获取最新文章动态以及开发者社区中有趣的内容\n\n\n\n\n\n## 测试 1 问题\n\n**问题 1.** 以下哪个会先打印？\n\n\
  ```\nsetTimeout(() => {console.log('setTimeout wins');},0);\nqueueMicrotask(() =>\
  \ {console.log('queueMicrotask wins');});\n```\n\n- A) `setTimeout` 胜出\n- B) `queueMicrotask`\
  \ 胜出\n- C) 编译时错误\n\n答案是 B。来自 `queueMicrotask` 的任务在调用栈清空后、事件循环被调用前执行。来自 `setTimeout`\
  \ 的任务属于事件队列的一部分。\n\n问题 1 已回答。\n\n**问题 2.** 下面的代码会向控制台输出什么，为什么？\n\n```\nlet x = 10;\n\
  const byValue = (y) => {y = 20;}\nbyValue(x);\nconsole.log(x);\n```\n\n- A) 20\n\
  - B) 10\n- C) 编译时错误\n\n问题 2 已回答。\n\n**问题 3.** 考虑以下代码。它会向控制台输出什么，为什么？\n\n```\nlet\
  \ x = 5;\nlet x = 10;\nconsole.log(x);\n```\n\n- A) 5\n- B) 10\n- C) 会抛出编译错误\n\n\
  问题 3 已回答。\n\n**问题 4.** 考虑以下代码。每一行输出什么？\n\n```\nconsole.log(new String(\"yes\") ===\
  \ new String(\"yes\")); // 第 1 行\nconsole.log(\"yes\" === \"yes\"); // 第 2 行\n```\n\
  \n- A) 第 1 行输出 true，第 2 行输出 true\n- B) 第 1 行输出 false，第 2 行输出 true\n- C) 第 1 行输出\
  \ true，第 2 行输出 false\n- D) 第 1 行输出 false，第 2 行输出 false\n\n问题 4 已回答。\n\n**问题 5.**\
  \ 下面的代码会向控制台输出什么，为什么？\n\n```\nconst x = new String(\"tricky\");\nconst y = x;\n\
  console.log(x === y);\n```\n\n- A) True\n- B) False\n\n问题 5 已回答。\n\n**问题 6.** 在\
  \ JavaScript 中，数组是对象还是原始类型？\n\n- A) 对象\n- B) 原始类型\n\n问题 6 已回答。\n\n**问题 7.** 下面异步函数的返回类型是什么？\n\
  \n```\nasync function goodbye() {return ‘goodbye’;}\n```\n\n- A) string\n- B) `Promise`\n\
