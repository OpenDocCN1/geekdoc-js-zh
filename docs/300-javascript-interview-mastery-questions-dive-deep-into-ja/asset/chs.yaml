  \n问题 16 已回答。\n\n**问题 17.** 哪个运算符会返回一个操作数除以另一个操作数的余数？\n\n- A) `$`\n- B) `#`\n- C)\
  \ `%`\n- D) 以上都不是\n\n问题 17 已回答。\n\n**问题 18.** 判断对错？`getElementsByTagName` 是一个 JavaScript\
  \ 函数。\n\n- A) 正确\n- B) 错误\n\n问题 18 已回答。\n\n**问题 19.** 请给出一个在 JavaScript 中使用事件委托的例子。\n\
  \n问题 19 已回答。\n\n**问题 20.** 下面的代码会求值为 true 还是 false？\n\n```\nBigInt(10000000000000000000)\
  \ === 10000000000000000000\n```\n\n- A) true\n- B) false\n\n问题 20 已回答。\n\n**问题 21.**\
  \ 以下哪一项不是 JavaScript 内置的错误类型？\n\n- A) `Error`\n- B) `EvalError`\n- C) `SyntaxError`\n\
  - D) `TypeError`\n- E) `UndefinedError`\n\n问题 21 已回答。\n\n**问题 22.** 数字在 JavaScript\
  \ 中是如何存储的？请选择所有适用的选项。\n\n- A) 双精度\n- B) 64 位\n- C) 浮点数\n\n问题 22 已回答。\n\n**问题 23.**\
  \ 如果一个函数没有指定返回值，它会返回什么值？\n\n- A) `null`\n- B) `undefined`\n- C) 什么也不返回\n\n问题 23\
  \ 已回答。\n\n**问题 24.** 调用一个对象上可能存在也可能不存在的方法的语法是什么？\n\n问题 24 已回答。\n\n**问题 25.** 以下哪一项不是有效的\
  \ Promise 方法？\n\n- A) `Promise.some()`\n- B) `Promise.allSettled()`\n- C) `Promise.reject()`\n\
  - D) `Promise.race`\n\n问题 25 已回答。\n\n**问题 26.** 如何根据变量值动态访问对象属性？\n\n问题 26 已回答。\n\
  \n**问题 27.** 判断对错？字符串在创建后可以被修改。\n\n- A) 正确\n- B) 错误\n\n问题 27 已回答。\n\n**问题 28.**\
  \ 判断对错？JavaScript 是同步的。\n\n- A) 正确\n- B) 错误\n\n问题 28 已回答。\n\n**问题 29.** 判断对错？在 `Promise`\
  \ 链中，嵌套的 `catch` 可以捕获链中更上层抛出的错误？\n\n- A) 正确\n- B) 错误\n\n问题 29 已回答。\n\n**问题 30.**\
  \ 判断对错？`Map` 对象的键可以是字符串以外的类型，例如数字。\n\n- A) 正确\n- B) 错误\n\n问题 30 已回答。\n\n**问题 31.**\
  \ 下面的代码会向控制台输出什么，为什么？\n\n```\nconst map = new Map();\nmap.set({},1);\nconsole.log(map.get({}));\n\
  ```\n\n- A) undefined\n- B) 1\n- C) 编译时错误\n\n问题 31 已回答。\n\n**问题 32.** 下面的代码会向控制台输出什么，为什么？\n\
  \n```\nlet map1 = new Map([['a', 1],['b', 1],['c', 1],]);\nlet map2 = new Map([['a',\
  \ 2],['b', 2]]);\nlet spreadMap = new Map([...map1, ...map2]);\n```\n\n- A) `Map(3)\
