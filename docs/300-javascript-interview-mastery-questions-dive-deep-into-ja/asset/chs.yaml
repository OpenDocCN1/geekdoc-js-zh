  c\" => 1}`\n- C) `Map(5) {\"a\" => 1, \"b\" => 1, \"c\" => 1, \"a\" => 2, \"b\"\
  \ => 2}`\n\n问题 32 已回答。\n\n**问题 33.** 判断对错？方括号表示法可以像点表示法一样进行链式调用？\n\n- A) 正确\n- B)\
  \ 错误\n\n问题 33 已回答。\n\n**问题 34.** 下面的代码会向控制台输出什么，为什么？\n\n```\nclass Person {name:\
  \ string;DOB: string;}\nconsole.log(typeof Person);\n```\n\n- A) `\"class\"`\n-\
  \ B) `\"function\"`\n- C) `\"object\"`\n\n问题 34 已回答。\n\n**问题 35.** 检查下面的代码。诊断将会发生的错误。假设\
  \ `handleResponse` 和 `handleError` 已正确定义。\n\n```\npromise.then(function(response)\
  \ {\n  this.handleResponse();\n},\nfunction(error) {\n  this.handleError();\n});\n\
  ```\n\n问题 35 已回答。\n\n**问题 36.** 哪些类型的属性会出现在 `for...in` 循环中？\n\n- A) 可执行属性\n- B)\
  \ 可枚举属性\n- C) 可迭代属性\n\n问题 36 已回答。\n\n**问题 37.** 判断对错？`.bind(this)` 会立即调用绑定的函数。\n\
  \n- A) 正确\n- B) 错误\n\n问题 37 已回答。\n\n**问题 38.** 代码会打印什么？\n\n```\nfunction getName()\
  \ {\n  var name = \"Jon\";\n  function printName() {\n    console.log(name);\n \
  \ }\n  printName();\n}\ngetName();\n```\n\n- A) Jon\n- B) undefined\n- C) 编译时错误\n\
  \n问题 38 已回答。\n\n**问题 39.** 判断对错？`await` 关键字必须与 `async` 函数一起使用？\n\n- A) 正确\n- B)\
  \ 错误\n\n问题 39 已回答。\n\n**问题 40.** 函数在递归中引用自身有哪三种方式？请选择三个答案。\n\n- A) 使用 `self.run`\n\
  - B) 函数名\n- C) 一个指向该函数的作用域内变量\n- D) 使用 `arguments.callee`\n\n问题 40 已回答。\n\n**问题\
  \ 41.** 下面的代码会向控制台输出什么，为什么？\n\n```\nconst test = (incrementer) => {\n  if (incrementer\
  \ < 0){\n    return;\n  }\n  console.log('first: ' + incrementer);\n  test(incrementer\
  \ - 1);\n  console.log('second: ' + incrementer)\n}\ntest(2);\n```\n\n问题 41 已回答。\n\
  \n\n\n\n\n### Q42. 正确还是错误？\n\n`Promise.any()` 和 `Promise.race()` 的区别在于，`Promise.race()`\
  \ 返回第一个状态确定的 Promise（无论是 fulfilled 还是 rejected），而 `Promise.any()` 会持续等待直到有一个 Promise\
  \ 状态变为 fulfilled，只有在所有 Promise 都被 rejected 时才会 reject。\n\nA) 正确\nB) 错误\n\nQ42 答案。\n\
  \n\n\n\n\n# JavaScript 问答集\n\n## 测试 1 答案\n\n**Q1 已回答。** 以下哪个会先打印？\n\n```javascript\n\
  setTimeout(() => {\n  console.log('setTimeout wins');\n}, 0);\nqueueMicrotask(()\
  \ => {\n  console.log('queueMicrotask wins');\n});\n```\n\nA) `setTimeout` 胜出  \n\
  B) `queueMicrotask` 胜出  \nC) 编译时错误\n\nQ1 未回答。\n\n**Q2 已回答。** 下面的代码会向控制台输出什么，为什么？\n\
  \n```javascript\nlet x = 10;\nconst byValue = (y) => {\n  y = 20;\n}\nbyValue(x);\n\
  console.log(x);\n```\n\nA) 20  \nB) 10  \nC) 编译时错误\n\n答案是 B。与对象不同，当原始值被传递给函数时，只传递其值，而不是内存位置的引用。因此，对参数的更改只影响函数作用域内的参数。\n\
  \nQ2 未回答。\n\n**Q3 已回答。** 考虑以下代码。它会向控制台输出什么，为什么？\n\n```javascript\nlet x = 5;\nlet\
  \ x = 10;\nconsole.log(x);\n```\n\nA) 5  \nB) 10  \nC) 它会抛出一个编译器错误。\n\n答案是 C。然而，下面的代码可以工作，因为声明的作用域不同（尽管这不是干净的代码）。\n\
  \n```javascript\nlet x = 5;\nif(x){\n  let x = 10;\n  console.log(x);\n}\n```\n\n\
  Q3 未回答。\n\n**Q4 已回答。** 考虑以下代码。每一行输出什么？\n\n```javascript\nconsole.log(new String(\"\
  yes\") === new String(\"yes\")); // 第 1 行\nconsole.log(\"yes\" === \"yes\"); //\
  \ 第 2 行\n```\n\nA) 第 1 行打印 `true`，第 2 行打印 `true`  \nB) 第 1 行打印 `false`，第 2 行打印 `true`\
  \  \nC) 第 1 行打印 `true`，第 2 行打印 `false`  \nD) 第 1 行打印 `false`，第 2 行打印 `false`\n\n\
  答案是 B。第 1 行比较两个对象，发现它们各自是唯一的（字面上不是同一个对象），因此结果为 `false`。即使是 `==` 宽松检查，第 1 行也会得到 `false`。第\
  \ 2 行通过，因为它比较的是两个字符串原始值，而不是字符串对象。\n\nQ4 未回答。\n\n**Q5 已回答。** 下面的代码会向控制台输出什么，为什么？\n\
  \n```javascript\nconst x = new String(\"tricky\");\nconst y = x;\nconsole.log(x\
  \ === y);\n```\n\nA) `true`  \nB) `false`\n\n答案是 A。与上一个问题不同，这里只创建了一个唯一对象，两个常量（`x`\
  \ 和 `y`）指向内存中的这个唯一对象。\n\nQ5 未回答。\n\n**Q6 已回答。** 在 JavaScript 中，数组是对象还是原始值？\n\nA)\
  \ 对象  \nB) 原始值\n\n答案是 A。数组是 JavaScript 中一种特殊的对象。它们拥有其他对象没有的属性，这些属性继承自 `Array.prototype`。\n\
  \nQ6 未回答。\n\n**Q7 已回答。** 下面 `async` 函数的返回类型是什么？\n\n```javascript\nasync function\
  \ goodbye() {\n  return 'goodbye';\n}\n```\n\nA) `string`  \nB) `Promise`  \nC)\
  \ `Async`\n\n答案是 B。`async` 函数返回 Promise。要实际消费 Promise 兑现时返回的值，你需要一个 `.then` 语句，例如\
  \ `goodbye.then((value) => console.log(value));`。\n\nQ7 未回答。\n\n**Q8 已回答。** 判断对错？`await`\
  \ 关键字会阻塞应用中所有 JavaScript 代码的执行，直到等待的 Promise 返回。\n\nA) 正确  \nB) 错误\n\n答案是 B。`await`\
  \ 关键字只阻塞包含 `await` 关键字的特定 `async` 函数内部的代码执行。调用 `await` 所在 async 函数的调用者可以在等待 async\
  \ 函数解析的同时继续执行。这被称为分割执行流。\n\nQ8 未回答。\n\n**Q9 已回答。** 回忆一下，函数在 JavaScript 中是对象。以下代码会打印什么？\n\
  \n```javascript\nfunction myFunc() {}\nconsole.log(typeof myFunc);\n```\n\nA) `object`\
  \  \nB) `function`  \nC) `true`  \nD) 它抛出一个错误\n\n答案是 B。尽管函数在 JavaScript 中确实是对象，但\
  \ `typeof myFunc` 打印的是 “function”。\n\nQ9 未回答。\n\n**Q10 已回答。** 判断对错？以下语法对于打印 ‘goodbye’\
  \ 是有效的。\n\n```javascript\nlet goodbye = async () => { return \"Goodbye\" };\ngoodbye().then(console.log);\
  \ // 第 2 行\n```\n\nA) 正确  \nB) 错误\n\n答案是 A。第 2 行是将 async 函数的返回值传递给回调的一种有效简写。\n\n\
  Q10 未回答。\n\n**Q11 已回答。** 以下哪一项不是 `typeof` 和 `instanceof` 之间的区别？\n\nA) `typeof` 返回一个类型，`instanceof`\
  \ 返回一个布尔值  \nB) `instanceof` 需要 TypeScript，而 `typeof` 不需要  \nC) `typeof` 在右侧接受变量名，而\
  \ `instanceof` 在左侧和右侧都接受值\n\n答案是 B。`typeof` 和 `instanceof` 都不需要 TypeScript，两者都是\
  \ JavaScript 原生的。\n\nQ11 未回答。\n\n**Q12 已回答。** 以下哪个在所有 Promise 都兑现时解析，或者一旦有一个 Promise\
  \ 被拒绝就拒绝？\n\nA) `Promise.race()`  \nB) `Promise.any()`  \nC) `Promise.all()`  \n\
  D) `Promise.resolve()`\n\n答案是 C。如果你希望执行等待所有 Promise 解析（或任何一个失败），`Promise.all()`\
  \ 很有用。此外，以上所有都是有效的 Promise 函数。\n\nQ12 未回答。\n\n**Q13 已回答。** 下面的代码会向控制台输出什么，为什么？\n\
  \n```javascript\nlet x = 10;\nfunction myFunc(y){\n  y = 12;\n}\nmyFunc(x);\nconsole.log(x);\n\
  ```\n\nA) 10  \nB) 12  \nC) `undefined`\n\n答案是 A。原始值是按值传递，而不是按引用传递，因此在函数中“更改它们”不会影响原始变量。\n\
  \nQ13 未回答。\n\n**Q14 已回答。** 下面的代码会向控制台输出什么，为什么？\n\n```javascript\nconsole.log(11\
  \ & 3);\n```\n\nA) 11  \nB) 1  \nC) 2  \nD) 3\n\n答案是 D。`&` 是一个位运算符（与 `&&` 非常不同）。`11\
