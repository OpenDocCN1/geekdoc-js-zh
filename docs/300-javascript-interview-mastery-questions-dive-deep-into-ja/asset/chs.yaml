  D) `setInterval` 在指定时间过后执行一次\n\n答案是 A、B。\n\n### Q51\n判断对错？`setInterval` 的间隔时间包括执行代码所花费的时间。\n\
  A) 正确\nB) 错误\n\n答案是 A。\n\n### Q52\n判断对错？下面的代码可以编译。\n```javascript\nconst array =\
