  A) 作为类方法\nB) 在闭包中\nC) 作为回调\nD) 作为 IIFE（立即调用函数表达式）\n\n答案是 A。\n\n### Q70\n在 Web 浏览器中，布局时间和绘制时间有什么区别？\n\
  布局时间是计算每个要绘制的对象位置所需的时间。绘制时间是实际在屏幕上绘制点所需的时间。\n\n### Q71\n下面的代码会向控制台输出什么，为什么？\n```javascript\n\
