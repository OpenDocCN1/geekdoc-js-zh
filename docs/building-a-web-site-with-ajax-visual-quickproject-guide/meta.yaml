- md: " # make the database\n\n1 On the command line, using the **mysql client**,\
    \ type **CREATE DATABASE ajax**, followed by a **semicolon (;)**, and press Enter\
    \ or Return. If you've accessed MySQL as a user with permission to create databases,\
    \ you'll see a message saying that the query was OK and that one row was affected.\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_21_0.png)\n\n![](img/64cd02e760894ad9ed3dde3e58139569_21_1.png)\n\
    \n2 Type **USE ajax**, followed by a **semicolon**, and press Enter or Return.\n\
    \n# make the database (cont.)\n\n1 If you are using **phpMyAdmin**, type the name\
    \ of the database—I'm using the name **ajax**—in the **Create new database** box,\
    \ and then click **Create**. (You can ignore the Collation menu; see **extra bits**\
    \ on page 9.)\n\n![](img/64cd02e760894ad9ed3dde3e58139569_22_0.png)\n\n![](img/64cd02e760894ad9ed3dde3e58139569_22_1.png)\n\
    \nThe resulting page should show that the database was created.\n\n2 If phpMyAdmin\
    \ did not automatically select the new database for you, use the drop-down menu\
    \ on the left to select it. (phpMyAdmin will likely have already selected that\
    \ database for you.)\n\n![](img/64cd02e760894ad9ed3dde3e58139569_22_2.png)\n\n\
    ## make the tables\n\nIf you are using the command-line mysql client, create the\
    \ tables in the database by running two **CREATE TABLE** commands. (See **extra\
    \ bits** on page 10.)\n\n![](img/64cd02e760894ad9ed3dde3e58139569_23_0.png)\n\n\
    ```\nCREATE TABLE departments (\n  department_id TINYINT UNSIGNED NOT NULL AUTO_INCREMENT\
    \ PRIMARY KEY,\n  department VARCHAR(30) NOT NULL,\n  UNIQUE (department)\n);\n\
    ```\n\n```\nCREATE TABLE employees (\n  employee_id INT UNSIGNED NOT NULL AUTO_INCREMENT\
    \ PRIMARY KEY,\n (OCR 截断遗漏)\n\n- **Access MySQL (p. 2)** The mysql client can\
    \ be tricky. If you have problems, check the MySQL manual, a book on MySQL, or\
    \ this book's support site at **www.dmcinsights.com/ajax/**. Many people find\
    \ phpMyAdmin, also used in this chapter, to be an easier option.\n\n- **Make the\
    \ database (p. 4)** If you're using MySQL on a hosted Web site, your host will\
    \ likely provide you with phpMyAdmin access. They may or may not let you create\
    \ databases, though. If not, just use the database you have already (assuming\
    \ it does not have tables called **departments** and **employees**). A database's\
    \ **collation** refers to the types of language characters the database will support.\
    \ If you don't specify a collation, the MySQL default collation will be used.\
    \ This is normally fine.\n\n- **Make the tables (p. 5)** Both tables are defined\
    \ in a minimalist way. You can add columns if you'd like, but you'll need to change\
    \ the **INSERT** commands (later in the chapter) accordingly. The SQL commands\
    \ in this chapter, and all of the book's code, can be downloaded from **www.dmcinsights.com/ajax/**.\
    \ The **departments** table has a unique index on the **department** column, ensuring\
    \ that each department is listed only once. There is a one-to-many relationship\
    \ between the two tables. Each employee can be in only one department but each\
    \ department can have many employees. This relationship is represented by the\
    \ **department_id** column, which is in both tables. You can create tables in\
    \ phpMyAdmin using either of the SQL text areas as shown in the examples or by\
    \ using the create table prompt. To use the prompt, provide phpMyAdmin with the\
    \ name of the table and the number of fields, and it will create a form where\
    \ you can enter all of the column definitions.\n\n- **Populate the tables (p.\
    \ 7)** The data being inserted isn't important, so long as you populate the tables\
    \ with some information. You can make up your own records or download the SQL\
    \ commands from the book's corresponding Web site at **www.dmcinsights.com/ajax/**.\
    \ The **department_id** value for each employee must correspond to an actual **department_id**\
    \ from the **departments** table.\n\n# 2. browsing employees\n\nThis book's example\
    \ contains three facets: browsing employees by department, adding employees, and\
    \ searching for employees by last name. For each section, we'll create a non-Ajax\
    \ version, and then apply the Ajax elements on top. In this chapter, we'll make\
    \ a non-Ajax way to browse employees. To do so, we'll create **one HTML page**,\
    \ **two PHP scripts**, and a **CSS style sheet**.\n\nThe non-Ajax pages can act\
    \ as a model for how the Ajax layer should behave, and more importantly, if anyone\
    \ accessing this site cannot use the Ajax-enabled pages, the site will still be\
    \ fully functional for them. Also, two of the files generated in this chapter—one\
    \ PHP script and the CSS document—will be used by all of this book's examples,\
    \ Ajax and non-Ajax alike.\n\nYou may find it easiest to follow along by first\
    \ downloading all the code from the book's corresponding Web site (**www.dmcinsights.com/ajax/**).\n\
    \n# what we'll do\n\n- 1. **First, on pages 13-14, we'll create a simple HTML\
    \ form.** The HTML form will have a **drop-down menu listing the departments.**\
    \ These values will match those inserted into the database in Chapter 1, \"creating\
    \ the database.\"\n\n![](img/64cd02e760894ad9ed3dde3e58139569_30_0.png)\n\nWhen\
    \ the user clicks **GO**, the form will be submitted to a PHP script.\n\n- 2.\
    \ **On pages 15-17, the PHP script that handles the HTML form will be written.**\
    \ The **script shows the employees** for the department selected in the HTML form.\
    \ These employees come from the database created in Chapter 1.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_30_1.png)\n\
    \n- 3. **Because the PHP page's results come from a database, a special PHP script\
    \ will be written on pages 18 solely for the purpose of connecting to the database.**\n\
    \n- 4. **On pages 19-20, a very simple style sheet will be made and added to the\
    \ HTML page, giving the Web pages a slightly (but only slightly) more attractive\
    \ appearance.**\n\n- 5. **As a last step, we'll test what we've built to make\
    \ sure it all works.**\n\nAt the end of this chapter, in the **extra bits** section,\
    \ you'll find more information, tips, and recommendations regarding all of these\
    \ steps."
