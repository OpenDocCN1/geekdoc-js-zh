- md: "## handle the XML\n\n**1** The **data** variable now stores the PHP page's\
    \ response as XML data. (See **extra bits** on page 126.)\n\n**2** The **names**\
    \ variable is now an array of every element in the XML data with a tag name of\
    \ **name**. If four names were returned, then **names** would now have four elements\
    \ in it.\n\n```\n...\n    results.removeChild(results.lastChild);\n}\nvar data\
    \ = ajax.responseXML;\nvar names = data.getElementsByTagName('name');\nvar departments\
    \ = data.getElementsByTagName('department');\nvar emails = data.getElementsByTagName('email');\n\
    ```\n\n**3** The **departments** variable is now an array of every element in\
    \ the XML result with a tag name of **department**. Because of the way the PHP\
    \ script generates the XML data, there should be one department for each name.\n\
    \n**4** The **emails** variable is now an array of every element in the XML result\
    \ with a tag name of **email**. Again, there'll be one email address for each\
    \ name.\n\n## display the results\n\nThe results should be displayed like they\
    \ are in the non-Ajax version. This is the generated HTML from that page, which\
    \ should be replicated. (See **extra bits** on page 127.)\n\n```\n<p><span class=\"\
    name\">Gray, Gideon</span><br />\n    <strong>Department</strong>: Accounting<br\
    \ />\n    <a href=\"mailto:g.gray@thiscompany.com\">g.gray@thiscompany.com</a>\n\
    </p>\n<p><span class=\"name\">Green, Laverne</span><br />\n    <strong>Department</strong>:\
    \ Human Resources<br />\n    <a href=\"mailto:l.green@thiscompany.com\">l.green@thiscompany.com</a>\n\
    </p>\n```\n\n1. Before attempting to print the employees, we should confirm that\
    \ some were returned by the PHP page. If at least one employee was returned in\
    \ the XML data, then names will have more than 0 elements in it. You can count\
    \ the number of elements in an array by referring to its length.\n2. We'll need\
    \ a slew of variables to add the values to the DOM.\n\n```\n...\nvar emails =\
    \ data.getElementsByTagName('email');\nif (names.length > 0) {\n  var employee,\
    \ span, name_node, dept_node, dept_label, br, strong, a, email;\n```\n\n3. The\
    \ for loop will access every item in the names array. It counts from 0 (the first\
    \ item in an array is at 0) to one less than the number of items in the array.\
    \ With each iteration of the loop, the counter, i, is incremented.\n\n```\nfor\
    \ (var i = 0; i < names.length; i++) {\n    employee = document.createElement('p');\n\
    ```\n\n4. Each employee returned by the PHP page will be put within an HTML paragraph\
    \ (see the HTML source code on the previous page). So, within the loop, the first\
    \ step is to create a new element of type p. This step adds a paragraph to the\
    \ DOM, although the paragraph doesn't yet have anything in it, nor has it been\
    \ placed on the page.\n\n## handle the name\n\nThe employee's name should be put\
    \ within a **span** whose **class attribute** is **name**. This should be followed\
    \ by a **break**.\n\n```\n<span class=\"name\">Actual Name</span><br />\n```\n\
    \n1. Another element, of type span, is created. (See **extra bits** on page 127.)\n\
    2. The **class attribute** of the span is given a value of **name**. So the text\
    \ put within the span (see the next two steps) will be formatted as a **name**.\n\
    3. A different kind of node, a **text node**, is created. The value of the text\
    \ node (which is to say the actual text) will be the value of the name returned\
    \ in the XML data.\n4. The text node is made a **child** of the span node. Therefore,\
    \ the text node (which is the employee's name) is within the span.\n5. The span\
    \ is attached to the paragraph, created as employee.\n6. A **break** element is\
    \ added to the paragraph so that the pieces to follow will begin on the next line.\n\
    \n```\nemployee = document.createElement('p');\nspan = document.createElement('span');\n\
    span.setAttribute('class', 'name');\nname_node = document.createTextNode(names[i].firstChild.nodeValue);\n\
    span.appendChild(name_node);\nemployee.appendChild(span);\nbr = document.createElement('br');\n\
    employee.appendChild(br);\n```\n\n## handle the department\n\nThe department has\
    \ a little more formatting. It starts with the word **Department** with **strong**\
    \ emphasis, followed by a colon and the actual department. There's another break\
    \ at the end.\n\n```\n<strong>Department</strong>: Department Name<br />\n```\n\
    \n1. Another element, of type **strong**, is created.\n2. A text node with the\
    \ value **Department** is created.\n\n```\n...\nemployee.appendChild(br);\nstrong\
    \ = document.createElement('strong');\ndepartment_label = document.createTextNode('Department');\n\
    strong.appendChild(department_label);\nemployee.appendChild(strong);\n```\n\n\
    3. The text node is made a child of the **strong** node. This places the text\
    \ **Department** between the strong tags.\n4. Another text node is generated,\
    \ with a value of the **colon**, followed by a **space**, followed by the **name\
    \ of the department** from the XML data.\n5. This latest text node is attached\
    \ to the paragraph, which is **employee**.\n\n```\ndept_node = document.createTextNode(':\
    \ ' +\ndepartments[i].firstChild.nodeValue);\nemployee.appendChild(dept_node);\n\
    br = document.createElement('br');\nemployee.appendChild(br);\n```\n\n6. A **break**\
    \ element is added to the paragraph so that the pieces to follow will begin on\
    \ the next line.\n\n118\nenabling an Ajax search\n\n## handle the email\n\nThe\
    \ email address is tricky because it should be linked so that clicking on the\
    \ email address creates an email to that person.\n\n```\n<a href=\"mailto:address@example.com\"\
    >address@example.com</a>\n```\n\n1. Another element, of type **a**, is created.\
    \ This type of element is for any link.\n2. The **href attribute** of the **a**\
    \ element is given a value of **mailto:** plus the person's email address from\
    \ the XML data.\n\n```\n... \n    employee.appendChild(br);\n    a = document.createElement('a');\n\
    \    a.setAttribute('href', 'mailto:' + emails[i].firstChild.nodeValue);\n```\n\
    \n3. A text node is created with a value of the employee's email address from\
    \ the XML data.\n4. The text node is made a **child** of the **a** node. Therefore,\
    \ the text node (which is the employee's email address) is within the **a**.\n\
    \n```\nemail = document.createTextNode(emails[i].firstChild.nodeValue);\na.appendChild(email);\n\
    \nemployee.appendChild(a);\nresults.appendChild(employee);\n} // End of FOR loop.\n\
    ```\n\n5. The **a** element is attached to the paragraph.\n6. The entire paragraph,\
    \ which represents all of the employee's data, is made a child of the **results**\
    \ DIV. (See **extra bits** on page 128.)\n\n## display no results\n\nIf the PHP\
    \ page returned no results, a message should be displayed saying as much.\n\n\
    ![](img/64cd02e760894ad9ed3dde3e58139569_139_0.png)\n\n1. A new element of type\
    \ **p** is created.\n2. The **class attribute** of the paragraph is given a value\
    \ of **error**.\n3. A text node is created with a value of No employees were a\
    \ match.\n4. The text node is made a **child** of the paragraph node.\n5. The\
    \ paragraph is made a child of the **results DIV**, thereby putting the paragraph\
    \ onto the page.\n\n```\n...\n} // End of FOR loop.\n} else { // No employees,\
    \ print a message.\nvar node1 = document.createElement('p');\nnode1.setAttribute('class',\
    \ 'error');\nvar node2 = document.createTextNode('No employees were a match.');\n\
    node1.appendChild(node2);\nresults.appendChild(node1);\n}\n```\n\n## complete\
    \ the function\n\nIf we didn't get a valid status code back from the Ajax request,\
    \ we should formally submit the form to the handling PHP page (as if the Ajax\
    \ layer didn't exist at all).\n\n```\n...\n    results.appendChild(node1);\n}\n\
    } else { // Bad status code, submit the form.\n    document.getElementById('search_form').submit();\n\
    }\n} // End of readyState IF.\n} // End of handleResponse() function.\n```\n\n\
    ## test the Ajax layer\n\n1. Load the **HTML page** in your Web browser. The address\
    \ **must begin with** http:// for this to work.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_141_0.png)\n\
    \n2. Enter a letter or two and click **GO**.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_141_1.png)\n\
    \n3. The HTML page should show the results without reloading the page or going\
    \ to a new page.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_141_2.png)\n\n4.\
    \ Enter invalid letters and click **GO** to see the result if no employees in\
    \ the database matched the search term.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_141_3.png)"
  mdcn: "\n## 处理 XML\n\n**1** **data** 变量现在存储了 PHP 页面的响应，即 XML 格式的数据。（参见第 126 页的**补充信息**。）\n\
    \n**2** **names** 变量现在是一个数组，包含了 XML 数据中所有标签名为 **name** 的元素。如果返回了四个名字，那么 **names**\
    \ 数组中现在就会有四个元素。\n\n```\n...\n    results.removeChild(results.lastChild);\n}\n\
    var data = ajax.responseXML;\nvar names = data.getElementsByTagName('name');\n\
    var departments = data.getElementsByTagName('department');\nvar emails = data.getElementsByTagName('email');\n\
    ```\n\n**3** **departments** 变量现在是一个数组，包含了 XML 结果中所有标签名为 **department** 的元素。由于\
    \ PHP 脚本生成 XML 数据的方式，应该每个名字都对应一个部门。\n\n**4** **emails** 变量现在是一个数组，包含了 XML 结果中所有标签名为\
    \ **email** 的元素。同样，每个名字都对应一个电子邮件地址。\n\n## 显示结果\n\n结果显示方式应与非 Ajax 版本相同。这是来自该页面的生成\
    \ HTML，需要复制其结构。（参见第 127 页的**补充信息**。）\n\n```\n<p><span class=\"name\">Gray, Gideon</span><br\
    \ />\n    <strong>Department</strong>: Accounting<br />\n    <a href=\"mailto:g.gray@thiscompany.com\"\
    >g.gray@thiscompany.com</a>\n</p>\n<p><span class=\"name\">Green, Laverne</span><br\
    \ />\n    <strong>Department</strong>: Human Resources<br />\n    <a href=\"mailto:l.green@thiscompany.com\"\
    >l.green@thiscompany.com</a>\n</p>\n```\n\n1. 在尝试打印员工信息之前，我们应该确认 PHP 页面确实返回了数据。如果\
    \ XML 数据中至少返回了一个员工，那么 **names** 数组中的元素数量就会大于 0。你可以通过引用数组的 **length** 属性来计算其元素数量。\n\
    2. 我们需要一系列变量来将这些值添加到 DOM 中。\n\n```\n...\nvar emails = data.getElementsByTagName('email');\n\
    if (names.length > 0) {\n  var employee, span, name_node, dept_node, dept_label,\
    \ br, strong, a, email;\n```\n\n3. **for** 循环将访问 **names** 数组中的每一项。它从 0（数组中的第一项索引为\
    \ 0）开始计数，直到数组项数减一。每次循环迭代，计数器 **i** 都会递增。\n\n```\nfor (var i = 0; i < names.length;\
    \ i++) {\n    employee = document.createElement('p');\n```\n\n4. PHP 页面返回的每个员工将被放入一个\
    \ HTML 段落中（参见上一页的 HTML 源代码）。因此，在循环内部，第一步是创建一个类型为 **p** 的新元素。此步骤会向 DOM 中添加一个段落，尽管该段落目前还没有任何内容，也尚未放置到页面上。\n\
    \n## 处理姓名\n\n员工的姓名应放在一个 **class** 属性为 **name** 的 **span** 元素内。其后应跟一个 **换行符**。\n\
    \n```\n<span class=\"name\">Actual Name</span><br />\n```\n\n1. 创建一个类型为 **span**\
    \ 的新元素。（参见第 127 页的**补充信息**。）\n2. 为该 **span** 的 **class 属性** 赋值为 **name**。因此，放在\
    \ span 内的文本（见接下来的两个步骤）将被格式化为 **name** 样式。\n3. 创建一个不同类型的节点，即一个 **文本节点**。文本节点的值（也就是实际的文本）将是\
    \ XML 数据中返回的 **name** 的值。\n4. 该文本节点成为 span 节点的 **子节点**。因此，文本节点（即员工的姓名）就位于 span\
    \ 内部。\n5. 将 span 附加到作为 employee 的段落上。\n6. 向段落添加一个 **换行符** 元素，以便后续内容将从下一行开始。\n\n\
    ```\nemployee = document.createElement('p');\nspan = document.createElement('span');\n\
    span.setAttribute('class', 'name');\nname_node = document.createTextNode(names[i].firstChild.nodeValue);\n\
    span.appendChild(name_node);\nemployee.appendChild(span);\nbr = document.createElement('br');\n\
    employee.appendChild(br);\n```\n\n## 处理部门\n\n部门的格式稍复杂一些。它以加粗强调的单词 **Department**\
    \ 开始，后跟一个冒号和实际的部门名称。最后还有一个换行符。\n\n```\n<strong>Department</strong>: Department\
    \ Name<br />\n```\n\n1. 创建一个类型为 **strong** 的新元素。\n2. 创建一个值为 **Department** 的文本节点。\n\
    \n```\n...\nemployee.appendChild(br);\nstrong = document.createElement('strong');\n\
    department_label = document.createTextNode('Department');\nstrong.appendChild(department_label);\n\
    employee.appendChild(strong);\n```\n\n3. 该文本节点成为 **strong** 节点的子节点。这将文本 **Department**\
    \ 放置在 strong 标签之间。\n4. 生成另一个文本节点，其值为 **冒号**，后跟一个 **空格**，再后跟来自 XML 数据的 **部门名称**。\n\
    5. 将这个最新的文本节点附加到段落上，即 **employee**。\n\n```\ndept_node = document.createTextNode(':\
    \ ' +\ndepartments[i].firstChild.nodeValue);\nemployee.appendChild(dept_node);\n\
    br = document.createElement('br');\nemployee.appendChild(br);\n```\n\n6. 向段落添加一个\
    \ **换行符** 元素，以便后续内容将从下一行开始。\n\n## 处理电子邮件\n\n电子邮件地址的处理比较复杂，因为它应该是一个链接，这样点击电子邮件地址就能为该人创建邮件。\n\
    \n```\n<a href=\"mailto:address@example.com\">address@example.com</a>\n```\n\n\
    1. 创建一个类型为 **a** 的新元素。这种元素类型用于任何链接。\n2. 为 **a** 元素的 **href 属性** 赋值为 **mailto:**\
    \ 加上来自 XML 数据的该人员的电子邮件地址。\n\n```\n... \n    employee.appendChild(br);\n    a =\
    \ document.createElement('a');\n    a.setAttribute('href', 'mailto:' + emails[i].firstChild.nodeValue);\n\
    ```\n\n3. 创建一个文本节点，其值为来自 XML 数据的员工电子邮件地址。\n4. 该文本节点成为 **a** 节点的 **子节点**。因此，文本节点（即员工的电子邮件地址）就位于\
    \ **a** 元素内部。\n\n```\nemail = document.createTextNode(emails[i].firstChild.nodeValue);\n\
    a.appendChild(email);\n\nemployee.appendChild(a);\nresults.appendChild(employee);\n\
    } // End of FOR loop.\n```\n\n5. 将 **a** 元素附加到段落上。\n6. 代表所有员工数据的整个段落成为 **results**\
    \ DIV 的子节点。（参见第 128 页的**补充信息**。）\n\n## 显示无结果\n\n如果 PHP 页面没有返回结果，应该显示一条相应的消息。\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_139_0.png)\n\n1. 创建一个类型为 **p** 的新元素。\n\
    2. 为段落的 **class 属性** 赋值为 **error**。\n3. 创建一个值为“未找到匹配的员工”的文本节点。\n4. 该文本节点成为段落节点的\
    \ **子节点**。\n5. 该段落成为 **results DIV** 的子节点，从而将其放置到页面上。\n\n```\n...\n} // End of\
    \ FOR loop.\n} else { // No employees, print a message.\nvar node1 = document.createElement('p');\n\
    node1.setAttribute('class', 'error');\nvar node2 = document.createTextNode('No\
    \ employees were a match.');\nnode1.appendChild(node2);\nresults.appendChild(node1);\n\
    }\n```\n\n## 完成函数\n\n如果我们没有从 Ajax 请求中收到有效的状态码，我们应该正式将表单提交到处理页面的 PHP 脚本（就好像 Ajax\
    \ 层根本不存在一样）。\n\n```\n...\n    results.appendChild(node1);\n}\n} else { // Bad\
    \ status code, submit the form.\n    document.getElementById('search_form').submit();\n\
    }\n} // End of readyState IF.\n} // End of handleResponse() function.\n```\n\n\
    ## 测试 Ajax 层\n\n1. 在你的 Web 浏览器中加载 **HTML 页面**。地址**必须以** http:// 开头才能正常工作。\n\n\
    ![](img/64cd02e760894ad9ed3dde3e58139569_141_0.png)\n\n2. 输入一两个字母，然后点击 **GO**。\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_141_1.png)\n\n3. HTML 页面应显示结果，而无需重新加载页面或跳转到新页面。\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_141_2.png)\n\n4. 输入无效的字母并点击 **GO**，查看当数据库中没有员工匹配搜索词时的结果。\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_141_3.png)\n"
