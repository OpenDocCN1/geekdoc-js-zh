    \ 7 章“启用 Ajax 搜索”中看到这一点。\n\n## 测试 Ajax 层 第38页\n\n- 调试 Ajax 应用程序可能特别棘手，因为涉及的技术太多：HTML、DOM、CSS、JavaScript、PHP、SQL\
