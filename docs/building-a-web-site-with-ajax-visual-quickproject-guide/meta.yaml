    3. The HTML page should show the results without reloading the page or going to
    a new page.


    ![](img/64cd02e760894ad9ed3dde3e58139569_141_2.png)


    4. Enter invalid letters and click **GO** to see the result if no employees in
    the database matched the search term.


    ![](img/64cd02e760894ad9ed3dde3e58139569_141_3.png)'
- md: '# extra bits


    # what we''ll do **p. 100**


    - In this example, I suggest that users enter only a couple of letters because
    the database has only 20 records in it. With the employees entered in chapter
    1, “creating the database,” **Gr** will return two records but **Gre** only one.
    If your database had more names in it, entering longer values would be appropriate.


    # add the Ajax elements **p. 102**


    - The **ajax.js** file, written in chapter 3, “browsing using Ajax,” defines a
    function that returns a **browser-specific XMLHttpRequest object**. This file
    is needed by any page that performs any Ajax operations.

    - Because the **DIV**, where the results will be reported, has an **id value of
    results**, it’ll be formatted according to the rules dictated in **style.css**.
    This is the same as the **results DIV in dept_form.html** and in **add_employee.html**.
    For starters, the **DIV** will be invisible when the page is first viewed.


    # apply the Ajax layer **p. 103**


    - Most of this code is exactly like that in **dept.js** and **add_employee.js**.
    The big difference at first is the name of the form being referenced. It’s in
    the rest of the code—what should be done when the form is submitted—that the big
    differences can be found.


    # set up the Ajax **p. 105**


    - The **encodeURIComponent()** function makes it safe to pass in the URL whatever
    value the user entered in the form.

    - By passing the form data in the URL, we ensure that the Ajax request will be
    made to **search_results_xml.php?last_name=XXX**, where **XXX** represents what
    the user typed in the text box.


    enabling an Ajax search


    # prepare for XML


    - The PHP script sends its response as XML data, not as a normal Web page. Everything
    PHP will print will be part of this XML and there will be no HTML output.

    - The XML data being created is really like the data in an HTML page, where there''s
    one root element and any number of nested subelements. For this example, the root
    element will be called **employees** and there will be zero or more subelements
    called **employee**.

    - If the PHP page does not use the header() function to set the Content-Type,
    the JavaScript that receives this response will not recognize it as XML.


    # query the database


    - To debug any PHP-MySQL problems, you''ll need to **print out the query** to
    inspect its syntax. You should also invoke the **mysql_error()** function to see
    what problems the database reports.

    - A useful debugging technique when working with XML data is to verify that your
    PHP script is returning valid XML. To see the result of the PHP page, either use
    JavaScript to access **ajax.responseText** (in the **handleResponse()** function)
    or submit your form to the PHP page directly (without using JavaScript).

    - For directly viewing XML in your Web browser, you''ll want to use a browser
    that supports the format. At the time of this writing, this includes recent versions
    of Internet Explorer and Firefox, but not Safari.


    enabling an Ajax search


    # extra bits (cont.)


    ## handle the response p. 111


    - In the **init()** function, we tell the JavaScript to call a function called
    **handleResponse()** whenever the **readyState** value changes. This value will
    change multiple times during an Ajax request, so this function will be called
    multiple times.

    - The XMLHttpRequest **status** attribute stores the **HTTP status code** returned
    by the server-side page. There are dozens of status codes from **200**, meaning
    that everything was OK, to values over 500, which are normally server errors.
    A status code of **304** indicates that the page was found but had not been modified
    since a certain date and time.


    ## prepare the page p. 112


    - The new trick in this specific example is the use of **nodes** as the way of
    manipulating the page''s content. If you think of the Document Object Model as
    a tree, then a node is a branch on that tree; each branch has a parent (which
    is either another branch or the tree trunk) and some have children (more branches).
    To place content on the page, we''ll add branches to the **results** section.
    So to prepare the page for the XML data, we need to clear out any existing nodes
    in **results**. We do so by applying the **removeChild()** function to **results**,
    removing the last node, until there are no more nodes left.


    ## handle the XML p. 113


    - The server''s response is available in two attributes of the XMLHttpRequest
    object. It can be found as plain text in **responseText** or as XML data in **responseXML**.

    - The XML data can be accessed just like elements on an HTML page, using the Document
    Object Model. So **data.getElementsByTagName(''name'')** refers to every item
    in the XML data with a name of **name**.


    # display the results p. 114


    - This example, which uses both nodes in the DOM and XML data from PHP, is the
    most complicated in the book. The idea is simple, though: take the HTML code generated
    by the non-Ajax PHP script and duplicate it using Ajax. So everything in the last
    half of this chapter is just a matter of using nodes, the DOM, and XML to end
    that.

    - So many JavaScript variables are declared because creating nodes in the DOM
    is a multi-step process, as you''ll see in this chapter. And since each employee''s
    record has multiple elements—**one paragraph, one span, two breaks, one a link,
    one strong**, plus three pieces of text (the name, the department, and the email
    address)—it''ll be easiest to follow using many different variables.

    - The syntax of the `for` loop is a common way to access every item found in an
    array. Within the loop, the specific array item is accessed via `arrayname[i]`.

    - The `createElement()` function is the most important for adding nodes to the
    DOM. It makes the element, but you then have to add it to the page using `appendChild()`.


    # handle the name p. 116


    - The `setAttribute()` function takes two arguments: the name of the attribute
    to set and the value it should be given.

    - To get the values from the XML data, refer to `arrayname[i].firstChild.nodeValue`.
    The `arrayname[i]` refers to a specific element in the array; `firstChild` refers
    to the first branch of that element (which we know is the only node each element
    has); and `nodeValue` refers to the actual content found there (which is the text).

    - The `appendChild()` function adds the element in parentheses to the element
    named before the period.


    # extra bits (cont.)


    ## handle the email p. 120


    - It isn''t until the **employee** element, with all its subelements (or nodes),
    is appended to the **results DIV** that the employee data will appear on the HTML
    page.

    - If the PHP script returns five employee records, then the **results DIV** will
    end up having five child nodes. Each of these nodes will be a paragraph element,
    within which are the **span** for the name, the **strong** element and other department
    text, the **a** element for the email address, and the two breaks.


    # appendix


    # where to go from here


    This book provides all the code and knowledge required to add Ajax functionality
    to a Web site. But, as with most things, there''s a lot more to be learned. This
    appendix will steer you in other useful directions and provide the occasional
    code snippet as alternatives to the code used elsewhere in the book.


    # Ajax issues


    Ajax is a wonderful technology that can greatly enhance a user''s Web experience,
    but it''s not perfect. In particular, you should be aware of the following limitations:


    1. If a user''s browser does not **support JavaScript**, Ajax is useless. (See
    **extra bits** on page 146.)

    2. The results of Ajax-enabled pages **cannot be bookmarked** without taking extra
    steps.

    3. The user **cannot use the back button or** their browser''s **history** to
    review previous results (again without taking extra steps).

    4. **Search engines** cannot index Ajax pages.

    5. Ajax applications can be more **demanding of the browser**.

    6. Because Ajax pages change the standard client-server relationship, their use
    may be **confusing for the end user**.

    7. Ajax requires that the user **be online** the entire time.'
  mdcn: '

    # 补充内容


    # 我们将要做什么 **第 100 页**


    - 在这个示例中，我建议用户只输入几个字母，因为数据库中只有 20 条记录。在第 1 章"创建数据库"中录入的员工信息基础上，输入 **Gr** 会返回两条记录，而
    **Gre** 只会返回一条。如果你的数据库中有更多姓名，输入更长的值会更合适。


    # 添加 Ajax 元素 **第 102 页**


    - 第 3 章"使用 Ajax 进行浏览"中编写的 **ajax.js** 文件定义了一个返回**特定浏览器的 XMLHttpRequest 对象**的函数。任何执行
    Ajax 操作的页面都需要此文件。

    - 由于用于显示结果的 **DIV** 的 **id 值为 results**，它将根据 **style.css** 中定义的规则进行格式化。这与 **dept_form.html**
    和 **add_employee.html** 中的 **results DIV** 相同。首先，当页面首次加载时，该 **DIV** 将是不可见的。


    # 应用 Ajax 层 **第 103 页**


    - 这段代码的大部分内容与 **dept.js** 和 **add_employee.js** 中的代码完全相同。起初最大的区别在于被引用的表单名称。真正的重大差异存在于其余代码中——即当表单提交时应该执行的操作。


    # 设置 Ajax **第 105 页**


    - **encodeURIComponent()** 函数使得在 URL 中传递用户在表单中输入的任何值变得安全。

    - 通过在 URL 中传递表单数据，我们确保 Ajax 请求将发送到 **search_results_xml.php?last_name=XXX**，其中
    **XXX** 代表用户在文本框中输入的内容。


    启用 Ajax 搜索


    # 准备 XML


    - PHP 脚本以 XML 数据而非普通网页的形式发送其响应。PHP 输出的所有内容都将成为该 XML 的一部分，不会有 HTML 输出。

    - 创建的 XML 数据实际上类似于 HTML 页面中的数据，有一个根元素和任意数量的嵌套子元素。在本示例中，根元素将被称为 **employees**，并且会有零个或多个名为
    **employee** 的子元素。

    - 如果 PHP 页面未使用 header() 函数设置 Content-Type，接收到此响应的 JavaScript 将无法将其识别为 XML。


    # 查询数据库


    - 要调试任何 PHP-MySQL 问题，你需要**打印出查询语句**以检查其语法。你还应该调用 **mysql_error()** 函数来查看数据库报告的错误。

    - 处理 XML 数据时一个有用的调试技巧是验证你的 PHP 脚本是否返回了有效的 XML。要查看 PHP 页面的结果，可以使用 JavaScript 访问
    **ajax.responseText**（在 **handleResponse()** 函数中），或者直接将表单提交到 PHP 页面（不使用 JavaScript）。

    - 要在网页浏览器中直接查看 XML，你需要使用支持该格式的浏览器。在撰写本文时，这包括 Internet Explorer 和 Firefox 的较新版本，但不包括
    Safari。


    启用 Ajax 搜索


    # 补充内容（续）


    ## 处理响应 第 111 页


    - 在 **init()** 函数中，我们让 JavaScript 在 **readyState** 值发生变化时调用一个名为 **handleResponse()**
    的函数。此值在 Ajax 请求期间会发生多次变化，因此该函数将被多次调用。

    - XMLHttpRequest 的 **status** 属性存储服务器端页面返回的 **HTTP 状态码**。状态码有几十种，从表示一切正常的 **200**
    到超过 500 的值（通常是服务器错误）。状态码 **304** 表示页面已找到但自某个日期和时间以来未被修改。


    ## 准备页面 第 112 页


    - 这个特定示例中的新技巧是使用**节点**作为操作页面内容的方式。如果你将文档对象模型想象为一棵树，那么节点就是那棵树上的一个分支；每个分支都有一个父级（可以是另一个分支或树干），有些分支还有子级（更多的分支）。要将内容放置在页面上，我们需要向
    **results** 部分添加分支。因此，为了将页面准备好接收 XML 数据，我们需要清除 **results** 中所有现有的节点。我们通过对 **results**
    应用 **removeChild()** 函数，逐个移除最后一个节点，直到没有剩余节点为止。


    ## 处理 XML 第 113 页


    - 服务器的响应在 XMLHttpRequest 对象的两个属性中可用。它可以在 **responseText** 中以纯文本形式找到，也可以在 **responseXML**
    中以 XML 数据形式找到。

    - XML 数据可以像 HTML 页面上的元素一样，使用文档对象模型进行访问。因此 **data.getElementsByTagName(''name'')**
    指的是 XML 数据中每个名为 **name** 的项。


    # 显示结果 第 114 页


    - 这个示例同时使用了 DOM 中的节点和来自 PHP 的 XML 数据，是本书中最复杂的示例。但其思路很简单：获取非 Ajax PHP 脚本生成的 HTML
    代码，然后使用 Ajax 来复制它。因此，本章后半部分的所有内容都只是使用节点、DOM 和 XML 来实现这一目标。

    - 声明了如此多的 JavaScript 变量，是因为在 DOM 中创建节点是一个多步骤的过程，你将在本章中看到。而且由于每位员工的记录包含多个元素——**一个段落、一个
    span、两个换行、一个链接、一个 strong**，加上三段文本（姓名、部门和电子邮件地址）——使用多个不同的变量会最容易跟踪。

    - `for` 循环的语法是访问数组中每个元素的常见方式。在循环内部，通过 `arrayname[i]` 访问特定的数组元素。

    - `createElement()` 函数是向 DOM 添加节点最重要的函数。它创建元素，但之后你必须使用 `appendChild()` 将其添加到页面中。


    # 处理姓名 第 116 页


    - `setAttribute()` 函数接受两个参数：要设置的属性名称和应赋予的值。

    - 要从 XML 数据中获取值，请引用 `arrayname[i].firstChild.nodeValue`。`arrayname[i]` 指的是数组中的特定元素；`firstChild`
    指的是该元素的第一个分支（我们知道这是每个元素唯一拥有的节点）；`nodeValue` 指的是在其中找到的实际内容（即文本）。

    - `appendChild()` 函数将括号中的元素添加到点号前面命名的元素中。


    # 补充内容（续）


    ## 处理电子邮件 第 120 页


    - 直到 **employee** 元素及其所有子元素（或节点）被添加到 **results DIV** 中，员工数据才会出现在 HTML 页面上。

    - 如果 PHP 脚本返回五条员工记录，那么 **results DIV** 最终将包含五个子节点。每个节点都是一个段落元素，其中包含姓名的 **span**、**strong**
    元素和其他部门文本、电子邮件地址的 **a** 元素以及两个换行符。


    # 附录


    # 接下来该往哪里走


    本书提供了将 Ajax 功能添加到网站所需的所有代码和知识。但是，与大多数事物一样，还有很多东西需要学习。本附录将引导你了解其他有用的方向，并不时提供代码片段作为本书其他地方所用代码的替代方案。


    # Ajax 的问题


    Ajax 是一项出色的技术，可以极大地增强用户的网页体验，但它并不完美。具体来说，你应该了解以下局限性：


    1. 如果用户的浏览器不**支持 JavaScript**，Ajax 将毫无用处。（参见第 146 页的**补充内容**。）

    2. 启用 Ajax 的页面的结果**无法被收藏**，除非采取额外步骤。

    3. 用户**无法使用后退按钮或**浏览器的**历史记录**来查看之前的结果（同样需要额外步骤）。

    4. **搜索引擎**无法索引 Ajax 页面。

    5. Ajax 应用可能对浏览器有更高的**要求**。

    6. 由于 Ajax 页面改变了标准的客户端-服务器关系，它们的使用可能会**让最终用户感到困惑**。

    7. Ajax 要求用户全程**保持在线**。

    '
