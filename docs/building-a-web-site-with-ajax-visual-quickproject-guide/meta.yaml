  - '[PAGE 58]


    # extra bits (cont.)


    +   **call the function** p. 29

    - The **window.onload** property tells the JavaScript the name of the function
    to call once the page has completely loaded. In this case that''s **init**, short
    for **initialize** (i.e., set things up).

    - The benefit of calling the initialization function in this way (rather than
    just calling it directly) is that the downloading and drawing of the page in the
    Web browser won''t have to wait for the JavaScript to do its thing. In a slight
    way, this makes for a better user experience.


    +   **set up the Ajax** p. 30

    - The JavaScript refers to the **Document Object Model** to access elements in
    the HTML page. The DOM is a map of every item in a browser document. It can be
    used and manipulated in limitless ways.

    - The **getElementById()** function allows you to access a DOM element by referring
    to its **ID** value. So a form with an ID of **dept_form** can be accessed via
    **document.getElementById(''dept_form'')**.

    - Remember that the **ajax** variable is an object of **XMLHttpRequest** type.
    One of its functions is **open()**. Provide this function with the name of the
    page where the request should be sent and the method that should be used.


    +   - Because the PHP script that handles the request expects to receive a department
    ID in the URL, the value selected in the HTML form must be passed along with the
    request. You can access that value using the DOM.

    - The **encodeURIComponent()** function ensures that the selected form value is
    safe to send in a URL.

    - In this JavaScript code there are **two anonymous functions**. These are functions
    not given a name when defined. Anonymous functions are used when it''s necessary
    to encapsulate a chunk of code but it''s not necessary to call that code like
    a standard function.

    - The XMLHttpRequest **readyState** value stores the current Ajax transaction
    state, on a scale from 0 to 4. The most important of these is 4, which means that
    the transaction is complete.'
  - '[PAGE 59]


    # print the employees p. 33


    This PHP script is almost exactly like `dept_results.php` from Chapter 2. The
    main difference is that it does not include the opening and closing `<html>`,
    `<head>`, and `<body>` tags, nor does it include most of the stuff that goes within
    those tags. The reason why is that all of this page''s results will be inserted
    into the HTML page via JavaScript. That page already has the proper HTML tags.


    # handle the response p. 35


    +   - In the `init()` function, we tell the JavaScript to call a function called
    `handleResponse()` whenever the `readyState` value changes. This value will change
    multiple times during an Ajax request, so this function will be called multiple
    times.

    - The **`XMLHttpRequest` status attribute** stores the **HTTP status code** returned
    by the server-side page. There are dozens of status codes from **200**, meaning
    that everything was OK, to values over 500, which are normally server errors.
    A status code of **304** indicates that the page was found but had not been modified
    since a certain date and time.


    For the purposes of these examples, we''ll assume it means the response was fine.


    +   - By referring to the Document Object Model, we can forcibly submit the form.
    The `document.getElementById(''dept_form'')` code refers to the form (which has
    an `id` value of `dept_form`). The `.submit()` part of the code submits it.


    # display the results p. 36


    +   - Once again, the Document Object Model allows you to easily access individual
    elements in a page. The code `document.getElementById(''results'')` refers to
    a `div` in the HTML page that has an `id` of `results`.

    - The Cascading Style Sheet `style.css` sets the **`display` attribute** of items
    with an `id` of **`results`** to **`none`**. The net effect will be that such
    elements are not visible when a page is first loaded. This is desired because
    such items have a solid green border around them and it''d be distracting to see
    that prior to actually retrieving the results.


    browsing using Ajax 41'
  - '[PAGE 60]


    # # extra bits (cont.)


    +   - The process of hiding, then showing the results area using CSS and JavaScript
    is intended to make it more obvious when the HTML page is updated.

    - Referring to an element''s **innerHTML** value is a quick way to place new text
    on a page. An alternative is to add **nodes** to the DOM. You''ll see this in
    Chapter 7, "enabling an Ajax search."


    # ## test the Ajax layer p. 38


    +   - Debugging Ajax applications can be particularly tricky because there are
    so many technologies involved: HTML, DOM, CSS, JavaScript, PHP, SQL, and MySQL.
    See Appendix A, "where to go from here," for debugging tips.

    - You''ll want to test any Ajax application in as many Web browsers on as many
    operating systems as possible. By knowing how the application behaves under multiple
    settings, you do your best to avoid exluding any users.

    - Firefox is, in my opinion, the best browser to test Ajax applications in. It
    has a JavaScript console that opens in another window for displaying JavaScript
    errors. This alone can be a great help.'
