    \ or have command-line access to your server, **log into the mysql client**. You'll\
    \ need to **enter a username and password combination**. These values must already\
    \ be established in MySQL in order to work. (See **extra bits** on page 9.)\n\n\
    ```\n>: /usr/local/mysql/bin/mysql -u root -p\nEnter password:\nWelcome to the\
    \ MySQL monitor.  Commands end with ; or \\g.\nYour MySQL connection id is 81\
    \ to server version: 5.0.21-max\n\nType 'help;' or '\\h' for help. Type '\\c'\
    \ to clear the buffer.\n\nmysql> \n```\n\n![](img/64cd02e760894ad9ed3dde3e58139569_20_0.png)\n\
    \nIf you're running MySQL on a remote server, or you just prefer not to go command-line,\
    \ **use phpMyAdmin in a Web browser**. It must already be preconfigured to access\
