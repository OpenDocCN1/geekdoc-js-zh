    +   ## query the database p. 93

    - This is the most complicated query in the book. It performs a **JOIN** across
    two tables: **employees** and **departments**, which are linked through the **department_id**
    columns. The search feature is possible thanks to a **LIKE** clause, asking for
    records where the employee''s last name begins with whatever letters were entered
    in the form.

