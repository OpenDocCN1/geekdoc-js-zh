  mdcn: "\n## 调试 JavaScript（续）\n\n3.  **DOM 检查器**：由于大多数 Ajax 应用程序会动态更改页面内容，因此仅查看页面源代码将无济于事。相反，应使用\
    \ DOM 检查器来查看修改后的页面内容。Firefox 内置了一个检查器（在 Windows 上，您需要自定义安装 Firefox 才能添加该检查器）。您也可以找到并安装适用于\
    \ Internet Explorer 和 Safari 的 DOM 检查器，但既然 Firefox 已经自带了，又何必多此一举呢？\n\n![](img/64cd02e760894ad9ed3dde3e58139569_162_0.png)\n\
    \n4.  **Venkman JavaScript 调试器** (www.mozilla.org/projects/venkman)：这是一个功能强大的\
    \ JavaScript 调试器，可通过 Firefox 使用。\n5.  **JSLint** (www.jslint.com)：此程序对 JavaScript\
    \ 执行基本语法检查。只需将您的 JavaScript 代码粘贴到 JSLint 网站上的框中，然后单击 JSLint 按钮即可。\n6.  **Firebug**\
    \ (www.getfirebug.com)：这个 Firefox 扩展提供了丰富的调试工具，涵盖 HTML、CSS、JavaScript 和 DOM。\n\
    7.  **Firefox Firefox Firefox**：如果从这个列表中还不清楚（Firefox 被单独提及了四次），那么很明显，Firefox 是调试\
    \ Ajax 应用程序的最佳浏览器（它甚至可能是最好的浏览器）。您需要在其他浏览器上测试您的 Ajax 脚本以验证支持，但就调试而言，请优先使用 Firefox！\n\
    \n## 额外说明\n\n### Ajax 问题 第 130 页\n\n- 使用本书中的代码，无论用户的浏览器是否支持 Ajax，每个示例都能正常工作。示例都是特意这样设计的，这样即使友好的\
    \ Ajax 层不起作用，用户也不会被落下。您应该尽可能保持这种做法。\n- Ajax 页面无法被添加书签、记录在浏览器历史记录中，或列在搜索引擎中，因为更改不会反映在\
    \ URL 中。通过采取一些额外步骤，有可能克服其中一些限制。请搜索网络查找相关技术。\n- 当某事正在发生或已经发生时，向用户提供明显的提示非常重要。在本书中，我对\
    \ Ajax 结果使用了明显的格式设置，以使更改显而易见。\n\n### 介绍 JSON 第 132-133 页\n\n- 使用 JSON 最大的担忧是它涉及一些**安全风险**。**eval()**\
    \ 函数实际上是将接收到的文本作为 JavaScript 代码运行，这意味着如果数据可以被操纵，Ajax 过程可能会被黑客攻击。请搜索网络以获取有关此主题的更多信息以及可能的防护措施。\n\
    - JSON 的另一个问题是语法**非常、非常严格**，比 XML 严格得多。使用库来创建 JSON 数据将获得更可靠的结果。\n\n### 发送 JSON\
    \ 第 134-135 页\n\n- 与其尝试以编程方式创建精确的 JSON 语法，我认为最好使用一个可以为您完成此操作的外部库。在此脚本中，我利用了 **PECL\
    \ JSON** 类（必须安装；参见 **http://pecl.php.net**——从 PHP 5.2 起默认启用）。\n- 或者，参阅官方 JSON\
    \ 网站 (**www.json.org**) 获取可包含的 PHP 库，这些库可以执行将数组转换为 JSON 的操作。\n\n## JavaScript\
    \ 框架\n\n使用框架有三个主要缺点。第一是它们需要**花一些精力学习**如何使用它们。第二是它们通常会大大**增加用户必须从您的站点下载的数据量**（也就是说，框架几乎天生就是臃肿的）。最后，您必须关注框架的新版本，因为它们可能会**修补安全漏洞**。\n\
    \n在选择框架时，请考虑**它支持多少种浏览器以及支持哪些浏览器**、**它的大小**（以用户最终需要下载的文件大小衡量）以及**文档完善程度**。\n\n\
