    \    <department>Accounting</department>\n    <email>g.gray@thiscompany.com</email>\n\
    \  </employee>\n  <employee>\n    <name>Green, Laverne</name>\n    <department>Human\
    \ Resources</department>\n    <email>l.green@thiscompany.com</email>\n  </employee>\n\
    </employees>\n```\n\n## complete the PHP\n\n1. Close the database connection (not\
