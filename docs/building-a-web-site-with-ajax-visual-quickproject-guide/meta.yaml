    \ PHP 页面的表单元素。\n- 2. 遍历数组中的每个元素。\n- 3. 在循环中，每个数组元素将被转换为 **name=value** 格式的字符串。因此，第一个数组元素\
    \ **first_name** 将被转换为类似 **first_name=Larry** 的形式。（参见第 83 页的**补充说明**。）\n\n```javascript\n\
    …\n  handleResponse(ajax);\n}\nvar fields = ['first_name', 'last_name', 'email',\n\
    \  'department_id','phone_ext'];\nfor (var i = 0; i < fields.length; i++) {\n\
    \  fields[i] = fields[i] + '=' +\n    encodeURIComponent(document.getElementById(fields[i]).\n\
    \    value);\n}\nvar values = fields.join('&');\najax.setRequestHeader('Content-Type',\
    \ 'application/x-www-form-urlencoded');\n```\n\n- 4. 在循环中，每个表单元素的值通过文档对象模型获取。为了安全起见，该值会经过\
    \ **encodeURIComponent()** 函数处理。\n- 5. 在循环之外，所有数组元素（**name=value** 对）用和号连接在一起。最终结果是一个类似\
    \ **first_name=Larry&last_name=Ullman&…** 的字符串。\n- 6. **Content-Type** 头部表明即将发送什么类型的信息。**application/x-www-form-urlencoded**\
    \ 这个值表示内容是经过编码的表单数据。\n\n## 完成函数\n\n- 1. 在所有数据处理之后，发出实际的 Ajax 请求。由变量 **values**\
    \ 表示的表单数据作为 **send()** 方法的唯一参数。（参见第 83 页的**补充说明**。）\n\n```javascript\n...\n  \
    \  ajax.setRequestHeader('Content-Type',\n        'application/x-www-form-urlencoded');\n\
    \    ajax.send(values);\n    return false;\n  } // 匿名函数结束。\n } // DOM 检查结束。\n\
    } // ajax IF 判断结束。\n} // init() 函数结束。\n```\n\n- 2. 最后，函数返回 **false** 值，告诉 Web\
    \ 浏览器不要实际提交表单（因为 Ajax 正在处理表单提交）。\n\n将此文件保存为 **add_employee.js**，并将其放在 Web 服务器上与其他所有文件相同的目录中。\n\
    \n## 准备 XML\n\n一个新的 PHP 脚本将执行与 **add_employee.php** 相同的功能，只是它将所有结果以 XML 数据的形式返回。这些数据将由\
    \ Web 浏览器中的 JavaScript 处理。在你的文本编辑应用程序中开始编写一个新的 PHP 脚本。\n\n- 1. 此 PHP 页面不会在 Web\
    \ 浏览器中显示，因此它以 PHP 开始标签开头，而不是 HTML。（参见第 83 页的**补充说明**。）\n- 2. **header()** 函数用于发送元信息（即非实际数据）。此处\
    \ **header()** 函数发送 **Content-Type** 为 **text/xml**。通俗地说，这是在表示接下来应该是 XML 数据。\n\
    \n```php\n<?php # add_employee_xml.php\nheader(\"Content-Type: text/xml\");\n\
    echo '<?xml version=\"1.0\" encoding=\"utf-8\"\nstandalone=\"yes\" ?>\n<response>\n\
    ';\n```\n\n- 3. XML 数据以**声明**开头。\n- 4. 所有 XML 文档都有**一个根元素**。这可以是一个自定义的值，比如这里的\
    \ **response**。\n\n### 验证表单数据\n\n在将表单数据用于查询之前，必须对其进行验证。将以下代码添加到 PHP 页面中。\n\n1.\
    \ `$error` 变量将作为一个标志，指示是否发生了错误。\n\n```php\n...\n<response>\n';\nrequire_once('mysql.inc.php');\n\
    $error = false;\nif (!empty($_POST['first_name'])) {\n```\n\n2. 文本输入将通过确认其不为空来验证。（参见第\
    \ 84 页的补充说明。）\n"
