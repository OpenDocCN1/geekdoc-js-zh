  mdcn: "\n## 补充说明（续）\n\n- **调用函数** 第29页\n  - **window.onload** 属性告诉 JavaScript 在页面完全加载后要调用的函数名称。在本例中，这个函数是\
    \ **init**，即 **initialize**（初始化，即设置环境）的缩写。\n  - 以这种方式（而不是直接调用）调用初始化函数的好处是，Web\
    \ 浏览器在下载和绘制页面时，不必等待 JavaScript 执行其操作。在某种程度上，这能带来更好的用户体验。\n\n- **设置 Ajax** 第30页\n\
    \  - JavaScript 引用 **文档对象模型** 来访问 HTML 页面中的元素。DOM 是浏览器文档中每个项目的映射。它可以通过无限的方式被使用和操纵。\n\
    \  - **getElementById()** 函数允许你通过引用其 **ID** 值来访问 DOM 元素。因此，一个 ID 为 **dept_form**\
    \ 的表单可以通过 **document.getElementById('dept_form')** 访问。\n  - 请记住，**ajax** 变量是一个\
    \ **XMLHttpRequest** 类型的对象。它的函数之一是 **open()**。为这个函数提供应发送请求的页面名称以及应使用的方法。\n  -\
    \ 由于处理请求的 PHP 脚本期望在 URL 中接收到一个部门 ID，因此必须在请求中传递 HTML 表单中选定的值。你可以使用 DOM 来访问该值。\n\
    \  - **encodeURIComponent()** 函数确保选定的表单值可以安全地在 URL 中发送。\n  - 在此 JavaScript 代码中有\
    \ **两个匿名函数**。这些是在定义时未给出名称的函数。当需要封装一段代码但不需要像标准函数那样调用该代码时，会使用匿名函数。\n  - XMLHttpRequest\
    \ 的 **readyState** 值存储当前 Ajax 事务的状态，范围从 0 到 4。其中最重要的是 4，表示事务已完成。\n\n## 打印员工信息\
    \ 第33页\n\n这个 PHP 脚本与第 2 章的 `dept_results.php` 几乎完全相同。主要区别在于它不包含开头和结尾的 `<html>`、`<head>`\
    \ 和 `<body>` 标签，也不包含这些标签内的大部分内容。原因在于本页面的所有结果都将通过 JavaScript 插入到 HTML 页面中。而该页面已经有了正确的\
    \ HTML 标签。\n\n## 处理响应 第35页\n\n- 在 `init()` 函数中，我们告诉 JavaScript 在 `readyState`\
    \ 值发生变化时调用一个名为 `handleResponse()` 的函数。在 Ajax 请求期间，此值会发生多次变化，因此该函数将被多次调用。\n- **`XMLHttpRequest`\
    \ status 属性** 存储服务器端页面返回的 **HTTP 状态码**。状态码有几十种，从表示一切正常的 **200**，到通常表示服务器错误的 500\
    \ 以上的值。状态码 **304** 表示页面已找到，但自某个日期和时间以来未被修改。\n\n在这些示例的背景下，我们将假设它表示响应正常。\n\n- 通过引用文档对象模型，我们可以强制提交表单。`document.getElementById('dept_form')`\
    \ 代码引用了该表单（其 `id` 值为 `dept_form`）。代码中的 `.submit()` 部分会提交它。\n\n## 显示结果 第36页\n\n\
