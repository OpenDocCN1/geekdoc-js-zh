- md: "## 5. Adding Records via Ajax\n\nIn the previous chapter, we created a way\
    \ to add employees to the database. That process required one HTML form and one\
    \ PHP script that handled the form. It all works fine but in the old-fashioned,\
    \ client-server kind of way.\n\nIn this chapter, let's set an Ajax layer on top\
    \ of those scripts so that, for the browsers that support it, our form for adding\
    \ employees can behave more like a desktop application. To do so, we'll need to\
    \ **slightly modify the HTML page**. Then we'll create **one JavaScript file**\
    \ that has the page-specific Ajax functionality. Finally, a **new PHP script**\
    \ will be written that handles the Ajax request.\n\nThis example will also introduce\
    \ two new techniques: sending an Ajax request **using the POST method** and **working\
    \ with XML data**. This Ajax example is a little more complicated than the previous\
    \ one, but it should all make sense by the end of the chapter.\n\n### What we'll\
    \ do\n\n- 1. First, on page 62, we'll **modify the HTML page** to include the\
    \ necessary Ajax pieces.\n- 2. On Ajax-enabled browsers, when the user clicks\
    \ **Add**, the page-specific JavaScript will read in all the form data and submit\
    \ it to a new PHP script. On pages 63-66, we'll begin the **JavaScript file**\
    \ that starts this process.\n- 3. The **PHP script**, written on pages 67-74,\
    \ will validate all the data and report on the results. Its response will be returned\
    \ as XML.\n- 4. The JavaScript will take the **XML returned by the PHP script**\
    \ and use it to update the HTML page. We'll complete this file on pages 75-79.\n\
    - 5. Naturally, we'll **test** what we've built to make sure it all works.\n-\
    \ 6. At the end of this chapter, in the **extra bits** section, you'll find more\
    \ information, tips, and recommendations regarding all of these steps.\n\nHTML\
    \ page\n![](img/64cd02e760894ad9ed3dde3e58139569_79_0.png)\n![](img/64cd02e760894ad9ed3dde3e58139569_79_1.png)\n\
    \nForm data\n![](img/64cd02e760894ad9ed3dde3e58139569_79_2.png)\n\nXML data\n\
    ![](img/64cd02e760894ad9ed3dde3e58139569_79_3.png)\n\n## Add the Ajax elements\n\
    \n- 1. Include the **generic Ajax JavaScript file** by adding the right code to\
    \ the HTML head. (See **extra bits** on page 82.)\n\n```html\n...\n<title>Add\
    \ an Employee</title>\n<script src=\"ajax.js\" type=\"text/javascript\"></script>\n\
    <script src=\"add_employee.js\" type=\"text/javascript\"></script>\n<style type=\"\
    text/css\" media=\"all\">@import \"style.css\";</style>\n...\n```\n\n- 2. Include\
    \ the **page-specific Ajax JavaScript file** by adding that code to the HTML head.\
    \ We'll start making this script next.\n- 3. Add a **DIV** to the HTML page to\
    \ report upon the results.\n\n```html\n...\n<p>Use this form to add an employee\
    \ (all fields are required):</p>\n<div id=\"results\"></div>\n<form action=\"\
    add_employee.php\" method=\"post\" id=\"emp_form\">\n...\n```\n\n- 4. Save the\
    \ file (it will continue to use the name **add_employee.html**).\n\n## Apply the\
    \ Ajax layer\n\nCreate a new JavaScript file that starts with the following code\
    \ (see **extra bits** on page 82):\n\n1. The first line tells the Web browser\
    \ to run the `init()` function after loading the entire page. The `init()` function\
    \ sets up all the Ajax activity.\n\n```javascript\nwindow.onload = init;\nfunction\
    \ init() {\n    var ajax = getXMLHttpRequestObject();\n```\n\n2. The function\
    \ calls the **getXMLHttpRequestObject()** function to get a valid, browser-specific\
    \ object. This function is defined in **ajax.js**, which will have already been\
    \ included by the HTML page.\n\n3. The function then checks to see if the `ajax`\
    \ variable has a valid value. With supported browsers, `ajax` will be an **XMLHttpRequest**\
    \ object. With nonsupported browsers, `ajax` will have a value of `false`, and\
    \ this conditional will be false.\n\n```javascript\nif (ajax) {\n    if (document.getElementById('results'))\
    \ {\n        document.getElementById('emp_form').onsubmit =\nfunction() {\n```\n\
    \n4. Next, the function checks to see if the browser supports the **document object\
    \ model (DOM)** and, specifically, if the page has an element with an `id` of\
    \ **results**.\n\n5. Finally, an `onsubmit()` event is attached to the form (which\
    \ has an `id` value of **emp_form**). In other words, when the form is submitted,\
    \ do the following....\n\n## Set up the Ajax\n\n```javascript\n...\ndocument.getElementById('emp_form').onsubmit\
    \ = function() {\n    ajax.open('post', 'add_employee_xml.php');\n    ajax.onreadystatechange\
    \ = function() {\n        handleResponse(ajax);\n    }\n}\n```\n\n- 1. Tell the\
    \ **ajax** object that you want to use the **POST** method. (See **extra bits**\
    \ on page 82.)\n- 2. Provide to the **ajax** object the name of the page that\
    \ should be sent the request. This is **add_employee_xml.php**, to be written\
    \ next.\n- 3. When the **ajax** object's **readyState** value changes, the **handleResponse()**\
    \ function should be called, passing that function this same object.\n\n## Prepare\
    \ the form data\n\n- 1. The **fields** variable is an array of the form elements\
    \ whose values need to be sent to the PHP page.\n- 2. Loop through each element\
    \ in the array.\n- 3. In the loop, each array element will be turned into a string\
    \ in the format **name=value**. So the first array element, **first_name**, will\
    \ be turned into something like **first_name=Larry**. (See **extra bits** on page\
    \ 83.)\n\n```javascript\n…\n  handleResponse(ajax);\n}\nvar fields = ['first_name',\
    \ 'last_name', 'email',\n  'department_id','phone_ext'];\nfor (var i = 0; i <\
    \ fields.length; i++) {\n  fields[i] = fields[i] + '=' +\n    encodeURIComponent(document.getElementById(fields[i]).\n\
    \    value);\n}\nvar values = fields.join('&');\najax.setRequestHeader('Content-Type',\
    \ 'application/x-www-form-urlencoded');\n```\n\n- 4. In the loop, each form element's\
    \ value is retrieved using the Document Object Model. The value is run through\
    \ the **encodeURIComponent()** function for security purposes.\n- 5. Outside of\
    \ the loop, all of the array elements (the **name=value** pairs) are joined together\
    \ with ampersands. The end result is a string like **first_name=Larry&last_name=Ullman&…**\n\
    - 6. The **Content-Type** header indicates what kind of information is about to\
    \ be sent. The value **application/x-www-form-urlencoded** means that the content\
    \ is encoded form data.\n\n## Complete the function\n\n- 1. After all the data\
    \ handling, the actual Ajax request is made. The form data, represented by the\
    \ variable **values**, is used as the only argument to the **send()** method.\
    \ (See **extra bits** on page 83.)\n\n```javascript\n...\n    ajax.setRequestHeader('Content-Type',\n\
    \        'application/x-www-form-urlencoded');\n    ajax.send(values);\n    return\
    \ false;\n  } // End of anonymous function.\n } // End of DOM check.\n} // End\
    \ of ajax IF.\n} // End of init() function.\n```\n\n- 2. Finally, the function\
    \ returns a value of **false** to tell the Web browser not to actually submit\
    \ the form (since Ajax is handling the form submission).\n\nSave this file as\
    \ **add_employee.js** and place it in the same directory on your Web server as\
    \ every other file.\n\n## Prepare for XML\n\nA new PHP script will do the same\
    \ thing as **add_employee.php**, only it will return all of its results as XML\
    \ data. This data will be handled by the JavaScript in the Web browser. Start\
    \ a new PHP script in your text-editing application.\n\n- 1. This PHP page will\
    \ not be viewed in the Web browser, so it begins with the opening PHP tag, not\
    \ with HTML. (See **extra bits** on page 83.)\n- 2. The **header()** function\
    \ is used to send meta-information (i.e., not actual data). Here the **header()**\
    \ function sends a **Content-Type** of **text/xml**. In layman's terms, this is\
    \ a way of saying that XML data should be expected to follow.\n\n```php\n<?php\
    \ # add_employee_xml.php\nheader(\"Content-Type: text/xml\");\necho '<?xml version=\"\
    1.0\" encoding=\"utf-8\"\nstandalone=\"yes\" ?>\n<response>\n';\n```\n\n- 3. XML\
    \ data begins with the **declaration**.\n- 4. All XML documents have **one root\
    \ element**. This can be a made-up value, like **response** here.\n\n### Validate\
    \ the form data\n\nThe form data must be validated prior to using it in a query.\
    \ Add this code to the PHP page.\n\n1. The `$error` variable will be a flag, indicating\
    \ if an error occurred.\n\n```php\n...\n<response>\n';\nrequire_once('mysql.inc.php');\n\
    $error = false;\nif (!empty($_POST['first_name'])) {\n```\n\n2. Text inputs will\
    \ be validated by confirming that they aren't empty. (See extra bits on page 84.)"
  mdcn: "\n## 5. 通过 Ajax 添加记录\n\n在上一章中，我们创建了一种将员工添加到数据库的方法。该流程需要一个 HTML 表单和一个处理该表单的\
    \ PHP 脚本。这一切都运行良好，但采用的是传统的、客户端-服务器端模式。\n\n在本章中，我们将在这些脚本之上添加一层 Ajax，使得支持 Ajax 的浏览器中，我们的员工添加表单可以表现得更像桌面应用程序。为此，我们需要**对\
    \ HTML 页面进行少量修改**。然后，我们将创建**一个 JavaScript 文件**，其中包含页面专用的 Ajax 功能。最后，将编写**一个新的\
    \ PHP 脚本**来处理 Ajax 请求。\n\n本示例还将引入两项新技术：**使用 POST 方法**发送 Ajax 请求以及**处理 XML 数据**。这个\
    \ Ajax 示例比前一个稍微复杂一些，但在本章结束时，一切都应该能说得通。\n\n### 我们将要做的事情\n\n- 1. 首先，在第 62 页，我们将**修改\
    \ HTML 页面**，添加必要的 Ajax 代码片段。\n- 2. 在支持 Ajax 的浏览器上，当用户点击**添加**按钮时，页面专用的 JavaScript\
    \ 将读取所有表单数据并提交到一个新的 PHP 脚本。在第 63-66 页，我们将开始编写**JavaScript 文件**来启动这个流程。\n- 3. 在第\
    \ 67-74 页编写的 **PHP 脚本**将验证所有数据并报告结果。其响应将以 XML 形式返回。\n- 4. JavaScript 将获取 **PHP\
    \ 脚本返回的 XML** 并使用它来更新 HTML 页面。我们将在第 75-79 页完成此文件。\n- 5. 当然，我们将**测试**我们构建的内容，确保一切正常。\n\
    - 6. 在本章末尾的**补充说明**部分，你会找到关于所有这些步骤的更多信息、提示和建议。\n\nHTML 页面\n![](img/64cd02e760894ad9ed3dde3e58139569_79_0.png)\n\
    ![](img/64cd02e760894ad9ed3dde3e58139569_79_1.png)\n\n表单数据\n![](img/64cd02e760894ad9ed3dde3e58139569_79_2.png)\n\
    \nXML 数据\n![](img/64cd02e760894ad9ed3dde3e58139569_79_3.png)\n\n## 添加 Ajax 元素\n\
    \n- 1. 在 HTML 的 head 中添加相应的代码来引入**通用 Ajax JavaScript 文件**。（参见第 82 页的**补充说明**。）\n\
    \n```html\n...\n<title>Add an Employee</title>\n<script src=\"ajax.js\" type=\"\
    text/javascript\"></script>\n<script src=\"add_employee.js\" type=\"text/javascript\"\
    ></script>\n<style type=\"text/css\" media=\"all\">@import \"style.css\";</style>\n\
    ...\n```\n\n- 2. 在 HTML 的 head 中添加相应的代码来引入**页面专用的 Ajax JavaScript 文件**。我们接下来将开始编写这个脚本。\n\
    - 3. 在 HTML 页面中添加一个 **DIV** 来显示结果。\n\n```html\n...\n<p>Use this form to add an\
    \ employee (all fields are required):</p>\n<div id=\"results\"></div>\n<form action=\"\
    add_employee.php\" method=\"post\" id=\"emp_form\">\n...\n```\n\n- 4. 保存文件（文件将继续使用\
    \ **add_employee.html** 这个名称）。\n\n## 应用 Ajax 层\n\n创建一个新的 JavaScript 文件，以以下代码开头（参见第\
    \ 82 页的**补充说明**）：\n\n1. 第一行告诉 Web 浏览器在加载完整个页面后运行 `init()` 函数。`init()` 函数设置所有的\
