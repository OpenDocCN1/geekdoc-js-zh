  md: '# extra bits


    # add the form p. 46


    +   - The POST method should generally be used when the form’s submission should
    have an effect on the site. For example, using the Add an Employee form adds another
    record to the database.

    - The GET method should generally be used when requesting information. For example,
    you should apply it when requesting the employees in a specific department.


    # add the form elements p. 47


    +   - The form’s labels will serve two purposes. First, they indicate to the user
    what each form element is for. Second, they’ll be modified, using JavaScript,
    to indicate an error in the Ajax-enabled version of this form.


    # validate the form data p. 50


    +   - How you validate form data depends on the data’s type (numbers, strings,
    etc.) and expected values (positive number, email address, and so on). For validating
    a person’s name, it’s often sufficient to make sure that some value is entered.

    - A more thorough validation of an email address would be to confirm that it matches
    a **regular expression pattern**. You can do this with email addresses more so
    than names because they must abide by strict rules.

    - You could improve the security of this system by applying PHP’s **strip_tags()**
    function to the text inputs. That function can help prevent cross-site scripting
    attacks (XSS).

    - The **mysql_real_escape_string()** function provides language-specific protection
    on text used in queries.


    # adding records'
