  - '[PAGE 104]


    # extra bits (cont.)


    # handle the XML  p. 77


    +   - The server''s response is available in two attributes of the XMLHttpRequest
    object. It can be found as plain text in **responseText** or as XML data in **responseXML**.

    - The XML data can be accessed just like an HTML page, using the Document Object
    Model. So **data.getElementsByTagName(''error'')** refers to every item in the
    XML data with a name of error.

    - The syntax of the **for** loop is a common way to access every item found in
    an array. Within the loop, the specific array item is accessed via **arrayname[i]**.

    - The error elements in the XML data have the names of the problematic form elements
    as their values. To access these values, refer to the error element, which is
    **errors[i]** within the loop, followed by **.firstChild.nodeValue**. It''s a
    rather complex syntax but it works. More information on a **child** and a **node**
    can be found in Chapter 7, "enabling an Ajax search."


    +   - To indicate a problem with a form element, its corresponding label will
    have its class changed from **title** to **error**. Using the Document Object
    Model, **document.getElementById(temp + ''_label'')** will refer to the label
    (where **temp** stores the name of the form element). Then **.className** lets
    you change its class.


    # display the results  p. 79


    +   - The **message** variable refers to every XML element with a name of **result**
    (see the code earlier in the function). Even though the XML data will only ever
    have one such element, an array is still returned. So the text itself is accessed
    via the unwieldy **message[0].firstChild.nodeValue**.

    - As with the previous Ajax example, the **innerHTML** property is used to put
    a message within the **results** DIV.'
  - '[PAGE 105]


    # 6. creating a search


    Thus far in the book we’ve made two aspects of an employee-directory site. First,
    we created a way to browse employees by department. Then we made it possible to
    add employees to the database. Let’s put in one last logical feature: the ability
    to search for employees by last name.


    In keeping with this book’s approach, we’ll start, in this chapter, with the non-Ajax
    version. These files will work for all users and give us a sense of what the process
    should entail. To create the search, we only need to put together two files: **one
    HTML form** and **one PHP script** that handles the form. Should be a snap!'
