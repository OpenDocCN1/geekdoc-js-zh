    \ 和 XML 的讨论，请参阅我的其他一些书籍。我的 **PHP for the World Wide Web, 2nd Edition: Visual QuickStart\
    \ Guide**（ISBN 0-321-24565-2）提供了 PHP 的基础入门。我在 **MySQL, Second Edition: Visual\
    \ QuickStart Guide**（ISBN 0-321-37573-4）中全面介绍了 SQL 和 MySQL。所有这些信息以及更多内容都汇编在我的\
    \ **PHP and MySQL以获取更多信息、示例的其他版本等。\n\n如果你有问题或需要任何帮助，请前往 **论坛**。\n\n## 下一步\n\n\
    本书的重点是创建一个非常好且可用的支持 Ajax 的应用程序。其中涉及多种技术，最重要的是 JavaScript。\n\n![JavaScript 书籍封面](img/64cd02e760894ad9ed3dde3e58139569_18_0.png)\n\
    \n![PHP 和 MySQL 书籍封面](img/64cd02e760894ad9ed3dde3e58139569_18_1.png)\n\n如需更多关于\
    \ PHP、MySQL、SQL 和 XML 的讨论，请参阅我的其他一些书籍。我的 **PHP for the World Wide Web, 2nd Edition:\
    \ Visual QuickStart Guide**（ISBN 0-321-24565-2）提供了 PHP 的基础入门。我在 **MySQL, Second\
    \ Edition: Visual QuickStart Guide**（ISBN 0-321-37573-4）中全面介绍了 SQL 和 MySQL。所有这些信息以及更多内容都汇编在我的\
    \ **PHP and MySQL的动态网站，第二版：Visual QuickPro 指南**（ISBN 0-321-33657-7）中。我在 **PHP\
    \ 5 Advanced: Visual QuickPro Guide**（ISBN 0-321-37601-3）的一章中讨论了 XML。\n\n有关 (X)HTML\
    \ 和 CSS 的更多信息，请参阅 Elizabeth Castro 的优秀著作 **HTML、XHTML 和 CSS，第六版：Visual QuickStart\
    \ 指南**（ISBN 0-321-43084-0）。\n\n## 1. 创建数据库\n\n我们将在本书中创建的支持 Ajax 的网站使用服务器上的**数据库**来存储所有内容：员工列表以及他们的一些相关示例信息。首先，我们需要创建并填充这个数据库。在本例中，我将使用\
    \ **MySQL**，一个流行的开源数据库应用程序。\n\n本章涵盖了创建数据库所需的知识，但假定你可以访问 MySQL 安装。我将使用两种不同的界面演示本章的步骤：**命令行\
    \ mysql 客户端**和**基于 Web 的 phpMyAdmin**。如果你对本章的说明有任何疑问或问题，请参阅我的 **MySQL，第二版：Visual\
    \ QuickStart 指南**（ISBN 0-321-37573-4）或在网上搜索。\n\n## 访问 MySQL\n\n如果你在自己的计算机上运行 MySQL，或者可以通过命令行访问服务器，请**登录到\
    \ mysql 客户端**。你需要**输入用户名和密码组合**。这些值必须已经预先在 MySQL 中设置好才能工作。（参见第 9 页的**额外提示**。）\n\
    \n```\n>: /usr/local/mysql/bin/mysql -u root -p\nEnter password:\nWelcome to the\
