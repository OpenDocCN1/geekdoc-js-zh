  - '[PAGE 100]


    # extra bits


    # add the Ajax elements p. 62


    +   - The ajax.js file, written in Chapter 3, "browsing using Ajax," defines a
    function that returns a **browser-specific XMLHttpRequest object**. This file
    is needed by any page that performs any Ajax operations.

    - Because the **DIV**, where the results will be reported, has an **id value of
    results**, it will be formatted according to the rules dictated in **style.css**.
    This is the same as the **results DIV in dept_form.html**. For starters, the DIV
    will be hidden when the page is first viewed.


    # apply the Ajax layer p. 63


    +   - Most of this code is exactly like that in **dept.js**. You''ll find that
    to be the case with a good Ajax base, like the one we''ve developed in this book.
    The only change in this first bit of code is the reference to **emp_form**. It''s
    in the rest of the code—what should be done when the form is submitted—that the
    big differences can be found.


    # set up the Ajax p. 64


    +   - The **POST** method should generally be used when the form''s submission
    should have an effect on the site. For example, using the add-an-employee form
    adds another record to the database.

    - The **GET** method should generally be used when requesting information—for
    example, when requesting the employees in a specific department.'
- md: "## prepare the form data p. 65\n\n-   - When a form is submitted using the\
    \ **GET** method, you’ll see the form data in the URL, with a syntax of `page.php?this_item=this_value&that_item=that_value`.\
    \ This is the same syntax used by **POST**, but the data isn’t sent in the URL\
    \ and you don’t need the question mark.\n- All of the form data needs to be run\
    \ through the `encodeURIComponent()` function to make it safe to send to the PHP\
    \ page. Rather than apply that function to each value separately, using a **for**\
    \ loop on an array of form elements lets us accomplish the same thing with less\
    \ code.\n- The **plus sign in JavaScript** is used to perform **concatenation**:\
    \ appending one string onto another. In PHP, the period does the same thing.\n\
    - If you wanted to send XML data to the PHP script, you would set the **Content-Type**\
    \ to `text/xml`.\n\n## complete the function p. 66\n\n-   - When using the **GET**\
    \ method, use the value **null** as the only argument when calling **send()**.\
    \ Any data sent over GET is appended to the URL itself. When using **POST**, you\
    \ need to provide the data when you call **send()**, as it’s not sent in the URL.\n\
    \n## prepare for XML p. 67\n\n-   - The PHP script sends its response as XML data,\
    \ not as a normal Web page. Everything PHP will print will be part of this XML.\n\
    - The XML data being created is really like the data in an HTML page, where there’s\
    \ one root element and any number of nested subelements. For this example, the\
    \ root element will be called **response** and there will be two subelements.\
    \ There can be zero or more elements called **error** and there will always be\
    \ exactly one element called **result**. In comparison, an HTML page has a root\
    \ element called **html**, two subelements named **head** and **body**, and more\
    \ subelements within those.\n\n**adding records via Ajax**\n\n## extra bits (cont.)\n\
    \n-   - If the PHP page does not use the **header()** function to set the **Content-Type**,\
    \ the JavaScript that receives this response will not recognize it as XML.\n-\
    \ You don't have to fully understand XML to do this example or to use XML in general.\
    \ But should you want to better understand the subject, search the Web for more\
    \ information.\n\n## validate the form data p. 68\n\n-   - For more information\
    \ on the form validation routines, see the extra bits section for Chapter 4, “adding\
    \ records.”\n- The XML data will have zero or more elements called **error**.\
    \ Any failed validation will result in another **error** element, whose value\
    \ will match the name of the corresponding form field. The point of this XML data\
    \ is to indicate which form fields weren't properly filled out. If all of the\
    \ validation tests were passed, there will be none of these elements.\n\n## complete\
    \ the XML p. 73\n\n-   - To debug any PHP-MySQL problems, you'll need to **print\
    \ out the query** to inspect its syntax. You should also invoke the **mysql_error()**\
    \ function to see what problems the database reports.\n- A useful debugging technique\
    \ when working with XML data is to verify that your PHP script is returning valid\
    \ XML. To see the result of the PHP page, either use JavaScript to access **ajax.responseText**\
    \ (in the **handleResponse()** function) or submit your form to the PHP page directly\
    \ (without using JavaScript).\n- For directly viewing XML in your Web browser,\
    \ you'll want to use a browser that supports the format. At the time of this writing,\
    \ this includes recent versions of Internet Explorer and Firefox, but not Safari.\n\
    \n**adding records via Ajax**\n\n### handle the response p. 75\n\n- In the **init()**\
    \ function, we tell the JavaScript to call a function called **handleResponse()**\
    \ whenever the **readyState** value changes. This value will change multiple times\
    \ during an Ajax request, so this function will be called multiple times.\n- The\
    \ XMLHttpRequest **status** attribute stores the **HTTP status code** returned\
    \ by the server-side page. There are dozens of status codes—from **200**, meaning\
    \ that everything was OK, to values over 500, which are normally server errors.\
    \ A status code of **304** indicates that the page was found but had not been\
    \ modified since a certain date and time.\n\n### prepare the page p. 76\n\n- One\
    \ of the new tricks in this chapter's example is that the form elements' labels\
    \ will be changed to indicate errors. Specifically, any problematic field will\
    \ have its label class switched from the default **title** to **error**. Upon\
    \ a resubmission of the form, the labels should have their class values reset\
    \ so that they can reflect the new results.\n\n**adding records via Ajax**\n\n\
    ## extra bits (cont.)\n\n## handle the XML p. 77\n\n-   - The server's response\
    \ is available in two attributes of the XMLHttpRequest object. It can be found\
    \ as plain text in **responseText** or as XML data in **responseXML**.\n- The\
    \ XML data can be accessed just like an HTML page, using the Document Object Model.\
    \ So **data.getElementsByTagName('error')** refers to every item in the XML data\
    \ with a name of error.\n- The syntax of the **for** loop is a common way to access\
    \ every item found in an array. Within the loop, the specific array item is accessed\
    \ via **arrayname[i]**.\n- The error elements in the XML data have the names of\
    \ the problematic form elements as their values. To access these values, refer\
    \ to the error element, which is **errors[i]** within the loop, followed by **.firstChild.nodeValue**.\
    \ It's a rather complex syntax but it works. More information on a **child** and\
    \ a **node** can be found in Chapter 7, \"enabling an Ajax search.\"\n\n-   -\
    \ To indicate a problem with a form element, its corresponding label will have\
    \ its class changed from **title** to **error**. Using the Document Object Model,\
    \ **document.getElementById(temp + '_label')** will refer to the label (where\
    \ **temp** stores the name of the form element). Then **.className** lets you\
    \ change its class.\n\n## display the results p. 79\n\n-   - The **message** variable\
    \ refers to every XML element with a name of **result** (see the code earlier\
    \ in the function). Even though the XML data will only ever have one such element,\
    \ an array is still returned. So the text itself is accessed via the unwieldy\
    \ **message[0].firstChild.nodeValue**.\n- As with the previous Ajax example, the\
    \ **innerHTML** property is used to put a message within the **results** DIV.\n\
    \n# 6. creating a search\n\nThus far in the book we’ve made two aspects of an\
    \ employee-directory site. First, we created a way to browse employees by department.\
    \ Then we made it possible to add employees to the database. Let’s put in one\
    \ last logical feature: the ability to search for employees by last name.\n\n\
    In keeping with this book’s approach, we’ll start, in this chapter, with the non-Ajax\
    \ version. These files will work for all users and give us a sense of what the\
    \ process should entail. To create the search, we only need to put together two\
    \ files: **one HTML form** and **one PHP script** that handles the form. Should\
    \ be a snap!\n\n## what we'll do\n\n1 First, on pages 89-91, we'll create an **HTML\
    \ page with a form.**\n\nThe form has only one input: a text box where an employee's\
    \ last name, or part thereof, can be entered.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_0.png)\n\
    \nOn non-Ajax-enabled browsers, when the user clicks **GO**, the form will be\
    \ submitted to a PHP script.\n\n2 On pages 92-95, the **PHP script** that handles\
    \ the HTML form will be written. The script uses the form data to perform a search\
    \ on the database, printing the results.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_1.png)\n\
    \nIf no employees match the search term, the PHP script prints a message saying\
    \ as much.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_2.png)\n\nNaturally,\
    \ we'll **test** what we've built to make sure it all works.\n\nAt the end of\
    \ this chapter, in the **extra bits** section, you'll find more information, tips,\
    \ and recommendations regarding all of these steps.\n\nIn the next chapter, we'll\
    \ add the Ajax layer to these pages.\n\n## start the HTML page\n\nStart by creating\
    \ a **new HTML page** in your text editor.\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\
    <head>\n  <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"\
    \ />\n  <title>Search for Employees by Name</title>\n  <style type=\"text/css\"\
    \ media=\"all\">@import \"style.css\";</style>\n</head>\n<body>\n<!-- search_form.html\
    \ -->\n</body>\n</html>\n```\n\nThe **title** reflects what this page is for.\n\
    \nThe **style sheet** will give this page the same look as the other pages in\
    \ the site."
  mdcn: "\n## 准备表单数据 p. 65\n\n-   - 当使用 **GET** 方法提交表单时，你将在 URL 中看到表单数据，语法格式为 `page.php?this_item=this_value&that_item=that_value`。**POST**\
    \ 方法使用相同的语法，但数据不会在 URL 中发送，也不需要问号。\n-   所有表单数据都需要通过 `encodeURIComponent()` 函数处理，以便安全地发送到\
    \ PHP 页面。与其单独对每个值应用该函数，不如使用 **for** 循环遍历表单元素数组，这样可以用更少的代码实现相同的功能。\n-   **JavaScript\
    \ 中的加号**用于执行**连接**：将一个字符串附加到另一个字符串。在 PHP 中，句点号执行相同的功能。\n-   如果你想将 XML 数据发送到 PHP\
    \ 脚本，应将 **Content-Type** 设置为 `text/xml`。\n\n## 完成函数 p. 66\n\n-   - 使用 **GET**\
    \ 方法时，在调用 **send()** 时，使用 **null** 作为唯一参数。通过 GET 发送的所有数据都附加到 URL 本身。使用 **POST**\
    \ 时，你需要在调用 **send()** 时提供数据，因为它不会在 URL 中发送。\n\n## 准备 XML p. 67\n\n-   - PHP 脚本将其响应作为\
    \ XML 数据发送，而不是普通的网页。PHP 将打印的所有内容都将成为此 XML 的一部分。\n-   创建的 XML 数据实际上类似于 HTML 页面中的数据，有一个根元素和任意数量的嵌套子元素。在此示例中，根元素将称为\
    \ **response**，并包含两个子元素。可以有零个或多个名为 **error** 的元素，但始终恰好有一个名为 **result** 的元素。相比之下，HTML\
    \ 页面有一个名为 **html** 的根元素，两个名为 **head** 和 **body** 的子元素，以及其中的更多子元素。\n\n**通过 Ajax\
    \ 添加记录**\n\n## 额外内容（续）\n\n-   - 如果 PHP 页面不使用 **header()** 函数设置 **Content-Type**，接收此响应的\
    \ JavaScript 将无法将其识别为 XML。\n-   要完成此示例或通常使用 XML，你无需完全理解 XML。但如果你希望更好地理解该主题，可以搜索网络获取更多信息。\n\
    \n## 验证表单数据 p. 68\n\n-   - 有关表单验证例程的更多信息，请参见第 4 章“添加记录”的额外内容部分。\n-   XML 数据将包含零个或多个名为\
    \ **error** 的元素。任何验证失败都将导致另一个 **error** 元素，其值与相应表单字段的名称匹配。此 XML 数据的目的是指示哪些表单字段未正确填写。如果所有验证测试都通过，则不会有这些元素。\n\
    \n## 完成 XML p. 73\n\n-   - 要调试任何 PHP-MySQL 问题，你需要**打印出查询**以检查其语法。你还应该调用 **mysql_error()**\
    \ 函数，查看数据库报告了哪些问题。\n-   处理 XML 数据时，一个有用的调试技巧是验证你的 PHP 脚本是否返回了有效的 XML。要查看 PHP 页面的结果，可以使用\
    \ JavaScript 访问 **ajax.responseText**（在 **handleResponse()** 函数中），或者直接将表单提交到 PHP\
    \ 页面（不使用 JavaScript）。\n-   要在 Web 浏览器中直接查看 XML，你需要使用支持该格式的浏览器。在撰写本文时，这包括 Internet\
    \ Explorer 和 Firefox 的最新版本，但不包括 Safari。\n\n**通过 Ajax 添加记录**\n\n### 处理响应 p. 75\n\
    \n-   在 **init()** 函数中，我们告诉 JavaScript，每当 **readyState** 值改变时，就调用名为 **handleResponse()**\
    \ 的函数。此值在 Ajax 请求期间会多次更改，因此此函数将被多次调用。\n-   XMLHttpRequest **status** 属性存储服务器端页面返回的\
    \ **HTTP 状态码**。有几十种状态码——从 **200**（表示一切正常）到超过 500 的值（通常是服务器错误）。状态码 **304** 表示页面已找到，但自某个日期和时间以来未被修改。\n\
    \n### 准备页面 p. 76\n\n-   本章示例中的一个新技巧是，表单元素的标签将被更改为指示错误。具体来说，任何有问题的字段，其标签类将从默认的\
    \ **title** 切换为 **error**。在重新提交表单后，标签的类值应被重置，以便它们可以反映新的结果。\n\n**通过 Ajax 添加记录**\n\
    \n## 额外内容（续）\n\n## 处理 XML p. 77\n\n-   - 服务器的响应在 XMLHttpRequest 对象的两个属性中可用。它可以在\
    \ **responseText** 中以纯文本形式找到，也可以在 **responseXML** 中以 XML 数据形式找到。\n-   XML 数据可以像\
    \ HTML 页面一样使用文档对象模型访问。因此，**data.getElementsByTagName('error')** 指的是 XML 数据中所有名为\
    \ error 的项。\n-   **for** 循环的语法是访问数组中找到的每个项的常用方式。在循环内，通过 **arrayname[i]** 访问特定的数组项。\n\
    -   XML 数据中的 error 元素将有问题的表单元素的名称作为其值。要访问这些值，可以引用 error 元素（在循环中为 **errors[i]**），后跟\
    \ **.firstChild.nodeValue**。这是一种相当复杂的语法，但它有效。有关**子节点**和**节点**的更多信息可在第 7 章“启用 Ajax\
    \ 搜索”中找到。\n\n-   - 要指示表单元素存在问题，其对应标签的类将从 **title** 更改为 **error**。使用文档对象模型，**document.getElementById(temp\
    \ + '_label')** 将引用标签（其中 **temp** 存储表单元素的名称）。然后 **.className** 允许你更改其类。\n\n##\
    \ 显示结果 p. 79\n\n-   - **message** 变量指的是所有名为 **result** 的 XML 元素（参见函数中前面的代码）。即使\
    \ XML 数据中永远只有一个这样的元素，仍会返回一个数组。因此，文本本身通过冗长的 **message[0].firstChild.nodeValue**\
    \ 访问。\n-   与之前的 Ajax 示例一样，**innerHTML** 属性用于在 **results** DIV 中放置消息。\n\n# 6. 创建搜索\n\
    \n到目前为止，本书已经构建了员工目录网站的两个方面。首先，我们创建了一种按部门浏览员工的方法。然后，我们实现了将员工添加到数据库的功能。让我们添加最后一个逻辑功能：按姓氏搜索员工的能力。\n\
    \n根据本书的方法，本章我们将从非 Ajax 版本开始。这些文件将适用于所有用户，并让我们了解该过程应包含什么。要创建搜索，我们只需要将两个文件组合在一起：**一个\
    \ HTML 表单**和一个处理表单的 **PHP 脚本**。这应该很简单！\n\n## 我们将要做什么\n\n1  首先，在第 89-91 页，我们将创建一个**带有表单的\
    \ HTML 页面。**\n\n表单只有一个输入：一个文本框，可以输入员工的姓氏或其部分。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_0.png)\n\
    \n在非 Ajax 浏览器上，当用户点击 **GO** 时，表单将提交到一个 PHP 脚本。\n\n2  在第 92-95 页，将编写处理 HTML 表单的\
    \ **PHP 脚本**。该脚本使用表单数据在数据库上执行搜索，并打印结果。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_1.png)\n\
    \n如果没有员工与搜索条件匹配，PHP 脚本将打印相应的消息。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_106_2.png)\n\
    \n当然，我们将**测试**构建的内容以确保一切正常工作。\n\n在本章末尾的**额外内容**部分，你将找到有关所有这些步骤的更多信息、提示和建议。\n\n\
    在下一章中，我们将为这些页面添加 Ajax 层。\n\n## 开始 HTML 页面\n\n首先，在文本编辑器中创建一个**新的 HTML 页面**。\n\n\
    ```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\
    <head>\n  <meta http-equiv=\"content-type\" content=\"text/html; charset=utf-8\"\
    \ />\n  <title>Search for Employees by Name</title>\n  <style type=\"text/css\"\
    \ media=\"all\">@import \"style.css\";</style>\n</head>\n<body>\n<!-- search_form.html\
