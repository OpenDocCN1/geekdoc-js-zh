- md: "## Ajax alternatives\n\nIt may seem strange to discuss other options in a book\
    \ about Ajax, but you can get a better understanding of a thing by knowing what\
    \ the alternatives are. What can be accomplished via Ajax may also be possible\
    \ using:\n\n1. **iFrames**: While not as powerful as Ajax, iFrames are well supported\
    \ by most browsers. iFrames often still make use of JavaScript; therefore, they\
    \ can have some of the same issues as Ajax.\n2. **Flash**: This is an extremely\
    \ useful technology but requires that the user install the Flash plug-in for their\
    \ browser.\n3. **Java applets**: Like Flash, Java applets have a wide range of\
    \ uses and abilities but require installed browser support.\n\n## Introducing\
    \ JSON\n\n**JSON** (JavaScript Simple Object Notation) provides an alternative\
    \ to XML for transmitting data. Here is some sample XML data from Chapter 7, \"\
    Enabling an Ajax search\":\n\n```\n<employees>\n    <employee>\n        <name>Gray,\
    \ Gideon</name>\n        <department>Accounting</department>\n        <email>g.gray@thiscompany.com</email>\n\
    \    </employee>\n    <employee>\n        <name>Green, Laverne</name>\n      \
    \  <department>Human Resources</department>\n        <email>l.green@thiscompany.com</email>\n\
    \    </employee>\n</employees>\n```\n\nHere's how that same data would look in\
    \ JSON format (actually, all the data would be on one line, without spaces, but\
    \ I've spaced it out for clarity):\n\n```\n[\n{\"name\":\"Gray, Gideon\",\"department\"\
    :\"Accounting\",\"email\":\"g.gray@thiscompany.com\"},\n{\"name\":\"Green, Laverne\"\
    ,\"department\":\"Human Resources\",\"email\":\"l.green@thiscompany.com\"}\n]\n\
    ```\n\nBecause **JSON data is JavaScript**, it's arguably easier to work with\
    \ than XML. And the same data will likely be smaller in JSON than in XML (meaning\
    \ a smaller transfer size from the server to the client). See **Extra Bits** on\
    \ page 146 for why you shouldn't use JSON.\n\n## Sending JSON\n\nHere's how the\
    \ search_results_xml.php script from Chapter 7 would be rewritten to send JSON\
    \ data instead of XML:\n\n```php\n<?php # search_results_json.php\nheader(\"Content-type:\
    \ application/json\");\nif (!empty($_GET['last_name'])) {\n    require_once('mysql.inc.php');\n\
    \    $q = \"SELECT CONCAT(last_name, ', ', first_name),\n    email, department\
    \ FROM employees LEFT JOIN departments\n    USING (department_id) WHERE last_name\
    \ LIKE '\" . mysql_\n    real_escape_string($_GET['last_name']) . \"%' ORDER BY\n\
    \    last_name, first_name\";\n    $r = mysql_query($q, $dbc);\n    if (mysql_num_rows($r)\
    \ > 0) {\n```\n\n1. The content-type header indicates what type of data is being\
    \ sent by this script.\n\n2. Initialize an array that will store the results.\n\
    \n```php\n$data = array();\nwhile ($row = mysql_fetch_array($r, MYSQL_NUM)) {\n\
    \    $data[] = array ('name' => $row[0],\n                     'department' =>\
    \ $row[2],\n                     'email' => $row[1]);\n} // End of WHILE loop.\n\
    echo json_encode($data) . \"\\n\";\n}\nmysql_close($dbc);\n} // End of $_GET['last_name']\
    \ IF.\n?>\n```\n\n3. Add each record as a new item in the $data array.\n\n4. Use\
    \ a library to turn the array into JSON format, and print the results. (See **Extra\
    \ Bits** on page 146.)\n\n## Accessing JSON data\n\nTo finish changing the search\
    \ from Chapter 7 to use JSON, you must alter the **search.js** file. All of the\
    \ relevant changes go within the **handleResponse()** function (although you also\
    \ have to change the reference to the **search_results_xml.php** script earlier\
    \ in the JavaScript file, if you rename that file):\n\n1. Retrieve the data in\
    \ **ajax.responseText**.\n2. Convert the data to an object using **eval()**.\n\
    \n```javascript\n...\nwhile (results.hasChildNodes()) {\n  results.removeChild(results.lastChild);\n\
    }\nvar data = eval('(' + ajax.responseText + ')');\nif (data.length > 0) {\n \
    \ ...\n```\n\n3. Check that **some records** were returned by looking at the array's\
    \ size.\n\n## Using JSON data\n\nTo update the DOM using the JSON data, complete\
    \ the modification of the `handleResponse()` function:\n\n1. Access every returned\
    \ record using a **loop**.\n\n```javascript\n...\nif (data.length > 0) {\n   \
    \ var employee, span, name_node, dept_node, dept_\n    label, br, strong, a, email;\n\
    \    for (var i = 0; i < data.length; i++) {\n        employee = document.createElement('p');\n\
    \        span = document.createElement('span');\n        span.setAttribute('class',\
    \ 'name');\n```\n\n## Using JSON data (cont.)\n\n2. Access the individual elements\
    \ using dot syntax.\n\n```javascript\nname_node = document.createTextNode(data[i].name);\n\
    span.appendChild(name_node);\nemployee.appendChild(span);\nbr = document.createElement('br');\n\
    employee.appendChild(br);\nstrong = document.createElement('strong');\ndept_label\
    \ = document.createTextNode('Department');\nstrong.appendChild(dept_label);\n\
    employee.appendChild(strong);\ndept_node = document.createTextNode(': ' +\ndata[i].department);\n\
    employee.appendChild(dept_node);\nbr = document.createElement('br');\nemployee.appendChild(br);\n\
    a = document.createElement('a');\na.setAttribute('href', 'mailto:' + data[i].email);\n\
    email = document.createTextNode(data[i].email);\na.appendChild(email);\nemployee.appendChild(a);\n\
    results.appendChild(employee);\n} // End of FOR loop.\n} else { // No employees,\
    \ print a message.\n...\n```\n\n## Web resources\n\nAlong with the frameworks\
    \ sites listed on the following pages, you might find these Ajax-specific sites\
    \ worth your time (I've whittled the hundreds and hundreds of Ajax sites down\
    \ to a good starting handful):\n\n1. **Ajax Patterns** ([www.ajaxpatterns.org](http://www.ajaxpatterns.org))\
    \ has tons of Ajax resources (in programming, a **pattern** is a best practice\
    \ for solving problems).\n2. **AJAX Matters** ([www.ajaxmatters.com](http://www.ajaxmatters.com))\
    \ has a lot of articles on various Ajax-related subjects.\n3. **Ajaxian** ([www.ajaxian.com](http://www.ajaxian.com))\
    \ has been around since the beginning of Ajax and has articles covering a range\
    \ of Ajax-based topics.\n4. **Douglas Crockford's Wrrrld Wide Web** ([www.crockford.com](http://www.crockford.com))\
    \ is short on frills but long on usefulness. Crockford is a prominent JavaScript\
    \ developer and one of the people behind JSON.\n5. You can find the first coining\
    \ of the word Ajax at [http://adaptivepath.com/publications/essays/archives/000385.php](http://adaptivepath.com/publications/essays/archives/000385.php).\n\
    \n## JavaScript frameworks\n\nA **framework** is an **established library of code**\
    \ that can be used to more easily do the things you'd otherwise program by hand\
    \ (as I do in this book). Here are a handful of the dozens and dozens of frameworks\
    \ available. (See **Extra Bits** on page 147.)\n\n| Name | URL |\n|---|---|\n\
    | Prototype | www.prototypejs.org |\n| Rico | www.openrico.org |\n| Dojo Toolkit\
    \ | www.dojotoolkit.org |\n| jQuery | http://jquery.com |\n| Sarissa | http://dev.abiss.gr/sarissa/\
    \ |\n| script.aculo.us | http://script.aculo.us |\n| MooTools | www.mootools.net\
    \ |\n| Yahoo! User Interface Library | http://developer.yahoo.com/yui/ |\n| Spry\
    \ | http://labs.adobe.com/technologies/spry/ |\n\n## PHP-Ajax frameworks\n\nInstead\
    \ of using a JavaScript-specific framework, you could use one that helps with\
    \ both the JavaScript and the PHP. The two most popular are:\n\n1. SAJAX (Simple\
    \ Ajax Toolkit): www.modernmethod.com/sajax/\n2. xajax: www.xajaxproject.org\n\
    3. PEAR::HTML_AJAX: http://pear.php.net/package/HTML_AJAX\n\n## Debugging JavaScript\n\
    \nMastering the art of debugging is crucial when using any programming language,\
    \ and Ajax/JavaScript is no exception. I could write an entire book, or at least\
    \ a full chapter, on the subject, but you'll find this short list of the best\
    \ tools and techniques helpful:\n\n1. **A JavaScript console**: Firefox has a\
    \ JavaScript console built in. It'll print errors and other necessary messages\
    \ to aid your debugging. If an Ajax page doesn't work as expected, this is the\
    \ first place you should look.\n\n2. **JavaScript alerts**: I recommend using\
    \ alerts to confirm what functions are executed and what the values of variables\
    \ are.\n\n```javascript\nalert('Inside the handleResponse() function.');\nalert(ajax.responseText);\n\
    ```"
  mdcn: "\n## Ajax 替代方案\n\n在关于 Ajax 的书中讨论其他选项似乎很奇怪，但通过了解替代方案，你可以更深入地理解一个事物。通过 Ajax\
    \ 能够实现的功能，使用以下方式也可能实现：\n\n1. **iFrames**：虽然没有 Ajax 那么强大，但 iFrames 得到了大多数浏览器的良好支持。iFrames\
    \ 通常仍会使用 JavaScript；因此，它们可能会遇到与 Ajax 相同的一些问题。\n2. **Flash**：这是一项极其有用的技术，但要求用户在浏览器中安装\
    \ Flash 插件。\n3. **Java applets**：与 Flash 类似，Java applets 具有广泛的用途和能力，但需要安装浏览器支持。\n\
    \n## JSON 简介\n\n**JSON** (JavaScript Simple Object Notation) 为数据传输提供了一种替代 XML\
    \ 的方案。这里有一些来自第 7 章“启用 Ajax 搜索”的示例 XML 数据：\n\n```\n<employees>\n    <employee>\n\
    \        <name>Gray, Gideon</name>\n        <department>Accounting</department>\n\
    \        <email>g.gray@thiscompany.com</email>\n    </employee>\n    <employee>\n\
    \        <name>Green, Laverne</name>\n        <department>Human Resources</department>\n\
    \        <email>l.green@thiscompany.com</email>\n    </employee>\n</employees>\n\
    ```\n\n同样的数据以 JSON 格式呈现如下（实际上，所有数据都会在一行中，没有空格，但为了清晰起见，我将其分行排列）：\n\n```\n[\n{\"\
    name\":\"Gray, Gideon\",\"department\":\"Accounting\",\"email\":\"g.gray@thiscompany.com\"\
    },\n{\"name\":\"Green, Laverne\",\"department\":\"Human Resources\",\"email\"\
    :\"l.green@thiscompany.com\"}\n]\n```\n\n因为 **JSON 数据就是 JavaScript**，所以可以说它比 XML\
    \ 更容易处理。而且同样的数据，JSON 格式可能比 XML 格式更小（这意味着从服务器到客户端的传输量更小）。关于为什么不应该使用 JSON，请参阅第 146\
    \ 页的**额外补充 (Extra Bits)**。\n\n## 发送 JSON\n\n以下是将第 7 章中的 `search_results_xml.php`\
    \ 脚本重写为发送 JSON 数据而非 XML 的方式：\n\n```php\n<?php # search_results_json.php\nheader(\"\
    Content-type: application/json\");\nif (!empty($_GET['last_name'])) {\n    require_once('mysql.inc.php');\n\
    \    $q = \"SELECT CONCAT(last_name, ', ', first_name),\n    email, department\
    \ FROM employees LEFT JOIN departments\n    USING (department_id) WHERE last_name\
    \ LIKE '\" . mysql_\n    real_escape_string($_GET['last_name']) . \"%' ORDER BY\n\
    \    last_name, first_name\";\n    $r = mysql_query($q, $dbc);\n    if (mysql_num_rows($r)\
    \ > 0) {\n```\n\n1. `content-type` 响应头指示该脚本正在发送什么类型的数据。\n\n2. 初始化一个用于存储结果的数组。\n\
    \n```php\n$data = array();\nwhile ($row = mysql_fetch_array($r, MYSQL_NUM)) {\n\
    \    $data[] = array ('name' => $row[0],\n                     'department' =>\
    \ $row[2],\n                     'email' => $row[1]);\n} // End of WHILE loop.\n\
    echo json_encode($data) . \"\\n\";\n}\nmysql_close($dbc);\n} // End of $_GET['last_name']\
    \ IF.\n?>\n```\n\n3. 将每条记录作为新项添加到 `$data` 数组中。\n\n4. 使用库将数组转换为 JSON 格式，并打印结果。（参阅第\
    \ 146 页的**额外补充 (Extra Bits)**。）\n\n## 访问 JSON 数据\n\n为了完成将第 7 章中的搜索改为使用 JSON，你必须修改\
    \ **search.js** 文件。所有相关的更改都位于 **handleResponse()** 函数中（不过，如果你重命名了文件，你还需要修改 JavaScript\
    \ 文件前面部分对 **search_results_xml.php** 脚本的引用）：\n\n1. 从 **ajax.responseText** 中获取数据。\n\
    2. 使用 **eval()** 将数据转换为对象。\n\n```javascript\n...\nwhile (results.hasChildNodes())\
    \ {\n  results.removeChild(results.lastChild);\n}\nvar data = eval('(' + ajax.responseText\
    \ + ')');\nif (data.length > 0) {\n  ...\n```\n\n3. 通过检查数组的大小来确认是否返回了**某些记录**。\n\
    \n## 使用 JSON 数据\n\n要使用 JSON 数据更新 DOM，请完成对 `handleResponse()` 函数的修改：\n\n1. 使用**循环**访问每一条返回的记录。\n\
    \n```javascript\n...\nif (data.length > 0) {\n    var employee, span, name_node,\
    \ dept_node, dept_\n    label, br, strong, a, email;\n    for (var i = 0; i <\
    \ data.length; i++) {\n        employee = document.createElement('p');\n     \
    \   span = document.createElement('span');\n        span.setAttribute('class',\
    \ 'name');\n```\n\n## 使用 JSON 数据（续）\n\n2. 使用点号语法访问单个元素。\n\n```javascript\nname_node\
    \ = document.createTextNode(data[i].name);\nspan.appendChild(name_node);\nemployee.appendChild(span);\n\
    br = document.createElement('br');\nemployee.appendChild(br);\nstrong = document.createElement('strong');\n\
    dept_label = document.createTextNode('Department');\nstrong.appendChild(dept_label);\n\
    employee.appendChild(strong);\ndept_node = document.createTextNode(': ' +\ndata[i].department);\n\
    employee.appendChild(dept_node);\nbr = document.createElement('br');\nemployee.appendChild(br);\n\
    a = document.createElement('a');\na.setAttribute('href', 'mailto:' + data[i].email);\n\
    email = document.createTextNode(data[i].email);\na.appendChild(email);\nemployee.appendChild(a);\n\
    results.appendChild(employee);\n} // End of FOR loop.\n} else { // No employees,\
    \ print a message.\n...\n```\n\n## 网络资源\n\n除了接下来的页面中列出的框架网站外，你可能会发现这些 Ajax 专用网站值得花时间研究（我将数百个\
    \ Ajax 网站精简到了几个不错的入门站点）：\n\n1. **Ajax Patterns** ([www.ajaxpatterns.org](http://www.ajaxpatterns.org))\
    \ 拥有大量的 Ajax 资源（在编程中，**模式 (pattern)** 是解决问题的最佳实践）。\n2. **AJAX Matters** ([www.ajaxmatters.com](http://www.ajaxmatters.com))\
    \ 有许多关于各种 Ajax 相关主题的文章。\n3. **Ajaxian** ([www.ajaxian.com](http://www.ajaxian.com))\
    \ 自 Ajax 出现之初就一直存在，涵盖了各种基于 Ajax 的主题文章。\n4. **Douglas Crockford's Wrrrld Wide Web**\
    \ ([www.crockford.com](http://www.crockford.com)) 虽然装饰简单，但实用价值极高。Crockford 是一位著名的\
    \ JavaScript 开发人员，也是 JSON 的创建者之一。\n5. 你可以在 [http://adaptivepath.com/publications/essays/archives/000385.php](http://adaptivepath.com/publications/essays/archives/000385.php)\
    \ 找到“Ajax”这个词的首次定义。\n\n## JavaScript 框架\n\n**框架 (framework)** 是一个**成熟的代码库**，可以用来更轻松地完成那些你原本需要手动编程实现的功能（就像我在本书中所做的那样）。这里列出了几十个可用框架中的几个。（参阅第\
    \ 147 页的**额外补充 (Extra Bits)**。）\n\n| 名称 | URL |\n|---|---|\n| Prototype | www.prototypejs.org\
    \ |\n| Rico | www.openrico.org |\n| Dojo Toolkit | www.dojotoolkit.org |\n| jQuery\
    \ | http://jquery.com |\n| Sarissa | http://dev.abiss.gr/sarissa/ |\n| script.aculo.us\
    \ | http://script.aculo.us |\n| MooTools | www.mootools.net |\n| Yahoo! User Interface\
    \ Library | http://developer.yahoo.com/yui/ |\n| Spry | http://labs.adobe.com/technologies/spry/\
    \ |\n\n## PHP-Ajax 框架\n\n除了使用 JavaScript 专用框架，你还可以使用一个同时支持 JavaScript 和 PHP 的框架。最流行的两个是：\n\
    \n1. SAJAX (Simple Ajax Toolkit): www.modernmethod.com/sajax/\n2. xajax: www.xajaxproject.org\n\
    3. PEAR::HTML_AJAX: http://pear.php.net/package/HTML_AJAX\n\n## 调试 JavaScript\n\
    \n在使用任何编程语言时，掌握调试艺术都至关重要，Ajax/JavaScript 也不例外。我可以为此写一整本书，或者至少是一个完整的章节，但你会发现这个简短的最佳工具和技术清单非常有帮助：\n\
    \n1. **JavaScript 控制台**：Firefox 内置了 JavaScript 控制台。它会打印错误和其他必要的消息以辅助调试。如果 Ajax\
    \ 页面运行不如预期，这里是你应该首先查看的地方。\n\n2. **JavaScript 警告框 (alerts)**：我建议使用 `alert` 来确认哪些函数被执行了以及变量的值是多少。\n\
    \n```javascript\nalert('Inside the handleResponse() function.');\nalert(ajax.responseText);\n\
    ```\n"
