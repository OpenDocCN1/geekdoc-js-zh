    created. For more information on this subject, search the Web or check out Elizabeth
    Castro’s HTML, XHTML, & CSS: Visual QuickStart Guide, Sixth Edition (ISBN-13:
    978-0321430847).

    * The most interesting of the style definitions is the one for items with an **id
    value of results**. Such items will not be displayed when the page is first loaded.
    Then, when appropriate, the JavaScript will fill that section with results and
    make it visible. This all takes place in the Ajax layer, created in the next chapter.


    # test the pages p. 21


    +   * All PHP pages must be run through a URL in order to work. Therefore, the
    HTML form must also be run through a URL (the address must begin with **http:///**).
    If the address begins with **file://**, the PHP script handling the form won’t
    do its thing.

    * Getting these components to work is a perfect first step in creating an Ajax-enabled
    layer. It’s easier to debug these pages than it will be once JavaScript and other
    technologies are added to the mix.

    * Debugging PHP may be the hardest skill for the beginner to learn—unfortunately,
    the beginner will end up doing the most debugging (it’s a “trial by fire” situation).
    If you have problems getting these pages to work, see the book’s Web site at **www.dmcinsights.com/ajax/**,
