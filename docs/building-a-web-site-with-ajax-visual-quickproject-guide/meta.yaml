    with this page you''ll need to employ some standard PHP-database debugging techniques.
    Begin by printing out the query being run (add **echo $q;** after the query is
    created). Then run the query using another interface, like the command-line **mysql
    client** or the Web-based **phpMyAdmin**. These two steps will confirm what the
    query''s results are.

    - Another useful debugging technique for any PHP script is to view the dynamically-generated
    HTML source code in your Web browser. Sometimes the problem can be hidden there.

    - For more information on PHP and PHP-MySQL interactions, see my book **PHP and
    MySQL for Dynamic Web Sites: Visual QuickPro Guide, Second Edition** (ISBN-13:
    978-0321336576) or search the Web.


    # connect to the database p. 18


    +   - As many PHP scripts in this application will use the database, it''s best
    to create one script that establishes that connection. Every page that requires
    a database connection will then include this file.

    - The **mysql.inc.php** script can be a likely cause of problems. To guarantee
    that it works when it comes time to test the site, make sure you are using a **username
    and password combination** that has access to the **ajax** database. If you have
    any problems, check out the MySQL manual, a book on MySQL (like my **MySQL, Second
    Edition: Visual QuickStart Guide** (ISBN-13: 978-0321375735)), or this book''s
    support Web site at www.dmcinsights.com/ajax/.'
