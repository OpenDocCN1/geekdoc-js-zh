  md: '# extra bits


    ### access **MySQL** p. 2


    - You can use pretty much any database application for your Web sites, not just
    MySQL. If there''s one you''re more comfortable with, feel free to switch. (Note
    that you would also need to change the PHP code in the rest of the book.)

    - The mysql client can be tricky if you''re not used to it. If you have any problems,
    check out the MySQL manual, a book on MySQL, or this book''s support site at **www.dmcinsights.com/ajax/**.
    Many people find phpMy-Admin, also used in this chapter, to be an easier option.


    ### make the **database** p. 4


    - If you''re using MySQL on a hosted Web site, your host will likely provide you
    with phpMy-Admin access. They may or may not let you create databases, though.
    If not, just use the data-base you have already (assuming it does not have tables
    called **departments** and **employees**).

    - A database''s **collation** refers to the types of language charac-ters the
    database will support. If you don''t specify a collation, the MySQL default collation
    will be used. This is normally fine.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# extra bits (cont.)


    make the tables p. 5


    +   - Both tables are defined in a minimalist way. You can add columns if you''d
    like, but you''ll need to change the **INSERT** commands (later in the chapter)
    accordingly.

    - The SQL commands in this chapter, and all of the book''s code, can be downloaded
    from **www.dmcinsights.com/ajax/**.

    - The **departments** table has a unique index on the **department** column, ensuring
    that each department is listed only once.

    - There is a one-to-many relationship between the two tables. Each employee can
    be in only one department but each department can have many employees. This relationship
    is represented by the **department_id** column, which is in both tables.

    - You can create tables in phpMyAdmin using either of the SQL text areas as shown
    in the examples or by using the create table prompt. To use the prompt, provide
    phpMyAdmin with the name of the table and the number of fields, and it will create
    a form where you can enter all of the column definitions.


    populate the tables p. 7


    +   - The data being inserted isn''t important, so long as you populate the tables
    with some information. You can make up your own records or download the SQL commands
    from the book''s corresponding Web site at **www.dmcinsights.com/ajax/**.

    - The **department_id** value for each employee must correspond to an actual **department_id**
    from the **departments** table.


    10 creating the database'
