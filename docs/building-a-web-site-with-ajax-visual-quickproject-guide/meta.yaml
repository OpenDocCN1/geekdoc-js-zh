    \ variables only exist within that function.\n\n- If a function takes **arguments**\
    \ — values passed to the function when it's called — those would go between the\
    \ parentheses.\n\n## check for Ajax support p. 28\n\n- The **ajax.js** file, which\
    \ defines the **getXMLHttpRequestObject()** function, is the most important script\
