    \ XMLHttpRequest 对象**的函数。执行任何 Ajax 操作的页面都需要此文件。\n- 因为将用于报告结果的 **DIV** 的 **id 值为\
    \ results**，它将根据 **style.css** 中规定的规则进行格式化。这与 **dept_form.html 中的 results DIV**\
    \ 相同。一开始，当页面首次查看时，该 DIV 将是隐藏的。\n\n## 应用 Ajax 层 p. 63\n\n- 这段代码大部分与 **dept.js**\
    \ 中的代码完全相同。你会发现，对于一个好的 Ajax 基础（比如我们在本书中开发的那个），情况就是如此。这段代码中唯一的改变是对 **emp_form**\
    \ 的引用。真正的巨大差异在于其余代码——当表单提交时应该做什么。\n\n## 设置 Ajax p. 64\n\n- 当表单的提交应该对网站产生影响时，通常应使用\
    \ **POST** 方法。例如，使用添加员工表单会在数据库中添加另一条记录。\n- 当请求信息时（例如，请求特定部门中的员工），通常应使用 **GET**\
    \ 方法。\n"
