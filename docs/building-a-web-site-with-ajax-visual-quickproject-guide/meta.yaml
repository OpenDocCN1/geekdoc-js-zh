  md: '# # web resources


    Along with the frameworks sites listed on the following pages, you might find
    these Ajax-specific sites worth your time (I''ve whittled the hundreds and hundreds
    of Ajax sites down to a good starting handful):


    +   1. **Ajax Patterns** ([www.ajaxpatterns.org](http://www.ajaxpatterns.org))
    has tons of Ajax resources (in programming, a **pattern** is a best practice for
    solving problems).

    2. **AJAX Matters** ([www.ajaxmatters.com](http://www.ajaxmatters.com)) has a
    lot of articles on various Ajax-related subjects.

    3. **Ajaxian** ([www.ajaxian.com](http://www.ajaxian.com)) has been around since
    the beginning of Ajax and has articles covering a range of Ajax-based topics.

    4. **Douglas Crockford''s Wrrrld Wide Web** ([www.crockford.com](http://www.crockford.com))
    is short on frills but long on usefulness. Crockford is a prominent JavaScript
    developer and one of the people behind JSON.

    5. You can find the first coining of the word Ajax at [http://adaptivepath.com/publications/essays/archives/000385.php](http://adaptivepath.com/publications/essays/archives/000385.php).'
  merge: -1
