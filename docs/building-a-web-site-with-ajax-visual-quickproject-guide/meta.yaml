  - '[PAGE 117]


    # 7. enabling an Ajax search


    As the last piece in this book’s project, let’s take the search created in the
    previous chapter and give it the old Ajax treatment. As in other chapters, we’ll
    add an Ajax layer on top of what we’ve already created. Browsers that are Ajax-supportive
    will see the search results without reloading the page; every other browser will
    use the system already in place.


    Accomplishing this will require **modifying the HTML page**. Then we’ll need to
    make a **new JavaScript file** that contains all the functionality for this specific
    example. And a **new PHP script** will be written that returns the search results,
    in XML format, to the JavaScript. Unlike the other Ajax examples in this book,
    we won’t use the `innerHTML` attribute in our JavaScript to update the Web page.
    Here, we’ll add **nodes** to the **Document Object Model** as a way of manipulating
    the page’s content.'
  - '[PAGE 118]


    # what we''ll do


    1. First, on page 102, we''ll **modify the HTML page** to include the necessary
    Ajax pieces.

    2. The user enters the first couple of letters of the employee''s last name and
    clicks **GO**. (See **extra bits** on page 124.)

    3. On Ajax-enabled browsers, the page-specific JavaScript will read in what the
    user typed and submit that to a new PHP script. On pages 103-106, we''ll begin
    the **JavaScript file** that starts this process.

    4. The **PHP script**, written on pages 107-110, will search the database for
    employees whose name begins with the provided letters. It will return any matched
    records as **XML data**.

    5. The JavaScript will take the **XML returned by the PHP script** and use it
    to update the HTML page. We''ll complete this JavaScript file on pages 111-122.

    6. Naturally, we''ll **test** what we''ve built on page 123 to make sure it all
    works.

    7. At the end of this chapter, in the **extra bits** section, you''ll find more
    information, tips, and recommendations regarding all of these steps.'
- md: "enabling an Ajax search\n\n## add the Ajax elements\n\n1. Include the **generic\
    \ Ajax JavaScript file** by adding the right code to the HTML head. (See **extra\
    \ bits** on page 124.)\n\n```html\n...\n<title>Search for Employees by Name</title>\n\
    <script src=\"ajax.js\" type=\"text/javascript\"></script>\n<script src=\"search.js\"\
    \ type=\"text/javascript\"></script>\n<style type=\"text/css\" media=\"all\">@import\
    \ \"style.css\";</style>\n...\n```\n\n2. Include the **page-specific Ajax JavaScript\
    \ file** by adding that code to the HTML head. We'll start making this script\
    \ next.\n\n```html\n...\n</form>\n<div id=\"results\"></div>\n</body>\n...\n```\n\
    \n3. Add a **DIV** to the HTML page to report on the results.\n\n4. Save the file\
    \ (it will continue to use the name **search_form.html**).\n\n## apply the Ajax\
    \ layer\n\nCreate a new JavaScript file that starts with the following code (see\
    \ **extra bits** on page 124):\n\n1. The first line tells the Web browsers to\
    \ run the `init()` function after loading the entire page. The `init()` function\
    \ sets up all the Ajax activity.\n\n```javascript\nwindow.onload = init;\nfunction\
    \ init() {\n  var ajax = getXMLHttpRequestObject();\n  if (ajax) {\n```\n\n2.\
    \ The function calls the **getXMLHttpRequestObject()** function to get a valid,\
    \ browser-specific object. This function is defined in **ajax.js**, which will\
    \ have already been included by the HTML page.\n\n3. The function then checks\
    \ to see if the `ajax` variable has a valid value. With supported browsers, `ajax`\
    \ will be an **XMLHttpRequest** object. With nonsupported browsers, `ajax` will\
    \ have a value of **false**, and this conditional will be false.\n\n## apply the\
    \ Ajax layer (cont.)\n\n4. Next, the function checks to see if the browser supports\
    \ the Document Object Model (DOM) and, specifically, if the page has an element\
    \ with an id of results.\n\n```javascript\nif (document.getElementById('results'))\
    \ {\ndocument.getElementById('search_form').onsubmit\n= function() {\n```\n\n\
    5. Finally, an onsubmit() event is attached to the form (which has an id value\
    \ of search_form). In other words, when the form is submitted, do the following...\n\
    \n## set up the Ajax\n\n1. Provide to the **ajax** object the name of the page\
    \ that should be sent the request. This is **search_results_xml.php**, to be written\
    \ next. The request will be made using the **get** method.\n\n```javascript\n\
    ...\ndocument.getElementById('search_form').onsubmit = function() {\n    var last_name\
    \ = document.getElementById('last_name').value;\n    ajax.open('get', 'search_results_xml.php?last_name='\
    \ + encodeURIComponent(last_name));\n    ajax.onreadystatechange = function()\
    \ {\n        handleResponse(ajax);\n    }\n}\n```\n\n2. As part of that request,\
    \ the **last_name** value (the letters the user entered in the form) will be passed\
    \ along in the URL. (See **extra bits** on page 124.)\n\n3. When the **ajax**\
    \ object's **readyState** value changes, the **handleResponse()** function should\
    \ be called, passing that function this same object.\n\n## complete the function\n\
    \n1. The actual Ajax request is made.\n\n2. Finally, the function returns a value\
    \ of **false** to tell the Web browser not to actually submit the form (since\
    \ the Ajax is handling the form submission).\n\n```javascript\n...\n    handleResponse(ajax);\n\
    }\najax.send(null);\nreturn false;\n} // End of anonymous function.\n} // End\
    \ of DOM check.\n} // End of ajax IF.\n} // End of init() function.\n```\n\nSave\
    \ this file as **search.js** and place it in the same directory on your Web server\
    \ as every other file.\n\n## prepare for XML\n\nA new PHP script will do the same\
    \ thing as search_results.php, only it will return all of its results as XML data.\
    \ This data will be handled by the JavaScript in the Web browser. Start a new\
    \ PHP script in your text editor or IDE.\n\n1. This PHP page will not be viewed\
    \ in the Web browser, so it begins with the opening PHP tag, not any HTML. (See\
    \ **extra bits** on page 125.)\n\n2. The header() function is used to send meta-information\
    \ (i.e., not actual data). Here the header() function sends a Content-Type of\
    \ text/xml. In layman's terms, this is a way of saying that XML data should be\
    \ expected to follow.\n\n```php\n<?php # search_results_xml.php\nheader(\"Content-Type:\
    \ text/xml\");\necho '<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\"\
    \ ?>\n<employees>\n';\n```\n\n3. XML data begins with the declaration.\n\n4. All\
    \ XML documents have one root element. This can be a made-up value, like employees\
    \ here.\n\n## query the database\n\n1. We make sure that **some value** was submitted\
    \ for the **last name** or else there's no need to query the database.\n\n2. The\
    \ **MySQL connection script** is included.\n\n```php\n...\n<employees>';\nif (!empty($_GET['last_name']))\
    \ {\n  require_once('mysql.inc.php');\n  $q = \"SELECT CONCAT(last_name, ', ',\
    \ first_name), email, department FROM employees LEFT JOIN departments USING (department_id)\
    \ WHERE last_name LIKE '\" . mysql_real_escape_string($_GET['last_name']) . \"\
    %' ORDER BY last_name, first_name\";\n  $r = mysql_query($q, $dbc);\n```\n\n3.\
    \ The query will return every employee's **name**, **email**, **address**, and\
    \ **department** whose last name begins with the submitted letters. (See **extra\
    \ bits** on page 125.)\n\n4. The **mysql_real_escape_string()** function makes\
    \ it safe to use the submitted value in a query.\n\n## fetch the results\n\n1.\
    \ Check that **at least one record** was returned.\n\n2. **Fetch all the records**\
    \ and print them out as XML data.\n\n```php\n...\n$r = mysql_query($q, $dbc);\n\
    if (mysql_num_rows($r) > 0) {\n    while ($row = mysql_fetch_array($r, MYSQL_NUM))\
    \ {\n        echo \"<employee>\\n<name>$row[0]</name>\\n<department>$row[2]</department>\\\
    n<email>$row[1]</email>\\n</employee>\\n\";\n    } // End of WHILE loop.\n} //\
    \ End of IF.\n```\n\n3. The **newline character** (\\n) makes sure that whatever\
