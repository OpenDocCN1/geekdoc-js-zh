    # Ajax alternatives


    It may seem strange to discuss other options in a book about Ajax, but you can
    get a better understanding of a thing by knowing what the alternatives are. What
    can be accomplished via Ajax may also be possible using:


    +   1. **iFrames**: While not as powerful as Ajax, iFrames are well supported
    by most browsers. iFrames often still make use of JavaScript; therefore, they
    can have some of the same issues as Ajax.

    2. **Flash**: This is an extremely useful technology but requires that the user
    install the Flash plug-in for their browser.

    3. **Java applets**: Like Flash, Java applets have a wide range of uses and abilities
    but require installed browser support.'
