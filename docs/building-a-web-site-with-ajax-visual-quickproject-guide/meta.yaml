    }\n```\n\n**5** 当**ajax**对象的**readyState**值发生变化时，应调用**handleResponse()**函数，并将同一个**ajax**对象传递给该函数。\n\
    \n**6** 然后发出实际的Ajax请求。\n\n```\najax.send(null);\nreturn false;\n} // 匿名函数结束。\n\
    } // DOM检查结束。\n} // Ajax IF结束。\n...\n```\n\n**7** 最后，函数返回**false**值，告诉Web浏览器不要实际提交表单（因为Ajax正在处理表单提交）。\n\
    \n**8** 将此文件保存为**dept.js**，并将其放在Web服务器上与其他文件相同的目录中。\n\n## 开始PHP页面\n\n一个新的PHP脚本将处理Ajax请求。它的工作方式与**dept_results.php**（我们在上一章中创建的）完全相同，只是它不需要打印开始和结束的HTML标签。使用任何文本编辑应用程序创建一个新的PHP文档。\n\
    \n- 1. 页面首先确保它从URL中接收到了有效的部门ID。出于安全目的，假设我们没有有效的部门ID。\n\n2. 如果URL中传递了部门ID到此页面，则对其进行**类型转换**（强制其为整数）。\n\
    \n```\n<?php # dept_results_ajax.php\n$did = 0;\nif (isset($_GET['did'])) {\n\
    \    $did = (int) $_GET['did'];\n}\nif ($did > 0) {\n} else { // 无效的部门ID！\n  \
    \  echo '<p class=\"error\">请从下拉菜单中选择一个有效的部门以查看其员工。</p>';\n}\n?>\n```\n\n- 3.\
    \ 如果结果是正整数，我们可以继续查询数据库。\n\n4. 如果结果不是正整数，则打印错误消息。\n\n## 打印员工信息\n\nPHP页面打印给定部门中的员工列表。为此，需要进行数据库查询。（参见第41页的**额外内容**。）\n\
    \n```\n...\nif ($did > 0) {\n    require_once('mysql.inc.php');\n    $q = \"SELECT\
    \ * FROM employees WHERE department_id=$did ORDER BY last_name, first_name\";\n\
    \    $r = mysql_query($q, $dbc);\n}\n```\n\n- 1. **包含数据库连接脚本**（在上一章中编写）。\n\n2.\
    \ **查询数据库**，查找给定部门中的员工。\n\n```\nwhile ($row = mysql_fetch_array($r, MYSQL_ASSOC))\
    \ {\n    echo \"<p><span class=\\\"name\\\">{$row['last_name']}, {$row['first_name']}</span><br\
    \ />\n    <strong>电子邮件</strong>: {$row['email']}<br />\n    <strong>电话分机</strong>:\
    \ {$row['phone_ext']}\n    </p>\\n\";\n} // WHILE循环结束。\n```\n\n- 3. **获取任何返回的记录并打印它们**，带有一些HTML和CSS格式。\n\
    \n## 打印员工信息（续）\n\n4. 如果在给定部门中未找到员工，则打印错误信息。\n\n```\n} else { // 没有员工。\n\techo\
    \ '<p class=\"error\">给定部门没有列出任何员工。</p>';\n}\nmysql_close($dbc);\n} else { //\
    \ 无效的部门ID！\n\t...\n```\n\n5. 关闭数据库连接。\n\n6. 将此文件保存为**dept_results_ajax.php**，并将其放在Web服务器上与其他文件相同的目录中。\n\
    \n## 处理响应\n\nPHP页面打印出员工信息，但由于使用了Ajax，此打印输出实际上将返回给原始JavaScript。将此新函数添加到**dept.js**\
    \ JavaScript文件中。（参见第41页的**额外内容**。）\n\n1. 当**ajax**对象的**readyState**值发生变化时（参见**init()**函数），会调用此JavaScript函数。调用时，该函数接收Ajax对象。\n\
    \n2. 在**readyState**的值为4之前，该函数不应执行任何操作，这意味着Ajax事务已完成。\n\n```\nfunction handleResponse(ajax)\
    \ {\n    if (ajax.readyState == 4) {\n        if ((ajax.status == 200) || (ajax.status\
    \ == 304) )\n        {\n        } else {\n            document.getElementById('dept_form').submit();\n\
    \        }\n    }\n}\n```\n\n3. 如果**状态代码**等于200或304，则返回的结果应该可以正常使用。\n\n4. 如果我们没有从Ajax请求获得有效的状态代码，我们应该正式提交表单到处理PHP页面（就好像Ajax层根本不存在一样）。\n\
    \n## 显示结果\n\nAjax过程的最后一步是通过将PHP页面返回的内容放到HTML页面上来显示结果。此代码完成了**handleResponse()**函数。（参见第41页的**额外内容**。）\n\
    \n> 1. **results**变量现在指的是HTML页面DOM中的一个特定区域。\n\n```\nif ((ajax.status == 200) ||\
    \ (ajax.status == 304) ) {\n    var results = document.getElementById('results');\n\
    \    results.innerHTML = ajax.responseText;\n    results.style.display = 'block';\n\
    } else {\n```\n\n> 2. **results**区域中的文本被设置为从Ajax请求返回的响应。在本例中，就是PHP页面打印出的任何内容。\n\
    \n> 3. HTML页面的**results**区域最初不显示，因此需要更改其**display**样式。\n\n## 修改HTML\n\n最后一步是修改HTML表单页面，以便JavaScript能够工作。\n\
    \n```\n...\n<title>按部门显示员工</title>\n<script src=\"ajax.js\" type=\"text/javascript\"\
    ></script>\n<script src=\"dept.js\" type=\"text/javascript\"></script>\n<style\
    \ type=\"text/css\" media=\"all\">@import \"style.css\";</style>\n</form>\n...\n\
    ```\n\n- 1. 在此页面中包含两个JavaScript页面。\n\n```\n...\n</form>\n<div id=\"results\"></div>\n\
    </body>\n</html>\n```\n\n- 2. 创建一个**id**为**results**的**div**部分。Ajax请求返回的结果将放在这里。\n\
    \n## 测试Ajax层\n\n现在所有工作都已完成，是时候看看结果如何了。（参见第42页的**额外内容**。）\n\n**1** 在Web浏览器中加载**HTML页面**。\n\
    \n要使此功能正常工作，地址**必须以http://**开头。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_56_0.png)\n\
    \n**2** 选择一个部门并点击GO。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_56_1.png)\n\n\
    **3** HTML页面应显示结果，而无需跳转到新页面或重新加载此页面。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_56_2.png)\n\
    \n## 额外内容\n\n## 创建函数（第27页）\n\n- JavaScript与大多数语言一样，允许您定义自己的函数。以单词**function**开头，后跟函数名，后跟括号。函数体放在花括号之间。函数名只能包含字母、数字和下划线。它不能以数字开头，也不能与JavaScript中的现有关键字相同。\n\
    \n- 在函数中使用关键字**var**声明的变量对于该函数是**局部**的。也就是说，这些变量仅存在于该函数内部。\n\n- 如果函数接受**参数**——调用时传递给函数的值——这些参数将放在括号之间。\n\
    \n## 检查Ajax支持（第28页）\n\n- **ajax.js**文件定义了**getXMLHttpRequestObject()**函数，是任何Ajax应用程序中最重要的脚本。该函数返回一个有效的、浏览器安全的**XMLHttpRequest**对象，或**false**值。如果返回对象，则该对象包含执行Ajax事务所需的所有功能。\n\
    \n- 大多数浏览器的最新版本都支持**XMLHttpRequest对象**。由于其日益普及，这种情况应该会持续下去，即使在撰写本文时它还不属于任何标准的一部分。\n\
    \n- Internet Explorer 5和6版本不支持JavaScript **XMLHttpRequest**对象。相反，它们支持**XMLHTTP**类型的**ActiveX**对象。不幸的是，如果使用这些版本Internet\
    \ Explorer的用户禁用了ActiveX支持（启用它存在安全风险），他们就无法使用像这样的支持Ajax的应用程序。\n\n使用Ajax进行浏览\n\n\
    39\n"
