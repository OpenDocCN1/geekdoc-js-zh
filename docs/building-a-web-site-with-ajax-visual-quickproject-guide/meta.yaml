- md: "## extra bits (cont.)\n\n- **call the function** p. 29\n  - The **window.onload**\
    \ property tells the JavaScript the name of the function to call once the page\
    \ has completely loaded. In this case that's **init**, short for **initialize**\
    \ (i.e., set things up).\n  - The benefit of calling the initialization function\
    \ in this way (rather than just calling it directly) is that the downloading and\
    \ drawing of the page in the Web browser won't have to wait for the JavaScript\
    \ to do its thing. In a slight way, this makes for a better user experience.\n\
    \n- **set up the Ajax** p. 30\n  - The JavaScript refers to the **Document Object\
    \ Model** to access elements in the HTML page. The DOM is a map of every item\
    \ in a browser document. It can be used and manipulated in limitless ways.\n \
    \ - The **getElementById()** function allows you to access a DOM element by referring\
    \ to its **ID** value. So a form with an ID of **dept_form** can be accessed via\
    \ **document.getElementById('dept_form')**.\n  - Remember that the **ajax** variable\
    \ is an object of **XMLHttpRequest** type. One of its functions is **open()**.\
    \ Provide this function with the name of the page where the request should be\
    \ sent and the method that should be used.\n  - Because the PHP script that handles\
    \ the request expects to receive a department ID in the URL, the value selected\
    \ in the HTML form must be passed along with the request. You can access that\
    \ value using the DOM.\n  - The **encodeURIComponent()** function ensures that\
    \ the selected form value is safe to send in a URL.\n  - In this JavaScript code\
    \ there are **two anonymous functions**. These are functions not given a name\
    \ when defined. Anonymous functions are used when it's necessary to encapsulate\
    \ a chunk of code but it's not necessary to call that code like a standard function.\n\
    \  - The XMLHttpRequest **readyState** value stores the current Ajax transaction\
    \ state, on a scale from 0 to 4. The most important of these is 4, which means\
    \ that the transaction is complete.\n\n## print the employees p. 33\n\nThis PHP\
    \ script is almost exactly like `dept_results.php` from Chapter 2. The main difference\
    \ is that it does not include the opening and closing `<html>`, `<head>`, and\
    \ `<body>` tags, nor does it include most of the stuff that goes within those\
    \ tags. The reason why is that all of this page's results will be inserted into\
    \ the HTML page via JavaScript. That page already has the proper HTML tags.\n\n\
    ## handle the response p. 35\n\n- In the `init()` function, we tell the JavaScript\
    \ to call a function called `handleResponse()` whenever the `readyState` value\
    \ changes. This value will change multiple times during an Ajax request, so this\
    \ function will be called multiple times.\n- The **`XMLHttpRequest` status attribute**\
    \ stores the **HTTP status code** returned by the server-side page. There are\
    \ dozens of status codes from **200**, meaning that everything was OK, to values\
    \ over 500, which are normally server errors. A status code of **304** indicates\
    \ that the page was found but had not been modified since a certain date and time.\n\
    \nFor the purposes of these examples, we'll assume it means the response was fine.\n\
    \n- By referring to the Document Object Model, we can forcibly submit the form.\
    \ The `document.getElementById('dept_form')` code refers to the form (which has\
    \ an `id` value of `dept_form`). The `.submit()` part of the code submits it.\n\
    \n## display the results p. 36\n\n- Once again, the Document Object Model allows\
    \ you to easily access individual elements in a page. The code `document.getElementById('results')`\
    \ refers to a `div` in the HTML page that has an `id` of `results`.\n- The Cascading\
    \ Style Sheet `style.css` sets the **`display` attribute** of items with an `id`\
    \ of **`results`** to **`none`**. The net effect will be that such elements are\
    \ not visible when a page is first loaded. This is desired because such items\
    \ have a solid green border around them and it'd be distracting to see that prior\
    \ to actually retrieving the results.\n\nbrowsing using Ajax 41\n\n## extra bits\
    \ (cont.)\n\n- The process of hiding, then showing the results area using CSS\
    \ and JavaScript is intended to make it more obvious when the HTML page is updated.\n\
    - Referring to an element's **innerHTML** value is a quick way to place new text\
    \ on an page. An alternative is to add **nodes** to the DOM. You'll see this in\
    \ Chapter 7, \"enabling an Ajax search.\"\n\n## test the Ajax layer p. 38\n\n\
    - Debugging Ajax applications can be particularly tricky because there are so\
    \ many technologies involved: HTML, DOM, CSS, JavaScript, PHP, SQL, and MySQL.\
    \ See Appendix A, \"where to go from here,\" for debugging tips.\n- You'll want\
    \ to test any Ajax application in as many Web browsers on as many operating systems\
    \ as possible. By knowing how the application behaves under multiple settings,\
    \ you do your best to avoid excluding any users.\n- Firefox is, in my opinion,\
    \ the best browser to test Ajax applications in. It has a JavaScript console that\
    \ opens in another window for displaying JavaScript errors. This alone can be\
    \ a great help.\n\n## 4. adding records\n\nIn the first chapter we created the\
    \ database structure for this employee listing Web site. In the previous two chapters,\
    \ we developed an Ajax as well as a non-Ajax approach for browsing the employees\
    \ by department. In this chapter, let’s create a way to add employees to the database.\
    \ Naturally we’ll start with the non-Ajax version, for universal accessibility,\
    \ and then add the Ajax-enabled version in the next chapter.\n\nTo begin, we’ll\
    \ start by creating the **HTML form** that takes all the requisite data. Then\
    \ we’ll write the **PHP script** that handles the form submission in a non-Ajax\
    \ way. This will all be fairly basic PHP form handling.\n\n## what we'll do\n\n\
    1. First, on pages 45-48, we'll create an **HTML page with a form**.\n\nThe form\
    \ has elements representing all of the data that's stored in the database for\
    \ each employee.\n\nOn non-Ajax-enabled browsers, when the user clicks **Add**,\
    \ the form will be submitted to a PHP script.\n\n2. On pages 49-54, the **PHP\
    \ script** that handles the HTML form will be written. The **script validates\
    \ the form data** and reports on the results.\n\nIf any fields weren't properly\
