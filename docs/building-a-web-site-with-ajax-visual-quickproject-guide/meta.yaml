    \ standard at the time of this writing.\n\n- Internet Explorer versions 5 and\
    \ 6 didn't support a JavaScript **XMLHttpRequest** object. Instead they supported\
    \ an **ActiveX** object of type **XMLHTTP**. Unfortunately, if users with one\
    \ of these versions of Internet Explorer have disabled ActiveX support (enabling\
    \ it is a security risk), they cannot use Ajax-enabled applications like these.\n\
    \nbrowsing using Ajax\n\n39"
  mdcn: "\n**3** 为**ajax**对象提供应向其发送请求的页面名称。这里是**dept_results_ajax.php**，稍后会编写。该请求将使用**get**方法进行。\n\
    \n**4** 作为该请求的一部分，部门ID值（来自表单）将通过URL传递。\n\n```\najax.open('get', 'dept_results_ajax.php?did='\
