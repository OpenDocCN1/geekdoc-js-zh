  - '[PAGE 43]


    # # 3. browsing using Ajax


    In the previous chapter, we created the non-Ajax parts of the employee browsing
    pages. Although the focus in this book is on Ajax, it''s very important to have
    working, non-Ajax components in place for those who can''t take advantage of the
    lovely Ajax interface. In this chapter we''ll place the Ajax layer on top of the
    existing one.


    The Ajax components consist of three files: **one JavaScript file** that will
    provide **all-purpose, browser-safe Ajax functionality**; **another JavaScript
    file** that will provide **page-specific functionality**; and **one PHP script**
    script that will handle the **server-side needs** of the Ajax layer. To make these
    additions active, the main **HTML form** will be **slightly modified** as a last
    step.'
