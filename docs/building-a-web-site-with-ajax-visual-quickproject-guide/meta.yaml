    \ function.\n\n## validate the form data (cont.)\n\n```\nif (isset($_POST['department_id'])\
    \ && is_numeric($_POST['department_id']) && ($_POST['department_id'] > 0)) {\n\
    \    $did = (int) $_POST['department_id'];\n} else {\n    $errors[] = 'department';\n\
    }\n```\n\n4. **Numeric values**, like the department ID and the phone extension,\
    \ **must be positive numbers**.\n\n```\nif (isset($_POST['phone_ext']) && is_numeric($_POST['phone_ext'])\
    \ && ($_POST['phone_ext'] > 0)) {\n    $ext = (int) $_POST['phone_ext'];\n} else\
    \ {\n    $errors[] = 'phone extension';\n}\nmysql_close($dbc);\n...\n```\n\n5.\
    \ To make them safe to use in a query, **numeric values are type-cast** as integers.\n\
    \n6. Any failed validation routine results in an element being added to the **$errors**\
    \ array.\n\n## update the database\n\nAssuming that the form data passed all the\
    \ validation routines, an **INSERT** query should be run.\n\n1. If there were\
    \ no errors, this conditional will be true (because the **$errors** variable will\
    \ be empty).\n\n```\n...\n$errors[] = 'phone extension';\n}\nif (!$errors) {\n\
    \  $q = \"INSERT INTO employees VALUES (NULL, $did, '$fn', '$ln', '$e', $ext)\"\
    ;\n  $r = mysql_query($q, $dbc);\n  if (mysql_affected_rows($dbc) == 1) {\n  \
    \  echo '<p><strong>The employee has been added.</strong></p>';\n    mysql_close($dbc);\n\
    \  }\n  ...\n}\n```\n\n2. The **INSERT** query adds the new employee to the database\
    \ using the purified data from the validation routines. (See **extra bits** on\
    \ page 58.)\n\n3. The **mysql_affected_rows()** function returns the number of,\
    \ well, affected rows. For this script's query, the number of affected rows should\
    \ be 1, as one new record should be added.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_71_0.png)\n\
    \n4. The results are reported to the user.\n\n## report any errors\n\nFinally,\
    \ indicate to the user what problems occurred, if applicable.\n\n1. The first\
    \ **else** clause applies if the query did not result in one affected row. This\
    \ would normally be the result of a syntax error. (See **extra bits** on page\
    \ 58.)\n\n```\n...\necho '<p><strong>The employee has been added.</strong></p>';\n\
    } else { // Query failure.\n\techo '<p class=\"error\">The employee could not\
    \ be added due to a system error.</p>';\n}\n} else { // Errors!\n\techo '<p>The\
    \ following errors occurred:</p><ul class=\"error\">';\n\tforeach ($errors as\
    \ $e) {\n\t\techo \"<li>Please enter a valid $e.</li>\\n\";\n\t}\n\techo '</ul>';\n\
    }\nmysql_close($dbc);\n...\n```\n\n2. The second **else** clause applies if the\
    \ data didn't pass all the validation tests.\n\n### Add an Employee\n\nThe following\
    \ errors occurred:\n\n- Please enter a valid first name.\n- Please enter a valid\
    \ last name.\n- Please enter a valid email address.\n- Please enter a valid phone\
    \ extension.\n\n3. Because the errors are stored in an array, looping through\
    \ them is the easiest way to access them all.\n\nadding records\n\n## test the\
    \ non-Ajax version\n\n1. Load the **HTML page** in your Web browser to test what\
    \ we've created so far.\n\nThe address **must begin with http://** for this to\
    \ work.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_73_0.png)\n\n2. Fill out the\
    \ form **incompletely** and click **Add**.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_73_1.png)\n\
    \n3. The PHP page should show the results.\n\n## test the non-Ajax version (cont.)\n\
    \n4. Go back to the form, fill it out completely, and click **Add**.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_74_0.png)\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_74_1.png)\n\n5. Again, the PHP page\
    \ shows the results.\n\n## extra bits\n\n### add the form p. 46\n\n- The POST\
    \ method should generally be used when the form's submission should have an effect\
    \ on the site. For example, using the Add an Employee form adds another record\
    \ to the database.\n- The GET method should generally be used when requesting\
    \ information. For example, you should apply it when requesting the employees\
    \ in a specific department.\n\n### add the form elements p. 47\n\n- The form's\
    \ labels will serve two purposes. First, they indicate to the user what each form\
    \ element is for. Second, they'll be modified, using JavaScript, to indicate an\
    \ error in the Ajax-enabled version of this form.\n\n### validate the form data\
    \ p. 50\n\n- How you validate form data depends on the data's type (numbers, strings,\
    \ etc.) and expected values (positive number, email address, and so on). For validating\
    \ a person's name, it's often sufficient to make sure that some value is entered.\n\
    - A more thorough validation of an email address would be to confirm that it matches\
    \ a **regular expression pattern**. You can do this with email addresses more\
    \ so than names because they must abide by strict rules.\n- You could improve\
    \ the security of this system by applying PHP's **strip_tags()** function to the\
    \ text inputs. That function can help prevent cross-site scripting attacks (XSS).\n\
    - The **mysql_real_escape_string()** function provides language-specific protection\
    \ on text used in queries.\n\n### update the database p. 53\n\n- A more precise\
    \ way to write the INSERT query would be to use the syntax where you specify the\
    \ columns involved. For this query, that would be `INSERT INTO employees (department_id,\
    \ first_name, last_name, email, phone_ext) VALUES ($did, '$fn', '$ln', '$e', $ext)`.\n\
    \n### report any errors p. 54\n\n- To debug any PHP-MySQL problems, you'll need\
    \ to print out the query to inspect its syntax. You should also invoke the **mysql_error()**\
    \ function to see what problems the database reports.\n- Live sites should never\
    \ provide detailed behind-the-scenes errors, such as the queries being run or\
    \ the MySQL errors. Use this information for debugging purposes, and then hide\
    \ that information in the live version (which, we hope, shouldn't encounter such\
    \ errors).\n\nadding records"
  mdcn: "\n## 添加表单元素\n\n2. 一个**下拉菜单**将允许用户选择员工的部门。\n\n```\n<p><label class=\"title\"\
    \ id=\"department_id_label\">Department <select id=\"department_id\" name=\"department_id\"\
    >\n<option value=\"1\">Human Resources</option>\n<option value=\"2\">Accounting</option>\n\
    <option value=\"3\">Marketing</option>\n<option value=\"4\">Redundancy Department</option>\n\
    </select></label> </p>\n```\n\n3. 另一个**文本输入框**用于填写员工的电话分机号。\n\n```\n<p><label\
    \ class=\"title\" id=\"phone_ext_label\">Phone Extension <input type=\"text\"\
    \ id=\"phone_ext\" name=\"phone_ext\" /></label> </p>\n<p><input name=\"add\"\
    \ type=\"submit\" value=\"Add\" /></p>\n</form>\n...\n```\n\n4. **标签**被添加以指明每个元素的用途。（参见第\
    \ 57 页的**附加说明**。）\n\n5. **提交按钮**的值为 **Add**。\n\n6. 将此文件保存为 **add_employee.html**，并将其与所有其他网站页面放在同一目录中。\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_66_0.png)\n\n## 创建 PHP 页面\n\n第一个 PHP\
    \ 页面处理非 Ajax 的表单提交。它也应该是一个有效的 HTML 文档，因此以这些标签开始。\n\n```\n<!DOCTYPE html PUBLIC\
    \ \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\"\nlang=\"en\">\n\
    <head>\n    <meta http-equiv=\"content-type\" content=\"text/html;\n    charset=utf-8\"\
    \ />\n    <title>Add an Employee</title>\n    <style type=\"text/css\" media=\"\
    all\">@import \"style.css\";</style>\n</head>\n<body>\n<h1>Add an Employee</h1>\n\
    <?php # add_employee.php\nrequire_once('mysql.inc.php');\nmysql_close($dbc);\n\
    ?>\n</body>\n</html>\n```\n\n页面的所有功能都将放在 PHP 标签之间。\n\n此页面需要与 MySQL 通信，因此必须包含 **mysql.inc.php**\
    \ 脚本。\n\nMySQL 连接在脚本终止前关闭。\n\n此文件必须保存为 **add_employee.php**，并放置在与 **add_employee.html**\
    \ 相同的目录中。\n\n## 验证表单数据\n\n表单数据在查询中使用前必须经过验证。将此代码添加到 PHP 页面：\n\n```\n...\nrequire_once('mysql.inc.php');\n\
    $errors = array();\nif (!empty($_POST['first_name'])) {\n    $fn = mysql_real_escape_string($_POST['first_name'],\
    \ $dbc);\n} else {\n    $errors[] = 'first name';\n}\n```\n\n1. **$errors 数组**将存储在验证表单时遇到的任何错误。\n\
    \n2. 文本输入框将通过**确认其不为空**来进行验证。（参见第 57 页的**附加说明**。）\n\n```\nif (!empty($_POST['last_name']))\
    \ {\n    $ln = mysql_real_escape_string($_POST['last_name'], $dbc);\n} else {\n\
    \    $errors[] = 'last name';\n}\n```\n\n```\nif (!empty($_POST['email'])) {\n\
    \    $e = mysql_real_escape_string($_POST['email'], $dbc);\n} else {\n    $errors[]\
    \ = 'email address';\n}\n```\n\n3. 为确保数据在查询中安全使用，文本输入框需通过 **mysql_real_escape_string()**\
    \ 函数处理。\n\n## 验证表单数据（续）\n\n```\nif (isset($_POST['department_id']) && is_numeric($_POST['department_id'])\
    \ && ($_POST['department_id'] > 0)) {\n    $did = (int) $_POST['department_id'];\n\
    } else {\n    $errors[] = 'department';\n}\n```\n\n4. **数值**（如部门 ID 和电话分机号）**必须是正数**。\n\
    \n```\nif (isset($_POST['phone_ext']) && is_numeric($_POST['phone_ext']) && ($_POST['phone_ext']\
    \ > 0)) {\n    $ext = (int) $_POST['phone_ext'];\n} else {\n    $errors[] = 'phone\
    \ extension';\n}\nmysql_close($dbc);\n...\n```\n\n5. 为确保它们在查询中安全使用，**数值被类型转换**为整数。\n\
    \n6. 任何失败的验证例程都会导致一个元素被添加到 **$errors** 数组中。\n\n## 更新数据库\n\n假设表单数据通过了所有验证例程，则应运行\
    \ **INSERT** 查询。\n\n1. 如果没有错误，此条件将为真（因为 **$errors** 变量将为空）。\n\n```\n...\n$errors[]\
    \ = 'phone extension';\n}\nif (!$errors) {\n  $q = \"INSERT INTO employees VALUES\
    \ (NULL, $did, '$fn', '$ln', '$e', $ext)\";\n  $r = mysql_query($q, $dbc);\n \
    \ if (mysql_affected_rows($dbc) == 1) {\n    echo '<p><strong>The employee has\
    \ been added.</strong></p>';\n    mysql_close($dbc);\n  }\n  ...\n}\n```\n\n2.\
    \ **INSERT** 查询使用来自验证例程的净化数据将新员工添加到数据库。（参见第 58 页的**附加说明**。）\n\n3. **mysql_affected_rows()**\
    \ 函数返回受影响的行数。对于此脚本的查询，受影响的行数应为 1，因为应添加一条新记录。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_71_0.png)\n\
    \n4. 将结果报告给用户。\n\n## 报告任何错误\n\n最后，如果适用，向用户指明发生了什么问题。\n\n1. 第一个 **else** 子句适用于查询未导致一行受影响的情况。这通常是语法错误的结果。（参见第\
    \ 58 页的**附加说明**。）\n\n```\n...\necho '<p><strong>The employee has been added.</strong></p>';\n\
    } else { // Query failure.\n\techo '<p class=\"error\">The employee could not\
    \ be added due to a system error.</p>';\n}\n} else { // Errors!\n\techo '<p>The\
    \ following errors occurred:</p><ul class=\"error\">';\n\tforeach ($errors as\
    \ $e) {\n\t\techo \"<li>Please enter a valid $e.</li>\\n\";\n\t}\n\techo '</ul>';\n\
    }\nmysql_close($dbc);\n...\n```\n\n2. 第二个 **else** 子句适用于数据未通过所有验证测试的情况。\n\n###\
    \ 添加员工\n\n发生以下错误：\n\n- 请输入有效的名字。\n- 请输入有效的姓氏。\n- 请输入有效的电子邮件地址。\n- 请输入有效的电话分机号。\n\
    \n3. 由于错误存储在数组中，遍历它们是访问所有错误的最简单方法。\n\n添加记录\n\n## 测试非 Ajax 版本\n\n1. 在 Web 浏览器中加载\
    \ **HTML 页面**，以测试我们目前创建的内容。\n\n地址**必须以 http://** 开头才能正常工作。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_73_0.png)\n\
    \n2. **不完全**填写表单，然后点击 **Add**。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_73_1.png)\n\
    \n3. PHP 页面应显示结果。\n\n## 测试非 Ajax 版本（续）\n\n4. 返回表单，完整填写，然后点击 **Add**。\n\n![](img/64cd02e760894ad9ed3dde3e58139569_74_0.png)\n\
    \n![](img/64cd02e760894ad9ed3dde3e58139569_74_1.png)\n\n5. 同样，PHP 页面显示结果。\n\n\
    ## 附加说明\n\n### 添加表单 第 46 页\n\n- 当表单的提交应对网站产生影响时，通常应使用 POST 方法。例如，使用“添加员工”表单会向数据库添加另一条记录。\n\
    - 当请求信息时，通常应使用 GET 方法。例如，当请求特定部门的员工时，应应用此方法。\n\n### 添加表单元素 第 47 页\n\n- 表单的标签将有两个用途。首先，它们向用户指明每个表单元素的用途。其次，它们将通过\
    \ JavaScript 进行修改，以在启用 Ajax 的表单版本中指示错误。\n\n### 验证表单数据 第 50 页\n\n- 如何验证表单数据取决于数据的类型（数字、字符串等）和预期值（正数、电子邮件地址等）。对于验证人名，通常只需确保输入了某个值即可。\n\
    - 对电子邮件地址进行更彻底的验证是确认其匹配**正则表达式模式**。与姓名相比，你可以对电子邮件地址执行此操作，因为它们必须遵守严格的规则。\n- 通过对文本输入应用\
    \ PHP 的 **strip_tags()** 函数，可以提高此系统的安全性。该函数有助于防止跨站脚本攻击（XSS）。\n- **mysql_real_escape_string()**\
    \ 函数为查询中使用的文本提供特定语言的保护。\n\n### 更新数据库 第 53 页\n\n- 编写 INSERT 查询更精确的方式是使用指定相关列的语法。对于此查询，将是\
    \ `INSERT INTO employees (department_id, first_name, last_name, email, phone_ext)\
    \ VALUES ($did, '$fn', '$ln', '$e', $ext)`。\n\n### 报告任何错误 第 54 页\n\n- 要调试任何 PHP-MySQL\
    \ 问题，你需要打印出查询以检查其语法。你还应该调用 **mysql_error()** 函数以查看数据库报告的问题。\n- 正式上线的网站绝不应提供详细的幕后错误，例如正在运行的查询或\
    \ MySQL 错误。将这些信息用于调试目的，然后在正式版本中隐藏这些信息（我们希望该版本不会遇到此类错误）。\n\n添加记录\n"
