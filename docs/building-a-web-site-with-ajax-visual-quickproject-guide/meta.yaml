    \ xml:lang=\"en\" lang=\"en\">\n<head>\n  <meta http-equiv=\"content-type\" content=\"\
    text/html; charset=utf-8\" />\n  <title>按姓名搜索员工</title>\n  <style type=\"text/css\"\
    \ media=\"all\">@import \"style.css\";</style>\n</head>\n<body>\n<h1>员工搜索结果</h1>\n\
    <?php # search_results.php\n?>\n</body>\n</html>\n```\n\n页面的所有功能都将包含在 PHP 标签之间。\n\
    \n此文件必须保存为 `search_results.php`，并放置在与 `search_form.html` 相同的目录中。\n\n## 查询数据库\n\
    \n1 我们确保为姓氏提交了某个值，否则就没有必要查询数据库。\n\n2 包含 **MySQL 连接** 脚本。\n\n```\n...\n<?php #\
    \ search_results.php\nif (!empty($_GET['last_name'])) {\n\trequire_once('mysql.inc.php');\n\
    \t$q = \"SELECT CONCAT(last_name, ', ', first_name),\n\temail, department FROM\
    \ employees LEFT JOIN departments\n\tUSING (department_id) WHERE last_name LIKE\
    \ '\" . mysql_\n\treal_escape_string($_GET['last_name']) . \"%' ORDER BY\n\tlast_name,\
    \ first_name\";\n\t$r = mysql_query($q, $dbc);\n?>\n...\n```\n\n3 查询将返回所有姓氏以提交的字母开头的员工的\
    \ **姓名、电子邮件地址** 和 **部门**。（参见第 97 页的 **补充说明**。）\n\n4 **mysql_real_escape_string()**\
    \ 函数确保在查询中使用提交的值是安全的。\n\n## 打印结果\n\n+   1. 检查是否返回了 **至少一条记录**。\n\n```\n...\n$r\
    \ = mysql_query($q, $dbc);\nif (mysql_num_rows($r) > 0) {\n    while ($row = mysql_fetch_array($r,\
    \ MYSQL_NUM)) {\n        echo \"<p><span class=\\\"name\\\">$row[0]</span><br\
    \ />\n        <strong>Department</strong>: $row[2]<br />\n        <a href=\\\"\
    mailto:$row[1]\\\">$row[1]</a>\n        </p>\\n\";\n    } // WHILE 循环结束。\n}\n\
    ?>\n...\n```\n\n+   2. 获取 **所有记录** 并将它们打印出来。\n\n+   3. 员工的 **姓名** 将使用 CSS 类进行\
    \ **格式化**。\n\n+   4. 员工的 **电子邮件地址** 将被 **链接**，以便单击时可以开始向该人发送电子邮件。\n\n```\n<h1>员工搜索结果</h1>\n\
    <p><span class=\"name\">Gray, Gideon</span><br />\n    <strong>Department</strong>:\
    \ Accounting<br />\n    <a href=\"mailto:g.gray@thiscompany.com\">g.gray@thiscompany.com</a>\n\
    </p>\n<p><span class=\"name\">Green, Laverne</span><br />\n    <strong>Department</strong>:\
    \ Human Resources<br />\n    <a href=\"mailto:l.green@thiscompany.com\">l.green@thiscompany.com</a>\n\
    </p>\n</body>\n```\n\n# 报告任何错误\n\n+   1. 第一个 `else` 子句适用于查询运行正常但未返回任何结果的情况。\n\n\
    ```\n} // WHILE 循环结束。\n} else { // 没有员工。\n  echo '<p class=\"error\">没有匹配的员工。</p>';\n\
    }\nmysql_close($dbc);\n} else { // 无效的表单数据！\n  echo '<p class=\"error\">请在员工姓氏中输入至少几个字符。</p>';\n\
    }\n?>\n...\n```\n\n+   2. 关闭 **MySQL 连接**。\n\n+   3. 第二个 `else` 子句适用于表单填写不正确的情况。\n\
    \n## 员工搜索结果\n\n请在员工姓氏中输入至少几个字符。\n\n# 创建搜索\n\n## 测试非 Ajax 版本\n\n1. 在您的 Web 浏览器中加载\
    \ HTML 页面，以测试我们到目前为止创建的内容。地址 **必须以 http://** 开头才能正常工作。\n\n2. 输入一两个字母，然后点击 GO。\n\
    \n3. PHP 页面应该显示 **结果**。\n\n4. 返回表单，重复步骤 2 和 3，直到您满意为止。\n\n## 补充说明\n\n+   ## 添加表单（第\
    \ 91 页）\n- 在这个例子中，我建议用户只输入几个字母，因为数据库中只有 20 条记录。使用第 1 章“创建数据库”中输入的员工，输入 \"Gr\"\
    \ 会返回两条记录，但输入 \"Gre\" 只返回一条。如果您的数据库中有更多姓名，输入更长的值会更合适。\n- **GET** 方法通常用于搜索。下次您使用\
    \ Google 或其他搜索引擎时，请注意搜索词是通过 URL 传递的。\n\n+   ## 查询数据库（第 93 页）\n- 这是本书中最复杂的查询。它对两个表\
    \ **employees** 和 **departments** 执行 **连接**，这两个表通过 **department_id** 列连接。搜索功能得益于一个\
    \ **LIKE** 子句，该子句请求员工姓氏以表单中输入的任何字母开头的记录。\n- 通过另一个接口（如图像中的 **mysql 客户端**）运行动态生成的查询是一种很好的调试技术。这样做将确认查询是什么、它是否有效以及它的结果是什么。\n\
    \n# 7. 启用 Ajax 搜索\n\n作为本书项目的最后一部分，让我们将上一章创建的搜索进行 Ajax 改造。与其他章节一样，我们将在已创建内容的基础上添加一个\
    \ Ajax 层。支持 Ajax 的浏览器将无需重新加载页面即可查看搜索结果；其他所有浏览器将使用已有的系统。\n\n要完成此操作，需要 **修改 HTML\
    \ 页面**。然后我们需要创建一个包含此特定示例所有功能的 **新 JavaScript 文件**。并将编写一个 **新的 PHP 脚本**，以 XML 格式将搜索结果返回给\
    \ JavaScript。与本书中的其他 Ajax 示例不同，我们不会在 JavaScript 中使用 `innerHTML` 属性来更新网页。在这里，我们将通过向\
    \ **文档对象模型** 添加 **节点** 来操纵页面内容。\n\n# 我们将做什么\n\n1. 首先，在第 102 页，我们将 **修改 HTML 页面**\
    \ 以包含必要的 Ajax 部分。\n\n2. 用户输入员工姓氏的前几个字母并点击 **GO**。（参见第 124 页的 **补充说明**。）\n\n3.\
    \ 在支持 Ajax 的浏览器上，特定于页面的 JavaScript 将读取用户输入的内容，并将其提交到一个新的 PHP 脚本。在第 103-106 页，我们将开始编写启动此过程的\
    \ **JavaScript 文件**。\n\n4. 在第 107-110 页编写的 **PHP 脚本** 将在数据库中搜索姓名以提供的字母开头的员工。它将把任何匹配的记录作为\
    \ **XML 数据** 返回。\n\n5. JavaScript 将获取 **PHP 脚本返回的 XML** 并使用它来更新 HTML 页面。我们将在第\
    \ 111-122 页完成此 JavaScript 文件。\n\n6. 自然，我们将在第 123 页 **测试** 我们构建的内容，以确保一切正常。\n\n\
    7. 本章末尾的 **补充说明** 部分将提供更多关于所有这些步骤的信息、提示和建议。\n"
