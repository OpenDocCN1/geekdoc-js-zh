  md: '# # Ajax issues


    Ajax is a wonderful technology that can greatly enhance a user''s Web experience,
    but it''s not perfect. In particular, you should be aware of the following limitations:


    +   1. If a user''s browser does not **support JavaScript**, Ajax is useless.
    (See **extra bits** on page 146.)

    2. The results of Ajax-enabled pages **cannot be bookmarked** without taking extra
    steps.

    3. The user **cannot use the back button or** their browser''s **history** to
    review previous results (again without taking extra steps).

    4. **Search engines** cannot index Ajax pages.

    5. Ajax applications can be more **demanding of the browser**.

    6. Because Ajax pages change the standard client-server relationship, their use
    may be **confusing for the end user**.

    7. Ajax requires that the user **be online** the entire time.'
  merge: -1
