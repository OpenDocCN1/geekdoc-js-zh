    \ 会用结果填充该部分并使其可见。所有这些都在 Ajax 层中进行，这将在下一章创建。\n\n## 测试页面 p. 21\n\n- 所有 PHP 页面必须通过\
    \ URL 运行才能工作。因此，HTML 表单也必须通过 URL 运行（地址必须以 **http://** 开头）。如果地址以 **file://** 开头，处理该表单的\
    \ PHP 脚本将无法正常工作。\n\n- 让这三个组件正常工作是为 Ajax 功能层打下的完美基础。调试这些页面比加入 JavaScript 和其他技术后要容易得多。\n\
    \n- 调试 PHP 可能是初学者最难学的技能——不幸的是，初学者最终将进行最多的调试（这是一种\"火中取栗\"的情况）。如果你在让这此页面正常工作时遇到问题，请参阅本书的网站\
    \ **www.dmcinsights.com/ajax/** 获取帮助。\n\n24\n\n浏览员工信息\n\n### 3. 使用 Ajax 浏览\n\n\
    在上一章中，我们创建了员工浏览页面的非 Ajax 部分。虽然本书的重点是 Ajax，但为那些无法使用出色的 Ajax 界面的用户准备好可用的非 Ajax 组件是非常重要的。在本章中，我们将在现有基础上添加\
    \ Ajax 层。\n\nAjax 组件由三个文件组成：**一个 JavaScript 文件**，提供**通用的、浏览器兼容的 Ajax 功能**；**另一个\
    \ JavaScript 文件**，提供**页面特定的功能**；以及**一个 PHP 脚本**，处理 Ajax 层的**服务器端需求**。作为最后一步，主\
    \ **HTML 表单**将进行**轻微修改**以使这些新增功能生效。\n\n## 我们将要做什么\n\n1. 首先，在第 27-28 页，我们将创建一个\
    \ **JavaScript 文件**，用于生成特定浏览器支持的 Ajax 对象。该对象将供任何需要 Ajax 功能的页面使用。\n\n2. 在第 29-31\
    \ 页，将开始编写**第二个 JavaScript 文件**，定义与示例中员工浏览方面相关的功能。\n\n3. 在第 32-34 页，将编写**一个新的 PHP\
    \ 脚本**。该脚本将把 Ajax 请求的结果返回给 JavaScript。\n\n4. 在第 35 和 36 页，**第二个 JavaScript 页面将被完成**，处理\
    \ PHP 请求并更新 HTML 页面。\n\n5. 接下来，在第 37 页 rude修改 **HTML 页面**以包含 Ajax 层。\n\n6. 作为最后一步，在第\
    \ 38 页我们将**测试**我们所构建的内容，以确保一切正常。\n\n在本章末尾的 **额外知识点** 部分，你将找到有关所有这些步骤的更多信息、建议和推荐。\n\
    \n## 创建一个函数\n\n一个 JavaScript 文件将包含用于建立通用 Ajax 功能的所有代码。使用任何文本编辑应用程序来创建一个新的 JavaScript\
    \ 文档。（请参阅第 39 页的 **额外知识点**。）\n\n```\nfunction getXMLHttpRequestObject() {\n  \
    \  var ajax = false;\n}\n```\n\n1. 该 JavaScript 函数名为 **getXMLHttpRequestObject()**（名字很长但描述性很强）。此函数创建一个特定浏览器的\
    \ XMLHttpRequest 对象，存储在变量 **ajax** 中。\n\n2. 该函数起初假设没有 Ajax 支持（**ajax** 变量用布尔值\
    \ **false** 初始化）。在函数的其余部分中，浏览器需要\"证明\"它们可以利用 Ajax 功能。\n\n## 检查 Ajax 支持\n\n在函数内部，检查浏览器支持哪种类型的\
    \ XMLHttpRequest 对象。如果浏览器支持特定类型的 XMLHttpRequest 对象，则将 **ajax** 变量设为该类型的对象。（请参阅第\
    \ 39 页的 **额外知识点**。）\n\n1. 大多数 Web 浏览器——Apple 的 Safari 1.2 及更高版本、Mozilla 和 Firefox、Opera\
    \ 8 及更高版本，以及较新版本的 Internet Explorer——应满足这第一个条件。\n\n```\nfunction getXMLHttpRequestObject()\
    \ {\n  var ajax = false;\n  if (window.XMLHttpRequest) {\n    ajax = new XMLHttpRequest();\n\
    \  } else if (window.ActiveXObject) {\n    try {\n      ajax = new ActiveXObject(\"\
    Msxml2.XMLHTTP\");\n    } catch (e) {\n      try {\n        ajax = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n      } catch (e) { }\n    }\n  }\n  return ajax;\n}\n\
    ```\n\n2. 较旧版本的 Internet Explorer（启用了 ActiveX 的）应通过这两行代码之一获取 XMLHttpRequest 对象。\n\
    \n3. 最后，此函数返回 **ajax** 变量。\n\n4. 将此文件保存为 **ajax.js**，并将其放在 Web 服务器上与其他所有文件相同的目录中。\n\
    \n## 调用该函数\n\n**ajax.js** 文件定义了一个创建 **XMLHttpRequest** 对象的函数，但它实际上并没有使用该对象。另一个\
    \ JavaScript 文件将为每个特定实例执行此操作，例如已经创建的 HTML 表单。使用任何文本编辑应用程序来创建一个新的 JavaScript 文档。（请参阅第\
    \ 40 页的 **额外知识点**。）\n\n1. 第一行告诉 Web 浏览器在加载整个页面后运行 **init()** 函数。**init()** 函数设置所有\
    \ Ajax 活动。\n\n```\nwindow.onload = init;\nfunction init() {\n    var ajax = getXMLHttpRequestObject();\n\
    \    if (ajax) {\n    } // End of ajax IF.\n} // End of init() function.\n```\n\
    \n2. **init()** 函数调用 **getXMLHttpRequestObject()** 函数以获取有效的、特定于浏览器的对象。\n\n3. **init()**\
    \ 函数然后检查 **ajax** 变量是否具有有效值。在支持的浏览器中，**ajax** 将是一个 **XMLHttpRequest** 对象。在不支持的浏览器中，**ajax**\
    \ 的值将为 **false**，此条件将为假。\n\n## 设置 Ajax\n\n现在，JavaScript 应该告诉浏览器在发生某些事件时应采取什么行动。（请参阅第\
    \ 40 页的 **额外知识点**。）\n\n**1** `init()` 函数接下来检查浏览器是否支持 **文档对象模型（DOM）**，特别是页面是否有一个\
    \ **id** 为 **results** 的元素。\n\n```\n... if (ajax) {\n    if (document.getElementById('results'))\
    \ {\n        document.getElementById('dept_form').onsubmit = function() {\n  \
    \          var did = document.getElementById('did').value;\n```\n\n**2** 如果浏览器支持，则会为表单（其\
    \ **id** 值为 **dept_form**）附加一个 `onsubmit()` 事件。换句话说，当表单提交时，执行以下操作...\n"
