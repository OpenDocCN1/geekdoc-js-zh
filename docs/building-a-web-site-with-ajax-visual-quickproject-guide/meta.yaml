    \n重要的代码片段，如变量、函数和命令，以及概念，都会被**强调**。\n\n![图书页面结构元素示意图](img/64cd02e760894ad9ed3dde3e58139569_12_0.png)\n\
    \n每章末尾的**额外提示**部分包含你可能想了解的各种技巧和窍门。每组提示的**标题**与章节标题相匹配。标题旁的**页码**可以方便你找到这些提示所属的章节。\n\
    \n## 额外提示（续）\n\n### 准备表单数据 _第 65 页_\n\n- 当使用 GET 方法提交表单时，你会在 URL 中看到表单数据，语法为 `page.php?this_item=this_value&that_item=that_value`。这与\
    \ POST 发送的数据相同，但数据不会显示在 URL 中，也不需要问号。\n- 所有表单数据都需要通过 `encodeURIComponent()` 函数处理，以确保安全发送到服务器。对于表单数据，你可以单独对每个值应用该函数，但使用\
    \ `for` 循环遍历表单元素数组，可以用更少的代码实现同样的效果。\n- JavaScript 中的**加号**用于执行**连接**操作——将一个字符串追加到另一个字符串末尾。在\
    \ PHP 中，句点（.）有同样的作用。\n- 如果你想向 PHP 脚本发送 XML 数据，需要将 Content-Type 设置为 `text/xml`。\n\
    \n### 完成函数 _第 66 页_\n\n- 使用 GET 方法时，调用 `send()` 时只需使用 `null` 作为唯一参数。通过 GET 发送的任何数据都会附加到\
    \ URL 本身。使用 POST 时，你需要在调用 `send()` 时提供数据，因为数据不会通过 URL 发送。\n\n### 准备 XML _第 67\
    \ 页_\n\n- PHP 脚本以 XML 数据（而非普通网页）的形式发送响应。PHP 输出的所有内容都将是该 XML 的一部分。\n- 正在创建的 XML\
    \ 数据实际上类似于 HTML 页面中的数据，其中有一个根元素和任意数量的嵌套子元素。在这个例子中，根元素将命名为 `data`，并有两个子元素。可以有零个或多个名为\
    \ `error` 的元素，并且始终会有一个名为 `result` 的元素。相比之下，HTML 页面有一个名为 `html` 的根元素、两个名为 `head`\
    \ 和 `body` 的子元素，以及更多嵌套在这些元素中的子元素。\n\n## 所需工具\n\n本书涵盖了 Ajax 的基础知识，但不涉及 Web 开发的基础。我们假定你已经拥有并知道如何使用某些工具和技术。\n\
    \n![工具示意图](img/64cd02e760894ad9ed3dde3e58139569_14_0.png)\n\n**文本编辑器、集成开发环境**（IDE）或**所见即所得**（WYSIWYG）编辑器是必须的。这可能是\
    \ Macintosh 上的 BBEdit（我个人最喜欢的文本编辑器）、Windows 上的记事本、Eclipse（一个流行的开源 IDE）或 Dreamweaver（一个流行的商业\
    \ WYSIWYG 应用程序）。只要是可以用来创建和编辑纯文本文件的工具，具体使用什么并不重要。\n\n第二个要求是**网页浏览器**，但如果你有一台电脑，你肯定有一个。由于\
    \ Ajax 可能存在浏览器特定的问题，如果可能的话，你最好在不同的操作系统上安装**多种不同的浏览器**。我在 Windows（XP）上的 Internet\
    \ Explorer 和 Firefox 以及 Mac OS X 上的 Safari、Firefox 和 Opera 中测试了本书的示例。\n\n我强烈建议你使用\
    \ **Firefox** 进行开发和初始测试，因为它比 Internet Explorer 稳定得多，并且有许多很棒的调试工具。\n\n![Firefox\
    \ 标志](img/64cd02e760894ad9ed3dde3e58139569_15_0.png)\n\n最高级的要求是**支持 PHP 的 Web\
    \ 服务器**。你需要通过 Apache、Microsoft 的 Internet Information Server 或其他 Web 服务器运行 PHP。这可以是你自己的计算机或托管服务器。如果你不知道\
    \ PHP 是什么，在打开这本书之前，你可能应该先查看我的一本 PHP 书籍（参见\"下一步\"中的推荐）。\n\n## 所需工具（续）\n\n如果你使用的是托管服务器，你需要一个\
    \ **FTP**（文件传输协议）应用程序或类似的选项，用于将文件从你的计算机上传到服务器。\n\n最后，你需要 **MySQL** 或其他数据库应用程序。它应该与\
    \ PHP 在同一台计算机上。如果你不知道 MySQL 是什么，同样请参阅\"下一步\"来查看我的一本 MySQL 书籍。如果你想使用不同的数据库应用程序，你需要相应地修改一些\
    \ PHP 代码，可能还需要修改 SQL 命令。\n\n## 配套网站\n\n本书的配套网站可以在 www.DMCInsights.com/ajax/ 找到。\n\
    \n![配套网站截图](img/64cd02e760894ad9ed3dde3e58139569_17_0.png)\n\n前往 **downloads**\
    \ 区域获取本书的所有代码，这样你就不用手动输入了。\n\n阅读本书后，请查看 **extras** 部分以获取更多信息、示例的其他版本等。\n\n如果你有问题或需要任何帮助，请前往\
    \ **forum**。\n\n## 下一步\n\n本书的重点是创建一个非常好且可用的支持 Ajax 的应用程序。其中涉及多种技术，最重要的是 JavaScript。\n\
    \n![JavaScript 书籍封面](img/64cd02e760894ad9ed3dde3e58139569_18_0.png)\n\n![PHP 和\
