    \">$row[0]</span><br />\n        <strong>Department</strong>: $row[2]<br />\n\
    \        <a href=\\\"mailto:$row[1]\\\">$row[1]</a>\n        </p>\\n\";\n    }\
    \ // End of WHILE loop.\n}\n?>\n...\n```\n\n+   2. Fetch **all the records** and\
