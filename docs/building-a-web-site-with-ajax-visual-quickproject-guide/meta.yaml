    \ to server version: 5.0.21-max\n\nType 'help;' or '\\h' for help. Type '\\c'\
    \ to clear the buffer.\n\nmysql> \n```\n\n![MySQL 命令行登录截图](img/64cd02e760894ad9ed3dde3e58139569_20_0.png)\n\
    \n如果你在远程服务器上运行 MySQL，或者只是不想使用命令行，可以在 Web 浏览器中**使用 phpMyAdmin**。它必须已经预先配置好才能访问\
    \ MySQL。\n"
