    2. On Ajax-enabled browsers, when the user clicks **Add**, the page-specific JavaScript
    will read in all the form data and submit it to a new PHP script. On pages 63-66,
    we''ll begin the **JavaScript file** that starts this process.

    3. The **PHP script**, written on pages 67-74, will validate all the data and
