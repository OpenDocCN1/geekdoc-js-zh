    ![](img/64cd02e760894ad9ed3dde3e58139569_18_0.png)


    ![](img/64cd02e760894ad9ed3dde3e58139569_18_1.png)


    For more discussion of PHP, MySQL, SQL, and XML, see some of my other books. A
