  md: '# 7. enabling an Ajax search


    As the last piece in this book’s project, let’s take the search created in the
    previous chapter and give it the old Ajax treatment. As in other chapters, we’ll
    add an Ajax layer on top of what we’ve already created. Browsers that are Ajax-supportive
    will see the search results without reloading the page; every other browser will
    use the system already in place.


    Accomplishing this will require **modifying the HTML page**. Then we’ll need to
    make a **new JavaScript file** that contains all the functionality for this specific
    example. And a **new PHP script** will be written that returns the search results,
    in XML format, to the JavaScript. Unlike the other Ajax examples in this book,
    we won’t use the `innerHTML` attribute in our JavaScript to update the Web page.
    Here, we’ll add **nodes** to the **Document Object Model** as a way of manipulating
    the page’s content.'
