    - All of the form data needs to be run through the `encodeURIComponent()` function
    to make it safe to send to the PHP page. Rather than apply that function to each
    value separately, using a **for** loop on an array of form elements lets us accomplish
    the same thing with less code.

    - The **plus sign in JavaScript** is used to perform **concatenation**: appending
    one string onto another. In PHP, the period does the same thing.

    - If you wanted to send XML data to the PHP script, you would set the **Content-Type**
    to `text/xml`.


    # complete the function p. 66


    +   - When using the **GET** method, use the value **null** as the only argument
    when calling **send()**. Any data sent over GET is appended to the URL itself.
    When using **POST**, you need to provide the data when you call **send()**, as
    it’s not sent in the URL.


    # prepare for XML p. 67


    +   - The PHP script sends its response as XML data, not as a normal Web page.
    Everything PHP will print will be part of this XML.

    - The XML data being created is really like the data in an HTML page, where there’s
    one root element and any number of nested subelements. For this example, the root
    element will be called **response** and there will be two subelements. There can
    be zero or more elements called **error** and there will always be exactly one
    element called **result**. In comparison, an HTML page has a root element called
    **html**, two subelements named **head** and **body**, and more subelements within
    those.


