    \ ajax = getXMLHttpRequestObject();\n```\n\n2. 该函数调用 **getXMLHttpRequestObject()**\
    \ 函数以获取一个有效的、浏览器特定的对象。此函数在 **ajax.js** 中定义，HTML 页面已经包含了该文件。\n\n3. 然后该函数检查 `ajax`\
    \ 变量是否具有有效值。在支持的浏览器中，`ajax` 将是一个 **XMLHttpRequest** 对象。在不支持的浏览器中，`ajax` 的值将为 `false`，此条件判断将为假。\n\
    \n```javascript\nif (ajax) {\n    if (document.getElementById('results')) {\n\
    \        document.getElementById('emp_form').onsubmit =\nfunction() {\n```\n\n\
    4. 接下来，该函数检查浏览器是否支持**文档对象模型（DOM）**，具体来说，检查页面中是否存在 `id` 为 **results** 的元素。\n\n\
    5. 最后，将一个 `onsubmit()` 事件附加到表单上（该表单的 `id` 值为 **emp_form**）。换句话说，当表单被提交时，执行以下操作....\n\
    \n## 设置 Ajax\n\n```javascript\n...\ndocument.getElementById('emp_form').onsubmit\
