  - '[PAGE 29]


    # # 2. browsing employees


    This book’s example contains three facets: browsing employees by department, adding
    employees, and searching for employees by last name. For each section, we’ll create
    a non-Ajax version, and then apply the Ajax elements on top. In this chapter,
    we’ll make a non-Ajax way to browse employees. To do so, we’ll create **one HTML
    page**, **two PHP scripts**, and a **CSS style sheet**.


    The non-Ajax pages can act as a model for how the Ajax layer should behave, and
    more importantly, if anyone accessing this site cannot use the Ajax-enabled pages,
    the site will still be fully functional for them. Also, two of the files generated
    in this chapter—one PHP script and the CSS document—will be used by all of this
    book’s examples, Ajax and non-Ajax alike.


    You may find it easiest to follow along by first downloading all the code from
    the book’s corresponding Web site (**www.dmcinsights.com/ajax/**).'
  - '[PAGE 30]


    # # what we''ll do


    +   1. **First, on pages 13-14, we''ll create a simple HTML form.**


    The HTML form will have a **drop-down menu listing the departments.** These values
    will match those inserted into the database in Chapter 1, "creating the database."


    ![](img/64cd02e760894ad9ed3dde3e58139569_30_0.png)


    When the user clicks **GO**, the form will be submitted to a PHP script.


    +   2. **On pages 15-17, the PHP script that handles the HTML form will be written.**


    The **script shows the employees** for the department selected in the HTML form.
    These employees come from the database created in Chapter 1.


    ![](img/64cd02e760894ad9ed3dde3e58139569_30_1.png)


    +   3. **Because the PHP page''s results come from a database, a special PHP script
    will be written on pages 18 solely for the purpose of connecting to the database.**


    +   4. **On pages 19-20, a very simple style sheet will be made and added to the
    HTML page, giving the Web pages a slightly (but only slightly) more attractive
    appearance.**


    +   5. **As a last step, we''ll test what we''ve built to make sure it all works.**


    At the end of this chapter, in the **extra bits** section, you''ll find more information,
    tips, and recommendations regarding all of these steps.'
- md: "## create an HTML page\n\nThe very first step in the Ajax application is a\
    \ basic HTML form. Use any text editing application to make a new HTML document.\
    \ (See **extra bits** on page 22.)\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
    \ XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:\nlang=\"en\" lang=\"en\"\
    >\n<head>\n<meta http-equiv=\"content-type\" content=\"text/html;\ncharset=utf-8\"\
    \ />\n<title>Employees by Department</title>\n</head>\n<body>\n<!-- dept_form.html\
    \ -->\n</body>\n</html>\n```\n\nAll this jibberish is just the framework of an\
    \ HTML page. The only bit of text here that will be apparent to the end user is\
    \ the `<title>` value, which shows up in the top of the user's Web browser (see\
    \ the figure on page 12).\n\nSave this file as **dept_form.html** and place it\
    \ in a directory on your Web server.\n\n## add the HTML form\n\nJust before the\
    \ form, **add instructions for the user**.\nThe value for the form's **action**\
    \ should be the name of the PHP script that will handle this form. Set the **method**\
    \ as **get**. Give the form a meaningful **id** value. (See **extra bits** on\
    \ page 22.)\n\n```html\n<body>\n<!-- dept_form.html -->\n<p>Select a department\
    \ and click 'GO' to see the employees in that department.</p>\n<form action=\"\
    dept_results.php\" method=\"get\" id=\"dept_form\">\n    <p>\n        <select\
    \ id=\"did\" name=\"did\">\n            <option value=\"1\">Human Resources</option>\n\
    \            <option value=\"2\">Accounting</option>\n            <option value=\"\
    3\">Marketing</option>\n            <option value=\"4\">Redundancy Department</option>\n\
    \        </select>\n        <input name=\"go\" type=\"submit\" value=\"GO\" />\n\
    \    </p>\n</form>\n</body>\n```\n\nThe form contains a **select menu**, listing\
    \ the departments. The value of each option is the department number from the\
    \ database. The **name** and **id** of this form element must be **did** (short\
    \ for department ID).\nThe form needs a **submit button**, too.\n\n## start a\
    \ PHP page\n\nThe main PHP page handles the form submission. It should also be\
    \ a valid HTML document, so start with those tags. (See **extra bits** on page\
    \ 22.)\n\n```php\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\
    \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xml:\nlang=\"en\" lang=\"en\">\n<head>\n  <meta http-equiv=\"content-type\"\
    \ content=\"text/html;\ncharset=utf-8\" />\n  <title>Employees by Department</title>\n\
    </head>\n<body>\n<h1>Department Employees</h1>\n<?php # dept_results.php\n?>\n\
    </body>\n</html>\n```\n\nAll of the page's functionality will go in between the\
    \ PHP tags.\nThis file must be saved as **dept_results.php** and placed in the\
    \ same directory as **dept_form.html**.\n\n## print the employees\n\n1. Within\
    \ the PHP tags, start by making sure that a **valid department ID** was received.\
    \ The department ID must be an **integer greater than 0**. (See **extra bits**\
    \ on page 23.)\n\n```php\n...\n<?php # dept_results.php\n$did = 0;\nif (isset($_GET['did']))\
    \ {\n    $did = (int) $_GET['did'];\n}\nif ($did > 0) {\n    require_once('mysql.inc.php');\n\
    \    $q = \"SELECT * FROM employees WHERE department_\nid=$did ORDER BY last_name,\
    \ first_name\";\n    $r = mysql_query($q, $dbc);\n    if (mysql_num_rows($r) >\
    \ 0) {\n        while ($row = mysql_fetch_array($r, MYSQL_ASSOC))\n        {\n\
    \            echo \"<p><span class=\\\"name\\\">{$row['last_\nname']}, {$row['first_name']}</span><br\
    \ />\n<strong>Email</strong>: {$row['email']}<br />\n<strong>Phone Extension</strong>:\
    \ {$row['phone_\next']}\n</p>\\n\";\n        }\n    }\n}\n```\n\n2. Then **include\
    \ the database connection script** (to be written next).\n\n3. Query the **database**,\
    \ looking for employees in the given department.\n\n4. **Fetch any returned records\
    \ and print them** with a little bit of HTML and CSS formatting.\n\n## report\
    \ on any errors\n\nThe PHP script should let the user know if an error occurred.\
    \ **Complete the two IF conditionals** created in the previous steps.\n\n```php\n\
    ...\n</p>\\n\";\n  }\n} else {\n  echo '<p class=\"error\">There are no employees\
    \ listed for the given department.</p>';\n  }\n} else {\n  echo '<p class=\"error\"\
    >Please select a valid department from the drop-down menu in order to view its\
    \ employees.</p>';\n}\n?>\n```\n\n1. The first **else** clause will apply if the\
    \ database query **didn't return any results**.\n2. The second **else** clause\
    \ will apply if the PHP script **did not receive a valid department ID**.\n\n\
    ## connect to the database\n\nCreate a new, blank PHP script that connects to\
    \ the database. This script does not require the basic HTML tags. (See **extra\
    \ bits** on page 23.)\n\n1. The script first tries to **connect to MySQL**. The\
    \ **username** and **password** values must match an existing MySQL user. **Change\
    \ these values** in this code to match the appropriate user for your MySQL server.\n\
    2. The script then attempts to **select the ajax database**. This is the name\
    \ of the database created in Chapter 1.\n\n```php\n<?php # mysql.inc.php\n$dbc\
    \ = @mysql_connect ('localhost', 'username',\n'password');\nif (!$dbc OR !mysql_select_db\
    \ ('ajax')) {\n  echo '<p class=\"error\">The site is currently\nexperiencing\
    \ technical difficulties. We apologize for any\ninconvenience.</p>';\n  exit();\n\
    }\n?>\n```\n\n3. Error messages are printed if either attempt fails. If so, the\
    \ script then terminates because there's no need to go on without a database connection.\n\
    4. Save this file as **mysql.inc.php** and place it in the same directory on your\
    \ Web server as **dept_form.html**.\n\n## create a style sheet\n\nThe CSS style\
    \ sheet is a separate document that dictates how the pages look. Create a new\
    \ file in your test editor or IDE, containing this code. (See **extra bits** on\
    \ page 24.)\n\n```css\nbody {\n    font-family: sans-serif;\n}\n.name {\n    font-weight:\
    \ bold;\n    text-transform: uppercase;\n    color: #009;\n}\n.error {\n    font-weight:\
    \ bold;\n    color: #C00\n}\n#results {\n    border: medium solid #390;\n    display:\
    \ none;\n    padding-left: 10px;\n    width: 300px;\n}\n```\n\nThe **body** section\
    \ sets the default font for the entire HTML page.\n\nThe second section formats\
    \ text with a **class value of name**. That would be the employee’s name in the\
    \ listing of results in **dept_results.php**.\n\nThe third section applies some\
    \ formatting to **any errors** (which will have a **class value of error**), like\
    \ those created in both PHP scripts.\n\nThe final section applies to any block\
    \ with an **id value of results**. You’ll use this when adding the Ajax layer\
    \ in the next chapter.\n\nSave this file as **style.css** and place it in the\
    \ same directory on your Web server as every other file.\n\n## use the style sheet\n\
    \nFor the style sheet to be used, it must be referenced in the HTML and PHP pages.\
    \ Do so by adding a line to the `<head>` section of both files:\n\n```html\n...\n\
    <title>Employees by Department</title>\n<style type=\"text/css\" media=\"all\"\
    >@import \"style.css\";</style>\n</head>\n<body>\n...\n```\n\nThe style sheet\
    \ is mostly cosmetic. The non-Ajax layer will work perfectly fine without it,\
    \ but it won't look as nice.\n\n## test the pages\n\n1. Load the **HTML page**\
    \ in your Web browser to test what we've created so far.\n\nThe address **must\
    \ begin with http://** for this to work. (See **extra bits** on page 24.)\n\n\
    2. Select a department and click **GO**.\n3. The PHP page should show the results.\n\
    \n## extra bits\n\n### create an HTML page p. 13\n\n- HTML, JavaScript, CSS, and\
    \ PHP can be written in nearly any application. I prefer to use a simple text\
    \ editor (specifically, BBEdit on Mac OS X), but use what you like. People who\
    \ focus on Web development often like a WYSIWYG (What You See Is What You Get)\
    \ tool like Dreamweaver. PHP developers sometimes lean toward IDEs (integrated\
    \ development environments) like Eclipse, NuSphere’s PhpED, or Zend Studio.\n\
    - For the HTML in this book, I’ll be using the **XHTML 1.0 Strict** standard.\
    \ For more information on this, see a dedicated HTML resource, like Elizabeth\
    \ Castro’s most excellent HTML, XHTML, & CSS: Visual QuickStart Guide, Sixth Edition\
    \ (ISBN-13: 978-0321430847).\n- Both the Ajax and non-Ajax versions of this example\
    \ use PHP, which means that **you must have a PHP-enabled Web server** to test\
    \ the examples on. This can be your own computer, if you’ve installed PHP, or\
    \ a remotely hosted Web site, if you have one of those.\n- For the sake of simplicity,\
    \ every file created in this book will just go in the same folder on the server.\n\
    \n### add the HTML form p. 14\n\n- When it comes to handling HTML forms, the **action**\
    \ and the **method** are the two most important considerations. The **action**\
    \ tells the browser to what page the form data should be sent. The **method**\
    \ tells the browser how that data should be sent. The **get** method sends the\
    \ data in the URL.\n- Normally I would have PHP dynamically generate any drop-down\
    \ menu that corresponds to a database table. I’m saving steps by not doing so\
    \ here.\n\n### start a PHP page p. 15\n\n- PHP is a server-side language used\
    \ to dynamically generate HTML code (among other purposes). Anything within the\
    \ PHP tags—`<?php` and `?>`—will be treated as PHP code. Anything outside of those\
    \ tags will immediately be sent to the Web browser and treated as HTML.\n\n###\
    \ browsing employees"
  mdcn: "\n## 创建 HTML 页面\n\nAjax 应用的第一步是创建一个基本的 HTML 表单。使用任意文本编辑应用新建一个 HTML 文档。（参见第\
    \ 22 页的**补充说明**。）\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\
    \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xml:\nlang=\"en\" lang=\"en\">\n<head>\n<meta http-equiv=\"content-type\" content=\"\
    text/html;\ncharset=utf-8\" />\n<title>按部门划分的员工</title>\n</head>\n<body>\n<!--\
    \ dept_form.html -->\n</body>\n</html>\n```\n\n所有这些看似杂乱的字符只是 HTML 页面的框架。这里唯一对终端用户可见的文本是\
    \ `<title>` 的值，它会显示在用户 Web 浏览器的顶部（参见第 12 页的图示）。\n\n将此文件保存为 **dept_form.html**，并将其放置在\
    \ Web 服务器的某个目录中。\n\n## 添加 HTML 表单\n\n在表单之前，**为用户添加说明**。\n表单的 **action** 属性值应该是处理此表单的\
    \ PHP 脚本的名称。将 **method** 设置为 **get**。为表单赋予一个有意义的 **id** 值。（参见第 22 页的**补充说明**。）\n\
    \n```html\n<body>\n<!-- dept_form.html -->\n<p>选择一个部门并点击“GO”以查看该部门的员工。</p>\n<form\
    \ action=\"dept_results.php\" method=\"get\" id=\"dept_form\">\n    <p>\n    \
    \    <select id=\"did\" name=\"did\">\n            <option value=\"1\">人力资源部</option>\n\
    \            <option value=\"2\">会计部</option>\n            <option value=\"3\"\
    >市场部</option>\n            <option value=\"4\">冗员部</option>\n        </select>\n\
    \        <input name=\"go\" type=\"submit\" value=\"GO\" />\n    </p>\n</form>\n\
    </body>\n```\n\n该表单包含一个**下拉选择菜单**，列出了各个部门。每个选项的值是来自数据库的部门编号。此表单元素的 **name** 和\
    \ **id** 必须是 **did**（部门 ID 的缩写）。\n表单还需要一个**提交按钮**。\n\n## 开始创建 PHP 页面\n\n主要的 PHP\
    \ 页面处理表单提交。它也应该是一个有效的 HTML 文档，因此从那些标签开始。（参见第 22 页的**补充说明**。）\n\n```php\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:\nlang=\"en\" lang=\"en\"\
    >\n<head>\n  <meta http-equiv=\"content-type\" content=\"text/html;\ncharset=utf-8\"\
    \ />\n  <title>按部门划分的员工</title>\n</head>\n<body>\n<h1>部门员工</h1>\n<?php # dept_results.php\n\
    ?>\n</body>\n</html>\n```\n\n页面的所有功能都将置于 PHP 标签之间。\n此文件必须保存为 **dept_results.php**，并放置在与\
    \ **dept_form.html** 相同的目录中。\n\n## 打印员工信息\n\n1.  在 PHP 标签内，首先确保接收到了一个**有效的部门 ID**。部门\
    \ ID 必须是一个**大于 0 的整数**。（参见第 23 页的**补充说明**。）\n\n```php\n...\n<?php # dept_results.php\n\
    $did = 0;\nif (isset($_GET['did'])) {\n    $did = (int) $_GET['did'];\n}\nif ($did\
    \ > 0) {\n    require_once('mysql.inc.php');\n    $q = \"SELECT * FROM employees\
    \ WHERE department_\nid=$did ORDER BY last_name, first_name\";\n    $r = mysql_query($q,\
    \ $dbc);\n    if (mysql_num_rows($r) > 0) {\n        while ($row = mysql_fetch_array($r,\
    \ MYSQL_ASSOC))\n        {\n            echo \"<p><span class=\\\"name\\\">{$row['last_\n\
    name']}, {$row['first_name']}</span><br />\n<strong>电子邮件</strong>: {$row['email']}<br\
    \ />\n<strong>电话分机</strong>: {$row['phone_\next']}\n</p>\\n\";\n        }\n  \
    \  }\n}\n```\n\n2.  然后**包含数据库连接脚本**（接下来编写）。\n3.  查询**数据库**，寻找指定部门中的员工。\n4.  **获取返回的任何记录并打印出来**，并应用一些\
    \ HTML 和 CSS 格式。\n\n## 报告任何错误\n\nPHP 脚本应在发生错误时通知用户。**完成在前几步中创建的两个 IF 条件语句**。\n\
    \n```php\n...\n</p>\\n\";\n  }\n} else {\n  echo '<p class=\"error\">指定部门没有列出任何员工。</p>';\n\
    \  }\n} else {\n  echo '<p class=\"error\">请从下拉菜单中选择一个有效的部门以查看其员工。</p>';\n}\n\
    ?>\n```\n\n1.  第一个 **else** 子句将在数据库查询**未返回任何结果**时应用。\n2.  第二个 **else** 子句将在 PHP\
    \ 脚本**未接收到有效的部门 ID** 时应用。\n\n## 连接到数据库\n\n创建一个新的、空白的 PHP 脚本用于连接数据库。此脚本不需要基本的 HTML\
    \ 标签。（参见第 23 页的**补充说明**。）\n\n1.  脚本首先尝试**连接到 MySQL**。**用户名**和**密码**值必须与现有的 MySQL\
    \ 用户匹配。请**更改此代码中的这些值**，以匹配你的 MySQL 服务器的相应用户。\n2.  脚本随后尝试**选择 ajax 数据库**。这是第 1\
    \ 章中创建的数据库的名称。\n\n```php\n<?php # mysql.inc.php\n$dbc = @mysql_connect ('localhost',\
    \ 'username',\n'password');\nif (!$dbc OR !mysql_select_db ('ajax')) {\n  echo\
    \ '<p class=\"error\">该站点目前遇到技术问题。\n我们对造成的不便深表歉意。</p>';\n  exit();\n}\n?>\n```\n\
    \n3.  如果任一尝试失败，将打印错误消息。如果发生这种情况，脚本随后将终止，因为没有数据库连接就无法继续。\n4.  将此文件保存为 **mysql.inc.php**，并将其放置在与\
    \ **dept_form.html** 相同的 Web 服务器目录中。\n\n## 创建样式表\n\nCSS 样式表是一个单独的文档，它规定了页面的外观。在你的测试编辑器或\
    \ IDE 中创建一个新文件，包含以下代码。（参见第 24 页的**补充说明**。）\n\n```css\nbody {\n    font-family:\
    \ sans-serif;\n}\n.name {\n    font-weight: bold;\n    text-transform: uppercase;\n\
    \    color: #009;\n}\n.error {\n    font-weight: bold;\n    color: #C00\n}\n#results\
    \ {\n    border: medium solid #390;\n    display: none;\n    padding-left: 10px;\n\
    \    width: 300px;\n}\n```\n\n**body** 部分设置了整个 HTML 页面的默认字体。\n\n第二部分格式化 **class\
    \ 值为 name** 的文本。那将是 **dept_results.php** 中结果列表里的员工姓名。\n\n第三部分为**任何错误**应用一些格式化（这些错误将具有\
    \ **class 值 error**），就像两个 PHP 脚本中创建的那些错误一样。\n\n最后一部分应用于任何 **id 值为 results** 的块。你将在下一章添加\
    \ Ajax 层时使用它。\n\n将此文件保存为 **style.css**，并将其放置在与所有其他文件相同的 Web 服务器目录中。\n\n## 使用样式表\n\
    \n要使用样式表，必须在 HTML 和 PHP 页面中引用它。通过在两个文件的 `<head>` 部分添加一行来完成此操作：\n\n```html\n...\n\
    <title>按部门划分的员工</title>\n<style type=\"text/css\" media=\"all\">@import \"style.css\"\
    ;</style>\n</head>\n<body>\n...\n```\n\n样式表主要是为了美观。非 Ajax 层在没有它的情况下也能完美运行，但看起来不会那么漂亮。\n\
    \n## 测试页面\n\n1.  在你的 Web 浏览器中加载 **HTML 页面**，以测试我们目前创建的内容。\n\n地址**必须以 http:// 开头**才能正常工作。（参见第\
    \ 24 页的**补充说明**。）\n\n2.  选择一个部门并点击 **GO**。\n3.  PHP 页面应该显示结果。\n\n## 补充说明\n\n###\
    \ 创建 HTML 页面 p. 13\n\n- HTML、JavaScript、CSS 和 PHP 几乎可以在任何应用中编写。我更喜欢使用简单的文本编辑器（具体来说，是\
    \ Mac OS X 上的 BBEdit），但请使用你喜欢的工具。专注于 Web 开发的人通常喜欢像 Dreamweaver 这样的 WYSIWYG（所见即所得）工具。PHP\
    \ 开发者有时倾向于使用像 Eclipse、NuSphere 的 PhpED 或 Zend Studio 这样的 IDE（集成开发环境）。\n- 对于本书中的\
    \ HTML，我将使用 **XHTML 1.0 Strict** 标准。有关此标准的更多信息，请参阅专门的 HTML 资源，例如 Elizabeth Castro\
    \ 所著的优秀书籍《HTML, XHTML, & CSS: Visual QuickStart Guide, Sixth Edition》（ISBN-13:\
    \ 978-0321430847）。\n- 本示例的 Ajax 和非 Ajax 版本都使用 PHP，这意味着**你必须拥有一个支持 PHP 的 Web 服务器**才能测试这些示例。这可以是你自己的计算机（如果你安装了\
    \ PHP），或者是一个远程托管的网站（如果你有这样的网站）。\n- 为了简单起见，本书中创建的每个文件都将放在服务器上的同一个文件夹中。\n\n### 添加\
    \ HTML 表单 p. 14\n\n- 在处理 HTML 表单时，**action** 和 **method** 是两个最重要的考虑因素。**action**\
    \ 告诉浏览器表单数据应发送到哪个页面。**method** 告诉浏览器应如何发送这些数据。**get** 方法在 URL 中发送数据。\n- 通常，我会让\
    \ PHP 动态生成与数据库表对应的任何下拉菜单。我在这里省略了这一步。\n\n### 开始创建 PHP 页面 p. 15\n\n- PHP 是一种服务器端语言，用于动态生成\
    \ HTML 代码（以及其他用途）。PHP 标签 `<?php` 和 `?>` 内的任何内容都将被视为 PHP 代码。这些标签外的任何内容将立即发送到 Web\
    \ 浏览器并被视为 HTML。\n\n### 浏览员工\n"
