    # extra bits


    # make a function p. 27


    +   - JavaScript, like most languages, allows you to define your own functions.
    Start with the word **function**, followed by the name of the function, followed
    by parentheses. The function’s body goes between curly braces. The function’s
    name can contain only letters, numbers, and the underscore. It cannot begin with
    a number, and it also can’t be the same as an existing keyword in JavaScript.

    - Variables declared in a function using the keyword **var** are **local** to
    that function. This is to say, the variables only exist within that function.

    - If a function takes **arguments** — values passed to the function when it’s
    called — those would go between the parentheses.


    # check for Ajax support p. 28


    +   - The **ajax.js** file, which defines the **getXMLHttpRequestObject()** function,
    is the most important script in any Ajax application. The function returns either
    a valid, browser-safe **XMLHttpRequest** object or the value **false**. If it
    returns the object, that object contains all the functionality required to perform
    an Ajax transaction.

    - The latest versions of most browsers support the **XMLHttpRequest object**.
    Due to its increasing popularity, this should remain so, even though it’s not
    part of any standard at the time of this writing.

    - Internet Explorer versions 5 and 6 didn’t support a JavaScript **XMLHttpRequest**
    object. Instead they supported an **ActiveX** object of type **XMLHTTP**. Unfortunately,
    if users with one of these versions of Internet Explorer have disabled ActiveX
    support (enabling it is a security risk), they cannot use Ajax-enabled applications
    like these.


