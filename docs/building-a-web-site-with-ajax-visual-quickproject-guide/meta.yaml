  md: '# # extra bits


    ## create an HTML page p. 13


    - HTML, JavaScript, CSS, and PHP can be written in nearly any application. I prefer
    to use a simple text editor (specifically, BBEdit on Mac OS X), but use what you
    like. People who focus on Web development often like a WYSIWYG (What You See Is
    What You Get) tool like Dreamweaver. PHP developers sometimes lean toward IDEs
    (integrated development environments) like Eclipse, NuSphere’s PhpED, or Zend
    Studio.


    - For the HTML in this book, I’ll be using the **XHTML 1.0 Strict** standard.
    For more information on this, see a dedicated HTML resource, like Elizabeth Castro’s
    most excellent HTML, XHTML, & CSS: Visual QuickStart Guide, Sixth Edition (ISBN-13:
    978-0321430847).


    - Both the Ajax and non-Ajax versions of this example use PHP, which means that
    **you must have a PHP-enabled Web server** to test the examples on. This can be
    your own computer, if you’ve installed PHP, or a remotely hosted Web site, if
    you have one of those.


    - For the sake of simplicity, every file created in this book will just go in
    the same folder on the server.


    ## add the HTML form p. 14


    - When it comes to handling HTML forms, the **action** and the **method** are
    the two most important considerations. The **action** tells the browser to what
    page the form data should be sent. The **method** tells the browser how that data
    should be sent. The **get** method sends the data in the URL.


    - Normally I would have PHP dynamically generate any drop-down menu that corresponds
    to a database table. I’m saving steps by not doing so here.


    ## start a PHP page p. 15


    - PHP is a server-side language used to dynamically generate HTML code (among
    other purposes). Anything within the PHP tags—`<?php` and `?>`—will be treated
    as PHP code. Anything outside of those tags will immediately be sent to the Web
    browser and treated as HTML.


    **browsing employees**'
  merge: -1
