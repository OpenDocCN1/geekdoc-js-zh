    # 引言


    你手中的这本 Visual QuickProject 指南提供了一种学习新技术的独特方式。本指南不会让你淹没在理论可能性和冗长的解释中，而是采用大量的插图结合清晰、简明的逐步操作指令，向你展示如何在几个小时内完成一个具体的项目。


    Visual QuickProject 系列中的这本书将教你如何“亲手打造”一个**支持 Ajax 的应用程序**。具体的示例将涉及一个公司中员工的管理，按部门组织成一种类似于地址簿的形式。但实际的示例次于所教授的技术和理念。在读完本书后，**你将拥有一个精美且可运行的示例、大量可用的代码，以及一套可应用于你自己的项目的
    Ajax 知识**。


    # Ajax 如何工作


    通常，当客户端（用户及其 Web 浏览器）请求一个 Web 页面时，服务器处理该请求并将数据发回给客户端。客户端加载数据，并用请求的页面重新绘制浏览器。对于每一次请求，这个过程都会重复一遍。


    ![](img/64cd02e760894ad9ed3dde3e58139569_10_0.png)


    Ajax 是创建**富互联网应用程序** (Rich Internet Applications, RIAs) 的一种方式：这类网站的行为更像桌面应用程序。在支持
    Ajax 的应用程序中，在页面初次加载之后，**随后的请求可以在后台处理**。然后 Web 浏览器可以更新，而用户无需意识到服务器请求、数据下载等过程。简而言之，Ajax
    为最终用户提供了更好的体验。


    ![](img/64cd02e760894ad9ed3dde3e58139569_10_1.png)


    # 你将学到什么


    Ajax 并非一个独立存在的“东西”，而是多种技术的结合。在本书中，这些技术包括 **(X)HTML**、**CSS**、**JavaScript**、**XML**、**PHP**、**MySQL**
    和 **SQL**。Ajax 应用程序的核心是 JavaScript，尤其是一个被称为 **XMLHttpRequest** 对象的小东西。**XMLHttpRequest**
    对象封装了规避传统客户端-服务器流程所需的所有功能。


    然而，本书不仅教你如何创建一个支持 Ajax 的应用程序。你还将学习如何创建一个对于那些无法利用 Ajax 的用户（因为其浏览器不支持 JavaScript
    和 **XMLHttpRequest**）同样有效的网站。创建一个在非 Ajax 浏览器中仍能运行的 Ajax 应用程序是一个两步走的过程。


    在其中一个章节中，你将为某个功能创建非 Ajax 版本。非 Ajax 版本适用于任何用户，并向你（开发人员）展示该网站部分的功能逻辑。


    ![](img/64cd02e760894ad9ed3dde3e58139569_11_0.png)


    ![](img/64cd02e760894ad9ed3dde3e58139569_11_1.png)


    第二步是在非 Ajax 版本之上添加 Ajax 层。Ajax 层的意图与非 Ajax 层相同，但所有的步骤将以一种对最终用户而言更先进的方式进行。

