- md: "## debugging JavaScript (cont.)\n\n3 A **DOM inspector**: Because most Ajax\
    \ applications change a page's content dynamically, just looking at the source\
    \ of the page won't be of use. Instead, use a DOM inspector to see the modified\
    \ page content. Firefox has one built in (on Windows, you'll need to do a custom\
    \ install of Firefox to add the inspector). You can also find and install DOM\
    \ inspectors that work with Internet Explorer and Safari, but why bother when\
    \ Firefox's already exists?\n\n![](img/64cd02e760894ad9ed3dde3e58139569_162_0.png)\n\
    \n4. **The Venkman JavaScript Debugger** (www.mozilla.org/projects/venkman): This\
    \ is a sophisticated JavaScript debugger that can be used through Firefox.\n5.\
    \ **JSLint** (www.jslint.com): This program performs basic syntax checks on JavaScript.\
    \ Just paste your JavaScript in the box on the JSLint Web site and click the JSLint\
    \ button.\n6. **Firebug** (www.getfirebug.com): This FireFox extension provides\
    \ a wealth of debugging tools, covering HTML, CSS, JavaScript, and the DOM.\n\
    7. **Firefox Firefox Firefox**: In case it’s not clear from this list (where Firefox\
    \ is singled out four times), Firefox is clearly the best browser for debugging\
    \ Ajax applications (it may be the best browser period). You’ll need to test your\
    \ Ajax scripts on other browsers to verify support, but when it comes to debugging,\
    \ use Firefox first!\n\n## extra bits\n\n### Ajax issues p. 130\n\n- With the\
    \ code in this book, every example will work whether or not the user's browser\
    \ supports Ajax. The examples were purposefully designed this way, so that if\
    \ the nice Ajax layer won't work, the user isn't left behind. This is an approach\
    \ you should maintain as much as possible.\n- Ajax pages cannot be bookmarked,\
    \ recorded in the browser's history, or listed in search engines because the changes\
    \ aren't reflected in a URL. By taking some extra steps, it's possible to overcome\
    \ some of these limitations. Search the Web for techniques.\n- It's important\
    \ to give obvious clues to the user when something is happening or has happened.\
    \ In this book, I use an overt formatting of Ajax results to make the changes\
    \ apparent.\n\n### introducing JSON p. 132–133\n\n- The biggest concern with using\
    \ JSON is that there are some **security risks** involved. The **eval()** function\
    \ actually runs the received text as JavaScript code, meaning that the Ajax process\
    \ could be hacked if the data could be manipulated. Search the Web for more on\
    \ this subject and for possible safeguards.\n- Another issue with JSON is that\
    \ the syntax is **very, very particular**, much more so than XML. Using a library\
    \ to create the JSON data will give more reliable results.\n\n### sending JSON\
    \ p. 134–135\n\n- Instead of trying to create the exact JSON syntax programmatically,\
    \ I think it's best to use an external library that will do this for you. In this\
    \ script, I'm making use of the **PECL JSON** class (which must be installed;\
    \ see **http://pecl.php.net**—it's enabled by default as of PHP 5.2).\n- Alternatively,\
    \ see the official JSON Web site (**www.json.org**) for includable PHP libraries\
    \ that can perform the conversion of an array to JSON.\n\n## JavaScript frameworks\n\
    \nThere are three main downsides to using frameworks. The first is that they require\
    \ **some effort to learn** how to use them. The second is that they normally greatly\
    \ **increase the amount of data** that a user must download from your site (which\
    \ is to say, frameworks are almost inherently bloated). Finally, you must pay\
    \ attention to new releases of a framework, as they might **patch security holes**.\n\
    \nIn choosing a framework, factor in **how many and what browsers it supports**,\
    \ **how large it is** (in terms of file size that the user will end up downloading),\
    \ and **how well documented** it is.\n\n*This page intentionally left blank*\n\
