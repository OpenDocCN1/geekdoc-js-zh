  - '[PAGE 19]


    # # 1. creating the database


    The Ajax-enabled Web site we''ll be creating in this book uses a **database on
    the server** to store all of the content: a list of employees, along with some
    pertinent sample information about them. To begin, we need to create and populate
    this database. For the example, I''ll be using **MySQL**, a popular open-source
    database application.


    This chapter covers what you need to know to create the database but assumes that
    you have access to a *MySQL* installation. I''ll demonstrate the steps in this
    chapter using two different interfaces: **the command-line mysql client** and
    the **Web-based phpMyAdmin**. If you have any questions or problems with this
    chapter''s instructions, see my book **MySQL, Second Edition: Visual QuickStart
    Guide** (ISBN 0-321-37573-4) or search the Web.'
