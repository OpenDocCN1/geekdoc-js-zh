- md: " ## print the employees p. 16\n\n- When it comes time to test this part of\
    \ the Web site, if you have problems with this page you'll need to employ some\
    \ standard PHP-database debugging techniques. Begin by printing out the query\
    \ being run (add **echo $q;** after the query is created). Then run the query\
    \ using another interface, like the command-line **mysql client** or the Web-based\
    \ **phpMyAdmin**. These two steps will confirm what the query's results are.\n\
    \n- Another useful debugging technique for any PHP script is to view the dynamically-generated\
    \ HTML source code in your Web browser. Sometimes the problem can be hidden there.\n\
    \n- For more information on PHP and PHP-MySQL interactions, see my book **PHP\
    \ and MySQL for Dynamic Web Sites: Visual QuickPro Guide, Second Edition** (ISBN-13:\
    \ 978-0321336576) or search the Web.\n\n## connect to the database p. 18\n\n-\
    \ As many PHP scripts in this application will use the database, it's best to\
    \ create one script that establishes that connection. Every page that requires\
    \ a database connection will then include this file.\n\n- The **mysql.inc.php**\
    \ script can be a likely cause of problems. To guarantee that it works when it\
    \ comes time to test the site, make sure you are using a **username and password\
    \ combination** that has access to the **ajax** database. If you have any problems,\
    \ check out the MySQL manual, a book on MySQL (like my **MySQL, Second Edition:\
    \ Visual QuickStart Guide** (ISBN-13: 978-0321375735)), or this book's support\
    \ Web site at www.dmcinsights.com/ajax/.\n\n## extra bits (cont.)\n\n## create\
    \ a style sheet p. 19\n\n- I'm making only minimal use of CSS (Cascading Style\
    \ Sheets) in this book, but CSS is definitely part of Rich Internet Applications\
    \ (RIA), like the one being created. For more information on this subject, search\
    \ the Web or check out Elizabeth Castro's HTML, XHTML, & CSS: Visual QuickStart\
    \ Guide, Sixth Edition (ISBN-13: 978-0321430847).\n\n- The most interesting of\
    \ the style definitions is the one for items with an **id value of results**.\
    \ Such items will not be displayed when the page is first loaded. Then, when appropriate,\
    \ the JavaScript will fill that section with results and make it visible. This\
    \ all takes place in the Ajax layer, created in the next chapter.\n\n## test the\
    \ pages p. 21\n\n- All PHP pages must be run through a URL in order to work. Therefore,\
    \ the HTML form must also be run through a URL (the address must begin with **http://**).\
    \ If the address begins with **file://**, the PHP script handling the form won't\
    \ do its thing.\n\n- Getting these components to work is a perfect first step\
    \ in creating an Ajax-enabled layer. It's easier to debug these pages than it\
    \ will be once JavaScript and other technologies are added to the mix.\n\n- Debugging\
    \ PHP may be the hardest skill for the beginner to learn—unfortunately, the beginner\
    \ will end up doing the most debugging (it's a \"trial by fire\" situation). If\
    \ you have problems getting these pages to work, see the book's Web site at **www.dmcinsights.com/ajax/**,\
    \ for assistance.\n\n24\n\nbrowsing employees\n\n### 3. browsing using Ajax\n\n\
    In the previous chapter, we created the non-Ajax parts of the employee browsing\
    \ pages. Although the focus in this book is on Ajax, it's very important to have\
    \ working, non-Ajax components in place for those who can't take advantage of\
    \ the lovely Ajax interface. In this chapter we'll place the Ajax layer on top\
    \ of the existing one.\n\nThe Ajax components consist of three files: **one JavaScript\
    \ file** that will provide **all-purpose, browser-safe Ajax functionality**; **another\
    \ JavaScript file** that will provide **page-specific functionality**; and **one\
    \ PHP script** that will handle the **server-side needs** of the Ajax layer. To\
    \ make these additions active, the main **HTML form** will be **slightly modified**\
    \ as a last step.\n\n## what we'll do\n\n1. First, on pages 27-28, we'll create\
    \ a **JavaScript file** that makes a browser-specific supported Ajax object. That\
    \ object will be used by any page requiring Ajax functionality.\n\n2. On pages\
    \ 29-31, a **second JavaScript file** that defines the functionality specific\
    \ to the employee-browsing aspect of the example will be started.\n\n3. A **new\
    \ PHP script** will be written on pages 32-34. This script will return the results\
    \ of the Ajax request to the JavaScript.\n\n4. On pages 35 and 36, the **second\
    \ JavaScript page will be completed**, handling the PHP request and updating the\
    \ HTML page.\n\n5. Next, the **HTML page will be modified** to include the Ajax\
    \ layer on page 37.\n\n6. As a last step, on page 38 we'll **test** what we've\
    \ built to make sure it all works.\n\nAt the end of this chapter, in the **extra\
    \ bits** section, you'll find more information, tips, and recommendations regarding\
    \ all of these steps.\n\n## make a function\n\nOne JavaScript file will contain\
    \ all of the code for establishing generic Ajax functionality. Use any text editing\
    \ application to make a new JavaScript document. (See **extra bits** on page 39.)\n\
    \n```\nfunction getXMLHttpRequestObject() {\n    var ajax = false;\n}\n```\n\n\
    1. The JavaScript function is called **getXMLHttpRequestObject()** (it's a long\
    \ but descriptive name). This function creates a browser-specific XMLHttpRequest\
    \ object, stored in the variable **ajax**.\n\n2. The function assumes no Ajax\
    \ support to start (the **ajax** variable is initialized with the Boolean value\
    \ of **false**). In the rest of the function, browsers have to \"prove\" they\
    \ can take advantage of the Ajax functionality.\n\n## check for Ajax support\n\
    \nWithin the function, check what kind of XMLHttpRequest object the browser supports.\
    \ If a browser supports a specific type of XMLHttpRequest object, make the **ajax**\
    \ variable an object of that type. (See **extra bits** on page 39.)\n\n1. Most\
    \ Web browsers—Apple's Safari 1.2 and later, Mozilla and Firefox, Opera 8 and\
    \ later, and newer versions of Internet Explorer—should meet this first condition.\n\
    \n```\nfunction getXMLHttpRequestObject() {\n  var ajax = false;\n  if (window.XMLHttpRequest)\
    \ {\n    ajax = new XMLHttpRequest();\n  } else if (window.ActiveXObject) {\n\
    \    try {\n      ajax = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    } catch (e)\
    \ {\n      try {\n        ajax = new ActiveXObject(\"Microsoft.XMLHTTP\");\n \
    \     } catch (e) { }\n    }\n  }\n  return ajax;\n}\n```\n\n2. Older versions\
    \ of Internet Explorer (that have ActiveX enabled) should get an XMLHttpRequest\
    \ object from one of these two lines.\n\n3. Finally, this function returns the\
    \ **ajax** variable.\n\n4. Save this file as **ajax.js** and place it in the same\
    \ directory on your Web server as every other file.\n\n## call the function\n\n\
    The **ajax.js** file defines a function that creates an **XMLHttpRequest** object,\
    \ but it doesn't actually use that object. Another JavaScript file will do that\
    \ for each specific instance, like the HTML form already created. Use any text\
    \ editing application to make a new JavaScript document. (See **extra bits** on\
    \ page 40.)\n\n1. The first line tells the Web browsers to run the **init()**\
    \ function after loading the entire page. The **init()** function sets up all\
    \ the Ajax activity.\n\n```\nwindow.onload = init;\nfunction init() {\n    var\
    \ ajax = getXMLHttpRequestObject();\n    if (ajax) {\n    } // End of ajax IF.\n\
    } // End of init() function.\n```\n\n2. The **init()** function calls the **getXMLHttpRequestObject()**\
    \ function to get a valid, browser-specific object.\n\n3. The **init()** function\
    \ then checks to see if the **ajax** variable has a valid value. With supported\
    \ browsers, **ajax** will be an **XMLHttpRequest** object. With nonsupported browsers,\
    \ **ajax** will have a value of **false**, and this conditional will be false.\n\
    \n## set up the Ajax\n\nNow the JavaScript should tell the browser what actions\
    \ should be taken when certain events occur. (See **extra bits** on page 40.)\n\
    \n**1** The `init()` function next checks to see if the browser supports the **Document\
    \ Object Model (DOM)** and, specifically, if the page has an element with an **id**\
    \ of **results**.\n\n```\n... if (ajax) {\n    if (document.getElementById('results'))\
    \ {\n        document.getElementById('dept_form').onsubmit = function() {\n  \
    \          var did = document.getElementById('did').value;\n```\n\n**2** If the\
    \ browser supports it, an `onsubmit()` event is attached to the form (which has\
    \ an **id** value of **dept_form**). In other words, when the form is submitted,\
    \ do the following..."
  mdcn: "\n ## 打印出员工信息 p. 16\n\n- 当需要测试网站的这一部分时，如果你在这个页面上遇到问题，你需要采用一些标准的 PHP 数据库调试技巧。首先打印出正在运行的查询（在创建查询后添加\
    \ **echo $q;**）。然后使用其他接口来运行该查询，比如命令行 **mysql client** 或基于 Web 的 **phpMyAdmin**。这两个步骤将确认查询的结果是什么。\n\
    \n- 另一个对任何 PHP 脚本都有用的调试技巧是在你的 Web 浏览器中查看动态生成的 HTML 源代码。有时问题可能隐藏在那里。\n\n- 有关 PHP\
    \ 以及 PHP-MySQL 交互的更多信息，请参阅我的著作 **PHP and MySQL for Dynamic Web Sites: Visual QuickPro\
    \ Guide, Second Edition**（ISBN-13: 978-0321336576）或在互联网上搜索。\n\n## 连接到数据库 p. 18\n\
    \n- 由于本应用程序中的许多 PHP 脚本都会使用数据库，最好创建一个脚本来建立该连接。每个需要数据库连接的页面随后都将包含此文件。\n\n- **mysql.inc.php**\
    \ 脚本可能是导致问题的常见原因。为了确保在测试网站时它能正常工作，请确保你使用的**用户名和密码组合**有权访问 **ajax** 数据库。如果你遇到任何问题，请查看\
    \ MySQL 手册、MySQL 相关的书籍（如我的 **MySQL, Second Edition: Visual QuickStart Guide**（ISBN-13:\
    \ 978-0321375735）），或本书的支持网站 www.dmcinsights.com/ajax/。\n\n## 额外知识点（续）\n\n## 创建样式表\
    \ p. 19\n\n- 我在本书中仅最低限度地使用 CSS（层叠样式表），但 CSS 绝对是富互联网应用（RIA）的一部分，就像正在创建的这一个。有关此主题的更多信息，请在网上搜索，或查阅\
