    # Introduction


    The Visual QuickProject Guide you hold in your hands offers a unique way to learn
    about new technologies. Instead of drowning you in theoretical possibilities and
    lengthy explanations, this Visual QuickProject Guide uses big illustrations coupled
    with clear, concise step-by-step instructions to show you how to complete a specific
    project in a matter of hours.


    This particular book in the Visual QuickProject series teaches you how to "roll
    your own" **Ajax-enabled application**. The specific example will involve managing
    employees in a company, organized by departments into a type of address book.
    But the actual example is secondary to the technologies and ideas being taught.
    By the end of this book, **you''ll have a nice, working example; tons of usable
    code; and an education in Ajax** that you can apply to your own projects.


    # How Ajax Works


    Normally, when a client—the user and their Web browser—requests a Web page, the
    server handles the request, sending the data back to the client. The client loads
    the data, redrawing the browser with the requested page. For each request, this
    process is repeated.


    ![](img/64cd02e760894ad9ed3dde3e58139569_10_0.png)


    Ajax is one way to create **Rich Internet Applications** (RIAs): Web sites that
    behave more like desktop applications. With an Ajax-enabled application, after
    the initial loading of the page, **subsequent requests can be handled behind the
    scenes**. Then the Web browser can be updated without the user being aware of
    the server requests, the downloading of data, and so on. In short, Ajax provides
    a nicer experience for the end user.


    ![](img/64cd02e760894ad9ed3dde3e58139569_10_1.png)


    # What You''ll Learn


    Ajax isn''t really a "thing" in its own right so much as the combination of many
    technologies. In this book, those are **(X)HTML**, **CSS**, **JavaScript**, **XML**,
    **PHP**, **MySQL**, and **SQL**. The heart of an Ajax application is JavaScript
    and, in particular, a little thing called an **XMLHttpRequest** object. The **XMLHttpRequest**
    object wraps up all the functionality required to circumvent the old-fashioned
    client-server process.


    However, this book won''t teach you how to create just an Ajax-enabled application.
    You''ll see how to create a Web site that also works for those users who can''t
    take advantage of Ajax (because their browser doesn''t support JavaScript and
    **XMLHttpRequest**). Creating an Ajax-enabled application that will still function
    for non-Ajax-enabled browsers is a two-step process.


    In one chapter, you''ll create a non-Ajax version of some feature. The non-Ajax
    version will work for any user and show you, the developer, what this part of
    the site should do.


    ![](img/64cd02e760894ad9ed3dde3e58139569_11_0.png)


    ![](img/64cd02e760894ad9ed3dde3e58139569_11_1.png)


    The second step is to add the Ajax layer on top of the non-Ajax version. The intent
    of the Ajax layer will be the same as the non-Ajax layer, but all the steps will
    take place in a more sophisticated way for the end user.'
