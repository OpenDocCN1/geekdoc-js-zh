    \ this page.\n\n![](img/64cd02e760894ad9ed3dde3e58139569_56_2.png)\n\n## extra\
    \ bits\n\n## make a function p. 27\n\n- JavaScript, like most languages, allows\
    \ you to define your own functions. Start with the word **function**, followed\
    \ by the name of the function, followed by parentheses. The function's body goes\
    \ between curly braces. The function's name can contain only letters, numbers,\
    \ and the underscore. It cannot begin with a number, and it also can't be the\
    \ same as an existing keyword in JavaScript.\n\n- Variables declared in a function\
