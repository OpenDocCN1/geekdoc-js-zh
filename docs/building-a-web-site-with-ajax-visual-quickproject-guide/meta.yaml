  md: '# 5. adding records via Ajax


    In the previous chapter, we created a way to add employees to the database. That
    process required one HTML form and one PHP script that handled the form. It all
    works fine but in the old-fashioned, client-server kind of way.


    In this chapter, let''s set an Ajax layer on top of those scripts so that, for
    the browsers that support it, our form for adding employees can behave more like
    a desktop application. To do so, we''ll need to **slightly modify the HTML page**.
    Then we''ll create **one JavaScript file** that has the page-specific Ajax functionality.
    Finally, a **new PHP script** will be written that handles the Ajax request.


    This example will also introduce two new techniques: sending an Ajax request **using
    the POST method** and **working with XML data**. This Ajax example is a little
    more complicated than the previous one, but it should all make sense by the end
    of the chapter.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# # what we''ll do


    +   1. First, on pages 62, we''ll **modify the HTML page** to include the necessary
