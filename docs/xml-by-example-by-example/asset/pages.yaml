  md: '# Chapter 3: XML Schemas


    Having drawn the tree, it is trivial to turn it into a DTD. It suffices to list
    every element in the tree and declare their content model based on children. The
    final DTD is in Listing 3.16.


    Listing 3.16: The DTD for Banking


    ```

    <ENTITY account * (balance,transaction)*>

    <ELEMENT accounts (co-owner, (checking savings))>

    <!ATATATA>

    <ELEMENT checking (%account;,fee)>

    <ELEMENT savings (%account;,interest)>

    <ELEMENT fee (#PCDATA)>

    <ELEMENT interest (#PCDATA)>

    <ELEMENT balance (#PCDATA)>

    <ELEMENT transaction (#PCDATA)>

    ```


    Now I have i-i to publish this DTD under a URI. I like to place versioning information
    in the URI (version 1.0, and so on) because if there is a new version of the DTD,
    it gets a different URI with the new version. It means the two DTDs can coexist
    without problem.


    It also means that the application can retrieve the URI to know which version
    is in use.


    If I ever update the DTD (it''s a very simplified model so I can think of many
    missing elements), I''ll create a different URI with a different version number:


    http://catwoman.applesoft.com/dtd/accounts/1.0/accounts.dtd


    You can see how easy it is to create an XML DTD from an object model. This is
    because XML tree-based structure is a natural mapping for objects.


    As more XML applications will be based on object-oriented technologies and will
    have to integrate with object-oriented systems written in Java, CORBA, or C++,
    I expect modeling tools will eventually create DTDs automatically.


    Already modeling tools such as Rational Rose or Together/J can create Java classes
    automatically. Creating DTDs seems like a logical next step.


    # On Elements Versus Attributes


    As you have, there are many choices to make when designing a DTD. Choices include
    deciding what will become of an element, a parameter entity, an attribute, and
    so on.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Creating the DTD from Scratch


    Deciding what should be an element and what should be an attribute is a hot debate
    in the XML community. We will revisit this topic in Chapter 10, “Modeling for
    Flexibility,” but here are some guidelines:


    +   - The main argument in favor of using attributes is that the DTD offers more
    controls over the type of attributes; consequently, some people argue that object
    properties should be mapped to attributes.

    - The main argument for elements is that it is easier to edit and view them in
    a document. XML editors and browsers in general have more intuitive handling of
    elements of attributes.


    I try to be pragmatic. In most cases, I use element for “major” properties of
    an object. What I define as major is all the properties that you manipulate regularly.


    I reserve attributes for ancillary properties or properties that are related to
    a major property. For example, I might include a currency indicator as an attribute
    to the balance.


    # Creating the DTD from Scratch


    Creating a DTD without having the benefit of an object model results in more work.
    The object model provides you with ready-made objects that you just have to convert
    in XML. It also has identified the properties of the objects and the relationships
    between objects.


    However, if you create a DTD from scratch, you will have to do that analysis as
    well.


    A Variant is to modify an existing DTD. Typically, the underlying DTD does not
    support all your content (you need to add new elements/attributes) or it is too
    complex for your application (you need to remove elements/attributes).


    This is somewhat similar to designing a DTD from scratch in the sense that you
    will have to create sample documents and analyze them to understand how to adapt
    the proposed DTD.


    # On Flexibility


    When designing your own DTD, you want to prepare for evolution. We revisit this
    topic in Chapter 10 but it is important that you build a model that is flexible
    enough to accommodate extensions as new content becomes available.


    The worst case is to develop a DTD, create a hundred or a few thousand documents,
    and suddenly realize that you are missing a key piece of information that you
    can’t change your DTD to accommodate it. It’s bad because it means you have to
    convert your existing documents.'
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Chapter 3: XML Schemas\n\nTo avoid that trap you want to provide as much\
    \ structural information as possible but not too much. The difficulty, of course,\
    \ is in striking the right balance between enough structural information and too\
    \ much structural information.\n\nYou want to provide enough structural information\
    \ because it is very easy to degrade information but difficult to clean degraded\
    \ information.\n\nCompare it with a clean, neatly sorted stack of cards on your\
    \ desk. It takes half a minute to knock it down and shuffle it. Yet it will take\
    \ the best part of one day to start the cards again.\n\nThe same is true with\
    \ electronic documents. It is easy to lose structural information when you create\
    \ the document. And if you lose structural information, it will be very difficult\
    \ to retrieve it later on.\n\nConsider Listing 3:17, which is the address book\
    \ in XML. The information is highly structured—the address is broken down into\
    \ smaller components: street, region, and so on.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_115_0.png)\n\
    \n```\nListing 3:17: An Address Book in XML\n<?xml version=\"1.0\"?>\n<!DOCTYPE\
    \ address-book SYSTEM *address-book.dtd>\n<!-- loosely inspired by vCard 3.0 -->\n\
    <address-book>\n  <entry>\n    <name>John Doe</name>\n    <address>\n      <street>34\
    \ Fountain Square Plaza</street>\n      <region>OH</region>\n      <postal-code>45282</postal-code>\n\
    \      <location>Cincinnati</location>\n      <country>US</country>\n    </address>\n\
    \    <tel preferred=\"true\">513-555-8889</tel>\n    <tel>513-555-7098</tel>\n\
    \    <email href=\"mailto:jdoe@emailaholic.com\">/email>\n  </entry>\n  <entry>\n\
    \    <fname>Jack</fname><lname>Smith</lname>\n    <tel>513-555-3465</tel>\n  \
    \  <email href=\"mailto:jsmith@emailaholic.com\">/email>\n  </entry>\n</address-book>\n\
    ```"
