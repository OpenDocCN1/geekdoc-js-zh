- img_proc: true
  md: '```

    <xsl:template match="*" ! | />

    <xsl:apply-templates/>

    </xsl:template>

    ```


    # NOTE


    The built-in template does not modify the resulting tree (it does not create elements)
    but it recursively calls the current element''s children.


    Without the default template, there would be no rules to trigger the recursive
    matching process and the processor would stop.


    It is possible to override the built in template, for example, to stop processing
    for elements explicitly defined elsewhere:


    ```

    <xsl:template match="**" ! | />

    ```


    The built-in template forces the processor to load the first children of article,
    that is, the title element. The following template matches


    ```

    <xsl:template match="article/title">

    <P>B</xsl:apply-templates></B</P>

    </xsl:template>

    ```


    Note that the processor matches on a relative path because the current node is
    article. It creates a paragraph in the HTML document. xsl:applytemplates loads
    title''s children.


    The first and only child of title is a text node. The style sheet has no rule
    to match text but there is another built-in template that copies the date in the
    resulting tree.


    ```

    <xsl:template match="text()">

    <xsl:value-of select=".*/>

    </xsl:template>

    ```


    The title''s text has no children so the processor cannot go to the next level.
    It backtracks to the article element and moves to the next child: the date element.
    This element matches the last template.


    ```

    <xsl:template match="abstract | date | keywords | copyright"/>

    ```


    This template generates no output in the resulting tree and stops processing for
    the current element.


    The processor backtracks again to article and processes its other children: copyright,
    abstract, keywords, and section. Copyright, abstract, and keywords match the same
    rule as abstract and generate no output in the resulting tree.'
  merge: -1
  pgno: 156
- img_proc: true
  md: "The section element, however, matches the default template and the processor\
    \ moves to its children, title, and p elements. The processor continues to match\
    \ rules with nodes until it has exhausted all the nodes in the original document.\n\
    \n# Creating Nodes in the Resulting Tree\n\nSometimes it is useful to compute\
    \ the value or name of new nodes. The following template creates an HTML anchor\
    \ element that points to a URL. The anchor has two attributes. The first one,\
    \ TARGET, is specified directly in the template. However, the processor computes\
    \ the second attribute, HREF, when it applies the rule.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_157_0.png)\n\
    \n```\n<xsl:template match=\"blank\">\n  <A TARGET=\"blank\">\n    <xsl:attribute\
    \ name=\"HREF\">\n      <xsl:apply-templates/>\n    </xsl:attribute>\n    <xsl:apply-templates/>\n\
    \  </A>\n</xsl:template>\n```\n\n```\n<A target=\"blank\" href=\"http://www.w3.org/Style\"\
    >\nhttp://www.w3.org/Style</A>\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_157_1.png)\n\
    \nTable 5.2 lists other XSL elements that compute nodes in the resulting tree.\n\
    \nTable 5.2: XSL elements to create new objects\n\n| XSL Element | Description\
    \ |\n| :--- | :--- |\n| xsl:element | creates element with a computed node |\n\
    | xsl:attribute | creates attribute with a computed value |\n| xsl:attribute-set\
    \ | conveniently combines several xsl:attributes |\n| xsl:text | creates a text\
    \ node |\n| xsl:processing-instruction | creates a processing instruction |\n\
    | xsl:comment | creates a comment |\n| xsl:copy | copies the current node |\n\
    | xsl:value-of | computes text extracting from the source tree or inserting a\
    \ variable |\n| xsl:if | instantiates its content if the expression is true |\n\
    | xsl:choose | selects elements to instantiate among possible alternatives |\n\
    | xsl:number | creates formatted number |"
