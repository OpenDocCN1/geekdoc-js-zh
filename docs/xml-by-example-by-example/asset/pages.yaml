- img_proc: true
  md: '# Introduction


    XML stands for the Extensible Markup Language. It is a new markup language, developed
    by the W3C (World Wide Web Consortium), mainly to overcome limitations in HTML.
    The W3C is the organization in charge of the development and maintenance of most
    Web standards, most notably HTML. For more information on the W3C, visit its site
    at www.w3.org.


    HTML is an immensely popular markup language. According to some studies there
    are 800 million Web pages, all based on HTML. HTML is supported by thousands of
    applications including browsers, editors, software, contact managers, and more.


    Originally, the Web was a solution to publish scientific documents. Today it has
    grown into a full-fledged medium, equal to print and TV. Moreover, the Web is
    an interactive medium because it supports applications as online shops, electronic
    banking, and trading for forums.


    To accommodate this phenomenal popularity, HTML has been extended over the years.
    Many new tags have been introduced. The first version of HTML had a dozen tags;
    the latest version (HTML 4.0) is close to 100 tags (not counting browser-specific
    tags).


    Furthermore, a large set of supporting technologies has also been introduced:
    JavaScript, Java, Flash, CGI, ASP, streaming media, MP3, and more. Some of these
    technologies were developed by the W3C whereas others were introduced by vendors.


    However, everything is not rosy with HTML. It has grown into a complex language.
    At almost 100 tags, it is definitively not a small language. The combinations
    of tags are almost endless and the result of a particular combination of tags
    might be different from one browser to another.


    Finally, despite all these tags included in HTML, more are are needed. Electronic
    commerce applications need tags for product references, prices, name, addresses,
    and more. Streaming media needs tags to control the flow of images and sound.
    Search engines need more precise tags for keywords and description. Security needs
    tags for signing. The list of applications that need new HTML tags is almost endless.


    However, adding even more tags to an overblown language is hardly a satisfactory
    solution. It appears that HTML is already on the verge of collapsing under its
    own weight, so why continue adding tags?


    Worse, although many applications need more tags, some applications would greatly
    benefit if there were less, not more, tags in HTML. The W3C expects that by the
    year 2002, 75% of users won''t be using a PC. Rather, they will access the Web
    from a personal digital assistant, such as the PalmPilot, or from smart smartphones.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    These machines are not as powerful as PCs. They cannot process a complex language
    like HTML, much less a version of HTML that would include more tags.


    Another, but related, problem is that it takes many tags to format a page. It
    is uncommon to see pages that have more markup than content! These pages are slow
    to download and to display.


    In conclusion, even though HTML is a popular and successful markup language, it
    has some major shortcomings. XML was developed to address these shortcomings.
    It was not introduced for the sake of novelty.


    XML exists because HTML was successful. Therefore, XML incorporates many successful
    features of HTML XML also exists because HTML could not live up to new demands.
    Therefore, XML breaks new ground where it is appropriate.


    It is difficult to change a successful technology like HTML so, not surprisingly,
    XML has raised some level of controversy.


    Let''s make it clear: XML is unlikely to replace HTML in the near or medium-term.
    HTML does not threaten the Web but introduces new possibilities. Work is already
    under on way to combine XML and HTML in XHTML, an XML version of HTML. At the
    time of this writing, XHTML version 1.0 is not finalized yet. However, it is expected
    that XML will be adopted by the W3C.


    Some of the areas where XML will be useful in the near-term include:


    +   * large Web site maintenance. XML would work behind the scene to simplify
    the creation of HTML documents

    * exchange of information between organizations

    * offloading and reloading of databases

    * syndicated content, where content is being made available to different Web sites

    * electronic commerce applications where different organizations collaborate to
    serve a customer

    * scientific applications with new markup languages for mathematical and chemical
    formulas

    * electronic books with new markup languages to express rights and ownership

    * handheld devices and smart phones with new markup languages optimized for these
    “alternative” devices'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1: The XML Galaxy


    This book takes a “hands-on” approach to XML. It will teach you how to deploy
    XML in your environment: how to decide where XML fits and how to best implement
    it. It is illustrated with many real-world examples.


    As you will see, there are two classes of applications for XML: publishing and
    data exchange. This book draws most of its examples from data exchange applications
    because they are currently the most popular. However, it also includes a very
    comprehensive example of Web site publishing.


    I make some assumptions about you. I assume you are familiar with Web, insofar
    that you can read, understand, and write basic HTML pages as well as read and
    understand a simple JavaScript application. You not have to be a master at HTML
    to learn XML, nor do you need to be a guru of JavaScript.


    Most of the code in this book is based on XML and its companion standards. When
    programming was required, I used JavaScript as possible. JavaScript, however,
    was not appropriate for the final example I turned to Java.


    You don’t know Java to read this book. There is very little Java involved (again,
    most of the code in the final example is based on techniques that you will learn
    in this book) and Appendix A, “Crash Course on Java,” will teach you just enough
    Java to understand the examples.


    # A First Look at XML


    The idea behind XML is deceptively simple. It aims at answering the conflicting
    demands that arrive at the W3C for the future of HTML.


    On one hand, people need more tags. And these new tags are increasingly specialized.
    For example, mathematicians want tags for formulas. Chemists also want tags for
    formulas but they are not the same.


    On the other hand, authors and developers want fewer tags. HTML is already so
    complex! As handheld devices gain popularity, the need for a simpler markup language
    is also apparent because small devices, like the PalmPilot, are not powerful enough
    to process HTML pages.


    How can you have both more tags and fewer tags in a single language? To resolve
    this dilemma, XML makes essentially two changes to HTML:


    +   - It Itines no tags.


    +   - It is stricter.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# A First Look at XML


    # No Predefined Tags


    Because there are no predefined tags in XML, you, the author, can create the tags
    that you need. Do you need a tag for price? Do you need a tag for bold hyperlink
    that floats on the right side of the screen? Make them:


    ```

    <price currency="usd">$499.00</price>

    <toc xlink:href="/newsletter">Pineapplesoft Link</toc>

    ```


    The <toc> tag has no equivalent in HTML although you could simulate the <toc>
    tag through a combination of table, hyperlink, and bold:


    <table>

    <tr>

    <td><!-- main text here ---->

    <td><A HREF="/newsletter"><B>Pineapplesoft Link</B></A></td></td>

    </tr>

    </table>


    This is the X in XML. XML is extensible because it defines no tags but lets the
    author create tags that are needed for his or her application.


    This is simple but it opens many questions as


    +   - How the browser know that <toc> is equivalent to this combination of table,
    hyperlink, and bold?

    - Can you compare different prices?

    - What about the current generation of browsers?

    - How does this simplify Web site maintenance?


    We will address these and many other questions in detail in the chapters of the
    book. Briefly the answers are


    +   - The browsers use a style sheet: See Chapter 5, "XSL Transformation," and
    Chapter 6, "XSL Formatting Objects and Cascading Style Sheet."

    - You can compare prices: See Chapter 7, "The Parser and DOM," and Chapter 8,
    "Alternative API: SAX."

    - XML can be made compatible with the current generation of browsers. See Chapter
    5.

    - XML enables you to concentrate on more stable aspects of your document: See
    Chapter 5.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Stricter


    HTML has a very forgiving syntax. This is great for authors who can be as lazy
    as they want, but it also makes Web browsers more complex. According to some estimates,
    more than 50% of the code in a browser handles errors or sloppiness of the author''s
    part.


    However, authors increasingly use HTL editors so they don''t really care how simple
    and forgiving the syntax is.


    Yet, browsers are growing in size and are becoming generally slower. The speed
    factor is a problem for every surfer. The size factor is a problem for owners
    of handheld devices who cannot afford to download 10MB browsers.


    Therefore, it was decided that XML would adopt a very strict syntax. A strict
    syntax results in smaller, faster, and lighter browsers.


    # A First Look at Document structure


    XML is all about document structure. This section looks into the issue of structured
    documents.


    # CAUTION


    Don''t be confused by the vocabulary: XML is not just a solution to publishing
    Web pages.


    XML clearly has its roots in publishing: technical documentation, books, letters,
    Web pages, and more.


    The XML vocabulary dates back to publishing applications. For example, an XML
    file is referred to as an XML document. Likewise, to manipulate an XML document,
    you are likely to apply a style sheet, even though you might not be formatting
    the document. Relationships between documents are expressed through links, even
    though they might not hyperlinks.


    The vocabulary is the source of much confusion because it seems to restrict XML
    to publishing. This is unfortunate because it has turned off many people. So I
    urge you to keep an open mind, and you will see XML documents are more than what
    you would think of documents.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_27_0.png)


    To illustrate document structure, I will use the fictitious memo as Listing 1,1
    as an example.


    # Listing 1.1: A Fictitious Memo


    ```

    From: John Doe

    To: Jack Smith

    Regarding: XML at WhizBang

    ```


    INTERNAL MEMO'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# A First Look at Document Structure


    Have you heard of this new technology, XML? It looks promising.

    It is similar to HTML but it is extensible. All the big names

    (Microsoft, IBM, Oracle) are backing it.


    We could use XML to simplify our e-commerce and launch new

    services. It is also useful for the Web site: You complained

    was a lot of work; apparently, XML can simplify the maintenance.


    Check this Web site <http://www.w3.org/XML> for more information.

    Also visit Que (<http://www.mcp.com>). It has just released

    ''XML by Example'' with lots of useful information and some

    examples. I have already ordered two copies!


    John


    If we look at the structure of this memo, we see it is not a monolithic entity.

    The memo is made of at least three distinct elements:


    +   * the title

    * the header, which states the sender and recipient names as well as the

    subject

    * the body text


    These elements are organized in relation to one another, following a stru-

    ture. For example, the title names the memo and it is followed with the

    header.


    If we examine the memo more closely, we find that the body text itself cons-

    sists of various elements, namely


    +   * three paragraphs

    * several URLs

    * a signature


    We could continue this decomposition process and recognize smaller ele-

    ments sentences, words, or even characters. However, these smaller

    elements usually add little information on the structure of the document.


    The structure we have just identified is independent from the appearance

    of the memo. For example, the memo could have been written in HTML. It

    would have resulted in a nicer-looking document, as illustrated in Figure

    1.1, but would have the same structure.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1: The XML Galaxy


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_29_0.png)


