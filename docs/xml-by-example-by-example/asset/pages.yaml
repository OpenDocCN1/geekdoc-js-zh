  md: "# Entities and Notations\n\nParameter entities have many applications. You\
    \ will learn how to use parameter entities in the following sections: \"Internal\
    \ and External Entities,\" \"Conditional Sections,\" \"Designing DTDs from an\
    \ Object Model.\"\n\n# CAUTION\n\nThe previous example is valid only in the external\
    \ subset of a DTD. In the internal subset, parameter entities can appear only\
    \ where markup declaration can appear.\n\n# Internal and External Entities\n\n\
    XML also distinguishes between internal and external entities. Internal entities\
    \ are stored in the document, whereas external entities point to a system or public\
    \ identifier. Entity identifiers are identical to DTD identifiers (in fact, the\
    \ DTD is a special entity).\n\n+   * The entities in the previous sections were\
    \ internal entities because their value was declared in the entity definition.\
    \ External entities, on the other hand, reference content that is not part of\
    \ the current document.\n\n# TIP\n\nExternal entities might start with an XML\
    \ declaration—for example, to declare a special encoding.\n\n```\n<?xml version=\"\
    1.0\" encoding=\"ISO-8859-1\"?>\n```\n\nExternal general entities can be parsed\
    \ or unparsed. If parsed, the entity must contain valid XML text and markup. External\
    \ parsed entities are used to share text across several documents, as illustrated\
    \ by Listing 3.11.\n\nIn Listing 3.11, the various entities are stored in separate\
    \ entities (separate files). The address book combines them in a document.\n\n\
    **Listing 3.11**: Using External Entities\n\n```\n<xml version=\"1.0\"?>\n<!DOCTYPE\
    \ address-book [\n<!ENTITY johndoe SYSTEM \"johndoe.ent\">\n<!ENTITY jacksmith\
    \ SYSTEM \"jacksmith.ent\">\n]\n<address-book>\n  &johndoe;\n  &jacksmith;\n</address-book>\n\
    ```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_104_0.png)\n\nWhere the file \"\
    johndoe.ent\" contains:\n\n```\n<entry>\n  <name>John Doe</name>\n```"
