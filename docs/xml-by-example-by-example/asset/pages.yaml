  md: 'SAX: The Alternative API


    # SAX: The Alternative API


    By definition, the DOM recommendation does not apply to event-based parsers. The
    members of the XML-DEV mailing list have developed a standard API for event-based
    parsers called SAX, short for the Simple API for XML.


    SAX is defined for the Java language. There is a version of SAX for Python and
    Perl but currently none for JavaScript or C++. Furthermore, SAX is not implemented
    in browsers; it is available only for standalone parsers.


    Obviously, the examples in this chapter are written in Java. If you want to learn
    how to write Java applications, refer to Appendix A, “Crash on Java.”


    SAX is edited by David Megginson and published at www.megginson.com/SAX. Unlike
    DOM, SAX is not endorsed by an official standardization body but it is widely
    used and considered a de facto standard.


    In particular, Sun has included SAX in ProjectX—an ongoing effort to add an XML
    parser to the Java platform. ProjectX also supports DOM so the parser offers both
    event-based and object-based interfaces. It is available from java.sun.com.


    The IBM parser, XML for Java (available from www.alphaws.ibm.com), and the DataChannel
    parser, XJParse (available from www.datachannel.com), are other parsers that support
    both the DOM and SAX interfaces.


    Microstar’s Æfred (www.microstar.com) and James Clark’s XP (www.jclark.com) support
    only the SAX interface.


