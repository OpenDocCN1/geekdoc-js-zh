  md: '# Chapter 8: Alternative API: SAX


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_249_0.png)


    Figure 8.1: Architecture of an XML program


    # Object-Based and Event-Based Interfaces


    In Chapter 7, “The Parser and DOM,” you learned that there are two classes of
    interfaces for parsers: object-based and event-based interfaces.


    +   - The section “Getting Started with DOM” in Chapter 7 introduced DOM as an
    object-based parser. DOM was developed and published by the W3C.


    DOM is an object-based interface: It communicates with the application by explicitly
    creating a tree of objects in memory. The tree in memory is an exact map of the
    tree of elements in the XML file.


    Object-based interfaces, like DOM, are simple because they offer a view that closely
    matches the underlying document. They are also ideal for applications whose goal
    is to manipulate XML for the sake of manipulating documents (such as a browser
    or an editor).


    DOM benefits from being the official interface endorsed by the W3C. Internet Explorer
    implements some support for DOM. Netscape will do so in the next version. XML
    editors and XML databases are also adopting DOM as their preferred interface.


    However, for applications that are not so XML-centric, an object-based interface
    is less appealing. Indeed, these applications have their own data structure and
    their own objects, which are not based on XML.


    For these applications, it is more sensible not to build the DOM tree, but to
    directly load the document in their data structure.


    Otherwise, the application has to maintain two copies of the data in memory (one
    in the DOM tree and one in the application’s structure), which is inefficient.
    This might not be a problem for desktop applications, but can bring a server down
    to its knees.


    Figure 8.2 illustrates how an application can map between an XML tree and its
    own data structure.'
  merge: -1
