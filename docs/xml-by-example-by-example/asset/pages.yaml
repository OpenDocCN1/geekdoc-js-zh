  md: "# The Basics of CSS\n\nThe equivalent in CSS would be section>title\n\n```\n\
    {\n  display: block;\n  font-style: italic;\n}\n```\n\nThe XSLT style sheet converts\
    \ the XML element in two HTML elements: paragraph and italicized text. The CSS\
    \ style sheet retains the original elements but says how to display them. The\
    \ title is an independent block of italicized text.\n\n+   TIP\nIf we compare\
    \ XML style sheets with word processor commands, XSLT is similar to the \"Export\"\
    \ or the \"Save As...\" command that saves the current document in a different\
    \ format. CSS is closer to commands in the \"Format\" menu.\n\n# The Basics of\
    \ CSS\n\nThe CSS recommendation was originally drafted for HTML. Over the last\
    \ few years, the complexity of HTML has grown dramatically. In particular, many\
    \ elements have been added to HTML to support styling, such as <CENTER> or <FONT>.\n\
    \nGradually, it appeared that adding more elements to HTML was not a viable solution\
    \ for the long term because it leads to very complex Web pages that are difficult\
    \ to read and difficult to maintain as unnecessarily largely.\n\nThe W3C responded\
    \ with a style sheet language, CSS. CSS cleanly separates from the page content.\
    \ Although it was originally designed for HTML, CSS also works with XML.\n\nTwo\
    \ versions of CSS have been released so far: CSS1 and CSS2. builds on CSS1 but\
    \ it improves XML support, adds new styling options, and supports alternate media\
    \ such as paper printing and a rendering (for blind persons).\n\n+   CAUTION\n\
    At the time of this writing, Internet Explorer 5.0 and Mozilla support CSS for\
    \ XML documents. Other browsers support CSS but for HTML documents.\n\nCurrently,\
    \ most browsers implement at least some support for CSS1. Unfortunately, they\
    \ are not consistent in the features they support. Browsers that support a subset\
    \ of CSS2 are appearing on the market."
