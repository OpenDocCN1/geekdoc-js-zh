  md: "# # Some Advanced Features\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_198_0.png)\n\
    \n# ## XML Schema\n\nCopyright © 1999, Ramon Monthal\n\nStyling\n\nSheets are\
    \ authored in XML, an XSL stylesheet integrated in publishing and document management\
    \ applications. It is XML's standard style sheet, see http://www.w3.org/TR/xsl/\n\
    \nXSL Rules\n\nAn XSL style is a set of rules where each rule specifies how to\
    \ format certain elements in the document. e.g. to continue from the previous\
    \ section, the stylesheet has rules for lists, paragraphs and keywords\nWith XSL\
    \ you can not only transform but also reorganize it, e.g. by moving the title\
    \ to the next page or extracting the list of keywords. For publishing, XSL can\
    \ be used to convert documents between the company-specific markup and a standard\
    \ one.\n\n# ## The Flexibility of Styles\n\nStyles are separated from documents.\
    \ One document can have more than one stylesheet, and conversely, one style can\
    \ be swapped around documents.\nThis means that a document can be rendered differently\
    \ depending on the media or the audience. For example, a 'management' style might\
    \ provide a summary of a document that highlights key elements but a 'scientific'\
    \ style may display more detailed information.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_198_1.png)\n\
    \nFigure 6.7: Showing an advanced style sheet in a browser\n\n# ## Sibling Selector\n\
    \n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_198_2.png)\n\nCSS2 also recognizes\
    \ sibling selectors. A sibling selector points to an element only if it immediately\
    \ follows another element. The following example states the first paragraph after\
    \ a title has no indentation. Other paragraphs have normal indentation.\n\n```\n\
    title + p {\n  text-indent: @in;\n}\n```\n\n# ## Attribute Selector\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_198_3.png)\n\
    \nLike XSL paths, selectors can refer to the presence or the value of attributes.\
