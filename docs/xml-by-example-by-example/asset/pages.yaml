  md: '# XSL Transformation


    In the last three chapters, you learned the basics of XML. Specifically, you learned
    the XML syntax, how to read and write XML documents, how to organize and structure
    XML documents with schemas, and how to extend and reuse schemas through namespaces.


    This chapter is more practical. It shows you how to manipulate XML documents.
    In this and the following chapter, we will look at styling—how to display a document
    with a browser or an editor.


    In this chapter, you will learn how to use XSL, the XML Stylesheets Language,
    to


    +   * convert XML documents in XML (with a different DTD), HTML, and other formats


    +   * publish a large set of documents


    +   * reorganize XML documents to create table of contents or other information


    +   * extract information from XML documents'
