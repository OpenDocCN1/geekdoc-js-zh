  md: '# The Basics of CSS


    As you can see, the syntax is distinctly not XML. A CSS style sheet is a list
    of rules (similar to XSL templates). Each rule starts with a selector (similar
    to XSL path) to which properties are associated.


    As the name implies, the selector selects to which element the properties apply.


    To attach the style sheet to a document, use the familiar XML-stylesheets processing
    instruction. The type, however, must adapt to text/css. Unlike XSLT, there is
    no command-line processor for CSS. The browser is the processor. 6.2 shows the
    document in Listing 6.2 loaded in Internet Explorer 5.0.


    # Listing 6.2: An XML Document Linking to a CSS Style Sheet


    ```

    <xml version="1.0"

    <?xml-stylesheet href="article.css" type="text/css">

    <article fname="article.xml">

    <title>XML Style Sheets</title>

    <date>January 1999</date>

    <copyright>1999, Benoit Marchal</copyright>

    <abstract>Style sheets add flexibility to document viewing.

    <keywords>XML, XSL, style sheet, publishing, web</keywords>

    <section>

    ```


    <p>Send comments and suggestions to <url protocol="mailto:

    >bmarchal@pineapplesoft.com</</url></p>


    </section>


    <section>


    <title>How Works</title>


    <p>Style sheets are inherited from SGML, an XML ancestor. Style sheets

    originated in publishing and document management applications. XSL is XML''s

    standard style sheet, see <url>http://www.w3.org/Style/</url></p>


    </section>


    <section>


    <title>The Added Flexibility of Style Sheets</title>


    <p>An XSL style sheet is a set of rules where each rule specifies how to format

    certain elements in the document. To continue the example from the previous

    section, the style sheets have rules for text, paragraphs and keywords.</</p>

    <p>With XSL, these rules are powerful enough not only to format the document

    but also to reorganize it, by moving the list of keywords to the front or page

    extracting This can lead to exciting applications of XSL

    outside the realm of traditional publishing. For example, XSL can be used to

    convert duments by the company-specific markup and a standard one.</</p>


    </section>


    <section>


    continues'
