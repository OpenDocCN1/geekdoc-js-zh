  md: '# Chapter 5: XSL Transformation


    # NOTE


    The latest draft of XSLT available at the time of this writing has introduced
    a new element, xsl:output, that plays a role similar to the html command-line
    parameter of LotusXSL.


    For example, the following element specifies that the transformation is from XML
    to HTML:


    ```

    <xsl:output method="html/>

    ```


    The following sections examine the style sheet in more detail.


    # Stylesheet Element


    The style sheet is a well-formed XML document (XSL designers thought that XML
    was the best syntax for a style sheet). It describes the tree of the source document,
    the tree of the resulting document, and how to transform one into the other. The
    top-level element is style sheet as shown in the example:


    ```

    <xsl:stylesheet

    xmlns="http://www.w3.org/1999/XSL/Transform"

    xmlns:html="http://www.w3.org/TR/REC-html40">

    <xsl:output method="html"/>

    ```


    The style sheet contains elements from different documents, spaces are used to
    organize these elements:


    +   - The XSL namespace is used for the XSL vocabulary. Its URI must be http://www.w3.org/1999/XSL/Transform/1.0.

    - The resulting document has another namespace. In this case, the default namespace
    is attached to HTML 4.0.


    # Template Elements


    The bulk of the style sheet is a list of templates. The following example transforms
    the title of a section in an HTML paragraph with the text in italic:


    ```

    <xsl:template match="section/title">

    <P><I>xsl:apply-templates/></I></P>

    </xsl:template>

    ```


    A template has two parts:


    +   - The match parameter is a path to the element in the source tree to which
    the template applies.

    - The content of the template lists the elements to insert in the resulting tree.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Paths


    The syntax for XML paths is similar to file paths. XML paths start from the root
    of the document and list elements along the way. Elements are separated by the
    “/” character.


    The root of the document is “/”. The root is a node that sits before the top-level
    element. It represents the document as a whole.


    The following four paths match respectively the title of the article <title>XML
    Style Sheets</title>, the keywords of the article, the top-level element, and
    all sections in the article. Note that the last path matches several elements
    in the source tree.


    ```

    /article/title

    /article/keywords

    /article

    /article/section

    ```


    > Note “/” points to the immediate children of a node. /article/title selects
    the main title of the article (XML Style Sheets), not the titles below the article
    element. It does not select the section titles.


    > To select all descendants from a node, use the // sequence. /article//title
    selects all the titles in the article. It selects the main title and the section
    titles.


    In the style sheet, most paths don’t start at the root. XSL has the notion of
    current element. Paths in the match attribute can be relative to the current element.


    Again, this is similar to the file system. Double-clicking the accessories folder
    in the c:\program files moves to c:\program files folder, not to c:\accessories.


    If the current element is an article, then title matches /article/title but if
    the current article is section, title matches one of the /article/section/titles.


    To match any element, use the wildcard character “*”. The path /article/* matches
    any direct descendant from article, such as title, keywords, and so on.


    It is possible to combine paths in a match with the “|” character, such as title
    |p matches title or p elements.'
