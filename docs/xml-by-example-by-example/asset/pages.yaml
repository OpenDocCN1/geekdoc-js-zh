    The difficulty is finding the appropriate granularity. Is the previous example?
    Unlikely. It is probably best to mark more. For example:


    ```

    <entry>

    <name>John Doe</name>

    <address>

    <street>34 Fountain Square Plaza</street>

    <region>OH</region>

    <postal-code>45202</postal-code>

    <locality>Cincinnati</locality>

    <country>US</country>

    </address>

    <tel>513-555-8889</tel>

    </entry>

    ```


    Is this enough or do you need to further break some of the elements, such as


    ```

    <name>

    <fname>John</fname>

    <lname>Doe</lname>

    </name>

    ```'
