  md: '# Font Style and Weight


    The font-style and font-weight properties indicate whether the font is italicized
    or bold, respectively. The following example sets the font to bold and italic:


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_194_0.png)


    +   font-weight: bold;

    font-style: italic;


    font-style accepts only three values: normal, italic, and oblique. Italic and
    oblique are similar but italic uses a special font for italic whereas oblique
    is the original font bent.


    font-weight accepts the following values: normal, bold, bolder, lighter, 100,
    200, 300, 400, 500, 600, 700, 800, 900.


    normal and bold are self-explanatory. border and lighter are relative to the inherited
    weight value. normal is equivalent to 400 and bold is 700.


    # Text Alignment


    There are two properties to control text alignment: text-align controls alignment
    against the left and right margins, while vertical-alignment controls vertical
    alignment. Use vertical alignment to write x². The following example prints the
    text in superscript justified against the right margin:


    +   text-align: right;

    vertical-align: super;


    text-align accepts left, right, center, and justify. vertical-alignment accepts
    baseline, sub, super, top, text-top, middle, bottom, text-bottom, or a percentage.
    You will recognize values inherited from HTML.


    # TextIndent and Line Height


    The text-indent and line-height properties define respectively the indentation
    of the first line and the spacing between adjacent lines. The following example
    elements indent the element by 0.5 inch. It also defines the line height as being
    120% of the font size.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_194_1.png)


    +   text-indent: 0.5in;

    line-height: 120%;


    text-indent accepts a percentage (relative to the parent element) or a length.
    line-height defines the spacing between adjacent lines as normal, as a length,
    as a percentage (relative to the font size), or as a number. If the value is a
    number, the line height is equal to the font size times the'
