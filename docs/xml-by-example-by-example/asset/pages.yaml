    # Directories


    The configuration files require that the files are organized in the following
    directories:


    +   * data contains the list of merchants and an XMLI product list.

    * xsl contains the style sheet for the shop, with the exception of Emailaholic-specific
    style sheets.

    * properties contains all of the property files.

    * docs is the document directory for the shop. It contains the JavaScript editor.js.

    * emailaholic is the document directory for Emailaholic. It contains Emailaholic
    XSL files and images.

    * xmli is an empty directory where XMLI orders are stored.


    # Compiling and Running


    Before running this application, you must compile all the Java files. Using the
    Java compiler as:


    ```

    javac -classpath c:\java\lib\javax.servlet.jar;c:\lotus\lotusql.jar;c:\xml4j.jar;
    -sourcepath

    Shop.java

    ```'
