    The following example sets the margin to 10 pixels wide in every direction:

    margin: 10px;


    # Padding Properties


    Padding is defined exactly like margins with the properties padding-top,\padding-right,
    padding-bottom, padding-left, and padding except that auto

    is not an acceptable value. The following example sets a padding of 0.2\inch:


    ```

    padding: 0.2in;

    ```


    # Border-Style Properties


    The border-style property sets the style of the border to none, dotted,

    dashed, solid, double, groove, ridge, inset, or outset. The following example-

    ple paints a solid border around the box element:

    border: solid;


    It is possible to set a different style for the top, right, bottom, and left parts

    of the border by repeating the value as in

    border: solid, dotted, double, inset;


    # TIP


    The border of an element is not visible until the border-style property is set.
    By

    default, border-style is set to none.


    # Border-Width Properties


    The border-top-width, border-right-width, border-bottom-width, and

    border-left-width properties control the width of each border independent.

    Acceptable values are thin, medium, thick, or an absolute length.


    In most cases, it is easier to set the four values at once, with the border-

    width property, as in the following example:

    border-width: thin;


    # Border Shorthand


    The border-top, border-right, border-bottom, border-left, and border

    properties are shorthand for all previous properties. They list the width,

    style, and color of the border as in


    ```

    border: thin solid silver;

    ```'
