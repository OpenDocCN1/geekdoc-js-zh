  md: "# Why Styling?\n\nXML concentrates on the structure of the information and\
    \ not its appearance. However, to view XML documents we need to format or style\
    \ them. Obviously, the styling instructions are directly related to and derived\
    \ from the structure of the document.\n\nIn practice, styling instructions are\
    \ organized in style sheets; to view a document, apply the appropriate style sheet\
    \ to it.\n\nThe W3C has published two recommendations for style sheets: CSS, short\
    \ for Cascading Style Sheet, and XSL for XML Stylesheet Language.\n\n# CSS\n\n\
    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_143_0.png)\n\nCSS was originally developed\
    \ for HTML and browsers that support XML largely support it. A CSS is a set of\
    \ rules that tells the browser which font, style, and margin to display the text,\
    \ as shown in the following example:\n\n```\nsection.title {\n\nfont-family: Palatino,\
    \ Garamond, \"Times New Roman\", serif;\nfont-size: 10pt;\nmargin: 5px;\ndisplay:\
    \ block;\nfont-style: italic;\n}\n```\n\n> CSS is the topic of Chapter 6, \"XSL\
    \ Formatting and Cascading Style Sheet,\" page 161.\n\n# XSL\n\nXSL is more ambitious\
    \ than CSS because it supports transforming the document before display. XSL would\
    \ typically be used for advanced styling such as creating a table of contents\
    \ in the following example:\n<B>Table of Contents</B></P>\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_143_1.png)\n\
    \n+   <ul>\n  <li><xsl:for-each=\"article/section\">\n  <li><A><xsl:value-of select=\"\
    .\"/></A></li></li>\n  </xsl:for-each>\n</ul>"
