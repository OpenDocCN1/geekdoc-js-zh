  md: '# XSL Formating Objects and Cascading Style Sheet


    The previous chapter was a first look at styling XML documents. You learned how
    to use XSLT to convert XML documents to HTML and other formats.


    This chapter picks up from there. It discusses Cascading Style Sheet (CSS) and
    XSLFO (XSL Formatting Objects). Conceptually, CSS and XSLFO are similar, but so
    far XSLFO has achieved limited market acceptance so I will concentrate on CSS
    and look only at how XSLFO differs.


    Specifically, in this chapter, you will learn


    +   - how to display XML without converting it to HTML

    - how to customize XML editor for author comfort'
