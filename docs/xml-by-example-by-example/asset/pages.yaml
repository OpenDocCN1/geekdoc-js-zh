  md: '# Where to Apply the Style Sheet


    So far, we have converted the XML documents before publishing them. The client
    never sees XML; it manipulates only HTML.


    Today, this is the realistic option because few users have an XML-enabled browser
    as Internet Explorer 5.0 or a beta version of Mozilla 5.0 (Mozilla is the open
    source version of Netscape Communicator). Furthermore, the XSL recommendation
    is not final yet so implementations of XSL processors are not always compatible
    with one another.


    Yet, if your users have XML-enabled browsers, it is possible to send them raw
    XML documents and style sheets. The browser dynamically applies the style sheets
    and renders the documents. Figure 5.8 contrasts the two options.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_162_0.png)


    Figure 5.8: Style sheets on the server or on the client


    # Internet Explorer 5.0


    > CAUTION

    Because XSL is still in draft, browser implementations are not compatible. The
    material in this section works with Internet Explorer 5.0, which implements an
    early draft of XSL and is not compatible with the current draft, much less with
    the future recommendation.


    The processing instruction xml-stylesheet associates a style sheet with the current
    document. It takes two parameters, an href to the style sheet and the type of
    the style-stylesheet href="simple-ie5.xml" type="text/xml">


    Listing 5.6 is the XML document with the appropriate processing instruction for
    Internet Explorer 5.0.


    +   Listing 5.6: The XML Document Prepared for Internet Explorer 5.0


    ```

    <xml version="1.0"?>

    <xml-stylesheet href="simple-ie5.xml" type="text/xml">

    ```


