    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_70_0.png)


    Figure 2.2: The character code in Character Map


    # Special Attributes


    XML defines two attributes:


    +   xml:space for those applications that discard duplicate spaces (similar to
    Web browsers that discard unnecessary spaces in HTML). This attribute controls
    whether the application can discard spaces. If set to preserve, the application
    should preserve all spaces in this element and its children. If set to default,
    the application can use its default space handling.


    +   xml:lang in publishing, it is often desirable to know in which language the
    content is written. This attribute can be used to indicate the language of the
    element''s content. For example:


    ```

    <p xml:lang="en-GB">What colour is it?</p>

    <p xml:lang="en-US">What color is it?</p>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_70_1.png)


