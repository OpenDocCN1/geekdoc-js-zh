  md: '# Customized Views


    Currently, most people access the Web through a browser on a Windows PC. Some
    people use Macintoshes, others use UNIX workstations. This will change in the
    future as more people turn to specialized devices. Already WebTV has achieved
    some success with a browser in a TV set.


    Mobile phones and PDAs, such as the popular PalmPilot, will be increasingly used
    for Web browsing. Ever surfing on a PalmPilot? It works surprisingly well well,
    but on the small screen, many Web sites are not readable enough.


    One solution to address the specific needs of smaller devices might be to use
    XHTML, an XML version of HTML. XHTML is based on HTML but it has an XML syntax
    (as opposed to SGML syntax). It is also designed to be modular as it is expected
    smaller devices will implement only a subset of the recommendation.


    According to W3C, these new platforms might account for up to 75% of Web viewing
    by the year 2002. What can you do about it? Will you have to maintain several
    versions of your Web site: one for existing Web browsers and one for each new
    device with its own subset?


    XSL to the rescue! It will be easy to manage the diversity of browsers and platforms
    by maintaining the document source in XML and by converting to the appropriate
    XHTML subset with XSLT. In essence, this is how I manage the e-zine. Figure 5.7
    illustrates how this works.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_161_0.png)


    Figure 5.7: Maintain one XML document and convert it to the appropriate markup
    language.'
  merge: -1
