  md: "# The DTD Syntax\n\nObviously, the URIs in the catalog point to local copies\
    \ of the DTD, the XML processor saves some downloads.\n\nListing 3.4 is an example\
    \ of a catalog file.\n\nListing 3.4: A Catalog File\n\n```\n<XMLCatalog>\n<Base\
    \ HRef=\"catwoman.pineapplesoft.com/dtd/\"\n<Map PublicId=\"-pineapplesoft/Address\
    \ Book/EN\">\nHRef=\"address-book.dtd/\"\n<Map PublicId=\"-pineapplesoft/Article/EN\"\
    >\nHRef=\"article.dtd/\"\n<Map PublicId=\"-pineapplesoft/Simple Order/EN\">\n\
    HRef=\"order.dtd/\"\n\n  <Extend HRef=\"http://www.w3.org/xcatalog/mastercard.xml\"\
    />\n</XMLCatalog>\n```\n\nFinally, note that a document can have both an internal\
    \ and an external subset as in\n\n```\n<!DOCTYPE address SYSTEM \"address-content.dtd\"\
    \ [\n<!ELEMENT address (street,region?,postal-code,location,country)>\n<!ATTLIST\
    \ address preferred (true | false) \"false\">\n]\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_96_0.png)\n\
    \n# Public Identifiers Format\n\nThe following public identifiers point to the\
    \ address book:\n\"-/pineapplesoft/Address Book/EN\"\n\nThere are four parts,\
    \ separated by \"//\":\n\n+   - The first character is + if the organization is\
    \ registered with ISO, - otherwise (most frequent).\n- The second part is the\
    \ owner of the DTD.\n- The third part is the description of the DTD; spaces are\
    \ allowed.\n- The final part is the language (EN for English).\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_96_1.png)\n\
    \n# Standalone Documents\n\nAs you have, the DTD not describes the document, but\
    \ it can affect how the application reads the document. Specifically, default\
    \ and fixed attribute values will add information to the document. Entities are\
    \ also declared in the DTD, modify the document."
