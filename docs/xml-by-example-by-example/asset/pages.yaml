  md: '# 482 Appendix A


    Java Archive (JAR) files were introduced to solve this problem. A JAR file groups
    all the classes in an application and it ensures that the paths are also preserved.


    Internally, JAR files are zip files so you can create them with WinZip or another
    zip tool. In practice, however, it is easier to use the JAR application included
    in the JDK.


    You create a JAR file with the following command:


    ```

    jar cvf xdic.jar com.psol\xdic\Dic.class

    ```


    If everything goes well, this command creates a new xdir.jar. You can use this
    file in classpath:c:\jetty\lib\javax.servlet.jar instead of your application directory,
    as in


    ```

    c:\jetty\lib\com.mortbay.Jetty.jar;xdir.jar

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_499_0.png)


    # Java Core API


    Java comes with an extensive library that covers many needs. The standard library
    or core API is available in the java packages. The main packages are as follows:


    +   * java.applet defines the API for applets.

    * java.awt is the library for graphical user interface development. AWT supports
    buttons, menus, list boxes, and more.

    * java.beans provides services for Java components or JavaBeans.

    * java.io provides services to read and write data streams (mainly from files).

    * java.lang provides core objects such as exceptions. You do not need to import
    this package; it is always imported.

    * java.net provides network services.

    * java.sql provides access to SQL databases through an interface similar to ODBC.

    * java.util provides utility classes such as Vector, Hashtable, and Calendar.


    Obviously, you are not limited to the packages in the core API. You can download
    more packages such as IBM''s XML for Java and use them in your application.'
