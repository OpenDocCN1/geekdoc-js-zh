  md: '# Font Shorthand


    If you think there are too many font properties, you can group them all in one
    with the font property. It has the following format:

    font: italic bold 12pt/14pt Palatino, serif


    The order is: font style, variant, weight, size, line height (separated from the
    size by a "/"), and family names. The font weight and the line height are optional.


    # Color and Background Properties


    CSS has several properties to set the color of texts, boxes, borders, or grounds.


    # Foreground Color


    The simplest color property is the text foreground color. The color property controls
    it. The following examples all set the text color to blue:

    color: blue;

    color: rgb(0,0,100);

    color: #0000FF;


    # Background Color


    The background-color controls the color of the background. It accepts a color
    value or the keyword transparent (what is behind a transparent background shines
    through). The following properties all set the background color to white:

    background-color: white;

    background-color: rgb(0,0,0);

    background-color: #000000;


    # Border Color


    The color of the box border is controlled by the border-color property, which
    accepts one or four colors as value. The four borders (top, right, bottom, and
    left) can be set independently, like margins. The following property draws an
    olive border:

    border-color: olive;


    # Background Image


    If you''re unhappy with a plain background, then use an image, for example, a
    logo as a background. background-image loads the image. It takes a URL as value
    or none. The following example sets a background image:

    background-image: url(logo.gif);'
