  md: '# Application of XML.


    Although I have mentioned in passing that XML is not just for Web site publishing,
    all the examples I have given so far are more or less related to Web publishing.
    In this section, I will present some of the most popular applications for XML.


    Applications of XML are classified as being one of the two types:


    +   * Document applications manipulate information that is primarily intended
    for human consumption.

    * Data applications manipulate information that is primarily intended for software
    consumption.


    The difference between the two types of application is a qualitative one. It is
    the same XML standard, it is implemented by using the same tools, but it serves
    different goals. This is important because it means you can reuse tools and experience
    across a large set of applications.


    ```

    Listing 1.8: continued

    <header>

    <body>

    <para>Have you heard of this new technology, XML? It looks promising. It is similar
    to HTML but it is extensible. All the big names (Microsoft, IBM, Oracle) are backing
    it.</para>

