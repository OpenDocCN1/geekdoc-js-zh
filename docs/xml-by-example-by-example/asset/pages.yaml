    > The BestDeal application introduced in Chapter 8 compares prices and finds that
    XMLI delivers the cheapest training available in fewer than five days (page 231).


    A price comparison agent such as BestDeal is really interesting when it is made
    available through the Internet.


    The agent collects pricing information from various merchants and instantaneously
    computes the best deal for specific users. However, it is unlikely that merchants
    will want to contribute their price lists unless they receive some sort of promotion
    for doing so.


    +   1. It would therefore make sense, at the minimum, to publish the list of merchants
    with links or additional information on the Web site.


    Traditionally (without XML), this would require a fixed template that the merchants
    would need to fill in. For example, they could include their address or other
    useful information. The fixed template would look like Listing 10.5. However,
    you can do better thanks to XML''s flexibility.


