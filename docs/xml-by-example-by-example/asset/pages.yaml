  md: '# Chapter 9: Writing XML


    +   - hasChildNodes() returns true if the node has children; false other-wise.


    # CharacterData


    CharacterData defines the following methods. These methods are inherited by Text,
    Comment, and CDATASection:


    +   - appendData(data) appends data at the end of the text.

    - insertData(offset,data) inserts data in the current text starting at offset.

    - deleteData(offset,length) deletes characters starting at offset.

    - replaceData(offset,length,data) inserts data in place of the characters at offset
    for a length.

    - substringData(offset,length) returns the characters at offset for a length.


    # Element


    Element has the following methods for manipulating the XML document:


    +   - setAttribute(name,value) creates an attribute called with the value.

    - setAttribute(attr) adds an Attr object to the element.

    - getAttribute(name) returns the value of the attribute called name.

    - removeAttribute(name) removes the attribute name from the element.

    - setAttributeNode(attr)/getAttributeNode(name)/removeAttributeNode(attr) are
    similar to setAttribute(), getAttribute(), and removeAttribute() except that they
    accept or return Attr objects.


    # NOTE


    There are two solutions for creating attributes:


    +   - Create the attribute with Document.createAttribute() and attach it to the
    element with setAttribute().

    - Create the element and attach it to the element in one step with Element.setAttribute().'
