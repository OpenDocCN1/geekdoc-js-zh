  md: 'XML has many types of entities, classified according to three criteria: general
    or parameter entities, internal or external entities, and parsed or unparsed entities.


    # General and Parameter Entities


    General entity references can appear anywhere in text or markup. In practice,
    general entities are often used as macros, or shorthand for a piece of text. External
    general entities can reference images, sound, and other documents in non-XML format.
    Listing 3.10 shows how to use a general entity to replace some text.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_103_0.png)


    ```

    Listing 3.10: General Entity

    ```xml

    <?xml version="1.0?>

    <!DOCTYPE address-book [

    <!ENTITY jacksmith [

    <name>

    <fname>Jack</fname><lname>Smith</lname>

    <tel>513-555-3465</tel>

    <email href="mailto:jsmith@emailaholic.com"/>

    </name>

    ]>

    <address-book>

    &thymeleaf;

    </address-book>

    ```

    ```


    General entities are declared with the markup <ENTITY followed by the entity name,
    the entity definition, and the customary right angle bracket.


    > TIP

    General entities are also often used to associate a mnemonic with character references
    in as


    <ENTITY icirc "&#x238;">


    As we see in Chapter 2, "The XML Syntax," the following entities are pre-defined
    in XML: "&lt;", "&amp;", "&gt;", "&apos;", and "&quot;"\Parameter entity references
    can only appear in the DTD. There is an extra % character in the declaration before
    the entity name. Parameter entity references also replace the ampersand with a
    percent sign in


    ```

    <!ENTITY % boolean ''(true | false)'' ''false''>

    <!ELEMENT tel (#CDATA)>

    <!ATLIST tel preferred boolean;>

    ```'
