  md: '# Namespaces


    ```

    <pa:rating>G</pa:rating>

    <name>XML.com</name>

    <link href="http://www.xml.com/">

    <qa:rating>4 stars</qa:rating>

    <pa:rating>G</pa:rating>

    <name>Comics.com</name>

    <link href="http://www.comics.com/">

    <qa:rating>5 stars</qa:rating>

    <pa:rating>G</pa:rating>

    <name>Fatbrain.com</name>

    <link href="http://www.fatbrain.com/">

    <qa:rating>4 stars</qa:rating>

    <pa:rating>G</pa:rating>

    <name>ABC News</name>

    <link href="http://www.abcnews.com/">

    <qa:rating>3 stars</qa:rating>

    <pa:rating>PG</pa:rating>

    </references>

    ```


    At first sight, Listing 4.6 is similar to Listing 4.5: It declares two different
    names for the ratings.


    The major difference is the form of the names. In Listing 4.6, a prefix is added
    before each element name. A colon separates the name and the prefix:


    ```

    <qa:rating>5 stars</qa:rating>

    ```


    The prefix unambiguously alone identifies the type of rating in this document.
    However, prefixes alone solve nothing because anybody can create prefixes. Therefore,
    people can create incompatible prefixes and we are back to one step: We have moved
    the risk of conflicts from element names to prefixes. To avoid conflicts in prefixes,
    the prefixes must be declared:


    ```

    <references xmlns="http://joker.playfield.com/star-rating/1.0">

    xmlns="http://penguin.xml.com/review/1.0"

    xmlns="http://catman.pineapplesoft.com/ref/1.5">

    ```


    The declaration associates a URI with a prefix. This is cries for the namespaces
    proposal unlike URIs, piggyback on the registration mechanisms established for
    URIs.


    For example, URLs are guaranteed to be unique because they are based on domain
    names. Domain names are registered to guarantee uniqueness'
