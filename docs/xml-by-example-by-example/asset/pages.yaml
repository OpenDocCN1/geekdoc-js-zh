- img_proc: true
  md: 'The question is: “Where do you stop?” What is the correct granularity for an
    XML document? Unfortunately, there are no strict criteria. Your experience will
    guide you. It is, however, a good idea to mark up as much as is convenient.


    The end user’s convenience is the best guideline to use when deciding where to
    stop breaking a document into smaller pieces.


    Indeed, if the DTD is too detailed and requires the user to identify details,
    it won''t work. The document may be highly structured, but upon closer analysis,
    most of the markup will prove to be incorrect. This problem is often experienced
    by database administrators who have very good data schemas but very poor information
    in the database.


    For example, if you were to ask users to break the street into further components
    such as


    ```

    <street>

    <nr>34</nr>

    <name>Fountain Square</name>

    <type>Plaza</type>

    </street>

    ```


    It probably wouldn''t work. Realistically, few people would know where to insert
    the markup. It is <type>Plaza</type> or


    ```

    <street>

    <nr>34</nr>

    <name>Fountain</name>

    <type>Square Plaza</type>

    </street>

    ```


    The only way to know when to stop breaking a document into smaller pieces is to
    write sample documents or even small prototypes as you design the DTD. As you
    gain experience with XML, this will become easier.


    Use the sample documents or the prototype to test the usability of the DTD. Does
    it accurately capture all the information? Does it capture enough details? Is
    it nonobtrusive? You don''t want to capture too many details and alienate the
    users.


    # Avoiding Too Many Options


    As you finalize your DTD, you should proofread it to check against excessive options.


    A warning bell should ring in your head if the DTD leaves too many options open.
    This is usually a sign that you need to be stricter in the markup.'
