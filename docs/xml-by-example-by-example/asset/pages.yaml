  md: 'Chapter 8: Alternative API: SAX


    # DTDHandler


    DTDHandler declares two events related to parsing the DTD:


    +   - notationDecl() notifies the application that a notation has been declared.

    - unparsedEntityDecl() notifies the application that an unparsed entity declaration
    has been found.


    # EntityResolver


    > The EntityResolver interface defines only one event, resolveEntity(). The method
    returns an InputSource, which was introduced in the section "InputSource" on page
    243.


    Few applications need to implement EntityResolver because the SAX parser can resolve
    filenames and most URLs already.


    # ErrorHandler


    The ErrorHandler interface defines several events in case of errors. Applications
    that handle these events can provide custom error processing.


    After a custom error handler is installed, the parser does not throw exceptions
    anymore. Throwing exceptions is the responsibility of the event handlers.


    There are three methods in this interface that correspond to three levels or gravity
    of errors:


    +   - warning() signals problems that are not errors as defined by the XML specification.
    For example, some parsers issue a warning when there is no XML declaration. It
    is not an error (because the declaration is optional), but it is worth noting.

    - error() signals errors as defined by the XML specification.

    - fatalError() signals fatal errors, as defined by the XML specification.


    # SAXException


    Most methods defined by the SAX standard can throw a SAXException. A SAXException
    signals an error while parsing the XML document.


    The error can either be a parsing error or an error in an event handler. To report
    errors from the event handler, it is possible to wrap exceptions in SAXException.'
