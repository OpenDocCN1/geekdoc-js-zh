  md: '# Four Common Errors


    As you have seen, the XML syntax is very strict: Elements must have both a start
    and end tag, or they must use the special empty element tag; attribute values
    must be fully quoted; there can be only one top-level element and so on.


    A strict syntax was a design goal for XML. The browser vendors asked for it. HTML
    is very lenient, and HTML browsers accept anything that vaguely looks HTML. It
    might have helped with the early adoption of HTML but now it is a problem.


    Studies estimate that more than 50% of the code in a browser deals with errors
    or the slipperiness of HTML authors. Consequently, an HTML browser is difficult
    to write, it has slowed competition, and it makes for mega-downloads.


    It is expected that in the future, people will increasingly rely on PDAs (Personal
    Digital Assistants like the PalmPilot) or portable phones to access the Web. These
    devices do not have the resources to accommodate a complex syntax or megabyte
    browsers.


    In short, making XML stricter meant simplifying the work of the programmers and
    that translates into more competition, more XML tools, smaller tools that fit
    in smaller devices, and, hopefully, faster tools.


    Yet, it means that you have to be very careful about what you write. This is particularly
    true if you are used to writing HTML documents. In this section, I review the
    four common errors in writing XML code.


    # Forget End Tags


    For reasons explained previously, end tags are mandatory (except for empty elements).
    The XML processor would reject the following because street and country have no
    tags:


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_76_0.png)


    ```

    <address>

    <street>34 Fountain Square Plaza</street>

    <region>OH</region>

    <postal-code>45202</postal-code>

    <locality>Cincinnati</locality>

    <country>US</country>

    </address>

    ```'
  merge: -1
  pgno: 76
- img_proc: true
  md: "# Forget That XML Is Case Sensitive\n\nXML names are case sensitive. The following\
    \ two elements are different for XML. The first one is a \"tel\" element whereas\
    \ the second one is a \"TEL\" element:\n\n```\n<tel>513-555-7098</tel>\n<TEL>513-555-7098</TEL>\n\
    ```\n\nA popular variation on this error is to use a different case in the opening\
    \ and closing tag of an element:\n\n```\n<tel>513-555-7098</tel>\n```\n\n# Introduce\
    \ Spaces in the Name of Element\n\nIt is illegal to introduce spaces in the name\
    \ of elements. The XML processor interprets spaces as the beginning of an attribute.\
    \ The following example is not valid because address book has a space in it:\n\
    \n```\n<address book>\n  <entry>\n    <name>John Doe</name>\n    <email href=\"\
    mailto:jdoe@emailaholic.com\"/>\n  </entry>\n</address book>\n```\n\n# Forget\
    \ the Quotes for Attribute Value\n\nUnlike HTML, XML forces you to quote attribute\
    \ values. The following is not acceptable:\n\n```\n<tel preferred=true>513-555-8889</tel>\n\
    ```\n\nA popular variation on this error is to forget the closing quote. The XML\
    \ processor assumes that the content of the element is part of the attribute,\
    \ which is guaranteed to produce funny results! The following is incorrect because\
    \ the attribute has no closing quote:\n\n```\n<tel preferred=true=513-555-8889</tel>\n\
    ```\n\n# XML Editors\n\nIf are like me, you will soon hate writing XML by hand.\
