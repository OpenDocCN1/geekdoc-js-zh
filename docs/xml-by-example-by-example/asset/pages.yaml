  md: '# Chapter 3: XML Schemas


    +   * ENTITY must be the name of an external entity; this is how you assign

    external entity to an attribute.

    * ENTITIES is a list of ENTITY separated by spaces.

    * NMTOKEN is essentially a word without spaces.

    * NMTOKENS is a list of NMTOKEN separated by spaces.

    * Enumerated-type list is a closed list of mtokens separated by |,

    t value can be one of the mtokens. The list of tokens can further be

    limited to NOTATIONS (introduced in the section "Notation,") later in the

    chapter).


    Optionally, the DTD can specify a default value for the attribute. If the doc-

    ument does not include the attribute, it is assumed to have the default

    value. The default value can take one of the four following values:


    +   * #REQUIRED means that a value must be provided in the document

    * #IMPLIED means that if no value is provided, the application must use

    its default

    * #FIXED followed by a value means that attribute value must be

    value declared in the DTD

    * A literal value means that the attribute will take this value if no value

    is given in the document.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_93_0.png)


    NOTE

    Information that remains constant between documents is an ideal candidate for

    #FIXED attributes. For example, if prices are always given in dollars, you could
    declare

    a price element as


    ```

    <ELEMENT price (#PCDATA)>

    <!ATTLIST price currency NMTOKEN #FIXED "usd">

    ```


    When the application reads

    <price>19.99</price>

    in a document, it appears as though it reads

    <price currency="$">19.99</price>

    The application has received additional information but it didn’t require additional

    markup in the document!


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_93_1.png)


