  md: '# Chapter 3: XML Schemas


    +   * Name choice should not be a substitute for proper documentation; meaningless
    tags and acronyms might encourage you to properly document the application.


    # A Tool to Help


    I find drawing trees on a piece of paper an exercise in frustration. No matter
    how careful you are, after a few rounds of editing, the paper is unreadable and
    modeling often requires several rounds of editing!


    Fortunately, there are very good tools on the market to assist you while you write
    DTDs. The trees in this book were produced by Near & Far from Microstar (www.microstar.com).


    Near & Far is as intuitive as a piece of paper but, even after 1,000 changes,
    the tree still looks good. Furthermore, to convert the tree in the DTD, it suffices
    to save it. No need to remember which is another big plus.


    Figure 3.11 is a screenshot of Near & Far.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_121_0.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_121_1.png)


    Figure 3.11: Using a modeling tool


    # New XML Schemas


    The venerable DTD is very helpful. It provides valuable services to the application
    developer and the XML author. However, DTD originated in publishing and it shows.'
