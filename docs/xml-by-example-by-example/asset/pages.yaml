    \ notify the application of the document's beginning or ending.\n- startElement()/endElement()\
    \ notify the application that an element starts or ends (which corresponds to\
    \ the opening and closing tags of the element). Attributes are passed as an AttributeList;\
    \ see the section “AttributeList” that follows. Empty elements (<img href=\"logo.gif\"\
