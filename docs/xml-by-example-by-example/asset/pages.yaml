  md: '# 372 Chapter 11: N-Tiered Architecture and XML


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_389_0.png)


    Figure 11.10: Product information in a browser


    # Client


    The last tier is the client. Ultimately, it will be possible to send XML to the
    client and apply style sheets on the client. Currently, I would advise against
    sending any XML to the client. It makes more sense to convert to HTML on the server.


    There are several problems with XML on the client:


    +   - Currently, XML is supported only by the latest generation of browsers. Studies
    show that surfers are less likely to update their browsers than they were in the
    past, so implementation might take a while.

    - Even if your target audience has XML-capable browsers, not all browsers were
    born equal. There are important differences between version 4.0 and version 5.0
    of Internet Explorer and Mozilla, for example.

    - XSL implementations are particularly unstable. Internet Explorer 4.0 supported
    a very early version of XSL. Internet Explorer 5.0 is closer to the standard,
    but will need changes. Currently, no browser has a complete implementation of
    XSL.


    In conclusion, it will probably take more than two years before XML will be common.
    Frequently converting XML to HTML on the server is the safe solution. It buys
    you the best of both worlds: It works with older browsers but it still allows
    you to take advantage of XML in your applications.


    In the previous chapters, you saw many examples that performed poorly at processing
    on the client side. However, in each case, I warned that it would work only with
    specific browsers. eCommerce relies heavily on server-side conversion because
    it is a more realistic example.'
  merge: -1
