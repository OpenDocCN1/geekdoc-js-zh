    3. Generally speaking, elements offer more room for extension and reuse than attributes
    because elements are highly structured.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_359_0.png)


    For example, in Listing 10.22, the address element is reused in the sender and
