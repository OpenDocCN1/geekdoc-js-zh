    # Lessons Learned


    It is clear that elements and attributes have different characteristics. Unfortunately,
    nobody seems to agree on how to exploit them best.


    Over time, you will develop your own set of rules of when to use an attribute
    and when to use an element. My set of rules, as I have already explained, is to
    use elements for the essential property of an object and attributes for ancillary
    properties.


    This rule reflects my emphasis on structure over content. It is also very similar
    to the popular rule that originated in the SGML community that suggests using
    attributes for abstract concepts and elements for concrete ones.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_359_1.png)


    Note that this is not a hard rule but one that depends on the application being
    considered. For example, in the price-comparison application, the currency is
    second in importance to the price:


    ```

    <price currency="499.00\</price>

    ```


    However in a financial application, the currency may be an element in its own
    right:


    ```

    <currency>usd-</currency>

    ```


    > TIP

    Gray areas like this, where there are no clear rules, are unavoidable in XML.
    XML wouldn''t be so powerful and flexible if it didn''t offer several solutions
    for each problem.

    Don''t waste too much time trying to find the best rule because there probably
    is no best rule. Pick one approach, document it in nonambiguous terms as possible,
    and try to be consistent.'
