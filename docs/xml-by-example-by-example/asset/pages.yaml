  md: '# Chapter 1: The XML Galaxy


    Users tend to give significant names to the tags—for example, ''Heading'' is preferred
    to ''X12'', clearly recognizing the predominance of the structure over the formatting.


    The good news is that it is now possible to automatically process the document—for
    example, it would be possible to compile an index of URLs.


    # Standard Generalized Markup Language


    The Standard Generalized Markup Language (SGML) extends generic coding. Furthermore,
    it is an international standard published by the ISO (International Standard Organization).
    It is based on the early work done by Dr. Charles Goldfar from IBM.


    Dr. Goldfar was the inventor of the concepts behind SGML. He was a technical leader
    of the team that developed SGML.


    SGML is similar to generic coding but with two additional characteristics:


    +   * The Markup describes the document''s structure, not the document appearance.

    * The Markup conforms to a model, which is similar to a database schema. This
    means that it can be processed by software or stored in a database.


    SGML is not a standard structure that every document needs to follow. In other
    words, it does not define what a title or a paragraph is. In fact, it is unrealistic
    to believe that a single document structure can satisfy the needs of all authors.
    Technical documentation, books, letters, dictionaries, Web pages, timetables,
    and memos to name only a few, are too different to fit in a single canvas without
    putting unacceptable constraints on the authors.


    The SGML approach is not to impose its own tag set but to propose a language for
    authors to describe the structure of their documents and mark them accurately.
    This is the first difference between generic coding and SGML: The markup describes
    the structure of the document.


    SGML is an enabling standard, not a complete document architecture. The strength
    of SGML is that it is a language to describe documents—in many respects similar
    to programming languages. It is therefore flexible and open to new applications.


    The document structure is written in a Document Type Definition (DTD) sometimes
    also referred to as SGML application. A DTD specifies a set of elements, their
    relationships, and the tag to mark the content. This is another difference between
    generic coding and SGML: The markup follows a model.'
