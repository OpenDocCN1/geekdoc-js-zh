    # Namespaces


    The problem outlined in the previous example is... the extensible character of
    XML. There is no way to prevent somebody from extending a document in a way that
    is incompatible with other works. That''s the nature of extensibility. Because
    anybody can create tags, there is a huge risk of conflicts.


    One solution to prevent conflicts would be to establish a global registry of accepted
    tags and their associated definition. It would, however, severely limit XML''s
    flexibility.


    Nobody wants to limit XML''s flexibility. Flexibility was a major goal in the
    design of XML. The namespaces proposal addresses this problem with a more elegant
    approach: It does not limit extensibility but it introduces mechanisms to manage
    it.


    Listing 4.6 is equivalent to Listing 4.4 but it uses namespaces to prevent naming
    classes.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_129_0.png)


    ```

    <?xml version="1.0"?>

    <references xmlns="http://joker.playfield.com/star-rating/1.0"

    xmlns:pa="http://penguin.xmli.com/review/1.0"

    :name="http://catwoman.applesoft.com/ref/1.5">

    <link href="http://www.mcp.com/"/>

    <qa-rating>5 stars</qa-rating>

    <pa-rating>G</pa-rating>

    <name>PineapplesSoft Link</name>

    <link href="http://www.applesoft.com/newsletter/"/>

    <qa-rating>5 stars</qa-rating>

    ```'
