  md: '# XML Schemas


    In Chapter 2, "The XML Syntax," you learned how to write and read XML documents.
    More importantly, you learned that XML emphasizes the structure of documents.


    This chapter further develops that theme by looking at the DTD, short for Document
    Type Definition, a mechanism to describe the structure of documents. Specifically,
    you will learn how


    +   - model XML documents

    - express the model in a DTD

    - validate a document against its model


    The DTD is the original modeling language or schema for XML. However, for historical
    reasons, the DTD is somewhat limited and people are looking for solutions to overcome
    these limitations. The W3C is working on an alternative to DTD. We will review
    the current status of that effort.


    This chapter is probably the most abstract chapter in this book. You might want
    to temporarily skip the second half (starting from the section "Entities and Notations")
    and revisit it after you have read through the book.'
