    them all. It may be convenient to create a batch file to automate compiling.


    Now you are ready to start your Web server. If you use Jetty, the follow-ing command
    line:


    ```

    java -classpath c:\jetty\lib\javax.servlet.jar \

    c=c:\lotusxl\lotusxl.jar;c:\xml4j.jar;

