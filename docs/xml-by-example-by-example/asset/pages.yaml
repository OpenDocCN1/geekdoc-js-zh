  md: '# Chapter 10: Modeling for Flexibility


    The signature standard currently being developed by the W3C and the IETF (Internet
    Engineering Task Force) is another example of this approach. Although it has nothing
    to do with links or product prices, it is based on some same idea of standardizing
    a few elements required for some application. The application is cryptographic
    software in this case.


    Increasingly, you will need digitally signed documents. A digital signature guarantees
    that the document was written (or approved) by the signer.


    For example, electronic prescriptions would have to be signed. If you receive
    a prescription from your doctor via email (don''t laugh, some people are seriously
    considering this), you don''t want to be sure it originated from your doctor.
    You don''t want anyone else to prescribe your medicine.


    The same holds true for commercial and administrative documents such as orders,
    payments, passports, or even concert tickets. You want to be sure your tickets
    are valid. Do show the manager:


    The xmlds working group aims at developing a set of elements and attributes to
    represent digital signatures in XML documents.


    The benefit of a standard set of elements and attributes is always the same: The
    software (such as a browser) can recognize it and automatically process it.


    The work on the XML signature is still at a very preliminary stage. It is not
    even a draft standard, but the following example shows how XML signatures look
    like. This example is taken from Digital Signatures for XML by Richard D. Brown.


    Listing 10.14: Digital Signature in an XML Document


    ```

    <?xml version=''1.0''?>

    <!-- no URI has been agreed upon so far -->

    <Ticket xmlns:dsig=''

    <Body number=''120456789''>

    <Event desc=''concert in Austin''

    date=''1999-04-14T20:30:00-0500'' />

    <Beneficiary name=''John smith''

    ssno=''435-56-4023'' />

    </Body>

    <dsig:Signature>

    <dsig:Manifest>

    <dsig:Resources>

    <dsig:Resource>

    <dsig:Locator href=''120456789'' />

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_345_0.png)'
