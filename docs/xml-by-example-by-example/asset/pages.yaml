    # Mark It Up!


    The previous section reinforces the importance of structure and proper markup.
    In XML, everything is derived from the structure and it is therefore important
    that the structure be sound.


    Figure 10.7 illustrates the optimal situation. The information is maintained in
    a highly structured format. To create new documents, transformations are applied
    to the highly structured document. Some transformations are nondestructive but
    most are destructive.


    Most of these destructive transformations are for presentation purposes, as converting
    XML to HTML. Ultimately, as browsers implement more XML companion standards like
    XLink or XSLFO, less destructive conversions will be required.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_351_0.png)


    Figure 10.7: How to use XML


    The logical conclusion is to introduce as much structure as possible in your document.
    You should mark up all the major components of the document with either tags or
    attributes. It is not always easy to decide how far to go. Obviously, you wouldn''t
    want to mark up every letter of every word:


    ```

    <1>*/</1><1>o</1><1>h</1><1>n</1>

    ```'
