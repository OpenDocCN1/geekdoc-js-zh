  md: '# Chapter 8: Alternative API: SAX


    Running this program against the price list in Listing 8.1 gives the result:

    The cheapest offer is XMLi ($699.0).


    Note that the classpath points to the parser and to the classes directory.

    The fully qualified name of the file is com.psql.xbe.Cheapest.


    # CAUTION


    This example won''t work unless you have installed a Java Development Kit.

    If there is an error message similar to "Exception in thread ''main''

    java.lang.NoClassDefFoundError", it means that either the classpath is incorrect

    so it points to the right directories) or that you typed an incorrect class name

    (com.psql.xbe.Cheapest).


    # SAX Interfaces and Objects


    Events in SAX are defined as methods attached to specific Java interfaces.

    An application implements some of these methods and registers as an

    event-handler with the parser.


    # Main SAX Events


    SAX groups its events in a few interfaces:


    +   - DocumentHandler defines events related to the document itself (such as\
    opening and closing tags). Most applications register for these events.

    - DTDHandler defines events related to the DTD. Few applications register for
    these events. Moreover, SAX does not define enough events to completely report
    on the DTD (SAX-validating parsers read and use the DTD but they cannot pass all
    the information to the application).

    - EntityResolver defines events related to loading entities. Few applications
    register for these events. They are required to load entities from special sources
    such as a database.

    - ErrorHandler defines error events. Applications register for these events if
    they need to report errors in a special way.


    To simplify work, SAX provides a default implementation for all these interfaces
    in the HandlerBase class. It is easier to extend HandlerBase and override the
    methods that are relevant for the application rather than to implement an interface
    directly.


    # Parser


    To register event handlers and to start parsing, the application uses the

    Parser interface. To start parsing, the application calls parse(), and method
    of

    Parser:


    ```

    parser.parse(args[0]);

    ```'
