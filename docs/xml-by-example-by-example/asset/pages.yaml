  md: '# Chapter 11: N-Tiered Architecture and XML


    In most cases, but not in this example, the rightmost server is a database server
    and is therefore often called the data tier.


    # N-Tiers


    It''s possible to add more parties to the application by chaining together more
    client/server applications. For example, some email servers depend on a database.
    The Webmail application would look like Figure 11.3 where there are four parties
    or tiers.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_365_0.png)


    **Figure 11.3:** Adding one more tier


    As you add more tiers, you can build 5-tiered or 6-tiered applications, or even
    more (although having more than four tiers is uncommon). The term n-tiers is a
    generic term for client/servers with three or more tiers.


    # The XCommerce Application


    Chapter 12, "Putting It All Together: An e-Commerce Example," contains the source
    code with comments for the XCommerce application. As explained earlier, this is
    a shopping mall that allows several merchants to work together.


    Figure 11.4 is a breakdown of XCommerce. The main components are the middle tier,
    or the shop, and the data tier, which can be either an XML server or a file.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_365_1.png)


    **Figure 11.4:** The main components of XCommerce'
