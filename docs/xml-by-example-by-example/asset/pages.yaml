    ```


    ```

    <!-- name is made of string, first name and last name. This is a very flexible
    model to accommodate exotic name -->

    ```


    ```

    <!ELEMENT name (#CDATA | lname)*>

    <!ELEMENT fname (#CDATA)>

    <!ELEMENT lname (#CDATA)>

