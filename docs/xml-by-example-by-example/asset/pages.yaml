    # Understanding the Classpath


    One of the most confusing aspects of Java is probably the classpath. Most of the
    problems when running Java applications are related to the classpath.

    The JVM loads Java classes as needed. If your application uses the HttpServlet
    class, the JVM will load it. However, the JVM needs to know where the class is
    located. To find classes, the JVM looks in the classpath.

    The classpath contains a list of directories or JAR files (more on the next section)
    that the JVM searches. If the JVM cannot find a class in the classpath, it reports
    a java.lang.ClassNotFoundException error.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_497_1.png)


    +   1. You can set the classpath for a given application with a parameter, as
    in

    javac -classpath c:\jettylib\javax.servlet.jar -d . Xdicic.java


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_497_2.png)


    +   2. Alternatively, you can set a global classpath as an environment variable,
    as in

    set classpath=c:\jettylib\javax.servlet.jar;

    wc:c:\jettylib\com.martboy.Jetty.jar;


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_497_3.png)


    +   3. It is easy to make spelling errors in classpath. For example, in the following
    command, the path to the servlet JAR is incorrect:

    javac -classpath c:\jettylib\javax.servlet.jar -d . Xdic.java

    The compiler reports this following error:'
