  md: "# How XML Helps\n\nAs soon as there are two or more parties, they need to communicate.\n\
    Currently, two approaches are particularly popular for client/server applications:\n\
    \n+   - middleware such as CORBA (Common Object Request Broker Architecture),\
    \ DCOM (Distributed Component Object Model), and RPC (Remote Procedure Call)\n\
    - exchange formats such as HTML or XML\n\n# Middleware\n\nI won't cover middleware\
    \ in great detail (this is an XML book, but I want to provide you with enough\
    \ information for a comparison.\n\nThe basic idea behind middleware is to reduce\
    \ the effort required to write distributed applications. Networks are not always\
    \ safe, reliable, and dependable. In fact, one could argue that they are exactly\
    \ the opposite. To work around these limitations, programmers have to implement\
    \ specific protocols.\n\nIt is not uncommon for network-specific code to amount\
    \ to more than 10 times the business code. This process takes time and is not\
    \ very productive. Indeed, the team spent wrestling with the network and its security\
    \ is not spent solving actual business problems.\n\nMiddleware includes tools\
    \ that deal with the network. For example, a network might fail but middleware\
    \ has logic to gracefully recover from these failures. Also, on a network several\
    \ computers need to collaborate. Middleware offers tools to manage the interaction\
    \ between these computers.\n\nMiddleware is based on specific protocols, but instead\
    \ of overwhelming grammers with details, it hides them. Programmers are free to\
    \ concentrate on business issues and, therefore, be more productive.\n\n> Listing\
    \ 11.1 illustrates this. This is a simple CORBA client that appends one line to\
    \ an order and confirms it.\n\nListing 11.1: Small CORBA Example\n\n```\nimport\
    \ org.omg.CORBA.*;\npublic class StockExchangeClient {\n static void main(String[]\
    \ args\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_373_0.png)"
