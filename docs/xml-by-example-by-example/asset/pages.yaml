  md: "# The DTD Syntax\n\n# Attributes\n\nAttributes must also be declared in the\
    \ DTD. Element attributes are declared with the ATTLIST declaration, for example:\n\
    \n```\n<ATTLIST preferred (true | false) \"false\">\n```\n\nThe various components\
    \ in this declaration are the markup (<ATTLIST, the element name (tel), the attribute\
    \ name (preferred), the attribute type ((true | false)), and the right bracket.\n\
    \n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_92_0.png)\n\nFor elements that have\
    \ more than one attribute, you can group the declarations. For example, email\
    \ has two attributes:\n\n```\n<ATTLIST email href CDATA #REQUIRED\n(true | false)\
    \ \"false\">\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_92_1.png)\n\nAttribute\
    \ declaration can appear anywhere in the DTD. For readability, it is best to list\
    \ attributes immediately after the element declaration.\n\n# CAUTION\n\nIf used\
    \ in a valid document, the special attributes xml:space and xml:lang must be declared\
    \ as:\n\n```\nxml:space (default|preserve) \"preserve\"\nxml:lang NMTOKEN #IMPLIED\n\
    ```\n\nThe DTD provides more control over the content of attributes than over\
    \ the content of elements. Attributes are broadly divided into three categories:\n\
    \n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_92_2.png)\n\n+   - string attributes\
    \ contain text, for example:\n  <ATTLIST email href #REQUIRED>\n- tokenized attributes\
    \ have constraints on the content of the attribute, for example:\n  <ATTLIST entry\
    \ id ID #IMPLIED>\n- enumerated-type attributes accept one value in a list, for\
    \ example:\n  <ATTLIST entry preferred (true | false) \"false\">\n\nAttribute\
    \ types can take any of the following values:\n\n+   - CDATA for string attributes.\n\
    - ID for identifier. An identifier is a name that is unique in the document.\n\
    - IDREF must be the value of an ID used elsewhere in the same document. IDREF\
    \ is used to create links within a document.\n- IDREFS is a list of IDREF separated\
    \ by spaces."
