  md: '# Chapter 11: N-Tiered Architecture and XML


    Therefore, XSL is not enough. A medium-sized XML application needs code to compare
    documents, compile new documents, handle authentication, and more. All these features
    are not being covered, or properly covered, by XSL.


    The main options for server-side programming languages that work well with XML
    are Perl, JavaScript, Python, Omnimark, and Java.


    # Perl


    Perl is a scripting language. It is popular for CGI scripting because it offers
    superior text manipulation. However, with XML, you''d rather manipulate the text
    with XSL, so many of the features in Perl are not as important with XML as with
    raw text.


    # JavaScript


    JavaScript is also a scripting language. It is particularly popular for browsers.
    Many examples in this book rely on JavaScript. There are server-side versions
    of JavaScript from Microsoft and Netscape. Microsoft offers Active Server Page
    (ASP). Netscape supports Server-Side JavaScript (SSJS).


    Although ASP and SSJS are very similar, they are incompatible. ASP and SSJS encourage
    you to mix JavaScript statements in an HTML or an XML page. The server, not the
    browser, executes the script to generate the final page. Listing 11.12 shows you
    how to use SSJS to create an XML document with product information.


    **Listing 11.12: Creating XML with SSJS**


    ```

    <SERVER>

    deleteResponseHeader("content-type")

    addResponseHeader("content-type", "application/xml")ndatabase.connect("ODBC","products","SYSDBA","masterkey","*")

    product = database.cursor("select * from products where id = '''' + request.id
    + ''''\*")

    product.next()

    </SERVER><product>

    <name><SERVER>write(product.name)</SERVER></name>

    <description><SERVER>write(product.description)</SERVER></description>

    <price><SERVER>write(product.price);product.close()</SERVER></price>

    </product>

    ```


    The first lines change the type of the document to XML. Next, it connects to the
    database. Finally, it reads various information from the data-base and inserts
    it into an XML document.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_393_0.png)'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'The major problem with JavaScript is that it is not portable. An application
    developed with Microsoft''s ASP does not work on Netscape servers and versa. Obviously,
    ASP is available only on Windows Web servers. JavaScript with Apache on Linux
    is simply not an option.


    # Python


    Python is an object-oriented scripting language with a very pleasant syntax. Python
    offers an XML parser. Although Python is rapidly gaining in popularity, it is
    not yet as popular as Perl and JavaScript.


    There is a Java implementation of Python which gives you access to all the Java
    tools.


    # Omnimark


    Omnimark is another scripting language that was developed specifically to process
    SGML documents. It was later extended to support XML. If you need a scripting
    language to manipulate XML documents, Omnimark is a very good choice.


    The major advantages of Omnimark.com are that it is available free of charge from
    www.omnimark.com, it runs on many platforms, it has built-in support for text
    manipulation and XML, and it has a compiler.


    However, Omnimark is not well known outside of SGML circles and it is a proprietary
    language.


    # Java


    The last option is Java. This is the language I have used for most of eCommerce
    (there is some client-side JavaScript as well). Keep in mind that these are not
    client-side applets, but Java applications running on the server.


    Java has many strong points for XML development:


    +   - Many XML tools are available in Java. Indeed, most the XML tools (parser,
    XSL processor, XQL engine, and so on) were first made available for Java.


    +   - Java is highly portable. There are versions of Java for all the major Web
    servers and then some.


    +   - Java is a typed language and it is compiled. The compiler catches many errors.
    This is important for server-side programming because a faulty script can crash
    your server.


    +   - There are several high-quality development environments available, so you
    can choose the one that works best for you.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '+   - Many vendors support Java. You have an ample supply of books, components,
    and services.


    If you are familiar with JavaScript but you think Java is too complex, think twice.
    With XML, you will write more XSL code than Java or JavaScript code, anyway. You
    really need not worry about complex concepts in Java.


    > > If you are not familiar with Java but you would like to learn enough Java
    to run the examples, turn to Appendix A, "Crash on Java," (page 457).


    # What''s Next


    The next chapter contains the entire source code for XCommerce. It provides a
    good illustration of what is possible with XML.'
