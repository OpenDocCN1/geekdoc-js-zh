- img_proc: true
  md: '# Chapter 3: XML Schemas


    Element declarations are easy to read: The right side (the content model) defines
    the left side (the element name). In other words, the content model lists the
    children that are acceptable in the element.


    The previous declaration means that an address-book element contains one or more
    entry elements. address-book is on the left side, entry on the right. The plus
    sign after entry means there can be more than one element.


    2. Parentheses are used to group elements in the content model, as in the following
    example:


    ```

    <ELEMENT name (lname, fname | title))>",

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_89_0.png)


    # Element Name


    As we saw in Chapter 2, XML names must follow certain rules. Specifically, names
    must start with either a letter or a limited set of punctuation characters (":",
    "_"). The rest of the name can consist of the same characters plus letters, digits
    and new punctuation characters (":", \."). Spaces are not allowed in names.


    Names cannot start with the string "xml," and as will see in Chapter 4, "Namespaces,"
    the colon plays a special role so it is advised not to use it.


    # Special Keywords


    For most elements, the content model is a list of elements. It also can be one
    of the following keywords:


    +   #PCDATA stands for parsed character data and means the element can contain
    text. #PCDATA is often (but not always) used for leaf elements. Leaf elements
    are elements that have no child elements.

    * EMPTY means the element is an empty element. EMPTY always indicates a leaf element.

    * ANY means the element can contain any other element declared in the DTD. This
    is seldom used because it carries almost no structure information. ANY is sometimes
    used during the development of a DTD, before a precise rule has been written.
    Note that the elements must be declared in the DTD.


    Element contents that have #PCDATA are said to be mixed content. Element contents
    that contain only elements are said to be element content. In Listing 3.2, tel
    is a leaf element that contains only text while email is an empty element:


    ```

    <ELEMENT tel (#PCDATA)>

    <ELEMENT email EMPTY>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_89_1.png)


    Note that CDATA sections appear anywhere #PCDATA appears.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# The Secret of Plus, Star, and Question Mark


    The plus (“+”), star (“*”), question mark (“?”) characters in the element content
    are occurrence indicators. They indicate whether and how elements in the child
    list can repeat.


    +   - An element followed by no occurrence indicator must appear once and only
    once in the element being defined.

    - An element followed by a “+” character must appear one or several times in the
    element being defined. The element can repeat.

    - An element followed by a “*” character can appear zero or more times in the
    element being defined. The element is optional, but if it is included, it can
    repeat indefinitely.

    - An element followed by a “?” character can appear once or not at all in the
    element being defined. It indicates the element is optional and, if included,
    cannot repeat.


    The entry and name elements have content model that uses an occurrence indicator:


    ```

    <ELEMENT entry (name*,tel*,fax*)>

    <ELEMENT address (street,region?,postal-code,locality,country)>

    ```


    Acceptable children for the entry are name, address, tel, fax, and email. Except
    for name, these children can repeat.


    Acceptable children for address are street, region, postal-code, locality, and
    country. None of the children can repeat but the region is optional.


    # The Secret of Comma and Vertical Bar


    The comma (,”) and vertical bar (|;) characters are connectors. Connectors separate
    the children in the content model, they indicate the order in which the children
    can appear.


    +   - the “,” character, which means both elements on the right and the left of
    the comma must appear in the same order in the document.

    - the “|” character, which means that only one of the elements on the left or
    the right of the vertical bar must appear in the document.


    The name and address elements are good examples of connectors.


    ```

    <ELEMENT name (#PCDATA #name*)>

    <ELEMENT address (street,region?,postal-code,locality,country)>

    ```'
  merge: -1
