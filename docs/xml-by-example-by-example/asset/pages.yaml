  md: '# Conditional Sections


    As your DTDs mature, you might have to change them in ways that are partly incompatible
    with previous usage. During the migration period, when you have new and old documents,
    it is difficult to maintain the DTD.


    To help manage migrations and other special cases, XML provides conditional sections.
    Conditional sections are included or excluded from the DTD depending on the value
    of a keyword. Therefore, you can include or exclude a large part of the DTD by
    simply changing one keyword.


    Listing 3.13 shows how to use conditional sections. The strict parameter entity
    resolves to INCLUDE. The lenient parameter entity resolves to IGNORE. The application
    will use the definition of name in the %strict section ((name, name)) and ignores
    the definition in the %lenient section ((PCDATA | name ; name)*).


    Listing 3.13: Using Conditional Sections


    ```

    <!ENTITY % strict ''INCLUDE''>

    <!ENTITY % lenient ''IGNORE''>


    <![%strict;

    <!-- a name is a first name and a last name -->

    <!ELEMENT name (name, name)>

    ]]

    <![%lenient;

    <!-- name is made of string, first name

    and last name. This is a very flexible model to accommodate exotic name -->

    <!ELEMENT name (#PCDATA | name ; name)*>

    ]]

    ```


    However, to revert to the lenient definition of name, it suffices to invert the
    parameter entity declaration:


    ```

    <!ENTITY % strict ''IGNORE''>

    <!ENTITY % lenient ''INCLUDE''>

    ```


    # Designing DTDs


    Now that you understand what DTDs are for and that you understand to use them,
    it is time to look at how to create DTDs. DTD design is a creative and rewarding
    activity.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_108_0.png)'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'It is not possible, in this section, to cover every aspect of DTD. Books have
    been devoted to that topic. Use this section as guidance and remember that practice
    makes proficient.


    Yet, I would like to open this section with a plea to use existing DTDs when possible.
    Next, I will move into two examples of the practical design of practically designing
    DTDs.


    # Main Advantages of Using Existing DTDs


    There are many XML DTDs available already and it seems more are being available
    every day. With so many DTDs, you might wonder whether it''s worth designing your
    own.


    I would argue that, as much as possible, you should try to reuse existing DTDs.
    Reusing DTDs results in multiple savings. Not only do you have to spend time designing
    the DTD, but also you don''t have to maintain and update it.


    However, designing an XML application is not limited to designing a DTD. As you
    will learn in Chapter 5, "XSL Transformation," and subsequent chapters, you might
    also have to design style sheets, customize tools such as editors, and/or write
    special code using a parser.


    This adds up to a lot of work. And it follows the "uh, oh" of rule planning: Uh,
    oh, it takes more work than I thought." If at all possible, it pays to reuse somebody
    else''s DTD.


    The first step in a new XML project is to search the Internet for similar applications.
    I suggest you search at www.oasis-open.org/sgml/xml.html. The site maintained
    by Robin Cover, is the most comprehensive list of XML links.


    In practice, you are likely to find DTDs that almost fit your needs aren''t exactly
    what you are looking for. It''s not a problem because XML is extensible so it
    is easy to take the DTD developed by somebody else and adapt it to your needs.


    # Designing DTDs from an Object Model


    I will take two examples of DTD design. In the first example, I will start from
    an object model. This is the easiest solution because you can reuse the objects
    defined in the model. In the second example, I will create a DTD from scratch.


    Increasingly, object models are made available in UML. UML is the Unified Modeling
    Language (yes, there is an ML that does not stand for markup language). UML is
    typically used for object-oriented applications such as Java or C++ but the same
    models can be used with XML.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_109_0.png)'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Designing DTDs from an Object Model


    An object model is often available when XML-enabling an existing Java or C++ application.
    Figure 3.4 is a (simplified) object model for bank accounts. It identifies the
    following objects:


    +   - "Account" is an abstract class. It defines two properties: the balance and
    a list of transactions.


    +   - "Savings" is a specialized "Account" that represents a savings account;
    interest is an additional property.


    +   - "Checking" is a specialized "Account" that represents a checking account;
    rate is an additional property.


    +   - "Owner" is the account owner. An "Account" can have more than one "Owner"
    and an "Owner" can own more than one "Account.",


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_110_0.png)


    Figure 3.4: The object model


    The application we are interested in Web banking. A visitor would like to retrieve
    information about his or her various bank accounts (mainly his or her balance).


    The first step to design the DTD is to decide on the root-element. The top-level
    element determines how easily we can navigate the document and access the information
    we are interested in. In the model, there are two potential top-level elements:
    Owner or Account.


    Given we are doing a Web banking application, Owner is the logical choice as a
    top element. The customer wants his list of accounts.


    Note that the choice of a top-level element depends heavily on the application.
    If the application were a financial application, examining accounts, it would
    have been more sensible to use account as the top-level element.


    At this stage, it is time to draw a tree of the DTD under development. You can
    use a paper, a flipchart, a whiteboard, or whatever works for you (I prefer flipcharts).


    In drawing the tree, I simply create an element for every object in the model.
    Element nesting is used to model object relationship.'
