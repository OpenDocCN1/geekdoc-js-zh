    <section>\n```\n\n```\n</article>\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_183_0.png)\n\
    \n# Figure 6.2: The XML document loaded into a browser\n\nThe next sections examine\
    \ the style sheet in more detail.\n\n# Comments\n\nComments are enclosed in /*\
    \ and */, like in C. Comments are ignored by the browser. For example, you could\
    \ write\n\n/* a simple style sheet */\n\n# Selector\n\nCSS rules are associated\
    \ with elements through selectors. Unfortunately, selectors have a different syntax\
    \ than XSL paths!\n\nTo select an element, use its name. The following example\
