  md: '# Modeling for Flexibility


    You are reaching the end of your tour of XML. In the previous chapters, you learned
    not only the XML syntax but also how to manipulate XML. The next two chapters
    are devoted to a real-life e-commerce application based on XML.


    In this chapter, you review some aspects of XML flexibility. In particular, you
    revisit some concepts related to modeling documents. I hope the previous chapters
    have convinced you that XML is a flexible solution for many applications.


    You have already learned some of these topics in other chapters. This discussion
    consolidates previous discussions. More specifically, you learn


    +   * how to take advantage of XML extensibility through XSL and other standards

    * about some standards under development by the W3C

    * about warning signs that may point to problems in an XML document

    * about the raging debate in the XML community: to attribute or to element?


    # Structured and Extensible


    As you learned in Chapter 1 and as you saw demonstrated in Chapters 2 through
    9, XML focuses on the structure of documents. Unlike HTML, XML encourages you
    to focus on the structure of the information. How you eventually use the document
    is derived from the structure. For example, presentation is derived from the structure.


    To support the structure, XML is extensible. In practice, it means that you can
    define your own elements, tags, and attributes and decide how to combine them.'
  merge: -1
  pgno: 324
- img_proc: true
  md: "# Chapter 10: Modeling for Flexibility\n\nThe challenge of making a successful\
    \ XML application is to channel XML extensibility in a positive way. There are\
    \ two approaches to this challenge, each with its own advantages and disadvantages:\n\
    \n+   - Limit XML extensibility.\n- Build on XML extensibility as an essential\
    \ part of the application.\n\nThis is the first choice to make when considering\
    \ a new application. Whether you limit XML extensibility or should you build it\
    \ as an essential part of the application? This chapter illustrates both cases.\n\
    \n# Limited XML Extensibility\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_325_0.png)\n\
    \n+   1. Of the first popular applications on intranets was the address book,\
    \ and for a good reason. In a large organization, people change jobs very often,\
    \ or they simply move to another office.\n\nTherefore, the phone list is rarely\
    \ up-to-date. In some organizations, it would require printing a new list every\
    \ morning, which might not be an option when the list is large.\n\nBy putting\
    \ the information on an intranet, the maintenance and distribution of the list\
    \ are simplified dramatically. To update the list, one simply publishes a new\
    \ version. And because it is Web-based, the new list is instantaneously available\
    \ to everybody.\n\nTo build such a list with XML, you can create a document similar\
    \ to Listing 10.1.\n\n**Listing 10.1:** A Phone List in XML\n\n```\n<?xml version=\"\
    1.0\"?>\n<phonelist>\n  <person>\n    <fname>Bill</fname><lname>Allen</lname>\n\
    \    <extension>103</extension>\n    <email>ballen@emailaholic.com</email>\n \
    \ </person>\n  <person>\n    <fname>John</fname><lname>Doe</lname>\n    <extension>101</extension>\n\
    \    <email>jdoe@emailaholic.com</email>\n  </person>\n  <person>\n    <fname>Peter</fname><lname>Fill</lname>\n\
    \    <extension>105</extension>\n```"
