  md: '# Appendix A 473


    The Web server is now an application server because it serves both files and applications.
    The standard API for a Web server is the Common Gateway Interface or CGI. Applications
    that need to interface with the server must follow CGI.


    CGI is a very simple API. It specifies how the Web server invokes the application,
    how it passes the parameters received from the user, and how the application must
    return the page.


    CGI is a very popular interface that is supported by all the major Web servers.
    However, CGI has proven to be relatively inefficient. In particular, with CGI,
    the Web server must invoke a new instance of the application for each request.
    This alone invokes a huge overhead. Web sites that relied heavily on CGI were
    slow.


    In response, server vendors developed more efficient APIs (NSAPI and WAI for Netscape,
    ISAPI for Microsoft). These alternative APIs are very similar in scope to CGI
    but are more efficient. Unfortunately, unlike CGI, which is common to most servers,
    the alternative APIs are vendor specific. An application developed for Netscape''s
    servers won''t work with a Microsoft server.


    The Java community proposed servlets as a standard replacement for CGI. Servlets
    are efficient because they are loaded once when the server starts. The Web server
    can reuse the servlet for multiple requests. Furthermore, servlets are portable
    and they work with all the major Web servers.


    The e-commerce example in Chapter 12 uses servlets extensively. The next section
    explains how to write servlets.


    # Your First Servlet


    It''s time to put this in practice with a simple servlet example.


    +   Listing A.2 the Xdic servlet. This servlet returns the definition of entered
    in a form on a Web browser.


