  md: "# 168 Chapter 6: XSL Formating Objects and Cascading Style Sheet\n\nhas a higher\
    \ priority than\n\n```\narticle title {\n  font-style: normal;\n}\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_185_0.png)\n\
    \n3. Furthermore, rules that appear higher in the style sheet have a lower priority.\
    \ So, in the following example, the second rule will preempt the first rule:\n\
    \n```\narticle title {\n  font-style: normal;\n} section title {\n  font-style:\
    \ italic;\n}\n```\n\n# Properties\n\nProperties are enclosed in curly brackets.\
    \ Each property has a name followed by a colon and one or more values (separated\
    \ by commas). A semi-colon terminates the property.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_185_1.png)\n\
    \n```\narticle {\n  font-family: Palatino, Garamond, \"Times New Roman\", serif;\n\
    \  font-size: 10pt;\n  margin: 5px;\n}\n```\n\n# Flow Objects and Boxes\n\nThe\
    \ browser paints the document on what is known as the canvas. The canvas is simply\
    \ the area onscreen or on paper where the browser paints. The CSS rules describe\
    \ using flow objects to describe how to paint on the canvas.\n\n# Flow Objects\n\
    \nTo render the screen or print a page, the browser uses flow objects. The concept\
    \ is very simple: The document flows from the top to the bottom of the canvas.\
    \ Anything in the flow (characters, words, paragraphs, images) is a flow object.\n\
    \nStyle sheets associate properties to flow objects. CSS can address flow objects\
    \ from the element upwards. The recommendation even specifies how to associate\
    \ properties to characters or words which browsers don't implement it, yet."
  merge: -1
  pgno: 185
- img_proc: true
  md: "# Properties Inheritance\n\nFlow objects inherit most of their properties from\
    \ their parents. In the example, section elements inherit their properties from\
    \ the article element because sections are included in the article. Paragraph\
    \ elements in turn inherit their properties from sections.\n\nHowever, if a rule\
    \ is attached to the paragraph element, it overrides some of the properties inherited\
    \ from the section. The url element, which is included in a paragraph, in turn\
    \ inherits its properties from the paragraph, including those properties overridden\
    \ by the paragraph rule. Figure 6.3\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_186_0.png)\n\
    \n**Figure 6.3:** Inheriting properties\n\nThe inheritance works for most properties.\
    \ Some properties, however, are not inherited. I will draw your attention to them\
    \ in the following discussion.\n\n# Boxes\n\nThe simplest flow object is the box.\
    \ As the name implies, a box is a rectangular area on the screen or paper. Every\
    \ element is rendered in a box.\n\nListing 6.3 illustrates how to make the boxes\
    \ visible in a browser. Figure 6.4 shows the result.\n\n**Listing 6.3:** A Style\
