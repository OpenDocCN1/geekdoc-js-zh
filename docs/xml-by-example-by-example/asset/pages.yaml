  md: '# Appendix A 481


    XDic.java:6: Package javafx.servlet not found in import.

    import javax.servlet.*;


    However, it is easy to recognize that this error is linked to an incorrect

    classpath: If the compiler cannot find a package, it''s a sure sign that the

    classpath is incorrect.


    # CAUTION


    Neither the compiler nor the JVM will issue a warning if there are invalid directories
    in

    the classpath.


    Invalid directories are ignored but, of course, these invalid directories still
    cause prob-lems the JVM cannot find your classes.


    +   4. In the following example, because the classpath does not contain a ref-erence
    to the current path; the JVM cannot find the classes:

    classpath=c:\jetty\lib\javax.servlet.jar;

    c=c:\jetty\lib\com.motbay.Jetty.bay


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_498_0.png)


    The JVM will compile that

    Cannot find servlet class com.psol.xdic.XDic

    lang.ClassNotFoundException: com.psol.xdic.XDic


    Again, it is easy to link this problem to a classpath problem. Don''t forget

    that the classpath must contain not only the different components your

    application uses (servlet, Java parser, and so on), but also the classes for

    your application.


    # CAUTION


    The behavior of the classpath has changed between JDK 1.1 and Java 2. With Java
    2,

    tJVM always appends the path of its runtime libraries to the classpath.


    With JDK 1.1 however, you have to include the runtime libraries. In words, you

    must sure that the classpath contains a reference to the JVM''s runtime libraries.


    # JAR Files


    As you have seen, when you compile Java applications, the compiler gener-ates
    several directories and subdirectories. There is one directory for every

    word in the package name. The com.psol.le1 package, for example, creates

    three directories: com, psol, and le1.


    This makes it difficult to deploy applications because you must not only

    copy the class files but also make sure you create all the right directories

    and copy the files to the right places.'
