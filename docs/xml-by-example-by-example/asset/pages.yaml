  md: "The following example uses CDATA section to insert an XML example into an XML\
    \ document:\n\n```\n<xml version=\"1.0\"?>\n<example>\n<![CDATA[\n<?xml version=\"\
    1.0\"?>\n<entry>\n  <name>John Doe</name>\n  <email href=\"mailto:jdoe@emailaholic.com\"\
    />\n</entry>\n]]>\n</example>\n```\n\nNOTE\nCDATA stands for character data. In\
    \ the next chapters you will see that text in an element is called CDATA, parsed\
    \ character data.\nThe difference between CDATA and PCDATA is that PCDATA cannot\
    \ contain markup characters.\n\n# Frequently Asked Questions on XML\n\nThis completes\
    \ our study of the XML syntax. The only aspect of the XML recommendation we haven't\
    \ studied yet is the DTD. The DTD is discussed in Chapter 3, \"XML Schemas\"\n\
    \nBefore moving to the DTD, I'd like to answer three common questions on XML documents.\n\
    \n# Code Indenting\n\nListing 2.1 is indented to make the tree more apparent.\
    \ Although it is not required for the XML processor, it makes the code more readable\
    \ as we can see immediately where an element starts and ends.\n\nThis raises the\
    \ question of what the processor does with the whitespaces used for indenting.\
    \ Does it ignore them? The answer is a qualified yes.\n\nStrictly speaking, the\
    \ XML processor does not ignore whitespaces. In the following example, it sees\
    \ the content of name as a line break, three spaces, lname, another line break,\n\
    \n```\n<name>\n  <fname>Jack</fname>\n  <lname>Smith</lname>\n</name>\n```"
