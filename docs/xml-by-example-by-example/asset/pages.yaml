  md: '# Simplifications


    XCommerce is representative of a real Web mall. However, because this is a book
    about XML, I have made a few simplifications. These simplifications are not related
    to the use of XML in any way:


    +   - There is no provision for payments. Processing payments typically requires
    credit card processing and a merchant account and is clearly outside the scope
    of this book.

    - The buyer cannot shop for more than one product at a time. This saves writing
    a *shopping cart* (a small database that stores the items bought so far).

    - Presentation is minimalist. You would want to include more graphics and better
    layout in a real shop.


    Additionally, security has been kept simple. It is possible to add encryption
    but it is outside the scope of this book.


    # Shop


    The middle tier is not very complex. Essentially, it manages a number of XML documents:
    one for the list of merchants, one for the list of products, and for each product.
    The middle tier applies style sheets to these documents in response to user requests.


    The shop is one servlet. It uses the URL to decide which document to use. The
    URL has the form `/shop/merchant/product`. Possible URLs include

    /shop

    /shop/xmli

    /shop/emailaholic/0


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_366_0.png)


