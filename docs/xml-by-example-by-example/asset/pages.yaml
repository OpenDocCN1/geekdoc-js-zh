- img_proc: true
  md: '# A First Look at the XML Syntax


    ```

    </entry>

    <entry>

    <name><fname>Jack</fname><lname>Smith</lname>

    <tel>513-555-3465</tel>

    <email href="mailto:jsmith@emailaholic.com"/>

    <entry>

    </address-book>

    ```


    As you can see, an XML document is textual in nature. XML-wise, the document consists
    of character data and markup. Both are represented by text.


    Ultimately, it''s the character data we are interested in because that''s the
    information. However, the markup is important because it records the structure
    of the document.


    There are a variery of markup constructs in XML but it is easy to recognize the
    markup because it is always enclosed in angle brackets.


    NOTE

    vCard is a standard for electronic business cards. In the next chapter, you will
    learn where I used the vCard standard in preparing this example.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_60_0.png)


    Obviously, it''s the markup that differentiates the XML document from plain text.
    Listing 2.2 is the same address in plain text, with no markup and only character
    data.


    +   Listing 2.2: The Address Book in Plain Text

    John Doe

    34 Fountain Square Plaza

    Cincinnati, OH 45202

    US

    513-555-8889 (preferred)

    513-555-7098

    jdoe@emailaholic.com

    Jack Smith

    513-555-3465

    smith@emailaholic.com


    Listing 2.2 helps illustrate the benefits of a markup language. Listing 2.1 and
    2.2 carry exactly the same information, but markup records its own structure.


    In both cases, it is easy to recognize the names, the phone numbers, the email
    addresses, and so on. If anything, Listing 2.2 is probably more read-able.'
