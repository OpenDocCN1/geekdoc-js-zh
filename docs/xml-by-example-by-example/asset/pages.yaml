  md: '# Chapter 5: XSL Transformation


    Listing 5.10 is a style sheet to extract the URL, the title, the abstract, and
    the date of an article document.


    Listing 5.10: Style Sheet to Extract Data


    ```

    <<?xml version="1.0" encoding="ISO-8859-1"?>

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">


    <xsl:template match="article">

    <article>

    <url><xsl:value-of select="fname"/></html</url>

    <title><xsl:value-of select="title"/></title>

    <abstract><xsl:value-of select="abstract"/></abstract>

    <date><xsl:value-of select="date"/></date>

    </article>

    </xsl:template>


    </xsl:stylesheet>

    ```


    Listing 5.11: An Extract from the Original Document


    ```

    <article><url>19990101_xsl.html</url><title>XML Style

    Sheets</title><abstract>Style sheets add flexibility to document

    viewing.</abstract><date>January 1999</date></article>

    ```


    By applying the style sheet after all articles, I will create many extract files
    as I have articles. Each file is similar to Listing 5.11.


    The next step is to merge them in an XML listing. The trick to create a well-formed
    document is to merge two additional files with markup for the topmost element.
    I place the markup in two ASCII files, opening.tag and closing.tag.


    ```

    <<?xml version="1.0" encoding="ISO-8859-1"?>

    <articles>


    closing.tag contains

    </articles>

    ```


    Listing 5.12 is the DOS batch that merges all the files. Running creates index.xml
    (see Listing 5.13).


    Listing 5.12: The Dos Batch to Compile the Index


    ```

    set xslprocessor=java -classpath c:\lotusxl\xerces.jar;

    c:\lotusxl\lotusxl.jar com.lotusxl.Process

    set files=19990701_jini 19990601_book 19990101_xml

    for %%f in (%files%) do %xslprocessor -in %%f.xml -out %%f.xt

    ```'
