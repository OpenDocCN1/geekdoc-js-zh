  md: '# Rendering XML Without HTML


    HTML has a fixed set of elements and HTML browsers are hard-coded to render them
    onscreen. In other words, HTML browsers know that the title element will appear
    in the title bar; they know that hyperlinks are blue and underlined. They need
    not be told how to style elements.


    XML, on the contrary, has no predefined set of elements. It is up to you, the
    author, to define elements. Consequently, an XML browser cannot be hard-coded.
    It needs to be told how to style each element you defined.


    In the previous chapter, you worked around the difficulty by converting XML to
    HTML. Ultimately, the browser was a standard HTML browser rendering HTML documents.
    This is ideal for backward compatibility but it limits what you can do with XML
    documents.


    CSS (and XSLFO) have a different approach to the problem. CSS describes directly
    how to render documents onscreen or on paper. CSS is the mechanism you use to
    tell the browser how to style the elements. CSS deals with fonts, colors, text
    indentation, and so on. Figure 6.1 illustrates the difference between XSLT and
    CSS.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_179_0.png)


    Figure 6.1: How XSLT differs from CSS


    For example, to render a section title with XSLT, you used the following template:


    ```

    <xsl:template match="section/title">

    <P><i><xsl:apply-templates/></I></P>

    </xsl:template>

    ```'
  merge: -1
