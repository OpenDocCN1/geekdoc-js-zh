  md: '# Advanced XSLT


    # 153


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_170_0.png)


    XML Sheets (January 1999 )


    # Table of Contents


    +   - Style

    - How XML Works

    - The Added Flexibility of Style


    Send comments and suggestions to bymarchall@example.com


    Style


    Style sheets are inherited from an XML ancestor. Style sheets originated in publishing
    and document management applications. XSL is the XML standard style sheet, see
    http://www.w3.org/XSL


    How XML Works


    An XML sheet is a set of rules where each rule specifies how to format certain
    elements in the document. To continue the example from the previous section, the
    style sheets have rules for title, paragraphs, and keywords


    With these, three rules are powerful not only to format the document but also
    to reorganize it, e.g. by moving the title to the front page or extracting the
    list of keywords. This allows us to transform and mix XML outside of traditional
    formats.


    # Figure 5.10: The resulting HTML document in a browser


    # Declaring HTML Entities in a Style Sheet


    This style sheet has an internal DTD to declare the copy entity—an HTML entity.
    HTML has many entities that XML does not recognize.


    ```

    <!DOCTYPE xsl:stylesheet [

    <!ENTITY copy "&#0169;">\n]

    ```


    # Reorganizing the Source Tree


    The list of keywords must appear in an HTML META element. The following example
    extracts the keywords from the source tree, with the xsl:value-of element.


    ```

    <META NAME="keywords">

    <xsl:value-of select="article/keywords"/>

    <xsl:attribute/>

    </META>

    ```


    <META name="keywords" content="XML, XSL, style sheet, publishing, Web">


    > CAUTION

    Because select points to any element in the source tree, paths tend to be longer
    than the match attribute. It is common to spell out a path from root to element.'
