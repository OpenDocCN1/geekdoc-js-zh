  md: '# The Basics of CSS


    ```

    font-size: 10pt;

    margin: 5px;

    ```


    To select several elements, separate them with commas. The following example applies
    to the article, p, and title elements. It is equivalent to article | p | title
    in XSL. The “*” character matches all elements. article, p, title {


    ```

    display: block;

    margin-bottom: 10px;

    ```


    To select an element depending on its ancestor, list the two elements separated
    by spaces. The following example selects every title with an article ancestor,
    not a direct descendant from an article. In other words, it is equivalent to the
    article//title XSL path, not article/title. article title {


    ```

    font-size: larger;

    font-weight: bold;

    ```


    # Priority


    +   1. If two or more selectors point to the same element, then the rules are
    merged. Therefore, the following example p {


    ```

    display: block;

    font-size: 10pt;

    ```


    is equivalent to p {


    ```

    display: block;

    font-size: 10pt;

    ```


    +   2. However, if the properties conflict with each other, then those rules with
    a more specific selector have a higher priority. Therefore, the following example
    article section title {


    ```

    font-style: italic;

    ```'
