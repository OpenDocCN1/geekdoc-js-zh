  md: "# Chapter 9: Writing XML\n\n```\nelse {\n var xmlDoc = makeXML();\nxml.async\
    \ = false;\n // passes an XML string to the parser\nxml.loadXML(xmlDoc);\nform.output.value\
    \ = xml.transformNode(xslt.XMLDocument);\n}\n```\n\nUnfortunately, the DOM standard\
    \ does not specify how to apply an XSLT style sheet to a document. Again, you\
    \ can use a browser-specific extension. For Internet Explorer, the XSL processor\
    \ is called by the transformNode() method.\n\nThe XSLT style sheet was loaded\
    \ in a separate XML island.\n\n```\n<xml id=\"xml\"></xml>\n<xml id=\"xslt\" src=\"\
    convert.xsl\\></xml>\n```\n\n# Which Structure for the Document?\n\nIf your application\
    \ supports several DTDs, you may wonder which one to use as the default DTD. Experience\
    \ shows that it pays to be dumb when designing this default DTD.\n\nI like to\
    \ define a DTD that is very similar to my object structure. So, if the application\
    \ has Product and Price objects, I create two elements: product and price.\n\n\
    There are two main advantages to designing a DTD that is close to the internal\
    \ data structure:\n\n+   - It is easy to generate the XML document.\n- The resulting\
    \ document is as expressive as the internal data structure.\n\n# XSLT Versus Custom\
    \ Functions\n\nXSLT has been designed specifically to convert XML documents. It\
    \ offers a simple solution to cleanly separate the DTD from the application code.\
    \ This separation of roles offers many advantages:\n\n+   - If the format changes,\
    \ you don't have to change your application, only the style sheet."
