    +   3. The servlet can access configuration information through getInitParameter().
    In the following example, the servlet looks up the definition of a word from the
    configuration file:

    `String definition = getParameter(lowCaseWord);`


    The configuration file is in Listing A.4.


    # More Java Language Concepts


    You now have enough background on Java to be able to follow the various examples
    introduced in the book. There are, however, important aspects of the Java language
    that have not been covered—this section will introduce them.


    # This and Super


    Java also declares two keywords: this and super. They are used like ordinary variables
    but this refers to the current object whereas super refers to the ancestor of
    the current object.


    In the following example, the object invokes a method on its ancestor:

    `super.init(config);`'
