  md: '# Advanced Topics


    <company>Mark &amp; Spencer</company>


    XML also supports character references where a letter is replaced by its Unicode
    character code. For example, if your keyboard does not support accentuated letters,
    you can still write my name in XML as:


    <name>Beno&#238;t Marchal</name>


    Character references that start with &# provides a hexadecimal representation
