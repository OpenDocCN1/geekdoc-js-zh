    - characters()/ignorableWhitespace() notify the application when the parser finds\
    \ content (text) in an element. The parser can break a piece of text in several\
    \ events or parse all at once as it fits. However, one is always attached to a\
    \ single element. The ignorableWhitespace event is used for ignorable spaces as\
    \ defined by the XML specifications.\n- processingInstruction() notifies the application\
    \ of processing instructions.\n- setDocumentLocator() passes a Locator object\
    \ to the application; see the section “Locator” that follows. Note that the SAX\
    \ parser is not required to provide a Locator, but if it does, it must fire this\
