    # Advanced XSLT


    XSLT is a powerful transformation mechanism. So far, we have only used a subset
    of it. Our resulting document follows a structure that is close to the original
    document. Elements might have been added or removed from the tree but they are
    not reorganized.


    Yet, it is often useful to reorganize completely the source document. For example,
    we might want to create a table of contents at the beginning of the document.


    This is possible with the xsl:value-of of element. xsl:value-of of arbitrary elements
    from the source tree anywhere in the resulting tree.


    Listing 5.8 is a more sophisticated style sheet that, among others, creates a
    table of contents.


