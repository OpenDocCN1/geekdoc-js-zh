- img_proc: true
  md: 'Acceptable children for name are #PCDATA or a fname element or a lname element.
    Note that it is one or the other. However, the whole model can repeat thanks to
    the "*" occurrence indicator.


    Acceptable children for address are street, region, postal-code, locality, and
    country, in exactly that order.


    The various components of mixed content must always be separated by a "|\ and
    the model must repeat. The following definition is incorrect:


    ```

    <!ELEMENT name (#PCDATA, fname, lname)>

    ```


    It must be


    ```

    <!ELEMENT name (#PCDATA | fname | lname)*>

    ```


    # Element Content and Indenting


    In the previous chapter, you learned that the XML application ignores indenting
    in most cases. Here again, a DTD can help.


    If a DTD is associated with the document, then the XML processor knows that spaces
    in an element must content indent (because the element has element content, it
    cannot contain any text). The XML processor can label the spaces as ignorable
    whitespaces. This is a very powerful hint to the application that the spaces are
    indenting.


    # Nonambiguous Model


    The content model must be deterministic or unambiguous. In English, it means it
    is possible to decide which part of the model applies to the current element by
    looking only at the current element.


    For example, the following model is not acceptable:


    ```

    <!ELEMENT cover ((title, author) | (title, subtitle))>

    ```


    because the XML processor is reading the element <title>XML by Example</title><author>Benoit
    Marchal</</author></cover>


    in


    it cannot decide whether the title element is part of (title, author) or of (title,
    subtitle) by looking at title only. To decide that title is part of (title, author),
    it needs to look past title to the author element.


    In most cases, however, it is possible to reorganize the document so that the
    model becomes acceptable:


    ```

    <!ELEMENT cover ((title, author | subtitle))>

    ```


    Now when the processor sees title, it knows where it fits in the model.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_91_0.png)'
