  md: 'Netscape Communicator currently has no support for XML except for Mozilla,
    the open-source version of Netscape Communicator. Mozilla has strong support for
    XML. However, because Mozilla is still a work-in-progress, it is not yet stable
    enough for practical usage.


    Several other vendors have produced XML browsers. These browsers are at various
    stages of development. One of the most interesting is InDelVy Browser, which has
    the most complete implementation of XSL at the time of writing.


    +   - Browsers are discussed in Chapter 5, "XSL Transformation," and Chapter 6,
    "XSL Formatting Objects and Cascading Style Sheet."


    # XML Editors


    To view documents, somebody must have written them. There is surprisingly large
    range of XML editors available. Some of these editors, however, are scaled-down
    versions of SGML editors (such as Adobe Framemaker); others are entirely new products
    (such as XML Pro).


    A new range of editors is appearing on the market, led by products such as XMetal
    from SoftQuad. These editors offer the power of SGML editors but with the ease
    of use you would expect from an XML product.


    +   - Editors are discussed in Chapter 6, "XSL Formatting Objects and Cascading
    Style Sheet."


    # XML Parsers


    If you are writing your own XML applications, you probably don''t want to fool
    around with the XML syntax. Parsers shield programmers from the XML syntax.


    There are many XML parsers available on the Internet, such as IBM''s XML for Java.
    Also an increasing number of applications include an XML parser, such as Oracle
    8i.


    +   - Parsers are discussed in Chapter 7, "The Parser and DOM," and Chapter 8,
    "Alternative API: SAX."


    # XML Processor


    In many cases, you want to use XML "behind the scene." You want to take advantage
    of XML internally but you don''t want to force your users to upgrade to an XML-compliant
    browser.


    In all cases, you will use XML enables you to produce classic HTML that works
    with current-generation browsers (and older, too) while enabling you to retain
    the advantages of XML internally.'
