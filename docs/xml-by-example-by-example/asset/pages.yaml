  md: 'If all the entries that can influence the document are in the internal subset
    of the DTD, the document is said to be standalone. In other words, an XML processor
    does not need to download external entities to access all the information (it
    might have to download external entities to validate the document but that does
    not impact the content).


    Conversely, if default attribute values or entities are declared in the external
    subset of the document, then the XML processor needs to read the external subset,
    which might involve downloading more files.


    Obviously, a standalone document is more efficient for communication over a network
    because one file needs to be downloaded. The XML declaration has an attribute,
    standalone, that declares whether the document is a standalone document or not.
    It accepts only two values: yes and no.


    ```

    <?xml version="1.0" standalone="yes"?>

    ```


    Note that a standalone document might have an external DTD subset but the external
    subset cannot modify how the application reads the document. Specifically, the
    external subset cannot


    +   - declare entities

    - declare default attribute values

    - declare element content if the elements include spaces, such as for indenting.
    The last rule is the easiest to break but it is logical: If the DTD declares element
    content, then the processor repeats indenting as ignorable whitespaces; otherwise,
    it reports as normal whitespaces.


    # Why Schemas?


    Why do we need DTDs or schemas in XML? There is a potential conflict between flexibility
    and ease of use. As a rule, more flexible solutions are more difficult, if only
    because you have to work your way through the options. Specific solutions might
    also be optimized for certain tasks.


    Let''s compare a closed solution, HTML, with an open one such as XML. Both can
    be used to publish documents on the Web (XML serves many other purposes as well).
    HTML has a fixed set of elements and software can be highly optimized for it.
    For example, HTML editors offer templates, powerful visual editing, image editing,
    document preview, and more.


    XML, on the other hand, is a flexible solution. It does not define elements but
    lets you, the developer, define the structure you need. Therefore, XML editors
    must accept any document structure. There are very little opportunities to optimize
    the XML editors because, by definition, they must be as generic as XML is. HTML,
    the close solution, has an edge here.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_97_0.png)'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Why Schemas?


    The DTD is an attempt to bridge gap. DTD is a formal description of the document.
    Software tools can read it and learn about the document structure. Consequently,
    the tools can adapt themselves to better support the document structure.


    For example, some XML editors use DTDs to populate their element lists as well
    as adopt default styling, based on the DTD. Finally, these XML editors will guide
    the author by making certain the structure is followed.


    In other words, the editor is a generic tool that accepts any XML document, but
    it is configured for a specific application (read specific structure) through
    the DTD.


    Figure 3.1 is a screenshot of a DTD-aware editor. Notice that the editor prompts
    for elements based on the structure.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_98_0.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_98_1.png)


    Figure 3.1: XML editor uses the DTD to guide the user.


    # Well-Formed and Valid Documents


    XML recognizes two classes of documents: well-formed and valid. The documents
    in Chapter 2 were well-formed, which in XML jargon means they follow the XML syntax.
    Well-formed documents have the right mix of start and end tags, attributes are
    properly quoted, entities are acceptable, character sets are properly used, and
    so on.


    Well-formed documents have no DTD, so the XML processor cannot check their structure.
    It only checks that they follow the syntax rules.'
