    # TIP


    The W3C decided to call the attribute object Attr to avoid confusion with object
    properties. In some languages, object properties are called object attributes.
    An Attribute object would have been very confusing.


    # A Note on Structure


    If you compare Listing 7.5 and Listing 7.6, parsers, it appears that the structure
    of the two listings are different. The price listing has many elements and a hierarchy
    that goes three levels deep. Attributes convey meta-information (for example,
    information about the format of the data) only.)


    The rate listing has fewer elements. Data, and not meta-data, is stored in attributes.


    +   As you will see in Chapter 10 ("Modeling for Flexibility," page 307), there
    is raging debate between the element and the attribute supporters. In practice,
    applications often have to manipulate both types of files.


    Listing 7.8 is interesting because it demonstrates walking the two documents side-by-side.
    As you can see, walking the rate listing is easier because there is no need to
    maintain state information. You will revisit this issue in Chapter 10.


    # TIP


    One of the main reasons people place data in attributes is to avoid having to
    maintain state when walking down an XML file.


    # Common Errors and How to Solve Them


    In this chapter, you have learned how to use XML parsers, particularly DOM parsers
    from JavaScript. A discussion of parsers would not be complete without a discussion
    of common parsing errors and how to solve them.


    This section deals with debugging XML documents when the parser reports an error.


    # XML Parsers Are Strict


    When debugging XML documents, it is important to remember that XML parsers are
    strict. They complain for errors that an HTML browser would silently ignore.'
