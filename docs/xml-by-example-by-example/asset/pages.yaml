    This approach has three major problems:


    +   - It does not record the structure of the document. We see the user deduces
    the document appearance from its structure but it records only the result of the
    process. Therefore, information about the structure is lost.

    - It is inflexible. Any change to the formatting rules implies manually changing
    the document. Also, the markup is more or less system dependent, which reduces
    portability. Relying on the availability of a particular typeface or on the output
    device being a certain printer reduces portability.

    - It is an inherently slow process. It is also error-prone: It is easy to get
    confused and incorrect a format document.'
