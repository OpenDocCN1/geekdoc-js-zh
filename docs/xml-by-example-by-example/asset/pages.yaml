  md: "# WE MADE ASSUMPTIONS ABOUT YOU:\n\nA book on XML that teaches you HTML and\
    \ JavaScript isn't truly a book on XML. In order to teach you the most about XML,\
    \ we stuck to the topic at hand to provide you with the greatest learning curve\
    \ without wasting your time or money. The following explains what we think you\
    \ know. We hope this allows you to learn from reading this book, as well as what\
    \ we assume you already know. To make an informed purchasing decision.\n\n# WHAT\
    \ WE ASSUME YOU KNOW:\n\nBasic HTML coding. You don't need to be an expert, however.\
    \ If you can read and write the following example, you know enough HTML to read\
    \ this book.\n\n```\n<HTML>\n<HEAD><TITLE>Phone List</TITLE></HEAD>\n<body>\n\
    <h1>Phone List</h1>\n<p>John Doe-Tel.: 513-555-8101</p>\n<p>Tim Martin-Tel.: 513-555-8104</p>\n\
    <p>Jack Smith-BR+Tel.: 513-555-8102</p>\n</body>\n</HTML>\n```\n\nBasic JavaScript\
    \ coding for some advanced techniques introduced in the second half of the book.\
    \ Because these are advanced techniques, you can pick up valuable information\
    \ in this book without knowing JavaScript. If you can read and write the following\
    \ example, you know enough JavaScript to read this book.\n\n```\nfunction makeValues(array)\n\
    {\n  var i,\n  result = \"\";\n  for(i=0; i<array.length;i++)\n    result += \"\
    <value>\" + array[i] + \"</value>\";\n  return result;\n}\n```\n\nIf you are not\
    \ comfortable with these concepts, it is likely that you will not understand or\
    \ be able to complete all the exercises in this book. Please read HTML by Example\
    \ by Todd Stauffer and JavaScript by Andrew Woolridge, et al., before going through\
    \ the exercises in this book.\n\n# WHAT WE ASSUME YOU DON'T KNOW:\n\nWe assume\
    \ that you are learning the following concepts, each of which is taught in this\
    \ book:\n\n+   - Chapter 1\n- Chapter 2\n- Chapters 3 and 10\n- Chapter 5\n- Chapters\
    \ 7, 8, and 9\n- Chapter 11"
