  md: '# Common Errors and How to Solve Them


    This was a design goal for the development of XML. It was decided that HTML had
    grown too difficult to implement because the browsers were too lenient. According
    to some estimate, more than 50 percent of the code in a browser deals deals with
    correcting errors.


    That''s a huge burden on the browser developers and it might explain why competition
    in the browser space is limited.


    Furthermore, XML has been designed with a wide range of computing platforms in
    mind. This includes full-blown desktop but it includes smaller devices (portable
    phones, PDAs like the PalmPilot, and so on). These devices lack the memory and
    power to recover from complex errors.


    To minimize the risk of errors in XML documents, I suggest you adopt a validating
    editor. Such an editor validates your code as you write. Depending on the options,
    the validating editor might or might not enforce a DTD but it thereby enforces
    the XML syntax.


    # Error Messages


    Parsers produce error messages that are often confusing. XML parsers are written
    with compiler technology. Consequently, error messages are similar to what you
    should expect from a compiler: helpful, they rarely find the real error. Again,
    an XML editor might help. The best XML editors provide extra guidance about errors,
    which makes it easier to fix them.


    +   1. In the best case, the error message points to the problem. For example,
    given the following fragment: <p>Send comments and suggestions to <url protocol="mailto">

    bmarchal@pineapplesoft.com.</</p>


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_236_0.png)


    The parser generates an error message similar to this (the exact message depends
    on your parser):

    </url> expected


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_236_1.png)


    And it is right. The fragment misses an </url> closing tag.


    +   2. Unfortunately, the error message can be very confusing. Given the following
    fragment

    <p>Send comments and suggestions to <url protocol="mailto">

    bmarchal@pineapplesoft.com.</</p>

    the parser generates two error messages:

    attribute value must not contain ''<

    </p> expected


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_236_2.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_236_3.png)'
