  md: "# Advanced Topics\n\nConsortium (www.unicode.org) is responsible for publishing\
    \ and maintain- ing the Unicode standard. The same standard is published by ISO\
    \ as ISO/IEC 10646.\n\nUnicode supports all spoken languages (on Earth) as well\
    \ as mathematical and other symbols. It supports English, Western European languages,\
    \ Cyrillic, Japanese, Chinese, and so.\n\nSupport for Unicode is a major step\
    \ forward in the internationalization of the Web. Unicode also is supported in\
    \ Windows NT.\n\nHowever, to accommodate all characters, Unicode needs 16 bits\
    \ per character. We are aware of character sets, as Latin-1 (Windows default character\
    \ set), that use 8 bits per character. However, 8 bits supports only 256 choices—not\
    \ enough for Japanese, not to mention Japanese and Chinese and English and Greek\
    \ and Norwegian and.\n\nUnicode characters are twice as large as their Latin-1\
    \ equivalent; logically; XML documents should be twice as large as normal text\
    \ files. Fortunately, there is a workaround. In most cases, we don't need 16 bits\
    \ and we can encode XML documents with an 8-bit character set.\n\nXML processor\
    \ must recognize the UTF-8 and UTF-16 encodings. As the name implies, UTF-8 uses\
    \ 8 bits for English characters. Processors support other encodings. In particular,\
    \ for Western European languages, they support ISO-8859-1 (the official name for\
    \ Latin-1).\n\nDocuments using encoding other than UTF-8 or UTF-16 must start\
    \ with an XML declaration. The declaration must have an attribute encoding to\
    \ announce the encoded.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_68_0.png)\n\
    \n```\n<xml version=\"1.0\" encoding=\"ISO-8859-1\"\n  <name>José Dupont</name>\n\
    \  <email href=\"mailto:jdupont@emailaholic.com\"/>\n</entry>\n```\n\nFor example,\
    \ a document written in Latin-1 (such as with Notepad) could use the following\
    \ declaration:\n\n> NOTE\nYou might wonder how the XML processor can read the\
    \ encoding parameter. Indeed, however, to reach the encoding parameter, the processor\
    \ must read the declaration. The processor needs to know which encoding is being\
    \ used.\n\nThis looks like a dog running after its tail until you realize the\
    \ first characters of an XML document always are <?xml. The XML processor can\
    \ match these characters against the encoding it supports and gives enough of\
    \ the encoding (it is 8 or 16 bits?) to read the declaration.\n\ncontinues"
