    {\rtf\ansi\anspg1\252\def0\deflang033\deflangfe033{\ftntbl

    {\froman\frq2\fcharset0 Garamond;}\{\froman\frq2\fcharset0 Times New Roman;}

    {\f1\fscript1\frq2\fcharset0 Lucida Handwriting;}}

    {\colt1 \redgreen0blue255;

    {\u1}\part\sb100\nowcid|lang308|\ulone\b\f0\fs36 XML

    ```


