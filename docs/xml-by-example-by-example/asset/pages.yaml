  md: '# Appendix A


    # Crash Course on Java


    If you are a JavaScript, Perl, or C++ programmer and you are not familiar with
    Java, this appendix is for you. Java is a natural companion to XML.

    This appendix teaches you just enough Java to be able to use it with XML.


    In this appendix, you learn


    +   * how Java compares to JavaScript and other programming languages

    * why Java is important for XML

    * how to install a Java runtime environment and run Java applications

    * enough Java to read and write simple programs


    You don''t have to become a super-trooper in Java programming, but some familiarity
    with “the other Web language” is required for serious fun with XML. If anything,
    there are more XML tools available in Java than in any other language.


    > ✔ If you want to quickly learn how to run the Java package introduced in Chapter
    3, turn to the section "Downloading Java Tools,"on page 459, and the section "Understanding
    the Classpath,"on page 480.


    # Java in Perspective


    There is lot of discussion about the relative importance of Java and XML. In my
    experience, they are complementary. Admittedly, I am somewhat biased in favor
    of Java. I formed my company, Applesoft, with a focus on Java development. At
    the time, I bet on the importance of cross-platform applications.


    I believed (and still do) that a low level object-oriented programming language
    for the Internet is required. C++ is low-level but is not portable enough (you
    can''t run the same program unmodified on different machines).


    XML is not a programming language, just as HTML is not a programming'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'language. XML is a language to encode information. That is useful but you also
    need programming to manipulate the information in XML documents.


    One of the major misconceptions is that Java equals applets. Applets have been
    popular in the early days of Java but they never had a fighting chance against
    Macromedia Flash or Dynamic HTML. For simple animation, JavaScript is simpler
    than Java. For complex animation, Flash is more efficient.


    The value of Java lies elsewhere. In combination with XML, Java is particularly
    relevant for


    +   - heavy-duty server-side applications

    - components for scripting languages


    # Server-Side Applications


    As you will, Java combines a high-performance server environment with portability.


    Portability is essential on the server side because there is more diversity in
    that space than on the desktop. Windows clearly rules the desktop but there is
    no clear winner among servers: UNIX, Windows NT, and AS/400 are all major platforms.


    Furthermore, a typical organization might have all of these platforms running
    at once, and your application might have to run on both UNIX and Windows servers.


    Finally, for servers, portability equates with scalability: When new hardware
    is introduced to boost the performance, existing software must run it on cheap
    machines and deployed on high-end servers.


    # Components of the Server-Side Applications


    Increasing, we rely on scripting languages—such as JavaScript, Perl, Python, or
    ColdFusion—to combine components such as an XSL Processor or database access.


    Scripting languages are high-level programming languages. They are usually interpreted
    and typeless. This makes them able to create applications quickly. These languages
    are at their best when they are gluing components together.


    XML fits well with this style of programming. The numerous companion standards
    (DOM, SAX, XSL, CSS, X-Schema, RDF, and so on) are being made available as components.


    Scripting languages are not the best tool for writing components. For one'
  merge: -1
  pgno: 475
- img_proc: true
  md: 'thing, it is difficult to integrate scripting languages with one another. Furthermore,
    because scripting languages are high level, they are less efficient.


    Java is well adapted to write these components because it is a compiled, low-level
    programming language. Additionally, most scripting languages can interface with
    Java components. Java portability means that components are available on a large
    number of platforms. In Java, components are called JavaBeans.


    As has already been noted, there are more XML components (parsers, XSL processors,
    conversion, and so on) written in Java than in any other language.


    # Downloading Java Tools


    This section lists the various pieces you need to run the examples in this book.
    I have chosen software that is available free of charge when possible.


    If you find yourself doing lots of Java development, however, you will want to
    buy an integrated development environment such as Café (www.symantec.com), Visual
    Age (www.software.ibm.com), or JBuilder (www.inprise.com).


    # Java Environment


    The trick behind Java portability is the Java Virtual Machine or JVM. Java programs
    are compiled to a portable binary format, called the class files. To execute the
    binaries, you need a JVM.


    The JVM is available on most platforms. You can download a JVM for your platform
    from java.sun.com. It comes in one of two versions:


    +   - Java Runtime Environment (JRE) is a native JVM. It can run existing Java
    applications but lacks the tools to develop new ones.


    +   - Java Development Kit (JDK) offers everything in the JRE as well as development
    tools such as the compiler.


    If you plan to run the examples in this book, you need a JDK to compile them.
    If you are interested in running only existing packages (such as LotusXSL), a
    JRE is enough.


    At the time of this writing, there are three major generations of JVMs:


    +   - JDK 1.0 is the original version. Seldom used anymore, it was slow and limited.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# Appendix A


    +   * JDK 1.1 is the most common version. It is a mature product that greatly
    improved the usability of JDK 1.0.x.


    +   * Java 2 (also known as JDK 1.2) is the newest version. It is not available
    on every platform yet. It adds many bells and whistles to Java—not all of them
    useful. The graphical component is not as stable as the JDK 1.1 equivalent. However,
    you don''t need the graphical component in this book.


    Which version choose depends on the components you want to use. Most components
    require at least JDK 1.1. If available on your platform, I advise you to download
    Java 2. The examples in this book have been developed on Java 2, but they should
    run unmodified of JDK 1.1.


    # XML Components


    The examples in this book have been tested with IBM''s XML for Java (version 2.0.9)
    and LotusXSL. XML for Java is a parser that supports both the SAX and DOM interfaces.
    LotusXSL is an implementation of XSLT.


    At the time of this writing, both are free of charge from www.alphaworks.ibm.com.
    If this changes, I will post an update at www.mcp.com.


    There are several other parsers and XSL processors for Java:


    +   * Sun''s ProjectX is another parser that supports DOM and SAX. It is available
    from java.sun.com.


    +   * Microsoft has a DOM parser available from mdn.microsoft.com. The Microsoft
    parser is also available as a COM component.


    +   * The DataChannel parser, XParse (available from www.datachannel.com), integrates
    XSL support.


    +   * Microstar''s Ælfred (available from www.microstar.com) is a SA-only parser
    that boasts a very small memory footprint.


    +   * James Clark has written a SAX-compliant parser (XP) and an XSL processor
    (XT). Both are available from www.jclark.com.


    # Servlet Engine


    Servlets are Java''s version of CGI scripts. Servlets include a standard API in
    order to interface Java with Web servers. The e-commerce example in Chapter 12,
    "Putting It All Together: An E-Commerce example," is based on servlets. You need
    a servlet-enabled Web server.'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# Appendix A 461


    If your Web server is Apache, Netscape, IIS, or WebSTAR, you can add servlet support
    through one of the following three products:


    +   * JRun is available from www.jrun.com. It supports the major Web servers and
    them some.

    * ServletExec is available from www.newatlanta.com. It supports the major Web
    servers.

    * Locomotive is available from www.locomotive.org. It supports fewer servers than
    the other two but it is an open-source project.


    Alternatively, you can turn to a Web server that natively support servlets.

    These include


    +   * WebSTAR, which is available from www.ora.com.

    * Java Web Server, which is available from jserv.jasasoft.com. As the name implies,
    it is written in Java.

    * Jetty, is available from www.mortbay.com, is also written in Java but it is
    an open-source product.


    I strongly recomm Jetty. It is a full-featured Web server (it even exports proxy)
    with a small memory footprint. It is also fast to download. The only limitation
    is that the user interface is old-fashioned: You must edit text files. Finally,
    I use Jetty throughout the book which is another good reason to give it a try.


    If you want ease of use, WebSTAR is a good choice. In addition to servlets, it
    also supports ASP and iHTMLTL.


