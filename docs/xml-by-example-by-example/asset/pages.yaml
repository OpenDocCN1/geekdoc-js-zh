  md: "# Extended Links\n\nExtended links are more powerful. Some of the most exciting\
    \ features of extended links include the capability to establish links between\
    \ more than two resources and the capability to establish links that do not reside\
    \ in the document.\n\nThe latter means that it is possible to maintain the links\
    \ in a different document. This is useful in at least two cases:\n\n+   * It is\
    \ possible to store all the links from a Web site in a single, central document.\
    \ This would simplify maintenance of the links (because there is only one document\
    \ to search when a link must be updated) and help reduce broken links.\n\n+  \
    \ * It is possible to add links to documents that cannot be modified, such as\
    \ resources residing on another server or a document in non-XML format.\n\nThe\
    \ following is an example of an extended link:\n\n```\n<xlink:extended xmlns:xlink=\"\
    http://www.w3.org/XML/XLink/0.9\"\n  role=\"resources\"\n  title=\"Web Resources\"\
    \n  showdefault=\"replace\"\n  actuateddefault=\"user\">\n  <xlink:locator href=\"\
    http://www.mcp.com\"\n    role=\"resource\"\n    title=\"Macmillan\"/>\n  <xlink:locator\
    \ href=\"http://www.applesoft.com/newsletter\"\n    role=\"resource\"\n    title=\"\
    Pineapples Link\"/>\n  <xlink:locator href=\"http://www.xml.com\"\n    role=\"\
    resource\"\n    title=\"XML.com\"/>\n  <xlink:locator href=\"http://www.comics.com\"\
    \n    role=\"resource\"\n    title=\"Comics.com\"/>\n  <xlink:locator href=\"\
    http://www.fatbrain.com\"\n    role=\"resource\"\n    title=\"Fatbrain.com\"/>\n\
    \  <xlink:locator href=\"http://www.abcnews.com\"\n    role=\"resource\"\n   \
    \ title=\"ABC News\"/>\n</xlink:extended>\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_343_0.png)"
  merge: -1
  pgno: 343
