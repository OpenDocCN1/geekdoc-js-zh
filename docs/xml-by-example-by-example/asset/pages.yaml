  md: "# Chapter 2: The XML Syntax\n\nAnother popular convention is to capitalize\
    \ the first letter of each word and use no separation character as in AddressBook.\n\
    \nThere are other conventions but these two are the most popular. Choose the convention\
    \ that works best for you but try to be consistent. It is difficult to work with\
    \ documents that mix conventions, as Listing 2.3 illustrates.\n\nListing 2.3:\
    \ A Document with a Mix of Conventions\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_63_0.png)\n\
    \n```\n<xml version=\"1.0\"?>\n<address-book>\n  <name>John Doe</name>\n  <Address>\n\
    \    <street>34 Fountain Square Plaza</street>\n    <Region>OH</Region>\n    <PostalCode>45202</PostalCode>\n\
    \    <location>Cincinnati</location>\n    <country>US</country>\n  </Address>\n\
    \  <TEL PREFERRED=\"true\">513-555-8889</TEL>\n  <TEL>513-555-7098</TEL>\n  <email\
    \ href=\"mailto:jdoe@emailaholic.com\"/>\n</address-book>\n```\n\nAlthough the\
    \ listing in Listing 2.3 is well-formed XML, it is difficult to work with it because\
    \ you never know how to write the next element. Is it Address or address? Mixing\
    \ case is cumbersome and is considered a poor style.\n\n> NOTE\n we will see in\
    \ the \"Unicode\" section, XML supports characters from most spoken languages.\
    \ You can use letters from any alphabet in names, including letters from the Greek,\
