    ```

    <!-- definition of the address structure if several addresses, the preferred attribute
    signals the "default" one -->

    ```


    ```

    <!ELEMENT address (street,region?,postal-code,locality,country)>

    <!ATTLIST address preferred (true | false) "false">

    <!ELEMENT street (#CDATA)>

    <!ELEMENT region (#CDATA)>

    <!ELEMENT post-code (#CDATA)>

    <!ELEMENT locality (#CDATA)>

    <!ELEMENT country (#CDATA)>

    ```


    ```

    <!-- phone, fax and email, same preferred attribute as address -->

    <!ELEMENT tel (#CDATA)>

    <!ATTLIST tel preferred (true | false) "false">

    <!ELEMENT fax (#CDATA)>

    <!ATTLIST fax preferred (true | false) "false">

    <!ELEMENT email EMPTY>

    <!ATTLIST email href CDATA #REQUIRED

    preferred (true | false) "false">

    ```


    # Element Declaration


    +   1. DTD is a mechanism to describe every object (element, attribute, and so
    on) that can appear in the document, starting with elements. The following is
    an example of element declaration: <!ELEMENT address-book (entry+)>


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_88_0.png)


    After the <!ELEMENT markup comes the element name followed by its content model.
    The element declaration is terminated with a right angle.'
  merge: -1
