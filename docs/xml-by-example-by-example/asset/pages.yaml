    # Saving the Document


    JavaScript applications cannot access the local hard disk unless they have been
    signed. Therefore, it is not common to save the XML in a file on a browser.


    However, on the server, you often want to save XML documents. If you create the
    file with your own generator, you save it like any other file.


    When creating a document with a Microsoft DOM parser, you use a Microsoft-specific
    extension to save the document. Microsoft parser supports the save() function.


    However, as I have just explained, this extension does not work on the browser.
    It is therefore only useful when writing CGI scripts or ASP pages. The example
    in Listing 9.11 shows how to save a file from JavaScript in an ASP server.


    **Listing 9.11:** Saving the XML Document


    ```

    var xmldoc = new ActiveX("Microsoft.XMLDOMObject");

    // creates the XML document here

    // ...

    xmldoc.save(Server.MapPath("request.xml"));

    ```'
