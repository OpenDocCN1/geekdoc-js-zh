- img_proc: true
  md: '# Why Another API?


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_250_0.png)


    Figure 8.2: Mapping the XML structure to the application structure


    In these cases, an event-based interface is more sensible. The major difference
    between an object-based interface and an event-based one is that the event-based
    interface does not explicitly build the tree. Rather, it builds it implicitly.


    # Event-Based Interfaces


    As the name implies, an event-based parser sends events as it reads through XML
    documents. Parser events are similar to user-interface events such as ONCLICK
    (in a browser) or AWT events (in Java).


    Events alert the application that something happened and might want to react.
    Applications register event handlers, which are functions that process the events.


    In a browser, events are typically generated in response to user actions: The
    user clicks on a button, the button fires an ONCLICK event.


    With an XML parser, events are not related to user actions, but to elements in
    the XML document being read. There are events for


    +   - element opening tags

    - element closing tags

    - content of elements

    - entities

    - parsing errors'
