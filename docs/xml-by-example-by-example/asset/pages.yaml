  md: 'Similarly, you need to easily recognize high-level structures. In the follow-document,
    it is easy to recognize that there is a name, an address, and a phone number.


    John Doe

    34 Fountain Square Plaza

    Cincinnati, OH 45202

    US

    513-555-8889


    This structure results in the following markup:


    ```

    <entry>

    <name>John Doe</name>

    <address>34 Fountain Square Plaza

    Cincinnati, OH 45202

    US</address>

    <tel>513-555-8889</tel>

    </entry>

