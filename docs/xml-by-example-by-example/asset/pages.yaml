  md: '# 48 Chapter 2: The XML Syntax


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_65_0.png)


    Figure 2.1: Tree of the address book


    An element that is enclosed in another element is called a *child*. The element
    it is enclosed in its *parent*. In the following example, the name element has
    two children: the *fname* and the *lname* elements. name is the parent of both
    elements.


    ```

    <name>

    <fname>Jack</fname>

    <lname>Smith</lname>

    </name>

    ```


    Start and end tags must always be balanced and children are always completely
    enclosed in their parents. In other words, it is not possible that the end tag
    of a child appears after the end tag of its parent. So, the following is illegal:


    ```

    <name><fname>Jack</fname><lname>Smith</lname></name>

    ```


    > NOTE

    It is not an accident if XML documents are trees. Trees are flexible, simple,
    and powerful. In particular, trees can be used to serialize any data structure.

    XML is particularly well adapted to serialize objects from object-oriented languages
    such as JavaScript, Java, or C++.


    # Root


    At the root of the document there must be one and only one element. In other words,
    all the elements in the document must be the children of a single element. The
    following example is illegal because there are two entry elements that are not
    enclosed in a top-level element:


    ```

    <?xml version="1.0"?>

    <entry>

    <name>John Doe</name>

    ```'
