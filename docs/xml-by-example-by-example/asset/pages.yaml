    # CSS Property Values


    Four values are commonly used by the properties: length, percentage, color, and
    URL. Before going into the specifics of properties, let''s first review these
    values.


    # Length


    Lengths are used for widths, heights, and sizes. A length is a number followed
    by a unit with no spaces between them. For example, the two properties define
    a font size of 10 points and a margin of 5 pixels, respectively:


    ```

    font-size: 10pt;

    margin: 5px;

    ```


    Units are represented by two-letter abbreviations:


    +   - em: ems, the height of the element''s font, this unit is relative to the
    element''s font

    - ex: x-height, the height of the “x” letter, this unit is relative to the element''s
    font

    - px: pixels

    - in: inches

    - cm: centimeters

    - mm: millimeters'
