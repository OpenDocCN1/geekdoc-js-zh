  md: '# DOM Methods to Create and Modify Documents


    # DOM Methods to Create and Modify Documents


    This section defines properties and methods of DOM that are related to document
    manipulation. These methods and properties are in addition to the properties introduced
    in Chapter 7.


    +   - You will find the original list of methods and properties in the section
    "Getting Started with DOM" in Chapter 7 (page 198).


    # Document


    In addition to the properties introduced in Chapter 7, Document defines the following
    methods:


    +   - createAttribute(name) creates an Attr object called name.

    - createCDATASection(data) creates a CDATASection object with the data.

    - createComment(data) creates a Comment object.

    - createDocumentFragment() creates an empty DocumentFragment.

    - createElement(name) creates an Element object.

    - createEntityReference(name) creates an EntityReference object called name.

    - createProcessingInstruction(target,data) creates a ProcessingInstruction object
    for the target.

    - createNode(data) creates a TextNode object.


    # Node


    Node defines the following methods for adding and removing objects to or from
    the document tree. Because many DOM objects are derived from Node, they inherit
    these methods:


    +   - appendChild(child) appends child to the end of the list of the children.

    - insertBefore(child,before) appends child before before. Before must be a child
    of the node.

    - replaceChild(child,toReplace) replaces toReplace with child; toReplace must
    be a child of the node.

    - removeChild(child) removes child from the node''s children.

    - cloneNode(deep) creates a copy of the node. If deep is true, it also clones
    all the children of the node recursively.'
  merge: -1
