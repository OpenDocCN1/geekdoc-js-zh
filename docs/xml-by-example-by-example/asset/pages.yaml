  md: '# Alternative API: SAX


    In the previous chapter, you learned how to use DOM, an object-based API for XML
    parsers. This chapter complements the discussion on XML parsers with an introduction
    to an event-based interface, SAX.


    In this chapter, you learn how to use event-based interfaces. You will see that
    these interfaces


    +   * operate at a lower level than object-based interfaces

    * give you more control than object-based interfaces

    * are more efficient than object-based interfaces

    * require more work than object-based interfaces


    # Why Another API?


    > The What Is a Parser?” section in Chapter 7, "The Parser and DOM" (page 191),
    introduced you to XML parsers.


    Parsers are software components that decode XML files on behalf of the application.
    Parsers effectively shield developers from the intricacies of the XML syntax.


    You also learned how to integrate a parser with an application. Figure 8.1 shows
    the two components of a typical XML program:


    +   * the parser, which deals exclusively with the XML file and makes its content
    available to the application

    * the application, which consumes the file content


    Obviously, the application can be simple, or very complex, such as a distributed
    application to order goods over the Internet.


    The previous chapter and this chapter concentrate on the dotted line, the interface
    or API (Application Programming Interface) between the parser and the application.'
  merge: -1
