  md: '# Chapter 11: n-Tiered Architecture and XML


    Most of these applications are called n-tiered applications. XCommerce is an n-tier
    application. Essentially, n-tiered applications are a specialized form of client/server
    application.


    # Client/Server Applications


    As Figure 11.1 illustrates, the Web is a good example of a client/server application,
    so you are already familiar with the idea. On the left side is the Web client
    also known as the browser. On the right side is the Web server.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_363_0.png)


    Figure 11.1: The Web is a client/server application.


    At the user initiative, the browser requests Web pages from the server. The server
    delivers the pages and the client displays them. In effect, the client is a tool
    for the user to interact with the server.


    Client/server applications have two essential characteristics:


    +   * They are distributed applications, meaning that two or more computers are
    connected over a network.

    * The two computers have specific roles.


    The second point differentiates client/server applications from other forms of
    distributed applications (such as peer-to-peer ones). It means that there is a
    client and server that their roles differ.


    The server provides services to the client. The server is the producer and the
    client is the consumer. However, the server provides services only at the client''s
    request. This is a sort of master/slave relationship where the master (client)
    requests services from the slave (server).


    The Web is but one example of client/server. Other examples include


    +   * Internet mail, where the mail client (such as Eudora or Outlook) interacts
    with the mail server to deliver and receive email

    * Novell print and file servers, where the stations on a LAN can store files or
    print documents on a server

    * PowerBuilder and other 4GL applications, where a local client interacts with
    a database server for administrative applications'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# What Is an n-Tiered Application?


    Generally speaking, the server has access to resources that the client does not
    have access to or are too difficult for the client to manage. In the case of the
    Web, the resources are HTML files. It would not be realistic to keep a local copy
    of every Web page. It makes more sense to request those you want to see at a particular
    time.


    For email, the resource is a 24/7 Internet connection. A client could send emails
    directly but it makes more sense to pass the burden to a dedicated server that
    handles errors and retries.


    Novell servers have printers and plenty of hard disks. In most setups, it is not
    cost-effective to give every user a fast printer and it is safer and more efficient
    to store files on a central location. Among other things, it simplifies backups.


    Database servers provide a central storage for the data in the organization. Therefore,
    a database server has more information than is available to a given PC.


    # 3-Tiered Applications


    As we enter an increasingly wired world, the server itself needs to rely on other
    servers. Webmail is a good example of an n-tiered application. Webmail are those
    applications that let you read and compose emails through a Web site. Popular
    Webmails include Hotmail (www.hotmail.com) and Startmail (www.startmail.com).


    As Figure 11.2 illustrates, in this setup, a server can also act as a client to
    another server. Indeed, the browser is a client. The email server is a server.
    But the Web server is both a client and a server: It is a server when talking
    to the email server.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_364_0.png)


    > Figure 11.2: The web server plays roles.


    This application consists of two client/server applications chained together.
    This is known as a three-tiered application. There are three tiers because there
    are three parties involved.


    To differentiate between the various clients and servers, the leftmost client
    is often called the presentation tier because it is the interface for the end
