    # Doing Something with the XML Documents


    Now that you can create XML documents, you probably want to do something more
    involved than display the XML code in an HTML form. In most cases, the application
    can either save the document to a file or send it to a server.


    +   ✓ This section looks briefly at your options to save the document or send
    it to the server. We will revisit this in Chapter 12, "Putting It All Together:
    An e-Commerce Example," (page 381).


    # Sending the Document to the Server


    There are two options to send the document to the server. You can place the XML
    document in an HTML form and have it sent along with the form, you can use a JavaBean
    or an ActiveX control to post the XML document to the Web server.


    +   1. Sending the XML document in a form is the most portable approach. Because
    you already create the XML document in a form, this is easy to do. The FORM tag
    needs an ACTION attribute and the INPUT field must be changed from BUTTON to SUBMIT.
    You might also want to change the TEXTAREA in a HIDDEN field so XML does not appear
    offscreen:'
