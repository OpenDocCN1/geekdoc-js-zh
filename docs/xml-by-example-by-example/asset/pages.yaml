    \ The parser generates events.\n\nListing 8.1 is a price list in XML. It lists\
    \ the vendors and the prices charge for XML training. The structure of this document\
    \ is shown in Figure 8.4.\n\nListing 8.1: A Price List in XML\n\n```\n<xml version=\"\
    1.0\"?>\n<product>\n  <name>XML Training</name>\n  <price price=\"999.00\" vendor=\"\
    Playfield Training\"/>\n  <price price=\"699.00\" vendor=\"XML\"/>\n  <price price=\"\
    799.00\" vendor=\"WriteIT\"/>\n  <price price=\"1999.00\" vendor=\"Emailaholic\"\
    />\n</product>\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_251_1.png)\n\n\
    Figure 8.4: The structure of the price list\n\nThe XML parser reads this document\
    \ and interprets it. Whenever it recognizes something in the document, it generates\
    \ an event. The parser reads the XML declaration. It generates an event corresponding\
    \ to the declaration.\n\nWhen it encounters the first opening tag, <product>,\
    \ the parser generates its second event. The event notifies the application that\
    \ a product element is starting.\n\nNext, the parser sees the opening tag for\
    \ the name element and it generates its third event."
