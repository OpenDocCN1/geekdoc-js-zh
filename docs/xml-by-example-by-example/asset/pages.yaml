    # Writing with Flexibility in Mind


    One of the major advantages of XML is that it is extensible. Anyone can create
    a tagging language with tags specific to the application.


    On the other hand, it means applications must be able to support different DTDs.
    For example, your company can have its own DTDs for internal exchange. However,
    when exchanging documents with other companies, you may have to use another DTD.


    There are also so-called standard DTDs developed by various standardization committees.
    In fact, developing DTDs has become a favorite activity in standard bodies lately,
    so expect more in the future. Unfortunately, so many committees are actively developing
    standards that you may have to support several incompatible standards.


    There are essentially two solutions to this problem. Either you define several
    XSLT() functions, one for each DTD that you want to support, or you turn to XSLT.


    In most cases, I would advocate using XSLT. It is a waste of time to write as
    many functions as there are DTDs. XSLT is also more flexible because you don''t
    have to write code to add new DTDs or when a DTD changes (and it happens more
    often than you might think).


    # Supporting Several DTDs with XSLT


    Listings 9.12 and 9.13 show how to use XSLT to support several DTDs. The user
    chooses the DTD from a list block. Unlike the previous version, this version uses
    the XSL processor of Internet Explorer. It will not run on Netscape.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_313_0.png)


    # TIP


    If you need to support both browsers, you can replace the Internet Explorer XSL
    process with LotusXSL.


    LotusXSL comes with several examples that show how to use it in a browser. However,
    it is not as stable as the built-in XSL processor. If at all possible, stick to
    Internet Explorer.'
