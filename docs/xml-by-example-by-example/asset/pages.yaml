- img_proc: true
  md: 'When the XML parser reads the document in Listing 7.1, it recognizes that the
    top-level element is named products. Therefore, it constructs an object to represent
    the products element.


    The next element is a product. The parser creates another object to represent
    the product element. Because this is a tree, it attaches the product object to
    the products object.


    The next element is a name. Again, the parser creates an object for the name and
    adds it to the tree being built.


    In the name, there is some text that the parser translates in another object in
    the tree.


    After the name comes a price element, which also contains some text. The parser
    adds two new objects to the tree.


    It then moves to another product element, which also contains a name and a price.
    This results in more objects in the tree.


    The process continues until the document has been completely read. By the time
    the parser reaches the end of the document, it has built a tree of objects in
    memory that matches the tree of the document.


    # Event-Based Interface


    The second approach to interfacing the parser and the application is through events.
    An event-based interface is natural for the parser but it is more complex for
    the application. Yet, with some practice, event-based interfaces prove very powerful.
    More programmers (and more parsers) are turning to event-based interfaces for
    this reason.


    With an event-based interface, the parser does not explicitly build a tree of
    objects. Instead, it reads the file and generates events as it finds elements,
    attributes, or text in the file. There are events for element start, ends, attributes,
    text content, entities, and so on. Figure 7.4 illustrates how it works.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_213_0.png)


    Figure 7.4: An event-based API'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'At first sight, this solution is less natural for the application because it
    is not given an explicit tree that matches the file. Instead, the application
    has to listen to events and determine which tree is being described.


    In practice, both forms of interfaces are helpful but they serve different goals.
    Object-based interfaces are ideal for applications that manipulate XML documents
    as browsers, editors, XSL processors, and so on.


    Event-based interfaces are geared towards applications that maintain their own
    data structure in a non-XML format. For example, event-based interfaces are well
    adapted to applications that import XML documents in databases. The format of
    the application is the database schema, not the XML schema. These applications
    have their own data structure and they map from an XML structure to their internal
    structure.


    An event-based interface is also more efficient because it does not explicitly
    build the tree in memory. Fewer objects are required and less memory is being
    used.


    > Chapter 8 discusses event-based interfaces in greater detail ("Alternative API:
    SAX," page 231).


    # The Need for Standards


    Ideally, the interface between the parser and the application should be a standard.
    A standard interface enables you to write software using one parser and to deploy
    the software with another parser.


    Again, there is a similarity with databases. Relational databases use SQL as their
    standard interface. Because they share the same interface, developers can write
    software with one database and later move to another database (for price reasons,
    availability, and so on) without changing the application.


    That''s the theory, at least. In practice, small differences, vendor extensions,
    and other issues mean that moving from one vendor to another requires more work
    than just recompiling the application. At the minimum, even if they follow the
    same standards, vendors tend to introduce different bugs.


    But even if different vendors are not 100-percent compatible with one another,
    standards are a good thing.


    For one thing, it is still easier to adapt an application from a vendor-tainted
    version of the standard to another vendor-tainted version of the same standard
    to port the application between vendors that use completely different interfaces.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 198 Chapter 7: The Parser DOM


    Furthermore, standards make it easier to learn new tools. It is easier to learn
    a new interface when 90 percent of it is similar to the interface of another product.


    The two different approaches for interfaces translate into two different standards.
    The standard for object-based interfaces is DOM, Document Object Model, published
    by the W3C (www.w3.org/TR/REC-DOM-Level-1).


    The standard for event-based interfaces is SAX, Simple API, developed collaboratively
    by the members of the XML-DEV mailing list and edited by Davidginson (www.megginson.com/SAX).


    The two standards are not really in opposition because they serve different needs.
    Many parsers, such as IBM''s XML for Java and Sun''s ProjectX, support both interfaces.


    This chapter concentrates on DOM. The next chapter discusses SAX. Chapter 9, “Writing
    XML,” looks at how to create XML documents.


    # Document Object Model


    Originally, the W3C developed DOM for browsers. DOM grew out of an attempt to
    unify the object models of Netscape Navigator 3 and Internet Explorer 3. The DOM
    recommendation supports both XML and HTML documents.


    The current recommendation is DOM level 1. Level 1 means that it fully specifies
    well-formed documents. DOM level 2 is under development and it will support valid
    documents—that is, the DTDs.


    DOM''s status as the official recommendation from the W3C means that most parsers
    support it. DOM is also implemented in browsers, meaning that you can write DOM
    in browser applications with JavaScript.


    As you can imagine, DOM has defined classes of objects to represent every element
    in an XML file. There are objects for elements, attributes, entities, text, and
    so on. Figure 7.5 shows the DOM hierarchy.


    # Getting Started with DOM


    Let''s, see through examples, how to use a DOM parser. DOM is implemented in a
    Web browser so these examples run in a browser. At the time of this writing, Internet
    Explorer 5.0 is the only Web browser to support the standard DOM for XML. Therefore,
    make sure you use Internet Explorer 5.0.'
