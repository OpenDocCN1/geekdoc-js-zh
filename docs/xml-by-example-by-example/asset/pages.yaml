  md: 'Most document exchange standards concentrate on the actual appearance of a
    document. They take great pains to ensure almost identical display on various
    platforms.


    XML uses a different approach and records the structure of documents from which
    the formatting is automatically deduced. The difference might seem trivial but
    we see it has far reaching implications.


    # Markup Language History


    HTML stands for Hypertext Markup Language; XML is the eXtensible Markup Language.
    There is another standard called SGML, which stands for the Standard Generalized
    Markup Language. Do you see the pattern here?


    All three are markup languages. What exactly is a markup language? What problem
    does it solve?


    The easiest way to understand markup languages in general, and XML in particular,
    is probably a historical study of electronic markup; that is, the progression
    from procedural markup to generalized markup through generic coding.


    This requires a brief discussion of SGML, the internal standard underlying HTML
    and XML. I promise that I will limit references to SGML in this book. However,
    I cannot completely hide the relationship between XML and SGML.


    Before we rush into the hows and whys, let me define markup. In an electronic
    document, the markup is the codes, embedded with the text, which store the information
    required for electronic processing, like font name, boldness or we, in the case
    of XML, the document structure. This is not specific to XML. Every electronic
    document standard uses some sort of markup.


    # Mark-Up


    Mark-up originates in the publishing industry. In traditional publishing, the
    manuscript is annotated with layout instructions for the typesetter. These handwritten
    annotations are called mark-up.


    Mark-up is a separate activity that takes place after writing and before typesetting.


    # Procedural Markup


    Similarly, word processing requires the user to specify the appearance of the
    text. For example, the user selects a typeface and its boldness. The user can
    also place a piece of text at a given position on the page and more. This information
    is called markup and is stored as special codes with the text.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# NOTE


    Electronic markup is spelled as one word to distinguish it from traditional handwritten
    markup-up.


    Practically, the user selects commands in menus to add formatting instructions
    to the text. The formatting instructions tell the printer whether to print in
    bold or when to use another typeface.


    To select the formatting instructions, the user implicitly analyzes the structure
    of its document; that is, he identifies each separate meaningful element.


    He then determines the commands that need to be applied to produce the format
    for that type of element and he selects the appropriate commands.


    Please note that, once again, the document structure is the starting point from
    which actual formatting is deduced. However, this is an unconscious process.


    This process is often referred to as procedural markup because it is effectively
    some procedure for the output device. It closely parallels the traditional markup-up
    activity. The main difference being that markup is stored electronically.


    The Rich Text Format (RTF), developed by Microsoft but supported by most word
    processors, is a procedural markup. Listing 1.2 is the memo in RTF. You need not
    worry about all the codes used in this document but it is clear that instructions
    (markup) have been added to the text to describe how it should be formatted.


    Listing 1.2: The Memo in RTF


