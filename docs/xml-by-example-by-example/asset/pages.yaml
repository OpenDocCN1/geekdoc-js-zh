  md: '# Creating the DTD from Scratch


    Also, I decided that addresses, phone numbers, and so on would be conditional.
    I have incomplete entries in my address book and the XML version must be able
    to handle it as well.


    I looked at commonalities and I found I group postal code and zip code under one
    element. Although they have different names, they are the same concepts.


    This is the creative part of modeling when you list all possible elements, group
    them, and reorganize them until you achieve something that makes sense. Gradually,
    a structure appears.


    Building the DTD from this example is easy. I draw a tree with all the elements
    introduced in the document so far, as well as their relationship. It is clear
    that some elements such as state are optional. Figure 3.9 shows the tree.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_118_0.png)


    Figure 3.9: The updated tree because the underlying model is simple and well known.
    For a more complex application, you would want to spend more time drafting documents
    and trees.


    At this stage, it is a good idea to compare my work with other similar works.
    In this case, I choose to compare with the vCard standard (RFC 2426). vCard (now
    in its third version) is a standard for electronic business cards.


    vCard is a very extensive standard that lists all the fields required in an electronic
    business card. vCard, however, is too complicated for my needs so I don''t want
    to simply duplicate that work.


    By comparing the vCard structure with my structure, I realized that names are
    not always easily broken into first and last names, particularly foreign names.
    I therefore provided a more flexible model for names.


    I also realized that address, phone number, and email address repeat. Indeed,
    it didn''t show up in my sample of business cards but there are people with several
    phone numbers or email addresses. I introduced a repetition for these as well
    as an attribute to mark the preferred address. The attribute has a default value
    of false.'
