  md: "# Three Applications of XML\n\n<Style sheets are separated from documents.\
    \ Therefore, one document can have more than one style sheet and, conversely,\
    \ one style sheet can be shared among several documents.</p>\n\n<p>This means\
    \ that a document can be rendered differently depending on the media or the audience.\
    \ For example, a \"managerial\" style sheet may present a summary view of a document\
    \ that highlights key elements but a \"clerical\" style sheet may display more\
    \ detailed information.</p>\n\n</section>\n</article>\n\nThe main advantages of\
    \ using XML for publishing\n\n+   * the capability to convert XML documents to\
    \ different media: the Web, print, and more\n* for large document sets, the capability\
    \ to enforce a common structure that simplifies editing\n* the emphasis on structure\
    \ means that XML documents are better equipped with the test of time, because\
    \ structure is more stable than formatting\n\n> ✔ Turn to Chapter 5, \"XSL Transformation,\"\
    \ page 125 and Chapter 6, \"XSL Formatting Objects and Cascading Style Sheet,\"\
    \ page 161 for a more complete discussion of how to use XML for publishing.\n\n\
    # Business Document Exchange\n\nXML is not limited to publishing. It has been\
    \ used successfully with business and commercial documents. In this case, the\
    \ elements would be price, product names, and so on. Listing 2.7: An Order in\
    \ XML\n\nListing 2.7: An Order in XML\n\n```\n<?xml version=\"1.0\" encoding=\"\
