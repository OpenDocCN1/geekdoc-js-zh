  md: '# What''s Next


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_206_0.png)


    Figure 6.13: An XSLFO style sheet in a browser


    An XSLFO style sheet is a list of XSL templates. The templates create for-formatting
    objects in the resulting tree. These formatting objects are equivalent to CSS''
    flow objects.


    In Listing 6.6, you will recognize formatting objects for block boxes (for example,
    fo:block) and inline boxes (for example, fo:inline-link). The object properties
    are word for word taken from the CSS specification.


    XSLFO also includes formatting objects specifically designed for XML; for example,
    fo:inline-link creates a hyperlink. It has no equivalent in CSS.


    This section is a very brief look at XSLFO because, at the time of this writing,
    XSLFO has not achieved significant market acceptance. The concepts, however, are
    very close to CSS.


    # What''s Next


    Now that you know how to create and view XML documents, the next three chapters
    will take you one step further and teach you how to manipulate and create XML
    documents from a scripting or programming language.'
