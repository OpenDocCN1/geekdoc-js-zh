  md: '# Maintaining the State


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_278_0.png)


    **Figure 8.7:** The architecture for the application SAX2Internal needs to know
    where it is in


    When processing these events, SAX2Internal needs to know where it is in the document
    tree. When handling a character event, for example, it needs to know whether the
    text is attached to a name or to a price element. It also needs to know whether
    the name is the product name or the vendor name.


    # States


    A SAX parser, unlike DOM parser, does not provide context information. Therefore,
    the application has to track its location within the document.


    First, you have to identify all possible states and determine how to transition
    from one state to the next. It''s easy to derive states from the document structure
    in Figure 8.6.


    It is obvious that the application will first encounter a product tag. The first
    state should therefore be “within a product element.” From there, the application
    will reach a product name. The second state is therefore “within a name element
    in the product element.”


    The next element has to be a vendor, so the third state is “within a vendor element
    in the product element.” The fourth state is “within a name element in a vendor
    element in a product element” because a name follows the vendor.


    The name is followed by a price element and the corresponding state is “within
    a price element in a vendor element in a product element.”


    Afterward, the parser will encounter either a price element or another vendor
    element. You already have these for two cases.


    It''s easier to visualize this concept on a graph with state and state transitions,
    such as the one shown in Figure 8.8. Note that there are two different states
    related to two different name elements depending on whether you are dealing with
    the product/name or product/vendor/name.'
