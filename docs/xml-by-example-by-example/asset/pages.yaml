  md: '# Creating the DTD from Scratch


    Listing 3.18 is the same information as text. The structure is lost and, unfortunately,
    it will be difficult to restore the structure automatically. The software would
    have to be quite intelligent to go through Listing 3.18 and retrieve the entry
    boundaries as well as break the address in its components.


    Listing 3.18: The Address Book in Plain Text


    John Doe


    34 Fountain Square Plaza


    Cincinnati, OH 45202


    US


    513-555-8889 (preferred)


    513-555-7098


    jdoe@emailaholic.com


    Jack Smith


    513-555-3465


    jsmith@emailaholic.com


    However, as you design your structure, be careful that it remains usable. Structures
    that are too complex or too strict will actually lower the quality of your document
    because it encourages users to cheat.


    Consider how many electronic commerce Web visit a region, province, county, or
    state in the buyer address. Many countries don''t have the notion of region, province,
    county, or state, or at least, don''t use it for their addresses.


    Forcing people to enter information they don''t have is asking to cheat. Keep
    in mind the number one rule of modeling: Changes will come from the unexpected.
    Chances are that, if your application is successful, people will want to include
    data you had never considered. How often did I include for "future extensions"
    that were never used? Users come and asked for totally unexpected extensions.


    There is no silver bullet in modeling. There is no foolproof solution to strike
    the right balance between extensibility, flexibility, and usability. As you grow
    more experienced with XML and DTDs, you will also improve your modeling skills.


    My solution is to define a DTD that is large enough for all the content required
    by my application but not larger. Still, I leave hooks in the DTD—places where
    it would be easy to add a new element, required.'
