  md: '# Generic Coding


    Markup evolved into generic coding with the introduction of macros. Macros replace
    the controls with external formatting procedures. A generic identifier (GI) or
    tag is attached to each text element and formatting rules are further associated
    with tags. A formatter processes the text and produces a document in the format
    of the output device.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_34_0.png)


    TeX is a good example of generic coding. Listing 1.3 is the memo in TeX.


    Listing 1.3: The Memo in TeX


    % memo.tex

    \nopagenumbers


    ```

    \nindent John Doe\par

    \indent Jack Smith\par

    \indent XML at WhizBang\par

    \smallskip

    ```


    You have heard of this new technology, XML? It looks promising. It is similar
    to HTML but it is extensible. All the big names (Microsoft, IBM, Oracle) are backing
    it.\par

    We could use XML to simplify our e-commerce and launch new services. It is also
    useful for the web site: you complained it was a lot of effort, apparently, XML
    can simplify the maintenance. Check this web site ({url http://www.w3.org/XML})
    for more information.


    Also visit Que ({url http://www.mcp.com}).\par


    They have just released "XML by Example" with lots of useful information and some
    great examples. I have already ordered two copies!\par


    John\par

    bye


    The benefits of generic coding over procedural markup are twofold:


    +   - It achieves higher portability and is more flexible. To change the appearance
    of the document it suffices to adapt the macro. By editing one macro, the change
    is automatically reported throughout the document. In particular, it does not
    require reencoding the markup, which is a time-consuming and error-prone activity.

    - The markup is closer to describing the structure.'
