  md: "# A First Look at the XML Syntax\n\nIf I had to summarize XML in one sentence,\
    \ it would be something like “a set of standards to exchange and publish information\
    \ in a structured manner.” The emphasis on structure cannot be underestimated.\n\
    \nXML is a language used to describe and manipulate structured documents. XML\
    \ documents are not limited to books and articles, or over Web sites, and can\
    \ include objects in a client/server application.\n\nHowever, XML offers the same\
    \ tree-like structure across all these applications. XML does not dictate or enforce\
    \ the specifics of this structure—it does not dictate how populate the tree.\n\
    \nXML is a flexible mechanism that accommodates the structure of specific applications.\
    \ It provides a mechanism to encode both the information manipulated by the application\
    \ and its underlying structure.\n\nXML also offers several mechanisms to manipulate\
    \ the information—that is, to view it, to access it from an application, and so\
    \ on. Manipulating documents is done through the structure. So we are back where\
    \ we started: The structure is the key.\n\n# Getting Started with XML Markup\n\
    \nListing 2.1 is a (small) address book in XML. It has only two entries: John\
    \ Doe and Jack Smith. Study because we will use throughout most of this chapter\
    \ and the next.\n\nListing 2.1: An Address Book in XML\n\n```\n<<?xml version=\"\
    1.0\"?>\n<!-- loosely inspired by vCard -->\n<book>\n  <name>John Doe</name>\n\
    \  <address>\n    <street>34 Fountain Square Plaza</street>\n    <region>OH</region>\n\
    \    <postal-code>45202</postal-code>\n    <locality>Cincinnati</locality>\n \
    \   <country>US</country>\n  </address>\n  <tel preferred=\"true\">513-555-8889</tel>\n\
    \  <tel>513-555-7098</tel>\n  <email href=\"mailto:jdoe@emailaholic.com\"/>\n\
    ```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_59_0.png)"
