  md: "# Chapter 3: XML Schemas\n\nValid documents are stricter. They not only follow\
    \ the syntax rules, they also comply with a specific structure, as described in\
    \ a DTD.\n\nValid documents have a DTD. The XML processor will check that the\
    \ documents are syntactically correct but it also ensures they follow the structure\
    \ described in the DTD.\n\nWhy two classes of documents? Why not have only valid\
    \ documents? In practice, some applications don't need a DTD. Also, among applications\
    \ that do, they need the DTD only at specific steps in the process.\n\nThe DTD\
    \ is useful during document creation, when it makes sense to enforce the document\
    \ structure. However, it is less useful after the creation. For example, in most\
    \ cases, it is useless to utilize the DTD with the document. Indeed, a reader\
    \ cannot fix errors in the structure of a document (that's the role of the author\
    \ and editor), so what is to do with the DTD?\n\n# Relationship Between the DTD\
    \ and the Document.\n\nUnless it is overlooked, let me stress the relationship\
    \ between the DTD and the XML document. The role of the DTD is to specify which\
    \ elements are allowed in the document.\n\nThe documents in Listings 3.6 and 3.7\
    \ are valid and respect the DTD in Listing 3.5. The document in Listing 3.6 has\
    \ a region element, whereas the one in Listing 3.7 has none. It works because\
    \ region is a conditional element.\n\nListing 3.5: The DTD\n\n```\n<ELEMENT address\
    \ (street,region?,postal-code,locality,country)>\n<!ATTLIST address preferred\
    \ (true | false) \"false\">\n\n<ELEMENT street (#PCDATA)>\n<ELEMENT region (#PCDATA)>\n\
    <ELEMENT postal-code (#PCDATA)>\n<ELEMENT locality (#PCDATA)>\n<ELEMENT country\
    \ (#PCDATA)>\n```\n\nListing 3.6: A Valid Document\n\n```\n<?xml version=\"1.0\"\
    ?>\n<!DOCTYPE address SYSTEM \"address.dtd\">\n<address>\n  <street>34 Fountain\
    \ Plaza</street>\n  <region>OH</region>\n```\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_99_0.png)"
