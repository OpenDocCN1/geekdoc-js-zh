- img_proc: true
  md: '# 102 Chapter 3: XML Schemas


    In the process, I picked the name "region" for the state element. For some reason,
    I find region more appealing.


    Comparing my model with vCard gave me the confidence that the simple address book
    can cope with most addresses used. Figure 3.10 is the result.


    TIP

    There is a group working on the XML-ization of the vCard standard. Its approach
    is different: it uses vCard as its model, whereas this example starts from an
    older document and uses vCard as a check.


    It is interesting to compare the XML version of vCard (available from www.imc.org/ietf-vcard-xml)
    with the DTD in this chapter. It proves that there is more than one way to skin
    a cat.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_119_0.png)


    Figure 3.10: The final tree


    Again converting the tree in a DTD is trivial. Listing 3.21 shows the result.


    **Listing 3.21**: A DTD for the Address Book


    ```

    <!ENTITY boolean "(true | false) ''false''>


    <!-- top-level element, the address book

    is a list of entries -->

    <ELEMENT address-book (entry+)>


    <!-- an entry is a name followed by

    addresses, phone numbers, etc. -->

    <ELEMENT entry (name,address*,tel*,fax*,email*)>


    <!-- name is made of string, first name

    and last name. This is a very flexible

    model to accommodate exotic name -->

    <ELEMENT name (#PCDATA | fname* | lname*)>

    <ELEMENT fname (#PCDATA)>

    ```'
