    # Managing Documents with Entities


    External entities are helpful to modularize and help manage large DTDs and large
    document sets.


    The idea is very simple: Try to divide your work into smaller pieces that are
    more manageable. Save each piece in a separate file and include them in your document
    with external entities.


    Also to identify pieces that you can reuse across several applications. It might
    be a list of entities (such as the list of countries) or a list of notations,
    or some text (such as a copyright notice that must appear on every document).
    Place them in separate files and include them in your documents through external
    entities.


    Figure 3.3 shows how it works. Notice that some files are shared across several
    documents.


    | Country List | Common Notations | Copyright Notice |

    |---|---|---|

    | address-book DTD | magazine DTD | bank DTD |

    | address-book document | magazine documents | bank documents |


    Figure 3.3: Using external entities to manage large projects


    This is like eating a tough steak: You have to cut the meat into smaller pieces
    until you can chew it.'
