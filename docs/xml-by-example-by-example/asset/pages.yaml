    # XML Software


    As explained in the previous section, XML popularity means that many vendors are
    supporting it. This, in turn, means that applications are available to manipulate
    XML documents.


    This section lists some of the most commonly used XML applications. Again, this
    is not a complete list. We will discuss these products in the following chapters.


    # XML Browser


    An XML browser is the first application you would think of because it is close
    to the familiar HTML browser. An XML browser is used to view and print XML documents.
    At the time of this writing, there are not many high-quality XML browsers.


    Microsoft Internet Explorer has supported XML since version 4.0. Internet Explorer
    5.0 has greatly enhanced the XML support. Unfortunately, the support is based
    on early versions of the style sheet standards and is not complete. Yet Internet
    Explorer 5.0 is the closest thing to a largely deployed XML browser today.'
