    # Entities


    The document in Listing 2.1 (page 42) is self-contained: The document is complete
    and it can be stored in just one file. Complex documents are often split over
    several files: the text, the accompanying graphics, and so on.


    XML, however, does not reason in terms of files. Instead it organizes physically
    in *entities*. In some cases, entities are equivalent to files; in others, they
    are not.


    XML entities are a complex topic that we will revisit in the next chapter, when
    we will see how to declare entities in the DTD. In this chapter, we will see how
    to use entities.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_69_0.png)


    Entities are inserted in the document through *entity references* (the name of
    the entity between an ampersand character and a semicolon). For the application,
    the entity reference is replaced by the content of the entity. If we have defined
    an entity “us,” which has the value “United States,” the following two lines are
    equivalent:


    ```

    <country&gt;</country>

    <country>United States&lt;</country>

    ```


    XML defines entities for the characters used in markup (angle brackets, quotes,
    and so). The entities are used to escape the characters from elements or attribute
    content.


    +   &lt; left angle bracket “<” must be escaped with &lt;

    &amp; ampersand “&” must be escaped with &amp;

    &gt; right angle bracket “>” must be escaped with &gt; in the CDATA sections (see
    the following)

    &apos; single quote “‘” can be escaped with &apos; essentially in parameter value

    &quot; double quote “*” can be escaped with &quot; essentially in parameter value


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_69_1.png)


    The following is not valid because the ampersand would confuse the XML processor:


    ```

    <company>Mark & Spencer&lt;/company>

    ```


    Instead, it must be rewritten to escape the ampersand bracket with &amp;; entity:'
