  md: "# Interfaces and Multiple Inheritance\n\nYou have seen that Java supports only\
    \ single inheritance: A class cannot have more than one ancestor. Multiple inheritance\
    \ in Java is based on interfaces.\n\nAn interface is the skeleton of a class;\
    \ it declares the methods that a class must support but it does not provide the\
    \ implementation. Implementation of the methods must be provided in a class.\n\
    \n+   1. Many Java APIs are defined in terms of interfaces. Listing A.5 is one\n\
    Listing A.5: SAX interface\npackage org.xml.sax;\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_496_0.png)\n\
