  md: '# Chapter 6: XSL Formatting Objects and Cascading Style Sheet


    # Text and Font Properties


    After boxes, text and font properties are the most widely used properties.


    # Font Name


    The font-family property selects the name of the font. It is a good idea to list
    several font names in case the preferred font is not available to the browser.
    The following example attempts to select a serif font. The list goes from more
    specific font (Palatino) to more common ones (Times New Roman). The list ends
    with a generic family name for maximal safety:


    font-family: Palatino, Garamond, ''Times New Roman'', serif;


    Generic names (serif, sans-serif, cursive, fantasy, and monospace) select a typical
    font for the family.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_193_0.png)


    > Figure 6.6: Font samples on my machine


    # Font Size


    As the name implies, the font-size property selects the size of characters. The
    font-size value can be a length or xx-small, x-small, small, medium, x-large,
    and xx-large. Finally, it is possible to use values relative to the inherited
    size: larger and smaller.


    The medium size font is around 10pt so the following two examples be identical:


    font-size: medium;


    font-size: 10pt;'
