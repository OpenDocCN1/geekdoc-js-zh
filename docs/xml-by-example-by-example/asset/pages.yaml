- img_proc: true
  md: '# Chapter 4: Namespaces


    # Registering a Domain Name


    If you are serious about XML development and you currently don''t have a domain
    name, you might want to register one so you can identify your elements.


    Indeed, because the URI identifies you as the owner of the namespace, you cannot
    use somebody else''s domain unless they have agreed to it. It would not be appropriate,
    therefore, to use


    ```

    http://www.mcp.com/addressbooks/1.0

    ```


    as a URI (unless, of course, you work for Macmillan). Domain names are not really
    expensive so I would advise you to take one.


    The cost varies depending on the TLD. At the time of writing, a "com" domain costs
    $35 per year. Your ISP can register a domain name for you. For a monthly fee (in
    addition to the $35 per year), it will host the domain (provide a Web page).


    If you just want to reserve the name for XML namespaces don''t need a Web page,
    you can turn to domain parking. The name is yours but you don''t hold it. Some
    ISPs offer domain parking for a nominal fee. You also turn to Register.com (www.register.com),
    WorldNIC (www.worldnic.com), or MyDomain (www.mydomain.com).


    After you register a domain name, it''s yours. Just make sure you are listed as
    the administrative contact and that you are paying the yearly fee. You are free
    to move to another ISP of your choice and still retain your domain.


    Some people (not surprisingly those who charge for registration) would want you
    to register in all possible TLDs. I doubt it''s a good idea for at least two reasons:


    +   - It defeats the purpose of having multiple TLDs. More TLDs give more people
    a chance to find a sensible name.


    +   - There are already more than 250 TLDs in operation and more TLDs will be
    added in the future. Unless you have very big pockets, it''s a lost game.


    TIP If you register a domain name specifically for namespaces, opt for a short
    name such as an abbreviation. Over time, it will save you lot of typing!


    For example, in addition to applesoft.com, applesoft also uses the domain psol.com
    (short for Applesoft Object Library—it was originally registered for Java libraries).'
