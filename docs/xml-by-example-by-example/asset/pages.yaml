  md: 'But in the following case, it sees the content of name as just fname and lname.
    No indenting.

    <name><fname>Jack</fname>Smith</lname></name>


    It is easy to find untapered whitespaces and most applications do it. For example,
    XSL (XML Style Sheet Language) ignores what it recognizes as indenting.


    Likewise, some XML editors give you the option of indenting source code automatically.
    If they indent code, they will ignore indenting in the document.


    If whitespaces are important for your document, then you should use the xml:space
    attribute that was introduced earlier.


    # Why the End Tag?


    At first, the need to terminate each element with an end tag is annoying. It is
    required because XML does not have predefined elements.


    An HTML browser can work out when an element has no closing tags because it knows
    the structure of the document, it knows which elements are allowed where, and
    it can deduce where each element should end.


    Indeed, if the following is an HTML fragment, a browser does not need end tags
    for paragraphs, nor does it need an empty tag for the break (see Listing 2.4):


    Listing 2.4: An HTML Document Needs End Tags


    ```

    <B>John Doe</B>

    <P>34 Fountain Square Plaza<BR>

    Cincinnati, OH 45202<BR>

    US

    <P>Tel: 513-555-8889

    <P>Tel: 513-555-7098

    <P>Email: jdoe@emailaholic.com

    ```


    The browser can deduce where the paragraphs end because it knows that paragraphs
    cannot nest. Therefore, the beginning of a new paragraph must coincide with the
    one of the previous one. Likewise, the browser knows that the break is an empty
    element. Because of all this a priori knowledge, the browser can "fill in the
    blank" and know the document must be interpreted


    ```

    <P>John Doe</B></P>

    <P>34 Fountain Square Plaza<BR>

    Cincinnati, OH 45202<BR></BR>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_73_0.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_73_1.png)'
