    # # WYSIWYG Editors


    WYSIWYG editors are geared towards end-users. They aim at making XML completely
    transparent and they should be as easy to use as a word processor.


    However, tools in this category require customization. If you buy a tool in this
    category, you should be thinking in terms of a toolkit that has to be customized
    to your specific DTDs. Customization requires several steps:


    +   - Prepare a DTD; with some editors it is necessary to compile the DTD before
    using it.

    - Associate a style sheet with the DTD so the editor can render document onscreen
    in WYSIWYG mode.

    - Make editors-specific customization such as create DTD-specific tools-bars,
    and so on.


    Some editors use their own style sheet language but the trend is toward using
    CSS. It means the same style sheet used to edit the document can be used to view
    it.


    Figure 6.10 shows MetaL, a pseudo-WYSIWYG editor. As you can see, it looks (and
    feels) like a word processor customized for a DTD.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_201_1.png)'
