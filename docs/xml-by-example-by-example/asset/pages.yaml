  md: '# NOTE


    If needed, the application can build a DOM tree from the events it receives from
    the parser. In fact, several object-based parsers are built around an event-based
    parser. Internally, they use an event-based parser and they create objects in
    response to the events the parser generates.


    # Why Use Event-Based Interfaces?


    Which type of interface do you use? An object-based or an event-based interface?
    Unfortunately, there is no clean-cut answer to this question. Neither of the two
    interfaces is intrinsically better; they serve different needs.


    The main reason people prefer event-based interfaces is efficiency. Event-based
    interfaces are lower level than object-based interfaces. On the positive side,
    they give you more control over parsing and enable you to optimize your application.
    On the downside, it means more work for you.


    As already discussed, an event-based interface consumes fewer resources than an
    object-based one, simply because it does not need to build the document tree.


    Furthermore, with an event-based interface, the application can start processing
    the document as the parser is reading. With an object-based interface, the application
    must wait until the document has been completely read.


    Therefore, event-based interfaces are particularly popular with applications that
    process large files (which would take a lot of time to read and create a document
    tree) and for servers (which process many documents simultaneously).


    The major limitation of event-based interfaces is that it is not possible to navigate
    through the document as you can with a DOM tree. Indeed, after firing an event,
    the parser forgets about it. As you will see, the application must explicitly
    buffer the events it is interested in. It might also have more work in managing
    the state.


    Of course, whether it uses an event-based or an object-based interface, the parser
    does a lot of useful work: It reads the document, enforces the XML syntax, and
    resolves entities. When using a validating parser, it might validate the document
    against its DTD. So, there are many reasons to use a parser.'
