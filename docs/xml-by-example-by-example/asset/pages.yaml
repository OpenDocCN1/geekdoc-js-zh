  md: '+   - Somebody else can write and maintain the style sheet while you concentrate
    on the application; this is a simple solution for separating work in a team.


    +   - After the system is in place, it''s easy to provide 5, 10, or 100 style
    sheets.


    +   - Conversely, you can deploy the application with only those few style sheets
    the users really need. Therefore, the application loads faster.


    **NOTE**nWork is underway to automate the development of the XSLT style sheet.
