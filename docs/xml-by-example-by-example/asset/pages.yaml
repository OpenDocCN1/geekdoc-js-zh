  md: '# Signature


    The current generation of browsers do not support XLink, if only because the standard
    is not final yet. However, to render an extended link, the browser will need to
    offer a menu when the user clicks on the link.


    Because Internet Explorer does not recognize XLink, Figures 10.5 and 10.6 simulate
    this through an XSLT style. The style sheet inserts JavaScript code that opens
    a new window when the user clicks the link.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_344_0.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_344_1.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_344_2.png)


    Figure 10.5: The extended link before the user clicks


    Figure 10.6: The extended link after the user has clicked


    # XLink and Browsers


    XLink support will probably be added to browsers when the standard is complete.
    At that time, the browsers will be able to view and render the links automatically.


    This feature is very similar to the price list example: A minimalist core is agreed
    upon (essentially, how to specify a link), just enough for the software (the browser)
    to process the document. This minimalist amount of standardization does not prevent
    the creation of elements. Indeed, most documents will include many elements in
    addition to the links.


    In the example of the price list, the BestDeal application picks the elements
    it needs for comparison, like a browser singles out links in a document. However,
    the document contains many other elements that are ignored by the application.


    # Signature


    Expect more standards similar to XLink where the W3C defines elements and attributes
    for commonly used features. Over time, the W3C (and other groups) will build a
    toolbox of elements that you can use in your documents.


    327'
