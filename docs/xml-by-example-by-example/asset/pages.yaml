  md: "# Basic XSLT 137\n\n| XSL Function | Description |\n|---|---|\n| last() | returns\
    \ the position of the last node in the current node set |\n| count() | returns\
    \ the number of nodes in the current node set |\n| not() | negates the argument\
    \ |\n| contains() | returns true if the first argument contains the second argument\
    \ |\n| starts-with() | returns true if the first argument starts with the second\
    \ argument |\n\nNew functions are declared in JavaScript, Java, C++, and so on,\
    \ with xsl:functions element.\n\n```\n<xsl:template match=\"/>\n  <xsl:value select=\"\
    psol:today()\"/>\n</xsl:template>\n```\n\n```\n<xsl:functions ns=\"psol\" type=\"\
    text/javascript\"\nfunction today() {\n  return Date().toString();\n}\n</xsl:functions>\n\
    ```\n\n> CAUTION\nBe aware that element was still very much in flux in the draft\
    \ we used to prepare this chapter.\n\n# Deeper in the Tree\n\nAfter loading the\
    \ style sheet, the XSL processor loads the source document. Next, it walks through\
    \ the source document from root to leaf nodes. At each step it attempts to match\
    \ the current node against a template.\nIf there is a match, the processor generates\
    \ the nodes in the resulting tree. When it encounters xsl:apply-templates, it\
    \ moves to the children of the current node and repeats the process; that is,\
    \ it attempts to match them against a template.\nIn other words, xsl:apply-templates\
    \ is a recursive call to the style sheet. A recursive approach is natural to manipulate\
    \ trees. You might have recognized a deep-first search algorithm. Figure 5.6 illustrates\
    \ how it works."
