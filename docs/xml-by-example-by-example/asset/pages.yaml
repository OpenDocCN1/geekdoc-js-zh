  md: '# What''s Next


    The code is familiar; for the most part it''s copied verbatim from Listing 7.3.

    Note, however, that it does not explicitly parse the document (there is no parse()
    function). Instead, the content of the XML frame is accessed directly through
    the DOM interface.


    ```

    <INPUT TYPE="convert(controls,parent.xml.document)"

    ONCLICK="Convert"

    VALUE="Convert"

    ```


    # Editors


    XML editors also use DOM. For example, XMetal from SoftQuad exposes the current
    document through DOM.


    For example, macros can access the document to create tables of contents, indexEXEs,
    and so on. Using macros and DOM, you can customize the editor to suit your needs.


    # Databases


    An XML database stores XML documents in binary format. It is therefore faster
    to load and manipulate documents.


    The database exposes its documents to applications using DOM. The application
    does not even know it is working against a database. Through DOM, it makes no
    difference whether the document is in a database or in an XML file.


    If you would like to experiment with this feature, you can download the GMD-PSI
    PDOM engine from xml.darmstadt.gmd.de/xml. The engine implements Persistent DOM
    (PDOM), which is an interface that stores XML documents in binary format. The
    interface to access the binary document is familiar DOM, which means that any
    application that works with XML files can be upgraded to binary files with little
    or no work.


    # What''s Next


    This chapter looked at an object-based interface for XML parsers. In the next
    chapter, you will look at an event-based interface: SAX. It is interesting to
    compare SAX and DOM.'
