- img_proc: true
  md: '# What''s Next


    For one thing, content is limited to textual content. Also, it is difficult to
    put in repetition constraints: You cannot say that an element can appear only
    four times. It''s 0, 1, or infinite.


    Furthermore, the DTD is based on a special syntax that is different from the syntax
    for XML documents. It means that it is not possible to use XML tools, as as editors
    or browsers, to process DTD!


    These so-called limitations of the DTD are inherited directly from SGML. XML was
    originally designed as a subset of SGML and therefore it could not differ too
    much from the SGML DTD.


    However, as XML takes a life of its own, people would like a new, more modern,
    replacement for the DTD. Various groups have made several proposals. Collectively,
    these proposals are known as schemas. The details of the proposals vary greatly
    but all:


    +   - propose to use the same syntax as XML documents

    - improve XML data typing to support not only strings but also numbers, dates,
    and so on

    - introduce object-oriented concepts such as inheritance (an element could inherit
    from another)


    The W3C has formed a working group to develop a new standard based on the existing
    proposals. At the time of writing, the effort has just started and little is known
    about the final result.


    You can find up-to-date information on new XML schemas on the W3C Web site at
    www.w3.org/XML.


    The main proposals being considered


    +   - XML-Data, which offers types inspired from SQL types.

    - DCD (Document Content Description), positioned as a simplified version of XML-Data.

    - SOX (Schema for Object-oriented XML), as the name implies, has on object-orientation
    aspects.

    - DDML (Document Definition Markup Language), developed by the XML-Dev mailing
    list. It is intended as a simple solution to form a basis for future work.


    # What''s Next


    The next chapter is dedicated to the namespace proposal. Namespace is an often-overlooked
    but very useful standard that greatly enhances XML extensibility.'
