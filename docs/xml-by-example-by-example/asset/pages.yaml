    # A Layered Architecture


    Listing 8.4 is the most complex application you have seen so far. It''s logical:
    The SAX parser is very low level so the application has to take over a lot of
    the work.


    The application is organized around two classes: SAX2Internal and ComparisonMachine.
    SAX2Internal manages the interface with the SAX parser. It manages the state and
    groups several elements in a coherent way. For that purpose, it uses the LeafElement
    class as temporary storage.


    ComparisonMachine has the logic to perform price comparison. It also maintains
    information in a structure that is optimized for the application, not XML. The
    architecture for this application is illustrated in Figure 8.7.


    SAX2Internal handles several events from DocumentHandler. It registers the startElement,
    endElement, and character events.'
