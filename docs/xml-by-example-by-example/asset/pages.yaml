- img_proc: true
  md: 'After the opening tag, the parser sees the content of the name element: XML
    Training. It generates an event by passing the application as content as a parameter.


    The next event indicates the closing tag for the name element. The parser has
    completely parsed the name element. It has fired five events so far: three events
    for the name element, one event for the declaration, and one for product opening
    tag.


    The parser now moves to the first price element. It generates two events for each
    price element: one event for the opening tag and one event for the closing tag.


    Even though the closing tag is reduced to the / character in the opening tag,
    the parser generates an event for it. The parser passes the element''s parameters
    to the application in the event for the opening tag.


    There are four price elements, so the parser generates eight events as it parses
    them. Finally, the parser meets product''s closing tag and it generates its last
    event.


    As Figure 8.5 illustrates, taken together, the events describe the document tree
    to the application. An opening tag event means “going one level down in the tree”,
    whereas a closing tag element means “going one level up in the tree.”


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_252_0.png)


    Figure 8.5: How the parser builds the tree implicitly


    An event-based interface is the most natural interface for a parser. Indeed, the
    parser simply has to report what it sees.


    Note that the parser passes enough information to build the document tree of the
    XML documents but, unlike an object-based parser, it does not explicitly build
    the tree.'
