  md: "# The DTD Syntax\n\nThe syntax for DTDs is different from the syntax for XML\
    \ documents. Listing 3.1 is the address book introduced in Chapter 2 but with\
    \ one difference: It has a new <DOCTYPE> statement. The new statement is introduced\
    \ in the section \"Document Type Declaration.\" For now, it suffices to say that\
    \ it links the document file to the DTD file. Listing 3.2 is its DTD.\n\nListing\
    \ 3.1: An Address Book in XML\n\n```\n<?xml version=\"1.0\"?>\n<!DOCTYPE address-book\
    \ SYSTEM \"address-book.dtd\">\n<!-- loosely inpired inspired by vCard 3.0 -->\n\
    <address-book>\n  <entry>\n    <name>John Doe</name>\n    <address>\n      <street>34\
    \ Fountain Square Plaza</street>\n      <region>OK</region>\n      <postal-code>45202</postal-code>\n\
    \      <locality>Cincinnati</locality>\n      <country>US</country>\n    </address>\n\
    \    <tel preferred=\"true\">513-555-8889</tel>\n    <tel>513-555-7098</tel>\n\
    \    <email href=\"mailto:jdoe@emailaholic.com\"/>\n  </entry>\n  <entry>\n  \
    \  <fname>Jack</fname><lname>Smith</lname>\n    <tel>513-555-3465</tel>\n    <email\
    \ href=\"mailto:jsmith@emailaholic.com\"/>\n  </entry>\n</address-book>\n```\n\
    \nListing 3.2: The DTD for the Address Book\n\n```\n<!-- top-level element, the\
    \ address book\n  is a list of entries -->\n<!ELEMENT address-book (entry+)>\n\
    \n<!-- an entry is a name followed by\n  addresses, phone numbers, etc. -->\n\
    ```"
