    # Lessons Learned


    Listing 8.4 is typical for a SAX application. The SAX event handler packages the
    data in the format most appropriate for the application. It might have to build
    a partial tree (in this case, using LeafElement) in the process.


    The application logic (in ComparisonMachine) is totally unaware of XML. As far
    as it is concerned, the data could be coming from a database or a comma-delimited
    file.


    Because of this clean-cut separation between the application logic and the parsing,
    it is a good idea to adopt a layered approach and use a separate class for the
    event handler.


    The example also clearly illustrates that SAX is more efficient than DOM but it
    requires more work from the programmer. With a SAX parser, the programmer has
    to explicitly manage states and transitions between states.


    With DOM, the state was implicit in the recursive walk of the tree.


    # Flexibility


    XML is a very flexible standard. However, in practice, XML applications are only
    as flexible as you, the programmer, make them. In this section, we will look at
    some tips to ensure your applications exploit XML flexibility.


    # Build for Flexibility


    This application puts very few constraints on the structure of the underlying
    document. It simply ignores new elements. For example, it would accept the following
    vendor element:


    ```

    <vendor>

    <name>Playfield Training</name>

    <contact>John Doe</contact>

    ```


