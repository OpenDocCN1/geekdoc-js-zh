  md: '# Chapter 2: The XML Syntax


    For software, however, it''s exactly the opposite. Software needs to be told which
    is what. It needs to be told what the name is, what the address is, and so on.
    That''s what the markup is all about; it breaks the text into its constituents
    so software can process it.


    Software does have one major advantage—speed. While it would take you a long time
    to search through a long list of thousand addresses, software will plunge through
    the same list in less than a minute.


    However, before it can start, it needs to have the information in a predested
    format. This chapter and the following two chapters will concentrate on XML as
    a predigested format.


    The reward comes in Chapter 5, "XSL Transformation," and subsequent chapters where
    we will see how to tell the computer to do something useful with these documents.


    # Element''s Start and End Tags


    The building block of XML is the *element*, as that''s what comprises XML documents.
    Each element has a name and a content.


    ```

    <tel513-555-7098</tel>

    ```


    The content of an element is delimited by special markups known as *start tag*
    and *end tag*. The tagging mechanism is similar to HTML, which is logical because
    both HTML and XML inherited their tagging from SGML.


    The start tag is the name of the element (tel in the example) in angle brackets;
    the end tag adds an extra slash character before the name.


    Unlike HTML, both start and end tags are required. The following is not correct
    in XML:


    ```

    <tel513-555-7098>

    ```


    It can''t be stressed that XML does not define elements. Nowhere in the XML recommendation
    will you find the address book of Listing 2.1 or the tel element. XML is an enabling
    standard that provides a common syntax to store information according to a structure.


    In this respect, I liken XML to SQL. SQL is the language you use to program relational
    databases as Oracle, SQL Server, or DB2. SQL provides a common language to create
    and manage relational databases.


    However, SQL does not specify what you should store in this database or which
    tags you should use.


    Still, the availability of a common language has led to the development of a lively
    industry. SQL vendors provide databases, modeling and development tools, magazines,
    seminars, conferences, training, books, and more.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_61_0.png)'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# A First Look at the XML Syntax


    Admittedly, the XML industry is not as large as the SQL industry, but it''s catching
    up fast. By moving your data to XML rather than an esoteric syn-tax, you can tap
    the growing XML industry for support.


    # Names in XML


    Element names must follow certain rules. As we will see, there are other names
    in XML that follow the same rules.


    Names in XML must start with a letter or the underscore character (“_”). The rest
    of the name consists of letters, digits, the underscore charac-ter, the dot (“.”),
    and a hyphen (“-”). Spaces are not allowed in names.


    Finally, names cannot start with the string “xml”, which is reserved for the XML
    specification itself.


    > NOTE

    There is one character you can use in names—the colon (:). However, the colon
    is reserved for namespaces; therefore, it will be introduced in Chapter 4, “Namespaces.”


    The following are examples of valid element names in XML:

    <copyright-information>

    <base64>

    <décompte.client>

    <firstname>


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_62_0.png)


    The following are examples of invalid element names. You could not use these names
    in XML:

    <123>

    <first name>

    <tom&jerry>


    Unlike HTML, names are case sensitive in XML. So, the following names are all
    different:

    <address>

    <ADDRESS>

    <Address>


    By convention, HTML elements in XML are always in uppercase. (And, yes, it is
    possible to include HTML elements in XML documents. In Chapter 5, you will see
    when it is useful.)


    By convention, XML elements are frequently written in lowercase. When a name consists
    of several words, the words are usually separated by a hyphen, as in address-book.'
