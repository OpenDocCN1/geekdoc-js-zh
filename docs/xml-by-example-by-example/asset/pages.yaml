  md: "# Chapter 6: XSL Formatting Objects and Cascading Style Sheet\n\nListing 6.2:\
    \ continued\n\nStyle sheets are separated from documents. Therefore one document\
    \ can have more than one style sheet and, conversely, one style sheet can be shared\
