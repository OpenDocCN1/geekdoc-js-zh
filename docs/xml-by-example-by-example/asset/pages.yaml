  md: '# Servlets


    The first Web servers were simply file servers. As illustrated in Figure A.4,
    a browser would request a file from the server and the server would return it.
    The browser would render the file onscreen. If the file included hyper-links,
    the user could point and click to request more files.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_489_0.png)


    #### Figure A.4: Serving files


    Most Web sites are still being developed according to this model, which has the
    advantage of simplicity.


    The major limitation to this model, however, is that these Web sites are static.
    For the user, interaction is limited to following hyperlinks. A user can not query
    a Web site and receive an answer based on that query.


    Also, the information must be made available in HTML files. This is not appropriate
    for information that changes rapidly. For example, stock quotes change several
    times a day and it is not practical to continuously update the files.


    Instead, it makes sense to dynamically create an HTML page in response to user
    requests. The data in the page can come from a querying database or from an XML
    document.


    As illustrated in Figure A.5, an application is required to generate the page
    based on the user''s request.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_489_1.png)


    #### Figure A.5: Serving applications'
  merge: -1
  pgno: 489
