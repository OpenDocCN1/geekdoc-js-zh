  md: "# Using XSLT to Extract Information\n\n155\n\nxsl:for-each has an attribute\
    \ so it needs a fully qualified path.\nHowever, within the loop, the current element\
    \ is the selection that\nxsl:value-id retrieves through the “ ” path.\n\nThe template\
    \ also introduces the generate-id() function. The function\nreturns a unique identifier\
    \ for the current node.\n\n# Using XSLT to Extract Information\n\nAs the various\
    \ examples in this chapter illustrate, XSLT is a very powerful\nand flexible mechanism\
    \ that serves many purposes.\n\nIndeed XSLT is not limited to styling. It also\
    \ can be used to extract in-\nfrom XML documents.\n\nImagine I not to generate\
    \ an index of articles. The XSLT solution is a two-\nstep process. In the first\
    \ step, a style sheet extracts useful information from\nthe documents. Extracting\
    \ information can be thought of as transforming a\nlarge XML document into a smaller\
    \ one.\n\nThe first step creates many extract documents as there are originals.\n\
    The next step is to merge all the extracts in one listing. It is then a simple\n\
    issue to convert the listing in HTML. Figure 5.11 illustrates the process.\n\n\
    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_172_0.png)\n\nFigure 5.11: How using\
    \ XSL can extract information from XML documents\n\n# A NEW STANDARD\n\nThe W3C\
    \ works on a new standard XQL, the XML Query Language, that will offer a\better\
    \ solution to this problem. XQL can query multiple documents stored in an XML\n\
    database.\n\nXQL will use paths similar or identical to XSLT so it will be familiar.\
    \ Because it works\nacross several documents, XQL is really designed for XML databases.\
    \ XML databases\nstore documents in binary format to provide faster access.\n\n\
    To experiment with XQL without being a database, you can download the GMD-IPSX\
    \ XQL\nengine from gmdstadt.gmd.de/xml. The engine is written in Java but it has\
    \ a\ncommand-line interface."
