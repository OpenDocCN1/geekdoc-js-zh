    # Extensible Markup Language


    This conflicting evolution of HTML, partly toward procedural markup and partly
    toward generic coding, is illustrative of the forces at play behind HTML.


    On one hand, the Web has evolved into a media in its own right, similar to printed
    magazines and television. Therefore, people need lots of control over the formatting
    so they can produce visually appealing Web sites.


    Web sites have also grown in size and it is increasingly difficult to maintain
    them. For most organizations, building a Web site follows these steps:


    +   - The first 20 pages are produced with enthusiasm.


    +   - Somebody (usually from the marketing department) realizes that the Web site
    looks terrible.


    +   - A design agency is contracted to redo the appearance of the site and it
    manually edits the 20 pages. The site is now three times slower but it looks great.


    +   - Another 50 pages are added with enthusiasm. More or less follow the new
    appearance. As time passes by, they tend to diverge from the original style.'
