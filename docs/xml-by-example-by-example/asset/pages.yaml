    # Lessons Learned


    Most XML applications are similar to the phone list: There is one DTD that fully
    satisfies the document. There are one or more style sheets and potentially other
    applications to process the document. The document is not extended.


    However, if the document is shared by different organizations, it may be easier
    to adopt a more extensible approach, as illustrated by the price list application.


    Theoretically, it would have been possible to devise a common DTD to accommodate
    the needs of all the merchants. In practice, this is a difficult exercise because
    the common DTD must take into account differences in culture between the organizations.'
