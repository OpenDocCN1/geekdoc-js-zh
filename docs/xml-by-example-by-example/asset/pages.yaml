  md: '# Chapter 10: Modeling for Flexibility


    Furthermore, the merchants are competitors. In practice, trying to reach agreement
    on anything but the most basic elements might degenerate into a political fight.


    Electronic Data Interchange (EDI) shows the limits of trying to build a universal
    data structure. The idea behind EDI is a promising one: A large number of paper
    documents printed by computers are rekeyed at the receiving site. Why not skip
    the paper?


    In other words, your organization''s accounting package prints invoices. The invoices
    are mailed to your customer, who reenters the information in his or her accounting
    package. Likewise for orders, delivery instructions, tax declarations, and checks.
    It would be more efficient to exchange the information electronically.


    EDI tried to remove the paper from the equation. To that effect, a number of standards
    (X.12, UN/EDIFACT, Odette) were developed. These standards specified a universal
    electronic format for administrative and business documents.


    The only problem is the universality. To accommodate the business practices of
    all the companies in various countries is an immense task. Remember that we are
    talking about different countries with radically different cultures and legislation.


    In practice, the documents become so complex that people have to simplify them
    before they can use them. Worse, they often find that, despite all the options,
    there are still missing elements. It is an endless fight for the standard to keep
    up with evolution. It results in too much complexity.


    As you can imagine, XML has raised considerable interest in relation to EDI. One
    approach would be to publish simplified standards that would include only the
    most common subset of elements. The documents could be extended, using XML, to
    accommodate special needs.


    In practice, this is exactly what you have just done with price lists, but on
    a larger scale. It is a common core of information that is small enough so it
    is easy to agree on the commonality. However, each party can extend the core in
    its own namespace.


    XML combines the best of both worlds: commonality where it is practical and extension
    or customization where it is required.


    This raises many interesting questions. If each party can create its own elements,
    then how do you read them? One solution is to use a style sheet, as we have just
    done, to describe how to render the new elements.


    Another solution is to use the DTD to describe the new elements and their structure.
    Several companies, including Microsoft, are working on mapper'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'software. These mappers help you convert the DTD you received from a partner
    in a format that makes sense for you.


    There are many other aspects to XML/EDI. However, it is clear that XML and EDI
    have a long way to go together. In 1997, I helped cofounding the XML/EDI Group.
    If you are interested in this topic, I encourage you to visit our Web site at
    www.xmledi.com.


    # XLink


    Previous chapters have looked at some of the so-called companion XML standards
    as XSL, CSS, DOM, and SAX. There are others including XLink and XPpointer. XLink
    and XPpointer are standards to express links between XML documents.


    This section introduces the basics of XLink. The goals are as follows:


    +   * illustrate how standards can be built on the basis of extensibility

    * give you an introduction to XLink, should you need to introduce linking into
    your own documents


    This section is not intended as a complete discussion of XLink.


    > CAUTION

    At the time of writing, the XLink standard is not final. Although the concepts
    seem stable, it is possible that the published standard will differ significantly
    from the material presented in this section.


    The latest version of XLink is available from www.w3.org/TR/XLink.


    XLink enables you to specify links between documents. It recognizes two types
    of links:


    +   * Simple links are similar to HTML links such as the anchor tag (<A>).

    * Extended links make it possible to link several documents.


    # Simple Links


    +   1. The simple link is familiar because it closely mimics the features of HTML
    links. At its simplest, an XLink looks like


    ```

    <xlink:simple xmlns:xlink="http://www.w3.org/XML/XLink/0.9"

    href="http://www.pineapplesoft.com/newsletter"

    role="newsletter"

    title="Pineapplesoft Link"

    show="replace"

    actuate="user"

    Pineapplesoft Link, free newsletter

    </xlink:simple>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_340_0.png)'
  merge: -1
  pgno: 340
- img_proc: true
  md: "# Chapter 10: Modeling for Flexibility\n\nAs the example illustrates, the simple\
    \ link and other software recognize the xlink:simple namespace. Browsers and others\
    \ easily-simple element.\n\nXLink needs many attributes to offer the same richness\
    \ as HTML links. Some of these attributes are self-explanatory such as href, which\
    \ is a URI title is equally easy—it-is a description of the link. role is a generic\
    \ string that describes the function of the link's content.\n\nshow and actuate\
    \ are not so intuitive. In HTML, there are several types of links. Take, for example:\n\
    \n```\n<A href=\"http://www.applesoft.com\">Pineapplesoft</A>\n<IMG SRC=\"http://www.applesoft.com/images/logo.gif\"\
    >\n```\n\nTo activate the anchor element, the user must click it. When clicked,\
    \ the link will replace the current document with the link content (assuming that\
    \ frames are not used).\n\nConversely, the link in the image tag is immediately\
    \ activated: The browser downloads the image when it loads the page. Furthermore,\
    \ the image is integrated into the current document—it does not replace it.\n\n\
    show and actuate control the same behavior for XLink. The show attribute can have\
    \ the new values, parsed, and replace. New means means the browser should open\
    \ a new window to display the link's content. parsed means the link's content\
    \ should be parsed and integrated into the current document. replace means the\
    \ browser should replace the current document with the content of the link. replace\
    \ is the default behavior for an HTML anchor.\n\nThe activate attribute can take\
    \ the value user or auto. Auto means the user must actively traverse the link\
    \ whereas the browser should automatically traverse the link when the document\
    \ is being loaded.\n\n+   2. There is another form of the simple link whereby\
    \ the link is integrated into an existing element. Such a link is recognizable\
    \ through its attributes, which are part of the XLink namespace, as in\n<resource\
    \ xmins:xlink=\"http://www.w3.org/XML/XLink/0.9\">\n  xlink:type=\"simple\"\n\
    \  xlink:href=\"http://www.applesoft.com/newsletter\"\n  xlink:role=\"newsletter\"\
    \n  xlink:title=\"Pineapplesoft Link\"\n  xlink:show=\"replace\"\n  xlink:actuate=\"\
    user\"\nPineapplesoft Link, free newsletter\n</resource>\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_341_0.png)"
  merge: -1
  pgno: 341
- img_proc: true
  md: "This link also needs the type attribute to identify whether the link is a simple\
    \ link or an extended link.\n\n# TIP\n\nTo save typing, it is possible to associate\
    \ default or fixed values with the attributes in the DTD of the document. As you\
    \ saw in the section \"Standalone Documents\" in Chapter 3, using fixed attributes\
    \ is not without problems. The following example illustrates how it works:\n\n\
    ```\n<xml version=\"1.0\"?>\n<!DOCTYPE references [>\n  <!ELEMENT references (name,link)>\n\
    \  <!ELEMENT name (#PCDATA)>\n  <!ELEMENT link EMPTY>\n  <!ATTLIST link\n    xmlns:xlink\
    \ CDATA FIXED \"http://www.w3.org/XML/XLink/0.9\"\n    xlink:type (simple) FIXED\
    \ \"simple\"\n    xlink:href CDATA REQUIRED\n    xlink:role CDATA IMPLIED\n  \
    \  xlink:title CDATA IMPLIED\n    xlink:show (parsed|replace) \"replace\"\n  \
    \  xlink:actuate (user|auto) \"user\">\\n]>\n<references>\n  <name>Macmillan</name>\n\
    \  <link xlink:href=\"http://www.mcp.com/\">Pineapplesoft Link</name>\n  <link\
    \ xlink:href=\"http://www.pineapplesoft.com/newsletter/\">XML.com</name>\n  <link\
    \ xlink:href=\"http://www.xml.com/\">Comics.com</name>\n  <link xlink:href=\"\
    http://www.comics.com/\">Fatbrain.com</name>\n  <link xlink:href=\"http://www.fatbrain.com/\"\
    >ABC News</name>\n  <link xlink:href=\"http://www.abcnews.com/\"/>\n</references>\n\
    ```\n\nBeware that Internet Explorer 5.0 does not accept this notation. This is\
    \ a problem specific to Internet Explorer and it will probably be fixed in a future\
    \ version."
