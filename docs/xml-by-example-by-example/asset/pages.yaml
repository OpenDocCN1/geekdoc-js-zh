  md: '# XML


    # BY EXAMPLE


    The by Example series is designed to teach programming languages to beginners
    through real-world situations and examples. Following a logical, linear teaching
    progression, these books take you through the small, gradual steps that enable
    you to see the big picture of the language you are learning.


    Chapters not only include Tips, Notes, Cautions, and Cross-References, but also
    have summaries that put the chapter information into perspective. The final chapter
    offers you a full working program that you have been learning throughout the book
    and demonstrates the concepts taught in each of the chapters.


    +   * Upgrade your HTML skills to XML

    * Learn how to use XML with HTML browsers

    * Customize content: Deliver the right document to the right user

    * Create your own tags to better organize your documents

    * Validate your documents with XML DTDs

    * Manipulate XML from scripting and programming languages with DOM

    * Build flexible 3-tier applications with XML

    * Extend documents with XML namespaces

    * Learn the new architecture for the Web

    * View real-life examples, including an electronic commerce application


    Benoit Marchal runs the consulting company, Pineapplesoft, that specializes in
    Internet applications, e-commerce, XML, and Java™. He has worked with players
    in internet development such as Netscape® and EarthWeb, and is a regular contributor
    to developer.com and other Internet publications. In 1997, he co-founded the XML/EDI
    Group, a think tank that promotes the use of XML in e-commerce applications. Benoit
    frequently leads corporate training on XML and other internet technologies.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_531_0.png)


