    # Entities and Notations


    As already mentioned in the previous chapter, XML doesn''t work with files but
    with entities. Entities are the physical representation of XML documents. Although
    entities usually are stored as files, they need not be.


    In XML document, its DTD, and the various files it references (images, stock-photos,
    and so on) are entities. The document itself is a special entity because it is
    the starting point for the XML processor. The entity of the document is known
    as the document entity.


    XML does not dictate how to store and access entities. This is the task of the
    XML processor and it is system specific. The XML processor might have to download
    entities or it might use a local catalog file to retrieve the entities.


    In Chapter 7, the Parser and DOM, you''ll see how SAX parsers (a SAX parser is
    one example of an XML processor) enable the application to retrieve entities from
    databases or other sources.'
