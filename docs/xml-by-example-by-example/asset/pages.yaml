  md: '# CSS Property Values


    +   - pt: points, where a point is 1/72 points

    - pc: picas, where a pica is 12 points


    # Percentage


    Percentages are used for width, height, and position. A percentage is a number
    followed by the percent sign "%%". There are no spaces between the number and
    the sign. For example, the following rule defines a line height, which is the
    text:


    ```

    line-height: 200%

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_190_0.png)


    # Color


    +   1. Many properties accept a color value. There are three solutions to present
    a color. The first one (borrowed from HTML) has the form: #00ff00—that is, an
    RGB value in hexadecimal. This example selects a green background:


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_190_1.png)


    ```

    background-color: #00FF00

    ```


    > NOTE

    With three numbers represent the proportion of red, green, and blue in the color.
    The three numbers are represented in hexadecimal and their value goes from 0 to
    255 (or ff in hexadecimal)


    Therefore, #FF0000 is pure red (maximum red, no green or blue) whereas #000022
    is light blue (no red or green, some blue).


    Shades of gray have the same amount of red, green, and blue. The following are
    all shades of gray: #222222, #555555, and #cccccc.


    Most graphics programs can tell you the amount of red, green, and in integers.


    +   2. The second solution is to define the RGB value with integers and percentages.
    This has the form rgb(0,15,128). Integer values go from 0 to 255, percentages
    from 0% to 100%. The following examples select blue text:


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_190_2.png)


    ```

    color: rgb(0,0,255)

    color: rgb(0%,0%,100%)

    ```


    +   3. Finally if, like me, you prefer readable colors to RGB the keyword is black,
    will like keywords. Acceptable values for the keyword are maroon, green, silver,
    red, lime, blue, gray, purple, olive, teal, white, fuchsia, yellow, and aqua.
    The following example paints the border in fuchsia: border-color: fuchsia


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_190_3.png)


    # URL


    URLs are used for images. They have the form url(image.gif). The following example
    uses the image logo.gif available from www.pineapplesoft.com/images/ as background:


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_190_4.png)


    ```

    background: url(http://www.pineapplesoft.com/images/logo-of.gif)

    ```'
