  md: "In this section, I introduce you to some applications of XML. As you will see\
    \ throughout this book, many applications can benefit from XML. This section gives\
    \ you an introduction of what XML has been used for.\n\n# Publishing\n\nBecause\
    \ XML roots are in publishing, it's no wonder the standard is well adapted to\
    \ publishing. XML is being used by an increasing number of publishers as the format\
    \ for documents. The XML standard was published with XML.\n\n![](img/01a2244e52d95a9cd8321ab87f3ba2eb_79_0.png)\n\
    \nListing 2.6 is an XML document for a monthly newsletter. As you can see, it\
    \ uses elements for the title, abstract, paragraphs, and other concepts for publishing.\n\
    \nListing 2.6: A Newsletter in XML\n\n```\n<xml fname=\"1990101.xsl\">\n<article>\n\
    \  <title>XML Style Sheets</title>\n  <date>January 1999</date>\n  <copyright>1999,\
    \ Benoit Marchal</copyright>\n  <abstract>Style sheets add flexibility to document\
    \ viewing.</abstract>\n  <keywords>XML, XSL, style sheet, publishing, web</keywords>\n\
    </article>\n<section>\n```\n\n+   - Send comments and suggestions to <url protocol=\"\
    mailto:bmarchal@pineapples.com\">url</url>.\n\n</section>\n\n<section>\n\n<title>Styling</title>\n\
    \nStyle sheets are inherited from SGML, an XML ancestor. Originated in publishing\
    \ and document management applications. XSL is XML's standard style sheet, we\
    \ see <url>http://www.w3.org/Style/</url>.</p>\n\n</section>\n\n<section>\n\n\
    <title>How XSL Works</title>\n\nAn XSL style sheet is a set of rules where each\
    \ rule specifies how to format elements in the document. To continue the example\
    \ from the previous section, the style sheet has rules for title, paragraphs,\
    \ and keywords.</p>\n\nWith XSL, these rules are powerful enough not only to format\
    \ the document but also to reorganize it, e.g., by moving the title to the front\
    \ page or extracting the list of keywords. This can lead to exciting applications\
    \ of XSL outside the realm of traditional publishing. For example, XSL can be\
    \ used to convert documents between the company-specific markup and a standard\
    \ one.</p>\n\n</section>\n\n<section>\n\n<title>The Added Flexibility of Style\
    \ Sheets</title>"
