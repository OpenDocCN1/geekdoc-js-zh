  md: '# Attributes Versus Elements 339


    This model states that there is at least one reference or one description for
    each product (there may be several references or several descriptions). Also the
    order is either for a certain quantity or a time and material basis, one of the
    two elements must be present. Figure 10.9 illustrates this structure.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_356_0.png)


    Figure 10.9: The structure of the new DTD


    When resolving these problems, it is important to avoid introducing ambiguities
    in the DTD. The following model would have been ambiguous:


    ```

    <!ELEMENT lines ((reference+ | reference+, description+)

    description+),

    (quantity | time-material+),price?)?>

    ```


    It says that a line has either references or descriptions or both. Unfortunately,
    it is ambiguous. To remove the ambiguity, you can introduce a new element as such


    ```

    <!ELEMENT line ((ref-desc | reference+, description+)

    (quantity | time-material+ | price?))>

    <!ELEMENT ref-desc (reference+,description+)>

    ```


    # Attributes Versus Elements


    As you have seen in the earlier section "The Right Level of Abstraction," you
    can use elements or attributes interchangeably to recover the information in a
    DTD.


    This has led to heated debates in the XML community between the proponents of
    attributes and the proponents of elements. Specifically, the debate is whether
    it is best to store content in attributes or in elements.


    Both sides have very convincing arguments and support their claims with good examples
    that clearly demonstrate the superiority of attributes over elements, or elements
    over attributes. The only problem is that both sides are right.'
  merge: -1
  pgno: 356
- img_proc: true
  md: "This debate is similar to the debate between inheritance and aggregation in\
    \ object-oriented modeling. There are some clear arguments for and against each\
    \ approach. And yet, when you have a blank sheet of paper in front of you, the\
    \ solution is sometimes obvious, sometimes not.\n\nI don't believe one approach\
    \ is intrinsically better than the other. I try to keep an open mind and adapt\
    \ to the needs of the application at hand. For some applications, attributes just\
    \ seem to work better, for others, elements are the clear winner. I always keep\
    \ in mind that conversion is an option provided the structure is good enough.\n\
    \nYour experience will guide you as well. The next two sections present the reasons\
    \ you might use attributes or elements.\n\n# Using Attributes\n\n+   1. A major\
    \ advantage of attributes is that they establish a strong relationship with their\
    \ parent element. This makes it easy to process all the attributes attached to\
    \ an element. This is particularly true forX parameters, as illustrated by the\
