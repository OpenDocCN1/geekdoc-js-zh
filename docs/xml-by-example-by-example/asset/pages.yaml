  md: "# The Right Level of Abstraction\n\nWhen designing XML applications and, more\
    \ specifically, XML DTDs, it is not always easy to decide what to include in the\
    \ markup and what to leave out. This section provides some guidance.\n\n# Destructive\
    \ and Nondestructive Transformations\n\nIt takes very little effort to turn an\
    \ office into a mess: just start piling old files and let documents accumulate\
    \ in the inbox. In no time, the mess gets out of control. It requires continuous\
    \ effort to keep the office tidy.\n\nUnfortunately, the same is true for XML documents.\
    \ It is very easy to turn an XML document into a mess, but it is very difficult\
    \ to keep it tidy. Also, it takes a lot of effort to clean up documents that have\
    \ been degraded.\n\n+   1. In particular, it is easy to lose information when\
