  md: '# Writing XML


    In the last four chapters, you learned how to use XML documents in applications.
    You studied style sheets and how to convert XML documents in HTML. You also learned
    how to read XML documents from JavaScript or Java applications with a parser.


    This chapter looks at the mirror problem: how to write XML documents from an application.
    The mirror component for the parser is called a generator. Whereas the parser
    reads XML documents, the generator writes them.


    In this chapter, you learn how to write documents


    +   - through DOM, which is ideal for modifying XML documents.

    - through your own generator, which is more efficient.


    # The Parser Mirror


    In practice, some parsers integrate a generator. They can read and write XML documents.
    Consequently, the term *parser* is often used to symbolize the combination of
    the parser and the generator.


    There are two schools of thought when it comes to generators:


    +   - The first school argues that you need packaged generators for the same reason
    you need packaged parsers: to shield the programmer from the XML syntax.

    - The other school argues that writing XML documents is simple and can easily
    be done with ad hoc code.


    As usual, I am a pragmatist and I choose one option or the other depending on
    the needs of the application at hand. In general, however, it is dramatically
    easier to generate XML documents than to read them. This is because you control
    what you write but the author controls you read.


    Indeed, when reading a document, you may have to deal not only with tags but also
    with entities, exotic character sets, and notations—not to mention errors and
    DTD validation.'
