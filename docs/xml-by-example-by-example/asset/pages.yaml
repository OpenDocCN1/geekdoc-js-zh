- img_proc: true
  md: 'can change several times during a month. If the information is available on
    a Web site, customers can always access the latest, most up-to-date information.


    Currently, the price list is published in HTML—that is, intended for viewing by
    a human. This is acceptable if you have few providers with few products but as
    soon as you have many providers or many products, you want an automated solution.


    With XML, software can automatically visit the price list, extract the price,
    and update the information in your own database. This is shown in the top half
    of Figure 1.9. It requires a markup language that does not concentrate on appearance
    but structure.


    # Companion Standards


    The value of XML is not that it is a markup language but that it is a standard
    markup language. It wouldn''t be difficult to create your own markup language
    using your own convention. However, by adopting XML, you buy into a growing community
    supported by a large range of standards and products.


    This means it will be easier to find support in the form of books, articles, and
    services, as well as software to create, manipulate, store, and exchange XML documents.


    There is a sort of positive loop at play here: Because XML is standardized, more
    vendors are willing to support it. This leads more people to adopt it. A large
    market interest means that more vendors will propose XML tools. This, in turn,
    attracts more users, who, again, attracts new vendors. And so, and so on.


    The title for this chapter, “The XML Galaxy,” reflects my view that XML is more
    than a markup language. It is a whole range of tools that you can use to work
    in your environment.


    In particular, the W3C has developed a number of standards that complement XML
    standards. These standards are often referred to as “XML companion standards.”


    It is not my intention in this chapter to introduce these standards comprehensively,
    but I would like to give you a feeling for what they have to offer. Therefore,
    I will point to some of the major companion standards.


    This is not a complete list. New standards are regularly being introduced.'
