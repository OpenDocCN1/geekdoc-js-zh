    \ could read and automatically fulfill it.\n\nFor years, this was the realm of\
    \ EDI technologies (EDI stands for Electronic Data Interchange. At the heart of\
    \ EDI is a major effort to standardize the semantic of every commercial and administrative\
    \ document (order, invoice, tax declaration, payment, catalog, and more).\n\n\
    There are many advantages to building a common semantic on a worldwide scale.\
    \ In particular, it is possible to completely automate the flow of information\
    \ between companies. However, one inconvenience is the need to reach a consensus.\n\
    \nIn practice, it is easy to agree on a few core elements, such as the quantity,\
    \ the name, the address, and it is very easy to disagree on anything else. Imagine\
    \ how complex an order can be when it must accommodate the regulations and business\
    \ practice of every country.\n\nIn practice, organizations that use EDI have to\
    \ simplify the standard. Unfortunately, they also might have to add specific applications\
    \ that are not provided in the standard.\n\nIn doing so, they often deviate from\
    \ the standard. Unfortunately, nothing in the existing EDI standard supports departure\
