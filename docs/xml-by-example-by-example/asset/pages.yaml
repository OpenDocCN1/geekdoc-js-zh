  md: '# Creating a Sensible URL


    There are no rules on how to build URLs for namespaces. As long as it has the
    right format (as explained before), it works. Experience shows that URLs work
    best if they follow the following rules:


    +   * Namespaces are identified by Web addresses. You might want to post a description
    of the namespace at a later point.

    * The URL is reasonably short to save typing.

    * The URL includes a readable description of the namespace.

    * The URL includes a version number so you can update the version number.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_134_0.png)


    Some examples include

    http://psol.com/xml/address/1.0

    http://www.w3.org/XSL/Transform/1.0

    http://www.w3.org/TR/REC-html40


    > CAUTION

    Most importantly, write the URL down and make sure nobody else in your organization
    uses it. Remember the goal of the exercise is to avoid duplicates.


    > TIP

    Large organizations should use subdomains to help manage unique URLs. For example,
    the namespace for finance department would be in the finance.applessoft.com subdomain,
    whereas the sales department would use sales.applessoft.com.


    In this book, I pick URLs on the catwoman.applessoft.com server. If you are curious,
    catwoman is Applessoft''s Intranet server.


    # URNs


    Currently, most URIs are URNs. URIs are addresses. They point to a file on a machine,
    where an URN is a generic name for a resource. It means that if the document moves,
    the address is invalid. This is the dreadful “404 File not found” error message.


    The IETF (Internet Engineering Task Force) is working on other forms of URIs,
    more specifically URN (Uniform Resource Name).


    URNs are not addresses. They are independent of the location of the document.
    This should eliminate the “404” errors.


    ISBN numbers (the number at the back of the book, on top of the bar code) are
    good candidates for URNs. An ISBN number identifies a,'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'irrespective of where the book is currently located. You can use the ISBN

    number to order the book from a bookstore or to borrow it from a library.


    The URN for this book is

    urn:ISBN:0-7897-2242-9


    Another approach is to use PURLs (Permanent URLs). Unlike regular

    URLs, PURLs are registered to avoid "404" errors. The registration process

    is the key: if the document moves, it suffices to update the Registry. The

    PURL remains unchanged. You can find more information on PURLs (and

    create your first PURL) at www.purl.org.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_135_0.png)


    # Scoping


    The namespace is valid for the element where it is declared and all the ele-

    ments within its content, as illustrated in Listing 4.8.


    Listing 4.8: Scoping of Namespaces


    ```

    <xml version="1.0?>

    <rff:references>

    xmlns:rff="http://catwoman.applesoft.com/ref/1.5">

    <rff:name>Macmillan</rff:name>

    <rff:link href="http://www.mcp.com"/>

    <pa:rating>

    xmlns:pa="http://pinguin.xml.com/review/1.0">G</pa:rating>

    <rff:name>Pineapples Link</rff:name>

    <rff:link href="http://www.applesoft.com/newsletter"/>

    <qa:rating>

    xmlns:qa="http://joker.playfield.com/star-rating/1.0">

    5 stars</qa:rating>

    </rff:references>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_135_1.png)


    Again, there are three namespaces declared in Listing 4.7. rff is declared

    on the top-level element and is therefore valid for all the elements. pa is

    declared only for the first rating element and it is valid for that element

    only. qa is declared for the second rating element.


    As Listing 4.9 illustrates, the namespace also can be associated with

    specific attributes. In Listing 4.9, a new attribute is added to the name

    element to convey the subscription fee.


    Listing 4.9: Using Namespaces for Attributes


    ```

    <xml version="1.0?>

    <references

    xmlns="http://catwoman.applesoft.com/ref/1.5">

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_135_2.png)'
