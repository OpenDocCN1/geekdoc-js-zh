  md: '# Applications of Namespaces 121


    Initially, XML documents were developed in isolation. One would develop a DTD
    for a specific application—that is a magazine, an order, or a channel—as we saw
    in Chapter 2, “The XML Syntax.” The elements defined in the DTD would be specific
    to that application. There is little reuse of elements except, maybe, by cutting
    and pasting old DTDs into new ones.


    Thanks to namespaces, it is possible to develop reusable elements—that is, elements
    that can be reused in multiple documents. This is a new approach for document
    development.


    Increasingly, the W3C and other groups work on such reusable elements. Two examples
    are XML style sheets and digital signatures for XML.


    # XML Style Sheet


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_138_0.png)


    Listing 4.12 is an XML style sheet. As you can see, it combines elements from
    the style sheet itself (in the namespace http://www.w3.org/1999/XSL/Transform)
    and elements from HTML (in the namespace http://www.w3.org/TR/html4).


    Listing 4.12: Using Namespaces with Style Sheets


    ```

    <?xml version="1.0" encoding="ISO-8859-1"?>

    <xsl:stylesheet

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform"

    xmlns="http://www.w3.org/TR/REC-html40">


    <xsl:output method="html"/>


    <xsl:template match="/">

    <HTML>

    <HEAD>

    <TITLE>Article</TITLE>

    </HEAD>

    <body>

    <xsl:apply-templates/>

    </body>

    </HTML>

    </xsl:template>


    <xsl:template match="title">

    <P><B><xsl:apply-templates/></B></P>

    </xsl:template>

    ```


    continues'
