  md: '# Chapter 3: XML Schemas


    The internal subset of DTD is stored in the document, specifically in the

    document type declaration, as in


    ```

    <!DOCTYPE address [

    <!ELEMENT address (street,region?,postal-code,locality,country)>

    <!ATTLIST address preferred (true false) "false">

    <!ELEMENT street (#PCDATA)>

    <!ELEMENT region (#PCDATA)>

    <!ELEMENT postal-code (#PCDATA)>

    <!ELEMENT locality (#PCDATA)>

    <!ELEMENT country (#PCDATA)>

    ]>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_95_0.png)


    The external subset is not stored in the document. It is referenced from the

    document type declaration through an identifier as in the following exam-ples:


    ```

    <!DOCTYPE address-book SYSTEM "http://www.xmli.com/dtd/address-book.dtd">

    <!DOCTYPE address-book PUBLIC "Pineapplesoft//Address Book//EN">

    ➔http://catwoman.pineapplesoft.com/dtd/address-book.dtd">",n<!DOCTYPE address-book
    SYSTEM "../dtds/address-book.dtd">

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_95_1.png)


    There are two types of identifiers: *system identifiers and public identifiers*.
    A keyword, respectively SYSTEM and PUBLIC, indicates the type of identi-fier.


    +   - A system identifier is a Universal Resource Identifier (URI) pointing to

    t DTD. URI is a superset of URLs. For all practical purposes, a URI

    is a URL.

    - In addition to the system identifier, the DTD identifier might include

    a public identifier. A public identifier points to a DTD recorded with the

    ISO according to the rules of ISO 9070. Note that a system identi-fier must follow
    the public identifier.


    The system identifier is easy to understand. The XML processor must

    download the document from the URI.


    Public identifiers are used to manage local copies of DTDs. The XML

    processor maintains a catalog file that lists public identifiers and their

    associated URIs. The processor will use these URIs instead of the system

    identifier.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_95_2.png)'
