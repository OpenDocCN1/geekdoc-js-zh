  md: "# The Problem Namespaces Solves\n\nXML is extensible. So it says in the name:\
    \ eXtensible Markup Language. The problem is that extensibility does not come\
    \ free. In a distributed environment, extensibility must be managed to avoid conflicts.\
    \ Namespaces is a solution to help XML extensibility.\n\nNamespace can be defined\
    \ as a mechanism to identify XML elements. It places the name of the elements\
    \ in a more global context: the namespace.\n\nThe namespace recommendation, published\
    \ by the W3C, is available at www.w3.org/TR/REC-xml-names.\n\nThe namespace recommendation\
    \ is relatively thin. The concepts are not difficult, either, this means namespaces\
    \ are often overlooked! Don't make that mistake; namespaces are essential for\
