  md: '# Chapter 5: XSL Transformation


    > ✔ If you need help installing the Java Development Kit, turn to Appendix A,
    "Crash on Java," page 457.


    # Concepts of XSLT


    XSLT is a language to specify transformation of XML documents. It takes an XML
    document and transforms it into another XML document, as illustrated by Figure
    5.1.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_145_0.png)


    **Figure 5.1:** Using XSL to transform an XML document


    XSLT is not limited to styling activities. Many applications require transforming
    documents. XSLT can be used to


    +   - add elements specifically for viewing, such as add the logo or the address
    of the sender to an XML invoice

    - create new content from an existing one, such as create the table of contents

    - present information with the right level of details for the reader, such as
    using a style sheet to present high-level information to a managerial person while
    using another style sheet to present more detailed technical information to the
    rest of the staff

    - convert between different DTDs or different versions of DTD, such as convert
    a company specific DTD to an industry standard

    - transform XML documents into HTML for backward compatibility with existing browsers


    The last case is very common. The XSLT recommendation considers HTML conversion
    as a special case of XML transformation. This is also one of the solutions supported
    by Microsoft Internet Explorer 4.0 and 5.0.


    # Basic XSLT


    I publish a monthly e-zine, Pineapplesoft Link. Every month, I email the e-zine
    to subscribers and I post a copy on my Web site. That’s two formats to support:
    text and HTML.'
