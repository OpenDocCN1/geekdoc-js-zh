  md: '# Document Applications


    The first application of XML would be document publishing. The main advantage
    of XML in this area is that XML concentrates on the structure of the document,
    and this makes it independent of the delivery medium (see Figure 1.6).


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_46_0.png)


    Figure 1.6: XML is independent from the medium.


    Therefore, it is possible to edit and maintain documents in XML and automatically
    publish them on different media. The operative word here is automatically.


    The ability to target multiple media is becoming increasingly important because
    many publications are available online and in print. Also, the Web is changing
    rapidly. What is fashionable this year will be passé next year one needs to reform
    his site regularly.


    Finally, some Web sites are optimized for specific viewers, such as Netscape or
    Internet Explorer. This often leads to the development of two or more versions
    of the same site: one generic version and one optimized for some users. If done
    manually, this is very costly.


    For all reasons, it makes sense to maintain a common version of the documentation
    in a media-independent format, such as XML, and to automatically convert it into
    publishing formats as HTML, PostScript, PDF, RTF, and more.


    Of course, the more media we need to support and the larger the document, the
    more important it is that publishing is automated.


    # Data Applications


    One of the original goals of SGML was to give document management access to the
    software tools that had been used to manage data, such as databases.


    With XML, the loop comes to a full circle because XML brings a publishing kind
    of distribution to data. This leads to the concept of “the application'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'as the document" where, ultimately, there is no difference between documents
    and applications.


    Indeed, if the structure of a document can be expressed in XML, as illustrated
    in Figure 1.7, so can the structure of a database, as illustrated in Figure 1.8.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_47_0.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_47_1.png)


    As an example, consider Table 1.1 which is a list of products and prices as they
    would be stored in a relational database. Listing 1.9 is the same list of products
    in XML.


    Table 1.1: A list of products in a relational database

    | Identifier | Name | Price |

    |---|---|---|n| p1 | XML Editor | $499.00 |

    | p2 | DTD Editor | $199.00 |

    | p3 | XML Book | $19.99 |

    | p4 | XML Training | $699.00 |'
