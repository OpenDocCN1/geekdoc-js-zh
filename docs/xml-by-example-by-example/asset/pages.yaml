    vendor\");\n    }\n}\n```\n\nThe parser uses AttributeList in the startElement\
    \ event. As the name implies, an AttributeList encapsulates a list of attributes.\
    \ It defines the following methods:\n\n+   - getLength() returns the length of\
    \ the attribute list.\n- getName(name) returns the name of the ith attribute (where\
    \ i is an integer).\n- getType(i)/getType(name) return the type of the ith attribute\
    \ or the type of attribute whose name is given. The first method accepts an integer,\
    \ the second. The type is a string, as used in the DTD: \"CDATA\", \"ID\", \"\
    IDREF\", \"IDREFS\", \"NMTOKEN\", \"NMTOKENS\", \"ENTITYITIES\", or \"NOTATION\"\
    .\n- getValue(i)/getValue(name) return the value of the ith attribute whose name\
    \ is given.\n\n# Locator\n\nA Locator enables the application to retrieve line\
    \ and column positions. The parser may provide a Locator object. If the application\
    \ is interested in line information, it must retain the reference to the Locator.\n\
    \nLocator defines the following methods:\n\n+   - getColumnNumber() returns the\
    \ column where the current event ends. In an endElement event, it would return\
    \ the last column of the end tag.\n- getLineNumber() returns the line where the\
    \ current event ends. In an endElement event, it would return the last line of\
    \ the end tag.\n- getPublicId() returns the public identifier for the current\
    \ document.\n- getSystemId() returns the system identifier for the current document\
    \ event."
