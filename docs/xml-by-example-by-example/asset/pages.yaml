  md: '# The Parser and DOM


    The previous chapters showed how to view and transform XML documents. Style sheet
    is a powerful technology but it is limited to viewing and transforming. When you
    have more specific needs, you need to turn to programming. This chapter introduces
    how to read XML documents from JavaScript or Java.


    In this chapter, you learn


    +   * what an XML parser is

    * how to interface a parser with an application

    * what DOM, the Document Object Model, is

    * how to write JavaScript applications that use DOM

    * how to write Java applications that use DOM

    * which other applications use DOM


    # What Is a Parser?


    A parser is the most basic yet most important XML tool. Every XML application
    is based on a parser.


    A parser is a software component that sits between the application and the XML
    files. Its goal is to shield the developer from the intricacies of the XML syntax.


    Parsers are confusing because they have received a lot of publicity: There are
    dozens of parsers freely available on the Internet. When Microsoft shipped Internet
    Explorer 4.0 as the first browser with XML support, they bundled two XML parsers
    with it.


    Yet if you ask for a demo of a parser, you won''t see much. The parser is a low-level
    tool that is almost invisible to everybody but programmers. The confusion arises
    because the tool has so much visibility in the marketplace turns out to be a very
    low-level device.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Parsers


    Why do you need parsers? Imagine you are given an XML file with product descriptions,
    including prices. Your job is to write an application to convert the dollar prices
    to Euros.


    It looks like a simple assignment: Loop through the price list and multiply each
    price by the exchange rate. Half a day''s work, including tests.


    Remember the prices are in an XML file. To loop through the prices means to read
    and interpret the XML syntax. It doesn''t look difficult—basically elements are
    in angle brackets. Let''s see the half-day assignment is now a one-day assignment.


    Do you remember entities? The XML syntax is not just about angle brackets. There
    might be entities in the price list. The application must read and interpret the
    DTD to be able to resolve entities. While it''s reading the DTD, it might as well
    read element definitions and validate the document.


    +   For more information on how the DTD influences the document, see the section
    "Standalone Documents" in Chapter 3 (page 79).


    What about other XML features: character encodings, namespaces, parameters entities?
    And did you consider errors? How does your software recover from a missing closing
    tag?


    The XML syntax is simple. Yet, it''s an extensible syntax so XML applications
    have to be ready to copy with many options. As it turns out, writing a software
    library to read XML files is a one-month assignment. If you were to write such
    a library, you would be writing your own parser.


    Is it productive to spend one month writing a parser library when you need only
    half a day''s work to process the data? Of course not.


    That''s why developers download a parser from the Internet or use one with the
    development tool. This is the common definition of a parser: off-the-shelf components
    that isolate programmers from the specifics of the XML syntax.


    If you are not convinced yet and if you''d rather write your own XML parser, consider
    this: No programmer in his/her right mind (except those working for Oracle, Sybase,
    Informix, and the like) would write low-level database drivers. It makes more
    sense to use the drivers that ship with the database.


    Likewise, no programmer should spend time decoding XML files—it makes more sense
    to turn to existing parsers.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# The Parser and the Application


    # NOTE


    The word parser comes from compilers. In a compiler, a parser is the module that
    reads and interprets the programming language.


    In a compiler, the parser creates a parse tree, which is an in-memory representation
    of the source code.


    The second half of the compiler, known as the backend, uses parser trees to generate
    object files (compiled modules).


    # Validating and Nonvalidating Parsers


    XML documents can be either well-formed or valid. Well-formed documents respect
    the syntactic rules. Valid documents do not respect the syntactic rules but also
    conform to a structure as described in a DTD.


    Likewise, there are validating and nonvalidating parsers. Both parsers enforce
    syntactic rules but only validating parsers know how to validate documents against
    their DTDs.


    Lest be any confusion, there is no direct mapping between well-formed and nonvalidating
    parsers. Nonvalidating parsers can read valid documents but won''t validate them.
    To a nonvalidating parser, every document is as a well-formed document.


    Similarly, a validating parser accepts well-formed documents. Of course, when
    working on well-formed documents, it behaves as a nonvalidating parser.


    As a programmer, you will like the combination of validating parsers and valid
    documents. The parser catches most of the structural errors for you. And you don''t
    have to write a single line of code to benefit from the service: The parser figures
    it out by reading the DTD. In short, it means less work for you.


    # The Parser and the Application


    This section shows you how to integrate the parser in your applications. It discusses
    the various interfaces available to the programmer.


    # The Architecture of an XML Program


    Figure 7.1 illustrates the architecture of XML programs. As you can see, it is
    divided into two parts:


    +   - The parser deals with the XML file.


    +   - The application consumes the content of the file through the parser.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Chapter 7: The Parser and DOM


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_211_0.png)


    Figure 7.1: Architecture of an XML program


    Note that the application can be very simple (such as printing information on
    the screen), or quite complex (such as a browser or an editor).


    This chapter and the next one concentrate on the dotted line between the two elements.
    This is the interface, or the communication path, between the parser and the application.


    The parser and the application must share a common model for XML data. In practice,
    the common model is always some variation on a tree in memory that matches the
    tree in the XML document.


    The parser reads the XML document and populates the tree in memory. This tree
    built by the parser is an exact match of the tree in the XML document. The application
    manipulates it as if it were the XML document.


    # Object-Based Interface


    There are two basic ways to interface a parser with an application: using object-based
    interfaces and event-based interfaces. In practice, the two approaches are more
    complementary than competitive.


    Using an object-based interface, the parser explicitly builds a tree of objects
    that contains all the elements in the XML document.


    This is probably the most natural interface for the application because it is
    handed a tree in memory that exactly matches the file on disk.


    Obviously, it''s more convenient for the application to work with the tree in
    memory, only because it doesn''t have to worry about the XML syntax. Furthermore,
    if using a validating parser, the tree may have been validated against the DTD.


    +   Listing 7.1 is a list of products, with their prices in U.S. dollars, presented
    in an XML document. The structure for this document is shown in Figure 7.2.'
  merge: -1
  pgno: 211
