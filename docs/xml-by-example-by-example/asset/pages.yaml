  md: '# Box Properties


    It is futile to try to cover every CSS property in this chapter. There are many
    properties that I could write a book about it. Instead, I will concentrate on
    the most important properties—those properties that are frequently used. We will
    start with the properties associated with boxes.


    For more information on specific properties, consult the recommendation at www.w3.org/TR/1998/REC-CSS2-19980512.


    # Display Property


    The display property describes how an element is displayed. The following example
    selects the element as a block box:


    ```

    display: block;

    ```


    display accepts one of the four values: block, inline, list-item, and none. Lists
    are outside the scope of this chapter. block and inline create block boxes and
    inline boxes, respectively. none hides the element.


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_191_0.png)


    # CAUTION


    The display property is not inherited. Make sure to explicitly redefine display
    for each block.


    # Margin Properties


    There are four properties to set the margin of a box. margin-top, margin-right,
    margin-bottom, and margin-left apply to each side of the margin as in the following
    example:


    ```

    margin-top: 10px;

    ```


    Acceptable values include an absolute length, a percentage relative to the parent''s
    width, or the value auto. As the name implies, auto deduces the length from the
    content.


    The margin property sets the four sides in one pass. It accepts either one value
    if the four margins have the same length or four values in the top, right, bottom,
    and left. The following example:


    ```

    margin-top: 30%;

    margin-right: 30px;

    margin-bottom: 50%;

    margin-left: auto;

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_191_1.png)


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_191_2.png)'
