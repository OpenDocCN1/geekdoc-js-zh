  md: "# XML and Semantic\n\nIt is important to realize that XML alone does not define\
    \ the semantic (the meaning) of the document. The element names are meaningful\
    \ only to humans. They are meaningless to the XML processor. And it does not know\
    \ the difference between a name and an address, apart from the fact that an address\n\
    \nThe processor does not know what a name is. an address has more children than\
    \ a name. For the XML processor, Listing 2.5, where the element names are totally\
    \ mixed up, is as good as Listing 2.1.\n\nListing 2.5: Meaningless Names\n\n```\n\
    <?xml version=\"1.0\"?>\n<name>\n <tel>\n  <street>John Doe</street>\n  <country>\n\
    \    <email>34 Fountain Square Plaza</email>\n    <locality>0H-01</locality>\n\
    \    <region>45202</region>\n    <postal-code>Cincinnati</postal-code>\n    <address>US</address>\n\
    \  </country>\n  <tel preferred=\"true\">513-555-8889</tel>\n  <tel>513-555-7098</tel>\n\
    \  <address-book href=\"mailto:jdoe@emailaholic.com\"/>\n </tel>\n <tel>\n  <street>Jack\
    \ Smith</street>\n  <tel>513-555-3465</tel>\n  <address-book href=\"mailto:jsmith@emailaholic.com\"\
    />\n </tel>\n</name>\n```\n\nThe semantic of an XML document is provided by the\
    \ application. As we will see in Chapter 5 and later, some XML companion standards\
    \ deal with some aspects of semantic.\n\nFor example, XSL describes how to present\
    \ information. It provides formatting semantic for a document. XLink and RDF (Resource\
    \ Definition Framework) can be used to describe the relationships between documents."
