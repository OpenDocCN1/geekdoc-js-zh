- img_proc: true
  md: "# A First Look at Document Structure\n\nare enclosed in a frame or as a bulleted\
    \ list does not impact the structure. In Listing 1.1, Figure 1.1, and Figure 1.2,\
    \ the memo consists of\n\n+   * a title\n* header containing\n  * the sender\n\
    \  * the recipient\n  * a subject\n* the body text containing\n  * several URLs\n\
    \  * a signature\n\nand the relationship between those elements remains unchanged.\n\
    Does it mean that structure and appearance are totally unrelated? Not at all!\
    \ Ideally, a text is formatted to expose its structure to the reader because good\
    \ formatting, when constantly applied, is a real help to the reader.\n\nIn our\
    \ case, it is more pleasant to read the HTML versions of the memo rather than\
    \ the text because the frame and bold characters make it easier to distinguish\
    \ the header from the body.\n\nFor the reasons, it is common practice to print\
    \ chapter titles and other headings in bold. When we read, we come to rely on\
    \ those typographic conventions: They help us build a mental image of the document\
    \ structure. Also, they are particularly valuable when we leaf through a document.\n\
    \nLikewise, magazines and newspapers try to build a visual style. They select\
    \ a set of fonts and apply them consistently over the years so that we will be\
    \ able to recognize our favorite magazine only by its typesetting options.\n\n\
    It gives comfort to the regular reader and helps differentiate from the competition.\
    \ For similar reasons, companies tend to enforce a corporate style with logos\
    \ and common letterheads.\n\nThe moral of this section, and the key to understanding\
    \ XML, is that the structure of a document is the foundation from which the appearance\
    \ is deduced. Although I have illustrated it with only a memo, this holds true\
    \ for all sorts of documents including technical documentation, books, letters,\
    \ emails, reports, magazines, Web pages, and more."
