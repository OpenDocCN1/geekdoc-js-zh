    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_29_1.png)


    Figure 1.2: A different appearance


    What is important to notice that the memo can look completely different and yet
    it still follows the same structure: The appearance has no impact on the structure.
    In other words, whether the subject, sender, and recipient'
  merge: -1
