  md: '# XSLFO


    CSS is a simple and efficient styling mechanism. However, it is limited to styling
    a document, it cannot reorganize or otherwise process them. CSS cannot build a
    table of contents or extract an index as XSLFO.


    # XSLT and CSS


    Nothing prevents from combining XSLT with CSS. Listing 6.5 shows how an XSLT style
    sheet can attach a CSS style sheet to a document and create a table of contents
    in XML. Figure 6.11 shows the result in


