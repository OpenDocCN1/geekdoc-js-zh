    Listing 11.1 is interesting because you can hardly tell it is a distributed system.
    The only lines that explicitly deal with networks are these two:

    ORB orb = ORB.init(args,null);

    Order remoteOrder = OrderHelper.bind(orb,order);


    and they are not very difficult. Without going into any details, they can connect
    to order the server. More interestingly, the application can manipulate the order,
    which is a server object, just as if it were a client object:

    remoteOrder.appendLine(product,quantity);

    remoteOrder.confirm();


    That''s the power of middleware; it completely hides the distributed aspect. Experience
    shows that middleware works better on LANs or intranets than on-enterprise applications.
    This is because, with middleware, the client directly manipulates objects on the
    server. This leads to a very tight coupling between the client and the server.
    It is therefore simpler if both parties are controlled by the same organization.


    > NOTE

    Middleware gurus are quick to point out that it doesn''t have to be that way.
    There are several mechanisms, including dynamic invocation, that support very
    flexible coupling with middleware.

    While it is technically correct, in practice, experience shows that most solutions
    based on middleware are relatively inflexible and are therefore best suited for
    internal use.


    # Common Format


    For applications that work across several organizations, it is easier to exchange
    documents in a common format. This is how the Web works: A Web server requests
    HTMLL documents from a Web browser. This process has proved to scale well to millions
    of users.'
