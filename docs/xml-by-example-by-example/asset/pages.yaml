  md: '# 312 Chapter 10: Modeling for Flexibility


    This simple example shows some of the benefits of maintaining the phone list in
    XML:


    +   - The same document can be reused in different contexts; in this case, internal
    and external phone lists are produced with minimal effort.

    - It is easy to change the presentation—just update the style sheet.

    - Although not illustrated in the example, it is easy to maintain the list using
    an off-the-shelf XML editor.

    - As the list grows and special needs arise, it is possible to write specialized
    software (using DOM or SAX) to further manipulate the list.

    - If the list grows dramatically, it is possible to move to an XML data-base for
    better performance.


    In other words, XML offers a high-quality off-the-shelf software application that
    you can use to solve a problem quickly and inexpensively.


    The phone list is perfect example of an application that does not need XML extensibility.
    The application is built around a specific DTD and the structure is not expected
    to change much for the life of the application.


    The phone list is typical of most XML applications. To work, it greatly limits
    its XML flexibility: A DTD is defined and data is made to fit it. It would not
    make sense for somebody to extend the list in any way.


    # Building on XML Extensibility


    +   1. Some applications need a more flexible solution than used in the previous
    example. In particular, it might be impossible (or very difficult) to create one
    DTD for all the data. This is particularly true when several organizations exchange
    information.


    Let''s review the price comparison application from Chapter 8, “Alternative API:
    SAX.” You will remember that the application finds the best price in an XML document
    such as the one shown in Listing 10.4.


    Listing 10.4: A Price List in XML


    ```

    <xml version="1.0?>

    <product><name>XML Training</name><vendor><name>Playfield Training</name><price
    delivery="5">999.00</price><price delivery="15">899.00</price></vendor></product>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_329_0.png)'
