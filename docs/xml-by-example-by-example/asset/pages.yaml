  md: '# Glossary


    API—Application Programming Interface.


    attribute—A name/value pair attached to an element.


    CORBA—Common Object Request Broker Architecture, an object-oriented middleware.


    CSS—Cascading Style Sheet, a style sheet language originally developed for HTML.
    See also XSL.


    DCD—Document Content Description, a proposed replacement for DTD. See also DDML,
    DTD, SOX, XML-Data, and X-Schema.


    DDML—Document Definition Markup Language, a proposed replacement for DTD. See
    also DCD, DTD, SOX, XML-Data, and X-Schema.


    document—Unit of control in XML.


    DOM—Document Object Model, an API for XML. See also SAX.


    DTD—Document Type Definition, the model of an XML document. See also DCD, DDML,
    SOX, XML-Data, and X-Schema.


    EDI—Electronic Data Interchange, a technology used to electronically exchange
    business documents such as invoices and orders.


    element—Logical unit of information in XML.


    entity—Physical unit of storage in XML.


    HTML—Hypertext Markup Language, the format of Web pages.


    HTTP—Hypertext Transport Protocol, the protocol spoken by Web servers and browsers.


    ISO—International Standards Organization, an official organization that publishes
    standards.


    markup—Structural information or formatting instructions added to the content
    of an electronic document.


    middleware—Technology that simplifies the building of applications.


    namespace—A mechanism used to identify the owner of XML elements. The namespace
    enables XML to combine elements from different sources.'
  merge: -1
  pgno: 502
- img_proc: true
  md: '# Glossary


    **notation**—Format of an external entity in XML.


    **parser**—Software library in charge of reading and writing XML documents.


    **PI**—Processing Instruction, a mechanism for including non-XML instructions
    in an XML document.


    **RDF**—Resource Description Framework, a proposed W3C recommendation to carry
    metadata.


    **SAX**—Simple API for XML. See also *DOM*.


    **SGML**—Standard Generalized Markup Language, the ancestor of both HTML and XML.


    **SOX**—Schema for object-oriented XML, a proposed replacement for DTD. See also
    *DCD, DDML, DTD, XML-Data*, and *X-Schema*.


    **tag**—Element of markup in XML-Data.


    **URL**—Uniform Resource Locator, the address of a resource on the Web.


    **W3C**—World Wide Web Consortium, the body in charge of Web standards.


    **XLink**—A mechanism for establishing links in XML documents.


    **XML**—extensible Markup Language, a new markup language published by the W3C
    to address the limitations of HTML.


    **XML-Data**—A proposed replacement for DTD. See also *DCD, DDML, DTD, SOX*, and
    *X-Schema*.


    **XQL**—XML Query Language, a proposed language for extracting data from XML documents.


    **XSL**—XML Stylesheet Language, a style sheet language developed specifically
    for XML. See also *CSS*.


    **X-Schema**—A generic name for proposed replacement of the DTD. See also *DCD,
    DDML, DTD, SOX*, and *XML-Data*.'
