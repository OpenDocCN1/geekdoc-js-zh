  md: '# XSL


    XSL, the W3C recommendation, is organized into two parts: XLST, short for XSL
    Transformation, and XSLFO, short for XSL Formatting Objects. This chapter concentrates
    on XLST. The next chapter discusses CSS and XSLFO. As we will see, CSS and XSLFO
    are very similar in scope.


    # NOTE


    The similarity between CSS and XSLFO has led to some controversy. Given they are
    similar, are they not redundant? If CSS is already in use, why bother with the
    more complex XSL?


    It turns out we need both because XSL is more powerful than CSS. In particular,
    there is no equivalent for XLST, the transformation part of XSL, in CSS.


    In practice, most implementations of XSL today support only XSL. For the time
    being, the consensus in the industry seems to be that XSL is useful but CSS is
    preferred to XSL.


    # CAUTION


    At the time of this writing, the XSL recommendation was not formally adopted.
    The content of this chapter is based on a Working Draft dated 21 April 1999 (www.w3.org/TR/1999/xslt-19990421.html).
    It has been updated as changes to XSL were released.

    The draft will be revised and enhanced. A situation that is particularly frustrating
    for an author. It is likely that, by the time you read this book, some changes
    will be introduced that are incompatible with the examples published in this chapter.
    I invite you to check the Macmillan Web site at www.mcp.com where I will post
    updates to this chapter.


    # LotusXSL


    To run examples in this chapter, you need an XSL processor. An XSL processor is
    simply a software component that implements the XSL standard.


    There are several XSL processors on the market including those from Microsoft
    (www.microsoft.com) and Lotus (www.alpheworks.ibm.com). James Clark, the editor
    of the XSL standard, also has released an XSL processor (www.jclark.com).


    In this chapter, we''ll use LotusXSL (version 0.191), which is available at no
    charge from www.alpheworks.ibm.com. Like most XSL tools, LotusXSL is written in
    Java. Although you don''t have to program in Java to use it, you must install
    either a Java Runtime Environment (JRE) or a Java Development Kit (JDK) on your
    computer. You can download a Java environment from Sun at java.sun.com.'
