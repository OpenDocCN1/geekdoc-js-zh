  md: '# Chapter 11: N-Tiered Architecture and XML


    HTML is a good format but it is intended for human consumption only. XML, as you
    have seen, is similar but can be manipulated by applications. XCommerce illustrates
    how it works (see Figure 11.5).


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_375_0.png)


    Figure 11.5: The web mall, XCommerce


    As you can see, this is an n-tiered application: The client converses with the
    mall server. The mall server converses with the XML data server. The data server
    itself may be connected to a database server.


    XML has many strong points for this setup:

    * XML is extensible, which allows the different parties to build on commonalities
    while retaining the option to extend the basic services where appropriate.

    * XML is structure-rich, which allows the middle server to process product information
    (such as extracting prices).

    * XML is versatile, therefore most data in the application are stored in XML.
    In particular, XML is used for configuration information (the list of merchants),
    for product information, and to store the orders- themselves.

    * XML scales well. Small merchants can prepare product lists manually with an
    editor while larger merchants can generate the list from a database.

    * As a secondary benefit of scalability, XML gives the merchants lots of flexibility
    in deploying their solutions. A merchant can start with a simple solution and
    upgrade as the business expands.

    * XML is based on the Web; therefore, it is often possible to reuse HTML investments.'
