    # Notation


    Because the XML processor cannot process unparsed entities, it needs a mechanism
    to associate them with the proper tool. In the case of an image, it could be an
    image viewer.


    Notation is simply a mechanism to declare the type of unparsed entities and associate
    them, with an identifier, with an application.


    ```

    <!NOTATION GIF89A "//CompuServe//NOTATION Graphics"

    → Interchange Format 89a/EN "c:\windows\kodakprv.exe"

    ```


