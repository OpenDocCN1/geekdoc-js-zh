  md: '# # Putting It All Together:

    An e-Commerce Example


    This chapter contains the commented source code for XCommerce. In this chapter,
    you learn


    +   - how to use XML in a medium-sized application

    - how XSL and DOM make it easy to build sophisticated applications

    - how to build and install a complete application


    # Building XCommerce


    > CAUTION

    This example relies heavily on XSL. XSL was not final at the time of this writing.
    It is it likely that the proposed standard will have changed by the time you read
    this book. Some of these changes may create incompatibilities. If you experience
    problems running this example, I invite you to check www.quecorp.com/series/by_example/
    for an update.


    This section explains how to build and compile the application and where to copy
    the various files.


    # Classpath


    XCommerce uses several libraries in addition to its own classes. Therefore, you
    need to be sure all the pieces are included; otherwise, it won''t run. Specifically,
    you will need the following libraries:


    +   - XML for Java, the XML parser from IBM or another DOM parser. You download
    XSL for Java from www.alphaworks.ibm.com.

    - LotusXSL, the XSL processor or another XSL processor. You download LotusXSL
    from www.alphaworks.ibm.com.

    - Jetty or another servlet engine. You download Jetty from www.jettybay.com.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Chapter 12: Putting It All Together: An e-Commerce Example


    +   - a JDBC-compliant database. Under Windows, the easiest solution is to use
    an ODBC database. JDBC is Java API to interface with a data-base. It is similar
    to ODBC and indeed, ODBC databases are also JDBC-compliant.


    You need to tell the Java environment where to find these files. As explained
    in Appendix A, this is done through the classpath. The classpath looks like


    ```

    -classpath c:\jettylib\javax.servlet.jar;

    - c:\lotusxs\lotusxml.jar;c:\xml4j\xml4j.jar;

    ```


    Obviously, you have to adapt these paths to your machine.


    # Configuration File


    In order to set up the XCommerce configuration files, you need a servlet engine;
    see Appendix A.


    You also need to define properties similar to those in Listings 12.1, 12.2, 12.3,
    and 12.4. These listings show Jetty configuration files. Even though other servlet
    engines use different formats for configuration, the same properties must be defined.


    Listing 12.1: jetty.prp


    ```

