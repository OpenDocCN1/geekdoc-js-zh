    As you can see, it''s important to take error messages with a pinch of salt.


    # XSLT Common Errors


    When writing XSLT style sheets, it is very common to forget to close HTML elements.
    However, in XML, a P element must have an opening and a closing tag.


    The following line is guaranteed to confuse the parser:


    ```

    <xsl:match="p*">

    <P><xsl:apply-templates/>

    </xsl:template>

    ```


    ![](img/01a2244e52d95a9cd8321ab87f3ba2eb_237_0.png)


    Fortunately, the error message ("</P>") expected is clear.

    Similarly, <BR> is an empty tag. In XML, empty tags have the format

    BR/>. Again, the error message ("</BR>") expected is useful to pinpoint the problem.


    # DOM and Java


    DOM is not limited to browsers. Nor is it limited to JavaScript. DOM is a multiplatform,
    multililingual interface.


    # DOM and IDL


    There are versions of DOM for JavaScript, Java, and C++. In fact, there are versions
    of DOM for most languages because the W3C adopted a clever trick: it specified
    DOM using the OMG IDL.


    The OMG IDL is a specification language for object interfaces. It is used to describe
    what an object does but methods and properties it has. IDL, which stands for Interface
    Definition Language, was published by the OMG, the Object Management Group.


    The good thing about IDL is that it has been mapped to many-oriented programming
    languages. There are mappings of IDL for Java, C++, Smalltalk, Ada, and even Cobol.
    By writing the DOM recommendation in IDL, the W3C benefits from this cross-language
    support. Essentially, DOM is available in all these languages.'
